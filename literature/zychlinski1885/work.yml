account_en: >-
  Two pages of Teodor Żychliński's genealogy of the Polish nobility, from his
  account of the Prusimski family, who wrote themselves Ostroróg. They give
  the line that held Trąbczyn, generation by generation: Krzysztof, lord of
  Kolno, Kamionna and Trąbczyn, his four sons and three daughters; his son
  Stefan; Stefan's only son Antoni, the Starost of Nieszczewice, and his wife
  Maryanna Dąmbska; and their only daughter Michalina, who married first
  Józef Dąmbski and then Stanisław Miączyński, and brought him Trąbczyn,
  "which her grandson, Count Władysław Miączyński, holds today". Above them
  stand two earlier generations, to Paweł Apollo the chamberlain. Żychliński
  wrote from the court books he cites and from what the families told him;
account_de: >-
  Zwei Seiten aus Teodor Żychlińskis Genealogie des polnischen Adels, aus
  seiner Darstellung der Familie Prusimski, die sich Ostroróg schrieb. Sie
  geben die Linie, der Trąbczyn gehörte, Generation für Generation: Krzysztof,
  Herr von Kolno, Kamionna und Trąbczyn, seine vier Söhne und drei Töchter;
  seinen Sohn Stefan; Stefans einzigen Sohn Antoni, den Starosten von
  Nieszczewice, und dessen Frau Maryanna Dąmbska; und ihre einzige Tochter
  Michalina, die zuerst Józef Dąmbski und dann Stanisław Miączyński
  heiratete und ihm Trąbczyn zubrachte, „das heute ihr Enkel, Graf
  Władysław Miączyński, besitzt“. Darüber stehen zwei frühere Generationen,
  bis zu Paweł Apollo, dem Kammerherrn. Żychliński schrieb nach den
  Gerichtsbüchern, die er anführt, und nach den Auskünften der Familien.

# The card's own short rendering of the account (the list pages, 2026-10-29); the account stays whole on the item's page.
brief_en: >-
  Two pages of Żychliński's genealogy of the Prusimski Ostroróg in the Golden
  Book's seventh year: the line that held Trąbczyn, from Krzysztof, lord of
  Kolno, Kamionna and Trąbczyn, to the Starost Antoni and his only daughter
  Michalina, who brought Trąbczyn to the Miączyńskis; worked from the court
  books and the families' own word.
brief_de: >-
  Zwei Seiten aus Żychlińskis Genealogie der Prusimski-Ostroróg im siebten
  Jahrgang der Goldenen Buches: die Linie, der Trąbczyn gehörte, von
  Krzysztof, dem Herrn von Kolno, Kamionna und Trąbczyn, bis zum Starosten
  Antoni und seiner einzigen Tochter Michalina, die Trąbczyn zu den
  Miączyńskis brachte; gearbeitet aus den Gerichtsbüchern und dem Wort der
  Familien.

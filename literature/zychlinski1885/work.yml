account_en: >-
  Two pages of Teodor Żychliński's genealogy of the Polish nobility, from his
  account of the Prusimski family, who wrote themselves Ostroróg. They give
  the line that held Trąbczyn: Krzysztof, lord of Kolno, Kamionna and
  Trąbczyn, with his four sons and three daughters; his son Stefan; Stefan's
  only son Antoni, the Starost of Nieszczewice, and his wife Maryanna Dąmbska;
  and their only daughter Michalina, who married first Józef Dąmbski and then
  Stanisław Miączyński and brought him Trąbczyn, "which her grandson, Count
  Władysław Miączyński, holds today". Above them stand two earlier
  generations, back to Paweł Apollo the chamberlain. Żychliński wrote from the
  court books he cites and from what the families told him.
account_de: >-
  Zwei Seiten aus Teodor Żychlińskis Genealogie des polnischen Adels, aus
  seiner Darstellung der Familie Prusimski, die sich Ostroróg schrieb. Sie
  geben die Linie, die Trąbczyn besaß: Krzysztof, Herr auf Kolno, Kamionna und
  Trąbczyn, mit seinen vier Söhnen und drei Töchtern; seinen Sohn Stefan;
  Stefans einzigen Sohn Antoni, den Starosten von Nieszczewice, und seine Frau
  Maryanna Dąmbska; und ihre einzige Tochter Michalina, die zuerst Józef
  Dąmbski und dann Stanisław Miączyński heiratete und ihm Trąbczyn zubrachte,
  „das heute ihr Enkel, Graf Władysław Miączyński, besitzt“. Darüber stehen
  zwei frühere Generationen, bis zu Paweł Apollo, dem Kämmerer. Żychliński
  schrieb aus den Gerichtsbüchern, die er anführt, und nach den Auskünften der
  Familien.


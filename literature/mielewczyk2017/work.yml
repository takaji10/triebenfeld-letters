account_en: >-
  Wojciech Mielewczyk, a curator of the National Museum of Agriculture at
  Szreniawa, traces the changes in the Polish countryside from the
  mid-nineteenth century to the mid-twentieth on the large-scale village maps
  of the museum's archive. He follows the enfranchisement and separation of
  land in the Prussian partition and the Settlement Commission's parcellation
  from 1886, the ukase of 1864 and the consolidation of plots in the Russian
  partition, the parcellation of the great estates and the colonies founded on
  them, and the land reform of the Second Republic. Fourteen maps are shown in
  fragments, among them the map of the Trąbczyn estates of 1861 (fig. 4) with
  the field of the enfranchised peasants, and page 48 names Kolonia Łazińskie
  and Kolonia Huta on the parcelled estate. The English title and summary on
  page 57 are the author's.
account_de: >-
  Wojciech Mielewczyk, Kurator am Nationalmuseum für Landwirtschaft in
  Szreniawa, verfolgt die Veränderungen des polnischen Dorfes von der Mitte
  des 19. bis zur Mitte des 20. Jahrhunderts auf den großmaßstäblichen
  Dorfkarten des Museumsarchivs. Er behandelt die Regulierung und Separation
  in der preußischen Teilung und die Parzellierung der Ansiedlungskommission
  seit 1886, den Ukas von 1864 und die Zusammenlegung der Parzellen in der
  russischen Teilung, die Parzellierung der Großgüter und die auf ihnen
  gegründeten Kolonien und die Landreform der Zweiten Republik. Vierzehn
  Karten sind in Ausschnitten gezeigt, darunter die Karte der Güter von
  Trąbczyn von 1861 (Abb. 4) mit dem Feld der regulierten Bauern, und Seite 48
  nennt Kolonia Łazińskie und Kolonia Huta auf dem parzellierten Gut. Der
  englische Titel und die Zusammenfassung auf Seite 57 sind die des
  Verfassers.


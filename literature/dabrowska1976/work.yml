account_en: >-
  Three entries of Yad Vashem's encyclopedia of the Jewish communities of
  Poland, in English translations made for JewishGen: Zagórów, Pyzdry and
  Konin, the three towns nearest the edition's estates. Each gives the Jewish
  population from the late eighteenth century to 1939, the community's
  history, trades and institutions, the years between the wars and the
  Holocaust, when the Jews of the district were driven in 1940 into the
  ghettos of Zagórów, Grodziec and Rzgów and murdered in the forests near
  Kazimierz Biskupi in 1941. The Encyclopedia of Camps and Ghettos (2012)
  cites them. Under copyright: the site gives a detailed summary. Where the
  entries differ from the edition's documents (the year Zagórów became a
  town) the edition follows the documents.

summary_en: >-
  The 38 entries of the Słownik geograficzny Królestwa Polskiego that the gazetteer cites, each under its heading with its volume and page. Each carries the dictionary's own wording: the settlement's status, its administrative
  seat, its distance from the market town, its houses and inhabitants, the
  dated forms of its name, and the etymological note where the dictionary
  gives one. The English beside each entry summarises it; it is not a translation.
summary_de: >-

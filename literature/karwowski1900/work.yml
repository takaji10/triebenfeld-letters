account_en: >-
  Stanisław Karwowski, the Poznań historian, on the convent of the Cistercian
  nuns at Ołobok in Great Poland, from its foundation towards the end of the
  twelfth century to the winding-up of the house: its endowments and
  privileges, its lawsuits over bounds and dues, the nuns and their
  government, and its buildings and churches. Only page 87 is given, on money
  the nuns had lent and lost. Prince Hohenlohe-Ingelfingen had burdened the
  town of Zagórów and its estates with debts of 2,000,000 Polish gulden, and
  Ignacy Trzciński bought them with those debts in 1812. On 1 September 1827
  they went at auction for 1,000,000 Polish gulden to Karol Bogumił Weygel, a
  banker of Wrocław, who saved 56,879 of the 120,000 he had lent on them and
  lost the rest, as did all the other mortgage creditors. The nuns' 40,000
  Polish gulden were lost with the interest owing since 1806, as Minister
  Sobolewski told the Prussian government from Warsaw on 23 October 1828.
account_de: >-
  Stanisław Karwowski, der Posener Historiker, über das Kloster der
  Zisterzienserinnen in Ołobok in Großpolen, von seiner Gründung gegen Ende
  des zwölften Jahrhunderts bis zur Auflösung des Hauses: seine Ausstattung
  und Privilegien, seine Prozesse um Grenzen und Abgaben, die Nonnen und ihre
  Leitung, seine Bauten und Kirchen. Wiedergegeben ist nur Seite 87, über
  Geld, das die Nonnen verliehen und verloren hatten. Fürst
  Hohenlohe-Ingelfingen hatte die Stadt Zagórów und ihre Güter mit 2.000.000
  polnischen Gulden Schulden belastet, und Ignacy Trzciński kaufte sie 1812
  mit diesen Schulden. Am 1. September 1827 gingen sie in der Versteigerung
  für 1.000.000 polnische Gulden an Karol Bogumił Weygel, einen Breslauer
  Bankier, der von den 120.000, die er darauf geliehen hatte, 56.879 rettete
  und den Rest verlor, wie alle übrigen Hypothekengläubiger. Die 40.000
  polnischen Gulden der Nonnen gingen mit den seit 1806 geschuldeten Zinsen
  verloren, wie Minister Sobolewski am 23. Oktober 1828 aus Warschau der
  preußischen Regierung mitteilte.


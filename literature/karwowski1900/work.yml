brief_en: >-
  A history of the Cistercian nuns' convent at Ołobok by the Poznań historian
  Karwowski, brought in for page 87 alone: on the money the nuns had lent,
  lost when the town of Zagórów and its estates — bought in 1812 with
  Hohenlohe's debts resting on them — went under the auction hammer in 1827,
  taking the nuns' 40,000 Polish gulden, interest owing since 1806, down with
  them.
brief_de: >-
  Eine Geschichte des Klosters der Zisterzienserinnen in Ołobok von dem
  Posener Historiker Karwowski, aufgenommen mit Seite 87 allein: über das
  geliehene Geld, das die Nonnen verloren, als die Stadt Zagórów mit ihren
  Gütern — 1812 mit den Schulden Hohenlohes darauf gekauft — 1827 bei der
  Versteigerung unter den Hammer kam und dabei die 40.000 polnischen Gulden
  der Nonnen samt den seit 1806 rückständigen Zinsen mitnahm.

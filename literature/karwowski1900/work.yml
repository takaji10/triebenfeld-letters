account_en: >-
  A history of the convent of the Cistercian nuns at Ołobok, in Great Poland,
  by the Poznań historian Stanisław Karwowski: its foundation towards the end
  of the twelfth century and its endowments (the article runs pp. 1-114, with
  its own table of contents), the privileges and donations from the twelfth
  century on, the lawsuits over its bounds and its dues, the nuns and the
  convent's inner government, its fortunes from the third partition to the
  winding-up of the house, and its buildings and churches. Only p. 87 is
  brought in, the two paragraphs the editor named, on the loss of the money
  the nuns had lent: the town of Zagórów and its estates, which the previous
  owner, Prince Hohenlohe-Ingelfingen, had burdened with debts of 2,000,000
  Polish gulden, bought in 1812 by Ignacy Trzciński with the debts resting on
  them, lost at auction on 1 September 1827 for 1,000,000 Polish gulden to
  Karol Bogumił Weygel, a banker of Wrocław, who saved 56,879 of the 120,000
  Polish gulden he had mortgaged on the estates and went down with the rest,
  and after him all the other mortgage creditors; and the 40,000 Polish
  gulden of the Cistercian Nuns lost with the interest owing from 1806, of
  which minister Sobolewski informed the Prussian government from Warsaw on
  23 October 1828.
account_de: >-
  Eine Geschichte des Klosters der Zisterzienserinnen in Ołobok in
  Großpolen von dem Posener Historiker Stanisław Karwowski: seine Gründung
  gegen Ende des 12. Jahrhunderts und seine Ausstattung (der Aufsatz zählt
  114 Seiten mit eigenem Inhaltsverzeichnis), die Privilegien und
  Schenkungen vom 12. Jahrhundert an, die Prozesse um seine Grenzen und
  Abgaben, die Nonnen und die innere Verfassung des Klosters, seine
  Schicksale von der Dritten Teilung bis zur Aufhebung des Hauses und seine
  Gebäude und Kirchen. Nur S. 87 ist aufgenommen, die zwei vom Herausgeber
  genannten Absätze über den Verlust des geliehenen Geldes der Nonnen: die
  Stadt Zagórów mit ihren Gütern, die der frühere Besitzer, Fürst
  Hohenlohe-Ingelfingen, mit Schulden von 2.000.000 polnischen Gulden
  belastet hatte und die 1812 Ignacy Trzciński mit diesen Schulden kaufte,
  am 1. September 1827 bei öffentlicher Versteigerung für 1.000.000
  polnische Gulden an Karol Bogumił Weygel, einen Bankier in Breslau,
  verloren ging, der von den 120.000 polnischen Gulden, die er auf ihnen
  hypothekarisch hatte, nur 56.879 rettete und mit dem Rest unterging, und
  nach ihm alle übrigen Hypothekengläubiger; und die 40.000 polnischen
  Gulden der Zisterzienserinnen, verloren samt den seit 1806 rückständigen
  Zinsen, wovon Minister Sobolewski die preußische Regierung am 23. Oktober
  1828 aus Warschau benachrichtigte.


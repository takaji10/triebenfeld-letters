account_en: >-
  A study by the historian Zbigniew Chodyła, a specialist in Olęder
  settlement in Greater Poland, of the 58 Olęder settlements founded in the
  Pyzdry Forest, between the Warta, the Prosna and the Powa, from 1746 to
  1793: when, by whom and on what terms each was founded, its land and
  layout, its hearths and population in 1789-1791 (three tables), the
  Olęders' law, self-government, dues, farming, religion and daily life. It
  rests chiefly on the municipal court books of Pyzdry, Konin and Kalisz and
  Albert Breyer's papers in the State Archive in Poznań, the tax tables of
  1789-1791 and the visitation of the deanery of Konin of 1790-1791, with
  full notes, and shows 25 illustrations, among them maps and the founding
  charters. It puts the oldest of these settlements, the Trąbczyńskie Stare
  Olędry and the Luśnie Olędry, in 1746, founded by Paweł and Katarzyna
  Prusimski on the Trąbczyn estate, from the boundary decree recorded in
  1776 (the edition's Konin Gr. 145), and traces Łazy, the Trąbczyńskie
  Nowe Olędry and the later colonies of the estate. Published by the local
  tourist organisation with two forewords, for a regional readership; some
  of its figures are the author's estimates, marked in square brackets.
account_de: >-
  Eine Studie des Historikers Zbigniew Chodyła, eines Kenners der
  Olęder-Siedlung in Großpolen, über die 58 Olęder-Siedlungen, die von 1746
  bis 1793 in der Pyzdry-Heide (Puszcza Pyzdrska) zwischen Warthe, Prosna und
  Powa gegründet wurden: wann, von wem und zu welchen Bedingungen jede
  entstand, ihr Land und ihre Anlage, ihre Herdstellen und Einwohner 1789-1791
  (drei Tabellen), das Recht der Olęder, ihre Selbstverwaltung, Abgaben,
  Landwirtschaft, Religion und ihr Alltag. Sie stützt sich vor allem auf die
  Grodbücher von Pyzdry, Konin und Kalisch und den Nachlass Albert Breyers im
  Staatsarchiv Posen, die Steuertabellen von 1789-1791 und die Visitation des
  Dekanats Konin von 1790-1791, mit vollständigen Anmerkungen, und zeigt 25
  Abbildungen, darunter Karten und Gründungsprivilegien. Die ältesten dieser
  Siedlungen, die Trąbczyńskie Stare Olędry und die Luśnie Olędry, setzt sie
  in das Jahr 1746, gegründet von Paweł und Katarzyna Prusimski auf dem Gut
  Trąbczyn, nach dem 1776 eingetragenen Grenzdekret (Konin Gr. 145 der
  Edition), und sie verfolgt Łazy, die Trąbczyńskie Nowe Olędry und die
  späteren Kolonien des Guts. Herausgegeben von der örtlichen
  Tourismusorganisation mit zwei Vorworten für eine regionale Leserschaft;
  manche Zahlen sind Schätzungen des Verfassers, in eckigen Klammern.

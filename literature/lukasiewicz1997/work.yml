account_en: >-
  A source study of the "Black Register", the list of the estates of Great
  Poland given away by Prussia in 1796-1797 to Prussian officers, officials
  and junkers, by Dariusz Łukasiewicz of Poznań (Kwartalnik Historyczny
  1997). The register is printed in the Materialien (1861, pp. 140-171) and
  was first published by Zerboni (1801) and Cölln (1807); Łukasiewicz found
  the manuscript itself in the Secret State Archive (GStAPK, I HA Rep. 7c
  Südpreußen Nr 14) and read it against three other, official lists. His
  findings: the register counts not 52 donataries but 48, holding 52
  donations and 245 estates, and the "true value" of 20 million thalers on
  its title page is false – the nominal values come to 2 069 550 thalers,
  the values from the tax returns to 4-7 million, nearer 4. The giveaway
  turned into a corrupt affair: Hoym's circle bought at a third of the
  value, resold at three and four times the purchase price (Triebenfeld's
  own purchase at 50 000, sold 1801 at 400 000-750 000); the register's
  owners sold to Poles despite the rescripts forbidding it; the affairs of
  Held, Zerboni, Cölln and the arrests of 1796-1797 followed. Four appendix
  tables set every donation's values and sale prices by donatary. It cites works that also stand on the Literature page (Wąsicki, the Materialien,
  the Neue Feuerbrände, Grünhagen, Philippson) and bears directly on the
  black-register passages and the Prince's gift.
account_de: >-
  Eine quellenkritische Untersuchung des „Schwarzen Registers", der Liste der
  Güter Großpolens, die Preußen 1796-1797 an preußische Offiziere, Beamte und
  Junker verschenkte, von Dariusz Łukasiewicz aus Posen (Kwartalnik
  Historyczny 1997). Das Register ist in den Materialien (1861, S. 140-171)
  abgedruckt und zuerst von Zerboni (1801) und Cölln (1807) veröffentlicht
  worden; Łukasiewicz fand die Handschrift selbst im Geheimen Staatsarchiv
  (GStAPK, I HA Rep. 7c Südpreußen Nr 14) und las sie gegen drei weitere,
  amtliche Listen aus. Seine Befunde: Das Register zählt nicht 52 Donatarien,
  sondern 48, mit 52 Donationen und 245 Gütern, und der „wahre Wert" von 20
  Millionen Talern auf dem Titelblatt ist falsch – die Nennwerte ergeben 2
  069 550 Taler, die Werte aus den Steuerlisten 4-7 Millionen, näher bei 4.
  Die Schenkaktion wurde zu einer Korruptionsaffäre: Hoym's Kreis kaufte für
  ein Drittel des Werts und verkaufte mit dem drei- bis vierfachen
  Kaufpreis weiter (Triebenfelds eigener Kauf für 50 000, verkauft 1801 für
  400 000-750 000); die Registerbesitzer verkauften an Polen, trotz der
  verbietenden Reskripte; die Affären von Held, Zerboni und Cölln und die
  Verhaftungen von 1796-1797 folgten. Vier Anhangstabellen stellen die Werte
  und Verkaufspreise jeder Donation nach Donatar zusammen. Er zitiert Werke, die auch auf der Literaturseite stehen (Wąsicki, die Materialien,
  die Neue Feuerbrände, Grünhagen, Philippson) und geht die Passagen zum
  schwarzen Register und die Schenkung des Fürsten direkt an.

# The card's own short rendering of the account (the list pages, 2026-10-29); the account stays whole on the item's page.
brief_en: >-
  Dariusz Łukasiewicz's source study of the "black register", the list of the
  estates of Great Poland that Prussia gave away in 1796-1797: read from the
  manuscript itself against three official lists, it counts forty-eight
  donataries rather than fifty-two, shows the values falsified, and follows
  the resale of the gifts – Triebenfeld's own purchase at 50,000 and its
  resale in 1801 at several times the price.
brief_de: >-
  Dariusz Łukasiewicz' quellenkritische Untersuchung des „schwarzen
  Registers", der Liste der Güter Großpolens, die Preußen 1796-1797
  verschenkte: aus der Handschrift selbst gegen drei amtliche Listen gelesen,
  zählt sie achtundvierzig Donatarien statt zweiundfünfzig, zeigt die Werte
  gefälscht und verfolgt den Weiterverkauf der Geschenke – Triebenfelds
  eigenen Kauf für 50.000 und sein Wiederverkaufen 1801 um ein Mehrfaches des
  Preises.

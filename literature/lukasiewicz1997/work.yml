account_en: >-
  Dariusz Łukasiewicz of Poznań on the "black register", the list of the
  estates of Great Poland that Prussia gave away in 1796-1797 to its officers,
  officials and junkers. He found the manuscript itself in the Secret State
  Archive in Berlin and read it against three official lists. The register
  counts 48 donataries, not 52, holding 52 donations and 245 estates, and the
  "true value" of 20 million thalers on its title page is false: the nominal
  values come to 2,069,550 thalers, those of the tax returns to between 4 and
  7 million. Hoym's circle bought at a third of the value and resold at three
  and four times the price; Triebenfeld bought for 50,000 and sold in 1801 for
  400,000 to 750,000. Four appendix tables give every donation's values and
  prices.
account_de: >-
  Dariusz Łukasiewicz aus Posen über das „schwarze Register“, die Liste der
  Güter Großpolens, die Preußen 1796-1797 an seine Offiziere, Beamten und
  Junker verschenkte. Er fand die Handschrift selbst im Geheimen Staatsarchiv
  in Berlin und las sie gegen drei amtliche Listen. Das Register zählt 48
  Donatare, nicht 52, mit 52 Schenkungen und 245 Gütern, und der „wahre Wert“
  von 20 Millionen Talern auf seinem Titelblatt ist falsch: Die Nennwerte
  ergeben 2.069.550 Taler, die der Steuererklärungen zwischen 4 und 7
  Millionen. Hoyms Kreis kaufte zu einem Drittel des Werts und verkaufte zum
  Drei- und Vierfachen weiter; Triebenfeld kaufte für 50.000 und verkaufte
  1801 für 400.000 bis 750.000. Vier Tabellen im Anhang geben die Werte und
  Preise jeder Schenkung.


account_en: >-
  A pamphlet printed in 1801 without the author's name or place, later called
  the "black book", in which the Prussian official Hans von Held attacked two
  ministers: Karl Georg von Hoym, who governed Silesia and South Prussia, and
  the Grand Chancellor Heinrich Julius von Goldbeck. Its matter is the case of
  the bailiff Früson, who was made to give up his lease of the lordship of
  Krotoszyn by a settlement that, Held says, Triebenfeld and Neumann forced on
  him, and who sued for it in vain for years. It prints the letters and court
  papers of the case with Held's commentary. Triebenfeld, then a war
  councillor at Krotoszyn, is named on some fifty pages.
account_de: >-
  Eine Flugschrift, 1801 ohne Namen des Verfassers und ohne Ort gedruckt,
  später das „schwarze Buch“ genannt, in der der preußische Beamte Hans von
  Held zwei Minister angriff: Karl Georg von Hoym, der Schlesien und
  Südpreußen verwaltete, und den Großkanzler Heinrich Julius von Goldbeck. Ihr
  Gegenstand ist der Fall des Amtmanns Früson, der seine Pacht der Herrschaft
  Krotoszyn durch einen Vergleich aufgeben musste, den ihm, nach Held,
  Triebenfeld und Neumann aufzwangen, und der jahrelang vergeblich klagte. Sie
  druckt die Briefe und Gerichtspapiere des Falls mit Helds Kommentar.
  Triebenfeld, damals Kriegsrat in Krotoszyn, wird auf etwa fünfzig Seiten
  genannt.


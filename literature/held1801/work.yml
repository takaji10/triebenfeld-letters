brief_en: >-
  Hans von Held's pamphlet of 1801 against two Prussian ministers, later
  called the "black book", whose matter is the lawsuit of the bailiff Früson
  over the lease of Krotoszyn, forced on him — so Held — by a settlement
  Triebenfeld helped bring about; the man is named on some fifty pages, an
  accusation to be held against the documents.
brief_de: >-
  Hans von Helds Streitschrift von 1801 gegen zwei preußische Minister, später
  das „schwarze Buch" genannt, deren Gegenstand der Prozess des Oberamtmanns
  Früson um die Pacht von Krotoszyn ist, die ihm — so Held — durch einen
  Vergleich abgezwungen wurde, an dem Triebenfeld mitwirkte; der Name steht
  auf etwa fünfzig Seiten, eine Anklage, an den Dokumenten zu prüfen.

account_en: >-
  The page of Stanisław Adam Miączyński of Miączyn, arms Suchekomnaty
  (1780-1845), in Maria Jadwiga Minakowska's online genealogy Wielka
  genealogia Minakowskiej (sejm-wielki.pl), person 4.285.278, as saved on 22
  October 2026. The son of Kajetan Miączyński and Teresa née Rafałowicz, he
  was a captain of the army of the Duchy of Warsaw and Prince Poniatowski's
  adjutant, a member of the Sejm of 1830-31 and a colonel, and he is buried at
  Trąbczyn. The page gives his ancestors back to his great-grandparents and
  his marriage in Warsaw on 17 August 1810 to Michalina, the only daughter of
  Antoni Prusimski, with their four sons and their descendants, among them
  Włodzimierz, heir of Trąbczyn. The database is compiled from the printed
  armorials and biographies; dates marked "?" are its own estimates, and tags
  in brackets mark the province of an office.
account_de: >-
  Die Seite des Stanisław Adam Miączyński von Miączyn, Wappen Suchekomnaty
  (1780-1845), in Maria Jadwiga Minakowskas Online-Genealogie Wielka
  genealogia Minakowskiej (sejm-wielki.pl), Person 4.285.278, gespeichert am
  22. Oktober 2026. Der Sohn von Kajetan Miączyński und Teresa geb. Rafałowicz
  war Hauptmann der Armee des Herzogtums Warschau und Adjutant des Fürsten
  Poniatowski, Abgeordneter des Sejms von 1830-31 und Oberst; er ist in
  Trąbczyn begraben. Die Seite gibt seine Vorfahren bis zu den Urgroßeltern
  und seine Ehe, geschlossen in Warschau am 17. August 1810, mit Michalina,
  der einzigen Tochter Antoni Prusimskis, mit ihren vier Söhnen und deren
  Nachkommen, darunter Włodzimierz, dem Erben von Trąbczyn. Die Datenbank ist
  aus den gedruckten Wappenbüchern und Biographien gearbeitet; mit „?“
  bezeichnete Daten sind ihre Schätzungen, und Marken in Klammern bezeichnen
  die Wojewodschaft eines Amtes.


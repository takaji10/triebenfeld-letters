brief_en: >-
  Seven pages of Żychliński's genealogy of the counts Miączyński, from the
  marriage of Stanisław and the heiress of Trąbczyn in August 1809 to
  Włodzimierz's nephew Władysław, the heir: the division of the estates of
  1845, Trąbczyn's sale to Mieczysław and then to Włodzimierz, and the
  newspaper notices of Michalina's death of 1851 and Włodzimierz's of 1879 —
  the ownership line of the later eras in a secondary witness.
brief_de: >-
  Sieben Seiten aus Żychlińskis Genealogie der Grafen Miączyński, von der Ehe
  Stanisławs mit der Erbin von Trąbczyn im August 1809 bis zu Włodzimierz'
  Neffen Władysław, dem Erben: die Güterteilung von 1845, Trąbczyns Verkauf an
  Mieczysław und dann an Włodzimierz, und die Zeitungsnachrufe auf Michalinas
  Tod 1851 und Włodzimierz' Tod 1879 — die Besitzzeile der späteren Epochen in einem Sekundärzeugnis.

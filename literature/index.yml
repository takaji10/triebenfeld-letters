    Zagórowskich: "no: the Zagórowskie Olędry, that is Stara Huta (Huta Łukomska), named after the parish of Zagórów; not Zagórów itself (Chodyła 2015)"
    Zagórowskie: "no: the Zagórowskie Olędry, that is Stara Huta (Huta Łukomska), named after the parish of Zagórów; not Zagórów itself (Chodyła 2015)"
    # Karwowski (1900) declines the name lowercase: "przy dobrach zagórskich"
    # (p. 87), the Zagórów estates, named in the same sentence as
    # "Zagórowie" — not the ruled-out Olędry above.
    zagórskich: yes
    # Kneifel (1964) writes the name with the German umlaut for the first
    # vowel: the town (p. 92, "die Städte Konin, Zagö-röw und Kolo" — the
    # hyphen the print's line break; pp. 112, 123, 226) and the parish and
    # its congregation (pp. 235, 256 "Zagorow").
    Zagörow: yes
    "Zagö-röw": yes
    # Werner (1904), p. 422: the German form without the horn, one of "die
    # Städte Peisern und Zagorowo" of the Hauländer country the parish lost
    # in 1817 - the town beside Peisern/Pyzdry.
    Zagorowo: yes
    # Kraus (2001) p. 42: "die Herrschaften Betsche, Zogorowo, Trobczyn,
    # Botkowo und Winiec weit unter Wert wieder verkauft" — the lordship
    # among those the prince sold; the print's own spelling, the o for the a.
    Zogorowo: yes

# Which hits of the edition's index in the literature stand.
#
# Read by pipeline/literature/literature_index.py, which finds every person
# and place of the edition (reference/people.yml, reference/places.yml) in
# the originals of the works shown on the site, and writes the hits that
# stand to corpus/literature/mentions.json and site/_data/literature_mentions.yml
# (the "In the literature" list of a person, or of an estate on the Places
# page). Every hit was read in review/literature/mentions.md (made by
# `literature_index.py --sheet`) before it was ruled here (Claude, 2026-10-19).
#
# people: / places:  entity -> spelling found -> ruling. A ruling is
#   yes                      the hit stands wherever this spelling is found;
#   "no: <reason>"           it stands nowhere;
#   {default: .., except: {"<work>/<passage>": reason}}
#                            the passages listed take the opposite of the default.
# A new spelling, or a new work, has no ruling and is left out until it is read
# (`literature_index.py --check` fails on it).
#
# patterns:  forms the books print that the edition's patterns miss, for the
#   literature only (the edition's own matching is not changed by them). Their
#   hits are ruled like the others below.
#
# Places that are not estates of the edition never show on the site (the list
# is shown for the estates of focus); their rulings keep mentions.json right for
# questions. Where a book's name is Claude's identification and not the book's
# own statement, the comment at its ruling says so, and whether the editor has
# accepted it (docs/NEEDS_CONFIRMATION.md lists any still open).

patterns:
  person:
    # Feuerbrände writes the Prince's name without the final e, and as an
    # adjective: "Hohenloh", "die Hohenloh'sche Armee", "die Hohenlohschen
    # Besitzungen" (3-132; Materialien p. 146 "Hohenloheschen").
    hohenlohe: 'Hohenlohe?''?i?sche\w*|Hohenloh(?![a-zà-ÿ''])'
    # Żychliński (1885, 1891) and the PSB give Stanisław Miączyński in forms the
    # edition's pattern leaves out: after "Stanisława **", "Stanisławem",
    # "Podpułkownika" and "kapitanowi". Each is Stanisław.
    miaczynski: '(?<=Stanisława \*\*)Miączyńskiego|(?<=Stanisławem )Miączyńskim|(?<=Podpułkownika )Miączyńskiego|(?<=kapitanowi )Miączyńskiemu'
    # Breyer (1935, "Gaue") calls the owner of Trąbczyn in 1746 "Paul von
    # Kolno-Prusiński".
    prusimski-pawel: '(?<=Kolno-)Prusiński'
  place:
    # The black register's list of the Prince's Konin estates: Materialien
    # p. 159 prints "Trombczyn", Feuerbrände 2-80 "Trobozyn" and "Szellewen".
    # Żychliński and Breyer print the adjective: "klucz Trąbczyński",
    # "majętność Trąmbczyńską" (and "Huta Trąbczyńska", a village of its own).
    trabczyn: 'Trombczyn|Trobozyn|Tr[ąa]m?bczyńsk\w*'
    # Żychliński and the PSB decline Kolno and Wieniec in Polish: "na Kolnie",
    # "Kolna", "z Kolnem"; "Wieńca", "na Wieńcu".
    kolno: 'Koln(?:ie|a|em)(?![a-zà-ÿ])'
    wieniec: 'Wieńc(?:a|u)(?![a-zà-ÿ])'
    szetlewek: 'Szellewen'
    # Feuerbrände 2-69 "Schwiegoszyn" (Materialien p. 145 "Swiegoszyn").
    swiechocin: 'Schwiegoszyn'
    # Materialien p. 145 "Löwin" (Feuerbrände 2-69 "Lowin"); the word is also a
    # lioness, so its ruling below names the one passage.
    lowyn: 'Löwin'
    # Held and Feuerbrände: Krotoczyn, Krotosczyn, Krotoscyner, Crotozcyn.
    krotoszyn: 'Crotozcyn\w*|Krotocz?yn\w*|Krotoscz?yn\w*'


# Which hits of the edition's index in the literature stand.
#
# Read by pipeline/literature/literature_index.py, which finds every person
# and place of the edition (reference/people.yml, reference/places.yml) in
# the originals of the works shown on the site, and writes the hits that
# stand to corpus/literature/mentions.json and site/_data/literature_mentions.yml
# (the "In the literature" list of a person, or of an estate on the Places
# page). Every hit was read in review/literature/mentions.md (made by
# `literature_index.py --sheet`) before it was ruled here (Claude, 2026-10-19).
#
# people: / places:  entity -> spelling found -> ruling. A ruling is
#   yes                      the hit stands wherever this spelling is found;
#   "no: <reason>"           it stands nowhere;
#   {default: .., except: {"<work>/<passage>": reason}}
#                            the passages listed take the opposite of the default.
# A new spelling, or a new work, has no ruling and is left out until it is read
# (`literature_index.py --check` fails on it).
#
# patterns:  forms the books print that the edition's patterns miss, for the
#   literature only (the edition's own matching is not changed by them). Their
#   hits are ruled like the others below.
#
# Places that are not estates of the edition never show on the site (the list
# is shown for the estates of focus); their rulings keep mentions.json right for
# questions. Where a book's name is Claude's identification and not the book's
# own statement, the comment at its ruling says so, and whether the editor has
# accepted it (docs/NEEDS_CONFIRMATION.md lists any still open).

patterns:
  person:
    # The edition's entry for the Trąmpczyński family carries only_in (the
    # five documents that name it), so its pattern matches nothing in the
    # literature; this bare form gives the literature its hits, ruled like
    # any other. Minakowska (2026, Wojciech Otto-Trąmpczyński) is the page
    # of the sixteenth-century Wojciech, the by-name Otto's man.
    # Minakowska (2026, Wojciech Otto-Trąmpczyński): the by-name "Otto-" in
    # her subject's name and his descendants' names; a bare Trąmpczyński
    # hits nothing extra here (the pattern's hits are the family).
    trampczynski: 'Trąmpczy[nń]sk\w*'
    # Feuerbrände writes the Prince's name without the final e, and as an
    # adjective: "Hohenloh", "die Hohenloh'sche Armee", "die Hohenlohschen
    # Besitzungen" (3-132; Materialien p. 146 "Hohenloheschen").
    hohenlohe: 'Hohenlohe?''?i?sche\w*|Hohenloh(?![a-zà-ÿ''])'
    # Żychliński (1885, 1891) and the PSB give Stanisław Miączyński in forms the
    # edition's pattern leaves out: after "Stanisława **", "Stanisławem",
    # "Podpułkownika" and "kapitanowi". Each is Stanisław.
    miaczynski: '(?<=Stanisława \*\*)Miączyńskiego|(?<=Stanisławem )Miączyńskim|(?<=Podpułkownika )Miączyńskiego|(?<=kapitanowi )Miączyńskiemu'
    # Breyer (1935, "Gaue") calls the owner of Trąbczyn in 1746 "Paul von
    # Kolno-Prusiński".
    prusimski-pawel: '(?<=Kolno-)Prusi[ńn]ski|(?<=Pawła i Katarzynę z Rozdrażewskich )Prusimskich'
    # Chodyła (2015) declines the names in Polish: "Antoniemu Prusimskiemu",
    # "Antoniego Prusimskiego", "między Antonim Prusimskim", "dóbr Trąbczyn
    # Prusimskiego" (the Starost); "Pawła i Katarzynę z Rozdrażewskich
    # Prusimskich" (the couple who founded the Olędry in 1746); "Katarzynę z
    # Rozdrażewskich Prusimską", "Katarzyny Prusimskiej" (the widow, 1754).
    prusimski: '(?<=Antoniemu )Prusimskiemu|(?<=Antoniego )Prusimskiego|(?<=Antonim )Prusimskim|(?<=Trąbczyn )Prusimskiego'
    prusimska-katarzyna: '(?<=Rozdrażewskich )Prusimsk(?:ich|ą)|(?<=Katarzyny )Prusimskiej'
    # Karwowski (1900) spells the name of the banker of Wrocław "Weygel" (the
    # letters spell "Weigel").
    weigel: 'Weygel'
  place:
    # The black register's list of the Prince's Konin estates: Materialien
    # p. 159 prints "Trombczyn", Feuerbrände 2-80 "Trobozyn" and "Szellewen".
    # Żychliński and Breyer print the adjective: "klucz Trąbczyński",
    # "majętność Trąmbczyńską" (and "Huta Trąbczyńska", a village of its own).
    # Kneifel (1964) prints "Trombezyn" (p. 41, the Starost's Grundherrschaft).
    # Kraus (2001) prints "Trobczyn" (p. 42, among the lordships the prince
    # sold "weit unter Wert").
    trabczyn: 'Trombczyn|Trobozyn|Trombezyn|Trobczyn|Tr[ąa]m?bczyńsk\w*'
    # Żychliński and the PSB decline Kolno and Wieniec in Polish: "na Kolnie",
    # "Kolna", "z Kolnem"; "Wieńca", "na Wieńcu".
    kolno: 'Koln(?:ie|a|em)(?![a-zà-ÿ])'
    wieniec: 'Wieńc(?:a|u)(?![a-zà-ÿ])'
    szetlewek: 'Szellewen'
    # Karwowski (1900) declines Zagórów into the adjective, lowercase:
    # "przy dobrach zagórskich" (p. 87), the Zagórów estates.
    # Kneifel (1964) writes the town's name with the German umlaut for the
    # first vowel only ("Zagörow", pp. 112, 123, 226, 235) and once breaks it
    # at the line's end, "Zagö-röw" (p. 92). The edition's own pattern takes
    # the o and ó forms ("Zagorow", "Zagórów"), already ruled below.
    # Kraus (2001) prints "Zogorowo" (p. 42, among the sold lordships — the
    # print's own spelling, the o for the a).
    zagorowo: 'zagórskich|Zagö-?r[öo]w(?![a-zà-ÿ])|Zogorowo'
    # Boniecki (1900) has Imielno as "Mielno" in the list of the Chełmski
    # estates, "Łukomia, Łomowa, Mielna i Bukowa" (the editor, 2026-10-21:
    # "Imielno (Mielna in this document)"). Only in that list.
    imielno: '(?<=Łomowa, )Mielna'
    # Feuerbrände 2-69 "Schwiegoszyn" (Materialien p. 145 "Swiegoszyn").
    swiechocin: 'Schwiegoszyn'
    # Materialien p. 145 "Löwin" (Feuerbrände 2-69 "Lowin"); the word is also a
    # lioness, so its ruling below names the one passage.
    lowyn: 'Löwin'
    # Held and Feuerbrände: Krotoczyn, Krotosczyn, Krotoscyner, Crotozcyn.
    krotoszyn: 'Crotozcyn\w*|Krotocz?yn\w*|Krotoscz?yn\w*'

people:
  trampczynski:
    # The edition's own entry carries only_in (the five documents that name
    # the family), so its pattern matches nothing in the literature; this
    # bare form, added for Minakowska (2026, Wojciech Otto-Trąmpczyński),
    # gives the literature its hits, ruled like any other.
    # The page's hits are the subject and his descendants (the family the
    # edition's entry covers): yes.
    Trąmpczyński: yes
    Trąmpczyńska: yes
    # Chodyła (2015) n. 34: "w Trąmpczyńskich Ol." (the Olędry of
    # Trąmpczyński, the placename of Marcin Hunt's holding, the site of the
    # sitting of 17 X 1782): not a person, the colony's name.
    Trąmpczyńskich: "no: 'w Trąmpczyńskich Ol.', the Olędry colony named for the family (Chodyła 2015, n. 34), not a person"
    # Żychliński (1885) p. 187: "Janem **Trąmpczyńskim** herbu Topór (1700)",
    # the husband of Teresa Gajewska in the Opaliński genealogy; not shown
    # to be of the edition's family or of the page's line.
    Trąmpczyńskim: "no: Jan Trąmpczyński of the arms Topór (Żychliński 1885, p. 187), the husband of Teresa Gajewska in the Opaliński genealogy; not shown to be of the edition's family or of the page's line"
  amelang: {Amelang: yes}
  beguelin: {Beguelin: yes}
  bernhard:
    Bernhard: "no: the Great St Bernard pass (Feuerbrände) and St Bernard of Clairvaux (Materialien), not the edition's Bernhard"
  bernhardi:
    Bernhardi: "no: Görne's Kriegsrath Bernhardi in Berlin before 1782 (Held), not the edition's Bergrath Bernhardi"
  bertrand:
    Bertrand: "no: the building inspector von Bertrand at Krotoszyn (Held), not Napoleon's General Bertrand"
  beyme: {Beyme: yes}
  bluecher: {Blücher: yes}
  broniewski:
    # Minakowska (2026, Helena Zielonacka): the Bronisz family her page
    # carries - Wojciech Bronisz, cup-bearer (cześnik) of Żytomierz, and his
    # descendants through her daughter Agnieszka of the second marriage:
    # no person of the edition, and no relation to its Broniewski.
    Bronisz: "no: the Bronisz family of Helena Zielonacka's second marriage (Wojciech Bronisz of Żytomierz and his descendants), not the edition's Broniewski"
  brzechffa:
    Brzechta: "no: Joseph Brzechta, the tenant of Constantin von Milewski at Borszewice in the contract of 1796 (Breyer 1938); not the Podprefect B. Brzechffa"
    Brzechwa: "no: Joseph Brzechwa, the tenant of Constantin von Milewski at Borszewice in the contract of 1796 (Breyer 1938); not the Podprefect B. Brzechffa"
  bulow:
    Bülow: "no: Dietrich Heinrich von Bülow, the military writer (Feuerbrände 1-63), not the edition's Bülow"
  constantin:
    Constantin: "no: Constantin von Milewski, owner of Borszewice, in the contract of 1796 (Breyer 1938); not the Grand Duke"
    # Breyer (1935, "Gaue") calls the viceroy of 1826 "Konstantin
    # Konstantinowitsch"; the Grand Duke who was viceroy then is Konstantin
    # Pavlovich, the edition's Constantin: the patronymic is Breyer's slip
    Konstantin: yes
  danckelmann:
    Danckelmann: "no: the Silesian justice minister, signing at Breslau in 1795 (Held p. 109) and as a minister (p. 134), not the vice-president at Poznań in the edition"
  dabrowski:
    Dąbrowski: "no: General Jan Henryk Dąbrowski and his son (Pachoński 1973), not the lessee Dąbrowski of Oe 1 Bü 9454"
  dolffs: {Dolffs: yes}
  friedrich-wilhelm-ii:
    Friedrich Wilhelm II.: yes
    Friedrich Wilhelms II.: yes
    # Łukasiewicz (1997): the king; the four undotted hits stand in the
    # register's own German title (p. 34) and in the titles of works about him
    # or his reign (Stadelmann n. 6, Naude n. 47, Triebenfeld's memoir n. 70),
    # where he is the subject.
    Friedrich Wilhelm II: yes
  friedrich-wilhelm-iii:
    Friedrich Wilhelm III.: yes
    Friedrich Wilhelm des dritten: yes
    # Łukasiewicz (1997): the king; Hellwig's book title (n. 47) and the
    # Kabinets-Orde of 23 XI 1797 (n. 123) name him as subject/actor.
    Friedrich Wilhelm III: yes
    Friedrich Wilhelms III.:
      default: yes
      except:
        guradze1898/c08: "the title of a yearbook cited in a footnote, not the king acting"
    Friedrich Wilhelms des dritten: yes
  fuerst-august:
    Augustus: "no: Augustus II (Frost 2007), King of Poland and Elector of Saxony, caught by the pattern's bare \"f \" lookbehind (\"...support of Augustus II...\"); not Fürst August"
    # Kraus (2001): the Prince's son and heir August — born 27 November 1784
    # at Breslau (p. 37), addressed in his mother's letter of 12 October 1811
    # (p. 326, "Mein Sohn August"), on whom his father's debts fell (p. 41) —
    # the edition's Friedrich August Karl (1784-1853), the Erbprinz.
    August: yes
  gaertner:
    Gärtner: "no: the word for a cottager (and Gärtnerei, gardening), not a man named Gärtner"
  gelanski:
    Florian: "no: the given name of Hieronim Florian Radziwiłł (Frost 2007); not Florian Gelanski"
  giese:
    Giese: "no: the farm-holders Heinrich, Johann, Christian and Friedrich Giese at Święcia in Breyer's list of 1818; not shown to be the Johann Giese who took the Oleśnica estate in lease in 1804"
  gneust:
    Wohlgeb: "no: the form of address Wohlgeboren, not Gneust"
  goerne:
    Goerne: "no: the minister Görne, Krotoszyn's owner before 1782, not the edition's Goerne"
    Goerneschen: "no: the minister Görne, Krotoszyn's owner before 1782, not the edition's Goerne"
  goetzen:
    Götzen: "no: the word for idols (Feuerbrände 1-17)"
    Götzendorf: "no: the Polish noble family Götzendorf-Grabowski in a list of names (Materialien p. 7)"
  grevenitz:
    # The government councillor (Regierungsrath) von Grevenitz at Posen in the
    # 1790s, Triebenfeld's fellow go-between in the Gurowski affair, stands: he
    # is taken to be the edition's Kammergerichtsrat von Grevenitz of Berlin,
    # Triebenfeld's friend after 1807 (Claude's identification, accepted by
    # the editor, 2026-10-19). The regiment and battalion of the name do not.
    Grevenitz:
      default: "no: the regiment Grevenitz, not the man"
      except:
        feuerbraende1807/3-132: the government councillor at Posen
        materialien1861/127: the government councillor at Posen, given Tarnowo
        materialien1861/135: the government councillor, Triebenfeld's correspondent in 1807
        materialien1861/148: the government councillor at Posen, given Tarnowo
        materialien1861/150: the go-between with Triebenfeld in the Gurowski affair
        materialien1861/153: the government councillor, in the Gurowski divorce
        materialien1861/notes: the government councillor, alive in 1845
    Grävenitz:
      default: "no: the regiment or battalion Grävenitz, not the man"
      except:
        feuerbraende1807/2-71: the government councillor at Posen, given Tarnowo
        feuerbraende1807/2-74: the government councillor, in the Gurowski divorce
    # Łukasiewicz (1997), Tabela 4 n. 7 (p. 61): the donatary Grävenitz, whose
    # affair Cölln's Feuerbrände carried (I, 132; V, 66, 109, 110; Grünhagen
    # s. 294-295). Not read as the edition's Kammergerichtsrat von Grevenitz
    # of Berlin; the identity is open (NEEDS_CONFIRMATION, "The literature").
    Grävenitza: "no: the donatary Grävenitz of Tabela 4 and his affair in Cölln's Feuerbrände, not read as the edition's Kammergerichtsrat von Grevenitz"
  grimm:
    # Kneifel (1964) p. 93: "Pastor Grimm in Stawiszyn", who wrote the report
    # on the schools of the Kalisch land for the Posen consistory about 1800 -
    # not the letters' Grimm either.
    Grimm: "no: Grimms Wörterbuch (Guradze) and the word Grimm, wrath (Feuerbrände 3-51); also Pastor Grimm of Stawiszyn (Kneifel 1964, p. 93), not the letters' Grimm"
  hardenberg: {Hardenberg: yes}
  haugwitz:
    Haugwitz:
      default: yes
      except:
        guradze1898/c06: "the intendant von Haugwitz of an earlier time, not the minister"
  hawich:
    Habich: "no: the word Habicht, a hawk (Feuerbrände 2-102)"
  held:
    v. Held: yes
    von Held: yes
  hertzog:
    Hertzog: "no: Held's steward (Amtmann) Hertzog at Krotoszyn in 1792; not shown to be the Hertzog of the edition's document of 1799"
  hoffmann-legationsrath:
    Hoffmann: "no: the colonist Caspar Hoffmann in the contract of 1796 (Breyer 1938); not the official of the foreign ministry"
  hohenlohe:
    Hohenlohe: yes
    Hohenloh: yes
    Hohenloh'sche: yes
    Hohenlohschen: yes
    Hohenlohische: yes
    Hohenloheschen: yes
    Hohenlohesche: yes
  holtzendorff:
    Holtzendorff: yes
    Holzendorff: yes
  hoym:
    Hoym:
      default: yes
      except:
        held1801/28: "the minister's cousin, Geheimerath von Hoym at Breslau"
        held1801/143: "the minister's cousin, Geheimerath von Hoym at Breslau"
        held1801/164: "the minister's cousin, Geheimerath von Hoym at Breslau"
        held1801/216: "the minister's cousin, Geheimerath von Hoym at Breslau"
  hussarzewski:
    Husarzewski: "no: a Hofgerichts-Rath from Bromberg in the 1790s (Held); not shown to be the government councillor at Kalisz of 1805"
  knoblauch:
    Knoblauch: "no: Geheimer Finanzrath von Knoblauch in Berlin, once president at Białystok (Materialien p. 124); not shown to be the Knoblauch of 1803 in the edition"
  chemski:
    # Chodyła (2015): Stanisław Chełmski, owner of Łukomia (Łukom) and Łomowo,
    # to whom part of Trąbczyn was handed over in 1771, and the party against
    # Antoni Prusimski in 1782: the family of the edition's entry.
    Chełmskiemu: yes
    Chełmskim: yes
    # Boniecki (1900), the branch that held Łukomia: "Andrzej Scibor
    # Chełmski" (c04), "od Ignacego Chełmskiego" (c06), "rodowód
    # Chełmskich" (c01, the pedigree that leads into the branch): the family
    # of the edition's entry.
    # Minakowska (2026, Helena Zielonacka): the "Chełmski" of
    # "Ścibor-Chełmski" on her page are her husband Józef Ścibor-Chełmski
    # (named with his brother Franciszek by the decree of 1728, APP
    # 53/6/0/-/40, and by Boniecki c04 her husband), his and her son Tomasz,
    # and Tomasz's sons Franciszek Ksawery, Stanisław (1795-1867) and
    # Stanisław Józef (1807-1877): the family of the edition's entry. Her
    # sons Heliodor and Stanisław the Treasurer are of it too, but their
    # names on the page stand without the surname ("Heliodor", "Stanisław,
    # skarbnik [poz] Wschowa"), so the pattern does not take them.
    Chełmski: yes
    Chełmskiego: yes
    Chełmskich: yes
    # The feminine form: "Katarzyna, Józefa, Nepomucena and Izabela
    # Honorata Ścibor-Chełmska" (Minakowska 2026, Helena Zielonacka, c02) -
    # Józef's daughters and granddaughter, the family of the edition's
    # entry.
    Chełmska: yes
    Chełmscy: "no: the heading of Boniecki's article, the whole family of the arms Ostoja; its Łukomia branch is found by the names in the passages"
  koeckritz: {Köck: yes}
  kuh:
    Kuh: "no: the word for a cow (Materialien p. 195)"
  kwilecki:
    Kwileck: "no: Count Kwilecki of Dobrojewo in the 1790s; not shown to be the justice of the peace at Konin of 1810"
  larisch: {Larisch: yes}
  lipski:
    Lipski: "no: the prelate K. Lipski, lord of Chocz in 1790 (Breyer 1935, Chodyła 2015); not the appeal judge von Lipski at Kalisz in the edition's letters"
  luka:
    Luka: "no: Count Lukas Bniński (Materialien p. 155), not Samuel Lucke"
  malachowski:
    # Minakowska (2026, Stanisław Adam Miączyński): the Małachowski of the
    # database's line markers of Maria née Słubicka's descent (Antoni
    # 5.367.323, Jacek 9.522.619, Stanisław 3.598.213), her forebears in
    # the database's kinship furniture; not the president of the
    # Commission.
    Małachowski: "no: the Małachowski of the line markers of Maria née Słubicka's descent (Antoni, Jacek and Stanisław), not the president Stanisław Małachowski"
  massow:
    Massow: "no: the forest master von Massow (Guradze) and a signatory of 1800 (Held); not the edition's Massow"
  miaczynski:
    # The two Miączyński blocks stand merged: a second key of the same name
    # shadows the first in YAML, and the zychlinski exceptions were dead
    # from 2026-10-22 until now.
    Miączyński:
      default: yes
      except:
        zychlinski1885/188: "Władysław Miączyński, Michalina's grandson, not Stanisław"
        zychlinski1891/223: "Włodzimierz Miączyński, Stanisław's son"
        zychlinski1891/224: "Atanazy Miączyński, the forebear of the family"
        # Minakowska (2026, Antoni Prusimski): the bare "Miączyński" of the
        # grandchildren's list names Stanisław's sons and grandsons (Aleksander,
        # Stanisław, Władysław, Włodzimierz, Mieczysław, Witold, Józef Piotr
        # Paweł, Tadeusz, Jerzy), not Stanisław the husband himself. The
        # "Kajetan Miączyński" of the (linia:) on c03 is his forebear, and stands
        # only inside the passage about his marriage.
        minakowska2026prusimski/c04: "Stanisław's sons and grandsons, not Stanisław himself"
        # Minakowska (2026, Stanisław Adam Miączyński): the parents' and
        # ancestors' sections and the children's list. The front (the
        # subject's own line and the Wikipedia line, with one (linia:) of
        # his father) and the tree (his forebears with his own row) are
        # mixed and left standing: the passages name him.
        minakowska2026miaczynski/c01: Kajetan Jan Aleksander, his father, not Stanisław
        minakowska2026miaczynski/c03: "Aleksander Adam Stanisław, his son (both hits of the line: his surname and the line marker of Kajetan), not Stanisław"
        minakowska2026miaczynski/c04: his sons Włodzimierz, Mieczysław, Witold and Józef Piotr Paweł, his grandsons Stanisław, Władysław Atanazy, Witołd and Tadeusz Franciszek Władysław, and his great-grandsons Alfred and Władysław Józef, not Stanisław himself
    Miączyńskiego: yes
    Miączyńskiemu: yes
    Miączyńskim: yes
  napoleon: {Napoleon: yes}
  neumann:
    Neumann: "no: the chamber assessor Neumann, the legation councillor Neumann and others; not shown to be Triebenfeld's steward at Bojadła"
  niemojewski:
    Niemojewską: "no: Anna Niemojewska, a castellan's wife, in the Prusimski genealogy (Żychliński 1885); not General Niemojewski"
    # Łukasiewicz (1997), p. 37 n. 33: Józef Niemojewski, starosta of Śrem,
    # major general of the Poznań voivodeship, whose Borkowo and Ostrowo were
    # confiscated (Iwaszkiewicz's list) — the edition's General Niemojewski,
    # restored in 1807 to an estate Prussia had confiscated.
    Niemojewskiemu: yes
  noldichen:
    # Claude's identification, accepted by the editor (2026-10-19)
    Nöldichen: yes
  ogrodowicz:
    Ogrodowicz: "no: Karol Ogrodowicz, president of the town council of Pyzdry in 1778 (Chodyła 2015); not shown to be the clerk Ogrodowicz under the justiciary Schenck about 1805 (Oe 1 Bü 14526)"
  otto:
    Otto: "no: Otto Busse, a farm-holder at Święcia in Breyer's list of 1928; not the Otto of the edition's letters"
  poniatowski:
    Poniatowski: "no: Stanisław Poniatowski among landlords who freed their peasants (Guradze), not Prince Józef"
    Poniatowskiego:
      default: yes
      except:
        chodyla2015/19: "King Stanisław August Poniatowski, not Prince Józef"
        chodyla2015/52: "King Stanisław August Poniatowski, not Prince Józef"
        # Mielewczyk (2017): Juliusz Poniatowski, the Minister of Agriculture
        # and Land Reforms, in the citation of his speech to the Sejm's budget
        # commission of 20 January 1938 (note 18); not Prince Józef.
        mielewczyk2017/52: "Juliusz Poniatowski, the minister of agriculture of 1938, in the citation of his speech; not Prince Józef"
  pontanus: {Pontanus: yes}
  prinz-george: {George: yes}
  prittwitz:
    Prittwitz: "no: Frederick the Great's general and a lieutenant-colonel of the trains in 1806; not the official of the exchange of 1799"
  prusimska:
    # Minakowska (2026, Antoni Prusimski), the marriage section: "Marianna
    # Dąmbska", the Starost's wife, not Michalina (his daughter).
    Dąmbska:
      default: yes

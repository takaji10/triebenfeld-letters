account_en: >-
  An article by the Polish legal historian Jan Wąsicki on the colonisation
  carried on by the Prussian state in South Prussia between the second
  partition and the defeat at Jena, from the files of the South Prussian
  administration in the State Archive in Poznań (S. P. Z.) and the German
  literature: the kings' plans and the ministers' reluctance, the recruiting
  of colonists in Württemberg and on the Rhine, the instructions of 1799 and
  1802 that divided colonists into six classes by their means and set the
  land, help and free years of each, the colonies founded in the Poznań,
  Warsaw and Kalisz departments, colonisation on private estates, and
  colonisation in the towns. It says that the "Olęder" settlements founded by
  Polish lords in the seventeenth and eighteenth centuries were the model the
  Prussian state took over, and it names the Prince of Hohenlohe-Ingelfingen's
  Zagórów and Trąbczyn estates, the 18 families brought there in 1805 and the
  villages founded in the Warta valley (Ludwigslust, Emilienheim, Święcia,
  the Wrąbczyn colony and others), from Breyer. Written in 1953, it frames
  the subject in the language of its time ("bourgeois historians", citing
  Marx), and its own sources are the Prussian administration's.
account_de: >-
  Ein Aufsatz des polnischen Rechtshistorikers Jan Wąsicki über die
  Kolonisation, die der preußische Staat in Südpreußen zwischen der Zweiten
  Teilung und der Niederlage bei Jena betrieb, nach den Akten der
  südpreußischen Verwaltung im Staatsarchiv Posen (S. P. Z.) und der deutschen
  Literatur: die Pläne der Könige und das Zögern der Minister, die Werbung von
  Kolonisten in Württemberg und am Rhein, die Instruktionen von 1799 und 1802,
  die die Kolonisten nach ihrem Vermögen in sechs Klassen teilten und für jede
  Land, Hilfe und Freijahre festsetzten, die in den Departements Posen,
  Warschau und Kalisch gegründeten Kolonien, die Kolonisation auf privaten
  Gütern und in den Städten. Er sagt, dass die von polnischen Grundherren im
  17. und 18. Jahrhundert gegründeten Olęder-Siedlungen das Vorbild waren, das
  der preußische Staat übernahm, und er nennt die Güter Zagórów und Trąbczyn
  des Fürsten zu Hohenlohe-Ingelfingen, die 1805 dorthin gebrachten 18
  Familien und die im Warthetal gegründeten Dörfer (Ludwigslust, Emilienheim,
  Święcia, die Kolonie Wrąbczyn und andere), nach Breyer. Geschrieben 1953,
  fasst er den Gegenstand in der Sprache seiner Zeit („bürgerliche
  Historiker“, Zitate von Marx); seine eigenen Quellen sind die der
  preußischen Verwaltung.

account_en: >-
  The legal historian Jan Wąsicki on the colonisation carried on by the
  Prussian state in South Prussia between the second partition and the defeat
  at Jena, from the files of the South Prussian administration in the State
  Archive in Poznań and the German literature. He follows the kings' plans and
  the ministers' reluctance, the recruiting of colonists in Württemberg and on
  the Rhine, the instructions of 1799 and 1802 that sorted colonists into six
  classes by their means, and the colonies founded in the Poznań, Warsaw and
  Kalisz departments, on private estates and in the towns. He takes the Olęder
  settlements of the Polish lords as the model the Prussian state took over,
  and names, after Breyer, the Prince of Hohenlohe-Ingelfingen's estates of
  Zagórów and Trąbczyn, the eighteen families brought there in 1805 and the
  villages founded in the Warta valley. Written in 1953, it frames its subject
  in the language of its time.
account_de: >-
  Der Rechtshistoriker Jan Wąsicki über die Kolonisation des preußischen
  Staates in Südpreußen zwischen der zweiten Teilung und der Niederlage bei
  Jena, aus den Akten der südpreußischen Verwaltung im Staatsarchiv Posen und
  der deutschen Literatur. Er verfolgt die Pläne der Könige und das Zögern der
  Minister, die Werbung von Kolonisten in Württemberg und am Rhein, die
  Instruktionen von 1799 und 1802, die die Kolonisten nach ihrem Vermögen in
  sechs Klassen teilten, und die in den Departements Posen, Warschau und
  Kalisch, auf Privatgütern und in den Städten gegründeten Kolonien. Die
  Olęder-Siedlungen der polnischen Herren nimmt er als Vorbild, das der
  preußische Staat übernahm, und nennt nach Breyer die Güter Zagórów und
  Trąbczyn des Fürsten Hohenlohe-Ingelfingen, die achtzehn 1805 dorthin
  gebrachten Familien und die im Warthetal gegründeten Dörfer. 1953
  geschrieben, fasst er seinen Gegenstand in der Sprache seiner Zeit.


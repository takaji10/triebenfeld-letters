  Konin (ihr Pastor Waldemar Wunsz), mit Dr Zbigniew Chodyła als
  wissenschaftlichem Berater. Drei Teile: Studien (darunter Grzonkowskis
  Geschichte der Protestanten des Zagórów Landes von der Reformation bis
  zur Gegenwart, Kowalskis Untersuchung der Holländeransiedlung und der
  preussischen Kolonisation 1746-1806, Połoms Darstellung der Kantoren und
  Kantorateien, Kruczkowskis Familiengeschichten und Słowińskis Studie der
  in der Wand des Łazińsker Kantorenhauses gefundenen Briefe - die Studie,
  aus der Przeżyć tę jedną zimę, 2023, wurde), Erinnerungen (darunter die
  des in Łazińsk geborenen Detmolder Ältesten Erich Kuhn) und Zeugnisse -
  deutschsprachige Quellen im Neudruck: die Note der deutschen Zeit über
  Łazińsk (Der Heimatbote 1981), eine Kirchengeschichte, eine
  Besiedlungsgeschichte der Region Zagórów-Trąbczyn, die deutschen
  Ortsnamen, das Protokoll des Łazińsker Kantorenrats von 1928, die
  Einwohnerliste von Michalinów Trąbczyński, Łazińsk und Huta Trąbczyńska
  und das Fälschungsdokument "Reichsstelle für Familienzuwachs" von 1943.
  Ein Zeuge des ganzen Grundes der Ausgabe: Łazińsk, die
  Holländersiedlungen des Gutes Trąbczyn, die Kirchengemeinde Zagórów und

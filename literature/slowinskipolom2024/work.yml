account_en: >-
  The collective volume on the Protestants of the Zagórów land - "the broken
  link" of the town's three communities - issued by the Municipal Office in
  Zagórów in 2024 and edited by Mirosław Słowiński (the author of Zagórów.
  Album miasta, 2007, and of Przeżyć tę jedną zimę, 2023) with Katarzyna
  Połom, on the initiative of the town's House of Culture (its director
  Łukasz Parus) and the Evangelical-Augsburg parish in Konin (its pastor
  Waldemar Wunsz), with Dr Zbigniew Chodyła as scientific consultant. Three
  parts: studies (among them Grzonkowski's history of the Protestants of the
  Zagórów land from the Reformation to the present, Kowalski's study of the
  Hauländer settlement and the Prussian colonization of 1746-1806, Połom's
  account of the cantors and kantorate schools, Kruczkowski's family
  histories, and Słowiński's study of the letters found in the wall of the
  Łazińsk cantor's house - the study that grew into Przeżyć tę jedną zimę,
  2023), memoirs and recollections (among them Erich Kuhn's, the Łazińsk-
  born elder of the Detmold congregation), and testimonies - German-language
  sources printed anew: the German-era note on Łazińsk (Der Heimatbote
  1981), a parish history, a settlement-history chronology of the
  Zagórów-Trąbczyn region, the German place names, the protocol of the
  Łazińsk cantors' council of 1928, the list of the inhabitants of
  Michalinów Trąbczyński, Łazińsk and Huta Trąbczyńska, and the forged
  "Reichsstelle für Familienzuwachs" document of 1943. A witness of the
  edition's whole ground: Łazińsk, the Trąbczyn estate's Olęder colonies,
  the Zagórów parish and its cantorates.

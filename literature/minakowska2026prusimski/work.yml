brief_en: >-
  The page of Antoni Ostroróg-Prusimski (1744 to about 1806), Starost of
  Niszczewice and owner of Trąbczyn, in Minakowska's online genealogy: his
  line, his parents, and his marriage to Marianna Dąmbska, whose daughter
  Michalina carried Trąbczyn through her two marriages to the Miączyńskis.
brief_de: >-
  Die Seite des Antoni Ostroróg-Prusimski (1744 bis etwa 1806), Starosten von
  Niszczewice und Besitzers von Trąbczyn, in Minakowskas Online-Genealogie:
  seine Linie, seine Eltern, und seine Ehe mit Marianna Dąmbska, deren Tochter
  Michalina Trąbczyn durch ihre beiden Ehen zu den Miączyńskis brachte.

account_en: >-
  The page of Antoni Michał Kazimierz Ostroróg-Prusimski (1744 to about 1806),
  Starost of Niszczewice, in Maria Jadwiga Minakowska's online genealogy
  Wielka genealogia Minakowskiej (sejm-wielki.pl), person 4.285.619, as saved
  on 22 October 2026. Born on 4 March 1744 at Bieganowo, he was the son of
  Stefan Prusimski and Wiktoria née Malczewska. The page gives his ancestors
  back to his great-grandparents; his marriage about 1770 to Marianna Dąmbska,
  daughter of Józef Wojciech Dąmbski, castellan of Kowal, and Barbara née
  Komorowska; and their daughter Michalina with her two husbands and her
  children. The database is compiled from the printed armorials and
  biographies; dates marked "?" are its estimates, and "bohater PSB" marks a
  person with an entry in the Polski Słownik Biograficzny.
account_de: >-

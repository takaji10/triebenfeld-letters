account_en: >-
  Albert Werner's history of the evangelical parishes of the Prussian province
  of Posen, revised by Johannes Steffani and published by the Royal Consistory
  at Lissa in 1904, which takes the parishes one by one with their founding,
  churches and pastors. Only entry 201, the parish of Wreschen (Września), is
  given, whole. The parish first served the German Hauländer country around
  Peisern (Pyzdry) and Zagorowo (Zagórów), and lost "a district rich in German
  Hauland lands" in 1817, when those places came to Russia. The entry also
  tells of the parish's founding under the Poniński lords from 1758, the
  church in the orangery house given in 1778, the new church of 1895, and its
  ten pastors from 1779 to 1904.
account_de: >-
  Albert Werners Geschichte der evangelischen Parochien der preußischen
  Provinz Posen, bearbeitet von Johannes Steffani und 1904 vom Königlichen
  Konsistorium in Lissa herausgegeben, die die Parochien eine nach der anderen
  mit Gründung, Kirchen und Pastoren behandelt. Wiedergegeben ist nur der
  Eintrag 201, die Parochie Wreschen (Września), ganz. Die Parochie versorgte
  zuerst das deutsche Hauländerland um Peisern (Pyzdry) und Zagorowo (Zagórów)
  und verlor 1817, als diese Orte an Russland kamen, „eine an deutschen
  Hauländereien reiche Gegend“. Der Eintrag erzählt auch von der Gründung der
  Parochie unter den Herren Poniński seit 1758, der 1778 geschenkten Kirche im
  Orangeriehaus, der neuen Kirche von 1895 und ihren zehn Pastoren von 1779
  bis 1904.


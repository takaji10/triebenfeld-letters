account_en: >-
  A handbook of the procedure for settling boundaries between estates in the
  Kingdom of Poland, by Marcin Paciorkowski, a sworn sub-delegate of the
  municipal court of Opoczno, who worked such cases. Approved by the censor in
  1749; this is the enlarged second edition of 1776, with the laws on
  boundaries, the law of 1768 among them. It explains the commissions, the
  boundary chamberlain, the summons, the inspection of the mounds and the
  decree, step by step, as the practice of the time had them. It does not
  name Trąbczyn, but it is the procedure of the boundary decrees of 1775 and
  1782 between Trąbczyn and its neighbours. Janocki's Ianociana (1779) says
  the handbook is a reprint of Stanisław Lochowski's Processus iuris limitanei
  of 1641, which Paciorkowski printed under his own name (the sub-item
  Janocki (1779)); the 1776 title page itself calls the book Paciorkowski's,
  enlarged by the author.
account_de: >-
  Ein Handbuch des Verfahrens zur Festsetzung der Grenzen zwischen Gütern im
  Königreich Polen, von Marcin Paciorkowski, vereidigtem Subdelegaten des
  Grodgerichts Opoczno, der solche Sachen selbst führte. Vom Zensor 1749
  genehmigt; dies ist die erweiterte zweite Auflage von 1776, mit den
  Gesetzen über die Grenzen, darunter dem Gesetz von 1768. Es erklärt die
  Kommissionen, den Grenzkämmerer, die Ladung, die Besichtigung der
  Grenzhügel und das Dekret Schritt für Schritt, wie die Praxis der Zeit sie
  kannte. Trąbczyn nennt es nicht, aber es ist das Verfahren der
  Grenzdekrete von 1775 und 1782 zwischen Trąbczyn und seinen Nachbarn.
  Janockis Ianociana (1779) sagt, das Handbuch sei ein Nachdruck des Processus
  iuris limitanei des Stanisław Lochowski von 1641, den Paciorkowski unter
  eigenem Namen drucken ließ (der angehängte Janocki (1779)); die Titelseite
  von 1776 schreibt das Buch selbst Paciorkowski zu, vom Verfasser vermehrt.

# The card's own short rendering of the account (the list pages, 2026-10-29); the account stays whole on the item's page.
brief_en: >-
  The second edition of 1776 of the handbook of the Polish field boundary
  process – the commissions, the boundary chamberlain, the summons, the
  inspection of the mounds, the decree, step by step – the procedure of the
  boundary decrees of 1775 and 1782 between Trąbczyn and its neighbours; its
  title page calls the book Paciorkowski's own, though Janocki (1779) says it
  is Lochowski's handbook of 1641 re-printed.
brief_de: >-
  Die zweite Auflage von 1776 des Handbuchs des polnischen Feldgrenzprozesses
  – die Kommissionen, der Grenzkämmerer, die Ladung, die Besichtigung der
  Grenzhügel, das Dekret, Schritt für Schritt —, das Verfahren der
  Grenzdekrete von 1775 und 1782 zwischen Trąbczyn und seinen Nachbarn; seine
  Titelseite gibt das Buch als Werk Paciorkowskis aus, vom Verfasser selbst
  vermehrt, obwohl Janocki (1779) darin Lochowskis Handbuch von 1641
  nachgedruckt sieht.

account_en: >-
  Włodzimierz Dworzaczek's files are a card index of short abstracts
  (regests) of the court books of Greater Poland, made for the genealogy of
  its nobility and published by the Kórnik Library. Each regest gives the
  date, the parties, the transaction and the leaf of the court book, in a
  heavily abbreviated Polish. These ten concern the two families that held
  Trąbczyn from the sixteenth century to 1794: the Trąmpczyńskis
  (Stanisław's dowry promise of 1614, the conveyance to Maciej Debrzyński of
  1642, the dowries of Anna Bojanowska in 1663 and of Teresa Prusimska in
  1692, Anna's second marriage of 1671, the wife of Andrzej Trąmpczyński in
  1706) and the Prusimskis of Kolno (the children of Krzysztof in 1658, Jan's
  wife's dowry in 1673, Sebastian's marriage in 1706, and the brothers'
  divisions, by which Trąbczyn passed from Sebastian to Krzysztof in 1720).
  A regest is an abstract, not the record: the court books themselves
  decide.
account_de: >-
  Włodzimierz Dworzaczeks Mappen sind eine Kartei kurzer Auszüge (Regesten)
  aus den Gerichtsbüchern Großpolens, angelegt für die Genealogie seines
  Adels und von der Bibliothek Kórnik herausgegeben. Jedes Regest nennt
  Datum, Parteien, Geschäft und Blatt des Gerichtsbuchs, in einem stark
  abgekürzten Polnisch. Diese zehn betreffen die beiden Familien, denen
  Trąbczyn vom 16. Jahrhundert bis 1794 gehörte: die Trąmpczyńskis
  (Stanisławs Mitgiftversprechen von 1614, die Übertragung an Maciej
  Debrzyński 1642, die Mitgift Anna Bojanowskas 1663 und Teresa Prusimskas
  1692, Annas zweite Ehe 1671, die Frau Andrzej Trąmpczyńskis 1706) und die
  Prusimskis auf Kolno (die Kinder Krzysztofs 1658, die Mitgift der Frau Jans
  1673, Sebastians Ehe 1706 und die Teilungen der Brüder, durch die Trąbczyn
  1720 von Sebastian an Krzysztof überging). Ein Regest ist ein Auszug, nicht
  die Aufzeichnung selbst: es entscheiden die Gerichtsbücher.


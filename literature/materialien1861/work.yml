account_en: >-
  An anonymous collection, printed at Leipzig in 1861, of extracts from
  official papers and the accounts of Prussian officials on the Polish lands
  that Prussia ruled until 1807: the German settlements in the province of
  Posen, the Prussian kings' dealings with Poland, and the estates given to
  Prussian favourites. It prints the "black register" (pages 140 to 171), the
  list of the Crown and church estates of South Prussia given away in 1794 to
  1798, from a manuscript among Hans von Held's papers, with Triebenfeld's
  entry on pages 162 to 164 and Cölln's six corrections of 1807 as notes. The
  compiler writes against Prussian rule and says so.
account_de: >-
  Eine anonyme Sammlung, 1861 in Leipzig gedruckt, von Auszügen aus amtlichen
  Papieren und Berichten preußischer Beamter über die polnischen Lande, die
  Preußen bis 1807 beherrschte: die deutschen Siedlungen in der Provinz Posen,
  die Politik der preußischen Könige gegenüber Polen und die an preußische
  Günstlinge verschenkten Güter. Sie druckt das „schwarze Register“ (Seiten
  140 bis 171), die Liste der 1794 bis 1798 verschenkten Krön- und
  Kirchengüter Südpreußens, nach einer Handschrift aus Hans von Helds
  Papieren, mit Triebenfelds Eintrag auf den Seiten 162 bis 164 und Cöllns
  sechs Berichtigungen von 1807 als Anmerkungen. Der Herausgeber schreibt
  gegen die preußische Herrschaft und sagt es.


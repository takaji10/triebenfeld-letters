account_en: >-
  An anonymous collection, printed at Leipzig in 1861, of extracts from
  official papers and from the accounts of Prussian officials on the Polish
  lands Prussia ruled until 1807: the German settlements in the province of
  Posen, Frederick the Great's and Frederick William II's dealings with
  Poland, and the estates given away to Prussian favourites. It prints the
  "black register" (pages 140 to 171), the list of the Crown and church
  estates of South Prussia given away in 1794 to 1798, from a manuscript
  found among Hans von Held's papers, with Triebenfeld's entry on pages 162
  to 164, and adds as notes the six corrections Cölln printed in 1807. The
  compiler writes against Prussian rule and says so; the extracts are
  useful, the judgements are the compiler's.
account_de: >-
  Eine anonyme Sammlung, 1861 in Leipzig gedruckt, von Auszügen aus Akten
  und aus Berichten preußischer Beamter über die polnischen Landesteile,
  die Preußen bis 1807 beherrschte: die deutschen Kolonisationen in der
  Provinz Posen, die Politik Friedrichs des Großen und Friedrich Wilhelms
  II. gegenüber Polen und die an preußische Günstlinge verschenkten Güter.
  Sie druckt das „schwarze Register“ ab (Seiten 140 bis 171), das
  Verzeichnis der 1794 bis 1798 verschenkten Kron- und geistlichen Güter
  Südpreußens, nach einer in Hans von Helds Nachlass gefundenen Handschrift,
  mit dem Eintrag über Triebenfeld auf den Seiten 162 bis 164, und fügt die
  sechs Berichtigungen, die Cölln 1807 druckte, als Anmerkungen hinzu. Der
  Herausgeber schreibt erklärtermaßen gegen die preußische Herrschaft; die
  Auszüge sind brauchbar, die Urteile sind seine.


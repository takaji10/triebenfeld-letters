account_en: >-
  A small regional book by Mirosław Słowiński (the author of Zagórów. Album
  miasta, 2007, and co-editor of Dwa życia jak dwa psalmy, 2012, and of
  Zerwane ogniwo. Ewangelicy na ziemi zagórowskiej, 2024), published by the
  press of the Zofia Urbanowska Public Library at Konin
  with the Stowarzyszenie Współpraca Polska-Wschód, and read in manuscript by
  Professor Artur Kijas at the author's request. It edits and discusses a
  hoard of letters found in 1995 walled up in the former cantor's house at
  Łazińsk: the correspondence of Bruno Edwin Mielke, a Wehrmacht private from
  Łazińsk who served on the Arctic front (the Eismeerfront at Petsamo/
  Pieczenga) from 1942 to 1944, and of his family at home, written from
  14 February 1940 to 14 May 1944. The letters are given translated into
  Polish (by a team of six, Jacek Kin foremost; the originals are kept in the
  archive of the MGOK at Zagórów), the commentary is the author's, an
  introduction sets the letters in the history of the German settlement
  around Zagórów, and an appendix reprints a German-era note on Łazińsk (Der
  Heimatbote 1981), a contemporary note, the list of the hoard's contents and
  the list of the cantor's library. A witness of the twentieth century, the
  era of the Ostdeutscher Beobachter's feature on Łazińsk of 19 July 1942 and
  of Breyer's Łazińsk notebook of 1936 (APP 53/968/0/-/669): its cantor
  Gustav Adolf Mielke - the teacher and farmer Mielke of the 1942 article,
  "since 1925" in Breyer's notebook - is the one man (the editor's ruling of
  2026-10-22).

  Briefe in die Geschichte der deutschen Besiedlung um Zagórów ein, und ein
  Anhang druckt eine Notiz der deutschen Zeit über Łazińsk nach (Der
  Heimatbote 1981), eine heutige Notiz, das Verzeichnis des Bestands und das
  Verzeichnis der Kantorbücherei. Ein Zeuge des zwanzigsten Jahrhunderts, der
  Zeit des Features des Ostdeutschen Beobachters über Łazińsk vom 19. Juli
  1942 und des Łazińsker Notizbuchs Breyers von 1936 (APP 53/968/0/-/669):
  sein Kantor Gustav Adolf Mielke - der Lehrer und Bauer Mielke des Artikels

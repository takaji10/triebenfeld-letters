account_en: >-
  Gerlinde Kraus's dissertation on Christiane Fürstin von der Osten-Sacken
  (1747-1811), born Freiin von Dieskau, heiress of the Hoym estates in Saxony
  and Silesia, and her heirs in the early industrialisation (Stuttgart 2001).
  Chapter III is given whole: the marriage in 1782 of her daughter Marianne
  Gräfin von Hoym to Friedrich Ludwig Fürst zu Hohenlohe-Ingelfingen, his
  military career, his failed undertakings in Hohenlohe, the purchase of
  Bytkow in Upper Silesia in 1801, the separation and divorce of 1799-1801,
  Marianne's second marriage and the marriage contracts of 1781 and 1787. Page
  42 records that the prince sold on lordships he had acquired, Betsche,
  Zogorowo, Trobczyn, Botkowo and Winiec, "weit unter Wert", far below their
  worth. From the appendices come Marianne's letter of 12 October 1811 on the
  separation and her mother's codicil of 6 November 1807 on paying her
  daughter's creditors up to 60,000 thaler.
account_de: >-
  Gerlinde Kraus' Dissertation über Christiane Fürstin von der Osten-Sacken
  (1747-1811), geborene Freiin von Dieskau, Erbin der Hoymschen Güter in
  Sachsen und Schlesien, und ihre Erben in der Frühindustrialisierung
  (Stuttgart 2001). Wiedergegeben ist Kapitel III ganz: die Ehe ihrer Tochter
  Marianne Gräfin von Hoym mit Friedrich Ludwig Fürst zu Hohenlohe-Ingelfingen
  1782, seine militärische Laufbahn, seine gescheiterten Unternehmungen in
  Hohenlohe, der Kauf von Bytkow in Oberschlesien 1801, die Trennung und
  Scheidung von 1799-1801, Mariannes zweite Ehe und die Eheverträge von 1781
  und 1787. Seite 42 hält fest, dass der Fürst erworbene Herrschaften,
  Betsche, Zogorowo, Trobczyn, Botkowo und Winiec, „weit unter Wert“ wieder
  verkaufte. Aus den Anlagen kommen Mariannes Brief vom 12. Oktober 1811 über
  die Trennung und das Kodizill ihrer Mutter vom 6. November 1807 über die
  Bezahlung der Gläubiger der Tochter bis zu 60.000 Talern.


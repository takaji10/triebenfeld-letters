account_en: >-
  A dissertation by Gerlinde Kraus on Christiane Fürstin von der Osten-Sacken
  (1747-1811), born Freiin von Dieskau, the heiress of the Hoym estates in
  Saxony and Silesia, mother of Marianne Gräfin von Hoym, and her heirs during
  the early industrialisation (Franz Steiner Verlag, Stuttgart 2001, Beiträge
  zur Unternehmensgeschichte vol. 10). Brought in: chapter III whole - the
  marriage of 1782 between Marianne Gräfin von Hoym and Friedrich Ludwig Fürst
  zu Hohenlohe-Ingelfingen, the prince's military career, his failed economic
  undertakings in the Hohenlohe heartland, the purchase of the Rittergut
  Bytkow in Upper Silesia in 1801 and its rescue by his mother-in-law, the
  separation and divorce of 1799-1801, Marianne's second marriage to count
  Friedrich Ludwig von der Osten-Sacken, and the marriage contracts of 1781
  and 1787 - and from the book's appendices Anlage 8, Marianne's letter of 12
  October 1811, "Ein Wort des Vertrauens", giving her own account of the
  separation, and Anlage 10, the codicil of 6 November 1807 in which her
  mother committed herself to pay her daughter's creditors up to 60,000
  thaler Courant. Its bearing on the edition: p. 42 records that the prince,
  to come by "ready means", sold on "weit unter Wert" - far below their worth
  - considerable family possessions he had acquired, "wie die Herrschaften
  Betsche, Zogorowo, Trobczyn, Botkowo und Winiec" - the edition's Zagórów and
  Trąbczyn among them, the sale the edition's wlodzimierz-era documents
  witness. Anlage 9, which prints between the two appendices brought in, is
  not brought in, nor the first lines of Anlage 11 (marked with [.]) - the
  editor's word of 2026-10-22. The book is in copyright; shown whole on the
  site at the editor's word, an exception to the summary-only rule for works
  under copyright. The English is Claude's.
account_de: >-
  Eine Dissertation von Gerlinde Kraus über Christiane Fürstin von der
  Osten-Sacken (1747-1811), geborene Freiin von Dieskau, die Erbin der
  Hoymschen Güter in Sachsen und Schlesien, Mutter der Marianne Gräfin von
  Hoym, und ihre Erben während der Frühindustrialisierung (Franz Steiner
  Verlag, Stuttgart 2001, Beiträge zur Unternehmensgeschichte Bd. 10).
  Aufgenommen: das Kapitel III als Ganzes - die Ehe von 1782 zwischen Marianne
  Gräfin von Hoym und Friedrich Ludwig Fürst zu Hohenlohe-Ingelfingen, die
  militärische Laufbahn des Fürsten, seine gescheiterten wirtschaftlichen
  Unternehmungen im hohenloheschen Stammland, der Kauf des Rittergutes Bytkow
  in Oberschlesien 1801 und seine Rettung durch die Schwiegermutter, die
  Trennung und Scheidung von 1799-1801, Mariannes zweite Ehe mit dem Grafen
  Friedrich Ludwig von der Osten-Sacken und die Eheverträge von 1781 und 1787
  - und aus den Anlagen des Buches die Anlage 8, Mariannes Brief vom 12.
  Oktober 1811, "Ein Wort des Vertrauens", mit ihrer eigenen Darstellung der
  Trennung, und die Anlage 10, das Kodizill vom 6. November 1807, in dem ihre
  Mutter sich verpflichtete, die Gläubiger der Tochter bis zur Summe von
  60.000 Taler Courant zu befriedigen. Seine Bedeutung für die Edition: S. 42
  hält fest, daß der Fürst, um an "baare Mittel" zu gelangen, bedeutende, von
  ihm erworbene Familienbesitzungen "weit unter Wert" wieder verkaufte, "wie
  die Herrschaften Betsche, Zogorowo, Trobczyn, Botkowo und Winiec" - das
  Zagórów und Trąbczyn der Edition darunter, der Verkauf, den die Dokumente
  der wlodzimierz-Epoche bezeugen. Die Anlage 9, die zwischen den beiden
  aufgenommenen Anlagen gedruckt ist, wird nicht aufgenommen, ebensowenig die
  ersten Zeilen der Anlage 11 (mit [.] vermerkt) - Wort des Herausgebers vom
  22.10.2026. Das Buch steht unter dem Urheberrecht; es wird auf der Site als
  Ganzes gezeigt auf das Wort des Herausgebers, eine Ausnahme von der
  Regel der Zusammenfassung allein für Werke unter dem Urheberrecht. Das
  Englische ist von Claude.

account_en: >-
  A study in six chapters of the Prussian laws on the peasants of the lands
  that became the province of Posen: what the peasants owed and held in the
  last years of Polish rule. It treats the legislation for the Netze district from 1772
  and for South Prussia from 1793 to 1806, and the years of the Duchy of
  Warsaw, 1807 to 1815. Guradze wrote from the general files of the
  administration and a selection of the particular ones, and says in his
  preface that his judgement differs markedly from that of Professor Knapp of
  Strasbourg and his students.
account_de: >-
  Eine Studie in sechs Kapiteln über die preußischen Gesetze für die Bauern
  der Lande, aus denen die Provinz Posen wurde: was die Bauern in den letzten
  Jahren der polnischen Herrschaft schuldeten und besaßen, die Gesetzgebung
  für den Netzedistrikt seit 1772 und für Südpreußen von 1793 bis 1806 und die
  Jahre des Herzogtums Warschau, 1807 bis 1815. Guradze schrieb aus den
  Generalakten der Verwaltung und einer Auswahl der Spezialakten und sagt in
  seinem Vorwort, sein Urteil weiche merklich von dem des Professors Knapp in
  Straßburg und seiner Schüler ab.


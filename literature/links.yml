# Passages of the literature tied by hand to documents of the edition
# (docs/LITERATURE_PLAN.md, section 5, item 2, and section 9).
#
# Read by pipeline/literature/literature_site.py, which puts an entry in the
# "Related" column beside each passage named here (the passage's own note and
# the documents that belong to it there), and writes site/_data/literature_links.yml
# for the "In the literature" entry beside each document named here. It stops on
# a passage or a document that does not exist, on a passage of a work not shown
# on the site (Seidel), and on a link whose notes do not cover its passages.
#
# Each link:
#   id         a short name, never shown
#   passages   <work>/<passage key>, as in dataset/literature/index.json
#   documents  the documents' uids, as in dataset/letters.json
#   en, de     one sentence (or two) saying why they belong together. It is
#              read beside each document ("In the literature"), so it names
#              the book, the document and what each says. Every figure in it
#              was read in both the book and the document (Claude, 2026-10-19).
#              Say who says what: "the register says", never "it was".
#   about      where a link names more than one passage of a work, the
#              per-passage notes that keep the column from repeating itself
#              (the editor, 2026-11-01): one entry per passage, keyed
#              <work>/<passage key>, each with its own en and de and its own
#              documents — a subset of the link's; left out, the link's
#              documents stand. A link with several passages must carry an
#              entry for every one of them; a link with one passage needs
#              none, its sentence is the note. Every document of the link
#              must belong to at least one passage.
# Where the link rests on Claude's identification, the comment above it says
# so, and docs/NEEDS_CONFIRMATION.md lists it until the editor has ruled.

# The black register: the list of the Crown and church estates given away in
# 1794-1798, printed in the Neue Feuerbrände (1807, part 2), with Cölln's
# remarks (part 3), and reprinted with both in the Materialien (1861,
# pp. 140-171).

# Kraus (2001), p. 42 (the last page of chapter III): the prince sold the
# lordships "weit unter Wert" to come by "baare Mittel". The document is the
# royal consent, of 28 January 1806, to the parcelling of Zagórów and
# Trąbczyn; it is the same two lordships of the book's list that the
# edition's ground lies in.

- id: kraus-sold-estates
  passages:
    - ostensacken2001/42
  documents:
    - app539680801-2
  en: >-
    Kraus (2001), p. 42, records that the prince, to come by "ready means"
    ("baare Mittel"), sold on far below their worth the lordships Betsche,
    Zogorowo, Trobczyn, Botkowo and Winiec he had acquired, the book's spellings
    of Zagórów and Trąbczyn among them. The royal consent of 28 January 1806
    (APP 53/968/0/-/801, document 2) shows the prince parcelling the
    "Herrschaften Zagurowo und Trompczyn" in the same years, while the book
    describes his finances as collapsing. The document does not say what the
    parcelling brought in, and the book does not date the sales.
  de: >-
    Kraus (2001) hält auf S. 42 fest, dass der Fürst, um an „baare Mittel“ zu
    gelangen, die erworbenen Herrschaften Betsche, Zogorowo, Trobczyn, Botkowo
    und Winiec „weit unter Wert“ wieder verkaufte, darunter in den Schreibweisen
    des Buches Zagórów und Trąbczyn. Die königliche Genehmigung vom 28. Januar
    1806 (APP 53/968/0/-/801, Dokument 2) zeigt den Fürsten in denselben Jahren
    bei der Parzellierung der „Herrschaften Zagurowo und Trompczyn“, während das
    Buch seine Finanzen als zusammenbrechend beschreibt. Das Dokument sagt
    nicht, was die Parzellierung einbrachte, und das Buch datiert die Verkäufe
    nicht.

- id: register-hohenlohe
  passages:
    - materialien1861/145
    - materialien1861/146
    - materialien1861/159
    - feuerbraende1807/2-69
    - feuerbraende1807/2-80
    - feuerbraende1807/3-132
  documents:
    - ihagrrep7cnr3570-1
    - oe1bu9454-85
    - oe1bu9454-86
    - oe1bu9454-87
    - oe1bu9454-97
    - oe1bu9454-101
    - oe1bu9454-103
  en: >-
    The black register lists the estates given to the Prince of Hohenlohe,
    Trąbczyn among them, as worth about 800,000 Thaler and yielding 50,000 a
    year, where the late King had meant a gift yielding 6,000. It says that the
    Prince himself gave the cabinet that yield when he tried to exchange the
    estates for the crown domain of Krotoszyn, and that the cabinet councillor
    Beyme stopped the exchange. Cölln answered in 1807 that it was the minister
    Voss who stopped it, and the letters bear him out. They hold the gift of
    1796; the King's refusal of December 1798 on Voss's report, by which estates
    valued at a yield of 8,650 a year now brought 40,500; the Prince's answer,
    that his estates yielded 41,500 and Krotoszyn's rent was 30,100; and his
    later petition.
  de: >-
    Das schwarze Register führt die dem Fürsten Hohenlohe geschenkten Güter,
    darunter Trąbczyn, mit einem Wert von etwa 800.000 Talern und 50.000 Talern
    Jahresertrag, wo der verstorbene König nur eine Schenkung von 6.000 Talern
    Ertrag gemeint habe. Es sagt, der Fürst habe diesen Ertrag selbst im
    Kabinett angegeben, als er die Güter gegen die Domäne Krotoszyn tauschen
    wollte, und der Kabinettsrat Beyme habe den Tausch verhindert. Cölln hielt
    1807 dagegen, der Minister Voss habe ihn vereitelt, und die Briefe geben ihm
    recht. Sie enthalten die Schenkung von 1796; die Ablehnung des Königs vom
    Dezember 1798 auf den Bericht von Voss, nach dem die auf 8.650 Taler
    Jahresertrag veranschlagten Güter jetzt 40.500 brächten; die Antwort des
    Fürsten, seine Güter trügen 41.500 und die Pacht von Krotoszyn sei 30.100;
    und seine spätere Eingabe.
  about:
    materialien1861/145:
      en: >-
        The entry gives the Prince's estates as worth about 800,000 Thaler and
        yielding 50,000 a year, where the late King had meant a gift of 6,000,
        and says Beyme stopped the Prince's exchange of them for Krotoszyn. The
        gift itself is in the edition: Hoym's proposal of 14 July 1796 and the
        King's cabinet order of 23 July grant the Prince the Prusimski estates —
        Trąbczyn, Szetlewek, Nowa Wieś, Łazy, Osiny, the Laski and the Hauland
        of Trąbczyn among them — at a proposed value of 120,000 rt and a yield
        of 4 to 6,000, and the deed of 9 August 1796 follows. The King's refusal
        of 4 December 1798 answers the exchange with the yield counted
        otherwise, and Triebenfeld writes from Berlin in January 1799 that only
        "B[eyme] and K[öckritz]" stood firm against having it refused outright.
      de: >-
        Der Eintrag gibt die Güter des Fürsten mit etwa 800.000 Talern Wert und
        50.000 Talern Jahresertrag an, wo der verstorbene König nur eine
        Schenkung von 6.000 gemeint habe, und sagt, Beyme habe den Tausch des
        Fürsten gegen Krotoszyn verhindert. Die Schenkung selbst steht in der
        Edition: Hoyms Vorschlag vom 14. Juli 1796 und die Kabinettsorder vom
        23. Juli weisen dem Fürsten die von Prusimski konfiszierten Güter zu —
        Trąbczyn, Szetlewek, Nowa Wieś, Łazy, Osiny, die Laski und der Hauland
        von Trąbczyn unter ihnen — auf einen vorgeschlagenen Wert von 120.000 rt
        und einen Ertrag von 4 bis 6.000, und die Urkunde vom 9. August 1796
        folgt darauf. Die Ablehnung des Königs vom 4. Dezember 1798 beantwortet
        den Tausch mit anders gerechnetem Ertrag, und Triebenfeld schreibt im
        Januar 1799 aus Berlin, nur „B[eyme] und K[öckritz]" hätten sich
        felsenfest dagegen gestellt, den Tausch rundweg zu verweigern.
      documents:
        - ihagrrep7cnr3570-1
        - oe1bu9454-85
        - oe1bu9454-97
    materialien1861/146:
      en: >-
        Here the register has the Prince stating his yield at 50,000 in the
        cabinet himself, and quotes Cölln on Voss having thwarted the exchange.
        The letters give the figures on both sides: the King counts the Prince's
        estates at a yield of 8,650 a year, improved since at a cost of some
        26,000 in meliorations, now bringing 40,500, against Krotoszyn's 49,043;
        the Prince answers that his estates yield 41,500 and Krotoszyn pays a
        rent of no more than 30,100; and Triebenfeld writes that Voss "still
        boils with wrath and rage" against the exchange. The Prince's second
        petition answers Voss's own stated reasons point by point, taking the
        Pacht of 30,100 for its basis against the 60,000 the minister's
        reckoning reaches.
      de: >-
        Hier läßt das Register den Fürsten selbst im Kabinett seinen Ertrag mit
        50.000 Talern angeben und zitiert Cölln dazu, Voss habe den Tausch
        vereitelt. Die Briefe geben die Zahlen beider Seiten: Der König
        veranschlagt die Güter des Fürsten auf 8.650 Taler Jahresertrag, seitdem
        mit etwa 26.000 Talern Meliorationen verbessert, jetzt 40.500 bringend,
        gegen 49.043 von Krotoszyn; der Fürst antwortet, seine Güter trügen
        41.500 und Krotoszyn zahle höchstens 30.100 Pacht; und Triebenfeld
        schreibt, Voss „kocht noch von Wuth und Rache" gegen den Tausch. Die
        zweite Vorstellung des Fürsten widerlegt die vom Minister selbst
        angeführten Gründe Punkt für Punkt und nimmt die Pacht von 30.100 zur
        Grundlage, gegen die 60.000, auf die des Ministers Rechnung kommt.
      documents:
        - oe1bu9454-85
        - oe1bu9454-86
        - oe1bu9454-87
        - oe1bu9454-97
        - oe1bu9454-101
    materialien1861/159:
      en: >-
        The Kalisch section's entry lists Trombczyn, Nowa-Wies, Oswiery, Lazy
        and Szetlewek at 12000 Thlr. — villages of the grant the deed of 9
        August 1796 makes the Prince, confiscated from Prusimski (the deed
        adds Alt and Neu Laske and the Hauland of Trąbczyn, which the row
        does not name). With the Posen
        entry's 77250 Thlr. the register's official valuation of the whole gift
        comes to 89,250 Thlr., where Hoym's proposal of 14 July 1796 had
        counted all the Prince's items at 120,000 rt; and where the register
        prints a valuation, the letters give a yield: Triebenfeld reports the
        Trąbczyn estates alone bringing 8,400 rt by March 1799.
      de: >-
        Der Eintrag der Kalischer Abteilung zählt Trombczyn, Nowa-Wies, Oswiery,
        Lazy und Szetlewek mit 12000 Thlr. auf — Dörfer der Zuweisung, die die
        Urkunde vom 9. August 1796 dem Fürsten, von Prusimski konfisziert,
        zuspricht (die Urkunde nennt dazu Alt- und Neu Laske und das Hauland
        von Trąbczyn, die die Zeile nicht führt). Mit den 77250 Thlr. des
        Posener Eintrags kommt das Register
        auf eine amtliche Taxe der ganzen Schenkung von 89.250 Talern, wo
        Hoyms Vorschlag vom 14. Juli 1796 alle Posten des Fürsten auf 120.000
        rt gerechnet hatte; und wo das Register eine Taxe druckt, geben die
        Briefe einen Ertrag: Triebenfeld meldet, die Trąbczyner Güter allein
        brächten im März 1799 schon 8.400 rt.
      documents:
        - ihagrrep7cnr3570-1
        - oe1bu9454-103
    feuerbraende1807/2-69:
      en: >-
        The entry is the one the Materialien reprints: the estates worth about
        800,000 Thlr. and yielding 50,000, the exchange for Krotoschin stopped
        by Beyme, the late King having consented to a gift of 6,000 a year. The
        edition holds both ends: the dossier of July and August 1796 with
        Hoym's proposal (a yield of 4 to 6,000 rt) and the deed of 9 August,
        and the King's refusal of 4 December 1798 with its yield of 40,500
        against 8,650.
      de: >-
        Der Eintrag ist der, den die Materialien nachdrucken: die Güter mit
        etwa 800.000 Talern Wert und 50.000 Ertrag, der Tausch gegen Krotoschin
        von Beyme verhindert, der verstorbene König nur einer Schenkung von
        6.000 im Jahr zugestimmt habend. Die Edition hält beide Enden: die Akte
        vom Juli und August 1796 mit Hoyms Vorschlag (ein Ertrag von 4 bis
        6.000 rt) und der Urkunde vom 9. August, und die Ablehnung des Königs
        vom 4. Dezember 1798 mit ihrem Ertrag von 40.500 gegen 8.650.
      documents:
        - ihagrrep7cnr3570-1
        - oe1bu9454-85
    feuerbraende1807/2-80:
      en: >-
        The entry gives the Prince's Konin villages — Trobozyn, Nowa-Wies,
        Oszyni, Lazy, Szellewen — at 12,000 Thlr., the register's share of an
        official valuation its Posen entry carries at 77250 Thlr. (89,250
        together), where Hoym's proposal of 14 July 1796 had counted all the
        Prince's items at 120,000 rt; and where the register prints a
        valuation, the letters give a yield: Triebenfeld reports the Trąbczyn
        estates alone bringing 8,400 rt by March 1799.
      de: >-
        Der Eintrag gibt des Fürsten Koniner Dörfer — Trobozyn, Nowa-Wies,
        Oszyni, Lazy, Szellewen — mit 12.000 Talern, den Anteil des Registers
        an einer amtlichen Taxe, deren Posener Eintrag 77250 Thlr. trägt
        (zusammen 89.250), wo Hoyms Vorschlag vom 14. Juli 1796 alle Posten des
        Fürsten auf 120.000 rt gerechnet hatte; und wo das Register eine Taxe
        druckt, geben die Briefe einen Ertrag: Triebenfeld meldet, die
        Trąbczyner Güter allein brächten im März 1799 schon 8.400 rt.
      documents:
        - ihagrrep7cnr3570-1
        - oe1bu9454-103
    feuerbraende1807/3-132:
      en: >-
        Cölln's postscript says the exchange would not have been unjust had it
        followed the valuations, and that Voss thwarted it. The letters carry
        the exchange itself: the King's refusal of 4 December 1798 grounded on
        Voss's report, the Prince's answers of 7 December calling that report
        one-sided ("auf einseitiges Angeben des Kriegesrath Nöldichen"), and
        Triebenfeld's report of January 1799 that Voss opposed the exchange
        with everything he had. The Prince's second petition is the answer to
        Voss's own reasons, taken one by one.
      de: >-
        Cöllns Nachschrift sagt, der Tausch wäre nach den Taxen nicht ungerecht
        gewesen, und Voss habe ihn vereitelt. Die Briefe tragen den Tausch
        selbst: die Ablehnung des Königs vom 4. Dezember 1798 auf den Bericht
        des Voss gegründet, die Antworten des Fürsten vom 7. Dezember, die
        jenen Bericht einseitig nennen („auf einseitiges Angeben des
        Kriegesrath Nöldichen"), und Triebenfelds Meldung vom Januar 1799, Voss
        habe alles gegen den Tausch aufgeboten. Die zweite Vorstellung des
        Fürsten ist die Antwort auf des Voss eigene Gründe, einen nach dem
        anderen.
      documents:
        - oe1bu9454-85
        - oe1bu9454-86
        - oe1bu9454-87
        - oe1bu9454-97
        - oe1bu9454-101

- id: register-triebenfeld
  passages:
    - materialien1861/162
    - materialien1861/163
    - feuerbraende1807/2-83
    - feuerbraende1807/2-84
    - feuerbraende1807/3-134
  documents:
    - oe1bu9454-104
    - oe1bu9454-108
    - oe1bu9454-112
  en: >-
    The black register's entry on Triebenfeld gives his estates as valued at
    31,000 Thaler when they were given to him, with 20,000 paid for the lordship
    of Laski. The Kalisz government valued them in the spring of 1797 at over
    700,000; he sold them to Prince George of Hesse-Darmstadt for 400,000, and
    Prince George sold them on in March 1801 for 750,000. Triebenfeld's letters
    to the Prince of Hohenlohe give the same valuation (over 700,000, April
    1799) and the same resale (750,000, February 1801), but put his own price to
    Prince George at 280,000, not 400,000 (July 1800). Cölln remarked in 1807
    that the figures include estates that were Triebenfeld's own.
  de: >-
    Der Eintrag des schwarzen Registers über Triebenfeld nennt seine Güter bei
    der Schenkung mit 31.000 Talern taxiert, dazu 20.000 für die Herrschaft
    Laski gezahlt. Die Regierung in Kalisch taxierte sie im Frühjahr 1797 auf
    über 700.000; er verkaufte sie an den Prinzen George von Hessen-Darmstadt
    für 400.000, und dieser verkaufte sie im März 1801 für 750.000 weiter.
    Triebenfelds Briefe an den Fürsten Hohenlohe nennen dieselbe Taxe (über
    700.000, April 1799) und denselben Weiterverkauf (750.000, Februar 1801),
    aber als seinen eigenen Preis an den Prinzen George 280.000, nicht 400.000
    (Juli 1800). Cölln merkte 1807 an, in den Zahlen steckten Triebenfelds
    eigene Güter.
  about:
    materialien1861/162:
      en: >-
        The entry gives the first four estates as valued at 31,000 Thaler at
        the donation, the lordship of Laski taken for a hereditary-tenure sum
        of 20,000, and the spring 1797 valuation at over 700,000. The letters
        agree on the valuation from the man's own hand: in April 1799 he writes
        that the estates he sold to Prince George stand, at a judicial and
        chamber tax, at over 700,000 rt — while he reckons he let the gentleman
        have them on a basis of about 500,000.
      de: >-
        Der Eintrag gibt die ersten vier Güter bei der Schenkung mit 31.000
        Talern taxiert, die Herrschaft Laski für eine Erbstandsumme von 20.000
        erkauft, und die Taxe des Frühlings 1797 auf über 700.000. Die Briefe
        stimmen in der Taxe aus eigener Hand überein: Im April 1799 schreibt
        er, die Güter, die er an den Prinzen Georg verkaufte, ständen nach
        Justiz- und Kammerratstaxe jetzt über 700.000 rt — während er rechnet,
        er habe sie den Herrn auf einer Grundlage von etwa 500.000 überlassen
        lassen.
      documents:
        - oe1bu9454-104
        - oe1bu9454-108
    materialien1861/163:
      en: >-
        Here the register gives the sale: to Prince George of Hesse-Darmstadt
        for 400,000 Thaler, and the resale by contract of 9 March 1801 to
        Schirnding for 750,000. The letters give the same story as their writer
        counted it: his own price to Prince George 280,000 (July 1800), and in
        February 1801 that Prince George "has sold my estates for 750,000 rt".
      de: >-
        Hier gibt das Register den Verkauf: an den Prinzen Georg von
        Hessen-Darmstadt für 400.000 Taler, und den Weiterverkauf durch Vertrag
        vom 9. März 1801 an Schirnding für 750.000. Die Briefe erzählen
        dieselbe Geschichte, wie ihr Schreiber sie rechnete: sein eigener Preis
        an den Prinzen Georg 280.000 (Juli 1800), und im Februar 1801, dieser
        habe „meine Güter für 750.000 rt verkauft".
      documents:
        - oe1bu9454-108
        - oe1bu9454-112
    feuerbraende1807/2-83:
      en: >-
        The Triebenfeld entry opens here: the first four numbers assessed at
        31,000 thalers at the donation, the lordship of Lasky taken for a
        hereditary-tenure sum of 20,000, and the Kalisch assessment of spring
        1797 at over 700,000 thalers. Triebenfeld's letter of April 1799 gives
        the same tax from his own hand: the estates he sold to Prince George
        stand at over 700,000 rt, reckoned by himself at some 500,000.
      de: >-
        Der Triebenfeld-Eintrag hebt hier an: die ersten vier Nummern bei der
        Schenkung auf 31.000 Taler taxiert, die Herrschaft Lasky für eine
        Erbstandsumme von 20.000 genommen, und die Kalischer Taxe des Frühlings
        1797 auf über 700.000 Taler. Triebenfelds Brief vom April 1799 gibt
        dieselbe Taxe aus eigener Hand: die Güter, die er an den Prinzen Georg
        verkaufte, stehen über 700.000 rt, von ihm selbst auf etwa 500.000
        gerechnet.
      documents:
        - oe1bu9454-104
    feuerbraende1807/2-84:
      en: >-
        The itemized assessment (684,496 Thlr. 17 Gr. 8 Pf. for the five named,
        Nowa Wies and Schmardke still lacking), the sale to Prince George for
        400,000 and the resale by contract of 9 March 1801 for 750,000. The
        letters tell it as their writer counted: over 700,000 rt at the tax
        against his own basis of some 500,000 (April 1799); his price to Prince
        George 280,000, the estates encumbered with 270,000 of debt (July
        1800); and Prince George selling them for 750,000 rt (February 1801).
      de: >-
        Die einzeln aufgeführte Taxe (684.496 Thlr. 17 Gr. 8 Pf. für die fünf
        genannten, Nowa Wies und Schmardke noch fehlend), der Verkauf an den
        Prinzen Georg für 400.000 und der Weiterverkauf durch Vertrag vom 9.
        März 1801 für 750.000. Die Briefe erzählen es, wie ihr Schreiber
        rechnete: über 700.000 rt an der Taxe gegen seine eigene Grundlage von
        etwa 500.000 (April 1799); sein Preis an den Prinzen Georg 280.000, die
        Güter mit 270.000 Schulden beschwert (Juli 1800); und der Prinz Georg
        verkaufe sie für 750.000 rt (Februar 1801).
      documents:
        - oe1bu9454-104
        - oe1bu9454-108
        - oe1bu9454-112
    feuerbraende1807/3-134:
      en: >-
        Cölln's postscript says that beneath the assessment of the Triebenfeld
        estates and their sale price lie estates that were his own, and that he
        had turned the buildings into good repair before he sold. His letters
        give the sale's inside from his own hand: the price to Prince George
        280,000 with 270,000 of debt standing on the estates (July 1800), and
        the buyer reselling for 750,000 (February 1801).
      de: >-
        Cöllns Nachschrift sagt, unter der Taxe der Triebenfeldschen Güter und
        ihrem Verkaufspreis steckten Güter, die ihm selbst gehörten, und er
        habe die Gebäude vor dem Verkauf in guten Stand gebracht. Seine Briefe
        geben das Innere des Verkaufs aus eigener Hand: der Preis an den
        Prinzen Georg 280.000, mit 270.000 Schulden auf den Gütern (Juli
        1800), und der Käufer verkaufe für 750.000 weiter (Februar 1801).
      documents:
        - oe1bu9454-108
        - oe1bu9454-112

- id: krotoszyn-administration
  passages:
    - materialien1861/163
  documents:
    - oe1bu9454-85
    - oe1bu9454-86
    - oe1bu9454-101
  en: >-
    The Materialien, quoting the "black book", say that Triebenfeld ran the
    lordship of Krotoszyn for the Seehandlung (the state's Maritime Trading
    Company) for nine years, that Struensee leased it in 1791 to the steward
    Früson for 30,100 Thaler a year, and that Hoym and Triebenfeld drove
    Früson out. In the letters on the Prince's proposed exchange
    for Krotoszyn the King says Triebenfeld received 26,000 Thaler when the
    lease was given up in 1795, and the Prince gives Krotoszyn's rent as the
    same 30,100.
  de: >-
    Die Materialien sagen nach dem "schwarzen Buch", Triebenfeld habe die
    Herrschaft Krotoszyn neun Jahre für die Seehandlung verwaltet, Struensee
    habe sie 1791 an den Amtmann Früson für 30.100 Taler im Jahr verpachtet,
    und Hoym und Triebenfeld hätten Früson vertrieben. In den Briefen über den Tausch des Fürsten gegen Krotoszyn sagt der König,
    Triebenfeld habe für die Abtretung der Pacht 1795 einen Abstand von
    26.000 Talern erhalten, und der Fürst nennt als Pacht von Krotoszyn
    dieselben 30.100.


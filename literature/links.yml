    - feuerbraende1807/2-77
    - feuerbraende1807/2-82
    - feuerbraende1807/2-83
  documents:
    - oe1bu9454-103
  en: >-
    Answering the charge that the Prince of Hohenlohe had been given too many
    estates, Triebenfeld set his gift beside others made at the same time, each
    valued low and since sold or yielding far more. He names Bischofswerder's,
    which he says was sold for 207,000 Thaler; Zastrow's, meant to bear 2,000 a
    year and now bearing some 20,000; Dolffs's, which Treskow was selling for
    360,000; and General Rüchel's, sold for 140,000 — "of all of those", he
    writes, no one speaks a word, only against the Prince's estates. The black
    register makes
    the same complaint of the same gifts: Bischofswerder's sold to Count
    Lüttichau for 25,000 Friedrichsd'or, Zastrow's given at 87,650 and "now
    worth at least 200,000", and
    Rüchel's sold to Reibnitz for 130,000 and valued afterwards at 380,000.
  de: >-
    Gegen den Vorwurf, der Fürst Hohenlohe habe zu viele Güter erhalten, stellte
    Triebenfeld dessen Schenkung neben andere aus derselben Zeit, alle niedrig
    taxiert und seither teuer verkauft oder mit weit höherem Ertrag. Er nennt
    die Bischofswerders, die, wie er sagt, für 207.000 Taler verkauft worden
    sei; die Zastrows, die 2.000 im Jahr tragen sollte und jetzt an die 20.000
    bringe; die Dolffs', die Treskow gerade für 360.000 verkaufe; und die des
    Generals Rüchel, für 140.000 verkauft — „von allen denen", schreibt er,
    spreche man kein Wort, nur über die Güter des Fürsten. Das schwarze Register
    erhebt
    denselben Vorwurf gegen dieselben Schenkungen: Bischofswerders an den Grafen
    Lüttichau für 25.000 Friedrichsd'or verkauft, Zastrows bei der Schenkung
    87.650 und „jetzt zum Mindesten 200.000“ wert, und Rüchels an Reibnitz für
    130.000 verkauft und danach auf 380.000 taxiert.
  about:
    materialien1861/141:
      en: >-
        The entry opens the comparison with Bischofswerder: four estates valued
        at 18000 Thlr., the understatement notorious. Triebenfeld's letter of
        13 March 1799 gives the letter's side of the same comparison: the
        Bischofswerder estates were to bear at most 1,500 rt by the assessment,
        and he sold them for 207,000 rt.
      de: >-
        Der Eintrag eröffnet den Vergleich mit Bischofswerder: vier Güter mit
        18000 Thlr. taxiert, die Unterreibung notorisch. Triebenfelds Brief vom
        13. März 1799 gibt die Seite des Briefes für denselben Vergleich: die
        Bischofswerderschen Güter sollten nach dem Anschlag höchstens 1.500 rt
        tragen, und er habe sie für 207.000 rt verkauft.
    materialien1861/142:
      en: >-
        The page completes the story the entry began: Bischofswerder sold the
        four estates to Count Lüttichau for 25,000 Friedrichsd'or, who bought
        his donations from him again for 50,000. The letter's comparison
        continues here too: it was Triebenfeld who sold the Bischofswerder
        estates, for 207,000 rt, after an assessment that gave them at most
        1,500 rt a year.
      de: >-
        Die Seite führt die Geschichte fort, die der Eintrag begann:
        Bischofswerder verkaufte die vier Güter an den Grafen Lüttichau für
        25.000 Friedrichsd'or, der ihm seine Donationen dafür wieder für 50.000
        abkaufte. Der Vergleich des Briefes geht hier weiter: Triebenfeld war
        es, der die Bischofswerderschen Güter verkaufte, für 207.000 rt, nach
        einem Anschlag, der ihnen höchstens 1.500 rt jährlich gab.
    materialien1861/156:
      en: >-
        The entry on Zastrow gives eight estates at 87650 Thlr. which he "has,
        very prudently, not yet had valued", worth at least 200,000. The letter
        answers with the same reckoning: the Zastrow estates were to bear some
        2,000 rt, and bring beyond doubt "some twenty thousand".
      de: >-
        Der Eintrag über Zastrow gibt acht Güter mit 87650 Thlr. an, die er
        „sehr klüglich" noch nicht habe taxieren lassen, wert zum Mindesten
        200.000. Der Brief antwortet mit derselben Rechnung: die Zastrowschen
        Güter sollten etwa 2.000 rt tragen und bringen „ohnstreitig etliche
        zwanzig tausend".
    materialien1861/160:
      en: >-
        The entry on Rüchel opens here: eight estates, the lordship of
        Ostrzeszow at their head, at 30000 Thlr. The letter's comparison names
        him: the Rüchel estates were to bear 940 rt a year, and were sold for
        140,000.
      de: >-
        Der Eintrag über Rüchel hebt hier an: acht Güter, die Herrschaft
        Ostrzeszow an der Spitze, mit 30000 Thlr. Der Vergleich des Briefes
        nennt ihn: die Rüchelschen Güter sollten 940 rt jährlich tragen und
        sind für 140.000 verkauft.
    materialien1861/161:
      en: >-
        The entry tells Rüchel's sale: all eight estates, never seen by their
        recipient, sold to Reibnitz for 130,000 Thaler, then valued at 341,000
        and 39,000 — 380,000 together. The letter's comparison puts the same
        sale at 140,000, the estates meant to bear 940 rt a year.
      de: >-
        Der Eintrag erzählt Rüchels Verkauf: alle acht Güter, von ihrem
        Empfänger nie gesehen, an Reibnitz für 130.000 Taler verkauft, danach
        auf 341.000 und 39.000 — zusammen 380.000 — taxiert. Der Vergleich des
        Briefes setzt denselben Verkauf auf 140.000, die Güter sollten 940 rt
        jährlich tragen.
    feuerbraende1807/2-66:
      en: >-
        The entry repeats the note the register prints with Bischofswerder: the
        four estates sold to Lüttichau for 25,000 Friedrichsd'or. The letter of
        13 March 1799 has Triebenfeld himself selling them, for 207,000 rt,
        after an assessment of at most 1,500 rt a year.
      de: >-
        Der Eintrag wiederholt die Bemerkung, die das Register zu Bischofswerder
        druckt: die vier Güter an Lüttichau für 25.000 Friedrichsd'or verkauft.
        Der Brief vom 13. März 1799 läßt Triebenfeld selbst sie verkaufen, für
        207.000 rt, nach einem Anschlag von höchstens 1.500 rt jährlich.
    feuerbraende1807/2-77:
      en: >-
        The entry on Zastrow (87650 Thlr., not yet valued, worth at least
        200,000): the letter's reckoning — meant to bear some 2,000 rt,
        bringing beyond doubt some twenty thousand.
      de: >-
        Der Eintrag über Zastrow (87650 Thlr., noch nicht taxiert, wert zum
        Mindesten 200.000): die Rechnung des Briefes — sollte etwa 2.000 rt
        tragen, bringt ohnstreitig etliche zwanzig tausend.
    feuerbraende1807/2-82:
      en: >-
        The entry gives Rüchel's eight estates at 30,000 Thlr. and tells the
        making of the gift (an assessment of 20,000, Kalischkowice added for
        the windfall timber at 10,000), then the sale to Reibnitz for 130,000
        and the judicial valuation of 380,000. The letter: the Rüchel estates
        were to bear 940 rt a year and were sold for 140,000.
      de: >-
        Der Eintrag gibt Rüchels acht Güter mit 30.000 Talern an und erzählt
        das Zustandekommen der Schenkung (eine Taxe von 20.000, Kalischkowice
        für das Windbruchholz mit 10.000 dazugegeben), dann den Verkauf an
        Reibnitz für 130.000 und die gerichtliche Taxe von 380.000. Der Brief:
        die Rüchelschen Güter sollten 940 rt jährlich tragen und sind für
        140.000 verkauft.
    feuerbraende1807/2-83:
      en: >-
        The entry ends with the sale's reckoning: Reibnitz drawing 12,000 a
        year and still owing Rüchel 90,000 at 5 per cent, and the Euclid
        sarcasm on an assessment of 20,000 against forest damage of 40,000.
        The letter's comparison stands beside it: the Rüchel estates, meant to
        bear 940 rt a year, sold for 140,000.
      de: >-
        Der Eintrag endet mit der Rechnung des Verkaufs: Reibnitz zieht 12.000
        jährlich und schuldet Rüchel noch 90.000 zu 5 Prozent, und der
        euklidische Spott über eine Taxe von 20.000 gegen einen Waldschaden von
        40.000. Der Vergleich des Briefes steht daneben: die Rüchelschen Güter,
        die 940 rt jährlich tragen sollten, für 140.000 verkauft.

# The donation dossier I. HA Rep. 7 C Nr. 3570 (2026-11-01): Hoym's proposal
# of 14 July 1796, the King's cabinet order of 23 July given at Pyrmont, and
# the deeds of 9 August 1796 — the register's own source for the first round
# of gifts. Where the register's entry carries a deed date, the dossier holds
# the deed; where it carries a valuation, the dossier's proposal gives a value
# and a yield to set beside it. The figures below were read in the dossier and
# in the register's entries.

- id: register-donations
  passages:
    - materialien1861/142
    - materialien1861/160
    - materialien1861/168
    - feuerbraende1807/2-66
    - feuerbraende1807/2-87
  documents:
    - ihagrrep7cnr3570-1
  en: >-
    The donation dossier of July and August 1796 — Hoym's proposal of 14 July,
    the King's cabinet order of 23 July given at Pyrmont, the deeds of 9 August
    1796 — is the register's own source for the first round of gifts: where a
    register entry carries a deed date, the dossier holds the deed (Dolffs's,
    9 August 1796), and where it carries a valuation, the proposal gives a
    value and a yield to set beside it (Blücher's Duninow estates, Pontanus's
    Sieradz estates).
  de: >-
    Die Schenkungsakte von Juli und August 1796 — Hoyms Vorschlag vom 14. Juli,
    die Kabinettsorder des Königs vom 23. Juli zu Pyrmont gegeben, die Urkunden
    vom 9. August 1796 — ist die eigene Quelle des Registers für die erste
    Runde der Schenkungen: Wo ein Registereintrag ein Urkundendatum trägt, hält
    die Akte die Urkunde (die Dolffsens, 9. August 1796), und wo er eine Taxe
    trägt, gibt der Vorschlag einen Wert und einen Ertrag dazu (die
    Duninower Güter Blüchers, die Sieradzer Güter Pontanus').
  about:
    materialien1861/142:
      en: >-
        The entry on Blücher gives five estates in the Kowal district at 28000
        Thlr., their income "certainly 6000 thalers". The dossier holds the
        grant itself: the Duninow estates in the Kowal circle, proposed for
        Blücher with a yield of 1,500 rt and a value of 30,000 rt, among the
        deeds of 9 August 1796 — the yield of the proposal and the income of
        the register's note do not agree.
      de: >-
        Der Eintrag über Blücher gibt fünf Güter im Kreis Kowal mit 28000 Thlr.
        an, deren Einkommen „gewiss 6000 Thaler" betrage. Die Akte hält die
        Zuweisung selbst: die Duninower Güter im Kreis Kowal, für Blücher mit
        einem Ertrag von 1.500 rt und einem Wert von 30.000 rt vorgeschlagen,
        unter den Urkunden vom 9. August 1796 — der Ertrag des Vorschlags und
        das Einkommen der Anmerkung des Registers stimmen nicht überein.
    materialien1861/160:
      en: >-
        The entry on Pontanus prints no valuation ("Unknown") beside the
        judicial valuation of 200,000 thalers at Kalisch. The dossier holds his
        grant: Dziejorzew, Borchkowe and Jacubie in the Sieradz circle, vacated
        by the death of von Biernacka, proposed with a yield of 600 rt and a
        value of 12,000 rt, among the deeds of 9 August 1796.
      de: >-
        Der Eintrag über Pontanus druckt neben der gerichtlichen Taxe von
        200.000 Talern in Kalisch keine Taxe („Unknown"). Die Akte hält seine
        Zuweisung: Dziejorzew, Borchkowe und Jacubie im Kreis Sieradz, durch den
        Tod des von Biernacka frei geworden, mit einem Ertrag von 600 rt und
        einem Wert von 12.000 rt vorgeschlagen, unter den Urkunden vom 9.
        August 1796.
    materialien1861/168:
      en: >-
        The entry on Dolffs gives five estates in the Gostinin district at
        20000 Thlr. and dates his deed of donation Berlin, 9 August 1796 — the
        deed itself is in the dossier: the gravial estate of Strzelec between
        Gostinin and Kutno, proposed with a yield of 1,000 rt and a value of
        20,000 rt. The page's Goldbeck entry (the estate received "merely
        through an oversight", the deed carrying the same date) belongs to the
        same dossier: it shows the Grand Chancellor's chancery expediting the
        seven deeds of 9 August 1796.
      de: >-
        Der Eintrag über Dolffs gibt fünf Güter im Kreis Gostinin mit 20000
        Thlr. an und datiert seine Donationsurkunde auf Berlin, den 9. August
        1796 — die Urkunde selbst liegt in der Akte: das Gratialgut Strzelec
        zwischen Gostinin und Kutno, mit einem Ertrag von 1.000 rt und einem
        Wert von 20.000 rt vorgeschlagen. Der Goldbeck-Eintrag der Seite (das
        „lediglich durch ein Versehen" erhaltene Gut, die Urkunde mit demselben
        Datum) gehört zu derselben Akte: sie zeigt die Kanzlei des
        Großkanzlers, die die sieben Urkunden vom 9. August 1796 expediert.
    feuerbraende1807/2-66:
      en: >-
        The entry on Blücher (28000 Thlr., the income certainly 6,000): the
        dossier's proposal gives the Duninow estates a yield of 1,500 rt and a
        value of 30,000 rt, among the deeds of 9 August 1796 — the yield of the
        proposal and the income of the register's note do not agree.
      de: >-
        Der Eintrag über Blücher (28000 Thlr., das Einkommen gewiss 6.000): der
        Vorschlag der Akte gibt den Duninower Gütern einen Ertrag von 1.500 rt
        und einen Wert von 30.000 rt, unter den Urkunden vom 9. August 1796 —
        der Ertrag des Vorschlags und das Einkommen der Anmerkung des Registers
        stimmen nicht überein.
    feuerbraende1807/2-87:
      en: >-
        The entry on Dolffs (five estates at 20000 Thlr., the deed dated Berlin
        9 August 1796) and the Goldbeck entry it leads into: the dossier holds
        the deed itself — Strzelec between Gostinin and Kutno, a yield of
        1,000 rt, a value of 20,000 rt — and shows the Grand Chancellor
        Goldbeck, who had meant one of the estates of this very round for his
        son, expediting the deeds of 9 August 1796.
      de: >-
        Der Eintrag über Dolffs (fünf Güter mit 20000 Thlr., die Urkunde
        datiert Berlin, den 9. August 1796) und der Goldbeck-Eintrag, in den er
        übergeht: die Akte hält die Urkunde selbst — Strzelec zwischen Gostinin
        und Kutno, ein Ertrag von 1.000 rt, ein Wert von 20.000 rt — und zeigt
        den Großkanzler Goldbeck, der ein Gut eben dieser Runde für seinen Sohn
        bestimmt hatte, wie er die Urkunden vom 9. August 1796 expediert.

# The books of the second set (Books_2, 2026-10-19): Breyer (1935, 1938),
# Żychliński (1885, 1891) and the Polski Słownik Biograficzny (Pachoński,
# 1982). Every figure below was read in the book and in the document.

- id: breyer1938-lease
  passages:
    - breyer1938/21
    - breyer1938/22
  documents:
    - app539680801-2
    - app539680801-3
    - app539680783-1
  en: >-
    Breyer (1938) tells of the hereditary lease by which Triebenfeld, for the
    Prince of Hohenlohe, gave 100 Hufen of forest to eighteen German settlers,
    with the Kalisz chamber's consent of 28 January 1806, and quotes its
    paragraph 13: the lessees free for ever of hereditary subjection and of all
    services. The consent and a copy of the lease survive. The lease names the
    forest as that of the Prince's estate of Drzewce, and it agrees with Breyer
    on the eighteen takers, on paragraph XIII, on the rent of 30 Reichsthaler a
    Magdeburg Hufe after four free years, paid half at St John's and half at
    Christmas, and on the 21 Morgen for the schoolmaster, the headman and the
    cemetery. They differ in three points. Breyer dates the lease 18 May 1805,
    while the copy, whose beginning is lost, gives no day it was made and was
    engrossed at Mariantów on 21 March 1806. The clause on draining the land and
    a dike on the Warta that Breyer quotes is not among the copy's paragraphs.
    And where Breyer says the settlers had pasture and wood in the Prince's
    heath, the lease (paragraph VIII) gives them no claim to firewood and lets
    them graze only in the part of the Drzewce woods the lordship kept, until
    that too is sold.
  de: >-
    Breyer (1938) berichtet vom Erbpachtvertrag, durch den Triebenfeld für den
    Fürsten Hohenlohe 100 Hufen Wald an achtzehn deutsche Siedler gab, mit der
    Genehmigung der Kalischer Kammer vom 28. Januar 1806, und zitiert dessen
    Paragraphen 13: die Erbpächter für immer frei von Erbuntertänigkeit und
    allen Diensten. Die Genehmigung und eine Abschrift des Vertrags sind
    erhalten. Der Vertrag nennt den Wald als den des fürstlichen Gutes Drzewce
    und stimmt mit Breyer überein in den achtzehn Annehmern, in Paragraph XIII,
    im Kanon von 30 Reichstalern für die Magdeburgische Hufe nach vier
    Freijahren, je zur Hälfte zu Johanni und zu Weihnachten, und in den 21
    Morgen für Schullehrer, Schulzen und Kirchhof. In drei Punkten weichen sie
    ab. Breyer datiert den Vertrag auf den 18. Mai 1805, während die Abschrift,
    deren Anfang fehlt, keinen Tag des Abschlusses nennt und am 21. März 1806 in
    Mariantów ausgefertigt wurde. Die Klausel über die Entwässerung des Landes
    und einen Damm an der Warthe, die Breyer zitiert, steht in keinem
    Paragraphen der Abschrift. Und wo Breyer sagt, die Siedler hätten Weide und
    Holz in der fürstlichen Heide gehabt, gibt ihnen der Vertrag (Paragraph
    VIII) keinen Anspruch auf Brennholz und erlaubt die Hütung nur in dem Teil
    der Waldungen bei Drzewce, den die Herrschaft behielt, bis auch dieser
    verkauft wird.
  about:
    breyer1938/21:
      en: >-
        The page tells the lease: concluded, Breyer says, on 18 May 1805 by
        Triebenfeld for the Prince with eighteen colonists over 100 Hufen, the
        consent of the Kalisch chamber of 28 January 1806. The edition holds
        both papers: the consent of 28 January 1806 itself, and the copy of the
        lease, whose beginning is lost and which gives no day of conclusion —
        it was engrossed at Mariantów on 21 March 1806 — and in which the clause
        on draining the land and the dike on the Warta, quoted here, stands in
        no paragraph. The summons of 1860 cites a contract of 18 May 1805
        between the Prince and fourteen colonists of the gmina of Trąbczyn
        before his patrimonial court at Zagórów — the same day as Breyer's
        lease, which names eighteen takers.
      de: >-
        Die Seite erzählt den Erbpachtvertrag: am 18. Mai 1805, so Breyer, von
        Triebenfeld für den Fürsten mit achtzehn Kolonisten über 100 Hufen
        geschlossen, die Genehmigung der Kalischer Kammer vom 28. Januar 1806.
        Die Edition hält beide Papiere: die Genehmigung vom 28. Januar 1806
        selbst, und die Abschrift des Vertrags, deren Anfang verloren ist und
        die keinen Tag des Abschlusses nennt — ausgefertigt wurde sie am 21.
        März 1806 in Mariantów —, und in der die hier zitierte Klausel über die
        Entwässerung des Landes und den Damm an der Warthe in keinem Paragraphen
        steht. Die Vorladung von 1860 führt einen Vertrag vom 18. Mai 1805
        zwischen dem Fürsten und vierzehn Kolonisten der Gmina Trąbczyn vor
        seinem Patrimonialgericht zu Zagórów an — derselbe Tag wie bei Breyers
        Vertrag, der achtzehn Annehmer nennt.
      documents:
        - app539680801-2
        - app539680801-3
        - app539680783-1
    breyer1938/22:
      en: >-
        The page quotes paragraph 13 (free of hereditary subjection for ever),
        the 21 Morgen for the schoolmaster, the headman and the cemetery, the
        rent of 30 Reichsthaler a Magdeburg Hufe after four free years, and the
        settlers' pasture and wood in the Prince's heath. The copy of the lease
        agrees on the eighteen takers, on paragraph XIII, on the rent and its
        terms and on the 21 Morgen — and parts company where Breyer widens: it
        gives the settlers no claim to firewood and lets them graze only in the
        part of the Drzewce woods the lordship kept, until that too is sold.
        The suit of 1860 shows the same rights still in dispute: the colonists
        against Count Miączyński over grazing and gathering in the Studzianka
        woods.
      de: >-
        Die Seite zitiert den Paragraphen 13 (für immer frei von
        Erbuntertänigkeit), die 21 Morgen für Schullehrer, Schulzen und
        Kirchhof, den Kanon von 30 Reichstalern für die Magdeburgische Hufe
        nach vier Freijahren, und Weide und Holz der Siedler in der
        fürstlichen Heide. Die Abschrift des Vertrags stimmt in den achtzehn
        Annehmern, im Paragraph XIII, im Kanon und seinen Terminen und in den
        21 Morgen überein — und weicht ab, wo Breyer weiter fasst: sie gibt den
        Siedlern keinen Anspruch auf Brennholz und erlaubt die Hütung nur in
        dem Teil der Drzewcer Waldungen, den die Herrschaft behielt, bis auch
        dieser verkauft würde. Der Prozess von 1860 zeigt dieselben Rechte
        noch im Streit: die Kolonisten gegen den Grafen Miączyński um Hütung
        und Sammeln in den Studziankaer Wäldern.
      documents:
        - app539680801-3
        - app539680783-1

# Claude's reading, not shown: Breyer's K. G. von Weigel of Hennersdorf may or
# may not be the Breslau banker Carl Ferdinand Weigel of the letters
# or one of his family (docs/NEEDS_CONFIRMATION.md). The link stands on the
# estates and the name, and the sentence says the identity is open.
- id: breyer1938-weigel
  passages:
    - breyer1938/22
  documents:
    - oe1bu9454-220
    - oe1bu9454-284
  en: >-
    Breyer (1938) says that from 1828 the Zagórów estates were owned by K. G.
    von Weigel, a great landowner from Hennersdorf in Silesia. A Weigel stands
    in the Prince of Hohenlohe's letters long before, as a creditor on the
    same estates: in October 1811 Triebenfeld writes that everything turns on
    Weigel and Stössel taking back the Constadt estates and the mortgage on
    the Zagórów estates, and in March 1815 that "Weigel's 30,000 Thaler are
    transferred to Zagorowo". Whether the Weigel of the letters, the Breslau
    banker Carl Ferdinand Weigel, is Breyer's K. G. von Weigel, or of his
    family, is not shown.
  de: >-
    Breyer (1938) sagt, die Zagórower Güter hätten von 1828 an K. G. von
    Weigel gehört, einem Großgrundbesitzer aus Hennersdorf in Schlesien. Ein
    Weigel steht schon lange vorher in den Briefen an den Fürsten Hohenlohe,
    als Gläubiger auf denselben Gütern: im Oktober 1811 schreibt Triebenfeld,
    alles komme darauf an, dass Weigel und Stössel die Constadter Güter und
    die Hypothek auf die Zagorower Güter wieder annehmen, und im März 1815:
    "Weigel seine 30000 rt sind auf Zagorowo übertragen". Ob der Weigel der
    Briefe, der Breslauer Bankier Carl Ferdinand Weigel, Breyers K. G. von
    Weigel ist oder zu seiner Familie gehört, ist nicht erwiesen.

# Breyer's "Paul von Kolno-Prusiński", owner of Trąbczyn in 1746, is Paweł
# Prusimski, King's chamberlain and heir of Trąbczyn (the editor,
# 2026-10-20: "Paul Prusiński is indeed Paweł Prusimski"). The documents bear
# it out without Breyer: the boundary decree of 1775 (Konin Gr.145, p. 76)
# dates the Hollanders' settlement by "the rights granted them in 1746" and
# gives the settler as "the uncle of Prusimski", unnamed; the summons of 1860
# (53/968/0/-/783, p. 2) names the grantors of the privilege of 1746, "Paweł
# z Kolna Prusiński" and his wife Katarzyna z Rozdrażewskich; and the
# inspection of 1754 (Konin Gr.136), the Kuryer Polski of 1754 and
# 53/6/0/-/45 name Katarzyna z Rozdrażewskich as Paweł Prusimski's widow.
# The privilege itself is not included. Łazińsk Holland is one of the
# two Olęder colonies of the Trąbczyn estate (reference/places.yml, editor
# 2026-10-14).
- id: breyer1935gaue-hollanders
  passages:
    - breyer1935gaue/41
  documents:
    - app53170koningr145-1
    - app539680783-1
    - app53170koningr136-1
  en: >-
    Breyer (1935) says that in 1746 Paul von Kolno-Prusiński, owner of the
    Trąbczyn estate, gave the woods and waste land south of it to Hollanders in
    hereditary lease, and that the village of Łazińsk Holland arose from it, one
    of the two Olęder colonies of the estate. The privilege of 1746 itself is
    lost, but two documents cite it. The decree of the boundary commission of
    1775 says that the uncle of Antoni Prusimski, heir of Trąbczyn, settled
    Hollanders on the Trąbczyn woods, "as the rights granted them in 1746
    attest". The summons of 1860, in the lawsuit between Count Włodzimierz
    Miączyński and the colonists of the Staro- and Nowo-Łazińska colonies, names
    who granted the privilege: "Paweł z Kolna Prusiński", Breyer's Paul von
    Kolno-Prusiński, and his wife Katarzyna Rozdrażewska. The earliest record of
    the settlers themselves is the inspection of 9 July 1754, made for Katarzyna
    as the widow of Paweł Prusimski, the King's sub-chamberlain, who had died
    shortly before. It names the Olędry among the places belonging to Trąbczyn,
    counts fifteen Olęder settlers at Nowa Wieś with the sixteenth plot empty,
    and says the Olęders had taken the best wood with the plots allotted to them
    long before. That the privilege was a hereditary lease is Breyer's account;
    the two documents say only that it settled the relations between the owners
    and the Hollanders.
  de: >-
    Breyer (1935) sagt, 1746 habe Paul von Kolno-Prusiński, Besitzer des Gutes
    Trąbczyn, die Wälder und Ödländereien südlich davon an Holländer in Erbpacht
    gegeben, und daraus sei das Dorf Łazińsk Holland entstanden, eine der beiden
    Hauländereien des Gutes. Das Privileg von 1746 selbst ist verloren, aber
    zwei Dokumente führen es an. Das Dekret der Grenzkommission von 1775 sagt,
    der Onkel Antoni Prusimskis, des Erbherrn von Trąbczyn, habe Holländer auf
    den Trąbczyner Wäldern angesetzt, „wie die ihnen 1746 verliehenen Rechte
    bezeugen“. Die Ladung von 1860, im Prozess zwischen Graf Włodzimierz
    Miączyński und den Kolonisten der Kolonien Staro- und Nowo-Łazińska, nennt,
    wer das Privileg verlieh: „Paweł z Kolna Prusiński“, Breyers Paul von
    Kolno-Prusiński, und seine Frau Katarzyna Rozdrażewska. Das früheste Zeugnis
    über die Siedler selbst ist die Besichtigung vom 9. Juli 1754, vorgenommen
    für Katarzyna als Witwe des kurz zuvor verstorbenen Paweł Prusimski,
    des Königs Podkomorzy. Sie nennt die Olędry unter den zu Trąbczyn
    gehörigen Orten, zählt in Nowa Wieś fünfzehn Hauländer, die sechzehnte Hufe
    leer, und sagt, die Hauländer hätten mit den ihnen längst zugeteilten Hufen
    das beste Holz an sich genommen. Dass das Privileg eine Erbpacht war, ist
    Breyers Darstellung; die beiden Dokumente sagen nur, dass es das Verhältnis
    zwischen den Besitzern und den Holländern regelte.

- id: zychlinski1885-line
  passages:
    - zychlinski1885/187
    - zychlinski1885/188
  documents:
    - app53170koningr145-1
    - app53170koningr118-23
    - app53170koningr136-1
    - app536040-1
    - app53170koningr153-2
    - app539680783-1
  en: >-
    Żychliński (1885) gives the Trąbczyn branch of the Prusimskis: Krzysztof,
    lord of Kolno, Kamionna and Trąbczyn, and his wife Teresa Golińska; their
    son Stefan and his wife Wiktorya Malczewska; and Stefan's only son Antoni,
    Starost of Nieszczewice. The court books agree: the boundary decree
    entered in 1776 calls the late Krzysztof Prusimski, heir of Trąbczyn, the
    Starost's grandfather, and Antoni's summons of 1782 names him son of
    Stefan and Wiktoria Malczewska and grandson of Krzysztof and Teresa
    Golińska. The summons names Krzysztof's other sons Jan, Bogumił, Antoni
    and Paweł, where Żychliński has Jan Paweł, Teofil and Antoni (Bogumił is
    the Polish form of Teofil); a suit of 1728 already names Krzysztof with
    his son Antoni. The inspection of Trąbczyn of July 1754 was
    made for Katarzyna born Rozdrażewska, widow of Paweł Prusimski, the
    King's sub-chamberlain and heir of Trąbczyn; Żychliński's Paweł Apollo,
    sub-chamberlain and husband of Katarzyna Rozdrażewska, stands a generation
    higher, as Krzysztof's brother.
  de: >-
    Żychliński (1885) gibt die Trąbczyner Linie der Prusimski: Krzysztof,
    Herr auf Kolno, Kamionna und Trąbczyn, und seine Frau Teresa Golińska;
    ihren Sohn Stefan und dessen Frau Wiktorya Malczewska; und Stefans
    einzigen Sohn Antoni, Starosten von Nieszczewice. Die Gerichtsbücher
    stimmen damit überein: das 1776 eingetragene Grenzdekret nennt den
    verstorbenen Krzysztof Prusimski, Erbherrn von Trąbczyn, den Großvater
    des Starosten, und Antonis Ladung von 1782 nennt ihn Sohn Stefans und
    der Wiktoria Malczewska und Enkel Krzysztofs und der Teresa Golińska. Die
    Ladung nennt als Krzysztofs andere Söhne Jan, Bogumił, Antoni und Paweł,
    wo Żychliński Jan Paweł, Teofil und Antoni hat (Bogumił ist die polnische
    Form von Teofil); ein Prozess von 1728 nennt schon Krzysztof mit seinem
    Sohn Antoni. Die Besichtigung von Trąbczyn vom Juli 1754 wurde für
    Katarzyna geborene Rozdrażewska vorgenommen, die Witwe des Paweł
    Prusimski, des Königs Podkomorzy und Erbherrn von Trąbczyn;
    Żychlińskis Paweł Apollo, Podkomorzy und Ehemann der Katarzyna
    Rozdrażewska, steht eine Generation höher, als Bruder Krzysztofs.
  about:
    zychlinski1885/187:
      en: >-
        Żychliński gives Krzysztof, lord of Kolno, Kamionna and Trąbczyn, with
        Teresa Golińska. The documents bear him out and put the generations
        right: the boundary decree entered in 1776 calls the late Krzysztof
        Prusimski, heir of Trąbczyn, the Starost's grandfather (Konin Gr. 145);
        a suit of 1728 already names Krzysztof with his son Antoni (APP
        53/6/0/-/40); and the inspection of 1754 was made for Katarzyna born
        Rozdrażewska, widow of Paweł Prusimski, the King's sub-chamberlain —
        Żychliński's Paweł Apollo and his Katarzyna Rozdrażewska stand a
        generation higher, as Krzysztof's brother (Konin Gr. 136).
      de: >-
        Żychliński gibt Krzysztof, Herrn auf Kolno, Kamionna und Trąbczyn, mit
        Teresa Golińska. Die Dokumente tragen ihn und rücken die Generationen
        zurecht: das 1776 eingetragene Grenzdekret nennt den verstorbenen
        Krzysztof Prusimski, Erbherrn von Trąbczyn, den Großvater des Starosten
        (Konin Gr. 145); ein Prozess von 1728 nennt schon Krzysztof mit seinem
        Sohn Antoni (APP 53/6/0/-/40); und die Besichtigung von 1754 wurde für
        Katarzyna geborene Rozdrażewska vorgenommen, die Witwe des Paweł
        Prusimski, des Königs Podkomorzy — Żychlińskis Paweł Apollo und seine
        Katarzyna Rozdrażewska stehen eine Generation höher, als Bruder
        Krzysztofs (Konin Gr. 136).
    zychlinski1885/188:
      en: >-
        Żychliński carries the branch through Stefan and Wiktoria Malczewska to
        Antoni, Starost of Nieszczewice, and his daughter Michalina, whose
        marriages brought Trąbczyn to the Miączyńskis. The relatio of September
        1782 (Konin Gr. 118) names Antoni son of Stefan and Wiktoria Malczewska,
        sole heir after the childless deaths of his brothers Jan, Bogumił,
        Antoni and Paweł — where Żychliński has Jan Paweł, Teofil and Antoni,
        Bogumił being the Polish form of Teofil — and styles him, as the
        delivery of November 1782 does (Konin Gr. 153), Captain of
        Nieszczewice and Knight of the Order of St Stanislaus. The summons of
        1860 (APP 53/968/0/-/783) is issued at the demand of Count Włodzimierz
        Miączyński as heir of the Trąbczyn estates, where Żychliński writes
        that her grandson Władysław holds the estate.
      de: >-
        Żychliński führt die Linie über Stefan und Wiktoria Malczewska zu
        Antoni, Starosten von Nieszczewice, und seiner Tochter Michalina, deren
        Ehen Trąbczyn zu den Miączyński brachten. Die Relatio vom September
        1782 (Konin Gr. 118) nennt Antoni Sohn Stefans und der Wiktoria
        Malczewska, alleinigen Erben nach dem kinderlosen Ableben seiner
        Brüder Jan, Bogumił, Antoni und Paweł — wo Żychliński Jan Paweł, Teofil
        und Antoni hat, Bogumił die polnische Form von Teofil — und nennt ihn,
        wie die Übergabe vom November 1782 (Konin Gr. 153), Hauptmann von
        Nieszczewice und Ritter des St. Stanislaus-Ordens. Die Vorladung von
        1860 (APP 53/968/0/-/783) ergeht auf Verlangen des Grafen Włodzimierz
        Miączyński als Erbherr der Trąbczyner Güter, wo Żychliński schreibt,
        ihr Enkel Władysław besitze das Gut.

# The letters write Michalina's second married name Moscinska and her husband
# Moscinski; the edition takes both for Miączyński (reference/people.yml).
# The date of the marriage, 1809 here against "about 1814" in the edition's
# biography, is put to the editor (docs/NEEDS_CONFIRMATION.md).
- id: zychlinski1891-marriage
  passages:
    - zychlinski1891/221
  documents:
    - oe1bu9454-242
    - oe1bu9454-266
    - oe1bu9454-265b
    - oe1bu9454-1
    - oe1bu9454-270
  en: >-
    Żychliński (1891) says that Michalina, born Prusimska, the widow of
    Count Józef Dąmbski, married Count Stanisław Miączyński in August 1809
    and brought him the Trąbczyn estates. In the letters to and from the
    Prince of Hohenlohe of 1814 and 1815 she is "the Moscinska born
    Prusimska", who holds the estates given back to her in 1807 and stands
    high in favour with the Russian governor general Lanskoy; a letter of 2
    February 1815 says that "Moscinski, husband of the born Prusimska" and
    Lanskoy are bosom friends. Moscinski is the letters'
    form of Miączyński. The letters give no date for the marriage.
  de: >-
    Żychliński (1891) sagt, Michalina geborene Prusimska, die Witwe des
    Grafen Józef Dąmbski, habe im August 1809 den Grafen Stanisław
    Miączyński geheiratet und ihm die Güter von Trąbczyn zugebracht. In den
    Briefen an und von dem Fürsten Hohenlohe aus den Jahren 1814 und 1815 ist
    sie "die Moscinska geborene Prusimska", die die ihr 1807 zurückgegebenen
    Güter besitzt und beim russischen Generalgouverneur Lanskoy in hoher
    Gunst steht; ein Brief vom 2. Februar 1815 sagt, "Moscinski, Ehemann der
    geborenen Prusimska; und Graf Lanskoy, sind Busenfreunde". Moscinski ist die Form, in der die Briefe Miączyński schreiben. Die
    Briefe nennen kein Datum der Heirat.

# Claude's reading: if Cattaneo's dispatch and Żychliński's footnote speak of
# the same death, Żychliński's year is wrong; put to the editor
# (docs/NEEDS_CONFIRMATION.md).
- id: zychlinski1891-maryanna
  passages:
    - zychlinski1891/221
  documents:
    - ihagrrep7cnr1414-2
  en: >-
    Żychliński (1891) says in a footnote that Maryanna born Dąmbska, Antoni
    Prusimski's wife, died at Padua on 2 September 1797, aged 38, and was
    buried in the church of St Anthony there. The Prussian resident at
    Venice, Count Cattaneo, reported on 14 December 1796 that Prusimski had
    come to him in ruined health and dulled almost to stupor by the death of
    his wife. If both speak of the same death, it came before December 1796,
    and Żychliński's year 1797 cannot stand.
  de: >-
    Żychliński (1891) sagt in einer Fußnote, Maryanna geborene Dąmbska,
    Antoni Prusimskis Frau, sei am 2. September 1797 in Padua im Alter von 38
    Jahren gestorben und in der Kirche des heiligen Antonius dort begraben
    worden. Der preußische Resident in Venedig, Graf Cattaneo, berichtete am
    14. Dezember 1796, Prusimski sei in zerrütteter Gesundheit zu ihm
    gekommen, vom Tod seiner Frau fast bis zur Stumpfheit betroffen. Sprechen
    beide vom selben Tod, so fiel er vor den Dezember 1796, und Żychlińskis
    Jahr 1797 kann nicht stimmen.

- id: zychlinski1891-wlodzimierz
  passages:
    - zychlinski1891/222
  documents:
    - app539680783-1
  en: >-
    Żychliński (1891) says that Count Włodzimierz Miączyński, an officer of
    1831, held the Trąbczyn estate, which he bought from his brother
    Mieczysław after his return from exile, and that he died at Trąbczyn,
    unmarried, in December 1879. The printed summons of 19 October
    1860 is issued at the demand of "Włodzimierz Count Miączyński, heir of the
    Trąbczyn estates, living in the village of Trąbczyn", in his
    counterclaim against the colonists of Trąbczyn.
  de: >-
    Żychliński (1891) sagt, Graf Włodzimierz Miączyński, Offizier von 1831,
    habe das Gut Trąbczyn besessen, das er nach seiner Rückkehr aus dem Exil
    von seinem Bruder Mieczysław kaufte, und sei im Dezember 1879 unverheiratet
    in Trąbczyn gestorben. Die gedruckte Ladung vom 19. Oktober
    1860 ergeht auf Verlangen "Włodzimierza Hrabiego Miączyńskiego, dziedzica
    dóbr Trąbczyna" (des Grafen Włodzimierz Miączyński, Erbherrn der Güter
    Trąbczyn), in seiner Widerklage gegen die Kolonisten von Trąbczyn.

- id: pachonski1982-venice
  passages:
    - pachonski1982/583
  documents:
    - ihagrrep7cnr1414-2
    - ihagrrep7cnr1414-1
    - ihagrrep7cnr1414-3
  en: >-
    The Polski Słownik Biograficzny (Pachoński, 1982) says that Antoni Prusimski
    fled to Venice with his wife at the end of 1794, stayed active there after
    the Peace of Basel, as Hoym reported on 9 May 1796, and was driven out to
    Mantua by the Austrians in the middle of March 1797. The file of the foreign
    department falls in those months. It holds the dispatch of the Prussian
    resident at Venice, Count Cattaneo, of 14 December 1796, on Prusimski's
    ruined health and his request for a certificate that he could not travel,
    and the department's letter of 11 January 1797 passing it to the ministers
    Hoym and Schroetter. Schrötter replied on 29 January 1797 that it was not
    known whether Prusimski was settled in New East Prussia or in South Prussia.
    Hoym's report of May 1796 is not in the file.
  de: >-
    Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, Antoni Prusimski sei
    Ende 1794 mit seiner Frau nach Venedig geflohen, dort auch nach dem Basler
    Frieden tätig geblieben, wie Hoym am 9. Mai 1796 meldete, und Mitte März
    1797 von den Österreichern nach Mantua vertrieben worden. Die Akte des
    auswärtigen Departements fällt in diese Monate. Sie enthält die Depesche des
    preußischen Residenten in Venedig, Graf Cattaneo, vom 14. Dezember 1796 über
    Prusimskis zerrüttete Gesundheit und seine Bitte um ein Attest, dass er
    nicht reisen könne, und das Schreiben des Departements vom 11. Januar 1797,
    das sie den Ministern Hoym und Schroetter mitteilt. Schrötter antwortete am
    29. Januar 1797, es stehe nicht fest, ob Prusimski in Neuostpreußen oder in
    Südpreußen angesessen sei. Hoyms Bericht vom Mai 1796 ist nicht in der Akte.

- id: pachonski1982-commission
  passages:
    - pachonski1982/583
  documents:
    - app53170koningr145-1
  en: >-
    The Polski Słownik Biograficzny (Pachoński, 1982) says that the Sejm of
    1773-1775 appointed several commissions to settle disputes over Antoni
    Prusimski's estates, Trąbczyn among them. The commission for Trąbczyn was
    appointed by an act of the Sejm recorded at Warsaw on 1 June 1774 to decide
    the boundary between Trąbczyn and the Chełmskis' Łukomia. Its decree shows
    it sitting on the disputed ground in September 1775 and finding Prusimski's
    boundary line the better.
  de: >-
    Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, der Sejm von
    1773-1775 habe mehrere Kommissionen zur Entscheidung von Streitigkeiten über
    Antoni Prusimskis Güter eingesetzt, darunter über Trąbczyn. Die Kommission
    für Trąbczyn wurde durch eine am 1. Juni 1774 in Warschau eingetragene
    Konstitution des Sejm eingesetzt, um die Grenze zwischen Trąbczyn und dem
    Łukomia der Chełmski zu entscheiden. Ihr Dekret zeigt sie im September 1775
    auf dem strittigen Grund tagend und Prusimskis Grenzlinie für die bessere
    befindend.

- id: pachonski1982-confiscation
  passages:
    - pachonski1982/583
  documents:
    - ihagrrep7cnr3570-1
  en: >-
    The Polski Słownik Biograficzny (Pachoński, 1982) says that after the rising
    of 1794 the Prussian government declared Antoni Prusimski a rebel and
    confiscated his property, and calls General Hohenlohe-Ingelfingen the holder
    of the estate confiscated from him. In the file of July and August 1796 Hoym
    proposes to give the Prince of Hohenlohe-Ingelfingen the estates confiscated
    from "the chief insurgent Anton von Prusimski", Kamionna, Kolno and Trąbczyn
    among them. To Colonel von Sanitz he proposes the villages of Pawłów,
    Dzwonów and Beerenbusch, which the PSB names among the estates the Sejm's
    commissions were to settle. The King's order approves.
  de: >-
    Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, nach dem Aufstand
    von 1794 habe die preußische Regierung Antoni Prusimski zum Rebellen erklärt
    und sein Vermögen konfisziert, und nennt General Hohenlohe-Ingelfingen den
    Inhaber des ihm konfiszierten Gutes. In der Akte vom Juli und August 1796
    schlägt Hoym vor, dem Fürsten von Hohenlohe-Ingelfingen die „dem
    Haupt-Insurgenten Anton von Prusimski“ konfiszierten Güter zu geben,
    darunter Kamionna, Kolno und Trąbczyn. Dem Obristen von Sanitz schlägt er
    die Dörfer Pawłów, Dzwonów und Beerenbusch vor, die der PSB unter den Gütern
    nennt, über die die Kommissionen des Sejm entscheiden sollten. Die
    Kabinettsorder genehmigt es.

- id: pachonski1982-restitution
  passages:
    - pachonski1982/583
  documents:
    - agad11740273-2
    - agad11740273-3
    - agad11740273-4
    - agad11740273-1
    - agad1174016-2
  en: >-
    The Polski Słownik Biograficzny (Pachoński, 1982) says that after Prussia's
    defeat, while General Hohenlohe-Ingelfingen, the holder of the estate
    confiscated from Antoni Prusimski, was a prisoner of the French, efforts
    were renewed to have the lost estates given back to his family. They were
    made at Dresden in July 1807. His daughter Michalina Dąbska petitioned the
    Governing Commission and Napoleon for Trąbczyn, Kamionna, Kolno and Pawłowo,
    confiscated for the Prussian generals Hohenlohe, Bischoffswerder and Sanitz,
    and the commission's resolution of 21 July 1807 extended to her the
    Emperor's decree given at Finckenstein for Wybicki.
  de: >-
    Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, nach der Niederlage
    Preußens, als General Hohenlohe-Ingelfingen, der Inhaber des Antoni
    Prusimski konfiszierten Gutes, Gefangener der Franzosen war, seien die
    Bemühungen erneuert worden, der Familie die verlorenen Güter zurückzugeben.
    Sie wurden im Juli 1807 in Dresden unternommen. Seine Tochter Michalina
    Dąbska bat die Regierungskommission und Napoleon um Trąbczyn, Kamionna,
    Kolno und Pawłowo, konfisziert zugunsten der preußischen Generale Hohenlohe,
    Bischoffswerder und Sanitz, und der Beschluss der Kommission vom 21. Juli
    1807 dehnte das in Finckenstein für Wybicki ergangene Dekret des Kaisers auf
    sie aus.

# Chodyła (2015), the Olęder settlements of the Pyzdry Forest (2026-10-21).
# Every figure, name and date below was read in the book and in the
# document. Where they differ the sentence says so, the edition keeps to the
# document (the editor, 2026-10-21: "Always take the facts/dates from primary
# documents over literary sources, and flag when there's a discrepancy"), and
# docs/NEEDS_CONFIRMATION.md and literature/chodyla2015/notes.md record it.

- id: chodyla2015-founding-1746
  passages:
    - chodyla2015/28
    - chodyla2015/29
    - chodyla2015/30
  documents:
    - app53170koningr145-1
    - app539680783-1
  en: >-
    Chodyła (2015) dates the oldest Olęder settlements of the Pyzdry Forest, the
    Trąbczyńskie Stare Olędry and the Luśnie Olędry, to 1746, founded by Paweł
    and Katarzyna Prusimski by a charter that does not survive, and shows two
    folios of the boundary decree (Konin Gr.145, fols. 681 and 692) as the
    evidence. The decree says that the uncle of Antoni Prusimski settled
    Hollanders on the woods Miąsykąt, Dziadulina and Luśnie, which run from the
    Stawisko towards Czarny Bród, "as the rights granted them in 1746 attest";
    it does not name Katarzyna. The summons of 1860, which the book also cites,
    names both grantors, "Paweł z Kolna Prusiński" and his wife Katarzyna z
    Rozdrażewskich. The book calls the decree that of 1776, the year it was
    entered in the court books, though the commission sat from 13 September
    1775. It also has the colonists of 1860 at law with Count Władysław
    Miączyński (note 34), where the summons was issued at the request of Count
    Włodzimierz Miączyński.
  de: >-
    Chodyła (2015) setzt die ältesten Olęder-Siedlungen der Pyzdry-Heide, die
    Trąbczyńskie Stare Olędry und die Luśnie Olędry, in das Jahr 1746, gegründet
    von Paweł und Katarzyna Prusimski mit einem nicht erhaltenen Privileg, und
    zeigt als Beleg zwei Blätter des Grenzdekrets (Konin Gr.145, Bl. 681 und
    692). Das Dekret sagt, der Onkel Antoni Prusimskis habe auf den Wäldern
    Miąsykąt, Dziadulina und Luśnie, die sich vom Stawisko gegen Czarny Bród
    ziehen, Holländer angesiedelt, „wie es die ihnen 1746 verliehenen Rechte
    bezeugen“; Katarzyna nennt es nicht. Die Vorladung von 1860, die das Buch
    ebenfalls anführt, nennt beide Verleiher, „Paweł z Kolna Prusiński“ und
    seine Frau Katarzyna z Rozdrażewskich. Das Buch nennt das Dekret das von
    1776, dem Jahr seiner Eintragung in die Gerichtsbücher, obwohl die
    Kommission seit dem 13. September 1775 tagte. Nach dem Buch (Anm. 34)
    stritten die Kolonisten 1860 mit Graf Władysław Miączyński, während die
    Vorladung auf Antrag des Grafen Włodzimierz Miączyński erging.
  about:
    chodyla2015/28:
      en: >-
        The page gives the founding of 1746 by Paweł and Katarzyna Prusimscy
        under a charter that does not survive, and the boundary decree of 1776
        as its evidence. The edition holds the decree itself, the oblatum of
        23 September 1776 read at Brześć Kujawski: it says the uncle of Antoni
        Prusimski settled Hollanders on the woods Miąsykąt, Dziadulina and
        Luśnie, "as the rights granted them in 1746 attest", and does not name
        Katarzyna; the summons of 1860, which the page also cites, names both
        grantors, "Paweł z Kolna Prusiński" and his wife Katarzyna z
        Rozdrażewskich. The book calls the decree one of 1776, the year of its
        entry in the court books, though the commission sat from 13 September
        1775. Its note 34 puts the colonists' suit of 1860 against Count
        Władysław Miączyński, where the summons was issued at the demand of
        Count Włodzimierz Miączyński.
      de: >-
        Die Seite gibt die Gründung von 1746 durch Paweł und Katarzyna Prusimscy
        mit einem nicht erhaltenen Privileg und das Grenzdekret von 1776 als
        ihren Beleg. Die Edition hält das Dekret selbst, das Oblatum vom 23.
        September 1776, zu Brześć Kujawski verlesen: es sagt, der Onkel Antoni
        Prusimskis habe Holländer auf den Wäldern Miąsykąt, Dziadulina und
        Luśnie angesiedelt, „wie die ihnen 1746 verliehenen Rechte bezeugen",
        und nennt Katarzyna nicht; die Vorladung von 1860, die die Seite auch
        anführt, nennt beide Verleiher, „Paweł z Kolna Prusiński" und seine Frau
        Katarzyna z Rozdrażewskich. Das Buch nennt das Dekret das von 1776, dem
        Jahr seiner Eintragung in die Gerichtsbücher, obwohl die Kommission seit
        dem 13. September 1775 tagte. Seine Anmerkung 34 läßt die Kolonisten
        1860 gegen Graf Władysław Miączyński streiten, während die Vorladung auf
        Verlangen des Grafen Włodzimierz Miączyński erging.
    chodyla2015/29:
      en: >-
        The figure shows fol. 681 of the decree, and the edition prints the
        decree whole: the oblatum of 23 September 1776, read at Brześć Kujawski,
        between Trąbczyn of Antoni Prusimski, Łukom of Stanisław Chełmski and
        Drzewce of the Łąd convent, its text running the boundary past the wood
        Luśnie and the Stawisko.
      de: >-
        Die Abbildung zeigt Blatt 681 des Dekrets, und die Edition druckt das
        Dekret ganz: das Oblatum vom 23. September 1776, zu Brześć Kujawski
        verlesen, zwischen Trąbczyn des Antoni Prusimski, Łukom des Stanisław
        Chełmski und Drzewce des Stifts Łąd, sein Text die Grenze am Wald
        Luśnie und am Stawisko entlangführend.
      documents:
        - app53170koningr145-1
    chodyla2015/30:
      en: >-
        The figure shows fol. 692 of the decree, and the edition prints the
        decree whole: the oblatum of 23 September 1776, read at Brześć Kujawski,
        between Trąbczyn of Antoni Prusimski, Łukom of Stanisław Chełmski and
        Drzewce of the Łąd convent, its text running the boundary past the wood
        Luśnie and the Stawisko.
      de: >-
        Die Abbildung zeigt Blatt 692 des Dekrets, und die Edition druckt das
        Dekret ganz: das Oblatum vom 23. September 1776, zu Brześć Kujawski
        verlesen, zwischen Trąbczyn des Antoni Prusimski, Łukom des Stanisław
        Chełmski und Drzewce des Stifts Łąd, sein Text die Grenze am Wald
        Luśnie und am Stawisko entlangführend.
      documents:
        - app53170koningr145-1

- id: chodyla2015-inspection-1754
  passages:
    - chodyla2015/28
    - chodyla2015/84
  documents:
    - app53170koningr136-1
  en: >-
    Chodyła (2015) quotes the inspection of the Trąbczyn estate made at
    Katarzyna Prusimska's request in 1754 (Konin Gr.136): fifteen Olęders, the
    sixteenth huba empty, some well built and the others with only huts in the
    ground, and the oaks taken by the Olęders with the hubas long allotted to
    each of them. The transcription of the inspection, dated 9 July 1754, has
    the same words but one: it reads "drudzy" where the book prints "drugi (!)".
    The inspection counts the fifteen Olęders under Nowa Wieś ("Wieś Nowa"). It
    does not name the wood Lusina, the twelve Olęders or the inn that the book
    (p. 28) gives with it; those are in the act of 1771 (Kalisz Gr.414).
  about:
    chodyla2015/28:
      en: >-
        The page quotes the inspection of 1754: fifteen Olęders, the sixteenth
        huba empty, some well built, others with only huts in the ground, and
        the oaks taken with the hubas long allotted. The edition holds the
        inspection itself, made at Trąbczyn on 9 July 1754 at the request of
        Katarzyna née Rozdrażewska Prusimska, widow of the recently deceased
        Paweł Prusimski, the King's sub-chamberlain: the same words but one,
        "drudzy" where the book prints "drugi (!)" — and it counts the fifteen
        Olęders under Nowa Wieś, without the wood Lusina, the twelve Olęders
        or the inn that the page gives with them.
      de: >-
        Die Seite zitiert die Besichtigung von 1754: fünfzehn Olęder, die
        sechzehnte Hufe leer, die einen gut gebaut, die anderen nur mit Hütten
        in der Erde, und die Eichen, mit den längst zugeteilten Hufen genommen.
        Die Edition hält die Besichtigung selbst, zu Trąbczyn am 9. Juli 1754
        auf Antrag der Katarzyna geborene Rozdrażewska Prusimska vorgenommen,
        der Witwe des kurz zuvor verstorbenen Paweł Prusimski, des Königs
        Podkomorzy: dieselben Worte bis auf eines, „drudzy", wo das Buch
        „drugi (!)" druckt — und sie zählt die fünfzehn Olęder unter Nowa Wieś,
        ohne den Wald Lusina, die zwölf Olęder und die Schenke, die die Seite
        dazu gibt.
    chodyla2015/84:
      en: >-
        The summary quotes the inspection again, "Olędrów 15, szesnasta huba
        próżna" — sixteen hubas, one unoccupied. The document reads the same
        and dates itself: the wizja of 9 July 1754, taken at Katarzyna
        Prusimska's request, the widow of Paweł Prusimski.
      de: >-
        Die Zusammenfassung zitiert die Besichtigung noch einmal, „Olędrów 15,
        szesnasta huba próżna" — sechzehn Hufen, eine unbesetzt. Das Dokument
        liest sich genauso und datiert sich selbst: die Wizja vom 9. Juli 1754,
        auf Antrag der Katarzyna Prusimska genommen, der Witwe des Paweł
        Prusimski.
  de: >-
    Chodyła (2015) zitiert die Besichtigung des Gutes Trąbczyn, 1754 auf Antrag
    Katarzyna Prusimskas vorgenommen (Konin Gr.136): fünfzehn Olęder, die
    sechzehnte Hufe leer, die einen gut gebaut, die anderen nur mit Erdhütten,
    und die Eichen, die die Olęder mit den jedem von ihnen längst zugeteilten
    Hufen genommen hätten. Die Transkription, datiert vom 9. Juli 1754, hat
    dieselben Worte bis auf eines: Sie liest „drudzy“, wo das Buch „drugi (!)“
    druckt. Die Besichtigung zählt die fünfzehn Olęder unter Nowa Wieś („Wieś
    Nowa“). Sie nennt weder den Wald Lusina noch die zwölf Olęder und die
    Schenke, die das Buch (S. 28) dazu angibt; diese stehen in der Urkunde von
    1771 (Kalisz Gr.414).

- id: chodyla2015-tradition-1771
  passages:
    - chodyla2015/28
    - chodyla2015/31
    - chodyla2015/83
  documents:
    - app53150kaliszgr414-1
  en: >-
    Chodyła (2015) says that in 1771 a part of the Trąbczyn estate, with the
    Olęder settlement founded "not very long ago" in the wood Luśnie, was
    handed over to Stanisław Chełmski of Łukomia by a court's execution, and
    that it then had twelve Olęders with a shepherd. The act of 4 November
    1771 (Kalisz Gr.414) hands over to Chełmski the wood
    "Luśnię" and the Olędry "ufundowane niezbyt dawnym czasem", an inn with a
    new stable but no host, and twelve people by name, the shepherd
    Brudzewski among them: Michał Kinos, Chenryk Bedka, Jan and Krystyan
    Tulka, Bogusław Celmer, Samól Frinderberg, Bogusław Effthman,
    Krzysztofowa Kulawa, Maci Klinczpor, Antoni Pisarz and Wawrzyń Welner.
  de: >-
    Chodyła (2015) sagt, 1771 sei ein Teil des Gutes Trąbczyn mit der
    „unlängst“ im Wald Luśnie gegründeten Olęder-Siedlung durch gerichtliche
    Vollstreckung an Stanisław Chełmski von Łukomia übergeben worden, und sie
    habe damals zwölf Olęder und einen Schäfer gehabt. Die Urkunde vom 4.
    November 1771 (Kalisz Gr.414) übergibt Chełmski den Wald
    „Luśnię“ und die „ufundowane niezbyt dawnym czasem“ Olędry, eine Schenke
    mit neuem Stall ohne Wirt und zwölf Personen mit Namen, darunter den
    Schäfer Brudzewski: Michał Kinos, Chenryk Bedka, Jan und Krystyan Tulka,
    Bogusław Celmer, Samól Frinderberg, Bogusław Effthman, Krzysztofowa
    Kulawa, Maci Klinczpor, Antoni Pisarz und Wawrzyń Welner.
  about:
    chodyla2015/28:
      en: >-
        The page's telling of 1771 — a part of the Trąbczyn estate with the
        Olęder settlement founded "not very long ago" in the wood Luśnie handed
        to Stanisław Chełmski by a court's execution, twelve Olęders with a
        shepherd — rests on the act of tradition the edition holds: Kalisz Gr.
        414, 4 November 1771, performed in the bór of Luśnie, the inn with its
        new stable but no host delivered first, then the twelve by name, the
        shepherd Brudzewski among them.
      de: >-
        Die Erzählung der Seite von 1771 — ein Teil des Gutes Trąbczyn mit der
        „unlängst" im Wald Luśnie gegründeten Olęder-Siedlung durch
        gerichtliche Vollstreckung an Stanisław Chełmski übergeben, zwölf
        Olęder mit einem Schäfer — ruht auf der Übergabeurkunde, die die
        Edition hält: Kalisz Gr. 414, 4. November 1771, im Bór von Luśnie
        vorgenommen, zuerst die Schenke mit ihrem neuen Stall ohne Wirt
        übergeben, dann die zwölf mit Namen, der Schäfer Brudzewski unter
        ihnen.
    chodyla2015/31:
      en: >-
        The page cites the act of tradition of 4 November 1771 in two copies
        (Konin Gr. 142 and Kalisz Gr. 414) and its twelve Olęders, ten with
        German and two with Polish names. The edition's copy is the Kalisz one:
        the same twelve by name — Michał Kinos, Chenryk Bedka, Jan and
        Krystyan Tulka, Bogusław Celmer, Samól Frinderberg, Bogusław Effthman,
        Krzysztofowa Kulawa, Maci Klinczpor, Antoni Pisarz, Wawrzyń Welner —
        with the shepherd Brudzewski, enjoined to obey Chełmski.
      de: >-
        Die Seite führt die Übergabeurkunde vom 4. November 1771 in zwei
        Abschriften an (Konin Gr. 142 und Kalisz Gr. 414) und ihre zwölf
        Olęder, zehn mit deutschen und zwei mit polnischen Namen. Die
        Abschrift der Edition ist die Kalischer: dieselben zwölf mit Namen —
        Michał Kinos, Chenryk Bedka, Jan und Krystyan Tulka, Bogusław Celmer,
        Samól Frinderberg, Bogusław Effthman, Krzysztofowa Kulawa, Maci
        Klinczpor, Antoni Pisarz, Wawrzyń Welner — mit dem Schäfer Brudzewski,
        zum Gehorsam gegen Chełmski angewiesen.
    chodyla2015/83:
      en: >-
        The survey counts the Luśnie (Łukomskie) Olędry at twelve Olęders with
        a shepherd in 1771. The act of tradition of 4 November 1771 (Kalisz Gr.
        414) delivers the twelve by name into Chełmski's obedience, the
        shepherd Brudzewski among them.
      de: >-
        Die Übersicht zählt die Luśnier (Łukomskie) Olędry auf zwölf Olęder
        mit einem Schäfer im Jahr 1771. Die Übergabeurkunde vom 4. November
        1771 (Kalisz Gr. 414) überantwortet die zwölf mit Namen in Chełmskis
        Gehorsam, den Schäfer Brudzewski unter ihnen.

- id: chodyla2015-hunt-1782
  passages:
    - chodyla2015/28
  documents:
    - app53170koningr153-1
    - app53170koningr153-2
  en: >-
    Chodyła (2015, note 34) cites a decree of the commission court in the
    suit between Antoni Prusimski and Stanisław Chełmski, "held on 17
    October 1782 in the house of the Olęder Marcin Hunt in the Trąmpczyńskie
    Olędry", ordering Hunt's farm joined to Prusimski's Trąbczyn estate. In Konin Gr.153, 17 October 1782 is the date of the Crown
    Tribunal's decree at Piotrków, which ordered Chełmski to restore Hunt to
    Prusimski's possession within six weeks; the commissary Józef
    Łukaszewicz came to Hunt's house on 28 November 1782 and put him into
    Prusimski's possession.
  de: >-
    Chodyła (2015, Anm. 34) führt ein Dekret des Kommissionsgerichts im
    Streit zwischen Antoni Prusimski und Stanisław Chełmski an, „am 17.
    Oktober 1782 im Haus des Olęders Marcin Hunt in den Trąmpczyńskie
    Olędry“ gehalten, das Hunts Hof dem Gut Trąbczyn Prusimskis zuschlug. In Konin Gr.153 ist der 17. Oktober 1782 das Datum des Dekrets
    des Krontribunals in Petrikau, das Chełmski befahl, Hunt binnen sechs
    Wochen in Prusimskis Besitz zurückzugeben; der Kommissar Józef
    Łukaszewicz kam am 28. November 1782 in Hunts Haus und wies ihn in
    Prusimskis Besitz ein.

- id: chodyla2015-register-1797
  passages:
    - chodyla2015/32
    - chodyla2015/84
  documents:
    - agad1169011745-1
  en: >-
    Chodyła (2015) cites the register of houses and population of the
    General Directory of South Prussia (AGAD, no. 1745), which it dates
    1796: "Łazy H." with 5 houses (p. 401), and "Trąbczyn H." with 34
    houses and "Stara Huta Trąbczyn" with 2 (p. 406). These pages (AGAD 1/169/0/1/1745) have the same figures: no. 150 "Haul.
    Lazy.", 5 houses and 42 people; no. 292, the Hauland of Trąpczyn, 34
    houses and 271 people, after the village of Trąpczyn with 32; no. 283,
    Stara Huta of Trąpczyn, 2 houses. The pages carry no date, and the
    archive dates the volume 1797. The book
    takes "Łazy H." for the village of Łazy under Olęder law; a note on that entry took it to be probably the
    Łazińskie Olędry.
  about:
    chodyla2015/32:
      en: >-
        The page dates the Prussian register 1796 and takes "Łazy H." (5
        houses, p. 401) for the village of Łazy under Olęder law. The pages
        themselves carry no date — the archive dates the volume 1797 — and
        read "Haul. Lazy.", 5 houses and 42 people, no. 150 of the register. A
        note on that entry took it to be probably the Łazińskie Olędry.
      de: >-
        Die Seite datiert das preußische Register auf 1796 und hält „Łazy H."
        (5 Häuser, S. 401) für das Dorf Łazy unter Olęder-Recht. Die Seiten
        selbst tragen kein Datum — das Archiv datiert den Band auf 1797 — und
        lesen „Haul. Lazy.", 5 Häuser und 42 Menschen, Nr. 150 des Registers.
        Eine Anmerkung zu diesem Eintrag hielt ihn für wahrscheinlich die
        Łazińskie Olędry.
    chodyla2015/84:
      en: >-
        The summary's figures for 1796 — "Trąbczyn H." with 34 houses and
        "Stara Huta Trąbczyn" with 2 — are the register's own rows: no. 292,
        the Hauland of Trąpczyn, 34 houses and 271 people, after the village of
        Trąpczyn with 32; no. 283, Stara Huta of Trąpczyn, 2 houses. The pages
        carry no date; the archive dates the volume 1797, where the book says
        1796.
      de: >-
        Die Zahlen der Zusammenfassung für 1796 — „Trąbczyn H." mit 34 Häusern
        und „Stara Huta Trąbczyn" mit 2 — sind die eigenen Zeilen des
        Registers: Nr. 292, die Hauländerei von Trąpczyn, 34 Häuser und 271
        Menschen, nach dem Dorf Trąpczyn mit 32; Nr. 283, Stara Huta von
        Trąpczyn, 2 Häuser. Die Seiten tragen kein Datum; das Archiv datiert
        den Band auf 1797, wo das Buch 1796 sagt.
  de: >-
    Chodyła (2015) führt das Häuser- und Einwohnerregister des
    Generaldirektoriums von Südpreußen an (AGAD, Nr. 1745), das es auf 1796
    datiert: „Łazy H.“ mit 5 Häusern (S. 401), „Trąbczyn H.“ mit 34 Häusern
    und „Stara Huta Trąbczyn“ mit 2 (S. 406). Diese Seiten (AGAD 1/169/0/1/1745) haben dieselben Zahlen: Nr. 150 „Haul. Lazy.“, 5
    Häuser und 42 Menschen; Nr. 292, die Hauländerei von Trąpczyn, 34 Häuser
    und 271 Menschen, nach dem Dorf Trąpczyn mit 32; Nr. 283, Stara Huta von
    Trąpczyn, 2 Häuser. Die Seiten tragen kein Datum, das Archiv datiert den
    Band auf 1797. Das Buch hält „Łazy H.“
    für das Dorf Łazy unter Olęder-Recht; eine Anmerkung zu diesem Eintrag hielt es für wahrscheinlich die
    Łazińskie Olędry.

- id: chodyla2015-hearthtax-1789
  passages:
    - chodyla2015/32
    - chodyla2015/83
    - chodyla2015/84
  documents:
    - app53640kalisztab21-1
  en: >-
    Chodyła (2015) counts, from the register of the hearth tax of the Kalisz
    voivodeship for the Midsummer instalment of 1789 (Kalisz Tab.21, fol.
    20), 3 hearths at Łazy, 10 for the "Olędry Trąbczyńskie" and 13 at Nowa
    Wieś. The register gives sums of money, not hearths:
    Trąpczyn 80 zł, Łazy 12 zł 15 gr, Nowa Wieś 12 zł 15 gr, "Olendry
    Trąbczynskie" 35 zł. The hearths are the book's reckoning and do not
    follow from one rate: at 2 zł 15 gr a hearth, the rate of these leaves,
    the sums give 32 hearths at Trąbczyn, 5 each at Łazy and Nowa Wieś and
    14 for the Olędry (a calculation, not in the register).
  de: >-
    Chodyła (2015) zählt nach dem Register der Herdsteuer der Woiwodschaft
    Kalisch für die Johannisrate 1789 (Kalisz Tab.21, Bl. 20) 3 Herdstellen
    in Łazy, 10 für die „Olędry Trąbczyńskie“ und 13 in Nowa Wieś. Das
    Register gibt Geldsummen, keine Herdstellen: Trąpczyn 80
    Złoty, Łazy 12 Złoty 15 Groschen, Nowa Wieś 12 Złoty 15 Groschen,
    „Olendry Trąbczynskie“ 35 Złoty. Die Herdstellen sind eine Rechnung des
    Buches und folgen nicht aus einem Satz: bei 2 Złoty 15 Groschen je
    Herdstelle, dem Satz dieser Blätter, ergeben die Summen 32 Herdstellen in
    Trąbczyn, je 5 in Łazy und Nowa Wieś und 14 für die Olędry (eine
    Rechnung, nicht im Register).
  about:
    chodyla2015/32:
      en: >-
        The page's three hearths at Łazy are its reckoning; the register's row
        gives a sum of money — "Lazy, 12 zł 15 gr" — and no hearths.
      de: >-
        Die drei Herdstellen der Seite für Łazy sind ihre Rechnung; die Zeile
        des Registers gibt eine Geldsumme — „Lazy, 12 zł 15 gr" — und keine
        Herdstellen.
    chodyla2015/83:
      en: >-
        The page's ten hearths for the Luśnie Olędry in 1789 come from Tab. 21
        of the Kalisz hearth tax, whose row reads "Oledry Lusnie, 35" — a sum
        in złoty, not a count of hearths.
      de: >-
        Die zehn Herdstellen der Seite für die Luśnier Olędry 1789 kommen aus
        der Tab. 21 der Kalischer Herdsteuer, deren Zeile „Oledry Lusnie, 35"
        liest — eine Summe in Złoty, keine Zahl von Herdstellen.
    chodyla2015/84:
      en: >-
        The figures for 1789 (the "Olędry Trąbczyńskie" at 10 hearths, Nowa
        Wieś at 13) are reckonings from the register's sums: "Olendry
        Trabczynskie, 35", "Nowa Wies, 12 zł 15 gr", "Trapczyn, 80" — money,
        not hearths.
      de: >-
        Die Zahlen für 1789 (die „Olędry Trąbczyńskie" mit 10 Herdstellen,
        Nowa Wieś mit 13) sind Rechnungen aus den Summen des Registers:
        „Olendry Trabczynskie, 35", „Nowa Wies, 12 zł 15 gr", „Trapczyn, 80" —
        Geld, keine Herdstellen.

# Boniecki (1900), the Chełmski branch that held Łukomia (editor, 2026-10-21).
# Every name and year in these sentences was read in the book and in the
# document. The first link rests on Claude's reading that the Jerzy of the
# document is the Jerzy of the "old pedigree": the book does not say he held
# Łukom, and the document does not say whose father he was
# (docs/NEEDS_CONFIRMATION.md, "Boniecki (1900)").

- id: boniecki1900-jerzy-1644
  passages:
    - boniecki1900/c01
    - boniecki1900/c02
  documents:
    - app536036-1
    - app536040-1
  en: >-
    Boniecki (1900) finds in "an old pedigree" that Jerzy Chełmski, who
    signed the election of 1648 with the province of Kalisz, was the father
    of Krzysztof Ścibor and Andrzej Ścibor, who held Łukomia between them
    about 1700, and then doubts it. In the land court's judgment of 1644 a
    Jerzy Chełmski sues the Trąmpczyński brothers of Trąbczyn for cutting
    boundary marks into his own wood by the village of Łukom. That a Jerzy
    Chełmski held Łukom in 1644 fits the old pedigree; the judgment does not
    say whose father he was.
  de: >-
    Boniecki (1900) findet in „einem alten Stammbaum“, dass Jerzy Chełmski,
    der 1648 mit der Woiwodschaft Kalisch die Königswahl unterschrieb, der
    Vater von Krzysztof Ścibor und Andrzej Ścibor war, denen Łukomia um 1700
    gemeinsam gehörte, und bezweifelt es dann. Im Urteil des Landgerichts von
    1644 verklagt ein Jerzy Chełmski die Brüder Trąmpczyński von Trąbczyn,
    weil sie in seinem eigenen Wald beim Dorf Łukom Grenzzeichen in die
    Bäume schlagen ließen. Dass 1644 ein Jerzy Chełmski Łukom besaß, passt
    zu dem alten Stammbaum; wessen Vater er war, sagt das Urteil nicht.
  about:
    boniecki1900/c01:
      en: >-
        Boniecki doubts the old pedigree that makes Jerzy Chełmski the father
        of Krzysztof Ścibor and Andrzej Ścibor. The edition's judgment of 1644
        shows a Jerzy Chełmski holding Łukom in that year — he sues the
        Trąbczyński brothers for the boundary marks cut into his own wood by
        the village of Łukom — but it does not say whose father he was.
      de: >-
        Boniecki bezweifelt den alten Stammbaum, der Jerzy Chełmski zum Vater
        von Krzysztof Ścibor und Andrzej Ścibor macht. Das Urteil von 1644 in
        der Edition zeigt einen Jerzy Chełmski, der in jenem Jahr Łukom besitzt
        — er verklagt die Brüder Trąmpczyński von Trąbczyn, weil sie in seinem
        eigenen Wald beim Dorf Łukom Grenzzeichen in die Bäume schlagen
        ließen —, aber es sagt nicht, wessen Vater er war.
    boniecki1900/c02:
      en: >-
        Boniecki gives Krzysztof Ścibor Śladków and part of Łukomia, and his
        widow's protest of 1703 against his brother Andrzej holding Łukomia
        alone. The land court's decree of 1728 carries the story on: Franciszek
        and Józef Ścibor Chełmski, heirs of Łukom and Łomowo, at law with
        Krzysztof Prusimski of Trąbczyn and his son Antoni.
      de: >-
        Boniecki gibt Krzysztof Ścibor Śladków und einen Teil von Łukomia, und
        den Protest seiner Witwe von 1703 gegen seinen Bruder Andrzej, der
        Łukomia allein besaß. Das Dekret des Landgerichts von 1728 trägt die
        Geschichte weiter: Franciszek und Józef Ścibor Chełmski, Erbherren von
        Łukom und Łomowo, im Rechtsstreit mit Krzysztof Prusimski von Trąbczyn
        und seinem Sohn Antoni.
      documents:
        - app536040-1

- id: boniecki1900-brothers-1728
  passages:
    - boniecki1900/c04
  documents:
    - app536040-1
  en: >-
    Boniecki (1900) names Franciszek, who left no issue, and Józef as the
    sons of Andrzej Ścibor Chełmski, who held Łukomia alone in 1703, and
    knows them from a judgment of the Crown Tribunal of 1748 in the suit
    over Łukomia. In the land court's decree of 1728 the brothers Franciszek
    and Józef Ścibor Chełmski, heirs of Łukom and Łomowo, sue Krzysztof
    Prusimski of Trąbczyn, his son Antoni and their people, Józef acting
    in his own and his brother's name.
  de: >-
    Boniecki (1900) nennt Franciszek, der ohne Nachkommen blieb, und Józef
    als Söhne des Andrzej Ścibor Chełmski, dem Łukomia 1703 allein gehörte,
    und kennt sie aus einem Urteil des Krontribunals von 1748 im Streit um
    Łukomia. Im Dekret des Landgerichts von 1728 verklagen die Brüder
    Franciszek und Józef Ścibor Chełmski, Erbherren von Łukom und Łomowo,
    Krzysztof Prusimski von Trąbczyn, seinen Sohn Antoni und ihre Leute;
    Józef handelt in eigenem Namen und in dem seines Bruders.

- id: boniecki1900-brothers-1775
  passages:
    - boniecki1900/c05
  documents:
    - app53170koningr145-1
  en: >-
    Boniecki (1900) gives Józef Chełmski's sons as Heliodor and Stanisław,
    and has Heliodor parish priest of Jaksice in 1757 and canon of Poznań in
    1765. The boundary decree of 1775 (Konin Gr.145) records the citations
    served on "the Reverend Heliodor, Canon of Chełmno, and Stanisław,
    brothers by birth of the Chełmski family, heirs of the estates of
    Łukomia". In 1775 Heliodor was a canon of Chełmno, as the decree has it. Boniecki's offices are of earlier years, and the two need
    not contradict each other.
  de: >-
    Boniecki (1900) nennt als Söhne Józef Chełmskis Heliodor und Stanisław
    und macht Heliodor 1757 zum Pfarrer von Jaksice und 1765 zum Domherrn
    von Posen. Das Grenzdekret von 1775 (Konin Gr.145) verzeichnet die
    Ladungen an „den Hochwürdigen Heliodor, Domherrn von Kulm, und
    Stanisław, leibliche Brüder aus der Familie Chełmski, Erbherren der
    Güter Łukomia“. 1775 war Heliodor Domherr von Kulm, wie das Dekret es hat. Bonieckis Ämter gehören in frühere Jahre, und beides muss sich
    nicht widersprechen.

- id: boniecki1900-estates-1766
  passages:
    - boniecki1900/c03
    - boniecki1900/c06
  documents:
    - app53170koningr117-4
    - app536045-1
    - app53170koningr153-1
  en: >-
    Boniecki (1900) says that in 1766 Ignacy Chełmski sold his share of the
    family estates of Łukomia, Łomów, Mielno and Bukowe to his cousin
    Stanisław, and calls Stanisław Treasurer of Wschowa in 1779. In a
    protest entered at Konin in April 1778 (Konin Gr.117) Stanisław Ścibor
    Chełmski is already Treasurer of Wschowa and heir of "Łukomia, Łomów,
    Imielno and Bukowo": the same four estates, Mielno being Imielno. The document has the title a year earlier than Boniecki's. In 1763, before the purchase, the land court's decree
    (APP 53/6/0/-/45) has him at law with Katarzyna Prusimska while the
    boundary between Trąbczyn and Łukom was before the Crown Tribunal.
  de: >-
    Boniecki (1900) berichtet, dass Ignacy Chełmski 1766 seinen Anteil an
    den Familiengütern Łukomia, Łomów, Mielno und Bukowe an seinen Vetter
    Stanisław verkaufte, und nennt Stanisław 1779 Schatzmeister von Wschowa.
    In einem Protest, der im April 1778 in Konin eingetragen wurde (Konin
    Gr.117), ist Stanisław Ścibor Chełmski bereits Schatzmeister von Wschowa
    und Erbherr von „Łukomia, Łomów, Imielno und Bukowo“: dieselben vier
    Güter, wobei Mielno das Imielno ist. Das Dokument nennt den Titel ein Jahr früher als Boniecki. 1763, vor dem Kauf,
    zeigt ihn das Dekret des Landgerichts (APP 53/6/0/-/45) im Rechtsstreit
    mit Katarzyna Prusimska, während die Grenze zwischen Trąbczyn und Łukom
    vor dem Krontribunal lag.
  about:
    boniecki1900/c03:
      en: >-
        Boniecki's one line on the sale — in 1766 Ignacy sold his share of the
        family estates of Łukomia, Łomów, Mielno and Bukowe to his cousin
        Stanisław — is answered by the protest of April 1778 (Konin Gr. 117),
        where Stanisław Ścibor Chełmski stands as Treasurer of Wschowa, heir of
        "Łukomia, Łomów, Imielno and Bukowo": the same four estates, Mielno
        being Imielno, and the title a year earlier than Boniecki's 1779. The
        decree of 1763 (APP 53/6/0/-/45) shows him already at law with
        Katarzyna Prusimska while the Trąbczyn–Łukom boundary was before the
        Crown Tribunal.
      de: >-
        Bonieckis eine Zeile zum Verkauf — 1766 verkaufe Ignacy seinen Anteil
        an den Familiengütern Łukomia, Łomów, Mielno und Bukowe an seinen
        Vetter Stanisław — beantwortet der Protest vom April 1778 (Konin Gr.
        117), in dem Stanisław Ścibor Chełmski als Schatzmeister von Wschowa
        steht, Erbherr von „Łukomia, Łomów, Imielno und Bukowo": dieselben vier
        Güter, wobei Mielno das Imielno ist, und der Titel ein Jahr früher als
        Bonieckis 1779. Das Dekret von 1763 (APP 53/6/0/-/45) zeigt ihn schon
        im Rechtsstreit mit Katarzyna Prusimska, während die Grenze zwischen
        Trąbczyn und Łukom vor dem Krontribunal lag.
      documents:
        - app53170koningr117-4
        - app536045-1
    boniecki1900/c06:
      en: >-
        Boniecki styles Stanisław Treasurer of Wschowa in 1779. The documents
        style him so years earlier and keep him so: the protest of April 1778
        (Konin Gr. 117) calls him "Thesaurarius Vschovensius", heir of the four
        estates, and the act of 28 November 1782 (Konin Gr. 153) still has
        Stanisław Scibór Chełmski, Treasurer of Wschowa, the lord of Łukom
        beside the boundary stones.
      de: >-
        Boniecki nennt Stanisław 1779 Schatzmeister von Wschowa. Die Dokumente
        nennen ihn so Jahre früher und behalten ihm den Titel: der Protest vom
        April 1778 (Konin Gr. 117) „Thesaurarius Vschovensius", Erbherr der
        vier Güter, und die Akte vom 28. November 1782 (Konin Gr. 153) noch
        Stanisław Scibór Chełmski, Schatzmeister von Wschowa, als Herr von
        Łukom an den Grenzsteinen.
      documents:
        - app53170koningr117-4
        - app53170koningr153-1

# Łukasiewicz (1997): the modern source study of the black register. Its
# figures were read against the register's own entry (Materialien pp. 162-164)
# and against the letters already tied to it (2026-10-19); the documents' side
# of each sentence rests on that reading.

- id: lukasiewicz-triebenfeld
  passages:
    - lukasiewicz1997/44
    - lukasiewicz1997/61
  documents:
    - oe1bu9454-104
    - oe1bu9454-108
    - oe1bu9454-112
    - oe1bu9454-103
  en: >-
    Łukasiewicz (1997) tells the story of the giveaway's technical manager,
    councillor Triebenfeld. He bought his estate in 1797 for 50,000 Thaler and
    sold it in 1801 for 450,000 to the Prince of Hessen-Darmstadt, who sold it
    on the same year for 750,000 to the Saxon master of the hunt Schürding
    (after Dorow's printing of Triebenfeld's memorial); his Tabela 4 gives the
    official price as 51,000 and the sale as 400,000-750,000 (1801).
    Triebenfeld's letters to the Prince of Hohenlohe give the same valuation,
    over 700,000 (April 1799), and the same resale, 750,000 (February 1801), but
    put his own price to Prince George at 280,000, not 400,000 (July 1800).
  de: >-
    Łukasiewicz (1997) erzählt die Geschichte des technischen Leiters der
    Schenkaktion, des Rates Triebenfeld. Er kaufte sein Gut 1797 für 50.000
    Taler und verkaufte es 1801 für 450.000 an den Prinzen von Hessen-Darmstadt,
    der es im selben Jahr für 750.000 an den sächsischen Jägermeister Schürding
    weiterverkaufte (nach Dorows Druck von Triebenfelds Denkschrift); seine
    Tabelle 4 nennt den amtlichen Preis 51.000 und den Verkauf 400.000-750.000
    (1801). Triebenfelds Briefe an den Fürsten Hohenlohe nennen dieselbe Taxe,
    über 700.000 (April 1799), und denselben Weiterverkauf, 750.000 (Februar
    1801), aber als seinen eigenen Preis an den Prinzen George 280.000, nicht
    400.000 (Juli 1800).
  about:
    lukasiewicz1997/44:
      en: >-
        Łukasiewicz tells the sale chain: bought in 1797 for 50,000, sold in
        1801 for 450,000 to the Prince of Hessen-Darmstadt, resold the same
        year for 750,000 to the Saxon master of the hunt Schürding. The letters
        give the chain as its maker counted it: over 700,000 rt at the judicial
        tax against his own basis of some 500,000 (April 1799); the price to
        Prince George 280,000 (July 1800); and Prince George selling for
        750,000 (February 1801).
      de: >-
        Łukasiewicz erzählt die Verkaufskette: 1797 für 50.000 gekauft, 1801
        für 450.000 an den Prinzen von Hessen-Darmstadt verkauft, im selben
        Jahr für 750.000 an den sächsischen Jägermeister Schürding
        weiterverkauft. Die Briefe geben die Kette, wie ihr Urheber sie
        rechnete: über 700.000 rt an der Justiztaxe gegen seine eigene
        Grundlage von etwa 500.000 (April 1799); der Preis an den Prinzen
        Georg 280.000 (Juli 1800); und der Prinz Georg verkaufe für 750.000
        (Februar 1801).
      documents:
        - oe1bu9454-104
        - oe1bu9454-108
        - oe1bu9454-112
    lukasiewicz1997/61:
      en: >-
        The table's Triebenfeld row — officially 51,000, sold 400,000–750,000
        (1801) — and its Rüchel row (30,000 and 130,000) stand against the
        letters: the tax of April 1799 at over 700,000 rt, the price to Prince
        George at 280,000 (July 1800), the resale at 750,000 (February 1801);
        and Rüchel's estates sold, by the letter of 13 March 1799, for 140,000,
        where the table gives 130,000.
      de: >-
        Die Zeile der Tabelle für Triebenfeld — amtlich 51.000, verkauft
        400.000–750.000 (1801) — und ihre Zeile für Rüchel (30.000 und
        130.000) stehen gegen die Briefe: die Taxe vom April 1799 über 700.000
        rt, der Preis an den Prinzen Georg 280.000 (Juli 1800), der
        Weiterverkauf 750.000 (Februar 1801); und Rüchels Güter, nach dem
        Brief vom 13. März 1799, für 140.000 verkauft, wo die Tabelle 130.000
        gibt.
      documents:
        - oe1bu9454-104
        - oe1bu9454-108
        - oe1bu9454-112
        - oe1bu9454-103

- id: lukasiewicz-hohenlohe
  passages:
    - lukasiewicz1997/55
  documents:
    - oe1bu9454-85
    - oe1bu9454-86
    - oe1bu9454-87
    - oe1bu9454-97
    - oe1bu9454-101
  en: >-
    Łukasiewicz's Tabela 1 sets out the register's row for the Prince of
    Hohenlohe: officially 89,250 Thaler, "true value" 800,000, and the
    register's own note that the estates bring 50,000 Thlr. of income a year,
    where the late King had consented only to a gift yielding 6,000.
    The letters bear the same figures out and go past them: the King's
    refusal of December 1798 on Voss's report (estates valued at a yield of
    8,650 a year now bring 40,500), the Prince's answer (his estates yield
    41,500, Krotoszyn's rent is 30,100) and his later petition.
  de: >-
    Łukasiewiczs Tabelle 1 gibt die Zeile des Registers für den Fürsten
    Hohenlohe wieder: amtlich 89.250 Taler, „wahrer Wert“ 800.000, und die
    eigene Notiz des Registers, dass die Güter jährlich 50.000 Taler Ertrag
    bringen, wo der verstorbene König nur einer Schenkung von 6.000
    zugestimmt hatte. Die Briefe bestätigen dieselben
    Zahlen und gehen darüber hinaus: die Ablehnung des Königs vom Dezember
    1798 auf den Bericht von Voss (die auf 8.650 Taler Jahresertrag
    veranschlagten Güter bringen jetzt 40.500), die Antwort des Fürsten
    (seine Güter trügen 41.500, die Pacht von Krotoszyn sei 30.100) und
    seine spätere Eingabe.

# Dorow (1843): the volume prints, from a manuscript Triebenfeld gave him in
# 1813, the war councillor's own memoir on the classifications and the
# giveaway of the estates of South Prussia. The attribution is the volume's
# own (its contents: "vom Kriegsrath v. T.") and the Materialien's note 152
# spells it out ("v. Triebenfeld, der S. 128 geschilderte Kriegsrath"); the
# same three letters that stand against Łukasiewicz's telling stand against
# the memoir, the figures of the letters' side being those ruled on
# 2026-10-19.

- id: dorow-memoir
  passages:
    - dorow1843/18
    - dorow1843/19
  documents:
    - oe1bu9454-104
    - oe1bu9454-108
    - oe1bu9454-112
  en: >-
    Dorow (1843) prints, from a manuscript the official gave him in 1813,
    Triebenfeld's own memoir on how the classifications and valuations of
    South Prussia were managed, told in the third person. The same man's
    letters to the Prince of Hohenlohe report what came of it for his own
    estates: valued at over 700,000 (April 1799), sold to Prince George of
    Hessen-Darmstadt at 280,000 (July 1800) and resold for 750,000
    (February 1801).
  de: >-
    Dorow (1843) druckt nach einer Handschrift, die der Beamte ihm 1813
    einreichte, Triebenfelds eigene Denkschrift darüber, wie die
    Klassifikationen und Taxen Südpreußens besorgt wurden, in der dritten
    Person erzählt. Derselbe Mann berichtet in seinen Briefen an den Fürsten
    Hohenlohe, was daraus für seine eigenen Güter wurde: über 700.000
    veranschlagt (April 1799), an den Prinzen Georg von Hessen-Darmstadt für
    280.000 verkauft (Juli 1800) und für 750.000 weiterverkauft
    (Februar 1801).
  about:
    dorow1843/18:
      en: >-
        The memoir's classification story: the Poles, warned by "an honest man,
        War Councillor v. Triebenfeld", volunteer 24 per cent where Hoym asked
        five, and the tax in kind is dropped. The memoir's honest man is the
        writer of the letters in the edition; what the same years brought him
        stands in his own hand — the estates he sold taxed at over 700,000 rt
        (April 1799) against the 500,000 he says he let the buyer have them on.
      de: >-
        Die Klassifikationsgeschichte der Denkschrift: Die Polen, von „einem
        ehrlichen Mann, dem Kriegsrat v. Triebenfeld" gewarnt, bieten 24
        Prozent, wo Hoym fünf verlangte, und die Naturalsteuer fällt hinweg.
        Der ehrliche Mann der Denkschrift ist der Schreiber der Briefe der
        Edition; was dieselben Jahre ihm brachten, steht in eigener Hand — die
        Güter, die er verkaufte, mit über 700.000 rt taxiert (April 1799),
        gegen die 500.000, auf die er sie, wie er sagt, dem Käufer überließ.
      documents:
        - oe1bu9454-104
    dorow1843/19:
      en: >-
        The memoir closes on its hero's reward: Hoym commended, and the patriot
        got "for his pains and outlay … nothing but leave to rejoice in secret
        and worship in the dust", though it was his branch that
        set the cabinet orders bestowing the confiscated estates aside. The
        letters show what the same career had made by then: the estates sold to
        Prince George encumbered with 270,000 rt of debt at a price of 280,000
        (July 1800), and resold for 750,000 (February 1801) — their writer
        petitioning to be kept out of arrest.
      de: >-
        Die Denkschrift schließt auf den Lohn ihres Helden: Hoym belobt, und
        der Patriot bekam ‚für seine Bemühung und Kostenaufwand weiter nichts
        als die Erlaubniß, sich im Stillen zu freuen und im Staube anzubeten',
        obwohl es seine Stelle war, die die Kabinettsorderen, womit die konfiszierten
        Güter verschenkt wurden, beiseite setzte. Die Briefe zeigen, was
        dieselbe Laufbahn bis dahin gemacht hatte: die an den Prinzen Georg
        verkauften Güter mit 270.000 rt Schulden bei einem Preis von 280.000
        beschwert (Juli 1800) und für 750.000 weiterverkauft (Februar 1801) —
        ihr Schreiber bittet, vor der Verhaftung bewahrt zu bleiben.
      documents:
        - oe1bu9454-108
        - oe1bu9454-112

# Kneifel (1964), p. 41, on the founding of Łazińsk: the one passage of the
# book that names the Starost and the colony together. Read against the
# documents: the decree of 1775 attests the rights granted in 1746 (Konin
# Gr. 145, p. 76 of the copy), and the summons of 1860 names the grantor
# with his wife (APP 53/968/0/-/783, document 1). Kneifel names only the
# husband and calls the colony "Lazinsk Hol." outright; the documents
# record the couple and the privilege, and the edition follows the
# documents (the editor's rule of 2026-10-20).

- id: kneifel1964-lazinsk
  passages:
    - kneifel1964/41
  documents:
    - app539680783-1
    - app53170koningr145-1
  en: >-
    Kneifel (1964) says that in 1746 Paul von Kolno-Prusinski, lord of
    "Trombezyn" (Trąbczyn), assigned German peasants woodland and waste to
    clear, and that on it they created the colony of Lazinsk (Łazińsk), Trąbczyńskie Stare Olędry. The documents carry the
    same grant: the summons of 1860 names "Paweł z Kolna Prusiński" with his
    wife Katarzyna as the grantors who gave the Hollanders on the lands of
    the Trąbczyn estate their privilege in 1746, and the boundary decree of
    1775 attests the settlement of the olędry on those woodlands "as
    attested by the rights granted them in 1746". Kneifel names the husband
    alone; the documents the couple.
  de: >-
    Kneifel (1964) sagt, Paul von Kolno-Prusinski, Gutsherr von „Trombezyn“
    (Trąbczyn), habe 1746 deutschen Bauern Waldungen und Ödland zur
    Urbarmachung zugewiesen, und sie hätten auf ihnen die Kolonie Lazinsk
    (Łazińsk) geschaffen, die Trąbczyńskie Stare Olędry. Die
    Dokumente tragen dieselbe Zuweisung: Die Vorladung von 1860
    nennt „Paweł z Kolna Prusiński“ mit seiner Frau Katarzyna als die
    Verleihenden, die den Holländern auf den Gütern Trąbczyńskich 1746 ihr
    Privileg gaben, und das Grenzdekret von 1775 bezeugt die Ansiedlung der
    Olęder auf diesen Waldungen „wie durch die ihnen 1746 verliehenen
    Rechte bezeugt“. Kneifel nennt allein den Ehemann, die Dokumente das
    Ehepaar.

# Rostworowski (1918), the Dziennik of the Governing Commission (2026-10-26).
# The identification of the print's Dąmbska/Dambska with Michalina z
# Prusimskich Dąbska rests on register (AGAD 1/174/0/1/6),
# whose resolution of 21 July 1807 repeats the Dziennik's entry nearly word
# for word; the other readings and identifications are in the work's
# notes.md. Every date and figure below was read in the book and in the
# document.

- id: rostworowski1918-february
  passages:
    - rostworowski1918/43
    - rostworowski1918/44
    - rostworowski1918/54
    - rostworowski1918/55
  documents:
    - agad11740273-2
    - agad11740273-1
  en: >-
    At its sitting of 13 February 1807, the Dziennik of the Governing Commission
    records, the memorial of Michalina Dąbska, née Prusimska, was referred to
    the Director of Justice, so that he might propose general rules for the
    estates of citizens confiscated under the former government. On 18 February
    the Director gave his opinion that her request was "a matter of a purely
    political character". The Commission then resolved to petition the Emperor
    to repeal the confiscations and ordered the Administrative Chambers to watch
    over the estates. The file in Warsaw holds her petitions of July but not
    this memorial. In her letter of 20 July 1807 to the Commission at Dresden
    she writes that she has already asked it twice for the return of the estates
    taken from her father for the Prussian generals, and the draft resolution of
    21 July in the same file shows the answer taking shape.
  de: >-
    In seiner Sitzung vom 13. Februar 1807, so verzeichnet das Dziennik der
    Regierungskommission, wurde das Memorial der Michalina Dąbska, geb.
    Prusimska, dem Justizdirektor überwiesen, damit er allgemeine Regeln für die
    unter der früheren Regierung konfiszierten Güter der Bürger vorschlage. Am
    18. Februar gab der Direktor seine Meinung ab, ihr Begehren sei „eine Sache
    von rein politischem Charakter“. Die Kommission beschloss daraufhin, beim
    Kaiser um Aufhebung der Konfiskationen zu bitten, und wies die
    Administrativen Kammern an, die Güter zu beaufsichtigen. Die Akte in
    Warschau enthält ihre Bittschriften aus dem Juli, nicht aber dieses
    Memorial. In ihrem Brief vom 20. Juli 1807 an die Kommission in Dresden
    schreibt sie, sie habe schon zweimal um die Rückgabe der ihrem Vater
    zugunsten der preußischen Generale genommenen Güter gebeten, und der Entwurf
    der Resolution vom 21. Juli in derselben Akte zeigt die Antwort im Werden.
  about:
    rostworowski1918/43:
      en: >-
        The sitting of 13 February refers Dąbska's memorial to the Director of
        Justice, so that he propose general rules for the estates confiscated
        under the former government. The file holds her letters of July 1807
        but not this memorial; her letter of 20 July to the Commission at
        Dresden says she has already asked twice for the estates taken from her
        father for the Prussian generals — the asking that the Dziennik's
        February entries record.
      de: >-
        Die Sitzung vom 13. Februar überweist Dąbskas Memorial dem
        Justizdirektor, damit er allgemeine Regeln für die unter der früheren
        Regierung konfiszierten Güter vorschlage. Die Akte hält ihre Briefe vom
        Juli 1807, nicht aber dieses Memorial; ihr Brief vom 20. Juli an die
        Kommission in Dresden sagt, sie habe schon zweimal um die Güter
        gebeten, die ihrem Vater zugunsten der preußischen Generale genommen
        waren — das Bitten, das die Februareinträge des Dziennik verzeichnen.
      documents:
        - agad11740273-2
    rostworowski1918/44:
      en: >-
        The entry ends the referral: the memorial, with the recommendation that
        the Director submit a project of general rules on the confiscations.
        Her letter of 20 July 1807 — the asking again for Trąbczyn, Kamionna,
        Kolna, Pawłowa, Pawłówka and the warehouse at Włocławek — is the same
        petition at Dresden, after the Commission had moved there.
      de: >-
        Der Eintrag schließt die Überweisung ab: das Memorial, mit der
        Empfehlung, der Direktor lege einen Entwurf allgemeiner Regeln über die
        Konfiskationen vor. Ihr Brief vom 20. Juli 1807 — das erneute Bitten um
        Trąbczyn, Kamionna, Kolna, Pawłowa, Pawłówka und das Magazin in
        Włocławek — ist dieselbe Bittschrift in Dresden, nachdem die Kommission
        dorthin gezogen war.
      documents:
        - agad11740273-2
    rostworowski1918/54:
      en: >-
        The Director of Justice's opinion of 18 February — the return of the
        estates "a matter of a purely political character" that cannot go the
        ordinary way of the courts — is the entry the draft resolution of 21
        July answers: it extends the Emperor's Finckenstein decree to her case
        and sends the confiscated estates back to their rightful owners.
      de: >-
        Die Meinung des Justizdirektors vom 18. Februar — die Rückgabe der
        Güter „eine Sache von rein politischem Charakter", die nicht den
        gewöhnlichen Weg der Gerichte gehen könne — ist der Eintrag, den der
        Entwurf der Resolution vom 21. Juli beantwortet: er erstreckt das
        kaiserliche Dekret von Finckenstein auf ihren Fall und schickt die
        konfiszierten Güter an ihre wahren Eigentümer zurück.
      documents:
        - agad11740273-1
    rostworowski1918/55:
      en: >-
        The Commission's resolution — to petition the Emperor for the repeal of
        the confiscations, and to have the Administrative Chambers watch over
        the estates — is what the draft decree of 21 July 1807 carries out: the
        Emperor's decree for Wybicki extended to Dąbska, so that her hereditary
        estates return to their rightful owners.
      de: >-
        Der Beschluss der Kommission — den Kaiser um Aufhebung der
        Konfiskationen zu bitten, und die Administrativen Kammern die Güter
        beaufsichtigen zu lassen — ist, was der Entwurf des Dekrets vom 21.
        Juli 1807 ausführt: das kaiserliche Dekret für Wybicki auf Dąbska
        erstreckt, damit ihre erblichen Güter an ihre wahren Eigentümer
        zurückkehren.
      documents:
        - agad11740273-1

- id: rostworowski1918-decree
  passages:
    - rostworowski1918/303
  documents:
    - agad1174016-2
    - agad11740273-1
    - agad11740273-4
  en: >-
    The Dziennik's record of the extraordinary sitting of 21 July 1807 at
    Dresden says that the Commission, taking example from the Emperor's decree
    of 5 June given at Finckenstein for Wybicki, extended that decree to the
    cases of Michalina Dąbska, General Niemojewski and Wichrowski, so that their
    hereditary estates, confiscated by the former Prussian government, return to
    their true owners. The register carries the resolution itself, of 21 July
    and signed by Małachowski and Łuszczewski, in wording near the print's; it
    writes "z Prusińskich Dambskiey" where the print has "z Prusimskich
    Dambskiej". The file holds the draft of the same day. Her letter of 23 July
    takes the decree of 5 June for the principle and pattern of the Commission's
    decree and asks that the Administrative Chambers be ordered to put her, as
    Wybicki was put, into possession of the estates.
  de: >-
    Das Protokoll der außerordentlichen Sitzung vom 21. Juli 1807 in Dresden im
    Dziennik sagt, die Kommission habe, dem Beispiel des kaiserlichen Dekrets
    vom 5. Juni folgend, das in Finckenstein für Wybicki erging, das Dekret auf
    die Fälle von Michalina Dąbska, General Niemojewski und Wichrowski
    erstreckt, damit ihre erblichen, vom früheren preußischen Staat
    konfiszierten Güter an ihre wahren Eigentümer zurückkehren. Das Register
    trägt die Resolution selbst, vom 21. Juli und unterschrieben von Małachowski
    und Łuszczewski, in fast gleichem Wortlaut; es schreibt „z Prusińskich
    Dambskiey“, wo der Druck „z Prusimskich Dambskiej“ hat. Die Akte enthält den
    Entwurf desselben Tages. Ihr Brief vom 23. Juli nimmt das Dekret vom 5. Juni
    als Grundsatz und Vorbild des Dekrets der Kommission und bittet, die
    Administrativen Kammern anzuweisen, sie, wie Wybicki, in die Güter
    einzuführen.

- id: rostworowski1918-dresden
  passages:
    - rostworowski1918/322
  documents:
    - agad11740273-2
    - agad11740273-3
    - agad11740273-4
  en: >-
    The Directorium's protocol Nr. 3 of 15 July 1807, written in the first
    person by the Director of Police Łubieński, reports that very many were
    leaving for Dresden – "Dąmbska, Kownacka, Węgrzecki, Bórakowski" among
    them – and that the Government must be told daily who arrives there.
    She was in Dresden within the week: her letters of 20, 21 and 23 July 1807 to the Governing Commission and to the Emperor were all written at Dresden, the letters of 20 and 23 July signed "Michalina z Prusimskich Dambska", the letter of 21 July to the Emperor signing in French "Micheline Dambska née Prusimska", the
    last acknowledging the Commission's decree of 21 July.
  de: >-
    Das Protokoll Nr. 3 des Directorium vom 15. Juli 1807, in der ersten
    Person geschrieben vom Polizeidirektor Łubieński, meldet, sehr viele
    reisten nach Dresden – "Dąmbska, Kownacka, Węgrzecki, Bórakowski" unter
    ihnen – und daß der Regierung täglich gemeldet werden müsse, wer dort
    ankommt. Sie war binnen der Woche in Dresden: ihre Briefe vom 20., 21. und 23. Juli 1807 an die Regierungskommission und an den Kaiser sind alle in Dresden geschrieben, die Briefe vom 20. und 23. Juli unterzeichnet "Michalina z Prusimskich Dambska", der Brief vom 21. Juli an den Kaiser französisch "Micheline Dambska née Prusimska" unterzeichnend, der
    letzte mit der Kenntnis des Dekrets der
    Kommission vom 21. Juli.


# Held (1801): the papers of the Früson suit against the Seehandlung, printed
# whole. Claude's reading, 2026-11-01 (docs/NEEDS_CONFIRMATION.md): the
# composition of 1795 whereby Früson gave up the lease of Krotoszyn, which the
# King's letter prices with the Abstand of 26,000 rt Triebenfeld received for
# the Abtretung der Pacht, is Held's printed Vergleich; the identification of
# the two rests on the year 1795 and the parties, and waits on the editor.

- id: held-krotoszyn
  passages:
    - held1801/12
    - held1801/34
    - held1801/54
    - held1801/79
    - held1801/129
    - held1801/173
  documents:
    - oe1bu9454-85
    - oe1bu9454-86
    - oe1bu9454-101
  en: >-
    Held (1801) prints, from the papers of Früson's suit against the
    Seehandlung, the story of the Krotoszyn lease that the Materialien quote
    from Cölln's "black book": Triebenfeld's administration of the lordship
    until 1791, Früson's nine-year lease at 30,100 rt a year from 1 July 1791,
    the composition that took it from him, and its giving back. The letters on
    the Prince's proposed exchange give the same figures from the government's
    side: Krotoszyn's rent of 30,100 in the Prince's answers and his petition,
    and the Abstand of 26,000 the King says Triebenfeld received for the
    Abtretung der Pacht of 1795.
  de: >-
    Held (1801) druckt aus den Akten des Prozesses Früsons gegen die
    Seehandlung die Geschichte der Krotoszyner Verpachtung, die die Materialien
    nach dem "schwarzen Buch" Cöllns zitieren: Triebenfelds Verwaltung der
    Herrschaft bis 1791, Früsons Neunjahrspacht von 30.100 rt jährlich ab 1.
    Juli 1791, der Vergleich, der sie ihm nahm, und ihre Rückgabe. Die Briefe
    über den Tausch des Fürsten geben dieselben Zahlen von der Seite der
    Regierung: die Pacht von 30.100 in den Antworten des Fürsten und seiner
    Vorstellung, und den Abstand von 26.000, den der König sagt, Triebenfeld
    habe für die Abtretung der Pacht von 1795 erhalten.
  about:
    held1801/12:
      en: >-
        Held's narrative: Triebenfeld, found as a huntsman and timber-clerk in
        Görne's service, administered Krotoszyn for the Seehandlung at some
        17,000 to 18,000 rt a year until 1791, when Struensee carried through
        the lease to Früson at 30,100. The letters give the rent from the other
        side: the Prince's answer counts Krotoszyn's rent at 30,100, and his
        second petition takes that Pacht as the basis of his proposed exchange.
      de: >-
        Helds Erzählung: Triebenfeld, als Jägerbursche und Holzschreiber im
        Dienst Görnes gefunden, verwaltete Krotoszyn für die Seehandlung mit
        etwa 17.000 bis 18.000 rt jährlich, bis 1791 Struensee die Verpachtung
        an Früson mit 30.100 durchsetzte. Die Briefe geben die Pacht von der
        anderen Seite: die Antwort des Fürsten rechnet Krotoszyns Pacht auf
        30.100, und seine zweite Vorstellung nimmt diese Pacht als Grundlage
        seines vorgeschlagenen Tauschs.
      documents:
        - oe1bu9454-86
        - oe1bu9454-101
    held1801/34:
      en: >-
        Held prints the composition itself, wrung from Früson by Triebenfeld
        and Neumann, by which he gave up the lease of Krotoszyn once more. The
        King's refusal of 4 December 1798 names the same transaction from the
        government's side: Triebenfeld received an Abstand of 26,000 rt when
        the Abtretung der Pacht took place in 1795.
      de: >-
        Held druckt den Vergleich selbst, dem Früson von Triebenfeld und
        Neumann abgedrungen ward und durch den er die Pacht von Krotoszyn noch
        einmal aufgab. Die Ablehnung des Königs vom 4. Dezember 1798 nennt
        dieselbe Begebenheit von der Seite der Regierung: Triebenfeld habe
        einen Abstand von 26.000 rt erhalten, als die Abtretung der Pacht 1795
        geschah.
      documents:
        - oe1bu9454-85
    held1801/54:
      en: >-
        Früson's narrative: he leased the lordship in 1791 for nine years at
        30,100 rt, whose administration until then had been entrusted to the
        titular War Councillor Triebenfeld under the Breslau chamber's
        direction — and the lease suited neither Hoym nor Triebenfeld. The
        letters put figures to both claims: the King's refusal says Triebenfeld
        received 26,000 rt for the Abtretung der Pacht of 1795, and the
        Prince's answer counts Krotoszyn's rent at 30,100.
      de: >-
        Früsons Erzählung: er habe die Herrschaft 1791 auf neun Jahre mit
        30.100 rt gepachtet, deren Verwaltung bis dahin dem Titularkriegsrat
        Triebenfeld unter der Richtung der Breslauer Kammer übertragen war —
        und die Verpachtung paßte weder Hoym noch Triebenfeld. Die Briefe
        setzen beiden Behauptungen Zahlen bei: die Ablehnung des Königs sagt,
        Triebenfeld habe für die Abtretung der Pacht von 1795 einen Abstand
        von 26.000 rt erhalten, und die Antwort des Fürsten rechnet Krotoszyns
        Pacht auf 30.100.
      documents:
        - oe1bu9454-85
        - oe1bu9454-86
    held1801/79:
      en: >-
        Früson's petition gives the lease's own dates: the contract of 4
        September and 2 December 1791, the letting from 1 July 1791, nine
        years, 30,100 rt a year, and the delivery of 3 and 8 September 1791.
        The letters know the same rent from the other side: the Prince's answer
        (30,100) and his second petition, which takes the Pacht of 30,100 as
        its basis and asks for Struensee's files on the takeover of the
        lordship.
      de: >-
        Früsons Vorstellung gibt die eigenen Daten der Verpachtung: der
        Vertrag vom 4. September und 2. Dezember 1791, die Überlassung vom 1.
        Juli 1791 an, neun Jahre, 30.100 rt jährlich, und die Übergabe vom 3.
        und 8. September 1791. Die Briefe kennen dieselbe Pacht von der
        anderen Seite: die Antwort des Fürsten (30.100) und seine zweite
        Vorstellung, die die Pacht von 30.100 zur Grundlage nimmt und um
        Struensees Akten über den Antritt der Herrschaft bittet.
      documents:
        - oe1bu9454-86
        - oe1bu9454-101
    held1801/129:
      en: >-
        The memorial against Früson's suit gives the auction of 1791: Früson
        bid 30,100 rt of annual rent, though he was not the highest bidder, and
        the Seehandlung resolved of its own motion. The letters give the rent
        as the government reckons it: the Prince's answer has Krotoszyn paying
        a Pacht of 30,100.
      de: >-
        Das Memorial gegen Früsons Klage gibt die Licitation von 1791: Früson
        bot 30.100 rt jährlicher Pacht, ohne der Meistbietende zu sein, und die
        Seehandlung beschloß aus eigenem Antrieb. Die Briefe geben die Pacht,
        wie die Regierung sie rechnet: die Antwort des Fürsten hat Krotoszyn
        eine Pacht von 30.100 zahlen.
      documents:
        - oe1bu9454-86
    held1801/173:
      en: >-
        The son's petition: the father took the nine-year general lease of
        1791 from the Seehandlung, "which until then had been administered by
        War Councillor von Triebenfeld under the direction of the Breslau
        Chamber for the account of the Seehandlung" — Triebenfeld's
        administration, and its end when the lease began, as the letters' side
        knows it: the Prince's answer counts Krotoszyn's rent at 30,100, the
        sum the new lease displaced his administration.
      de: >-
        Die Vorstellung des Sohnes: der Vater habe die Neunjahrsgeneralpacht
        von 1791 von der Seehandlung übernommen, "die bis dahin von dem
        Kriegsrat von Triebenfeld unter der Richtung der Breslauer Kammer für
        Rechnung der Seehandlung verwaltet worden war" — die Verwaltung
        Triebenfelds und ihr Ende, als die Pacht begann, wie die Seite der
        Briefe sie kennt: die Antwort des Fürsten rechnet Krotoszyns Pacht auf
        30.100, die Summe, mit der die neue Pacht seine Verwaltung verdrängte.
      documents:
        - oe1bu9454-86

# Guradze (1898), chapter VI: the Duchy of Warsaw declared all slavery
# (esclavage) abolished by the constitution of 22 July 1807, and the decree of
# King Friedrich August of 24 December 1807 carried it out — hereditary
# subjection done away with. The hereditary lease the edition holds had freed
# its lessees of it two years before, by its own paragraph 13.

- id: guradze1898-emancipation
  passages:
    - guradze1898/c08
  documents:
    - app539680801-3
  en: >-
    Guradze (1898) dates the end of hereditary subjection in the Duchy of
    Warsaw to the constitution of 22 July 1807 and the decree of King Friedrich
    August of 24 December 1807, which carried out the abolition of what the
    constitution's Article 4 had called esclavage — a decree the same passage
    of the book a few lines on calls one of 21 December. The hereditary lease of
    1805/6 in the edition had freed its eighteen lessees of hereditary
    subjection two years before that, by its own paragraph 13 — the freedom the
    Duchy's decree then made general.
  de: >-
    Guradze (1898) datiert das Ende der Erbuntertänigkeit im Herzogtum Warschau
    auf die Konstitution vom 22. Juli 1807 und das Dekret des Königs Friedrich
    August vom 24. Dezember 1807, das die Aufhebung dessen vollzog, was Artikel
    4 der Konstitution esclavage nannte — ein Dekret, das derselbe Absatz des
    Buchs wenige Zeilen später eines vom 21. Dezember nennt. Der Erbpachtvertrag von 1805/6 in der
    Edition hatte seine achtzehn Erbpächter zwei Jahre davor von der
    Erbuntertänigkeit freigestellt, durch seinen eigenen Paragraphen 13 — die
    Freiheit, die das Dekret des Herzogtums dann allgemein machte.

# Paciorkowski (1776): the rule of the Polish field boundary process, second
# edition. The passages are the constitution of 1768 on the approval of
# boundary decrees and the rules on boundaries destroyed or privately erected;
# the edition's court books show both at work in the Trąbczyn–Łukom case.
# Claude's reading, 2026-11-01 (docs/NEEDS_CONFIRMATION.md): the edition's
# process ran on the Sejm's commission of 1774, not the Sub-Chamberlain's
# ordinary office of 1768 — the passages are tied as the rules the documents'
# proceedings resemble, not as the statute they were brought under.

- id: paciorkowski1776-boundary
  passages:
    - paciorkowski1776/170
    - paciorkowski1776/174
  documents:
    - app53170koningr153-1
    - app53170koningr117-4
  en: >-
    Paciorkowski (1776) prints the constitution of 1768 for boundary cases: a
    boundary decree approved by the Tribunal passes into a full judgment, and
    boundaries destroyed or privately erected are restored and demolished at
    law, before an official inspection. The Trąbczyn–Łukom court books show
    both rules at work: the stones the boundary commission of 1775 erected were
    approved by the Piotrków Tribunal's decree of 23 January 1782, and the act
    of 28 November 1782 is the demolition of the intermediate stones by the
    palatinate's commissary, while Chełmski's protest of 1778 declares a
    private field act, drawn up after the stones were erected and the oath
    sworn, invalid.
  de: >-
    Paciorkowski (1776) druckt die Konstitution von 1768 für Grenzsachen: ein
    vom Tribunal gebilligtes Grenzdekret geht in ein vollstreckbares Urteil
    über, und zerstörte oder privat aufgeworfene Grenzen werden vor
    gerichtlicher Besichtigung auf dem Rechtsweg wiederhergestellt und
    niedergelegt. Die Gerichtsbücher von Trąbczyn und Łukom zeigen beide Regeln
    bei der Arbeit: die Steine, die die Grenzkommission von 1775 setzte,
    billigte das Dekret des Krontribunals von Piotrków vom 23. Januar 1782, und
    die Akte vom 28. November 1782 ist die Niederlegung der Zwischensteine
    durch den Kommissar der Woiwodschaft, während Chełmskis Protest von 1778
    eine privat verfaßte Feldhandlung, nach aufgeworfenen Steinen und
    abgelegtem Eid aufgenommen, für ungültig erklärt.
  about:
    paciorkowski1776/170:
      en: >-
        The constitution's rule of approval: a boundary decree approved by the
        Tribunal transits into a full judgment. The demolition act of 28
        November 1782 (Konin Gr. 153) records the approval in its own preamble:
        the stones erected by the 1775 commission had been approved by the
        Piotrków Tribunal's decree of 23 January 1782, and the palatinate's
        commissary then demolished the intermediate stones and declared them
        null.
      de: >-
        Die Billigungsregel der Konstitution: ein vom Tribunal gebilligtes
        Grenzdekret geht in ein vollstreckbares Urteil über. Die
        Beseitigungsakte vom 28. November 1782 (Konin Gr. 153) verzeichnet die
        Billigung in ihrer eigenen Einleitung: die Steine, die die Kommission
        von 1775 gesetzt hatte, waren durch das Dekret des Krontribunals von
        Piotrków vom 23. Januar 1782 gebilligt, und der Kommissar der
        Woiwodschaft legte dann die Zwischensteine nieder und erklärte sie für
        null und nichtig.
      documents:
        - app53170koningr153-1
    paciorkowski1776/174:
      en: >-
        The rule for boundaries destroyed or privately raised: restoration and
        demolition at law, before an official inspection by the court's
        officer. Chełmski's protest of April 1778 (Konin Gr. 117) is the
        private-raising case: it declares invalid a private field act carried
        out by commissioners hired privately "after the stones had been
        erected and the oath sworn", and the act of 28 November 1782 (Konin
        Gr. 153) is the demolition itself, the commissary verifying the line
        and pulling up the intermediate stones.
      de: >-
        Die Regel für zerstörte oder privat aufgeworfene Grenzen:
        Wiederherstellung und Niederlegung auf dem Rechtsweg, vor
        gerichtlicher Besichtigung durch den Offizial des Gerichts. Chełmskis
        Protest vom April 1778 (Konin Gr. 117) ist der Fall der privaten
        Aufwerfung: er erklärt eine Feldhandlung für ungültig, die von privat
        gedungenen Kommissaren "nach aufgeworfenen Steinen und abgelegtem Eid"
        aufgenommen war, und die Akte vom 28. November 1782 (Konin Gr. 153) ist
        die Niederlegung selbst, der Kommissar die Linie verifizierend und die
        Zwischensteine ausziehend.
      documents:
        - app53170koningr117-4
        - app53170koningr153-1

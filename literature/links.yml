# Passages of the literature tied by hand to documents of the edition
# (docs/LITERATURE_PLAN.md, section 5, item 2, and section 9).
#
# Read by pipeline/literature/literature_site.py, which puts an "In the
# edition" box under each passage named here, with the sentence and a link to
# each document, and writes site/_data/literature_links.yml for the "In the
# literature" entry beside each document named here. It stops on a passage or
# a document that does not exist, and on a passage of a work not shown on the
# site (Seidel).
#
# Each link:
#   id         a short name, never shown
#   passages   <work>/<passage key>, as in corpus/literature/index.json
#   documents  the documents' uids, as in corpus/letters.json
#   en, de     one sentence (or two) saying why they belong together. It is
#              read on both sides, under the passage and beside the document,
#              so it names the book, the document and what each says. Every
#              figure in it was read in both the book and the document
#              (Claude, 2026-10-19). Say who says what: "the register says",
#              never "it was".
# Where the link rests on Claude's identification, the comment above it says
# so, and docs/NEEDS_CONFIRMATION.md lists it until the editor has ruled.

# The black register: the list of the Crown and church estates given away in
# 1794-1798, printed in the Neue Feuerbrände (1807, part 2), with Cölln's
# remarks (part 3), and reprinted with both in the Materialien (1861,
# pp. 140-171).

- id: register-hohenlohe
  passages:
    - materialien1861/145
    - materialien1861/146
    - materialien1861/159
    - feuerbraende1807/2-69
    - feuerbraende1807/2-80
    - feuerbraende1807/3-132
  documents:
    - ihagrrep7cnr3570-1
    - oe1bu9454-85
    - oe1bu9454-86
    - oe1bu9454-87
    - oe1bu9454-97
    - oe1bu9454-101
  en: >-
    The black register lists the estates given to the Prince of Hohenlohe,
    Trąbczyn among them, as worth about 800,000 Thaler and yielding 50,000 a
    year, where the late King had meant a gift yielding 6,000; it says the
    Prince himself gave the King's cabinet that yield of 50,000 when he
    tried to exchange the estates for the crown domain of Krotoszyn, and that
    the cabinet councillor Beyme stopped the exchange. Cölln answered in 1807
    that it was the minister Voss who stopped it, and the edition's letters
    bear him out: the gift of 1796, the King's refusal of December 1798 on
    Voss's report (estates valued at a yield of 8,650 a year now bring
    40,500), the Prince's answer to the King (his estates yield 41,500,
    Krotoszyn's rent is 30,100) and his later petition.
  de: >-
    Das schwarze Register führt die dem Fürsten Hohenlohe geschenkten Güter,
    darunter Trąbczyn, mit einem Wert von etwa 800.000 Talern und 50.000
    Talern Ertrag im Jahr, wo der verstorbene König nur eine Schenkung von
    6.000 Talern Ertrag gemeint habe; der Fürst habe diesen Ertrag von 50.000
    selbst im Kabinett angegeben, als er die Güter gegen die Domäne Krotoszyn
    tauschen wollte, und der Kabinettsrat Beyme habe den Tausch verhindert.
    Cölln hielt 1807 dagegen, der Minister Voss habe ihn vereitelt, und die
    Briefe der Edition geben ihm recht: die Schenkung von 1796, die Ablehnung
    des Königs vom Dezember 1798 auf den Bericht von Voss (die auf 8.650
    Taler Jahresertrag veranschlagten Güter brächten jetzt 40.500), die
    Antwort des Fürsten an den König (seine Güter trügen 41.500, die Pacht
    von Krotoszyn sei 30.100) und seine spätere Eingabe.

- id: register-triebenfeld
  passages:
    - materialien1861/162
    - materialien1861/163
    - feuerbraende1807/2-83
    - feuerbraende1807/2-84
    - feuerbraende1807/3-134
  documents:
    - oe1bu9454-104
    - oe1bu9454-108
    - oe1bu9454-112
  en: >-
    The black register's entry on Triebenfeld: estates valued at 31,000
    Thaler when they were given to him (and 20,000 paid for the lordship of
    Laski), valued by the Kalisz government in the spring of 1797 at over
    700,000, sold by him to Prince George of Hesse-Darmstadt for 400,000, and
    sold on by Prince George in March 1801 for 750,000. Triebenfeld's letters
    to the Prince of Hohenlohe give the same valuation (over 700,000, April
    1799) and the same resale (750,000, February 1801), but put his own price
    to Prince George at 280,000, not 400,000 (July 1800). Cölln remarked in
    1807 that the figures include estates that were Triebenfeld's own
    property. These are not the Trąbczyn estates: the entry bears on how the
    gifted estates were valued.
  de: >-
    Der Eintrag des schwarzen Registers über Triebenfeld: Güter, bei der
    Schenkung auf 31.000 Taler taxiert (und 20.000 für die Herrschaft Laski
    gezahlt), von der Regierung in Kalisch im Frühjahr 1797 auf über 700.000
    taxiert, von ihm an den Prinzen George von Hessen-Darmstadt für 400.000
    verkauft und von diesem im März 1801 für 750.000 weiterverkauft.
    Triebenfelds Briefe an den Fürsten Hohenlohe nennen dieselbe Taxe (über
    700.000, April 1799) und denselben Weiterverkauf (750.000, Februar 1801),
    aber als seinen eigenen Preis an den Prinzen George 280.000, nicht 400.000
    (Juli 1800). Cölln merkte 1807 an, in den Zahlen steckten Triebenfelds
    eigene Güter. Es sind nicht die Güter von Trąbczyn: der Eintrag zeigt,
    wie die geschenkten Güter bewertet wurden.

- id: krotoszyn-administration
  passages:
    - materialien1861/163
  documents:
    - oe1bu9454-85
    - oe1bu9454-86
    - oe1bu9454-101
  en: >-
    The Materialien, quoting the "black book", say that Triebenfeld ran the
    lordship of Krotoszyn for the Seehandlung (the state's Maritime Trading
    Company) for nine years, that Struensee leased it in 1791 to the steward
    Früson for 30,100 Thaler a year, and that Hoym and Triebenfeld drove
    Früson out. In the edition's letters on the Prince's proposed exchange
    for Krotoszyn the King says Triebenfeld received 26,000 Thaler when the
    lease was given up in 1795, and the Prince gives Krotoszyn's rent as the
    same 30,100.
  de: >-
    Die Materialien sagen nach dem "schwarzen Buch", Triebenfeld habe die
    Herrschaft Krotoszyn neun Jahre für die Seehandlung verwaltet, Struensee
    habe sie 1791 an den Amtmann Früson für 30.100 Taler im Jahr verpachtet,
    und Hoym und Triebenfeld hätten Früson vertrieben. In den Briefen der
    Edition über den Tausch des Fürsten gegen Krotoszyn sagt der König,
    Triebenfeld habe für die Abtretung der Pacht 1795 einen Abstand von
    26.000 Talern erhalten, und der Fürst nennt als Pacht von Krotoszyn
    dieselben 30.100.

# The general in letter 103 is Lieutenant-General von Rüchel: Claude took
# "Gen. Ruchts" for him, and the editor agreed on 2026-10-19, taking "Ruchts"
# for a misreading; the scan reads "Ruchels", and the transcription was
# corrected (units/oe1bu9454/intake/scripts/ruechel_103.py). The letter says
# the general's estates were to bear 940 Thaler a year and were sold for
# 140,000; the register says Rüchel's gift was valued at 20,000 and then
# 10,000 more, and sold to Reibnitz for 130,000.
- id: register-other-gifts
  passages:
    - materialien1861/141
    - materialien1861/142
    - materialien1861/152
    - materialien1861/153
    - materialien1861/156
    - materialien1861/160
    - materialien1861/161
    - materialien1861/168
    - materialien1861/171
    - feuerbraende1807/2-66
    - feuerbraende1807/2-74
    - feuerbraende1807/2-77
    - feuerbraende1807/2-82
    - feuerbraende1807/2-83
    - feuerbraende1807/2-87
    - feuerbraende1807/2-90
  documents:
    - oe1bu9454-103
  en: >-
    Answering the charge that the Prince of Hohenlohe had been given too
    many estates, Triebenfeld set his gift beside others made at the same
    time, each valued low and since sold or yielding far more: Bischofswerder's
    (which he says he sold for 207,000 Thaler), Zastrow's (meant to bear 2,000 a year, now
    some 20,000), Dolffs's (which Treskow is now selling
    for 360,000) and General
    Rüchel's (sold for 140,000). The black
    register makes the same complaint of the same gifts: Bischofswerder's
    sold to Count Lüttichau for 25,000 Friedrichsd'or, Zastrow's given at
    87,650 and "now worth at least 200,000", Treskow's worth together about
    350,000, Rüchel's sold to Reibnitz for 130,000 and valued afterwards at
    380,000.
  de: >-
    Gegen den Vorwurf, der Fürst Hohenlohe habe zu viele Güter erhalten,
    stellte Triebenfeld dessen Schenkung neben andere aus derselben Zeit, alle
    niedrig taxiert und seither teuer verkauft oder mit weit höherem Ertrag:
    die Bischofswerders (die er, wie er sagt, für 207.000 Taler
    verkauft habe), die Zastrows (sollten
    2.000 im Jahr tragen, bringen jetzt an die 20.000), die Dolffs' (die Treskow
    jetzt für 360.000 verkaufe) und die des Generals Rüchel (für 140.000
    verkauft). Das schwarze Register erhebt denselben
    Vorwurf gegen dieselben Schenkungen: Bischofswerders an den Grafen
    Lüttichau für 25.000 Friedrichsd'or verkauft, Zastrows bei der Schenkung
    87.650 und "jetzt zum Mindesten 200.000" wert, Treskows zusammen etwa
    350.000 wert, Rüchels an Reibnitz für 130.000 verkauft und danach auf
    380.000 taxiert.

# The books of the second set (Books_2, 2026-10-19): Breyer (1935, 1938),
# Żychliński (1885, 1891) and the Polski Słownik Biograficzny (Pachoński,
# 1982). Every figure below was read in the book and in the document.

- id: breyer1938-lease
  passages:
    - breyer1938/21
    - breyer1938/22
  documents:
    - app539680801-2
    - app539680801-3
  en: >-
    Breyer (1938) tells of the hereditary lease by which Triebenfeld, for the
    Prince of Hohenlohe, gave 100 Hufen of forest to eighteen German
    settlers, with the Kalisz chamber's consent of 28 January 1806, and
    quotes its paragraph 13: the lessees free for ever of hereditary
    subjection and of all services. The edition has the consent and a copy of
    the lease, which names the forest as that of the Prince's estate of
    Drzewce, and they agree with him on the eighteen takers, on paragraph
    XIII, on the rent of 30 Reichsthaler a Magdeburg Hufe after four free
    years, paid half at St John's and half at Christmas, and on the 21 Morgen
    for the schoolmaster, the headman and the cemetery. They differ in three
    points. Breyer dates the lease 18 May 1805; the edition's copy, whose
    beginning is lost, gives no day it was made and was engrossed at
    Mariantów on 21 March 1806. The clause on draining the land and a dike on
    the Warta that Breyer quotes is not among the copy's paragraphs. And
    where Breyer says the settlers had pasture and wood in the Prince's
    heath, the lease (paragraph VIII) gives them no claim to firewood, and
    lets them graze only in the part of the Drzewce woods the lordship kept,
    until that too is sold.
  de: >-
    Breyer (1938) berichtet vom Erbpachtvertrag, durch den Triebenfeld für
    den Fürsten Hohenlohe 100 Hufen Wald an achtzehn deutsche Siedler gab,
    mit der Genehmigung der Kalischer Kammer vom 28. Januar 1806, und
    zitiert dessen Paragraphen 13: die Erbpächter für immer frei von
    Erbuntertänigkeit und allen Diensten. Die Edition hat die Genehmigung und
    eine Abschrift des Vertrags, der den Wald als den des fürstlichen Gutes
    Drzewce nennt, und sie stimmen mit ihm überein in den
    achtzehn Annehmern, in Paragraph XIII, im Kanon von 30 Reichstalern für
    die Magdeburgische Hufe nach vier Freijahren, je zur Hälfte zu Johanni
    und zu Weihnachten, und in den 21 Morgen für Schullehrer, Schulzen und
    Kirchhof. In drei Punkten weichen sie ab. Breyer datiert den Vertrag auf
    den 18. Mai 1805; die Abschrift der Edition, deren Anfang fehlt, nennt
    keinen Tag des Abschlusses und wurde am 21. März 1806 in Mariantów
    ausgefertigt. Die Klausel über die Entwässerung des Landes und einen Damm
    an der Warthe, die Breyer zitiert, steht in keinem Paragraphen der
    Abschrift. Und wo Breyer sagt, die Siedler hätten Weide und Holz in der
    fürstlichen Heide gehabt, gibt ihnen der Vertrag (Paragraph VIII) keinen
    Anspruch auf Brennholz und erlaubt die Hütung nur in dem Teil der
    Waldungen bei Drzewce, den die Herrschaft behielt, bis auch dieser
    verkauft wird.

# Claude's reading, not shown: Breyer's K. G. von Weigel of Hennersdorf may or
# may not be the Breslau banker Carl Ferdinand Weigel of the edition's letters
# or one of his family (docs/NEEDS_CONFIRMATION.md). The link stands on the
# estates and the name, and the sentence says the identity is open.
- id: breyer1938-weigel
  passages:
    - breyer1938/22
  documents:
    - oe1bu9454-220
    - oe1bu9454-284
  en: >-
    Breyer (1938) says that from 1828 the Zagórów estates were owned by K. G.
    von Weigel, a great landowner from Hennersdorf in Silesia. A Weigel stands
    in the Prince of Hohenlohe's letters long before, as a creditor on the
    same estates: in October 1811 Triebenfeld writes that everything turns on
    Weigel and Stössel taking back the Constadt estates and the mortgage on
    the Zagórów estates, and in March 1815 that "Weigel's 30,000 Thaler are
    transferred to Zagorowo". Whether the Weigel of the letters, the Breslau
    banker Carl Ferdinand Weigel, is Breyer's K. G. von Weigel, or of his
    family, is not shown.
  de: >-
    Breyer (1938) sagt, die Zagórower Güter hätten von 1828 an K. G. von
    Weigel gehört, einem Großgrundbesitzer aus Hennersdorf in Schlesien. Ein
    Weigel steht schon lange vorher in den Briefen an den Fürsten Hohenlohe,
    als Gläubiger auf denselben Gütern: im Oktober 1811 schreibt Triebenfeld,
    alles komme darauf an, dass Weigel und Stössel die Constadter Güter und
    die Hypothek auf die Zagorower Güter wieder annehmen, und im März 1815:
    "Weigel seine 30000 rt sind auf Zagorowo übertragen". Ob der Weigel der
    Briefe, der Breslauer Bankier Carl Ferdinand Weigel, Breyers K. G. von
    Weigel ist oder zu seiner Familie gehört, ist nicht erwiesen.

# Breyer's "Paul von Kolno-Prusiński", owner of Trąbczyn in 1746, is Paweł
# Prusimski, King's chamberlain and heir of Trąbczyn (the editor,
# 2026-10-20: "Paul Prusiński is indeed Paweł Prusimski"). The documents bear
# it out without Breyer: the boundary decree of 1775 (Konin Gr.145, p. 76)
# dates the Hollanders' settlement by "the rights granted them in 1746" and
# gives the settler as "the uncle of Prusimski", unnamed; the summons of 1860
# (53/968/0/-/783, p. 2) names the grantors of the privilege of 1746, "Paweł
# z Kolna Prusiński" and his wife Katarzyna z Rozdrażewskich; and the
# inspection of 1754 (Konin Gr.136), the Kuryer Polski of 1754 and
# 53/6/0/-/45 name Katarzyna z Rozdrażewskich as Paweł Prusimski's widow.
# The privilege itself is not in the edition. Łazińsk Holland is one of the
# two Olęder colonies of the Trąbczyn estate (reference/places.yml, editor
# 2026-10-14).
- id: breyer1935gaue-hollanders
  passages:
    - breyer1935gaue/41
  documents:
    - app53170koningr145-1
    - app539680783-1
    - app53170koningr136-1
  en: >-
    Breyer (1935) says that in 1746 Paul von Kolno-Prusiński, owner of the
    Trąbczyn estate, gave the woods and waste land south of it to Hollanders
    in hereditary lease, and that the village of Łazińsk Holland arose from
    it, one of the two Olęder colonies of the Trąbczyn estate. The privilege
    of 1746 is not in the edition, but two of its documents cite it. The
    decree of the boundary commission of 1775 says that the uncle of Antoni
    Prusimski, heir of Trąbczyn, settled Hollanders on the Trąbczyn woods,
    "as the rights granted them in 1746 attest". The summons of 1860, in the
    lawsuit between Count Włodzimierz Miączyński and the colonists of the
    Staro- and Nowo-Łazińska colonies, names who granted that privilege:
    "Paweł z Kolna Prusiński", Breyer's Paul von Kolno-Prusiński, and his
    wife Katarzyna Rozdrażewska. The edition's earliest record of the
    settlers themselves is the inspection of 9 July 1754, made for Katarzyna
    as widow of Paweł Prusimski, the King's chamberlain, who had died
    shortly before: it names the Olędry among the places belonging to
    Trąbczyn, counts fifteen Olęder settlers at Nowa Wieś with the sixteenth
    plot empty, and says the Olęders had taken the best wood with the plots
    allotted to each of them long before. That the privilege was a
    hereditary lease is Breyer's account; the two documents say only that it
    settled the relations between the owners and the Hollanders.
  de: >-
    Breyer (1935) sagt, 1746 habe Paul von Kolno-Prusiński, Besitzer des Gutes
    Trąbczyn, die Wälder und Ödländereien südlich davon an Holländer in
    Erbpacht gegeben, und daraus sei das Dorf Łazińsk Holland entstanden,
    eine der beiden Hauländereien des Gutes Trąbczyn. Das Privileg von 1746
    liegt in der Edition nicht vor, aber zwei ihrer Dokumente führen es an.
    Das Dekret der Grenzkommission von 1775 sagt, der Onkel Antoni Prusimskis,
    des Erbherrn von Trąbczyn, habe Holländer auf den Trąbczyner Wäldern
    angesetzt, „wie die ihnen 1746 verliehenen Rechte bezeugen“. Die Ladung
    von 1860, im Prozess zwischen Graf Włodzimierz Miączyński und den
    Kolonisten der Kolonien Staro- und Nowo-Łazińska, nennt, wer dieses
    Privileg verlieh: „Paweł z Kolna Prusiński“, Breyers Paul von
    Kolno-Prusiński, und seine Frau Katarzyna Rozdrażewska. Das früheste
    Zeugnis der Edition über die Siedler selbst ist die Besichtigung vom
    9. Juli 1754, vorgenommen für Katarzyna als Witwe des kurz zuvor
    verstorbenen Paweł Prusimski, königlichen Kammerherrn: sie nennt die
    Olędry unter den zu Trąbczyn gehörigen Orten, zählt in Nowa Wieś
    fünfzehn Hauländer, die sechzehnte Hufe leer, und sagt, die Hauländer
    hätten mit den jedem von ihnen längst zugeteilten Hufen das beste Holz
    an sich genommen. Dass das Privileg eine Erbpacht war, ist Breyers
    Darstellung; die beiden Dokumente sagen nur, dass es das Verhältnis
    zwischen den Besitzern und den Holländern regelte.

- id: zychlinski1885-line
  passages:
    - zychlinski1885/187
    - zychlinski1885/188
  documents:
    - app53170koningr145-1
    - app53170koningr118-23
    - app53170koningr136-1
    - app536040-1
  en: >-
    Żychliński (1885) gives the Trąbczyn branch of the Prusimskis: Krzysztof,
    lord of Kolno, Kamionna and Trąbczyn, and his wife Teresa Golińska; their
    son Stefan and his wife Wiktorya Malczewska; and Stefan's only son Antoni,
    Starost of Nieszczewice. The court books agree: the boundary decree
    entered in 1776 calls the late Krzysztof Prusimski, heir of Trąbczyn, the
    Starost's grandfather, and Antoni's summons of 1782 names him son of
    Stefan and Wiktoria Malczewska and grandson of Krzysztof and Teresa
    Golińska. The summons names Krzysztof's other sons Jan, Bogumił, Antoni
    and Paweł, where Żychliński has Jan Paweł, Teofil and Antoni (Bogumił is
    the Polish form of Teofil); a suit of 1728 already names Krzysztof with
    his son Antoni. The inspection of Trąbczyn of July 1754 was
    made for Katarzyna born Rozdrażewska, widow of Paweł Prusimski, the
    King's chamberlain and heir of Trąbczyn; Żychliński's Paweł Apollo,
    chamberlain and husband of Katarzyna Rozdrażewska, stands a generation
    higher, as Krzysztof's brother.
  de: >-
    Żychliński (1885) gibt die Trąbczyner Linie der Prusimski: Krzysztof,
    Herr auf Kolno, Kamionna und Trąbczyn, und seine Frau Teresa Golińska;
    ihren Sohn Stefan und dessen Frau Wiktorya Malczewska; und Stefans
    einzigen Sohn Antoni, Starosten von Nieszczewice. Die Gerichtsbücher
    stimmen damit überein: das 1776 eingetragene Grenzdekret nennt den
    verstorbenen Krzysztof Prusimski, Erbherrn von Trąbczyn, den Großvater
    des Starosten, und Antonis Ladung von 1782 nennt ihn Sohn Stefans und
    der Wiktoria Malczewska und Enkel Krzysztofs und der Teresa Golińska. Die
    Ladung nennt als Krzysztofs andere Söhne Jan, Bogumił, Antoni und Paweł,
    wo Żychliński Jan Paweł, Teofil und Antoni hat (Bogumił ist die polnische
    Form von Teofil); ein Prozess von 1728 nennt schon Krzysztof mit seinem
    Sohn Antoni. Die Besichtigung von Trąbczyn vom Juli 1754 wurde für
    Katarzyna geborene Rozdrażewska vorgenommen, die Witwe des Paweł
    Prusimski, königlichen Kammerherrn und Erbherrn von Trąbczyn;
    Żychlińskis Paweł Apollo, Kammerherr und Ehemann der Katarzyna
    Rozdrażewska, steht eine Generation höher, als Bruder Krzysztofs.

# The letters write Michalina's second married name Moscinska and her husband
# Moscinski; the edition takes both for Miączyński (reference/people.yml).
# The date of the marriage, 1809 here against "about 1814" in the edition's
# biography, is put to the editor (docs/NEEDS_CONFIRMATION.md).
- id: zychlinski1891-marriage
  passages:
    - zychlinski1891/221
  documents:
    - oe1bu9454-242
    - oe1bu9454-266
    - oe1bu9454-265b
    - oe1bu9454-1
    - oe1bu9454-270
  en: >-
    Żychliński (1891) says that Michalina, born Prusimska, the widow of
    Count Józef Dąmbski, married Count Stanisław Miączyński in August 1809
    and brought him the Trąbczyn estates. In the letters to and from the
    Prince of Hohenlohe of 1814 and 1815 she is "the Moscinska born
    Prusimska", who holds the estates given back to her in 1807 and stands
    high in favour with the Russian governor general Lanskoy; a letter of 2
    February 1815 says that "Moscinski, husband of the born Prusimska" and
    Lanskoy are bosom friends. The edition takes Moscinski for the letters'
    form of Miączyński. The letters give no date for the marriage.
  de: >-
    Żychliński (1891) sagt, Michalina geborene Prusimska, die Witwe des
    Grafen Józef Dąmbski, habe im August 1809 den Grafen Stanisław
    Miączyński geheiratet und ihm die Güter von Trąbczyn zugebracht. In den
    Briefen an und von dem Fürsten Hohenlohe aus den Jahren 1814 und 1815 ist
    sie "die Moscinska geborene Prusimska", die die ihr 1807 zurückgegebenen
    Güter besitzt und beim russischen Generalgouverneur Lanskoy in hoher
    Gunst steht; ein Brief vom 2. Februar 1815 sagt, "Moscinski, Ehemann der
    geborenen Prusimska; und Graf Lanskoy, sind Busenfreunde". Die Edition
    hält Moscinski für die Form, in der die Briefe Miączyński schreiben. Die
    Briefe nennen kein Datum der Heirat.

# Claude's reading: if Cattaneo's dispatch and Żychliński's footnote speak of
# the same death, Żychliński's year is wrong; put to the editor
# (docs/NEEDS_CONFIRMATION.md).
- id: zychlinski1891-maryanna
  passages:
    - zychlinski1891/221
  documents:
    - ihagrrep7cnr1414-2
  en: >-
    Żychliński (1891) says in a footnote that Maryanna born Dąmbska, Antoni
    Prusimski's wife, died at Padua on 2 September 1797, aged 38, and was
    buried in the church of St Anthony there. The Prussian resident at
    Venice, Count Cattaneo, reported on 14 December 1796 that Prusimski had
    come to him in ruined health and dulled almost to stupor by the death of
    his wife. If both speak of the same death, it came before December 1796,
    and Żychliński's year 1797 cannot stand.
  de: >-
    Żychliński (1891) sagt in einer Fußnote, Maryanna geborene Dąmbska,
    Antoni Prusimskis Frau, sei am 2. September 1797 in Padua im Alter von 38
    Jahren gestorben und in der Kirche des heiligen Antonius dort begraben
    worden. Der preußische Resident in Venedig, Graf Cattaneo, berichtete am
    14. Dezember 1796, Prusimski sei in zerrütteter Gesundheit zu ihm
    gekommen, vom Tod seiner Frau fast bis zur Stumpfheit betroffen. Sprechen
    beide vom selben Tod, so fiel er vor den Dezember 1796, und Żychlińskis
    Jahr 1797 kann nicht stimmen.

- id: zychlinski1891-wlodzimierz
  passages:
    - zychlinski1891/222
  documents:
    - app539680783-1
  en: >-
    Żychliński (1891) says that Count Włodzimierz Miączyński, an officer of
    1831, held the Trąbczyn estate, which he bought from his brother
    Mieczysław after his return from exile, and that he died at Trąbczyn,
    unmarried, in December 1879. The edition's printed summons of 19 October
    1860 is issued at the demand of "Włodzimierz Count Miączyński, heir of the
    Trąbczyn estates, living in the village of Trąbczyn", in his
    counterclaim against the colonists of Trąbczyn.
  de: >-
    Żychliński (1891) sagt, Graf Włodzimierz Miączyński, Offizier von 1831,
    habe das Gut Trąbczyn besessen, das er nach seiner Rückkehr aus dem Exil
    von seinem Bruder Mieczysław kaufte, und sei im Dezember 1879 unverheiratet
    in Trąbczyn gestorben. Die gedruckte Ladung der Edition vom 19. Oktober
    1860 ergeht auf Verlangen "Włodzimierza Hrabiego Miączyńskiego, dziedzica
    dóbr Trąbczyna" (des Grafen Włodzimierz Miączyński, Erbherrn der Güter
    Trąbczyn), in seiner Widerklage gegen die Kolonisten von Trąbczyn.

- id: pachonski1982-venice
  passages:
    - pachonski1982/583
  documents:
    - ihagrrep7cnr1414-2
    - ihagrrep7cnr1414-1
    - ihagrrep7cnr1414-3
  en: >-
    The Polski Słownik Biograficzny (Pachoński, 1982) says that Antoni
    Prusimski fled to Venice with his wife at the end of 1794, stayed active
    there after the Peace of Basel, as Hoym reported on 9 May 1796, and was
    driven out to Mantua by the Austrians in the middle of March 1797. The
    edition's file of the foreign department falls in those months: the
    dispatch of the Prussian resident at Venice, Count Cattaneo, of 14
    December 1796, on Prusimski's ruined health and his request for a
    certificate that he could not travel; the department's letter of 11
    January 1797 passing it to the ministers Hoym and Schroetter; and
    Schrötter's reply of 29 January 1797, which says it is not known whether
    Prusimski is settled in New East Prussia or in South Prussia. Hoym's
    report of May 1796 is not in the file.
  de: >-
    Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, Antoni Prusimski
    sei Ende 1794 mit seiner Frau nach Venedig geflohen, dort auch nach dem
    Basler Frieden tätig geblieben, wie Hoym am 9. Mai 1796 meldete, und Mitte
    März 1797 von den Österreichern nach Mantua vertrieben worden. Die Akte
    des auswärtigen Departements in der Edition fällt in diese Monate: die
    Depesche des preußischen Residenten in Venedig, Graf Cattaneo, vom 14.
    Dezember 1796 über Prusimskis zerrüttete Gesundheit und seine Bitte um
    ein Attest, dass er nicht reisen könne; das Schreiben des Departements
    vom 11. Januar 1797, das sie den Ministern Hoym und Schroetter mitteilt;
    und Schrötters Antwort vom 29. Januar 1797, es stehe nicht fest, ob
    Prusimski in Neuostpreußen oder in Südpreußen angesessen sei. Hoyms
    Bericht vom Mai 1796 ist nicht in der Akte.

- id: pachonski1982-commission
  passages:
    - pachonski1982/583
  documents:
    - app53170koningr145-1
  en: >-
    The Polski Słownik Biograficzny (Pachoński, 1982) says that the Sejm of
    1773-1775 appointed several commissions to settle disputes over Antoni
    Prusimski's estates, Trąbczyn among them. The edition has the decree of
    the commission for Trąbczyn: appointed by an act of the Sejm recorded at
    Warsaw on 1 June 1774 to decide the boundary between Trąbczyn and the
    Chełmskis' Łukomia, it sat on the disputed ground in September 1775 and
    found Prusimski's boundary line the better.
  de: >-
    Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, der Sejm von
    1773-1775 habe mehrere Kommissionen zur Entscheidung von Streitigkeiten
    über Antoni Prusimskis Güter eingesetzt, darunter über Trąbczyn. Die
    Edition hat das Dekret der Kommission für Trąbczyn: durch eine am 1. Juni
    1774 in Warschau eingetragene Konstitution des Sejm eingesetzt, um die
    Grenze zwischen Trąbczyn und dem Łukomia der Chełmski zu entscheiden,
    tagte sie im September 1775 auf dem strittigen Grund und befand
    Prusimskis Grenzlinie für die bessere.

- id: pachonski1982-confiscation
  passages:
    - pachonski1982/583
  documents:
    - ihagrrep7cnr3570-1
  en: >-
    The Polski Słownik Biograficzny (Pachoński, 1982) says that after the
    rising of 1794 the Prussian government declared Antoni Prusimski a rebel
    and confiscated his property, and calls General Hohenlohe-Ingelfingen
    the holder of the estate confiscated from him. In the edition's file of
    July and August 1796 Hoym proposes to give the Prince of
    Hohenlohe-Ingelfingen the estates confiscated from "the chief insurgent
    Anton von Prusimski", Kamionna, Kolno and Trąbczyn among them, and
    Colonel von Sanitz the villages of Pawłów, Dzwonów and Beerenbusch,
    which the PSB names among the estates the Sejm's commissions were to
    settle; the King's order approves.
  de: >-
    Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, nach dem
    Aufstand von 1794 habe die preußische Regierung Antoni Prusimski zum
    Rebellen erklärt und sein Vermögen konfisziert, und nennt General
    Hohenlohe-Ingelfingen den Inhaber des ihm konfiszierten Gutes. In der
    Akte der Edition vom Juli und August 1796 schlägt Hoym vor, dem Fürsten
    von Hohenlohe-Ingelfingen die "dem Haupt-Insurgenten Anton von
    Prusimski" konfiszierten Güter zu geben, darunter Kamionna, Kolno und
    Trąbczyn, und dem Obristen von Sanitz die Dörfer Pawłów, Dzwonów und
    Beerenbusch, die der PSB unter den Gütern nennt, über die die
    Kommissionen des Sejm entscheiden sollten; die Kabinettsorder genehmigt
    es.

- id: pachonski1982-restitution
  passages:
    - pachonski1982/583
  documents:
    - agad11740273-2
    - agad11740273-3
    - agad11740273-4
    - agad11740273-1
    - agad1174016-2
  en: >-
    The Polski Słownik Biograficzny (Pachoński, 1982) says that after
    Prussia's defeat, while General Hohenlohe-Ingelfingen, who held the
    estate confiscated from Antoni Prusimski, was a prisoner of the French,
    efforts were renewed to have the lost estates given back to his family.
    The edition has those efforts, at Dresden in July 1807: the petitions of
    his daughter Michalina Dąbska to the Governing Commission and to Napoleon
    for Trąbczyn, Kamionna, Kolno and Pawłowo, confiscated for the Prussian
    generals Hohenlohe, Bischoffswerder and Sanitz, and the commission's
    resolution of 21 July 1807, which extended to her the Emperor's decree
    given at Finckenstein for Wybicki.
  de: >-
    Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, nach der
    Niederlage Preußens, als General Hohenlohe-Ingelfingen, der Inhaber des
    Antoni Prusimski konfiszierten Gutes, Gefangener der Franzosen war, seien
    die Bemühungen erneuert worden, der Familie die verlorenen Güter
    zurückzugeben. Die Edition hat diese Bemühungen, in Dresden im Juli 1807:
    die Bittschriften seiner Tochter Michalina Dąbska an die
    Regierungskommission und an Napoleon um Trąbczyn, Kamionna, Kolno und
    Pawłowo, konfisziert zugunsten der preußischen Generale Hohenlohe,
    Bischoffswerder und Sanitz, und den Beschluss der Kommission vom 21. Juli
    1807, der das in Finckenstein für Wybicki ergangene Dekret des Kaisers
    auf sie ausdehnte.

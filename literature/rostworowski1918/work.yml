account_en: >-
  The day-by-day journal of the Governing Commission of the Duchy of Warsaw,
  the body that carried the government from January 1807 while Napoleon held
  the country, printed for the first time from the manuscript in 1918 by
  Michał Rostworowski for the Academy of Learning at Kraków. Each sitting is
  recorded with the memorials received and referred, the resolutions taken and
  the attendance of the President, Stanisław Małachowski, and the Directors.
  The later part of the volume adds the protocols of the Directorium
  Generalne, the council of Directors left in Warsaw while the Commission sat
  at Dresden in July 1807. Four passages are given, those on the memorial and
  petitions of Michalina Dąbska, née Prusimska, for the return of her father's
  confiscated estates, from 13 February to the sitting at Dresden of 21 July
  1807.
account_de: >-
  Das Tagebuch der Regierungskommission des Herzogtums Warschau, der Behörde,
  die ab Januar 1807 die Regierung führte, während Napoleon das Land hielt,
  1918 von Michał Rostworowski für die Akademie der Wissenschaften in Krakau
  erstmals aus der Handschrift gedruckt. Jede Sitzung ist verzeichnet mit den
  eingegangenen und überwiesenen Memorialen, den gefassten Beschlüssen und der
  Anwesenheit des Präsidenten Stanisław Małachowski und der Direktoren. Der
  spätere Teil des Bandes fügt die Protokolle des Directorium Generalne hinzu,
  des Rates der Direktoren, der in Warschau blieb, während die Kommission im
  Juli 1807 in Dresden tagte. Wiedergegeben sind vier Stellen, die über das
  Memorial und die Bittschriften der Michalina Dąbska, geb. Prusimska, um die
  Rückgabe der eingezogenen Güter ihres Vaters, vom 13. Februar bis zur
  Sitzung in Dresden am 21. Juli 1807.


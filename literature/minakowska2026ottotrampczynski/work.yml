account_en: >-
  The page of Wojciech Otto-Trąmpczyński in Maria Jadwiga Minakowska's online
  genealogy Wielka genealogia Minakowskiej (sejm-wielki.pl), person sw.35437,
  as saved on 22 October 2026. It is a short page, entered from a regest of
  the Pyzdry court books in the Teki Dworzaczka, with no biography, parents or
  ancestors. It gives his marriage, about 1590, to Anna Cerekwicka; their son
  Stanisław, whose marriage to Anna Słonecka in 1614 promised her a dowry of
  7,000 zł on half the estates; and the descendants through Stanisław, among
  them the second Wojciech and his wife Marianna née Zawadzka. Dates marked
  "?" are the database's estimates.

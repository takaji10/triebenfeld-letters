account_en: >-
  A catalogue of the old village buildings of the Pyzdry Forest, the wooded
  country between Pyzdry, Kalisz and Konin that the Olęder settlers took up
  from the eighteenth century, by Piotr Szwiec of the Studio of Detail Design
  at the Academy of Fine Arts in Poznań, from fieldwork of autumn 2009 by a team of
  ethnographers and architects for the MECENAT Association's project "The
  Pyzdry Forest: the Olęders and their iron houses". Trąbczyn, Wrąbczynek,
  Wrąbczynkowskie Holendry and Orlina are among the twenty-two villages it
  studied. It describes how the dwelling houses and farm buildings were built
  (in timber, half-timbering, clay, brick and above all bog iron ore, the
  "iron" of the "iron houses"), their roofs, windows and doors, their small
  structures, and the plan of the Olęder villages, with 150 photographs and
  maps. It is a survey of buildings standing in 2009, mostly of
  the nineteenth and twentieth centuries; its pages on the history of
  settlement quote Zbigniew Chodyła. Its captions do not name the villages.
account_de: >-
  Ein Katalog der alten Dorfbauten der Puszcza Pyzdrska, des Waldlands
  zwischen Pyzdry, Kalisz und Konin, das die Olęder-Siedler seit dem 18.
  Jahrhundert urbar machten, von Piotr Szwiec vom Atelier für Detailgestaltung
  der Kunstakademie Posen, nach Feldforschungen eines Teams von Ethnographen und
  Architekten im Herbst 2009 für das Projekt „Puszcza Pyzdrska: die Olęder und
  ihre eisernen Häuser“ des Vereins MECENAT. Trąbczyn, Wrąbczynek,
  Wrąbczynkowskie Holendry und Orlina gehören zu den zweiundzwanzig
  untersuchten Dörfern. Er beschreibt, wie Wohnhäuser und Wirtschaftsgebäude
  gebaut wurden (aus Holz, in Fachwerk, aus Lehm, Ziegeln und vor allem
  Raseneisenerz, dem „Eisen“ der „eisernen Häuser“), ihre Dächer, Fenster und
  Türen, die kleinen Bauten im Hof und die Anlage der Olęder-Dörfer, mit 150
  Fotografien und Karten. Es ist eine Bestandsaufnahme von
  Bauten, die 2009 standen, meist aus dem 19. und 20. Jahrhundert; seine
  Seiten über die Geschichte der Besiedlung zitieren Zbigniew Chodyła. Die
  Bildunterschriften nennen die Dörfer nicht.

# The card's own short rendering of the account (the list pages, 2026-10-29); the account stays whole on the item's page.
brief_en: >-
  A catalogue of the old village buildings of the Pyzdry Forest from the
  fieldwork of autumn 2009 by a Poznań team, with 22 villages studied —
  Trąbczyn, Wrąbczynek, Wrąbczynkowskie Holendry and Orlina among them — and
  the ways the houses and farm buildings were built: in timber,
  half-timbering, clay, brick and above all bog iron ore, the "iron" of the
  "iron houses".
brief_de: >-
  Ein Katalog der alten Dorfbauten der Pyzdryer Heide nach der Feldforschung
  des Herbstes 2009 eines Posener Teams, mit zweiundzwanzig untersuchten
  Dörfern — Trąbczyn, Wrąbczynek, Wrąbczynkowskie Holendry und Orlina unter
  ihnen — und den Bauarten der Wohn- und Wirtschaftsgebäude: aus Holz, in
  Fachwerk, aus Lehm, Ziegeln und vor allem Raseneisenerz, dem „Eisen" der
  „eisernen Häuser".

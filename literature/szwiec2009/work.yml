account_en: >-
  Piotr Szwiec of the Academy of Fine Arts in Poznań catalogues the old
  village buildings of the Pyzdry Forest, the wooded country between Pyzdry,
  Kalisz and Konin that Olęder settlers took up from the eighteenth century,
  from fieldwork of autumn 2009 by a team of ethnographers and architects for
  the MECENAT Association. Trąbczyn, Wrąbczynek, Wrąbczynkowskie Holendry and
  Orlina are among the twenty-two villages studied. He describes how the
  houses and farm buildings were built, in timber, half-timbering, clay, brick
  and above all bog iron ore, the "iron" of the "iron houses", with their
  roofs, windows and doors and the plan of the villages, in 150 photographs
  and maps. Most of the buildings are of the nineteenth and twentieth
  centuries.
account_de: >-
  Piotr Szwiec von der Akademie der Schönen Künste in Posen verzeichnet die
  alten Dorfbauten der Pyzdrer Heide, des Waldlandes zwischen Pyzdry, Kalisch
  und Konin, das Olęder-Siedler seit dem 18. Jahrhundert urbar machten, nach
  Feldforschungen im Herbst 2009 einer Gruppe von Ethnographen und Architekten
  für den Verein MECENAT. Trąbczyn, Wrąbczynek, Wrąbczynkowskie Holendry und
  Orlina sind unter den zweiundzwanzig untersuchten Dörfern. Er beschreibt,
  wie die Häuser und Wirtschaftsgebäude gebaut wurden, aus Holz, Fachwerk,
  Lehm, Ziegel und vor allem Raseneisenerz, dem „Eisen“ der „eisernen Häuser“,
  mit ihren Dächern, Fenstern und Türen und der Anlage der Dörfer, in 150
  Fotos und Karten. Die meisten Bauten stammen aus dem 19. und 20.
  Jahrhundert.


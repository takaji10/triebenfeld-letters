brief_en: >-
  Robert Frost's article on the nobility of the Polish-Lithuanian Commonwealth
  from 1569 to 1795 — how the szlachta won and kept its privileges, the
  magnate families' rise and fall, the redefinition of nobility by property in
  the reforms of Stanisław August — written from, among others, Great Poland's
  evidence: background to the noble society that owned and ruled the edition's
  estates.

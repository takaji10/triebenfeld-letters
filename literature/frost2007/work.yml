account_en: >-
  Robert I. Frost, a British historian of Poland at the University of
  Aberdeen, on the nobility of the Polish-Lithuanian Commonwealth from the
  Union of Lublin in 1569 to the third partition in 1795. He shows how the
  szlachta, perhaps 6 to 7.5 per cent of the population and most of it poor,
  won its privileges and kept its hold on the state, and how the great
  latifundia rested on royal leases and serf labour. Against the older view of
  a "magnate oligarchy", he argues that the magnate families never formed a
  stable élite, and he ends with the redefinition of nobility by property
  under Stanisław August. Much of his evidence comes from Great Poland, among
  it the land market of the Kalisz district between 1580 and 1655.
account_de: >-
  Robert I. Frost, britischer Historiker Polens an der Universität Aberdeen,
  über den Adel der Adelsrepublik Polen-Litauen von der Union von Lublin 1569
  bis zur dritten Teilung 1795. Er zeigt, wie die szlachta, vielleicht 6 bis
  7,5 Prozent der Bevölkerung und meist arm, ihre Privilegien gewann und den
  Staat im Griff behielt, und wie die großen Latifundien auf königlichem
  Pachtland und Frondienst ruhten. Gegen die ältere These einer
  „Magnatenoligarchie“ zeigt er, dass die Magnatenfamilien nie eine beständige
  Spitze bildeten, und er schließt mit der Neubestimmung des Adels durch
  Eigentum unter Stanisław August. Viele seiner Belege stammen aus Großpolen,
  darunter der Landmarkt des Kreises Kalisch zwischen 1580 und 1655.


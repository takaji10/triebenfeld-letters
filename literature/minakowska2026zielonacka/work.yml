  The page of Helena Zielonacka in Minakowska's online genealogy, brought in
  for her marriage of about 1720 to Józef Ścibor-Chełmski, the heir of Łukomia
  and Łomowo whom the edition's decree of 1728 names — the mother of the
  Chełmskis the edition's boundary decree of 1775 names.
brief_de: >-
  Die Seite der Helena Zielonacka in Minakowskas Online-Genealogie,

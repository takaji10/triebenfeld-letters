brief_en: >-
  Breyer's study of the German villages of the Warthe marshes between Pyzdry
  and Uniejów — settlement history, villages, schools, a table of the 1921
  census — with the contract of 1805 by which Triebenfeld let a hundred Hufen
  of the estate's forest to eighteen settlers; written for a journal of the
  German minority in 1938, its language is that of its cause, and its facts
  are to be held against the documents.
brief_de: >-
  Breyers Untersuchung der deutschen Dörfer des Warthebruchs zwischen Pyzdry
  und Uniejów — Besiedlungsgeschichte, Dörfer, Schulen, eine Tabelle der
  Volkszählung von 1921 — mit dem Vertrag von 1805, mit dem Triebenfeld
  einhundert Hufen des Waldes des Gutes an achtzehn Siedler ausgab; 1938 für
  ein Blatt der deutschen Minderheit geschrieben, ist seine Sprache die seiner
  Sache, und seine Angaben sind an den Dokumenten zu prüfen.

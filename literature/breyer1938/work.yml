account_en: >-
  Albert Breyer's study of 1938 of the German villages in the Warthe valley
  between Pyzdry and Uniejów: the landscape and farming, the settlement from
  the Cistercians of Ląd to the 1930s, where the settlers came from and where
  they went, and a table of the villages by the census of 1921. Breyer, a
  teacher at the German school in Sompolno, wrote from the Lutheran church
  books, from village papers he saw himself, among them the copy of the
  settlers' contract in the mayor's office at Emilienheim, and from what the
  villagers told him. Pages 21 and 22 deal with Hohenlohe's estates of Zagórów
  and Trąbczyn and the contract of 1805 by which Triebenfeld let 100 Hufen of
  forest to eighteen settlers; later pages follow their villages to 1928. It
  was written for a journal of the German minority, in the language of its
  time and cause.
account_de: >-
  Albert Breyers Studie von 1938 über die deutschen Dörfer im Warthetal
  zwischen Pyzdry und Uniejów: Landschaft und Landwirtschaft, die Besiedlung
  von den Zisterziensern von Ląd bis in die 1930er Jahre, Herkunft und
  Abwanderung der Siedler und eine Tabelle der Dörfer nach der Volkszählung
  von 1921. Breyer, Lehrer an der deutschen Schule in Sompolno, schrieb aus
  den lutherischen Kirchenbüchern, aus Dorfpapieren, die er selbst sah,
  darunter der Abschrift des Siedlervertrags im Schulzenamt von Emilienheim,
  und aus dem, was ihm die Dorfleute erzählten. Die Seiten 21 und 22 gelten
  den Hohenloheschen Gütern Zagórów und Trąbczyn und dem Vertrag von 1805,
  durch den Triebenfeld achtzehn Siedlern 100 Hufen Wald verpachtete; spätere
  Seiten verfolgen ihre Dörfer bis 1928. Geschrieben für eine Zeitschrift der
  deutschen Minderheit, in der Sprache ihrer Zeit und ihrer Sache.


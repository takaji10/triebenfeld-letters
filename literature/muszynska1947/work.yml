account_en: >-
  Janina Muszyńska-Zygmańska's 1947 monograph on Greater Poland
  (Wielkopolska) in the Kościuszko Insurrection. It follows the province from
  the Second Partition and the first years of Prussian rule, through the
  outbreak of 1794 and the reasons Greater Poland joined it late, the local
  armed movement and Dąbrowski's expedition, to the fall of the insurrection,
  the last efforts of the Greater Poles and the Prussian trials, sequestrations
  and reforms that followed. It rests on the South Prussian administrative
  files in the State Archive in Poznań, the press, memoirs and the printed
  sources, and states its judgements plainly. A work of its time, written in
  Poznań in 1947.
account_de: >-
  Janina Muszyńska-Zygmańskas Monographie von 1947 über Großpolen
  (Wielkopolska) im Kościuszko-Aufstand. Sie verfolgt die Provinz von der
  Zweiten Teilung und den ersten Jahren der preußischen Herrschaft über den
  Ausbruch von 1794 und die Gründe, warum sich Großpolen ihm erst später
  anschloss, die örtliche bewaffnete Bewegung und Dąbrowskis Expedition bis zum
  Zusammenbruch des Aufstands, den letzten Anstrengungen der Großpolen und den
  preußischen Prozessen, Sequestrationen und Reformen danach. Sie stützt sich
  auf die Akten der südpreußischen Verwaltung im Staatsarchiv Posen, auf Presse,
  Memoiren und gedruckte Quellen, und sagt ihre Urteile deutlich. Ein Werk
  seiner Zeit, 1947 in Posen geschrieben.


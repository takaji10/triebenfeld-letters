brief_en: >-
  The Warthegau chapter of the United States Holocaust Memorial Museum's
  encyclopedia of the ghettos, with the entries on the district's "hamlet
  ghettos", Zagórów among them: how the Jews of the Konin district were driven
  into them in July 1940, and the deportations and murders of 1941, those of
  the Zagórów ghetto in the Kazimierz Biskupi Forest.
brief_de: >-
  Das Warthegau-Kapitel der Enzyklopädie der Ghettos des United States
  Holocaust Memorial Museum, mit den Artikeln zu den „Dorfghettos" des
  Kreises, Zagórów darunter: wie die Juden des Kreises Konin im Juli 1940 in
  sie getrieben wurden, und die Deportationen und Ermordungen von 1941, die
  denen des Ghettos Zagórów im Wald von Kazimierz Biskupi.

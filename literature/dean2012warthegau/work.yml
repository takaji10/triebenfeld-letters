account_en: >-
  Pages of the United States Holocaust Memorial Museum's encyclopedia of the
  ghettos, from its chapter on the Reichsgau Wartheland, the part of Poland
  Germany annexed in 1939, Konin and Kalisz with it: the chapter's
  introduction (pp. 34-39), and the entries on the ghettos of Chocz,
  Grodziec, Kalisz, Konin, Rzgów and Zagórów, with what shares their pages.
  They tell how the Jews of the district of Konin were driven in July 1940
  into "hamlet ghettos" at Grodziec, Rzgów and Zagórów, with the Germans'
  names for the places (Grodziec "Grossdorf", Zagórów "Hinterberg"), the
  deportations of March 1941 and the murder of the Zagórów ghetto in the
  Kazimierz Biskupi Forest in the autumn of 1941. Each entry is a scholar's
  account from testimonies, archives and the literature, which it lists;
  the notes give the sources.
account_de: >-
  Seiten aus der Enzyklopädie der Ghettos des United States Holocaust
  Memorial Museum, aus ihrem Kapitel über den Reichsgau Wartheland, den Teil
  Polens, den Deutschland 1939 annektierte, Konin und Kalisch eingeschlossen:
  die Einleitung des Kapitels (S. 34-39) und die Artikel über die Ghettos
  von Chocz, Grodziec, Kalisz, Konin, Rzgów und Zagórów, mit dem, was auf
  ihren Seiten mitsteht. Sie berichten, wie die Juden des Kreises Konin im
  Juli 1940 in „Dorfghettos“ in Grodziec, Rzgów und Zagórów getrieben
  wurden, mit den deutschen Ortsnamen (Grodziec „Grossdorf“, Zagórów
  „Hinterberg“), von den Deportationen im März 1941 und der Ermordung der
  Bewohner des Ghettos Zagórów im Wald von Kazimierz Biskupi im Herbst
  1941. Jeder Artikel ist die Darstellung eines Wissenschaftlers aus
  Zeugenaussagen, Archiven und Literatur, die er nennt; die Anmerkungen
  geben die Quellen. Der Text ist englisch; die Lizenz des Buches
  erlaubt keine Übersetzung.


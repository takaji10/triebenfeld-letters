account_en: >-
  Two chapters of Albert Breyer's survey of the German settlements of central
  Poland, published in 1935. Chapter V is on the Warthe marshes between Koło,
  Konin and Uniejów, chapter VI on the sandy, wooded country south of Zagórów
  and Konin and north of Kalisz. Each describes the landscape and the
  villages, their founding, where the settlers came from, and their schools
  and churches. Page 41 tells how Paul Prusiński, owner of Trąbczyn, let the
  woods south of the estate to "honest Hollanders" in 1746, and how Łazińsk
  Holland arose. Breyer wrote for German readers in Poland and in Germany, in
  the language of the minority's cause.
account_de: >-
  Zwei Kapitel aus Albert Breyers Überblick über die deutschen Siedlungen
  Mittelpolens, erschienen 1935. Kapitel V gilt dem Warthebruch zwischen Koło,
  Konin und Uniejów, Kapitel VI dem sandigen Waldland südlich von Zagórów und
  Konin und nördlich von Kalisch. Beide schildern die Landschaft und die
  Dörfer, ihre Gründung, die Herkunft der Siedler und ihre Schulen und
  Kirchen. Seite 41 erzählt, wie Paul Prusiński, der Besitzer von Trąbczyn,
  1746 die Wälder südlich des Gutes an „ehrliche Holländer“ vergab und Łazińsk
  Hauland entstand. Breyer schrieb für deutsche Leser in Polen und im Reich,
  in der Sprache der Sache der Minderheit.


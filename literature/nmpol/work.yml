summary_en: >-
  Not a work read whole but a citation file: the 23 entries of the Nazwy miejscowe Polski
  that the gazetteer cites, one per heading with its volume and
  page, in the corrected transcription of 2026-10-27. Each entry carries the
  dictionary's own wording – the settlement's status, its administrative
  seat, its distance from the market town, its houses and inhabitants, the
  dated forms of its name, and the etymological note where the dictionary
  gives one. The companion english.md is a summary of each entry, not a
  translation. The dictionaries themselves are not republished here; their
  texts stay whole in the private place-name repository.
summary_de: >-
  Kein ganz gelesenes Werk, sondern eine Zitatdatei: die 23 Einträge des
  Nazwy miejscowe Polski, die das Gazetteer zitiert, einer je Überschrift mit
  Band und Seite, in der korrigierten Transkription vom 27.10.2026. Jeder
  Eintrag trägt den Wortlaut des Wörterbuchs – Stand, Verwaltungssitz,
  Entfernung vom Marktstädtchen, Häuser und Einwohner, die datierten
  Namensformen und wo geboten die etymologische Notiz. Das begleitende
  english.md fasst jeden Eintrag zusammen, es übersetzt ihn nicht. Die
  Wörterbücher selbst werden hier nicht wiederveröffentlicht; ihre Texte
  bleiben im privaten namenkundlichen Repository.
account_en: >-

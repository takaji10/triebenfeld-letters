account_en: >-
  Robert Kucharski, a public prosecutor in Częstochowa who writes on the
  history of the Polish courts, surveys the noble judiciary of the
  Commonwealth from the 15th century to the end of its independence. He
  describes the land, municipal and podkomorski courts, the judicial offices
  from the judge to the court scribe and the chancellery with its books, and
  the process itself, its stages, proofs, appeals and punishments. He closes
  with the crisis of the land courts in the 17th and 18th centuries and their
  abolition by the Four-Year Sejm. The survey rests on the standard
  literature.
account_de: >-
  Robert Kucharski, Staatsanwalt in Częstochowa, der über die Geschichte der
  polnischen Gerichte schreibt, gibt einen Überblick über die adlige
  Gerichtsbarkeit der Adelsrepublik vom 15. Jahrhundert bis zum Ende ihrer
  Unabhängigkeit. Er beschreibt die Land-, Grod- und Unterkämmerergerichte,
  die Gerichtsämter vom Richter bis zum Gerichtsschreiber und die Kanzlei mit
  ihren Büchern und das Verfahren selbst mit seinen Stufen, Beweisen,
  Berufungen und Strafen. Er schließt mit der Krise der Landgerichte im 17.
  und 18. Jahrhundert und ihrer Abschaffung durch den Vierjährigen Sejm. Der
  Überblick stützt sich auf die Standardliteratur.


account_en: >-
  Parish monographs of the Evangelical-Augsburg (Lutheran) diocese of Kalisch
  by the pastor Eduard Kneifel, written while he was a pastor in Łódź and
  published in 1937 as the first volume of his Forschungen zur Geschichte der
  evangelisch-augsburgischen Kirche in Polen. Each parish is treated in the
  same order: its history, founding and buildings, pastors and cantors, church
  councils, schools and cantorates, and a table of its yearly figures, drawn
  from the parish archives, the church papers and the author's own knowledge.
  Given here are the introductory chapter on the diocese and the monographs of
  Kalisch, Grodziec, Konin with its filial Maślaki, and Zagórów, with the
  Łazińsk cantorate founded in 1746 and the Trąbczyn villages.
account_de: >-
  Pfarrmonographien der evangelisch-augsburgischen (lutherischen) Diözese
  Kalisch von dem Pastor Eduard Kneifel, geschrieben während seiner Zeit als
  Pastor in Lodz und 1937 als erster Band seiner Forschungen zur Geschichte
  der evangelisch-augsburgischen Kirche in Polen erschienen. Jede Gemeinde
  wird in derselben Ordnung behandelt: ihre Geschichte, Gründung und Bauten,
  Pastoren und Kantoren, Kirchenräte, Schulen und Kantorate und eine Tabelle
  ihrer Jahreszahlen, aus den Pfarrarchiven, den Kirchenblättern und der
  eigenen Kenntnis des Verfassers. Wiedergegeben sind das einleitende Kapitel
  über die Diözese und die Monographien von Kalisch, Grodziec, Konin mit dem
  Filial Maślaki und Zagórów, mit dem 1746 gegründeten Kantorat Łazińsk und
  den Trąbczyner Dörfern.


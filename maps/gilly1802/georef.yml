# Control points of one map: a pixel of the original image tied to a point on
# the ground (docs/MAPS_PLAN.md, section 5). gilly1802 has no MapWarper
# georeference of its own (the editor's 83446 was made on a different version
# of the map, the editor's word 2026-11-06): these points are synthetic, cut
# by correlating BII.jpg against the warped tiles of MapWarper 63625 ("South
# Prussia, Kalisz Region, 1802-1803" - the same cartography), whose
# Web-Mercator geometry is exact. BII is drawn with its meridian tilted
# ~15 deg (the match's rotation); the method and the fits are in
# scratch/maps_bulk/gilly63625*.py. Rows with `from: synthetic` are replaced
# on every run of the cutting script; rows with `from: mapwarper` would be
# replaced by mapwarper.py (none here); any other rows are kept. `fit:` is
# written by pipeline/maps/georef.py.

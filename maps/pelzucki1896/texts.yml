          - гор. Калишъ, 27 [?] Марта 1898 года.
          - Межевой Ревизоръ [signature]
          - Непремѣнный Членъ Калишскаго Губернскаго по крестьянскимъ дѣламъ Присутствія [signature]
        translation:
          en:
            - The accuracy of this copy with the original plan is certified by my signature.
            - City of Kalisz, 27 [?] March 1898.
            - Land Survey Inspector [signature]
            - Permanent Member of the Kalisz Governorate Board for Peasant Affairs [signature]
          de:
            - Die Richtigkeit der vorliegenden Kopie gegenüber dem Originalplan wird durch meine Unterschrift beglaubigt.
            - Stadt Kalisch, 27. [?] März 1898.
            - Vermessungsrevisor [Unterschrift]
            - Ständiges Mitglied des Kalischer Gouvernementsausschusses für Bauernangelegenheiten [Unterschrift]
      - lines:
          - Сія копія выдается изъ Калишскаго Губернскаго по крестьянскимъ дѣламъ Присутствія, на основаніи 1465 ст. Постановленія Учредительнаго Комитета, крестьянамъ селенія Лазинскіе Голендры, гмины Тромчинъ, Слупецкаго уѣзда, Калишской Губерніи, въ семъ подписью съ приложеніемъ казенной печати удостовѣряется.
          - г. Калишъ, 19 Іюля 1900 года.
          - Непремѣнный Членъ Калишскаго Губернскаго по крестьянскимъ дѣламъ Присутствія [signature]
        translation:
          en:
            - This copy is issued by the Kalisz Governorate Board for Peasant Affairs, on the basis of Article 1465 of the Decree of the Establishment Committee, to the peasants of the village of Łazińskie Holendry, gmina Tromczyn, Słupca uezd, Kalisz Governorate, and is certified herein by signature with the affixing of the official seal.
            - City of Kalisz, 19 July 1900.
            - Permanent Member of the Kalisz Governorate Board for Peasant Affairs [signature]
          de:
            - Diese Kopie wird aus dem Kalischer Gouvernementsausschuss für Bauernangelegenheiten auf Grund des Artikels 1465 der Verordnung des Errichtungskomitees den Bauern des Dorfes Łazińskie Holendry, Gemeinde Tromczyn, Ujezd Słupca, Gouvernement Kalisch, ausgehändigt und hierdurch durch Unterschrift mit Beidrückung des Amtssiegels beglaubigt.
            - Stadt Kalisch, 19. Juli 1900.
            - Ständiges Mitglied des Kalischer Gouvernementsausschusses für Bauernangelegenheiten [Unterschrift]
      - lines:

# The texts on the sheet of the map pelzucki1896, for its page on the site:
# the title block (cartouche), the certification texts and the explication
# (the land-area table). The Russian is the transcription kept as transcribed
# (the editor's AN-4456 folder, files legend_transcription.md,
# written_text_transcription.md, eksplikatsia_transcription.md; pre-reform
# orthography, [?] an uncertain reading, [signature] a handwritten signature
# not read); the English is that folder's own translation; the German is
# Claude's, made against the English. Read by pipeline/maps/map_pages.py;
# docs/MAPS_SITE_PLAN.md, section 3.
map: pelzucki1896
blocks:
  - id: cartouche
    names:
      en: The title block (cartouche)
      de: Der Titelblock (Kartusche)
    margin:
      en: 'Top left, in a different hand and blue pencil: "Копія" (copy), with the number 3.'
      de: 'Oben links, anderer Hand und in blauem Bleistift: „Копія“ (Kopie), mit der Zahl 3.'
    groups:
      - lines:
          - ПЛАНЪ
          - земель поступившихъ въ собственность крестьянъ
          - селенія
          - ЛАЗИНСКІЕ ГОЛЕНДРЫ
          - Калишской Губерніи Слупецкаго Уѣзда
          - Гмины Тромчинъ
          - Составленъ въ 1896 году Штатнымъ Землемѣромъ 2го класса Г. А. Пелзуцкимъ [?]
          - на пяти листахъ
          - По указанію магнитной стрѣлки, которая имѣла отклоненіе отъ истиннаго меридіана на западъ на 7 град. 30 минутъ
          - Планъ сей составленъ [?] на основаніи произведеннаго измѣренія въ натурѣ въ 1896 году состоящей [?] при Калишскомъ Губернскомъ Присутствіи.
          - Штатный Землемѣръ (подписалъ) Пелзуцкій [?]
          - Коммисаръ по крестьянскимъ дѣламъ Слупецкаго Уѣзда (подписалъ) А. Жемчужинъ [?]
        translation:
          en:
            - PLAN
            - of the lands that passed into the ownership of the peasants of the village
            - ŁAZIŃSKIE HOLENDRY
            - Kalisz Governorate, Słupca uezd
            - Gmina Tromczyn
            - Drawn up in 1896 by the Staff Land Surveyor of the 2nd class G. A. Pelzutskiy [?]
            - on five sheets.
            - By the indication of the magnetic needle, which had a deviation from the true meridian to the west of 7 degrees 30 minutes.
            - This plan was drawn up [?] on the basis of the field survey carried out in 1896 [...] attached to the Kalisz Governorate Board.
            - Staff Land Surveyor (signed) Pelzutskiy [?]
            - Commissioner for Peasant Affairs of the Słupca uezd (signed) A. Zhemchuzhin [?]
          de:
            - PLAN
            - der Ländereien, die in das Eigentum der Bauern des Dorfes übergegangen sind
            - ŁAZIŃSKIE HOLENDRY
            - Gouvernement Kalisch, Ujezd Słupca
            - Gemeinde Tromczyn
            - Aufgenommen im Jahre 1896 durch den etatmäßigen Landvermesser zweiter Klasse G. A. Pelzutskij [?]
            - auf fünf Blättern.
            - Nach Angabe der Magnetnadel, die vom wahren Meridian um 7 Grad 30 Minuten nach Westen abwich.
            - Dieser Plan ist [?] auf Grund der im Jahre 1896 vorgenommenen örtlichen Vermessung angefertigt worden, [...] beim Kalischer Gouvernements-Präsenium.
            - Etatmäßiger Landvermesser (unterzeichnet) Pelzutskij [?]
            - Kommissar für Bauernangelegenheiten des Ujezd Słupca (unterzeichnet) A. Shemtschuschin [?]

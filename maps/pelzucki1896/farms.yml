# The farmsteads of the liquidation and the editor's labels on the plan
# (map pelzucki1896).
#
# settlers: the rows of the liquidation's tables joined by the farm number
# (APL 39/98/0/-/6603 docs 1 and 6, Breyer's copy APP 53/968/0/-/716-4, the
# 1894 inscription doc 4), from the join of 2026-11-01
# (scratch/map4456/link_tables.py, oleders_linked.json), spot-checked against
# the corpus of apl399806603 doc 6. The names are the tables'
# transliterations; changed marks a row whose 1868 and 1896 names differ
# (one true change, the rest orthography - the editor rules which).
# total is the 1896 statement's total (desyatinas and sazhens), morgen/rods
# the 1868 extent, dues the 1868 dues, servitudes the 1894 land given.
#
# marks: one label per farmstead, the position of its homestead yard (the
# editor's yard marking of 2026-11-02, scratch/map4456/yards_read.json, one
# mark per farm - the piece with the lead 1. and the smallest figure). The
# positions are in the pixels of the mosaic (reference/maps.yml); the layer
# on the map's page shows the settler's name only. Farms still without a
# mark are added on the working page (scratch/map4456/farm_labels.html) and
# imported by pipeline/maps/import_farms.py.

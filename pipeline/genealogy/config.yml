# The genealogy explorer's build configuration (PLAN.md).
#
# The inputs are the editor's own files and stay on this machine; only the
# redacted JSON and the web media derivatives are ever published. To update
# the database, export a fresh GEDCOM and gpkg from Gramps anywhere on disk
# and point the build at them:
#
#   python pipeline/genealogy/build.py --ged J:\Zelmer\new.ged --gpkg J:\Zelmer\new.gpkg
#
# or edit the defaults here. The build writes its review reports to
# review/genealogy/ (gitignored) and its public JSON to site/genealogy/data/.

inputs:
  ged: "J:/Zelmer/Zelmer.ged"
  gpkg: "J:/Zelmer/Zelmer.gpkg"
  # Where the build caches data.gramps and, later, the extracted media.
  cache: "J:/Zelmer/.cache"

media:
  # The published web derivatives (repo B). The site's pages join this
  # base with the manifest's file names; empty until the repo is live.
  # The manifest's file fields are relative to the repo's media/
  # directory (a bare "<hash>.jpg" sits in media/, a docx "originals/"
  # sits in media/originals/), so the base carries that segment - without
  # it every image on the site 404ed and showed "image not published"
  # (found 2026-11-06 on I3131's two records; every media item was
  # affected, the paths in the manifest were never the URL).
  base: "https://takaji10.github.io/genealogy-media/media/"
  # The local working copy media_build.py writes into (git init'ed, pushed
  # to repo B).
  dest: "J:/Zelmer/genealogy-media"

exclusion:
  # Larry Charles Lacko (@I0005@): everything connected to him only
  # through his ancestors leaves the database - their whole family world,
  # walked in every direction (blood lines, the spouses married into
  # them, and the spouses' own families behind them). Larry, his
  # descendants and everything reachable from him (the Zelmer side and
  # its in-laws) stay. The plan's section 4.3 carries the semantics.
  roots: ["I0005"]
  # Islands the walks cannot reach: people with no recorded family link
  # to either world, named by the editor's ruling (2026-11-06) - the
  # [Living] Trzeciak couple I1232/I1235, placeholders with no parents,
  # children or events, whose surname belongs to the excluded world.
  people: ["I1232", "I1235"]

privacy:
  # A person is treated as living when their latest plausible birth year is
  # on or after this age limit counted back from today, or when the evidence
  # is missing but a close relative is treated as living. The GEDCOM's own
  # "[Living]" name marker always wins.
  age_limit: 100

# Build the Jekyll site and publish it to GitHub Pages.
#
# The site source lives in site/, not the repository root, which GitHub's
# built-in Pages builder does not support - hence an explicit workflow. It also
# buys us the thing that matters most here: verify_site.py runs against the
# built HTML and blocks the deploy if the diplomatic text has drifted from the
# corpus by even one character.
#
# base_path from configure-pages is "" for a user site (<name>.github.io) and
# "/<repo>" for a project site, so the same workflow serves both.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        working-directory: site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      # Character-exact text, resolving links, no external requests.
      #
      # verify_site.py was stdlib-only and this step installed nothing. It now
      # reads the units through unitlib, which parses unit.yml, so PyYAML is a
      # real dependency of the gate. The first push after that change failed
      # here - which is the gate working: an unverifiable build does not
      # publish.
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Verify built site
        env:
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
        run: python verify_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

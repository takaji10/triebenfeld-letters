# The works the gazetteer cites (docs/GAZETTEER_PLAN.md), and where each is in
# the edition.
#
# The editor's place index (reference/gazetteer/, imported 2026-10-23 from
# their file "Place Names.md") cites its facts in footnotes. Each footnote is
# resolved to one or more references: a key below and a locator (a volume and
# number, a leaf, a page). The key says where the work is in the edition, and
# so whether the footnote can link to it now.
#
#   cite        the work, written out once
#   kind        archive | edition | book | article | dictionary | register |
#               web | genealogy
#   resolve     how a locator becomes a link (pipeline/gazetteer/gazetteer.py):
#                 kdw         volume and number -> the Kodeks document
#                 leaves      a leaf of a court book ("692", "668v") -> its page
#                 table       an explicit locator -> document (and page) table
#                 document    always the one document named in `document`
#                 literature  a page -> the work's page on the site
#                 work        always the work's page (a work shown by summary)
#                 glossary    always the glossary entry named in `glossary`
#                 url         always the address in `url`
#                 none        not in the edition: the footnote stays a citation
#   in_project  what of it the edition holds, in a few words
#   wanted      for a work not (or not wholly) in the edition: what the
#               gazetteer needs of it. docs/MISSING_SOURCES.md is made from
#               this and the footnotes that cite it.
#
# Where the editor's citation and the edition's record of the same source
# differ (the archive's name, a date), the key carries `differs:` and
# docs/NEEDS_CONFIRMATION.md ("The gazetteer") asks.

sources:

  # --- in the edition --------------------------------------------------------

  kdw:
    cite: >-
      Kodeks Dyplomatyczny Wielkopolski, vols. 1-3 ed. Ignacy Zakrzewski
      (1877-1879), vol. 5 ed. Franciszek Piekosiński (1908), vols. 6, 7, 10
      ed. Antoni Gąsiorowski with Tomasz Jasiński, Ryszard Walczak and Wojciech
      Kowalewicz (1982-1993)
    kind: edition
    resolve: kdw
    in_project: "21 entries, the holding kdw; the volumes as HTML on the editor's J: drive"
    # A Kodeks entry the edition holds in another witness: the Ląd copy-book's
    # copy of the exchange of 1362 (APP 53/1455/0/2/21, pp. 25-26).
    other_witnesses:
      "3/1464": {document: app5314550221-4, page: 1}
    wanted: "the entries cited and not yet in the holding (the volumes are on the editor's drive: kdw_source.py reads them)"


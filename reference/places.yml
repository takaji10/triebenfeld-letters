# The places this edition recognises, and how each is matched and spelled.
#
# This file replaces reference/place_canon.yml, which recorded only "variant ->
# the form the edition uses" and could therefore say nothing about a place
# beyond its spelling. It could not record that two similar names are DIFFERENT
# villages, could not say which document a variant was seen in, and could not be
# matched against the body of a document at all - so Trąbczyn, the subject of
# the whole archive, was indexed only where it appeared in a dateline.
#
# The shape mirrors reference/people.yml deliberately: one authority, one set of
# habits, one loader pattern.
#
#   display       the form this edition prints. Polish diacritics preserved.
#   kind          village | town | city | estate | settlement | region | country
#   match         a regular expression, anchored at a word start by the build,
#                 for finding the place in the body of a document. Optional: a
#                 place with no `match` is still canonicalised on the dateline.
#   variants      observed spellings. A bare string is shorthand for
#                 {form: <string>, match: true}. The long form takes:
#                   form     the spelling as it appears
#                   match    false to record the variant as provenance WITHOUT
#                            folding it into this entity - for a variant that is
#                            genuinely unsettled, or belongs to another place
#                   seen_in  uids or archival references where it was observed
#   distinct_from slugs this place is repeatedly confused with. Recorded both
#                 ways, because the confusion runs both ways.
#   tier          how firmly identified, same vocabulary as people.yml
#   open_questions unresolved identity conflicts, flagged rather than resolved
#
# The canon consumed by unitlib.load_place_canon() - variant (lowercased) ->
# display - is DERIVED from `variants` here. Adding a variant therefore both
# normalises the dateline and finds the place in the text.
#
# Standardisations below follow Consistency_Register.md ("Confirmed
# terminology" and "Places"). Where the register and the corpus disagree, the
# register wins: it is the book's settled standard and this edition is meant to
# stay interoperable with it rather than compete with it.

places:

  # --- the estate and its neighbours ------------------------------------
  trabczyn:
    display: "Trąbczyn"
    kind: village
    match: 'Tr[ąa][bmp]c?z[yi]n\w*|Tromb(?:czin|schino)\w*|Trabryn\w*|Tr(?:ä|ae)bczyn\w*|Prosrzyner'
    tier: "Book-confirmed"
    variants:
      - "Trąbczin"
      - "Trąpczyn"
      - "Trąbrzyn"
      - "Trabryn"
      - "Trąbczynen"
      - {form: "Trąmpczyn", seen_in: ["Latin documents; register, Places"]}
      - {form: "Trabezyner"}
      - {form: "Trąbczner"}
      - {form: "Trąbzyn"}
      # German-era forms, confirmed in the register
      - {form: "Trombczin",  seen_in: ["Hohenlohe corpus"]}
      - {form: "Träbczyn",   seen_in: ["Hohenlohe corpus"]}
      - {form: "Prosrzyner", seen_in: ["Hohenlohe corpus"]}
    distinct_from: [wrabczyn, wrabczynek]
    open_questions:
      - "Trombschino-Hauland is the Olęder colony on the estate, not the village
         itself. It is matched here for now; when the colony has documents of its
         own it should become a separate entity."

  wrabczyn:
    display: "Wrąbczyn"
    kind: village
    match: 'Wr[ąa]bcz[yi]n(?!ek)\w*'
    tier: "Book-confirmed"
    variants: []
    distinct_from: [trabczyn, wrabczynek]
    open_questions:
      - "A DIFFERENT village from Trąbczyn, and nearby, so the two appearing in
         one document is unremarkable and is not evidence of a misreading.
         Never fold either into the other, and never match this group on a stem."

  wrabczynek:
    display: "Wrąbczynek"
    kind: village
    match: 'Wr[ąa]bcz[yi]nek\w*'
    tier: "Book-confirmed"
    variants: []
    distinct_from: [trabczyn, wrabczyn]

  lukom:
    display: "Łukom"
    kind: settlement
    match: '[ŁL]ukom(?!i)\w*'
    tier: "Book-confirmed"
    variants: []
    distinct_from: [lukomia]
    open_questions:
      - "The register's standardisation rule: Łukom is the SETTLEMENT name, used
         in directional travel phrases; Łukomia is the ESTATE name, used in legal
         and tenurial contexts. The distinction is the document's own and is
         maintained in translation - do not collapse them."

  lukomia:
    display: "Łukomia"
    kind: estate
    match: '[ŁL]ukomi\w*'
    tier: "Book-confirmed"
    variants: []
    distinct_from: [lukom]

  zagorowo:
    # The register gives Zagórów / Zagórowo / Zagurowo. The edition printed
    # Zagorowo, the corpus dateline form, until the editor ruled on 2026-09-15
    # that it prints Zagórów, across every holding.
    display: "Zagórów"
    kind: town
    match: 'Zag[oó]r[oó]w\w*|Zagurow\w*'
    tier: "Book-confirmed"
    variants:
      - "Zagorowo"
      - "Zagorow"
      - "Zagórowo"
      - "Zagowo"
      - {form: "Jogorowo"}
      - {form: "Zagurowo"}
      - {form: "Lagurowo", match: false,
         seen_in: ["a Z/L letterform error; see the register"]}
    open_questions:
      - "Lagurowo is a Z/L letterform misreading, never a spelling of this place.
         Recorded with match: false so it is documented but not folded in, and
         listed in the glossary's forbidden_renders."

  # --- Olęder colonies and adjacent settlements ---------------------------
  swiatniki:
    display: "Swiątniki"
    kind: village
    match: 'Swi[ąę]tnik\w*'
    tier: ""
    variants: ["Swiątniker", "Swiętnik", "Swiętniki"]

  szetlewek:
    display: "Szetlewek"
    kind: village
    match: 'Sz[ei]tt?lew\w*'
    tier: "Context-inferred"
    variants:
      - "Stetlewek"
      # Was the reading on letter 31 page 3, ruled out of the transcription on
      # 2026-09-12 (ed-031szet) alongside Szettleich. Kept and still matched, for
      # the same reason.
      - "Szettlewch"
      # Was the reading on letter 168 page 1. The editor ruled it out of the
      # transcription itself on 2026-09-12 (ed-168szet), so nothing in the corpus
      # spells it this way any more. Kept, and still matched, because the form is
      # a plausible Kurrent misreading that a later holding may produce again.
      - "Szettleich"
      - "Stetteweck"
      - {form: "Szeklejówek", match: false}
    open_questions:
      - "The register records Szeklejówek as a tentative identification with
         Szetlewek. Not settled, so not matched."

  kopojno:
    display: "Kopojno"
    kind: village
    match: 'Kop[oa]yn\w*|Kopojn\w*'
    tier: ""
    variants: ["Kopoyno"]

  witow:
    display: "Witów"
    kind: village
    match: 'W[iy]tt?ow\w*'
    tier: ""
    variants: ["Witow", "Wittow", "Witttow", "Wyttow", "Witowes"]

  kamionno:
    # The register prints Kamionno. The editor ruled on 2026-09-15 that the
    # edition prints Kamionna, across every holding, departing from the register.
    display: "Kamionna"
    kind: estate
    # `Kamionn?o` demanded a final o and the corpus never writes one: it has
    # Kamionne 14 times and Kamionna 3. Both are inflections of this one
    # toponym, so the ending is not the identifying part of it.
    #
    # Kaemen, Keemen and Kahmen are its German name, folded in on 2026-09-15.
    # The documents say so themselves: the Kolno certificate in Oe 1 Bü 14525
    # (document 12) describes 'der Stadt Kamionna oder Kaemen', and the 1796
    # donation deed (document 1) 'Kamiono oder Keemen'.
    # Not `Ka[e]?h?men`, which also takes the bare word Kamen.
    match: 'Kamionn\w*|Kamiono\b|Ka(?:e|eh|h)men\w*|Keemen\w*|Klemen\b'
    tier: "Book-confirmed"
    variants:
      - "Kamionno"
      - "Kamionne"
      - "Kamiono"
      - "Kaemen"
      - "Kaemener"
      - "Keemen"
      - "Kahmen"
      - "Kaehmen"
      - {form: "Klemen", seen_in: ["oe1bu14525-3", "oe1bu14525-4"]}
      - {form: "Kamień", match: false}

  kolno:
    display: "Kolno"
    kind: estate
    match: 'Kolno\b'
    tier: "Book-confirmed"
    variants: []

  michalinow-olesnicki:
    display: "Michalinów Oleśnicki"
    kind: settlement
    tier: "Book-confirmed"
    variants: []
    distinct_from: [michalinow-oledry, olesnica]
    open_questions:
      - "Distinct from Michalinów Olędry; the register is explicit - do not merge."
      - "Also distinct from Olesnica, which is a separate village."

  michalinow-oledry:
    display: "Michalinów Olędry"
    kind: settlement
    tier: "Book-confirmed"
    variants: []
    distinct_from: [michalinow-olesnicki]

  # --- the Olęder colonies themselves -------------------------------------
  # A Hollander or Olęder is the PERSON, holding under Dutch-law tenure; a
  # Hollendry or Olędry is the COLONY he lives on. The German deeds name the
  # colonies as <Place>er Hauländ / <Place>er Holländ, and the Polish sources
  # as <Place>skie Olędry. They are settlements with names, not a collective
  # noun for the settlers, and the translation keeps them as it keeps any place
  # name - see the Holländ entry in reference/translation_glossary.yml.
  #
  # Deliberately NOT given `match` patterns yet. Each is a place the corpus
  # names in passing, and the edition has not established which of them are the
  # same settlement under two names: the register has Trąbczyńskie Stare Olędry
  # also appearing as Łazińsk and Łaziny, and Łukomskie Olędry of 1771-81 as a
  # different entity from the Łukomskie Olędry of 1798. Recording the names
  # first, and the identities when they are settled, is the right order.
  trabczynskie-stare-oledry:
    display: "Trąbczyńskie Stare Olędry"
    kind: settlement
    tier: "Book-confirmed"
    variants:
      - {form: "Trombschino-Hauland", match: false, seen_in: ["Hohenlohe-era estate inventory"]}
      - {form: "Trąbczyner Holländ",  match: false, seen_in: ["oe1bu14526-17"]}
      - {form: "Łazińsk",             match: false}
      - {form: "Łaziny",              match: false}
    open_questions:
      - "The 1746 foundation, and the primary chronological anchor of the whole
         project. Whether Łazińsk / Łaziny name this settlement or a part of it
         is not established here."

  trabczynskie-nowe-oledry:
    display: "Trąbczyńskie Nowe Olędry"
    kind: settlement
    tier: "Book-confirmed"
    variants: []
    open_questions:
      - "First attested in metrical records 29 September 1776 (register)."

  lukomskie-oledry:
    display: "Łukomskie Olędry"
    kind: settlement
    tier: "Book-confirmed"
    variants: [{form: "Chełmskie Olędry", match: false}]
    open_questions:
      - "TWO entities under one name, per the register: the temporary one of
         1771-81 created by the court-ordered transfer, and a separate place
         northwest of Łukom on Perthées' 1798 map. Not yet split here."

  krolikower-hollaend:
    display: "Krolikower Holländ"
    kind: settlement
    tier: "Context-inferred (named as a party's home in oe1bu14526-17)"
    variants: []

  peyserschen-hauland:
    display: "Peyserschen Hauland"
    kind: settlement
    tier: "Context-inferred"
    variants: []
    open_questions:
      - "The Hauland of Pyzdry - see [[pyzdry]]. Whether this is one settlement
         or the district's colonies collectively is not established."

  # --- Prussian and German places ----------------------------------------
  berlin:
    display: "Berlin"
    kind: city
    match: 'Berlin\w*'
    tier: "Established"
    variants:
      - "Berlin[?]"
      - "Ber[lin?]"
      - "Berl"
      - "B[erlin?]"
      - {form: "Berti"}

  breslau:
    display: "Breslau"
    kind: city
    match: 'Bre(?:ss|ß|ſs|s)?lau\w*'
    tier: "Established"
    variants:
      - "Breslau[?]"
      - "Bre[slau?]"
      - {form: "Breclau"}
      - {form: "Breslaw"}
      - {form: "Breſslau"}
      - {form: "Brulau"}

  frankfurt-an-der-oder:
    display: "Frankfurt an der Oder"
    kind: city
    tier: "Established"
    variants:
      - "Franckfurth"
      - "Franckfurth a d h"
      - "Fr a. d. Oder"
      - "Prandfurth a d o[der]"
      - "Fraudfurth an der Oder"
      - {form: "Franchfurth"}
      - {form: "Franckfurke"}

  koenigsberg:
    display: "Königsberg"
    kind: city
    match: 'K(?:ö|oe|ue|ü)nig[si]berg\w*'
    tier: "Established"
    variants:
      - "Konigsberg"
      - {form: "Königiberg"}
      - {form: "Künigsberg"}

  dresden:
    display: "Dresden"
    kind: city
    match: 'Dre(?:ß|ss)den\w*'
    tier: "Established"
    variants: ["Dreßden"]

  wien:
    display: "Wien"
    kind: city
    tier: "Established"
    variants:
      - "Wein"
      - {form: "Wien[?]", match: false}   # a trailing [?] is a ruling, not a spelling

  posen:
    display: "Posen"
    kind: city
    match: 'Posen\b'
    tier: "Established"
    variants: ["Poser"]

  brieg:
    display: "Brieg"
    kind: town
    match: 'Brieg\b'
    tier: ""
    variants: ["Brzeg"]

  betsche:
    display: "Betsche"
    kind: town
    match: 'Betsch\w*|Psz?czew\w*'
    tier: ""
    variants:
      - "Betsch"
      - "Betschen"
      - "Betscher"
      # Pszczew is this place's Polish name, and the deeds write the pair
      # together: 'Herrschaft Pszczew oder Betsche'. The editor ruled on
      # 2026-09-15 that the edition keeps Betsche and says in the era's
      # introduction that the two are one place. So the Polish form is FOUND as
      # this place but never rewritten to Betsche in the English, which would
      # turn the deeds' pair into 'Betsche or Betsche'.
      - {form: "Pszczew", canon: false}
      - {form: "Psczew", canon: false}

  oehringen:
    display: "Öhringen"
    kind: town
    match: '(?:Ö|Oe)hringen\w*'
    tier: "Established"
    variants:
      - "Erhringen"
      - {form: "Öhringen[?]", match: false}
      - {form: "Obringen"}
      - {form: "Owringen"}

  schlawenschitz:
    display: "Schlawenschitz"
    kind: village
    match: 'Schlaw[ei]n[sz]ch?[iü]t?z\w*'
    tier: ""
    variants:
      - "Schlawenzitz"
      - {form: "Schlawenschutz"}
      - {form: "Schlawenschütz"}
      - {form: "Schlawentzitz"}
      - {form: "Schlawinschitz"}

  guhrwitz:
    display: "Guhrwitz"
    kind: estate
    match: 'Guhrwitz\w*'
    tier: "Context-inferred"
    variants: []
    open_questions:
      - "Rittergut near Breslau, seat of the Freiherrlich von Stillfried
         patrimonial court. Stillfried's ownership there in 1805 is unconfirmed."

  # --- Polish and South Prussian places ----------------------------------
  pyzdry:
    display: "Pyzdry"
    kind: town
    match: 'Pyzdry\w*|Pe[iy]sern\w*'
    tier: "Established"
    variants:
      - "Peysern"
      - "Peisern"
    open_questions:
      - "Peisern is the German name of Pyzdry; the edition uses the Polish form."

  kalisz:
    display: "Kalisz"
    kind: city
    match: 'Kalis(?:z|ch)\w*'
    tier: "Established"
    variants:
      - {form: "Kalisch"}
      - {form: "Katisch"}
    open_questions:
      - "review/name_catalogue.csv lists Kaleschke as a variant of Kalisch. It is
         not: Kaleschke is the Actuarius of the von Stillfried court, see
         reference/people.yml. Not folded in."

  konin:
    display: "Konin"
    kind: town
    match: 'Konin\w*'
    tier: "Established"
    variants: []

  blizanow:
    display: "Blizanow"
    kind: village
    match: 'Bl[ie][zr]anow\w*'
    tier: ""
    variants: ["Bleranow"]

  kontop:
    display: "Kontop"
    kind: village
    # The character class belongs on the first letter, not the second: as
    # `K[oc]ontop` this required Koontop or Kcontop and matched none of the 66
    # occurrences in 47 documents - the village was unindexed for as long as the
    # entry existed. Found by pipeline/review/pattern_impact.py --audit.
    match: '[KC]ontop\w*'
    tier: ""
    variants:
      - "Kontop. 27ten"
      - {form: "Kontop[?]", match: false}
      - {form: "Contop"}
      - {form: "Kontip"}
    distinct_from: [konty]
    open_questions:
      - "A DIFFERENT village from Konty, which belongs to the Wienietz
         appurtenances in 14525. This is the estate von Triebenfeld is styled
         hereditary lord of. Never match this pair on the `Kont` stem."

  glazewo:
    # Głazewo until the editor ruled on 2026-09-15 that the edition prints
    # Głażewo, across every holding.
    display: "Głażewo"
    kind: village
    match: 'G[lł][oa][zsż]+ewo\w*|G[lł]a[zż]ew(?:i|er|skie)\w*'
    tier: ""
    variants:
      - "Głazewer"
      - "Głazewskie"
      - "Głazewo"
      - "Glazewo"
      - "Gloszewo"
      - "Glaszewo"
      - "Glożewo"
      - "Glowewo"
      - "Głazewie"
    open_questions:
      - "One village in the Betsche (Pszczew) key, spelled many ways across the
         German and the Polish of the same document group."

  # --- the villages of the Betsche (Pszczew) estate ------------------------
  # Spellings ruled by the editor on 2026-09-15, first met in Oe 1 Bü 14525.
  swiechocin:
    display: "Świechocin"
    kind: village
    match: '[ŚS]wiechoc[iy]n\w*|Swiechozin\w*|Swie?g[ao]sz[iy]n\w*|Swiegoschin\w*|S(?:ch)?wie?cho(?:d[iec]?)?[cz]+[iy]n\w*'
    tier: ""
    variants: ["Swiechocin", "Swiechozin", "Swiegaszin", "Swiegaszyn",
               "Swiegoszin", "Swigoszin", "Swigaszin", "Swiegoschin",
               # the German forms of Oe 1 Bü 14526
               "Schwichodizyn", "Schwichodczyn", "Schwichodzin", "Schwiechodezin",
               "Swiechodezin", "Schwiechodzyn", "Schwiechoczyn"]
    distinct_from: [swiecia]
    open_questions:
      - "Kept apart from Swięcia (which now also carries the Swięcin spelling):
         this is a village of the Betsche lordship, Swięcia an estate of the
         Konin district. The long `match` here already absorbs the Schwiechod-
         forms, so the two may never be matched on a shared stem."

  stoki:
    display: "Stoki"
    kind: village
    match: 'Stoc?ki\b'
    tier: ""
    variants: ["Stocki"]

  lowyn:
    display: "Łowyń"
    kind: village
    match: '[ŁL]owy[nń]\b|Lowin\w*|Lewiner\b'
    tier: ""
    variants: ["Lowin", "Lowino", "Lowiner", "Lewiner"]

  dormowo:
    display: "Dormowo"
    kind: village
    match: 'D[oiu]e?rmowo\w*'
    tier: ""
    variants: ["Durmowo", "Diermowo"]

  stolun:
    display: "Stołuń"
    kind: village
    # Not `Stall?uh?n\w*`, which also takes Stallungen (stables).
    match: 'Sto[lł]u[nń]\w*|Stalun\b|Stall?uhn\w*|Stalien\b'
    tier: ""
    variants: ["Stolun", "Stalun", "Stalien", "Staluhn", "Stalluhn"]

  kuligowo:
    display: "Kuligowo"
    kind: village
    match: 'Kul+igo\w*|Kalligo\b'
    tier: ""
    variants: ["Kuligow", "Kulligowo", "Kalligo"]

  szarcz:
    display: "Szarcz"
    kind: village
    match: 'Szarcz\w*|Sc[au]rczig\w*|S(?:ch|z)artzig\w*'
    tier: ""
    variants: ["Scarczig", "Scurczig", "Schartzig", "Szartzig"]

  zielomysl:
    display: "Zielomyśl"
    kind: village
    match: 'Zielomy[sś]l\w*|Santom[iy]?[sś][lłt]?\w*'
    tier: ""
    variants:
      - "Zielomysl"
      - "Santomysl"
      - "Santomisl"
      - {form: "Santomist", seen_in: ["oe1bu9454-179"]}
    open_questions:
      - "The royal grants of 1797 write the village Santomysl, the hypothec
         certificates Zielomysl; both are 'Vogtey ... und Silna'."
      - "Santomist in letter 179 of Oe 1 Bü 9454 is taken to be this place: the
         letter calls it an appurtenance of the lordship, which is what the
         grants make the Vogtey of the Betsche key. Probable, not certain."

  silna:
    display: "Silna"
    kind: village
    match: 'Silna\b'
    tier: ""
    variants: []

  # --- the Kamionna and Kolno estate --------------------------------------
  popowo:
    display: "Popowo"
    kind: village
    match: 'Popowo\w*'
    tier: ""
    variants: []
    open_questions:
      - "A common village name. This entry is the Popowo bordering Kolno, named
         in the valuation of Kamionna and Kolno (oe1bu14525-13). A Popowo in
         another holding may be a different place and would want its own entry."

  dolsk:
    display: "Dolsk"
    kind: town
    match: 'Dol(?:sk|zig)\w*'
    tier: ""
    variants: ["Dolzig"]

  alexandrien:
    display: "Alexandrien"
    kind: settlement
    match: 'Al+exandri\w*'
    tier: ""
    variants: ["Allexandrien"]

  olesnica:
    display: "Olesnica"
    kind: village
    # Not preceded by Michalinów: Michalinów Oleśnicki is a DIFFERENT place and
    # the register says so twice over.
    match: '(?<!w )(?<!ów )Ole[sś]ni[cs]\w*'
    tier: "Editor-settled (spelling)"
    distinct_from: [michalinow-olesnicki]
    variants:
      - "Olesnice"
      - {form: "Olesnicer", canon: false}    # adjectival: "the Olesnica people"
      - {form: "Olesnicern", canon: false}
      - {form: "Olesnices", canon: false}
      - {form: "Olesniser"}
      - "Olisnie"                              # editor, 2026-09-11
      - {form: "Oleschnitzer", canon: false}   # adjectival, like Olesnicer
    open_questions:
      - "Consistency_Register.md lists Olisnice among the Hohenlohe-era
         settlements as though it were its own place. The editor has ruled that
         the corpus's Olisnie is this village, so the register entry is either
         the same place under another spelling or a separate settlement that
         happens to look like it. Worth reconciling when the register is next
         revised."

  orzeszkowo:
    display: "Orzeszkowo"
    kind: village
    match: 'Orze[sz]{1,2}kow\w*'
    tier: ""
    variants: ["Orzeskowo"]

  bialobrzeg:
    display: "Białobrzeg"
    kind: village
    # Was 'Bia[lł]a?[ -]?brz[ie]g\w*' - the 'a?' before the optional space
    # matched a variant spelling ("Biala Brzig") but not the name itself:
    # Białobrzeg has an 'o' there (biały + brzeg, white + shore), which the
    # pattern could not accept even as zero-width. It matched nothing in any
    # corpus; the name occurs twice in 14526.
    match: 'Bia[lł][ao]?[ -]?brz[ie]g\w*'
    tier: ""
    variants: ["Biala Brzig"]

  # --- the granted estates, 14525 -----------------------------------------
  # Added 2026-09-17. These are the villages and estates the South Prussian
  # grants actually convey, and not one of them was in the authority: they are
  # named in the body of a deed and never stand in a dateline, so under the
  # old "place = where it was written" reading they were invisible. Every
  # pattern below is written against the forms observed in corpus/text, and
  # deliberately not on a stem - see the Wienietz and Konty notes.

  wienietz:
    display: "Wienietz"
    kind: estate
    # NOT a stem. `Wien\w*` or `Win\w*` would take Winter, Winterung and
    # Winterjahreszeit, which are ordinary German and occur in these files.
    # The exact form plus the observed misspellings is the whole of it.
    match: 'Wienietz\w*'
    tier: ""
    variants: ["Wienitz", "Winietz", "Winieces"]
    distinct_from: [wieniec]
    open_questions:
      - "A DIFFERENT place from Wieniec. Wienietz heads its own group of
         appurtenances - 'bey Wienietz, Konty, Szedlemin, Botkowo und Karczyn' -
         while Wieniec appears only beside Wolica among the Cujavian estates.
         Do not fold either into the other."

  wieniec:
    display: "Wieniec"
    kind: estate
    match: 'Wieniecz?\w*'
    tier: ""
    variants: []
    distinct_from: [wienietz]
    open_questions:
      - "Paired with Wolica every time it occurs, and document 41 has the Bishop
         of Cujavia vacating 'die Güther Wieniec und Wolica' - a Cujavian
         holding, not one of the Betsche appurtenances."

  drzewce:
    display: "Drzewce"
    kind: estate
    match: 'Drzewce\w*'
    tier: ""
    variants: ["Drzewitz"]

  swiecia:
    display: "Swięcia"
    kind: estate
    # Swięcin folded in here on the editor's ruling, 2026-09-17: one place, two
    # spellings. Swięcia is the form the edition prints - docs/name_decisions.md
    # had already settled that, recording `Swięcier` as its legitimate
    # inflection. Still NOT matched on a stem: Świechocin is a third name in
    # this group and stays its own entity.
    match: 'Swi[eę]ci[aen]\w*'
    tier: ""
    variants: ["Swięcer", "Swięcin"]
    distinct_from: [swiechocin]
    open_questions:
      - "Document 7 uses both spellings in one text - the village of Swięcin
         among the Betsche appurtenances, and a mortgage certificate for
         Swięcia with the farm Broniki - which is the one piece of evidence
         that pointed to two places. Recorded here because the merge was an
         editorial ruling and this is what it overrode."

  gradzyn:
    display: "Grądzyń"
    kind: village
    match: 'Gr[ąa]dz[iy][nń]\w*'
    tier: ""
    variants: []

  brzyce:
    display: "Brzyce"
    kind: village
    match: 'Brzyc\w*'
    tier: ""
    variants: []

  osiny:
    display: "Osiny"
    kind: village
    match: 'Osin\w*'
    tier: ""
    variants: []

  batkowo:
    display: "Batkowo"
    kind: village
    match: 'B[ao]tkow\w*'
    tier: ""
    variants: []
    open_questions:
      - "Batkowo and Botkowo stand in the same slot of the same list of Wienietz
         appurtenances, so they are one place. Document 24, a badly damaged
         note, is the only document whose sole named place is this one."

  konty:
    display: "Konty"
    kind: village
    # NOT `Kont\w*`: that takes Kontop - a different village, and von
    # Triebenfeld's own seat - along with Kontrakt and Kontract.
    match: 'Konty\w*'
    tier: ""
    variants: []
    distinct_from: [kontop]
    open_questions:
      - "A DIFFERENT village from Kontop. Konty belongs to the Wienietz group of
         appurtenances in 14525; Kontop is the estate von Triebenfeld is styled
         hereditary lord of, 'Erbherr auf Schweinerne und Kontop'."

  szedlemin:
    display: "Szedlemin"
    kind: village
    match: 'Sz[ei]dlemin\w*'
    tier: ""
    variants: []

  karczyn:
    display: "Karczyn"
    kind: village
    match: 'Karcz[iy]n\w*'
    tier: ""
    variants: []

  wolica:
    display: "Wolica"
    kind: estate
    match: 'Wolic\w*'
    tier: ""
    variants: []

  tarmowo:
    display: "Tarmowo"
    kind: village
    match: 'Tarmow\w*'
    tier: ""
    variants: []

  skokum:
    display: "Skokum"
    kind: village
    match: 'Skokum\w*'
    tier: ""
    variants: []

# Fragments that look like a place in a dateline but are not one.
reject: ["beden", "bendlin[?]", "bevelen", "bra", "brug", "hahn",
         "so bekomme ich", "thl. 13", "uria", "wun",
         "übrigens sorgen sie ja daß f"]

    distinct_from:
    - trabczyn
    - wrabczynek
    open_questions:
    - A DIFFERENT village from Trąbczyn, and nearby, so the two appearing in one document
      is unremarkable and is not evidence of a misreading. Never fold either into
      the other, and never match this group on a stem.

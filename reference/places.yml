    tier: "Text-confirmed"
    variants: []
    # Where the widow von Brehmer wrote from in 1816. Several towns bear the
    # name; which one is not established, so no Polish name is given.

  boleslawice:
    display: "Boleslawice"
    kind: town
    match: 'Boleslawice'
    tier: "Text-confirmed"
    variants: []
    # The Prince places Amt Sokolnik "ohnweit Boleslawice" (12765, document 8).
    # Probably Bolesławiec on the Prosna; not established.

  nowawies-trabczyn:
    display: "Nowawies"
    kind: village
    match: 'Nowawies'
    tier: "Text-confirmed"
    variants:
      - "Nowa wies"
      - "Nova wies"
      - "Nowa wieś"
    # One of the villages of the 1796 grant, as Triebenfeld lists them
    # (12765, document 4).

  lazy-trabczyn:
    display: "Łazy"
    kind: village
    match: '(?<=Nowawies, )Lazy'
    tier: "Text-confirmed"
    variants: []
    # One of the villages of the 1796 grant (12765, document 4). Matched only
    # in that list: "lazy" is too short to match anywhere else.

  wloclawek:
    # The seat of the bishops of Kuyavia, whose cathedral chapter held Batkowo
    # and Siedlemin before the confiscation (Oe 1 Bü 14525, 28). The writer has
    # "Wraclawek" and "Wracla-/wek" (scans 0121_b, 0122_a1); the transcription
    # reads "Wrocławek". The editor ruled it Włocławek on 2026-10-03.
    display: "Włocławek"
    german: "Leslau"
    kind: town
    match: 'Wroc[łl]awek\b|Wraclawek\b'
    tier: "Book-confirmed"
    variants: []


# The places this edition recognises, and how each is matched and spelled.
#
# This file replaces reference/place_canon.yml, which recorded only "variant ->
# the form the edition uses" and could therefore say nothing about a place
# beyond its spelling. It could not record that two similar names are DIFFERENT
# villages, could not say which document a variant was seen in, and could not be
# matched against the body of a document at all - so Trąbczyn, the subject of
# the whole archive, was indexed only where it appeared in a dateline.
#
# The shape mirrors reference/people.yml deliberately: one authority, one set of
# habits, one loader pattern.
#
#   display       the form this edition prints. Polish diacritics preserved.
#   kind          village | town | city | estate | settlement | region | country
#   match         a regular expression, anchored at a word start by the build,
#                 for finding the place in the body of a document. Optional: a
#                 place with no `match` is still canonicalised on the dateline.
#   variants      observed spellings. A bare string is shorthand for
#                 {form: <string>, match: true}. The long form takes:
#                   form     the spelling as it appears
#                   match    false to record the variant as provenance WITHOUT
#                            folding it into this entity - for a variant that is
#                            genuinely unsettled, or belongs to another place
#                   seen_in  uids or archival references where it was observed
#   distinct_from slugs this place is repeatedly confused with. Recorded both
#                 ways, because the confusion runs both ways.
#   tier          how firmly identified, same vocabulary as people.yml
#   open_questions unresolved identity conflicts, flagged rather than resolved
#
# The canon consumed by unitlib.load_place_canon() - variant (lowercased) ->
# display - is DERIVED from `variants` here. Adding a variant therefore both
# normalises the dateline and finds the place in the text.
#
# Standardisations below follow Consistency_Register.md ("Confirmed
# terminology" and "Places"). Where the register and the corpus disagree, the
# register wins: it is the book's settled standard and this edition is meant to
# stay interoperable with it rather than compete with it.

places:

  # --- the estate and its neighbours ------------------------------------
  trabczyn:
    display: "Trąbczyn"
    kind: village
    match: 'Tr[ąa][bmp]c?z[yi]n\w*|Tromb(?:czin|schino)\w*|Trabryn\w*|Tr(?:ä|ae)bczyn\w*|Prosrzyner'
    tier: "Book-confirmed"
    variants:
      - "Trąbczin"
      - "Trąpczyn"
      - "Trąbrzyn"
      - "Trabryn"
      - "Trąbczynen"
      - {form: "Trąmpczyn", seen_in: ["Latin documents; register, Places"]}
      - {form: "Trabezyner"}
      - {form: "Trąbczner"}
      - {form: "Trąbzyn"}
      # German-era forms, confirmed in the register
      - {form: "Trombczin",  seen_in: ["Hohenlohe corpus"]}
      - {form: "Träbczyn",   seen_in: ["Hohenlohe corpus"]}
      - {form: "Prosrzyner", seen_in: ["Hohenlohe corpus"]}
    distinct_from: [wrabczyn, wrabczynek]
    open_questions:
      - "Trombschino-Hauland is the Olęder colony on the estate, not the village
         itself. It is matched here for now; when the colony has documents of its
         own it should become a separate entity."

  wrabczyn:
    display: "Wrąbczyn"
    kind: village
    match: 'Wr[ąa]bcz[yi]n(?!ek)\w*'
    tier: "Book-confirmed"
    variants:
      - "Wrąbczin"
    distinct_from: [trabczyn, wrabczynek]
    open_questions:
      - "A DIFFERENT village from Trąbczyn, and nearby, so the two appearing in
         one document is unremarkable and is not evidence of a misreading.
         Never fold either into the other, and never match this group on a stem."

  wrabczynek:
    display: "Wrąbczynek"
    kind: village
    match: 'Wr[ąa]bcz[yi]nek\w*'
    tier: "Book-confirmed"
    variants: []
    distinct_from: [trabczyn, wrabczyn]

  lukom:
    display: "Łukom"
    kind: settlement
    match: '[ŁL]ukom(?!i)\w*'
    tier: "Book-confirmed"
    variants: []
    distinct_from: [lukomia]
    open_questions:
      - "The register's standardisation rule: Łukom is the SETTLEMENT name, used
         in directional travel phrases; Łukomia is the ESTATE name, used in legal
         and tenurial contexts. The distinction is the document's own and is
         maintained in translation - do not collapse them."

  lukomia:
    display: "Łukomia"
    kind: estate
    match: '[ŁL]ukomi\w*'
    tier: "Book-confirmed"
    variants: []
    distinct_from: [lukom]

  zagorowo:
    # The register gives Zagórów / Zagórowo / Zagurowo. The edition printed
    # Zagorowo, the corpus dateline form, until the editor ruled on 2026-09-15
    # that it prints Zagórów, across every holding.
    display: "Zagórów"
    german: "Zagorowo"
    kind: town
    match: 'Zag[oó]r[oó]w\w*|Zagurow\w*'
    tier: "Book-confirmed"
    variants:
      - "Zagorowo"
      - "Zagorow"
      - "Zagórowo"
      - "Zagowo"
      - "Zagarow"
      - {form: "Jogorowo"}
      - {form: "Zagurowo"}
      - {form: "Lagurowo", match: false,
         seen_in: ["a Z/L letterform error; see the register"]}
    open_questions:
      - "Lagurowo is a Z/L letterform misreading, never a spelling of this place.
         Recorded with match: false so it is documented but not folded in, and
         listed in the glossary's forbidden_renders."

  # --- Olęder colonies and adjacent settlements ---------------------------
  swiatniki:
    display: "Swiątniki"
    kind: village
    match: 'Swi[ąę]tnik\w*'
    tier: ""
    variants: ["Swiątniker", "Swiętnik", "Swiętniki"]

  szetlewek:
    display: "Szetlewek"
    kind: village
    match: 'Sz[ei]tt?lew\w*'
    tier: "Context-inferred"
    variants:
      - "Stetlewek"
      # Was the reading on letter 31 page 3, ruled out of the transcription on
      # 2026-09-12 (ed-031szet) alongside Szettleich. Kept and still matched, for
      # the same reason.
      - "Szettlewch"
      # Was the reading on letter 168 page 1. The editor ruled it out of the
      # transcription itself on 2026-09-12 (ed-168szet), so nothing in the corpus
      # spells it this way any more. Kept, and still matched, because the form is
      # a plausible Kurrent misreading that a later holding may produce again.
      - "Szettleich"
      - "Stetteweck"
      - {form: "Szeklejówek", match: false}
      - "Szettlewek"
    open_questions:
      - "The register records Szeklejówek as a tentative identification with
         Szetlewek. Not settled, so not matched."

  kopojno:
    display: "Kopojno"
    german: "Kopoyno"
    kind: village
    match: 'Kop[oa]yn\w*|Kopojn\w*'
    tier: ""
    variants: ["Kopoyno", "Kopoino"]

  witow:
    display: "Witów"
    german: "Wittow"
    kind: village
    match: 'W[iy]tt?[oó]w\w*'
    tier: ""
    variants: ["Witow", "Wittow", "Witttow", "Wyttow", "Witowes"]

  szczytniki:
    # Scheitnig, the Prince's park and gardens by Breslau, made a public
    # promenade in his will (Oe 1 U 199); now Park Szczytnicki, Wrocław.
    # Added 2026-09-30.
    display: "Szczytniki"
    german: "Scheitnig"
    kind: settlement
    match: 'Scheit(?:nig|nich)(?![a-zà-ÿ])'
    tier: "Established"
    variants: ["Scheitnich"]

  bytkow:
    # Byttkow, the Silesian allodial estate the Prince made majorat and joined
    # to the Sławięcice ironworks department (Oe 1 U 199). Added 2026-09-30.
    display: "Bytków"
    german: "Byttkow"
    kind: estate
    match: 'Byttkow\w*'
    tier: "Context-inferred"
    variants: []

  birawa:
    # Byrawa, with Sławięcice, Althammer and Lassowitz among the Prince's
    # Silesian works estates (Oe 1 U 199). Added 2026-09-30.
    display: "Birawa"
    german: "Byrawa"
    kind: estate
    match: 'Byrawa\w*'
    tier: "Context-inferred"
    variants: []

  stara-kuznia:
    # Althammer by Sławięcice, one of the Prince's works estates (Oe 1 U 199).
    # Klein Althammer, from which Hahn wrote letter 189 in July 1806, is the
    # same place: Klein Althammer, Polish Stara Kuźnia, in the commune of
    # Bierawa (GOV LANAWAJO90CG), next to Birawa in the entail's list. It was
    # excluded until 2026-10-03, when the editor asked and the gazetteer
    # settled it.
    display: "Stara Kuźnia"
    german: "Klein Althammer"
    kind: estate
    match: '(?:Klein )?Althammer\w*'
    tier: "Context-inferred"
    variants:
      - "Klein Althammer"

  olszyna:
    # Olschin, one of the lordships bought with Koschentin (Oe 1 U 199).
    # Added 2026-09-30.
    display: "Olszyna"
    german: "Olschin"
    kind: estate
    match: 'Olschin\w*'
    tier: "Context-inferred"
    variants: []

  mariantow:
    # Where the Hohenlohe patrimonial court for Trąbczyn sat: "Actum Marianton"
    # (app5371057, 1806). Mariantów in gmina Zagórów, powiat słupecki, the area
    # of the former gmina Trąbczyn. Also the unclear "Marianton" of 9454 letter
    # 136. Added 2026-09-30.
    display: "Mariantów"
    german: "Marianton"
    kind: village
    match: 'Mariant[oó][nw]\w*'
    tier: "Context-inferred"
    variants: ["Marianton"]

  kamionno:
    # The register prints Kamionno. The editor ruled on 2026-09-15 that the
    # edition prints Kamionna, across every holding, departing from the register.
    display: "Kamionna"
    german: "Kaemen"
    kind: estate
    # `Kamionn?o` demanded a final o and the corpus never writes one: it has
    # Kamionne 14 times and Kamionna 3. Both are inflections of this one
    # toponym, so the ending is not the identifying part of it.
    #
    # Kaemen, Keemen and Kahmen are its German name, folded in on 2026-09-15.
    # The documents say so themselves: the Kolno certificate in Oe 1 Bü 14525
    # (document 12) describes 'der Stadt Kamionna oder Kaemen', and the 1796
    # donation deed (document 1) 'Kamiono oder Keemen'.
    # Not `Ka[e]?h?men`, which also takes the bare word Kamen.
    # Kaemen inside `Kamionna [Kaemen]` (the edition's form since 2026-09-28)
    # is the same mention, not a second one.
    # Kamen and Kämen are also the verb (kamen, kämen: "came"), so they are
    # taken only where they name the estate: "Güter Kamen", "und Kamen", "Was
    # Kämen betrift", "Kamener Sache" (12765, 14526, 9454; editor, 2026-10-03).
    match: 'Kamionn\w*|Kamiono\b|(?<!\[)(?:Ka(?:e|eh|h)men\w*|Keemen\w*|Klemen\b)|(?<=Güter )K[aä]men\b|(?<=und )Kamen\b|(?<=Was )Kämen\b|Kamener\b'
    tier: "Book-confirmed"
    variants:
      - "Kamionno"
      - "Kamionne"
      - "Kamiono"
      - "Kaemen"
      - "Kaemener"
      - "Keemen"
      - "Kahmen"
      - "Kaehmen"
      - {form: "Klemen", seen_in: ["oe1bu14525-3", "oe1bu14525-4"]}
      - {form: "Kamień", match: false}
      - "Kähmen"
      - "Kamienne"

  kolno:
    display: "Kolno"
    german: "Kulm"
    kind: estate
    # Kulm is Kolno: "dem Marktflecken Kolno oder Kulm" (14525 line 1272), the market
    # town bordering Kaemen to the north (14525 line 1444). Merged from the old kulm
    # entry, editor 2026-09-28.
    match: 'Kolno\b|Kulm(?:ner|schen|ische\w*)?(?![a-zà-ÿ])|Culm(?![a-zà-ÿ])'
    tier: "Book-confirmed"
    variants:
      - "Kollno"

  michalinow-olesnicki:
    display: "Michalinów Oleśnicki"
    kind: settlement
    tier: "Book-confirmed"
    variants: []
    distinct_from: [michalinow-oledry, olesnica]
    open_questions:
      - "Distinct from Michalinów Olędry; the register is explicit - do not merge."
      - "Also distinct from Olesnica, which is a separate village."

  michalinow-oledry:
    display: "Michalinów Olędry"
    kind: settlement
    tier: "Book-confirmed"
    variants: []
    distinct_from: [michalinow-olesnicki]

  # --- the Olęder colonies themselves -------------------------------------
  # A Hollander or Olęder is the PERSON, holding under Dutch-law tenure; a
  # Hollendry or Olędry is the COLONY he lives on. The German deeds name the
  # colonies as <Place>er Hauländ / <Place>er Holländ, and the Polish sources
  # as <Place>skie Olędry. They are settlements with names, not a collective
  # noun for the settlers, and the translation keeps them as it keeps any place
  # name - see the Holländ entry in reference/translation_glossary.yml.
  #
  # Deliberately NOT given `match` patterns yet. Each is a place the corpus
  # names in passing, and the edition has not established which of them are the
  # same settlement under two names: the register has Trąbczyńskie Stare Olędry
  # also appearing as Łazińsk and Łaziny, and Łukomskie Olędry of 1771-81 as a
  # different entity from the Łukomskie Olędry of 1798. Recording the names
  # first, and the identities when they are settled, is the right order.
  trabczynskie-stare-oledry:
    display: "Trąbczyńskie Stare Olędry"
    kind: settlement
    tier: "Book-confirmed"
    variants:
      - {form: "Trombschino-Hauland", match: false, seen_in: ["Hohenlohe-era estate inventory"]}
      - {form: "Trąbczyner Holländ",  match: false, seen_in: ["oe1bu14526-17"]}
      - {form: "Łazińsk",             match: false}
      - {form: "Łaziny",              match: false}
    open_questions:
      - "The 1746 foundation, and the primary chronological anchor of the whole
         project. Whether Łazińsk / Łaziny name this settlement or a part of it
         is not established here."

  trabczynskie-nowe-oledry:
    display: "Trąbczyńskie Nowe Olędry"
    kind: settlement
    tier: "Book-confirmed"
    variants: []
    open_questions:
      - "First attested in metrical records 29 September 1776 (register)."

  lukomskie-oledry:
    display: "Łukomskie Olędry"
    kind: settlement
    tier: "Book-confirmed"
    variants: [{form: "Chełmskie Olędry", match: false}]
    open_questions:
      - "TWO entities under one name, per the register: the temporary one of
         1771-81 created by the court-ordered transfer, and a separate place
         northwest of Łukom on Perthées' 1798 map. Not yet split here."

  krolikower-hollaend:
    display: "Krolikower Holländ"
    kind: settlement
    tier: "Context-inferred (named as a party's home in oe1bu14526-17)"
    variants: []

  peyserschen-hauland:
    display: "Peyserschen Hauland"
    kind: settlement
    tier: "Context-inferred"
    variants: []
    open_questions:
      - "The Hauland of Pyzdry - see [[pyzdry]]. Whether this is one settlement
         or the district's colonies collectively is not established."

  # --- Prussian and German places ----------------------------------------
  berlin:
    display: "Berlin"
    kind: city
    match: 'Berlin\w*'
    tier: "Established"
    variants:
      - "Berlin[?]"
      - "Ber[lin?]"
      - "Berl"
      - "B[erlin?]"
      - {form: "Berti"}

  breslau:
    display: "Wrocław"
    german: "Breslau"
    kind: city
    match: 'Bre(?:ss|ß|ſs|s)?lau\w*'
    tier: "Established"
    variants:
      - "Breslau[?]"
      - "Bre[slau?]"
      - {form: "Breclau"}
      - {form: "Breslaw"}
      - {form: "Breſslau"}
      - {form: "Brulau"}

  frankfurt-am-main:
    display: "Frankfurt am Main"
    kind: city
    match: 'Fran[ck]+furth?\s+am\s+M[ae]in|Frankfurt\s+a[/.]\s*[mM](?![a-z])'
    tier: "Established"
    variants: []
    distinct_from: [frankfurt-an-der-oder]

  frankfurt-an-der-oder:
    display: "Frankfurt an der Oder"
    kind: city
    # Frankfurt am Main is named too (1815, and the creditors' table): a form
    # followed by "am Main" or "a/M" is that city, not this one.
    match: 'Fran[ck]+furth?(?!h)(?!\s+am\s+M[ae]in|\s+a[/.]\s*[mM](?![a-z]))'
    tier: "Established"
    variants:
      - "Franckfurth"
      - "Franckfurth a d h"
      - "Fr a. d. Oder"
      - "Prandfurth a d o[der]"
      - "Fraudfurth an der Oder"
      - {form: "Franchfurth"}
      - {form: "Franckfurke"}

  koenigsberg:
    display: "Königsberg"
    kind: city
    match: 'K(?:ö|oe|ue|ü)nig[si]berg\w*'
    tier: "Established"
    variants:
      - "Konigsberg"
      - {form: "Königiberg"}
      - {form: "Künigsberg"}

  dresden:
    display: "Dresden"
    kind: city
    match: 'Dre(?:ß|ss|s)den\w*'
    tier: "Established"
    variants: ["Dreßden"]

  wien:
    display: "Wien"
    kind: city
    # Not "Wein": that took wine and Weinachten (Christmas) as mentions of
    # Vienna. The Wein-for-Wien misreadings in 9454 were corrected in the text.
    match: 'Wien(?![a-zà-ÿ])'
    tier: "Established"
    variants:
      - {form: "Wein", match: false}
      - {form: "Wien[?]", match: false}   # a trailing [?] is a ruling, not a spelling

  posen:
    display: "Poznań"
    german: "Posen"
    kind: city
    match: 'Posen\b'
    tier: "Established"
    variants: ["Poser"]

  brieg:
    display: "Brzeg"
    german: "Brieg"
    kind: town
    match: 'Brieg\b'
    tier: ""
    variants: ["Brzeg"]

  betsche:
    display: "Pszczew"
    german: "Betsche"
    kind: town
    # Not 'Betsche unter Strehlen' (9454, 119): a small estate near Strzelin
    # in Silesia, divided among Hussite settlers about 1801; not Pszczew
    # (editor, 2026-10-03).
    match: 'Betsch(?!e\s+(?:unter|below)\s+Strehlen)\w*|Psz?czew\w*'
    tier: ""
    variants:
      - "Betsch"
      - "Betschen"
      - "Betscher"
      # Pszczew is this place's Polish name, and the deeds write the pair
      # together: 'Herrschaft Pszczew oder Betsche'. The editor ruled on
      # 2026-09-15 that the edition keeps Betsche and says in the era's
      # introduction that the two are one place. So the Polish form is FOUND as
      # this place but never rewritten to Betsche in the English, which would
      # turn the deeds' pair into 'Betsche or Betsche'.
      - {form: "Pszczew", canon: false}
      - {form: "Psczew", canon: false}

  oehringen:
    display: "Öhringen"
    kind: town
    match: '(?:Ö|Oe|O)hringen\w*'
    tier: "Established"
    variants:
      - "Erhringen"
      - {form: "Öhringen[?]", match: false}
      - {form: "Obringen"}
      - {form: "Owringen"}

  schlawenschitz:
    display: "Sławięcice"
    german: "Schlawenschitz"
    kind: village
    match: 'Schlaw[ei]n[sz]ch?[iü]t?z\w*|Schlawent?zi[sz]\w*'   # Schlawentziz, Schlawenzizer (Oe 1 U 199)
    tier: ""
    variants:
      - "Schlawenzitz"
      - {form: "Schlawenschutz"}
      - {form: "Schlawenschütz"}
      - {form: "Schlawentzitz"}
      - "Schlawentschitz"
      - {form: "Schlawinschitz"}

  guhrwitz:
    display: "Górzyce"
    german: "Guhrwitz"
    kind: estate
    match: 'Guhrwitz\w*'
    tier: "Established"   # Guhrwitz, Kreis Breslau = Górzyce (gov.genealogy.net), 2026-09-28
    variants: []
    open_questions:
      - "Rittergut near Breslau, seat of the Freiherrlich von Stillfried
         patrimonial court. Stillfried's ownership there in 1805 is unconfirmed."

  # --- Polish and South Prussian places ----------------------------------
  pyzdry:
    display: "Pyzdry"
    german: "Peisern"
    kind: town
    match: 'Pyzdry\w*|Pe[iy]sern\w*'
    tier: "Established"
    variants:
      - "Peysern"
      - "Peisern"
    open_questions:
      - "Peisern is the German name of Pyzdry; the edition uses the Polish form."

  kalisz:
    display: "Kalisz"
    german: "Kalisch"
    kind: city
    match: 'Kalis(?:z|ch)\w*'
    tier: "Established"
    variants:
      - {form: "Kalisch"}
      - {form: "Katisch"}
      - "Kálitz"
    open_questions:
      - "review/name_catalogue.csv lists Kaleschke as a variant of Kalisch. It is
         not: Kaleschke is the Actuarius of the von Stillfried court, see
         reference/people.yml. Not folded in."

  konin:
    display: "Konin"
    kind: town
    match: 'Konin\w*|Konińsk\w*'   # Powiatu Konińskiego (app5371057 doc 2)
    tier: "Established"
    variants: []

  blizanow:
    display: "Blizanow"
    kind: village
    match: 'Bl[ie][zr]anow\w*'
    tier: ""
    variants: ["Bleranow"]

  kontop:
    display: "Konotop"
    german: "Kontop"
    kind: village
    # The character class belongs on the first letter, not the second: as
    # `K[oc]ontop` this required Koontop or Kcontop and matched none of the 66
    # occurrences in 47 documents - the village was unindexed for as long as the
    # entry existed. Found by pipeline/review/pattern_impact.py --audit.
    match: '[KC]ontop\w*'
    tier: ""
    variants:
      - "Kontop. 27ten"
      - {form: "Kontop[?]", match: false}
      - {form: "Contop"}
      - {form: "Kontip"}
    distinct_from: [konty]
    open_questions:
      - "A DIFFERENT village from Konty, which belongs to the Wienietz
         appurtenances in 14525. This is the estate von Triebenfeld is styled
         hereditary lord of. Never match this pair on the `Kont` stem."

  glazewo:
    # Głazewo until the editor ruled on 2026-09-15 that the edition prints
    # Głażewo, across every holding.
    display: "Głażewo"
    german: "Gloszewo"
    kind: village
    match: 'G[lł][oa][zsż]+ewo\w*|G[lł]a[zż]ew(?:i|er|skie)\w*'
    tier: ""
    variants:
      - "Głazewer"
      - "Głazewskie"
      - "Głazewo"
      - "Glazewo"
      - "Gloszewo"
      - "Glaszewo"
      - "Glożewo"
      - "Glowewo"
      - "Głazewie"
    open_questions:
      - "One village in the Betsche (Pszczew) key, spelled many ways across the
         German and the Polish of the same document group."

  # --- the villages of the Betsche (Pszczew) estate ------------------------
  # Spellings ruled by the editor on 2026-09-15, first met in Oe 1 Bü 14525.
  swiechocin:
    display: "Świechocin"
    german: "Schwiechodezin"
    kind: village

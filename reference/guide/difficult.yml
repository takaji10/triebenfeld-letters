- doc: app53170koningr116
  lang: la
  was: (not transcribed)
  now: 'Ludwik Dąmbski Wojewoda Brzeski Kujawski Jako Kommissarz Prezes mp / Jo Brzezinski Sta [?] jako kommissarz
    mp / Stanisław Dąmbski [?] Komisarz mp / Jan na Kwilczu Kwilecki Czesnik Wschowski iako komisarz mp / Kaietan
    Uminski Czesnik Kowalski Podwoie: [?] Komisarz'
  why: 'Signatures stand under seven entries and were not in your text. Under the commissioners'' protest: Ludwik
    Dąmbski as commissioner and president, Jo. Brzeziński, Stanisław Dąmbski, Jan Kwilecki of Kwilcz, cup-bearer
    of Wschowa, and Kajetan Umiński, cup-bearer of Kowal and deputy voivode (three words in them not read). Under
    the others: Prusimski, Rajewicz, Chełmski (twice), and Lipiński with Ostrowski. The clerk''s Latin calls Kwilecki
    and Umiński "Dapiferi" (pantler); they sign "Czesnik" (cup-bearer).'
  grade: fact
  source: changes
- doc: app53170koningr116
  lang: la
  was: Lat[i/e?] Requisitio / La[?] Requisitio
  now: Lati Requisitio / Vacuum / Fr Zielonacki; Lati Requisitio / Vacuum / Stanisław Scibor Chełmski
  why: 'The two searches announced for Chełmski in 1776 (leaves 175 and 201 verso) were never written: the space
    under each heading is filled with the word "Vacuum" and signed, the first by "Fr Zielonacki", the second, on
    leaf 202, by "Stanisław Scibor Chełmski". Both headings end "Lati Requisitio": the decree "given". Their dates
    are on the pages: 1 July 1776 and 5 September 1776.'
  grade: fact
  source: changes

    hac in Causa Testimonio relegatarum Complicitatemque delicti S[e/c]orsivis punitis probaturum ... ex Labris~
    ... Martinus [P?]alski Thesauranda
  now: in Trahibus arbores vehentibus ... cum Trahibus ... paenas in se trahere ... deducturum a perhibendoque hac
    in Causa Testimonio relegaturum Complicitatemque delicti Seorsivis punctis probaturum ... ex Laboriosis ...
    Martinus Nosalski Thesaurarida
  why: Nosalski's protest (leaves 359 and 359 verso), read whole. His people were carting trees "on sledges" ("in
    Trahibus", not beams); Prusimski's men "did not blush to draw the penalties upon themselves"; and what he offers
    is to prove the violence by inquiry and to have the two men SHUT OUT FROM GIVING TESTIMONY in the cause. The
    two are called "Laboriosi", working men (your "ex Labris", from the lips). He is "Nosalski Thesaurarida Czerniechoviensis",
    son of a treasurer of Czernihów, not treasurer of Czernichów.

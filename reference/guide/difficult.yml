- doc: app53170koningr118
  lang: 'holding: la/la,pl/pl,la'
  was: in probalionem Causae in Judicio Tribunalio se se [?]erte[r?]nem quod Causa ex Regestris Palatinatuam Majoris
    Poloniae pro movenda Tribunaliis Judicatur favore ... sibi Regn~m Expulsionum etiam tempore Regestri Palatinatus
    Rlocen~ ... est Sortitus Dilationem ac motionem per Sui Comparentem interpositam non admi[s/t?]erat
  now: in probationem Causae in Judicio Tribunalio se se vertentis reposuerat, Suprascriptum tamen Judicium Terrestre
    Calissien~ ob hanc rationem quod Causa ex Regestris Palatinatuum Majoris Poloniae promovenda [?]datur jam autem
    ad praesens Regestrum Palatinatus Plocen~ in Judiciis Eisdem Tribunaliis Judicatur, favore ... sibi Regestrum
    Expulsionum etiam tempore Regestri Palatinatus Plocen~ ... est Sortitus Dilationem Suprascriptam amputaverat
    negotiumque inducere mandaverat ac motionem per Sui Comparentem interpositam non admiserat
  why: Three lines were passed over in the protest for Prusimski against the land court, and they hold its substance.
    Gosławski had "produced" Prusimski's citation of Chełmski to the Tribunal, as proof that the cause was pending
    there. The land court refused the delay "for this reason, that the cause is to be brought on from the registers
    of the palatinates of Greater Poland, whereas at present the register of the palatinate of Płock is being judged
    in the Tribunal"; it "cut off the delay and ordered the matter to be brought in". Your text joined the halves
    of different lines ("se se [?]erte[r?]nem"), read Płock as "Rlocen~", and read "Regestrum Expulsionum" (the
    register of expulsions) as "Regn~m", so that your English spoke of "the Kingdom's Expulsions".
  grade: significant
  source: changes
- doc: app53170koningr118
  lang: 'holding: la/la,pl/pl,la'
  was: Thaeresiae de Rozdrzewskie oto[?] Magnificae Catharinae ... ac oto[?] Illustris Magnificae Similiter de Rozdrzewskie
    Molska Calnae~ Rogoznen~ steriliter de hac li[c?]e decessarum Succestrici seu Invicem Congb~is Bogdanskie ...
    via prosecutionum et Magnificum Tui Illustris Magnificae Prusimski ... Tum[on?] Illustris Magnificae Prusimski
    Subditt~ qui [?]ct ante ita et praesenti Citatione qpud Te Arestantur
  now: Thaeresiae de Rozdrzewskie olim Magnificae Catharinae ... ac olim Illustris Magnificae Similiter de Rozdrzewskie
    Molska Calnae~ Rogoznen~ steriliter de hac luce decessarum Succestrici seu Invicem Conjugibus Bogdanskie ...
    via prosecutionum et Manifestationum Tui Illustris Magnifice Prusimski ... Tuorum Illustris Magnifice Prusimski
    Subditt~ qui sicut ante ita et praesenti Citatione apud Te Arestantur
  why: 'Who is cited to the sitting at Grab. The word you read "oto[?]" is "olim", the late. So Teresa Bogdańska,
    born Rozdrażewska, is cited as the "successor" of two dead sisters: the late Katarzyna, "by her last marriage
    Prusimska", heiress of Grab, and the late Molska, castellan''s wife of Rogoźno, "who departed this life without
    issue" ("de hac luce decessarum"). She and her husband Ludwik are "the spouses Bogdański" ("Conjugibus"). Your
    English listed Katarzyna and Molska as living persons who were cited, and supplied "[Katarzyna]" twice further
    down. There the scan has "Tui Illustris Magnifice Prusimski", the form of address to Antoni: the cause came
    to the sitting "by way of the prosecutions and protests of you, Prusimski", and the four working men of Nowa
    Wieś to be produced as witnesses are "your subjects", arrested in his keeping "as before".'
  grade: significant
  source: changes
- doc: app53170koningr118
  lang: 'holding: la/la,pl/pl,la'
  was: discrepando in inter protationem non tantum Decreti Tribunalii ... declarando ultra praesumptum Decreti ...
    pro[v/pr?]iis Innotescensiis iterum se Condescenscerum, loco Remissionis ad Tribunal Regni Causae obrationem
    impossibilis juxta Lineam in Mappa cum Sita locorum difformi ... sine Interceptione Hollandoris sibi Re et Mafanti[?]
    adjudicati ... cum Eodem de[m/re?]ale gesto Officio
  now: discrepando in interpretationem non tantum Decreti Tribunalii ... declarando ultra praescriptum Decreti ...
    propriis Innotescentiis iterum se Condescensurum, loco Remissionis ad Tribunal Regni Causae ob rationem impossibilis
    juxta Lineam in Mappa cum Situ locorum difformi ... sine Interceptione Hollandonis sibi Re et Mafanti adjudicati
    ... cum Eodem de male gesto Officio
  why: 'What Chełmski charges Górski with, read whole. Górski "thrust himself into the interpretation" of the Tribunal''s
    decree ("in interpretationem ... se se ingessit"; your "in inter protationem", translated "in the execution").
    He declared, "beyond what the decree prescribes" ("ultra praescriptum"; your "praesumptum"), that he would come
    again "upon his own notices", instead of sending the cause back to the Tribunal "because carrying it out along
    the line made on the map, which does not agree with the lie of the ground, is impossible without cutting off
    the Olęder adjudged to him" ("sine Interceptione Hollandonis sibi ... adjudicati": one settler, in the singular,
    the one whom Konin Gr.153 names as Martin Hunt). Chełmski will sue him "for the office ill discharged" ("de
    male gesto Officio").'
  grade: significant
  source: changes
- doc: app53170koningr118
  lang: 'holding: la/la,pl/pl,la'
  was: Decreti Tribunalii Post Commissorialis ultime Instantiae existantis ... non admissarum Judicialiter se se
    dedaravit ... et [F?]ine Impetrandi Militaris ab Inclito Departmento Belli[c?]o Au[?]itii supersessit
  now: Decreti Tribunalii post posita Authoritate Sancti Tribunalitii Post Commissorialis ultimae Instantiae existentis
    ... non admissurum Judicialiter se se declaravit ... et Fine Impetrandi Militaris ab Inclito Departamento Bellico
    Auxilii supersessit
  why: 'Górski''s protest: words were passed over between two occurrences of "Tribunalitii". Chełmski resisted "setting
    at nought the authority of the sacred Tribunal" ("post posita Authoritate Sancti Tribunalitii"). And what Chełmski
    refused to allow is the further "correction" of the line ("meliorationem Lineae"; your English "laying"). That
    is the very act for which the Tribunal punished Górski in October (Konin Gr.153). Górski stopped "to obtain
    military aid from the War Department" ("Militaris ... Auxilii").'
  grade: fact
  source: changes
- doc: app53170koningr118
  lang: 'holding: la/la,pl/pl,la'
  was: Casimiro Judicii Terrestri ... Nepomuceno Judicii Castren~ ... Sui Actt~ germanorem Filiastri ... Prusimski
    Aci[?] vero Sui ... tum atterius pro logo Remissionis Intervenientibus Decreti Tribunalis ... mandamus [itt/ott?]
    coram ... super Voles[?]
  now: Casimiro Judici Terrestri ... Nepomuceno Judici Castren~ ... Sui Actt~ germanorum Filiastri ... Prusimski
    Avi vero Sui ... tum alterius pro loco Remissionis Intervenientibus Decretis Tribunalis ... mandamus ut coram
    ... super Vobis
  why: Prusimski's descent, as the citation gives it, read whole. Antoni is the "nephew" ("Filiastri", brother's
    son) of Jan, Bogumił, Antoni and Paweł, and, after Antoni and Paweł died without issue, "their sole natural
    and legitimate successor". Your English had him as their "[descendant]" and as "Successor of the Plaintiff".
    Krzysztof Prusimski is his "grandfather" ("Avi", your "Aci[?]"). Kazimierz Zakrzewski is land "judge" and his
    son Nepomucen municipal "judge" of Radziejów ("Judici"). The land court "found itself the forum instead of making
    the remission to the Tribunal, though Tribunal decrees stood in the way" ("pro loco Remissionis Intervenientibus
    Decretis Tribunalis").
  grade: fact
  source: changes
- doc: app53170koningr118
  lang: 'holding: la/la,pl/pl,la'
  was: czyli Moce do uspomnionych Dóbr pozabierane procz Siodmiu kloców odsiemnych y Gałęzi[?] na mieysce lezązych[?]
    ... wtym Czasie [W/U?][x?]ią[g?] ... [s?]tudze Jego ... w Sam[...?][z?]iem rozpoczynaiących ... LudziSwoich
    jakoło Urodzonych ... Antoniego Waziaka ... nastal, którzy nast[awi?] ... zanieśli ... na Dziedzinie Dworski
    wpadli
  now: czyli Kloce do wspomnionych Dóbr pozabierane procz Siodmiu klocow odziemnych y Gałęzi na mieyscu lezących
    ... wtym Czasie u Xiąg ... Słudze Jego ... w Sam [o?]dzien rozpoczynaiących ... Ludzi Swoich jako to Urodzonych
    ... Antoniego Wasiaka ... nasłał, którzy nasła[ni] ... z[a?]wiezli ... na Dziedziniec Dworski wpadli
  why: 'The pines of November 1782, the Polish read whole. The felled timber, "that is the logs" ("Kloce", your
    "Moce"), was taken away "to" Chełmski''s estates ("do wspomnionych Dóbr"; your English "from"), all but seven
    "butt logs" ("odziemnych") and the branches "lying on the spot". In the protest: Prusimski "cannot at this time
    be at the books of the office" ("u Xiąg Urzędownych"); Jaroszewski is Chełmski''s "servant" ("Słudze"); Chełmski
    "sent" his people ("nasłał") "on the very day" the two sittings began; they "carted" the pines to Łukomia and
    "burst into the manor courtyard" ("na Dziedziniec Dworski"; your "Dziedzinie", "domain"). One of them is Antoni
    "Wasiak", like his father in the next line. A "szkudlarz" is a shingle-maker, not a wool-carder. Prusimski "charged
    the manifestant" (Maszewski) with lodging the complaint.'
  grade: fact
  source: changes
- doc: app53170koningr118
  lang: 'holding: la/la,pl/pl,la'
  was: Czerniechoviae que sibi Illustri ... Bonisque Suis ... Inhaerendo Ma[f?]nibus Suis Citant Se seu ... Caeteraque
    pro Causae attentaturus et
  now: Czerniechoviaeque Tibi Illustri ... Bonisque Tuis ... Inhaerendo Manifestationibus Suis Citant Te seu ...
    Caeteraque pro Causae praesentis exigentia Statui et decidi Sis pariturus Terminum attentaturus et
  why: 'The convent''s citation addresses Prusimski as "you" ("Tibi", "Tuis", "Citant Te"), where your text had
    "sibi", "Suis", "Se" and your English "cite themselves". The monks adhere "to their manifests" ("Manifestationibus").
    A line was passed over at the end: "and the rest to be decreed and decided as the present cause requires; be
    ready to obey, to attend the term". The abbot is Ludwik Benedykt Lubstowski; your English had made "Ludovici"
    into "of Ląd".'
  grade: fact
  source: changes

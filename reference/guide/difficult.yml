  lang: pl
  was: rozwiązując suspense swoje względem wiolencji z urodzonym Chełmskim wyżej uczynioną
  now: rozwiązując suspensę swoją względem wiolencji i pochodzących prowentów z gruntu odgraniczonego tudzież względem

- doc: app53170koningr116
  lang: la
  was: 1775, 1776
  now: see the dates on each document
  why: 'Dates. On the pages: 16 August 1775 (the three notes), 3 October 1775 (the inspection heading), 9 October
    1775 (Chełmski''s counter-protest; the heading is on leaf 95 recto), 16 February 1776, 1 July 1776, 5 September
    1776. Not on a photographed page, and inferred: the note of the constitution (August 1775), the three protests
    on leaves 89 verso and 90 (September 1775), Prusimski''s unwritten protest on leaf 266 verso (1777), and Chełmski''s
    search on leaf 335 verso (October 1777).'
  grade: fact
  source: changes
- doc: app53170koningr116
  lang: la
  was: (no link drawn)
  now: see the holding's page
  why: 'Chełmski''s own search on leaf 335 verso is the one the land court''s decree of October 1777 (53/6/0/-/46)
    cites as made by him at Konin that October. The decree for which Prusimski''s men searched on 16 February 1776
    was one given "in contumaciam" of Prusimski: not the parliament''s commission''s decree, which was for him,
    and presumably the act of Chełmski''s own commissioners. That last point is my reading; the entry does not say
    it.'
  grade: fact
  source: changes

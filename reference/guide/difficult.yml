- doc: app53170koningr115
  lang: 'holding: la/la,pl'
  was: the besieging of the innkeeper's goods ... concerning the removal of goods, [carried out] by licentious subordinate
    men
  now: the besieging of the innkeeper's house ... concerning the shooting through of the house, [carried out] by
    licentious subordinate men
  why: '"Gaza" is a hut or house, not goods. On 16 December 1771 armed men besieged the innkeeper''s house, and
    what the messenger lays to Prusimski''s men is the shooting through of the house (the loopholes and shot-out
    windows he has just described), not a removal of goods.'
  grade: significant
  source: changes
- doc: app53170koningr115
  lang: 'holding: la/la,pl'
  was: possessor by force of his rights of the estates of Łukom ... of the olędry called Lusnia by hereditary title
    ... acknowledged to him by right of a previously lodged manifest, nonetheless, by the special mandate or connivance
    of the Honourable Lipiński [his] steward, [of] Marzęcki
  now: heir of the estates of Łukom with their appurtenances, possessor by force of his rights of the olędry called
    Lusnia ... acknowledged by law to him, the protester, nonetheless — whether by his special mandate or by his
    connivance — permitted the Honourables Lipiński, [his] steward, and Marzęcki, his chamber attendant
  why: In Chełmski's protest it is Prusimski who, by his own order or connivance, let Lipiński and Marzęcki ride
    upon the inn. The English had the mandate or connivance as Lipiński's and Marzęcki's. Chełmski is "heir" of
    Łukom and "possessor" of the Lusnia settlers; possession was adjudged "to him, the protester".
  grade: significant
  source: changes

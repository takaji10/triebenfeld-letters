    signature also stands twice at the foot of leaf 186 verso (not transcribed).'
  grade: fact
  source: changes
- doc: app53170koningr115
  lang: 'holding: la/la,pl'
  was: Videatur hoc loco…
  now: Videatur hoc Loco Citationis ex Parte Magnifici Antonii de Kolno Prusimski Capitanei Nieszczeviensis In et
    Contra Magnificos Chełmski Successores Żychlinianos Ignatium Gałecki Capitaneum Bydgostiensem … Abbatem et Venerabilem
    Conventum Landensem pro Judiciis Tribunalis Regni Bidg~ ad Granitian~ editt~ Relatio In Productis.
  why: 'The two notes on leaf 35 verso, which you gave as "Videatur hoc loco…", are read as far as I could: Prusimski
    cited the Chełmskis, the Żychliński heirs, Ignacy Gałecki, Starost of Bydgoszcz, and the abbot and convent of
    Ląd before the Tribunal at Bydgoszcz for the fixing of the boundary; Chełmski cited the abbot Słowiecki and
    convent of Ląd, Prusimski and Gałecki. "…" marks what I did not read.'
  grade: fact
  source: changes

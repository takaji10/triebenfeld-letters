- doc: app53170koningr145
  lang: pl
  was: gdy w tymże goscińcu ludzi swych osądził tak urodzony Chełmski bić zabić i strzelać wołał, także rzeczy wszystkie
    sam, w gościńcu będące
  now: gdy w tymże goscińcu ludzi swych osadził tak urodzony Chełmski w tym razie przeciw prawu sobie postępując
    żadnego kroku do prawa nie uczyniwszy, ale gwałtem osobiście sam z kilkudziesiąt ludzi strzelbą różną uzbrojonemi
    gościeniec ten najechawszy zaraz oknem do gościńca strzelać rozkazał i mało jednego szlachcica urodzonego Krzeczkowskiego
    nie zabito i napiętek mu ustrzelono a przy tym i gościeniec zapalono który ledwie przecie po ucieczce ludzi
    z strony samego urodzonego Chełmskiego uratowano. Podczas którego ataku sam urodzony Chełmski bić zabić i strzelać
    wołał, także rzeczy wszystkie tam, w gościńcu będące
  why: 'THE LARGEST FIND: about sixty words, some five lines of the page, skipped between two "urodzony Chełmski".
    They are the court''s finding of what Chełmski did at the inn: when Prusimski put his men into it, Chełmski,
    "taking no step at law, but by force, in person, with several dozen men armed with firearms of various kinds,
    rode upon the inn and at once ordered shooting through the window into it; a nobleman, the Honourable Krzeczkowski,
    was nearly killed and had his heel shot off; and the inn was set on fire, and was barely saved after the men
    on Chełmski''s own side had fled. During which attack" Chełmski himself shouted to beat, kill and shoot. The
    penalties on the next leaf ("for the armed raid and the shooting and the burning of the inn", "for the unlawful
    use of firearms") refer to exactly this. The name Krzeczkowski is written above the line; the second vowel could
    be y. Also "osadził" (placed his men) for "osądził" (judged), and "tam" for "sam"'
  grade: significant
  source: changes

- doc: app53170koningr119
  lang: la
  was: Alios vero arestum non provenit ... quod Arestum praemissos Homines non prevenit Emandaturum
  now: Alios vero arestum non praevenit ... quod Arestum praemissos Homines non praevenit Emundaturum
  why: '"Arestum ... non praevenit" in Prusimski''s protest (leaf 304 verso) means that the arrest did not REACH
    the men: he can produce only Gregory and Thomas, and the arrest did not reach the others. And he offers to "clear
    himself" (Emundaturum), not to make amends. The same phrase is in the land court''s decree, 53/6/0/-/47.'
  grade: significant
  source: changes
- doc: app53170koningr119
  lang: la
  was: Inva[s?]orem Bo[u?][m?] Currus et Securum ... cum Pab~sis ... de mandato Sui ... Statutionem hominum demandeoque[?]
    Simiti[?]nium educendum
  now: Invasorem Boum Currus et Securium ... cum Laboriosis ... de mandato Tui ... Statuitionem hominum demandari
    Scrutinium educendum
  why: 'Chełmski''s first citation (leaves 62 and 62 verso): what Maszewski is charged with taking is "oxen, carts
    and axes" (Boum Currus et Securium); the men under arrest are "Laboriosis", working men; the acts would be Prusimski''s
    if done "at your order" (de mandato Tui); and the citation asks that "the production of the men be ordered and
    an inquiry conducted" (Statuitionem hominum demandari Scrutinium educendum).'
  grade: fact
  source: changes

    ... obedientia eundem reliquit prout relinquit actus praesentis vigore ... Generalis Commissarius mp
  why: The act for Martin Hunt (leaf 1404), read whole. Hunt is delivered "in actualem possessionem", into actual
    possession (your "in actu aliam positionem", for which you had a note); Prusimski was PRESENT IN PERSON ("circa
    actum hunc personaliter praesentis"); no one opposed ("nemine impugnante"); and obedience to Prusimski was enjoined
    on Hunt ("indicta ... obedientia"). Łukaszewicz signs "Generalis Commissarius mp"; there is no "Officialis".

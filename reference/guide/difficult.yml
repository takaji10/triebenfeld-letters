- doc: app536046
  lang: la
  was: (your first reading, in your Latin file under "[182v] N. 16to"; no English)
  now: N. 17mo Inter Eundem Actorem per Eundem et Eundem Citatum personaliter Judicium etc. Terminum Partis Actoreae
    ad Judicium suum editum Decidendo controversiis exauditis Licet si Magnificus Stanislaus Chełmski virtute transfusionis
    coram actis Castrensibus Pyzdrensibus Feria 4ta in Vigilia Festi Nativitatis Beatissimae Virginis Mariae anno
    1768 per Excellentem Joannem Tracholz mercatorem et Incolam Vitkovien~ super summas varias ab olim Magnifico
    Paulo Prusimski praetensas in Personam Ejusdem Magnifici Chełmski recognitae actoratum Magnifico Prusimski Capitaneo
    Nieszczevicen~ instituendo Comportationem contractus respectu Divenditionis Borrae Trąbczynen~ cum honorato
    Tracholz et olim M. Paulum Prusimski initorum praetendit Cum vero Judicio suo Deducitur Decretum in anteactis
    Judiciis suis Feria 2da post Dominicam Septuagesimae anno 1766 Inter honoratum Joannem Tracholz et M. Antonium
    Prusimski modernum Citatum remissionis causae ad Terminum Condescensionis intercessisse et non effectuatum esse
    proinde suspenso toto negotio necessariam esse Condescensionem in Fundum Bonorum Trąbczyn affectan~ Partibus
    Judicii sui In et pro Feria 2da post Dominicam Laetare Quadragesimalem in anno futuro venturam adinvenit Decernendo
    Quatenus Partes hoc Idem Judicium absentia Duorum uniusve non obstante Conducant Quod sive Qui Conducendus Comportationem
    contractus superius specificati per M. Prusimski Capitaneum Nieszczevicen~ demandabit Causamque praesentem pro
    exigentia Legis Justitiae nexus Documentorum contenta Partis actoreae Terminorum resolutis quibusvis dubiis
    et Intervenien~ finaliter decidet et disjudicabit satisfactionem cui quanta et a quo intererit Decernet Inquisitiones
    pro oportunitate negotii expediet Juramenta ubi necesse fuerit et a quo intererit excipiet rigores annectet.
    Cujus Judicii Condescensuri Partes parere et acquiescere sub paena banitionis coram Eodem Conducendo Judice
    super Parte contraveniente In casu contraventionis publicanda debebunt et tenebuntur. Luita paena 14 marcarum
    Polonicalium Parti per Partem compensanda Judicio in instanti sub solito rigore per medium solvenda pro quo
    Condescensionis Termino Partes quos negotium exigent adcitent adcitati sub rigore suprascripto compareant.
  why: 'A text you have not had in a form you could use. You photographed this entry and made a first reading of
    it, with more than forty marks of doubt and no English; it stands in your Latin file under "[182v] N. 16to",
    but it is no. 17 and it is on leaf 183 recto. I read it again from the film and translated it. It is the decree
    behind the suit of 1778 in Konin Gr.117: Chełmski sues Prusimski under the transfer of 7 September 1768 (the
    Wednesday, the eve of the Nativity of the Virgin), acknowledged at Pyzdry, by which the merchant Jan Tracholz
    made over to him sums claimed from the late Paweł Prusimski, and demands the contract for the sale of the Trąbczyn
    pine wood. The court finds that its decree of the Monday after Septuagesima 1766 (27 January), which sent the
    cause between Tracholz and Antoni Prusimski to a hearing on the ground, was never carried out; it suspends the
    matter and fixes a hearing of the court on the ground of Trąbczyn for the Monday after Laetare Sunday of the
    coming year (30 March 1778). Where my reading differs from yours in sense: the sums are claimed "ab olim Magnifico
    Paulo", from the late Paweł; the term is of a "Condescensio" (your "Condicionalis"); the decree of 1766 is "non
    effectuatum", not carried out; the hearing is "in anno futuro venturam"; the judge "Juramenta ... excipiet",
    takes oaths; and the last word is "compareant". Two words you have since settled on the page: the merchant''s
    town, "Vitkovien~" (I give it as Witkowo in the English: that identification is mine), and "initorum". One thing
    to check in your own work: this decree names the Monday after LAETARE for the hearing, and the citation to it
    in Konin Gr.117 names the Monday after INVOCAVIT (9 March 1778). You have looked at both, and each stands as
    written.'
  grade: significant
  source: changes

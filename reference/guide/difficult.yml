- doc: app536046
  lang: la
  was: the Right Honourable Prusimski, having produced and brought forward certain acts ... and having likewise
    requisitioned three [oblatas] ... and [claiming] that the field acts likewise brought forward as alleged had
    been noted in the records of the proper palatinate; proves [this claim]
  now: Although the Right Honourable Chełmski ... claims from the Right Honourable Prusimski the production of a
    certain act ... and, laying before the court three searches for that same Boundary act ... proves that the said
    field act, whose production is claimed, was not in the records of its proper palatinate
  why: Who proves what was the other way round. It is Chełmski who lays down the three searches and proves by them
    that the act was NOT in the records of its own province ("in actis proprii Palatinatus non extasse probat").
    The English had Prusimski producing the acts, requisitioning three oblatas, and claiming they HAD been noted
    there.
  grade: significant
  source: changes
- doc: app536046
  lang: la
  was: '[having] requisitioned through the Honourable Ludwik Łański in the name of his party, inserted the Commissorial
    Boundary Decree ... filed before the records of the Brest [Kuyavia] Municipal Court on the 10th day of the [aforesaid?]
    month of October'
  now: '[lays down] a search, made through the Honourable Ludwik [uncertain: Łański] in the name of the party concerned,
    for the Commissorial Boundary Decree ... a search made before the records of the Municipal Court of Brest in
    Kuyavia on the 10th day of the present month of October'
  why: What Prusimski lays down is a search for the decree, made at Brześć Kujawski on 10 October 1777 and entered
    at Konin on 16 October. The English had the decree itself "inserted" and filed on those days.
  grade: significant
  source: changes

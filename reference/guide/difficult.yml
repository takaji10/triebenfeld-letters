    of the parent, under a decree ordering them to adhere to the protest
  now: the particular land terms of the district of Konin ... the sons with their parents, the retainers and subjects
    with their lords, to adhere to the protest
  why: 'There are no "three decreed terms" and no "decree ordering them to adhere". Both are set phrases: the land
    terms of the district of Konin, and the sons cited with their parents, the servants and subjects with their
    lords.'
  grade: fact
  source: changes
- doc: app536040
  lang: la
  was: finds that a decision must be reached, and that the term sought by the plaintiff party ... is properly instituted
    before the present court, since the cause of the estate is being ventilated before the same court
  now: 'deciding the term of the plaintiff party ...: since the cause of the estate is being ventilated before its
    own court, it finds that a commissarial descent ... is necessary'
  why: 'The court makes one finding: that a commissioner must go onto the ground. It does not first find "that a
    decision must be reached" or that the suit is "properly instituted". The question of the ground is before "its
    own court", not "the same court".'
  grade: fact
  source: changes

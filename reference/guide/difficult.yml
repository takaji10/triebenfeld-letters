  why: 'This decree is why the boundary decree stands in the Konin book (Konin Gr.145): the land court orders Prusimski
    to enter it at Konin, in its own province, within four weeks. The first of Chełmski''s three searches, at Kalisz
    on 23 November 1776, is Kalisz Gr.424.'
  grade: significant
  source: changes

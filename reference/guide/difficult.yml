  now: see the list
  why: 'Smaller readings: "peremptorie"; "Audien~"; "Evehendarum non nisi"; "Ministerialibus"; "Censeri"; "Praedioque
    ... Sella ... Scriba ... Die horna"; "injungi ... paritt~ ... responsurus"; "utrum Relationes Citationum ...
    Recognitae ... Easdem ... praeteriti ... Matuszkiewicz ... Recognitam ... Ideo de inexistentia Earundem ...
    fidem"; "Imieniem"; "proxime ... Qua ex Parte ... Generosorum ... essentiae ... praecedente"; "tenoris ... Raczyński
    ... Tuis ... Nris~ ... Compareas ... pariturus et"; "Eques succurrendo ... Etenim ... extiterit ... quod ...
    peracta ... videatur ... offert"; "Commisso ... Petiit Relationem edittae ... Tribunalis Regni ... exportatae
    utrum".'
  grade: wording
  source: changes
- doc: app53170koningr119
  lang: la
  was: pro Judiciis Castren~ Calissien~ per in Castro ... porrigenda Similem editt~ praesen~ Matre familias
  now: pro Judiciis Castren~ Calissien~ proxime in Castro ... porrigendae Similem editt~ In Bonis Nowawieś Praedioque
    Ibidem Sito super Scrinio hippi praesen~ Matre familias
  why: 'A line was passed over in the report of May 1783. It says where Chełmski''s citation was left: "at the estate
    of Nowa Wieś, in the manor farm there, on the chest in the heated room", before the lady of the household. The
    sessions are the "next" ones at Kalisz castle ("proxime", your "per").'
  grade: fact
  source: changes
- doc: app53170koningr119
  lang: la
  was: In Judiciis Nostri Castrensia Calissien~ propriis et proximis ... tam Manifestat~ factae sive faciendem ...
    Decreti Tribunalii pactae Erectionis Scopulorum
  now: In Judiciis Nostris Castren~ Calissien~ primis et proximis ... tum Manifestat~ factae sive faciendae ...
    Decreti Tribunalii peractae Erectionis Scopulorum
  why: The first half of Chełmski's citation of March 1783, read whole. The men named with Maszewski are "working
    men" ("cum Laboriosis"; your English "together with its pastures"), and they "are arrested in your keeping by
    the present citation" ("apud Vos Arestantur"; your English "in your presence"). What was taken from Chełmski's
    people is "oxen, carts and axes" (your English left out the oxen). The mounds are those "raised" under the Tribunal's
    decree ("peractae Erectionis Scopulorum"; your "pactae", translated "agreed"). Nothing else in this half changes;
    with it, every entry of the holding has been read against the scans.
  grade: fact
  source: changes

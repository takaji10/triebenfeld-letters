- doc: app53170koningr115
  lang: 'holding: la/la,pl'
  was: 1768, 1771, 1772, 1773
  now: see each document
  why: 'Dates. By the calendar: 17 May 1768; 2 and 20 December 1771 (the clash on Monday 16 December); 1 December
    1772 (the inn stripped on Saturday 28 November); 26 February 1773. Three entries have no date line on a photographed
    page and are dated to the month: the note on leaf 3 verso to January 1768, the note on leaf 37 to May 1768,
    the protest and report on leaf 245 to March 1773.'
  grade: fact
  source: changes
- doc: app53170koningr115
  lang: 'holding: la/la,pl'
  was: being present, on commission from ... among the olędry assigned to the estates of Łukom ... for the purpose
    of fomenting disturbances by [their] instruments ... [by] a man of the Podbiele estates
  now: by special commission of ... built upon by the olędry, belonging to the estates of Łukom ... fitted out for
    attempting disturbances ... [by] men of the Podbiele estate
  why: The weapons were presented "by special commission" of Chełmski; the Lusnia wood is "built upon by the settlers";
    the embankment was broken by "the subjects of Trąbczyn", to be named later; the inn's fittings were carried
    off by a band "fitted out for attempting disturbances"; the alders were cut by "men" of Podbiele, not one man.
  grade: fact
  source: changes
- doc: app53170koningr115
  lang: 'holding: la/la,pl'

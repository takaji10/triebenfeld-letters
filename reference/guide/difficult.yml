- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: conditum, jurisdictioni[?] in ultimo scopulo cum vicinis Testibus expleti[?] Authorisatum ... ac [pro/prae]stitum
    pro Venientem jurisdictionem[?] ... praestito pro Vn~tr in ultimo Aciali scopulo jurisdicti solidatos esse ...
    de prostito pro vn~tes ad formam Statuti in corroborationem eorundem jurisdictioni ad aequatam notitiam
  now: conditum, juramento in ultimo scopulo cum vicinis Testibus expleto Authorisatum ... ac praestitum per Venientem
    juramentum ... praestito per Vn~tem in ultimo Aciali scopulo juramento solidatos esse ... de praestito per vn~tem
    ad formam Statuti in corroborationem eorundem juramento adaequatam notitiam
  why: The word you read as "jurisdictio" is "juramento", an OATH. The scan has "jurto" and "jurtum" with a mark.
    Chełmski says the decree of his commissioners of 1775 was confirmed "by the oath performed at the last mound
    with neighbouring witnesses" ("juramento in ultimo scopulo cum vicinis Testibus expleto Authorisatum"), and
    that Prusimski's commissioners acted after "the oath sworn by the appearing party", that is, by Chełmski himself.
    Lower on leaf 58 you read the same abbreviation as "Juramentum" yourself ("oath against oath"). The "appearing
    party" ("veniens") is Chełmski throughout; your English had "the opposing party" for it in several places.
  grade: significant
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: '(the Latin is unchanged: pro invalibili agnovisse ... in altero pro invalibilibus)'
  now: (the Latin is unchanged)
  why: '"Invalid", not "inviolable". Chełmski argues that Prusimski, by not entering his commissioners'' act in
    the records and not acting on it, "himself acknowledged it as invalid" ("pro invalibili agnovisse"); and that
    Czarnecki treated documents "in one place as legitimate, in another as invalid" ("pro invalibilibus"). Your
    English had "inviolable" in both places, which turns the argument round.'
  grade: significant
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: Decreti Terrestris Calissiensis Coninensis Mgcum~ Subjudici reposuit et pro[u/c?]it totum Judicium ... Remissione
    Causae hujus ad Tribunal pro Magnificum Subjudicum Terrestre Calissien~ loco faciendae virtutae [pro/prae]missanon[?]
    Rationum Remissionis ... rursus ad se Ipsum totumque Judicium prosecutis et adisjudicatione Causae Istius[?]
  now: Decreti Terrestris Calissiensis Coninensis Actumque perficien[?] ejusdem Condescensionis Easdem prosecutiones
    in Termino Condescensionis Mgco~ Subjudici reposuit et prout totum Judicium ... Remissionem Causae hujus ad
    Tribunal per Magnificum Subjudicem Terrestrem Calissien~ faciendam esse Expetierat, et Concluserat, Nam Idem
    M. Judex Terrestris Calissien~ Loco faciendae virtute praemissarum Rationum Remissionis ... rursus ad se Ipsum
    totumque Judicium prosecutos et a dijudicatione Causae Istius
  why: 'Two passages where a line, or part of one, was passed over. (1) After "Decreti Terrestris Calissiensis Coninensis"
    a line is missing: Prusimski "laid the same prosecutions before the sub-judge at the term of the sitting on
    the ground". (2) Between two occurrences of "Calissien" these words are missing: Prusimski "had sought and concluded
    that the remission of the cause to the Tribunal should be made by the sub-judge; for the same land judge, instead
    of making it ...". What follows then reads differently: the judge sent the cause back "to himself and the whole
    court, who were under prosecution" and bound to stop judging it. Your English had Prusimski "again prosecuting
    the sub-judge himself and the entire court".'
  grade: significant
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: et [s?]e Cittan~ parte ab altera prolatum ad citt~ adviden~ et Auris Manifestationibus et Terminis tuis ...
    super [s?]e decerni Statui et Sententiam proquo litaris lis parituriae[?] Terminum attentatioris[?] et Judicialiter
    responsumis
  now: et Te Cittum~ parte ab altera prolatum adcitt~ ad viden~ et Audien~ actoratum Sui Actoris tibi Institutum
    non obstantibus quibusvis Manifestationibus et Terminis tuis ... super Te decerni Statui et Sententiari proquo
    Citatus sis pariturus Terminum attentaturus et Judicialiter responsurus
  why: A line was passed over, and your "Auris" joined the end of one line to the start of the next but one. Chełmski
    cites Prusimski "to see and hear the suit of himself the plaintiff, instituted against you, adjudged notwithstanding
    any protests and terms of yours". The citation addresses Prusimski as "you" throughout ("Tibi", "Te", "tuis"),
    where your text had "Sibi", "se", "suis"; and it ends with the usual formula, "Citatus sis pariturus Terminum
    attentaturus et Judicialiter responsurus".
  grade: significant
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: (the Latin is unchanged, but for "praetensio" and "Patruo" without its mark of doubt)
  now: major praetensio et Summae ab olim Magnifico Patruo Actoris per olim Honoratum Tracholz Contractae et Eidem
    debitae
  why: Who owed whom. The sums in question were "contracted from the plaintiff's late uncle by the late Tracholz,
    and owed to the uncle" ("ab olim Magnifico Patruo Actoris per olim Honoratum Tracholz Contractae et Eidem debitae").
    Your English had it the other way round, the uncle borrowing from Tracholz. This agrees with leaf 55, where
    Tracholz is the uncle's debtor. If the papers show such a debt, Chełmski, who took over Tracholz's right, is
    to pay it to Prusimski.
  grade: significant
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: Jure illegali pro M Chełmski ... pro Commissarios pro parte vn~tis conductos ... pro anteriores pro tunc
    Bonorum Trąpczyna cohaeredes ... pro JMcum~ Prusimski ... pro Magnificum Chełmsi non habito
  now: Jure illegali per M Chełmski ... per Commissarios pro parte vn~tis conductos ... per anteriores pro tunc
    Bonorum Trąpczyna cohaeredes ... per JMcum~ Prusimski ... per Magnificum Chełmski non habito
  why: 'One sign misread throughout: the clerk''s "p" with a stroke through its tail is "per", where you wrote "pro".
    With an accusative it means "by". So the right was acquired "by" Chełmski from Tracholz ("per Magnificum Chełmski
    ... quaesiti"; your English "acquired for"); the decree of 1775 was given "by" Chełmski''s commissioners; the
    inspection of 1592 was acknowledged "by" the then co-heirs of Trąbczyn; Czarnecki was engaged "by" Prusimski;
    and the term was not had "by" Chełmski. Corrected in about fifteen places.'
  grade: fact
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: Nihilominus Cassat[io?] Man[ifestationem?] seu Jure illegali pro M Chełmski a Famat[o?] Joanne Tracholz in
    debitae ... quae Iteris Jusitia[???] ac Documentorum [????] ... ex Novella Legis
  now: Nihilominus Cassata Transfusione seu Jure illegali per M Chełmski a Famato Joanne Tracholz indebite ... quae
    Juris Justitiae ac Documentorum erunt ... ex praescripto novellae Legis
  why: 'In the first citation to the Tribunal, what is to be quashed is "the transfer" of Tracholz''s right to Chełmski:
    "Cassata Transfusione", where you had "Cassat[io?] Man[ifestationem?]" and translated "the cassation of the
    manifest". The same words stand in full on leaves 55 verso and 72. The close of the citation is the usual "quae
    Juris Justitiae ac Documentorum erunt"; and the new law is cited "ex praescripto novellae Legis" ("praescripto"
    was passed over).'
  grade: fact
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: recognitae, pro anteriores ... authorisatae et Observati in dislimitatione injunctae intercesisse ... habita
    protecta ... attestatarum Juramentum contra Juramentorum offerre ... Alterum Sensu praefato correntem ... ad
    latus sui suscepitt[?] ... Qua ex republiae praemissa exponendo
  now: recognitae, per anteriores ... authorisatae et Observari in dislimitatione injunctae intercessisse ... habita
    perfecta ... attentatarum Juramentum contra Juramentum offerre ... Alterum Sensu perfecto carentem ... ad latus
    sui susceptum ... Qua ex re publice praemissa exponendo
  why: 'Read whole. The inspection of 1592 was "acknowledged by the then co-heirs of Trąbczyn" and "ordered to be
    observed in the delimitation" ("Observari") by the Tribunal decrees of 1766 and 1768. Prusimski had "full" notice
    of the oath ("perfecta", your "protecta") and was "little acquainted with his own boundaries" ("gra~erum" is
    "granicierum"; your English "grievances"). Of his three fellow-swearers the second is "lacking full sense" ("Sensu
    perfecto carentem"; your "Sensu praefato correntem", "running there under the aforesaid protection"), and the
    third was "taken to his side" straight from Piotrków. The close is "Qua ex re publice praemissa exponendo",
    "for which reason, publicly setting out the foregoing": there is no "Republic" in it.'
  grade: fact
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: post dislimitationem prolatam ... pro Cognata[xa?] JMcae~ Capitanei ... Id eo futurae contrariae inter praeta~ori
    subveniendo ... Ad Acta propriis Palt~us in tempore per Oblatam porrectus verite et legitime
  now: post dislimitationem praefatam ... per Cognatas[?] JMci~ Capitanei ... Ideo futurae contrariae interpretationi
    subveniendo ... Ad Acta proprii Palatinatus in tempore per Oblatam porrectum rite et legitime
  why: 'Łukom is described as "his own, the appearing party''s" (your English: "of the opposing party"). Prusimski''s
    commissioners acted "after the aforesaid delimitation" ("praefatam", your "prolatam"), and their act was drawn
    up "by persons related to the Starost" ("per Cognatas ... Personas"; your English "for the cognate persons").
    Chełmski protests "to meet a future contrary interpretation" ("Ideo futurae contrariae interpretationi subveniendo").
    The decree of 1775 was brought "duly and lawfully" ("rite et legitime") to the records "of its own palatinate".'
  grade: fact
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: Ultranec Se[r?]um Maante[Manifestatione?] Litigiae querens, acesces[?] est et prosumpsit ... cum Eisdem Successionibus
    ... cum Jurisdatione Magnifici Chełmski ... Judiciorum[?] Manifestatur ... in Solutionem aliquam Causae Generalis
  now: Ultronee Secum Manifestante Litigia querens, ausus est et praesumpsit ... cum Eisdem Successoribus ... cum
    Jurisdatore Magnifici Chełmski ... Judicem Manifestatur ... involutionem aliquam Causae Granicialis
  why: Chełmski sought lawsuits with Prusimski "of his own accord" ("Ultronee"), and "dared and presumed". The earlier
    decrees involved "the successors" of the uncle's widow ("Successoribus"; your "Successionibus", "successions",
    and on leaf 71 "claims"). The remission of the cause was made "with Chełmski's assignor", Tracholz ("cum Jurisdatore";
    your "Jurisdatione"). Zielonacki is named as "judge" of the cause both in the full court and at the sitting
    on the ground ("Judicem"). What Prusimski fears is "some entanglement of the boundary cause" ("involutionem
    aliquam Causae Granicialis"; your "in Solutionem aliquam Causae Generalis", "some resolution of the general
    cause").
  grade: fact
  source: changes
- doc: app53170koningr117
  lang: 'holding: la/la,pl'
  was: Samogitiae Kujaviae ... de personis [?]nis Summis acossiu[?] vestris ... ex praescripto Novellae Regis omnino
    dec[t?]on debente ... In praepositurae Trąmpczynen~ ... Paulszewicz sibi Cancellaria ... praesenti Virgis[?]e
  now: Samogitiae Kijoviae ... de personis bonis Summis ac officiis vestris ... ex praescripto Novellae Legis omnino
    decerni debente ... In praepositura Trąmpczynen~ ... Paulszewicz ubi Cancellaria ... praesenti Virgine
  why: The royal title has "Kijoviae", Kiev, not Kuiavia. The judges are cited as to "your persons, goods, sums
    and offices". The cause began under "the new law" ("Novellae Legis"; your "Novellae Regis", "the King's new
    statute"). The first copy was left "at the provost's house at Trąbczyn" ("In praepositura"; your English "at
    the estate"); the second at Konin "where" the land court's chancery is ("ubi"); the third before "a girl" ("Virgine").
    Chełmski himself is to be punished or to make good the costs ("Ipsum ... per Eum"; your English "the same [defendants]").
  grade: fact
  source: changes

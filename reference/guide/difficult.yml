  source: changes
- doc: app53170koningr153
  lang: la
  was: Orławski Commissarium Granicialem ... Gorski Comissarium Granicialem ... per officii condescensorialia commissaria
    ... per officiorum cmle Dobrinensis ... officia commissorialia campestria ... officium comitiale Dobrinensis
    ... per officia comitalia campestria
  now: Orławski Camerarium Granicialem ... Gorski Camerarium Granicialem ... per officia condescensorialia camerarial[ia]
    ... per officium camerariale Dobrinensis ... officia camerarialia campestria ... officium camerariale Dobrinensis
    ... per officia camerarialia campestria
  why: The two officers who failed to carry out the first decree are boundary CHAMBERLAINS, and the two field offices
    that sat on 27 May 1782 are the chamberlains' offices. The scan has "Cmrium", "Cmrlia", "Cmrle" with a mark
    (Camerarium, camerarialia, camerariale) in the nine places where your text had "Commissarium", "commissorialia",
    "comitialia", "comitale" or "cmle". So Górski of Inowrocław and Orławski of Dobrzyń hold the same office as
    Jasiński of Gniezno, who carries the decree out in the end; none of them is a commissioner. In your English
    "Boundary Commissioner" and "commissarial office" become "Boundary Surveyor" and "Boundary Surveyor's office",
    your own word for Jasiński's office.
  grade: significant
  source: changes
- doc: app53170koningr153
  lang: la
  was: et ad Magnificum Chełmski eundem Hollandum ad usque possedisse
  now: et ad Magnificum Chełmski spectare posse. Jam verò Magnificum Chełmski eundem Hollandum adusque possedisse
  why: Words were passed over in the Tribunal's ruling on Martin Hunt, between two occurrences of "Chełmski". The
    Tribunal says that Hunt does not sit to the right of its line "and cannot belong to the Right Honourable Chełmski;
    yet the Right Honourable Chełmski has possessed that same settler until now". Your text ran the two together.
    The act for Hunt on leaf 1404 quotes the sentence whole, and your text has it there.
  grade: significant
  source: changes
- doc: app53170koningr153
  lang: la
  was: controversiis parte ut pote Illustrissimus Magnificus Prusimski Capitaneus Niszczeviensis ... anno praeveniente
    relata, in parte Magnifici Chełmski isse determinantis ... per decretum ad super appositam actibusque praemissis
    discordantibusque deducentibusque verificari
  now: controversiis partium utpote Illustris Magnifici Prusimski Capitanei Niszczeviensis ... anno praesenti relata,
    in parte Magnifici Chełmski esse determinantis ... per decretum de super appositam actibus praemissis discordantibus
    deducentibus verificari
  why: The opening of the Tribunal's account sets out the pleadings of the two parties, each in the genitive after
    "in controversiis partium" ("in the controversies of the parties"; your text had "parte"). It is Prusimski's
    pleading, not a finding of the court, that he stands by the decree of 23 January, and that a judicial inspection
    of 23 February, entered at Konin on 10 June "of the present year" (1782; your "previous year"), shows that the
    burnt settler's ground is "on the side of Chełmski" ("in parte Magnifici Chełmski esse") and that the map, as
    to the line, "is verified". Your English had the inspection "having gone in favour of" Chełmski and the map
    "to be verified, it being discordant".
  grade: significant
  source: changes
- doc: app53170koningr153
  lang: la
  was: Hollandorum per Magnificum Chełmski modo traditione preoccupationem distinctam cond[itional]um officii ...
    acsi per revolutionem judicii ... nempe die 6[?] mensis
  now: Hollandorum per Magnificum Chełmski modo traditorio praeoccupatorum distinctam condescensionem officii ...
    acsi per resolutionem judicii ... nempe die 6[ta] mensis
  why: 'How the settlers came back to Prusimski in March 1782. The first decree had ordered a separate sitting on
    the ground ("distinctam condescensionem") by the office of the municipal court of Gniezno, for the settlers
    "whom Chełmski had occupied beforehand by way of a delivery of possession" ("modo traditorio praeoccupatorum");
    and Hunt was left to Chełmski "by the resolution" of that court (your "revolutionem", translated "reversal").
    The day is the 6th: the figure is plain, and the Wednesday after Oculi Sunday 1782 was 6 March.'
  grade: fact
  source: changes
- doc: app53170koningr153
  lang: la
  was: Hollandus Joannis tempore ... quocirca quam v[erò] magnificus Chełmski ... cum attinentibus haereditates
    ... sese tutand[ae?] ... ipse relinqui ... solummodo ductum praesentium ... geographicae tantum ad notari ...
    Hollandus haereditatis bonorum Łukom ... in vim calculi quarto et praecidente actum ... in fundo nam reperitur
  now: Hollandus Joannes tempore ... quocirca quamv[is] magnificus Chełmski ... cum attinentibus haeres ... sese
    tutan[do] ... ipsi relinqui ... solummodo ductus partium ... geographice tantum adnotari ... Hollandus haereditati
    bonorum Łukom ... in vim calculi quanto et praecedente actum ... in fundo non reperitur
  why: The Tribunal's reasoning about the burnt holding. The settler is "Hollandus Joannes", the settler Jan (your
    "Joannis", translated "the olęder of Jan"). "Although" Chełmski, "heir" of Łukom, shelters behind the first
    decree, which seems to leave the settler "to him", a surveyor draws only "the boundary lines of the parties"
    ("ductus partium"; your "praesentium" three times) and marks houses "geographice tantum", by position only.
    The first decree had assumed that the settler would "fall to the estate of Łukom" by the line; in fact he "is
    not found" on that side ("non reperitur"; your "nam reperitur").
  grade: fact
  source: changes
- doc: app53170koningr153
  lang: la
  was: idcirco paenibili adinvento ... post decretam invocavit ... sine immisione continuet et explicat ... qua
    sui officium in solutione
  now: idcirco punibili adinvento ... post Dominicam Invocavit ... sine intermissione continuet et expleat ... qua
    sui officialem in solutione
  why: Górski's punishment. He is to present himself at the tower of Radziejów castle on the Monday after Invocavit
    Sunday of the coming year ("post Dominicam Invocavit"; your "post decretam invocavit"), having been "found punishable"
    ("punibili"), and to "continue and complete" his week there "without a break" ("sine intermissione continuet
    et expleat"). Prusimski may pay the bonds for him, "as his officer" ("qua sui officialem"; your "officium").
  grade: fact
  source: changes
- doc: app53170koningr153
  lang: la
  was: in Castrensis Radziejoviensis omnes ... totumque continuum cassatis ... ex re illata cen toties ... Gzowski
    tutorem ejusdem conventus
  now: in Castro Radziejoviensi omnes ... totumque Conventum cassatis ... ex re illatae contra toties ... Gzowski
    nomine ejusdem conventus
  why: The convent of Ląd. The second citation was issued "at the castle of Radziejów" ("in Castro Radziejoviensi"),
    not in a court of that name; Prusimski cites the abbot "and the whole convent" ("totumque Conventum"; your "continuum");
    Prusimski's claim against the convent is "on account of the manifest lodged against the decree" ("contra"; your
    "cen", which you left unread in the English); and Ignacy Gzowski withdrew the manifest "in the name of" the
    convent ("nomine"), where your text made him its "tutor", translated "guardian".
  grade: fact
  source: changes

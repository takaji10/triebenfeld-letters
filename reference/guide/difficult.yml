  was: Quatenus [T/S?]a Penam ... per Se Citt~ pro se Actt~ ad Erranium[?] ... Leves procescumque[?] [?]e[i?]per
    se Actt~
  now: Quatenus Tu Penam ... per Te Citt~ pro se Actt~ ad Aerarium ... Leves processumque super se Actt~
  why: 'The citation of 15 May 1783 (leaf 128): "Leves" is a verb. Prusimski asks that Chełmski LIFT from him the
    penalty of fourteen marks and that the process obtained against him in the register of penalties be quashed;
    your English had "minor processes". The treasury is "Aerarium".'
  grade: fact
  source: changes
- doc: app53170koningr119
  lang: la
  was: 1783, 1784
  now: see the dates on each document
  why: 'Dates. On the pages: 18 March 1783 (the search and, under the same heading, Prusimski''s citation), 22 May
    1783, 15 September 1784. Inferred: the two reports on leaves 62 to 63, March 1783 (the citations are of 10 March;
    the next heading is of 18 March); the report on leaf 131, May 1783; Prusimski''s protest on leaf 304 verso,
    October 1783: the land court''s decree of that sitting (53/6/0/-/47) cites it, and leaf 316 is headed 3 November
    1783.'
  grade: fact
  source: changes
- doc: app53170koningr119
  lang: la
  was: (not transcribed)
  now: (not built)
  why: 'Seven of your photographs show entries you did not transcribe: 144 (your note: Bronikowski and Prusimski),
    320 (a receipt for the "quarta" paid from the royal estate of Smiłowice, brought in for Prusimski, with a text
    in Polish), 321, 348 (the Zakrzewskis cite Prusimski to a sitting on the ground at Trąbczyn, early 1784), 349,
    680 (16 September 1784: Chełmski cites Skórzewski, Stadnicki, Prusimski, Kunegunda Gliszczyńska and others to
    the Tribunal) and 681 (a field decree between Biskupice, Gorzyce, Kotuchów, Łukom, Trąbczyn and others, brought
    in). None is built.'
  grade: fact
  source: changes
- doc: app53170koningr119
  lang: la

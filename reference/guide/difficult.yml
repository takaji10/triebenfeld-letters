  was: pro dubietatis cuius porrectione, Illustrissimus Magnificus Prusimski seu ejus plenipotentiario ... enumeret,
    sui itidem eundem
  now: pro dubietatis cujusdam porrectione, Illustri Magnifico Prusimski seu ejus plenipotentiario ... enumeret,
    seu itidem eundem
  why: 'Who pays whom. Orłowski, the boundary chamberlain of Dobrzyń whom Chełmski had engaged, is sentenced to
    pay Prusimski. Your English had Prusimski paying: "the Most Honourable Prusimski or his plenipotentiary shall
    pay a double principal surety bond". The scan has the dative, "Illri Mgfco Prusimski seu ejus plenipotentiario":
    to Prusimski or his plenipotentiary. And what Orłowski is punished for is raising "a certain doubt" ("cujusdam")
    about the Tribunal''s line.'

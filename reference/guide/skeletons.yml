  dating:
  - latin: Feria + number + post/ante + feast (Feria Quinta post Dominicam Cantate proxima; Feria Sexta post Cineres
      proxima; Feria Tertia post Dominicam Exaudi proxima)
    english: Weekday (Feria Secunda = Monday, Tertia = Tuesday, Quarta = Wednesday, Quinta = Thursday, Sexta = Friday;
      Sabbatho = Saturday) after / before a named feast or Sunday of the church year.
    docs: app53170koningr119-5, app53170koningr115-2, app53170koningr118-5
    count: almost every entry
  - latin: in Vigilia Festi ... / pridie Festi ... / Ipso Die Festi ... / in crastino Festi ...
    english: on the eve of / the day before / on the feast day itself / the day after the feast.
    docs: app53170koningr118-14, app53170koningr115-5, app53170koningr118-4, app536040-1
    count: about 12
  - latin: Die scilicet Decima Quinta Mensis Septembris Anno Domini 1784  /  Die 14 Mensis Martii  /  Anno Domini
      Millesimo Septingentesimo Octuagesimo Tertio
    english: namely the 15th day of September 1784, with numerals as words, digits or ordinal contractions (1778uo,
      1783tio, 8bris = October).
    docs: app53170koningr119-8, app53170koningr120-1, app53170koningr119-1
    count: very common
  - latin: post Dominicam Reminiscere / Laetare / Judica / Invocavit / Cantate / Exaudi / Sexagesimae / Ramis Palmarum
      Quadragesimalem proxima
    english: after the Sunday named from its first word in the Latin Mass (Reminiscere = 2nd Sunday in Lent; Laetare
      = 4th; Judica = 5th; Cantate and Exaudi = after Easter).
    docs: app53170koningr119-3, app53170koningr116-8, app53170koningr117-2
    count: about 20
  - latin: die hodierna / die hesterna / Actum hodiernum praecedente
    english: today / yesterday / (the day) preceding the present act.
    docs: app53170koningr119-4, app53170koningr119-5
    count: common in reports
  closings:
  - latin: posuisse et reliquisse / posuisse et notificato reliquisse
    english: (he) put it and left it / put it and left it notified.
    docs: app53170koningr117-1, app53170koningr118-14
    count: about 29
  - latin: super mensa hippocaustorum praesente Matre familias / Economo / Scriba Proventuali / Virgine / Ancilla
    english: on the table of the heated room, in the presence of the mother of the household / steward / revenue
      clerk / maid / servant girl.
    docs: app53170koningr117-8, app53170koningr118-14, app53170koningr118-10
    count: about 27
  - latin: Salvis de Jure Salvandis / Salvis Salvandis
    english: saving what is to be saved in law.
    docs: app53170koningr117-3, app53170koningr118-17, app53170koningr117-12
    count: about 10
  - latin: De quo praesens relatio / de quo Officium praesens fecit fidem facitque praesentibus / publicam facit
      fidem
    english: of which the present report / the present office made / makes (public) faith.
    docs: app534062-1, app53150kaliszgr424-1, app53170koningr119-8
    count: about 10
  - latin: ręką trzymaną
    english: (signed) with his hand held (guided).
    docs: app5321pyzdrygr75-1
    count: '1'
  - latin: mp / manupropria / mppa
    english: by his own hand (manu propria).
    docs: app53170koningr115-9, app53150kaliszgr424-1, app53170koningr116-11
    count: very common
  - latin: prout Copia in productis / in Productis
    english: as the copy is in the filed papers.
    docs: app53170koningr118-4, app53170koningr116-1
    count: about 50
  dockets:
  - latin: Super Manifestationem Antonii Prusimski Starosti Niesczevicensis
    english: 'Docket: on the protest of Antoni Prusimski, Starost of Niszczewice. These are added at the head or
      foot of a protest entry, to say which protest is meant.'
    docs: app53170koningr117-3, app53170koningr118-3
    count: about 6
  - latin: Super requisitionem ...  Spatii manupropria
    english: 'Docket: on the request of ... (for a space/interval), own hand.'
    docs: app53170koningr118-19
    count: few
  - latin: Videatur hoc loco ...
    english: Let it be seen at this place (a pointer to a paper kept in the filed bundle).
    docs: app53170koningr115-1, app53170koningr115-3, app53170koningr118-1
    count: about 64
  - latin: Videatur Continuatio sub No 22do / Continuatio ex No 26to
    english: See the continuation under No. 22 / continuation from No. 26 (in the numbered entries).
    docs: app536047-1
    count: few
  sitting_headings:
  - latin: Actum in Conin Feria ... (date)
    english: The day's sitting heading, written once. The entries that follow without their own Actum line belong
      to the same sitting and are dated by it (inference from the ordering of the entries and from entries that
      restate the date); a new Actum begins a new sitting.
    docs: app53170koningr117-1, app53170koningr117-2 (two sittings), app53170koningr119-5, app53170koningr118-4
    count: about 60
  - latin: Actum in Castro Calissiensi ... / Actum in Fundo Bonorum ... Curiaque ibidem sitta
    english: 'Heading naming another place of the act: the seat of the municipal court of Kalisz ("in Castro"), or on the disputed ground.'
    docs: app53150kaliszgr424-1, app5320pozgr1181-1, app53170koningr153-1
    count: few
  caveat: Counts are rough greps over the Konin, Kalisz, Pyzdry, Poznań and loose court-book corpora in units/;
    the translations were consulted for app53170koningr117-1 only.

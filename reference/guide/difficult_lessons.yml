- name: Numbers, dates and sums
  count: 20
  lesson: Dates are given by feast days and weekdays (Monday before St Vitus), months as 7bris to 10bris,
    and sums in imperials, groschen and pfennigs. Resolve a date from the feast, check the year in the
    sitting heading, and read every figure again against the line.
  examples:
  - doc: app536017
    was: 1589, day not fixed
    now: 12 June 1589
    why: 'The date is 12 June 1589: the decree of 1775 gives the Monday before St Vitus. The weekday in
      your reading of the sitting''s heading, "feria se[x?]ta", is then "secunda".'
    teaching_point: A date can be found from the feast (Monday before St Vitus) cited in a later decree,
      giving 12 June 1589 and the weekday secunda.
  - doc: app53170koningr118-024
    was: Die scilicet 29 Mensis [????] Anno
    now: Die scilicet 29 Mensis 7bris Anno
    why: 'read on the scan: the scan has "29 Mens 7bris"'
    teaching_point: 'Months are written as 7bris, 8bris, 9bris, 10bris: "7bris" is September, not July.'
  - doc: app536045
    was: c. 1762-1765
    now: 1763 (sitting opened 30 May)
    why: 'The year is 1763: the sitting opened on 30 May 1763 (Monday after Trinity), from the heading
      you transcribed from leaf 638. Your register has "c. 1762-1765".'
    teaching_point: 'The year may be settled by the sitting''s own heading: 1763, opened on the Monday
      after Trinity (30 May).'
  - doc: app536040
    was: '1728'
    now: 26 January 1728; Konin Gr.145, English pages 15, 18, 31, 109, 115, 121
    why: 'Dates: the sitting opened on 26 January 1728; the hearing on the ground was set for 12 April
      1728 (Monday after Misericordia Sunday). The decree of 1775 cites this decree and the testimony
      taken on it, and calls Krzysztof Prusimski the Starost''s grandfather and the Antoni named here
      his uncle.'
    teaching_point: 'The hearing date is given by a church feast: Monday after Misericordia Sunday, 12
      April 1728.'
  - doc: app53170koningr136
    was: 'working cattle: 6 of the lord''s ... Lodgers: in all, 6.'
    now: 'working cattle: 8 of the lord''s ... Female lodgers: in all, 8.'
    why: 'Two figures in the count of people: each full farmer of Trąbczyn has 8 of the lord''s working
      cattle (the 4 oxen and 4 horses that follow), not 6; the women lodgers of Trąbczyn are 8 in all,
      not 6.'
    teaching_point: 'Check figures in counts of people and cattle against the clerk''s own line: each
      full farmer had 8, not 6.'
  - doc: app53150kaliszgr414
    was: '1771'
    now: 4 and 9 November 1771
    why: 'Dates by the calendar: the delivery was made on 4 November 1771 and brought to the municipal
      court at Kalisz on 9 November.'
    teaching_point: Delivery and entry may be on different days (4 and 9 November 1771); read both dates
      before reporting one year.
- name: Polish and German words inside the Latin
  count: 318
  lesson: 'Polish passages, names and oaths appear in the middle of Latin text, and their diacritics and
    spacing matter (karze/każe, zmownie, nieważną). Read them as Polish: use a Polish dictionary and the
    clerk''s own spelling, and keep the diacritics consistent.'
  examples:
  - doc: app53170koningr145-001
    was: przeto sąd każe urodzonego Chełmskiego
    now: przeto sąd karze urodzonego Chełmskiego
    why: 'full check against the scan, misread, court: "karze", to the penalty: the court "finds the Honourable
      Chełmski liable to penalty, both for himself and for his official". The transcription had "każe"
      (orders). Check the English'
    teaching_point: 'A single letter in the Polish ruling changes it: "karze" (to the penalty) against
      "każe" (orders).'
  - doc: app53170koningr145-001
    was: żalącego się z mównic z urodzonym Chełmskim czyniąc
    now: żalącego się zmownie z urodzonym Chełmskim czyniąc
    why: 'full check against the scan, misread, fact: "zmownie", in collusion: Prusimski charges the abbey
      with colluding with Chełmski. The transcription had "z mównic" and the English "from the same platform"'
    teaching_point: '"zmownie" (in collusion) is an adverb; the transcription split it into a wrong noun
      phrase.'
  - doc: app53170koningr145-001
    was: przeciwne tym wszystkiem dowodów być nie okazują, i sądowi swemu dowodzą
    now: przeciwne tym wszystkiem dowodom być się okazują, i sądowi swemu dowodzą
    why: 'full check against the scan, misread, court: "się", not "nie": in the court''s reasons, the
      inspection of 1592, Chełmski''s boundary and his corner point "are shown to be contrary to all these
      proofs". The transcription said they are not shown to be. Check the English'
    teaching_point: 'Check negatives in Polish: "się" for "nie" turns the court''s reasoning around.'
  - doc: app53170koningr145-001
    was: i owszem one jako nie prawną i nie woźną prawem samem
    now: i owszem onę jako nieprawną i nieważną prawem samem
    why: 'full check against the scan, misread, court: in the ruling itself: the court, "not regarding"
      the inspection of 1592, "as unable to prejudice the old boundaries or set new ones", sets it aside
      "as unlawful and invalid". The transcription had "nie woźną" (not a bailiff) for "nieważną" (invalid).
      Check the English'
    teaching_point: Polish adjectives run together (nieprawną, nieważną); a reading that splits them into
      "nie prawną" is wrong.
  - doc: app53170koningr145-001
    was: tudziez
    now: tudzież
    why: 'accent: no Polish word as written; the transcription itself writes "tudzież" elsewhere. Not
      compared with the scan'
    teaching_point: Polish diacritics (ż, ś, ź, ó) are restored to the one spelling the transcription
      uses elsewhere (tudzież).
  - doc: app53170koningr118-013
    was: Generosis Petrus Goslewski Nomine
    now: Generosus Petrus Gosławski Nomine
    why: 'read on the scan, full check: the scan has "Gnus" and "Gosławski", as he signs'
    teaching_point: A Polish surname inside the Latin must be read as it is signed (Gosławski), not as
      a Latin word.
- name: Sense of the sentence (the English follows the reading)
  count: 108
  lesson: A misread word often carries through to the English, so the translation reversed who did what
    (uncle for father, condemnation for condescension). After correcting a word, reread the whole clause
    for who acts on whom and whether the English still fits.
  examples:
  - doc: app53170koningr117
    was: Relictae Patrii sui / Relictae viduae Patris sui / substantiam Patrii Sui
    now: Relictae Patrui sui / Relictae viduae Patrui sui / substantiam Patrui Sui
    why: Paweł Prusimski is Antoni's UNCLE, not his father, and Katarzyna, born Rozdrażewska, is the uncle's
      widow. The word is "Patrui" (written "Patruj" on leaf 55, where I looked at it three times); your
      text had "Patrii" or "Patris" sixteen times beside "Patruum" and "Patruo", and your English "father"
      fifteen times. I corrected all of them on that ground; I did not look at each.
    teaching_point: 'The sense error: Prusimski is the uncle, not the father, so the English had the family
      relations wrong.'
  - doc: app536045
    was: it is not established at what time, in the year 1761, the potash-burners made arrangements concerning
      the Right Honourable Prusimska's potash
    now: the Right Honourable Prusimska, in the year 1761, dispatched the potash-burners with potash,
      prepared at what time is not established
    why: It was Prusimska who sent the potash-burners off with potash in 1761. The earlier sentence had
      the burners making "arrangements concerning" her potash.
    teaching_point: 'Misread syntax produced the opposite of the record: it was Prusimska who sent the
      potash-burners off with potash.'
  - doc: app53150kaliszgr414
    was: the delivery having been formally challenged by name through the records
    now: Which delivery of possession having thus been completed, no one contesting it
    why: The delivery was not challenged. The record says it was completed "nemine impugnante", no one
      contesting it; the earlier reading, "per acta nomine impugnante", was taken as a formal challenge
      entered in the records.
    teaching_point: '"nemine impugnante", no one contesting, was taken as a challenge; the delivery was
      complete and uncontested.'
  - doc: app53170koningr115
    was: the besieging of the innkeeper's goods ... concerning the removal of goods, [carried out] by
      licentious subordinate men
    now: the besieging of the innkeeper's house ... concerning the shooting through of the house, [carried
      out] by licentious subordinate men
    why: '"Gaza" is a hut or house, not goods. On 16 December 1771 armed men besieged the innkeeper''s
      house, and what the messenger lays to Prusimski''s men is the shooting through of the house (the
      loopholes and shot-out windows he has just described), not a removal of goods.'
    teaching_point: '"Gaza" is a hut or house, not goods; a rare vernacular word was guessed from the
      wrong dictionary sense.'
  - doc: app53170koningr120-002
    was: Specifici Di[?]menti Scilicet Contractus Intuita Divenditionis Sylvae [?]cineae cum Spectabili
      Joanne Trachultz Incti et Confe[c?][?]
    now: Specifici Documenti Scilicet Contractus Intuitu Divenditionis Sylvae quercineae cum Spectabili
      Joanne Trachultz Initi et Confecti
    why: 'read on the scan: the scan has "Documenti", "Intuitu", "Sylvae quer|cineae" over the line end
      (an oak wood, as in the protest of 1778) and "Initi et Confecti"'
    teaching_point: Over a line end, "quer|cineae" is oak, not pine; the English had "pine woodland".
  - doc: app53170koningr153-001
    was: ad objectam latere conditionem die undecima mensis 7bris anno 1780 in conditionis in fundo
    now: ad objectam latere condemnationem die undecima mensis 7bris anno 1780 in condescensionis in fundo
    why: 'read on the scan: the scan has "Condonem" with a mark, condemnationem (the same condemnation
      is "objecta sibi condemnatione" at the foot of the page), and "Condnis", condescensionis'
    teaching_point: 'A condemnation obtained on 11 September 1780 is not a condescension: one letter group
      changed who did what to whom.'

  forms: [Nieszczevicen~, Nieszczeviensem, Nieszczeviensis, Niszczeviensis, Nieszczevicensem, Nieszczevensis, Nieszczevicensis, Niszczevicen~, Niesczevicensis, Niesczevicen~, Niesczeviensem, Nieszcevicen~, Nieszczeviensi, Niszczevicensis]
  phrase: "Capitaneus Nieszczevicensis (Starost of Niszczewice)"
  sure: yes
  index: "no: not in the place register"

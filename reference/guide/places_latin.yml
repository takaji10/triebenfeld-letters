# Words that look like place adjectives and are not.
not_places:
- {form: "Castrensis, Castren~ (and cases)", meaning: "of the municipal court (gród): Acta Castrensia"}
- {form: "Terrestris", meaning: "of the land court (ziemski)"}
- {form: "Mensis", meaning: "month (Die 20 Mensis Octobris)"}
- {form: "Cistersiensis, Cystercien~", meaning: "Cistercian (of the order)"}
- {form: "Polonensium (marcarum)", meaning: "Polish (marks)"}
- {form: "Authen~", meaning: "authentic (Litterae Authenticae)"}
- {form: "Audien~, Viden~, Eden~, Inscriben~, Innotescen~, Intervenien~, Competen~, Inciden~, Attinen~, Condescen~", meaning: "participles and gerunds (audiendum, videndum, edendum ...), not places"}
- {form: "Plens~", meaning: "plenipotens, the attorney"}
- {form: "Predecen~, Praedicen~", meaning: "in 'Ensifer Praedicen~' (a sword-bearer's title, 1784): the office's place is not settled; perhaps praedictus"}

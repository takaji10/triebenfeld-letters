# The place dictionary of the reading guide: the Latin forms of place names in the edition's Latin
# court books, with the Polish place. Made 2026-11-26 from reference/guide/places_found.yml
# (pipeline/guide/dictionaries.py), identified by Claude; `sure: no` marks an identification to check.
# A place adjective changes its ending with its case (Calissiensis, -i, -em, -ium, -ibus) and is
# often abbreviated after the stem (Calissien~), so each entry lists every form found.
# Fields: polish (the place), note (what it is and where), forms (as written, the commonest first),
# phrase (how it usually stands), sure.

places:
- polish: Niszczewice
  note: "the starosty (capitaneatus) Antoni Prusimski held; in the Latin only in his title"
  forms: [Nieszczevicen~, Nieszczeviensem, Nieszczeviensis, Niszczeviensis, Nieszczevicensem, Nieszczevensis, Nieszczevicensis, Niszczevicen~, Niesczevicensis, Niesczevicen~, Niesczeviensem, Nieszcevicen~, Nieszczeviensi, Niszczevicensis]
  phrase: "Capitaneus Nieszczevicensis (Starost of Niszczewice)"
  sure: yes

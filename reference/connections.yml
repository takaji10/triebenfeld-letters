# Connections between documents of DIFFERENT holdings, tied by hand
# (docs/CONNECTIONS.md). Within one holding, document-to-document relations
# belong in the holding's rulings.yml (`relations:`), where they have lived
# since 2026-10-03; this file is for the chains that run across the archives.
#
# Read by pipeline/build/connections_site.py, which checks every connection
# and writes site/_data/connections.yml, from which a document's page shows
# its own entry in the "About this document" box: the document's own note and
# links to the other documents of the connection. pipeline/verify_site.py
# checks both sides of every connection.
#
# Each connection:
#   id         a short name, never shown
#   documents  the participants, at least two, each with its own note:
#     uid      the document, as in dataset/letters.json
#     en, de   the note THIS document's page shows: what this document says
#              that the others bear on. Say who says what — "the dossier
#              proposes", "the letter reports" — never "it was". Every
#              figure in it was read in both documents (the rule of
#              literature/links.yml). Where the connection rests on
#              Claude's identification, docs/NEEDS_CONFIRMATION.md lists it
#              until the editor has ruled.
#
# The four connections of the first sweep (2026-11-01, the chains pass;
# docs/CONNECTIONS.md, "The method"): the donation dossier against the
# letter that reports its gift's yields, the lost privilege of 1746 and its
# two witnesses, the two registers that count the same villages eight years
# apart, and the Commission's resolution kept by two offices. Each rests on
# links the editor has already ruled (the register cluster, Chodyła's six,
# Rostworowski's three) read document against document; awaiting the
# editor's read on the site.

- id: donation-dossier-yields
  documents:
    - uid: ihagrrep7cnr3570-1
      en: >-
        The dossier carries the grant itself: Hoym's proposal of 14 July 1796
        puts before the King the estates confiscated from Prusimski — Kamiono
        and Kulm, the Konin villages (Trąbczyn, Szetlewek, Nowa Wieś, Łazy,
        Osiny, the Laski and the Hauland of Trąbczyn among them) and Brzyce in
        Cujavia — at a value of 120,000 rt and an expected yield of 4 to
        6,000 rt, and the deed of 9 August 1796 grants them.
      de: >-
        Die Akte trägt die Zuweisung selbst: Hoyms Vorschlag vom 14. Juli 1796
        legt dem König die von Prusimski konfiszierten Güter vor — Kamiono und
        Kulm, die Koniner Dörfer (Trąbczyn, Szetlewek, Nowa Wieś, Łazy, Osiny,
        die Laski und der Hauland von Trąbczyn unter ihnen) und Brzyce in
        Kujawien — auf einen Wert von 120.000 rt und einen erwarteten Ertrag
        von 4 bis 6.000 rt, und die Urkunde vom 9. August 1796 weist sie zu.
    - uid: oe1bu9454-103
      en: >-
        The letter reports, three years on, what the same gift brought: by
        March 1799 Kamiono and Kulm yield 6,000 rt, Trąbczyn 8,400, Szetlewek
        1,600 and Brzyce 4,000 — 20,000 together, where the dossier's proposal
        of 1796 had expected 4 to 6,000 from the whole.
      de: >-
        Der Brief meldet, drei Jahre später, was dieselbe Schenkung brachte:
        Im März 1799 tragen Kamiono und Kulm 6.000 rt, Trąbczyn 8.400,
        Szetlewek 1.600 und Brzyce 4.000 — zusammen 20.000, wo der Vorschlag
        der Akte von 1796 von dem Ganzen 4 bis 6.000 erwartet hatte.

- id: privilege-1746-chain
  documents:
    - uid: app53170koningr145-1
      en: >-
        The boundary decree attests the Hollanders' settlement on the Trąbczyn
        woods "as the rights granted them in 1746 attest". The privilege
        itself does not survive; with the inspection of 1754 this decree is
        the earliest surviving witness of it.
      de: >-
        Das Grenzdekret bezeugt die Ansiedlung der Holländer auf den
        Trąbczyner Wäldern „wie die ihnen 1746 verliehenen Rechte bezeugen".
        Das Privileg selbst ist nicht erhalten; mit der Besichtigung von 1754
        ist dieses Dekret der früheste erhaltene Zeuge davon.
    - uid: app539680783-1
      en: >-
        The summons names who granted that privilege: "Paweł z Kolna
        Prusiński" and his wife Katarzyna z Rozdrażewskich. It pleads the
        later contract of 18 May 1805, made between Prince Hohenlohe and
        fourteen colonists of the gmina of Trąbczyn before his patrimonial
        court at Zagórów, whose grazing and gathering rights in the Studzianka
        woods the suit defends.
      de: >-
        Die Vorladung nennt, wer jenes Privileg verlieh: „Paweł z Kolna
        Prusiński" und seine Frau Katarzyna z Rozdrażewskich. Sie beruft sich
        auf den späteren Vertrag vom 18. Mai 1805, geschlossen zwischen dem
        Fürsten Hohenlohe und vierzehn Kolonisten der Gmina Trąbczyn vor
        seinem Patrimonialgericht zu Zagórów, dessen Weide- und Sammelrechte
        in den Studziankaer Wäldern der Prozess verteidigt.

- id: two-counts-trabczyn
  documents:
    - uid: app53640kalisztab21-1
      en: >-
        The hearth-tax register of the Kalisz voivodeship, the Midsummer
        instalment of 1789, counts the estate's villages in money: Trąpczyn
        80 zł, Łazy 12 zł 15 gr, Nowa Wieś 12 zł 15 gr, the Olędry
        Trąbczyńskie 35 zł and the Olędry Lusnie 35 zł.
      de: >-
        Das Register der Herdsteuer der Woiwodschaft Kalisch, die Johannisrate
        von 1789, zählt die Dörfer des Gutes in Geld: Trąpczyn 80 zł, Łazy
        12 zł 15 gr, Nowa Wieś 12 zł 15 gr, die Olędry Trąbczyńskie 35 zł und
        die Olędry Lusnie 35 zł.
    - uid: agad1169011745-1
      en: >-
        The General Directory's house-and-population register (the pages carry
        no date; the archive dates the volume 1797) counts the same villages
        in houses and people: "Haul. Lazy." 5 houses and 42 people — a row an earlier note took to be probably the Łazińskie Olędry, not the
        village of Łazy it appears beside —, the Hauland of Trąpczyn 34 houses
        and 271 people, Stara Huta of Trąpczyn 2 houses. The two registers,
        eight years apart, count the same ground twice — hearth money in 1789,
        houses and people in 1797.
      de: >-
        Das Häuser- und Einwohnerregister des Generaldirektoriums (die Seiten
        tragen kein Datum; das Archiv datiert den Band auf 1797) zählt
        dieselben Dörfer in Häusern und Menschen: „Haul. Lazy." 5 Häuser und
        42 Menschen — eine Zeile, die eine frühere Anmerkung für
        wahrscheinlich die Łazińskie Olędry hielt, nicht für das Dorf Łazy —,
        die Hauländerei von Trąpczyn 34 Häuser und 271 Menschen, Stara Huta
        von Trąpczyn 2 Häuser. Die beiden Register, acht Jahre auseinander,
        zählen denselben Grund zweimal — Herdgeld 1789, Häuser und Menschen
        1797.

- id: dabska-resolution-two-offices
  documents:
    - uid: agad11740273-1
      en: >-
        The draft of the Commission's resolution of 21 July 1807, drawn up at
        Dresden, extends the Emperor's decree given at Finckenstein for
        Wybicki to the cases of Michalina Dąbska, General Niemojewski and
        Wichrowski, so that the estates confiscated by the former Prussian
        government return to their rightful owners.
      de: >-
        Der Entwurf der Resolution der Kommission vom 21. Juli 1807, in
        Dresden gefertigt, erstreckt das dem Wybicki in Finckenstein gegebenen
        kaiserliche Dekret auf die Fälle von Michalina Dąbska, General
        Niemojewski und Wichrowski, damit die vom früheren preußischen Staat
        konfiszierten Güter an ihre wahren Eigentümer zurückkehren.
    - uid: agad1174016-2
      en: >-
        The register's protocol of the same day carries the same resolution,
        signed by Małachowski as President and Łuszczewski as General
        Secretary — the same decision as the file's draft, kept by two offices
        of the Commission.
      de: >-
        Das Protokoll des Registers desselben Tages trägt dieselbe Resolution,
        unterschrieben von Małachowski als Präsidenten und Łuszczewski als
        Generalsekretär — derselbe Beschluss wie der Entwurf der Akte, von
        zwei Stellen der Kommission verwahrt.

# The three connections of I. HA GR, Rep. 7 C, Nr. 3067 (2026-11-19, at the
# editor's word: "what other connections can you make to the other
# holdings?"). The candidates read whole by a Sonnet reader, the quotes
# checked by Claude against both texts. "Prudzinski" of the promemoria is
# Antoni Prusimski: the editor's identification (2026-11-19). Wybicki and
# Niemoiewski of the promemoria are the Wybicki and General Niemojewski of
# the restitution of 1807: Claude's identification, listed in
# NEEDS_CONFIRMATION until the editor rules.

- id: goldbeck-confiscated-estates-disposed
  documents:
    - uid: ihagrrep7cnr3067-1
      en: >-
        Goldbeck advises the King that, whatever pardon is granted, the
        confiscation of the rebels who had left the country should stand,
        "da besonders über die eingezogenen Güter größtentheils schon
        disponirt ist" — most of the confiscated estates had already been
        disposed of. Half a year earlier he had himself, with Hoym, laid
        before the King the deeds granting such estates to seven officers;
        the Prince of Hohenlohe-Ingelfingen's grant was made up of the
        estates taken from Prusimski, whom the promemoria names, written
        "Prudzinski", among the ringleaders who fled.
      de: >-
        Goldbeck rät dem König, bei jeder Begnadigung die Konfiskation gegen
        die ausgetretenen Rebellen zu belassen, „da besonders über die
        eingezogenen Güter größtentheils schon disponirt ist“. Ein halbes
        Jahr zuvor hatte er selbst mit Hoym dem König die Schenkungsurkunden
        für sieben Offiziere vorgelegt; die des Fürsten zu
        Hohenlohe-Ingelfingen bestand aus den Gütern Prusimskis, den die
        Promemoria, geschrieben „Prudzinski“, unter den geflohenen
        Rädelsführern nennt.
    - uid: ihagrrep7cnr3570-1
      en: >-
        The dossier is the disposal the Grand Chancellor refers to six months
        later: Hoym proposes the estates confiscated from "the chief
        insurgent" Anton von Prusimski for the Prince of Hohenlohe-Ingelfingen,
        and on 9 and 20 August 1796 Goldbeck and Hoym lay the deeds of gift
        for seven officers before the King. In his promemoria of 16 February
        1797 Goldbeck advises that the confiscation of the fled rebels stand,
        since most of the confiscated estates had already been disposed of,
        and names Prusimski, written "Prudzinski", among them.
      de: >-
        Die Akte ist die Verfügung, auf die sich der Großkanzler ein halbes
        Jahr später beruft: Hoym schlägt die dem „Haupt Insurgenten“ Anton
        von Prusimski konfiszierten Güter für den Fürsten zu
        Hohenlohe-Ingelfingen vor, und am 9. und 20. August 1796 legen
        Goldbeck und Hoym dem König die Schenkungsurkunden für sieben
        Offiziere vor. In seiner Promemoria vom 16. Februar 1797 rät Goldbeck,
        die Konfiskation gegen die geflohenen Rebellen bestehen zu lassen, da
        über die eingezogenen Güter größtenteils schon verfügt sei, und nennt
        Prusimski, geschrieben „Prudzinski“, unter ihnen.

- id: prusimski-venice-goldbeck
  documents:
    - uid: ihagrrep7cnr3067-1
      en: >-
        Five weeks before the promemoria the foreign department had sent
        Goldbeck, with Hoym and Schroetter, the Prussian resident's report
        from Venice on Anton Prusimski, who was staying there. The promemoria
        counts him, written "Prudzinski", among the chief ringleaders who
        "haben sich mit der Flucht gerettet" — had saved themselves by flight.
      de: >-
        Fünf Wochen vor der Promemoria hatte das Auswärtige Departement
        Goldbeck, mit Hoym und Schroetter, den Bericht des preußischen
        Residenten in Venedig über Anton Prusimski mitgeteilt, der sich dort
        aufhielt. Die Promemoria zählt ihn, geschrieben „Prudzinski“, zu den
        Haupträdelsführern, die „sich mit der Flucht gerettet“ haben.
    - uid: ihagrrep7cnr1414-1
      en: >-
        The Grand Chancellor to whom this draft also goes writes to the King
        five weeks later, on 16 February 1797, of the chief ringleaders of
        the rising who had saved themselves by flight, names Prusimski among
        them, written "Prudzinski", and advises that the confiscation of the
        fled rebels' estates stand.
      de: >-
        Der Großkanzler, an den dieser Entwurf auch geht, schreibt dem König
        fünf Wochen später, am 16. Februar 1797, von den Haupträdelsführern
        des Aufstands, die sich mit der Flucht gerettet hatten, nennt
        Prusimski, geschrieben „Prudzinski“, unter ihnen und rät, die
        Konfiskation der Güter der geflohenen Rebellen bestehen zu lassen.

- id: fled-ringleaders-restitution-1807
  documents:
    - uid: ihagrrep7cnr3067-1
      en: >-
        Three of the chief ringleaders the promemoria names as fled, their
        property confiscated — Wybicki, Niemoiewski and Prusimski (written
        "Prudzinski") — are the men whose estates came back in July 1807:
        the Governing Commission extended the Emperor's judgment for Wybicki
        to General Niemojewski, to Wichrowski and to Prusimski's daughter
        Michalina Dąbska, and the Warsaw report of 1818 on her claim cites
        the restitutions to Wybicki and Niemojewski as precedents.
      de: >-
        Drei der Haupträdelsführer, die die Promemoria als geflohen nennt und
        deren Vermögen eingezogen wurde — Wybicki, Niemoiewski und Prusimski
        (geschrieben „Prudzinski“) —, sind die Männer, deren Güter im Juli
        1807 zurückkamen: Die Regierungskommission erstreckte das Urteil des
        Kaisers für Wybicki auf General Niemojewski, auf Wichrowski und auf
        Prusimskis Tochter Michalina Dąbska, und der Warschauer Bericht von
        1818 über ihren Anspruch führt die Rückgaben an Wybicki und
        Niemojewski als Präzedenzfälle an.
    - uid: agad1174016-2
      en: >-
        Ten years earlier, on 16 February 1797, the Grand Chancellor Goldbeck
        had named Wybicki, Niemoiewski and Prusimski (written "Prudzinski")
        to the King among the chief ringleaders of the rising of 1794 who
        had fled, so that only the property they left behind could be
        confiscated. This resolution brings the estates of the second, and
        of the third's daughter, under the judgment given for the first.
      de: >-
        Zehn Jahre zuvor, am 16. Februar 1797, hatte der Großkanzler Goldbeck
        dem König Wybicki, Niemoiewski und Prusimski (geschrieben
        „Prudzinski“) unter den Haupträdelsführern des Aufstands von 1794
        genannt, die geflohen waren, so dass nur ihr zurückgelassenes
        Vermögen eingezogen werden konnte. Diese Resolution stellt die Güter
        des zweiten und die der Tochter des dritten unter das für den ersten
        ergangene Urteil.
    - uid: iiihamdaiiinr12366-1
      en: >-
        The report's precedents go back to one list: the Grand Chancellor
        Goldbeck's promemoria to the King of 16 February 1797 names Wybicki,
        Niemoiewski and Prusimski (written "Prudzinski") among the chief
        ringleaders of the rising who had fled, so that only the property
        they left behind could be confiscated. The report has Prusimski
        leave for Italy in 1794 for his and his wife's health; the
        promemoria counts him among those who fled.
      de: >-
        Die Präzedenzfälle des Berichts gehen auf eine Liste zurück: Die
        Promemoria des Großkanzlers Goldbeck an den König vom 16. Februar
        1797 nennt Wybicki, Niemoiewski und Prusimski (geschrieben
        „Prudzinski“) unter den Haupträdelsführern des Aufstands, die
        geflohen waren, so dass nur ihr zurückgelassenes Vermögen eingezogen
        werden konnte. Der Bericht lässt Prusimski 1794 seiner und seiner
        Frau Gesundheit wegen nach Italien gehen; die Promemoria zählt ihn
        zu den Geflohenen.

# I. HA GR, Rep. 7 C, Nr. 3132 (2026-11-20): three connections proposed by
# Claude in the Connections step, put to the editor on the spot sheet; the
# quotes read in both documents.
- id: prusimski-wife-italy
  documents:
    - uid: ihagrrep7cnr3132-5
      en: >-
        The ministers' report of 1803 says that Prusimski held out hope of his
        return "von Italien aus, wo sich damals angeblich seine auch dort
        verstorbene Ehegattin zur Herstellung ihrer Gesundheit, aufhalten
        mußte". The Prussian resident at Venice had reported in December 1796
        that he came to him ill and broken by her death; his daughter's claim
        of 1818 says he went to Italy in 1794 for his and his wife's health,
        and survived her only a short time - while this report has him
        petitioning from Dresden in January 1803.
      de: >-
        Der Bericht der Minister von 1803 sagt, Prusimski habe „von Italien
        aus, wo sich damals angeblich seine auch dort verstorbene Ehegattin
        zur Herstellung ihrer Gesundheit, aufhalten mußte“, Hoffnung auf seine
        Rückkehr gemacht. Der preußische Resident in Venedig hatte im Dezember
        1796 berichtet, er sei krank und durch ihren Tod gebrochen zu ihm
        gekommen; die Forderung seiner Tochter von 1818 sagt, er sei 1794
        seiner und seiner Frau Gesundheit wegen nach Italien gegangen und
        habe sie nur kurz überlebt - während dieser Bericht ihn im Januar 1803
        von Dresden aus bitten lässt.
    - uid: ihagrrep7cnr1414-2
      en: >-
        The resident reports Prusimski broken "pour la mort de son epouse". The
        ministers' report of 1803 says that his wife had had to stay in Italy
        for her health and died there, and that he had held out hope of his
        return from Italy before the confiscation was decreed; in 1803 he was
        living at Dresden and was allowed home.
      de: >-
        Der Resident berichtet, Prusimski sei „pour la mort de son epouse“
        gebrochen. Der Bericht der Minister von 1803 sagt, seine Frau habe
        sich ihrer Gesundheit wegen in Italien aufhalten müssen und sei dort
        gestorben, und er habe von Italien aus vor der Konfiskation Hoffnung
        auf seine Rückkehr gemacht; 1803 lebte er in Dresden und durfte
        heimkehren.
    - uid: iiihamdaiiinr12366-1
      en: >-
        The claim says that Prusimski went to Italy in 1794 for his and his
        wife's health and survived her "peu de tems". The Prussian ministers'
        report of 30 April 1803 also has his wife in Italy for her health and
        dead there, but has him at his Smiłowice estates in Kuyavia in August
        1794, where the Kuyavian rising was said to have been concluded with
        him, and still alive, petitioning from Dresden, in January 1803.
      de: >-
        Die Forderung sagt, Prusimski sei 1794 seiner und seiner Frau
        Gesundheit wegen nach Italien gegangen und habe sie „peu de tems“
        überlebt. Der Bericht der preußischen Minister vom 30. April 1803 hat
        seine Frau ebenfalls ihrer Gesundheit wegen in Italien und dort
        gestorben, ihn aber im August 1794 auf seinen Smiłowicer Gütern in
        Kujawien, wo der kujawische Aufstand bei ihm zum Abschluss gekommen
        sein soll, und im Januar 1803 noch am Leben, mit einem Gesuch aus
        Dresden.
- id: prusimski-estates-three-donees
  documents:
    - uid: ihagrrep7cnr3132-5
      en: >-
        The report of 1803 names the three generals who were given
        Prusimski's estates: "seine Trampczyner Güter dem Herrn Fürsten von
        Hohenlohe, seine Pawlower Güter dem jetzigen General Major von
        Sanitz, und seine Smilowicer Güter dem General Lieutenant von
        Bischofswerder". In 1807 his daughter names the same three, Hohenlohe,
        Bischoffswerder and Zanitz, when she asks for Trąbczyn, Kamionna,
        Kolno, Pawłów and Pawłówek back.
      de: >-
        Der Bericht von 1803 nennt die drei Generäle, denen Prusimskis Güter
        geschenkt wurden: „seine Trampczyner Güter dem Herrn Fürsten von
        Hohenlohe, seine Pawlower Güter dem jetzigen General Major von
        Sanitz, und seine Smilowicer Güter dem General Lieutenant von
        Bischofswerder“. 1807 nennt seine Tochter dieselben drei, Hohenlohe,
        Bischoffswerder und Zanitz, als sie Trąbczyn, Kamionna, Kolno, Pawłów
        und Pawłówek zurückverlangt.
    - uid: agad11740273-2
      en: >-
        The petition names the estates "Oycu memu na rzecz Generałów Pruskich,
        Xięcia de Hohenlo[h]e, Bischoffswerder i Zanitz skonfiskowanych". The
        Prussian ministers' report of 1803 says which went to whom: the
        Trąbczyn estates to the Prince of Hohenlohe, the Pawłów estates to
        General von Sanitz, the Smiłowice estates to General von
        Bischofswerder.
      de: >-
        Die Bittschrift nennt die Güter „Oycu memu na rzecz Generałów
        Pruskich, Xięcia de Hohenlo[h]e, Bischoffswerder i Zanitz
        skonfiskowanych“. Der Bericht der preußischen Minister von 1803 sagt,
        welche an wen gingen: die Trąbczyner Güter an den Fürsten von
        Hohenlohe, die Pawłower an General von Sanitz, die Smiłowicer an
        General von Bischofswerder.
- id: goldbeck-confiscation-stands
  documents:
    - uid: ihagrrep7cnr3132-5
      en: >-
        Six years after his promemoria of 1797, Goldbeck again advises mercy
        and again keeps the confiscation out of it: the two petitioners have
        been punished "durch die Confiscation ihres Vermögens, wobey es
        unabänderlich verbleiben muß", and may be allowed home.
      de: >-
        Sechs Jahre nach seiner Promemoria von 1797 rät Goldbeck erneut zur
        Gnade und hält die Konfiskation erneut heraus: Die beiden Supplikanten
        seien „durch die Confiscation ihres Vermögens, wobey es unabänderlich
        verbleiben muß“, bestraft und könnten heimkehren.
    - uid: ihagrrep7cnr3067-1
      en: >-
        The confiscation of the fled ringleaders, which Goldbeck advises here
        should stand, is the one he and Haugwitz declare unalterable in 1803,
        when the King allows Prusimski, one of those ringleaders, to return
        home.
      de: >-
        Die Konfiskation gegen die geflohenen Rädelsführer, die Goldbeck hier
        bestehen lassen will, erklären er und Haugwitz 1803 für unabänderlich,
        als der König Prusimski, einem dieser Rädelsführer, die Heimkehr
        erlaubt.
# Proposed 2026-11-21 with I. HA GR, Rep. 7 C, Nr. 421 (Claude); kept at the
# editor's word the same day (spot sheet d3). The figures differ: Chełmski's petition and
# suit give the loan as 12,000 ducats, Triebenfeld's memorandum of 1815 the
# pledge as 36,000 (NEEDS_CONFIRMATION).
- id: chelmski-suit-against-hohenlohe
  documents:
    - uid: ihagrrep7cnr421-1
      en: >-
        Chełmski writes that he had taken possession of Trąbczyn and Nowa Wieś
        but "müste jedoch solche an den Furst v Hohenlohe Ingelfingen ... nach
        Eröfnung des Revirions Erkenntnißes räumen": the suit against the
        Prince that Triebenfeld followed for the Prince in 1798 and 1799; in
        March 1799 he reported that Chełmski had lost in the second instance.
      de: >-
        Chełmski schreibt, er habe sich in den Besitz von Trąmpczyn und Nowa
        Wieś gesetzt, „müste jedoch solche an den Furst v Hohenlohe
        Ingelfingen ... nach Eröfnung des Revirions Erkenntnißes räumen“: der
        Prozess gegen den Fürsten, den Triebenfeld 1798 und 1799 für den
        Fürsten verfolgte; im März 1799 meldete er, Chełmski habe in zweiter
        Instanz verloren.
    - uid: ihagrrep7cnr421-4
      en: >-
        Mondro distinguishes "die von dem von Chełmski gegen den Fürsten von
        Hohenlohe, als nunmehrigen Eigenthümer der dem Prusimski confiscirten
        Güter Trąmpczyn anfänglich angestellte Klage" from the present suit
        against the Fiscus: the first is the process Triebenfeld's letters to
        the Prince follow.
      de: >-
        Mondro unterscheidet „die von dem von Chełmski gegen den Fürsten von
        Hohenlohe, als nunmehrigen Eigenthümer der dem Prusimski confiscirten
        Güter Trąmpczyn anfänglich angestellte Klage“ von der jetzigen gegen
        den Fiskus: Die erste ist der Prozess, den Triebenfelds Briefe an den
        Fürsten verfolgen.
    - uid: oe1bu9454-75
      en: >-
        "Chełmski hatt noch nicht apellirt": Triebenfeld reports in April 1798
        that Chełmski has not yet appealed. Chełmski's own petition of 1799
        tells his side: he had held Trąbczyn on Prusimski's undertaking and
        had to give it up to the Prince after the judgment of revision.
      de: >-
        „Chełmski hatt noch nicht apellirt“: Triebenfeld meldet im April 1798,
        Chełmski habe noch nicht appelliert. Chełmskis eigene Eingabe von 1799
        erzählt seine Seite: Er hatte Trąmpczyn auf Prusimskis Verschreibung
        besessen und musste es nach dem Revisionserkenntnis dem Fürsten räumen.
    - uid: oe1bu9454-102
      en: >-
        "Chełmski hatt in der 2ten Instanz auch verlohren": Chełmski's petition
        of October 1799 says that after the judgment of revision he had to give
        Trąbczyn up to the Prince and was referred with his claim to the
        Fiscus, which then refused to hear him.
      de: >-
        „Chełmski hatt in der 2ten Instanz auch verlohren“: Chełmskis Eingabe
        vom Oktober 1799 sagt, er habe Trąmpczyn nach dem Revisionserkenntnis
        dem Fürsten räumen müssen und sei mit seiner Forderung an den Fiskus
        verwiesen worden, der ihn dann nicht hörte.
    - uid: oe1bu9454-103
      en: >-
        "Der Chełmskische Proceß ist in zweiter Instanz gewonnen": the suit
        in which, by Chełmski's petition of October 1799, a judgment of
        revision made him give Trąbczyn up to the Prince.
      de: >-
        „Der Chełmskische Proceß ist in zweiter Instanz gewonnen“: der
        Prozess, in dem nach Chełmskis Eingabe vom Oktober 1799 ein
        Revisionserkenntnis ihn zwang, Trąmpczyn dem Fürsten zu räumen.
    - uid: oe1bu9454-286
      en: >-
        The memorandum says Prusimski had pledged the Trąbczyn estates "an den
        v. Chełmski für 36000 Ducaten". Chełmski's own petition and suit of
        1799 give the loan as 12,000 ducats, lent in June 1794 against
        Prusimski's undertaking that he might hold the estates until repaid.
      de: >-
        Die Promemoria sagt, Prusimski habe die Trąbczyner Güter „an den v.
        Chełmski für 36000 Ducaten“ verpfändet. Chełmskis eigene Eingabe und
        Klage von 1799 nennen das Darlehen mit 12.000 Dukaten, im Juni 1794
        gegen Prusimskis Verschreibung gegeben, er dürfe die Güter bis zur
        Rückzahlung besitzen.

# The merchant Tracholz's transfer of 1768 and the suit that rests on it
# (the editor asked for the new Pyzdry Gr.75 entry to be linked to the other
# sources, 2026-11-26). The editor ruled the same day that the "Trachultz" of
# Konin Gr.120 is Tracholz.
- id: tracholz-transfer-and-chelmski-suit
  documents:
    - uid: app5321pyzdrygr75-1
      en: >-
        The transfer itself: the merchant Jan Tracholz makes over to Chełmski
        his claims against the late Paweł Prusimski, which Chełmski then pursued
        against Antoni Prusimski in the suits of 1777 to 1786.
      de: >-
        Die Übertragung selbst: Der Kaufmann Jan Tracholz tritt Chełmski seine
        Forderungen an den verstorbenen Paweł Prusimski ab, die Chełmski dann
        in den Prozessen von 1777 bis 1786 gegen Antoni Prusimski verfolgte.
    - uid: app536046-2
      en: >-
        The decree of the Konin land court of October 1777 cites the transfer
        as acknowledged before the Pyzdry court on the Wednesday before the
        Nativity of the Virgin 1768, the date this entry lacks, and orders a
        hearing on the ground.
      de: >-
        Das Dekret des Landgerichts Konin vom Oktober 1777 nennt die
        Übertragung als am Mittwoch vor Mariä Geburt 1768 vor dem Gericht in
        Pyzdry anerkannt, das Datum, das diesem Eintrag fehlt, und ordnet einen
        Ortstermin an.
    - uid: app53170koningr117-3
      en: >-
        Antoni Prusimski's protest of March 1778 against Chełmski's claim
        bought from Tracholz, which he says rests on a contract of 1744 for
        oak timber with his uncle Paweł; the transfer protested against is
        the one made in this entry.
      de: >-
        Antoni Prusimskis Protest vom März 1778 gegen Chełmskis von Tracholz
        gekaufte Forderung, die nach seinen Worten auf einem Vertrag von 1744
        über Eichenholz mit seinem Onkel Paweł beruht; die Übertragung, gegen
        die er protestiert, ist die dieses Eintrags.
    - uid: app53170koningr117-8
      en: >-
        The messenger's report of 15 April 1778 on the royal citation before
        the Crown Tribunal over the claim Chełmski bought from Tracholz, whom
        it already calls "olim", the late.
      de: >-
        Der Bericht des Boten vom 15. April 1778 über die königliche Ladung
        vor das Krontribunal wegen der von Tracholz gekauften Forderung
        Chełmskis; er nennt Tracholz schon „olim“, den Verstorbenen.
    - uid: app53170koningr118-14
      en: >-
        The royal citation of 1781 to the sitting on the ground at Grab:
        Chełmski claims payment, with interest, of the sum that the merchant
        Tracholz made over to him.
      de: >-
        Die königliche Ladung von 1781 zum Ortstermin in Grab: Chełmski fordert
        die Zahlung der Summe, die der Kaufmann Tracholz ihm abgetreten hat,
        mit Zinsen.
    - uid: app53170koningr120-2
      en: >-
        The citation of October 1786 requires Antoni Prusimski to produce the
        contract with the merchant Jan Tracholz for the sale of an oak wood,
        from which Chełmski's claim comes; the document writes the name
        "Trachultz".
      de: >-
        Die Ladung vom Oktober 1786 verlangt von Antoni Prusimski die Vorlage
        des Vertrags mit dem Kaufmann Jan Tracholz über den Verkauf eines
        Eichenwaldes, aus dem Chełmskis Forderung stammt; das Dokument
        schreibt den Namen „Trachultz“.

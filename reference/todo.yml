- id: t036-rule-what-remains-from
  group: The literature (begun 2026-10-19)
  title: Rule what remains from the second set of books
  kind: question
  text: 'The second set of books (Breyer 1935 and 1938, Żychliński 1885 and 1891, the PSB entry) raised
    several questions. Michalina Prusimska''s marriage (settled: August 1810), her mother''s death (the
    edition keeps to the dispatch of 1796) and Włodzimierz Miączyński''s death (18 December 1879) are
    settled. Still open: who held Trąbczyn between 1809 and 1879 (Żychliński has Michalina pass it to
    Stanisław, then to his son Mieczysław, then to Włodzimierz; the edition has Michalina until 1851,
    then Włodzimierz); whether K. G. von Weigel of Hennersdorf, owner of Zagórów from 1828, is the banker
    Carl Ferdinand Weigel of Breslau or someone of his family; and Claude''s unaccepted identifications
    of Wieniec and Świątniki.'
  options:
  - Keep the edition's line (Michalina to 1851, then Włodzimierz)
  - Follow Żychliński's line
  - Weigel of Hennersdorf is the banker Weigel
  - Weigel of Hennersdorf is another man
  links:
  - type: person
    slug: prusimska
    label: Michalina Prusimska
  - type: person
    slug: weigel
    label: Weigel
  - type: person
    slug: miaczynski-wlodzimierz
    label: Włodzimierz Miączyński

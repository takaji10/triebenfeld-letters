# House forms for the English: replacements applied to every published
# translation and English summary, after the model and before the site.
#
# Applied by pipeline/translate/english_forms.py, which publish_translations.py
# and summarise.py call when they write, so a re-publish from the cache keeps
# them. Run it with --apply to bring the published files into line by hand.
#
# Only replacements that are mechanical belong here: a form that means one
# thing wherever the pattern can match it. Anything that needs the sentence
# read goes to the review sheet, not here.
#
# Fields:
#   id        a name for the report
#   pattern   a regular expression (Python), case-sensitive
#   replace   the replacement; \1, \2 for groups
#   months    instead of `replace`: group 1 looked up in this table
#   names     instead of `replace`: group 1 looked up in this table (a
#             spelling and the settled form of the name)
#   capitalise  instead of `replace`: this word, inside the match, capitalised
#   word      instead of `replace`: a group 1 (the figure), group 2 (the space)
#             and the abbreviation, replaced by this word. An abbreviation's
#             own full stop is dropped, unless it also ends the sentence.
#   why       the reason
#
# Added 2026-10-02, from building the glossary: the English kept the money
# abbreviations of the German in a dozen forms (rt, rtl, rttl, gg, g., fl.),
# and the glossary, which marks the full forms, could not explain them.

rules:

- id: friedrich-dor
  pattern: "\\b(?!Friedrich d'or)(?:Friedrichs?|Fr|fr|F|f)\\.? ?d['’]or\\b"
  replace: "Friedrich d'or"
  why: >-
    The gold coin, written Fr. d'or, fr d'or, f. d'or and Friedrichsd'or in the
    German and carried over as written. One form, the coin's name.

- id: reichsthaler
  pattern: "(\\d\\.?|/m)( ?)(?:rt|rtl|rtt|rttl|rth|rtr|rthl|Rt|Rtl|Rthlr|rthlr)(?=\\b)"
  replace: "\\1\\2Rthl"
  why: >-
    The termbase's form for the Reichsthaler is Rthl (translation_glossary.yml,
    currency). After a figure, or after "/m" (thousands: 50/m rt), every other
    abbreviation of it becomes Rthl. Its full stop, where there is one, stays.

- id: groschen
  pattern: "(\\d\\.?)( ?)(?:ggr|ggl|gg|gl|gr|g)\\.?(?=[\\s,;:)\\]]|$)"
  word: Groschen
  why: >-
    The Groschen, a twenty-fourth of a thaler, abbreviated gg (gute Groschen),
    ggr, gl, gr or g after a figure. Written out, as the termbase renders it.

- id: pfennig
  pattern: "(\\d\\.?)( ?)(?:pfg|pf|Pf)\\.?(?=[\\s,;:)\\]]|$)"
  word: Pfennig
  why: >-
    The Pfennig, a twelfth of a Groschen, abbreviated pf after a figure.

- id: pfennig-d
  pattern: "(Groschen \\d[\\d /]*?)( ?)d\\.?(?=[\\s,;:)\\]]|$)"
  word: Pfennig
  why: >-
    d. (denarius) for the Pfennig, but only in the third place of a sum, after
    a figure of Groschen, where it cannot be anything else.

- id: gulden
  pattern: "(\\d)( ?)fl\\.?(?=[\\s,;:)\\]]|$)"
  word: gulden
  why: >-
    The Austrian gulden of the Vienna letters, abbreviated fl. (florin) after a
    figure. The termbase renders it gulden.

- id: kreuzer
  pattern: "(gulden \\d+)( ?)x(?=[\\s,;:.)\\]]|$)"
  word: kreuzer
  why: >-
    x for the kreuzer, a sixtieth of a gulden, after a figure of gulden (1 fl.
    30 x).

- id: months-by-number
  pattern: "\\b(7|8|9|X|10)\\.? ?br\\b\\.?"
  months: {"7": September, "8": October, "9": November, "X": December, "10": December}
  why: >-
    7br., 8br., 9br., Xbr. for September to December, left as written in four
    dates of the English ("the 12th of 8br 1814"). The month's name.

- id: per-cent
  pattern: "(\\d)( ?)p[Cc]t\\b\\.?"
  word: per cent
  why: >-
    pct. after a figure, left in five places of the English, where every other
    page says per cent.

- id: government
  pattern: "\\b(?:(South Prussian|Poznań|Posen|Kalisz|Kalisch|Głogów|Glogau|Toruń|Thorn|Brzeg|Brieg|Wrocław|Breslau|Płock|Warsaw) government|government (at|in|of) (Poznań|Posen|Kalisz|Kalisch|Głogów|Glogau|Toruń|Thorn|Brzeg|Brieg|Wrocław|Breslau|Płock|Warsaw))\\b"
  capitalise: government
  why: >-
    The provincial Regierung, named by its seat, is an institution: the
    termbase renders it Government, capitalised (editor, 2026-10-02). Fifteen
    places said "the government at Kalisz" or "the Poznań government". The
    political sense (the Prussian government, a democratic government) has no
    seat after it and is left alone.

# Names (2026-10-03): spellings of people and places carried over from the
# manuscripts, each now a recorded variant in reference/people.yml or
# places.yml. The registers make the translator use the settled form from
# now on; these bring the English already published into line.

- id: name-prusimski
  pattern: "\\b(?:Prussiemski|Prussimski|Prussimsky|Prusimsky)\\b"
  replace: "Prusimski"
  why: >-
    Antoni Prusimski, written Prussiemski, Prussimski, Prussimsky and Prusimsky
    in the French letter of 1815 and elsewhere, and carried over as written. The
    edition's form (editor, 2026-10-03; reference/people.yml, prusimski).

- id: name-miaczynska
  pattern: "\\b(?:Moscinska|Moszynska|Mi(?:a|ą|e|ę)czy(?:n|ń)ska)(?<!Miączyńska)\\b"
  replace: "Miączyńska"
  why: >-
    Michalina Prusimska's second married name, which the letters write Moscinska
    and Moszynska (the writers' errors, reference/people.yml, prusimska) and one
    document Miaczynska. Every spelling of the name (Mięczynska, Mieczynska,
    Miaczynska, ...) is written Miączyńska (editor, 2026-10-03).

- id: name-miaczynska-madame
  pattern: "\\bMadame Mi(?:a|ą|e|ę)czy(?:n|ń)sk(?:i|y|ÿ)\\b"
  replace: "Madame Miączyńska"
  why: >-
    The French letter of 1815 (12765, 6) calls her "Madame Mięczynsky", the
    masculine form; in the English she is Madame Miączyńska (editor,
    2026-10-03).

- id: name-miaczynski
  pattern: "(?<!Madame )\\b(?:Moscinski|Moszynski|Mi(?:a|ą|e|ę)czy(?:n|ń)sk(?:i|y|ÿ))(?<!Miączyński)\\b"
  replace: "Miączyński"
  why: >-
    Her second husband, Stanisław Miączyński (reference/people.yml, miaczynski),
    written Moscinski, Moszynski and, in French, Mięczynsky. Every spelling of
    the name is written Miączyński (editor, 2026-10-03). "Madame Mięczynsky"
    is she: the rule above.

- id: name-kamionna
  pattern: "\\b(?:Kähmen|Kämen|Kamen|Kamener|Kamienne)\\b"
  replace: "Kamionna"
  why: >-
    The estate of Kamionna (German Kaemen), written Kähmen, Kämen, Kamen,
    Kamener and Kamienne in the German and carried over. Every one in the
    English names the estate (read 2026-10-03); the verb kamen does not reach
    the English.

- id: name-kamionna-twice
  pattern: "Kamionna(?:,)? or Kamionna"
  replace: "Kamionna"
  why: >-
    The German gives the estate both its names, "Kamiono oder Keemen"; once both
    are standardised the English read "Kamionna or Kamionna" (eleven places).
    One name is enough.

- id: name-kolno
  pattern: "\\b(?:Kollno|Kulmner|Kulm)\\b(?! (?:measure|Hufe|Hufen|Morgen|rods?|Ruthe|Ruthen)\\b)"
  replace: "Kolno"
  why: >-
    The market town of Kolno, which the German calls Kulm (reference/places.yml,
    kolno) and once Kollno. Every Kulm in the published English is Kolno (28,
    read 2026-10-03). Kulm as a measure (the Kulm Hufe) is excepted; a Kulm that
    means Chełmno would need a correction.

- id: name-kolno-twice
  pattern: "Kolno or Kolno"
  replace: "Kolno"
  why: >-
    "Kolno oder Kulm" (14525, 12) once both names are standardised.

- id: place-spellings
  pattern: "\\b(Botkowo?|Brzyzer|Brzyzna|Brzyze|Charlottenbourg|Czischowa|Czyschowa|Czysowa|Gollawia|Grądzin|Grąndzyń|Gratz|Heidelburg|Carlsruhe|Cassel|Karczin|Krotoszin|Mysłowic|Neufchatel|Neustad|Presburg|Przybisław|Ruszynowig|Schweinerne|Szettlewek|Weissenfeld|Wrąbczin|Kálitz|Nowa wieś|Nowa wies|Nova wies|Wieruszew|Gosztiszyn)\\b"
  names:
    "Botkow": "Bątkowo"
    "Botkowo": "Bątkowo"
    "Brzyzer": "Brzyce"
    "Brzyzna": "Brzyce"
    "Brzyze": "Brzyce"
    "Charlottenbourg": "Charlottenburg"
    "Czischowa": "Cieszowa"
    "Czyschowa": "Cieszowa"
    "Czysowa": "Cieszowa"
    "Gollawia": "Goła Wieś"
    "Grądzin": "Grądzyń"
    "Grąndzyń": "Grądzyń"
    "Gratz": "Graz"
    "Heidelburg": "Heidelberg"
    "Carlsruhe": "Karlsruhe"
    "Cassel": "Kassel"
    "Karczin": "Karczyn"
    "Krotoszin": "Krotoszyn"
    "Mysłowic": "Mysłowice"
    "Neufchatel": "Neuchâtel"
    "Neustad": "Neustadt"
    "Presburg": "Pressburg"
    "Przybisław": "Przybysław"
    "Ruszynowig": "Rusinowice"
    "Schweinerne": "Świniary"
    "Szettlewek": "Szetlewek"
    "Weissenfeld": "Weißenfels"
    "Wrąbczin": "Wrąbczyn"
    "Kálitz": "Kalisz"
    "Nowa wieś": "Nowawies"
    "Nowa wies": "Nowawies"
    "Nova wies": "Nowawies"
    "Wieruszew": "Wieruszów"
    "Gosztiszyn": "Gostyszyn"
  why: >-
    Places the manuscripts spell otherwise, carried into the English as written.
    Each is the place of that name in reference/places.yml, where the spelling
    is now a recorded variant (2026-10-03).

- id: person-spellings
  pattern: "\\b(Broniewsky|Kielczewski|Kiełszewski|Landskoy|Merkel|Schenk|Schuckman|Schulemburg|Tismar|Sobolowski|Reppnin|Allbrecht|Maciey|Niedzwiedzki|Niedzwidzki|Konstantin|Stoesel|Bethney|von der Laar|Van der Laar)\\b"
  names:
    "Broniewsky": "Broniewski"
    "Kielczewski": "Kiełczewski"
    "Kiełszewski": "Kiełczewski"
    "Landskoy": "Lanskoy"
    "Merkel": "Merckel"
    "Schenk": "Schenck"
    "Schuckman": "Schuckmann"
    "Schulemburg": "Schulenburg"
    "Tismar": "Tesmar"
    "Sobolowski": "Sobolewski"
    "Reppnin": "Repnin"
    "Allbrecht": "Albrecht"
    "Maciey": "Maciej"
    "Niedzwiedzki": "Niedźwiecki"
    "Niedzwidzki": "Niedźwiecki"
    "Konstantin": "Constantin"
    "Stoesel": "Stössel"
    "Bethney": "Bethusy"
    "von der Laar": "von der Lahr"
    "Van der Laar": "von der Lahr"
  why: >-
    People the manuscripts spell otherwise, carried into the English as written.
    Each is the person of that name in reference/people.yml, where the spelling
    is now a recorded variant (2026-10-03). Pourtalès stays as the writer has it
    in letter 266 ("Pourtalès / not Portalis").

- id: name-prinz-wilhelm
  pattern: "\\bPrinz Wilhelm von Preußen\\b"
  replace: "Prince Wilhelm of Prussia"
  why: >-
    The King's brother, Prince Wilhelm of Prussia (reference/people.yml,
    prinz-wilhelm), whose catalogue name in German had been left standing in
    three letters (64, 195, 247).

- id: editor-names-2026-10-03
  pattern: "\\b(Hussaczinski|Kunckel|Rybbeck|Rybbek|Tarmowo|Dormowe|Klein Althammer|Wrocławek)\\b"
  names:
    "Hussaczinski": "Hussarzewski"
    "Kunckel": "Kunkel"
    "Rybbeck": "Ribbeck"
    "Rybbek": "Ribbeck"
    "Tarmowo": "Tarnowo"
    "Dormowe": "Dormowo"
    "Klein Althammer": "Stara Kuźnia"
    "Wrocławek": "Włocławek"
  why: >-
    The editor's rulings of 2026-10-03: Hussarzewski (9454, 155), Kunkel,
    Ribbeck, Tarnowo, Dormowo; Klein Althammer is Stara Kuźnia, by Bierawa;
    the chapter "zu Wraclawek" (14525, 28) is Włocławek.

- id: name-badkowo
  pattern: "\\b(?:Batkowo|Bądkowo)\\b"
  replace: "Bątkowo"
  why: >-
    The estate in the Radziejów district, formerly of the cathedral chapter of
    Włocławek: Bątkowo in Polish and in the English, Batkowo in German
    (editor, 2026-10-03). The documents write Batkowo and Botkowo.

- id: ecus-reichsthaler
  pattern: "\\bécus\\b"
  replace: "Reichsthaler"
  why: >-
    In French written by Prussians, écus are Thaler: the Prince's French letter
    to Stein of 1815 (12765, 6) counts in them, and the ministry's German note
    in the same file gives the same 55,000 as "55000 rt.". The edition writes
    Reichsthaler (editor, 2026-10-03).

- id: place-accents-2026-10-03
  pattern: "\\b(Blizanow|Swiątniki|Swiątniker)\\b"
  names:
    "Blizanow": "Blizanów"
    "Swiątniki": "Świątniki"
    "Swiątniker": "Świątniki"
  why: >-
    The register now gives the two places their Polish accents, Blizanów and
    Świątniki (editor, 2026-10-03); the English follows.

- id: place-torun
  pattern: "\\bThorn\\b"
  replace: "Toruń"
  why: >-
    Thorn is Toruń, by the house rule that the English uses the Polish name
    (editor, 2026-10-03); the register entry is torun.

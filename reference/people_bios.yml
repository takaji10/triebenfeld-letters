# Who each person on the People page is, in two or three sentences, and when
# they lived. Keyed by the person's slug (reference/people.yml, or the long
# list of vetted names). Written by hand, 2026-10-02.
#
#   life     birth and death years where known. "c." marks an estimate, and
#            "d. 1816" a death known without a birth. A person with no `life`
#            is shown with the years in which this edition's documents name
#            them ("documented 1804-1812"), which the build works out.
#   bio      English. What the documents show the person doing; for a figure
#            known to history, who they were. Nothing here goes beyond the
#            documents and standard reference works, and a doubtful
#            identification says so.
#   bio_de   the same in German.
#
# Dates of historical figures were checked against Wikidata on 2026-10-02.
# Where the edition cannot tell which bearer of a name is meant, no dates are
# given.

triebenfeld:
  life: "b. c. 1760 (estimated), d. 1816"
  bio: Peter Friedrich August von Triebenfeld, Prussian Councillor of War and Forests, managed the South Prussian estates of Hohenlohe-Ingelfingen and held his general power of attorney from 1805. He wrote most of the letters in this edition and stood surety for several of the debts he negotiated. His last letter is dated 31 January 1816, and a note of 13 April 1816 calls him deceased; his year of birth is not recorded and is estimated from his adult children.
  bio_de: Peter Friedrich August von Triebenfeld, preußischer Kriegs- und Forstrat, verwaltete die südpreußischen Güter Hohenlohe-Ingelfingens und besaß seit 1805 dessen Generalvollmacht. Er schrieb die meisten Briefe dieser Edition und verbürgte sich für mehrere der Schulden, die er aushandelte. Sein letzter Brief ist vom 31. Januar 1816, und ein Vermerk vom 13. April 1816 nennt ihn verstorben; sein Geburtsjahr ist nicht überliefert und nach seinen erwachsenen Kindern geschätzt.
hohenlohe:
  life: "1746-1818"
  bio: Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, Prussian general and governor of Wrocław. The Prussian crown granted him estates in South Prussia in 1796 and 1797. He commanded at Jena in 1806, surrendered at Prenzlau and held no further command; he died at Sławięcice in Upper Silesia.
  bio_de: Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, preußischer General und Gouverneur von Breslau. Die preußische Krone verlieh ihm 1796 und 1797 Güter in Südpreußen. Er befehligte 1806 bei Jena, kapitulierte bei Prenzlau und erhielt kein Kommando mehr; er starb in Schlawenschitz in Oberschlesien.
glenck:
  bio: Johann Wilhelm Glenck, building and economy councillor to Hohenlohe-Ingelfingen, managed the South Prussian estates until about 1804 and made the first leases and sales. Triebenfeld, who succeeded him, blamed him for losses on those contracts and accused him of obstructing the later settlement.
  bio_de: Johann Wilhelm Glenck, Bau- und Ökonomierat Hohenlohe-Ingelfingens, verwaltete die südpreußischen Güter bis etwa 1804 und schloss die ersten Pacht- und Kaufverträge. Triebenfeld, sein Nachfolger, lastete ihm Verluste aus diesen Verträgen an und warf ihm vor, die spätere Besiedlung zu behindern.
hardenberg:
  life: "1750-1822"
  bio: Karl August von Hardenberg, Prussian State Chancellor from 1810 and Prussia's chief negotiator at the Congress of Vienna. Triebenfeld petitioned him in 1814 and 1815 for an advance to settle the debts of Hohenlohe-Ingelfingen and for compensation for Trąbczyn.
  bio_de: Karl August von Hardenberg, preußischer Staatskanzler seit 1810 und Preußens führender Unterhändler auf dem Wiener Kongress. Triebenfeld bat ihn 1814 und 1815 um einen Vorschuss zur Regelung der Schulden Hohenlohe-Ingelfingens und um Entschädigung für Trąbczyn.
weigel:
  bio: Carl Ferdinand Weigel, a banker at Wrocław, and one of the two largest creditors on the Silesian estate of Koszęcin. From 1810 Triebenfeld tried to satisfy him and Stössel by transferring the Zagórów estates to them. The letters also speak of "Weigel and son".
  bio_de: Carl Ferdinand Weigel, Bankier in Breslau und einer der beiden größten Gläubiger auf dem schlesischen Gut Koschentin. Seit 1810 versuchte Triebenfeld, ihn und Stössel durch Übertragung der Zagorower Güter zu befriedigen. Die Briefe sprechen auch von „Weigel und Sohn“.
cosmar:
  bio: A medical councillor and executor of the will of Princess Sacken. Under a settlement of 1811 he administered the entailed Silesian estates of Hohenlohe-Ingelfingen for the creditors. Triebenfeld sought his removal at Vienna in 1814 and 1815 and called the settlement his fabrication; a court found against him at first instance in late 1815.
  bio_de: Medizinalrat und Testamentsvollstrecker der Fürstin Sacken. Nach einem Vergleich von 1811 verwaltete er die schlesischen Majoratsgüter Hohenlohe-Ingelfingens für die Gläubiger. Triebenfeld betrieb 1814 und 1815 in Wien seine Absetzung und nannte den Vergleich sein Machwerk; Ende 1815 unterlag er vor Gericht in erster Instanz.
koeckritz:
  life: "1744-1821"
  bio: Karl Leopold von Köckritz, Prussian general and adjutant general to Friedrich Wilhelm III, a close confidant of the King. He supported Hohenlohe-Ingelfingen at court from 1798 and arranged the loan from the fund for military invalids in 1805.
  bio_de: Karl Leopold von Köckritz, preußischer General und Generaladjutant Friedrich Wilhelms III., ein enger Vertrauter des Königs. Er unterstützte Hohenlohe-Ingelfingen seit 1798 bei Hofe und vermittelte 1805 das Darlehen der Invalidenkasse.
honrichs:
  bio: Martin Honrichs bought the estate of Witów in 1803 and later acted as lessee, court-appointed administrator and agent on the Zagórów estates. Triebenfeld accused him of withholding money and selling land on his own authority, and he was arrested more than once between 1809 and 1812.
  bio_de: Martin Honrichs kaufte 1803 das Gut Wittow und war später Pächter, Sequester und Bevollmächtigter auf den Zagorower Gütern. Triebenfeld warf ihm vor, Geld zurückzuhalten und eigenmächtig Land zu verkaufen; zwischen 1809 und 1812 wurde er mehrfach verhaftet.
schenck:
  bio: Judicial burgomaster at Zagórów and justiciary of the patrimonial court of the estates, before which the hereditary leases of 1805 and 1806 were made. He carried out valuations and collected money for Triebenfeld, and in 1815 he asked for a general power of attorney for the Pszczew business.
  bio_de: Justizbürgermeister in Zagorowo und Justitiar des Patrimonialgerichts der Güter, vor dem die Erbpachtverträge von 1805 und 1806 geschlossen wurden. Er nahm Taxen auf und zog für Triebenfeld Gelder ein; 1815 verlangte er eine Generalvollmacht für die Betscher Sache.
amelang:
  life: "1755-1819"
  bio: Karl Ludwig Amelang, a Berlin lawyer and privy councillor, legal agent of Hohenlohe-Ingelfingen in Berlin. He handled the loans of 1804 and 1805 and the lawsuits that followed them.
  bio_de: Karl Ludwig Amelang, Berliner Jurist und Geheimer Rat, Rechtsvertreter Hohenlohe-Ingelfingens in Berlin. Er betreute die Darlehen von 1804 und 1805 und die Prozesse, die daraus folgten.
barbe:
  life: "d. 1815"
  bio: A court councillor in the chancery of the State Chancellor Hardenberg at the Congress of Vienna. He advised Triebenfeld, presented his petitions and lent him money. Triebenfeld reports his death in Paris in late 1815.
  bio_de: Hofrat in der Kanzlei des Staatskanzlers Hardenberg auf dem Wiener Kongress. Er beriet Triebenfeld, überreichte dessen Eingaben und lieh ihm Geld. Triebenfeld meldet Ende 1815 seinen Tod in Paris.
prusimska:
  bio: Michalina Prusimska, only child of the Starost Antoni Prusimski, whose confiscated estates were granted to Hohenlohe-Ingelfingen in 1796. In 1807 a commission of the Duchy of Warsaw gave Trąbczyn and Kamionna back to her. She appears under her married names Dąbska and, from about 1814, Miączyńska, which the letters also write Moscinska.
  bio_de: Michalina Prusimska, einziges Kind des Starosten Antoni Prusimski, dessen konfiszierte Güter 1796 an Hohenlohe-Ingelfingen verliehen wurden. 1807 gab ihr eine Kommission des Herzogtums Warschau Trąbczyn und Kaemen zurück. Sie erscheint unter ihren Ehenamen Dąbska und, seit etwa 1814, Miączyńska, in den Briefen auch Moscinska geschrieben.
voss:
  life: "1755-1823"
  bio: Otto Karl Friedrich von Voss, Prussian minister of state responsible for South Prussia. His report led the King to refuse the exchange for Krotoszyn in 1798, and in 1805 he suspended the division of the Trąbczyn and Zagórów estates.
  bio_de: Otto Karl Friedrich von Voss, preußischer Staatsminister, zuständig für Südpreußen. Auf seinen Bericht hin lehnte der König 1798 den Tausch gegen Krotoszyn ab, und 1805 untersagte er die Teilung der Güter Trąbczyn und Zagorowo.
zerboni:
  life: "1766-1831"
  bio: Joseph Zerboni di Sposetti, Prussian official in South Prussia and from 1815 chief president of the Grand Duchy of Posen. He was a creditor on the Trąbczyn estates, and his report of November 1815 advised against pressing the claim for compensation.
  bio_de: Joseph Zerboni di Sposetti, preußischer Beamter in Südpreußen und seit 1815 Oberpräsident des Großherzogtums Posen. Er war Gläubiger auf den Trąbczyner Gütern, und sein Bericht vom November 1815 riet davon ab, den Entschädigungsanspruch nachdrücklich zu vertreten.
fuerst-august:
  life: "1784-1853"
  bio: Friedrich August Karl, eldest son and heir of Hohenlohe-Ingelfingen, to whom his father ceded the principality in 1806; later Prince of Hohenlohe-Öhringen. In 1815 Triebenfeld urged him to withdraw the power of attorney he had given Cosmar.
  bio_de: Friedrich August Karl, ältester Sohn und Erbe Hohenlohe-Ingelfingens, dem der Vater 1806 das Fürstentum abtrat; später Fürst zu Hohenlohe-Öhringen. 1815 drängte Triebenfeld ihn, die Cosmar erteilte Vollmacht zu widerrufen.
prusimski:
  bio: Antoni Prusimski (Ostroróg-Prusimski), Starost of Niszczewice and owner of Trąbczyn, Kamionna and Kolno. The Prussian documents call him one of the leading insurgents of the Polish uprising of 1794; he fled, the crown confiscated his estates, and in 1796 the King granted them to Hohenlohe-Ingelfingen. In 1807 a commission of the Duchy of Warsaw gave them back to his daughter Michalina, who has her own entry. Mentions of his heirs and of the estates named after him are counted here.
  bio_de: Antoni Prusimski (Ostroróg-Prusimski), Starost von Niszczewice und Besitzer von Trąbczyn, Kaemen und Kolno. Die preußischen Akten nennen ihn einen der Hauptinsurgenten des polnischen Aufstands von 1794; er floh, die Krone konfiszierte seine Güter, und 1796 schenkte der König sie Hohenlohe-Ingelfingen. 1807 gab eine Kommission des Herzogtums Warschau sie seiner Tochter Michalina zurück, die einen eigenen Eintrag hat. Erwähnungen seiner Erben und der nach ihm benannten Güter sind hier mitgezählt.
meyer:
  bio: A common surname borne by several men in the letters, among them a court councillor Meyer through whom Hohenlohe-Ingelfingen sent instructions in 1808. They cannot always be told apart.
  bio_de: Ein häufiger Familienname, den in den Briefen mehrere Männer tragen, darunter ein Hofrat Meyer, über den Hohenlohe-Ingelfingen 1808 Weisungen erteilte. Sie lassen sich nicht immer unterscheiden.
schlabrendorff:
  bio: Count and Countess Schlabrendorff, creditors of Hohenlohe-Ingelfingen. A settlement with the Countess for her children's money ran from 1804, and she agreed to wait until January 1805 for 50,000 Rthl.
  bio_de: Graf und Gräfin Schlabrendorff, Gläubiger Hohenlohe-Ingelfingens. Ein Vergleich mit der Gräfin über die Gelder ihrer Kinder lief seit 1804; sie erklärte sich bereit, bis Januar 1805 auf 50.000 Rthl zu warten.
staegemann:
  life: "1763-1840"
  bio: Friedrich August von Stägemann, Prussian councillor of state and close colleague of Hardenberg, with him at the Congress of Vienna. The petitions for Hohenlohe-Ingelfingen were referred to him, and Triebenfeld held him responsible for their delay.
  bio_de: Friedrich August von Stägemann, preußischer Staatsrat und enger Mitarbeiter Hardenbergs, mit diesem auf dem Wiener Kongress. Die Eingaben für Hohenlohe-Ingelfingen wurden ihm zugewiesen, und Triebenfeld machte ihn für ihre Verzögerung verantwortlich.
friedrich-wilhelm-iii:
  life: "1770-1840"
  bio: King of Prussia from November 1797. He issued the supplementary grant of December 1797, refused the exchange for Krotoszyn in 1798 and confirmed the family entail of Hohenlohe-Ingelfingen in 1805.
  bio_de: König von Preußen seit November 1797. Er erließ die ergänzende Verleihung vom Dezember 1797, lehnte 1798 den Tausch gegen Krotoszyn ab und bestätigte 1805 das Familienmajorat Hohenlohe-Ingelfingens.
hawich:
  bio: Justiciary of the patrimonial court of the Zagórów estates, formerly at Pyzdry. He reported the seizure of Trąbczyn in October 1807 and received powers of attorney for the lawsuits in the Duchy of Warsaw in 1809. Triebenfeld later accused him of dishonesty and sought his dismissal.
  bio_de: Justitiar des Patrimonialgerichts der Zagorower Güter, zuvor in Peisern. Er meldete im Oktober 1807 die Wegnahme von Trąbczyn und erhielt 1809 Vollmachten für die Prozesse im Herzogtum Warschau. Triebenfeld warf ihm später Unredlichkeit vor und betrieb seine Entlassung.
hecker:
  bio: Chief inspector on the Zagórów estates, engaged by Triebenfeld in 1808. He kept the estate's accounts, was accused with Hawich of taking land and stirring up the settlers, and was to be dismissed in 1811.
  bio_de: Oberinspektor auf den Zagorower Gütern, 1808 von Triebenfeld angestellt. Er führte die Kasse, wurde zusammen mit Hawich beschuldigt, sich Land anzueignen und die Siedler aufzuwiegeln, und sollte 1811 entlassen werden.
zastrow:
  life: "1752-1830"
  bio: Friedrich Wilhelm Christian von Zastrow, Prussian general, adjutant to the King in 1798 and briefly foreign minister in 1807. He stood surety for Triebenfeld in 1808. He too had been granted estates in South Prussia, and the heirs of Hohenlohe-Ingelfingen cited his compensation in 1820.
  bio_de: Friedrich Wilhelm Christian von Zastrow, preußischer General, 1798 Adjutant des Königs und 1807 kurz Außenminister. Er verbürgte sich 1808 für Triebenfeld. Auch er hatte Güter in Südpreußen erhalten, und die Erben Hohenlohe-Ingelfingens beriefen sich 1820 auf seine Entschädigung.
michaelis:
  bio: The name covers three people. A merchant Michaelis supplied iron and advanced money to Triebenfeld in 1809; a court fiscal Michaelis acted as agent in Berlin in 1798; and Christiane Dorothea Michaelis, born Eichborn, was a mortgage creditor on Pszczew.
  bio_de: Der Name bezeichnet drei Personen. Ein Kaufmann Michaelis lieferte 1809 Eisen und schoss Triebenfeld Geld vor; ein Hoffiskal Michaelis war 1798 Agent in Berlin; und Christiane Dorothea Michaelis, geborene Eichborn, war Hypothekengläubigerin auf Betsche.
beyme:
  life: "1765-1838"
  bio: Karl Friedrich von Beyme, cabinet councillor to Friedrich Wilhelm III and later Grand Chancellor of Prussia. He presented the petitions of Hohenlohe-Ingelfingen to the King from 1798.
  bio_de: Karl Friedrich von Beyme, Kabinettsrat Friedrich Wilhelms III. und später preußischer Großkanzler. Er trug dem König seit 1798 die Eingaben Hohenlohe-Ingelfingens vor.
hoym:
  life: "1739-1807"
  bio: Karl Georg Heinrich Count von Hoym, Prussian minister for Silesia and, from 1793 to 1798, for South Prussia. He proposed the grant of the Prusimski estates to Hohenlohe-Ingelfingen in July 1796.
  bio_de: Karl Georg Heinrich Graf von Hoym, preußischer Minister für Schlesien und von 1793 bis 1798 für Südpreußen. Er schlug im Juli 1796 die Verleihung der Güter Prusimskis an Hohenlohe-Ingelfingen vor.
sacken:
  life: "d. 1811"
  bio: Princess Sacken, mother of Marianne von Hoym, the wife of Hohenlohe-Ingelfingen. She lent him money on the estate of Koszęcin. After her death in 1811 her will, a legacy to him and to his son August, and her executor Cosmar occupy many letters.
  bio_de: Fürstin Sacken, Mutter der Marianne von Hoym, der Ehefrau Hohenlohe-Ingelfingens. Sie lieh ihm Geld auf das Gut Koschentin. Nach ihrem Tod 1811 beschäftigen ihr Testament, ein Vermächtnis an ihn und an seinen Sohn August und ihr Testamentsvollstrecker Cosmar viele Briefe.
cabanis:
  bio: Surveyor and chief forester on the South Prussian estates. He measured Oleśnica, was sent in 1804 to recruit settlers among Bohemian colonists in Silesia, and later checked the accounts at Zagórów.
  bio_de: Vermesser und Oberförster auf den südpreußischen Gütern. Er vermaß Olesnica, wurde 1804 ausgesandt, um unter böhmischen Kolonisten in Schlesien Siedler zu werben, und prüfte später die Rechnungen in Zagorowo.
broniewski:
  bio: Anton von Broniewski, a cavalry captain who held Kamionna and Kolno in pledge and contested the title of Hohenlohe-Ingelfingen. Under a settlement of 1804 he received 53,139 Rthl out of the price paid by Leixner.
  bio_de: Anton von Broniewski, Rittmeister, der Kaemen und Kolno als Pfand besaß und den Besitztitel Hohenlohe-Ingelfingens bestritt. Nach einem Vergleich von 1804 erhielt er 53.139 Rthl aus dem von Leixner gezahlten Kaufpreis.
leixner:
  life: "d. by 1816"
  bio: George Conrad Leixner, an official of the royal bank at Frankfurt an der Oder, who bought Kamionna and Kolno for 142,000 Rthl in 1805. He lost the estates in 1807 and came under judicial investigation; a note of April 1816 records that he had died.
  bio_de: George Conrad Leixner, Beamter der königlichen Bank in Frankfurt an der Oder, der 1805 Kaemen und Kolno für 142.000 Rthl kaufte. Er verlor die Güter 1807 und geriet in gerichtliche Untersuchung; ein Vermerk vom April 1816 hält fest, dass er verstorben war.
oppenheimer:
  bio: A banker of the Berlin house of Oppenheim and Wolff, to which part of a mortgage of 250,000 Rthl on Zagórów was pledged. He undertook the payment to the invalid fund and did not make it, and Triebenfeld sued him in Berlin and Kalisz.
  bio_de: Bankier des Berliner Hauses Oppenheim und Wolff, dem ein Teil einer Hypothek von 250.000 Rthl auf Zagorowo verpfändet war. Er übernahm die Zahlung an die Invalidenkasse und leistete sie nicht; Triebenfeld verklagte ihn in Berlin und Kalisch.
bernhard:
  bio: Meyer Bernhard, a financier who acted with Leixner in the purchase of Kamionna and Kolno and in the Pszczew business in 1804. He later sued over Pszczew.
  bio_de: Meyer Bernhard, ein Geldgeber, der 1804 mit Leixner beim Kauf von Kaemen und Kolno und in der Betscher Sache auftrat. Später klagte er wegen Betsche.
lahr:
  bio: Van der Lahr, a Berlin creditor from whom Triebenfeld borrowed in 1808 to pay interest owed to the invalid fund. He sued for repayment in cash, had Triebenfeld's estates sequestered, and was partly paid in iron from the Silesian works.
  bio_de: Van der Lahr, ein Berliner Gläubiger, bei dem Triebenfeld 1808 lieh, um Zinsen an die Invalidenkasse zu zahlen. Er klagte auf Rückzahlung in Kurant, ließ Triebenfelds Güter sequestrieren und wurde zum Teil in Eisen aus den schlesischen Werken bezahlt.
napoleon:
  life: "1769-1821"
  bio: Napoleon Bonaparte, Emperor of the French. The Duchy of Warsaw he created in 1807 took in the estates of Hohenlohe-Ingelfingen, and his return from Elba in March 1815 interrupted the business of the Congress of Vienna.
  bio_de: Napoleon Bonaparte, Kaiser der Franzosen. Das von ihm 1807 geschaffene Herzogtum Warschau umfasste die Güter Hohenlohe-Ingelfingens, und seine Rückkehr von Elba im März 1815 unterbrach die Geschäfte des Wiener Kongresses.
eberhard:
  bio: Justice commissioner at Brzeg, who acted for Hohenlohe-Ingelfingen in the negotiations with the heirs of the Duke of Courland in 1814 and 1815. Triebenfeld pressed for him to come to Vienna to conclude a settlement.
  bio_de: Justizkommissar in Brieg, der 1814 und 1815 für Hohenlohe-Ingelfingen mit den Erben des Herzogs von Kurland verhandelte. Triebenfeld drängte darauf, dass er zum Abschluss eines Vergleichs nach Wien komme.
brzechffa:
  bio: Sub-prefect of the Konin district in the Duchy of Warsaw, a friend of Triebenfeld. In 1812 he offered to take the Zagórów estates on a six-year lease and went to Warsaw on the Trąbczyn matter.
  bio_de: Unterpräfekt des Kreises Konin im Herzogtum Warschau, ein Freund Triebenfelds. 1812 bot er an, die Zagorower Güter auf sechs Jahre zu pachten, und reiste in der Trąbczyner Sache nach Warschau.
humboldt:
  life: "1767-1835"
  bio: Wilhelm von Humboldt, Prussian minister and scholar, second Prussian plenipotentiary at the Congress of Vienna. He received Triebenfeld's memorial in November 1814 and promised his support.
  bio_de: Wilhelm von Humboldt, preußischer Minister und Gelehrter, zweiter preußischer Bevollmächtigter auf dem Wiener Kongress. Er erhielt im November 1814 Triebenfelds Denkschrift und sagte seine Unterstützung zu.
lichnowski:
  bio: The Lichnowski brothers, creditors with 42,000 Rthl registered on Trąbczyn. In 1804 one of them demanded arrears of interest and threatened to apply for sequestration.
  bio_de: Die Brüder Lichnowski, Gläubiger mit 42.000 Rthl, die auf Trąbczyn eingetragen waren. 1804 forderte einer von ihnen rückständige Zinsen und drohte, die Sequestration zu beantragen.
stoessel:
  bio: Baron von Stössel, a cavalry captain, and his family, the largest creditors on the Silesian estate of Koszęcin. The register of creditors lists three claims of the family. From 1810 Triebenfeld tried to settle with them by transferring Zagórów.
  bio_de: Baron von Stössel, Rittmeister, und seine Familie, die größten Gläubiger auf dem schlesischen Gut Koschentin. Das Gläubigerverzeichnis nennt drei Forderungen der Familie. Seit 1810 versuchte Triebenfeld, sie durch Übertragung von Zagorowo abzufinden.
lombardini:
  bio: Steward of the household of Hohenlohe-Ingelfingen at Sławięcice. He carried letters and money between the Prince and Triebenfeld and paid allowances to Triebenfeld's daughters.
  bio_de: Hofmeister Hohenlohe-Ingelfingens in Schlawenschitz. Er überbrachte Briefe und Geld zwischen dem Fürsten und Triebenfeld und zahlte Triebenfelds Töchtern Unterstützungen aus.
friedrich-wilhelm-ii:
  life: "1744-1797"
  bio: King of Prussia from 1786. He granted the South Prussian estates to Hohenlohe-Ingelfingen by charters of August 1796 and June 1797.
  bio_de: König von Preußen seit 1786. Er verlieh Hohenlohe-Ingelfingen die südpreußischen Güter durch Urkunden vom August 1796 und Juni 1797.
eysenhardt:
  bio: A Berlin agent of Hohenlohe-Ingelfingen in 1798, later a creditor. A bank draft for 6,000 Rthl made over to him in 1807 was the subject of a dispute with Triebenfeld in 1808.
  bio_de: 1798 Agent Hohenlohe-Ingelfingens in Berlin, später Gläubiger. Eine 1807 an ihn abgetretene Bankanweisung über 6.000 Rthl war 1808 Gegenstand eines Streits mit Triebenfeld.
radzinski:
  bio: Ignatz von Radzinski, lessee of Szetlewek from 1798 and holder of a pledge of 8,333 Rthl on it. He later held the estate in hereditary lease and was in arrears by 1808.
  bio_de: Ignatz von Radzinski, seit 1798 Pächter von Szetlewek und Inhaber eines Pfandes von 8.333 Rthl darauf. Später besaß er das Gut in Erbpacht und war 1808 im Rückstand.
pourtales:
  life: "1779-1861"
  bio: A Count Pourtalès, of the Neuchâtel family in Prussian service, whom Triebenfeld proposed in 1815 as buyer of Koszęcin. He is probably Count Frédéric de Pourtalès, whose dates are given here.
  bio_de: Ein Graf Pourtalès aus der Neuenburger Familie in preußischen Diensten, den Triebenfeld 1815 als Käufer von Koschentin vorschlug. Vermutlich Graf Friedrich von Pourtalès, dessen Lebensdaten hier stehen.
sommer:
  bio: A lieutenant and legal trainee in the service of Hohenlohe-Ingelfingen, sent in 1811 and 1812 to General Schimmelpfennig about the exchange of Zagórów.
  bio_de: Leutnant und Referendar im Dienst Hohenlohe-Ingelfingens, 1811 und 1812 wegen des Tausches von Zagorowo zu General Schimmelpfennig gesandt.
bernhardi:
  life: "d. 1806"
  bio: Mining councillor concerned with the Silesian estate of Koszęcin, to whom payments from the sale of Kamionna were sent in 1804. Hahn reports his death in July 1806. A tenant of the same name at Konotop may be a different man.
  bio_de: Bergrat, mit dem schlesischen Gut Koschentin befasst, an den 1804 Zahlungen aus dem Verkauf von Kaemen gingen. Hahn meldet im Juli 1806 seinen Tod. Ein gleichnamiger Pächter in Kontop ist möglicherweise ein anderer.
meierowitz:
  bio: Franz Meierowitz bought the estate of Witów in 1805 for 20,000 Rthl and a yearly payment. Triebenfeld later sued him for unpaid purchase money and rent.
  bio_de: Franz Meierowitz kaufte 1805 das Gut Wittow für 20.000 Rthl und eine jährliche Abgabe. Triebenfeld verklagte ihn später wegen rückständigen Kaufgelds und Zinses.
niedzwiecki:
  bio: Maciej Niedźwiecki took the farm of Kopojno on a six-year lease in 1805, with the right to sell drink on the estates. He fell into arrears, and a suit against him was won in 1812.
  bio_de: Maciej Niedźwiecki pachtete 1805 das Vorwerk Kopojno auf sechs Jahre, mit der Propination auf den Gütern. Er geriet in Rückstand, und ein Prozess gegen ihn wurde 1812 gewonnen.
gaertner:
  bio: A privy councillor who represented the mediatised princely houses, Hohenlohe among them, at the Congress of Vienna. Triebenfeld sent the Prince his pamphlet and his submissions to the Congress.
  bio_de: Ein Geheimer Rat, der die mediatisierten Fürstenhäuser, darunter Hohenlohe, auf dem Wiener Kongress vertrat. Triebenfeld schickte dem Fürsten seine Broschüre und seine Eingaben an den Kongress.
prinz-adolph:
  life: "1797-1873"
  bio: Prince Adolf of Hohenlohe-Ingelfingen, a younger son of Friedrich Ludwig, later a Prussian general and briefly prime minister of Prussia in 1862. His entry into the Prussian army in 1815 is discussed in the Vienna letters.
  bio_de: Prinz Adolf zu Hohenlohe-Ingelfingen, ein jüngerer Sohn Friedrich Ludwigs, später preußischer General und 1862 kurz preußischer Ministerpräsident. Sein Eintritt in die preußische Armee 1815 wird in den Wiener Briefen erörtert.
stein:
  life: "1757-1831"
  bio: Heinrich Friedrich Karl vom Stein, Prussian reforming minister, and at the Congress of Vienna an adviser to Tsar Alexander. In 1806, as minister, he lent Triebenfeld money; in 1815 Hohenlohe-Ingelfingen asked him to put the Trąbczyn claim to the Tsar.
  bio_de: Heinrich Friedrich Karl vom Stein, preußischer Reformminister und auf dem Wiener Kongress Berater Zar Alexanders. 1806 lieh er als Minister Triebenfeld Geld; 1815 bat Hohenlohe-Ingelfingen ihn, den Trąbczyner Anspruch dem Zaren vorzutragen.
kircheisen:
  life: "1749-1825"
  bio: Friedrich Leopold von Kircheisen, Prussian minister of justice from 1810. He was named as an executor of Princess Sacken's will, and the inquiry into Cosmar's administration was referred to him.
  bio_de: Friedrich Leopold von Kircheisen, preußischer Justizminister seit 1810. Er wurde als Testamentsvollstrecker der Fürstin Sacken genannt, und die Untersuchung der Verwaltung Cosmars wurde ihm zugewiesen.
prinz-george:
  bio: A prince to whom Triebenfeld had sold estates, and whose unpaid debts under that sale exposed Triebenfeld to lawsuits between 1798 and 1805. The letters do not give his house.
  bio_de: Ein Prinz, dem Triebenfeld Güter verkauft hatte und dessen unbezahlte Schulden aus diesem Verkauf Triebenfeld zwischen 1798 und 1805 Prozesse eintrugen. Sein Haus nennen die Briefe nicht.
constantin:
  life: "1779-1831"
  bio: Grand Duke Konstantin Pavlovich, brother of Tsar Alexander I and from 1815 commander of the army of the Kingdom of Poland. Triebenfeld hoped to reach the Tsar through him.
  bio_de: Großfürst Konstantin Pawlowitsch, Bruder Zar Alexanders I. und seit 1815 Befehlshaber der Armee des Königreichs Polen. Triebenfeld hoffte, über ihn den Zaren zu erreichen.
balan:
  bio: Counsellor of legation in the Prussian foreign ministry, to whom the papers on the Trąbczyn claim were assigned from 1815 to 1820. He drew up its decisions and initialled its drafts.
  bio_de: Legationsrat im preußischen Außenministerium, dem von 1815 bis 1820 die Akten über den Trąbczyner Anspruch zugewiesen waren. Er setzte die Verfügungen auf und paraphierte die Entwürfe.
born:
  bio: Named in letters and contracts between 1804 and 1811. The edition has not established who he was.
  bio_de: Zwischen 1804 und 1811 in Briefen und Verträgen genannt. Wer er war, hat die Edition nicht ermittelt.
gneust:
  bio: Andreas Ernst Gneust, captain and district tax collector, who bought the free mayor's holding at Dormowo near Pszczew in 1797.
  bio_de: Andreas Ernst Gneust, Hauptmann und Kreissteuereinnehmer, der 1797 das Freischulzengut in Dormowo bei Betsche kaufte.
melzer:
  bio: Councillor of justice at Poznań, who represented Hohenlohe-Ingelfingen before the government there in registering the title to Pszczew and in the Broniewski suit.
  bio_de: Justizrat in Posen, der Hohenlohe-Ingelfingen vor der dortigen Regierung bei der Eintragung des Besitztitels an Betsche und im Prozess gegen Broniewski vertrat.
bally:
  bio: Legal trainee and later master of the horse to Hohenlohe-Ingelfingen at Sławięcice, who carried money and messages to Triebenfeld.
  bio_de: Referendar und später Stallmeister Hohenlohe-Ingelfingens in Schlawenschitz, der Triebenfeld Geld und Nachrichten überbrachte.
garczynski:
  bio: Count Garczyński, prefect of the department of Kalisz in the Duchy of Warsaw. He ordered the arrest of Honrichs in 1810 and was approached about the lease and the taxation of the Zagórów estates.
  bio_de: Graf Garczyński, Präfekt des Departements Kalisch im Herzogtum Warschau. Er ließ 1810 Honrichs verhaften und wurde wegen der Verpachtung und der Besteuerung der Zagorower Güter angegangen.
grotowski:
  bio: A creditor with a mortgage of 30,000 Rthl on Trąbczyn, which the banker Weigel took over in 1804.
  bio_de: Ein Gläubiger mit einer Hypothek von 30.000 Rthl auf Trąbczyn, die der Bankier Weigel 1804 übernahm.
grimm:
  bio: Court and criminal councillor at Kalisz, legal representative of Hohenlohe-Ingelfingen before the government there from 1799.
  bio_de: Hof- und Kriminalrat in Kalisch, seit 1799 Rechtsvertreter Hohenlohe-Ingelfingens vor der dortigen Regierung.
knobelsdorff:
  bio: A Silesian landowner with whom Triebenfeld negotiated in 1809 and 1810 an exchange of his estates for Zagórów. He inspected Zagórów in late 1810; no exchange is recorded.
  bio_de: Ein schlesischer Gutsbesitzer, mit dem Triebenfeld 1809 und 1810 über einen Tausch seiner Güter gegen Zagorowo verhandelte. Er besichtigte Zagorowo Ende 1810; ein Abschluss ist nicht überliefert.
rochlitz:
  bio: Forest inspector, who valued the forest of Kamionna and Kolno and negotiated the first sale of Witów in 1803. Triebenfeld says he dismissed him as agent in 1804, and a suit with him followed in 1810.
  bio_de: Forstinspektor, der den Forst von Kaemen und Kolno taxierte und 1803 den ersten Verkauf von Wittow aushandelte. Triebenfeld gibt an, ihn 1804 als Bevollmächtigten abgesetzt zu haben; 1810 folgte ein Prozess mit ihm.
grevenitz:
  bio: Councillor of the Kammergericht in Berlin, who acted for Triebenfeld in the Lahr suit and forwarded his post in 1815.
  bio_de: Kammergerichtsrat in Berlin, der Triebenfeld im Lahrschen Prozess vertrat und ihm 1815 die Post nachsandte.
schoeler:
  life: "1772-1840"
  bio: Friedrich von Schöler, Prussian general and envoy at St Petersburg. In 1816 he was instructed to bring the claim of Hohenlohe-Ingelfingen before the Tsar, and he reported the Russian refusal.
  bio_de: Friedrich von Schöler, preußischer General und Gesandter in St. Petersburg. 1816 wurde er angewiesen, den Anspruch Hohenlohe-Ingelfingens dem Zaren vorzutragen, und er meldete die russische Ablehnung.
beguelin:
  life: "1765-1818"
  bio: Heinrich von Beguelin, Prussian finance official in Hardenberg's chancery at Vienna. He promised in 1815 to lay the letter of Hohenlohe-Ingelfingen before the State Chancellor.
  bio_de: Heinrich von Beguelin, preußischer Finanzbeamter in Hardenbergs Kanzlei in Wien. Er sagte 1815 zu, den Brief Hohenlohe-Ingelfingens dem Staatskanzler vorzulegen.
echaust:
  bio: An official concerned with the Pszczew estates from 1799, whose accounts Triebenfeld was still examining in 1816.
  bio_de: Ein seit 1799 mit den Betscher Gütern befasster Beamter, dessen Rechnungen Triebenfeld noch 1816 prüfte.
goeschel:
  bio: An agent of the house of Hohenlohe at the Congress of Vienna, who submitted notes to the Congress and for whom Triebenfeld requested a power of attorney.
  bio_de: Ein Bevollmächtigter des Hauses Hohenlohe auf dem Wiener Kongress, der Noten beim Kongress einreichte und für den Triebenfeld eine Vollmacht erbat.
goldbeck:
  bio: Two men. Heinrich Julius von Goldbeck (1733-1818), Grand Chancellor of Prussia, countersigned the charters of 1796. A von Goldbeck who became president of the chamber at Kalisz in 1805 supported the division of the estates.
  bio_de: Zwei Männer. Heinrich Julius von Goldbeck (1733-1818), preußischer Großkanzler, zeichnete die Urkunden von 1796 gegen. Ein von Goldbeck, der 1805 Präsident der Kammer in Kalisch wurde, unterstützte die Teilung der Güter.
kwilecki:
  bio: Justice of the peace at Konin in the Duchy of Warsaw, before whom the suit for the recovery of Trąbczyn opened in 1810. A von Kwilecki also appears in 1805 in a dispute over timber rights at Kamionna.
  bio_de: Friedensrichter in Konin im Herzogtum Warschau, vor dem 1810 die Klage auf Rückgabe von Trąbczyn begann. Ein von Kwilecki erscheint auch 1805 in einem Streit um Holzrechte bei Kaemen.
metternich:
  life: "1773-1859"
  bio: Prince Klemens von Metternich, Austrian foreign minister and host of the Congress of Vienna. Triebenfeld reports on him in his news from the Congress.
  bio_de: Fürst Klemens von Metternich, österreichischer Außenminister und Gastgeber des Wiener Kongresses. Triebenfeld berichtet über ihn in seinen Nachrichten vom Kongress.
talleyrand:
  life: "1754-1838"
  bio: Charles-Maurice de Talleyrand-Périgord, French foreign minister and France's representative at the Congress of Vienna. He appears in Triebenfeld's reports of the negotiations.
  bio_de: Charles-Maurice de Talleyrand-Périgord, französischer Außenminister und Vertreter Frankreichs auf dem Wiener Kongress. Er erscheint in Triebenfelds Berichten über die Verhandlungen.
blomberg:
  bio: An official whose estimate put the value of the Trąbczyn estates at 316,000 Rthl, the figure Triebenfeld used in the claim for compensation. In 1804 he pressed demands of his own in connection with the division of the estates.
  bio_de: Ein Beamter, dessen Überschlag den Wert der Trąbczyner Güter auf 316.000 Rthl ansetzte, die Zahl, die Triebenfeld im Entschädigungsanspruch gebrauchte. 1804 erhob er im Zusammenhang mit der Teilung der Güter eigene Forderungen.
schimmelpfennig:
  life: "1738-1812"
  bio: General Schimmelpfennig von der Oye, who in 1811 and 1812 offered his own estates in exchange for Zagórów. The negotiation stalled over his illness. He is probably the Prussian general Christian Ludwig Schimmelpfennig von der Oye, whose dates are given here.
  bio_de: General Schimmelpfennig von der Oye, der 1811 und 1812 eigene Güter zum Tausch gegen Zagorowo anbot. Die Verhandlung stockte wegen seiner Krankheit. Vermutlich der preußische General Christian Ludwig Schimmelpfennig von der Oye, dessen Lebensdaten hier stehen.
tietz:
  bio: Probably the forest inspector Carl Titz, who has his own entry; the letters write the name both ways.
  bio_de: Vermutlich der Forstinspektor Carl Titz, der einen eigenen Eintrag hat; die Briefe schreiben den Namen auf beide Weisen.
otocki:
  bio: Martin von Otocki, a neighbouring landowner who offered in 1804 and 1805 to take Szetlewek and the drink monopoly of the estates on lease. He later claimed compensation under an older Trąbczyn lease.
  bio_de: Martin von Otocki, ein benachbarter Gutsbesitzer, der 1804 und 1805 anbot, Szetlewek und die Propination der Güter zu pachten. Später forderte er Entschädigung aus einem älteren Trąbczyner Pachtvertrag.
kaiser-alexander:
  life: "1777-1825"
  bio: Alexander I, Emperor of Russia from 1801 and, from 1815, King of Poland. The district of Trąbczyn fell under his rule, and the claim for compensation was addressed to him and refused in 1816 and 1820.
  bio_de: Alexander I., Kaiser von Russland seit 1801 und seit 1815 König von Polen. Der Kreis von Trąbczyn kam unter seine Herrschaft; der Entschädigungsanspruch wurde an ihn gerichtet und 1816 und 1820 abgelehnt.
wartensleben:
  bio: The Counts Wartensleben, father and son, Silesian landowners. In 1811 Triebenfeld proposed exchanging Zagórów for their estates of Skorogoszcz and Wołczyn, and Count Leopold acted as intermediary with Stössel.
  bio_de: Die Grafen Wartensleben, Vater und Sohn, schlesische Gutsbesitzer. 1811 schlug Triebenfeld vor, Zagorowo gegen ihre Güter Schurgast und Konstadt zu tauschen, und Graf Leopold vermittelte bei Stössel.
bornstaedt:
  bio: An intermediary in the sale of the lordship of Pszczew in 1804, who claimed a fee for it and appears as a creditor in the register.
  bio_de: Ein Vermittler beim Verkauf der Herrschaft Betsche 1804, der dafür ein Honorar forderte und im Gläubigerverzeichnis erscheint.
kunckel:
  bio: An agent who in 1804 made over land at Althütte to settlers for Hohenlohe-Ingelfingen and brought the three lessees of Oleśnica. Triebenfeld distrusted him, and he was taken into custody in 1805.
  bio_de: Ein Unterhändler, der 1804 für Hohenlohe-Ingelfingen Land in Althütte an Siedler austat und die drei Pächter von Olesnica brachte. Triebenfeld misstraute ihm; 1805 wurde er in Verwahrung genommen.
nesselrode:
  life: "1780-1862"
  bio: Count Karl Robert von Nesselrode, Russian foreign minister. Triebenfeld approached him at Vienna in 1815, and Schöler delivered the Prussian notes on the claim to him in 1816.
  bio_de: Graf Karl Robert von Nesselrode, russischer Außenminister. Triebenfeld wandte sich 1815 in Wien an ihn, und Schöler übergab ihm 1816 die preußischen Noten über den Anspruch.
przespolewski:
  bio: Jacob von Przespolewski, who had a claim of 30,000 Polish florins against the former owner Prusimski registered on Szetlewek and obtained an order of execution against Hohenlohe-Ingelfingen in 1804.
  bio_de: Jacob von Przespolewski, für den eine Forderung von 30.000 polnischen Gulden gegen den früheren Besitzer Prusimski auf Szetlewek eingetragen war und der 1804 eine Exekution gegen Hohenlohe-Ingelfingen erwirkte.
schulenburg:
  life: "1742-1815"
  bio: Count Friedrich Wilhelm von der Schulenburg-Kehnert, Prussian general and minister of state. In 1798 he was reported to favour the exchange for Krotoszyn, and in 1804 Amelang delivered a letter of Hohenlohe-Ingelfingen to him.
  bio_de: Graf Friedrich Wilhelm von der Schulenburg-Kehnert, preußischer General und Staatsminister. 1798 hieß es, er sei dem Tausch gegen Krotoszyn gewogen, und 1804 übergab ihm Amelang ein Schreiben Hohenlohe-Ingelfingens.
sobottendorff:
  bio: A creditor to whom Hohenlohe-Ingelfingen owed 40,000 Rthl. In 1812 Triebenfeld proposed satisfying him with a long lease of Drzewce; his heirs appear in the register of creditors.
  bio_de: Ein Gläubiger, dem Hohenlohe-Ingelfingen 40.000 Rthl schuldete. 1812 schlug Triebenfeld vor, ihn durch eine lange Pacht von Drzewce abzufinden; seine Erben erscheinen im Gläubigerverzeichnis.
hohenlohe-bartenstein:
  bio: A prince of the Catholic Bartenstein line of the house of Hohenlohe, present at the Congress of Vienna. Hardenberg promised him in December 1814 to take up the affairs of Hohenlohe-Ingelfingen.
  bio_de: Ein Prinz der katholischen Bartensteiner Linie des Hauses Hohenlohe, auf dem Wiener Kongress anwesend. Hardenberg sagte ihm im Dezember 1814 zu, sich der Angelegenheiten Hohenlohe-Ingelfingens anzunehmen.
tesmar:
  bio: A privy councillor who negotiated in 1806 for a large loan on the South Prussian estates and reported to Triebenfeld in 1810.
  bio_de: Ein Geheimer Rat, der 1806 über ein großes Darlehen auf die südpreußischen Güter verhandelte und Triebenfeld 1810 Nachricht gab.
danckelmann:
  bio: Count Danckelmann, a senior Prussian judge in Silesia, from whom leave was sought in 1810 for the legal trainee Sommer. Probably Heinrich Wilhelm August Alexander von Danckelmann (1768-1830), later minister of justice.
  bio_de: Graf Danckelmann, hoher preußischer Richter in Schlesien, bei dem 1810 Urlaub für den Referendar Sommer erbeten wurde. Vermutlich Heinrich Wilhelm August Alexander von Danckelmann (1768-1830), später Justizminister.
bethusy:
  bio: Count Ernst Bethusy, a landowner in Silesia and in the Kingdom of Poland. His request for free movement between his properties was refused with the claim of the Hohenlohe heirs in 1820. The letters of 1809 mention his debts.
  bio_de: Graf Ernst Bethusy, Grundbesitzer in Schlesien und im Königreich Polen. Sein Gesuch um freien Verkehr zwischen seinen Besitzungen wurde 1820 zusammen mit dem Anspruch der Hohenloher Erben abgelehnt. Die Briefe von 1809 erwähnen seine Schulden.
haugt:
  bio: A Berlin creditor, named with Oppenheimer and Girard, whose mortgage Triebenfeld sought to have taken over in 1805.
  bio_de: Ein Berliner Gläubiger, zusammen mit Oppenheimer und Girard genannt, dessen Hypothek Triebenfeld 1805 übernehmen lassen wollte.
brehmer:
  bio: The widow of Colonel von Brehmer, of Sommerfeld, sister and sole heir of Major von Seehausen. In 1816 she asked the ministry to see that his loan of 5,000 Rthl to Hohenlohe-Ingelfingen was paid out of any compensation.
  bio_de: Die Witwe des Obersten von Brehmer in Sommerfeld, Schwester und Alleinerbin des Majors von Seehausen. 1816 bat sie das Ministerium, dafür zu sorgen, dass dessen Darlehen von 5.000 Rthl an Hohenlohe-Ingelfingen aus einer Entschädigung bezahlt werde.
emilie:
  bio: Princess Emilie of Hohenlohe-Ingelfingen, a daughter of Friedrich Ludwig. Under his will of 1805 she was to inherit Koszęcin if the male line ended.
  bio_de: Prinzessin Emilie zu Hohenlohe-Ingelfingen, eine Tochter Friedrich Ludwigs. Nach seinem Testament von 1805 sollte sie Koschentin erben, wenn der Mannesstamm erlosch.
noldichen:
  bio: A councillor of war whose valuation of Krotoszyn, made without inspecting the estates, was the basis of the report that led to the refusal of the exchange in 1798.
  bio_de: Ein Kriegsrat, dessen Veranschlagung von Krotoszyn, ohne Besichtigung der Güter angefertigt, die Grundlage des Berichts war, der 1798 zur Ablehnung des Tausches führte.
metzig:
  bio: Named in connection with the estates between 1804 and 1808. Possibly the same man as the judicial burgomaster Melzig.
  bio_de: Zwischen 1804 und 1808 im Zusammenhang mit den Gütern genannt. Möglicherweise derselbe wie der Justizbürgermeister Melzig.
neumann:
  bio: Steward of Triebenfeld's own estate at Bojadła, to whom the iron from the Silesian works was to be delivered in 1809. A boatman of the same name is also mentioned.
  bio_de: Verwalter von Triebenfelds eigenem Gut in Boyadel, an den 1809 das Eisen aus den schlesischen Werken geliefert werden sollte. Ein Schiffer gleichen Namens wird ebenfalls erwähnt.
pochammer:
  bio: Court fiscal in Berlin, engaged in 1805 and 1806 to pursue the request for a royal loan in treasury notes.
  bio_de: Hoffiskal in Berlin, 1805 und 1806 beauftragt, das Gesuch um ein königliches Darlehen in Tresorscheinen zu betreiben.
trzcinski:
  life: "d. 1815"
  bio: Ignatz von Trzciński owed Hohenlohe-Ingelfingen money on bills from 1813. Triebenfeld reports his death in December 1815; a claim against the estate was then disputed with Zerboni.
  bio_de: Ignatz von Trzciński schuldete Hohenlohe-Ingelfingen seit 1813 Geld auf Wechsel. Triebenfeld meldet im Dezember 1815 seinen Tod; eine Forderung gegen den Nachlass war danach mit Zerboni strittig.
winzingerode:
  bio: Count Wintzingerode, a minister of Württemberg at the Congress of Vienna, who in 1814 claimed for Prince August a legacy under the will of Princess Sacken. Father and son of this name both served Württemberg, and the letters do not say which is meant.
  bio_de: Graf Wintzingerode, württembergischer Minister auf dem Wiener Kongress, der 1814 für Fürst August ein Vermächtnis aus dem Testament der Fürstin Sacken forderte. Vater und Sohn dieses Namens dienten Württemberg; welcher gemeint ist, sagen die Briefe nicht.
wollenhaupt:
  bio: Johann Wilhelm Wollenhaupt, building inspector on the estates. He took land at Drzewce on hereditary lease in 1805; the contract was cancelled three months later and he was paid off.
  bio_de: Johann Wilhelm Wollenhaupt, Bauinspektor auf den Gütern. Er nahm 1805 Land in Drzewce in Erbzins; der Vertrag wurde drei Monate später aufgehoben und er abgefunden.
stenger:
  bio: Criminal councillor at Kargowa, whom Triebenfeld engaged in 1810 to put the affairs of the estates in the Duchy of Warsaw in order.
  bio_de: Kriminalrat in Karge, den Triebenfeld 1810 beauftragte, die Angelegenheiten der Güter im Herzogtum Warschau zu ordnen.
kalckreuth:
  life: "1737-1818"
  bio: Friedrich Adolf von Kalckreuth, Prussian field marshal. Triebenfeld blamed him, with Prince George, for the order of 1805 that stopped the revision of the estate valuations.
  bio_de: Friedrich Adolf von Kalckreuth, preußischer Feldmarschall. Triebenfeld machte ihn, zusammen mit Prinz George, für die Verfügung von 1805 verantwortlich, die die Revision der Gutstaxen untersagte.
wellington:
  life: "1769-1852"
  bio: Arthur Wellesley, Duke of Wellington, British commander and from February 1815 Britain's representative at the Congress of Vienna. He appears in Triebenfeld's news from the Congress.
  bio_de: Arthur Wellesley, Herzog von Wellington, britischer Feldherr und seit Februar 1815 Vertreter Großbritanniens auf dem Wiener Kongress. Er erscheint in Triebenfelds Nachrichten vom Kongress.
prittwitz:
  bio: An official named in 1799 as one of those who were to settle the exchange for Krotoszyn.
  bio_de: Ein Beamter, 1799 als einer derjenigen genannt, die den Tausch gegen Krotoszyn regeln sollten.
rybbeck:
  bio: A lessee on the Zagórów estates, with whom Triebenfeld sought a settlement in 1804 over money paid and buildings put up.
  bio_de: Ein Pächter auf den Zagorower Gütern, mit dem Triebenfeld 1804 einen Vergleich über gezahlte Gelder und errichtete Bauten suchte.
falz:
  bio: A lawyer who conducted the lawsuits of Hohenlohe-Ingelfingen before the tribunal at Kalisz in 1810 and 1811. The spelling of his name is not settled.
  bio_de: Ein Anwalt, der 1810 und 1811 die Prozesse Hohenlohe-Ingelfingens vor dem Tribunal in Kalisch führte. Die Schreibung seines Namens ist nicht geklärt.
giese:
  bio: Johann Giese, one of three townsmen who took the estate of Oleśnica in hereditary lease in February 1804. They paid half the entry money and then fell into arrears.
  bio_de: Johann Giese, einer von drei Bürgern, die im Februar 1804 das Gut Olesnica in Erbpacht nahmen. Sie zahlten die Hälfte des Einstandsgelds und gerieten dann in Rückstand.
seehausen:
  life: "d. by 1816"
  bio: Major Johann Friedrich von Seehausen lent Hohenlohe-Ingelfingen 5,000 Rthl in 1803 against a mortgage on Szetlewek. He had died by 1816, leaving his sister, the widow von Brehmer, as heir.
  bio_de: Major Johann Friedrich von Seehausen lieh Hohenlohe-Ingelfingen 1803 gegen eine Hypothek auf Szetlewek 5.000 Rthl. Er war 1816 verstorben; Erbin war seine Schwester, die Witwe von Brehmer.
haugwitz:
  life: "1752-1832"
  bio: Count Christian von Haugwitz, Prussian foreign minister until 1806. Triebenfeld mentions him among the ministers in Berlin.
  bio_de: Graf Christian von Haugwitz, preußischer Außenminister bis 1806. Triebenfeld erwähnt ihn unter den Ministern in Berlin.
lipski:
  bio: An appellate judge who took over the Trąbczyn estates in October 1807 on the order of the governing commission and handed them to the representative of Frau von Dąbska. A Count Lipski appears in 1812 as public prosecutor at Kalisz.
  bio_de: Ein Appellationsrichter, der im Oktober 1807 auf Anordnung der regierenden Kommission die Trąbczyner Güter übernahm und dem Bevollmächtigten der Frau von Dąbska übergab. Ein Graf Lipski erscheint 1812 als Generalprokurator in Kalisch.
asch:
  bio: A Jewish creditor in Berlin, holder with Gad of a bill for 11,000 Rthl that Triebenfeld had signed for Hohenlohe-Ingelfingen in 1801.
  bio_de: Ein jüdischer Gläubiger in Berlin, mit Gad Inhaber eines Wechsels über 11.000 Rthl, den Triebenfeld 1801 für Hohenlohe-Ingelfingen unterschrieben hatte.
hirschel:
  bio: Abraham Moses Hirschel, a creditor with 2,000 Rthl registered on the lordship of Pszczew.
  bio_de: Abraham Moses Hirschel, ein Gläubiger mit 2.000 Rthl, die auf die Herrschaft Betsche eingetragen waren.
rapacki:
  bio: A Polish agent or lawyer who supplied documents and evidence in the Broniewski and Prusimska disputes between 1799 and 1806.
  bio_de: Ein polnischer Bevollmächtigter oder Anwalt, der zwischen 1799 und 1806 in den Streitigkeiten mit Broniewski und der Prusimska Urkunden und Beweise beibrachte.
scharnhorst:
  life: "1755-1813"
  bio: Gerhard von Scharnhorst, Prussian general and army reformer. In 1809 a matter concerning Massenbach waited on him, and in 1810 Triebenfeld reports that he spoke of Hohenlohe-Ingelfingen at Koźle.
  bio_de: Gerhard von Scharnhorst, preußischer General und Heeresreformer. 1809 hing eine Massenbach betreffende Sache an ihm, und 1810 berichtet Triebenfeld, er habe in Cosel von Hohenlohe-Ingelfingen gesprochen.
simon:
  bio: A merchant for whom a sum was registered on Kamionna and Kolno, and against which the bank official Leixner borrowed.
  bio_de: Ein Kaufmann, für den eine Summe auf Kaemen und Kolno eingetragen war und auf die der Bankbeamte Leixner Geld aufnahm.
sprengel:
  bio: A surveyor who measured the estate of Szetlewek in 1798 at 1,724 Morgen.
  bio_de: Ein Vermesser, der 1798 das Gut Szetlewek mit 1.724 Morgen aufnahm.
titz:
  bio: Carl Titz, forest inspector of Hohenlohe-Ingelfingen on the Trąbczyn estates, who took five Hufen of the Trąbczyn farm on hereditary lease in 1805.
  bio_de: Carl Titz, Forstinspektor Hohenlohe-Ingelfingens auf den Trąbczyner Gütern, der 1805 fünf Hufen des Vorwerks Trąbczyn in Erbzins nahm.
albrecht:
  life: "1765-1835"
  bio: Daniel Ludwig Albrecht, Prussian cabinet councillor. In 1809 a matter of inheritance was referred to him at Königsberg, and in 1815 Triebenfeld asked him to obtain the King's decision on the Courland debt.
  bio_de: Daniel Ludwig Albrecht, preußischer Kabinettsrat. 1809 wurde ihm in Königsberg eine Erbschaftssache zugewiesen, und 1815 bat Triebenfeld ihn, die Entscheidung des Königs über die kurländische Schuld zu erwirken.
landskoy:
  life: "1754-1831"
  bio: Vasily Sergeyevich Lanskoy, head of the Russian provisional government of the Duchy of Warsaw from 1813 to 1815. Triebenfeld feared the influence that Prusimska's husband had with him.
  bio_de: Wassili Sergejewitsch Lanskoi, von 1813 bis 1815 Leiter der russischen provisorischen Regierung des Herzogtums Warschau. Triebenfeld fürchtete den Einfluss, den der Ehemann der Prusimska bei ihm hatte.
merckel:
  bio: A councillor named in 1809 and 1813. Possibly Friedrich Theodor von Merckel (1775-1846), later chief president of Silesia.
  bio_de: Ein 1809 und 1813 genannter Rat. Möglicherweise Friedrich Theodor von Merckel (1775-1846), später Oberpräsident von Schlesien.
jordan:
  life: "1773-1848"
  bio: Johann Ludwig von Jordan, counsellor of legation in Hardenberg's chancery at the Congress of Vienna.
  bio_de: Johann Ludwig von Jordan, Legationsrat in Hardenbergs Kanzlei auf dem Wiener Kongress.
schulze:
  bio: Privy councillor of finance in the South Prussian department in Berlin, who handled the proposal to exchange the estates for Krotoszyn in 1798.
  bio_de: Geheimer Finanzrat im südpreußischen Departement in Berlin, der 1798 den Vorschlag bearbeitete, die Güter gegen Krotoszyn zu tauschen.
schlieben:
  bio: Colonel von Schlieben held a royal grant of the estate of Witów, which Hohenlohe-Ingelfingen bought from his widow and heirs in 1799. The family remained creditors for the rest of the price.
  bio_de: Oberst von Schlieben besaß durch königliche Verleihung das Gut Wittow, das Hohenlohe-Ingelfingen 1799 von seiner Witwe und seinen Erben kaufte. Die Familie blieb Gläubigerin für den Rest des Kaufpreises.
prinz-wilhelm:
  life: "1783-1851"
  bio: Prince Wilhelm of Prussia, youngest brother of Friedrich Wilhelm III. He is mentioned at the congresses of Erfurt in 1808 and Vienna in 1814.
  bio_de: Prinz Wilhelm von Preußen, jüngster Bruder Friedrich Wilhelms III. Er wird bei den Kongressen von Erfurt 1808 und Wien 1814 erwähnt.
sanitz:
  bio: Colonel, later major general, von Sanitz, an officer of Hohenlohe-Ingelfingen's regiment. He was granted other estates confiscated from Prusimski in 1796 and lost them in 1807; his claim for compensation was still alive in 1826.
  bio_de: Oberst, später Generalmajor von Sanitz, Offizier im Regiment Hohenlohe-Ingelfingens. Er erhielt 1796 andere Prusimski konfiszierte Güter und verlor sie 1807; sein Entschädigungsanspruch lief noch 1826.
chemski:
  bio: A party to a lawsuit over the South Prussian estates, which he lost in two instances in 1798 and 1799.
  bio_de: Partei in einem Prozess um die südpreußischen Güter, den er 1798 und 1799 in zwei Instanzen verlor.
otto:
  bio: A valuer whose estimates the letters cite, among them one that put Trąbczyn at no more than 160,000 Rthl. Triebenfeld rejected it.
  bio_de: Ein Taxator, dessen Anschläge die Briefe anführen, darunter einer, der Trąbczyn auf höchstens 160.000 Rthl ansetzte. Triebenfeld verwarf ihn.
rhode:
  bio: Named in four letters between 1805 and 1810. The edition has not established who he was.
  bio_de: Zwischen 1805 und 1810 in vier Briefen genannt. Wer er war, hat die Edition nicht ermittelt.
struensee:
  life: "1735-1804"
  bio: Carl August von Struensee, Prussian minister of finance. In 1798 he had to lay the papers on the proposed exchange before the King.
  bio_de: Carl August von Struensee, preußischer Finanzminister. 1798 hatte er dem König die Akten über den vorgeschlagenen Tausch vorzulegen.
chomanowski:
  bio: A court bailiff in the Duchy of Warsaw, who examined the accounts of the Zagórów estates in 1812.
  bio_de: Ein Komornik (Gerichtsvollzieher) im Herzogtum Warschau, der 1812 die Rechnungen der Zagorower Güter prüfte.
kaleschke:
  bio: Clerk of the von Stillfried patrimonial court at Górzyce near Wrocław, which certified the general power of attorney given to Triebenfeld in 1805.
  bio_de: Aktuar des von Stillfriedschen Patrimonialgerichts in Guhrwitz bei Breslau, das die 1805 Triebenfeld erteilte Generalvollmacht beglaubigte.
koeppen:
  bio: Justiciary of the von Stillfried patrimonial court at Górzyce near Wrocław, which certified the general power of attorney given to Triebenfeld in 1805.
  bio_de: Justitiar des von Stillfriedschen Patrimonialgerichts in Guhrwitz bei Breslau, das die 1805 Triebenfeld erteilte Generalvollmacht beglaubigte.
massenbach:
  life: "1758-1827"
  bio: Christian von Massenbach, Prussian colonel and chief of staff to Hohenlohe-Ingelfingen in 1806, later a political writer. Triebenfeld names him as an author of a pamphlet attacking the Prince.
  bio_de: Christian von Massenbach, preußischer Oberst und 1806 Generalquartiermeister Hohenlohe-Ingelfingens, später politischer Schriftsteller. Triebenfeld nennt ihn als einen Verfasser einer Schmähschrift gegen den Fürsten.
nathan:
  bio: Salomon Nathan, a creditor named in the contracts and letters between 1804 and 1806.
  bio_de: Salomon Nathan, ein Gläubiger, der zwischen 1804 und 1806 in den Verträgen und Briefen genannt wird.
ogrodowicz:
  bio: An official named in the certifications of the lease contracts of 1806.
  bio_de: Ein Beamter, der in den Beglaubigungen der Erbpachtverträge von 1806 genannt wird.
tschachmann:
  bio: Johann Gottlieb Tschachmann, district administrator, who took 20 Hufen at Trąbczyn on hereditary lease in 1805 with the right to resell them in parcels.
  bio_de: Johann Gottlieb Tschachmann, Landrat, der 1805 in Trąbczyn 20 Hufen in Erbpacht nahm, mit dem Recht, sie stückweise weiterzuverkaufen.
wedel:
  bio: An official at Wrocław in 1798 and 1799, whose opinion on the exchange for Krotoszyn Triebenfeld called false.
  bio_de: Ein Beamter in Breslau 1798 und 1799, dessen Gutachten zum Tausch gegen Krotoszyn Triebenfeld als falsch bezeichnete.
radziwill:
  life: "1775-1833"
  bio: Prince Antoni Radziwiłł, Polish magnate and from 1815 Prussian governor of the Grand Duchy of Posen. Triebenfeld reports his dispute with Zerboni in early 1816.
  bio_de: Fürst Antoni Radziwiłł, polnischer Magnat und seit 1815 preußischer Statthalter des Großherzogtums Posen. Triebenfeld berichtet Anfang 1816 von seinem Streit mit Zerboni.
gneisenau:
  life: "1760-1831"
  bio: August Neidhardt von Gneisenau, Prussian general, chief of staff of the Silesian army in 1813. Triebenfeld delivered a letter of Hohenlohe-Ingelfingen to him at Nysa in June 1813.
  bio_de: August Neidhardt von Gneisenau, preußischer General, 1813 Generalstabschef der Schlesischen Armee. Triebenfeld übergab ihm im Juni 1813 in Neisse ein Schreiben Hohenlohe-Ingelfingens.
kuh:
  bio: The brothers Kuh, Jewish bankers and creditors. They sued Triebenfeld in 1800 and were among those who complained against Cosmar in 1815.
  bio_de: Die Gebrüder Kuh, jüdische Bankiers und Gläubiger. Sie verklagten Triebenfeld 1800 und gehörten 1815 zu denen, die sich über Cosmar beschwerten.
koppe:
  bio: Secretary and later assessor in the service of Hohenlohe-Ingelfingen, through whom Triebenfeld learned in October 1806 that the Prince had survived the defeat.
  bio_de: Sekretär und später Assessor im Dienst Hohenlohe-Ingelfingens, durch den Triebenfeld im Oktober 1806 erfuhr, dass der Fürst die Niederlage überlebt hatte.
biron:
  bio: A Prince Biron of Courland, landowner in Silesia, who passed on an inquiry about the Kamionna estates in 1804. Probably Gustav Kalixt von Biron (1780-1821).
  bio_de: Ein Prinz Biron von Kurland, Grundbesitzer in Schlesien, der 1804 eine Anfrage wegen der Kaemener Güter weitergab. Vermutlich Gustav Kalixt von Biron (1780-1821).
schuckmann:
  life: "1755-1834"
  bio: Friedrich von Schuckmann, Prussian official, named as a president in 1800, and from 1814 minister of the interior. In 1820 the foreign ministry left it to him to inform the Hohenlohe heirs and Count Bethusy of the Russian refusal.
  bio_de: Friedrich von Schuckmann, preußischer Beamter, 1800 als Präsident genannt, seit 1814 Innenminister. 1820 überließ ihm das Außenministerium, die Hohenloher Erben und Graf Bethusy von der russischen Ablehnung zu unterrichten.
mencke:
  life: "1752-1801"
  bio: Anastasius Ludwig Mencken, cabinet councillor to Friedrich Wilhelm III. Triebenfeld wrote to him in 1798 about the exchange for Krotoszyn.
  bio_de: Anastasius Ludwig Mencken, Kabinettsrat Friedrich Wilhelms III. Triebenfeld schrieb ihm 1798 wegen des Tausches gegen Krotoszyn.
zychlinski:
  bio: A former district administrator, later sub-prefect at Kalisz in the Duchy of Warsaw.
  bio_de: Ein früherer Landrat, später Unterpräfekt in Kalisch im Herzogtum Warschau.
melzig:
  bio: Judicial burgomaster on the estates, whom Triebenfeld reproved in 1808 for not collecting the townspeople's debts and who was to conduct lawsuits in 1810.
  bio_de: Justizbürgermeister auf den Gütern, den Triebenfeld 1808 rügte, weil er die Schulden der Bürger nicht eintrieb, und der 1810 Prozesse führen sollte.
floricke:
  bio: A lessee on the Zagórów estates, against whom and whose partners Triebenfeld obtained a payment order in 1804.
  bio_de: Ein Pächter auf den Zagorower Gütern, gegen den und dessen Mitpächter Triebenfeld 1804 ein Zahlungsdekret erwirkte.
fischbach:
  bio: Carl Theodor Fischbach of Pszczew, for whom a title was requested in 1799 and who offered in 1810 to broker the exchange with von Knobelsdorff.
  bio_de: Carl Theodor Fischbach aus Betsche, für den 1799 ein Titel erbeten wurde und der 1810 anbot, den Tausch mit von Knobelsdorff zu vermitteln.
boidelang:
  bio: A friend of Triebenfeld and confidant of Humboldt, expected in late 1815 to succeed Barbe in Hardenberg's office.
  bio_de: Ein Freund Triebenfelds und Vertrauter Humboldts, der Ende 1815 als Nachfolger Barbes in Hardenbergs Büro erwartet wurde.
eugen-wuerttemberg:
  life: "1788-1857"
  bio: Duke Eugen of Württemberg, a general in Russian service and nephew of the Dowager Empress. In 1820 he recommended to the Russian government the claims of the Hohenlohe heirs and of Count Bethusy.
  bio_de: Herzog Eugen von Württemberg, General in russischen Diensten und Neffe der Kaiserinmutter. 1820 empfahl er der russischen Regierung die Ansprüche der Hohenloher Erben und des Grafen Bethusy.
hoffmann-legationsrath:
  life: "1765-1847"
  bio: An official of the Prussian foreign ministry who initialled its drafts of 1816 and 1820. Probably Johann Gottfried Hoffmann, economist and councillor of state, whose dates are given here.
  bio_de: Ein Beamter des preußischen Außenministeriums, der dessen Entwürfe von 1816 und 1820 paraphierte. Vermutlich Johann Gottfried Hoffmann, Nationalökonom und Staatsrat, dessen Lebensdaten hier stehen.
chwalowski:
  bio: A sworn surveyor who measured Oleśnica with Cabanis and Winitzki.
  bio_de: Ein vereidigter Vermesser, der mit Cabanis und Winitzki Olesnica vermaß.
dohna:
  bio: A Count Dohna named in 1809 and 1810, probably Alexander zu Dohna-Schlobitten, Prussian minister of the interior in those years.
  bio_de: Ein 1809 und 1810 genannter Graf Dohna, vermutlich Alexander zu Dohna-Schlobitten, in diesen Jahren preußischer Innenminister.
flesch:
  bio: A broker in a proposed exchange of estates in 1810, whom Triebenfeld came to suspect of fraud.
  bio_de: Ein Unterhändler bei einem 1810 vorgeschlagenen Gütertausch, den Triebenfeld bald des Betrugs verdächtigte.
kleist:
  bio: Two men. A General Kleist repeated at Kalisz in 1812 a charge that Triebenfeld pocketed the estate revenues; a chief forester von Kleist is named in 1813.
  bio_de: Zwei Männer. Ein General Kleist wiederholte 1812 in Kalisch den Vorwurf, Triebenfeld stecke die Gutseinkünfte ein; ein Oberforstmeister von Kleist wird 1813 genannt.
massow:
  bio: A Prussian official named in 1809 and 1810. The letters do not say which bearer of the name is meant.
  bio_de: Ein 1809 und 1810 genannter preußischer Beamter. Welcher Träger des Namens gemeint ist, sagen die Briefe nicht.
pirch:
  bio: Major von Pirch, whom Triebenfeld in 1809 called the truest friend of Hohenlohe-Ingelfingen at the court in Königsberg.
  bio_de: Major von Pirch, den Triebenfeld 1809 den treuesten Freund Hohenlohe-Ingelfingens am Hof in Königsberg nannte.
szczucki:
  bio: A neighbouring landowner in dispute with the estate at Szetlewek around 1799, whom Triebenfeld intended to sue in 1805.
  bio_de: Ein benachbarter Gutsbesitzer, um 1799 bei Szetlewek mit dem Gut im Streit, den Triebenfeld 1805 verklagen wollte.
werner:
  bio: A cabinet councillor who claimed a commission of two per cent in 1804 for proposing a buyer for Kamionna and Kolno.
  bio_de: Ein Kabinettsrat, der 1804 zwei Prozent Provision dafür forderte, einen Käufer für Kaemen und Kolno vorgeschlagen zu haben.
chmara:
  bio: Jan Chmara, one of the two representatives of the townspeople and villages of Pszczew in the purchase of the lordship in 1804.
  bio_de: Jan Chmara, einer der beiden Vertreter der Bürger und Dörfer von Betsche beim Kauf der Herrschaft 1804.
falkenhausen:
  bio: Named in 1809 as sent by Archduke Ferdinand, and again in 1815. The edition has not established who he was.
  bio_de: 1809 als Abgesandter des Erzherzogs Ferdinand genannt, und erneut 1815. Wer er war, hat die Edition nicht ermittelt.
feller:
  bio: Named in the Pszczew contract of 1804.
  bio_de: Im Betscher Vertrag von 1804 genannt.
guderian:
  bio: An attorney who held Leixner's power of attorney in the purchase of Kamionna and Kolno. Triebenfeld thought him in league with Broniewski.
  bio_de: Ein Bevollmächtigter Leixners beim Kauf von Kaemen und Kolno. Triebenfeld hielt ihn für einen Verbündeten Broniewskis.
luka:
  bio: Samuel Lucke, a miller at Białobrzeg, who agreed in 1798 to buy the farm of Szetlewek for 12,333 Rthl and gave up the contract the next year.
  bio_de: Samuel Lucke, Müller in Białobrzeg, der 1798 das Vorwerk Szetlewek für 12.333 Rthl kaufen wollte und den Vertrag im folgenden Jahr aufgab.
mlynkiewicz:
  bio: Matheus Młynkiewicz, one of the two representatives of the townspeople and villages of Pszczew in the purchase of the lordship in 1804.
  bio_de: Matheus Młynkiewicz, einer der beiden Vertreter der Bürger und Dörfer von Betsche beim Kauf der Herrschaft 1804.
reinhardt:
  bio: Named in 1798 as a correspondent on official business and in 1804 at Poznań. Too little is said to identify him.
  bio_de: 1798 als Korrespondent in Amtssachen und 1804 in Posen genannt. Für eine Identifizierung ist zu wenig gesagt.
heuthausen:
  bio: An agent of Hohenlohe-Ingelfingen, recommended in 1811 for collecting arrears at Pszczew and later sent to Kalisz to examine the mortgage books.
  bio_de: Ein Bevollmächtigter Hohenlohe-Ingelfingens, 1811 für die Eintreibung der Rückstände in Betsche empfohlen und später nach Kalisch gesandt, um die Hypothekenbücher zu prüfen.
ludolff:
  bio: A councillor who valued the estates of Kamionna and Kolno for a prospective buyer in 1804.
  bio_de: Ein Rat, der 1804 die Güter Kaemen und Kolno für einen Kaufinteressenten taxierte.
prinz-alexander:
  bio: A younger son of Hohenlohe-Ingelfingen, for whom Triebenfeld suggested in 1811 that Koszęcin might be kept as an entail.
  bio_de: Ein jüngerer Sohn Hohenlohe-Ingelfingens, für den Triebenfeld 1811 vorschlug, Koschentin als Majorat zu behalten.
ruechel:
  life: "1754-1823"
  bio: Ernst von Rüchel, Prussian general, who commanded a corps beside Hohenlohe-Ingelfingen at Jena in 1806.
  bio_de: Ernst von Rüchel, preußischer General, der 1806 bei Jena neben Hohenlohe-Ingelfingen ein Korps befehligte.
repnin:
  life: "1734-1801"
  bio: Prince Nikolai Vasilyevich Repnin, Russian field marshal, in Berlin on a diplomatic mission in 1798.
  bio_de: Fürst Nikolai Wassiljewitsch Repnin, russischer Feldmarschall, 1798 in diplomatischer Mission in Berlin.
ortel:
  bio: A lieutenant general at Neustadt in Silesia in June 1813, to whom Triebenfeld took his plan for supplying the army.
  bio_de: Ein Generalleutnant im Juni 1813 in Neustadt in Schlesien, dem Triebenfeld seinen Plan zur Verpflegung der Armee vortrug.
seegebarth:
  bio: An official of the General Post Office in Berlin and a creditor, whom Triebenfeld wished to put off in 1810.
  bio_de: Ein Beamter des Generalpostamts in Berlin und Gläubiger, den Triebenfeld 1810 vertrösten wollte.
wratislaw:
  bio: A Count Wratislaw, a former guardian, concerned in 1809 with an inheritance that Triebenfeld laid before the Queen.
  bio_de: Ein Graf Wratislaw, früherer Vormund, 1809 mit einer Erbschaft befasst, die Triebenfeld der Königin vortrug.
mitschke:
  bio: Justice commissioner and advocate at Kalisz, instructed in 1811 to sue for the invalid fund.
  bio_de: Justizkommissar und Advokat in Kalisch, 1811 beauftragt, für die Invalidenkasse zu klagen.
hussarzewski:
  bio: A government councillor at Kalisz, through whom the Oleśnica case went back to the patrimonial court in 1805.
  bio_de: Ein Regierungsrat in Kalisch, über den die Olesnicer Sache 1805 an das Patrimonialgericht zurückging.
bertrand:
  life: "1773-1844"
  bio: Henri-Gatien Bertrand, French general and Grand Marshal of the Palace, who accompanied Napoleon to Elba and back in 1815.
  bio_de: Henri-Gatien Bertrand, französischer General und Großmarschall des Palastes, der Napoleon nach Elba und 1815 zurück begleitete.
schulz-wilhelm-daniel:
  bio: A settler from Krolikowo, one of six who took the farm of Althütte on hereditary lease in 1804.
  bio_de: Ein Siedler aus Krolikowo, einer von sechs, die 1804 das Vorwerk Althütte in Erbpacht nahmen.
bagans:
  bio: Johann Bagans, one of three townsmen who took the estate of Oleśnica in hereditary lease in February 1804.
  bio_de: Johann Bagans, einer von drei Bürgern, die im Februar 1804 das Gut Olesnica in Erbpacht nahmen.
gietzinger:
  bio: Friedrich Gietzinger, one of three townsmen who took the estate of Oleśnica in hereditary lease in February 1804.
  bio_de: Friedrich Gietzinger, einer von drei Bürgern, die im Februar 1804 das Gut Olesnica in Erbpacht nahmen.
zajaczek:
  life: "1752-1826"
  bio: Józef Zajączek, Polish general and from 1815 the Tsar's viceroy in the Kingdom of Poland. His report of 1819 on Count Bethusy's request is enclosed with the Russian note of 1820.
  bio_de: Józef Zajączek, polnischer General und seit 1815 Statthalter des Zaren im Königreich Polen. Sein Bericht von 1819 über das Gesuch des Grafen Bethusy liegt der russischen Note von 1820 bei.
amstetten:
  bio: A general who headed a commission at the Congress of Vienna to which Triebenfeld submitted the papers on Trąbczyn in 1815. Possibly the Russian diplomat Johann von Anstett.
  bio_de: Ein General, der auf dem Wiener Kongress eine Kommission leitete, bei der Triebenfeld 1815 die Akten über Trąbczyn einreichte. Möglicherweise der russische Diplomat Johann von Anstett.
brandenstein:
  bio: Party to a contract with Leixner concerning Pszczew, whose cancellation the purchasers demanded in 1804.
  bio_de: Partei eines Vertrags mit Leixner über Betsche, dessen Aufhebung die Käufer 1804 verlangten.
bulow:
  life: "1774-1825"
  bio: Ludwig Friedrich Viktor Hans von Bülow, Prussian minister of finance from 1813. In December 1814 an order went to him and to Kircheisen to set up an inquiry into Cosmar.
  bio_de: Ludwig Friedrich Viktor Hans von Bülow, preußischer Finanzminister seit 1813. Im Dezember 1814 erging an ihn und an Kircheisen der Befehl, eine Untersuchung gegen Cosmar einzusetzen.
goerne:
  bio: Named in two letters of 1798 and 1800. The edition has not established who he was.
  bio_de: In zwei Briefen von 1798 und 1800 genannt. Wer er war, hat die Edition nicht ermittelt.
kurnatowski:
  bio: Named in two letters of 1815 and 1816. The edition has not established who he was.
  bio_de: In zwei Briefen von 1815 und 1816 genannt. Wer er war, hat die Edition nicht ermittelt.
smidkowski:
  bio: A lessee on the Trąbczyn estates who offered in 1810 to pay several thousand Rthl at once in order to stay.
  bio_de: Ein Pächter auf den Trąbczyner Gütern, der 1810 anbot, sogleich mehrere tausend Rthl zu zahlen, um bleiben zu können.
smiedecki:
  bio: Chief prefect at Kalisz in 1816, whom Triebenfeld believed he had won for a favourable report on the compensation claim.
  bio_de: Oberpräfekt in Kalisch 1816, den Triebenfeld für einen günstigen Bericht über den Entschädigungsanspruch gewonnen zu haben glaubte.
bewert:
  bio: Named once in a contract of 1805.
  bio_de: Einmal in einem Vertrag von 1805 genannt.
gelanski:
  bio: Florian Gelanski, named once in a document of 1799 concerning Szetlewek.
  bio_de: Florian Gelanski, einmal in einem Dokument von 1799 über Szetlewek genannt.
graevenitz:
  bio: Probably the Berlin councillor Grevenitz, who has his own entry; the name is written both ways.
  bio_de: Vermutlich der Berliner Rat Grevenitz, der einen eigenen Eintrag hat; der Name wird auf beide Weisen geschrieben.
gunter:
  bio: Named once in a document of 1799.
  bio_de: Einmal in einem Dokument von 1799 genannt.
hache:
  bio: A von Hache, named once in 1809 beside Major von Pirch at Königsberg.
  bio_de: Ein von Hache, 1809 einmal neben Major von Pirch in Königsberg genannt.
hertzog:
  bio: Named once in a document of 1799.
  bio_de: Einmal in einem Dokument von 1799 genannt.
jankowski:
  bio: Joseph von Jankowski of Ninino, who sold the free mayor's holding at Dormowo to Captain Gneust in 1797.
  bio_de: Joseph von Jankowski aus Ninino, der 1797 das Freischulzengut in Dormowo an Hauptmann Gneust verkaufte.
knoblauch:
  bio: Named once in a document of 1803.
  bio_de: Einmal in einem Dokument von 1803 genannt.
sarre:
  bio: Gottlieb Sarre, a settler from the Pyzdry Hauland, who took a Hufe and a half of forest land near Trąbczyn on hereditary lease in 1806. The Polish text of the contract calls him Bogumił.
  bio_de: Gottlieb Sarre, ein Hauländer aus dem Peiserner Hauland, der 1806 anderthalb Hufen Waldland bei Trąbczyn in Erbpacht nahm. Der polnische Text des Vertrags nennt ihn Bogumił.
schmaling:
  bio: Named once in a contract of 1804.
  bio_de: Einmal in einem Vertrag von 1804 genannt.
stade:
  bio: Named once in a contract of 1805.
  bio_de: Einmal in einem Vertrag von 1805 genannt.
stillfried:
  bio: The Barons von Stillfried, lords of Górzyce near Wrocław, whose patrimonial court certified the general power of attorney given to Triebenfeld in 1805.
  bio_de: Die Freiherren von Stillfried, Herren von Guhrwitz bei Breslau, deren Patrimonialgericht die 1805 Triebenfeld erteilte Generalvollmacht beglaubigte.
goetzen:
  life: "1767-1820"
  bio: Count Friedrich Wilhelm von Götzen, Prussian general and governor of Silesia in 1807 and 1808. Triebenfeld named him in 1809 as a witness in a matter of inheritance.
  bio_de: Graf Friedrich Wilhelm von Götzen, preußischer General und 1807 und 1808 Gouverneur von Schlesien. Triebenfeld nannte ihn 1809 als Zeugen in einer Erbschaftssache.
poniatowski:
  life: "1763-1813"
  bio: Prince Józef Poniatowski, minister of war of the Duchy of Warsaw. A letter of his in 1811 led the tribunal at Kalisz to refer the Trąbczyn case to higher authority.
  bio_de: Fürst Józef Poniatowski, Kriegsminister des Herzogtums Warschau. Ein Schreiben von ihm veranlasste 1811 das Tribunal in Kalisch, die Trąbczyner Sache an eine höhere Stelle zu verweisen.
veit:
  bio: A Berlin banker who paid Triebenfeld 3,000 Rthl for Hohenlohe-Ingelfingen in 1808.
  bio_de: Ein Berliner Bankier, der Triebenfeld 1808 für Hohenlohe-Ingelfingen 3.000 Rthl auszahlte.
thaer:
  life: "1752-1828"
  bio: Albrecht Daniel Thaer, agronomist and founder of the agricultural academy at Möglin. Hohenlohe-Ingelfingen mentions him in a letter of 1811.
  bio_de: Albrecht Daniel Thaer, Agrarwissenschaftler und Gründer der landwirtschaftlichen Akademie in Möglin. Hohenlohe-Ingelfingen erwähnt ihn in einem Brief von 1811.
bubna:
  life: "1768-1825"
  bio: Count Ferdinand von Bubna und Littitz, Austrian general, mentioned in Triebenfeld's news from Vienna in 1815.
  bio_de: Graf Ferdinand von Bubna und Littitz, österreichischer General, 1815 in Triebenfelds Nachrichten aus Wien erwähnt.
knobloch:
  bio: An official named in 1799, with Prittwitz, as one of those who were to settle the exchange for Krotoszyn.
  bio_de: Ein Beamter, 1799 zusammen mit Prittwitz als einer derjenigen genannt, die den Tausch gegen Krotoszyn regeln sollten.
reinbeck:
  bio: A privy councillor in Berlin who handled the approval of the division of the estates in 1805.
  bio_de: Ein Geheimer Rat in Berlin, der 1805 die Genehmigung der Teilung der Güter bearbeitete.
roeder:
  bio: A General von Roeder named in 1813. Probably Friedrich Erhard von Röder (1768-1834).
  bio_de: Ein 1813 genannter General von Roeder. Vermutlich Friedrich Erhard von Röder (1768-1834).
valentini:
  bio: A Prussian staff officer named in June 1813.
  bio_de: Ein im Juni 1813 genannter preußischer Stabsoffizier.
schroeder:
  bio: A councillor named once in a letter from Vienna in 1815.
  bio_de: Ein Rat, einmal in einem Brief aus Wien von 1815 genannt.
kielczewski:
  bio: President of the tribunal at Kalisz in the Duchy of Warsaw, named in 1811.
  bio_de: Präsident des Tribunals in Kalisch im Herzogtum Warschau, 1811 genannt.
wiener:
  bio: A merchant who offered in 1810 to buy Triebenfeld's estate of Świniary.
  bio_de: Ein Kaufmann, der 1810 anbot, Triebenfelds Gut Schweinern zu kaufen.
koppen:
  bio: Named in 1808 as the person to whom papers of Hohenlohe-Ingelfingen were to be passed. Possibly the assessor Koppe, who has his own entry.
  bio_de: 1808 als derjenige genannt, an den Papiere Hohenlohe-Ingelfingens weiterzugeben waren. Möglicherweise der Assessor Koppe, der einen eigenen Eintrag hat.
wiesolowski:
  bio: A colonel and cousin of Triebenfeld, who passed on news of Russian troop movements in 1805.
  bio_de: Ein Oberst und Vetter Triebenfelds, der 1805 Nachrichten über russische Truppenbewegungen weitergab.
scharffenberg:
  bio: A colonel named once in 1810.
  bio_de: Ein Oberst, 1810 einmal genannt.
gumperts:
  bio: A medical councillor at Kalisz who was negotiating with Count Wartensleben in 1811 for the estate Triebenfeld wanted.
  bio_de: Ein Medizinalrat in Kalisch, der 1811 mit Graf Wartensleben über das Gut verhandelte, das Triebenfeld wünschte.
schulz-strelitz:
  bio: Postmaster at Strelitz, named once in 1809.
  bio_de: Postmeister in Strelitz, 1809 einmal genannt.
itzig:
  bio: A Jewish creditor from whom Amelang called in 18,000 Rthl in 1805; the name is a doubtful reading. Probably of the Berlin banking family Itzig.
  bio_de: Ein jüdischer Gläubiger, bei dem Amelang 1805 18.000 Rthl kündigte; der Name ist unsicher gelesen. Vermutlich aus der Berliner Bankiersfamilie Itzig.
echtler:
  bio: A dealer or maker named once in 1805 as likely to have plaster busts finished like bronze.
  bio_de: Ein Händler oder Hersteller, 1805 einmal genannt, weil er vermutlich bronzierte Gipsbüsten vorrätig habe.
erbet:
  bio: Christoph Erbet, a settler of the Trąbczyn Hauland, who took one Hufe of the Trąbczyn forest on hereditary lease on 31 March 1806. He signed with a cross.
  bio_de: Christoph Erbet, Siedler im Trąbczyner Hauland, der am 31. März 1806 eine Hufe des Trąbczyner Forstes in Erbpacht nahm. Er unterzeichnete mit einem Kreuz.
baildon:
  life: "1772-1846"
  bio: John Baildon, Scottish engineer in Prussian service and a pioneer of coke iron smelting in Upper Silesia. He was partner of Hohenlohe-Ingelfingen in the coke blast furnace at the Sławięcice works, and the will of 1805 tells the heir to keep him.
  bio_de: John Baildon, schottischer Ingenieur in preußischen Diensten und Wegbereiter der Kokshochöfen in Oberschlesien. Er war Teilhaber Hohenlohe-Ingelfingens am Kokshochofen der Schlawenschitzer Werke, und das Testament von 1805 weist den Erben an, ihn zu behalten.
prinzessin-adelheid:
  bio: Princess Adelheid, eldest daughter of Hohenlohe-Ingelfingen. Under his will of 1805 she was to inherit the Silesian ironworks and the houses in Wrocław if the male line ended.
  bio_de: Prinzessin Adelheid, älteste Tochter Hohenlohe-Ingelfingens. Nach seinem Testament von 1805 sollte sie die schlesischen Hüttenwerke und die Häuser in Breslau erben, wenn der Mannesstamm erlosch.
prinzessin-auguste:
  bio: Princess Auguste, third daughter of Hohenlohe-Ingelfingen. Under his will of 1805 she was to inherit the South Prussian estates if the male line ended.
  bio_de: Prinzessin Auguste, dritte Tochter Hohenlohe-Ingelfingens. Nach seinem Testament von 1805 sollte sie die südpreußischen Güter erben, wenn der Mannesstamm erlosch.
mondro:
  bio: Criminal councillor and legal representative of Hohenlohe-Ingelfingen, who brought the three suits against the lessees of Oleśnica in 1805.
  bio_de: Kriminalrat und Rechtsvertreter Hohenlohe-Ingelfingens, der 1805 die drei Klagen gegen die Pächter von Olesnica erhob.
winitzki:
  bio: A sworn surveyor who measured Oleśnica with Chwalowski and Cabanis.
  bio_de: Ein vereidigter Vermesser, der mit Chwalowski und Cabanis Olesnica vermaß.
bluecher:
  life: "1742-1819"
  bio: Major General von Blücher, granted the confiscated estates of Duninów in 1796 by the same order as Hohenlohe-Ingelfingen. Presumably Gebhard Leberecht von Blücher, the later field marshal, whose dates are given here.
  bio_de: Generalmajor von Blücher, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen die konfiszierten Güter Duninów verliehen wurden. Vermutlich Gebhard Leberecht von Blücher, der spätere Feldmarschall, dessen Lebensdaten hier stehen.
dolffs:
  bio: Lieutenant General von Dolffs, granted the estate of Strzelce in 1796 by the same order as Hohenlohe-Ingelfingen.
  bio_de: Generalleutnant von Dolffs, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen das Gut Strzelce verliehen wurde.
pontanus:
  bio: Major von Pontanus, granted three confiscated estates in 1796 by the same order as Hohenlohe-Ingelfingen.
  bio_de: Major von Pontanus, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen drei konfiszierte Güter verliehen wurden.
holtzendorff:
  bio: Lieutenant von Holtzendorff, granted three confiscated estates in 1796 by the same order as Hohenlohe-Ingelfingen.
  bio_de: Leutnant von Holtzendorff, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen drei konfiszierte Güter verliehen wurden.
larisch:
  life: "1734-1811"
  bio: Major General von Larisch, granted the estate of Lekarzewice in 1796 by the same order as Hohenlohe-Ingelfingen. Probably Johann Karl Leopold von Larisch, whose dates are given here.
  bio_de: Generalmajor von Larisch, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen das Gut Lekarzewice verliehen wurde. Vermutlich Johann Karl Leopold von Larisch, dessen Lebensdaten hier stehen.
von-der-reck:
  life: "1744-1816"
  bio: Eberhard von der Reck, Prussian minister of justice, to whom Hoym sent the grants of 1796 to be made out.
  bio_de: Eberhard von der Reck, preußischer Justizminister, dem Hoym die Verleihungen von 1796 zur Ausfertigung zusandte.
bever:
  bio: A registry official in Berlin who signed the note of May 1816 passing Zerboni's report to the foreign ministry, and who sent up the file on the charters of 1796 in 1826.
  bio_de: Ein Registraturbeamter in Berlin, der den Vermerk vom Mai 1816 über die Abgabe von Zerbonis Bericht an das Außenministerium unterzeichnete und 1826 die Akte über die Urkunden von 1796 vorlegte.
kuester:
  bio: An official of the State Chancellor's chancery at Vienna, who noted in November 1814 that Triebenfeld's petition had been passed to Stägemann.
  bio_de: Ein Beamter der Kanzlei des Staatskanzlers in Wien, der im November 1814 vermerkte, dass Triebenfelds Eingabe an Stägemann abgegeben war.
alopeus:
  life: "d. 1831"
  bio: David Alopaeus, Russian envoy at Berlin, who signed the note of 31 January 1820 refusing the claim of the Hohenlohe heirs.
  bio_de: David Alopaeus, russischer Gesandter in Berlin, der die Note vom 31. Januar 1820 unterzeichnete, mit der der Anspruch der Hohenloher Erben abgelehnt wurde.
ancillon:
  life: "1767-1837"
  bio: Johann Peter Friedrich Ancillon, historian and counsellor in the Prussian foreign ministry, later foreign minister. The Russian note of 1820 is addressed to him.
  bio_de: Johann Peter Friedrich Ancillon, Historiker und Rat im preußischen Außenministerium, später Außenminister. An ihn ist die russische Note von 1820 gerichtet.
sobolewski:
  life: "1770-1846"
  bio: Count Ignacy Sobolewski, minister secretary of state of the Kingdom of Poland at St Petersburg, whose reply confirmed the refusal of 1820.
  bio_de: Graf Ignacy Sobolewski, Minister-Staatssekretär des Königreichs Polen in St. Petersburg, dessen Antwort die Ablehnung von 1820 bestätigte.
strenger:
  bio: A registry clerk of the Prussian foreign ministry, who signed the note of May 1816 attaching Zerboni's report to the file.
  bio_de: Ein Registraturbeamter des preußischen Außenministeriums, der den Vermerk vom Mai 1816 unterzeichnete, mit dem Zerbonis Bericht zur Akte genommen wurde.
dabrowski:
  bio: Named once in 1804 in connection with the handover of the estate of Wieniec. Not the general of the same name, as far as the letter shows.
  bio_de: 1804 einmal im Zusammenhang mit der Übergabe des Gutes Wieniec genannt. Soweit der Brief erkennen lässt, nicht der General gleichen Namens.
magnuski:
  bio: A creditor or claimant on whose account money owed to Hohenlohe-Ingelfingen was attached in 1805.
  bio_de: Ein Gläubiger oder Anspruchsteller, dessentwegen 1805 Gelder Hohenlohe-Ingelfingens mit Arrest belegt wurden.
uminski:
  bio: A prospective buyer of the Kamionna estates in 1804, who thought the price too high.
  bio_de: Ein Kaufinteressent für die Kaemener Güter im Jahr 1804, der den Preis zu hoch fand.
zglinski:
  bio: A lessee on the estates whose lease was cancelled or shortened in 1806.
  bio_de: Ein Pächter auf den Gütern, dessen Pachtvertrag 1806 aufgehoben oder verkürzt wurde.

# Who each person on the People page is, in two or three sentences, and when
# they lived. Keyed by the person's slug (reference/people.yml, or the long
# list of vetted names). Written by hand, 2026-10-02.
#
#   life     birth and death years where known. "c." marks an estimate, and
#            "d. 1816" a death known without a birth. A person with no `life`
#            is shown with the years in which the documents name
#            them ("documented 1804-1812"), which the build works out.
#   bio      English. What the documents show the person doing; for a figure
#            known to history, who they were. Nothing here goes beyond the
#            documents and standard reference works, and a doubtful
#            identification says so.
#   bio_de   the same in German.
#
# Dates of historical figures were checked against Wikidata on 2026-10-02.
# Where the edition cannot tell which bearer of a name is meant, no dates are
# given.

triebenfeld:
  life: "b. c. 1760 (estimated), d. 1816"
  bio: Prussian Councillor of War and Forests and, from 1805, general agent of Prince Hohenlohe-Ingelfingen for his Polish estates of Trąbczyn and Zagórów. He divided them among settlers on hereditary leases, negotiated loans on them, and stood surety himself for several of the Prince's debts. From 1814 he pressed the Prince's claim to the lost estates at the Congress of Vienna. He died early in 1816; his year of birth is estimated from his adult children.
  bio_de: Peter Friedrich August von Triebenfeld, preußischer Kriegs- und Forstrat, verwaltete die südpreußischen Güter Hohenlohe-Ingelfingens und besaß seit 1805 dessen Generalvollmacht. Er schrieb die meisten Briefe und verbürgte sich für mehrere der Schulden, die er aushandelte. Sein letzter Brief ist vom 31. Januar 1816, und ein Vermerk vom 13. April 1816 nennt ihn verstorben; sein Geburtsjahr ist nicht überliefert und nach seinen erwachsenen Kindern geschätzt.
hohenlohe:
  life: "1746-1818"
  bio: Prussian general and governor of Wrocław, to whom the Prussian crown gave the confiscated Polish estates of Antoni Prusimski, Trąbczyn among them, in 1796, and sixteen former church villages, Zagórów among them, in 1797. He commanded the Prussian army defeated at Jena in 1806, surrendered to the French at Prenzlau and held no further command. The estates were taken from him in 1807, when the Duchy of Warsaw returned them to Prusimski's daughter. He died at Sławięcice in Upper Silesia.
  bio_de: Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, preußischer General und Gouverneur von Wrocław (Breslau). Die preußische Krone verlieh ihm 1796 und 1797 Güter in Südpreußen. Er befehligte 1806 bei Jena, kapitulierte bei Prenzlau und erhielt kein Kommando mehr; er starb in Sławięcice (Schlawenschitz) in Oberschlesien.
glenck:
  bio: Building and economy councillor to Prince Hohenlohe-Ingelfingen, who was the Prince's general agent and tenant for his Polish estates from 1798, made the first sales of their land, and in 1804 sold the Prince's lordship of Pszczew to its inhabitants. His successor, Peter Friedrich von Triebenfeld, blamed him for the losses the Prince suffered on those contracts and accused him of obstructing the division of the estates among settlers that followed.
  bio_de: Johann Wilhelm Glenck, Bau- und Ökonomierat Hohenlohe-Ingelfingens, verwaltete die südpreußischen Güter bis etwa 1804 und schloss die ersten Pacht- und Kaufverträge. Triebenfeld, sein Nachfolger, lastete ihm Verluste aus diesen Verträgen an und warf ihm vor, die spätere Besiedlung zu behindern.
hardenberg:
  life: "1750-1822"
  bio: Prussian State Chancellor from 1810 and Prussia's chief negotiator at the Congress of Vienna. In 1814 and 1815 Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, petitioned him for a state advance to free the Prince's entailed Silesian estates from the creditors' administrator, and for compensation for Trąbczyn, which the Duchy of Warsaw had taken from the Prince in 1807.
  bio_de: Karl August von Hardenberg, preußischer Staatskanzler seit 1810 und Preußens führender Unterhändler auf dem Wiener Kongress. Triebenfeld bat ihn 1814 und 1815 um einen Vorschuss zur Regelung der Schulden Hohenlohe-Ingelfingens und um Entschädigung für Trąbczyn.
weigel:
  bio: Banker at Wrocław and one of the two largest creditors of Prince Hohenlohe-Ingelfingen on his Silesian estate of Koszęcin. From 1810 the Prince's agent, Triebenfeld, tried to pay him and the other great creditor, Stössel, by handing over the Zagórów estates. Weigel had bought a mortgage of 30,000 Reichsthaler on Trąbczyn, which the Prince had borrowed from one Grotowski in 1800; when the Polish courts struck it out between 1819 and 1826, holding that the estate's return to Michalina Prusimska in 1807 had freed it of such debts, Prussia protested on his behalf at St Petersburg in 1827. In 1830 he asked the Kingdom of Poland for 63,100 thalers in compensation; the minister of finance had the estates valued instead, and in 1832 the valuation was ordered again.
  bio_de: Carl Ferdinand Weigel, Bankier in Wrocław (Breslau) und einer der beiden größten Gläubiger auf dem schlesischen Gut Koszęcin (Koschentin). Seit 1810 versuchte Triebenfeld, ihn und Stössel durch Übertragung der Güter von Zagórów zu befriedigen. Die Briefe sprechen auch von „Weigel und Sohn“. Er besaß Grotowskis Hypothek von 30.000 Rthl auf Trąbczyn; die polnischen Gerichte ließen sie zwischen 1819 und 1826 löschen, und Preußen protestierte 1827 in St. Petersburg. 1830 verlangte er vom Königreich Polen 63.100 Taler Entschädigung; der Finanzminister ließ stattdessen die Güter schätzen, und 1832 wurde die Schätzung erneut angeordnet.
cosmar:
  bio: Medical councillor and executor of the will of Princess Sacken, the mother-in-law of Prince Hohenlohe-Ingelfingen. Under a settlement of 1811 he administered the Prince's entailed Silesian estates on behalf of the creditors. The Prince's agent, Triebenfeld, called the settlement his fabrication and sought his removal at Vienna in 1814 and 1815; a court found against him at first instance late in 1815.
  bio_de: Medizinalrat und Testamentsvollstrecker der Fürstin Sacken. Nach einem Vergleich von 1811 verwaltete er die schlesischen Majoratsgüter Hohenlohe-Ingelfingens für die Gläubiger. Triebenfeld betrieb 1814 und 1815 in Wien seine Absetzung und nannte den Vergleich sein Machwerk; Ende 1815 unterlag er vor Gericht in erster Instanz.
czapski:
  bio: Prince, a minister of the Kingdom of Poland. In 1818, sharing the view of the commission that settled the Duchy of Warsaw's debts, he laid before the Emperor and King a report on Michalina Miączyńska's petition that the debts charged on Trąbczyn while Prussia held it be laid to Prussia's account. Not further identified, so no dates are given.
  bio_de: Fürst Czapski, ein Minister des Königreichs Polen. 1818 legte er, der Meinung der Liquidationskommission folgend, dem Kaiser und König einen entsprechenden Bericht über das Gesuch Miączyńskas vor, die Schulden auf Trąbczyn Preußen auferlegen zu lassen. Der Bericht von 1834 schreibt seinen Namen auf einer Seite Czapyski, auf der nächsten Czapski; beide meinen denselben Mann. Hier nicht weiter festgelegt, darum ohne Jahreszahlen.
koeckritz:
  life: "1744-1821"
  bio: Prussian general and adjutant general to Friedrich Wilhelm III, one of the King's closest confidants. From 1798 he supported Prince Hohenlohe-Ingelfingen at court, and in 1805 he obtained for the Prince's agent, Triebenfeld, the promise of a loan of 150,000 Reichsthaler from the Invalids' Fund, the first 50,000 of it on a mortgage of Zagórów.
  bio_de: Karl Leopold von Köckritz, preußischer General und Generaladjutant Friedrich Wilhelms III., ein enger Vertrauter des Königs. Er unterstützte Hohenlohe-Ingelfingen seit 1798 bei Hofe und vermittelte 1805 das Darlehen der Invalidenkasse.
lichnowski-kalisz:
  bio: Councillor of the South Prussian Government, the provincial court at Kalisz. In February 1805 he vouched for the identity of Peter Friedrich von Triebenfeld when Triebenfeld acknowledged before the court the bond for the Invalids' Fund's loan to Prince Hohenlohe-Ingelfingen. Whether he was one of the Lichnowski brothers who were creditors of the Prince's estates is not known.
  bio_de: Rat der Südpreußischen Regierung, des Provinzialgerichts in Kalisch, der im Februar 1805 Triebenfelds Identität bezeugte, als dieser seine Schuldverschreibung an die Invalidenkasse anerkannte. Ob er einer der Brüder Lichnowski war, die Gläubiger der Güter waren, ist nicht bekannt.
cattaneo:
  bio: Count, the Prussian resident (envoy) at Venice. In December 1796 Antoni Prusimski, the exiled owner of Trąbczyn, came to him ill and grieving, and he gave him a certificate that he was unfit to travel.
  bio_de: Graf Cattaneo, preußischer Resident (Gesandter) in Venedig. Im Dezember 1796 berichtete er, Antoni Prusimski sei krank und in Trauer zu ihm gekommen, und er habe ihm bescheinigt, dass er nicht reisen könne.
alvensleben:
  life: "1745-1802"
  bio: Count, Prussian cabinet minister from 1791. He is taken to be the first of the two ministers who signed the foreign department's letter of January 1797 reporting that Antoni Prusimski, the exiled owner of Trąbczyn, was at Venice; the identification rests on the signature's initial and on his office.
  bio_de: Graf Philipp Karl von Alvensleben, preußischer Kabinettsminister seit 1791. Er gilt als der erste der beiden Minister, die das Schreiben vom Januar 1797 unterzeichneten, mit dem das Departement der auswärtigen Angelegenheiten meldete, dass Antoni Prusimski in Venedig war; von dieser Unterschrift ist nur die Initiale zu lesen.
dambski-ludwik:
  bio: Count of Lubraniec and voivode of Brześć Kujawski. He presided over the royal commission that fixed the boundary between Trąbczyn and its neighbour Łukom in 1775, after two centuries of quarrels between their owners, and signed its decree.
  bio_de: Ludwik Dąmbski, Graf von Lubraniec und Woiwode von Brześć Kujawski. Er führte den Vorsitz der Kommission, die 1775 die Grenze zwischen Trąbczyn und Łukomia festlegte, und unterzeichnete ihr Dekret.
raumer:
  bio: Councillor of the Prussian department of foreign affairs, who in 1797 dealt with the report from Venice on Antoni Prusimski, the exiled owner of Trąbczyn, and wrote the directions on it. Probably Karl Georg von Raumer (1753-1833).
  bio_de: Rat im preußischen Departement der auswärtigen Angelegenheiten, der 1797 den Bericht über Prusimski in Venedig bearbeitete und die Verfügungen darauf unterzeichnete. Wahrscheinlich Karl Georg von Raumer (1753-1833).
schroetter:
  life: "1743-1815"
  bio: Baron, Prussian minister for East Prussia and for New East Prussia, the northern part of Prussia's share of Poland. In 1797 he passed the news that Antoni Prusimski, the exiled owner of Trąbczyn, was at Venice on to Count Hoym, minister for South Prussia, not knowing in which province Prusimski's estates lay.
  bio_de: Friedrich Leopold Freiherr von Schroetter, preußischer Minister für Ostpreußen und für Neuostpreußen, den nördlichen Teil des preußischen Anteils an Polen. 1797 gab er die Nachricht über Prusimski in Venedig an Hoym weiter, da er nicht wusste, in welcher Provinz Prusimskis Güter lagen.
heinrichs:
  bio: Councillor of the royal chamber and its commissioner for estate management. He attests under two of the hereditary leases of 1806, by which Prince Hohenlohe-Ingelfingen let the land of his Zagórów estates to settlers, that the contract was read aloud to the settlers and signed in his presence. He is not Martin Honrichs.
  bio_de: Kommissionsrat der königlichen Kammer und ihr Ökonomiekommissar, der unter zwei Erbpachtverträgen von 1806 bezeugt, dass der Vertrag den Siedlern vorgelesen und in seiner Gegenwart unterschrieben wurde. Er ist nicht Martin Honrichs.
honrichs:
  bio: One of two buyers who agreed in 1803 to buy the estate of Witów from Prince Hohenlohe-Ingelfingen and did not pay, and afterwards lessee, sequestrator and agent on the Prince's Zagórów estates. The Prince's agent, Triebenfeld, accused him of keeping back the estates' money and selling their land on his own authority, and he was arrested more than once between 1809 and 1812.
  bio_de: Martin Honrichs kaufte 1803 das Gut Witów (Wittow) und war später Pächter, Sequester und Bevollmächtigter auf den Gütern von Zagórów. Triebenfeld warf ihm vor, Geld zurückzuhalten und eigenmächtig Land zu verkaufen; zwischen 1809 und 1812 wurde er mehrfach verhaftet.
schenck:
  bio: Judicial burgomaster of Zagórów and justiciary of the patrimonial court of Prince Hohenlohe-Ingelfingen's estates there, before which the settlers' hereditary leases of 1805 and 1806 were made. He valued land and collected money for the Prince's agent, Triebenfeld, and in 1815 asked for a general power of attorney for the Prince's business at Pszczew.
  bio_de: Justizbürgermeister in Zagórów und Justitiar des Patrimonialgerichts der Güter, vor dem die Erbpachtverträge von 1805 und 1806 geschlossen wurden. Er nahm Taxen auf und zog für Triebenfeld Gelder ein; 1815 verlangte er eine Generalvollmacht für die Sache um Pszczew (Betsche).
amelang:
  life: "1755-1819"
  bio: Berlin lawyer and privy councillor, the legal agent of Prince Hohenlohe-Ingelfingen in Berlin. He arranged the Prince's loans of 1804 and 1805 on the Polish estates and conducted the lawsuits that followed them.
  bio_de: Karl Ludwig Amelang, Berliner Jurist und Geheimer Rat, Rechtsvertreter Hohenlohe-Ingelfingens in Berlin. Er betreute die Darlehen von 1804 und 1805 und die Prozesse, die daraus folgten.
barbe:
  life: "d. 1815"
  bio: Court councillor in the chancery of the Prussian State Chancellor, Hardenberg, at the Congress of Vienna. He advised Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, presented his petitions for the Prince's lost Polish estates and lent him money. He died in Paris late in 1815.
  bio_de: Hofrat in der Kanzlei des Staatskanzlers Hardenberg auf dem Wiener Kongress. Er beriet Triebenfeld, überreichte dessen Eingaben und lieh ihm Geld. Triebenfeld meldet Ende 1815 seinen Tod in Paris.
prusimska:
  life: "d. 1851"   # died 19 January 1851 (the editor, 2026-10-15)
  bio: Only child of Antoni Prusimski, Starost of Niszczewice, whose estates Prussia confiscated after the uprising of 1794 and gave to Prince Hohenlohe-Ingelfingen in 1796. In 1800, still a minor and through a guardian, she sued the Prince before the Government at Poznań for the Brzyce estates, her late mother's property; judgment was given on 9 December 1800, and in January 1802 she wrote to the King from Dresden, as a forsaken orphan, asking him to hasten her appeal. In 1807 the Governing Commission of the Duchy of Warsaw gave Trąbczyn and Kamionna back to her. She married first Dąbski and in August 1810 Stanisław Miączyński. She died on 19 January 1851, and her son Włodzimierz Miączyński held Trąbczyn after her.
  bio_de: Michalina Prusimska, einziges Kind des Starosten Antoni Prusimski, dessen konfiszierte Güter 1796 an Hohenlohe-Ingelfingen verliehen wurden. 1800 klagte sie, noch minderjährig und durch einen Vormund, vor der Regierung in Poznań (Posen) gegen Hohenlohe-Ingelfingen auf die Güter Brzyce, das Vermögen ihrer verstorbenen Mutter; am 9. Dezember 1800 wurde geurteilt, und im Januar 1802 bat sie den König aus Dresden als verlassene Waise, die Appellation zu beschleunigen. 1807 gab ihr eine Kommission des Herzogtums Warschau Trąbczyn und Kamionna (Kaemen) zurück. Sie erscheint unter ihren Ehenamen Dąbska und, seit ihrer zweiten Ehe im August 1810, Miączyńska, in den Briefen auch Moscinska geschrieben. Sie starb am 19. Januar 1851; nach ihr hatte ihr Sohn Włodzimierz Miączyński das Gut.
szepczynski:
  bio: Sworn court messenger of Trąbczyn. He inspected the Trąbczyn estate for Katarzyna Prusimska, its life tenant, in 1754, and reported twice in 1767, for Antoni Prusimski, on the embankment that flooded the land of Trąbczyn's Olęder settlers.
  bio_de: Bartłomiej Szepczyński von Trąbczyn, vereidigter Gerichtsbote. Er besichtigte 1754 das Gut Trąbczyn für Katarzyna Prusimska und berichtete 1767 zweimal für Antoni Prusimski über den Damm, der die Olęder-Siedler überschwemmte.
kosciuszko:
  life: "1746-1817"
  bio: General, and as Naczelnik the commander-in-chief of the national forces in the Polish uprising of 1794 against Russia and Prussia. Wounded and taken prisoner at Maciejowice, he lived abroad after the last partition, from 1798 in Paris, as the chief figure of the Polish emigration. A contemporary copy survives of his letter of 3 September 1798 from Paris to an unnamed émigré who had written to him from Dresden that August.
  bio_de: Tadeusz Kościuszko, General und als Naczelnik Oberbefehlshaber der Nationalstreitkräfte im Aufstand von 1794 gegen Russland und Preußen; bei Maciejowice verwundet und gefangen genommen, blieb er nach der Teilung im Ausland, ab 1798 in Paris, die Leitfigur der polnischen Emigration. Die Abschriftensammlung B. Ossol. rkp. 2289 II bewahrt die Abschrift seines Briefs vom 3. September 1798 aus Paris an einen emigrierten Korrespondenten, der ihm im August aus Dresden geschrieben hatte; die Abschrift nennt den Adressaten nicht.
szetlewicz:
  bio: General royal messenger of Szetlewko (Szetlewek), the village next to Szetlew south of Zagórów. In 1727 he reported to the land court at Kalisz that he had carried a citation to the estate of Szetlew and left it on the table in the heated room. He shows a family of the name living at Szetlewek in the 1720s.
  bio_de: Sebastian Szetlewicz von Szetlewko (Szetlewek), ein allgemeiner königlicher Bote. Er berichtete dem Landgericht in Kalisz 1727, dass er eine Ladung zum Gut Szetlew gebracht und auf dem Tisch im beheizten Raum zurückgelassen habe. Der Eintrag steht um seines Namens willen, denn er zeigt eine Familie Szetlewicz, die in den 1720er Jahren in Szetlewek wohnte.
trampczynski:
  bio: The family that held Trąbczyn in the sixteenth and seventeenth centuries and took its name from it, with the by-name Otto. In 1589 Albertus Trąmpczyński sued his neighbour Thomas Łukomski over a pond that flooded his woods. In 1644 four brothers of the family and their widowed mother were condemned by default at the suit of their neighbour Jerzy Chełmski of Łukom.
  bio_de: Die Familie, der Trąbczyn im 16. und 17. Jahrhundert gehörte und die sich nach dem Gut nannte, mit dem Beinamen Otto. 1589 verklagte Albertus Trąmpczyński seinen Nachbarn Thomas Łukomski wegen eines Teichs, der seine Wälder überschwemmte. 1644 wurden vier Brüder der Familie und ihre verwitwete Mutter auf Klage ihres Nachbarn Jerzy Chełmski von Łukom in Abwesenheit verurteilt.
lukomski:
  bio: The family named from Łukom, the estate next to Trąbczyn, which it held in the sixteenth century. In 1589 Thomas Łukomski was sued by Albertus Trąmpczyński for building a pond at Łukom that flooded the woods and meadows of Trąbczyn.
  bio_de: Die Familie, die sich nach Łukom nannte, dem Nachbargut von Trąbczyn, das ihr im 16. Jahrhundert gehörte. 1589 wurde Thomas Łukomski verklagt, weil er dort einen Teich angelegt hatte, der Wälder und Wiesen von Trąbczyn überschwemmte.
prusimska-katarzyna:
  bio: Widow of Paweł Prusimski, the King's chamberlain and owner of Trąbczyn, who held the estate for life after his death in 1754. That year she had it inspected, building by building. In 1763 she was at law with her neighbour Stanisław Ścibor Chełmski of Łukom before the land court at Konin over potash he had stopped at Pyzdry in 1761. She enlarged the parish church of Trąbczyn.
  bio_de: Katarzyna Prusimska, geborene Rozdrażewska, Witwe des Paweł Prusimski, die Trąbczyn nach seinem Tod auf Lebenszeit innehatte. 1754 ließ sie das Gut Gebäude für Gebäude besichtigen. 1763 stand sie vor dem Landgericht in Konin im Rechtsstreit mit Stanisław Ścibor Chełmski von Łukomia um Pottasche, die er 1761 in Pyzdry angehalten hatte. Die Visitation von 1791 berichtet, dass sie, „die Kammerherrin“, die Kirche von Trąbczyn erweiterte, wann, wusste man damals nicht.
voss:
  life: "1755-1823"
  bio: Prussian minister of state responsible for South Prussia, the province formed from Prussia's share of Poland. On his report the King refused in 1798 the exchange of Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn, and in 1805 he had the division of the Trąbczyn estate among settlers stopped, until the Chamber's commission lifted the stop that summer.
  bio_de: Otto Karl Friedrich von Voss, preußischer Staatsminister, zuständig für Südpreußen. Auf seinen Bericht hin lehnte der König 1798 den Tausch gegen Krotoszyn ab, und 1805 untersagte er die Teilung der Güter Trąbczyn und Zagórów.
zerboni:
  life: "1766-1831"
  bio: Prussian official in South Prussia and from 1815 chief president of the Grand Duchy of Posen. He was himself a creditor on the Trąbczyn estates, and in November 1815 he advised the Prussian government against pressing Prince Hohenlohe-Ingelfingen's claim to compensation for them.
  bio_de: Joseph Zerboni di Sposetti, preußischer Beamter in Südpreußen und seit 1815 Oberpräsident des Großherzogtums Posen. Er war Gläubiger auf den Trąbczyner Gütern, und sein Bericht vom November 1815 riet davon ab, den Entschädigungsanspruch nachdrücklich zu vertreten.
fuerst-august:
  life: "1784-1853"
  bio: Eldest son and heir of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, to whom his father ceded the principality in 1806; later Prince of Hohenlohe-Öhringen. In 1815 his father's agent, Triebenfeld, urged him to withdraw the power of attorney he had given Cosmar, the executor who administered the family's Silesian estates for the creditors.
  bio_de: Friedrich August Karl, ältester Sohn und Erbe Hohenlohe-Ingelfingens, dem der Vater 1806 das Fürstentum abtrat; später Fürst zu Hohenlohe-Öhringen. 1815 drängte Triebenfeld ihn, die Cosmar erteilte Vollmacht zu widerrufen.
miaczynski:
  # The life dates are stated by the page (and the Nekrolog it quotes):
  # born 24 December 1780 at Warsaw, died 12 April 1845 at Berlin.
  life: 1780–1845
  life_de: 1780–1845
  bio: Second husband of Michalina Prusimska, the heiress of Trąbczyn, whom he married at Warsaw in August 1810, and father of Count Włodzimierz Miączyński. In 1815 Prince Hohenlohe-Ingelfingen, who sought the estate's return, feared his influence with the Governor-General of the Duchy of Warsaw, Lanskoy.
  bio_de: Stanisław Miączyński, zweiter Ehemann der Michalina Prusimska, die er im August 1810 in Warschau heiratete. Die Briefe schreiben seinen Namen Moscinski und Moszynski, ein französischer Brief von 1815 „M. de Mięczynsky“; 1815 fürchtete Triebenfeld seinen Einfluss auf den Generalgouverneur.
zelmer:
  bio: 'A family of Olęder settlers on the Trąbczyn estate, also written Celmer. In 1860 Henryk Celmer, the widow and five children of Daniel Celmer, and August and Michał Celmer were among the colonists of the Staro- and Nowo-Łazińska colonies whom Count Włodzimierz Miączyński, the estate''s owner, summoned over their pasture and wood-gathering in his forest. When the colony''s land was assigned to the settlers in 1868, five holdings stood under the name: those of Gottfried, Heinrich, Michael and August and of Daniel''s heirs.'
  bio_de: Eine Familie von Olędern auf dem Gut Trąbczyn, auch Celmer geschrieben. In der Vorladung von 1860 stehen Henryk Celmer sowie die Witwe und die fünf Kinder des Daniel Celmer unter den Kolonisten der Kolonie Staro-Łazińska, August und Michał Celmer unter denen der Kolonie Nowo-Łazińska, die Graf Włodzimierz Miączyński wegen der Weide und des Holzsammelns in seinem Wald laden ließ. In der Liquidationstabelle der Kolonie Łazińsk, 1868 bestätigt, ist der Name Цельмеръ geschrieben, und fünf Stellen stehen darunter, die von Gottfried, Heinrich, Michael und August und die der Erben Daniels (Nr. 37, 50, 53, 65 und 67).
miaczynski-wlodzimierz:
  life: "d. 1879"   # died 18 December 1879 at Trąbczyn (the editor, 2026-11-12, correcting the 20th of 2026-10-15, the notice's issue date)
  bio: Count, owner of the Trąbczyn estate, where he lived, after his mother Michalina Miączyńska, born Prusimska, died in 1851. When the colonists of his estate sued him in 1859, he counterclaimed before the Civil Tribunal at Kalisz to have their pasture and wood-gathering in his forest cut back, and had 97 of them summoned. He died at Trąbczyn on 18 December 1879, and his nephew Władysław Miączyński became heir of the estate.
  bio_de: Graf Włodzimierz Miączyński, Erbherr des Gutes Trąbczyn, wo er 1860 wohnte. 1859 von den Kolonisten seines Gutes verklagt, erhob er vor dem Zivilgericht in Kalisch Widerklage, um ihre Weide und ihr Holzsammeln in seinem Wald einschränken zu lassen, und ließ 97 von ihnen vorladen. Er war der Sohn von Michalina Miączyńska, geborene Prusimska, der das Gut bis zu ihrem Tod 1851 gehörte. Er starb am 18. Dezember 1879, und sein Neffe Władysław Miączyński wurde Erbe des Gutes Trąbczyn.
prusimski-pawel:
  bio: Chamberlain of the King and owner of Trąbczyn, who with his wife Katarzyna, born Rozdrażewska, founded the estate's first Olęder settlement in 1746. He died shortly before July 1754; his widow then held the estate for life. His funeral at Trąbczyn on 5 December 1754, at which his nephew Antoni gave the oration, was reported in the Warsaw press.
  bio_de: Paweł Prusimski, königlicher Kämmerer und Erbherr von Trąbczyn, der kurz vor Juli 1754 starb. Seine Witwe Katarzyna, geborene Rozdrażewska, hatte das Gut danach auf Lebenszeit und ließ es besichtigen. Der Kuryer Polski berichtete über sein Begräbnis in Trąbczyn am 5. Dezember 1754, bei dem sein Neffe Antoni die Leichenrede hielt.
prusimski-krzysztof:
  bio: Owner of Trąbczyn in the 1720s and grandfather of Antoni Prusimski, the Starost. In 1728 the Chełmski brothers of Łukom sued him, his son Antoni and their people for burning, cattle-taking and an armed raid on the disputed boundary ground, and the land court at Konin sent a commissioner onto it.
  bio_de: Krzysztof Prusimski, in den 1720er Jahren Erbherr von Trąbczyn und Großvater des Starosten Antoni Prusimski. 1728 verklagten ihn, seinen Sohn Antoni und ihre Leute die Brüder Chełmski von Łukom wegen Brandstiftung, Viehwegnahme und eines bewaffneten Überfalls, und das Landgericht in Konin schickte einen Kommissar auf den strittigen Grund.
prusimski:
  # The life-line (2026-11-24, the documents first): born 1744 (PSB,
  # pachonski1982/582); died 1803, abroad, by the Prussian foreign ministry's
  # reply of May 1819 (III. HA MdA III Nr. 12366, document 2), after April and
  # May 1803, when he was alive at Dresden (Nr. 3132). The PSB's "ca 1806"
  # (accepted 2026-10-22) is flagged in NEEDS_CONFIRMATION.
  life: "1744–1803"
  life_de: "1744–1803"
  bio: Starost of Niszczewice and owner of Trąbczyn, Kamionna and Kolno, also called Ostroróg-Prusimski. Prussia counted him one of the leading insurgents of the Polish uprising of 1794; he fled abroad, the crown confiscated his estates, and in 1796 the King gave them to Prince Hohenlohe-Ingelfingen. In 1800 the Prince argued that Prusimski's life interest in his late wife's property had passed to the crown with the rest. He lived in exile at Venice and Dresden and died in 1803. In 1807 the Duchy of Warsaw gave his estates back to his daughter Michalina. Mentions of his heirs and of the estates named after him are counted here.
  bio_de: Antoni Prusimski (Ostroróg-Prusimski), Starost von Niszczewice und Besitzer von Trąbczyn, Kamionna (Kaemen) und Kolno. Die preußischen Akten nennen ihn einen der Hauptinsurgenten des polnischen Aufstands von 1794; er floh, die Krone konfiszierte seine Güter, und 1796 schenkte der König sie Hohenlohe-Ingelfingen. 1807 gab eine Kommission des Herzogtums Warschau sie seiner Tochter Michalina zurück, die einen eigenen Eintrag hat. 1800 schrieb Hohenlohe-Ingelfingen von ihm als noch lebend und machte geltend, sein lebenslanges Nutzungsrecht am Vermögen seiner verstorbenen Frau sei mit seinem übrigen konfiszierten Vermögen an die Krone gefallen. Erwähnungen seiner Erben und der nach ihm benannten Güter sind hier mitgezählt.
schlabrendorff:
  bio: Count and Countess, creditors of Prince Hohenlohe-Ingelfingen. A settlement with the Countess over money belonging to her children ran from 1804, and she agreed to wait until January 1805 for 50,000 Reichsthaler.
  bio_de: Graf und Gräfin Schlabrendorff, Gläubiger Hohenlohe-Ingelfingens. Ein Vergleich mit der Gräfin über die Gelder ihrer Kinder lief seit 1804; sie erklärte sich bereit, bis Januar 1805 auf 50.000 Rthl zu warten.
staegemann:
  life: "1763-1840"
  bio: Prussian councillor of state and close colleague of the State Chancellor, Hardenberg, with him at the Congress of Vienna. The petitions for Prince Hohenlohe-Ingelfingen's lost Polish estates were referred to him, and the Prince's agent, Triebenfeld, held him responsible for their delay.
  bio_de: Friedrich August von Stägemann, preußischer Staatsrat und enger Mitarbeiter Hardenbergs, mit diesem auf dem Wiener Kongress. Die Eingaben für Hohenlohe-Ingelfingen wurden ihm zugewiesen, und Triebenfeld machte ihn für ihre Verzögerung verantwortlich.
friedrich-wilhelm-iii:
  life: "1770-1840"
  bio: King of Prussia from November 1797. He added to his father's grant of Polish estates to Prince Hohenlohe-Ingelfingen in December 1797, refused the Prince's proposed exchange of them for the domain of Krotoszyn in 1798, and confirmed the Prince's family entail in 1805.
  bio_de: König von Preußen seit November 1797. Er erließ die ergänzende Verleihung vom Dezember 1797, lehnte 1798 den Tausch gegen Krotoszyn ab und bestätigte 1805 das Familienmajorat Hohenlohe-Ingelfingens.
hawich:
  bio: Justiciary of the patrimonial court of Prince Hohenlohe-Ingelfingen's Zagórów estates, formerly at Pyzdry. He reported the seizure of Trąbczyn for Michalina Prusimska in October 1807 and in 1809 received from the Prince's agent, Triebenfeld, thirteen powers of attorney for the Prince's lawsuits in the Duchy of Warsaw. The Prince's agent, Triebenfeld, later accused him of dishonesty and sought his dismissal.
  bio_de: Justitiar des Patrimonialgerichts der Güter von Zagórów, zuvor in Pyzdry (Peisern). Er meldete im Oktober 1807 die Wegnahme von Trąbczyn und erhielt 1809 Vollmachten für die Prozesse im Herzogtum Warschau. Triebenfeld warf ihm später Unredlichkeit vor und betrieb seine Entlassung.
hecker:
  bio: Chief inspector of Prince Hohenlohe-Ingelfingen's Zagórów estates, engaged by the Prince's agent, Triebenfeld, in 1808. He kept the estates' accounts, was accused with the justiciary Hawich of taking land for himself and stirring up the settlers, and was to be dismissed in 1811.
  bio_de: Oberinspektor auf den Gütern von Zagórów, 1808 von Triebenfeld angestellt. Er führte die Kasse, wurde zusammen mit Hawich beschuldigt, sich Land anzueignen und die Siedler aufzuwiegeln, und sollte 1811 entlassen werden.
zastrow:
  life: "1752-1830"
  bio: Prussian general, adjutant to the King in 1798 and briefly foreign minister in 1807. He stood surety for Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, in 1808. He too had been given estates in South Prussia, and in 1820 the Prince's heirs cited the compensation he received for their loss as a precedent for their own claim.
  bio_de: Friedrich Wilhelm Christian von Zastrow, preußischer General, 1798 Adjutant des Königs und 1807 kurz Außenminister. Er verbürgte sich 1808 für Triebenfeld. Auch er hatte Güter in Südpreußen erhalten, und die Erben Hohenlohe-Ingelfingens beriefen sich 1820 auf seine Entschädigung.
beyme:
  life: "1765-1838"
  bio: Cabinet councillor to Friedrich Wilhelm III and later Grand Chancellor of Prussia. From 1798 he laid Prince Hohenlohe-Ingelfingen's petitions about his Polish estates before the King.
  bio_de: Karl Friedrich von Beyme, Kabinettsrat Friedrich Wilhelms III. und später preußischer Großkanzler. Er trug dem König seit 1798 die Eingaben Hohenlohe-Ingelfingens vor.
hoym:
  life: "1739-1807"
  bio: Count, Prussian minister for Silesia and, from 1793 to 1798, for South Prussia. In July 1796 he proposed that the confiscated estates of Antoni Prusimski be given to Prince Hohenlohe-Ingelfingen.
  bio_de: Karl Georg Heinrich Graf von Hoym, preußischer Minister für Schlesien und von 1793 bis 1798 für Südpreußen. Er schlug im Juli 1796 die Verleihung der Güter Prusimskis an Hohenlohe-Ingelfingen vor.
sacken:
  life: "d. 1811"
  bio: Mother of Marianne von Hoym, the wife of Prince Hohenlohe-Ingelfingen. She lent the Prince money on his Silesian estate of Koszęcin. After her death in 1811 her will, her legacy to him and to his son August, and her executor Cosmar, who took over the Silesian estates for the creditors, occupied the Prince's affairs for years.
  bio_de: Fürstin Sacken, Mutter der Marianne von Hoym, der Ehefrau Hohenlohe-Ingelfingens. Sie lieh ihm Geld auf das Gut Koszęcin (Koschentin). Nach ihrem Tod 1811 beschäftigen ihr Testament, ein Vermächtnis an ihn und an seinen Sohn August und ihr Testamentsvollstrecker Cosmar viele Briefe.
cabanis:
  bio: Surveyor and chief forester on Prince Hohenlohe-Ingelfingen's Polish estates. He measured the land of Oleśnica, was sent in 1804 to recruit settlers among the Bohemian colonists in Silesia for the Zagórów estates, and later checked the estates' accounts at Zagórów.
  bio_de: Vermesser und Oberförster auf den südpreußischen Gütern. Er vermaß Oleśnica, wurde 1804 ausgesandt, um unter böhmischen Kolonisten in Schlesien Siedler zu werben, und prüfte später die Rechnungen in Zagórów.
broniewski:
  bio: Cavalry captain who held the estates of Kamionna and Kolno, near Międzychód, in pledge and contested Prince Hohenlohe-Ingelfingen's title to them. Under a settlement of 1804 he received 53,139 Reichsthaler out of the price that Leixner paid for the two estates.
  bio_de: Anton von Broniewski, Rittmeister, der Kamionna (Kaemen) und Kolno als Pfand besaß und den Besitztitel Hohenlohe-Ingelfingens bestritt. Nach einem Vergleich von 1804 erhielt er 53.139 Rthl aus dem von Leixner gezahlten Kaufpreis.
leixner:
  life: "d. by 1816"
  bio: Official of the royal bank at Frankfurt an der Oder, who bought the estates of Kamionna and Kolno from Prince Hohenlohe-Ingelfingen for 142,000 Reichsthaler in 1805. He lost them in 1807, when the Duchy of Warsaw returned them to Michalina Prusimska, and came under judicial investigation; he had died by April 1816.
  bio_de: George Conrad Leixner, Beamter der königlichen Bank in Frankfurt an der Oder, der 1805 Kamionna (Kaemen) und Kolno für 142.000 Rthl kaufte. Er verlor die Güter 1807 und geriet in gerichtliche Untersuchung; ein Vermerk vom April 1816 hält fest, dass er verstorben war.
oppenheimer:
  bio: Banker of the Berlin house of Oppenheim and Wolff, to which part of a mortgage of 250,000 Reichsthaler on Prince Hohenlohe-Ingelfingen's estate of Zagórów was pledged. He undertook to pay the interest due to the Invalids' Fund on the Prince's loan and did not, and the Prince's agent, Triebenfeld, sued him in Berlin and Kalisz.
  bio_de: Bankier des Berliner Hauses Oppenheim und Wolff, dem ein Teil einer Hypothek von 250.000 Rthl auf Zagórów verpfändet war. Er übernahm die Zahlung an die Invalidenkasse und leistete sie nicht; Triebenfeld verklagte ihn in Berlin und Kalisz (Kalisch).
bernhard:
  bio: Financier who acted with Leixner in the purchase of the estates of Kamionna and Kolno from Prince Hohenlohe-Ingelfingen, and in the sale of the Prince's lordship of Pszczew in 1804. He later went to law over Pszczew.
  bio_de: Meyer Bernhard, ein Geldgeber, der 1804 mit Leixner beim Kauf von Kamionna (Kaemen) und Kolno und in der Sache um Pszczew (Betsche) auftrat. Später klagte er wegen Pszczew.
lahr:
  bio: Berlin creditor from whom Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, borrowed in 1808 to pay the interest owed to the Invalids' Fund. He sued for repayment in cash, had Triebenfeld's own estates sequestered, and was partly paid in iron from the Prince's Silesian ironworks.
  bio_de: Van der Lahr, ein Berliner Gläubiger, bei dem Triebenfeld 1808 lieh, um Zinsen an die Invalidenkasse zu zahlen. Er klagte auf Rückzahlung in Kurant, ließ Triebenfelds Güter sequestrieren und wurde zum Teil in Eisen aus den schlesischen Werken bezahlt.
napoleon:
  life: "1769-1821"
  bio: Emperor of the French. The Duchy of Warsaw that he created in 1807 took in Prince Hohenlohe-Ingelfingen's Polish estates and returned Trąbczyn to the Prusimski heiress, and his return from Elba in March 1815 interrupted the Congress of Vienna, where the Prince's claim to them was pressed.
  bio_de: Napoleon Bonaparte, Kaiser der Franzosen. Das von ihm 1807 geschaffene Herzogtum Warschau umfasste die Güter Hohenlohe-Ingelfingens, und seine Rückkehr von Elba im März 1815 unterbrach die Geschäfte des Wiener Kongresses.
eberhard:
  bio: Justice commissioner at Brzeg, who acted for Prince Hohenlohe-Ingelfingen in the negotiations with the heirs of the Duke of Courland in 1814 and 1815. The Prince's agent, Triebenfeld, pressed for him to come to Vienna to conclude a settlement.
  bio_de: Justizkommissar in Brzeg (Brieg), der 1814 und 1815 für Hohenlohe-Ingelfingen mit den Erben des Herzogs von Kurland verhandelte. Triebenfeld drängte darauf, dass er zum Abschluss eines Vergleichs nach Wien komme.
brzechffa:
  bio: Sub-prefect of the Konin district in the Duchy of Warsaw and a friend of Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen. In 1812 he offered to lease the Prince's Zagórów estates for six years, and he went to Warsaw about the dispute over Trąbczyn.
  bio_de: Unterpräfekt des Kreises Konin im Herzogtum Warschau, ein Freund Triebenfelds. 1812 bot er an, die Güter von Zagórów auf sechs Jahre zu pachten, und reiste in der Trąbczyner Sache nach Warschau.
humboldt:
  life: "1767-1835"
  bio: Prussian minister and scholar, Prussia's second plenipotentiary at the Congress of Vienna. In November 1814 he received the memorial of Peter Friedrich von Triebenfeld on Prince Hohenlohe-Ingelfingen's lost Polish estates and promised his support.
  bio_de: Wilhelm von Humboldt, preußischer Minister und Gelehrter, zweiter preußischer Bevollmächtigter auf dem Wiener Kongress. Er erhielt im November 1814 Triebenfelds Denkschrift und sagte seine Unterstützung zu.
lichnowski:
  bio: Brothers, creditors with 42,000 Reichsthaler registered on Trąbczyn while Prince Hohenlohe-Ingelfingen held it. In 1804 one of them demanded arrears of interest and threatened to have the estate sequestered. In 1827 the civil tribunal at Kalisz struck their mortgage out at the suit of Michalina Miączyńska; they were Karl Franz and Maximilian Jaroslaw, heirs of Karl Heinrich Lichnowski.
  bio_de: Die Brüder Lichnowski, Gläubiger mit 42.000 Rthl, die auf Trąbczyn eingetragen waren. 1804 forderte einer von ihnen rückständige Zinsen und drohte, die Sequestration zu beantragen. 1827 ließ das Ziviltribunal in Kalisz (Kalisch) ihre Hypothek auf Klage der Michalina Miączyńska löschen; das Urteil nennt sie Karl Franz und Maximilian Jaroslaw, Erben des Karl Heinrich Lichnowski.
stoessel:
  bio: Baron, a cavalry captain, and his family, the largest creditors of Prince Hohenlohe-Ingelfingen on his Silesian estate of Koszęcin, with three claims. From 1810 the Prince's agent, Triebenfeld, tried to settle with them by handing over the Zagórów estates.
  bio_de: Baron von Stössel, Rittmeister, und seine Familie, die größten Gläubiger auf dem schlesischen Gut Koszęcin (Koschentin). Das Gläubigerverzeichnis nennt drei Forderungen der Familie. Seit 1810 versuchte Triebenfeld, sie durch Übertragung von Zagórów abzufinden.
lombardini:
  bio: Steward of Prince Hohenlohe-Ingelfingen's household at Sławięcice. He carried letters and money between the Prince and his agent, Triebenfeld, and paid allowances to Triebenfeld's daughters.
  bio_de: Hofmeister Hohenlohe-Ingelfingens in Sławięcice (Schlawenschitz). Er überbrachte Briefe und Geld zwischen dem Fürsten und Triebenfeld und zahlte Triebenfelds Töchtern Unterstützungen aus.
friedrich-wilhelm-ii:
  life: "1744-1797"
  bio: King of Prussia from 1786. By a charter of August 1796 he gave Prince Hohenlohe-Ingelfingen the Polish estates confiscated from Antoni Prusimski, Trąbczyn among them, and by another of June 1797 sixteen former church villages, Zagórów among them.
  bio_de: König von Preußen seit 1786. Er verlieh Hohenlohe-Ingelfingen die südpreußischen Güter durch Urkunden vom August 1796 und Juni 1797.
eysenhardt:
  bio: Berlin agent of Prince Hohenlohe-Ingelfingen in 1798 and later his creditor. A bank draft for 6,000 Reichsthaler made over to him in 1807 was the subject of a dispute with the Prince's agent, Triebenfeld, in 1808.
  bio_de: 1798 Agent Hohenlohe-Ingelfingens in Berlin, später Gläubiger. Eine 1807 an ihn abgetretene Bankanweisung über 6.000 Rthl war 1808 Gegenstand eines Streits mit Triebenfeld.
radzinski:
  bio: Lessee of Szetlewek, a farm of Prince Hohenlohe-Ingelfingen's Zagórów estates, from 1798, holding a pledge of 8,333 Reichsthaler on it. He later held the farm on hereditary lease and was in arrears by 1808.
  bio_de: Ignatz von Radzinski, seit 1798 Pächter von Szetlewek und Inhaber eines Pfandes von 8.333 Rthl darauf. Später besaß er das Gut in Erbpacht und war 1808 im Rückstand.
pourtales:
  life: "1779-1861"
  bio: Count, of the Neuchâtel family in Prussian service, whom Peter Friedrich von Triebenfeld proposed in 1815 as a buyer of Prince Hohenlohe-Ingelfingen's Silesian estate of Koszęcin. Probably Count Frédéric de Pourtalès, whose dates are given here.
  bio_de: Ein Graf Pourtalès aus der Neuenburger Familie in preußischen Diensten, den Triebenfeld 1815 als Käufer von Koszęcin (Koschentin) vorschlug. Vermutlich Graf Friedrich von Pourtalès, dessen Lebensdaten hier stehen.
sommer:
  bio: Lieutenant and legal trainee in the service of Prince Hohenlohe-Ingelfingen, sent in 1811 and 1812 to General Schimmelpfennig to negotiate an exchange of the Zagórów estates.
  bio_de: Leutnant und Referendar im Dienst Hohenlohe-Ingelfingens, 1811 und 1812 wegen des Tausches von Zagórów zu General Schimmelpfennig gesandt.
bernhardi:
  life: "d. 1806"
  bio: Mining councillor concerned with Prince Hohenlohe-Ingelfingen's Silesian estate of Koszęcin, to whom payments from the sale of Kamionna were sent in 1804. He died in July 1806. A tenant of the same name at Konotop may be a different man.
  bio_de: Bergrat, mit dem schlesischen Gut Koszęcin (Koschentin) befasst, an den 1804 Zahlungen aus dem Verkauf von Kamionna (Kaemen) gingen. Hahn meldet im Juli 1806 seinen Tod. Ein gleichnamiger Pächter in Konotop (Kontop) ist möglicherweise ein anderer.
meierowitz:
  bio: Buyer of the estate of Witów from Prince Hohenlohe-Ingelfingen in 1805, for 20,000 Reichsthaler and a yearly payment. The Prince's agent, Triebenfeld, later sued him for unpaid purchase money and rent.
  bio_de: Franz Meierowitz kaufte 1805 das Gut Witów (Wittow) für 20.000 Rthl und eine jährliche Abgabe. Triebenfeld verklagte ihn später wegen rückständigen Kaufgelds und Zinses.
niedzwiecki:
  bio: Lessee of the farm of Kopojno, on Prince Hohenlohe-Ingelfingen's Zagórów estates, for six years from 1805, with the right to sell drink on the estates. He fell into arrears, and the Prince's suit against him was won in 1812.
  bio_de: Maciej Niedźwiecki pachtete 1805 das Vorwerk Kopojno auf sechs Jahre, mit der Propination auf den Gütern. Er geriet in Rückstand, und ein Prozess gegen ihn wurde 1812 gewonnen.
gaertner:
  bio: Privy councillor who represented the mediatised princely houses, Hohenlohe among them, at the Congress of Vienna. Peter Friedrich von Triebenfeld sent Prince Hohenlohe-Ingelfingen his pamphlet and his submissions to the Congress.
  bio_de: Ein Geheimer Rat, der die mediatisierten Fürstenhäuser, darunter Hohenlohe, auf dem Wiener Kongress vertrat. Triebenfeld schickte dem Fürsten seine Broschüre und seine Eingaben an den Kongress.
prinz-adolph:
  life: "1797-1873"
  bio: Younger son of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, later a Prussian general and in 1862 briefly prime minister of Prussia. His father's agent, Triebenfeld, followed his entry into the Prussian army in 1815.
  bio_de: Prinz Adolf zu Hohenlohe-Ingelfingen, ein jüngerer Sohn Friedrich Ludwigs, später preußischer General und 1862 kurz preußischer Ministerpräsident. Sein Eintritt in die preußische Armee 1815 wird in den Wiener Briefen erörtert.
stein:
  life: "1757-1831"
  bio: Prussian reforming minister, and at the Congress of Vienna an adviser to Tsar Alexander I. In 1806, as minister, he lent money to Peter Friedrich von Triebenfeld, and in 1815 Prince Hohenlohe-Ingelfingen asked him to put the claim to Trąbczyn to the Tsar.
  bio_de: Heinrich Friedrich Karl vom Stein, preußischer Reformminister und auf dem Wiener Kongress Berater Zar Alexanders. 1806 lieh er als Minister Triebenfeld Geld; 1815 bat Hohenlohe-Ingelfingen ihn, den Trąbczyner Anspruch dem Zaren vorzutragen.
kircheisen:
  life: "1749-1825"
  bio: Prussian minister of justice from 1810. He was named an executor of the will of Princess Sacken, Prince Hohenlohe-Ingelfingen's mother-in-law, and the inquiry into Cosmar's administration of the Prince's Silesian estates was referred to him.
  bio_de: Friedrich Leopold von Kircheisen, preußischer Justizminister seit 1810. Er wurde als Testamentsvollstrecker der Fürstin Sacken genannt, und die Untersuchung der Verwaltung Cosmars wurde ihm zugewiesen.
prinz-george:
  bio: Prince, of a house not named, to whom Peter Friedrich von Triebenfeld had sold estates; his unpaid debts under that sale exposed Triebenfeld to lawsuits between 1798 and 1805.
  bio_de: Ein Prinz, dem Triebenfeld Güter verkauft hatte und dessen unbezahlte Schulden aus diesem Verkauf Triebenfeld zwischen 1798 und 1805 Prozesse eintrugen. Sein Haus nennen die Briefe nicht.
constantin:
  life: "1779-1831"
  bio: Brother of Tsar Alexander I and from 1815 commander of the army of the Kingdom of Poland. Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, hoped to reach the Tsar through him with the claim to Trąbczyn.
  bio_de: Großfürst Konstantin Pawlowitsch, Bruder Zar Alexanders I. und seit 1815 Befehlshaber der Armee des Königreichs Polen. Triebenfeld hoffte, über ihn den Zaren zu erreichen.
balan:
  bio: Counsellor of legation in the Prussian foreign ministry, who handled Prince Hohenlohe-Ingelfingen's claim to compensation for Trąbczyn from 1815 to 1820, drew up the ministry's decisions on it and initialled its drafts.
  bio_de: Legationsrat im preußischen Außenministerium, dem von 1815 bis 1820 die Akten über den Trąbczyner Anspruch zugewiesen waren. Er setzte die Verfügungen auf und paraphierte die Entwürfe.
born:
  bio: Doctor of law, royal justice official and syndic of the university at Frankfurt an der Oder, who certified the powers of attorney for Prince Hohenlohe-Ingelfingen's sale of the estates of Kamionna and Kolno in 1804 and 1805.
  bio_de: Dr. Ernst Gottlob Born, königlicher Justizbeamter und Syndikus der Universität Frankfurt an der Oder, der 1804 und 1805 Vollmachten für den Verkauf von Kamionna und Kolno beglaubigte.
gneust:
  bio: Captain and district tax collector, who in 1797 bought the free mayor's holding at Dormowo near Pszczew, a lordship that the Prussian crown gave to Prince Hohenlohe-Ingelfingen the same year.
  bio_de: Andreas Ernst Gneust, Hauptmann und Kreissteuereinnehmer, der 1797 das Freischulzengut in Dormowo bei Pszczew (Betsche) kaufte.
melzer:
  bio: Councillor of justice at Poznań, who represented Prince Hohenlohe-Ingelfingen before the government there in having his title to Pszczew registered and in Broniewski's suit over Kamionna and Kolno.
  bio_de: Justizrat in Poznań (Posen), der Hohenlohe-Ingelfingen vor der dortigen Regierung bei der Eintragung des Besitztitels an Pszczew (Betsche) und im Prozess gegen Broniewski vertrat.
bally:
  bio: Legal trainee and later master of the horse to Prince Hohenlohe-Ingelfingen at Sławięcice, who carried money and messages to the Prince's agent, Triebenfeld.
  bio_de: Referendar und später Stallmeister Hohenlohe-Ingelfingens in Sławięcice (Schlawenschitz), der Triebenfeld Geld und Nachrichten überbrachte.
garczynski:
  bio: Count, prefect of the department of Kalisz in the Duchy of Warsaw. He ordered the arrest of Martin Honrichs, administrator of the Zagórów estates, in 1810, and was approached by the agent of Prince Hohenlohe-Ingelfingen, Triebenfeld, about the lease and the taxes of the estates.
  bio_de: Graf Garczyński, Präfekt des Departements Kalisz im Herzogtum Warschau. Er ließ 1810 Honrichs verhaften und wurde wegen der Verpachtung und der Besteuerung der Güter von Zagórów angegangen.
grotowski:
  bio: Creditor who lent Prince Hohenlohe-Ingelfingen 30,000 Reichsthaler on a mortgage of Trąbczyn, which the banker Weigel bought from him in 1804. His widow Maria Anna, born Blacha, had a further 20,000 Reichsthaler registered on the estate; the civil tribunal at Kalisz struck that mortgage out in 1827.
  bio_de: Franciszek Grotowski, ein Gläubiger mit einer Hypothek von 30.000 Rthl auf Trąbczyn, die der Bankier Weigel 1804 übernahm. Für seine Witwe Maria Anna, geborene Blacha, waren weitere 20.000 Rthl auf dem Gut eingetragen; das Ziviltribunal in Kalisz (Kalisch) ließ diese Hypothek 1827 löschen.
grimm:
  bio: Court and criminal councillor at Kalisz, Prince Hohenlohe-Ingelfingen's legal representative before the government there from 1799.
  bio_de: Hof- und Kriminalrat in Kalisz (Kalisch), seit 1799 Rechtsvertreter Hohenlohe-Ingelfingens vor der dortigen Regierung.
knobelsdorff:
  bio: Silesian landowner with whom Peter Friedrich von Triebenfeld negotiated in 1809 and 1810 an exchange of his estates for Prince Hohenlohe-Ingelfingen's Zagórów estates. He inspected Zagórów late in 1810; no exchange followed.
  bio_de: Ein schlesischer Gutsbesitzer, mit dem Triebenfeld 1809 und 1810 über einen Tausch seiner Güter gegen Zagórów verhandelte. Er besichtigte Zagórów Ende 1810; ein Abschluss ist nicht überliefert.
rochlitz:
  bio: Forest inspector, who valued the forest of Kamionna and Kolno and negotiated the first sale of Witów for Prince Hohenlohe-Ingelfingen in 1803. The Prince's agent, Triebenfeld, dismissed him as agent in 1804, and a lawsuit between them followed in 1810.
  bio_de: Forstinspektor, der den Forst von Kamionna (Kaemen) und Kolno taxierte und 1803 den ersten Verkauf von Witów (Wittow) aushandelte. Triebenfeld gibt an, ihn 1804 als Bevollmächtigten abgesetzt zu haben; 1810 folgte ein Prozess mit ihm.
grevenitz:
  bio: Councillor of the Kammergericht in Berlin (also Grävenitz), who stood surety for Peter Friedrich von Triebenfeld in van der Lahr's suit of 1809, sent him news from Berlin and forwarded his post in 1815.
  bio_de: Kammergerichtsrat in Berlin, der 1809 im van der Lahrschen Prozess für Triebenfeld bürgte, ihm Nachrichten aus Berlin schrieb und ihm 1815 die Post nachsandte. Auch Grävenitz geschrieben.
schoeler:
  life: "1772-1840"
  bio: Prussian general and envoy at St Petersburg. In 1816 he was instructed to put Prince Hohenlohe-Ingelfingen's claim to compensation for Trąbczyn before the Tsar, and reported the Russian refusal. In 1827 he protested to the Russian foreign minister, Nesselrode, against the Polish judgments that struck out the banker Weigel's mortgage on Trąbczyn.
  bio_de: Friedrich von Schöler, preußischer General und Gesandter in St. Petersburg. 1816 wurde er angewiesen, den Anspruch Hohenlohe-Ingelfingens dem Zaren vorzutragen, und er meldete die russische Ablehnung. 1827 protestierte er bei Nesselrode gegen die polnischen Urteile, die die Hypothek des Kaufmanns Weigel auf Trąbczyn löschen ließen.
beguelin:
  life: "1765-1818"
  bio: Prussian finance official in the State Chancellor's office at Vienna, who in 1815 promised to lay Prince Hohenlohe-Ingelfingen's letter about his lost Polish estates before Hardenberg.
  bio_de: Heinrich von Beguelin, preußischer Finanzbeamter in Hardenbergs Kanzlei in Wien. Er sagte 1815 zu, den Brief Hohenlohe-Ingelfingens dem Staatskanzler vorzulegen.
echaust:
  bio: Official concerned with Prince Hohenlohe-Ingelfingen's lordship of Pszczew from 1799, whose accounts the Prince's agent, Triebenfeld, was still examining in 1816.
  bio_de: Ein seit 1799 mit den Gütern von Pszczew (Betsche) befasster Beamter, dessen Rechnungen Triebenfeld noch 1816 prüfte.
goeschel:
  bio: Agent of the house of Hohenlohe at the Congress of Vienna, who submitted notes to the Congress and for whom Peter Friedrich von Triebenfeld asked a power of attorney.
  bio_de: Ein Bevollmächtigter des Hauses Hohenlohe auf dem Wiener Kongress, der Noten beim Kongress einreichte und für den Triebenfeld eine Vollmacht erbat.
kwilecki:
  bio: Justice of the peace at Konin in the Duchy of Warsaw, before whom the suit over Trąbczyn between Michalina Prusimska and Prince Hohenlohe-Ingelfingen opened in 1810. A von Kwilecki also appears in 1805 in a dispute over timber rights at Kamionna.
  bio_de: Friedensrichter in Konin im Herzogtum Warschau, vor dem 1810 die Klage auf Rückgabe von Trąbczyn begann. Ein von Kwilecki erscheint auch 1805 in einem Streit um Holzrechte bei Kamionna (Kaemen).
metternich:
  life: "1773-1859"
  bio: Prince, Austrian foreign minister and host of the Congress of Vienna, whose doings Peter Friedrich von Triebenfeld reported to Prince Hohenlohe-Ingelfingen in his news from the Congress.
  bio_de: Fürst Klemens von Metternich, österreichischer Außenminister und Gastgeber des Wiener Kongresses. Triebenfeld berichtet über ihn in seinen Nachrichten vom Kongress.
talleyrand:
  life: "1754-1838"
  bio: French foreign minister and France's representative at the Congress of Vienna, whose part in the negotiations Peter Friedrich von Triebenfeld reported to Prince Hohenlohe-Ingelfingen.
  bio_de: Charles-Maurice de Talleyrand-Périgord, französischer Außenminister und Vertreter Frankreichs auf dem Wiener Kongress. Er erscheint in Triebenfelds Berichten über die Verhandlungen.
blomberg:
  bio: Official whose valuation put the Trąbczyn estates at 316,000 Reichsthaler, the figure Prince Hohenlohe-Ingelfingen's agent, Triebenfeld, used in the claim for compensation. In 1804 he pressed demands of his own over the division of the estates among settlers.
  bio_de: Ein Beamter, dessen Überschlag den Wert der Trąbczyner Güter auf 316.000 Rthl ansetzte, die Zahl, die Triebenfeld im Entschädigungsanspruch gebrauchte. 1804 erhob er im Zusammenhang mit der Teilung der Güter eigene Forderungen.
schimmelpfennig:
  life: "1738-1812"
  bio: General, who in 1811 and 1812 offered his own estates in exchange for Prince Hohenlohe-Ingelfingen's Zagórów estates; the negotiation stalled over his illness. Probably the Prussian general Christian Ludwig Schimmelpfennig von der Oye, whose dates are given here.
  bio_de: General Schimmelpfennig von der Oye, der 1811 und 1812 eigene Güter zum Tausch gegen Zagórów anbot. Die Verhandlung stockte wegen seiner Krankheit. Vermutlich der preußische General Christian Ludwig Schimmelpfennig von der Oye, dessen Lebensdaten hier stehen.
otocki:
  bio: Landowner near Zagórów, who in 1804 and 1805 offered to lease Szetlewek and the right to sell drink on Prince Hohenlohe-Ingelfingen's estates there. He later claimed compensation under an older lease of Trąbczyn.
  bio_de: Martin von Otocki, ein benachbarter Gutsbesitzer, der 1804 und 1805 anbot, Szetlewek und die Propination der Güter zu pachten. Später forderte er Entschädigung aus einem älteren Trąbczyner Pachtvertrag.
kaiser-alexander:
  life: "1777-1825"
  bio: Emperor of Russia from 1801 and, from 1815, King of Poland, under whose rule Trąbczyn then lay. Prince Hohenlohe-Ingelfingen's claim to compensation for the estate was addressed to him and refused in 1816 and again, to the Prince's heirs, in 1820.
  bio_de: Alexander I., Kaiser von Russland seit 1801 und seit 1815 König von Polen. Der Kreis von Trąbczyn kam unter seine Herrschaft; der Entschädigungsanspruch wurde an ihn gerichtet und 1816 und 1820 abgelehnt.
wartensleben:
  bio: Counts, father and son, Silesian landowners. In 1811 Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, proposed exchanging the Zagórów estates for their estates of Skorogoszcz and Wołczyn, and Count Leopold acted as intermediary with the Prince's creditor Stössel.
  bio_de: Die Grafen Wartensleben, Vater und Sohn, schlesische Gutsbesitzer. 1811 schlug Triebenfeld vor, Zagórów gegen ihre Güter Skorogoszcz (Schurgast) und Wołczyn (Konstadt) zu tauschen, und Graf Leopold vermittelte bei Stössel.
bornstaedt:
  bio: Intermediary in the sale of Prince Hohenlohe-Ingelfingen's lordship of Pszczew in 1804, who claimed a fee for it and stands among the Prince's creditors.
  bio_de: Ein Vermittler beim Verkauf der Herrschaft Pszczew (Betsche) 1804, der dafür ein Honorar forderte und im Gläubigerverzeichnis erscheint.
kunckel:
  bio: Agent who in 1804 made over land at Althütte to settlers for Prince Hohenlohe-Ingelfingen and brought in the three lessees of Oleśnica. The Prince's agent, Triebenfeld, distrusted him, and he was taken into custody in 1805.
  bio_de: Ein Unterhändler, der 1804 für Hohenlohe-Ingelfingen Land in Althütte an Siedler austat und die drei Pächter von Oleśnica brachte. Triebenfeld misstraute ihm; 1805 wurde er in Verwahrung genommen.
nesselrode:
  life: "1780-1862"
  bio: Count, Russian foreign minister. Peter Friedrich von Triebenfeld approached him at Vienna in 1815 on Prince Hohenlohe-Ingelfingen's claim to Trąbczyn, and the Prussian envoy Schöler delivered Prussia's notes on the claim to him in 1816. In 1827 Schöler asked him to have the Polish judgment against the banker Weigel's mortgage annulled.
  bio_de: Graf Karl Robert von Nesselrode, russischer Außenminister. Triebenfeld wandte sich 1815 in Wien an ihn, und Schöler übergab ihm 1816 die preußischen Noten über den Anspruch. 1827 bat Schöler ihn, das polnische Urteil gegen den Kaufmann Weigel aufheben zu lassen.
przespolewski:
  bio: Creditor of Antoni Prusimski, the former owner of the Zagórów and Trąbczyn estates, with a claim of 30,000 Polish złoty registered on Szetlewek. In 1804 he obtained an order of execution for it against the new owner, Prince Hohenlohe-Ingelfingen.
  bio_de: Jacob von Przespolewski, für den eine Forderung von 30.000 polnischen Gulden gegen den früheren Besitzer Prusimski auf Szetlewek eingetragen war und der 1804 eine Exekution gegen Hohenlohe-Ingelfingen erwirkte.
schulenburg:
  life: "1742-1815"
  bio: Count, Prussian general and minister of state. In 1798 he was reported to favour the exchange of Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn, and in 1804 the Prince's lawyer Amelang delivered a letter from the Prince to him.
  bio_de: Graf Friedrich Wilhelm von der Schulenburg-Kehnert, preußischer General und Staatsminister. 1798 hieß es, er sei dem Tausch gegen Krotoszyn gewogen, und 1804 übergab ihm Amelang ein Schreiben Hohenlohe-Ingelfingens.
sobottendorff:
  bio: Creditor to whom Prince Hohenlohe-Ingelfingen owed 40,000 Reichsthaler. In 1812 the Prince's agent, Triebenfeld, proposed paying him with a long lease of Drzewce; his heirs later stood among the Prince's creditors.
  bio_de: Ein Gläubiger, dem Hohenlohe-Ingelfingen 40.000 Rthl schuldete. 1812 schlug Triebenfeld vor, ihn durch eine lange Pacht von Drzewce abzufinden; seine Erben erscheinen im Gläubigerverzeichnis.
hohenlohe-bartenstein:
  bio: Prince of the Catholic Bartenstein line of the house of Hohenlohe, present at the Congress of Vienna. In December 1814 the Prussian State Chancellor, Hardenberg, promised him to take up the affairs of Prince Hohenlohe-Ingelfingen.
  bio_de: Ein Prinz der katholischen Bartensteiner Linie des Hauses Hohenlohe, auf dem Wiener Kongress anwesend. Hardenberg sagte ihm im Dezember 1814 zu, sich der Angelegenheiten Hohenlohe-Ingelfingens anzunehmen.
tesmar:
  bio: Privy councillor who negotiated in 1806 for a large loan on Prince Hohenlohe-Ingelfingen's Polish estates and reported to the Prince's agent, Triebenfeld, in 1810.
  bio_de: Ein Geheimer Rat, der 1806 über ein großes Darlehen auf die südpreußischen Güter verhandelte und Triebenfeld 1810 Nachricht gab.
danckelmann:
  bio: Count, vice-president of the South Prussian Government at Poznań, the province's court of justice, who signed its reports of June and July 1800 on Michalina Prusimska's suit against Prince Hohenlohe-Ingelfingen for her mother's estates. By December 1800 he was president of the Government at Kalisz, and by 1810 a senior judge in Silesia. Probably Heinrich Wilhelm August Alexander von Danckelmann (1768-1830), later minister of justice.
  bio_de: Graf Danckelmann, Vizepräsident der Südpreußischen Regierung in Poznań (Posen), des Justizkollegiums der Provinz, der ihre Berichte vom Juni und Juli 1800 über Michalina Prusimskas Klage gegen Hohenlohe-Ingelfingen unterzeichnete. Im Dezember 1800 war er Präsident der Regierung in Kalisz (Kalisch). 1810 wurde bei ihm, nun hohem Richter in Schlesien, Urlaub für den Referendar Sommer erbeten. Vermutlich Heinrich Wilhelm August Alexander von Danckelmann (1768-1830), später Justizminister.
bethusy:
  bio: Count, a landowner in Silesia and in the Kingdom of Poland. In 1820 Russia refused his request for free movement between his properties in the same answer that refused the claim of Prince Hohenlohe-Ingelfingen's heirs. His debts were talked of in 1809.
  bio_de: Graf Ernst Bethusy, Grundbesitzer in Schlesien und im Königreich Polen. Sein Gesuch um freien Verkehr zwischen seinen Besitzungen wurde 1820 zusammen mit dem Anspruch der Hohenloher Erben abgelehnt. Die Briefe von 1809 erwähnen seine Schulden.
haugt:
  bio: Berlin creditor of Prince Hohenlohe-Ingelfingen, like Oppenheimer and Girard, whose mortgage the Prince's agent, Triebenfeld, tried to have taken over in 1805.
  bio_de: Ein Berliner Gläubiger, zusammen mit Oppenheimer und Girard genannt, dessen Hypothek Triebenfeld 1805 übernehmen lassen wollte.
brehmer:
  bio: Widow of Colonel von Brehmer, of Sommerfeld, sister and sole heir of Major von Seehausen. In 1816 she asked the Prussian ministry to see that her brother's loan of 5,000 Reichsthaler to Prince Hohenlohe-Ingelfingen was repaid out of any compensation for the Prince's Polish estates.
  bio_de: Die Witwe des Obersten von Brehmer in Sommerfeld, Schwester und Alleinerbin des Majors von Seehausen. 1816 bat sie das Ministerium, dafür zu sorgen, dass dessen Darlehen von 5.000 Rthl an Hohenlohe-Ingelfingen aus einer Entschädigung bezahlt werde.
emilie:
  bio: Daughter of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. Under her father's will of 1805 she was to inherit the Silesian estate of Koszęcin if the male line died out.
  bio_de: Prinzessin Emilie zu Hohenlohe-Ingelfingen, eine Tochter Friedrich Ludwigs. Nach seinem Testament von 1805 sollte sie Koszęcin (Koschentin) erben, wenn der Mannesstamm erlosch.
noldichen:
  bio: Councillor of war whose valuation of the domain of Krotoszyn, made without seeing it, underlay the report on which the King refused in 1798 to exchange it for Prince Hohenlohe-Ingelfingen's Polish estates.
  bio_de: Ein Kriegsrat, dessen Veranschlagung von Krotoszyn, ohne Besichtigung der Güter angefertigt, die Grundlage des Berichts war, der 1798 zur Ablehnung des Tausches führte.
metzig:
  bio: Judicial burgomaster of Skwierzyna (also Melzig), taken on in 1804 as justiciary of Prince Hohenlohe-Ingelfingen's court for Pszczew, Kolno and Kamionna. He witnessed the sale of Pszczew to its inhabitants, was reproved by the Prince's agent, Triebenfeld, in 1808 for not collecting the townspeople's debts, and was to conduct the Prince's lawsuits in 1810.
  bio_de: Justizbürgermeister in Skwierzyna, 1804 als Justitiar des Gerichts für Pszczew, Kolno und Kamionna angenommen. Er wirkte beim Verkauf von Pszczew an die Einwohner mit, wurde 1808 von Triebenfeld gerügt, weil er die Schulden der Bürger nicht eintrieb, und sollte 1810 Prozesse führen. Auch Melzig geschrieben.
neumann:
  bio: Steward of Bojadła, the estate of Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen; iron from the Prince's Silesian ironworks was to be delivered to him in 1809. A boatman of the same name may be another man.
  bio_de: Verwalter von Triebenfelds eigenem Gut in Bojadła (Boyadel), an den 1809 das Eisen aus den schlesischen Werken geliefert werden sollte. Ein Schiffer gleichen Namens wird ebenfalls erwähnt.
pochammer:
  bio: Court fiscal in Berlin, engaged in 1805 and 1806 to pursue Prince Hohenlohe-Ingelfingen's request for a royal loan in treasury notes.
  bio_de: Hoffiskal in Berlin, 1805 und 1806 beauftragt, das Gesuch um ein königliches Darlehen in Tresorscheinen zu betreiben.
trzcinski:
  life: "d. 1815"
  bio: Debtor of Prince Hohenlohe-Ingelfingen on bills from 1813. He died in December 1815, and the Prince's claim on his estate was then disputed with Zerboni.
  bio_de: Ignatz von Trzciński schuldete Hohenlohe-Ingelfingen seit 1813 Geld auf Wechsel. Triebenfeld meldet im Dezember 1815 seinen Tod; eine Forderung gegen den Nachlass war danach mit Zerboni strittig.
winzingerode:
  bio: Count, a minister of Württemberg at the Congress of Vienna, who in 1814 claimed for Prince August of Hohenlohe-Ingelfingen a legacy under the will of Princess Sacken, his grandmother. Father and son of the name both served Württemberg, and which is meant is not known.
  bio_de: Graf Wintzingerode, württembergischer Minister auf dem Wiener Kongress, der 1814 für Fürst August ein Vermächtnis aus dem Testament der Fürstin Sacken forderte. Vater und Sohn dieses Namens dienten Württemberg; welcher gemeint ist, sagen die Briefe nicht.
wollenhaupt:
  bio: Building inspector on Prince Hohenlohe-Ingelfingen's Zagórów estates. He took land at Drzewce on hereditary lease in 1805; the contract was cancelled three months later and he was paid off.
  bio_de: Johann Wilhelm Wollenhaupt, Bauinspektor auf den Gütern. Er nahm 1805 Land in Drzewce in Erbzins; der Vertrag wurde drei Monate später aufgehoben und er abgefunden.
stenger:
  bio: Criminal councillor at Kargowa, whom Peter Friedrich von Triebenfeld engaged in 1810 to put Prince Hohenlohe-Ingelfingen's affairs in the Duchy of Warsaw in order.
  bio_de: Kriminalrat in Kargowa (Karge), den Triebenfeld 1810 beauftragte, die Angelegenheiten der Güter im Herzogtum Warschau zu ordnen.
kalckreuth:
  life: "1737-1818"
  bio: Prussian field marshal. Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, blamed him and a Prince George for the order of 1805 that stopped the revision of the valuations of the Prince's Polish estates.
  bio_de: Friedrich Adolf von Kalckreuth, preußischer Feldmarschall. Triebenfeld machte ihn, zusammen mit Prinz George, für die Verfügung von 1805 verantwortlich, die die Revision der Gutstaxen untersagte.
wellington:
  life: "1769-1852"
  bio: British commander, from February 1815 Britain's representative at the Congress of Vienna, whose doings Peter Friedrich von Triebenfeld reported to Prince Hohenlohe-Ingelfingen in his news from the Congress.
  bio_de: Arthur Wellesley, Herzog von Wellington, britischer Feldherr und seit Februar 1815 Vertreter Großbritanniens auf dem Wiener Kongress. Er erscheint in Triebenfelds Nachrichten vom Kongress.
prittwitz:
  bio: Official named in 1799 as one of those who were to carry out the exchange of Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn.
  bio_de: Ein Beamter, 1799 als einer derjenigen genannt, die den Tausch gegen Krotoszyn regeln sollten.
rybbeck:
  bio: Lessee on Prince Hohenlohe-Ingelfingen's Zagórów estates, with whom the Prince's agent, Triebenfeld, sought a settlement in 1804 over money he had paid and buildings he had put up.
  bio_de: Ein Pächter auf den Gütern von Zagórów, mit dem Triebenfeld 1804 einen Vergleich über gezahlte Gelder und errichtete Bauten suchte.
falz:
  bio: Lawyer who conducted Prince Hohenlohe-Ingelfingen's lawsuits before the tribunal at Kalisz in 1810 and 1811. The spelling of his name is uncertain.
  bio_de: Ein Anwalt, der 1810 und 1811 die Prozesse Hohenlohe-Ingelfingens vor dem Tribunal in Kalisz (Kalisch) führte. Die Schreibung seines Namens ist nicht geklärt.
giese:
  bio: One of three townsmen who took the estate of Oleśnica from Prince Hohenlohe-Ingelfingen on hereditary lease in February 1804. They paid half the entry money and then fell into arrears.
  bio_de: Johann Giese, einer von drei Bürgern, die im Februar 1804 das Gut Oleśnica in Erbpacht nahmen. Sie zahlten die Hälfte des Einstandsgelds und gerieten dann in Rückstand.
seehausen:
  life: "d. by 1816"
  bio: Major, who lent Prince Hohenlohe-Ingelfingen 5,000 Reichsthaler in 1803 against a mortgage on Szetlewek. He had died by 1816, leaving his sister, the widow von Brehmer, as his heir.
  bio_de: Major Johann Friedrich von Seehausen lieh Hohenlohe-Ingelfingen 1803 gegen eine Hypothek auf Szetlewek 5.000 Rthl. Er war 1816 verstorben; Erbin war seine Schwester, die Witwe von Brehmer.
haugwitz:
  life: "1752-1832"
  bio: Count, Prussian foreign minister until 1806. He signed the foreign department's letter of January 1797 telling the other ministers that Antoni Prusimski, the exiled owner of Trąbczyn, was at Venice.
  bio_de: Graf Christian von Haugwitz, preußischer Außenminister bis 1806. Er unterzeichnete das Schreiben vom Januar 1797, mit dem das Departement der auswärtigen Angelegenheiten den anderen Ministern mitteilte, dass Antoni Prusimski in Venedig war. Triebenfeld erwähnt ihn unter den Ministern in Berlin.
lipski:
  bio: Appellate judge who in October 1807, on the order of the Governing Commission of the Duchy of Warsaw, took over the Trąbczyn estates from Prince Hohenlohe-Ingelfingen's officials and handed them to the representative of Michalina Dąbska, born Prusimska. A Count Lipski was public prosecutor at Kalisz in 1812.
  bio_de: Ein Appellationsrichter, der im Oktober 1807 auf Anordnung der regierenden Kommission die Trąbczyner Güter übernahm und dem Bevollmächtigten der Frau von Dąbska übergab. Ein Graf Lipski erscheint 1812 als Generalprokurator in Kalisz (Kalisch).
asch:
  bio: Jewish creditor in Berlin, holder with Gad of a bill for 11,000 Reichsthaler that Peter Friedrich von Triebenfeld had signed for Prince Hohenlohe-Ingelfingen in 1801.
  bio_de: Ein jüdischer Gläubiger in Berlin, mit Gad Inhaber eines Wechsels über 11.000 Rthl, den Triebenfeld 1801 für Hohenlohe-Ingelfingen unterschrieben hatte.
hirschel:
  bio: Creditor with 2,000 Reichsthaler registered on Prince Hohenlohe-Ingelfingen's lordship of Pszczew.
  bio_de: Abraham Moses Hirschel, ein Gläubiger mit 2.000 Rthl, die auf die Herrschaft Pszczew (Betsche) eingetragen waren.
rapacki:
  bio: Polish agent or lawyer who supplied documents and evidence for Prince Hohenlohe-Ingelfingen in his disputes with Broniewski and with Michalina Prusimska between 1799 and 1806.
  bio_de: Ein polnischer Bevollmächtigter oder Anwalt, der zwischen 1799 und 1806 in den Streitigkeiten mit Broniewski und der Prusimska Urkunden und Beweise beibrachte.
scharnhorst:
  life: "1755-1813"
  bio: Prussian general and army reformer. In 1809 a matter concerning Massenbach waited on his decision, and in 1810 he spoke of Prince Hohenlohe-Ingelfingen at Koźle.
  bio_de: Gerhard von Scharnhorst, preußischer General und Heeresreformer. 1809 hing eine Massenbach betreffende Sache an ihm, und 1810 berichtet Triebenfeld, er habe in Koźle (Cosel) von Hohenlohe-Ingelfingen gesprochen.
simon:
  bio: Merchant with a sum registered on the estates of Kamionna and Kolno, against which the bank official Leixner, who had bought them, borrowed.
  bio_de: Ein Kaufmann, für den eine Summe auf Kamionna (Kaemen) und Kolno eingetragen war und auf die der Bankbeamte Leixner Geld aufnahm.
sprengel:
  bio: Surveyor who measured the estate of Szetlewek, on Prince Hohenlohe-Ingelfingen's Zagórów estates, in 1798 at 1,724 Morgen.
  bio_de: Ein Vermesser, der 1798 das Gut Szetlewek mit 1.724 Morgen aufnahm.
titz:
  bio: Forest inspector of Prince Hohenlohe-Ingelfingen on the Trąbczyn and Zagórów estates (also Tietz). He leased the demesne farm of Drzewce and in 1805 took five Hufen of the Trąbczyn farm on hereditary lease.
  bio_de: Carl Titz, Forstinspektor Hohenlohe-Ingelfingens auf den Gütern Trąbczyn und Zagórów. Er pachtete das Vorwerk Drzewce und nahm 1805 fünf Hufen des Vorwerks Trąbczyn in Erbzins. Die Briefe schreiben ihn auch Tietz.
albrecht:
  life: "1765-1835"
  bio: Prussian cabinet councillor. In 1809 a matter of inheritance was referred to him at Königsberg, and in 1815 Peter Friedrich von Triebenfeld asked him to obtain the King's decision on the debt of the Duke of Courland's heirs to Prince Hohenlohe-Ingelfingen.
  bio_de: Daniel Ludwig Albrecht, preußischer Kabinettsrat. 1809 wurde ihm in Königsberg eine Erbschaftssache zugewiesen, und 1815 bat Triebenfeld ihn, die Entscheidung des Königs über die kurländische Schuld zu erwirken.
landskoy:
  life: "1754-1831"
  bio: Head of the Russian provisional government of the Duchy of Warsaw from 1813 to 1815. Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, feared the influence that Stanisław Miączyński, the husband of the Trąbczyn heiress, had with him.
  bio_de: Wassili Sergejewitsch Lanskoi, von 1813 bis 1815 Leiter der russischen provisorischen Regierung des Herzogtums Warschau. Triebenfeld fürchtete den Einfluss, den der Ehemann der Prusimska bei ihm hatte.
merckel:
  bio: Councillor named in 1809 and 1813 in the affairs of Prince Hohenlohe-Ingelfingen. Possibly Friedrich Theodor von Merckel (1775-1846), later chief president of Silesia.
  bio_de: Ein 1809 und 1813 genannter Rat. Möglicherweise Friedrich Theodor von Merckel (1775-1846), später Oberpräsident von Schlesien.
jordan:
  life: "1773-1848"
  bio: Counsellor of legation in the Prussian State Chancellor's office at the Congress of Vienna, with whom Peter Friedrich von Triebenfeld dealt over Prince Hohenlohe-Ingelfingen's petitions.
  bio_de: Johann Ludwig von Jordan, Legationsrat in Hardenbergs Kanzlei auf dem Wiener Kongress.
schulze:
  bio: Privy councillor of finance in the South Prussian department in Berlin, who in 1798 handled the proposal to exchange Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn.
  bio_de: Geheimer Finanzrat im südpreußischen Departement in Berlin, der 1798 den Vorschlag bearbeitete, die Güter gegen Krotoszyn zu tauschen.
schlieben:
  bio: Colonel, who held a royal grant of the estate of Witów near Zagórów; Prince Hohenlohe-Ingelfingen bought it from his widow and heirs in 1799, and the family remained the Prince's creditors for the rest of the price.
  bio_de: Oberst von Schlieben besaß durch königliche Verleihung das Gut Witów (Wittow), das Hohenlohe-Ingelfingen 1799 von seiner Witwe und seinen Erben kaufte. Die Familie blieb Gläubigerin für den Rest des Kaufpreises.
prinz-wilhelm:
  life: "1783-1851"
  bio: Youngest brother of King Friedrich Wilhelm III, present at the congresses of Erfurt in 1808 and Vienna in 1814, where Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, came across him.
  bio_de: Prinz Wilhelm von Preußen, jüngster Bruder Friedrich Wilhelms III. Er wird bei den Kongressen von Erfurt 1808 und Wien 1814 erwähnt.
sanitz:
  bio: Colonel, later major general, of Prince Hohenlohe-Ingelfingen's regiment. He too was given estates confiscated from Antoni Prusimski in 1796, lost them in 1807, and was still claiming compensation in 1826.
  bio_de: Oberst, später Generalmajor von Sanitz, Offizier im Regiment Hohenlohe-Ingelfingens. Er erhielt 1796 andere Prusimski konfiszierte Güter und verlor sie 1807; sein Entschädigungsanspruch lief noch 1826.
chemski:
  bio: 'The family that owned Łukom, the estate next to Trąbczyn, and was at law with the owners of Trąbczyn over the boundary for two centuries: Jerzy in 1644, the brothers Franciszek and Józef Ścibor in 1728, and the brothers Stanisław Ścibor, Treasurer of Wschowa, and Heliodor, a canon, from the 1760s until the Crown Tribunal fixed the boundary in 1782. Each has his own entry; this one gathers the mentions of the family that name no one in particular.'
  bio_de: Die Familie, der Łukomia gehörte, das Nachbargut von Trąbczyn, und die zwei Jahrhunderte lang mit dessen Besitzern um die Grenze stritt. Jerzy Chełmski erwirkte 1644 Versäumnisurteile gegen die Trąmpczyński. Stanisław Ścibor Chełmski hielt 1761 in Pyzdry die Pottasche der Katarzyna Prusimska an. Die Brüder Heliodor und Stanisław Chełmski waren die Gegenseite im Grenzstreit, den eine Kommission 1775 gegen sie entschied. Stanisław, Schatzmeister von Wschowa, der einen eigenen Eintrag hat, lieh Antoni Prusimski 1794 12.000 Dukaten auf Trąbczyn und stritt darum bis 1799 mit Hohenlohe-Ingelfingen und dem Fiskus.
stanislaw-chelmski:
  # The editor, 2026-11-21: the Stanisław of the boundary decree of 1775 and
  # of I. HA GR, Rep. 7 C, Nr. 421. No dates of birth or death are known to
  # the edition; the build shows the years the documents name him.
  bio: Treasurer of Wschowa, owner of Łukom, Łomowo, Imielno and Bukowo, the estates next to Trąbczyn, and for thirty years Antoni Prusimski's adversary at law. From 1766 to 1788 the two fought over woods, boundary mounds and the line between their lands before the courts of Konin and Kalisz, and with his brother, the canon Heliodor, he was the other party when a royal commission fixed the boundary between Trąbczyn and Łukom in 1775. In June 1794 he lent Prusimski 12,000 ducats and was to hold Trąbczyn until repaid. After Prussia confiscated the estate he had to give it up to Prince Hohenlohe-Ingelfingen; he sued the Prussian treasury, and the King refused his claim in 1799.
  bio_de: Stanisław Ścibor Chełmski auf Łukom, Schatzmeister von Wschowa, Erbe von Łukomia, Łomowo, Imielno und Bukowo, den Nachbargütern von Trąbczyn, und dreißig Jahre lang Antoni Prusimskis Nachbar vor Gericht. Die Gerichtsbücher von Konin und Kalisch verzeichnen ihre Prozesse um Wälder, Grenzhügel und Grenzen von 1766 bis 1788, und mit seinem Bruder, dem Domherrn Heliodor, war er die Gegenseite, als eine Kommission 1775 die Grenze zwischen Trąbczyn und Łukomia festlegte. Im Juni 1794 lieh er Prusimski 12.000 Dukaten mit dem Recht, Trąbczyn bis zur Rückzahlung zu besitzen. Nach der Konfiskation musste er das Gut Hohenlohe-Ingelfingen räumen, verklagte den Fiskus und wurde 1799 vom König abgewiesen.
otto:
  bio: Valuer whose estimates of Prince Hohenlohe-Ingelfingen's Polish estates included one that put Trąbczyn at no more than 160,000 Reichsthaler; the Prince's agent, Triebenfeld, rejected it.
  bio_de: Ein Taxator, dessen Anschläge die Briefe anführen, darunter einer, der Trąbczyn auf höchstens 160.000 Rthl ansetzte. Triebenfeld verwarf ihn.
rhode:
  bio: Named between 1805 and 1810 in the affairs of Prince Hohenlohe-Ingelfingen's Polish estates; who he was is not known.
  bio_de: Zwischen 1805 und 1810 in vier Briefen genannt. Wer er war, ist nicht ermittelt.
struensee:
  life: "1735-1804"
  bio: Prussian minister of finance, who in 1798 had to lay the papers on the proposed exchange of Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn before the King.
  bio_de: Carl August von Struensee, preußischer Finanzminister. 1798 hatte er dem König die Akten über den vorgeschlagenen Tausch vorzulegen.
chomanowski:
  bio: Court bailiff in the Duchy of Warsaw, who examined the accounts of the Zagórów estates in 1812.
  bio_de: Ein Komornik (Gerichtsvollzieher) im Herzogtum Warschau, der 1812 die Rechnungen der Güter von Zagórów prüfte.
kaleschke:
  bio: Clerk of the von Stillfried patrimonial court at Górzyce near Wrocław, which in 1805 certified the general power of attorney that Prince Hohenlohe-Ingelfingen gave to Peter Friedrich von Triebenfeld.
  bio_de: Aktuar des von Stillfriedschen Patrimonialgerichts in Górzyce (Guhrwitz) bei Wrocław (Breslau), das die 1805 Triebenfeld erteilte Generalvollmacht beglaubigte.
koeppen:
  bio: Justiciary of the von Stillfried patrimonial court at Górzyce near Wrocław, which in 1805 certified the general power of attorney that Prince Hohenlohe-Ingelfingen gave to Peter Friedrich von Triebenfeld.
  bio_de: Justitiar des von Stillfriedschen Patrimonialgerichts in Górzyce (Guhrwitz) bei Wrocław (Breslau), das die 1805 Triebenfeld erteilte Generalvollmacht beglaubigte.
massenbach:
  life: "1758-1827"
  bio: Prussian colonel, chief of staff to Prince Hohenlohe-Ingelfingen in the campaign of 1806 and later a political writer. The Prince's agent, Triebenfeld, named him as an author of a pamphlet attacking the Prince over the defeat.
  bio_de: Christian von Massenbach, preußischer Oberst und 1806 Generalquartiermeister Hohenlohe-Ingelfingens, später politischer Schriftsteller. Triebenfeld nennt ihn als einen Verfasser einer Schmähschrift gegen den Fürsten.
nathan:
  bio: Creditor of Prince Hohenlohe-Ingelfingen, named in the contracts on the Polish estates between 1804 and 1806.
  bio_de: Salomon Nathan, ein Gläubiger, der zwischen 1804 und 1806 in den Verträgen und Briefen genannt wird.
ogrodowicz:
  bio: Official who certified the hereditary leases of 1806 by which Prince Hohenlohe-Ingelfingen let the land of his Zagórów estates to settlers.
  bio_de: Ein Beamter, der in den Beglaubigungen der Erbpachtverträge von 1806 genannt wird.
tschachmann:
  bio: District administrator, who in 1805 took 20 Hufen at Trąbczyn from Prince Hohenlohe-Ingelfingen on hereditary lease, with the right to sell them on in parcels.
  bio_de: Johann Gottlieb Tschachmann, Landrat, der 1805 in Trąbczyn 20 Hufen in Erbpacht nahm, mit dem Recht, sie stückweise weiterzuverkaufen.
wedel:
  bio: Official at Wrocław in 1798 and 1799, whose opinion on the exchange of Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn the Prince's agent, Triebenfeld, called false.
  bio_de: Ein Beamter in Wrocław (Breslau) 1798 und 1799, dessen Gutachten zum Tausch gegen Krotoszyn Triebenfeld als falsch bezeichnete.
radziwill:
  life: "1775-1833"
  bio: Prince, Polish magnate and from 1815 Prussian governor of the Grand Duchy of Posen. Peter Friedrich von Triebenfeld reported his dispute with the province's chief president, Zerboni, early in 1816.
  bio_de: Fürst Antoni Radziwiłł, polnischer Magnat und seit 1815 preußischer Statthalter des Großherzogtums Posen. Triebenfeld berichtet Anfang 1816 von seinem Streit mit Zerboni.
gneisenau:
  life: "1760-1831"
  bio: Prussian general, chief of staff of the Silesian army in 1813. Peter Friedrich von Triebenfeld delivered a letter from Prince Hohenlohe-Ingelfingen to him at Nysa in June 1813.
  bio_de: August Neidhardt von Gneisenau, preußischer General, 1813 Generalstabschef der Schlesischen Armee. Triebenfeld übergab ihm im Juni 1813 in Nysa (Neisse) ein Schreiben Hohenlohe-Ingelfingens.
kuh:
  bio: Brothers, Jewish bankers and creditors of Prince Hohenlohe-Ingelfingen. They sued the Prince's agent, Triebenfeld, in 1800 and in 1815 were among the creditors who complained against Cosmar's administration of the Prince's Silesian estates.
  bio_de: Die Gebrüder Kuh, jüdische Bankiers und Gläubiger. Sie verklagten Triebenfeld 1800 und gehörten 1815 zu denen, die sich über Cosmar beschwerten.
koppe:
  bio: Secretary and later assessor in the service of Prince Hohenlohe-Ingelfingen (also Koppen), through whom the Prince's agent, Triebenfeld, learned in October 1806 that the Prince had survived the defeat at Jena. In 1808, back from Paris, he was to receive the papers about the Eysenhardt money; by 1815 he worked in Hanover.
  bio_de: Sekretär und später Assessor im Dienst Hohenlohe-Ingelfingens, durch den Triebenfeld im Oktober 1806 erfuhr, dass der Fürst die Niederlage überlebt hatte. 1808, aus Paris zurück, sollte er Papiere über die Eysenhardtschen Gelder erhalten; 1815 war er in Hannover angestellt. Auch Koppen geschrieben.
biron:
  bio: Prince of Courland, a landowner in Silesia, who passed on an inquiry about Prince Hohenlohe-Ingelfingen's estate of Kamionna in 1804. Probably Gustav Kalixt von Biron (1780-1821).
  bio_de: Ein Prinz Biron von Kurland, Grundbesitzer in Schlesien, der 1804 eine Anfrage wegen der Güter von Kamionna (Kaemen) weitergab. Vermutlich Gustav Kalixt von Biron (1780-1821).
schuckmann:
  life: "1755-1834"
  bio: Prussian official, a president in 1800 and from 1814 minister of the interior. In 1820 the foreign ministry left it to him to tell the heirs of Prince Hohenlohe-Ingelfingen and Count Bethusy that Russia had refused their claims.
  bio_de: Friedrich von Schuckmann, preußischer Beamter, 1800 als Präsident genannt, seit 1814 Innenminister. 1820 überließ ihm das Außenministerium, die Hohenloher Erben und Graf Bethusy von der russischen Ablehnung zu unterrichten.
mencke:
  life: "1752-1801"
  bio: Cabinet councillor to Friedrich Wilhelm III, to whom Peter Friedrich von Triebenfeld wrote in 1798 about the exchange of Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn.
  bio_de: Anastasius Ludwig Mencken, Kabinettsrat Friedrich Wilhelms III. Triebenfeld schrieb ihm 1798 wegen des Tausches gegen Krotoszyn.
zychlinski:
  bio: Former district administrator, later sub-prefect at Kalisz in the Duchy of Warsaw.
  bio_de: Ein früherer Landrat, später Unterpräfekt in Kalisz (Kalisch) im Herzogtum Warschau.
floricke:
  bio: Lessee on Prince Hohenlohe-Ingelfingen's Zagórów estates, against whom and his partners the Prince's agent, Triebenfeld, obtained a payment order in 1804.
  bio_de: Ein Pächter auf den Gütern von Zagórów, gegen den und dessen Mitpächter Triebenfeld 1804 ein Zahlungsdekret erwirkte.
fischbach:
  bio: Resident of Pszczew, for whom a title was requested in 1799 and who offered in 1810 to broker an exchange of Prince Hohenlohe-Ingelfingen's Zagórów estates with von Knobelsdorff.
  bio_de: Carl Theodor Fischbach aus Pszczew (Betsche), für den 1799 ein Titel erbeten wurde und der 1810 anbot, den Tausch mit von Knobelsdorff zu vermitteln.
boidelang:
  bio: Friend of Peter Friedrich von Triebenfeld and confidant of Wilhelm von Humboldt, expected late in 1815 to succeed Barbe in the Prussian State Chancellor's office.
  bio_de: Ein Freund Triebenfelds und Vertrauter Humboldts, der Ende 1815 als Nachfolger Barbes in Hardenbergs Büro erwartet wurde.
eugen-wuerttemberg:
  life: "1788-1857"
  bio: General in Russian service and nephew of the Dowager Empress of Russia. In 1820 he recommended to the Russian government the claims of Prince Hohenlohe-Ingelfingen's heirs and of Count Bethusy.
  bio_de: Herzog Eugen von Württemberg, General in russischen Diensten und Neffe der Kaiserinmutter. 1820 empfahl er der russischen Regierung die Ansprüche der Hohenloher Erben und des Grafen Bethusy.
hoffmann-legationsrath:
  life: "1765-1847"
  bio: Official of the Prussian foreign ministry who initialled its drafts of 1816 and 1820 on Prince Hohenlohe-Ingelfingen's claim to compensation for Trąbczyn. Probably Johann Gottfried Hoffmann, economist and councillor of state, whose dates are given here.
  bio_de: Ein Beamter des preußischen Außenministeriums, der dessen Entwürfe von 1816 und 1820 paraphierte. Vermutlich Johann Gottfried Hoffmann, Nationalökonom und Staatsrat, dessen Lebensdaten hier stehen.
chwalowski:
  bio: Sworn surveyor who measured the estate of Oleśnica, near Zagórów, with Cabanis and Winitzki.
  bio_de: Ein vereidigter Vermesser, der mit Cabanis und Winitzki Oleśnica vermaß.
dohna:
  bio: Count, named in 1809 and 1810 in the affairs of Prince Hohenlohe-Ingelfingen; probably Alexander zu Dohna-Schlobitten, Prussian minister of the interior in those years.
  bio_de: Ein 1809 und 1810 genannter Graf Dohna, vermutlich Alexander zu Dohna-Schlobitten, in diesen Jahren preußischer Innenminister.
flesch:
  bio: Broker in an exchange of estates proposed in 1810, whom Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, came to suspect of fraud.
  bio_de: Ein Unterhändler bei einem 1810 vorgeschlagenen Gütertausch, den Triebenfeld bald des Betrugs verdächtigte.
massow:
  bio: Prussian official who signed the ministry's note of 18 October 1799 on Stanisław Chełmski's petition over Trąbczyn; a Massow is also named in 1809 and 1810. Which bearer of the name is meant, and whether it is one man, is not known.
  bio_de: Ein 1809 und 1810 genannter preußischer Beamter, und der Massow, der den Vermerk des Ministeriums vom 18. Oktober 1799 auf Chełmskis Eingabe unterschrieb. Welcher Träger des Namens gemeint ist und ob es ein Mann ist, sagen die Dokumente nicht.
pirch:
  bio: Major, whom Peter Friedrich von Triebenfeld in 1809 called the truest friend of Prince Hohenlohe-Ingelfingen at the Prussian court in Königsberg.
  bio_de: Major von Pirch, den Triebenfeld 1809 den treuesten Freund Hohenlohe-Ingelfingens am Hof in Königsberg nannte.
szczucki:
  bio: Landowner next to Szetlewek, in dispute with Prince Hohenlohe-Ingelfingen's estate there around 1799, whom the Prince's agent, Triebenfeld, meant to sue in 1805.
  bio_de: Ein benachbarter Gutsbesitzer, um 1799 bei Szetlewek mit dem Gut im Streit, den Triebenfeld 1805 verklagen wollte.
werner:
  bio: Cabinet councillor who claimed a commission of two per cent in 1804 for proposing a buyer for Prince Hohenlohe-Ingelfingen's estates of Kamionna and Kolno.
  bio_de: Ein Kabinettsrat, der 1804 zwei Prozent Provision dafür forderte, einen Käufer für Kamionna (Kaemen) und Kolno vorgeschlagen zu haben.
chmara:
  bio: One of the two representatives of the townspeople and villages of Pszczew who bought the lordship from Prince Hohenlohe-Ingelfingen in 1804.
  bio_de: Jan Chmara, einer der beiden Vertreter der Bürger und Dörfer von Pszczew (Betsche) beim Kauf der Herrschaft 1804.
falkenhausen:
  bio: Named in 1809, as sent by Archduke Ferdinand, and again in 1815, in the affairs of Prince Hohenlohe-Ingelfingen; who he was is not known.
  bio_de: 1809 als Abgesandter des Erzherzogs Ferdinand genannt, und erneut 1815. Wer er war, ist nicht ermittelt.
feller:
  bio: Named in the contract of 1804 by which Prince Hohenlohe-Ingelfingen sold the lordship of Pszczew to its inhabitants.
  bio_de: Im Vertrag über Pszczew (Betsche) von 1804 genannt.
guderian:
  bio: Attorney who held Leixner's power of attorney in the purchase of the estates of Kamionna and Kolno from Prince Hohenlohe-Ingelfingen. The Prince's agent, Triebenfeld, thought him in league with Broniewski, who contested the Prince's title.
  bio_de: Ein Bevollmächtigter Leixners beim Kauf von Kamionna (Kaemen) und Kolno. Triebenfeld hielt ihn für einen Verbündeten Broniewskis.
luka:
  bio: Miller at Białobrzeg, who agreed in 1798 to buy the farm of Szetlewek from Prince Hohenlohe-Ingelfingen for 12,333 Reichsthaler and gave up the contract the next year.
  bio_de: Samuel Lucke, Müller in Białobrzeg, der 1798 das Vorwerk Szetlewek für 12.333 Rthl kaufen wollte und den Vertrag im folgenden Jahr aufgab.
mlynkiewicz:
  bio: One of the two representatives of the townspeople and villages of Pszczew who bought the lordship from Prince Hohenlohe-Ingelfingen in 1804.
  bio_de: Matheus Młynkiewicz, einer der beiden Vertreter der Bürger und Dörfer von Pszczew (Betsche) beim Kauf der Herrschaft 1804.
reinhardt:
  bio: Named in 1798 as a correspondent on official business and in 1804 at Poznań, in the affairs of Prince Hohenlohe-Ingelfingen; who he was is not known.
  bio_de: 1798 als Korrespondent in Amtssachen und 1804 in Poznań (Posen) genannt. Für eine Identifizierung ist zu wenig gesagt.
heuthausen:
  bio: Agent of Prince Hohenlohe-Ingelfingen, recommended in 1811 to collect the arrears at Pszczew and later sent to Kalisz to examine the mortgage books.
  bio_de: Ein Bevollmächtigter Hohenlohe-Ingelfingens, 1811 für die Eintreibung der Rückstände in Pszczew (Betsche) empfohlen und später nach Kalisz (Kalisch) gesandt, um die Hypothekenbücher zu prüfen.
ludolff:
  bio: Councillor who valued Prince Hohenlohe-Ingelfingen's estates of Kamionna and Kolno for a prospective buyer in 1804.
  bio_de: Ein Rat, der 1804 die Güter Kamionna (Kaemen) und Kolno für einen Kaufinteressenten taxierte.
prinz-alexander:
  bio: Younger son of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, for whom his father's agent, Triebenfeld, suggested in 1811 that the Silesian estate of Koszęcin be kept as an entail.
  bio_de: Ein jüngerer Sohn Hohenlohe-Ingelfingens, für den Triebenfeld 1811 vorschlug, Koszęcin (Koschentin) als Majorat zu behalten.
ruechel:
  life: "1754-1823"
  bio: Prussian general, who commanded a corps beside Prince Hohenlohe-Ingelfingen's army at Jena in 1806.
  bio_de: Ernst von Rüchel, preußischer General, der 1806 bei Jena neben Hohenlohe-Ingelfingen ein Korps befehligte.
repnin:
  life: "1734-1801"
  bio: Prince, Russian field marshal, in Berlin on a diplomatic mission in 1798, when Peter Friedrich von Triebenfeld was there on Prince Hohenlohe-Ingelfingen's business.
  bio_de: Fürst Nikolai Wassiljewitsch Repnin, russischer Feldmarschall, 1798 in diplomatischer Mission in Berlin.
ortel:
  bio: Lieutenant general at Neustadt in Silesia in June 1813, to whom Peter Friedrich von Triebenfeld took his plan for supplying the army.
  bio_de: Ein Generalleutnant im Juni 1813 in Neustadt in Schlesien, dem Triebenfeld seinen Plan zur Verpflegung der Armee vortrug.
seegebarth:
  bio: Official of the General Post Office in Berlin and a creditor of Prince Hohenlohe-Ingelfingen, whom the Prince's agent, Triebenfeld, wished to put off in 1810.
  bio_de: Ein Beamter des Generalpostamts in Berlin und Gläubiger, den Triebenfeld 1810 vertrösten wollte.
wratislaw:
  bio: Count, a former guardian, concerned in 1809 with an inheritance that Peter Friedrich von Triebenfeld laid before the Queen of Prussia.
  bio_de: Ein Graf Wratislaw, früherer Vormund, 1809 mit einer Erbschaft befasst, die Triebenfeld der Königin vortrug.
mitschke:
  bio: Justice commissioner and advocate at Kalisz, instructed in 1811 to sue on behalf of the Invalids' Fund for the interest on its loan to Prince Hohenlohe-Ingelfingen.
  bio_de: Justizkommissar und Advokat in Kalisz (Kalisch), 1811 beauftragt, für die Invalidenkasse zu klagen.
hussarzewski:
  bio: Government councillor at Kalisz, through whom the dispute over the lease of Oleśnica went back to the patrimonial court of the Zagórów estates in 1805.
  bio_de: Ein Regierungsrat in Kalisz (Kalisch), über den die Sache um Oleśnica 1805 an das Patrimonialgericht zurückging.
bertrand:
  life: "1773-1844"
  bio: French general and Grand Marshal of the Palace, who went with Napoleon to Elba and returned with him in 1815, as Peter Friedrich von Triebenfeld reported from Vienna.
  bio_de: Henri-Gatien Bertrand, französischer General und Großmarschall des Palastes, der Napoleon nach Elba und 1815 zurück begleitete.
schulz-wilhelm-daniel:
  bio: Settler from Krolikowo, one of six who took the farm of Althütte from Prince Hohenlohe-Ingelfingen on hereditary lease in 1804.
  bio_de: Ein Siedler aus Krolikowo, einer von sechs, die 1804 das Vorwerk Althütte in Erbpacht nahmen.
bagans:
  bio: One of three townsmen who took the estate of Oleśnica from Prince Hohenlohe-Ingelfingen on hereditary lease in February 1804.
  bio_de: Johann Bagans, einer von drei Bürgern, die im Februar 1804 das Gut Oleśnica in Erbpacht nahmen.
gietzinger:
  bio: One of three townsmen who took the estate of Oleśnica from Prince Hohenlohe-Ingelfingen on hereditary lease in February 1804.
  bio_de: Friedrich Gietzinger, einer von drei Bürgern, die im Februar 1804 das Gut Oleśnica in Erbpacht nahmen.
zajaczek:
  life: "1752-1826"
  bio: Polish general and from 1815 the Tsar's viceroy in the Kingdom of Poland. His report of 1819 on Count Bethusy's request for free movement between his properties went with the Russian note of 1820 that also refused the claim of Prince Hohenlohe-Ingelfingen's heirs.
  bio_de: Józef Zajączek, polnischer General und seit 1815 Statthalter des Zaren im Königreich Polen. Sein Bericht von 1819 über das Gesuch des Grafen Bethusy liegt der russischen Note von 1820 bei.
amstetten:
  bio: General who headed a commission at the Congress of Vienna, to which Peter Friedrich von Triebenfeld submitted the papers on Prince Hohenlohe-Ingelfingen's claim to Trąbczyn in 1815. Possibly the Russian diplomat Johann von Anstett.
  bio_de: Ein General, der auf dem Wiener Kongress eine Kommission leitete, bei der Triebenfeld 1815 die Akten über Trąbczyn einreichte. Möglicherweise der russische Diplomat Johann von Anstett.
brandenstein:
  bio: Party to a contract with Leixner concerning Pszczew, which the townspeople and villages buying the lordship from Prince Hohenlohe-Ingelfingen demanded be cancelled in 1804.
  bio_de: Partei eines Vertrags mit Leixner über Pszczew (Betsche), dessen Aufhebung die Käufer 1804 verlangten.
bulow:
  life: "1774-1825"
  bio: Prussian minister of finance from 1813. In December 1814 he and the minister of justice, Kircheisen, were ordered to inquire into Cosmar's administration of Prince Hohenlohe-Ingelfingen's Silesian estates.
  bio_de: Ludwig Friedrich Viktor Hans von Bülow, preußischer Finanzminister seit 1813. Im Dezember 1814 erging an ihn und an Kircheisen der Befehl, eine Untersuchung gegen Cosmar einzusetzen.
goerne:
  bio: Named in 1798 and 1800 in the affairs of Prince Hohenlohe-Ingelfingen; who he was is not known.
  bio_de: In zwei Briefen von 1798 und 1800 genannt. Wer er war, ist nicht ermittelt.
kurnatowski:
  bio: Named in 1815 and 1816 in the affairs of Prince Hohenlohe-Ingelfingen; who he was is not known.
  bio_de: In zwei Briefen von 1815 und 1816 genannt. Wer er war, ist nicht ermittelt.
smidkowski:
  bio: Lessee on the Trąbczyn estates who offered in 1810 to pay several thousand Reichsthaler at once to keep his lease.
  bio_de: Ein Pächter auf den Trąbczyner Gütern, der 1810 anbot, sogleich mehrere tausend Rthl zu zahlen, um bleiben zu können.
smiedecki:
  bio: Chief prefect at Kalisz in 1816, whom Peter Friedrich von Triebenfeld believed he had won for a favourable report on Prince Hohenlohe-Ingelfingen's claim to compensation.
  bio_de: Oberpräfekt in Kalisz (Kalisch) 1816, den Triebenfeld für einen günstigen Bericht über den Entschädigungsanspruch gewonnen zu haben glaubte.
bewert:
  bio: Named in a contract of 1805 on Prince Hohenlohe-Ingelfingen's Polish estates; who he was is not known.
  bio_de: Einmal in einem Vertrag von 1805 genannt.
gelanski:
  bio: Named in 1799 in the affairs of Szetlewek, a farm of Prince Hohenlohe-Ingelfingen's Zagórów estates; who he was is not known.
  bio_de: Florian Gelanski, einmal in einem Dokument von 1799 über Szetlewek genannt.
gunter:
  bio: Named in 1799 in the affairs of Prince Hohenlohe-Ingelfingen's Polish estates; who he was is not known.
  bio_de: Einmal in einem Dokument von 1799 genannt.
hache:
  bio: Named in 1809 beside Major von Pirch at the Prussian court in Königsberg; who he was is not known.
  bio_de: Ein von Hache, 1809 einmal neben Major von Pirch in Königsberg genannt.
hertzog:
  bio: Named in 1799 in the affairs of Prince Hohenlohe-Ingelfingen's Polish estates; who he was is not known.
  bio_de: Einmal in einem Dokument von 1799 genannt.
jankowski:
  bio: Landowner of Ninino, who sold the free mayor's holding at Dormowo, in the lordship of Pszczew, to Captain Gneust in 1797.
  bio_de: Joseph von Jankowski aus Ninino, der 1797 das Freischulzengut in Dormowo an Hauptmann Gneust verkaufte.
knoblauch:
  bio: Named in 1803 in the affairs of Prince Hohenlohe-Ingelfingen's Polish estates; who he was is not known.
  bio_de: Einmal in einem Dokument von 1803 genannt.
sarre:
  bio: Settler from the Pyzdry Hauland (Bogumił in Polish), who in 1806 took a Hufe and a half of forest land near Trąbczyn from Prince Hohenlohe-Ingelfingen on hereditary lease.
  bio_de: Gottlieb Sarre, ein Hauländer aus dem Hauland von Pyzdry (Peisern), der 1806 anderthalb Hufen Waldland bei Trąbczyn in Erbpacht nahm. Der polnische Text des Vertrags nennt ihn Bogumił.
schmaling:
  bio: Named in a contract of 1804 on Prince Hohenlohe-Ingelfingen's Polish estates; who he was is not known.
  bio_de: Einmal in einem Vertrag von 1804 genannt.
stade:
  bio: Named in a contract of 1805 on Prince Hohenlohe-Ingelfingen's Polish estates; who he was is not known.
  bio_de: Einmal in einem Vertrag von 1805 genannt.
stillfried:
  bio: Barons, lords of Górzyce near Wrocław, whose patrimonial court in 1805 certified the general power of attorney that Prince Hohenlohe-Ingelfingen gave to Peter Friedrich von Triebenfeld.
  bio_de: Die Freiherren von Stillfried, Herren von Górzyce (Guhrwitz) bei Wrocław (Breslau), deren Patrimonialgericht die 1805 Triebenfeld erteilte Generalvollmacht beglaubigte.
goetzen:
  life: "1767-1820"
  bio: Count, Prussian general and governor of Silesia in 1807 and 1808, whom Peter Friedrich von Triebenfeld named in 1809 as a witness in a matter of inheritance.
  bio_de: Graf Friedrich Wilhelm von Götzen, preußischer General und 1807 und 1808 Gouverneur von Schlesien. Triebenfeld nannte ihn 1809 als Zeugen in einer Erbschaftssache.
poniatowski:
  life: "1763-1813"
  bio: Prince, minister of war of the Duchy of Warsaw. A letter of his in 1811 led the tribunal at Kalisz to refer Prince Hohenlohe-Ingelfingen's case over Trąbczyn to higher authority.
  bio_de: Fürst Józef Poniatowski, Kriegsminister des Herzogtums Warschau. Ein Schreiben von ihm veranlasste 1811 das Tribunal in Kalisz (Kalisch), die Trąbczyner Sache an eine höhere Stelle zu verweisen.
veit:
  bio: Berlin banker who paid Peter Friedrich von Triebenfeld 3,000 Reichsthaler for Prince Hohenlohe-Ingelfingen in 1808.
  bio_de: Ein Berliner Bankier, der Triebenfeld 1808 für Hohenlohe-Ingelfingen 3.000 Rthl auszahlte.
thaer:
  life: "1752-1828"
  bio: Agronomist and founder of the agricultural academy at Möglin, whom Prince Hohenlohe-Ingelfingen mentioned in 1811.
  bio_de: Albrecht Daniel Thaer, Agrarwissenschaftler und Gründer der landwirtschaftlichen Akademie in Möglin. Hohenlohe-Ingelfingen erwähnt ihn in einem Brief von 1811.
bubna:
  life: "1768-1825"
  bio: Count, Austrian general, of whom Peter Friedrich von Triebenfeld wrote in his news from Vienna in 1815.
  bio_de: Graf Ferdinand von Bubna und Littitz, österreichischer General, 1815 in Triebenfelds Nachrichten aus Wien erwähnt.
knobloch:
  bio: Official named in 1799, with Prittwitz, as one of those who were to carry out the exchange of Prince Hohenlohe-Ingelfingen's Polish estates for the domain of Krotoszyn.
  bio_de: Ein Beamter, 1799 zusammen mit Prittwitz als einer derjenigen genannt, die den Tausch gegen Krotoszyn regeln sollten.
reinbeck:
  bio: Privy councillor in Berlin who handled the approval of the division of Prince Hohenlohe-Ingelfingen's Zagórów and Trąbczyn estates among settlers in 1805.
  bio_de: Ein Geheimer Rat in Berlin, der 1805 die Genehmigung der Teilung der Güter bearbeitete.
roeder:
  bio: General, named in 1813; probably Friedrich Erhard von Röder (1768-1834).
  bio_de: Ein 1813 genannter General von Roeder. Vermutlich Friedrich Erhard von Röder (1768-1834).
valentini:
  bio: Prussian staff officer, named in June 1813, when Peter Friedrich von Triebenfeld was with the army in Silesia.
  bio_de: Ein im Juni 1813 genannter preußischer Stabsoffizier.
schroeder:
  bio: Councillor whom Peter Friedrich von Triebenfeld mentioned from Vienna in 1815; who he was is not known.
  bio_de: Ein Rat, einmal in einem Brief aus Wien von 1815 genannt.
kielczewski:
  bio: President of the tribunal at Kalisz in the Duchy of Warsaw in 1811, while it heard the case over Trąbczyn.
  bio_de: Präsident des Tribunals in Kalisz (Kalisch) im Herzogtum Warschau, 1811 genannt.
wiener:
  bio: Merchant who offered in 1810 to buy Świniary, the estate of Peter Friedrich von Triebenfeld.
  bio_de: Ein Kaufmann, der 1810 anbot, Triebenfelds Gut Świniary (Schweinern) zu kaufen.
wiesolowski:
  bio: Colonel and cousin of Peter Friedrich von Triebenfeld, who passed on news of Russian troop movements in 1805.
  bio_de: Ein Oberst und Vetter Triebenfelds, der 1805 Nachrichten über russische Truppenbewegungen weitergab.
scharffenberg:
  bio: Colonel, named in 1810 in the affairs of Prince Hohenlohe-Ingelfingen; who he was is not known.
  bio_de: Ein Oberst, 1810 einmal genannt.
gumperts:
  bio: Medical councillor at Kalisz, who in 1811 was negotiating with Count Wartensleben for the estate that Peter Friedrich von Triebenfeld wanted in exchange for the Zagórów estates.
  bio_de: Ein Medizinalrat in Kalisz (Kalisch), der 1811 mit Graf Wartensleben über das Gut verhandelte, das Triebenfeld wünschte.
schulz-strelitz:
  bio: Postmaster at Strelitz, named in 1809 in the affairs of Prince Hohenlohe-Ingelfingen.
  bio_de: Postmeister in Strelitz, 1809 einmal genannt.
itzig:
  bio: Creditor of Prince Hohenlohe-Ingelfingen, from whom the Prince's lawyer Amelang called in 18,000 Reichsthaler in 1805; the name is a doubtful reading. Probably of the Berlin banking family Itzig.
  bio_de: Ein jüdischer Gläubiger, bei dem Amelang 1805 18.000 Rthl kündigte; der Name ist unsicher gelesen. Vermutlich aus der Berliner Bankiersfamilie Itzig.
echtler:
  bio: Dealer or craftsman named in 1805 as likely to have plaster busts finished to look like bronze.
  bio_de: Ein Händler oder Hersteller, 1805 einmal genannt, weil er vermutlich bronzierte Gipsbüsten vorrätig habe.
erbet:
  bio: Settler of the Trąbczyn Hauland, who on 31 March 1806 took one Hufe of the Trąbczyn forest from Prince Hohenlohe-Ingelfingen on hereditary lease. He signed with a cross.
  bio_de: Christoph Erbet, Siedler im Trąbczyner Hauland, der am 31. März 1806 eine Hufe des Trąbczyner Forstes in Erbpacht nahm. Er unterzeichnete mit einem Kreuz.
baildon:
  life: "1772-1846"
  bio: Scottish engineer in Prussian service and a pioneer of smelting iron with coke in Upper Silesia. He was Prince Hohenlohe-Ingelfingen's partner in the coke blast furnace at the Sławięcice ironworks, and the Prince's will of 1805 tells his heir to keep him on.
  bio_de: John Baildon, schottischer Ingenieur in preußischen Diensten und Wegbereiter der Kokshochöfen in Oberschlesien. Er war Teilhaber Hohenlohe-Ingelfingens am Kokshochofen der Werke in Sławięcice (Schlawenschitz), und das Testament von 1805 weist den Erben an, ihn zu behalten.
prinzessin-adelheid:
  bio: Eldest daughter of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. Under her father's will of 1805 she was to inherit his Silesian ironworks and his houses in Wrocław if the male line died out.
  bio_de: Prinzessin Adelheid, älteste Tochter Hohenlohe-Ingelfingens. Nach seinem Testament von 1805 sollte sie die schlesischen Hüttenwerke und die Häuser in Wrocław (Breslau) erben, wenn der Mannesstamm erlosch.
prinzessin-auguste:
  bio: Third daughter of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. Under her father's will of 1805 she was to inherit his Polish estates if the male line died out.
  bio_de: Prinzessin Auguste, dritte Tochter Hohenlohe-Ingelfingens. Nach seinem Testament von 1805 sollte sie die südpreußischen Güter erben, wenn der Mannesstamm erlosch.
mondro:
  bio: Criminal councillor at Kalisz. In 1799 he was the lawyer of Stanisław Chełmski, pressing Chełmski's claim on the confiscated Trąbczyn against the Prussian treasury; in 1805 he represented Prince Hohenlohe-Ingelfingen and brought the Prince's three suits against the lessees of Oleśnica.
  bio_de: Kriminalrat zu Kalisch. 1799 war er der Anwalt Stanisław Chełmskis und betrieb dessen Forderung auf das konfiszierte Trąbczyn gegen den Fiskus; 1805 war er der Rechtsvertreter Hohenlohe-Ingelfingens und erhob die drei Klagen gegen die Pächter von Oleśnica.
winitzki:
  bio: Sworn surveyor who measured the estate of Oleśnica, near Zagórów, with Chwalowski and Cabanis.
  bio_de: Ein vereidigter Vermesser, der mit Chwalowski und Cabanis Oleśnica vermaß.
bluecher:
  life: "1742-1819"
  bio: Major general, given the confiscated estates of Duninów in 1796 by the same order that gave Prince Hohenlohe-Ingelfingen the Prusimski estates. Presumably Gebhard Leberecht von Blücher, the later field marshal, whose dates are given here.
  bio_de: Generalmajor von Blücher, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen die konfiszierten Güter Duninów verliehen wurden. Vermutlich Gebhard Leberecht von Blücher, der spätere Feldmarschall, dessen Lebensdaten hier stehen.
dolffs:
  bio: Lieutenant general, given the estate of Strzelce in 1796 by the same order that gave Prince Hohenlohe-Ingelfingen the Prusimski estates.
  bio_de: Generalleutnant von Dolffs, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen das Gut Strzelce verliehen wurde.
pontanus:
  bio: Major, given three confiscated estates in 1796 by the same order that gave Prince Hohenlohe-Ingelfingen the Prusimski estates.
  bio_de: Major von Pontanus, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen drei konfiszierte Güter verliehen wurden.
holtzendorff:
  bio: Lieutenant, given three confiscated estates in 1796 by the same order that gave Prince Hohenlohe-Ingelfingen the Prusimski estates.
  bio_de: Leutnant von Holtzendorff, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen drei konfiszierte Güter verliehen wurden.
larisch:
  life: "1734-1811"
  bio: Major general, given the estate of Lekarzewice in 1796 by the same order that gave Prince Hohenlohe-Ingelfingen the Prusimski estates. Probably Johann Karl Leopold von Larisch, whose dates are given here.
  bio_de: Generalmajor von Larisch, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen das Gut Lekarzewice verliehen wurde. Vermutlich Johann Karl Leopold von Larisch, dessen Lebensdaten hier stehen.
von-der-reck:
  life: "1744-1816"
  bio: Prussian minister of justice, to whom Count Hoym sent the grants of confiscated estates of 1796 to be made out. In January 1802 Michalina Prusimska's petition to the King was passed to him to hasten her appeal against Prince Hohenlohe-Ingelfingen; he had her told that the appeal judgment had been sent back to be published.
  bio_de: Eberhard von der Reck, preußischer Justizminister, dem Hoym die Verleihungen von 1796 zur Ausfertigung zusandte. Im Januar 1802 wurde ihm Michalina Prusimskas Bittschrift an den König zur Beschleunigung ihrer Appellation zugeleitet; er ließ ihr mitteilen, das Appellationsurteil sei zur Verkündung zurückgesandt.
bever:
  bio: Registry official in Berlin, who in May 1816 passed Zerboni's report on Prince Hohenlohe-Ingelfingen's claim to the foreign ministry and in 1826 sent up the file on the grants of 1796.
  bio_de: Ein Registraturbeamter in Berlin, der den Vermerk vom Mai 1816 über die Abgabe von Zerbonis Bericht an das Außenministerium unterzeichnete und 1826 die Akte über die Urkunden von 1796 vorlegte.
kuester:
  bio: Official of the Prussian State Chancellor's office at Vienna, who noted in November 1814 that Peter Friedrich von Triebenfeld's petition for Prince Hohenlohe-Ingelfingen had been passed to Stägemann.
  bio_de: Ein Beamter der Kanzlei des Staatskanzlers in Wien, der im November 1814 vermerkte, dass Triebenfelds Eingabe an Stägemann abgegeben war.
alopeus:
  life: "d. 1831"
  bio: Russian envoy at Berlin, who signed the note of 31 January 1820 refusing the claim of Prince Hohenlohe-Ingelfingen's heirs to compensation for Trąbczyn. A year earlier, on 20 January 1819, he had sent the Prussian ministry a report from Warsaw supporting Michalina Miączyńska's claim against Prussia.
  bio_de: David Alopaeus, russischer Gesandter in Berlin, der die Note vom 31. Januar 1820 unterzeichnete, mit der der Anspruch der Hohenloher Erben abgelehnt wurde. Ein Jahr zuvor, am 20. Januar 1819, hatte er dem preußischen Ministerium einen Bericht aus Warschau übersandt, der die Forderung der Michalina Miączyńska gegen Preußen unterstützte.
ancillon:
  life: "1767-1837"
  bio: Historian and counsellor in the Prussian foreign ministry, later foreign minister, to whom the Russian note of 1820 refusing the claim of Prince Hohenlohe-Ingelfingen's heirs was addressed.
  bio_de: Johann Peter Friedrich Ancillon, Historiker und Rat im preußischen Außenministerium, später Außenminister. An ihn ist die russische Note von 1820 gerichtet.
sobolewski:
  life: "1770-1846"
  bio: Count, minister secretary of state of the Kingdom of Poland at St Petersburg, whose reply confirmed the refusal of 1820 of the claim of Prince Hohenlohe-Ingelfingen's heirs.
  bio_de: Graf Ignacy Sobolewski, Minister-Staatssekretär des Königreichs Polen in St. Petersburg, dessen Antwort die Ablehnung von 1820 bestätigte.
strenger:
  bio: Registry clerk of the Prussian foreign ministry, who in May 1816 attached Zerboni's report on Prince Hohenlohe-Ingelfingen's claim to the file.
  bio_de: Ein Registraturbeamter des preußischen Außenministeriums, der den Vermerk vom Mai 1816 unterzeichnete, mit dem Zerbonis Bericht zur Akte genommen wurde.
dabrowski:
  bio: Named in 1804 in the handover of the estate of Wieniec; nothing shows that he was the general of the same name.
  bio_de: 1804 einmal im Zusammenhang mit der Übergabe des Gutes Wieniec genannt. Soweit der Brief erkennen lässt, nicht der General gleichen Namens.
magnuski:
  bio: Creditor or claimant on whose account money owed to Prince Hohenlohe-Ingelfingen was attached in 1805.
  bio_de: Ein Gläubiger oder Anspruchsteller, dessentwegen 1805 Gelder Hohenlohe-Ingelfingens mit Arrest belegt wurden.
uminski:
  bio: Prospective buyer of Prince Hohenlohe-Ingelfingen's estates of Kamionna in 1804, who thought the price too high.
  bio_de: Ein Kaufinteressent für die Güter von Kamionna (Kaemen) im Jahr 1804, der den Preis zu hoch fand.
zglinski:
  bio: Lessee on Prince Hohenlohe-Ingelfingen's Polish estates whose lease was cancelled or shortened in 1806.
  bio_de: Ein Pächter auf den Gütern, dessen Pachtvertrag 1806 aufgehoben oder verkürzt wurde.
# Split 2026-10-04 (editor: one entry per person).
michaelis-hoffiskal:
  bio: Court fiscal in Berlin who acted for Prince Hohenlohe-Ingelfingen in 1798, during the attempt to exchange the Prince's Polish estates for the domains of Krotoszyn and Połajewo, and wrote to the Prince himself.
  bio_de: Ein Hoffiskal in Berlin, der 1798, während des Versuchs, die Güter gegen Krotoszyn und Polajewo zu tauschen, als Agent Hohenlohe-Ingelfingens tätig war und ihm selbst schrieb.
michaelis-christiane:
  bio: Widow of a senior district official, of Wrocław, born Eichborn, who held a mortgage of 5,000 Reichsthaler on Prince Hohenlohe-Ingelfingen's lordship of Pszczew.
  bio_de: Christiane Dorothea Michaelis, geborene Eichborn, aus Wrocław, Witwe eines Oberamtsrats. Sie hatte eine Hypothek von 5.000 Rthl auf der Herrschaft Pszczew.
michaelis-kaufmann:
  bio: Merchant who in 1809 advanced Peter Friedrich von Triebenfeld 2,400 Reichsthaler against a contract to deliver 600 hundredweight of iron from Prince Hohenlohe-Ingelfingen's Silesian ironworks.
  bio_de: Ein Kaufmann, der Triebenfeld 1809 2.400 Rthl gegen einen Vertrag über die Lieferung von 600 Zentnern Eisen aus Hohenlohe-Ingelfingens schlesischen Hüttenwerken vorschoss.
goldbeck:
  life: "1733-1818"
  bio: Grand Chancellor of Prussia and minister of justice. He countersigned the grants of 1796 that gave Antoni Prusimski's confiscated estates to Prince Hohenlohe-Ingelfingen. In December 1800, at the Prince's request, he took Michalina Prusimska's suit for the Brzyce estates away from the Government at Poznań, whose judges also sat on the guardianship board that had brought it, and gave it to the Government at Warsaw; he withdrew the order when Poznań reported that it had already given judgment.
  bio_de: Heinrich Julius von Goldbeck, preußischer Großkanzler und Justizminister. Er zeichnete die Urkunden von 1796 gegen, mit denen Hohenlohe-Ingelfingen die Güter verliehen wurden. Im Dezember 1800 entzog er auf Hohenlohe-Ingelfingens Bitte Michalina Prusimskas Klage um die Güter Brzyce der Regierung in Poznań (Posen), deren Richter zugleich im Vormundschaftskollegium saßen, das die Klage betrieb, und gab sie der Regierung in Warschau; er nahm die Verfügung zurück, als Poznań meldete, dass es bereits geurteilt hatte.
goldbeck-kalisz:
  bio: President of the War and Domains Chamber at Kalisz from 1805, who supported the division of Prince Hohenlohe-Ingelfingen's Zagórów and Trąbczyn estates among settlers.
  bio_de: Ein von Goldbeck, der 1805 Präsident der Kriegs- und Domänenkammer in Kalisz wurde und die Aufteilung der Güter an Siedler unterstützte.
kleist-general:
  bio: Prussian general, said in 1810 to be about to succeed Köckritz at the King's side. At Kalisz in 1812 he repeated a charge that Peter Friedrich von Triebenfeld kept the revenues of Prince Hohenlohe-Ingelfingen's estates for himself.
  bio_de: Ein preußischer General Kleist, von dem es 1810 hieß, er werde Köckritz an der Seite des Königs nachfolgen. 1812 wiederholte er in Kalisz den Vorwurf, Triebenfeld behalte die Einkünfte der Güter für sich.
kleist-oberforstmeister:
  bio: Chief forester, for whom Peter Friedrich von Triebenfeld brought a letter in June 1813; he was away, and it was left with his wounded son.
  bio_de: Ein Oberforstmeister von Kleist, für den Triebenfeld im Juni 1813 einen Brief überbrachte; er war verreist, und der Brief blieb bei seinem verwundeten Sohn.
meyer-wolff:
  bio: Berlin banker and creditor of Prince Hohenlohe-Ingelfingen, who pressed for 20,000 Reichsthaler in 1802 and was one of the few with money to lend in 1805.
  bio_de: Lipmann Meyer Wolff, Berliner Bankier und Gläubiger Hohenlohe-Ingelfingens, der 1802 auf 20.000 Rthl drängte und 1805 einer der wenigen war, die noch Geld zu verleihen hatten.
meyer-hofrat:
  bio: Court councillor through whom Prince Hohenlohe-Ingelfingen sent instructions to his Berlin lawyer Amelang in 1808, and who in 1805 offered to take over a claim of young Eysenhardt's.
  bio_de: Ein Hofrat, über den Hohenlohe-Ingelfingen 1808 seinem Berliner Rechtsanwalt Amelang Weisungen zukommen ließ und der 1805 anbot, eine Forderung des jungen Eysenhardt zu übernehmen.
meyer-wrabczyn:
  bio: Clerk living at the bailiff's house at Wrąbczyn, a friend of the lessee Floricke. In 1804 and 1805 he worked against Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, frightening off settlers and hiring out the estate's peasants to the townspeople of Zagórów; he later claimed payment for building work.
  bio_de: Ein Schreiber, der in der Vogtei in Wrąbczyn wohnte, ein Freund des Pächters Floricke. 1804 und 1805 arbeitete er gegen Triebenfeld, schreckte Siedler ab und vermietete die Untertanen des Gutes an die Bürger von Zagórów; später verlangte er Bezahlung für Bauarbeiten.
meyer-franz:
  bio: Creditor of Prince Hohenlohe-Ingelfingen, listed among the Prince's debts about 1816.
  bio_de: Ein Gläubiger in der um 1816 aufgestellten Liste der Schulden Hohenlohe-Ingelfingens.
bernstorff:
  life: "1769-1835"
  bio: Count, Prussian minister of foreign affairs from 1818 to 1832. In 1819 the Russian envoy Alopeus sent him a report from Warsaw supporting Michalina Miączyńska's claim against Prussia, and Prussia's refusal was drafted in his name.
  bio_de: Graf Christian Günther von Bernstorff, preußischer Außenminister von 1818 bis 1832. 1819 übersandte ihm der russische Gesandte Alopeus einen Bericht aus Warschau, der die Forderung der Michalina Miączyńska unterstützte, und die Ablehnung wurde in seinem Namen entworfen.
tarczewski:
  bio: Advocate at Warsaw. In November 1819 he reported to a client on a suit against Michalina Miączyńska, the owner of Trąbczyn, that was going to the court of appeal, and asked for the mortgage certificates in the original or in certified copies.
  bio_de: Ein Advokat in Warschau, der mit „M. Tarczewski“ unterschreibt. Im November 1819 berichtete er einem Mandanten über einen Prozess gegen Michalina Miączyńska, der vor das Appellationsgericht ging, und bat um die Hypothekenscheine im Original oder in beglaubigter Abschrift.
wybicki:
  life: "1747-1822"
  bio: Senator and voivode in the Duchy of Warsaw and the Kingdom of Poland. Prussia had confiscated his estate of Manieczki and given it to General von Zastrow; it was returned to him in 1807, and in 1818 the commission at Warsaw cited his case beside Michalina Miączyńska's.
  bio_de: Józef Wybicki, Senator und Woiwode im Herzogtum Warschau und im Königreich Polen. Preußen hatte sein Gut Manieczki konfisziert und dem General von Zastrow geschenkt; 1807 erhielt er es zurück, und der Warschauer Bericht von 1818 führt seinen Fall neben dem der Michalina Miączyńska an.
niemojewski:
  bio: General, who in 1807 recovered free of debt an estate that Prussia had confiscated and given away. In 1818 the commission at Warsaw cited his case in support of Michalina Miączyńska's claim that Trąbczyn had come back to her free of the debts charged on it.
  bio_de: General Niemojewski, der 1807 ein von Preußen konfisziertes und verschenktes Gut schuldenfrei zurückerhielt. Der Warschauer Bericht von 1818 führt seinen Fall zugunsten der Michalina Miączyńska an.
wichrowski:
  bio: Landowner who in 1807 recovered his estate, written Beskyn, free of debt. In 1818 the commission at Warsaw cited his case in support of Michalina Miączyńska's claim that Trąbczyn had come back to her free of the debts charged on it.
  bio_de: Wichrowski, der 1807 sein Gut, im Bericht Beskyn genannt, schuldenfrei zurückerhielt. Der Warschauer Bericht von 1818 führt seinen Fall zugunsten der Michalina Miączyńska an.
rembowski:
  bio: President of the civil tribunal of first instance at Kalisz, who signed the judgment of 30 July 1827 striking out the mortgages of the Lichnowski brothers and of Grotowski's widow on Trąbczyn, at Michalina Miączyńska's suit.
  bio_de: Antoni Rembowski, Präsident des Ziviltribunals erster Instanz in Kalisz (Kalisch). Er unterzeichnete das Urteil vom 30. Juli 1827, das die Hypotheken der Brüder Lichnowski und der Witwe Grotowski auf Trąbczyn löschen ließ.
mohrenheim:
  life: "1785-1832"
  bio: Baron, general secretary and director of the diplomatic office of Grand Duke Constantine at Warsaw. In 1828 and 1830 he answered the Prussian consul general Schmidt on the claim of the banker Weigel, whose mortgage on Trąbczyn the Polish courts had struck out, and once told Schmidt privately that the council had agreed that Weigel must be paid.
  bio_de: Baron Paul von Mohrenheim, Generalsekretär und Leiter der diplomatischen Kanzlei des Großfürsten Konstantin in Warschau. 1828 und 1830 antwortete er dem preußischen Generalkonsul Schmidt wegen der Forderung des Bankiers Weigel, dessen Hypothek auf Trąbczyn die polnischen Gerichte gelöscht hatten. Eines seiner beiden privaten Billetts an Schmidt berichtet, der Rat habe anerkannt, dass Weigel bezahlt werden müsse.
schmidt-konsul:
  bio: Prussian consul general in the Kingdom of Poland at Warsaw from 1817 to 1832, with the rank of privy councillor of legation. From 1828 to 1832 he pressed the Warsaw authorities to compensate the banker Weigel for the mortgage on Trąbczyn that the Polish courts had struck out, and Mohrenheim, Fuhrmann and Engel answered him.
  bio_de: Julius Schmidt, von 1817 bis 1832 preußischer Generalkonsul im Königreich Polen in Warschau, Geheimer Legationsrat. Von 1828 bis 1832 drängte er die Warschauer Behörden, den Bankier Weigel zu entschädigen; die Antworten Mohrenheims, Fuhrmanns und Engels sind an ihn gerichtet.
lubecki:
  life: "1778-1846"
  bio: 'Prince, minister of finance of the Kingdom of Poland from 1821 to 1830. In September and November 1830 he answered the banker Weigel himself: he found Weigel''s demand of 63,100 thalers for his lost mortgage on Trąbczyn excessive and had the estate valued afresh, because the court valuation Weigel relied on dated from 1803, when land was dear.'
  bio_de: Fürst Franciszek Ksawery Drucki-Lubecki, von 1821 bis 1830 Finanzminister des Königreichs Polen. Im September und November 1830 antwortete er dem Bankier Weigel selbst. Er hielt die Forderung von 63.100 Talern für überhöht und ließ die Güter von Trąbczyn schätzen, weil die gerichtliche Taxe, auf die Weigel sich stützte, 1803 aufgenommen worden war, als Land teuer war.
engel:
  bio: President of the Provisional Government that Russia set over the Kingdom of Poland after the rising of 1830 and 1831. On 13 March 1832 he told the Prussian consul general Schmidt that Józef Lubowidzki was to settle the banker Weigel's claim over Trąbczyn.
  bio_de: Fjodor Engel, Präsident der Provisorischen Regierung, die Russland nach dem Aufstand von 1830 und 1831 im Königreich Polen einsetzte. Am 13. März 1832 teilte er dem preußischen Generalkonsul Schmidt mit, dass Józef Lubowidzki die Forderung des Bankiers Weigel regeln solle.
lubowidzki:
  bio: Councillor of state and president of the Bank of Poland. In March 1832 he was charged with carrying out the convention between Russia and Prussia of 29 May 1830 and with settling the banker Weigel's claim over Trąbczyn.
  bio_de: Józef Lubowidzki, Staatsrat und Präsident der Bank von Polen. Im März 1832 wurde er beauftragt, die Konvention zwischen Russland und Preußen vom 29. Mai 1830 auszuführen und die Forderung des Bankiers Weigel zu regeln.
drake:
  bio: Commissioner in the department of state domains at Warsaw. On 29 February 1832 the finance commission charged him with valuing the Trąbczyn estates, so that the banker Weigel's loss could be reckoned.
  bio_de: Ein Kommissar in der Abteilung der Staatsdomänen in Warschau. Am 29. Februar 1832 beauftragte ihn die Finanzkommission, die Güter von Trąbczyn zu schätzen, damit der Verlust des Bankiers Weigel berechnet werden konnte.
eisenhardt:
  bio: Partner of the banker Weigel at Wrocław; the Warsaw authorities called Weigel's claim over Trąbczyn the affair of "Weigel & Eisenhardt".
  bio_de: Der Teilhaber des Bankiers Weigel in Wrocław (Breslau). Baron Mohrenheim nennt die von den polnischen Gerichten gelöschte Forderung die Sache „Weigel & Eisenhardt“.
malachowski:
  life: "1736-1809"
  bio: President of the Governing Commission, the provisional Polish government that Napoleon set up in January 1807. Its resolution of 21 July 1807, which returned the confiscated Prusimski estates to Michalina Dąbska, was issued under his name, and her petition to the Emperor was addressed to him.
  bio_de: Stanisław Małachowski, Präsident der Regierungskommission, der provisorischen polnischen Regierung, die Napoleon im Januar 1807 einsetzte. Der Beschluss der Kommission vom 21. Juli 1807, der die konfiszierten Güter der Prusimski an Michalina Dąbska zurückgab, erging unter seinem Namen, und ihre Bittschrift an den Kaiser war an ihn adressiert.
luszczewski:
  life: "1764-1812"
  bio: Secretary general of the Governing Commission in 1807 and afterwards minister of the interior of the Duchy of Warsaw. He countersigned the commission's order of 12 July and its resolution of 21 July 1807 returning the Prusimski estates to Michalina Dąbska.
  bio_de: Jan Paweł Łuszczewski, 1807 Generalsekretär der Regierungskommission und danach Innenminister des Herzogtums Warschau. Sein Name steht mit dem des Präsidenten unter der Anordnung der Kommission vom 12. Juli und dem Beschluss vom 21. Juli 1807.
bischoffwerder:
  bio: Prussian general whom Michalina Dąbska named in July 1807, beside Prince Hohenlohe-Ingelfingen and Sanitz, among those given her father's confiscated estates; no other source counts him among them. Probably Johann Rudolf von Bischoffwerder, the favourite of King Friedrich Wilhelm II.
  bio_de: Ein preußischer General, den Michalina Dąbska im Juli 1807 neben Hohenlohe-Ingelfingen und Sanitz unter denen nannte, die die konfiszierten Güter ihres Vaters erhalten hatten. Wahrscheinlich Johann Rudolf von Bischoffwerder, der Günstling König Friedrich Wilhelms II. Kein anderes Dokument nennt ihn unter den Beschenkten.
zurkowski:
  bio: Parish priest of Trąbczyn at the archbishop's visitation of 1790 and 1791. Born in the diocese of Poznań in 1740 and ordained priest in 1767, he was instituted to Trąbczyn in 1785 on the presentation of Antoni Prusimski, the estate's owner and the church's patron.
  bio_de: Pfarrer von Trąbczyn bei der Visitation von 1790 und 1791. 1740 in der Diözese Posen geboren und 1767 zum Priester geweiht, wurde er 1785 auf die Präsentation Antoni Prusimskis, des Erbherrn und Patrons des Gutes, in Trąbczyn eingesetzt.
czartoryski-teodor:
  bio: Bishop of Poznań, Count of Klewań and Żuków, who in December 1766 gave Józef Zurkowski, later parish priest of Trąbczyn, letters dimissory for his ordination.
  bio_de: Teodor Czartoryski, Bischof von Posen, in der Visitation von 1791 „Graf auf Klewań und Żuków“; sie berichtet, dass er dem späteren Pfarrer von Trąbczyn, Józef Zurkowski, im Dezember 1766 das Entlassschreiben für seine Weihe gab.
kozierowski:
  bio: Bishop, who ordained Józef Zurkowski, later parish priest of Trąbczyn, in February 1767; his title reads "Adratyński", with a word before the surname uncertain.
  bio_de: Der Bischof, der Józef Zurkowski, den späteren Pfarrer von Trąbczyn, im Februar 1767 weihte, in der Visitation von 1791 Ignacy Augustyn Kozierowski, Bischof „Adratyński“ genannt; ein Wort vor dem Familiennamen ist unsicher gelesen.
paprocki:
  bio: Former parish priest of Trąbczyn, who died before 1791 in debt; books of the parish were then handed to his creditors, by a trick and because no one knew to whom they belonged.
  bio_de: Ein verstorbener Pfarrer von Trąbczyn. Die Visitation von 1791 hält fest, dass Bücher der Pfarrei durch einen Betrug, und weil man nicht wusste, wem sie gehörten, seinen Gläubigern gegeben wurden.
dorposki:
  bio: Priest who visited the parish of Trąbczyn before 1791 and found books there that were gone by 1791.
  bio_de: Ein Geistlicher, bei dessen Visitation von Trąbczyn vor 1791 Bücher der Pfarrei vorhanden waren, die 1791 fehlten.
wardencki:
  bio: Benefactor of the church of Trąbczyn, who in 1668 secured 350 złoty for it on part of Kurów, the interest to pay for Masses.
  bio_de: Ein Wohltäter der Kirche von Trąbczyn, der ihr 1668 350 polnische Gulden auf einem Teil von Kurów sicherte, wie die Visitation von 1791 festhält.
strzalkowski:
  bio: Benefactor of the church of Trąbczyn, who in 1670 secured 500 złoty for it on Strzałkowo, the interest to pay for Masses.
  bio_de: Ein Wohltäter der Kirche von Trąbczyn, der ihr 1670 500 polnische Gulden auf Strzałkowo sicherte, wie die Visitation von 1791 festhält.
boguslawski:
  bio: Benefactor of the church of Trąbczyn, who placed 250 złoty for Masses there.
  bio_de: Ein Wohltäter der Kirche von Trąbczyn, durch den 250 Gulden für Messen angelegt wurden, wie die Visitation von 1791 festhält.
golinska:
  bio: Benefactress of the church of Trąbczyn, who charged 2,000 złoty on the estate of Przespolew for 104 Masses a year. Two other women of the name appear in the Prusimski family's lawsuits; she is not shown to be either.
  bio_de: Eine Wohltäterin der Kirche von Trąbczyn, die 2.000 Gulden auf dem Gut Przespolew für jährlich 104 Messen verschrieb, wie die Visitation von 1791 festhält. Zwei andere Frauen dieses Namens sind aus den Gerichtsbüchern der Prusimski-Zeit bekannt; sie ist mit keiner von ihnen gleichgesetzt.
glowiecki:
  bio: Cistercian abbot of Ląd on the Warta, invited to sing the High Mass at Paweł Prusimski's funeral at Trąbczyn in December 1754; a sudden frost kept him from crossing the river.
  bio_de: Zisterzienserabt von Ląd an der Warthe. Er war eingeladen, beim Begräbnis Paweł Prusimskis in Trąbczyn im Dezember 1754 das Hochamt zu singen, doch ein unerwarteter Frost hinderte ihn, den Fluss zu überqueren.
janko-syn-szymona:
  bio: Count, to whom Duke Bolesław had given Trąbczyn before 1276. He died without children, and the village returned to the duke.
  bio_de: "Graf Janko, Sohn des Szymon, dem Herzog Bolesław Trąbczyn vor 1276 gegeben hatte. Er starb kinderlos, und das Dorf fiel an den Herzog zurück (Kodeks Dyplomatyczny Wielkopolski, 1276)."
mikolaj-pleban-sroda:
  bio: Former parish priest of Środa, to whom Duke Bolesław gave Trąbczyn after Count Janko, son of Szymon; he too died without heirs, before 1276.
  bio_de: "Ein früherer Pfarrer von Środa, dem Herzog Bolesław Trąbczyn nach Janko, dem Sohn des Szymon, gab; auch er starb ohne Erben (Kodeks Dyplomatyczny Wielkopolski, 1276)."
mikolaj-podskarbi-ladzki:
  bio: Count, the duke's treasurer at Ląd, to whom Duke Bolesław gave the village of Trąbczyn by hereditary right, free of the ducal dues, at Dłusk on 27 March 1276.
  bio_de: "Graf Mikołaj, Schatzmeister des Herzogs in Ląd, dem Herzog Bolesław am 27. März 1276 in Dłusk das Dorf Trąbczyn zu Erbrecht gab, frei von den herzoglichen Abgaben."
jan-z-trabczyna-1346:
  bio: Owner of Trąbczyn with his brother Przedpełk. On 13 November 1346 the land judge at Pyzdry rejected their claim to the villages of Stropiszyn and Pępocin and adjudged them to the church of Gniezno.
  bio_de: "Erbe von Trąbczyn mit seinem Bruder Przedpełk. Ihr Anspruch auf Stropiszyn und Pępocin wurde am 13. November 1346 vom Landrichter in Pyzdry abgewiesen und die Dörfer der Kirche von Gnesen zugesprochen."
przedpelk-z-trabczyna:
  bio: Owner of Trąbczyn with his brother Jan. On 13 November 1346 the land judge at Pyzdry rejected their claim to the villages of Stropiszyn and Pępocin.
  bio_de: "Erbe von Trąbczyn mit seinem Bruder Jan; ihr Anspruch auf Stropiszyn und Pępocin wurde am 13. November 1346 in Pyzdry abgewiesen."
andrzej-z-trabczyna-1346:
  bio: Owner of Trąbczyn, who sued with all his kin for the villages of Stropiszyn and Pępocin and was put to perpetual silence by the land judge at Pyzdry on 13 November 1346.
  bio_de: "Erbe von Trąbczyn, der mit seiner ganzen Verwandtschaft um Stropiszyn und Pępocin klagte und dem am 13. November 1346 in Pyzdry ewiges Schweigen auferlegt wurde."
jan-pleban-trabczyna:
  bio: Parish priest of Trąbczyn, against whom the Archbishop of Gniezno adjudged the sheaf tithe of Trąbczyn to the abbey of Ląd on 13 October 1399.
  bio_de: "Pfarrer von Trąbczyn, gegen den der Erzbischof von Gnesen am 13. Oktober 1399 den Garbenzehnten von Trąbczyn dem Kloster Ląd zusprach."
mikolaj-z-trabczyna-1415:
  bio: Nobleman of Trąbczyn, a witness at Gniezno on 16 April 1415; he is found from 1402, and later as deputy standard-bearer of Gniezno from 1434 to 1440.
  bio_de: "Zeuge in Gnesen am 16. April 1415. Die Herausgeber des Kodeks finden ihn seit 1402 und später als Vizebannerträger von Gnesen, 1434 bis 1440."
andrzej-z-trabczyna-1415:
  bio: Nobleman of Trąbczyn, a witness at Gniezno on 16 April 1415 beside Mikołaj of Trąbczyn; he is found from 1414 to 1428.
  bio_de: "Zeuge in Gnesen am 16. April 1415 neben Mikołaj von Trąbczyn; die Herausgeber des Kodeks finden ihn von 1414 bis 1428."
otto-z-trabczyna:
  bio: Owner of Trąbczyn, found until 1426, in whose house there his son Wojciech made his brother Jan his proxy on 15 May 1434. The Trąmpczyński family's by-name Otto goes back to him.
  bio_de: "Erbe von Trąbczyn, in dessen Haus dort sein Sohn Wojciech am 15. Mai 1434 seinen Bruder Jan zum Bevollmächtigten machte. Die Herausgeber des Kodeks finden ihn bis 1426."
mscichna-z-trabczyna:
  bio: Wife of Otto, owner of Trąbczyn; the act of 15 May 1434 between their sons was made in her house there.
  bio_de: "Ehefrau Ottos, des Erben von Trąbczyn; die Urkunde vom 15. Mai 1434 wurde in ihrem Haus dort ausgestellt."
wojciech-z-trabczyna:
  bio: Son of Otto of Trąbczyn and canon of Kruszwica, who at Trąbczyn on 15 May 1434 made his brother Jan his proxy to collect 70 Hungarian florins from Jarand, scholastic of Kruszwica.
  bio_de: "Sohn Ottos von Trąbczyn und Kanoniker von Kruschwitz, der am 15. Mai 1434 in Trąbczyn seinen Bruder Jan bevollmächtigte, 70 ungarische Gulden von Jarand, dem Scholaster von Kruschwitz, einzuziehen."
jan-z-trabczyna-1434:
  bio: Son of Otto of Trąbczyn, made his brother Wojciech's proxy on 15 May 1434; he is hard to tell apart from a namesake at Trąbczyn at the same time.
  bio_de: "Sohn Ottos von Trąbczyn, am 15. Mai 1434 von seinem Bruder Wojciech bevollmächtigt. Die Herausgeber des Kodeks halten ihn für schwer von einem gleichnamigen Zeitgenossen in Trąbczyn zu unterscheiden."
tomasz-ocic:
  bio: Younger son of Otto of Trąbczyn, brother of Wojciech and Jan.
  bio_de: "Der jüngere Sohn Ottos von Trąbczyn, von den Herausgebern des Kodeks neben seinen Brüdern Wojciech und Jan genannt."

faltz:
  bio: President of the Commission of Instruction of the Council of State of the Kingdom of Poland, who signed its report of 28 October 1834 on the conflict of jurisdiction over the banker Weigel's mortgage on Trąbczyn. Not to be confused with Falz, the lawyer of Prince Hohenlohe-Ingelfingen at Kalisz in 1810 and 1811.
  bio_de: "Präsident der Instruktionskommission des Staatsrats des Königreichs Polen, unterzeichnet ihren Bericht über den Kompetenzkonflikt Weigel/Miączyńska vom 28. Oktober 1834, das eine Dokument hier, das ihn nennt. Nicht zu verwechseln mit Falz, dem Anwalt, der 1810/11 die Prozesse des Fürsten vor dem Tribunal in Kalisz führte; dessen Schreibung ist dort selbst ungeklärt."
godlewski:
  bio: Landowner whose dispute with the State over the boundary between his land and a state domain had also led to a conflict of jurisdiction; in 1834 the Commission of Finances cited his case as a precedent in the dispute over the banker Weigel's mortgage on Trąbczyn, and the Commission of Instruction answered that in his case the conflict came before the judgment.
  bio_de: "Ein Herr Godłewski, dessen Grenzstreit zwischen seinem Land und einer Domäne des Staates gleichfalls zu einem Kompetenzkonflikt geführt hatte und den die Finanzkommission 1834 als Präzedenz anführte; die Instruktionskommission entgegnet, daß dort der Konflikt dem Urteil vorausging. Die Abschrift des Archivs schreibt den Namen Godtewski und verliest das polnische durchgestrichene l."
skarbek-gora:
  bio: Son of the castellan of Inowrocław, a witness on 29 March 1784, when the castellany court of Poznań sat on the grounds of Trąbczyn to settle the succession of the brothers Antoni and Paweł Prusimski.
  bio_de: Eugeniusz de Góra Skarbek, Kastellanssohn von Inowrocław, Zeuge bei der Kondeszension vom 29. März 1784 auf dem Grund von Trąbczyn.
zelislawski:
  bio: Burgrave of the castellany of Konin, a witness on 29 March 1784, when the castellany court of Poznań sat on the grounds of Trąbczyn to settle the succession of the brothers Antoni and Paweł Prusimski.
  bio_de: Tomasz Zelisławski, Burggraf der Kastellanei Konin, Zeuge bei der Kondeszension vom 29. März 1784 auf dem Grund von Trąbczyn.
zakrzewski:
  bio: 'Family of heirs in the succession to the childless brothers Antoni and Paweł Prusimski, settled in 1784: Kazimierz, land judge of Brześć Kujawski, and his sons Ignacy, sword-bearer of Przedecz, and Ludwik, who brought the suit.'
  bio_de: Die Familie Zakrzewski, Erben der Linie der Schwestern im Erbstreit der Prusimskis; Kazimierz, Landrichter von Brześć in Kujawy; seine Söhne Ignacy, Schwertträger von Przedecz, und Ludwik, die ersten Akteure des Rechtsstreits.
tomicki:
  bio: Family of heirs of Mariana Tomicka, born Prusimska, the third daughter of Krzysztof Prusimski and Teresa Golińska; the brothers Paweł and Józef were parties to the Prusimski succession settled in 1784.
  bio_de: Die Familie Tomicki, Erben der Mariana de Prusimski Tomicka, der dritten Tochter von Krzysztof Prusimski und Teresa Golińska; Paweł und Józef, leibliche Brüder, traten im Rechtsstreit auf.
taczanowski:
  bio: Family of heirs of the line of Elżbieta Tworowicz; the brothers Rafał, Wincenty and Mikołaj were parties to the Prusimski succession settled in 1784, through Józef Taczanowski, land regent of Wieluń.
  bio_de: Die Familie Taczanowski, Erben der Linie der Elżbieta de Tworowicz; Rafał, Wincenty und Mikołaj, leibliche Brüder, traten im Rechtsstreit durch Józef Taczanowski, Landregent von Wieluń, auf.
kolaczkowski:
  bio: Family of heirs of Wiktoria Prusimska; Piotr Kołaczkowski and his wife Kunegunda, born Kowalska, were parties to the Prusimski succession settled in 1784.
  bio_de: Die Familie Kołaczkowski, Erben der Wiktoria de Prusimski; Piotr Kołaczkowski und seine Frau Kunegunda de Kowalski traten im Rechtsstreit auf.
tworowicz:
  bio: 'Family in the Prusimski succession settled in 1784: Franciszek Tworowicz was a party to it, and Michał Tworowicz was the third husband of Wiktoria Prusimska.'
  bio_de: Die Familie Tworowicz des Erbstreits; Franciszek Tworowicz trat in ihm auf; Michał Tworowicz war der dritte Gemahl der Wiktoria de Prusimski.
lubstowski:
  bio: Abbot of the Cistercian abbey of Ląd, cited before the court that settled the Prusimski succession in 1784 to account for the 3,500 ducats and the silver of the Prusimski family held in the convent's treasury.
  bio_de: Benedykt Lubstowski, Abt der Zisterzienserabtei Ląd, zitiert zur Kondeszension von 1784 wegen der Quittung über 3500 Dukaten und des Silbers des Prusimski-Hauses im Schatz des Konvents.
wybieralski:
  bio: Prior of the Cistercian convent of Ląd, cited with the abbot before the court that settled the Prusimski succession in 1784.
  bio_de: Paweł Wybieralski, Prior des Zisterzienserkonvents Ląd, mit dem Abt zur Kondeszension von 1784 zitiert.
radolinski:
  bio: Family of Radolin, sub-chamberlains of Wschowa, who held a claim of 43,000 złoty on Trąbczyn that the court settling the Prusimski succession in 1784 left undecided; Józef and Stefan Radoliński had bound the brothers Prusimski to it in 1736.
  bio_de: Die Familie Radoliński aus Radolin, Unterkämmerer von Wschowa, Inhaber der Forderung von 43 000 Florin polnisch auf Trąbczyn, die das Dekret von 1784 unentschieden lässt; Józef und Stefan Radoliński verpflichteten die Brüder Prusimski 1736.
bienicki:
  bio: Parish priest of Zagórów, who in 1661 gave the parish church of Zagórów in perpetuity a sum of 2,000 złoty charged on Szetlew.
  bio_de: Andrzej Bienicki, Pfarrer von Zagórów; die 2000 Florin polnisch von Szetlewo wurden durch seine Eintragung von 1661 der Pfarrkirche von Zagórów in perpetuum geschenkt.
golinski:
  bio: 'The family of the mother''s side in the Prusimski succession: Jan Łoso Goliński, burgrave of Konin, his wife Konstancja, born Krusińska, and their daughter Teresa, wife of Krzysztof Prusimski of Trąbczyn.'
  bio_de: Die Familie Goliński, die mütterliche Linie der Prusimski-Erbschaft; Jan Łoso Golinski, Burggraf von Konin, seine Frau Konstancja Krusińska, und ihre Tochter Teresa, Gemahlin von Krzysztof Prusimski.
erdmann:
  bio: Pastor-administrator of the Evangelical-Augsburg parish of Zagórów, which served the German colonists of the Trąbczyn and Zagórów estates, who wrote its annual report for 1882, and that of its filial parish of Lissewo-Pyzdry, to the consistory at Warsaw. His first name is not known.
  bio_de: E. Erdmann, Pastor-Administrator der evangelisch-augsburgischen Gemeinde Zagórów, schrieb deren Jahresbericht für 1882 und den ihres Filials Lissewo-Pyzdry an das Warschauer Konsistorium. Sein Vorname steht nicht in den Dokumenten.
manitius:
  bio: Superintendent pastor at Warsaw, who received the mission collections of the Evangelical parishes of Zagórów and Pyzdry in 1882. Whether he is the Pastor Manitius of Konstantynów is not known.
  bio_de: Superintendent Pastor Manitius in Warschau erhielt 1882 die Missionskollekten der Gemeinden Zagórów und Pyzdry. Ob er der Pastor Manitius von Konstantynów ist, ist nicht geklärt.
boerner:
  bio: Superintendent at Płock, who received the collections of the Evangelical parishes of Zagórów and Pyzdry for the widows' and orphans' fund in 1882. Probably Ignatius Karl Wilhelm Boerner, superintendent of the Płock diocese.
  bio_de: Superintendent von Boerner in Płock erhielt 1882 die Kollekten für die Witwen- und Waisenkasse aus Zagórów und Pyzdry. Kneifel nennt Ignatius Karl Wilhelm Boerner als Superintendenten der Plocker Diözese; die Gleichsetzung wird in den Dokumenten nicht vorgenommen.
jerzy-chelmski:
  bio: Owner of Łukom, the estate next to Trąbczyn, in 1644 and an ancestor of Stanisław Chełmski. He sued the four Otto-Trąmpczyński brothers of Trąbczyn and their mother for cutting boundary marks into the trees of his wood to claim his ground and for felling his timber, and the land court at Konin gave judgment against them by default.
  bio_de: Besitzer von Łukom, dem Nachbargut von Trąbczyn, im Jahr 1644. Er verklagte die vier Brüder Otto-Trąmpczyński von Trąbczyn und ihre Mutter, weil sie Grenzzeichen in die Bäume seines Waldes hatten schneiden lassen und sein Holz fällten; das Landgericht Konin urteilte in ihrer Abwesenheit gegen sie.
franciszek-chelmski:
  bio: Owner of Łukom and Łomowo with his brother Józef. In 1728 the brothers sued Krzysztof Prusimski of Trąbczyn and his son Antoni for burning their shingles and a hut, seizing four oxen and carting off hay from the ground both estates claimed, and the land court at Konin sent a sworn commissioner to decide whose it was.
  bio_de: Erbe von Łukom und Łomowo mit seinem Bruder Józef. 1728 verklagten die Brüder Krzysztof Prusimski von Trąbczyn und dessen Sohn Antoni wegen verbrannter Schindeln, geraubter Ochsen und weggefahrenen Heus vom strittigen Grund; das Landgericht Konin schickte einen vereidigten Kommissar, der über das Eigentum entscheiden sollte.
jozef-chelmski:
  bio: Owner of Łukom and Łomowo with his brother Franciszek, for whom he appeared in person in their suit of 1728 against Krzysztof and Antoni Prusimski of Trąbczyn over the ground between Łukom and Trąbczyn that both estates claimed.
  bio_de: Erbe von Łukom und Łomowo mit seinem Bruder Franciszek, für den er 1728 im Prozess gegen Krzysztof und Antoni Prusimski um den strittigen Grund zwischen Łukom und Trąbczyn persönlich erschien.
heliodor-chelmski:
  bio: Canon, brother of Stanisław Ścibor Chełmski of Łukom, and with him the losing party when a commission appointed by the Polish parliament fixed the boundary between Trąbczyn and Łukom in 1775.
  bio_de: Domherr, Bruder des Stanisław Ścibor Chełmski auf Łukom und mit ihm die Gegenseite, als eine vom polnischen Reichstag eingesetzte Kommission 1775 die Grenze zwischen Trąbczyn und Łukomia festlegte und gegen sie entschied.
jezierski:
  bio: Canon of Włocławek and parish priest at Neustadt, who helped Antoni Prusimski raise the Kuyavian insurrection of 1794 and fled with him. In 1803 the King gave the two leave to return from Dresden, without restoring their property. In 1807 he took over Trąbczyn as the agent of Prusimski's daughter Michalina.
  bio_de: Domherr von Włocławek und Pfarrer in Neustadt, der Antoni Prusimski 1794 half, den kujawischen Aufstand zu entfachen, und mit ihm floh. 1803 erlaubte der König beiden die Rückkehr aus Dresden, ohne ihnen ihr Vermögen zurückzugeben. 1807 übernahm er Trąbczyn als Bevollmächtigter von Prusimskis Tochter Michalina.
mielke:
  bio: Teacher of the German colony school at Łazińsk from 1925, whom the historian Albert Breyer met there in 1936.
  bio_de: Lehrer der deutschen Kolonieschule in Łazińsk seit 1925, den der Historiker Albert Breyer dort 1936 antraf.

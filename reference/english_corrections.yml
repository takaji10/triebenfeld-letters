- {pad: oe1bu9454-066, page: 5, find: "The general contractor Coste would remit the monies immediately. I should think that if you gave instruction for the iron from the Wrocław depot to be delivered here, and had as much brought from there to Wrocław again, then, if we still had 14 days of good weather, the thing could be settled — I expect Coste at any hour; he is to give an instruction to pay, which I will send off at once by express courier — If it is accepted, good — if not, then the instruction comes back — Coste in return for it cheap grain out of Poland\n\n16 Dec. 1809 von Triebenfeld", replace: "The general contractor Coste would remit the monies immediately. I should think that if you gave instruction for the iron from the Wrocław depot to be delivered here, and had as much brought from there to Wrocław again, then, if we still had 14 days of good weather, the thing could be settled — I expect Coste at any hour; he is to give an instruction to pay, which I will send off at once by express courier — If it is accepted, good — if not, then the instruction comes back — Coste in return for it cheap grain out of Poland von Triebenfeld\n\n16 Dec. 1809", why: "v Triebenfeld / 16. Xbr. 1809: the date after the signature"}

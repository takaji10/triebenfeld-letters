- {pad: oe1bu9454-177, page: 7, find: "[text lost] be, and to command the reserve army if it comes to anything. The Duke of Brunswick, however, the whole direction — The reports which I wrote already 8 weeks ago, and which at that time were regarded as very insignificant, are now found confirmed, and only 3 days ago Chlebowski and Köhler wrote the same as important news — the King has [uncertain: been much vexed] over a good many things — I am, as I wrote last time, to go along — but I shall take care of myself — Your Serene Highness can and should go by way of Wieluń to Łęczyca; there you are not far from your estates. In deepest reverence I remain, until death, Your Most Serene Highness's — To Colonel von Schlieben I gave 2,000 Rthl yesterday, since Meierowitz had sent no money, and he must therefore suspend the suit — here too I have further paid 100 Friedrich d'or to the helpers — Everything truly goes well — Minister Hardenberg has thus far been too scarce; I have not yet been able to speak with him. Today he has gone for a couple of days to his estates, and the [uncertain: King is at] Paretz, where he intends to stay until the [uncertain: Fadel] ball of the Ferdinand jubilee wedding, which is on the 27th. Berlin, the 24th of September\n\n1805\n\nmost humble and obedient servant\n\nvon Triebenfeld", replace: "[text lost] be, and to command the reserve army if it comes to anything. The Duke of Brunswick, however, the whole direction — The reports which I wrote already 8 weeks ago, and which at that time were regarded as very insignificant, are now found confirmed, and only 3 days ago Chlebowski and Köhler wrote the same as important news — the King has [uncertain: been much vexed] over a good many things — I am, as I wrote last time, to go along — but I shall take care of myself — Your Serene Highness can and should go by way of Wieluń to Łęczyca; there you are not far from your estates. In deepest reverence I remain, until death, Your Most Serene Highness's — T
- {pad: oe1bu9454-291, page: 2, find: "Concerning your military affair nothing at all has yet been said. The Prince Chancellor ascribes all of that journal to himself, and therefore nothing is to be learned or to be betrayed. The King departs on the night of the 25th to the 26th; he goes still to Berlin and thence directly to Heilbronn. The Prince Chancellor follows him soon; I then hasten to you to attend to the rest. Saved you are and will be. The King of Württemberg is playing a great part; the mediatised are laid in the barrel, unless indeed the times change, for the Crown Prince of Württemberg marries the Princess of Oldenburg. These are strange times. Koppe is appointed in the Hanoverian service; I shall learn from Minister Stein where. Write for Your Serene Highness so as not to [uncertain: mehren] me, for I depart when Hardenberg and Stein depart. But it would be sad if you sent me no money, as I [do] through Adolph [uncertain: Both], for I should not know how I am to get away from here. I remain forever Your Serene Highness's, Vienna, the 24th of May 1815\n\nfaithful and obedient servant\n\nvon Triebenfeld", replace: "Concerning your military affair nothing at all has yet been said. The Prince Chancellor ascribes all of that journal to himself, and therefore nothing is to be learned or to be betrayed. The King departs on the night of the 25th to the 26th; he goes still to Berlin and thence directly to Heilbronn. The Prince Chancellor follows him soon; I then hasten to you to attend to the rest. Saved you are and will be. The King of Württemberg is playing a great part; the mediatised are laid in the barrel, unless indeed the times change, for the Crown Prince of Württemberg marries the Princess of Oldenburg. These are strange times. Koppe is appointed in the Hanoverian service; I shall learn from Minister Stein where. Write for Your Serene Highness so as not to [uncertain: mehren] me, for I depart when Hardenberg and Stein depart. But it would be sad if you sent me no money, as I [do] through Adolph [uncertain: Both], for I should not know how I am to get away from here. I remain forever Your Serene Highness's faithful and obedient servant\n\nvon Triebenfeld\n\nVienna, the 24th of May 1815", why: "v Triebenfeld / Wien den 24ten May 1815: the date after the signature"}

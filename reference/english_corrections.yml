- {pad: oe1bu9454-184, page: 2, find: "while others feast on the fat of the Hohenlohe land. But if fortune is not altogether unkind to me, I shall extricate myself by my own strength, since all faithful and disinterested services seem to have been forgotten. I have too boundless a confidence in you to be able to believe that Your Right Honourable would make any use whatever of this outburst of my heart; but I had to let you feel something of how I am being dealt with. The most faithful veneration remains dedicated to you for ever.\n\nIngelfingen, 15th May 1806. A: Hahn", replace: "while others feast on the fat of the Hohenlohe land. But if fortune is not altogether unkind to me, I shall extricate myself by my own strength, since all faithful and disinterested services seem to have been forgotten. I have too boundless a confidence in you to be able to believe that Your Right Honourable would make any use whatever of this outburst of my heart; but I had to let you feel something of how I am being dealt with. The most faithful veneration remains dedicated to you for ever. A: Hahn\n\nIngelfingen, 15th May 1806.", why: "A: Hahn / Ingelfingen d 15ten Maj 1806.: the date after the signature"}
- {pad: oe1bu9454-186, page: 1, find: "The business with Mr Weigelt is as good as settled — he sent me his consent yesterday evening — and asked me to come in here today, or, in case I should permit it, he would spend the Thursday with me at Świniary — I have accepted the latter and have asked him out to me tomorrow for a [uncertain: Seyen]. I now lack the means [uncertain: manche] to entertain the old gentleman properly and to warm the [uncertain: Herrn]. It is solely for the good of our upright Prince, and therefore I put you, [uncertain: Herzer] friend, under requisition — and beg for a bottle of old [uncertain: Mihn] wine and for a bottle of really good old sweet Hungarian Ausbruch, as also for 6 peaches and 2 bunches of grapes — Everything else I have I have I came in here expressly for this purpose — Should my note not find you today, do be sure to send the wine and the fruit out to me. Ever I remain, Wrocław\n\nthe 29th of Aug.\n\n1810.\n\nYour true friend and servant\n\nvon Triebenfeld", replace: "The business with Mr Weigelt is as good as settled — he sent me his consent yesterday evening — and asked me to come in here today, or, in case I should permit it, he would spend the Thursday with me at Świniary — I have accepted the latter and have asked him out to me tomorrow for a [uncertain: Seyen]. I now lack the means [uncertain: manche] to entertain the old gentleman properly and to warm the [uncertain: Herrn]. It is solely for the good of our upright Prince, and therefore I put you, [uncertain: Herzer] friend, under requisition — and beg for a bottle of old [uncertain: Mihn] wine and for a bottle of really good old sweet Hungarian Ausbruch, as also for 6 peaches and 2 bunches of grapes — Everything else I have I have I came in here expressly for this purpose — Should my note not find you today, do be sure to send the wine and the fruit out to me. Ever I remain, Your true friend and servant\n\nvon Triebenfeld\n\nWrocław, the 29th of Aug. 1810.", why: "v Triebenfeld / Breslau den 29ten Aug. 1810.: the date after the signature"}
- {pad: oe1bu9454-189, page: 3, find: "for, as one hears, everything there is not in the best order. Should Your Right Honourable be pleased to gladden me with a few lines to Koszęcin, I should be very happy. Herlich, whom I have with me, commends himself to your favour. I [uncertain: add] only still the assurance of most perfect veneration, in which I ever remain: Your Right Honourable's, Stara Kuźnia\n\nthe 19th of July 1806.\n\nmost humble and obedient servant\n\nA. Hahn", replace: "for, as one hears, everything there is not in the best order. Should Your Right Honourable be pleased to gladden me with a few lines to Koszęcin, I should be very happy. Herlich, whom I have with me, commends himself to your favour. I [uncertain: add] only still the assurance of most perfect veneration, in which I ever remain: Your Right Honourable's most humble and obedient servant\n\nA. Hahn\n\nStara Kuźnia, the 19th of July 1806.", why: "A. Hahn / Klein Althammer d. 19ten Julii 1806.: the date after the signature"}

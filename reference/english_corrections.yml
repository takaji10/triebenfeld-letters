- {pad: oe1bu9454-213, page: 4, find: "The [uncertain: torments], care and sorrow which I endure here in the meantime are not to be described with any pen; I do not know when I shall first hear, or whither I am to turn — The newer ordinances of Napoleon turn everyone's heads; no one gives a Heller willingly. In the 3 months that I have been here, 2,800 Rthl. have been recovered by execution — the suits already cost 1,450 Rthl., of which the Trąbczyn and Meierowitz ones alone, which I omitted to mention overleaf, have eaten up 750 Rthl.; I have had taxes paid to the amount of 1,500 Rthl. This already makes 2,950 Rthl. Now I am again to send in some 600 Rthl. of advances to Konin and Kalisz — if I do not, all is lost; the sequestor liquidates daily, his new account amounts to 2,236 Rthl. He is the favourite of Prefect Garczynski; I must flatter him as far as possible, so that he only does not [uncertain: hiesigt] and vex us, otherwise all is lost — indeed, they will chase me off from here like the cap from the dovecote. Gladly would I procure for Your Serene Highness but a 40,000 Rthl., so that you might once again have a penny against need; I also strive to be able to show you a wholly fixed revenue, so that it may be reckoned upon with confidence, and to determine the end of the debts, so that your descendants may know what they will one day have from these estates — Here there are new rumours every day, which however are seldom confirmed; so much, however, is known to me, that in Berlin they live as in a madhouse, think only of extortions, and for the rest not a word of what passes in the neighbouring cabinets. Thus Hard[enberg] himself does not know one jot of it, that a fresh arrest has been laid upon all sums conceivable that have been given out of Prussia into Poland, and that the interest and amortisation fund has been fixed at 40 years. Zerboni has made a frightful long nose at them all and now laughs here into his own house; in your negotiations aim only at the welfare of Saxony and Poland. Hard[enberg] demands of me proofs concerning the new attachment and the amortisation [uncertain: Platz]; I send him the same tomorrow — I remain, until death, Your Most Serene Highness's Świątniki, the 27th of January 1811\n\nmost humble\n\nvon Triebenfeld", replace: "The [uncertain: torments], care and sorrow which I endure here in the meantime are not to be described with any pen; I do not know when I shall first hear, or whither I am to turn — The newer ordinances of Napoleon turn everyone's heads; no one gives a Heller willingly. In the 3 months that I have been here, 2,800 Rthl. have been recovered by execution — the suits already cost 1,450 Rthl., of which the Trąbczyn and Meierowitz ones alone, which I omitted to mention overleaf, have eaten up 750 Rthl.; I have had taxes paid to the amount of 1,500 Rthl. This already makes 2,950 Rthl. Now I am again to send in some 600 Rthl. of advances to Konin and Kalisz — if I do not, all is lost; the sequestor liquidates daily, his new account amounts to 2,236 Rthl. He is the favourite of Prefect Garczynski; I must flatter him as far as possible, so that he only does not [uncertain: hiesigt] and vex us, otherwise all is lost — indeed, they will chase me off from here like the cap from the dovecote. Gladly would I procure for Your Serene Highness but a 40,000 Rthl., so that you might once again have a penny against need; I also strive to be able to show you a wholly fixed revenue, so that it may be reckoned upon with confidence, and to determine the end of the debts, so that your descendants may know what they will one day have from these estates — Here there are new rumours every day, which however are seldom confirmed; so much, however, is known to me, that in Berlin they live as in a madhouse, think only of extortions, and for the rest not a word of what passes in the neighbouring cabinets. Thus Hard[enberg] himself does not know one jot of it, that a fresh arrest has been laid upon all sums conceivable that have been given out of Prussia into Poland, and that the interest and amortisation fund has been fixed at 40 years. Zerboni has made a frightful long nose at them all and now laughs here into his own house; in your negotiations aim only at the welfare of Saxony and Poland. Hard[enberg] demands of me proofs concerning the new attachment and the amortisation [uncertain: Platz]; I send him the same tomorrow — I remain, until death, Your Most Serene Highness's most humble\n\nvon Triebenfeld\n\nŚwiątniki, the 27th of January 1811", why: " v Triebenfeld / Swiątniki den 27ten Januar 1811: the date after the signature"}
- {pad: oe1bu9454-220, page: 3, find: "For the rest, Wartensleben [uncertain: knows] not a word as yet of what sort of estates those are which I offered him in the exchange dealing. — He guessed at the Bavarian ones after Prince George. — I [uncertain: begged] him to leave off the game of questions, since he could learn nothing at present until I myself were first informed. At bottom the old greybeard grieves me. His fate is a sad one. In deepest reverence I remain, until death, Your Most Serene Highness's Brzeg\n\nthe 31st of October\n\n1811.\n\nfaithful, humble and obedient servant von Triebenfeld", replace: "For the rest, Wartensleben [uncertain: knows] not a word as yet of what sort of estates those are which I offered him in the exchange dealing. — He guessed at the Bavarian ones after Prince George. — I [uncertain: begged] him to leave off the game of questions, since he could learn nothing at present until I myself were first informed. At bottom the old greybeard grieves me. His fate is a sad one. In deepest reverence I remain, until death, Your Most Serene Highness's faithful, humble and obedient servant von Triebenfeld\n\nBrzeg, the 31st of October 1811.", why: "v Triebenfeld / Brieg den 31ten 8br 1811.: the date after the signature"}

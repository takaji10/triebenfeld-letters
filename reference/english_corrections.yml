- {pad: oe1bu9454-241, page: 2, find: "Nysa the 22nd of June\n\n1813\n\nvon Triebenfeld", replace: "von Triebenfeld\n\nNysa the 22nd of June 1813", why: "v Triebenfeld / Neisse den 22ten Juny 1813: the date after the signature"}
- {pad: oe1bu9454-243, page: 1, find: "260 gulden. I must reckon for the return journey, so that only 540 gulden remain, the carriage must be repaired, the laundry costs much, the good ones also still the 40 gulden up, and there remain at the very most 500 gulden; and if I give no man another Groschen, I should have enough to live on for 10 days. But now the affair is supposed to last at least another 5 weeks here — reckon it up, Your Serene Highness, and you will find my request most reasonable. May it please Your Serene Highness most graciously, but also with the very greatest speed, to let me know whether you can send me the 300 Rthl in Gold here. In case it is not possible, then I shall go from here ten days from today, that is on the 23rd — I lodge here at the Golden Duck in the Schulerstraße No. 8 1/2, and in fact No. 15. [Vienna] the 13th of October 1814.\n\nvon Triebenfeld", replace: "260 gulden. I must reckon for the return journey, so that only 540 gulden remain, the carriage must be repaired, the laundry costs much, the good ones also still the 40 gulden up, and there remain at the very most 500 gulden; and if I give no man another Groschen, I should have enough to live on for 10 days. But now the affair is supposed to last at least another 5 weeks here — reckon it up, Your Serene Highness, and you will find my request most reasonable. May it please Your Serene Highness most graciously, but also with the very greatest speed, to let me know whether you can send me the 300 Rthl in Gold here. In case it is not possible, then I shall go from here ten days from today, that is on the 23rd — I lodge here at the Golden Duck in the Schulerstraße No. 8 1/2, and in fact No. 15. von Triebenfeld\n\n[Vienna] the 13th of October 1814.", why: "v Triebenfeld / [Wien] d 13ten 8br 1814.: the date after the signature"}

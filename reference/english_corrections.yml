- {pad: oe1bu9454-081, page: 2, find: "until the arrival of Your Serene Highness's power of attorney [uncertain: further/wait], and since I expect the same next Tuesday, endeavour without delay thereupon to prove my authority therewith and to obtain reliable information from Mr Schulze. I remain, until death, Your Most Serene Highness's Berlin\n\nthe 13th of October\n\n1798 most humbly, faithfully and most obediently\n\nMichaelis", replace: "until the arrival of Your Serene Highness's power of attorney [uncertain: further/wait], and since I expect the same next Tuesday, endeavour without delay thereupon to prove my authority therewith and to obtain reliable information from Mr Schulze. I remain, until death, Your Most Serene Highness's most humbly, faithfully and most obediently\n\nMichaelis\n\nBerlin, the 13th of October 1798", why: "Michaelis / Berlin den 13. Octobr. 1798: the date after the signature"}
- {pad: oe1bu9454-084, page: 3, find: "Grand Duke has lamented greatly and wept like a child — Siege, it is said, will depart, and only the secretary remain here — It looks strange — yet people believe everything will remain in statu quo. In 5 days I shall have the good fortune to lay myself personally at Your Serene Highness's feet. In deepest reverence I remain, until death, Your Most Serene Highness's. Berlin\n\nthe 20th of October.\n\n1798.\n\nfaithful most humble and obedient servant von Triebenfeld", replace: "Grand Duke has lamented greatly and wept like a child — Siege, it is said, will depart, and only the secretary remain here — It looks strange — yet people believe everything will remain in statu quo. In 5 days I shall have the good fortune to lay myself personally at Your Serene Highness's feet. In deepest reverence I remain, until death, Your Most Serene Highness's faithful most humble and obedient servant von Triebenfeld\n\nBerlin, the 20th of October 1798.", why: "v Triebenfeld / Berlin den 20ten Octobr. 1798.: the date after the signature"}
- {pad: oe1bu9454-091, page: 2, find: "one another. To this assurance I add the protestation of the most unbounded reverence, wherewith I remain lifelong Your Most Serene Highness's Berlin\n\nthe 17th of December\n\n1798.\n\nmost humble and obedient servant Beyme", replace: "one another. To this assurance I add the protestation of the most unbounded reverence, wherewith I remain lifelong Your Most Serene Highness's most humble and obedient servant Beyme\n\nBerlin, the 17th of December 1798.", why: "Beyme / Berlin den 17ten Xbr. 1798.: the date after the signature"}
- {pad: oe1bu9454-092, page: 1, find: "Most Serene Prince, Most gracious Prince and Lord, The information which Your Most Serene Highness requested of me on the last post-day I have now obtained, in that the building councillor Glenck delivered to me on [uncertain: Monday] the receipts of the Gleisſenbergen and of Schneider, whereby I feel myself fully placed in a position to answer the General Auditoriat upon its dispositions communicated to Your Most Serene Highness. I do not doubt that the councillor of war von Triebenfeld will this day give Your Most Serene Highness news of the present situation of the Kroctoczyner tausp. matter, and in deepest reverence I remain, until death, Your Most Serene Highness's Berlin\n\nthe 18th of December\n\n1798.\n\nmost humbly, faithfully and obedi-\n\nently\n\nMichaelis", replace: "Most Serene Prince, Most gracious Prince and Lord, The information which Your Most Serene Highness requested of me on the last post-day I have now obtained, in that the building councillor Glenck delivered to me on [uncertain: Monday] the receipts of the Gleisſenbergen and of Schneider, whereby I feel myself fully placed in a position to answer the General Auditoriat upon its dispositions communicated to Your Most Serene Highness. I do not doubt that the councillor of war von Triebenfeld will this day give Your Most Serene Highness news of the present situation of the Kroctoczyner tausp. matter, and in deepest reverence I remain, until death, Your Most Serene Highness's most humbly, faithfully and obedi-\n\nently\n\nMichaelis\n\nBerlin, the 18th of December 1798.", why: "Michaelis / Berlin die 18ten Decbr. 1798.: the date after the signature"}
- {pad: oe1bu9454-094, page: 2, find: "department, I shall nonetheless be no less glad to see it brought to Your Most Serene Highness's complete satisfaction, inasmuch as the heartfelt veneration I bear for Your Serene Highness assuredly makes me take the warmest part therein. Nothing in the world could only hereafter make happier than to be able to lay before Your Most Serene Highness the proofs of that true reverence with which I remain, until death, Your Most Serene Highness's Berlin,\n\nthe 18th of December\n\n1798.\n\nentirely most humble, faithful\n\nand most obedient\n\nZastrow", replace: "department, I shall nonetheless be no less glad to see it brought to Your Most Serene Highness's complete satisfaction, inasmuch as the heartfelt veneration I bear for Your Serene Highness assuredly makes me take the warmest part therein. Nothing in the world could only hereafter make happier than to be able to lay before Your Most Serene Highness the proofs of that true reverence with which I remain, until death, Your Most Serene Highness's entirely most humble, faithful\n\nand most obedient\n\nZastrow\n\nBerlin, the 18th of December 1798.", why: "Zastrow / Berlin den 18ten Decembre 1798.: the date after the signature"}
- {pad: oe1bu9454-099, page: 3, find: "when they write to the sovereign — the draft which the councillor of war von Cöln made concerning Krotoszyn, and which the King gave to the Cabinet Councillor Beyme of them all, has been handed over by the latter to Mr von Voss — who, however, has written to the King too impertinently and moved for the dismissal of this man — Colonel von Köckritz is greatly incensed at this and holds [uncertain: um 13] to be false — He has at once so turned the matter that [uncertain: Löte], as the most honest man, is to be transferred to Wrocław — this has now turned out better than anyone could [...] it. For Carl Theodor Fischbach at Pszczew may Your Serene Highness be pleased to have the patent as commission councillor made out. In deepest reverence I remain, until death, Your Most Serene Highness's. Broniewski will surely not be permitted to receive a heller, for now [uncertain: Mier] are witness that the fellow has already taken more out of the estates than is his due — I shall now pursue the matter with zeal — also well if one can save a sum here. Wrocław, the 1st of February 1799.\n\nmost faithful and most humble servant\n\nvon Triebenfeld", replace: "when they write to the sovereign — the draft which the councillor of war von Cöln made concerning Krotoszyn, and which the King gave to the Cabinet Councillor Beyme of them all, has been handed over by the latter to Mr von Voss — who, however, has written to the King too impertinently and moved for the dismissal of this man — Colonel von Köckritz is greatly incensed at this and holds [uncertain: um 13] to be false — He has at once so turned the matter that [uncertain: Löte], as the most honest man, is to be transferred to Wrocław — this has now turned out better than anyone could [...] it. For Carl Theodor Fischbach at Pszczew may Your Serene Highness be pleased to have the patent as commission councillor made out. In deepest reverence I remain, until death, Your Most Serene Highness's. Broniewski will surely not be permitted to receive a heller, for now [uncertain: Mier] are witness that the fellow has already taken more out of the estates than is his due — I shall now pursue the matter with zeal — also well if one can save a sum here. most faithful and most humble servant\n\nvon Triebenfeld\n\nWrocław, the 1st of February 1799.", why: "v. Triebenfeld / Breslau den 1ten Febr. 1799.: the date after the signature"}
- {pad: oe1bu9454-100, page: 1, find: "Copy. Most Serene Prince! Most gracious Prince and Lord! I do not fail most humbly to inform Your Most Serene Highness that His Majesty, upon the presentation of Your Highness's letter of the 21st of this month, has been pleased to command that the answer thereto shall, as Your Most Serene Highness yourself seemed to expect, remain deferred until the arrival of the report required from the Minister of State v. Voss. I remain with the deepest reverence Your Most Serene Highness's Berlin\n\nthe 25th of January 1799.\n\nmost humble and obedient servant\n\nBeyme", replace: "Copy. Most Serene Prince! Most gracious Prince and Lord! I do not fail most humbly to inform Your Most Serene Highness that His Majesty, upon the presentation of Your Highness's letter of the 21st of this month, has been pleased to command that the answer thereto shall, as Your Most Serene Highness yourself seemed to expect, remain deferred until the arrival of the report required from the Minister of State v. Voss. I remain with the deepest reverence Your Most Serene Highness's most humble and obedient servant\n\nBeyme\n\nBerlin, the 25th of January 1799.", why: "Beyme / Berlin den 25ten Januar 1799.: the date after the signature"}
- {pad: oe1bu9454-105, page: 3, find: "This very moment I receive news from Glenck in the Prusimski lawsuit which is just not good, for I [uncertain: note] that the jurists mean to cheat us. Since I still have in my hands all the blank sheets most graciously entrusted to me, I would straightway give a letter here to the Grand Chancellor and ask for an extension of the deadline — time gained, all gained — In deepest reverence I remain, until death, Your Most Serene Highness's Berlin, the 30th of April 1799.\n\nmost faithful servant\n\nvon Triebenfeld", replace: "This very moment I receive news from Glenck in the Prusimski lawsuit which is just not good, for I [uncertain: note] that the jurists mean to cheat us. Since I still have in my hands all the blank sheets most graciously entrusted to me, I would straightway give a letter here to the Grand Chancellor and ask for an extension of the deadline — time gained, all gained — In deepest reverence I remain, until death, Your Most Serene Highness's most faithful servant\n\nvon Triebenfeld\n\nBerlin, the 30th of April 1799.", why: "v. Triebenfeld / Berlin d. 30ten April 1799.: the date after the signature"}
- {pad: oe1bu9454-106, page: 3, find: "Your Most Serene Highness's — This very moment I receive Your Most Serene Highness's two gracious letters with the enclosures — P's ill will, of which I shall inform Your Serene Highness by another and surer route, shows itself here only too plainly. This very day he receives an extremely civil letter which is said to have been enclosed to [uncertain: Wildeganchen] — meanwhile nothing is to be gained by this hero, unless it be that Your Most Serene Highness should now concur in everything there with the man who recommended him, P — the times are strange now, and in this respect one may speak freely from the heart. Your Serene Highness has, as [uncertain: only] Eysenhardt tells me, had a fall with the horse — for God's sake I beg, most gracious Prince and Lord, do take some care of yourself — Berlin, the 25th of May\n\n1799.\n\nfaithful, most humble and obedient servant\n\nvon Triebenfeld.", replace: "Your Most Serene Highness's — This very moment I receive Your Most Serene Highness's two gracious letters with the enclosures — P's ill will, of which I shall inform Your Serene Highness by another and surer route, shows itself here only too plainly. This very day he receives an extremely civil letter which is said to have been enclosed to [uncertain: Wildeganchen] — meanwhile nothing is to be gained by this hero, unless it be that Your Most Serene Highness should now concur in everything there with the man who recommended him, P — the times are strange now, and in this respect one may speak freely from the heart. Your Serene Highness has, as [uncertain: only] Eysenhardt tells me, had a fall with the horse — for God's sake I beg, most gracious Prince and Lord, do take some care of yourself — faithful, most humble and obedient servant\n\nvon Triebenfeld.\n\nBerlin, the 25th of May 1799.", why: "v. Triebenfeld. / Berlin den 25ten May 1799.: the date after the signature"}
- {pad: oe1bu9454-113, page: 2, find: "that Gad[uncertain] does not lay hold of me for having me arrested here. I would rather have had death on the spot. Wildeganst sends me word that Asch and Gad would wait until Midsummer — but that would be no deliverance for me — I beg Your Serene Highness, by all that is holy, do let the matter be brought to a clear settlement by means of the 4,000 Rthl. If only God helps and I have creditors again, then I will gladly give fortune and salvation. In deepest esteem I remain, until death, Your Most Serene Highness's. Berlin, the 23rd of May\n\n1801\n\nfaithful most humble and obedient servant.\n\nvon Triebenfeld", replace: "that Gad[uncertain] does not lay hold of me for having me arrested here. I would rather have had death on the spot. Wildeganst sends me word that Asch and Gad would wait until Midsummer — but that would be no deliverance for me — I beg Your Serene Highness, by all that is holy, do let the matter be brought to a clear settlement by means of the 4,000 Rthl. If only God helps and I have creditors again, then I will gladly give fortune and salvation. In deepest esteem I remain, until death, Your Most Serene Highness's faithful most humble and obedient servant.\n\nvon Triebenfeld\n\nBerlin, the 23rd of May 1801", why: "v Triebenfeld / Berlin den 23ten May 1801: the date after the signature"}
- {pad: oe1bu9454-130, page: 2, find: "he is content if I lend him my name. I have therefore sent an express courier after Glenck so that he may be here again on Saturday; I go to Berlin today to sound everything out there, and when I return on Saturday I shall settle everything here, go from here to Pszczew, and with Heaven's help finish everything there too, and then hasten to Your Serene Highness, for to live longer in uncertainty would be the torment of hell — I do not know what Glenck is thinking; Midsummer is indeed far too near — The post is about to go; more from Berlin. In deepest reverence I remain, until death, Your Most Serene Highness's\n\nFrankfurt an der Oder, the 17th of May 1804.\n\nfaithful and most obedient [uncertain: servant]\n\nvon Triebenfeld", replace: "he is content if I lend him my name. I have therefore sent an express courier after Glenck so that he may be here again on Saturday; I go to Berlin today to sound everything out there, and when I return on Saturday I shall settle everything here, go from here to Pszczew, and with Heaven's help finish everything there too, and then hasten to Your Serene Highness, for to live longer in uncertainty would be the torment of hell — I do not know what Glenck is thinking; Midsummer is indeed far too near — The post is about to go; more from Berlin. In deepest reverence I remain, until death, Your Most Serene Highness's faithful and most obedient [uncertain: servant]\n\nvon Triebenfeld\n\nFrankfurt an der Oder, the 17th of May 1804.", why: "v Triebenfeld / Fr[ankfurt] a. d. Oder den 17ten May 1804.: the date after the signature"}

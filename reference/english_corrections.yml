# Corrections to the English, page by page: where a fix needs the sentence read
# and so cannot be a rule in english_forms.yml. Applied by
# pipeline/translate/english_forms.py after the house forms, and so by
# publish_translations.py at every publish; a re-publish from the cache keeps
# them. `find` must occur on the page exactly once, or the correction is
# reported and not applied: a page that has changed is read again.
#
#   pad, page   the document and manuscript page
#   find        the exact words on the page
#   replace     what they become
#   why         the reading that decided it


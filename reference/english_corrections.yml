- {pad: oe1bu9454-209, page: 1, find: "209 Most Serene Prince, most gracious Prince and Lord. The order to pay has come in; I shall draw the money and depart at once. From Zagórów I shall report everything to Your Serene Highness immediately by a mounted messenger, who is to bring Mr von Knobelsdorff there. The post is about to go out, I must close. In deepest reverence remaining Your Most Serene Highness's Wrocław\n\n16th October\n\n1810.\n\nmost humble and obedient servant von Triebenfeld", replace: "209 Most Serene Prince, most gracious Prince and Lord. The order to pay has come in; I shall draw the money and depart at once. From Zagórów I shall report everything to Your Serene Highness immediately by a mounted messenger, who is to bring Mr von Knobelsdorff there. The post is about to go out, I must close. In deepest reverence remaining Your Most Serene Highness's most humble and obedient servant von Triebenfeld\n\nWrocław, 16th October 1810.", why: "v Triebenfeld / Breslau 16ten 8br. 1810.: the date after the signature"}

- {pad: oe1bu9454-242, page: 2, find: "P.S. This moment I learn that all princes who cannot furnish 12,000 men are to be mediatised for ever; then one will also have [text lost] olden[text lost] it, unless it be that it is to [uncertain: nachtsrhalt] Vienna, the 12th of October 1814\n\nmost faithful and humble and obedient servant\n\nvon Triebenfeld", replace: "most faithful and humble and obedient servant\n\nvon Triebenfeld\n\nVienna, the 12th of October 1814\n\nP.S. This moment I learn that all princes who cannot furnish 12,000 men are to be mediatised for ever; then one will also have [text lost] olden[text lost] it, unless it be that it is to [uncertain: nachtsrhalt]", why: "v Triebenfeld / Wien den 12ten 8br 1814 / N.S. den Augenblick erfahre ich, daß alle¬ r fürsten welche nicht 12000 Mann stellen können für immer mediatisirt werden sollen, da werde mann auch [...] olden[...] haben es sey den daß es zu nachtsrhalt[?]: the date and the postscript after the signature"}
- {pad: oe1bu9454-244, page: 3, find: "one [uncertain: may] reckon with confidence upon the Brzeg High Provincial Court, particularly in the matter of the settlement of 1811 which is to be set aside, and would it not be advisable, in due time, to send someone thither who might guide and pursue the matter quietly? I shall, as soon as I am instructed what should first be done, most necessarily give Your Serene Highness notice of every outcome, so that action may be taken there also. In deepest reverence I remain, until death,\n\nYour Most Serene Highness's — The Sovereign Prince of Holland is assuming the title of King — Vienna, the 18th of October\n\n1814.\n\nfaithful and most humble and obedient servant\n\nvon Triebenfeld", replace: "one [uncertain: may] reckon with confidence upon the Brzeg High Provincial Court, particularly in the matter of the settlement of 1811 which is to be set aside, and would it not be advisable, in due time, to send someone thither who might guide and pursue the matter quietly? I shall, as soon as I am instructed what should first be done, most necessarily give Your Serene Highness notice of every outcome, so that action may be taken there also. In deepest reverence I remain, until death, Your Most Serene Highness's faithful and most humble and obedient servant von Triebenfeld\n\nVienna, the 18th of October 1814.\n\nThe Sovereign Prince of Holland is assuming the title of King —", why: "v Triebenfeld / Wien den 18ten Octobr 1814. / Der Souveraine Prinz von Holland nimt der Königs Titell an —: the date and the postscript after the signature"}
- {pad: oe1bu9454-258, page: 1, find: "to send this back again at once\n\n[text lost] no copy, and the post is just going.\n\nVienna, the 7th of December 1814\n\nmost humble and obedient servant\n\nvon Triebenfeld", replace: "most humble and obedient servant\n\nvon Triebenfeld\n\nVienna, the 7th of December 1814\n\nto send this back again at once\n\n[text lost] no copy, and the post is just going.", why: "v Triebenfeld / Wien den 7ten Decbr. 1814 / dies gleich mit zurück zu senden [...] keine Abschrift und die Post geht eben.: the date and the postscript after the signature"}
- {pad: oe1bu9454-259, page: 2, find: "the end of the Congress is not yet\n\nto be foreseen, and is perhaps still far off\n\nVienna, 8 December 1814.\n\nfaithful and obedient servant\n\nvon Triebenfeld", replace: "faithful and obedient servant\n\nvon Triebenfeld\n\nVienna, 8 December 1814.\n\nthe end of the Congress is not yet\n\nto be foreseen, and is perhaps still far off", why: "v Triebenfeld / Wien d. 8tn. Xbr 1814. / des Kongreßes Ende ist noch nicht abzusehen und vieleicht noch weit entfernte: the date and the postscript after the signature"}
- {pad: oe1bu9454-266, page: 2, find: "My poor children, do not\n\nforget them either —\n\nJ. Mother: they say she is to be removed.\n\nVienna, the 10th of January\n\n1815.\n\nmost faithful and humble and obedient servant\n\nvon Triebenfeld", replace: "most faithful and humble and obedient servant\n\nvon Triebenfeld\n\nVienna, the 10th of January 1815.\n\nMy poor children, do not\n\nforget them either —\n\nJ. Mother: they say she is to be removed.", why: "v Triebenfeld / Wien d 10ten Januar 1815. / Meine Arme Kinder vergeßen Sie auch ja nicht — J. Mutter: heißt es wird abgesetzt.: the date and the postscript after the signature"}
- {pad: oe1bu9454-275, page: 1, find: "send Your Serene Highness at least some money in advance, for otherwise everything lies untouched — wholly most obedient servant\n\nVienna, the 28th of February\n\n1815\n\nvon Triebenfeld", replace: "wholly most obedient servant\n\nvon Triebenfeld\n\nVienna, the 28th of February 1815\n\nsend Your Serene Highness at least some money in advance, for otherwise everything lies untouched —", why: "v Triebenfeld / Wien d. 28ten Febr. 1815 / senden Ewr Durchlaucht wann auch nur etwas Geld voraus den sonsten bleibt alles liegen —: the date and the postscript after the signature"}
- {pad: oe1bu9454-279, page: 2, find: "I lie sick today at Eichen.\n\nVienna, the 18th of March\n\n1815\n\nmost humble and obedient servant\n\nvon Triebenfeld", replace: "most humble and obedient servant\n\nvon Triebenfeld\n\nVienna, the 18th of March 1815\n\nI lie sick today at Eichen.", why: "v Triebenfeld / Wien den 18ten März 1815 / Ich liege heute in Eichen Krank.: the date and the postscript after the signature"}
- {pad: oe1bu9454-280, page: 3, find: "Your Serene Highness's. If it be possible, let Your Serene Highness send Eberhard here in haste. Vienna, the 21st of March 1815. Most faithful and obedient servant, von Triebenfeld", replace: "Your Serene Highness's Most faithful and obedient servant, von Triebenfeld\n\nVienna, the 21st of March 1815.\n\nIf it be possible, let Your Serene Highness send Eberhard here in haste.", why: "Diener v Triebenfeld / Wien den 21ten Merz 1815 / Ist es möglich so schicke Ewr durchl. eilig den Eberhard: the date and the postscript after the signature"}
- {pad: oe1bu9454-282, page: 2, find: "Glenck I have found today; he commends himself to your favour, and will at once [uncertain: schasten] Your Serene Highness 200,000 Rthl. in cash in [uncertain: scheer] money at Op[text lost]urg —\n\nVienna, the 26th of March\n\n1815.\n\nmost faithful servant\n\nvon Triebenfeld", replace: "most faithful servant\n\nvon Triebenfeld\n\nVienna, the 26th of March 1815.\n\nGlenck I have found today; he commends himself to your favour, and will at once [uncertain: schasten] Your Serene Highness 200,000 Rthl. in cash in [uncertain: scheer] money at Op[text lost]urg —", why: "v Triebenfeld / Wien den 26ten März 1815. / Glenck habe ich heute aufgefunden, er empfehle sich zu Gnaden, und will Ewr durchlaucht im Op[...]urg gleich 200000 rt baar in sche[?]er Geld schasten[?] —: the date and the postscript after the signature"}
- {pad: oe1bu9454-284, page: 3, find: "Of German and French blank forms I beg most earnestly — ah, and were it possible to see Eberhard here — for hardly will anyone take the settlement in hand\n\nVienna, the 27th of March\n1815\n\nyour most obedient servant\n\nvon Triebenfeld", replace: "your most obedient servant\n\nvon Triebenfeld\n\nVienna, the 27th of March 1815\n\nOf German and French blank forms I beg most earnestly — ah, and were it possible to see Eberhard here — for hardly will anyone take the settlement in hand", why: "v Triebenfeld / Wien d 27ten März 1815 / von Teutſchen und Französische Blanquets bitte ich sehr — ach und wäre es möglich Eberhard hier zu sehen — den schwerlich will sich Jemand mit den Vergleich befaßen: the date and the postscript after the signature"}
- {pad: oe1bu9454-292, page: 3, find: "Your Serene Highness's\n\nThe King departed last night from the Countess Zichy.\n\nVienna, the 27th of May.\n\n1815\n\nmost faithful and obedient servant\n\nvon Triebenfeld", replace: "Your Serene Highness's\n\nmost faithful and obedient servant\n\nvon Triebenfeld\n\nVienna, the 27th of May. 1815\n\nThe King departed last night from the Countess Zichy.", why: "v Triebenfeld / Wien den 27ten May. 1815 / Der König ist gestern in Der Nacht von der Gräfin Zichy abgereiſt.: the date and the postscript after the signature"}
- {pad: oe1bu9454-299, page: 3, find: "the messenger receives 3 Groschen Courant per mile\n\n1 Rthl I have given him here. May\n\nYour Serene Highness deign to have the remainder paid\n\nout there.\n\nBlizanów\n\nthe 16th of January 1816.\n\nmost humble and obedient servant\n\nvon Triebenfeld", replace: "most humble and obedient servant\n\nvon Triebenfeld\n\nBlizanów, the 16th of January 1816.\n\nthe messenger receives 3 Groschen Courant per mile\n\n1 Rthl I have given him here. May\n\nYour Serene Highness deign to have the remainder paid\n\nout there.", why: "v Triebenfeld / Blizanow d. 16ten Januar 1816. / der Bothen erhält pro Meile 3 gg Cour 1 rt habe ich ihm hier gegeben geruhen. Ewr Durchlaucht dorten den Rest aus zahlen zu laßen.: the date and the postscript after the signature"}
- {pad: oe1bu9454-301, page: 2, find: "to Poznań and Pszczew, in order to set the great work in order there also — In the compensation matter I now hope for the happiest outcome, the more so as I have entirely won over the Chief Prefect v Smiedecki in Kalisz, upon whose opinion everything in the end depends — Some game would also have a very good effect here — as likewise in Poznań with Z[erboni]: what was received was almost entirely spoiled in the mild weather. In deepest reverence I remain, until death, Your Most Serene Highness's. To the good [uncertain: Bider] Prince Adolph I commend myself for his favour. Blizanów\n\nthe 31st of January\n\n1816.\n\nmost obedient servant von Triebenfeld", replace: "to Poznań and Pszczew, in order to set the great work in order there also — In the compensation matter I now hope for the happiest outcome, the more so as I have entirely won over the Chief Prefect v Smiedecki in Kalisz, upon whose opinion everything in the end depends — Some game would also have a very good effect here — as likewise in Poznań with Z[erboni]: what was received was almost entirely spoiled in the mild weather. In deepest reverence I remain, until death, Your Most Serene Highness's most obedient servant von Triebenfeld\n\nBlizanów, the 31st of January 1816.\n\nTo the good [uncertain: Bider] Prince Adolph I commend myself for his favour.", why: "v Triebenfeld / Blizanow den 31ten Januar 1816. / Dem guten Bider Prinzen Adolph empfehle ich mich zu Gnaden.: the date and the postscript after the signature"}

- {pad: oe1bu9454-157, page: 2, find: "In deepest reverence I remain, until death, Your Most Serene Highness's — I have just now written to Homuth and assured him that Your Serene Highness will obtain the money from the Invalids' Fund through the help of General von Köckritz; therewith I have asked him to reassure the Countess, and to tell her that I stand surety to her that she would have her money within a short time, and that my letter may serve as a document. Berlin, the 22nd of January\n\n1805.\n\nmost humble and obedient servant\n\nvon Triebenfeld", replace: "In deepest reverence I remain, until death, Your Most Serene Highness's — I have just now written to Homuth and assured him that Your Serene Highness will obtain the money from the Invalids' Fund through the help of General von Köckritz; therewith I have asked him to reassure the Countess, and to tell her that I stand surety to her that she would have her money within a short time, and that my letter may serve as a document. most humble and obedient servant\n\nvon Triebenfeld\n\nBerlin, the 22nd of January 1805.", why: "v Triebenfeld / Berlin den 22 ten Januar 1805.: the date after the signature"}
- {pad: oe1bu9454-161, page: 2, find: "Your Most Serene Highness's                    Berlin, 9 February 1805\n\nmost humble and obedient servant\n\nAmelang", replace: "Your Most Serene Highness's most humble and obedient servant\n\nAmelang\n\nBerlin, 9 February 1805", why: "Amelang / Berlin d. 9. Feb 1805: the date after the signature"}
- {pad: oe1bu9454-163, page: 4, find: "If Your Serene Highness has that much there, then send it to the old fellow soon; I will procure it — on my honour let it be assured — straight back again. The Chamber President here is a spiteful [uncertain: beast] and monstrously hungry — His only society is with the chamber cashier Deter, the latter's wife, and the councillor of war Zerboni — the last is his shadow and steers him as he pleases. These are bad prospects again — if only I could soon send into the fellow's house the wash-basin and the three busts by Kips, which however must be coated so as to look as though they were of bronze, then he would at once become very pliant. Let Your Serene Highness only see to it that I get these pieces here soon. In deepest reverence I remain, until death, Your Most Serene Highness's. Otocki also wishes further to take 20 to 30 Hufen of woodland, arable and meadow in hereditary lease, and to pay as the colonists do — many are applying again for plots, and when I [...] here with it, the same will be quickly disposed of. The bilious fever has seized me again; already I can scarcely drag my legs after me — the vexations are too many and various. Kalisz, the 1st of March\n\n1805, most humble and faithful servant, von Triebenfeld", replace: "If Your Serene Highness has that much there, then send it to the old fellow soon; I will procure it — on my honour let it be assured — straight back again. The Chamber President here is a spiteful [uncertain: beast] and monstrously hungry — His only society is with the chamber cashier Deter, the latter's wife, and the councillor of war Zerboni — the last is his shadow and steers him as he pleases. These are bad prospects again — if only I could soon send into the fellow's house the wash-basin and the three busts by Kips, which however must be coated so as to look as though they were of bronze, then he would at once become very pliant. Let Your Serene Highness only see to it that I get these pieces here soon. In deepest reverence I remain, until death, Your Most Serene Highness's. Otocki also wishes further to take 20 to 30 Hufen of woodland, arable and meadow in hereditary lease, and to pay as the colonists do — many are applying again for plots, and when I [...] here with it, the same will be quickly disposed of. The bilious fever has seized me again; already I can scarcely drag my legs after me — the vexations are too many and various. most humble and faithful servant, von Triebenfeld\n\nKalisz, the 1st of March 1805", why: "v Triebenfeld / Kalisz d 1ten Marz 1805: the date after the signature"}
- {pad: oe1bu9454-164, page: 4, find: "Kalisz, the 4th of March 1805.\n\nmost faithful servant\n\nvon Triebenfeld", replace: "most faithful servant\n\nvon Triebenfeld\n\nKalisz, the 4th of March 1805.", why: "v Triebenfeld / Kalisz d 4ten März 1805.: the date after the signature"}
- {pad: oe1bu9454-167, page: 2, find: "Right Honourable may find yourself in the best of health; I commend myself to your continued favour and have the honour to remain, in most perfect reverence, Your Right Honourable's. Öhringen, the 7th of July 1805.\n\nhumble and obedient servant A: Hahn. The return to Wrocław is fixed without fail for the 25th!", replace: "Right Honourable may find yourself in the best of health; I commend myself to your continued favour and have the honour to remain, in most perfect reverence, Your Right Honourable's humble and obedient servant A: Hahn.\n\nÖhringen, the 7th of July 1805.\n\nThe return to Wrocław is fixed without fail for the 25th!", why: "A: Hahn / Öhringen den 7ten Juli 1805.: the date after the signature"}

- {pad: oe1bu9454-172, page: 3, find: "By this carriage may Your Serene Highness be pleased to have the 6 tables and 30 fruit trees conveyed to the President. I have instructed the man to be sure to say that it all [uncertain: comes] from me — For the rest, may God the All-Good only grant that Amelang does good business, for then all wishes are attained. In deepest reverence I remain, until death, Your Most Serene Highness's Trąbczyn, the 28th of March\n\n1805.\n\nfaithful and most humble and obedient servant von Triebenfeld", replace: "By this carriage may Your Serene Highness be pleased to have the 6 tables and 30 fruit trees conveyed to the President. I have instructed the man to be sure to say that it all [uncertain: comes] from me — For the rest, may God the All-Good only grant that Amelang does good business, for then all wishes are attained. In deepest reverence I remain, until death, Your Most Serene Highness's faithful and most humble and obedient servant von Triebenfeld\n\nTrąbczyn, the 28th of March 1805.", why: "v Triebenfeld / Trąbczyn den 28ten März 1805.: the date after the signature"}

- {pad: oe1bu9454-038, page: 1, find: "As soon as I have been, and I can quickly raise the Weise money, then I shall go to Vienna, and if it can be managed I shall come to Öhringen; but if business does not allow it, I shall return hither and write. Only let Your Serene Highness take care that you obtain 150,000 Rthl, then Courland and all the stuff is paid. But it requires haste, the papers are rising wirdet. Berlin, the 14th of June\n\n1808.\n\nmost faithful servant\n\nvon Triebenfeld", replace: "As soon as I have been, and I can quickly raise the Weise money, then I shall go to Vienna, and if it can be managed I shall come to Öhringen; but if business does not allow it, I shall return hither and write. Only let Your Serene Highness take care that you obtain 150,000 Rthl, then Courland and all the stuff is paid. But it requires haste, the papers are rising wirdet. most faithful servant\n\nvon Triebenfeld\n\nBerlin, the 14th of June 1808.", why: "v Triebenfeld / Berlin den 14ten Juny 1808.: the date after the signature"}

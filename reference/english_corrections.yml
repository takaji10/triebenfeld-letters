- {pad: oe1bu9454-033, page: 3, find: "To speak with Your Serene Highness I too wish most ardently — much would soon become clear to you. If you could really obtain there at least 150/m Rthl only, I would come in haste with the original mortgage and the original mortgage certificates — would cede the mortgage, and the business would be settled quick as lightning without any dispute. But upon a mere chance I cannot travel, for the misfortune that has struck me here has consumed my hitherto [uncertain: peasant] store, and I am blood-poor — from my estates I have nothing — there my poor little worms have scarcely enough to live on, and I remain faithful to my resolve: in this cursed [uncertain: council] to take nothing from the King nor from anybody whatever, nor to beg for it. Be pleased also to write very soon on this account; the answer I will still await. If you can obtain the money there in that manner, then I am there quickly — and cede, as aforesaid, the mortgage of 250/m Rthl. The money will then be assigned here or procured hither; every [illegible] paid must give a receipt at once, and the new credit has a clean, secure and all[illegible] mortgage, and so much must remain over that the [uncertain: legal] costs are paid. — perhaps more too, if you receive more than 150/m Rthl, so that your treasury may also be propped up. Now for weakness I can go no further — but eternally at Your Serene Highness's the old Prince S — is to be as well as [illegible] wished to live the [illegible].\n\nBerlin, the 7th of April 1808.\n\nmost faithful [uncertain: sustenance] [illegible]\n\nand humble and obedient servant\n\nvon Triebenfeld", replace: "To speak with Your Serene Highness I too wish most ardently — much would soon become clear to you. If you could really obtain there at least 150/m Rthl only, I would come in haste with the original mortgage and the original mortgage certificates — would cede the mortgage, and the business would be settled quick as lightning without any dispute. But upon a mere chance I cannot travel, for the misfortune that has struck me here has consumed my hitherto [uncertain: peasant] store, and I am blood-poor — from my estates I have nothing — there my poor little worms have scarcely enough to live on, and I remain faithful to my resolve: in this cursed [uncertain: council] to take nothing from the King nor from anybody whatever, nor to beg for it. Be pleased also to write very soon on this account; the answer I will still await. If you can obtain the money there in that manner, then I am there quickly — and cede, as aforesaid, the mortgage of 250/m Rthl. The money will then be assigned here or procured hither; every [illegible] paid must give a receipt at once, and the new credit has a clean, secure and all[illegible] mortgage, and so much must remain over that the [uncertain: legal] costs are paid. — perhaps more too, if you receive more than 150/m Rthl, so that your treasury may also be propped up. Now for weakness I can go no further — but eternally at Your Serene Highness's most faithful [uncertain: sustenance] [illegible]\n\nand humble and obedient servant\n\nvon Triebenfeld\n\nBerlin, the 7th of April 1808.\n\nthe old Prince S — is to be as well as [illegible] wished to live the [illegible].", why: "v. Triebenfeld / Berlin den 7ten Aprill 1808. / die alte Fürst S — soll so gesund sind als an[?] die enig[?] leben wolte.: the date and the postscript after the signature"}
- {pad: oe1bu9454-035, page: 3, find: "I observe that the term of payment to van der Lahr falls on the 14th of May, and that it is only 22 days net [uncertain: güet] — these I will yet await here; then let it go as God wills. Berlin, the 25th of April\n\n1808\n\nfaithful and most obedient servant\n\nvon Triebenfeld", replace: "faithful and most obedient servant\n\nvon Triebenfeld\n\nBerlin, the 25th of April 1808\n\nI observe that the term of payment to van der Lahr falls on the 14th of May, and that it is only 22 days net [uncertain: güet] — these I will yet await here; then let it go as God wills.", why: "v Triebenfeld / Berlin den 25ten Aprill 1808 / Ich bemerke daß der Zahlungs Termin an von der Laar den 14ten May ansteht, und daß es nur noch netto 22 Tage güet ist — diese will ich hier noch abwarten, da gehe es wie Gott will: the date and the postscript after the signature"}
- {pad: oe1bu9454-037, page: 2, find: "and Laar must have the 5,000 t. Courant, otherwise Minister von Zastrow is in embarrassment, I am under arrest anew, and Your Serene Highness truly has no honour from it. Moneys I can have enough of in Holland, but not a [uncertain: Stürer] upon estates in Poland — Consequently I counsel Your Serene Highness most obediently to take care there alone to have the moneys negotiated. With boundless veneration I am Your Serene Highness's. With my recovery it goes very much at a snail's pace. The constant vexation hinders my restoration. Berlin, the 2nd of May\n\n1808\n\nHumble and obedient servant\n\nvon Triebenfeld", replace: "and Laar must have the 5,000 t. Courant, otherwise Minister von Zastrow is in embarrassment, I am under arrest anew, and Your Serene Highness truly has no honour from it. Moneys I can have enough of in Holland, but not a [uncertain: Stürer] upon estates in Poland — Consequently I counsel Your Serene Highness most obediently to take care there alone to have the moneys negotiated. With boundless veneration I am Your Serene Highness's Humble and obedient servant\n\nvon Triebenfeld\n\nBerlin, the 2nd of May 1808\n\nWith my recovery it goes very much at a snail's pace. The constant vexation hinders my restoration.", why: " v Triebenfeld / Berlin d. 2ten May 1808 / Mit meiner Genesung geht es sehr Schnekenartig Der stete Ärger verhindert meine Herstellung: the date and the postscript after the signature"}
- {pad: oe1bu9454-049, page: 1, find: "Your Most Serene Highness's\n\nIt is said that a Russian corps is to be able to stand on the Polish and Silesian frontier — would to God this were so! Konotop\n\nthe 20th of March\n\n1809.\n\nfaithful, humble and obedient servant\n\nvon Triebenfeld", replace: "Your Most Serene Highness's\n\nfaithful, humble and obedient servant\n\nvon Triebenfeld\n\nKonotop, the 20th of March 1809.\n\nIt is said that a Russian corps is to be able to stand on the Polish and Silesian frontier — would to God this were so!", why: "v Triebenfeld / Kontop den 20ten Marz 1809. / Es heißt daß ein Rußisches Corps an der po[hl]. und Schlesischen Gränze zu stehen können soll — Wolte nur Gott dies!: the date and the postscript after the signature"}
- {pad: oe1bu9454-054, page: 3, find: "Your Most Serene Highness's\n\nThe answer from van der Lahr has remained with Amelang's letter in Konotop; I shall most humbly transmit the same by the first post.\n\nGłogów, the 21st of March 1809.\n\nmost faithful and obedient servant\n\nvon Triebenfeld", replace: "Your Most Serene Highness's\n\nmost faithful and obedient servant\n\nvon Triebenfeld\n\nGłogów, the 21st of March 1809.\n\nThe answer from van der Lahr has remained with Amelang's letter in Konotop; I shall most humbly transmit the same by the first post.", why: "v Triebenfeld / Glogau den 21ten März 1809. / Die Antwort von v. d. Lahr ist mit Amelangs Bruch in Kontop bey geblieben, ich werde selbigen mit erster Post unterthänigst übermachen: the date and the postscript after the signature"}
- {pad: oe1bu9454-058, page: 3, find: "Your Most Serene Highness's — In South Prussia nothing will escape Your Serene Highness, with labour and fortune returning, and here one must now leave you, most gracious Prince, unmolested. Beyme was like to go mad again, but the King pays. Wrocław, the 3rd of June 1809.\n\nmost faithful and obedient servant\n\nvon Triebenfeld", replace: "Your Most Serene Highness's most faithful and obedient servant\n\nvon Triebenfeld\n\nWrocław, the 3rd of June 1809.\n\nIn South Prussia nothing will escape Your Serene Highness, with labour and fortune returning, and here one must now leave you, most gracious Prince, unmolested. Beyme was like to go mad again, but the King pays.", why: "v Triebenfeld / Breslau den 3ten Juny 1809. / In Sudpreußen wird Ewr Durchlaucht von Mühe und Glück widerkehrt, nichts entgehen, und hier muß man Sie Gnädigster Fürst jezt ungekränckt laßen. Beyme wolte wieder Toll werden, aber der König bezahl: the date and the postscript after the signature"}
- {pad: oe1bu9454-065, page: 3, find: "A certain Margraff from Berlin writes\n\ntoday that the Prince Sacken is very weak.\n\nI do not know what there is in it — It is,\n\nthis [illegible] [illegible] honest man —\n\nKonotop\n\nthe 9th of October\n\n1809.\n\nmost faithful and humble and obedient servant\n\nvon Triebenfeld", replace: "most faithful and humble and obedient servant\n\nvon Triebenfeld\n\nKonotop, the 9th of October 1809.\n\nA certain Margraff from Berlin writes\n\ntoday that the Prince Sacken is very weak.\n\nI do not know what there is in it — It is,\n\nthis [illegible] [illegible] honest man —", why: "v Triebenfeld / Kontop d 9tn Octobr 1809. / Ein gewißer Margraff aus Berlin schreibt heute die Fürsten Sacken sey sehr schwach Ich weiß nicht was daran ist — Es ist, dies ho[?]t nie[?] ehrlicher Mann —: the date and the postscript after the signature"}
- {pad: oe1bu9454-071, page: 2, find: "this matter is now of the utmost importance; once it is in the proper and secure track, then I shall come at once to Sławięcice — In deepest reverence I remain, until death, Your Most Serene Highness's The Polish matters will very much still I count especially Konotop\n\nthe 30th of March\n\n1810 most faithful and obedient servant von Triebenfeld", replace: "this matter is now of the utmost importance; once it is in the proper and secure track, then I shall come at once to Sławięcice — In deepest reverence I remain, until death, Your Most Serene Highness's most faithful and obedient servant von Triebenfeld\n\nKonotop, the 30th of March 1810\n\nThe Polish matters will very much still I count especially", why: "v Triebenfeld / Kontop d 30ten Merz 1810 / Die Pohlinische Sachen werden sehr an¬ noch zähle ich besonders: the date and the postscript after the signature"}
- {pad: oe1bu9454-077, page: 3, find: "Mr von Buerensprung has however been made Land Master of Forests, and Wedel remains for the present what he is — But in general one [...] sees several changes ahead. Lindenau has received the title of Excellency. Berlin, the 6th of October 1798\n\nmost humble and faithful servant\n\nvon Triebenfeld", replace: "most humble and faithful servant\n\nvon Triebenfeld\n\nBerlin, the 6th of October 1798\n\nMr von Buerensprung has however been made Land Master of Forests, and Wedel remains for the present what he is — But in general one [...] sees several changes ahead. Lindenau has received the title of Excellency.", why: "v Triebenfeld / Berlin d 6ten Octobr 1798 / H. v Buerensprung ist aber Land Forst Meister geworden, und Wedel bleibt vor Der Hand was er ist — Überhaupt aber sich man manche Veränderungen entgegen. Lindenau hatt den Titul Excz erhalten: the date and the postscript after the signature"}
- {pad: oe1bu9454-090, page: 1, find: "The Monarch is good — only the Mini— o God, the poor country! — But it will grow better. Only now one must take care — or — it is all over. The 7,000 Rthl which the Princess Sacken will by no means [uncertain: through none-wise] put up, I would negotiate in my own name, and pledge all my goods, so that so good a cause should not be seen to slip away — I remain, until death, Your Most Serene Highness's. I give everything, [uncertain: because/if] it be required, and if I have nothing more, the good Your Serene mine bread in Ingelfingen, — O what villains there are here — and in Wrocław. Berlin, the 14th of December 1798.\n\nfaithful and most humble bondsman\n\nvon Triebenfeld", replace: "The Monarch is good — only the Mini— o God, the poor country! — But it will grow better. Only now one must take care — or — it is all over. The 7,000 Rthl which the Princess Sacken will by no means [uncertain: through none-wise] put up, I would negotiate in my own name, and pledge all my goods, so that so good a cause should not be seen to slip away — I remain, until death, Your Most Serene Highness's faithful and most humble bondsman\n\nvon Triebenfeld\n\nBerlin, the 14th of December 1798.\n\nI give everything, [uncertain: because/if] it be required, and if I have nothing more, the good Your Serene mine bread in Ingelfingen, — O what villains there are here — and in Wrocław.", why: "v Triebenfeld / Berlin d. 14ten Xbr 1798. / Ich gebe alles wegen es erfordert sei, und habe ich nichts mehr den guten Ewr Durch mich brod in Ingelfingen, — O was giebt es vor Bösewichter hier — ad in Breslau: the date and the postscript after the signature"}
- {pad: oe1bu9454-095, page: 3, find: "false representations are put forward — the King means well by all; if so much erroneous stuff is laid before him, then the gentleman must in the end act against his own interest. The secularisation business is in a wide field, and seems to me to be a [uncertain: morsel] thrown out by the French, at which one is to snap and [uncertain: glut oneself] — People believe in a peace with the Emperor and the French — These are, however, only ideas. In deepest reverence I remain, until death, Your Most Serene Highness's — Before I come, Your Serene Highness will receive an express courier, and then the same may write at once concerning the leave — Berlin, the 29th of December 1798\n\nfaithful and most humble and obedient servant\n\nvon Triebenfeld", replace: "false representations are put forward — the King means well by all; if so much erroneous stuff is laid before him, then the gentleman must in the end act against his own interest. The secularisation business is in a wide field, and seems to me to be a [uncertain: morsel] thrown out by the French, at which one is to snap and [uncertain: glut oneself] — People believe in a peace with the Emperor and the French — These are, however, only ideas. In deepest reverence I remain, until death, Your Most Serene Highness's faithful and most humble and obedient servant\n\nvon Triebenfeld\n\nBerlin, the 29th of December 1798\n\nBefore I come, Your Serene Highness will receive an express courier, and then the same may write at once concerning the leave —", why: "v Triebenfeld / Berlin den 29ten Xbr 1798 / Ehe ich komme erhalte Ewr Durchlaucht eine Estaffette und den können Höchſt Sie wegen des Urlaubs gleich schreiben —: the date and the postscript after the signature"}
- {pad: oe1bu9454-096, page: 3, find: "Should the petition for leave perhaps\n\nbe written by G, so that it\n\nremains my hand?\n\nBerlin, 1 January 1799\n\nmost humble and faithful servant\n\nvon Triebenfeld", replace: "most humble and faithful servant\n\nvon Triebenfeld\n\nBerlin, 1 January 1799\n\nShould the petition for leave perhaps\n\nbe written by G, so that it\n\nremains my hand?", why: "v Triebenfeld / Berlin d 1ten Januar 1799 / Soll etwa das Urlaubs Gesuch von G geschrieben worden damit es mir Hand bleibt?: the date and the postscript after the signature"}
- {pad: oe1bu9454-104, page: 3, find: "About the 16th of April I go\n\nfrom here to Berlin, where I stay\n\nuntil the end of May. The estates which I sold to Prince George now come out, according to a valuation by the judiciary and the Chamber [uncertain: Räthl], at over 700/m Rthl etc. As was meant, the [illegible] through me to 500/m Rthl — [text lost] I am too good-natured a fool and [illegible] often a one and a [illegible] to children harm\n\nWrocław, the 3rd of April\n\n1799\n\nmost faithful and humble servant\n\nvon Triebenfeld", replace: "most faithful and humble servant\n\nvon Triebenfeld\n\nWrocław, the 3rd of April 1799\n\nAbout the 16th of April I go\n\nfrom here to Berlin, where I stay\n\nuntil the end of May. The estates which I sold to Prince George now come out, according to a valuation by the judiciary and the Chamber [uncertain: Räthl], at over 700/m Rthl etc. As was meant, the [illegible] through me to 500/m Rthl — [text lost] I am too good-natured a fool and [illegible] often a one and a [illegible] to children harm", why: "v. Triebenfeld / Breslau den 3ten April 1799 / Etwann den 16ten April gehn ich von hier nach Berlin wo ich bis Ende May bleibe Die Güter welche ich dem Prinzen George verkauft fallen jezt nach einer Justiz und Kammer Räthl Taxe über 700/m rt aus p.p. Da gemeint der Hlrn durch mich an 500/m rt. — zu Grunde bei ich ein zu gutwilliger Tropf und Thun öfters eine und einen Kindern Schade: the date and the postscript after the signature"}
- {pad: oe1bu9454-110, page: 1, find: "NB. instead of 14,175 — and 1500 —\n\nBerlin, the 7th of February\n\n1801.\n\nfaithful servant\n\nvon Triebenfeld", replace: "faithful servant\n\nvon Triebenfeld\n\nBerlin, the 7th of February 1801.\n\nNB. instead of 14,175 — and 1500 —", why: "v Triebenfeld / Berlin den 7ten Febr. 1801. / NB. statt 14175 — und 1500 —: the date and the postscript after the signature"}
- {pad: oe1bu9454-146, page: 4, find: "Your Most Serene Highness's — In the matter of Radzinski everything is taken care of, but the registry is in devilish disorder; thus I found today the enclosed piece among the [uncertain: Sentachen] papers; this belongs here altogether, one before the town [illegible]uft here. Trąbczyn,\n\nthe 17th of November\n\n1804\n\nmost humble and obedient servant\n\nvon Triebenfeld", replace: "Your Most Serene Highness's most humble and obedient servant\n\nvon Triebenfeld\n\nTrąbczyn, the 17th of November 1804\n\nIn the matter of Radzinski everything is taken care of, but the registry is in devilish disorder; thus I found today the enclosed piece among the [uncertain: Sentachen] papers; this belongs here altogether, one before the town [illegible]uft here.", why: "v Triebenfeld / Trąbczyn den 17ten 9br 1804 / Wegen Radzinski ist alles besorgt, die Regis¬ tratur ist aber in einer teuflischen Unordnung so fand ich heut beigehende Piece unter den Sentachen Papiern, diese gehört ja hier durchaus ein vor der Stadt [?]uft her: the date and the postscript after the signature"}
- {pad: oe1bu9454-159, page: 1, find: "Most gracious Prince and Lord. With the most unspeakable labour the honest Amelang has at last brought matters so far to a conclusion that he has given, from the banker leve, an order to pay upon the Kuh brothers, before the monies from the Invalids' Fund, which in truth consist in Sea-Trading Company obligation in / to the amount of 36,755 Rthl. 7 Groschen has received. I hasten to transmit the same, without the very least delay, most obediently to Your Most Serene Highness. Tomorrow everything will be arranged, and the Hanus matter as well as the Eysenhardt one put in order, and when I have finished with that I shall hasten back in to go to Kalisz and to see to the rest for the obtaining of the 100,000 Rthl. In deepest reverence I remain, until death, Your Most Serene Highness's — may Your Serene Highness be pleased to have the letter to the Messrs Kuh delivered at once — faithful and most obedient serv[ant]. How true is presumably, in a position to hinder the dismemberment? I offer defiance to any man. Berlin, the 31st of January 1805.\n\nvon Triebenfeld", replace: "Most gracious Prince and Lord. With the most unspeakable labour the honest Amelang has at last brought matters so far to a conclusion that he has given, from the banker leve, an order to pay upon the Kuh brothers, before the monies from the Invalids' Fund, which in truth consist in Sea-Trading Company obligation in / to the amount of 36,755 Rthl. 7 Groschen has received. I hasten to transmit the same, without the very least delay, most obediently to Your Most Serene Highness. Tomorrow everything will be arranged, and the Hanus matter as well as the Eysenhardt one put in order, and when I have finished with that I shall hasten back in to go to Kalisz and to see to the rest for the obtaining of the 100,000 Rthl. In deepest reverence I remain, until death, Your Most Serene Highness's — may Your Serene Highness be pleased to have the letter to the Messrs Kuh delivered at once — faithful and most obedient serv[ant] von Triebenfeld\n\nBerlin, the 31st of January 1805.\n\nHow true is presumably, in a position to hinder the dismemberment? I offer defiance to any man.", why: "v Triebenfeld / Berlin den 31ten Januar 1805. / Wie war ist wohl, in Stande die Dismembration zu hindern? Ich biete jeden trotz: the date and the postscript after the signature"}
- {pad: oe1bu9454-162, page: 3, find: "Your Most Serene Highness's — If only I might soon receive the 3 [uncertain: bronzed] busts and the washstand, it would give much joy. Kalisz, the 24th of February 1805.\n\nfaithful, humble and obedient servant\n\nvon Triebenfeld", replace: "Your Most Serene Highness's faithful, humble and obedient servant\n\nvon Triebenfeld\n\nKalisz, the 24th of February 1805.\n\nIf only I might soon receive the 3 [uncertain: bronzed] busts and the washstand, it would give much joy.", why: "v Triebenfeld / Kalisz den 24ten Febr. 1805. / Wann ich nur bald die 3 franzirte Büſte und das Lavoir erhalten könten es würde viel Freude machen.: the date and the postscript after the signature"}
- {pad: oe1bu9454-178, page: 2, find: "Your Right Honourable's — P.S. His Serene Highness, before the departure, has appointed me Councillor of Dispatches!! Dresden, the 8th of November 1805.\n\nhumble and obedient servant A: Hahn", replace: "Your Right Honourable's humble and obedient servant A: Hahn\n\nDresden, the 8th of November 1805.\n\nP.S. His Serene Highness, before the departure, has appointed me Councillor of Dispatches!!", why: "A: Hahn / Dresden d 8ten Nov: 1805. / N.S. Sr. Durchl. haben mich noch vor der Abreiße zum Expeditions Rath ernannt!!: the date and the postscript after the signature"}
- {pad: oe1bu9454-191, page: 11, find: "Since, for the rest, the lazy Schenck means, as he says, to croak, the councillor of war von H[e?]llen will be so good as to come here from Kalisz once every 4 weeks and look over everything that happens here, without his demanding a Groschen. Also, since Schenck now wishes to have himself brought at once to an abbot at Poznań, I shall immediately hand over the cash-box to Honrichs and Cabanis; these two shall not be permitted to do anything one without the other, and there is therefore nothing to be feared. I think too to be here again about Michaelmas, when many have now promised to pay. In deepest reverence I remain, until death, Your Serene Highness's. This moment I receive in advance from the privy councillor von Tesmar in Berlin the glad news that 360,000 Rthl. are to be had. Oh, if only I could travel first. I am again today\n\nvery ill —\n\nthe 7th of Aug.\n\nTrąbczyn\n\nthe 6th of Aug 1806.\n\nfaithful and most obedient servant\n\nvon Triebenfeld", replace: "Since, for the rest, the lazy Schenck means, as he says, to croak, the councillor of war von H[e?]llen will be so good as to come here from Kalisz once every 4 weeks and look over everything that happens here, without his demanding a Groschen. Also, since Schenck now wishes to have himself brought at once to an abbot at Poznań, I shall immediately hand over the cash-box to Honrichs and Cabanis; these two shall not be permitted to do anything one without the other, and there is therefore nothing to be feared. I think too to be here again about Michaelmas, when many have now promised to pay. In deepest reverence I remain, until death, Your Serene Highness's faithful and most obedient servant\n\nvon Triebenfeld\n\nTrąbczyn, the 6th of Aug 1806.\n\nThis moment I receive in advance from the privy councillor von Tesmar in Berlin the glad news that 360,000 Rthl. are to be had. Oh, if only I could travel first. I am again today\n\nvery ill —\n\nthe 7th of Aug.", why: " v Triebenfeld / Trąbczyn d. 6ten Aug 1806. / Den Augenblick erhalte ich voraus Geheime Rath von Tesmar aus Berlin den frohe Nachricht das 360000 rt zu erhalten sind o wenn ich doch erst reisen  könte. Ich bin heut wieder sehr krank — d 7ten Aug.: the date and the postscript after the signature"}
- {pad: oe1bu9454-195, page: 2, find: "the moratorium has been extended\n\nby 2 years\n\nWrocław, the 22nd of May\n\n1810.\n\nfaithful most humble and obedient servant\n\nvon Triebenfeld", replace: "faithful most humble and obedient servant\n\nvon Triebenfeld\n\nWrocław, the 22nd of May 1810.\n\nthe moratorium has been extended\n\nby 2 years", why: "v Triebenfeld / Breslau d 22t May 1810. / das Moratorium ist auf 2 Jahre verlängert: the date and the postscript after the signature"}
- {pad: oe1bu9454-196, page: 3, find: "Tomorrow I go to the [uncertain: Leus Praefat]\n\nZychlinski —\n\nSchwarzwald near Międzybórz[uncertain]\n\nthe 25th of May 1810. humble and obedient servant\n\nvon Triebenfeld", replace: "humble and obedient servant\n\nvon Triebenfeld\n\nSchwarzwald near Międzybórz[uncertain], the 25th of May 1810.\n\nTomorrow I go to the [uncertain: Leus Praefat]\n\nZychlinski —", why: "v Triebenfeld / Schwarzwald bey Miedzibor[?]  d. 25ten May 1810. / Morgen gehe ich zum Leus Praefat[?] Zychlinski —: the date and the postscript after the signature"}
- {pad: oe1bu9454-198, page: 3, find: "Two divisions are marching from us against the\n\nTurks — who will command them?\n\nTomorrow I hasten to Konotop; on the 12th I go on to Streiten and from there to Poland. Kąntwicz[?]\n\n8th June 1810.\n\nmost faithful servant\n\nvon Triebenfeld", replace: "most faithful servant\n\nvon Triebenfeld\n\nKąntwicz[?], 8th June 1810.\n\nTwo divisions are marching from us against the\n\nTurks — who will command them?\n\nTomorrow I hasten to Konotop; on the 12th I go on to Streiten and from there to Poland.", why: "v Triebenfeld / Kąntwicz[?] 8tn Juny 1810. / Zwey Divisionen marschiren von uns gegen die Türkken — wer wird die Comandiren? Morgen eile ich nach Kontop d 12ten gehn ich noch Streiten und von da nach Pohlen: the date and the postscript after the signature"}
- {pad: oe1bu9454-202, page: 1, find: "Only may God grant that I quickly sell the 2 free holdings, for then it goes at once to [uncertain: kohlen], and that he sell himself — the 20th of Aug. 10, from Świniary\n\nsincere friend and the\n\nvon Triebenfeld", replace: "sincere friend and the\n\nvon Triebenfeld\n\nthe 20th of Aug. 10, from Świniary\n\nOnly may God grant that I quickly sell the 2 free holdings, for then it goes at once to [uncertain: kohlen], and that he sell himself —", why: "v Triebenfeld / d 20ten Aug 10 von Schweinern / Gebe nur Gott, daß ich eilig die 2 Freystelle verkaufe den geht es gleich nach kohlen, und das er sich zu verkauffen —: the date and the postscript after the signature"}
- {pad: oe1bu9454-216, page: 3, find: "being in a lawsuit with the villain, can now issue no orders touching the service, not to B. — at least he would not [uncertain: heed] them. In deepest reverence I remain, until death, Your Most Serene Highness's. Let Your Serene Highness have the messenger paid; he receives 6 Groschen per mile; 1 Rthl. I have given him for the road —\n\nBlizanów\n\n29th July 1811.\n\nmost humble and obedient servant\nvon Triebenfeld", replace: "being in a lawsuit with the villain, can now issue no orders touching the service, not to B. — at least he would not [uncertain: heed] them. In deepest reverence I remain, until death, Your Most Serene Highness's most humble and obedient servant von Triebenfeld\n\nBlizanów, 29th July 1811.\n\nLet Your Serene Highness have the messenger paid; he receives 6 Groschen per mile; 1 Rthl. I have given him for the road —", why: "v Triebenfeld / Blizanow d 29ten July 1811. / den Bothen laßen Euer Durchlaucht bezahlen er bekömt 6 gg pro Meile 1 rt. habe ich ihm auf die Weg gegeben —: the date and the postscript after the signature"}

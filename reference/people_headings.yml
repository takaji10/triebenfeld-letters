# How each person is headed on the People page (editor, 2026-10-04): the full
# name, surname first, then forenames, then any particle ("von", "vom", "de"):
#
#   Hardenberg, Karl August von
#
# Forenames are given only where the documents or the biography
# (reference/people_bios.yml) establish them; otherwise the surname stands
# alone ("Barbe"). Sovereigns are headed by their regnal name ("Friedrich
# Wilhelm III, King of Prussia"), and princes of a house under the house
# ("Hohenlohe-Ingelfingen, Friedrich Ludwig, Prince of"). An entry that covers
# several people says so in brackets. The list is sorted on this heading.
#
# A value is the heading in both languages; {en:, de:} where they differ.
# A person on the page without an entry here is headed by their display name,
# and build_site_data.py says so.


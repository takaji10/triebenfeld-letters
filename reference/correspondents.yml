# Who wrote each document and to whom, as the reader sees it (editor, 2026-10-03).
#
# The holdings record a sender and a recipient as the source names them
# ("Hardenberg", "Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen",
# "Ministerium der auswärtigen Angelegenheiten"). Each such form is a key here,
# and the site shows instead:
#
#   name_en, name_de    the name in each language, in the lists (Browse, search)
#   title_en, title_de  who the person was at the time of these documents; the
#                       document header shows "name, title"
#
# A title is the office or position held at the date of the documents the name
# appears on, from the documents first, then from the People page biographies
# (reference/people_bios.yml). A form not listed here is shown as it stands,
# and build_site_data.py says so, so that a new holding's correspondents are
# added here.


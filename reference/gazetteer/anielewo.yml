text_en: Village southwest of Łukom. Originally named *Kolonia Ingelfingen* and founded as a German colony by Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen and Öhringen (1746-1818) who named it after his family name. Renamed to Anielewo in 1891 as part of efforts by the Polish authorities to remove traces of previous Prussian occupation.

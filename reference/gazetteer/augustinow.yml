text_en: Village south of Zagórów. Originally named *Kolonia Augustinhof* and founded as a German colony by Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen and Öhringen (1746-1818) who named it after one of his children. Augustinhof was established on March 21, 1806, when the Trąbczyn Patrimonial Court issued an agreement between Hohenlohe-Ingelfingen and eighteen German colonists to settle on 100 *Hüfen* (766 ha, or 7.7 km²) of woodland on the Drzewce estate.[^3] Renamed to Augustynów in 1891 as part of efforts by the Polish authorities to remove traces of previous Prussian occupation. *Hol. Augustinow* (Reymann 1834).

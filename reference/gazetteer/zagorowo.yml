text_en: Town east of Pyzdry. First mentioned as *Zagorovo* in a 1240 document where
  Archbishop Fulco of Gniezno conferred the tithes from seven villages to Ląd Abbey.[^115]
  Mentioned in a 1261 document where Prince Bolesław the Pious confirmed the earlier
  1145 founding privilege for a monastery at Ląd made by Mieszko III and donated additional
  villages including Zagórów.[^116] In 1407, Władysław II Jagiełło gave permission
  to Ląd Abbey to establish a city in the town of Zagórów and transfer it from Polish
  law to Magdeburg/Teutonic law. The city was made exempt from any jurisdiction of
  existing castellans, judges, and other authorities, which was taken over by city
  authorities. The right to hold a weekly open market was also granted.[^117] The
  parochial church in Zagórów was absorbed by Ląd Abbey in 1414 in agreement with
  Paul, the rector of the church. In return the rector was invited to join the monastery
  and was provided with clothing and a salary.[^118] Appeared with two windmills on
  Gilly 1802; with a customs office (Richter 1843); with four windmills (Reymann 1834);
  renamed to *Hinterberg* during Nazi Germany occupation (Hohensalza 1942). The Słownik
  geograficzny records it as osada, dawniej miasteczko, na krawędzi szerokiej doliny
  Warty, pow. słupecki, gm.[^119]

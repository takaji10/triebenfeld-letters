text_en: "Village on the Warta River, 10 kilometres west of Zagórów, today in the gmina of Pyzdry, with the settlement of Białobrzeg Ratajski beside it. First mentioned in 1547 for its mill on the Warta (*molendino ... vulgo Biało-Brzeski*); the name means \"white bank\", and the second parts of *Białobrzeg Pietrzykowski* and *Białobrzeg Ratajski* come from the neighbouring villages of Pietrzyków and Rataje.[^1] In 1798 the miller Samuel Lucke of the mill *Białobrzeg bey Wrąbczynek* contracted to buy 1,000 Morgen of the home farm of Szetlewek from the Prince of Hohenlohe-Ingelfingen's agent.[^2] The Słownik geograficzny records Białobrzeg Pietrzykowski as a village and Białobrzeg Ratajski as a settlement on the Warta, gmina Dłusk, parish of Zagórów, powiat słupecki, the first with 6 houses and 112 inhabitants, the second with 1 house and 5 inhabitants.[^3]"

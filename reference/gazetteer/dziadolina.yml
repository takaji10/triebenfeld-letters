text_en: Locale which existed south of Łomów. First mentioned as a forest in a 1775
  border commission report which stated that *Trąbczyńskie Stare Olędry* was established
  on part of the Dziadulina forest on the Trąbczyn estate.[^17] Listed as a settlement
  (Pl. *osada*) in the Geographical Dictionary of the Kingdom of Poland in 1881[^18]
  and shown on Trójwiorstówki 1914 as *G[uta?] Diadolina*. *Dziadowy* (Gilly 1802);
  as a forest called *Dziadulina* (Kozłowski 1861).

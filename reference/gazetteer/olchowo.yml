text_en: Village northeast of Zagórów. Originally named *Kolonia Sophienthal* and founded as a German Olęder colony by Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen and Öhringen (1746-1818) who named it after one of his children. Renamed to Olchowo in 1891 as part of efforts by the Polish authorities to remove traces of previous Prussian occupation. *Hol. Sophienthal* (Reymann 1834).

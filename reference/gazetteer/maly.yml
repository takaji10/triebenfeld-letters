text_en: 'Settlement that existed west of Anielewo (Ingelfingen). Likely part of Anielewo.
  Only one map noted this feature (Reymann 1834). Not to be confused with the colony
  renamed *Mały Las* in 1891 (see Ludwigslust): the SG entry for that renaming belongs
  to the Ludwigslust colony, while this settlement is recorded separately next to
  Anielewo.'

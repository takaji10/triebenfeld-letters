text_en: River flowing into the Warta River and running approximately from north of Zagórów,
  east to Chruściki, and then south alongside Mariantów, Stanisławów, Szetlewek, and continuing
  south to Grodziec. A hammer mill (Ger. *Frischfeuer*) existed along the Czarna Struga river
  south of Mariantów and was depicted on Gilly 1802. The Słownik geograficzny calls the stream
  at Trąbczyn, Maryantów and Szetlewek the *Biały*;[^1][^2][^3] today it is named *Bawół* on
  OpenStreetMap.[^4]

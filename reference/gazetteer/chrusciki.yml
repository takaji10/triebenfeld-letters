text_en: Village east of Kopojno. Originally named *Kolonia Adelhof* and founded as
  a German colony by Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen and Öhringen
  (1746-1818) who named it after one of his children. Renamed to Chruściki in 1891
  as part of efforts by the Polish authorities to remove traces of previous Prussian
  occupation. The Słownik geograficzny records it as kol. , pow. słupecki, gm, with
  242 inhabitants at the time of the Słownik.[^1] Nazwy miejscowe Polski records the
  name as *Crosczino* by 1386, later as *ściński* (1970).[^2]

text_en: Village east of Myszakówek. According to Chodyła, Myszaków and Myszakówek
  were simultaneously established before 1789 by the owner of the Łukom estate.[^49]
  *Miszokowo* (von Pfau 1770); with a windmill (Wreschen 1901). The Słownik geograficzny
  records it as młyn. i Myszakówek, wś, pow. słupecki, gm.[^50] Nazwy miejscowe Polski
  records the name as *Misszakowo* by 1413, later as *Myszaków* (1827).[^51]

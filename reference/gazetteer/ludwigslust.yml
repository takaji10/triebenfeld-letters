text_en: 'Hamlet south of and belonging to Olchowo. The German colony *Kolonia Ludwigslust*
  was likely integrated into the smaller Mały Las settlement immediately south in
  1891 as part of efforts by the Polish authorities to remove traces of previous Prussian
  occupation. A hand-drawn map from the 1990s by descendants/former residents of Olchowo
  listed them as two separate places (Map 26, Tab. 26). First appeared on Messtischblatt
  1940. The settlement map found in the Lutheran church in Zagórów included a list
  of settlers, along with the text: “These are the names of the families who lived
  here as the last generation. The numbers are randomly assigned and are not identical
  to the official house numbers.” The Słownik geograficzny records it as kol. , pow.
  słupecki.[^1]'

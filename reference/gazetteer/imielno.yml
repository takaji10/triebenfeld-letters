text_en: Village north of Łukom. First mentioned as *Chemelino* in a 1243 document
  where Przemysł I, Duke of Greater Poland donated a hospital (almshouse) in Gniezno
  to “the rule of the Holy Sepulchre of the house of Miechov.”[^27] The hospital owned
  several villages, including Imielno. Mentioned in a 1461 privilege document for
  *Pustkowie Grądziem*.[^28] According to Chodyła, Imielno was re-established as *Imielno
  Olędry* on the initiative of the owner of the Łukom/Łomów estates before 1789,[^29]
  either through a change in its legal status or by clearing the land which had been
  long-abandoned.[^30] This appears likely as Łukom 1766 showed this place as *Dezerta
  Jemielno* (*dezerta* is Polish for an abandoned place). *Iemielna* (Richter 1843).
  The Słownik geograficzny records it as a folwark, in gmina Trąbczyn, parish of Zagórów,
  powiat słupecki, with 4 houses and 42 inhabitants at the time of the Słownik.[^31]
  Nazwy miejscowe Polski records the name as *Imielna* by 1859, later as *Imielno*
  (1877).[^32]

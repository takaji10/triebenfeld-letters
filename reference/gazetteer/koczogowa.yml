text_en: Water mill which existed east of Myszaków. Possibly located at Łukom, which
  was recorded as having a mill (Gilly 1802) and was mentioned in a 1775 court document
  concerning a property dispute between the Trąbczyn and Łukom estates.[^31] Only
  one map noted this feature (von Pfau 1770).

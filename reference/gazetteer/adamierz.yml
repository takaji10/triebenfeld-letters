text_en: Village south of Wrąbczynkowskie Holendry. First mentioned as *Nadamirza*
  in a 1377 document where Palatine Przecław of Kalisz and others protested to Louis
  I of Hungary that Wrąbczynek with the adjoining village of Adamierz belonged to
  Ląd Abbey.[^1] Mentioned as *Nadomirz* in a 1440 document where Władysław III bequeathed
  Stanisław the Black 500 grzywny from Adamierz and other villages.[^2] Known in metrical
  records as *Yadomierzh’ (Ядомиржъ)* during the Russian period (ca. 1868-1915). Nazwy
  miejscowe Polski traces the name from the medieval *Nedamirz* through *Nadomyrz*,
  *Niedamierz* and *Jadamyerz* to the modern form.[^3] The Słownik geograficzny records
  it as a folwark, in gmina Trąbczyn, powiat słupecki, with 1 house and 7 inhabitants
  at the time of the Słownik.[^4]

text_en: Location unknown. Mentioned in Trąbczyn Catholic parish metrical records
  in the latter half of the 18th century. In one case, a record from 1768 referred
  to this place as “Potaszniki v[el] Huta” in Latin (“Potaszniki or Huta” in English).[^62]
  Possibly named after a local noble(?) family with the same last name (*Potasznicki*)
  as seen in metrical records.

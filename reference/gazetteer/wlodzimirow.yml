text_en: Village south of Michalinów Oleśnicki. Named after Count Włodzimierz Miączyński
  (1811-1879), owner of the Trąbczyn estate. According to Breyer, Włodzimirów was
  established on German-owned land.[^96] First mentioned in an 1826 Trąbczyn Catholic
  parish metrical record.[^97] Appeared as a folwark (Richter 1843); *Kolonia Włodzimirów*
  (Pełzucki 1901). The Słownik geograficzny records it as a folwark, parish of Trąbczyn,
  powiat słupecki, with 1 house and 17 inhabitants at the time of the Słownik.[^98]

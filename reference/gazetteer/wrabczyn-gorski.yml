text_en: Village northwest of Wrąbczyn. First appeared on Słupca 1957. Originally the German colony *Kolonia Wrąbczyn*, not to be confused with Wrąbczynkowskie Holendry, the older Olęder settlement west of Wrąbczyn. It was one of the colonies founded on the estates of Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, after his general agent Triebenfeld let 100 Hufen of forest to eighteen German settlers in hereditary lease.[^1] Breyer and Wąsicki name *Kolonie Wrombczyn* (*kolonia Wrąbczyn*) among the German villages that came about in this way, with Ingelfingen, Emilienheim, Augustinhof and Schwentz on the upland beside the Warta valley.[^2][^3] Chodyła counts Wrąbczyn among the colonies whose settlers came chiefly from Silesia and in smaller part from the Neumark.[^4] *Колонія Вромбчинъ* (Mapa dróg 1890).

text_en: Water mill which existed south of Kopojno. First mentioned in a 1742 birth
  record from Trąbczyn Catholic parish metrical records.[^80] *Kolonia Friedrichsfeld*
  took the name Tarszewo in 1891 as part of efforts by the Polish authorities to remove
  traces of previous Prussian occupation. First appeared on Trąbczyn 1790; *Tarszew
  M.* (Gilly 1802); *Osada Tarszew Ml. [Młyn]* (Richter 1843).

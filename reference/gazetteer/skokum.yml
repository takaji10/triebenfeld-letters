text_en: Village east of Zagórów. First mentioned as *Skokome* in a 1240 document
  where Archbishop Fulco of Gniezno conferred the tithes from seven villages to Ląd
  Abbey.[^65] Mentioned in a 1261 document where Prince Bolesław the Pious confirmed
  the earlier 1145 founding privilege for a monastery at Ląd made by Mieszko III and
  donated additional villages including Skokum.[^66] The Słownik geograficzny records
  the settlement.[^67]

text_en: >-
  Village south of Łazy, the area of the former Trąbczyńskie Nowe Olędry.
  One of the two villages into which Łazińskie Olędry was separated in the
  later half of the 20th century, the other being Łazińsk Pierwszy. The
  AGOFF society's article "Der evangelische Friedhof in Łazińsk Drugi"
  (Jürgen Frantz, 2016) records the village's Protestant cemetery.

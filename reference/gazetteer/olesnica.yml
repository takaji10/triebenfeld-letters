text_en: Village east of Zagórów. First mentioned as *Oleszyno* in a 1261 document where Prince Bolesław the Pious confirmed the earlier 1145 founding privilege for a monastery in Ląd made by Mieszko III and donated additional villages including Oleśnica.[^55] First appeared with a windmill (Gilly 1802); with a manor house (Richter 1843); renamed to *Erlenbruch* during Nazi Germany occupation (Hohensalza 1942).

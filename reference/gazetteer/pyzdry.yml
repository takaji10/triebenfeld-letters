text_en: Town in Września Gmina west of Zagórów. Mentioned as early as 1232 when the
  army of Duke Henry I the Bearded entered Greater Poland. The Lisewo-Pyzdry branch
  of the newly-formed Zagórów Evangelical-Augsburg Lutheran parish was established
  here in 1842. A document of 14 October 1341 (Kodeks, vol. and no. in the footnote)
  concerns the village.[^1] The Słownik geograficzny records it as osłym brzegu, pow.
  słupecki, gm, with 232 houses and 3151 inhabitants at the time of the Słownik.[^2]
  The Słownik geograficzny records it as miasto, pow. słupecki.[^3]

text_en: German colony northwest of Wrąbczynek, not to be confused with Wrąbczynkowskie Holendry,
  the older Olęder settlement west of Wrąbczyn, or with Wrąbczyn Górski on the road from Wrąbczyn
  to Wrąbczynek. It was one of the colonies founded on the estates of Friedrich Ludwig, Prince
  of Hohenlohe-Ingelfingen, after his general agent Triebenfeld let 100 Hufen of forest to eighteen
  German settlers in hereditary lease.[^1] Breyer and Wąsicki name *Kolonie Wrombczyn* (*kolonia
  Wrąbczyn*) among the German villages that came about in this way, with Ingelfingen, Emilienheim,
  Augustinhof and Schwentz on the upland beside the Warta valley.[^2][^3] Chodyła counts Wrąbczyn
  among the colonies whose settlers came chiefly from Silesia and in smaller part from the Neumark.[^4]
  *Колонія Вромбчинъ* (Mapa dróg 1890). The Słownik geograficzny records it as *Wrąbczyńskie
  Holendry*, a colony, gmina Emilienheim, parish of Zagórów, powiat słupecki, 17 versts from
  Słupca, with 8 houses and 61 inhabitants.[^5]

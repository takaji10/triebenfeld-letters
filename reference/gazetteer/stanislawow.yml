text_en: Village west of Szetlewek. Named after Stanisław Miączyński (1780-1845),
  whose wife Michalina Prusimska (1778-1851) was owner of the Trąbczyn estate. Appeared
  as a folwark (Wreschen 1901); *Stanisławów* (Messtischblatt 1940). Nazwy miejscowe
  Polski records *Stanisławowo* (1847).[^1]

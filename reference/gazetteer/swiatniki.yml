  check: 'OSM (Nominatim) 2026-11-14: Świątniki, gmina Rzgów, powiat koniński, województwo wielkopolskie, 62-586, Polska; the Kodeks editors place it "tuż na zach. od Rzgowa" (KDW 6, note 8), which the point bears out'
text_en: Village east of Zagórów, just west of Rzgów. The name means the village of the *sanctuarii*, the people who served a church; the Kodeks editors take the *sanctuarii* granted with Rzgów to the abbey of Ląd in 1261 and again in 1280 to be Świątniki.[^1][^2] A former church village, it was one of the sixteen the King granted to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, in 1797, with Zagórów, Skokum, Kopojno and Oleśnica.[^3] The table of the villages around Konin of about 1797 counts 21 houses and 133 people, 61 men and 72 women.[^4] The list of the places of the lordships of Zagórów and Trąbczyn enclosed with a letter of 1806 names it a rent-paying village (*Zins Dorf*),[^5] and in 1811 Triebenfeld wrote two of his letters to the Prince from Świątniki, one of them dated 27 January.[^6] *Свентники* (Mapa dróg 1890).

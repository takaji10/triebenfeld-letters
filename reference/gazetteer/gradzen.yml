text_en: Village in the Zagórów area, recorded in 1365 as *Grzandzen*; today Grądzeń.
  The Słownik geograficzny records it as a village, in gmina Emilienheim, parish of
  Zagórów, powiat słupecki, with 10 houses and 80 inhabitants at the time of the Słownik.[^1]
  Nazwy miejscowe Polski records the name as *Grzandzen* by 1365, later as *Grądzeń*
  (1827).[^2]

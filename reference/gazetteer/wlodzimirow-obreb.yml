text_en: Historical forest precinct which existed east of Włodzimirów. The precinct included the districts (*okręg*) of *Grabina* (north of Grabina), *Garbinck* (northwest of Stanisławów), and *Osiny* (southwest of Osiny). Only one map noted this feature (Kozłowski 1861).

text_en: Village south of Łukom. Mentioned as *Pustkowie Grądziem* in a 1461 privilege document from Ląd Abbey, which was sold by the German Bochneth family to the monastery for the sum of 400 Cologne marks.[^21] *Pustkowie Grądziem* included three farms in Łukom, the forests of *Grądziem*, *Chmielniki*, and *Łome* (the latter forest which extended up to the road known as *Rosaszewska* that ran from Łukom and Łomow to the inns known as *Karczemne Gory* and *Karczemne Ługi*), the Pyzdry crag/cliff, and the meadow above Imielno.[^22] *Grązien* (Łukom 1766); *Pustkowie Grądzin* (Perthées 1798); *Grondzyn* (Gilly 1802); *Haulanderei Grądzyn* as part of the Kopojno estate (Hollring 1804); with a customs office as *Grazin* (Richter 1843); *Hol. Grądzeń* (Chrzanowski 1858).

text_en: Village southeast of Zagórów. First mentioned as *Trampczino* in a 1240 document where Archbishop Fulco of Gniezno conferred the tithes from seven villages to Ląd Abbey.[^81] Trąbczyn (*Trupcino*) was given to Count Nicholas, treasurer of Ląd in 1276 by Duke Bolesław V the Chaste after the former owner Count Ianchoni, son of Simon, died without an heir.[^82] Nicholas was granted permission to lease Trąbczyn (*Tropcssino*) by Przemysł II in 1284.[^83] Trąbczyn was owned by the brothers Johannis and Przedpełk, and Andreas in 1346.[^84] The village was also mentioned in 1399 (as *Trambczyno*) when the Archbishop of Gniezno ruled that the tithing of a portion of crops from Trąbczyn were to be given to Ląd Abbey, instead of to the village’s rector Johannes.[^85] The Geographical Dictionary of the Kingdom of Poland in 1892 stated that Trąbczyn had a wooden parish church, an elementary school, a post office, distilleries, an oil mill, a brickyard, and a windmill.[^86] In the early 20th
  century, Trąbczyn was surrounded by a folwark with the same name as the town (Pełzucki 1901). Renamed to *Drommin* during Nazi Germany occupation (Hohensalza 1942) and was part of *Amtsbezirk (District) Drommin*.[^87] *Trąmbczino* (Blaeu 1665); *Trompzin* (von Pfau 1770); *Trąpczin* (Perthées 1798); with a windmill and chapel/church (Gilly 1802).

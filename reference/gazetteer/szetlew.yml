text_en: Village southeast of Łazy. First mentioned as *Szetlevo* in a 1240 document where Archbishop Fulco of Gniezno conferred the tithes from seven villages to Ląd Abbey.[^70] Mentioned in a 1261 document as “*Szethowo cum cocis”* (Latin for “Szetlewo with cooks,” also mentioned as such in 1280[^71]) where Prince Bolesław the Pious confirmed the earlier 1145 founding privilege for a monastery at Ląd made by Mieszko III and donated additional villages.[^72] In 1589, Nicolaus Otto-Trąmpczyński, the owner of Szetlew, was sued by other members of the Otto-Trąmpczyński family for destroying their nearby mill by diverting its watercourse and blocking the road to the mill.[^73] The most recent version of the mill was built circa 1910-1912 by W. Hauke and ceased operations in 1979.[^74] In 1775, Szetlew and the nearby village of Podbiel were mentioned as being owned by Jan Nepomucen Zakrzewski, the son of Marianna Prusimska who was sister to Paweł and Antoni Prusimski, owners of the Trąbczyn
  estate in the 18th century.[^75] *Szetlewo* (Perthées 1798).

text_en: Hill northwest of Wymysłów, north of Zagórów. The name is Polish for a small hill of lime trees (*lipa*, lime or linden; *górka*, little hill). It appears on the map of the new boundaries between the town of Zagórów and the villages of Wrąbczyn, Augustynów, Drzewce and Oleśnica (Zagórów 1841) and in no other source the edition holds; whether it is the same as a hill known today has not been found.

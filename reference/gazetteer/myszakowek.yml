text_en: Village east of Łukom. According to Chodyła, Myszakówek was established as an Olędry[^50] before 1789 (however, it does not appear on Łukom 1766) on the initiative of the owner of the Łukom/Łomów estates as part of a village of mixed legal and organisational status that included *Stara Huta* and *Zagórowskie Olędry*.[^51] First appeared on Perthées 1798; as *Myszakowko* (Gilly 1802).

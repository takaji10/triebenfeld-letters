text_en: Village east of Zagórów. First mentioned as *Kopanino* in a 1240 document where Archbishop Fulco of Gniezno conferred the tithes from seven villages to Ląd Abbey.[^32] Mentioned in a 1291 privilege document from Ląd Abbey which stated that Count Sendivogius traded Kopojno (*Copaino*) to the abbey in exchange for Główiew, Sławsk, and Chocz.[^33] *Kopaino* (von Pfau 1770); *Kopanie* (Perthées 1798); with a windmill (Gilly 1802); *Kopiec* (Chrzanowski 1858); with a manor house (Wreschen 1901).

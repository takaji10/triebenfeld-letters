text_en: Village south of Łazińsk Drugi in Grodziec Gmina. Czarnybród was once an
  Olęder settlement which likely belonged to the Biskupice estate. Notes on the Grodziec
  Catholic parish taken by geographer Karól Perthées mentioned a possible alternative
  name of Czarnybród as *Stary Młyn*.[^10] *Czarnybrod Hol.* (Gilly 1802); *Kol. Czarnybrod*
  (Richter 1843). Nazwy miejscowe Polski records the name as *Czarny Brod* by 1802,
  later as *Czarnybród Czarnegobrodu* (1980).[^11]

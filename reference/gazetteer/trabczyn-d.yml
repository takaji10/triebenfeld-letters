text_en: Hamlet southwest of Łazińsk Pierwszy. Appeared in Zagórów Evangelical-Augsburg
  Lutheran parish metrical records around 1920.[^90] Likely created after the parcelling
  of Trąbczyn estate property in the late 19th century. Breyer noted that Trąbczyn
  D was forest land that was initially part of the Trąbczyn estate, which was bought
  by a Jewish person and then sold to Germans 5-6 years before World War I. Breyer
  cited the *Bocheński, Kinast, Winterfeld, Retzlaff, Schwarz, Lipelt*, and *Schmechel*
  families living here around 1936.[^91]

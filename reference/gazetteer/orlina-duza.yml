text_en: Village in the Trąbczyn and Zagórów area. Its Evangelical cemetery is the
  largest of the cemeteries of the area, surrounded by a low stone wall, with many
  headstones well preserved and still standing, and a separate section for infants;
  a carved stone gravestone of the Jursch family names a birth of Gustav Jursch in
  Pleschen (Pleszew) in 1797.

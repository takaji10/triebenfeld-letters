text_en: Settlement east of Stawiszyn, on the northern edge of a forest complex a
  few square kilometres in area. Its Evangelical cemetery is approximately 25 kilometres
  southeast of the Trąbczyn area; it is in the survey of the Evangelical cemeteries
  because some Zelmers from the Trąbczyn area moved to Zbiersk Kolonia and the nearby
  settlement of Łyczyn.

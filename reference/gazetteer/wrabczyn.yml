text_en: Village west of Zagórów. First mentioned as *Wronczino* in a 1240 document where Archbishop Fulco of Gniezno conferred the tithes from seven villages to Ląd Abbey.[^98] Wrąbczyn came under possession of the abbey in 1241, when Prince Casimir I of Kuyavia traded the village (“which once belonged to the huntsmen”) to Ląd Abbey in exchange for Koszanów (Fig. 78).[^99] In 1287, Wrąbczyn (*Wroncino*) and Bieganin were traded by Wislai, son of Gerlacho, to Woislai, son of Goslai in exchange for the village of Niałek.[^100] It was later leased to Henry of Pyzdry by Przemysł II in 1291 and amalgamated with the village of Sal.[^101] Wrąbczyn was also leased to Count Wojsław in 1298.[^102] Władysław I Łokietek, noting “the excessive devastation and destruction we brought upon the house of Lendz of the Cistercian Order when we were with our army in Poland,” granted Ląd Abbey a water mill near Pyzdry on the Warta River in 1324 and also confirmed the abbey’s hereditary rights to Wrąbczyn (*Wronchyno*)
  “with the lake called *Seborowo*” (today a swamp north of Wrąbczyn) and other villages.[^103] The lake Seborowo was also mentioned as *Prziborowo* in a 1377 document, where it was stated as belonging to Wrąbczynek.[^104] In 1357, Ląd Abbey traded the village of Szczonowo to Zemka, spouse of Albert in exchange for one third of Wrąbczyn (*Magnum Wroenschino*).[^105] Parts of the village were also sold on two other occasions to Ląd Abbey, and various heirs recognised the monastery as the rightful owner between 1362-1364.[^106] The ownership of Wrąbczyn was disputed in 1384; despite Petrko of Lang’s claim, judge Nicolaus of Kalisz confirmed Ląd Abbey as the rightful owner.[^107] Wrąbczyn and its meadows called Obroczna and Dokolowka were again traded by Ląd Abbey in 1418 to Laurencius Yelonouicz in exchange for Drzewce (*Drzewcza*), although the source expressed uncertainty as to which Drzewce was being referenced.[^108] *Wromszin* (von Pfau 1770); with a windmill (Gilly 1802); with a manor
  house (Richter 1843).

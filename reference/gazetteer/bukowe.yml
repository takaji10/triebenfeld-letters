text_en: Village east of Łukom. The name is an adjective for beech trees (*Buk*).
  According to Chodyła, *Bukowo*/*Bukowe* (which may have existed previously as a
  medieval-era village) or *Olędry Łomowskie* was established on the initiative of
  the owner of the Łukom/Łomów estates before 1789,[^6] either through a change in
  its legal status or by clearing land which had been long-since abandoned.[^7] It
  is illustrated as an Olęder settlement on a sketch of Zagórów parish from circa
  1790 by Karól Perthées (Fig. 74).[^8] *Bukower Hol.* (Gilly 1802). Nazwy miejscowe
  Polski records the name as *Bukowo* by 1827, later as *Bukowe* (1839).[^9]

# German for the short English notes the site shows on a document's page:
# the basis of a supplied date, and the note on a link between two documents.
#
# Keyed by the English note exactly as it stands in units/<slug>/rulings.yml.
# build_site_data.py looks each note up here; a note with no entry is shown in
# English on the German view too, so add the German when a note is added or
# reworded. Quotations from the documents stay as they are.
"letter missing/skipped in the archive": "Nummer fehlt im Archivbestand oder wurde übersprungen"
"register/ledger document, no date given in the source": "Verzeichnis, in der Quelle ohne Datum"
"between L182 (May 1806) and L184 (15 May 1806)": "zwischen Nr. 182 (Mai 1806) und Nr. 184 (15. Mai 1806)"
"between L214 (21 Jul 1811) and L216 (29 Jul 1811)": "zwischen Nr. 214 (21. Juli 1811) und Nr. 216 (29. Juli 1811)"
"between L223 (4 Dec 1811) and L226 (20 Dec 1811)": "zwischen Nr. 223 (4. Dezember 1811) und Nr. 226 (20. Dezember 1811)"
"between L229 (27 Jan 1812) and L233 (26 Jun 1812)": "zwischen Nr. 229 (27. Januar 1812) und Nr. 233 (26. Juni 1812)"
"between L61 (31 Aug 1809) and L64 (6 Dec 1809)": "zwischen Nr. 61 (31. August 1809) und Nr. 64 (6. Dezember 1809)"
"undated P.M. note bundled between 74a (30 Jul 1811) and 74c (1 Aug 1811)": "undatierte Notiz (Pro Memoria), eingelegt zwischen 74a (30. Juli 1811) und 74c (1. August 1811)"
"February 1815, written with or just after letter 2 (9 Feb 1815): he has just received the prince's letters of 19 and 28 January, has been in Vienna five months, and owes the Staatskanzler 100 and Barbe 70 ducats - the 170 of letter 2": "Februar 1815, zusammen mit oder kurz nach Brief 2 (9. Februar 1815) geschrieben: Er hat soeben die Briefe des Fürsten vom 19. und 28. Januar erhalten, ist seit fünf Monaten in Wien und schuldet dem Staatskanzler 100 und Barbe 70 Dukaten, die 170 aus Brief 2"
"early December 1814: written on receiving three letters of 8, 25 and 27 November, from Vienna, where the Courland heirs' 112,000 rt and Kircheisen as guardian are the business of those weeks. The first page may be missing": "Anfang Dezember 1814: nach Empfang dreier Briefe vom 8., 25. und 27. November aus Wien geschrieben, wo die 112.000 Rthl der kurländischen Erben und Kircheisen als Vormund in diesen Wochen verhandelt werden. Die erste Seite fehlt möglicherweise"
"late November 1814: filed between 253 (26 Nov 1814) and 255 (30 Nov 1814); he has been in Vienna about 12 weeks. Enclosure 254 b (Breslau, 2 May 1809) is a separate receipt": "Ende November 1814: abgelegt zwischen 253 (26. November 1814) und 255 (30. November 1814); er ist seit etwa zwölf Wochen in Wien. Die Beilage 254 b (Breslau, 2. Mai 1809) ist eine eigene Quittung"
"'In Gemäßheit ... Schreibens vom 29sten April d. J.': the instruction to Schöler.": "'In Gemäßheit ... Schreibens vom 29sten April d. J.': die Anweisung an Schöler."
"'Le rapport ci-joint du Lieutenant': the copy of Prince Zajączek's report.": "'Le rapport ci-joint du Lieutenant': die Abschrift des Berichts des Fürsten Zajączek."
"'Schreiben ... vom 13ten d. M. und dessen Beilagen'.": "'Schreiben ... vom 13ten d. M. und dessen Beilagen'."
"'Zuschrift vom 12ten d. M.': the Prince's letter of 12 May 1815.": "'Zuschrift vom 12ten d. M.': der Brief des Fürsten vom 12. Mai 1815."
"'den Empfang Ihres ... Schreibens vom 12 v. M.': the Prince's letter of 12 May 1815.": "'den Empfang Ihres ... Schreibens vom 12 v. M.': der Brief des Fürsten vom 12. Mai 1815."
"'die Vorstellung von 2 dM': Triebenfeld's petition of 2 March 1815.": "'die Vorstellung von 2 dM': Triebenfelds Eingabe vom 2. März 1815."
"'unterm 26ten April d. J. gerichtete Vorstellung': the widow von Brehmer's petition.": "'unterm 26ten April d. J. gerichtete Vorstellung': die Eingabe der Witwe von Brehmer."
"A covering rescript of the same day, transmitting an engrossment of the purchase contract confirmed under that date.": "Ein Begleitreskript vom selben Tag, mit dem eine Ausfertigung des an diesem Tag bestätigten Kaufvertrags übersandt wird."
"And by 'deren Deklarezion von des izt regierenden Königl. Majestaat vom 1ten December ejd: a.' - document 11.": "Und durch 'deren Deklarezion von des izt regierenden Königl. Majestaat vom 1ten December ejd: a.': Dokument 11."
"And on 'Unserer Declaration derselben vom 1ten Debr.' - document 11, the supplementary grant of 1 December 1797.": "Und auf 'Unserer Declaration derselben vom 1ten Debr.': Dokument 11, die ergänzende Verleihung vom 1. Dezember 1797."
"Attests that the Betsche estates were conferred 'durch die Schenkungs Urkunde von 10ten Juny 1797'. The day is written 10 here where every other copy in this holding reads the 19th. Ruled by the editor, 2026-09-17: an error in the original document, not a misreading, and left standing.": "Bescheinigt, dass die Betscher Güter 'durch die Schenkungs Urkunde von 10ten Juny 1797' verliehen wurden. Der Tag lautet hier 10, während jede andere Abschrift in diesem Bestand den 19. hat. Entscheidung des Herausgebers vom 17. September 2026: ein Fehler der Vorlage, kein Lesefehler; er bleibt stehen."
"Cites 'die Urkunde vom 19. Juny d. J. bereits verliehenen Gütern: Betschen, Zagórów und Wienietz'. Dated 1 December 1797, so 'd. J.' is 1797.": "Zitiert 'die Urkunde vom 19. Juny d. J. bereits verliehenen Gütern: Betschen, Zagórów und Wienietz'. Datiert vom 1. Dezember 1797, 'd. J.' ist also 1797."
"Cites 'die Urkunde vom 19ten Junius d J. bereits verliehenen Gütern, Betschen, Zagórów, und Wienietz'.": "Zitiert 'die Urkunde vom 19ten Junius d J. bereits verliehenen Gütern, Betschen, Zagórów, und Wienietz'."
"Document 16 records that the contract made over these ten Hufen on 26 May of that year by one Kunkel was handed back and wholly annulled. Document 17 is that Kunkel contract, dated 26 May 1804.": "Dokument 16 hält fest, dass der Vertrag, den ein Kunkel am 26. Mai desselben Jahres über diese zehn Hufen geschlossen hatte, zurückgegeben und gänzlich aufgehoben wurde. Dokument 17 ist dieser Vertrag Kunkels vom 26. Mai 1804."
"Document 21 is conditional throughout on the sale to Honrichs having been annulled; document 2 is the purchase punctation to Martin Honrichs over the same estate of Witow. It replaces that document only once the annulment takes effect.": "Dokument 21 steht durchweg unter der Bedingung, dass der Verkauf an Honrichs aufgehoben ist; Dokument 2 ist die Kaufpunktation für Martin Honrichs über dasselbe Gut Witów. Es ersetzt jenes Dokument erst, wenn die Aufhebung wirksam wird."
"Drafted beneath Triebenfeld's letter: 'auf Ihr Gesuch vom 25 v M.'": "Unter Triebenfelds Brief entworfen: 'auf Ihr Gesuch vom 25 v M.'"
"Grants the appurtenances of 'den durch die Urkunde vom 19ten Juny bereits verliehenen Güthern: Betsche, Zagórów und Wienietz'. Document 10 is that grant of 19 June 1797.": "Verleiht die Zubehörungen zu 'den durch die Urkunde vom 19ten Juny bereits verliehenen Güthern: Betsche, Zagórów und Wienietz'. Dokument 10 ist diese Verleihung vom 19. Juni 1797."
"Returns the enclosures she sent on 25 July 1816.": "Sendet die Beilagen zurück, die sie am 25. Juli 1816 eingereicht hatte."
"Sends Minister von Schuckmann a copy of the Russian envoy's note.": "Übersendet dem Minister von Schuckmann eine Abschrift der Note des russischen Gesandten."
"Sends Zerboni the Prince's two letters in the original, the one to Hardenberg of 12 May and the one to Stein of 12 April (document 6).": "Übersendet Zerboni die beiden Briefe des Fürsten im Original, den an Hardenberg vom 12. Mai und den an Stein vom 12. April (Dokument 6)."
"Stein has passed on the letter the Prince wrote him on the 12th of last month; document 6 is that letter, with the direction for this reply written on it.": "Stein hat den Brief weitergegeben, den der Fürst ihm am 12. des Vormonats schrieb; Dokument 6 ist dieser Brief, auf dem die Weisung für diese Antwort vermerkt ist."
"The Treasury's resignation is made 'auf den Grund der Verleihungs Urkunde Unsers in Gott ruhenden Herrn Vaters Königs Friedrich Wilhelm des zweiten Majestaet vom 19ten Juni 1797.'": "Die Auflassung durch den Fiskus erfolgt 'auf den Grund der Verleihungs Urkunde Unsers in Gott ruhenden Herrn Vaters Königs Friedrich Wilhelm des zweiten Majestaet vom 19ten Juni 1797.'"
"The War and Domains Chamber returns the hereditary-lease contract submitted to it and declares the hereditary leasing of the lordship of Betsche to the town's burgesses wholly inadmissible. Document 18 is that contract.": "Die Kriegs- und Domänenkammer sendet den ihr vorgelegten Erbpachtvertrag zurück und erklärt die Vererbpachtung der Herrschaft Betsche an die Bürger der Stadt für gänzlich unzulässig. Dokument 18 ist dieser Vertrag."
"The confirmation names the purchase contract of 16 and 25 January 1805; document 4 is that contract, subscribed at Breslau on 16 January 1805.": "Die Bestätigung nennt den Kaufvertrag vom 16. und 25. Januar 1805; Dokument 4 ist dieser Vertrag, unterzeichnet zu Breslau am 16. Januar 1805."
"The earlier draft is marked 'Cessat et vid. die anderweite Verfügung vom 6. Juny 1815'.": "Der frühere Entwurf trägt den Vermerk 'Cessat et vid. die anderweite Verfügung vom 6. Juny 1815'."
"The mortgage certificate enters the title 'auf den Grund der Verleihungs-Urkunden für den regierenden Herrn Fürsten Friedrich Ludwig zu Hohenlohe Ingelfingen dedato Berlin den 19ten Juny 1797 und de dato Berlin den 1ten Debr: ej. a.'": "Der Hypothekenschein trägt den Besitztitel ein 'auf den Grund der Verleihungs-Urkunden für den regierenden Herrn Fürsten Friedrich Ludwig zu Hohenlohe Ingelfingen dedato Berlin den 19ten Juny 1797 und de dato Berlin den 1ten Debr: ej. a.'"
"The same supplementary grant, here citing 'die Urkund vom 19t Junius d. J. bereits verliehenen Güthern, Betsche, Zagórów und Wienietz'.": "Dieselbe ergänzende Verleihung, hier mit dem Zitat 'die Urkund vom 19t Junius d. J. bereits verliehenen Güthern, Betsche, Zagórów und Wienietz'."
"The second of the two grants that certificate enters the title under: 'de dato Berlin den 1ten Debr: ej. a.'": "Die zweite der beiden Verleihungen, auf die dieser Schein den Besitztitel gründet: 'de dato Berlin den 1ten Debr: ej. a.'"
"Triebenfeld encloses a copy of Hardenberg's resolution of 14 May 1814 ('lege ich in Abschrift hier bey'); document 3 is that copy.": "Triebenfeld legt eine Abschrift von Hardenbergs Bescheid vom 14. Mai 1814 bei ('lege ich in Abschrift hier bey'); Dokument 3 ist diese Abschrift."
"Written to obey 'Euer Königlichen Majestät allerhöchstem Befehl vom 18 November ... nach welchem der Titulus possessionis über die Hochfürstlich Hohenlohischen Güter Kopojno, Zagórów, Drzewce, p. p. berichtiget werden soll'. Document 30 is that order, of 18 November 1800, over the same estates. Note that 29 is subscribed 'Breslau den 3ten Novbr 1800', which is BEFORE the order it answers: ruled by the editor, 2026-09-17, an error in the original document rather than a misreading, so the link stands and the date is left as written.": "Geschrieben in Befolgung von 'Euer Königlichen Majestät allerhöchstem Befehl vom 18 November ... nach welchem der Titulus possessionis über die Hochfürstlich Hohenlohischen Güter Kopojno, Zagórów, Drzewce, p. p. berichtiget werden soll'. Dokument 30 ist dieser Befehl vom 18. November 1800 über dieselben Güter. Dokument 29 ist unterzeichnet 'Breslau den 3ten Novbr 1800', also VOR dem Befehl, auf den es antwortet: nach Entscheidung des Herausgebers vom 17. September 2026 ein Fehler der Vorlage, kein Lesefehler; die Verknüpfung bleibt bestehen und das Datum wie geschrieben."
"Zerboni reports on the order of 6 June 1815 and returns the two original letters.": "Zerboni berichtet auf die Verfügung vom 6. Juni 1815 und sendet die beiden Originalbriefe zurück."
# I. HA GR, Rep. 7 C, Nr. 3709
"'Cabinets Ordre überreichen wir ... abschriftlich anliegend': document 2 is that copy.": "'Cabinets Ordre überreichen wir ... abschriftlich anliegend': Dokument 2 ist diese Abschrift."
"'in der Anlage eine Abschrift der Cabinets-Ordre vom 1ten ... hujus': document 4 is that copy.": "'in der Anlage eine Abschrift der Cabinets-Ordre vom 1ten ... hujus': Dokument 4 ist diese Abschrift."
"The King returns the case files 'mittelst Berichts vom 18ten v. M. ... eingesandten': sent in with the report of 18 June, of which this file holds the copy for the Grand Chancellor.": "Der König sendet die 'mittelst Berichts vom 18ten v. M. ... eingesandten' Prozessakten zurück: eingesandt mit dem Bericht vom 18. Juni, von dem diese Akte die Ausfertigung für den Großkanzler enthält."
"The Prince's covering letter to his petition of the same day: 'mein Bittschreiben noch mit diesen wenigen Worten zu begleiten'.": "Das Begleitschreiben des Fürsten zu seinem Bittschreiben vom selben Tag: 'mein Bittschreiben noch mit diesen wenigen Worten zu begleiten'."
"The decree on the Prince's petition, under the same journal number 5957; documents 8, 9 and 10 were written from it.": "Die Verfügung auf das Bittschreiben des Fürsten, unter derselben Journalnummer 5957; die Dokumente 8, 9 und 10 wurden danach geschrieben."
"'Ew: Durchlauchten Wunsch, daß Hochdero Rechts-Sache ... nicht von der Regierung zu Posen abgeurtelt werde': the Prince's petition of 30 November.": "'Ew: Durchlauchten Wunsch, daß Hochdero Rechts-Sache ... nicht von der Regierung zu Posen abgeurtelt werde': das Bittschreiben des Fürsten vom 30. November."
"'Ad Rescriptum clementissimum vom 7ten': the rescript of 7 December to the government at Poznań.": "'Ad Rescriptum clementissimum vom 7ten': das Reskript vom 7. Dezember an die Regierung in Poznań (Posen)."
"'es kann folglich das obangezogene Rescript keine Anwendung finden': the rescript of 7 December to the government at Warsaw.": "'es kann folglich das obangezogene Rescript keine Anwendung finden': das Reskript vom 7. Dezember an die Regierung in Warschau."
"Tells the Prince that the order announced on 7 December came too late for the first instance.": "Teilt dem Fürsten mit, dass die am 7. Dezember angekündigte Verfügung für die erste Instanz zu spät kam."
"Weigel replies 'auf die hohe Eröffnung vom 22 v. M. No. 59607/938', the minister's letter of 22 September 1830.": "Weigel antwortet 'auf die hohe Eröffnung vom 22 v. M. No. 59607/938', das Schreiben des Ministers vom 22. September 1830."
"The minister answers the papers Weigel sent 'przy swem podaniu daty 14 Oktobra 1830', with his letter of 14 October.": "Der Minister antwortet auf die Unterlagen, die Weigel 'przy swem podaniu daty 14 Oktobra 1830' sandte, mit seinem Schreiben vom 14. Oktober."
"The resolution says her case 'do Nas przez N° Cesarza został odesłany' (was referred to us by the Emperor); the note on her petition to him says it was presented on 21 July by the Prince Director of War, by the Emperor's order.": "Der Beschluss sagt, ihre Sache sei 'do Nas przez N° Cesarza został odesłany' (uns vom Kaiser überwiesen worden); der Vermerk auf ihrer Bittschrift an ihn besagt, sie sei am 21. Juli vom Fürsten, dem Kriegsdirektor, auf Befehl des Kaisers vorgelegt worden."
"'w Dekrecie Kommissyi Rządzącey wydanym dnia 21 Lipca a. c.': the commission's resolution of 21 July.": "'w Dekrecie Kommissyi Rządzącey wydanym dnia 21 Lipca a. c.': der Beschluss der Kommission vom 21. Juli."
"Extends to three further owners the Emperor's decree of 5 June 1807 for Wybicki ('Wyrok N° Cesarza JW° Wybickiemu służący'), whose execution document 1 orders.": "Dehnt das Dekret des Kaisers vom 5. Juni 1807 für Wybicki ('Wyrok N° Cesarza JW° Wybickiemu służący'), dessen Ausführung Dokument 1 anordnet, auf drei weitere Eigentümer aus."
"The contract calls Triebenfeld 'durch beiliegende Vollmacht legitimiert'; the court certified this copy of the power of attorney on 21 March 1806, the day it engrossed the contract.": "Der Vertrag nennt Triebenfeld 'durch beiliegende Vollmacht legitimiert'; das Gericht beglaubigte diese Abschrift der Vollmacht am 21. März 1806, dem Tag, an dem es den Vertrag ausfertigte."
"Copied between the power of attorney and the contract. The consent allows the parcelling of the manor farm of Drzewce, a hundred Hufen of whose forest the contract lets.": "Zwischen der Vollmacht und dem Vertrag abgeschrieben. Der Konsens erlaubt die Parzellierung des Vorwerks Drzewce, von dessen Wald der Vertrag hundert Hufen austut."
"Triebenfeld acknowledges 'das unterm 28. Januar a. c. ausgestellte Obligations- und respective Cessions-Instrument' a second time, before the court at Kalisz.": "Triebenfeld erkennt 'das unterm 28. Januar a. c. ausgestellte Obligations- und respective Cessions-Instrument' ein zweites Mal an, vor dem Gericht in Kalisch."
"The certificate records, 'ad No 2', the 50,000 Rthl pledged to the Invalids' Fund 'gemäß der darüber sub dato Berlin, den 28. Januar 1805. ausgestellten Urkunde'.": "Der Schein verzeichnet 'ad No 2' die der Invalidenkasse verpfändeten 50.000 Rthl 'gemäß der darüber sub dato Berlin, den 28. Januar 1805. ausgestellten Urkunde'."
"'in Abschrift mitzutheilen, was der Königl. Resident Graf von Cattaneo zu Venedig ... einberichtet hat': document 2 is the extract that was copied for the three ministers.": "'in Abschrift mitzutheilen, was der Königl. Resident Graf von Cattaneo zu Venedig ... einberichtet hat': Dokument 2 ist der Auszug, der für die drei Minister abgeschrieben wurde."
"Schrötter thanks the department for 'die mir unterm 11ten huj: beliebigst mitgetheilte ... Nachricht'; the department marked his letter 'N 5 d 11 Jan', the number of its draft.": "Schrötter dankt dem Departement für 'die mir unterm 11ten huj: beliebigst mitgetheilte ... Nachricht'; das Departement vermerkte auf seinem Schreiben 'N 5 d 11 Jan', die Nummer seines Konzepts."
"The sitting opened at Konin on the Monday after Trinity Sunday 1763 (30 May). Its heading is on leaf 638, which is not among the scans; the entry itself has no date.": "Die Sitzung begann in Konin am Montag nach Trinitatis 1763 (30. Mai). Ihre Überschrift steht auf Blatt 638, das nicht unter den Aufnahmen ist; der Eintrag selbst trägt kein Datum."
"The sitting opened at Konin on the Monday after the octave of Corpus Christi 1644 (6 June). Its heading is on leaf 612, which is not among the scans; the entry itself has no date.": "Die Sitzung begann in Konin am Montag nach der Oktav von Fronleichnam 1644 (6. Juni). Ihre Überschrift steht auf Blatt 612, das nicht unter den Aufnahmen ist; der Eintrag selbst trägt kein Datum."
"The boundary decree of 1775 (APP 53/17/0/-/Konin Gr.145) cites the four decrees of this sitting on the flooding as given at Konin on the Monday before St Vitus 1589, which was 12 June. The heading of the sitting is on leaf 2, which is not among the scans; the entry itself has no date.": "Das Grenzdekret von 1775 (APP 53/17/0/-/Konin Gr.145) führt die vier Dekrete dieser Sitzung über die Überschwemmung als in Konin am Montag vor St. Vitus 1589 ergangen an, dem 12. Juni. Die Überschrift der Sitzung steht auf Blatt 2, das nicht unter den Aufnahmen ist; der Eintrag selbst trägt kein Datum."

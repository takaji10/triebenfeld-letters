"The heading of the sitting, on p. 2 (shown above the text), opens the land court's term at Konin on the Friday before St Vitus 1589, 9 June. The boundary decree of 1775 (APP 53/17/0/-/Konin Gr.145) cites the four decrees of this sitting on the flooding as given at Konin on the Monday before St Vitus, 12 June. The entry itself has no date.": "Die Überschrift der Sitzung, auf S. 2 (über dem Text), eröffnet die Gerichtszeit des Landgerichts in Konin am Freitag vor St. Veit 1589, dem 9. Juni. Das Grenzdekret von 1775 (APP 53/17/0/-/Konin Gr.145) führt die vier Dekrete dieser Sitzung über die Überschwemmung als in Konin am Montag vor St. Veit, dem 12. Juni, ergangen an. Der Eintrag selbst hat kein Datum."

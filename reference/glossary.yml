    The fixed income owed from an estate to a church foundation or its clergy.
    Estates that had been church property passed to the Prince with the duty
    to keep paying it. It has nothing to do with ability.
  short_de: >-
    Die festen Einkünfte, die ein Gut einer kirchlichen Stiftung oder ihren
    Geistlichen schuldete. Güter aus Kirchenbesitz gingen an den Fürsten mit

  short_de: >-
    Die Kriegs- und Domänenkammer, die Behörde, die eine preußische Provinz
    verwaltete: Steuern, Domänen, Siedlung und Polizei. Die südpreußischen
    Kammern saßen in Posen und in Petrikau, später in Kalisch. 1808 traten
    die „Regierungen“ an ihre Stelle.
  check_against: Acta Borussica; Krünitz
  checked: false

- id: kriegsrath
  per: document
  kind: law
  lang: de
  head_en: Councillor of War
  head_de: Kriegsrath

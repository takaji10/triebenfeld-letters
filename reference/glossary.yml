  short_de: >-
    Ein polnischer Gerichtsbeamter, der im Herzogtum Warschau Ladungen
    zustellte und Urteile, Pfändungen und Versteigerungen vollstreckte. An den
    älteren polnischen Gerichten vermaß der Komornik auch Grenzen.
  check_against: Gloger, Encyklopedia staropolska (komornik)
  checked: false

- id: prefect
  kind: law
  lang: de_fr
  head_en: prefect, sub-prefect
  head_de: Präfekt, Unterpräfekt
  orig: Prefect, Podprefect
  match_de: '\bPr(?:ä|ae|a|e)fect\w*|\bPodpr(?:ä|ae|a|e)fect\w*'
  match_en: '\b(Sub-)?[Pp]refect\w*'
  short_en: >-
    Officials of the Duchy of Warsaw, on the French model: a prefect ran a
    department, such as Kalisz; a sub-prefect (Polish podprefekt) ran a

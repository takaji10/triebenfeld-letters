  short_de: >-
    Beamte des Herzogtums Warschau nach französischem Vorbild: ein Präfekt
    leitete ein Departement, etwa Kalisch, ein Unterpräfekt (polnisch
    podprefekt) einen Kreis darin.
  check_against: Gloger, Encyklopedia staropolska
  checked: false

- id: starost
  kind: law
  lang: pl
  head_en: starost
  head_de: Starost
  orig: Starost, Starostey
  match_de: '\bStarost\w*'
  match_en: '\bStarost\w*'
  short_en: >-
    In the old Polish Commonwealth, a nobleman who held crown lands (a
    starostwo) for life, often with judicial and police powers in the district.
    The title stayed with him as a mark of rank. Prusimski, the estates'
    former owner, was a starost.
  short_de: >-

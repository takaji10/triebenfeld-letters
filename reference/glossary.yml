# --------------------------------------------------------- events and states

- id: south-prussia
  kind: event
  lang: de
  head_en: South Prussia
  head_de: Südpreußen
  orig: Südpreußen
  match_de: '\bS(ü|ue)d ?-?Preu(ß|ss|s)\w*'
  match_en: '\bSouth Prussia\w*'
  short_en: >-
    The Prussian province made from the Polish lands taken in the partitions
    of 1793 and 1795, with Posen, Kalisch and Warsaw. It lasted until 1807.
    Trąbczyn and the Prince's other Polish estates lay in it.
  short_de: >-
    Die preußische Provinz aus den polnischen Gebieten, die in den Teilungen
    von 1793 und 1795 an Preußen fielen, mit Posen, Kalisch und Warschau. Sie
    bestand bis 1807. Trąbczyn und die anderen polnischen Güter des Fürsten
    lagen in ihr.
  long_en: >-
    Prussia took the western part of Greater Poland in the Second Partition of
    1793, and Warsaw with the lands around it in the Third, of 1795, and made
    of them the province of South Prussia. The estates of Poles who had joined
    the Kościuszko uprising of 1794 were confiscated, and in 1796 the King gave
    many of them to Prussian generals and officials; that is how Trąbczyn came
    to the Prince of Hohenlohe-Ingelfingen. The province was run on Prussian
    lines, with Chambers at Posen, Petrikau (later Kalisch) and Warsaw, and the
    Prussian mortgage book. The Polish courts were abolished in 1793 and Poles
    excluded from judicial office in 1795; in 1796 the Prussian General Law
    Code was introduced, with Polish law kept as provincial law. After
    Prussia's defeat in 1806 the province was lost, and in 1807 it became most
    of the Duchy of Warsaw.
  long_de: >-
    Preußen nahm in der Zweiten Teilung 1793 den Westen Großpolens, in der
    Dritten 1795 Warschau mit seinem Umland, und machte daraus die Provinz
    Südpreußen. Die Güter von Polen, die sich dem Kościuszko-Aufstand von 1794
    angeschlossen hatten, wurden eingezogen, und 1796 schenkte der König viele
    davon preußischen Generalen und Beamten; so kam Trąbczyn an den Fürsten zu
    Hohenlohe-Ingelfingen. Die Provinz wurde nach preußischem Muster
    verwaltet, mit Kammern in Posen, Petrikau (später Kalisch) und Warschau
    und dem preußischen Hypothekenbuch. Die polnischen Gerichte wurden 1793
    aufgehoben, Polen 1795 von Richterämtern ausgeschlossen; 1796 wurde das
    Allgemeine Landrecht eingeführt, das polnische Recht blieb als
    Provinzialrecht in Kraft. Nach der Niederlage von 1806 ging die Provinz
    verloren und wurde 1807 zum größten Teil des Herzogtums Warschau.
  source: "Szukaj w Archiwach, after T. Mencel's introduction to the inventory (reference/sources/patrimonial_courts_mencel.md) (the courts and the law)"
  check_against: a standard history of the Partitions
  checked: false

- id: duchy-of-warsaw
  kind: event
  lang: de
  head_en: Duchy of Warsaw
  head_de: Herzogtum Warschau
  orig: Herzogthum Warschau
  match_de: '\bHerzogth?um Warschau\b|\bHerzoglich Warschau\w*'
  match_en: '\bDuchy of Warsaw\b'
  short_en: >-
    The Polish state Napoleon created in 1807 from Prussia's Polish provinces,
    under the King of Saxony as Duke. It ended with Napoleon's defeat, and in
    1815 was divided between Russia and Prussia.
  short_de: >-
    Der polnische Staat, den Napoleon 1807 aus Preußens polnischen Provinzen
    schuf, mit dem König von Sachsen als Herzog. Er endete mit Napoleons
    Niederlage und wurde 1815 zwischen Russland und Preußen geteilt.
  long_en: >-
    By the Peace of Tilsit in 1807 Prussia gave up most of what it had taken
    from Poland, and Napoleon made of it the Duchy of Warsaw, with Friedrich
    August, King of Saxony, as Duke. It had a constitution, French-style
    departments under prefects, and the Code Napoléon. For the Prince, a
    Prussian general, it meant estates in a foreign state allied to France:
    sequestrations, claims by the former owners' family, and courts he could
    not influence. Russian troops occupied the Duchy in 1813, and the Congress
    of Vienna divided it, the west going back to Prussia as the Grand Duchy of
    Posen.
  long_de: >-
    Im Frieden von Tilsit 1807 gab Preußen den größten Teil seiner polnischen
    Gebiete ab, und Napoleon machte daraus das Herzogtum Warschau, mit
    Friedrich August, König von Sachsen, als Herzog. Es hatte eine Verfassung,
    Departements unter Präfekten nach französischem Muster und den Code
    Napoléon. Für den Fürsten, einen preußischen General, hieß das Güter in
    einem fremden, mit Frankreich verbündeten Staat: Sequestrationen,
    Ansprüche der Familie der früheren Besitzer und Gerichte, auf die er
    keinen Einfluss hatte. 1813 besetzten russische Truppen das Herzogtum, der
    Wiener Kongress teilte es; der Westen kam als Großherzogtum Posen an
    Preußen zurück.
  check_against: a standard history of the Duchy of Warsaw
  checked: false

- id: tilsit
  kind: event
  lang: de
  head_en: Peace of Tilsit
  head_de: Frieden von Tilsit
  orig: Tilsit
  match_de: '\bTilsit\b'
  match_en: '\bTilsit\b'
  short_en: >-
    The peace of July 1807 between Napoleon, Russia and a defeated Prussia.
    Prussia lost half its territory, including its Polish provinces, which
    became the Duchy of Warsaw.
  short_de: >-
    Der Friede vom Juli 1807 zwischen Napoleon, Russland und dem besiegten
    Preußen. Preußen verlor die Hälfte seines Gebiets, darunter seine
    polnischen Provinzen, aus denen das Herzogtum Warschau wurde.
  check_against: a standard history of the Napoleonic Wars
  checked: false

- id: congress-of-vienna
  kind: event
  lang: de
  head_en: Congress of Vienna
  head_de: Wiener Kongress
  orig: Congress
  match_de: '\bCongre(ß|ss)\w*'
  match_en: '\bCongress\b'
  short_en: >-
    The meeting of the European powers in 1814–15 that redrew the map after
    Napoleon. Triebenfeld was there for the Prince, petitioning for his lost
    Polish estates.
  short_de: >-
    Die Versammlung der europäischen Mächte 1814/15, die nach Napoleon die
    Landkarte neu ordnete. Triebenfeld war für den Fürsten dort und bemühte
    sich um dessen verlorene polnische Güter.
  long_en: >-
    From September 1814 to June 1815 the powers that had defeated Napoleon met
    in Vienna to settle Europe. The fate of the Duchy of Warsaw was among the
    hardest questions: Russia wanted it whole, Prussia wanted its Polish
    provinces back. The compromise gave most of it to Russia as the Kingdom of
    Poland and the west to Prussia as the Grand Duchy of Posen, with the
    border along the Prosna. Triebenfeld's letters from Vienna follow the
    Prince's attempt to recover his estates there, and the border question that
    decided on which side Trąbczyn would lie.
  long_de: >-
    Von September 1814 bis Juni 1815 berieten die Sieger über Napoleon in Wien
    über die Neuordnung Europas. Das Schicksal des Herzogtums Warschau gehörte
    zu den schwierigsten Fragen: Russland wollte es ganz, Preußen seine
    polnischen Provinzen zurück. Der Kompromiss gab den größten Teil als
    Königreich Polen an Russland und den Westen als Großherzogtum Posen an
    Preußen, mit der Grenze an der Prosna. Triebenfelds Briefe aus Wien
    verfolgen den Versuch des Fürsten, dort seine Güter zurückzugewinnen, und
    die Grenzfrage, die entschied, auf welcher Seite Trąbczyn liegen würde.
  check_against: a standard history of the Congress of Vienna
  checked: false

- id: partitions
  kind: event
  lang: pl
  head_en: Partitions of Poland
  head_de: Teilungen Polens
  orig: rozbiory
  short_en: >-
    The three divisions of the Polish–Lithuanian Commonwealth between Russia,
    Prussia and Austria, in 1772, 1793 and 1795, which ended its existence as
    a state. The estates in these documents came to Prussia in the second.
  short_de: >-
    Die drei Aufteilungen Polen-Litauens zwischen Russland, Preußen und
    Österreich 1772, 1793 und 1795, mit denen es als Staat zu bestehen
    aufhörte. Die Güter in diesen Dokumenten kamen mit der zweiten an
    Preußen.
  long_en: >-
    In 1772 the three neighbouring powers took a quarter of the Commonwealth's
    territory. In 1793 Russia and Prussia took more, Prussia gaining Greater
    Poland with Posen and Kalisch. After the Kościuszko uprising of 1794 was
    crushed, the third partition of 1795 divided what remained, and Prussia
    took Warsaw. The Polish nobility who had owned these lands lost them, or
    kept them under foreign rule; the confiscated estates of those who had
    risen in 1794 were what the King of Prussia gave away in 1796.
  long_de: >-
    1772 nahmen die drei Nachbarmächte ein Viertel des Staatsgebiets. 1793
    nahmen Russland und Preußen mehr, Preußen erhielt Großpolen mit Posen und
    Kalisch. Nach der Niederschlagung des Kościuszko-Aufstands von 1794 teilte
    die Dritte Teilung 1795 den Rest, und Preußen erhielt Warschau. Der
    polnische Adel, dem dieses Land gehört hatte, verlor es oder behielt es
    unter fremder Herrschaft; die eingezogenen Güter der Aufständischen von
    1794 waren es, die der König von Preußen 1796 verschenkte.
  check_against: a standard history of the Partitions
  checked: false


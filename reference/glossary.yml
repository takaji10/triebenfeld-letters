  lang: la
  head_en: title of possession (titulus possessionis)
  head_de: Titulus possessionis
  orig: Titulus possessionis, Besitztitel
  match_de: '\bTitul\w* [Pp]ossess\w*|\bBesitz[- ]?[Tt]itel\w*'
  match_en: '\btitle of possession\b|\btitul\w* possession\w*'
  short_en: >-
    An owner's title, entered on his estate's folio in the mortgage book.
    Until it was entered, the owner could not sell, mortgage or lease with
    effect; from 1795 Prussia required the title to rest on legal proof, so
    entering the Prince's title took years of papers.
  short_de: >-
    Der Besitztitel eines Eigentümers, auf dem Blatt seines Guts im
    Hypothekenbuch eingetragen. Ohne Eintragung konnte er nicht wirksam
    verkaufen, belasten oder verpachten; seit 1795 verlangte Preußen, dass der

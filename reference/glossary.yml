  short_de: >-
    In einer preußischen Stadt der Bürgermeister, der für das Stadtgericht
    zuständig war, im Unterschied zum Polizeibürgermeister. Er musste ein
    ausgebildeter Jurist sein.
  check_against: Acta Borussica
  checked: false

- id: komornik
  kind: law
  lang: pl
  head_en: komornik
  head_de: Komornik
  orig: Komornik
  match_de: '\bKomornik\w*'
  match_en: '\bkomorniks?\b'
  short_en: >-
    A Polish court officer, who in the Duchy of Warsaw served writs and carried

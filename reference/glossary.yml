# The reader's glossary: words in the documents that a reader who is interested
# but not an expert cannot be expected to know. Shown on /glossary/ and
# /de/glossar/, and as definitions on the document pages. Plan and rules:
# docs/GLOSSARY_PLAN.md. Hand-written; nothing regenerates it.
#
# One entry is one concept with two faces:
#   id          the address on the glossary page (/glossary/#id); never change
#   kind        money | land | law | title | phrase | event
#   lang        the language of the word in the original: de, la, fr, pl;
#               de_la, de_fr for a German word taken from Latin or French
#               (Sequestration, Revers), as against Latin written as Latin
#   head_en     the English headword, as the English page lists it
#   head_de     the German headword, as the German page lists it
#   orig        the word as the documents write it, shown beside the English
#               headword ("German: Vorwerk")
#   match_de    where it is underlined in the transcription and reading text.
#               A pattern, or a list of them. Where a pattern has a group
#               named `w`, only that group is underlined
#   match_en    where it is underlined in the English translation. Left out
#               where the English is plain enough on its own, or would match
#               ordinary English words
#               Both are case-sensitive regular expressions, searched one
#               manuscript page at a time; the first hit on a page is marked.
#   short_en, short_de   two or three sentences, written separately for each
#               language, not translated one from the other
#   long_en, long_de     events only: a paragraph for the glossary page
#   per         `document` marks the first hit in a document only, not on
#               every page: for formulas and units met on nearly every page
#   check_against        the reference work the entry is to be checked against
#   checked     false until it has been. The glossary page says so.
#
# `excluded:` at the end records words ruled out, with the reason, so that
# glossary_candidates.py does not raise them again.
#
# First batch, 2026-10-02: drafted without access to the reference works (the
# environment could not reach them), so every entry is `checked: false`.

entries:

# ------------------------------------------------------------ money, measures

- id: reichsthaler
  per: document
  kind: money
  lang: de
  head_en: Reichsthaler
  head_de: Reichsthaler
  orig: Rthl, rt.
  match_de: '\bRthl\b|\bRthlr\b|\bReichsthaler\w*|\brt\b'
  match_en: '\bRthl\b|\bReichsthaler\w*'
  short_en: >-
    The Prussian unit of account, a silver thaler, written Rthl or rt. It was
    divided into 24 Groschen of 12 Pfennig each. Nearly every sum in the
    letters is reckoned in it.
  short_de: >-
    Die preußische Rechnungseinheit, ein Silbertaler, abgekürzt Rthl oder rt.
    Er galt 24 Groschen zu je 12 Pfennig. Fast jede Summe in den Briefen ist in
    ihm gerechnet.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: courant
  per: document
  kind: money
  lang: de
  head_en: Courant
  head_de: Courant
  orig: Courant
  match_de: '\bCourant\b'
  match_en: '\bCourant\b'
  short_en: >-
    Payment in the silver coin in everyday circulation, as against gold. A sum
    "in Courant" was paid in silver thalers; a sum "in Gold" in gold coin, worth
    more. The letters keep the two strictly apart.
  short_de: >-
    Zahlung in der umlaufenden Silbermünze, im Gegensatz zum Gold. Eine Summe
    „in Courant“ wurde in Silbertalern gezahlt, eine „in Gold“ in den
    höherwertigen Goldmünzen. Die Briefe halten beides streng auseinander.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: groschen
  per: document
  kind: money
  lang: de
  head_en: Groschen
  head_de: Groschen
  orig: Groschen, g.
  match_de: '\bGroschen\b|\bgr\b'
  match_en: '\bGroschen\b'
  short_en: >-
    A silver coin and unit worth one twenty-fourth of a Reichsthaler, and
    divided into 12 Pfennig. Sums are written in three columns: thalers,
    Groschen, Pfennig.
  short_de: >-
    Silbermünze und Rechnungseinheit, der vierundzwanzigste Teil eines
    Reichsthalers, unterteilt in 12 Pfennig. Summen stehen in drei Spalten:
    Taler, Groschen, Pfennig.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: friedrich-dor
  kind: money
  lang: de_fr
  head_en: Friedrich d'or
  head_de: Friedrichsdor
  orig: "Fr. d'or, fr d'or, f. d'or"
  match_de: "\\b(?:Friedrichs?|Fr|fr|F|f)\\.? ?d['’]or\\b"
  match_en: "\\b(?:Friedrichs?|Fr|fr|F|f)\\.? ?d['’]or\\b"
  short_en: >-
    The Prussian gold coin, written Fr. d'or, worth five Reichsthaler in gold
    and rather more in silver Courant, at a rate that moved. Sums "in Gold"
    were reckoned in it; it was the coin of savings, large payments and
    travel.
  short_de: >-
    Die preußische Goldmünze, abgekürzt Fr. d'or, fünf Reichsthaler in Gold
    wert und etwas mehr in Silbercourant, zu wechselndem Kurs. Summen „in
    Gold“ wurden in ihr gerechnet; sie war die Münze der Ersparnisse, großer
    Zahlungen und der Reise.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: pfennig
  kind: money
  lang: de
  head_en: Pfennig
  head_de: Pfennig
  orig: Pfennig, d.
  match_de: '\bPfennig\w*'
  match_en: '\bPfennig\w*'
  short_en: >-
    The smallest unit: a twelfth of a Groschen. It is often written d., from
    the Latin denarius, as the English penny was.
  short_de: >-
    Die kleinste Einheit, der zwölfte Teil eines Groschens. Oft d. abgekürzt,
    nach dem lateinischen denarius.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: ducat
  kind: money
  lang: de
  head_en: ducat
  head_de: Dukaten
  orig: Ducaten
  match_de: '\bDucaten\b|\bDukaten\b'
  match_en: '\bducats?\b'
  short_en: >-
    A gold coin of standard weight, current across central Europe, and the
    money of large payments and of travel. In Vienna in 1814–15 the letters
    count expenses in ducats and gulden.
  short_de: >-
    Eine Goldmünze von festem Gewicht, in ganz Mitteleuropa gängig, das Geld
    großer Zahlungen und der Reise. In Wien 1814/15 rechnen die Briefe in
    Dukaten und Gulden.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: gulden
  kind: money
  lang: de
  head_en: gulden
  head_de: Gulden
  orig: Gulden, fl.
  match_de: '\bGulden\b'
  match_en: '\bgulden\b'
  short_en: >-
    The Austrian florin, written fl. It is the currency of the letters from the
    Congress of Vienna, where the Prince's agent paid his way in it.
  short_de: >-
    Der österreichische Gulden, abgekürzt fl. Die Währung der Briefe vom Wiener
    Kongress, in der der Beauftragte des Fürsten dort seine Ausgaben bestritt.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: morgen
  kind: money
  lang: de
  head_en: Morgen
  head_de: Morgen
  orig: Morgen
  # as a measure only: after a figure or a measure word. "Morgen eile ich"
  # is tomorrow
  match_de: '(?:\d[\d.,/]*\s*|hundert\s+|Magdeburger\s+|[Kk]ulmische?n?\s+|preu(?:ß|ss)ische?n?\s+)(?P<w>Morgen)\b'
  match_en: '\bMorgen\b'
  short_en: >-
    A measure of land, originally what a team could plough in a morning. The
    Prussian (Magdeburg) Morgen was about a quarter of a hectare; other Morgen
    were larger, so a document often names the one it means.
  short_de: >-
    Ein Flächenmaß, ursprünglich das, was ein Gespann an einem Vormittag
    pflügen konnte. Der preußische (Magdeburger) Morgen maß etwa einen
    Viertelhektar; andere Morgen waren größer, weshalb ein Dokument oft angibt,
    welcher gemeint ist.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: hufe
  kind: money
  lang: de
  head_en: Hufe
  head_de: Hufe
  orig: Hufe, Hufen
  match_de: '\bHufen?\b'
  match_en: '\bHufen?\b'
  short_en: >-
    A farm holding and a measure of land: the arable one household could live
    on. Its size varied; the Kulm Hufe usual in this region, the Polish włóka,
    was about 17 hectares. Settlers on the estates were let land by the Hufe.
  short_de: >-
    Ein Bauernhof und zugleich ein Flächenmaß: das Ackerland, von dem ein
    Haushalt leben konnte. Die Größe schwankte; die hier übliche kulmische
    Hufe, polnisch włóka, maß etwa 17 Hektar. Den Siedlern auf den Gütern wurde
    Land nach Hufen ausgetan.
  check_against: Krünitz, Oekonomische Encyklopädie; Gloger, Encyklopedia staropolska (włóka)
  checked: false

# ------------------------------------------------------------ land and tenure

- id: vorwerk
  kind: land
  lang: de
  head_en: demesne farm
  head_de: Vorwerk
  orig: Vorwerk
  match_de: '\bVorwer(k|ck)\w*'
  match_en: '\bdemesne farms?\b'
  short_en: >-
    A farm belonging to the manor itself and run for the lord, worked largely
    by the labour the peasants owed him. Polish folwark. An estate usually had
    several.
  short_de: >-
    Ein Wirtschaftshof, der dem Gut selbst gehörte und für die Herrschaft
    bewirtschaftet wurde, großenteils mit den Diensten, die die Bauern
    schuldeten. Polnisch folwark. Ein Gut hatte meist mehrere.
  check_against: Krünitz, Oekonomische Encyklopädie; Gloger, Encyklopedia staropolska (folwark)
  checked: false

- id: erbpacht
  kind: land
  lang: de
  head_en: hereditary lease
  head_de: Erbpacht
  orig: Erbpacht
  match_de: '\bErbpacht\w*|\bErb-Pacht\w*'
  match_en: '\bhereditary[- ]lease\w*'
  short_en: >-
    A lease that passed to the tenant's heirs and could be sold. The tenant
    paid a sum on entry and then a fixed yearly rent, the canon, for ever; the
    lord kept the ownership. It was the Prince's main way of turning land into
    money.
  short_de: >-
    Eine Pacht, die auf die Erben überging und verkauft werden konnte. Der
    Pächter zahlte beim Antritt eine Summe und danach für immer einen festen
    jährlichen Zins, den Canon; das Eigentum blieb beim Grundherrn. Für den
    Fürsten der wichtigste Weg, Land zu Geld zu machen.
  check_against: Allgemeines Landrecht 1794, Teil I Titel 18; Krünitz
  checked: false

- id: canon
  kind: land
  lang: de_la
  head_en: canon
  head_de: Canon
  orig: Canon
  match_de: '\bCanons?\b|\bKanon\b'
  match_en: '\bcanon\b'
  short_en: >-
    The fixed yearly rent paid under a hereditary lease. Nothing to do with the
    church: it is a sum of money, set once in the contract and never raised.
  short_de: >-
    Der feste jährliche Zins aus einer Erbpacht. Mit der Kirche hat er nichts
    zu tun: eine Geldsumme, einmal im Vertrag festgesetzt und nie erhöht.
  check_against: Allgemeines Landrecht 1794; Krünitz
  checked: false

- id: erbzins
  kind: land
  lang: de
  head_en: quit-rent
  head_de: Erbzins
  orig: Erbzins
  match_de: '\bErbzins\w*|\bErbzinß\w*'
  match_en: '\bquit-rents?\b'
  short_en: >-
    A fixed yearly rent owed for land held by inheritance, in place of labour
    or other services. Unlike a lease rent, it bound the land itself, whoever
    held it.
  short_de: >-
    Ein fester jährlicher Zins für erblich besessenes Land, an Stelle von
    Diensten oder anderen Leistungen. Anders als ein Pachtzins haftete er am
    Grundstück selbst, gleich wer es besaß.
  check_against: Allgemeines Landrecht 1794; Krünitz
  checked: false

- id: laudemium
  kind: land
  lang: de_la
  head_en: Laudemium
  head_de: Laudemium
  orig: Laudemium
  match_de: '\bLaudemi\w*'
  match_en: '\bLaudemium\b|\btransfer fees?\b'
  short_en: >-
    A fee paid to the lord whenever a hereditary holding changed hands, by sale
    or inheritance, usually a fixed share of its value.
  short_de: >-
    Eine Abgabe an den Grundherrn, sobald ein erblicher Besitz den Inhaber
    wechselte, durch Verkauf oder Erbgang, meist ein fester Anteil an seinem
    Wert.
  check_against: Allgemeines Landrecht 1794; Krünitz
  checked: false

- id: propination
  kind: land
  lang: de_la
  head_en: propination
  head_de: Propination
  orig: Propination
  match_de: '\bPropination\w*'
  match_en: '\bpropination\b'
  short_en: >-
    The lord's monopoly of brewing, distilling and selling drink on his estate,
    a right of the Polish nobility (propinacja). It was usually let to an
    innkeeper and was among an estate's most valuable incomes.
  short_de: >-
    Das Recht des Grundherrn, auf seinem Gut allein Bier zu brauen, Branntwein
    zu brennen und Getränke zu verkaufen, ein Vorrecht des polnischen Adels
    (propinacja). Meist an einen Krüger verpachtet und eine der
    einträglichsten Einnahmen eines Guts.
  check_against: Gloger, Encyklopedia staropolska (propinacja)
  checked: false

- id: majorat
  kind: land
  lang: de
  head_en: entail
  head_de: Majorat
  orig: Majorat
  match_de: '\bMajorat\w*'
  match_en: '\bentail\w*'
  short_en: >-
    An estate settled so that it passed whole to the eldest heir and could not
    be sold or divided. In 1805 the Prince bound his Silesian and South
    Prussian estates in this way.
  short_de: >-
    Ein Besitz, der ungeteilt an den ältesten Erben fiel und weder verkauft
    noch geteilt werden durfte. 1805 band der Fürst seine schlesischen und
    südpreußischen Güter auf diese Weise.
  check_against: Allgemeines Landrecht 1794, Teil II Titel 4
  checked: false

- id: dominium
  kind: land
  lang: la
  head_en: Dominium
  head_de: Dominium
  orig: Dominium
  match_de: '\bDominium\b|\bDominio\b'
  match_en: '\bDominium\b|\bmanorial lordship\b'
  short_en: >-
    The manor as a legal person: the lord's estate together with his rights
    over the villages and peasants on it. A document addressed to "the
    Dominium" is addressed to the manor and whoever runs it.
  short_de: >-
    Das Gut als Rechtsperson: der Besitz des Grundherrn samt seinen Rechten
    über die Dörfer und Bauern darauf. Ein Schreiben „an das Dominium“ geht an
    das Gut und an den, der es verwaltet.
  check_against: Allgemeines Landrecht 1794; Krünitz
  checked: false

- id: herrschaft
  kind: land
  lang: de
  head_en: lordship
  head_de: Herrschaft
  orig: Herrschaft
  match_de: '\bHerrschaft\b|\bHerrschafft\b'
  short_en: >-
    An estate made up of several villages and farms under one lord, with his
    rights over them: "the lordship of Betsche" is a territory. Paid "to the
    Herrschaft", money goes to the lord or the estate's management.
  short_de: >-
    Ein Besitz aus mehreren Dörfern und Höfen unter einem Grundherrn, samt
    seinen Rechten darüber: „die Herrschaft Betsche“ ist ein Gebiet. Was „an
    die Herrschaft“ gezahlt wird, geht an den Grundherrn oder die
    Gutsverwaltung.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: unterthanen
  kind: land
  lang: de
  head_en: subjects (Unterthanen)
  head_de: Unterthanen
  orig: Unterthanen
  match_de: '\bUnterthan\w*'
  short_en: >-
    The peasants of a manor: bound to its lord, owing him labour and dues, and
    under his court. In these documents the word means them, not the subjects
    of a king.
  short_de: >-
    Die Bauern eines Guts: an ihren Grundherrn gebunden, ihm zu Diensten und
    Abgaben verpflichtet und seinem Gericht unterstellt. In diesen Dokumenten
    sind sie gemeint, nicht die Untertanen eines Königs.
  check_against: Allgemeines Landrecht 1794, Teil II Titel 7
  checked: false

- id: dismembration
  kind: land
  lang: de_la
  head_en: dismemberment
  head_de: Dismembration
  orig: Dismembration
  match_de: '\bDismembr\w*'
  match_en: '\bdismember\w*'
  short_en: >-
    The breaking-up of an estate into separate holdings to be sold or let. In
    Prussia it needed the state's consent, which is why the Prince's plans for
    his estates waited on ministers.
  short_de: >-
    Die Zerschlagung eines Guts in einzelne Stellen, die verkauft oder
    verpachtet werden. In Preußen bedurfte sie der staatlichen Genehmigung;
    deshalb warteten die Pläne des Fürsten für seine Güter auf die Minister.
  check_against: Krünitz, Oekonomische Encyklopädie
  checked: false

- id: haulaender
  kind: land
  lang: de
  head_en: Hollanders (Olęders)
  head_de: Hauländer (Olędrzy)
  orig: Hauländer, Holländer
  match_de: '\bHaul(ä|ae)nd\w*|\bHoll(ä|ae)nder\w*|\bOl(ę|e)d\w*'
  match_en: '\bHollanders?\b|\bOl(ę|e)d\w*'
  short_en: >-
    Settlers holding land under "Dutch law": personally free, with long or
    hereditary leases and their own village self-government, in return for
    clearing and farming land. The first were Dutch Mennonites; in Greater
    Poland most were Germans. Trąbczyn's colonies were of this kind.
  short_de: >-
    Siedler, die Land nach „holländischem Recht“ besaßen: persönlich frei, mit
    langen oder erblichen Pachten und eigener Dorfverwaltung, gegen Rodung und
    Bewirtschaftung. Die ersten waren niederländische Mennoniten, in
    Großpolen meist Deutsche. Auch die Kolonien von Trąbczyn waren solche.
  check_against: Gloger, Encyklopedia staropolska (olędrzy)
  checked: false

- id: schulze
  kind: land
  lang: de
  head_en: village mayor (Schulze)
  head_de: Schulze
  orig: Schulze, Scholtisey
  # with an article, or as Freyschulze: Schulze is also a surname (Geh.
  # Finanzrat Schulze)
  match_de: '\b(?:der|den|dem|des|die|Dorf) (?P<w>Schul(?:t)?zen?)\b|\bScholtis\w*|\bFrey[- ]?[Ss]chul\w*'
  match_en: '\bvillage mayors?\b'
  short_en: >-
    The head of a village, answerable to the lord for its dues and order, and
    judge in small matters; Polish sołtys. A free Schulze held the office and
    its land by inheritance, free of dues. His holding is the Scholtisey.
  short_de: >-
    Das Oberhaupt eines Dorfes, dem Grundherrn für Abgaben und Ordnung
    verantwortlich und Richter in kleinen Sachen; polnisch sołtys. Ein
    Freischulze besaß Amt und Land erblich und abgabenfrei. Sein Hof ist die
    Scholtisey.
  check_against: Gloger, Encyklopedia staropolska (sołtys); Krünitz
  checked: false

# ------------------------------------------------- law, money, administration

- id: sequestration
  kind: law
  lang: de_la
  head_en: sequestration
  head_de: Sequestration
  orig: Sequestration
  match_de: '\bSequest\w*'
  match_en: '\bsequest\w*'
  short_en: >-
    The seizure of an estate by order of a court: an administrator, the
    sequestrator, runs it and pays its income to the creditors until the debts
    are settled. The owner keeps the title but loses the use.
  short_de: >-
    Die gerichtlich angeordnete Beschlagnahme eines Guts: ein Verwalter, der
    Sequester, bewirtschaftet es und zahlt die Einkünfte an die Gläubiger, bis
    die Schulden getilgt sind. Der Eigentümer behält den Titel, verliert aber
    die Nutzung.
  check_against: Allgemeines Landrecht 1794; Krünitz
  checked: false

- id: execution
  kind: law
  lang: de_la
  head_en: execution
  head_de: Execution
  orig: Execution
  match_de: '\bExecution\w*|\bExekution\w*'
  match_en: '\bexecution\w*'
  short_en: >-
    Enforcement of a judgment or a debt by the authorities: seizing goods,
    quartering soldiers on the debtor, or selling his property. It never means
    putting anyone to death in these letters.
  short_de: >-
    Die Vollstreckung eines Urteils oder einer Schuld durch die Behörden:
    Pfändung, Einquartierung beim Schuldner oder Verkauf seines Besitzes. Eine
    Hinrichtung ist in diesen Briefen nie gemeint.
  check_against: Allgemeines Landrecht 1794; Adelung
  checked: false

- id: intressen
  kind: law
  lang: de
  head_en: interest (Intressen)
  head_de: Intressen
  orig: Intressen, Interessen
  match_de: '\bIntressen\b|\bInteressen\b'
  short_en: >-
    Interest on borrowed money. "The Intressen" are the yearly payments on a
    debt, not anyone's interests or concerns.
  short_de: >-
    Zinsen auf geliehenes Geld. „Die Intressen“ sind die jährlichen Zahlungen
    auf eine Schuld, nicht die Belange von jemandem.
  check_against: Adelung
  checked: false

- id: resignation
  kind: law
  lang: de_la
  head_en: resignation
  head_de: Resignation
  orig: Resignation
  match_de: '\bResignation\w*'
  # the deed only: "with all resignation" is patience
  match_en: '\b(?P<w>[Rr]esignation)\s+(?:of|brief|deed|letter)\b'
  short_en: >-
    The formal surrender of property to a new owner, made before a court. A
    Resignationsbrief is the deed that conveys an estate. Nobody is leaving a
    post.
  short_de: >-
    Die förmliche Übertragung von Besitz an einen neuen Eigentümer vor
    Gericht. Ein Resignationsbrief ist die Urkunde, durch die ein Gut übergeht.
    Ein Amt wird dabei nicht niedergelegt.
  check_against: Allgemeines Landrecht 1794; Krünitz
  checked: false

- id: vollmacht
  kind: law
  lang: de
  head_en: power of attorney
  head_de: Vollmacht
  orig: Vollmacht
  match_de: '\bVollmacht\w*'
  short_en: >-
    A written authority to act for someone in law: to sue, collect, sign or
    sell in their name. A general power of attorney covered all their affairs.
  short_de: >-
    Eine schriftliche Ermächtigung, rechtlich für jemanden zu handeln: in
    seinem Namen zu klagen, einzuziehen, zu unterschreiben oder zu verkaufen.
    Eine Generalvollmacht umfasste alle seine Angelegenheiten.
  check_against: Allgemeines Landrecht 1794, Teil I Titel 13
  checked: false

- id: bevollmaechtigter
  kind: law
  lang: de
  head_en: plenipotentiary
  head_de: Bevollmächtigter
  orig: Bevollmächtigter, Mandatarius
  match_de: '\bBevollm(ä|ae)chtigte\w*|\bMandatari\w*'
  match_en: '\bplenipotentiar\w*'
  short_en: >-
    Someone acting for another under a power of attorney. Triebenfeld was the
    Prince's general plenipotentiary for his estates in the east. Mandatarius
    is the Latin word for the same.
  short_de: >-
    Wer kraft einer Vollmacht für einen anderen handelt. Triebenfeld war der
    Generalbevollmächtigte des Fürsten für seine Güter im Osten. Mandatarius
    ist das lateinische Wort dafür.

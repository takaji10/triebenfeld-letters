    kostete Jahre an Papieren.
  source: "Szukaj w Archiwach, after T. Mencel's introduction to the inventory (reference/sources/patrimonial_courts_mencel.md), for the rule of 1795"
  check_against: Allgemeine Hypothekenordnung 1783
  checked: false

- id: abstand
  kind: land
  lang: la
  head_en: Quantum, Abstands-Quantum

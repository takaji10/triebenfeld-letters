    engaged to have the Prince's title entered in the mortgage book.
  short_de: >-
    Ein preußischer Jurist, zugelassen, Parteien vor Gericht zu vertreten und
    ihre Urkunden aufzusetzen, ein Anwalt; viele waren zugleich Notare. Einer
    wurde beauftragt, den Besitztitel des Fürsten im Hypothekenbuch eintragen
    zu lassen.
  check_against: Allgemeine Gerichtsordnung 1793
  checked: false


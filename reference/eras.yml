# The eras this archive is organised by.
#
# An era is an EDITORIAL ASSIGNMENT, never derived from a document's date. A
# document belongs to the era whose story it is evidence for, and the two part
# company constantly: 196 of the 348 documents published so far are dated 1808
# or later, after the Hohenlohe ownership had ended, because the dispute
# outlived the possession. Sorting those by date would scatter them across eras
# they have nothing to do with.
#
# A copy belongs to the time of what it copies, not to when it was copied or
# the holding it is kept in (the editor, 2026-10-14: "a copy of an 1828
# document from 1939 should not belong to the 20th century"). A copy carries
# its original's date, and its era is that of its original: Albert Breyer's
# copies of the tables of 1868 stand with Włodzimierz Miączyński's years,
# his own notes of 1936 in the twentieth century (53/968/0/-/716, set per
# document under `documents: era:` in its rulings). Where a copy and the
# copyist's own notes share a page, they are two documents.
#
# So no date appears in this file. Each era's span is COMPUTED from the
# documents assigned to it and written into site/_data/eras.yml at build time,
# which means it corrects itself when a holding is added. `ownership` below is
# prose about the estate, not a filter: it says when the owners held the place,
# which is a different question from when the papers were written.
#
# `order` is the reading order, and it is what the timeline and the story index
# sort by - not the dates, for the same reason.
#
# `status: unpopulated` renders the era as named and not yet written rather than
# hiding it. The archive says it covers three centuries; a reader is owed a
# straight answer about which part of that is here.

eras:
  # A working name until the editor names it (the editor, 2026-10-16: a new
  # era for the Kodeks Dyplomatyczny Wielkopolski). Its one holding is kdw,
  # twenty-one entries of 1173 to 1440.
  medieval:
    order: 0
    status: populated
    label_en: "Trąbczyn in the Middle Ages"
    label_de: "Trąbczyn im Mittelalter"
    ownership_en: "The Cistercian abbey of Ląd, which held the villages around
      Trąbczyn, and the knights who held Trąbczyn itself. 1173 to 1440"
    ownership_de: "Das Zisterzienserkloster Ląd, dem die Dörfer um Trąbczyn
      gehörten, und die Ritter, denen Trąbczyn selbst gehörte. 1173 bis 1440"
    blurb_en: >-
      Twenty-one medieval charters from the printed edition of the documents of
      Greater Poland, the Kodeks Dyplomatyczny Wielkopolski: the gifts, tithes
      and exchanges by which the abbey of Ląd came to hold Wrąbczynek, Kopojno,
      Zagórów and the tithe of Trąbczyn, the founding of the town of Zagórów in
      1407, the gift of Trąbczyn to Count Mikołaj in 1276, and the knights and
      heirs of Trąbczyn in lawsuits and deeds to 1434.
    blurb_de: >-
      Einundzwanzig mittelalterliche Urkunden aus der gedruckten Edition der
      großpolnischen Urkunden, dem Kodeks Dyplomatyczny Wielkopolski: die
      Schenkungen, Zehnten und Tauschgeschäfte, durch die das Kloster Ląd
      Wrąbczynek, Kopojno, Zagórów und den Zehnten von Trąbczyn erwarb, die
      Gründung der Stadt Zagórów 1407, die Schenkung Trąbczyns an den Grafen
      Mikołaj 1276 und die Ritter und Erben von Trąbczyn in Prozessen und
      Urkunden bis 1434.

  prusimski-boundary:
    order: 1
    status: populated
    label_en: "The Trąbczyn and Łukom boundary dispute"
    label_de: "Der Grenzstreit zwischen Trąbczyn und Łukom"
    ownership_en: "The Prusimski family, who held Trąbczyn, against the Chełmski
      family of Łukom next door. c. 1589 to 1788"
    ownership_de: "Die Familie Prusimski, der Trąbczyn gehörte, gegen die Familie
      Chełmski im benachbarten Łukom. ca. 1589 bis 1788"
    blurb_en: >-
      Two hundred years of argument between neighbouring estates over where one
      ended and the other began: mounds, blazed trees, a disputed pond-ground,
      and the Olęder settlement that was annexed along with the land it stood
      on. Twenty-four holdings are here: court orders and judgments from
      1589 on, the decree of the commission of 1775, the entries of the Konin
      and Kalisz court registers that follow the quarrel from 1754 to 1788,
      the decree of 1782 by which the Crown Tribunal settled the boundary, a
      newspaper report of 1754 on the funeral of Paweł Prusimski; and,
      from the last years before the partition, a hearth-tax register of 1789,
      the visitation of the parish of Trąbczyn of 1791, and the table of the
      parish's hearths and dues on a page of the Pyzdry court register of
      1791 to 1792.
    blurb_de: >-
      Zweihundert Jahre Streit zwischen benachbarten Gütern darüber, wo das eine
      endete und das andere begann. Vierundzwanzig Bestände liegen vor: gerichtliche
      Anordnungen und Urteile seit 1589, das Dekret der Kommission von 1775,
      die Einträge der Gerichtsregister von Konin und Kalisch, die dem Streit
      von 1754 bis 1788 folgen, das Dekret von 1782, mit dem das
      Krontribunal die Grenze festlegte, ein Zeitungsbericht von 1754 über das
      Begräbnis Paweł Prusimskis; und aus den letzten Jahren vor der Teilung
      ein Register der Rauchfangsteuer von 1789, die Visitation der Pfarrei
      Trąbczyn von 1791 und die Tabelle der Rauchfangstände und Abgaben der
      Pfarrei auf einer Seite des Pyzdryner Gerichtsregisters von 1791 bis
      1792.

  hohenlohe:
    order: 2
    status: populated
    label_en: "The Hohenlohe-Ingelfingen years"
    label_de: "Die Hohenlohe-Ingelfingener Jahre"
    ownership_en: "Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, a Prussian
      general given the estate by the King. 1796 to 1807"
    ownership_de: "Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, ein preußischer
      General, dem der König das Gut schenkte. 1796 bis 1807"
    blurb_en: >-
      Prussia took the region in the Second Partition of Poland in 1793, and in
      1796 the King gave the confiscated estate of a Polish insurgent to a
      Prussian general. He held it for eleven years, sold parts of it and let the
      rest out to settlers in hereditary lease, and lost it in 1807; his claim to
      it was argued until 1820. The papers are here: the grants, the contracts,
      the letters of the agent who managed the estates, and the files of the
      Prussian ministries. One of the estates has two names: Pszczew, which the
      German papers call Betsche.
    blurb_de: >-
      Preußen nahm die Gegend 1793 in der Zweiten Teilung Polens, und 1796
      schenkte der König das konfiszierte Gut eines polnischen Aufständischen
      einem preußischen General. Er besaß es elf Jahre, verkaufte Teile davon,
      tat den Rest in Erbpacht an Siedler aus und verlor es 1807; um seinen
      Anspruch wurde bis 1820 gestritten. Hier liegen die Schenkungsurkunden,
      die Verträge, die Briefe des Bevollmächtigten, der die Güter verwaltete,
      und die Akten der preußischen Ministerien. Eines der Güter hat zwei
      Namen: Pszczew, in den deutschen Akten Betsche.

  restitution:
    order: 3
    status: populated
    label_en: "The Miączyńska restitution"
    label_de: "Die Restitution der Miączyńska"
    ownership_en: "Michalina Prusimska, married name Dąbska and later Miączyńska, the
      daughter of the last Polish owner. 1807 onward"
    ownership_de: "Michalina Prusimska, verheiratet Dąbska, später Miączyńska, die
      Tochter des letzten polnischen Besitzers. ab 1807"
    blurb_en: >-
      The daughter of the last Polish owner recovered the estates in 1807
      through the governing commission of the Duchy of Warsaw, and spent the
      next thirty years in court over what was left of them. The report of
      1834 in which the Instruction Commission of the Council of State of the
      Kingdom of Poland weighed the conflict of jurisdiction over the
      Trąbczyn mortgage is in Warsaw and is here; the further documents of
      the dispute are in Warsaw and Berlin.
    blurb_de: >-
      Die Tochter des letzten polnischen Besitzers erhielt die Güter 1807 durch
      die Regierungskommission des Herzogtums Warschau zurück und verbrachte die
      folgenden dreißig Jahre mit Prozessen um das, was von ihnen übrig war. Der
      Bericht von 1834, in dem die Instruktionskommission des Staatsrats des
      Königreichs Polen den Kompetenzkonflikt um die Trąbczyner Hypothek
      abwog, liegt in Warschau und ist hier; die weiteren Akten des Streits
      liegen in Warschau und Berlin.

  # The era below was set by the editor on 2026-10-14 as two, "The estate
  # under Włodzimierz Miączyński" and "The liquidation: the peasants' land
  # and the servitudes" (slug `liquidation`), and made one on 2026-10-20 at
  # the editor's word, "for better clarity": the lawsuit of 1859 over the
  # colonists' rights in the forest and the liquidation that fixed and then
  # bought out those rights are one story. Its name is a WORKING NAME until
  # the editor names it; the slug can stay.
  wlodzimierz:
    order: 4
    status: populated
    label_en: "The colonists' land and forest rights"
    label_de: "Das Land und die Waldrechte der Kolonisten"
    ownership_en: "Count Włodzimierz Miączyński, Michalina's son, from her death
      in 1851 to his own in 1879; then his nephew Władysław Miączyński, and by
      1892 Countess Maria Wielopolska. 1851 to 1901"
    ownership_de: "Graf Włodzimierz Miączyński, Michalinas Sohn, von ihrem Tod
      1851 bis zu seinem eigenen 1879; dann sein Neffe Władysław Miączyński
      und spätestens 1892 Gräfin Maria Wielopolska. 1851 bis 1901"
    blurb_en: >-
      After Michalina Miączyńska died in 1851, her son Count Włodzimierz
      Miączyński held the Trąbczyn estate until his death in 1879. The
      colonists on it sued him in 1859 over their rights of pasture and wood
      in his forest, and he answered with a counterclaim that went back to
      the privilege of 1746 and the contracts of Hohenlohe-Ingelfingen's
      years. The Russian reform of 1864 then made the peasants of the
      Kingdom of Poland owners of the land they farmed; the manor kept its
      own land and its forest. A liquidation table fixed each village's
      farmsteads, their land and the capital the government paid the former
      owner for the peasants' dues, and left the peasants their rights of pasture and wood
      in the manor forest. For the Łazińsk colony the table was confirmed in
      1868; its rights in the forest "Studzianka" were fixed again in 1882
      to 1884 and given up in 1892 for 393 Morgen of manor land, and the
      whole allotment was surveyed in 1896.
    blurb_de: >-
      Nach dem Tod Michalina Miączyńskas 1851 besaß ihr Sohn, Graf Włodzimierz
      Miączyński, das Gut Trąbczyn bis zu seinem Tod 1879. Die Kolonisten des
      Gutes verklagten ihn 1859 wegen ihrer Weide- und Holzrechte in seinem
      Wald, und er antwortete mit einer Widerklage, die auf das Privileg von
      1746 und die Verträge aus den Jahren Hohenlohe-Ingelfingens
      zurückging. Die russische Reform von 1864 machte dann die Bauern des
      Königreichs Polen zu Eigentümern des Landes, das sie bewirtschafteten;
      die Gutsherrschaft behielt ihr eigenes Land und ihren Wald. Eine
      Liquidationstabelle setzte für jedes Dorf die Höfe, ihr Land und das
      Kapital fest, mit dem die Regierung den früheren Besitzer für die
      Abgaben der Bauern entschädigte, und ließ den Bauern
      ihre Weide- und Holzrechte im herrschaftlichen Wald. Für die Kolonie
      Łazińsk wurde die Tabelle 1868 bestätigt; ihre Rechte im Wald
      „Studzianka“ wurden 1882 bis 1884 neu festgesetzt und 1892 gegen 393
      Morgen herrschaftliches Land aufgegeben, und 1896 wurde der ganze
      Anteil vermessen.

  twentieth-century:
    order: 5
    status: populated
    label_en: "The twentieth century"
    label_de: "Das zwanzigste Jahrhundert"
    ownership_en: "The manor parcelled out; the German settlements of the
      commune of Trąbczyn. 1900 onward"
    ownership_de: "Der Gutshof parzelliert; die deutschen Siedlungen der Gemeinde
      Trąbczyn. ab 1900"
    blurb_en: >-
      By the twentieth century the manor of Trąbczyn had been parcelled out,
      and the German settlements on its former land, Łazińsk and Emilienheim
      among them, were villages of the commune of Trąbczyn in the Polish
      state. The historian Albert Breyer visited them in 1935 and 1936 and
      wrote down what the settlers remembered and counted their farms.
      Three of his notebooks are here so far; his copies of older papers in
      them stand with the era of those papers.
    blurb_de: >-
      Im zwanzigsten Jahrhundert war der Gutshof Trąbczyn parzelliert, und die
      deutschen Siedlungen auf seinem früheren Land, darunter Łazińsk und
      Emilienheim, waren Dörfer der Gemeinde Trąbczyn im polnischen Staat. Der
      Historiker Albert Breyer besuchte sie 1935 und 1936 und schrieb auf,
      woran sich die Siedler erinnerten, und zählte ihre Höfe. Bisher liegen
      drei seiner Notizhefte vor; seine Abschriften älterer Papiere darin
      stehen bei der Epoche dieser Papiere.

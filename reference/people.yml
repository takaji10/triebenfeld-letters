    identity: "Julius Schmidt, Prussian consul general in the Kingdom of Poland at Warsaw from 1817 to 1832 and privy councillor of legation, to whom the Warsaw authorities address their letters on Weigel's claim (III. HA MdA, III. Nr. 12367). The documents give only the surname; forename and years of office are from the Geheimes Staatsarchiv's introduction to I. HA Rep. 81 Warschau. Added 2026-10-04."
  lubecki:
    display: "Lubecki"
    match: 'Lubeck(?:i|iego|iemu|im)(?![a-zà-ÿ])'
    tier: "Externally confirmed"
    variants: []
    identity: "Prince Franciszek Ksawery Drucki-Lubecki (1778-1846), minister presiding in the Government Commission of Revenue and Treasury of the Kingdom of Poland from 1821 to 1830. He signs 'X. X. Lubecki' on the two letters to Weigel of 22 September and 27 November 1830, and Weigel's reply calls him 'Schatzminister des Königreichs Polen, Herrn Fürsten v. Lubecki' (III. HA MdA, III. Nr. 12367, documents 6 to 9). Added 2026-10-04."
  engel:
    display: "Engel"
    match: 'Engel(?![a-zà-ÿ])'
    # "wäre Engel reine" in Oe 1 Bü 9454 is the word, not a name.
    only_in: [iiihamdaiiinr12367-10]
    tier: "Externally confirmed"
    variants: []
    identity: "Fyodor Engel, president of the Provisional Government that Russia set over the Kingdom of Poland from September 1831 to March 1832, who tells Schmidt on 13 March 1832 that Lubowidzki is to settle Weigel's claim; the copy is 'signé Engel' (III. HA MdA, III. Nr. 12367, document 10). Added 2026-10-04."
  lubowidzki:
    display: "Lubowidzki"
    match: 'Lubowidzk\w*'
    tier: "Text-confirmed"
    variants: []
    identity: "'Monsieur le Conseiller d'Etat Joseph Lubowidzki Président de la Banque de Pologne', charged in March 1832 with carrying out the Russo-Prussian convention of 17/29 May 1830 and with settling Weigel's claim (III. HA MdA, III. Nr. 12367, document 10). Added 2026-10-04."
  drake:
    display: "Drake"
    match: 'Drake(?![a-zà-ÿ])'
    tier: "Text-confirmed"
    variants: []
    identity: "'Mr. Drake Commissaire au Département des Domaines de l'Etat', whom the finance commission at Warsaw charged on 29 February 1832 with valuing the Trąbczyn estates (III. HA MdA, III. Nr. 12367, document 11). Added 2026-10-04."
  eisenhardt:
    display: "Eisenhardt"
    match: 'Eisenhardt'
    tier: "Text-confirmed"
    variants: []
    identity: "The partner in the Breslau banking house 'Weigel & Eisenhardt', as Baron Mohrenheim names the claimants in his note and in 1830 (III. HA MdA, III. Nr. 12367, documents 2 and 4). Not shown to be the Berlin agent Eysenhardt of the letters of 1798 to 1808, from whose entry the spelling was taken out. Added 2026-10-04."
  # --- AGAD 1/174/0/2/73 and 1/174/0/1/6, added 2026-10-04 --------------------
  malachowski:
    display: "Małachowski"
    # Mał[achowski] is his paraph on the papers of 1/174/0/2/73.
    match: 'Małachowsk\w*|Mał\[achowski\]'
    # In the decree of 1776 the name stands under the act of parliament of 1774; not shown to be Stanisław.
    not_in: [app53170koningr145-1]
    tier: "Externally confirmed"
    variants: []
    identity: "Stanisław Małachowski (1736-1809), president of the Governing Commission in 1807. His name stands under the register entries of 12 and 21 July 1807 ('Stanisław Małachowski, Prezes'), his paraph 'St Mał' under the draft resolution and the received note of 21 July, and Michalina Dąbska's petition to the Emperor is addressed on the back to him (AGAD 1/174/0/1/6 and 1/174/0/2/73). Added 2026-10-04."
  luszczewski:
    display: "Łuszczewski"
    match: 'Łuszczewsk\w*'
    tier: "Externally confirmed"
    variants: []
    identity: "Jan Paweł Łuszczewski (1764-1812), secretary general of the Governing Commission in 1807, whose name stands under the register entries of 12 and 21 July 1807 ('Jan Łuszczewski, Sekretarz Generalny'; AGAD 1/174/0/1/6). Added 2026-10-04."
  bischoffwerder:
    display: "Bischoffwerder"
    match: 'Bischoffs?werder\w*'
    tier: "Context-inferred"
    variants: ["Bischoffswerder"]
    identity: "A Prussian general 'Bischoffswerder' whom Michalina Dąbska names in July 1807, beside Hohenlohe-Ingelfingen and Sanitz, among those to whom her father's estates were given (AGAD 1/174/0/2/73, documents 2 and 3). Probably Johann Rudolf von Bischoffwerder (1741-1803), the favourite of King Friedrich Wilhelm II, of whom Triebenfeld also speaks (Oe 1 Bü 9454). No other holding names him among the donees. Added 2026-10-04."

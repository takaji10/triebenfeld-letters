  prusimski:
    display: "Antoni Prusimski, Starost of Niszczewice"
    render: "Antoni Prusimski"
    # "Johann von Prusimski", whose inscription of 1673 charges an annuity on
    # Kolno (14525), is a different and earlier man, and is not matched.
    match: "(?<!Johann von )Pru[sz]+ie?msk(?:i|isch\\w*)(?![a-zà-ÿ])"
    # In the decree of 1728 (APP 53/6/0/-/40) "Prusimski" is Krzysztof, his
    # grandfather, and "Antonio Prusimski filio" the uncle of the same name:
    # prusimski-krzysztof.
    not_in: [app536040-1, app53170koningr136-1]
    tier: "Text-confirmed (Anton von Prusimski, Starost); full name user-provided"
    identity: >-
      Antoni Ostroróg-Prusimski, Starost of Niszczewice, the owner of the
      Trąbczyn and Kamionna estates. He took part in the Polish uprising of
      1794 and fled; the Prussian crown confiscated his estates and in 1796
      granted them to the Prince of Hohenlohe-Ingelfingen (3570, 14525). The
      German documents call him Anton von Prusimski, the ehemalige or
      entwichene Starost; the French letter of 1815 writes Prussiemski and
      Prussimski (12765, document 6). The adjectival Prusimskische(n) is
      matched to him: it names his estates, his heirs and his family. Named
      as a person in his own right at the editor's request (2026-10-02), as
      he becomes more prominent in the project; until then this was a family
      entry.
    distinct_from: [prusimska]
    merge: false
    variants:
      - "Prussiemski"
      - "Prussimski"
      - "Prussimsky"
      - "Prusimsky"
  prusimski-pawel:
    display: "Paweł Prusimski"
    render: "Paweł Prusimski"
    # Only in the document that names him: elsewhere "Prusimski" is the

  prusimska:
    display: "Michalina z Prusimskich Dąbska, later Miączyńska"
    # In a running sentence her surname is the one she bore at the time; for
    # the forms the writers got wrong (Moscinska, Moszynska, Mięczynsky) that is
    # her second married name (editor, 2026-10-03).
    render: "Miączyńska"
    identity: >-
      Only child of Antoni Ostroróg-Prusimski, Starost of Niszczewice. She
      recovered the estates in 1807 through the Komisja Rządząca of the Duchy of
      Warsaw. Married first Józef Dąmbski (widowed 1798), then Stanisław
      Miączyński: the two surnames are SEQUENTIAL MARRIAGES, not a spelling
      discrepancy and not two women (Consistency_Register.md, Prusimski family).
      Moscinska / Moszynska are the corpus's own misreadings of Miączyńska.
      The display carried all four surnames in one string until the register
      settled which was which.
    # Dąbskiey, Dambskiey, Dąmbskiey: the genitive in the Polish of 1807 (AGAD
    # 1/174/0/2/73 and 1/174/0/1/6) and of the judgment of 1827 (Nr. 12366).
    match: "(?:Pru[sz]+ie?msk|D[ąa]m?bsk|Mosci[nń]sk|Moszy[nń]sk|Moscy[nń]sk|Mi[ąaęe]czy[nń]sk)a(?![a-zà-ÿ])|D[ąa]m?bskiey(?![a-zà-ÿ])"
    # In the potash decree of 1763 (APP 53/6/0/-/45) "Prusimska" is Katarzyna,
    # born Rozdrażewska, two generations before Michalina: prusimska-katarzyna.
    # In the citation of 1782 (Konin Gr.118, document 23) "Prusimska" is Marianna,
    # Wiktoria and Konstancja, of an earlier generation: no entry.
    not_in: [app536045-1, app53170koningr136-1, app53170koningr115-1, app53170koningr117-7, app53170koningr117-8, app53170koningr118-14, app53170koningr118-23]
    tier: "User-provided (genealogical) + text-confirmed"
    # The Prince's French letter of 1815 writes her "Madame Mięczynsky" (12765, document 6).
    variants:
      - "Madame Mięczynsky"
      - "Moscinska"
      - "Moszynska"
      - "Miaczynska"
    distinct_from: [prusimski]
    merge: false

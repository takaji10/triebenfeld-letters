    match: 'Pru[sz]+ie?mski(?![a-zà-ÿ])'
    only_in: [app53170koningr136-1, app53170koningr117-3, app53170koningr117-7, app53170koningr118-23]
    tier: "Text-confirmed"
    variants: []
    identity: "Paweł Prusimski, chamberlain of His Royal Majesty and heir of Trąbczyn with its appurtenances, who died not long before July 1754; husband of Katarzyna, born Rozdrażewska (APP 53/17/0/-/Konin Gr.136: 'olim Magnifici Pauli Prusimski Succamerarii suae Regiae Majestatis non pridem vita functi Bonorum Trąmpczyn cum attinentiis Haeredis'). Antoni Prusimski, the Starost, calls him his paternal uncle in his protest of March 1778 ('apud olim Magnificum Paulum Prusimski, sui Manifestantis Patruum', APP 53/17/0/-/Konin Gr.117), where a contract of 1744 for oak timber between him and the townsman Jan Tracholz is the ground of a suit. A citation of 1782 names him among the sons of Krzysztof Prusimski and Teresa Golińska, with Jan, Bogumił, Antoni and Stefan, the Starost's father, and says that he died childless (APP 53/17/0/-/Konin Gr.118, document 23). Added 2026-10-07."
    distinct_from: [prusimski, prusimski-krzysztof]
    merge: false
  prusimski-krzysztof:

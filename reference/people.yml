# The people this edition recognises, and how each is matched in the text.
#
# This was 85 lines of Python inside build_site_data.py, which meant a new
# holding's people stayed invisible until someone edited the build. It is an
# authority, shared across units, so it lives here.
#
# match     A regular expression, anchored at a word start by the build. It
#           matches inflected and adjectival forms (Prusimskische, Hawichs)
#           without matching inside another word.
# abbrev    Colon abbreviations the writers use for a familiar name. Kept
#           separate from `match` because a wrong expansion invents a mention
#           that is not in the letter, which is worse than missing one.
# tier      How firmly the person is identified, carried over from the last
#           column of reference/whos_who.md, which stays the prose companion.
# variants  Observed spellings of the name. A bare string means "fold this into
#           the entity", and the build adds it to `match`, so recording a
#           spelling here is what makes the edition find it. The long form
#           {form:, match: false, seen_in: []} records a spelling as SEEN
#           without asserting it is this person - which is how an unsettled
#           identity is documented rather than silently merged.
# render    The form the English translation should use for this person, where
#           it differs from `display`. `display` is a catalogue entry and may
#           carry a full name or a parenthetical; `render` is what belongs in a
#           running sentence. Optional; defaults to `display`.
# canonical Set false where the entity's OWN canonical spelling is unresolved.
#           Such an entity is still matched, so the person stays findable, but
#           no CANONICAL NAMES row is generated for it - the translation must
#           not be told to standardise on a form the edition has not settled.
# identity  Prose note on who this is, and where that was established.
# distinct_from / merge
#           Slugs this person is confused with. `merge: false` states that a
#           divergence is documented rather than an error to be tidied away.
# open_questions
#           Unresolved identity conflicts, flagged rather than resolved.
#
# reference/places.yml is the same shape for places. Both are meant to stay
# interoperable with Consistency_Register.md, which is the book's own authority
# on names; where the two disagree, the register wins.
#
# The long tail - names vetted by name_catalogue.py but not individually
# profiled - is NOT here. It is generated from reference/name_seeds.json at
# build time, because it is derived data rather than an editorial decision.

people:
  amelang:
    display: "Amelang"
    match: "Amelang"
    abbrev: "Am(?:el)?:"
    tier: ""
    variants: []
  asch:
    display: "Asch"
    match: "Asch\\b"
    tier: "Context-inferred, spelling explicitly settled"
    variants: []
  barbe:
    display: "Barbe"
    match: "Barbe"
    tier: "Context-inferred"
    variants: []
  bernhard:
    display: "Meyer Bernhard"
    match: "Bernhard(?!i)"
    tier: "Role unclear; treat as multiple people sharing a common surname, not one entity"
    variants: []
  bernhardi:
    display: "Bergrath Bernhardi"
    match: "Bernhardi"
    tier: "Context-inferred, corroborated by the register's own title match"
    variants: []
  bewert:
    display: "Bewert"
    match: "Bewert"
    tier: ""
    variants: []
  born:
    display: "Ernst Gottlob Born"
    match: 'Born(?![a-zà-ÿ¬\-=])'
    only_in: [oe1bu14526-4, oe1bu14526-23]
    tier: "Text-confirmed"
    variants: []
    identity: "Dr. Ernst Gottlob Born, royal justice official and syndic of the university at Frankfurt an der Oder, who certified powers of attorney in 1804 and 1805 (14526-4, -23). Until 2026-10-04 this entry also caught the first letters of Bornstädt, Bornsted and Born-staedt."
  bornstaedt:
    display: "Bornstädt"
    match: 'Bornst(?:ä|ae|a|e)e?d\w*|Bornstaet'
    tier: "Externally confirmed (family), role unclear beyond creditor"
    variants: ["Bornstaedt", "Bornstaet"]
  broniewski:
    display: "Broniewski"
    match: "Broniew|Bronisz"
    tier: ""
    variants:
      - "Broniewsky"
  chmara:
    display: "Johann Chmara"
    match: "Chmara"
    tier: ""
    variants: []
  chomanowski:
    display: "Chomanowski"
    match: "Chomanowski"
    tier: "Context-inferred (role), spelling explicitly settled"
    variants: []
  cosmar:
    display: "Cosmar"
    match: "Cosmar"
    tier: "Book-confirmed"
    variants: []
  echaust:
    display: "Echaust"
    match: "Echaust|Eichaust"
    tier: ""
    variants: ["Eichaust"]
  eysenhardt:
    display: "Eysenhardt"
    match: "Eysenhardt"
    tier: "Context-inferred, distinctness from Reinhardt explicitly settled"
    variants: ["Eysenhard", "Eissenhardt", {form: "Eisenhardt", match: false, seen_in: ["the banker of III. HA MdA, III. Nr. 12367: see eisenhardt"]}]
  falkenhausen:
    display: "Falkenhausen"
    match: "Falkenhausen"
    tier: "Externally confirmed (family), role context-inferred (thin, only 2 occurrences)"
    variants: []
  feller:
    display: "Feller"
    match: "Feller"
    tier: ""
    variants: []
  gaertner:
    display: "Gärtner (Geh. Rath)"
    match: "Gärtner"
    tier: "Context-inferred"
    variants: []
  gelanski:
    display: "Florian Gelanski"
    render: "Gelanski"
    match: "Florian|Gelanski"
    # In the decree of 1776 "Florian" is Florian Junosza Drewnowski, secretary of the parliament of 1774.
    not_in: [app53170koningr145-1]
    tier: ""
    variants:
      - {form: "Florian", canon: false}   # a given name, not a misspelling
  glenck:
    display: "Glenck"
    match: "Glenck|Glenk"
    tier: "Book-confirmed"
    variants: ["Glenk"]
  gneust:
    display: "Gneust"
    match: "Gneust"
    abbrev: "Wohlgeb"
    tier: ""
    variants: []
  goeschel:
    display: "Göschel"
    match: "Göschel"
    tier: "Role unclear"
    variants: ["Goeschel"]
  goldbeck:
    display: "Heinrich Julius von Goldbeck"
    # G[oldbeck] is his paraph on the papers issued in his name in I. HA GR,
    # Rep. 7 C, Nr. 3709 (one hand throughout; see that unit's notes.md).
    match: 'Goldbeck|G\[oldbeck\]'
    # Two men of the name, told apart by date (editor, 2026-10-04: one entry
    # per person): the Grand Chancellor in 1796-98, the president at Kalisz
    # from 1805.
    only_in: [ihagrrep7cnr3570-1, oe1bu14525-1, oe1bu9454-75, oe1bu9454-79, ihagrrep7cnr1414-1, ihagrrep7cnr3709-1, ihagrrep7cnr3709-3, ihagrrep7cnr3709-7, ihagrrep7cnr3709-10, ihagrrep7cnr3709-11, ihagrrep7cnr3709-12, ihagrrep7cnr3709-13, ihagrrep7cnr3709-14]
    tier: "Externally confirmed"
    variants: []
    identity: "Heinrich Julius von Goldbeck (1733-1818), Grand Chancellor of Prussia, who countersigned the charters of 1796 and is named in Berlin in 1798 (letters 75, 79). In 1800 the Prince petitioned him to take the Prusimska suit away from the government at Poznań, and he ordered it (I. HA GR, Rep. 7 C, Nr. 3709)."
  goldbeck-kalisz:
    display: "President von Goldbeck"
    match: "Goldbeck"
    only_in: [oe1bu9454-152, oe1bu9454-162, oe1bu9454-168, oe1bu9454-172]
    tier: "Text-confirmed"
    variants: []
    identity: "A von Goldbeck who came to Kalisz as president of the chamber in 1805 and supported the division of the estates (letters 152, 162, 168, 172). Forename not established. Split 2026-10-04."
  grimm:
    display: "Grimm"
    match: "Grimm"
    tier: ""
    variants: []
  guderian:
    display: "Guderian"
    match: "Guderian"
    tier: ""
    variants: []
  gunter:
    display: "Gunter"
    match: "Gunter|Gunterzur"
    tier: ""
    variants: ["Gunterzur"]
  hache:
    display: "Hache"
    match: "Hache"
    tier: "Role unclear, spelling explicitly settled"
    variants: []
  hardenberg:
    display: "Hardenberg"
    match: "Hardenberg"
    # Hbg is his paraph on the drafts written in his name in III. HA MdA, III
    # Nr. 12765 (read by the editor on the scan, 2026-10-01).
    abbrev: 'Hard(?:enb)?:|Hbg(?![a-zà-ÿ])|H\[arden\]b\[er\]g'
    tier: ""
    variants: ["Hardenburg", "Hard[enberg]", "H[ardenberg]", "Ha[rdenberg]", "Harde[nberg]"]
  hawich:
    display: "Hawich"
    match: "Hawich"
    tier: "Book-confirmed"
    # The transcriber misreads this name often (w read as b, ch as sch/ck/k): letters
    # 31 and 302 had Habisch, Habich, Habik, Habick, and 198 Hawick. All corrected to
    # Hawich in the text (editor, 2026-09-28); the forms stay here so a new one is found.
    variants: ["Hawick", "Habisch", "Habich", "Habik", "Habick"]
  hecker:
    display: "Hecker"
    match: "Hecker"
    tier: "Context-inferred"
    variants: []
  held:
    display: "Hans von Held"
    match: 'v(?:on)?\.? ?Held\b'
    tier: "Book-confirmed"
    identity: >-
      Author of the "Black Register" exposing the undervaluation of the South
      Prussian donations (Consistency_Register.md, Hohenlohe era).
      Matched only after v. / von: "Held" on its own is the ordinary German
      word for a hero, and matching it bare tagged every one of them.
    variants: []
  hertzog:
    display: "Hertzog"
    match: "Hertzog"
    tier: ""
    variants: []
  hirschel:
    display: "Abraham Moses Hirschel"
    render: "Hirschel"
    match: "Hirchel|Hirschel"
    tier: ""
    variants: ["Hirchel"]
  hohenlohe:
    display: "Hohenlohe"
    # Hohenlo[h]e is the editor's reading of "Hohenloe" in the petitions of 1807
    # (AGAD 1/174/0/2/73).
    match: 'Hohenlohe|Hohenlo\[h\]e'
    tier: "Book-confirmed (the book's subject)"
    variants: []
  cattaneo:
    display: "Count Cattaneo"
    render: "Cattaneo"
    # Cathane is the form of the French statement of 1818 (III. HA MdA, III.
    # Nr. 12366, document 2). Matched, not made a variant: the English there
    # keeps the page's spelling.
    match: 'Cattaneo|Cathane'
    tier: "Text-confirmed"
    variants: []
    identity: "Count Cattaneo, Prussian resident at Venice ('der Königl. Resident Graf von Cattaneo zu Venedig'), whose dispatch No. 423 of 14 December 1796 reports that he gave Antoni Prusimski a certificate of his ill health (I. HA GR, Rep. 7 C, Nr. 1414). The statement of Miączyńska's claim of 1818 names him as 'le Comte Cathane, Conseiller de légation Prussienne près la république de Venise', who legalised the certificate Prusimski sent to the Prussian government (III. HA MdA, III. Nr. 12366, document 2). Forename not given. Added 2026-10-05."
  haugwitz:
    display: "Christian von Haugwitz"
    render: "Haugwitz"
    match: 'Haugwitz'
    tier: "Externally confirmed"
    variants: []
    identity: "Christian Count von Haugwitz (1752-1832), Prussian cabinet minister for foreign affairs. He signs the department's draft of 11 January 1797 (I. HA GR, Rep. 7 C, Nr. 1414, document 1), and Triebenfeld's letters name him as minister between 1798 and 1806 (Oe 1 Bü 9454). Added 2026-10-05; until then his name in the letters was not indexed."
  alvensleben:
    display: "Philipp Karl von Alvensleben"
    # A[lvensleben] is the first signature under the foreign department's
    # draft of 11 January 1797: only the initial is read, the name supplied
    # from his office (see that unit's notes.md).
    match: 'Alvensleben|A\[lvensleben\]'
    only_in: [ihagrrep7cnr1414-1]
    tier: "Context-inferred (office)"
    variants: []
    identity: "Philipp Karl Count von Alvensleben (1745-1802), Prussian cabinet minister from 1791 to his death, one of the three ministers of the department of foreign affairs in 1797 with Finckenstein and Haugwitz. The first of the two signatures under the department's draft of 11 January 1797 (I. HA GR, Rep. 7 C, Nr. 1414, document 1) opens with a large A and is otherwise not read; it is taken to be his because he is the one minister of the department whose name begins with that letter. The editor could not verify the name on the scan (2026-10-05)."
  chemski:
    display: "Chełmski"
    # The key is the one the name catalogue had made for this family (its
    # biography and heading hang on it). Curated on 2026-10-06 so that the
    # Polish and Latin forms of the court books are found: Chełmskiego,
    # Chełmscy, Chełmsky. Before that only the bare nominative was.
    match: 'Che[lł]ms(?:k(?:iego|iemu|imi|ich|im|iej|i|y|a|ą)|cy)(?![a-zà-ÿ])'
    tier: "Text-confirmed"
    variants: ["Chełmsky", "Chelmski"]
    identity: "The family that owned Łukomia, the estate next to Trąbczyn: Jerzy Chełmski in 1644 (APP 53/6/0/-/36), Stanisław Ścibor Chełmski in 1763 (APP 53/6/0/-/45), the brothers Heliodor and Stanisław in the boundary decree of 1775 (APP 53/17/0/-/Konin Gr.145), and a Chełmski at law over the South Prussian estates in 1798 and 1799. A family entry: the documents name several men, who are not yet told apart in the index."
    merge: false
  szepczynski:
    display: "Bartłomiej Szepczyński, court messenger"
    render: "Szepczyński"
    match: 'Szepczy[nń]sk\w+|Szeptyck\w+'
    tier: "Text-confirmed"
    # "Szeptycki" (1754) is matched but not listed as a variant: the editor's
    # English keeps it with the usual form in brackets.
    variants: []
    identity: "Bartłomiej Szepczyński of Trąbczyn, a sworn court messenger (woźny, Ministerialis Regni Generalis), a commoner ('Providus'). He made the inspection of Trąbczyn for Katarzyna Prusimska in 1754, where the record writes him Szeptycki (APP 53/17/0/-/Konin Gr.136), and reported twice in 1767 for Antoni Prusimski on the embankment at the pond-ground (APP 53/17/0/-/Konin Gr.114). The editor's notes identify him with the messenger Bartłomiej of Trąbczyn in the decree of 1775 and in a document of 1782. Added 2026-10-07."
    merge: false
  trampczynski:
    display: "Trąmpczyński (Otto-Trąmpczyński)"
    render: "Trąmpczyński"
    # Only in the documents listed: in the Polish of the boundary decree
    # "Trąpczyński" is the adjective of the place (gruntu Trąpczyńskiego).
    match: 'Th?r[ąa]m?pczy[nń]s(?:k(?:iego|ich|i|y|a)|cy)(?![a-zà-ÿ])'
    only_in: [app536017-1, app536036-1, app536036-2, app53150kaliszgr425-1]
    tier: "Text-confirmed"
    variants: []
    identity: "The family that held Trąbczyn before the Prusimskis and took its name from it, with the by-name Otto ('Otha', 'Ottow Trąmpczyńskich'). In 1589 Albertus Trąmpczyński Otha sued Thomas Łukomski for a pond at Łukom that flooded his woods (APP 53/6/0/-/17). In 1644 the brothers Marcin, Wojciech, Władysław and Andrzej, sons of the late Stanisław, and his widow Anna of Słończyce were condemned by default at the suit of Jerzy Chełmski (APP 53/6/0/-/36). A family entry. Added 2026-10-06."
    merge: false
  dambski-ludwik:
    display: "Ludwik Dąmbski, voivode of Brześć Kujawski"
    render: "Dąmbski"
    # Only with his forename: Stanisław and Maciej Dąmbski sit on the same
    # commission, and Dąmbska is Michalina Prusimska's married name.
    match: 'Ludwik\w* (?:hrabi\w* na Lubrańcu )?D[ąa]mbsk\w*'
    only_in: [app53170koningr145-1, app53170koningr116-3]
    tier: "Text-confirmed"
    variants: []
    identity: "Ludwik Dąmbski, Count of Lubraniec, voivode of Brześć Kujawski, Starost of Dybów and Gniewkowo: first named and president of the commission that the Polish parliament appointed in 1774 to settle the boundary between Trąbczyn and Łukomia, which sat from 13 September 1775; he signs its decree as 'preses commissionis' (APP 53/17/0/-/Konin Gr.145). Added 2026-10-06."
  raumer:
    display: "Karl Georg von Raumer"
    render: "Raumer"
    match: 'Raumer'
    tier: "Context-inferred (office)"
    variants: []
    identity: "A councillor of the Prussian department of foreign affairs to whom the extract about Prusimski was routed ('Hr von Raumer') and who signs the directions on it and on Schrötter's reply, January to March 1797 (I. HA GR, Rep. 7 C, Nr. 1414). Taken to be Karl Georg von Raumer (1753-1833), who served in that department; the papers give only the surname. The editor's transcription read Rammer, Maunes and Maurer. Added 2026-10-05."
  schroetter:
    display: "Friedrich Leopold von Schroetter"
    render: "Schrötter"
    match: 'Schr(?:oe|ö)tter'
    tier: "Externally confirmed"
    variants: ["Schrötter", "Schroetter"]
    identity: "Friedrich Leopold Baron von Schroetter (1743-1815), Prussian minister for East Prussia and, from 1795, for New East Prussia. The department of foreign affairs sent him the news of Prusimski at Venice; he answers on 29 January 1797 that he has passed it to Hoym (I. HA GR, Rep. 7 C, Nr. 1414). Added 2026-10-05."
  heinrichs:
    display: "Heinrichs"
    match: 'Heinrichs(?![a-zà-ÿ])'
    # Not Martin Honrichs. Two copies in different hands write "Heinrichs"
    # with a royal title Honrichs never bears; see the identity.
    only_in: [app539680801-3, oe1bu14526-16]
    tier: "Text-confirmed"
    variants: []
    identity: "Heinrichs, 'Königl. Kammer Commissions Rath und Oconomie Commissarius' (Oe 1 Bü 14526, document 16), 'Commissionsrath und Oeconomie-Commissarius' (APP 53/968/0/-/801, document 3): the royal official who attests, under two hereditary leases of the Zagórów and Trąbczyn estates, that the contract was read aloud to the parties and signed in his presence. Forename not given. Kept apart from Martin Honrichs, the buyer of Witów and later agent on the estates, who is nowhere given these titles (editor asked 2026-10-05; entry made the same day; the editor ruled the same day that the two are kept separate)."
  honrichs:
    display: "Honrichs"
    match: "Honrichs|Hon(?![a-zà-ÿ])"
    tier: "Context-inferred (role), spelling explicitly settled against the book"
    variants: ["Hon"]
  hoym:
    display: "Hoym"
    match: "H[oö]ym"
    tier: "Book-adjacent (via Marianne's family), individual identity externally plausible but not fully pinned"
    variants: []
  humboldt:
    display: "Wilhelm von Humboldt"
    match: "Humboldt"
    tier: "Externally confirmed"
    variants: ["Humbolt", "Humbold", "Humbo[ldt]"]
  jankowski:
    display: "Jankowski"
    match: "Jankowski"
    # Joseph von Jankowski of the Oe 1 Bü 14526 deeds. The court messenger Jan
    # Jankowski of Łukom (Konin register, 1778) is another man.
    not_in: [app53170koningr117-1, app53170koningr117-9]
    tier: ""
    variants: []
  kaleschke:
    display: "Kaleschke"
    match: "K[ao]leschke"
    tier: "Context-inferred (office), spelling unresolved"
    canonical: false        # see open_questions: the spelling itself is open
    identity: >-
      Actuarius of the Freiherrlich von Stillfried patrimonial court, alongside
      Koeppen the Justitiarius.
    variants:
      - {form: "Koleschke", seen_in: ["the corpus outside the 1805 Power of Attorney"]}
    open_questions:
      - "The register records this name as Kaleschke in the 1805 Power of
         Attorney and Koleschke elsewhere in the corpus, and calls the
         divergence unresolved. Both forms are matched to one entity so the
         person is findable, but neither spelling is asserted as canonical:
         no canonical_names entry is generated for an entity whose own
         spelling is still open."
      - "review/name_catalogue.csv proposes Kaleschke as a variant of the city
         Kalisch. It is not. See reference/places.yml, kalisz."
  kircheisen:
    display: "Kircheisen"
    match: "Kircheisen"
    tier: "Externally confirmed, book cross-reference consistent"
    variants: []
  knobelsdorff:
    display: "Knobelsdorff"
    match: "Knobelsdorff"
    tier: "Externally confirmed (family), role context-inferred"
    variants: []
  knoblauch:
    display: "Knoblauch"
    match: "Knob(?![a-zà-ÿ])|Knoblauch"
    tier: ""
    variants: ["Knob"]
  koeckritz:
    display: "Köckritz"
    match: "Köckritz"
    abbrev: "K[oö]ch:"
    tier: "Externally confirmed"
    variants: ["Köchritz", "Köchrich", "Köcheritz", "Köchitz", "Koekritz", "Köck", "Kockritz"]
  koeppen:
    display: "Koeppen"
    match: "K(?:oe|ö)ppen"
    tier: "Context-inferred (office)"
    identity: >-
      Justitiarius of the Freiherrlich von Stillfried patrimonial court,
      alongside the Actuarius - see [[kaleschke]].
    variants: ["Köppen"]
  kunckel:
    # Kunkel, not Kunckel (editor, 2026-10-03). The deeds write both.
    display: "Kunkel"
    match: "Kunc?kel"
    tier: "Role unclear"
    variants: ["Kunckel"]
  kwilecki:
    display: "Kwilecki"
    match: "Kwileck"
    tier: "Externally confirmed (family), role context-inferred"
    variants: []
  lahr:
    display: "van der Lahr"
    match: "L[aä]hr"
    tier: "Book-confirmed (as a named debt/matter), person vs. debt-name not fully resolved"
    variants:
      - "von der Laar"
      - "Van der Laar"
  leixner:
    display: "George Conrad Leixner"
    # "Leyner" is the spelling of the French report of 1818 (III. HA MdA, III.
    # Nr. 12366, document 2): "le Caissier de la Banque Leyner", the buyer of
    # Kolno and Kamionna.
    match: "Leixner|Leyner"
    tier: ""
    variants: []
  lichnowski-kalisz:
    display: "Regierungsrath von Lichnowski"
    render: "Lichnowski"
    match: 'Lichnowsk\w*'
    only_in: [iharep162nr295-2]
    tier: "Text-confirmed"
    variants: []
    identity: "Regierungsrath v. Lichnowski, a councillor of the South Prussian Government at Kalisz, who on 27 February 1805 vouched for Triebenfeld's identity when he acknowledged his bond to the Invalids' Fund ('als Identitäts-Zeuge'; I. HA Rep. 162, Nr. 295, document 2). Whether he is one of the Lichnowski brothers who were creditors of the estates is not shown; kept apart. Added 2026-10-05."
  lichnowski:
    display: "Lichnowski"
    # Not the Regierungsrath at Kalisz (lichnowski-kalisz), who is named twice
    # in I. HA Rep. 162, Nr. 295, document 2.
    match: '(?<!Regierungsrath v\. )(?<!gez\. v\. )Lichnowsk\w*'
    tier: "Book-confirmed (as claimants)"
    identity: >-
      The Lichnowski brothers, creditors and claimants against the estates.
    variants: []
  lombardini:
    display: "Lombardini"
    match: "Lombardin"
    abbrev: "Lomb:"
    tier: "Book-confirmed"
    variants: []
  luka:
    display: "Samuel Lucke (Luka)"
    match: "Luka"
    tier: ""
    variants: []
  massenbach:
    display: "Massenbach"
    match: "Massenbach"
    tier: "Book-confirmed"
    variants: []
  meierowitz:
    display: "Franz Meierowitz"
    render: "Meierowitz"
    match: "Meierowicz|Meierowitz"
    tier: ""
    variants: ["Meierowicz", "Maierowitz"]
  melzer:
    display: "Melzer"
    match: "Melzer"
    tier: ""
    variants: []
  metternich:
    display: "Metternich"
    match: "Metternich"
    tier: "Externally confirmed"
    variants: []
  metzig:
    display: "Metzig"
    match: 'Me[tl]zig(?![a-zà-ÿ])'

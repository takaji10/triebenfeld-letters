  - term: Preußen
    pattern: '\bPreu(ß|ss)en\b'
    policy: translate
    render: 'Prussia'
  - term: Südpreußen
    pattern: '\bS(ü|ue)d[- ]?Preu(ß|ss)en\b'
    policy: translate
    render: 'South Prussia'
  - term: Sachsen
    pattern: '\bSach(ß|s)en\b'
    policy: translate
    render: 'Saxony'
  - term: Schlesien
    pattern: '\bSchlesien\b'
    policy: translate
    render: 'Silesia'
  - term: Italien
    pattern: '\bItalien\b'
    policy: translate
    render: 'Italy'
  - term: Böhmen
    pattern: '\bB(ö|oe)hmen\b'
    policy: translate
    render: 'Bohemia'
  - term: Pommern
    pattern: '\bPommern\b'
    policy: translate

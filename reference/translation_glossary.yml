# ------------------------------------------------------- colon abbreviations --
# These writers shorten a familiar name to its first syllable and a colon:
# "Min: v. Hard:", "Gen Lieut v. Koch:", "der Gr. Pourt:". Expand them in the
# English, because leaving "the Prince Hard:" standing tells an English reader
# nothing, and because an unexpanded form is invisible to the people index.
# This is an expansion of an abbreviation, not a correction of a name, so it is
# applied silently rather than marked.
#
# Only expand what the context settles. Known traps, all verified:
#   Ant:  is "Antwort", not Anton
#   Kur:  is "Curländische", not a person
#   Ko:   reads as Koschentin, the estate, not Köckritz
#   Sch:  could be Schlabrendorff, Schenck or Schimmelpfennig
#   B:    could be Barbe, Beyme or Brzechsta
# Where the referent is genuinely unclear, keep the abbreviation and flag it.

  # --- states, peoples and rivers ----------------------------------------
  # The correspondence of 1806-1816 is largely about who is at war with whom,
  # so these are not incidental colour. They were missing, and the first full
  # batch reported each of them as a name it had supplied and the German did
  # not have - around eighty rows of nothing, in which five real losses sat.
  # The English forms below are the ones the batch already used; recording
  # them makes the agreement enforceable rather than lucky.
  - term: Württemberg
    pattern: '\bW(ü|ue|u)r(t|tt)emberg\w*'
    policy: translate
    render: 'Württemberg'
  - term: Bayern
    pattern: '\bBa(y|i)ern\b'
    policy: translate
    render: 'Bavaria'
  - term: bayerisch
    pattern: '\bba(y|i)erisch\w*'
    policy: translate
    render: 'Bavarian'
  - term: Hannover
    pattern: '\bHann?over\w*'
    policy: translate
    render: 'Hanover'
  - term: Hessen
    pattern: '\bHessen\b'
    policy: translate
    render: 'Hesse'
  - term: hessisch
    pattern: '\bhessisch\w*'
    policy: translate
    render: 'Hessian'
  - term: Schweiz
    pattern: '\bSchwei(z|tz)\w*'
    policy: translate
    render: 'Switzerland'
  - term: Frankreich
    pattern: '\bFrankreich\b'
    policy: translate
    render: 'France'
  - term: französisch
    pattern: '\bfranz(ö|oe)sisch\w*'
    policy: translate
    render: 'French'
  - term: England
    pattern: '\bEngland\b'
    policy: translate
    render: 'England'
  - term: Rußland
    pattern: '\bRu(ß|ss)land\b'
    policy: translate
    render: 'Russia'
  - term: russisch
    pattern: '\bru(ß|ss)isch\w*'
    policy: translate
    render: 'Russian'
  - term: pohlnisch
    pattern: '\bpoh?lnisch\w*'
    policy: translate
    render: 'Polish'
  - term: Ungarn
    pattern: '\bUngarn\b'
    policy: translate
    render: 'Hungary'
  - term: Dänemark
    pattern: '\bD(ä|ae)nemark\b'
    policy: translate
    render: 'Denmark'
  - term: Holland
    pattern: '\bHolland\b'
    policy: translate
    render: 'Holland'
    gloss: 'the country. NOT to be confused with Hauländer, the settlers, who are not Dutch - see terms.'
  - term: Prag
    pattern: '\bPrag\b'
    policy: translate
    render: 'Prague'
  - term: Rhein
    pattern: '\bRhein\b|\bRheins\b'
    policy: translate
    render: 'Rhine'
  - term: Elbe
    pattern: '\bElbe\b'
    policy: translate
    render: 'Elbe'
  - term: Weichsel
    pattern: '\bWeichsel\b'
    policy: translate
    render: 'Vistula'
  - term: Oder
    pattern: '\bOder[- ]Stroh?m\b'
    policy: translate
    render: 'Oder'
    gloss: 'the river. The bare word Oder is the German for "or" and is not matched.'
abbreviations:
  - short: 'Hard:'
    expand: Hardenberg
  - short: 'Hardenb:'
    expand: Hardenberg
  - short: 'Köch:'
    expand: Köckritz
  - short: 'Koch:'
    expand: Köckritz
  - short: 'Am:'
    expand: Amelang
  - short: 'Amel:'
    expand: Amelang
  - short: 'Pourt:'
    expand: Pourtales
  - short: 'Grev:'
    expand: Grävenitz
  - short: 'Lomb:'
    expand: Lombardini
  - short: 'Sa:'
    expand: Sacken
    note: 'only in "Fürstin/Fürsten Sa:"'
  - short: 'Gen:'
    expand: General
  - short: 'Min:'
    expand: Minister
  - short: 'Lieut:'
    expand: Lieutenant
  - short: 'Maj:'
    expand: Major
  - short: 'Franz:'
    expand: französisch
  - short: 'Cour:'

# Controlled termbase for the English translation (Phase C).
#
# Two jobs, one file:
#   1. translate.py renders this into the cached system prompt, so all 318
#      letters agree on how a term is put into English.
#   2. check_translations.py enforces it afterwards - wherever `pattern` fires
#      in the German, `render` must appear in the English, or the page gets a
#      `glossary-mismatch` row in translation_review.csv.
#
# policy:
#   keep            leave the German word standing in the English text
#   translate       replace with `render`
#   gloss-first-use keep the German, but gloss it the first time in a letter
#
# `also` lists further renderings that satisfy the check. For a German word
# with more than one correct English depending on sense - Pohlen is the country
# and the people, Herzog is the Duke and the Duchess - insisting on one of them
# reports the other as drift. Use it only where BOTH are right; a term that
# should have settled on one rendering must keep only that one, or the termbase
# stops doing its job.
#
# `poles` is only for the rare confusion pairs. collate_translations.py uses it
# to tell a real meaning-reversal from ordinary paraphrase: if the two witnesses
# land in different poles that is a divergence worth your time; same pole, or
# neither, is just two ways of saying the same thing.
#
# Counts in comments are occurrences in the corpus, for a sense of weight.

editorial_policy: |
  This is a READING COPY, not a diplomatic edition. Anyone doing close textual work
  will go back to the manuscript regardless, so the translation's job is to be
  faithful and readable, not to reproduce every defect of the transcription.

  Where the transcription is obviously corrupt and the intended word is not in
  reasonable doubt, translate what was plainly meant, and record the emendation.
  Do not carry a mangled token into the English. `Mußland` is Rußland, so the
  English says Russia; `der Fünſt` is der Fürst, so it says the Prince; `Capitul`
  is Capital, `Blauquette` is Blanquette, `ex nexa` is ex nexu, the `Herzogin von
  Sagen` is the Duchess of Sagan. Leaving these standing helps nobody: the reader
  gets nonsense and the scholar still has to check the manuscript.

  Reserve a visible mark for doubt that actually matters:
    * you cannot tell what was meant;
    * two readings are both plausible and differ in MEANING;
    * the choice changes a figure, or which person or place is referred to;
    * without a mark the sentence would read as confident sense that may be wrong.

  The test is the reader's: would leaving this unmarked make the passage
  misleading, or merely less than perfectly certain? Mark the first. Let the
  second go, and record it.

house_style: |
  Period-faithful but readable English. Keep the deference structure intact -
  it carries much of the meaning in this correspondence, where a dependent
  agent writes upward to his prince. Do not flatten the graduated honorifics
  into modern business politeness. Period vocabulary stands.

  THE RULE: everything goes into English. A German word may stand only where
  English genuinely has no equivalent, and that is rare - a dozen words in this
  whole termbase, every one of them marked `policy: keep`.

  Names and titles are not the same thing, and the difference decides this:

    * a PERSONAL or PLACE name is never TRANSLATED. Triebenfeld stays
      Triebenfeld and Trąbczyn stays Trąbczyn; there is no English for either.
      Spelling is a separate question, answered by the CANONICAL NAMES table:
      where a spelling is listed there, use the canonical form the edition has
      settled on, and where it is not listed, copy the page exactly. Never
      improvise a spelling of your own, in either direction;
    * a TITLE, RANK or OFFICE is translated, even when it stands next to a name.
      `Fürst zu Hohenlohe-Ingelfingen` is the Prince of Hohenlohe-Ingelfingen;
      `Obrist von Schlieben` is Colonel von Schlieben; `Kreis-Steuer-Einnehmer
      Gneust` is the district tax collector Gneust. The name in each is the last
      word, and only that word stays German.

  Name order in the English is given name, family name, then titles. A predicate
  particle meaning "of" follows the family name - Józef Brzeziński of Brzyzna -
  rather than being interleaved as Polish would have it. Polish diacritics are
  preserved in every name that carries them.

  Terms of art keep their German form ONLY where this termbase says
  `policy: keep` - Rthl, Hufe, Morgen, Landschaft and the handful like them.
  Everything else is rendered into English, however technical. A German word
  left standing in an English sentence is a failure of the translation, not a
  mark of fidelity: the first published pass left Liebden, Bevollmächtigter,
  Herrschaft and Bürgerschaft in the English because the rule here used to let
  the translator decide when English "has no true equivalent", and it decided
  too readily. Where the German term genuinely matters to a reader, put it in
  parentheses after the English on first use only - the manorial lordship
  (Dominium) - and use the English thereafter.

# ---------------------------------------------------------------- currency --
# The system, verified internally consistent in currency_normalisation_report.md:
# 1 Reichsthaler = 24 Groschen; 1 Groschen = 12 Pfennig.
# Figures are never recomputed, converted or modernised - carry them across
# exactly as written. No financial figure in this corpus is trustworthy alone.

currency:
  - term: Rthl                              # 1519 in corpus
    pattern: '\bRthl\b\.?'
    policy: keep
    render: 'Rthl'
    gloss: 'Reichsthaler, the Prussian silver unit of account'
  - term: Courant                           # 152 in corpus
    pattern: '\bCourant\b'
    policy: keep
    render: 'Courant'
    gloss: 'current-money Reichsthaler - a distinct denomination from Gold, never merge the two'
  - term: Gold                              # 20 in corpus
    pattern: '\bGold\b'
    policy: keep
    render: 'Gold'
    gloss: 'gold Reichsthaler, kept separate from Courant in the liquidation register'
  - term: Groschen                          # 36 in corpus
    pattern: '\bg(?:ute)?\.? ?Groschen\b|\bGroschen\b'
    policy: keep
    render: 'Groschen'
    gloss: '1/24 Reichsthaler'
  - term: Pfennig                           # 3 in corpus
    pattern: '\bPfennig\w*\b'
    policy: keep
    render: 'Pfennig'
    gloss: "1/12 Groschen; abbreviated `d` (denarius) in the Pfennig position, as in British pre-decimal pence"
  - term: Ducaten                           # 31 in corpus
    pattern: '\bDucaten\b'
    policy: translate
    render: 'ducats'
  - term: Gulden                            # 13 in corpus
    pattern: '\bGulden\b|\bfl\.'
    policy: translate
    render: 'gulden'
    gloss: 'the Viennese florin, the currency of the Congress letters'

# ------------------------------------------------------- forms of address --
# The gradient matters: Durchlaucht (a prince) outranks Hochwohlgeboren (titled
# nobility/senior official) outranks Wohlgeboren. Keep them distinct in English.

honorifics:
  - term: Durchlauchtigster Fürst           # 196 in corpus
    pattern: 'Durchlauchtigster F(ü|ue)rst'
    policy: translate
    render: 'Most Serene Prince'
  - term: Gnädigster Fürst und Herr         # 150 in corpus
    pattern: 'Gn(ä|ae)digster F(ü|ue)rst und Herr'
    policy: translate
    render: 'Most gracious Prince and Lord'
  - term: Gnädigster Herr                   # 81 in corpus
    pattern: 'Gn(ä|ae)digster Herr'
    policy: translate
    render: 'Most gracious Lord'
  - term: Ewr Hochfürstliche Durchlaucht    # 286 in corpus
    pattern: 'Hochf(ü|ue)rstliche\w* Durchlaucht'
    policy: translate
    render: 'Your Most Serene Highness'
  - term: Ewr Durchlaucht                   # 976 in corpus
    pattern: '\b(Ewr|Ewer|Euer|Ew\.?)\s+Durchlaucht'
    policy: translate
    render: 'Your Serene Highness'
  - term: Durchlaucht                       # 1719 in corpus
    pattern: '\bDurchlaucht\w*'
    policy: translate
    render: 'Serene Highness'
  - term: Hochwohlgebohrner Herr            # 21 in corpus
    pattern: 'Hochwohlgeb(oh|o)rner Herr'
    policy: translate
    render: 'Right Honourable Sir'
    gloss: 'Hochwohlgeboren, literally "high well-born" - the style for titled nobility and senior officials, a rank below Durchlaucht'
  - term: Hochwohlgebohren                  # 130 in corpus
    pattern: '\bHochwohlgeb\w*'
    policy: translate
    render: 'Your Right Honourable'
  - term: Hochzuehrender Herr               # 15 in corpus
    pattern: 'Hoch(zu)?(ver)?ehrender Herr'
    policy: translate
    render: 'Highly Honoured Sir'
  - term: Wohlgeborn                        # 8 in corpus
    pattern: '\bWohlgeb(o|oh)rn\w*'
    policy: translate
    render: 'Your Honour'
    gloss: 'Wohlgeboren, the style below Hochwohlgeboren'
  - term: Königliche Majestät               # 8 in corpus
    pattern: 'K(ö|oe)nigl\w*\.? Majest(ä|ae)t'
    policy: translate
    render: "Your Royal Majesty"

# ------------------------------------------------------- closing formulas --
# Where a model will otherwise default to "yours sincerely" and destroy the
# register. These are near-universal in the corpus.

formulas:
  - term: unterthänigster Diener            # 35 in corpus
    pattern: 'untert(h)?(ä|ae)nigster Diener'
    policy: translate
    render: 'most humble and obedient servant'
  - term: unterthäniger Diener              # 49 in corpus
    pattern: 'untert(h)?(ä|ae)niger Diener'
    policy: translate
    render: 'humble and obedient servant'
  - term: gehorsamster Diener               # 43 in corpus
    pattern: '(treu )?gehorsamster Diener'
    policy: translate
    render: 'most obedient servant'
  - term: treuester Knecht                  # 25 in corpus
    pattern: 'treu(ester|er) Knecht'
    policy: translate
    render: 'most faithful servant'
    gloss: 'Knecht is humbler than Diener - a bondsman rather than a servant; the self-abasement is deliberate'
  - term: ersterbe                          # 130 in corpus
    pattern: '\bersterbe\b'
    policy: translate
    render: 'I remain, until death,'
    gloss: 'the standing closing formula: "in deepest reverence I remain unto death..."'
  - term: In tiefster                       # 13 in corpus
    pattern: 'In tiefster (Ehrfurcht|Submission|Respect|Treue)'
    policy: translate
    render: 'In deepest reverence'

# ------------------------------------------------ legal and estate business --

terms:
  - term: Sequestration                     # 60 in corpus
    pattern: '\bSequestrat\w*|\bSequest\w*'
    policy: translate
    render: 'sequestration'
    gloss: 'court-ordered seizure and administration of an estate on behalf of creditors'
  - term: Vollmacht                         # 106 in corpus
    pattern: '\bVollmacht\w*'
    policy: translate
    render: 'power of attorney'
  - term: Revers                            # 18 in corpus
    pattern: '\bRevers\b\w*'
    policy: translate
    render: 'written undertaking'
    gloss: 'a signed bond or counter-declaration'
  - term: Hypothequen                       # 62 in corpus
    pattern: '\bHypothe(qu|k)\w*'
    policy: translate
    render: 'mortgage'
  - term: Majorat                           # 41 in corpus
    pattern: '\bMajorat\w*'
    policy: translate
    render: 'entailed estate'
    gloss: 'Majorat - an estate passing undivided to the eldest heir'
  - term: Vorwerk                           # 21 in corpus
    pattern: '\bVorwer(k|ck)\w*'
    policy: translate
    render: 'demesne farm'
    gloss: 'an outlying home farm worked for the manor'
  - term: Cammer                            # 65 in corpus
    pattern: '\b(Cammer|Kammer)\b'
    policy: translate
    render: 'Chamber'
    gloss: 'the Prussian Kriegs- und Domänenkammer, the provincial administrative board'
  - term: Wechsel                           # 39 in corpus
    # not wechselseitig, wechselweise or Abwechselung: \w* swallowed the
    # adverbs and reported a bill of exchange missing from a page about
    # mutual assurances
    pattern: '\bWechsel(n|s|briefe?n?|geschaefte?n?)?\b'
    policy: translate
    render: 'bill of exchange'
  - term: Unterthanen                       # 39 in corpus
    pattern: '\bUnterthan\w*'
    policy: translate
    render: 'subjects'
    gloss: 'the manorial peasantry owing dues and labour'
  - term: Transact                          # 24 in corpus
    pattern: '\bTransact\w*'
    policy: translate
    render: 'settlement'
    gloss: 'the formal compromise between the Prince and his creditors; the 1811 Transact is a recurring thread'
  - term: Estaffette                        # 29 in corpus
    pattern: '\bEstaf(f)?ette\w*'
    policy: translate
    render: 'express courier'
  - term: Hufe                              # 30 in corpus
    pattern: '\bHufe\w*'
    policy: keep
    render: 'Hufe'
    gloss: 'a holding of arable, the standard settler allotment'
  - term: Anschlag                          # 18 in corpus
    pattern: '\bAnschlag\w*'
    policy: translate
    render: 'valuation'
  - term: Quittung                          # 23 in corpus
    pattern: '\bQuittung\w*'
    policy: translate
    render: 'receipt'
  - term: Erbpacht                          # 21 in corpus
    pattern: '\bErbpacht\w*'
    policy: translate
    render: 'hereditary lease'
  - term: Dismembration                     # 45 in corpus
    pattern: '\bDismembrat\w*|\bdismembrir\w*'
    policy: translate
    render: 'dismemberment'
    gloss: 'the legal parcelling-up of an estate into separate saleable holdings'
  - term: Canon                             # 17 in corpus
    pattern: '\bCanon\b'
    policy: translate
    render: 'canon'
    gloss: 'the fixed annual quit-rent owed under a hereditary lease'
  - term: Propination                       # 14 in corpus
    pattern: '\bPropinat\w*'
    policy: translate
    render: 'propination rights'
    gloss: 'the manorial monopoly on brewing and selling liquor'
  - term: Collonisten                       # 32 in corpus
    pattern: '\bCollon\w*|\bKolonist\w*'
    policy: translate
    render: 'colonists'
    gloss: 'settlers placed on cleared or dismembered land'
  - term: Morgen                            # 87 in corpus
    # The land measure only. Bare "Morgen" is also "tomorrow" and "morning",
    # and matching those made this the single noisiest check in the sheet.
    pattern: '\d\s*Morgen\b'
    policy: keep
    render: 'Morgen'
    gloss: 'a land measure, roughly a quarter-hectare in Prussia'
  - term: Komornik                          # 5 in corpus
    pattern: '\bKomornik\w*'
    policy: keep
    render: 'komornik'
    gloss: 'a Polish court bailiff / enforcement officer'
  - term: Podprefect                        # 11 in corpus
    pattern: '\bPod\s?pr(ae|ä|e)fect\w*'
    policy: translate
    render: 'sub-prefect'
    gloss: 'the Duchy of Warsaw district official'
  - term: Moratorium                        # 8 in corpus
    pattern: '\bMoratori\w*'
    policy: translate
    render: 'moratorium'
  - term: Codizill                          # 6 in corpus
    pattern: '\bCodizill\w*|\bKodizill\w*'
    policy: translate
    render: 'codicil'
  - term: Praetension                       # 6 in corpus
    pattern: '\bPr(ae|ä)tension\w*'
    policy: translate
    render: 'claim'
  - term: Hauländer                         # 4 in corpus
    pattern: '\bHaul(ä|ae|a)nder\w*|\bHoll(ä|ae)nder\w*|\bOl(ę|e)nd\w*|\bOl(ę|e)der\w*'
    policy: keep
    render: 'Hauländer'
    gloss: 'settler-colonists holding on Dutch-law tenure - NOT "Hollanders", NOT "Dutch settlers"; the same community the Polish sources call Olędrzy. See NEEDS_CONFIRMATION.md section G'
  - term: Indult                            # 2 in corpus
    pattern: '\bIndult\w*'
    policy: translate
    render: 'indult'
    gloss: 'a grace period granted to a debtor'
  - term: Intabulation                      # 1 in corpus
    pattern: '\bIntabulat\w*'
    policy: translate
    render: 'intabulation'
    gloss: 'registration of a debt against a landed estate in the mortgage book'
  - term: Landschaft                        # 7 in corpus
    pattern: '\bLandschaft\w*'
    policy: keep
    render: 'Landschaft'
    gloss: 'the noble provincial credit institution that issued Pfandbriefe'
  - term: Pfandbriefe                       # 5 in corpus
    pattern: '\bPfandbrief\w*'
    policy: translate
    render: 'mortgage bonds'
  - term: Invaliden-Casse                   # 65 in corpus
    pattern: '\bInvaliden[- ]?Cass\w*'
    policy: translate
    render: "the Invalids' Fund"
    gloss: 'the Prussian military pension fund, holder of the 50,000 Rthl first mortgage'
  - term: Kriegs- und Forstrath             # 9 in corpus
    pattern: 'Kriegs?[- ]?(und )?Forst[- ]?Ra(th|t)\w*'
    policy: translate
    render: 'Councillor of War and Forests'
    gloss: "von Triebenfeld's own title"
  - term: Hofrath                           # 26 in corpus
    pattern: '\bHof(f)?ra(th|t)\w*'
    policy: translate
    render: 'Court Councillor'
  - term: Justizbürgermeister               # 4 in corpus
    pattern: 'Justiz[- ]?B(ü|ue)rge(r)?meister'
    policy: translate
    render: 'justice-burgomaster'
  - term: Ober-Inspector                    # 4 in corpus
    pattern: 'Ober[- ]?Inspe(c|k)tor'
    policy: translate
    render: 'Chief Inspector'
  - term: Pro Memoria                       # 6 in corpus
    pattern: 'P(ro)?\.?\s?M(emoria)?\.'
    policy: keep
    render: 'Pro Memoria'
    gloss: 'a memorandum enclosed with, or standing in for, a letter'
  - term: Abschrift                         # 40 in corpus
    pattern: '\bAbschrift\b|\bCopia\b'
    policy: translate
    render: 'Copy'
    gloss: 'marks the document as a scribal copy, not the original'

# ----------------------------------------------------------------- exonyms --
# Countries, regions and major cities that have a settled English name. These
# SHOULD be translated - "Wien" becomes Vienna - and the point of listing them
# is consistency, so one letter does not say Vienna where the next says Wien.
#
# Village and estate names are deliberately absent: Zagorowo, Trąbczyn, Kontop,
# Blizanow, Betsche and the rest have no English form and must stand exactly as
# transcribed, because they are also the least reliable part of the
# transcription and a silently improved one destroys the evidence.

  # Added after the first published pass: each of these reached the English
  # untranslated, because the house style licensed keeping "terms of art" and
  # the termbase did not name them.
  - term: Liebden
    pattern: '\bLiebden\b'
    policy: translate
    render: 'Your Lordship'
    gloss: "Ew. Liebden - a sovereign's form of address to a prince; never left as Liebden"
  - term: Bevollmaechtigter
    pattern: '\bBevollm(ä|ae)chtigt\w*'
    policy: translate
    render: 'authorised representative'
    gloss: 'a General-Bevollmaechtigter is a general attorney or plenipotentiary'
  - term: Herrschaft
    pattern: '\bHerrschaft(en)?\b'
    policy: translate
    render: 'lordship'
    gloss: 'the estate complex, not the persons of the lord and lady'
  - term: Buergerschaft
    pattern: '\bB(ü|ue)rgerschaft\w*'
    policy: translate
    render: 'burgesses'
    gloss: "the townspeople as a corporate body; 'burghership' is not English"
  - term: Dominium
    pattern: '\bDomini(um|o)\b'
    policy: translate
    render: 'manorial lordship (Dominium)'
    gloss: 'keep the Latin in parentheses on first use only, English thereafter'
  - term: Laudemium
    pattern: '\bLaudemi(um|en|o)\b'
    policy: translate
    render: 'transfer fee (Laudemium)'
    gloss: 'the due paid to the lordship on a change of possession'
  - term: Einsassen
    pattern: '\bEins(a|ä|aa)(ss|ß)en\b'
    policy: translate
    render: 'residents'
  - term: Scholtisey
    pattern: '\bSchol(t|z)isey\b'
    policy: translate
    render: "the village mayor's holding"
  - term: Justiziarius
    pattern: '\bJustiti?arius\b'
    policy: translate
    render: 'justiciary'

  # Titles, ranks and offices. A title is not a name: it goes into English
  # even when it stands beside one. 97 of these reached the first published
  # pass untranslated, Fürst 38 times.
  - term: Fuerst
    pattern: '\bF(ü|ue)rst(en|s)?\b'
    policy: translate
    render: 'Prince'
    gloss: "Fürst zu Hohenlohe-Ingelfingen is the Prince of Hohenlohe-Ingelfingen; the place stays German, the title does not"
  - term: Fuerstin
    pattern: '\bF(ü|ue)rstin\b'
    policy: translate
    render: 'Princess'
  - term: fuerstlich
    pattern: '\bf(ü|ue)rstlich\w*'
    policy: translate
    render: 'princely'
    gloss: "Fürstliches Patrimonial Gericht - the princely patrimonial court"
  - term: Herzog
    pattern: '\bHerzog(in|s)?\b'
    policy: translate
    render: 'Duke'
    gloss: "Herzogin is Duchess"
  - term: Graf
    pattern: '\bGr(a|ä)f(in|en|s)?\b'
    policy: translate
    render: 'Count'
    gloss: "Gräfin is Countess"
  - term: Freiherr
    pattern: '\bFrei?herr\w*'
    policy: translate
    render: 'Baron'
    gloss: "freiherrlich is baronial"
  - term: Obrist
    pattern: '\bObrist(en)?\b'
    policy: translate
    render: 'Colonel'
  - term: Obristwachtmeister
    pattern: '\bObristwachtmeister\b'
    policy: translate
    render: 'Major'
  - term: Rittmeister
    pattern: '\bRittmeister\b'
    policy: translate
    render: 'cavalry captain'
  - term: Rendant
    pattern: '\bRendant(en)?\b'
    policy: translate
    render: 'cashier'
    gloss: "Banco-Rendant is the bank cashier"
  - term: Amtsrath
    pattern: '\bAmtsr(a|ä|ae)th\w*'
    policy: translate
    render: 'district councillor'
    gloss: "Amtsräthin is his wife"
  - term: Bergrath
    pattern: '\bBerg[- ]?R?rath\w*'
    policy: translate
    render: 'mining councillor'
  - term: Justizrath
    pattern: '\bJustiz[- ]?R?rath\w*'
    policy: translate
    render: 'councillor of justice'
  - term: Kriegsrath
    pattern: '\bKrie(gs|ges)[- ]?R?r(a|ä)th\w*'
    policy: translate
    render: 'councillor of war'
    gloss: "von Triebenfeld's own title, per Consistency_Register.md. He is the
      Kriegsrath - NOT Finanzrath and NOT Forstrath; a long-s misreading had put
      him in the wrong institutional chain."
  - term: Kammerrath
    pattern: '\b(C|K)ammer[- ]?R?rath\w*'
    policy: translate
    render: 'chamber councillor'
  - term: Criminalrath
    pattern: '\bCriminal[- ]?R?rath\w*'
    policy: translate
    render: 'criminal-court councillor'
  - term: Schulze
    pattern: '\bSch(u|o)l(z|tz)e(n)?\b'
    policy: translate
    render: 'village mayor'
    gloss: "Freyschulze is a free village mayor, holding his office heritably"
  - term: Dollmetscher
    pattern: '\bDoll?met(s|sc)her\b'
    policy: translate
    render: 'interpreter'
    gloss: "the sworn interpreter who renders the German act into Polish"
  - term: Arendator
    pattern: '\bArendator(en)?\b'
    policy: translate
    render: 'leaseholder'
  - term: Einnehmer
    pattern: '\bEinnehmer(s|n)?\b'
    policy: translate
    render: 'collector'
    gloss: "Kreis-Steuer-Einnehmer is the district tax collector"
  - term: Conducteur
    pattern: '\bConducteur(s)?\b'
    policy: translate
    render: 'surveyor'
    gloss: "a Kammer-Conducteur is the Chamber's surveying officer"
  - term: Syndikus
    pattern: '\bSyndi(k|c)us\b'
    policy: translate
    render: 'syndic'
  # --- from Consistency_Register.md, "Confirmed terminology (binding)" ----
  # These are settled readings in the book. They are here so the translation
  # inherits them rather than re-deciding them, and so check_translations can
  # catch a reversion mechanically. Several correct a specific prior
  # mistranslation; the reversed form is listed under forbidden_renders below.
  - term: sąd grodzki
    pattern: '\bs[aą]d\w*\s+grodzk\w*|\biudicium\s+castrens\w*|\bCastrens\w+\s+Capitanealis\b'
    policy: translate
    render: 'municipal court'
    gloss: 'distinct from the land court; never "Castle Court" or "Captain''s Court"'
  - term: sąd ziemski
    pattern: '\bs[aą]d\w*\s+ziemsk\w*|\biudicium\s+terrestr\w*'
    policy: translate
    render: 'land court'
    gloss: 'distinct from the municipal court - the two are not interchangeable'
  - term: wizja
    pattern: '\bwizj\w*|\bvisio\s+iudicial\w*'
    policy: translate
    render: 'judicial site inspection'
    gloss: 'distinct from a kondestensja, which is a full commissarial hearing in the field'
  - term: kondestensja
    pattern: '\bkondestens\w*|\bcondescens\w*'
    policy: translate
    render: 'field inspection'
  - term: kopiec narożny
    pattern: '\bkopi?[ea]c\w*\s+naro[zż]n\w*'
    policy: translate
    render: 'corner mound'
    gloss: '"border mound" is generic and loses the distinction from a wall mound'
  - term: kopiec ścienny
    pattern: '\bkopi?[ea]c\w*\s+[sś]cienn\w*'
    policy: translate
    render: 'wall mound'
  - term: roboracja
    pattern: '\broborac\w*|\brobborat\w*'
    policy: gloss-first-use
    render: 'roboracja'
    gloss: 'formal court enrollment giving a document binding legal force - NOT simple contract-signing. Gloss on first use, then use the Polish.'
  - term: traditio
    pattern: '\btraditio\w*'
    policy: translate
    render: 'delivery of possession'
    gloss: 'never "tradition", never "eviction"'
  - term: axialny
    pattern: '\baxialn\w*|\bacialiter\b|\baxialis\b'
    policy: translate
    render: 'at the convergence point'
    gloss: 'a surveying term, from axialis. Not a place name, and not an ordinary adjective.'
  - term: stawisko
    pattern: '\bstawisk\w*'
    policy: keep
    render: 'stawisko'
    gloss: 'the disputed pond-ground. Kept in Polish and italicised; "mud pond" is non-standard.'
  - term: Woźny
    pattern: '\bwo[zź]n\w*|\bministerial(is|es|em)\b'
    policy: translate
    render: 'Court Summoner'
    gloss: '"bailiff" is a non-standard rendering of this office'

  # --- quarter days ------------------------------------------------------
  # Rents, leases and instalments in these documents fall due on feast days,
  # not on calendar dates, so these are load-bearing terms and not colour: a
  # reader comparing two Erbpacht contracts is comparing their terms.
  #
  # They were missing from this termbase entirely, and the first full batch
  # shows exactly what that costs. Johannis came back four ways - Midsummer
  # (58), St. John (31), St John (13), John the Baptist (2) - and Michaelis was
  # left standing in the English 28 times against 13 Michaelmas, which the
  # house rule does not allow: English has the equivalent.
  #
  # The English names chosen are the ones an English legal or estate document
  # of the period uses, which is also the majority rendering the batch reached
  # for on its own in three of the five cases.
  - term: Michaelis                        # 36 in corpus
    pattern: '\bMichael(is|i|e)\b|\bMichaelmas\b'
    policy: translate
    render: 'Michaelmas'
    gloss: '29 September. NOT left as Michaelis, and not "Michael" - the quarter day has an English name.'
  - term: Johannis                         # 19 in corpus
    pattern: '\bJohannis\b|\bJohanni\b'
    policy: translate
    render: 'Midsummer'
    gloss: 'the Nativity of St John the Baptist, 24 June. Rendered Midsummer throughout rather than St John, so two leases can be compared.'
  - term: Weihnachten                      # 5 in corpus
    pattern: '\bWeihnacht(en|s)?\w*'
    policy: translate
    render: 'Christmas'
  - term: Martini                          # 5 in corpus
    pattern: '\bMartini\b'
    policy: translate
    render: 'Martinmas'
    gloss: '11 November.'
  - term: Ostern                           # 2 in corpus
    pattern: '\bOstern\b'
    policy: translate
    render: 'Easter'
  - term: Jacobi                           # 1 in corpus
    pattern: '\bJacobi\b'
    policy: translate
    render: "St James's Day"
    gloss: '25 July.'

exonyms:
  - term: Wien                              # 66 flagged before this was recorded
    pattern: '\bWien\b'
    policy: translate
    render: 'Vienna'
  - term: Warschau
    pattern: '\bWarschau\w*'

# ----------------------------------------------------------------- exonyms --
# Countries, regions and major cities that have a settled English name. These
# SHOULD be translated - "Wien" becomes Vienna - and the point of listing them
# is consistency, so one letter does not say Vienna where the next says Wien.
#
# Village and estate names are deliberately absent: Zagorowo, Trąbczyn, Kontop,
# Blizanow, Betsche and the rest have no English form and must stand exactly as
# transcribed, because they are also the least reliable part of the
# transcription and a silently improved one destroys the evidence.

exonyms:
  - term: Wien                              # 66 flagged before this was recorded
    pattern: '\bWien\b'
    policy: translate
    render: 'Vienna'
  - term: Warschau
    pattern: '\bWarschau\w*'
    policy: translate
    render: 'Warsaw'
  - term: Preußen
    pattern: '\bPreu(ß|ss)en\b'
    policy: translate
    render: 'Prussia'
  - term: Südpreußen
    pattern: '\bS(ü|ue)d[- ]?Preu(ß|ss)en\b'
    policy: translate
    render: 'South Prussia'
  - term: Sachsen
    pattern: '\bSach(ß|s)en\b'
    policy: translate
    render: 'Saxony'
  - term: Schlesien
    pattern: '\bSchlesien\b'
    policy: translate
    render: 'Silesia'
  - term: Italien
    pattern: '\bItalien\b'
    policy: translate
    render: 'Italy'
  - term: Böhmen
    pattern: '\bB(ö|oe)hmen\b'
    policy: translate
    render: 'Bohemia'
  - term: Pommern
    pattern: '\bPommern\b'
    policy: translate
    render: 'Pomerania'
  - term: Spanien
    pattern: '\bSpanien\b'
    policy: translate
    render: 'Spain'
  - term: Frankreich
    pattern: '\bFrankreich\b'
    policy: translate
    render: 'France'
  - term: Rußland
    pattern: '\bRu(ß|ss)land\b'
    policy: translate
    render: 'Russia'
  - term: Pohlen
    pattern: '\bPo(h)?len\b'
    policy: translate
    render: 'Poland'
  - term: Österreich
    pattern: '\b(Ö|Oe)sterreich\b'
    policy: translate
    render: 'Austria'
  - term: Curland
    pattern: '\bC(u|ur)land\b|\bKurland\b'
    policy: translate
    render: 'Courland'
  - term: Thoren
    pattern: '\bThoren\b'
    policy: translate
    render: 'Thorn'

# ------------------------------------------------------- colon abbreviations --
# These writers shorten a familiar name to its first syllable and a colon:
# "Min: v. Hard:", "Gen Lieut v. Koch:", "der Gr. Pourt:". Expand them in the
# English, because leaving "the Prince Hard:" standing tells an English reader
# nothing, and because an unexpanded form is invisible to the people index.
# This is an expansion of an abbreviation, not a correction of a name, so it is
# applied silently rather than marked.
#
# Only expand what the context settles. Known traps, all verified:
#   Ant:  is "Antwort", not Anton
#   Kur:  is "Curländische", not a person
#   Ko:   reads as Koschentin, the estate, not Köckritz
#   Sch:  could be Schlabrendorff, Schenck or Schimmelpfennig
#   B:    could be Barbe, Beyme or Brzechsta
# Where the referent is genuinely unclear, keep the abbreviation and flag it.

abbreviations:
  - short: 'Hard:'
    expand: Hardenberg
  - short: 'Hardenb:'
    expand: Hardenberg
  - short: 'Köch:'
    expand: Köckritz
  - short: 'Koch:'
    expand: Köckritz
  - short: 'Am:'
    expand: Amelang
  - short: 'Amel:'
    expand: Amelang
  - short: 'Pourt:'
    expand: Pourtales
  - short: 'Grev:'
    expand: Grävenitz
  - short: 'Lomb:'
    expand: Lombardini
  - short: 'Sa:'
    expand: Sacken
    note: 'only in "Fürstin/Fürsten Sa:"'
  - short: 'Gen:'
    expand: General
  - short: 'Min:'
    expand: Minister
  - short: 'Lieut:'
    expand: Lieutenant
  - short: 'Maj:'
    expand: Major
  - short: 'Franz:'
    expand: französisch
  - short: 'Cour:'
    expand: Courant

# ------------------------------------------------------------ rare pairs --
# 42 occurrences in the whole corpus. Every one must be flagged by the model;
# check_translations.py blocks publication of any page that misses one. These
# are the meaning-reversing confusions that a fluent translation hides.

rare_pairs:
  - pair: [Anweisung, Abweisung]
    pattern: '\bA(n|b)weisung\w*'
    note: 'Anweisung = an instruction or an order to pay (36x). Abweisung = a dismissal or refusal (1x). One Kurrent minim apart, opposite meanings.'
    poles:
      A: [instruct, instruction, direct, directive, order, assignment, warrant, remittance]
      B: [dismiss, dismissal, reject, rejection, refuse, refusal, deny, denial]
  - pair: [committirt, exmittirt]
    pattern: '\b(com|ex)mittir\w*'
    note: 'committirt = committed or referred (1x). exmittirt = evicted or ejected (4x). Different legal acts entirely.'
    poles:
      A: [commit, committed, refer, referred, entrust, entrusted]
      B: [evict, evicted, eject, ejected, dispossess, remove]

# ------------------------------------------------------------- watch-list --
# ~7,750 occurrences, about nine per manuscript page. Far too common to flag
# exhaustively - marking every one would describe German, not filter it. The
# model is told these are known risks in this hand and asked to flag only the
# instances genuinely ambiguous in context; check_translations.py additionally
# samples a few unflagged ones per letter as a calibration probe.

watchlist:
  - pair: [nach, noch]
    note: 'to/after vs still/yet'
  - pair: [als, da]
    note: 'when/as vs since/there'
  - pair: [wie, wir]
    note: 'how/as vs we'
  - pair: [vor, von]
    note: 'before/for vs of/from'

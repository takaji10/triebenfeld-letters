# ------------------------------------------------------------ rare pairs --
# 42 occurrences in the whole corpus. Every one must be flagged by the model;
# check_translations.py blocks publication of any page that misses one. These
# are the meaning-reversing confusions that a fluent translation hides.

rare_pairs:
  - pair: [Anweisung, Abweisung]
    pattern: '\bA(n|b)weisung\w*'
    note: 'Anweisung = an instruction or an order to pay (36x). Abweisung = a dismissal or refusal (1x). One Kurrent minim apart, opposite meanings.'
    poles:
      A: [instruct, instruction, direct, directive, order, assignment, warrant, remittance]
      B: [dismiss, dismissal, reject, rejection, refuse, refusal, deny, denial]
  - pair: [committirt, exmittirt]
    pattern: '\b(com|ex)mittir\w*'
    note: 'committirt = committed or referred (1x). exmittirt = evicted or ejected (4x). Different legal acts entirely.'
    poles:
      A: [commit, committed, refer, referred, entrust, entrusted]
      B: [evict, evicted, eject, ejected, dispossess, remove]

# ------------------------------------------------------------- watch-list --
# ~7,750 occurrences, about nine per manuscript page. Far too common to flag
# exhaustively - marking every one would describe German, not filter it. The
# model is told these are known risks in this hand and asked to flag only the
# instances genuinely ambiguous in context; check_translations.py additionally
# samples a few unflagged ones per letter as a calibration probe.

watchlist:
  - pair: [nach, noch]
    note: 'to/after vs still/yet'
  - pair: [als, da]
    note: 'when/as vs since/there'
  - pair: [wie, wir]
    note: 'how/as vs we'
  - pair: [vor, von]
    note: 'before/for vs of/from'

# ------------------------------------------------------------ latin terms --
# Appended to the USER block, and ONLY for a document rulings.yml records as
# Latin. A blanket rule here would corrupt the German correspondence: in the
# letters `Pfarrer` and `Pastor` mean a clergyman, and reference/whos_who.md
# lists one among the creditors. In the Latin of the estate documents the same
# word is the shepherd. The document's language is already known - it reaches
# the prompt at translate.py's user_block() - so the distinction is free to make
# and expensive to get wrong.
latin_terms:
  - term: pastor
    pattern: '\bpastor\w*'
    policy: translate
    render: 'shepherd'
    gloss: 'in LATIN documents only. Never "Lutheran pastor" and never "clergyman" here; the German correspondence is the opposite case and is not governed by this section.'
  - term: hypocaustum
    pattern: '\bhypocaust\w*|\bhippocaust\w*|\bhippi\w*'
    policy: translate
    render: 'heated room'
    gloss: 'genitive hypocausti / hypocaustorum; the full form is confirmed from Konin Gr. 117. "super Mensa hippi praesen~" is "on the table in the heated room". A "chestnut table" is a prior misreading.'
  - term: ingenuus
    pattern: '\bingenu(us|i|um|o)\b'
    policy: translate
    render: 'the Freeborn'
    gloss: 'the honorific standing before an Olęder name, e.g. Martin Hunt the Freeborn'
  - term: pracowity
    pattern: '\bpracowit\w*|\blaborios\w*'
    policy: translate
    render: 'the Diligent'
    gloss: 'the sub-noble honorific marking an Olęder in the commission records'

# ------------------------------------------------------- forbidden renders --
# English that must never appear, whatever the German says.
#
# Every other mechanism in this file states what a term SHOULD become. Nothing
# stated what a term must never become, so a correction the book had already
# made could be made again by the next translation pass and every check would
# pass. These are settled reversals: each was wrong once, in print, and the
# reason it was wrong is recorded beside it.
#
# check_translations.py raises a `forbidden-render` row per page, which blocks
# publication the same way a structure failure does.
# `when` is optional, and is a pattern that must ALSO match the SOURCE page.
# Use it whenever the English string has an innocent life of its own. Two in
# this corpus do: L286 says "fetch the chestnuts out of the fire", and eight
# documents name a Chief Bailiff, who is the Oberamtmann and has nothing to do
# with the Court Summoner. A rule with no `when` is unconditional, and should
# only be written for a string that could not arise any other way.
forbidden_renders:
  - render: 'chestnut'
    when: '\bhypocaust\w*|\bhippocaust\w*|\bhippi\w*|\bcastane\w*'
    note: 'hypocaustum misread. The table stands in the heated room, not on a chestnut.'
  - render: 'Lagurowo'
    note: 'a Z/L letterform error for Zagorowo; not a place.'
  - render: 'Castle Court'
    note: 'sąd grodzki is the municipal court.'
  - render: "Captain's Court"
    note: 'Castrensia Capitanealis is the Starost''s Municipal Court.'
  - render: 'mud pond'
    note: 'stawisko is kept in Polish and italicised.'
  - render: 'Lutheran pastor'
    when: '\bpastor\w*'
    note: 'in a Latin document pastor is the shepherd. Where a clergyman is genuinely meant the German says Pfarrer, and this rule does not fire on that.'
  - render: 'bailiff'
    when: '\bwo[zź]n\w*|\bministerial(is|es|em)\b'
    note: 'woźny / ministerialis is the Court Summoner. NOT scoped to the word alone: Chief Bailiff is the Oberamtmann, a different office, and stands correctly in eight documents.'
  - render: 'Hollanders'
    note: 'Hauländer is kept. The community is not Dutch.'
  - render: 'Dutch settlers'
    note: 'Hauländer is kept - the archive''s central subject must be searchable under one word.'

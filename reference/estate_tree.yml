people:
  T001:
    given: Jan
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    page: /people/jan-otto-trampczynski-elder/
    events:
    - type: DEAT
      date: BEF OCT 1584
      note: Dead by October 1584, when his brother Wojciech held his sons in guardianship.
      cite:
      - source: konin145
        page: doc 1, pp. 0677_a2-0678_a1
    - type: EVEN
      label: Co-heir of Trąbczyn
      note: His share of Trąbczyn passed to his sons.
      cite:
      - source: konin145
        page: doc 1, p. 0677_a2
    notes:
    - 'Brother of Wojciech Otto-Trąmpczyński (the tree shows no common parents: the sources name none).'
  T002:
    given: Szczęsna
    surname: z Popowa
    sex: F
    rule: spouse
    events:
    - type: EVEN
      label: Settled with her sons the division of their part of Trąbczyn
      date: '1596'
      note: Widow of Jan by 1596; the agreement was roborated at Konin on the Monday after the Exaltation of the Cross.
      cite:
      - source: konin145
        page: doc 1, p. 0678_a1
  T003:
    given: Wawrzyniec
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    events:
    - type: EVEN
      label: Co-heir of Trąbczyn
      date: '1591'
      note: Wojciech's nephew and ward; the division of Trąbczyn with their uncle Wojciech was made on the Monday after Jubilate Sunday 1591.
      cite:
      - source: konin145
        page: doc 1, p. 0677_a2
    notes:
    - Named among the four nephews and wards of 1584-1591 but not in his mother's settlement of 1596; his sonship of Jan rests on being one of Wojciech's four nephews.
  T004:
    given: Rachwał
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    events:
    - type: EVEN
      label: Co-heir of Trąbczyn
      date: '1591'
      note: Wojciech's nephew and ward; the division of Trąbczyn with their uncle Wojciech was made on the Monday after Jubilate Sunday 1591.
      cite:
      - source: konin145
        page: doc 1, p. 0677_a2
    - type: EVEN
      label: Party to his mother's settlement of 1596
      date: '1596'
      cite:
      - source: konin145
        page: doc 1, p. 0678_a1
  T005:
    given: Walenty
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    events:
    - type: EVEN
      label: Co-heir of Trąbczyn
      date: '1591'
      note: Wojciech's nephew and ward; the division of Trąbczyn with their uncle Wojciech was made on the Monday after Jubilate Sunday 1591.
      cite:
      - source: konin145
        page: doc 1, p. 0677_a2
    - type: EVEN
      label: Party to his mother's settlement of 1596
      date: '1596'
      cite:
      - source: konin145
        page: doc 1, p. 0678_a1
  T006:
    given: Stanisław
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    events:
    - type: EVEN
      label: Co-heir of Trąbczyn
      date: '1591'
      note: Wojciech's nephew and ward; the division of Trąbczyn with their uncle Wojciech was made on the Monday after Jubilate Sunday 1591.
      cite:
      - source: konin145
        page: doc 1, p. 0677_a2
    - type: EVEN
      label: Party to his mother's settlement of 1596
      date: '1596'
      cite:
      - source: konin145
        page: doc 1, p. 0678_a1
    - type: EVEN
      label: Among the heirs of Trąbczyn, as son of Jan
      date: '1616'
      cite:
      - source: konin145
        page: doc 1
    notes:
    - 'Not the Stanisław who was Wojciech''s son: the term of 1616 lists "Stanisław son of Jan" and "Stanisław son of Wojciech" separately.'
  T007:
    given: Andrzej
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    events:
    - type: EVEN
      label: Among the heirs of Trąbczyn
      date: '1616'
      note: Rachwał's son.
      cite:
      - source: konin145
        page: doc 1
  T008:
    given: Wojciech (Albertus)
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    page: /people/wojciech-otto-trampczynski/
    events:
    - type: EVEN
      label: Co-heir of a part of Trąbczyn
      date: '1589'
      note: Sued the heirs of Łukom over their new pond, on the Monday before Saints Vitus and Modestus 1589; he held only a part of Trąbczyn and was his nephews' guardian.
      cite:
      - source: konin145
        page: doc 1, p. 0669_a2
    - type: EVEN
      label: Divided Trąbczyn with his nephews
      date: '1591'
      cite:
      - source: konin145
        page: doc 1, p. 0677_a2
    notes:
    - Brother of Jan the elder; the guardian of Jan's sons.
  T009:
    given: Anna
    surname: Cerekwicka
    sex: F
    rule: spouse
    notes:
    - Known from the database only (sw.249753).
  T010:
    given: Stanisław
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    page: /people/stanislaw-otto-trampczynski/
    events:
    - type: EVEN
      label: Promised Anna Słonecka's dowry on half his estates
      date: '1614'
      note: Before the wedding; the regest calls him "son of Wojciech Otha Trąmpczyński".
      cite:
      - source: tek_c01
        page: regest Nr 137 (1614)
    - type: EVEN
      label: Among the heirs of Trąbczyn, as son of Wojciech
      date: '1616'
      cite:
      - source: konin145
        page: doc 1
    - type: EVEN
      label: Sold Trąbczyn
      date: '1642'
      note: He made Trąbczyn, Nowa Wieś, Łazy and Osiny over to Maciej Debrzyński for 20,000 złp, his wife consenting; most likely a redeemable sale (wyderkaf, the regest's "wyd.").
      cite:
      - source: tek_c02
        page: regest Nr 1420 (1642)
    - type: DEAT
      date: BET 1642 AND 21 MAY 1644
      note: Alive for the conveyance of 1642; dead when his widow and sons went to law in May 1644.
      cite:
      - source: tek_c02
        page: regest Nr 1420 (1642)
      - source: dec1644
        page: doc 1
      - source: konin145
        page: doc 1
  T011:
    given: Anna
    surname: Słonecka (z Słończyc)
    sex: F
    rule: holder
    events:
    - type: EVEN
      label: Held Trąbczyn for life as widow
      date: 1644
      note: Stanisław's widow, lady of his estates by dower and life interest ("Dominam Reformatoriam et Advitalem"), holding them with her sons.
      cite:
      - source: dec1644
        page: doc 1
    - type: EVEN
      label: Consented to the conveyance of Trąbczyn
      date: '1642'
      cite:
      - source: tek_c02
        page: regest Nr 1420 (1642)
    - type: EVEN
      label: Widow with a life interest in the estates; cited with her sons
      date: '1644'
      cite:
      - source: dec1644
        page: doc 1
      - source: konin145
        page: doc 1
    notes:
    - Daughter of Jan Słonecki and Elżbieta Chwalibowska (the regest of 1614).
  T012:
    given: Marcin
    surname: Otto-Trąmpczyński
    sex: M
    rule: child
    events:
    - type: EVEN
      label: Cited with his mother and brothers by Jerzy Chełmski of Łukom
      date: '1644'
      cite:
      - source: dec1644
        page: doc 1
  T013:
    given: Wojciech
    surname: Otto-Trąmpczyński
    sex: M
    rule: child
    events:
    - type: EVEN
      label: Cited with his mother and brothers by Jerzy Chełmski of Łukom
      date: '1644'
      cite:
      - source: dec1644
        page: doc 1
    notes:
    - Not the Wojciech of the elder generation.
  T014:
    given: Andrzej
    surname: Otto-Trąmpczyński
    sex: M
    rule: child
    events:
    - type: EVEN
      label: Cited with his mother and brothers by Jerzy Chełmski of Łukom
      date: '1644'
      cite:
      - source: dec1644
        page: doc 1
  T015:
    given: Maria
    surname: Otto-Trąmpczyńska
    sex: F
    rule: child
    notes:
    - Married Maciej Debrzyński. She is named by the database only; the documents have Debrzyński only as the man to whom Stanisław made over the estate.
  T016:
    given: Marianna
    surname: Zawadzka
    sex: F
    rule: spouse
  T017:
    given: Maciej
    surname: Debrzyński
    sex: M
    rule: party
    events:
    - type: EVEN
      label: Bought Trąbczyn
      date: '1642'
      note: Trąbczyn, Nowa Wieś, Łazy and Osiny for 20,000 złp (most likely a redeemable sale); a "possessor" beside the family in 1644, and in 1663 the estate was held again by Władysław Otto-Trąmpczyński.
      cite:
      - source: tek_c02
        page: regest Nr 1420 (1642)
      - source: konin145
        page: doc 1
    notes:
    - Son of Wojciech Debrzyński (the regest of 1642).
  T018:
    given: Władysław
    surname: Otto-Trąmpczyński
    sex: M
    rule: holder
    page: /people/wladyslaw-otto-trampczynski/
    events:
    - type: EVEN
      label: Held Trąbczyn
      date: '1663'
      place: trabczyn
      note: Held Trąbczyn, Łazy, Osiny and the mill of Drzazgi; recorded his wife's dowry of 15,000 złp on half of them.
      cite:
      - source: tek_c03
        page: regest Nr 1425 (1663)
    - type: DEAT
      date: BET 1663 AND 1671
      note: Dead by 1671, when his widow Anna Bojanowska is recorded in her second marriage; the decrees speak of him as "the late" Władysław.
      cite:
      - source: tek_c03
        page: regest Nr 1425 (1663)
      - source: teki1671
        page: regest Nr 15 (1671)
      - source: konin145
        page: doc 1, pp. 0686_a2-0687_a1
    notes:
    - Married to Anna Bojanowska by 1663, when the regest already calls her his wife.
  T019:
    given: Anna
    surname: Bojanowska
    sex: F
    rule: spouse
    events:
    - type: EVEN
      label: Her dowry of 15,000 złp recorded on half of Trąbczyn
      date: '1663'
      note: Daughter of Mikołaj Bojanowski; with her cousins Stefan and Samuel Bojanowski she sold Baworówko that year.
      cite:
      - source: tek_c03
        page: regest Nr 1425 (1663)
    - type: EVEN
      label: Sold Trąbczyn
      date: '1698'
      note: A widow "of the first marriage Trąmpczyńska, then Golińska"; with her sons Jan and Andrzej, and in the name of her son Władysław, she sold Trąbczyn to Jan na Kolno Prusimski on the Monday after St Margaret 1698, under a penalty of 90,000 złp.
      cite:
      - source: konin145
        page: doc 1, pp. 0686_a2-0687_a1
    notes:
    - Second marriage to a Goliński, the database's Jan Goliński.
  T020:
    given: Jan (Łoś)
    surname: Goliński
    sex: M
    rule: connector
    events:
    - type: EVEN
      label: Recorded a life estate for Anna Bojanowska, widow of Władysław Otto-Trąmpczyński, in their second marriage
      date: '1671'
      cite:
      - source: teki1671
        page: regest Nr 15 (1671)
    - type: OCCU
      label: Land burgrave (burgrabia ziemski) of Konin
      cite:
      - source: mdb
        page: dw.34113
    notes:

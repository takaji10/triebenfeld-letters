# The maps the edition refers to (docs/GAZETTEER_PLAN.md, "The maps").
#
# Keyed by a short slug; `cited_as` is the editor's own short form in the
# gazetteer ("Gilly 1802"), which the gazetteer's map appearances are parsed
# from. A map is in the edition once its image is brought in
# (docs/ADDING_A_MAP.md): it has `in_project: true`, its page and its card
# on the Maps page (docs/MAPS_SITE_PLAN.md). The editor chooses which maps
# come in, one at a time (2026-10-23: "I will be selective with them");
# a map not chosen keeps this short entry for the gazetteer's citations.
#
#   cited_as    the editor's short form, exactly as in their text
#   year        the year in the short form (the map's date, as the editor has it)
#   title, maker, scale, holder, reference, url
#               the map's full description, to be filled in when the map is
#               brought in (from the editor's Maps folder or its archive)
#   kind        estate | parish | regional | topographic | military | town |
#               sketch | atlas
#   in_project  false until the image is in the edition
#
# Two of the editor's short forms name a place and a year (Łukom 1766,
# Trąbczyn 1790, Zagorowo 1799, Zagórów 1841, Słupca 1957, Wreschen 1901,
# Hohensalza 1942): the parser matches only the exact form with its year.

maps:
  blaeu1665:
    cited_as: "Blaeu 1665"
    year: 1665
    kind: atlas
    in_project: false
  lukom1766:
    cited_as: "Łukom 1766"
    year: 1766
    kind: estate
    # The pilot map (the editor, 2026-10-23: "go ahead with the Łukom map ...
    # Let's only do this one map for now"); docs/ADDING_A_MAP.md.
    title: "Plan dóbr Łukom"
    title_en: "Plan of the Łukom estate"
    holder: "Archiwum Główne Akt Dawnych, Warsaw (AGAD)"
    reference: "1/407/0/-/283, sheet 29"
    url: "https://www.szukajwarchiwach.gov.pl/en/jednostka/-/jednostka/17930967"
    # Drawn with south at the top (the editor, 2026-10-23). The original here
    # is the editor's copy turned so that north is up, the image they
    # georeferenced on MapWarper: its lettering is therefore upside down, and
    # the labelling page and the viewer turn it by view_rotation so that it
    # reads upright. Every mark is in this image's pixels.
    orientation: south-up
    view_rotation: 180
    original: 'J:/Documents/Archive/Genealogy/References/Maps/First Polish Republic (1314-1793)/Plan dóbr Łukom, 1766 (1.407.0.-.283 - 29)/1_407_0_0_283-29_0001.png'
    width: 10280
    height: 8523
    crop: null          # [left, top, width, height] in original pixels; null for the whole map
    mapwarper: 75552
    tiles: "https://takaji10.github.io/triebenfeld-maps/lukom1766/info.json"
    in_project: true    # its tiles published, its viewer page built (2026-10-27, docs/MAPS_SITE_PLAN.md)

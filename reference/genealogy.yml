      liegt im Ordner des Werks; nichts davon wird hier gezeigt.


  # ------------------------------------------------------------------
  # The holders of Trąbczyn before the Prusimskis, and the Prusimskis'
  # coming (2026-11-12, the editor: "create people entries for the main
  # people connected to the Trąbczyn estate, and cite the relevant Teki
  # Dworzaczka entries"). The Trąmpczyńskis are a family entry of the
  # edition (people.yml `trampczynski`), its pattern matching the surname
  # only in five documents; so each person is a standalone block, his own
  # heading and bio, and every fact cites the document or the regest
  # (literature `tekidworzaczka`) that states it. The slugs are not
  # entries' slugs (a standalone block's slug must not be one). Most facts
  # are from the boundary decree of 1775 (APP 53/17/0/-/Konin Gr.145),
  # which recites the Trąmpczyński title deeds from 1522 to 1698. What is
  # inference rather than statement is said in docs/NEEDS_CONFIRMATION.md,
  # "The Trąmpczyński family and Jan na Kolno Prusimski".
  # ------------------------------------------------------------------

  trampczynski:
    # The family entry (people.yml `trampczynski`) given a page of its own,
    # 2026-11-12: its heading, bio and five documents are the entry's; the
    # block adds only `members:`, the people of the family who have pages,
    # so that the People page leads to them (a standalone page is linked
    # from nowhere else). Not standalone: the collision of 2026-10-22 was a
    # standalone block's own heading and bio under this slug.
    members:
      - name: "Jan Otto-Trąmpczyński (the elder)"
        link: jan-otto-trampczynski-elder
        dates: "d. before 1584"
        note: "co-heir of Trąbczyn; his sons shared it with their uncle Wojciech"
      - name: "Wojciech Otto-Trąmpczyński"
        link: wojciech-otto-trampczynski
        dates: "documented 1584–1595"
        note: "co-heir of Trąbczyn, Jan's brother and his sons' guardian"
      - name: "Stanisław Otto-Trąmpczyński"
        link: stanislaw-otto-trampczynski
        dates: "d. 1642–1644"
        note: "Wojciech's son, heir of Trąbczyn"
      - name: "Władysław Otto-Trąmpczyński"
        link: wladyslaw-otto-trampczynski
        dates: "d. before 1693"

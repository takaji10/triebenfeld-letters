graves: "11 identifiable, a few unidentified"
visited: "2023"
account_en: >-
  This cemetery is located just within the northern edge of the large
  forest complex that stretches across the southern part of the old
  Trąbczyn estate through Łazińsk Pierwszy and Łazińsk Drugi and sits on a
  slightly elevated piece of land. Most of the graves are overgrown with
  moss, and some are missing their headstones. A large wooden cross (likely
  installed in recent times) lays on the ground.
account_de: >-
  Dieser Friedhof liegt unmittelbar innerhalb des Nordrandes des großen
  Waldkomplexes, der sich über den südlichen Teil des alten Gutes Trąbczyn
  hinzieht, durch Łazińsk Pierwszy und Łazińsk Drugi, und steht auf einem
  leicht erhöhten Stück Land. Die meisten Gräber sind mit Moos überwuchert,
  und einigen fehlen ihre Grabsteine. Ein großes Holzkreuz (wohl in
  neuerer Zeit aufgestellt) liegt am Boden.

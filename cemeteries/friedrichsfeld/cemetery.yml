title: "Friedrichsfeld"
title_de: "Lutherischer Friedhof in Friedrichsfeld"
# The place's page-name today is the gazetteer's tarszewo (the colony
# founded as Kolonia Friedrichsfeld, renamed Tarszewo in 1891).
place: tarszewo
place_name: "Friedrichsfeld (Tarszewo)"
place_name_de: "Friedrichsfeld (Tarszewo)"
graves: "Less than five"
visited: "2023"
account_en: >-
  The cemetery at Friedrichsfeld may have also served the nearby colony of
  Adelhof (Chruściki). It is located in a small sandy forest grove
  northeast of Kopojno. Only a few remnants of graves remain in a small
  cluster, overgrown with moss and trees, with no standing headstones.
account_de: >-
  Der Friedhof in Friedrichsfeld hat wohl auch der nahen Kolonie Adelhof
  (Chruściki) gedient. Er liegt in einem kleinen sandigen Waldhain
  nordöstlich von Kopojno. Nur wenige Grabreste sind in einer kleinen
  Gruppe übrig, überwuchert von Moos und Bäumen, ohne stehende Grabsteine.

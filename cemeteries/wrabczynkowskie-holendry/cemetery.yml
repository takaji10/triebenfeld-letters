account_en: >-
  Wrąbczynkowskie Holendry cemetery is located on a hill on the western
  edge of a large area of forest that is west of Zagórów. The condition of
  the graves is relatively well-preserved, as many are still standing
  upright, with preserved nameplates.
account_de: >-
  Der Friedhof von Wrąbczynkowskie Holendry liegt auf einem Hügel am
  westlichen Rand eines großen Waldgebietes westlich von Zagórów. Der
  Zustand der Gräber ist verhältnismäßig gut erhalten, da viele noch
  aufrecht stehen und ihre Namensschilder bewahrt haben.

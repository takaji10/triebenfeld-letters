account_en: >-
  The cemetery at Orlina Duża is the largest of the cemeteries in the area,
  and also includes a low stone wall that surrounds the property. There are
  signs of upkeep, along with a contemporary wooden cross that stands in
  the cemetery. Many headstones are well-preserved and still standing
  upright. There appeared to be a separate section for infants. Notably,
  there is a larger unique carved stone gravestone for the Jursch family,
  which mentions a birth of Gustav Jursch in Pleschen (Pleszew), located 20
  kilometres south. Gustav Jursch appears to be the oldest person found in
  the survey of cemeteries, with a birth year from the 18th century (1797).
  The three headstones of the Jesse family are also unique in that they
  appear to be recently repainted—the letters are painted gold, and the
  background of the nameplates is white, and a layer of glass has been
  added to cover the face of the nameplates. The headstones also have
  inscriptions on the backside, similarly painted and protected with glass.

  The original cantor's house still stands and is located across the road
  from the cemetery; its original function indicated by a metal cross
  affixed to its roof. The building appears to be inhabited, and is
  constructed of bog iron masonry and features carved wooden doors which
  may be original to the building.
account_de: >-
  Der Friedhof in Orlina Duża ist der größte der Friedhöfe der Gegend und
  hat eine niedrige steinerne Mauer, die das Grundstück umgibt. Es gibt
  Zeichen der Pflege, neben einem hölzernen Kreuz der Gegenwart, das auf
  dem Friedhof steht. Viele Grabsteine sind gut erhalten und stehen noch
  aufrecht. Es schien einen eigenen Abschnitt für Säuglinge zu geben.
  Bemerkenswert ist ein größerer, einzigartiger gemeißelter Grabstein für
  die Familie Jursch, der eine Geburt Gustav Jurschs in Pleschen (Pleszew),
  zwanzig Kilometer südlich, nennt. Gustav Jursch scheint die älteste
  Person zu sein, die die Aufnahme der Friedhöfe fand, mit einem
  Geburtsjahr aus dem 18. Jahrhundert (1797). Die drei Grabsteine der
  Familie Jesse sind dazu einzigartig, dass sie offenbar kürzlich neu
  gefasst wurden — die Buchstaben sind goldfarben gemalt, der Grund der
  Namensschilder weiß, und eine Schicht Glas deckt die Fläche der
  Namensschilder. Die Grabsteine tragen auch Inschriften auf der Rückseite,
  ebenso gemalt und mit Glas geschützt.

  Das ursprüngliche Kantorenhaus steht noch und liegt gegenüber dem
  Friedhof, seine ursprüngliche Funktion an einem Metallkreuz zu erkennen,
  das auf seinem Dach befestigt ist. Das Gebäude scheint bewohnt zu sein,
  ist aus Raseneisenerz-Mauerwerk gebaut und trägt geschnitzte hölzerne
  Türen, die ursprünglich zum Gebäude gehören können.

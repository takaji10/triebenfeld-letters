account_en: >-
  A feature signed Willi Spatz in the Ostdeutscher Beobachter of 19 July 1942,
  the NSDAP's daily for the Reichsgau Wartheland at Posen, on the "purely
  German settlement" of Lazinsk, Łazińsk, in the Amtsbezirk Drommin, the
  wartime name of the commune of Trąbczyn. It walks from Konin southwest along
  the Warta to the village of some 170 families beside Michalinow. It gives
  the founding in 1718 by fourteen families out of Silesia led by the village
  headman, the families Kuhn, Merk, Schönfisch and Haupt, and a cemetery of
  1727 on the hill. The cantor school taught German children until 1933, when
  the teacher and farmer Mielke built a new German school at his own expense;
  he was moved to Galicia in 1937, dismissed in 1939 and back that autumn as
  head of the school, with four teachers over 153 German children. The paper
  was the party's organ under the occupation, and its judgements are its own.
account_de: >-
  Ein von Willi Spatz gezeichnetes Feuilleton im Ostdeutschen Beobachter vom
  19. Juli 1942, der Tageszeitung der NSDAP für den Reichsgau Wartheland in
  Posen, über die „rein deutsche Siedlung“ Lazinsk, Łazińsk, im Amtsbezirk
  Drommin, dem Kriegsnamen der Gemeinde Trąbczyn. Es wandert von Konin
  südwestlich die Warthe entlang zu dem Dorf von etwa 170 Familien neben
  Michalinow. Es nennt die Gründung 1718 durch vierzehn Familien aus Schlesien
  unter dem Dorfschulzen, die Familien Kuhn, Merk, Schönfisch und Haupt und
  einen Friedhof von 1727 auf dem Hügel. Die Kantorschule unterrichtete
  deutsche Kinder bis 1933, als der Lehrer und Bauer Mielke auf eigene Kosten
  eine neue deutsche Schule baute; 1937 wurde er nach Galizien versetzt, 1939
  entlassen und im Herbst desselben Jahres als Leiter der Schule
  zurückgekehrt, mit vier Lehrern für 153 deutsche Kinder. Das Blatt war das
  Organ der Partei unter der Besatzung, und seine Urteile sind seine eigenen.


# A detailed summary of the contents, written from a reading of the whole
# item (kept even though the item is shown whole: the summaries are what a
# question is put to first).
summary_en: >-
  A feature article in the Ostdeutscher Beobachter, Jg. 4, Nr. 197 (19 July
  1942), "225 Jahre alte deutsche Siedlung im Wartheland", subtitled
  "Schlesier begründeten im Jahre 1718 das heutige Lazinsk — Kantoratsschule
  bis 1933", signed Willi Spatz. The article opens with the paper's standing
  theme — the attentive observer keeps meeting witnesses of the work and life
  of the Germans' forefathers in the eastern territory — and then walks out
  of Konin southwest along the Warta into the Amtsbezirk Drommin, to which,
  beside Michalinow, the "purely German settlement" of Lazinsk belongs (the
  editor's rulings of 2026-10-22: Drommin is the wartime name of the rural
  commune of Trąbczyn, and Lazinsk the German-era name of Łazińsk — the
  colony the register records as Trąbczyńskie Stare Olędry). The writer met
  there the ethnic-German teacher and farmer Mielke, and reports
  from their long conversation. The paper dates the settlement's foundation
  to the year 1718, when fourteen German families from Silesia, the village
  headman at their head, set out east as "pioneers of German cultural will";
  some families are said to be provably named Kuhn, Merk, Schönfisch and
  Haupt, names the village of about 170 families still bears. A picture of
  "the ancient cantor school" stands in the column, photographed by Spatz.
  Beside the school, on a gently rising hill, lies a small, tree-rich
  cemetery laid out with its first grave in 1727, where the custom of wooden
  or iron grave tablets — long forgotten in the "old Reich territory", the
  paper says, whose cemetery practice had moved with modern technique — was
  kept by the Germans "enclosed in foreign ethnicity". The cantor school, in
  which the church service was also held, stood until 1933: in that year
  teacher Mielke resolved, from his own means, to have a new German school
  built near the old one — the paper sets the resolve in the year Hitler took
  the Reich's fortunes in hand. The Poles are said to have let him work only
  four years more, then to have transferred him to Galicia and taken the
  school unlawfully for a Polish school, and in 1939 to have dismissed him
  altogether as "dangerous" even in his Galician banishment. With the Polish
  state's collapse "in 18 days" in the autumn of 1939, the article closes:
  the returned teacher began at once in the school that was German again,
  of which he has been head since 1940; four teachers, among them his sister
  and two young teachers from Thuringia, now teach 153 German children, and
  all spoke of the joy their work gives them. The settlement is left with the
  paper's own moral: it held itself German through the "steady struggle
  against Slavdom", and its unbending endurance found its fairest reward in
  the return to the great German fatherland. The paper's date of 1718 stands against the records, which carry the colony from the 1746
  foundation (the register; Chodyła 2015) and first attest the Nowe
  Olędry in 1776: the difference is the article's own, recorded here because
  the edition keeps to the documents.
summary_de: >-
  Ein Aufsatz im Ostdeutscher Beobachter, Jg. 4, Nr. 197 (19. Juli 1942),
  „225 Jahre alte deutsche Siedlung im Wartheland", untertitelt „Schlesier
  begründeten im Jahre 1718 das heutige Lazinsk — Kantoratsschule bis 1933",
  gezeichnet Willi Spatz. Der Aufsatz beginnt mit dem stehenden Thema des
  Blattes — der aufmerksame Betrachter stößt immer wieder auf Zeugen der
  Arbeit und des Lebens der Vorfahren der Deutschen im Ostraum — und geht
  dann aus Konin südwestlich an der Warthe entlang in den Amtsbezirk Drommin,
  zu dem neben Michalinow die „rein deutsche Siedlung" Lazinsk gehört (des
  Editors Entscheidungen vom 2026-10-22: Drommin ist der kriegszeitliche
  Name der Landgemeinde Trąbczyn, und Lazinsk die Namensform der deutschen
  Besatzungszeit für Łazińsk — die Kolonie, die das Register als
  Trąbczyńskie Stare Olędry führt). Der
  Schreiber traf dort den volksdeutschen Lehrer und Bauern Mielke und
  berichtet aus ihrem langen Gespräch. Das Blatt datiert die Gründung der
  Siedlung auf das Jahr 1718, als vierzehn deutsche Familien aus Schlesien,
  der Dorfschulze an der Spitze, als „Pioniere deutschen Kulturwillens" gen
  Osten aufbrachen; einige Familien seien nachweisbar Kuhn, Merk, Schönfisch
  und Haupt geheißen, Namen, die das Dorf von etwa 170 Familien noch heute
  trage. Ein Bild der „uralten Kantoratsschule" steht in der Spalte,
  photographiert von Spatz. Neben der Schule liegt auf einem sanft
  ansteigenden Hügel ein kleiner, baumreicher Friedhof, angelegt mit dem
  ersten Grab 1727, auf dem sich der Brauch hölzerner und eiserner
  Grabtafeln hielt — „im großen Deutschen Reich längst vergessen", so das
  Blatt, dessen Friedhofspflege im „alten Reichsgebiet" mit der modernen
  Technik neue Wege ging, bei den Deutschen, „von fremdem Volkstum
  eingeschlossen". Die Kantoratsschule, in der auch der Gottesdienst
  gehalten wurde, diente bis 1933: in diesem Jahr beschloß Lehrer Mielke,
  aus eigenen Mitteln nahe der alten eine neue deutsche Schule bauen zu
  lassen — das Blatt stellt den Entschluß in das Jahr, da Hitler die
  Geschicke des Reiches in seine Hände nahm. Die Polen hätten ihn nur vier
  Jahre weiter gewähren lassen, ihn dann nach Galizien versetzt und die
  Schule sich rechtswidrig zu einer polnischen Schule angeeignet, und 1939
  ihn ganz entlassen, weil er ihnen selbst in der galizischen Verbannung zu
  „gefährlich" erschien. Mit dem Zusammenbruch des polnischen Staates „in 18
  Tagen" im Herbst 1939 schließt der Aufsatz: der zurückgekehrte Lehrer
  begann sogleich in der nun wieder deutschen Schule, deren Leiter er seit
  1940 ist; vier Lehrkräfte, unter ihnen seine Schwester und zwei junge
  Lehrkräfte aus Thüringen, unterrichten jetzt 153 deutsche Kinder, und
  alle sprachen von der Freude, die ihre Arbeit ihnen macht. Die Siedlung
  wird mit der Moral des Blattes verlassen: deutsch erhalten hat sie sich
  im „stetig währenden Kampf gegen das Slawentum", und ihr unbeugsames
  Ausharren fand seinen schönsten Lohn in der Rückkehr zum großen deutschen
  Vaterland. Das Datum des Blattes, 1718, steht gegen die Aufzeichnungen, die die Kolonie von der Gründung von 1746 führen (das
  Register; Chodyła 2015) und die Nowe Olędry erstmals 1776 bezeugen:
  der Unterschied ist des Aufsatzes eigener und wird hier vermerkt, weil die
  Edition bei den Dokumenten bleibt.

account_en: >-
  A notice in the "Kronika ekonomiczna" of the Warsaw daily Słowo, no. 2 of 4
  January 1892, page 3, gathering two sales of landed estates. The Tomisławice
  estate in the Turek powiat, of 17 włókas, was bought from Mr Repphan by Mr
  Lutostański for 31,000 silver rubles. "Majątek Trąbczyn, w pow. słupeckim,
  150 włók, nabyła od hr. Miączyńskiego hr. Władysławowa Wielopolska za
  225,000 rs.": the Trąbczyn estate in the Słupca powiat, of 150 włókas, was
  bought from Count Miączyński by Countess Władysławowa Wielopolska, the wife
  of a Władysław Wielopolski, for 225,000 silver rubles. The włóka is the old
  Polish field measure.
account_de: >-
  Eine Notiz in der „Kronika ekonomiczna“ der Warschauer Tageszeitung Słowo,
  Nr. 2 vom 4. Januar 1892, Seite 3, die zwei Verkäufe von Landgütern
  zusammenfasst. Das Gut Tomisławice im Powiat Turek, 17 Włókas groß, kaufte
  Herr Lutostański von Herrn Repphan für 31.000 Silberrubel. „Majątek
  Trąbczyn, w pow. słupeckim, 150 włók, nabyła od hr. Miączyńskiego hr.
  Władysławowa Wielopolska za 225,000 rs.“: Das Gut Trąbczyn im Powiat Słupca,
  150 Włókas groß, kaufte Gräfin Władysławowa Wielopolska, die Frau eines
  Władysław Wielopolski, vom Grafen Miączyński für 225.000 Silberrubel. Die
  Włóka ist das alte polnische Feldmaß.


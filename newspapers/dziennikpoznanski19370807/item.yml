# A detailed summary of the contents, written from a reading of the whole
# item (kept even though the item is shown whole: the summaries are what a
# question is put to first).
summary_en: >-
  Three anonymous municipal notes from Zagórów, each closed by the siglum
  "(mat)". First, "Recruitment of the unemployed for Germany": in the last
  recruitment of seasonal agricultural workers for Germany about sixty people
  were sent off from the town of Zagórów, and more than one of them has
  already sent his family a little of his hard-earned cash; the workers'
  departure has relieved the municipal budget. Second, "The moving of the old
  people's home": the home, so far in a building rented from Mrs Wiznerowa in
  Zagórów and unsuitable in its rooms, has been moved by the Municipal Board
  to a property of the heirs of Ignacy Ciszewski in the village and commune
  of Oleśnica, about 300 metres from the old home; the property stands in a
  brick building by the highway leading from Zagórów through Oleśnica to
  Konin, in which nobody else will live besides the home, so the old folk
  will have fresh air and full freedom in the adjoining garden, to the good
  of their aged years; the supervision of the home has been given to the
  deputy mayor of the Municipal Board of Zagórów, Franciszek Łukaszewski.
  Third, "From the town's management": the Board of the town of Zagórów,
  wishing the town a comely appearance, has set about building pavements; the
  work has been begun, and trees, adorning the town, will be planted along
  the pavements.
summary_de: >-
  Drei anonyme städtische Notizen aus Zagórów, jede mit der Signatur „(mat)“
  geschlossen. Erstens „Anwerbung der Erwerbslosen für Deutschland“: bei der
  letzten Anwerbung saisonaler landwirtschaftlicher Arbeiter für Deutschland
  wurden aus der Stadt Zagórów etwa sechzig Personen abgeschickt, und mancher
  von ihnen hat der Familie schon etwas erarbeitetes Geld geschickt; der
  Wegzug der Arbeiter entlastet den Stadthaushalt. Zweitens „Die Verlegung
  des Altenheims“: das Heim, bisher in einem von Frau Wiznerowa in Zagórów
  gemieteten und in seinen Räumen unzureichenden Gebäude, ist vom
  Magistrat auf ein Grundstück der Erben von Ignacy Ciszewski im Dorf und in
  der Gemeinde Oleśnica verlegt worden, etwa 300 Meter vom alten Heim; das
  Grundstück liegt in einem massiven Gebäude an der Chaussee von Zagórów über
  Oleśnica nach Konin, in dem außer dem Heim niemand sonst wohnen wird, so
  daß die Alten frische Luft und volle Freiheit im angrenzenden Garten haben
  werden, zu ihrem hohen Alter gut; die Aufsicht über das Heim ist dem
  Vizebürgermeister des Magistrats von Zagórów, Franciszek Łukaszewski,
  übertragen worden. Drittens „Aus der Verwaltung der Stadt“: der Magistrat
  der Stadt Zagórów hat, weil die Stadt ein ansehnliches Aussehen haben soll,
  den Bau von Bürgersteigen begonnen; die Arbeit ist angefangen, und entlang
  der Bürgersteige sollen Bäume gepflanzt werden, die die Stadt schmücken.

account_en: >-
  An anonymous note in the Poznań daily Kurjer Poznański of 12 July 1933,
  headed "Zhitleryzowani koloniści" ("Hitlerized colonists" - the
  completive z- of Zhitleryzowani is the print's own, the word set solid).
  The German colonists of the rural communes of Oleśnica, Trąbczyn and
  Szymanowice around Zagórów, whose colonies once bore German names
  (Emilienhain, Ludwigslust), have, since Hitler took power in Germany,
  "as if something turned over in their heads": at the commune office they
  make themselves heard in German, not Polish, and the colonists' children
  at school answer German to a Polish "dzień dobry". The note closes with
  an incident: on the school inspector's visit to a school where an
  Evangelical taught, not one of the German colonists' children came, and
  the teacher was dismissed from his post after it.
account_de: >-
  Eine anonyme Notiz in der Posener Tageszeitung Kurjer Poznański vom
  12. Juli 1933, überschrieben „Zhitleryzowani koloniści“ („hitlerysierte
  Kolonisten“; das kompletive z- von Zhitleryzowani ist des Drucks eigene
  Schreibung, das Wort zusammen gesetzt). Die deutschen Kolonisten der
  Landgemeinden Oleśnica, Trąbczyn und Szymanowice um Zagórów, deren
  Kolonien einst deutsche Namen trugen (Emilienhain, Ludwigslust), haben,
  seit Hitler in Deutschland die Macht übernommen hat, „als ob sich ihnen
  im Kopf etwas verdreht hätte“: im Gemeindeverset sprechen sie deutsch,
  nicht polnisch, und die Kinder der Kolonisten antworten in der Schule
  auf ein polnisches „dzień dobry“ („guten Tag“) deutsch. Die Notiz
  schließt mit einem Vorfall: bei dem Besuch des Schulinspektors in einer
  Schule, in der ein Evangelischer unterrichtete, kam keins der Kinder der
  deutschen Kolonisten, und der Lehrer wurde nach dem Vorfall von seiner
  Stelle entlassen.

# A detailed summary of the contents, written from a reading of the whole
# item (kept even though the item is shown whole: the summaries are what a
# question is put to first).
summary_en: >-
  An anonymous note, one paragraph, headed "Zhitleryzowani koloniści".
  The country around Zagórów - the rural communes of Oleśnica, Trąbczyn
  and Szymanowice - is inhabited by a considerable number of German
  colonists; the colonies they live in once bore German names, e.g.
  Emilienhain, Ludwigslust. Since Hitler took power in Germany this
  population has, as it were, had something turn over in its head: for
  example, when business is done at the commune office they make
  themselves heard not in Polish but in German; and the colonists'
  children who attend school answer in German when they are addressed
  with the words "dzień dobry". The note closes on an incident of the
  latest days: on the arrival of the school inspector at one of the
  schools, in which an Evangelical taught, not one of the German
  colonists' children came to school; the teacher of that school was
  dismissed from his post after the incident.
summary_de: >-
  Eine anonyme Notiz, ein Absatz, überschrieben „Zhitleryzowani koloniści“.
  Die Gegend um Zagórów - die Landgemeinden Oleśnica, Trąbczyn und
  Szymanowice - wird von einer beträchtlichen Zahl deutscher Kolonisten
  bewohnt; die Kolonien, in denen sie leben, trugen einst deutsche Namen,
  z. B. Emilienhain, Ludwigslust. Seit Hitler in Deutschland die Macht
  übernommen hat, hat diese Bevölkerung gleichsam etwas im Kopf verdreht:
  zum Beispiel machen sie sich, wenn auf dem Gemeindeverset Geschäfte
  erledigt werden, nicht polnisch, sondern deutsch vernehmlich; und die
  Kinder der Kolonisten, die die Schule besuchen, antworten deutsch, wenn
  man sie mit den Worten „dzień dobry“ anredet. Die Notiz schließt mit
  einem Vorfall der letzten Tage: bei der Ankunft des Schulinspektors in
  einer der Schulen, in denen ein Evangelischer unterrichtete, kam keins
  der Kinder der deutschen Kolonisten zur Schule; der Lehrer dieser Schule
  wurde nach dem Vorfall von seiner Stelle entlassen.

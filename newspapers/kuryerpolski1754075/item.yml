# A detailed summary of the contents, from the holding's summaries, checked
# against the text (2026-10-16).
summary_en: >-
  A report from Kalisz of 5 December 1754 in the Warsaw newspaper Kuryer
  Polski, no. 75 of 1754, in Polish. At Trąbczyn, five miles from Kalisz, on
  the hereditary estate of the Prusimski family (the print has "Prusiński"),
  the funeral of the late Paweł Prusimski, Chamberlain of His Royal Majesty,
  was held, with many related houses and the Cistercians of the convent of
  Ląd present. The Abbot of Ląd, Głowiecki, had been invited to sing the
  High Mass, but an unexpected frost prevented his crossing the Warta. The
  sermon was preached by the prefect of the schools of the Jesuit college at
  Kalisz, and the funeral oration after the procession was given by his own
  nephew, Antoni Prusimski. At the order of the widow, Katarzyna Prusimska,
  born Rozdrażewska, exequies with vigils and many Masses were held the same
  day in the monasteries nearby, at Pyzdry, Konin and Kaźmierz, as there was
  not room enough in the parish church of Trąbczyn.
summary_de: >-
  Ein Bericht aus Kalisch vom 5. Dezember 1754 in der Warschauer Zeitung
  Kuryer Polski, Nr. 75 von 1754, auf Polnisch. In Trąbczyn, fünf Meilen von
  Kalisch, auf den Erbgütern der Familie Prusimski (im Druck „Prusiński"),
  wurde das Begräbnis des verstorbenen Paweł Prusimski, Kammerherrn Seiner
  Königlichen Majestät, gehalten, in Anwesenheit vieler verschwägerter
  Häuser und der Zisterzienser des Konvents von Ląd. Der Abt von Ląd,
  Głowiecki, war zum Hochamt eingeladen, doch ein unerwarteter Frost
  hinderte ihn, die Warthe zu überqueren. Die Predigt hielt der Präfekt der
  Schulen des Jesuitenkollegs in Kalisch, die Leichenrede nach dem Kondukt
  sein leiblicher Neffe Antoni Prusimski. Auf Anordnung der Witwe, Katarzyna
  Prusimska, geborene Rozdrażewska, wurden am selben Tag in den nahen
  Klöstern von Pyzdry, Konin und Kaźmierz Exequien mit Vigilien und vielen
  Messen gehalten, weil in der Pfarrkirche von Trąbczyn nicht genug Platz
  war.

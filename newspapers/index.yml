# The index rulings for the newspapers (docs/NEWSPAPERS_PLAN.md): which hits
# of the edition's patterns for people and places stand, item by item and
# spelling by spelling, as literature/index.yml rules the books' hits.
#
# Every pair below was read before it was ruled (2026-10-22, from
# review/newspapers/mentions.md, made by newspapers_index.py --sheet). The
# five items: kuryerpolski1754075 (the funeral report of 1754),
# dziennikpoznanski19370807 (the "Z Zagórowa" column of 1937),
# ostdeutscherbeobachter19420197 (the feature on Łazińsk of 1942),
# twojaslupca20150706 (the report of the 775th-anniversary jubilee of
# 2015) and slowo18920104 (the sale notice of 4 January 1892).
people:
  glowiecki:
    "Głowiecki": true     # the abbot of Ląd at the funeral (1754): the item is
                          # where he is named, and nowhere in the corpus
  prusimski:              # Antoni Prusimski, the later Starost of Niszczewice
    "Pruſińſki": true     # "Jmć Pan Antoni Pruſińſki Synowiec Rodzony": the
                          # nephew who gave the funeral oration, the Starost
                          # to be (the pattern's own "Prusinski(?= Synowiec)")
    "Prusimski": true     # "Antoni Prusimski" of the 2015 report, among the
                          # heirs of Trąbczyn who took part in the wars of
                          # national liberation: the register's Starost, of
                          # whom the entry's own identity says he took part
                          # in the uprising of 1794 and lost the estate for
                          # it. The identification is the article's own
                          # context (an heir of Trąbczyn of the name) against
                          # the register's man.
  miaczynski:
    # The 2015 report's heirs-list names "Stanisław hrabia Miączyński, czy
    # Aleksander i Włodzimierz Miączyński". Włodzimierz is the register's
    # other entry (miaczynski-wlodzimierz, the Count, whose pattern is
    # pinned to the summons of 1860 and cannot match here); "Stanisław
    # hrabia Miączyński" and "Aleksander" no ruling of the edition
    # identifies, and the register's own precedent keeps an unidentified
    # later Miączyński off Stanisław's entry (not_in app539680669-2, "Graf
    # Miączyński, owner of Trąbczyn about 1911"). Ruled out until the
    # editor says otherwise (NEEDS_CONFIRMATION, "The newspapers").
    "Miączyński": "no: the 2015 report's heirs-list, taken bare; Włodzimierz
      is the register's miaczynski-wlodzimierz, and 'Stanisław hrabia' and
      'Aleksander' are identified by nothing the edition holds"
  prusimski-pawel:
    "Pruſińſkie": true    # "Pana Pawłá Pruſińſkie-go": the dead chamberlain,
                          # the form the pattern was written for
  prusimska-katarzyna:
    "Pruſińſkiey": true   # "z Rozdrażewſkich Pruſińſkiey": the widow, born
                          # Rozdrażewska, who ordered the exequies
  mielke:
    # The editor's ruling of 2026-10-22: the "volksdeutscher Lehrer und Bauer
    # Mielke" whom the 1942 feature's reporter met at Łazińsk and the "Lehrer
    # Mielke" who had the new school built there in 1933 are the "Mielke seit
    # 1925" of Breyer's notebook (APP 53/968/0/-/669) and the cantor Gustav
    # Adolf Mielke of Słowiński 2023, one man. The two hits follow from the
    # entry (reference/people.yml, held by its only_in to this item and the
    # notebook).
    "Mielke": true        # item line 7 (the meeting on the walk) and line 16
                          # (the school built in 1933)
  lidmanowski:
    # The doctor of Zagórów (reference/people.yml): the Jutrzenka digest of
    # April 1913 names him in its second paragraph - "In the March issue of
    # Zdrowie, Dr. Lidmanowski draws attention to various deficiencies of
    # today's folk attire" - the one text of the Lidmanowski three that
    # carries his name in its body; the two Zdrowie articles are his by
    # their issue's table of contents (the items' accounts cite it) and
    # carry no signature. The item is where the edition's text names him,
    # and nowhere else in the corpus does.
    "Lidmanowski": true

places:
  kalisz:
    "Kaliſza": true       # the report's dateline, from Kalisz
  konin:
    "Koninie": true       # the exequies at the monastery of Konin (1754)
    "Konina": true        # the road from Oleśnica to Konin (1937)
    "Konin": true         # the Kreisstadt Konin on the Warta, where the 1942
                          # article's walk to the Amtsbezirk Drommin begins
  schlesien:
    "Schlesien": true     # the region the fourteen founding families of the
                          # 1942 article set out from ("aus dem Schlesierlande"
                          # the article says too; that spelling is matched by
                          # no pattern)
  lad:
    "Łędzkiego": true     # the Cistercian convent of Ląd (the print's Łędz-
                          # is Ląd: the editor, 2026-10-16)
    "Łędzki": true        # "Opat Łędzki", the abbot of Ląd
  olesnica:
    # The village and commune of Oleśnica of the 1937 item, on the highway
    # from Zagórów to Konin: the register's Oleśnica (Oleszyno 1261, the
    # KDW's), the village the gmina of that name was seated at. Claude's
    # identification from the item's own geography; the editor has not
    # confirmed it (NEEDS_CONFIRMATION, "The newspapers").
    "Oleśnica": true
    "Oleśnicę": true
  trabczyn:
    # The village and the estate, named through the 2015 report: the
    # headline, the lead, the history paragraph ("miejscowość Trąbczyn"),
    # the honours' name "Zasłużony dla wsi Trąbczyn" (twice) and the
    # exhibition "775 lat Trąbczyna". The genitive "Trąbczyna" covers the
    # history paragraph's forms and the exhibition's title. The medieval
    # form "Trampczin" of the report's history paragraph is matched by no
    # pattern of the register (NEEDS_CONFIRMATION, "The newspapers").
    # Słowo (1892): the estate's sale announced in the press — "Majątek
    # Trąbczyn, w pow. słupeckim, 150 włók, nabyła od hr. Miączyńskiego hr.
    # Władysławowa Wielopolska za 225,000 rs." The transfer the wlodzimierz
    # era's ownership line records ("by 1892 Countess Maria Wielopolska");
    # the count selling is the Miączyński of the years between 1879 and
    # that transfer, the nephew Władysław.
    "Trąbczyn": true
    "Trąbczyna": true
    "Trąbczynie": true    # the funeral at Trąbczyn (1754); the jubilee of
                          # 2015 ("w Trąbczynie zorganizowano obchody", the
                          # ground by the school)
    "Drommin": true       # the Amtsbezirk Drommin of the 1942 article: the
                          # occupation's name for the commune of Trąbczyn
                          # (the register's renamed name; the editor,
                          # 2026-10-22: Drommin = Trąbczyn)
  trabczynskie-stare-oledry:
    # The editor's ruling of 2026-10-22: Lazinsk is the German-era name of
    # Łazińsk, the colony the register records as Trąbczyńskie Stare Olędry
    # ("the colony which went by many name variants"). The 1942 article's
    # six hits of the bare German form; Breyer's notebook of 1936 writes the
    # Polish Łazinsk, matched by no pattern.
    "Lazinsk": true
  ludwigslust:
    # The colony of the Zagórów lordship's dismemberment (reference/
    # places.yml, added at the editor's word 2026-10-22): the Kurjer
    # Poznański note names it among the German-named colonies around
    # Zagórów, "np. Emilienhain, Ludwigslust itp." - and its own documents
    # name it before that (Oe 1 Bü 9454, letters 24 and 177).
    "Ludwigslust": true
  wolica:
    "Wolicki": "no: the surname of Józef Wolicki, one of the villagers
      honoured in the 2015 report; the place Wolica is not of the article"
  zagorowo:
    # The town of Zagórów: the 1937 notes are the town's ("m. Zagórowa", the
    # Zarząd miasta), and the item is the first witness of the town the
    # estate stands at in the press of its own day.
    "Zagórowa": true
    "Zagórowie": true

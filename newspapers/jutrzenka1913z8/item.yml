# What the item is, and what kind of witness (the rule of the literature,
# LITERATURE_PLAN section 2, kept here): a popular educational fortnightly
# carrying to its readers what a specialist journal had printed about the
# countryside's clothing. It speaks of Dr. Lidmanowski in the third person
# — "In the March issue of Zdrowie, Dr. Lidmanowski draws attention to
# various deficiencies of today's folk attire" — and presents itself as
# the digest of his article; whether the page carries a signature is open,
# the digitisation not reachable from the working session

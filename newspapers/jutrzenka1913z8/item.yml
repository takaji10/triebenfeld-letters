title: >-
  "Jak się ubiera nasz lud." ("How our people dress"): the folk attire of
  the Kingdom's countryside and its hygiene — the linen shirt and the
  sheepskin coat that costs some fifteen rubles and grows colder each
  year, the leather belt that cuts into the flesh, the foot-wraps and the
  clogs, the tight town shoes of the women, the "American's" starched
  collar and celluloid tie, the newborn swaddled so it cannot sleep —
  carried in the Łódź educational fortnightly from Dr. Lidmanowski's
  article in the March issue of the hygiene journal Zdrowie; whether the
  Jutrzenka page itself is signed is open (NEEDS_CONFIRMATION)

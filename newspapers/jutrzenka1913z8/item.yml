brief_de: >-
  Ein vierseitiges Stück der Łodzer Bildungszeitschrift Jutrzenka von 1913
  darüber, wie das Landvolk des Königreichs sich kleidet — das Leinenhemd des
  Gutsknechts, der Schafpelz von etwa fünfzehn Rubeln, der mit jedem Jahr

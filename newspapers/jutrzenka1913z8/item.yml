# observations of the people among whom the documents move.
account_en: >-
  A four-page piece, "Jak się ubiera nasz lud." ("How our people dress"),
  in Jutrzenka, a fortnightly of general education printed in Łódź, its
  third year, no. 8, of 24 April 1913, pp. 7-10. The piece names its own
  origin in its second paragraph: "In the March issue of Zdrowie, Dr.
  Lidmanowski draws attention to various deficiencies of today's folk
  attire" — the March 1913 issue of the Warsaw Hygiene Society's journal,
  the specialist paper of which Dr. Konstanty Lidmanowski, the physician
  of Zagórów, had an article on the folk attire; this is that article's
  matter, carried to the educational fortnightly's readers. It speaks of
  the doctor in the third person throughout, and the file gives no
  signature: whether the Jutrzenka page itself is signed by him or carries
  an anonymous digest of his Zdrowie article cannot be settled from the
  file, and the digitisation was not reachable from the working session —
  the question is open (NEEDS_CONFIRMATION, "The newspapers"). What it
  records stands whether he wrote it or digested it: how the people of
  the Kingdom's countryside — the same people the documents
  move among — dressed, by wealth from the farmhand to the well-to-do
  farmer, and what the doctor thought of it from the hygienic standpoint.
account_de: >-
  Ein vierseitiger Aufsatz, „Jak się ubiera nasz lud." („Wie kleidet sich
  unser Volk"), in Jutrzenka, einem zweiwöchigen Blatt allgemeiner
  Bildung, gedruckt in Łódź, in seinem dritten Jahre, Nr. 8, vom 24. April
  1913, S. 7-10. Der Aufsatz nennt seinen Ursprung selbst, im zweiten
  Absatz: „In der Märzausgabe von Zdrowie lenkt Dr. Lidmanowski die
  Aufmerksamkeit auf verschiedene Mängel der heutigen Volkstracht" — die
  Märzausgabe 1913 der Zeitschrift der Warschauer Hygienischen Gesellschaft,
  der Fachzeitschrift, in der Dr. Konstanty Lidmanowski, der Arzt von
  Zagórów, einen Aufsatz über die Volkstracht hatte; dies ist der Stoff
  jenes Aufsatzes, den Lesern des Bildungsblattes getragen. Er spricht
  durchweg vom Arzt in der dritten Person, und die Datei gibt keine
  Unterschrift: ob die Seite der Jutrzenka selbst von ihm gezeichnet ist
  oder einen anonymen Auszug seines Zdrowie-Aufsatzes trägt, lässt sich
  aus der Datei nicht entscheiden, und die Digitalisierung war von der
  Arbeitssitzung aus nicht erreichbar — die Frage ist offen
  (NEEDS_CONFIRMATION, „Die Zeitungen"). Was das Stück festhält, gilt, ob Lidmanowski es
  schrieb oder ein anderer es aus ihm auszog: wie die Leute des polnischen Landessss — dieselben
  Leute, unter denen die Dokumente sich bewegen — sich
  kleideten, nach Vermögen vom Gutsknecht bis zum wohlhabenden Bauern, und
  was der Arzt davon vom hygienischen Standpunkt hielt.


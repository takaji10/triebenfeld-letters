# A detailed summary of the contents, written from a reading of the whole
# item (kept even though the item is shown whole: the summaries are what a
# question is put to first).
summary_en: >-
  "Jak mieszka lud nasz?", Zdrowie R. XXX, z. 6 (1914), pp. 432-440, by Dr.
  Konstanty Lidmanowski of Zagórów. The Polish village stands huddled to
  the earth, its cottages clay huts that mock hygiene; the peasant is
  ignorant, and therefore poor, and has never heard of the rules of
  hygiene. In many years of visiting the dwellings of his people almost
  daily, the doctor examined 1,200 dwellings of independent farmers, 80 of
  manor stable hands and labourers, and 140 of men who work for daily
  wages at home or go out to summer work abroad, measuring the rooms in
  steps of 3/5 of a metre. The farmyard: house at the front, barn
  opposite, cowsheds, stables and pigsties at the sides, a garden with
  fruit trees before the house, the manure pile near the middle, the well
  often beside it, and the latrine "something almost completely unknown".
  Houses are built of clay (the old ones of wood, some of iron ore, the
  newer of brick with lime only to a cubit above the foundation), roofed
  with straw. Of the 1,200 farmers' dwellings, 13 had a kitchen and two
  rooms, 86 a kitchen and one room, and 1,101 — 91 per cent — one single
  room serving as kitchen, living room and bedroom. The plan of the
  wealthy farmer's house is described room by room, with the kitchen the
  centre of all life, its stove fed whole days, its tin pipes heating the
  air, 24 cubic metres of kitchen crowding 8 people of the 109 inhabitants
  counted; the wealthier's 86 dwellings owe their cleanliness to the
  housewife, their dampness to the clay; the newest dwellings are the
  cheap cottages of returned foreign workers, floorless or beaten out of
  clay; the poorest farmers' huts, 480 of them without any floor, are
  8 by 6 metres at most, their board floors letting the cellar's vapours
  through. Worst of all are the 80 manor servants' quarters: not one good,
  all damp, some with the walls wet all over, straw mats pinned against
  the wall for a bed's head, one small window nailed shut, the cabbage
  barrel beside the bed and the potatoes under it, in one case a cowshed
  entered directly from the room, the walls over the beds hung with
  twenty fair-bought holy pictures and the vermin nesting behind them;
  the whole furnishing of a farmhand is one bed apiece, a cradle, a cupboard
  for the milk pots, a table, at most three chairs, a linen chest and the
  cabbage barrel — so the stronger leave the service and go abroad for the
  summer, and only the weak and the child-burdened stay. The 140 seasonal
  workers' lodgings are cleaner and drier (32 dry), with wooden floors and
  opening windows, because the man who rents makes demands the landlord
  must meet; yet none is good, and the summer's earnings must be reckoned
  through the winter to the next journey abroad. The conclusion: the
  dwellings are bad from the hygienic standpoint, the uncovered wells
  make disease, the cause is ignorance — but also dear brick, set dear by
  the manufacturers and the middlemen, and the lack of cheap and long-
  term credit; a ray of light under the thatch will change it, and
  education and the development of sound cooperatives will do much.
summary_de: >-
  „Jak mieszka lud nasz?", Zdrowie R. XXX, Heft 6 (1914), S. 432-440, von
  Dr. Konstanty Lidmanowski aus Zagórów. Das polnische Dorf steht an die
  Erde geduckt, seine Häuser Lehmhütten, die die Hygiene verspotten; der
  Bauer ist unwissend, also arm, und hat von den Regeln der Hygiene nie
  gehört. In vielen Jahren, in denen der Arzt fast täglich in den
  Wohnungen seines Volkes war, untersuchte er 1.200 Wohnungen selbständiger
  Bauern, 80 von Gutsknechten und Tagelöhnern und 140 von Männern, die zu
  Tagelöhnen im Lande arbeiten oder zur Sommerarbeit ins Ausland gehen,
  die Stuben in Schritten von 3/5 Meter messend. Der Hof: das Wohnhaus
  vorn, gegenüber die Scheune, an den Seiten Kuh-, Pferd- und Schweinställe,
  vor dem Haus ein Gärtchen mit Obstbäumen, der Misthaufen nahe der Mitte,
  der Brunnen oft neben ihm, und der Abort „eine fast völlig unbekannte
  Sache". Gebaut wird aus Lehm (die alten Häuser aus Holz, manche aus
  Eisenerz, die neueren aus Ziegel, mit Kalk nur bis einen Ellbogen über
  dem Fundament), gedeckt mit Stroh. Von den 1.200 Bauernwohnungen hatten
  13 eine Küche und zwei Stuben, 86 eine Küche und eine Stube, 1.101 — 91 Prozent —
  einen einzigen Raum, der Küche, Wohnstube und Schlafzimmer zugleich ist.
  Der Plan des Hauses des vermögenden Bauern wird Zimmer für Zimmer
  beschrieben, mit der Küche als Mittelpunkt des ganzen Lebens, ihren Ofen,
  der ganze Tage gespeist wird, ihren Blechröhren, die die Luft heizen,
  24 Kubikmeter Küche, in denen sich durchschnittlich 8 der 109 Bewohner
  drängen; die Sauberkeit der 86 Wohnungen der mittleren Kategorie ist der
  Hausfrau zu danken, ihre Feuchtigkeit dem Lehm; die neuesten Wohnungen
  sind die billigen Hütten heimgekehrter ausländischer Arbeiter, ohne
  Fußboden oder mit einem aus Lehm geschlagenen; die Hütten der ärmsten Bauern, 480
  ohne jeden Fußboden, sind höchstens 8 mal 6 Meter, und ihre Bretterböden
  lassen die Dämpfe des Kellers durch. Am schlechtesten sind die 80
  Quartiere der Gutsleute: keines gut, alle feucht, manche mit überall
  nassen Wänden, Strohmatten, an die feuchte Wand genagelt,, ein kleines,
  zugenageltes Fenster, das Kohlfass am Fußende des Bettes und die
  Kartoffeln unter ihm, in einem Fall ein Kuhstall, unmittelbar aus der
  Stube betreten, über den Betten zwanzig auf Märkten gekaufte Heiligenbilder
  und das Ungeziefer dahinter; die ganze Ausstattung eines Gutsknechts ist ein
  Bett je Person, die Wiege, der Schrank für die Milchtöpfe, ein Tisch,
  höchstens drei Stühle, die Wäschetruhe und das Kohlfass — so gehen die
  Stärkeren vom Dienst fort und ins Ausland, und nur die Schwachen und
  die mit kleinen Kindern Beladenen bleiben. Die 140 Quartiere der Saisonarbeiter sind
  sauberer und trockener (32 trocken), mit Holzböden und offenen Fenstern,
  weil der Mieter Forderungen stellt, die der Vermieter erfüllen muss; doch
  keines ist gut, und der Sommerlohn muss durch den Winter gerechnet
  werden bis zur nächsten Reise ins Ausland. Das Fazit: die Wohnungen sind
  hygienisch schlecht, die ungedeckten Brunnen machen Krankheit, die
  Ursache ist die Unwissenheit — aber auch der teure Ziegel, den die
  Hersteller und die Zwischenhändler teuer setzen, und der Mangel an
  billigem und langem Kredit; ein Lichtstrahl unter das Stroh wird es
  ändern, und Aufklärung und der Ausbau tüchtiger Genossenschaften werden
  viel tun.

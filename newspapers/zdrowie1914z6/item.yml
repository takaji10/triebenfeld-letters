# What the item is, and what kind of witness (the rule of the literature,
# LITERATURE_PLAN section 2, kept here): a specialist journal's article by
# the district's own doctor, reporting observations he made himself over
# many years in the houses of his own patients and neighbours. Its facts
# are the kind no other source of the edition records — how the people the
# edition's documents move among actually housed themselves in the last
# years before the war.
account_en: >-
  An article, "Jak mieszka lud nasz?" ("How do our people live?"), by Dr.
  Konstanty Lidmanowski of Zagórów, in Zdrowie, the journal of the Warsaw
  Hygiene Society, year 30, no. 6 of 1914, pp. 432-440. Lidmanowski settled in
  Zagórów as its physician in 1893 and practised there until his death in
  1943; he founded the town's volunteer fire brigade, its loan society and its
  Polish school. He reports a survey of rural dwellings he made himself on his
  rounds, "visiting almost daily the dwellings of our people": 1,200 houses of
  independent farmers, 80 of manor servants and 140 of seasonal labourers,
  measured in steps. Nine in ten of the farmers' houses had a single room for
  kitchen, living room and bedroom. He describes the damp walls, the well by
  the manure pile and the farmhand's room with the cabbage barrel at the foot
  of the bed.
account_de: >-
  Ein Aufsatz, „Jak mieszka lud nasz?“ („Wie wohnt unser Volk?“), von Dr.
  Konstanty Lidmanowski aus Zagórów, in Zdrowie, der Zeitschrift der
  Warschauer Hygienischen Gesellschaft, 30. Jahrgang, Heft 6 von 1914, S.
  432-440. Lidmanowski ließ sich 1893 als Arzt in Zagórów nieder und
  praktizierte dort bis zu seinem Tod 1943; er gründete die Freiwillige
  Feuerwehr, die Darlehenskasse und die polnische Schule der Stadt. Er
  berichtet über eine Untersuchung der ländlichen Wohnungen, die er selbst auf
  seinen Wegen anstellte, „indem ich fast täglich die Wohnungen unseres Volkes
  besuchte“: 1.200 Häuser selbständiger Bauern, 80 von Gutsleuten und 140 von
  Saisonarbeitern, in Schritten vermessen. Neun von zehn Bauernhäusern hatten
  einen einzigen Raum als Küche, Wohnstube und Schlafraum. Er beschreibt die
  feuchten Wände, den Brunnen am Misthaufen und die Knechtskammer mit dem
  Krautfass am Fußende des Bettes.


# 1937 stands beside in its routine. Its facts are worth having exactly
# because no historian else records them, and each is the kind of thing a
# town's or a powiat's own records would confirm.
account_en: >-
  An unsigned report in the Zagórów edition of the Turek weekly Echo Tureckie,
  R. 8, no. 18 (no. 379) of 6 May 1931, under the headline "Zajście w
  Zagórowie", a disturbance in Zagórów. On 24 April the town saw violent
  clashes over the recruiting of seasonal workers for Germany. When the
  season's quota ran out, the workers gathered for the recruiting stoned the
  commission's premises and stormed them a second time, until the police the
  starosta of Słupca brought with him dispersed the crowd and made a dozen
  arrests or more. No one is named, from the commission's chairman to the
  arrested.
account_de: >-
  Ein ungezeichneter Bericht in der Zagórower Ausgabe des Tureker Wochenblatts
  Echo Tureckie, R. 8, Nr. 18 (Nr. 379) vom 6. Mai 1931, unter der Überschrift
  „Zajście w Zagórowie“, ein Zwischenfall in Zagórów. Am 24. April kam es in
  der Stadt zu heftigen Zusammenstößen bei der Anwerbung von Saisonarbeitern
  für Deutschland. Als das Kontingent der Saison erschöpft war, bewarfen die
  zur Anwerbung versammelten Arbeiter die Räume der Kommission mit Steinen und
  stürmten sie ein zweites Mal, bis die Polizei, die der Starost von Słupca
  mitbrachte, die Menge zerstreute und ein Dutzend und mehr festnahm. Niemand
  wird genannt, vom Vorsitzenden der Kommission bis zu den Festgenommenen.


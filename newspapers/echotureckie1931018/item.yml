# A detailed summary of the contents, written from a reading of the whole
# item (kept even though the item is shown whole: the summaries are what a
# question is put to first).
summary_en: >-
  The report, under the headline "Zajście w Zagórowie" (a disturbance in
  Zagórów), opens by dating the events: on 24 April of the current year the
  little town of Zagórów in the Słupca powiat was the scene of violent clashes
  in connection with the recruiting of seasonal workers for work in Germany.
  A so-called recruiting commission has been sitting in the town for several
  days, taking on workers for the seasonal work in Germany. Yesterday — the
  report's own "yesterday", its dispatch's day, the issue of 6 May carrying
  the report nine days after the date it opens with — a huge crowd of workers
  gathered in front of the commission's premises, demanding to be taken on
  for the seasonal work. As the quota was already exhausted, the chairman of
  the commission declared that he could take on no more people. Thereupon the
  crowd took on a threatening air and began to bombard the premises with
  stones. The starosta of the powiat at Słupca, notified of the disturbances,
  came to Zagórów with considerable reinforcements of police, which moved in
  to intervene. At the sight of the navy-blue uniforms — the state police the
  period called the granatowa policja — the workers again stormed the
  premises, showering the police and the members of the commission with a
  hail of stones. The police drawn up in front of the premises set about
  dispersing the crowd; only in the afternoon hours did calm return. The
  police arrested a dozen or more persons who had incited the crowd — the
  report's closing line, set apart from the rest, its comma lost in the
  print's setting.
summary_de: >-
  Der Bericht, unter der Überschrift „Zajście w Zagórowie" (ein Zusammenstoß
  in Zagórów), datiert die Ereignisse gleich zu Anfang: am 24. April des
  laufenden Jahres war das Städtchen Zagórów im Powiat Słupca der
  Schauplatz heftiger Zusammenstöße im Zusammenhang mit der Anwerbung
  saisonaler Arbeiter für die Arbeit in Deutschland. Eine sogenannte
  Anwerbekommission sitzt seit mehreren Tagen in der Stadt und nimmt
  Arbeiter für die saisonale Arbeit in Deutschland auf. Gestern — das
  „gestern" des Berichts selbst, der Tag seines Einsatzes; das Heft vom
  6. Mai brachte den Bericht neun Tage nach dem Datum, mit dem er beginnt —
  versammelte sich eine gewaltige Menge von Arbeitern vor den Räumen der
  Kommission und verlangte, zu der saisonalen Arbeit zugelassen zu werden.
  Da das Kontingent bereits erschöpft war, erklärte der Vorsitzende der
  Kommission, er könne keine Personen mehr aufnehmen. Daraufhin nahm die
  Menge eine drohende Haltung an und begann, die Räume mit Steinen zu
  bombardieren. Der Starost des Powiat in Słupca kam, von den
  Zusammenstößen unterrichtet, mit erheblichen Polizeiverstärkungen nach
  Zagórów; die Polizei schritt zur Intervention. Beim Anblick der
  dunkelblauen Uniformen — der Polizei, die man damals die granatowa
  policja nannte — stürmten die Arbeiter die Räume erneut und überschütteten
  die Polizei und die Mitglieder der Kommission mit einem Hagel von
  Steinen. Die vor den Räumen aufgestellte Polizei begann, die Menge zu
  zerstreuen; erst in den Nachmittagsstunden kehrte die Ruhe ein. Die
  Polizei verhaftete ein Dutzend und mehr Personen, die die Menge
  aufgewiegelt hatten — die Schlußzeile des Berichts, abgesetzt vom
  Übrigen, ihr Komma in der Druckerei verloren.

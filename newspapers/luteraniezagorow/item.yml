# A detailed summary of the contents, written from a reading of the whole
# item (kept even though the item is shown whole: the summaries are what a
# question is put to first).
summary_en: >-
  The page "Zagórów filiał Parafii Ewangelicko - Augsburskiej w Koninie"
  ("Zagórów, the filial of the Evangelical-Augsburg Parish in Konin") on
  Luteranie Konin, the Konin parish's website, headed "Ważniejsze
  wydarzenia z życia Parafii w Zagórowie" ("The more important events in
  the life of the Parish in Zagórów"). The chronicle, in dated entries:
  in the sixteenth century, the Reformation movement conducted by the
  monks of Ląd; in the years 1720-1817, evangelicals arriving from
  Silesia, Pomerania and Prussia, founding villages, raising chapels,
  under the pastoral care of the incumbent of the evangelical parish at
  Września; in the years 1817-1856, the care exercised by the incumbents
  of the parishes of Grodziec, Konin and Żychlin, and a filial of the
  parish of Grodziec founded in Zagórów. Then the entries of the parish's
  own life: 24 December 1856, the erecting of the Parish in Zagórów; 1857,
  the Parish bought the plot for the building of the Church; 8 May 1878,
  the laying of the foundation stone for the Church; the first Sunday in
  Advent 1882, the consecration of the Church; 1913, the building of the
  cantor's house; 16 October 1938, the consecration of the rectory; 18
  July 1954, the first service after the Second World War, celebrated by
  the Rev. Karol Świtalski; 16 June 1995, the consecration of the former
  cantor's house as the Evangelical Senior Citizens' Home by His
  Excellency the Rev. Bishop Michał Warczyński; 17 August 2008, a new
  electronic clock and electronic bells; 30 November 2009, the Evangelical
  Senior Citizens' Home ended its activity, with a link ("czytaj więcej")
  to the site's own page about it. The page carries two photographs of the
  church, both captioned in their alt text "Kościół Ewangelicko-Augsburski
  w Zagórowie"; the page's small print credits the photographs to the
  studio Foto Sypniewski.
summary_de: >-
  Die Seite „Zagórów filiał Parafii Ewangelicko - Augsburskiej w Koninie"
  („Zagórów, die Filiale der Evangelisch-Augsburgischen Parafie in
  Konin") auf Luteranie Konin, der Website der Gemeinde Konin, mit der
  Überschrift „Ważniejsze wydarzenia z życia Parafii w Zagórowie" („Die
  wichtigeren Ereignisse aus dem Leben der Parafie in Zagórów"). Die
  Chronik, in datierten Einträgen: im sechzehnten Jahrhundert die von den
  Mönchen von Ląd getragene reformatorische Bewegung; in den Jahren
  1720-1817 die aus Schlesien, Pommern und Preußen kommenden
  Evangelischen, die Dörfer gründeten, Kapellen errichteten und unter der
  seelsorgerischen Betreuung des Pfarrers der evangelischen Parafie in
  Września standen; in den Jahren 1817-1856 die Betreuung durch die
  Pfarrer der Parafien von Grodziec, Konin und Żychlin, und in Zagórów
  eine Filiale der Parafie Grodziec gegründet. Dann die Einträge des
  eigenen Lebens der Parafie: 24. Dezember 1856, die Errichtung der
  Parafie in Zagórów; 1857, die Parafie kaufte den Platz zum Bau der
  Kirche; 8. Mai 1878, die Legung des Grundsteins für die Kirche; der
  erste Adventssonntag 1882, die Weihe der Kirche; 1913, der Bau des
  Kantorenhauses; 16. Oktober 1938, die Weihe des Pfarrhauses; 18. Juli
  1954, der erste Gottesdienst nach dem Zweiten Weltkrieg, gehalten von
  Pfarrer Karol Świtalski; 16. Juni 1995, die Weihe des ehemaligen
  Kantorenhauses zum Evangelischen Seniorenheim durch Seine Exzellenz
  Pfarrer Bischof Michał Warczyński; 17. August 2008, eine neue
  elektronische Uhr und elektronische Glocken; 30. November 2009, das
  Evangelische Seniorenheim stellte seine Tätigkeit ein, mit einem Link
  („czytaj więcej") zur eigenen Seite der Site darüber. Die Seite trägt
  zwei Photographien der Kirche, beide in ihrem Alt-Text „Kościół
  Ewangelicko-Augsburski w Zagórowie" betitelt; die Kleinschrift der Seite
  schreibt die Photographien dem Atelier Foto Sypniewski zu.

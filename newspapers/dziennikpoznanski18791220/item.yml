long_title: >-
  The death notice of Count Włodzimierz Miączyński, proprietor of the
  Trąbczyn estates in the Kingdom of Poland, in the Poznań daily Dziennik
  Poznański of 20 December 1879: dead at Trąbczyn on the 18th of December
  of the current year after long sufferings, fortified with the holy
  sacraments; the dispatch of the body to take place on Monday the 22nd of
  the month, the funeral the next day; signed by the grieving nephew
  Władysław hr. Miączyński of Pawłowa — the press witness of the Count's
  death, the event the wlodzimierz era opens with.

# Which era this item belongs to - reference/eras.yml. The Count's death is
# the event the wlodzimierz era's ownership line turns on: Włodzimierz
# Miączyński held Trąbczyn to his death in 1879, "then his nephew
# Władysław Miączyński". This notice of 20 December 1879 is that death's
# press witness, and it names the nephew.
era: wlodzimierz

# Shown whole on the site. The notice is anonymous press of 1879: Polish
# copyright in an anonymous work runs 70 years from its first publication,
# so it ended in 1949; the WBC record states "domena publiczna".

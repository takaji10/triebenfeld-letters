# A detailed summary of the contents, written from a reading of the whole
# item (kept even though the item is shown whole: the summaries are what a
# question is put to first).
summary_en: >-
  A death notice in Dziennik Poznański, no. 292 of 20 December 1879, p. 4.
  "Włodzimierz hr. Miączyński, proprietor of the Trąbczyn estates in the
  Kingdom of Poland, died after long sufferings, fortified with the holy
  sacraments, on the 18th of December of the current year at Trąbczyn. The
  dispatch of the body will take place on Monday the 22nd of the current
  month, the funeral the next day, of which notice is given by the grieving
  nephew, Władysław hr. Miączyński of Pawłowa."
summary_de: >-
  Eine Todesanzeige im Dziennik Poznański, Nr. 292 vom 20. Dezember 1879,
  S. 4. „Włodzimierz hr. Miączyński, Besitzer der Güter von Trąbczyn im
  Königreich Polen, ist nach langen Leiden, versehen mit den heiligen
  Sakramenten, am 18. Dezember des laufenden Jahres in Trąbczyn gestorben.
  Die Versendung des Leichnams findet am Montag, den 22. des laufenden
  Monats statt, das Begräbnis am Tag darauf; dessen wird vom trauernden
  Neffen, Władysław hr. Miączyński von Pawłowa, Kund gegeben."

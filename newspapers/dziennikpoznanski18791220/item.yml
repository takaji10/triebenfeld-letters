# What the item is, and what kind of witness (the rule of the literature,
# LITERATURE_PLAN section 2, kept here): a paid death notice in the Poznań
# daily, set in a black-bordered box with the dead man's name in display
# capitals, the form the Polish papers of the time used. Its facts are the
# kind the family's own papers would confirm, and it is the only witness of
# the Count's death the press section holds — set down two days after the
# death it reports, by the heir whose succession the era's ownership line
# records.
account_en: >-
  A death notice on page 4 of the Poznań daily Dziennik Poznański, no. 292 of
  20 December 1879, set in a black-bordered box with the dead man's name in
  display capitals. Włodzimierz hr. Miączyński, "dziedzic majętności Trąbczyna
  w Królestwie Polskiem", the proprietor of the Trąbczyn estates in the
  Kingdom of Poland, "died after long sufferings, fortified with the holy
  sacraments, on the 18th of December of the current year at Trąbczyn". The
  body was to be sent off ("ekspedycya zwłok") on Monday the 22nd and buried
  the day after. The notice is signed "the grieving nephew, Władysław hr.
  Miączyński of Pawłowa".
account_de: >-
  Eine Todesanzeige auf Seite 4 der Posener Tageszeitung Dziennik Poznański,
  Nr. 292 vom 20. Dezember 1879, in einem schwarz umrandeten Kasten, der Name
  des Toten in Zierversalien. Włodzimierz hr. Miączyński, „dziedzic majętności
  Trąbczyna w Królestwie Polskiem“, der Besitzer der Güter von Trąbczyn im
  Königreich Polen, „starb nach langen Leiden, versehen mit den heiligen
  Sakramenten, am 18. Dezember des laufenden Jahres in Trąbczyn“. Die
  Überführung der Leiche („ekspedycya zwłok“) sollte am Montag, dem 22.,
  stattfinden, das Begräbnis am Tag darauf. Gezeichnet ist die Anzeige „der
  trauernde Neffe, Władysław hr. Miączyński aus Pawłowa“.

# The card's own short rendering of the account (the list pages, 2026-10-29); the account stays whole on the item's page.

# What the item is, and what kind of witness (the rule of the literature,
# LITERATURE_PLAN section 2, kept here): a paid death notice in the Poznań
# daily, set in a black-bordered box with the dead man's name in display
# capitals, the form the Polish papers of the time used. Its facts are the
# kind the family's own papers would confirm, and it is the only witness of
# the Count's death the press section holds — set down two days after the
# death it reports, by the heir whose succession the era's ownership line
# records.
account_en: >-
  A death notice in the Poznań daily Dziennik Poznański, no. 292 of
  20 December 1879 (the paper's twenty-first year), page 4, anonymous, set
  in a black-bordered box with the dead man's name in display capitals. It
  announces the death of Włodzimierz hr. Miączyński, "dziedzic" – the
  proprietor – "majętności Trąbczyna w Królestwie Polskiem", of the
  Trąbczyn estates in the Kingdom of Poland: he "died after long
  sufferings, fortified with the holy sacraments, on the 18th of December
  of the current year at Trąbczyn". The dispatch of the body ("ekspedycya
  zwłok", the bodies of the time travelling by rail) was to take place on
  Monday the 22nd of the month, the funeral the day after; the notice is
  signed "the grieving nephew, Władysław hr. Miączyński of Pawłowa". The
  notice stands in the paper two days after the death it reports, and it
  names the heir whose succession the wlodzimierz era's ownership line
  records. Its date of death, the 18th of December, sides with Żychliński
  (1891, p. 222) against the records, which put the Count's
  death on the 20th – the question already open (NEEDS_CONFIRMATION, "The
  literature" and "The newspapers": the documents first).
account_de: >-
  Eine Todesanzeige in der Posener Tageszeitung Dziennik Poznański, Nr. 292
  vom 20. Dezember 1879 (das einundzwanzigste Jahr der Zeitung), Seite 4,
  anonym, in einem schwarzumrandeten Kasten gesetzt, mit dem Namen des
  Verstorbenen in Schmuckkapitalen. Sie meldet den Tod von Włodzimierz hr.
  Miączyński, „dziedzic" — dem Besitzer — „majętności Trąbczyna w
  Królestwie Polskiem", der Güter von Trąbczyn im Königreich Polen: er ist
  „nach langen Leiden, versehen mit den heiligen Sakramenten, am 18.
  Dezember des laufenden Jahres in Trąbczyn" gestorben. Die Versendung des
  Leichnams („ekspedycya zwłok", die Leichen jener Zeit reisten mit der
  Eisenbahn) sollte am Montag, den 22. des Monats stattfinden, das Begräbnis
  am Tag darauf; gezeichnet ist die Anzeige „vom trauernden Neffen,
  Władysław hr. Miączyński von Pawłowa". Die Anzeige steht in der Zeitung
  zwei Tage nach dem Tod, den sie meldet, und nennt den Erben, dessen
  Nachfolge die Besitzzeile der Epoche wlodzimierz verzeichnet. Ihr
  Todesdatum, der 18. Dezember, steht auf der Seite von Żychliński (1891,
  S. 222) gegen die Aufzeichnungen, die den Tod des
  Grafen auf den 20. setzen — die Frage ist bereits offen
  (NEEDS_CONFIRMATION, „The literature" und „The newspapers": die Dokumente
  zuerst).

# The card's own short rendering of the account (the list pages, 2026-10-29); the account stays whole on the item's page.
brief_en: >-
  A black-bordered death notice in the Poznań daily Dziennik Poznański of 20
  December 1879, signed by the dead man's grieving nephew, announcing the
  death of Włodzimierz Count Miączyński, proprietor of Trąbczyn, two days
  after it – the press witness the wlodzimierz era opens with, and the notice
  that names the nephew who followed him.
brief_de: >-
  Eine schwarzumrandete Todesanzeige in der Posener Tageszeitung Dziennik
  Poznański vom 20. Dezember 1879, gezeichnet vom trauernden Neffen des
  Verstorbenen, meldet den Tod des Grafen Włodzimierz Miączyński, Besitzers
  von Trąbczyn, zwei Tage nach dem Geschehen – das Pressezeugnis, mit dem die
  Epoche wlodzimierz eröffnet, und die Anzeige, die den Neffen nennt, der ihm
  folgte.


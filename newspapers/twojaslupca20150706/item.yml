account_en: >-
  A report of the village of Trąbczyn's 775th-anniversary jubilee in
  TwojaSłupca, the local news portal of Słupca, published on 6 July 2015
  the day after the celebration, anonymous. The portal marks the
  anniversary from the village's first mention, in the medieval document
  of 1240 that gave the Cistercian abbey at Ląd the tithes of several
  villages, Trąbczyn among them; and its history paragraph runs from
  Janek, son of Szymon, the first documented owner from the grant of Duke
  Bolesław the Pious, through the counts Mikołaj of Ląd, Jan and
  Przedpełk and the Trąbczyński family of the Dryja coat of arms to the
  end of the seventeenth century, and the heirs it names as having taken
  part in the wars of national liberation — Antoni Prusimski, Stanisław
  Count Miączyński, Aleksander and Włodzimierz Miączyński. The
  celebrations themselves: a Mass in the parish church of St Stanislaus,
  Bishop and Martyr; the unveiling of a memorial tablet and an obelisk;
  the honours "Zasłużony dla wsi Trąbczyn" for some fifty villagers and,
  posthumously, for Krystyna Reszkiewicz; the opening of the exhibition
  "775 lat Trąbczyna"; games and competitions for the children, local
  young people on the stage, the band Skaner as the star of the evening,
  and a dance to close.
account_de: >-
  Ein Bericht über das Jubiläum der Vollendung von 775 Jahren des Dorfes
  Trąbczyn in TwojaSłupca, dem lokalen Nachrichtenportal von Słupca,
  veröffentlicht am 6. Juli 2015, am Tag nach der Feier, anonym. Das
  Portal rechnet das Jubiläum von der ersten Erwähnung des Dorfes her, in
  der mittelalterlichen Urkunde von 1240, die der Zisterzienserabtei in
  Ląd die Zehnten mehrerer Dörfer verschaffte, Trąbczyn unter ihnen; und
  sein Geschichtsabsatz geht von Janek, dem Sohn Szymons, dem ersten
  urkundlichen Besitzer aus der Schenkung Herzog Bolesław des Frommen,
  über die Kometen Mikołaj von Ląd, Jan und Przedpełk und die Familie
  Trąbczyński mit dem Wappen Dryja bis zum Ende des siebzehnten
  Jahrhunderts und zu den Erben, die es zu den nationalen Befreiungskriegen
  zählt — Antoni Prusimski, Stanisław Graf Miączyński, Aleksander und
  Włodzimierz Miączyński. Die Feier selbst: eine Messe in der Pfarrkirche
  des heiligen Stanislaus, Bischof und Märtyrer; die Enthüllung einer
  Gedenktafel und eines Obelisken; die Ehrungen „Zasłużony dla wsi
  Trąbczyn" für etwa fünfzig Dorfbewohner und, posthum, für Krystyna
  Reszkiewicz; die Eröffnung der Ausstellung „775 lat Trąbczyna"; Spiele
  und Wettbewerbe für die Kinder, die Jugend des Ortes auf der Bühne, die
  Kapelle Skaner als Star des Abends und ein Tanz zum Schluß.


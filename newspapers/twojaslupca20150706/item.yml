# A detailed summary of the contents, written from a reading of the whole
# item (kept even though the item is shown whole: the summaries are what a
# question is put to first).
summary_en: >-
  A report of the 775th anniversary of Trąbczyn, "Trąbczyn świętował 775
  lat", published 6 July 2015 on TwojaSłupca, the local news portal of
  Słupca; the celebrations took place the day before. The village's
  history, as the report tells it: the place — "or rather Trampczin" — is
  named for the first time in a medieval document of 1240, which concerns
  the grant by the Archbishop of Gniezno of tithes from several villages,
  Trąbczyn among them, to the Cistercian monastery at Ląd; the first
  documented owner of the village, from the grant of Duke Bolesław the
  Pious, was Janek, son of Szymon; after him come the further heirs, the
  count of Ląd Mikołaj, the count Jan and Przedpełk; to the end of the
  seventeenth century the Trąbczyn estates were in the hands of the
  Trąbczyński family of the Dryja coat of arms; the owners changed
  several times more, and many of the heirs of Trąbczyn and their
  descendants took an active part in the wars of national liberation —
  among them Antoni Prusimski, Stanisław Count Miączyński, and Aleksander
  and Włodzimierz Miączyński. To honour their memory and bring the
  history of the little homeland near to the young generation, the
  jubilee was organised in Trąbczyn the day before. It began with a Mass
  in the parish church of St Stanislaus, Bishop and Martyr; after it a
  memorial tablet and an obelisk were unveiled. The further part of the
  celebration took place on the ground by the School-and-Gymnasium
  Complex named for the European Union in Trąbczyn: the guests were
  welcomed, and the honours "Zasłużony dla wsi Trąbczyn" were presented
  to some fifty named villagers — among them Wiesław Radniecki, Andrzej
  Kin, Marcin Urycki, Robert Kaczmarek, Irena Kubacka, Stanisław
  Przydryga, Jadwiga Grajewska and Józef Kozioł; the report names
  "Anna Siuba" twice, and "Marczena kazimierska" with a small letter, as
  it prints them — and posthumously to Krystyna Reszkiewicz; every
  invited guest was given a commemorative statuette. The exhibition
  "775 lat Trąbczyna", describing the village's history, was officially
  opened; local young people performed on the stage; games and
  competitions were prepared for the children; the band Skaner was the
  star of the evening; and the day closed with a dance.
summary_de: >-
  Ein Bericht über das 775jährige Jubiläum von Trąbczyn, „Trąbczyn
  świętował 775 lat", veröffentlicht am 6. Juli 2015 auf TwojaSłupca, dem
  lokalen Nachrichtenportal von Słupca; die Feier fand am Tag zuvor
  statt. Die Geschichte des Dorfes, wie der Bericht sie erzählt: der Ort
  — „vielmehr Trampczin" — wird zum ersten Mal in einer mittelalterlichen
  Urkunde von 1240 genannt, die die Schenkung der Zehnten mehrerer
  Dörfer, Trąbczyn unter ihnen, durch den Erzbischof von Gnesen an das
  Zisterzienserkloster in Ląd betrifft; der erste urkundliche Besitzer
  des Dorfes, aus der Schenkung Herzog Bolesław des Frommen, war Janek,
  Sohn des Szymon; nach ihm kommen die weiteren Erben, der Komet von Ląd
  Mikołaj, der Komet Jan und Przedpełk; bis zum Ende des siebzehnten
  Jahrhunderts waren die Trąbczyner Güter in den Händen der Familie
  Trąbczyński mit dem Wappen Dryja; die Besitzer wechselten noch
  mehrfach, und viele Erben von Trąbczyn und ihre Nachkommen nahmen an
  den nationalen Befreiungskriegen teil — unter ihnen Antoni Prusimski,
  Stanisław Graf Miączyński und Aleksander und Włodzimierz Miączyński.
  Um ihr Gedächtnis zu ehren und der jungen Generation die Geschichte der
  kleinen Heimat näherzubringen, wurde das Jubiläum am Tag zuvor in
  Trąbczyn veranstaltet. Es begann mit einer Messe in der Pfarrkirche des
  heiligen Stanislaus, Bischof und Märtyrer; danach wurden eine
  Gedenktafel und ein Obelisk enthüllt. Der weitere Teil der Feier fand
  auf dem Platz beim Schul- und Gymnasialkomplex „der Europäischen Union"
  in Trąbczyn statt: die Gäste wurden begrüßt, und die Ehrungen
  „Zasłużony dla wsi Trąbczyn" wurden an etwa fünfzig namentlich
  genannte Dorfbewohner verliehen — unter ihnen Wiesław Radniecki,
  Andrzej Kin, Marcin Urycki, Robert Kaczmarek, Irena Kubacka, Stanisław
  Przydryga, Jadwiga Grajewska und Józef Kozioł; der Bericht nennt
  „Anna Siuba" zweimal und „Marczena kazimierska" mit kleinem
  Anfangsbuchstaben, wie er sie druckt — und posthum an Krystyna
  Reszkiewicz; alle geladenen Gäste erhielten eine Gedenkstatuette. Die
  Ausstellung „775 lat Trąbczyna", die die Geschichte des Dorfes
  beschreibt, wurde offiziell eröffnet; die Jugend des Ortes trat auf der
  Bühne auf; für die Kinder waren Spiele und Wettbewerbe bereitet; die
  Kapelle Skaner war der Star des Abends; und der Tag schloß mit einem
  Tanz.

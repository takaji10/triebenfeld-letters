account_en: >-
  An unsigned report on TwojaSłupca, the local news portal of Słupca,
  published on 6 July 2015, the day after Trąbczyn celebrated its 775th
  anniversary. The portal counts the years from the village's first mention,
  in the document of 1240 that gave the Cistercians of Ląd the tithes of
  several villages, Trąbczyn among them. Its history runs from Janek, son of
  Szymon, the first owner on record, through the counts Mikołaj, Jan and
  Przedpełk and the Trąbczyński family to the later owners. The day itself had
  a Mass in the parish church of St Stanislaus, a memorial tablet and an
  obelisk unveiled, honours for some fifty villagers, an exhibition, games for
  the children, a concert and a dance.
account_de: >-
  Ein ungezeichneter Bericht auf TwojaSłupca, dem Nachrichtenportal von
  Słupca, erschienen am 6. Juli 2015, am Tag nach der 775-Jahr-Feier von
  Trąbczyn. Das Portal zählt die Jahre von der ersten Erwähnung des Dorfes an,
  in der Urkunde von 1240, die den Zisterziensern von Ląd den Zehnten mehrerer
  Dörfer gab, darunter Trąbczyn. Seine Geschichte reicht von Janek, dem Sohn
  des Szymon, dem ersten bezeugten Besitzer, über die Grafen Mikołaj, Jan und
  Przedpełk und die Familie Trąbczyński bis zu den späteren Besitzern. Zum Tag
  selbst gehörten eine Messe in der Pfarrkirche St. Stanislaus, die Enthüllung
  einer Gedenktafel und eines Obelisken, Ehrungen für etwa fünfzig
  Dorfbewohner, eine Ausstellung, Spiele für die Kinder, ein Konzert und ein
  Tanz.


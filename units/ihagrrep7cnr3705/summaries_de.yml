ihagrrep7cnr3705-001: v. Triebenfeld bittet als General Bevollmächtigter des Fürsten den König, der Regierung in Kalisz die Sequestration des Gutes Oleśnica (Herrschaft Trąbczyn und Zagórów) zu befehlen. Die Erbpächter Giese, Bagans und Gietzinger zahlten vom Erbstandsgeld (20000 Rthl) nur 10000 Rthl aus Geldern von Untererbpächtern. Seitdem schulden sie Zins und Abgaben und veräußern Gutsteile, während die Kammer den Vertrag nicht bestätigte. Er widerlegt die ablehnenden Resolutionen, verlangt die Abforderung der Akten und bietet Kaution an.

# For the reader: shown on this unit's provenance page.
description: >-
  A Prussian ministry file on the Olesnica estate, part of the Prince of
  Hohenlohe-Ingelfingen's lordships of Trąbczyn and Zagórów. It holds
  Triebenfeld's petition to the King, written at Breslau on 18 September 1805
  as the Prince's general plenipotentiary. On 22 February 1804 the Prince had
  let Olesnica in hereditary lease to three townsmen, Giese, Bagans and
  Gietzinger, for 20,000 rt entry money and 2,000 rt a year. They paid half,
  sub-let and broke up the land without his consent, kept the income and
  paid neither rent nor taxes, while the Chamber refused to confirm the
  contract. The government at Kalisch would not sequester the estate while
  the lawsuits ran, and the petition argues from the Allgemeines Landrecht,
  point by point, that it must. It names the enclosures (A to H) that went
  with it: the contract, the list of sub-lessees, the Prince's
  representations and the government's refusals.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A petition to the King in formal legal German, written by a plenipotentiary
  in the Prince's first person (Ich, mein Guth). It argues from Prussian law:
  citations of the Allgemeines Landrecht (Th. I. Tit. 21. §. 187) and the
  Allgemeine Gerichtsordnung keep their numbering exactly. Latin legal terms
  are part of the register and are kept: clausula cassatoria, in via
  executionis, in via arresti, effectum devolutivum, exceptiones ulterioris
  indaginis, ad separatum, in processu ordinario, casus non dabilis, sine
  titulo et jure, ad depositum judiciale, onera publica, contra jus in thesi.
  Erbpacht is hereditary lease; Erbstandsgeld the entry money; Aftererbpacht
  and Untererbpächter the sub-lease and sub-lessees; Natural-Besitz and
  Civil-Besitz natural and civil possession, a distinction the argument turns
  on. The letters (A) to (H) in the margin refer to enclosures that are not in
  this file. Giese, Bagans and Gietzinger are the three lessees; Winitzki,
  Chwalowski and Cabanis sworn surveyors; Mondro a Criminal Councillor who
  acted for the Prince. Olesnize is Olesnica.

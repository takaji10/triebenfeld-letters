# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts.
description: >-
  A file of the Prussian cabinet ministers on South Prussia, February to June
  1803. On 27 January 1803 Anton (Antoni) von Prusimski, a former starost, and
  Xaver von Jezierski, a former canon of Włocławek and parish priest, both of
  whom had left the country after taking part in the South Prussian (Kuyavian)
  insurrection of 1794 and were living at Dresden, petitioned King Friedrich
  Wilhelm III for leave to return home. The King sent the petition to the
  Grand Chancellor von Goldbeck and the cabinet minister Count von Haugwitz
  for a report. The file holds Goldbeck's covering letters to Haugwitz (19
  February, 22 April, 11 May), Haugwitz's draft reply of 29 April, a copy of
  their joint report of 30 April (Prusimski's part in the Kuyavian rising at
  his Smiłowice estates in August 1794; the confiscation proceedings; his
  Trąbczyn estates given to the Prince of Hohenlohe, his Pawłów estates to
  General von Sanitz, his Smiłowice estates to General von Bischofswerder;
  his wife dead in Italy; Jezierski's offices and benefices lost; both
  punished hard enough by confiscation and nine years' exile), copies of the
  King's cabinet order of 10 May granting the return, of the rescript to the
  South Prussian government at Posen and of the resolution to the two
  petitioners of 11 May (the confiscation stands; they must take the oath of
  allegiance), and the drafts of 30 May to the minister von Voss, to Goldbeck
  and to the Chamber at Posen, which is to take their oath.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Papers of the Prussian cabinet ministry. "Ew. Excellenz" is the form of
  address between ministers; "Concept" and "Mundum" (plural "Munda") are the
  draft and the fair copy of an outgoing paper, "mitzeichnen" to countersign,
  "remittiren"/"retradiren" to send back; "pr." with a date is the day a
  letter was received; "sub voto remissionis" means "to be returned";
  "Supplicanten" are the petitioners, an "Immediat-Vorstellung" a petition
  addressed to the King directly; "Cabinets-Ordre" is the King's order from
  his cabinet; "Confiscations-Proceß" the proceedings for confiscation
  against an absentee, "Confiscations Urtel" its sentence; "Huldigungseid"
  the oath of allegiance; "Starost" a holder of a royal starostwo in the old
  Polish state ("Straße" is not meant: the word is always the title). "Die
  Regierung zu Posen" is the South Prussian government (the court and
  administrative authority), "die Kammer zu Posen" the War and Domains
  Chamber. Places: Kalisch is Kalisz, Posen Poznań, Wraclawek Włocławek,
  Cujavien Kuyavia; the estates "Trampczyner", "Pawlower", "Smilowicer
  Güter" are Trąbczyn, Pawłów and Smiłowice. The pages from the office's
  slip (document 4, after the letter) are the registry's instructions for
  dispatch, in abbreviations. A word followed by [?] is one the reading
  leaves doubtful, and the English keeps the doubt. Names stay as the clerk
  wrote them (Prusiemski, Prusimski) unless the edition has a settled form.


# Editorial rulings for I. HA GR, Rep. 7 C, Nr. 3132 (GStA PK).
#
# Eleven documents (the editor, 2026-11-20, asked before the cut): the
# ministers' letters, drafts and copies on the petition of Prusimski and
# Jezierski, February to May 1803. The office's slip (fol. 9) is not a
# document of its own: it stands with document 4, whose registry number
# (B No 1261) it carries, and is listed in office_notes.yml. The cover
# (0001_a) is front matter.

places:
  overrides:
    "1": Berlin     # "Berlin, den 19ten Februar 1803."
    "2": Berlin     # "Berlin den 22ten April 1803."
    "3": Berlin     # "Berlin d 29 Apr 1803."
    "4": Berlin     # "Berlin den 11ten May 1803"
    "5": Berlin     # "Berlin den 30ten April. 1803"
    "6": Potsdam    # "Potsdam, den 10ten May 1803."
    "7": Berlin     # "Berlin, den 11ten May 1803."
    "8": Berlin     # "Berlin, den 11ten May 1803."
    "9": Berlin     # "Berlin den 30. May 1803"
    "10": Berlin    # "Berlin den 30. May 1803"
    "11": Berlin    # "Berlin den 30. May 1803."

dates:
  # [year, month, day, precision]; read off each document.
  read:
    "1": [1803, 2, 19, "day"]
    "2": [1803, 4, 22, "day"]
    "3": [1803, 4, 29, "day"]
    "4": [1803, 5, 11, "day"]
    "5": [1803, 4, 30, "day"]
    "6": [1803, 5, 10, "day"]
    "7": [1803, 5, 11, "day"]
    "8": [1803, 5, 11, "day"]
    "9": [1803, 5, 30, "day"]
    "10": [1803, 5, 30, "day"]
    "11": [1803, 5, 30, "day"]
  # [year, month, day, precision, basis]
  inferred: {}
  supplied: {}
  twin: {}
  no_date: []

documents:
  # Copies (5 to 8, "Copia", "Abschrift") keep the type of what they copy.
  # The King's cabinet order and the rescript and resolution issued in his
  # name are `royal_rescript`, as the cabinet orders of Nr. 3709 and the
  # resolution of Oe 1 Bü 14525, 43.
  doc_type:
    "1": letter
    "2": letter
    "3": draft
    "4": letter
    "5": report
    "6": royal_rescript
    "7": royal_rescript
    "8": royal_rescript
    "9": draft
    "10": draft
    "11": draft

  language: {}
  duplicate_of: {}
  split_note: {}

  relations:
    "3":
      - kind: answers
        target: "2"
        note: "Haugwitz returns the report Goldbeck sent him on 22 April, signed, with his one reservation."
    "4":
      - kind: transmits
        target: "5"
        note: "'eine ... wohl aus Versehen der Canzley beygefügte Abschrift des gemeinschaftlichen ... Berichtes': document 5 is a copy of that joint report."
      - kind: transmits
        target: "6"
        note: "'die originaliter sub voto remissionis anliegende Cabinets Ordre vom gestrigen dato': document 6 is the file's copy of the order."
    "6":
      - kind: answers
        target: "5"
        note: "The King grants the return 'in Rücksicht der aus Euerm Berichte von 30ten v. M. ersehenen Gründe'."
    "10":
      - kind: answers
        target: "4"
        note: "Haugwitz thanks Goldbeck for his letter 'vom 11. m. c.' and returns the cabinet order and the countersigned drafts."

damage:
  letters: []

rough:
  letters: []

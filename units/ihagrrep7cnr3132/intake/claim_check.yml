  "5":
    statements:
      - claim: "A copy of the joint report of Goldbeck and Haugwitz to the King, Berlin, 30 April 1803"
        verdict: SUPPORTED
        evidence: "Copia ... Ew. Königl. Majestät ... Berlin den 30ten April. 1803 Goldbeck. Haugwitz"
      - claim: "on the representation of the former Starost von Prusimski and Xaver von Jezierski, who had left the country because of their part in the South Prussian insurrection and had asked from Dresden for leave to return"
        verdict: SUPPORTED
        evidence: "welche sich, wegen Teilname an der SüdPreußischen Insurrection, ausser Landes begeben, und jetzt von Dresden um die Erlaubniß zur Rückkehr in ihr Vaterland gebeten haben"
      - claim: "Prusimski was accused of having gone on 2 August 1794, before the outbreak, from his estates near Kalisz to his Smiłowice estates in Kuyavia"
        verdict: SUPPORTED
        evidence: "wurde beschuldiget, daß er sich am 2ten August. 1794 vor dem Ausbruche der Südpreußischen Insurrection von seinen bey Kalisch belegenen Gütern nach seinen Smilowicer Gütern in dem ... Districte von Cujavien begeben"
      - claim: "of having received daily visits from the neighbouring nobility"
        verdict: SUPPORTED
        evidence: "dort tägliche Besuche von dem benachbarten Adel erhalten"
      - claim: "and of the so-called Kuyavian insurrection having been concluded at his house on 21 August, the act of confederation drafted and executed"
        verdict: SUPPORTED
        evidence: "bey ihm am 21 Aug: die sogenannte Cujavische Insurrection zum Abschluße gediehen, die Confoederations Acte entworfen und vollzogen sey ('bey ihm' = with him; 'at his house' is a small narrowing, and the German summary says only 'bei ihm')"
      - claim: "he is also said to have been among the South Prussian noblemen who met at Dresden in winter 1793/94 on account of the Polish changes of state"
        verdict: SUPPORTED
        evidence: "Er soll auch zu denjenigen SüdPreußischen von Adel gehören welche im Winter 1793/94 wegen der Polnischen Staatsveränderungen in Dresden zusammengetreten sind"
      - claim: "these accusations rest mostly on a Memoire raisonné drawn up from statements of unnamed trusted Poles and officials"
        verdict: SUPPORTED
        evidence: "gründen sich jedoch nur gröstentheils in einem sogenannten Memoire raisonne welches aus den Angaben einiger nicht benannten vertrauten Pohlen und Officianten angefertiget wurde"
      - claim: "and were never closely examined"
        verdict: OVERSTATED
        evidence: "sind nicht genau untersucht worden (not closely examined; 'never' goes beyond it)"
        fix: "and were not closely examined."
      - claim: "The Government did not think them sufficient for the criminal proceedings against absent offenders that were brought against some chief insurgents"
        verdict: SUPPORTED
        evidence: "Die Regierung hielt solche auch nicht dazu hinreichend wider ihn den Criminial Proceß gegen abwesende Verbrecher, wie es in Absicht einiger Haupt Insurgenten geschah, zu verfügen"
      - claim: "at the instance of the fiscal it instituted only the confiscation proceedings, because he had not returned under the general ordinances"
        verdict: SUPPORTED
        evidence: "leitete nur auf Instanz des Fiscals, deshalb weil er auf die ergangenen allgemeinen Verordnungen nicht zurückgekehrt war, den Confiscations Proceß, ein"
      - claim: "publicly summoned, he held out hope of return from Italy, where his wife, who also died there, was said to have had to stay for her health, and tried to avert the confiscation"
        verdict: SUPPORTED
        evidence: "gehörig öffentlich vorgeladen ... von Italien aus, wo sich damals angeblich seine auch dort verstorbene Ehegattin zur Herstellung ihrer Gesundheit, aufhalten mußte, zu seiner Rückkehr Hofnung gemacht und die Confiscation abzuwenden gesucht"
      - claim: "as he did not appear the sentence of confiscation was passed, and when final his Trąbczyn estates were given to the Prince of Hohenlohe, Pawłowo to Major General von Sanitz, Smiłowice to Lieutenant General von Bischofswerder"
        verdict: SUPPORTED
        evidence: "da er indeßen doch nicht erschien; so wurde das Confiscations Urtel abgefaßt, und nachdem es die Rechtskraft beschritten hatte, wurden, seine Trampczyner Güter dem Herrn Fürsten von Hohenlohe, seine Pawlower Güter dem jetzigen General Major von Sanitz, und seine Smilowicer Güter dem General Lieutenant von Bischofswerder geschenkt"
      - claim: "he held no other property in the country"
        verdict: SUPPORTED
        evidence: "Außer diesen hat er weiter kein Vermögen im Lande besessen"
      - claim: "Jezierski, canon in Włocławek and parish priest at Neustadt"
        verdict: SUPPORTED
        evidence: "war Canonicus in Wraclawek und Pfarrer zu Neustadt"
      - claim: "named in the Memoire and by named persons as one of those who stayed most often with Prusimski at Smiłowice before the insurrection and worked most actively to bring it about"
        verdict: SUPPORTED
        evidence: "theils durch das oben erwähnte Memoire, theils von namhaft gemachten Personen als einer von denen angegeben, die sich vor dem Ausbruche der Cujavischen Insurrection am häufigsten bey dem v Prusiemski zu Smilowice aufgehalten und am thätigsten mitgewürckt haben"
      - claim: "he is said to have drafted the proclamations to the people, raised men and sat on the insurgents' security commission"
        verdict: SUPPORTED
        evidence: "Er soll die Proclamationen von des Volk entworfen, Mannschaften zusammengebracht haben, und Mitglied einer damals von den Insurgenten angeordneten Sicherheits-Commission gewesen seyn"
      - claim: "against him too only the confiscation proceedings; his small property, the income of his benefices, confiscated, and he deprived of them"
        verdict: SUPPORTED
        evidence: "wurde blos der Confiscations Proceß eingeleitet und rechtskräftig auf Confiscation seines geringen vermögens erkannt, welches nur aus den Einkünften seiner in Sequestration genommenen und nachher anderweitig besetzten Pfründen bestand, deren er auch durch das Urtel entsetzt würde"
      - claim: "neither has been declared to have forfeited his nobility, and no capital punishment fixed or reserved"
        verdict: SUPPORTED
        evidence: "Des Adels ist keiner von beiden Supplicanten verlustig erklärt, noch sonst eine Lebensstrafe gegen sie festgesetzt oder vorbehalten worden"
      - claim: "the confiscation must stand, a point on which Haugwitz as outside his department expresses no opinion"
        verdict: SUPPORTED
        evidence: "wobey es unabänderlich verbleiben muß /: ein Punct über welchen ich der Graf v. Haugwitz eine Meinung zu äußern mich enthalte, da solcher nicht meines Ressorts ist :/"
      - claim: "the two have been punished more harshly than many who returned and submitted to a moderate fine or fortress term"
        verdict: SUPPORTED
        evidence: "härter als viele andere welche zurückkehrten und sich einer mäßigen Geld oder Festungsstrafe unterwerfen, bestraft worden"
      - claim: "their part does not mark them out as more dangerous than others who stayed or returned"
        verdict: SUPPORTED
        evidence: "Ihre Theilname ist auch nicht von der Art, daß sie dadurch vor andern, die im Lande geblieben, oder nachher dahin zurückgekehrt sind, als gefährliche Männer characterisirt würden"
      - claim: "since they ask only for leave to return, the ministers advise that it might be granted, leaving it to the King's judgement"
        verdict: SUPPORTED
        evidence: "da ihr Gesuch nur auf Erlaubniß zur Rückkehr gerichtet ist ... daß demselben wohl zu deferiren seyn dürfte; welches wir jedoch lediglich Ew. K. M. Allerhöchsten Beurtheilung devotest anheimstellen"
      - claim: "Signed Goldbeck, Haugwitz"
        verdict: SUPPORTED
        evidence: "Goldbeck. Haugwitz"
  "6":
    statements:
      - claim: "A copy of the King's cabinet order to the ministers of state Grand Chancellor von Goldbeck and Count von Haugwitz, Potsdam, 10 May 1803"

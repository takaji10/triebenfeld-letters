# Applied 2026-11-20 (intake/write_summaries.py): all ten OVERSTATED and the one
# UNSUPPORTED statement weakened or cut as proposed. Kept, with the reason:
# "draft" for documents 3, 9, 10 and 11 is the edition's document type, read
# from the layout (text down the right half, address and dispatch notes in
# the left; docs/GOVERNMENT_FILES.md), not a claim about the text.
# Claim check of the summaries of I. HA GR, Rep. 7 C, Nr. 3132 (Sonnet sub-agent, 2026-11-20).
documents:
  "1":
    statements:
      - claim: "Goldbeck to Haugwitz, Berlin, 19 February 1803"
        verdict: SUPPORTED
        evidence: "Berlin, den 19ten Februar 1803. Goldbeck / An ... Grafen von Haugwitz"
      - claim: "received 23 February"
        verdict: SUPPORTED
        evidence: "pr dem 23 Februar 1803"
      - claim: "The King has sent them both, for a report, the original petition of a former Starost von Prusimski and of one Xaver Jezierski for leave to return"
        verdict: SUPPORTED
        evidence: "Des Königs Majestät haben an Euer Excellenz und mich das originaliter anliegende Gesuch ... um Gestattung ihrer Rükkehr in ihr Vaterland, zur Berichtserstattung zu remittiren geruhet"
      - claim: "Goldbeck thinks it necessary to see the files on their offences and property"
        verdict: SUPPORTED
        evidence: "die Einsicht der über ihre Vergehen und ihr Vermögen verhandelten Akten nothwendig halte"
      - claim: "he has had a rescript to the Government at Poznań dispatched, enclosed in draft and fair copy"
        verdict: SUPPORTED
        evidence: "das im Concept und mundo beigefügte Rescript an die Regierung zu Posen expediren lassen"
      - claim: "asks Haugwitz to countersign it, forward the fair copy and return the draft to the Privy State Chancery"
        verdict: SUPPORTED
        evidence: "mitzuzeichnen, das mundum zum Abgange befördern, das Concept aber geneigt zur Geheimen Etats Kanzley retradiren zu laßen"
      - claim: "Signed Goldbeck"
        verdict: SUPPORTED
        evidence: "Goldbeck"
  "2":
    statements:
      - claim: "Goldbeck to Haugwitz, Berlin, 22 April 1803, received the same day"
        verdict: SUPPORTED
        evidence: "pr den 22t April 1803 ... Berlin den 22ten April 1803. Goldbeck"
      - claim: "The Government at Poznań has sent in the files of the confiscation proceedings against Anton von Prusimski and the canon von Jezierski"
        verdict: SUPPORTED
        evidence: "Nachdem die Regierung zu Posen die wider den ehemaligen Starosten Anton von Prusiemski und den Canonicus von Jezierski verhandelten Confiscations-Acten eingeschickt hat"
      - claim: "he passes them on in 6 volumes"
        verdict: SUPPORTED
        evidence: "solche Ew. Excellenz beigehend in 6 Voluminibus ... zu communiciren"
      - claim: "with his draft of the joint report the King has asked for"
        verdict: SUPPORTED
        evidence: "das Concept zu dem, von des Königs Majestät erforderten, gemeinschaftlichem Berichte"
      - claim: "if Haugwitz has no objection he is to countersign, have the fair copy made and sent to Goldbeck for co-signature, and return draft and files"
        verdict: SUPPORTED
        evidence: "wenn dieselben gegen das Letztere nichts zu erinnern haben sollten, solches gefälligst mitzuzeichnen, das Mundum anfertigen, und es zu meiner Mitunterschrift gelangen zu laßen, das Concept und die Acten aber geneigt an mich zu remittiren"
      - claim: "Signed Goldbeck"
        verdict: SUPPORTED
        evidence: "Goldbeck"
  "3":
    statements:
      - claim: "Haugwitz's draft of his reply to Goldbeck, Berlin, 29 April 1803"
        verdict: SUPPORTED
        evidence: "An ... Herrn von Goldbeck Exellenz ... Berlin d 29 Apr 1803. Haug[witz]; 'draft' is not stated in the text, only the form (marginal notes) suggests it"
      - claim: "in full agreement with Goldbeck's opinion on Prusimski and Jezierski"
        verdict: SUPPORTED
        evidence: "Im völligen Einverständnis mit Eurer Excellenz erleuchteter Meinung wegen des Prusiemski und des Jezierski"
      - claim: "he has signed the report Goldbeck sent him and had it engrossed"
        verdict: SUPPORTED
        evidence: "habe ich den von Euwer Excellenz mir geneigtest mitgetheilten Bericht unterzeichnet, und mundiren lassen"
      - claim: "sends the fair copy for Goldbeck's countersignature and dispatch, with the draft"
        verdict: SUPPORTED
        evidence: "die Reinschrift, zur gefälligen Mitzeichnung und Absendung, nebst dem Concept Denenselben ergebenst zu überſenden"
      - claim: "at the one place where the report says the confiscation must remain unalterable he has added that he refrains from expressing an opinion"
        verdict: SUPPORTED
        evidence: "An der einzigen Stelle, so es heißt: daß es bey der Vermögens confiscation unabänderlich bleiben müsse, habe ich ... hinzufügen in[?] müssen geglaubt, daß ich eine Meinung zu äußern mich enthalte (one doubtful word, 'in[?]', does not touch the sense)"
      - claim: "because the point belongs to Goldbeck's department and lies outside his own"
        verdict: SUPPORTED
        evidence: "da dieser Punct lediglich zu Dero Ressort gehöret ... da dieser Umstand ausserhalb meines Geschäfts Kreises liegt"
      - claim: "he returns the files with thanks"
        verdict: SUPPORTED
        evidence: "Die mir geneigtest Communicirten Acta füge ich mit Danksagung hier wieder bey"
      - claim: "Signed Haug[witz]"
        verdict: SUPPORTED
        evidence: "Haug[witz]"
      - claim: "A note of the office records 3 May with 2 volumes of files"
        verdict: OVERSTATED
        evidence: "d. 3ten May. ins: cum 2 vol: Actor: pLch: (the note is not attributed to an office, 'ins:' and 'pLch:' are not read, and what the date records is not stated; and 2 volumes sit oddly with the 6 volumes of document 2)"
        fix: "A note below the text reads 'd. 3ten May. ins: cum 2 vol: Actor:' (3 May, 'with 2 volumes of files'; its other words not read)."

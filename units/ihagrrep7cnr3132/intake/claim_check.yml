      - claim: "in view of the reasons in their report of 30 April"
        verdict: SUPPORTED
        evidence: "In Rücksicht der aus Euerm Berichte von 30ten v. M. ersehenen Gründe"
      - claim: "joining the Grand Chancellor in the view that they have been punished hard enough by the confiscation of their estates and nine years' banishment"
        verdict: SUPPORTED
        evidence: "da Ich Eurem des Großkanzlers Sentiment dahin beitrete, daß die Supplicanten durch die Confiscation ihrer Güter und eine neunjährige Verbannung, hart genug bestraft sind"
      - claim: "the King grants them the leave to return"
        verdict: SUPPORTED
        evidence: "will ich denselben die erbetene Erlaubniß zur Rückkehr in ihr Vaterland hierdurch ertheilen"
      - claim: "leaves the further dispositions to the ministers"
        verdict: SUPPORTED
        evidence: "und Euch darnach die Verfügung des weiteren überlaßen"
      - claim: "He returns the petition"
        verdict: SUPPORTED
        evidence: "das hierneben wieder zurückgehende Gesuch"
  "7":
    statements:
      - claim: "A copy of the rescript in the King's name to the South Prussian Government at Poznań, Berlin, 11 May 1803, signed Goldbeck and Haugwitz"

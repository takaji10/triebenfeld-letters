  "8":
    statements:
      - claim: "A copy of the resolution"
        verdict: UNSUPPORTED
        evidence: "this document has no heading 'Abschrift' (unlike documents 6 and 7); it begins 'Sr: Königl: Maj. von Preußen U. A. H. laßen dem Anton v. Prusiemski ...'"
        fix: "The resolution in the King's name (the text does not say it is a copy)."
      - claim: "in the King's name to the former Starost Anton v. Prusimski and Xaver von Jezierski at Dresden, Berlin, 11 May 1803, signed Goldbeck and Haugwitz"
        verdict: SUPPORTED
        evidence: "Berlin, den 11ten May 1803. ... Goldbeck Haugwitz / An den ehemaligen Starosten Anton v. Prusiemski und den Xaver von Jezierski zu Dresden"
      - claim: "answering their immediate representation of 27 January of that year"
        verdict: SUPPORTED
        evidence: "auf ihre Immediat-Vorstellung vom 27. Jan: d. J."
      - claim: "leave to return granted on the assumption that they will conduct themselves there as loyal subjects"
        verdict: OVERSTATED
        evidence: "in der Voraussetzung, daß sie sich dort künftig als getreue[?] Unterthanen betragen werden ('getreue' is a doubtful reading)"
        fix: "on the assumption that they will conduct themselves there in future as [loyal?] subjects."
      - claim: "the confiscation decreed with final effect stands unalterably, and Jezierski remains deprived of his clerical offices and benefices"
        verdict: SUPPORTED
        evidence: "daß es zwar bei der gegen sie rechtskräftig erkannten Vermögens-Confiscation sein unabänderliches Bewenden behalten, auch an dem von Jezierski seiner geistl: Ämter und Pfrunden verlustig bleiben müße"
      - claim: "otherwise they need fear no further inquiry or punishment for their part in the insurrection"
        verdict: SUPPORTED
        evidence: "daß sie aber sonst weiter keine Untersuchung und Bestrafung wegen ihrer Theilnahme an der Insurrection befürchten dürfen"
      - claim: "The necessary has been ordered to the Government at Poznań the same day"
        verdict: SUPPORTED
        evidence: "wonach dato das Nötige an die Regierung zu Posen erlaßen worden"

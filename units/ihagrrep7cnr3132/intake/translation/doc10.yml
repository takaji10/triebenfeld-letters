  marker_count: 1
  en: 'To His Royal Grand Chancellor, Minister of State, v. Goldbeck, Excellency.


    [Signature M?]


    d. 6th June both c. alltis ins.


    I thank Your Excellency most kindly for the news given me in your most esteemed letter of the 11th of this month of the return of v. Prusimski and Xaver von Jezierski. With the original cabinet order kindly communicated to me I return to you'
- page: 2
  confidence: high
  marker_count: 0
  en: 'herewith the drafts and fair copies countersigned by me, and add most obediently that, with the countersignature of His Royal Minister of State etc. v. Voss, Excellency, I have also already instructed the Chamber at Poznań to have these subjects now take the oath of allegiance.


    Berlin, 30 May 1803


    Haug[witz]'

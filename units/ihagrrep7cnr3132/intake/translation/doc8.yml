  marker_count: 1
  en: His Royal Majesty of Prussia, our most gracious Lord, hereby lets Anton v. Prusimski and Xaver von Jezierski know, on their immediate representation of 27 Jan. of this year, that the leave they asked for to return to their fatherland has been granted, on the assumption that they will conduct themselves there in future as loyal[?] subjects; that the confiscation of property decreed against them with final effect remains, however, unalterably in force, and that von
- page: 2
  confidence: high
  marker_count: 1
  en: 'Jezierski must remain deprived of his clerical offices and benefices; but that otherwise they need fear no further inquiry or punishment for their part in the insurrection, on which the necessary has been ordered to the Government at Poznań this day.


    Berlin, 11 May 1803.


    Auzl.[?] etc. special command.


    Goldbeck Haugwitz


    To the former Starost Anton v. Prusimski and Xaver von Jezierski at Dresden.'

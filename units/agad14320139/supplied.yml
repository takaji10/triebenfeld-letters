pages:
  0318_a:
  - line: 2
    supply: Hochwürden dem
    grade: A
    witness_en: 'The twin report (Pyzdry, page 1, line 2) has the whole address line: "Hochwürden dem Herrn General-Superinten-".'
    witness_de: 'Der Paralleltext (Pyzdry, Seite 1, Zeile 2) hat die ganze Zeile der Anrede: "Hochwürden dem Herrn General-Superinten-".'
  - line: 2
    nth: 2
    supply: tendenten
    grade: B
    witness_en: The word is "General-Superintendenten" (dative after "dem Herrn"); "Superintendenten" is whole on Zagórów page 2, lines 6 and 21.
    witness_de: Das Wort ist "General-Superintendenten" (Dativ nach "dem Herrn"); "Superintendenten" steht ganz auf Seite 2 von Zagórów, Zeilen 6 und 21.
  - line: 3
    supply: ischen
    grade: B
    witness_en: The address reads "Evangelisch-Augsburgischen Consistorial-Bezirks"; the twin (Pyzdry, page 1, line 3) has "Augsburgisch-" and the whole word stands on Pyzdry page 2, line 18.
    witness_de: Die Anrede lautet "Evangelisch-Augsburgischen Consistorial-Bezirks"; der Paralleltext (Pyzdry, Seite 1, Zeile 3) hat "Augsburgisch-", das ganze Wort steht auf Seite 2 von Pyzdry, Zeile 18.
  - line: 5
    supply: or [...]
    grade: B
    witness_en: The twin (Pyzdry, page 1, line 5) has "Pastor-Administrator" whole; the rest of the line stays lost.
    witness_de: Der Paralleltext (Pyzdry, Seite 1, Zeile 5) hat "Pastor-Administrator" ganz; der Rest der Zeile bleibt verloren.
  - line: 11
    supply: tref-
    grade: B
    witness_en: 'Line 12 begins "fenden": the word is "betreffenden", which stands whole on Pyzdry page 1, line 22; the twin (line 11) has the same "be-".'
    witness_de: 'Zeile 12 beginnt mit "fenden": das Wort ist "betreffenden", das ganz auf Seite 1 von Pyzdry, Zeile 22 steht; der Paralleltext (Zeile 11) hat dasselbe "be-".'
  - line: 12
    supply: len
    grade: B
    witness_en: The verb is "vorzustellen"; the twin (Pyzdry, page 1, line 12) has the same sentence ("vorzu-").
    witness_de: Das Verb ist "vorzustellen"; der Paralleltext (Pyzdry, Seite 1, Zeile 12) hat denselben Satz ("vorzu-").
  - line: 19
    supply: u-
    grade: B
    witness_en: 'Line 20 begins "le": the word is "Religions-Schule"; "Schule" is whole on line 21 of this page.'

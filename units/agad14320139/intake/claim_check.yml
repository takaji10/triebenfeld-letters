# Claim check of the summaries of AGAD 1/432/0/1/139 (agad14320139-001, -002),
# the EN and DE blocks of intake/write_summaries.py.
# Claude, an independent Opus pass, 2026-11-12. Checked against the
# transcriptions only (0318_a, 0322_a for document 1; 0322_b, 0345_a for
# document 2); supplied.yml not used; the images 0318_a and 0322_a looked at
# once, for the width of the burnt line ends and the mark before "4 Rubel".
#
# Result: document 1, 32 statements: 28 supported, 3 overstated, 1
# unsupported; document 2, 37 statements: 33 supported, 2 overstated, 2
# unsupported. The one error both summaries share: "an order of the
# consistory" - the text reads "In Folge der Anordnung [Ho?][...] / würden
# vom 30ten October", i.e. almost certainly "Ew. Hochwürden", the order of the
# General Superintendent addressed (document 2's address line begins
# "Hochwürden"); no surviving word names the consistory. Otherwise: the
# "Küster[?]" of document 1 is doubtful and not flagged; document 1's
# cemeteries "sind [...] in gutem Zustande" have a lost short word before
# "in gutem" (it could be "alle" or a negation); "candidates of theology"
# adds "of theology" (the text has only "Candidaten"); document 2's "other
# sects" is "u. s. w." in the text; document 2's text nowhere names the
# parish of Zagórow. The negations kept (document 2: no vices, no
# conversions, the sects; document 1: the sects, the dwelling) stand on
# legible "nicht"/"keine"; document 1's lost negations (vices, conversions)
# are rightly left out. The German says the same as the English throughout
# and needs the same five changes.
doc1:
  - statement: 'The report is Pastor E. Erdmann''s annual report.'
    where: 0318_a line 12 (Jahresbericht); 0322_a lines 23-24 (E. Erdmann / Pastor)
    verdict: supported
  - statement: 'It is for 1882.'
    where: not in the surviving text (the year after "30ten October" is lost, 0318_a line 9); the file's title (unit.yml) and rulings.yml give 1882
    verdict: supported
    note: 'Rests on the archive''s file title, not the document.'
  - statement: 'It is on the Evangelical parish of Zagórow.'
    where: 0318_a lines 6-7, 11 (gelisch-Augsburgischen ... Zagórow; die Parochie Zagórow)
    verdict: supported
  - statement: 'It is in German.'
    where: the whole text
    verdict: supported
  - statement: 'It answers an order of the consistory of 30 October, No. 267.'
    where: 0318_a lines 8-10 (In Folge der Anordnung [Ho?][...] / würden vom 30ten October [...] / №267)
    verdict: unsupported
    fix: 'answering an order of 30 October, No. 267 (whose order is partly lost; the surviving "...würden" points to the General Superintendent himself, "Ew. Hochwürden")'
    fix_de: 'auf eine Anordnung vom 30. Oktober, Nr. 267'
  - statement: 'It is addressed to the General Superintendent of the Warsaw Evangelical-Augsburg consistorial district.'
    where: 0318_a lines 2-4
    verdict: supported
  - statement: 'The leaf is burnt; the ends of the lines on the first page and the beginnings on the second are lost.'
    where: the pattern of [...] in 0318_a (line ends) and 0322_a (line beginnings)
    verdict: supported
  - statement: 'The congregation has a brick-built church.'
    where: 0318_a lines 14-15 (besitzt eine gemauerte Kirche)
    verdict: supported
  - statement: 'The church still lacks a baptismal font, organ and bells.'
    where: 0318_a lines 15-16 (zur völligen Einrichtung derselb[en?] [...] / len noch Taufstein, Orgel und Glocken)
    verdict: supported
    note: 'The verb is "[...]len"; "fehlen" is the only completion that fits.'
  - statement: 'The pastor''s house and the cantor''s house are very small and low.'
    where: 0318_a lines 16-17 (Sowohl das Pastora[...] / auch das Kantorhaus, sind sehr klein und niedrig)
    verdict: supported
  - statement: 'The schoolroom is spacious in proportion to the number of children.'
    where: 0318_a lines 18-19 (Das Schullokal im Verhältniß [...] / Kinderzahl entsprechend geräumig)
    verdict: supported
    note: 'The burnt end of line 18 holds about one short word, which the sentence needs to be "zur"; no room for a negation as well.'
  - statement: 'Besides the religion school at Zagórow there are 7 more schools with prayer houses.'
    where: 0318_a lines 19-21 (Außer der Religions-Sch[...] / le in Zagórow, giebt es noch 7 Schulen verbunden mit Beth[...] / in der Gemeinde)
    verdict: supported
  - statement: 'Of these one is an elementary school at Michalinowo.'
    where: 0318_a lines 21-22 (worunter nur eine Elementar-Schule in / Michalinowo)
    verdict: supported
  - statement: 'The 8 schools have about 240 children.'
    where: 0318_a lines 22-23 (Die Zahl der Kinder in den 8 Schulen ... kann sich etwa auf 240 belaufen)
    verdict: supported
  - statement: 'The sexton has no dwelling of his own.'
    where: 0318_a lines 23-24 (Für den Küster[?] / ist keine besondere Wohnung vorhanden)
    verdict: overstated
    fix: 'the sexton [the reading "sexton" is uncertain] has no dwelling of his own'
    fix_de: 'der Küster [die Lesung „Küster“ ist unsicher] hat keine eigene Wohnung'
  - statement: 'The congregation has 8 cemeteries.'
    where: 0318_a line 25 (Friedhöfe, deren in der Gemeinde 8 an der Zahl)
    verdict: supported
  - statement: 'The cemeteries are in good condition.'
    where: 0318_a lines 25-26 (sind [...] / in gutem Zustande)
    verdict: overstated
    fix: 'the congregation has 8 cemeteries, which are described as in good condition and provided with crosses [a short word before "in good condition" is lost, and the reading "crosses" is doubtful]'
    fix_de: 'die Gemeinde hat 8 Friedhöfe, die als in gutem Zustande und mit Kreuzen versehen beschrieben werden [ein kurzes Wort vor „in gutem Zustande“ ist verloren, und die Lesung „Kreuzen“ ist zweifelhaft]'
  - statement: 'The cemeteries are provided with crosses [doubtful, flagged].'
    where: 0318_a line 26 (mit Kreuzen[?] versehen)
    verdict: supported
  - statement: 'Church life is satisfactory.'
    where: 0318_a lines 27-28 (Kirchlichkeit und Kirchenbesuch / befriedigend)
    verdict: supported
  - statement: 'The communicants are 726 men [last digit uncertain], 871 women, 1,597 in all.'
    where: 0318_a line 30 (Männliche 72[6?] Weibliche 871 Summa 1597)
    verdict: supported
  - statement: 'The collection for the heathen mission was 10 roubles 71 kopecks.'
    where: 0322_a lines 3-4
    verdict: supported
  - statement: 'It was passed on to Superintendent Pastor Manitius at Warsaw.'
    where: 0322_a lines 5-7 (welche der Pastor-Administrator an den / [...] Superintendenten Pastor Manitius nach Warschau über- / [...] hat)
    verdict: supported
    note: 'A word before "Superintendenten" is lost (probably "Herrn", as in 0345_a line 5).'
  - statement: 'There are no Baptists, Irvingians or other sects.'
    where: 0322_a lines 8-9 (Baptisten, Irvingianer oder / [...]dere Sekten giebt es nicht)
    verdict: supported
  - statement: 'No remarkable events took place.'
    where: 0322_a line 12
    verdict: supported
  - statement: '67 were confirmed, 36 boys and 31 girls.'
    where: 0322_a line 13
    verdict: supported
  - statement: 'No candidates of theology live in the congregation.'
    where: 0322_a line 14 (Candidaten in der Gemeinde lebend.– Nicht vorhanden)
    verdict: overstated
    fix: 'no candidates live in the congregation'
    fix_de: 'in der Gemeinde lebten keine Kandidaten'
    note: '"of theology" is not in the text (the form''s heading says only "Candidaten").'
  - statement: 'Nothing was collected for the congregation''s own benefit.'
    where: 0322_a lines 15-16 (Zum Besten der eigenen Gemeinde wurden nicht / [...]mmelt[?])
    verdict: supported
  - statement: 'For other purposes 4 roubles 61 kopecks [first digit uncertain] were collected for grammar-school pupils intending to study theology.'
    where: 0322_a lines 16-18 (Zur Unterstü- / [...]g von Gymnasiasten, welche Theologie zu studiren gesonnen / [...] –[?] 4 Rubel 61 Kopeken)
    verdict: supported
    note: 'The "4" is not marked doubtful; the doubt is the mark before it ("–[?]"), at the burnt line start. Better: "4 roubles 61 kopecks [the mark before the 4 is uncertain]" / "4 Rubel 61 Kopeken [das Zeichen vor der 4 ist unsicher]".'
  - statement: 'The pastor-administrator sent it to the High Consistory at Warsaw.'
    where: 0322_a lines 18-19 (Selbige hat der Pastor-Administra- / [...]tor seinem Hohen Consistorium zu Warschau übersandt)
    verdict: supported
  - statement: '2 roubles 36 kopecks were collected for the widows'' and orphans'' fund.'
    where: 0322_a lines 19-21
    verdict: supported
  - statement: 'It was sent to Superintendent von Boerner.'
    where: 0322_a lines 21-22 (an Herrn Superintendenten von Boerner / [...]er[?]gesandt)
    verdict: supported
  - statement: 'It is signed E. Erdmann, pastor.'
    where: 0322_a lines 23-24
    verdict: supported

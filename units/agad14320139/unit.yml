# The transcription. Documents are delimited by [DOC N] on its own line.
corpus: corpus.txt

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts.
description: >-
  Two reports in German, in one hand, signed by Pastor E. Erdmann, for the
  year 1882, made on the form the Warsaw Evangelical-Augsburg consistory sent
  out by its order of 30 October, No. 267, with questions on church buildings,
  worship and communion, schools, missions, poor relief, morals, sects,
  remarkable events, confirmands, candidates and collections. Document 1 is
  the report on the parish of Zagórów, document 2 the report on the filial
  Lissewo-Pyzdry. The leaves were rescued from a fire and are burnt at the
  edges: on the first page of each report the ends of the lines are lost, on
  the second the beginnings, and the lost stretches are marked [...].

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Reports in a late-nineteenth-century German Kurrent hand from the
  Warsaw consistory district of the Evangelical-Augsburg church in the
  Congress Kingdom of Poland (Russian partition): Gemeinde, Filial, Pastor-
  Administrator, Kirchenwesen, Kommunikanten, Confirmirte, Collekten. Sums are
  in roubles and kopecks (Rubel, Kopeken). The leaves are burnt: [...] marks
  a stretch lost at the edge of a line, and the same mark stands in the
  English; never complete a lost word or figure. "Lissewo-Pyzdry" and
  "Zagorow" are the pastor's forms of Lisewo / Pyzdry and Zagórów.

# What the "How it was prepared" tab says (reference/prepared.yml).
prepared:
  transcription:
  - t-claude-scans
  - en: A second Claude reading compared every line with the scans; where the two readings differed and the page did not decide, the word stays marked as doubtful. A stretch of text lost to the burn is marked [...] and is never completed in the transcription. For some of those stretches the page shows proposed wording, Claude's, kept apart from the text and based on the other report of the same year, on a word's visible beginning and ending, or on the consistory's form.
    de: Eine zweite Lesung von Claude verglich jede Zeile mit den Scans; wo die beiden Lesungen abwichen und die Seite nicht entschied, bleibt das Wort als zweifelhaft markiert. Eine durch den Brand verlorene Textstelle ist mit [...] markiert und wird in der Transkription nie ergänzt. Für einige dieser Stellen zeigt die Seite einen vorgeschlagenen Wortlaut von Claude, getrennt vom Text und gestützt auf den anderen Bericht desselben Jahres, auf den sichtbaren Anfang und Schluss eines Wortes oder auf das Formular des Konsistoriums.
  translation:
  - l-claude
  - l-auto-check
  - s-claude
status: translated         # draft | transcribed | translated | published

# What the holding is about, in one sentence, English and German: the line
# under the reference on the Sources page, and the opening of the
# translator's and summariser's prompts (editor, 2026-10-01).
title: >-
  A file of the Prussian central administration for South Prussia, Prussia's
  share of partitioned Poland, on the complaints of Michalina Prusimska,
  daughter of Antoni Prusimski, whose confiscated estates had been granted to
  Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, in her case against
  Hohenlohe-Ingelfingen, 1800 to 1802; not yet transcribed.
title_de: >-
  Eine Akte der preußischen Zentralverwaltung für Südpreußen, dem preußischen
  Anteil am geteilten Polen, über die Beschwerden der Michalina Prusimska,
  Tochter des Antoni Prusimski, dessen konfiszierte Güter dem Fürsten
  Friedrich Ludwig zu Hohenlohe-Ingelfingen geschenkt worden waren, in ihrer
  Sache gegen den Fürsten, 1800 bis 1802; noch nicht transkribiert.

# For the reader: shown on this unit's provenance page.
description: >-
  The Prussian Grand Chancellor's file on the suit of Michalina Prusimska, a
  minor, against the Prince of Hohenlohe-Ingelfingen, kept from 18 June 1800 to
  29 January 1802. Through her guardian she sued before the South Prussian
  government at Poznań to recover the Brzyce estates ("Brzezier Güter"), her
  mother's property, which the King had given the Prince with her father's
  confiscated lands. Fifteen documents: two reports of the Poznań government
  enclosing copies of the King's cabinet orders of June and July 1800, which
  call in the case files and then order the case hurried and a settlement
  tried; the Prince's petition and covering letter of 30 November 1800 asking
  the Grand Chancellor to take the judgment away from Poznań, whose
  councillors also sat on the guardianship board that brought the suit; the
  Grand Chancellor's decree and drafts of 7 December giving the case to the
  government at Warsaw and the appeal to the Kammergericht; Poznań's report
  that it had already given judgment on 9 December, and the drafts of 31
  December withdrawing the order for the first instance; and Prusimska's
  petition in French to the King from Dresden, 22 January 1802, asking for
  the appeal judgment to be hastened. The incoming letters are originals, the
  Grand Chancellor's own papers are his drafts.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A file of the Grand Chancellor (the head of the Prussian department of
  justice). Incoming letters are originals; his replies are drafts, four of
  them rescripts issued in the King's name ("Friedrich Wilhelm König p",
  "Unsern p", "Sind p", "Ad mandatum": the clerk fills in the full forms when
  engrossing). Registry marks are not prose: "ad acta" (file it), "B. 5957"
  and "No. 5957" (journal numbers), "ex officio", "im Bureau zu mundiren"
  (fair copy to be made in the office), "Mund." (fair copy made), "acc." and
  "ad rec." with a day, "zur Post" (sent), "factum" (done), "praes."
  (received), and "G[oldbeck]", the Grand Chancellor's paraph. "Regierung"
  is the provincial court of justice of South Prussia (at Poznań, Kalisz,
  Warsaw), not a government in the modern sense; "Pupillen-Collegium" and
  "Vormundschafts-Collegium" are the same guardianship board; "Brzezier
  Güter" are the Brzyce estates. Latin of the legal register is the writers'
  own (Vindication, Mandatarius, Deputatus, Fiscus, in pleno, hujus, ejusdem,
  Xbr. for December). Document 14 is a heavily corrected draft that the
  transcriber read badly: a garbled passage there is a reading failure, not
  the writer's German. Document 15 is in French, in the petitioner's own
  spelling. Text that the receiving office wrote on an incoming letter stands
  at the end of that page and is not part of the letter.

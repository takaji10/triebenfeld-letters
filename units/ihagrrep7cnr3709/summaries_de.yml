ihagrrep7cnr3709-001: "Die Regierung zu Posen überreicht dem König eine Abschrift der Kabinettsordre, die in der Sache Prusimska gegen den Fürsten von Hohenlohe an sie ergangen ist. Die empfangende Behörde legt den Bericht am 23. Juni 1800 zu den Akten."
ihagrrep7cnr3709-002: "Abschrift einer Kabinettsordre des Königs an die Regierung zu Posen, dort eingegangen am 16. Juni 1800: Durch eine beiliegende Beschwerde der von Prusimska veranlasst, fordert der König die Akten ihrer Sache gegen den Fürsten von Hohenlohe-Ingelfingen wegen des mütterlichen Vermögens der Bittstellerin ein, so wie sie liegen, und befiehlt, sie sofort einzusenden."
ihagrrep7cnr3709-003: "Die Regierung zu Posen überreicht dem König eine Abschrift der Kabinettsordre vom 1. Juli, eingegangen am 7. Juli, unter Bezug auf ihren Bericht vom 18. des Vormonats. Sie bemerkt, dass der Termin zur Beweisaufnahme und zum Schlussverfahren in der Sache der Michalina von Prusimska gegen den Fürsten zu Hohenlohe-Ingelfingen auf den 22. Juli ansteht. Die empfangende Behörde legt den Bericht am 1. August 1800 in Berlin zu den Akten."
ihagrrep7cnr3709-004: "Abschrift einer Kabinettsordre des Königs an die Regierung zu Posen: Er sendet die mit dem Bericht vom 18. des Vormonats eingesandten Akten der Sache Prusimska gegen den Fürsten zu Hohenlohe-Ingelfingen zurück. Die Regierung soll die Instruktion, die durch zu viel Nachsicht gegen den Bevollmächtigten des Beklagten sehr verzögert worden sei, mit allem Fleiß beenden und dann angemessene Vergleichsvorschläge machen lassen. Kommt der Vergleich nicht zustande, soll sie für ein rasches Urteil sorgen, besonders falls nach den Gesetzen nochmals in erster Instanz erkannt werden müsste."
ihagrrep7cnr3709-005: "Der Fürst von Hohenlohe schreibt dem Großkanzler: Die minderjährige Michalina von Prusimska hat bei der Regierung zu Posen gegen ihn auf Herausgabe der ihm vom König geschenkten Brzycer Güter geklagt; die Sache soll nun zum Spruch vorgelegt werden. Da das Pupillenkollegium zu Posen den Prozess im Namen der Klägerin betreibt und seine Mitglieder zugleich Mitglieder der Regierung sind, also seine Richter wären, bittet er, das Urteil der Regierung zu Kalisch zu übertragen und ihr die Akten zuzuschicken. Die empfangende Behörde vermerkte darauf den 2. Dezember 1800."
ihagrrep7cnr3709-006: "Begleitschreiben des Fürsten von Hohenlohe an den Großkanzler zu seinem Bittschreiben vom selben Tag. Der Vergleichsvorschlag, den der Deputierte im letzten Termin gemacht hat, lasse ihn fürchten, dass die Regierung zu Posen nicht unbefangen urteilen werde. Das Lebtagsrecht des noch lebenden Vaters der Klägerin am Vermögen seiner verstorbenen Frau sei ein Teil des ihm konfiszierten Vermögens; der Deputierte habe dennoch bezweifelt, dass es dem Fiskus zustehe. Der Fürst bittet nochmals dringend, den Spruch der Regierung zu Kalisch oder einem anderen südpreußischen Kollegium aufzutragen."
ihagrrep7cnr3709-007: "Verfügung von Amts wegen: Da die meisten Räte der Regierung zu Posen Mitglieder des dortigen Vormundschaftskollegiums sind, das die Klage des Vormunds der minderjährigen Michalina von Prusimska gegen den Fürsten von Hohenlohe-Ingelfingen auf Herausgabe der Brzycer Güter veranlasst hat und den Prozess leitet, soll die Sache in erster Instanz vom Plenum der Regierung zu Warschau und in zweiter Instanz vom Oberappellationssenat des Kammergerichts entschieden werden. Dies ist der Regierung zu Posen mitzuteilen; Reskripte ergehen auch an die Regierung zu Warschau und an den Senat."
ihagrrep7cnr3709-008: "Entwurf eines königlichen Reskripts an die Regierung zu Posen: Da die meisten ihrer Räte Mitglieder des dortigen Vormundschaftskollegiums sind, das die Klage des Vormunds der Michalina von Prusimska gegen den Fürsten von Hohenlohe-Ingelfingen auf Herausgabe der Brzycer Güter veranlasst hat und leitet, wird festgesetzt, dass die Sache in erster Instanz vom Plenum der Regierung zu Warschau und in zweiter vom Oberappellationssenat des Kammergerichts entschieden wird. Beide Kollegien sind am selben Tag angewiesen worden."
ihagrrep7cnr3709-009: "Entwurf eines königlichen Reskripts an die Regierung zu Warschau: Bei der Posener Regierung schwebt zwischen dem Vormund der minderjährigen Michalina von Prusimska und dem Fürsten von Hohenlohe-Ingelfingen ein Prozess auf Herausgabe der Brzycer Güter. Da das dortige Pupillenkollegium die Klage veranlasst hat und leitet und die meisten Posener Räte ihm angehören, soll die Sache in erster Instanz vom Plenum der Regierung zu Warschau entschieden werden. Die Regierung zu Posen ist benachrichtigt. Die Reskripte gingen am 13. zur Post."
ihagrrep7cnr3709-010: "Entwurf eines königlichen Reskripts an den Oberappellationssenat des Kammergerichts: Zwischen der minderjährigen Michalina von Prusimska und dem Fürsten von Hohenlohe-Ingelfingen schwebt bei der Posener Regierung ein Prozess auf Herausgabe der Brzycer Güter. Da das Posener Vormundschaftskollegium die Klage veranlasst hat und leitet und die meisten Posener Räte ihm angehören, soll die Sache in erster Instanz vom Plenum der Regierung zu Warschau und in zweiter Instanz vom Senat entschieden werden. Die Regierungen in Posen und Warschau sind angewiesen."
ihagrrep7cnr3709-011: "Entwurf einer Antwort an den Fürsten von Hohenlohe: Sein Wunsch, dass seine Sache mit dem Vormund der Michalina von Prusimska nicht von der Regierung zu Posen entschieden werde, sei schon dadurch begründet, dass die meisten dortigen Räte dem Vormundschaftskollegium angehören, das den Rechtsstreit veranlasst hat. Der Schreiber hat deshalb verfügt, dass in erster Instanz das Plenum der Regierung zu Warschau und in zweiter der Appellationssenat des Kammergerichts entscheidet. Warschau statt Kalisch habe er gewählt, weil der Posener Präsident Graf von Danckelmann kürzlich zur Regierung in Kalisch übergegangen ist."
ihagrrep7cnr3709-012: "Die Regierung zu Posen berichtet auf das Reskript vom 7., eingegangen am 16. Dezember: In der Sache des Vormunds der Michalina von Prusimska gegen den Fürsten von Hohenlohe-Ingelfingen ist bereits am 9. Dezember in erster Instanz erkannt worden, weil die Kabinettsordre vom 1. Juli die Beschleunigung besonders empfohlen hatte. Wird ein Rechtsmittel eingelegt, will sie die Akten an den Oberappellationssenat des Kammergerichts zur Entscheidung in zweiter Instanz einsenden. Die empfangende Behörde verfügt am 31. Dezember 1800, der Regierung zu Warschau mitzuteilen, dass das Reskript vom 7. Dezember keine Anwendung finde."
ihagrrep7cnr3709-013: "Entwurf eines königlichen Reskripts an die Regierung zu Warschau: Ihr war durch das Reskript vom 7. Dezember das Urteil erster Instanz im Prozess zwischen dem Vormund der Michalina von Prusimska und dem Fürsten von Hohenlohe-Ingelfingen wegen der Brzycer Güter aufgetragen worden. Die Posener Regierung hat aber angezeigt, dass sie das Urteil bereits am 9. gefällt hat, also vor Eingang der Verfügung; das Reskript findet daher keine Anwendung. Zur Post gegeben am 5. Januar 1801."
ihagrrep7cnr3709-014: "Entwurf eines Schreibens an den Fürsten von Hohenlohe, stark korrigiert und schlecht lesbar: Die Regierung zu Posen hat seine Sache gegen Michalina von Prusimska infolge der Kabinettsordre vom 1. Juli, die ihr den schnellen Betrieb empfahl, so beschleunigt, dass bereits erkannt war, als die Verfügung vom 7. Dezember dort einging. Es bleibt bei der Verfügung, dass die Akten zum Spruch in zweiter Instanz an den Oberappellationssenat des Kammergerichts eingeschickt werden."
ihagrrep7cnr3709-015: "Michalina Prusimska bittet den König auf Französisch um Beschleunigung: Vor achtzehn Monaten habe sie ihm in Posen eine Denkschrift überreicht und um das Vermögen gebeten, das ihr nach dem Tod ihrer Mutter zustehe; er habe versprochen, die Justiz zu beschleunigen. Nach vier Jahren sei der in Posen begonnene Prozess erst in erster Instanz entschieden, und die Entscheidung sei nun an den Gerichtshof in Berlin gegangen. Als verlassene Waise klage sie gegen den Fürsten von Hohenlohe. Die Bitte wird am 26. Januar 1802 dem Minister von der Reck zur Beschleunigung zugewiesen; er lässt ihr am 29. Januar mitteilen, sie habe die Publikation des Appellationsurteils zu erwarten."

title: >-
  An entry from the register of the castle court at Konin of 9 June 1788:
  Prusimski's man brings before the office the cart, oxen, cow and mare of a
  peasant of Chełmski's, taken in the Trąbczyn pine wood as he carted off a
  felled tree.
title_de: >-
  Ein Eintrag aus dem Register des Burggerichts Konin vom 9. Juni 1788:
  Prusimskis Diener führt dem Amt Wagen, Ochsen, Kuh und Stute eines Bauern
  Chełmskis vor, die im Trąbczyner Kiefernwald beschlagnahmt wurden, als er
  einen gefällten Baum abfuhr.

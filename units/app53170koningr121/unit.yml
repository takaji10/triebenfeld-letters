# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry from the register of the castle court of Konin for 1787 and 1788,
  in Latin with the cart and animals described in Polish as well. On 9 June
  1788 Ludwik Żurawski, a servant of Antoni Prusimski, presents to the office
  the cart, two oxen, cow and mare of Marcin Gryndel, a peasant of Chełmski's
  estate of Łomowo, whom the Trąbczyn forest keeper caught in the Trąbczyn
  pine wood carting off a felled tree fit for building, and leaves them at the
  chancery to be given back to Gryndel.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  An entry of a court register of 1788, in formulaic Latin with Polish glosses
  introduced by "als" or "alias". The English is the editor's own translation.
  "Praesentatio" is the showing of seized things to the office as proof;
  "extraditio" their return to the owner; "quietatio" a receipt; "cmetho" a
  peasant farmer.

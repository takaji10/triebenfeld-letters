app53170koningr121-001:
- {claim: "Eintrag vom 9. Juni 1788 im Buch des Burggerichts Konin. Ludwik Żurawski, im Dienst von Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, führt dem Amt ein Gespann vor: einen Wagen, vorn mit unbeschlagenen und hinten mit beschlagenen Rädern, zwei Ochsen, eine Kuh und eine kastanienbraune Stute", verdict: supported, where: "Actum in Conin Die Nona Mensis Junii Anno Domini Millesimo Septingentesimo Octuagesimo Octavo; Nobilis Ludovicus Zurawski Illustri Magnifico Antonio in Kolno Prusimski ... inserviens ... praesentavit Officio Eidem Currum cum prioribus binis rothis nudis ... cum posterioribus vero rothis sublamina ferri superposita existentibus ... boves duos ... nec non Vaccam ... atque Equam Castaneam"}
- {claim: "Das Gespann gehört Marcin Gryndel, einem Bauern aus Łomowo, einem Gut von Chełmski, Schatzmeister von Wschowa, das zu dessen Hauptgut Łukom gehört", verdict: supported, where: "Laborioso Martino Gryndel de Bonis Łomowo Magnifici Scibor Chełmski Thesaurarii Vschovensis ... ad Bona Principaliora Łukom ... spectantibus Cmethoni"}
- {claim: "Gryndel war in den Kiefernwald gefahren, der zu Prusimskis Erbgut Trąbczyn gehört und nie strittig war, und fuhr von dort schon einen gefällten, zum Bauen tauglichen Baum nach Hause; der Trąbczyner Waldhüter hielt ihn im Wald an", verdict: supported, where: "Borram ad Bona Trąmpczyna ... haereditaria spectantem et pertinentem et in nulla unquam disputatione haereditatis existentem inequitanti et de Eadem Borra Arborem excisam ad Bona mentionata Łomowo Domum Suam jam Vehenti ad aedificia Valentem et aptam in haccemet Borra per Custodem Sylvarum Trąmpczynensium interceptos"}
- {claim: "Nach der Vorführung überlässt Żurawski Tiere und Wagen bei der Kanzlei zur Herausgabe an Gryndel, der sie sofort verlangt; darüber ist am selben Tag eine Quittung eingetragen", verdict: supported, where: "circa Cancellariam praesentem Castrensem Coninensium gratia Extraditionis Eorundem Suprascripti laborioso Gryndel ad statim Extraditionem horumce ... requirenti (pro ut praemissa Extraditionis Quietatio ... Die hodierna in Actu exarata subsecuta fusius in se edisserit) reliquit"}

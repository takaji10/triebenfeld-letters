app53170koningr121-001: "Eintrag vom 9. Juni 1788 im Buch des Burggerichts Konin. Ludwik Żurawski, im Dienst von Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, führt dem Amt ein Gespann vor: einen Wagen, vorn mit unbeschlagenen und hinten mit beschlagenen Rädern, zwei Ochsen, eine Kuh und eine kastanienbraune Stute. Das Gespann gehört Marcin Gryndel, einem Bauern aus Łomowo, einem Gut von Chełmski, Schatzmeister von Wschowa, das zu dessen Hauptgut Łukom gehört. Gryndel war in den Kiefernwald gefahren, der zu Prusimskis Erbgut Trąbczyn gehört und nie strittig war, und fuhr von dort schon einen gefällten, zum Bauen tauglichen Baum nach Hause; der Trąbczyner Waldhüter hielt ihn im Wald an. Nach der Vorführung überlässt Żurawski Tiere und Wagen bei der Kanzlei zur Herausgabe an Gryndel, der sie sofort verlangt; darüber ist am selben Tag eine Quittung eingetragen."

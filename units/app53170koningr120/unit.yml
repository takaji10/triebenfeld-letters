# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Two entries from the register of the castle court of Konin for 1785 and
  1786, in Latin. In the first Andrzej Kinos, a subject from Trąbczyn, shows
  the office the injuries he says Marcin Sarzyński gave him on the public road
  at Obory (14 March 1785). The second is a court messenger's report of a
  citation of 2 October 1786 by which Stanisław Chełmski summons Antoni
  Prusimski before the Crown Tribunal: Prusimski is to produce under oath the
  contract for the sale of an oak wood made with the merchant Jan Tracholz,
  and the land court's decrees fixing a sitting on the ground are to be
  carried out.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Two entries of a court register of 1785 and 1786, in formulaic and
  abbreviated Latin. The English is the editor's own translation. "Obduxit"
  heads the formal showing of wounds to the office; "relatio" is a court
  messenger's report that he has served a citation; "condescensio" a sitting
  of a court on the ground in dispute; "comportatio" the production of a
  document.

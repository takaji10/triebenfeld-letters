- page: 2
  confidence: high
  marker_count: 0
  en: 'remaining with you, the oath having been administered beforehand, to be bound, or the same presentation
    to be fulfilled at the designated place, to be prescribed. Now indeed in our Court, with penalties
    against you the cited party — both with respect to the remission procured from the Condescensorial
    Court to the Plenary Court, and thereafter from our Plenary Court to the Tribunal Court, and contrary
    to the decrees duly and legitimately passed accepting a condescension designating the institution
    of terms and of the cause not yet decided in the lesser bench, extended separately to the Court of
    Supreme Instance of Evocation, and from the circumstances of the matter and the cause occurring —
    the Land Court Decrees of Kalisz, passed in the jurisdiction of the Konin district, the whole matter
    having been suspended with the consent also of you the cited party, [decrees] designating a condescension
    to be carried out, to be arranged; all manner of satisfaction to be found for the plaintiff and ordered
    to be rendered; the rest according to the conclusion to be put; and the earlier terms of the plaintiff
    to be decided and resolved.


    Given at Piotrków on 2 October in the Year of the Lord 1786.


    In the manor court of the goods of the village of Trąmpczyn, on the table of the heated room, with
    the representative of the cited party present, on the 2nd day of the month and year expressed in the
    act above, [he states that he] placed [it] and left [it] notified.'

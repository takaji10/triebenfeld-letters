  en: 'On the part of Right Honourable Chełmski against His Worship Prusimski — Return of Service to the
    Tribunal


    Coming personally, Providus Sebastianus Biegański of the village of Słask, General Royal Summoner,
    sound [of mind], acknowledged that he had cited [with] authentic letters of citation of the Ordinary
    General Sessions of the Crown Tribunal of Piotrków, the below-written edict of the following tenor:


    Stanisław August, by the Grace of God King of Poland, etc. To you, the Illustrious Right Honourable
    Antoni Prusimski of Kolno, starosta [district administrator] of Niszczewice, Knight of the Order of
    Saint Stanisław, regarding your goods We command that at our Ordinary General Sessions of the Crown
    Tribunal of Piotrków, properly within four weeks from the date and delivery of this present citation,
    or at such time when the present cause, called and proclaimed for judgment from the register competent
    to it, shall fall due, you appear personally and lawfully, at the instance of Right Honourable Stanisław
    Chełmski, skarbnik [treasurer] of Wschowa, plaintiff, who cites you to the prepared, connected and
    competent inscriptions, to see and hear yourself — to the production of a specific document, namely
    the contract for the sale of oak woodland, entered into and concluded with the Honourable Joannes
    Trachultz,'
  names: []

  en: 'Done at Konin on 14 March in the Year of the Lord 1785


    The Hard-working Andreas Kinos of Trąmpczyn filed an obduction


    Coming personally, Laboriosus Andreas Kinos, from the goods of the village of Trąmpczyn, adhering
    to the common law, showed to the present office the bruises written below, namely: the right eye suffused
    with blood all around; under the same eye the flesh swollen and livid; likewise the left eye suffused
    with blood through the middle and livid; likewise the entire face swollen; likewise the right shoulders
    swollen. Which aforementioned injuries he asserted, himself the same one filing this report, to have
    been inflicted and visited upon him by force and violence with fists and a stick by Right Honourable
    Martinus Sarzyński on the public road, while departing from home to the town of Pleszew, cutting off
    his path in the village of Obory, on the most recent past Saturday.'

app53170koningr120-001: "Eintrag vom 14. März 1785 im Buch des Burggerichts Konin. Andrzej Kinos, ein Untertan aus dem Dorf Trąbczyn, zeigt dem Amt seine Verletzungen: das rechte Auge ringsum blutunterlaufen, darunter geschwollen und blau, das linke Auge blutunterlaufen und blau, das ganze Gesicht geschwollen, die rechte Schulter geschwollen. Er gibt an, Marcin Sarzyński habe sie ihm am vergangenen Samstag mit Fäusten und einem Stock zugefügt, als er ihm im Dorf Obory auf öffentlicher Straße den Weg zur Stadt Pleszew versperrte."
app53170koningr120-002: "Bericht des Gerichtsboten Sebastian Biegański von Sławsk, eingetragen in Konin Ende 1786. Er hat Antoni Prusimski von Kolno, Starost von Niszczewice, eine königliche Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am 2. Oktober 1786, auf Betreiben von Stanisław Chełmski, Schatzmeister von Wschowa. Prusimski soll unter Eid angehalten werden, eine bestimmte Urkunde vorzulegen, die bei ihm verblieben sei: den mit dem Kaufmann Jan Tracholz geschlossenen Vertrag über den Verkauf eines Eichenwaldes. Er soll ferner dafür bestraft werden, dass er die Sache vom Gericht des Ortstermins an das volle Landgericht und von dort an das Tribunal hat verweisen lassen; die Dekrete des Kalischer Landgerichts in Konin, die den Ortstermin ansetzen, sollen vollzogen werden. Der Bote hat die Ladung im Gutshof von Trąbczyn hinterlegt."

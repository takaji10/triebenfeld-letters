# German summaries of APP 53/6/0/-/46, written in the working session from the Latin as read on the microfilm
# (intake/holding.py, 2026-10-07).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app536046-001: "Dekret des Landgerichts in Konin aus der Sitzung, die am 20. Oktober 1777 begann, Eintrag Nr. 16. Stanisław Chełmski, Erbherr von Łukomia, verlangt als Kläger von Antoni Prusimski, Starost von Niszczewice, die Vorlage eines Akts, der wie ein Grenzakt zwischen den Gütern Łukom und Trąbczyn von Kommissaren der Stände erlassen worden sei. Er legt drei Nachsuchen vor, in Kalisz vom Samstag nach Mariä Opferung 1776, in Kościan vom 2. Januar und in Konin vom Oktober des laufenden Jahres, und beweist damit, dass der Akt nicht in den Akten der eigenen Woiwodschaft steht. Prusimski legt seinerseits eine Nachsuche vor, die am 10. Oktober 1777 beim Burggericht Brześć Kujawski vorgenommen und am 16. Oktober in Konin eingetragen wurde, und zeigt, dass das Dekret der Kommission 1776 in Brześć Kujawski eingetragen worden ist. Weil Rechte, Vergleiche und Dekrete in der eigenen Woiwodschaft vorzulegen sind, verpflichtet das Gericht Prusimski, das Dekret binnen vier Wochen bei den Burgakten in Konin eintragen zu lassen, bei Strafe der Acht. Die Lesung beruht auf einem Mikrofilm und ist an mehreren Stellen unsicher."
app536046-002: "Dekret des Kalischer Landgerichts in Konin, Eintrag Nr. 17 der Sitzung, die am 20. Oktober 1777 begann, zwischen denselben Parteien wie der Eintrag davor: dem Kläger und dem Geladenen, der persönlich erschienen ist. Stanisław Chełmski klagt aus einer Übertragung, die am Mittwoch, dem Vorabend von Mariä Geburt 1768, vor dem Burggericht Pyzdry anerkannt wurde: Der Kaufmann Jan Tracholz hat ihm darin verschiedene Summen abgetreten, die er vom verstorbenen Paweł Prusimski forderte. Chełmski verlangt, dass Prusimski, Starost von Niszczewice, den Vertrag über den Verkauf des Trąbczyner Kiefernwaldes vorlegt, der mit Tracholz und Paweł Prusimski geschlossen wurde. Dem Gericht wird nachgewiesen, dass ein Dekret seiner früheren Sitzung vom Montag nach Septuagesima 1766 zwischen Tracholz und Antoni Prusimski die Sache auf einen Ortstermin verwiesen hat und dass es nicht ausgeführt worden ist. Das Gericht setzt deshalb die ganze Sache aus und hält auf Antrag der Parteien einen Ortstermin des Gerichts auf dem Grund von Trąbczyn für nötig, am Montag nach Laetare des kommenden Jahres. Der Richter, der dorthin geholt wird, soll Prusimski die Vorlage des Vertrags auferlegen, die Sache endgültig entscheiden, Zeugen verhören und Eide abnehmen. Die Parteien haben ihm bei Strafe der Acht zu gehorchen und zu laden, wen die Sache erfordert."

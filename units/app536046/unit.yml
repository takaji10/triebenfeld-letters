# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  Two decrees of the land court at Konin of its sitting of October 1777: one
  orders Prusimski to enter at Konin, within four weeks, the boundary decree
  given for him, which stood only in the records of Brześć Kujawski; the
  other sends Chełmski's claim under the debt bought from the merchant
  Tracholz to a hearing on the ground of Trąbczyn.
title_de: >-
  Zwei Dekrete des Landgerichts in Konin aus dessen Sitzung vom Oktober 1777:
  Das eine verpflichtet Prusimski, das für ihn ergangene Grenzdekret, das nur
  in den Akten von Brześć Kujawski stand, binnen vier Wochen in Konin
  einzutragen; das andere verweist Chełmskis Klage aus der vom Kaufmann
  Tracholz gekauften Forderung auf einen Ortstermin auf dem Grund von Trąbczyn.

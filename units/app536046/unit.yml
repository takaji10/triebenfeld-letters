# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry, no. 16 of its sitting, in a book of decrees of the land court at
  Konin for 1773 to 1777, in heavily abbreviated Latin: it begins on leaf 182
  verso and ends at the foot of leaf 182 recto. The sitting opened at Konin on
  20 October 1777. Stanisław Chełmski, heir of Łukomia, plaintiff, demands of
  Antoni Prusimski, Starost of Niszczewice, the production of an act "as
  though a boundary act" given between Łukom and Trąbczyn by commissioners
  appointed by the Estates, and proves by three searches (at Kalisz on 23
  November 1776, at Kościan on 2 January, at Konin in October 1777) that it is
  not in the records of its own province. Prusimski answers with a search made
  at Brześć Kujawski on 10 October 1777, which shows the decree entered there
  in September 1776. Because rights, settlements and decrees must be entered
  in their own province, the court orders Prusimski to bring the decree to the
  castle records at Konin within four weeks, on pain of outlawry.
  A second entry, no. 17 of the same sitting and between the same parties,
  follows on leaf 183 recto: Chełmski sues under the transfer of 1768 by
  which the merchant Jan Tracholz made over to him sums claimed from the
  late Paweł Prusimski, and the court, finding its decree of 1766 for a
  hearing on the ground not carried out, fixes one at Trąbczyn.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A decree of a Polish land court of 1777 in heavily abbreviated Latin, read
  from a microfilm; several words are still in doubt. "Requisitio" is a search
  of a court's books made on request, with its certificate; "comportatio",
  "edere" the production of a document in court; "oblata" a paper brought in
  to be entered; "actus campestris" an act done on the ground; "in proprio
  palatinatu" in the province where the land lies; "banitio" outlawry. Brest
  in Kuyavia is Brześć Kujawski; Costen is Kościan.

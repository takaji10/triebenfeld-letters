# The claim check of the German summary of APP 53/6/0/-/46, made in session
# on 2026-10-07 under the rules read_letters.py --verify gives its checker:
# each statement held to the document, as supported, overstated or
# unsupported, and the summary then only weakened or cut, never added to. Not
# the paid run; there is no reading.json. The document was read in the Latin
# of corpus.txt as checked against the microfilm.
#
# Result: 7 statements, all supported after one was weakened: the day of the
# search at Konin is given in the text as the 28th, but the film may have the
# 20th, so the summary says only "October".

app536046-001:
- {claim: "Dekret des Landgerichts in Konin aus der Sitzung, die am 20. Oktober 1777 begann, Eintrag Nr. 16", verdict: supported, where: "the heading of the sitting (intake/holding.py): Die 20 mensis Octobris Anno 1777 in Conin celebratis; p. 1: No. 16: ... Judicium ... Decidendo"}
- {claim: "Stanisław Chełmski, Erbherr von Łukomia, verlangt als Kläger von Antoni Prusimski, Starost von Niszczewice, die Vorlage eines Akts, der wie ein Grenzakt zwischen den Gütern Łukom und Trąbczyn von Kommissaren der Stände erlassen worden sei", verdict: supported, where: "p. 1: Magnificus Chełmski ... Prusimski Eden~ comportat~ actus cujusdam ac si Granitialis per Commissarios a statibus Regni designatos ... Inter Bona Łukom et Trąbczyn prolati praetendit"}
- {claim: "er legt drei Nachsuchen vor, in Kalisz vom Samstag nach Mariä Opferung 1776, in Kościan vom 2. Januar und in Konin vom Oktober des laufenden Jahres", verdict: supported, where: "p. 1: Requisitionesque trinas ... primam coram actis Castrensibus Calissiensibu Sabbatho post Festum Praesentationis Gloriosissimae Virginis Mariae anno 1776 ... secundam coram actis Castrensibus Costenensibus Die 2da mensis Januarii ... tertiam coram actis Castren~ Coninen~ Die 28 mensis 8bris anno praesenti. First written with the day; weakened to the month"}
- {claim: "und beweist damit, dass der Akt nicht in den Akten der eigenen Woiwodschaft steht", verdict: supported, where: "p. 1: Actumque Eundem Campestrem Comportari praetensum in actis proprii Palatinatus non extasse probat"}
- {claim: "Prusimski legt seinerseits eine Nachsuche vor, die am 10. Oktober 1777 beim Burggericht Brześć Kujawski vorgenommen und am 16. Oktober in Konin eingetragen wurde", verdict: supported, where: "pp. 1-2: Requisitionem ... Decreti Commissorialis Granitialis ... coram actis Castrensibus Bresten~ Cujaviae Die 10 mensis praesentis 8bris anno praesen~ factam et actis Castrensibus Coninensibus die 16 mensis Ejusdem ... oblatuatam"}
- {claim: "und zeigt, dass das Dekret der Kommission 1776 in Brześć Kujawski eingetragen worden ist", verdict: supported, where: "p. 2: Decretum hocce Commissoriale sub actu Feriae Tertiae post festum Sancti Matthaei Apostoli et Evangelistae anno praeterlapso 1776 coram actis Castrensibus Brestensibus Cujaviae oblatuatum esse deducit"}
- {claim: "weil Rechte, Vergleiche und Dekrete in der eigenen Woiwodschaft vorzulegen sind, verpflichtet das Gericht Prusimski, das Dekret binnen vier Wochen bei den Burgakten in Konin eintragen zu lassen, bei Strafe der Acht", verdict: supported, where: "p. 2: Jura vero transactiones omnes et decreta in proprio Palatinatu oblatam porrigi Debent Ideo Decernit Judicium Quatenus Magnificus Prusimski ... Decretum superius specificatum in spatio quatuor septimanarum ab actu praesenti ad acta Castren~ Coninen~ sub paena banitionis ... per oblatam porrigat"}

# Document 2 was transcribed and summarised in the working session on 2026-10-07; its 7 statements were
# held to its text the same way. All supported.
app536046-002:
- {claim: "Dekret des Kalischer Landgerichts in Konin, Eintrag Nr. 17 der Sitzung, die am 20. Oktober 1777 begann, zwischen denselben Parteien wie der Eintrag davor: dem Kläger und dem Geladenen, der persönlich erschienen ist", verdict: supported, where: "N. 17mo Inter Eundem Actorem per Eundem et Eundem Citatum personaliter; the heading of the sitting (rulings.yml)"}
- {claim: "Stanisław Chełmski klagt aus einer Übertragung, die am Mittwoch, dem Vorabend von Mariä Geburt 1768, vor dem Burggericht Pyzdry anerkannt wurde: Der Kaufmann Jan Tracholz hat ihm darin verschiedene Summen abgetreten, die er vom verstorbenen Paweł Prusimski forderte", verdict: supported, where: "virtute transfusionis coram actis Castrensibus Pyzdrensibus Feria 4ta in Vigilia Festi Nativitatis Beatissimae Virginis Mariae anno 1768 per Excellentem Joannem Tracholz mercatorem ... super summas varias ab olim Magnifico Paulo Prusimski praetensas in Personam Ejusdem Magnifici Chełmski recognitae"}
- {claim: "Chełmski verlangt, dass Prusimski, Starost von Niszczewice, den Vertrag über den Verkauf des Trąbczyner Kiefernwaldes vorlegt, der mit Tracholz und Paweł Prusimski geschlossen wurde", verdict: supported, where: "actoratum Magnifico Prusimski Capitaneo Nieszczevicen~ instituendo Comportationem contractus respectu Divenditionis Borrae Trąbczynen~ cum honorato Tracholz et olim M. Paulum Prusimski"}
- {claim: "Dem Gericht wird nachgewiesen, dass ein Dekret seiner früheren Sitzung vom Montag nach Septuagesima 1766 zwischen Tracholz und Antoni Prusimski die Sache auf einen Ortstermin verwiesen hat und dass es nicht ausgeführt worden ist", verdict: supported, where: "Decretum in anteactis Judiciis suis Feria 2da post Dominicam Septuagesimae anno 1766 Inter honoratum Joannem Tracholz et M. Antonium Prusimski modernum Citatum remissionis causae ad Terminum Condescensionis intercessisse et non effectuatum esse"}
- {claim: "Das Gericht setzt deshalb die ganze Sache aus und hält auf Antrag der Parteien einen Ortstermin des Gerichts auf dem Grund von Trąbczyn für nötig, am Montag nach Laetare des kommenden Jahres", verdict: supported, where: "proinde suspenso toto negotio necessariam esse Condescensionem in Fundum Bonorum Trąbczyn affectan~ Partibus Judicii sui In et pro Feria 2da post Dominicam Laetare Quadragesimalem in anno futuro venturam adinvenit"}
- {claim: "Der Richter, der dorthin geholt wird, soll Prusimski die Vorlage des Vertrags auferlegen, die Sache endgültig entscheiden, Zeugen verhören und Eide abnehmen", verdict: supported, where: "Qui Conducendus Comportationem contractus superius specificati per M. Prusimski Capitaneum Nieszczevicen~ demandabit Causamque praesentem ... finaliter decidet et disjudicabit ... Inquisitiones pro oportunitate negotii expediet Juramenta ubi necesse fuerit et a quo intererit excipiet"}
- {claim: "Die Parteien haben ihm bei Strafe der Acht zu gehorchen und zu laden, wen die Sache erfordert", verdict: supported, where: "Partes parere et acquiescere sub paena banitionis ... debebunt et tenebuntur ... Partes quos negotium exigent adcitent"}

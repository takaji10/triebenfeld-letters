# What the check of APP 53/6/0/-/46 against the microfilm changes for anyone
# who has written about this decree from the earlier text. Read by
# pipeline/review/changes_page.py.
# importance: significant | fact | wording.

unit: "APP 53/6/0/-/46: the land court's decree of October 1777"
changes:
- importance: significant
  what: "Who proves what was the other way round. It is Chełmski who lays down the three searches and proves by them that the act was NOT in the records of its own province (\"in actis proprii Palatinatus non extasse probat\"). The English had Prusimski producing the acts, requisitioning three oblatas, and claiming they HAD been noted there."
  was: "the Right Honourable Prusimski, having produced and brought forward certain acts ... and having likewise requisitioned three [oblatas] ... and [claiming] that the field acts likewise brought forward as alleged had been noted in the records of the proper palatinate; proves [this claim]"
  now: "Although the Right Honourable Chełmski ... claims from the Right Honourable Prusimski the production of a certain act ... and, laying before the court three searches for that same Boundary act ... proves that the said field act, whose production is claimed, was not in the records of its proper palatinate"
- importance: significant
  what: "What Prusimski lays down is a search for the decree, made at Brześć Kujawski on 10 October 1777 and entered at Konin on 16 October. The English had the decree itself \"inserted\" and filed on those days."
  was: "[having] requisitioned through the Honourable Ludwik Łański in the name of his party, inserted the Commissorial Boundary Decree ... filed before the records of the Brest [Kuyavia] Municipal Court on the 10th day of the [aforesaid?] month of October"
  now: "[lays down] a search, made through the Honourable Ludwik [uncertain: Łański] in the name of the party concerned, for the Commissorial Boundary Decree ... a search made before the records of the Municipal Court of Brest in Kuyavia on the 10th day of the present month of October"
- importance: significant
  what: "This decree is why the boundary decree stands in the Konin book (Konin Gr.145): the land court orders Prusimski to enter it at Konin, in its own province, within four weeks. The first of Chełmski's three searches, at Kalisz on 23 November 1776, is Kalisz Gr.424."
  was: "(not noted)"
  now: "units/app536046/about.md"
- importance: fact
  what: "The entry is in two places: it begins on leaf 182 verso and ends at the foot of leaf 182 recto, where the clerk sent the reader (\"sub nro 15\"). The part your file heads \"[182v] N. 16to\" is the next entry, no. 17, on leaf 183 recto. It has no English and a very doubtful Latin, and is not built."
  was: "[182v], [182], [182v]"
  now: "leaf 182 verso, then the foot of leaf 182 recto; entry no. 17 left out"
- importance: fact
  what: "The opening is the set formula of a decree: the court, \"deciding the term of the plaintiff party brought before it\". Prusimski is \"cited, in person\"."
  was: "as Defendant, personally appearing — the Court having heard the parties judicially and the term having been called — a Decree is issued to the Plaintiff's side"
  now: "cited, in person — the Court, deciding the term of the Plaintiff party brought before it, the controversies having been heard"
- importance: fact
  what: "Still in doubt on the film: two words after \"Licet\"; the surname of Ludwik (Łański?); a word before \"erronee extraditam\" (the date wrongly given out?); and whether the search at Konin is of the 28th or the 20th of October."
  was: "(ten places marked)"
  now: "units/app536046/notes.md"
- importance: significant
  new: "new source, transcribed 2026-10-07"
  where: "A new source: entry no. 17, leaf 183 recto (document 2 of this holding)"
  what: "A text you have not had in a form you could use. You photographed this entry and made a first reading of it, with more than forty marks of doubt and no English; it stands in your Latin file under \"[182v] N. 16to\", but it is no. 17 and it is on leaf 183 recto. I read it again from the film and translated it. It is the decree behind the suit of 1778 in Konin Gr.117: Chełmski sues Prusimski under the transfer of 7 September 1768 (the Wednesday, the eve of the Nativity of the Virgin), acknowledged at Pyzdry, by which the merchant Jan Tracholz made over to him sums claimed from the late Paweł Prusimski, and demands the contract for the sale of the Trąbczyn pine wood. The court finds that its decree of the Monday after Septuagesima 1766 (27 January), which sent the cause between Tracholz and Antoni Prusimski to a hearing on the ground, was never carried out; it suspends the matter and fixes a hearing of the court on the ground of Trąbczyn for the Monday after Laetare Sunday of the coming year (30 March 1778). Where my reading differs from yours in sense: the sums are claimed \"ab olim Magnifico Paulo\", from the late Paweł; the term is of a \"Condescensio\" (your \"Condicionalis\"); the decree of 1766 is \"non effectuatum\", not carried out; the hearing is \"in anno futuro venturam\"; the judge \"Juramenta ... excipiet\", takes oaths; and the last word is \"compareant\". Two words you have since settled on the page: the merchant's town, \"Vitkovien~\" (I give it as Witkowo in the English: that identification is mine), and \"initorum\". One thing to check in your own work: this decree names the Monday after LAETARE for the hearing, and the citation to it in Konin Gr.117 names the Monday after INVOCAVIT (9 March 1778). You have looked at both, and each stands as written."
  was: "(your first reading, in your Latin file under \"[182v] N. 16to\"; no English)"
  now: "N. 17mo Inter Eundem Actorem per Eundem et Eundem Citatum personaliter Judicium etc. Terminum Partis Actoreae ad Judicium suum editum Decidendo controversiis exauditis Licet si Magnificus Stanislaus Chełmski virtute transfusionis coram actis Castrensibus Pyzdrensibus Feria 4ta in Vigilia Festi Nativitatis Beatissimae Virginis Mariae anno 1768 per Excellentem Joannem Tracholz mercatorem et Incolam Vitkovien~ super summas varias ab olim Magnifico Paulo Prusimski praetensas in Personam Ejusdem Magnifici Chełmski recognitae actoratum Magnifico Prusimski Capitaneo Nieszczevicen~ instituendo Comportationem contractus respectu Divenditionis Borrae Trąbczynen~ cum honorato Tracholz et olim M. Paulum Prusimski initorum praetendit Cum vero Judicio suo Deducitur Decretum in anteactis Judiciis suis Feria 2da post Dominicam Septuagesimae anno 1766 Inter honoratum Joannem Tracholz et M. Antonium Prusimski modernum Citatum remissionis causae ad Terminum Condescensionis intercessisse et non effectuatum esse proinde suspenso toto negotio necessariam esse Condescensionem in Fundum Bonorum Trąbczyn affectan~ Partibus Judicii sui In et pro Feria 2da post Dominicam Laetare Quadragesimalem in anno futuro venturam adinvenit Decernendo Quatenus Partes hoc Idem Judicium absentia Duorum uniusve non obstante Conducant Quod sive Qui Conducendus Comportationem contractus superius specificati per M. Prusimski Capitaneum Nieszczevicen~ demandabit Causamque praesentem pro exigentia Legis Justitiae nexus Documentorum contenta Partis actoreae Terminorum resolutis quibusvis dubiis et Intervenien~ finaliter decidet et disjudicabit satisfactionem cui quanta et a quo intererit Decernet Inquisitiones pro oportunitate negotii expediet Juramenta ubi necesse fuerit et a quo intererit excipiet rigores annectet. Cujus Judicii Condescensuri Partes parere et acquiescere sub paena banitionis coram Eodem Conducendo Judice super Parte contraveniente In casu contraventionis publicanda debebunt et tenebuntur. Luita paena 14 marcarum Polonicalium Parti per Partem compensanda Judicio in instanti sub solito rigore per medium solvenda pro quo Condescensionis Termino Partes quos negotium exigent adcitent adcitati sub rigore suprascripto compareant."
  english_now: "No. 17: Between the same Plaintiff, through the same, and the same Cited, in person — the Court, etc., deciding the term of the Plaintiff party brought before it, the controversies having been heard: Although the Right Honourable Stanisław Chełmski — by virtue of a transfer, acknowledged before the records of the Pyzdry Municipal Court on Wednesday, the Eve of the Feast of the Nativity of the Most Blessed Virgin Mary, in the year 1768 by the Excellent Jan Tracholz, merchant and inhabitant of Witkowo, of various sums claimed from the late Right Honourable Paweł Prusimski, into the person of the same Right Honourable Chełmski — instituting a suit against the Right Honourable Prusimski, Starost of Niszczewice, claims the production of the contract concerning the sale of the Trąbczyn pine forest entered into with the Honest Tracholz and the late Right Honourable Paweł Prusimski; since, however, it is shown to the Court that in its earlier sessions, on Monday after Septuagesima Sunday in the year 1766, a decree of remission of the cause to a condescension term had intervened between the Honest Jan Tracholz and the Right Honourable Antoni Prusimski, the present Cited, and has not been carried out: the Court therefore, the whole matter being suspended, finds a condescension of its court to the ground of the estates of Trąbczyn to be necessary, the parties requesting it, on and for the Monday after Laetare Sunday in Lent next coming in the coming year — decreeing that the parties shall bring this same court, the absence of two or of one notwithstanding; which court, or he who is to be brought, shall order the production of the contract specified above by the Right Honourable Prusimski, Starost of Niszczewice, and shall finally decide and adjudge the present cause as law, justice, the tenor of the documents and the contents of the Plaintiff party's terms require, all doubts and interventions being resolved; shall decree satisfaction, to whom, how much and from whom it shall be due; shall conduct inquisitions as the matter requires; shall receive oaths where necessary and from whom it shall be due; and shall attach rigours. The parties shall be bound and obliged to obey and to acquiesce in that court of the condescension, under penalty of outlawry, to be published before the same judge who is to be brought, upon the contravening party in case of contravention. The penalty of fourteen Polish marks having been paid — to be set off party against party, and paid to the Court forthwith, under the usual rigour, by halves. For which condescension term the parties shall cite those whom the matter requires; those cited shall appear under the rigour written above."

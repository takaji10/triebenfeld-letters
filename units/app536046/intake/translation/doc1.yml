  en: 'No. 16: Between the Right Honourable Stanisław Chełmski, heir of the estates of Łukomia with their
    appurtenances, Plaintiff, through Melchior Krzyzanowski, and the Right Honourable Antoni Prusimski,
    Starost of Niszczewice, cited, in person — the Court, deciding the term of the Plaintiff party brought
    before it, the controversies having been heard:


    Although the Right Honourable Chełmski [uncertain: by this term] claims from the Right Honourable
    Prusimski the production of a certain act, as though a Boundary act, issued between the estates of
    Łukom and Trąbczyn by Commissioners designated by the Estates of the Realm and brought in by the Right
    Honourable Starost; and, laying before the court three searches for that same Boundary act — the first
    made before the records of the Kalisz Municipal Court on the Saturday after the Feast of the Presentation
    of the Most Glorious Virgin Mary in the year 1776, through the Right Honourable Antoni Mierzejewski
    in the name of the Right Honourable Chełmski; the second before the records of the Kościan Municipal
    Court on the 2nd day of the month of January, through the Honourable Antoni Smoliński likewise in
    the name of the Right Honourable Chełmski; the third before the records of the Konin Municipal Court
    on the 28th day of the month of October in the present year, by the Right Honourable Chełmski alone
    — proves that the said field act, whose production is claimed, was not in the records of its proper
    palatinate;


    the Right Honourable Prusimski, Starost of Niszczewice, for his part, freeing himself from the production
    claimed, [lays down] a search, made through the Honourable Ludwik [uncertain: Łański] in the name
    of the party concerned, for the Commissorial Boundary Decree issued between the hereditary estates
    of the villages of Trąbczyn Minus, or Nowa Wieś, and Łukom


    [uncertain: under no. 15, on the other page]'

- page: 2
  confidence: high
  marker_count: 1
  en: 'and Drzewce — a search made before the records of the Municipal Court of Brest in Kuyavia on the
    10th day of the present month of October in the present year, and entered as an oblata in the records
    of the Konin Municipal Court on the 16th day of the same month in the present year likewise, [uncertain:
    its date wrongly given out] — and shows that this Commissorial Decree was entered as an oblata under
    the act of Tuesday after the Feast of Saint Matthew, Apostle and Evangelist, in the past year 1776,
    before the records of the Municipal Court of Brest in Kuyavia.


    Since, however, rights, all settlements, and decrees ought to be submitted by oblata in their own
    palatinate — the Court therefore decrees that the Right Honourable Prusimski, Starost of Niszczewice,
    shall submit the Decree specified above by way of oblata to the records of the Konin Municipal Court
    within the space of four weeks from the present act, under penalty of outlawry in case of contravention,
    to be published before those same records.'

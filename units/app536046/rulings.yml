# Editorial rulings for 53/6/0/-/46 (APP).
#
# One document: entry no. 16 of the sitting, which begins on leaf 182 verso
# and ends at the foot of leaf 182 recto (the clerk's own direction: "sub
# nro 15"). The entry after it, no. 17 on leaf 183, is in the editor's Latin
# file without an English and is not built (docs/PRUSIMSKI_QUESTIONS.md).
# Established 2026-10-07.

places:
  # "in Conin celebratis", the heading of the sitting.
  overrides:
    "1": Konin

dates:
  # [year, month, day, precision]; read off the document.
  read: {}
  supplied: {}
  twin: {}
  inferred: {}

  # The date of the sitting the entry stands under:
  # [year, month, day, precision, basis]; the basis is shown to the reader.
  # The heading, which the editor transcribed, is on a page not among the
  # scans: "Feria Secunda post Festum Sanctae Hedvigis ... videlicet Die 20
  # mensis Octobris Anno 1777 in Conin celebratis". The decree names a search
  # made at Konin on a later day of October "of the present year", so it was
  # given some days into the sitting; only the year is claimed.
  sitting:
    "1": [1777, null, null, "year", "The sitting opened at Konin on 20 October 1777. Its heading is on a page not among the scans; the entry itself has no date, and it mentions a search made later in that October."]
  no_date: []

documents:
  doc_type:
    "1": decree

  language:
    "1": la

  duplicate_of: {}
  split_note: {}
  relations: {}

  # The estate the document is ABOUT, as slugs from reference/places.yml.
  estates:
    "1": [trabczyn, lukomia]

pages:
  # The editor's transcription is by paragraph, not by line.
  by_paragraph: ["0182_b1", "0182_b2"]

damage:
  letters: []

# The reading is from a microfilm of a small, heavily abbreviated hand and
# still has words in doubt: the reader is told so on the document's page.
rough:
  letters: ["1"]

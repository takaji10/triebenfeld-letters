description: >-
  A school exercise book of Albert Breyer (1889-1939), teacher at the German
  school in Sompolno and historian of the German settlements in central
  Poland, with a loose sheet laid in it. In the notebook Breyer copied, in
  Russian, the liquidation tables of 1868 by which the peasants of the
  German colonies of Emilienheim (later Michalinów), Łazińsk (on the former
  Trąbczyn estate) and Orliny (of Count Albert Taczanowski) received their
  holdings after the emancipation of 1864, with the extent of each holding in
  Morgen and rods, the sum due to the former owner, and their servitudes of
  pasture and wood in the landowner's forest. He added in pencil who held the
  Łazińsk holdings in 1875 and the number of farmers and Morgen from 1840 to
  1935, and wrote notes of his visits in July 1935 and July 1936 to Orlin,
  Józefów, Obory and Huta Trąbczyńska: speech, customs, houses, morals,
  church life, emigration. The loose sheet is a Polish list of the hearth
  tax and barracks money due from the 29 householders of Emilienheim,
  dated at Kopojno on 3/15 December 1858.

translation_note: >-
  Several languages: Russian in the old orthography (ѣ, і, ъ) in the copied
  tables and servitude terms; German in Breyer's notes, much abbreviated,
  some in Kurrent; Polish on the loose sheet of 1858. Tables: "мор." Morgen,
  "пр." or "прут." rods (Prussian Ruten); a figure "17-71" is 17 Morgen 71
  rods. "Неудобн." unusable land; "Вообще" in all; "Насл." heirs of. On the
  sheet of 1858 "1-50" is 1 złoty 50 groszy. "Holl." Holland or Hauland, a
  Hollander (Olęder) settlement; "Wirte" farmers; "Servitut" a right of
  pasture or wood. A word followed by [?] or written [word?] is read with
  doubt; [?] alone is a word not read.

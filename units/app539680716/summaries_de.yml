# German summaries of APP 53/968/0/-/716, written in the working session from the reading (intake/holding.py, 2026-10-14).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app539680716-001: "Polnische Liste der Rauchfangsteuer samt dem Kasernengeld, die die Kolonie Emilienheim in zwei gleichen Raten im März und im September zu zahlen hatte, ausgestellt in Kopojno am 3./15. Dezember 1858 vom Vogt (wójt) der Gemeinde Kopojno; ein loses Blatt, das in Albert Breyers Heft liegt. Sie nennt 29 Wirte mit Namen, von Krystyan Szejnwald bis Gottlieb Dykhof, darunter zwei Witwen. 27 von ihnen stehen mit 1 in der zweiten Spalte und 1 Złoty 50 Groschen in der letzten; Gottlieb Liepelt und die Witwe Szurak stehen stattdessen mit 1–3 in der ersten Spalte. Die Summe nach dem letzten Eintrag ist 2–6, 27 und 40 Złoty 50 Groschen."
app539680716-002: "Albert Breyers russische Abschrift der Liquidationstabelle des Dorfes Emilienheim, „jetzt Michalenow“, im Gouvernement Kalisz, Kreis Słupca, Bezirk Pyzdry, vom 28. März 1868. Sie verzeichnet 35 Stellen, von 1 bis 36 gezählt (Nr. 19 fehlt), jede mit ihrem Unland in Morgen und ihrer ganzen Fläche in Morgen und Ruten; einige Namen schrieb Breyer in lateinischer Schrift. Die größte Stelle, Nr. 14, hat 30 Morgen 182 Ruten. Dazu kommen der Anteil des Schulzen, das Schulgehöft mit 7 Morgen 116 Ruten, der Friedhof und die Wege. Zusammen sind es 319 Morgen 250 Ruten; dem Gutsbesitzer stehen 4420 Rubel 53 Kopeken zu."
app539680716-003: "Albert Breyers Notizen zu Emilienheim, deutsch und russisch: bereits am 26. November 1870, nach der Vermessung durch den Geometer in Kalisz, 331 Morgen 179 Ruten nutzbares und 5 Morgen 179 Ruten unbrauchbares Land. Dazu ein Vermerk über die Behörde des Gouvernements Kalisz vom 29. September 1892, Emilienheim und seinen örtlichen Namen Michalinów, und eine Eintragung vom April 1892."
app539680716-004: "Albert Breyers russische Abschrift der Liquidationstabelle der Kolonie Łazińsk im Gouvernement Kalisz, Kreis Słupca, Bezirk Pyzdry, datiert Słupca, 29. Juni 1868. Sie verzeichnet 91 Stellen, von 1 bis 90 gezählt (die Nummer 86 steht zweimal), mit ihrer Fläche in Morgen und Ruten, die größte mit 54 Morgen 292 Ruten; die Namen der Inhaber sind deutsche und polnische. Mit Bleistift, unter der Überschrift „Bleistift Jahr 1875“, schrieb Breyer neben viele Stellen, wer sie 1875 innehatte. Dazu kommen das Gehöft der Dorfschule mit 20 Morgen 218 Ruten, der Friedhof, das Gemeindeland, der Anteil des Schulzen, die Wege und 9 Morgen 224 Ruten Unland. Zusammen sind es 1691 Morgen 219 Ruten; die Liquidationssumme für den früheren Besitzer beträgt 10.055 Rubel 70 Kopeken."
app539680716-005: "Albert Breyers russische Abschrift der Servitute der Bauern von Łazińsk, im Heft unmittelbar nach seiner Abschrift der Liquidationstabelle von Łazińsk von 1868. Alle Bauern des Dorfes der Łazińsker Holländer haben das Recht, ihr ganzes Vieh im Wald „Studzianki“ zu weiden und dort zweimal in der Woche Leseholz, liegendes Holz und trockene Äste, zu sammeln und fortzutragen; andere Rechte auf Servitute haben sie nicht. Die Abschrift trägt kein Datum."
app539680716-006: "Albert Breyers Zahlen der Wirte und des Landes, deutsch, im Heft unter seiner Abschrift der Servitute von Łazińsk; ein Dorf nennen sie nicht. Nach der russischen Eintragung nach 1875 1655 Morgen 63 Ruten und 94 Wirte; 1901 1660 Morgen 271 Ruten und 91 Wirte; 1906 2044 Morgen 181 Ruten, 91 alte und 21 neue Wirte mit 112 Morgen; 1907 91 alte und 21 neue Wirte; 1914 137 Wirte mit 2037 Morgen."
app539680716-007: "Albert Breyers Tabelle der Wirte und Morgen in neun Jahren von 1840 bis 1935: 1840 87 Wirte und 1368 Morgen, 1868 91 Wirte und 1691 Morgen, 1890 94 Wirte und 1655 Morgen, 1906 112 Wirte und 2044 Morgen, 1914 137 Wirte und 2037 Morgen, 1935 146 Wirte und 1996 Morgen. Die Tabelle nennt kein Dorf; ihre 1691 Morgen von 1868 sind die der Liquidationstabelle von Łazińsk."
app539680716-008: "Albert Breyers Notizen vom Juli 1935, deutsch und zum Teil russisch. Huta Trąbczyńska hat 1935 18 Wirte und 217 Morgen, Orlin im Juli 1935 85 Wirte. Für Orliny notiert er 152 Kühe und 343 Schafe, 1879 für das ganze Dorf 52 Fuhren Brennmaterial, 1880 300 Morgen 97 Ruten, und Namen aus einem Forstwirtschaftsplan, darunter Biskupice, Szetlew und Grzebień. In Józefów waren Becker und Wegert unter den ersten Wirten. Dazu Notizen zu den alten Häusern, mit dem Giebel zur Straße, zu den Gesangbüchern, darunter dem Züllichauer, und zur Tracht: die Frauen tragen Schürzen rund um den Körper, die Hauben sind vor 30 Jahren verschwunden. Die Alten sprachen etwas Plattdeutsch; die Orliner schimpfen die Leute von Białobłoty „die dummen Kaschuben“; ein evangelischer Gutsbesitzer Riedel in Wielki Bór schenkte Herrn Schmidt ein Gesangbuch. Über die deutschen Siedler, mit Grodziec, Łazińsk, Białobłoty und Obory: Diebstahl von Holz und Kartoffeln, meist aus Armut, in Łazińsk weniger; wilde Ehen und uneheliche Kinder; viele heiraten nach Białobłoty; mit den Polen kommen sie gut aus, die Polen sprechen gut Deutsch, Neigung zur Assimilation gibt es keine; der Volksverband wirkt durch den „Volksfreund“ und den Kalender. In Orlin gibt es zwei Prediger und seit zwei Jahren Pfingstler und Baptisten. Dazu Bräuche und der Zug der Jugend, meist Mädchen, ins Posensche. Die Notizen brechen mitten im Satz ab."
app539680716-009: "Albert Breyers Liste der Wirte des Orliner Haulands Biskupice mit ihrem Land in Morgen; die Überschrift ist nur zum Teil gelesen. Sie zählt 36 Einträge, von 1 bis 37 gezählt (die Nummer 27 fehlt), von Bloch bis Hoffmann, darunter 15 Morgen, die zur Schule gehören, und 34 Morgen gemeinschaftliches Land, und darunter ohne Nummer zehn weitere Wirte von Ziebart bis Kress. Der größte Besitz ist der Kolańskis mit 43 Morgen. Die Summe lautet 27 Hufen 28 Morgen."
app539680716-010: "Albert Breyers Notizen über Orlin vom Juli 1936: „Orlin Hauland 1 Okt. 1806“. In Orlin wurde Kaschubisch gesprochen; dazu eine Angabe Webers über den Vater Blochs, Czarny Bród und das Kaschubische. Die nassen Jahre in Orlin und ein Bankrott; das Wort „Kjaufft“. Auf der folgenden Seite die Fläche des Dorfes Orlino (wieś Orlino) nach Klassen: Klasse I 17, II 370, IV 464,69 Morgen und 300 Morgen Unland (nieużytki); Breyers Summe ist 1157,69 Morgen, die Zahlen ergeben 1151,69."
app539680716-011: "Albert Breyers russische Abschrift der Liquidationstabelle des Dorfes Orliny des Gutsbesitzers Graf Albert Taczanowski, ohne Datum. Sie verzeichnet 57 Stellen mit ihrer Fläche in Morgen, bei einigen auch in Ruten, bei einigen ohne Zahl, die größte mit 48 Morgen; dazu das Gehöft des Schulzen mit 4 Morgen. Zusammen sind es 850 Morgen 272 Ruten; zu zahlen sind 6049 Rubel 89 Kopeken."
app539680716-012: "Albert Breyers Notizen zur Separation in Groß-Orlin und Czarny Bród vor 60 Jahren, nach der Nummer, dann nach Morgen, und in Białobłoty und Klein-Orlin vor zwei Jahren, nach der Nummer; dazu, dass die Servitut in Orlin 300 Morgen umfasst."
app539680716-013: "Albert Breyers russische Abschrift der Servitute von Orliny, ohne Datum: Alle Höfe von Orliny haben Wald- und Weideservitute in einer Hälfte des an das Dorf grenzenden Waldes „Welski Bor“. Sie dürfen jeden Sonnabend Leseholz sammeln, trockene Äste brechen und Stubben roden und je Hof höchstens eine Fuhre in der Woche abfahren; sie erhalten jährlich je Hof einen Baum zur Ausbesserung der Gebäude, 8 Zoll stark in 2 Ellen Höhe, mit Wipfel und Ästen; und sie dürfen ihr Vieh weiden und im April, Mai, September, Oktober und November Streu rechen. Die Zahl der Fuhren und des Viehs je Hof lege die folgende Liste fest; die Abschrift endet dort mit dem Zeichen ××, das auch neben Breyers Zahlen zum Vieh von Orliny steht."

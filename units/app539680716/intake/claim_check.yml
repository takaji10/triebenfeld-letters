#   elsewhere: that they gave the peasants their land after the emancipation
#   of 1864, and that Łazińsk lay on the former Trąbczyn estate. The tables
#   say neither (the commune in the heading of 4 is read with doubt). Cut;
#   the holding's description gives the context.
# - It counted rows wrongly where numbers are skipped or doubled (4: 91
#   holdings, 86 twice; 8: 36 entries, 27 missing) and gave a smallest
#   holding that was not the smallest (4: no. 89 has 193 rods).
# - It read meaning into unlabelled columns (1: "hearths").
# - It named people from the Russian tables in German forms the English
#   does not use (Gottfried Schultz, Merz): the English transliterates
#   (Shults Gotfr., Merzh). Cut; numbers given instead.
# - It added the sum of 9 without saying that Breyer's total (1157.69) is
#   6 Morgen more than the figures (1151.69). Checked on the photo
#   (5176_a2): the figures are read rightly; the summary now says so.
# Nothing in the summaries rests on a word marked as doubtful.
#
# Documents 5 and 11 were each divided in two on 2026-10-14 (a copy takes
# the era of what it copies): their statements stand under the part they
# belong to, and one statement on where each copy stands was added to 5, 6
# and 13. Document numbers from 6 on are the new ones.


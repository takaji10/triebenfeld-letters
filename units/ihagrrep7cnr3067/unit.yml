# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts.
description: >-
  Three papers of 16 February 1797 from the Prussian cabinet's files on South
  Prussia, Prussia's share of the second partition of Poland, where the rising
  of 1794 had been put down. Document 1 is the promemoria of the Grand
  Chancellor Heinrich Julius von Goldbeck, head of the Prussian justice: by
  the laws many of the rebels would have deserved death and the rest
  confiscation and the fortress for life, but letters of pardon, the amnesty
  patents of 24 September and 10 December 1794 and the King's instruction of
  3 April 1795 had softened this, leaving most to pay fines set by a finance
  commission at Poznań; the ringleaders (Niemojewski, Wybicki, Xaver
  Dombrowski and others) had fled, and only their property could be
  confiscated. Of 387 insurgents 307 paid fines, 49 were sentenced to short
  terms in the fortress, 26 to long ones, 2 for life and 3 to death. Should
  the King wish to extend his mercy, Goldbeck proposes that the confiscation
  of the fugitives stand, since most of the confiscated estates have already
  been disposed of, and the fines still be collected, but that the short
  sentences be remitted, the long ones halved (not for three men who were
  also highway robbers), and Stockowski's life sentence cut to ten years with
  a pension for his daughter. Document 2 is the King's decision written in
  his own hand beneath it: he finds none of the condemned worthy of a
  reduction, and those sentenced to fines are to be made to pay them or,
  unable to pay, to be put under arrest. Document 3 is the list the
  promemoria encloses: the 31 rebels sentenced to death, to the fortress for
  life or for long terms, each with his offence, the length of the sentence
  and the month it began, February 1795 to November 1796.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Papers of the Prussian cabinet. A promemoria is a memorandum addressed to
  the King in the third person ("Sr Königliche Majestät", "Höchstdero");
  "Immediat-Instruction" is an instruction issued by the King directly;
  "Pardonbriefe" and "Amnestie Patente" are letters of pardon and amnesty
  decrees; "Festungs-Strafe" is imprisonment in a fortress; "Edictal-
  Citationen" are public summonses; "Confirmations Rescripte" are the rescripts
  by which the King confirmed a sentence; a "Publicandum" is a public
  notice; "sub num:" points to an entry of the list (document 3);
  "ad 3 et 4" to points 3 and 4 of the proposals. "Der GroßCanzler" is the
  Grand Chancellor, Goldbeck himself. Document 2 is in the King's own hand
  and spelling (vilmehr, seindt, prestiren = to pay, arest); a word followed
  by [?] is one the reading leaves doubtful, and the English keeps the doubt.
  The list is a table transcribed cell by cell (number, name, offence,
  length of sentence, month it began); "desgleichen" and "Aus gleicher
  Ursach" (for the same reason) refer to the entry above. "Wraclawec" and
  "Wraclawek" are Włocławek, "Wielun" Wieluń, "Lenczyc" Łęczyca, "Kalisch"
  Kalisz; "Ostrzewo" is kept as written. "Komornick" and "Probst" are titles
  (a court officer, a provost priest), not first names. Names stay as the
  clerk wrote them.


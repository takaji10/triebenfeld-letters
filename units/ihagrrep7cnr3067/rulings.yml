# Editorial rulings for I. HA GR, Rep. 7 C, Nr. 3067 (GStA PK).
#
# One document (the editor, 2026-11-19: "Do not split this into three
# documents - it is a single document"): the Grand Chancellor Goldbeck's
# promemoria of 16 February 1797 (pages 1 to 3), the King's decision in his
# own hand written beneath it on page 3, and the list of the condemned that
# the promemoria encloses ("nach der beyliegenden Liste"), pages 4 to 6 (page 4 its title, as text; 5 and 6 the table). First
# built as three documents the same day.

places:
  overrides:
    "1": Berlin     # "Berlin den 16ten Februar 1797."

dates:
  # [year, month, day, precision]; read off each document.
  read:
    "1": [1797, 2, 16, "day"]      # "Berlin den 16ten Februar 1797."; the King's "d 16 Februariy 1797"
  # [year, month, day, precision, basis]
  inferred: {}
  supplied: {}
  twin: {}
  no_date: []

documents:
  doc_type:
    "1": memorandum

  # The list (pages 5 and 6; its title page 4 is text, line by line) is a table, from the editor's spreadsheet
  # (intake/table_from_xlsx.py, intake/table.csv, build_pages.py TABLE); the
  # promemoria and the King's decision (pages 1 to 3) are text. Its offence,
  # length and month columns are words, not figures.
  tables: ["1"]
  table_pages:
    "1": [5, 6]
  table_text_columns:
    "1": [3, 4, 5]

  duplicate_of: {}
  split_note: {}

  relations: {}

damage:
  letters: []

rough:
  letters: []

# For the reader: shown on this unit's provenance page.
description: >-
  The Prussian foreign ministry's file on the Prince of Hohenlohe-Ingelfingen's
  claim to be compensated for the Trąbczyn estates, which a Polish commission
  took from him in 1807 and gave back to the heiress of their former owner. It
  opens at the Congress of Vienna, where Triebenfeld and then the Prince
  himself petition the State Chancellor Hardenberg and Baron vom Stein, and the
  chancery drafts its replies on the petitions themselves. Zerboni di Sposetti
  reports from Poznań in November 1815 that the claim is worth little; in 1816
  the ministry has its envoy in St Petersburg, General von Schöler, raise it
  with the Russian court as a matter of grace, a creditor of the Prince asks to
  be remembered if anything is paid, and the Russian ministry refuses. In 1820,
  after the Prince's death, his heirs try again through Duke Eugen of
  Württemberg and are refused again, together with Count Bethusy, whose request
  for free passage between his Silesian and Polish estates gives the file its
  last pages. Thirty documents: the incoming letters are originals, the
  ministry's own letters are its drafts.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A ministry file. Incoming letters are originals; the ministry's replies are
  hurried drafts in a chancery hand, heavily abbreviated and poorly read by the
  transcriber, so a garbled passage in a draft is a reading failure, not the
  writer's German. Drafts carry registry marks that are not prose: journal
  numbers (No. 3205), "mund." (fair copy made), "abg." (sent), "zur Post",
  "pr." (received), "cessat" (cancelled), "N. S. D." (Namens Seiner
  Durchlaucht, in His Serene Highness's name), "ad acta", and initials with a
  day and month, which are officials' paraphs. Several documents are in French:
  the Prince's letter of 12 April 1815, the chancery's replies of May 1815, the
  Russian envoy's note of 31 January 1820 and the copy of Prince Zajączek's
  report. The French pages are transcribed by paragraph, not line by line. Text
  that the receiving office wrote on an incoming letter stands at the end of
  that page and is not part of the letter.

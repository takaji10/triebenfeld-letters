# German summaries of APŁ 39/98/0/-/6603, written in the working session from the reading (intake/holding.py, 2026-10-15).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
apl399806603-001: "Russische Liquidationstabelle der Kolonie Łazińsk („Колонія Лазинская“) im Gouvernement Kalisch, Kreis Słupca, Bezirk Pyzdry, Gemeinde Trąbczyn, aus dem Amtsbereich der Kalischer Kommission für Bauernangelegenheiten: das Verzeichnis der Höfe, die nach den Ukasen vom 19. Februar (2. März) 1864 in das volle Eigentum der Bauern übergingen. Die erste Abteilung zählt 91 Höfe, jeden mit seiner Fläche in Morgen und Ruten; die zweite das Gehöft der Dorfschule, den Gemeindefriedhof, ein Stück Gemeindeland, den Anteil des Schulzen, einen Hof von einem Morgen und das Land unter den Wegen. Zusammen sind es 1691 Morgen 219 Ruten, davon 9 Morgen 224 Ruten Unland; die Abgaben, die die Regierung entschädigt, betragen 603 Rubel 34⅕ Kopeken. Am 8. Februar 1868 bestätigte die Zentrale Kommission für Bauernangelegenheiten beim Konstituierenden Komitee die durchgesehene und berichtigte Tabelle und setzte für den früheren Besitzer des Dorfes ein Liquidationskapital von 10.055 Rubel 70 Kopeken fest."
apl399806603-002: "Abschrift derselben Liquidationstabelle der Kolonie Łazińsk, nach Artikel 56 des Ukases vom 19. Februar (2. März) 1864 bei der Kalischer Kommission für Bauernangelegenheiten zur Aufbewahrung in der Gouvernementsregierung angefertigt, Kalisch, 10. September 1869, mit zwei Unterschriften. Sie hat dieselben Einträge, Flächen und Summen in einer anderen Hand und Schreibung; bei Nr. 65 steht 36 Morgen 234 Ruten, in der Tabelle 254, bei Nr. 48 nur „Мурицъ“. Neben den ersten Einträgen stehen die Servitute: Alle Bauern der Łazińsker Holländer dürfen ihr ganzes vorhandenes Vieh im Wald „Studzianka“ weiden und dort zweimal in der Woche Leseholz aus liegendem Holz und trockenen Ästen sammeln und in Tüchern forttragen; andere Rechte auf Servitute haben sie nicht. Auch die Bestätigung vom 8. Februar 1868 mit dem Liquidationskapital von 10.055 Rubel 70 Kopeken ist abgeschrieben."
apl399806603-003: "Eintragung in die Abschrift der Liquidationstabelle, Kalisch, März 1884, unterschrieben vom Vizegouverneur, einem Rat und für den älteren Kanzleibeamten, mit dem Stempel der Kalischer Gouvernementsregierung. Nach den Artikeln 1302 und 2800 der Beschlüsse des Konstituierenden Komitees und dem Beschluss der Kalischer Gouvernementsbehörde für Bauernangelegenheiten vom 25. Februar 1882 bescheinigt sie, dass die Bauern der Kolonie Łazińsk mit dem Recht auf die Brennholzservitut aus dem herrschaftlichen Wald „Studzianka“ jährlich je Hof 104 Tuchladungen erhalten dürfen, gleich 10½ gewöhnlichen zweispännigen Bauernfuhren, und dass dieselben Höfe im selben Waldstück 408 Stück Hornvieh weiden dürfen."
apl399806603-004: "Beglaubigte Abschrift, Kalisch, 10. Juni 1900, der Eintragung in die Liquidationstabelle nach dem Beschluss der Kalischer Gouvernementsbehörde für Bauernangelegenheiten vom 12. Oktober 1894. Durch einen freiwilligen Vertrag vom 14. Juni 1892, geschlossen nach einem Beschluss der Dorfversammlung vom selben Tag (Nr. 4) und von der Gouvernementsbehörde am 29. April 1894 bestätigt, verzichteten die Bauern der Kolonie Łazińsk für die Höfe Nr. 1 bis 91 und 96 ein für allemal zugunsten der Besitzerin des Gutes Trąbczyn, Gräfin Maria Wielopolska, auf die Weideservitut im Wald „Studzianka“ und auf das Sammeln von liegendem Holz und trockenen Ästen dort. Dafür erhielten sie herrschaftliches nutzbares Land zu vollem Eigentum: 84 Höfe je 4 Morgen, sieben Höfe je 6 Morgen, Nr. 47 5 Morgen, zusammen 383 Morgen, dazu 10 Morgen 154 Ruten Unland unter Wegen und Grenzen, insgesamt 393 Morgen 154 Ruten, in den Grenzen, die das Protokoll des Kommissars des Kreises Słupca vom 27. und 28. Juni 1893 beschreibt. Beglaubigt vom ständigen Mitglied der Behörde und dem Sekretär."
apl399806603-005: "Beglaubigte Abschrift, Kalisch, 14. Juli 1901, der Eintragung in die Liquidationstabelle nach dem Beschluss der Kalischer Gouvernementsbehörde für Bauernangelegenheiten vom 29. November 1897. Nach einer Vermessung durch einen Landmesser im Jahr 1896 beträgt der ganze bäuerliche Anteil der Kolonie Łazińsk, mit dem Land, das die Bauern nach dem Vertrag vom 14. Juni 1892 für die Wald- und Weideservitute erhielten, 1068 Desjatinen 1272 Saschen, davon 1034 Desjatinen 2102 Saschen nutzbar und 33 Desjatinen 1570 Saschen Unland. Die Flächen jeder Art in jedem Hof stehen in den Spalten der Tabelle, nachdem die früheren Zahlen, die sich als unrichtig erwiesen, ausgeschieden sind. Beglaubigt vom ständigen Mitglied der Behörde und dem Sekretär."
apl399806603-006: "Verzeichnis des bäuerlichen Anteils, der in der Liquidationstabelle der Kolonie „Łazińskie Olędry“ im Kreis Słupca eingetragen ist, nach der Vermessung: für die Einträge 1 bis 96 der Tabelle, unter ihren Nummern, die Fläche unter Gebäuden und Gärten, Acker, Wiese, Weide, Unland und zusammen, in Desjatinen und Saschen. Es sind 91 Höfe, einige mit einem anderen Namen als 1868 (so Nr. 77), die Schule, der Friedhof, das Gemeindeland, der Anteil des Schulzen und ein weiterer Hof; dazu 12 Desjatinen 741 Saschen Unland. Die Summe ist 1068 Desjatinen 1272 Saschen, die Zahl der Eintragung von 1897. In vier Zeilen ergeben die Teile nicht die Summe der Zeile. Beglaubigt vom ständigen Mitglied der Behörde und dem Sekretär; ohne Datum."

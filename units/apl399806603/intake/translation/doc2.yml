    ,Kinds and extent of the servitudes the peasants enjoy. Remarks.,,,,,,,,,,,,,,,

    ,Servitudes.,,,,,,,,,,,,,,,

    ,All the peasants of the village of the Łazińsk Hollanders have the right:,,,,,,,,,,,,,,,

    ,"1) to graze all the cattle they have in the forest ""Studzianka"";",,,,,,,,,,,,,,,

    ,2) to gather in the same forest twice a week fallen wood consisting of lying wood and dry branches.,,,,,,,,,,,,,,,

    ,What is gathered they carry away in sheet-loads. The peasants have no other rights to servitudes
    whatever.,,,,,,,,,,,,,,,'

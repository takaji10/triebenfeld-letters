description: >-
  The file of the liquidation table of the village "Колонія Лазинская" (the
  Łazińsk colony, the Łazińskie Olędry) in the commune of Trąbczyn, from the
  records of the Kalisz Governorate Board for Peasant Affairs. The table,
  approved by the Central Commission for Peasant Affairs in Warsaw on 8
  February 1868, lists the 91 farmsteads that passed into the ownership of
  the peasants under the Ukases of 1864, with the school, the cemetery, the
  common land and the roads, 1,691 Morgen 219 rods in all, and fixes the
  liquidation capital for the former owner at 10,055 roubles 70 kopecks. Its
  copy of 1869 for the Governorate Government states the servitudes: pasture
  and wood-gathering in the manor forest "Studzianka". Later inscriptions in
  the copy, and certified copies of others, record the fuel and pasture
  rights fixed in 1882 to 1884, the voluntary transaction of 1892 by which the
  colonists gave up their servitudes to Countess Maria Wielopolska, owner of
  Trąbczyn, for 393 Morgen 154 rods of manor land, and the survey of 1896,
  whose statement gives each farmstead's land in desiatins and sazhens.

translation_note: >-
  Russian, in the spelling of before 1918 (ѣ, і, ъ). Land in the table in
  Morgen (м.) and rods (п., the Polish pręt, 300 to the Morgen); in the
  statement of 1896 in desiatins and sazhens (2,400 square sazhens to the
  desiatina). Names are transliterated letter by letter in the English. A
  word followed by [?] or written [word?] is read with doubt; [?] alone is a
  word not read.


# German summaries of APŁ 39/98/0/-/1333, written in the working session from the settled text (intake/holding.py, 2026-11-13).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
apl399801333-001: "Russisches Verzeichnis („Опись“) der Schriftstücke in der Akte Nr. 167, nach dem Titel der Archiveinheit über die Aufstellung der Liquidationstabellen des Gutes Trąbczyn: 145 Einträge, jeder mit dem Schriftstück, die meisten mit Absender, Datum und Nummer, der Zahl seiner Blätter und dem Blatt, auf dem es in der Akte beginnt, die Schriftstücke von 1864 bis 1870. Eingetragen sind Bittschriften des Bevollmächtigten Grodziecki, der Bauern von Trąbczyn, Nowa Wieś und Marianton, einzelner Bauern, des Grafen Włodzimierz Miączyński und der Kolonisten von Łazińsk; Abschriften und Übersetzungen der Beschlüsse des Kommissars des 5. Bezirks, meist vom 13./25. Mai 1865; Entwürfe der Sitzungsprotokolle; Entwürfe der Schreiben an die Militärkreischefs von Konin und Kalisch, an den Kommissar des 5. Bezirks, an die Zentrale Kommission und an die Kalischer Gouvernementsregierung; Weisungen der Zentralen Kommission von 1867 bis 1869; Berichte des Kommissars Vladimirov, des Kommissars des 10. Bezirks und der Kommission des Kreises Słupca. Nr. 30 ist der Plan des Dorfes Trąbczyn, Nr. 81 die vom Grafen Miączyński vorgelegte Liquidationstabelle (15./27. November 1865). Die letzten Einträge, ab Nr. 115 (1869 und 1870) von einer zweiten Hand, sind überwiegend Reihen von Entwürfen und Antworten im Verkehr mit den Kommissionen der Kreise Słupca und Turek und der Zentralen Kommission. Unterschrieben vom Sekretär."
apl399801333-002: "Lageplan des Dorfes Trąbczyn im Kreis Konin, Gouvernement Warschau, angefertigt am 15. Mai 1865 (Nr. 30 des Verzeichnisses, Blatt 41), mit den Gärten und Gebäuden der Bauern und des Gutshofs. Als Bild gezeigt, nicht transkribiert."
apl399801333-003: "Bittschrift des Gutsbesitzers W. Miączyński an die Kalischer Kommission für Bauernangelegenheiten, Kalisch, 10./22. August 1865 (Nr. 1441), gegen die Entscheidung des Kommissars des 5. Bezirks vom 13./25. Mai 1865, Nr. 83, die sechs Höfe in Nowa Wieś – in der Abgabentabelle von 1846 Nr. 2, 4, 5, 6, 9 und 10, je 5 Morgen – mit Saaten und Gebäuden den letzten Inhabern oder ihren Nachfolgern zurückzugeben bestimmte; er bittet, die Höfe beim Gutseigentum zu lassen. Er schreibt: 1846 lagen in Nowa Wieś acht Bauernhöfe, die bis 1856 bewirtschaftet wurden; wegen der zu tiefen, in nassen Jahren nicht bestellbaren Lage baten die Bauern selbst, umgesiedelt zu werden, und er wies anderswo Land an und baute Gebäude; noch vorher hätten sechs Wirte ihre Höfe freiwillig verlassen und seien in Dienst gegangen. Nach Art. 2 des Ukases von 1846 habe er neue Bauern suchen müssen; sie hätten Höfe aus dem Vorwerksland erhalten und seien dort schon mit Eigentum ausgestattet; das alte Land sei dem Vorwerk zugeschlagen, mit Fruchtwechsel, die Gebäude für das Hofgesinde. Der Tausch stehe in der Zusatztabelle von 1846, bestätigt vom Kreischef und der Kommission des Innern; nach Art. 6 und 8 des Ukases von 1864 hätten die Weggegangenen kein Recht. Er nennt die Zeugen Wawrzeniec Sowiński und Józef Czajka, sagt, die Bauern hätten insgesamt mehr Land, als ihnen nach der Abgabentabelle zusteht, und Nowa Wieś habe nie gemeinsame Weide mit dem Hof gehabt; vier Beweisstücke liegen bei. Am Rand ein nur zum Teil gelesener russischer Vermerk der Behörde und eine Quittung über die Beweisstücke."
apl399801333-004: "Bittschrift des W. Miączyński an die Kommission für Bauernangelegenheiten des Kreises Kalisch, Trąbczyn, 23. Juli 1865 (Nr. 1805): Er bittet, die beigelegte Entscheidung des Barons von Rosen aufzuheben, die Krystian Lippeldt aus einem Nachbardorf ein Weiderecht für 2 Pferde und 7 Stück Hornvieh auf dem Vorwerk Włodzimirów zuerkannt hat, an den „smugi“ genannten Stellen, drei Senken in einem Feld an der Grenze von Emilienhejm. Auf dem Vorwerk Włodzimirów habe er seine einzige Weide für das Jungvieh. Lippeldt habe dort nur mit seiner schriftlichen Erlaubnis geweidet, zuerst bis zum 1. November gegen Geld, dann gegen Arbeit; das Feld habe brach gelegen. Sein Vertrag von 1863 endete am 1. November, also vor dem Allerhöchsten Ukas, die neue schriftliche Vereinbarung wurde am 1. Mai 1864 geschlossen, nach dem Ukas; im selben Jahr habe Lippeldt auch den beigelegten Vertrag geschlossen, ihn aufgegeben und das Original in Gegenwart des früheren Verwalters Swiderski zurückgegeben. Eine zeitweilige Erlaubnis sei kein Rechtstitel, schon gar nicht für einen Fremden; der Ukas begünstige die Bauern des Dorfes, in dem sie aufgewachsen sind, und verlange nach seinen Artikeln, dass das Recht zur Zeit des Ukases ausgeübt wurde."
apl399801333-005: "Bittschrift der Kolonisten von Łazińsk, Gemeinde Trąbczyn, Kreis Słupca, Gouvernement Kalisch, an das Konstituierende Komitee im Königreich Polen, Łazińsk, 6./18. Dezember 1867 (Nr. 19838/4098), unterzeichnet mit den Kreuzen von Daniel Hohm und Wilhelm Moritz im Namen der anderen. Sie hätten dieses Jahr, wie die beigelegte Postquittung zeige, beim Komitee um die Anerkennung der Servitute gebeten, die ihnen das Gut früher gewährt hatte – freie Weide im Trąbczyner Wald, Streurechen, Stubbenroden –, aber noch keine Entscheidung erhalten; sie bitten, einen unparteiischen Beamten aus dem Kreisamt Słupca zur Prüfung ihrer Ansprüche zu entsenden und die Entscheidung dem Kreischef von Słupca zu übersenden."
apl399801333-006: "Bittschrift der Kolonisten der Kolonie Łazińsk, Gemeinde Trąbczyn, an das Konstituierende Komitee in Warschau, Kolonie Łazińsk, 10./22. August 1868 (Nr. 16658/2133), unterzeichnet von Ludwig Hintz und Krystyan Sehr im Namen aller. Nach dem Kaufvertrag über die Höfe mit Fürst Hohenlohe, dem früheren Besitzer von Trąbczyn, und seinem Privileg von 1805 dürften sie ihr Vieh gemeinsam mit dem herrschaftlichen im Studzienka-Revier bis zur bischöflichen Grenze weiden und jedes Jahr Streu rechen, und sie hatten 6 Morgen Lehmland für eine Lehmgrube; Kommissar Baron Rosen habe das anerkannt und den Besitzer verpflichtet, die Hypothekenkarte von 1805 bis zum 3./15. August vorzulegen. 1838 habe der Besitzer eine neue Tabelle aufgestellt, das Revier in drei geteilt, auf zweien das Weiden verboten und auf dem dritten 11 Schläge und Schonungen angelegt; er verbiete das Streurechen und nehme die Lehmgrube für sich. Beim Besuch des Kommissars Władimirow habe er falsche Zeugen gestellt und jedem 12 Rubel gegeben; Zeugen dafür seien Marcin Rywarski und der Tischler Libner aus Trąbczyn, und Tomasz Janicki, ein Zeuge des Besitzers, habe es selbst erklärt. 1867 hätten sie sich dreimal an den Präsidenten der Kalischer Kommission (6./18. Juni, 30. Juni/12. Juli, 3./15. September) und im Oktober an das Komitee gewandt, mit einer Abschrift des Privilegs; die Antwort vom 31. Januar 1868 verwies sie an die Kalischer Kommission; eine Entscheidung kam nicht, die Abschrift erhielten sie nicht zurück. Sie bitten um eine Untersuchung an Ort und Stelle durch einen Beamten aus Warschau, um die Rückgabe von Lehmgrube und Weide und die Bestätigung ihres alten Rechts; gelänge ihnen der Beweis nicht, trügen sie die Kosten."

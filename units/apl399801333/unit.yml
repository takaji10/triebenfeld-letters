# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as original_title.
title: >-
  The Kalisz peasant-affairs office's file on the liquidation tables of the
  Trąbczyn estate, 1864 to 1870: its index of 145 papers, the plan of the
  village of 1865, Count Włodzimierz Miączyński's two petitions of 1865
  against the commissioners' decisions for the peasants of Nowawies and for
  Krystian Lippeldt of a neighbouring village, and the Łazińsk colonists' petitions of
  1867 and 1868 for their old rights of pasture, litter and clay.
title_de: >-
  Die Akte der Kalischer Behörde für Bauernangelegenheiten über die
  Liquidationstabellen des Gutes Trąbczyn, 1864 bis 1870: ihr Verzeichnis
  von 145 Schriftstücken, der Plan des Dorfes von 1865, Graf Włodzimierz
  Miączyńskis zwei Bittschriften von 1865 gegen die Entscheidungen der
  Kommissare für die Bauern von Nowawies und für Krystian Lippeldt aus einem
  Nachbardorf und die Bittschriften der Kolonisten von Łazińsk von 1867 und
  1868 um ihre alten Weide-, Streu- und Lehmrechte.

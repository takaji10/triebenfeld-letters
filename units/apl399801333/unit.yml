# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead.
description: >-
  Part I of the file of the Kalisz office for peasant affairs on the drawing
  up of the liquidation tables of the Trąbczyn estate, owner Miączyński,
  Słupca district (State Archive in Łódź, fonds 39/98): the six papers the
  editor photographed. The file's index ("Опись бумагамъ, къ дѣлу № 167"), in
  Russian, lists 145 papers of 1864 to 1870 with their dates, numbers, leaves
  and folios, and is given as a table. The plan of the village of Trąbczyn of
  15 May 1865 (index no. 30) is shown as an image. Four petitions in Polish:
  Count Włodzimierz Miączyński's of 23 July 1865 against Baron von Rosen's
  decision granting Krystian Lippeldt of a neighbouring village a servitude
  of pasture at the "smugi" of the folwark Włodzimirów, and his of 10/22
  August 1865 against the decision of the Commissioner of the 5th District
  returning six farmsteads of Nowa Wieś to the peasants who left them; and
  the petitions of the colonists of Łazińsk of 6/18 December 1867 and 10/22
  August 1868 to the Constituent Committee for the pasture, litter and clay
  rights granted them under Prince Hohenlohe's privilege of 1805.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  The index is Russian in the old spelling; the clerk's abbreviations stand
  (Комм. for the commissioner, Черновой отпускъ for the draft of an outgoing
  letter, Проектъ журнала засѣданія for a draft of the minutes). The
  petitions are Polish of the 1860s with the writers' own spellings, accents
  and joined prepositions (zdnia, wkoniecznym, Leśie, śię), and the
  colonists' of 1868 is in a rough hand with many slips: give them as
  written. A double date (10/22) is Old Style/New Style. Latin tags (dominii
  directi, quaestionis) are the writer's. "smugi" is the local name of three
  hollows in a field and stays in Polish.

# What the "Method" tab says (reference/prepared.yml).
prepared:
  transcription:
  - en: >-
      The index was read from the scans by two AI readers working
      independently; where they differed, Claude decided on the image, and
      the entries that stayed doubtful are marked. The transcription of the
      petition of 23 July 1865 (in part) and of the colonists' two petitions
      is the editor's own; Claude corrected it only where the image plainly
      showed a different word. The rest of the petition of 1865, and the
      petition of 10/22 August 1865, were read from the scans in the same
      way as the index.
    de: >-
      Das Verzeichnis wurde von zwei unabhängig arbeitenden KI-Lesern von den
      Scans gelesen; wo sie voneinander abwichen, entschied Claude am Bild,
      und die zweifelhaft gebliebenen Einträge sind gekennzeichnet. Die
      Transkription der Bittschrift vom 23. Juli 1865 (zum Teil) und der
      beiden Bittschriften der Kolonisten stammt vom Herausgeber; Claude
      korrigierte sie nur, wo das Bild deutlich ein anderes Wort zeigte. Der
      Rest der Bittschrift von 1865 und die Bittschrift vom 10./22. August
      1865 wurden auf dieselbe Weise wie das Verzeichnis von den Scans

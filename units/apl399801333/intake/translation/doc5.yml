  en: 'No. 19838/4098


    Matter of Peasant Affairs


    To the Constituent Committee in the Kingdom of Poland


    Petition


    of the colonists of Łazińsk, in the commune of Trąbczyn, Słupca district, Kalisz governorate, for
    the recognition of the rights of the privileges granted by the former manorial lordship (Dominium).


    As the attached postal receipt shows, we submitted this year a petition to the Constituent Committee
    for the recognition of the servitudes granted and assured to us by the manorial lordship in former
    years, that is, free pasture in the Trąbczyn forest, the raking of litter, the digging of stumps,
    etc., and yet we have so far received no decision; we therefore most humbly ask that an impartial
    official be delegated from the office of the Słupca district to look more closely into our claims,
    and then to decide how far this right belongs to us, and to send this decision to the hands of the
    Honourable Chief of the Słupca District.


    With [deepest?] respect, in the name of the others —


    faithful subjects —


    [three crosses] Daniel Hohm


    [three crosses] Wilhelm Moritz


    at Łazińsk, 6/18 December 1867.'

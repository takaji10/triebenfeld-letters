- page: 4
  confidence: high
  marker_count: 0
  en: 'been enfranchised — by what means can the first six, or now their successors (to whom the Honourable
    Commissioner has granted ownership), have the right to demand the return of farmsteads which, as abandoned,
    were lawfully given away — and were exchanged by their own will; this exchange, moreover, entered
    in the supplementary table of 1846 and confirmed by the District Chief and the Commission of Internal
    Affairs — has binding force. In this way the owner of the estate, for having met the interest of the
    peasants and come truly to their help, would be forced to give away the same land twice, and what
    is more, would suffer considerable losses if the Honourable Commission decided to measure out farmsteads
    in place of the crop-rotation farming that has been introduced. — Article 6 of the Supreme Ukase of
    1864 states expressly: that only that land is subject to return which — without exchange for other
    land — passed into the disposal of the owners; here an exchange took place in accordance with the
    Ukase of 1846.


    Today, under article 8 of the Supreme Ukase of 1864, only those who took the place of the claimants
    could demand to return to the first holdings; but those who left their farms have no right in any
    case, if the deserted holdings they left have been lawfully taken up (which has happened), and on
    the ground of the Supreme Ukases, both of 1846 and of 1864, no right to ownership can be derived for
    such peasants.


    Hence it appears: that the owner of the estate not only committed no arbitrary act, but on the contrary
    acted lawfully and by the will of the peasants.


    Should the facts above be denied, the owner in that case appeals to the testimony of witnesses and
    names as such: 1. Wawrzeniec Sowiński — 2. Józef Czajka — and many others — whose examination he has
    the honour to request.


    Finally, attention must be drawn to this circumstance: that according to the survey register of the
    Trąbczyn estate the peasants in all hold more land than falls to them by the table of dues; so where
    the peasants'' rights are recognised and respected, excessive and unlawful demands ought to find no
    consideration — and therefore the owner of the estate trusts that the Honourable Commission, weighing
    what is just, will be pleased to grant this request —


    As to the pasture — the peasants of Nowawies never had pasture in common with the manor. —


    4 proofs are attached.


    Kalisz, 10/22 August 1865.


    With deep respect


    W. Miączyński'

  en: 'farmsteads mentioned be left in the ownership of the dominium directum [written "dominii directi"];
    in support of which the following grounds are put forward:


    The Honourable Commissioner of the 5th District based his ruling on a mistaken account [given?] by
    the peasants who claim the farmsteads in question, for in the grounds he stated:


    1. That the owner removed six peasants from Nowawies of his own will —


    2. That he did so in order to join these farmsteads to the folwark lands. —


    At the time the Supreme Ukase of 1846 was issued there were eight peasant farmsteads in Nowawies —
    each of 5 Morgen — one of 5 Morgen 25 rods and one of 5 Morgen 75 rods — which were held by farmers
    until 1856; this placing of the peasants was at that time very convenient for the owner — and he never
    thought of any change. It was the peasants of Nowawies themselves who, suffering constant misfortune
    in their farming because their land lay too low and could not be tilled in wet years, came'
  names: []
  numbers: []
  flagged: []
- page: 3
  confidence: high
  marker_count: 0
  en: with an urgent request to be moved to another place. The owner, therefore, wishing only to better
    the lot of his peasants, and taking into account how badly they had been settled until then, marked
    out land elsewhere and put up suitable buildings on it; but already before this happened, that is
    before 1856, six farmers who had suffered most in the wet years left their farmsteads of their own
    will, without asking for new ones — and going into service — leaving them deserted; it was then that
    the owner, in strict compliance with the Supreme Ukase of 1846 — and fulfilling the duty laid on the
    owner of an estate in article 2 of that law, was compelled to find other people who would take up
    the abandoned farmsteads within two years; but being unable to find any who would settle in Nowawies
    — in the old places of the misfortunes and failures of the former holders, he was forced to give them
    farmsteads in place of those, out of his own folwark land, and to turn the land they were to have
    taken up — over to the folwark, where crop rotation has now been introduced — and the buildings to
    the use of the manor servants. Since, then, the peasants who now claim their rights left their farmsteads
    in Nowawies of their own will (which needs no proof, for the owner could not have evicted them by
    force), since, further, in accordance with article 2 of the ukase of 1846 — the owner was under the
    necessary obligation to find new peasants who would take up the abandoned holdings, and these new
    ones, as wholly representing the former, agreed, indeed expressly demanded, to be moved to the new
    places, which was done, for to this day they hold them, — and in them they have already
  names: []

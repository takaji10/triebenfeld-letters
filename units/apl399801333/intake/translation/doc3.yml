  en: 'No. 1441


    10/22 August 1865.


    to


    the High Commission for

    Peasant Affairs

    at Kalisz.


    By the decision of 13/25 May 1865, no. 83, on the assessment and confirmation of the rights of the
    peasants of the Trąbczyn estate, issued by the Honourable Commissioner of the 5th District, six farmsteads
    in the village of Nowawies, entered in the table of dues of 1846 under nos. 2, 4, 5, 6, 9 and 10,
    of 5 Morgen each, were recognised as subject to return to the farmers who last held them, or to their
    successors, together with the crops and buildings that stood on the land when the said farmsteads
    were abandoned. —


    The above decision of the Honourable Commissioner, being too burdensome for the owner of the estate,
    compels him to come now before the Honourable Commission — with the request that it be set aside —
    and that the


    [Note of the office, in Russian:] On the [exchange?]: to recognise the lands which were formerly held
    by the peasants as deserted holdings — but since they cannot be returned, to instruct [the Comm…?]
    [to arrange] a voluntary agreement, and then to assign [them].


    [Note in Polish:] I have received the proofs [returned?].


    Kalisz, 11 [October?]


    [A. Kowal…?]'

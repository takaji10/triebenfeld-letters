  en: 'No. 16658/2133


    To the High Constituent Committee in the Kingdom of Poland at Warsaw


    Most Humble Petition


    of the colonists of the Łazińsk colony, in the commune of Trąbczyn, Słupca district, Kalisz governorate,
    for the recognition and confirmation of the rights named in the privilege


    According to the contract of purchase of the farmsteads from Prince Hohenlohe, the former owner of
    the Trąbczyn estate, and the privilege of rights he granted us in 1805 — we may graze our stock in
    the forest, in common with the manor''s, in the Studzienka forest section as far as the Bishop''s
    boundary — we may also gajć się [a word not understood] in the forest with carts 2 days a week and
    rake litter every year — and besides the arable land we had 6 Morgen of clay land for a clay pit for
    our own needs — and all this His Excellency the Commissioner Baron Rosen recognised as lawful for
    us, and he obliged the owner to supply the evidence we needed and to produce the mortgage'
  names: []
  numbers: []
  flagged: []
- page: 2
  confidence: high
  marker_count: 0
  en: 'map of 1805 by 3/15 August — which we can prove at any time by witnesses under oath. But when the
    owner drew up a new table in 1838, he divided the forest section on which we had our pasture into
    3 sections, and on 2 he forbids the grazing of cattle altogether, and on the third part he made 11
    clearings and young plantations, and we have no pasture — he does not allow the [ugaj] and the raking
    of litter, he takes the clay pit away for his own use — and for the drawing up of the new right and
    table, at the time of the visit of the Honourable Commissioner Władimirow, he brought forward false
    witnesses and gave them 12 roubles each to testify as he claims — and to this the witnesses are: 1.
    Marcin Rywarski and 2. Libner, a joiner, living in the village of Trąbczyn — and even one witness
    of the owner''s, Tomasz Janicki, himself declared it.


    So as not to be deprived of these servitudes, we brought three petitions to His Excellency the President
    of the Kalisz Commission for Peasant Affairs, namely on 6/18 June, 30 June/12 July and 3/15 September
    of'
  names: []
  numbers: []
  flagged: []
- page: 3
  confidence: high
  marker_count: 0
  en: 'last year, 1867, and then in October to the High Committee, and enclosed a copy of the privilege
    as evidence, and to that we received an answer dated 31 January 1868 referring us to the Kalisz Commission
    for Peasant Affairs.


    But since to this moment we have received neither the hoped-for result nor any decision, and the copy
    of the privilege has not been returned to us — we therefore turn in person, with a most humble repeated
    petition, to the High Constituent Committee, and beg on our knees:


    "That the High and Just Government forbid the owner of the Trąbczyn estate to take from us the servitudes
    written down in the right, order a strict inquiry on the spot, and delegate an official from Warsaw
    to carry it out — and order that the said clay pit and pasture be given into our possession and use
    in their former extent and within their former boundaries, forbid him to prevent the [ugaj], the digging
    of stumps and the raking of litter'
  names: []
  numbers: []
  flagged: []
- page: 4
  confidence: high
  marker_count: 0
  en: '— and be pleased graciously to confirm our old right to us."


    All the more since, besides our holding the right or privilege, the Supreme Ukases found us in possession
    of the said things — and should we fail to prove it, we will take on ourselves the costs of conducting
    the inquiry.


    We trust and have strong hope that the High Government, our only hope, will not allow the owner to
    do us so great a wrong, but will be pleased graciously and mercifully to incline to our imploring
    petition — will do justice, and by its decision will graciously restore us to the possession and use
    of the said — servitudes. —


    For which we beg in deepest humility. —


    Your most humble servants,


    Ludwig Hintz


    Krystyan Sehr


    Łazińsk colony, 10/22 August 1868.


    in the name of all —'

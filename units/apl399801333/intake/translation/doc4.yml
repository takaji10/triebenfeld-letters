  en: 'No. 1805


    To the High Commission for Peasant Affairs of the District of Kalisz.


    As the attached decision of the Honourable Baron von Rosen shows, a certain Krystian Lippeldt has
    been granted a servitude of pasturing 2 horses and 7 head of horned cattle on my land [written "majem
    territorium"], namely on the folwark Włodzimirów, at the places called "smugi". Since Krystjan Lippeldt
    is from a neighbouring village, I do not wish to take on any obligations towards him — I therefore
    turn with a request to the High Commission that this decision be annulled, and in support of it I
    set'
  names: []
  numbers: []
  flagged: []
- page: 2
  confidence: high
  marker_count: 0
  en: 'out the following facts:


    On the folwark Włodzimirów, which belongs to my estate of Trąbczyn, where there is a farming of many
    fields, I have the only pasture for the young stock. There I sometimes take in the stock of my neighbours,
    for payment or free of charge. The said Lippeldt, being in touch with the manorial lordship (Dominium),
    came to me with the request that he be allowed to pasture seven head of cattle and two horses on this
    pasture for a payment in money or for work at harvest.


    In one field on the boundary of Emilienhejm there are three hollows, the so-called "smugi", and since
    that field had then lain fallow for several years and I had no damage to fear, I allowed him to graze'
  names: []
  numbers: []
  flagged: []
- page: 3
  confidence: high
  marker_count: 0
  en: 'the said stock in these hollows, but only until 1 November of that year, for a payment in money,
    which I later changed, at his urgent requests, to labour, and for the information of my administration
    I gave him my written permission for it.


    Since, as I have said, that field lay fallow, in the following years I allowed Lippeldt, who always
    came to ask in the spring, to graze in these hollows, and now he claims that the Supreme Ukase found
    him in the use of this pasture. On the contrary, his contract of 1863 ended on 1 November, and so
    before the Supreme Ukase was issued, and the new written agreement was made on 1 May 1864, and so
    after the Supreme Ukase was issued.'
  names: []
  numbers: []
  flagged: []
- page: 4
  confidence: high
  marker_count: 0
  en: 'In that year he also made the attached contract — which he gave up, and returned the original in
    the presence of the former steward Swiderski. —


    From the above account it appears that Lippeldt had no servitudes on my land — that he did indeed
    use it as pasture, but only by temporary leave — which even for the peasants cannot be a title to
    a servitude against the owner — and still less for a man from another village — who has done nothing
    for the land he now wishes to seize — and brought it no benefit —


    I hold, therefore, that even if Lippeldt proved his use, a servitude can never be granted to him,
    for the Supreme Ukase, while extending its benefits to the peasants of the Kingdom as a whole — yet
    chiefly'
  names: []
  numbers: []
  flagged: []
- page: 5
  confidence: high
  marker_count: 0
  en: 'works to the advantage of the peasants of the village in which they grew up — and have well deserved
    it by their labour.


    Finally, Lippeldt cannot prove use: — to hold any rights — one must, under articles 1, 5, [11?] and
    others of the Supreme Ukase, have been exercising that right at the time the Ukase was issued. Lippeldt
    used [the pasture] before the Ukase, made a new contract after the Ukase, from which he withdrew of
    his own accord, — but he never used it at the moment of the Ukase — and that is precisely the chief
    principle for obtaining any of the rights the Ukase guaranteed to the peasants. —


    Since, then, Lippeldt as a stranger cannot draw favours from the village of Włodzimierów. — Since
    he likewise at the time'
  names: []
  numbers: []
  flagged: []
- page: 6
  confidence: high
  marker_count: 0
  en: 'of the Ukase did not graze at the place called "smugi" — I therefore consider — that he can acquire
    no rights to these "smugi" today either — and I therefore request the High Commission to annul the
    decision of the Honourable Commissioner. —


    Trąbczyn,


    23 July 1865.


    W. Miączyński'

# The claim check of the German summaries of APŁ 39/98/0/-/1333, made in
# session on 2026-11-13 under the rules read_letters.py --verify gives its
# checker: each summary split into its factual statements, each held to the
# document (the index entry by number, the letters by page id), verdict
# supported, overstated or unsupported, and the summary only weakened or cut,
# never added to. No statement rests on a word marked doubtful ([...?]) or on
# an index entry whose reading is "open" (nos. 11, 15, 45, 53, 68, 83, 85, 87,
# 90, 103, 109, 118, 126, 141 are not relied on). Page ids are the folio and
# side (0088_a = folio 88; 0088_b = 88 verso).
#
# Result: 87 statements, 78 supported as first written, 9 corrected (applied
# 2026-11-13, in the German and the English, the holding page and the timeline;
# 6 kept the gardens and buildings, which the plan's own labels show -
# Ogrody włościańskie, Ogród Dworski, Zabudowania dworskie, read on the image by
# Claude - and dropped the roads):
# 1. Document 1: 'der Kalischer Behörde für Bauernangelegenheiten über die Liquidationstabellen des Gutes Trąbczyn' -> 'über die Aufstellung der Liquidationstabellen des Gutes Trąbczyn (nach dem Titel der Archiveinheit)'; the issuing office is not in the index.
# 2. Document 1: 'jeder mit dem Schriftstück, seinem Absender, Datum und Nummer' -> 'jeder mit dem Schriftstück, die meisten mit Absender, Datum und Nummer'.
# 3. Document 1: cut 'und Witwen' (no entry names a widow).
# 4. Document 1: 'vom 13./25. Mai 1865' -> 'meist vom 13./25. Mai 1865'.
# 5. Document 1: 'Die letzten Einträge, 1869 und 1870 von einer zweiten Hand' -> 'Die letzten Einträge, ab Nr. 115 (1869 und 1870) von einer zweiten Hand'; 'sind Reihen von' -> 'sind überwiegend Reihen von' (nos. 115 and 117 are petitions).
# 6. Document 2: cut 'die Gebäude und Gärten des Dorfes und des Gutshofs und die Wege' (plan not transcribed).
# 7. Document 4: 'Dort sei seine einzige Weide für das Jungvieh' -> 'Auf dem Vorwerk Włodzimirów habe er seine einzige Weide für das Jungvieh'.
# 8. Document 4: 'diesen Vertrag gab Lippeldt auf und gab das Original ... zurück' -> 'im selben Jahr habe Lippeldt auch den beigelegten Vertrag geschlossen, ihn aufgegeben und das Original in Gegenwart des früheren Verwalters Swiderski zurückgegeben'.
# 9. Document 6: cut 'zwei Tage in der Woche mit Fuhren in den Wald und' (the verb is read with doubt); the sentence then reads '... bis zur bischöflichen Grenze weiden und jedes Jahr Streu rechen'.


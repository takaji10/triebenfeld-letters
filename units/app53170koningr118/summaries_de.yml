# German summaries of APP 53/17/0/-/Konin Gr.118, written in the working session from the Latin and Polish as checked
# (intake/holding.py, 2026-10-07).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app53170koningr118-001: "Unvollendeter Registervermerk im Buch des Burggerichts Konin, 1780: Bericht über eine Ladung vor das Tribunal, erwirkt von Stefan Zielonacki, Richter des Kalischer Landgerichts, und Stanisław Chełmski, Schatzmeister von Wschowa, gegen die Prusimski und die Bogdański. Der Vermerk bricht nach den Namen der Kläger ab."
app53170koningr118-002: "Registervermerk von 1781: Bericht über die Ladung, die Stefan Zielonacki, Richter des Kalischer Landgerichts, gegen Antoni Prusimski, Starost von Niszczewice, zum Ortstermin auf dem Grund des Gutes Grab erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken."
app53170koningr118-003: "Registervermerk über einen Protest, 1781: Antoni Ostroróg Prusimski, Starost von Niszczewice, Ritter des St.-Stanislaus-Ordens, Erbherr von Trąbczyn, Trąbczynek und Nowa Wieś, ist persönlich erschienen und protestiert vorsorglich gegen Stanisław Chełmski, Schatzmeister von Wschowa, Erbherr von Łukomia und Łomów; eine Abschrift liegt bei den vorgelegten Schriftstücken. Prusimski hat unterschrieben."
app53170koningr118-004: "Registervermerk vom 15. Oktober 1781: Bericht über die Ladung, die Antoni Prusimski, Starost von Niszczewice, gegen Kazimierz Zakrzewski und dessen Söhne Nepomucen, Ignacy und Ludwik sowie gegen das Kalischer Landgericht vor das Krontribunal in Petrikau erwirkt hat."
app53170koningr118-005: "Registervermerk vom 30. Oktober 1781: Bericht über die Zustellung der Ladung, die Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat."
app53170koningr118-006: "Registervermerk von 1781: Bericht über die Ladung, die Ignacy Gałecki, Starost von Bromberg, und Michał Drogosław Skórzewski, Unterkämmerer von Posen, der frühere und der jetzige Erbherr von Biskupice, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt haben."
app53170koningr118-007: "Registervermerk von 1781: Bericht über die Ladung, die Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat."
app53170koningr118-008: "Protest vom 22. November 1781, auf Polnisch. Pater Tesselin Malechowski, Verwalter des Konvents von Ląd, erklärt im eigenen Namen und im Namen des ganzen Konvents gegen einen Vorwurf von Antoni Prusimski, Starost von Niszczewice: Im Grenzstreit mit Łukomia und Trąbczyn, der das Konventsgut Drzewce berührt, habe sich der Konvent bei der letzten Kommission von keiner Absprache und Begünstigung leiten lassen. Er habe den Punkt, an dem die drei Gemarkungen Łukomia, Trąbczyn und Drzewce zusammenstoßen, so anerkannt, wie Chełmski ihn zeigte, aus den im Kommissionsdekret genannten Gründen, und bleibe dabei. Der Konvent sei bereit, das zu beschwören, und werde wegen des Vorwurfs Strafen betreiben. Malechowski hat unterschrieben."
app53170koningr118-009: "Registervermerk vom 4. Dezember 1781: Bericht über die Ladung, die Stefan Zielonacki, Richter des Kalischer Landgerichts, und Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, zum Ortstermin auf dem Grund des Gutes Grab erwirkt haben."
app53170koningr118-010: "Bericht des Gerichtsboten Simon Głabik von Drzewce, eingetragen in Konin im Januar 1782. Er hat Antoni Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn, eine königliche Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am 4. Januar 1782, auf Betreiben von Abt Benedykt Lubstowski und dem Konvent von Ląd, Erbherren von Drzewce. Der Konvent will von dem Vorwurf der Absprache mit dem Erbherrn von Łukomia freigesprochen werden und beruft sich auf Tribunalsdekrete und die Besichtigung von 1592. Der Bote hat die Ladung im Gutshof von Trąbczyn hinterlegt."
app53170koningr118-011: "Registervermerk vom 18. März 1782: Das Dekret des Ortstermins über die zu Trąbczyn gehörende Olęder-Siedlung, ergangen zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa, wird zur Eintragung vorgelegt; das Original ist bei den vorgelegten Schriftstücken eingeheftet."
app53170koningr118-012: "Registervermerk vom 19. April 1782: Bericht über die Ladung, die Antoni Prusimski, Starost von Niszczewice, Ritter des St.-Stanislaus-Ordens, gegen Vater und Söhne Zakrzewski sowie gegen das Kalischer Landgericht vor das Krontribunal in Petrikau erwirkt hat."
app53170koningr118-013: "Protest von Piotr Gosławski als Bevollmächtigtem von Antoni Prusimski, Starost von Niszczewice, gegen ein Dekret des Kalischer Landgerichts, eingetragen in Konin 1782 und von ihm unterschrieben. Vor dem Landgericht in Konin habe sein Auftraggeber am 15. Oktober des Vorjahres ein Zeugnis von Franciszek Ksawery Kęszycki, Marschall des Krontribunals, vom 13. Oktober vorgelegt und um Aufschub gebeten. Das Landgericht habe das Zeugnis nicht beachtet und Aufschub und Antrag nicht zugelassen; der Vertreter habe sich, ohne Urkunden, zurückziehen müssen. Gosławski protestiert gegen das Landgericht und die Gegenpartei und kündigt an, die Aufhebung des Dekrets und der erwirkten Verurteilung zu betreiben."
app53170koningr118-014: "Bericht des Gerichtsboten Bartłomiej Wrzask von Sławsk, eingetragen in Konin 1782, für Stanisław Ścibor Chełmski, Schatzmeister von Wschowa. Er hat eine königliche Ladung zum Ortstermin auf dem Grund des Gutes Grab zugestellt, ausgestellt in Petrikau am 26. November 1781. Geladen sind Antoni Prusimski, Starost von Niszczewice, sowie die Eheleute Bogdański: Ludwik, Landkämmerer von Kalisz, und Teresa, geborene Rozdrażewska, Erbin der Katarzyna Prusimska, geborene Rozdrażewska, Erbfrau von Grab. Sie sollen am 3. Juni 1782 vor dem Gericht des Ortstermins erscheinen, das ein Dekret des Krontribunals angeordnet hat. Chełmski verlangt die Zahlung der Summe, die der Kaufmann Tracholz ihm abgetreten hat, samt Zinsen; vier Untertanen aus Nowa Wieś sollen als Zeugen gestellt werden. Der Bote hat die Ladung am Freitag, dem Vorabend von Mariä Empfängnis 1781, in Trąbczyn hinterlegt."
app53170koningr118-015: "Überschrift eines Eintrags vom 25. Mai 1782: Chełmski, Schatzmeister von Wschowa, protestiert gegen ein Dekret des Krontribunals. Der Text wurde nicht geschrieben. Darunter haben Piotr Gosławski als Bevollmächtigter, auf seine Nachfrage wegen des Platzes, und Stanisław Ścibor Chełmski unterschrieben."
app53170koningr118-016: "Registervermerk vom 1. Juni 1782: Bericht über die Ladung, die Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, zum Ortstermin auf dem Gut Grab erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken."
app53170koningr118-017: "Protest von Jakub Pomian Górski, Grenzkämmerer der Woiwodschaft Inowrocław, gegen Stanisław Ścibor Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, eingetragen in Konin im Juni 1782 und von ihm unterschrieben. Górski war, von Prusimski beigezogen, zum Ortstermin zwischen Trąbczyn Minus oder Nowa Wieś und Łukom erschienen, den das Krontribunal in Petrikau mit seinem Dekret vom 23. Januar des laufenden Jahres angesetzt hatte, um Grenzhügel zu errichten; das Tribunal hatte den Grenzstreit nach der Karte entschieden und über zwei einander widersprechende Kommissionsdekrete befunden. Als er das Dekret nach der vom Tribunal in die Karte eingetragenen Linie vollziehen wollte, widersetzte sich Chełmski persönlich mit seinem Gefolge, stieß den Mann fort, der die Messkette zog, trat die Kette von der Linie, drohte und erklärte, er lasse eine weitere Berichtigung der Linie nicht zu. Górski brach die Amtshandlung ab, um beim Kriegsdepartement militärische Hilfe zu erwirken."
app53170koningr118-018: "Registervermerk vom Juni 1782: Für Antoni Prusimski, Starost von Niszczewice, wird die Besichtigung eines Ortes auf Trąbczyner Erbgrund zur Eintragung vorgelegt, von zwei Adligen und einem Gerichtsboten auf Stempelpapier zu einem Silbergroschen aufgesetzt und von den Adligen eigenhändig unterschrieben; das Original liegt bei den vorgelegten Schriftstücken."
app53170koningr118-019: "Protest von Stanisław Ścibor Chełmski, Erbherr von Łukomia und Myszakowo, gegen Jakub Górski, Grenzkämmerer von Inowrocław, vom 15. Juni 1782, von Chełmski unterschrieben. Vollziehende Ämter hätten Dekrete des Krontribunals zu vollziehen, nicht auszulegen. Górski habe beim Ortstermin auf dem Grund von Trąbczyn die Regel des Tribunalsdekrets überschritten, sei vom Feldamt des Landes Dobrzyń abgewichen und habe sich in die Auslegung des Dekrets eingelassen. Er habe Chełmski beschrieben, als hätte dieser sich widersetzt, seine Amtshandlung ohne Zustimmung der Parteien auf unbestimmte Zeit vertagt und seine Akten wegen militärischer Hilfe an das Kriegsdepartement des Immerwährenden Rates geschickt, statt die Sache an das Tribunal zu verweisen. Chełmski erklärt Górskis Handlung für nichtig. Darunter ein Vermerk vom 16. August: Piotr Gosławski, Bevollmächtigter Prusimskis, hat vor Zeugen wegen des Platzes nachgefragt, für den keine Angaben und keine Abschrift geliefert worden waren."
app53170koningr118-020: "Eintrag vom 16. August 1782. Piotr Gosławski, Bevollmächtigter von Antoni Prusimski, Starost von Niszczewice, fragt mit zwei Adligen in der Kanzlei, ob der Bericht über die Zustellung einer Ladung in Trąbczyn, die Stanisław Chełmski gegen Prusimski vor das Krontribunal in Petrikau erwirkt haben soll, vor dem Amt erklärt worden ist. Das Amt bescheinigt, dass ein solcher Bericht nicht vorliegt und nicht herausgegeben werden kann. Gosławski hat unterschrieben."
app53170koningr118-021: "Registervermerk von 1782: Bericht über die Ladung, die Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, und Jakub Górski, Grenzkämmerer von Inowrocław, vor das Krontribunal in Petrikau erwirkt hat."
app53170koningr118-022: "Registervermerk vom September 1782: Bericht über die Zustellung der Ladung, die Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, gegen Jan Alojzy Orłowski, Kämmerer des Landes Dobrzyń, und gegen Abt Benedykt Lubstowski und den ganzen Konvent von Ląd vor das Krontribunal in Petrikau erwirkt hat."
app53170koningr118-023: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 21. September 1782. Er hat drei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Montag nach St. Bartholomäus 1782. Geladen sind Kazimierz Zakrzewski, Landrichter von Brześć Kujawski, und seine Söhne Nepomucen, Ignacy und Ludwik aus der Ehe mit der verstorbenen Marianna Prusimska; deren Söhne erster Ehe Paweł und Józef Tomicki; Franciszek Tworowicz und Elżbieta, Frau von Jakub Taczanowski, Kinder der verstorbenen Wiktoria Prusimska; und Kunegunda Kołaczkowska, Tochter der verstorbenen Konstancja Prusimska und des Jan Kowalski. Geladen sind ferner die Amtsträger des Kalischer Landgerichts: der Richter Stefan Leszczyc Zielonacki, der Unterrichter Andrzej Bogdański, der Notar Xawery Mikorski und der Kämmerer Ignacy Rapacki. Kläger ist Antoni Prusimski von Kolno, Starost von Niszczewice: Sohn des verstorbenen Stefan Prusimski und der Wiktoria Malczewska, Enkel von Krzysztof Prusimski und Teresa Golińska, Neffe von deren Söhnen Jan, Bogumił, Antoni und Paweł Prusimski und nach dem kinderlosen Tod von Antoni und Paweł deren einziger Rechtsnachfolger. Er beruft sich auf ein Tribunalsdekret von 1738, das den Eheleuten Kowalski die Erbfolge nach Jan und Bogumił Prusimski absprach, und auf dessen Bestätigung durch ein Dekret von 1760. Er verlangt, die Dekrete des Landgerichts aufzuheben, ihn von dem Anspruch auf die Erbfolge nach Antoni und Paweł Prusimski freizusprechen und den Geladenen ewiges Schweigen aufzuerlegen: Töchter, die der Vater ausgestattet hat, könnten von den Brüdern nichts fordern. Die Ausfertigungen wurden in den Gutshöfen von Zieleniec und Mostki und in Konin im Haus der Bürgerin Wiśniewska hinterlegt, wo die Kanzlei des Landgerichts ist."
app53170koningr118-024: "Registervermerk vom September 1782: Bericht über die Ladung, die der Konvent von Ląd gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken."
app53170koningr118-025: "Bericht des Gerichtsboten Mateusz Matuszkiewicz von Szetlewek, eingetragen in Konin 1782. Er hat Stanisław Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, und anderen eine Ladung vor das Burggericht Kalisz zugestellt, auf Betreiben von Antoni Prusimski von Kolno, Starost von Niszczewice: wegen der Strafen für verübte Gewalttaten samt der Festnahme von Leuten. Er hat sie im Gutshof von Łukom in Gegenwart des Geladenen hinterlegt."
app53170koningr118-026: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 7. Dezember 1782, für Antoni Prusimski von Kolno, Starost von Niszczewice. Mit zwei Adligen, Adam Milewski und Jan Wilgiewicz, war er am 4. des laufenden Monats im Trąbczyner Kiefernwald. Links der Linie, die nach dem Dekret des Tribunals und des Ortstermins ausgehauen und mit Pflöcken bezeichnet ist, zählte er 221 gefällte Baukiefern, nach seiner Angabe am 28. November des laufenden Jahres von Leuten aus Łukomia, Łomów und anderen Gütern Chełmskis geschlagen und auf dessen Güter fortgeschafft, bis auf sieben Klötze. Nach seiner Angabe geschah es auf Befehl Chełmskis."
app53170koningr118-027: "Protest vom 7. Dezember 1782, auf Polnisch, von Leon Maszewski, Verwalter von Trąbczyn, auf Befehl seines Herrn Antoni Prusimski von Kolno, Starost von Niszczewice, der selbst nicht vor den Büchern erscheinen konnte, gegen Stanisław Chełmski, Schatzmeister von Wschowa, dessen Diener Jaroszewski und andere; Maszewski hat im Namen seines Herrn unterschrieben. Chełmski wisse aus den Dekreten des Tribunals und des Ortstermins dieses Jahres, dass die Linie von der Ecke von Trąbczyn, Łukom und Drzewce bis zur Ecke mit Biskupice, vom Tribunal in die Karte gezogen und vom Geometer in Chełmskis Gegenwart im Gelände ausgehauen und abgepflockt, Trąbczyn von Łukomia scheidet. Dennoch habe er seine Leute aus Łomów und Łukom, die der Protest mit Namen nennt, mit Schlitten, Pferden, Ochsen und Äxten in den Kiefernwald links der Linie geschickt, der zu Trąbczyn gehört; sie hätten eine große Zahl Kiefern gefällt und nach Łukomia gebracht. Chełmskis Leute seien außerdem in Trąbczyn eingefallen, hätten Leute aus Trąbczyn auf der Straße angegriffen und andere Gewalttaten verübt."
app53170koningr118-028: "Registervermerk vom Dezember 1782: Das Grenzdekret des Ortstermins zwischen den Gütern Trąbczyn und Łukom, ergangen zwischen Antoni Prusimski, Starost von Niszczewice, Stanisław Chełmski, Schatzmeister von Wschowa, und anderen, mit der Beschreibung der Grenzhügel, wird zur Eintragung vorgelegt und liegt bei den vorgelegten Schriftstücken."
app53170koningr118-029: "Registervermerk vom Dezember 1782: Für Antoni Prusimski, Starost von Niszczewice, liegt die Übergabe des Trąbczyner Olęders Martin Hunt bei den vorgelegten Schriftstücken, vorgenommen von Józef Łukaszewicz, Kommissar der großpolnischen Woiwodschaften."

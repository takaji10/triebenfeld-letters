# What the check of APP 53/17/0/-/Konin Gr.118 against the scans changes for
# anyone who has written about these entries from the earlier text. Read by
# pipeline/review/changes_page.py. The first check was a light one: every
# heading and date line, the short entries word for word, the opening and
# close of the long ones. The editor read that record on 2026-10-07 and
# asked for the full check; what it added is marked `new:`.
# importance: significant | fact | wording.

unit: "APP 53/17/0/-/Konin Gr.118: twenty-nine register entries, 1780 to 1782"
changes:
- importance: significant
  what: "The entry you have under [173] is not the continuation of the note on leaf 172 verso. That note is unfinished: it stops after the plaintiffs' names. Leaf 173 begins a new entry with its own heading, a commission decree between Rafał Gurowski, castellan, and the townsmen of Brdów. It does not concern Trąbczyn, and I left it out. Your English had joined the two into one sentence."
  was: "(English) on behalf of the Illustrious Stefan Zielonacki ... and Stanisław Chełmski, Treasurer of Wschowa, the Enrollment of a Commissorial Decree issued between the residents of Brdów and the Illustrious Raphael Gurowski"
  now: "(English) on behalf of the Illustrious Stefan Zielonacki ... and Stanisław Chełmski, Treasurer of Wschowa, [the note ends]"
- importance: significant
  what: "The first note is a report of a citation TO THE TRIBUNAL (\"ad Tribl Rel\"), against the Prusimskis and the Bogdańskis, and Zielonacki is \"Judicis\", the judge of the land court, as plaintiff beside Chełmski."
  was: "Ex parte MM Zielonacki Judicium Terrestris Calissiensis et Chełmski contra MM Prusimski Bogdanskie a[d?] nbl Relatio"
  now: "Ex parte MM Zielonacki Judicis Terrestris Calissiensis et Chełmski contra MM Prusimskie Bogdanskie ad Tribunal Relatio"
  english_was: "Report to the Noble [Court]"
  english_now: "Report to the Tribunal"
- importance: significant
  what: "A note on leaf 266 verso (your photograph 272) was not in your text; I transcribed and translated it. Zielonacki, judge of the land court, cites Prusimski to the sitting on the ground at Grab. It stands shortly before the heading of 9 May 1781."
  was: "(not transcribed)"
  now: "Ex Parte M Zielonacki Judicis Terrestris Calissiensis contra JM Prusimski Capitaneum Nieszczevicen~ Relatio / Videatur hoc loco Relatio ex parte Magnifici Stephani Zielonacki ... pro Termino Condescensionis In Fundo Bonorum Grab agitt~ Inciden~ prout Copia in productis"
- importance: fact
  what: "Gałecki and Skórzewski (leaf 382 verso) are the FORMER and the PRESENT heir of Biskupice: \"anteacti et ... Praesentanei Bonorum Biskupice Haeredum\". Your English had \"formerly Starost of Bydgoszcz\" and an unread word."
  was: "Succamerariuu Posnaniensis B[ae?]septanei Bonorum Biskupice Haearedum"
  now: "Succamerariuu Posnaniensis Praesentanei Bonorum Biskupice Haearedum"
  english_was: "Ignacy Gałecki, formerly Starost of Bydgoszcz, and ... Skorzewski, Sub-chamberlain of Poznań, [B[ae?]septanei], Heirs of the estate of Biskupice"
  english_now: "Ignacy Gałecki, Starost of Bydgoszcz, the former heir, and ... Skorzewski, Sub-chamberlain of Poznań, the present heir of the estate of Biskupice"
- importance: fact
  what: "The citation on leaf 398 is for the term \"Condescensionis\", the sitting on the ground, at Grab, as its heading says; your text had \"Conditionis\"."
  was: "pro Termino Conditionis in Fundo Bonorum Grab [A?]agitt~"
  now: "pro Termino Condescensionis in Fundo Bonorum Grab agitt~"
- importance: fact
  what: "The abbot of Ląd is Ludwik Benedykt Lubstowski (\"Lu|dovici Benedicti\", leaf 416), and the citation was left with a maidservant present (\"Ancilla\")."
  was: "Ladovie~ Benedicti Lubstowski ... praesen~ Ancitta Die horna Acta"
  now: "Ludovici Benedicti Lubstowski ... praesen~ Ancilla Die horna Actu"
- importance: fact
  what: "The note of 16 August 1782 under Chełmski's protest (leaf 530 verso): the witnesses are Tomasz Reczkowski and Świętosław Bogusławski and the messenger Mateusz Matuszkiewicz of Szetlewek, the same men as in the search on leaf 585 verso. Chełmski signed the protest above the note and again below it."
  was: "Thoma Reczkoyki[?] et Suent[o/i?] elai[?] Bogusławski nec non Providi Mathaei Matuszewski nie[x?] de Szetlewek"
  now: "Thoma Reczkowski et Sventoslai Bogusławski nec non Providi Mathaei Matuszkiewicz de Szetlewek"
- importance: fact
  what: "The heading on leaf 674 verso ends \"Prolati Oblata\": the boundary decree of the sitting on the ground was GIVEN and is brought in; nothing about a protocol. The commissioner who delivered the settler Martin Hunt is Józef Łukaszewicz."
  was: "Decreti Condescensorialis Granicialis Inter bona Trąmpczyn et Łukom Protocollo Obl[ata?] ... per M Josephus Lukaszewicz ... peractis"
  now: "Decreti Condescensorialis Granicialis Inter bona Trąmpczyn et Łukom Prolati Oblata ... per M Josephum Łukaszewicz ... peracta"
  english_was: "between the estates of Trąbczyn and Łukom — enrolled in the Protocol"
  english_now: "issued between the estates of Trąbczyn and Łukom"
- importance: fact
  what: "Signatures stand under six entries and were not in your text: Prusimski's under his protest on leaf 343 verso (\"Antoni Ostrorog na Kolnie Prusimski\"); Father Tesselinus Malechowski's under the convent's protest; Gosławski's under his protest on leaf 475 verso; Chełmski's under the unwritten entry on leaf 515 and twice on leaf 530 verso; and Maszewski's goes on \"Imieniem Pana mego\", in the name of my lord."
  was: "(not transcribed)"
  now: "Super manifestationem Antoni Ostrorog na Kolnie Prusimski [?] / F Tesselinus Malechowski [?] qua Plens~ mpp / Petrus Gosławski qua [?] / Stanisław Scibor Chełmski / Leon Maszewski Imieniem Pana mego"
- importance: fact
  what: "Leaf numbers. The entry you put under [523] (Górski's protest) is on leaf 523 verso. Your line under [496] is your own note; leaf 496 begins another entry, and the citation of leaf 495 verso ends on that page. The heading on leaf 514 verso is only the date; the entry it dates is on leaf 515."
  was: "[523] / [496] Tracholz/Chełmski/Grab/Rozdrażewska/Prusimski (same as 495v)"
  now: "leaf 523 verso / (left out)"
- importance: fact
  what: "Dates. Read on the pages: 15 and 30 October 1781, 22 November 1781, 18 March, 19 April, 25 May, 1 June, 15 June, 21 September and 7 December 1782. From headings you did not transcribe: 4 December 1781 (leaf 398), 16 August 1782 (leaf 585 verso). The heading on leaf 626 says the Saturday before Michaelmas and \"29\", with the month you could not read: it is \"7bris\", and the Saturday was the 28th. Fifteen entries have no heading on a photographed page: six are dated to the month, nine to the year only."
  was: "Die scilicet 29 Mensis [????] Anno Domini 1782"
  now: "Die scilicet 29 Mensis 7bris Anno Domini 1782 (dated 28 September)"
- importance: fact
  what: "Six lines in your English file are not translation: \"9:24 p.m.\", \"Please fix the most recent one.\", \"9:28 p.m.\", \"Show more\", \"9:32 p.m.\" and \"Claude responded: [523]\". They are left out."
  was: "(chat-window lines)"
  now: "(removed)"
- importance: wording
  what: "Smaller readings: \"Manifestatio Certa\"; in the convent's Polish protest \"Osobiscie\", \"ręczy\", \"oczyszczaiąc się\", \"sprzyianiem\", \"gotowość\", \"przyzwoitych\"; \"seu tunc\"; \"pronuntiari\"; \"in Hollandris\"; \"praemisso attestato\"; \"in Papyro ... Eorundem\"; \"Cui Requisitioni ... de Inexistentia\"; \"Chełmski T V\"; \"Citationes Litteras ... ejusdemque essentiae trinas\"; \"attentatarum Violentiarum ... armariolo\"; in the report on the pines \"nalezącym\", \"wyciętey\", \"Kołkami\", \"Budynkowych\", \"WJmc\". On leaf 515 I read \"hujusce[?] Spatii\" for \"[?]uinocae Spati\" and left it marked."
  was: "see the list"
  now: "see the list"
- importance: significant
  new: "full check, 2026-10-07"
  where: "Document 13, leaf 475 verso"
  what: "Three lines were passed over in the protest for Prusimski against the land court, and they hold its substance. Gosławski had \"produced\" Prusimski's citation of Chełmski to the Tribunal, as proof that the cause was pending there. The land court refused the delay \"for this reason, that the cause is to be brought on from the registers of the palatinates of Greater Poland, whereas at present the register of the palatinate of Płock is being judged in the Tribunal\"; it \"cut off the delay and ordered the matter to be brought in\". Your text joined the halves of different lines (\"se se [?]erte[r?]nem\"), read Płock as \"Rlocen~\", and read \"Regestrum Expulsionum\" (the register of expulsions) as \"Regn~m\", so that your English spoke of \"the Kingdom's Expulsions\"."
  was: "in probalionem Causae in Judicio Tribunalio se se [?]erte[r?]nem quod Causa ex Regestris Palatinatuam Majoris Poloniae pro movenda Tribunaliis Judicatur favore ... sibi Regn~m Expulsionum etiam tempore Regestri Palatinatus Rlocen~ ... est Sortitus Dilationem ac motionem per Sui Comparentem interpositam non admi[s/t?]erat"
  now: "in probationem Causae in Judicio Tribunalio se se vertentis reposuerat, Suprascriptum tamen Judicium Terrestre Calissien~ ob hanc rationem quod Causa ex Regestris Palatinatuum Majoris Poloniae promovenda [?]datur jam autem ad praesens Regestrum Palatinatus Plocen~ in Judiciis Eisdem Tribunaliis Judicatur, favore ... sibi Regestrum Expulsionum etiam tempore Regestri Palatinatus Plocen~ ... est Sortitus Dilationem Suprascriptam amputaverat negotiumque inducere mandaverat ac motionem per Sui Comparentem interpositam non admiserat"
  english_was: "had cited [the existence of] a term before the Crown Tribunal at Piotrków issued against the Illustrious Chełmski, as proof of the cause in the Tribunal Court, [se se [?]erte[uncertain: r]nem] — that the cause, from the Records of the Palatinates of Greater Poland to be promoted to the Tribunal Courts, is judged in favour of the Illustrious Zakrzewskis and others — not heedfully noting for himself the [Kingdom's] Expulsions even at the time of the Register of the [Rlocen~] Palatinate"
  english_now: "had produced a term issued by the Manifesting [party] to the Crown Tribunal at Piotrków against the Illustrious Chełmski, in proof that the cause was pending in the Tribunal Court — the said Kalisz Land Court nevertheless, for this reason, that the cause is to be brought on from the Registers of the Palatinates of Greater Poland [one word unread], whereas at present the Register of the Płock Palatinate is being judged in those same Tribunal Courts — led by favour towards the Illustrious Zakrzewskis and others, not calling to mind the Register of Expulsions ... cut off the above-written delay and ordered the matter to be brought in"
- importance: significant
  new: "full check, 2026-10-07"
  where: "Document 14, leaf 495 verso"
  what: "Who is cited to the sitting at Grab. The word you read \"oto[?]\" is \"olim\", the late. So Teresa Bogdańska, born Rozdrażewska, is cited as the \"successor\" of two dead sisters: the late Katarzyna, \"by her last marriage Prusimska\", heiress of Grab, and the late Molska, castellan's wife of Rogoźno, \"who departed this life without issue\" (\"de hac luce decessarum\"). She and her husband Ludwik are \"the spouses Bogdański\" (\"Conjugibus\"). Your English listed Katarzyna and Molska as living persons who were cited, and supplied \"[Katarzyna]\" twice further down. There the scan has \"Tui Illustris Magnifice Prusimski\", the form of address to Antoni: the cause came to the sitting \"by way of the prosecutions and protests of you, Prusimski\", and the four working men of Nowa Wieś to be produced as witnesses are \"your subjects\", arrested in his keeping \"as before\"."
  was: "Thaeresiae de Rozdrzewskie oto[?] Magnificae Catharinae ... ac oto[?] Illustris Magnificae Similiter de Rozdrzewskie Molska Calnae~ Rogoznen~ steriliter de hac li[c?]e decessarum Succestrici seu Invicem Congb~is Bogdanskie ... via prosecutionum et Magnificum Tui Illustris Magnificae Prusimski ... Tum[on?] Illustris Magnificae Prusimski Subditt~ qui [?]ct ante ita et praesenti Citatione qpud Te Arestantur"
  now: "Thaeresiae de Rozdrzewskie olim Magnificae Catharinae ... ac olim Illustris Magnificae Similiter de Rozdrzewskie Molska Calnae~ Rogoznen~ steriliter de hac luce decessarum Succestrici seu Invicem Conjugibus Bogdanskie ... via prosecutionum et Manifestationum Tui Illustris Magnifice Prusimski ... Tuorum Illustris Magnifice Prusimski Subditt~ qui sicut ante ita et praesenti Citatione apud Te Arestantur"
  english_was: "and to Teresa of the Rozdrzewski [family], [uncertain: oto] the Illustrious Katarzyna ... Heiress of the estate of Grab; and [uncertain: oto] the Illustrious Magnificent ... Molska, Castellaness of Rogoźno — having died without issue — to her successor, or mutually [Congb~is], Bogdański ... [transferred] to the Illustrious Magnificent [Antoni] and to the Illustrious Magnificent [Katarzyna] Prusimska ... and the subjects of the Illustrious Magnificent [Katarzyna] Prusimska, who by [?ct] this Citation are detained at your [estate]"
  english_now: "and to Teresa of the Rozdrzewski [family], successor of the late Illustrious Katarzyna ... by her last marriage Prusimska, Heiress of the estate of Grab, and of the late Illustrious Magnificent Molska ... who departed this life without issue — that is, to the spouses Bogdański ... by way of the prosecutions and protests of you, Illustrious Magnificent Prusimski ... your subjects, Illustrious Magnificent Prusimski, who as before so by the present Citation are arrested in your keeping"
- importance: significant
  new: "full check, 2026-10-07"
  where: "Document 19, leaves 530 and 530 verso"
  what: "What Chełmski charges Górski with, read whole. Górski \"thrust himself into the interpretation\" of the Tribunal's decree (\"in interpretationem ... se se ingessit\"; your \"in inter protationem\", translated \"in the execution\"). He declared, \"beyond what the decree prescribes\" (\"ultra praescriptum\"; your \"praesumptum\"), that he would come again \"upon his own notices\", instead of sending the cause back to the Tribunal \"because carrying it out along the line made on the map, which does not agree with the lie of the ground, is impossible without cutting off the Olęder adjudged to him\" (\"sine Interceptione Hollandonis sibi ... adjudicati\": one settler, in the singular, the one whom Konin Gr.153 names as Martin Hunt). Chełmski will sue him \"for the office ill discharged\" (\"de male gesto Officio\")."
  was: "discrepando in inter protationem non tantum Decreti Tribunalii ... declarando ultra praesumptum Decreti ... pro[v/pr?]iis Innotescensiis iterum se Condescenscerum, loco Remissionis ad Tribunal Regni Causae obrationem impossibilis juxta Lineam in Mappa cum Sita locorum difformi ... sine Interceptione Hollandoris sibi Re et Mafanti[?] adjudicati ... cum Eodem de[m/re?]ale gesto Officio"
  now: "discrepando in interpretationem non tantum Decreti Tribunalii ... declarando ultra praescriptum Decreti ... propriis Innotescentiis iterum se Condescensurum, loco Remissionis ad Tribunal Regni Causae ob rationem impossibilis juxta Lineam in Mappa cum Situ locorum difformi ... sine Interceptione Hollandonis sibi Re et Mafanti adjudicati ... cum Eodem de male gesto Officio"
  english_was: "in the execution not only of the Tribunal Decree but also of the Acts of the Gniezno Municipal Court ... thrust himself into [the matter of] the evacuation of the Olędry ... declaring, beyond the presumed scope of the above-mentioned Tribunal Decree and by his own private notifications ... without accounting for the Olędry adjudicated to [Chełmski] and the Manifesting party ... regarding the actually conducted Office"
  english_now: "thrust himself into the interpretation not only of the Tribunal Decree but also of the Acts of the Gniezno Municipal Court ... declaring, beyond the prescription of the above-mentioned Tribunal Decree, that he would descend to the site again upon his own notifications — instead of remitting the cause to the Crown Tribunal, because [execution] according to the Line made on the Map by the Most Serene Tribunal, which does not agree with the lie of the ground, is impossible without cutting off the Olęder adjudged to him ... regarding the Office ill discharged"
- importance: fact
  new: "full check, 2026-10-07"
  where: "Document 17, leaf 523 verso"
  what: "Górski's protest: words were passed over between two occurrences of \"Tribunalitii\". Chełmski resisted \"setting at nought the authority of the sacred Tribunal\" (\"post posita Authoritate Sancti Tribunalitii\"). And what Chełmski refused to allow is the further \"correction\" of the line (\"meliorationem Lineae\"; your English \"laying\"). That is the very act for which the Tribunal punished Górski in October (Konin Gr.153). Górski stopped \"to obtain military aid from the War Department\" (\"Militaris ... Auxilii\")."
  was: "Decreti Tribunalii Post Commissorialis ultime Instantiae existantis ... non admissarum Judicialiter se se dedaravit ... et [F?]ine Impetrandi Militaris ab Inclito Departmento Belli[c?]o Au[?]itii supersessit"
  now: "Decreti Tribunalii post posita Authoritate Sancti Tribunalitii Post Commissorialis ultimae Instantiae existentis ... non admissurum Judicialiter se se declaravit ... et Fine Impetrandi Militaris ab Inclito Departamento Bellico Auxilii supersessit"
  english_was: "rebelliously obstructed the further effectuation of the Post-Commissorial Tribunal Decree of the last instance ... declared himself judicially as not admitting the further laying of the Line"
  english_now: "setting at nought the authority of the sacred Tribunal's Post-Commissorial [decree], which is of the last instance ... rebelliously obstructed the further effectuation of the Tribunal Decree ... declared judicially that he would not admit the further correction of the Line"
- importance: fact
  new: "full check, 2026-10-07"
  where: "Document 23, leaves 622 to 623 verso"
  what: "Prusimski's descent, as the citation gives it, read whole. Antoni is the \"nephew\" (\"Filiastri\", brother's son) of Jan, Bogumił, Antoni and Paweł, and, after Antoni and Paweł died without issue, \"their sole natural and legitimate successor\". Your English had him as their \"[descendant]\" and as \"Successor of the Plaintiff\". Krzysztof Prusimski is his \"grandfather\" (\"Avi\", your \"Aci[?]\"). Kazimierz Zakrzewski is land \"judge\" and his son Nepomucen castle \"judge\" of Radziejów (\"Judici\"). The land court \"found itself the forum instead of making the remission to the Tribunal, though Tribunal decrees stood in the way\" (\"pro loco Remissionis Intervenientibus Decretis Tribunalis\")."
  was: "Casimiro Judicii Terrestri ... Nepomuceno Judicii Castren~ ... Sui Actt~ germanorem Filiastri ... Prusimski Aci[?] vero Sui ... tum atterius pro logo Remissionis Intervenientibus Decreti Tribunalis ... mandamus [itt/ott?] coram ... super Voles[?]"
  now: "Casimiro Judici Terrestri ... Nepomuceno Judici Castren~ ... Sui Actt~ germanorum Filiastri ... Prusimski Avi vero Sui ... tum alterius pro loco Remissionis Intervenientibus Decretis Tribunalis ... mandamus ut coram ... super Vobis"
  english_was: "[descendant] of the late Illustrious Jan, Bogumił, Antoni, and Paweł Prusimski ... and sole natural and legitimate Successor of the Plaintiff after the sterile deaths of the Illustrious Antoni and Paweł ... then another [decree] for the place of the remission, with the intervening Tribunal decree, the appropriate forum having been found"
  english_now: "nephew of the late Illustrious Jan, Bogumił, Antoni, and Paweł Prusimski ... and, after the deaths without issue of the Illustrious Antoni and Paweł, their sole natural and legitimate successor, the Plaintiff ... then another [decree], by which [the court] found itself the forum instead of making the remission to the Tribunal, though Tribunal decrees stood in the way"
- importance: fact
  new: "full check, 2026-10-07"
  where: "Documents 26 and 27, leaves 673 to 674"
  what: "The pines of November 1782, the Polish read whole. The felled timber, \"that is the logs\" (\"Kloce\", your \"Moce\"), was taken away \"to\" Chełmski's estates (\"do wspomnionych Dóbr\"; your English \"from\"), all but seven \"butt logs\" (\"odziemnych\") and the branches \"lying on the spot\". In the protest: Prusimski \"cannot at this time be at the books of the office\" (\"u Xiąg Urzędownych\"); Jaroszewski is Chełmski's \"servant\" (\"Słudze\"); Chełmski \"sent\" his people (\"nasłał\") \"on the very day\" the two sittings began; they \"carted\" the pines to Łukomia and \"burst into the manor courtyard\" (\"na Dziedziniec Dworski\"; your \"Dziedzinie\", \"domain\"). One of them is Antoni \"Wasiak\", like his father in the next line. A \"szkudlarz\" is a shingle-maker, not a wool-carder. Prusimski \"charged the manifestant\" (Maszewski) with lodging the complaint."
  was: "czyli Moce do uspomnionych Dóbr pozabierane procz Siodmiu kloców odsiemnych y Gałęzi[?] na mieysce lezązych[?] ... wtym Czasie [W/U?][x?]ią[g?] ... [s?]tudze Jego ... w Sam[...?][z?]iem rozpoczynaiących ... LudziSwoich jakoło Urodzonych ... Antoniego Waziaka ... nastal, którzy nast[awi?] ... zanieśli ... na Dziedzinie Dworski wpadli"
  now: "czyli Kloce do wspomnionych Dóbr pozabierane procz Siodmiu klocow odziemnych y Gałęzi na mieyscu lezących ... wtym Czasie u Xiąg ... Słudze Jego ... w Sam [o?]dzien rozpoczynaiących ... Ludzi Swoich jako to Urodzonych ... Antoniego Wasiaka ... nasłał, którzy nasła[ni] ... z[a?]wiezli ... na Dziedziniec Dworski wpadli"
  english_was: "which timber was taken away from the aforementioned estates, except for seven [odsiemnych] logs and [uncertain: branches] lying in place ... who at this time [W/U?x?ią[uncertain: g] was unable to attend to official matters ... in the very [Sam...z?iem] of the two condescensions commencing by its force, [sent] his people ... fell upon the pine forest ... carried them to the estates of Łukomia ... broke into the manor domain"
  english_now: "which timber, that is the logs, was taken away to the aforementioned estates, except for seven butt logs and the branches lying on the spot ... who cannot at this time be at the books of the office ... on the very day on which the two condescensions under it began, sent his people ... upon the pine forest ... carted them to the estates of Łukomia ... burst into the manor courtyard"

- page: 2
  confidence: high
  marker_count: 2
  en: 'to the above-mentioned attestation, had ordered [him] to prove the principal matter; and when the
    Appearing [party], on behalf of the Manifesting [party], had cited [the existence of] a term before
    the Crown Tribunal at Piotrków issued against the Illustrious Chełmski, as proof of the cause in the
    Tribunal Court, [se se [?]erte[uncertain: r]nem] — that the cause, from the Records of the Palatinates
    of Greater Poland to be promoted to the Tribunal Courts, is judged in favour of the Illustrious Zakrzewskis
    and others — not heedfully noting for himself the [Kingdom''s] Expulsions even at the time of the
    Register of the [Rlocen~] Palatinate, judging itself, from which [time] his Manifesting Principal
    had obtained a judgment in the Crown Tribunal Court at Piotrków — [the Land Court] had not admitted
    the delay and motion interposed by his Appearing [party]. The Appearing [party] of the Manifesting
    Principal, therefore, lacking documents, was compelled to withdraw from the appearance.


    Therefore the Manifesting [party], in the name of the same person as above, against the Kalisz Land
    Court and the party presenting the above-mentioned grievances, manifests again and again — offering,
    on behalf of his Principal, regarding the matters promised by law of the Acts, both the cassation
    of the Decree ordering [its production] and [redress for] the coercively obtained Condemnation — wishing
    then to request that penalties for the above-mentioned interests be extended — saving all that is
    to be saved.


    Petrus Gosławski, as [illegible]'

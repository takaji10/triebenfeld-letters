  en: 'The Plenipotentiary of the Illustrious Prusimski, Starost of Niszczewice, against a Decree of the
    Kalisz Land Court — a Manifest is lodged


    Having come in person to the present Office and Records of the Konin Municipal Court, the Honourable
    Piotr Gosławski, in the name of the Illustrious Magnificent Antoni Prusimski, Starost of Niszczewice
    (for whom he provides surety), acting as Plenipotentiary, lodges a solemn Complaint in the present
    Records — for the following reason: that although his Manifesting Principal, in the Land Courts of
    the Kalisz Palatinate sitting by district in Konin, on Monday, on the very day of the Feast of Saint
    Hedwig, Widow, Elect, namely the 15th day of the month of October in the past year, when [the court]
    was held, had appeared through his Plenipotentiary and had produced an attestation issued by the Illustrious
    Magnificent Franciszek Ksawery Nałęcz Kęszycki, Marshal of the Crown Tribunal, on the 13th day of
    October in the past year, and had sought a delay to be granted to him for [establishing] the principal
    matter — nonetheless the Kalisz Land Court, paying no attention whatsoever'
  names: []

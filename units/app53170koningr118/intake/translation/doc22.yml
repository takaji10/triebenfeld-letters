  en: 'On behalf of the Illustrious Prusimski, Starost of Niszczewice, against the Illustrious Chełmski
    — a Report


    Let there be seen at this place a Citation Return Report on behalf of the Illustrious Magnificent
    Antoni of Kolno Prusimski, Starost of Niszczewice, of the Order of Saint Stanislaus, against the Illustrious
    Stanisław Chełmski, Treasurer of Wschowa, and Jan Alojzy Orłowski, Land Chamberlain of the Dobrzyń
    Land, and also the Most Illustrious and Most Reverend Benedykt Lubstowski, Cloistered Abbot of Ląd,
    or the entire Ląd Convent — for the Ordinary General Sessions of the Crown Tribunal of the Kingdom
    at Piotrków — as the submitted copy stands in the submitted documents.'

  en: 'Done in Konin, on Monday, next after the Sunday of Judica in Lent, namely the 18th day of the month
    of March, in the Year of the Lord 1782.


    Enrollment of a Condescensorial Decree issued concerning the settlement belonging to the estate of
    Trąbczyn


    Let there be seen at this place the Enrollment of a Condescensorial Decree concerning the Olęder [settlement]
    belonging to the estate of Trąbczyn, issued between the Illustrious Magnificent Antoni Prusimski,
    Starost of Niszczewice, and the Illustrious Stanisław Chełmski, Treasurer of Wschowa — as the original
    in the submitted documents, sewn in.'

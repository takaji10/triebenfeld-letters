  en: 'The Illustrious Prusimski, Starost of Niszczewice, by virtue of [a writ of] diligence — a Manifest
    is lodged


    Let there be seen at this place a Manifest, certain in its substance and [arising from] personal appearance,
    of the Most Illustrious Magnificent Antoni Ostroróg Prusimski, Starost of Niszczewice, Knight of the
    Order of Saint Stanislaus, Heir of the estates of Trąbczyn, Trąbczynka, Nowa Wieś, and others — in
    and against the Illustrious Stanisław Chełmski, Treasurer of Wschowa, Heir of the estates of Łukomia,
    Łomowa, and others — as the copy in the submitted documents [attests].


    Upon the manifest: Antoni Ostroróg of Kolno Prusimski [illegible]'

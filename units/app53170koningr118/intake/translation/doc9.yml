  en: 'On behalf of the Illustrious Chełmski and others, against the Illustrious Prusimski — Report for
    the Term of the Condescension


    Let there be seen at this place a Report on behalf of the Illustrious Stefan Zielonacki, Judge of
    the Kalisz Land Court, and Stanisław Chełmski, Treasurer of Wschowa, against the Illustrious Magnificent
    Antoni Prusimski, Starost of Niszczewice — for the Term of the Condescension in the settlement of
    the estates of Grab, being conducted, upcoming — as the copy in the submitted documents [attests].'

  en: 'On behalf of the Illustrious Gałecki, Starost of Bydgoszcz, and Skorzewski, Sub-chamberlain of
    Poznań, against the Illustrious Magnificent Prusimski, Starost of Niszczewice — a Report


    Let there be seen at this place a Report on behalf of the Illustrious Magnificent Ignacy Gałecki,
    Starost of Bydgoszcz, the former heir, and the Illustrious Magnificent Michał Drogosław Skorzewski,
    Sub-chamberlain of Poznań, the present heir of the estate of Biskupice — against the Illustrious Magnificent
    Antoni Prusimski, Starost of Niszczewice — for the Ordinary General Sessions of the Crown Tribunal
    of the Kingdom at Piotrków — as the copy in the submitted documents [attests].'

  en: 'On behalf of the Illustrious Prusimski, against the Illustrious Chełmski — a Report


    Having come in person, the Honest Mateusz Matuszkiewicz of the village of Szetlewek, General Royal
    Process Server, sound [of mind], acknowledged that he had served authenticated Citation Letters for
    the sessions of the Kalisz Municipal Court next to be held in the Kalisz Castle — on behalf of and
    at the instance of the Illustrious Magnificent Antoni of Kolno Prusimski, Starost of Niszczewice,
    Knight of the Order of Saint Stanislaus, Heir of the estates of Trąbczyn and others, and other Plaintiffs
    — against the Illustrious Stanisław Chełmski, Treasurer of Wschowa, Heir of the estates of Łukom,
    and other Cited parties — for penalties on account of attempted violence with the arrest of people,
    [in Imo~] to be similarly carried out in the future, issued — in the manor of the estates of the village
    of Łukom, upon the small cupboard in the heated room, in the presence of the Cited party, on this
    very day — having placed [the citation] and having left notification.'

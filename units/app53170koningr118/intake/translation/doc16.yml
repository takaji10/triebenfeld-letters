  en: 'Done in Konin, on Saturday, within the Octave of the Feast of the Most Sacred Body of Christ the
    Lord, namely the 1st day of the month of June, in the Year of the same 1782.


    On behalf of the Illustrious Prusimski, Starost of Niszczewice, against the Illustrious Chełmski —
    a Report


    Let there be seen at this place a Report on behalf of the Illustrious Magnificent Antoni of Kolno
    Prusimski, Starost of Niszczewice, against the Illustrious Stanisław Chełmski, Treasurer of Wschowa
    — for the Term of the Condescension in the estates of Grab, being conducted, upcoming — as the submitted
    copy stands in the submitted documents.'

  en: 'Done in Konin, on Monday, on the very day of the Feast of Saint Hedwig, Widow, Elect of God, namely
    the 15th day of the month of October, in the Year of the Lord 1781.


    On behalf of the Illustrious Prusimski, Starost of Niszczewice, against the Illustrious Zakrzewskis
    and the Kalisz Land Court — Report to the Tribunal


    Let there be seen at this place a Report on behalf of the Illustrious Magnificent Antoni Prusimski,
    Starost of Niszczewice, against the Illustrious Casimir, father, and Nepomucen, Ignacy, and Ludwik,
    sons, Zakrzewski, and [against] the Kalisz Land Court — to the Crown Tribunal of the Kingdom at Piotrków
    — as the copy in the submitted documents [attests].'

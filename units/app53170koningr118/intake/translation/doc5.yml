  en: 'Done in Konin, on Tuesday, next after the Feast of Saints Simon and Jude, Apostles, namely the
    30th day of the month of October, in the Year of the Lord 1781.


    On behalf of the Illustrious Chełmski, against the Illustrious Prusimski, Starost of Niszczewice,
    and others — a Report


    Let there be seen at this place a Report of the served Citation on behalf of the Illustrious Stanisław
    Chełmski, Treasurer of Wschowa, against the Illustrious Magnificent Antoni Prusimski, Starost of Niszczewice,
    for the Ordinary General Sessions of the Crown Tribunal of the Kingdom at Piotrków below-written —
    as the copy in the submitted documents stands.'

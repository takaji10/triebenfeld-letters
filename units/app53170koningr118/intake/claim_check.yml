app53170koningr118-001:
- {claim: "Unvollendeter Registervermerk im Buch des Burggerichts Konin, 1780: Bericht über eine Ladung vor das Tribunal, erwirkt von Stefan Zielonacki, Richter des Kalischer Landgerichts, und Stanisław Chełmski, Schatzmeister von Wschowa, gegen die Prusimski und die Bogdański", verdict: supported, where: "Ex parte MM Zielonacki Judicis Terrestris Calissiensis et Chełmski contra MM Prusimskie Bogdanskie ad Tribunal Relatio; leaf 172 verso (rulings.yml)"}
- {claim: "Der Vermerk bricht nach den Namen der Kläger ab", verdict: supported, where: "Videatur hoc loco ex parte Magnificorum Stephani Zielonacki ... et Stanislai Chełmski Thesaurarius Vschoven~: nothing follows"}

app53170koningr118-002:
- {claim: "Registervermerk von 1781: Bericht über die Ladung, die Stefan Zielonacki, Richter des Kalischer Landgerichts, gegen Antoni Prusimski, Starost von Niszczewice, zum Ortstermin auf dem Grund des Gutes Grab erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken", verdict: supported, where: "Relatio ex parte Magnifici Stephani Zielonacki Judicis Terrestris Calissien~ contra Illustrem Magnificum Antonium Prusimski Capitaneum Nieszczevicen~ pro Termino Condescensionis In Fundo Bonorum Grab agitt~ Inciden~ prout Copia in productis; leaf 266 verso (rulings.yml)"}

app53170koningr118-003:
- {claim: "Registervermerk über einen Protest, 1781: Antoni Ostroróg Prusimski, Starost von Niszczewice, Ritter des St.-Stanislaus-Ordens, Erbherr von Trąbczyn, Trąbczynek und Nowa Wieś, ist persönlich erschienen und protestiert vorsorglich gegen Stanisław Chełmski, Schatzmeister von Wschowa, Erbherr von Łukomia und Łomów; eine Abschrift liegt bei den vorgelegten Schriftstücken", verdict: supported, where: "in vim Diligentae Manifestatur; ex re et personali Comparitione Illustrissimus Magnifici Antonii Ostroróg Prusimski Capitanei Nieszczevicensis Insignis Sancti Stanislai Equitis Bonorum Trąpczyna Trąpczynka Nowey Wsi et Aliorum Haeredis In et contra Magnificum Stanislaum Chełmski Thaesaurarium Vschovensem Bonorum Łukomia Łomowa et Aliorum Haeredem prout Copia in productis; leaf 343 verso (rulings.yml)"}
- {claim: "Prusimski hat unterschrieben", verdict: supported, where: "Super manifestationem Antoni Ostrorog na Kolnie Prusimski"}

app53170koningr118-004:
- {claim: "Registervermerk vom 15. Oktober 1781: Bericht über die Ladung, die Antoni Prusimski, Starost von Niszczewice, gegen Kazimierz Zakrzewski und dessen Söhne Nepomucen, Ignacy und Ludwik sowie gegen das Kalischer Landgericht vor das Krontribunal in Petrikau erwirkt hat", verdict: supported, where: "Decima Quinta Mensis Octobris Anno Domini 1781; Relatio ex parte Illustris Magnifici Antonii Prusimski Capitanei Nieszczevicen~ contra Magnificos Casimirum Parentem Nepomucenum Ignatium et Ludovicum Filios Zakrzewski atque Judicium Terrestre Calissien~ ad Tribunal Regni Petricovien~"}

app53170koningr118-005:
- {claim: "Registervermerk vom 30. Oktober 1781: Bericht über die Zustellung der Ladung, die Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat", verdict: supported, where: "Die scilicet 30 Mensis 8bris Anno Domini 1781mo; Relatio positt~ Citationis ex parte Magnifici Stanislai Chełmski Thaesaurarii Vschoven~ contra Illustrem Magnificum Antonium Prusimski ... pro Judiciis Ordin~ Generalibus Tribunalis Regni Petricovien~"}

app53170koningr118-006:
- {claim: "Registervermerk von 1781: Bericht über die Ladung, die Ignacy Gałecki, Starost von Bromberg, und Michał Drogosław Skórzewski, Unterkämmerer von Posen, der frühere und der jetzige Erbherr von Biskupice, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt haben", verdict: supported, where: "Relatio ex Parte Illustris Magnifici Ignatii Gałecki Capitanei Bidgostien~ anteacti et Illustris Magnifici Michaelis Drogosław Skorzewski Succamerariuu Posnaniensis Praesentanei Bonorum Biskupice Haearedum contra Illustrem Magnificum Antonium Prusimski ... Tribunalis Regni Petricovien~; leaf 382 verso (rulings.yml)"}

app53170koningr118-007:
- {claim: "Registervermerk von 1781: Bericht über die Ladung, die Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat", verdict: supported, where: "Relatio in ex parte Magnifici Stanislai Scibor Chełmski Thesaurarii Vschoven~ contra Illustrem Magnificum Antonium Prusimski ... Tribunalis Regni Petricovien~; leaf 383 (rulings.yml)"}

app53170koningr118-008:
- {claim: "Protest vom 22. November 1781, auf Polnisch. Pater Tesselin Malechowski, Verwalter des Konvents von Ląd, erklärt im eigenen Namen und im Namen des ganzen Konvents gegen einen Vorwurf von Antoni Prusimski, Starost von Niszczewice", verdict: supported, where: "Die scilicet 22 Mensis 9bris Anno Domini 1781mo; Xiądz Tesselin Malechowski Rządca Konwentu Lędzkiego Swym y Całego tego Konwentu ... Imieniem czyniący, z Zarzutu przez Jasnie Wielmoznego Antoniego Prusimskiego Starosty Nieszczewickiego uczynionego oczyszczaiąc się Oświadcza"}
- {claim: "Im Grenzstreit mit Łukomia und Trąbczyn, der das Konventsgut Drzewce berührt, habe sich der Konvent bei der letzten Kommission von keiner Absprache und Begünstigung leiten lassen", verdict: supported, where: "Iz wsporach Granicznych z Dobrami Łukomiem Trąmpczynem, Dobr Drzewiec konwentskich dotykaiącemi się, podczas ostatniey odprawioney kommiszyi zadną zmową y sprzyianiem konwent nieunosił się"}
- {claim: "Er habe den Punkt, an dem die drei Gemarkungen Łukomia, Trąbczyn und Drzewce zusammenstoßen, so anerkannt, wie Chełmski ihn zeigte, aus den im Kommissionsdekret genannten Gründen, und bleibe dabei", verdict: supported, where: "schod trzech Dziedzin to iest Łukomia Trąmpczyna, y Wsi konwentskie Drzewiec y naroznika przez Wielmoznego Chełmskiego okazywany, konwent Lędzki przyznał tak z przyczyn w Dekrecie Kommiszyinym wyrazonych ... od uczynionego ... przyznania nieodstępuiąc"}
- {claim: "Der Konvent sei bereit, das zu beschwören, und werde wegen des Vorwurfs Strafen betreiben. Malechowski hat unterschrieben", verdict: supported, where: "gotowość nawet wykonania przysięgi tłomaczy, a za Zarzut uczyniony kar przyzwoitych ściągnięcia dochodzić przyrzeka; F Tesselinus Malechowski"}

app53170koningr118-009:
- {claim: "Registervermerk vom 4. Dezember 1781: Bericht über die Ladung, die Stefan Zielonacki, Richter des Kalischer Landgerichts, und Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, zum Ortstermin auf dem Grund des Gutes Grab erwirkt haben", verdict: supported, where: "Relatio ex Parte Magnificorum Stephani Zielonacki Judicis Terrestris Calissiensis et Stanislai Chełmski Thaesaurarii Vschoven~ contra Illustrem Magnificum Antonium Prusimski ... pro Termino Condescensionis in Fundo Bonorum Grab agitt~ inciden~; the heading of the sitting on leaf 397 verso (rulings.yml)"}

app53170koningr118-010:
- {claim: "Bericht des Gerichtsboten Simon Głabik von Drzewce, eingetragen in Konin im Januar 1782", verdict: supported, where: "Providus Simon Głabik de Drzewce Ministerialis Regni Generalis; leaf 416 (rulings.yml)"}
- {claim: "Er hat Antoni Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn, eine königliche Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am 4. Januar 1782, auf Betreiben von Abt Benedykt Lubstowski und dem Konvent von Ląd, Erbherren von Drzewce", verdict: supported, where: "Tibi Illustri Magnifico Antonio Prusimski Capitaneo Nieszczevicen~ Bonorum Trąpczyno Haeredi ... Ad Instantiam Illustrissimi Reverendissimi Ludovici Benedicti Lubstowski Sacri Ordinis Cystercien~ Conventus Landen~ Abbatis totiusque ejusdem Conventus Bonorum Drzewce Haeredum; Datum Petricoviae Die Quarta Januarii Anno Domini Millesimo Septingesimo Octuagesimo Secundo"}
- {claim: "Der Konvent will von dem Vorwurf der Absprache mit dem Erbherrn von Łukomia freigesprochen werden und beruft sich auf Tribunalsdekrete und die Besichtigung von 1592", verdict: supported, where: "se Actt~ ab Obiecto Condictamine ac [A?] cum Haerede Bonorum Łukomia attentis Documentis videlicet Decretis Tribunalitiis et Visione Anno Domini Millesimo Quingentesimo Nonagesimo Secundo per Eadem Decreta approbata liberos pronuntiari"}
- {claim: "Der Bote hat die Ladung im Gutshof von Trąbczyn hinterlegt", verdict: supported, where: "In Curia Bonorum Trąpczyn super Mensa hippi ... posuisse et notificatt~ reliquisse"}

app53170koningr118-011:
- {claim: "Registervermerk vom 18. März 1782: Das Dekret des Ortstermins über die zu Trąbczyn gehörende Olęder-Siedlung, ergangen zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa, wird zur Eintragung vorgelegt; das Original ist bei den vorgelegten Schriftstücken eingeheftet", verdict: supported, where: "Decima Octava Mensis Martii Anno Domini 1782; Oblata Decreti Condescensorialis in Hollandris ad Bona Trąpczyn specta~ Inter J Magnificum Antonium Prusimski Capitanei Nieszczevicen~ et Magnificum Stanislaum Chełmski Thaesaurarium Vschoven~ prolati prout Originale in productis insutt~"}

app53170koningr118-012:
- {claim: "Registervermerk vom 19. April 1782: Bericht über die Ladung, die Antoni Prusimski, Starost von Niszczewice, Ritter des St.-Stanislaus-Ordens, gegen Vater und Söhne Zakrzewski sowie gegen das Kalischer Landgericht vor das Krontribunal in Petrikau erwirkt hat", verdict: supported, where: "Decima Nona Mensis Aprilis Anno Domini 1782do; Relatio ex parte Illustris Magnifici Antonii Prusimski Capitanei Nieszczevicen~ Insignis Sancti Stanislai Equitis contra Magnificos Parentem et Filios Zakrzewskie atque Judicium Terrestre Calissien~ pro Judiciis Ordine~ Generalibus Tribunalis Regni Petricovien~"}

app53170koningr118-013:
- {claim: "Protest von Piotr Gosławski als Bevollmächtigtem von Antoni Prusimski, Starost von Niszczewice, gegen ein Dekret des Kalischer Landgerichts, eingetragen in Konin 1782 und von ihm unterschrieben", verdict: supported, where: "Plens~ JM Prusimski Capitanei Nieszczevicen~ contra Decretum Terreste Calissien~ Manifestatur; Generosus Petrus Gosławski Nomine Illustris Magnifici Antonii Prusimski ... qua Plens~; Petrus Gosławski; leaf 475 (rulings.yml)"}
- {claim: "Vor dem Landgericht in Konin habe sein Auftraggeber am 15. Oktober des Vorjahres ein Zeugnis von Franciszek Ksawery Kęszycki, Marschall des Krontribunals, vom 13. Oktober vorgelegt und um Aufschub gebeten", verdict: supported, where: "in Judiciis Terrestribus Palatinatus Calissien~ ... In Conin ... Die Decima Quinta Mensis Octobris Anno praeterito Celebratis per Plentem~ se sistens Attestatum ab Illustri Magnifico Francisco Xaviero Nałęcz Kęszycki Tribunalis Regni Mareschalco sub Die Decima Tertia Mensis Octobris Anno praeterito emanato reposuerat Dilationemque ... sibi Affectaverat"}
- {claim: "Das Landgericht habe das Zeugnis nicht beachtet und Aufschub und Antrag nicht zugelassen; der Vertreter habe sich, ohne Urkunden, zurückziehen müssen", verdict: supported, where: "tamen Judicium Terrestre Calissien~ minime attento praemisso attestato ... ac motionem per Sui Comparentem interpositam non admiserat ... Comparens Documentis Carens a Comparitione recedere Coactus extitit"}
- {claim: "Gosławski protestiert gegen das Landgericht und die Gegenpartei und kündigt an, die Aufhebung des Dekrets und der erwirkten Verurteilung zu betreiben", verdict: supported, where: "contra Judicium Terrestre Calissien~ atque Partem gravamina praemissa exportantem Iterum atque Iterum Manifestatur Offerendo sui Principalem ... Cassationemque Decreti ... ac Condemnationis Coactive Obtentae expostulaturum"}

app53170koningr118-014:
- {claim: "Bericht des Gerichtsboten Bartłomiej Wrzask von Sławsk, eingetragen in Konin 1782, für Stanisław Ścibor Chełmski, Schatzmeister von Wschowa", verdict: supported, where: "Providus Bartholomaeus Wrzask de Villa Sławsk Ministerialis Regni Generalis; Ad Instantiam Magnifici Stanislai Scibor Chełmski Thaesaurarii Vschoven~; leaf 495 verso (rulings.yml)"}
- {claim: "Er hat eine königliche Ladung zum Ortstermin auf dem Grund des Gutes Grab zugestellt, ausgestellt in Petrikau am 26. November 1781", verdict: supported, where: "pro Termino Cond~nis in Fundo Bonorum Grab agitt~ Inciden~; Datum Petricoviae Die Vigesima Sexta Mensis Novembris Anno Domini 1781mo"}
- {claim: "Geladen sind Antoni Prusimski, Starost von Niszczewice, sowie die Eheleute Bogdański: Ludwik, Landkämmerer von Kalisz, und Teresa, geborene Rozdrażewska, Erbin der Katarzyna Prusimska, geborene Rozdrażewska, Erbfrau von Grab", verdict: supported, where: "Vobis Illustri et Magnificis Antonio Prusimski ... tum Ludovico Camerario Terrestri Calissien~ et Thaeresiae de Rozdrzewskie olim Magnificae Catharinae itidem de Rozdrazewskiae ultimo voto Prusimska Bonorum Grab Haeredissae ... Succestrici seu Invicem Conjugibus Bogdanskie"}
- {claim: "Sie sollen am 3. Juni 1782 vor dem Gericht des Ortstermins erscheinen, das ein Dekret des Krontribunals angeordnet hat", verdict: supported, where: "Coram Nobis Judicioque Nostro Condescensoriali robore Decreti Tribunalis Regni Petricovien~ ... Die Tertia Junii in Anno praesen~ 1782 ... Compareatis"}
- {claim: "Chełmski verlangt die Zahlung der Summe, die der Kaufmann Tracholz ihm abgetreten hat, samt Zinsen; vier Untertanen aus Nowa Wieś sollen als Zeugen gestellt werden", verdict: supported, where: "intuitu Solutionis Summae a Honorato Tracholz Mercatore Sibi Actt~ Officiose Transfusae ... una cum provisionibu; Statuitionem Laboriosorum Alberti Siwy Andrea Ratay Casimiri Custodis Alberti Pastoris de Nowawieś ... pro deponendo Testimonio decerni"}
- {claim: "Der Bote hat die Ladung am Freitag, dem Vorabend von Mariä Empfängnis 1781, in Trąbczyn hinterlegt", verdict: supported, where: "In Bonis Trąbczyn super mensa hippi praesen~ Scriba Proventuali Feria 6ta In Vigilia Festi Immaculate Conceptionis Beatissime Virginis Mariae Anno Domini Millesimo Septingesimo Octuagesimo Primo posuisse"}

app53170koningr118-015:
- {claim: "Überschrift eines Eintrags vom 25. Mai 1782: Chełmski, Schatzmeister von Wschowa, protestiert gegen ein Dekret des Krontribunals. Der Text wurde nicht geschrieben", verdict: supported, where: "Die scilicet 25 Mensis Maii Anno Domini 1782; M Chełmski Thaesaurarii Vschoven~ contra Decretum Tribunalium Regni Manifestatur; nothing follows the heading, and the space under it is barred (intake/holding.py)"}
- {claim: "Darunter haben Piotr Gosławski als Bevollmächtigter, auf seine Nachfrage wegen des Platzes, und Stanisław Ścibor Chełmski unterschrieben", verdict: supported, where: "Petrus Gosławski quia Plenipotens Super requisitionem hujusce[?] Spatii manupropria; Stanisław Scibor Chełmski"}

app53170koningr118-016:
- {claim: "Registervermerk vom 1. Juni 1782: Bericht über die Ladung, die Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, zum Ortstermin auf dem Gut Grab erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken", verdict: supported, where: "Die scilicet Prima Mensis Junii Anno Ejusdem 1782; Relatio ex parte Illustris Magnifici Antonii a Kolno Prusimski Capitanei Nieszczevicen~ contra Magnificum Stanislaum Chełmski Thaesaurarius Vschoven~ pro Termino Cond~nis in Bonis Grab agitt~ Inciden~ prout Copia porrecta in productis extat"}

app53170koningr118-017:
- {claim: "Protest von Jakub Pomian Górski, Grenzkämmerer der Woiwodschaft Inowrocław, gegen Stanisław Ścibor Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, eingetragen in Konin im Juni 1782 und von ihm unterschrieben", verdict: supported, where: "Magnificus Jacobus Gorski Camerarius Palatinatus Junivladislav~ ... in et contra Magnificum Stanislaum Scibor Chełmski Thaesaurarium Vschoven~ Bonorum Łukom cum attinent~ Haeredem Manifestatur; Jacobus Pomian Gorski Came~ Granicial~ Palatinatus Junivladislav~; leaf 523 verso (rulings.yml)"}
- {claim: "Górski war, von Prusimski beigezogen, zum Ortstermin zwischen Trąbczyn Minus oder Nowa Wieś und Łukom erschienen, den das Krontribunal in Petrikau mit seinem Dekret vom 23. Januar des laufenden Jahres angesetzt hatte, um Grenzhügel zu errichten; das Tribunal hatte den Grenzstreit nach der Karte entschieden und über zwei einander widersprechende Kommissionsdekrete befunden", verdict: supported, where: "pro Termino Cond~nis Campestris Inter Bona Trąpczyn minoris seu Nowey wsi ... et Łukom ... per Decretum Tribunalitium Petricovien~ Post Commissoriale Feria Quarta post Festum Sanctae Agnetis Virginis et Martyris Die scilicet Vigesima Tertia Mensis Januarii Anno praesente ... post decisam ex Mappa~ Causam Granicialem et Resoluta bina Decreta Commissorialia Contrarie Sibi seu discrepanter prolata in Ordine Sipandorum Scopulorum assignatae ab Illustri Magnifico Prusimski Impetratus existens"}
- {claim: "Als er das Dekret nach der vom Tribunal in die Karte eingetragenen Linie vollziehen wollte, widersetzte sich Chełmski persönlich mit seinem Gefolge, stieß den Mann fort, der die Messkette zog, trat die Kette von der Linie, drohte und erklärte, er lasse eine weitere Berichtigung der Linie nicht zu", verdict: supported, where: "Lineam in Mappa~ per Tribunal Appositam ... Magnificus Chełmski Haeres Bonorum Łukomia solus in persona Sui cum Suis Assectis ... rebelliter obstitit hominemque Catenam Geometricam trahentem protrusit et Eandem ex linea pede ejecit minarique Cepit ... se ulteriorem meliorationem Lineae per Geometram et Suum Officium peragendam non admissurum Judicialiter se se declaravit"}
- {claim: "Górski brach die Amtshandlung ab, um beim Kriegsdepartement militärische Hilfe zu erwirken", verdict: supported, where: "ab Actu ulteriori ac Executione Effectuationeque Suprascripti Decreti Tribunalii supersedere debuit, et Fine Impetrandi Militaris ab Inclito Departamento Bellico Auxilii supersessit"}

app53170koningr118-018:
- {claim: "Registervermerk vom Juni 1782: Für Antoni Prusimski, Starost von Niszczewice, wird die Besichtigung eines Ortes auf Trąbczyner Erbgrund zur Eintragung vorgelegt, von zwei Adligen und einem Gerichtsboten auf Stempelpapier zu einem Silbergroschen aufgesetzt und von den Adligen eigenhändig unterschrieben; das Original liegt bei den vorgelegten Schriftstücken", verdict: supported, where: "Oblata Visionis Loci busto ad Bona Trąpczyn J Magnifici Antonii Prusimski Capitanei Nieszczevicen~ haeareditt~ per Duos Nobiles et Ministerialem in Papyro a Thaesauro Regni Gros~ unius argen~ Conscriptt~ manibusque Eorundem Nobilium propriis Subscriptt~ prout Originale extat in productis; leaf 526 verso (rulings.yml)"}

app53170koningr118-019:
- {claim: "Protest von Stanisław Ścibor Chełmski, Erbherr von Łukomia und Myszakowo, gegen Jakub Górski, Grenzkämmerer von Inowrocław, vom 15. Juni 1782, von Chełmski unterschrieben", verdict: supported, where: "scilicet 15 Mensis Junii, Anno Domini 1782; Magnificus Stanislaus Scibor Chełmski, Bonorum Łukomia Myszakowo cum attinen~ haeres ... contra Magnificum Jacobum Gorski Camerarium Granitialem Junivladislav~; Stanisław Scibor Chełmski"}
- {claim: "Vollziehende Ämter hätten Dekrete des Krontribunals zu vollziehen, nicht auszulegen", verdict: supported, where: "Officia Executiva Decreta queque singulariter Serenissimi Tribunalis Regni non Interpretari, sed exequi, nexu legum praecipue Constitutionis Anni 1768vi Obligatos esse,"}
- {claim: "Górski habe beim Ortstermin auf dem Grund von Trąbczyn die Regel des Tribunalsdekrets überschritten, sei vom Feldamt des Landes Dobrzyń abgewichen und habe sich in die Auslegung des Dekrets eingelassen", verdict: supported, where: "in Fundum Bonorum Trąbczyn Cond~nis Regula, Decreti Serenissimi Tribunalis Regni praescriptum excedendo et cum Officio itidem Campestri Terrae Dobrinen~ inconvenienter discrepando in interpretationem non tantum Decreti Tribunalii ... se se ingessit"}
- {claim: "Er habe Chełmski beschrieben, als hätte dieser sich widersetzt, seine Amtshandlung ohne Zustimmung der Parteien auf unbestimmte Zeit vertagt und seine Akten wegen militärischer Hilfe an das Kriegsdepartement des Immerwährenden Rates geschickt, statt die Sache an das Tribunal zu verweisen", verdict: supported, where: "ac si rebelliter circa Actum Campestrem se sisteret, circumscripsit, Actumque Suum ... non Consentientibus partibus nescitur ad quod tempus prorogavit ... loco Remissionis ad Tribunal Regni Causae ... pro Copiis Millitaribus ad Departamentum Consilii Permanentis bellicum, Acta Suo Remisit"}
- {claim: "Chełmski erklärt Górskis Handlung für nichtig", verdict: supported, where: "contra Eundem de nullitateque Actus ejus in quam Solennissima Juris forma Re et Manifestatur"}
- {claim: "Darunter ein Vermerk vom 16. August: Piotr Gosławski, Bevollmächtigter Prusimskis, hat vor Zeugen wegen des Platzes nachgefragt, für den keine Angaben und keine Abschrift geliefert worden waren", verdict: supported, where: "ad Requisitionem Partis videlicet Grosi Petri Gosławski qua Illustris Magnifici Antonii in Kolno Prusimski ... Plentis ... in Praesentia Generosorum Thomae Reczkowski et Sventoslai Bogusławski nec non Providi Mathaei Matuszkiewicz ... hujusce Spatii ob nondatam Informationem ad Inscriben~ et non porrectam Copiam Die Decima Sexta mensis Augusti facta requisitio"}

app53170koningr118-020:
- {claim: "Eintrag vom 16. August 1782. Piotr Gosławski, Bevollmächtigter von Antoni Prusimski, Starost von Niszczewice, fragt mit zwei Adligen in der Kanzlei, ob der Bericht über die Zustellung einer Ladung in Trąbczyn, die Stanisław Chełmski gegen Prusimski vor das Krontribunal in Petrikau erwirkt haben soll, vor dem Amt erklärt worden ist", verdict: supported, where: "Generosus Petrus Gosławski Illustris Magnifici Antonii Prusimski Capitanei Nieszczevicen~ Pler~s ... habitis secum Duobus Nobilibus ... ad Cancellariam praesen~ ... Requisivit ... utrum Relatio posit~ Citt~ In Bonis Trąpczyn, ex parte, Magnifici Stanislai Chełmski ... pro Judiciis Ordine~ Generalibus Tribunalis Regni Petricovien~ editt~ Coram Actis praesen~ Recognita est vel ne; the heading of the sitting on leaf 585 verso (rulings.yml)"}
- {claim: "Das Amt bescheinigt, dass ein solcher Bericht nicht vorliegt und nicht herausgegeben werden kann. Gosławski hat unterschrieben", verdict: supported, where: "de Inexistentia ejusdem Relationis Recognitae ac Impossibile Extradittne~ praesen~ attestatur; Petrus Gosławski"}

app53170koningr118-021:
- {claim: "Registervermerk von 1782: Bericht über die Ladung, die Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, und Jakub Górski, Grenzkämmerer von Inowrocław, vor das Krontribunal in Petrikau erwirkt hat", verdict: supported, where: "ex parte M Stanislai Chełmski Thesaurarii Vschoven~ contra J Magnificum Antonium Prusimski Capitaneum Nieszczevicen~ et Generosum Jacobum Gorski Camerarium Granicialum Junivladislav~ pro Judiciis ordinariis Generalibus Tribunalis Regni Petricovien~ editt~ Citationis Relatio in productis; leaf 617 (rulings.yml)"}

app53170koningr118-022:
- {claim: "Registervermerk vom September 1782: Bericht über die Zustellung der Ladung, die Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, gegen Jan Alojzy Orłowski, Kämmerer des Landes Dobrzyń, und gegen Abt Benedykt Lubstowski und den ganzen Konvent von Ląd vor das Krontribunal in Petrikau erwirkt hat", verdict: supported, where: "Relatio positt~ Citt~ ex parte Illustris Magnifici Antonii in Kolno Prusimski ... contra Magnificum Stanislaum Chełmski Thaesaurarium Vschovensem et Joannem Oloisium Orłowski Camerarium Terrae Dobrinensem nec non Illustrissimum et REverendissimum Benedictum Lubstowski Abbatem Claustralem Landensem seu totum Conventum Landensem pro Judiciis Ordine~ Generalibus Tribunalitatis Regni Petricovien~; leaf 622 (rulings.yml)"}

app53170koningr118-023:
- {claim: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 21. September 1782. Er hat drei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Montag nach St. Bartholomäus 1782", verdict: supported, where: "Vigesima Prima Mensis Septembris Anno Domini 1782; Providus Bartholomaeus Szepczyński de Villa Trąbczyn ... Citationes Litteras Authen~ unius ejusdemque essentiae trinas; Datum Petricoviae Feria Secunda post Festum Sancti Bartholomaei Apostoli proxima Anno Domini Millesimo Septingentesimo Octuagesimo Secundo"}
- {claim: "Geladen sind Kazimierz Zakrzewski, Landrichter von Brześć Kujawski, und seine Söhne Nepomucen, Ignacy und Ludwik aus der Ehe mit der verstorbenen Marianna Prusimska; deren Söhne erster Ehe Paweł und Józef Tomicki; Franciszek Tworowicz und Elżbieta, Frau von Jakub Taczanowski, Kinder der verstorbenen Wiktoria Prusimska; und Kunegunda Kołaczkowska, Tochter der verstorbenen Konstancja Prusimska und des Jan Kowalski", verdict: supported, where: "Vobis Magnificis Casimiro Judici Terrestri Braesten~ Cujaviae Parenti, Nepomuceno ... Ignatio ... et Ludovico ... Filiis Ejus Zakrzewskim cum ott~ Magnifica Marianna Prusimska ... tum Paulo et Josepho Tomickim ... nec non Francisco ... Elisabethi Magnifici Jacobi Taczanowski ... Consorti ... Tworowiczom ... cum ott~ Magnifica Victoria Prusimska ... tum quoque Cunegundae Kowalska Generosi Petri Kołaczkowski Consorti, ott~ Generosi Joannis Kowalski cum ott~ Generosa Constantia Prusimska procreatae Filiae"}
- {claim: "Geladen sind ferner die Amtsträger des Kalischer Landgerichts: der Richter Stefan Leszczyc Zielonacki, der Unterrichter Andrzej Bogdański, der Notar Xawery Mikorski und der Kämmerer Ignacy Rapacki", verdict: supported, where: "Magnificis Stephano Leszczyć Zielonacki Judici, Andreae Bogdański Subjudici, Xaverio Mikorski Notario nec non Ignatio Rapacki Camerario pro tunc Subdelegato Terrestribus Calissien~ gravaminosis Judicibus"}
- {claim: "Kläger ist Antoni Prusimski von Kolno, Starost von Niszczewice: Sohn des verstorbenen Stefan Prusimski und der Wiktoria Malczewska, Enkel von Krzysztof Prusimski und Teresa Golińska, Neffe von deren Söhnen Jan, Bogumił, Antoni und Paweł Prusimski und nach dem kinderlosen Tod von Antoni und Paweł deren einziger Rechtsnachfolger", verdict: supported, where: "Ad Instantiam Illustris Magnifici Antonii de Kolno Prusimski ... ott~ Magnifici Stephani Prusimski cum ott~ Magnificae Victoria Malczewska procreati Filii ott~ vero Magnificorum Christophori Prusimski et Theresiae Golińska Conjugum Nepotis, ott~ autem Magnificorum Joannis Bogumilli Antonii et Pauli Prusimskich, Suprascriptorum Christophori et Thaeresiae Golińska Conjugum Filiorum ... ac post fata Sterilia Magnificorum Antonii et Pauli Unici Naturalisque ac legitimi Successoris"}
- {claim: "Er beruft sich auf ein Tribunalsdekret von 1738, das den Eheleuten Kowalski die Erbfolge nach Jan und Bogumił Prusimski absprach, und auf dessen Bestätigung durch ein Dekret von 1760", verdict: supported, where: "Decreto Tribunalio Anni Millesimi Septingentesimi Trigesimi Octavi ... Inter ott~ Magnificos Joannem et Constantiam de Prusimskie Conjuges Kowalskie ab una et Magnificos Antonium Paulum et Stephanum Prusimskie ... Magnificos ott~ Kowalskie a Successione post ott~ Magnificos Joannem et Bogumillum Prusimskie steriliter demortuos praetensa abjudicanti, tum; Anni Millesimi Septingentesimi Sexagesimi ... Corroboranti, et approbanti"}
- {claim: "Er verlangt, die Dekrete des Landgerichts aufzuheben, ihn von dem Anspruch auf die Erbfolge nach Antoni und Paweł Prusimski freizusprechen und den Geladenen ewiges Schweigen aufzuerlegen: Töchter, die der Vater ausgestattet hat, könnten von den Brüdern nichts fordern", verdict: supported, where: "Decreto Terrestri Calissien~ ... Cassato ... ab Impetitione Vestri praetensaque indebita Successione post ott~ Magnificos Antonium et Paulum Prusimskie ... liberato ... Legisque Filiabus a Patre Exdotatis nil petere a Fratribus prohibentis ... perpetuumque Silentium Vobis in Causa praesenti interdici"}
- {claim: "Die Ausfertigungen wurden in den Gutshöfen von Zieleniec und Mostki und in Konin im Haus der Bürgerin Wiśniewska hinterlegt, wo die Kanzlei des Landgerichts ist", verdict: supported, where: "contra Magnificos Tomickie In Curia Bonorum Villae Zieleniec ... contra Magnificos Zakrzewskie In Curia Bonorum Villae Mostki ... contra Judicium Terrestre Calissien~ In Oppido Conin Domoque Famatae Wisniewska Civissae Coninen~ Cancellariaque Terrestri Calissien~"}

app53170koningr118-024:
- {claim: "Registervermerk vom September 1782: Bericht über die Ladung, die der Konvent von Ląd gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken", verdict: supported, where: "Mensis 7bris Anno Domini 1782; Relatio ex parte Venerabilis Conventus Landensis contra J Magnificum Antonium Prusimski Capitanei Nieszczevicen~ pro Judicium Ordine~ Generalis Tribunalis Regni Petricovien~ prout Copia extat in productis"}

app53170koningr118-025:
- {claim: "Bericht des Gerichtsboten Mateusz Matuszkiewicz von Szetlewek, eingetragen in Konin 1782", verdict: supported, where: "Providus Mathias Matuszkiewicz de Villa Szetlewko Ministerialis Regni Generalis; leaf 671 verso (rulings.yml)"}
- {claim: "Er hat Stanisław Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, und anderen eine Ladung vor das Burggericht Kalisz zugestellt, auf Betreiben von Antoni Prusimski von Kolno, Starost von Niszczewice: wegen der Strafen für verübte Gewalttaten samt der Festnahme von Leuten", verdict: supported, where: "Judiciis Castrensis Calissien~ ... ad Instantiam J Magnifici Antonii in Kolno Prusimski ... contra Magnificum Stanislaum Chełmski Thaesaurarium Vschoven~ Bonorum Łukom haeredem et alios Citt~ pro paenis r~ne attentatarum Violentiarum cum aresto hominum"}
- {claim: "Er hat sie im Gutshof von Łukom in Gegenwart des Geladenen hinterlegt", verdict: supported, where: "In Curia Bonorum Villae Łukom super armariolo hippi praesente Citto~ ... posuisse et Notificatt~ reliquisse"}

app53170koningr118-026:
- {claim: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 7. Dezember 1782, für Antoni Prusimski von Kolno, Starost von Niszczewice", verdict: supported, where: "Die Scilicet Septima Mensis Decembris Anno Domini 1782; Providus Bartholomaeus Szepczyński de Trąmpczyno ... Ad Instantiam et officiosam Requisitionem Illustris Magnifici Antonii in Kolno Prusimski"}
- {claim: "Mit zwei Adligen, Adam Milewski und Jan Wilgiewicz, war er am 4. des laufenden Monats im Trąbczyner Kiefernwald", verdict: supported, where: "Generosis Adamo Milewski et Joanne Wilgiewicz ... Die Quarta mensis et Anni Currentium ... in Borram ad Bona Trąmpczyn Spectantem Condescenderat"}
- {claim: "Links der Linie, die nach dem Dekret des Tribunals und des Ortstermins ausgehauen und mit Pflöcken bezeichnet ist, zählte er 221 gefällte Baukiefern, nach seiner Angabe am 28. November des laufenden Jahres von Leuten aus Łukomia, Łomów und anderen Gütern Chełmskis geschlagen und auf dessen Güter fortgeschafft, bis auf sieben Klötze", verdict: supported, where: "Sosien w Boru własnym do Dóbr Trąmpczyna nalezącym polewey Stronie wyciętey Linij, przez Dekret Trybunalski y ziazdowey widoczney y Kołkami wziemi Utkniętemi oznaczoney będącym Dwiescie dwadziescia i Jednę Budynkowych przez Ludzi z Dóbr Łukomia Łomowa y Innych WJmc Pana Stanisława Chełmskiego ... Dnia Dwudziestego Osmego Listopada, Roku biezącego ... sciętych ... pozabierane procz Siodmiu klocow"}
- {claim: "Nach seiner Angabe geschah es auf Befehl Chełmskis", verdict: supported, where: "de Jussu et Mandato Magnifici Chełmski Thesaurarii Vschoven~ peracta sint attestatus est"}

app53170koningr118-027:
- {claim: "Protest vom 7. Dezember 1782, auf Polnisch, von Leon Maszewski, Verwalter von Trąbczyn, auf Befehl seines Herrn Antoni Prusimski von Kolno, Starost von Niszczewice, der selbst nicht vor den Büchern erscheinen konnte, gegen Stanisław Chełmski, Schatzmeister von Wschowa, dessen Diener Jaroszewski und andere; Maszewski hat im Namen seines Herrn unterschrieben", verdict: supported, where: "Urodzony Leo Maszewski Dóbr Trąmpczyna ... Jasnie Wielmożnego Antoniego z Kolna Prusimskiego Starosty Nieszczewickiego Dziedzicznych Ekonom z Rozkazu tegoż JWielmożnego Pana Swego ... przeciw Wielmożnego Panu Stanisławowi Chełmskiemu Skarbnikowi ziemi Wschowskiey ... tudzież Urodzonemu Jaroszewskiemu Słudze Jego y Innym; Leon Maszewski Imieniem Pana mego; the heading of the sitting on leaf 673 (rulings.yml)"}
- {claim: "Chełmski wisse aus den Dekreten des Tribunals und des Ortstermins dieses Jahres, dass die Linie von der Ecke von Trąbczyn, Łukom und Drzewce bis zur Ecke mit Biskupice, vom Tribunal in die Karte gezogen und vom Geometer in Chełmskis Gegenwart im Gelände ausgehauen und abgepflockt, Trąbczyn von Łukomia scheidet", verdict: supported, where: "przez Dekreta Trybunalskie ... tudzież ziazdowe w Roku ninieyszym nastąpione, uwiadomiony ze Linia od Narozników Trąmpczyńskiego Łukomskiego y Drzewieckiego, do Węgła tychze Dóbr z Biskupicami przez nayiasnieyszy Trybunal, na Mappie wyciągniona, a na Groncie przez Geometrę w przytomności Samego WJMc Pana Chełmskiego ... wycięta oraz kołkami wytknięta oddziela Dziedziny Trampczyna od Dziedziny Łukomia,"}
- {claim: "Dennoch habe er seine Leute aus Łomów und Łukom, die der Protest mit Namen nennt, mit Schlitten, Pferden, Ochsen und Äxten in den Kiefernwald links der Linie geschickt, der zu Trąbczyn gehört; sie hätten eine große Zahl Kiefern gefällt und nach Łukomia gebracht", verdict: supported, where: "jako to Urodzonych Ignacego Jaroszewskiego Weynerskiego Pisarza ... z Saniami końmi wołmi z Siekierami y Innem narzędziami na bor sosnowy z Lewey strony linij prosto wyciętej Do Dóbr Trąmpczyna nalezący nasłał, którzy ... wielką Liczbę Sosien wycieli y Do Dóbr Łukomia z[a?]wiezli"}
- {claim: "Chełmskis Leute seien außerdem in Trąbczyn eingefallen, hätten Leute aus Trąbczyn auf der Straße angegriffen und andere Gewalttaten verübt", verdict: supported, where: "Ludzie tegoż WJm Pana Chełmskiego Dobra Trąmpczyn naiechali ... Ludzi z Trąmpczyna na drodze napastowali, y Inne gwaltownosci Swiadectwy dowiedzione poczynili"}

app53170koningr118-028:
- {claim: "Registervermerk vom Dezember 1782: Das Grenzdekret des Ortstermins zwischen den Gütern Trąbczyn und Łukom, ergangen zwischen Antoni Prusimski, Starost von Niszczewice, Stanisław Chełmski, Schatzmeister von Wschowa, und anderen, mit der Beschreibung der Grenzhügel, wird zur Eintragung vorgelegt und liegt bei den vorgelegten Schriftstücken", verdict: supported, where: "oblata Decreti Condescensorialis Granicialis Inter Illustrem Magnificum Antonium Prusimski Capitanei Nieszczevicen~ et Magnificum Stanislaum Chełmski Thesauararium Vschovensem et alios Inter bona Trąmpczyn et Łukom cum descriptione scopulorum prolati in productis; leaf 674 verso (rulings.yml)"}

app53170koningr118-029:
- {claim: "Registervermerk vom Dezember 1782: Für Antoni Prusimski, Starost von Niszczewice, liegt die Übergabe des Trąbczyner Olęders Martin Hunt bei den vorgelegten Schriftstücken, vorgenommen von Józef Łukaszewicz, Kommissar der großpolnischen Woiwodschaften", verdict: supported, where: "pro parte J Magnificis Antonii Prusimski Capitanei Nieszczevicen~ Honesti Martini Hunt Hollandri Trąmpczynen~ Traditio, per M Josephum Łukaszewicz Commissarum Palatinatus Majoris Poloniae peracta prout in productis extat; leaf 674 verso (rulings.yml)"}

# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  Twenty-nine entries from the register of the castle court at Konin, 1780
  to 1782: the Crown Tribunal's decree of January 1782 on the boundary of
  Trąbczyn and Łukomia carried out on the ground, with Chełmski's resistance
  to the surveyor; his suit on the Tracholz debt at Grab; the abbey of Ląd's
  defence against a charge of collusion; and the claim of the Zakrzewskis
  and other heirs to the estate of Antoni Prusimski's uncles.
title_de: >-
  Neunundzwanzig Einträge aus dem Register des Burggerichts Konin, 1780 bis
  1782: der Vollzug des Tribunalsdekrets vom Januar 1782 über die Grenze von
  Trąbczyn und Łukomia im Gelände, mit Chełmskis Widerstand gegen den
  Grenzkämmerer; seine Klage wegen der Forderung Tracholz in Grab; die
  Verteidigung der Abtei Ląd gegen den Vorwurf der Absprache; und der
  Anspruch der Zakrzewski und anderer Erben auf den Nachlass der Onkel von
  Antoni Prusimski.

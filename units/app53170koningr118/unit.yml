# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Twenty-nine entries from the register of the castle court of Konin for
  1780 to 1782, in Latin, three of them in Polish. Sixteen are one-line
  notes that a paper was brought in, most of them court messengers' reports
  of citations served between Antoni Prusimski of Trąbczyn, Stanisław Ścibor
  Chełmski of Łukomia, the land court judge Stefan Zielonacki, the abbey of
  Ląd and the Zakrzewski family. The longer entries: the abbey's protest
  that it did not collude with Chełmski at the boundary commission (22
  November 1781) and its citation of Prusimski (January 1782); a citation to
  a sitting on the ground at Grab on the Tracholz debt (served December
  1781); the protest of the boundary chamberlain Jakub Górski that Chełmski
  drove his surveyor off the line the Crown Tribunal had drawn (June 1782)
  and Chełmski's protest in reply (15 June 1782); Prusimski's citation of
  the Zakrzewskis and other heirs, which sets out his descent (21 September
  1782); and a report and a protest on 221 pines cut on the Trąbczyn side of
  the new line (7 December 1782).

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Entries of a court register of 1780 to 1782, in formulaic and heavily
  abbreviated Latin, three in Polish. The English is the editor's own
  translation. "Videatur hoc loco ... in Productis" notes that a paper is
  filed among those produced; "relatio" is a court messenger's report that
  he has served a citation; "condescensio" a sitting of a court or officer
  on the ground in dispute; "manifestatio" a protest; "oblata" a paper
  brought in to be entered; "Hollandri" are the Olęder settlers.

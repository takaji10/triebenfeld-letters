# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry on leaves 121 to 123 of a book of the castle court of Konin for
  1754 ("Relationes-oblatae"), in Polish with a Latin record at the end. On
  12 July 1754 the court messenger Bartłomiej Szeptycki of Trąbczyn reported
  that on Tuesday 9 July, at the request of Katarzyna Prusimska, born
  Rozdrażewska, widow of Paweł Prusimski, the King's chamberlain and heir of
  Trąbczyn, who held her dower and a life interest in his estates, he had
  inspected Trąbczyn and then the villages of Osiny, Łazy, Nowa Wieś, the
  Olęder settlement and the glassworks, and the woods. The inspection is
  entered in Polish: the manor buildings one by one with their state, the
  distillery and malthouse with their gear, the fifteen Olęder plots at Nowa
  Wieś, a count of the labour-owing people by village and class, and a
  statement signed by two noblemen on the felling of the best pine and oak.
  The house-by-house description of the villages in the middle of the entry
  is not transcribed.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  An inspection (wizja) of an estate of 1754 in Polish, in the building
  language of the time, with the Latin record of the court at Konin. The
  English is the editor's own translation, with the editor's notes on terms.
  "Wizja" here is an inventory made for the widow, not a boundary
  inspection; "kmieć" a full farmer, "półrolnik" a half-farmer, "chałupnik"
  a cottager, "komornik" and "komornica" a lodger; "olędrzy" settlers under
  Olęder law, "huba" their plot; "wybirki" what is left after the best trees
  are taken; "Huta" the glassworks; "Ministerialis Regni Generalis" the
  court messenger (woźny). Trąmpczyn is Trąbczyn.

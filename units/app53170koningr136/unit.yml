# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  An inspection of the Trąbczyn estate made on 9 July 1754 for the widow
  Katarzyna Prusimska, as the court messenger reported it to the castle court
  at Konin three days later: the buildings of the manor farm one by one, the
  Olęder settlers of Nowa Wieś, a count of the peasants who owed labour in
  four villages, and two noblemen's statement that the best timber of the
  estate's woods had been felled.
title_de: >-
  Eine Besichtigung des Gutes Trąbczyn vom 9. Juli 1754 für die Witwe
  Katarzyna Prusimska, so wie der Gerichtsbote sie drei Tage später dem
  Burggericht in Konin meldete: die Gebäude des Gutshofs eines nach dem
  anderen, die Olęder-Siedler von Nowa Wieś, eine Zählung der
  dienstpflichtigen Bauern in vier Dörfern und die Erklärung zweier Adliger,
  dass das beste Holz der Gutswälder gefällt sei.

app53170koningr136-001: "Bericht des Gerichtsboten Bartłomiej Szeptycki von Trąbczyn, am 12. Juli 1754 in die Akten des Burggerichts Konin eingetragen, mit der Besichtigung, die er am 9. Juli auf Verlangen der Katarzyna Prusimska, geborene Rozdrażewska, vorgenommen hatte. Sie ist die Witwe des kurz zuvor verstorbenen Paweł Prusimski, königlichen Kämmerers und Erbherrn von Trąbczyn, und hat an allen seinen Gütern ihr Leibgedinge und ein lebenslanges Nutzungsrecht. Die Besichtigung beschreibt die Gebäude des Gutshofs in Trąbczyn eines nach dem anderen: Das alte Herrenhaus ist nicht mehr zu reparieren, ein neues ist im Rohbau fertig; es folgen Küche, vier Scheunen, Schafstall, Speicher, Ställe, Brennerei und Mälzerei mit ihrem Gerät. In Nowa Wieś sitzen fünfzehn Olęder, die sechzehnte Hufe ist leer. Eine Aufstellung zählt die dienstpflichtigen Leute in Trąbczyn, Osiny, Łazy und Nowa Wieś nach Vollbauern, Halbbauern, Häuslern und Einliegern. Zwei Adlige, Kazimierz Świerczewski und Józef Puchalski, bezeugen mit ihrer Unterschrift, dass in den Kiefernwäldern von Trąbczyn von Osiny bis zur Grenze von Biskupice und um Łazy die besseren Stämme gefällt oder herausgesucht sind und nur Ausschuss steht, ebenso bei den Eichen, außer wo die Olęder das Holz auf ihren Hufen genommen haben. Die Beschreibung der Dorfhäuser im mittleren Teil des Eintrags ist nicht transkribiert."

app53170koningr119-001:
- {claim: "Bericht des Gerichtsboten Stanisław Stachowski von Łukomia, eingetragen in Konin im März 1783", verdict: supported, where: "Providus Stanislaus Stachowski de Villa Łukomie Ministerialis Regni Generalis; leaf 62 (rulings.yml)"}
- {claim: "Er hat eine Ladung des großpolnischen Generalstarosten Kazimierz Raczyński vom 10. März 1783 vor das Burggericht Kalisz zugestellt: an Antoni Prusimski, Starost von Niszczewice und Erbherrn von Trąbczyn, und an dessen Verwalter Leon Maszewski, auf Betreiben von Stanisław Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, und dessen Verwalter Ignacy Jaroszewski", verdict: supported, where: "Casimirus Nałęcz in Raczyno ... Raczyński Majoris Poloniae Generalis ... Capitaneus Vobis Illustri Magnifico Antonio Prusimski ... atque Generoso Leone Maszewski Bonorum Eorundem Economo ... Ad Instantiam Magnifici Ignatii Stanislai Chełmski Thaesaurarii Vschoven~ Bonorum Łukom et Aliorum haeredis et Generosi Ignatii Jaroszewski Eorundem Bonorum Economi; Datt~ in Castro Calissien~ Die Decima Mensis Martii Anno Domini Millesimo Septingentesimo Octuagesimo Tertio"}
- {claim: "Maszewski sei in den Kiefernwald eingefallen, den die Linie des nachkommissarischen Dekrets auf der Karte samt einem Olęder dem Gut Łukom belassen habe, und habe Chełmskis Leuten, die dort nur das nötige Holz holten, Ochsen, Wagen und Äxte abgenommen", verdict: supported, where: "Te Generosum Leonem Maszewski Borrae Linea, per Decretum Postcommissoriale ... in Mappa apposita, una cum Hollando pro re Bonorum Łukom Actt~ haereditt~ reservatae et relictae ... Invasorem Boum Currus et Securium hominibus Actt~, Borram Eandem Causa Evehendarum non nisi pro necessitate Arborum ingredientibus interceptt~"}
- {claim: "Genannte Leute aus Trąbczyn und Nowa Wieś werden mit der Ladung unter Arrest gestellt; auch Prusimski soll bestraft werden, falls die Gewalttaten auf seinen Befehl geschahen", verdict: supported, where: "cum Laboriosis Thoma Fryzyer Stanislao Lokay Joanne Wochnicki Sylvae Trąmpczynen~ Custodae Simone Jachowski Sylvae Nowawieś Itidem Custodae ... qui praesente Cittone~ apud Vos Arestantur ... distinctas quoque paenas et super Te J Magnifico Prusimski si Eaedem Violentae de mandato Tui executae esse apparuerint"}
- {claim: "Der Bote hat die Ladung im Vorwerk von Nowa Wieś hinterlegt", verdict: supported, where: "In Bonis Nowawieś Praedioque Ibidem Sitto~ ... posuisse et notificatt~ reliquisse"}

app53170koningr119-002:
- {claim: "Bericht des Gerichtsboten Jan Bekierski von Węgierce, eingetragen in Konin im März 1783", verdict: supported, where: "Providus Joannem Bekierski de Villa Węgierce Ministerialis Regni Generalis; leaves 62 verso and 63 (rulings.yml)"}
- {claim: "Er hat Antoni Prusimski, Starost von Niszczewice, eine Ladung des Generalstarosten vom 10. März 1783 vor das Burggericht Kalisz zugestellt, auf Betreiben von Stanisław Chełmski und dessen Verwalter Ignacy Jaroszewski", verdict: supported, where: "Sibi Illustrem Magnifico Antonio Prusimski Capitaneo Nieszczevicen~ ... Ad Instantiam Magnifici Stanislai Chełmski Thaesaurarii Vschoven~ Bonorum Łukomia Łomowa et Aliorum haeredis tum Generosi Ignatii Jaroszewski; Datum in Castro Calissien~ Die Decima Mensis Martii Anno Domini Millesimo Septingentesimo Octuagesimo Tertio"}
- {claim: "Prusimski soll bestraft werden wegen eines Einfalls mit Leuten und Hunden in das Gut Łomowo, das zu Chełmskis Hauptgut Łukom gehört, und wegen dort verübter Gewalttaten, und den Schaden ersetzen", verdict: supported, where: "Te paenis Respectu Bonorum Łomowo ad Principaliora Bona Łukom Sui Actt~ haereditt~ spectan~ cum querra hominum ac Canum Invasionis Ibidemque variarum Violentiarum ... perpetrationis Mulctan~ Censeri damna Compensanda injungi"}
- {claim: "Der Bote hat die Ladung bei den Olędern von Trąbczyn im Haus eines Mathias hinterlegt, in Gegenwart von dessen Frau", verdict: supported, where: "In Hollandis ad Principaliora Bona Trąmpczyn spectan~ Gazaque Honesti Mathiae ... super mensa hippi~ praesen~ Consorte Ejusdem"}

app53170koningr119-003:
- {claim: "Eintrag vom 18. März 1783. Der Gerichtsbote Stanisław Stachowski von Łukomia fragt im Namen von Stanisław Chełmski, Schatzmeister von Wschowa, ob die Berichte über zwei Ladungen, die Antoni Prusimski, Starost von Niszczewice, gegen Chełmski vor das Burggericht Kalisz erwirkt und nach Łukomia hat bringen lassen, vor dem Amt erklärt worden sind", verdict: supported, where: "18va Mensis Martii Anno Domini 1783; Stanislaus Stachowski ... Nomine et ex Speciali Commissio Magnifici Stanislai Chełmski ... Requisivit ab Officio praesenti, utrum Relationes Citationum binarum ex Parte Illustris Magnifici Antonii Prusimski ... contra Sui Requirentis Principalem Dominum pro Judiciis Castren~ Calissien~ editarum et ad Bona Łukomie exportatt~ Coram Actis praesen~ per Ministeriales Recognitae ... sunt vel ne"}
- {claim: "Das Amt hat das Register vom 26. November 1782 bis zu diesem Tag durchgesehen und nur einen Bericht vom 29. November gefunden, erklärt vom Gerichtsboten Matuszkiewicz von Podbiele; es bescheinigt, dass weitere nicht vorliegen", verdict: supported, where: "Reviso Protocollo Relationum ab Actu ... Vigesima Sexta Mensis Novembris Anni Immediate praeteriti Millesimi Septingentesimi Octuagesimi Secundi usque ad Actum Diei hodiernae ... nisi Unam Relationem Sub Actu ... Vigessima Nona Mensis et Anni Eisdem per Providum Mathieum Matuszkiewicz de Villa Podbiele ... non provenit, Ideo de inexistentia Earundem publicam facit fidem"}
- {claim: "Stachowski hat für sich und seinen Herrn unterschrieben", verdict: supported, where: "Stanisław Stachowski Wozny Swym y Pana Imieniem"}

app53170koningr119-004:
- {claim: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 18. März 1783", verdict: supported, where: "Providus Bartholomaeus Szepczyński de Villa Trąmpczyn Ministerialis Regni Generalis; the heading of the sitting at the top of the page (rulings.yml)"}
- {claim: "Er hat eine Ladung vor das Burggericht Kalisz zugestellt, die Antoni Prusimski von Kolno, Starost von Niszczewice, mit Leon Maszewski, Franciszek Liberacki und anderen gegen Stanisław Chełmski, Schatzmeister von Wschowa, und andere erwirkt hat", verdict: supported, where: "ex Parte et ad Instantiam Illustris Magnifici Antonii in Kolno Prusimski ... tum Generosorum Leonis Maszewski et Francisci Liberacki Aliorumque Actt~ In et Contra Magnificum Stanislaum Chełmski Thaesaurarium Vschoven~ Aliosque Cittos~"}
- {claim: "Er hat sie am Vortag im Gutshof von Łukom in Gegenwart des Geladenen hinterlegt", verdict: supported, where: "In Curia Bonorum Villae Łukom super mensa hippi~ praesente Citt~ Die haesterna Actum hornum praecedente posuisse"}

app53170koningr119-005:
- {claim: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 22. Mai 1783", verdict: supported, where: "Vigesima Secunda Mensis Maii Anno Domini 1783tio; Providus Bartholomaeus Szepczyński de Villa Trąmpczyn"}
- {claim: "Er hat Stanisław Chełmski, Schatzmeister von Wschowa, eine Ladung des Generalstarosten Kazimierz Raczyński vom 15. Mai 1783 vor das Burggericht Kalisz zugestellt, auf Betreiben von Antoni Prusimski von Kolno, Starost von Niszczewice", verdict: supported, where: "Casimirus Nałęcz de Raczyno et Matoszyno Raczyński Majoris Poloniae Generalis [d?] Capitaneus Tibi Magnifico Stanislao Chełmski Thaesaurario Vschoven~ ... Ad Instantiam Illustris Magnifici Antonii de Kolno Prusimski; Datum in Castro Calissien~ Die Decima Quinta Mensis Maii Anno Domini Millesimo Septingentesimo Octuagesimo Tertio"}
- {claim: "Es geht um eine Strafe von vierzehn polnischen Mark, die an die Kasse des Instigators des Krontribunals in Petrikau gezahlt wurde; das deswegen aus dem Strafregister gegen Prusimski erwirkte Verfahren soll aufgehoben und Prusimski freigesprochen werden", verdict: supported, where: "Penam Quatuordecem Marcarum Polonicalium ... ad Aerarium Instigatorii Judicii Tribunalis Regni Petricovien~ exolutt~ ... processumque super se Actt~ Eo nomine ex Regestro Penalium obtentum Cassari et se Actt~ liberum [prae/pro]nuntiari"}
- {claim: "Der Bote hat die Ladung im Gutshof von Łukom hinterlegt", verdict: supported, where: "In Curia Bonorum Villae Łukom super sella Atrii praesen~ Ephaebo ... posuisse et Notificatt~ reliquisse"}

app53170koningr119-006:
- {claim: "Bericht des Gerichtsboten Stanisław Stachowski von Łukomia, eingetragen in Konin im Mai 1783", verdict: supported, where: "Providus Stanislaus Stachowski de Villa Łukomie Ministerialis Regni Generalis; leaf 131 (rulings.yml)"}
- {claim: "Er hat eine Ladung vor das Burggericht Kalisz zugestellt, die Stanisław Chełmski, Schatzmeister von Wschowa, und andere gegen Antoni Prusimski von Kolno, Starost von Niszczewice, und andere erwirkt haben", verdict: supported, where: "ex Parte et ad Instantiam Magnifici Stanislai Chełmski Thaesaurarii Vschoven~ Aliorumque Actt~ In et contra Illustrem Magnificum Antonium In Kolno Prusimski Capitaneum Niesczevicen~ Aliosque Cittos~ ... posuisse et notificatt~ reliquisse"}
- {claim: "Er hat sie im Vorwerk von Nowa Wieś hinterlegt", verdict: supported, where: "In Bonis Nowawieś Praedioque Ibidem Sito super Scrinio hippi praesen~ Matre familias"}

app53170koningr119-007:
- {claim: "Protest von Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, eingetragen in Konin im Oktober 1783 und von ihm unterschrieben", verdict: supported, where: "Illustris Magnificus Antonius de Kolno Prusimski Capitaneus Nieszczevicen~ ... contra Magnificum Stanislaum Chełmski Thaesaurariam Vschoven~ ... infert~ querelam; Antoni Prusimski; leaf 304 verso (rulings.yml)"}
- {claim: "Chełmski habe ihn vor das Landgericht in Konin geladen, damit er Leute stelle, von denen einige in seinem Dienst stehen und andere bei ihm nicht zu finden sind, und damit er wegen einer angeblich verübten Gewalttat bestraft werde", verdict: supported, where: "a suprascripto Magnifico Chełmski pro statutione Hominum non nullorum Sibi inservientium Nonnullorum vero apud se venientem irreperibilium pro Judiciis Terrestribus in Conin Celebran~ pro paenis super statuendum acsi pro peracta violentia extenden~ concitatus"}
- {claim: "Prusimski erklärt: Sollte die Gewalttat von diesen Leuten begangen worden sein, so geschah sie ohne sein Wissen und ohne seinen Befehl; stellen könne er nur zwei der in der Ladung Genannten, Gregor und Thomas; die anderen habe der Arrest nicht erreicht", verdict: supported, where: "haec violentia si per Eosdem Homines peracta deducetur inscio veniente et sine mandato Ejus est facta et tantum modo Duos Homines Terminis Magnifici Chełmski Complexos videlicet Gregorium et Thomam statuere valet Alios vero arestum non praevenit"}
- {claim: "Er bietet an, sich auch durch Zeugenverhöre zu reinigen, und will wegen der unbegründeten Belästigung Strafen fordern", verdict: supported, where: "offert praesen~ querela etiam inquisitionibus se ab obiectis Magnifici Chełmski et quod Arestum praemissos Homines non praevenit Emundaturum et paenas respectu Indebite Vexe expetiturum velle"}

app53170koningr119-008:
- {claim: "Eintrag vom 15. September 1784. Leon Maszewski, Kommissar der Trąbczyner Güter, fragt im Namen von Antoni Prusimski von Kolno, Starost von Niszczewice, ob der Bericht über eine Ladung vor das Krontribunal in Petrikau, die Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, erwirkt hat und die am Donnerstag nach Mariä Geburt des laufenden Jahres nach Trąbczyn gebracht wurde, vor dem Amt erklärt worden ist", verdict: supported, where: "Decima Quinta Mensas Septembris Anno Domini 1784; Generosus Leo Maszewski Bonorum Tractus Trąmpczynen~ Commissarius Nomine ... Illustris Magnifici Antonii de Kolno Prusimski ... Relationem edittae Citationis pro Judiciis Ordinariis Generalibus Tribunalis Regni Petricovien~ ex parte Magnifici Stanislai Scibor Chełmski ... ad bona Trąmpczyn Feria Quinta post Festum Nativitis Beatissimae Virginis Maria Anno fluenti per Ministerialem exportatae utrum in Actis praesentibus recognitt~ reperitur vel ne"}
- {claim: "Das Amt hat sein Register durchgesehen und bescheinigt, dass ein solcher Bericht nicht vorliegt. Maszewski hat im Namen Prusimskis unterschrieben", verdict: supported, where: "Reviso Protocollo Relationum a Feria Quinta proxime praeterita. De inexistentia praefatae Relationis, publicam facit fidem; Leon Maszewski Imieniem JW Prusimskiego"}

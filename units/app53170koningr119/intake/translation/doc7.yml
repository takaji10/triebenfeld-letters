  en: 'His Honour Prusimski, Captain of Niszczewice, against the Right Honourable Chełmski — Manifest


    Appearing in person, the Illustrious Right Honourable Antoni of Kolno Prusimski, Captain of Niszczewice,
    Knight of the Distinguished Order of Saint Stanislaus — coming to the aid of his estate against any
    harm thereto, by force of all due diligence, brings before the present court against the Right Honourable
    Stanisław Chełmski, Treasurer of Wschowa, a complaint in the following manner:


    For, declaring: that as soon as he had been summoned by the above-mentioned Right Honourable Chełmski
    — for the stationing of certain men serving him and of others who, when coming to him, were untraceable
    — before the Land Court sessions in Konin, to have penalties imposed for the stationing, as though
    for a completed act of violence — immediately, explaining his innocence: that this violence, if it
    is shown to have been carried out by those same men, was done without his knowledge and without his
    mandate; and that he is only able to station two men seized at the Right Honourable Chełmski''s court
    sessions, namely Gregorius and Thomas; while the others the arrest did not reach; so that he may not
    therefore appear to suffer any harm from this, he presents this present complaint, and likewise declares
    himself ready for inquisitions against the objections of the Right Honourable Chełmski, and to clear
    himself that the arrest did not reach the aforementioned men; and that he wishes to seek penalties
    in respect of undue harassment, with all reservations preserved.


    Antoni Prusimski'

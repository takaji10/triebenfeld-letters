  en: 'Done in Konin on Wednesday next after the Feast of the Exaltation of the Holy Cross, being 15 September
    1784.


    On behalf of His Honour Prusimski, Captain of Niszczewice — Requisition


    To the office and present records of the Konin Municipal Court, appearing in person, the Honourable
    Leon Maszewski, Commissioner of the Trąmpczyn estate district, in the name and by special commission
    of the Illustrious Right Honourable Antoni of Kolno Prusimski, Captain of Niszczewice, heir of those
    same estates, his principal — requested of the present office and petitioned for the extraction of
    the relatio of the citation issued for the Ordinary General Sessions of the Piotrków Crown Tribunal,
    on behalf of the Right Honourable Stanisław Scibor Chełmski, Treasurer of Wschowa, to the estates
    of Trąmpczyn, exported by a court summoner on Thursday after the Feast of the Nativity of the Blessed
    Virgin Mary in the current year — whether it is found recognized in the present records or not.


    To which requisition the present office, granting it and having reviewed the Protocol of Relationes
    from the Thursday last past, makes public certification of the non-existence of the aforesaid relatio.


    Leon Maszewski, in the name of the Most Honourable Prusimski'

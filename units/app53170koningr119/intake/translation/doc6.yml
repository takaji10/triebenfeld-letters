  en: 'On behalf of the Right Honourable Chełmski, Treasurer of Wschowa, against His Honour Prusimski,
    Captain of Niszczewice — Report


    Appearing in person, the Honest Stanisław Stachowski of the village of Łukomia, General Royal Court
    Summoner, being sound, recognized that he had served authentic citation letters for the Kalisz Municipal
    Court sessions, next to be held at the Kalisz Municipal Court — on behalf and at the instance of the
    Right Honourable Stanisław Chełmski, Treasurer of Wschowa, and others as plaintiffs, against the Illustrious
    Right Honourable Antoni of Kolno Prusimski, Captain of Niszczewice, and others as cited parties —
    copies and substantive documents to be produced at the forthcoming session, similarly issued, with
    the lady of the household present, on this present day, the contents of the present act set down and
    left notified.'

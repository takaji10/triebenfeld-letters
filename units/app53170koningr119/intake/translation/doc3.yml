  en: 'Done in Konin on Tuesday next after the Quadragesimal Sunday Reminiscere, being 18 March 1783.


    Requisition of the Issued Citations — On behalf of the Right Honourable Chełmski, Treasurer of Wschowa


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Stanisław
    Stachowski of the village of Łukomia, General Royal Court Summoner, in the name and by special commission
    of the Right Honourable Stanisław Chełmski, Treasurer of Wschowa, heir of the estates of Łukomia with
    its appurtenances, his principal — requested of the present office whether the relationes of two citations
    issued on behalf of the Illustrious Right Honourable Antoni Prusimski, Starost of Niszczewice, heir
    of the estates of Trąmpczyn and others, against his requesting party''s principal, for the Kalisz
    Municipal Court sessions, and exported to the estates of Łukomia, had been recognized before the present
    records by the court summoner, and whether return dates had been attached to the same — or not.


    To which requisition the present office, granting it and reviewing the Protocol of Relationes from
    the act of Tuesday after the Feast of Saint Catherine, Virgin and Martyr, being 26 November 1782,
    up to the act of the present day, found within it only one relatio: under the act of Friday after
    the Feast of Saint Catherine, Virgin and Martyr, being 29 November of the same month and year, by
    the Honest Mateusz Matuszkiewicz of the village of Podbiele, General Royal Court Summoner, recognized,
    exported to the estates of Łukomia, and delivered bare without a return date by the present office
    — nothing further was found; and therefore makes public certification of the non-existence of the
    same.


    Stanisław Stachowski, court summoner, in his own name and in the name of his principal.'

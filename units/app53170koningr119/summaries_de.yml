app53170koningr119-001: "Bericht des Gerichtsboten Stanisław Stachowski von Łukomia, eingetragen in Konin im März 1783. Er hat eine Ladung des großpolnischen Generalstarosten Kazimierz Raczyński vom 10. März 1783 vor das Burggericht Kalisz zugestellt: an Antoni Prusimski, Starost von Niszczewice und Erbherrn von Trąbczyn, und an dessen Verwalter Leon Maszewski, auf Betreiben von Stanisław Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, und dessen Verwalter Ignacy Jaroszewski. Maszewski sei in den Kiefernwald eingefallen, den die Linie des nachkommissarischen Dekrets auf der Karte samt einem Olęder dem Gut Łukom belassen habe, und habe Chełmskis Leuten, die dort nur das nötige Holz holten, Ochsen, Wagen und Äxte abgenommen. Genannte Leute aus Trąbczyn und Nowa Wieś werden mit der Ladung unter Arrest gestellt; auch Prusimski soll bestraft werden, falls die Gewalttaten auf seinen Befehl geschahen. Der Bote hat die Ladung im Vorwerk von Nowa Wieś hinterlegt."
app53170koningr119-002: "Bericht des Gerichtsboten Jan Bekierski von Węgierce, eingetragen in Konin im März 1783. Er hat Antoni Prusimski, Starost von Niszczewice, eine Ladung des Generalstarosten vom 10. März 1783 vor das Burggericht Kalisz zugestellt, auf Betreiben von Stanisław Chełmski und dessen Verwalter Ignacy Jaroszewski. Prusimski soll bestraft werden wegen eines Einfalls mit Leuten und Hunden in das Gut Łomowo, das zu Chełmskis Hauptgut Łukom gehört, und wegen dort verübter Gewalttaten, und den Schaden ersetzen. Der Bote hat die Ladung bei den Olędern von Trąbczyn im Haus eines Mathias hinterlegt, in Gegenwart von dessen Frau."
app53170koningr119-003: "Eintrag vom 18. März 1783. Der Gerichtsbote Stanisław Stachowski von Łukomia fragt im Namen von Stanisław Chełmski, Schatzmeister von Wschowa, ob die Berichte über zwei Ladungen, die Antoni Prusimski, Starost von Niszczewice, gegen Chełmski vor das Burggericht Kalisz erwirkt und nach Łukomia hat bringen lassen, vor dem Amt erklärt worden sind. Das Amt hat das Register vom 26. November 1782 bis zu diesem Tag durchgesehen und nur einen Bericht vom 29. November gefunden, erklärt vom Gerichtsboten Matuszkiewicz von Podbiele; es bescheinigt, dass weitere nicht vorliegen. Stachowski hat für sich und seinen Herrn unterschrieben."
app53170koningr119-004: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 18. März 1783. Er hat eine Ladung vor das Burggericht Kalisz zugestellt, die Antoni Prusimski von Kolno, Starost von Niszczewice, mit Leon Maszewski, Franciszek Liberacki und anderen gegen Stanisław Chełmski, Schatzmeister von Wschowa, und andere erwirkt hat. Er hat sie am Vortag im Gutshof von Łukom in Gegenwart des Geladenen hinterlegt."
app53170koningr119-005: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 22. Mai 1783. Er hat Stanisław Chełmski, Schatzmeister von Wschowa, eine Ladung des Generalstarosten Kazimierz Raczyński vom 15. Mai 1783 vor das Burggericht Kalisz zugestellt, auf Betreiben von Antoni Prusimski von Kolno, Starost von Niszczewice. Es geht um eine Strafe von vierzehn polnischen Mark, die an die Kasse des Instigators des Krontribunals in Petrikau gezahlt wurde; das deswegen aus dem Strafregister gegen Prusimski erwirkte Verfahren soll aufgehoben und Prusimski freigesprochen werden. Der Bote hat die Ladung im Gutshof von Łukom hinterlegt."
app53170koningr119-006: "Bericht des Gerichtsboten Stanisław Stachowski von Łukomia, eingetragen in Konin im Mai 1783. Er hat eine Ladung vor das Burggericht Kalisz zugestellt, die Stanisław Chełmski, Schatzmeister von Wschowa, und andere gegen Antoni Prusimski von Kolno, Starost von Niszczewice, und andere erwirkt haben. Er hat sie im Vorwerk von Nowa Wieś hinterlegt."
app53170koningr119-007: "Protest von Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, eingetragen in Konin im Oktober 1783 und von ihm unterschrieben. Chełmski habe ihn vor das Landgericht in Konin geladen, damit er Leute stelle, von denen einige in seinem Dienst stehen und andere bei ihm nicht zu finden sind, und damit er wegen einer angeblich verübten Gewalttat bestraft werde. Prusimski erklärt: Sollte die Gewalttat von diesen Leuten begangen worden sein, so geschah sie ohne sein Wissen und ohne seinen Befehl; stellen könne er nur zwei der in der Ladung Genannten, Gregor und Thomas; die anderen habe der Arrest nicht erreicht. Er bietet an, sich auch durch Zeugenverhöre zu reinigen, und will wegen der unbegründeten Belästigung Strafen fordern."
app53170koningr119-008: "Eintrag vom 15. September 1784. Leon Maszewski, Kommissar der Trąbczyner Güter, fragt im Namen von Antoni Prusimski von Kolno, Starost von Niszczewice, ob der Bericht über eine Ladung vor das Krontribunal in Petrikau, die Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, erwirkt hat und die am Donnerstag nach Mariä Geburt des laufenden Jahres nach Trąbczyn gebracht wurde, vor dem Amt erklärt worden ist. Das Amt hat sein Register durchgesehen und bescheinigt, dass ein solcher Bericht nicht vorliegt. Maszewski hat im Namen Prusimskis unterschrieben."

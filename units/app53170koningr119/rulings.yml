# Editorial rulings for 53/17/0/-/Konin Gr.119 (APP).
#
# Eight documents, one for each entry of the register
# (docs/PRUSIMSKI_ERA_PLAN.md, "One document or many"). Which entry is which
# is in intake/holding.py. Established 2026-10-07.

places:

title: >-
  Eight entries from the register of the castle court at Konin, 1783 and 1784:
  the first quarrels after the boundary was marked, with citations by Chełmski
  and Prusimski before the castle court of Kalisz over a wood cut along the
  new line and an inroad at Łomowo, two searches of the register, and
  Prusimski's protest of October 1783 on the men he was to produce.

  Chełmskis und Prusimskis vor das Burggericht Kalisz wegen eines
  Holzeinschlags an der neuen Linie und eines Einfalls in Łomowo, zwei
  Nachsuchen im Register und Prusimskis Protest vom Oktober 1783 über die
  Leute, die er stellen sollte.

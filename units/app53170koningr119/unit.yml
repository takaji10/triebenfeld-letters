# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Eight entries from the register of the castle court of Konin for 1783 and
  1784, in Latin. Five are court messengers' reports of citations served
  between Stanisław Chełmski of Łukom and Antoni Prusimski of Trąbczyn before
  the castle court of Kalisz, three of them with the text of the citation:
  Chełmski charges Prusimski's steward Leon Maszewski with breaking into the
  wood that the Tribunal's line left to Łukom and taking oxen, carts and axes
  (10 March 1783), and Prusimski with an inroad at Łomowo; Prusimski asks to
  be relieved of a penalty of fourteen marks (15 May 1783). Two are searches
  of the register for reports of citation (18 March 1783, 15 September 1784).
  One is Prusimski's protest of October 1783 that an act of violence charged
  to his men was done without his knowledge and that he can produce only two
  of them.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Entries of a court register of 1783 and 1784, in formulaic and abbreviated
  Latin. The English is the editor's own translation. "Relatio" is a court
  messenger's report that he has served a citation; "requisitio" a request
  that the office search its records; "manifestatio" a protest; "statuere" to
  produce a person before the court; "Hollandus" an Olęder settler;
  "Capitaneus" is a starost.

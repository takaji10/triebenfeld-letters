# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Thirteen entries from a register of the castle court of Konin for 1778 and
  1779, in Latin, two with the thing seen described in Polish. Most belong
  to one lawsuit. Stanisław Ścibor Chełmski of Łukom had acquired from the
  townsman Jan Tracholz a claim arising from a contract for oak timber made
  in 1744 with Paweł Prusimski, uncle of Antoni Prusimski of Trąbczyn, and
  the Kalisz land court at Konin on 20 October 1777 ordered a sitting on the
  ground (condescensio) at Trąbczyn. The entries are the court messengers'
  reports of the citations each side served, Prusimski's two protests
  against Chełmski and the judges, and his citations of them before the
  Crown Tribunal at Piotrków (March and April 1778). Two protests by
  Chełmski of April 1778 attack the boundary decree that Prusimski's
  commissioners gave in 1775. Three entries concern trees: a boundary pine
  cut down by a neighbour (1778), pines cut by subjects of Rzgów and their
  axes taken (January 1779), and the protest of the owner of Rzgów (May
  1779). Two are one-line register notes.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Entries of a court register of 1778 and 1779, in formulaic and heavily
  abbreviated Latin. The English is the editor's own translation.
  "Condescensio" is a sitting of the court on the disputed ground; "relatio"
  a court messenger's report that he has served a citation; "manifestatio" a
  protest; "terminus prosecutorialis" a citation that carries a cause to the
  higher court; "Patruus" is the paternal uncle, Paweł Prusimski, and
  "Relicta Patrui" his widow, Katarzyna, born Rozdrażewska.

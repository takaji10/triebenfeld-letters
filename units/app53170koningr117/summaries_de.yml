# A finding aid, not part of the edition text.
app53170koningr117-001: "Bericht des Gerichtsboten Jan Jankowski von Łukom vom 7. März 1778. Er hat Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, eine königliche Ladung zugestellt: Prusimski soll zu dem Ortstermin (condescensio) erscheinen, den das Kalischer Landgericht in Konin mit seinem Dekret vom Montag nach St. Hedwig des Vorjahres angeordnet hat und der auf den Montag nach Invocavit auf dem Grund von Trąbczyn angesetzt ist, auf Betreiben von Stanisław Ścibor Chełmski, Erbherr von Łukom, als Kläger. Er soll dazu seine Untertanen Albert Livoy, Andrzej Rataj, Kazimierz den Hüter und Albert den Hirten von Nowa Wieś stellen. Die Ladung ist in Konin am Montag nach St. Matthias 1778 ausgestellt; der Bote hat sie im Gutsamt von Trąbczyn auf den Tisch gelegt."
app53170koningr117-002: "Bericht der Gerichtsboten Bartłomiej Szepczyński von Trąbczyn und Mateusz Matuszkiewicz von Szetlewek vom 30. März 1778. Sie haben zwei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Samstag nach Reminiscere 1778. Geladen sind Stanisław Chełmski, Erbherr von Łukomia, und die Richter des Kalischer Landgerichts: der Richter Franciszek Wierusz Walknowski, der Unterrichter Stefan Zielonacki und der Notar Xawery Mikorski, auf Betreiben Prusimskis. Das Dekret des Landgerichts vom 20. Oktober des Vorjahres, das dem früheren widerspreche, soll aufgehoben und die Sache an das Tribunal verwiesen werden; Prusimski verlangt, von der Forderung befreit zu werden, die Chełmski von Jan Tracholz erworben hat. Eine Ausfertigung wurde in Konin im Haus des Bürgers Palszewicz hinterlegt, die andere im Gutshof von Łukom."
app53170koningr117-003: "Protest von Antoni Prusimski, Starost von Niszczewice, eingetragen in Konin im März 1778: ein Vermerk mit seiner Unterschrift und, auf dem gegenüberliegenden Blatt, der Text nach einer vorbereiteten Abschrift. Er richtet sich gegen Stanisław Chełmski, Erbherr von Łukom, und gegen die Richter des Kalischer Landgerichts. Chełmski habe von dem Bürger Jan Tracholz eine unrechtmäßige Forderung erworben, die aus einem 1744 mit Prusimskis verstorbenem Onkel Paweł Prusimski geschlossenen Geschäft über Eichenholz stamme, und verfolge sie nun gegen ihn. Ihm fehlten die nötigen Urkunden: Sie lägen bei den Erben der Witwe seines Onkels, und er habe sie eingeklagt, aber noch nicht erhalten. Das Landgericht habe die Sache mit Tracholz früher auf einen Ortstermin mit diesen Erben verwiesen; dennoch sei auf Chełmskis Betreiben ein entgegengesetztes Dekret ergangen, das einen Ortstermin auf dem Grund von Trąbczyn anordnet. Prusimski erklärt dieses Dekret, ergangen in Konin am 20. Oktober des Vorjahres, für nichtig und protestiert gegen die Übertragung der Forderung auf Chełmski."
app53170koningr117-004: "Protest von Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, Erbherr von Łukomia, Łomów, Imielno und Bukowo, eingetragen in Konin im April 1778 und von ihm unterschrieben. Er beruft sich auf das Felddekret, das die von seiner Seite beigezogenen Kommissare 1775 zwischen Łukom und Trąbczyn erlassen haben: gestützt auf Urkunden und namentlich auf die Besichtigung von 1592, am letzten Grenzhügel mit benachbarten Zeugen bekräftigt und rechtzeitig zu den Akten der eigenen Woiwodschaft eingereicht. Dagegen sei die Handlung, die die von Prusimski beigezogenen Kommissare später, nach der Grenzziehung und nach Errichtung der Hügel, privat und mit größter Gunst abgefasst hätten, unrechtmäßig. Prusimski habe sie weder zu den Akten der eigenen Woiwodschaft eingereicht noch ihre Auflagen befolgt und sie damit selbst als ungültig behandelt. Damit sein Schweigen nicht als Anerkennung gelte, erklärt Chełmski sie für ungültig und kündigt an, ihre Aufhebung zu betreiben."
app53170koningr117-005: "Protest von Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, eingetragen in Konin im April 1778 und von ihm unterschrieben; die Überschrift nennt als Gegner einen Sokołowski, den der Text nicht erwähnt. Chełmski nimmt seine früheren Proteste auf: Das Grenzdekret zwischen seinem Łukom und Prusimskis Trąbczyn sei durch die von seiner Seite beigezogenen Kommissare nach der Besichtigung von 1592 und nach zwei Tribunalsdekreten von 1766 und 1768 ergangen, und die Grenzhügel seien errichtet. Prusimskis Kommissare hätten davon gewusst und dennoch ihre Befugnis missbraucht: Sie hätten Albert Czarnecki, Grenzkämmerer von Kalisz, den Prusimski angenommen hatte, die Besichtigung des Grenzzugs, die Errichtung der Hügel und die Abnahme des Eides überlassen. Czarnecki habe das Dekret erst einige Wochen nach der Abreise der Kommissare schreiben lassen. Prusimski habe Eid gegen Eid angeboten und als Mitschwörer einen selbst geladenen Nachbarn, einen Mann aus Czarneckis Dienst, der nie in der Gegend gewesen sei, und andere unbedeutende Leute herangezogen. Chełmski beschuldigt Prusimski all dessen und bietet an, es durch Zeugenverhör zu beweisen."
app53170koningr117-006: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn, eingetragen in Konin im April 1778, für Antoni Prusimski von Kolno, Starost von Niszczewice. Mit zwei Adligen, Piotr Gostarski und Tomasz Jachimowicz, war er am Samstag, dem 21. Februar des laufenden Jahres, an der Grenze von Trąbczyn. Dort sah er, dass eine mehrere Jahrzehnte alte Kiefer auf dem Grenzhügel, der Trąbczyn von Biskupie scheidet, mit drei Kreuzen als Grenzzeichen versehen, gefällt und weggeschafft war, nach seiner Angabe bei Nacht durch Herrn Bogusławski, Erbherrn eines Teils von Kurów."
app53170koningr117-007: "Protest von Antoni Prusimski von Kolno, Starost von Niszczewice, vom 15. April 1778, nach einer vorbereiteten Abschrift eingetragen und von ihm unterschrieben. Er richtet sich gegen Stanisław Chełmski und gegen Stefan Zielonacki, Unterrichter des Kalischer Landgerichts, wegen des vollen Landgerichts wie wegen des Ortstermins auf dem Grund von Trąbczyn. Prusimski verweist auf seinen Protest und seine Ladung gegen das Dekret des Landgerichts vom 20. Oktober des Vorjahres. Der Streit um die Herausgabe der Urkunden mit den Erben der Witwe seines Onkels Paweł Prusimski sei beim Tribunal anhängig; ohne diese Urkunden könne über die Forderung, die Chełmski von Jan Tracholz erworben hat, nicht entschieden werden. Der Unterrichter habe die Sache auf Betreiben Chełmskis an das volle Landgericht verwiesen, obwohl dieses vor das Tribunal geladen sei, und Prusimski damit unnütze Kosten verursacht; Prusimski erklärt diese Verweisung für nichtig."
app53170koningr117-008: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 15. April 1778. Er hat drei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Montag nach Laetare 1778: an Stanisław Chełmski, an den Richter Franciszek Wierusz Walknowski, an den Unterrichter Stefan Zielonacki, zugleich Richter des Ortstermins, und an den Notar Xawery Mikorski. Auf Betreiben Prusimskis soll die Sache an das Tribunal verwiesen und das Dekret vom 20. Oktober des Vorjahres aufgehoben werden; sie lasse sich nicht entscheiden ohne die Urkunden, die Prusimski von den Erben der Witwe seines Onkels, Katarzyna Prusimska, geborene Rozdrażewska, zurückfordert. Erweise sich daraus die Forderung von Tracholz und Chełmski als unrechtmäßig, soll die Übertragung aufgehoben werden; ergebe sich vielmehr eine Schuld von Tracholz gegenüber dem Onkel, soll Chełmski sie samt Zinsen zahlen. Die Ausfertigungen wurden in Trąbczyn, in Konin im Haus des Bürgers Paulszewicz, wo die Kanzlei des Landgerichts ihre Akten hat, und im Gutshof von Łukom hinterlegt."
app53170koningr117-009: "Bericht des Gerichtsboten Jan Jankowski von Łukom, eingetragen in Konin am 25. April 1778. Er hat Antoni Prusimski eine königliche Ladung vor das Kalischer Landgericht in Konin zugestellt, ausgestellt in Kalisz am Karfreitag 1778, auf Betreiben von Stanisław Chełmski, Erbherr von Łukomia. Prusimski soll das Dekret hören, mit dem das Gericht des Ortstermins in Trąbczyn die Sache an das volle Gericht verwiesen hat; Chełmski verlangt, dass ihm die von Jan Tracholz auf ihn übertragene Summe samt Zinsen und Kosten zugesprochen wird. Der Bote hat die Ladung im Gutsamt von Trąbczyn in Gegenwart des Verwalters hinterlegt."
app53170koningr117-010: "Registervermerk von 1778: Das Dekret, mit dem das Gericht des Ortstermins auf dem Grund von Trąbczyn die Sache zwischen Chełmski und Prusimski, Starost von Niszczewice, verwiesen hat, wird zur Eintragung vorgelegt. Der Vermerk verweist auf einen Text gegenüber unter dem Zeichen #."
app53170koningr117-011: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 29. Januar 1779, für Antoni Prusimski von Kolno, Starost von Niszczewice. Mit zwei Adligen war er am 23. des laufenden Monats in den Kiefernwäldern von Trąbczyn: Auf eigenem Trąbczyner Grund zählte er zwölf Stümpfe frisch gefällter Kiefern, hinter und zwischen den Grenzhügeln weitere, nach seiner Angabe von Untertanen des Gutes Rzgów geschlagen. Er legt dem Amt zwanzig Äxte vor, die an jenem Tag auf dem Grund von Szetlewek diesen Untertanen abgenommen wurden, als sie bei Nacht mit den Kiefern flohen, nimmt sie wieder an sich und quittiert dem Amt."
app53170koningr117-012: "Protest von Marcin Nosalski, Erbherr und Besitzer von Rzgów, eingetragen in Konin am 1. Mai 1779 und von ihm unterschrieben. Er legt ihn vorsorglich ein, damit ihm die Aussagen von Bartłomiej Szepczyński und Mateusz Wąchnicki in seiner Sache mit Prusimski vor dem Kalischer Landgericht in Konin nicht schaden. Die beiden hätten auf Befehl von Tomasz Joachimowicz seine Leute, die auf Schlitten Bäume aus den Erbwäldern Chełmskis fuhren, auf öffentlicher Straße angehalten, geschlagen, mit den Schlitten nach Trąbczyn gebracht und ihnen die Äxte mit Gewalt abgenommen. Nosalski protestiert gegen sie als Urheber der Gewalt, bietet an, die Gewalttaten durch Zeugenverhör zu beweisen, und will sie vom Zeugnis in dieser Sache ausschließen lassen."
app53170koningr117-013: "Registervermerk von 1779: Eine Abschrift des Protests, den Prusimski gegen die Nosalski eingelegt hat, liegt bei den vorgelegten Schriftstücken. Antoni Prusimski, Starost von Niszczewice, hat unterschrieben."

# The claim check of the German summaries of APP 53/17/0/-/Konin Gr.117, made
# in session on 2026-10-07 under the rules read_letters.py --verify gives its
# checker: each statement held to the document, as supported, overstated or
# unsupported, and the summary then only weakened or cut, never added to. Not
# the paid run; there is no reading.json. The documents were read in the
# Latin and Polish of corpus.txt. That text had only the light check then,
# and each statement about the long entries (2, 3, 4, 5, 7, 8, 9) was held
# to words that were not in doubt. After the full check of the same day the
# statements were held to the corrected text again: all stand. One was made
# fuller, because the text now says it: the decree of 1775 was confirmed
# "by oath" at the last mound (document 4). The Latin quoted below is the
# corrected text.
#
# Result: 54 statements, all supported. The dates of documents 3, 4, 5, 6, 10
# and 13 are the edition's inference, stated as such in rulings.yml.

app53170koningr117-001:
- {claim: "bericht des Gerichtsboten Jan Jankowski von Łukom vom 7. März 1778", verdict: supported, where: "Actum in Conin Sabbatho post Cineres proximo Die Scilicet 7ma Mensii Martii Anno Domini 1778uo; Providus Joannes Jankowski de villa Łukom Ministerialis Regni Generalis"}
- {claim: "er hat Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, eine königliche Ladung zugestellt: Prusimski soll zu dem Ortstermin (condescensio) erscheinen, den das Kalischer Landgericht in Konin mit seinem Dekret vom Montag nach St. Hedwig des Vorjahres angeordnet hat und der auf den Montag nach Invocavit auf dem Grund von Trąbczyn angesetzt ist, auf Betreiben von Stanisław Ścibor Chełmski, Erbherr von Łukom, als Kläger", verdict: supported, where: "Tibi Magnifico Antonio de Kolno Prusimski ... mandamus ut In Termino Condescensionis vi Decreti Terrestris Calissiensis in Conin Feria Secunda post Festum Sanctae Haedvigis Viduae Electae Anno Immediate Elapso Lati in et pro Feria Secunda post Dominicam Invocavit Quadragesimalem ad Fundum Bonorum Trąmpczyn designato personaliter ... Compareas ad Instantiam Magnifici Stanislai Sciborż Chełmski Bonorum Łukom cum attinentis Haeredis Actoris"}
- {claim: "er soll dazu seine Untertanen Albert Livoy, Andrzej Rataj, Kazimierz den Hüter und Albert den Hirten von Nowa Wieś stellen", verdict: supported, where: "Quatenus Tu ... Laboriosos Albertum Livoy Andream Ratay Casimirum Custodem Albertum pastorem de Nowawieś de bonis Tuis Subditos qui praesenti Cittone~ apud Te Arestantur Statuas"}
- {claim: "die Ladung ist in Konin am Montag nach St. Matthias 1778 ausgestellt; der Bote hat sie im Gutsamt von Trąbczyn auf den Tisch gelegt", verdict: supported, where: "Dato in Conin Feria 2da post Sancti Matthiae Apostoli proxima Anno Domini 1778 in officina Bonorum villae Trąmpczyn super mensa ... posuisse et reliquisse"}

app53170koningr117-003:
- {claim: "protest von Antoni Prusimski, Starost von Niszczewice, eingetragen in Konin im März 1778: ein Vermerk mit seiner Unterschrift und, auf dem gegenüberliegenden Blatt, der Text nach einer vorbereiteten Abschrift", verdict: supported, where: "M. Prusimski contra M. Chełmski et Judicium Condescensoriale Manifestur ... facta Manifestatio ex opposito Inserta. Super Manifestationem Antonii Prusimski; Ex parata Copia; leaf 54 verso above the heading of 30 March 1778 (rulings.yml)"}
- {claim: "er richtet sich gegen Stanisław Chełmski, Erbherr von Łukom, und gegen die Richter des Kalischer Landgerichts", verdict: supported, where: "in et Contra Magnificum Stanislaum Chełmski Bonorum Łukom Haeredem simulque contra Judicium Terrestre Calissiens[i?] Causae Infrascriptae Gravaminosos Judices Manifestatur"}
- {claim: "Chełmski habe von dem Bürger Jan Tracholz eine unrechtmäßige Forderung erworben, die aus einem 1744 mit Prusimskis verstorbenem Onkel Paweł Prusimski geschlossenen Geschäft über Eichenholz stamme, und verfolge sie nun gegen ihn", verdict: supported, where: "Jus illegale a Famato Joanne Tracholz ex re trabium seu silvae Quercineae adhuc in Anno 1744to apud olim Magnificum Paulum Prusimski, sui Manifestantis Patruum Contractae, sibi per Eum firmatum et usurpatum ... in rem et personam sui querere"}
- {claim: "ihm fehlten die nötigen Urkunden: Sie lägen bei den Erben der Witwe seines Onkels, und er habe sie eingeklagt, aber noch nicht erhalten", verdict: supported, where: "Manifestans inermis et absque Documentis in Manibus Succon~m olim Relictae Patrui Sui haerentibus, processuque per Ma~antem vindicatis et Eo usque non receptis"}
- {claim: "das Landgericht habe die Sache mit Tracholz früher auf einen Ortstermin mit diesen Erben verwiesen; dennoch sei auf Chełmskis Betreiben ein entgegengesetztes Dekret ergangen, das einen Ortstermin auf dem Grund von Trąbczyn anordnet", verdict: supported, where: "Causa cum Eodem Famato Tracholz Juris datore ejus, ad Terminum ... Condescensionum cum Successoribus Relictae viduae Patrui sui designato, per decretum Judicii Terrestris Calissiens[is?] est remissa,; aliud Diversum et Contrarium priori Decretum injunctae Condescensionis in Fundum Bonorum Trąmpczyno"}
- {claim: "Prusimski erklärt dieses Dekret, ergangen in Konin am 20. Oktober des Vorjahres, für nichtig und protestiert gegen die Übertragung der Forderung auf Chełmski", verdict: supported, where: "de nullitate ac insubsistentia Decreti ejusdem Terrestris Calissien[sis?] In Conin Feria 2da post Festum Sanctae Haedvigis Viduae Electae Dei Die videlicet Vigesima Octobris Anno praeterito ... prolati ... Simulque etiam et Transfusioni Seu Juris illegalis per Magnificum Chełmski a Famato Tracholtz quaesiti ... Manifestatur"}

app53170koningr117-002:
- {claim: "bericht der Gerichtsboten Bartłomiej Szepczyński von Trąbczyn und Mateusz Matuszkiewicz von Szetlewek vom 30. März 1778", verdict: supported, where: "Actum in Conin Feria Secunda post Dominicam Laetare Quadragesimalem proxima Die Scilicet Trigesima Mensis Martii Anno Domini 1778uo; Providi Bartholomaus Szepczyński de villa Trąmpczyn et Mathaus Matuszkiewicz de villa Szetlewek"}
- {claim: "sie haben zwei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Samstag nach Reminiscere 1778", verdict: supported, where: "Citt~ Litt~ Authen~ pro Judiciis Ordinariis Generalibus Tribunalis Regni Petricoviensi ... binas; Dato Petricoviae Sabbato post Dominicam Reminiscere Quadragesimalem Anno Domini 1778uo"}
- {claim: "geladen sind Stanisław Chełmski, Erbherr von Łukomia, und die Richter des Kalischer Landgerichts: der Richter Franciszek Wierusz Walknowski, der Unterrichter Stefan Zielonacki und der Notar Xawery Mikorski, auf Betreiben Prusimskis", verdict: supported, where: "Vobis Magnificis Stanislao Chełmski Bonorum Łukomia Haeredi atque Francisco Wierusz Walknowski Judici Stephano Zielonacki Subjudici Xaverio Mikorski Notario Terrestribus Calissiens[i?] ... ad Instantiam Magnifici Antonii a Kolno Prusimski"}
- {claim: "das Dekret des Landgerichts vom 20. Oktober des Vorjahres, das dem früheren widerspreche, soll aufgehoben und die Sache an das Tribunal verwiesen werden; Prusimski verlangt, von der Forderung befreit zu werden, die Chełmski von Jan Tracholz erworben hat", verdict: supported, where: "Decreti vestri posterioris Feria 2da post Festum Sanctae Haedvigis ... scilicet Die 20 8bris, anno praeterito ... Contrarium priori ... Causam pro resolutione ejusdem Decreti, ad Tribunal Remitti, ... Jure illegali per M Chełmski a Famato Joanne Tracholz ... se Acto ab Impetione hac liberari"}
- {claim: "eine Ausfertigung wurde in Konin im Haus des Bürgers Palszewicz hinterlegt, die andere im Gutshof von Łukom", verdict: supported, where: "Primam et quidem Providus Szepczyński in oppido Konin Domoque Famatis Palszewicz ... alteram P Matuszkiewicz contra M Chełmski in Curia Bonorum villae Łukom"}

app53170koningr117-004:
- {claim: "protest von Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, Erbherr von Łukomia, Łomów, Imielno und Bukowo, eingetragen in Konin im April 1778 und von ihm unterschrieben", verdict: supported, where: "Magnificus Stanislaus Scibor Chełmski Thesaurarius Vschovensius Bonorum Łukomia, Łomova, Imielno et Bukowo aliorumque eo Attinen~ haeres; Stanisław Scibor Chełmski; leaf 57 verso, between the headings of 1 and 3 April 1778 (rulings.yml)"}
- {claim: "er beruft sich auf das Felddekret, das die von seiner Seite beigezogenen Kommissare 1775 zwischen Łukom und Trąbczyn erlassen haben: gestützt auf Urkunden und namentlich auf die Besichtigung von 1592, am letzten Grenzhügel mit benachbarten Zeugen durch Eid bekräftigt und rechtzeitig zu den Akten der eigenen Woiwodschaft eingereicht", verdict: supported, where: "Decretum Campestre per Commissarios pro parte venientis impetratos Anno 1775 inter bona Łukom ... et bona Trąmpczyn ... in fundamento Documentorum et signanter Visionis Anno 1592 ... in ultimo scopulo cum vicinis Testibus expleto Authorisatum, et Ad Acta proprii Palatinatus in tempore per Oblatam porrectum"}
- {claim: "dagegen sei die Handlung, die die von Prusimski beigezogenen Kommissare später, nach der Grenzziehung und nach Errichtung der Hügel, privat und mit größter Gunst abgefasst hätten, unrechtmäßig", verdict: supported, where: "Actum quendam Campestrem per Commissarios ab JMcus~ Prusimski Capitaneo Nieszczevicen~ conductos privatim cum summo fauore ... posterius jam post dislimitationem praefatam post erectos scopulos ... conscriptum illegalem esse"}
- {claim: "Prusimski habe sie weder zu den Akten der eigenen Woiwodschaft eingereicht noch ihre Auflagen befolgt und sie damit selbst als ungültig behandelt", verdict: supported, where: "nec ad Acta proprii Palatinatus porrigi curasse, nec rigores eodem illegali Actu praescriptos attentasse, taliterque Solummet JM Prusimski Eundem Actum ... pro invalibili agnovisse"}
- {claim: "damit sein Schweigen nicht als Anerkennung gelte, erklärt Chełmski sie für ungültig und kündigt an, ihre Aufhebung zu betreiben", verdict: supported, where: "ne tamen taciturnitate illegalitatem praemissi ... actus Acceptare videatur ... de insubsistentia et invaliditate ... Manifestatur, Offerendo se Cassationem illique expetiturum"}

app53170koningr117-005:
- {claim: "protest von Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, eingetragen in Konin im April 1778 und von ihm unterschrieben; die Überschrift nennt als Gegner einen Sokołowski, den der Text nicht erwähnt", verdict: supported, where: "M Chełmski contra Magnificum Sokołowski Manifestatur; Stanisław Scibor Chełmski; leaf 58 (rulings.yml)"}
- {claim: "Chełmski nimmt seine früheren Proteste auf: Das Grenzdekret zwischen seinem Łukom und Prusimskis Trąbczyn sei durch die von seiner Seite beigezogenen Kommissare nach der Besichtigung von 1592 und nach zwei Tribunalsdekreten von 1766 und 1768 ergangen, und die Grenzhügel seien errichtet", verdict: supported, where: "Reassumendo anteriores Manifestationes ... Decretum Campestre Graniciale inter Bona sui Łukom, Trąmpczyn JMci~ Prusimski ... per Commissarios pro parte vn~tis conductos ad tenorem Visionis Anni 1592 ... Decretis binis Tribunalibus Annorum 1766 et 1768 ... Scopulosque ... erectos"}
- {claim: "Prusimskis Kommissare hätten davon gewusst und dennoch ihre Befugnis missbraucht: Sie hätten Albert Czarnecki, Grenzkämmerer von Kalisz, den Prusimski angenommen hatte, die Besichtigung des Grenzzugs, die Errichtung der Hügel und die Abnahme des Eides überlassen", verdict: supported, where: "Commissarii pro parte JM Prusimski potestate sui abutentes, Magnifico Alberto Czarnecki Camerario Graniciali Calissiensi ... per JMcum~ Prusimski ... conducto lustrationem ductus sipationem scopulorum pro commiserunt[?] tam ad excipiendum a parte super realitatem ductuum juramentum ... admiserunt"}
- {claim: "Czarnecki habe das Dekret erst einige Wochen nach der Abreise der Kommissare schreiben lassen", verdict: supported, where: "Qui M Camerarius prolibitu sui jam post Abscessum JMcorum~ Commissariorum aliquot Septimanarum interstitio Decretum conscribi curaverat"}
- {claim: "Prusimski habe Eid gegen Eid angeboten und als Mitschwörer einen selbst geladenen Nachbarn, einen Mann aus Czarneckis Dienst, der nie in der Gegend gewesen sei, und andere unbedeutende Leute herangezogen", verdict: supported, where: "Juramentum contra Juramentum offerre ... praesumpsit, testesque ad simile cum Eodem praestandum Juramentum unum ex collateralitate ad Citatum ... tertium in Servitiis Magnifici Czarnecki existentem ... nec in his oris unquam existentem, ac alios inconsiderabiles adsciverat"}
- {claim: "Chełmski beschuldigt Prusimski all dessen und bietet an, es durch Zeugenverhör zu beweisen", verdict: supported, where: "JMcum~ Prusimski rne~ horum Omnium incusat et si opus fuerit etiam Inquitionibus praemissa probaturum et deducturum se Offert~"}

app53170koningr117-006:
- {claim: "bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn, eingetragen in Konin im April 1778, für Antoni Prusimski von Kolno, Starost von Niszczewice", verdict: supported, where: "Providus Bartholomaus Szepczyński de villa Trąmpczyn Ministerialis Regni Generalis ... ad officiosam Requisitionem Magnifici Antonii a Kolno Prusimski Capitanei Nieszczevicensis; leaf 58 verso, above the heading of 3 April 1778 (rulings.yml)"}
- {claim: "mit zwei Adligen, Piotr Gostarski und Tomasz Jachimowicz, war er am Samstag, dem 21. Februar des laufenden Jahres, an der Grenze von Trąbczyn", verdict: supported, where: "habitis secum Duobus Nobilibus videlicet Generosis Petro Gostarski et Thoma Jachimowicz ... sabbato post Dominicam 7mae proxima die Scilicet 21 Mensis Februarii Anno nunc Currenti, in locum granicialem Bonorum Trąmpczyna ... Condescendit"}
- {claim: "dort sah er, dass eine mehrere Jahrzehnte alte Kiefer auf dem Grenzhügel, der Trąbczyn von Biskupie scheidet, mit drei Kreuzen als Grenzzeichen versehen, gefällt und weggeschafft war, nach seiner Angabe bei Nacht durch Herrn Bogusławski, Erbherrn eines Teils von Kurów", verdict: supported, where: "Widział sosnę od Lat Kilku dziesiąt na Kopcu [T?]urnata zwanym Granicznym Trąmpczyn od Biskupia Dzielącym[?] wyrostą trzema Krzyzami czyli znakami Granicznemi oznaczoną Przez Im~ Pa~ zas Bogusławskiego z Dobr Częsci Kurowa Dziedzica w nocnym Czasie sciętą y zabraną"}

app53170koningr117-007:
- {claim: "protest von Antoni Prusimski von Kolno, Starost von Niszczewice, vom 15. April 1778, nach einer vorbereiteten Abschrift eingetragen und von ihm unterschrieben", verdict: supported, where: "Actum in Conin Feria Quarta post Dominicam Ramis Palmanim Quadragesimalem proxima Scilicet Die 15 Mensis Aprilis Anno Domini 1778uo; Exparata Copia; Antoni Na Kolnie Prusimski"}
- {claim: "er richtet sich gegen Stanisław Chełmski und gegen Stefan Zielonacki, Unterrichter des Kalischer Landgerichts, wegen des vollen Landgerichts wie wegen des Ortstermins auf dem Grund von Trąbczyn", verdict: supported, where: "in et adversus Magnificos Stanislaum Chełmski Bonorum Łukom cum attinentiis ... et Stephanum Zielonacki Subj~ Terrestrem Calissien~ Causae Infrascriptae tam in Judicio Terrestri Calissiensi pleno quam in Termino Condescensionis in Fundo Bonorum Trąmpczyn"}
- {claim: "Prusimski verweist auf seinen Protest und seine Ladung gegen das Dekret des Landgerichts vom 20. Oktober des Vorjahres", verdict: supported, where: "referendo se ad Manifestationem et Terminum prosecutorialem contra Decretum Terrestre Calissiensi in Conin ... Feria 2da post Festum Sanctae Hedvigis Viduae Electae Dei Scilicet Die 20ma mensis 8bris Anno praeterito"}
- {claim: "der Streit um die Herausgabe der Urkunden mit den Erben der Witwe seines Onkels Paweł Prusimski sei beim Tribunal anhängig; ohne diese Urkunden könne über die Forderung, die Chełmski von Jan Tracholz erworben hat, nicht entschieden werden", verdict: supported, where: "Causae cum Successoribus Relictae olim Magnifici Pauli Prusimski Patrui sui ... Extraditionis Documentorum ... In Tribunali dependentis ... absque receptis Documentis se In Causa praesenti cum M Chełmski Jurisquaesitore praetensionis ... a Honorato Joanne Tracholz ... dijudicare non poterit"}
- {claim: "der Unterrichter habe die Sache auf Betreiben Chełmskis an das volle Landgericht verwiesen, obwohl dieses vor das Tribunal geladen sei, und Prusimski damit unnütze Kosten verursacht; Prusimski erklärt diese Verweisung für nichtig", verdict: supported, where: "totum Judicium Terrestre Calissiensi ... ad Tribunal Concitatum est ... Motivo partis nempe Magnifici Chełmski Indebite remisit, perindeque inanes Litis Expensas Manifestanti adauxit et ... de nullitate et insubsistentia praefatae Remissionis ad Judicium Terrestre Calissien~ prosecutum factae,"}

app53170koningr117-008:
- {claim: "bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 15. April 1778", verdict: supported, where: "Providens Bartholomaeus Szepczyński de villa Trąmpczyn Ministerialis Regni Generalis; the heading of the sitting on leaf 71 (rulings.yml)"}
- {claim: "er hat drei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Montag nach Laetare 1778: an Stanisław Chełmski, an den Richter Franciszek Wierusz Walknowski, an den Unterrichter Stefan Zielonacki, zugleich Richter des Ortstermins, und an den Notar Xawery Mikorski", verdict: supported, where: "Vobis MM Stanislao Chełmski Bonorum Łukomia Haeredi atque Francisco Wierusz Walknowski Judici Stephano Zielonacki Subjudici et etiam in Termino Conds~nis Infrascriptae Causae Judici Xaverio Mikorski Notario; Dato Petricoviae Feria Secunda post Dominicam Laetare Quadragesimalem proxima Anno Domini 1778uo; Primam ... alteram in oppido Konin ... Tertiam"}
- {claim: "auf Betreiben Prusimskis soll die Sache an das Tribunal verwiesen und das Dekret vom 20. Oktober des Vorjahres aufgehoben werden; sie lasse sich nicht entscheiden ohne die Urkunden, die Prusimski von den Erben der Witwe seines Onkels, Katarzyna Prusimska, geborene Rozdrażewska, zurückfordert", verdict: supported, where: "ad Tribunal Remitti Ibidemque relevato Decreto vestro Injunctae Conds~nis ... Feria 2da post Festum Sanctae Haedvigis ... Die 20 8bris; Causamque hanc uti Absque Documentis a Successoribus Rozdrazevianis recipiendis ullo modo Decidi valentem ... cum Successoribus Relictae Patrui Actoris Nempe Catharinae de Rozdrażewskie Prusimska"}
- {claim: "erweise sich daraus die Forderung von Tracholz und Chełmski als unrechtmäßig, soll die Übertragung aufgehoben werden; ergebe sich vielmehr eine Schuld von Tracholz gegenüber dem Onkel, soll Chełmski sie samt Zinsen zahlen", verdict: supported, where: "illegale Jus et praetensio Honorati Joannis Tracholz Simulque Magnifici Chełmski ... apparuerit ex tunc Actorem Cassata Transfusione Magnifici Chełmski ... liberari; Quod si vero major praetensio et Summae ab olim Magnifico Patruo Actoris per olim Honoratum Tracholz Contractae et Eidem debitae ... ex tunc Eundem Magnificum Chełmski ad Solutionem Summarum ... una cum provisionibus Stringi"}
- {claim: "die Ausfertigungen wurden in Trąbczyn, in Konin im Haus des Bürgers Paulszewicz, wo die Kanzlei des Landgerichts ihre Akten hat, und im Gutshof von Łukom hinterlegt", verdict: supported, where: "In praepositura Trąmpczynen~ ... in oppido Konin Domoque Famati Paulszewicz ubi Cancellaria Terrestris Calissien~ sub repositione actorum in Conin Consistit ... Tertiam in Curia Bonorum villae Łukom"}

app53170koningr117-009:
- {claim: "bericht des Gerichtsboten Jan Jankowski von Łukom, eingetragen in Konin am 25. April 1778", verdict: supported, where: "Providus Joannes Jankowski de villa Łukom Ministerialis Regni Generalis; the heading of the sitting at the top of leaf 78 (rulings.yml)"}
- {claim: "er hat Antoni Prusimski eine königliche Ladung vor das Kalischer Landgericht in Konin zugestellt, ausgestellt in Kalisz am Karfreitag 1778, auf Betreiben von Stanisław Chełmski, Erbherr von Łukomia", verdict: supported, where: "pro Judiciis Terrestribus Calissiens[ibus?] Districti in Conin Celebran~ ... Tibi M Antonio a Colno Prusimski ... ad Instantiam Magnifici Stanislai Chełmski Bonorum Łukomia Haeredis Acto~; Dato Calissii Feria 6ta Magna~ Anno Domini 1778uo"}
- {claim: "Prusimski soll das Dekret hören, mit dem das Gericht des Ortstermins in Trąbczyn die Sache an das volle Gericht verwiesen hat; Chełmski verlangt, dass ihm die von Jan Tracholz auf ihn übertragene Summe samt Zinsen und Kosten zugesprochen wird", verdict: supported, where: "ad paratum Decretum ad Judicium Plenum factae Remissionis per Judicium Condescensoriale In Termino Cond~snis In Trąmpczyn ... Solutionem Summae sibi Acto~ a Honorato Joanne Tracholtz transfusae una cum provisionibus et refusione litis ... adjudicari"}
- {claim: "der Bote hat die Ladung im Gutsamt von Trąbczyn in Gegenwart des Verwalters hinterlegt", verdict: supported, where: "In Bonis Trąmpczyn officina Ibidem Litto~ super mensa hippi praesente Economo ... posuisse et reliquisse"}

app53170koningr117-010:
- {claim: "registervermerk von 1778: Das Dekret, mit dem das Gericht des Ortstermins auf dem Grund von Trąbczyn die Sache zwischen Chełmski und Prusimski, Starost von Niszczewice, verwiesen hat, wird zur Eintragung vorgelegt", verdict: supported, where: "Decreti Condescensorialis In Fundo Bonorum Trąmpczyn Inter MM Chełmski et Prusimski Capitanei Niszczevicen~ Remissionis Oblata; leaf 82 verso (rulings.yml)"}
- {claim: "der Vermerk verweist auf einen Text gegenüber unter dem Zeichen #", verdict: supported, where: "Videatur ex Opposito Subsigno #"}

app53170koningr117-011:
- {claim: "bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 29. Januar 1779, für Antoni Prusimski von Kolno, Starost von Niszczewice", verdict: supported, where: "Actum in Conin Feria Sexta post Festum Conversionis Sancti Pauli Apostoli proxima scilicet Die 29 mensis Januarii Anno Domini 1779; ad Instantiam et Officiosam Requisitionem Magnifici Antonii de Kolno Prusimski"}
- {claim: "mit zwei Adligen war er am 23. des laufenden Monats in den Kiefernwäldern von Trąbczyn: Auf eigenem Trąbczyner Grund zählte er zwölf Stümpfe frisch gefällter Kiefern, hinter und zwischen den Grenzhügeln weitere, nach seiner Angabe von Untertanen des Gutes Rzgów geschlagen", verdict: supported, where: "Vigesima Tertia Mensis et Anni Currente in borras ad bona Ea[i?]dem Trąmpczyn Spectantes Condescenderat ... własney Dziedzinie Trąmpczyńskiey pniów Swiezo od Sciętych [S?]osien Dwanascie zas za kopcami y między kopcami więcey przez Ludzi z Dóbr Rzgowa poddanych pozcinanych"}
- {claim: "er legt dem Amt zwanzig Äxte vor, die an jenem Tag auf dem Grund von Szetlewek diesen Untertanen abgenommen wurden, als sie bei Nacht mit den Kiefern flohen, nimmt sie wieder an sich und quittiert dem Amt", verdict: supported, where: "praesentavit Secures in numero viginti Die superius Expressa in Fundo Bonorum Szetlewek eisdem Subditis de bonis Rzgów noctarno tempore cum praemissis Arboribus pinaticis fugientibus Interceptas quas ... ab officio praesente recepit et de receptis officium praesens Cancellariamque ejus quietavit"}

app53170koningr117-012:
- {claim: "protest von Marcin Nosalski, Erbherr und Besitzer von Rzgów, eingetragen in Konin am 1. Mai 1779 und von ihm unterschrieben", verdict: supported, where: "Magnificus Martinus Nosalski Thesaurarida Czerniechovic~ Bonorum Rzgów cum Attinen~ haeres ac Possessor; Martinus Nosalski; the heading of the sitting on leaf 358 verso (rulings.yml)"}
- {claim: "er legt ihn vorsorglich ein, damit ihm die Aussagen von Bartłomiej Szepczyński und Mateusz Wąchnicki in seiner Sache mit Prusimski vor dem Kalischer Landgericht in Konin nicht schaden", verdict: supported, where: "prospiciendo Indemnitati Suae ne quomodocunque per depositionem Testimoniorum ex Laboriosis Bartholomeo Szepczyński et Matthaeo Wąchnicki in Causa cum Ilustrissimi Magnifico Prusimski ... in Juditis Juribus Terrestribus Palatinatinus Calissien~ in Conin promota praejudiciosum sibi inferre videatur ... in vim Diligentiae"}
- {claim: "die beiden hätten auf Befehl von Tomasz Joachimowicz seine Leute, die auf Schlitten Bäume aus den Erbwäldern Chełmskis fuhren, auf öffentlicher Straße angehalten, geschlagen, mit den Schlitten nach Trąbczyn gebracht und ihnen die Äxte mit Gewalt abgenommen", verdict: supported, where: "Mandata Generosi Thoma Joachimowicz Exequentes ausi sunt ... hominibus Sui Ma manifestantis de Sylvis Magnifici Chełmski haereditariis in Trahibus arbores vehentibus in via publica iter praepedire. Eosque Concutere ac Converberare ad bonaque Trąpczyn cum Trahibus adducere Secures violenti modo apphendere"}
- {claim: "Nosalski protestiert gegen sie als Urheber der Gewalt, bietet an, die Gewalttaten durch Zeugenverhör zu beweisen, und will sie vom Zeugnis in dieser Sache ausschließen lassen", verdict: supported, where: "contra Eosdem violentiarum Executores quam Solennissime Manifestatur, offerendo se praemissas violentias ... omnimoda Inquisitione deducturum a perhibendoque hac in Causa Testimonio relegaturum"}


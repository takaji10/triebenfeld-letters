  en: 'Done at Konin on the Wednesday next after Palm Sunday, namely 15 April 1778.


    The Honourable Prusimski, Starost of Niszczewice, against the Honourable Chełmski and the Land Court
    — Manifest Filed


    Certified copy.


    To the office and present records of the Konin Municipal Court, appearing in person, the Honourable
    Antoni of Kolno Prusimski, Starost of Niszczewice, hereditary owner of the estates of Trąmpczyn with
    appurtenances — looking to avert any danger to his cause and fortune and to safeguard the integrity
    of the laws of the nobility, and referring himself to the manifest and prosecution term against the
    Kalisz Land Court decree issued at Konin prejudicially, made and lodged before the records of the
    Konin Municipal Court in the preceding year by permission of the law — solemnly, before the same office
    and its records, in and against the Honourables Stanisław Chełmski, current hereditary owner of the
    estates of Łukom with appurtenances, and Stefan Zielonacki, Deputy Land Judge of Kalisz, in the cause
    described below, both in the full Kalisz Land Court and at the judicial condescension term in the
    estates of Trąmpczyn — manifests:


    of the fact that — attentive to the grievances set out in the manifest and prosecution term [to the
    effect] that the Kalisz Land Court decree issued at Konin on the Monday after the Feast of Saint Hedwig,
    Widow and Chosen of God, namely 20 October of the preceding year, between the same Honourable Chełmski
    and himself the manifestant — is contrary not only to the prior decree but also to the Commission
    of the Estates of the Realm issued in this cause, and likewise issued outside the proper forum — as
    much because without decision of the cause together with the claims of the widow of the late Honourable
    Paweł Prusimski, his uncle, regarding the production and delivery of documents pertaining both to
    this cause and to his uncle''s general estate — a cause pending and entrusted and ordered to be decided
    by land court decrees and ultimately by the Commission of the Estates of the Realm, and to this point
    undetermined, nay rather pending before the Tribunal'

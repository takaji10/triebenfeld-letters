- page: 2
  confidence: high
  marker_count: 0
  en: 'and due to be resolved there — and that without the documents received he cannot be adjudicated
    in the present cause with the Honourable Chełmski, the acquirer of the pretension or the most illegal
    claim acquired from the Honest Jan Tracholz, the assignor — (with whom also the cause and his pretension
    had been remitted together with this cause and the condescension, by reason of the connected nature
    of the matter, as recently as in the year 1766; the same Honest Tracholz having summoned and cited
    the successors of Katarzyna of Rozdrażewo Prusimska, the widowed survivor of his uncle, after her
    death, on that same pretension of his, at his own term) — he cannot be separately adjudicated; and
    [attentive to the fact] that he had already conceived that the evident danger to this cause, and also
    some resolution of the manifestant''s general cause and discrepant decree, had been premeditated by
    the Honourable Chełmski.


    Accordingly, the manifestant — from these motives — was compelled by force of law to make and file
    the prosecutions, namely the manifest and prosecution term, against the above-written Kalisz Land
    Court decree and simultaneously against the court; and accordingly, standing on those same legal remedies
    — namely the manifest and prosecution term — staying the execution of that same Konin Kalisz Land
    Court decree, he placed and brought the whole matter before the Honourable Sub-judge; and the entire
    Kalisz Land Court had been incriminated — not only through the prosecution term but also through the
    timely manifest on grievance and for the review of their decree — and summoned to the Tribunal.


    The manifestant, therefore, unable to pursue the matter in that same Kalisz Land Court as having already
    been prosecuted there, and its own decree being incapable of being reviewed by it — [and] the remission
    of this cause to the Tribunal, which the Honourable Sub-judge of the Kalisz Land Court ought to have
    made to the Tribunal by virtue of the aforesaid grounds for remission — then, with the aforesaid prosecutions
    issued to the Tribunal, not to the Kalisz Land Court, obstructing that same remission, he again prosecuted
    the Sub-judge himself and the entire court; and [they], by force of law now obliged to desist from
    adjudication of that cause, improperly remitted it at the instigation of the party, namely the Honourable
    Chełmski, and thereby added empty litigation costs to the manifestant and derogated from his legal
    rights; and also of the fact that the same act of the condescension could not be completed — for reasons
    to be given at the prosecution term and to be elucidated through the subsequent manifest if necessary
    —


    in full force of his every explanation, and also as a certain process of the manifestant''s honour
    and aggrievance, and simultaneously regarding the nullity and want of substance of the aforesaid remission
    made to the Kalisz Land Court as prosecuted, and the impossibility of being adjudicated together with
    the Honourable Chełmski in that same prosecuted court — and also of the remission sought there from
    the same court to the Tribunal — again and again, most solemnly, manifests;


    offering to act lawfully in respect of all the foregoing, with all things preserved that ought to
    be preserved by law, and with full force reserved and safeguarded to himself of augmenting or diminishing
    the same manifest, or of making another manifest in supplement of this one.


    Antoni Na Kolnie Prusimski'

  en: 'On behalf of the Honourable Prusimski against the Land Court and the Condescension Court Office
    — to the Tribunal — Relatio


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Bartłomiej
    Szepczyński of the village of Trąmpczyn, Royal Court Summoner, General, sound of health, acknowledged
    the authenticated citation letters, one and the same in substance, issued for the ordinary general
    sessions of the Crown Tribunal of the Realm at Piotrków as described below, of the following tenor:


    Stanislaus Augustus, by the Grace of God King of Poland, Grand Duke of Lithuania, of Russia, of Prussia,
    of Masovia, of Samogitia, of Kuiavia, of Podolia, of Podlachia, of Livonia, of Smolensk, of Seversk,
    of Chernigov — to you, the Honourables: Stanisław Chełmski, hereditary owner of the estates of Łukomia;
    and Franciszek Wierusz Walknowski, Judge; Stefan Zielonacki, Deputy Judge and also judge at the condescension
    term of the cause described below; and Xawery Mikorski, Notary of the Kalisz Land Court — judges in
    the cause described below — regarding your persons and all claims and amounts of yours, we command
    that you appear in person and peremptorily before us or our Crown Tribunal of the Realm at Piotrków,
    whenever the present cause shall fall to be called and proclaimed for adjudication from the register
    and inscription belonging to it — at the instance of the Honourable Antoni of Kolno Prusimski, Starost
    of Niszczewice, hereditary owner of the estates of Trąmpczyn with appurtenances, plaintiff;


    who, adhering to the prosecutions — namely the manifest and prosecution term — previously lodged;
    and to this subaltern manifest made or to be made; and to the laws of the Realm; and to the prior
    decrees and the Commission designated by the Republic in this cause that have followed; and to the
    reasons and those same decrees set out in the prosecutions — cites you; or rather, reiterating those
    same prosecutions and staying the adjudication of the present cause in your court as having been prosecuted
    — cites you to see and hear the foregoing:


    notwithstanding the remission of the present cause by the Honourable Sub-judge of the Kalisz Land
    Court to the full Kalisz Land Court as prosecuted — and himself, being one of the number of that court
    — improperly made from the condescension term at Trąmpczyn and enrolled in the authenticated records;
    which remission ought to have been made not to the Kalisz Land Court but to the Tribunal by the finality
    of the law, as had been sought by the plaintiff:


    [for] this cause — for the resolution of your decree expressed below — to be remitted to the Tribunal,
    by virtue both of the prior and of the present [citations] issued against you and also against the
    Honourable Condescension Court Judge; and also by virtue of the original decrees and the Commission
    of the Republic that followed together with the successors of the widow of the plaintiff''s uncle;
    and there, having reviewed your decree of the enjoined condescension to the estates of Trąmpczyn issued
    between the Honourable Chełmski and the plaintiff in the preceding year, on the Monday after the Feast
    of Saint Hedwig, Widow and Chosen of God, namely 20 October — which is contrary to your prior decree
    of remission of this cause to the condescension together with the successors of the widow of the plaintiff''s
    uncle, [a remission made] together with the late Honest Jan Tracholz, the legal assignor of the Honourable
    Chełmski; and what is more, to his cause against the successors of that same widow of the plaintiff''s
    uncle, instituted after her death — the same prior remission decree neither reviewed nor resolved,
    and likewise not having a term available from the Honourable Chełmski; and with the decrees and the
    Commission designated by the Estates of the Realm in this cause which also obstruct and do not admit
    the Kalisz Land Court forum and your decision not being attended to — unable to be reviewed, having
    been issued prejudicially and also without being ordered; nay rather, with the communication of documents
    interrupted in so long-standing a cause, begun thirty years ago after the barren decease both of the
    plaintiff''s uncle and of his widow, and having its beginning according to the prescription of the
    King''s new statute, which ought entirely to be decreed — having been issued:


    himself the plaintiff to be freed from its bond and rigour; and this cause — which cannot be decided
    in any way without the documents to be recovered from the Rozdrażewski successors — to be remitted
    together with the cause and proceedings against the successors of the widow of the plaintiff''s uncle,
    namely Katarzyna of Rozdrażewo Prusimska, regarding the documents to be delivered both for this cause
    and for the general estate of the plaintiff''s uncle — left after the death of the uncle with his
    surviving consort, and after the death of the widow passing to her successors, and vindicated through
    a process by the plaintiff to the present day — and for which final decision has been ordered through
    the ultimate Commission of the Republic and which can be brought to execution by the Tribunal alone
    — by the authority both of that Commission and of the prior Kalisz Land Court decree of remission
    to the condescension term — not only by reason of the connected and concatenated nature of the matter,
    but also because the matter demands the production and delivery to him by the Rozdrażewski successors
    and the advancing of the present cause''s documents — to be remitted; and there for that same cause
    to be decided and determined; and that if the illegal law and pretension of the Honest Jan Tracholz
    and likewise of the Honourable Chełmski, his acquirer, shall appear from the documents to be received
    from the Rozdrażewski successors — then thereafter the plaintiff, with the transfer of the Honourable
    Chełmski annulled'

- page: 2
  confidence: high
  marker_count: 0
  en: 'and his illegal right [annulled], to be freed from this legal demand; and by reason of the improper
    [proceedings] and a mere vexation and the entanglement of the plaintiff''s boundary cause and discrepant
    commissarial decree, which sought right — and likewise by reason of the improper vexation, and also
    regarding the costs of litigation unjustly caused to the plaintiff — that the same [defendants] be
    punished with condign penalties, or that the litigation costs be decreed to be made good to the plaintiff;
    and if moreover a greater pretension and sums contracted by the late uncle of the plaintiff from the
    late Honest Tracholz and owed to him shall emerge from the documents to be produced and received from
    the Rozdrażewski successors — then that the same Honourable Chełmski be bound to payment of those
    sums, as the acquirer of his right, on behalf of the plaintiff, together with provisions; and nonetheless
    that penalties for the prejudicial decrees procured by the party and issued by the court be extended
    both against the party and against the court; and in the remainder all things that shall be required
    by law, justice, the requirements of the present cause and its documents — to be decided, decreed,
    and sentenced against you. Be prepared to appear at this term of litigation and respond judicially.
    Given at Piotrków on the Monday next after Laetare Sunday in the Year of the Lord 1778.


    The first of those — against the Honourable Condescension Court Judge — at the estate of Trąmpczyn,
    on the table of the heated room, with the mother of the household present, on the Thursday after Laetare
    Sunday; the second — in the town of Konin, at the house of the Honest Paulszewicz, where the chancellery
    of the Kalisz Land Court keeping its records at Konin is situated, on the table of the heated room,
    with the mother of the household present; the third — at the manor court of the estates of the village
    of Łukom, on the table of the atrium, with a maiden present — all on today''s day, as contained in
    the act, he placed distinctly and, having notified, left.'

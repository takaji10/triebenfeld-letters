- page: 2
  confidence: high
  marker_count: 0
  en: '— [cites you] to the prepared decree of the remission made to the full court by the Condescension
    Court at the condescension term at Trąmpczyn, issued expeditiously between himself the plaintiff on
    one part and you the cited on the other part — cites you to see and hear:


    the suit of himself the plaintiff, instituted against you, to be adjudged, notwithstanding any manifests
    and prosecution terms of yours, if such have intervened, in connection with the plaintiff''s documents;
    the payment of the sum transferred to him the plaintiff from the Honest Jan Tracholz, together with
    provisions and reimbursement of litigation costs and any processes and delays — from the reasons to
    be set out at the prosecution term — to be adjudicated to him the plaintiff; and all other things
    required by the matter, the documents, and justice — to be decreed, decided, and sentenced against
    you. For which, being cited, be ready to obey, to attend the term and to respond judicially. Given
    at Kalisz on Good Friday in the Year of the Lord 1778.


    At the estates of Trąmpczyn, in the estate office there, the letters on the table of the heated room,
    with the estate manager present — on today''s day, as contained in the act, he placed and left.'

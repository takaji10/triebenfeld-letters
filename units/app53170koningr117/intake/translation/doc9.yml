  en: 'On behalf of the Honourable Chełmski against the Honourable Prusimski — Relatio


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Jan
    Jankowski of the village of Łukom, Royal Court Summoner, General, sound of health, acknowledged the
    authenticated citation letter, issued for the Kalisz Land Court sessions of the district to be held
    at Konin, of the following tenor:


    Stanislaus Augustus, by the Grace of God King of Poland, Grand Duke of Lithuania, of Russia, of Prussia,
    et cetera — to you, the Honourable Antoni of Kolno Prusimski, Starost of Niszczewice, hereditary owner
    of the estates of Trąmpczyn — regarding your person and estates, generally all claims and monetary
    sums, held and to be held — we command that you appear in person and peremptorily before us and our
    Kalisz Land Court sessions, first and next to be held at Konin, at the instance of the Honourable
    Stanisław Chełmski, hereditary owner of the estates of Łukomia, plaintiff; who, adhering to his manifest
    and likewise to the counter-manifest made or to be made, cites you; or rather'
  names: []

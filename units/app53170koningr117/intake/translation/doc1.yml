  en: 'Done at Konin on the Saturday next after Ash Wednesday, namely 7 March 1778.


    On behalf of the Honourable Chełmski against the Honourable Prusimski — Relatio for the Condescension
    Term


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Jan
    Jankowski of the village of Łukom, Royal Court Summoner, General, sound of health, acknowledged the
    authenticated citation letter for the condescension term arising in the estates of the village of
    Trąmpczyn, issued of the following tenor:


    Stanislaus Augustus, by the Grace of God King of Poland, et cetera — to you, the Honourable Antoni
    of Kolno Prusimski, Starost of Niszczewice, hereditary owner of the estates of Trąmpczyn with appurtenances
    — regarding your estates we command that you appear in person, lawfully and peremptorily at the condescension
    term — ordered in the Kalisz Land Court decree issued at Konin on the Monday after the Feast of Saint
    Hedwig, Widow and Chosen of God, in the immediately preceding year — and designated for the Monday
    after the First Sunday of Lent at the estates of Trąmpczyn — at the instance of the Honourable Stanisław
    Scibor Chełmski, hereditary owner of the estates of Łukom with appurtenances, plaintiff; who cites
    you, or rather summons you to this prepared decree — as the demands of the matter previously committed
    to the citation require; and to the effect that you — at that same condescension term fixed and arising
    in the estates of Trąmpczyn — produce the laboring subjects of your estates, who by the present citation
    are placed under arrest in your keeping, namely: Albert Livoy, Andrzej Rataj, Kazimierz the Keeper,
    and Albert the Shepherd of Nowawieś; for which aforesaid citations, the days set at the term — having
    attended to it, prepared to appear and respond judicially — under penalty through the aforesaid matters.
    Given at Konin, on the Monday next after the Feast of Saint Matthias the Apostle in the Year of the
    Lord 1778.


    Served at the estate office of the village of Trąmpczyn, on the table of the heated room, with a maiden
    present — on today''s day, as contained in the act, he placed and left it.'

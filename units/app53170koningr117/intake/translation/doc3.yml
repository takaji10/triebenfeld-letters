  en: 'The Honourable Prusimski against the Honourable Chełmski and the Condescension Court — Manifest
    Filed


    Let there be seen in this place, arising from the matter and the personal appearance of the Honourable
    Antoni Prusimski, Starost of Niszczewice, against the Honourable Stanisław Chełmski and the Condescension
    Court — the manifest made, inserted opposite.


    Upon the Manifest of Antoni Prusimski, Starost of Niszczewice'

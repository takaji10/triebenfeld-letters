- page: 3
  confidence: high
  marker_count: 0
  en: 'pending in the Crown Tribunal — to be issued — and thereby to burden the manifestant, and to seek
    to draw him and his boundary cause and the discrepant decree into some entanglement;


    and against the Honourable Kalisz Land Court judges: because they — not attending to the reasons and
    documents set out above, nor to their own decree of remission of this cause together with the legal
    assignment of the Honourable Chełmski to the condescension term together with the successors of the
    widow of the manifestant''s uncle, contrary to which another judgment could not be issued — and that
    same remission decree likewise not reviewed, and unable to be reviewed without a term by the Honourable
    Chełmski — and without attending to the decrees of the Piotrków Tribunal and the Commission of the
    Estates of the Realm issued together with the successors of the widow of his uncle, by virtue of which
    the present cause did not fall to their forum and decision — and finally without attending to the
    fact that in this cause — since it is so long-standing and begun more than thirty years ago — the
    more extensive communication of documents ought entirely, according to the prescription of the new
    statute of the law and the determined degree of the right, to have been granted and decided — yet
    with all these things unattended to, dared and presumed to issue another decree of the enjoined condescension
    to the estates of Trąmpczyn, entirely different from their prior decree and likewise outside the proper
    forum — and thereby to burden the manifestant, and to prepare danger for the boundary cause, and to
    refuse to admit any motion from that decree —


    wherefore the manifestant, having set out these matters — not only by reason of all the foregoing
    but also regarding the nullity and want of substance of that same Kalisz Land Court decree issued
    at Konin on the Monday after the Feast of Saint Hedwig, Widow and Chosen of God, namely 20 October
    of the preceding year, between the same Honourable Chełmski and the manifestant, prejudicially — staying
    the execution of it and referring himself to the laws of the Realm, and simultaneously also against
    the transfer or the illegal right acquired for the Honourable Chełmski from the Honest Tracholz —
    again and again, most solemnly, manifests;


    with all things preserved that ought to be preserved by law.'

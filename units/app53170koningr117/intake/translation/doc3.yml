- page: 2
  confidence: high
  marker_count: 0
  en: 'Certified copy.


    To the office and present records of the Konin Municipal Court, appearing in person, the Honourable
    Antoni of Kolno Prusimski, Starost of Niszczewice, hereditary owner of the estates of Trąmpczyn —
    looking to the integrity of his cause and fortune and to remove danger from them — solemnly, before
    the same office and its records, in and against the Honourable Stanisław Chełmski, hereditary owner
    of the estates of Łukom, and simultaneously against the prejudicial judges of the Kalisz Land Court
    in the cause described below, manifests:


    of the fact that the same Honourable Chełmski — going beyond all bounds and seeking litigation against
    the manifestant — came forward and presumed to pursue against his property and person the illegal
    right acquired from the Honest Jan Tracholz, in the matter of oak timber or woodland contracted with
    the late Honourable Paweł Prusimski, the manifestant''s uncle, already in the year 1744, confirmed
    and assumed by him for himself — to whom the manifestant''s late uncle had not been debtor, but who
    had himself been debtor to the uncle — and having thus acquired that same right, without attending
    to the fact that the manifestant is without resources and without the documents — adhering in the
    hands of the successors of the late widow of his uncle, vindicated through a process by the manifestant
    but not yet recovered — necessary both for this cause and for the general estate of his uncle; and
    without attending to the fact that by reason of those same documents, first the Kalisz Land Court
    decree of the enjoined condescension and then that of the Piotrków Tribunal had intervened together
    with those same successions; and hence also the cause with the same Honest Tracholz, the assignor
    of his right, had been remitted by decree of the Kalisz Land Court to that same condescension term
    designated together with the successors of the widow of his uncle; and furthermore that regarding
    those same documents, together with the successors of the widow of his uncle, the Commission of the
    Estates of the Realm had been issued — not yet decided, and due to be decided by the Crown Tribunal;


    yet with all these things in no way considered or attended to — and notably the Land Court decree
    of remission to the condescension term — contrary to which no other decree could validly follow in
    that same entangled court — he dared to improperly summon the manifestant to that same Kalisz Land
    Court without even a term available within the remission decree; and in that same court to have issued
    another decree, different and contrary to the prior, of the enjoined condescension to the estates
    of Trąmpczyn — without a term, as stated above — contrary to the remission decree, the same remission
    decree not reviewed, nay rather remaining untouched to this day — into a mere entanglement of the
    manifestant''s cause and the boundary cause'

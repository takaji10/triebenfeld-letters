  en: 'Done at Konin on the Friday next after the Feast of the Conversion of Saint Paul the Apostle, namely
    29 January 1779.


    On behalf of the Honourable Prusimski — Pine forest [inspection] together with the presentation of
    axes


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Bartłomiej
    Szepczyński of the village of Trąmpczyn, Royal Court Summoner, General, sound of health, acknowledged
    that he himself — having with him two nobles, namely the Honourables Tomasz Joachimski, present here,
    and Marcin Wróblewski, although absent here but present at the location of the matter described below
    — at the instance and formal request of the Honourable Antoni of Kolno Prusimski, Starost of Niszczewice,
    hereditary owner of the estates of Trąmpczyn with appurtenances, had descended on the twenty-third
    of the current month and year to the pine forest pertaining to those same estates of Trąmpczyn; and
    being there thus with the above-mentioned nobles, he declared in these words:


    That in the proper hereditary woodland of Trąmpczyn, twelve stumps of freshly felled pines — and further,
    beyond the mounds and between the mounds, more, cut down by people, subjects of the estates of Rzgów
    —


    all of which aforesaid things he duly attested to the present office that he had seen, observed, and
    counted; and thereupon in the same continuous act he presented to the same office twenty axes — intercepted
    on the day stated above in the precinct of the estates of Szetlewek from those same subjects of the
    estates of Rzgów as they fled at night-time with the aforesaid pine trees — which, thus presented,
    the same Court Summoner together with the Honourable Joachimski received back from the present office;
    and having received them back, he gave quietance to the present office and its chancellery. The present
    record quieted.'

  en: 'Done at Konin on the Monday next after Laetare Sunday, namely 30 March 1778.


    On behalf of the Honourable Prusimski against the Honourables Chełmski and the Kalisz Land Court —
    to the Tribunal — Relatio


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Bartłomiej
    Szepczyński of the village of Trąmpczyn and Mateusz Matuszkiewicz of the village of Szetlewek, Royal
    Court Summoners, General, sound of health, acknowledged the two authenticated citation letters issued
    for the ordinary general sessions of the Crown Tribunal of the Realm at Piotrków as described below,
    of the following tenor:


    Stanislaus Augustus, by the Grace of God King of Poland, Grand Duke of Lithuania, of Russia, of Prussia,
    of Masovia, of Samogitia, of Kiev, et cetera, of Podolia, of Podlachia, of Livonia, of Smolensk, of
    Seversk, of Chernigov — to you, the Honourables: Stanisław Chełmski, hereditary owner of the estates
    of Łukomia; and Franciszek Wierusz Walknowski, Judge; Stefan Zielonacki, Deputy Judge; and Xawery
    Mikorski, Notary of the Kalisz Land Court — the judges complained of in the cause described below:
    regarding your persons, goods and office we command that in our Ordinary Courts of the Crown Tribunal
    of the Realm at Piotrków, from the date and service of the present citation, correctly within four
    weeks, or for as long as and whenever the present cause shall fall to be called and proclaimed for
    adjudication from the register and inscription belonging to it, you appear in person and peremptorily,
    at the instance of the Honourable Antoni of Kolno Prusimski, Starost of Niszczewice, hereditary owner
    of the estates of Trąmpczyn, plaintiff;


    who, adhering to his manifest made or to be made — and to the laws of the Realm and to the decrees
    both of the prior decree of your court of remission to the condescension term together with the succession
    of the widow of the plaintiff''s late uncle, and to the Tribunal and to the Commission issued by the
    Estates of the Realm — cites you; or rather, staying the execution of your subsequent decree — issued
    at Konin on the Monday after the Feast of Saint Hedwig, Widow and Chosen of God, namely 20 October
    of the preceding year, between the Honourable Chełmski and himself the plaintiff — cites you to see
    and hear that the above-mentioned Konin Land Court decree, contrary to the prior decree — the prior
    decree neither reviewed nor resolved, and likewise unable to be resolved without a term which the
    Honourable Chełmski has not obtained — and with the Tribunal decree and the Commission issued by the
    Estates of the Realm, which obstruct and do not admit the Kalisz Land Court forum and your decision,
    not being attended to — having been issued prejudicially and also without the communication of documents
    due to be decreed according to the new statute of the law in so long-standing a cause begun thirty
    years ago — be reviewed; himself the plaintiff to be freed from its bond and rigour; nay rather, the
    cause for the resolution of that same decree to be remitted to the Tribunal;


    and nonetheless — the cassation of the manifest or the illegal right acquired for the Honourable Chełmski
    from the Honest Jan Tracholz improperly and into a mere vexation and entanglement of the boundary
    cause and the discrepant commissarial decree-act — matters situated in the competent forum, decided
    by the same action — himself the plaintiff to be freed from this legal claim; and by reason of the
    issued prejudicial decree — penalties against the party and likewise against the external court; and
    in the remainder all things that are of law, justice, and the documents — to be decided, decreed,
    and sentenced against you. Be prepared to attend to this citation and respond judicially. Given at
    Piotrków on the Saturday after Reminiscere Sunday in the Year of the Lord 1778.


    The first — the Honest Szepczyński — in the town of Konin, at the house of the Honest Palszewicz,
    [...] with the mother of the household present; the second — the Honest Matuszkiewicz — against the
    Honourable Chełmski at the manor court of the estates of the village of Łukom, with [...] present
    — both copies on the tables of the heated rooms, distinctly, on today''s day, as contained in the
    act, placed and left.'

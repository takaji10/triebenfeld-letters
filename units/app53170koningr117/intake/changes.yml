  now: "Ultronee Secum Manifestante Litigia querens, ausus est et praesumpsit ... cum Eisdem Successoribus ... cum Jurisdatore Magnifici Chełmski ... Judicem Manifestatur ... involutionem aliquam Causae Granicialis"

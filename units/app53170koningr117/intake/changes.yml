# What the check of APP 53/17/0/-/Konin Gr.117 against the scans changes for
# anyone who has written about these entries from the earlier text. Read by
# pipeline/review/changes_page.py. The first check was a light one: five of
# eighteen pages word for word, with every heading, date line and judge's
# name. The editor read that record on 2026-10-07 and asked for the full
# check; what it added is marked `new:`.
# importance: significant | fact | wording.

unit: "APP 53/17/0/-/Konin Gr.117: thirteen register entries, 1778 and 1779"
changes:
- importance: significant
  what: "Paweł Prusimski is Antoni's UNCLE, not his father, and Katarzyna, born Rozdrażewska, is the uncle's widow. The word is \"Patrui\" (written \"Patruj\" on leaf 55, where I looked at it three times); your text had \"Patrii\" or \"Patris\" sixteen times beside \"Patruum\" and \"Patruo\", and your English \"father\" fifteen times. I corrected all of them on that ground; I did not look at each."
  was: "Relictae Patrii sui / Relictae viduae Patris sui / substantiam Patrii Sui"
  now: "Relictae Patrui sui / Relictae viduae Patrui sui / substantiam Patrui Sui"
  english_was: "the widow of his father ... his father's general estate ... the barren decease both of the plaintiff's father and of his widow"
  english_now: "the widow of his uncle ... his uncle's general estate ... the barren decease both of the plaintiff's uncle and of his widow"
- importance: significant
  what: "In Prusimski's first protest it is Tracholz, not Chełmski, who is said to have been the uncle's debtor: \"cui non olim Patruus Manifestantis sed Ipse Patruo Debitor Extitit\". The second citation to the Tribunal says the same (sums \"contracted by Tracholz and owed to\" the uncle). I did not re-read this passage on the scan; it is the grammar of your own transcription."
  was: "(English) a right for which not the manifestant's late uncle but Chełmski himself had stood as debtor to the uncle"
  now: "(English) to whom the manifestant's late uncle had not been debtor, but who had himself been debtor to the uncle"
- importance: significant
  what: "The citation of 7 March 1778 orders Prusimski to PRODUCE four subjects at the sitting on the ground (\"Statuas\"), who by the citation are arrested in his keeping; it addresses him throughout as \"you\" (\"Qui Te Citat\", \"de bonis Tuis\", \"Quatenus Tu\")."
  was: "Qui se citatum seu potius ... Quatenus [s?]u ... de bonis suis Subditos qui praesent[e?] Cittone~ apud se Arestant statim"
  now: "Qui Te Citat seu potius ... Quatenus Tu ... de bonis Tuis Subditos qui praesenti Cittone~ apud Te Arestantur Statuas"
  english_was: "who, having presented himself as cited ... insofar as you ... hold under arrest at their place forthwith upon the present citation the laboring subjects of his estates"
  english_now: "who cites you ... to the effect that you ... produce the laboring subjects of your estates, who by the present citation are placed under arrest in your keeping"
- importance: significant
  what: "Nosalski's protest (leaves 359 and 359 verso), read whole. His people were carting trees \"on sledges\" (\"in Trahibus\", not beams); Prusimski's men \"did not blush to draw the penalties upon themselves\"; and what he offers is to prove the violence by inquiry and to have the two men SHUT OUT FROM GIVING TESTIMONY in the cause. The two are called \"Laboriosi\", working men (your \"ex Labris\", from the lips). He is \"Nosalski Thesaurarida Czerniechoviensis\", son of a treasurer of Czernihów, not treasurer of Czernichów."
  was: "in [T?]ra[b?]ibus arboris vechen~ ... cum Trachibus ... paenas insetrahere ... deductiorum a per hibendoque hac in Causa Testimonio relegatarum Complicitatemque delicti S[e/c]orsivis punitis probaturum ... ex Labris~ ... Martinus [P?]alski Thesauranda"
  now: "in Trahibus arbores vehentibus ... cum Trahibus ... paenas in se trahere ... deducturum a perhibendoque hac in Causa Testimonio relegaturum Complicitatemque delicti Seorsivis punctis probaturum ... ex Laboriosis ... Martinus Nosalski Thesaurarida"
  english_was: "carrying timber ... together with the timber ... they did not blush to inflict penalties [on them] ... through a full sworn inquiry of witnesses to be adduced and cited to give testimony in this cause — and the complicity in the offence, each to be punished separately"
  english_now: "carting trees on sledges ... together with the sledges ... they did not blush to draw the penalties wholly upon themselves ... through a full sworn inquiry, to have them shut out from giving testimony in this cause, and to prove their complicity in the offence in separate points"
- importance: fact
  what: "The judges of the Kalisz land court, in both citations to the Tribunal: Franciszek Wierusz Walknowski, judge; Stefan Zielonacki, sub-judge; Xawery Mikorski, notary (the bench named in the heading of the sitting of October 1777, 53/6/0/-/46). In the second citation Zielonacki is \"also judge at the condescension term\": your English had made that a fourth person."
  was: "Francisco Morzyz[?] Wallenow[la?] ... Xaverio Miliorzlu[?] / Francisco Wieriss[?] Wallinoryki[?] ... Judicio Xaverio [?]nilierski[?]"
  now: "Francisco Wierusz Walknowski ... Xaverio Mikorski / Francisco Wierusz Walknowski ... Judici Xaverio Mikorski"
- importance: fact
  what: "A line was passed over in the first citation to the Tribunal (leaf 54 verso): after \"Judicibus\" the scan has \"Gravaminosis De persona bonis ac Officio Vestris mandamus ut in Judiciis\". The judges are \"the judges complained of\", and the King commands them to appear."
  was: "Causa Infrascriptae Judicibus Nostri Ordinarii Tribunalis Regni"
  now: "Causae Infrascriptae Judicibus Gravaminosis De persona bonis ac Officio Vestris mandamus ut in Judiciis Nostris Ordinariis Tribunalis Regni"
- importance: fact
  what: "The boundary pine (leaf 58 verso): the name you read \"[T?]urnata\" and the word \"zwanym\" are written above the line with marks placing them after \"Kopcu\". It is the mound that is called so, not a second estate beside Trąbczyn."
  was: "na Granicy Dobr [T?]urnata Trąmpczyna ... na Kopcu Granicznym zwanym Trąmpczyn od Biskupia Dzielącym"
  now: "na Granicy Dobr Trąmpczyna ... na Kopcu [T?]urnata zwanym Granicznym Trąmpczyn od Biskupia Dzielącym"
- importance: fact
  what: "The report of 29 January 1779: the further stumps were \"pozcinanych\", cut down, by subjects of Rzgów (not \"recognised\"); and the twenty axes were taken from those subjects \"as they fled\" at night with the pines."
  was: "poddanych pozunanych ... pinaticis facientibus Intercepto"
  now: "poddanych pozcinanych ... pinaticis fugientibus Interceptas"
- importance: fact
  what: "Prusimski's protest noted at the end of the book (leaf 507 verso) is against the Nosalskis, the owners of Rzgów, not \"Wisalskie\"."
  was: "Contra Magnificis Wisalskie"
  now: "Contra Magnificos Nosalskie"
- importance: fact
  what: "Dates. On the pages: 7 March, 30 March and 15 April 1778; 29 January 1779. From headings you did not transcribe: Chełmski's citation of Prusimski to the land court, 25 April 1778 (top of leaf 78); Nosalski's protest, 1 May 1779 (leaf 358 verso). Inferred: Prusimski's first protest, March 1778; Chełmski's two protests and the report on the pine, between 1 and 3 April 1778; the note of the decree of remission, between 25 April and 6 May 1778; the note on leaf 507 verso, 1779."
  was: "1778, 1779"
  now: "see the dates on each document"
- importance: fact
  what: "Chełmski signed both his protests of April 1778 (leaves 57 verso and 58); the signatures are added."
  was: "(not transcribed)"
  now: "Stanisław Scibor Chełmski"
- importance: wording
  what: "Smaller readings: \"Sanus existens Recognovit se\"; \"vi Decreti\" (by force of the decree); \"peremptorie\"; \"contra M. Stanislaum Chełmski\" for \"[?] termino[?]\"; \"facta Manifestatio ex opposito Inserta\"; the heading \"contra MM. Chełmski et Judicium Terrestre Calissiense ad Tribunal Relatio\"; \"pro Judiciis Terrestribus\" for \"pro quidem\"; \"Quia Ipse\"; \"Officiosam Requisitionem\"; \"zas za kopcami\"; \"Ministerialis ... viginti ... Expressa\"; \"de receptis\"; Prusimski's signature \"Star: Nieszczewski\"."
  was: "Sanus [habens?] Recognovit[?] de / in Decreti / [?] termino[?] / pro quidem Terrestribus"
  now: "Sanus existens Recognovit se / vi Decreti / contra / pro Judiciis Terrestribus"
- importance: significant
  new: "full check, 2026-10-07"
  where: "Chełmski's two protests of April 1778, leaves 57 verso and 58"
  what: "The word you read as \"jurisdictio\" is \"juramento\", an OATH. The scan has \"jurto\" and \"jurtum\" with a mark. Chełmski says the decree of his commissioners of 1775 was confirmed \"by the oath performed at the last mound with neighbouring witnesses\" (\"juramento in ultimo scopulo cum vicinis Testibus expleto Authorisatum\"), and that Prusimski's commissioners acted after \"the oath sworn by the appearing party\", that is, by Chełmski himself. Lower on leaf 58 you read the same abbreviation as \"Juramentum\" yourself (\"oath against oath\"). The \"appearing party\" (\"veniens\") is Chełmski throughout; your English had \"the opposing party\" for it in several places."
  was: "conditum, jurisdictioni[?] in ultimo scopulo cum vicinis Testibus expleti[?] Authorisatum ... ac [pro/prae]stitum pro Venientem jurisdictionem[?] ... praestito pro Vn~tr in ultimo Aciali scopulo jurisdicti solidatos esse ... de prostito pro vn~tes ad formam Statuti in corroborationem eorundem jurisdictioni ad aequatam notitiam"
  now: "conditum, juramento in ultimo scopulo cum vicinis Testibus expleto Authorisatum ... ac praestitum per Venientem juramentum ... praestito per Vn~tem in ultimo Aciali scopulo juramento solidatos esse ... de praestito per vn~tem ad formam Statuti in corroborationem eorundem juramento adaequatam notitiam"
  english_was: "authorised with jurisdiction completed at the final mound with neighbouring witnesses ... after the mounds were erected and jurisdiction had been rendered for the opposing party ... with jurisdiction rendered for the opposing party at the final axial mound, had been firmly confirmed ... had received due notice of the jurisdiction rendered for those appearing"
  english_now: "authorised by the oath performed at the last mound with neighbouring witnesses ... after the mounds were erected and the oath sworn by the appearing party ... had been made firm by the oath sworn by the appearing party at the last axial mound ... had full notice of the oath sworn by the appearing party"
- importance: significant
  new: "full check, 2026-10-07"
  where: "Leaves 57 verso and 58"
  what: "\"Invalid\", not \"inviolable\". Chełmski argues that Prusimski, by not entering his commissioners' act in the records and not acting on it, \"himself acknowledged it as invalid\" (\"pro invalibili agnovisse\"); and that Czarnecki treated documents \"in one place as legitimate, in another as invalid\" (\"pro invalibilibus\"). Your English had \"inviolable\" in both places, which turns the argument round."
  was: "(the Latin is unchanged: pro invalibili agnovisse ... in altero pro invalibilibus)"
  now: "(the Latin is unchanged)"
  english_was: "had acknowledged that same act, which followed in his favour, as inviolable ... in one place as legitimate, in another as inviolable"
  english_now: "had acknowledged that same act, which followed in his favour, as invalid ... in one place as legitimate, in another as invalid"
- importance: significant
  new: "full check, 2026-10-07"
  where: "Prusimski's protest of 15 April 1778, leaf 71 verso"
  what: "Two passages where a line, or part of one, was passed over. (1) After \"Decreti Terrestris Calissiensis Coninensis\" a line is missing: Prusimski \"laid the same prosecutions before the sub-judge at the term of the sitting on the ground\". (2) Between two occurrences of \"Calissien\" these words are missing: Prusimski \"had sought and concluded that the remission of the cause to the Tribunal should be made by the sub-judge; for the same land judge, instead of making it ...\". What follows then reads differently: the judge sent the cause back \"to himself and the whole court, who were under prosecution\" and bound to stop judging it. Your English had Prusimski \"again prosecuting the sub-judge himself and the entire court\"."
  was: "Decreti Terrestris Calissiensis Coninensis Mgcum~ Subjudici reposuit et pro[u/c?]it totum Judicium ... Remissione Causae hujus ad Tribunal pro Magnificum Subjudicum Terrestre Calissien~ loco faciendae virtutae [pro/prae]missanon[?] Rationum Remissionis ... rursus ad se Ipsum totumque Judicium prosecutis et adisjudicatione Causae Istius[?]"
  now: "Decreti Terrestris Calissiensis Coninensis Actumque perficien[?] ejusdem Condescensionis Easdem prosecutiones in Termino Condescensionis Mgco~ Subjudici reposuit et prout totum Judicium ... Remissionem Causae hujus ad Tribunal per Magnificum Subjudicem Terrestrem Calissien~ faciendam esse Expetierat, et Concluserat, Nam Idem M. Judex Terrestris Calissien~ Loco faciendae virtute praemissarum Rationum Remissionis ... rursus ad se Ipsum totumque Judicium prosecutos et a dijudicatione Causae Istius"
  english_was: "he placed and brought the whole matter before the Honourable Sub-judge ... [and] the remission of this cause to the Tribunal, which the Honourable Sub-judge of the Kalisz Land Court ought to have made ... he again prosecuted the Sub-judge himself and the entire court; and [they], by force of law now obliged to desist from adjudication of that cause, improperly remitted it"
  english_now: "he laid the same prosecutions before the Honourable Sub-judge at the condescension term ... had sought and concluded that the remission of this cause to the Tribunal should be made by the Honourable Sub-judge of the Kalisz Land Court. For the same Honourable Land Judge of Kalisz, instead of making the remission to the Tribunal ... improperly made that remission back to himself and the whole court, who were under prosecution and by force of law already bound to desist from adjudicating that cause"
- importance: significant
  new: "full check, 2026-10-07"
  where: "The citation served on Prusimski, leaf 78 verso"
  what: "A line was passed over, and your \"Auris\" joined the end of one line to the start of the next but one. Chełmski cites Prusimski \"to see and hear the suit of himself the plaintiff, instituted against you, adjudged notwithstanding any protests and terms of yours\". The citation addresses Prusimski as \"you\" throughout (\"Tibi\", \"Te\", \"tuis\"), where your text had \"Sibi\", \"se\", \"suis\"; and it ends with the usual formula, \"Citatus sis pariturus Terminum attentaturus et Judicialiter responsurus\"."
  was: "et [s?]e Cittan~ parte ab altera prolatum ad citt~ adviden~ et Auris Manifestationibus et Terminis tuis ... super [s?]e decerni Statui et Sententiam proquo litaris lis parituriae[?] Terminum attentatioris[?] et Judicialiter responsumis"
  now: "et Te Cittum~ parte ab altera prolatum adcitt~ ad viden~ et Audien~ actoratum Sui Actoris tibi Institutum non obstantibus quibusvis Manifestationibus et Terminis tuis ... super Te decerni Statui et Sententiari proquo Citatus sis pariturus Terminum attentaturus et Judicialiter responsurus"
  english_was: "cites you to see and hear: your manifests and prosecution terms, if they had intervened, to be adjudicated in connection with the plaintiff's documents"
  english_now: "cites you to see and hear: the suit of himself the plaintiff, instituted against you, to be adjudged, notwithstanding any manifests and prosecution terms of yours, if such have intervened, in connection with the plaintiff's documents"
- importance: significant
  new: "full check, 2026-10-07"
  where: "The citation to the Tribunal, leaf 72 verso"
  what: "Who owed whom. The sums in question were \"contracted from the plaintiff's late uncle by the late Tracholz, and owed to the uncle\" (\"ab olim Magnifico Patruo Actoris per olim Honoratum Tracholz Contractae et Eidem debitae\"). Your English had it the other way round, the uncle borrowing from Tracholz. This agrees with leaf 55, where Tracholz is the uncle's debtor. If the papers show such a debt, Chełmski, who took over Tracholz's right, is to pay it to Prusimski."
  was: "(the Latin is unchanged, but for \"praetensio\" and \"Patruo\" without its mark of doubt)"
  now: "major praetensio et Summae ab olim Magnifico Patruo Actoris per olim Honoratum Tracholz Contractae et Eidem debitae"
  english_was: "a greater pretension and sums contracted by the late uncle of the plaintiff from the late Honest Tracholz and owed to him"
  english_now: "a greater pretension, and sums contracted by the late Honest Tracholz from the late uncle of the plaintiff and owed to the uncle"
- importance: fact
  new: "full check, 2026-10-07"
  where: "All the long entries"
  what: "One sign misread throughout: the clerk's \"p\" with a stroke through its tail is \"per\", where you wrote \"pro\". With an accusative it means \"by\". So the right was acquired \"by\" Chełmski from Tracholz (\"per Magnificum Chełmski ... quaesiti\"; your English \"acquired for\"); the decree of 1775 was given \"by\" Chełmski's commissioners; the inspection of 1592 was acknowledged \"by\" the then co-heirs of Trąbczyn; Czarnecki was engaged \"by\" Prusimski; and the term was not had \"by\" Chełmski. Corrected in about fifteen places."
  was: "Jure illegali pro M Chełmski ... pro Commissarios pro parte vn~tis conductos ... pro anteriores pro tunc Bonorum Trąpczyna cohaeredes ... pro JMcum~ Prusimski ... pro Magnificum Chełmsi non habito"
  now: "Jure illegali per M Chełmski ... per Commissarios pro parte vn~tis conductos ... per anteriores pro tunc Bonorum Trąpczyna cohaeredes ... per JMcum~ Prusimski ... per Magnificum Chełmski non habito"
- importance: fact
  new: "full check, 2026-10-07"
  where: "Leaf 54 verso"
  what: "In the first citation to the Tribunal, what is to be quashed is \"the transfer\" of Tracholz's right to Chełmski: \"Cassata Transfusione\", where you had \"Cassat[io?] Man[ifestationem?]\" and translated \"the cassation of the manifest\". The same words stand in full on leaves 55 verso and 72. The close of the citation is the usual \"quae Juris Justitiae ac Documentorum erunt\"; and the new law is cited \"ex praescripto novellae Legis\" (\"praescripto\" was passed over)."
  was: "Nihilominus Cassat[io?] Man[ifestationem?] seu Jure illegali pro M Chełmski a Famat[o?] Joanne Tracholz in debitae ... quae Iteris Jusitia[???] ac Documentorum [????] ... ex Novella Legis"
  now: "Nihilominus Cassata Transfusione seu Jure illegali per M Chełmski a Famato Joanne Tracholz indebite ... quae Juris Justitiae ac Documentorum erunt ... ex praescripto novellae Legis"
  english_was: "the cassation of the manifest or the illegal right acquired for the Honourable Chełmski from the Honest Jan Tracholz improperly"
  english_now: "the transfer, or right, unlawfully acquired by the Honourable Chełmski from the Honest Jan Tracholz, unduly ... being cassated"
- importance: fact
  new: "full check, 2026-10-07"
  where: "Chełmski's second protest, leaf 58"
  what: "Read whole. The inspection of 1592 was \"acknowledged by the then co-heirs of Trąbczyn\" and \"ordered to be observed in the delimitation\" (\"Observari\") by the Tribunal decrees of 1766 and 1768. Prusimski had \"full\" notice of the oath (\"perfecta\", your \"protecta\") and was \"little acquainted with his own boundaries\" (\"gra~erum\" is \"granicierum\"; your English \"grievances\"). Of his three fellow-swearers the second is \"lacking full sense\" (\"Sensu perfecto carentem\"; your \"Sensu praefato correntem\", \"running there under the aforesaid protection\"), and the third was \"taken to his side\" straight from Piotrków. The close is \"Qua ex re publice praemissa exponendo\", \"for which reason, publicly setting out the foregoing\": there is no \"Republic\" in it."
  was: "recognitae, pro anteriores ... authorisatae et Observati in dislimitatione injunctae intercesisse ... habita protecta ... attestatarum Juramentum contra Juramentorum offerre ... Alterum Sensu praefato correntem ... ad latus sui suscepitt[?] ... Qua ex republiae praemissa exponendo"
  now: "recognitae, per anteriores ... authorisatae et Observari in dislimitatione injunctae intercessisse ... habita perfecta ... attentatarum Juramentum contra Juramentum offerre ... Alterum Sensu perfecto carentem ... ad latus sui susceptum ... Qua ex re publice praemissa exponendo"
  english_was: "for the previous joint heirs of the estates of Trąbczyn at that time ... and the demarcation enjoined therein having been carried out ... not even being aware of his own grievances, as he rarely is ... another running there under the aforesaid protection ... Having set out these matters as contrary to the Republic"
  english_now: "an inspection acknowledged by the then co-heirs of the estates of Trąbczyn ... and ordered to be observed in the delimitation ... being little acquainted even with his own boundaries, which were seldom gone over in his presence ... another lacking full sense ... For which reason, publicly setting out the foregoing"
- importance: fact

  was: "post dislimitationem prolatam ... pro Cognata[xa?] JMcae~ Capitanei ... Id eo futurae contrariae inter praeta~ori subveniendo ... Ad Acta propriis Palt~us in tempore per Oblatam porrectus verite et legitime"

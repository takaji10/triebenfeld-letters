    "7": la
    "8": la
    "9": la
    "10": la
    "11": "la,pl"
    "12": la
    "13": la

  duplicate_of: {}
  split_note: {}
  relations: {}

  # The estate the document is ABOUT, as slugs from reference/places.yml.
  estates:

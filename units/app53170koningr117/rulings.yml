# The long Latin entries are a first reading of a heavily abbreviated hand
# and still carry many words in doubt; they had only the light check
# (intake/holding.py). The reader is told so on the document's page.
rough:
  letters: ["2", "3", "4", "5", "7", "8", "9"]

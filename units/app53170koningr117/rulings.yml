# Editorial rulings for 53/17/0/-/Konin Gr.117 (APP).
#
# Thirteen documents, one for each entry of the register
# (docs/PRUSIMSKI_ERA_PLAN.md, "One document or many"). Document 3 is the
# note of Prusimski's protest on leaf 54 verso with the text it points to,
# "ex opposito", on leaf 55. Which entry is which is in intake/holding.py.
# Established 2026-10-07.

places:
  # Place of writing: every sitting is headed "Actum in Conin".
  overrides:
    "1": Konin
    "2": Konin
    "3": Konin
    "4": Konin
    "5": Konin
    "6": Konin
    "7": Konin
    "8": Konin
    "9": Konin
    "10": Konin
    "11": Konin
    "12": Konin
    "13": Konin

dates:
  # [year, month, day, precision]; read off the document: the line "Actum in
  # Conin ..." directly above the entry, which the editor transcribed with it.
  read:
    "1": [1778, 3, 7, "day"]      # Sabbatho post Cineres proximo Die Scilicet 7ma Mensis Martii 1778
    "2": [1778, 3, 30, "day"]     # Feria Secunda post Dominicam Laetare ... Die Trigesima Mensis Martii 1778
    "7": [1778, 4, 15, "day"]     # Feria Quarta post Dominicam Ramis Palmarum ... Die 15 Mensis Aprilis 1778
    "11": [1779, 1, 29, "day"]    # Feria Sexta post Festum Conversionis Sancti Pauli ... Die 29 mensis Januarii 1779
  supplied: {}
  twin: {}

  # [year, month, day, precision, basis]; the basis is shown to the reader.
  # Entries with no heading of a sitting on a photographed page.
  inferred:
    "3": [1778, 3, null, "month", "Entered on leaf 54 verso above the heading of the sitting of 30 March 1778 and after that of 7 March (leaf 35); the heading of its own sitting is on a page not among the scans."]
    "4": [1778, 4, null, "month", "Entered on leaves 57 verso to 58 verso, between the headings of the sittings of 1 April 1778 (leaf 56) and 3 April 1778 (foot of leaf 58 verso). Leaf 57 recto, where a heading of 2 April could stand, is not among the scans."]
    "5": [1778, 4, null, "month", "Entered on leaves 57 verso to 58 verso, between the headings of the sittings of 1 April 1778 (leaf 56) and 3 April 1778 (foot of leaf 58 verso). Leaf 57 recto, where a heading of 2 April could stand, is not among the scans."]
    "6": [1778, 4, null, "month", "Entered on leaves 57 verso to 58 verso, between the headings of the sittings of 1 April 1778 (leaf 56) and 3 April 1778 (foot of leaf 58 verso). Leaf 57 recto, where a heading of 2 April could stand, is not among the scans."]
    "10": [1778, null, null, "year", "Entered at the top of leaf 82 verso, between the headings of the sittings of 25 April 1778 (leaf 78) and 6 May 1778 (leaf 83); the heading of its own sitting is on a page not among the scans."]
    "13": [1779, null, null, "year", "Entered on leaf 507 verso of the book for 1778 and 1779, well after the sitting of 1 May 1779 (leaf 358 verso). The heading of the sitting at the top of the page is cut off by the edge of the photograph."]

  # The date of the sitting the entry stands under, where the heading is not
  # directly above it and is not part of the transcription:
  # [year, month, day, precision, basis].
  sitting:
    "8": [1778, 4, 15, "day", "The heading of the sitting is on leaf 71, above the entry before this one: the Wednesday after Palm Sunday 1778, 'Die 15 Mensis Aprilis'."]
    "9": [1778, 4, 25, "day", "The heading of the sitting, at the top of the same page: the Saturday after Easter 1778, 'Die Vigesima Quinta Mensis Aprilis'."]
    "12": [1779, 5, 1, "day", "The heading of the sitting is on the facing page, leaf 358 verso: the Saturday after Jubilate Sunday 1779, 'Prima mensis Maji'."]
  no_date: []

documents:
  # report: a court messenger's "relatio" (of a citation served, or of
  # something inspected); protest: a "manifestatio"; note: a one-line
  # register note.
  doc_type:
    "1": report
    "2": report
    "3": protest
    "4": protest
    "5": protest
    "6": report
    "7": protest
    "8": report
    "9": report
    "10": note
    "11": report
    "12": protest
    "13": note

  language:
    "1": la

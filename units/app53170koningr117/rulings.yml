  by_paragraph: ["0035_a2", "0055_a1", "0055_a2", "0056_a1", "0058_a1", "0058_a2", "0059_a1", "0071_a2", "0072_a1", "0072_a2", "0073_a1", "0078_a2", "0079_a1", "0083_a1", "0272_a2", "0359_a2", "0360_a1", "0508_a1"]

damage:

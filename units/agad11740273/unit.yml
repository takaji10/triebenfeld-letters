# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: keep that, if wanted, as archive_title.
title: >-
  Four papers of July 1807 from the files of the Governing Commission, the
  provisional Polish government set up under Napoleon, while it sat at
  Dresden: Michalina Dąbska, born Prusimska, petitions the commission and the
  Emperor for the return of her father's confiscated estates, among them
  Trąbczyn, which Prussia had given to Prince Friedrich Ludwig of
  Hohenlohe-Ingelfingen, and the commission resolves on 21 July 1807 that
  they are to go back to her.
title_de: >-
  Vier Stücke vom Juli 1807 aus den Akten der Regierungskommission, der unter
  Napoleon eingesetzten provisorischen polnischen Regierung, während ihres
  Aufenthalts in Dresden: Michalina Dąbska, geborene Prusimska, bittet die
  Kommission und den Kaiser um die Rückgabe der konfiszierten Güter ihres
  Vaters, darunter Trąbczyn, die Preußen dem Fürsten Friedrich Ludwig zu
  Hohenlohe-Ingelfingen geschenkt hatte, und die Kommission beschließt am
  21. Juli 1807, dass sie an sie zurückfallen.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Four papers from the files of the Governing Commission (Komisja Rządząca),
  the provisional government of the Polish lands taken from Prussia in the
  war of 1806 and 1807, written while the commission was at Dresden in July
  1807. Michalina Dąbska, born Prusimska, the daughter of the Starost Antoni
  Prusimski, asks for the estates Prussia confiscated from her father and
  gave to Prussian generals: Trąbczyn in the department of Kalisz, and
  Kamionna, Kolno, Pawłowo and other property in the department of Poznań.
  She petitions the commission in Polish on 20 July and the Emperor Napoleon
  in French on 21 July, pointing to his decree of 5 June 1807 that restored
  the estates of Józef Wybicki, a member of the commission. The commission's
  draft resolution of 21 July 1807 extends that decree to her, to General
  Niemojewski and to Wichrowski. On 23 July she asks the commission to have
  its resolution carried out as the decree for Wybicki was, by an order to
  the administrative chambers to put her in possession. Three documents are
  Polish and one is French; each petition carries the commission's note of
  the day it was presented.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Polish in the spelling of 1807 (y and i for j, as in "Rządzącey", "iaki";
  accents often omitted), and one petition in French. The text is transcribed
  by paragraph, not line by line. Abbreviated forms of address stand as
  written: "JW." is Jaśnie Wielmożny, "JP." and "JPani" Jaśnie Pan and Jaśnie
  Pani, "N° Cesarza" Nayiaśnieyszego Cesarza (the Most Serene Emperor,
  Napoleon), "Jego C°K. Mość" His Imperial and Royal Majesty, "W. X[ię]cia
  Dyrektora Woyny" the Prince Director of War, "JMci Panu" and "JWWMci Panu"
  forms of "Sir" in an address, "a. c." of this year. "Kommissya Rządząca" is
  the Governing Commission. "Dambska" and "Dąbska" are one name, her first
  married name. "Zanitz" is the Prussian general von Sanitz. Document 1 is a
  draft with words struck out and written in; the transcription gives the
  text as corrected. The line beginning "Presentatum" or "Praesent." at the
  foot of a petition is the commission's note of the day it was presented,
  and "St[anisław] Mał[achowski]" the paraph of its president. A word followed
  by [?] is one the transcriber was unsure of.

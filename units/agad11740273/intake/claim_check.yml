- {claim: "sie dehnt das Urteil auf Michalina Dąbska, General Niemojewski und Wichrowski aus", verdict: supported, where: "p. 1"}
- {claim: "deren konfiszierte Erbgüter sollen an ihre wahren Eigentümer zurückfallen", verdict: supported, where: "p. 1"}

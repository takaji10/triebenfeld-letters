  en: |-
    The Governing Commission

    Whereas the matter of Mrs Michalina Dąbska, née Pru[simska], who demands the return of her hereditary Estates, confiscated under the past Government and given to someone else, has been referred to Us by the Most Serene Emperor; taking example from the justice dispensed by His Imperial and Royal Majesty to the Most Illustrious Wybicki, Our Colleague, by the Decree issued at Finckenstein on the [5]th of June, and wishing in so just a demand to preserve strict justice for everyone, We extend the Judgment of the Most Serene Emperor in favour of the Most Illustrious Wybicki both to the case of Mrs Michalina Dąbska and to those of General Niemoiewski and Mr Wichrowski, desiring that the Hereditary Estates of the Persons named above, confiscated by the late Prussian Government, should return to their true Owners. — Done at Dresden, 21 July 1807.

    St[anisław] Mał[achowski]

agad11740273-001: "Entwurf eines Beschlusses der Regierungskommission, in Dresden gefasst, in polnischer Sprache. Die Sache der Michalina Dąbska, geborene Prusimska, die die Rückgabe ihrer unter der früheren Regierung konfiszierten und anderen übergebenen Erbgüter verlangt, ist der Kommission vom Kaiser überwiesen worden. Die Kommission nimmt sich die Gerechtigkeit zum Vorbild, die der Kaiser ihrem Mitglied Wybicki durch das in Finckenstein erlassene Dekret vom Juni erwiesen hat, und dehnt dieses Urteil auf den Fall der Michalina Dąbska, des Generals Niemojewski und Wichrowskis aus: Die von der früheren preußischen Regierung konfiszierten Erbgüter dieser Personen sollen an ihre wahren Eigentümer zurückfallen. Der Entwurf ist an mehreren Stellen verbessert und trägt die Paraphe des Präsidenten Małachowski."
agad11740273-002: "Michalina Dąbska, geborene Prusimska, schreibt in Dresden an die Regierungskommission, in polnischer Sprache. Sie habe schon zweimal um die Rückgabe der Güter gebeten, die ihrem Vater zugunsten der preußischen Generale Fürst Hohenlohe, Bischoffswerder und Sanitz konfisziert wurden: Trąbczyn im Departement Kalisz sowie Kamionna, Kolno, Pawłowo, Pawłówko und ein Magazin in einem Ort, der „Wrocławek“ geschrieben ist, im Departement Poznań. Eine Antwort habe sie noch nicht erhalten. Da sie wisse, dass Wybicki seine ebenso konfiszierten Güter vom Kaiser zurückerhalten hat, bittet sie die Kommission, sich für sie zu verwenden und ihr Gelegenheit zu geben, ein gleiches Urteil zu erlangen. Die Kommission vermerkt die Vorlage am 21. Juli."
agad11740273-003: "Michalina Dąbska, geborene Prusimska, bittet in Dresden den Kaiser Napoleon auf Französisch. Sie habe ihm ihre Beschwerden und Hoffnungen schon über die polnische Regierung vorlegen lassen, bisher aber nichts von einem Dekret erfahren, das sie wieder in die Güter einsetzt, die zugunsten der preußischen Generale Fürst Hohenlohe, Bischoffswerder und Sanitz konfisziert wurden. Sie sei überzeugt, dass ihr dieselbe Gerechtigkeit zuteilwerde, die den Grafen Wybicki in seine Besitzungen wieder eingesetzt hat, und bittet den Kaiser, sie ihr nicht zu verweigern. Nach dem Vermerk der Kommission wurde die Bittschrift am 21. Juli 1807 in einer außerordentlichen Sitzung in Dresden vom Fürsten, dem Kriegsdirektor, auf Befehl des Kaisers vorgelegt; der Vermerk trägt die Paraphe des Präsidenten Małachowski, an den das Blatt auf der Rückseite adressiert ist."
agad11740273-004: "Michalina Dąbska, geborene Prusimska, schreibt in Dresden erneut an die Regierungskommission, in polnischer Sprache. Das Dekret des Kaisers vom 5. Juni, das Wybicki die von der preußischen Regierung konfiszierten und vergebenen Güter zurückgab, sei zum Grundsatz und Muster genommen worden, um den Personen, die im Dekret der Kommission vom 21. Juli genannt sind, gleiche Gerechtigkeit zu erweisen. Sie zweifle nicht, dass die Kommission ihren Beschluss ebenso ausführen lasse wie für Wybicki und die Direktion der inneren Angelegenheiten anweise, den Verwaltungskammern die Einweisung in die Güter zu befehlen. Die Kommission vermerkt die Vorlage am 23. Juli 1807 und legt das Schreiben zu den Akten."

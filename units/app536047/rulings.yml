  overrides:
    "1": Konin

dates:
  # [year, month, day, precision]; read off the document.
  read: {}
  supplied: {}
  twin: {}
  inferred: {}

  # The date of the sitting the entry stands under:
  # [year, month, day, precision, basis]; the basis is shown to the reader.
  # The heading, which the editor transcribed, is on leaf 213: "Feria Secunda
  # post Festum Sanctae Haedvigis ... Die vigesima mensis Octobris Anno
  # Domini Millesimo Septingentesimo Octuagesimo Tertio in Conin Celebratis".
  # Entry no. 26 stands twenty-six leaves on; a sitting ran for weeks, so
  # only the year is claimed.
  sitting:
    "1": [1783, null, null, "year", "The sitting opened at Konin on 20 October 1783. Its heading is on leaf 213, which is not among the scans; the entry itself, no. 26 of the sitting, has no date."]

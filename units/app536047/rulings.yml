# Editorial rulings for 53/6/0/-/47 (APP).
#
# One document: entry no. 26 of the sitting, which fills leaf 239 verso and
# leaf 240 and ends on leaf 236 verso (the clerk's own directions: "Videatur
# Continuatio sub No 22do", "Continuatio ex No 26to"). A second entry that
# the editor photographed, no. 43 on leaf 295 verso, is not transcribed and
# not built (docs/PRUSIMSKI_QUESTIONS.md). Established 2026-10-07.

places:

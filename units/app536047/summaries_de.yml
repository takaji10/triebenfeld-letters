# German summaries of APP 53/6/0/-/47, written in the working session from the Latin as checked
# (intake/holding.py, 2026-10-07).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app536047-001: "Dekret des Kalischer Landgerichts in Konin von 1783, Eintrag Nr. 26 seiner Sitzung, zwischen Stanisław Chełmski, Schatzmeister des Landes Wschowa, als Kläger und Antoni Prusimski von Kolno, Starost von Niszczewice, als Geladenem. Chełmski hält Prusimski eine Verurteilung entgegen, die er 1780 beim Ortstermin auf dem Gut Grab wegen Verstoßes gegen ein Tribunalsdekret gegen ihn erwirkt hat. Prusimski weist sein Recht, gehört zu werden, nicht nach und unterwirft sich dem Ermessen des Gerichts; es legt ihm eine Geldbuße auf, lässt ihn zur Sache zu und ordnet Verhöre beeideter Zeugen an, weil es um Gewalttaten geht. Aus den Verhören ergibt sich: Leute vom Hof Prusimskis aus Trąbczyn kamen, vom Weg abgeirrt, zur Wüstung Smoleniec, die zu Chełmskis Erbgut Łukom gehört, ließen sich den Weg zeigen und fragten den Olęder Jan Kłonica, wem das Dorf gehöre. Als Kłonica sagte, diese Olęder gehörten Chełmski, schalt ihn Prusimskis Unterkutscher einen Lügner und schlug ihn mit der Peitsche; der Kutscher schlug ihn mit einem Kiefernstock, der dabei zerbrach, und der Unterkutscher schrie, man solle ihn totschlagen; Kłonica floh in ein Erlengehölz. Die Leute wandten sich darauf zum Haus des Olęders, holten dort gewaltsam einen Knecht, schlugen ihn und schlugen ihn weiter auf dem Weg zum Krug von Tomice; er kam erst am folgenden Tag nach Hause. Ein Zeuge beschwerte sich noch am selben Tag bei Prusimski, der denselben Weg kam; Prusimski versprach, die Sache zu Hause zu bereinigen. Die Taten geschahen auf Chełmskis eigenem Grund; ob mit Wissen oder auf Befehl Prusimskis, klären die Verhöre nicht, und Kutscher und Unterkutscher sind in Trąbczyn nicht zu finden. Beschuldigt sind nach den Verhören nur der Kutscher Józef und der Unterkutscher Walenty; Prusimski erklärt, er könne sie nicht stellen, und bietet einen Reinigungseid an. Das Gericht legt ihm auf, binnen sechs Wochen vor dem Burgamt Konin zu beschwören, dass der von Chełmski erwirkte Arrest die beiden nicht erreicht hat und er sie nicht stellen kann, bei Strafe der Verbannung. Die Verhörprotokolle bleiben in der Kanzlei und werden den Parteien gegen Quittung herausgegeben."
app536047-002: "Dekret des Kalischer Landgerichts in Konin, Eintrag Nr. 43 der Sitzung, die am 3. Mai 1784 begann. Parteien sind Michał Drogosław Skórzewski, Unterkämmerer von Posen und Erbherr von Biskupie oder Bystrzyca, und Stanisław Ścibor Chełmski, Schatzmeister von Wschowa und Erbherr von Łukomia und Łomowa, jeder zugleich Kläger und Geladener; mit ihnen geladen sind Franciszek Stadnicki, Starost von Ostrzeszów, samt seinen Kindern mit der verstorbenen Teresa, geborene Wężyk, und Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn. Prusimski wird die Verurteilung entgegengehalten, die Chełmski beim Ortstermin in Grab am 11. September 1780 wegen Zuwiderhandlung gegen das Tribunalsdekret erwirkt hat. Eine am Donnerstag nach Cantate 1783 in Pyzdry ausgestellte Vollmacht wird als ausreichend befunden; Prusimski weist sein Recht, gehört zu werden, nicht nach und unterwirft sich dem Gericht, das ihn gegen Zahlung einer halben Buße an die Gegenseite und einer Viertelbuße an das Gericht zulässt. Zur Sache: Weil die Parteien einander wegen der Abgrenzung von Biskupice oder Bystrzyca gegen Łomowa oder Łukom vor Gericht gebracht haben, hält das Gericht einen Ortstermin auf dem strittigen Grund für nötig, am 16. Juli des laufenden Jahres. Für die Grenze sollen die Parteien den Unterkämmerer des Kalischer Distrikts oder sein Feldamt gewinnen; für die Gewalttaten und Schäden sollen sie das Gericht selbst oder einen der Kämmerer beiziehen, der untersuchen, Eide abnehmen und den Ersatz festsetzen soll. Die Parteien haben bei Strafe der Verbannung zu gehorchen und auch die Anrainer zu laden."

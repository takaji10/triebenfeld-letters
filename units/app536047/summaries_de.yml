app536047-001: "Dekret des Kalischer Landgerichts in Konin von 1783, Eintrag Nr. 26 seiner Sitzung, zwischen Stanisław Chełmski, Schatzmeister des Landes Wschowa, als Kläger und Antoni Prusimski von Kolno, Starost von Niszczewice, als Geladenem. Chełmski hält Prusimski eine Verurteilung entgegen, die er 1780 beim Ortstermin auf dem Gut Grab wegen Verstoßes gegen ein Tribunalsdekret gegen ihn erwirkt hat. Prusimski weist sein Recht, gehört zu werden, nicht nach und unterwirft sich dem Ermessen des Gerichts; es legt ihm eine Geldbuße auf, lässt ihn zur Sache zu und ordnet Verhöre beeideter Zeugen an, weil es um Gewalttaten geht. Aus den Verhören ergibt sich: Leute vom Hof Prusimskis aus Trąbczyn kamen, vom Weg abgeirrt, zur Wüstung Smoleniec, die zu Chełmskis Erbgut Łukom gehört, ließen sich den Weg zeigen und fragten den Olęder Jan Kłonica, wem das Dorf gehöre. Als Kłonica sagte, diese Olęder gehörten Chełmski, schalt ihn Prusimskis Unterkutscher einen Lügner und schlug ihn mit der Peitsche; der Kutscher schlug ihn mit einem Kiefernstock, der dabei zerbrach, und der Unterkutscher schrie, man solle ihn totschlagen; Kłonica floh in ein Erlengehölz. Die Leute wandten sich darauf zum Haus des Olęders, holten dort gewaltsam einen Knecht, schlugen ihn und schlugen ihn weiter auf dem Weg zum Krug von Tomice; er kam erst am folgenden Tag nach Hause. Ein Zeuge beschwerte sich noch am selben Tag bei Prusimski, der denselben Weg kam; Prusimski versprach, die Sache zu Hause zu bereinigen. Die Taten geschahen auf Chełmskis eigenem Grund; ob mit Wissen oder auf Befehl Prusimskis, klären die Verhöre nicht, und Kutscher und Unterkutscher sind in Trąbczyn nicht zu finden. Beschuldigt sind nach den Verhören nur der Kutscher Józef und der Unterkutscher Walenty; Prusimski erklärt, er könne sie nicht stellen, und bietet einen Reinigungseid an. Das Gericht legt ihm auf, binnen sechs Wochen vor dem Burgamt Konin zu beschwören, dass er der von Chełmski betriebenen Festnahme der beiden nicht zuvorgekommen ist und sie nicht stellen kann, bei Strafe der Verbannung. Die Verhörprotokolle bleiben in der Kanzlei und werden den Parteien gegen Quittung herausgegeben."

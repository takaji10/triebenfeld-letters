# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry, no. 26 of its sitting, in a book of decrees of the land court of
  Kalisz sitting at Konin, in Latin, from the sitting that opened on 20
  October 1783. Stanisław Chełmski, Treasurer of the land of Wschowa,
  plaintiff, against Antoni Prusimski of Kolno, Starost of Niszczewice. The
  court first deals with a condemnation that Chełmski had obtained against
  Prusimski at the sitting on the ground at Grab in 1780, lets Prusimski be
  heard on payment of a penalty, and orders inquiries with sworn witnesses.
  From them it finds that men of Prusimski's household from Trąbczyn, off
  their road at the deserted settlement of Smoleniec on Chełmski's Łukom, beat
  the Olęder settler Jan Kłonica and a servant; that the inquiries do not show
  whether Prusimski knew or ordered it; and that the coachman Józef and the
  under-coachman Walenty, who alone are accused, are no longer at Trąbczyn.
  Prusimski is to swear within six weeks at the castle office of Konin that the arrest did not reach them and that he cannot produce them.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  An entry of a book of decrees of 1783, in formulaic and abbreviated Latin,
  read from a microfilm. The English is the editor's own translation. "Locus
  standi" is the right to be heard; "vadium" a money penalty; "inquisitio" an
  examination of sworn witnesses; "Hollandus" an Olęder settler; "evasio"
  clearing oneself by oath; "rotha" the form of an oath.

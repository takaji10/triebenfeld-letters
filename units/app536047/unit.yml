title: >-
  Two decrees of the land court at Konin: one of 1783 on an assault, in which
  men of Antoni Prusimski's household beat an Olęder settler of Chełmski's
  and a servant at Smoleniec and Prusimski is put to an oath that he cannot
  produce the two men accused; and one of 1784 fixing a hearing on the ground
  to mark the boundary between Chełmski's Łomów and Skórzewski's Biskupice.
title_de: >-
  Zwei Dekrete des Landgerichts in Konin: eines von 1783 über einen Überfall,
  bei dem Leute vom Hof Antoni Prusimskis in Smoleniec einen Olęder Chełmskis
  und einen Knecht schlugen und Prusimski der Eid auferlegt wird, dass er die
  beiden Beschuldigten nicht stellen kann; und eines von 1784, das einen
  Ortstermin zur Abgrenzung von Chełmskis Łomów gegen Skórzewskis Biskupice
  ansetzt.

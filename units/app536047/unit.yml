# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  A decree of the land court at Konin of 1783 on an assault: men of Antoni
  Prusimski's household, having lost their way, beat an Olęder settler of
  Chełmski's and a servant at Smoleniec; the court finds only the coachman and
  under-coachman accused and puts Prusimski to an oath that the arrest did not reach them and that he cannot produce them.
title_de: >-
  Ein Dekret des Landgerichts in Konin von 1783 über einen Überfall: Leute vom
  Hof Antoni Prusimskis, die sich verirrt hatten, schlugen in Smoleniec einen
  Olęder Chełmskis und einen Knecht; das Gericht sieht nur den Kutscher und
  den Unterkutscher beschuldigt und legt Prusimski den Eid auf, dass der Arrest sie nicht erreicht hat und er sie nicht stellen kann.

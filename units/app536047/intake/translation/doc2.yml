  en: 'No. 43: Between the Illustrious Right Honourable Michał Drogosław Skórzewski, Sub-chamberlain of
    Poznań, Knight of the Orders of Saint Stanislaus and Saint Anne, heir of the estates of Biskupie or
    Bystrzyca, Plaintiff and Cited, through the Honourable Józef Stablewski; the Right Honourable Stanisław
    Ścibor Chełmski, Treasurer of Wschowa, heir of the estates of Łukomia and Łomowa, Cited and Plaintiff,
    through the Honourable Konstanty Suchodolski; the Illustrious Right Honourable Franciszek, Count of
    Stadniki, Stadnicki, Starost of Ostrzeszów, Knight of the Order of Saint Stanislaus, [heir] of the
    estates of [uncertain: Królików], Biała and Lądek, and the successors of the late Right Honourable
    Teresa, born Wężyk, begotten with the same Illustrious Right Honourable Stadnicki, heirs and possessors
    of the above-written estates, Cited, through the Honourable Antoni Miroszewski; [and] the Illustrious
    Right Honourable Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanislaus, heir
    of the estates of Trąbczyn with appurtenances, Cited, through the Honourable Wojciech Żeromski —


    regarding the objected condemnation, obtained and published at the condescension term held on the
    ground of the estates of the village of Grab on the eleventh day of the month of September in the
    year 1780, [uncertain: on the part] of the Right Honourable Chełmski, Treasurer of Wschowa, against
    the Illustrious Right Honourable Prusimski, Starost of Niszczewice, to his advantage, for contravention
    of the Tribunal''s Decree: the Court holds that the party objecting on behalf of the Right Honourable
    Chełmski is bound to produce a proxy in order to object the condemnation. And since a proxy made before
    the records of the Pyzdry Municipal Court on Thursday after Cantate Sunday in the year 1783 is laid
    down, a sufficient proxy being therefore found, the Court decrees that the same Illustrious Right
    Honourable Prusimski, Starost of Niszczewice, shall show his right of standing forthwith; and since
    he does not show it, but rather submits himself to the moderation of its judgement,'

  marker_count: 0
  en: 'therefore, for the establishment of his right of standing, he shall pay: to the objecting party,
    with recovery from the same reserved, half of a capital bail; but to the Court half of a half bail,
    forthwith, under penalty of banishment, to be published at the close of the sessions. Meanwhile the
    Court declares that he has the right of standing, and orders the trial.


    In the trial, deciding the terms of the parties, and their controversies having been heard: since
    the parties bring one another before the present Court for the delimitation of the estates of Biskupice
    or Bystrzyca from the estates of Łomowa or Łukom, the Court therefore finds that, for the delimitation
    of those estates, a condescension to the field, on the disputed ground between the aforesaid estates,
    is necessary, on and for the 16th day of the month of July next coming in the present year — ruling
    that the parties shall obtain for the above-written term the Illustrious Right Honourable Sub-chamberlain
    of the District of Kalisz, or his field office; but, as to the cause of the acts of violence and damages,
    shall bring for the same term its own Court, the absence of one or two notwithstanding, or one of
    the Honourable Boundary Surveyors [two words not fully read: "legitime praeven~"]. Which court, or
    he who comes to the condescension, shall inquire into the acts of violence and damages, and shall
    receive oaths; shall decree the compensation to be made, to whom, by whom and how much shall be due;
    and shall conduct inquisitions, fix terms, attach rigours, and shall decide, adjudge and moderate
    the present cause according to the contents of the parties'' terms and manifests. Whose decision —
    as to the boundary cause, that of the Illustrious Right Honourable Sub-chamberlain; as to the cause
    of fact, that of its own Court or of the Honourable Boundary Surveyors — they shall be bound and obliged
    to obey and acquiesce in, under penalty of banishment, to be published upon the contravening party
    at that term, before the same [judges] of the condescension. The penalty of fourteen Polish marks
    having been paid — to be set off party against party, and to its own Court paid by halves by each
    party, under the usual rigour, to be extended from the register of penalties. For which condescension
    term the parties shall cite those whom the matter requires, and also the neighbours; those cited shall
    appear under the above-written penalty of banishment.'

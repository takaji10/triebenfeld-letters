- page: 2
  confidence: high
  marker_count: 0
  en: 'the Court suspends until the reading of the Inquisitions. The Right Honourable Chełmski, Treasurer
    of Wschowa, Plaintiff, and the Illustrious Right Honourable Prusimski, Starost of Niszczewice, judicially
    rendered the Oath concerning the uncorrupted testimony of the witnesses. Both Parties dispatched the
    Inquisitions and deposited the same. The Court therefore betook itself to the reading of the same,
    from which, having been read, it is deduced:


    That men, serving the household of the Illustrious Right Honourable Prusimski, from the estate of
    Trąpczyn — having strayed from the road — arrived at the deserted tract of Smoleniec, pertaining to
    the more principal hereditary estates of Łukom of the Right Honourable Chełmski; and there ordered
    that the road by which they ought to depart be shown to them; and asked the Laboriosus Jan Kłonica,
    a Hollander, whose village this might be? And when the same Laboriosus Kłonica reported that these
    very Hollanders belonged to the Right Honourable Chełmski, the Under-coachman of the Illustrious Right
    Honourable Prusimski reproached the same Hollander for lying, and struck him with a whip; and that
    by the Coachman too, the same Hollander was beaten with a broken pine-wood stick; and moreover that
    the Under-coachman immediately shouted out that he should be struck and killed; that after these things
    had been carried out, the same Hollander fled into an alder grove; but that the aforementioned men
    of the Illustrious Right Honourable Prusimski turned themselves toward the house of the same Hollander,
    and there violently seized a servant from the hill, beat him soundly, and ordered him to be led to
    the Tavern of Tomice; and that on the road the same servant was continually beaten by them; and that
    only now, on the following day, the aforesaid servant returned home; and that on this very day, to
    the Illustrious Right Honourable Prusimski, travelling along the same road, one witness complained
    of the above-described violence; and that the Illustrious Right Honourable Prusimski promised, at
    home, to facilitate this matter; and that these acts, moreover, carried out on the Right Honourable
    Chełmski''s own land, had turned out to have been done violently — whether, however, they had been
    carried out with the knowledge or order of the Illustrious Right Honourable Prusimski?


    See the continuation under No. 22.'

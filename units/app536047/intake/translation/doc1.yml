  en: 'No. 26: Between the Right Honourable Stanisław Chełmski, Treasurer of the Land of Wschowa, Plaintiff,
    [represented] by the Honourable Józef Stablewski, [and] the Illustrious Right Honourable Antoni of
    Kolno Prusimski, Starost of Niszczewice, Defendant, [represented] by the Honourable Wojciech Żeromski
    — regarding the objected condemnation at the estate of the village of Grab, on Monday after the Feast
    of the Nativity of the Blessed Virgin Mary in the year 1780 — on the part of the Right Honourable
    Chełmski, Treasurer of Wschowa, against the Illustrious Right Honourable Prusimski, to his advantage,
    for contravention of the Tribunal''s Decree, obtained and published: the Court holds that a proxy
    is to be produced on the part of the objecting party; and since he produces one, it therefore finds
    the Illustrious Right Honourable Prusimski bound to show his right of standing; and since he does
    not show it, but rather submits himself to the moderation of its judgement, therefore the Court decrees
    that the Illustrious Right Honourable Prusimski, Starost of Niszczewice, upon the establishment of
    his right of standing, shall pay and reckon out: to the objecting party, half of the Starost''s Court
    bail; but to the Court, two [marks], by half, forthwith, under penalty of banishment, to be published
    in the determination of their courts. And meanwhile the Court finds the same Illustrious Right Honourable
    Starost of Niszczewice to have the right of standing, and commits the matter to trial; in which trial,
    since the present cause, with respect to the objected acts of violence, comes to be adjudicated, the
    Court therefore decrees that the Parties shall conduct and dispatch Inquisitions concerning the contents
    of the Term of the Plaintiff Party and the manifests of both Parties, during the continuance of its
    court sessions, interrogatories having first been drawn up and communicated to each other, and the
    oath on the uncorrupted [state] of the witnesses having been taken — with a Court Summoner appointed
    for the pronouncing of the form of the Oath; the production of the accused comprehended within the
    Term of the Plaintiff Party'

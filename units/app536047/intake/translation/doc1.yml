- page: 3
  confidence: high
  marker_count: 0
  en: 'Continuation of No. 26.


    The Inquisitions explained this not at all; and likewise the same Inquisitions reported that the Coachman
    and the Under-coachman, the perpetrators of the above-written acts, are not found within the estate
    of Trąpczyn. Wherefore the Court, having taken note of the foregoing findings — since only the Laboriosi
    Józef the Coachman and Walenty the Under-coachman are accused, by the Inquisitions, of the violent
    act, but now, since the Illustrious Right Honourable Starost of Niszczewice is in no way able to produce
    the aforesaid Coachman and Under-coachman, and declares before his own Court that the same were not
    apprehended by arrest — and on that account, a Manifest having been lodged before the Records of the
    Konin Municipal Court, during the sitting of the present courts, with an offer of rendering a sworn
    clearance, he defends himself — therefore the Court decrees: that the same Illustrious Right Honourable
    Starost of Niszczewice, from now and from the present act, within six weeks, before the Records of
    the Konin Municipal Court, shall clear himself in that manner: that the arrest on the part of the
    Right Honourable Chełmski did not reach the Laboriosi Józef the Coachman and Walenty the Under-coachman,
    nor has he the means of producing the same — and this is to be published under penalty of banishment,
    in case of contravention, regarding the Manifest to be lodged. But the Inquisitions now conducted
    the Court holds and declares are to remain in the Chancellery of this place, and to be handed over
    to the Parties upon prior Acquittance, [by force of the present decree].'

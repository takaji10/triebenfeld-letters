app536047-002:
- {claim: "Dekret des Kalischer Landgerichts in Konin, Eintrag Nr. 43 der Sitzung, die am 3. Mai 1784 begann", verdict: supported, where: "No. 43tio; the heading of the sitting (rulings.yml)"}
- {claim: "Parteien sind Michał Drogosław Skórzewski, Unterkämmerer von Posen und Erbherr von Biskupie oder Bystrzyca, und Stanisław Ścibor Chełmski, Schatzmeister von Wschowa und Erbherr von Łukomia und Łomowa, jeder zugleich Kläger und Geladener; mit ihnen geladen sind Franciszek Stadnicki, Starost von Ostrzeszów, samt seinen Kindern mit der verstorbenen Teresa, geborene Wężyk, und Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn", verdict: supported, where: "Inter Illustrem Magnificum Michaelem Drogosław Skorzewski Succamerarium Terr~ Posnaniensis ... Bonorum Biskupie seu Bystrzyca haeredem Actorem et Citatum ... Magnificum Stanislaum Ścibor Chełmski Thesaurarium Vschovensem Bonorum Łukomia et Łomowa haeredem Citatum et Actorem ... Illustrem Magnificum Franciscum Comitem de Stadniki Stadnicki Capitaneum Ostrzeszoviensem ... tum Successores olim Magnificae Theresiae de Wężyki cum eodem Illustri Magnifico Stadnicki procreatos ... Illustrem Magnificum Prusimski Capitaneum Nieszczevicensem ... Bonorum Trąpczyna cum attinentiis haeredem Citatum"}
- {claim: "Prusimski wird die Verurteilung entgegengehalten, die Chełmski beim Ortstermin in Grab am 11. September 1780 wegen Zuwiderhandlung gegen das Tribunalsdekret erwirkt hat", verdict: supported, where: "Ad Objectam Condemnationem in Termino Condescensionis in Fundo Bonorum Villae Grab die Undecima mensis Septembris Anno 1780 agitatae ... super Illustri Magnifico Prusimski Capitaneo Nieszczevicensi in lucro contraventionis Decreto Tribunalitio Obtentam et publicatam"}
- {claim: "Eine am Donnerstag nach Cantate 1783 in Pyzdry ausgestellte Vollmacht wird als ausreichend befunden; Prusimski weist sein Recht, gehört zu werden, nicht nach und unterwirft sich dem Gericht, das ihn gegen Zahlung einer halben Buße an die Gegenseite und einer Viertelbuße an das Gericht zulässt", verdict: supported, where: "procuratorium Feria quinta post Dominicam Cantate Anno 1783tio coram Actis Castrensibus Pyzdrensibus factum reponitur proinde Sufficienti procuratorio adinvento ... de loco standi doceat instantanee et quoniam non docet Imo se moderamini Judicii Sui ... Solvat parti objicienti ... medium Vadii Capitalis Judicio vero medium medii Vadii ... Interea habere eundem locum Standi Judicium declarat"}
- {claim: "Zur Sache: Weil die Parteien einander wegen der Abgrenzung von Biskupice oder Bystrzyca gegen Łomowa oder Łukom vor Gericht gebracht haben, hält das Gericht einen Ortstermin auf dem strittigen Grund für nötig, am 16. Juli des laufenden Jahres", verdict: supported, where: "Quoniam Partes pro dislimitatione Bonorum Biskupice seu Bystrzyca cum Bonis Łomowa seu Łukom mutuo se, praesens ad Judicium conveniunt proinde in Ordine dislimitationis Bonorum eorundem necessariam esse Condescensionem ad Campum in Fundum Controversum Inter praeallegata Bona in et pro die 16ta mensis Julii in anno praesenti proxime ventura adinvenit"}
- {claim: "Für die Grenze sollen die Parteien den Unterkämmerer des Kalischer Distrikts oder sein Feldamt gewinnen; für die Gewalttaten und Schäden sollen sie das Gericht selbst oder einen der Kämmerer beiziehen, der untersuchen, Eide abnehmen und den Ersatz festsetzen soll", verdict: supported, where: "Partes pro Termino suprascripto Illustrem Magnificum Succamerarium Districtus Calissiensis aut ejus Officium Campestre impetrent, quo vero ad Causam Violentiarum et damnorum Judicium suum ... aut unum ex Generosis Camerariis ... conducant ... de violentiis damnis Inquiret Et Juramenta excipiet Bonificationem cui a quo et quanta provenerit praestandam decernet"}
- {claim: "Die Parteien haben bei Strafe der Verbannung zu gehorchen und auch die Anrainer zu laden", verdict: supported, where: "sub paena bannitionis ... parere et acquiescere debebunt ac tenebuntur ... Partes quos negotium exigerit tum et Collaterales Adcitent"}

app536047-001:
- {claim: "Dekret des Kalischer Landgerichts in Konin von 1783, Eintrag Nr. 26 seiner Sitzung, zwischen Stanisław Chełmski, Schatzmeister des Landes Wschowa, als Kläger und Antoni Prusimski von Kolno, Starost von Niszczewice, als Geladenem", verdict: supported, where: "No. 26to: Inter M. Stanislaus Chełmski Thesaurarius Terrae Vschoven~ Act~ ... JM. Antonius de Kolno Prusimski Capit~ Nieszczevicen~ Citatus; the heading of the sitting (rulings.yml)"}
- {claim: "Chełmski hält Prusimski eine Verurteilung entgegen, die er 1780 beim Ortstermin auf dem Gut Grab wegen Verstoßes gegen ein Tribunalsdekret gegen ihn erwirkt hat", verdict: supported, where: "ad objectam Condemnationem in fundo Bonorum villae Grab Feria 2da post Festum Nativitatis Beatae Virginis Mariae anno 1780 ex parte Magnifici Chełmski ... super Illustr~ Magnific~ Prusimski in lucro contraven~ Decreto Tribunalitio obtentam et publicatam"}
- {claim: "Prusimski weist sein Recht, gehört zu werden, nicht nach und unterwirft sich dem Ermessen des Gerichts; es legt ihm eine Geldbuße auf, lässt ihn zur Sache zu und ordnet Verhöre beeideter Zeugen an, weil es um Gewalttaten geht", verdict: supported, where: "Teneri Illustrem M. Prusimski docere de Loco Standi adinvenit Et quoniam non docet Imo moderamini Judicii sui se subiicit ... medium vadii Capitanealis ... solvat ... habere locum standi adinvenit ... causa praesens respectu objectarum violentiarum devenit Judicanda ... Inquisitiones ... super incorrupto testium Juramentho educant"}
- {claim: "Aus den Verhören ergibt sich: Leute vom Hof Prusimskis aus Trąbczyn kamen, vom Weg abgeirrt, zur Wüstung Smoleniec, die zu Chełmskis Erbgut Łukom gehört, ließen sich den Weg zeigen und fragten den Olęder Jan Kłonica, wem das Dorf gehöre", verdict: supported, where: "Homines, Aulae JM Prusimski inservientes, ex bonis Trąpczyn (oberratâ viâ) ad desertam Smoleniec ad bona principaliora Łukom Magnifici Chełmski haereditaria spectantem advenisse, ibidemque viam ... sibi demonstrare mandasse, Laboriosumque Joannem Kłonica Hollandum, cuius sit haec villa? Interrogasse"}
- {claim: "Als Kłonica sagte, diese Olęder gehörten Chełmski, schalt ihn Prusimskis Unterkutscher einen Lügner und schlug ihn mit der Peitsche; der Kutscher schlug ihn mit einem Kiefernstock, der dabei zerbrach, und der Unterkutscher schrie, man solle ihn totschlagen; Kłonica floh in ein Erlengehölz", verdict: supported, where: "Hollandos hoscemet ad Magnificum Chełmski pertinere retulisset, Subaurigam J Magnifici Prusimski eidem Hollando, quod mentiretur exprobrasse, et flagro eundem percussisse, ab Auriga quoque eundem Hollandum baculo pinatico fracto verberatum esse, insuper Subaurigam continuo, ut percutiatur, et occidatur vociferasse ... in nemorem alneaticam aufugisse"}
- {claim: "Die Leute wandten sich darauf zum Haus des Olęders, holten dort gewaltsam einen Knecht, schlugen ihn und schlugen ihn weiter auf dem Weg zum Krug von Tomice; er kam erst am folgenden Tag nach Hause", verdict: supported, where: "ad gasam eiusdem Hollandi se se convertisse, ibidem famulum ex monte violenter surripuisse, eundem converberasse, seque ad Cauponam Tomicensem perduci jussisse, in viaque eundem famulum ab illis continuo vapulatum extasse, et nunc primum die crastina praefatum famulum in domum revertisse"}
- {claim: "Ein Zeuge beschwerte sich noch am selben Tag bei Prusimski, der denselben Weg kam; Prusimski versprach, die Sache zu Hause zu bereinigen", verdict: supported, where: "haccemet die J Magnifico Prusimski eademmet via transcendenti unum testem de superiusdescripta violentia sese conquaerulasse, Illustremque Magnificum Prusimski domi circumstantiam hanc facilitare spopondisse"}
- {claim: "Die Taten geschahen auf Chełmskis eigenem Grund; ob mit Wissen oder auf Befehl Prusimskis, klären die Verhöre nicht, und Kutscher und Unterkutscher sind in Trąbczyn nicht zu finden", verdict: supported, where: "hos porro actus in proprio Magnifici Chełmski fundo adimpletos violenter extitisse, utrum tamen cum scitu aut jussu Illustris Magnifici Prusimski executi fuerant? Inquisitiones minime explanasse, etiamque quod Auriga et Subauriga ... in bonis Trąpczyn non reperiuntur"}
- {claim: "Beschuldigt sind nach den Verhören nur der Kutscher Józef und der Unterkutscher Walenty; Prusimski erklärt, er könne sie nicht stellen, und bietet einen Reinigungseid an", verdict: supported, where: "tantummodo laboriosi Josephus Auriga et Valentinus Subauriga de actu violento per Inquisitiones incusantur jam vero Illustris Magnificus Capitaneus Nieszczevicensis profatos Aurigam et Subaurigam quod statuere ullatenus nequit ... cum offerentia praestandae juratoreae evasionis"}
- {claim: "Das Gericht legt ihm auf, binnen sechs Wochen vor dem Burgamt Konin zu beschwören, dass der von Chełmski erwirkte Arrest die beiden nicht erreicht hat und er sie nicht stellen kann, bei Strafe der Verbannung", verdict: supported, where: "in sex septimanis coram Actis Castren~ Coninen~, evadat in eam rotham: prout laboriosos Josephum Aurigam, et Valentinum Subaurigam Arestum ex parte Magnifici Chełmski non praevenit, nec eorundem copiam statuitionis habet, idque sub paena bannitionis"}
- {claim: "Die Verhörprotokolle bleiben in der Kanzlei und werden den Parteien gegen Quittung herausgegeben", verdict: supported, where: "Inquisitiones vero ad praesens eductas in Cancellaria Loci praesentis manendas et Partibus praevia Quietatione extradendas habere vult"}

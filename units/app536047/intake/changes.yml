# What the check of APP 53/6/0/-/47 against the microfilm changes for anyone
# who has written about this decree from the earlier text. Read by
# pipeline/review/changes_page.py.
# importance: significant | fact | wording.

unit: "APP 53/6/0/-/47: the land court's decree of 1783 on the assault at Smoleniec"
changes:
- importance: significant
  what: "A line was skipped on leaf 239 verso, between two \"et quoniam\". The film has: \"et quoniam reproducit Ideo Teneri Illrem M. Prusimski docere de Loco Standi adinvenit Et quoniam n~ docet Imo moderamini Judicii sui se subiicit\". So it is the objecting party (Chełmski) who is to produce a proxy and does; the court then finds PRUSIMSKI bound to show his right of standing, and he does not show it."
  was: "censet et quoniam [n~?]d[a/o?]cet Imo moderamini Judicii sui se subiecet"
  now: "censet et quoniam reproducit Ideo Teneri Illustrem M. Prusimski docere de Loco Standi adinvenit Et quoniam non docet Imo moderamini Judicii sui se subiicit"
  english_was: "the Court holds that, for his part, he is bound to produce a proxy [as required] by the objecting party; and since he shows no cause, but rather shall submit himself"
  english_now: "the Court holds that a proxy is to be produced on the part of the objecting party; and since he produces one, it therefore finds the Illustrious Right Honourable Prusimski bound to show his right of standing; and since he does not show it, but rather submits himself"
- importance: significant
  what: "What is objected against Prusimski is a CONDEMNATION obtained at Grab on the Monday after the Nativity of the Virgin 1780 (11 September), not a \"Condescension\": the film has \"Cond~nem\", and the Tribunal's decree of 1782 (Konin Gr.153) names the same condemnation. \"Decreto Tribunalitio\": the word is added in the margin."
  was: "ad objectam Condescensionem in fundo Bonorum villae Grab ... in lucro contraven~ Decreto Tribunalis obtentam et publicatam"
  now: "ad objectam Condemnationem in fundo Bonorum villae Grab ... in lucro contraven~ Decreto Tribunalitio obtentam et publicatam"
  english_was: "regarding the objected Condescension in the estate of the village of Grab ... to his advantage, a contravention of the Decree of the Tribunal, obtained and published"
  english_now: "regarding the objected condemnation at the estate of the village of Grab ... to his advantage, for contravention of the Tribunal's Decree, obtained and published"
- importance: significant
  what: "The order for the inquiry, read: the witnesses are examined on interrogatories \"drawn up and communicated to each other\", after the oath on the witnesses; and the unread word is \"Inculpatorum\": the production of the ACCUSED named in the plaintiff's citation is what the court puts off until the inquiries are read (the sentence runs over the page)."
  was: "praeciis conscribendas et abi[n/r?][?]ie[s?] super incorrupt[o?] testium Juramentho educant et expediant addito Ministeriali ad pronunciandum Juramenthi rotham statuitionem In[?]tpator[um?] Termino Partis actoreae comprehensorum"
  now: "praeciis conscribendis et ab invicem communicandis Interrogatoriis ac praestando super incorrupto testium Juramentho educant et expediant addito Ministeriali ad pronunciandum Juramenthi rotham statuitionem Inculpatorum Termino Partis actoreae comprehensorum"
  english_was: "and for the form of the appointment of the matters interposed, comprehended within the Term of the Plaintiff Party. / The Court adjourned proceedings until the reading of the Inquisitions."
  english_now: "the production of the accused comprehended within the Term of the Plaintiff Party / the Court suspends until the reading of the Inquisitions."
- importance: significant
  what: "The oath laid on Prusimski: \"prout laboriosos Josephum Aurigam, et Valentinum Subaurigam Arestum ex parte Magnifici Chełmski non praevenit\" means that the ARREST obtained by Chełmski did not reach the two men (they were gone before it was laid), not that Prusimski did not forestall it. The Latin stands; your English changes. His protest in the Konin register (Konin Gr.119, leaf 304 verso) says the same of the men he could not produce."
  was: "(English) inasmuch as he did not forestall the arrest, on the part of the Right Honourable Chełmski, of the Laboriosi Józef the Coachman and Walenty the Under-coachman"
  now: "(English) that the arrest on the part of the Right Honourable Chełmski did not reach the Laboriosi Józef the Coachman and Walenty the Under-coachman"
- importance: fact
  what: "The servant who came home the next day is \"praefatum famulum\", the aforesaid servant; your \"prolatum\" had become \"having been released\". Kłonica said that \"these very\" settlers (hoscemet) belonged to Chełmski."
  was: "prolatum famulum ... Hollandos hoscem et ad Magnificum Chełmski"
  now: "praefatum famulum ... Hollandos hoscemet ad Magnificum Chełmski"
  english_was: "the servant, having been released, returned home ... these Hollanders also belonged"
  english_now: "the aforesaid servant returned home ... these very Hollanders belonged"
- importance: fact
  what: "The end of the decree: Prusimski is to swear \"hinc et ab actu praesenti in sex septimanis\", from now and from this act within six weeks; the inquiries are those \"eductas\", now conducted; and the closing letters are \"D P Robore\" (Decreti Praesentis Robore)."
  was: "[b?]iv[ic?] et ab actu praesenti ... ad praesens [?]ductas ... declarat D [R?] Robore"
  now: "hinc et ab actu praesenti ... ad praesens eductas ... declarat D P Robore"
- importance: fact
  what: "The clerk's two directions were not in your text: \"Videatur Continuatio sub No 22do\" at the foot of leaf 240, and \"Continuatio ex No 26to.\" over the end on leaf 236 verso. Your leaf mark [236v] is right: the entry ends on the earlier leaf, under entry no. 22."
  was: "(not transcribed)"
  now: "Videatur Continuatio sub No 22do / Continuatio ex No 26to."
- importance: fact
  what: "Your third photograph (306) has entry no. 43 of the sitting of 3 May 1784, on leaf 295 verso, between Chełmski and Prusimski. Your file has the leaf mark and that sitting's heading but no text. It is not built."
  was: "[273] heading, [295v] empty"
  now: "(not built)"
- importance: wording
  what: "Smaller readings: \"medium vadii\", \"per medium\", \"in experimento siquidem\", \"Termini Partis Actoreae et manifestationum\", \"Juramenthum ... praestiterunt\", \"aufugisse\", \"superiusdescripta\"."
  was: "medius vadii / per mediu[s?] / in experiment[o?] s[i?] quidem / Juramenthus / au[f?]ugisse / superiusdescr[ipt?]a"
  now: "medium vadii / per medium / in experimento siquidem / Juramenthum / aufugisse / superiusdescripta"
- importance: significant
  new: "new source, transcribed 2026-10-07"
  where: "A new source: entry no. 43, leaves 295 verso and 296 (document 2 of this holding)"
  what: "A text you did not have. You photographed this entry (306.jpg) and your file has only its leaf mark and the heading of its sitting, 3 May 1784. I transcribed it from the film and translated it; the hand is the clear one. It is not, as the heading in your notes suggests, Chełmski against Prusimski: the parties are Michał Drogosław Skórzewski, sub-chamberlain of Poznań and heir of Biskupie or Bystrzyca, and Chełmski, heir of Łukomia and Łomowa, each plaintiff and cited. Cited with them are Franciszek Stadnicki, Starost of Ostrzeszów, with his children by the late Teresa, born Wężyk, and Prusimski as heir of Trąbczyn. Two things happen. First, the condemnation that Chełmski obtained at Grab on 11 September 1780 is raised against Prusimski once more, as in entry no. 26 of 1783; a power of attorney made at Pyzdry on the Thursday after Cantate 1783 (22 May) is found sufficient; Prusimski does not show his right to be heard, submits, and is admitted on payment of half a penalty to the other side and a quarter to the court. Second, the court fixes a hearing on the disputed ground between Biskupice or Bystrzyca and Łomowa or Łukom for 16 July of that year (1784): the sub-chamberlain of the district of Kalisz is to mark the boundary, and the court or one of the chamberlains is to inquire into acts of violence and damage; the neighbours are to be cited. Marked as doubtful: the first letter of the estate \"[K?]rolikowa\" (with Biała and Lądek, Stadnicki's), \"ex [o?]re\", three endings left with a tilde, and the first of three letters at the close. Two things in it bear on entry no. 26, which you transcribed: the proxy you read as \"[T/F?]eromski\" is written \"Zeromski\" here, plainly, twice (Wojciech Żeromski); and the penalty is \"medium Vadii Capitalis\", half of a capital bail, where your no. 26 has \"Capit~\" taken as the Starost's. I have not changed no. 26 on that ground."
  was: "(not transcribed)"
  now: "No. 43tio Inter Illustrem Magnificum Michaelem Drogosław Skorzewski Succamerarium Terr~ Posnaniensis Insignium Sancti Stanislai et Sanctae Annae Equitem, Bonorum Biskupie seu Bystrzyca haeredem Actorem et Citatum per Generosum Josephum Stablewski Magnificum Stanislaum Ścibor Chełmski Thesaurarium Vschovensem Bonorum Łukomia et Łomowa haeredem Citatum et Actorem per Generosum Constantinum Suchodolski Illustrem Magnificum Franciscum Comitem de Stadniki Stadnicki Capitaneum Ostrzeszoviensem Insignis Sancti Stanislai equitem Bonorum [K?]rolikowa Bialla, et Lądek tum Successores olim Magnificae Theresiae de Wężyki cum eodem Illustri Magnifico Stadnicki procreatos Bonorum Suprascriptorum haeredes et possessores Citatos per Generosum Antonium Miroszewski Illustrem Magnificum Prusimski Capitaneum Nieszczevicensem Insignis Sancti Stanislai Equitem Bonorum Trąpczyna cum attinentiis haeredem Citatum per Generosum Albertum Żeromski Ad Objectam Condemnationem in Termino Condescensionis in Fundo Bonorum Villae Grab die Undecima mensis Septembris Anno 1780 agitatae ex [o?]re Magnifici Chełmski Thesaurarii Vschovensis super Illustri Magnifico Prusimski Capitaneo Nieszczevicensi in lucro contraventionis Decreto Tribunalitio Obtentam et publicatam teneri producere ad Objiciendam Condemnationem a Magnifico Chełmski Objicientem procuratorium Judicium censet, Et quoniam procuratorium Feria quinta post Dominicam Cantate Anno 1783tio coram Actis Castrensibus Pyzdrensibus factum reponitur proinde Sufficienti procuratorio adinvento decernit Judicium quatenus Is Idem Illustris Magnificus Prusimski Capitaneus Nieszczevicensis de loco standi doceat instantanee et quoniam non docet Imo se moderamini Judicii Sui subjic[it] ideo in Constitutionem Sibi loci standi Solvat parti objicienti salva apud eandem repetitione reservata medium Vadii Capitalis Judicio vero medium medii Vadii in instanti sub paena bannitionis in determinatione Judiciorum publicanda Interea habere eundem locum Standi Judicium declarat, et Experimentum demandat, in Experimento Terminos partium decidendo et Controversiis earundem exauditis Quoniam Partes pro dislimitatione Bonorum Biskupice seu Bystrzyca cum Bonis Łomowa seu Łukom mutuo se, praesens ad Judicium conveniunt proinde in Ordine dislimitationis Bonorum eorundem necessariam esse Condescensionem ad Campum in Fundum Controversum Inter praeallegata Bona in et pro die 16ta mensis Julii in anno praesenti proxime ventura adinvenit, Sententiando quatenus Partes pro Termino suprascripto Illustrem Magnificum Succamerarium Districtus Calissiensis aut ejus Officium Campestre impetrent, quo vero ad Causam Violentiarum et damnorum Judicium suum Unius duorumve Absentia non obstante aut unum ex Generosis Camerariis legitime praeven~ pro eodem Termino conducant, Quod sive qui Condescens~ de violentiis damnis Inquiret Et Juramenta excipiet Bonificationem cui a quo et quanta provenerit praestandam decernet Et Inquisitiones expediet Terminos praefiget rigores annectet, Causamque praesentem ad Contenta Terminorum et Manifestationum Partium decidet disjudicabit et moderabitur Quorum decisioni et quidem ad Causam Granitialem Illustris Magnifici Succamerarii quo vero ad Causam Facti Judicii sui aut Generosorum Camerariorum sub paena bannitionis super Parte Contraveniente illo in Termino coram eisdem Condescensionis publicanda parere et acquiescere debebunt ac tenebuntur Luita paena quatuordecim Marcarum pollonicalium Parti per Partem compensanda Judicio vero suo per medium ab utraque Parte sub Solito ex Regestro paenalium extendendo rigore solvenda Pro quo Condescensionis Termino Partes quos negotium exigerit tum et Collaterales Adcitent Adcitati sub Suprascripta paena bannitionis Compareant [S?]PK."
  english_now: "No. 43: Between the Illustrious Right Honourable Michał Drogosław Skórzewski, Sub-chamberlain of Poznań, Knight of the Orders of Saint Stanislaus and Saint Anne, heir of the estates of Biskupie or Bystrzyca, Plaintiff and Cited, through the Honourable Józef Stablewski; the Right Honourable Stanisław Ścibor Chełmski, Treasurer of Wschowa, heir of the estates of Łukomia and Łomowa, Cited and Plaintiff, through the Honourable Konstanty Suchodolski; the Illustrious Right Honourable Franciszek, Count of Stadniki, Stadnicki, Starost of Ostrzeszów, Knight of the Order of Saint Stanislaus, [heir] of the estates of [uncertain: Królików], Biała and Lądek, and the successors of the late Right Honourable Teresa, born Wężyk, begotten with the same Illustrious Right Honourable Stadnicki, heirs and possessors of the above-written estates, Cited, through the Honourable Antoni Miroszewski; [and] the Illustrious Right Honourable Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanislaus, heir of the estates of Trąbczyn with appurtenances, Cited, through the Honourable Wojciech Żeromski — regarding the objected condemnation, obtained and published at the condescension term held on the ground of the estates of the village of Grab on the eleventh day of the month of September in the year 1780, [uncertain: on the part] of the Right Honourable Chełmski, Treasurer of Wschowa, against the Illustrious Right Honourable Prusimski, Starost of Niszczewice, to his advantage, for contravention of the Tribunal's Decree: the Court holds that the party objecting on behalf of the Right Honourable Chełmski is bound to produce a proxy in order to object the condemnation. And since a proxy made before the records of the Pyzdry Municipal Court on Thursday after Cantate Sunday in the year 1783 is laid down, a sufficient proxy being therefore found, the Court decrees that the same Illustrious Right Honourable Prusimski, Starost of Niszczewice, shall show his right of standing forthwith; and since he does not show it, but rather submits himself to the moderation of its judgement, therefore, for the establishment of his right of standing, he shall pay: to the objecting party, with recovery from the same reserved, half of a capital bail; but to the Court half of a half bail, forthwith, under penalty of banishment, to be published at the close of the sessions. Meanwhile the Court declares that he has the right of standing, and orders the trial. In the trial, deciding the terms of the parties, and their controversies having been heard: since the parties bring one another before the present Court for the delimitation of the estates of Biskupice or Bystrzyca from the estates of Łomowa or Łukom, the Court therefore finds that, for the delimitation of those estates, a condescension to the field, on the disputed ground between the aforesaid estates, is necessary, on and for the 16th day of the month of July next coming in the present year — ruling that the parties shall obtain for the above-written term the Illustrious Right Honourable Sub-chamberlain of the District of Kalisz, or his field office; but, as to the cause of the acts of violence and damages, shall bring for the same term its own Court, the absence of one or two notwithstanding, or one of the Honourable Boundary Surveyors [two words not fully read: \"legitime praeven~\"]. Which court, or he who comes to the condescension, shall inquire into the acts of violence and damages, and shall receive oaths; shall decree the compensation to be made, to whom, by whom and how much shall be due; and shall conduct inquisitions, fix terms, attach rigours, and shall decide, adjudge and moderate the present cause according to the contents of the parties' terms and manifests. Whose decision — as to the boundary cause, that of the Illustrious Right Honourable Sub-chamberlain; as to the cause of fact, that of its own Court or of the Honourable Boundary Surveyors — they shall be bound and obliged to obey and acquiesce in, under penalty of banishment, to be published upon the contravening party at that term, before the same [judges] of the condescension. The penalty of fourteen Polish marks having been paid — to be set off party against party, and to its own Court paid by halves by each party, under the usual rigour, to be extended from the register of penalties. For which condescension term the parties shall cite those whom the matter requires, and also the neighbours; those cited shall appear under the above-written penalty of banishment."

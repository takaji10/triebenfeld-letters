# The claim check of the German summaries of APP 53/17/0/-/Konin Gr.153, made
# in session on 2026-10-07 under the rules read_letters.py --verify gives its
# checker: each statement held to the document, as supported, overstated or
# unsupported, and the summary then only weakened or cut, never added to. Not
# the paid run; there is no reading.json. The documents were read in the
# Latin of corpus.txt as checked (a light check: intake/holding.py).
#
# Result: 22 statements, all supported. Two were weakened in the making: the
# sum Chełmski is to pay is not given as a figure in the summary (the text
# has it in words), and the day of the recovery of the settlers, "6[?]" in
# the transcription, is given because the weekday named beside it (the
# Wednesday after Oculi Sunday 1782) is 6 March.

app53170koningr153-001:
- {claim: "Dekret des Feldgerichts von Franciszek Ksawery Jasiński, Grenzkämmerer der Woiwodschaft Gnesen, begonnen am 28. November 1782 auf dem Grund von Trąbczyn bei den drei Eckhügeln von Trąbczyn Minus oder Nowa Wieś, Łukom und Drzewce", verdict: supported, where: "Actum in fundo bonorum Trąmpczyn locoque angularitatis penes tres scopulos angulares ... primum bonorum Trąmpczyn minus, seu Nowa Wieś ... alterum Łukom ... tertium denique villae collateralis Drzewce ... die scilicet vigesima octava mensis 9bris anno Domini 1782do. Coram Magnifico Francisco Xaverio à Jasien Jasinski Camerario Graniciali Palatinatus Gnesniensis"}
- {claim: "Es rückt das Dekret des Krontribunals in Petrikau vom 17. Oktober 1782 zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa, im Wortlaut ein; geladen waren auch die Grenzkämmerer Jakub Górski von Inowrocław und Alojzy Orłowski vom Land Dobrzyń sowie Abt Lubstowski und der Konvent von Ląd", verdict: supported, where: "actum Petricoviae in judiciis ordinariis generalibus tribunalis regni ... die decima septima mensis 8bris anno [Domini?] 1782 inter Magnificum Antonium Prusimski ... Magnificum Stanislaum Chełmski ... Generosum Jacobum Gorski Camerarium Granicialem Iunivladislaviae ... Magnificum Alojsium Orławski Camerarium Granicialem Terrae Dobrinensis ... Lubstowski Abbatem Conventus Landensis totumque Venerabilem Conventum Landensem"}
- {claim: "Das Tribunal hält fest: Die von den Ständen eingesetzte Kommission hatte den Grenzstreit durch zwei einander widersprechende, in Abwesenheit ergangene Dekrete entschieden; nach dem Gesetz von 1776 kamen beide Parteien vor das Tribunal, das am 23. Januar 1782 endgültig entschied", verdict: supported, where: "causam limitum ... per commissionem à statibusque regni designatam binis decretis discrepanter, et contumacialiter prolatis disjudicatam fuisse, roboreque legis anni 1776ti partes utrasque pro relevatione decretorum commissorialium ... suum ad judicium anteactum convenisse, hocce in judicio anteacto decretum die 23tia mensis Januarii, anno praesenti ultimarium ... emanasse"}
- {claim: "Jenes Dekret bestimmte den Eckpunkt von Trąbczyn und Łukom mit Drzewce und den Endpunkt mit Biskupice so, wie die Karte sie zeigt, und bestätigte darin das Dekret der von Prusimski beigezogenen Kommissare; dazwischen zog es auf der Karte eine gerade Linie, vom Präsidenten und vom Marschall unterschrieben", verdict: supported, where: "angularitatem horumce bonorum Trąmpczyn et Łukom cum bonis Drzewce ... acialitatem eorundem bonorum cum bonis Biskupice determinatam, et in mappa demonstratam esse, hocque in puncto decretum commissoriale per commissarios ex parte Illustrissimi Magnifici Prusimski conductos prolatum approbatum extitisse ... per lineam rectam per idem judicium anteactum in mappa factam, manibusque Illustrissimi Praesidentis et Mareschalii subscriptam"}
- {claim: "Die Olęder, die Chełmski in Besitz genommen hatte, waren Prusimski zurückzugeben, bis auf einen, Martin Hunt, der Chełmski belassen wurde; das geschah am 6. März und wurde am 18. März in Konin eingetragen", verdict: supported, where: "deoccupationem Hollandorum praeter unum Hollandum ingenuum Martinum Hunt, qui pro re Magnifici Chełmski ... adjudicatus extiterat, pro re Illustrissimi Magnifici Prusimski ... per officium Castrensis Gnesniensis notariatus ... die 6[?] mensis Martii anno praesenti prolato actis Castrensis Coninensis die decima octava mensis et anni ejusdem oblatuato peractam esse"}
- {claim: "Beim Ortstermin am 27. Mai zog der vereidigte Geometer die Linie; Hunt lag aber nicht auf der Chełmski zugesprochenen rechten Seite, und die beiden Feldämter gingen auseinander: Das von Dobrzyń verwies die Sache an das Tribunal zurück, das von Inowrocław wollte die Linie so verbessern, dass die Stelle einer vor vier Jahren abgebrannten Olęder-Stelle rechts bliebe, was Chełmski ablehnte", verdict: supported, where: "die 27ma mensis Maii ... geomethram juratum perfecisse ... Hollandusque idem ingenuus Martinus Hunt ... à parte dextra scilicet in fundo ipsi adjudicato non extiterat hac in occurrentia officia condescensorialia secum discrepasse utpote officium comitiale Dobrinensis causam hanc ... praesens ad judicium remisisse. Iam verò Iunivladislavienses ... meliorationem lineae ... ita ut locus in quo Hollandus Joannis ... ante quatuor annos combustus, à parte dextra pro re Magnifici Chełmski relinquatur intimasse, verum eandem meliorationem lineae Magnificum Chełmski denegasse"}
- {claim: "Das Tribunal entscheidet: Ein vereidigter Geometer hat nur Grenzzüge und Grenzzeichen zu vermessen, Häuser trägt er bloß der Lage nach ein; das Dekret vom 23. Januar ist unabänderlich und zu erfüllen, die Akten beider Feldämter werden aufgehoben", verdict: supported, where: "geomethras juratos circa opera delineationis mapparum solummodo ductum praesentium signaque ... arte geometrica dimensurare ... alia quaevis signa remotiora, tum villas geographicae tantum ad notari ... decreto suprascripto anteacti judicii sui postcommissoriali lege positiva anni 1776ti pro immovibili declarato ... regulam ejusdem decreti omnino adimplendam et observandam praecipit. Cassatisque utrisque actibus per officia comitalia campestria prolatis"}
- {claim: "Binnen sechs Wochen soll ein Unterkämmerer oder Kämmerer mit einem vereidigten Geometer auf dem Grund erscheinen, die Linie von den drei Eckhügeln bis zum Endpunkt mit Biskupice ziehen lassen und nur Wandhügel errichten; was rechts der Linie liegt, gehört zu Łukom, was links liegt, zu Trąbczyn oder Nowa Wieś; die 1775 von Chełmskis Kommissaren errichteten Hügel sind alle, die von Prusimskis Kommissaren errichteten Wandhügel ebenfalls zu schleifen", verdict: supported, where: "in sex ab actu praesenti decreti septimanis in fundum bonorum Trąmpczyn ... à scopulis trinis angularibus ... usque ad acialitatem bonorum eorundem Trąmpczyn, Łukom et Biskupice lineam, quam rectissimam ... scopulos parietales tantum ... erigent ... quid quid à parte dextra ... id totum haereditatis bonorum Łukom, quid quid à parte sinistra id omne haereditati bonorum Trąmpczyn, seu Nowa Wieś ... scopulos per commissarios ex parte Magnifici Chełmski conductos, in anno 1775to erectos, tam angulares, et aciales, quam et parietales, tum et distinctos parietales, per commissarios Illustrissimi Magnifici Prusimski erectos demolient"}
- {claim: "Weil Martin Hunt nicht rechts der Linie sitzt, hat Chełmski ihn binnen sechs Wochen vor dem Kommissar der großpolnischen Woiwodschaft in Prusimskis Besitz zu übergeben, bei Strafe der Verbannung", verdict: supported, where: "ingenuum Martinum Hunt Hollandum nullo modo à parte dextra lineae per judicium tribunalium determinatae extare ... statuit, quatenusque praefatus magnificus Chełmski eundem ingenuum Martinum Hunt Hollandum in possessionem Illustrissimi Magnifici Prusimski in sex ab actu praesenti decreti septimanis, praesenti commissario palatinatus majoris Poloniae ... reddat, et restituat ... sub paena bannitionis"}
- {claim: "Chełmski soll Prusimski die schon zuerkannte Summe für die von den Olędern bezogenen Einkünfte samt Strafgeldern am 20. Januar 1783 in Posen zahlen", verdict: supported, where: "idem Magnificus Chełmski Thesaurarius Vschovensis summam sex millium centum sexaginta novem florinorum grosorum quatuordecim Polonicalium ... uti à summa pro proventu ab Hollandis percepta ... in et pro die vigesima mensis Januarii in anno futuro 1783tio ... officio et actis Castrensis Posnaniensis"}
- {claim: "Górski, den Prusimski beigezogen hatte, wird wegen der eigenmächtigen Verbesserung der Linie zu einer Woche Turmhaft in der Burg Radziejów und zu einer Geldbuße an Chełmski verurteilt; Orłowski, den Chełmski beigezogen hatte, wegen der unbegründeten Rückverweisung zu einer Geldbuße an Prusimski", verdict: supported, where: "Magnificus Gorski Camerarius Iunivladislaviensis ex parte Illustrissimi Magnifici Prusimski conductus ... lineam ... geomethrae meliorare praesumpsisse ... thurrim superiorem castri Radziejoviensis ... ingrediatur, ejusque sessionem spatio unius septimanae ... vadium capitale duplex Magnifico Chełmski; Magnificus Orłowski Camerarius Granicialis Dobrinensis et ex parte Magnifici Chełmski conductus pro indebite causae ... facta remissione ... Illustrissimus Magnificus Prusimski ... vadium capitale duplex"}
- {claim: "Der Konvent von Ląd wird von der geforderten Strafe freigesprochen: Sein Protest in Posen vom 26. Juni war nur vorsorglich und ist am 16. Oktober zurückgenommen worden", verdict: supported, where: "eadem manifestatio coram actis Castrensis Posnaniensis ... die vigesima sexta mensis Junii anno praesenti per venerabilem Fratrem Thesselinum Malachowski facta non nisi diligentiam quandam contestat ... recessusque ab ea ... die decima sexta mensis praesenti ... eundem venerabilem conventum Landensis à praetensa paenalitate liberum facit"}
- {claim: "Der Vollzug: Am 29. November erschien Prusimski, Chełmski blieb aus; Prusimski legte die Karte mit der vom Präsidenten Sebastian Sierakowski und vom Marschall Ksawery Kęszycki unterschriebenen Linie vor, und der vereidigte Geometer Benedykt Woronowski, Kanoniker von Łęczyca, stellte die Linie mit Stangen her", verdict: supported, where: "die autem crastina scilicet 29 mensis 9bris ... Illustrissimo Magnifico Antonio in Kolno Prusimski ... personaliter, comparente et etiam non obstante contumacia Magnifici Chełmski ... reposuit Illustrissimus Magnificus Prusimski mappam praedictam cum linea ... manu illustrissimi et reverendissimi Sebastiani Comitis Sierakowski ... Praesidentis, ex altera verò manu Illustrissimi Magnifici Xaverii Nałecz Kęszycki ... Mareschalii tribunalis regni; Formavit suprascriptus perillustrissimi reverendissimus geomethra lineam ... perticis fundo infixis"}
- {claim: "Am 30. November, am 2. und am 3. Dezember ließ das Gericht entlang der Linie einundvierzig Wandhügel aufwerfen und im Sumpf namens Stawisko einunddreißig Pfähle aus Erle und Eiche einschlagen; am 2. Dezember erschien Chełmski persönlich", verdict: supported, where: "die quoque 30na mensis 9bris ... erectionem scopulorum inchoavit ... in locum caenosum stawisko nuncupatum ... palum alneaticum 1mum ... pro die secunda mensis 10bris ... 28uum, 29nun, 30mum, 31mum, in margine luti alneaticos ... hacce die Magnifico Stanislao Chełmski Thesaurario Vschoviensis personaliter comparente ... diem 3tiam mensis decembris ... 40mum ... 41mum"}
- {claim: "Der letzte Hügel steht zwölfeinhalb Ruten vor den Endhügeln von Trąbczyn, Łukom und Biskupice, die unberührt blieben; jeder Hügel misst sechs Ellen im Geviert und enthält als Zeichen fünf Steine in Kreuzform, Ziegelstücke, Glasscherben und Kohle", verdict: supported, where: "41mum, idque in distantia perticarum duodecem et mediae à diamethro scopulorum acialium bonorum eorundem Trąmpczyn, Łukom, et Biskupice, eisdem relictis intactis, omnes ... aequales sex cubitos quadratos complectentes cum impositione signorum metallium scilicet in quem libet per quinque lapides in signum Sanctae Crucis particularum laterum combustarum, vitrifracti, et carbonum"}
- {claim: "Danach ließ das Gericht die älteren Hügel schleifen und für nichtig erklären; Jasiński hat unterschrieben", verdict: supported, where: "scopulos per commissarios ex parte Magnifici Chełmski ... tam angulares quam aciales et etiam parietales, nec non ex parte Illustrissimi Magnifici Prusimski per commissarios erectos, solosmet parietales demolire ... mandavit, et praedictos scopulos solo aequatos pro nullis declaravit; Franciscus Xaverius Rawicz à Jaśień Jasiński Camerarius Granicialis Palatinatus Gnesniensis Manupropria"}
- {claim: "Ein Vermerk hält fest, dass Leon Maszewski das Dekret am 7. Dezember 1782 dem Burgamt Konin vorgelegt hat und das Original in die Akten eingeheftet wurde", verdict: supported, where: "generosus Leo Maszewski nomine partis cujus interest obtulit officio praesenti ... decretum condescensoriale graniciale ... Originale vero decreti suprascripti hic circa acta praesentia perpetuitatis gratia relictum ac iisdem insutum est. In Conin ... die scilicet septima mensis Decembris anno Domini 1782do"}

app53170koningr153-002:
- {claim: "Urkunde vom 28. November 1782, aufgenommen in der Trąbczyner Olęder-Siedlung im Haus von Martin Hunt, in Gegenwart von Michał Brzeżański, Leon Maszewski und anderen; der Gerichtsbote Bartłomiej Szepczyński von Trąbczyn rief die Handlung aus", verdict: supported, where: "Actum in Fundo Hollandorum Trąmpczynensium domoque ingenui Martini Hunt ... die scilicet vigesima octava mensis Novembris anno Domini millesimo septingentesimo octuagesimo secundo. Praesentibus Generosis Michaële Brzeżański Leone Maszewski et aliis nec non provido Bartholomaeo Szepczyński de villa Trąmpczyn ministeriali regni generali actum praesentem acclamante"}
- {claim: "Das Kommissariatsamt der großpolnischen Woiwodschaft handelt nach dem Dekret des Krontribunals in Petrikau vom 17. Oktober desselben Jahres zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa", verdict: supported, where: "Officium commissoriale palatinatus majoris Poloniae insistendo decreto in judiciis ordinariis generalibus tribunalis regni Petricoviae ... die scilicet decimaseptima mensis Octobris anno praesenti inter Illustrissimum Magnificum Antonium Prusimski ... tum Magnificum Stanislaum Chełmski"}
- {claim: "Danach sitzt der Olęder Martin Hunt nicht rechts der vom Tribunal bestimmten Linie und kann nicht Chełmski gehören, der ihn bis dahin besaß; Chełmski sollte ihn binnen sechs Wochen vor dem Kommissar an Prusimski herausgeben", verdict: supported, where: "Ingenuum Martinum Hunt Hollandum nullomodo à parte dextra lineae per judicii tribunalium determinatae extare et ad Magnificum Chełmski spectare posse, jam verò Magnificum Chełmski eundem Hollandum ad usque possedisse ... in sex ab actu ejusdem decreti septimanis praesenti commissario ... redderet et restitueret"}
- {claim: "Auf Verlangen Prusimskis, der persönlich anwesend ist, übergibt der Kommissar Martin Hunt in dessen tatsächlichen Besitz und verpflichtet Hunt zum Gehorsam gegenüber Prusimski; niemand widerspricht", verdict: supported, where: "ad requisitionem Illustrissimi Magnifici Antonii in Kolno Prusimski ... ingenuum Martinum Hunt Hollandum in actualem possessionem praedicti Illustrissimi Magnifici Prusimski circa actum hunc personaliter praesentis tradidit et dimisit atque in pacifica possessione nemine impugnante indicta suprascripto Ingenuo Martino Hunt pro re Illustrissimi Magnifici Prusimski ... obedientia eundem reliquit"}
- {claim: "Józef Łukaszewicz, Generalkommissar der großpolnischen Woiwodschaft, hat unterschrieben", verdict: supported, where: "Josephus Łukaszewicz Palatinatus Majoris Poloniae Generalis Commissarius mp"}

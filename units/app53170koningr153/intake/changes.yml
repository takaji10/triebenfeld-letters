  where: "Leaves 1392 verso and 1393"
  what: "The opening of the Tribunal's account sets out the pleadings of the two parties, each in the genitive after \"in controversiis partium\" (\"in the controversies of the parties\"; your text had \"parte\"). It is Prusimski's pleading, not a finding of the court, that he stands by the decree of 23 January, and that a judicial inspection of 23 February, entered at Konin on 10 June \"of the present year\" (1782; your \"previous year\"), shows that the burnt settler's ground is \"on the side of Chełmski\" (\"in parte Magnifici Chełmski esse\") and that the map, as to the line, \"is verified\". Your English had the inspection \"having gone in favour of\" Chełmski and the map \"to be verified, it being discordant\"."
  was: "controversiis parte ut pote Illustrissimus Magnificus Prusimski Capitaneus Niszczeviensis ... anno praeveniente relata, in parte Magnifici Chełmski isse determinantis ... per decretum ad super appositam actibusque praemissis discordantibusque deducentibusque verificari"
  now: "controversiis partium utpote Illustris Magnifici Prusimski Capitanei Niszczeviensis ... anno praesenti relata, in parte Magnifici Chełmski esse determinantis ... per decretum de super appositam actibus praemissis discordantibus deducentibus verificari"

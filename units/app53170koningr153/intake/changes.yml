  english_now: "In the settling of the controversies of the parties: namely of the Most Honourable Prusimski ... who stands by the decree ... establishing nevertheless, by a judicial inspection ... recorded in the Konin court records on 10 June of the present year, that the existence of this olęder, or his ground by the burning of the same, is on the side of the Right Honourable Chełmski; and explaining that the map ... is verified, as the aforementioned discordant acts show"

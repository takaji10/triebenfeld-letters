  what: "How the settlers came back to Prusimski in March 1782. The first decree had ordered a separate sitting on the ground (\"distinctam condescensionem\") by the office of the castle court of Gniezno, for the settlers \"whom Chełmski had occupied beforehand by way of a delivery of possession\" (\"modo traditorio praeoccupatorum\"); and Hunt was left to Chełmski \"by the resolution\" of that court (your \"revolutionem\", translated \"reversal\"). The day is the 6th: the figure is plain, and the Wednesday after Oculi Sunday 1782 was 6 March."

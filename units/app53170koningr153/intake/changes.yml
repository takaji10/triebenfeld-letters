  was: "pro dubietatis cuius porrectione, Illustrissimus Magnificus Prusimski seu ejus plenipotentiario ... enumeret, sui itidem eundem"
  now: "pro dubietatis cujusdam porrectione, Illustri Magnifico Prusimski seu ejus plenipotentiario ... enumeret, seu itidem eundem"

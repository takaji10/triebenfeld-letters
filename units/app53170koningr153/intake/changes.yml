  english_now: "and for raising a certain doubt as to the line placed by the Tribunal decree: shall pay to the Most Honourable Prusimski or his plenipotentiary ... a double principal surety bond, and to the court a single one ... or likewise the Right Honourable Chełmski shall stand surety"
- importance: significant
  new: "full check, 2026-10-07"
  where: "Leaves 1392 to 1398 verso"
  what: "The two officers who failed to carry out the first decree are boundary CHAMBERLAINS, and the two field offices that sat on 27 May 1782 are the chamberlains' offices. The scan has \"Cmrium\", \"Cmrlia\", \"Cmrle\" with a mark (Camerarium, camerarialia, camerariale) in the nine places where your text had \"Commissarium\", \"commissorialia\", \"comitialia\", \"comitale\" or \"cmle\". So Górski of Inowrocław and Orławski of Dobrzyń hold the same office as Jasiński of Gniezno, who carries the decree out in the end; none of them is a commissioner. In your English \"Boundary Commissioner\" and \"commissarial office\" become \"Boundary Surveyor\" and \"Boundary Surveyor's office\", your own word for Jasiński's office."
  was: "Orławski Commissarium Granicialem ... Gorski Comissarium Granicialem ... per officii condescensorialia commissaria ... per officiorum cmle Dobrinensis ... officia commissorialia campestria ... officium comitiale Dobrinensis ... per officia comitalia campestria"

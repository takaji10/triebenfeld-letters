  english_was: "Jan Orławski, Boundary Commissioner of the Dobrzyń Land ... Jakub Gorski, Boundary Commissioner of Inowrocław ... the field inspection commissioner offices of Inowrocław and Dobrzyń ... the Dobrzyń commissarial office"

  was: "Hollandus Joannis tempore ... quocirca quam v[erò] magnificus Chełmski ... cum attinentibus haereditates ... sese tutand[ae?] ... ipse relinqui ... solummodo ductum praesentium ... geographicae tantum ad notari ... Hollandus haereditatis bonorum Łukom ... in vim calculi quarto et praecidente actum ... in fundo nam reperitur"

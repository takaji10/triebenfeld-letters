# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Two original acts of late 1782, sewn into a book of the castle court of
  Konin, in Latin. The first, on twenty-five pages, is the decree of the
  field court of Franciszek Ksawery Jasiński, boundary chamberlain of the
  palatinate of Gniezno, held on the ground between Trąbczyn and Łukom from
  28 November to 3 December 1782. It copies in full the decree of the Crown
  Tribunal at Piotrków of 17 October 1782 between Antoni Prusimski and
  Stanisław Ścibor Chełmski, which confirmed the Tribunal's decree of 23
  January 1782, ordered the boundary mounds raised along the straight line
  drawn on the map, awarded the Olęder settler Martin Hunt to Prusimski and
  punished the two officers who had failed to carry the first decree out;
  and it records the line set out by the sworn surveyor, the forty-one
  mounds and thirty-one stakes placed along it, and the demolition of the
  older mounds. A note records that the decree was brought to the Konin
  office on 7 December 1782. The second act, on one page, is the delivery
  of Martin Hunt into Prusimski's possession by the commissioner Józef
  Łukaszewicz on 28 November 1782.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Two acts of 1782 in formulaic, abbreviated Latin. The English is the
  editor's own translation. "Condescensio" is a sitting of a court or
  officer on the ground in dispute (the editor's "field inspection");
  "scopuli" are boundary mounds: "angulares" where three estates meet,
  "aciales" at the far end of the line, "parietales" along it; "geomethra
  juratus" a sworn surveyor; "Hollandus" an Olęder settler; "vadium" a
  money penalty; "sipatio" the raising of mounds.

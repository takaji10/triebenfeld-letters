title: >-
  The decree of the boundary chamberlain of Gniezno, 28 November to 3
  December 1782, that carried out the Crown Tribunal's judgment on the
  boundary between Trąbczyn and Łukomia, with the Tribunal's decree of 17
  October 1782 copied into it and the record of the forty-one mounds raised
  along the line; and the act of the same days that put the Olęder settler
  Martin Hunt into Prusimski's possession.

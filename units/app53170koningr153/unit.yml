  und Łukomia vollzog, mit dem darin eingerückten Tribunalsdekret vom 17.
  Oktober 1782 und dem Protokoll der einundvierzig entlang der Linie
  errichteten Grenzhügel; sowie die Urkunde derselben Tage, die den Olęder
  Martin Hunt in den Besitz Prusimskis einwies.

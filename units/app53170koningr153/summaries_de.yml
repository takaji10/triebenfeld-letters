# German summaries of APP 53/17/0/-/Konin Gr.153, written in the working session from the Latin as checked
# (intake/holding.py, 2026-10-07).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app53170koningr153-001: "Dekret des Feldgerichts von Franciszek Ksawery Jasiński, Grenzkämmerer der Woiwodschaft Gnesen, begonnen am 28. November 1782 auf dem Grund von Trąbczyn bei den drei Eckhügeln von Trąbczyn Minus oder Nowa Wieś, Łukom und Drzewce. Es rückt das Dekret des Krontribunals in Petrikau vom 17. Oktober 1782 zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa, im Wortlaut ein; geladen waren auch die Grenzkämmerer Jakub Górski von Inowrocław und Alojzy Orłowski vom Land Dobrzyń sowie Abt Lubstowski und der Konvent von Ląd. Das Tribunal hält fest: Die von den Ständen eingesetzte Kommission hatte den Grenzstreit durch zwei einander widersprechende, in Abwesenheit ergangene Dekrete entschieden; nach dem Gesetz von 1776 kamen beide Parteien vor das Tribunal, das am 23. Januar 1782 endgültig entschied. Jenes Dekret bestimmte den Eckpunkt von Trąbczyn und Łukom mit Drzewce und den Endpunkt mit Biskupice so, wie die Karte sie zeigt, und bestätigte darin das Dekret der von Prusimski beigezogenen Kommissare; dazwischen zog es auf der Karte eine gerade Linie, vom Präsidenten und vom Marschall unterschrieben. Die Olęder, die Chełmski in Besitz genommen hatte, waren Prusimski zurückzugeben, bis auf einen, Martin Hunt, der Chełmski belassen wurde; das geschah am 6. März und wurde am 18. März in Konin eingetragen. Beim Ortstermin am 27. Mai zog der vereidigte Geometer die Linie; Hunt lag aber nicht auf der Chełmski zugesprochenen rechten Seite, und die beiden Feldämter gingen auseinander: Das von Dobrzyń verwies die Sache an das Tribunal zurück, das von Inowrocław wollte die Linie so verbessern, dass die Stelle einer vor vier Jahren abgebrannten Olęder-Stelle rechts bliebe, was Chełmski ablehnte. Das Tribunal entscheidet: Ein vereidigter Geometer hat nur Grenzzüge und Grenzzeichen zu vermessen, Häuser trägt er bloß der Lage nach ein; das Dekret vom 23. Januar ist unabänderlich und zu erfüllen, die Akten beider Feldämter werden aufgehoben. Binnen sechs Wochen soll ein Unterkämmerer oder Kämmerer mit einem vereidigten Geometer auf dem Grund erscheinen, die Linie von den drei Eckhügeln bis zum Endpunkt mit Biskupice ziehen lassen und nur Wandhügel errichten; was rechts der Linie liegt, gehört zu Łukom, was links liegt, zu Trąbczyn oder Nowa Wieś; die 1775 von Chełmskis Kommissaren errichteten Hügel sind alle, die von Prusimskis Kommissaren errichteten Wandhügel ebenfalls zu schleifen. Weil Martin Hunt nicht rechts der Linie sitzt, hat Chełmski ihn binnen sechs Wochen vor dem Kommissar der großpolnischen Woiwodschaft in Prusimskis Besitz zu übergeben, bei Strafe der Verbannung. Chełmski soll Prusimski die schon zuerkannte Summe für die von den Olędern bezogenen Einkünfte samt Strafgeldern am 20. Januar 1783 in Posen zahlen. Górski, den Prusimski beigezogen hatte, wird wegen der eigenmächtigen Verbesserung der Linie zu einer Woche Turmhaft in der Burg Radziejów und zu einer Geldbuße an Chełmski verurteilt; Orłowski, den Chełmski beigezogen hatte, wegen der unbegründeten Rückverweisung zu einer Geldbuße an Prusimski. Der Konvent von Ląd wird von der geforderten Strafe freigesprochen: Sein Protest in Posen vom 26. Juni war nur vorsorglich und ist am 16. Oktober zurückgenommen worden. Der Vollzug: Am 29. November erschien Prusimski, Chełmski blieb aus; Prusimski legte die Karte mit der vom Präsidenten Sebastian Sierakowski und vom Marschall Ksawery Kęszycki unterschriebenen Linie vor, und der vereidigte Geometer Benedykt Woronowski, Kanoniker von Łęczyca, stellte die Linie mit Stangen her. Am 30. November, am 2. und am 3. Dezember ließ das Gericht entlang der Linie einundvierzig Wandhügel aufwerfen und im Sumpf namens Stawisko einunddreißig Pfähle aus Erle und Eiche einschlagen; am 2. Dezember erschien Chełmski persönlich. Der letzte Hügel steht zwölfeinhalb Ruten vor den Endhügeln von Trąbczyn, Łukom und Biskupice, die unberührt blieben; jeder Hügel misst sechs Ellen im Geviert und enthält als Zeichen fünf Steine in Kreuzform, Ziegelstücke, Glasscherben und Kohle. Danach ließ das Gericht die älteren Hügel schleifen und für nichtig erklären; Jasiński hat unterschrieben. Ein Vermerk hält fest, dass Leon Maszewski das Dekret am 7. Dezember 1782 dem Burgamt Konin vorgelegt hat und das Original in die Akten eingeheftet wurde."
app53170koningr153-002: "Urkunde vom 28. November 1782, aufgenommen in der Trąbczyner Olęder-Siedlung im Haus von Martin Hunt, in Gegenwart von Michał Brzeżański, Leon Maszewski und anderen; der Gerichtsbote Bartłomiej Szepczyński von Trąbczyn rief die Handlung aus. Das Kommissariatsamt der großpolnischen Woiwodschaft handelt nach dem Dekret des Krontribunals in Petrikau vom 17. Oktober desselben Jahres zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa. Danach sitzt der Olęder Martin Hunt nicht rechts der vom Tribunal bestimmten Linie und kann nicht Chełmski gehören, der ihn bis dahin besaß; Chełmski sollte ihn binnen sechs Wochen vor dem Kommissar an Prusimski herausgeben. Auf Verlangen Prusimskis, der persönlich anwesend ist, übergibt der Kommissar Martin Hunt in dessen tatsächlichen Besitz und verpflichtet Hunt zum Gehorsam gegenüber Prusimski; niemand widerspricht. Józef Łukaszewicz, Generalkommissar der großpolnischen Woiwodschaft, hat unterschrieben."

# Editorial rulings for 53/17/0/-/Konin Gr.153 (APP).
#
# Two documents. 1: the decree of the boundary chamberlain's field court,
# with the Tribunal's decree copied into it, on leaves 1391 to 1402 verso,
# and the note of its entry on leaf 1403 verso (a decree and the note of its
# entry are one document). 2: the delivery of Martin Hunt on leaf 1404, an
# act of another officer with its own date line. Established 2026-10-07.

places:

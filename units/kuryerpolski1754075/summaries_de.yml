kuryerpolski1754075-001: "Ein Bericht aus Kalisch vom 5. Dezember 1754 in der Warschauer Zeitung Kuryer Polski, Nr. 75 von 1754, auf Polnisch. In Trąbczyn, fünf Meilen von Kalisch, auf den Erbgütern der Familie Prusimski (im Druck „Prusiński“), wurde das Begräbnis des verstorbenen Paweł Prusimski, Kammerherrn Seiner Königlichen Majestät, gehalten, in Anwesenheit vieler verschwägerter Häuser und der Zisterzienser des Konvents von Ląd. Der Abt von Ląd, Głowiecki, war zum Hochamt eingeladen, doch ein unerwarteter Frost hinderte ihn, die Warthe zu überqueren. Die Predigt hielt der Präfekt der Schulen des Jesuitenkollegs in Kalisch, die Leichenrede nach dem Kondukt sein leiblicher Neffe Antoni Prusimski. Auf Anordnung der Witwe, Katarzyna Prusimska, geborene Rozdrażewska, wurden am selben Tag in den nahen Klöstern von Pyzdry, Konin und Kaźmierz Exequien mit Vigilien und vielen Messen gehalten, weil in der Pfarrkirche von Trąbczyn nicht genug Platz war."

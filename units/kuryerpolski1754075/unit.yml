  glob: "*.txt"
  page_id_strip: ""

corpus: corpus.txt

description: >-
  One report from an issue of the Kuryer Polski, a newspaper printed in
  Warsaw, no. 75 of 1754 (25 December), as kept in the Kórnik Library of
  the Polish Academy of Sciences and published in the Wielkopolska Digital
  Library. The report is dated from Kalisz on 5 December and describes the
  funeral held that day at Trąbczyn for Paweł Prusimski, the King's
  chamberlain: the guests, the Cistercians of the convent of Ląd, the abbot
  who was kept away by frost on the Warta, the sermon of the prefect of the
  Jesuit schools of Kalisz, the funeral oration of his nephew Antoni
  Prusimski, and the exequies held at the order of his widow Katarzyna,
  born Rozdrażewska, in the monasteries of Pyzdry, Konin and Kaźmierz.
  Only this report of the page is in the edition; the page holds other news.

translation_note: >-
  Printed Polish of 1754, in the printer's spelling: the long s (ſ), the
  accented á (ná, zá, znáczney), i for j (iako), y for i (frekwencyi). The
  printer spells the family "Prusiński": it is the Prusimski of the edition.
  "Jmć", "Jmći", "Jchmćw", "Jeymći" are Jegomość, Jegomości, Ichmościów,
  Jejmości; "J. K. Mći" is Jego Królewskiej Mości, His Royal Majesty's;
  "ś. p." of blessed memory; "X." the Reverend, "XX." the clergy. "Summa"
  is the High Mass; "Exekwie" exequies; "Synowiec Rodzony" a brother's son.
  "Konwent Łędzki", "Opat Łędzki": the Cistercian convent and abbot of Ląd
  on the Warta (the editor, 2026-10-16); the English says Ląd. A word written [word?] is read with doubt.

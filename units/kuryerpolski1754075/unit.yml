# articles/announcements from newspapers").

slug: kuryerpolski1754075
# The library's shelfmark of the newspaper, then the issue. The site prints the
# library's short name before it: "BK PAN Cz2271, Kuryer Polski 1754, nr 75".
ref: "Cz2271, Kuryer Polski 1754, nr 75"
archive: PAN Biblioteka Kórnicka (BK PAN)
title: >-
  A report from Kalisz in the Warsaw newspaper Kuryer Polski of 25 December
  1754 on the funeral of Paweł Prusimski, the King's chamberlain, at
  Trąbczyn on 5 December: the clergy present, the sermon and the funeral
  oration of his nephew Antoni Prusimski, and the exequies his widow
  Katarzyna had said in three monasteries nearby.
title_de: >-
  Ein Bericht aus Kalisch in der Warschauer Zeitung Kuryer Polski vom 25.
  Dezember 1754 über das Begräbnis des königlichen Kammerherrn Paweł
  Prusimski in Trąbczyn am 5. Dezember: die anwesende Geistlichkeit, die
  Predigt und die Leichenrede seines Neffen Antoni Prusimski und die
  Exequien, die seine Witwe Katarzyna in drei nahen Klöstern halten ließ.
# The newspaper's title as the digital library gives it. Nothing displays it.
archive_title: >-
  Kuryer Polski Anno 1754. nr75
# The issue is dated 25 December 1754 (the editor, and the digital library's
# record); the report in it is dated "z Kalißa die 5. Decemb:".
date_span: "1754"
status: translated         # draft | transcribed | translated | published
published_tag: ""

# Which era this holding belongs to - reference/eras.yml. Paweł Prusimski held

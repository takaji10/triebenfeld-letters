- {claim: "das Amt findet es in seinen Akten nicht, kann es nicht herausgeben und bescheinigt die Nachsuche", verdict: supported, where: "Quoniam requisito temporis spatio in Actis non reperitur Ideo illud uti Irreperibile extradere non valet"}

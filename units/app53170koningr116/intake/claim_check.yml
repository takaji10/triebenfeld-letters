app53170koningr116-008:
- {claim: "Eintrag vom 16. Februar 1776", verdict: supported, where: "Actum in Conin Feria Sexta post Dominicam Sexagesimae proxima Videlicet Die Decima Sexta Mensis Februarii Anno Domini 1776"}

- {claim: "im Namen von Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, verlangen sie die Herausgabe eines Kommissionsdekrets, das kraft der neuen Konstitution auf dem strittigen Grund von Trąbczyn und Łukom als Versäumnisdekret gegen Prusimski ergangen und angeblich dem Amt zur Eintragung eingereicht worden sei", verdict: supported, where: "nomine Magnifici Antonii de Kolno Prusimski Capitanei Niszczevicensis Bonorum Trąmpczyn cum attinentiis extradi Pe[t?][?]erunt Decretum Commissoriale Vi Constitutionis Novellae in Fundo Controverso Bonorum Trąmpczyn et Łukom in Contumaciam Magnifici Prusimski Prolatum ac si ad Acta praesenti more Oblatae porrectum"}

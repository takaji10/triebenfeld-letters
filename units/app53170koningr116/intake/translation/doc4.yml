  en: 'Right Honourable Prusimski against the [Possessors of] Tomic and Others — Protest


    Let there be seen here the Formal Protest made in fact and upon the personal appearance of the Right
    Honourable Antoni Prusimski, Starost of Niszczewice, heir of the goods of Trąbczyn, in and against
    the Right Honourables Gliszczyński, [uncertain: possessors] of the goods of Tomic, and Stanisław Chełmski,
    heir of the goods of Łukomia, etc. — and that by reason of the boundary field act, its entanglement,
    and other circumstances — made and in the original submitted among the Produced Documents.


    Antoni of Kolno Prusimski, Starost of Niszczewice, by his own hand'

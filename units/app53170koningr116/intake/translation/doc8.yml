  en: 'Done in Konin on the Friday next after Sexagesima Sunday, namely on the sixteenth day of the month
    of February in the Year of the Lord 1776.


    On behalf of the Right Honourable Prusimski — Requisition of the Commissorial Decree


    Coming in person before the present Municipal Court and Records of Konin, the Right Honourables Antonius
    Lipiński and Nicolaus Ostrowski, having with them the Honest Bartholomaeus Szepczyński of Trąbczyn,
    General Royal Court Summoner, being of sound mind, requisitioned and requested from the present Office
    that there be issued to them on behalf of the Right Honourable Antoni of Kolno Prusimski, Starost
    of Niszczewice, heir of the goods of Trąbczyn with its appurtenances, the Commissorial Decree — issued
    in contumacy of the Right Honourable Prusimski on the contested estate of the goods of Trąbczyn and
    Łukom by virtue of the New Constitution — as if submitted to the present Records in the manner of
    an Oblata. The present Municipal Court of Konin, consenting to this Requisition, was willing to issue
    the said claimed Boundary Field Commissorial Decree; but since, upon review of the Protocol of the
    Office, the said Decree has not been submitted to the present Records up to this point, it therefore
    cannot issue the aforesaid Decree, up to and exclusive of —'

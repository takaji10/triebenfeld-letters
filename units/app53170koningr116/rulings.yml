# Editorial rulings for 53/17/0/-/Konin Gr.116 (APP).
#
# Twelve documents, one for each entry of the register; the three notes of
# the sitting of 16 August 1775 are one document (docs/PRUSIMSKI_ERA_PLAN.md,
# "One document or many"). Three entries are a heading with nothing written
# under it (6, 9, 10); each is a document all the same
# (docs/archive/PRUSIMSKI_QUESTIONS.md). Which entry is which is in
# intake/holding.py. Established 2026-10-07.

places:
  # Place of writing: every sitting is headed "Actum in Conin".
  overrides:
    "1": Konin
    "2": Konin
    "3": Konin
    "4": Konin
    "5": Konin
    "6": Konin
    "7": Konin
    "8": Konin
    "9": Konin
    "10": Konin
    "11": Konin
    "12": Konin

dates:
  # [year, month, day, precision]; read off the document: the line "Actum in
  # Conin ..." directly above the entry, which the editor transcribed with it.
  read:
    "2": [1775, 8, 16, "day"]     # Feria Quarta post Festum Assumptionis ... Die 16ta Mensis Augusti 1775
    "6": [1775, 10, 3, "day"]     # Feria Tertia Ante Festum Sancti Francisci ... Die Tertio Mensis Octobris 1775
    "8": [1776, 2, 16, "day"]     # Feria Sexta post Dominicam Sexagesimae ... Die Decima Sexta Mensis Februarii 1776
  supplied: {}
  twin: {}

  # [year, month, day, precision, basis]; the basis is shown to the reader.
  # Entries with no heading of a sitting on a photographed page.
  inferred: {}

  # The date of the sitting the entry stands under, where the heading is not
  # directly above it and is not part of the transcription:
  # [year, month, day, precision, basis].
  sitting:
    "1": [1775, 8, 14, "day", "The heading of the sitting, on p. 77 (shown above the text): Monday 14 August 1775."]
    "3": [1775, 9, 22, "day", "The heading of the sitting, on p. 88v (shown above the text): Friday 22 September 1775."]
    "4": [1775, 9, 22, "day", "The heading of the sitting, on p. 88v (shown above the text): Friday 22 September 1775."]
    "5": [1775, 9, 22, "day", "The heading of the sitting, on p. 88v (shown above the text): Friday 22 September 1775."]
    "7": [1775, 10, 9, "day", "The heading of the sitting, on p. 95 (shown above the text): Monday 9 October 1775."]
    "9": [1776, 7, 1, "day", "The heading of the sitting, on p. 175 (shown above the text): Monday 1 July 1776."]
    "10": [1776, 9, 5, "day", "The heading of the sitting, on p. 201v (shown above the text): Thursday 5 September 1776."]
    "11": [1777, 4, 24, "day", "The heading of the sitting, on p. 266 (shown above the text): Thursday 24 April 1777."]
    "12": [1777, 10, 20, "day", "The heading of the sitting, on p. 333v (shown above the text): Monday 20 October 1777."]
  no_date: []

documents:
  # 3, 4, 5 and 7 are the registration of a protest, signed by the one who
  # makes it; 8 and 12 the office's certificate of a search; the rest notes.
  doc_type:
    "1": note
    "2": note
    "3": protest
    "4": protest
    "5": protest
    "6": note
    "7": protest
    "8": certification
    "9": note
    "10": note
    "11": note
    "12": certification

  language:
    "1": la
    "2": la
    "3": la
    "4": la
    "5": la
    "6": la
    "7": la
    "8": la
    "9": la
    "10": la
    "11": la
    "12": la

  duplicate_of: {}
  split_note: {}
  relations: {}

  # The estate the document is ABOUT, as slugs from reference/places.yml.
  estates:
    "1": [trabczyn, lukomia]
    "2": [trabczyn, lukomia]
    "3": [trabczyn, lukomia]
    "4": [trabczyn, lukomia]
    "5": [trabczyn, lukomia]
    "6": [trabczyn, lukomia]
    "7": [trabczyn, lukomia]
    "8": [trabczyn, lukomia]
    "9": [trabczyn, lukomia]
    "10": [trabczyn, lukomia]
    "11": [trabczyn, lukomia]
    "12": [trabczyn, lukomia]

pages:
  # The editor's transcription is by paragraph, not by line.
  by_paragraph: ["0079_a1", "0079_a2", "0090_a1", "0090_a2", "0095_a1", "0096_a1", "0132_a1", "0132_a2", "0175_a2", "0202_a1", "0202_a2", "0267_a1", "0336_a1"]

damage:

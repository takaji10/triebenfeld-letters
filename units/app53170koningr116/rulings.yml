  by_paragraph: ["0079_a1", "0079_a2", "0090_a1", "0090_a2", "0095_a1", "0096_a1", "0132_a1", "0132_a2", "0175_a2", "0202_a1", "0202_a2", "0267_a1", "0336_a1"]


# German summaries of APP 53/17/0/-/Konin Gr.116, written in the working session from the Latin as checked
# (intake/holding.py, 2026-10-07).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app53170koningr116-001: "Registervermerk im Buch des Burggerichts Konin, August 1775: Vorgelegt wird ein Auszug der Konstitution, mit der die Stände der Republik eine Kommission auf den Grund von Trąbczyn angeordnet haben, um dieses Gut gegen Łukom abzugrenzen; der Auszug ist den Akten des königlichen Hofes in Warschau entnommen und liegt bei den vorgelegten Schriftstücken."
app53170koningr116-002: "Drei Registervermerke vom 16. August 1775 zur Bekanntmachung der Grenzkommission. Für Prusimski wird das Bekanntmachungsschreiben für die auf den Grund von Trąbczyn angesetzte Kommission vorgelegt, eingereicht vom ersten der Unterzeichner. Vermerkt wird ferner der Bericht über die Ladungen, die Antoni Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn, an die Erbherren und Besitzer von Łukom, Podbiele und Szetlew sowie an Abt und Konvent von Ląd hat ergehen lassen, und der Bericht über die Ladungen, die Chełmski, Erbherr von Łukom, an die Erbherren von Trąbczyn, Drzewce und Biskupice zum Termin der Grenzkommission zwischen Trąbczyn und Łukom hat ergehen lassen."
app53170koningr116-003: "Registervermerk über einen Protest, eingetragen in Konin im September 1775. Fünf Kommissare der Feldkommission zwischen Trąbczyn und Łukom sind persönlich erschienen: Dąmbski, Woiwode von Brześć Kujawski, Brzeziński, Starost von Inowrocław, Dąmbski, Fähnrich von Brześć Kujawski, Kwilecki und Umiński. Sie protestieren gegen Chełmski und die von seiner Seite beigezogenen Kommissare wegen einer Handlung, die diese einseitig auf dem strittigen Grund von Łukom und Trąbczyn vorgenommen haben. Alle fünf haben eigenhändig unterschrieben, Ludwik Dąmbski als Kommissar und Präses."
app53170koningr116-004: "Registervermerk über einen Protest, eingetragen in Konin im September 1775. Antoni Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn, ist persönlich erschienen und protestiert gegen die Gliszczyński von Tomice, gegen Stanisław Chełmski von Łukomia und andere, wegen der Verwicklung des Grenzverfahrens im Feld und anderer Umstände. Der Protest wurde im Original eingereicht und liegt bei den vorgelegten Schriftstücken. Prusimski hat unterschrieben."
app53170koningr116-005: "Registervermerk über einen Protest, eingetragen in Konin im September 1775. Piotr Rajewicz ist persönlich erschienen und erklärt vorsorglich, er habe sich in das zwischen Łukom und Trąbczyn betriebene Grenzverfahren in keiner Weise eingelassen, und was geschehen sei, sei ohne seine Zustimmung geschehen. Er hat unterschrieben."
app53170koningr116-006: "Überschrift eines Eintrags vom 3. Oktober 1775: für den Erbherrn von Trąbczyn, Besichtigung des Grenzzugs. Der Eintrag selbst wurde nicht geschrieben."
app53170koningr116-007: "Registervermerk über einen Gegenprotest vom 9. Oktober 1775. Stanisław Ścibor Chełmski, Erbherr des Gebiets von Łukomia, ist persönlich erschienen und protestiert seinerseits gegen Antoni Prusimski, Starost von Niszczewice, und gegen die Handlung der Grenzkommission zwischen Trąbczyn und Łukom. Der Gegenprotest liegt bei den vorgelegten Schriftstücken. Chełmski hat unterschrieben."
app53170koningr116-008: "Eintrag vom 16. Februar 1776. Antoni Lipiński und Nicolaus Ostrowski erscheinen mit dem Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vor dem Burgamt Konin. Im Namen von Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, verlangen sie die Herausgabe eines Kommissionsdekrets, das kraft der neuen Konstitution auf dem strittigen Grund von Trąbczyn und Łukom als Versäumnisdekret gegen Prusimski ergangen und angeblich dem Amt zur Eintragung eingereicht worden sei. Das Amt hat sein Protokoll durchgesehen: Das Dekret ist bis zum heutigen Tag nicht eingereicht worden; das Amt kann es nicht herausgeben und bescheinigt die Nachsuche. Die beiden haben unterschrieben."
app53170koningr116-009: "Überschrift eines Eintrags vom 1. Juli 1776: für Chełmski, Nachsuche nach dem in Trąbczyn und Łukom ergangenen Kommissionsdekret. Der Eintrag wurde nicht geschrieben; über dem leeren Platz steht „Vacuum“, darunter die Unterschrift Fr. Zielonacki."
app53170koningr116-010: "Überschrift eines Eintrags vom 5. September 1776: für Chełmski, Nachsuche nach dem Mandat und dem Felddekret, die zwischen den Gütern Łukom und Trąbczyn ergangen sind. Der Eintrag wurde nicht geschrieben; über dem leeren Platz steht „Vacuum“, auf der folgenden Seite unterschrieben von Stanisław Ścibor Chełmski."
app53170koningr116-011: "Überschrift eines Protests von Prusimski gegen Chełmski, ohne Datum, wohl 1777. Darunter vermerkt der Schreiber, dass die Angaben dazu nicht geliefert wurden und dass auf Verlangen der Partei nach Ablauf von drei Tagen „limitiert“ wird. Antoni Prusimski von Kolno, Starost von Niszczewice, hat unterschrieben."
app53170koningr116-012: "Eintrag ohne Datum, wohl vom Oktober 1777. Stanisław Ścibor Chełmski, Erbherr von Łukom, erscheint persönlich vor dem Burgamt Konin und verlangt die Herausgabe eines Feldkommissionsdekrets, das zwischen den Erbherren der Dörfer Nowa Wieś, Łazy, Osiny, Trąbczyn, Łukom und anderer ergangen sei, kraft der von den Ständen mit der Konstitution von 1775 erteilten Kommission, und das die Kommissare auf Seiten Prusimskis unterschrieben hätten. Das Amt findet es in seinen Akten nicht, kann es nicht herausgeben und bescheinigt die Nachsuche. Chełmski hat unterschrieben."

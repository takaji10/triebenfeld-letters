  Twelve entries from the register of the castle court at Konin, 1775 to
  1777, on the commission that fixed the boundary between Trąbczyn and
  Łukomia: the notices of its coming, the protests of the commissioners, of
  Prusimski and of Chełmski while it sat, and the searches each side then
  made at Konin for a decree that was not found there.

  Bekanntmachungen ihres Kommens, die Proteste der Kommissare, Prusimskis
  und Chełmskis während ihrer Sitzung und die Nachsuchen, die beide Seiten
  danach in Konin nach einem Dekret anstellten, das dort nicht zu finden
  war.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Twelve short entries from a register of the castle court of Konin for 1775
  to 1777, in Latin, several with autograph signatures in Polish. They
  concern the commission that the Estates appointed to fix the boundary
  between Antoni Prusimski's Trąbczyn and Stanisław Ścibor Chełmski's Łukom.
  Two record the papers announcing it (August 1775). Four are protests
  registered while it sat: by five of the commissioners against Chełmski and
  commissioners of his own for an act made unilaterally, by Prusimski, by
  Piotr Rajewicz, and Chełmski's counter-protest (9 October 1775). One is a
  bare heading for an inspection of the boundary line (3 October 1775). On
  16 February 1776 Prusimski's men ask for a commission decree given in
  default against him; it has not been brought in. Two headings of 1776
  announce searches for Chełmski and were left blank. One undated heading is
  a protest by Prusimski for which no text was supplied. In the last, of
  1777, Chełmski in person asks for the commission's decree signed by the
  commissioners on Prusimski's side; it is not found.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Entries of a court register of 1775 to 1777, in formulaic Latin. The
  English is the editor's own translation. "Videatur hoc loco ... in
  Productis" notes that a paper is filed among those produced; "innotescentia"
  a formal notice; "citatio" a summons; "oblata" a paper brought in to be
  entered; "manifestatio" a protest and "remanifestatio" a counter-protest;
  "requisitio" a request that the office search its records; "Vacuum" marks
  a space left empty.

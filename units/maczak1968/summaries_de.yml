maczak1968-001: "Ein Aufsatz des polnischen Wirtschaftshistorikers Antoni Mączak, auf Englisch (übersetzt von Ewa Tymowska), gedruckt in Acta Poloniae Historica 18 (1968), S. 75–98; Literatur, keine Primärquelle. Er fragt, wer zwischen 1550 und 1650 an der Ausfuhr polnischen Getreides auf der Weichsel nach Danzig gewann und wer verlor. Die Grundherren antworteten auf die holländische Nachfrage, indem sie Vorwerksland und Fronarbeit auf Kosten der Bauern vergrößerten. Aus den Registern des Wasserzolls in Włocławek, den Rechnungen des königlichen Guts Marienburg und den Steuerregistern der Wojewodschaft Krakau zeigt er, dass der Anteil jeder Gegend mit den Ernten stieg und fiel, dass die großen Güter den größten und beständigsten Teil schickten (die Familien Tęczyński und Firlej zusammen 15 Prozent des Getreides Kleinpolens) und dass die Gewinne den Magnaten halfen, das Land des kleineren Adels aufzukaufen. Er vergleicht Kleinpolen, das Königliche Preußen und Masowien und schließt mit den Preisen und Löhnen in Danzig, Krakau, Lemberg und Warschau. Mit einer Karte, sieben Tabellen und einem Schaubild. Trąbczyn nennt er nicht; er erwähnt Getreide, das Großpolen „ein wenig entlang der Warthe“ ausführte, und die Landwirtschaft der holländischen Kolonisten im Königlichen Preußen."

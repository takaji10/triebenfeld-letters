description: >-
  A scholarly article of 1968, not a primary source: the Polish economic
  historian Antoni Mączak (1928-2003) on the export of grain from Poland by
  the Vistula to Gdańsk between 1550 and 1650 and on who gained by it,
  printed in English in Acta Poloniae Historica 18 (1968), pages 75 to 98,
  translated from the Polish by Ewa Tymowska. From the registers of the
  water toll at Włocławek, the accounts of the royal estate of Malbork, the
  Sound toll and the tax registers of the voivodship of Cracow it shows how
  each region's share of the grain sent down the river rose and fell with
  the harvests, how the great estates and magnate families such as the
  Tęczyńskis and the Firlejs sent the largest and steadiest part of it, and
  how the profits of the trade helped the magnates buy up the land of the
  lesser gentry, while the peasants paid for the growth of the demesne. It
  sets Little Poland, Royal Prussia and Masovia side by side and ends with
  the prices and wages of Gdańsk, Cracow, Lwów and Warsaw. A map shows the
  provinces and the Vistula toll stations, seven tables give the figures,
  and a chart compares prices and wages. The article does not name Trąbczyn
  or the district of Konin. It says that Great Poland exported grain from the
  regions near the Vistula and a little along the Warta, and it speaks of the
  intensive farming and dairying of the Dutch colonists in Royal Prussia: the
  settlers whose name, Olędrzy, the colonists of Trąbczyn later carried.

translation_note: >-
  The article is printed in English, the translation of 1968 by Ewa Tymowska,
  and is not translated again. Its English is of its time and place:
  "corn" is grain in general, a "last" a measure of grain (one Gdańsk last
  of rye about 2.2 tonnes), "Rdl." Reichsthaler, "voivodship" a province.
  Decimals are written with a comma in the text (6,44) and a point in the
  tables (20.4), as printed.

# Claim check of the summary of Mączak 1968 (intake/summaries.py), in session,
# 2026-10-20. Each statement of the English summary, the passage of the article
# that supports it, and the verdict. The German says the same.
document: 1
statements:
  - claim: An article by Antoni Mączak, in English, translated by Ewa Tymowska, Acta Poloniae Historica 18 (1968), pp. 75-98.
    support: 'p. 75 "Antoni Mączak", "Acta Poloniae Historica 18, 1968"; p. 98 "(Translated by Ewa Tymowska)"; the pages run 75 to 98.'
    verdict: supported
  - claim: The Polish economic historian.
    support: The RCIN record names him "Mączak, Antoni (1928-2003)"; the article is economic history and cites his own works on the Polish economy (nn. 9, 13, 30, 41).
    verdict: supported
  - claim: It asks who gained and who lost by the export of grain down the Vistula to Gdańsk, 1550 to 1650.
    support: 'p. 75 "difficulties arise when we ask ourselves which social groups gain and which lose"; p. 76 the analysis "from the point of view of grain export"; title "1550 - 1650".'
    verdict: supported
  - claim: Landowners met the Dutch demand by enlarging their demesnes and serf labour at the peasants' cost.
    support: 'p. 76 "the increase of the demand for grain in Gdańsk, which was first of all a result of the trade activity of the Dutch, induced landowners ... to enlarge sown areas and to introduce serf-labour on a large scale"; "carried through at the expense of the peasantry".'
    verdict: supported
  - claim: Sources - the water-toll registers of Włocławek, the accounts of the royal estate of Malbork, the tax registers of the voivodship of Cracow.
    support: 'p. 79 "registers of water duties ... at Włocławek"; p. 83 prices "taken by the royal estate of Malbork", n. 15 "Ekonomia Malborska"; nn. 24, 25 and Table 7 "Rejestr poborowy województwa krakowskiego".'
    verdict: supported
  - claim: Each region's share rose and fell with the harvests.
    support: 'p. 79 Table 1 and "the movement of the export surplus, being an amplified reflection of the fluctuation of harvests, changes in relation to the differences of climate".'
    verdict: supported
  - claim: The great estates sent the largest and steadiest part.
    support: 'p. 80 "the fluctuation amplitude of the bulk of goods sent that way was smaller for magnates and royal estates"; Table 2 (magnates 52-76 per cent of the gentry''s grain); p. 88 "the share of big landowners in the export of grain was several times higher".'
    verdict: supported
  - claim: The Tęczyński and Firlej families together 15 per cent of the grain of Little Poland.
    support: 'Table 4, last row: "In relation to the river transport from Little Poland (%)" ... "by the Tęczyńskis and the Firlejs" 15.'
    verdict: supported
    note: In the twelve years of the table, 1555 to 1576; the summary says "of the grain of Little Poland", which is the table's own wording.
  - claim: The profits helped the magnates buy up the land of the lesser gentry.
    support: 'p. 87 "Owing to profit from grain export they were able to increase their landed estates"; p. 89 "Table 7 presents the results of the buying out of the estates of lesser gentry in the voivodship of Cracow by the big landlords"; p. 90 "it provided great landowners with the means which facilitated and speeded up the accumulation of estates".'
    verdict: supported
  - claim: It compares Little Poland, Royal Prussia and Masovia.
    support: 'p. 94 "two contrasting regions: southern Little Poland and Royal Prussia"; p. 96 "We shall now proceed to discuss Masovia".'
    verdict: supported
  - claim: It ends with the prices and wages of Gdańsk, Cracow, Lwów and Warsaw.
    support: 'p. 98 "There are some available price and wages relations concerning Gdańsk, Cracow, Lwów and Warsaw"; the chart on p. 97 (Gdańsk, Cracow, Warsaw).'
    verdict: supported
  - claim: With a map, seven tables and a chart.
    support: Map p. 81; Tables 1 to 7 (pp. 79, 82, 83, 85, 86, 89, 90); chart p. 97.
    verdict: supported
  - claim: It does not name Trąbczyn.
    support: No Trąbczyn, Konin or Olęder in the text (searched).
    verdict: supported
  - claim: It mentions grain that Great Poland exported "a little along the Warta river".

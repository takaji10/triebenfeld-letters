app536017-001: "Eintrag des Landgerichts in Konin von 1589, überschrieben damit, dass Łukomski eine Besichtigung durchzuführen hat. Albertus Trąmpczyński Otha hat als Kläger Thomas Łukomski zum zweiten Mal geladen, nachdem dieser beim ersten Mal ausgeblieben war. Er wirft ihm vor, er habe in diesem Jahr mit anderen Nachbarn im Gut des Dorfes Łukom einen Teich angelegt und durch zu starkes Aufstauen des Wassers eine große Menge Wald, Kiefernwald, unfruchtbare Weide und Wiesen in den Gütern der Dörfer Trąbczyn, Nowa Wieś und Osiny überschwemmt; ein polnischer Satz nennt Eichen, Buchen und Eschen, die zum Bauen und für Bienenbeuten taugten und durch die Überschwemmung abgestorben seien. Den Schaden schätzt der Kläger auf zehntausend ungarische Goldgulden und ebenso viel Schadenersatz. Das Gericht ordnet auf Antrag des Beklagten eine gerichtliche Besichtigung an und gibt einen Gerichtsboten bei, den der Beklagte wählt und bezahlt; er soll sehen, an welchem Ort und auf wessen Grund das Unrecht geschehen ist und ob es geschehen ist. Der Beklagte hat die Besichtigung binnen sechs Wochen am strittigen Ort durchzuführen, beide Parteien müssen anwesend sein, und bei den nächsten Gerichtsterminen in Konin haben sie einen letzten Termin, um das Ergebnis vor Gericht zu hören."

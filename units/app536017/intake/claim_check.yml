- {claim: "das Gericht ordnet auf Antrag des Beklagten eine gerichtliche Besichtigung an und gibt einen Gerichtsboten bei, den der Beklagte wählt und bezahlt; er soll sehen, an welchem Ort und auf wessen Grund das Unrecht geschehen ist und ob es geschehen ist", verdict: supported, where: "p. 1: Ad affectationem Juridicam partis Citatae ... decrevit praesentibusque decernit Visionem Juridicam Nihilominusque addidit ... Ministerialem terrestrem quem sibi pars Citata elegerit ad videndum videlicet et conspiciendum quo in loco cuius in fundo iniuria praefata illata et utrum facta necne ... sumptibus proprijs Ministeriali conducto"}

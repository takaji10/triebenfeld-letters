- {claim: "er habe in diesem Jahr mit anderen Nachbarn im Gut des Dorfes Łukom einen Teich angelegt", verdict: supported, where: "p. 1: ipse anno praesenti constructo stagno cum caeteris vicinis suis ... in haereditate villae Łukom"}
- {claim: "und durch zu starkes Aufstauen des Wassers eine große Menge Wald, Kiefernwald, unfruchtbare Weide und Wiesen in den Gütern der Dörfer Trąbczyn, Nowa Wieś und Osiny überschwemmt", verdict: supported, where: "p. 1: ingentem quantitatem silvae et borrae pascuorum sterilium necnon pratorum per nimiam dettentionem aquae in eisdem haereditatibus villarum Trąmpczino, Nowawiesz et Osziny inundavit"}
- {claim: "ein polnischer Satz nennt Eichen, Buchen und Eschen, die zum Bauen und für Bienenbeuten taugten und durch die Überschwemmung abgestorben seien", verdict: supported, where: "p. 1: zalial drzewa pospolithego rodzaynego dembiny bucziny jeszyeniny thim zaliewkyem poszuszil do budowania i do barczi godnego"}

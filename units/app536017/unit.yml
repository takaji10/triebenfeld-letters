# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry on leaves 27 and 27 verso of a book of the land court at Konin
  for 1589, in Latin with a sentence of Polish. Its heading says that
  Łukomski is to carry out an inspection. Albertus Trąmpczyński Otha,
  plaintiff, has cited Thomas Łukomski a second time, after a first default:
  Łukomski, with neighbours against whom the plaintiff keeps his claim, has
  this year built a pond in the estate of the village of Łukom, and by
  holding back too much water has flooded a great quantity of woodland, pine
  forest, barren pasture and meadow in the plaintiff's estates of Trąbczyn,
  Nowa Wieś and Osiny, killing oak, beech and ash fit for building and for
  bee-trees. The plaintiff puts the harm at ten thousand Hungarian florins
  and as much again. The court, at the defendant's request, orders an
  inspection on the ground, and adds one of its messengers, whom the
  defendant is to choose and pay, to see where and on whose ground the wrong
  was done and whether it was done. The defendant must carry it out within
  six weeks; both parties must attend; at the next court terms at Konin they
  have a final term to hear the outcome.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  An entry of a Polish land court of 1589, in heavily abbreviated Latin; the
  transcription fills the abbreviations out. One sentence is in the Polish
  of the time ("zalial drzewa pospolithego rodzaynego ..."). "Visio" is an
  inspection of the ground ordered by the court; "Ministerialis terrestris"
  the land court's messenger (woźny), who views the ground and reports;
  "terminus peremptorius" a final term; "borra" pine forest. Trąmpczino is
  Trąbczyn; Osziny is Osiny. "motibus[?]" and the words ending in "~" are
  not fully read.

# What the "How it was prepared" tab says (reference/prepared.yml; the old text is in notes.md).
prepared:
  transcription:
  - t-editor
  - en: The editor's first reading left most words of the court's order in doubt. At the editor's request Claude read the entry again from the scans, reading each phrase in all the places it occurs in the neighbouring entries, which are orders of the same kind in the same set words. Its reading replaced the editor's text; five places remain marked as not fully read.
    de: Die erste Lesung des Herausgebers ließ die meisten Wörter der gerichtlichen Anordnung im Zweifel. Auf Wunsch des Herausgebers las Claude den Eintrag noch einmal an den Scans und las jede Wendung an allen Stellen, an denen sie in den benachbarten Einträgen vorkommt; diese sind Anordnungen derselben Art in denselben festen Worten. Seine Lesung ersetzte den Text des Herausgebers; fünf Stellen bleiben als nicht vollständig gelesen gekennzeichnet.
  translation:
  - en: The editor's English had been made from the first reading; Claude revised it throughout to follow the new reading, keeping the editor's terms.
    de: Das Englisch des Herausgebers war nach der ersten Lesung entstanden; Claude überarbeitete es durchgehend nach der neuen Lesung und behielt die Begriffe des Herausgebers bei.
  - s-claude

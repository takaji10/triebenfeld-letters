# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  An entry of the land court at Konin of 1589, the earliest document in this
  edition on the quarrel between Trąbczyn and Łukom: Albertus Trąmpczyński Otha sues
  Thomas Łukomski for building a pond at Łukom that flooded the woods,
  pastures and meadows of Trąbczyn, Nowa Wieś and Osiny, and the court
  orders an inspection on the ground within six weeks, with one of its
  messengers, at Łukomski's cost.
title_de: >-
  Ein Eintrag des Landgerichts in Konin von 1589, das früheste Dokument dieser
  Edition zum Streit zwischen Trąbczyn und Łukom: Albertus Trąmpczyński Otha verklagt
  Thomas Łukomski, weil dieser bei Łukom einen Teich angelegt habe, der
  Wälder, Weiden und Wiesen von Trąbczyn, Nowa Wieś und Osiny überschwemmte,
  und das Gericht ordnet binnen sechs Wochen eine Besichtigung im Gelände
  mit einem seiner Boten an, auf Kosten Łukomskis.

# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  Six pages of an eighteenth-century copy-book of the privileges of the
  Cistercian abbey of Ląd: King Kazimierz's exchange of 1362 that gave the
  abbey the forest where Drzewce was founded, the abbey's purchase of three
  mansi of Łukom with the forest of Grądzyń, confirmed by the king in 1447
  and resigned before the captain of Greater Poland in 1461, the boundary of
  Makownica in 1399, the beginning of a privilege for the settlers of
  Drzewce, and a page of the renewal of the mounds between Łukom, Zagórów
  and Drzewce in 1761.
title_de: >-
  Sechs Seiten eines Kopialbuchs der Privilegien der Zisterzienserabtei Ląd
  aus dem 18. Jahrhundert: der Tausch König Kasimirs von 1362, durch den die
  Abtei den Wald erhielt, in dem Drzewce gegründet wurde, der Kauf von drei
  Hufen in Łukom mit dem Wald Grądzyń durch die Abtei, vom König 1447
  bestätigt und 1461 vor dem Generalstarosten von Großpolen aufgelassen,
  die Grenze von Makownica 1399, der Anfang eines Privilegs für die Siedler
  von Drzewce und eine Seite der Erneuerung der Grenzhügel zwischen Łukom,
  Zagórów und Drzewce 1761.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Six pages, in Latin, of a copy-book of the privileges of the Cistercian
  abbey of Ląd on the Warta, made in the eighteenth century and kept in the
  State Archive in Poznań in the fond of the abbey. The copyist gives each
  privilege a heading and a number. Page 13 has no. 14, Mikołaj, heir of
  Venacia and judge of Kalisz, marking the boundary of the abbey's village of
  Makownica (Ląd, 1399), and the beginning of no. 15, which runs on to page
  14: Piotr of Szamotuły, general captain of Greater Poland, attests that the
  Wochneth (Bochneth) brothers and nephews sold three mansi in Łukom, in the
  parish of Zagórów, with the forest Grądzyń and other woods, to the abbot
  and convent of Ląd for 400 marks (Pyzdry, 1461). From the foot of page 14
  to page 15 runs no. 16, King Kazimierz's confirmation (Gniezno, 1447) of
  the contract by which Abbot Maciej had bought the same three mansi and the
  forest of Grądzyń from the brothers Mikołaj, Jan and Warsz of Koscielec.
  Pages 25 and
  26 have no. 25, King Kazimierz's exchange of 1362 (Pyzdry): the abbey's
  village of Little Wronczyn and its mill below the castle of Pyzdry for
  sixty Franconian mansi of the royal forest Czernietz in the district of
  Konin, where the village of Drzewce was later founded, and the beginning
  of no. 26, the king's grant of twenty years' freedom to the colonists
  settled there. Page 66 is the middle of no. 46, the decree of a
  compromissory court of 1761 that marked the boundary between the estate of
  Łukom, the town of Zagórów and Drzewce, counting the mounds.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Latin copied in the eighteenth century, in the copyist's spelling, with his
  common abbreviations written out; a name or adjective he cuts short stands
  cut short with a stop (Landen., Posnanien., Coninen.). Each privilege opens
  with the copyist's heading and his number. Polish words stand in the Latin
  as the originals had them: "kopce" (boundary mounds), "sep", "naraz",
  "powos" (levies and the carting duty), "niwa" (a field). "parvum Wronczyno"
  is Little Wronczyn, a village of the abbey near Pyzdry, not Trąbczyn.
  "Grądzyń", "Grądzyń" is the forest of Grądzyń beside Łukom (the
  editor, 2026-10-21); "Lukom" is the settlement
  and "Lukomia" the estate. A "Scopulus" is a boundary mound, a "pertica" a
  rod. A word followed by [?] is read with doubt.

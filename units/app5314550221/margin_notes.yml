# Chmielniki et cum Sylva Lome"), in a hand lighter than the copyist's and
# perhaps another; a stroke runs from it towards the text. The line is
# ordinary text in corpus.txt, at the end of its document's part of the page;
# this file only says that it was written in the margin, so the site can set
# it apart.
#   first: the block's first line exactly as it stands in corpus.txt
#   lines: how many lines the block has
# A first line that is edited must be edited here too; build_db.py stops if a
# block cannot be found.
blocks:

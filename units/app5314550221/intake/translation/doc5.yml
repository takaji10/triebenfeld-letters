  en: 'Privilege of freedom from Polish exactions for the colonists settled in Czernetz. 26.


    Let all, present and to come, who will have knowledge of these presents, know: that we, Kazimierz,
    by the grace of God King of Poland, wishing to enlarge the profits of our kingdom further, and that
    the forest which we gave and granted by reason of an exchange to the religious men, the abbot and
    convent of the monastery at Ląd, of the Cistercian Order, should grow into richer fruit (in which
    forest, called in the vernacular Czernetz, lying in the land of Kalisz, the said abbot and convent
    of the monastery at Ląd are to have sixty mansi or łany, sufficiently and fully measured), and that
    the said sixty mansi might be settled more easily and diligently, or be possessed by any colonists,
    give and grant to all and every peasant or inhabitant who has been or shall be settled in the said
    forest Czerletz, or on the said mansi now belonging to the said monastery at Ląd, full and complete
    freedom for twenty continuous years from the date of these presents. We release the said peasants
    who have been settled on the said sixty mansi by the abbot or the monastery of Ląd in the said forest
    Czernetz from all exactions, namely sep, naraz, the pig, the cow, the sheep, powos, carting of any
    kind, and all other services and extra services by whatever name they are called; and in particular
    we will that no castellan or official'

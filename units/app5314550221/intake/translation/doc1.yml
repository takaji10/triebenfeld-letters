  en: 'Privilege of Mikołaj, heir, on the boundaries or limits of the village of Makownica. 14.


    In the name of the Lord, Amen. For the perpetual memory of the matter. We, Mikołaj, heir of Venacia,
    general judge of the land of Kalisz, wish it to be known to all and each, present and to come, who
    will have knowledge of these presents: that, after mature deliberation and sound and sufficient counsel
    taken on it, desiring, with the help of the Almighty [uncertain: suffragio] first secured, to obtain
    a saving remedy for our soul and for the souls of our kin, and wishing our heritage, namely Makownica,
    which had earlier been resigned to our monastery of Ląd in the presence of the Most Serene Prince
    and Lord, Lord Władysław, by the grace of God illustrious King of Poland etc., and confirmed in perpetuity
    by his letters patent, to be more fully known and manifest in its bounds and boundaries, we ordered
    it, according to the custom of our land, a court summoner having been taken, to be marked with [uncertain:
    gadibus] or mounds, otherwise kopce in the vernacular, from the boundaries of the village of Malenin
    up to the boundaries of the heritage called Ruchocin, to dig them, in the vernacular [uncertain: odsuć],
    and to make the boundary: and so half of the thicket called Kobielnica, which flows or runs, Samica
    in the vernacular, shall belong in perpetuity to the said heritage of Makownica. We add besides to
    the foregoing, as a final disposition for a testament: that after our death the said monastery and
    the whole convent of its brothers of the Cistercian Order shall have, and shall possess peacefully
    for all time, the substance of all our goods contained there in the aforenamed heritage and [uncertain:
    postmo] to be contained there, namely the bees, cattle, sheep, mares, beasts, and generally all things,
    movable as well as immovable. In witness of which, lest it be annulled by those who come after, we
    have ordered these our letters to be written firmly and have strengthened them with the protection
    of our seal. Done at Ląd on the Sunday within the octave of Corpus Christi, in the same year 1399.
    Present: the discreet man Jakusz, parish priest at [uncertain: Czaten], and the noble men, the lords
    Jan [uncertain: Siemenci] Pech, castellan of Czarnków, Mikołaj [uncertain: Retch], burgrave of Pyzdry,
    [uncertain: Vito] Lukomski Jaszko of the same place, and very many others worthy of trust.'

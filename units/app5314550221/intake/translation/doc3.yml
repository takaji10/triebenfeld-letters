- page: 2
  confidence: high
  marker_count: 5
  en: 'the venerable and religious Maciej, abbot of the monastery of Ląd, our devout and beloved, made
    known to us by his statement that he had made a contract of purchase with the noble Mikołaj, Jan and
    Warsz, brothers german of Koscielec, heirs, and with their stepson, for three mansi or łany of fields
    lying in the village of Łukomia in the district of Konin, and for the forest called Grądzyń, and also
    other forests and woods, meadows, fields, heaths, fishponds, beehives, waters and their courses, and
    all other profits, uses and revenues belonging in any way of old to the said three mansi or łany,
    as the heirs written above have possessed them until now, reserving to themselves and their successors
    no right of property or dominion in them; and humbly and devoutly besought our majesty with due instance
    that we might give our gracious consent and assent to the said contract of purchase. We, then, wishing
    to buy heavenly things for earthly ones and to enlarge divine worship in that venerable monastery
    of Ląd, and especially considering the lack of forests and woods, with which that monastery might
    be restored in its [uncertain: Casanis] and old ruins, since it lacks them elsewhere, namely forests
    and woods; and so that, for our happy arrival when we happen to come down there, the necessaries might
    be had the better: graciously inclined to the prayers of the said abbot, we have given our gracious
    will to the said contract of purchase of the said three łany, forests, woods and all other appurtenances,
    made, as is touched on above, by the abbot himself and his convent; we have assented, and by these
    presents assent, decreeing that it shall have the strength of perpetual validity. In witness of which
    our seal is hung on these presents. Done at Gniezno on the Tuesday before the feast of St Lawrence
    the Martyr, in the year of the Lord [uncertain: 1447]. Present: the Reverend Father, Lord Andrzej,
    bishop, and the magnificent and noble Łukasz of Górka, of Poznań, and Marcin of [uncertain: Rasko],
    of Kalisz, voivodes; [uncertain: Dobrogosto] of Szamotuły, of Poznań, Przedbor of Koniecpol, of Sandomierz,
    and Piotr of Kurów, of Sącz, castellans; and many other witnesses worthy of trust to the present.
    Given by the hands of the magnificent Jan of Koniecpol, chancellor, and Piotr of [uncertain: Tczenaczmy],
    vice-chancellor, our sincerely beloved.'

  en: 'Confirmation of Grądzyń by King Kazimierz. 16.


    In the name of the Lord, Amen. For the perpetual memory of the matter. We, Kazimierz, by the grace
    of God King of Poland, and also of the lands of Kraków, Sandomierz, Sieradz, Łęczyca and Kuyavia,
    Grand Duke of Lithuania, lord and heir of Pomerania and Prussia etc., make known by the tenor of these
    presents to all whom it concerns, present and to come, who will have knowledge of them, how, coming
    to our presence and that of our prelates and barons'

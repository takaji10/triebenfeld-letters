- {claim: "ließ das Gericht auf Wunsch der Parteien zwei kleine Hügel gegen Huta öffnen", verdict: supported, where: "Judicium Compromissoriale affectantibus Partibus ad reserationem Monticulorum duorum versus Huta ... condescendit"}
- {claim: "die der Konvent als Grenzhügel für sich nahm", verdict: supported, where: "pro Scopulis Parietalibus per Venerabilem Conventum Landensem sibi sumptis"}
- {claim: "man fand nichts darin", verdict: supported, where: "Quibus reseratis nihil inventum"}
- {claim: "Am nächsten Tag, dem Freitag nach dem Sonntag Misericordia (10. April 1761)", verdict: supported, where: "Tandem in Crastino videlicet Feria sexta post eandem Dominicam Misericordiae proxima; the year from the heading on p. 63; Misericordia 1761 was 5 April"}
- {claim: "ging das Gericht zur Erneuerung der Hügel zwischen dem Gut Łukom, der Stadt Zagórów und Drzewce über", verdict: supported, where: "ad renovationem Scopulorum inter Bona Lukom ab una, Oppidum Zagurow ab altera, nec non Drzewce a Tertia Partibus Se Se transtulit"}
- {claim: "in Gegenwart des Bürgermeisters Maciej Kwiecinski, des Vogts Albert Rozewicz, des Schreibers Antoni Zalewski und anderer", verdict: supported, where: "ad Praesentiam ... Mathia Kwiecinski Proconsule, Alberto Rozewicz advocato, Antonio Zalewski Notario, Joanne Ogorkiewicz ... First drafted as other townsmen: changed"}
- {claim: "Die Seite bricht in der Liste dieser Namen ab", verdict: supported, where: "... Casimiro Bekanowski, Thoma / catchword Boronski"}

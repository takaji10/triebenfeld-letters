# Editorial rulings for APP 53/1455/0/2/21.
#
# Six documents on the five pages the editor chose (2026-10-21), one for each
# of the copyist's entries that stands on them (EDITORIAL_RULES: each entry of
# a register is a document): no. 14 (1), no. 15 (2), no. 16 (3; p. 15 added
# at the editor's word to finish it), no. 25 (4), the beginning of no. 26
# (5), and p. 66 of no. 46 (6).
# Each is a copy, and takes the date and the era of what it copies (editor,
# 2026-10-14).

places:
  # Place of writing as the copy gives it; the beginnings (3, 5) and the
  # page of the decree (6) give none.
  overrides:
    "1": Ląd
    "2": Pyzdry
    "3": ""
    "4": Pyzdry
    "5": ""
    "6": ""

dates:
  # read off the document; a feast is turned into the day of the month
  # (Julian calendar before 1582)
  read:
    "1": [1399, 6, 1, "day"]      # Dominica infra Corporis Christi Octavam sub Anno eodem 1399 (Easter 30 March)
    "2": [1461, 9, 21, "day"]     # Feria secunda proxima post Festum Exaltationis S. Crucis Anno 1461 (14 September was a Monday)
    "4": [1362, 1, 18, "day"]     # Feria Tertia post Octavam Epiphaniae Domini Anno Ejusdem 1362do
  supplied: {}
  twin: {}
  # [year, month, day, precision, basis]; the basis is shown to the reader.
  inferred:
    "3": [1447, 8, 8, "day", "The dating clause, on p. 15: \"Actum Gnesnae feria tertia ante festum S. Laurentii Martyris Anno Domini\", the year written over; read as 1447, as a later hand wrote it in pencil in the margin. The witnesses, Bishop Andrzej, Łukasz of Górka, voivode of Poznań, and the chancellor Jan of Koniecpol, held their offices in 1447. St Lawrence, 10 August 1447, was a Thursday."]
    "6": [1761, 4, 10, "day", "The page names \"the Friday next after the same Sunday Misericordia\"; the heading of the entry, on p. 63 (not included), gives the year 1761 and its entry at Kalisz castle on the Monday after Cantate 1761. Misericordia Sunday 1761 was 5 April."]
  sitting: {}
  # The beginning of no. 26 stops before its date (p. 27 is not photographed).
  no_date: ["5"]

documents:
  # A copy belongs to the era of what it copies (editor, 2026-10-14): the
  # decree of 1761 stands with the boundary disputes of the Prusimski years.
  era:
    "6": prusimski-boundary

  doc_type:
    "1": privilege
    "2": attestation
    "3": confirmation
    "4": privilege
    "5": privilege
    "6": decree

  language:
    "1": "la"
    "2": "la"
    "3": "la"
    "4": "la"
    "5": "la"
    "6": "la"

  duplicate_of: {}
  split_note: {}
  relations:
    "3":
      - kind: supplements
        target: "2"
        note: "Both are about the same three mansi of Łukom with the forest of Grądzyń: in no. 16 (1447) King Kazimierz confirms the contract by which Abbot Maciej bought them from the brothers Mikołaj, Jan and Warsz of Koscielec; in no. 15 (1461) the Wochneth brothers and their nephews resign them to Abbot Cornelius before the general captain of Greater Poland."
    "5":
      - kind: supplements
        target: "4"
        note: "The king grants freedom to the colonists in the forest \"which we gave and granted by reason of an exchange\" to the abbot and convent of Ląd, Czernetz, of sixty mansi: the forest of the exchange of 1362."

  # The estate the document is ABOUT, as slugs from reference/places.yml.
  estates:
    "1": [lad]
    # Gradziem / Gradzien of the copy is Grądzyń (the editor, 2026-10-21).
    "2": [lukom, gradzyn, zagorowo, imielno, lad]
    "3": [lukom, gradzyn, lad]
    "4": [wrabczynek, drzewce, lad]
    "5": [drzewce, lad]
    "6": [lukom, gradzyn, zagorowo, drzewce, lad]

pages:
  # The text is given by paragraph, as the copyist divides it.
  by_paragraph: ["0013_a", "0014_a", "0015_a", "0025_a", "0026_a", "0066_a"]

damage:
  # Damage is read from the text's own [...] markers. List document numbers
  # here only for damage the transcription does not mark.
  letters: []

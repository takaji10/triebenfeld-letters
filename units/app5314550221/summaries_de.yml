# German summaries of APP 53/1455/0/2/21, written in the working session from the Latin as read on the photographs
# (intake/text.py, 2026-10-21).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app5314550221-001: "Abschrift (Nr. 14 des Kopialbuchs, aus dem 18. Jahrhundert) einer lateinischen Urkunde, gegeben in Ląd am Sonntag in der Oktav von Fronleichnam 1399 (1. Juni). Mikołaj, Erbherr von Venacia und Generalrichter des Landes Kalisch, lässt sein Gut Makownica, das er zuvor vor König Władysław dem Kloster Ląd aufgelassen hatte und das der König mit offenem Brief bestätigt hatte, nach dem Brauch des Landes mit einem Gerichtsboten durch Grenzhügel (kopce) abgrenzen, von den Grenzen des Dorfes Malenin bis zu denen des Erbguts Ruchocin; die Hälfte des Gebüschs Kobielnica soll für immer zu Makownica gehören. Dazu bestimmt er als letzten Willen, dass das Kloster und sein Konvent nach seinem Tod seine ganze Habe in Makownica erhalten: Bienen, Vieh, Schafe, Stuten und alle beweglichen und unbeweglichen Dinge. Zeugen sind der Pfarrer Jakusz, der Kastellan von Czarnków, der Burggraf von Pyzdry und andere."
app5314550221-002: "Abschrift (Nr. 15 des Kopialbuchs, überschrieben „Privilegium Gradziem Ruchowia“) einer lateinischen Urkunde, gegeben in Pyzdry am Montag nach Kreuzerhöhung 1461 (21. September). Piotr von Szamotuły, Kastellan von Posen und Generalstarost von Großpolen, bezeugt, dass die ungeteilten Brüder Jan Wochneth, Pfarrer in Koscielec, Mikołaj Wochneth von Bartodzieje und ein dritter Bruder von Osiecza, zusammen mit ihren Neffen Marcin, Jan und Maciej Bochneth, dem Abt Cornelius, dem Prior Jan, Wolmar, dem Rektor der Pfarrkirche in Ląd, und dem ganzen Konvent von Ląd mit Zustimmung König Kasimirs auf ewig aufgelassen haben: drei ganze Hufen mit Gärten im Dorf und Erbgut Łukom im Bezirk Konin, in der Pfarrei Zagórów, dazu den Wald Grądzyń mit seinen Gehölzen, die Wälder Chmielniki und Lome bis zu dem Weg namens Rosiszewska, der von Łukom und dem Dorf Lomowo zum Hügel Karczemne gory führt, die Sümpfe Karczemne Lugi und ein Feld oberhalb von Imielno, mit allen Rechten und Nutzungen, ohne sich etwas vorzubehalten. Der Preis sind 400 Mark breiter Groschen, 48 Groschen auf die Mark. Unter den Zeugen ist Jan Sobocki, Burggraf von Posen. Am Rand steht: „und mit dem Wald Lomy, von den Grenzen“."
app5314550221-003: "Abschrift (Nr. 16 des Kopialbuchs, überschrieben „Confirmatio Gradziem Regis Casimiri“, die Bestätigung von Grądzyń durch König Kasimir) einer lateinischen Urkunde König Kasimirs von Polen, gegeben in Gnesen am Dienstag vor dem Fest des heiligen Laurentius; das Jahr ist überschrieben und als 1447 gelesen, wie eine spätere Hand es am Rand vermerkt hat, und die genannten Zeugen hatten ihre Ämter in diesem Jahr inne (8. August 1447). Der Abt Maciej von Ląd hat dem König vorgetragen, er habe mit den Brüdern Mikołaj, Jan und Warsz von Koscielec, Erben, und ihrem Stiefsohn einen Kaufvertrag über drei Hufen Ackerland im Dorf Łukomia im Bezirk Konin und den Wald Grądzyń geschlossen, mit weiteren Wäldern, Wiesen, Feldern, Heiden, Fischteichen, Bienenstöcken und Gewässern, ohne dass die Verkäufer sich ein Recht daran vorbehielten, und hat um seine Zustimmung gebeten. Der König stimmt zu und bestätigt den Vertrag auf ewig: um Himmlisches für Irdisches zu erwerben und den Gottesdienst im Kloster zu mehren, vor allem aber, weil dem Kloster anderswo die Wälder fehlen, mit denen es wiederhergestellt werden könnte, und damit es bei seinen Besuchen dort besser versorgt sei. Unter den Zeugen sind der Bischof Andrzej, der Woiwode von Posen Łukasz von Górka und der Kastellan von Sandomierz Przedbor von Koniecpol; gegeben durch den Kanzler Jan von Koniecpol. Der Text beginnt am Fuß von S. 14 und endet auf S. 15, die unter seinem Ende abgeschnitten ist."
app5314550221-004: "Abschrift (Nr. 25 des Kopialbuchs) einer lateinischen Urkunde König Kasimirs von Polen, gegeben in Pyzdry am Dienstag nach der Oktav von Epiphanias 1362 (18. Januar). Mit dem Rat seiner Barone tauscht der König mit Abt Jan und dem Konvent der Zisterzienser von Ląd: Das Kloster überlässt dem König und dem Reich sein Erbgut Klein-Wronczyn bei der Stadt Pyzdry und seine Mühle unter der Burg Pyzdry; dafür gibt der König dem Kloster auf ewig einen Teil seines Waldes, genannt Czirnetz, im Bezirk Konin, zur Rodung geeignet und sechzig fränkische Hufen groß, von seinen Boten vermessen und mit Grenzhügeln (kopce) umgrenzt. Das Kloster darf dort so viele Dörfer nach polnischem oder deutschem Recht anlegen, wie es will, und diese sollen von allen königlichen Abgaben so frei sein wie die übrigen Güter des Klosters. Was es als Wald stehen lässt, gehört ihm mit allen Nutzungen; nur die Jagd auf Hirsche und Wildschweine behält sich der König vor. Nach der Überschrift des Abschreibers wurde in diesem Wald später das Dorf Drzewce angelegt. Unter den Zeugen sind Albert, Woiwode von Brześć, Wyrzbięta, Kastellan von Posen, und Florian, Kanzler von Łęczyca."
app5314550221-005: "Der Anfang einer Abschrift (Nr. 26 des Kopialbuchs) eines Privilegs König Kasimirs von Polen für die Siedler im Wald Czernetz im Land Kalisch, den er dem Abt und Konvent von Ląd im Tausch gegeben hatte und in dem sie sechzig Hufen haben sollen (Dok. 4). Damit die Hufen leichter besiedelt werden, gewährt der König allen Bauern, die sich dort ansiedeln oder angesiedelt haben, zwanzig Jahre volle Freiheit vom Datum der Urkunde an und befreit sie von allen Abgaben und Diensten, die er aufzählt: sep, naraz, Schwein, Kuh, Schaf, powos und Fuhren aller Art. Der Text bricht am Ende von S. 26 ab, in dem Satz, mit dem der König will, dass kein Kastellan oder Amtmann …; der Rest und das Datum stehen auf S. 27, die nicht in der Edition ist."
app5314550221-006: "Eine Seite (S. 66) aus der Abschrift (Nr. 46 des Kopialbuchs, beginnend auf S. 63) des Dekrets eines Schiedsgerichts, durch das nach der Überschrift des Eintrags ein Stück Grund im Gut Łukom am Rand der Güter von Drzewce dem Konvent von Ląd abgetreten und abgegrenzt wurde; der Eintrag ist 1761 in der Burg Kalisch eingetragen. Die Seite zählt die Grenzhügel acht bis neunzehn mit ihren Abständen in Ruten auf, an den Wegen von Huta nach Grądzyń, nach Rosiszewo und nach Lomowo, von Drzewce und Lomowo nach Grądzyń, von Łukom nach Lomowo und von Tomice nach Zagórów und Łukom, bis zu dem Weg zu den Eckhügeln der Güter Tomice und der Stadt Pyzdry. Nachdem die Grenze des Guts Łukomia gegen Grądzyń erledigt war, ließ das Gericht auf Wunsch der Parteien zwei kleine Hügel gegen Huta öffnen, die der Konvent als Grenzhügel für sich nahm; man fand nichts darin. Am nächsten Tag, dem Freitag nach dem Sonntag Misericordia (10. April 1761), ging das Gericht zur Erneuerung der Hügel zwischen dem Gut Łukom, der Stadt Zagórów und Drzewce über, in Gegenwart des Bürgermeisters Maciej Kwiecinski, des Vogts Albert Rozewicz, des Schreibers Antoni Zalewski und anderer. Die Seite bricht in der Liste dieser Namen ab."

    rode upon the inn and at once ordered shooting through the window into it; a nobleman, the Honourable Krzeczkowski,
    was nearly killed and had his heel shot off; and the inn was set on fire, and was barely saved after the men
    on Chełmski''s own side had fled. During which attack" Chełmski himself shouted to beat, kill and shoot. The
    penalties on the next leaf ("for the armed raid and the shooting and the burning of the inn", "for the unlawful
    use of firearms") refer to exactly this. The name Krzeczkowski is written above the line; the second vowel could
    be y. Also "osadził" (placed his men) for "osądził" (judged), and "tam" for "sam"'
  was: gdy w tymże goscińcu ludzi swych osądził tak urodzony Chełmski bić zabić i strzelać wołał, także rzeczy wszystkie

  en: 'And so, on the basis of this constitution — which is to be observed in all things and not interpreted
    — and likewise on the basis of the citations expressed above, and of the appointed dates [served]
    by both parties for the said commission, or rather constitution and citations expressed above — and
    indeed [served] by the Honourable Prusimski, Starost of Niszczewice, five [citations]:


    the first, against the Honourable Heliodor, Canon of Chełmno, and Stanisław, brothers by birth of
    the Chełmski family, heirs of the estates of Łukomia and others;


    the second, against the Most Reverend Konstanty Jełowiecki, Abbot, and his entire Ląd Convent, heirs
    of the estates of Drzewce and of the town of Zagórów; and likewise against the Honourable Ignacy Gałecki,
    Starost of Bydgoszcz, heir of the estates of Biskupice and the deserted lands of Bystrzyce; Helena
    Wężyk, widow of the late Honourable Józef Wężyk of Osin, Castellan of Sieradz; Franciszek and Barbara
    Stadniccy of the Starosty of Ostrzeszów; Paweł and Konstancja Skorzewscy, successors of the said late
    Honourable Wężyk, heirs of the estates of Królikowo, Groja and others; Franciszka Zakrzewska, wife
    of the Land Judge of Kalisz, as mother, and Jan Nepomucen Zakrzewski, her son, heirs of the estates
    of Podbiel and part of Szetlew; Maciej Jan Jaroszewski, and likewise the surviving [heir] and successors
    of the late lamented Fulwarski, co-heirs and possessors of parts of [those] estates — in respect of
    the demarcation of their estates from his estates, or the showing of corner mounds adjoining his estates,
    and likewise in the matter of the production of documents and sworn inquiries previously conducted
    — issued in the Konin municipal court on Wednesday after the Feast of the Assumption of the Blessed
    Virgin Mary, under one act, that is on 16 August, extracted authentically from the records;


    the third, against the aforementioned Honourable Gliszczyński, father and son, heirs of the estates
    of Tomice — issued in the Pyzdry municipal court on the Wednesday following the same feast, that is
    likewise on 16 August of the present year, and thereafter filed in the Kalisz municipal court on Tuesday
    after Saint Bartholomew, that is on 20 August;


    the fourth, against the surviving [heir] and successors of the late Honourable Ignacy Gliszczyński,
    Starost of Pasierby, reviving a lapsed cause after his death — likewise issued in the same Kalisz
    municipal court by the same person on the same day and year;


    the fifth, against the heirs and possessors of the estates of Kurowo and Kurówek, in the same matter
    — issued in the Pyzdry municipal court on Monday after the Feast of the Nativity of the Blessed Virgin
    Mary, that is on 11 September'

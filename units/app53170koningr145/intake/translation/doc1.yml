    [the commission] orders all these parties to appear and file their court appearances.


    [Translator''s note: Party-initiated citations: The citations were not issued by the commission on
    its own motion but were initiated by the parties themselves, each going to the relevant municipal
    court to have the instruments entered in the records. Prusimski filed five citations covering a wide
    range of collateral neighbours and co-heirs; Chełmski filed one, naming Prusimski, the Ląd Convent
    (Jełowiecki), and Gałecki. The commission''s role was to act on those citations by ordering the named
    parties to appear. This was standard early modern Polish procedure: a party initiated the citation,
    the court recorded and issued it, and the commission enforced appearance on that basis.]



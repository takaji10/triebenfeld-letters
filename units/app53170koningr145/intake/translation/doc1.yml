  en: '[Oblata Frame — Brest Kuyavia Municipal Court]


    Oblata of a Commissorial Boundary Decree concerning the Estates of Trąbczyn and Łukomia, and Other
    Collateral Matters


    1776


    At the Brest Kuyavia Municipal Court'
  names: []
  numbers: []
  flagged: []
- page: 2
  confidence: high
  marker_count: 0
  en: 'Done at the Brest Kuyavia Municipal Court on the Monday next after the Feast of Saint Matthew,
    Apostle and Evangelist, namely on 23 September 1776.


    To the office and present records of the Starost''s Municipal Court of Brest Kuyavia, appearing in
    person, the Worthy Simon Szaunski presented to the present office for entry, and submitted for enrollment
    in the present records, a Commissorial Boundary Decree between the estates specified in the said decree,
    pronounced by the illustrious Right Honourable commissioners, sealed with family seals, sound, intact,
    and unharmed, and free from any mark of suspicion, the tenor of which decree follows and is as follows:


    [Section 1: Commissorial Boundary Decree]


    It took place in the pine forest on the land in dispute between the estates and villages of Trąbczyn
    Mały, or Nowa Wieś, of the Honourable Antoni Prusimski, starost of Niszczewice, on the one part; Łukomia
    of the Honourable Stanisław Chełmski, on the second part; and Drzewce of the Reverend Convent of Ląd,
    on the third part; at three boundary mounds — the first clear, the second less so, and the third less
    clear than the second yet notable — described by three field decrees following upon Tribunal decrees,
    set out below,


    which all three parties, during the three field inspections, namely both Honourable Chełmski brothers,
    at that time still joint heirs of Łukomia, appearing for their estates of Łukomia and Bukowe deserted
    lands, and for the convent''s Drzewce, with rejection only of the estate of Trąbczyn from here — while
    the heirs of Drzewce and Trąbczyn, for their own estates and for Łukomia, with rejection likewise
    of the Bukowe'
  names: []
  numbers: []
  flagged: []
- page: 3
  confidence: high
  marker_count: 0
  en: 'deserted lands — as corner and legitimate boundary mounds, asserted and acknowledged between the
    roads:


    [Translator''s note: The long sentence spanning the boundary road description is syntactically broken
    and run-on throughout. The respective roles of the three parties in asserting and acknowledging the
    roads as boundaries are not clearly delineated in the source. The translation follows the source structure
    as closely as possible.]


    the first a beaten road, as the people and the heir of Trąbczyn assert, from the town of Zagórów through
    the village of Drzewce to Kalisz, Chocz and Tomice, running alongside a stawisko situated a few staj
    from here; and first, once from Drzewce turning right alongside a hill towards Łukomia; and then a
    second time, further beyond the stawisko, or rather beyond the ford situated a few staj beyond that
    stawisko towards Tomice, also branching to the right; by the road from Osiny between the woodland
    — as the said heir of Trąbczyn states, called Ostrowce — and the pine forest alongside the aforementioned
    three boundary mounds, joining the beaten Zagórów road by a shortcut going from Osiny to Tomice;


    and also, when travelling to Łukom towards Pyzdry, by the Zagórów road passing beneath the hill and
    extending there towards Łukom and Pyzdry;


    [Translator''s note: Directional and elevational uses of ''above'' and ''below'': The source employs
    nad, ponad, wyżej, powyżej (''above'', ''higher'') and pod, poniżej (''below'', ''lower'') in two
    distinct senses throughout the document. Where the reference is to a hill, sandhill, or similar landform
    (góra, pagórek, pagórka), the language is purely elevational: pod górą means ''at the foot of the
    hill'' and is translated ''beneath the hill'' or ''below the hill'' accordingly. Elsewhere — particularly
    with reference to roads, woodlands, bogs, and drainage strips — the same words function directionally.
    Since the commission travels south along the Kalisz road (Łukomia confirmed to the west, Drzewce to
    the north, Trąbczyn to the south), ''above'' in these contexts consistently means to the north, and
    ''below'' means downstream or to the west. The most significant recurring instance is nad lasem Lusnie
    (''above the Lusnia woodland''), which throughout the document places features on the northern side
    of that woodland — between it and the Kalisz road — and not at a higher elevation. Where a directional
    reading is certain from the document''s own orientation, the compass bearing is supplied in square
    brackets in the translation.]


    and also a third old road, not far from those boundary mounds and above them [i.e., to the north],
    leading towards Drzewce, still clearly visible and deeply worn, from Osiny, Nowa Wieś, Trąbczyn Mały
    and other villages between Łukomia and the convent villages towards Pyzdry, as the heir and people
    of Trąbczyn and Drzewce assert, long travelled in former times, not recorded during the past field
    inspections, but now revealed, lying and situated far apart from one another in a triangle,


    on 13 September 1775, before the Right Honourable Honourables:


    Ludwik Dąmbski, Count of Lubraniec, voivode of Brest Kuyavia, Starost of Dybów and Gniewkowo, Knight
    of the Order of the White Eagle, of Saint Stanisław, and of others;


    Józef Brzeziński of Brzyzna, municipal Starost of Inowłocław, Knight of the Order of Saint Stanisław;


    Michał Skorzewski, Sub-chamberlain of the Poznań Voivodeship, Knight of the Russian Order of Saint
    Anna;


    Stanisław Dąmbski, Standard-bearer of Brest Kuyavia;


    Jan Kwilecki, Cup-bearer of Wschów;


    Kajetan Umiński, Cup-bearer of Kowal, Deputy Voivode of Brest Kuyavia;


    Tomasz Radoński, Ludwik Chmielewski, Boundary Surveyors of Kalisz;


    [Stefan] Zielonacki, Land Court Surveyor of Kalisz;


    Kazimierz Gorzyński, municipal Court Registrar of Nakło;


    Stanisław Jabkowski, Starost''s son of Zgierz;


    Maciej Mierzewski, Stanisław Trąbczyński, Ksawery Szczaniecki, commissioners sitting jointly from
    both parties as set out below,


    [Translator''s note: Z strony obojej: literally ''from both parties'', despite three parties having
    been named in the dispute. Most likely refers to the two main disputing parties (Prusimski and Chełmski),
    with the Ląd convent treated separately.]


    in the presence of'
  names: []
  numbers: []
  flagged: []
- page: 4
  confidence: high
  marker_count: 0
  en: 'the Honourables:


    Ignacy Gałecki, Starost of Bydgoszcz, heir of the estates of Biskupice and Bystrzyce deserted lands;


    Jan Umiński, land Court Registrar of Gniezno;


    Stanisław Rudnicki, Ignacy Malczewski Szarzyński, Maciej Lewandowski, Jakób Mierzejewski, Wincenty
    Wysocki, Jan Gosławski, Jan Zdanowski, Piotr Raiewicz, Józef Pawłowski, and many others present at
    this same act;


    as well as the Honest Bartłomiej, sworn Court Summoner of Trąbczyn Wielki, who summoned and established
    the present jurisdiction;


    the above-mentioned commissarial court, on the basis and authority of the commission, or rather the
    constitution adopted at the Warsaw Sejm of the General Confederation, the substance of which is as
    follows:


    [Warsaw Constitution]


    Done in the Royal Court of Warsaw on Wednesday, the day before the Feast of the Most Sacred Body of
    Christ the Lord, namely on 1 June 1774. To the office and present records of the Warsaw Starost''s
    Municipal Court, appearing in person, the Right Honourable Florian Junosza Drewnowski, Cup-bearer
    of the Łomża Land, Secretary of the General Confederation and Extraordinary Sejm of the Crown, presented
    to the same office and records the enacted commission written below, and submitted it for enrollment
    in the present records, of the following tenor.


    A commission for the demarcation of the estates of the Honourable Antoni Prusimski, Starost of Niszczewice,
    from the estates of the Honourable Stanisław Chełmski and others: whereas the boundary dispute between
    the estates of Trąbczyn, Trąbczyn Mały, otherwise called Nowa Wieś, Łazy and Osiny, of the Honourable
    Antoni Prusimski, Starost of Niszczewice, and the village of Łukomia of the Honourable Stanisław Chełmski
    and others, lying in the Kalisz Voivodeship and the Konin district, has been running for more than
    several dozen years with an unceasing process, amid significant unlawful transgressions, seizures
    of land, and has so far produced no judicial resolution.


    Satisfying therefore both parties'' desire for settlement and cutting short the lawful delays, we
    recognise that a commission is necessary for the final resolution thereof, and appoint as commissioners
    the aforementioned and the Honourable:


    Ludwik Dąmbski, voivode of Brest Kuyavia; Antoni Zakrzewski of Krzywino, Rafał Gajewski of Rogoźno,
    Józef Cielecki, Castellan Judge;


    Michał Skorzewski of Poznań, Antoni Wolski of Inowłocław, Sub-chamberlains;


    Józef Brzeziński, Starost of Inowłocław;'
  names: []
  numbers: []
  flagged: []
- page: 5
  confidence: high
  marker_count: 1
  en: 'Stanisław Dąmbski, Standard-bearer of Brest Kuyavia; Józef Binkowski, Steward of Gniezno; Stefan
    Zielonacki of Kalisz, Maciej Dąmbski of Brest Kuyavia, Deputy Judges;


    Bartłomiej Kraszewski, Sub-steward of Bydgoszcz; Jan Kwilecki, Cup-bearer of Wschów; Jan Mycielski,
    Starost of Osiny; Piotr Drwęcki of Poznań, Rudnicki of Brest Kuyavia, Land Court Scribes;


    Bojanowski, Sword-bearer of Kalisz; Stanisław Sądowski, Municipal Court Scribe of Wałcz; Umiński,
    Deputy Voivode of Brest Kuyavia; Stanisław Brodnicki, Land Court Surveyor of Poznań; Radoński of Kalisz,
    [uncertain: Stefan] Zielonacki of Kalisz, Ludwik Chmielewski of Kalisz, Boundary Surveyors;


    Ksawery Małachowski of Konin, Kazimierz Gorzyński of Nakło, Court Registrars;


    Stanisław Jabkowski, Starost''s son of Zgierz; Ksawery Mikorski, Maciej Mierzejewski, Stanisław Trąbczyński,
    Ksawery Szczaniecki, Paweł Skórzewski;


    which commissioners, regardless of the absence of others, when at least five of them are present,
    following the citations issued four weeks before the appointed date of the commission, to be signed
    by the first in order of rank and to be performed by those commissioners who shall not yet have been
    sworn to any judicial functions, shall take the oath, each at the first opportune moment, before the
    commencement of the commission in the nearest municipal court, by the following formula:


    I, named above, swear to the Lord God Almighty, One in the Holy Trinity, that, being appointed to
    adjudicate the boundary dispute between the Honourable Antoni Prusimski, Starost of Niszczewice, and
    the Honourable Stanisław Chełmski and others party to this cause,'
  names: []
  numbers: []
  flagged: []
- page: 6
  confidence: high
  marker_count: 0
  en: 'I shall judge this cause according to God, conscience, justice, written proofs and counter-proofs,
    and the testimony of examined witnesses; I shall not be led astray by any considerations, friendship,
    or hatred; I shall accept no gifts or promises to suppress justice; and in all my judging I shall
    hold God, law, and justice as the foremost purpose of my judgment — so help me God and the innocent
    Passion of Christ the Lord.


    [Translator''s note: Odwodów: the word is most naturally read as the genitive plural of odwód (counter-proof,
    rebuttal evidence), paired with dowodów (proofs). Translated as ''counter-proofs''. The pairing dowody
    i odwody is a standard legal formula in early modern Polish proceedings.]


    Having come to the disputed ground, without exhausting themselves with any delay and without interruption,
    judging even if any party should fail to appear, they shall bring these boundaries to a final conclusion
    through their decision and shall resolve them definitively.


    They shall weigh documents, decrees, and other boundary descriptions made by sub-chamberlains or boundary
    surveyors; they shall order previously conducted sworn inquiries to be submitted, and if they cannot
    be enlightened from the earlier ones, they shall conduct new ones; having first received the witnesses''
    oaths for them, they shall examine the proceedings; they shall review all decrees; they shall consider
    the period of use of the lands and the age of the sworn inquiries; they shall receive the oath from
    the party winning the boundary line, according to the prescription of the law; and they shall declare
    and mark such boundaries as are to endure in perpetuity.


    At which time the collateral neighbours, summoned to appear under penalty of non-recovery of land
    should any fall to the estates being demarcated, are to present themselves. After the settlement of
    the boundary dispute, they shall collect the penalties imposed by the Land [court] for violent transgressions
    committed; they shall determine damages in excess of those of the municipal court caused by those
    who committed unlawful transgressions, and [the costs of] legal expenses, and shall order them to
    be paid by whomever it falls to.


    And even if before the appointed date of the commission, or in the course of its proceedings, the
    present heirs of these estates should sell or cede them, or they should pass to other hands through
    the death of any of them — the aforementioned appointed Honourable commissioners shall, among the
    possessors of those estates at that time, settle, adjudicate, and conclude this cause, both as to
    the boundary matter and as to damages, leaving nothing unresolved, so fully that the verdict of this
    commission shall be law and the marking of the boundaries by them shall be permanent and perpetual.


    [Andrzej Stanisław] Młodziejowski, Bishop of Poznań, Grand Chancellor of the Crown, as president,
    signs,'
  names: []
  numbers: []
  flagged: []
- page: 7
  confidence: high
  marker_count: 1
  en: 'by his own hand.


    Prince Adam Łodzia Poniński, Marshal of the General Confederation and of the Sejm, by his own hand.


    Michał Hieronim Radziwiłł, [uncertain: Marshal, Sword-bearer], of the General Confederation of the
    Grand Duchy of Lithuania and of the Sejm, by his own hand.


    [Translator''s note: M.M.: the source transcription expands this acronym as Marszałek Miecznik?, with
    a question mark indicating the transcriber''s uncertainty; expanded accordingly in the translation.
    Michał Hieronim Radziwiłł (1744–1831) held the title of Marshal of the General Confederation of the
    Grand Duchy of Lithuania.]


    After the enrollment of the aforesaid enacted commission, inserted above, in the present records,
    the original of the same was returned to the same person who submitted it, in discharge of his office.
    Pachała, by his own hand.


    [Translator''s note: Orgle: the word appears in the manuscript without scribal annotation or correction
    mark. It does not correspond to any standard Latin term in this context; originale (the original document)
    is the most plausible reading and is adopted in the translation, but the word as written remains uncertain.]


    [Translator''s note: Pachała: the word appears immediately before manupropria in a position where
    a surname would be expected. It may be the name of the court official who returned the document, but
    the reading is uncertain.]


    Place of the seal of the Royal Court of Warsaw.


    Read by Grzegorzewski.


    [Section 2: Proceedings of the Commission: Opening, Scribal Pen Dispute, Failed Reconciliation, Resumption
    of Proceedings]


    Authentically extracted from the Warsaw municipal court records by extract, and thereafter filed in
    the Konin municipal court records on Monday, on the eve of the Feast of the Assumption of the Blessed
    Virgin Mary in the present year; and likewise on the basis and by the authority of the citation, [the
    citations] issued by the aforementioned Honourable commissioners, designating four weeks before the
    appointed date of the commission, that is, for today''s date in September of the present year, and
    served on:


    the Honourable Antoni Prusimski, Starost of Niszczewice, heir of the estates of Trąbczyn with appurtenances;


    on the Reverend Heliodor, Canon of Chełmno, and Stanisław, brothers by birth of the Chełmski family,
    heirs of the estates of Łukomia with appurtenances;


    on Ignacy Gliszczyński, Starost of Pasierby, heir of the estates of Tomice with appurtenances;


    and on others party to this cause —


    [the said citations having been] issued on 12 August of the present running year, dated at the Żerków
    Palace, signed by the Right Honourable citizen and the Honourable Ludwik Dąmbski, voivode of Brest
    Kuyavia, as first in order and as president of this commission by virtue of the constitution expressed
    above, and confirmed with his seal, filed in the Konin municipal court records on Wednesday after
    the Feast of the Assumption of the Blessed Virgin Mary, that is on 16 August of the same present year,
    and authentically extracted from the records for the day and appointed date expressed above:


    having come to the disputed ground on 13 September, [the president] ordered his judicial jurisdiction
    to be established through the aforementioned Court Summoner and convened, and thereafter,'
  names: []
  numbers: []
  flagged: []
- page: 8
  confidence: high
  marker_count: 0
  en: 'after establishing it, ordered it adjourned until Friday, that is until 15 September, on account
    of the Feast of the Exaltation of the Holy Cross still being observed in the Archdiocese of Gniezno;
    on Friday he then resumed his jurisdiction together with all the aforementioned sitting commissioners
    and ordered the Court Summoner to convene it; on Friday, following the public conferral by the Right
    Honourable and Honourable Voivode-President of this commission of the scribal pen [pióro] upon the
    Honourable Ludwik Chmielewski, Boundary Surveyor of Kalisz, sitting on the side of the Honourable
    Chełmski — the Right Honourable and Honourable Sub-chamberlain of Poznań, through the voice of the
    Honourable Zielonacki, a Land Court Surveyor and not a Boundary Surveyor of Kalisz, not being named
    in the commission instrument, having entered an objection and raised the question of the scribal pen,
    conferred it upon the Honourable Radoński — which conferral he maintained without regard to the presidency
    of the Right Honourable citizen and Honourable Voivode-President, together with the other commissioners
    sitting on the side of the Honourable Chełmski — and so further proceedings were blocked by this dispute
    on that day; in this situation, and also to allow the parties to prepare for the court, the jurisdiction
    was adjourned to Saturday with the unanimous consent of all the Right Honourable and Honourable Commissioners.


    [Translator''s note: Pióro: the dispute here is a dispute over which party''s representative would
    produce the official account of the commission. See Glossary: scribal pen.]


    On Saturday, that is 16 September: since the Right Honourable and Honourable Voivode of Brest Kuyavia,
    the president, had fallen ill, and in addition the heavy rain falling all day did not permit going
    out to the field, the Right Honourable and Honourable President wrote a letter to the Right Honourable
    and Honourable Sub-chamberlain and to his colleagues informing them that for these reasons it was
    not possible to go out to the field that day, and at the same time requesting their consent to adjourn
    the jurisdiction — Sunday intervening — until Monday; and to adjourn this jurisdiction he sent the
    Honourable Piotr Rajewicz, advocate for the cause of the Honourable Starost of Niszczewice, with two
    commissioners to the place of the dispute that afternoon, and ordered this jurisdiction dissolved
    until Monday.


    The next day, on Sunday, after this adjourned jurisdiction and the adjournment made until Monday:
    on that Sunday, the Right Honourable and Honourable Sub-chamberlain, together with his colleagues,
    and requested by the side [of Chełmski], having come to the Honourable Starost of Niszczewice and
    arrived at Trąbczyn, saying nothing of what he might have had to do on Saturday'
  names: []
  numbers: []
  flagged: []
- page: 9
  confidence: high
  marker_count: 0
  en: 'in the field — since on account of the rain falling all day he could not have done anything either
    — and being in good harmony, on the reconciliation proposed to both parties by the whole court, the
    president himself requested and delegated two of the Right Honourable, Reverend, and Honourable Commissioners
    on the side of the Honourable Chełmski, and two others on the side of the Honourable Prusimski.


    [Translator''s note: The Sunday visit and reconciliation attempt: No judicial proceedings could lawfully
    take place on Sunday (cf. interveniente die Dominico, above). The Sub-chamberlain''s visit to Prusimski
    at Trąbczyn was therefore informal and conciliatory in character. The Sub-chamberlain (Michał Skorzewski,
    Poznań Sub-chamberlain) had been sitting on Chełmski''s side throughout the proceedings, having aligned
    himself with that faction in the scribal pen dispute on the Friday; it was accordingly Chełmski''s
    side that invited him to make this visit. The document notes pointedly that no one raised the question
    of Prusimski''s non-appearance in the field on Saturday — implicitly because the rain had prevented
    any field activity regardless. The four commissioners then delegated to attempt reconciliation were
    drawn two from each side: the Sub-chamberlain''s faction nominated two from Chełmski''s side, and
    the President nominated two from Prusimski''s side. This two-day attempt (Monday and Tuesday) failed,
    and proceedings resumed judicially on Wednesday. The Chełmski faction then claimed that Prusimski
    had been in legal default (contumax) for Saturday''s non-appearance — a claim whose credibility is
    quietly undermined by this passage''s account of the Sunday meeting, at which no such objection was
    raised.]


    And so the Right Honourable, Reverend, and Honourable delegated Commissioners, wishing to reconcile
    the parties, negotiating this reconciliation for two days, that is through Monday and Tuesday, by
    making representations and showing the places and names of the forests — when they could not reconcile
    the parties, the whole substance of the matter turned to litigation; and so, after this failed reconciliation,
    the Right Honourable and Honourable Voivode-President, together with his colleagues, proceeding judicially,
    on Wednesday came to the disputed ground, to the place where the whole court sat with him, and ordered
    the judicial jurisdiction to be resumed and convened, and invited the Right Honourable citizen and
    Honourable Sub-chamberlain together with his colleagues to join him; finally, settling the dispute
    over the scribal pen, and not wishing to be an occasion for further quarrel and the splitting of the
    court, he declared through the two Right Honourable and Honourable delegated commissioners that —
    upon the Honourable Chmielewski''s relinquishing the pen, which the Honourable Chmielewski declared
    he would do — he would give that same pen to the Honourable Radoński, upon whom it had been conferred;
    but the Honourable Chełmski, and together with him those judging on his side, the Most Honourable
    lords and the Honourable loyal Commissioners, saying that since the Honourable Starost of Niszczewice
    had not been in the field on Saturday he was therefore in default, and accordingly they would judge
    him as one in default, and that they had no reason to join [the president''s court] — and so, having
    removed themselves from the place of the jointly established jurisdiction, not wishing to join and
    indeed having split away, they proceeded in the split court to their further proceedings.


    [Translator''s note: Chmielewski and Radoński: Both were Kalisz Boundary Surveyors named in the commission.
    Chmielewski (Ludwik Chmielewski) had been sitting on Chełmski''s side, and was the President''s original
    choice for the scribal pen. Radoński (Tomasz Radoński) was also a Kalisz Boundary Surveyor sitting
    on Chełmski''s side, and was the Sub-chamberlain''s counter-choice. The dispute was therefore within
    the Chełmski faction itself: the President had conferred the pen on Chmielewski; the Sub-chamberlain
    overrode this and insisted on Radoński. The President''s proposed resolution was a face-saving compromise
    — Chmielewski would formally relinquish the pen, allowing it to pass to the Sub-chamberlain''s choice
    — but Chełmski''s faction rejected even this and proceeded to split the court.]


    [Translator''s note: "urodzeni uczciwi Komisarze": uczciwi (honest, trustworthy, loyal) is here used
    as a plain adjective modifying Komisarze, applied to persons already designated urodzeni (noble).
    It does not function as the sub-noble honorific uczciwy (Rule 5). Rendered as "loyal".]


    And so likewise, in response to this split on the part of the Right Honourable and Honourable Sub-chamberlain
    and his commissioners, the Right Honourable and Honourable President, with five commissioners named
    below in the signatures, acting in accordance with the constitution — which had entrusted and ordered
    that, without regard to the number of commissioners, so long as five are present in number, even notwithstanding
    the default of any party, these causes be fully and finally adjudicated — proceeded to mutual judgment.


    [Section 3: Citations, Appearances, and Document Production]'
  names: []
  numbers: []

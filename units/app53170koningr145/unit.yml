# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  The decree of a boundary commission appointed under an act of the Polish
  parliament of 1774, which sat on the disputed ground from 13 September 1775
  under Ludwik Dąmbski, voivode of Brześć Kujawski, to settle the boundary
  between Antoni Prusimski's estate of Trąbczyn and the Chełmski brothers'
  estate of Łukomia, and between Trąbczyn and Biskupice: it records what each
  side showed on the ground, the court's ruling on the line, the raising of
  new boundary mounds and the penalties laid on Chełmski, as entered in the
  court records at Brześć Kujawski on 23 September 1776 and copied into the
  court book of Konin.
title_de: >-
  Das Dekret einer Grenzkommission, die aufgrund eines Beschlusses des
  polnischen Reichstags von 1774 eingesetzt wurde und vom 13. September 1775
  an unter Ludwik Dąmbski, Woiwode von Brześć Kujawski, auf dem strittigen
  Grund tagte, um die Grenze zwischen Antoni Prusimskis Gut Trąbczyn und dem
  Gut Łukomia der Brüder Chełmski sowie zwischen Trąbczyn und Biskupice
  festzulegen: Es hält fest, was jede Seite im Gelände vorwies, wie das
  Gericht über den Grenzverlauf entschied, wie neue Grenzhügel aufgeworfen
  wurden und welche Strafen Chełmski auferlegt wurden, so wie es am 23.
  September 1776 in die Gerichtsakten von Brześć Kujawski eingetragen und in
  das Gerichtsbuch von Konin abgeschrieben wurde.

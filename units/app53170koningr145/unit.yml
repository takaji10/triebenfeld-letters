# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One long entry, leaves 654 to 715, in a book of the castle court of Konin
  for 1776 ("Relationes-oblatae"): the decree of a boundary commission, in
  Polish with Latin formulas, entered in the castle court records at Brześć
  Kujawski on 23 September 1776 and from an extract of those records copied
  into the Konin book. The commission was appointed under an act of the
  Polish parliament, recorded at Warsaw on 1 June 1774, to end a boundary
  dispute of long standing between the estates of Trąbczyn, of Antoni
  Prusimski, Starost of Niszczewice, and Łukomia, of the brothers Heliodor
  and Stanisław Chełmski, with the abbey of Ląd's village of Drzewce as a
  third neighbour. It opened on the disputed ground, in the forest, on 13
  September 1775 under Ludwik Dąmbski, voivode of Brześć Kujawski. The decree
  gives the commissioners and their oath; a quarrel over which commissioner
  should hold the pen, which split the court; the summonses and the papers
  each side produced; Prusimski's walking of his boundary line past roads,
  mounds, blazed trees, woods and a pond-ground, with the documents and sworn
  inquiries he relied on; the court's review of Chełmski's line; its rulings
  on the corner point and on the whole line; the record of the new boundary
  mounds raised between Trąbczyn and Łukomia and between Trąbczyn and
  Biskupice; and at the end the penalties and default judgment against
  Chełmski and the commissioners' signatures.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A court record of 1775 and 1776 in Polish, with the Latin formulas of the
  Polish courts; the opening and closing records of the court at Brześć
  Kujawski are wholly Latin. The editor's transcription gives the Polish in
  modern spelling (i for y, j for i before a vowel, small letters, modern
  endings) and is by paragraph, not by line; it is not the scribe's
  spelling. The English is the editor's own translation, made before the
  holding came into the edition, with its own glossary of terms. The estate
  is Łukomia and the settlement Łukom, and the record uses both on purpose.
  Trąpczyn and Trąbczyn are one place. "Dukt" is the boundary line a party
  walks out and claims; "kopiec" a boundary mound; "narożnik" the corner
  point where three estates meet; "ściana" a stretch of boundary between two
  corner points; "staje" a measure of length; "wizja" a judicial inspection
  of the ground; "inkwizycja" the sworn examination of witnesses;
  "kondescensja" the court's going out onto the ground. "Urodzony"
  (well-born) is the style of a nobleman. Words in square brackets are the
  editor's additions; a word followed by [?] is one they were unsure of.

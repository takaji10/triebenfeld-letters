app53170koningr145-001: "Dekret einer Grenzkommission, am 23. September 1776 in die Burggerichtsakten von Brześć Kujawski eingetragen und nach einem Auszug daraus in das Gerichtsbuch von Konin übernommen. Die Kommission war durch einen Beschluss des Reichstags eingesetzt, der am 1. Juni 1774 in Warschau zu den Akten gegeben wurde, um den seit Jahrzehnten geführten Grenzstreit zwischen Trąbczyn, dem Gut des Antoni Prusimski, Starost von Niszczewice, und Łukomia, dem Gut der Brüder Chełmski, endgültig zu entscheiden. Sie trat am 13. September 1775 unter dem Vorsitz von Ludwik Dąmbski, Woiwode von Brześć Kujawski, im Wald auf dem strittigen Grund zusammen. Ein Streit darüber, welcher Kommissar die Feder führen solle, spaltete das Gericht; ein Vergleich, den es den Parteien vorschlug, kam nicht zustande, und es verhandelte geteilt weiter. Prusimski führte das Gericht seine Grenzlinie entlang, an Wegen, Grenzhügeln, eingekerbten Bäumen, Waldstücken und einem Teichgrund vorbei, und berief sich auf Urkunden und beeidete Zeugenverhöre. Das Gericht prüfte auch die Linie Chełmskis, erkannte Prusimskis Grenzlinie als die bessere an, ließ zwischen Trąbczyn und Łukomia und zwischen Trąbczyn und Biskupice neue Grenzhügel aufwerfen und legte Prusimski auf, sie auf dem letzten Hügel mit sechs Zeugen zu beschwören. Chełmski wurde zu Bußen an Prusimski verurteilt. Die Fortsetzung der Grenze gegen Biskupice wurde auf den 21. Mai 1776 vertagt. Sechs Kommissare und der Kalischer Grenzvermesser Wojciech Czarnecki, der die Hügel aufwarf, unterzeichnen."

# German summaries of 53/21/0/-/Pyzdry Gr.75, written in the working session from the corrected transcription (2026-11-26).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app5321pyzdrygr75-001: "Der Kaufmann Jan Tracholz aus Witkowo erklärt vor dem Burggericht in Pyzdry, dass er an Stanisław Chełmski, Besitzer von Łukom neben Trąbczyn, der ihn dafür bezahlt, seine eigenen Forderungen an den verstorbenen Paweł Prusimski, den Erben von Trąbczyn, abtritt. Die erste Summe, 1053 Imperialen, 13 Groschen und (wie es scheint) 6 Pfennig, betrifft Bäume aus den Kiefernwäldern von Trąbczyn, die Tracholz aufgrund eines schriftlichen Vertrags gekauft hatte und die Paweł Prusimski ihm gewaltsam wegnahm und an einen Kaufmann Simon aus Stettin verkaufte. Die zweite, 1513 Złoty, hatte Tracholz teils für die Herstellung von Schnittware (neun Stapel) aufgewendet, die Pawełs verstorbener leiblicher Bruder, der ältere Antoni Prusimski, ebenfalls wegnahm, teils zu Pawełs Nutzen ausgelegt; dazu kommen weitere Summen aus seinen Schriften und Registern. Mit den Forderungen übergibt Tracholz die Rechte daran, die Zinsen und das von ihm gegen Paweł Prusimskis Nachfolger eingeleitete Verfahren. Tracholz unterschreibt mit „gehaltener Hand“, von einer fremden Hand geführt."

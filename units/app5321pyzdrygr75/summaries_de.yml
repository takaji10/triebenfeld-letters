# German summaries of 53/21/0/-/Pyzdry Gr.75, written in the working session from the corrected transcription (2026-11-26).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app5321pyzdrygr75-001: "Der Kaufmann Jan Tracholz aus Witkowo erklärt vor dem Burggericht in Pyzdry, dass er an Stanisław Chełmski, der ihn dafür bezahlt, seine eigenen Geldforderungen an den verstorbenen Paweł Prusimski abtritt. Die erste Summe, 1053 Imperialen, 13 Groschen und (wie es scheint) 6 Pfennig, betrifft Bäume aus den Kiefernwäldern von Trąbczyn, die er aufgrund eines schriftlichen Vertrags gekauft hatte und die Prusimski ihm gewaltsam wegnahm und an einen Kaufmann Simon aus Stettin verkaufte. Die zweite, 1513 Złoty, hatte er teils für die Herstellung von Schnittware (neun Stapel) aufgewendet, die Pawełs leiblicher Bruder Antoni Prusimski ebenfalls wegnahm, teils zu Pawełs Nutzen ausgelegt. Mit den Summen gehen die Rechte daran, die Zinsen und das von Tracholz gegen Paweł Prusimskis Nachfolger eingeleitete Verfahren über. Tracholz unterschreibt mit „gehaltener Hand“, von einer fremden Hand geführt."

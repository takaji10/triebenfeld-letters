  en: 'No. 39: The Excellent Jan Tracholz, merchant and inhabitant of Witkowo, sound in mind and body,
    openly, withdrawing, etc., acknowledged that he himself, wholly and entirely, his own monetary sums,
    one of them being 1,053 imperials, 13 groszy and 6 Pfennig[?], due from the late Right Honourable
    Paweł Prusimski, for trees bought by the present acknowledger, the honourable Tracholz, in the pine
    forests and woods of Trąbczyn by means of a contract written out for the said late Right Honourable
    Prusimski for the purchase of those same trees [...], worked out from the honourable acknowledger
    Tracholz''s own funds and care (although the same late Right Honourable Prusimski had once received
    from the same acknowledger full satisfaction according to the tenor of the aforesaid contract), the
    trees having been seized from the same acknowledger by force in the said pine forests and woods of
    Trąbczyn by this late Right Honourable Prusimski and sold by the same Right Honourable Prusimski to
    the honourable Simon, merchant of Szczecin; received in this amount (as the written acknowledgement
    of the same honourable Simon, merchant of Szczecin, commonly called an *Auscuk* [the German Auszug,
    an extract of account], attests);


    and then a second sum, of 1,513 złoty, spent by the same honourable Tracholz, the present acknowledger,
    partly on the making of sawn goods, that is, nine stacks of *Klapek* [a trade name of sawn timber],
    commonly called *Rynek*, likewise seized by the late Right Honourable Antoni Prusimski, full brother
    of the same late Right Honourable Paweł Prusimski, by reason of what followed upon the pine forests
    and woods in controversy and inquiry between them, seized in this pine forest; spent by the acknowledger,
    the honourable Tracholz, and partly laid out for the benefit and interest of the said late Right Honourable
    Paweł Prusimski, set out in a separate[?] register written by this acknowledger, and received for
    these sawn goods by this late Right Honourable Antoni Prusimski and disposed of for [...] and for
    his own benefit; and other sums, [shown] by writings and documents, handwritten ones and registers,'

- page: 2
  confidence: high
  marker_count: 7
  en: 'and also explained by various annotations, called [...]; these sums belonging to the acknowledger
    by right of legacy, reserving and excepting nothing from the aforesaid sums for himself and his successors
    thereafter, he has ceded, conferred, transposed, transferred and made over (as he cedes, confers,
    transposes, transfers and makes over) into the person of the Right Honourable Stanisław Chełmski,
    as one paying these sums to the acknowledger by his own right[?] and fully satisfying him for the
    foregoing, and to his successors, with full, total and entire right, dominion, ownership and competence,
    together with any and all rights of claiming that relate to these sums and set these sums out, together[?]
    with the interest arising from the same principal sums and with[?] the legal process instituted by
    the acknowledger against the successors of the Prusimskis; and by the present act [...] and conceding
    [...], this his personal acknowledgement freely assenting to the foregoing.


    Jan Tracholz, by his held hand


    On the transfer of his right in[?] the person of the Right Honourable Chełmski'

description: >-
  The merchant Jan Tracholz, inhabitant of Witkowo (written Traholtz), declares before the
  municipal court of Pyzdry that he makes over to Stanisław Chełmski, Treasurer of Wschowa and
  owner of Łukom beside Trąbczyn, who pays him for them, his own claims against the late Paweł
  Prusimski, heir of Trąbczyn: first 1,053 imperials, 13 groszy and (it seems) 6 Pfennig for pine
  trees he had bought in the Trąbczyn forests under a written contract and which Paweł Prusimski
  had seized by force and sold to a merchant of Szczecin; then 1,513 złoty, spent partly on nine
  stacks of sawn goods, which Paweł's late brother, the elder Antoni Prusimski, seized likewise
  after a dispute over the forests, and partly laid out for Paweł's benefit; and other sums set out
  in his papers. With the claims he hands over the rights to them and the legal proceedings he had
  begun against Paweł Prusimski's successors. The merchant signs "by his held hand", with another's
  hand guiding his. In Latin, with a Polish closing formula. The Konin land court's decree of
  October 1777 (APP 53/6/0/-/46, document 2) dates the transfer to 7 September 1768.
translation_note: >-
  A declaration of 1768 in the abbreviated Latin of a Polish municipal court (sąd grodzki, in
  Latin iudicium castrense). "Recognovit" begins the acknowledgement made before the court;
  "transfusio" is the transfer (cession) of a claim to another, here to Chełmski, who pays for it;
  "jus legati" a right by legacy. "Excellens" and "honoratus" are courtesies, as in the other court
  books. "Borra" is a pine forest and "sylva" woodland; "secamina" sawn goods; "Klapek" and "Rynek"
  are trade names of sawn timber whose meaning is not known. "Auscuk" is the German Auszug, an
  extract or statement of account. The merchant's name is written Traholtz here and Tracholz in the
  other documents; the English uses Tracholz. Stettin is Szczecin. "Floreni" are złoty; "grossi"
  are groszy. The closing "ręką trzymaną" ("by his held hand") is Polish, the formula of a signature
  made with another's hand guiding the writer's.

description: >-
  One entry of the register of the municipal court and office of Pyzdry, on leaves
  19 and 19 verso of the volume Inscriptiones [protocollon] 1768-1781: entry
  no. 39, in Latin with a Polish closing formula, the declaration made
  before the court by the merchant Jan Tracholz (written Traholtz in the
  entry), inhabitant of Witkowo. He declares that he makes over to the Right
  Honourable Stanisław Chełmski, who pays him for them, his own sums claimed
  from the late Paweł Prusimski: first 1,053 imperials, 13 groszy and (it seems) 6 Pfennig for
  pine trees he had bought in the Trąbczyn forests under a written contract
  and which Prusimski had seized by force and sold to a merchant of Stettin,
  and then 1,513 złoty spent on nine stacks of sawn goods, seized in the
  same way by Antoni Prusimski, Paweł's full brother, after the pine forest
  was cut. With the sums he hands over the rights, ownership and legal
  proceedings brought against the Prusimski successors. The merchant signs
  "by his held hand", with another's hand guiding his. The entry has no date
  on its page; the transfer is dated by another entry of the edition
  (rulings.yml).

translation_note: >-
  A declaration of 1768 in the abbreviated Latin of a Polish municipal (grod)
  court. "Recognovit" begins the acknowledgement made before the court;
  "transfusio" is the transfer (cession) of a claim to another, here to
  Chełmski, who pays for it; "jus legati" a right by legacy. The "Excellens"
  and "honoratus" are the clerk's courtesies, as in the other court books.
  "Borra" is a pine forest and "sylva" woodland; "secamina" sawn goods;
  "Klapek" and "Rynek" are trade names of sawn timber that the transcription
  leaves unexplained, as written. "Auscuk" in the transcription is the
  German Auszug, an extract or statement of account. The merchant's name
  stands here as Traholtz; the edition's form of it is Tracholz. Stettin is
  Szczecin. The closing "ręką trzymaną" ("by his held hand") is Polish, the
  formula of a signature made with another's hand guiding the writer's.


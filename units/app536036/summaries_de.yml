# A finding aid, not part of the edition text.
app536036-001: "Versäumnisurteil des Landgerichts in Konin aus dessen Sitzung von 1644, überschrieben „Contumaces“. Jerzy Chełmski hat als Kläger die Brüder Marcin, Wojciech, Władysław und Andrzej Trąmpczyński, Söhne des verstorbenen Stanisław, und dessen Witwe Anna von Słończyce geladen, die an seinem Nachlass ihr Leibgedinge und ein lebenslanges Nutzungsrecht hat. Er wirft ihnen vor, sie hätten ihre Untertanen in seinen eigenen Wald beim Dorf Łukom geschickt und dort etwa achtzig Kerben nach Art von Grenzzeichen in Bäume schlagen lassen, um einen großen Teil seines Grundes ihrem eigenen zuzuschlagen. Den Schaden setzt er, den Grund selbst nicht gerechnet, auf tausend polnische Mark und ebenso viel Schadenersatz an und verlangt, dass die Zeichen nach Hinzuziehung des Unterkämmereramts getilgt werden. Die Beklagten wurden durch den Gerichtsboten Mikołaj Jaworowski von Karmin aufgerufen und erschienen im ersten Termin nicht; der Kläger verurteilte sie mit Zulassung des Gerichts in die Strafe des Ungehorsams. Der Gerichtsbote Bartłomiej Koelmarek von Łukom erklärt, er habe die Ladung am vergangenen Montag im Hof der Geladenen im Dorf Trąbczyn in Gegenwart des Gesindes niedergelegt."
app536036-002: "Zweites Versäumnisurteil derselben Sitzung von 1644, gegen dieselben Beklagten und mit denselben Worten wie das erste. Jerzy Chełmski wirft den Trąmpczyński vor, sie hätten in den Wäldern, die zum Dorf und Gut Łukom gehören, vor kurzem etwa hundert zum Bauen taugliche Bäume, vor allem Kiefern, und etwa dreihundert Fuhren Brennholz schlagen lassen und nach Belieben verwendet. Den Schaden setzt er, den Grund selbst nicht gerechnet, auf dreihundert polnische Mark an. Für das Übrige verweist der Eintrag auf den vorangehenden."

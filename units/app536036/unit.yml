# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Two entries on leaves 641 verso and 642 of a book of decrees of the land
  court at Konin for 1641 to 1644, in Latin, of the sitting that opened at
  Konin on the Monday after the octave of Corpus Christi 1644. Both are
  judgments by default (the first is headed "Contumaces"). Jerzy Chełmski,
  plaintiff, had cited Marcin, Wojciech, Władysław and Andrzej, brothers,
  of the Otto-Trąmpczyński family, sons of the late Stanisław, and Anna of
  Słończyce, Stanisław's widow, who held her dower and a life interest in
  what he left. The first charge: they sent their subjects into Chełmski's
  own woodland of the village of Łukom and had about eighty notches cut
  into trees in the manner of boundary marks, meaning to add a great part
  of his ground to theirs; he reckons the harm at a thousand Polish marks
  and as much again in damages, and asks that the marks be annulled once
  the sub-chamberlain's court has been brought out. Called by the court's
  messenger, they did not appear at the first term, and he condemned them
  in the penalty of contumacy with the court's leave. The messenger
  Bartłomiej Koelmarek of Łukom declares that he laid the citation at their
  manor in Trąbczyn before the household on the Monday before. The second
  entry is the like judgment for about a hundred building trees, chiefly
  pine, and three hundred cartloads of firewood felled in the woods of
  Łukom, reckoned at three hundred Polish marks.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Entries of a Polish land court of 1644, in the abbreviated Latin of the
  court books; square brackets in the Latin are the editor's expansions. The
  English is the editor's own translation, revised where the Latin was
  corrected. "Contumaces" heads a judgment by default: the plaintiff
  "condemns" defendants who were called and did not appear, and the court
  admits it. "Ministerialis Regni Generalis" is the court's messenger
  (woźny), who serves citations and calls the parties; "Succamerarius" the
  sub-chamberlain, whose court decided boundaries; "domina reformatoria et
  advitalis" a widow holding her dower and a life interest; "borra" pine
  woodland; "fundo intacto" a reckoning of harm that leaves the land itself
  aside. Trampczyno is Trąbczyn.

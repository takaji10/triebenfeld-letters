# Editorial rulings for 53/6/0/-/36 (APP).
#
# Two documents, one for each entry of the court book (the editor's ruling of
# 2026-10-06, EDITORIAL_RULES): the default judgment for the notches (1), on
# leaf 641 verso with its last line on leaf 642, and the like judgment for the
# felled timber (2), on leaf 642. Established 2026-10-06.

places:
  # Place of writing: the land court sat at Konin ("in Conin Celebratis",
  # the heading of the sitting on leaf 612).
  overrides:
    "1": Konin
    "2": Konin

dates:
  # [year, month, day, precision]; read off the document.
  read: {}
  supplied: {}
  twin: {}
  inferred: {}

  # The date of the sitting the entries stand under:
  # [year, month, day, precision, basis]; the basis is shown to the reader.
  # The entries carry no date. The heading of the sitting stands on leaf 612,
  # which the editor transcribed but which is not among the scans: "feria
  # Secunda post Octavas Festi Sacratissimi Corporis Christi proxima Anno
  # Domini Millesimo Sexcentesimo Quadragesimo Quarta". Corpus Christi 1644
  # was 26 May, its octave 2 June, the Monday after it 6 June. The day of
  # these judgments within the sitting is not given, so only the year is
  # claimed.
  sitting:
    "1": [1644, null, null, "year", "The sitting opened at Konin on the Monday after the octave of Corpus Christi 1644 (6 June). Its heading is on leaf 612, which is not among the scans; the entry itself has no date."]
    "2": [1644, null, null, "year", "The sitting opened at Konin on the Monday after the octave of Corpus Christi 1644 (6 June). Its heading is on leaf 612, which is not among the scans; the entry itself has no date."]
  no_date: []

documents:

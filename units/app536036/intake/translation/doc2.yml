  en: 'A similar [judgment] against the same [defendants], in these words: for the reason that they themselves,
    not content with prior injuries — nay, adding injury to injury — to the desolation of the woodlands
    and forests belonging to the village and estate of Łukom, in those same woodlands and forests recently
    cut trees of various kinds suitable for building, especially pines, approximately one hundred, but
    for firewood three hundred cartloads, on this side or beyond, and converted them to whatever use they
    wished — doing the aforementioned things to the serious detriment of the plaintiff, which he reckons
    for himself against them, the ground itself left untouched, at three hundred Polish marks. The remainder
    from the preceding [entry] to the end.


    [Translator''s note: Lat. iniuriam iniuriae addendo — literally "adding injury to injury" — iniuriam
    accusative (the injury being added), iniuriae dative (to the prior injury). A standard legal intensifier
    characterising the defendants'' conduct as aggravated and repeated.]'

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One document: the report the Commission of Instruction of the Council of
  State of the Kingdom of Poland presented in its session of 28 October
  1834, signed by its president Faltz, on the jurisdictional conflict the
  Finance and Treasury Commission, authorised by the decision of 4 October
  1829, laid before the Council of State in July 1830 against the
  definitive judgment by which the Supreme Tribunal had the claim of
  30,000 écus due to Karol Weigel struck off the registers of the Trąbczyn
  estate belonging to Michalina Miączyńska. The report retraces the whole
  affair: the 1800 inscribing of the loan on Trąbczyn, the 1807 restitution
  of the confiscation to the last owner's daughter, the proceedings of
  Hohenlohe (1808) and Weigel (1810) before the Tribunal of Kalisz, the
  arrêté of the Court of Appeal of 9 November 1820 and the definitive
  arrêté of the Supreme Tribunal of July 1826, the petitions of both parties
  to their governments and the exchanges between the Warsaw and Berlin
  ministries, and the Supreme decision of 4 September 1821 that the
  judicial course in the case was not to be obstructed. It then reviews the
  Finance Commission's three legal arguments for a conflict of jurisdiction
  against the four conditions the organisation of the Council of State sets
  for one, concludes that the case holds no such conflict and that the
  demand "is not based on any legal principle", and hands over a draft
  decree drawn to its conclusions. The text is the archive's own transcript
  of the French report, extended from the scans where that transcript omits
  manuscript text; the manuscript's crossed-out passages are not recorded.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  The source is the archive's own transcript of a French report of 1834, in
  the administrative prose of the Congress Kingdom: long sentences of
  colon-numbered points (1° … 4°, a° … c°, ad a. … ad c.), "Sr." for a
  private litigant, "S. M-té" for Sa Majesté, "ci-devant" for the bodies of
  the Prussian era, écus for the currency of the mortgage, and Polish names
  in the clerks' spellings (Prusimska, Czapski and Czapyski, Godtewski).
  The report's heavily corrected heading is transcribed as it stands, its
  garbles included ("par a Tribunal Suprème", "en vertu daquelle"); the
  report's own slips of grammar stand too. Nothing in the wording was
  normalised.
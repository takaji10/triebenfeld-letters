# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: keep that, if wanted, as archive_title.
title: >-
  A report of 28 October 1834 in which the Instruction Commission of the
  Council of State of the Kingdom of Poland weighs the jurisdictional
  conflict the Finance Commission raised in 1830 against the Supreme
  Tribunal's striking of the 30,000-écu mortgage claim of Karol Weigel
  from the registers of the Trąbczyn estate, and advises the Council to
  set the Commission's demand aside.
title_de: >-
  Ein Bericht vom 28. Oktober 1834, in dem die Instruktionskommission des
  Staatsrats des Königreichs Polen den Kompetenzkonflikt prüft, den die
  Finanzkommission 1830 gegen die Streichung der Weigelschen
  Hypothekforderung von 30.000 Écus aus den Registern des Guts Trąbczyn
  erhoben hatte, und dem Staatsrat rät, das Begehren der Kommission
  abzuweisen.

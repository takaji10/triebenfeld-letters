agad118501169-001: "Bericht der Instruktionskommission des Staatsrats des Königreichs Polen über den Kompetenzkonflikt, den die Finanz- und Schatzkommission, auf Beschluß des alten Verwaltungsrats vom 4. Oktober 1829 ermächtigt, im Juli 1830 dem Staatsrat vorgelegt hat: gegen das Urteil, durch das das Oberste Gericht die Forderung von 30.000 Écus des Karol Weigel, des Zessionars des Gläubigers Grotowski, aus den Hypothekenregistern des Guts Trąbczyn der Michalina Miączyńska streichen ließ. Der Bericht verfolgt den Rechtsweg der Sache von der Konfiskation Trąbczyns 1796 zugunsten des Prinzen Hohenlohe-Ingelfingen und dem 1800 auf das Gut eingetragenen Darlehen an: den Beschluß der Regierungskommission vom 5. Juni 1807, der das Gut an Michalina Prusimska, die Tochter des letzten polnischen Besitzers, zurückgab; Weigels Eintragung als Zessionar 1808 und seine Klage von 1810 auf die aufgelaufenen Zinsen vor dem Tribunal in Kalisz, das die Forderung aus den Registern streichen ließ; den Beschluß des Appellationsgerichts vom 9. November 1820 und das endgültige Urteil des Obersten Gerichts von Juli 1826, das das Kalischer Urteil bestätigte; die Vorstellungen beider Parteien bei ihren Regierungen, den Verkehr zwischen Warschau und Berlin und die oberste Entscheidung vom 4. September 1821, daß der Rechtsweg in der Sache nicht gehemmt werden solle. Die Instruktionskommission nimmt die drei Gründe der Finanzkommission für einen Kompetenzkonflikt einzeln vor, hält sie gegen die vier Bedingungen, die die Organisation des Staatsrats an einen solchen Konflikt setzt, und findet, daß kein Kompetenzkonflikt bestanden hat oder besteht und daß der Rekurs in der Sache eine Kassationsbeschwerde an ein Gericht ist, als das der Staatsrat nach seiner Organisation nicht gilt; sie rät, das Begehren als auf keinem Rechtssatz beruhend abzuweisen, und reicht einen entsprechenden Gesetzentwurf ein. Vorgetragen in der Sitzung vom 28. Oktober 1834, unterzeichnet vom Präsidenten Faltz."

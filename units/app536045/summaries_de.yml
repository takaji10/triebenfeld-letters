app536045-001: "Dekret des Landgerichts in Konin aus dessen Sitzung von 1763 im Streit zwischen der Witwe Katarzyna Prusimska, geborene Rozdrażewska, mit Joseph Puchalski auf der einen und Stanisław Ścibor Chełmski mit einem Czajkowski auf der anderen Seite; beide Seiten klagen und sind zugleich geladen. Das Gericht hält eine Vernehmung beeideter Zeugen für nötig, lässt sie durchführen und die Aussagen verlesen. Danach hatte die Prusimska 1761 Pottaschebrenner mit Pottasche auf den Weg geschickt; Chełmski, der nach Posen reiste, traf sie bei Pyzdry, als sie nach Danzig zogen, ließ die Pottasche beschlagnahmen und in einem Wirtshaus in Pyzdry einlagern und legte beim Notar des Zollamts Arrest darauf. Die Brenner schafften sie trotz des Widerspruchs des Notars mit Hilfe der Adligen Wawrowski und Gotartowski fort und brachten sie nach Danzig. Weil zwischen den Parteien der Streit um die Grenze zwischen Trąbczyn und Łukom vor dem Krontribunal noch unentschieden ist und erst die Grenzziehung zeigen wird, auf wessen Grund die Pottasche hergestellt wurde, setzt das Gericht die Entscheidung aus und ordnet an, den Parteien die Zeugenaussagen aus der Kanzlei in verschlossener Rolle herauszugeben."

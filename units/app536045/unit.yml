# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  A decree of the land court at Konin, of its sitting of 1763, in the suit
  between the widow Katarzyna Prusimska and Stanisław Ścibor Chełmski over
  potash which Chełmski had stopped at Pyzdry in 1761 on its way to Gdańsk:
  the court heard sworn witnesses and then put the matter off until the
  boundary between Trąbczyn and Łukom, then before the Crown Tribunal, should
  show on whose ground the potash had been made.
title_de: >-
  Ein Dekret des Landgerichts in Konin aus dessen Sitzung von 1763 im
  Rechtsstreit zwischen der Witwe Katarzyna Prusimska und Stanisław Ścibor
  Chełmski um Pottasche, die Chełmski 1761 auf dem Weg nach Danzig in Pyzdry
  angehalten hatte: Das Gericht vernahm beeidete Zeugen und setzte die Sache
  dann aus, bis die Grenze zwischen Trąbczyn und Łukom, über die vor dem
  Krontribunal gestritten wurde, zeige, auf wessen Grund die Pottasche
  hergestellt worden war.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry, no. 17 on leaves 653 verso and 654, in a book of decrees of the
  land court at Konin for 1750 to 1765, in Latin. It belongs to the court's
  sitting that opened at Konin on the Monday after Trinity Sunday 1763. The
  parties are Katarzyna Prusimska, born Rozdrażewska, a widow, with Józef
  Puchalski on one side, and Stanisław Ścibor Chełmski with one Czajkowski
  on the other; each side is both plaintiff and summoned. The court finds
  that sworn testimony is needed, has the witnesses sworn and heard, and has
  the testimony read. It is shown that in 1761 Prusimska sent potash-burners
  with potash towards Gdańsk; that Chełmski, on his way to Poznań, came upon
  them near Pyzdry, had the potash sequestered and lodged at an inn there
  and laid an arrest on it with the notary of the customs house; and that
  the burners, though the notary objected, took it on to Gdańsk. Because the
  boundary between Trąbczyn and Łukom is before the Crown Tribunal between
  the same parties, and only the boundary will show on whose ground the
  potash was made, the court suspends the matter and orders the testimony
  handed to the parties in a closed roll.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A decree of a Polish land court of 1763, in the abbreviated Latin of the
  court books; the editor's transcription fills out the abbreviations. The
  English is the editor's own translation. "Inquisitio" is the sworn
  examination of witnesses; "Ministerialis" the court's summoner (woźny);
  "rotha juramenti" the set words of an oath; "cineres" potash and
  "cineatores" the men who burned it; "teloneum" the customs house;
  "dislimitatio" the fixing of a boundary; "rothulus" a roll in which
  testimony was closed up. Trąpczyn and Trąbczyn are one place.

oe1bu14525-001: 'Beglaubigte Abschrift der Schenkungsurkunde König Friedrich Wilhelms vom 9. August 1796: Für langjährige Dienste erhält Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, Generalleutnant und Gouverneur von Wrocław, die dem König anheimgefallenen Güter Kamionna und Kolno im Posener Kreis, Trąbczyn, Szetlewek, Nowawies, Łazy, Alt- und Neu-Laske, Osiny und das Hauland Trąbczyński im Koniner Kreis sowie Brzyce in Kujawien erblich und zu freier Verfügung, vorbehaltlich der landesherrlichen Steuern. Die Regierung zu Kalisz beglaubigt die Abschrift; der Besitztitel für Szetlewek ist im Koniner Hypothekenbuch eingetragen.'
oe1bu14525-002: Hypothekenschein der Regierung zu Kalisz für Friedrich Ludwig, regierenden Fürsten von Hohenlohe-Ingelfingen, über das Allodialgut Szetlewek, das ihm die Schenkungsurkunde vom 9. August 1796 verlieh und dessen Wert er mit 24000 Rthl angab. Eingetragen sind das Verbot, das Gut ohne Erlaubnis an Landeseingeborene zu verkaufen; 8333 Rthl 8 ggl (50000 polnische Gulden), die Ignatz von Radzinski dem Besitzer zinslos als Sicherheit für die Pachtgelder von Szetlewek geliehen hat; und eine Protestation Jacob von Przespolewskis wegen 30000 polnischer Gulden aus einer Verschreibung des Vorbesitzers von Prusimski, die zugleich auf Trąbczyn eingetragen ist.
oe1bu14525-003: Abschrift einer Schenkungsurkunde König Friedrich Wilhelms, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, Generalleutnant und Gouverneur von Wrocław, für langjährige Dienste dem König anheimgefallene Güter erblich und zu freier Verfügung erhält, vorbehaltlich der landesherrlichen Steuern. Der Text der Urkunde nennt Kamionna und Kolno im Posener Kreis und Brzyce in Kujawien; die Aufschrift nennt dazu Trąbczyn, Szetlewek und die übrigen Dörfer im Koniner Kreis. Der Gouvernementsauditeur Richter beglaubigt die Abschrift.
oe1bu14525-004: Abschrift einer Schenkungsurkunde König Friedrich Wilhelms, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, Generalleutnant und Gouverneur von Wrocław, für langjährige Dienste Güter erblich und zu freier Verfügung erhält, vorbehaltlich der landesherrlichen Steuern. Der Text der Urkunde nennt Kamionna und Kolno im Posener Kreis und Brzyce in Kujawien; die Aufschrift nennt dazu Trąbczyn, Szetlewek und die übrigen Dörfer im Koniner Kreis. Sonnabend, Auditeur des Hohenloheschen Infanterieregiments, beglaubigt die Abschrift nach dem Original.
oe1bu14525-005: 'Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 19. Juni 1797: Weil die Güter des entwichenen Starosten von Prusimski, mit denen der König Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, auszeichnen wollte, mit vielen Schulden belastet waren, erhält der Fürst sechzehn ehemals geistliche Dörfer, darunter Pszczew, Zagórów, Drzewce und Wieniec, erblich und zu freier Verfügung. Er zahlt dafür die bisherigen landesherrlichen Abgaben als festen Kanon und die den geistlichen Körperschaften zustehende Kompetenz. Sonnabend beglaubigt die Abschrift nach einer gerichtlichen Abschrift vom 24. Februar 1798.'
oe1bu14525-006: 'Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 1. Dezember 1797: Zu den im Juni verliehenen Gütern Pszczew, Zagórów und Wieniec erhält Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, deren Zubehör erblich und zu freier Verfügung: bei Pszczew mehrere Ortschaften und Hauländereien, bei Zagórów das Dörfchen Swięcia, bei Wieniec vier Orte, darunter Konty, Szedlemin und Bątkowo. Er zahlt dafür die bisherigen landesherrlichen Abgaben als festen Kanon und die den geistlichen Körperschaften zustehende Kompetenz. Sonnabend, Auditeur des Hohenloheschen Infanterieregiments, beglaubigt die Abschrift.'
oe1bu14525-007: 'Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 1. Dezember 1797, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, das Zubehör der ihm im Juni verliehenen Güter Pszczew, Zagórów und Wieniec erhält, darunter das Dörfchen Swięcia bei Zagórów. Die Regierung zu Kalisz hat die Abschrift für die Eintragung des Besitztitels beglaubigt. Beigefügt ist ein Hypothekenschein der Regierung zu Kalisz für das Gut Swięcia mit dem Vorwerk Broniki: Eingetragen ist allein das Verbot, es ohne besondere Erlaubnis an Landeseingeborene zu verkaufen; Schulden stehen keine darauf. Sonnabend beglaubigt beides in Wrocław.'
oe1bu14525-008: Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 19. Juni 1797, mit der Friedrich Ludwig, regierender Fürst zu Hohenlohe-Ingelfingen, sechzehn ehemals geistliche Dörfer erblich erhält, darunter Pszczew, Zagórów, Drzewce und Wieniec, gegen die bisherigen landesherrlichen Abgaben als festen Kanon und die den geistlichen Körperschaften zustehende Kompetenz. Begründet wird dies damit, dass die Güter des entwichenen Starosten von Prusimski, mit denen der König ihn auszeichnen wollte, mit vielen Schulden belastet waren. Der Gouvernementsauditeur Richter beglaubigt die Abschrift nach dem Original.
oe1bu14525-009: Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom Juni 1797, mit der Friedrich Ludwig, regierender Fürst zu Hohenlohe-Ingelfingen, sechzehn ehemals geistliche Dörfer erblich erhält, darunter Pszczew, Zagórów, Drzewce und Wieniec, gegen die bisherigen landesherrlichen Abgaben als festen Kanon und die den geistlichen Körperschaften zustehende Kompetenz. Begründet wird dies damit, dass die Güter des entwichenen Starosten von Prusimski, mit denen der König ihn auszeichnen wollte, mit vielen Schulden belastet waren. Sonnabend, Auditeur des Hohenloheschen Infanterieregiments, beglaubigt die Abschrift nach dem Original.
oe1bu14525-010: Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 19. Juni 1797, mit der Friedrich Ludwig, regierender Fürst zu Hohenlohe-Ingelfingen, sechzehn ehemals geistliche Dörfer erblich erhält, darunter Pszczew, Zagórów, Drzewce und Wieniec, gegen die bisherigen landesherrlichen Abgaben als festen Kanon und die den geistlichen Körperschaften zustehende Kompetenz. Begründet wird dies damit, dass die Güter des entwichenen Starosten von Prusimski, mit denen der König ihn auszeichnen wollte, mit vielen Schulden belastet waren. Der Gouvernements- und Garnisonauditeur Richter beglaubigt die Abschrift nach dem Original.
oe1bu14525-011: 'Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 1. Dezember 1797: Zu den im Juni verliehenen Gütern Pszczew, Zagórów und Wieniec erhält Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, deren Zubehör erblich und zu freier Verfügung: bei Pszczew mehrere Ortschaften und Hauländereien, bei Zagórów das Dörfchen Swięcia, bei Wieniec Konty, Szedlemin, Bątkowo und Karczyn. Er zahlt dafür die bisherigen landesherrlichen Abgaben als festen Kanon und die den geistlichen Körperschaften zustehende Kompetenz. Das Geheime Südpreußische Archiv beglaubigt die Abschrift nach dem Original.'
oe1bu14525-012: Hypothekenschein der Regierung zu Poznań für Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, über das Gut Kolno, das aus der Stadt Kamionna und dem Marktflecken Kolno besteht. Es fiel an den Fiskus, als das ganze Vermögen Anton von Prusimskis wegen seiner Teilnahme am Aufstand von 1794 eingezogen wurde, und kam durch die Verleihungsurkunde vom 9. August 1796 an den Fürsten. Eingetragen sind Protestationen Anton von Broniewskis, der das Gut als Pfand zu besitzen behauptet und 79795 Rthl 18 g 8 4/5 pf fordert, beides vom Fürsten bestritten, sowie zwei dauernde Lasten zugunsten der Kirche zu Kamionna. Der Schein ist nur zur Information ausgestellt.
oe1bu14525-013: Wertanschlag der Güter Kamionna und Kolno im Kreis Międzyrzecz, die dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen gehören, aufgestellt auf sein Verlangen nach den westpreußischen Grundsätzen von 1794, nach südpreußischen Grundsätzen berichtigt von dem Kalkulator Bading und 1804 in Berlin beglaubigt. Beschrieben werden Lage, Grenzen und Fläche (10642 Morgen), die Stadt Kamionna mit 75 Feuerstellen und 466 Einwohnern, das Schankrecht der Herrschaft, die beiden Vorwerke und das Dorf Kolno mit seinen Bauern. Das freie Bau- und Brennholz aus der Krobilewer Heide wird der Stadt und der Herrschaft derzeit streitig gemacht. Der Text bricht vor der Berechnung des Werts ab.
oe1bu14525-014: 'Schluss eines Wertanschlags der Güter Kamionna und Kolno: Zwei Notare in Kalisz bescheinigen, dass die Taxe in allen Stücken als richtig anerkannt wurde. Der Forstinspektor Rochlitz rechnet vor, wie der Wert der Güter steigen würde, wenn 344 Morgen Wald abgetrennt und mit 22 Familien zu je einer halben Hufe besetzt und das Land verkauft würde, das die Bürger von Kamionna (700 Morgen) und die Untertanen von Kolno (1200 Morgen) über ihre Verschreibungen hinaus besitzen. Nach seiner Rechnung stiege der Wert von 186943 Rthl, berechnet nach westpreußischen Grundsätzen, auf 255833 Rthl 12 g.'
oe1bu14525-015: Hypothekenschein der Regierung zu Poznań für Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, über die Herrschaft Pszczew mit ihren Dörfern, Hauländereien und der Heidemühle. Die Güter gehörten dem Domkapitel zu Poznań und kamen nach der Einziehung der geistlichen Güter durch die Verleihungsurkunden vom 19. Juni und 1. Dezember 1797 an den Fürsten. Eingetragen sind die jährliche Kompetenz der früheren geistlichen Besitzer, an die Kriegs- und Domänenkasse zu Poznań zu zahlen und noch nicht beziffert, und das Verbot, die Güter ohne königliche Erlaubnis an Eingeborene des früheren Polen zu verkaufen. Schulden sind keine eingetragen.
oe1bu14525-016: 'Resignationsbrief, das heißt Urkunde über die förmliche Abtretung, ausgestellt unter dem Siegel der Regierung zu Poznań: Am 22. März 1802 hat der Kammerfiskal Beyer im Namen des Fiskus die Herrschaft Pszczew mit ihren Dörfern und Hauländereien aufgrund der Verleihungsurkunden von 1797 an Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, abgetreten; der Kreisjustizrat Melzer hat sie als Bevollmächtigter des Fürsten angenommen. Die Übertragung wird bestätigt, mit dem Recht, die Herrschaft zu verkaufen, zu verschenken, zu tauschen und zu verpfänden. Ein Vermerk bestätigt die Eintragung des Besitztitels im Hypothekenbuch.'
oe1bu14525-017: Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 19. Juni 1797, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, sechzehn ehemals geistliche Dörfer erblich erhält, darunter Pszczew, Zagórów, Drzewce und Wieniec, gegen die bisherigen landesherrlichen Abgaben als festen Kanon und die den geistlichen Körperschaften zustehende Kompetenz. Begründet wird dies damit, dass die Güter des entwichenen Starosten von Prusimski, mit denen der König ihn auszeichnen wollte, mit vielen Schulden belastet waren. Die Regierung zu Poznań beglaubigt die Abschrift für die Eintragung des Besitztitels der Herrschaft Pszczew; ein Vermerk bestätigt die Eintragung.
oe1bu14525-018: Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 1. Dezember 1797, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, das Zubehör der ihm im Juni verliehenen Güter Pszczew, Zagórów und Wieniec erhält. Die Regierung zu Poznań hat die Abschrift für die Eintragung des Besitztitels der Herrschaft Pszczew beglaubigt; ein Vermerk bestätigt die Eintragung. Der Gouvernementsauditeur Richter bescheinigt außerdem, dass die Abschriften des Hypothekenscheins und des Resignationsbriefs für Pszczew mit den ihm vorgelegten Originalen übereinstimmen.
oe1bu14525-019: Die Regierung zu Kalisz fordert den regierenden Fürsten zu Hohenlohe-Ingelfingen in Wrocław auf, binnen vier Wochen sein Eigentum an den ehemals geistlichen Gütern Kopojno, Drzewce, Swięcia und Zagórów im Koniner Kreis nachzuweisen und einen Termin zur Eintragung seines Besitztitels zu beantragen. Nach der Kriegs- und Domänenkammer sind ihm die Güter verliehen und bereits übergeben.
oe1bu14525-020: Die Regierung zu Kalisz bewilligt Glenck, dem Bau- und Ökonomierat des Fürsten zu Hohenlohe-Ingelfingen in Wrocław, auf sein Gesuch vom 8. des Monats eine letzte Frist bis Ende Oktober, um den Besitztitel des Fürsten für Drzewce, Kopojno, Swięcia und Zagórów eintragen zu lassen.
oe1bu14525-021: Amtlicher Auszug aus dem Hypothekenbuch für die Stadt Zagórów, die Friedrich Ludwig, regierender Fürst zu Hohenlohe-Ingelfingen, durch die Verleihungsurkunde vom 19. Juni 1797 erhielt; der Hypothekenbewahrer des Departements Kalisz bestätigt 1811 auf Polnisch, dass sich der Stand nicht geändert hat. Eingetragen sind eine jährliche Kompetenz von 88 Rthl 5 g 9 d, Protestationen des Fiskus und der Erbpächter von Oleśnica wegen Rechten am Holz der Zagórówer Forsten, eine Anleihe des Eigentümers über 250000 Rthl zugunsten des Kriegs- und Forstrats Peter Friedrich August von Triebenfeld, der Teile davon der Generalinvalidenkasse verpfändet und an Bankiers in Berlin und Königsberg abgetreten hat, und eine Protestation über 8000 Rthl für die Erben des Grafen Seher-Thoss.
oe1bu14525-022: 'Abschrift einer Verleihungsurkunde König Friedrich Wilhelms vom 19. Juni 1797, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, sechzehn ehemals geistliche Dörfer erblich erhält, darunter Pszczew, Zagórów, Drzewce und Wieniec, gegen die bisherigen landesherrlichen Abgaben als festen Kanon und die den geistlichen Körperschaften zustehende Kompetenz; die Regierung zu Kalisz hat sie für die Eintragung des Besitztitels beglaubigt. Beigefügt ist ein Hypothekenschein der Regierung zu Kalisz für die Stadt Zagórów: Eingetragen ist allein das Verbot, sie ohne besondere Erlaubnis an Landeseingeborene zu verkaufen; Schulden stehen keine darauf. Schenck, Justizbürgermeister, beglaubigt beide Abschriften in Trąbczyn.'
oe1bu14525-023: Gerichtlicher Wertanschlag des Guts Szetlewek im Koniner Kreis, den die Regierung zu Kalisz für Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, ausfertigen ließ. Das Gut misst 1724 Morgen; darauf sitzen drei Ganzhüfner, fünf Halbhüfner und neun Einlieger, mit einem Krug, einer Schmiede und einer Wassermühle. Die Untertanen erhielten Brennholz aus dem Wald von Trąbczyn, da beide Güter stets einen Herrn hatten. Szetlewek ist von 1799 bis 1805 für jährlich 7800 Gulden an Ignatz von Radzinski verpachtet. Nach Abzug des Inventars, das dem Pächter gehört, wird der Wert auf 31171 Rthl 23 gg 4 d festgesetzt.
oe1bu14525-024: Ein kurzer Vermerk, großenteils nicht gelesen. Erkennbar sind der Name Melzer, das Datum 18. April 1803 und ein Erbpachtkontrakt über Bątkowo.
oe1bu14525-025: 'Notariell beglaubigte Abschrift eines Hypothekenscheins der Regierung zu Poznań über die Herrschaft Pszczew, ausgestellt für Johann Wilhelm Glenck, Bau- und Ökonomierat im Dienst des Fürsten zu Hohenlohe-Ingelfingen, wegen seiner Forderung von 5000 Rthl. Eingetragen sind die jährliche Kompetenz der früheren geistlichen Besitzer, nun auf 2470 Rthl 16 gg 3 pf festgesetzt, und Schulden des Fürsten: 48000 Rthl an Glenck, 2000 Rthl an den Breslauer Handelsmann Abraham Moses Hirschel und je 5000 Rthl an den Freiherrn von der Marwitz auf Rudnik, an die Witwe Christiane Dorothea Michaelis und nochmals an Glenck.'
oe1bu14525-026: Die Regierung zu Poznań teilt dem Fürsten zu Hohenlohe-Ingelfingen mit, dass auf sein Gesuch hin je 5000 Rthl für den Baron von der Marwitz, die Oberamtsrätin Michaelis und den Ökonomierat Glenck auf die Herrschaft Pszczew eingetragen und für jeden der drei Gläubiger ein Hypothekenschein verfügt worden ist. Die Scheine kann er nach vier Wochen gegen die Kosten im Archiv der Regierung abholen lassen.
oe1bu14525-027: 'Bescheinigung der Regierung zu Poznań für Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, aus den Hypothekenakten der Güter von Pszczew im Kreis Międzyrzecz: Die Güter sind ihm durch die Schenkungsurkunde vom Juni 1797 und deren Erklärung vom 1. Dezember 1797 verliehen; die Eintragung seines Besitztitels wartet nur noch auf die Abtretung durch den Fiskus. Die Güter gehörten früher dem Bistum Poznań, und der Fürst hat darauf bisher keine Schulden aufgenommen und keine Schuldurkunden zur Eintragung eingereicht.'
oe1bu14525-028: Hypothekenschein der Regierung zu Poznań für Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, über das Gut Bątkowo im Kreis Radziejów mit dem Gut Szedlemin im Kreis Brześć. Beide gehörten dem Domkapitel zu Włocławek und kamen nach der Einziehung der geistlichen Güter durch die Verleihungsurkunde vom 1. Dezember 1797 an den Fürsten. Eingetragen sind die jährliche Kompetenz des Domkapitels, noch nicht beziffert, und das Verbot, die Güter ohne königliche Erlaubnis an Eingeborene des früheren Polen zu verkaufen; Schulden sind keine eingetragen.
oe1bu14525-029: 'Abschrift eines Schreibens Johann Wilhelm Glencks, des Bau- und Ökonomierats des Fürsten zu Hohenlohe, an den König: Dem königlichen Befehl gemäß, den Besitztitel der fürstlichen Güter Kopojno, Zagórów, Drzewce und anderer zu berichtigen, habe er alles getan, um die Urkunden beizubringen. Er hofft, das bisherige Hindernis sei behoben und der Befehl könne binnen vier Wochen ausgeführt werden, und bittet, alle strengen Verfügungen aufzuschieben. Der Befehl, auf den er antwortet, ist auf den 18. November datiert, sein Schreiben auf den 3. November.'
oe1bu14525-030: Die Regierung zu Kalisz setzt Glenck, dem Bau- und Ökonomierat des Fürsten zu Hohenlohe-Ingelfingen in Wrocław, in der Hypothekensache des Guts Swięcia eine Frist von 14 Tagen für das Hypothekenwesen dieses Guts und der dazugehörigen Güter Kopojno, Drzewce und Zagórów, mit der Ankündigung, dass dann unausbleiblich der Fiskus gegen den Fürsten tätig werden müsse.
oe1bu14525-031: 'Die Regierung zu Kalisz teilt dem Fürsten von Hohenlohe-Ingelfingen mit: Da er das Gut Trąbczyn mit Zubehör vom Fiskus erworben hat, muss zuerst sein Besitztitel im Hypothekenbuch eingetragen werden. Dazu soll er binnen vier Wochen eine beglaubigte Abschrift des Urteils einreichen, mit dem das ganze Vermögen Anton von Prusimskis dem Fiskus zugesprochen wurde, und eine Bescheinigung des zuständigen Gerichts, dass das Urteil rechtskräftig ist.'
oe1bu14525-032: Ein Schreiben aus Kalisz, unterzeichnet Schultz, ersucht die Oberamtsregierung zu Wrocław, dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen, wie am 24. September des Vorjahres erbeten, baldigst den Huldigungseid abzunehmen und das Protokoll darüber zu übersenden.
oe1bu14525-033: 'Entwurf Glencks, im Namen des Fürsten zu Hohenlohe, in zwei Fassungen, die eine an die Kammer zu Poznań, die andere an die Regierung gerichtet: Die Regierung zu Poznań habe die Berichtigung des Besitztitels der fürstlichen Güter binnen 14 Tagen gefordert und sonst mit dem Fiskus gedroht; der Fürst habe darauf die fehlenden Schenkungsurkunden im Original eingeschickt. Nun bittet Glenck um die schleunige Abtretung aller fürstlichen Güter in Kujawien und bei Pszczew durch den Fiskus.'
oe1bu14525-034: 'Die Regierung zu Poznań antwortet Glenck, dem Bau- und Ökonomierat des Fürsten zu Hohenlohe in Wrocław, auf seine Vorstellung vom 13. des Monats: Der Fiskus hat die Güter Kolno und Kamionna bereits abgetreten; für die Güter von Pszczew ist der Termin auf den 22. März angesetzt. Für die Güter in Kujawien ist die Abtretung noch gar nicht beantragt worden; die Regierung erwartet, dass ein zugelassener Justizkommissar die Berichtigung des Besitztitels betreibt.'
oe1bu14525-035: Die Kriegs- und Domänenkammer zu Poznań teilt Glenck, dem Bau- und Ökonomierat des Fürsten von Hohenlohe-Ingelfingen in Wrocław, auf seinen Antrag vom 13. des Monats mit, dass der Kammerfiskal Beyer die nötigen Aufträge erhalten hat, um für den Fiskus alle Güter des Fürsten bei Pszczew und in Kujawien abzutreten.
oe1bu14525-036: 'Johann Wilhelm Glenck, Bau- und Ökonomierat des Fürsten zu Hohenlohe, schreibt dem König: Die Regierung zu Poznań habe die Berichtigung des Besitztitels der fürstlichen Güter als nötig und eilig gefordert, und der Fürst habe die fehlenden Schenkungsurkunden im Original eingeschickt. Im Namen des Fürsten bittet er inständig um die schleunigste Abtretung aller fürstlichen Güter in Kujawien und bei Pszczew durch den Fiskus.'
oe1bu14525-037: Die Regierung zu Poznań mahnt Glenck, den Bau- und Ökonomierat des Fürsten zu Hohenlohe-Ingelfingen, binnen einer letzten Frist von 14 Tagen die Verfügung vom 30. Oktober des Vorjahres über die Berichtigung des Besitztitels der Herrschaft Pszczew für den Fürsten zu erfüllen.
oe1bu14525-038: 'Melzer schreibt einem Bau- und Ökonomierat: Im heutigen Termin zur Abtretung der Güter von Pszczew ist der Kammerfiskal wieder nicht erschienen, weil ihn die Kammer noch nicht ermächtigt hat. Melzer hat um einen neuen Termin gebeten, sieht aber kein Ende, solange die Kammer dem Fiskal keine klare Anweisung gibt, und rät, der Fürst möge den Kammerpräsidenten von Harlem um Beschleunigung bitten. In einer Nachschrift meldet er, dass das Urteil zweiter Instanz in einer Sache mit dem Domkapitel abändernd ausgefallen und das Domkapitel abgewiesen worden ist.'
oe1bu14525-039: 'Abschrift eines Schreibens Hoyms an den Fürsten zu Hohenlohe-Ingelfingen: Der König hat ihm durch Kabinettsordre vom 23. des Monats Kamionna und Kolno, Trąbczyn und die übrigen Dörfer im Koniner Kreis sowie Brzyce in Kujawien erblich geschenkt; Hoym betreibt die Ausfertigung der Schenkungsurkunde. Da die Güter dem Hauptaufständischen von Prusimski gehörten, erkundigt er sich bei der Regierung zu Poznań nach den Schulden darauf. Die Güter sollen jährlich mindestens 4000 Taler tragen; zur Veranschlagung empfiehlt er den Kammerrat Peucker in Fraustadt, der sie auch verkaufen könnte, falls der Fürst sie nicht behalten will. Oberst von Sanitz hat Prusimskis Güter im Kreis Wągrowiec erhalten.'
oe1bu14525-040: 'Abschrift eines königlichen Reskripts, unterzeichnet von Hoym, an die Kammern zu Poznań und Petrikau: Die Übergabe der dem Fürsten zu Hohenlohe verliehenen konfiszierten und geistlichen Güter sei nur ein oberflächliches Zeremoniell gewesen; Leute mit ungeprüften, zum Teil angeblich falschen Pfand- und Pachtverträgen säßen auf den Gütern. Die Kammern sollen die Ansprüche rasch prüfen, die Güter den Bevollmächtigten des Fürsten zur freien Bewirtschaftung übergeben, Streit möglichst gütlich beilegen und nötige Prozesse auf kürzestem Weg führen lassen. Auch sollen sie die Abgaben und Kompetenzgelder, die der Fürst zu zahlen hat, schleunigst festsetzen.'
oe1bu14525-041: 'Beglaubigte Abschrift eines Schreibens Hoyms an den Fürsten zu Hohenlohe-Ingelfingen vom 3. Oktober 1797: Die Unruhe des Fürsten wegen der Übergabe seiner südpreußischen Güter beruhe auf einem Missverständnis; Hoym legt seine Verfügungen an die Kammern zu Poznań und Petrikau bei, die Güter baldigst zu übernehmen und zu übergeben. Die geistlichen Besitzer säßen seit dem 1. Juni 1796 auf Rechnung des Fiskus und müssten räumen, sobald sie ihre Kompetenz erhielten; der Bischof von Kujawien sei nur noch in Wieniec und Wolica, weil der Fürst ihn dort lassen wolle. Einen Pächter, der nicht gütlich weiche, möge der Fürst lieber bis Juni 1798 gegen das Pachtgeld lassen, sonst müsse die königliche Kasse ihn entschädigen.'
oe1bu14525-042: Die Regierung zu Kalisz fordert den Fürsten von Hohenlohe-Ingelfingen auf, zur vollständigen Berichtigung seines Besitztitels für das Gut Szetlewek binnen vier Wochen eine beglaubigte Abschrift des Konfiskationsurteils gegen Anton von Prusimski samt einer Bescheinigung seiner Rechtskraft einzureichen.
oe1bu14525-043: 'Abschrift eines Bescheids der Regierung zu Poznań an den Fürsten von Hohenlohe-Ingelfingen auf sein Gesuch vom 31. Januar, in dem er für die Berichtigung seines Besitztitels an den Gütern von Trąbczyn eine beglaubigte Abschrift des Konfiskationsurteils gegen von Prusimski mit Rechtskraftbescheinigung erbeten hatte: Das Urteil sei nicht in Poznań, sondern von der Regierung zu Toruń gefällt worden, und er müsse sich dorthin wenden. Seine Anlage erhält er im Original zurück.'
oe1bu14525-044: 'Bescheid der Regierung zu Poznań an den Fürsten von Hohenlohe-Ingelfingen auf sein Gesuch vom 31. Januar, in dem er für die Berichtigung seines Besitztitels an den Gütern von Trąbczyn eine beglaubigte Abschrift des Konfiskationsurteils gegen von Prusimski mit Rechtskraftbescheinigung erbeten hatte: Das Urteil sei nicht in Poznań, sondern von der Regierung zu Toruń gefällt worden, und er müsse sich dorthin wenden. Seine Anlage erhält er im Original zurück.'

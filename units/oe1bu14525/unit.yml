# One archival unit. Everything the pipeline needs to know about where this
# material came from and how its files are named.

slug: oe1bu14525
ref: Oe 1 Bü 14525
archive: Hohenloher Zentralarchiv Neuenstein (HZAN)
# What the holding is about, in one sentence, English and German: the line
# under the reference on the Sources page, and the opening of the
# translator's and summariser's prompts (editor, 2026-10-01).
title: >-
  The papers by which the South Prussian estates came to the Prince of
  Hohenlohe-Ingelfingen: the royal grant of 1796, its certified copies, the
  entries of his title, a valuation, and the official correspondence that
  carried the grant into effect.
title_de: >-
  Die Papiere, durch die die südpreußischen Güter an den Fürsten zu
  Hohenlohe-Ingelfingen kamen: die königliche Schenkung von 1796, ihre
  beglaubigten Abschriften, die Eintragung seines Besitztitels, eine Taxe und
  der amtliche Schriftwechsel zu ihrer Ausführung.
# The heading this field carried before: the archive's or the file's own
# title with an English gloss. Kept for reference; nothing displays it.
archive_title: >-
  The royal grants of the South Prussian estates to Friedrich Ludwig, Prince
  of Hohenlohe-Ingelfingen, with the certified copies, mortgage certificates,
  valuations and official correspondence that carry them into effect.
date_span: 1794-1804
status: translated         # draft | transcribed | translated | published

# The translation generation this holding was published from. Every tool
# defaults to the untagged cache, so without this the next check reads an
# abandoned draft and reports faults in text nobody is served.
published_tag: "" # untagged: cache/translation-raw

# The editorial era this holding belongs to. Assigned here once for the whole
# unit; rulings.yml carries only the exceptions.
era: hohenlohe

# Which archive holds it - reference/repositories.yml. `archive:` above is
# the citation string; this is the slug that groups holdings.
repository: hzan-neuenstein

# Raw scans live outside the project, and are needed only to crop the pages
# again: crop_scans.py reads from raw_dir and writes into raw_dir/processed/.
# The finished pages are in pages/, and the intake records (manifest, fold,
# trim and skew decisions) are kept in units/<slug>/intake/.
scans:
  raw_dir: C:/Users/Tersnaus/Downloads/Oe 1_Bue 14525
  raw_glob: Oe 1_Bü 14525_*.jpg

  # Web derivatives are copied into site/assets/scans/ under an ASCII-safe
  # prefix, because source names carry spaces and umlauts. Later stages parse
  # this prefix, so it must not change once the unit is published.
  ascii_prefix: Oe_1_Bu_14525

# Transcriptions that arrived already matched to the scans, one file per page.
# import_pages.py reads them in filename order and writes corpus.txt, so the
# pairing is declared rather than reconstructed later. 43 of the 209 are empty:
# pages deliberately left untranscribed, which the import skips.
transcriptions:
  dir: transcriptions          # units/<slug>/transcriptions/
  glob: "*.txt"

  # Named <seq>_<archival stem>_<capture>_<crop>.txt; the capture and crop are
  # the page's identity, so everything up to and including the stem goes:
  #   0004_Oe 1_Bue 14525_0003_a2.txt  ->  0003_a2
  page_id_strip: "Oe 1_Bue 14525_"

# The transcription. Documents are delimited by [DOC N] on its own line.
corpus: corpus.txt

# Rules this unit opts into. A unit without these keys keeps the behaviour it
# was built with, so adopting them is a decision taken holding by holding.
linebreaks:
  # Also catch catchwords shorter than four letters (Po, Da, sig), spelling
  # variants (Jahrl / jährliche, Wirkung / Würkung) and figures (1805).
  loose_catchwords: true
paragraphs:
  # A line ends a paragraph only if it is short against the page AND holds no
  # more than this many words; on a narrow page three words fill a line. A line
  # that closes its sentence is exempt: datelines and titles run to five words.
  few_words: 3
  # Two short lines in a row break on their own only if both hold no more than
  # this many words (a signature block); wider runs are left for review.
  column_words: 2
  # Test the last line of a page too, so a paragraph can begin overleaf. A page
  # that ends in a catchword never ends a paragraph: the catchword says the
  # sentence runs on.
  page_ends: true

# For the reader: shown on this unit's provenance page.
description: >-
  Forty-four documents recording how the South Prussian estates came to
  Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen: the original royal grant
  of 1796 from Friedrich Wilhelm II, its certified copies, the mortgage
  certificates and resignation briefs that registered the Prince's title, a
  valuation of the estates of Kaemen and Kolno, and the official
  correspondence with the Posen and Kalisch chambers that carried the grant
  into effect. The estates are Kamionna and Kolno, Trąbczyn and Szetlewek,
  Betsche (Pszczew) and Zagórów. Two documents are registers rather than
  prose: an inventory of Kaemen and Kolno, and a forest valuation.

# Passed to the summariser and the translator with every document of this
# holding. Facts about the source that change how it should be read, not
# instructions about style.
translation_note: >-
  These are grant certificates, mortgage certificates, valuations and
  official correspondence, not letters generically - most open with a royal
  or chancery formula, not a salutation.

  Financial figures and dates are carried across exactly as transcribed, even
  where they conflict with each other or with the surrounding text: no
  financial figure in this corpus is trustworthy on its own, and this volume
  has not been checked for internal arithmetic the way the estate-revenue
  table in another holding has.

  `Sonnabend` recurs across several documents as a person's surname, the
  regiment's judge advocate who certifies copies - not the day of the week.

  Document 21 is partly Polish: an official extract from the Kalisz mortgage
  register of the Duchy of Warsaw, with a Polish heading and dateline wrapped
  around German entries.

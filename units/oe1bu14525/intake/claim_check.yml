- {claim: "nach seiner Rechnung stiege der Wert von 186943 Rthl, berechnet nach westpreußischen Grundsätzen, auf 255833 Rthl 12 g", verdict: supported, where: "zu den nach Westpreußen Principien berechneten Werth der 186 943. r. zugerechnet; so würde der ganze Hauß werth auf 255833 rthl 12 g zu stehen können"}

oe1bu14525-015:

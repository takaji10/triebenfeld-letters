- {claim: "und das Verbot, die Güter ohne königliche Erlaubnis an Eingeborene des früheren Polen zu verkaufen", verdict: supported, where: "Das Landesherrliche Verboth, daß die ... Güter, ohne höchsten Königlichen Consens nicht an Eingebohrne des ehemaligen Pohlens veräußert werden dürfen"}
- {claim: "Schulden sind keine eingetragen", verdict: supported, where: "II. Gerichtlich versicherte Schulden und andere Real-Verbindlichkeiten. sind nicht eingetragen"}

oe1bu14525-016:

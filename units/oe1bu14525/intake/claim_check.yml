- {claim: "aufgestellt auf sein Verlangen nach den westpreußischen Grundsätzen von 1794", verdict: supported, where: "Den werth dieser Güther hat der Unterzeichnete ad instantiam des Herren Fürsten ... berechnet und dabey auf ausdrückliches Verlangen die Westpreußischen detaxations Principien d. d. Marienwerder den 22 ten July 1794 zum Grunde gelegt"}

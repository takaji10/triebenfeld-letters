- {claim: "eingetragen ist die jährliche Kompetenz der früheren geistlichen Besitzer, nun auf 2470 Rthl 16 gg 3 pf festgesetzt", verdict: supported, where: "3. 2470 Rthl 16 gg. 3 pfl. ... als die, den vormaligen geist lichen Besitzern dieser Güter daraus Zukommende ... jährliche Competenz ... an die Stelle der ... nunmehro gelöschten unbestimmten Competivigore Decreti"}
- {claim: "Schulden des Fürsten: 48000 Rthl an Glenck", verdict: supported, where: "2. 48000 rtl. ... welche der Herr Eigenthümer dem ... Bau und Oeconomie Rath Johann Wilhelm Glenck ... schuldig geworden ist"}
- {claim: "2000 Rthl an den Breslauer Handelsmann Abraham Moses Hirschel", verdict: supported, where: "3., 2000 rtl. ... welche der Herr Eigenthümer ... von dem Handelsmann Abraham Moses Hirschel zu Breslau ... erborgt hat"}
- {claim: "je 5000 Rthl an den Freiherrn von der Marwitz auf Rudnik, an die Witwe Christiane Dorothea Michaelis und nochmals an Glenck", verdict: supported, where: "4., 5000 rtl ... dem Freyherrn v. d. Marwitz auf Rudnik; 5., 5000 rth. ... der verwittweten Ober-Amts Räthin Christiane Dorothea Michaelis, gebohrne Eichborn; 6., 5000 rtl. ... dem ... Bau und Oeconomie Rath Johann Wilhelm Glenck"}

oe1bu14525-026:
- {claim: "die Regierung zu Poznań teilt dem Fürsten zu Hohenlohe-Ingelfingen mit", verdict: supported, where: "Gegeben Posen den 11ten July 1803. Königliche Südpreußl. Regierung ... An den Herrn Fürsten zu Hohenlohe-Ingelfingen"}
- {claim: "dass auf sein Gesuch hin je 5000 Rthl für den Baron von der Marwitz, die Oberamtsrätin Michaelis und den Ökonomierat Glenck auf die Herrschaft Pszczew eingetragen und für jeden der drei Gläubiger ein Hypothekenschein verfügt worden ist", verdict: supported, where: "dem Ansuchen vom 20ten M. pr. gemäß ... die Eintragung der 5000 rttlr. für den Baron von der Marwitz, der 5000 rttlr. für die Ober Amts-Räthin Michaelis, und der 5000 rttlr. für den Oeconomie-Rath Glenck, in das Hypothequen Buch auf die Herrschaft Betsche, und die Ausfertigung eines Hypothekenscheins in vim recognitionis für jeden der drey Gläubiger verfügt worden ist"}
- {claim: "die Scheine kann er nach vier Wochen gegen die Kosten im Archiv der Regierung abholen lassen", verdict: supported, where: "welche Ewr: Liebden nach 4 Wochen gegen Zahlung der Kosten in dem Archive Unsrer Regierung können in Empfang nehmen laßen"}

oe1bu14525-027:
- {claim: "Bescheinigung der Regierung zu Poznań für Friedrich Ludwig aus den Hypothekenakten der Güter von Pszczew im Kreis Międzyrzecz", verdict: supported, where: "die Betscher Güter Meseritzer Creises dem regierenden Herrn Fürsten Friedrich Ludwig ... gegenwärtiges Attest ... unter Unserer Süd Preußischen Regierung größern Insiegel ... Gegeben Posen den 9ten Februar 1802; Attest ... aus den Betscher Grü[?] und Hypotheken Acten"}
- {claim: "die Güter sind ihm durch die Schenkungsurkunde vom Juni 1797 und deren Erklärung vom 1. Dezember 1797 verliehen", verdict: supported, where: "durch die Schenkungs Urkunde von 10ten Juny 1797. und deren Deklarezion von des izt regierenden Königl. Majestaat vom 1ten December ejd: a. würklich verliehen sind"}
- {claim: "die Eintragung seines Besitztitels wartet nur noch auf die Abtretung durch den Fiskus", verdict: supported, where: "daß die Berichtigung des Besitz Tituls ... sich nur ander vom Fisco noch zu leistenden Resignation accrochiret"}
- {claim: "die Güter gehörten früher dem Bistum Poznań", verdict: supported, where: "daß diese Betscher Güter ehemals geistliche, nehmlich zum Bistum Posen gehörige Güter gewesen sind"}
- {claim: "der Fürst hat darauf bisher keine Schulden aufgenommen und keine Schuldurkunden zur Eintragung eingereicht", verdict: supported, where: "daß darauf bis izt von dem benannten Herrn Fürsten keine schulden kontrahirt und keine Schuld Dokumente zur Ingrossation eingereicht worden sind"}

oe1bu14525-028:
- {claim: "Hypothekenschein der Regierung zu Poznań für Friedrich Ludwig über das Gut Bątkowo im Kreis Radziejów mit dem Gut Szedlemin im Kreis Brześć", verdict: supported, where: "Das unter der Gerichtsbarkeit der Königl. Südpreußl. Regierung zu Posen im Radziejewoschen Kreise gelegene adliche Guth Batkowo. nebst dem im Brześćschen Kreise gelegenen Guthe Siedlemin; Hypotheken schein für den regierenden Herrn Fursten zu Hohenlohe Ingelfingen"}
- {claim: "beide gehörten dem Domkapitel zu Włocławek und kamen nach der Einziehung der geistlichen Güter durch die Verleihungsurkunde vom 1. Dezember 1797 an den Fürsten", verdict: supported, where: "als vormalige geistliche, dem Dohm Capitel zu Wraclawek gehörig gewesenen Güter nach erfolgter Einziehung sämmtlicher geistlicher Güter in Südpreussen ... besage der VerleihungsUrkunde de dato Berlin den 1ten December 1797."}
- {claim: "eingetragen ist die jährliche Kompetenz des Domkapitels, noch nicht beziffert", verdict: supported, where: "die dem Domkapitel zu Wraclawek aus diesen Gütern gebühre jährliche Competenz, welche weil das bestimmte quantum nicht angezeigt und bescheinigt worden, auf eine unbestimmt Summe ... eingetragen"}
- {claim: "und das Verbot, die Güter ohne königliche Erlaubnis an Eingeborene des früheren Polen zu verkaufen; Schulden sind keine eingetragen", verdict: supported, where: "ohne ausdrucklichen höchsten Königlichen Consens nicht an Landes Eingebohrne des ehemaligen Polens veräussert werden dürfen; II. Gerichtlich versicherte Schulden und andere Realverbindlichkeiten: Sind nicht eingetragen"}

oe1bu14525-029:
- {claim: "Abschrift eines Schreibens Johann Wilhelm Glencks, des Bau- und Ökonomierats des Fürsten zu Hohenlohe, an den König", verdict: supported, where: "Copia Allerdurchlauchtigster Großmächtigster König! ... Johann Wilhelm Glenck fürstl. Hohenlohischen Bau u Oeconomi Rath"}
- {claim: "dem königlichen Befehl gemäß, den Besitztitel der fürstlichen Güter Kopojno, Zagórów, Drzewce und anderer zu berichtigen, habe er alles getan, um die Urkunden beizubringen", verdict: supported, where: "allerhöchstem Befehl ... nach welchem der Titulus possessionis über die Hochfürstlich Hohenlohischen Güter Kopojno, Zagorowo, Drzewce, p. p. berichtiget werden soll, habe ich für die Beybringung derer Dokumente alles erforderliche gethan"}
- {claim: "er hofft, das bisherige Hindernis sei behoben und der Befehl könne binnen vier Wochen ausgeführt werden", verdict: supported, where: "ich hoffe daß der bißher obgewaltete Anstand gehoben, und Euer Majestäts allerhöchsten Befehle binnen 4 Wochen genauest vollzogen werden können"}
- {claim: "er bittet, alle strengen Verfügungen aufzuschieben", verdict: supported, where: "daher, alle ernstliche Verfügungen hiergegen aufzuhalten, ich allerunterthänigst bitte"}
- {claim: "der Befehl ist auf den 18. November datiert, sein Schreiben auf den 3. November", verdict: supported, where: "allerhöchstem Befehl vom 18 November; Breslau den 3ten Novbr 1800"}

oe1bu14525-030:
- {claim: "die Regierung zu Kalisz schreibt Glenck, dem Bau- und Ökonomierat des Fürsten zu Hohenlohe-Ingelfingen in Wrocław, in der Hypothekensache des Guts Swięcia", verdict: supported, where: "Jn Hypothequen Sachen des Gutes Swięcia ... Kalisch ... Königliche SüdPreuß. Regierung ... An den Fürstlich Hohenlohschen Bau und Oekonomie Rath Glenck zu Breslau"}
- {claim: "sie setzt eine Frist von 14 Tagen für das Hypothekenwesen dieses Guts und der dazugehörigen Güter Kopojno, Drzewce und Zagórów", verdict: supported, where: "wenn binnen 14 tagen das Hypothequen Wesen dieser und der übrigen dazu gehörigen Güter Kopojno, Drzewce und Zagorowo unv[?] berichtigt wird"}
- {claim: "mit der Ankündigung, dass dann unausbleiblich der Fiskus gegen den Fürsten tätig werden müsse", verdict: supported, where: "als dann unausbleiblich Fiscus gegen Euren Mandanten den Fürsten zu Hohenlohe Ingelfingen Liebden excitirt werden muß"}

oe1bu14525-031:
- {claim: "die Regierung zu Kalisz teilt dem Fürsten von Hohenlohe-Ingelfingen mit", verdict: supported, where: "Gegeben Kalisch den 28. Decbr 1798. Königl. Süd. Preussische Regierung ... An des Fürsten v. Hohenlohe Ingelfingen"}
- {claim: "da er das Gut Trąbczyn mit Zubehör vom Fiskus erworben hat, muss zuerst sein Besitztitel im Hypothekenbuch eingetragen werden", verdict: supported, where: "Da Euer Liebden das Guth Trąbczyn cum Attinentiis a Fisco acquirirt haben: so muß im Hypothequen Buch zuvorderst Titulus Possessionis auf selbigen eingetragen werden"}
- {claim: "dazu soll er binnen vier Wochen eine beglaubigte Abschrift des Urteils einreichen, mit dem das ganze Vermögen Anton von Prusimskis dem Fiskus zugesprochen wurde, und eine Bescheinigung des zuständigen Gerichts über die Rechtskraft", verdict: supported, where: "eine beglaubte Abschrift des Urtels, wodurch das gesammte Vermöegen des Anton von Prusimski dem Fisco zugesprochen worden nebst einem Attest des Judicii competentis: dass das Urtel die Rechtskraft beschritten hat, binnen 4. Wochen einzureichen"}

oe1bu14525-032:
- {claim: "ein Schreiben aus Kalisz, unterzeichnet Schultz, an die Oberamtsregierung zu Wrocław", verdict: supported, where: "Kalisch den 18ten Martz 1800. Schultz An Eine Königl. Hochlöbl. Ober Amts Regierung zu Breslau."}
- {claim: "es ersucht sie, dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen, wie am 24. September des Vorjahres erbeten, baldigst den Huldigungseid abzunehmen und das Protokoll darüber zu übersenden", verdict: supported, where: "er[?]suchen wir hierdurch ganz ergebenst, den regierenden Fürsten von Hohenlohe Ingelfingen, Friedrich Ludwig ad requisitionem vom 24ten Septbr. a. pr. das Homagium ... des baldigsten ... ableisten und uns die darüber aufgenommene Verhandlung gefälligst zukommen zu laßen"}

oe1bu14525-033:
- {claim: "Entwurf Glencks, im Namen des Fürsten zu Hohenlohe, in zwei Fassungen, die eine an die Kammer zu Poznań, die andere an die Regierung gerichtet", verdict: supported, where: "An die Königl. Kammer zu Posen ... Glenck; An die Regierung. Unterm xxx te xxx v. J.; ich bin jetzt Namens meines Herrn Durchl. beauftragt; blanks for the date and repeated phrases mark a draft"}
- {claim: "die Regierung zu Poznań habe die Berichtigung des Besitztitels der fürstlichen Güter binnen 14 Tagen gefordert und sonst mit dem Fiskus gedroht", verdict: supported, where: "hat schon eine K[önigl]. Reg[ierung]: zu Posen ... die Berichtigung des Tit. poss: von den fürstlichen Hohenlohischen Gütern ... abgefordert daß fiscus gegen eine längere Säumniß excitirt werden sollte ... wenn nicht innerhalb eines gesetzten 14 tägigen Frist solches geschehen seyn werde"}
- {claim: "der Fürst habe darauf die fehlenden Schenkungsurkunden im Original eingeschickt", verdict: supported, where: "worauf des Herrn Fürsten zu Hohenlohe Durchl. die hierzu gefehlten Original Donations Urkunden ... eingeschickt haben"}
- {claim: "nun bittet Glenck um die schleunige Abtretung aller fürstlichen Güter in Kujawien und bei Pszczew durch den Fiskus", verdict: supported, where: "Euer Majestät inständigst um die schleunge Resignation des Fisci über die gesammte Fürstl. G[?]üter in Cujavien und Betschen zu bitten"}

oe1bu14525-034:
- {claim: "die Regierung zu Poznań antwortet Glenck, dem Bau- und Ökonomierat des Fürsten zu Hohenlohe in Wrocław, auf seine Vorstellung vom 13. des Monats", verdict: supported, where: "auf Eure Vorstellung vom 13. huj. m. ... Gegeben Posen ... Königl. Südpreuß. Regierung ... An den Fürstl. Hohenlohschen Bau und Oeconomie Rath Glenck zu Breslau"}
- {claim: "der Fiskus hat die Güter Kolno und Kamionna bereits abgetreten", verdict: supported, where: "daß die Resignation der Güter Kolno und Kaemen von dem Fisco bereits geleistet worden ist"}
- {claim: "für die Güter von Pszczew ist der Termin auf den 22. März angesetzt", verdict: supported, where: "Zur Resignation der Betscher Güter steht Terminus auf den 22 März c. an"}
- {claim: "für die Güter in Kujawien ist die Abtretung noch gar nicht beantragt worden", verdict: supported, where: "Von den in Cujaviens belegenen ... Güter ist die Resignation des Fisci noch gar nicht nachgesucht worden"}
- {claim: "die Regierung erwartet, dass ein zugelassener Justizkommissar die Berichtigung des Besitztitels betreibt", verdict: supported, where: "es wird er wartet, daß die Berichtigung des Tituli possess. dieser Güter durch einen recipirten Justiz Commissar ... bewürkt werde"}

oe1bu14525-035:
- {claim: "die Kriegs- und Domänenkammer zu Poznań schreibt Glenck, dem Bau- und Ökonomierat des Fürsten von Hohenlohe-Ingelfingen in Wrocław, auf seinen Antrag vom 13. des Monats", verdict: supported, where: "auf Euren Antrag ... vom 13 d. M. ... Posen den 20 Februar 1802 Königl. SüdPreuß. Krieges- und Domanien Cammer ... An den Fürstlich Hohenlohischen Bau und Oekonomie Rath Hr Wilh. Glenck zu Breslau"}
- {claim: "der Kammerfiskal Beyer hat die nötigen Aufträge erhalten, um für den Fiskus alle Güter des Fürsten bei Pszczew und in Kujawien abzutreten", verdict: supported, where: "wegen Resignationsleistung sämtlicher Betscher und in Cujawien belegenen Güther des Fürsten ... daß der Cammerfiskal Beyer bereits die erforderlichen Aufträge zu dieser Resignationsleistung Fisci erhalten hat"}

oe1bu14525-036:
- {claim: "Johann Wilhelm Glenck, Bau- und Ökonomierat des Fürsten zu Hohenlohe, schreibt dem König", verdict: supported, where: "Allerdurchlauchtigster Großmächtigste König ... J. Wilhelm Glenck Fürstl. Hohenl. Bau und Oeconomie Rath"}
- {claim: "die Regierung zu Poznań habe die Berichtigung des Besitztitels der fürstlichen Güter als nötig und eilig gefordert", verdict: supported, where: "hat eine Königliche Regierung zu Posen die Berichtigung des Tituli possessionis von dem Fürstlich Hohenlohischen Gütern ... als nothwendig und eilig abgefordert"}
- {claim: "der Fürst habe die fehlenden Schenkungsurkunden im Original eingeschickt", verdict: supported, where: "worauf des Herrn Fürsten Durchlaucht die hierzu gefehlten Donazions Urkunden in Originali an Euer Mayestät eingeschikt haben"}
- {claim: "im Namen des Fürsten bittet er inständig um die schleunigste Abtretung aller fürstlichen Güter in Kujawien und bei Pszczew durch den Fiskus", verdict: supported, where: "ich bin jetzt Namens meines Herrn Durchlaucht beauftragt worden Euer Majestät inständigst um die schleunigste Resignazion des Fisci über die gesammte Fürstliche Güter in Cujavien und Betschen ... zu bitten"}

oe1bu14525-037:
- {claim: "die Regierung zu Poznań mahnt Glenck, den Bau- und Ökonomierat des Fürsten zu Hohenlohe-Ingelfingen", verdict: supported, where: "erinnern und befehlen Wir Euch ... Gegeben Posen ... Königliche Südpreußische Regierung ... An den Fürstlich Hohenlohe Ingelfingenschen Bau und Oeconomie = Rath Glenck"}
- {claim: "binnen einer letzten Frist von 14 Tagen die Verfügung vom 30. Oktober des Vorjahres über die Berichtigung des Besitztitels der Herrschaft Pszczew für den Fürsten zu erfüllen", verdict: supported, where: "der Verfügung vom 30ten October p. a. wegen Berichtigung des Tituli possessionis der Herr schaft Betsche für den regirenden Herrn Fürsten ... binnen endlichen 14 Tagen unfehlbar zu genügen"}

oe1bu14525-038:
- {claim: "Melzer schreibt einem Bau- und Ökonomierat", verdict: supported, where: "besonders hochzuehrender Herr Bau und Oeconomie-Rath! ... Melzer; the letter gives no name for him"}
- {claim: "im heutigen Termin zur Abtretung der Güter von Pszczew ist der Kammerfiskal wieder nicht erschienen, weil ihn die Kammer noch nicht ermächtigt hat", verdict: supported, where: "Zur Resignation der Betscher Güter ist in dem heutigem Termin der Cammerfiskal abermals nicht erschienen, weil er von der Cammer noch keine Autorisation erhalten"}
- {claim: "Melzer hat um einen neuen Termin gebeten, sieht aber kein Ende, solange die Kammer dem Fiskal keine klare Anweisung gibt", verdict: supported, where: "Ich habe nun zwar nochmals um die Ansetzung eines neuen Termins gebeten, aber die Sache wird kein Ende nehmen, wenn die Cammer nicht endlich einmahl dem Fiscal ganz ordentliche Anweisung giebt"}
- {claim: "er rät, der Fürst möge den Kammerpräsidenten von Harlem um Beschleunigung bitten", verdict: supported, where: "Wann Ihro hochfürstl. Durchlaucht geruhen möchten den Cammer Præsidenten v. Harlem um die Beschleunigung anzugehen"}
- {claim: "in einer Nachschrift meldet er, dass das Urteil zweiter Instanz in einer Sache mit dem Domkapitel abändernd ausgefallen und das Domkapitel abgewiesen worden ist", verdict: supported, where: "Verte In diesem Augenblick erhalte ich das Appellat Erkentniß in der Sache mit dem Dohm Capitel ... Es ist reformator ausgefallen, u das Dohm Capitel ... abgewiesen worden"}

oe1bu14525-039:
- {claim: "Abschrift eines Schreibens Hoyms an den Fürsten zu Hohenlohe-Ingelfingen", verdict: supported, where: "Durchlauchtigster Fürst ... Hoym Breslau den 30ten Julÿ 1796. ... concordat Originali, hoc attestor in fidem Sonnabend"}
- {claim: "der König hat ihm durch Kabinettsordre vom 23. des Monats Kamionna und Kolno, Trąbczyn und die übrigen Dörfer im Koniner Kreis sowie Brzyce in Kujawien erblich geschenkt", verdict: supported, where: "mittelst Cabinets Ordre vom 23ten dieses die Stadt Kamionna, nebst dem Marktflecken Kulm in Posenschen die Dörfer Trąbczyn, Szetlewek, Nowa wies, Łazy, Alt und Neu Laske, Osiny, Hauland Trąbczyński im Koninschen und des Dorf Brzyce ... erb und eigenthümlich von seiner Majestaet geschenkt erhalten"}
- {claim: "Hoym betreibt die Ausfertigung der Schenkungsurkunde", verdict: supported, where: "ich conferire, so eben mit dem Lehns Departement, um für die selben die Donations Urkunde bald expedirt zu sehen"}
- {claim: "da die Güter dem Hauptaufständischen von Prusimski gehörten, erkundigt er sich bei der Regierung zu Poznań nach den Schulden darauf", verdict: supported, where: "Da diese Güther einem Haupt Insurgenten von Prusimski gehöret haben, und es nöthig ist, die etwa auf diesen Gütern haftenden Schulden zu ... wissen ... so treffe ich gleichfals d nöthigen Einleitungen deßhalb bey der Regierung zu Posen"}
- {claim: "die Güter sollen jährlich mindestens 4000 Taler tragen", verdict: supported, where: "Nach den vorläufigen Nachrichten gewähren die so Güther wenigstens einen jährlichen Ertrag von 4000 Thalern"}
- {claim: "zur Veranschlagung empfiehlt er den Kammerrat Peucker in Fraustadt, der sie auch verkaufen könnte, falls der Fürst sie nicht behalten will", verdict: supported, where: "so weiß ich Denenselben keinen besseren Oeconomen, als den Königl. Cammer Rath Peucker zu Fraustadt in Vorschlag zu bezügen, der ... diese Güther an den Mann bringen würde, wenn zum Durchlaucht nicht geruhen sollten, solche für sich zu behalten"}
- {claim: "Oberst von Sanitz hat Prusimskis Güter im Kreis Wągrowiec erhalten", verdict: supported, where: "Der Herr Obrist von Sanitz hat die im Wegrowietzen Creise liegenden von Prusimskischen Güther Pawlow, Dzwonow, und Beerenbusch erhalten"}

oe1bu14525-040:
- {claim: "Abschrift eines königlichen Reskripts, unterzeichnet von Hoym, an die Kammern zu Poznań und Petrikau", verdict: supported, where: "Copia. Friedrich Wilhelm etc. ... Breslau den 20. Octbr. 1797. A. S. B. sign. Gr. v. Hoym An die p Kammer zu Posen und Petrikau."}
- {claim: "die Übergabe der dem Fürsten zu Hohenlohe verliehenen konfiszierten und geistlichen Güter sei nur ein oberflächliches Zeremoniell gewesen", verdict: supported, where: "bringen Wir in Erfahrung, daß die vollführte Uebergabe blos in einem oberflächlichen Ceremoniell bestanden hat; Sowohl in den des Fürsten Liebden verliehenen confiscirten adelichen als auch geistlichen Gütern"}
- {claim: "Leute mit ungeprüften, zum Teil angeblich falschen Pfand- und Pachtverträgen säßen auf den Gütern", verdict: supported, where: "sollen Menschen sitzen welche zwar Pfand oder PachtsContracte aufgewiesen haben wegen welcher jedoch bey der Uebergabe gar nicht gründlich untersucht worden ...; Es soll sogar schon erwiesen seyn, daß einige dieser Personen falsche Pfanden Contracte haben"}
- {claim: "die Kammern sollen die Ansprüche rasch prüfen, die Güter den Bevollmächtigten des Fürsten zur freien Bewirtschaftung übergeben, Streit möglichst gütlich beilegen und nötige Prozesse auf kürzestem Weg führen lassen", verdict: supported, where: "die verschiedenen Anforderungen auf diese Güter baldigst zu prüfen ... den fürstlichen Mandatariis zur alleinigen Disposition und freyen bewirthschaftung des Fürsten übergeben zu lassen, alle strittigen Punkte so viel nur immer möglich, in Güte beizulegen ... die kürzesten wege einzuschlagen ... den Prozeß führen zu lassen"}
- {claim: "auch sollen sie die Abgaben und Kompetenzgelder, die der Fürst zu zahlen hat, schleunigst festsetzen", verdict: supported, where: "die Abgaben und die Competenz Gelder bestimmen können, welche des Fürsten zu Hohenlohe liebden zu entrichten haben ... so habt Ihr aufs schleune ste solche auszumitteln"}

oe1bu14525-041:
- {claim: "beglaubigte Abschrift eines Schreibens Hoyms an den Fürsten zu Hohenlohe-Ingelfingen vom 3. Oktober 1797", verdict: supported, where: "Durchlauchtiger Fürst ... Breslau den 3ten Octobr. 1797. ... Hoym Daß vorausstehende Abschrift mit dem Original durchgehends gleichlautend ... attestiret ... Sonnabend"}
- {claim: "die Unruhe des Fürsten wegen der Übergabe seiner südpreußischen Güter beruhe auf einem Missverständnis", verdict: supported, where: "wegen dero SüdPreussischen Güther Angelegenheit ... Blosse Mißverstand liegt zum Grunde, wenn dieselben wegen deren Uebergabe auch nur im mindesten beunruhiget worden"}
- {claim: "Hoym legt seine Verfügungen an die Kammern zu Poznań und Petrikau bei, die Güter baldigst zu übernehmen und zu übergeben", verdict: supported, where: "Abschrift, der, an die p. Cammer zu Posen und Petrikau erlaßnen ... Verfügungen vom 26ten v. M. hierbeyfügen, um ... zu Ueberzeugen, daß ich die baldigste Abnahme, und Uebergabe sämmtlicher Güter gewissenst verfügt habe"}
- {claim: "die geistlichen Besitzer säßen seit dem 1. Juni 1796 auf Rechnung des Fiskus und müssten räumen, sobald sie ihre Kompetenz erhielten", verdict: supported, where: "die bisherigen geistlichen Besitzer sitzen bereits seit dem 1sten Juny 1796 nicht mehr für ihre Rechnung sondern für Rechnung des Fisci ... So bald sie ihre principienmäßig Competenz erhalten, müssen sie die Güther mit jedem Tage räumen"}
- {claim: "der Bischof von Kujawien sei nur noch in Wieniec und Wolica, weil der Fürst ihn dort lassen wolle", verdict: supported, where: "Es hätte daher die Bischoff von Cujavien auch die Güther Wieniec und Wolica räumen müssen, wenn Euer durch laucht ihn nicht, solche noch zu belassen, Sich geneigt erklärt hätte"}
- {claim: "einen Pächter, der nicht gütlich weiche, möge der Fürst lieber bis Juni 1798 gegen das Pachtgeld lassen, sonst müsse die königliche Kasse ihn entschädigen", verdict: supported, where: "der Pächter wohl in Güthe ... zur Räumung zu disponiren seyn Kann dieß ohne Dero Nachtheil nicht bewirkt werden, so werde Euer Durchlaucht selbst geneigt seyn ihn bis Juny 1798 lieber in der Pacht zu lassen, und dagegen das Pachtgeld in Empfang zu nehmen, weil sonst die Königl. Casse ... den Pächter schadloß halten müsste"}

oe1bu14525-042:
- {claim: "die Regierung zu Kalisz schreibt dem Fürsten von Hohenlohe-Ingelfingen", verdict: supported, where: "Gegeben Kalisch den 28. Decbr: 1798. Königl. Süd preußl. Regierung ... An des Fürsten von Hohenlohe Ingelfingen"}
- {claim: "zur vollständigen Berichtigung seines Besitztitels für das Gut Szetlewek soll er binnen vier Wochen eine beglaubigte Abschrift des Konfiskationsurteils gegen Anton von Prusimski samt einer Bescheinigung seiner Rechtskraft einreichen", verdict: supported, where: "zur vollständigen Berichtigung des Tituli possessionis von dem Gute Szetlewek eine vidimirte Abschrifft des Anton v. Prusimskischen Confiscations Urtels cum attestato der Rechtskräftigkeit deßelben, binnen 4 Wochen anhero ein zureichen"}

oe1bu14525-043:
- {claim: "Abschrift eines Bescheids der Regierung zu Poznań an den Fürsten von Hohenlohe-Ingelfingen auf sein Gesuch vom 31. Januar", verdict: supported, where: "Copia ... Auf daß von Ewr Liebden in Sachen Fisci contra von Prusimski untern 31ten Januar c. eingereichte Gesuch ... Gegeben. Posen den 4ten Febr 1799 Danckelmann ... An des Fürsten von Hohenlohe Ingelfingen Liebden"}
- {claim: "er hatte für die Berichtigung seines Besitztitels an den Gütern von Trąbczyn eine beglaubigte Abschrift des Konfiskationsurteils gegen von Prusimski mit Rechtskraftbescheinigung erbeten", verdict: supported, where: "wegen einen beglaubten Abschrift des wieder den eben erwähnten von Prusimski abgefaßten Confiscations Erkentnißes mit den Attest der Rechtskraft versehen, zum Behuf der berichtigung des Tituli Possessionis der denselben verliehenen Trąbczyner Güter"}
- {claim: "das Urteil sei nicht in Poznań, sondern von der Regierung zu Toruń gefällt worden, und er müsse sich dorthin wenden", verdict: supported, where: "daß das Confiscations Erkentniß gegen den mehr erwähnten von Prusimski nicht bey unserer hiesigen, sondern bey unserer Regierung zu Thorn abgefaßt worden, Sie sich daher deshalb bey leztern zu wenden haben"}
- {claim: "seine Anlage erhält er im Original zurück", verdict: supported, where: "unter Remission der Original Anlage"}


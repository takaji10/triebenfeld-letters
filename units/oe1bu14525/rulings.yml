    "5": [betsche, swiechocin, stoki, lowyn, glazewo, zagorowo, swiatniki, kopojno,
          olesnica, drzewce, gradzyn, wrabczyn, wieniec, wolica, skokum]
    "6": [betsche, zagorowo, wieniec, stolun, kuligowo, szarcz, silna, zielomysl,
          swiecia, konty, szedlemin, batkowo]

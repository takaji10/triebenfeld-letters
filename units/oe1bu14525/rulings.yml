# Editorial rulings for Oe 1 Bü 14525.
#
# Keyed by the archive's own document number, which is what letter_id stays.
# Nothing here is derived: each entry is a decision taken against evidence and
# recorded so a rebuild reproduces it. Start empty and fill in from the review
# sheets in review/ as you work through them.

places:
  # Place of writing, where the dateline is absent, illegible or misleading.
  # A trailing [?] marks a reading that is probable rather than settled.
  #   "12": Berlin
  #
  # Ruled for every document, as in 14526, because the parser cannot do it here:
  # these are certified copies, and their pages carry two or three places each -
  # where the grant was given (Berlin 1797), where the copy was attested, where
  # the estates lie. What is recorded is where the instrument AS IT STANDS was
  # written: for a certified copy, the place of its attestation, which is also
  # the date the record carries. Left empty where the document names none:
  # 13, a valuation whose only place is the Marienwerder principles it was
  # calculated by, and 24, an eight-line fragment with no dateline.
  overrides:
    "1": Kalisch

title: >-
  The delivery of possession by which, on 4 November 1771, a sworn
  commissioner handed the Lusnia wood and the twelve Olęder settlers living
  in it to Stanisław Ścibor Chełmski of Łukomia, on the strength of
  judgments won against Antoni Prusimski; the commission of 1775 later set
  it aside.
title_de: >-

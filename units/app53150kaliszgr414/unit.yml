# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One document on leaves 402 and 403 of a book of the castle court of Kalisz
  for 1771: the original of a delivery of possession (traditio), sewn into
  the book, with the record of its being brought in. Latin, with the act of
  delivery itself in Polish. On 4 November 1771, in the Lusnia wood, the
  sworn commissioner of the provinces of Poznań and Kalisz, Wawrzyniec
  Wstowski, acting for Stanisław Ścibor Chełmski, heir of Łukomia, recites
  the judgments the delivery rests on (a condemnation of 1761, decrees of
  the Crown Tribunal of 1766, 1767 and 1768 ordering the boundary between
  Łukom and Trąbczyn to be drawn, and a third condemnation of 1770 against
  Antoni Prusimski, Starost of Niszczewice, for contravention) and hands
  over to Chełmski the wood called Lusnia with the Olęder settlement in it:
  a tavern house with a new stable and twelve settlers, named. No one
  objects; the settlers are told to obey Chełmski. On 9 November the act was
  brought to the castle court at Kalisz for entry.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A delivery of possession (traditio) of 1771 in the Latin of the Polish
  courts, with the act itself in Polish. The English is the editor's own
  translation, with the editor's notes. "Traditio" is the putting of a
  winning party into possession by an officer; "condemnatio" and "banitio" a
  judgment by default and the outlawry that followed; "condescensio" the
  court's going onto the ground; "jurevincens" the party that has won at
  law; "olędrzy", "Holendi" settlers under Olęder law. Trąpczyn is Trąbczyn.

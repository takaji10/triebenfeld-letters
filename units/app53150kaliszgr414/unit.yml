  1771 den Wald Lusnia und die zwölf darin wohnenden Olęder-Siedler an
  Stanisław Ścibor Chełmski von Łukomia übergab, gestützt auf Urteile gegen
  Antoni Prusimski; die Kommission von 1775 hob sie später auf.

app53150kaliszgr414-001: "Protokoll einer Besitzeinweisung, vorgenommen am 4. November 1771 im Wald Lusnia und am 9. November in die Akten des Burggerichts Kalisz eingetragen; das Original ist in das Buch eingenäht. Der vereidigte Kommissar der Woiwodschaften Posen und Kalisz, Wawrzyniec Wstowski, handelt auf Verlangen von Stanisław Ścibor Chełmski, Erbherrn von Łukomia, der vor Gericht obsiegt hat. Er führt die Urteile an, auf die sich die Einweisung stützt: eine Verurteilung von 1761, Dekrete des Krontribunals von 1766, 1767 und 1768, nach denen die Güter Łukom und Trąbczyn abzugrenzen waren, und eine dritte Verurteilung von 1770 gegen Antoni Prusimski, Starost von Niszczewice, wegen Zuwiderhandlung. Im Beisein dreier Adliger, des Trąbczyner Verwalters Józef Jaroszewski und eines Gerichtsboten übergibt er Chełmski den Kiefern- und Laubwald Lusnia als von alters zu Łukomia gehörig, samt der vor nicht langer Zeit darin gegründeten Olęder-Siedlung: ein Schankhaus mit neuem Stall, ohne Wirt, und zwölf mit Namen genannte Olęder. Niemand widerspricht; ein Inventar wird aufgenommen, Chełmski wird im ruhigen Besitz belassen, und den Olędern wird auferlegt, ihm Gehorsam zu leisten."

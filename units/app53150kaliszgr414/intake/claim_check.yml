app53150kaliszgr414-001:
- {claim: "Protokoll einer Besitzeinweisung, vorgenommen am 4. November 1771 im Wald Lusnia und am 9. November in die Akten des Burggerichts Kalisz eingetragen; das Original ist in das Buch eingenäht", verdict: supported, where: "p. 1: Actum in sylva seu Borra Lusnie ... Feria Secunda post Festum Omnium Sanctorum proxima Anno Domini Millesimo Septingentesimo Septuagesimo primo; p. 3: In castro Calissiensi Sabbatho ante Festum Sancti Martini Pontificis proximo Anno Domini 1771 ... originale vero ejusdam Traditionis ... in Protocollon Insutum est"}
- {claim: "der vereidigte Kommissar der Woiwodschaften Posen und Kalisz, Wawrzyniec Wstowski, handelt auf Verlangen von Stanisław Ścibor Chełmski, Erbherrn von Łukomia, der vor Gericht obsiegt hat", verdict: supported, where: "p. 1: ad instantiam et Officiosam requisitionem Magnifici Stanislai Scibór Chełmski Bonorum Łukomia cum attinentiis Haeredis et jurevincentis; p. 2: Laurentius Wstowski Commissarius Palatinatuum Posnaniensis et Calisiensis Generalis Juratus"}
- {claim: "eine Verurteilung von 1761, Dekrete des Krontribunals von 1766, 1767 und 1768, nach denen die Güter Łukom und Trąbczyn abzugrenzen waren", verdict: supported, where: "p. 1: 1ma quidem Feria 2da post Festum Sancti Bartholomei Apostoli in fundo Controverso Anno Domini 1761 ... Decreto Condescensionis Tribunalitii ... 1766 ... Bonorae Łukom cum Bonis Trąpczyn dislimitari ... 1767 ... 1768"}
- {claim: "und eine dritte Verurteilung von 1770 gegen Antoni Prusimski, Starost von Niszczewice, wegen Zuwiderhandlung", verdict: supported, where: "p. 2: 3tiae demum in termino Condescensionis Feria 2da post Dominicae cantate anno elapso 1770 ... super Magnifico Antonio Prusimski Bonorum Trąpczyno et aliorum Haerede ratione Contraventionis Decreto superius specificato; p. 1-2: Capitaneum Niszczeviensem"}
- {claim: "im Beisein dreier Adliger, des Trąbczyner Verwalters Józef Jaroszewski und eines Gerichtsboten", verdict: supported, where: "p. 1: in Praesentia Generosorum ac Nobilium Caietani Grabski Antonii Parentis et Constantini Filii Fulwarskie, atque Josephi Jaroszewski Economi Trąpczynensis nec non Ministerialis Regni Generalis providi Joannis Bykierski"}
- {claim: "übergibt er Chełmski den Kiefern- und Laubwald Lusnia als von alters zu Łukomia gehörig, samt der vor nicht langer Zeit darin gegründeten Olęder-Siedlung", verdict: supported, where: "p. 2: oddaje się ... Panu Chełmskiemu bór i las Luśnię zwany i w nim ufundowane niezbyt dawnym czasem Olendry ... do rzeczonych Dóbr Łukomia ex Antiquo należący"}
- {claim: "ein Schankhaus mit neuem Stall, ohne Wirt, und zwölf mit Namen genannte Olęder", verdict: supported, where: "p. 2: chałupa oddaje się dobra dla szynku trunków wystawiona z stajnią nową bez gospodarza, Item poddają się Olendry, jako to Michał Kinos ... Wawrzyń Welner (twelve names)"}
- {claim: "niemand widerspricht; ein Inventar wird aufgenommen, Chełmski wird im ruhigen Besitz belassen, und den Olędern wird auferlegt, ihm Gehorsam zu leisten", verdict: supported, where: "p. 2: Qua itaque peracta nemine impugnante traditione ac conscripto inventorio Eundem Magnificum Chełmski in Pacifica possesione Eorundem fundorum ... reliquit et suprascriptis Hollendis ... obedientiam Magnifico Chełmski praestandam indixit injunxitque"}

# What the holding is, in a paragraph: the opening of the translator's and
# the summariser's prompts. The reader sees the holding's own page instead,
# written in about.md beside this file (docs/NEW_UNIT.md).
description: >-
  A collection of copies of letters, documents and verses of 1697 to 1798,
  made mostly by Stanisław Przyłęcki (1805-1866), the Lwów bibliographer
  and autograph collector whose manuscript legacy the Ossolineum bought in
  1869; the catalogue record carries no description of the contents beyond
  the title. The scans read so far (leaves 0033-0062 of 30) are the
  Przyłęcki Kościuszko dossier: the codex's own index of letters and lists
  of people, a July-1794 dossier of the uprising (letters to the
  Naczelnik, an officers' roster of the camp at Mokotów, a Warsaw police
  protocol, a patent signed Kościuszko), the Gutowski file of the
  "Korpus Towarzystwa", a name-day poem for Kościuszko of 1792, a bishop's
  letter of 1796, and the capstone, the copy of Kościuszko's letter of
  3 September 1798 from Paris - the "grzeczna odpowiedź" the Polish
  Biographical Dictionary's entry on Antoni Prusimski records, which the
  codex preserves and nothing published carries. The one document in the
  edition so far is that letter, on page 145 of the codex; the rest of the
  sweep is logged in scratch/ and waits on the editor's rulings.

# Passed to the translator with every document of this holding. Facts about
# the source that change how it should be read, not instructions about style.
translation_note: >-
  A nineteenth-century COPY, in the hand of the collector Stanisław
  Przyłęcki, of a letter Kościuszko wrote in Polish; the original is not
  in the edition and is not known to survive. The copyist's orthography
  stands as written (twóy, iak, Żałuię, adressowany, narodowey,
  pomyślnieyszych, przyiaźń); the expansions in brackets are superscript
  abbreviations (Sz[anowny] Ob[ywatel]u, P[aryża]). The superscript-expansion
  reading is the editor's. The caution clause toward the end ("Dziś ...
  nie narażać") is a single long sentence whose parts are best read
  together.


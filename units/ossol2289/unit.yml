# One archival unit. Everything the pipeline needs to know about where this
# material came from and how its files are named.

slug: ossol2289
ref: B. Ossol. rkp. 2289 II
archive: Zakład Narodowy im. Ossolińskich (Ossolineum), Wrocław
# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as original_title.
title: >-
  A collection of copies, "Listy, dokumenty i wiersze z lat 1697-1798",
  made mostly by the Lwów bibliographer and autograph collector Stanisław
  Przyłęcki (1805-1866) and bought by the Ossolineum with his manuscript
  legacy in 1869; the one document transcribed so far is the copy of
  Kościuszko's letter of 3 September 1798, written from Paris, to the
  émigré whose August letter had reached him - probably the insurgent
  Antoni Prusimski, whom Kościuszko knew only from correspondence.
title_de: >-
  Eine Sammlung von Abschriften, "Listy, dokumenty i wiersze z lat
  1697-1798", überwiegend von dem Lemberger Bibliografen und Autographen
  sammler Stanisław Przyłęcki (1805-1866) geschrieben und 1869 mit seinem
  handschriftlichen Nachlass vom Ossolineum gekauft; das bislang einzige
  transkribierte Dokument ist die Abschrift von Kościuszkos Brief vom
  3. September 1798 aus Paris an den Emigranten, dessen August-Brief ihn
  erreicht hatte - wahrscheinlich den Insurgenten Antoni Prusimski, den
  Kościuszko nur aus der Korrespondenz kannte.

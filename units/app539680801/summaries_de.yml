app539680801-001: "Abschrift dreier zusammengehöriger Stücke von 1805 und 1806. Erstens die Generalvollmacht des Fürsten zu Hohenlohe-Ingelfingen für den Kriegs- und Forstrat von Triebenfeld, ausgestellt im Guhrwitzer Justizamt bei Breslau am 19. Februar 1805, für alle Angelegenheiten seiner Güter Zagórów, Witów und Trąbczyn; das Patrimonialgericht auf Trąbczyn beglaubigt die Abschrift am 21. März 1806. Zweitens der Konsens der Kriegs- und Domänenkammer in Kalisch vom 28. Januar 1806: Der Fürst darf Vorwerke der Herrschaften Zagórów und Trąbczyn parzellieren, Oleśnica und Szetlewek vererbpachten und die Dienste der Untertanen in Geldzins verwandeln, unter vier Bedingungen. Drittens der Erbpachtvertrag, dessen Anfang fehlt: Der Fürst überlässt durch Triebenfeld achtzehn namentlich genannten Einsassen 100 Magdeburger Hufen Wald des Gutes Drzewce auf ewige Zeiten, ohne Einkaufsgeld und mit vier Freijahren bis Weihnachten 1808, danach gegen 30 Reichstaler Erbzins je Hufe, zusammen 3000 Reichstaler jährlich; die Hälfte des Zinses ist ablösbar. Das Gericht fertigt den Vertrag in Mariantów am 21. März 1806 aus."

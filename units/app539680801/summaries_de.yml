app539680801-001: "Abschrift der Generalvollmacht des Fürsten zu Hohenlohe-Ingelfingen für den Kriegs- und Forstrat von Triebenfeld, ausgestellt im Guhrwitzer Justizamt bei Breslau am 19. Februar 1805. Triebenfeld darf den Fürsten in allen Angelegenheiten seiner Güter Zagórów, Witów und Trąbczyn im Kalischer Departement vertreten, sie mögen Parzellierung, Verkauf, Verpachtung oder Verpfändung betreffen: bei der Kammer und der Regierung in Kalisch Anträge stellen, sich mit den Pächtern auseinandersetzen, Gelder zahlen und empfangen und den Beamten der Güter Befehle erteilen und sie suspendieren. Der Fürst verspricht, alles zu genehmigen und ihm die Kosten zu erstatten. Das Justizamt bezeugt am selben Tag seine Unterschrift; das Patrimonialgericht auf Trąbczyn beglaubigt die Abschrift am 21. März 1806."
app539680801-002: "Abschrift des Konsenses, den die Südpreußische Kriegs- und Domänenkammer in Kalisch am 28. Januar 1806 im Namen des Königs erteilt, auf Kabinettsordres vom 22. Oktober und 7. Dezember des Vorjahres. Der Fürst zu Hohenlohe-Ingelfingen darf die Vorwerke Drzewce, Kopojno, Świątniki, Święcia und Broniki der Herrschaft Zagórów sowie Nowa Wieś, Przybysław, Stara Huta und einen Teil von Trąbczyn parzellieren, Oleśnica und Szetlewek vererbpachten und die Dienste aller Untertanen in einen festen Geldzins verwandeln; einen Teil von Trąbczyn, die Grundstücke in Mariantów und einen Teil des Forstes behält er zurück. Vier Bedingungen: Die Entschädigung der Untertanen für ihre Hütungs- und Holzungsrechte ist festzusetzen; keine Bauernstelle darf eingehen; die staatlichen Abgaben bleiben und werden im Hypothekenbuch gesichert; die Holzungsrechte des Klosters und der Propstei Ląd werden im Hypothekenbuch gesichert, und reichen die vorbehaltenen Forsten für die Holzungsrechte des Domänenamts Ratyń nicht aus, ist eine jährliche Entschädigung festzusetzen."
app539680801-003: "Abschrift eines Erbpachtvertrags, dessen Anfang fehlt. Der Fürst zu Hohenlohe-Ingelfingen überlässt durch seinen Generalbevollmächtigten von Triebenfeld achtzehn namentlich genannten Einsassen 100 Magdeburger Hufen Wald seines Gutes Drzewce auf ewige Zeiten; sechzehn nehmen je 5 Hufen, zwei je 10. Einkaufsgeld wird nicht gezahlt, weil das Land erst zu roden ist; zum Roden gelten vier Freijahre bis Weihnachten 1808. Danach beträgt der Erbzins 30 Reichstaler je Hufe, zusammen 3000 Reichstaler jährlich, zahlbar zu Johanni und zu Weihnachten; die Hälfte ist ablösbar. Bei jedem Verkauf fällt der zehnte Groschen an die Herrschaft. Die Erbpächter sind frei von Erbuntertänigkeit und Hofdiensten, unterstehen aber der Gerichtsbarkeit der Herrschaft, müssen Bier und Branntwein von ihr nehmen und haften solidarisch. Die Gemeinde erhält 21 Morgen zinsfrei für Schullehrer, Schulzen und Kirchhof. Elf der achtzehn unterzeichnen mit drei Kreuzen. Das Patrimonialgericht fertigt den Vertrag in Mariantów am 21. März 1806 aus."

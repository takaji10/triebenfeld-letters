# Editorial rulings for 53/968/0/-/801 (APP).
#
# Three documents, at the editor's ruling of 2026-10-05: the power of
# attorney (1), the consent of the chamber (2) and the lease contract (3).
# The holding was first built as one document, a deed package like APP
# 53/71/0/-/57; intake/split_documents.py records the division. The archive
# numbers nothing but the pages, so the documents are numbered in the order
# they are copied. The cover (0035) is front matter. Established 2026-10-05.

places:
  # Place of writing, from each document's own text: the power of attorney
  # was given "im Guhrwitzschen Justiz Amte bei Breslau", the consent "zu
  # Kalisch", and the contract was engrossed by the court at Mariantów.
  overrides:
    "1": Guhrwitz
    "2": Kalisch
    "3": Marianton

dates:
  # [year, month, day, precision]; read off each document.
  read:
    "1": [1805, 2, 19, "day"]      # "den 19ten Februar 1805"; the copy certified "Marianten den 21. Maerz 1806"
    "2": [1806, 1, 28, "day"]      # "zu Kalisch den 28. Januar 1806"
    # The engrossment, "Mariantów d. 21 Mäerz 1806". The contract's opening,
    # with the day it was recorded, is not among the pages; its free years
    # (§ VI, from "Weynachten dieses Jahres" to Christmas 1808) point to 1804.
    "3": [1806, 3, 21, "day"]
  supplied: {}
  twin: {}
  inferred: {}
  no_date: []

documents:
  doc_type:
    "1": power_of_attorney
    "2": royal_consent
    "3": contract

  language: {}
  duplicate_of: {}
  split_note: {}

  relations:
    "1":
      - kind: supplements
        target: "3"
        note: "The contract calls Triebenfeld 'durch beiliegende Vollmacht legitimiert'; the court certified this copy of the power of attorney on 21 March 1806, the day it engrossed the contract."
    "2":
      - kind: supplements
        target: "3"
        note: "Copied between the power of attorney and the contract. The consent allows the parcelling of the manor farm of Drzewce, a hundred Hufen of whose forest the contract lets."

  # The estate each document is ABOUT, as slugs from reference/places.yml.
  estates:
    "1": [zagorowo, witow, trabczyn]
    "2": [zagorowo, trabczyn]
    "3": [drzewce, zagorowo]

damage:
  letters: []

rough:
  letters: []

pages:
  # The editor's transcription is by paragraph, not by line.
  by_paragraph: ["0036_a", "0037_a", "0038_a", "0039_a", "0040_a", "0041_a",
                 "0042_a", "0043_a", "0044_a", "0045_a", "0046_a", "0047_a",
                 "0048_a", "0049_a", "0050_a", "0051_a"]

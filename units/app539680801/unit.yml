# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  Copies made about 1930 by Albert Breyer, a historian of the German
  settlements in central Poland, of three papers of 1805 and 1806 on the
  breaking up of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen's estates
  of Zagórów and Trąbczyn: his power of attorney for Peter Friedrich von
  Triebenfeld, the consent of the Prussian chamber at Kalisz to the
  parcelling, and the contract by which eighteen settlers took a hundred
  Hufen of the Drzewce forest in hereditary lease.
title_de: >-
  Abschriften, die Albert Breyer, ein Erforscher der deutschen Siedlungen in
  Mittelpolen, um 1930 von drei Schriftstücken der Jahre 1805 und 1806 über
  die Aufteilung der Güter Zagórów und Trąbczyn des Fürsten Friedrich Ludwig
  zu Hohenlohe-Ingelfingen anfertigte: dessen Vollmacht für Peter Friedrich
  von Triebenfeld, die Genehmigung der preußischen Kammer in Kalisch zur
  Parzellierung und der Vertrag, mit dem achtzehn Siedler hundert Hufen des
  Waldes von Drzewce in Erbpacht nahmen.

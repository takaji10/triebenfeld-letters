# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Sixteen pages in one modern hand, from the papers of Albert Breyer
  (1889-1939), a teacher and historian of the German settlements in central
  Poland; the archive dates them about 1930. They are his copies of three
  papers of 1805 and 1806 that belong together, and they count here as one
  document. The first is a copy of the general power of attorney that Prince
  Friedrich Ludwig of Hohenlohe-Ingelfingen gave the War and Forest
  Councillor Peter Friedrich August von Triebenfeld at the Guhrwitz justice
  office near Breslau on 19 February 1805, for all business of his estates of
  Zagórów, Witów and Trąbczyn in the Kalisz department of South Prussia,
  whether parcelling, sale, lease or mortgage; the Hohenlohe patrimonial
  court on Trąbczyn certified the copy at Mariantów on 21 March 1806. The
  second is the consent of the South Prussian War and Domains Chamber, given
  in the King's name at Kalisz on 28 January 1806 on cabinet orders of 22
  October and 7 December 1805: the Prince may parcel out the manor farms of
  Drzewce, Kopojno, Świątniki, Święcia and Broniki in the lordship of Zagórów
  and of Nowa Wieś, Przybysław, Stara Huta and part of Trąbczyn in the
  lordship of Trąbczyn, let Oleśnica and Szetlewek in hereditary lease, and
  turn the services of all his subjects into a fixed money rent, on four
  conditions; he keeps back 781 Morgen at Trąbczyn and Mariantów and 4947
  Morgen of forest. The third is the hereditary-lease contract by which the
  Prince, through Triebenfeld, lets a hundred Magdeburg Hufen of the forest
  of his estate of Drzewce to eighteen named settlers for ever, in nineteen
  paragraphs: no entry money, four rent-free years to clear the land, then
  30 Reichsthaler a Hufe each year, 3000 in all, half of it redeemable. The
  copy begins in the middle of the list of the parties, so the contract's
  opening and the day it was recorded are missing; the court engrossed it at
  Mariantów on 21 March 1806. Eleven of the eighteen signed with three
  crosses.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A twentieth-century copy of court and chancery papers of 1805 and 1806, not
  letters: formulaic legal German with Latin tags that belong to the register
  and are kept (Copia, L. S., testante Protocollo de hodierno, in fidem
  publicam, Subscriptis, titulum possessionis, Laudemium, Dominium, a. u. s.
  for actum ut supra, et Consorten). The contract is numbered in paragraphs
  (§ I to § XIX); keep the numbering. The copy opens in the middle of the
  contract's list of parties ("Gute Olesnica. 17. Johann Luckow ..."): the
  beginning is missing, not garbled. The copyist's spellings of places are
  his own and are one place each: Zagurowo is Zagórów, Trompczyn, Trąpczyn
  and Trąbczyn are Trąbczyn, Wittow is Witów, Marianten and Mariantów are
  Mariantów, Drzewiec is Drzewce, Lond is the abbey of Ląd, Szedlewek is
  Szetlewek, Kalisch is Kalisz. "□ Ruten" is square rods (the page has the square sign for "Quadrat"). A
  Hufe Magdeburgisch is a measure of land of thirty Morgen; "rth." is the
  Reichsthaler. "Regierung" is the provincial court of justice at Kalisz,
  "Kammer" the War and Domains Chamber, the provincial administration.
  "liebden" in the consent is the King's form of address for a prince ("Seiner
  Liebden"). In the list of signatures "xxx" stands for the three crosses of
  a party who could not write; "heißt" (is called) introduces the name the
  clerk wrote beside the crosses, and a dash repeats it. "(—)" before a name
  marks a signature in the copy. A word followed by [?] is one the
  transcriber was unsure of.

    Berlin, 11 May 1819. No. 2,434 B

    To Mr d'Alopeus

    Envoy Extraordinary and Minister Plenipotentiary of Russia at Berlin

    The undersigned, Minister of State and of the Cabinet of His Majesty the King of Prussia, has received the note and the memorial which Mr d'Alopeus, Envoy Extraordinary and Minister Plenipotentiary of His Majesty the Emperor of All the Russias, did him the honour of addressing to him under date of 20 February of this year, on the claims of Countess Miączyńska, née Prusimska.

    The undersigned thinks it right first to retrace in a few words the state of the question.

    The Starost Prusimski took part in 1795 in the insurrection of the Poles against Russia and Prussia. After the insurrection had been put down he fled; his estates were confiscated by virtue of a judicial sentence, and the King having disposed of them in favour of various individuals, these donees borrowed on these landed estates, which served as mortgage security for these debts.

    Prusimski died in 1803 in a foreign country without having been able to obtain reinstatement in his possessions; he left a daughter, Countess Miączyńska, as his heiress. After the Peace of Tilsit she was put back in possession of her lands by the Government of the Grand Duchy of Warsaw, and since the dissolution of that state the general amnesty pronounced in the Act of the Congress of Vienna has guaranteed her the enjoyment of her estates.

    Today Countess Miączyńska is not content with having recovered her lands in the state in which the donees left them. She asks that the debts which rest on these estates be extinguished.

    A subject at once of the Emperor of Russia, by the lands she owns in the Kingdom of Poland, and of the King, by those which belong to her in the Grand Duchy of

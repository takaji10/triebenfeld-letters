    Poznań, she had already applied directly to the Prussian Government; but reasons of justice and equity had caused her request to be rejected.

    These reasons are still the same. The undersigned has had this affair examined anew, and he has taken into mature consideration the arguments put forward in favour of Countess Miączyńska in the memorial delivered by Mr d'Alopeus. But as these arguments rest in great part on facts which the Countess has presented with more art than truth, this memorial has not been able to weaken the reasoning on which the decision of the Prussian tribunals was founded, and is founded still.

    This reasoning is set out in all its force and with the greatest evidence in the memorial which the undersigned has the honour to communicate herewith to Mr d'Alopeus, and he does not doubt that, having read it, this minister will find that the ruling of the Prussian authorities is founded in law and in reason.

    The recommendation of the Cabinet of Petersburg laid upon the undersigned the obligation of bringing to the new examination of this affair as much care as impartiality. Having acquitted himself of this duty, he regrets indeed that the result of this examination is not such as Russia desired in favour of Countess Miączyńska; but the love of justice which animates His Majesty the Emperor as it animates the King, and which is one of the finest bonds of the union of Prussia and Russia, gives him the sweet and intimate conviction that the Russian Government will recognise the force of the motives which have dictated to Prussia a fresh refusal.

    The undersigned takes this occasion to renew to Mr d'Alopeus the assurance of his high consideration.

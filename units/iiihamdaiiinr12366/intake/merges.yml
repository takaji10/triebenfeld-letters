summaries:
  '1':
    en: >-
      The Russian envoy at Berlin, Alopeus, sends the Prussian foreign minister Count Bernstorff, on
      the orders of his court, an enclosed report of the Viceroy of the Kingdom of Poland on a claim
      that Countess Michalina Miączyńska, born Prusimska, makes against the Prussian government, and
      supports it. The report, he writes, contains arguments so conclusive that he has nothing to
      add. He asks Bernstorff to recommend the Countess's case to the authorities who will have to
      decide it. The enclosed copy of the report sets out her claim as the commissioners for the
      liquidation of the former Duchy of Warsaw stated it. Her hereditary estates were confiscated
      from her father, the Starost Prusimski, by the Prussian government in 1796 and given to Prince
      Hohenlohe-Ingelfingen and General Sanitz; a decision of the Duchy's governing commission of 21
      July 1807 put her back in possession. She asks that the debts the donees raised on the estates
      be charged to Prussia: the Prince, the report says, loaded Trąbczyn and Szetlewek with 156,000
      thalers, and Kolno and Kamionna, which he sold to the bank cashier Leixner for 142,000 thalers,
      carry 160,000 thalers. The report argues that as an orphan under age she was entitled to the
      protection of the Prussian government, that Niemojewski and Wichrowski recovered their estates
      free of debt, and that Prussia compensated Generals Sanitz and Zastrow with other estates for
      those returned. It could compensate the Prince in the same way, by taking over his debts. A
      reader in the Prussian ministry wrote objections in the margin in pencil: Prussia is
      answerable to no one for acts of government in the former South Prussia. Not even Napoleon
      granted a claim for what was done in the years between. The donee, for as long as he possessed
      the estate, possessed it lawfully and with full right of ownership.
    de: >-
      Der russische Gesandte in Berlin, Alopeus, übersendet dem preußischen Außenminister Graf
      Bernstorff auf Befehl seines Hofes einen beiliegenden Bericht des Statthalters des Königreichs
      Polen über eine Forderung, die Gräfin Michalina Miączyńska, geborene Prusimska, gegen die
      preußische Regierung erhebt, und unterstützt sie. Der Bericht enthalte so schlüssige Gründe,
      dass er nichts hinzuzufügen wisse. Er bittet Bernstorff, die Sache der Gräfin den Behörden zu
      empfehlen, die darüber zu entscheiden haben. Die beigelegte Abschrift des Berichts legt ihre
      Forderung dar, wie die bevollmächtigten Kommissare für die Liquidation des ehemaligen
      Herzogtums Warschau sie dargelegt haben. Ihre Erbgüter wurden 1796 ihrem Vater, dem Starosten
      Prusimski, von der preußischen Regierung konfisziert und an Fürst Hohenlohe-Ingelfingen und
      General Sanitz vergeben; ein Beschluss der Regierungskommission des Herzogtums vom 21. Juli 1807
      setzte sie wieder in den Besitz ein. Sie verlangt, dass die Schulden, die die Beschenkten auf
      die Güter aufgenommen haben, zu Lasten Preußens gehen: Der Fürst habe Trąbczyn und Szetlewek mit
      156.000 Talern belastet, und auf Kolno und Kamionna, die er für 142.000 Taler an den
      Bankkassierer Leixner verkaufte, lägen 160.000 Taler. Der Bericht führt an, dass sie als
      minderjährige Waise Anspruch auf den Schutz der preußischen Regierung hatte, dass Niemojewski
      und Wichrowski ihre Güter schuldenfrei zurückerhielten und dass Preußen die Generale Sanitz und
      Zastrow für die zurückgegebenen Güter mit anderen entschädigte. Ebenso könne es den Fürsten
      entschädigen, indem es dessen Schulden übernimmt. Ein Leser im preußischen Ministerium hat mit
      Bleistift Einwände an den Rand geschrieben: Preußen sei für Regierungsakte im ehemaligen
      Südpreußen niemandem verantwortlich, nicht einmal Napoleon habe einen Anspruch wegen des in der
      Zwischenzeit Geschehenen zugestanden, und der Beschenkte habe das Gut, solange er es besaß,
      rechtmäßig und mit vollem Eigentumsrecht besessen.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  The Prussian foreign ministry's file on what became of the debts that the
  Prince of Hohenlohe-Ingelfingen secured on the Trąbczyn estates, after a
  Polish commission gave the estates back in 1807 to Michalina Miączyńska,
  born Prusimska, the daughter of their former owner. Six documents and the
  cover. In January 1819 the Russian envoy at Berlin, Alopeus, sends Count
  Bernstorff a report from Warsaw of 29 April 1818 that sets out her claim:
  Prussia, which confiscated the estates from her father in 1796 and gave them
  away, should pay off the debts the donees loaded on them. The ministry's
  draft reply of 11 May 1819 refuses. A Warsaw advocate, Tarczewski, writes in
  November 1819 about a creditor's suit against her. In 1827 the Prussian
  envoy at St Petersburg, General von Schöler, protests to Count Nesselrode
  that the Polish courts have struck out the mortgage of the Breslau merchant
  Weigel, 30,000 Reichsthaler lent to the Prince, and asks that the judgment be
  annulled; and a certified extract in Polish gives the judgment of the Kalisz
  civil tribunal of 30 July 1827, which strikes out the mortgages of the
  Lichnowski brothers and of the widow Grotowska on the same grounds. The
  first five documents are in French, two of them copies and one the
  ministry's draft; the judgment is in Polish.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A ministry file with no German in it beyond the cover: documents 1 to 5 are
  French, document 6 is Polish in the spelling of the 1820s (y for j, as in
  "Pierwszey", "iest"; diacritics often omitted). The text is transcribed by
  paragraph, not line by line. Document 3 is the ministry's draft, in the
  French of a German official. Dates in documents sent to or from St Petersburg are given
  in both calendars ("10 février/29 janvier"). "écus" are Prussian thalers;
  "donnataires" are the men to whom the King gave confiscated estates. A word
  followed by [?] is one the transcriber was unsure of. In document 2 a reader
  in the Prussian ministry wrote pencil notes in German in the margins; each
  stands at the foot of its page as a line of its own, and the French words in
  square brackets before it are the passage it refers to, quoted by the
  edition, not part of the note.

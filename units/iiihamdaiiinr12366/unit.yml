# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: keep that, if wanted, as archive_title.
title: >-
  A file of the Prussian Ministry of Foreign Affairs on the claim of Countess
  Michalina Miączyńska, born Prusimska, to have the Trąbczyn estates, returned
  to her in 1807, freed of the debts that Prince Friedrich Ludwig of
  Hohenlohe-Ingelfingen had secured on them, and on the Polish courts'
  judgments of 1819 to 1827 that struck out those debts against his Prussian
  creditors, the merchant Weigel, the Lichnowski brothers and the widow
  Grotowska.
title_de: >-
  Eine Akte des preußischen Außenministeriums über die Forderung der Gräfin
  Michalina Miączyńska, geborene Prusimska, die ihr 1807 zurückgegebenen
  Güter um Trąbczyn von den Schulden zu befreien, die Fürst Friedrich Ludwig
  zu Hohenlohe-Ingelfingen darauf hatte eintragen lassen, und über die Urteile
  polnischer Gerichte von 1819 bis 1827, die diese Schulden zum Nachteil
  seiner preußischen Gläubiger, des Kaufmanns Weigel, der Brüder Lichnowski
  und der Witwe Grotowska, löschten.

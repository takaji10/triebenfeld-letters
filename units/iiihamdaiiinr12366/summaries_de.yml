iiihamdaiiinr12366-001: "Der russische Gesandte in Berlin, Alopeus, übersendet dem preußischen Außenminister Graf Bernstorff auf Befehl seines Hofes einen beiliegenden Bericht des Statthalters des Königreichs Polen über eine Forderung, die Gräfin Michalina Miączyńska, geborene Prusimska, gegen die preußische Regierung erhebt, und unterstützt sie. Der Bericht enthalte so schlüssige Gründe, dass er nichts hinzuzufügen wisse. Er bittet Bernstorff, die Sache der Gräfin den Behörden zu empfehlen, die darüber zu entscheiden haben."
iiihamdaiiinr12366-002: "Abschrift eines Berichts aus Warschau über die Forderung der Gräfin Michalina Miączyńska, geborene Prusimska, wie die bevollmächtigten Kommissare für die Liquidation des ehemaligen Herzogtums Warschau sie dargelegt haben. Ihre Erbgüter wurden 1796 ihrem Vater, dem Starosten Prusimski, von der preußischen Regierung konfisziert und an Fürst Hohenlohe-Ingelfingen und General Sanitz vergeben; ein Beschluss der Regierungskommission des Herzogtums vom 21. Juli 1807 setzte sie wieder in den Besitz ein. Sie verlangt, dass die Schulden, die die Beschenkten auf die Güter aufgenommen haben, zu Lasten Preußens gehen: Der Fürst habe Trąbczyn und Szetlewek mit 156.000 Talern belastet, und auf Kolno und Kamionna, die er für 142.000 Taler an den Bankkassierer Leixner verkaufte, lägen 160.000 Taler. Der Bericht führt an, dass sie als minderjährige Waise Anspruch auf den Schutz der preußischen Regierung hatte, dass Niemojewski und Wichrowski ihre Güter schuldenfrei zurückerhielten und dass Preußen die Generale Sanitz und Zastrow für die zurückgegebenen Güter mit anderen entschädigte. Ebenso könne es den Fürsten entschädigen, indem es dessen Schulden übernimmt. Ein Leser im preußischen Ministerium hat mit Bleistift Einwände an den Rand geschrieben: Preußen sei für Regierungsakte im ehemaligen Südpreußen niemandem verantwortlich, nicht einmal Napoleon habe einen Anspruch wegen des in der Zwischenzeit Geschehenen zugestanden, und der Fürst habe die Güter, solange er sie besaß, rechtmäßig und mit vollem Eigentumsrecht besessen."
iiihamdaiiinr12366-003: "Entwurf der Antwort des preußischen Außenministers an den russischen Gesandten Alopeus auf dessen Note und die Denkschrift über die Forderungen der Gräfin Miączyńska. Der Starost Prusimski habe am Aufstand der Polen teilgenommen und sei geflohen; seine Güter wurden durch gerichtliches Urteil konfisziert, der König verfügte darüber, und die Beschenkten nahmen Hypotheken darauf auf. Prusimski starb 1803 im Ausland, und seine Tochter erhielt die Güter nach dem Frieden von Tilsit von der Regierung des Herzogtums Warschau zurück. Sie verlangt nun, dass die Schulden getilgt werden, die auf den Gütern ruhen. Die preußische Regierung hat das Gesuch schon einmal abgelehnt; nach erneuter Prüfung bleibt es bei der Entscheidung der preußischen Gerichte, deren Gründe eine beigefügte Denkschrift darlegt."
iiihamdaiiinr12366-004: "Abschrift eines Schreibens des Advokaten Tarczewski aus Warschau an einen nicht genannten Mandanten: Mitschke in Kalisz hat ihm die Akten des Prozesses gegen Frau Miączyńska geschickt. Sie sind in Ordnung; es fehlen nur die Hypothekenscheine über die eingeklagte Summe, die im Original oder in beglaubigter Abschrift vorzulegen sind. Die Gegenseite betreibt die Einführung der Sache vor dem Appellationsgericht. Er zieht die Instruktion hin, doch wenn alle Fristen erschöpft sind, muss die Sache zur Entscheidung gestellt werden."
iiihamdaiiinr12366-005: "Abschrift einer Note des preußischen Gesandten in St. Petersburg, General von Schöler, an den russischen Außenminister Graf Nesselrode. Fürst Hohenlohe-Ingelfingen, dem König Friedrich Wilhelm II. am 9. August 1796 die konfiszierte Herrschaft Trąbczyn geschenkt hatte, nahm bei Grotowski 30.000 Taler auf; die Hypothek wurde gerichtlich an den Breslauer Kaufmann Weigel abgetreten. 1807 gab die Regierungskommission des Herzogtums Warschau die Güter an Prusimskis Tochter Michalina zurück, die jetzige Gräfin Miączyńska; die eingetragenen Forderungen blieben bestehen. Als die Zinsen ausblieben, klagte Weigel; das Ziviltribunal in Kalisz wies ihn am 6. März 1819 ab und ließ die Forderung löschen. Preußen verlangte 1819 und 1820 ohne Antwort, die Frage der diplomatischen Verhandlung vorzubehalten; inzwischen hat das Appellationsgericht das Urteil verworfen, das Obertribunal in Warschau es aber am 17. Juli 1826 bestätigt. Schöler beruft sich auf den Frieden von Tilsit und auf die Konventionen von 1815 und 1819, die Hypothekenforderungen aufrechterhalten, und bittet, das Urteil aufheben und seine Vollstreckung zunächst aussetzen zu lassen."
iiihamdaiiinr12366-006: "Beglaubigter Auszug eines Urteils des Ziviltribunals erster Instanz der Woiwodschaft Kalisz vom 30. Juli 1827, in polnischer Sprache. Klägerin ist Michalina Miączyńska, geborene Prusimska, mit ihrem Mann Graf Stanisław Miączyński, Erbherrin von Trąbczyn; Beklagte sind die Brüder Lichnowski als Erben des Karl Heinrich Lichnowski und Maria Anna, geborene Blacha, die Witwe des Franciszek Grotowski. Das Gericht weist zwei Einreden gegen die Ladung zurück und erwägt: Trąbczyn und Szetlewek gehörten Antoni Prusimski, wurden ihm wegen seiner Teilnahme am Aufstand konfisziert und dem Fürsten Hohenlohe-Ingelfingen geschenkt; die Regierungskommission gab sie der Klägerin zurück. Der Fürst sei nur bedingter Besitzer gewesen, mit seinem Titel seien auch die von ihm aufgenommenen Schulden erloschen, und der Vertrag von Tilsit ändere daran nichts; gegen Weigel habe die Klägerin in gleicher Sache bereits endgültige Urteile erlangt. Es lässt die Forderung der Brüder Lichnowski und die der Witwe Grotowski aus dem Hypothekenbuch von Trąbczyn und Szetlewek löschen und legt den Beklagten die Kosten auf."

# Text the receiving office wrote on someone else's paper. Here: the pencil
# notes a reader in the Prussian ministry wrote in German in the margins of
# the Warsaw report (document 2), beside passages he underlined. The lines
# are ordinary text in corpus.txt; this file only says which they are, so
# the site can set them apart. Each block stands at the end of its page.
# The French in square brackets before a note is the passage it stands
# beside (intake/margin_notes.py).
#   first: the block's first line exactly as it stands in corpus.txt
#   lines: how many lines the block has
# A first line that is edited must be edited here too; build_db.py stops if a
# block cannot be found.
blocks:

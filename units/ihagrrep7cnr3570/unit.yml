# For the reader: shown on this unit's provenance page.
description: >-
  The Prussian ministry file on the donation charters of August 1796, by which
  Friedrich Wilhelm II gave estates confiscated from Polish insurgents in South
  Prussia to the Prince of Hohenlohe-Ingelfingen and to six officers: Colonel
  von Sanitz, General von Blücher, General von Dolffs, Major von Pontanus,
  Lieutenant von Holtzendorff and General von Larisch. The Prince received the
  town of Kamionna (Klemen), the market town of Kulm, the villages of Trąbczyn,
  Szetlewek, Nowawies, Łazy, Old and New Laski, Osiny and the Trąbczyn
  Hauland, and Brzyce in Kuyavia, all confiscated from the insurgent Anton
  Prusimski. The file holds Minister Hoym's report of 14 July proposing the
  grants, his letter of 30 July, the covering report to the King of 9 August,
  the draft of the Prince's charter of 9 August 1796, and the correspondence
  on its signing. Registry notes of 1826 at the front show the file being
  called up over Sanitz's claim for his lost estates. Several pages, probably
  the other officers' charters, are not yet transcribed.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A ministry file, not one instrument: reports to the King, letters between
  the ministers Hoym, Goldbeck and von der Reck, the draft of a royal donation
  charter (Schenkungs-Urkunde, Donations-Brief) in the King's voice (Wir,
  Unser), and registry dockets. The charter is a draft: "(tot. tit.)" and
  "(Inseratur der Charakter des Fürsten im Königl. Dienst)" are the clerk's
  instructions to insert the full title and the Prince's rank, and stay as
  they are. Latin chancery terms are kept: Expediatur, conclusum eodem,
  cum appertinentia, Actus inter vivos, mortis causa, Ad contrasignandum,
  Munda and Concepte (fair copies and drafts), hujus, submissest. Gratial-Güter
  are estates granted by royal favour; Insurgenten-Güter estates confiscated
  from the insurgents of 1794. Pages marked "(not transcribed)" are placeholders for pages whose text
  has not been transcribed; render them as such and add nothing.

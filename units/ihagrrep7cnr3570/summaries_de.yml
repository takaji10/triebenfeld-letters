ihagrrep7cnr3570-001: 'Akte zur Schenkung konfiszierter und vakanter Güter in Südpreußen an Offiziere. Hoym schlägt vor, dem Fürsten von Hohenlohe-Ingelfingen die dem Insurgenten Anton von Prusimski konfiszierten Güter zu verleihen: Kamionna, Kolno, Trąbczyn, Szetlewek, Nowawies, Lazy, Alt- und Neu-Laske, Osiny, das Hauland Trąbczyński und Brzyce. Die Kabinettsordre genehmigt dies sowie Güter für von Sanitz, Blücher, von Dolffs, von Pontanus, von Holtzendorff und von Larisch. Enthalten sind der Entwurf der Schenkungsurkunde für den Fürsten und Hoyms Wunsch nach der Klausel „cum appertinentia“.'

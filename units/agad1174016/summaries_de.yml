# through summarise.py --build --lang de.
agad1174016-001: "Eintrag im Register der Regierungskommission, in polnischer Sprache: eine Anordnung an den Direktor der inneren Angelegenheiten, in Warschau in der Sitzung vom 12. Juli 1807 ergangen. Die Kommission übersendet ihm in beglaubigter Abschrift das Dekret des Kaisers der Franzosen und Königs von Italien, am 5. Juni in Finckenstein erlassen, das ihrem Mitglied Wybicki den Besitz der Güter Manieczki, Przylepki, Boreczek und Esterpol zurückgibt, die im Departement Poznań sequestriert waren und über die die preußische Regierung verfügt hatte, und das der provisorischen polnischen Regierung die Ausführung aufträgt. Der Direktor soll das Dekret unverzüglich ausführen: der Verwaltungskammer des Departements Poznań befehlen, die Güter für Wybicki zu übergeben, und ihn ohne Verzug in den Besitz einweisen lassen. Unter dem Eintrag stehen die Namen des Präsidenten Stanisław Małachowski und des Generalsekretärs Jan Łuszczewski."
agad1174016-002: "Eintrag im Register der Regierungskommission, in polnischer Sprache, mit dem das Verzeichnis der Beschlüsse beginnt, die die Kommission während ihres Aufenthalts in Dresden gefasst hat. Der Beschluss vom 21. Juli 1807 stellt die von der preußischen Regierung konfiszierten Erbgüter der Michalina Dąbska, des Generals Niemojewski und Wichrowskis unter das Urteil, das der Kaiser zugunsten Wybickis erlassen hat. Die Sache der Michalina Dąbska, geborene Prusimska, sei der Kommission vom Kaiser überwiesen worden; nach dem Vorbild des in Finckenstein erlassenen Dekrets vom 5. Juni dehnt die Kommission das Urteil auf die drei Fälle aus, damit die Güter an ihre wahren Eigentümer zurückfallen. Unter dem Eintrag stehen die Namen des Präsidenten Stanisław Małachowski und des Generalsekretärs Jan Łuszczewski."

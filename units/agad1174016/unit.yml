# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: keep that, if wanted, as archive_title.
title: >-
  Two entries from the register of orders and resolutions of the Governing
  Commission, the provisional Polish government of 1807: the order of 12 July
  to carry out Napoleon's decree returning the confiscated estates of Józef
  Wybicki, and the resolution of 21 July 1807 that extends the decree to
  Michalina Dąbska, born Prusimska, and so returns to her the estates,
  Trąbczyn among them, that Prussia had given to Prince Friedrich Ludwig of
  Hohenlohe-Ingelfingen.
title_de: >-
  Zwei Einträge aus dem Register der Anordnungen und Beschlüsse der
  Regierungskommission, der provisorischen polnischen Regierung von 1807: die
  Anordnung vom 12. Juli, Napoleons Dekret über die Rückgabe der
  konfiszierten Güter des Józef Wybicki auszuführen, und der Beschluss vom
  21. Juli 1807, der das Dekret auf Michalina Dąbska, geborene Prusimska,
  ausdehnt und ihr damit die Güter zurückgibt, darunter Trąbczyn, die Preußen
  dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen geschenkt hatte.

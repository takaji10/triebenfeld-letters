# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Two entries from a register in which the Governing Commission (Komisja
  Rządząca), the provisional government of the Polish lands taken from
  Prussia in 1806 and 1807, had its orders and resolutions copied out, each
  with the names of its president, Stanisław Małachowski, and its secretary
  general, Jan Łuszczewski. The first, dated Warsaw, 12 July 1807, sends the
  Director of Internal Affairs a certified copy of the Emperor Napoleon's
  decree of 5 June 1807, given at Finckenstein, which returns to Józef
  Wybicki, a member of the commission, his estates of Manieczki, Przylepki,
  Boreczek and Esterpol in the department of Poznań, sequestrated and
  disposed of by the Prussian government, and orders him put in possession.
  The second, dated Dresden, 21 July 1807, opens the register of resolutions
  taken while the commission was at Dresden: it extends the decree for
  Wybicki to Michalina Dąbska, born Prusimska, to General Niemojewski and to
  Wichrowski, so that their hereditary estates, confiscated by the Prussian
  government, return to their true owners. Both are in Polish.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Polish in the spelling of 1807 (y and i for j, as in "Rządzącey", "iako").
  The text is transcribed by paragraph, not line by line. Each entry has a
  heading that says what it is ("Zalecenie", an order; "Uchwała", a
  resolution), the date in the margin ("Lipiec d. 12", July the 12th), the
  words "Kommissya Rządząca" (the Governing Commission) and then the text.
  Abbreviated forms of address stand as written: "JW." is Jaśnie Wielmożny,
  "JP." and "JPani" Jaśnie Pan and Jaśnie Pani, "W." Wielmożny, "N° Cesarza"
  Nayiaśnieyszego Cesarza (the Most Serene Emperor, Napoleon), "JCK. Mość"
  His Imperial and Royal Majesty, "r. b." of this year. "Prusińskich" is the
  scribe's form of Prusimskich, her maiden name; "Dambska" and "Dąmbska" are
  her first married name, Dąbska. The names under each entry are copied, not
  signed.

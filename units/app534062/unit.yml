# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry, in Latin, at the foot of page 222 of the relation and citation
  book of the land court at Kalisz for 1726 and 1727 (APP 53/4/0/-/62, scan
  231 of 349 of the archive's online unit). The general royal messenger
  Sebastian Szetlewicz, of the village of Szetlewko, reports to the court
  that he had carried a citation to the estate of the village of Szetlew, to
  the residence of the party cited, and, on the Thursday next past, had laid
  and left it there on the table in the heated room, before the cited party's
  "Conte~" (a word not fully read, perhaps a household member). The entry
  gives neither the case nor the parties, and the report's opening formula
  does not fully parse as transcribed; the entry ends with the phrase "of
  which, the present report". The editor added the holding for the
  messenger's name: it shows a Szetlewicz family living at Szetlewko
  (Szetlewek) in the 1720s.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  An entry of a Polish land court book of 1726-1727, in abbreviated Latin;
  the abbreviation marks (~) stand as written. "Ministerialis Regni
  Generalis" is a general royal messenger of the land courts (woźny), who
  reports to the court that he served a citation; "in Mensa hypocausti" on
  the table in the heated room, where a citation was left when the party was
  not met in person; "Feria Quinta proxima praeterita" the Thursday next
  past. "Citti~" stands for Citati, of the cited party (the editor's ruling,
  2026-10-26); "Judicius" is corrected to "Judicio" at the editor's word.
  "Conte~", "de Juris Firma" and the "eam" of the second line (read with a
  scribal mark above the final m; the editor guessed "eadem") are not fully
  read - see units/app534062/notes.md and the unresolved list. "Szetlewo" is
  Szetlew; "Szetlewko" is Szetlewek (the editor, 2026-10-26).

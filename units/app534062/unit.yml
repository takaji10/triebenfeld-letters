# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  The report of the court messenger Sebastian Szetlewicz of Szetlewek, an
  entry of the land court at Kalisz of 1727: he carried a citation to the
  estate of the village of Szetlew, to the residence of the party cited, and
  on the Thursday next past left it there on the table in the heated room,
  before a member of the cited party's household.
title_de: >-
  Der Bericht des Gerichtsboten Sebastian Szetlewicz von Szetlewek, ein
  Eintrag des Landgerichts in Kalisz von 1727: er überbrachte eine Ladung zum
  Gut des Dorfes Szetlew, an die Wohnung des Geladenen, und ließ sie am
  vorvergangenen Donnerstag dort auf dem Tisch im beheizten Raum zurück, vor
  einem Angehörigen des Haushalts des Geladenen.

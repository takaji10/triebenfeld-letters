# The footnotes of the Kodeks entries, as the site shows them (the editor,
# 2026-10-16: "Style them as footnotes for the site so that it looks proper.
# Don't try to amend any of the transcription").
#
# In the editor's file a footnote marker stands glued to its word
# ("Mezeconis1", "quatuordecimoa", "Zagorowo,1)") and each note begins with its
# marker ("1Mieszko III ...", "atak Kop. ..."). Nothing in the text changes:
# this file says where the markers are, and build_site_data.py raises them
# (<sup class="fn">) and sets the note lines apart (<span class="fn-note">).
# verify_site.py reads through that markup when it checks the text.
#
# Per document number:
#   markers  a piece of the text with the marker in braces, unique in the
#            document once the braces are taken out
#   notes    the beginning of a note line, its marker in braces; it must
#            begin exactly one line of the document
#   unmatched  markers or notes that have no partner, and why
#
# Checked by units/kdw/intake/check_footnotes.py. Volumes 1 to 3 have no
# markers (their last line is the editors' list of place names).


# The claim check of the German summaries of the Kodeks Dyplomatyczny Wielkopolski
# entries, made in session on 2026-10-16 under the rules read_letters.py --verify
# gives its checker: each statement held to the document (the Latin text and the
# editors' regest, description of the sources and notes), as supported, overstated
# or unsupported, and the summary only weakened or cut.
#
# Result: 107 statements, all supported, after two summaries were corrected before
# they were written out: in document 4 the first draft listed Kopojno among the
# abbey's estates (the text names it only as a boundary) and gave Świątniki as if
# the text had it (the text has Rzgowo with the sanctuarii; Świątniki is the
# editors' identification of the sanctuarii); in document 6 Świątniki is likewise
# marked as the editors'. "where" quotes the passage found. Dates and places are the
# editors' headings, which read the dateline. Names stand in the edition's forms.


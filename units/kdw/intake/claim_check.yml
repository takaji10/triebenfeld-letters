- {claim: "bestellt im Haus seiner Mutter Mścichna in Trąbczyn seinen Bruder Jan, Erben in Trąbczyn, zum Bevollmächtigten", verdict: supported, where: "in domo nobilis Msinchneb conthoralis Otthe heredis in Trampcz(i)no constitutus pers"}
- {claim: "um von Jarand, Scholaster von Kruszwica, siebzig ungarische Gulden einzuziehen", verdict: supported, where: "domino Jerando scolastico Crusuiczensis, Wladislauiensis et Wyeluniensis ecclesiarum canonico3 LXX florenos Vngaricales, occa"}
- {claim: "die ihm aus einem Vergleich über eine Pfründe in Wieluń zustehen", verdict: supported, where: "occasione concordie per venerabiles dominos Johannem de Nye"}
- {claim: "Trąbczyn, 15. Mai 1434; die Abschrift hat 1435, nach den Herausgebern statt 1434", verdict: supported, where: "Trąbczyn, 15 maja 1434"}

kdw-020:
- {claim: "König Władysław III. schreibt Stanisław Czarny 300 Mark auf die königlichen Dörfer Wrąbczynek, Adamierz und Borzykowo im Bezirk Pyzdry", verdict: supported, where: "Król Władysław III zapisuje 300 grzywien na wsiach Wrąbczynek, Adamierz i Borzykowo Stanisławowi Czarnemu. Kop.: Warszaw"}
- {claim: "bis sie ihm zurückgezahlt sind", verdict: supported, where: "tamdiu, quousque sibi vel suis successoribus legitimis prefatae trecentae marcae ex integro fuer"}
- {claim: "hundert Mark für ein Pferd, zweihundert für seine Dienste auf der Reise nach Ungarn zur Krönung", verdict: supported, where: "equum seu szpadonem pro centum marcis monetae et numeri Polonicalium per fori"}
- {claim: "Buda, 10. August 1440", verdict: supported, where: "Datum Budae feria quarta festi sancti Laurentii Martiris anno Domini millesim"}
- {claim: "aus der Kronmetrik", verdict: supported, where: "Metryka koronna, t. 109, s. 11-12. Oblata 2"}

kdw-021:
- {claim: "König Władysław III. schreibt Stanisław Czarny von Pietrzyków für seine Dienste bei der Krönung in Ungarn weitere 200 Mark auf die Dörfer Adamierz, Borzykowo und Wrąbczynek", verdict: supported, where: "Stanislai Czarni de Pietrzikow1 a diu nobis et praesertim in adap(ta)t"}
- {claim: "die er aus der Hand des Bartosz Płomikowski auslösen darf", verdict: supported, where: "de manibus nobilis Bartassiia Plomiko"}
- {claim: "Buda, 22. November 1440", verdict: supported, where: "Datum Budae feria tercia post festum sanctae Elizabeth"}
- {claim: "aus der Kronmetrik", verdict: supported, where: "Metryka koronna, t. 109, s. 8-9. Oblata 27"}

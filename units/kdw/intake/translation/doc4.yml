  en: 'Document no. 393


    Bolesław, Duke of Poland, 10 December 1261, at Sechowa; confirms the grants of estates and liberties
    made to the monastery of Ląd by Mieszko, Duke of Poland, in 1145 on the occasion of its foundation,
    and adds new ones on his own part.


    Poznań. Royal State Archive. Ląd, Liber privilegiorum B, no. 4. (Compare charter no. 10, and Rzyszczewski
    and Muczkowski, Codex diplomaticus Poloniae I, no. 1.)


    In the name of the holy and undivided Trinity, amen. Since every deed of men of our time is wont to
    be held doubtful that is not strengthened by the points of letters, we Bolesław, by the grace of God
    Duke of Poland, ordered the brothers of the house of Ląd of the Cistercian Order to show us their
    privileges on the foundation of that house. Having examined them with due care, we found in them with
    full certainty that our great-grandfather Mieszko, by the grace of God great Duke of Poland, having
    founded the said house in the year of the Lord 1145, for the support of the brothers serving God there,
    to the honour of our Lord Jesus Christ and of his glorious mother Mary ever Virgin, bestowed on the
    said house these estates with their people and all their uses present and future: namely Kościół,
    where he granted that there should be a market full of every liberty, Dolany, Mokra, Kłobia, Choceń.
    The people of these villages are bound each to pay on the feast of St Michael sixty sheaves of rye,
    a measure of oats, a measure of wheat, three urns of malt; to reap five heaps of corn, three cartloads
    of hay and as many of wood, two pine trunks; for three days on end with all the household to clean
    the crops, each to thresh for one day, and to give three bundles of flax. He also gave these estates
    listed below with their people and all their uses present and future: Szetlew with the cooks, Rzgów
    with the sanctuary people and the stable men, Grabienice with the chamberlains, Sławsk with the fishermen,
    Wiramowo, Kwaskowo, Chorzeń, Staralanka, Swiniarowo. The people of these villages are bound to draw
    the net between Sieradz and Władysław, and throughout all Poland, whenever the need of the brothers
    requires, to carry their orders, on horse as well as on foot. He granted too that the fishermen and
    huntsmen of the said brothers might freely follow fishing and hunting wherever his fishermen and huntsmen
    and those of his successors go. He also gave the said brothers, for providing lights, three markets
    with inns, namely Glev, Thur and Sobotka. He would also have the innkeepers of the said villages summoned
    nowhere but before the abbot. And since a gift given to God ought not to be subject to the laws of
    princes, he freed all the people living in the said villages from carting, from every conveyance,
    from watch, from tribute, naraz, podworowe, market and bridge tolls, from the building of castles
    or of any bridges, from receiving, guarding or escorting beaver-keepers, from the guarding and payment
    of falcons, which is called sokol, from the neighbourhood called in the common tongue opole, from
    every exaction or levy, from carting and military expeditions, and from all the rights established
    in Poland by whatever names they are called. Reserving to no judge or castellan any right to summon
    or judge the said people or their villages. But since the age of time does not let things which cannot
    be preserved by keeping stay in the same state, and it was to be feared that, the said privilege of
    our great-grandfather being worn away by great age, harm might in future arise to the said house,
    we, following with pious affection the devotion of our forebears, confirm the said estates with the
    people and liberties written above, and take moreover into our protection the estates given to them
    by hereditary right by the nobles of Poland, namely Skarboszewo, Marcinkowo, Jaroszyn, Górka, Zagórów,
    Skokum, Oleśnica. And for the remission of our sins we free all the people living in the said villages,
    bondsmen, free men and hired men serving in their courts, from every Polish right and from the levy
    which is called powolne (sic). We have also given the said brothers the water of the Warta with the
    streams adjoining it, from the bounds of the old castle as far as Drążyn of the bishop and on the
    other side as far as Kopojno, with the fishing, uses and beavers, to be possessed by hereditary right.
    And so that this our deed, to the honour of God and of his holy mother ever Virgin Mary, may be kept
    inviolably ratified, we have had the present document strengthened by the protection of our seal,
    on this condition: that if, which God forbid, any of our successors or of others should dare with
    rash daring to go against this our deed, he shall know that he will incur the indignation of almighty
    God and of the blessed apostles Peter and Paul and of all the Saints. Done at Sechowa in the year
    of the Lord 1261, on the fourth day before the Ides of December. There is also the witness of faithful
    men: Jan, by the grace of God Archbishop of Gniezno; Jan the chancellor; Erkenbold, palatine of Gniezno;
    Szymon, castellan of Gniezno; Mateusz, castellan of Ląd; Mateusz our notary, who also sealed the present
    document.


    Landensis, of Ląd. Koscol, Kościół of St Nicholas, the place on which later stood the town of Lądek.
    Dolan, Dolany. Moscho, in no. 10 Morsk, Mokra, a vanished settlement near the town of Kazimierz, or
    else Mokre near the town of Rychwał. Cloba, Kłobia. Gocszene, as later appears, Choceń. Szethowo,
    Szetlewo. Coci, that is the village of the cooks, Kuchary Kościelne. Rzgowo, Rzgów. Sanctuarii, that
    is the village of the sanctuary people, Świątniki. Stabularii, perhaps the vanished settlement of
    Obory. Grabienice, Grabienice. Camerarii, perhaps the vanished settlement of Komorniki. Slavsko, Sławsk.
    Piscatores, perhaps a separate, vanished settlement, Rybitwy. Wiramowo, Kwaskowo, not identified.
    Chozen, Chorzeń. Staralanka, Swiniarowo, not identified. Seradz, Sieradz. Wladislav, Władysławów.
    Glev, probably Galewo. Thur, Tury. Sobotka, Sobotka. Skarbossewo, Skarboszewo. Marcinkowo, later renamed
    Kowalewo. Iarossyno, Jaroszyn. Gorzyza, Gorka. Zagorowo, Zagurów. Skokom, Skokum. Oleszyno, probably
    Oleśnica. Antiquum castrum, stood beside the monastery of Ląd. Dretino episcopi, Drążyn. Capayn, Kopojno.
    Sechowa, Czechowo, or else Szetlewo.'

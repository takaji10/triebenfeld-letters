  en: 'Document no. 1491


    Wyrzbenta, castellan of Poznań and the same general captain of Poland, 16 March 1363, at Ląd; attests
    that Mikołaj, subdapifer of the bishop of Poznań, resigned the half of the lordship in the village
    of Wrąbczyn to the monastery of Ląd.


    Original on parchment. On a scrap of parchment hangs a seal showing on a triangular shield the arms
    of the Niesobia family; the inscription effaced. Warsaw. The Rusiecki collection. Diplomata.


    We, Wyrzbenta, castellan of Poznań and also general captain of Poland, acknowledge openly and plainly
    to all and singular, present as much as to come, whose ears the present document shall have been recited
    to, that there came before us and the other nobles of the land of Poland the noble man Mikołaj, subdapifer
    of the venerable father in Christ, the Lord bishop of Poznań, together with his consort the honoured
    lady Czerska; not compelled, not forced, nor led astray by any scruple of calumny, but with the good
    deliberation of their mind first had, to the venerable man Lord Jan, by divine patience abbot, and
    his convent in Ląd of the Cistercian Order, they sold, gave, assigned and resigned the half of the
    lordship in the village commonly called great Wronczino for fourteen marks of ready groschen, by hereditary
    right, to be possessed, held, had, sold, exchanged and turned to such uses as shall have pleased their
    will, for all time. In testimony of this matter the seal of our title is hung upon these presents.
    Done and given at Ląd on the fifth day after the Sunday on which Laetare is sung in the churches,
    in the year of the Lord''s birth 1363, in the presence of these witnesses: the Lord Lasczone, under-huntsman
    of Ląd, the Lord Mikołaj of Wysoczko, Andrzej of Dreczkowo, Laskarz of Sławoszew, Piotrko of Strzałkowo,
    Jan of Bieganowo, heirs.


    Magnum Wronczino, Wrąbczyn. Wysoczko, Wysokie. Dreczcowo, Drzeczkowo. Slawosewo, Sławoszew. Stralcowicze,
    Strzałkowo. Beganowo, Bieganowo.'

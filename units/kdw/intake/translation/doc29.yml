  en: 'Document no. 1490


    Wyrzbenta, castellan of Poznań and the same general captain of Poland, 16 March 1363, at Ląd; attests
    that Stasco, together with his consort Iachna, sold the third part of the estate of Wrąbczyn to the
    monastery of Ląd.


    Original on parchment. A scrap of parchment from the hanging of the seal. Warsaw. The Rusiecki collection.
    Diplomata.


    We, Wyrzbenta, castellan of Poznań and also general captain of Poland, declare publicly and make known
    to all and singular, present as much as to come, to whom the present document shall have descended,
    that there came before us and the other nobles of the land of Poland the noble man Stasco, together
    with his consort the reverend lady Iachna, heirs of great Wronczino; not compelled, not forced, nor
    led astray by any vice or error whatsoever, but by the mature counsel of their friends had over this,
    to the reverend father in Christ Lord Jan, by divine mercy abbot of Ląd, and to the said abbey of
    St Mary and the monasteries there of the Cistercian Order, they sold, gave, assigned and resigned
    the third part of the estate commonly called great Wronczino, with all and singular the uses, the
    revenues and the incomes, and also the jurisdictions which they have or shall be able to have from
    anyone in the future, for seventy marks of ready groschen, by hereditary right and the title of ownership,
    to be possessed, held, had, sold, exchanged and turned to whatever uses for all time quietly and peaceably,
    as it shall seem better and more useful to the said lord abbot and his monastery aforesaid. In testimony
    of this matter the impress of our seal is hung upon these presents. Done and given at Ląd on the fifth
    day after the Sunday on which Laetare is sung in the church, in the year of the Lord''s Incarnation
    1363, in the presence of these witnesses: the Lord Lasczone, under-huntsman of Ląd, the Lord Mikołaj
    of Wysoczsko, Andrzej of Dreczkowo, Laskarz of Sławoszew, Piotrko of Strzałkowo, Jan of Bieganowo,
    heirs, and many others worthy of trust, specially asked for this.


    Magnum Wronczino, Wrąbczyn. Land, Ląd. Wysoczsko, Wysokie. Dreczkowo, Drzeczkowo. Slawosewo, Sławoszew.
    Stralcowicze, Strzałkowo. Beganowo, Bieganowo.'

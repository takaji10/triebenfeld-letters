  en: 'Document no. 1363


    Wyrzbenta, general captain of Poland, 14 August 1357, at Konin; attests that the monastery of Ląd
    exchanged the estate of Szczonowo for the third part of the village of Wrąbczyn, the estate of Zemka,
    wife of Albert.


    Original on parchment. On a scrap of parchment hangs a seal showing on a triangular shield the arms
    of the Niesobia family; the inscription effaced. Warsaw. The Rusiecki collection. Diplomata.


    We, Wyrzbenta, general captain of Poland, make known to all and singular, present as much as to come,
    who shall have notice of these presents, that there came before us, on the one part, Lord Jan, by
    divine mercy abbot of the monastery of Ląd of the Cistercian Order, with the full will of his convent,
    and, on the other, the reverend lady named Zemka, wife of Albert; not compelled, not forced, nor led
    astray by any kind of fraud or deceit, but of their own good and spontaneous will they made and ordered
    between themselves an exchange of goods, that is of estates; in this manner, that the said lord abbot
    with his convent of Ląd exchanged and resigned the estate of his monastery, commonly called Usczonowo,
    with all its uses, to the said lady Zemka for the third part of great Wroenschino; and conversely
    the said lady Zemka exchanged, gave and resigned the third part of the estate of Wronschino for the
    whole estate of Usczonowo aforesaid to the said lord abbot and his monastery; in this manner, that
    when the mother of the said lady Zemka dies, the said lady Zemka shall not be able, on account of
    any portion of her mother in the third part of the aforesaid estate of Wroenschino, to move any matter,
    nor is she bound to. And lest the said exchange, or the attestation of the exchange and of the resignation,
    be brought to nothing through the frailty of any calumny, we have had these presents written, strengthening
    them with the impress of our seal, in the presence of these witnesses: Predslao of Poznań, Andrzej
    of Kalisz, castellans; Franczko, heir of Wilków, Barnaba of Bieganowo, Marcin, burgrave in Konin,
    Wysław, parish priest there. Done and given at Konin on the vigil of the glorious Assumption of the
    Virgin, in the year of the Lord 1357.


    Land, Ląd. Usczonowo, Szczonowo. Magnum Wroenschino, Wrąbczyn. Vilcowo, Wilków. Beganowo, Bieganowo.'

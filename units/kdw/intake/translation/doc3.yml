  en: 'Document no. 238


    Przemysł, Duke of Poland, 4 May 1243, in the church of the hospital at Gniezno; together with his
    brother Duke Bolesław hands over the hospital at Gniezno, most amply endowed with goods, to the rule
    of the Holy Sepulchre of the house of Miechów.


    Poznań. Royal State Archive. Fasciculus Mączniki, B. IV. (A copy made in the 18th century from the
    original, which bore a seal.) Nakielski, Miechovia.


    In the name of the holy and undivided Trinity, amen. It is plain to all mortals how they are tossed
    by the turning of the times: that a long stretch of time gives birth to age, age to forgetting, and
    forgetting to the undoing of things done; for which reason it is needful that a thing worthy of memory
    be committed to writing, so that the greying past may be the more often renewed. I therefore, Przemysł,
    by the grace of God Duke of Poland, with my younger brother Bolesław and with our beloved mother Lady
    Jadwiga, make known to those present and to come who look on the present writing that, to the honour
    of God, in memory and for the remedy of our souls, with the consent of our venerable father Lord Fulko,
    Archbishop of Gniezno, and of his Chapter, and on the advice of our barons, we have given our hospital
    of Gniezno to the Holy Sepulchre, to be possessed by perpetual right under the rule and government
    of Lord Henryk, provost of the house of Miechów, and of his successors: for which the said provost
    shall be bound to provide through an honest and prudent man, a diligent rector, so that the alms given
    to the said hospital are not neglected or spent to no purpose. But if there should be, which God forbid,
    such a master as proved useful neither to God nor to his house, he shall be removed at our request
    and that of the Lord Archbishop and of his Chapter, if he has been canonically convicted and proved
    so, and another fit master shall be put in his place by the provost of the house named above, who
    will know how to keep favour and honour as far as God allows. In the hospital named above, as we have
    said, for the remedy of the souls of our forebears and successors and of our own, once it has been
    restored to a good state, all the sick in need of alms, not robbers, not men of violence, are to be
    cared for as far as the house can. Some poor scholars too shall be kept there at its cost, in food,
    not in clothing, at the will of the master of the hospital. And because, as our sins deserve, in these
    modern times when the little fire of charity grows cold on earth, there are found more invaders of
    spiritual houses than helpers or defenders, we wish to be true heirs and defenders in what belongs
    to the lay hand, and the Lord Archbishop with his Chapter in spiritual things. Done in the year of
    grace 1243 in the church of the said hospital at Gniezno on the feast of St Florian, in the presence
    of these witnesses: Lord Jan the dean, Krystian the custodian, Andrzej, Tomasz, Stefan the duke''s
    chancellor, Wincenty and his brother Piotr, Izajasz and Piotr, canons of Gniezno, and many other canons
    and vicars; and these barons: Bogumił and Dzierżykraj, palatines of Poland; Cieciert, castellan of
    Gniezno; Tomasz, castellan of Poznań; Domarat the judge, and many other knights; the Dominican friars
    Jerzy and Piotr, and Artung, by whose mediation this is known to have been done. These are the villages
    of this hospital: Zdziechowa with those assigned to it, Lachowo, Imielno, Pawłowo with the lake called
    Prenevo, and Przysieka, Cielimowo, Ujazd, inns at Kłecko, and Ielemno with the whole lake and a mill
    and with beavers to be taken freely, Stasin too with the lake called Cubuchowo and with all its uses,
    Lozine, Konikowo, and a mill and an orchard and a field by the orchard and by the hospital. These
    are the villages excepted into one neighbourhood, which are free: Koreczno, Przysieka, Jezierzany,
    Zdziechowa, Ujazd; so that the huntsmen of any office are not to be received there, nor are they to
    feed our dogs or give carts, and we make them wholly free of every military expedition and the building
    of castles and of all other exactions and payments.


    Hospitale Scti Sepulcri, the so-called Bożogrobcy (canons of the Holy Sepulchre). Mechoviensis, of
    Miechów. Zdechova, Zdziechowa. Leccovo, Lachowo. Chemelino, Imielno. Pawlowo, Pawłowo. Preseca, Przysieka.
    Cymellowo, Cielimowo. Ugasd, Ujazd. Clech, Kłeck. Ielemno cum pleno lacu et molendino, once probably
    a settlement on the river Wełna near the town of Kłecko, today vanished. Stasin, Lozine, not identified.
    Conicowo, Konikowo. Kurrino, Koreczno. Iezesani, Jezierzany.'

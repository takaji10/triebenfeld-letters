  en: 'Document no. 1739


    Przecław, palatine of Kalisz, and the other judges, 27 May 1377, at Gniezno; declare before King Louis
    that the villages of Wrąbczynek and Adamierz, with the mill lying near the town of Pyzdry, have belonged
    to the monastery of Ląd from of old.


    Original on parchment. On strips of parchment 6 small round seals are hung. The first is lost; the
    second is wholly worn; the third shows on a triangular shield the arms of the Poraj family, legend:
    S. Iohannis d. Nancowo; the fourth shows on a triangular shield the arms of the Zaremba family, legend:
    ...crol...; the fifth has its impression chipped; the sixth shows on a triangular shield the arms
    of the Doliwa family, legend worn.


    Warsaw. Collections of the Rusiecki family. Diplomata.


    To the magnificent prince Louis, King of Hungary and of Poland, Przecław the palatine, Tomisław the
    judge, Jan the castellan, Mikołaj the under-chamberlain of Kalisz, Wawrzyniec, castellan of Poznań,
    and Janusz, castellan of Biechowo, their most humble service at every pleasure of his commands. Before
    your royal majesty and all and each who are present we acknowledge, publicly professing: that little
    Wrąbczyn with the village of Nadamirza adjoining it, lying near Pyzdry, with all its uses, namely
    fields, plains, meadows, waters, woods, forests and the lake called Prziborowo, and also the mill
    lying below the town of Pyzdry, is of the property of the monastery of Ląd of the Cistercian Order;
    and we declare openly and publicly that this same village, namely little Wrąbczyn with its adjoining
    village, has belonged from of old, with full and entire lordship and all rights, revenues, fruits
    and incomes whatsoever, always to the said monastery of Ląd as its true property, as it does now.
    And in greater evidence of this our declaration we have had the present letters strengthened with
    our seals. Done and given at Gniezno on the eve of Corpus Christi, in the year of the Lord one thousand
    three hundred and seventy-seven, we being then gathered there for the general courts.


    Behoviensis, of Biechowo. Parvum Wronczino, Wrąbczynek. Nadamirza, Adamierz. Lacus Prziborowo, today
    a marsh lying north of Wrąbczynek. Landensis, of Ląd.'

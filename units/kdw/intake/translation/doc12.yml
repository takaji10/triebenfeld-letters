  en: 'Document no. 283


    Poznań, 31 January 1384


    Mikołaj of Wenecja, judge of Kalisz, adjudges Wrąbczyn(ek) to the Cistercian monastery at Ląd.


    Original: Kraków, WAP. D. Dep. 344. Parchment 229–219 × 130–126 + 23 mm. Three holes in the right
    margin, the bottom frayed. Slits from the strip for hanging the seal. On the back notes on the content
    and shelfmarks (14th–18th century).


    In the name of the Lord, amen. We, Mikołaj, judge of Kalisz¹, make known to all whom it concerns |
    that at Poznań on the Sunday before the Purification of the glorious Virgin Mary, in the year of the
    Lord one thousand | three hundred and eighty-four, there came before us Piotrko, heir of Łęg², also
    | on behalf of his uterine brother, on the one part, and the religious man Rudger, key-keeper and
    procurator of the brothers and convent of the mo- nastery of Ląd³, on the other, in the presence of
    the reverend father in Christ Lord Jan, Duke of Opole and Bishop of Poznań⁴, and of the strenuous
    knights and nobles: Pielgrzym, captain of Poland⁵, Dzierżek, castellan of Santok⁶, Franczek the cupbearer⁷,
    Stefan the under-cupbearer of Poznań⁸, and of the honourable men: Wojciech, archdeacon of Poznań⁹,
    Mikołaj, cantor of Poznań¹⁰; and on the peremptory term set for them they went to law before us for
    the estate called Vronczino¹¹. And we, weighing their causes well on the information of the lords
    already written and of other elders of the land, adjudged that the said Rudger the key-keeper, in
    the name of the whole convent of the said monastery, should be given the investiture of the said village,
    and have adjudged it by these presents, not removing Piotrko or his brother from acting at law against
    the said village. Provided that they may try for the said village by law, doing no violence to the
    said monastery. In witness of which we have had our seal hung on these presents. Given and done at
    Poznań on the day, in the year and at the place above.


    ¹Mikołaj of Wenecja, see above, no. 228/23.


    ²Piotr of Łęg near Śrem), most probably the same as the later steward of Kalisz 1392, then deputy
    judge of Poznań 1393–1398 (Spisy wlkp.; SHGWlkp.). His brother not identified.


    ³The key-keeper of Ląd, Rudger, not otherwise known.


    ⁴Jan Kropidło, see above, no. 282/1.


    ⁵Peregryn, Pielgrzym, of Węgleszyn (in the land of Sandomierz), of the Jelita arms, under-chamberlain
    of Sandomierz 1379–1400, captain of Greater Poland 1383–1387 (PSB XXV, pp. 602–603).


    ⁶Dziersław, Dzierżek, Grochola of Ostroróg, of the Nałęcz arms, castellan of Santok 1383–1387 (Spisy
    wlkp.).


    ⁷Franciszek of Cerekwica, see above, no. 190/1.


    ⁸Stefan the under-cupbearer occurs only here; most probably, though, this is the steward of Poznań
    1376–1399, Stefan of Trląg and Głogowiec (see above, no. 258/2).


    ⁹Wojciech of Będlewo, see above, no. 227/17.


    ¹⁰Mikołaj, cantor of Poznań, confirmed 1380–1384 (here), probably the deputy of (or the same as) Mikołaj
    Strosberg (see above, no. 250/4).


    ¹¹Wrąbczyn, just west of Zagórów, or Wrąbczynek (west of Wrąbczyn): in both these settlements, called
    Wronczyn (Little and Great), the monastery of Ląd later had its shares.'

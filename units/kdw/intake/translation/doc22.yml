  en: 'Document no. 228


    Kazimierz, Duke of Kujawy and Ląd, 17 June 1241, at Kopojno; exchanges his estates of Głowiewo and
    Wrąbczyn for the estate of the monastery of Ląd called Koszanów.


    Original on parchment. On threads of white and blue linen a seal is hung, showing an armed rider riding
    to the right. On his head a flat helmet, at his left a triangular shield, the right hand holding upright
    a lance with a long pennon. Inscription: S. Kazim.... ucis Cuyavie. Besides this, 4 crosswise notches
    from the hanging of a second seal.


    Warsaw. A private library. Diplomata.


    In the name of the holy and undivided Trinity, amen. What is done in time slips away with the time
    that slips, unless it is made everlasting by the memory of the living letter. Hence it is that I,
    Kazimierz, by the grace of God Duke of Kujawy and Ląd, make known to all, both present and to come,
    that I have exchanged with Jan, abbot of Ląd, and his brothers two estates with all their appurtenances,
    namely Glovevo and Wronecino, which once belonged to the huntsmen, for one estate of the said brothers
    which is called Coscheno; and in the said villages, namely Glovevo and Wronecino, we have granted
    every same liberty which the said brothers have had hitherto in the other estates of their church.
    And lest any scruple of doubt about this arise in the future, we have strengthened it with the hanging
    of our seal. The witnesses of this deed are: Bosek, castellan of Ląd, Mikołaj the treasurer, Gerard
    the treasurer, Lasch the under-judge, Brezdreve the under-cupbearer, Lancomir the under-falconer,
    Mikołaj of Rzgów, Golug and Pribizlaus, knights; Marek, Konrad, Piotr and Michał, chaplains; Jarosław,
    Jan and Michał, the duke''s squires; Henryk the chief cellarer, Mikołaj and Wilhelm, brothers of the
    said house. This was done at Kopojno in the year of the Lord 1241, on the fifteenth day before the
    Kalends of July.


    Coavia, Kujawy. Landensis, of Ląd. Glovevo, Głowiew. Wronecino, Wrąbczyn. Coscheno, Koszanów. Yrgove,
    Rzgów. Copagnin, Kopojno.'

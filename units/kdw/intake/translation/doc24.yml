  en: 'Document no. 672


    Przemysł the Second, Duke of Poland, 1 August 1291, at Pyzdry; gives Henryk, citizen of Pyzdry, the
    village of Wrąbczyn, to be located under German law.


    Wilanów. Library. The Register of the Reviewers of Greater Poland, fol. 121v.


    In the name of the Lord, amen. While the letter lives, the deed committed to the letter lives, whose
    assertion nourishes memory and, strengthened, takes increase. We therefore, Przemysł the Second, by
    the grace of God Duke of Poland, make known to all, both present and to come, who examine this page,
    that, seeing by experience that the Polish law in our lordship brings us nothing or little use, and
    wishing to bring our village, located under Polish law, named Wronchino, into a better and more useful
    condition, we have bestowed it on Henryk, our citizen of Pyzdry, to be located under German law according
    to the law of the town of Pyzdry, so that by reason of his location the said Henryk and his successors
    and heirs shall have the sixth mansus free, a tavern, a fishpond (sic), a mill, and a free shoemakers''
    shop. We also give the woods and marshes, which cannot be rooted out and are not fit for tillage,
    for the pasture of pigs and of sows; and whatever of meadow there is in the district of the same village
    we join to the said Henryk and his successors with all its uses and appurtenances. And if the bees,
    which are in the wood of the same village, should perish through the improvement and the location,
    we shall not on that account blame the said Henryk or his heirs in any way. And that the said village
    may be the better located, we give a liberty of twelve years from every exaction and payment, from
    the feast of St Martin next coming; when that has passed, the inhabitants of the said village shall
    pay to us each year from each mansus six measures of rye, the same of oats, and a ferton of denarii,
    according as they shall be in Pyzdry. Henryk shall also have free authority with his heirs to build
    a church there, and to assign to it one free mansus for its adornment. Besides, we join the said village
    of Wronchino to our town which is called Sal, so that both have one district and one boundary. Moreover,
    the aforesaid Henryk and his heirs shall have free authority to hunt hares and partridges in the district
    of the said estate. And that this our gift may persevere inviolate for ever, we have had the present
    page strengthened with the protection of our seal. Done at Pyzdry on the day of the Chains of blessed
    Peter, in the year of the Lord one thousand two hundred and ninety-one, given by the hand of Jaszko,
    notary of our court.


    Wronchino, Wrąbczyn. Sal, not identified; it appears nevertheless from the related documents that
    in the region marked above, that is the little town of Zagórów, the making of salt was common in the
    early centuries; cf. nos. 20 and 192. Pisdri, Pyzdry.'

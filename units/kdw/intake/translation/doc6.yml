  en: 'Document no. 27


    Kalisz, 18 October 1280


    Duke Przemysł II confirms the possessions of the Cistercian monastery at Ląd and endows them with
    certain liberties.


    Original: Cologne, Historisches Archiv, Kl. Lond I, 15. Parchment 485 × 350+17 mm. On a pink silk
    cord the issuer''s seal, showing (according to the editor in DKM) the standing figure of the duke
    holding a spear in his right hand and in his left a shield with a rampant lion; on both sides of the
    duke stand armed men blowing horns [probably on towers]. The description recalls the seal of Przemysł
    I, and of II (compare KDW IV, seal no. XV). On the back: Renovacio privilegii ducis Mesiconis (15th
    century).


    Copy: The same, Copiarius, fols 15–16 (15th century).


    Edition: DKM, pp. 356–358, no. 8 (from the original).


    Regests: 1. Perlbach, Lond, p. 86 (from the original); 2. Krzyżanowski, Dyplomy, p. 168 (from edition
    1).


    || In the name of the Lord, amen. || Since we are to pass with the swiftness of our days, as a shadow
    is wont to flee or smoke to vanish, | therefore we, Przemysł the Second, by the grace of God Duke
    of Poland, wish it to be known to all the faithful of Christ, present as well as to come, that for
    the love of our Lord Jesus Christ, the liberator of our | souls, and for the veneration of his glorious
    mother, Mary perpetual Virgin, and of All Saints, we renew for the brothers beloved in Christ who
    serve the Lord in the house of Ląd the privilege of our glorious | great-grandfather, the lord Mieszko,
    Duke of Poland¹, confirming to the said brothers these estates written below with their people and
    all the uses that are in them and may come in future, taking them into our protection and committing
    them to be defended by our successors for all time, in sole regard of divine reward. Now the places
    of the possessions are written below: namely Kościół², where we confirm that there shall be a market
    full of every liberty, Dolany³, Morsko⁴, Kłobia⁵ and Choceń⁶. The people of these villages are bound
    each to pay on the feast of St Michael [29 IX] sixty sheaves of rye, a measure of oats, a measure
    of wheat, three urns of malt, to reap five heaps of corn, three cartloads of hay and as many of wood,
    two pine trunks, for three days on end with all the household to clean the crops, each to thresh for
    one day, and to give three bundles of flax. We confirm too these estates written below with their
    people and all the uses that are in them and may be hereafter: Szechouo with the cooks⁷, Irgouo with
    the sanctuary people and the stable men⁸, Grabonowiz with the chamberlains⁹, Slausco with the fishermen¹⁰,
    Wiranouo¹¹, Quascouo, ¹², Choren¹³, Staralancha¹⁴, Suinareuo¹⁵. The people of the said villages are
    bound to draw the net within Sieradz¹⁶ and Włocławek¹⁷, and throughout all Poland¹⁸, whenever the
    need of the brothers requires, to carry their orders, on horse as well as on foot. We confirm moreover
    that the fishermen and huntsmen of the said brothers may freely follow fishing and hunting wherever
    our fishermen and huntsmen and those of our successors go. We confirm too to the said house, for providing
    lights, three markets with inns: Chlew¹⁹, Thur²⁰, Sobotka²¹; we confirm too that the innkeepers of
    these villages are summoned nowhere but before the abbot. And since a gift given to God ought not
    to be subject to the laws of princes, we free all the people living in the said villages from carting,
    from every conveyance, from watch, from tribute, from the naraz, podworowe, market and bridge tolls,
    from the building of castles or of any bridges, from receiving, guarding or escorting beaver-keepers,
    from receiving huntsmen of any kind, from the payment and guarding of falcons, which is called sokol,
    from the neighbourhood called in the common tongue opole, from every exaction or levy, from carting
    and military expeditions, and from all the rights established in Poland by whatever names they are
    called. Reserving to no castellan or judge any right to summon or judge the said people or their villages;
    but when a grave cause arises which cannot fittingly be settled before the abbot or his judge, they
    are to be summoned to our presence by our ring, the abbot to have whatever falls by right of judgement;
    and they are to be imprisoned nowhere but in the abbot''s stable. And so that this our confirmation,
    to the honour of God and of his holy mother ever Virgin Mary, may have the strength of lasting firmness,
    we have had the present document strengthened by the protection of our seal. Done at Kalisz on the
    feast of St Luke the Evangelist in the year of the Lord @1280@, in the presence of these witnesses,
    namely: Lord Andrzej, archdeacon and chancellor of Kalisz²², Count Żegota, huntsman of Kalisz²³, Count
    Piotrek, cupbearer of Poznań²⁴, Count Naszan, equerry of Kalisz²⁵, Count Falisz, procurator of Kalisz²⁶,
    and given by the hand of Tylo, notary of our court²⁷.


    ¹Mieszko III (d. 1202) was the great-great-grandfather of Przemysł II. The document mentioned here
    is a forgery dated 23 April 1145 (KDW I, no. 10), kept in the form of a supposed original, in truth
    made in the 13th century, in the archive of Ląd, today in Cologne, Historisches Archiv, Kl. Lond I/1;
    compare also on it Z. Kozłowska-Budkowa, Repertorium, pp. 43–45. The present document repeats a large
    part of the document of supposedly 1145.


    ²Kościół, commonly identified with Lądek, east of Ląd.


    ³Dolany, see above, no. 26/4.


    ⁴Morsko, see above, no. 13/4.


    ⁵Kłobia, a parish village in Kujawy, south of Brześć.


    ⁶Choceń, a parish village in Kujawy, north of Chodecz, south-east of Kłobia.


    ⁷Probably Szetlew, south-east of Zagórów; but compare Kuchary Kościelne, 9 km east of Szetlew.


    ⁸Rzgów, north-east of Szetlew. Świątniki just west of Rzgów.


    ⁹Grabienice, just south of Rzgów.


    ¹⁰Sławsk on the Warta, west of Konin.


    ¹¹Wiranowo and Kwaskowo not identified; they occur also in the forgery of 1145.


    ¹²Wiranowo and Kwaskowo not identified; they occur also in the forgery of 1145.


    ¹³Chorzeń on the Warta, north-west of Konin, today within the town of Konin.


    ¹⁴Stara Łąka not identified; it occurs also in the forgery of 1145.


    ¹⁵Perhaps Świniarzewo (Siniarzewo), a parish village in Kujawy, north-west of Brześć, a village named
    also in the forgery of 1145.


    ¹⁶Sieradz.


    ¹⁷Włocławek.


    ¹⁸Polonia probably in the sense of Greater Poland.


    ¹⁹Chlew (rather this, not Glew), Tur and Sobótka are hard to identify; compare Zajączkowscy, Materiały
    II, pp. 108–109.


    ²⁰Chlew (rather this, not Glew), Tur and Sobótka are hard to identify; compare Zajączkowscy, Materiały
    II, pp. 108–109.


    ²¹Chlew (rather this, not Glew), Tur and Sobótka are hard to identify; compare Zajączkowscy, Materiały
    II, pp. 108–109.


    ²²Andrzej Zaremba, see above, no. 26/8.


    ²³Żegota, see above, no. 13/7.


    ²⁴Piotrek, Pietrzyk, son of Prandota, steward of Poznań 1275, cupbearer 1280, castellan of Poznań
    1284, palatine of Poznań 1297–1299 (Spisy wlkp.).


    ²⁵Naszan, equerry of Kalisz 1280–1288 (Spisy wlkp.).


    ²⁶Chwalisz (Falisz), see above, no. 26/11.


    ²⁷Tylo, see above, no. 26/12.'

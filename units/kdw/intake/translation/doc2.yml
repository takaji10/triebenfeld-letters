  en: 'Document no. 222


    Fulko, Archbishop of the church of Gniezno, 1240 (sic), 30 September, without place; gives the monastery
    of Ląd the tithes of the chapels of St Peter and St Andrew.


    Poznań. Royal State Archive. Ląd, Liber privilegiorum B, no. 38.


    In the name of the Lord, amen. Since we must stand before the judgement seat of Christ on the last
    day, to receive good or evil according to what we have done in the body, it is fitting that we prepare
    ourselves a path to the homeland of eternal life by works of mercy. Therefore we, Fulko, by the grace
    of God Archbishop of the holy church of Gniezno, wish it to be known to all who will look on this
    page that, when the illustrious prince Lord Władysław, son of Odo, Duke of Poland, was settling the
    pressing business of the land with his barons at the monastery of Ląd on the day before St Remigius,
    it happened that, moved by God, he considered with the eye of piety the many burdens of the abbot
    and of the brothers serving God there, and, giving them the site of the castle that was called Lenda
    with its appurtenances, he assigned with most earnest devotion to their authority the chapels of St
    Andrew and St Peter, which had been of his patronage. And since it happened that we, called by the
    same prince, were present at this assembly together with our venerable brother and fellow bishop Lord
    Paweł of Poznań, moved by the prayers of the said prince and the most devoted entreaties of the barons,
    and pierced to the heart by the wretched poverty of the abbot and his brothers, we have given the
    tithes of the said chapels to God and to the blessed Mary ever Virgin, for the remedy of our soul
    and of our successors, for the use of the brothers, to be possessed for ever as they now are and as
    they may be in future, excepting no profit that may arise from their enlargement. And so that our
    devout gift may not be undone by any of our successors, we have named the estates in which the said
    tithes, with all their profits, are to fall to them: from Zagórów, Skokum, Kopojno, Trąbczyn, Szetlew,
    Łukom and Wrąbczyn; which tithes, by whatever right they are raised, whether the villages are divided
    or moved or called by another name, we give gladly, whatever of our right there may be, for the use
    of our brothers. And that all this may remain ratified and unshaken for ever, we strengthen the present
    writing by hanging our seal and that of the Chapter and that of our most beloved brother Lord Paweł,
    the bishop named above, who was present, and confirm it also by the witness of faithful men, whose
    names are these: Gotpold, the greater provost; Hugo, the dean; Mikołaj, the custodian; Wacław, the
    scholastic; and very many others worthy of trust. Given and done in the year of the Lord 1240 (sic),
    on the second day before the Kalends of October, in the twelfth indiction.


    Landensis, of Ląd. Zagurow, Skokom, the same today. Kopanino, later Kopasino, today Kopojno. Trąbczyn,
    Szetlewo, Łukomie, the same today. Wronczino, today Wrąbczyn.'

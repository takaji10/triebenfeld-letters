  en: 'Document no. 685


    Przemysł the Second, Duke of Poland, 29 September 1292, at Kalisz; ratifies the exchange, made five
    years before, of the estate of Wojsław son of Gosław called Niałek for the estates of Wisław son of
    Gerlach called Wrąbczyn and Bieganin.


    Original on parchment. On threads of red silk hangs the seal of Duke Przemysł (seal XXVI).


    Warsaw. Private library, Diplomata. Poznań, Royal State Archive. Ląd, Liber privilegiorum B, no. 22.


    In the name of the Lord, amen. We wisely meet many inconveniences when we strengthen the business
    of our age with the protection of letters and witnesses. We therefore, Przemysł the Second, by the
    grace of God Duke of Poland, make known to all men, of the present age as well as of the age to come,
    that, being present before us and our barons, Count Wisław, son of the late Gerloch, on the one part,
    and Wojsław, son of Gosław, on the other, made between them this exchange of their own estates: that
    the said Wisław, receiving the estate of the Wojsław named above, called in the common tongue Niałek,
    gave and resigned in exchange two estates of his own, Wrąbczyn, which he had exchanged with Przybysław
    son of Lutogniew, and Bieganin, to be possessed by perpetual hereditary right. And we, considering
    these exchanges duly and reasonably made, approving and ratifying them, have decreed that they shall
    be valid for ever, all hindrance set aside. And of the fullness of our power we have freed and exempted
    the said villages of Wrąbczyn and Bieganin from every Polish exaction, and make them free as they
    were of old, namely from the naraz, from carting, from conveyance, from watch, from the podworowe,
    from the ox, from the cow, from the opole, from summons to the castle. And if a homicide is committed
    among the inhabitants of the said villages, the said Wojsław and his posterity shall take the capital
    penalty. But if the homicide is between one of his inhabitants and a stranger, he shall nonetheless
    take the penalty for homicide after his inhabitant (sic). The inhabitants of the said villages shall
    be summoned nowhere but before us, by letter, with our seal or ring, and shall be bound to answer
    there to those who complain of them. In witness of which we ordered Jaśko our notary to write the
    present letters, strengthening them with the protection of our seal, in the presence of these witnesses:
    the counts Piotrko, castellan of Poznań, Zbylut (sic), castellan of Nakło, Wit, cupbearer of Gniezno.
    Given at Kalisz on the feast of the blessed Michael, when we went out on campaign to Sieradz against
    the King of Bohemia, and then this same exchange was renewed and confirmed, which had been done and
    made five years before. In the year of the grace of the Lord 1292.


    Nalcho, Niałek. Wroncino, Wronczyn. Beganino, Bieganin. Nakel, Nakło. Syracz, Sieradz.'

  en: 'Document no. 755


    Gniezno, 16 April 1415


    The captain general of Greater Poland attests that Święszek and Olbracht (?), brothers of Gulczewo,
    sold a plot in the suburb of Gniezno to the Cistercian monastery of Ląd.


    Copy: Włocławek, Diocesan Archive, Cistercians – Ląd, MS 3 (Liber privilegiorum monasterii, 18th century),
    p. 173.


    In the name of the Lord, amen. For the perpetual memory of the matter. We, Jan of Szczekociny, castellan
    of Lublin and captain general of Greater Poland¹, make known by the tenor of these presents to all
    whom it concerns, present and to come, who will have knowledge of these presents, that, coming before
    us and other nobles of the same land, Swanseck and Supracht, brothers german of Gulczewo², not compelled,
    not forced, nor led astray by any error, relying on the counsel of their friends, being sound in mind
    and body, have duly and reasonably sold for ever to the venerable man Lord Gerhard, abbot, and his
    convent of the monastery of Ląd³ their whole plot with the square, lying near the church of St Lawrence
    in the suburb of Gniezno, for sixteen marks of common current money, of Polish reckoning, reckoning
    forty-eight groschen to each mark, with all its uses, appurtenances and divisions in length and breadth
    in any way belonging to that plot, and with all right and lordship as they alone held and had it,
    reserving nothing of right for themselves and theirs, and have resigned it before us in the usual
    way for ever, to be held, had, used and enjoyed, exchanged, sold and turned to their own pleasure,
    as shall seem better and more useful to the said Gerhard and his convent of the monastery of Ląd.
    In witness of these, to which our seal is hung. Done and given at Gniezno on the Tuesday next after
    Misericordia Domini Sunday, in the year of His incarnation one thousand four hundred and fourteenᵃ,
    in the presence of the noble men: Piotr of Gunice⁴, Mikołaj of Trąbczyn⁵, Andrzej of the same⁶, Pełka
    of Kuchary⁷, Jan [ofᵇ] Świniary⁸, Mikołaj of Grabienice⁹ and many other witnesses worthy of trust,
    called and asked specially to the foregoing.


    ᵃSo the copy, but this must be a copyist''s error (quarto – quinto), since in 1414 Jan of Szczekociny
    was not yet captain of Greater Poland. The date 1415 agrees with his itinerary; see the next document.


    ᵇmissing in the copy.


    ¹Jan of Szczekociny, see above, no. 635/6.


    ²Gulczewo (Golczewo), parish of Marzenin, north of Września (Koz. 1, pp. 54, 89, 412; 3, pp. 560,
    671; 4, p. 239). Świętosław (Święszek) occurs 1404–1447 (SHGWlkp.), later for many years burgrave
    and żupca at Gniezno, Pyzdry and Konin, 1418–1447 (GUrz., p. 171); compare also MPH V, p. 476. His
    brother Supracht, Czupracht, occurs only here; compare however Czuprachtowe Gulczewo (Koz., l.c.).


    ³Abbot Gerard, see above, no. 412/9.


    ⁴Piotr of Gonice, see above, no. 433/1.


    ⁵⁻⁶Trąbczyn, a parish village south-east of Zagórów (Koz. 5, p. 414). Mikołaj occurs from 1402 (SHGWlkp.),
    later deputy standard-bearer at Gniezno 1434–1440 (GUrz. C 95). Andrzej occurs 1414 (here) to 1428
    (SHGWlkp.).


    ⁷Kuchary Kościelne, a parish village north-west of Rychwał (Koz. 4, p. 432). Pełka, deputy standard-bearer
    at Konin 1411–1414, burgrave 1414–1416, then often an assessor of the court at Konin (GUrz. C 472,
    363, 412).


    ⁸Świniary, parish of Kłecko, north-east of Kłecko (Koz. 1, p. 317; 5, p. 379). Jan occurs 1396–1426
    (SHGWlkp.).


    ⁹Grabienice, a parish village north-west of Rychwał in the Konin land (Koz. 4, pp. 260–261). Mikołaj
    occurs 1413–1428 (SHGWlkp.).'

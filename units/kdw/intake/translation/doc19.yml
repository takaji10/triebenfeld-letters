  en: 'Document no. 2000


    Trąbczyn, 15 May 1434


    Notarial instrument. Wojciech of Trąbczyn, canon of Kruszwica, authorises his brother Jan of Trąbczyn
    to collect a debt from Jarand, scholastic of Kruszwica.


    Copy: Kal. 9175, p. 373. Title: Mandatum ad levandum debitum.


    Remarks: 1. On the date see below, note a; 2. See also the next document.


    In the name of the Lord, amen. In the year from His birth 1435ᵃ, in the twelfth indiction, in the
    fourth year of the pontificate of the most holy father in Christ and our lord, Lord Eugenius the Fourth,
    Pope by divine providence, on Saturday, the eve of Pentecost, at about the hour of terce, in the house
    of the noble Mścichnaᵇ, wife of Otto, heir in Trąbczyn, the honourable Lord Wojciech, son of Otto
    of Trąbczyn, canon of Kruszwica¹, being present in person, in all the better manner, way, form of
    law and style in which he could, made, set up and solemnly appointed as his true, lawful and undoubted
    proctor, agent, factor and manager of his affairs the noble Jan, his brother german, heir in Trąbczyn²,
    who was present and took the charge of the proxy upon himself of his own will, giving him full and
    every power to demand, take, collect and dispose of at his pleasure, receive, and make a pact of not
    asking further, from the venerable man Lord Jarand, scholastic of Kruszwica, canon of the churches
    of Włocławek and Wieluń³, seventy Hungarian florins, on account of the agreement made by the venerable
    lords Jan of Niewiesz, dean⁴, Świętosław of Wrząca, archdeacon and official of Włocławek⁵, Maciej
    Dryja, dean⁶, and Mikołaj of Głęboczek, archdeacon of Poznań⁷, concerning the canonry and prebend
    of the collegiate church of Wieluń between Wojciech on the one part and Jarand on the other, to give
    letters of quittance under his name and seal, and in general to do all and each of the things that
    are needful concerning what has been so received, collected and acquitted. Concerning all which etc.


    And I, Jo(hannes)⁸ etc., since at the said appointment and all the other things etc.


    ᵃSo the copy, instead of quarto, as follows from the other elements of the dating (indiction, pontificate);
    but it cannot be ruled out that this is a dating in the Pisan style.


    ᵇSo the copy.


    ¹Trąbczyn, a parish village south-east of Zagórów in the Konin land (Koz. 5, p. 414). Otto, Ota, occurs
    still in 1426 (Roty V, no. B455). Mścichna, Otto''s wife, not otherwise known. Her son Wojciech, canon
    of Kruszwica, not otherwise known.


    ²Jan of Trąbczyn, son of Otto, brother of the canon Wojciech and of a younger brother, Tomasz Ocic,
    hard to tell apart from his namesake who occurs at the same time in Trąbczyn.


    ³Jarand son of Stanisław, scholastic of Kruszwica and canon of Włocławek already in 1432 (BullPol
    V, no. 111), most probably the same as Jarand of Niewiesz, later also canon of Gniezno in 1441 and
    official in 1450–51, d. 1451 (GąsSkOf, pp. 79, 85).


    ⁴Jan son of Chebda of Niewiesz.


    ⁵Świętosław son of Alberyk of Wrząca (north-east of Koło), canon of Włocławek 1412, custodian 1426,
    canon of Płock 1413, of Poznań 1429, archdeacon and official of Włocławek, d. 1471 (Radzimiński II,
    pp. 147–148).


    ⁶Maciej Dryja of Modliszewo.


    ⁷Mikołaj of Głęboczek.


    ⁸The public notary Jan of Łęczyca (as in the next document) not identified. [Ju]'

  en: 'Document no. 733


    Ląd, 13 June 1414


    Notarial instrument. Mikołaj Kicki, archdeacon of Gniezno, attests the handing over of the parish
    church at Zagórów to the Cistercian monastery at Ląd.


    Original: Warsaw, AGAD, parchment document 1930. Parchment 290 × 422–409 + 39 mm. Notary''s sign:
    on 3 steps a cross set in a square, its arms ending in lilies that stand out beyond the square. At
    the crossing of the arms a four-petalled rosette. At the foot of the cross the letter m. On parchment
    strips 3 seals in yellow wax: 1. round, about 23 mm across, with the Godziemba arms, legend illegible
    (of Mikołaj Kicki); 2. pointed oval, about 37 mm wide, with the image of a standing figure under a
    canopy (?), legend illegible, partly crumbled (of Abbot Gerard?); 3. round, about 50 mm across, with
    the image of the enthroned Madonna, legend illegible (of the monastery of Ląd). On the back notes
    on the content and shelfmarks (15th–18th century).


    ᵃIn the name of the Lord, amen. We, Mikołaj, archdeacon and canon of the holy church of Gniezno¹,
    make | known by the tenor of these presents to all that, whereas the venerable and religious men,
    the brothers Lord Gerard, abbotᵇ, and the convent | of the monastery of Ląd of the Cistercian Order
    of the diocese of Gniezno² had procured that the parish church in Zagórów of the said diocese³ | be
    incorporated by the Apostolic See into the said monastery, for bearing the burdens of the hospitality
    of the said monastery, so that whenever that church fell vacant by the resignation or death of its
    rector for the time being, the lord abbot with his convent might freely take and lawfully keep bodily
    possession of that church, without asking the leave of the diocesan of the place or of anyone, and
    turn its fruits, revenues and incomes to the use of the said monastery, and have the church governed
    by a fit professed brother of that monastery, removable at the willᶜ of the lord abbot and convent
    whenever it seems good to them, as is set out more fully in the apostolic letters of the late Gregory
    the Twelfth⁴ and in the process of the executor appointed for this; in consideration therefore of
    this hospitality and these burdens the discreet man Lord Paweł, rector of the said church in Zagórów⁵,
    having special love for the said monastery and wishing that the said grace of incorporation should
    have its due effect, has of his own will and freely, not compelled nor led astray by fraud, given
    up and ceded the same church and its possession to the same lord abbot and convent, keeping for himself
    suitable food and clothing for the rest of his life. And the said Lord Gerard, abbot, with his convent,
    wishing to repay such great love to the same Lord Paweł with a benefit, has graciously taken the same
    Lord Paweł into the house of the said monastery for his fitting support. For his food he has assigned
    him the abbot''s table, and for his clothing at each of the Ember seasons through the year a mark
    and a half, and also one tunic of the cloth usually given to the brothers of the convent, of eight
    ells, and also a fur, if he needs it, of lambskins, and also four pairs of shoes each year for the
    rest of his life, all to be faithfully supplied to the same Lord Paweł by the same Lord Gerard, abbot,
    and his successors and the convent; the same lord abbot shall also be bound to keep at his own cost
    a servant needed for the service of the said Lord Paweł, whose wages the same Lord Paweł will provide.
    And the same Lord Paweł has assigned and bequeathed to the said monastery, for the remedy of his soul,
    all and each of the foregoing things left after his death, in whatever goods or sums of money they
    may be. And we, Gerard, the said abbot of Ląd, with the brothers of our convent, promise in good faith
    to hold and keep all the foregoing expressed above to the same Lord Paweł, and to keep them we bind
    ourselves and our successors in good faith; and if, which God forbid, the foregoing should be broken
    by us or our successors, and the said Lord Paweł not be provided with the said food and clothing according
    to the needs of a priest''s state, as is expressed above, then, lest the same Lord Paweł be seen to
    beg and suffer want to the shame and disgrace of the honour of the clergy, it shall be lawful for
    him to have recourse to taking the fruits, revenues and incomes of the same church and maintaining
    himself from them, in which fruits he is not to be disturbed in any way by us or our successors. And
    if he should be disturbed, then of our own will and freely we subject ourselves and our successors
    in this respect to the jurisdiction and coercion of the said Lord Mikołaj, archdeacon, and his successors,
    and we take upon ourselves the sentences of excommunication and interdict, in so far as he shall have
    pronounced them against us and the said monastery and the church of the monastery for the foregoing,
    and promise to obey them and keep the church interdict, renouncing in the foregoing the privileges
    of exemption of the said monastery and order granted by any Roman pontiffs or other ordinaries, and
    also the exceptions and appeals and the help of the laws and canons that belong or might in any way
    belong to us and our said successors, by which the said submission and coercion to be done by the
    said lord archdeacon might in any way be hindered, which we wish to avail us and our successors in
    nothing. In faith and testimony of all and each of the foregoing we have ordered these present letters
    or this present public instrument to be written and published by the notary written below and to be
    strengthened by the hanging of our seals and those of the said convent. Done and given in the monastery
    of Ląd in the year of the Lord one thousand four hundred and fourteen, in the seventh indiction, in
    the fifth year of the pontificate of the most holy father and our lord in Christ, Lord John the Twenty-third,
    Pope by divine providence, on Wednesday the thirteenth day of the month of June, at about the sixth
    hour, there being present the religious men, the lords: Jan, prior⁶, Feliks, rector of the parish
    church in Ląd⁷, Goblin, bursar⁸, Syfryd, cellarer⁹, and Gerard, brothers¹⁰ of the said convent of
    Ląd, and also the noble and discreet Trojan and Marcin, heirs of Kiki¹¹, and Przybysław, servant of
    the church of Zagórów¹², witnesses called and asked specially to the foregoing.


    Notary''s sign. And I, Maciej, son of the late Jan Linko, cleric of Gniezno, public notary by imperial
    authority¹³, since I was present together with the witnesses named above at the said giving up, promise
    and ordinance and at all and each of the foregoing while they were being done and made as is set out
    above, and saw and heard them done so, therefore, writing with my own hand, I have subscribed here
    and brought this into this public form, signing it with my usual and accustomed sign and name, asked
    and requested, in faith and testimony of all and each of the foregoing.


    ᵃAn initial the height of the whole text of the original.


    ᵇabb as in the original, an erasure in the middle.


    ᶜreading not quite certain. Mikołaj Kicki, see above, no. 439/8.


    ²Abbot Gerhard, see above, no. 412/9.


    ³Zagórów, a town in the district of Konin, the property of the monastery of Ląd.


    ⁴Gregory XII, Roman pope 1406–1409 (1415), d. 1417. His letter concerning Zagórów not otherwise known.


    ⁵The parish priest Paweł not otherwise known, though perhaps the same as the one mentioned in the
    necrology of Ląd (MPH V, p. 498).


    ⁶The prior Jan not identified.


    ⁷The parish priest Feliks occurs only here, perhaps the same as the monastery''s steward of 1395 (KDW
    VI, no. 342/5), prior in 1411 (KDW V, no. 191), d. 1418 (MPH V, p. 484).


    ⁸Gobelin occurs already in 1411 (KDW V, no. 191) and still in 1431 and 1433 (KDW IX); compare also
    MPH V, pp. 492, 498, and the prior of that name in 1402 and 1404 (KDW V, pp. 27 and 37).


    ⁹Zewrzyd occurs as cellarer from 1402 (KDW V, pp. 28 f.), perhaps the same as the later abbot Zygfryd
    1418–1428, d. 1429 (MPH V, p. 494).


    ¹⁰Gerard not identified.


    ¹¹Kiki in the land of Sieradz (Zajączkowscy, Materiały, I, p. 129). Trojan and Marcin were probably
    kinsmen (brothers?) of Mikołaj Kicki.


    ¹²Przybysław occurs only here.


    ¹³Maciej not identified.'

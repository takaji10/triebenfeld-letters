  en: 'Document no. 1044


    Władysław, King of Poland etc., 9 August 1324, at Pyzdry; gives the monastery of Ląd the site of a
    water mill on the river Warta below the castle of Pyzdry, and confirms its possession of certain villages.


    Original on parchment. On a cord of green silk the seal of Władysław the King is hung (seal XLIV).
    Warsaw. The Rusiecki collection. Diplomata.


    In the name of the Lord, amen. As the frailty of the human condition cannot escape temporal death,
    so no deed done in the shifting time can obtain the strength of firmness, unless it is renewed in
    writing and strengthened with the protection of a seal. Hence we, Władysław, by the grace of God King
    of Poland, Duke of Kraków, of Sandomierz, of Sieradz, of Kujawy and of Łęczyca, make known to present
    and to come, that, for the honour of our Lord Jesus Christ and of his pious and glorious mother, the
    ever-virgin Mary, in remission of our sins and of all our forefathers'', and on account of the great
    desolation and destruction which we worked upon the house of Ląd of the Cistercian Order when we were
    in Poland with our army, we have bestowed on the said house and its brothers the site of a water mill
    below the castle of Pyzdry on the river Warta, which is known to belong to our lordship and kingdom,
    to be possessed by hereditary right, granting to the brothers of the said house every liberty to build
    a mill in that place at their own pleasure, or to repair anew the old mill that belongs to them. Lest
    therefore this our gift be troubled by anyone in the future, we will and command all the captains,
    castellans, procurators, advocates, consuls, aldermen and every citizen constituted in the town of
    Pyzdry, that they in no way impede, nor presume to impede, the said brothers in building or repairing
    the mill, wherever they wish in the two places aforesaid. Moreover, for the regard of the divine reward
    alone, we confirm to the said house of Ląd these estates written below, given to them by the nobles
    of Poland by hereditary right, or honestly bought by the brothers themselves, nevertheless receiving
    them into our defence, namely Mynzelino, Zramlyz, Bronchowo, Cysowo, Wardosino, Wszonowo, Wronchyno,
    with the lake which is called Seborowo. We also will that the people of the said villages enjoy the
    same liberty which is contained more fully in the founding privilege of our great-grandfather of blessed
    memory, Mieszko the Great, illustrious Duke of Poland. Given and done at Pyzdry with suitable witnesses:
    Klemens, palatine of Sieradz, Count Piotr, castellan of Poznań, Count Slavanta, castellan of Kalisz,
    Count Mikołaj, castellan of Biechów, and Piotr, vice-chancellor and canon of Kraków, in the year of
    the Lord 1324, on the vigil of the blessed Laurencjusz, martyr and levite. In testimony of which we
    have ordered the present document to be strengthened with the protection of our seal.


    Lendensis, of Ląd. Mynzelino, Mycielin. Zramlyz, Chrzamlice. Bronchowo, Bronki. Cysowo, Czyżew. Wardosino,
    Wardężyn. Wszonowo, Sczonów. Wronchyno, Wrąbczyn. Lacus Seborowo, today a marsh north of Wrąbczyn.
    Pyser, Pyzdry. Bechoviensis, of Biechów.'

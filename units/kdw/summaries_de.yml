# German summaries of BK PAN Kodeks Dyplomatyczny Wielkopolski, written in the working session from the Latin text and the editors' Polish of
# each whole entry of the Kodeks (intake/english_kdw.py, 2026-10-16).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
kdw-001: "Herzog Mieszko von Polen schenkt dem Zisterzienserkloster Ląd, seiner Gründung, auf Bitten des Abtes Bertold das Gut „parvum Vronchin“, heute Wrąbczynek, mit Salz, Seen, Fischerei und Jagd, frei von allen polnischen Rechten, zu erblichem Besitz. Gnesen, 31. August 1173. Kodeks Dyplomatyczny Wielkopolski I, Nr. 20, nach dem Original im Besitz der Fürsten Czartoryski; die Schrift scheint nach den Herausgebern aus der ersten Hälfte des 13. Jahrhunderts zu sein."
kdw-002: "Erzbischof Fulko von Gnesen gibt dem Kloster Ląd die Zehnten der Kapellen St. Peter und St. Andreas, darunter die aus Zagórów, Skokum, Kopojno, Trąbczyn, Szetlew, Łukom und Wrąbczyn, auch wenn die Dörfer geteilt, verlegt oder anders genannt werden. Ohne Ort, 30. September 1240; die Herausgeber setzen „sic“ zum Jahr. Kodeks Dyplomatyczny Wielkopolski I, Nr. 222, aus dem Privilegienbuch B von Ląd."
kdw-003: "Herzog Przemysł von Polen gibt mit seinem Bruder Bolesław und ihrer Mutter Jadwiga das Spital von Gnesen den Kanonikern vom Heiligen Grab in Miechów unter ihrem Propst Heinrich, mit Zustimmung des Erzbischofs Fulko; das Spital soll Kranke und arme Schüler versorgen. Die Dörfer des Spitals werden aufgezählt und von Lasten befreit. Gnesen, in der Spitalkirche, 4. Mai 1243. Kodeks Dyplomatyczny Wielkopolski I, Nr. 238. Keines der Güter um Trąbczyn kommt darin vor."
kdw-004: "Herzog Bolesław von Polen bestätigt dem Kloster Ląd die Güter und Freiheiten, die Herzog Mieszko ihm bei der Gründung 1145 gegeben hatte, und fügt neue hinzu. Darunter sind Szetlew mit den Köchen, Rzgów mit den Kirchendienern (nach den Herausgebern Świątniki), und Zagórów, Skokum und Oleśnica, die polnische Adlige dem Kloster gegeben hatten; Kopojno nennt eine Grenze. Sechowa, 10. Dezember 1261. Kodeks Dyplomatyczny Wielkopolski I, Nr. 393, aus dem Privilegienbuch B von Ląd."
kdw-005: "Herzog Bolesław von Polen gibt das Dorf Trąbczyn („Trupcino“) dem Grafen Mikołaj, Schatzmeister von Ląd, und seinen Erben, frei von den herzoglichen Lasten. Das Dorf hatte der Herzog zuvor dem Grafen Janko, Sohn des Szymon, und dann einem Priester Mikołaj gegeben, die beide ohne Erben starben. Dłusk, 27. März 1276. Kodeks Dyplomatyczny Wielkopolski I, Nr. 460, nach dem Original mit den Siegeln der Herzöge Bolesław und Przemysł."
kdw-006: "Herzog Przemysł II. erneuert das Privileg Herzog Mieszkos für das Kloster Ląd: er bestätigt dessen Dörfer mit ihren Leuten, Abgaben und Diensten, darunter Szechouo mit den Köchen (nach den Herausgebern wohl Szetlew) und Irgouo mit den Kirchendienern (nach den Herausgebern Świątniki), drei Märkte mit Krügen, und befreit die Leute von allen herzoglichen Lasten und Gerichten. Kalisch, 18. Oktober 1280. Kodeks Dyplomatyczny Wielkopolski VI, Nr. 27."
kdw-007: "Herzog Przemysł II. von Großpolen bestätigt den Tausch der Güter des Klosters Ląd, Głowiew, Sławsk und Chocicza, gegen das Gut Kopojno des Grafen Sędziwój, Unterkämmerers, und stattet Kopojno mit den weitesten Freiheiten aus. Gnesen, 21. Oktober 1291. Kodeks Dyplomatyczny Wielkopolski II, Nr. 678, nach dem Original."
kdw-008: "Herzog Przemysł II. von Polen bestätigt einen fünf Jahre früher geschlossenen Tausch: Wojsław, Sohn des Gosław, gibt sein Gut Niałek gegen die Güter Wrąbczyn („Wroncino“) und Bieganin des Wisław, Sohn des Gerlach. Kalisch, 29. September 1292. Kodeks Dyplomatyczny Wielkopolski II, Nr. 685, nach dem Original."
kdw-009: "Dobiesław, Richter der Länder Gnesen und Kalisch, spricht der Kirche von Gnesen die Güter Stropiszyn und Pępocin zu, gegen die Ansprüche der Brüder Jan und Przedpełk, Erben von Trąbczyn, und das Gut Kokanin gegen die Klage des Pietrasz, Erben von Rzegocin. Pyzdry, 13. November 1346. Kodeks Dyplomatyczny Wielkopolski II, Nr. 1252, aus einem Privilegienbuch des Gnesener Kapitels."
kdw-010: "Dobiesław, Richter der Länder Gnesen und Kalisch, spricht der Kirche von Gnesen die Güter Stropiszyn und Pępocin zu, gegen die Ansprüche Andrzejs, Erben von Trąbczyn, und seiner Verwandtschaft, denen ewiges Schweigen auferlegt wird. Pyzdry, 13. November 1346, am selben Tag wie das vorige Urteil. Kodeks Dyplomatyczny Wielkopolski II, Nr. 1253."
kdw-011: "Przecław, Wojewode von Kalisch, und die anderen Richter erklären vor König Ludwig, dass die Dörfer Wrąbczynek und Adamierz mit der Mühle bei der Stadt Pyzdry seit alters dem Kloster Ląd gehören. Gnesen, 27. Mai 1377. Kodeks Dyplomatyczny Wielkopolski III, Nr. 1739, nach dem Original mit sechs Siegeln."
kdw-012: "Mikołaj von Wenecja, Richter von Kalisch, spricht in einem Streit zwischen Piotrko, Erben von Łęg, und Rudger, dem Schlüsselträger des Klosters Ląd, dem Kloster die Investitur des Gutes „Vronczino“ zu; Piotrko und sein Bruder dürfen es auf dem Rechtsweg weiter fordern. Nach den Herausgebern ist Wrąbczyn oder Wrąbczynek gemeint. Posen, 31. Januar 1384. Kodeks Dyplomatyczny Wielkopolski VI, Nr. 283, nach dem Original."
kdw-013: "Erzbischof Dobrogost von Gnesen entscheidet im Streit zwischen dem Kloster Ląd und Jan, dem Pfarrer von Trąbczyn: der Garbenzehnte der Felder des Dorfes Trąbczyn gehört dem Kloster. In der Steinstube des Klosters Ląd, 13. Oktober 1399. Kodeks Dyplomatyczny Wielkopolski III, Nr. 2014, aus dem Privilegienbuch von Ląd."
kdw-014: "König Władysław II. von Polen erlaubt dem Abt Gerhard und dem Konvent von Ląd, in ihrem Dorf Zagórów im Bezirk Konin eine Stadt zu gründen, und gibt ihr deutsches, Magdeburger Recht, befreit von der Gerichtsbarkeit der königlichen Amtsträger, mit einem Wochenmarkt am Mittwoch. Niepołomice, 19. November 1407. Kodeks Dyplomatyczny Wielkopolski V, Nr. 117."
kdw-015: "Abt Gerhard von Ląd tauscht mit Piotr, Schulzen in Nowe Zagórowo, auch Drzewiec genannt, das Schulzenamt in Drzewiec gegen das in Kownaty, und verkauft ihm dort anderthalb Hufen für zwölf Mark; das Dokument setzt die Freijahre, Zinsen und Dienste des Schulzen und der Bauern von Kownaty fest. Ląd, 30. November 1411. Kodeks Dyplomatyczny Wielkopolski V, Nr. 191, aus dem Kölner Kopialbuch von Ląd."
kdw-016: "Notariatsinstrument: Mikołaj Kicki, Archidiakon von Gnesen, beurkundet, dass Paweł, Pfarrer von Zagórów, die Pfarrkirche von Zagórów, die der Papst dem Kloster Ląd inkorporiert hatte, dem Abt Gerard und dem Konvent abtritt; dafür nimmt das Kloster ihn auf Lebenszeit mit Kost, Kleidung und einem Diener auf. Ląd, 13. Juni 1414. Kodeks Dyplomatyczny Wielkopolski VII, Nr. 733, nach dem Original. Ein Przybysław, Kirchendiener von Zagórów, ist Zeuge."
kdw-017: "Jan von Szczekociny, Generalstarost von Großpolen, beurkundet, dass die Brüder Swanseck und Supracht von Gulczewo dem Abt Gerhard und dem Konvent von Ląd ihren Grund bei der Kirche St. Laurentius in der Gnesener Vorstadt für sechzehn Mark verkauft haben. Unter den Zeugen sind Mikołaj und Andrzej von Trąbczyn. Gnesen, 16. April 1415; die Abschrift hat 1414, nach den Herausgebern ein Schreibfehler. Kodeks Dyplomatyczny Wielkopolski VII, Nr. 755."
kdw-018: "Abt Zygfryd und der Konvent von Ląd tauschen mit dem Bauern Wawrzyniec Jeleniowicz ihr Vorwerk in Groß-Wrąbczyn mit den Wiesen Obroczna und Dokolowka gegen sein Vorwerk in Drzewce, und geben ihm für seine Bienenstöcke im Wald zwischen Groß-Wrąbczyn und Zagórów vier Gärtner; er zahlt anderthalb Mark Zins und hütet den Wald. Ląd, 3. Juni 1418. Kodeks Dyplomatyczny Wielkopolski V, Nr. 280. Die Anmerkung der Herausgeber setzt Wronczyn in den Kreis Posen, der Text aber neben Zagórów."
kdw-019: "Notariatsinstrument: Wojciech, Sohn des Otto von Trąbczyn, Kanoniker von Kruszwica, bestellt im Haus seiner Mutter Mścichna in Trąbczyn seinen Bruder Jan, Erben in Trąbczyn, zum Bevollmächtigten, um von Jarand, Scholaster von Kruszwica, siebzig ungarische Gulden einzuziehen, die ihm aus einem Vergleich über eine Pfründe in Wieluń zustehen. Trąbczyn, 15. Mai 1434; die Abschrift hat 1435, nach den Herausgebern statt 1434. Kodeks Dyplomatyczny Wielkopolski XI, Nr. 2000."
kdw-020: "König Władysław III. schreibt Stanisław Czarny 300 Mark auf die königlichen Dörfer Wrąbczynek, Adamierz und Borzykowo im Bezirk Pyzdry, bis sie ihm zurückgezahlt sind: hundert Mark für ein Pferd, zweihundert für seine Dienste auf der Reise nach Ungarn zur Krönung. Buda, 10. August 1440. Kodeks Dyplomatyczny Wielkopolski X, Nr. 1520, aus der Kronmetrik."
kdw-021: "König Władysław III. schreibt Stanisław Czarny von Pietrzyków für seine Dienste bei der Krönung in Ungarn weitere 200 Mark auf die Dörfer Adamierz, Borzykowo und Wrąbczynek, die er aus der Hand des Bartosz Płomikowski auslösen darf. Buda, 22. November 1440. Kodeks Dyplomatyczny Wielkopolski X, Nr. 1532, aus der Kronmetrik."

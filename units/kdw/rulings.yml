dates:
  # [year, month, day, precision]: the document's own date, as the editors'
  # heading or the dateline gives it.
  read:
    "1": [1173, 8, 31, "day"]   # Mieszko gives 'parvum Vronchin', Wrąbczynek, to the Cisterci, vol. 1 no. 20
    "2": [1240, 9, 30, "day"]   # the tithes of Zagórów, Skokum, Kopojno, Trąbczyn, Szetlew, Ł, vol. 1 no. 222
    "3": [1243, 5, 4, "day"]   # the hospital of Gniezno given to the Holy Sepulchre of Miech, vol. 1 no. 238
    "4": [1261, 12, 10, "day"]   # the possessions of Ląd confirmed: Szethowo (Szetlew), the Sa, vol. 1 no. 393
    "5": [1276, 3, 27, "day"]   # Trąbczyn given to Count Nicholas, treasurer of Ląd, vol. 1 no. 460
    "6": [1280, 10, 18, "day"]   # the possessions of Ląd confirmed: Szechouo (probably Szetlew, vol. 6 no. 27
    "7": [1291, 10, 21, "day"]   # Kopojno exchanged to Ląd for Głowiew, Sławsk and Chocicza, vol. 2 no. 678
    "8": [1292, 9, 29, "day"]   # the exchange of Wroncino (Wrąbczyn) and Bieganin for Niałek , vol. 2 no. 685
    "9": [1346, 11, 13, "day"]   # Stropiszyn and Pępocin adjudged to the church of Gniezno aga, vol. 2 no. 1252
    "10": [1346, 11, 13, "day"]   # the same, against Andrzej, heir of Trąbczyn, and his kin, vol. 2 no. 1253
    "11": [1377, 5, 27, "day"]   # the judges attest that Wrąbczynek with Adamierz belong to Lą, vol. 3 no. 1739
    "12": [1384, 1, 31, "day"]   # Vronczino adjudged to Ląd; the editors: Wrąbczyn or Wrąbczyn, vol. 6 no. 283
    "13": [1399, 10, 13, "day"]   # the sheaf tithe of Trąbczyn adjudged to Ląd against the pari, vol. 3 no. 2014
    "14": [1407, 11, 19, "day"]   # the King allows Ląd to found a town at Zagórów, vol. 5 no. 117
    "15": [1411, 11, 30, "day"]   # the abbot of Ląd exchanges with the schultheiss of Nowe Zagó, vol. 5 no. 191
    "16": [1414, 6, 13, "day"]   # the parish church of Zagórów handed over to Ląd, vol. 7 no. 733
    "17": [1415, 4, 16, "day"]   # a plot at Gniezno sold to Ląd; Mikołaj and Andrzej of Trąbcz, vol. 7 no. 755
    "18": [1418, 6, 3, "day"]   # the abbot of Ląd exchanges the farm in Wrąbczyn Wielki for o, vol. 5 no. 280
    "19": [1434, 5, 15, "day"]   # Wojciech of Trąbczyn, canon of Kruszwica, empowers his broth, vol. 11 no. 2000
    "20": [1440, 8, 10, "day"]   # the King charges 300 marks on Wrąbczynek, Adamierz and Borzy, vol. 10 no. 1520
    "21": [1440, 11, 22, "day"]   # the King charges 200 marks on Adamierz, Borzykowo and Wrąbcz, vol. 10 no. 1532

# Editorial rulings for BK PAN Kodeks Dyplomatyczny Wielkopolski.
#
# Each document is one entry of the Kodeks (intake/holding.py, ENTRIES, in
# order of date). The place, date, type, language, estates and citation of
# every document are written by `holding.py --write` from ENTRIES: change
# ENTRIES, not them. "4": "Sechowa" is the place as the document writes it
# (the editors: Czechowo or Szetlew); "2" has none ("s. l.").


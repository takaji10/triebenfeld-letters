# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One small exercise book of pencil notes in German, from the papers of
  Albert Breyer (1889-1939), a teacher at the German school in Sompolno and a
  historian of the German settlements in central Poland. He wrote it in July
  1936 in Łazińsk and Emilienheim, Protestant German settlements of the
  commune of Trąbczyn, from what the people there told him: the land of the
  settlements and how it was divided and classed, the schools and their
  teachers, cantors and pupils, hymn books, emigration to Volhynia, Russia,
  America and Brazil, servitudes granted by the Trąbczyn estate, the
  parcelling of the manor's remaining land, field names, turns of speech,
  houses, barns and grave boards. The last pages, written from the back,
  are a log of his photographs, one of them headed July 1935.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Field notes in German, in pencil, written fast and much shortened ("d."
  der/die/das, "i." in, "u." und, "Gem." Gemeinde, "Holl." Holland or
  Hauland, "Morg." Morgen, "Bl." Blende, "Gf." Gelbfilter). They are not
  sentences: give them as notes. "Holland" and "Hauland" are the edition's
  Hollander or Olęder settlements; "Kaveln", "Baustücke", "Viermorgen" are
  kinds of plot; "Bruch" is marsh land and "Brücher" its people; "Restgut"
  is what was left of the manor after parcelling; "Servitut" a right of
  pasture or wood; "Rejent" a notary. Quoted words are local speech or
  field names and stay as written. In the photograph log a line gives the
  number of the exposure, the subject, the aperture, the filter or "ohne",
  the exposure time and the hour. A word followed by [?] or written [word?]
  is one read with doubt; [?] alone is a word not read.

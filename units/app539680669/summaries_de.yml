# German summaries of APP 53/968/0/-/669, written in the working session from the German as read (intake/holding.py, 2026-10-14).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
app539680669-001: "Notizbuch Albert Breyers, mit Bleistift geschrieben, auf dem Umschlag „Juli 1936“, „Łazinsk“ und „Emilienheim“: Notizen nach den Angaben der Bewohner der deutschen Siedlungen der Gemeinde Trąbczyn. Die Kolonie Łazińsk, bei der der Stempel ihres Schulzen im Heft steht, hat 2040 Morgen und 250 Wirte; vom Gut Trąbczyn erhielt sie um 1880, mit Fragezeichen, Servitute, die beim Notar dem alten Land zugeschrieben wurden und hoch besteuert sind. Breyer fragt, wann das Restgut Trąbczyn parzelliert wurde, das Jesse kaufte und das heute Włodzimierow heißt. Er notiert die Lehrer in Łazińsk: Mielke seit 1925, Klingbeil 9 Jahre, Ed[uard] Zelmer 34 Jahre, Radke 10 Jahre, Rasch 50 Jahre, der noch mit 80 Jahren unterrichtete; am ersten Unterrichtstag waren 186 Kinder in der Schule, und zehn Jahre lang hatte ein Lehrer 170 Schüler. Die Militärbehörden klagten beim Unterrichtsministerium, die Rekruten der Gemeinde Trąbczyn könnten nicht Polnisch. Viele sind nach Wolhynien ausgewandert, aus Łazinsk auch nach Russland und zurück, andere nach Amerika und Brasilien. Emilienheim wurde an Drzewce angeschlossen, weil 11 Personen zur Zahl 200 fehlten. Weiter: Heiratskreise, Gesangbücher aus Breslau und Züllichau, Flurnamen, Redensarten der „Brücher“ („ick war do“), Häuser, Scheunen und hölzerne Grabbretter. Die letzten Seiten sind ein Verzeichnis seiner Aufnahmen; eine davon trägt die Überschrift „Juli 1935“ und nennt Gostynin, Leonberg und Grabie."
app539680669-002: "Zweites Notizbuch Albert Breyers vom Juli 1936, mit Bleistift geschrieben, auf dem Umschlag „V. Grodziec Juli 1936“; es handelt jedoch von Łazińsk und den Nachbarorten. Vor 65 Jahren seien im März sehr viele aus Łazińsk nach Russland gegangen, einen Monat zu Fuß; kurz vor dem Krieg seien auch Leute aus Wolhynien zurückgekehrt. Włodzimierów sei vor 25 Jahren vom Gut Trąbczyn parzelliert worden, dessen Besitzer Graf Miączyński hieß, fast alles an Deutsche; das Restgut hatte etwa 60 Morgen, Jesse kam aus Białobłoty. Auf Waldland des Gutes Trąbczyn, das ein Jude gekauft und 5–6 Jahre vor dem Krieg an Deutsche weiterverkauft hatte, liegt die Neusiedlung „Trompczyn D.“ mit Bochenski, Kinast, Retzlaff, Schwarz, Lipelt, Schmechel und einem Polen. In Łazińsk ist nach dem Arzt Brede in Zagórów die Schwindsucht verbreitet; beim Gebet kniet die Gemeinde. Deutsche aus Łazińsk erhielten durch die Kolonisationskommission drainiertes Land und wurden in Ostfelde bei Września von den Polen vertrieben. Weiter: Lehrer und Küster von 1895 bis 1928, Plattdeutsch und Kaschubisch, Servitute von den Gütern Biała, Niniew und Chocz, Ständer- und pommersche Scheunen, Grabbretter in Kazimierka und Józefów und uneheliche Kinder. Die letzte Seite nennt Jahreszahlen: ein Züllichauer Gesangbuch von 1744, Alt-Kazimierka 1782, Józefów 9. November 1790, „vom Gute Chocz“, dessen Besitzer Lipski hieß."

- {claim: "Lehrer in Łazińsk: Mielke seit 1925, Klingbeil 9 Jahre, Ed. Zelmer 34 Jahre, Radke 10 Jahre, Rasch 50 Jahre", verdict: supported, where: "p. 17: Lehrer i. Łazinsk: Mielke seit 1925. Klingbeil war 9 Jahre. Zelmer Ed. war 34 Jahre. ... Radke 10 Jahre / Rasch 50 Jahre"}

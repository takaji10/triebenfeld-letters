# The claim check of the German summary of APP 53/968/0/-/669, made in session
# on 2026-10-14 under the rules read_letters.py --verify gives its checker:
# each statement held to the document, as supported, overstated or
# unsupported, and the summary only weakened or cut. Not the paid run. The
# document was read in the corpus text as read from the scans; page numbers
# are the document's (1 the cover, 2 inside the front cover, 3 = 0002_a2 ...).
#
# Result: 16 statements, 14 supported, two overstated and weakened. The
# first draft said the village mayor "versah das Heft mit seinem Stempel":
# the stamp is in the notebook beside "Kolonja Łazińsk", but who put it
# there the page does not say. And it put the 170 pupils "in der Schule" of
# Łazińsk: the note does not name the school. Nothing in the summary rests
# on a word marked as doubtful.

app539680669-001:
- {claim: "Notizbuch Albert Breyers, mit Bleistift geschrieben, auf dem Umschlag Juli 1936, Łazinsk und Emilienheim", verdict: supported, where: "p. 1: Juli 1936 / Łazinsk / Emilienheim; the archive's unit is from Breyer's papers"}
- {claim: "Notizen nach den Angaben der Bewohner der deutschen Siedlungen der Gemeinde Trąbczyn", verdict: supported, where: "pp. 9, 17, 24-28: Alter Krüger; Mielke; Bei Schultz; Der Vater d. alten Schultz; p. 10: GMINA Trąbczyn"}
- {claim: "die Kolonie Łazińsk, bei der der Stempel ihres Schulzen im Heft steht, hat 2040 Morgen und 250 Wirte", verdict: supported, where: "p. 10: Kolonja Łazińsk. / GROMADA ŁAZIŃSKA KOLONJA / SOŁTYS / GMINA Trąbczyn / 2040 Morgen. / Wirte 250 Wirte. First written as 'deren Schulze das Heft mit seinem Stempel versah': overstated, weakened"}
- {claim: "vom Gut Trąbczyn erhielt sie um 1880, mit Fragezeichen, Servitute, die beim Notar dem alten Land zugeschrieben wurden und hoch besteuert sind", verdict: supported, where: "p. 11: Servitut bekommen vom Gute Trombczyn um 1880? ... Die Servitute wurden zum alten Land beim Rejenten zugeschrieben, müssen auch davon hohe Steuern zahlen."}
- {claim: "Breyer fragt, wann das Restgut Trąbczyn parzelliert wurde, das Jesse kaufte und das heute Włodzimierow heißt", verdict: supported, where: "p. 26: Wann parzelliert Restgut Trąbczyn? Jesse gekauft, wann? Heisst heute Włodzimierow. Also p. 7: Restgut Trąbczyn. Jesse gekauft, wann?"}
- {claim: "Lehrer in Łazińsk: Mielke seit 1925, Klingbeil 9 Jahre, Ed. Zelmer 34 Jahre, Radke 10 Jahre, Rasch 50 Jahre", verdict: supported, where: "p. 17: Lehrer i. Łazinsk: Mielke seit 1925. Klingbeil war 9 Jahre. Zelmer Ed. war 34 Jahre. ... Radke 10 Jahre / Rasch 50 Jahre"}
- {claim: "Rasch, der noch mit 80 Jahren unterrichtete", verdict: supported, where: "p. 18: Rasch war noch mit 80 Jahren Lehrer, hier in Łazinsk gestorben."}
- {claim: "am ersten Unterrichtstag waren 186 Kinder in der Schule", verdict: supported, where: "p. 17: Im ersten Unterrichtstag waren i. d. Schule 186 Kinder."}
- {claim: "und zehn Jahre lang hatte ein Lehrer 170 Schüler", verdict: supported, where: "p. 15: 10 Jahre hindurch 170 Schüler bei einem Lehrer. First written as 'in der Schule' of Łazińsk: the note does not name the school; weakened"}
- {claim: "die Militärbehörden klagten beim Unterrichtsministerium, die Rekruten der Gemeinde Trąbczyn könnten nicht Polnisch", verdict: supported, where: "p. 15: Militärbehörden beklagten sich im Unter.-Min., dass die Rekruten d. Gem. Trąbczyn nicht polnisch können."}
- {claim: "viele sind nach Wolhynien ausgewandert, aus Łazinsk auch nach Russland und zurück, andere nach Amerika und Brasilien", verdict: supported, where: "p. 7: Nach Wolhynien sind viele ausgewand.; p. 16: Aus Łazinsk sind nach Russland gegangen kamen auch zurück.; p. 29: Nach Amerika viel gezogen; p. 26: Eine Tante d. Krügers ... nach Brasilien"}
- {claim: "Emilienheim wurde an Drzewce angeschlossen, weil 11 Personen zur Zahl 200 fehlten", verdict: supported, where: "p. 20: Emilienheim angeschlossen an Drzewce, weil 11 Person fehlten zur Zahl 200."}
- {claim: "Heiratskreise, Gesangbücher aus Breslau und Züllichau", verdict: supported, where: "pp. 3-4: verschwägert ... heiraten aus Orlin; p. 7: Meist Breslauer Gesangbücher; p. 16: Breslauer u. Züllichauer"}
- {claim: "Flurnamen, Redensarten der Brücher (ick war do)", verdict: supported, where: "p. 8: Flurnamen; p. 22: Flurnamen 1) Bronikel ...; p. 27: ick war do = Brücher."}
- {claim: "Häuser, Scheunen und hölzerne Grabbretter", verdict: supported, where: "p. 5: Pommersche Scheunen ... Häuser aus Lehm; p. 25: ähnliche hölzerne Grabbretter wie in Łazinsk"}
- {claim: "die letzten Seiten sind ein Verzeichnis seiner Aufnahmen; eine davon trägt die Überschrift Juli 1935 und nennt Gostynin, Leonberg und Grabie", verdict: supported, where: "pp. 30-33: exposures, aperture (Bl.), filter, times; p. 33: Juli 1935 ... Gostynin, Kirche ... Leonberg, Schule ... Grabie, Landwirt."}

# Page numbers of document 2: 1 the cover (5192_a), 2 = 5193_a2, then in order to 25 = 5205_a1.
# Document 2 (added 2026-10-14), the notebook "V. Grodziec Juli 1936". 15
# statements, 12 supported as first written, three weakened: the teachers and
# sextons of 1895 to 1928 were first placed "in Józefów" (the page does not
# name the place); the years of the last page were first called founding
# years (the page gives the years only); and "Sachsengänger" was cut, a word
# read with doubt.
app539680669-002:
- {claim: "Zweites Notizbuch Albert Breyers vom Juli 1936, mit Bleistift geschrieben, auf dem Umschlag V. Grodziec Juli 1936", verdict: supported, where: "p. 1: V. Grodziec / Juli 1936"}
- {claim: "es handelt jedoch von Łazińsk und den Nachbarorten", verdict: supported, where: "p. 2: Łazinsk; pp. 4-24 Włodzimierow, Emilienheim, Obory, Kazimierka, Józefów"}
- {claim: "vor 65 Jahren seien im März sehr viele aus Łazińsk nach Russland gegangen, einen Monat zu Fuß", verdict: supported, where: "p. 2: Vor 65 Jahren im März, sehr viele nach Russland. Ein Monat gewandert, wenn es gut war."}
- {claim: "kurz vor dem Krieg seien auch Leute aus Wolhynien zurückgekehrt", verdict: supported, where: "p. 2: Kurz vor d. Kriege sind auch Wolhyn. zurückgek."}
- {claim: "Włodzimierów sei vor 25 Jahren vom Gut Trąbczyn parzelliert worden, dessen Besitzer Graf Miączyński hieß, fast alles an Deutsche", verdict: supported, where: "p. 4: Włodzimierow parzeliert fast alles Deutsche. Parzeliert Włodzimierow vor 25 Jahre vom Gute Trambczyn, Besitzer hiess: Graf Miączyński."}
- {claim: "das Restgut hatte etwa 60 Morgen, Jesse kam aus Białobłoty", verdict: supported, where: "p. 4: Restgut hatte an 60 Morgen. Jesse kam aus Białobłoty."}
- {claim: "auf Waldland des Gutes Trąbczyn, das ein Jude gekauft und 5–6 Jahre vor dem Krieg an Deutsche weiterverkauft hatte, liegt die Neusiedlung Trompczyn D.", verdict: supported, where: "p. 8: Das Land war Wald, der gehörte zum Gute Trombczyn ... kaufte ein Jude; 5–6 Jahre vor dem Kriege an Deutsche abverkauft. Die Neusiedl. heisst Trompczyn D."}
- {claim: "mit Bochenski, Kinast, Retzlaff, Schwarz, Lipelt, Schmechel und einem Polen", verdict: supported, where: "p. 8: Bochenski 20 M., Kinast, Winterfeld, ... Retzläff, ein Pole, Schwarz Lipelt, Schmechel."}
- {claim: "in Łazińsk ist nach dem Arzt Brede in Zagórów die Schwindsucht verbreitet", verdict: supported, where: "p. 4: In Łazinsk ist Schwindsucht verbreitet. Doktor Brede in Zagórów wundert sich darüber"}
- {claim: "beim Gebet kniet die Gemeinde", verdict: supported, where: "p. 7: Gottesdienst i. Łazinsk ... Bei dem allgemeinen Gebet kniet die Gemeinde."}
- {claim: "Deutsche aus Łazińsk erhielten durch die Kolonisationskommission drainiertes Land und wurden in Ostfelde bei Września von den Polen vertrieben", verdict: supported, where: "p. 11: Kolonisationskommission ... Haben gutes, drainiertes Land bekommen. In Ostfelde Wrześ. die Deutschen aus Łazinsk von d. Polen runtergejagt"}
- {claim: "Lehrer und Küster von 1895 bis 1928", verdict: supported, where: "p. 24: Küster bis v. 1907 ... 1907 – 1928 Fr. Lehmann. vor Kuske Thiem 1895 – 1898. First written 'in Józefów': overstated, weakened"}
- {claim: "Plattdeutsch und Kaschubisch, Servitute von den Gütern Biała, Niniew und Chocz", verdict: supported, where: "pp. 24-25: kaschub., plattdeutsch; p. 15: Vom Gute Biała; p. 17: Servitut vom Gute Niniew; p. 23: Vom Gute Chocz"}
- {claim: "Ständer- und pommersche Scheunen, Grabbretter in Kazimierka und Józefów und uneheliche Kinder", verdict: supported, where: "p. 19: Ständerscheune ... pommersche; pp. 20, 22: Grabbretter; p. 13: Uneheliche Kinder viel. 'Sachsengänger' cut: read with doubt"}
- {claim: "die letzte Seite nennt Jahreszahlen: ein Züllichauer Gesangbuch von 1744, Alt-Kazimierka 1782, Józefów 9. November 1790, vom Gute Chocz, dessen Besitzer Lipski hieß", verdict: supported, where: "p. 25: Züllichau Gesangb. 1744. Alt-Kazimierka 1782 Józefów 9 Nov. 1790. vom Gute Chocz, Besit. Lipski. First written as founding years: weakened"}

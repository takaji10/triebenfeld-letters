# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Two short entries in a book of reports of the castle court of Konin for 1765
  to 1767, in Latin with the thing seen described in Polish. In each the
  court messenger Bartłomiej Szepczyński of Trąbczyn declares what he saw on
  the estate at the request of Antoni Prusimski of Kolno, heir of Trąbczyn,
  with two noblemen as witnesses. On 22 April 1767 he reports an embankment
  lately raised at the end of the pond-ground (stawisko), which turned the
  water back over the Trąbczyn lands and flooded the Olęder settlers in the
  woods, their manured fields and meadows, and says the people of Łukom did
  it on their lord's order. On 6 August 1767 he reports the same embankment,
  in the wood on the pond-ground by the Łukom boundary but on Trąbczyn
  ground: the meadows of four Olęder settlers are under water and cannot be
  mown; it was raised some years before by the heirs of Łukomia and has now
  been repaired.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Reports (relationes) of a court messenger of 1767, in formulaic Latin with
  the matter seen written in Polish. The English is the editor's own
  translation. "Ministerialis" is the court messenger (woźny); "visio" his
  inspection; "condescenderat" says that he went onto the ground;
  "grobla", "agger" an embankment or dam; "stawisko" the ground of a former
  pond; "olędrzy" settlers under Olęder law. Trąmpczyn is Trąbczyn.

# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  Two reports of a court messenger to the castle court at Konin in 1767, made
  for Antoni Prusimski: the people of Łukom had raised an embankment at the
  pond-ground on the boundary, and the water it held back flooded the fields
  and meadows of the Olęder settlers in the woods of Trąbczyn.
title_de: >-
  Zwei Berichte eines Gerichtsboten an das Burggericht in Konin von 1767, für
  Antoni Prusimski erstattet: Die Leute von Łukom hatten am Teichgrund an der
  Grenze einen Damm aufgeschüttet, und das gestaute Wasser überschwemmte die
  Äcker und Wiesen der Olęder-Siedler in den Wäldern von Trąbczyn.

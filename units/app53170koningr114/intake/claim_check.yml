app53170koningr114-001:
- {claim: "Bericht des Gerichtsboten Bartłomiej Szepczyński aus dem Dorf Trąbczyn, am 22. April 1767 in die Akten des Burggerichts Konin eingetragen", verdict: supported, where: "p. 1: Actum in Conin Feria Quarta post Festa Solemnia Sacri Paschałis proxima Anno Domini 1767 ... Providus Bartholomeus Szepczyński de Villa Trąmpczyn Ministerialis Regalis; p. 2: hanc Sui Relationem fecit"}
- {claim: "auf Verlangen von Antoni Prusimski von Kolno, Erbherrn von Trąbczyn, ist er am Karsamstag mit zwei Adligen, Stanisław Lipiński und Józef Rudkowski, auf das Gut gegangen", verdict: supported, where: "p. 1: habitis Secum Duobus Nobilibus Videlicet Generosis Stanislao Lipiński et Josepho Rudkowski; p. 2: ad Instantiam ... Magnifici Antonii de Kolno Prusimski Bonorum Villae Trąmpczyn Cum Attinentiis haeredis Sabbatho Magno non pridem praeterito ... Condescenderat"}
- {claim: "und hat einen Damm besichtigt, der vor kurzem am Ende des Teichgrunds aufgeschüttet wurde", verdict: supported, where: "p. 2: Vidit et Debite Conspexit Groblą niedawno w końcu Stawiska Usypaną"}
- {claim: "durch den Damm staute sich das Wasser, das aus dem Teichgrund durch die Trąbczyner Fluren fließt, zurück und überschwemmte die Olęder, die in den Trąbczyner Wäldern angesiedelt sind, samt ihren gedüngten Äckern und ihren Wiesen", verdict: supported, where: "p. 2: Woda z Stawiska tego płynąca przez Dziedziny Trąmpczynskie Wstecz Się cofnęła y Olendrów w Lesiech Trąmpczyńskich Osiadłych z Rolmi Ku Uprawienim Wymierzwionemi y Łąkamy zalała"}
- {claim: "nach seiner Angabe haben das Leute des Nachbarguts Łukom auf Befehl von dessen Erbherrn getan", verdict: supported, where: "p. 2: per Homines Vicinae Haereditatis Villae Łukom ex Mandato Eorun[dem?] Bonorum Haeredis his temporibus facta esse Asseruit"}

app53170koningr114-002:
- {claim: "zweiter Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn über denselben Damm, am 6. August 1767 in die Akten des Burggerichts Konin eingetragen", verdict: supported, where: "p. 1: Actum in Conin Feria Quinta Ipso Die Festi Transfigurationis Domini Nostri Jesu Christi Anno Ejusdem 1767 ... Granitialis Visio; the embankment at the stawisko again"}
- {claim: "auf Verlangen von Antoni Prusimski von Kolno ist er am Freitag nach St. Jakob mit zwei Adligen, Józef Gołembiewski und Rudkowski, wieder auf das Gut gegangen", verdict: supported, where: "p. 1: Generosis Josepho Gołembiewski et Ejusdem Nominis Rudkowski ... Magnifici Antonii de Kolno Prusimski ... Feria Sexta post Festum Sancti Jacobi Apostoli proxima Anno praesente In haereditatem Bonorum Trąmpczyn Condescenderat"}
- {claim: "der Damm ist im Wald auf dem Teichgrund an der Grenze der Łukomer Fluren auf Trąbczyner Grund aufgeschüttet; das im Teich gestaute Wasser tritt auf die Äcker und Wiesen der Trąbczyner Olęder über, so dass die Wiesen von vier von ihnen überschwemmt sind und sich nicht mähen lassen", verdict: supported, where: "p. 1: Groblą w lesie na Stawisku zwanym pod Granicę Dziedzin Łukomskich na Gruncie Trąmpczyńskim Usypaną ... Woda Zatamowana w Stawie wylewy Sprawia na Grunta i Łąki Holęndrów Trąmpczyńskich tak dalece Iz Łąki Czterach Olęndrów Wspomnionych Zatopione Kosić Się niedadzą"}
- {claim: "der Bote erklärt mit den beiden Adligen, der Damm sei vor einigen Jahren von den Erbherren von Łukomia aufgeschüttet und jetzt ausgebessert worden", verdict: supported, where: "p. 2: cum praefatis Nobilibus Asseruit aggeremque praefatum ab annis aliquot per Haeredes Łukomia Sippatum nunc vero reparatum esse"}

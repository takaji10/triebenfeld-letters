  en: 'Done in Konin on Thursday, on the very day of the Feast of the Transfiguration of Our Lord Jesus
    Christ, in the year of the same 1767.


    Boundary Judicial Site Inspection — on behalf of the Heir of Trąmpczyn


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Bartłomiej
    Szepczyński of Trąmpczyn, Royal Court Summoner, General, being sound, certified — because he, having
    with him two noblemen, namely the Honourables Józef Gołembiewski and [Józef] Rudkowski of the same
    name, although absent here from the court, being nonetheless present at the time at the location of
    the below-written matter — at the request and official requisition of the Right Honourable Antoni
    Prusimski of Kolno, heir of the estates of Trąmpczyn with its appurtenances — on the Friday next after
    the Feast of Saint James the Apostle in the present year had descended to the estate of Trąmpczyn,
    and there, being present in such manner according to the form of law and custom, saw and duly inspected:


    namely, an embankment [grobla] raised in the woodland at the stawisko known near the boundary of the
    Łukomia estates, on Trąmpczyn ground, by the raising of which embankment the water dammed in the pond
    causes overflows onto the grounds and meadows of the Trąmpczyn Olędry, to such an extent that the
    meadows of the four aforementioned Olędry, being flooded, cannot be mowed;'

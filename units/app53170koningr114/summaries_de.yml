app53170koningr114-001: "Bericht des Gerichtsboten Bartłomiej Szepczyński aus dem Dorf Trąbczyn, am 22. April 1767 in die Akten des Burggerichts Konin eingetragen. Auf Verlangen von Antoni Prusimski von Kolno, Erbherrn von Trąbczyn, ist er am Karsamstag mit zwei Adligen, Stanisław Lipiński und Józef Rudkowski, auf das Gut gegangen und hat einen Damm besichtigt, der vor kurzem am Ende des Teichgrunds aufgeschüttet wurde. Durch den Damm staute sich das Wasser, das aus dem Teichgrund durch die Trąbczyner Fluren fließt, zurück und überschwemmte die Olęder, die in den Trąbczyner Wäldern angesiedelt sind, samt ihren gedüngten Äckern und ihren Wiesen. Nach seiner Angabe haben das Leute des Nachbarguts Łukom auf Befehl von dessen Erbherrn getan."
app53170koningr114-002: "Zweiter Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn über denselben Damm, am 6. August 1767 in die Akten des Burggerichts Konin eingetragen. Auf Verlangen von Antoni Prusimski von Kolno ist er am Freitag nach St. Jakob mit zwei Adligen, Józef Gołembiewski und Rudkowski, wieder auf das Gut gegangen. Der Damm ist im Wald auf dem Teichgrund an der Grenze der Łukomer Fluren auf Trąbczyner Grund aufgeschüttet; das im Teich gestaute Wasser tritt auf die Äcker und Wiesen der Trąbczyner Olęder über, so dass die Wiesen von vier von ihnen überschwemmt sind und sich nicht mähen lassen. Der Bote erklärt mit den beiden Adligen, der Damm sei vor einigen Jahren von den Erbherren von Łukomia aufgeschüttet und jetzt ausgebessert worden."

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry on leaf 323 of a book of the castle court of Kalisz for 1776, in
  Latin, under the date line of 23 November 1776 on leaf 322 verso. Antoni
  Leszczyc Mierzewski asks the office whether the boundary decree between the
  estates of the villages of Łukom, Trąbczyn and others, given by the
  commissioners appointed by the Estates of the Commonwealth on the part of
  Antoni Prusimski of Kolno, Starost of Niszczewice, heir of Trąbczyn, has
  been brought in for entry. The office goes through its books of reports,
  where such papers are received, from 17 October 1776 to the day, and answers
  that no such decree is in its records, and certifies it. Mierzewski signs.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A certificate of a castle office of 1776 in formulaic Latin. The English is
  the editor's own translation. "Requisivit ... utrum" is "asked whether";
  "oblata" a paper brought in to be entered; "Decretum Commissoriale
  Granitiale" the boundary decree of the commission; "fecit fidem" certifies.
  "Leszczyc" is the name of a coat of arms. Trąpczyn is Trąbczyn.

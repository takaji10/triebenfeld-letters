# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  The certificate of the castle office at Kalisz of 23 November 1776 that,
  searched at the request of Antoni Leszczyc Mierzewski, its books held no
  entry of the boundary decree given for Prusimski between Łukom and Trąbczyn.
title_de: >-
  Die Bescheinigung des Burgamts Kalisz vom 23. November 1776, dass seine
  Bücher, auf Verlangen von Antoni Leszczyc Mierzewski durchgesehen, keinen
  Eintrag des für Prusimski ergangenen Grenzdekrets zwischen Łukom und
  Trąbczyn enthielten.

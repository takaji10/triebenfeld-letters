app53150kaliszgr424-001: "Bescheinigung des Burgamts Kalisz vom 23. November 1776. Antoni Leszczyc Mierzewski fragt das Amt, ob das Grenzdekret zwischen den Gütern der Dörfer Łukom, Trąbczyn und anderen, das die von den Ständen der Republik bestellten Kommissare aufseiten von Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherrn von Trąbczyn, erlassen haben, zur Eintragung vorgelegt worden sei. Das Amt sieht seine Berichtsbücher, in die solche Vorlagen aufgenommen werden, vom 17. Oktober 1776 bis zum heutigen Tag durch und antwortet, in seinen Akten finde sich kein solches Dekret. Es bescheinigt das; Mierzewski unterschreibt."

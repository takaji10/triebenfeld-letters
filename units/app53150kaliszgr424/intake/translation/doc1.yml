- page: 2
  confidence: high
  marker_count: 0
  en: 'Coming in person before the present Kalisz Starost''s Municipal Court and Records, the Right Honourable
    Antonius Leszczyc Mierzewski [on behalf of Chełmski] asked of the present Office whether the Commissorial
    Boundary Decree between the estates of the villages of Łukom, Trąbczyn, and others, issued by the
    Illustrious Right Honourable Commissioners from the Estates of the Republic on behalf of the Right
    Honourable Antoni of Kolno Prusimski, Starost of Niszczewice, heir of the estates of Trąbczyn with
    its appurtenances, designated on behalf of the same Right Honourable Prusimski, and issued between
    those same estates, had been submitted to the present Records by oblata or not. The present Office,
    consenting to this Requisition, betook itself to the revision of the Protocols of the Relation, where
    oblatas are customarily received. These having been revised and carefully examined from the act of
    Thursday next after the feast of Saint Hedwig the Widow, Elect, namely the seventeenth day of the
    month of October of the present year, to the act of this present day, the Office responded that no
    Commissorial Boundary Decree — between the above-written estates, issued by the Illustrious Right
    Honourable Commissioners designated on behalf of the Right Honourable Prusimski and brought onto the
    ground of those estates, and submitted by oblata — was found to have been in the present Records;
    of which the present Office has made, and makes, attestation by these presents.


    A. L. Mierzewski, by his own hand'

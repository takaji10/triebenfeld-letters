description: >-
  A scholarly article of 1973, not a primary source: the Polish historian Jan
  Pachoński on the Polish emigrés in the Republic of Venice from
  the defeat of the Kościuszko Insurrection in 1794 to the founding of the
  Polish Legions in Italy in 1797. It was read at the third conference of the
  Giorgio Cini Foundation and the Polish Academy of Sciences (Venice, 15-17
  October 1970) and printed in its proceedings, Italia, Venezia e Polonia tra
  illuminismo e romanticismo, edited by Vittore Branca (Florence: Olschki,
  1973), pages 237 to 256. It tells who the emigrés were, their parties
  (royalists, moderates, republicans), the Polish Committee formed at Venice
  in January 1795 with the help of the French minister Lallement, the
  Deputation at Paris, the offer of the Venetian command to Nassau-Siegen and
  Komarzewski, and Sołtyk's agency for the conspirators of Lwów; a map shows
  where the emigrés lodged, and an appendix added after the discussion
  speaks of the Legions in Italy. Its footnote 10 names "Antoni Prusiński",
  starost of "Nieszczewice", among the three starosts at Venice at the end of
  1794: Antoni Prusimski, Starost of Niszczewice, the owner of Trąbczyn.

translation_note: >-
  Modern French (1973) by a Polish historian, with some slips of the print
  kept as printed ("da grade", "contre-cadidat", "Néanmois", "italiannes").
  Names are mostly in their French forms (Stanislas, Michel, Charles Prozor);
  "Prusiński" of Nieszczewice is the Antoni Prusimski, Starost of Niszczewice,
  of the edition. The raised figures are the article's footnote marks, and
  the notes stand at the foot of each page. "AS Venezia, Inq." is the State
  Archive of Venice, the State Inquisitors; "AE" the archive of the French
  foreign ministry. Dates are written day.month(roman).year: 7.II.1795 is
  7 February 1795. The legend of the map (page 246) is Italian.

pachonski1973-001: "Ein Aufsatz des Historikers Jan Pachoński, auf Französisch, gedruckt 1973 im Tagungsband einer polnisch-italienischen Konferenz in Venedig vom Oktober 1970 (Italia, Venezia e Polonia tra illuminismo e romanticismo, hg. von Vittore Branca, S. 237–256); Literatur, keine Primärquelle. Er handelt von den polnischen Emigranten in der Republik Venedig nach dem Scheitern des Kościuszko-Aufstands von 1794: Ende 1794 waren es etwa fünfzig, darunter drei Starosten, von denen eine Fußnote „Antoni Prusiński“ von „Nieszczewice“ nennt, den Starost Antoni Prusimski von Niszczewice. Der Aufsatz beschreibt ihre Parteien (Royalisten, Gemäßigte, Republikaner); das Polnische Komitee, das sie im Januar 1795 in Venedig im Vertrauen auf die Zusage des französischen Ministers Lallement bildeten und das Frankreich nicht anerkannte; die im August 1795 in Paris gebildete Deputation; das Angebot des venezianischen Oberbefehls 1796 an den Prinzen von Nassau-Siegen und dann an General Komarzewski; und Stanisław Sołtyks Wirken als Bevollmächtigter der Lemberger Zentrale, dessen Großzügigkeit und die Potockis den Abschluss der Konvention mit der Lombardei vom 9. Januar 1797 ermöglichten, die die Polnischen Legionen schuf. Eine Karte von Venedig verzeichnet acht Orte der Emigranten, ihre Gasthäuser und Häuser und die französische Gesandtschaft; ein nach der Diskussion angefügter Anhang spricht von den Legionen in Italien. Über Prusimski sagt der Aufsatz sonst nichts."

# The claim check of the German summary of Pachoński 1973, Les Polonais dans la
# République de Venise, made in session on 2026-10-20 under the rules
# read_letters.py --verify gives its checker: each statement held to the
# document, as supported, overstated or unsupported, and the summary only
# weakened or cut.
#
# Result: 13 statements, all supported, after two were weakened before the
# summary was written out: the first draft said the map showed eight
# "lodgings" (it marks the French legation too) and that Sołtyk's "money"
# made the convention possible (the article says his and Potocki's
# "générosité"). The book's title, editor, pages and the conference are from
# its title page, imprint page and contents (scans 03, 04, 05), not from the
# article. Antoni Prusimski for the print's "Antoni Prusiński de
# Nieszczewice" is the edition's identification, stated as such.

pachonski1973-001:
- {claim: "Ein Aufsatz des Historikers Jan Pachoński, auf Französisch", verdict: supported, where: "p. 237: Jan Pachoński, LES POLONAIS DANS LA REPUBLIQUE DE VENISE (1794-1797); the text is French"}
- {claim: "gedruckt 1973 im Tagungsband einer polnisch-italienischen Konferenz in Venedig vom Oktober 1970 (Italia, Venezia e Polonia tra illuminismo e romanticismo, hg. von Vittore Branca, S. 237–256)", verdict: supported, where: "scan 03: title page, a cura di Vittore Branca, Firenze, Leo S. Olschki Editore, MCMLXXIII; scan 04: Atti del III convegno ... dalla Fondazione Giorgio Cini dall'Accademia Polacca delle Scienze (Venezia, 15-17 ottobre 1970), Copyright 1973; scan 05: the contents, p. 237; the article ends on p. 256"}
- {claim: "Literatur, keine Primärquelle", verdict: supported, where: "the kind of the holding (unit.yml, kind: literature)"}
- {claim: "Er handelt von den polnischen Emigranten in der Republik Venedig nach dem Scheitern des Kościuszko-Aufstands von 1794", verdict: supported, where: "p. 237: L'année qui suivit l'échec de l'Insurrection de Kosciuszko, en automne 1794 ...; the title"}
- {claim: "Ende 1794 waren es etwa fünfzig, darunter drei Starosten", verdict: supported, where: "p. 240: Vers la fin de 1794, il y avait à Venise une cinquantaine d'émigrés polonais, dont ... trois starostes"}
- {claim: "von denen eine Fußnote „Antoni Prusiński“ von „Nieszczewice“ nennt, den Starost Antoni Prusimski von Niszczewice", verdict: supported, where: "p. 240, note 10: Michel Skrzetuski fut staroste de Mogilno, Antoni Prusiński de Nieszczewice et Piotr Potocki de Szczerzec; the identification is the edition's (the editor, 2026-10-20: Prusimski is referenced here as Prusiński)"}
- {claim: "Der Aufsatz beschreibt ihre Parteien (Royalisten, Gemäßigte, Republikaner)", verdict: supported, where: "p. 240: Trois partis principaux ... les partisans d'une monarchie forte, les adeptes de la monarchie constitutionnelle et les républicains ... appelés communément les modérés; p. 239: un centre royaliste; p. 252: favorisa ... les royalistes"}
- {claim: "das Polnische Komitee, das sie im Januar 1795 in Venedig im Vertrauen auf die Zusage des französischen Ministers Lallement bildeten", verdict: supported, where: "p. 243: Dès janvier 1795, les Polonais confiants en la promesse du ministre Lallement ... décidèrent de former un gouvernement provisoire sous le nom de Comité Polonais à Venise"}
- {claim: "und das Frankreich nicht anerkannte", verdict: supported, where: "p. 244: De ce fait, le Comité de Venise ne fut pas reconnu"}
- {claim: "die im August 1795 in Paris gebildete Deputation", verdict: supported, where: "p. 248: Le 22 août 1795 ils formèrent un gouvernement en émigration, sous le nom de Députation"}
- {claim: "das Angebot des venezianischen Oberbefehls 1796 an den Prinzen von Nassau-Siegen und dann an General Komarzewski", verdict: supported, where: "p. 249: en avril 1796 ... le commandement suprême de l'armée vénitienne ... lui fut proposé ... il fut décidé d'offrir le commandement suprême au général Komarzewski; p. 252: offrant successivement, en 1796, le commandement suprême"}
- {claim: "und Stanisław Sołtyks Wirken als Bevollmächtigter der Lemberger Zentrale, dessen Großzügigkeit und die Potockis den Abschluss der Konvention mit der Lombardei vom 9. Januar 1797 ermöglichten, die die Polnischen Legionen schuf", verdict: supported, where: "p. 247: la Centrale de Lwów, le chargea (en juillet) de fonctions responsables de délégué plénipotentiaire pour l'Italie; p. 240, note 9: Stanisław Sołtyk; p. 252: la générosité de Sołtyk et de Potocki permit la conclusion d'une convention avec la Lombardie (9.1.1797) qui décida de la création des Légions Polonaises. First drafted with his 'money': weakened"}
- {claim: "Eine Karte von Venedig verzeichnet acht Orte der Emigranten, ihre Gasthäuser und Häuser und die französische Gesandtschaft; ein nach der Diskussion angefügter Anhang spricht von den Legionen in Italien. Über Prusimski sagt der Aufsatz sonst nichts.", verdict: supported, where: "p. 246: Residenze degli emigrati polacchi a Venezia 1794 - 1797, eight places, among them Legazione francese; p. 253: APPENDICE (aggiunta dall'autore a seguito della discussione), pp. 253-256 on the Legions; Prusiński only in note 10. First drafted as eight 'lodgings': weakened"}

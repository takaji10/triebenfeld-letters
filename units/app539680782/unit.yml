# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One photographed document of two pages: the contract of 14 March 1820
  between the village board of Tropiczyner Holland, the Olęder colony of the
  Trąbczyn estate, and Samuel Adolph, the school teacher engaged for the
  village school, written in German. The board - the Schulze Johann George
  Lindner, the Beisitzer Christoph Rimpel and the Gerichten Samuel Gellert -
  engages the teacher to take over the village school, having tried him; ten
  numbered terms follow: free dwelling; three Morgen of land with some meadow,
  which he may use without payment and which the community tills for him; five
  Viertel of grain and a half Viertel of seed, which he must carry at his
  going; school money of 3 gr. for a child learning from the a b c to reading
  and 6 gr. for writing and reckoning; a present of 1 St. from every child
  that is confirmed; item 7 stands with its number and nothing after it; fees
  of 7 Böhm 3 gr. for the burial of an old corpse and 1 St. for a child; at
  the high feasts of Christmas, Easter and Whitsun an Opfertorium of 6 gl.
  from every Wirt; and the New Year's rounds, 6 gr. at New Year and 3 gr. on
  Green Thursday. The teacher binds himself to continue his office, the Sunday
  school and the children's teaching for one year, and the board binds itself
  to keep its side of the contract.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A single contract in German, in one hand, with phonetic spellings and slips
  of the pen (Freihe wohnung, Ale hohe Pfest-Tage, veroblogiert, Begräbniß):
  give them as written, nothing tidied. The terms are numbered 1. to 10. in
  the manuscript; item 9 opens with the ordinal 9te.; item 7 carries its
  number and nothing else (the editor, 2026-10-25). The sums are abbreviated
  as written: gr., gl., St., Böhm. A word the manuscript divides at a line end
  keeps its hyphen. The place names keep the manuscript's own forms:
  Tropiczyner Holl., Borwiezer Holland.

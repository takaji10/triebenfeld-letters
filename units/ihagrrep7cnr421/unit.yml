    de: Voneinander unabhängige Lesungen von Claude verglichen jede Zeile mit den Scans, und Claude entschied jede Abweichung am Bild. Ein Wort wurde nur geändert, wo die Seite eindeutig ist oder ein Beleg es entscheidet, etwa derselbe Text in der zweiten Abschrift einer Eingabe in der Akte oder eine feste Formel; zweifelhaft gebliebene Wörter sind mit [?] markiert, gestrichene Wörter sind nicht transkribiert.
  translation:
  - l-claude
  - l-auto-check
  - s-claude

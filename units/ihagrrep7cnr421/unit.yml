title: >-
  The Prussian ministry's file of 1799 on the complaint of Stanisław Chełmski
  of Łukom, who in 1794 had lent the starost Antoni Prusimski 12,000 ducats
  against a pledge of Trąbczyn and its villages, that the South Prussian
  government at Kalisz would not hear his suit against the Fiscus once
  Prusimski's estates had been confiscated and given to the Prince of
  Hohenlohe; the King's answer of 21 October 1799 refused him.
title_de: >-
  Die Akte des preußischen Ministeriums von 1799 über die Beschwerde des
  Stanisław Chełmski auf Łukom, der dem Starosten Antoni Prusimski 1794
  12.000 Dukaten gegen ein Pfand auf Trąbczyn und seine Dörfer geliehen
  hatte, dass die südpreußische Regierung zu Kalisch seine Klage gegen den
  Fiskus nicht annahm, nachdem Prusimskis Güter eingezogen und dem Fürsten
  von Hohenlohe gegeben worden waren; der Bescheid des Königs vom
  21. Oktober 1799 wies ihn ab.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts.
description: >-
  A file of the Prussian ministry (the Geheimer Rat, department of South
  Prussia), October to December 1799. In June 1794 Stanisław von Chełmski of
  Łukom, a landowner near Pyzdry, lent the starost Anton (Antoni) von
  Prusimski of Trąbczyn 12,000 ducats in gold for one year, against a blank
  note and a written undertaking that if the money was not repaid by St John's
  Day 1795 Chełmski might take possession of Trąbczyn, Nowa Wieś, Osiny, Łazy
  and the Hauländer and hold them until repaid. Prusimski joined the
  insurrection of 1794, fled, and was condemned; his property was confiscated
  by the Fiscus, and the Trąbczyn estates were given to the Prince of
  Hohenlohe-Ingelfingen. Chełmski, who had entered on the estates in June
  1795, had to give them up and sued the Fiscus instead; the South Prussian
  government at Kalisz refused his suit (decrees of 10 and 27 September 1799)
  because his claim was a personal one. The file holds his petition to the King
  of 8 October 1799 (with the ministry's decision in its margin), copies of the
  two decrees, the draft of the King's answer of 21 October refusing him, the
  petition of his lawyer, the criminal councillor Mondio, of 7 December (with
  the office's slip ordering the answer) and a copy of it dated 1 December,
  the copy of Chełmski's suit of 19 March 1799 against Prusimski before the
  government at Posen with the Polish copy of Prusimski's undertaking of
  16 June 1794, and the draft of 23 December sending Mondio a copy of the
  answer of 21 October.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Papers of the Prussian ministry and petitions to the King. "#" after a sum is
  the ducat (the bond: "Hollenderskich Obrączkowych", Dutch ducats in gold).
  "Fiscus" (Fisco, fiscum) is the Crown's treasury as a party at law; "die
  Regierung zu Kalisch" is the South Prussian government, the court; "Decret"
  and "Resolution" are its and the King's rulings on a petition; "Revers" and
  "Blanquet" (Polish "Blankiet") are the note of hand Prusimski gave;
  "Confiscations Urtel" and "Revisions Erkenntniß" are the sentence of
  confiscation and the judgment on appeal; "Cabinets Ordre" is the King's order
  from his cabinet, "Hofrescript" a rescript of the ministry of justice;
  "Personal-Anspruch", "persönliche Forderung" a claim against the person, not
  secured on land; "Contractus antichreticus" the pledge of land whose
  revenues stand for the interest; "Term. instr." (Terminus instructionis) a
  hearing to take evidence; "ex Chirographo" on a note of hand; "refusis
  expensis" with costs; "Mandant", "Mandatarius" the client and his lawyer.
  "Starost" is a holder of a royal starostwo in the old Polish state.
  "Criminal Rath" Mondio of Kalisz is Chełmski's lawyer. Places: Kalisch is
  Kalisz, Posen Poznań, Peysern Pyzdry; "Trąmpczyn" is Trąbczyn, "Nowa Wieś"
  (Nowey wśi), Osiny (Ośin), "Łazy" (Łazow) and the "Hauländer"/"Holendrzy" the
  estate's villages and colonists; Łukom (Łukomie) Chełmski's estate, Mierzewo
  near Gniezno. The last page of document 6 is a copy in POLISH of Prusimski's
  undertaking: translate it from the Polish. A word followed by [?] is one the
  reading leaves doubtful, and the English keeps the doubt. Names stay as the
  clerk wrote them (Prusimski, Prusimeki, Prusinski) unless the edition has a
  settled form.


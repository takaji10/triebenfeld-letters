# German summaries of I. HA GR, Rep. 7 C, Nr. 421, written in session 2026-11-21 from the corrected text (Claude)
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
ihagrrep7cnr421-001: "Stanisław von Chełmski an den König, Kalisch, 8. Oktober 1799, mit dem Vermerk „conc Mondo“. Er hat dem Starosten von Prusimski 1794 12.000 Dukaten in Gold gegen einen Revers geliehen, zahlbar zu Johanni 1795; vorher wurde Prusimski flüchtig, und durch das Konfiskationsurteil wurde sein Vermögen vom Fiskus beschlagnahmt. Chełmski setzte sich nach Rücksprache mit ihm in den Besitz von Prusimskis Gütern Trąmpczyn und Nowa Wieś, musste sie aber nach dem Revisionserkenntnis dem Fürsten von Hohenlohe-Ingelfingen räumen, dem der König sie geschenkt hatte, und wurde mit seiner Forderung an den Fiskus verwiesen. Auf seine Klage gegen den Fiskus vom 6. September beschied ihn die Regierung zu Kalisch am 10. September, er müsse zuerst die Realqualität der Forderung nachweisen, und als er unter Berufung auf die Kabinettsordre vom 14. September 1796 auf einen Instruktionstermin drang, wies sie die Klage am 27. ab. Er führt aus: Nach dieser Kabinettsordre gehe der Fiskus wegen des Schadensersatzes allen persönlichen Gläubigern eines Insurgenten vor, stehe ihnen aber mit der Konfiskationsstrafe nach, müsse also eine persönliche Forderung, deren Richtigkeit anders als durch seinen bloßen Revers nachgewiesen werde, aus dem eingezogenen Vermögen befriedigen; das deklaratorische Hofreskript vom 17. September 1796 lege die Kabinettsordre ausdehnend und gegen ihren klaren Inhalt aus, was allein dem König und nicht dem Chef der Justiz zustehe; und selbst dieses Reskript lasse Personalklagen gegen den Fiskus zu, wobei der Fiskus dem Kläger eine beglaubigte Aufstellung der Insurrektionsschäden vorlegen dürfe, die zeige, dass das eingezogene Vermögen sie nicht decke. Dieses Verfahren nimmt er hin, behält sich aber seine Einwände gegen eine solche Schadensliquidation vor, und bittet um rechtliches Gehör und darum, die Regierung zu Kalisch anzuweisen, die Instruktion seiner Klage gegen den Fiskus einzuleiten. Unterzeichnet Stanisl v. Chełmski. Am Rand der ersten Seite eine größtenteils nicht gelesene Notiz eines Beamten, die Goldbeck nennt, und der Beschluss, Berlin, 21. Oktober 1799: Es bleibe bei der Resolution der Regierung vom 10. September, da jeder Gläubiger mit persönlichen Ansprüchen an das Vermögen eines Insurgenten sich selbst bescheiden werde, dass die Kriegskosten die ganze Masse eines solchen Insurgenten weit übersteigen."
ihagrrep7cnr421-002: "Abschriften zweier Dekrete der südpreußischen Regierung zu Kalisch, durch ihre Kanzlei, an von Chełmski in seiner Sache gegen Prusimski, zu Händen des Kriminalrats Mondio (Name und Titel hier teils unsicher gelesen). Das erste, vom 10. September 1799, präsentiert am 18. September, auf seine Vorstellung vom 6. September: Ehe die nachgelassene Klage stattfinde, habe er erst die Realqualität der Forderung zu bescheinigen und dass er deshalb aus den Gütern befriedigt werden müsse. Das zweite, vom 27. September, präsentiert am 5. Oktober: Auf Grund des ganz klaren Inhalts des Revisionserkenntnisses verbleibe es bei der Verfügung vom 10., umso mehr, als er diese Forderung als eine persönliche behandle. Darunter die Nummern 4980 und 3459."
ihagrrep7cnr421-003: "Entwurf der Resolution im Namen des Königs für Stanislaus von Chełmski zu Kalisch, Berlin, 21. Oktober 1799, wegen seiner Forderung an den Insurgenten Prusimski; auf Befehl gezeichnet, die Unterschrift nicht gelesen. Auf seine am 8. eingereichte Vorstellung müsse es bei der Resolution der Regierung zu Kalisch vom 10. September lediglich sein Bewenden behalten, da jeder Gläubiger mit Personalansprüchen an das ehemalige Vermögen eines Insurgenten sich selbst bescheiden werde, dass die zur Dämpfung der von den Insurgenten erregten Unruhen verwendeten Kriegskosten und die von ihnen verursachten Schäden die ganze Masse eines solchen Insurgenten weit übersteigen. In der linken Spalte Vermerke der Registratur: am 21. eingegangen, am 22. revidiert, zu den Generalakten über das Schuldenwesen der Insurgenten, am 30. zur Post."
ihagrrep7cnr421-004: "Der Kriminalrat Mondio als Bevollmächtigter Chełmskis an den König, Kalisch, 7. Dezember 1799: Er bittet um Vorbescheidung auf Chełmskis Beschwerde gegen die Regierung zu Kalisch wegen der Abweisung seiner Klage gegen den Fiskus. Chełmski habe die Beschwerde, betreffend eine Forderung von 12.000 Dukaten, am 9. Oktober eingereicht und keine Vorbescheidung erhalten. Die Dekrete der Regierung verwechselten die Klage, die Chełmski anfangs gegen den Fürsten von Hohenlohe als nunmehrigen Eigentümer der Prusimski eingezogenen Güter Trąmpczyn angestellt hatte, mit der jetzigen, die allein gegen den Fiskus gerichtet sei; dass die Forderung nicht gegen den Fürsten eingeklagt werden könne, sehe Chełmski selbst, doch hindere ihn das Hofreskript vom 17. September 1796 nicht, das Kapital nach der Kabinettsordre vom 16. desselben Monats vom Fiskus zu fordern, und selbst das Reskript verlange Instruktion und förmliches Erkenntnis, wenn eine Partei sich bei der Abweisung durch Dekret nicht beruhige. Er legt eine Abschrift der Klage mit dem Schuldschein bei, die Chełmski bei der Posener Regierung angebracht hatte, zuerst gegen Prusimski, ehe das Konfiskationserkenntnis erging; bei der Wiederaufnahme gegen den Fiskus sei nur die Person geändert worden. Er bittet um schleunige Vorbescheidung. Unterzeichnet Mondio, Kriminalrat. Am Rand eine Notiz, die mit „Anteriora“ beginnt (der Rest nicht gelesen). Dazu der Zettel der Behörde vom 23. Dezember 1799, in der Akte später eingebunden: Eine Abschrift der seinem Prinzipal erteilten Resolution vom 21. Oktober sei mitzuteilen (der Titel des Empfängers unsicher gelesen); mit einem nicht gelesenen Namen gezeichnet."
ihagrrep7cnr421-005: "Eine Abschrift von Mondios Eingabe an den König, überschrieben „Abschrift“ und datiert Kalisch, 1. Dezember 1799, sechs Tage vor dem Original (Dokument 4), im gleichen Wortlaut: Bitte um Vorbescheidung auf Chełmskis Beschwerde vom 9. Oktober wegen der Abweisung seiner Klage gegen den Fiskus über 12.000 Dukaten; die Verwechslung der Klage gegen den Fürsten von Hohenlohe mit der gegen den Fiskus; das Hofreskript vom 17. September 1796 und die Kabinettsordre, hier vom 10. desselben Monats; die beigelegte Abschrift der Klage mit dem Schuldschein. Unterzeichnet Mondro, Kriminalrat."
ihagrrep7cnr421-006: "Abschrift von Chełmskis Klage, an den König gerichtet, datiert Posen, 19. März 1799, gegen den Starosten Anton von Prusimski auf Trąmpczyn wegen 12.000 Dukaten aus einem Schuldschein, mit der polnischen Abschrift von Prusimskis Verschreibung. Am 16. Juni 1794 habe er Prusimski 12.000 Dukaten auf ein Jahr, bis Johanni 1795, vorgeschossen und dafür im Beisein des Jacob von Bieńkowski auf Mierzewo bei Gnesen und des Antonius v Przeradzki ein Blankett erhalten; vereinbart worden sei, dass er bei Nichtzahlung das Blankett als antichretischen Vertrag ansehen und von den Gütern Pfandbesitz nehmen könne. Zum vereinbarten Termin sei nicht gezahlt worden, und er habe den Besitz ergriffen (das Wort für die Zahlung unsicher gelesen). Inzwischen habe der Fiskus Prusimski wegen Teilnahme an der Insurrektion von 1794 angeklagt; da er nicht zurückgekehrt sei, habe sein Vermögen im Mai beschlagnahmt werden sollen, dem Chełmski durch seine Besitzergreifung im Juni zuvorgekommen sei. Der Fiskus habe am 7. Dezember 1795 die Exmissionsklage angestrengt; im Termin vom 27. Februar sei ein Vergleich geschlossen worden: Chełmski solle die Güter sequestrieren, von der Einnahme zuerst die Verzugszinsen zu 7 Prozent abziehen, dann Rechnung legen und, wie es scheint, weitere Forderungen gerichtlich wahrnehmen (der Satzteil nur teilweise gelesen). Er bittet um einen Instruktionstermin und um Verurteilung Prusimskis zur Zahlung der 12.000 Dukaten und der Verzugszinsen zu 7 Prozent unter Erstattung der Kosten und beruft sich auf die Zeugen. Unterzeichnet v Chełmski. Die polnische Abschrift, Łukom, 16. Juni 1794: Antoni Prusimski gibt, um Stanisław Chełmski, Skarbnik, die Zahlung der im Blankett genannten 12.000 holländischen Dukaten in Gold am Vorabend von Johannes dem Täufer 1795 ohne Zinsen zu sichern, die Verschreibung, dass Chełmski bei Nichtzahlung in seine Güter eintreten dürfe – die Dörfer Trąmpczyn, Nowa Wieś, Osiny, ein weiteres Dorf, dessen Name nicht gelesen ist, Łazy und alle Holländer der Herrschaft, kein Dorf und keinen Wald ausgenommen, nur ein Werk, ein Magazin und die Holzvorräte (die Worte für das Werk unsicher gelesen) – und sie statt der Zinsen ohne Abrechnung besitzen, bis die Summe zurückgezahlt sei; die Verschreibung solle die Kraft einer gerichtlichen haben. Unterzeichnet Antoni Prusimski; Zeugen Jakub Bieńkowski und Antoni Przeradzki."
ihagrrep7cnr421-007: "Entwurf an den Kriminalrat Mondio zu Kalisch, Berlin, 23. Dezember 1799, wegen Chełmskis Beschwerden gegen die Regierung zu Kalisch über die Abweisung seiner Klage gegen den Fiskus; auf Befehl gezeichnet, die Unterschrift nicht gelesen. Auf die von Mondio als Bevollmächtigtem Chełmskis am 7. eingereichte Vorstellung wird ihm aus der beigefügten Abschrift zu ersehen gegeben, wie Chełmski am 21. Oktober auf seine Beschwerden beschieden worden ist. Vermerke der Registratur: am 23. eingegangen, am 24. revidiert, Anlagen beiliegend, am 31. zur Post."

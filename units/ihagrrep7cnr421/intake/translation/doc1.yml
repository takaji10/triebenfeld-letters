  en: 'Es [sind?] [wir?] Acta [t?]orm[?] has the two in this Storstell[s?] rohl[?] underlined dis[p?]. (which I do not find in my Saml[?] sent to me by His Excellency v. Goldbeck) beforsen[?] begelegen and allauflei[?] to be requested from the arctio[?] dH. Gu[?]. [Ets?] d. [?] [Signature?]


    Resolved: that the resolution of the Government of 10 Sept. this year must simply stand, since every creditor who has personal claims to make on the former property of an insurgent will understand of himself that the costs of the war must[?] far exceed the whole estate of such an insurgent. B[erlin], 21 Oct. [17]99. ita conclusum eodem [?]llen[?][z?]


    Most Serene, Most Mighty, Most Gracious King and Lord! Kalisz, 8 October 1799.


    In the year 1794 I gave the Starost von Prusimski a loan of 12,000 ducats in gold against a written undertaking, which he promised to repay at St John''s Day 1795. Before the date of payment came, however, von Prusimski became a fugitive, and through the sentence of confiscation passed against him his property was seized by the Fiscus.


    After consulting with him, von Prusimski, I did take possession of the estates of Trąbczyn and Nowawies belonging to him, but I had to give them up to the Prince of Hohenlohe-Ingelfingen, to whom these estates had been given by Your Royal'
  flagged: []
- page: 2
  confidence: high
  marker_count: 0
  en: 'Majesty''s own Most High Person, upon the opening of the judgment of revision, and was referred with my said claim to the Fiscus.


    I then sued the Fiscus for payment of it on 6 September this year, but by the decree of the 10th of the same month, which I enclose in copy, I was told that before my suit could be admitted the real character of the said claim must first be proved.


    Since by the judgment of revision mentioned above the contrary was already established, and since moreover I demand my satisfaction not from the'
  flagged: []
- page: 3
  confidence: high
  marker_count: 0
  en: 'Prince of Hohenlohe but from the Fiscus as possessor of the whole of von Prusimski''s property, the suit in this matter was not inadmissible on the ground that the claim in question is merely personal. Referring to the Most High Cabinet Order of 14 September 1796, I pressed repeatedly for a hearing to take evidence to be appointed; against my expectation, however, I was once more dismissed with the suit by the decree of the 27th of the same month, which I likewise present in copy.


    As I cannot rest content with these adverse rulings,'
  flagged: []
- page: 4
  confidence: high
  marker_count: 1
  en: I see myself compelled, for the following reasons, to have recourse to Your Majesty's Most High court. By the Cabinet Order just mentioned, No. 2, it is indeed ordained that the Fiscus, in respect of compensation for damage, takes precedence over all personal creditors of an insurgent, and that it shall then rank after them with the penalty of confiscation. It is thus clear that the Fiscus must give satisfaction from the confiscated property for a personal claim on the insurgent, if its correctness is proved aliunde[?], otherwise than by my mere written undertaking; and that there is therefore no sufficient ground in the present case for dismissing the suit because
  flagged: []
- page: 5
  confidence: high
  marker_count: 1
  en: 'the claim is merely personal.


    The declaratory Court Rescript of 17 September 1796 can find no application here, since on the one hand it interprets the Cabinet Order, the Most High will of Your Royal Majesty Yourself, extensively and against its clear content, which belongs solely to Your Most High[e?] Person and not to the Chief of Justice; and on the other hand it touches on matters of substance.


    But even the said Rescript lays down that personal suits against the Fiscus are to be admitted without question at the parties'' request, but that a certified'
  flagged: []
- page: 6
  confidence: high
  marker_count: 0
  en: 'statement of the damage done by the insurrection, for which by legal principles the insurgents are liable in solidum, might be laid before such a plaintiff by the Fiscus, from which it should appear that the confiscated property of the insurgents is far from sufficient to cover these damages.


    I will gladly accept that procedure, but reserve my objections to such a liquidation of damages, and most humbly ask Your Royal Majesty


    to grant me a hearing at law, and to instruct the Government at Kalisz to open the taking of evidence on the suit I have brought against the Fiscus.'
  flagged: []
- page: 7
  confidence: high
  marker_count: 0
  en: 'I who remain, until death, in deepest reverence Your Royal Majesty''s most humble Stanisl v. Chełmski mpp


    drafted by Mondo


    No. 55.'

  en: 'Berlin, 23 December 1799. To the criminal-court councillor Mondro at Kalisz.


    (concerning v. Chełmski''s complaints against the Kalisz Gov[ernment] over the dismissal of his suit


    c[ontra] Fiscum) acc. on the 23rd.


    ad rev. on the 24th.


    Encl. attached


    Gr.


    on the 31st O. to the post. South Pr.


    To the representation submitted on the 7th of this month by the criminal-court councillor Mondro, as attorney of von Chełmski of Łukom, he is given to see from the enclosed copy in what manner von Chełmski was answered on 21 October this year on his complaints against the Government there over the dismissal of his suit contra Fiscum.


    Signed: Berlin, 23 Dec. 1799. By command.


    [Signature]


    v. [?] on the 25th. 4168.'
  flagged:
  - de: Abweisung
    rendered_as: dismissal
    alt: instruction (Anweisung)
    why: Abweisung, the dismissal of the suit by the Government; not Anweisung, an instruction.

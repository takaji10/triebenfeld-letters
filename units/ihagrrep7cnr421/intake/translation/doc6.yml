  en: 'Copy.


    Most Serene etc. Poznań, 19 March 1799. Suit of Stanisl[aus] von Chełmski of Łukom near Pyzdry v. the Starost Anton v Prusimski of Trąbczyn, concerning 12,000 ducats on the strength of a handwritten bond (ex chirographo).


    On 16 June 1794 I had to advance to the Starost Anton von Prusimski of Trąbczyn, Nowawies, Osiny and the Trąbczyn Hollanders 12,000 ducats for one year, namely until St John''s Day 1795, for which he handed me the blank note enclosed in copy, in the presence of Jacob von Bieńkowski of Mierzewo near Gniezno and of Antonius v Przeradzki. At the loan itself it was agreed between me and the defendant debtor, in the presence of those witnesses, that if the repayment of these 12,000 ducats did not follow on the date fixed for payment, I might treat the said'
  flagged: []
- page: 2
  confidence: high
  marker_count: 0
  en: 'blank note as a contract of antichresis (contractus antichreticus) and take possession of the estates listed as a pledge. Payment did not in fact follow on the date agreed, namely at St John''s Day last year, and I therefore took possession of these estates at that time.


    Meanwhile my debtor was charged by the Fiscus with taking part in the insurrection that broke out in this province in 1794, and because he has not even yet returned, his property was to be seized by the Fiscus in the month of May last year, which I had forestalled only by taking possession of the said estates in the month of June.


    The Fiscus did then bring a suit for eviction before Your Royal Majesty on 7 December 1795, and a hearing on it was set for the 27th'
  flagged: []
- page: 3
  confidence: high
  marker_count: 0
  en: '27 February this year before Your Most High Government; but at it the following settlement was reached between me and the Fiscus: that I am to sequestrate the oft-mentioned estates, first deduct the interest for delay at 7 per cent from the income, but then render account, while still pursuing my claims at law.


    Before Your Royal Majesty I therefore bring my suit against the Starost Anton von Prusimski for these 12,000 ducats, with the request that a hearing to take evidence be appointed, and that the defendant be not only summoned to it but also condemned both to pay the 12,000 ducats owed and to pay interest for delay at 7 per cent, with costs.


    In proof of the correctness of the loan, and that he stipulated taking possession of the pledge in'
  flagged: []
- page: 4
  confidence: high
  marker_count: 1
  en: 'case of non-payment on the fixed date, I refer also to the witnesses proposed above, whom I at the same time most humbly[?] ask to have examined, and that this my suit be deemed sufficiently substantiated. who am etc.


    Your Royal Majesty


    etc.


    v Chełmski.'
  flagged: []
- page: 5
  confidence: high
  marker_count: 5
  en: 'Copy. The blank note named below, signed with my own hand, wishing all the more to secure the date of its payment and to set at rest the concern of the Honourable Lord Chełmski, Treasurer, about being paid on the eve of St John the Baptist in the year 1795, I give this present undertaking of my free will and deliberately, that if on the date I do not pay the 12,000 ducats named below in Dutch gold ring ducats of full weight, without interest, I permit free entry into the [...] estates, that is the villages of Trąbczyn, Nowawies, Osiny, the village of Zarobna[?], Łazy and all the Hollanders belonging to this estate, excepting no village, forest or wood, except the iron works, the magazine and the stores of timber needed for them; which estates named above the Honourable Lord Chełmski shall hold in lieu of interest, without any account, until this sum, expressed in this blank note, turned to my use and taken in cash before witnesses, is repaid; and I wish this undertaking to have[?] such force as though it had been made in person before a court[?]. Given at Łukom, 16 June 1794 [...].


    Belonging to the Honourable Lord Stanisław Chełmski, Treasurer of Wschowa: a blank note for 12,000 Dutch ring ducats. Antoni Prusimski


    Starost of Nieszczewice, in his own hand


    Jakub Bieńkowski


    friend present


    Antoni Przeradzki, friend present.'
  flagged: []

app539680783-001: "Gedruckte Vorladung in polnischer Sprache, die der Gerichtsbote Michał Piechowski am 7./19. Oktober 1860 Karolina Fridenberg in der Kolonie Staro-Łazińska zustellte; die Liste der Geladenen nennt unter Nummer 34 eine Witwe Karolina Friedenberg. Graf Włodzimierz Miączyński, Erbherr von Trąbczyn, den die Kolonisten seines Gutes am 6./18. August 1859 verklagt hatten, erhebt vor dem Zivilgericht des Gouvernements Warschau in Kalisch Widerklage und lässt die Beklagten unter 97 Nummern laden: 80 aus der Kolonie Staro-Łazińska und 17 aus der Kolonie Nowo-Łazińska, darunter Henryk, August und Michał Zelmer (im Druck „Celmer“) sowie die Witwe und die Kinder des Daniel Zelmer. Er verlangt, den Vertrag vom 18. Mai 1805 zwischen dem Fürsten zu Hohenlohe-Ingelfingen und vierzehn Kolonisten für ihn unverbindlich zu erklären und das Recht auf Weide und Holzsammeln im Revier Studzianka des Trąbczyner Waldes nur den sieben Stellen des Vertrags vom 21. Dezember 1828 zuzusprechen, hilfsweise den vierzehn Stellen von 1805; Sachverständige sollen sagen, für wie viel Vieh und wie viel Holz. Zur Begründung führt er an: Nach dem Privileg von Paweł und Katarzyna Prusimski von 1746 hing die Weide von der Einigung jedes Olęders mit dem Gutsherrn ab. Als die Regierungskommission das konfiszierte Gut am 21. Juli 1807 Michalina Dąbska zurückgab, seien die Verpflichtungen des Fürsten erloschen; so habe das höchste Gericht am 7. Juli 1826 gegen Weigel entschieden, der Zinsen von 200.000 polnischen Gulden forderte. Durch die Teilung der Stellen hätten sich Feuerstellen, Bewohner und Vieh zum Schaden der Gutsherrschaft vermehrt; ein Beschluss des Administrationsrats von 1858 verbiete Erbpächtern, einen Hof ohne Erlaubnis des Gutshofs zu teilen. Unter dem Druck stehen die Unterschrift des Gerichtsboten und ein Kostenvermerk."

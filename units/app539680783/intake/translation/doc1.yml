  en: 'colonists now in being, but only to those holdings which were created by that grant and are named
    in the contract of the year 1805. For in the contract of the Prince of Hohenlohe a certain number
    of colonists is set down by number, and so only that number of them ought to exist and only for them
    could the use of pasture and wood-gathering be awarded; for that contract did not empower the colonists
    to divide the lands they occupy into parts. Through the subdivision of the holdings an incomparably
    greater number of hearths, inhabitants and livestock has arisen — and all this has increased the need
    for pasture and wood, to the evident harm of the manor. Thus the resolution of the Administrative
    Council in the year 1858 laid down:


    1. That perpetual leaseholders ought to occupy themselves with farming alone.


    2. That a perpetual leaseholder is not allowed to hold two farms.


    3. That a perpetual leaseholder may neither sublet the farm granted to him nor divide it into parts
    without the express permission of the manor. From this it follows that, at the worst, only those holdings
    have the right to pasture and wood-gathering which existed at the time of the contract of 18 May 1805,
    and all the others, which arose through subdivision, cannot enjoy this right; although the plaintiff
    chiefly maintains that the number of holdings is fixed by the deed of 21 December 1828, and only in
    the alternative by the contract of 18 May 1805.


    With the Trąbczyn forests and their management put in order, the servitude of pasture and wood-gathering,
    exercised in the manner described above, is exceedingly burdensome. Count Miączyński has the right,
    under article 4 of the law on servitudes of pasture and felling of 16/28 June 1830, to demand that
    the number of cattle to be grazed in the Studzianka district be limited to what the land needed when
    this servitude was established. This servitude can therefore be awarded only to the 7 holdings that
    acceded to the deed of 21 December 1828, and in the alternative only to the 14 holdings that were
    the subject of the contract of the year 1805; that is, it can be awarded only in proportion to the
    need of each of these holdings, and never in proportion to the number of settlers on them and the
    number of cattle they keep. To establish this number, therefore, a report of experts ought to be ordered
    on this question of fact:


    For how many cattle, of what kind and in what parts of the Studzianka district, pasture is to be allowed
    in the district of the Trąbczyn forests called Studzianka for the 7 holdings granted by the deed of
    grant of 21 December 1828, declared by Michalina Countess Miączyńska before the notary Kroszczyński
    — and in the alternative for the 14 holdings covered by the contract of 18 May 1805, without regard
    to the number of settlers on each of these holdings through their subdivision, having regard to the
    extent of the holdings, to the meadows and pastures belonging to them, and to the needs of the Trąbczyn
    estate and the forest management introduced in the Studzianka district.


    The same applies to the right of gathering wood, to determine which the plaintiff proposes the following
    question of fact:


    What is to be the greatest quantity of wood that may be gathered, and in what parts of the Studzianka
    district, on each forest day, for each of the seven holdings granted by the contract of 21 December
    1828, and in the alternative for the 14 holdings granted by the contract of 18 May 1805, having regard
    to the needs of each single holding as if it were in the sole possession of one settler, and equally
    to the needs of the Trąbczyn estate, to the forest management introduced in the Studzianka district,
    and to the requirement of the Bank of Poland on account of the Treasury loan it has granted, and likewise
    of the Credit Society on account of the highest loan that is to be taken up.


    The plaintiff''s conclusion is thus fully justified. Costs are due under article 130, and provisional
    enforcement under article 135, of the Code of Judicial Procedure.


    I reserve the development of the grounds, and judgment by default.


    Date as above.


    Michał Piechowski


    Costs


    In all [uncertain: 47] silver roubles 21 kopecks.'

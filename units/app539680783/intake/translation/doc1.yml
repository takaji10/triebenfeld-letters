  en: 'Done as in the Court Summoner''s attestation.


    At the request of Włodzimierz Count Miączyński, heir of the Trąbczyn estate, residing in the village
    of Trąbczyn, Pyzdry District, for whom Stanisław Karasiński and Roman Ostapowicz, advocates of the
    Tribunal, will appear.


    I, the undersigned Court Summoner at the Civil Tribunal in Kalisz, appointed by the Honourable President
    of that Tribunal, residing in Kalisz —


    In connection with the summons issued on 6/18 August 1859 at the request of the colonists on the Trąbczyn
    estate against Włodzimierz Miączyński, by way of counterclaim —


    I have summoned:


    1. Daniel Hom. 2. Jan Mertz. 3. Krystjan Haupt. 4. The heirs of Krystjan Kitke, namely: a) Karolina,
    b) August, c) Ernestyna, d) Karol Wilhelm, minor children, in the person of their mother and natural
    guardian Karolina née Rutching, by her first marriage Kitke, now the wife of Gotlib Szreter, who is
    to act with the assistance and by the authority of that husband. 5. Marcin Merk. 6. Karol Goska. 7.
    Jan Fryderyk Rasch. 8. Ferdinand Wilhelm Schönfisch. 9. Krzysztof Schönfisch. 10. Wilhelm Kinast.
    11. Marcin Merk. 12. Krystjan Kinast. 13. Krystjan Merk. 14. Bogumił Rybicki. 15. Wilhelm Knakfus.
    16. Krystjan Friedenberg. 17. Wilhelm Haupt. 18. Józef Goska. 19. Wilhelm Haupt. 20. Marcin Falkenberg.

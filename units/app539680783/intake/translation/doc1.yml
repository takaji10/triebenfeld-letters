  en: '81. August Stark. 82. Bogusław Moritz. 83. Wojciech Kinast. 84. Bogumił Betka. 85. Michał Kinast.
    86. Krystjan Rejch. 87. Jan Schwebs. 88. Krystjan Haupt. 89. Marcin Schmechel. 90. Marcin Lipeldt.
    91. Marcin Gother. 92. August Zelmer. 93. Krystjan Haupt. 94. Krystjan Haupt. 95. Michał Zelmer. 96.
    Jakób Zelek. 97. Krystjan Kinast — residing in the Nowo-Łazińska colony, commune of Trąbczyn, Pyzdry
    District; to appear within eight days of the service of this summons, not counting the time the law
    allows for distance, at 10 o''clock in the morning, or when this case is called, at the hearing of
    the Civil Tribunal of the Warsaw Governorate in Kalisz, which holds its sittings in the government
    palace in Józefina Street, and to answer the motions of the counterclaiming plaintiff, who will demand:


    1. That, the actions being joined, the contract concluded on 18 May 1805 between the Prince of Hohenlohe-Ingelfingen
    and fourteen colonists of the commune of Trąbczyn, before the Patrimonial Court of the Prince of Hohenlohe
    at Zagórów, be declared not binding on the counterclaiming plaintiff and lapsed in its effects, and
    thereby as giving the defendants to the counterclaim no right of free pasture and wood-gathering in
    the Studzianka district, which belongs to the forests of the Trąbczyn estate.


    2. That the servitude of pasture and wood-gathering in the Studzianka district be awarded only to
    those holdings which were the subject of the contract concluded before the notary Kroszczyński on
    21 December 1828 between Michalina née Prusimska, Countess Miączyńska, and seven colonists; and in
    the alternative:


    3. Should the first conclusion be rejected, that the servitude of pasture and wood-gathering be awarded
    only to the 14 holdings that are named one by one in the contract concluded on 18 May 1805 between
    the Prince of Hohenlohe-Ingelfingen and fourteen colonists.


    4. That, to find for how many cattle grazing in the Studzianka district is to be allowed for each
    holding separately, a report of experts be ordered on these questions of fact:


    A) For how many cattle, of what kind and in what parts of the Studzianka district, pasture is to be
    allowed in the district of the Trąbczyn forests called Studzianka for the seven holdings granted by
    the deed of grant of 21 December 1828, declared by Michalina Countess Miączyńska before the notary
    Kroszczyński, and in the alternative for the fourteen holdings covered by the contract of 18 May 1805,
    without regard to the number of settlers now on each of these holdings through their subdivision,
    having regard to the extent of the holdings, to the meadows and pastures belonging to them, and to
    the needs of the Trąbczyn estate and the forest management introduced in the Studzianka district.


    B) What is to be the greatest quantity of wood that may be gathered, and in what parts of the Studzianka
    district, on each forest day, for each of the seven holdings granted by the contract of 21 December
    1828, and in the alternative for the fourteen holdings granted by the contract of 18 May 1805, having
    regard to the needs of each single holding as if it were in the sole possession of one settler, and
    likewise to the needs of the Trąbczyn estate, to the forest management introduced in the Studzianka
    district, and to the requirements of the Bank of Poland on account of the Treasury loan it has granted,
    and likewise of the Credit Society on account of the highest loan that is to be taken up.


    5. That a member of the Tribunal be delegated to take the experts'' oath, and to appoint them by virtue
    of office should the parties not agree on choosing them freely.


    6. That all the other defendants, to whom the right to exercise the servitude of pasture and wood-gathering
    is not awarded in these proceedings, be forbidden to graze and to gather wood in the Studzianka district.


    7. That judgment be given with provisional enforcement. Lastly:


    8. That the costs of the proceedings be awarded to the plaintiff against the defendants.


    Facts and grounds.


    Paweł Prusimski of Kolno and his wife Katarzyna Prusimska, née Rozdrażewska, heirs of the Trąbczyn
    estate, in the year 1746 granted the Hollanders on the lands of the Trąbczyn estate a privilege settling
    their mutual relations, in which they said among other things:'
  names: []
  numbers: []
  flagged: []
- page: 3
  confidence: high
  marker_count: 0
  en: '“I do not forbid pasture for all their livestock, which they shall enjoy on coming to an agreement.”


    By this privilege, then, the right of pasture depended on a particular agreement of each single Hollander
    with the owner of the Trąbczyn estate.


    When, in consequence of political events, the part of the Polish country within which the Trąbczyn
    estate lay passed under Prussian rule, this estate, then the property of Antoni Prusimski, Starost
    of Niszczewice, was confiscated and given to the Prince of Hohenlohe-Ingelfingen, who on 18 May 1805
    concluded with fourteen Hollanders of the commune of Trąbczyn, named one by one in that contract,
    a contract of sale of a part of the pine forest and marshes adjoining the lands they held, 42 Hufen
    of Magdeburg measure in area. In § 4 of that contract it is said:


    “They take free pasture, without payment, in the part of the pine forest on the Biskupice boundary
    called the Zarzyński district, and likewise in that part of theirs the free gathering of wood on the
    customary forest days.”


    The Trąbczyn estate remained in the possession of the Prince of Hohenlohe-Ingelfingen until the time
    when, after the change of government that followed, the Governing Commission, as the highest authority
    in the country, by its resolution of 21 July 1807 restored Michalina Dąbska, née Prusimska, to the
    ownership of the Trąbczyn estate, which had been confiscated from her father Antoni Prusimski. With
    Dąbska restored to the rights that were hers after her father, all acts and obligations entered into
    by the Prince of Hohenlohe were annulled. This question of principle was decided by the judgment of
    the Court of the Highest Instance given on 7 July 1826 in the case between Michalina née Prusimska,
    by her first marriage Dąbska, by her second the wife of Stanisław Miączyński, and Bogumił Karol Weigel.
    In those proceedings Weigel claimed interest on a capital of 200,000 Polish złoty which the Prince
    of Hohenlohe-Ingelfingen had raised as a loan on the Trąbczyn estate, and Michalina Countess Miączyńska
    for her part demanded that this capital be struck out of the mortgage register. The Court of the Highest
    Instance adopted these principles:


    That the passing of the Trąbczyn estate into the ownership of the Prince of Hohenlohe-Ingelfingen
    had force only so long as the same state of things lasted as before; that the owner of the estate
    was restored, by the will and resolution of the Highest Authority, to such rights in respect of his
    estate as were his when it was taken from him; that a debt contracted by the donee, once he proved
    to be a conditional possessor, ceased with the fall of his title to bind the estate charged with it
    — and in consequence of these principles the Court of the Highest Instance dismissed Weigel''s demand
    that interest on the capital of 200,000 Polish złoty be awarded to him, and ordered the capital itself
    to be struck out.


    On the same principles, then, adopted in that judgment, the contract concluded on 18 May 1805 between
    the Prince of Hohenlohe-Ingelfingen and the 14 Hollanders did not bind Michalina Countess Miączyńska
    in the least and must be held to have lapsed in its effects, like all the obligations entered into
    by the Prince of Hohenlohe in respect of the Trąbczyn estate.


    Neither the Hollanders themselves nor Michalina Countess Miączyńska understood the matter otherwise
    when on 21 December 1828, before the notary Mikołaj Kroszczyński, an agreement settling their mutual
    relations was concluded between Michalina née Prusimska, Countess Miączyńska, and seven rent-payers
    holding by purchase, named one by one in that deed. Although in that contract the parties cited the
    contract of 18 May 1805, they did not confirm it in the least; they only carried some conditions of
    that contract over into the new agreement. Among these conditions is § III, which reserves the right
    of common pasture and of gathering wood in the Zarzyński district, or Studzianka, on the side of the
    Biskupice estate. By this last deed, then, only the settlers named in it had the right to free pasture
    and the free gathering of wood in the Studzianka district, since for all the other colonists the grant
    of the Prince of Hohenlohe-Ingelfingen of 18 May 1805 had lost all force, on the principles adopted
    in the judgment of the Highest Court of 7 July 1826.


    In the alternative: should it be held that the colonists covered by the contract of 18 May 1805 also
    have the right to exercise pasture and to gather wood in the Studzianka district, this right cannot
    belong separately to all the'

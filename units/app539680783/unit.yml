# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One printed legal paper of 1860 in Polish, from the papers of Albert Breyer
  (1889-1939), a teacher and historian of the German settlements in central
  Poland: a summons of four printed pages with a fifth page on which the
  court summoner certifies its service, filled in and signed by hand. Count
  Włodzimierz Miączyński, heir of Trąbczyn in the Pyzdry district of the
  Kingdom of Poland, had been sued on 6/18 August 1859 by the colonists on
  his estate. By this paper he counterclaims before the Civil Tribunal of
  the Warsaw Governorate at Kalisz and has 97 named persons summoned, 80 of
  the Staro-Łazińska colony and 17 of the Nowo-Łazińska colony. He asks the
  court to declare that the contract of 18 May 1805 between the Prince of
  Hohenlohe-Ingelfingen and fourteen colonists, made before the Prince's
  patrimonial court at Zagórów, does not bind him; to award the servitude of
  pasture and wood-gathering in the Studzianka district of the Trąbczyn
  forest only to the seven holdings of the contract of 21 December 1828
  between Michalina Countess Miączyńska and seven colonists, or at most
  to the fourteen holdings of 1805; and to have
  experts say for how many cattle and how much wood. The grounds recount the
  privilege of 1746, the Prussian confiscation and the gift to the Prince,
  the restoration of the estate to Michalina Dąbska on 21 July 1807, and the
  judgment of 7 July 1826 against the creditor Weigel. This copy was served
  on Karolina Fridenberg in the Staro-Łazińska colony on 7/19 October 1860
  by the court summoner Michał Piechowski; the list has a widow Karolina
  Friedenberg as its number 34.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A printed court paper of the Kingdom of Poland of 1860, in the legal Polish
  of the time and in its spelling (kolonji, processie, Juljanny; the print's
  "é" is given as "e"). Dates are given in both calendars ("7/19
  Października"). "Woźny" is the court summoner who serves the paper;
  "Patronowie Trybunału" are the advocates admitted at the Tribunal;
  "rekonwencyjnie" is by way of counterclaim, and the "powód
  rekonwencyjny" is the Count. "SSrów" is "sukcesorów", the heirs of.
  "Holendrzy" are the Hollanders of the edition, and "kolonja" in the
  argument is one colonist's holding, not the settlement; "zbieranina" is
  the gathering of fallen wood, a "dzień gajowy" a day on which it is
  allowed; "rewir" is a district of the forest; "huba" is the Hufe;
  "Regent" or "Rejent" is a notary; "okupni czynszownicy" are rent-payers
  who hold by purchase; "dwór" and "dominja" are the manor. "K. P. S." is
  the Kodeks Postępowania Sądowego; "d. j. w." is "dnia jak wyżej", date as
  above. The print spells the family Prusimski "Prusiński" and the banker
  Weigel "Wejgel"; "Celmer" is the Zelmer of the edition. In the list of
  the summoned the names stand in the accusative: "Bogumiła Runge" is
  Bogumił Runge, a man. A name in the margin of page 1 replaces a printed
  name the summoner struck out. A word followed by [?] or written [word?] is
  one read with doubt.

title: >-
  A printed summons served on 19 October 1860 on Karolina Fridenberg of the
  Staro-Łazińska colony: Count Włodzimierz Miączyński, owner of Trąbczyn,
  counterclaims before the Civil Tribunal at Kalisz against 97 colonists of
  two colonies on his estate, to have the Prince of Hohenlohe-Ingelfingen's
  contract of 1805 declared void and their pasture and wood-gathering in his
  forest cut back to seven, or at most fourteen, holdings.
title_de: >-

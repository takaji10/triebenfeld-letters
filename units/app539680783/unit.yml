  Kolonie Staro-Łazińska zugestellt: Graf Włodzimierz Miączyński, Besitzer
  von Trąbczyn, erhebt vor dem Zivilgericht in Kalisch Widerklage gegen 97
  Kolonisten zweier Kolonien seines Gutes, um den Vertrag des Fürsten zu
  Hohenlohe-Ingelfingen von 1805 für unwirksam erklären und ihre Weide und
  ihr Holzsammeln in seinem Wald auf sieben, höchstens vierzehn Stellen
  beschränken zu lassen.

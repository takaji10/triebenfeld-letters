# German summaries of ADWł 85, written in the working session from the Polish as read against the scans
# (intake/text85.py, 2026-10-15).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
adwl85-001: "Der Bericht über die Visitation der Pfarrei Trąbczyn im Dekanat Konin, auf Polnisch, von 1790 und 1791 (Blatt 23 Rückseite bis 25 Rückseite und 28 Rückseite bis 29 Rückseite des Bandes; die Blätter dazwischen sind nicht in der Edition). Der Pfarrer Józef Zurkowski, 1740 in der Diözese Posen geboren und 1767 zum Priester geweiht, wurde 1785 auf die Präsentation Antoni Prusimskis, Starosten von Niszczewice, Erbherrn und Patrons von Trąbczyn, eingesetzt; für einen Vikar, einen Organisten und einen Schulmeister gibt es eine Stiftung, doch keiner von ihnen ist an der Kirche. Zur Pfarrei gehören Trąbczyn, Mariantów, Porąbki, ein Vorwerk, die neuen und alten Olędry, Łazy, Osiny und Nowawies, alle Erbgut des Starosten. Sie zählt 760 Seelen, 555 Katholiken und 205 Dissidenten, 189 davon in den Olendry; die Tabelle für 1791 gibt die Zahlen Dorf für Dorf, und für 1790 nennen die Kirchenbücher 28 Taufen, 10 Trauungen und 29 Begräbnisse. Die kreuzförmige Kirche des heiligen Martin mit zwei hölzernen Kapellen, zum Teil von den einstigen Erben Trąmpczyński erbaut und später von der Kammerherrin Prusimska, geborene Rozdrażewska, erweitert (wann, weiß man nicht), wurde 1546 geweiht; der Bericht gibt ihre Maße, ihre Ausstattung und was auszubessern ist, den Friedhof, den Glockenturm mit zwei Glocken und das Beinhaus. Das Patronat ist weltlich und liegt jetzt bei Antoni Prusimski; es gibt fünf Altäre. Die Bücher der Taufen und Trauungen beginnen 1597, das der Toten 1728; Bücher, die bei der Visitation des Geistlichen Dorposki vorhanden waren, sind durch einen Betrug und weil man nicht wusste, wem sie gehörten, den Gläubigern des verstorbenen Pfarrers Paprocki gegeben worden. Die Stiftungen und Urkunden reichen von 1636 bis 1697: Summen auf Trąbczyn, Kurów, Strzałkowo und Przespolew für Messen, die Zehnten, die das Konsistorium in Gnesen 1692 zusprach, der Krug, der 1694 bestätigt wurde, und das Land, das Andrzej Trąmpczyński 1697 der Kirche abtrat. Auf der letzten Seite beginnt die Beschreibung des Pfarrhauses."
adwl85-002: "Die Tabelle der Seelen der Pfarrei Zagórów im Jahr 1791, Ort für Ort, auf Polnisch (Blatt 34a der Visitation des Dekanats Konin). Vierundzwanzig Orte, von der Stadt Zagórów (275 Männer, 298 Frauen) bis zur Hauländersiedlung Holendry Wrąbczyn, darunter Łukom, Drzewce, Oleśnica, Kopojno, Skokum und Wrąbczyn, jeweils katholische Männer, Frauen, Knaben und Mädchen und Dissidenten; Dissidenten leben nur in Łomow, Myszakowko, Imielno und Holendry Wrąbczyn. Die Summen des Schreibers sind 1028, 1030, 270 und 246 Katholiken und 57, 55, 27 und 27 Dissidenten, 2734 im Ganzen; seine Spalte der Frauen ergibt zusammengezählt 1040, seine Summen zusammen 2740. Eine Notiz neben Myszakowko verzeichnet dort eine Frau von 110 Jahren."

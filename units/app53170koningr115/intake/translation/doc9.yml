  en: 'The Right Honourable Chełmski against the Right Honourable Prusimski — Protest


    To the office and present records of the Konin Municipal Court, appearing in person, the Right Honourable
    Stanisław Ścibor Chełmski, heir of the estates of Łukom with their appurtenances, possessor by force
    of his rights of the olędry called Lusnia, lodged this protest to the present records against the
    Right Honourable Antoni Prusimski of Kolno, Starost of Niszczewice, heir of the estates of the Trąmpczyn
    tract, and likewise against his household servants and subjects — for this reason: that the same Right
    Honourable Prusimski, proceeding in subversion of the laws, although he well knows that possession
    of the Lusnia olędry has been acknowledged by law to him, the protester, nonetheless — whether by
    his special mandate or by his connivance — permitted the Honourables Lipiński, [his] steward, and
    Marzęcki, his chamber attendant, together with those recruited to them — Kazimierz, farm servant of
    the miller of Drzęzgi, Filip Wąchnicki, and others — to ride upon and attack the tavern and the olędry;
    which same violent attackers, having set aside the safety cautiously secured for the settlers dwelling
    there, did not scruple to carry out and perpetrate various transgressions and acts of violence — in
    respect of which unlawful conduct the same Right Honourable Chełmski hereby protests.


    Stanisław Ścibor Chełmski, by his own hand'

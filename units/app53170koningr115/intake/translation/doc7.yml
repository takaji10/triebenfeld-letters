  en: 'Done in Konin on the Tuesday next after the Feast of Saint Andrew the Apostle in the year of the
    Lord 1772.


    On behalf of the Right Honourable Chełmski — Judicial Site Inspection of the Violated Tavern in Lusnia


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Joannes
    Bikierski of Węgierce, Royal Court Summoner, General, being sound, certified — because he, having
    with him two noblemen, namely the Honourables Antoni Fulwarski and Jakub Kraśniewski, although absent
    here from the court for the present, being nonetheless present at the time at the location of the
    below-written matter — on the immediately preceding Saturday, at the request and official requisition
    of the Right Honourable Stanisław Ścibor Chełmski, heir and possessor of the estates of Łukom, Łumowo,
    Myszakowo, and the olędry planted in the Lusnia pine forest, had officially and personally descended
    to the estate of the said olędry and the Lusnia tavern, and being there in such manner, saw and duly
    inspected:


    In that same tavern, accustomed to dispensing liquors — three windows [and] four doors with iron hinges
    removed from that same building.


    Which aforementioned things, on the immediately preceding Saturday, by the Honourable Lipiński, steward
    of Trąmpczyn; Radzewski, clerk; the revenue steward, keeper of the pine forests; and the one called
    Wąchnicki, manorial servant — deep in the night, by the mandate of the Right Honourable Antoni Prusimski
    of Kolno, Starost of Niszczewice, heir of the estates of Trąmpczyn — seized and removed in a violent
    manner, together with a table and a barrel of beer, and carried off to the Trąmpczyn estate with a
    band of Trąmpczyn subjects, fitted out for attempting disturbances — he asserted to be so. Concerning
    which, the present report.'

  en: 'On the part of the Right Honourable Chełmski against the Right Honourable Prusimski — Report of
    a Citation


    Let there be seen here, among the produced documents, the report of the citation issued on the part
    of the Right Honourable Stanisław Chełmski against the Right Honourables Antoni Prusimski and the
    successors of the late Right Honourable Prusimska, born Rozdrażewska, for the Kalisz land courts to
    be held here.'

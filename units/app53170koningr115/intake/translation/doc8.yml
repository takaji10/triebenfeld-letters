  en: 'Done in Konin on the Friday after Ash Wednesday next, namely on the twenty-sixth day of the month
    of February in the year of the Lord 1773.


    Judicial Site Inspection of Felled Trees — on behalf of the Right Honourable Prusimski


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Bartłomiej
    Szepczyński of Trąmpczyn, Royal Court Summoner, General, being sound, certified — because he, having
    with him two noblemen, namely the Honourables Piotr Makowski and Świętosław Bogusławski, although
    absent here from the court for the present, being nonetheless present at the time at the location
    of the below-written matter — on the day preceding today''s act —'
  names: []

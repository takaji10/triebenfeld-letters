- page: 2
  confidence: high
  marker_count: 0
  en: 'at the request and official requisition of the Right Honourable Antoni Prusimski of Kolno, Starost
    of Niszczewice, heir of the estates of Trąmpczyn — to the Trąmpczyn pine forests and the meadows pertaining
    to the same estates — descended personally and officially; and being there in such manner, saw and
    duly inspected and counted: namely, in the pine forest lying beyond the woodland called Lusnia, fifty-one
    stumps from a pine tree of value for building, felled; also, in the meadows pertaining to the estate
    of Trąmpczyn, called Kąty, thirty-two alder trunks left [there], from a tree cut down.


    Which aforementioned things — immediately at that time, by the subjects of the Right Honourable Chełmski,
    heir of the estates of Łukom, carried away from the pine forest beyond Lusnia; and then [by] men of
    the Podbiele estate of the Right Honourable Zakrzewska, cut down and intercepted from the meadows
    — asserting that he had duly seen, inspected, and counted [the same], he attested to the present office.'

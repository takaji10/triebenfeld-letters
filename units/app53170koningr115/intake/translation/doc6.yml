  en: 'On behalf of the same — Judicial Site Inspection of the Demolition of the Embankment at Łukom


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Nicolaus
    Krzepczyński of Myszaków, Royal Court Summoner, General, being sound, certified — because he, having
    with him two noblemen, namely the Honourables Antoni Wolski and Konstanty Folwarski, although absent
    here from the court for the present, being nonetheless present at the time at the location of the
    below-written matter — at the request and official requisition of the Right Honourable Stanisław Ścibor
    Chełmski, heir of the estates of Łukom with their appurtenances — on the immediately preceding Monday
    [went] to the estate of Łukomia and the Lusnia pine forest, and being there in such manner, they saw
    and duly inspected:


    Having arrived at the fishpond [stawisko] lying in the Łukomia pine forest, they saw an embankment
    dug up, and in it, fourteen [elements] cut with axes — enclosure elements, posts, sluice gates, and
    channels — demolished completely, and the water let out with the fish. Also there: twenty thick clubs
    newly cut, prepared for combat, and then left behind. Also: in the pine forest called Lusnia, among
    the olędry, in the innkeeper''s cottage, in the walls all around — eight holes cut in the structural
    timber for aimed shooting; three windows cut down to a single pane and shot through.


    Which aforementioned things the same above-named Royal Court Summoner — namely, concerning the demolition
    of the embankment, [carried out] by more than thirty of the Trąmpczyn subjects assembled, to be identified
    by name afterward, in the presence of the Right Honourable Prusimski, Starost of Niszczewice; and
    concerning the shooting through of the house, [carried out] by licentious subordinate men, by the
    mandate and command of the Right Honourable Prusimski, Starost of Niszczewice — asserted to have been
    done and inflicted on the same day. Concerning which, the present report.'

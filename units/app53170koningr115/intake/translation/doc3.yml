  en: 'On behalf of the Right Honourable Prusimski — Oblata of the Approbation made for the Quashing


    Let there be seen here the Oblata, submitted among the produced documents, of an authentic extract
    drawn from the records of the municipal court of Bydgoszcz, containing the approbation of the term
    for quashing the condemnation, acknowledged by the Right Honourable Antoni Prusimski of Kolno, Starost
    of Niszczewice, before the municipal court records of Bydgoszcz.'

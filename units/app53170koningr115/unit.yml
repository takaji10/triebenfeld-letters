# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  Ten entries from the register of the castle court at Konin, 1768 to 1773,
  on the quarrel over the Lusnia wood: notes of citations and of the delivery
  of the wood to Chełmski, and the court messengers' reports and a protest
  on the fighting that followed, with an embankment broken, an inn shot at
  and stripped, weapons taken and timber felled.
title_de: >-
  Zehn Einträge aus dem Register des Burggerichts Konin, 1768 bis 1773, zum
  Streit um den Wald Lusnia: Vermerke über Ladungen und über die Einweisung
  Chełmskis in den Wald sowie die Berichte der Gerichtsboten und ein Protest
  über die folgenden Kämpfe, mit einem durchbrochenen Damm, einem
  beschossenen und ausgeräumten Wirtshaus, erbeuteten Waffen und gefälltem
  Holz.

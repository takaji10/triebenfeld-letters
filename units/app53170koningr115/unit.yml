# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Ten short entries from a register of the castle court of Konin for 1768 to
  1774, in Latin, two of them with the thing seen described in Polish. Four
  are one-line notes that a paper was brought in: Stanisław Chełmski's
  citation of Antoni Prusimski and the heirs of Katarzyna Prusimska (January
  1768), the two sides' citations of each other and of the abbey of Ląd
  before the Crown Tribunal at Bydgoszcz (17 May 1768), Prusimski's
  approbation for quashing a condemnation (May 1768), and the delivery of
  the Lusnia wood with its Olęder settlers to Chełmski (2 December 1771).
  Six are reports and a protest on the violence that followed that delivery:
  on 20 December 1771 Chełmski's messenger lays captured weapons before the
  office and reports an embankment at the pond-ground broken by Prusimski's
  subjects and the settlers' inn shot at; on 1 December 1772 the inn's
  windows and doors have been carried off to Trąbczyn; on 26 February 1773
  Prusimski's messenger counts pines and alders felled by Chełmski's people;
  in March 1773 Chełmski protests, and his messenger reports the inn wrecked
  in the night of 29 January.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Entries of a court register of 1768 to 1773, in formulaic Latin with some
  Polish. The English of documents 4 to 10 is the editor's own translation.
  "Videatur hoc loco ... in Productis" notes that a paper is filed among
  those produced; "citatio" a summons; "oblata" a paper brought in to be
  entered; "traditio" a delivery of possession; "manifestatio" a protest;
  "visio" a court messenger's inspection; "Ministerialis" the messenger
  (woźny); "gaza" a hut or house; "Hollandi", "olędrzy" settlers under
  Olęder law; "stawisko" the ground of a former pond. Trąmpczyn is Trąbczyn.

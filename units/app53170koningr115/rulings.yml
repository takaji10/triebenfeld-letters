dates:
  # [year, month, day, precision]; read off the document: the line "Actum in
  # Conin ..." that the entry stands under on its own page.
  read:
    "2": [1768, 5, 17, "day"]     # Feria Tertia post Dominicam Exaudi proxima 1768 (Exaudi was 15 May)
    "4": [1771, 12, 2, "day"]     # Feria Secunda post Festum Sancti Andreae Apostoli proxima 1771
    "5": [1771, 12, 20, "day"]    # Feria Sexta pridie Festi Sancti Thomae Apostoli 1771
    "6": [1771, 12, 20, "day"]    # the same sitting
    "7": [1772, 12, 1, "day"]     # Feria Tertia post Festum Sancti Andreae Apostoli proxima 1772
    "8": [1773, 2, 26, "day"]     # "Die Vigesima Sexta Mensis Februarii Anno Domini 1773"
  supplied: {}
  twin: {}

  # [year, month, day, precision, basis]; the basis is shown to the reader.
  # Three entries stand under a sitting whose heading is on a page that is
  # not among the scans. They are placed between the dated headings before
  # and after them in the book.
  inferred:
    "1": [1768, 1, null, "month", "Entered on leaf 3 verso of the book for 1768, above the heading of the sitting of 15 January 1768; the heading of its own sitting is on an earlier page, not among the scans."]
    "3": [1768, 5, null, "month", "Entered between the headings of the sittings of 18 May 1768 (leaf 35 verso) and 27 May 1768 (leaf 37); the heading of its own sitting is on a page not among the scans."]
    "9": [1773, 3, null, "month", "Entered on leaf 245, between the headings of the sittings of 2 March 1773 (leaf 242) and 13 March 1773 (leaf 246); the heading of its own sitting is on a page not among the scans."]
    "10": [1773, 3, null, "month", "Entered on leaf 245, between the headings of the sittings of 2 March 1773 (leaf 242) and 13 March 1773 (leaf 246); the heading of its own sitting is on a page not among the scans."]

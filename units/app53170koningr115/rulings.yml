# Editorial rulings for 53/17/0/-/Konin Gr.115 (APP).
#
# Ten documents, one for each entry of the register; the two notes of one
# sitting on leaf 35 verso are one document (docs/PRUSIMSKI_ERA_PLAN.md,
# "One document or many"). Which entry is which is in intake/holding.py.
# Established 2026-10-07.

places:
  # Place of writing: every sitting is headed "Actum in Conin".
  overrides:
    "1": Konin
    "2": Konin
    "3": Konin
    "4": Konin
    "5": Konin
    "6": Konin
    "7": Konin
    "8": Konin
    "9": Konin
    "10": Konin

dates:
  # [year, month, day, precision]; read off the document: the line "Actum in
  # Conin ..." that the entry stands under on its own page.
  read:
    "2": [1768, 5, 17, "day"]     # Feria Tertia post Dominicam Exaudi proxima 1768 (Exaudi was 15 May)
    "4": [1771, 12, 2, "day"]     # Feria Secunda post Festum Sancti Andreae Apostoli proxima 1771
    "5": [1771, 12, 20, "day"]    # Feria Sexta pridie Festi Sancti Thomae Apostoli 1771
    "6": [1771, 12, 20, "day"]    # the same sitting
    "7": [1772, 12, 1, "day"]     # Feria Tertia post Festum Sancti Andreae Apostoli proxima 1772
    "8": [1773, 2, 26, "day"]     # "Die Vigesima Sexta Mensis Februarii Anno Domini 1773"
  supplied: {}
  twin: {}

  # [year, month, day, precision, basis]; the basis is shown to the reader.
  # Three entries stood under a sitting whose heading is on a page that is
  # not among the scans, and were placed between the dated headings before and
  # after them. The editor transcribed those headings (2026-11-27): the entries
  # are dated by them (sitting:), and the headings are in sitting_headings.yml.
  inferred: {}
  # The date of the sitting the entry stands under, where the heading is not
  # part of the transcription: [year, month, day, precision, basis].
  sitting:
    "1": [1768, 1, 2, "day", "The heading of the sitting, on p. 1 (shown above the text): Saturday 2 January 1768."]
    "3": [1768, 5, 25, "day", "The heading of the sitting, on p. 36v (shown above the text): Wednesday 25 May 1768."]
    "9": [1773, 3, 12, "day", "The heading of the sitting, on p. 243v (shown above the text): Friday 12 March 1773."]
    "10": [1773, 3, 12, "day", "The heading of the sitting, on p. 243v (shown above the text): Friday 12 March 1773."]
  no_date: []


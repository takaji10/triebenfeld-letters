# A finding aid, not part of the edition text.
app53170koningr115-001: "Registervermerk im Buch des Burggerichts Konin, Januar 1768: Der Bericht über die Ladung, die Stanisław Chełmski gegen Antoni Prusimski und die Rechtsnachfolger der verstorbenen Prusimska, geborene Rozdrażewska, vor das Kalischer Landgericht erwirkt hat, liegt bei den vorgelegten Schriftstücken."
app53170koningr115-002: "Zwei Registervermerke vom 17. Mai 1768 über Ladungen vor das Krontribunal in Bromberg. Antoni Prusimski von Kolno, Starost von Niszczewice, hat die Chełmski, die Żychliński-Erben, Ignacy Gałecki, Starost von Bromberg, sowie Abt und Konvent von Ląd laden lassen, zur Festlegung der Grenze; Stanisław Chełmski seinerseits den Abt Słowiecki und den Konvent von Ląd, Prusimski und Gałecki. Beide Vermerke sind nur teilweise transkribiert."
app53170koningr115-003: "Registervermerk vom Mai 1768: Für Antoni Prusimski von Kolno, Starost von Niszczewice, wird ein beglaubigter Auszug aus den Akten des Burggerichts Bromberg vorgelegt; er enthält die von ihm dort erklärte Anerkennung des Termins zur Aufhebung der Verurteilung."
app53170koningr115-004: "Registervermerk vom 2. Dezember 1771: Für Stanisław Ścibor Chełmski, Erbherrn von Łukomia, wird die Besitzeinweisung in den Wald Lusnia mit den Olędern vorgelegt; sie liegt bei den vorgelegten Schriftstücken."
app53170koningr115-005: "Eintrag vom 20. Dezember 1771. Der Gerichtsbote Nicolaus Krzepczyński von Myszaków legt im besonderen Auftrag von Stanisław Ścibor Chełmski dem Burgamt Konin Waffen vor: vier Säbel in Scheiden mit Riemen und einen blanken, vier Spieße mit eisernen Spitzen, drei lange Büchsen und eine mit Messing beschlagene Flinte, mit Blei und feinem Pulver geladen. Nach seiner Angabe hat Chełmski sie am vergangenen Montag im Wald Lusnia erbeutet, als Antoni Prusimski von Kolno, Starost von Niszczewice, dort gewaltsam einfiel und Bewaffnete das Haus des Schankwirts belagerten. Der Bote nimmt die Waffen wieder an sich."
app53170koningr115-006: "Bericht des Gerichtsboten Nicolaus Krzepczyński vom 20. Dezember 1771, für Stanisław Ścibor Chełmski. Mit zwei Adligen, Antoni Wolski und Konstanty Folwarski, hat er am vergangenen Montag den Grund von Łukomia und den Wald Lusnia besichtigt. Am Teichgrund im Łukomer Wald sahen sie den Damm aufgegraben, das Wehr mit Pfosten, Schützen und Rinnen mit Äxten zerhauen und völlig beseitigt, das Wasser mit den Fischen abgelassen; dort lagen zwanzig frisch geschnittene dicke Knüppel. Im Schankhaus bei den Olędern im Wald Lusnia waren ringsum acht Schießlöcher in die Wände gehauen und drei Fenster zerschossen. Nach seiner Angabe geschah der Dammbruch durch mehr als dreißig Untertanen von Trąbczyn in Gegenwart Prusimskis, das Durchschießen des Hauses durch seine Leute auf seinen Befehl, am selben Tag."
app53170koningr115-007: "Bericht des Gerichtsboten Joannes Bikierski von Węgierce vom 1. Dezember 1772, für Stanisław Ścibor Chełmski, Erbherrn von Łukom, Łomowo und Myszakowo und Besitzer der Olęder im Wald Lusnia. Mit zwei Adligen hat er am vergangenen Samstag das Schankhaus in Lusnia besichtigt: Drei Fenster und vier Türen mit eisernen Angeln waren aus dem Haus herausgenommen. Nach seiner Angabe haben das in derselben Nacht der Trąbczyner Verwalter Lipiński, der Schreiber Radzewski, der Vogt und Waldhüter und der Hofdiener Wąchnicki auf Befehl von Antoni Prusimski getan und die Stücke samt einem Tisch und einem Fass Bier mit einer Schar Trąbczyner Untertanen nach Trąbczyn fortgeschafft."
app53170koningr115-008: "Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 26. Februar 1773, für Antoni Prusimski von Kolno, Starost von Niszczewice. Mit zwei Adligen hat er am Vortag die Trąbczyner Wälder und Wiesen besichtigt und gezählt: im Wald hinter dem Gehölz Lusnia einundfünfzig Stümpfe gefällter, zum Bauen tauglicher Kiefern, auf den Wiesen namens Kąty zweiunddreißig Erlenstümpfe. Nach seiner Angabe haben die Untertanen Chełmskis das Holz aus dem Wald abgefahren und Leute vom Gut Podbiele der Frau Zakrzewska die Erlen auf den Wiesen geschlagen."
app53170koningr115-009: "Protest von Stanisław Ścibor Chełmski, Erbherrn von Łukom und Besitzer der Olęder von Lusnia, gegen Antoni Prusimski von Kolno, Starost von Niszczewice, dessen Hofleute und Untertanen, eingetragen in Konin im März 1773 und von Chełmski unterschrieben. Prusimski habe, obwohl er wisse, dass der Besitz der Olęder von Lusnia Chełmski rechtlich zuerkannt sei, seinen Verwalter Lipiński und seinen Kammerdiener Marzęcki mit anderen das Schankhaus und die Olęder überfallen lassen; sie hätten dort Gewalttaten verübt."
app53170koningr115-010: "Bericht des Gerichtsboten Joannes Bikierski von Węgierki, eingetragen in Konin im März 1773, für Stanisław Chełmski. Mit zwei Adligen hat er am vergangenen Mittwoch die Olęder-Siedlung Lusnia besichtigt: Im Schankhaus waren der Ofen, drei Fenster und vier Türen, die Chełmski neu hatte herrichten lassen, zerhauen und herausgeschlagen, der Schornstein zerstört, das Bier- und Branntweingeschirr zerschlagen. Nach seiner Angabe haben das die Adligen Lipiński, Marzęcki und andere in der Nacht des 29. Januar des laufenden Jahres getan."

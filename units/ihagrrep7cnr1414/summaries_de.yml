ihagrrep7cnr1414-001: "Konzept eines Schreibens des Departements der auswärtigen Angelegenheiten, Berlin, 11. Januar 1797, an den Minister Graf von Hoym und gleichlautend an den Minister Freiherr von Schroetter; eine größere Hand fügt den Großkanzler von Goldbeck hinzu, und drei Reinschriften werden angeordnet. Das Departement teilt in Abschrift mit, was der königliche Resident in Venedig, Graf von Cattaneo, auf Verlangen des Anton Prusimski berichtet hat, eines Eingesessenen der von der ehemaligen Republik Polen erworbenen Provinzen, der sich gegenwärtig in Venedig aufhält. Von den beiden Unterschriften ist die zweite die des Ministers Haugwitz. Am 12. gingen alle Schreiben zur Post."
ihagrrep7cnr1414-002: "Auszug aus der Depesche Nr. 423 des Grafen Cattaneo, Venedig, 14. Dezember 1796, in französischer Sprache. Der polnische Edelmann Antoine Prusimski ist bei ihm erschienen, in wirklich zerrütteter Gesundheit und durch den Tod seiner Frau fast bis zur Stumpfheit getroffen, und hat um ein Attest über seine traurige Lage und darüber gebeten, dass er gegenwärtig und in dieser Jahreszeit nicht reisen könne. Cattaneo glaubte es ihm nicht verweigern zu können: Wer schon erschöpft sei, wenn er von einem Haus ins andere gehe, könne nicht von einem Land ins andere reisen. Das Departement erhielt den Auszug am 2. Januar 1797 und leitete ihn dem Herrn von Raumer zu; dieser verfügte am 8. Januar, Hoym und Schrötter zu benachrichtigen."
ihagrrep7cnr1414-003: "Schrötter dankt dem Departement der auswärtigen Angelegenheiten für die Nachricht vom 11. des Monats über Anton Prusimski, der in der neuen Erwerbung von Polen ansässig ist und sich gegenwärtig in Venedig aufhält. Er hat davon dem Staatsminister Graf von Hoym weiter Nachricht gegeben, weil nicht feststeht, ob Prusimski in Neuostpreußen oder in Südpreußen ansässig ist. Berlin, 29. Januar 1797. Das Departement erhielt das Schreiben am 8. Februar und legte es am 16. März zu den Akten."

# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt.
title: >-
  Three papers of the Prussian department of foreign affairs, December 1796
  to February 1797, on Antoni Prusimski, the former owner of the Trąbczyn
  estates, who was then at Venice: the Prussian resident there reports that
  he has certified that Prusimski, ill and broken by his wife's death, cannot
  travel, and the department passes the report to the ministers for the new
  Polish provinces and to the Grand Chancellor.
title_de: >-
  Drei Schriftstücke des preußischen Departements der auswärtigen
  Angelegenheiten, Dezember 1796 bis Februar 1797, über Antoni Prusimski, den
  früheren Besitzer der Güter von Trąbczyn, der sich damals in Venedig
  aufhielt: Der preußische Resident dort berichtet, er habe Prusimski
  bescheinigt, dass dieser krank und durch den Tod seiner Frau gebrochen sei
  und nicht reisen könne, und das Departement gibt den Bericht an die Minister
  für die neuen polnischen Provinzen und an den Großkanzler weiter.

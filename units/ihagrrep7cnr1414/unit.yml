# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Four pages from a file of the Prussian General Directory's department for
  South Prussia, which received them from the department of foreign affairs:
  the papers by which the news that Antoni Prusimski was at Venice went round
  the Prussian ministries in the winter of 1796 to 1797. Prusimski, Starost of
  Niszczewice, had taken part in the Polish rising of 1794 and left the
  country; Prussia had confiscated his estates, Trąbczyn among them, and in
  1796 given them to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. In his
  dispatch No. 423 of 14 December 1796 the Prussian resident at Venice, Count
  Cattaneo, reports in French that the Polish gentleman Antoine Prusimski came
  to him in ruined health and dulled by grief at his wife's death, and asked
  for a certificate of his condition and that he could not travel in that
  season; Cattaneo did not think he could refuse it. The department's
  councillor Raumer directs on 8 January 1797 that Count Hoym and Baron
  Schrötter be told. The draft of 11 January 1797, signed by two ministers of
  the department, sends a copy of the extract to Hoym, the minister for South
  Prussia, to Schrötter, the minister for New East Prussia, and to the Grand
  Chancellor von Goldbeck. Schrötter answers on 29 January that he has passed
  it to Hoym, since it is not established whether Prusimski is settled in New
  East Prussia or in South Prussia. The papers do not say why Prusimski
  wanted the certificate.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A ministry file: one draft of the department of foreign affairs, one
  extract in French from an envoy's dispatch, one incoming letter. Registry
  marks are not prose: "Gr. in triplo md." (fair copies in triplicate), "d 12.
  sämmtl. zur Post" (all sent to the post on the 12th), "N 5" (the piece's
  number), "Praesent." and "Praesentl:" (received), "vide Journal A. No. 10."
  and "Februar B. No 709." (journal numbers), "Notif." (let it be notified),
  "Ad acta" (file it), "dH." (des Herrn), "et in simili" and "in simili" (and
  the same to). "Hr von Raumer" at the head of the extract routes it to that
  councillor, who signs the directions. "H. G[roß]K[anzlers] v. Goldbeck" is
  the Grand Chancellor. "[Alvensleben?]" is a signature read with doubt. Text
  that the receiving office wrote on a paper stands at the end of that page
  and is not part of the letter; the whole of the first page of document 2 is
  such a direction. "die neue Acquisition von Pohlen" and "die von der
  ehemaligen Republik Pohlen acquirirten Provinzen" are the Prussian share of
  the partitions of Poland. The French keeps the writer's spelling (Polonois,
  étoit, crû, affatigué). A word followed by [?] is one the transcriber was
  unsure of.

  en: |-
    To Your Excellencies and the Most Praiseworthy Department of Foreign Affairs I return my most obedient thanks for the intelligence, kindly communicated to me under the 11th of this month, concerning Anton Prusimski, who is settled in the new acquisition from Poland but is at present staying at Venice; and I do not fail at the same time most obediently to report hereby to Your Excellencies and the Most Praiseworthy Department of Foreign Affairs that I have found myself moved to inform the Minister of State Count von Hoym of it further, since it is not established whether Prusimski is settled in New East Prussia or else in South Prussia?

    Berlin, 29 January 1797.

    Schrötter

    To the Most Praiseworthy Department of Foreign Affairs, here

    [Written by the receiving office:]

    No. 5 of 11 January

    Presented the 8th of February 1797.

    February B. No 709.

    To the files, 16 March 97

    Raumer

# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  The condescensio decree given at the Trąbczyn grounds, 29 March 1784, on the
  ultimate limitation of the Prusimski succession: the court's long recital of
  the 1740 division, the loads on the estates, the claims of the sisters'
  heirs, and the quietation the abbey of Ląd was to reproduce.
title_de: >-
  Das Dekret des Kondescensionsgerichts, gesprochen auf dem Grund der
  Trąbczyner Güter am 29. März 1784, über die ultimative Limitation der
  Prusimskischen Erbschaft: der weite Recital des Gerichts über die Teilung
  von 1740, die Lasten der Güter, die Ansprüche der Erben der Schwestern und
  die Quittung, die die Abtei Ląd vorzulegen hatte.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompt. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry, in Latin, of the relationes protocollon of the castellany court
  of Poznań (APP 53/20/0/-/Poznań Gr.1181, pp. 161-167v), registered under the
  heading "4ta Martii" of the 1786 volume and recording a condescensio held at
  the Trąbczyn grounds on Monday after Judica Sunday, 29 March 1784. It is the
  decree of the court of the castellany offices on the ultimate limitation
  (ultimariae limitatio) of the succession the sterile brothers Antoni and
  Paweł Prusimski left, between Antoni's heir and nephew Antoni in Kolno
  Prusimski, starost of Niszczewice, and the heirs of the sisters: the
  Zakrzewski, Tomicki, Taczanowski, Kołaczkowski and Tworowicz parties, with
  the abbey of Ląd summoned over the quietation of 3,500 ducats and the silver
  lodged in its treasury. The entry recites the suit's whole documentary
  history: the decree of the Piotrków tribunal of 1782, the comportation of
  the documents of December 1783, the fraternal division of
  1740 with the three schedas and their sums, the maternal Golinski goods
  (Oporowo, Prusinowo, Szetlewek) with their contracts and loads from 1616
  onwards, and the loads on the paternal estates. The entry stops
  mid-sentence at the foot of p. 167v; nothing follows it in the volume
  (the editor's ruling, 2026-10-26).

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  One Latin entry of a court register, in formulaic and heavily abbreviated
  language, with the scribe's own spellings kept as written (dicidenda,
  oblatuata, octuigentorum, "Paturna" for Paterna). "Condescensio" is a sitting
  of the court on the disputed ground; "ultimariae limitatio" the final
  limitation of an inheritance; "comportatio documentorum" the bringing of
  documents into court; "quietatio" a discharge or receipt; "complanatio" a
  matching or equalisation contract; "scheda" the lot drawn in a division;
  "vadium" the security lodged for a division; "arenda" a leasehold. "fp" is
  the editor's marking of the manuscript's abbreviation for florins Polish;
  "fl. g~ 20 Polonicalium" means florins reckoned at 20 groschen Polish. A
  word cut short with a tilde stands cut short (sub~bo = sabbato, Pos~ =
  Posnaniae). The office forms in -ida are the scribe's own: Castellanida,
  Dapiferida (Konin Gr.118 has "Dapiferidae", Gr.117 "Thesaurarida"). "MM"
  stands for Magnificorum, "~" for a cut-off ending. "Trąmpczyn" is the
  scribe's form of Trąbczyn, as in the Konin Gr.117 holding.

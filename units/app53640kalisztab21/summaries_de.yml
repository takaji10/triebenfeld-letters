app53640kalisztab21-001: "Dreizehn Seiten des Registers der Rauchfangsteuer (podymne) der Woiwodschaft Kalisch für die Johannisrate 1789, auf einem gedruckten Formular in polnischer Sprache. Der gedruckte Titel nennt es das Register der erhobenen Rauchfangsteuer und der daraus dem Kronheer erteilten Zahlungsanweisungen (delaty). Jede Zeile gibt die Nummer der Quittung, den Namen einer Stadt, eines Dorfes oder eines Dorfanteils und eine Summe in Złoty und Groschen, entweder als erhoben oder als Anweisung. Die Seiten enthalten den Kreis Pyzdry mit den Einträgen 1 bis 29 und 379 bis 448, den Kreis Kalisch mit den Einträgen 1 bis 107 und die Einträge 58 bis 238 eines dritten Kreises, dessen Überschrift auf diesen Seiten fehlt; seine Orte, darunter Tuliszkow, Władysławow und Rychwał, liegen um Konin. Trąbczyn, geschrieben „Trąpczyn“, ist dort Eintrag 178 mit 80 Złoty. Es folgen die Untertanen des Pfarrers am selben Ort mit 20 Złoty, Łazy mit 12 Złoty 15 Groschen, Osiny mit 17 Złoty 15 Groschen, Nowa Wieś mit 12 Złoty 15 Groschen und die Trąbczyner Olęder („Olendry Trąbczynskie“) mit 35 Złoty. Łukom steht als Eintrag 106 mit 97 Złoty 15 Groschen unter den Anweisungen, die Olęder-Siedlung „Olędry Lusnie“ als Eintrag 109 mit 35 Złoty und Szetlewek als Eintrag 172 mit 55 Złoty. Summen der Seiten oder der Kreise stehen auf diesen Seiten nicht."

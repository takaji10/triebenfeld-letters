  ascii_prefix: APP_53_64_0_Kalisz_Tab_21

# One file per page, named by page id (0001_a.txt). Made by intake/holding.py
# from intake/table.csv, the reading of the register.
transcriptions:
  dir: transcriptions          # units/<slug>/transcriptions/
  glob: "*.txt"
  page_id_strip: ""

# The transcription. Documents are delimited by [DOC N] on its own line.
corpus: corpus.txt

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Thirteen pages of a tax register of the Polish Commonwealth, on a printed
  form filled in by hand, in Polish: the register of the hearth tax
  (podymne) collected in the Kalisz voivodeship, and of the orders to pay
  (delaty) issued out of it to the Crown army, for the instalment due at St
  John's 1789. Each line has the number of the receipt, the name of a town,
  a village or a part of a village, and a sum in złoty and groszy under one
  of two headings, "collected" or "delata". The receipts are numbered
  district by district. The pages are leaf 1 (the Pyzdry district, entries 1
  to 29), leaves 7 to 9 (the end of the Pyzdry district, entries 379 to 448,
  and the Kalisz district, entries 1 to 107) and leaves 18 to 20 (entries 58
  to 238 of a third district, whose heading is not on these pages and whose
  places are those of the Konin district). Trąbczyn is entry 178 of the
  third district, with 80 złoty.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  The document is a table and is transcribed as one: each line of the text
  is a line of the register, its cells separated by commas. "Podymne" is
  the hearth tax; "delata" an order to pay a tax straight to a body of
  troops; "Kwity. Nro." the number of the receipt. "Powiat" is a district.
  "Wieś" is a village, "Miasteczko" a small town, "Folwark" a demesne farm,
  "Młyn" a mill, "Pustkowie" an isolated farm, "Olędry", "Olendry" and
  "Holendry" a Hollander settlement, "Woytostwo" the holding of a wójt,
  "Plebania" a parsonage. "Tamże" is "at the same place"; "Poddani
  Pleban:" are the subjects of the parish priest; "z Części ..." is the
  part of a village that belongs to the person named. Names of villages are
  as the clerk wrote them and stay so. "Trąpczyn" is Trąbczyn. A word
  followed by [?] or written [word?] is one read with doubt.

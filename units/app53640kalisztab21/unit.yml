# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  Thirteen pages of the register of the hearth tax collected in the Kalisz
  voivodeship in the summer of 1789: for each town, village and part of a
  village of the Pyzdry, Kalisz and Konin districts, the sum paid, among
  them Trąbczyn, its Olęder settlement, Łazy, Osiny, Nowa Wieś and Łukom.
title_de: >-
  Dreizehn Seiten des Registers der Rauchfangsteuer, die im Sommer 1789 in
  der Woiwodschaft Kalisch erhoben wurde: für jede Stadt, jedes Dorf und
  jeden Dorfanteil der Kreise Pyzdry, Kalisch und Konin die gezahlte Summe,
  darunter Trąbczyn, seine Olęder-Siedlung, Łazy, Osiny, Nowa Wieś und
  Łukom.

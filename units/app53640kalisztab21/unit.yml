# cover), 0001_a, 0007_a, 0007_b ... 0020_b (a recto is _a, a verso _b).

# Raw scans live outside the project. crop_scans.py reads from raw_dir and
# writes single pages into raw_dir/processed/.
scans:
  raw_dir: J:/Documents/Archive/Genealogy/References/Poznań State Archives/Podymne z woj. kaliskiego [protocollon] 1789, 53.64.0.-.Kalisz Tab.21)
  raw_glob: "*.jpg"

  # Web derivatives are copied into site/assets/scans/ under an ASCII-safe

# Fourteen images, each one page: the cover (000.jpg) and thirteen pages
# named by leaf (001.jpg, 007.jpg, 007v.jpg ...). The file named 017v.jpg is
# the verso of leaf 9 (intake/holding.py says why). intake/holding.py --crop

# German summaries of AGAD 1/169/0/1/1745, written in the working session from the table as read (intake/holding.py, 2026-10-13).
# Claim-checked in session (intake/claim_check.yml).
# A finding aid, not part of the edition text.
agad1169011745-001: "Sechs Seiten einer Tabelle der Dörfer aus den Akten der preußischen Verwaltung Südpreußens. Sie enthalten die Einträge 140 bis 303 eines alphabetischen Verzeichnisses, von Kurow bis Wierzbna; die genannten Orte, darunter Ląd mit seinem Kloster, Lądek und Rzgow, liegen um Konin. Unter einem gedruckten Kopf gibt jeder Eintrag die Art des Ortes (Dorf, Hauland, Mühle, Vorwerk, Kloster, Krug), den Namen, die Zahl der Häuser und der Kirchen sowie die Christen und die Juden an, jeweils nach männlichem und weiblichem Geschlecht gezählt und summiert. Jede Seite schließt mit ihrer eigenen Summe, überschrieben „Latus“ und von 6 bis 11 gezählt. Trąbczyn, geschrieben „Trąpczyn“, ist Eintrag 291: 32 Häuser, 1 Kirche und 165 Einwohner, 51 männlich und 114 weiblich. Sein Hauland folgt als Eintrag 292 mit 34 Häusern und 271 Einwohnern. Szetlew hat 11 Häuser und 84 Einwohner, Szetlewek 20 Häuser und 140 Einwohner, darunter 4 Juden, und Łukom 28 Häuser und 149 Einwohner. Die Seiten tragen kein Datum und nennen den Kreis nicht."

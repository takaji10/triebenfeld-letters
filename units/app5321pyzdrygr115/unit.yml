# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One page of a register of the grod court and office of Pyzdry, on the
  editor's own trim of the photographed page 543: the head of a table of the
  parish of Trąbczyn in Polish, the entry of 1791 or 1792. The table has five
  columns: the parish (Parofie, for Parafie), the names of the towns, villages
  and demesne farms, the agricultural hearths (dymy rolne), and two columns of
  dues in sheaves, of rye (gara zyta) and the second left as written (gara
  owcza). Seven rows stand under the parish of Trąbczyn: the village of
  Trąbczyn itself, 21 hearths, 22 and 84 sheaves; the parsonage (Plebania), 4,
  8 and 16; Nowawieś, 5, 10 and 20; Osiny, 6, 12 and 24; Łazy, 5, 10 and 20;
  Kuznia Maryantów, the smithy, 1, 2 and 4; and Hollendry Luzne Stare i nowe z
  Hutą, the scattered Hollander settlements old and new with the Huta, 31, 62
  and 124. In every row but the first the figures double from column to
  column; in the first the middle figure is read 22 where the doubling would
  give 42 - kept as written, the transcription the editor's own and correct
  (the editor, 2026-10-26). The entry stands in the
  first half of the page; the rest of the page belongs to the entry after and
  is not transcribed (the editor's word).

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  The document is a table and is transcribed as one: each line of the text is
  a row, its cells separated by commas. The spelling is the editor's own
  transcription of the clerk's hand and stays as written, marks of the page
  only: Parafie in the heading, Wies Trąbczyn, Nowawieś, Hollendry Luzne
  Stare i nowe z Hutą. "Dymy rolne" is agricultural hearths, the base of the
  hearth tax. "Gara zyta" and "gara owcza", the two figure columns after the
  hearths, stand as written - the transcription is the editor's own and
  correct (the editor, 2026-10-26); the English keeps the words. A row's
  empty parish cell belongs to the parish named above it. The English renders
  the common words and leaves the names as written.

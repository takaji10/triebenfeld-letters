app5321pyzdrygr115-001: "Seite 543 des Relationes [protocollon] von 1791-1792, des Registers des Burggerichts und -amts Pyzdry: der Kopf einer Tabelle der Pfarrei Trąbczyn, auf des Herausgebers eigenem Zuschnitt der fotografierten Seite, in polnischer Sprache. Die Tabelle hat fünf Spalten: die Pfarrei („Parofie“, für Parafie), die Namen der Städte, Dörfer und Vorwerke, die Rauchfangstände (dymy rolne) und zwei Spalten von Abgaben, die ihre Köpfe „gara zyta“ und „gara owcza“ nennen. Sieben Zeilen stehen unter der Pfarrei Trąbczyn: das Dorf Trąbczyn selbst mit 21 Rauchfangständen, 22 und 84; die Pfarrei (Plebania) mit 4, 8 und 16; Nowawieś mit 5, 10 und 20; Osiny mit 6, 12 und 24; Łazy mit 5, 10 und 20; Kuznia Maryantów, die Schmiede, mit 1, 2 und 4; und Hollendry Luzne Stare i nowe z Hutą, die verstreuten Holländersiedlungen alte und neue mit der Huta, mit 31, 62 und 124. In jeder Zeile außer der ersten verdoppeln sich die Zahlen von Spalte zu Spalte; in der ersten steht in der mittleren Spalte 22, wo die Verdoppelung 42 gäbe - als geschrieben behalten. Die Tabelle trägt kein Datum; sie steht auf der Seite 543 eines Registerbandes, dessen Titel die Jahre 1791 bis 1792 nennt."

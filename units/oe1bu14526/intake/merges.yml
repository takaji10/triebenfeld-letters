# One page, one document (docs/DOCUMENT_MERGE_PLAN.md; the editor's yes, 2026-11-23).
# Carried out by pipeline/review/merge_documents.py --unit oe1bu14526 --write,
# which renumbers the holding afterwards. The numbers here are the OLD ones.
#   22 + 23: the covering rescript of 18 Mar 1805 and the engrossed confirmation of
#     the sale of Kolno and Kamionna it transmits, which follows directly (the editor
#     agreed, though the enclosure outweighs the letter).
merges:
- main: '22'
  parts:
  - {doc: '23', as: enclosure}

summaries:
  '22':
    en: >-
      The Government at Poznań sends the reigning Prince of Hohenlohe-Ingelfingen an engrossment of
      the contract of sale of the estates of Kolno and Kamionna to the bank cashier Leixner, which it
      has confirmed the same day. The enclosed engrossment follows: a confirmation of the contract of
      January 1805 by which Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, sells the
      estates of Kolno and Kamionna for 142,000 Rthl to the bank cashier George Conrad Leixner of
      Frankfurt an der Oder, issued under the seal of the Government at Poznań. On 6 February 1805
      the agents, the justice councillor Melzer for the Prince and the criminal councillor Guderian
      for Leixner, acknowledged the contract before the government assessor Bewert. The contract and
      the powers of attorney are set out in full; Leixner extended his power of attorney because a
      new contract had replaced the one of 15 June 1804.
    de: >-
      Die Regierung zu Poznań sendet dem regierenden Fürsten zu Hohenlohe-Ingelfingen eine
      Ausfertigung des Kaufvertrags über die Güter Kolno und Kamionna mit dem Bankrendanten Leixner,
      den sie am selben Tag bestätigt hat. Es folgt die beigelegte Ausfertigung: Bestätigung des
      Kaufvertrags vom Januar 1805, mit dem Friedrich Ludwig, regierender Fürst zu
      Hohenlohe-Ingelfingen, die Güter Kolno und Kamionna für 142000 Rthl an den Bankrendanten George
      Conrad Leixner in Frankfurt an der Oder verkauft, ausgestellt unter dem Siegel der Regierung zu
      Poznań. Am 6. Februar 1805 bekannten sich die Bevollmächtigten, der Justizrat Melzer für den
      Fürsten und der Kriminalrat Guderian für Leixner, vor dem Regierungsassessor Bewert zu dem
      Vertrag. Eingerückt sind der Vertrag und die Vollmachten; Leixner erweiterte seine Vollmacht,
      weil ein neuer Vertrag den vom 15. Juni 1804 ersetzt hatte.

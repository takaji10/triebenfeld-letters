- {claim: "Götzinger kann es mit der übernommenen Brauerei-Erbpacht als Schank brauchen", verdict: supported, where: "weil derselbe dieses Haus bey der übernommenen Brauerey Erbpacht zum Schank besondergut brauchen kann"}

oe1bu14526-021:

oe1bu14526-002:
- {claim: "Punktation über den Verkauf des adligen Guts Witów im Kreis Warta", verdict: supported, where: "Behufs eines in der Folge wegen des Adelichen Guths Witow abzuschließenden förmlichen gerichtlichen Kauf und Verkauf-Contracts nachstehende Punctation; dessen Wartaschen Creise belegene adeliche Guth"}

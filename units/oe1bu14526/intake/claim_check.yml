- {claim: "beigefügt ist ein Reskript der Kammer zu Poznań von 1806: der König hat Veräußerung und Parzellierung genehmigt", verdict: supported, where: "(Abscrift) Friedrich Wilhelm König von Preußen ... Kabinets- Resolution vom 29ten v. M. der gedachten Alienation und Dismembration in der eingeleiteten Art unserer Genehmigung zu ertheilen geruhet ... Posen den 10ten May 1806. Königliche Südpreußische Krieges- und Domainen-Kammer"}


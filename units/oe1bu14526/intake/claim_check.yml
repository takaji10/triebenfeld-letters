oe1bu14526-023:
- {claim: "Bestätigung des Kaufvertrags vom Januar 1805, ausgestellt unter dem Siegel der Regierung zu Poznań", verdict: supported, where: "zu dem am 16t und 25ten Januar ejusd. an geschlossenen Kauf Contracte ... so corroboriren und confirmiren Wir ... Urkundlich unter Unserer hiesigen Südpreuß. Regierung gewöhnlichen Unterschrift und größern Insiegel Gegeben Posen den 18ten Mærz 1805"}
- {claim: "mit dem Friedrich Ludwig, regierender Fürst zu Hohenlohe-Ingelfingen, die Güter Kolno und Kamionna für 142000 Rthl an den Bankrendanten George Conrad Leixner in Frankfurt an der Oder verkauft", verdict: supported, where: "der regierende Herr Fürst Friedrich Ludwig zu Hohenlohe Ingelfingen Liebden und der Banco Rendant George Conrad Leixner ... Güter Kolno und Kaemen ... für ein Kauff u. Pretium von 142,000 rtll."}
- {claim: "am 6. Februar 1805 bekannten sich die Bevollmächtigten, der Justizrat Melzer für den Fürsten und der Kriminalrat Guderian für Leixner, vor dem Regierungsassessor Bewert zu dem Vertrag", verdict: supported, where: "vor dem ... Commissario, Unsern Regierungs - Assessor Bewert ... beide durch ihre hierzu ad Acta legitimirte Mandatarien, Unsern Justizrath Melzer und Ew. Rath Guderian, am 6ten Februar 1805. erschienen, zu dem ... Kauf Contracte ... sich ausdrüklich bekannt; der Criminal-Rath Guderian"}
- {claim: "eingerückt sind der Vertrag und die Vollmachten", verdict: supported, where: "Es lautet aber derselbe in seinem wahren Inhalte, wie nachfolget; Special-Vollmacht Ich Endes unterschriebener ... George Conrad Leixner; the Prince's power of attorney of 5 September 1804 also stands in the text"}
- {claim: "Leixner erweiterte seine Vollmacht, weil ein neuer Vertrag den vom 15. Juni 1804 ersetzt hatte", verdict: supported, where: "Wenn nun aber späterhin ... ein neuer Kauf Contract sub dato Breslau den 16 Januar 1805. ... abgeschlossen worden ... so will ich diese auf den Herrn Guderian bereits ausgestellte Vollmacht hierdurch und Kraft dieses dahin extendiren; den ... geschlossenen Kauf-Contract ... d. d. Franckfurth a/O den 15ten Juni 1804"}

oe1bu14526-024:
- {claim: "die Kriegs- und Domänenkammer zu Poznań lehnt, auf eine königliche Kabinettsresolution hin, das Gesuch des Fürsten zu Hohenlohe-Ingelfingen ab, die Herrschaft Pszczew an die Bürgerschaft und die übrigen Einsassen in Erbpacht zu geben", verdict: supported, where: "auf das ... Gesuch um die Erlaubniß zur Verabpachtung der Herrschaft Betsche an die dortige Bürgerschaft und die übrigen ländlichen Einsaßen ... auf den Grund des in Gemäßheit einer Allerhöchsten Cabinets-Resolution ... ergangenen Rescripts ... daß die in Rede stehende Vererbpachtung ganz unzuläßig befunden worden ist ... Posen den 18ten May 1805 Königl. SüdPreuß. Krieges und Domainen Cammer"}
- {claim: "und gibt den Vertrag zurück", verdict: supported, where: "mit Rückgabe des eingereichten Erbpachts Contracts"}
- {claim: "andere Grundherren würden folgen, und die Güter des zahlreichen Adels der Provinz, auf dessen Erhaltung zu sehen sei, würden vermindert", verdict: supported, where: "1tens würden ... mehrere Grundherrschaften ähnliche Anträge wagen, und dadurch die Besitzungen des in hiesiger Provinz so zahlreichen Adels auf deßen Conservation Bedacht genommen werden muß, vermindert"}
- {claim: "der Pszczewer Forst, der einzige beträchtliche der Gegend, könnte nicht ordentlich bewirtschaftet werden", verdict: supported, where: "2tens die zweckmäßige Bewirthschaftung der Betscher Forst, welche, da diese Forst die einzige beträchtliche in der dortigen Gegend ist ... nicht statt finden könnte"}
- {claim: "die Einsassen hätten genug Land, die Bürger sollten eher städtische Gewerbe treiben, und die meisten seien zu arm", verdict: supported, where: "da jeder Einsaße und auch jeder Bürger der Stadt Betsche so viel an Land besitzt als er zu einer ordentlichen Bewirthschaft nöthig hat ... daß sie sich mehr auf den Betriestädtischer Gewerbe als den des Ackerbaues lege die mehrsten Einsaßen über dieß zu unbemittelsind"}

oe1bu14526-025:
- {claim: "Vertrag, vorbehaltlich der Genehmigung des Fürsten zu Hohenlohe-Ingelfingen", verdict: supported, where: "unter Vorbehalt hoch ster Fürstlicher Ratification nachfolgender Kauff Contract"}
- {claim: "dessen Bevollmächtigter, der Bau- und Ökonomierat Johann Wilhelm Glenck, verkauft dem Mahlmüller Samuel Lucke von der Mühle Białobrzeg bei Wrąbczynek 1000 Morgen Vorwerksland des Guts Szetlewek mit den Vorwerksgebäuden", verdict: supported, where: "dem Bau, und Oeconomie Rath Johann Wilhelm Glenck einer - und dem Mahl Müller Samuel Lucke Besitzer der Mahl Mühle Białobrzeg bey Wrąbczynek; das Hochfürstliche Gut Szetlewek bey Trąbczyn mit dessen hierzugehörigen Feldern von Eintausend Morgen ... nebst § 2, sämmtlichen Vorwerksgebäuden"}
- {claim: "für 12333 Rthl, davon 8333 Rthl an den Pfandbesitzer von Radzinski bei der Räumung", verdict: supported, where: "eine baare Summe von 12333 rthlr zu bezahlen verspricht die mit 8333 rthlr bey der Räumung des Pandschillingsbesitzers von Radzinski demselben, und 4000 rthlr ... gezahlt werden sollen"}
- {claim: "und einen jährlichen Kanon von 500 Rthl", verdict: supported, where: "annoch ein fortbestehender Canon von 1/2 rt pro Morgen jährl. und folglich 500 rt."}
- {claim: "Schankrecht, Brauhaus und Brennerei erhält Lucke gegen einen jährlichen Zins von 400", verdict: supported, where: "Rubrique II, die zu diesem Vorwerk und dorff gehörige Propination, das vor handene Brauhauff und Brennerey erhalten, Käufere gleichfalls ... gegen einen jährlichen Zinß von 400"}
- {claim: "die Dienste der Untertanen sind ausgenommen, die Herrschaft hat sich bereit erklärt, sie auf ihren Wunsch davon freizulassen", verdict: supported, where: "Ausgenommen sind die Dienste der Dorffs Unterthanen ... sondern deren Freylaßung von dienst dem Dominio vorbehalten bleibt, als welches bereits dem Wunsch der Dienstbaren zu begegnen, sich bereit erklärt hat"}
- {claim: "Lucke handelt für mehrere Kaufinteressenten und erbittet zwei bis vier Wochen", verdict: supported, where: "Da der Käufer das Gut nicht für sich allein zu bestreiten im Stande ist, sondern in Verbindung mehrerer Kauflustigen stehet ... so bedingt sich derselbe 14 Tage biß 4 Wochen Zeit"}

oe1bu14526-026:
- {claim: "Protokoll vor dem Polizeimagistrat zu Zagórów", verdict: supported, where: "Actum Zagorowo den 1ten July 1799. Es erschienen Dato für hiesigem Polizei Magistrat"}
- {claim: "der Polizeibürgermeister Nüchler aus Pyzdry, der Müller Luka aus Białobrzeg und ein dritter Mann aus Wrąbczynek", verdict: supported, where: "1. Der Polizei Bürgermeister H. Nüchler aus Peisern 2. der Müller Luka aus Białobrzeg und 3. Der Schütze Reise aus Wrąbczynek"}
- {claim: "hatten am 20. November 1798 mit Glenck, dem Generalbevollmächtigten des Fürsten zu Hohenlohe, vereinbart, das Gut Szetlewek aufzuteilen, Ansiedler zu stellen und den Kaufpreis zu Johanni zu zahlen", verdict: supported, where: "Unterm 20t. Novbr 1798 hatten Sie mit dem Hochfürstliche Hohenloheschen Bau und Oeconom Rath qua General Bevollmächtigten Herrn Glencke. Wegen Vertheilung des Guths Szetlewek ... einen Contract gemacht, worin Sie sich anheischig gemacht ... hinlängliche Subjecte zur besezzung derselben zu verschaffen, und daß ebenfalls bestimmt kauff Geld auf Johanni d. J. zu erlegen"}
- {claim: "weil der Pfandbesitzer von Szetlewek die Räumung erschwert", verdict: supported, where: "wenn nicht der jezzige Besitzer v. Brzezinski welcher das Guth Szetlewek in Pfand Schilling besizt; einige Schwürig: keiten wegen der Räumung gemacht hatte"}
- {claim: "sagen sie sich vom Vertrag los, wenn ihnen 200 Rthl Reisekosten ersetzt werden und die angeworbenen Leute, die schon Handgeld gezahlt haben, sich an die Herrschaft halten", verdict: supported, where: "so wollen Sie sich den Erfüllung des qu.- Contracts Contracts entsagen ... unter der Bedingung ... wenn Ihnen die bey dieser Geschichte gehabte Reise Kosten etc. mit 200 rt ... vergültigt werden möchten; und daß die anhero gezogene Leuthe welche bereits Hand Geld erlegt keine Ansprüche an Sie haben sondern sich lediglich an dem Hochfürstl. Dominio halten möchte"}
- {claim: "Glenck will zahlen, wenn der Fürst es genehmigt", verdict: supported, where: "so erböthe Er sich doch diese an Deponenten unter der Condition zu bezahlen, wenn nemlich die Approbation von Sr. Hochfürstl. Durchlaucht hiezu erhalten werden könne"}

oe1bu14526-027:
- {claim: "Titz und Bancke berichten aus Zagórów einem Bau- und Ökonomierat", verdict: supported, where: "Insonders höchst zuverehrender Herr Bau und Oeconom Rath ... Zagorowo d. 16. Aprill 1799. gantz gehorsamste Diener Titz Bancke"}
- {claim: "der Müller Luka hat sich von seinem Vertrag losgesagt, die 25 Rthl erhalten und will das Weitere mit dem Rat in Kalisz abmachen", verdict: supported, where: "Der Müller Luka hat sich der Entsagung des Contract haltens bey mir geoffenbahret, und will also zu diesem Ende bey Ew. Wohlgebohren in Kalisch daß nähere abmachen, Er hat auch die qu. 25. Rthl richtig in Empfang genommen"}
- {claim: "zwei Leute, die er zur Übernahme von Land mitbrachte, wurden vertröstet, bis man mit Trąbczyn und Herrn von Szucki fertig sei", verdict: supported, where: "brachte Er auch noch 2 Leuthe zur Annahme einiges Landes mit zur Stelle diese würden nun noch bis weiter hin vertröstet ... daß sobald, man nur mit Trąbczyn und dem H. v. Szucki ein Ende gemacht haben würde"}
- {claim: "sie bitten, Szuckis Abzug der Regierung zu melden", verdict: supported, where: "Wegen den Abstand des p. v. Szucki haben doch Ew Wohlgebohren die Gütte und dieses bey der Königl. Regierung zu melden"}
- {claim: "und fragen, ob der Fürst zu den 1000 Rthl, die die Gemeinde für diesen Abzug geben will, etwas beitragen könne", verdict: supported, where: "und wenn auch noch zu den 1000. Rthl welche die Gemeinde geben will etwas Sr. Durchlaucht dazu hergeben möchte; durch das Angebot der 1000. Rthl Abstand"}
- {claim: "da Szuckis Schikane gegen die Untertanen wachse", verdict: supported, where: "wie nunmehro die Pikanterie des v. Szucki auf die Unterthanen durch das Angebot der 1000. Rthl Abstand immer mehr zu nimt"}
- {claim: "ein Tischler, der in Szetlewek wohnen wollte, hat aus Verzweiflung ein Haus in Zagórów gekauft", verdict: supported, where: "P. S. der Tischler welcher ebenfals in Szetlewek wohnen wolte hat aus Desperation ... so gleich ein Haus in Zagorowo gekauft"}

oe1bu14526-028:
- {claim: "Glenck schreibt dem Kriminalrat Grimm in Kalisz", verdict: supported, where: "An den Herrn Criminal Rath Grimm zu Kalisch ... Glenck Zagorowo den 27ten May 1799"}
- {claim: "sein Vertrag mit von Radzinski ist nach dem beigelegten Briefwechsel aufgehoben", verdict: supported, where: "eine Abschrift von meinen Brief an Ehe von Radzinski wegen des Contracts nebst dessen Antwort und meine Beantwortung hierauf zu übersenden; Nach diesen ist also der Contract zwischen uns beyden aufgehoben"}
- {claim: "die drei Vertragspartner Luck, Kriede und Nüchler wollten nicht zurücktreten, da sie schon 18 Wirte vorgeführt haben, die gegen Pfand fast zwei Drittel der Felder nehmen", verdict: supported, where: "die 3 Contrahenten Luck, Kriede, und Nüchler zum Abstand zu bewegen, dieses ging aber nicht, weil Sie ... schon 18 Wirthe, die sich gegen Pfand erlegung einschreiben ließen, und beynahe 2/3 t. der Felder nehmen, vorgeführt haben"}
- {claim: "Griese bietet eine Kaution von 2000 Rthl", verdict: supported, where: "hat sich der mit Contrahent Griese zu einer Caution von 2/M. rt. anheischig gemacht"}
- {claim: "den Schaden aus dem Abbruch will Glenck Radzinski anrechnen lassen", verdict: supported, where: "Durch die Unterbrechung dieses Contracts mit dem des von Radzinski iſt viel nachtheil erfolgt ... wobey ich bitte daß Sie solche den v. Radzinski zurechnen möchten"}
- {claim: "im Vertrag der Trąbczyner Hauländer stehe nach Versicherung von Kramplitz, des Kommissars von Prusimskis, der Vorbehalt, dass ihr Privileg nur für die ersten Besitzer, ihre Söhne und Enkel gelte und sie schon jetzt ein neues nachsuchen müssten", verdict: supported, where: "In den Contract der Trąbczyner Hauländern, soll wie nur den Commissair des von Prusimski H. von Kramplitz versichert, der vorbehalt eingeruckt stehen, daß die Privilegium nur auf die ersten Besitzer, ihre Sohn und Enckeln gehe, und daß Sie iezo schon ein neues Privilegium nachsuchen mußten"}

oe1bu14526-029:
- {claim: "das fürstliche Gerichtsamt zu Pszczew meldet dem Fürsten zu Hohenlohe-Ingelfingen", verdict: supported, where: "Durchlauchtigster Fürst ... Das Gerichts Amt hieselbst Metzig Neumann Betsche d 10ten Aprill 1805"}
- {claim: "dass Sigismund von Rzadkowski sein Erbzinsgut in Głażewo an seine Halbschwester Susanna geborene Treben verkauft hat", verdict: supported, where: "daß der Sigismund von Rzadkowski das in Głażewo belegene Erbzinsguth an seine Halbschwester die Susanna geborne Treben verkauft hat"}
- {claim: "der Vertrag ist unter Vorbehalt der fürstlichen Rechte genehmigt", verdict: supported, where: "(Der Contract ist unter Vorbehalt der Fürstln. Rechte approbirt worden.)"}
- {claim: "da dem Fürsten das Vorkaufsrecht zusteht, soll er sich binnen einer Frist erklären, ob er es ausüben will; sonst gilt es nach dem Gesetz für diesen Fall als aufgegeben", verdict: supported, where: "Da nun Ew. Hochfürstl. Durchlauchten das Vorkaufsrecht zustehet, so bitten wir ... sich darüber, ob Höchstdieselben von dem Vorkaufsrechte Gebrauch machen wollen, binnen S. Wochen gnädigst zu erklären. weil nach Ablauf dieser Frist den Gesetzen gemäß angenommen wird, daß Höchstdieselben sich dieses Rechts für diesen Fall begeben"}

oe1bu14526-030:
- {claim: "beglaubigte deutsche Übersetzung, mit dem polnischen Text, eines Auszugs aus dem Privilegienbuch des Domkapitels zu Poznań", verdict: supported, where: "Capitulum Ecclesiae Cathedralis Posnaniensis ... aus dem in unserm Archivo aufbewahrten Buche der Privilegiorum gefunden heraus zu nehmen; daß vorstehende Uebersetzung mit dem Polnischen Original Extract von Wort zu Wort gleichlautend ist, solches bescheinige pflichtmäßig als vereideter Uebersetzer; the Polish text follows the German"}
- {claim: "Bischof Teodor Czartoryski überlässt 1766 den Eheleuten Simeon und Apollonia Rządkowski eine Hufe wüsten Ackers in Głażewo im Pszczewer Schlüssel mit dem auf Kosten des Hofes erbauten Wohnhaus und der Scheune", verdict: supported, where: "Theodor ... Fürst von Czartorinski ... Bischof von Posen und Warschau ... daß die edlen Simeon und Apollonia Rząkowski den Eheleute ... eine Hufe wüsten Ackers in dem zu Unserm Betscher Schlüssel gehörenden Dorfe Głazewo gelegen zugleich mit dem auf Kosten des Hofes erbaueten Wohnhause und Scheune ... Gegeben zu Dolsk d. 26ten Septbr Ano Domini 1766. Theodor Fürst v. Czartoryski"}
- {claim: "für 30 Dukaten", verdict: supported, where: "für dreissig Ducaten in specie sage 30 Ducaten überlassen und verkaufen"}
- {claim: "sie zahlen jährlich 130 polnische Gulden in zwei Raten, dazu Kopfgeld und Winterquartiergeld", verdict: supported, where: "sich verpflichten 130 fl. po. in zwoen Raten zu zahlen ... des Kopfgeld und die Hibernen (Geld für die Soldaten im Winter) nach der Gewohnheit pünctlich an die Gemeine abzugeben"}
- {claim: "schicken viermal im Jahr Leute zur Arbeit auf das Vorwerk Głażewo und zur Wiese Obsko", verdict: supported, where: "zur Bitte auf des Głazewer Vorwerk viermahl im Jahre, des gleichen zur Abräumung der Wiese Obsko genannt ... zugleich mit der Gemeine zu schicken; Na Tłuki do Folwarku Głazewskiego cztery razy do Roku"}
- {claim: "und dürfen für je zwei Viertel Gerste eine Tonne Bier aus dem Pszczewer Brauhaus nehmen", verdict: supported, where: "Für jede zwei Viertel Gerste alt Neustceter Maaß soll eine Tonne Bier aus dem Betscher Brauhause erlaubt sein"}
- {claim: "der Bischof sichert ihnen den ruhigen Besitz zu", verdict: supported, where: "Wir versprechen ... das Wir vorgedachte edle von Rządkowskische Eheleute von der Benutzung und dem ruhigen Besitze ... dieser Hufe Acker nicht entfernen werden"}

- {claim: "für 1500 Rthl Einkaufsgeld in zwei Raten bis Johanni 1806 und jährlich 75 Rthl", verdict: supported, where: "mithin für fünf hufen Magdeburg 1500 rt. ... mit der einen hälfte a 750 rt ... im Johanni dieses Jahre und mit der andern halfte a 750 rt ... mit Johanni des künftigen Jahres 1806; mithin für fünf hufen 75 rt"}

oe1bu14526-015:

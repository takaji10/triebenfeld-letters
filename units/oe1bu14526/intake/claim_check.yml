- {claim: "für Leixner unterschreibt der Bankier Meyer Bernhard; Leixner genehmigt den Vertrag in Frankfurt", verdict: supported, where: "Meyer Bernhard im nehmen und bis auf genehmigung des H. Bco. Director Leixner; Vorstehenden Kauf Contract habe ich selbst gelesen, und meiner Intention gemäs abgefast gefunden, Frankfurth an der Oder den 25 Januarii 1805. George Conrad Leixner"}

oe1bu14526-005:

oe1bu14526-012:
- {claim: "Erbzinsvertrag vor dem Patrimonialgericht zu Trąbczyn", verdict: supported, where: "Actum Trąbczyn den 10 May 1805 Vor unterschriebenem Patrimonial Gerichte erschienen; Erbzinß Contract"}
- {claim: "der Kriegs- und Forstrat von Triebenfeld gibt für den Fürsten dem Förster George Friedrich Kammer aus Pietrzykowo vom Vorwerk Przybysław 6 Hufen Acker und 20 Morgen Wiesen mit allen Wirtschaftsgebäuden des Vorwerks in ewigen Erbzins", verdict: supported, where: "der Förster H. George Friedrich Kammer aus Pietrzykowo; von dem zu denen Trąbczyner Gütern gehörigen vorwerke Przybysław 6 Hufen reines Ackerland und an Wiesen ... 20 Morgen ... in Erbzins, benebst denen auf Przybisław befindlichen sämtlichen Wirthschaftsgebäuden"}
- {claim: "Kammer zahlt 2100 Rthl Einkaufsgeld, davon 100 Rthl für die Gebäude, und jährlich 100 Rthl Erbzins", verdict: supported, where: "zu sammen 2000 rt ... und für die Gebäude. 100 rt ... überhaupt also 2100 rthl.; mithin für 6 Hufen 20 Morgen 100 rthl."}

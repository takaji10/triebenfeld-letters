- {claim: "270 Hufen Felder, Wiesen und Wälder der Güter Trąbczyn, Łazy, Osiny, Nowawies und Przybysław", verdict: supported, where: "von den zu Ihren Güthern Trąbczyn, Łazy, Osiny, Neudorff und Przybisław gehörigen Gründen, bestehend in Feldern Wiesen und Wäldern pp den Flächen Inhalt von 270 Hufen"}
- {claim: "gegen 300 Rthl Einkaufsgeld und 15 Rthl jährlichen Zins je Hufe", verdict: supported, where: "An Einkaufs Geld zahlen die unten genannten Erbpächter für jede Hufe Magdeburgisch an Seiner Durchlaucht 300 Rthl; von jeder Magdeburgischen Hufe jährlich einen reinen Geld Zins von 15 Rthl."}
- {claim: "sie dürfen weiterverkaufen", verdict: supported, where: "Denen Erbpächtern oder Anehmern steht frey diese erstandenen Hufen in mehrere einzelne Theile an Andere zu überlaßen"}
- {claim: "müssen den Wald in vier Freijahren roden", verdict: supported, where: "von den Wald aber und von den sonstigen Gründen aber werden Vier frey Jahre verstattet, als nach welcher Zeit den jeder Annehmer die vom ihm erkauften wald Gründe geradet und bebaut haben muß"}
- {claim: "sind frei von Erbuntertänigkeit und Hofdiensten und haften gemeinsam", verdict: supported, where: "bleiben für immer von aller Erbunterthänigkeit völlig frey und dürfen auch der Grundherrschaft nicht den geringsten Hofe-Dienst leisten; haften die Erbpächter ... einer für alle und alle für einen mithin Solidarisch"}
- {claim: "jedes neue Dorf mit Schulzen und Schulmeister erhält 13 Morgen zinsfrei", verdict: supported, where: "Mithin für jedes neue Dorf welches einen Schulzen und Schulmeister halten wird dreyzehn Morgen Magdeburgisch ohnentgeltlich und Zinsfrey zugetheilt"}

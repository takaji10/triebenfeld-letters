- {claim: "und können sich für die Schule der Holländergemeinde zu Trąbczyn anschließen", verdict: supported, where: "In Absicht der Schule für Ihr Jugend bleibt Ihnen überlaßen, sich der Holländern Gemeine zu Trąbczyn incorporiren zu laßen"}

oe1bu14526-018:

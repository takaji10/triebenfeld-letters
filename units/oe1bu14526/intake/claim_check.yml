- {claim: "der Fürst behält Gerichtsbarkeit, Laudemium, Jagd und das Schloss", verdict: supported, where: "ausgenohmen die Jurisdiction und Laude mien, die Jagd, als welche sich Sr Hochfürstl. Durchlauchten ... vorbehalten; das Schloß zum Sitz des Gerichts"}

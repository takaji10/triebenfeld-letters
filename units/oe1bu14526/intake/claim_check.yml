- {claim: "Tschachmann darf das Land in Teilen an andere weitergeben", verdict: supported, where: "Dem Herrn Tschachmann steht frey diese erstadenen Hufen in mehrere einzelne Theile an andere zu überlaßen"}
- {claim: "die Erbpächter sind frei von Erbuntertänigkeit und Hofdiensten, haben kein Weide- und Holzrecht", verdict: supported, where: "bleiben für immer von aller Erbunterthänigkeit völlig frey, und dürfen auch der Grundherrschaft nicht den geringsten Hofe Dienst leisten; so dürfen Erbpächter auf keine Weide und Holzungs Gerechtigkeit Anspruch machen"}
- {claim: "und müssen die neuen Dörfer in einer oder zwei geraden Linien anlegen", verdict: supported, where: "Erbpächter sind verbunden die neuen Dörfen vorschriftsmäßig in zwey oder einen gleichen Linie anzulegen und aufzubauen"}

oe1bu14526-014:
- {claim: "Erbzinsvertrag vor dem Patrimonialgericht zu Trąbczyn", verdict: supported, where: "Actum Trąbczyn den 4. May 1805. Von dem hiesigen Patrimonial Gerichte erschienen; Erbzinß Contract zum Protocoll"}

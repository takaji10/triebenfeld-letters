oe1bu14526-013:
- {claim: "der Kriegs- und Forstrat Peter Friedrich August von Triebenfeld überlässt als Generalbevollmächtigter des Fürsten zu Hohenlohe-Ingelfingen dem Amtmann Johann Gottlieb Tschachmann 20 Hufen Felder und Wiesen von Trąbczyn auf der Seite gegen Kopojno für immer", verdict: supported, where: "Zwischen dem Krieges und Forst. Rath von Triebenfeld General Bevollmächtigter ... und dem Amtmann Herrn Johann Gottlieb Tschachmann; von den zu Trąbczyn gehörigen Gründen bestehend in Feldern und Wiesen, den Flächen Inhalt von 20. Hufen ... auf ewige Zeiten und zwar auf der Kopoyner Seite"}

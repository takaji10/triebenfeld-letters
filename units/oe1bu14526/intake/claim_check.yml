- {claim: "gegen 180000 Rthl und jährlich 1000 Rthl Grundzins", verdict: supported, where: "Kauf und Erbstands Quantum von Einmahlhundert und Achtzigtausend Reichsthaler ... und einen jährlichen Grundzins von Eintausend Reichsthaler"}

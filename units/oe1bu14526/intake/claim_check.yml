- {claim: "Meierowitz zahlt 20000 Rthl und einen ewigen Kanon von jährlich 500 Rthl", verdict: supported, where: "ein baares KaufGeld von Zwantzig Tausend Reichs-Thaler; Jährlich und zwar zu ewigen Zeiten einen Canon von Fünfhundert Rttl"}
- {claim: "den er mit 10000 Rthl ablösen kann", verdict: supported, where: "statt des in §. 4. bestimmten Canons von Fünfhundert rttlr. Zehn Tausend Rttlr Capital zubezahlen ... so wird dies von Seiten Seiten des Herrn Verkäufers nachgegeben"}
- {claim: "da er die Fähigkeit, adlige Güter zu besitzen, noch nicht nachweisen kann, will Triebenfeld ihm zur königlichen Erlaubnis verhelfen; die Kosten trägt Meierowitz", verdict: supported, where: "Da der Herr Käufer die Besitzfähigkeit Adlicher Güther dermalen nicht nachweisen kann, so verpflichtet sich Herr Verkäufer zur Erlangung der Concession ... beizutragen und sich deshalb selbst bei des Königs Majestät zuverwenden. Sämtliche Kosten aber zur Anschaffung der Concession trägt Käufer allein"}

oe1bu14526-022:

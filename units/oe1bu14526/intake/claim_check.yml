- {claim: "für 142000 Rthl an den Bankdirektor George Conrad Leixner in Frankfurt an der Oder", verdict: supported, where: "dem Königl. Banco-Director zu Frankfurth an der Oder Herrn George Conrad Leixner; für ein Kauf Pretium von 142,000 rthl."}

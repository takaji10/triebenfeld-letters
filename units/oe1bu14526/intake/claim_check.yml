- {claim: "der Preis beträgt 180000 Rthl und jährlich 1000 Rthl Grundzins", verdict: supported, where: "Kauf und Erbstands - Quantum von Einmalhundert und Achtzigtausend Reichsthaler ... und einen jährlichen Grundzins von Eintausend Reichsthaler"}
- {claim: "die Gemeinden übernehmen Hypothekenschulden von 137000 Rthl und laufende Prozesse", verdict: supported, where: "Es übernehmen die Stadt- und übrigen Dorf Gemeinden ... intabulirte Hypothequen-Schulden ... 137,000 Rthl; Die Prozeße zwischen der Gemeinde zu Stocki und dem Herrn Fürsten ... übernehmen die Gemeinden auf ihre Gefahr und Kosten"}

# One archival unit. Everything the pipeline needs to know about where this
# material came from and how its files are named.

slug: oe1bu14526
ref: Oe 1 Bü 14526
archive: Hohenloher Zentralarchiv Neuenstein (HZAN)
title: >-
  Originals and vidimated copies of the deeds of sale and hereditary lease over
  the South Prussian estates donated to Friedrich Ludwig, Prince of
  Hohenlohe-Ingelfingen
# The datelines run 1798-10-01 to 1806-07-18. The volume reaches further at both
# ends without saying so in a dateline: the Posen chapter privilege reproduces a
# 1766 grant, and two hereditary-lease contracts carry engrossments issued by
# the Zagorowo patrimonial court on 28 January 1808, after the estates had been
# seized. Neither is a date this field can hold, and the era's span is computed
# from the datelines anyway - so this records what the documents are dated, and
# the reach is described below.
date_span: 1798-1806
status: translated         # draft | transcribed | translated | published

# Which era this holding belongs to - reference/eras.yml. An editorial
# assignment, not a date range: most of these documents postdate the
# ownership they are evidence for. A document that belongs elsewhere
# overrides it in rulings.yml under documents: era:.
era: hohenlohe

# Which archive holds it - reference/repositories.yml. `archive:` above is
# the citation string; this is the slug that groups holdings.
repository: hzan-neuenstein

# Raw scans live outside the project. crop_scans.py reads from raw_dir and
# writes single pages into raw_dir/processed/.
scans:
  raw_dir: C:/Users/Tersnaus/Downloads/Oe 1_Bue 14526
  raw_glob: Oe 1_Bü 14526_*.jpg

  # Web derivatives are copied into site/assets/scans/ under an ASCII-safe
  # prefix, because source names carry spaces and umlauts. Later stages parse
  # this prefix, so it must not change once the unit is published.
  ascii_prefix: Oe_1_Bu_14526

# Transcriptions that arrived already matched to the scans, one file per page.
# import_pages.py reads them in filename order and writes corpus.txt, so the
# pairing is declared rather than reconstructed later.
transcriptions:
  dir: C:/Users/Tersnaus/Downloads/Oe 1_Bue 14526/processed/transcriptions
  glob: "*.txt"

  # How to get the page's archival identity out of a transcription filename.
  # These are named <seq>_<archival stem>_<capture>_<crop>.txt, and the capture
  # and crop are the identity, so everything up to and including the stem goes:
  #   0016_Oe 1_Bue 14526_0011_a1.txt  ->  0011_a1
  page_id_strip: "Oe 1_Bue 14526_"

# The transcription. Documents are delimited by [DOC N] on its own line.
corpus: corpus.txt

# For the reader: shown on this unit's provenance page.
description: >-
  Not correspondence but title deeds. Thirty contract packages recording how the
  Prince sold off and let out the South Prussian estates given to him by
  Friedrich Wilhelm II in 1796 - purchase contracts, hereditary-lease contracts,
  powers of attorney, royal confirmations and the notarial attestations that
  bind them together. Trąbczyn, Betsche, Kolno and Kaemen, Zagorowo and Witow.
  The volume's own title page calls it Originalia et Copiae vidimatae, and much
  of it is exactly that: several instruments survive here in two copies, which
  is what lets one settle the other's damaged readings.

# The convention-setting sample for translate.py --pilot. Chosen for what can
# go wrong here rather than for what is typical:
#   30  the Posen chapter privilege package - German, then the Latin and
#       Polish original, then the notary's Latin certificate of extraction.
#       Three languages in one document, and the only document that should
#       receive the glossary's latin_terms section
#   23  the longest document in the holding, 26 pages, which silently truncated
#       at the old flat token ceiling
#    7  the densest Polish, opening its court protocol in it
#    9  Polish in the body, and Latin tags, in one document
translation_pilot: ["30", "23", "7", "9"]

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  These are title deeds, not letters: formulaic chancery German, with Latin
  tags (Actum, in Pausch und Bogen, rem litigiosam, praevia de super partium
  stipulatione) that are part of the legal register and should be kept, not
  rendered.

  Some German documents carry a few lines of POLISH, and they matter. Document
  7 opens its court protocol in Polish (Nizey podpisany Sąd czymi wiadomo komu
  wiedzieć należy, iż między). Document 9 records the parties demanding the
  protocol be translated into Polish, in Polish (aby był w polskim Języku
  Protocoll Przetlamaczony), and carries a Polish witness line. Documents 18
  and 19 close with Polish signature formulae (Jan Chmara iako pełnomocny;
  Matheus Młynkiewicz pełno mocny plenipotent - pełnomocny is "authorised
  representative", the same office the German calls Bevollmächtigter).
  Translate those passages; do not silently drop them or treat them as
  corrupt German.

  Do NOT mistake Polish PROPER NAMES in German sentences for Polish text.
  Trąbczyn, Młynkiewicz, Rządkowski, Głazewo, Świecia, Przybysław, Zagorowo,
  Wrąbczyn and Wrąbczynek appear throughout German prose and stay as they are.
  Wrąbczyn, Wrąbczynek and Trąbczyn are three DIFFERENT villages.

  Document 30 is one package in three languages: the Posen chapter privilege
  rendered in German, then the Latin-and-Polish original of the same
  instrument, then the notary's Latin certificate that the copy was extracted
  from the chapter archive. The Latin transumption clause and the Polish body
  are both source text, not corrupt German, and the document is dated by the
  1799 extraction rather than by the 1766 privilege it reproduces.

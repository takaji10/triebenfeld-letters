# Catchwords the line-break pass does not find (editor, 2026-10-03: a
# catchword stays in the transcription, and is not said twice in the reading
# text or the English).
#
# A catchword is the scribe's note, at the foot of a page, of the word the next
# page begins with. resolve_linebreaks.py finds those that stand on a line of
# their own and repeat the next page's opening; these it cannot: a catchword at
# the end of a full line, one the transcription misread (Natan || Nathan), a
# section number repeated overleaf.
#
#   letter, page  the document and the page whose foot carries it
#   line, text    the corpus line, by number and exact text
#   next          the next page's first line, so a shifted corpus is found
#                 again by text, and an entry that no longer fits stops the build
#   drop          line: the whole line is the catchword; otherwise the words at
#                 the end of the line that are (with any wrap mark)
#
# Applied by pipeline/build/corpus_pages.py (load_catchwords); the English is
# kept in step by reference/english_corrections.yml.


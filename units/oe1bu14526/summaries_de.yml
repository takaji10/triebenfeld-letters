# German summaries of Oe 1 Bü 14526, written again in the working session from a
# reading of each document in its German text (intake/summaries_draft.py,
# 2026-10-08). Each statement was checked against its document in session
# (intake/claim_check.yml). A finding aid, not part of the edition text.
oe1bu14526-001: 'Ein undatiertes Schreiben ohne Namen: Der Schreiber bittet, mit Grimm über die beiliegenden Akten von Witów zu sprechen. Man habe sie lange in der Registratur zu Trąbczyn gesucht; beim Umzug des Schreibers aus seiner Wohnung in Wrocław nach Wilhelmsruh seien sie unter den Papieren seiner Frau gefunden worden, die sie in seiner Abwesenheit angenommen, verwahrt und ihm zu geben vergessen habe.'
oe1bu14526-002: 'Punktation, das heißt vorläufige Abrede, über den Verkauf des adligen Guts Witów im Kreis Warta: Der Forstinspektor Rochlitz verkauft es für Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, an Martin Honrichs und Valentin von Kwasieborski für 16000 Rthl in drei Raten. Der Fürst hatte das Gut, das der König dem Obersten von Schlieben verliehen hatte, 1799 von dessen Witwe und Erben gekauft. Für Äcker, die die Bürgerschaft von Warta erstreiten könnte, leistet er keine Gewähr; wird die Erlaubnis zum Erwerb erst nach der Übergabe versagt, behalten die Käufer das Gut ein Jahr als Pacht für 800 Rthl. Danach tritt der Fürst 8000 Rthl der Kaufgelder an den Breslauer Bankier Carl Ferdinand Weigel ab.'
oe1bu14526-003: 'Das fürstliche Gerichtsamt zu Pszczew bestätigt einen Kaufvertrag: Joseph von Jankowski hat das Freischulzengut in Dormowo bei Birnbaum für 2000 Rthl, bar bezahlt, an den Hauptmann und Kreissteuereinnehmer Andreas Ernst Gneust verkauft. Der Vertrag nennt die Abgaben an den Hof Pszczew, das Recht, 250 Schafe zu halten und Bier für den eigenen Bedarf zu brauen, und freies Brennholz aus dem Pszczewer Forst. Jankowski, der kein Deutsch verstand, ließ sich den Vertrag polnisch vorlesen. Friedrich Ludwig, Fürst zu Hohenlohe, bestätigt ihn unbeschadet seiner Rechte, die er nach den alten Grundbüchern prüfen lassen will.'
oe1bu14526-004: 'Kaufvertrag: Friedrich Ludwig, regierender Fürst zu Hohenlohe-Ingelfingen, verkauft die Güter Kolno und Kamionna im Kreis Międzyrzecz, die ihm die Schenkungsurkunde vom 9. August 1796 verlieh, für 142000 Rthl an den Bankdirektor George Conrad Leixner in Frankfurt an der Oder. Das Geld ist bezahlt: über 53139 Rthl erhielt der frühere polnische Rittmeister von Broniewski, der als eingewiesener Gläubiger die Güter besaß, den Rest der Fürst. Der Käufer übernimmt zwei Kapitalien der Kirche zu Kamionna und das strittige Holzrecht in den Krobilawer Wäldern; eine Hypothek von 100000 Rthl für den Kriegs- und Forstrat von Triebenfeld ist getilgt. Für Leixner unterschreibt der Bankier Meyer Bernhard; Leixner genehmigt den Vertrag in Frankfurt.'
oe1bu14526-005: 'Kaufvertrag, nur vom Fürsten Friedrich Ludwig zu Hohenlohe unterschrieben: Er verkauft die Güter Kolno und Kamionna für 142000 Rthl, ohne Anschlag, an den Bankrendanten George Conrad Leixner in Frankfurt an der Oder. Der Rittmeister von Broniewski, der die Güter innehat, gibt sie nach einem Vergleich vom 3. Juli gegen über 53139 Rthl zurück, die Leixner ihm am 8. September in Poznań zahlt; am 10. September werden die Güter schuldenfrei übergeben. 76000 Rthl hat Leixner bereits an den Bergrat Bernhardi gezahlt. Leixner will die Güter parzellieren, und der Fürst verspricht, das nicht zu hindern.'
oe1bu14526-006: 'Erbpachtvertrag vor dem Patrimonialgericht des Fürsten zu Hohenlohe-Ingelfingen: Dessen Generalbevollmächtigter, der Kriegs- und Forstrat von Triebenfeld, gibt dem Wirt Blazy Kukulski aus Osiny eine Hufe Ackerland bei Osiny in ewige Erbpacht. Kukulski hat 100 Rthl Einkaufsgeld bezahlt und zahlt jährlich 30 Rthl Erbzins; er ist frei von Hofdiensten und Erbuntertänigkeit, baut auf eigene Kosten und muss seine Getränke aus der herrschaftlichen Brauerei oder dem Krug nehmen. Der Vertrag wurde deutsch und polnisch vorgelesen; Kukulski unterzeichnet mit Kreuzen. Beigefügt ist die Generalvollmacht des Fürsten für Triebenfeld über die Güter Zagórów, Witów und Trąbczyn.'
oe1bu14526-007: 'Erbpachtvertrag vor dem Patrimonialgericht zu Trąbczyn: Der Kriegs- und Forstrat von Triebenfeld gibt als Generalbevollmächtigter des Fürsten zu Hohenlohe-Ingelfingen dem Hauländer Gottlieb Sarre aus dem Peyserschen Hauland anderthalb Hufen wüstes Land im Wald bei Trąbczyn in ewige Erbpacht. Sarre hat 150 Rthl Einkaufsgeld bezahlt und zahlt jährlich 45 Rthl Erbzins, für das noch zu rodende Land erst nach drei Freijahren; die Hälfte des Zinses kann er ablösen, je 5 Rthl mit 100 Rthl Kapital. Er ist frei von Hofdiensten, baut auf eigene Kosten und muss Getränke und Mahlen bei der Herrschaft nehmen. Kopf und Beglaubigung der Ausfertigung sind polnisch.'
oe1bu14526-008: 'Erbpachtvertrag vor dem Patrimonialgericht zu Trąbczyn: Der Kriegs- und Forstrat von Triebenfeld gibt als Generalbevollmächtigter des Fürsten zu Hohenlohe-Ingelfingen dem Einsassen Christian Friedenberger aus dem Szymanowicer Hauland eine Hufe Land im Trąbczyner Wald in ewige Erbpacht, gegen 100 Rthl Einkaufsgeld, bezahlt, und 30 Rthl jährlichen Erbzins, für das zu rodende Land nach Freijahren bis 1809. Beigefügt sind die Generalvollmacht des Fürsten für Triebenfeld und die Erlaubnis der Kriegs- und Domänenkammer zu Kalisz vom 28. Januar 1806, die Herrschaften Zagórów und Trąbczyn zu parzellieren, Szetlewek und Oleśnica in Erbpacht zu geben und die Dienste der Untertanen in Geldzins umzuwandeln.'
oe1bu14526-009: 'Pachtvertrag: Der Kriegs- und Forstrat Peter Friedrich August von Triebenfeld verpachtet für den Fürsten zu Hohenlohe-Ingelfingen das Vorwerk Kopojno, ohne Vieh und ohne Brauerei, für sechs Jahre von Johanni 1805 bis 1811 an den Propinationspächter Maciej von Niedźwiecki, für jährlich 1500 Rthl im Voraus. Der Pächter erhält die Dienste von zehn Komorniks und den Einliegern und übernimmt die Steuern und die Kompetenz für das Kloster Ląd. In einem Nachtrag pachtet er 13 Hufen dazu; die Pacht steigt auf 2125 Rthl. Niedźwiecki verzichtete auf ein polnisches Protokoll; der Vertrag wurde ihm polnisch erklärt.'
oe1bu14526-010: 'Erbzinsvertrag: Der Kriegs- und Forstrat von Triebenfeld gibt für den Fürsten zu Hohenlohe-Ingelfingen dem Bauinspektor Johann Wilhelm Wollenhaupt 18 Hufen Acker des Vorwerks Drzewce und 2 Hufen Wiesen bei Wrąbczyn mit Wohnhaus und Brauhaus in Drzewce in ewigen Erbzins, für 6000 Rthl Einkaufsgeld und jährlich 300 Rthl. Wollenhaupt verpflichtet sich, das Land in zehn Bauernstellen von mindestens einer Hufe aufzuteilen. Am 25. August 1805 heben beide den Vertrag wegen veränderter Umstände auf; Triebenfeld zahlt Wollenhaupt 600 Rthl, womit dieser für alle Forderungen aus seiner Verwaltung für den Fürsten befriedigt ist. Wollenhaupt räumt das Wohnhaus in Drzewce bis Michaelis für die Vorwerkspächter Titz und Schatzmann.'
oe1bu14526-011: 'Erbzinsvertrag vor dem Patrimonialgericht zu Trąbczyn: Der Kriegs- und Forstrat von Triebenfeld gibt für den Fürsten zu Hohenlohe-Ingelfingen dem Schönfärber und Ratsmann Johann Seymert aus Zagórów drei Hufen vom Vorwerksacker von Trąbczyn, 2 Hufen 24 Morgen Acker und 6 Morgen Wiesen, in ewigen Erbzins, für 900 Rthl Einkaufsgeld zu Johanni und jährlich 45 Rthl. Seymert baut auf eigene Kosten, erhält kein Weide- und Holzrecht, trägt alle Steuern und die Kompetenz für das Kloster Ląd und ist frei von Hofdiensten.'
oe1bu14526-012: 'Erbzinsvertrag vor dem Patrimonialgericht zu Trąbczyn: Der Kriegs- und Forstrat von Triebenfeld gibt für den Fürsten zu Hohenlohe-Ingelfingen dem Förster George Friedrich Kammer aus Pietrzykowo vom Vorwerk Przybysław 6 Hufen Acker und 20 Morgen Wiesen mit allen Wirtschaftsgebäuden des Vorwerks in ewigen Erbzins. Kammer zahlt 2100 Rthl Einkaufsgeld, davon 100 Rthl für die Gebäude, und jährlich 100 Rthl Erbzins; zum Ausfahren des Mistes auf zwei Hufen stellt ihm die Herrschaft diesmal unentgeltlich die Gespanne.'
oe1bu14526-013: 'Erbpachtvertrag: Der Kriegs- und Forstrat Peter Friedrich August von Triebenfeld überlässt als Generalbevollmächtigter des Fürsten zu Hohenlohe-Ingelfingen dem Amtmann Johann Gottlieb Tschachmann 20 Hufen Felder und Wiesen von Trąbczyn auf der Seite gegen Kopojno für immer, gegen 6000 Rthl Einkaufsgeld und jährlich 15 Rthl je Hufe. Tschachmann darf das Land in Teilen an andere weitergeben. Die Erbpächter sind frei von Erbuntertänigkeit und Hofdiensten, haben kein Weide- und Holzrecht und müssen die neuen Dörfer in einer oder zwei geraden Linien anlegen.'
oe1bu14526-014: 'Erbzinsvertrag vor dem Patrimonialgericht zu Trąbczyn: Der Kriegs- und Forstrat von Triebenfeld gibt für den Fürsten zu Hohenlohe-Ingelfingen dem fürstlichen Forstinspektor Carl Titz fünf Hufen vom Vorwerksacker von Trąbczyn, vom Weg nach Podbiele bis an den Mühlgraben, mit dem Obstgarten neben den Ställen, in ewigen Erbzins, für 1500 Rthl Einkaufsgeld in zwei Raten bis Johanni 1806 und jährlich 75 Rthl.'
oe1bu14526-015: 'Punktation, vorbehaltlich der Genehmigung des Fürsten zu Hohenlohe-Ingelfingen: Der Kriegs- und Forstrat von Triebenfeld überlässt den unterzeichneten Erbpächtern, unter ihnen Carl Titz, 270 Hufen Felder, Wiesen und Wälder der Güter Trąbczyn, Łazy, Osiny, Nowawies und Przybysław, gegen 300 Rthl Einkaufsgeld und 15 Rthl jährlichen Zins je Hufe. Sie dürfen weiterverkaufen, müssen den Wald in vier Freijahren roden, sind frei von Erbuntertänigkeit und Hofdiensten und haften gemeinsam; jedes neue Dorf mit Schulzen und Schulmeister erhält 13 Morgen zinsfrei. Ein Vermerk zählt 156 Hufen 25 Morgen auf, die schon an einzelne Erwerber vergeben sind, darunter Tschachmann und Seymert; den Unternehmern bleiben 113 Hufen 4 Morgen.'
oe1bu14526-016: 'Erbpachtvertrag vor dem Patrimonialgericht zu Trąbczyn, vom Fürsten Friedrich Ludwig zu Hohenlohe selbst genehmigt: Der Kriegs- und Forstrat von Triebenfeld gibt den Einsassen Martin Giering, Wilhelm Daniel Schulz, Gottfried und Michel Dümmel, Gottfried Dams und Christoph Schoenfisch das Vorwerk Althütte bei Trąbczyn, 10 Hufen 10 Morgen, mit den Wirtschaftsgebäuden außer dem neuen Kuhstall in ewige Erbpacht. Sie zahlen 1500 Rthl Einkaufsgeld und jährlich 225 Rthl, für das zu rodende Land nach Freijahren bis Johanni 1808, und haften gemeinsam. Ein früherer Vertrag mit ihnen über dieselben zehn Hufen, den ein gewisser Kunkel geschlossen hatte, wird aufgehoben.'
oe1bu14526-017: 'Vertrag, vorbehaltlich der Genehmigung des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen: Dessen Bevollmächtigter, der Kreisjustizkommissionsaktuar Kunkel, verkauft vom Vorwerk Alte Hütte der Herrschaft Trąbczyn 10 Hufen 10 Morgen mit den Wirtschaftsgebäuden außer dem Kuhstall an sechs Holländer, Martin Giering, Wilhelm Daniel Schulz, Gottfried und Michael Dümel, Gottfried Damt und Christoph Schoenfisch, zur Teilung in sechs gleiche Besitzungen. Sie zahlen 2500 Rthl, haften gemeinsam für alle Abgaben, zahlen einen jährlichen Erbzins, dürfen Raff- und Leseholz aus dem Trąbczyner Forst holen und dort weiden und können sich für die Schule der Holländergemeinde zu Trąbczyn anschließen.'
oe1bu14526-018: 'Abschrift eines Erbpachtvertrags vor dem Gerichtsamt zu Pszczew: Der Generalbevollmächtigte Glenck überlässt für Friedrich Ludwig, regierenden Fürsten zu Hohenlohe-Ingelfingen, der Bürgerschaft von Pszczew und den Gemeinden Stołuń, Kuligowo, Szarcz, Stoki, Świechocin und Łowyń die ganze Herrschaft Pszczew mit Vorwerken, Forsten und Propination als Eigentum; der Fürst behält Gerichtsbarkeit, Laudemium, Jagd und das Schloss. Der Preis beträgt 180000 Rthl und jährlich 1000 Rthl Grundzins; die Gemeinden übernehmen Hypothekenschulden von 137000 Rthl und laufende Prozesse. Ihre Bevollmächtigten Matheus Młynkiewicz und Johann Chmara ließen sich den Vertrag verdolmetschen. Beigefügt ist ein Reskript der Kammer zu Poznań von 1806: Der König hat Veräußerung und Parzellierung genehmigt.'
oe1bu14526-019: 'Ausfertigung eines Erbpachtvertrags vor dem Gerichtsamt zu Pszczew: Der Generalbevollmächtigte Glenck überlässt für den regierenden Fürsten zu Hohenlohe-Ingelfingen der Bürgerschaft von Pszczew und den Gemeinden Stołuń, Kuligowo, Szarcz, Stoki, Świechocin und Łowyń die ganze Herrschaft Pszczew als Eigentum, gegen 180000 Rthl und jährlich 1000 Rthl Grundzins. Die Gemeinden übernehmen die eingetragenen Hypothekenschulden und zahlen 35000 Rthl sofort; der Fürst behält Gerichtsbarkeit, Laudemium, Jagd und das Schloss. Der frühere Pächter Bornstädt bleibt bis zum Ende seines Räumungsprozesses auf dem Vorwerk. Die Bevollmächtigten Matheus Młynkiewicz und Johann Chmara ließen sich den Vertrag verdolmetschen.'
oe1bu14526-020: Friedrich Ludwig, Fürst zu Hohenlohe, schenkt dem Gastwirt Friedrich Götzinger in Poznań das herrschaftliche Wohnhaus in Swięcia, als Dank für seine Mühe und Reisen beim Erbpachtgeschäft. Die Gebäude und Ländereien des Vorwerks Swięcia hat er am selben Tag Johann Christian Birlack aus Zilenzig, Johann Götzinger, Johann Siebert und Friedrich Götzinger in Erbpacht gegeben, das Wohnhaus ausgenommen; Götzinger kann es mit der übernommenen Brauerei-Erbpacht als Schank brauchen.
oe1bu14526-021: 'Punktation: Der Kriegs- und Forstrat Peter Friedrich August von Triebenfeld verpflichtet sich als Generalbevollmächtigter des Fürsten zu Hohenlohe, das Gut Witów im Kreis Warta an Franz Meierowitz zu verkaufen, sobald der Verkauf an Honrichs aufgehoben ist, der weder zum Besitz fähig noch zahlungsfähig sei. Meierowitz zahlt 20000 Rthl und einen ewigen Kanon von jährlich 500 Rthl, den er mit 10000 Rthl ablösen kann. Da er die Fähigkeit, adlige Güter zu besitzen, noch nicht nachweisen kann, will Triebenfeld ihm zur königlichen Erlaubnis verhelfen; die Kosten trägt Meierowitz.'
oe1bu14526-022: Die Regierung zu Poznań sendet dem regierenden Fürsten zu Hohenlohe-Ingelfingen eine Ausfertigung des Kaufvertrags über die Güter Kolno und Kamionna mit dem Bankrendanten Leixner, den sie am selben Tag bestätigt hat.
oe1bu14526-023: Bestätigung des Kaufvertrags vom Januar 1805, mit dem Friedrich Ludwig, regierender Fürst zu Hohenlohe-Ingelfingen, die Güter Kolno und Kamionna für 142000 Rthl an den Bankrendanten George Conrad Leixner in Frankfurt an der Oder verkauft, ausgestellt unter dem Siegel der Regierung zu Poznań. Am 6. Februar 1805 bekannten sich die Bevollmächtigten, der Justizrat Melzer für den Fürsten und der Kriminalrat Guderian für Leixner, vor dem Regierungsassessor Bewert zu dem Vertrag. Eingerückt sind der Vertrag und die Vollmachten; Leixner erweiterte seine Vollmacht, weil ein neuer Vertrag den vom 15. Juni 1804 ersetzt hatte.
oe1bu14526-024: Die Kriegs- und Domänenkammer zu Poznań lehnt, auf eine königliche Kabinettsresolution hin, das Gesuch des Fürsten zu Hohenlohe-Ingelfingen ab, die Herrschaft Pszczew an die Bürgerschaft und die übrigen Einsassen in Erbpacht zu geben, und gibt den Vertrag zurück. Andere Grundherren würden folgen, und die Güter des zahlreichen Adels der Provinz, auf dessen Erhaltung zu sehen sei, würden vermindert; der Pszczewer Forst, der einzige beträchtliche der Gegend, könnte nicht ordentlich bewirtschaftet werden; die Einsassen hätten genug Land, die Bürger sollten eher städtische Gewerbe treiben, und die meisten seien zu arm.
oe1bu14526-025: 'Vertrag, vorbehaltlich der Genehmigung des Fürsten zu Hohenlohe-Ingelfingen: Dessen Bevollmächtigter, der Bau- und Ökonomierat Johann Wilhelm Glenck, verkauft dem Mahlmüller Samuel Lucke von der Mühle Białobrzeg bei Wrąbczynek 1000 Morgen Vorwerksland des Guts Szetlewek mit den Vorwerksgebäuden für 12333 Rthl, davon 8333 Rthl an den Pfandbesitzer von Radzinski bei der Räumung, und einen jährlichen Kanon von 500 Rthl. Schankrecht, Brauhaus und Brennerei erhält Lucke gegen einen jährlichen Zins von 400; die Dienste der Untertanen sind ausgenommen, die Herrschaft hat sich bereit erklärt, sie auf ihren Wunsch davon freizulassen. Lucke handelt für mehrere Kaufinteressenten und erbittet zwei bis vier Wochen.'
oe1bu14526-026: 'Protokoll vor dem Polizeimagistrat zu Zagórów: Der Polizeibürgermeister Nüchler aus Pyzdry, der Müller Luka aus Białobrzeg und Kriede aus Wrąbczynek hatten am 20. November 1798 mit Glenck, dem Generalbevollmächtigten des Fürsten zu Hohenlohe, vereinbart, das Gut Szetlewek aufzuteilen, Ansiedler zu stellen und den Kaufpreis zu Johanni zu zahlen. Weil der Pfandbesitzer von Szetlewek die Räumung erschwert, sagen sie sich vom Vertrag los, wenn ihnen 200 Rthl Reisekosten ersetzt werden und die angeworbenen Leute, die schon Handgeld gezahlt haben, sich an die Herrschaft halten. Glenck will zahlen, wenn der Fürst es genehmigt.'
oe1bu14526-027: 'Titz und Bancke berichten aus Zagórów einem Bau- und Ökonomierat: Der Müller Luka hat sich von seinem Vertrag losgesagt, die 25 Rthl erhalten und will das Weitere mit dem Rat in Kalisz abmachen. Zwei Leute, die er zur Übernahme von Land mitbrachte, wurden vertröstet, bis man mit Trąbczyn und Herrn von Szucki fertig sei. Sie bitten, Szuckis Abzug der Regierung zu melden, und fragen, ob der Fürst zu den 1000 Rthl, die die Gemeinde für diesen Abzug geben will, etwas beitragen könne, da Szuckis Schikane gegen die Untertanen wachse. Ein Tischler, der in Szetlewek wohnen wollte, hat aus Verzweiflung ein Haus in Zagórów gekauft.'
oe1bu14526-028: 'Glenck schreibt dem Kriminalrat Grimm in Kalisz: Sein Vertrag mit von Radzinski ist nach dem beigelegten Briefwechsel aufgehoben. Die drei Vertragspartner Luck, Kriede und Nüchler wollten nicht zurücktreten, da sie schon 18 Wirte vorgeführt haben, die gegen Pfand fast zwei Drittel der Felder nehmen; Griese bietet eine Kaution von 2000 Rthl. Den Schaden aus dem Abbruch will Glenck Radzinski anrechnen lassen. Im Vertrag der Trąbczyner Hauländer stehe nach Versicherung von Kramplitz, des Kommissars von Prusimskis, der Vorbehalt, dass ihr Privileg nur für die ersten Besitzer, ihre Söhne und Enkel gelte und sie schon jetzt ein neues nachsuchen müssten.'
oe1bu14526-029: Das fürstliche Gerichtsamt zu Pszczew meldet dem Fürsten zu Hohenlohe-Ingelfingen, dass Sigismund von Rzadkowski sein Erbzinsgut in Głażewo an seine Halbschwester Susanna geborene Treben verkauft hat; der Vertrag ist unter Vorbehalt der fürstlichen Rechte genehmigt. Da dem Fürsten das Vorkaufsrecht zusteht, soll er sich binnen einer Frist erklären, ob er es ausüben will; sonst gilt es nach dem Gesetz für diesen Fall als aufgegeben.
oe1bu14526-030: 'Beglaubigte deutsche Übersetzung, mit dem polnischen Text, eines Auszugs aus dem Privilegienbuch des Domkapitels zu Poznań: Bischof Teodor Czartoryski überlässt 1766 den Eheleuten Simeon und Apollonia Rządkowski eine Hufe wüsten Ackers in Głażewo im Pszczewer Schlüssel mit dem auf Kosten des Hofes erbauten Wohnhaus und der Scheune für 30 Dukaten. Sie zahlen jährlich 130 polnische Gulden in zwei Raten, dazu Kopfgeld und Winterquartiergeld, schicken viermal im Jahr Leute zur Arbeit auf das Vorwerk Głażewo und zur Wiese Obsko und dürfen für je zwei Viertel Gerste eine Tonne Bier aus dem Pszczewer Brauhaus nehmen. Der Bischof sichert ihnen den ruhigen Besitz zu.'

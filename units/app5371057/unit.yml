# For the reader: shown on this unit's provenance page.
description: >-
  One court file from the Hohenlohe patrimonial court at Trąbczyn, sitting at
  Marianton (Mariantów): the hereditary-lease contract of 31 March 1806 by which
  the Prince of Hohenlohe-Ingelfingen, through his plenipotentiary Triebenfeld,
  let one Magdeburg Hufe of the Trąbczyn forest to the settler Christoph Erbet
  for ever, at 100 rt entry money and 30 rt a year. Filed with it are the
  powers of attorney that gave Triebenfeld the right to sign, including a
  certified copy of the Prince's general power of attorney of 19 February 1805;
  the court's engrossment of the contract and its covering notes to both
  parties, of 23 May 1806; and the Polish covering letter and bill of costs of
  28 March 1811 with which Hawich handed the file to the peace court of the
  Konin district, asking that the costs be recovered from Erbet. It is the
  only holding here from the State Archive in Poznań, and the court record of
  a lease of the kind 14526 holds the Prince's copies of.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  These are court and title records, not letters: formulaic chancery German
  from a patrimonial court protocol, with Latin tags (Actum, in duplo,
  testante protocollo de hodierno, in fidem publicam, praevia collatione,
  L. S.) that belong to the legal register and should be kept, not rendered.
  The contract is numbered in paragraphs (§. I to §. XVI); keep that numbering.

  Document 2 is in POLISH throughout: a covering letter to the peace court of
  the Konin district (Sąd Pokoju Powiatu Konińskiego), dated Drzewce 1811, and
  a bill of costs (Likwidacya) in Talar and Dobry Groszy (Tal., dgl.). It is
  source text, not corrupt German. Sąd Pokoju is the peace court; Trybunał the
  departmental tribunal; Olędry the Hauländer (Dutch-law settlers).

  Trąbczyn, Drzewce, Konin, Kalisch and Marianton (Mariantów, where the court
  sat) are place names; Erbet (also Erbert) is the lessee's surname. A Hufe
  Magdeburgisch is a measure of land (thirty Morgen), not a person or place.

# Editorial rulings for 53/71/0/-/57 (APP).
#
# The whole file is one document (editor, 2026-09-30: split further it gets too
# granular): the lease contract as a package, with everything filed with it -
# the court's engrossment order, the powers of attorney, the engrossment and its
# covering notes, and the Polish covering letter and bill of costs of 1811. The
# title page (0001) is front matter. Established 2026-09-30 by reading the file.

places:
  # Place of writing. The court sat at Marianton (Mariantów, by Trąbczyn).
  overrides:
    "1": Marianton

dates:
  # [year, month, day, precision]; null where that element is unknown.
  # The contract's own dateline, written out in words ("den Ein und
  # dreystigsten Maerz Ein Tausend Acht hundert und Sechs"), which the parser
  # cannot read. The package runs on to 23 May 1806 (engrossment) and
  # 28 March 1811 (Hawich's covering letter); a package is dated by the
  # instrument that heads it, as in 14526.
  read:
    "1": [1806, 3, 31, "day"]

  # Taken from the document's own duplicate.
  twin: {}

  # [year, month, day, precision, basis]; the basis is shown to the reader.
  inferred: {}

  # Undated and left so.
  no_date: []

documents:
  # The vocabulary of 14525 and 14526.
  doc_type:
    "1": contract

  # German, with the Polish letter and bill of costs of 1811 inside; recorded
  # as German, its main language, the way 14526 records its German deeds with
  # Polish passages.
  language: {}

  # Same document, transcribed twice.
  duplicate_of: {}

  # Why a sub-record exists, shown on the document.
  split_note: {}

  relations: {}

  # The estates the document is about: the one Hufe of the Trąbczyn forest.
  estates:
    "1": [trabczyn]

damage:
  # Damage is read from the text's own [...] markers. List document numbers
  # here only for damage the transcription does not mark.
  letters: []

app5371057-001: 'Erbpachtvertrag: Triebenfeld als Bevollmächtigter des Fürsten zu Hohenlohe Ingelfingen verleiht dem Einsassen Christoph Erbet aus dem Hauland von Trąbczyn eine Magdeburger Hufe im Trąbczyner Wald gegen 100 Rthl Einkaufsgeld und 30 Rthl jährlichen Erbzins. Nach drei Freijahren sind zu Weihnachten 1809 15 Rthl fällig. Beigefügt sind die Generalvollmacht vom 19. Februar 1805 und die Ausfertigung vom 23. Mai 1806. Hawich übergibt 1811 die Akten dem Friedensgericht des Kreises Konin und bittet, 9 Rthl 18 dgl Kosten von Erbet einzutreiben.'

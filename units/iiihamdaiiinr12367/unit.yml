  Warschauer Behörden dem preußischen Generalkonsul Schmidt und dem Breslauer
  Bankier Weigel selbst über dessen Entschädigung für die 30.000 Taler
  schrieben, die er dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen auf
  Trąbczyn geliehen hatte und deren Hypothek die polnischen Gerichte gelöscht
  hatten.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Fourteen scans from the second volume of the Prussian foreign ministry's
  file on Michalina Miączyńska's claim, which continues III. HA MdA, III. Nr.
  12366. The Polish courts had struck the mortgage of the Breslau banker
  Weigel, 30,000 thalers lent to the Prince of Hohenlohe-Ingelfingen, off the
  Trąbczyn estates; these pieces follow Prussia's effort to have the Kingdom
  of Poland make the loss good. Most are letters in French to Schmidt, the
  Prussian consul general at Warsaw. Baron Mohrenheim, who ran the diplomatic
  chancellery of Grand Duke Constantine, writes in 1828 and 1830, twice in
  short private notes, that the Administrative Council has recognised that
  Weigel must be paid and has raised a conflict of jurisdiction against the
  courts. In September and November 1830 the finance minister, Prince
  Lubecki, answers Weigel directly, in Polish with a German translation in a
  second column: he finds the demand of 63,100 thalers (capital, interest and
  costs) excessive and orders the estates valued. Weigel's reply from Breslau
  of 14 October 1830, in German, reckons from the mortgage certificate and
  court valuation of 1803 that his loan was fully covered. After the rising,
  Fuhrmann of the finance commission (1831 and 1832) and Engel, head of the
  provisional government (1832), report that the valuation of Trąbczyn has
  been ordered again and that Lubowidzki, president of the Bank of Poland, is
  to settle the matter.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A ministry file in three languages. The letters to the consul are French;
  two of them are hurried private notes in a familiar tone. Prince Lubecki's
  two letters are Polish in the spelling of the time (y for j, as in
  "naypomyślnieyszego"), each with a contemporary German translation written
  beside it; the German is a document of its own kind, not a gloss by the
  edition. Weigel's reply is a German copy with a reckoning in thalers
  ("rthlr.") and good groschen ("gr.", "ggr."). Dates from Warsaw are given in
  both calendars ("26 Janvier / 7 Février"). "WWPan" is the Polish form of
  address "Wielmożny Pan". "le Grand Duc Césarévitch" is Grand Duke
  Constantine. A word followed by [?] is one the transcriber was unsure of.

title: >-
  Papers from the second volume of the Prussian Ministry of Foreign Affairs'
  file on Countess Michalina Miączyńska's claim, 1828 to 1832: what the
  authorities at Warsaw wrote to the Prussian consul general Schmidt, and to
  the Breslau banker Weigel himself, about compensating Weigel for the 30,000
  thalers he had lent Prince Friedrich Ludwig of Hohenlohe-Ingelfingen on
  Trąbczyn, a mortgage the Polish courts had struck out.
title_de: >-

iiihamdaiiinr12367-001: "Baron Mohrenheim antwortet aus Warschau, unter dem Briefkopf der auswärtigen Angelegenheiten des Königreichs Polen, dem preußischen Generalkonsul Schmidt auf dessen Schreiben vom 6. Februar (Nr. 275): Er verliere die Sache Weigel nicht aus den Augen und werde ihm nach der Rückkehr des Großfürsten Konstantin mitteilen, was darin geregelt werden konnte."
iiihamdaiiinr12367-002: "Undatiertes Billett Mohrenheims an Schmidt, beim Aufbruch geschrieben: Er habe am Vortag im Rat seine Denkschrift über die Sache Weigel und Eisenhardt vorgelesen, und dort sei einstimmig anerkannt worden, dass gezahlt werden müsse. Wie, darüber werde man noch beraten."
iiihamdaiiinr12367-003: "Undatiertes Billett Mohrenheims an Schmidt, an einem Dienstag geschrieben. Er schickt ihm dessen „Dubois“ zurück, den er mit großem Interesse gelesen habe, und bittet dringend um die Fortsetzung. Die Sache Weigel werde er vorantreiben; wegen des Übrigen solle Schmidt ruhig sein, man werde mit Ehren herauskommen. Er habe dort schreckliches Wetter; der Rest dieses Satzes ist nicht sicher gelesen."
iiihamdaiiinr12367-004: "Mohrenheim teilt Schmidt mit, er habe dessen Schreiben vom 18. Februar (Nr. 352) dem Großfürsten Konstantin vorgelegt. Der Administrationsrat habe dem Großfürsten im August des Vorjahres berichtet, es sei anerkannt worden, dass die Zuständigkeit der Gerichte, die in der Sache der Bankiers Weigel und Eisenhardt geurteilt haben, in Frage gestellt werden könne, weil der Fall seiner Natur nach nur auf diplomatischem Weg zu lösen sei. Der Rat habe deshalb die Kommission der Finanzen und des Schatzes ermächtigt, einen Zuständigkeitskonflikt zu erklären und ihn der Generalversammlung des Staatsrats zur Entscheidung vorzulegen. Da der Großfürst seither keine weitere Mitteilung erhalten hat, hat er den Rat aufgefordert, den Abschluss der Sache zu beschleunigen."
iiihamdaiiinr12367-005: "Ein Schreiben aus Warschau an den Generalkonsul Schmidt; die Unterschrift ist nicht gelesen. Der Verfasser hat Schmidts Schreiben vom 26. Juli (Nr. 1648) über den Prozess, der vor den Gerichten des Königreichs zwischen Frau Miączyńska und ihren Gläubigern wegen der vom Fürsten Hohenlohe aufgenommenen Schulden anhängig ist, dem Finanzminister vorgelegt. Er hat den Minister außerdem, wie Schmidt wünschte, an die Forderung erinnert, die der Bankier Weigel gegen den Fiskus des Königreichs erhebt, weil Urteile ihm eine Forderung dieser Art aberkannt haben. Aus zwei beiliegenden Stücken werde Schmidt sehen, dass seine Mitteilungen die nötigen Maßnahmen veranlasst haben und dass sein Schreiben vom 26. Juli der polnischen Verwaltung einen großen Dienst erwiesen hat, weil es sie rechtzeitig vor einem ungünstigen Ausgang dieser Prozesse warnte."
iiihamdaiiinr12367-006: "Abschrift eines Schreibens des Finanzministers Fürst Lubecki an Weigel, in polnischer Sprache. Er hat Weigels Schreiben vom 10. August und dessen Erneuerung vom 14. September erhalten, die Entschädigung für die Verluste verlangen, die Weigel dadurch erlitt, dass die Gerichte des Landes seine Forderung von 30.000 Talern aus den Gütern von Trąbczyn löschen ließen. Dem ersten Schreiben lag eine Aufstellung bei: 30.000 Taler Kapital, 31.800 Zinsen und 1300 Kosten, zusammen 63.100 Taler. Lubecki hält diese Forderung für überhöht, weil Weigel nach den im Land geltenden Gesetzen selbst beim günstigsten Ausgang des Prozesses nie so viel hätte erlangen können. Da er aber die wirklich erlittenen, nicht die nominellen Verluste ersetzen will, hat er angeordnet, den Wert der früher mit der Forderung belasteten Güter an Ort und Stelle festzustellen, um den wirklichen Wert des verlorenen Kapitals zu schätzen. Deshalb habe er bisher keine genaue Antwort geben können."
iiihamdaiiinr12367-007: "Abschrift der Antwort Weigels an den Finanzminister Fürst Lubecki, aus Breslau. Auf dessen Schreiben vom 22. September (Nr. 59607/938) übersendet er in beglaubigter Abschrift den Hypothekenschein vom 14. August 1803 und die gerichtliche Taxe vom 6. Mai 1803 über die Güter Trąbczyn, Osiny, Łazy, Nowawieś, Zarobna und die Trąbczyner Hauländer. Nach dem Hypothekenschein ist der Wert der Güter auf 160000 Reichstaler angenommen. Vor seiner Forderung sind eingetragen: Kirchenkapitalien von 7000 Gulden oder 1166 Reichstalern 16 Groschen, für von Przepolewski, obschon bezahlt, 5000 und für von Lichnowski 42000, zusammen 48166 Reichstaler 16 Groschen. Für seinen Posten, für von Grottowski und jetzt für ihn eingetragen, blieben 111833 Reichstaler 8 Groschen, also 48733 Reichstaler 8 Groschen mehr als seine Forderung von 63100. Die Taxe sei nach den niedrigen Grundsätzen der Domänenveranschlagung angelegt und komme deshalb nur auf 128917 Reichstaler 17 Groschen; auch davon blieben nach Abzug der vorstehenden Posten 80751 Reichstaler 1 Groschen zu seiner Deckung. Seine Forderung sei also ganz sicher gewesen, und wäre ihm die Rechtshilfe nicht versagt worden, hätte er die vorstehenden Posten ablösen und in der Zwangsversteigerung mitbieten können. Er erwartet, dass der Fürst seine Befriedigung veranlasst und einen nahen Termin für eine Übereinkunft bestimmt, zu dem er selbst oder ein Bevollmächtigter erscheinen würde."
iiihamdaiiinr12367-008: "Abschrift eines zweiten Schreibens des Finanzministers Fürst Lubecki an Weigel (Nr. 77775), in polnischer Sprache. Die Unterlagen zur Schätzung der Güter von Trąbczyn, die Weigel mit seiner Eingabe vom 14. Oktober 1830 gesandt hat, hat er der Behörde übergeben, die er mit der Schätzung des heutigen Werts dieser Güter beauftragt hat. Weigel meine zwar, sein Kapital sei nach der gerichtlichen Taxe auf Trąbczyn vollkommen gesichert gewesen; diese Taxe sei aber 1803 aufgenommen worden, in einer Zeit überhöhter Güterpreise. Der wirkliche Wert der Forderung sei nach dem heutigen Wert der Liegenschaften zu schätzen, weil das letzte Urteil in Weigels Sache 1826 erging und erst von da an die Zwangsvollstreckung hätte betrieben werden können. Da Weigels Schreiben keine annehmbareren Bedingungen für einen Vergleich enthält, müsse er die Fertigstellung der Arbeit abwarten, die er in seiner Antwort vom 22. September erwähnt hat und deren Beschleunigung er überwacht."
iiihamdaiiinr12367-009: "Ein Schreiben aus Warschau an den Generalkonsul Schmidt (Nr. 301), auf der Aufnahme mit „R. Fuhrmann“ unterzeichnet. Auf Schmidts Verwendung vom 10. Dezember 1831 für das Gesuch Weigels hat der Verfasser die Finanzkommission angewiesen, die Schätzung der Domäne Trąbczyn zu beschleunigen, zugleich die Sicherheit des Kapitals zu prüfen, das Weigel auf diesem Gut hat, und ihm die Sache vorzulegen; mit dieser Arbeit war die Kommission schon im Vorjahr beauftragt. Die besondere Vollmacht, die Seine Majestät dem Fürsten Lubecki zum Verhandeln mit Weigel erteilt hatte, könne keinem anderen dienen; er habe die nötigen Schritte getan, um dieses Hindernis zu beseitigen. Sobald beide Schwierigkeiten behoben sind, werde er alles tun, damit die begründeten Ansprüche eines preußischen Untertanen rasch Erfolg haben."
iiihamdaiiinr12367-010: "Abschrift eines Schreibens Engels aus Warschau an den Generalkonsul Schmidt (Nr. 2216). Unter Bezug auf sein Schreiben vom 12. Februar (Nr. 1871) teilt er mit, dass der Staatsrat Joseph Lubowidzki, Präsident der Bank von Polen, auf Befehl des Kaisers und Königs mit der Ausführung der Konvention vom 29. Mai 1830 beauftragt ist und die nötigen Anweisungen erhalten hat. Dieser neue Kommissar sei auch ermächtigt, die Fragen zu bereinigen, die sich aus der Forderung des Bankiers Weigel ergeben. Engel hofft, er werde das Vertrauen des Kaisers rechtfertigen und sich um die Regelung aller Punkte bemühen, die zwischen der Regierung von Polen und der des Königs von Preußen noch endgültig zu ordnen sind."
iiihamdaiiinr12367-011: "Ein zweites Schreiben derselben Hand wie Dokument 9 an den Generalkonsul Schmidt, in Antwort auf dessen Schreiben vom 1. März (Nr. 432) über die Erledigung der Sache des Weigel in Breslau. Infolge der Maßnahmen, die der Verfasser getroffen und Schmidt am 24. Dezember des Vorjahres mitgeteilt hat, hat die Kommission der Finanzen und des Schatzes am 29. Februar Herrn Drake, Kommissar in der Abteilung der Staatsdomänen, mit der Schätzung der Güter von Trąbczyn beauftragt. Die Arbeit werde einige Zeit brauchen; sobald sie abgeschlossen ist, werde er Schmidt unterrichten. Er bittet ihn, dies inzwischen dem Handelshaus Weigel mitzuteilen."

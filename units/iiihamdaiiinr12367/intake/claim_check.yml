# its checker (VERIFY_SYSTEM): each statement held to the document, as
# supported, overstated (the document says something weaker or different) or
# unsupported, and the summary then only weakened or cut, never added to. Not
# the paid run; there is no reading.json. The documents were read in the corpus
# text and in the session's English (site/_data/translations/); page numbers
# are the document's own.
#
# Result: 77 statements, 76 supported, 1 overstated (document 6: the German

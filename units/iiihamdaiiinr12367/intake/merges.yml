summaries:
  '7':
    en: >-
      Copy of Weigel's reply to the minister of finance, Prince Lubecki, from Wrocław. In answer to
      the minister's letter of 22 September (no. 59607/938) he sends certified copies of the mortgage
      certificate of 14 August 1803 and of the court valuation of 6 May 1803 for the estates of
      Trąbczyn, Osiny, Łazy, Nowawieś, Zarobna and the Trąbczyn settlers' villages. By the mortgage
      certificate the estates are taken to be worth 160,000 Reichstaler. Entered ahead of his claim
      are church capitals of 7,000 florins or 1,166 Reichstaler 16 groschen, 5,000 for von
      Przepolewski, though paid, and 42,000 for von Lichnowski, 48,166 Reichstaler 16 groschen
      together. For his own entry, made for von Grottowski and now standing in his name, 111,833
      Reichstaler 8 groschen remained, which is 48,733 Reichstaler 8 groschen more than his claim of
      63,100. The valuation, he says, was drawn up on the low principles used for assessing crown
      domains and so comes to only 128,917 Reichstaler 17 groschen; even of that, 80,751 Reichstaler
      1 groschen remain to cover him once the prior entries are deducted. His claim was therefore
      wholly secure, and had he not been denied the help of the law he could have paid off the prior
      entries and bid at the forced sale. He expects the Prince to bring about his satisfaction and
      to set an early date for an agreement, at which he or an agent would appear. On the same page
      follows the copy of Lubecki's answer (no. 77775), in Polish: he has passed the papers for
      valuing the Trąbczyn estates, which Weigel sent with his submission of 14 October 1830, to the
      authority he has charged with assessing what the estates are worth now. Weigel holds that by
      the court valuation his capital was fully secured on Trąbczyn; but that valuation was made in
      1803, at a time of inflated land prices. The real value of the claim must be reckoned by what
      landed property is worth today, because the last judgment in Weigel's case was given in 1826
      and only from then could execution have been sought. As Weigel's letter offers no more
      acceptable terms for a settlement, he must await the completion of the work he mentioned in
      his reply of 22 September, which he is seeing hastened.
    de: >-
      Abschrift der Antwort Weigels an den Finanzminister Fürst Lubecki, aus Breslau. Auf dessen
      Schreiben vom 22. September (Nr. 59607/938) übersendet er in beglaubigter Abschrift den
      Hypothekenschein vom 14. August 1803 und die gerichtliche Taxe vom 6. Mai 1803 über die Güter
      Trąbczyn, Osiny, Łazy, Nowawieś, Zarobna und die Trąbczyner Hauländer. Nach dem
      Hypothekenschein ist der Wert der Güter auf 160000 Reichstaler angenommen. Vor seiner Forderung
      sind eingetragen: Kirchenkapitalien von 7000 Gulden oder 1166 Reichstalern 16 Groschen, für von
      Przepolewski, obschon bezahlt, 5000 und für von Lichnowski 42000, zusammen 48166 Reichstaler 16
      Groschen. Für seinen Posten, für von Grottowski und jetzt für ihn eingetragen, blieben 111833
      Reichstaler 8 Groschen, also 48733 Reichstaler 8 Groschen mehr als seine Forderung von 63100.
      Die Taxe sei nach den niedrigen Grundsätzen der Domänenveranschlagung angelegt und komme
      deshalb nur auf 128917 Reichstaler 17 Groschen; auch davon blieben nach Abzug der vorstehenden
      Posten 80751 Reichstaler 1 Groschen zu seiner Deckung. Seine Forderung sei also ganz sicher
      gewesen, und wäre ihm die Rechtshilfe nicht versagt worden, hätte er die vorstehenden Posten
      ablösen und in der Zwangsversteigerung mitbieten können. Er erwartet, dass der Fürst seine
      Befriedigung veranlasst und einen nahen Termin für eine Übereinkunft bestimmt, zu dem er selbst
      oder ein Bevollmächtigter erscheinen würde. Auf derselben Seite folgt die Abschrift der Antwort
      Lubeckis (Nr. 77775), in polnischer Sprache: Die Unterlagen zur Schätzung der Güter von
      Trąbczyn, die Weigel mit seiner Eingabe vom 14. Oktober 1830 gesandt hat, hat er der Behörde
      übergeben, die er mit der Schätzung des heutigen Werts dieser Güter beauftragt hat. Weigel meine
      zwar, sein Kapital sei nach der gerichtlichen Taxe auf Trąbczyn vollkommen gesichert gewesen;
      diese Taxe sei aber 1803 aufgenommen worden, in einer Zeit überhöhter Güterpreise. Der wirkliche
      Wert der Forderung sei nach dem heutigen Wert der Liegenschaften zu schätzen, weil das letzte
      Urteil in Weigels Sache 1826 erging und erst von da an die Zwangsvollstreckung hätte betrieben
      werden können. Da Weigels Schreiben keine annehmbareren Bedingungen für einen Vergleich
      enthält, müsse er die Fertigstellung der Arbeit abwarten, die er in seiner Antwort vom
      22. September erwähnt hat und deren Beschleunigung er überwacht.

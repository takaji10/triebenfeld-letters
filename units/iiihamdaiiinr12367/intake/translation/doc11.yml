  en: |-
    Warsaw, 8/20 March 1832

    [Mr Schmidt,]

    In reply to the communication which you were good enough to address to me dated 1 March/18 February of this year, No. 432, concerning the settlement of the affair of Mr Weigel of Wrocław, it is most agreeable to me to inform you, Consul, that in consequence of the measures which I have taken, and of which I had the honour to inform you by my communication of 12/24 December of the past year, the Commission of Finances and the Treasury, by its decision of 29 February of this year, has charged Mr Drake, Commissioner in the Department of the State Domains, with the valuation of the estates of Trąbczyn.

    As soon as this operation, which (as you will be in a position to judge) will require a good deal of time, has been brought to an end, which I shall see to on my side, I shall not fail to inform you of it.

    Meanwhile I beg you kindly to communicate this circumstance to the commercial house of Weigel, and to accept at the same time the testimony of the distinguished consideration with which I have the honour to be,

    Councillor,

    Your most humble and most obedient Servant

  en: |-
    My dear Schmidt, here is your Dubois; I almost blush to tell you with what interest I have read all these villainies, which does not, however, prevent me from asking you urgently for the continuation. — I shall not fail to push the Weigel affair, & be easy about the rest: I promise you that we shall come out of it with honour. I have frightful weather here, which sometimes make my bread of [uncertain: négrêtes].

    L. B. d. Mohrenheim

    Tuesday.

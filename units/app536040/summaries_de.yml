# A finding aid, not part of the edition text.
app536040-001: "Dekret des Landgerichts in Konin aus der Sitzung, die am Montag nach Septuagesima 1728 begann, überschrieben „Decretum Locationis“. Die Brüder Franciszek und Józef Ścibor Chełmski, Erbherren von Łukom und Łomowo, haben Krzysztof Prusimski als Hauptbeklagten, seinen Sohn Antoni, sechs namentlich genannte adlige Dienstleute und ungenannte Untertanen von Trąbczyn geladen; die Klage war schon zur Sitzung nach Trinitatis 1727 erhoben und damals nicht entschieden worden. Sie werfen Prusimski vor, er habe ohne Rücksicht auf nachbarliche Freundschaft hundert Schock Schindeln, die auf ihrem Grund gefertigt worden waren, samt einer Hütte verbrennen lassen, wobei Kinder, die in der Hütte lebten, beinahe verbrannt wären; er habe vier Arbeitsochsen, die für die Glashütte gehalten wurden, bei einem bewaffneten Überfall wegnehmen lassen und Józef Chełmski nach dem Leben getrachtet; und er habe, während die Kläger am Krontribunal in Piotrków waren, seinen Sohn, die Dienstleute und Untertanen bewaffnet auf Grund geschickt, der seit alters zu Łukom gehöre, und dort Heu in nicht geringer Zahl von Fuhren wegnehmen lassen. Beide Seiten erscheinen vor Gericht. Das Gericht befindet, dass ein vereidigter Kommissar der Woiwodschaften Posen und Kalisz, Wojciech Biskupski, auf den beide sich geeinigt haben, mit je zwei Freunden beider Seiten am Montag nach dem Sonntag Misericordia auf den strittigen Grund gehen muss; sie sollen über das Eigentum am Grund, die Gewalttaten und die Schäden alte, kundige Zeugen unter Eid vernehmen und alle Ansprüche entscheiden. Berufung ist nur gegen das Endurteil zulässig. Beide Parteien haben eine Buße von vierzehn polnischen Mark zu zahlen, halb an die Gegenseite und halb an das Gericht; wer dem Dekret nicht nachkommt, verfällt der Verbannung."

app536040-001:
- {claim: "Dekret des Landgerichts in Konin aus der Sitzung, die am Montag nach Septuagesima 1728 begann, überschrieben „Decretum Locationis“", verdict: supported, where: "p. 1: Actum in Conin in judicijs terrestribus particularibus ... feria secunda post Dominicam Septuagesimae proxima anno Domini millesimo septingentesimo vigesimo octavo; p. 2: Decretum Locationis"}
- {claim: "die Brüder Franciszek und Józef Ścibor Chełmski, Erbherren von Łukom und Łomowo, haben Krzysztof Prusimski als Hauptbeklagten, seinen Sohn Antoni, sechs namentlich genannte adlige Dienstleute und ungenannte Untertanen von Trąbczyn geladen", verdict: supported, where: "p. 2: Generosi Franciscus et Josephus Ścibor Chełmscy bonorum villarum Łukom Łomowo ... haeredes et possessores actores Generosis Christophoro Prusimski parenti principali tum et Antonio Prusimski filio atque nobilibus Niłecki Kałuzoski Jerzmanoski Cieszkoski Zdzęnicki Tomaszeski famulis ... de bonis Trąpczyno subditis de nominibus ad praesens ignotis"}
- {claim: "die Klage war schon zur Sitzung nach Trinitatis 1727 erhoben und damals nicht entschieden worden", verdict: supported, where: "p. 2: feria secunda post Festum Sanctissimae et Individuae Trinitatis proxima anno proxime praeterito 1727 ... instituta et intentata non tamen ob farraginem pro tunc causarum decisa"}
- {claim: "er habe ohne Rücksicht auf nachbarliche Freundschaft hundert Schock Schindeln, die auf ihrem Grund gefertigt worden waren, samt einer Hütte verbrennen lassen, wobei Kinder, die in der Hütte lebten, beinahe verbrannt wären", verdict: supported, where: "p. 2: non observata vicinitatis amicicia; p. 3: tegulas alias Szkudeł centum sexagenas in proprio actoris fundo elaboratas ... una cum certa gaza igne comburere demandavit ... infantes in eadem gaza degentes vix non comburere"}
- {claim: "er habe vier Arbeitsochsen, die für die Glashütte gehalten wurden, bei einem bewaffneten Überfall wegnehmen lassen und Józef Chełmski nach dem Leben getrachtet", verdict: supported, where: "p. 3: boves quatuor laboratiles pro usu officinae vitriarij conservatos ... circa violentam ejus armatim et turmatim super invasionem intercipere demandare ... circa requisitionem per Generosum Josephum Chełmski factam in vitam ejus machinari"}
- {claim: "während die Kläger am Krontribunal in Piotrków waren, seinen Sohn, die Dienstleute und Untertanen bewaffnet auf Grund geschickt, der seit alters zu Łukom gehöre", verdict: supported, where: "p. 3: moderni actores in judiciis ordinariis generalibus tribunalis Regni Petricoviensis ... commorabantur ausus est eundem Generosum Filium suum ac suprascriptos Famulos ac subditos ad inferendas super instruere violentias qui supra instructi fundum actorum proprium ad bona Łukom ab antiquo spectantes ... armata manu turmatim"}
- {claim: "und dort Heu in nicht geringer Zahl von Fuhren wegnehmen lassen", verdict: supported, where: "p. 3: ex eodem faenum in currus collectum in non postrema quantitate curruum intercipere demandare. First written 'nach Trąbczyn fortschaffen lassen'; weakened, because 'devehi[?]' is not surely read"}
- {claim: "beide Seiten erscheinen vor Gericht", verdict: supported, where: "p. 3: actoreae quidem Generosorum Chełmskich per Generosum Josephum Chełmski suo et fratris sui nomine personaliter citatae vero Generosorum Prusimskich conjugum; p. 4: per Generosum Constantinum Marszynski coram se comparentium"}
- {claim: "ein vereidigter Kommissar der Woiwodschaften Posen und Kalisz, Wojciech Biskupski, auf den beide sich geeinigt haben, mit je zwei Freunden beider Seiten am Montag nach dem Sonntag Misericordia auf den strittigen Grund gehen muss", verdict: supported, where: "p. 4: necessariam esse condescensionem Generosi Commissarii Palatinatum Posnaniensis et Calissiensis jurati ac amicorum binorum ex utraque parte locandorum ... Generosum Albertum Biskupski de mutuo inter se electum consensu ... feria secunda post Dominicam Misericordiae proxima in fundum ex quo orta controversia"}
- {claim: "sie sollen über das Eigentum am Grund, die Gewalttaten und die Schäden alte, kundige Zeugen unter Eid vernehmen und alle Ansprüche entscheiden", verdict: supported, where: "p. 4: tam de proprietate fundi controversi quam et violentiis ac damnis causatis ... inquirent inquisitiones juratorias eo nomine per testes juratos aetatis provectae rei gestae bene gnaros expedient ... in omnibus praetensionibus decident ac disjudicabunt"}
- {claim: "Berufung ist nur gegen das Endurteil zulässig", verdict: supported, where: "p. 4: salva parti gravata se sentienti non nisi tantum a definitiva sententia ad judicium praesens reservata et praecustodita appellatione"}
- {claim: "beide Parteien haben eine Buße von vierzehn polnischen Mark zu zahlen, halb an die Gegenseite und halb an das Gericht; wer dem Dekret nicht nachkommt, verfällt der Verbannung", verdict: supported, where: "p. 4: luita per utramque partem paena quatuordecem marcarum Polonensium parti et judicium per medium in instanti solvenda sub paena bannitionis et de Regno Poloniae Dominiisque illi annexis proscriptionis ... super parte decreto praesenti contraveniente"}

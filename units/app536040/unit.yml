# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  A decree of the land court at Konin of January 1728 in the suit of the
  brothers Franciszek and Józef Ścibor Chełmski of Łukom against Krzysztof
  Prusimski of Trąbczyn, his son Antoni, their retainers and subjects, for
  burning shingles and a hut, taking four oxen, and an armed raid in which
  hay was taken: the court sends a sworn commissioner and
  two friends of each side onto the disputed ground to examine witnesses
  and decide who owns it and what harm was done.
title_de: >-
  Ein Dekret des Landgerichts in Konin vom Januar 1728 in der Klage der
  Brüder Franciszek und Józef Ścibor Chełmski von Łukom gegen Krzysztof
  Prusimski von Trąbczyn, dessen Sohn Antoni, ihre Dienstleute und
  Untertanen wegen des Verbrennens von Schindeln und einer Hütte, der
  Wegnahme von vier Ochsen und eines bewaffneten Überfalls, bei dem Heu
  weggenommen wurde: Das Gericht schickt einen vereidigten
  Kommissar und je zwei Freunde beider Seiten auf den strittigen Grund,
  damit sie Zeugen vernehmen und entscheiden, wem er gehört und welcher
  Schaden angerichtet wurde.

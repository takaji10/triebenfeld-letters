# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One entry, "Decretum Locationis", on leaves 372 to 373 verso of a book of
  decrees of the land court at Konin for 1722 to 1780, in Latin, with the
  heading of its sitting from leaf 368: the Monday after Septuagesima 1728,
  adjourned from the autumn of 1727. Franciszek and Józef Ścibor Chełmski,
  heirs of Łukom and Łomowo, had cited Krzysztof Prusimski, his son Antoni,
  six named noblemen in his service and unnamed subjects of Trąbczyn at the
  sitting after Trinity 1727. They charge that Prusimski, setting
  neighbourly friendship aside, had six thousand shingles made on their
  ground burned with a hut, so that children living in it barely escaped;
  had four working oxen kept for their glassworks taken during an armed
  raid; plotted against Józef Chełmski's life; and, while the brothers were
  at the Crown Tribunal at Piotrków, sent his son, retainers and subjects in
  arms onto ground belonging to Łukom, where they took cartloads of hay. Both sides appear. Because the question of whose the ground is
  belongs before its own court, the land court finds that a sworn
  commissioner of the provinces of Poznań and Kalisz, Wojciech Biskupski,
  chosen by both, with two friends of each side, must go onto the ground on
  the Monday after Misericordia Sunday, examine old sworn witnesses on
  ownership, violence and damage, and decide; appeal lies only from the
  final sentence. Each party pays a penalty of fourteen Polish marks; a
  party that does not comply is banished.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A decree of a Polish land court of 1728, in the Latin of the court books;
  the editor's transcription fills out the abbreviations. The English is the
  editor's own translation. "Decretum locationis" is a decree appointing a
  hearing on the ground; "condescensio" the going out onto the ground;
  "amici" the friends each side names to sit with the commissioner;
  "inquisitio" the sworn examination of witnesses; "tegulae alias Szkudeł"
  wooden shingles; "sexagena" a threescore (kopa); "gaza" a hut;
  "inventarium" the livestock of an estate; "officina vitriaria" a
  glassworks; "bannitio" banishment. Trąpczyn and Trąmpczyn are Trąbczyn.

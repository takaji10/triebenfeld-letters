# One sentence on what the holding is about, in English and in German. It is
# the line under the reference on the Sources page and opens the translator's
# prompt. Not the archive's own title: that is kept as archive_title.
title: >-
  The act of 28 September 1776 by which five commissioners in the boundary
  cause between Prusimski and Chełmski, kept away by the parliament at Warsaw
  and the Tribunal at Piotrków, put their sitting on the ground of Łukom off
  to January 1777; none of them is among the six who had signed the
  commission's decree.
title_de: >-
  Der Akt vom 28. September 1776, mit dem fünf Kommissare in der Grenzsache
  zwischen Prusimski und Chełmski, durch den Reichstag in Warschau und das
  Tribunal in Piotrków verhindert, ihre Sitzung auf dem Grund von Łukom auf
  Januar 1777 vertagten; keiner von ihnen gehört zu den sechs, die das Dekret
  der Kommission unterzeichnet hatten.

# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  One document on leaves 497 and 498 of a book of the castle court of Kalisz
  for 1776: the original of an adjournment, in Polish, sewn into the book,
  with the Latin record of its being brought in. Five commissioners appointed
  by the Estates of the Commonwealth in the cause between Prusimski, Starost
  of Niszczewice, heir of Trąbczyn, and Stanisław Ścibor Chełmski, heir of
  Łukomia, declare that because of the ordinary parliament sitting at Warsaw
  and the Crown Tribunal sitting at Piotrków, where some of them have
  business, they cannot end the cause by a final judgment at the term now
  falling under the adjournment made by the decree of 13 September of the year
  before. They put the sitting off to the first Monday after Epiphany 1777 and
  keep a final term for the parties to appear before the commission on the
  ground of Łukomia. Done at their residences on 28 September 1776; signed and
  sealed by Stefan Leszczyc Zielonacki, deputy judge of the Kalisz land court,
  Maciej Leszczyc Mierzewski, Tomasz Radoński, boundary surveyor of Kalisz,
  Stanisław Jabłkowski and Stanisław Otto-Trąmpczyński. Brought to the castle
  office at Kalisz on 30 September 1776 by Antoni Czyżewski.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  An adjournment (limitacja) of a boundary commission of 1776, in Polish, with
  a Latin record of entry. The English is the editor's own translation.
  "Limita", "limitacja" is an adjournment; "termin zawity" a final
  (peremptory) term; "zjazd" the commission's meeting on the ground; "komornik
  graniczny" a boundary surveyor; "podsędek" a deputy judge of a land court.
  "Leszczyc" is the name of a coat of arms, borne before the surname.
  Trąmpczyn and Trąpczyn are Trąbczyn.

app53150kaliszgr425-001: "Vertagung in der Grenzsache zwischen Prusimski, Starost von Niszczewice und Erbherrn von Trąbczyn, und Stanisław Ścibor Chełmski, Erbherrn von Łukomia, ausgestellt am 28. September 1776 und am 30. September in die Akten des Burggerichts Kalisz eingetragen; das Original ist in das Buch eingenäht. Fünf von den Ständen der Republik bestellte Kommissare erklären, sie könnten die Sache im jetzt fälligen Termin nicht durch ein Endurteil abschließen, weil einige von ihnen beim Reichstag in Warschau, andere beim Krontribunal in Piotrków zu tun haben. Der Termin geht auf die Vertagung im Dekret vom 13. September des Vorjahres zurück. Sie vertagen die Zusammenkunft auf den ersten Montag nach Dreikönig 1777 und erhalten den Parteien den letzten Termin zum Erscheinen vor dem Kommissionsgericht auf dem Grund von Łukomia. Es unterzeichnen und siegeln Stefan Leszczyc Zielonacki, Unterrichter des Kalischer Landgerichts, Maciej Leszczyc Mierzewski, Tomasz Radoński, Grenzvermesser von Kalisz, Stanisław Jabłkowski und Stanisław Otto-Trąmpczyński."

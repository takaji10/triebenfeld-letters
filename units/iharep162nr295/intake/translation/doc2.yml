  en: |-
    We Friedrich Wilhelm, by the Grace of God King of Prussia etc., make known and hereby give to be understood: that coram Commissario, Our Government Councillor Stosch, the Councillor of War and Forests Peter Friedrich August von Triebenfeld appeared in person and once more acknowledged the instrument of debt and pledge made out under the 28 January of the current year to the General Invalids' Fund for 50000. Rthl, as the following protocol states:

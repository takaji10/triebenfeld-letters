- page: 2
  confidence: high
  marker_count: 0
  en: |-
    Actum Kalisz, the 27th of February 1805.

    There presented himself before the undersigned commissaries the Royal Councillor of War and Forests Peter Friedrich August von Triebenfeld, who is identified by the Government Councillor von Lichnowski, also present, and says.

    He hereby once more approves the instrument of bond and respective cession made out under the 28th of January of this year for the sum of 50000. Rthl, in words fifty thousand Reichsthaler, which sum he has received as a loan out of the General Invalids' Fund on the part of the Royal Supreme War College. He remarked also that the protocol of acknowledgement standing under this bond was made out by him, and that he likewise once more approves the same according to its whole content

    Since there was now nothing further to remark, the protocol was, after being read out and

    approved, closed and subscribed

    signed: Peter Friedrich August von Triebenfeld

    signed von Lichnowski as witness of identity.

    a. u. s.

    signed: Stosch qua Commissary.

    signed: von Zelislawski

    In witness whereof, under the greater seal of the South Prussian Government and signature. Given at Kalisz, the 5th of March 1805. (L. S.)

    signed Schiller

    T. u. S. 2 Rthl. 3 Groschen.

    Stamps 6 Groschen.

    Copying 4 Groschen.

    Expeditio of the judicial protocol of acknowledgement of the 27th of February 1805.

    signed Schlegel

    4996.

    Vigore Decreti de 5. hujus, and on the ground of the foregoing document, there have been sub-registered in the mortgage book of the Konin district, Vol. 4. Fol. 145. upon Zagórów Rubr. III. ad n. 2., vol. 1. of the same district Fol. 145. upon Drzewce rubr. III. ad N°. 4., and vol. 1. of the same district fol. 295. upon Kopojno rubr. III. ad No 2.

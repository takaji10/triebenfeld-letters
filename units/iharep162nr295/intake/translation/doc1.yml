  - de: "sub hypotheca generali ... sub hypotheca speciali"
    rendered_as: "under a general mortgage ... under a special mortgage"
    alt: "the Latin left standing"
    why: "The two Latin terms are put into English, by the edition's rule that the word is mortgage; the other Latin of the register is kept."
  - de: "Seehandlungs-Obligationen"
    rendered_as: "Seehandlung bonds"

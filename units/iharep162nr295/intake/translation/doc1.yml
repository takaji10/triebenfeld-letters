    why: "The Seehandlung was the Prussian state trading and banking house; its name is kept, as a proper name."
- page: 2
  confidence: high
  marker_count: 0
  en: |-
    the reigning Prince of Hohenlohe-Ingelfingen, Royal Prussian General of Infantry and Governor of Wrocław, for the sum of Two Hundred and Fifty Thousand Thaler in Courant, and made out upon his estates situated in South Prussia, the town of Zagórów, Drzewce, Kopojno, Świątniki, Skokum, Olesnica, Wrąbczyn and Grądzyń, and by virtue of a decree of the 5th of June 1804 is registered upon the said estates; eventualiter I cede of the same the sum of 50000 Rthl as a property of the Most Praiseworthy General Invalids' Fund, in such manner that in respect of this sum I concede to it priority over the 200000. Rthl still belonging to me in the said bond. I also consent to the sub-registration of this pledge and respective cession, and the Most Praiseworthy Invalids' Fund shall be free, in case of non-payment, to assert upon the said bond the right of property belonging to it in this cession.

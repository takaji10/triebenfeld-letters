- page: 3
  confidence: high
  marker_count: 0
  en: |-
    In witness whereof I have subscribed the following bond in my own hand and judicially.

    Thus done at Berlin, the 28th of January 1805.

    I have received this loan of the fifty thousand Thaler.

    signed: Peter Friedrich August von Triebenfeld (L. S.)

    Actum Berlin, the 28th of January 1805. The Royal Councillor of War and Forests, Mr Peter Friedrich August von Triebenfeld, handed over the foregoing bond, according to the content of which the same gives receipt to the Royal General Invalids' Fund for a loan of 50000. Rthl, fifty Thousand Thaler Courant, and pledges and eventualiter cedes to the same for its security a bond for 250000. Rthl Courant made out by the reigning Prince of Hohenlohe-Ingelfingen under the 1st of June 1804, cum jure praeferentiae in respect of the 200000. Rthl of that sum still belonging to him. The party appearing declared his assent to the content of the present bond, then subscribed the same, as likewise this protocol

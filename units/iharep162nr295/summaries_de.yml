iharep162nr295-001: "Abschrift der Schuldverschreibung des Kriegs- und Forstrats Peter Friedrich August von Triebenfeld, Berlin, 28. Januar 1805. Das dritte Departement des Ober-Kriegs-Kollegiums hat ihm aus der General-Invalidenkasse ein Darlehen von 50.000 Talern Courant bewilligt und in Seehandlungs-Obligationen ausgezahlt. Er verspricht, es nach sechsmonatiger, beiden Teilen freistehender Kündigung zurückzuzahlen und bis dahin mit 5 Prozent in halbjährlichen Raten in Berlin zu verzinsen. Zur Sicherheit verpfändet er sein ganzes Vermögen und besonders die Obligation des Fürsten zu Hohenlohe-Ingelfingen vom 1. Juni 1804 über 250.000 Taler, die auf dessen südpreußische Güter Zagórów, Drzewce, Kopojno, Świątniki, Skokum, Oleśnica, Wrąbczyn und Grądzyń eingetragen ist. Für den Fall der Nichtzahlung tritt er der Kasse 50.000 Taler davon ab, mit Vorrang vor den ihm verbleibenden 200.000. Am selben Tag erkennt er die Urkunde vor dem ersten Kurmärkischen Justizamt in Berlin an."
iharep162nr295-002: "Abschrift einer Urkunde der Südpreußischen Regierung in Kalisch vom 5. März 1805, im Namen des Königs ausgestellt. Vor dem Regierungsrat Stosch als Kommissar ist Triebenfeld am 27. Februar 1805 in Kalisch erschienen und hat seine Schuld- und Verpfändungsurkunde vom 28. Januar über 50.000 Taler aus der General-Invalidenkasse nochmals anerkannt, ebenso das unter der Obligation stehende Anerkennungsprotokoll; der Regierungsrat von Lichnowski bezeugte seine Identität. Darunter steht der Vermerk des Ingrossators Beda vom 13. März 1805: Aufgrund eines Dekrets vom 5. des Monats sind die 50.000 Taler, zu 5 Prozent verzinslich und nach sechsmonatiger Kündigung zahlbar, im Hypothekenbuch des Koniner Kreises auf Zagórów, Drzewce und Kopojno für die Invalidenkasse eingetragen worden."
iharep162nr295-003: "Abschrift des Hypothekenscheins über die Stadt Zagórów im Koniner Kreis, den die Südpreußische Regierung in Kalisch am 13. März 1805 der General-Invalidenkasse erteilt (Nr. 1179). Der Fürst zu Hohenlohe-Ingelfingen besitzt das Gut durch die Verleihungsurkunde König Friedrich Wilhelms II. vom 19. Juni 1797; sein Besitztitel ist durch Dekret vom 31. Juli 1801 eingetragen. Als dauernde Lasten stehen darauf: eine jährliche Abgabe von 88 Reichstalern 5 Groschen 9 Pfennig an die Kalischer Kriegs- und Domänenkasse; ein Vorbehalt des Fiskus wegen Bau- und Brennholz aus den Forsten des Gutes nach der Einziehung der geistlichen Güter; und ein Vorbehalt für Johann Giese, Johann Bagans und Friedrich Gietzinger wegen der Holz- und Weiderechte, die ihnen ihr Erbpachtvertrag über Oleśnica vom 22. Februar 1804 in den Zagórówer Forsten gibt. Als Schulden stehen darauf: ein Vorbehalt für den Landesältesten von Lichnowski in Brieg wegen einer schon auf Trąbczyn eingetragenen Forderung von 32.300 Reichstalern; 250.000 Reichstaler für Triebenfeld aus der Schuldverschreibung des Fürsten vom 1. Juni 1804; und davon 50.000 Reichstaler, die Triebenfeld der Invalidenkasse verpfändet und abgetreten hat, mit Vorrang vor dem Rest. Die letzte Zeile beginnt wie dieser Schein und bricht ab."

  General-Invalidenkasse lieh: Abschriften seiner Schuldverschreibung, mit
  der er ein Fünftel der 250.000 Taler verpfändete, die ihm Fürst Friedrich
  Ludwig zu Hohenlohe-Ingelfingen auf die Zagórower Güter schuldete, ihrer
  Anerkennung vor dem Gericht in Kalisch und des Hypothekenscheins für
  Zagórów vom 13. März 1805.

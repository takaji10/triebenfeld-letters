title: >-
  Eleven pages from a file of the Prussian state treasury on the 50,000
  thalers that Peter Friedrich von Triebenfeld borrowed from the army's
  Invalids' Fund in January 1805: copies of his bond, which pledged a fifth of
  the 250,000 thalers that Prince Friedrich Ludwig of Hohenlohe-Ingelfingen
  owed him on the Zagórów estates, of its acknowledgement before the court at
  Kalisz, and of the mortgage certificate for Zagórów of 13 March 1805.
title_de: >-
  Elf Seiten aus einer Akte der preußischen Staatsschatzverwaltung über die

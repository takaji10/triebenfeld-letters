# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Eleven pages from the head of a file kept by the administration of the
  Prussian state treasury from 1820 to March 1827, on a capital of 50,000
  thalers registered on the Zagórów estates, which had belonged to Prince
  Friedrich Ludwig of Hohenlohe-Ingelfingen and by then belonged to Ignatz
  von Trzciński. The pages are copies of the papers of 1805 that created the
  debt. By a bond signed at Berlin on 28 January 1805 the War and Forest
  Councillor Peter Friedrich August von Triebenfeld acknowledges a loan of
  50,000 thalers from the General Invalids' Fund, granted by the third
  department of the Supreme War College, at 5 per cent and repayable on six
  months' notice. As security he pledges the bond the Prince had given him
  at Breslau on 1 June 1804 for 250,000 thalers, registered on the Prince's
  South Prussian estates of Zagórów, Drzewce, Kopojno, Świątniki, Skokum,
  Oleśnica, Wrąbczyn and Grądzyń, and assigns 50,000 thalers of it to the
  fund, with priority over the 200,000 he keeps. The bond is acknowledged
  before the first Kurmark justice office at Berlin the same day and again before the South Prussian
  Regierung at Kalisz on 27 February 1805, and entered in the mortgage book
  of the Konin district on 13 March 1805. The mortgage certificate for
  Zagórów of the same day follows, listing what stood registered on the
  estate: the Prince's title under the King's grant of 19 June 1797, the
  perpetual charges, a caveat for the Lichnowski claim of 32,300 thalers
  already registered on Trąbczyn, the 250,000 thalers for Triebenfeld and
  the 50,000 of them pledged to the fund. It also records a caveat for three
  lessees of Oleśnica, Giese, Bagans and Gietzinger, for the wood and
  grazing their lease of 22 February 1804 gave them in the Zagórów forests.
  The last page breaks off at the opening of a further certificate.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Copies ("Abschrift") of legal instruments, in the German of the Prussian
  courts with the Latin of the mortgage registry: "sub hypotheca generali"
  and "speciali", "eventualiter", "cum jure praeferentiae", "vigore decreti",
  "ex decreto", "in vim recognitionis", "titulus possessionis", "onera
  perpetua", "pro salvando jure et loco", "pro fisco", "Rubr. III". Because
  they are copies, signatures are given as "gez." (signed) and the seal as
  "L. S."; "a. u. s." closes a court record (actum ut supra); a note in
  brackets in the margin such as "(6 ggr. Stempel)" records the stamped
  paper of the original. "rt." is the Reichsthaler, "ggr." the good groschen,
  "pf." the pfennig; the small reckonings beside a signature are the court's
  fees. "Regierung" is the provincial court of justice of South Prussia at
  Kalisz, not a government; "Koninscher Kreis" is the Konin district;
  "subintabulirt" and "Subingrossation" mean the entry of a pledge under an
  existing mortgage entry. A word followed by [?] is one the transcriber was
  unsure of.

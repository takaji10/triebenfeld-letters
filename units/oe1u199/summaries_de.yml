oe1u199-001: 'Landesherrliche Bestätigung des Königs von Preußen für das Familienmajorat und Fideicommiss, das Friedrich Ludwig zu Hohenlohe-Ingelfingen im Testament vom 7. October 1805 stiftete. Der eingerückte Testamentsauszug erklärt zu Majorat: seine Häuser in Wrocław, den Park in Szczytniki, Bytków, Koszęcin mit Boronów, Olszyna, Harbultowitz und Cieszowa sowie die südpreußischen Herrschaften Zagórów, Trąbczyn, Pszczew, Wieniec und Batkowo. Stirbt der Mannsstamm aus, erhält die dritte Tochter Auguste die südpreußischen Güter, Adelheid die schlesischen Hüttenwerke, Emilie Koszęcin.'

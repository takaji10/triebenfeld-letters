# For the reader: shown on this unit's provenance page.
description: >-
  A single engrossed charter, bound in red leather with the King's seal hanging
  from it: Friedrich Wilhelm III's confirmation, given at Berlin on 19 December
  1805, of the family majorat and fideicommiss that Friedrich Ludwig, Prince of
  Hohenlohe-Ingelfingen, founded in his will to keep his house's fortune
  together. The charter recites the Breslau court's certified extract of the
  will (7 October 1805), which settles as majorat the Prince's houses in
  Breslau and his park at Scheitnig, the estate of Byttkow and the Silesian
  ironworks, the lordship of Koschentin with Boronow, Harbultowitz, Olschin and
  Czischowa, and the South Prussian estates of Zagórów, Trąbczyn, Betsche,
  Wieniec and Bątkowo. It also lays down who inherits if the male line fails:
  the Silesian works to the eldest daughter Adelheid, Koschentin and the Saxon
  estates to Emilie, and the South Prussian estates to Auguste.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  A royal charter in chancery German: it opens with the King's full title (a
  long list of territories, many garbled in the transcription; render them as
  well as they can honestly be read and do not invent the missing ones), then
  recites a certified extract of the Prince's will, then confirms it. The will
  extract is in the Prince's own voice (Ich, Mein, capitalised) inside the
  King's (Wir, Uns); keep the two voices distinct. Majorat and Fideicommiss are
  legal institutions (an entailed estate settled on the eldest son); the will's
  sections are numbered § XII-XV and § XXIV and keep that numbering. Latin tags
  (in Fidem publicam, usufruiren, in Capita, in Stirpes, Uxoral Güter, Allodium,
  L. S.) belong to the legal register and are kept. Scheitnig (Szczytniki) is
  the Prince's park in Breslau; Schlawentzitz and Lassowitz are his Silesian
  ironworks; Baildon is the ironmaster John Baildon; Bernhardi and Koenig are
  estate officials.

doc6:
  - statement: The page opens mid-sentence ("dung des Schülers"), as the summary says.
    where: 006, line 1
    verdict: supported
  - statement: The five remaining German middle schools are named as the German boys' gymnasium and the German girls' gymnasium at Lodz and three more at Pabjanize, Zgierz and Sompolno.
    where: 006, lines 3-7
    verdict: supported
  - statement: The subject matter from the Vorschule I up to 0-I is to be worked through in twelve school years, though individual gentlemen argued for an eleven-year course; the majority spoke for keeping the twelve-year type, in view of the overburdening of learning three foreign languages.
    where: 006, lines 8-14
    verdict: supported
  - statement: The coming into being of a directors' conference is welcomed most warmly; the wish is that subject conferences of the teachers at the German institutions follow it.
    where: 006, lines 16-20
    verdict: supported
  - statement: For lack of time the conference could not settle fundamental questions exhaustively, still less a rebuilding or a partial reduction of the subjects; the judgement of the long-serving teaching staff is decisive.
    where: 006, lines 20-24
    verdict: supported
  - statement: Subject conferences would counteract the dangerous going-it-alone; and it would lie in the interest of the former Deutschtum to receive word of their coming into being (the two doubtful words of the line carried as written in the English, the German untouched).
    where: 006, lines 24-33
    verdict: supported

doc7:
  - statement: The first sheet opens mid-sentence ("untergegangenes, geborsteres Volksgut erinnern") and the essay breaks off on the second.
    where: 007, page 1 line 1; page 2 last line
    verdict: supported
  - statement: German family names stand on the shop signs in Warsaw, Lublin and a market town far from the trade routes; the bearers may not be addressed as Germans; the smallest trace of the former folk property is dead; only their German name is left them.
    where: 007, page 1, lines 1-10
    verdict: supported
  - statement: The lawful change of name is beset with difficulties and of late costs a considerable sum; the first volumes of the state newspaper "Monitor Polski" show examples.
    where: 007, page 1, lines 13-17
    verdict: supported
  - statement: The simpler way is the complete transfer of the German family name into Polish, found in the resourcefulness of commune heads and of the evangelical pastors Winkler in Wieluń and v. Boerner in Zduńska-Wola; the four examples Jahn, Schneider, Rot and Blum follow as the summary gives them.
    where: 007, page 1, lines 17-26
    verdict: supported
  - statement: A closer examination finds three kinds of altered name; the summary names the first two as the page does and stops where the page stops, before the third.
    where: 007, page 1, lines 27-34
    verdict: supported
  - statement: The second sheet carries the list of some fifty Polonised surnames, from Brojerski, Bartnowski and Bauerowicz to Schulborski, Wegnerowski and Wilmanski, counted line by line from the transcription.
    where: 007, page 2
    verdict: supported
  - statement: The page closes "So werden deutsche Familiennamen verstümmelt, dem Sprachgefühl und Sprachgebrauch des Mehrheitsvolkes angepasst" and breaks off at "Aus deutschen Polens".
    where: 007, page 2, last 3 lines
    verdict: supported
  - statement: The third page is shown with the holding and has no transcription.
    where: ruling (0034 as "(skipped)")
    verdict: supported

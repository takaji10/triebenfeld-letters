    where: 002, lines 1-2, 3-21
    verdict: supported
  - statement: The pairs run from Niemann - Nowak to Brodel - Brudel; the summary's enumeration follows the page line for line.
    where: 002, lines 3-21
    verdict: supported
  - statement: Neuwert - Nowaczyński carries the doubt mark, as the summary records it.
    where: 002, line 16
    verdict: supported

doc3:

# The claim check of the summaries of APP 53/968/0/-/545, made in session on
# 2026-10-25 under the rules read_letters.py --verify gives its checker: each
# statement held to the document, as supported, overstated or unsupported,
# and the summary only weakened or cut. Not the paid run. The documents were
# read from the corpus text, which carries the editor's own transcription of
# 0031-0033 and the sheet-settled readings of the lists; page numbers are the
# document's.
#
# Result: 33 statements, all supported after two corrected in the draft. The
# draft of document 1 said "nine pairs and a tenth surname left without its
# pair": the page also carries "Gem. Zagórów" between the first pair and the
# second, which the summary now names. The draft of document 6 said the
# schools were "of the Lodz region": the page names Lodz, Pabjanize, Zgierz
# and Sompolno and says no region; the summary now names the four towns and
# does not say where they lie. No statement rests on a page or a name that
# carries a doubt mark except where the summary carries the mark too
# (Nowaczyński, Jursowski).

doc1:
  - statement: The sheet is headed "P. Winkler Polonisierte Namen".
    where: 001, line 1
    verdict: supported
  - statement: Nine pairs of a German surname and its Polonised form stand on the sheet, from Bobel - Rybicki to Gutschke - Gucz.
    where: 001, lines 2, 4-10
    verdict: supported
  - statement: The first pair is dated "7. 1855" and the last line carries "1843. Szuberski".
    where: 001, lines 2, 13
    verdict: supported
  - statement: "Gem. Zagórów" stands under the first pair.
    where: 001, line 3
    verdict: supported
  - statement: Waldowski stands without its Polonised pair.
    where: 001, line 12
    verdict: supported
  - statement: Document 7 names a Pastor Winkler in Wieluń who had German names transferred into Polish.
    where: 007, page 1
    verdict: supported

doc2:

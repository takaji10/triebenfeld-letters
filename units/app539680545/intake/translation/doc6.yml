    [The page begins mid-sentence.] … of the pupil, to choose so immensely
    important a subject, and is left to the insight and the pedagogical
    conscience of those responsible for it. The remaining five German
    middle schools, namely: the German boys' gymnasium at Lodz, the German
    girls' gymnasium at Lodz, the German Kaldukationsgymnasien [as written;
    perhaps "coeducational gymnasiums"] at Pabjanize [Pabianice], Zgierz
    and Sompolno, have, as has already been mentioned, come to an
    understanding on a common basis. The subject matter, from pre-school I
    up to 0-I [as written], is to be worked through in 12 school
    years, although individual gentlemen argued for an eleven-year course.
    However, in view of the abundance of material and the overburdening
    involved in learning three foreign languages, the majority came out
    for keeping the 12-year school type. Judged from the cultural
    standpoint, the coming into being of a directors' conference is to be
    welcomed most warmly. What remains to be wished is that subject
    conferences of the teachers active at the German institutions soon
    follow the directors' conference, which has discussed the great number
    of manifold school questions in general outlines. For lack of time the
    directors' conference could not settle various fundamental questions
    exhaustively, still less matters of the utmost importance, such as a
    rebuilding, a partial reduction of the individual subjects. In this
    respect the judgement of the teaching staff long employed at the
    schools is in any case decisive. The holding of subject conferences
    would also counteract the dangerous going-it-alone at present to be
    observed in the individual institutions and [obscure]. It would lie in
    the interests of the former [written "Frugerspielnischen"] Deutschtum
    if we would like to receive word [written "garbeli-Kunde"] of the
    coming into being of the subject conferences.

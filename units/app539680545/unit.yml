# What the holding is, in a paragraph: the opening of the translator's and the
# summariser's prompts. The reader sees the holding's own page instead, written
# in about.md and process.md beside this file (docs/NEW_UNIT.md).
description: >-
  Ten photographed sheets from the papers of Albert Breyer (1889-1939), a
  teacher at the German school in Sompolno and a historian of the German
  settlements in central Poland, on the Polonisation of German surnames in
  the gmina Zagórów. Five sheets are lists: a list of German surnames of the
  town with their Polonised forms under the head "P. Winkler Polonisierte
  Namen"; a numbered list of nineteen such pairs; an alphabetical list of
  Polonised surnames from Arminski to Wilmański; an excerpt in Breyer's hand
  from a Breslau print of 1741, the "Polnisch-deutsche Briefe" of George
  Schlag, with the Polish and German names of eight boys; and a continuous
  numbered list of fifty-three Polonised surnames with a block of pairs
  where a German name and its Polish translation stand against each other
  (Zech - Czech, Rolle - Rola, Erdmann - Ziemiecki, Blum - Kwiatkowska).
  Three sheets are prose notes: on the German middle schools of the Łódź
  region and their directors' conference, and on the German surnames still
  carried in Warsaw, Lublin and the market towns, the legal and the
  parson's ways of shedding them, and the three kinds of changed name -
  the pages break off mid-sentence, and the last photographed sheet of the
  folder, which continues the essay, is shown in the holding but has no
  transcription.

# Passed to the translator with every document of this holding. Facts about the
# source that change how it should be read, not instructions about style.
translation_note: >-
  Field notes in German, in pencil, written fast and much shortened. The
  lists are tables: a German surname, a dash, its Polonised form; one list
  (document 5) runs across three columns and onto the next sheet, and in it
  a block of pairs sets a German name against its Polish translation
  (Zech - Czech, Blum - Kwiatkowska), not a Polonised form. Breyer's
  spellings of the Polish names are his own and vary between the lists
  (Bartmański and Barmański, Szulborski and Schulborski): give them as
  written, each list in its own spelling. Words he marked doubtful carry
  [?]; a word read with doubt the editor wrote as "word[?]". The prose
  sheets are the editor's transcription and keep Breyer's own spellings and
  slips (Schultypußes, kulturtellen, Musezahl); where the pencil defeated
  him the word is marked or left as it stands. The excerpt of 1741 quotes a
  printed title; its names are those of eight boys of a Breslau school, a
  Polish name against a German one.

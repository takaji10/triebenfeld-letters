# Editorial rulings for Oe 1 Bü 9454.
#
# Keyed by the archive's own document number, which is what letter_id stays.
# Nothing here is derived: each entry is a decision taken against evidence and
# recorded so a rebuild reproduces it. Start empty and fill in from the review
# sheets in review/ as you work through them.

places:
  # Place of writing, where the dateline is absent, illegible or misleading.
  # A trailing [?] marks a reading that is probable rather than settled.
  #   "12": Berlin
  overrides: {}

dates:
  # [year, month, day, precision]; null where that element is unknown.
  #   "3": [1815, 2, 9, "day"]
  supplied: {}

  # Taken from the document's own duplicate.
  twin: {}

  # [year, month, day, precision, basis]; the basis is shown to the reader.
  inferred: {}

  # Undated and left so.
  no_date: []

documents:
  # Anything that is not an ordinary letter, e.g. "register".
  doc_type:
    # A series of tables: the creditors in the Prince's liquidation protocols.
    "303": register

  # Documents transcribed as a table: their text in corpus.txt is CSV, one row
  # per line, each row on the [PAGE ...] it stands on - header rows first, then
  # the numbered entries, then any closing rows (the Summa). The site shows
  # them as tables and checks every cell against the corpus.
  tables: ["303"]

  # The estate or estates each letter is ABOUT, as slugs from reference/places.yml.
  # Authored 2026-09-27 from a reading of every letter, not counted. Datelines,
  # chanceries and journeys do not count. "Majorats Güter" and, from 1811, the Cosmar
  # and Courland-debt business mean the majorat: Schlawenschitz, Lassowitz, Oppurg
  # (letter 245). "Pohl(nische) Güter" and, from 1815, the Entschädigung mean Trąbczyn
  # and Kamionna. The 1798-99 "Güter Tausch" is Krotoszyn and Polajewo. Empty where
  # a letter has no estate business.

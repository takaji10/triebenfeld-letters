# One archival unit. Everything the pipeline needs to know about where this
# material came from and how its files are named.
#
# Copy this shape for a new unit, or run: python new_unit.py <slug> --ref "..."

slug: oe1bu9454
ref: Oe 1 Bü 9454
archive: Hohenloher Zentralarchiv Neuenstein (HZAN)
# What the holding is about, in one sentence, English and German: the line
# under the reference on the Sources page, and the opening of the
# translator's and summariser's prompts (editor, 2026-10-01).
title: >-
  Eighteen years of letters from the estate agent Peter Friedrich von
  Triebenfeld to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen about the
  Prince's estates of Trąbczyn and Zagórów: their sales, loans and lawsuits.
title_de: >-
  Briefe des Güterverwalters Peter Friedrich von Triebenfeld an Fürst
  Friedrich Ludwig zu Hohenlohe-Ingelfingen aus achtzehn Jahren über die Güter
  Trąbczyn und Zagórów des Fürsten: Verkäufe, Darlehen und Prozesse.
# The archive's own finding-aid title, in English. "Kriegs- und Forstrath" is
# the catalogue's wording and is kept: Consistency_Register.md establishes that
# he was Kriegsrath and NOT Forstrath - a long-s misreading had put him in the
# wrong institutional chain - but correcting a catalogue title inside a citation
# would misrepresent the finding aid. The correction belongs in the register and
# in the termbase, and both carry it.
# It was this holding's `title` until 2026-10-01; nothing displays it now.
archive_title: >-
  Correspondence of Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen with the
  Councillor of War and Forests von Triebenfeld
date_span: 1798-1816
status: translated         # draft | transcribed | translated | published

# The translation generation this holding was published from. Every tool
# defaults to the untagged cache, so without this the next check reads an
# abandoned draft and reports faults in text nobody is served.
published_tag: v2

# Which era this holding belongs to - reference/eras.yml. An editorial
# assignment, not a date range: most of these documents postdate the
# ownership they are evidence for. A document that belongs elsewhere
# overrides it in rulings.yml under documents: era:.
era: hohenlohe

# Which archive holds it - reference/repositories.yml. `archive:` above is
# the citation string; this is the slug that groups holdings.
repository: hzan-neuenstein

# This unit was published before URLs carried the archival unit, so stubs are
# generated at the old /letters/<n>/ addresses forwarding to the new ones.
# A newly added unit does not need this.
legacy_flat_urls: true

# Raw scans live outside the project, and are needed only to crop the pages
# again: crop_scans.py reads from raw_dir and writes into raw_dir/processed/.
# The finished pages are in pages/, and the intake records (manifest, fold,
# trim and skew decisions) are kept in units/<slug>/intake/.
scans:
  raw_dir: C:/Users/Tersnaus/Downloads/Oe 1_Bü 9454
  raw_glob: Oe 1_Bü 9454_*.jpg

  # Web derivatives are copied into site/assets/scans/ under an ASCII-safe
  # prefix, because the source name carries a space and an umlaut. Later
  # stages parse this prefix, so it must not change once a unit is published.
  #   Oe 1_Bü 9454_0343_a1.jpg  ->  Oe_1_Bu_9454_0343_a1-L179a_04.jpg
  ascii_prefix: Oe_1_Bu_9454

# The re-transcription, one file per page, matched to the page images in pages/.
transcriptions:
  dir: transcriptions          # units/<slug>/transcriptions/
  glob: "*.txt"

  # These are named <seq>_<archival stem>_<capture>_<crop>.txt, and the capture
  # and crop are the identity, so everything up to and including the stem goes:
  #   0005_Oe 1_Bue 9454_0003_a1.txt  ->  0003_a1
  page_id_strip: "Oe 1_Bue 9454_"

# The transcription. Documents are delimited by [DOC N] on its own line.
corpus: corpus.txt

# For the reader: shown on the unit's provenance page.
description: >-
  Eighteen years of letters from Peter Friedrich von Triebenfeld, who managed
  the Trąbczyn and Zagórów estates for their absent owner, to the owner
  himself. Triebenfeld writes from Berlin, Breslau, Vienna and the estates,
  reporting on sales, loans, lawsuits and the settlers, and pressing the Prince
  for decisions he mostly does not get. Filed with the letters are the
  enclosures they refer to: powers of attorney, court papers, accounts, and
  copies of correspondence with ministers, creditors and officials.

# The convention-setting sample for translate.py --pilot. Deliberately spans
# the range rather than picking easy documents: clean late letters, known-bad
# ones, both non-German documents, and the 48/302 twin - the only document here
# with two witnesses. A property of this holding, so it lives with it.
translation_pilot: ["48", "302", "136", "291", "17", "72e", "283", "290",
                    "297", "3", "215", "247"]

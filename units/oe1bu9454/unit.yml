# One archival unit. Everything the pipeline needs to know about where this
# material came from and how its files are named.
#
# Copy this shape for a new unit, or run: python pipeline/new_unit.py <slug> --ref "..."

slug: oe1bu9454
ref: Oe 1 Bü 9454
archive: Hohenlohe-Zentralarchiv Neuenstein (HZAN)
# What the holding is about, in one sentence, English and German: the line
# under the reference on the Sources page, and the opening of the
# translator's and summariser's prompts (editor, 2026-10-01).
title: >-
  Letters written from 1798 to 1816 by Peter Friedrich von Triebenfeld, the
  agent who managed the estates of Prince Friedrich Ludwig of
  Hohenlohe-Ingelfingen in South Prussia, Prussia's share of partitioned
  Poland, to Hohenlohe-Ingelfingen: on the sales, loans and lawsuits of
  Trąbczyn, Zagórów and his other estates there.
title_de: >-
  Briefe aus den Jahren 1798 bis 1816 von Peter Friedrich von Triebenfeld, dem
  Verwalter der Güter des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen in
  Südpreußen, dem preußischen Anteil am geteilten Polen, an den Fürsten: über
  Verkäufe, Darlehen und Prozesse um Trąbczyn, Zagórów und seine übrigen Güter
  dort.
# The archive's own finding-aid title, in English. "Councillor of War and
# Forests" (Kriegs- und Forstrath) is his title as the deeds give it, confirmed
# by the editor on 2026-10-02; an earlier note here called it a misreading, and
# that was wrong.
# It was this holding's `title` until 2026-10-01; the card's title is made from it now.
archive_title: >-
  Correspondence of Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen with the
  Councillor of War and Forests von Triebenfeld
# The card's title on the Sources list (2026-10-29), made from archive_title; refine it here.
card_title: "Correspondence of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen with the Prussian Councillor of War and Forests von Triebenfeld"
card_title_de: "Korrespondenz des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen mit dem preußischen Kriegs- und Forstrat von Triebenfeld"
# The title in the browser tab and in search results: a short form of the
# translated name (the page's heading keeps the whole name).
short_title: "Correspondence of Hohenlohe-Ingelfingen and Triebenfeld"
short_title_de: "Korrespondenz Hohenlohe-Ingelfingens mit Triebenfeld"
original_title: "Korrespondenz des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen mit dem preußischen Kriegs- und Forstrat von Triebenfeld"
# What kind of material the holding is (editor, 2026-10-29): one or two of the
# slugs in reference/unit_types.yml, the dominant one first.
types: [correspondence]
# The languages of the documents, the main one first - reference/languages.yml.
languages: [de, fr, pl]
date_span: 1798-1816
status: translated         # draft | transcribed | translated | published

# The translation generation this holding was published from. Every tool
# defaults to the untagged cache, so without this the next check reads an
# abandoned draft and reports faults in text nobody is served.
published_tag: v2

# Which era this holding belongs to - reference/eras.yml. An editorial
# assignment, not a date range: most of these documents postdate the
# ownership they are evidence for. A document that belongs elsewhere
# overrides it in rulings.yml under documents: era:.
era: hohenlohe

# Which archive holds it - reference/repositories.yml. `archive:` above is
# the citation string; this is the slug that groups holdings.
repository: hzan-neuenstein

# This unit was published before URLs carried the archival unit, so stubs are
# generated at the old /letters/<n>/ addresses forwarding to the new ones.
# A newly added unit does not need this.
legacy_flat_urls: true

# Raw scans live outside the project, and are needed only to crop the pages
# again: crop_scans.py reads from raw_dir and writes into raw_dir/processed/.
# The finished pages are in pages/, and the intake records (manifest, fold,
# trim and skew decisions) are kept in units/<slug>/intake/.
scans:
  raw_dir: C:/Users/Tersnaus/Downloads/Oe 1_Bü 9454
  raw_glob: Oe 1_Bü 9454_*.jpg

  # Web derivatives are copied into site/assets/scans/ under an ASCII-safe
  # prefix, because the source name carries a space and an umlaut. Later
  # stages parse this prefix, so it must not change once a unit is published.
  #   Oe 1_Bü 9454_0343_a1.jpg  ->  Oe_1_Bu_9454_0343_a1-L179a_04.jpg
  ascii_prefix: Oe_1_Bu_9454

# The re-transcription, one file per page, matched to the page images in pages/.
transcriptions:
  dir: transcriptions          # units/<slug>/transcriptions/
  glob: "*.txt"

  # These are named <seq>_<archival stem>_<capture>_<crop>.txt, and the capture
  # and crop are the identity, so everything up to and including the stem goes:
  #   0005_Oe 1_Bue 9454_0003_a1.txt  ->  0003_a1
  page_id_strip: "Oe 1_Bue 9454_"

# The transcription. Documents are delimited by [DOC N] on its own line.
corpus: corpus.txt

# For the reader: shown on the unit's provenance page.
description: >-
  Eighteen years of letters from Peter Friedrich von Triebenfeld, who managed
  the Trąbczyn and Zagórów estates for their absent owner, to the owner
  himself. Triebenfeld writes from Berlin, Breslau, Vienna and the estates,
  reporting on sales, loans, lawsuits and the settlers, and pressing the Prince
  for decisions he mostly does not get. Filed with the letters are the
  enclosures they refer to: powers of attorney, court papers, accounts, and
  copies of correspondence with ministers, creditors and officials.

# The convention-setting sample for translate.py --pilot. Deliberately spans
# the range rather than picking easy documents: clean late letters, known-bad
# ones, both non-German documents, and the 48/302 twin - the only document here
# with two witnesses. A property of this holding, so it lives with it.
translation_pilot: ["48", "302", "136", "291", "17", "72e", "283", "290",
                    "297", "3", "215", "247"]

# What the "How it was prepared" tab says (reference/prepared.yml; the old text is in notes.md).
prepared:
  transcription:
  - en: Claude transcribed the letters from the German cursive handwriting; the present transcription is a second machine reading, made in September 2026, in which the editor corrected names and layout by hand. The machine's typical errors are a single misread letter and, more seriously, a real word put in place of the right one without a mark of doubt. The editor transcribed seventeen passages written sideways in the margins that the machine had missed.
    de: Claude transkribierte die Briefe nach der deutschen Kurrentschrift; die vorliegende Transkription ist eine zweite maschinelle Lesung vom September 2026, in der der Herausgeber Namen und Layout von Hand korrigierte. Die typischen Fehler der Maschine sind ein einzelner falsch gelesener Buchstabe und, schwerwiegender, ein echtes Wort anstelle des richtigen ohne Zweifelsmarkierung. Siebzehn quer an den Rand geschriebene Stellen, die die Maschine übersehen hatte, transkribierte der Herausgeber.
  - en: 'Claude proposed corrections in several passes, with the editor setting the rule: a word is changed only where an independent witness supports the change and the new word is close in its letters to the old one. Accepted witnesses were a second copy of the same letter, the same word written correctly elsewhere in the letter, a word or name attested many times in the file, and fixed formulas of address and closing. Names, figures, abbreviations and passages in French, Polish or Latin were not changed on Claude''s judgement. The editor checked samples of each batch against the scans.'
    de: 'Claude schlug in mehreren Durchgängen Korrekturen vor, wobei der Herausgeber die Regel setzte: Ein Wort wird nur geändert, wenn ein unabhängiger Beleg die Änderung stützt und das neue Wort dem alten in den Buchstaben nahe ist. Als Belege galten eine zweite Abschrift desselben Briefes, dasselbe Wort an anderer Stelle des Briefes richtig geschrieben, ein in der Akte vielfach belegtes Wort oder ein Name und feste Anrede- und Schlussformeln. Namen, Zahlen, Abkürzungen und Stellen auf Französisch, Polnisch oder Latein änderte Claude nicht nach eigenem Urteil. Der Herausgeber prüfte Stichproben jedes Durchgangs an den Scans.'
  - en: Personal names and titles were brought to one spelling on the editor's ruling. Where a letter gives no date, sender or recipient, the editor or Claude supplied it from the content, and the page of the document states the basis. Thirteen letters are largely uncorrected and marked as rough.
    de: Personennamen und Titel wurden auf Entscheidung des Herausgebers auf eine Schreibung gebracht. Wo ein Brief kein Datum, keinen Absender oder Empfänger nennt, ergänzte ihn der Herausgeber oder Claude aus dem Inhalt, und die Seite des Dokuments nennt die Grundlage. Dreizehn Briefe sind weitgehend unkorrigiert und als grob gekennzeichnet.
  translation:
  - l-claude
  - l-auto-check
  - s-claude

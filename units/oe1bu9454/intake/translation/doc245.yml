    245

    (to the Prince State Chancellor von Hardenberg)

    Most Serene Prince

    Most gracious Prince and Lord, I am most submissively [text lost] to lay before Your Most Serene Highness the enclosed letter of the Prince of Hohenlohe, and at the same time to beg that Most High Person for the most gracious permission to depict to Your Most Serene Highness the most pressing distress of the Prince, and therewith to lay at Your Serene Highness's feet a plan for his rescue and for the relief of his sufferings.

    From of old the Prince of Ingelfingen was Your Most Serene Highness's most faithful adherent and admirer; this man, who has been brought to misfortune through no fault of his own but merely through his yielding to the influence of others upon his benevolent disposition, throws himself into Your Serene Highness's arms; he begs to be protected from the chicanery of the medical councillor Cosmar, which aims at nothing else than that the good Prince shall go hungry in his old age and perish in misery.

    The Sławięcice, Lasowice and Oppurg estates amount in value to a fortune of more than two million Rthl, which, according to the instrument enclosed in copy under A, were confirmed as an entailed estate by His Majesty in 1799, and which today, in the most straitened of times, still yield 79,500 Rthl of income, according to the statement appended under B. Of these considerable estates the Prince, as lord of the entailed estate, is to enjoy the revenues. But by every artifice that can be conceived the medical councillor Cosmar has contrived to nest himself both in the entailed estates and in the estate left by the deceased Princess Sacken, so that he commands everything as though it were his own property, draws in all the revenues, and gives no one a farthing of them. He is called executor of the testament — but what could the Princess Sacken dispose of by way of death? She was of these estates, and that only in part, merely holder of a life interest. The Act A, sanctioned by His Majesty, determines everything: to the [uncertain: divorced] Princess, now married von Sacken, belonged all the estates. After her separation she ceded her whole inheritance of her own free will to her [text lost] wedded lord, the Prince of Hohenlohe, and the Prince founded out of it the trust entail which His Majesty sanctioned. How then could the Princess Sacken still appoint an executor of the testament? Over the ready money she left she might well make testament; but since she has for the greatest part bequeathed everything to her favourite, Prince Adolph, there vanishes every legal ground upon which she, and far less her bosom friend Cosmar, might meddle in the affairs of the entailed estates. But in order to force his way into these affairs notwithstanding the legal barriers standing against it, to dispose in them at his own will, and to command the incomes without accountability, as though over his own property, the medical councillor Cosmar has undertaken the most audacious venture of a determined pettifogger. He drew up the far-reaching settlement here enclosed under C at a time when the Princess von Sacken, if indeed she was still living, could not possibly have surveyed the content and the consequences, since she lay at her last gasp, and in the most favourable case was already so weakened in her vital powers that she signed the far-reaching document, instead of with her signature, only with 3 crosses. This settlement is the sum of all intrigues. There are set out in it so many debts and demands which the Princess Sacken would have to claim, that they exceed everything, and which were never thought of in the deed of foundation. The Prince has already made mention of this to His Excellency the Minister of Justice von Kircheisen, as the copy appended under D shows. In his answer under E, however, silence is kept upon it. This settlement further states that Cosmar may command all the incomes of the entailed estates, and needs render no account to anyone — Whether a second executor of the testament of this kind is anywhere to be found in history I doubt; but on that very account the Princess, at the making of the 3 crosses, could not possibly any longer have been in possession of a sound understanding, for the settlement goes to this, to defraud the monarch and all the Prince's creditors, and to deprive the Prince in particular of honour and of everything, and this the deceased Princess cannot have wished! She knew too well what the Prince had endured for her daughter's sake. There could therefore lie at the ground of this contrivance nothing but the most unbounded malice; for the completion of this notorious settlement, wholly contrary to the sanctioned Act of the year 1799, they even knew how to move the Prince to his approval by the most shameful misrepresentations — Now Cosmar had, in his opinion, a game already won; he at once installed his inexperienced under-age son as administrator of the estates. Drew with him all the revenues, paid neither interest nor capital, and, despite all admonitions of the Higher Provincial Court at Brzeg, which he merely put off with defiant sarcastic answers, rendered no account either — The Prince is to draw yearly, according to the 1st agreement, 24/m Rthl, and his son August, now Prince at Öhringen, 18,000 Rthl; also the latter was, immediately after the death of the Princess Sacken, to be paid 100/m Rthl as a [uncertain: praeciat] toward the settling of his debts. But 3 years have passed, and the old gentleman has received no more than 2,500 Rthl, and the son, Prince August, not a Groschen; where then do the revenues of yearly 79,500 Rthl remain? where is the possibility of obtaining compensation from Cosmar? But here Cosmar's plan comes to light — whatever is said to him by the Prince, he bears it all without blushing — The Prince's letter to His Excellency the Minister of Justice [text lost] a proof of it. His Excellency's answer, however,

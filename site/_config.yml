title: "Traces in the Sand - the Trąbczyn Archive"
description: >-
  The documentary archive behind Traces in the Sand: three centuries of the
  Trąbczyn estate in Greater Poland and the Olęder settlers on it. Transcribed
  from the originals, with English translations.
lang: en

# For a GitHub Pages *project* site set baseurl to "/<repository-name>".
# For a user/organisation site or a custom domain, leave it empty.
baseurl: ""
url: ""

collections:
  letters:
    output: true
    permalink: /documents/:path/
  # One page per holding, English and German; each file sets its own permalink.
  holdings:
    output: true
  holdings_de:
    output: true
  # One page per work of the literature (docs/LITERATURE_PLAN.md), generated
  # by pipeline/literature/literature_site.py.
  literature:
    output: true
  literature_de:
    output: true
  # One page per item of the press (docs/NEWSPAPERS_PLAN.md), generated by
  # pipeline/newspapers/newspapers_site.py.
  newspapers:
    output: true
  newspapers_de:
    output: true
  # One page per person who has one (docs/LITERATURE_PLAN.md, section 22),
  # generated by pipeline/build/person_pages.py.
  people:
    output: true
  people_de:
    output: true
  # One page per place that has one (docs/PLACES_PLAN.md), generated by
  # pipeline/places/place_pages.py.
  places:
    output: true
  places_de:
    output: true

defaults:
  - scope:
      path: ""
      type: holdings
    values:
      layout: unit
  - scope:
      path: ""
      type: holdings_de
    values:
      layout: unit
  - scope:
      path: ""
      type: letters
    values:
      layout: letter
  - scope:
      path: ""
      type: literature
    values:
      layout: literature
  - scope:
      path: ""
      type: literature_de
    values:
      layout: literature
  - scope:
      path: ""
      type: newspapers
    values:
      layout: newspaper
  - scope:
      path: ""
      type: newspapers_de
    values:
      layout: newspaper
  - scope:
      path: ""
      type: people
    values:
      layout: person
  - scope:
      path: ""
      type: people_de
    values:
      layout: person
  - scope:
      path: ""
      type: places
    values:
      layout: place
  - scope:
      path: ""
      type: places_de
    values:
      layout: place

# Generated output and research files are not part of the site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

sass:
  style: compressed

plugins: []

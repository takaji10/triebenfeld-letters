  published: 'Leipzig: Librairie étrangère, 1861'
  year: 1861
  language: de
  english_by: Claude
  scan: ''
  note_en: ''
  note_de: ''
  account_en: 'An anonymous collection, printed at Leipzig in 1861, of extracts from official papers and from the accounts of Prussian officials on the Polish lands Prussia ruled until 1807: the German settlements in the province of Posen, Frederick the Great''s and Frederick William II''s dealings with Poland, and the estates given away to Prussian favourites. It prints the "black register" (pages 140 to 171), the list of the Crown and church estates of South Prussia given away in 1794 to 1798, from a manuscript found among Hans von Held''s papers, with Triebenfeld''s entry on pages 162 to 164, and adds as notes the six corrections Cölln printed in 1807. The compiler writes against Prussian rule and says so; the extracts are useful, the judgements are the compiler''s.'
  account_de: 'Eine anonyme Sammlung, 1861 in Leipzig gedruckt, von Auszügen aus Akten und aus Berichten preußischer Beamter über die polnischen Landesteile, die Preußen bis 1807 beherrschte: die deutschen Kolonisationen in der Provinz Posen, die Politik Friedrichs des Großen und Friedrich Wilhelms II. gegenüber Polen und die an preußische Günstlinge verschenkten Güter. Sie druckt das „schwarze Register“ ab (Seiten 140 bis 171), das Verzeichnis der 1794 bis 1798 verschenkten Kron- und geistlichen Güter Südpreußens, nach einer in Hans von Helds Nachlass gefundenen Handschrift, mit dem Eintrag über Triebenfeld auf den Seiten 162 bis 164, und fügt die sechs Berichtigungen, die Cölln 1807 druckte, als Anmerkungen hinzu. Der Herausgeber schreibt erklärtermaßen gegen die preußische Herrschaft; die Auszüge sind brauchbar, die Urteile sind seine.'
  pages: 236
- slug: mielewczyk2017
  kind: article
  title: Zmiany przestrzeni wsi w drugiej połowie XIX i na początku XX wieku na przykładzie wybranych map ze zbiorów Muzeum Narodowego Rolnictwa i Przemysłu Rolno-Spożywczego w Szreniawie
  title_en: Changes in rural space in the second half of the 19th and early 20th centuries as exemplified by selected maps from the collections of the National Museum of Agriculture and Agro-Food Industry in Szreniawa
  cite: Mielewczyk (2017)
  author: Wojciech Mielewczyk
  author_sort: Mielewczyk, Wojciech
  published: Z Dziejów Kartografii, tom XXI (2017), pp. 41-57. Zespół Historii Kartografii, Instytut Historii Nauki PAN imienia Ludwika i Aleksandra Birkenmajerów
  year: 2017
  language: pl
  english_by: Claude
  scan: http://www.maphist.waw.pl/wp-content/uploads/2020/05/ZDK_21_041-057.pdf
  note_en: ''
  note_de: ''
  account_en: 'A survey by Wojciech Mielewczyk, a curator of the National Museum of Agriculture and Agricultural-Food Industry in Szreniawa, of the changes in the rural space of the Polish lands from the mid-19th century to the mid-20th, shown on the large-scale village maps of the museum''s Scientific Archive: the enfranchisement and separation of the lands in the Prussian partition (1823-1865) and the parcellation-and-settlement action of the Prussian Settlement Commission from 1886 against the Polish counter-action, the melioration under the water companies'' law of 1879; in the Russian partition the ukase of 2 March 1864 without the merging of the plots, the consolidation from below and from 1911 the governmental one; the parcellation of the great estates and the colonies founded on them; the clearing of the forests; and in the Second Republic the land reform, the consolidation act of 1923 and its working. Fourteen of the maps are shown in fragments: among them the map of the estates
    of Trąbczyn of 1861 (fig. 4) with the field of the enfranchised peasants marked, and the colonies of Kolonia Łazińskie and Kolonia Huta founded on the parcellated Trąbczyn estate (p. 48). It rests on the standard economic histories and on the author''s own studies of the Szreniawa collection; it says nothing of the Trąbczyn map''s particulars beyond its scale and shelfmark. The English title, summary and key words of p. 57 are the author''s own, printed as they stand.'
  account_de: 'Ein Überblick von Wojciec Mielewczyk, einem Kurator des Nationalmuseums für Landwirtschaft und Agrar-Nahrungs-Industrie in Szreniawa, über die Veränderungen des ländlichen Raums der polnischen Länder von der Mitte des 19. bis zur Mitte des 20. Jahrhunderts, gezeigt an den großmaßstäblichen Dorfkarten des Wissenschaftlichen Archivs des Museums: die Erb- und Regulierungsreformen in der preußischen Teilung (1823-1865) und die Parzellierungs- und Siedlungsaktion der Preußischen Ansiedlungskommission ab 1886 gegen die polnische Gegenaktion, die Melioration unter dem Gesetz über Wassergenossenschaften von 1879; in der russischen Teilung das Ukas vom 2. März 1864 ohne die Vereinigung der Parzellen, die Zusammenlegung von unten und ab 1911 die staatliche; die Parzellierung der Großgüter und die auf ihnen gegründeten Kolonien; die Rodungen; und in der Zweiten Republik die Landreform, das Zusammenlegungsgesetz von 1923 und seine Wirkung. Vierzehn der Karten sind in Ausschnitten gezeigt:
    unter ihnen die Karte der Güter von Trąbczyn von 1861 (Abb. 4) mit dem Feld der begüterten Bauern, und die Kolonien Kolonia Łazińskie und Kolonia Huta auf dem parzellierten Gut Trąbczyn (S. 48). Er stützt sich auf die Standardliteratur der Wirtschaftsgeschichte und auf des Verfassers eigene Studien der Sammlung von Szreniawa; zu den Einzelheiten der Trąbczyner Karte sagt er nichts über Maßstab und Signatur hinaus. Der englische Titel, die Zusammenfassung und die Schlüsselwörter von S. 57 sind des Verfassers eigene, unverändert gedruckt.'
  pages: 17

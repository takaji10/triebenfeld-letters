  english_by: the editor's files
  scan: ''
  note_en: ''
  note_de: ''
  account_en: Mirosław Słowiński, the author of Zagórów. Album miasta (2007), edits and discusses a hoard of letters found in 1995 walled up in the former cantor's house at Łazińsk, in a book published at Konin in 2023. They are the letters of Bruno Edwin Mielke, a Wehrmacht private from Łazińsk who served on the Arctic front at Petsamo from 1942 to 1944, and of his family at home, written from February 1940 to May 1944. The letters are given in Polish translation, with the author's commentary, an introduction on the German settlement around Zagórów, and an appendix with a German-era note on Łazińsk and the lists of the hoard and of the cantor's library. The book is under copyright, and a detailed summary stands in its place.
  account_de: Mirosław Słowiński, der Verfasser von Zagórów. Album miasta (2007), gibt einen 1995 im ehemaligen Kantorhaus von Łazińsk eingemauert gefundenen Briefschatz heraus und bespricht ihn, in einem 2023 in Konin erschienenen Buch. Es sind die Briefe des Bruno Edwin Mielke, eines Wehrmachtsoldaten aus Łazińsk, der von 1942 bis 1944 an der Eismeerfront bei Petsamo diente, und seiner Familie daheim, geschrieben vom Februar 1940 bis zum Mai 1944. Die Briefe stehen in polnischer Übersetzung, mit dem Kommentar des Verfassers, einer Einleitung über die deutsche Besiedlung um Zagórów und einem Anhang mit einer Notiz der deutschen Zeit über Łazińsk und den Verzeichnissen des Fundes und der Bibliothek des Kantors. Das Buch ist urheberrechtlich geschützt; an seiner Stelle steht eine ausführliche Zusammenfassung.
  brief_en: Słowiński's edition of the letters found in 1995 in the wall of the cantor's house at Łazińsk, written by a Wehrmacht soldier and his family, 1940 to 1944.
  brief_de: Słowińskis Ausgabe der 1995 in der Wand des Kantorhauses von Łazińsk gefundenen Briefe eines Wehrmachtsoldaten und seiner Familie, 1940 bis 1944.

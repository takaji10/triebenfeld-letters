  account_en: A general survey of the noble judiciary of the Polish Commonwealth from the 15th century to the end of the state's independence, by Robert Kucharski, a public prosecutor in Częstochowa who has published a series of historical studies of the Polish courts in Consilium Iuridicum. It describes the land courts, the municipal (castle) courts and the podkomorski courts, the short lived court of the oprawca and the wiec and sejm courts; the judicial offices, the judge, the lay assessors, the court scribe and the court chancellery with its books, the usher, the instygator and the advocates; and then the process itself, its three stages, the means of proof, the judge's reprimand and the appeal, the punishments, the tower, the banishment and the executions, with the stories the court chronicles tell. It closes with the crisis of the land courts in the 17th and 18th centuries and the Four-Year Sejm's abolition of the estate courts. It rests on the standard literature (Kutrzeba, Bardach-Leśnodorski-Pietrzak,
    Naworski, Pawlikowski, Balzer) and names no court book of its own; it is an orientation over the whole period and the kinds of court that the edition's books (the land and municipal books of Konin and Kalisz) belong to.
  account_de: Ein allgemeiner Überblick über die Adelsjustiz der polnischen Adelsrepublik vom 15. Jahrhundert bis zum Ende der Eigenstaatlichkeit, von Robert Kucharski, einem Staatsanwalt in Tschenstochau, der in Consilium Iuridicum eine Reihe historischer Studien über die polnischen Gerichte veröffentlicht hat. Er beschreibt die Landgerichte, die Grod- (Burg-)Gerichte und die Podkomorzy-Gerichte, das kurzlebige Gericht des Oprawca sowie die Wiec- und Sejmgerichte; die Gerichtsämter, den Richter, die Beisitzer, den Gerichtsschreiber und die Gerichtskanzlei mit ihren Büchern, den Woźny, den Instygator und die Advokaten; und dann den Prozess selbst, seine drei Stadien, die Beweismittel, die Nagana des Richters und die Appellation, die Strafen, den Turm, die Verbannung und die Vollstreckungen, mit den Geschichten, die die Gerichtschroniken erzählen. Er schließt mit der Krise der Landgerichte im 17. und 18. Jahrhundert und der Aufhebung der Ständegerichte durch den Vierjährigen Sejm. Er stützt
    sich auf die Standardliteratur (Kutrzeba, Bardach-Leśnodorski-Pietrzak, Naworski, Pawlikowski, Balzer) und nennt kein eigenes Gerichtsbuch; er ist eine Orientierung über den ganzen Zeitraum und die Gerichtsarten, zu denen die Bücher der Edition (die Land- und Grodbücher von Konin und Kalisch) gehören.
  pages: 28
- slug: lukasiewicz1997

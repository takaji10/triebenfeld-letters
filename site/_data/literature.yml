  english_by: Claude
  scan: ''
  account_en: 'An anonymous collection, printed at Leipzig in 1861, of extracts from official papers and from the accounts of Prussian officials on the Polish lands Prussia ruled until 1807: the German settlements in the province of Posen, Frederick the Great''s and Frederick William II''s dealings with Poland, and the estates given away to Prussian favourites. It prints the "black register" (pages 140 to 171), the list of the Crown and church estates of South Prussia given away in 1794 to 1798, from a manuscript found among Hans von Held''s papers, with Triebenfeld''s entry on pages 162 to 164, and adds as notes the six corrections Cölln printed in 1807. The compiler writes against Prussian rule and says so; the extracts are useful, the judgements are the compiler''s.'
  account_de: 'Eine anonyme Sammlung, 1861 in Leipzig gedruckt, von Auszügen aus Akten und aus Berichten preußischer Beamter über die polnischen Landesteile, die Preußen bis 1807 beherrschte: die deutschen Kolonisationen in der Provinz Posen, die Politik Friedrichs des Großen und Friedrich Wilhelms II. gegenüber Polen und die an preußische Günstlinge verschenkten Güter. Sie druckt das „schwarze Register“ ab (Seiten 140 bis 171), das Verzeichnis der 1794 bis 1798 verschenkten Kron- und geistlichen Güter Südpreußens, nach einer in Hans von Helds Nachlass gefundenen Handschrift, mit dem Eintrag über Triebenfeld auf den Seiten 162 bis 164, und fügt die sechs Berichtigungen, die Cölln 1807 druckte, als Anmerkungen hinzu. Der Herausgeber schreibt erklärtermaßen gegen die preußische Herrschaft; die Auszüge sind brauchbar, die Urteile sind seine.'
  pages: 236
- slug: pachonski1973
  kind: article
  title: Les Polonais dans la République de Venise (1794-1797)
  title_en: The Poles in the Republic of Venice (1794-1797)
  cite: Pachoński (1973)
  author: Jan Pachoński
  author_sort: Pachoński, Jan
  published: 'Italia, Venezia e Polonia tra illuminismo e romanticismo, ed. Vittore Branca, Florence: Leo S. Olschki, 1973, pp. 237-256'
  year: 1973
  language: fr
  english_by: Claude
  scan: ''
  account_en: 'An article by Jan Pachoński, a historian of the Polish Legions, read at the conference of the Giorgio Cini Foundation and the Polish Academy of Sciences at Venice in October 1970, on the Polish emigrés in the Republic of Venice from the defeat of the Kościuszko Insurrection in 1794 to the founding of the Legions in 1797: who they were, their parties, the Polish Committee of 1795, the Deputation at Paris and the offer of the Venetian command. Its note 10 counts "Antoni Prusiński de Nieszczewice", the Starost Antoni Prusimski, the owner of Trąbczyn, among the three starosts at Venice at the end of 1794, two years before the edition''s papers show him there. A scholar''s account from the Venetian police registers and the French foreign ministry''s files; it says no more of Prusimski than that note.'
  account_de: 'Ein Aufsatz Jan Pachońskis, eines Historikers der Polnischen Legionen, vorgetragen auf der Tagung der Fondazione Giorgio Cini und der Polnischen Akademie der Wissenschaften in Venedig im Oktober 1970, über die polnischen Emigranten in der Republik Venedig von der Niederlage des Kościuszko-Aufstands 1794 bis zur Gründung der Legionen 1797: wer sie waren, ihre Parteien, das Polnische Komitee von 1795, die Deputation in Paris und das Angebot des venezianischen Oberbefehls. Seine Anmerkung 10 zählt „Antoni Prusiński de Nieszczewice“, den Starost Antoni Prusimski, den Besitzer von Trąbczyn, zu den drei Starosten, die Ende 1794 in Venedig waren, zwei Jahre bevor ihn die Papiere der Edition dort zeigen. Die Darstellung eines Gelehrten aus den venezianischen Polizeiregistern und den Akten des französischen Außenministeriums; über Prusimski sagt sie nicht mehr als diese Anmerkung.'
  pages: 20
- slug: pachonski1982
  kind: reference
  title: Prusimski (Ostroróg-Prusimski) Kazimierz Józef Antoni
  title_en: 'Prusimski (Ostroróg-Prusimski), Kazimierz Józef Antoni: entry in the Polish Biographical Dictionary'
  cite: Pachoński (1982)
  author: Jan Pachoński
  author_sort: Pachoński, Jan
  published: Polski Słownik Biograficzny, vol. 27, Wrocław 1982-1983, pp. 582-584 (the editor dates it 1982)
  year: 1982
  language: pl
  english_by: Claude
  scan: ''
  account_en: The entry in the Polish Biographical Dictionary on Antoni Prusimski (1744 to about 1806), the owner of Trąbczyn whose estates Prussia confiscated after the rising of 1794, by Jan Pachoński, a historian of the Polish Legions. It gives his family (son of Stefan, owner of Kamionna, Kolno and Trąbczyn), his seats in the Sejm, the commissions the Sejm of 1773-1775 named to settle disputes over estates, Trąbczyn among them, his part in the Kuyavian rising of 1794, the confiscation of his estates by Prussia, his exile in Venice, Paris, England and Dresden, his return in 1803 and his daughter Michalina, wife first of Józef Dąmbski and from 1809 of Stanisław Miączyński. It is a scholar's summary from the archives and literature it lists at the end; most of it is about his politics in exile, and its few words on the estates are to be held against the edition's documents.
  account_de: Der Artikel des Polnischen Biographischen Wörterbuchs über Antoni Prusimski (1744 bis um 1806), den Herrn von Trąbczyn, dessen Güter Preußen nach dem Aufstand von 1794 einzog, von Jan Pachoński, einem Historiker der Polnischen Legionen. Er nennt seine Familie (Sohn Stefans, des Besitzers von Kamionna, Kolno und Trąbczyn), seine Sitze im Sejm, die Kommissionen, die der Sejm von 1773-1775 für Streitigkeiten um Güter einsetzte, darunter Trąbczyn, seinen Anteil am kujawischen Aufstand von 1794, die Einziehung seiner Güter durch Preußen, sein Exil in Venedig, Paris, England und Dresden, seine Rückkehr 1803 und seine Tochter Michalina, in erster Ehe Frau Józef Dąmbskis, ab 1809 Stanisław Miączyńskis. Es ist die Zusammenfassung eines Gelehrten aus den Archiven und der Literatur, die er am Ende nennt; das meiste betrifft seine Politik im Exil, und seine wenigen Worte über die Güter sind an den Dokumenten der Edition zu prüfen.
  pages: 3
- slug: paciorkowski1776
  kind: handbook
  title: Regula processus granicialis campestris Regni Poloniae, secundum praxim moderni saeculi ad dislimitanda bona regalia, spiritualia et terrestria. Editio secunda
  title_en: Rule of the Field Boundary Process of the Kingdom of Poland, according to the practice of the present age, for the delimitation of royal, ecclesiastical and noble estates. Second edition
  cite: Paciorkowski (1776)
  author: Marcin Paciorkowski
  author_sort: Paciorkowski, Marcin
  published: 'Częstochowa: Jasna Góra press, 1776'
  year: 1776
  language: la
  english_by: Claude
  scan: ''
  account_en: A handbook of the procedure for settling boundaries between estates in the Kingdom of Poland, by Marcin Paciorkowski, a sworn sub-delegate of the municipal court of Opoczno, who worked such cases. Approved by the censor in 1749; this is the enlarged second edition of 1776, with the laws on boundaries, the law of 1768 among them. It explains the commissions, the boundary chamberlain, the summons, the inspection of the mounds and the decree, step by step, as the practice of the time had them. It does not name Trąbczyn, but it is the procedure of the boundary decrees of 1775 and 1782 between Trąbczyn and its neighbours.
  account_de: Ein Handbuch des Verfahrens zur Festsetzung der Grenzen zwischen Gütern im Königreich Polen, von Marcin Paciorkowski, vereidigtem Subdelegaten des Grodgerichts Opoczno, der solche Sachen selbst führte. Vom Zensor 1749 genehmigt; dies ist die erweiterte zweite Auflage von 1776, mit den Gesetzen über die Grenzen, darunter dem Gesetz von 1768. Es erklärt die Kommissionen, den Grenzkämmerer, die Ladung, die Besichtigung der Grenzhügel und das Dekret Schritt für Schritt, wie die Praxis der Zeit sie kannte. Trąbczyn nennt es nicht, aber es ist das Verfahren der Grenzdekrete von 1775 und 1782 zwischen Trąbczyn und seinen Nachbarn.
  pages: 178
- slug: szwiec2009
  kind: report
  title: Katalog architektury regionalnej dla obszaru „Puszczy Pyzdrskiej”. Opracowanie badań naukowych przeprowadzonych jesienią 2009 roku
  title_en: 'Catalogue of Regional Architecture for the Area of the “Pyzdry Forest”: a Report on the Research Carried Out in the Autumn of 2009'
  cite: Szwiec (2009)
  author: Piotr Szwiec
  author_sort: Szwiec, Piotr
  published: 'Pyzdry and Poznań, 2009: for the research programme of the MECENAT Association (Stowarzyszenie MECENAT), financed by the Ministry of Labour and Social Policy; design by the Studio of Detail Design, Academy of Fine Arts in Poznań; photographs by the research team (P. Baranowska, A. W. Brzezińska, W. Krzyżaniak, P. Mikołajczak, W. Przewoźny, B. Stańda, P. Szwiec)'
  year: 2009
  language: pl
  english_by: Claude
  scan: ''
  account_en: 'A catalogue of the old village buildings of the Pyzdry Forest, the wooded country between Pyzdry, Kalisz and Konin that the Olęder settlers took up from the eighteenth century, by Piotr Szwiec of the Studio of Detail Design at the Academy of Fine Arts in Poznań, from fieldwork of autumn 2009 by a team of ethnographers and architects for the MECENAT Association''s project "The Pyzdry Forest: the Olęders and their iron houses". Trąbczyn, Wrąbczynek, Wrąbczynkowskie Holendry and Orlina are among the twenty-two villages it studied. It describes how the dwelling houses and farm buildings were built (in timber, half-timbering, clay, brick and above all bog iron ore, the "iron" of the "iron houses"), their roofs, windows and doors, their small structures, and the plan of the Olęder villages, with 150 photographs and maps. It is a survey of buildings standing in 2009, mostly of the nineteenth and twentieth centuries; its pages on the history of settlement quote Zbigniew Chodyła. Its
    captions do not name the villages.'
  account_de: 'Ein Katalog der alten Dorfbauten der Puszcza Pyzdrska, des Waldlands zwischen Pyzdry, Kalisz und Konin, das die Olęder-Siedler seit dem 18. Jahrhundert urbar machten, von Piotr Szwiec vom Atelier für Detailgestaltung der Kunstakademie Posen, nach Feldforschungen eines Teams von Ethnographen und Architekten im Herbst 2009 für das Projekt „Puszcza Pyzdrska: die Olęder und ihre eisernen Häuser“ des Vereins MECENAT. Trąbczyn, Wrąbczynek, Wrąbczynkowskie Holendry und Orlina gehören zu den zweiundzwanzig untersuchten Dörfern. Er beschreibt, wie Wohnhäuser und Wirtschaftsgebäude gebaut wurden (aus Holz, in Fachwerk, aus Lehm, Ziegeln und vor allem Raseneisenerz, dem „Eisen“ der „eisernen Häuser“), ihre Dächer, Fenster und Türen, die kleinen Bauten im Hof und die Anlage der Olęder-Dörfer, mit 150 Fotografien und Karten. Es ist eine Bestandsaufnahme von Bauten, die 2009 standen, meist aus dem 19. und 20. Jahrhundert; seine Seiten über die Geschichte der Besiedlung zitieren Zbigniew
    Chodyła. Die Bildunterschriften nennen die Dörfer nicht.'
  pages: 95
- slug: wasicki1953
  kind: article
  title: Kolonizacja niemiecka w okresie Prus Południowych 1793 – 1806
  title_en: German Colonisation in the Period of South Prussia, 1793–1806
  cite: Wąsicki (1953)
  author: Jan Wąsicki
  author_sort: Wąsicki, Jan
  published: 'Przegląd Zachodni, 1953, no. 9-10, pp. 137-179 (Poznań: Instytut Zachodni)'
  year: 1953
  language: pl
  english_by: Claude
  scan: ''
  account_en: 'An article by the Polish legal historian Jan Wąsicki on the colonisation carried on by the Prussian state in South Prussia between the second partition and the defeat at Jena, from the files of the South Prussian administration in the State Archive in Poznań (S. P. Z.) and the German literature: the kings'' plans and the ministers'' reluctance, the recruiting of colonists in Württemberg and on the Rhine, the instructions of 1799 and 1802 that divided colonists into six classes by their means and set the land, help and free years of each, the colonies founded in the Poznań, Warsaw and Kalisz departments, colonisation on private estates, and colonisation in the towns. It says that the "Olęder" settlements founded by Polish lords in the seventeenth and eighteenth centuries were the model the Prussian state took over, and it names the Prince of Hohenlohe-Ingelfingen''s Zagórów and Trąbczyn estates, the 18 families brought there in 1805 and the villages founded in the Warta valley
    (Ludwigslust, Emilienheim, Święcia, the Wrąbczyn colony and others), from Breyer. Written in 1953, it frames the subject in the language of its time ("bourgeois historians", citing Marx), and its own sources are the Prussian administration''s.'
  account_de: 'Ein Aufsatz des polnischen Rechtshistorikers Jan Wąsicki über die Kolonisation, die der preußische Staat in Südpreußen zwischen der Zweiten Teilung und der Niederlage bei Jena betrieb, nach den Akten der südpreußischen Verwaltung im Staatsarchiv Posen (S. P. Z.) und der deutschen Literatur: die Pläne der Könige und das Zögern der Minister, die Werbung von Kolonisten in Württemberg und am Rhein, die Instruktionen von 1799 und 1802, die die Kolonisten nach ihrem Vermögen in sechs Klassen teilten und für jede Land, Hilfe und Freijahre festsetzten, die in den Departements Posen, Warschau und Kalisch gegründeten Kolonien, die Kolonisation auf privaten Gütern und in den Städten. Er sagt, dass die von polnischen Grundherren im 17. und 18. Jahrhundert gegründeten Olęder-Siedlungen das Vorbild waren, das der preußische Staat übernahm, und er nennt die Güter Zagórów und Trąbczyn des Fürsten zu Hohenlohe-Ingelfingen, die 1805 dorthin gebrachten 18 Familien und die im Warthetal gegründeten
    Dörfer (Ludwigslust, Emilienheim, Święcia, die Kolonie Wrąbczyn und andere), nach Breyer. Geschrieben 1953, fasst er den Gegenstand in der Sprache seiner Zeit („bürgerliche Historiker“, Zitate von Marx); seine eigenen Quellen sind die der preußischen Verwaltung.'
  pages: 43
- slug: zychlinski1885
  kind: reference
  title: Złota księga szlachty polskiéj, rocznik VII, str. 187-188 (Prusimski Ostrorog; 1. Odnoga na Trąmbczynie)
  title_en: 'The Golden Book of the Polish Nobility, vol. 7, pp. 187-188: the Prusimski Ostroróg and their branch at Trąbczyn'
  cite: Żychliński (1885)
  author: Teodor Żychliński
  author_sort: Żychliński, Teodor
  published: Złota księga szlachty polskiéj, rocznik VII, Poznań [1885], pp. 187-188 (the year reckoned from the series, one volume a year from 1879; not read off a title page)
  year: 1885
  language: pl
  english_by: Claude
  scan: ''
  account_en: 'Two pages of Teodor Żychliński''s genealogy of the Polish nobility, from his account of the Prusimski family, who wrote themselves Ostroróg. They give the line that held Trąbczyn, generation by generation: Krzysztof, lord of Kolno, Kamionna and Trąbczyn, his four sons and three daughters; his son Stefan; Stefan''s only son Antoni, the Starost of Nieszczewice, and his wife Maryanna Dąmbska; and their only daughter Michalina, who married first Józef Dąmbski and then Stanisław Miączyński, and brought him Trąbczyn, "which her grandson, Count Władysław Miączyński, holds today". Above them stand two earlier generations, to Paweł Apollo the chamberlain. Żychliński wrote from the court books he cites and from what the families told him; where his line differs from the edition''s documents, the notes say so.'
  account_de: 'Zwei Seiten aus Teodor Żychlińskis Genealogie des polnischen Adels, aus seiner Darstellung der Familie Prusimski, die sich Ostroróg schrieb. Sie geben die Linie, der Trąbczyn gehörte, Generation für Generation: Krzysztof, Herr von Kolno, Kamionna und Trąbczyn, seine vier Söhne und drei Töchter; seinen Sohn Stefan; Stefans einzigen Sohn Antoni, den Starosten von Nieszczewice, und dessen Frau Maryanna Dąmbska; und ihre einzige Tochter Michalina, die zuerst Józef Dąmbski und dann Stanisław Miączyński heiratete und ihm Trąbczyn zubrachte, „das heute ihr Enkel, Graf Władysław Miączyński, besitzt“. Darüber stehen zwei frühere Generationen, bis zu Paweł Apollo, dem Kammerherrn. Żychliński schrieb nach den Gerichtsbüchern, die er anführt, und nach den Auskünften der Familien; wo seine Linie von den Dokumenten der Edition abweicht, sagen es die Anmerkungen.'
  pages: 2
- slug: zychlinski1891
  kind: reference
  title: 'Złota księga szlachty polskiéj, rocznik XIII, str. 219-225 (Miączyńscy: hr. Stanisław Adam i jego potomstwo)'
  title_en: 'The Golden Book of the Polish Nobility, vol. 13, pp. 219-225: the Miączyński family, Count Stanisław Adam and his descendants'
  cite: Żychliński (1891)
  author: Teodor Żychliński
  author_sort: Żychliński, Teodor
  published: Złota księga szlachty polskiéj, rocznik XIII, Poznań [1891], pp. 219-225 (the year reckoned from the series, one volume a year from 1879; not read off a title page)
  year: 1891
  language: pl
  english_by: Claude
  scan: ''
  account_en: 'Seven pages of Teodor Żychliński''s genealogy of the Polish nobility, from his account of the Counts Miączyński: Stanisław Miączyński, who married Michalina Prusimska, the heiress of Trąbczyn, in August 1809, and their descendants to 1888. Żychliński gives Stanisław''s service as Prince Józef Poniatowski''s adjutant, with the order of the day of 1809 and the Prince''s letter of 1812; the marriage settlement; how Stanisław, dying in Berlin in 1845, divided the estates among his four sons, Trąbczyn going by sale to Mieczysław, who later sold it to Włodzimierz; the newspaper notices of Michalina (died 1851) and Włodzimierz (died 1879); and Włodzimierz''s nephew Władysław, heir of Trąbczyn. A footnote dates the death of Michalina''s mother, Maryanna Dąmbska, to Padua, 1797. Where the account differs from the edition''s documents and rulings, the notes say so.'
  account_de: 'Sieben Seiten aus Teodor Żychlińskis Genealogie des polnischen Adels, aus seiner Darstellung der Grafen Miączyński: Stanisław Miączyński, der im August 1809 Michalina Prusimska, die Erbin von Trąbczyn, heiratete, und ihre Nachkommen bis 1888. Żychliński gibt Stanisławs Dienst als Adjutant des Fürsten Józef Poniatowski, mit dem Tagesbefehl von 1809 und dem Brief des Fürsten von 1812; den Ehevertrag; wie Stanisław, als er 1845 in Berlin starb, die Güter unter seine vier Söhne teilte, wobei Trąbczyn durch Kauf an Mieczysław ging, der es später an Włodzimierz verkaufte; die Zeitungsnachrufe auf Michalina (gestorben 1851) und Włodzimierz (gestorben 1879); und Włodzimierz'' Neffen Władysław, den Erben von Trąbczyn. Eine Fußnote setzt den Tod von Michalinas Mutter, Maryanna Dąmbska, nach Padua, 1797. Wo die Darstellung von den Dokumenten und Entscheidungen der Edition abweicht, sagen es die Anmerkungen.'
  pages: 7

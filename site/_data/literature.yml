  account_en: 'The page of Helena Zielonacka (born possibly in 1700 by the database''s own estimate, died unknown) in Maria Jadwiga Minakowska''s online database Wielka genealogia Minakowskiej (sejm-wielki.pl), person 2.976.216, the database''s edition of 22 October 2026, saved in the site''s English user interface. What the sections brought in give: her parents Andrzej Zielonacki and Joanna née Wierusz-Kowalska, the ancestor tree (mostly unknown to the database), and her two marriages with their children and grandchildren: about 1720 (the database''s estimate, not evidence) to Józef Ścibor-Chełmski of Chełm and Wola, arms Ostoja, the heir of Łukomia and Łomowo whom the edition''s decree of 1728 names with his brother Franciszek, with their children Katarzyna, Heliodor the canon, Stanisław the Treasurer of Wschowa - the Chełmski brothers of the edition''s boundary decree of 1775 - Józefa and Nepomucena, who married the Bieńkowski brothers, and Tomasz; and about 1740 (again the database''s
    estimate) to Jakub Rościszewski, with their daughter Agnieszka and the Bronisz line through her. The database is compiled from the printed armorials and biographies: this page''s own Notes section names Boniecki''s Herbarz polski (t. II, s. 364, the article Chełmscy h. Ostoja, where her marriage is recorded - the edition holds that part of the article as `boniecki1900`) and a regest of the Konin municipal court''s record of 1727, by which Józef, her guardian as well as her husband, recorded the 3,000 złp of her portion from her father''s estates on his own. The whole page, its Notes included, is kept in the work''s folder as the knowledgebase (full.md) though it is not shown here. Its estimated dates, marked with a question mark ("?1730-"), are the database''s own guesses and are not evidence: the edition does not take them into its prose. The tags in brackets ("[poz]", "[san]") are the site''s marks of the province of an office and are left as printed. Where the page differs from the
    edition''s documents, the notes say so, and the edition follows the documents.'
  account_de: 'Die Seite von Helena Zielonacka (nach der eigenen Schätzung der Datenbank vielleicht 1700 geboren, Todesjahr unbekannt) in Maria Jadwiga Minakowskas Online-Datenbank Wielka genealogia Minakowskiej (sejm-wielki.pl), Person 2.976.216, Ausgabe der Datenbank vom 22.10.2026, gespeichert in der englischen Benutzeroberfläche der Seite. Was die aufgenommenen Abschnitte geben: ihre Eltern Andrzej Zielonacki und Joanna geb. Wierusz-Kowalska, den Vorfahrenbaum (der Datenbank großenteils unbekannt), und ihre beiden Ehen mit ihren Kindern und Enkeln: um 1720 (Schätzung der Datenbank, kein Beleg) an Józef Ścibor-Chełmski von Chełm und Wola, Wappen Ostoja, den Erben von Łukomia und Łomowo, den das Dekret der Edition von 1728 neben seinem Bruder Franciszek nennt, mit ihren Kindern Katarzyna, Heliodor dem Domherrn, Stanisław dem Schatzmeister von Wschowa - die Chełmski-Brüder des Grenzdrechts der Edition von 1775 -, Józefa und Nepomucena, die die Brüder Bieńkowski heirateten, und Tomasz; und
    um 1740 (wieder eine Schätzung der Datenbank) an Jakub Rościszewski, mit ihrer Tochter Agnieszka und der Linie Bronisz durch sie. Die Datenbank ist aus den gedruckten Wappenbüchern und Biographien gearbeitet: der Notes-Abschnitt der Seite nennt Bonieckis Herbarz polski (T. II, S. 364, den Artikel Chełmscy h. Ostoja, wo ihre Ehe steht - die Edition hält diesen Teil des Artikels als `boniecki1900`) und ein Regest der Aufzeichnung des Stadtrechts von Konin von 1727, mit der Józef, ihr Vormund so wie ihr Mann, die 3.000 złp ihrer Portion aus den Gütern ihres Vaters auf den seinen eintrug. Die ganze Seite, die Notes eingeschlossen, liegt als Wissensspeicher (full.md) im Ordner des Werks, wird hier aber nicht gezeigt. Ihre geschätzten Daten, mit einem Fragezeichen bezeichnet ("?1730-"), sind Schätzungen der Datenbank und sind kein Beleg: die Edition nimmt sie nicht in ihren Text. Die Marken in Klammern ("[poz]", "[san]") sind die Wojewodschaftszeichen der Seite für ein Amt und bleiben gedruckt.
    Wo die Seite von den Dokumenten der Edition abweicht, sagen es die Anmerkungen, und die Edition folgt den Dokumenten.'

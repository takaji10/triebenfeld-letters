- slug: szwiec2009
  kind: report
  title: Katalog architektury regionalnej dla obszaru „Puszczy Pyzdrskiej”. Opracowanie badań naukowych przeprowadzonych jesienią 2009 roku
  title_en: 'Catalogue of Regional Architecture for the Area of the “Pyzdry Forest”: a Report on the Research Carried Out in the Autumn of 2009'
  cite: Szwiec (2009)
  author: Piotr Szwiec
  author_sort: Szwiec, Piotr
  published: 'Pyzdry and Poznań, 2009: for the research programme of the MECENAT Association (Stowarzyszenie MECENAT), financed by the Ministry of Labour and Social Policy; design by the Studio of Detail Design, Academy of Fine Arts in Poznań; photographs by the research team (P. Baranowska, A. W. Brzezińska, W. Krzyżaniak, P. Mikołajczak, W. Przewoźny, B. Stańda, P. Szwiec)'
  year: 2009
  language: pl
  english_by: Claude
  scan: ''
  note_en: ''
  note_de: ''
  account_en: 'A catalogue of the old village buildings of the Pyzdry Forest, the wooded country between Pyzdry, Kalisz and Konin that the Olęder settlers took up from the eighteenth century, by Piotr Szwiec of the Studio of Detail Design at the Academy of Fine Arts in Poznań, from fieldwork of autumn 2009 by a team of ethnographers and architects for the MECENAT Association''s project "The Pyzdry Forest: the Olęders and their iron houses". Trąbczyn, Wrąbczynek, Wrąbczynkowskie Holendry and Orlina are among the twenty-two villages it studied. It describes how the dwelling houses and farm buildings were built (in timber, half-timbering, clay, brick and above all bog iron ore, the "iron" of the "iron houses"), their roofs, windows and doors, their small structures, and the plan of the Olęder villages, with 150 photographs and maps. It is a survey of buildings standing in 2009, mostly of the nineteenth and twentieth centuries; its pages on the history of settlement quote Zbigniew Chodyła. Its
    captions do not name the villages.'
  account_de: 'Ein Katalog der alten Dorfbauten der Puszcza Pyzdrska, des Waldlands zwischen Pyzdry, Kalisz und Konin, das die Olęder-Siedler seit dem 18. Jahrhundert urbar machten, von Piotr Szwiec vom Atelier für Detailgestaltung der Kunstakademie Posen, nach Feldforschungen eines Teams von Ethnographen und Architekten im Herbst 2009 für das Projekt „Puszcza Pyzdrska: die Olęder und ihre eisernen Häuser“ des Vereins MECENAT. Trąbczyn, Wrąbczynek, Wrąbczynkowskie Holendry und Orlina gehören zu den zweiundzwanzig untersuchten Dörfern. Er beschreibt, wie Wohnhäuser und Wirtschaftsgebäude gebaut wurden (aus Holz, in Fachwerk, aus Lehm, Ziegeln und vor allem Raseneisenerz, dem „Eisen“ der „eisernen Häuser“), ihre Dächer, Fenster und Türen, die kleinen Bauten im Hof und die Anlage der Olęder-Dörfer, mit 150 Fotografien und Karten. Es ist eine Bestandsaufnahme von Bauten, die 2009 standen, meist aus dem 19. und 20. Jahrhundert; seine Seiten über die Geschichte der Besiedlung zitieren Zbigniew
    Chodyła. Die Bildunterschriften nennen die Dörfer nicht.'

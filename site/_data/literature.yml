  account_de: Die Seite der Helena Zielonacka in Maria Jadwiga Minakowskas Online-Genealogie Wielka genealogia Minakowskiej (sejm-wielki.pl), Person 2.976.216, gespeichert am 22. Oktober 2026 in der englischen Oberfläche der Seite. Die Tochter von Andrzej Zielonacki und Joanna geb. Wierusz-Kowalska heiratete zuerst, um 1720, Józef Ścibor-Chełmski von Chełm und Wola, den Erben von Łukomia und Łomowo; ihre Kinder waren Katarzyna, Heliodor der Domherr, Stanisław der Schatzmeister von Wschowa, Józefa, Nepomucena und Tomasz. Um 1740 heiratete sie Jakub Rościszewski, und ihre Tochter Agnieszka führte die Linie zur Familie Bronisz. Die Seite nennt Bonieckis Herbarz polski und ein Regest des Koniner Grodgerichts von 1727, durch das Józef, ihr Vormund wie ihr Mann, ihren Anteil von 3.000 złp aus den Gütern ihres Vaters auf seine eigenen eintragen ließ. Mit „?“ bezeichnete Daten sind Schätzungen der Datenbank.

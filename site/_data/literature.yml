  title_en: 'The Golden Book of the Polish Nobility, vol. 13, pp. 219-225: the Miączyński family, Count Stanisław Adam and his descendants'
  cite: Żychliński (1891)
  author: Teodor Żychliński
  published: Złota księga szlachty polskiéj, rocznik XIII, Poznań [1891], pp. 219-225 (the year reckoned from the series, one volume a year from 1879; not read off a title page)
  year: 1891
  language: pl
  english_by: Claude
  scan: ''
  account_en: 'Seven pages of Teodor Żychliński''s genealogy of the Polish nobility, from his account of the Counts Miączyński: Stanisław Miączyński, who married Michalina Prusimska, the heiress of Trąbczyn, in August 1809, and their descendants to 1888. Żychliński gives Stanisław''s service as Prince Józef Poniatowski''s adjutant, with the order of the day of 1809 and the Prince''s letter of 1812; the marriage settlement; how Stanisław, dying in Berlin in 1845, divided the estates among his four sons, Trąbczyn going by sale to Mieczysław, who later sold it to Włodzimierz; the newspaper notices of Michalina (died 1851) and Włodzimierz (died 1879); and Włodzimierz''s nephew Władysław, heir of Trąbczyn. A footnote dates the death of Michalina''s mother, Maryanna Dąmbska, to Padua, 1797. Where the account differs from the edition''s documents and rulings, the notes say so.'
  account_de: 'Sieben Seiten aus Teodor Żychlińskis Genealogie des polnischen Adels, aus seiner Darstellung der Grafen Miączyński: Stanisław Miączyński, der im August 1809 Michalina Prusimska, die Erbin von Trąbczyn, heiratete, und ihre Nachkommen bis 1888. Żychliński gibt Stanisławs Dienst als Adjutant des Fürsten Józef Poniatowski, mit dem Tagesbefehl von 1809 und dem Brief des Fürsten von 1812; den Ehevertrag; wie Stanisław, als er 1845 in Berlin starb, die Güter unter seine vier Söhne teilte, wobei Trąbczyn durch Kauf an Mieczysław ging, der es später an Włodzimierz verkaufte; die Zeitungsnachrufe auf Michalina (gestorben 1851) und Włodzimierz (gestorben 1879); und Włodzimierz'' Neffen Władysław, den Erben von Trąbczyn. Eine Fußnote setzt den Tod von Michalinas Mutter, Maryanna Dąmbska, nach Padua, 1797. Wo die Darstellung von den Dokumenten und Entscheidungen der Edition abweicht, sagen es die Anmerkungen.'
  pages: 7
- slug: guradze1898
  kind: study
  title: Der Bauer in Posen. Beiträge zur Geschichte der rechtlichen und wirthschaftlichen Hebung des Bauernstandes der jetzigen Provinz Posen durch den preußischen Staat von 1772-1805
  title_en: The Peasant in Posen. Contributions to the History of the Legal and Economic Advancement of the Peasant Class in the Present Province of Posen by the Prussian State, 1772-1805
  cite: Guradze (1898)
  author: Franz Guradze
  published: Halle, 1898 (108 pages); also in the Zeitschrift der historischen Gesellschaft für die Provinz Posen
  year: 1898
  language: de
  english_by: Claude
  scan: https://archive.org/details/derbauerinposen00guragoog
  account_en: 'A study, in six chapters, of the Prussian laws on the peasants of the lands that became the province of Posen: what the peasants owed and held in the last years of Polish rule, the legislation for the Netze district from 1772 and for South Prussia from 1793 to 1806, the peasants'' dues and services in both, and the years of the Duchy of Warsaw, 1807 to 1815. Guradze says in his preface that he wrote from the general files of the administration and a selection of the particular ones, tracing how the laws came to be made, and that his judgement differs markedly from that of Professor Knapp of Strasbourg and his students. It is the background to the tenures of the Olęder settlers and the hereditary leases of 1805 and 1806 on the Trąbczyn estate, which it does not name.'
  account_de: 'Eine Untersuchung in sechs Kapiteln über die preußische Gesetzgebung für die Bauern der Gebiete, die zur Provinz Posen wurden: was die Bauern in der letzten Zeit der polnischen Herrschaft schuldeten und besaßen, die Gesetzgebung für den Netzedistrikt seit 1772 und für Südpreußen von 1793 bis 1806, die Abgaben und Dienste der Bauern in beiden und die Zeit des Herzogtums Warschau 1807 bis 1815. Guradze sagt im Vorwort, er habe aus den Generalakten der Verwaltung und einer Auswahl der Spezialakten geschrieben, der Entstehung der Gesetze nachgehend, und sein Urteil weiche wesentlich von dem Professor Knapps in Straßburg und seiner Schüler ab. Sie ist der Hintergrund zu den Besitzrechten der Hauländer und zu den Erbpachtverträgen von 1805 und 1806 auf dem Gut Trąbczyn, das sie nicht nennt.'
  pages: 0
- slug: breyer1935gaue
  kind: study
  title: Deutsche Gaue in Mittelpolen
  title_en: German Districts in Central Poland
  cite: Breyer (1935a)
  author: Albert Breyer
  published: Ostdeutsche Heimathefte, Heft 4, 1935 (ed. Viktor Kauder), and Deutsche Monatshefte in Polen, Jahrgang 1 (11), Heft 10, April 1935; chapters V and VI only, cited by the pages of the digital reissue by Jutta Dennerlein (UpstreamVistula.org, version 1.0, October 2006)
  year: 1935
  language: de
  english_by: Claude
  scan: http://www.UpstreamVistula.org
  account_en: 'Two chapters of Albert Breyer''s survey of the German settlements of central Poland, those on the Konin and Kalisz country; the rest of the survey (the Vistula lowland, Dobrzyń, Kuyavia, Gostynin, Łódź, the Swabians near Warsaw) is not taken in. Chapter V is on the Warthe marshes between Koło, Konin and Uniejów; chapter VI on the sandy, wooded country south of Zagórów and Konin and north of Kalisz. Each gives the landscape, the villages, their founding, where the settlers came from, their schools and their churches. Page 41 names the first contract of the estate''s Olęder colonies: in 1746 Paul Prusiński, owner of Trąbczyn, let the woods south of the estate to "honest Hollanders", and Łazińsk Holland arose. Breyer (1889-1939) is the man whose notebooks of 1936 are holdings of this edition (APP 53/968/0/-/669 and -/716); this is his shorter, earlier account, written for German readers in Poland and in Germany in 1935, and its language is that of its cause. Its facts are to
    be held against the documents.'
  account_de: 'Zwei Kapitel aus Albert Breyers Überblick über die deutschen Siedlungen Mittelpolens, die über das Koniner und das Kalischer Land; der übrige Überblick (Weichselniederung, Dobriner Land, Kujawien, Gostynin, Lodz, die Schwabensiedlungen bei Warschau) ist nicht aufgenommen. Kapitel V handelt vom Warthebruch zwischen Koło, Konin und Uniejów, Kapitel VI von dem sandigen, waldigen Land südlich von Zagórów und Konin und nördlich von Kalisch. Jedes gibt die Landschaft, die Dörfer, ihre Gründung, die Herkunft der Siedler, ihre Schulen und Kirchen. Seite 41 nennt den ersten Vertrag der Hauländerkolonien des Gutes: 1746 überließ Paul Prusiński, Besitzer von Trąbczyn, die Wälder südlich des Gutes „ehrbaren Holländern“, und es entstand Łazińsk Holland. Breyer (1889-1939) ist der Mann, dessen Notizbücher von 1936 Bestände dieser Edition sind (APP 53/968/0/-/669 und -/716); dies ist sein kürzerer, früherer Bericht, 1935 für deutsche Leser in Polen und im Reich geschrieben, und seine Sprache
    ist die seiner Sache. Seine Angaben sind an den Dokumenten zu prüfen.'
  pages: 11
- slug: breyer1935mutterland
  kind: study
  title: Ostdeutschland als Mutterland der deutschen Siedlungen in Mittelpolen
  title_en: Eastern Germany as the Motherland of the German Settlements in Central Poland
  cite: Breyer (1935b)
  author: Albert Breyer
  published: Deutsche Monatshefte in Polen, Jahrgang 2 (12), Heft 1/2, July/August 1935; cited by the pages of the digital reissue by Jutta Dennerlein (UpstreamVistula.org, version 1.0, October 2006)
  year: 1935
  language: de
  english_by: Claude
  scan: http://www.UpstreamVistula.org
  account_en: 'A lecture by Albert Breyer on where the Germans of central Poland came from, drawn from the places of origin written in the Lutheran church books: the farmers of the Vistula lowland, of Dobrzyń, of Kuyavia, of the Kalisz country and of the Łódź area; the townsmen and cloth-makers; the pastors and teachers. Page 8 counts the places of origin in the church books of Zagórów (1843 to 1847), Grodziec, Stawiszyn, Turek and Władysławów: Zagórów is the town of the estate, and Grodziec the place named in the title of Breyer''s notebook of July 1936. Page 9 puts the Germans of the Kalisz country at 54 in a hundred Silesian. Breyer (1889-1939) is the man whose notebooks of 1936 are holdings of this edition (APP 53/968/0/-/669 and -/716). He wrote it for the German minority in Poland in 1935 to show that its people came from the neighbouring Prussian provinces; its closing words speak of the strengths and weaknesses of German "stocks" (Stämme). Its counts are his own and are to be held
    against the church books.'
  account_de: 'Ein Vortrag Albert Breyers über die Herkunft der Deutschen Mittelpolens, nach den in den evangelischen Kirchenbüchern eingetragenen Herkunftsorten: die Bauern der Weichselniederung, des Dobriner Landes, Kujawiens, des Kalischer Landes und des Lodzer Gebiets; die Städter und Tuchmacher; die Pastoren und Lehrer. Seite 8 zählt die Herkunftsorte in den Kirchenbüchern von Zagórów (1843 bis 1847), Grodziec, Stawiszyn, Turek und Władysławów: Zagórów ist die Stadt des Gutes, Grodziec der Ort im Titel von Breyers Notizbuch vom Juli 1936. Seite 9 gibt die Deutschen des Kalischer Landes zu 54 vom Hundert als schlesisch an. Breyer (1889-1939) ist der Mann, dessen Notizbücher von 1936 Bestände dieser Edition sind (APP 53/968/0/-/669 und -/716). Er schrieb ihn 1935 für die deutsche Minderheit in Polen, um zu zeigen, dass ihre Leute aus den benachbarten preußischen Provinzen kamen; seine Schlussworte sprechen von den Stärken und Schwächen der deutschen „Stämme“. Seine Zählungen sind die
    seinen und an den Kirchenbüchern zu prüfen.'
  pages: 14
- slug: breyer1938
  kind: study
  title: Die deutschen ländlichen Siedlungen des mittelpolnischen Warthebruchs
  title_en: The German Rural Settlements of the Warthe Marshes in Central Poland
  cite: Breyer (1938)
  author: Albert Breyer
  published: Deutsche Wissenschaftliche Zeitschrift für Polen, Heft 34, 1938; cited by the pages of the digital reissue by Jutta Dennerlein (UpstreamVistula.org, version 1.0, November 2010)
  year: 1938
  language: de
  english_by: Claude
  scan: http://www.UpstreamVistula.org
  account_en: 'A study of the German villages in the valley of the Warthe between Pyzdry and Uniejów: the landscape and farming, the history of settlement from the Middle Ages (the Cistercians of Ląd) to the 1930s, where the settlers came from, their later migrations, and a table of the villages by the census of 1921. Albert Breyer (1889-1939), a teacher at the German school in Sompolno, is the man whose notebooks of 1936 are holdings of this edition (APP 53/968/0/-/669 and -/716). He wrote from the Lutheran church books, from village papers he saw himself, among them the copy of the settlers'' contract kept in the mayor''s office at Emilienheim, and from what the villagers told him. Pages 21 and 22 are on Hohenlohe''s estates of Zagórów and Trąbczyn: the contract of 1805 by which Triebenfeld let 100 Hufen of forest to eighteen settlers, and the villages that came of it; pages 38 and 39, 42 and 43, and 46 and 47 follow the same villages to 1928. The article was written for a journal of the
    German minority in Poland in 1938, and its language is that of its time and cause: it praises German settlers and laments "de-Germanisation". Its facts are to be held against the documents, and its judgements are Breyer''s.'
  account_de: 'Eine Untersuchung der deutschen Dörfer im Tal der Warthe zwischen Pyzdry und Uniejów: Landschaft und Wirtschaft, die Geschichte der Besiedlung vom Mittelalter (den Zisterziensern von Ląd) bis in die 1930er Jahre, die Herkunft der Siedler, ihre späteren Wanderungen und eine Tabelle der Dörfer nach der Volkszählung von 1921. Albert Breyer (1889-1939), Lehrer an der deutschen Schule in Sompolno, ist der Mann, dessen Notizbücher von 1936 Bestände dieser Edition sind (APP 53/968/0/-/669 und -/716). Er schrieb nach den evangelischen Kirchenbüchern, nach Dorfpapieren, die er selbst sah, darunter die im Schulzenamt zu Emilienheim aufbewahrte Abschrift des Siedlervertrags, und nach dem, was ihm die Dorfbewohner erzählten. Die Seiten 21 und 22 handeln von Hohenlohes Gütern Zagórów und Trąbczyn: dem Vertrag von 1805, mit dem Triebenfeld 100 Hufen Wald an achtzehn Siedler austat, und den Dörfern, die daraus entstanden; die Seiten 38 und 39, 42 und 43 sowie 46 und 47 verfolgen dieselben
    Dörfer bis 1928. Der Aufsatz wurde 1938 für eine Zeitschrift der deutschen Minderheit in Polen geschrieben, und seine Sprache ist die seiner Zeit und seiner Sache: Er lobt die deutschen Siedler und beklagt die „Entdeutschung“. Seine Angaben sind an den Dokumenten zu prüfen, seine Urteile sind die Breyers.'
  pages: 56
- slug: pachonski1982
  kind: reference
  title: Prusimski (Ostroróg-Prusimski) Kazimierz Józef Antoni
  title_en: 'Prusimski (Ostroróg-Prusimski), Kazimierz Józef Antoni: entry in the Polish Biographical Dictionary'
  cite: Pachoński (1982)
  author: Jan Pachoński
  published: Polski Słownik Biograficzny, vol. 27, Wrocław 1982-1983, pp. 582-584 (the editor dates it 1982)
  year: 1982
  language: pl
  english_by: Claude

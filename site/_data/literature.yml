  title: Die evangelisch-augsburgischen Gemeinden der Kalischer Diözese
  title_en: The Evangelical-Augsburg Congregations of the Kalisch Diocese
  cite: Kneifel (1937)
  author: Eduard Kneifel
  author_sort: Kneifel, Eduard
  published: Verlag Günther Wolff, Plauen im Vogtland 1937 (printed by Papierodruk, Posen)
  year: 1937
  language: de
  english_by: Claude
  scan: ''
  note_en: ''
  note_de: ''
  account_en: 'Parish monographs of the evangelical-Augsburg (Lutheran) diocese of Kalisch by the pastor Eduard Kneifel, published 1937 as the first volume of his "Forschungen zur Geschichte der evangelisch-augsburgischen Kirche in Polen" and written while he was a pastor in Łódź. The book treats one parish after another in a fixed scheme - the place''s history, the parish''s founding and its buildings, its pastors and cantors, its church councils, schools and cantorates, societies, converts, the economic facts, a table of the yearly figures, and the list of affiliated localities - drawing on the parish archives, the church papers of the time and the author''s own knowledge of many of the people. It is the fullest single record of the German-evangelical settlement of central Poland before its destruction. Only the parts that bear on the edition''s ground are brought in: the introductory chapter on the diocese (with the school statistics and the succession of superintendents), and the monographs
    of Kalisch (the diocese''s mother parish), Grodziec (which administered Zagórów 1843-1856 and again 1878-1892), Konin with its filial Maślaki, and Zagórów - the parish of the edition''s ground, with the Łazińsk cantorate founded in 1746, the Trąbczyn villages, and the long quarrel with the cantorates that produced the filial of Lissewo-Pyzdry, treated in the book in its own sub-entry.'
  account_de: 'Pfarrmonographien der evangelisch-augsburgischen (lutherischen) Diözese Kalisch von dem Pastor Eduard Kneifel, erschienen 1937 als erster Band seiner "Forschungen zur Geschichte der evangelisch-augsburgischen Kirche in Polen" und geschrieben, während er Pastor in Łódź war. Das Buch behandelt Gemeinde für Gemeinde nach einem festen Schema - die Geschichte des Ortes, die Gründung der Parochie und ihre Baulichkeiten, ihre Pastoren und Kantoren, ihre Kirchenkollegien, Schulen und Kantorate, Vereine, Konvertiten, die wirtschaftlichen Angaben, eine Tabelle der jährlichen Zahlen und die Liste der eingepfarrten Ortschaften - aus den Pfarrarchiven, den Kirchenblättern der Zeit und der eigenen Kenntnis des Verfassers von manchen der Genannten. Es ist die ausführlichste einzelne Aufzeichnung der deutsch-evangelischen Siedlung Mittelpolens vor ihrer Zerstörung. Nur die Teile, die den Boden der Edition berühren, sind aufgenommen: das einleitende Kapitel über die Diözese (mit der Schulstatistik
    und der Folge der Superintendenten) und die Monographien von Kalisch (der Mutterparochie der Diözese), Grodziec (das Zagórów 1843-1856 und wieder 1878-1892 verwaltete), Konin mit seinem Filial Maślaki und Zagórów - die Parochie des Bodens der Edition, mit dem 1746 gegründeten Kantorat Łazińsk, den Trąbczyner Dörfern und dem langen Streit mit den Kantoraten, aus dem das Filial Lissewo-Pyzdry hervorging, das das Buch in seinem eigenen Abschnitt behandelt.'
  pages: 74
- slug: kneifel1964
  kind: history
  title: Geschichte der Evangelisch-Augsburgischen Kirche in Polen
  title_en: History of the Evangelical-Augsburg Church in Poland
  cite: Kneifel (1964)
  author: Eduard Kneifel
  author_sort: Kneifel, Eduard
  published: Selbstverlag des Verfassers, Niedermarschacht über Winsen/Luhe 1964 (printed by Karl Müller, Druckerei und Verlag, Roth bei Nürnberg)
  year: 1964
  language: de
  english_by: Claude
  scan: ''
  note_en: ''
  note_de: ''
  account_en: 'A church history of the Evangelical-Augsburg (Lutheran) Church in Poland by the pastor Eduard Kneifel, born 1896 at Rosterschütz-Władysławów in the Kalisz land, a pastor in Łódź congregations to 1939 and from 1953 at Niedermarschacht on the Elbe. Written after his library and manuscripts were lost in 1945, it tells the church''s story from the Reformation to the collapse of 1939 in sixteen chapters: the Reformation in Poland, the new Protestant settlements of the 17th and 18th centuries, the oppression to 1775 and the toleration won then, the church under Prussian rule, in the Duchy of Warsaw and the Kingdom, the general superintendents Ludwig, von Everth, Manitius and Bursche, the German occupation of 1914-1918, the church in the new Poland, and 1939. It is a self-published work of a German-Lutheran standpoint, rich above all in parish founding stories, school lists and notices of pastors, taken from the parish literature and the author''s own knowledge; the Warsaw consistorial
    archive, its chief source, had burned in 1939. Only the pages that bear on the edition''s ground are brought in: the two colonisation sections (the rural colonisation of central Poland, and the Prussian one of 1793-1806), and the pages that name Trąbczyn, Zagórów, Łazińsk and the parishes and colonies round them - the Łazińsk colony founded 1746 by the Starost ("Paul von Kolno-Prusinski, Grundherr von Trombezyn"), the German schools of the Kalisch land (Władysławów-Rosterschütz 1740, Łazińsk, Orlina), the Grodziec parish contract of 1796, the parishes of the diocese of Kalisch (Zagórów with the filial Lisewo-Pyzdry, Konin with the filial Masłaki), the Zagórów church of 1878-1896 and its pastors to 1945, the brethren''s circles in Łazińsk, and the statistics of 1938.'
  account_de: 'Eine Kirchengeschichte der Evangelisch-Augsburgischen (lutherischen) Kirche in Polen von dem Pastor Eduard Kneifel, geboren 1896 in Rosterschütz-Władysławów im Kalischer Land, Pastor in Lodzer Gemeinden bis 1939 und seit 1953 in Niedermarschacht an der Elbe. Nach dem Verlust seiner Bibliothek und Manuskripte 1945 geschrieben, erzählt sie in sechzehn Kapiteln die Geschichte der Kirche von der Reformation bis zum Zusammenbruch 1939: die Reformation in Polen, die neuen evangelischen Siedlungen des 17. und 18. Jahrhunderts, die Bedrückung bis 1775 und die errungene Religionsfreiheit, die Kirche zur preußischen Zeit, im Herzogtum Warschau und im Königreich, die Generalsuperintendenten Ludwig, von Everth, Manitius und Bursche, die deutsche Besetzung 1914-1918, die Kirche im neuen Polen und das Jahr 1939. Es ist ein im Selbstverlag erschienenes Werk deutsch-lutherischer Sicht, reich vor allem an Gemeindegründungsgeschichten, Schullisten und Pfarrernotizen aus der Gemeindeliteratur
    und der Kenntnis des Verfassers; das Warschauer Konsistorialarchiv, seine wichtigste Quelle, war 1939 verbrannt. Nur die Seiten, die den Boden der Edition berühren, sind aufgenommen: die beiden Kolonisationsabschnitte (die ländliche Kolonisation Mittelpolens und die preußische von 1793-1806) und die Seiten, die Trąbczyn, Zagórów, Łazińsk und die umliegenden Parochien und Kolonien nennen - die 1746 vom Starosten („Paul von Kolno-Prusinski, Grundherr von Trombezyn") gegründete Kolonie Lazinsk, die deutschen Schulen des Kalischer Landes (Władysławów- Rosterschütz 1740, Lazinsk, Orlina), den Grodziecer Kirchspielsvertrag von 1796, die Parochien der Kalischer Diözese (Zagörow mit dem Filial Lissewo-Pyzdry, Konin mit dem Filial Maslaki), die Zagórower Kirche von 1878-1896 und ihre Pastoren bis 1945, die Brüderkreise in Lazinsk und die Statistik von 1938.'
  pages: 21
- slug: ostensacken2001
  kind: history
  title: 'Christiane Fürstin von der Osten-Sacken: Eine frühkapitalistische Unternehmerin und ihre Erben während der Frühindustrialisierung im 18./19. Jahrhundert'
  title_en: 'Christiane, Princess of Osten-Sacken: an early-capitalist businesswoman and her heirs during the early industrialisation of the 18th/19th centuries'
  cite: Kraus (2001)
  author: Gerlinde Kraus
  author_sort: Kraus, Gerlinde
  published: 'Stuttgart: Franz Steiner Verlag, 2001 (Beiträge zur Unternehmensgeschichte, Bd. 10)'
  year: 2001
  language: de
  english_by: Claude
  scan: ''
  note_en: ''
  note_de: ''
  account_en: 'A dissertation by Gerlinde Kraus on Christiane Fürstin von der Osten-Sacken (1747-1811), born Freiin von Dieskau, the heiress of the Hoym estates in Saxony and Silesia, mother of Marianne Gräfin von Hoym, and her heirs during the early industrialisation (Franz Steiner Verlag, Stuttgart 2001, Beiträge zur Unternehmensgeschichte vol. 10). Brought in: chapter III whole - the marriage of 1782 between Marianne Gräfin von Hoym and Friedrich Ludwig Fürst zu Hohenlohe-Ingelfingen, the prince''s military career, his failed economic undertakings in the Hohenlohe heartland, the purchase of the Rittergut Bytkow in Upper Silesia in 1801 and its rescue by his mother-in-law, the separation and divorce of 1799-1801, Marianne''s second marriage to count Friedrich Ludwig von der Osten-Sacken, and the marriage contracts of 1781 and 1787 - and from the book''s appendices Anlage 8, Marianne''s letter of 12 October 1811, "Ein Wort des Vertrauens", giving her own account of the separation, and Anlage
    10, the codicil of 6 November 1807 in which her mother committed herself to pay her daughter''s creditors up to 60,000 thaler Courant. Its bearing on the edition: p. 42 records that the prince, to come by "ready means", sold on "weit unter Wert" - far below their worth - considerable family possessions he had acquired, "wie die Herrschaften Betsche, Zogorowo, Trobczyn, Botkowo und Winiec" - the edition''s Zagórów and Trąbczyn among them, the sale the edition''s wlodzimierz-era documents witness. Anlage 9, which prints between the two appendices brought in, is not brought in, nor the first lines of Anlage 11 (marked with [.]) - the editor''s word of 2026-10-22. The book is in copyright; shown whole on the site at the editor''s word, an exception to the summary-only rule for works under copyright. The English is Claude''s.'
  account_de: 'Eine Dissertation von Gerlinde Kraus über Christiane Fürstin von der Osten-Sacken (1747-1811), geborene Freiin von Dieskau, die Erbin der Hoymschen Güter in Sachsen und Schlesien, Mutter der Marianne Gräfin von Hoym, und ihre Erben während der Frühindustrialisierung (Franz Steiner Verlag, Stuttgart 2001, Beiträge zur Unternehmensgeschichte Bd. 10). Aufgenommen: das Kapitel III als Ganzes - die Ehe von 1782 zwischen Marianne Gräfin von Hoym und Friedrich Ludwig Fürst zu Hohenlohe-Ingelfingen, die militärische Laufbahn des Fürsten, seine gescheiterten wirtschaftlichen Unternehmungen im hohenloheschen Stammland, der Kauf des Rittergutes Bytkow in Oberschlesien 1801 und seine Rettung durch die Schwiegermutter, die Trennung und Scheidung von 1799-1801, Mariannes zweite Ehe mit dem Grafen Friedrich Ludwig von der Osten-Sacken und die Eheverträge von 1781 und 1787 - und aus den Anlagen des Buches die Anlage 8, Mariannes Brief vom 12. Oktober 1811, "Ein Wort des Vertrauens", mit ihrer
    eigenen Darstellung der Trennung, und die Anlage 10, das Kodizill vom 6. November 1807, in dem ihre Mutter sich verpflichtete, die Gläubiger der Tochter bis zur Summe von 60.000 Taler Courant zu befriedigen. Seine Bedeutung für die Edition: S. 42 hält fest, daß der Fürst, um an "baare Mittel" zu gelangen, bedeutende, von ihm erworbene Familienbesitzungen "weit unter Wert" wieder verkaufte, "wie die Herrschaften Betsche, Zogorowo, Trobczyn, Botkowo und Winiec" - das Zagórów und Trąbczyn der Edition darunter, der Verkauf, den die Dokumente der wlodzimierz-Epoche bezeugen. Die Anlage 9, die zwischen den beiden aufgenommenen Anlagen gedruckt ist, wird nicht aufgenommen, ebensowenig die ersten Zeilen der Anlage 11 (mit [.] vermerkt) - Wort des Herausgebers vom 22.10.2026. Das Buch steht unter dem Urheberrecht; es wird auf der Site als Ganzes gezeigt auf das Wort des Herausgebers, eine Ausnahme von der Regel der Zusammenfassung allein für Werke unter dem Urheberrecht. Das Englische ist von
    Claude.'

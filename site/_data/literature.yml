  account_en: Hans-Joachim Seidel's modern biography of Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, written from the papers in the Hohenlohe-Zentralarchiv Neuenstein. It covers his rebuilding of Ingelfingen, his Prussian career, his marriage and his debts, and the South Prussian estates and Triebenfeld's part in them; its appendix 6 transcribes the letter of 7 March 1809 that stands as letters 48 and 302 of Oe 1 Bü 9454. The book is under copyright, and a detailed summary stands in its place.
  account_de: Hans-Joachim Seidels moderne Biographie Friedrich Ludwigs, Fürst zu Hohenlohe-Ingelfingen, geschrieben aus den Akten des Hohenlohe-Zentralarchivs Neuenstein. Sie behandelt den Wiederaufbau von Ingelfingen, die preußische Laufbahn, die Ehe und die Schulden, die südpreußischen Güter und Triebenfelds Rolle darin; ihre Anlage 6 gibt den Brief vom 7. März 1809 wieder, der als Briefe 48 und 302 von Oe 1 Bü 9454 steht. Das Buch ist urheberrechtlich geschützt; an seiner Stelle steht eine ausführliche Zusammenfassung.
  brief_en: Seidel's biography of Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, with the South Prussian estates and Triebenfeld's part in them.

  title_en: A Broken Link. Evangelicals in the Zagórów land
  cite: Słowiński and Połom (2024)
  author: a collective work edited by Mirosław Słowiński and Katarzyna Połom
  author_sort: Słowiński, Mirosław, and Katarzyna Połom (eds.)
  published: 'Zagórów: Urząd Miejski w Zagórowie, 2024 (a collective work edited by Mirosław Słowiński and Katarzyna Połom; book concept and introduction Mirosław Słowiński; scientific consultant Dr Zbigniew Chodyła). ISBN 978-83-969906-0-0'
  year: 2024
  language: pl
  english_by: the editor's files
  scan: ''
  note_en: ''
  note_de: ''
  account_en: A collective volume on the Protestants of the Zagórów land, "the broken link" of the town's three communities, issued by the Municipal Office in Zagórów in 2024 and edited by Mirosław Słowiński and Katarzyna Połom, with Zbigniew Chodyła as scientific consultant. Its studies include a history of the Protestants of the Zagórów land from the Reformation to the present, a study of the Hauländer settlement and the Prussian colonisation of 1746-1806, an account of the cantors and cantorate schools, and Słowiński's first study of the letters found in the wall of the Łazińsk cantor's house. Memoirs follow, and German-era sources printed anew, among them a parish history, the German place names and the list of the inhabitants of Michalinów Trąbczyński, Łazińsk and Huta Trąbczyńska. The volume is under copyright, and a detailed summary stands in its place.
  account_de: Ein Sammelband über die Protestanten des Zagórower Landes, „das zerrissene Glied“ der drei Gemeinschaften der Stadt, 2024 vom Stadtamt Zagórów herausgegeben, bearbeitet von Mirosław Słowiński und Katarzyna Połom, mit Zbigniew Chodyła als wissenschaftlichem Berater. Seine Studien umfassen eine Geschichte der Protestanten des Zagórower Landes von der Reformation bis heute, eine Studie über die Hauländersiedlung und die preußische Kolonisation von 1746-1806, eine Darstellung der Kantoren und Kantoratsschulen und Słowińskis erste Studie über die in der Wand des Kantorhauses von Łazińsk gefundenen Briefe. Es folgen Erinnerungen und neu gedruckte Quellen der deutschen Zeit, darunter eine Gemeindegeschichte, die deutschen Ortsnamen und die Liste der Einwohner von Michalinów Trąbczyński, Łazińsk und Huta Trąbczyńska. Der Band ist urheberrechtlich geschützt; an seiner Stelle steht eine ausführliche Zusammenfassung.
  brief_en: 'The collective volume of 2024 on the Protestants of the Zagórów land: studies, memoirs and German-era sources printed anew.'
  brief_de: 'Der Sammelband von 2024 über die Protestanten des Zagórower Landes: Studien, Erinnerungen und neu gedruckte Quellen der deutschen Zeit.'

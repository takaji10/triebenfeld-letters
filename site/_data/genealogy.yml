  trampczynski:
    biography:
    - text: The Trąmpczyńskis, with the by-name Otto, held Trąbczyn through the sixteenth and seventeenth
        centuries. In 1522 the brothers Wojciech, Mikołaj and Stanisław divided the estate among themselves
        at Trąbczyn, and their heirs held it in shares. In 1589 Albertus (Wojciech) Trąmpczyński sued
        his neighbour Thomas Łukomski over a new pond at Łukom that flooded the woods and meadows of Trąbczyn,
        Nowa Wieś and Osiny.
      source: app53170koningr145-1; app536017-1
      sources_en:
      - text: 53/17/0/-/Konin Gr.145, document 1
        url: /documents/app53170koningr145/1/
      - text: 53/6/0/-/17, document 1
        url: /documents/app536017/1/
    - text: 'In 1636 and 1637 the family endowed the parish church of Trąbczyn. In 1644 the land court
        at Konin condemned by default the brothers Marcin, Wojciech, Władysław and Andrzej and their widowed
        mother Anna, at the suit of Jerzy Chełmski of Łukom, for cutting boundary marks into his pines
        and felling his timber. The brothers Andrzej, Jan and Władysław divided the estate again in 1693,
        and in 1698 Anna Bojanowska, their mother, sold Trąbczyn with her sons to Jan Prusimski of Kolno,
        under a pledge of 90,000 złoty. Members of the family stayed in the neighbourhood: a Stanisław
        Otto-Trąmpczyński sat on the boundary commission of 1775 and 1776.'
      source: adwl85-1; app536036-1; app53170koningr145-1; app53150kaliszgr425-1
      sources_en:
      - text: ADWł 85, document 1

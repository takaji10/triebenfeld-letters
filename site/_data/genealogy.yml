  miaczynski:
    biography:
    - text: Stanisław Miączyński married Michalina Dąbska, born Prusimska, the heiress who had recovered
        Trąbczyn from Prince Hohenlohe-Ingelfingen in 1807. In January 1815, while the Prince sought the
        estate's return through the Tsar, he wrote that he feared the influence "Moscinski" had with the
        Governor-General of the Duchy of Warsaw, Lanskoy, and his agent Triebenfeld reported from Vienna
        that the two were bosom friends, so that there was little good to hope.
      source: oe1bu9454-265b; oe1bu9454-270; iiihamdaiiinr12765-4
      sources_en:
      - text: Oe 1 Bü 9454, document 265b
        url: /documents/oe1bu9454/265b/
      - text: Oe 1 Bü 9454, document 270
        url: /documents/oe1bu9454/270/
      - text: III. HA MdA, III Nr. 12765, document 4
        url: /documents/iiihamdaiiinr12765/4/
    - text: In the lawsuits over the debts the Prince had charged on Trąbczyn, his wife appears as Countess
        Miączyńska; in 1827 the two of them, as plaintiffs before the civil tribunal at Kalisz, had the
        Lichnowski brothers' and the widow Grotowska's mortgages struck from the estate's register.
      source: iiihamdaiiinr12366-4; iiihamdaiiinr12366-5
      sources_en:
      - text: III. HA MdA, III. Nr. 12366, document 4
        url: /documents/iiihamdaiiinr12366/4/
      - text: III. HA MdA, III. Nr. 12366, document 5
        url: /documents/iiihamdaiiinr12366/5/

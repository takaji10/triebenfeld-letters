  stanislaw-chelmski:
    biography:
    - text: Stanisław Ścibor Chełmski, son of Józef Chełmski and Helena Zielonacka, held Łukom, Łomowo,
        Imielno and Bukowo, the estates next to Trąbczyn, and from 1778 at the latest was Treasurer of
        Wschowa. He was at law first with Katarzyna Prusimska, the widow holding Trąbczyn, whose potash
        he stopped near Pyzdry in 1761, and from the Crown Tribunal's decrees of 1766 to 1768 with her
        nephew Antoni Prusimski. In 1768 he bought up the merchant Tracholz's claims against the late
        Paweł Prusimski.
      source: app536045-1; app53150kaliszgr414-1; app536046-2; app53170koningr117-4
      sources_en:
      - text: 53/6/0/-/45, document 1
        url: /documents/app536045/1/
      - text: 53/15/0/-/Kalisz Gr.414, document 1
        url: /documents/app53150kaliszgr414/1/
      - text: 53/6/0/-/46, document 2
        url: /documents/app536046/2/
      - text: 53/17/0/-/Konin Gr.117, document 4
        url: /documents/app53170koningr117/4/
    - text: 'In November 1771 he had the Lusnia wood, with the Olęder settlement Prusimski had founded
        in it, delivered into his possession, and the two sides raided the wood and its tavern for the
        next two years. The parliament''s commission of 1775 went against him: its decree found Prusimski''s
        line the better and condemned him to two weeks in the tower at Konin and 8,000 złoty, for encroachments,
        for burning the inn on the highway and for a shot fired at a nobleman. In 1782 the Crown Tribunal
        fixed the boundary for good and ordered the Lusnia settlers returned to Prusimski.'
      source: app53150kaliszgr414-1; app53170koningr115-7; app53170koningr145-1; app53170koningr153-1
      sources_en:
      - text: 53/15/0/-/Kalisz Gr.414, document 1
        url: /documents/app53150kaliszgr414/1/
      - text: 53/17/0/-/Konin Gr.115, document 7
        url: /documents/app53170koningr115/7/
      - text: 53/17/0/-/Konin Gr.145, document 1
        url: /documents/app53170koningr145/1/
      - text: 53/17/0/-/Konin Gr.153, document 1
        url: /documents/app53170koningr153/1/
    - text: On 16 June 1794, at Łukom, Prusimski gave him a note for 12,000 ducats, with leave to hold
        Trąbczyn until repaid. After Prussia confiscated Prusimski's estates and gave them to Prince Hohenlohe-Ingelfingen,
        Chełmski had to give Trąbczyn up; his suit against the Prussian treasury was dismissed at Kalisz
        in September 1799, and on 21 October 1799 the King refused his petition, since the costs of the
        war far exceeded the whole property of such an insurgent.
      source: ihagrrep7cnr421-6; ihagrrep7cnr421-2; ihagrrep7cnr421-1; ihagrrep7cnr421-3
      sources_en:
      - text: I. HA GR, Rep. 7 C, Nr. 421, document 6
        url: /documents/ihagrrep7cnr421/6/
      - text: I. HA GR, Rep. 7 C, Nr. 421, document 2
        url: /documents/ihagrrep7cnr421/2/
      - text: I. HA GR, Rep. 7 C, Nr. 421, document 1
        url: /documents/ihagrrep7cnr421/1/
      - text: I. HA GR, Rep. 7 C, Nr. 421, document 3
        url: /documents/ihagrrep7cnr421/3/

people:
  prusimski:
    biography:
    - text: Antoni Prusimski of Kolno, son of Stefan Prusimski and Wiktoria Malczewska, inherited Trąbczyn
        from the family of his uncles Antoni and Paweł, who died childless; the castellany court of Poznań
        settled their succession on him in 1784 against the heirs of their sisters. Starost of Niszczewice
        from 1768 and a knight of the Order of St Stanisław, he presented the parish priest of Trąbczyn
        in 1785.
      source: app53170koningr115-2; app53170koningr118-23; app5320pozgr1181-1; adwl85-1
      sources_en:
      - text: 53/17/0/-/Konin Gr.115, document 2
        url: /documents/app53170koningr115/2/
      - text: 53/17/0/-/Konin Gr.118, document 23
        url: /documents/app53170koningr118/23/
      - text: 53/20/0/-/Poznań Gr.1181, document 1
        url: /documents/app5320pozgr1181/1/
      - text: ADWł 85, document 1
        url: /documents/adwl85/1/
    - text: 'For twenty years he fought his neighbour Stanisław Chełmski of Łukom over their boundary:
        over the embankment that flooded the Trąbczyn Olęder settlers in 1767, the Lusnia wood handed
        to Chełmski in 1771, and felled timber. The commission appointed by the Polish parliament found
        his line the better in 1775 and condemned Chełmski to the tower at Konin, and in 1782 the Crown
        Tribunal fixed the boundary for good, with 41 mounds raised along it.'
      source: app53170koningr114-1; app53150kaliszgr414-1; app53170koningr145-1; app53170koningr153-1
      sources_en:
      - text: 53/17/0/-/Konin Gr.114, document 1
        url: /documents/app53170koningr114/1/
      - text: 53/15/0/-/Kalisz Gr.414, document 1
        url: /documents/app53150kaliszgr414/1/
      - text: 53/17/0/-/Konin Gr.145, document 1
        url: /documents/app53170koningr145/1/
      - text: 53/17/0/-/Konin Gr.153, document 1
        url: /documents/app53170koningr153/1/
    - text: In June 1794 he borrowed 12,000 ducats from Chełmski, who was to hold Trąbczyn until repaid.
        That August, by the Prussian charge, he went to his estate of Smiłowice in Kuyavia, where the
        Kuyavian insurrection was concluded with him on 21 August. He fled; Prussia confiscated his estates
        and in 1796 gave them to Prince Hohenlohe-Ingelfingen. In December 1796 he was at Venice, ill
        and grieving for his wife.
      source: ihagrrep7cnr421-6; ihagrrep7cnr3132-5; ihagrrep7cnr3570-1; ihagrrep7cnr1414-2
      sources_en:
      - text: I. HA GR, Rep. 7 C, Nr. 421, document 6
        url: /documents/ihagrrep7cnr421/6/
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 5
        url: /documents/ihagrrep7cnr3132/5/
      - text: I. HA GR, Rep. 7 C, Nr. 3570, document 1
        url: /documents/ihagrrep7cnr3570/1/
      - text: I. HA GR, Rep. 7 C, Nr. 1414, document 2
        url: /documents/ihagrrep7cnr1414/2/
    - text: On 27 January 1803 he and the canon Xaver Jezierski petitioned the King from Dresden for leave
        to return, and on 10 May 1803 the King granted it, the confiscation standing. He died abroad later
        that year. In 1807 the Duchy of Warsaw returned his estates to his daughter Michalina.
      source: ihagrrep7cnr3132-7; ihagrrep7cnr3132-6; iiihamdaiiinr12366-2; agad1174016-2
      sources_en:
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 7
        url: /documents/ihagrrep7cnr3132/7/
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 6
        url: /documents/ihagrrep7cnr3132/6/

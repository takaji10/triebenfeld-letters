  jan-otto-trampczynski-elder:
    standalone: true
    heading: Jan Otto-Trąmpczyński (the elder)
    heading_de: Jan Otto-Trąmpczyński (der Ältere)
    life: d. before 1584
    life_de: gest. vor 1584
    bio: Jan Otto-Trąmpczyński, co-heir of Trąbczyn in the sixteenth century and brother of Wojciech.
      He was dead by October 1584, when Wojciech, their uncle, held his sons in guardianship and shared
      the estate with them. In 1591 the sons, come of age, had Trąbczyn divided with Wojciech to have
      the part that had come to them from their father, and in 1596 his widow Szczęsna of Popowo settled
      the division of that part with three of them.
    bio_de: Jan Otto-Trąmpczyński, Miterbe von Trąbczyn im 16. Jahrhundert und Bruder Wojciechs. Er war
      im Oktober 1584 tot, als Wojciech als ihr Onkel seine Söhne in Vormundschaft hielt und das Gut mit
      ihnen teilte. 1591 ließen die Söhne, volljährig geworden, Trąbczyn mit Wojciech teilen, um den Teil
      zu erhalten, der ihnen von ihrem Vater zugefallen war, und 1596 regelte seine Witwe Szczęsna aus
      Popowo die Teilung dieses Teils mit dreien von ihnen.
    marriages:
    - name: Szczęsna née Popowska (Szczęsna z Popowa)
      note: his widow by 1596, when she settled with her sons Rachwał, Walenty and Stanisław the division

  stanislaw-otto-trampczynski:
    standalone: true
    heading: Stanisław Otto-Trąmpczyński
    heading_de: Stanisław Otto-Trąmpczyński
    life: d. 1642–1644
    life_de: gest. 1642–1644
    died: between 1642 and 21 May 1644
    died_source: tekidworzaczka/c02; app53170koningr145-1
    bio: 'Stanisław Otto-Trąmpczyński, son of Wojciech, heir of Trąbczyn in the first half of the seventeenth
      century. In 1614, before his wedding to Anna Słonecka, he undertook to secure her dowry on half
      his estates, and in 1616 he was one of several heirs of Trąbczyn of the family. In 1642, his wife
      consenting, he made over the villages of Trąbczyn, Nowa Wieś, Łazy and Osiny to Maciej Debrzyński
      for 20,000 złoty, most likely as a sale he could redeem: Debrzyński stood beside the family as a
      possessor of the estate in 1644, and his son Władysław held it in 1663. He was dead by May 1644,
      when his widow and their four sons went to law with the heirs of Biskupice over boundary mounds
      and marked trees on the Trąbczyn ground, and were themselves cited by Jerzy Chełmski of Łukom.'
    bio_de: 'Stanisław Otto-Trąmpczyński, Sohn Wojciechs, Erbe von Trąbczyn in der ersten Hälfte des 17.
      Jahrhunderts. 1614, vor seiner Hochzeit mit Anna Słonecka, verpflichtete er sich, ihr die Mitgift
      auf der Hälfte seiner Güter zu sichern, und 1616 war er einer von mehreren Erben von Trąbczyn aus
      der Familie. 1642 übertrug er mit Zustimmung seiner Frau die Dörfer Trąbczyn, Nowa Wieś, Łazy und
      Osiny für 20.000 Złoty an Maciej Debrzyński, sehr wahrscheinlich als Verkauf auf Wiederkauf: Debrzyński
      stand 1644 als Besitzer des Guts neben der Familie, und sein Sohn Władysław hatte es 1663 inne.
      Im Mai 1644 war er tot, als seine Witwe und ihre vier Söhne gegen die Erben von Biskupice wegen
      Grenzhügeln und angeschlagener Bäume auf dem Grund von Trąbczyn vor Gericht gingen und selbst von
      Jerzy Chełmski aus Łukom geladen wurden.'

  wladyslaw-otto-trampczynski:
    standalone: true
    heading: Władysław Otto-Trąmpczyński
    heading_de: Władysław Otto-Trąmpczyński
    life: d. 1663–1671
    life_de: gest. 1663–1671
    died: between 1663 and 1671
    died_source: tekidworzaczka/c03; tekidworzaczka/c06
    bio: Władysław Otto-Trąmpczyński, son of Stanisław and Anna of Słończyce, heir of Trąbczyn after his
      father. With his mother and his brothers Marcin, Wojciech and Andrzej he was cited in 1644 by Jerzy
      Chełmski of Łukom for cutting boundary marks into the trees of the Łukom forest and felling its
      timber, and condemned by default. By 1663 he held Trąbczyn, Łazy and Osiny and the mill of Drzazgi,
      and recorded on half of them the dowry of his wife Anna Bojanowska, 15,000 złoty. He was dead by
      1671, when his widow made a settlement with her second husband, Jan Goliński; in 1693 his three
      sons divided the estate among themselves.
    bio_de: Władysław Otto-Trąmpczyński, Sohn Stanisławs und Annas aus Słończyce, Erbe von Trąbczyn nach
      seinem Vater. Mit seiner Mutter und seinen Brüdern Marcin, Wojciech und Andrzej wurde er 1644 von
      Jerzy Chełmski aus Łukom geladen, weil sie Grenzzeichen in die Bäume des Waldes von Łukom geschlagen
      und sein Holz gefällt hatten, und in Abwesenheit verurteilt. 1663 besaß er Trąbczyn, Łazy und Osiny
      und die Mühle Drzazgi und sicherte auf der Hälfte davon die Mitgift seiner Frau Anna Bojanowska,
      15.000 Złoty. 1671 war er tot, als seine Witwe mit ihrem zweiten Mann, Jan Goliński, einen Vertrag
      schloss; 1693 teilten seine drei Söhne das Gut unter sich.
    parents:

  jan-prusimski-kolno:
    standalone: true
    heading: Jan na Kolno Prusimski
    heading_de: Jan na Kolno Prusimski
    life: documented 1673–1698
    life_de: belegt 1673–1698
    bio: 'Jan na Kolno Prusimski, of the Prusimski family of Kolno and Kamionna in the district of Poznań,
      who bought Trąbczyn from the Trąmpczyńskis in 1698 and so brought it to the family that held it
      until Antoni Prusimski''s flight in 1794. He was very probably the "Johann von Prusimski" whose
      inscription of 1673 charged the market town of Kolno with 1,500 złoty for the parish church of Kamionna,
      a charge the Prussian mortgage register still carried in 1801; the same year he gave a quittance
      for the rest of his wife Teresa Gajewska''s dowry. In 1676 Wierzbno and Brzezno were made over to
      him. His daughter Teresa married Jan Trąmpczyński in 1692, and in 1698 he bought Trąbczyn from his
      son-in-law, the son-in-law''s brother Andrzej and their mother. His sons Sebastian, Krzysztof and
      Ludwik divided his estates in 1700 and 1708: Trąbczyn fell to Sebastian, who in 1720 sold it, with
      Kamionna and Kolno, to Krzysztof, the grandfather of the Starost Antoni.'
    bio_de: 'Jan na Kolno Prusimski, aus der Familie Prusimski auf Kolno und Kamionna im Kreis Posen,
      der Trąbczyn 1698 von den Trąmpczyńskis kaufte und es so an die Familie brachte, der es bis zur
      Flucht Antoni Prusimskis 1794 gehörte. Sehr wahrscheinlich war er der „Johann von Prusimski“, dessen
      Inskription von 1673 den Marktflecken Kolno mit 1.500 Złoty für die Pfarrkirche von Kamionna belastete,
      eine Last, die das preußische Hypothekenbuch noch 1801 führte; im selben Jahr quittierte er den
      Rest der Mitgift seiner Frau Teresa Gajewska. 1676 wurden ihm Wierzbno und Brzezno übertragen. Seine
      Tochter Teresa heiratete 1692 Jan Trąmpczyński, und 1698 kaufte er Trąbczyn von seinem Schwiegersohn,
      dessen Bruder Andrzej und ihrer Mutter. Seine Söhne Sebastian, Krzysztof und Ludwik teilten seine
      Güter 1700 und 1708: Trąbczyn fiel an Sebastian, der es 1720 mit Kamionna und Kolno an Krzysztof
      verkaufte, den Großvater des Starosten Antoni.'

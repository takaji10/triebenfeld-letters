      Rocznik 13 (den Miączyński-Stammbaum), den Eheeintrag von Warschau von 1810 und ein Regest der Aufzeichnung
      des Stadtrechts von Posen über die Teilung der Prusimski-Güter vom 29. März 1784 – die Bestätigung
      des Gerichts der Teilung von 1740 unter Krzysztof Prusimskis Söhnen, durch die das ganze väterliche
      Vermögen Antoni als dem einzigen Nachfolger seiner verstorbenen Oheime Paweł und Antoni gegeben
      wurde. Die ganze Seite, diese eingeschlossen, liegt im Ordner des Werks; nichts davon wird hier

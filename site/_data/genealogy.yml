        url: /de/literatur/minakowska2026zielonacka/#p-c02
    notes: 'The page''s Notes name two sources: Boniecki''s Herbarz polski (t. II, s. 364, the article
      Chełmscy h. Ostoja, where her marriage to Józef is recorded – the branch that concerns it is in
      Boniecki (1900)), and a regest of the Konin municipal court''s record of 1727 (Teki Dworzaczka,
      nr 13049, Nr. 76): Józef, "heir of the estates of Łukom and Łomowo", having received 3,000 złp from
      Kazimierz Zielonacki for Helena, daughter of the late Andr Zielonacki by Joanna Kowalska, now his
      wife, his ward as well, recorded the sum on his own estates against her portion from her father''s
      (fol. 196 verso). The whole page, these included, is kept in the work''s folder; none of it is shown
      here.'
    notes_de: 'Die Notes der Seite nennen zwei Quellen: Bonieckis Herbarz polski (T. II, S. 364, den Artikel
      Chełmscy h. Ostoja, wo ihre Ehe mit Józef steht – den Zweig, den sie betrifft, gibt Boniecki (1900)),
      und ein Regest der Aufzeichnung des Stadtrechts von Konin von 1727 (Teki Dworzaczka, nr 13049, Nr.
      76): Józef, "Erbherr der Güter Łukom und Łomowo", der 3.000 złp von Kazimierz Zielonacki für Helena
      empfangen hatte, die Tochter des verstorbenen Andrzej Zielonacki und der Joanna Kowalska, jetzt
      seine Frau, zugleich seine Mündel, trug die Summe auf seinen eigenen Gütern gegen ihre Portion aus
      den Gütern ihres Vaters ein (fol. 196 verso). Die ganze Seite, diese eingeschlossen, liegt im Ordner
      des Werks; nichts davon wird hier gezeigt.'

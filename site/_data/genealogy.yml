  helena-zielonacka:
    standalone: true
    heading: Helena Zielonacka
    heading_de: Helena Zielonacka
    bio: 'Helena Zielonacka, daughter of Andrzej Zielonacki and Joanna née Wierusz-Kowalska, and the wife
      of Józef Ścibor-Chełmski of Chełm and Wola, arms Ostoja, heir of Łukomia and Łomowo – the Józef
      whom the decree of 1728 names with his brother Franciszek, and whom Boniecki''s article records
      as her husband. Through her the database''s page carries the Chełmski line: the canon Heliodor and
      Stanisław, Treasurer of Wschowa, the brothers of the boundary decree of 1775, and Tomasz''s line
      to the Stanisław of 1795-1867 and the Stanisław Józef of 1807-1877. The database gives her no certain
      dates – "born possibly in 1700" is its estimate, and none is shown here; the record of 1727 has
      her already married.'
    bio_de: 'Helena Zielonacka, Tochter des Andrzej Zielonacki und der Joanna geb. Wierusz-Kowalska, und
      die Frau des Józef Ścibor-Chełmski von Chełm und Wola, Wappen Ostoja, Erbe von Łukomia und Łomowo
      – der Józef, den das Dekret von 1728 neben seinem Bruder Franciszek nennt, und den Bonieckis Artikel
      als ihren Mann verzeichnet. Durch sie trägt die Seite der Datenbank die Linie der Chełmski: den
      Domherrn Heliodor und Stanisław, Schatzmeister von Wschowa, die Brüder des Grenzdrechts von 1775,
      und die Linie des Tomasz zu dem Stanisław von 1795-1867 und dem Stanisław Józef von 1807-1877. Die
      Datenbank gibt ihr keine sicheren Daten – "vielleicht 1700 geboren" ist ihre Schätzung, und keines
      wird hier gezeigt; die Aufzeichnung von 1727 hat sie bereits verheiratet.'

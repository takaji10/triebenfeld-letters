        url: /documents/app53170koningr118/23/
      sources_de:
      - text: 53/17/0/-/Konin Gr.118, Dokument 23
        url: /documents/app53170koningr118/23/
    - name: Wiktoria
      note: married first a Wysocki, then a Tworowicz, and an Odechowski
      source: app53170koningr118-23
      sources_en:
      - text: 53/17/0/-/Konin Gr.118, document 23
        url: /documents/app53170koningr118/23/
      sources_de:
      - text: 53/17/0/-/Konin Gr.118, Dokument 23
        url: /documents/app53170koningr118/23/
    - name: Konstancja
      note: married Jan Kowalski
      source: app53170koningr118-23
      sources_en:
      - text: 53/17/0/-/Konin Gr.118, document 23
        url: /documents/app53170koningr118/23/
      sources_de:
      - text: 53/17/0/-/Konin Gr.118, Dokument 23
        url: /documents/app53170koningr118/23/
  prusimska-katarzyna:
    died: between 1763 and January 1768
    died_source: app536045-1; app53170koningr115-1
    biography:
    - text: Katarzyna, daughter of Karol Rozdrażewski, married Paweł Prusimski, the King's chamberlain,
        who in 1745 charged 40,000 złoty on his estates for her. In 1746 the two of them granted the Olęder
        settlers of the Trąbczyn estate the privilege that governed their relations with the manor for
        over a century.
      source: app5320pozgr1181-1; app539680783-1
      sources_en:
      - text: 53/20/0/-/Poznań Gr.1181, document 1
        url: /documents/app5320pozgr1181/1/
      - text: 53/968/0/-/783, document 1
        url: /documents/app539680783/1/
    - text: 'Her husband died in 1754 and left her Trąbczyn for life. On 9 July 1754 she had the court
        messenger Szepczyński inspect the estate building by building: the old manor house past repair
        and a new one in frame, the barns, distillery and malthouse, fifteen Olęder settlers at Nowa Wieś,
        and the better pines and oaks already felled. For his funeral that December she had Masses said
        at the monasteries of Pyzdry, Konin and Kaźmierz, as the parish church was too small.'
      source: app53170koningr136-1
      sources_en:
      - text: 53/17/0/-/Konin Gr.136, document 1
        url: /documents/app53170koningr136/1/
    - text: In 1761 her neighbour Stanisław Chełmski of Łukom stopped near Pyzdry the potash her burners
        were sending towards Gdańsk and had it sequestered; her men took it back. In 1763 the land court
        at Konin suspended the cross- suits between them until the boundary between Trąbczyn and Łukom
        was fixed. She enlarged the parish church of Trąbczyn, and her heirs were the Bogdańskis of Grab.
      source: app536045-1; adwl85-1; app53170koningr118-14
      sources_en:
      - text: 53/6/0/-/45, document 1
        url: /documents/app536045/1/
      - text: ADWł 85, document 1
        url: /documents/adwl85/1/
      - text: 53/17/0/-/Konin Gr.118, document 14
        url: /documents/app53170koningr118/14/
    died_sources_en:
    - text: 53/6/0/-/45, document 1
      url: /documents/app536045/1/
    - text: 53/17/0/-/Konin Gr.115, document 1
      url: /documents/app53170koningr115/1/
    died_sources_de:
    - text: 53/6/0/-/45, Dokument 1
      url: /documents/app536045/1/
    - text: 53/17/0/-/Konin Gr.115, Dokument 1
      url: /documents/app53170koningr115/1/
  prusimski-pawel:
    died: shortly before 9 July 1754
    died_source: app53170koningr136-1
    biography:
    - text: Paweł was a son of Krzysztof Prusimski. At the division of their parents' estates among the
        brothers Antoni, Paweł and Stefan at Poznań in 1740 he received Oporowo among other lands; he
        settled the Radoliński family's claim on Trąbczyn in 1744, and as the King's chamberlain held
        Trąbczyn, where in 1746, with his wife Katarzyna, born Rozdrażewska, he founded the estate's first
        Olęder settlement and granted its settlers their privilege.
      source: app5320pozgr1181-1; app539680783-1
      sources_en:
      - text: 53/20/0/-/Poznań Gr.1181, document 1
        url: /documents/app5320pozgr1181/1/
      - text: 53/968/0/-/783, document 1
        url: /documents/app539680783/1/
    - text: His contract of 1744 with Jan Tracholz for oak timber from the Trąbczyn forest later became
        one of Stanisław Chełmski's claims against the estate. He died childless shortly before July 1754,
        leaving his widow the estate for life, and was buried at Trąbczyn on 5 December 1754; his nephew
        Antoni, later Starost of Niszczewice, gave the funeral oration. In 1784 the castellany court of
        Poznań settled his and his brother Antoni's succession on that nephew.
      source: app53170koningr117-3; app53170koningr136-1; app5320pozgr1181-1
      sources_en:
      - text: 53/17/0/-/Konin Gr.117, document 3
        url: /documents/app53170koningr117/3/
      - text: 53/17/0/-/Konin Gr.136, document 1
        url: /documents/app53170koningr136/1/
      - text: 53/20/0/-/Poznań Gr.1181, document 1
        url: /documents/app5320pozgr1181/1/
    died_sources_en:
    - text: 53/17/0/-/Konin Gr.136, document 1
      url: /documents/app53170koningr136/1/
    died_sources_de:
    - text: 53/17/0/-/Konin Gr.136, Dokument 1
      url: /documents/app53170koningr136/1/
  koeckritz:
    biography:
    - text: Karl Leopold von Köckritz, then a colonel and the King's adjutant, was Prince Hohenlohe-Ingelfingen's
        friend at court. When Friedrich Wilhelm III refused the Prince's exchange of his Polish estates
        for the domain of Krotoszyn in December 1798, the Prince asked him to support his justification
        before the King, and Köckritz laid Triebenfeld's memorial before the King and assured him the
        exchange was as good as concluded.
      source: oe1bu9454-87; oe1bu9454-93; oe1bu9454-95
      sources_en:
      - text: Oe 1 Bü 9454, document 87
        url: /documents/oe1bu9454/87/
      - text: Oe 1 Bü 9454, document 93
        url: /documents/oe1bu9454/93/
      - text: Oe 1 Bü 9454, document 95
        url: /documents/oe1bu9454/95/
    - text: In January 1805, by then a general, he obtained for Peter Friedrich von Triebenfeld, the Prince's
        agent, the promise of a loan of 150,000 Reichsthaler from the Invalids' Fund, the first 50,000
        on mortgage and the rest after the estates had been valued again. In 1810 he told the creditor
        van der Lahr to be quiet and asked the Fund for patience over the interest owed to it.
      source: oe1bu9454-157; oe1bu9454-158; iharep162nr295-1; oe1bu9454-197
      sources_en:
      - text: Oe 1 Bü 9454, document 157
        url: /documents/oe1bu9454/157/
      - text: Oe 1 Bü 9454, document 158
        url: /documents/oe1bu9454/158/
      - text: I. HA Rep. 162, Nr. 295, document 1
        url: /documents/iharep162nr295/1/
      - text: Oe 1 Bü 9454, document 197
        url: /documents/oe1bu9454/197/
  hoym:
    biography:
    - text: 'Karl Georg Heinrich Count von Hoym, Prussian minister for Silesia and for South Prussia,
        wrote to Prince Hohenlohe-Ingelfingen from Wrocław on 30 July 1796 that the King had given him
        the estates confiscated from "the chief insurgent von Prusimski": Kamionna, Kolno, Trąbczyn and
        the villages near Konin, and Brzyce. He reckoned they yielded at least 4,000 thalers a year and
        recommended a councillor to value them.'
      source: oe1bu14525-39; ihagrrep7cnr3570-1
      sources_en:
      - text: Oe 1 Bü 14525, document 39
        url: /documents/oe1bu14525/39/
      - text: I. HA GR, Rep. 7 C, Nr. 3570, document 1
        url: /documents/ihagrrep7cnr3570/1/
    - text: When the Prince complained in 1797 that the handing over of the estates had been a mere ceremony,
        Hoym ordered the Chambers at Poznań and Piotrków to examine the claims of those still holding
        them on pledge or lease and to hand the estates to the Prince's agents. In 1798 he favoured the
        Prince's proposed exchange of the estates for Krotoszyn, and in 1799 he quietly had the papers
        on the confiscation of Brzyce set aside, so that Antoni Prusimski's daughter might receive something.
      source: oe1bu14525-41; oe1bu14525-40; oe1bu9454-79; oe1bu9454-102
      sources_en:
      - text: Oe 1 Bü 14525, document 41
        url: /documents/oe1bu14525/41/
      - text: Oe 1 Bü 14525, document 40
        url: /documents/oe1bu14525/40/
      - text: Oe 1 Bü 9454, document 79
        url: /documents/oe1bu9454/79/
      - text: Oe 1 Bü 9454, document 102
        url: /documents/oe1bu9454/102/
  voss:
    biography:
    - text: Otto Karl Friedrich von Voss, Prussian minister responsible for South Prussia, was charged
        by the King in October 1798 to report on Prince Hohenlohe-Ingelfingen's proposed exchange of his
        Polish estates for the domain of Krotoszyn. His report, that Krotoszyn alone could yield 49,043
        Reichsthaler and the state would lose 17,400 a year, led the King to refuse on 4 December 1798.
        The Prince answered that Voss had relied on his commissioners without inquiry on the spot, and
        that Krotoszyn paid only 30,100 Reichsthaler in rent.
      source: oe1bu9454-84; oe1bu9454-85; oe1bu9454-86; oe1bu9454-88
      sources_en:
      - text: Oe 1 Bü 9454, document 84
        url: /documents/oe1bu9454/84/
      - text: Oe 1 Bü 9454, document 85
        url: /documents/oe1bu9454/85/
      - text: Oe 1 Bü 9454, document 86
        url: /documents/oe1bu9454/86/
      - text: Oe 1 Bü 9454, document 88
        url: /documents/oe1bu9454/88/
    - text: In 1803 he countersigned the order that gave Antoni Prusimski and Xaver Jezierski leave to
        return to South Prussia. In 1805 he forbade any new valuation of the Prince's estates and had
        the division of Trąbczyn among settlers stopped; the Chamber's commission confirmed Triebenfeld's
        evidence that summer and withdrew the stop.
      source: ihagrrep7cnr3132-8; oe1bu9454-169; oe1bu9454-166
      sources_en:
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 8
        url: /documents/ihagrrep7cnr3132/8/
      - text: Oe 1 Bü 9454, document 169
        url: /documents/oe1bu9454/169/
      - text: Oe 1 Bü 9454, document 166
        url: /documents/oe1bu9454/166/
  hardenberg:
    biography:
    - text: 'In May 1814, at Paris, Peter Friedrich von Triebenfeld handed the Prussian State Chancellor,
        Karl August von Hardenberg, Prince Hohenlohe- Ingelfingen''s letter to Tsar Alexander about Trąbczyn
        and Kamionna, the estates the Duchy of Warsaw had taken from the Prince in 1807. Hardenberg held
        the letter back: the claims, he wrote, could only be raised once the affairs of the Duchy of Warsaw
        were settled.'
      source: iiihamdaiiinr12765-1
      sources_en:
      - text: III. HA MdA, III Nr. 12765, document 1
        url: /documents/iiihamdaiiinr12765/1/
    - text: At the Congress of Vienna Triebenfeld petitioned him in October 1814 for an advance of 112,000
        Reichsthaler to free the Prince's entailed Silesian estates from the executor Cosmar, and in March
        1815 for the return of Trąbczyn or compensation for it. Hardenberg answered that the claims would
        settle themselves with the general agreement on the Duchy of Warsaw, and in June 1815 asked Zerboni,
        chief president at Poznań, to report on the two estates.
      source: oe1bu9454-245; iiihamdaiiinr12765-2; oe1bu9454-252; iiihamdaiiinr12765-6
      sources_en:
      - text: Oe 1 Bü 9454, document 245
        url: /documents/oe1bu9454/245/
      - text: III. HA MdA, III Nr. 12765, document 2
        url: /documents/iiihamdaiiinr12765/2/
      - text: Oe 1 Bü 9454, document 252
        url: /documents/oe1bu9454/252/
      - text: III. HA MdA, III Nr. 12765, document 6
        url: /documents/iiihamdaiiinr12765/6/
    - text: In April 1816 he told the Prince that he had instructed the Prussian envoy at St Petersburg,
        Schöler, to put the request for compensation to the Tsar, while the ministry told Schöler to raise
        it only in general terms, as a matter of grace. Russia refused, and the Prince was sent the Russian
        note in December 1816.
      source: iiihamdaiiinr12765-12; iiihamdaiiinr12765-13; iiihamdaiiinr12765-21
      sources_en:
      - text: III. HA MdA, III Nr. 12765, document 12
        url: /documents/iiihamdaiiinr12765/12/
      - text: III. HA MdA, III Nr. 12765, document 13
        url: /documents/iiihamdaiiinr12765/13/
      - text: III. HA MdA, III Nr. 12765, document 21
        url: /documents/iiihamdaiiinr12765/21/
  hawich:
    biography:
    - text: Hawich, of Pyzdry, was justiciary of the patrimonial court of Prince Hohenlohe-Ingelfingen's
        Zagórów estates. On 5 October 1807 he reported to the Prince that, on the order of the Governing
        Commission of the Duchy of Warsaw, the appellate judge Lipski had taken the Trąbczyn estates and
        handed them to Canon Jezierski, agent of Michalina Dąbska, born Prusimska; he had lodged a protest.
      source: oe1bu9454-28
      sources_en:
      - text: Oe 1 Bü 9454, document 28
        url: /documents/oe1bu9454/28/
    - text: 'On 7 March 1809 the Prince''s agent, Triebenfeld, gave him and the chief inspector Hecker
        thirteen powers of attorney for the Prince''s lawsuits in the Duchy: against Dąbska''s claim to
        Trąbczyn and the sequestration of the estates, against the bankers Oppenheim and Wolff, and against
        the administrator Honrichs. Within weeks Triebenfeld suspected him of keeping back original papers;
        in 1810 Hawich, Honrichs and Hecker accused one another of fraud and were found to have taken
        Hufen of the estates for themselves, and in 1811 Hawich and Hecker were to be dismissed.'
      source: oe1bu9454-48; oe1bu9454-51; oe1bu9454-67; oe1bu9454-215
      sources_en:
      - text: Oe 1 Bü 9454, document 48
        url: /documents/oe1bu9454/48/
      - text: Oe 1 Bü 9454, document 51
        url: /documents/oe1bu9454/51/
      - text: Oe 1 Bü 9454, document 67
        url: /documents/oe1bu9454/67/
      - text: Oe 1 Bü 9454, document 215
        url: /documents/oe1bu9454/215/
  honrichs:
    biography:
    - text: Martin Honrichs and Valentin von Kwasieborski agreed at Kalisz on 21 April 1803 to buy the
        noble estate of Witów from Prince Hohenlohe-Ingelfingen for 16,000 Reichsthaler in three instalments.
        Honrichs did not pay, and in March 1805 the Prince's agent, Triebenfeld, undertook to sell Witów
        to Franz Meierowitz as soon as the sale to Honrichs was cancelled. In 1806 Honrichs leased the
        demesne farm of Trąbczyn for 3,000 Reichsthaler a year.
      source: oe1bu14526-2; oe1bu14526-21; oe1bu9454-179a
      sources_en:
      - text: Oe 1 Bü 14526, document 2
        url: /documents/oe1bu14526/2/
      - text: Oe 1 Bü 14526, document 21
        url: /documents/oe1bu14526/21/
      - text: Oe 1 Bü 9454, document 179a
        url: /documents/oe1bu9454/179a/
    - text: After 1807 the Prince gave him a general power of attorney, and he acted as sequestrator of
        the Zagórów estates. Triebenfeld complained in 1808 that he had answered none of 21 letters and
        sent neither money nor account, and in 1809 instructed the Prince's lawyers to remove him and
        annul his sales of land. Honrichs was arrested in 1809 on a denunciation that its authors retracted,
        and again in 1810 on the order of the prefect Garczyński, owing more than 10,000 Reichsthaler.
      source: oe1bu9454-31; oe1bu9454-34; oe1bu9454-48; oe1bu9454-63; oe1bu9454-193
      sources_en:
      - text: Oe 1 Bü 9454, document 31
        url: /documents/oe1bu9454/31/
      - text: Oe 1 Bü 9454, document 34
        url: /documents/oe1bu9454/34/
      - text: Oe 1 Bü 9454, document 48
        url: /documents/oe1bu9454/48/
      - text: Oe 1 Bü 9454, document 63
        url: /documents/oe1bu9454/63/
      - text: Oe 1 Bü 9454, document 193
        url: /documents/oe1bu9454/193/
    - text: 'Even so, Triebenfeld used him in the suit to recover Trąbczyn: in February 1810 Honrichs
        took the original deeds of gift to the hearing before the justice of the peace at Konin, and in
        September 1810 he and Hecker reported the case''s hearing at Kalisz. In 1811 the land he, Hawich
        and Hecker had taken for themselves was to be returned and settled with colonists.'
      source: oe1bu9454-68; oe1bu9454-69; oe1bu9454-207; oe1bu9454-215
      sources_en:
      - text: Oe 1 Bü 9454, document 68
        url: /documents/oe1bu9454/68/
      - text: Oe 1 Bü 9454, document 69
        url: /documents/oe1bu9454/69/
      - text: Oe 1 Bü 9454, document 207
        url: /documents/oe1bu9454/207/
      - text: Oe 1 Bü 9454, document 215
        url: /documents/oe1bu9454/215/
  zerboni:
    biography:
    - text: Joseph Zerboni di Sposetti, a Prussian official in South Prussia, had a claim charged on the
        Trąbczyn estate of Prince Hohenlohe-Ingelfingen, and in 1813 was also in arrears with what he
        owed the Prince. In 1815 he became chief president of the new Grand Duchy of Posen.
      source: oe1bu9454-201; oe1bu9454-285; oe1bu9454-238
      sources_en:
      - text: Oe 1 Bü 9454, document 201
        url: /documents/oe1bu9454/201/
      - text: Oe 1 Bü 9454, document 285
        url: /documents/oe1bu9454/285/
      - text: Oe 1 Bü 9454, document 238
        url: /documents/oe1bu9454/238/
    - text: Asked by the State Chancellor, Hardenberg, to report on the Prince's claim for compensation
        for Trąbczyn and Kamionna, he wrote from Poznań on 2 November 1815 that the Prince had sold Kamionna
        and Kolno before 1806 but not Trąbczyn, that the estates had passed back to their former owner's
        heirs in 1806 and 1807, that the claim of 318,500 Reichsthaler was nonsense, and that the Prince
        had let Trąbczyn decay and loaded it with debts. Prussia, he advised, could only ask Russia to
        compensate the Prince; on his proposal the envoy at St Petersburg was told in April 1816 to raise
        the matter only in general terms, as one of grace.
      source: iiihamdaiiinr12765-6; iiihamdaiiinr12765-10; iiihamdaiiinr12765-11
      sources_en:
      - text: III. HA MdA, III Nr. 12765, document 6
        url: /documents/iiihamdaiiinr12765/6/
      - text: III. HA MdA, III Nr. 12765, document 10
        url: /documents/iiihamdaiiinr12765/10/
      - text: III. HA MdA, III Nr. 12765, document 11
        url: /documents/iiihamdaiiinr12765/11/
    - text: In January 1816 he quarrelled with the governor, Prince Radziwiłł, over a report on the organisation
        of the province, and was sent to Berlin.
      source: oe1bu9454-300
      sources_en:
      - text: Oe 1 Bü 9454, document 300
        url: /documents/oe1bu9454/300/
  prusimska:
    died: 19 January 1851, at Trąbczyn
    died_source: editor
    biography:
    - text: Michalina was the only child of Antoni Prusimski, whose estates Prussia confiscated after
        the uprising of 1794 and gave to Prince Hohenlohe- Ingelfingen in 1796, Brzyce, her late mother's
        property, among them. Still a minor, she sued the Prince through a guardian before the South Prussian
        Government at Poznań to recover Brzyce; the Prince had the case moved to Warsaw, but Poznań had
        already given judgment on 9 December 1800. On 22 January 1802 she wrote to the King from Dresden
        in French, an "abandoned orphan pleading against the Prince of Hohenlohe", asking him to hasten
        her appeal.
      source: ihagrrep7cnr3709-1; ihagrrep7cnr3709-3; ihagrrep7cnr3709-7; ihagrrep7cnr3709-10
      sources_en:
      - text: I. HA GR, Rep. 7 C, Nr. 3709, document 1
        url: /documents/ihagrrep7cnr3709/1/
      - text: I. HA GR, Rep. 7 C, Nr. 3709, document 3
        url: /documents/ihagrrep7cnr3709/3/
      - text: I. HA GR, Rep. 7 C, Nr. 3709, document 7
        url: /documents/ihagrrep7cnr3709/7/
      - text: I. HA GR, Rep. 7 C, Nr. 3709, document 10
        url: /documents/ihagrrep7cnr3709/10/
    - text: In July 1807, as Michalina Dąbska, born Prusimska, she petitioned from Dresden the Governing
        Commission of the new Duchy of Warsaw and Napoleon for her father's confiscated estates, Trąbczyn,
        Kamionna and Kolno among them. On 21 July the Commission extended to her the Emperor's decree
        that confiscated estates return to their true owners, and that October the appellate judge Lipski
        took Trąbczyn from the Prince's officials and handed it to her agent, Canon Jezierski.
      source: agad11740273-2; agad11740273-3; agad1174016-2; oe1bu9454-28
      sources_en:
      - text: 1/174/0/2/73, document 2
        url: /documents/agad11740273/2/
      - text: 1/174/0/2/73, document 3
        url: /documents/agad11740273/3/
      - text: 1/174/0/1/6, document 2
        url: /documents/agad1174016/2/
      - text: Oe 1 Bü 9454, document 28
        url: /documents/oe1bu9454/28/
    - text: 'The Prince sued to recover the estate before the justice of the peace at Konin and the tribunal
        at Kalisz from 1810, and his creditors pressed claims on it for decades. After her marriage to
        Stanisław Miączyński, the courts held that the estate''s return in 1807 had freed it of the debts
        charged on it under the Prince: the tribunal at Kalisz dismissed the banker Weigel''s suit in
        1819, confirmed by the high court at Warsaw in 1826, and in 1827, at her suit, struck the Lichnowski
        brothers'' and the widow Grotowska''s mortgages from the register of Trąbczyn. In 1828 she made
        an agreement with the colonists of the estate over their pasture and wood rights. She died at
        Trąbczyn on 19 January 1851.'
      source: oe1bu9454-194; agad118501169-1; iiihamdaiiinr12366-5; app539680783-1
      sources_en:
      - text: Oe 1 Bü 9454, document 194
        url: /documents/oe1bu9454/194/
      - text: 1/185/0/1/169, document 1
        url: /documents/agad118501169/1/
      - text: III. HA MdA, III. Nr. 12366, document 5
        url: /documents/iiihamdaiiinr12366/5/
      - text: 53/968/0/-/783, document 1
        url: /documents/app539680783/1/
    died_sources_en:
    - text: the editor
    died_sources_de:
    - text: der Herausgeber
  weigel:
    biography:
    - text: Carl Ferdinand Weigel, a banker at Wrocław, first appears in 1803, when Prince Hohenlohe-Ingelfingen
        assigned him 8,000 Reichsthaler of the price of the estate of Witów. In 1804 he promised the Prince's
        agent, Triebenfeld, 30,000 Reichsthaler to pay off the mortgage that the Prince had given one
        Grotowski on Trąbczyn in 1800, and in 1808 he had Grotowski's mortgage registered on Trąbczyn
        in his own name.
      source: oe1bu14526-2; oe1bu9454-117; agad118501169-1; iiihamdaiiinr12366-4
      sources_en:
      - text: Oe 1 Bü 14526, document 2
        url: /documents/oe1bu14526/2/
      - text: Oe 1 Bü 9454, document 117
        url: /documents/oe1bu9454/117/
      - text: 1/185/0/1/169, document 1
        url: /documents/agad118501169/1/
      - text: III. HA MdA, III. Nr. 12366, document 4
        url: /documents/iiihamdaiiinr12366/4/
    - text: With Baron Stössel he was the Prince's largest creditor on the Silesian estate of Koszęcin,
        together owed some 470,000 Reichsthaler. From 1809 to 1812 Triebenfeld tried to pay them with
        other estates or with the Zagórów estates; in July 1812 old Weigel offered to lease the farm of
        Kopojno for nine years and to buy the Zagórów estates, but none of the plans was carried out.
      source: oe1bu9454-64; oe1bu9454-221; oe1bu9454-233; oe1bu9454-235
      sources_en:
      - text: Oe 1 Bü 9454, document 64
        url: /documents/oe1bu9454/64/
      - text: Oe 1 Bü 9454, document 221
        url: /documents/oe1bu9454/221/
      - text: Oe 1 Bü 9454, document 233
        url: /documents/oe1bu9454/233/
      - text: Oe 1 Bü 9454, document 235
        url: /documents/oe1bu9454/235/
    - text: In 1810 he sued Michalina Prusimska, who held Trąbczyn again, for the interest on his mortgage.
        The tribunal at Kalisz struck the mortgage out in 1819, holding that the estate's return in 1807
        had freed it of its debts, and the high court at Warsaw confirmed this in 1826. Prussia protested
        at St Petersburg in 1827, and the Kingdom of Poland's finance commission tried in vain to have
        the courts declared incompetent; the Council of State's committee advised in 1834 that the courts
        had been entitled to judge.
      source: agad118501169-1; iiihamdaiiinr12366-4; iiihamdaiiinr12367-4
      sources_en:
      - text: 1/185/0/1/169, document 1
        url: /documents/agad118501169/1/
      - text: III. HA MdA, III. Nr. 12366, document 4
        url: /documents/iiihamdaiiinr12366/4/
      - text: III. HA MdA, III. Nr. 12367, document 4
        url: /documents/iiihamdaiiinr12367/4/
  lubecki:
    biography:
    - text: 'Prince Franciszek Ksawery Drucki-Lubecki, minister of finance of the Kingdom of Poland, proposed
        in 1829 that the government challenge the courts'' right to judge the banker Weigel''s claim on
        Trąbczyn: the Council of Administration authorised the finance commission on 4 October 1829 to
        raise a conflict of jurisdiction, and the commission laid its case before the Council of State
        in July 1830.'
      source: agad118501169-1
      sources_en:
      - text: 1/185/0/1/169, document 1
        url: /documents/agad118501169/1/
    - text: In September 1830 Weigel asked him in person for compensation of 63,100 thalers, capital,
        interest and costs, for the mortgage the Polish courts had struck out. Lubecki answered that the
        sum was excessive, since Weigel could never have recovered so much even had he won, and that he
        meant to make good real, not nominal, losses; he had the estates valued afresh, since the court
        valuation of 1803 on which Weigel relied dated from a time of inflated land prices.
      source: iiihamdaiiinr12367-6; iiihamdaiiinr12367-7
      sources_en:
      - text: III. HA MdA, III. Nr. 12367, document 6
        url: /documents/iiihamdaiiinr12367/6/
      - text: III. HA MdA, III. Nr. 12367, document 7
        url: /documents/iiihamdaiiinr12367/7/
  miaczynski-wlodzimierz:
    died: 18 December 1879, at Trąbczyn
    died_source: editor
    biography:
    - text: 'Count Włodzimierz Miączyński, son of Michalina Miączyńska, born Prusimska, and Stanisław
        Miączyński, held the Trąbczyn estate after his mother''s death in 1851 and lived there. When the
        colonists of the estate''s two Olęder colonies sued him in 1859, he counterclaimed before the
        Civil Tribunal at Kalisz and in October 1860 had 97 of them summoned: he asked that their old
        contract of 1805 with Prince Hohenlohe-Ingelfingen be declared not binding on him, and that pasture
        and wood-gathering in his forest be allowed only to the seven holdings of his mother''s agreement
        of 1828.'
      source: app539680783-1
      sources_en:
      - text: 53/968/0/-/783, document 1
        url: /documents/app539680783/1/
    - text: After the enfranchisement of the peasants of the Kingdom of Poland in 1864 he petitioned the
        Commission for Peasant Affairs in 1865 against the decisions that granted a neighbour's farmer
        pasture on his farm of Włodzimirów and returned six farmsteads at Nowa Wieś to their former holders,
        and submitted the liquidation table of the Trąbczyn estate. He died at Trąbczyn on 18 December
        1879, and his nephew Władysław Miączyński became heir.
      source: apl399801333-4; apl399801333-3; apl399801333-1; editor
      sources_en:
      - text: 39/98/0/-/1333, document 4
        url: /documents/apl399801333/4/
      - text: 39/98/0/-/1333, document 3
        url: /documents/apl399801333/3/
      - text: 39/98/0/-/1333, document 1
        url: /documents/apl399801333/1/
      - text: the editor
    died_sources_en:
    - text: the editor
    died_sources_de:
    - text: der Herausgeber
  zelmer:
    biography:
    - text: The Zelmers (in the Polish documents Celmer, in the Russian Цельмеръ) were among the first
        Olęder settlers on the Trąbczyn estate. Bogusław Celmer is one of the twelve settlers of the Lusnia
        wood named in 1771, when the settlement founded there "not very long ago" was handed over to Stanisław
        Chełmski of Łukom.
      source: app53150kaliszgr414-1
      sources_en:
      - text: 53/15/0/-/Kalisz Gr.414, document 1
        url: /documents/app53150kaliszgr414/1/
    - text: 'In October 1860 Count Włodzimierz Miączyński summoned 97 colonists of the Staro- and Nowo-Łazińska
        colonies over their pasture and wood-gathering in his forest; among them were Henryk Zelmer, Anna
        Elżbieta, the widow of Daniel Zelmer, with her five children, August Zelmer and Michał Zelmer.
        When the colony''s land was assigned to the settlers in 1868, five holdings stood under the name:
        Gottfried''s, Heinrich''s, Michael''s, August''s and that of Daniel''s heirs, from 12 to 36 Morgen.'
      source: app539680783-1; apl399806603-1
      sources_en:
      - text: 53/968/0/-/783, document 1
        url: /documents/app539680783/1/
      - text: 39/98/0/-/6603, document 1
        url: /documents/apl399806603/1/
    - text: In 1936 the historian Albert Breyer noted at Łazińsk that Eduard Zelmer had taught at the
        colony's school for 34 years.
      source: app539680669-1
      sources_en:
      - text: 53/968/0/-/669, document 1
        url: /documents/app539680669/1/
  erdmann:
    biography:
    - text: E. Erdmann was pastor-administrator of the Evangelical-Augsburg parish of Zagórów, which served
        the German colonists of the Trąbczyn and Zagórów estates. His reports for 1882 to the consistory
        at Warsaw describe a brick church still without font, organ or bells, eight schools with about
        240 children, eight cemeteries and 1,597 communicants; and for the filial parish of Lissewo-Pyzdry,
        services held in a rented room at Pyzdry, five schools with prayer houses and 734 communicants.
      source: agad14320139-1; agad14320139-2
      sources_en:
      - text: 1/432/0/1/139, scans 128-130, document 1
        url: /documents/agad14320139/1/
      - text: 1/432/0/1/139, scans 128-130, document 2
        url: /documents/agad14320139/2/
  mielke:
    biography:
    - text: Mielke was the teacher of the German colony school at Łazińsk from 1925. In July 1936 the
        historian Albert Breyer, visiting Łazińsk, noted him as the colony's teacher, after Eduard Zelmer,
        who had taught there for 34 years, and his predecessors Klingbeil, Radke and Rasch.
      source: app539680669-1
      sources_en:
      - text: 53/968/0/-/669, document 1
        url: /documents/app539680669/1/
  mikolaj-podskarbi-ladzki:
    biography:
    - text: Count Mikołaj served Duke Bolesław of Greater Poland as treasurer at Ląd. At Dłusk on 27 March
        1276 the duke, with his son Przemysł and his wife Jolenta, gave him for his faithful services
        the village of Trąbczyn, "Trupcino", to hold with his descendants by hereditary right for ever,
        free of the ducal dues. The village had been given twice before, to Count Janko, son of Szymon,
        and to Mikołaj, a former parish priest of Środa, and had come back to the duke each time when
        they died without heirs; their privileges were declared void.
      source: kdw-5
      sources_en:
      - text: Kodeks Dyplomatyczny Wielkopolski, document 5
        url: /documents/kdw/5/
    - text: In 1284 Duke Przemysł II gave him leave to settle Trąbczyn under German law, freeing it for
        ever from the Polish payments, so that its settlers paid no ploughing tax.
      source: kdw-23
      sources_en:
      - text: Kodeks Dyplomatyczny Wielkopolski, document 23
        url: /documents/kdw/23/
  jan-z-trabczyna-1346:
    biography:
    - text: Jan and his brother Przedpełk, owners of Trąbczyn, claimed the villages of Stropiszyn and
        Pępocin from the church of Gniezno. At Pyzdry on 13 November 1346 Dobiesław, judge of the lands
        of Gniezno and Kalisz, before the captain of Poland and the palatines of Poznań and Kalisz, adjudged
        the villages to the church and imposed perpetual silence on the brothers. The same day the same
        judge dismissed the suit for the same villages of Andrzej, owner of Trąbczyn, and all his kin;
        whether the brothers were among that kin is not said.
      source: kdw-9; kdw-10
      sources_en:
      - text: Kodeks Dyplomatyczny Wielkopolski, document 9
        url: /documents/kdw/9/
      - text: Kodeks Dyplomatyczny Wielkopolski, document 10
        url: /documents/kdw/10/
  przedpelk-z-trabczyna:
    biography:
    - text: Przedpełk and his brother Jan, owners of Trąbczyn, claimed the villages of Stropiszyn and
        Pępocin from the church of Gniezno. At Pyzdry on 13 November 1346 the land judge Dobiesław adjudged
        the villages to the church and imposed perpetual silence on the brothers.
      source: kdw-9
      sources_en:
      - text: Kodeks Dyplomatyczny Wielkopolski, document 9
        url: /documents/kdw/9/
  dambski-ludwik:
    biography:
    - text: Ludwik Dąmbski, Count of Lubraniec, voivode of Brześć Kujawski, Starost of Dybów and Gniewkowo
        and knight of the White Eagle, stood first among the commissioners whom the Polish parliament
        appointed in 1774 to settle the boundary between Trąbczyn and Łukom, the subject of two centuries
        of lawsuits between their owners. As president of the commission he issued the citations to the
        parties from the palace at Żerków in August 1775.
      source: app53170koningr145-1; app53170koningr116-2
      sources_en:
      - text: 53/17/0/-/Konin Gr.145, document 1
        url: /documents/app53170koningr145/1/
      - text: 53/17/0/-/Konin Gr.116, document 2
        url: /documents/app53170koningr116/2/
    - text: The commission met in the forest on the disputed ground in September 1775. When the commissioners
        brought in on Stanisław Chełmski's side acted alone, Dąmbski and four others entered a protest
        at Konin. The decree he signed found Antoni Prusimski's line the better, had new boundary mounds
        raised, and sentenced Chełmski to two weeks in the tower at Konin and 8,000 złoty.
      source: app53170koningr116-3; app53170koningr145-1
      sources_en:
      - text: 53/17/0/-/Konin Gr.116, document 3
        url: /documents/app53170koningr116/3/
      - text: 53/17/0/-/Konin Gr.145, document 1
        url: /documents/app53170koningr145/1/
  kosciuszko:
    biography:
    - text: 'Tadeusz Kościuszko led the Polish uprising of 1794 against Russia and Prussia as its commander-in-chief
        (Naczelnik). On 3 September 1798, in Paris, he answered a letter written to him from Dresden on
        10 August by a correspondent addressed only as "Citizen": he would stand with every Pole of a
        truly republican soul, but the time to regain the country''s independence was not yet in sight,
        and nothing should be done too soon to expose them to their enemies'' persecution. A copy of the
        letter survives in a collection of copies made by Stanisław Przyłęcki.'
      source: ossol2289-1
      sources_en:
      - text: B. Ossol. rkp. 2289 II, document 1
        url: /documents/ossol2289/1/
    - text: 'Antoni Prusimski, the exiled owner of Trąbczyn, sought him in England in 1797, wrote to him
        in America that autumn to win him for the republican camp, and greeted him with a letter on his
        arrival in Paris in 1798. Whether the letter of September 1798 is Kościuszko''s answer to Prusimski
        cannot be shown: the copy names no addressee.'
      source: pachonski1982/583
      sources_en:
      - text: Pachoński (1982), p. 583
        url: /literature/pachonski1982/#p-583
  jezierski:
    biography:
    - text: 'Xaver Jezierski, canon of Włocławek and parish priest at Neustadt, was named in the files
        of the Poznań Government as one of the men who most often stayed with Antoni Prusimski at Smiłowice
        before the Kuyavian insurrection of August 1794 and worked to bring it about: he was said to have
        drafted the proclamations to the people, raised men and sat on the insurgents'' security commission.
        He fled; his small property and the income of his benefices were confiscated, and in February
        1797 Grand Chancellor Goldbeck listed him among the ringleaders whose property alone could be
        seized.'
      source: ihagrrep7cnr3132-5; ihagrrep7cnr3067-1
      sources_en:
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 5
        url: /documents/ihagrrep7cnr3132/5/
      - text: I. HA GR, Rep. 7 C, Nr. 3067, document 1
        url: /documents/ihagrrep7cnr3067/1/
    - text: On 27 January 1803 he and Prusimski petitioned the King from Dresden for leave to return.
        The ministers Goldbeck and Haugwitz advised that confiscation and nine years' banishment had punished
        them enough, and on 10 May 1803 the King granted leave, the confiscation standing and Jezierski
        remaining deprived of his offices and benefices; both were to take the oath of allegiance. In
        October 1807 he received Trąbczyn from the appellate judge Lipski as the agent of Prusimski's
        daughter, Michalina Dąbska.
      source: ihagrrep7cnr3132-1; ihagrrep7cnr3132-5; ihagrrep7cnr3132-6; ihagrrep7cnr3132-7; oe1bu9454-28
      sources_en:
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 1
        url: /documents/ihagrrep7cnr3132/1/
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 5
        url: /documents/ihagrrep7cnr3132/5/
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 6
        url: /documents/ihagrrep7cnr3132/6/
      - text: I. HA GR, Rep. 7 C, Nr. 3132, document 7
        url: /documents/ihagrrep7cnr3132/7/
      - text: Oe 1 Bü 9454, document 28
        url: /documents/oe1bu9454/28/
  glenck:
    biography:
    - text: Johann Wilhelm Glenck, councillor for building and estate management at Wrocław, was Prince
        Hohenlohe-Ingelfingen's general agent and general tenant for the Polish estates from 1798, paying
        the Prince 44,500 Reichsthaler a year. In October 1798 he sold 1,000 Morgen of the home farm of
        Szetlewek to the miller Samuel Lucke of Białobrzeg, and that winter he engaged three contractors
        to find settlers for the rest of the farm.
      source: oe1bu9454-89; oe1bu14526-24; oe1bu14526-25
      sources_en:
      - text: Oe 1 Bü 9454, document 89
        url: /documents/oe1bu9454/89/
      - text: Oe 1 Bü 14526, document 24
        url: /documents/oe1bu14526/24/
      - text: Oe 1 Bü 14526, document 25
        url: /documents/oe1bu14526/25/
    - text: From 1800 to 1802 he pressed the Governments at Kalisz and Poznań to enter the Prince's title
        to the former church villages and to Pszczew, and the Prince owed him 53,000 Reichsthaler charged
        on Pszczew. On 28 July 1804 he sold the lordship of Pszczew to its townspeople and six villages
        for 180,000 Reichsthaler.
      source: oe1bu14525-20; oe1bu14525-34; oe1bu14525-25; oe1bu14526-18
      sources_en:
      - text: Oe 1 Bü 14525, document 20
        url: /documents/oe1bu14525/20/
      - text: Oe 1 Bü 14525, document 34
        url: /documents/oe1bu14525/34/
      - text: Oe 1 Bü 14525, document 25
        url: /documents/oe1bu14525/25/
      - text: Oe 1 Bü 14526, document 18
        url: /documents/oe1bu14526/18/
    - text: His successor as general agent, Peter Friedrich von Triebenfeld, found that he had sold the
        farms of Swięcia and Oleśnica far too cheaply, reckoning the Prince's loss at 95,340 Reichsthaler,
        and accused him in 1805 and 1806 of talking buyers out of the estates and stirring up the settlers
        with a lampoon. In April 1806 the Prince still wished to rescue him once more.
      source: oe1bu9454-148; oe1bu9454-168; oe1bu9454-192; oe1bu9454-190
      sources_en:
      - text: Oe 1 Bü 9454, document 148
        url: /documents/oe1bu9454/148/
      - text: Oe 1 Bü 9454, document 168
        url: /documents/oe1bu9454/168/
      - text: Oe 1 Bü 9454, document 192
        url: /documents/oe1bu9454/192/
      - text: Oe 1 Bü 9454, document 190
        url: /documents/oe1bu9454/190/
  hohenlohe:
    biography:
    - text: 'Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, was a Prussian lieutenant general
        and governor of Wrocław when King Friedrich Wilhelm II rewarded his long service with Polish estates.
        On the proposal of Count Hoym, the minister for South Prussia, a deed of 9 August 1796 gave him,
        heritably and free of all but the sovereign''s taxes, the estates confiscated from Antoni Prusimski
        after the uprising of 1794: Kamionna and Kolno near Międzychód, Trąbczyn with Szetlewek, Nowa
        Wieś, Łazy, Laski, Osiny and its Olęder settlement near Konin, and Brzyce in Kuyavia.'
      source: oe1bu14525-39; ihagrrep7cnr3570-1
      sources_en:
      - text: Oe 1 Bü 14525, document 39
        url: /documents/oe1bu14525/39/
      - text: I. HA GR, Rep. 7 C, Nr. 3570, document 1
        url: /documents/ihagrrep7cnr3570/1/
    - text: Because Prusimski's estates proved heavily indebted, the King added on 19 June 1797 sixteen
        former church villages, among them Pszczew, Zagórów, Drzewce and Wieniec, for a fixed yearly payment
        to the crown and the upkeep of their former church owners, and their appurtenances on 1 December
        1797. The Prince tried in 1798 to exchange the whole for the royal domain of Krotoszyn, which
        he valued below his own estates; on the report of the minister Voss the King refused.
      source: oe1bu14525-8; oe1bu14525-7; oe1bu9454-85; oe1bu9454-86
      sources_en:
      - text: Oe 1 Bü 14525, document 8
        url: /documents/oe1bu14525/8/
      - text: Oe 1 Bü 14525, document 7
        url: /documents/oe1bu14525/7/
      - text: Oe 1 Bü 9454, document 85
        url: /documents/oe1bu9454/85/
      - text: Oe 1 Bü 9454, document 86
        url: /documents/oe1bu9454/86/
    - text: Short of money, the Prince turned the estates into cash. In 1804 he sold the lordship of Pszczew
        to its townspeople and villages for 180,000 Reichsthaler and a yearly ground rent, and Kamionna
        and Kolno to the bank official Leixner for 142,000 Reichsthaler. On 19 February 1805 he gave Peter
        Friedrich von Triebenfeld a general power of attorney for Zagórów, Witów and Trąbczyn, and in
        1806 the Chamber at Kalisz consented to the division of their demesne farms among settlers on
        hereditary leases. His will of 7 October 1805, confirmed by the King, bound Zagórów, Trąbczyn,
        Pszczew and Wieniec with his Silesian estates into a family entail.
      source: oe1bu14526-18; oe1bu14526-5; app539680801-1; app539680801-2; oe1u199-1
      sources_en:
      - text: Oe 1 Bü 14526, document 18
        url: /documents/oe1bu14526/18/
      - text: Oe 1 Bü 14526, document 5
        url: /documents/oe1bu14526/5/
      - text: 53/968/0/-/801, document 1
        url: /documents/app539680801/1/
      - text: 53/968/0/-/801, document 2
        url: /documents/app539680801/2/
      - text: Oe 1 U 199, document 1
        url: /documents/oe1u199/1/
    - text: After the defeat of 1806 the estates were lost to him. In July 1807 the Governing Commission
        of the new Duchy of Warsaw returned Prusimski's estates to his daughter Michalina, and the Prince's
        creditors, among them the Invalids' Fund and the bankers Weigel and Stössel, pressed him for years.
        From 1814 his agent Triebenfeld claimed compensation for Trąbczyn at the Congress of Vienna; the
        Prince himself told Hardenberg in May 1815 that the loss came to more than 261,000 Reichsthaler.
        Russia refused the claim in 1816, and again in 1820, when it was pressed by his heirs.
      source: agad11740273-3; iiihamdaiiinr12765-6; iiihamdaiiinr12765-21; iiihamdaiiinr12765-22
      sources_en:
      - text: 1/174/0/2/73, document 3
        url: /documents/agad11740273/3/
      - text: III. HA MdA, III Nr. 12765, document 6
        url: /documents/iiihamdaiiinr12765/6/
      - text: III. HA MdA, III Nr. 12765, document 21
        url: /documents/iiihamdaiiinr12765/21/
      - text: III. HA MdA, III Nr. 12765, document 22
        url: /documents/iiihamdaiiinr12765/22/
  triebenfeld:
    died: between 31 January and 13 April 1816
    died_source: oe1bu9454-301; iiihamdaiiinr12765-10
    biography:
    - text: Peter Friedrich August von Triebenfeld, Prussian Councillor of War and Forests at Wrocław
        and owner of Świniary and Konotop in Silesia, wrote to Prince Hohenlohe-Ingelfingen about his
        Polish estates from April 1798. That autumn he lobbied the King's ministers in Berlin for the
        Prince's proposed exchange of the estates for the domain of Krotoszyn, which the King refused
        in December 1798.
      source: oe1bu9454-75; oe1bu9454-77; oe1bu9454-85
      sources_en:
      - text: Oe 1 Bü 9454, document 75
        url: /documents/oe1bu9454/75/
      - text: Oe 1 Bü 9454, document 77
        url: /documents/oe1bu9454/77/
      - text: Oe 1 Bü 9454, document 85
        url: /documents/oe1bu9454/85/
    - text: In January 1805 he borrowed 50,000 Reichsthaler from the Invalids' Fund, arranged through
        General von Köckritz, on his own bond secured on the Prince's estate of Zagórów, and on 19 February
        1805 the Prince made him general agent for Zagórów, Witów and Trąbczyn, with power to divide,
        sell, lease and mortgage them. That spring he made the first contracts with the old peasants of
        Trąbczyn and let the demesne farms to settlers on hereditary leases; by September 1805 the new
        colonies held 21,407 Morgen and 578 farmers.
      source: iharep162nr295-1; app539680801-1; oe1bu9454-172; oe1bu9454-177
      sources_en:
      - text: I. HA Rep. 162, Nr. 295, document 1
        url: /documents/iharep162nr295/1/
      - text: 53/968/0/-/801, document 1
        url: /documents/app539680801/1/
      - text: Oe 1 Bü 9454, document 172
        url: /documents/oe1bu9454/172/
      - text: Oe 1 Bü 9454, document 177
        url: /documents/oe1bu9454/177/
    - text: When the Duchy of Warsaw took the estates in 1807 he was left answering for the Prince's debts.
        French gendarmes arrested him in March 1808 and again in January 1809 for the interest owed to
        the Invalids' Fund, and in 1810 he fled Wrocław before a creditor's warrant. In January 1811 he
        was conducting 43 lawsuits, 29 of them against settlers who owed 39,000 Reichsthaler in rent,
        while he sued at Konin and Kalisz to recover Trąbczyn from Michalina Prusimska.
      source: oe1bu9454-30; oe1bu9454-42; oe1bu9454-196; oe1bu9454-213; oe1bu9454-194
      sources_en:
      - text: Oe 1 Bü 9454, document 30
        url: /documents/oe1bu9454/30/
      - text: Oe 1 Bü 9454, document 42
        url: /documents/oe1bu9454/42/
      - text: Oe 1 Bü 9454, document 196
        url: /documents/oe1bu9454/196/
      - text: Oe 1 Bü 9454, document 213
        url: /documents/oe1bu9454/213/
      - text: Oe 1 Bü 9454, document 194
        url: /documents/oe1bu9454/194/
    - text: From October 1814 to May 1815 he was at the Congress of Vienna, petitioning Hardenberg and
        the other ministers for compensation for Trąbczyn and Kamionna, which he put at 459,000 Reichsthaler.
        His wife had died in 1804; in December 1815 he reported the death of a daughter and his own grave
        illness. His last letter is of 31 January 1816, and he had died by April 1816.

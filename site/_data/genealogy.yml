  wojciech-otto-trampczynski:
    standalone: true
    heading: Wojciech Otto-Trąmpczyński
    heading_de: Wojciech Otto-Trąmpczyński
    life: documented 1584–1595
    life_de: belegt 1584–1595
    bio: Wojciech (Albertus) Otto-Trąmpczyński, co-heir of a part of Trąbczyn in the late sixteenth century,
      brother of Jan the elder and, after Jan's death, guardian of Jan's sons, who held the estate with
      him. In 1589 he sued the heirs of Łukom, Tomasz Łukomski and Barbara Brodzyńska, because their new
      pond at Łukom flooded the woods, meadows and pastures of his part of Trąbczyn. The view of the ground
      taken that July, which he had entered in the court book only in December 1592, while his nephews
      were suing him for their share, became the chief evidence of the Łukom side in the boundary suit
      of the 1770s; the heir of Trąbczyn objected that Wojciech had held only a part of the estate and
      had acted without his wards. In 1591 the nephews, come of age, divided Trąbczyn with him. His son
      Stanisław carried his line at Trąbczyn.
    bio_de: Wojciech (Albertus) Otto-Trąmpczyński, Miterbe eines Teils von Trąbczyn im späten 16. Jahrhundert,
      Bruder Jans des Älteren und nach Jans Tod Vormund von dessen Söhnen, die das Gut mit ihm besaßen.
      1589 verklagte er die Erben von Łukom, Tomasz Łukomski und Barbara Brodzyńska, weil ihr neuer Teich
      bei Łukom die Wälder, Wiesen und Weiden seines Teils von Trąbczyn überschwemmte. Die im Juli desselben
      Jahres aufgenommene Besichtigung, die er erst im Dezember 1592 ins Gerichtsbuch eintragen ließ,
      als seine Neffen ihn um ihren Anteil verklagten, wurde im Grenzprozess der 1770er Jahre das wichtigste
      Beweisstück der Seite Łukom; der Erbe von Trąbczyn wandte ein, Wojciech habe nur einen Teil des
      Guts besessen und ohne seine Mündel gehandelt. 1591 teilten die Neffen, volljährig geworden, Trąbczyn
      mit ihm. Sein Sohn Stanisław setzte seine Linie auf Trąbczyn fort.
    marriages:
    - name: Anna Cerekwicka
      source: minakowska2026ottotrampczynski/c01

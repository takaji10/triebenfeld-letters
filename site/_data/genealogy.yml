  jan-otto-trampczynski:
    standalone: true
    heading: Jan Otto-Trąmpczyński
    heading_de: Jan Otto-Trąmpczyński
    life: documented 1692–1698
    life_de: belegt 1692–1698
    bio: Jan Otto-Trąmpczyński, son of Władysław and Anna Bojanowska, of the last generation of the family
      to hold Trąbczyn. In 1692 he recorded the dowry of his wife Teresa Prusimska, daughter of Jan na
      Kolno Prusimski, on half his estates. On 6 October 1693 he and his brothers Andrzej and Władysław
      divided Trąbczyn, Nowa Wieś, Osiny and Łazy among themselves, keeping some ponds and the boggy ground
      of the forest for common use. In 1698 he, Andrzej and their mother, acting for their brother Władysław
      as well, sold the estate to his father-in-law under a penalty of 90,000 złoty, and Trąbczyn passed
      to the Prusimskis in one hand.
    bio_de: Jan Otto-Trąmpczyński, Sohn Władysławs und Anna Bojanowskas, aus der letzten Generation der
      Familie, der Trąbczyn gehörte. 1692 sicherte er die Mitgift seiner Frau Teresa Prusimska, der Tochter
      des Jan na Kolno Prusimski, auf der Hälfte seiner Güter. Am 6. Oktober 1693 teilten er und seine
      Brüder Andrzej und Władysław Trąbczyn, Nowa Wieś, Osiny und Łazy unter sich und behielten einige
      Teiche und den sumpfigen Grund im Wald zur gemeinsamen Nutzung. 1698 verkauften er, Andrzej und
      ihre Mutter, auch im Namen ihres Bruders Władysław, das Gut unter einer Vertragsstrafe von 90.000
      Złoty an seinen Schwiegervater, und Trąbczyn ging in einer Hand an die Prusimskis über.

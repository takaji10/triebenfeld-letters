  prusimski-krzysztof:
    biography:
    - text: Krzysztof, son of Jan Prusimski of Kolno and Teresa Gajewska, divided the paternal estates
        with his brothers Sebastian and Ludwik in 1700, and after Ludwik's death in 1708 held with Sebastian
        the family's lands, Trąbczyn, Nowa Wieś, Łazy and Osiny, Kamionna and Kolno among them. With his
        wife Teresa Golińska he leased out Szetlewek, Prusinowo and Oporowo in the 1720s.
      source: app5320pozgr1181-1
      sources_en:
      - text: 53/20/0/-/Poznań Gr.1181, document 1
        url: /documents/app5320pozgr1181/1/
    - text: From 1713 he contested the boundary with his neighbours the Chełmskis of Łukom, over the stawisko
        and the Lusnia wood and a dam that flooded his meadows, with site inspections in 1724 and 1725.
        In 1728 the brothers Franciszek and Józef Chełmski sued him, his son Antoni and their people for
        burning their shingles and a hut, carrying off four oxen in an armed raid and carting hay off
        the disputed ground, and the land court at Konin sent a sworn commissioner onto it. He was dead
        by 1737, and his sons divided his estates in 1740.
      source: app53170koningr145-1; app536040-1; app5320pozgr1181-1
      sources_en:
      - text: 53/17/0/-/Konin Gr.145, document 1
        url: /documents/app53170koningr145/1/

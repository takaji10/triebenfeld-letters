  label_en: "The Miączyńska restitution"
  label_de: "Die Restitution der Miączyńska"
  blurb_en: "The daughter of the last Polish owner recovered the estates in 1807 through the governing commission of the Duchy of Warsaw, and spent the next thirty years in court over what was left of them. The documents are in Warsaw and Berlin and have not yet been added here."
  blurb_de: "Die Tochter des letzten polnischen Besitzers erhielt die Güter 1807 durch die Regierungskommission des Herzogtums Warschau zurück. Die Akten liegen in Warschau und Berlin und sind hier noch nicht erfasst."
  ownership_en: "Michalina Prusimska, married name Dąbska and later Miączyńska, the daughter of the last Polish owner. 1807 onward"
  ownership_de: "Michalina Prusimska, verheiratet Dąbska, später Miączyńska, die Tochter des letzten polnischen Besitzers. ab 1807"
- slug: "wlodzimierz"
  order: 4
  status: "populated"
  count: 8
  first: "1858"
  last: "1870"
  label_en: "The estate under Włodzimierz Miączyński"
  label_de: "Das Gut unter Włodzimierz Miączyński"
  blurb_en: "After Michalina Miączyńska her son Count Włodzimierz Miączyński ran the Trąbczyn estate. The colonists on it sued him in 1859 over their rights of pasture and wood in his forest, and he answered with a counterclaim that went back to the privilege of 1746 and the contracts of Hohenlohe-Ingelfingen's years. Here so far are the printed summons of 1860, a tax list of Emilienheim of 1858, and Albert Breyer's copies of the liquidation tables of 1868, by which the peasants received their land, and of their servitudes."
  blurb_de: "Nach Michalina Miączyńska führte ihr Sohn, Graf Włodzimierz Miączyński, das Gut Trąbczyn. Die Kolonisten des Gutes verklagten ihn 1859 wegen ihrer Weide- und Holzrechte in seinem Wald, und er antwortete mit einer Widerklage, die auf das Privileg von 1746 und die Verträge aus den Jahren Hohenlohe-Ingelfingens zurückging. Bisher liegen die gedruckte Vorladung von 1860 vor, eine Steuerliste von Emilienheim von 1858 und Albert Breyers Abschriften der Liquidationstabellen von 1868, nach denen die Bauern ihr Land erhielten, und ihrer Servitute."
  ownership_en: "Count Włodzimierz Miączyński, Michalina's son, who ran the estate after her. Held it in 1860"
  ownership_de: "Graf Włodzimierz Miączyński, Michalinas Sohn, der das Gut nach ihr führte. Besaß es 1860"
- slug: "twentieth-century"
  order: 5
  status: "populated"
  count: 8
  first: "1935"
  last: "1936"
  label_en: "The twentieth century"
  label_de: "Das zwanzigste Jahrhundert"
  blurb_en: "By the twentieth century the manor of Trąbczyn had been parcelled out, and the German settlements on its former land, Łazińsk and Emilienheim among them, were villages of the commune of Trąbczyn in the Polish state. The historian Albert Breyer visited them in 1935 and 1936 and wrote down what the settlers remembered and counted their farms. Three of his notebooks are here so far; his copies of older papers in them stand with the era of those papers."
  blurb_de: "Im zwanzigsten Jahrhundert war der Gutshof Trąbczyn parzelliert, und die deutschen Siedlungen auf seinem früheren Land, darunter Łazińsk und Emilienheim, waren Dörfer der Gemeinde Trąbczyn im polnischen Staat. Der Historiker Albert Breyer besuchte sie 1935 und 1936 und schrieb auf, woran sich die Siedler erinnerten, und zählte ihre Höfe. Bisher liegen drei seiner Notizhefte vor; seine Abschriften älterer Papiere darin stehen bei der Epoche dieser Papiere."
  ownership_en: "The manor parcelled out; the German settlements of the commune of Trąbczyn. 1900 onward"
  ownership_de: "Der Gutshof parzelliert; die deutschen Siedlungen der Gemeinde Trąbczyn. ab 1900"

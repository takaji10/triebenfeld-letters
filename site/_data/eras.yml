- slug: "prusimski-boundary"
  order: 1
  status: "populated"
  count: 96
  first: "1589"
  last: "1791"
  label_en: "The Trąbczyn and Łukom boundary dispute"
  label_de: "Der Grenzstreit zwischen Trąbczyn und Łukom"
  blurb_en: "Two hundred years of argument between neighbouring estates over where one ended and the other began: mounds, blazed trees, a disputed pond-ground, and the Olęder settlement that was annexed along with the land it stood on. Twenty-four holdings are here: court orders and judgments from 1589 on, the decree of the commission of 1775, the entries of the Konin and Kalisz court registers that follow the quarrel from 1754 to 1788, the decree of 1782 by which the Crown Tribunal settled the boundary, a newspaper report of 1754 on the funeral of Paweł Prusimski; and, from the last years before the partition, a hearth-tax register of 1789 and the visitation of the parish of Trąbczyn of 1791."
  blurb_de: "Zweihundert Jahre Streit zwischen benachbarten Gütern darüber, wo das eine endete und das andere begann. Vierundzwanzig Bestände liegen vor: gerichtliche Anordnungen und Urteile seit 1589, das Dekret der Kommission von 1775, die Einträge der Gerichtsregister von Konin und Kalisch, die dem Streit von 1754 bis 1788 folgen, das Dekret von 1782, mit dem das Krontribunal die Grenze festlegte, ein Zeitungsbericht von 1754 über das Begräbnis Paweł Prusimskis; und aus den letzten Jahren vor der Teilung ein Register der Rauchfangsteuer von 1789 und die Visitation der Pfarrei Trąbczyn von 1791."
  ownership_en: "The Prusimski family, who held Trąbczyn, against the Chełmski family of Łukom next door. c. 1589 to 1788"
  ownership_de: "Die Familie Prusimski, der Trąbczyn gehörte, gegen die Familie Chełmski im benachbarten Łukom. ca. 1589 bis 1788"
- slug: "hohenlohe"
  order: 2
  status: "populated"
  count: 475
  first: "1794"
  last: "1832"
  label_en: "The Hohenlohe-Ingelfingen years"
  label_de: "Die Hohenlohe-Ingelfingener Jahre"
  blurb_en: "Prussia took the region in the Second Partition of Poland in 1793, and in 1796 the King gave the confiscated estate of a Polish insurgent to a Prussian general. He held it for eleven years, sold parts of it and let the rest out to settlers in hereditary lease, and lost it in 1807; his claim to it was argued until 1820. The papers are here: the grants, the contracts, the letters of the agent who managed the estates, and the files of the Prussian ministries. One of the estates has two names: Pszczew, which the German papers call Betsche."
  blurb_de: "Preußen nahm die Gegend 1793 in der Zweiten Teilung Polens, und 1796 schenkte der König das konfiszierte Gut eines polnischen Aufständischen einem preußischen General. Er besaß es elf Jahre, verkaufte Teile davon, tat den Rest in Erbpacht an Siedler aus und verlor es 1807; um seinen Anspruch wurde bis 1820 gestritten. Hier liegen die Schenkungsurkunden, die Verträge, die Briefe des Bevollmächtigten, der die Güter verwaltete, und die Akten der preußischen Ministerien. Eines der Güter hat zwei Namen: Pszczew, in den deutschen Akten Betsche."
  ownership_en: "Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, a Prussian general given the estate by the King. 1796 to 1807"
  ownership_de: "Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, ein preußischer General, dem der König das Gut schenkte. 1796 bis 1807"

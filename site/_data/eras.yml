  label_en: "The Trąbczyn and Łukom boundary dispute"
  label_de: "Der Grenzstreit zwischen Trąbczyn und Łukom"
  blurb_en: "Two hundred years of argument between neighbouring estates over where one ended and the other began: mounds, blazed trees, a disputed pond-ground, and the Olęder settlement that was annexed along with the land it stood on. Five holdings are here so far: court orders and judgments of 1589, 1644, 1728 and 1763, and the decree of the commission that fixed the boundary in 1775. More entries from the court books at Poznań are still to be added."
  blurb_de: "Zweihundert Jahre Streit zwischen benachbarten Gütern darüber, wo das eine endete und das andere begann. Bisher liegen fünf Bestände vor: gerichtliche Anordnungen und Urteile von 1589, 1644, 1728 und 1763 und das Dekret der Kommission, die 1775 die Grenze festlegte. Weitere Einträge aus den Gerichtsbüchern in Posen sind noch aufzunehmen."
  ownership_en: "The Prusimski family, who held Trąbczyn, against the Chełmski family of Łukom next door. c. 1589 to 1788"
  ownership_de: "Die Familie Prusimski, der Trąbczyn gehörte, gegen die Familie Chełmski im benachbarten Łukom. ca. 1589 bis 1788"
- slug: "hohenlohe"
  order: 2

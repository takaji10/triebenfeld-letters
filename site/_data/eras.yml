  label_en: "The insurgency and the emigration"
  label_de: "Der Aufstand und die Emigration"
  blurb_en: "The papers of the uprising of 1794 and of the years abroad that followed it, so far in one holding: the manuscript collection of copies \"Listy, dokumenty i wiersze z lat 1697-1798\" made mostly by Stanisław Przyłęcki (B. Ossol. rkp. 2289 II), into which the one document transcribed so far falls - Kościuszko's reply of 3 September 1798, written from Paris, to an émigré correspondent who had written to him from Dresden in August; the copy does not name the addressee. The Prussian files of the same years - the confiscation of 1796, the resident's dispatches from Venice - stand in the era of the estate's Prussian years, whose story they are."
  blurb_de: "Die Papiere des Aufstandes von 1794 und der Jahre im Ausland, die folgten, bisher in einem Bestand: der Sammelband von Abschriften \"Listy, dokumenty i wiersze z lat 1697-1798\", überwiegend von Stanisław Przyłęcki geschrieben (B. Ossol. rkp. 2289 II), in den das bislang einzige transkribierte Dokument fällt - Kościuszkos Antwort vom 3. September 1798 aus Paris an einen emigrierten Korrespondenten, der ihm im August aus Dresden geschrieben hatte; die Abschrift nennt den Adressaten nicht. Die preußischen Akten derselben Jahre - die Konfiskation von 1796, die Depeschen des Residenten aus Venedig - stehen in der Epoche der preußischen Jahre des Gutes, deren Geschichte sie sind."
  ownership_en: "Antoni Prusimski, Starost of Niszczewice, the last Polish owner: the uprising of 1794, the confiscation of his estates, and the years abroad that ended in the family's recovery of them. 1794 to 1798"
  ownership_de: "Antoni Prusimski, Starost von Niszczewice, der letzte polnische Besitzer: der Aufstand von 1794, die Einziehung seiner Güter und die Jahre im Ausland, die in der Rückgabe der Güter endeten. 1794 bis 1798"
  intro_en: "In 1794 Antoni Prusimski joins the Kościuszko uprising against the partitioning powers and loses what his family had held for two centuries: Prussia confiscates Trąbczyn, Kamionna and Kolno. The last Polish owner spends the years that follow abroad, ill and broken, reaching Venice in 1796 to beg a certificate that he cannot travel home. In Paris in 1798 the uprising's commander, Kościuszko, writes the letter whose copy opens this era."
  intro_de: "1794 schließt sich Antoni Prusimski dem Kościuszko-Aufstand gegen die Teilungsmächte an und verliert, was seine Familie zwei Jahrhunderte gehalten hat: Preußen zieht Trąbczyn, Kamionna und Kolno ein. Der letzte polnische Besitzer verbringt die folgenden Jahre im Ausland, krank und gebrochen, 1796 in Venedig, um ein Attest zu erwirken, dass er nicht heimreisen könne. In Paris schreibt 1798 der Oberbefehlshaber des Aufstands, Kościuszko, den Brief, dessen Abschrift diese Epoche eröffnet."
  page_en: true
  page_de: true
- slug: "hohenlohe"
  order: 3
  status: "populated"
  count: 474
  first: "1794"
  last: "1832"
  label_en: "The Hohenlohe-Ingelfingen years"
  label_de: "Die Hohenlohe-Ingelfingener Jahre"
  blurb_en: "Prussia took the region in the Second Partition of Poland in 1793, and in 1796 the King gave the confiscated estate of a Polish insurgent to a Prussian general. He held it for eleven years, sold parts of it and let the rest out to settlers in hereditary lease, and lost it in 1807; his claim to it was argued until 1820. The papers are here: the grants, the contracts, the letters of the agent who managed the estates, and the files of the Prussian ministries. One of the estates has two names: Pszczew, which the German papers call Betsche."
  blurb_de: "Preußen nahm die Gegend 1793 in der Zweiten Teilung Polens, und 1796 schenkte der König das konfiszierte Gut eines polnischen Aufständischen einem preußischen General. Er besaß es elf Jahre, verkaufte Teile davon, tat den Rest in Erbpacht an Siedler aus und verlor es 1807; um seinen Anspruch wurde bis 1820 gestritten. Hier liegen die Schenkungsurkunden, die Verträge, die Briefe des Bevollmächtigten, der die Güter verwaltete, und die Akten der preußischen Ministerien. Eines der Güter hat zwei Namen: Pszczew, in den deutschen Akten Betsche."
  ownership_en: "Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, a Prussian general given the estate by the King. 1796 to 1807"
  ownership_de: "Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, ein preußischer General, dem der König das Gut schenkte. 1796 bis 1807"
  intro_en: "In 1796 the King of Prussia gives the confiscated estates to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, a general who already owes more than they earn. What follows is eleven years of trying to turn Polish land into Prussian money — the demesne farms broken into hereditary leases for settlers, the lordships sold piece by piece, debts raised faster than rents come in — and then war: Jena, the surrender at Prenzlau, and the Duchy of Warsaw, which in 1807 hands the estates back to the daughter of the man they were taken from. The Prince never gets them back. For nine more years his agent Peter Friedrich von Triebenfeld, who signed for his debts personally, petitions, sues and travels — to Vienna, and finally to the grave."
  intro_de: "1796 schenkt der König von Preußen die eingezogenen Güter Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, einem General, der schon mehr schuldet, als sie eintragen. Es folgen elf Jahre, das polnische Land in preußisches Geld zu verwandeln — die Vorwerke in Erbpachtstellen für Siedler zerlegt, die Herrschaften stückweise verkauft, Schulden aufgenommen schneller als Zinsen kommen —, und dann der Krieg: Jena, die Kapitulation bei Prenzlau, und das Herzogtum Warschau, das 1807 die Güter der Tochter des Mannes zurückgibt, dem man sie genommen hatte. Der Fürst erhält sie nie zurück. Noch neun Jahre lang petitiert, klagt und reist sein Agent Peter Friedrich von Triebenfeld, der für dessen Schulden persönlich unterschrieben hatte — bis nach Wien, und zuletzt ins Grab."
  page_en: true
  page_de: true

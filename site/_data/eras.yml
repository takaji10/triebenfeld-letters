  label_en: "The Miączyńska restitution"
  label_de: "Die Restitution der Miączyńska"
  blurb_en: "The daughter of the last Polish owner recovered the estates in 1807 through the governing commission of the Duchy of Warsaw, and spent the next thirty years in court over what was left of them. The report of 1834 in which the Instruction Commission of the Council of State of the Kingdom of Poland weighed the conflict of jurisdiction over the Trąbczyn mortgage is in Warsaw and is here; the further documents of the dispute are in Warsaw and Berlin."
  blurb_de: "Die Tochter des letzten polnischen Besitzers erhielt die Güter 1807 durch die Regierungskommission des Herzogtums Warschau zurück und verbrachte die folgenden dreißig Jahre mit Prozessen um das, was von ihnen übrig war. Der Bericht von 1834, in dem die Instruktionskommission des Staatsrats des Königreichs Polen den Kompetenzkonflikt um die Trąbczyner Hypothek abwog, liegt in Warschau und ist hier; die weiteren Akten des Streits liegen in Warschau und Berlin."
  ownership_en: "Michalina Prusimska, married name Dąbska and later Miączyńska, the daughter of the last Polish owner. 1807 onward"
  ownership_de: "Michalina Prusimska, verheiratet Dąbska, später Miączyńska, die Tochter des letzten polnischen Besitzers. ab 1807"
  intro_en: "Michalina Miączyńska got her father's estates back in 1807 without a judgment, and spent the next thirty years in court over what came with them: the mortgages Hohenlohe-Ingelfingen had raised on the land. Prussia's courts, Russia's Tsar and Poland's tribunals each take a turn at the question — whether the restitution reinstated the owner free of the debts the intervening owner had loaded on his grant — and the Polish Supreme Tribunal's answer of 1826, that it did, is confirmed, protested and litigated until the files run out in 1834."
  intro_de: "Michalina Miączyńska erhielt die Güter ihres Vaters 1807 ohne Urteil zurück und verbrachte die folgenden dreißig Jahre vor Gericht mit dem, was mit ihnen kam: den Hypotheken, die Hohenlohe-Ingelfingen auf das Land aufgenommen hatte. Preußens Gerichte, Russlands Zar und Polens Tribunale nehmen sich der Frage nacheinander an — ob die Restitution den Besitzer frei von den Schulden des Zwischenbesitzers wieder einsetze —, und die Antwort des polnischen Obersten Gerichts von 1826, dass sie es tue, wird bestätigt, angefochten und verhandelt, bis die Akten 1834 enden."
  page_en: true
  page_de: true
- slug: "wlodzimierz"
  order: 5
  status: "populated"
  count: 22
  first: "1858"
  last: "1897"
  label_en: "The colonists' land and forest rights"
  label_de: "Das Land und die Waldrechte der Kolonisten"
  blurb_en: "After Michalina Miączyńska died in 1851, her son Count Włodzimierz Miączyński held the Trąbczyn estate until his death in 1879. The colonists on it sued him in 1859 over their rights of pasture and wood in his forest, and he answered with a counterclaim that went back to the privilege of 1746 and the contracts of Hohenlohe-Ingelfingen's years. The Russian reform of 1864 then made the peasants of the Kingdom of Poland owners of the land they farmed; the manor kept its own land and its forest. A liquidation table fixed each village's farmsteads, their land and the capital the government paid the former owner for the peasants' dues, and left the peasants their rights of pasture and wood in the manor forest. The commissioners who drew the tables up heard both sides: in 1865 Miączyński appealed against their decisions for the peasants of Nowawies and for a colonist of a neighbouring village, and in 1867 and 1868 the colonists of Łazińsk petitioned Warsaw for the forest rights of Hohenlohe-Ingelfingen's privilege of 1805. For the Łazińsk colony the table was confirmed in 1868; its rights in the forest \"Studzianka\" were fixed again in 1882 to 1884 and given up in 1892 for 393 Morgen of manor land, and the whole allotment was surveyed in 1896."
  blurb_de: "Nach dem Tod Michalina Miączyńskas 1851 besaß ihr Sohn, Graf Włodzimierz Miączyński, das Gut Trąbczyn bis zu seinem Tod 1879. Die Kolonisten des Gutes verklagten ihn 1859 wegen ihrer Weide- und Holzrechte in seinem Wald, und er antwortete mit einer Widerklage, die auf das Privileg von 1746 und die Verträge aus den Jahren Hohenlohe-Ingelfingens zurückging. Die russische Reform von 1864 machte dann die Bauern des Königreichs Polen zu Eigentümern des Landes, das sie bewirtschafteten; die Gutsherrschaft behielt ihr eigenes Land und ihren Wald. Eine Liquidationstabelle setzte für jedes Dorf die Höfe, ihr Land und das Kapital fest, mit dem die Regierung den früheren Besitzer für die Abgaben der Bauern entschädigte, und ließ den Bauern ihre Weide- und Holzrechte im herrschaftlichen Wald. Die Kommissare, die die Tabellen aufstellten, hörten beide Seiten: 1865 legte Miączyński Berufung gegen ihre Entscheidungen für die Bauern von Nowawies und für einen Kolonisten aus einem Nachbardorf ein, und 1867 und 1868 baten die Kolonisten von Łazińsk Warschau um die Waldrechte aus dem Privileg Hohenlohe-Ingelfingens von 1805. Für die Kolonie Łazińsk wurde die Tabelle 1868 bestätigt; ihre Rechte im Wald „Studzianka“ wurden 1882 bis 1884 neu festgesetzt und 1892 gegen 393 Morgen herrschaftliches Land aufgegeben, und 1896 wurde der ganze Anteil vermessen."
  ownership_en: "Count Włodzimierz Miączyński, Michalina's son, from her death in 1851 to his own in 1879; then his nephew Władysław Miączyński, and by 1892 Countess Maria Wielopolska, born Plater-Zyberk; from 1896 again a Miączyński, Count Tadeusz, Michalina's grandson. 1851 to 1901"
  ownership_de: "Graf Włodzimierz Miączyński, Michalinas Sohn, von ihrem Tod 1851 bis zu seinem eigenen 1879; dann sein Neffe Władysław Miączyński und spätestens 1892 Gräfin Maria Wielopolska, geb. Plater-Zyberk; ab 1896 wieder ein Miączyński, Graf Tadeusz, Michalinas Enkel. 1851 bis 1901"
  intro_en: "Michalina's son Count Włodzimierz Miączyński inherits an estate whose colonists hold their farms on contracts his family never signed. The colonists sue him in 1859 over pasture and wood in his forest; he answers with a counterclaim against ninety-seven of them, that the Hohenlohe contracts do not bind him. The Russian reform of 1864 then makes the peasants owners of the land they farm and fixes what remains owed to the manor — and what remains of the colonists' forest rights is fenced into numbers: pasture and fallen wood twice a week, until in 1892 they give even that up for 393 Morgen of land."
  intro_de: "Michalinas Sohn, Graf Włodzimierz Miączyński, erbt ein Gut, dessen Kolonisten ihre Höfe auf Verträgen halten, die seine Familie nie unterschrieben hat. Die Kolonisten verklagen ihn 1859 wegen Weide und Holz in seinem Wald; er antwortet mit einer Widerklage gegen siebenundneunzig von ihnen, dass die Hohenlohe-Verträge ihn nicht binden. Die russische Reform von 1864 macht dann die Bauern zu Eigentümern des Landes, das sie bewirtschaften, und setzt fest, was dem Gut noch geschuldet wird — und was von den Waldrechten der Kolonisten übrig bleibt, wird in Zahlen eingezäunt: Weide und Leseholz zweimal in der Woche, bis sie 1892 selbst das gegen 393 Morgen Land aufgeben."
  page_en: true
  page_de: true

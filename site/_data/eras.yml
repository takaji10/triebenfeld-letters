  label_en: "Trąbczyn in the Middle Ages"
  label_de: "Trąbczyn im Mittelalter"
  blurb_en: "Twenty-one medieval charters from the printed edition of the documents of Greater Poland, the Kodeks Dyplomatyczny Wielkopolski: the gifts, tithes and exchanges by which the abbey of Ląd came to hold Wrąbczynek, Kopojno, Zagórów and the tithe of Trąbczyn, the founding of the town of Zagórów in 1407, the gift of Trąbczyn to Count Mikołaj in 1276, and the knights and heirs of Trąbczyn in lawsuits and deeds to 1434."
  blurb_de: "Einundzwanzig mittelalterliche Urkunden aus der gedruckten Edition der großpolnischen Urkunden, dem Kodeks Dyplomatyczny Wielkopolski: die Schenkungen, Zehnten und Tauschgeschäfte, durch die das Kloster Ląd Wrąbczynek, Kopojno, Zagórów und den Zehnten von Trąbczyn erwarb, die Gründung der Stadt Zagórów 1407, die Schenkung Trąbczyns an den Grafen Mikołaj 1276 und die Ritter und Erben von Trąbczyn in Prozessen und Urkunden bis 1434."
  ownership_en: "The Cistercian abbey of Ląd, which held the villages around Trąbczyn, and the knights who held Trąbczyn itself. 1173 to 1440"
  ownership_de: "Das Zisterzienserkloster Ląd, dem die Dörfer um Trąbczyn gehörten, und die Ritter, denen Trąbczyn selbst gehörte. 1173 bis 1440"
  intro_en: "Land in this part of Europe changed hands by document, and Trąbczyn's documents begin with gifts. In 1173 Duke Mieszko gives the hamlet of Wrąbczynek to the new Cistercian abbey at Ląd; in 1240 Archbishop Fulko attaches the tithes of Zagórów, Skokum, Kopojno, Trąbczyn and their neighbours to the same abbey; in 1276 the duke gives Trąbczyn itself to Count Mikołaj, his treasurer at Ląd. The place grows up with two lords — the abbey holding tithes and the neighbouring land, knights holding Trąbczyn itself — and in 1407 the abbey's village of Zagórów becomes a town under Magdeburg law. The Middle Ages close with Trąbczyn in the hands of a family of knights whose heirs are already in lawsuits by 1346."
  intro_de: "Das Land in dieser Gegend wechselte per Urkunde den Besitzer, und die Urkunden von Trąbczyn beginnen mit Schenkungen. 1173 gibt Herzog Mieszko den Weiler Wrąbczynek dem neuen Zisterzienserkloster in Ląd; 1240 bindet Erzbischof Fulko die Zehnten von Zagórów, Skokum, Kopojno, Trąbczyn und ihrer Nachbarn an dasselbe Kloster; 1276 gibt der Herzog Trąbczyn selbst dem Grafen Mikołaj, seinem Schatzmeister in Ląd. Der Ort wächst mit zwei Herren auf — das Kloster mit Zehnten und dem Nachbarland, Ritter mit Trąbczyn selbst — und 1407 wird des Klosters Dorf Zagórów eine Stadt nach Magdeburger Recht. Das Mittelalter schließt damit, dass Trąbczyn einer Ritterfamilie gehört, deren Erben schon 1346 in Prozessen stehen."
  page_en: true
  page_de: true
- slug: "prusimski-boundary"
  order: 1
  status: "populated"
  count: 99
  first: "1589"
  last: "1791"
  label_en: "The Trąbczyn and Łukom boundary dispute"
  label_de: "Der Grenzstreit zwischen Trąbczyn und Łukom"
  blurb_en: "Two hundred years of argument between neighbouring estates over where one ended and the other began: mounds, blazed trees, a disputed pond-ground, and the Olęder settlement that was annexed along with the land it stood on. Twenty-three holdings are here: court orders and judgments from 1589 on, the decree of the commission of 1775, the entries of the Konin and Kalisz court registers that follow the quarrel from 1754 to 1788, a messenger's report of 1727 of a citation served at Szetlew, the decree of 1782 by which the Crown Tribunal settled the boundary, a newspaper report of 1754 on the funeral of Paweł Prusimski; and, from the last years before the partition, a hearth-tax register of 1789, the visitation of the parish of Trąbczyn of 1791, and the table of the parish's hearths and dues on a page of the Pyzdry court register of 1791 to 1792."
  blurb_de: "Zweihundert Jahre Streit zwischen benachbarten Gütern darüber, wo das eine endete und das andere begann. Dreiundzwanzig Bestände liegen vor: gerichtliche Anordnungen und Urteile seit 1589, das Dekret der Kommission von 1775, die Einträge der Gerichtsregister von Konin und Kalisch, die dem Streit von 1754 bis 1788 folgen, ein Botenbericht von 1727 über eine in Szetlew zugestellte Ladung, das Dekret von 1782, mit dem das Krontribunal die Grenze festlegte, ein Zeitungsbericht von 1754 über das Begräbnis Paweł Prusimskis; und aus den letzten Jahren vor der Teilung ein Register der Rauchfangsteuer von 1789, die Visitation der Pfarrei Trąbczyn von 1791 und die Tabelle der Rauchfangstände und Abgaben der Pfarrei auf einer Seite des Pyzdryner Gerichtsregisters von 1791 bis 1792."
  ownership_en: "The Trąmpczyński family, who held Trąbczyn until 1698, and after them the Prusimski family, against the owners of Łukom next door, from the seventeenth century the Chełmski family. 1589 to 1794"
  ownership_de: "Die Familie Trąmpczyński, der Trąbczyn bis 1698 gehörte, und nach ihr die Familie Prusimski, gegen die Besitzer des benachbarten Łukom, ab dem siebzehnten Jahrhundert die Familie Chełmski. 1589 bis 1794"
  intro_en: "From 1589 the estate belongs to families that fight over it — first with their neighbours, then with each other. Trąbczyn and Łukom are two estates whose boundary nobody had fixed with care, and for two hundred years the argument about mounds, notched trees and a flooded wood runs through the courts at Konin, Pyzdry and Kalisz, ending only in 1782, when the Crown Tribunal has forty-one mounds thrown up along a line drawn on the map. The same years bring the succession of the childless Prusimski brothers, adjudged on the Trąbczyn grounds in 1784, and a parish of 760 souls whose dissidents live almost all in the Olęder settlements."
  intro_de: "Von 1589 gehört das Gut Familien, die um es kämpfen — zuerst mit den Nachbarn, dann untereinander. Trąbczyn und Łukom sind zwei Güter, deren Grenze niemand mit Sorgfalt festgelegt hatte, und der Streit um Hügel, gekerbte Bäume und einen überschwemmten Wald läuft zweihundert Jahre durch die Gerichte in Konin, Pyzdry und Kalisz und endet erst 1782, als das Krontribunal einundvierzig Hügel entlang einer auf der Karte gezogenen Linie aufwerfen lässt. Dieselben Jahre bringen die Erbschaft der kinderlosen Brüder Prusimski, 1784 auf dem Grund von Trąbczyn zugesprochen, und eine Pfarrei von 760 Seelen, deren Dissidenten fast alle in den Olęder-Siedlungen leben."
  page_en: true
  page_de: true

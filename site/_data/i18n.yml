  home_h2: Über dieses Projekt
  home_p1: >-
    Polen wurde zwischen 1772 und 1795 aufgeteilt und hörte auf zu bestehen.
    Trąbczyn fiel an Preußen, und 1796 verschenkte der König es an Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, einen General, der es von Schlesien
    aus verwaltete und zur Tilgung seiner Schulden brauchte. Er schickte den
    Kriegs- und Forstrat Peter Friedrich von Triebenfeld, um Land in Geld zu
    verwandeln.
  home_p2: >-
    Dazu musste das Gut zerschlagen werden. Das Land, das der Gutsherr selbst bewirtschaftete, wurde in Stellen geteilt und auf ewig ausgetan, an Bauern und an Holländer: Siedler, die nach
    holländischem Recht saßen und in dieser Gegend seit Generationen Land urbar
    machten und entwässerten. Die Verträge sind erhalten: was jeder zahlte, was er
    jährlich schuldete und was er dafür aufgab.
  home_p3_pre: >-
    Preußen verlor den Krieg von 1806, und mit ihm ging das Gut. Die Briefe laufen
    noch neun Jahre weiter, durch eine Verhaftung, einunddreißig Prozesse zugleich und einen Winter auf dem Wiener Kongress, und enden mit einem Liquidationsregister über Schulden Hohenlohe-Ingelfingens von
  home_p3_sum: 1.414.377 Reichsthalern

  # page prose
  home_lede: >-
    Trąbczyn is a village in central Poland, in the flat farming country between
    the towns of Konin and Kalisz, a few kilometres from the small town of
    Zagórów. Traces in the Sand is an archive of the documents written about
    Trąbczyn and the land around it over more than seven hundred years, from
    1173 to the 1930s. The documents show who owned the estate of Trąbczyn, who
    farmed and settled its land, and who went to court over it. Each document is
    shown in its original language – Latin, Polish, German, French or Russian –
    with an English translation beside it.
  fig_documents: documents
  fig_span: span
  fig_people: people identified
  fig_places: places of writing
  card_about: About
  home_h2: The story of Trąbczyn in brief
  home_p1: >-
    For most of the seven centuries that the documents cover, Trąbczyn was a
    manor: a lord's house with its own home farm, surrounded by villages whose
    people owed the lord rent and labour. In the Middle Ages the Cistercian
    monks of the abbey of Ląd held much of the land around Trąbczyn, while a
    family of knights held Trąbczyn itself. From the sixteenth century Trąbczyn
    belonged to the Trąmpczyński family, who sold it in 1698 to Jan Prusimski of
    Kolno. For two hundred years the owners of Trąbczyn – first the
    Trąmpczyńskis, then the Prusimskis – argued in the courts with the owners of
    the neighbouring estate of Łukom, from the seventeenth century the Chełmski
    family, over where the boundary between the two estates ran. The quarrel
    over the boundary ended only in 1782, when the highest court of the Polish
    kingdom, the Crown Tribunal, had forty-one boundary mounds raised along the
    line it had fixed. From the 1740s the owners of Trąbczyn also let the
    estate's wet, low-lying ground to Olęder colonists: Protestant farmers, most
    of them German-speaking, who cleared and drained the land and held it on
    long leases that passed to their children.
  home_p2: >-
    Between 1772 and 1795 Poland's three neighbours – Prussia, Russia and
    Austria – divided Poland among themselves until the country no longer
    existed, and Trąbczyn fell to Prussia. The last Polish owner of Trąbczyn,
    Antoni Prusimski, fought in the Kościuszko uprising of 1794 against the
    three powers, and Prussia confiscated his estates. In 1796 the King of
    Prussia gave the confiscated estates to one of his generals, Prince
    Friedrich Ludwig of Hohenlohe-Ingelfingen. The Prince was deeply in debt. To
    raise money for his creditors, the Prince's agent, Peter Friedrich von
    Triebenfeld, broke up the home farms of the estates into plots and leased
    the plots to settlers on terms that passed to their heirs. In 1806 Napoleon
    defeated Prussia, and in 1807 the Duchy of Warsaw, a new Polish state that
    Napoleon had created, gave the estates back to Antoni Prusimski's daughter,
    Michalina. The Prince spent the next nine years trying to recover the
    estates. The loans that the Prince had raised against the land were fought
    over in the courts of Prussia and Poland, and before the Russian tsar, until
    1834.
  home_p3: >-
    In 1815, after Napoleon's fall, Trąbczyn became part of a new Kingdom of
    Poland ruled by the Russian tsar. When Michalina died in 1851, her son,
    Count Włodzimierz Miączyński, inherited the estate. With the estate he
    inherited the colonists as well. The colonists' rights to graze their
    animals and gather wood in the estate's forest rested on contracts that
    Count Miączyński's family had never signed, and in 1859 the colonists took
    the Count to court over those forest rights. In 1864 a reform decreed by the
    tsar made the peasants of the Kingdom of Poland the owners of the land they
    farmed. In 1892 the colonists of Trąbczyn gave up their last rights in the
    forest in exchange for land of their own. By the 1930s the manor had been
    divided up. In 1935 and 1936 the historian Albert Breyer visited two
    German-speaking villages on the old estate – Łazińsk, the oldest of the
    Olęder colonies, and Emilienheim, a colony founded by the Prince – and wrote
    down what the villagers remembered of their history, only a few years before
    the Second World War destroyed their community.
  home_p4: >-
    Besides the archival documents, Traces in the Sand brings together the books
    and articles that historians have written about Trąbczyn, newspaper reports
    about the estate and the area around it from 1754 to 2015, family trees of
    the estate's owners, old maps of the estate and its colonies, and a survey
    of the Evangelical (Protestant) cemeteries of the area.

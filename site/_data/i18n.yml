  card_about: Über
  home_h2: Über dieses Projekt
  home_p1: >-
    Polen wurde zwischen 1772 und 1795 aufgeteilt und hörte auf zu bestehen.
    Trąbczyn fiel an Preußen, und 1796 verschenkte der König es an Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, einen General, der es von Schlesien
    aus verwaltete und zur Tilgung seiner Schulden brauchte. Er schickte den
    Kriegs- und Forstrat Peter Friedrich von Triebenfeld, um Land in Geld zu
    verwandeln.
  home_p2: >-
    Dazu musste das Gut zerschlagen werden. Das Land, das der Gutsherr selbst bewirtschaftete, wurde in Stellen geteilt und auf ewig ausgetan, an Bauern und an Holländer: Siedler, die nach
    holländischem Recht saßen und in dieser Gegend seit Generationen Land urbar
    machten und entwässerten. Die Verträge sind erhalten: was jeder zahlte, was er
    jährlich schuldete und was er dafür aufgab.
  home_p3_pre: >-
    Preußen verlor den Krieg von 1806, und mit ihm ging das Gut. Die Briefe laufen
    noch neun Jahre weiter, durch eine Verhaftung, einunddreißig Prozesse zugleich und einen Winter auf dem Wiener Kongress, und enden mit einem Liquidationsregister über Schulden Hohenlohe-Ingelfingens von
  home_p3_sum: 1.414.377 Reichsthalern
  people_h1: Personen in den Dokumenten
  places_h1: Ausstellungsorte
  timeline_h1: Zeitleiste
  tl_era_note_medieval: >-
    1173 bis 1444. Trąbczyn und seine Nachbarn in den mittelalterlichen Urkunden Großpolens: das Zisterzienserkloster Ląd, das Wrąbczynek, Kopojno, Zagórów und den Zehnten von Trąbczyn erwarb, und die Ritter und Erben, die Trąbczyn selbst besaßen.
  tl_era_note_prusimski: >-
    1589 bis 1794. Trąbczyn unter seinen polnischen Besitzern, den Familien Trąmpczyński und dann Prusimski, und ihr zweihundertjähriger Streit mit dem benachbarten Łukom. Die Zeit endet, als Antoni Prusimski nach dem gescheiterten Kościuszko-Aufstand flieht.
  tl_era_note_hohenlohe: >-
    1794 bis 1807. Preußen zieht die Güter des geflohenen Prusimski ein, und der König schenkt sie Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, der sie besitzt, bis das Herzogtum Warschau sie ihm nimmt.
  tl_era_note_restitution: >-
    Ab 1807. Die Güter gehen an Prusimskis Tochter zurück. Um den Anspruch Hohenlohe-Ingelfingens und um die Forderungen seiner Gläubiger wird noch fünfundzwanzig Jahre gestritten.
  tl_era_note_wlodzimierz: >-
    Michalina Miączyńska stirbt 1851, und ihr Sohn, Graf Włodzimierz Miączyński, besitzt das Gut bis zu seinem Tod 1879. 1859 und 1860 streiten er und die Kolonisten des Gutes vor Gericht um ihre Rechte in seinem Wald. Nach der Reform von 1864 erhalten die Kolonisten von Łazińsk 1868 ihr Land; ihre Rechte im herrschaftlichen Wald werden 1884 festgesetzt und 1892 gegen Land getauscht.
  tl_era_note_twentieth: >-
    Der Gutshof ist parzelliert, und auf seinem früheren Land liegen deutsche Siedlungen der Gemeinde Trąbczyn. 1935 und 1936 schreibt Albert Breyer auf, woran sich ihre Bewohner erinnern.

  home_h2: Die Geschichte von Trąbczyn in Kürze
  home_p1: >-
    Die meiste Zeit der sieben Jahrhunderte, die die Dokumente umfassen, war
    Trąbczyn ein Gut: ein Herrenhaus mit eigenem Vorwerk, umgeben von Dörfern,
    deren Bewohner dem Gutsherrn Zins und Dienste schuldeten. Im Mittelalter
    hielten die Zisterziensermönche der Abtei Ląd einen großen Teil des Landes
    um Trąbczyn, während eine Ritterfamilie Trąbczyn selbst hielt. Seit dem
    sechzehnten Jahrhundert gehörte Trąbczyn der Familie Trąmpczyński, die es
    1698 an Jan Prusimski aus Kolno verkaufte. Zweihundert Jahre lang stritten
    die Besitzer von Trąbczyn – erst die Trąmpczyński, dann die Prusimski – vor
    Gericht mit den Besitzern des Nachbarguts Łukom, ab dem siebzehnten
    Jahrhundert der Familie Chełmski, darüber, wo die Grenze zwischen den beiden
    Gütern verlief. Der Grenzstreit endete erst 1782, als das oberste Gericht
    des polnischen Königreichs, das Krontribunal, entlang der von ihm
    festgelegten Linie einundvierzig Grenzhügel aufschütten ließ. Seit den
    1740er Jahren gaben die Besitzer von Trąbczyn außerdem das nasse, tief
    gelegene Land des Gutes an Olęder-Kolonisten aus: evangelische Bauern, die
    meisten deutschsprachig, die das Land rodeten und entwässerten und es auf
    lange Pacht hielten, die auf ihre Kinder überging.
  home_p2: >-
    Zwischen 1772 und 1795 teilten Polens drei Nachbarn – Preußen, Russland und
    Österreich – Polen unter sich auf, bis das Land nicht mehr bestand, und
    Trąbczyn fiel an Preußen. Der letzte polnische Besitzer von Trąbczyn, Antoni
    Prusimski, kämpfte 1794 im Kościuszko-Aufstand gegen die drei Mächte, und
    Preußen zog seine Güter ein. 1796 schenkte der König von Preußen die
    eingezogenen Güter einem seiner Generäle, Fürst Friedrich Ludwig zu
    Hohenlohe-Ingelfingen. Der Fürst war tief verschuldet. Um Geld für seine
    Gläubiger aufzubringen, zerschlug sein Bevollmächtigter, Peter Friedrich von
    Triebenfeld, die Vorwerke der Güter in Stellen und gab sie Siedlern in
    Erbpacht aus. 1806 besiegte Napoleon Preußen, und 1807 gab das Herzogtum
    Warschau, ein neuer polnischer Staat, den Napoleon geschaffen hatte, die
    Güter Antoni Prusimskis Tochter Michalina zurück. Der Fürst versuchte die
    folgenden neun Jahre lang, die Güter zurückzugewinnen. Um die Darlehen, die
    der Fürst auf das Land aufgenommen hatte, wurde vor den Gerichten Preußens
    und Polens und beim russischen Zaren bis 1834 gestritten.
  home_p3: >-
    1815, nach Napoleons Sturz, wurde Trąbczyn Teil eines neuen Königreichs
    Polen unter dem russischen Zaren. Als Michalina 1851 starb, erbte ihr Sohn,
    Graf Włodzimierz Miączyński, das Gut. Mit dem Gut erbte er auch die
    Kolonisten. Die Rechte der Kolonisten, ihr Vieh im Wald des Gutes zu weiden
    und dort Holz zu sammeln, beruhten auf Verträgen, die die Familie des Grafen
    nie unterschrieben hatte, und 1859 verklagten die Kolonisten den Grafen um
    diese Waldrechte. 1864 machte eine Reform des Zaren die Bauern des
    Königreichs Polen zu Eigentümern des Landes, das sie bebauten. 1892 gaben
    die Kolonisten von Trąbczyn ihre letzten Rechte am Wald gegen eigenes Land
    auf. In den 1930er Jahren war das Gut aufgeteilt. 1935 und 1936 besuchte der
    Historiker Albert Breyer zwei deutschsprachige Dörfer auf dem alten Gut –
    Łazińsk, die älteste der Olęder-Kolonien, und Emilienheim, eine Kolonie, die
    der Fürst gegründet hatte – und schrieb auf, woran sich die Dorfbewohner aus
    ihrer Geschichte erinnerten, nur wenige Jahre bevor der Zweite Weltkrieg
    ihre Gemeinschaft zerstörte.
  home_p4: >-
    Neben den Archivdokumenten vereint Spuren im Sand die Bücher und Aufsätze,
    die Historiker über Trąbczyn geschrieben haben, Zeitungsberichte über das
    Gut und seine Umgebung von 1754 bis 2015, Stammbäume der Besitzer des Gutes,
    alte Karten des Gutes und seiner Kolonien und eine Aufnahme der
    evangelischen Friedhöfe der Gegend.

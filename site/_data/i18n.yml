# Interface strings, English and German.
#
# The German pages under /de/ are rendered from this at build time. The letter
# pages are shared between the two languages - the documents are the same
# whichever language you read the site in - so their labels are swapped in the
# browser from the same strings, emitted into the page by _layouts/letter.html
# and applied by assets/i18n.js.
#
# "About the edition" is deliberately absent: that essay explains the edition's
# own method and standards, and it stays in English until it can be rendered
# into German by hand rather than by machine. The German nav links to it and
# says so.


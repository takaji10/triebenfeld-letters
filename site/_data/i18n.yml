  # page prose
  home_lede: >-
    Trąbczyn ist ein Dorf in Mittelpolen, im flachen Ackerland zwischen den
    Städten Konin und Kalisch, wenige Kilometer von der kleinen Stadt Zagórów.
    Spuren im Sand ist ein Archiv der Dokumente, die über mehr als siebenhundert
    Jahre, von 1173 bis in die 1930er Jahre, über Trąbczyn und das Land ringsum
    geschrieben wurden. Die Dokumente zeigen, wem das Gut Trąbczyn gehörte, wer
    sein Land bebaute und besiedelte und wer darum vor Gericht stritt. Jedes
    Dokument steht in seiner Originalsprache – Latein, Polnisch, Deutsch,
    Französisch oder Russisch – mit einer englischen Übersetzung daneben.
  fig_documents: Dokumente

  # page prose
  home_lede: >-
    Achtzehn Jahre Korrespondenz zwischen <strong>Peter Friedrich von Triebenfeld</strong>,
    Gutsverwalter, und <strong>Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen</strong>,
    preußischem General. Die Briefe laufen über den Zusammenbruch des fürstlichen Vermögens
    hinweg, die Niederlage Preußens bei Jena und Auerstedt, den Verlust der polnischen Güter und
    den Wiener Kongress.
  fig_documents: Dokumente
  fig_span: Zeitraum
  fig_people: Personen identifiziert
  fig_places: Ausstellungsorte
  card_browse_p: >-
    Alle %d Dokumente, im Volltext durchsuchbar und filterbar nach Jahr, Person, Ort und Zustand.
  card_timeline_p: >-
    Die Korrespondenz vor dem Hintergrund der Ereignisse, die sie prägten, von Jena bis zum Wiener
    Kongress.
  card_people_p: >-
    Wer in den Briefen vorkommt, wie sicher die Identifizierung jeweils ist und wo die
    Belege stehen.
  card_about: Über diese Edition
  card_about_p: >-
    Wie der Text erstellt wurde, was die editorischen Zeichen bedeuten und was ungeklärt bleibt.
  home_h2: Wovon die Briefe handeln
  home_p1: >-
    Die Korrespondenz beginnt 1798, als Triebenfeld in Berlin dafür wirbt, die nach der
    Dritten Teilung verliehenen polnischen Güter des Fürsten gegen preußische Domänen zu
    tauschen, um dessen Schulden zu tilgen. Der Tausch scheitert, und was folgt, ist ein
    langes Auseinanderfallen: Anleihen auf die Güter, Kolonisationspläne zur Steigerung der
    Einkünfte und eine immer längere Reihe von Gläubigern.
  home_p2: >-
    Nach der preußischen Niederlage von 1806 fallen die Güter an das Herzogtum Warschau und werden
    sequestriert. Triebenfeld wird in Berlin von französischer Gendarmerie verhaftet; 1811 führt
    er einunddreißig Prozesse zugleich. 1814 wird er zum Wiener Kongress entsandt, um Rückgabe zu
    erwirken, und schreibt mittellos nach Hause. Er rechnet die Kosten des Kaffees auf, während er
    Metternich und Talleyrand durch die Verhandlungen verfolgt.
  home_p3_pre: >-
    Die Briefe enden im persönlichen Ruin auf beiden Seiten. Ein am Schluss aufgestelltes
    Liquidationsregister verzeichnet Schulden von
  home_p3_sum: 1.414.377 Reichsthalern
  people_h1: Personen in den Briefen
  people_lede: >-
    Alle, die oft genug genannt werden, um sie durch die Korrespondenz zu verfolgen. Die
    Häufigkeiten stammen aus dem Text selbst; die Identifizierungen und ihre Belege sind
    vollständig im Personenverzeichnis des Projekts dargelegt. Die Namen folgen den für diese
    Edition festgelegten Schreibweisen. Siehe
  places_h1: Ausstellungsorte
  places_lede: >-
    Woher die Briefe geschrieben wurden, nach der Datumszeile des jeweiligen Briefes. Unter
    <em>Unbekannt</em> zusammengefasst, wo kein Ort genannt ist. Beilagen, Rechtsurkunden und
    eilige Notizen tragen häufig keinen, und dieses Fehlen wird verzeichnet statt erraten.
  timeline_h1: Zeitleiste
  timeline_lede: >-
    Die Korrespondenz vor dem Hintergrund der Ereignisse, die sie prägten. Die Balken zeigen, wie
    viele Briefe aus jedem Jahr überliefert sind. Das Fast-Verstummen von 1807 und die Flut von
    1815 sind die Geschichte im Umriss. Klicken Sie ein Jahr an, um die Briefe daraus zu lesen.

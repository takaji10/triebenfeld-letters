  movements_h2: Was geschah
  movements:
    - lead: "1798-99 &middot; Der gescheiterte Gütertausch."
      body: >-
        Lobbyarbeit in Berlin, um die polnischen Güter gegen preußische Krondomänen zu
        tauschen und damit die Schulden des Fürsten zu tilgen. Es kommt nicht dazu.
    - lead: "1800-1806 &middot; Die Schuldenverwaltung wird zur ganzen Aufgabe."
      body: >-
        Güter werden verkauft und beliehen, Kolonisationsvorhaben sollen Einnahmen
        bringen, die Zahl der Gläubiger wächst.
    - lead: "1806-1809 &middot; Die Katastrophe."
      body: >-
        Jena, Prenzlau, Tilsit. Die Güter geraten unter fremde Staatshoheit und werden
        sequestriert; Triebenfeld wird verhaftet und bleibt mittellos zurück.
    - lead: "1809-1812 &middot; Rechtskrieg an allen Fronten."
      body: >-
        Einunddreißig gleichzeitige Prozesse, ein betrügerischer Sequestor und ein
        konkurrierender Erbe, der um Trąbczyn prozessiert.
    - lead: "1813-1815 &middot; Wien."
      body: >-
        Ein bankrotter Bevollmächtigter auf dem Kongress, der um Rückgabe bittet, während
        um ihn herum die Landkarte Polens neu gezeichnet wird.
    - lead: "1815-16 &middot; Der persönliche Ruin."
      body: >-
        Das Verhältnis vergiftet sich; Triebenfelds Tochter stirbt.

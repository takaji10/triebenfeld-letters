  # page prose
  home_lede: >-
    Eighteen years of correspondence between <strong>Peter Friedrich von Triebenfeld</strong>,
    estate manager, and <strong>Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen</strong>,
    Prussian general. The letters run across the collapse of the Prince's fortune, the defeat of
    Prussia at Jena and Auerstädt, the loss of his Polish estates, and the Congress of Vienna.
  fig_documents: documents
  fig_span: span
  fig_people: people identified
  fig_places: places of writing
  card_browse_p: >-
    All %d documents, searchable in full and filterable by year, person, place and condition.
  card_timeline_p: >-
    The correspondence set against the events that shaped it, from Jena to the Congress of Vienna.
  card_people_p: >-
    Who appears in the letters, how firmly each is identified, and where to find them.
  card_about: About this edition
  card_about_p: >-
    How the text was established, what the editorial marks mean, and what remains uncertain.
  home_h2: What the letters are about
  home_p1: >-
    The correspondence opens in 1798 with Triebenfeld lobbying in Berlin to exchange the Prince's
    Polish estates, granted after the Third Partition, for Prussian crown domains, in order to
    clear his debts. The exchange fails, and what follows is a long unravelling: loans against the
    estates, colonisation schemes to raise revenue, and an ever-lengthening list of creditors.
  home_p2: >-
    After the Prussian defeat of 1806 the estates fall under the Duchy of Warsaw and are
    sequestered. Triebenfeld is arrested in Berlin by French gendarmerie; by 1811 he is
    running thirty-one lawsuits at once. In 1814 he is sent to the Congress of Vienna to
    petition for restitution, and writes home destitute, itemising the cost of coffee
    while tracking Metternich and Talleyrand through the negotiations.
  home_p3_pre: >-
    The letters end in personal ruin on both sides. A liquidation register drawn up at the
    close lists debts of
  home_p3_sum: 1,414,377 Reichsthaler
  people_h1: People in the letters
  people_lede: >-
    Everyone named often enough to trace through the correspondence. Occurrence counts come from
    the text itself; identifications and their evidence are set out in full in the project's
    who's-who. Names use the spellings established for this edition. See
  places_h1: Places of writing
  places_lede: >-
    Where the letters were written from, taken from each letter's own dateline. Grouped under
    <em>Unknown</em> where no place is given. Enclosures, legal instruments and hurried notes
    often carry none, and that absence is recorded rather than guessed at.
  timeline_h1: Timeline
  timeline_lede: >-
    The correspondence set against the events that shaped it. The bars show how many letters
    survive from each year. The near-silence of 1807 and the flood of 1815 are the story in
    outline. Click any year to read the letters from it.

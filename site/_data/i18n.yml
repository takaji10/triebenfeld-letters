  # page prose
  home_lede: >-
    Trąbczyn ist ein Dorf und Gut in Mittelpolen, im Land zwischen Konin und
    Kalisch. Dies ist sein Archiv: die Akten derer, die es besaßen, verkauften,
    besiedelten und beklagten, im deutschen, französischen und polnischen
    Original und in englischer Übersetzung. Veröffentlicht sind bisher die elf
    Jahre, in denen ein preußischer Fürst das Gut hielt, die neun, die er darauf
    verwandte, es zurückzugewinnen, und der Streit um seine Schulden auf dem Gut,
    der bis 1832 andauerte.

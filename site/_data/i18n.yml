  movements:
    - lead: "1798-99 &middot; The land swap that fails."
      body: >-
        Lobbying in Berlin to trade the Polish estates for Prussian crown domains, to
        clear the Prince's debts. It does not come off.
    - lead: "1800-1806 &middot; Debt management becomes the whole job."
      body: >-
        Estates sold and mortgaged, colonisation schemes to raise revenue, creditors
        multiplying.
    - lead: "1806-1809 &middot; Catastrophe."
      body: >-
        Jena, Prenzlau, Tilsit. The estates pass to a foreign state and are sequestered;
        Triebenfeld is arrested and left destitute.
    - lead: "1809-1812 &middot; Legal war on every front."
      body: >-
        Thirty-one simultaneous lawsuits, a fraudulent sequestor, and a rival heir
        litigating for Trąbczyn.
    - lead: "1813-1815 &middot; Vienna."
      body: >-
        A bankrupt agent at the Congress, petitioning for restitution while the map of
        Poland is redrawn around him.
    - lead: "1815-16 &middot; Personal ruin."
      body: >-
        The relationship curdles; Triebenfeld's daughter dies.


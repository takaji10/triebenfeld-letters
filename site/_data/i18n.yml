  # page prose
  home_lede: >-
    Trąbczyn is a village and estate in central Poland, in the country between
    Konin and Kalisz. This is its archive: the papers of the people who owned it,
    sold it, settled it and went to law over it, in the original German, French
    and Polish and in English translation. What is published so far covers the
    eleven years a Prussian prince held the place, the nine he spent trying to
    get it back, and the dispute over his debts on the estate, which ran on until
    1832.
  fig_documents: documents
  fig_span: span
  fig_people: people identified
  fig_places: places of writing
  card_about: About
  home_h2: About this project
  home_p1: >-
    Poland was partitioned out of existence between 1772 and 1795. Trąbczyn ended
    up in the Prussian share, and in 1796 the King gave it away, to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, a general who ran it from Silesia and
    needed it to pay his debts. He sent Peter Friedrich von Triebenfeld, Councillor
    of War and Forests, to turn land into money.
  home_p2: >-
    The way to do that was to break the estate up. The land the lord farmed himself was divided into holdings and let out for good, to farmers and to Hollanders: settlers
    who held on a Dutch-derived tenure and had been clearing and draining land in
    this part of Poland for generations. The contracts survive: what each man
    paid, what he owed every year, and what he gave up to get it.
  home_p3_pre: >-
    Prussia lost the war of 1806 and the estate went with it. The letters run on for nine more years, through an arrest, thirty-one lawsuits at once and a winter at the Congress of Vienna, and end with a liquidation register listing debts of Hohenlohe-Ingelfingen of
  home_p3_sum: 1,414,377 Reichsthaler
  people_h1: People in the documents
  places_h1: Places of writing
  timeline_h1: Timeline
  tl_era_note_medieval: >-
    1173 to 1444. Trąbczyn and its neighbours in the medieval charters of Greater Poland: the Cistercian abbey of Ląd, which came to hold Wrąbczynek, Kopojno, Zagórów and the tithe of Trąbczyn, and the knights and heirs who held Trąbczyn itself.
  tl_era_note_prusimski: >-
    1589 to 1794. Trąbczyn under its Polish owners, the Trąmpczyński and then the Prusimski family, and their two centuries of quarrel with Łukom next door. It ends when Antoni Prusimski flees after the failed Kościuszko Uprising.
  tl_era_note_hohenlohe: >-
    1794 to 1807. Prussia confiscates the estates of the fugitive Prusimski, and the King gives them to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, who holds them until the Duchy of Warsaw takes them away.
  tl_era_note_restitution: >-
    From 1807. The estates go back to Prusimski's daughter. Hohenlohe-Ingelfingen's claim to them, and the claims of his creditors, are argued for another twenty-five years.
  tl_era_note_wlodzimierz: >-
    Michalina Miączyńska dies in 1851, and her son, Count Włodzimierz Miączyński, holds the estate until his death in 1879. In 1859 and 1860 he and its colonists go to law over their rights in his forest. After the reform of 1864 the colonists of Łazińsk are given their land in 1868; their rights in the manor forest are fixed in 1884 and exchanged for land in 1892.
  tl_era_note_twentieth: >-
    The manor has been parcelled out, and its former land holds German settlements of the commune of Trąbczyn. In 1935 and 1936 Albert Breyer writes down what their people remember.

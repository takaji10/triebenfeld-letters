agad1174016-001: 'An entry in the register of the Governing Commission, in Polish: an order to the Director of Internal Affairs, given at Warsaw at the session of 12 July 1807. The commission sends him a certified copy of the decree of the Emperor of the French and King of Italy, given at Finckenstein on 5 June, which returns to its member Wybicki the possession of the estates of Manieczki, Przylepki, Boreczek and Esterpol, sequestrated in the department of Poznań and disposed of by the Prussian government, and charges the provisional Polish government with carrying it out. The director is to carry out the decree without delay: to order the administrative chamber of the department of Poznań to hand the estates over for Wybicki, and to have him put in possession at once. Under the entry stand the names of the president, Stanisław Małachowski, and the secretary general, Jan Łuszczewski.'
agad1174016-002: An entry in the register of the Governing Commission, in Polish, which opens the record of the resolutions the commission took during its stay at Dresden. The resolution of 21 July 1807 brings the hereditary estates of Michalina Dąbska, General Niemojewski and Wichrowski, confiscated by the Prussian government, under the judgment the Emperor gave in favour of Wybicki. The case of Michalina Dąbska, born Prusimska, has been referred to the commission by the Emperor; following the decree of 5 June given at Finckenstein, the commission extends the judgment to the three cases, so that the estates return to their true owners. Under the entry stand the names of the president, Stanisław Małachowski, and the secretary general, Jan Łuszczewski.
agad11740273-001: 'Draft of a resolution of the Governing Commission, taken at Dresden, in Polish. The case of Michalina Dąbska, born Prusimska, who asks for the return of her hereditary estates, confiscated under the former government and given to others, has been referred to the commission by the Emperor. The commission takes as its example the justice the Emperor did its member Wybicki by the decree of June given at Finckenstein, and extends that judgment to the case of Michalina Dąbska, of General Niemojewski and of Wichrowski: the hereditary estates of these persons, confiscated by the former Prussian government, are to return to their true owners. The draft is corrected in several places and carries the paraph of the president, Małachowski.'
agad11740273-002: 'Michalina Dąbska, born Prusimska, writes at Dresden to the Governing Commission, in Polish. She has twice asked for the return of the estates confiscated from her father for the benefit of the Prussian generals Prince Hohenlohe, Bischoffswerder and Sanitz: Trąbczyn in the department of Kalisz, and Kamionna, Kolno, Pawłowo, Pawłówko and a storehouse at a place written “Włocławek” in the department of Poznań. She has had no answer. Knowing that Wybicki has had his estates, confiscated like hers, given back by the Emperor, she asks the commission to intercede for her and to give her the means of obtaining the same judgment. The commission notes the petition as presented on 21 July.'
agad11740273-003: Michalina Dąbska, born Prusimska, petitions the Emperor Napoleon at Dresden, in French. She has already had her complaints and hopes laid before him through the Polish government, but has so far heard nothing of a decree restoring her to the estates that were confiscated for the benefit of the Prussian generals Prince Hohenlohe, Bischoffswerder and Sanitz. She is persuaded that the same justice that restored Count Wybicki to his possessions will be done to her, and begs the Emperor not to refuse it. By the commission's note the petition was presented on 21 July 1807, at an extraordinary session at Dresden, by the Prince Director of War, on the Emperor's order; the note carries the paraph of the president, Małachowski, to whom the leaf is addressed on the back.
agad11740273-004: Michalina Dąbska, born Prusimska, writes again at Dresden to the Governing Commission, in Polish. The Emperor's decree of 5 June, which gave back to Wybicki the estates confiscated and disposed of by the Prussian government, was taken as the principle and pattern for doing equal justice to the persons named in the commission's decree of 21 July. She does not doubt that the commission will have its resolution carried out in the same way as for Wybicki, and will direct the Directorate of Internal Affairs to order the administrative chambers to put her in possession of the estates. The commission notes the petition as presented on 23 July 1807 and files it.
app53150kaliszgr414-001: 'The record of a delivery of possession, carried out on 4 November 1771 in the Lusnia wood and entered in the records of the castle court at Kalisz on 9 November; the original is sewn into the book. The sworn commissioner of the provinces of Poznań and Kalisz, Wawrzyniec Wstowski, acts at the request of Stanisław Ścibor Chełmski, heir of Łukomia, who has won at law. He recites the judgments on which the delivery rests: a condemnation of 1761, decrees of the Crown Tribunal of 1766, 1767 and 1768 under which the estates of Łukom and Trąbczyn were to be divided by a boundary, and a third condemnation of 1770 against Antoni Prusimski, Starost of Niszczewice, for contravention. In the presence of three noblemen, of the Trąbczyn steward Józef Jaroszewski and of a court messenger he hands over to Chełmski the pine forest and wood called Lusnia as belonging to Łukomia from of old, with the Olęder settlement founded in it not long before: a tavern house with a new stable, without a keeper, and twelve Olęder settlers, who are named. No one objects; an inventory is drawn up, Chełmski is left in peaceful possession, and the settlers are ordered to obey him.'
app53170koningr114-001: The report of the court messenger Bartłomiej Szepczyński of the village of Trąbczyn, entered in the records of the castle court at Konin on 22 April 1767. At the request of Antoni Prusimski of Kolno, heir of Trąbczyn, he went onto the estate on Holy Saturday with two noblemen, Stanisław Lipiński and Józef Rudkowski, and inspected an embankment lately raised at the end of the pond-ground. Because of the embankment the water that flows from the pond-ground through the Trąbczyn lands backed up and flooded the Olęder settlers living in the Trąbczyn woods, with their manured fields and their meadows. He states that this was done by people of the neighbouring estate of Łukom on the order of its heir.
app53170koningr114-002: A second report of the court messenger Bartłomiej Szepczyński of Trąbczyn on the same embankment, entered in the records of the castle court at Konin on 6 August 1767. At the request of Antoni Prusimski of Kolno he went onto the estate again on the Friday after Saint James with two noblemen, Józef Gołembiewski and Rudkowski. The embankment is raised in the wood on the pond-ground, by the boundary of the Łukom lands, on Trąbczyn ground; the water dammed in the pond spills onto the fields and meadows of the Trąbczyn Olęder settlers, so that the meadows of four of them are flooded and cannot be mown. The messenger declares with the two noblemen that the embankment was raised some years ago by the heirs of Łukomia and has now been repaired.
app53170koningr115-001: 'A register note in the book of the castle court at Konin, January 1768: the report of the citation that Stanisław Chełmski obtained against Antoni Prusimski and the successors of the late Prusimska, born Rozdrażewska, before the Kalisz land court is among the documents produced.'
app53170koningr115-002: Two register notes of 17 May 1768 on citations before the Crown Tribunal at Bydgoszcz. Antoni Prusimski of Kolno, Starost of Niszczewice, has had the Chełmskis, the Żychliński heirs, Ignacy Gałecki, Starost of Bydgoszcz, and the abbot and convent of Ląd cited, for the fixing of the boundary; Stanisław Chełmski for his part the abbot Słowiecki and the convent of Ląd, Prusimski and Gałecki. Both notes are transcribed only in part.
app53170koningr115-003: 'A register note of May 1768: for Antoni Prusimski of Kolno, Starost of Niszczewice, an authentic extract from the records of the castle court at Bydgoszcz is brought in; it contains the approbation, declared by him there, of the term for quashing the condemnation.'
app53170koningr115-004: 'A register note of 2 December 1771: for Stanisław Ścibor Chełmski, heir of Łukomia, the delivery of possession of the Lusnia wood with the Olęder settlers is brought in; it is among the documents produced.'
app53170koningr115-005: 'An entry of 20 December 1771. The court messenger Nicolaus Krzepczyński of Myszaków, by special commission of Stanisław Ścibor Chełmski, lays weapons before the castle office at Konin: four sabres in sheaths with belts and one unsheathed, four spears with iron points, three long guns and one gun mounted with brass, loaded with lead and fine powder. He states that Chełmski took them on the Monday before in the Lusnia wood, when Antoni Prusimski of Kolno, Starost of Niszczewice, broke in there by force and armed men besieged the innkeeper''s house. The messenger takes the weapons back.'
app53170koningr115-006: A report of the court messenger Nicolaus Krzepczyński of 20 December 1771, for Stanisław Ścibor Chełmski. With two noblemen, Antoni Wolski and Konstanty Folwarski, he inspected the ground of Łukomia and the Lusnia wood on the Monday before. At the pond-ground in the Łukom wood they saw the embankment dug through, the weir with its posts, sluices and channels hacked with axes and wholly removed, and the water let out with the fish; twenty thick clubs, freshly cut, lay there. In the tavern house among the Olęder settlers in the Lusnia wood eight loopholes had been cut in the walls all round and three windows shot out. He states that the breaking of the embankment was done by more than thirty subjects of Trąbczyn in Prusimski's presence, and the shooting through of the house by his men at his order, on the same day.
app53170koningr115-007: 'A report of the court messenger Joannes Bikierski of Węgierce of 1 December 1772, for Stanisław Ścibor Chełmski, heir of Łukom, Łomowo and Myszakowo and possessor of the Olęder settlers in the Lusnia wood. With two noblemen he inspected the tavern in Lusnia on the Saturday before: three windows and four doors with iron hinges had been taken out of the house. He states that this was done that night by the Trąbczyn steward Lipiński, the clerk Radzewski, the bailiff and forest keeper and the manor servant Wąchnicki, at the order of Antoni Prusimski, and that the pieces were carried off to Trąbczyn, with a table and a barrel of beer, by a band of Trąbczyn subjects.'
app53170koningr115-008: 'A report of the court messenger Bartłomiej Szepczyński of Trąbczyn of 26 February 1773, for Antoni Prusimski of Kolno, Starost of Niszczewice. With two noblemen he inspected and counted, the day before, in the woods and meadows of Trąbczyn: in the wood beyond the Lusnia grove fifty-one stumps of felled pines fit for building, and on the meadows called Kąty thirty-two alder stumps. He states that Chełmski''s subjects carted the timber out of the wood, and that men of the Podbiele estate of the lady Zakrzewska cut the alders on the meadows.'
app53170koningr115-009: A protest of Stanisław Ścibor Chełmski, heir of Łukom and possessor of the Olęder settlers of Lusnia, against Antoni Prusimski of Kolno, Starost of Niszczewice, his household and his subjects, entered at Konin in March 1773 and signed by Chełmski. Prusimski, although he knows that possession of the Lusnia settlers has been adjudged to Chełmski at law, let his steward Lipiński and his chamber servant Marzęcki, with others, ride upon the tavern and the settlers; they committed acts of violence there.
app53170koningr115-010: 'A report of the court messenger Joannes Bikierski of Węgierki, entered at Konin in March 1773, for Stanisław Chełmski. With two noblemen he inspected the Olęder settlement of Lusnia on the Wednesday before: in the tavern the stove, three windows and four doors, which Chełmski had newly had put in order, were hacked and cut out, the chimney was ruined, and the vessels for beer and spirits were smashed. He states that this was done by the noblemen Lipiński, Marzęcki and others in the night of 29 January of the current year.'
app53170koningr136-001: 'The report of the court messenger Bartłomiej Szeptycki of Trąbczyn, entered in the records of the castle court at Konin on 12 July 1754, with the inspection he had made on 9 July at the request of Katarzyna Prusimska, born Rozdrażewska. She is the widow of Paweł Prusimski, the King''s chamberlain and heir of Trąbczyn, who had died shortly before, and holds her dower and a life interest in all his estates. The inspection describes the buildings of the manor farm at Trąbczyn one by one: the old manor house is past repair and a new one stands finished in the frame; then come the kitchen, four barns, the sheepfold, the granary, the stables and sties, the distillery and the malthouse with their gear. At Nowa Wieś there are fifteen Olęder settlers, and the sixteenth plot is empty. A list counts the people who owe labour in Trąbczyn, Osiny, Łazy and Nowa Wieś as full farmers, half-farmers, cottagers and lodgers. Two noblemen, Kazimierz Świerczewski and Józef Puchalski,
  state over their signatures that in the pine woods of Trąbczyn, from Osiny to the Biskupice boundary and round Łazy, the better trees have been felled or picked out and only the leavings stand, and the same of the oaks, except where the Olęder settlers have taken the timber on their plots. The description of the village houses in the middle of the entry is not transcribed.'
app53170koningr145-001: The decree of a boundary commission, entered in the castle court records at Brześć Kujawski on 23 September 1776 and copied from an extract of them into the court book of Konin. The commission was appointed by an act of parliament, recorded at Warsaw on 1 June 1774, to decide once and for all the boundary dispute, decades old, between Trąbczyn, the estate of Antoni Prusimski, Starost of Niszczewice, and Łukomia, the estate of the Chełmski brothers. It met on 13 September 1775, in the forest on the disputed ground, under Ludwik Dąmbski, voivode of Brześć Kujawski. A quarrel over which commissioner should hold the pen split the court; a settlement it proposed to the parties was not reached, and it went on sitting divided. Prusimski led the court along his boundary line, past roads, boundary mounds, blazed trees, woods and a pond-ground, and relied on documents and sworn examinations of witnesses. The court also examined Chełmski's line, found Prusimski's boundary line
  the better, had new boundary mounds raised between Trąbczyn and Łukomia and between Trąbczyn and Biskupice, and required Prusimski to swear to it on the last mound with six witnesses. Stanisław Chełmski, for his encroachments on Trąbczyn ground and for an armed raid on the inn on the highway, in which shots were fired into the house and it was set alight, was sentenced to two weeks in the tower at Konin and to penalties payable to Prusimski, and besides to 8,000 Polish złoty for felled timber and other damage. The rest of the boundary with Biskupice was adjourned to 21 May 1776. Six commissioners sign, and with them Wojciech Czarnecki, the boundary surveyor of Kalisz, who raised the mounds.
app536017-001: An entry of the land court at Konin of 1589, headed with the words that Łukomski is to carry out an inspection. Albertus Trąmpczyński Otha, as plaintiff, has cited Thomas Łukomski for the second time, after he failed to appear the first time. He charges that Łukomski, with other neighbours, built a pond this year in the estate of the village of Łukom and, by holding back too much water, flooded a great quantity of woodland, pine forest, barren pasture and meadow in the estates of the villages of Trąbczyn, Nowa Wieś and Osiny; a sentence in Polish names oak, beech and ash, fit for building and for bee-trees, killed by the flooding. The plaintiff values the harm at ten thousand Hungarian gold florins and as much again in damages. At the defendant's request the court orders a judicial inspection and adds a court messenger, whom the defendant chooses and pays; he is to see in what place and on whose ground the wrong was done, and whether it was done. The defendant must carry out
  the inspection within six weeks at the place in dispute, both parties must be present, and at the next court terms at Konin they have a final term to hear the outcome before the court.
app536036-001: A judgment by default of the land court at Konin, of its sitting of 1644, headed "Contumaces". Jerzy Chełmski, as plaintiff, has cited the brothers Marcin, Wojciech, Władysław and Andrzej Trąmpczyński, sons of the late Stanisław, and his widow Anna of Słończyce, who holds her dower and a life interest in what he left. He charges that they sent their subjects into his own woodland by the village of Łukom and had about eighty notches cut into trees there in the manner of boundary marks, so as to add a great part of his ground to their own. He reckons the harm, leaving the ground itself aside, at a thousand Polish marks and as much again in damages, and demands that the marks be annulled once the sub-chamberlain's office has been brought out. The defendants were called by the court messenger Mikołaj Jaworowski of Karmin and did not appear at the first term; the plaintiff condemned them, with the court's leave, in the penalty of contumacy. The court messenger Bartłomiej Koelmarek
  of Łukom declares that he laid the citation on the Monday before at the manor of the cited in the village of Trąbczyn, in the presence of the household.
app536036-002: A second judgment by default of the same sitting of 1644, against the same defendants and in the same words as the first. Jerzy Chełmski charges that the Trąmpczyńskis lately had about a hundred trees fit for building, chiefly pines, and about three hundred cartloads of firewood felled in the woods belonging to the village and estate of Łukom, and used them as they pleased. He reckons the harm, leaving the ground itself aside, at three hundred Polish marks. For the rest the entry refers to the one before it.
app536040-001: A decree of the land court at Konin, of the sitting that opened on the Monday after Septuagesima 1728, headed "Decretum Locationis". The brothers Franciszek and Józef Ścibor Chełmski, heirs of Łukom and Łomowo, have cited Krzysztof Prusimski as principal defendant, his son Antoni, six noblemen in his service, who are named, and unnamed subjects of Trąbczyn; the suit had been brought at the sitting after Trinity 1727 and was not decided then. They charge that Prusimski, with no regard for neighbourly friendship, had a hundred threescore of shingles made on their ground burned together with a hut, so that children living in the hut were nearly burned; that he had four working oxen kept for the glassworks taken in an armed raid, and plotted against Józef Chełmski's life; and that, while the plaintiffs were at the Crown Tribunal at Piotrków, he sent his son, the retainers and the subjects in arms onto ground that belongs to Łukom from of old, and had hay taken there in no small
  number of cartloads. Both sides appear before the court. The court finds that a sworn commissioner of the provinces of Poznań and Kalisz, Wojciech Biskupski, on whom both have agreed, with two friends of each side, must go onto the disputed ground on the Monday after Misericordia Sunday; they are to examine old and knowledgeable witnesses on oath about the ownership of the ground, the acts of violence and the damage, and to decide all the claims. Appeal lies only from the final sentence. Both parties are to pay a penalty of fourteen Polish marks, half to the other side and half to the court; whoever does not comply with the decree falls under banishment.
app536045-001: A decree of the land court at Konin, of its sitting of 1763, in the dispute between the widow Katarzyna Prusimska, born Rozdrażewska, with Joseph Puchalski on one side, and Stanisław Ścibor Chełmski with one Czajkowski on the other; each side is plaintiff and at the same time summoned. The court holds that sworn witnesses must be examined, has it done and has the testimony read out. It showed that in 1761 Prusimska had sent potash-burners off with potash; Chełmski, travelling to Poznań, came upon them near Pyzdry as they were making for Gdańsk, had the potash sequestered and stored at an inn in Pyzdry, and laid an arrest on it with the notary of the customs house. The burners, helped by the noblemen Wawrowski and Gotartowski, took it away over the notary's objection and brought it to Gdańsk. Because the dispute over the boundary between Trąbczyn and Łukom is still undecided between the parties before the Crown Tribunal, and only the fixing of the boundary will show on whose
  ground the potash was made, the court suspends its decision and orders the testimony handed to the parties from the chancery in a closed roll.
app5371057-001: 'A hereditary-lease contract: von Triebenfeld, as the Prince of Hohenlohe-Ingelfingen''s authorised representative, grants the settler Christoph Erbet of the Trąbczyn Hauland one Hufe Magdeburg measure in the Trąbczyn forest for 100 Rthl entry money and 30 Rthl hereditary rent a year. After three rent-free years, 15 Rthl fall due at Christmas 1809. Filed with it: the general power of attorney of 19 February 1805 and the engrossment of 23 May 1806. In 1811 Hawich hands the file to the peace court of the Konin district and asks that 9 Rthl 18 dgl of costs be recovered from Erbet.'
app539680801-001: 'A copy of the general power of attorney of the Prince of Hohenlohe-Ingelfingen for the War and Forest Councillor von Triebenfeld, given at the Guhrwitz justice office near Wrocław on 19 February 1805. Triebenfeld may act for the Prince in all matters of his estates of Zagórów, Witów and Trąbczyn in the Kalisz department, whether parcelling, sale, lease or mortgage: apply to the Chamber and to the Government at Kalisz, the provincial court, settle with the lessees, pay and receive money, and give orders to the officials of the estates and suspend them. The Prince promises to approve everything and to repay his costs. The justice office attests his signature the same day; the patrimonial court on Trąbczyn certifies the copy on 21 March 1806.'
app539680801-002: 'A copy of the consent that the South Prussian War and Domains Chamber at Kalisz gives in the King''s name on 28 January 1806, on cabinet orders of 22 October and 7 December of the year before. The Prince of Hohenlohe-Ingelfingen may parcel out the demesne farms of Drzewce, Kopojno, Świątniki, Święcia and Broniki in the lordship of Zagórów and of Nowa Wieś, Przybysław, Stara Huta and part of Trąbczyn, let Oleśnica and Szetlewek in hereditary lease, and turn the services of all his subjects into a fixed money rent; he keeps back part of Trąbczyn, the land at Mariantów and a part of the forest. Four conditions: the compensation of the subjects for their rights of pasture and wood is to be fixed; no peasant holding may lapse; the state''s taxes remain and are secured in the mortgage book; the wood rights of the abbey and provostry of Ląd are secured in the mortgage book, and if the reserved forests prove too small for the wood rights of the domain office of Ratyń, a yearly
  compensation is to be fixed.'
app539680801-003: A copy of a hereditary-lease contract whose beginning is missing. Through his general attorney von Triebenfeld the Prince of Hohenlohe-Ingelfingen lets 100 Magdeburg Hufen of forest of his estate of Drzewce to eighteen named settlers for ever; sixteen take 5 Hufen each and two take 10. No entry money is paid, because the land has still to be cleared; four rent-free years are allowed for the clearing, until Christmas 1808. After that the hereditary rent is 30 Reichsthaler a Hufe, 3,000 Reichsthaler a year in all, payable at Midsummer and at Christmas; half of it can be redeemed. At every sale a tenth of the price goes to the lordship. The lessees are free of hereditary subjection and labour service but remain under the lordship's court, must buy their beer and spirits from it, and are jointly liable. The community receives 21 Morgen free of rent for a schoolmaster, a village mayor and a churchyard. Eleven of the eighteen sign with three crosses. The patrimonial court engrosses
  the contract at Mariantów on 21 March 1806.
ihagrrep7cnr1414-001: Draft of a letter of the Department of Foreign Affairs, Berlin, 11 January 1797, to the minister Count von Hoym and in the same words to the minister Baron von Schroetter; a larger hand adds the Grand Chancellor von Goldbeck, and three fair copies are ordered. The department communicates in copy what the royal resident at Venice, Count von Cattaneo, has reported at the request of Anton Prusimski, a resident of the provinces acquired from the former Republic of Poland, who is at present staying at Venice. Of the two signatures the second is that of the minister Haugwitz. On the 12th all the letters went to the post.
ihagrrep7cnr1414-002: 'Extract from dispatch No. 423 of Count Cattaneo, Venice, 14 December 1796, in French. The Polish gentleman Antoine Prusimski came to him in truly ruined health and dulled almost to stupor by the death of his wife, and asked for a certificate of his sad situation and that he could not travel at present and in that season. Cattaneo did not think he could refuse it: a man who is exhausted by going from one house to another cannot travel from one country to another. The department received the extract on 2 January 1797 and routed it to Mr von Raumer, who directed on 8 January that Hoym and Schrötter be notified.'
ihagrrep7cnr1414-003: Schrötter thanks the Department of Foreign Affairs for the news of the 11th of the month about Anton Prusimski, who is settled in the new acquisition from Poland and is at present staying at Venice. He has passed it on to the Minister of State Count von Hoym, because it is not established whether Prusimski is settled in New East Prussia or in South Prussia. Berlin, 29 January 1797. The department received the letter on 8 February and put it with the files on 16 March.
ihagrrep7cnr3570-001: 'The file on the donation of confiscated and vacant estates in South Prussia to officers. Hoym proposes granting the Prince of Hohenlohe-Ingelfingen the estates confiscated from the insurgent Anton von Prusimski: Kamionna, Kolno, Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laski, Osiny, the Trąbczyn Hauland and Brzyce. The cabinet order approves this, and estates for von Sanitz, Blücher, von Dolffs, von Pontanus, von Holtzendorff and von Larisch. It contains the draft of the donation charter for the Prince and Hoym''s request for the clause ''cum appertinentia''.'
ihagrrep7cnr3705-001: Von Triebenfeld, as the Prince's general plenipotentiary, asks the King to order the Government at Kalisz to sequester the Oleśnica estate (lordship of Trąbczyn and Zagórów). The hereditary lessees Giese, Bagans and Gietzinger paid only 10,000 Rthl of the 20,000 Rthl entry money, and that out of money from sub-lessees. Since then they have owed rent and taxes and sold off parts of the estate, while the Chamber has not confirmed the contract. He rebuts the government's refusals, asks for the files to be called in, and offers security.
ihagrrep7cnr3709-001: The Government at Poznań submits to the King a copy of the cabinet order issued to it in the case of Prusimska against the Prince of Hohenlohe. The receiving office files the report on 23 June 1800.
ihagrrep7cnr3709-002: 'Copy of a cabinet order of the King to the Government at Poznań, received there on 16 June 1800: prompted by an enclosed complaint of von Prusimska, the King calls in the files of her case against the Prince of Hohenlohe-Ingelfingen over the petitioner''s maternal property, as they stand, and orders them sent in at once.'
ihagrrep7cnr3709-003: The Government at Poznań submits to the King a copy of the cabinet order of 1 July, received on 7 July, with reference to its report of the 18th of the previous month. It notes that the hearing for taking evidence and closing the proceedings in the case of Michalina von Prusimska against the Prince of Hohenlohe-Ingelfingen is set for 22 July. The receiving office files the report in Berlin on 1 August 1800.
ihagrrep7cnr3709-004: 'Copy of a cabinet order of the King to the Government at Poznań: he returns the files of the case of Prusimska against the Prince of Hohenlohe-Ingelfingen that were sent in with the report of the 18th of the previous month. The Government is to finish preparing the case, which has been much delayed by too much indulgence towards the defendant''s agent, with all diligence, and then to have suitable proposals for a settlement made. If no settlement is reached, it is to see to a speedy judgment, especially if the laws should require judgment to be given once more in the first instance.'
ihagrrep7cnr3709-005: 'The Prince of Hohenlohe writes to the Grand Chancellor: the minor Michalina von Prusimska has sued him before the Government at Poznań for the recovery of the Brzyce estates, which the King gave him; the case is now to be laid before the court for judgment. Since the guardianship board at Poznań conducts the suit in the plaintiff''s name and its members are also members of the Government, and so would be his judges, he asks that the judgment be entrusted to the Government at Kalisz and the files sent there. The receiving office marked it with the date 2 December 1800.'
ihagrrep7cnr3709-006: The Prince of Hohenlohe's covering letter to the Grand Chancellor, sent with his petition of the same day. The settlement proposal made by the court's deputy at the last hearing makes him fear that the Government at Poznań will not judge impartially. The lifetime right of the plaintiff's father, who is still living, in his late wife's property is, he says, part of the father's confiscated property; the deputy nevertheless doubted that it belongs to the fisc. The Prince asks again, urgently, that the judgment be entrusted to the Government at Kalisz or to another South Prussian court.
ihagrrep7cnr3709-007: 'A decree made of the office''s own motion: since most councillors of the Government at Poznań are members of the guardianship board there, which occasioned the suit of the guardian of the minor Michalina von Prusimska against the Prince of Hohenlohe-Ingelfingen for the recovery of the Brzyce estates and directs it, the case is to be decided in the first instance by the full bench of the Government at Warsaw and in the second by the Senate of Higher Appeal of the Kammergericht. The Government at Poznań is to be told; rescripts go also to the Government at Warsaw and to the Senate.'
ihagrrep7cnr3709-008: 'Draft of a royal rescript to the Government at Poznań: since most of its councillors are members of the guardianship board there, which occasioned and directs the suit of Michalina von Prusimska''s guardian against the Prince of Hohenlohe-Ingelfingen for the recovery of the Brzyce estates, it is laid down that the case will be decided in the first instance by the full bench of the Government at Warsaw and in the second by the Senate of Higher Appeal of the Kammergericht. Both courts have been instructed the same day.'
ihagrrep7cnr3709-009: 'Draft of a royal rescript to the Government at Warsaw: a suit for the recovery of the Brzyce estates is pending before the Government at Poznań between the guardian of the minor Michalina von Prusimska and the Prince of Hohenlohe-Ingelfingen. Since the guardianship board there occasioned and directs the suit and most of the Poznań councillors belong to it, the case is to be decided in the first instance by the full bench of the Government at Warsaw. The Government at Poznań has been informed. The rescripts went to the post on the 13th.'
ihagrrep7cnr3709-010: 'Draft of a royal rescript to the Senate of Higher Appeal of the Kammergericht: a suit for the recovery of the Brzyce estates is pending before the Government at Poznań between the minor Michalina von Prusimska and the Prince of Hohenlohe-Ingelfingen. Since the Poznań guardianship board occasioned and directs the suit and most of the Poznań councillors belong to it, the case is to be decided in the first instance by the full bench of the Government at Warsaw and in the second by the Senate. The Governments at Poznań and Warsaw have been instructed.'
ihagrrep7cnr3709-011: 'Draft of a reply to the Prince of Hohenlohe: his wish that his case with Michalina von Prusimska''s guardian should not be decided by the Government at Poznań is well founded by the one fact that most of the councillors there belong to the guardianship board that occasioned the lawsuit. The writer has therefore ordered that the full bench of the Government at Warsaw decide in the first instance and the Senate of Appeal of the Kammergericht in the second. He chose Warsaw and not Kalisz because the president at Poznań, Count von Danckelmann, has lately moved to the Government at Kalisz.'
ihagrrep7cnr3709-012: 'The Government at Poznań reports on the rescript of the 7th, received on 16 December: in the case of Michalina von Prusimska''s guardian against the Prince of Hohenlohe-Ingelfingen, judgment in the first instance was already given on 9 December, because the cabinet order of 1 July had especially urged speed. If an appeal is lodged, it will send the files to the Senate of Higher Appeal of the Kammergericht for decision in the second instance. The receiving office decrees on 31 December 1800 that the Government at Warsaw be told the rescript of 7 December does not apply.'
ihagrrep7cnr3709-013: 'Draft of a royal rescript to the Government at Warsaw: by the rescript of 7 December it had been charged with the judgment in the first instance in the suit between Michalina von Prusimska''s guardian and the Prince of Hohenlohe-Ingelfingen over the Brzyce estates. The Government at Poznań has reported, however, that it gave judgment on the 9th, before the order reached it; the rescript therefore does not apply. Sent to the post on 5 January 1801.'
ihagrrep7cnr3709-014: 'Draft of a letter to the Prince of Hohenlohe, heavily corrected and hard to read: the Government at Poznań, following the cabinet order of 1 July that urged it to move the case quickly, so hastened his case against Michalina von Prusimska that judgment had already been given when the order of 7 December arrived there. The order stands that the files are to be sent to the Senate of Higher Appeal of the Kammergericht for judgment in the second instance.'
ihagrrep7cnr3709-015: 'Michalina Prusimska asks the King, in French, to hasten her case: eighteen months ago she handed him a memorandum at Poznań asking for the fortune due to her after her mother''s death, and he promised to speed justice. After four years the suit begun at Poznań has been decided only in the first instance, and the decision has now gone to the court in Berlin. She is, she writes, an abandoned orphan pleading against the Prince of Hohenlohe. The petition is passed to Minister von der Reck on 26 January 1802 to be hastened; on 29 January he has her told that she may expect the appeal judgment to be published.'
iharep162nr295-001: A copy of the bond of the Councillor of War and Forests Peter Friedrich August von Triebenfeld, Berlin, 28 January 1805. The third department of the Supreme War College has granted him a loan of 50,000 Thaler Courant out of the General Invalids' Fund and paid it out in Seehandlung bonds. He promises to repay it after six months' notice, which either side may give, and until then to pay 5 per cent interest in half-yearly instalments at Berlin. As security he pledges his whole property and, specially, the bond of the Prince of Hohenlohe-Ingelfingen of 1 June 1804 for 250,000 Thaler, which is registered on the Prince's South Prussian estates of Zagórów, Drzewce, Kopojno, Świątniki, Skokum, Oleśnica, Wrąbczyn and Grądzyń. In case of non-payment he cedes 50,000 Thaler of it to the fund, with priority over the 200,000 that remain his. The same day he acknowledges the deed before the first Kurmark justice office at Berlin.
iharep162nr295-002: 'A copy of a certificate of the South Prussian Government at Kalisz of 5 March 1805, issued in the King''s name. Before the Government Councillor Stosch as commissary, Triebenfeld appeared at Kalisz on 27 February 1805 and once more acknowledged his deed of debt and pledge of 28 January for 50,000 Thaler from the General Invalids'' Fund, and likewise the protocol of acknowledgement standing under the bond; the Government Councillor von Lichnowski vouched for his identity. Below it stands the note of the Ingrossator Beda of 13 March 1805: on the ground of a decree of the 5th of the month the 50,000 Thaler, bearing 5 per cent interest and payable after six months'' notice, have been entered for the Invalids'' Fund in the mortgage book of the Konin district upon Zagórów, Drzewce and Kopojno.'
iharep162nr295-003: 'A copy of the mortgage certificate for the town of Zagórów in the Konin district, which the South Prussian Government at Kalisz issues to the General Invalids'' Fund on 13 March 1805 (No. 1179). The Prince of Hohenlohe-Ingelfingen holds the estate by the deed of grant of King Friedrich Wilhelm II of 19 June 1797; his title of possession was registered by a decree of 31 July 1801. As perpetual charges there stand on it: a yearly due of 88 Reichsthaler 5 Groschen 9 Pfennig to the Kalisz Treasury of War and Domains; a caveat of the Treasury for building timber and firewood from the estate''s forests, after the confiscation of the ecclesiastical estates; and a caveat for Johann Giese, Johann Bagans and Friedrich Gietzinger for the rights of wood and pasture that their hereditary lease of Oleśnica of 22 February 1804 gives them in the Zagórów forests. As debts there stand on it: a caveat for the Provincial Elder von Lichnowski at Brzeg for a claim of 32,300 Reichsthaler already
  registered on Trąbczyn; 250,000 Reichsthaler for Triebenfeld under the Prince''s bond of 1 June 1804; and 50,000 Reichsthaler of these which Triebenfeld has pledged and ceded to the Invalids'' Fund, with priority over the remainder. The last line opens like this certificate and breaks off.'
iiihamdaiiinr12366-001: The Russian envoy at Berlin, Alopeus, sends the Prussian foreign minister Count Bernstorff, on the orders of his court, an enclosed report of the Viceroy of the Kingdom of Poland on a claim that Countess Michalina Miączyńska, born Prusimska, makes against the Prussian government, and supports it. The report, he writes, contains arguments so conclusive that he has nothing to add. He asks Bernstorff to recommend the Countess's case to the authorities who will have to decide it.
iiihamdaiiinr12366-002: 'Copy of a report from Warsaw on the claim of Countess Michalina Miączyńska, born Prusimska, as the commissioners for the liquidation of the former Duchy of Warsaw set it out. Her hereditary estates were confiscated from her father, the Starost Prusimski, by the Prussian government in 1796 and given to Prince Hohenlohe-Ingelfingen and General Sanitz; a decision of the Duchy''s governing commission of 21 July 1807 put her back in possession. She asks that the debts the donees raised on the estates be charged to Prussia: the Prince, the report says, loaded Trąbczyn and Szetlewek with 156,000 thalers, and Kolno and Kamionna, which he sold to the bank cashier Leixner for 142,000 thalers, carry 160,000 thalers. The report argues that as an orphan under age she was entitled to the protection of the Prussian government, that Niemojewski and Wichrowski recovered their estates free of debt, and that Prussia compensated Generals Sanitz and Zastrow with other estates for those
  returned. It could compensate the Prince in the same way, by taking over his debts. A reader in the Prussian ministry wrote objections in the margin in pencil: Prussia is answerable to no one for acts of government in the former South Prussia, not even Napoleon granted a claim for what was done in the years between, and the donee, for as long as he possessed the estate, possessed it lawfully and with full right of ownership.'
iiihamdaiiinr12366-003: Draft of the Prussian foreign minister's reply to the Russian envoy Alopeus, answering his note and the memorandum on the claims of Countess Miączyńska. The Starost Prusimski, it says, took part in the Polish uprising and fled; his estates were confiscated by a court's judgment, the King disposed of them, and the donees raised mortgages on them. Prusimski died abroad in 1803, and after the Peace of Tilsit his daughter received the estates back from the government of the Duchy of Warsaw. She now asks that the debts resting on the estates be paid off. The Prussian government has refused the request once already; after a fresh examination the decision of the Prussian courts stands, and an enclosed memorandum sets out its reasons.
iiihamdaiiinr12366-004: 'Copy of a letter from the advocate Tarczewski at Warsaw to a client who is not named: Mitschke at Kalisz has sent him the files of the suit against Madame Miączyńska. They are in order; only the mortgage certificates for the sum claimed are missing, and these must be produced in the original or in certified copies. The other side is pressing to bring the case before the court of appeal. He is drawing out the preparation of the case, but once all the time limits are used up it will have to go to judgment.'
iiihamdaiiinr12366-005: Copy of a note from the Prussian envoy at St Petersburg, General von Schöler, to the Russian foreign minister Count Nesselrode. Prince Hohenlohe-Ingelfingen, to whom King Friedrich Wilhelm II gave the confiscated lordship of Trąbczyn on 9 August 1796, borrowed 30,000 thalers from Grotowski; the mortgage was assigned through the court to the Breslau merchant Weigel. In 1807 the governing commission of the Duchy of Warsaw returned the estates to Prusimski's daughter Michalina, now Countess Miączyńska; the registered claims remained. When the interest went unpaid Weigel sued; the civil tribunal at Kalisz dismissed his suit on 6 March 1819 and ordered the claim struck out. Prussia asked in 1819 and 1820, without an answer, that the question be kept for diplomatic negotiation; meanwhile the court of appeal set the judgment aside, but the high tribunal at Warsaw confirmed it on 17 July 1826. Schöler relies on the Peace of Tilsit and on the conventions of 1815 and 1819,
  which uphold mortgage claims, and asks that the judgment be annulled and, first of all, that its execution be suspended.
iiihamdaiiinr12366-006: 'Certified extract of a judgment of the civil tribunal of first instance of the Kalisz voivodeship, of 30 July 1827, in Polish. The plaintiff is Michalina Miączyńska, born Prusimska, with her husband Count Stanisław Miączyński, hereditary owner of Trąbczyn; the defendants are the Lichnowski brothers, as heirs of Karl Heinrich Lichnowski, and Maria Anna, born Blacha, the widow of Franciszek Grotowski. The court rejects two objections to the summons and reasons as follows: Trąbczyn and Szetlewek belonged to Antoni Prusimski, were confiscated from him for his part in the uprising and given to Prince Hohenlohe-Ingelfingen; the governing commission returned them to the plaintiff. The Prince, it holds, was only a conditional possessor, the debts he raised lapsed with his title, and the Treaty of Tilsit does not change this; against Weigel the plaintiff has already won final judgments in the same matter. It orders the claim of the Lichnowski brothers and that of Grotowski''s
  widow struck out of the mortgage register of Trąbczyn and Szetlewek and awards costs against the defendants.'
iiihamdaiiinr12367-001: 'Baron Mohrenheim, writing from Warsaw under the letterhead of the foreign affairs of the Kingdom of Poland, answers the note of the Prussian consul general Schmidt of 6 February (no. 275): he is not losing sight of the Weigel matter and, once Grand Duke Constantine has returned, will tell him what it has been possible to settle.'
iiihamdaiiinr12367-002: 'An undated note from Mohrenheim to Schmidt, written as he was leaving: the day before he read his memorandum on the affair of Weigel and Eisenhardt to the council, which recognised unanimously that payment must be made. How it is to be made will be deliberated.'
iiihamdaiiinr12367-003: An undated note from Mohrenheim to Schmidt, written on a Tuesday. He returns Schmidt's “Dubois”, which he says he read with great interest, and asks pressingly for the continuation. He will push the Weigel matter; Schmidt should be easy about the rest, they will come out of it with honour. He has dreadful weather where he is, which at times dampens his pleasure in the country. In a line written sideways in the margin he asks Schmidt to let him have something for two days; what it is has not been read.
iiihamdaiiinr12367-004: Mohrenheim tells Schmidt that he has laid his note of 18 February (no. 352) before Grand Duke Constantine. The Administrative Council reported to the Grand Duke in August of the previous year that the competence of the courts which had ruled in the case of the bankers Weigel and Eisenhardt was recognised as open to question, because by its nature the case could be resolved only by diplomatic means. The Council therefore authorised the Commission of Finance and Treasury to declare a conflict of jurisdiction and to bring it before the general assembly of the Council of State for decision. Having heard nothing further since, the Grand Duke has asked the Council to hasten the conclusion of the matter.
iiihamdaiiinr12367-005: A letter from Warsaw to the consul general Schmidt; the signature has not been read. The writer has laid Schmidt's note of 26 July (no. 1648), on the suit pending before the courts of the Kingdom between Madame Miączyńska and her creditors over the debts contracted by Prince Hohenlohe, before the minister of finance. As Schmidt wished, he has also reminded the minister of the claim that the banker Weigel raises against the treasury of the Kingdom because judgments denied him a debt of this kind. From two enclosed pieces Schmidt will see that his communications have brought about the measures needed, and that his note of 26 July did the Polish administration a signal service by warning it in time against an unfavourable outcome of these suits.
iiihamdaiiinr12367-006: 'Copy of a letter from the minister of finance, Prince Lubecki, to Weigel, in Polish. He has received Weigel''s letter of 10 August and its renewal of 14 September, which ask compensation for the losses Weigel suffered when the courts of the country had his claim of 30,000 thalers struck off the Trąbczyn estates. With the first letter came a reckoning: 30,000 thalers of capital, 31,800 of interest and 1,300 of costs, 63,100 thalers in all. Lubecki finds this demand excessive, because under the laws in force in the country Weigel could never have obtained so much even had the suit gone wholly in his favour. Wishing nonetheless to make good the losses really suffered, not the nominal ones, he has ordered the value of the estates once charged with the claim to be established on the spot, so as to assess the real value of the capital lost. That is why he has not yet been able to give a detailed answer.'
iiihamdaiiinr12367-007: Copy of Weigel's reply to the minister of finance, Prince Lubecki, from Wrocław. In answer to the minister's letter of 22 September (no. 59607/938) he sends certified copies of the mortgage certificate of 14 August 1803 and of the court valuation of 6 May 1803 for the estates of Trąbczyn, Osiny, Łazy, Nowawieś, Zarobna and the Trąbczyn settlers' villages. By the mortgage certificate the estates are taken to be worth 160,000 Reichstaler. Entered ahead of his claim are church capitals of 7,000 florins or 1,166 Reichstaler 16 groschen, 5,000 for von Przepolewski, though paid, and 42,000 for von Lichnowski, 48,166 Reichstaler 16 groschen together. For his own entry, made for von Grottowski and now standing in his name, 111,833 Reichstaler 8 groschen remained, which is 48,733 Reichstaler 8 groschen more than his claim of 63,100. The valuation, he says, was drawn up on the low principles used for assessing crown domains and so comes to only 128,917 Reichstaler 17 groschen;
  even of that, 80,751 Reichstaler 1 groschen remain to cover him once the prior entries are deducted. His claim was therefore wholly secure, and had he not been denied the help of the law he could have paid off the prior entries and bid at the forced sale. He expects the Prince to bring about his satisfaction and to set an early date for an agreement, at which he or an agent would appear.
iiihamdaiiinr12367-008: Copy of a second letter from the minister of finance, Prince Lubecki, to Weigel (no. 77775), in Polish. He has passed the papers for valuing the Trąbczyn estates, which Weigel sent with his submission of 14 October 1830, to the authority he has charged with assessing what the estates are worth now. Weigel holds that by the court valuation his capital was fully secured on Trąbczyn; but that valuation was made in 1803, at a time of inflated land prices. The real value of the claim must be reckoned by what landed property is worth today, because the last judgment in Weigel's case was given in 1826 and only from then could execution have been sought. As Weigel's letter offers no more acceptable terms for a settlement, he must await the completion of the work he mentioned in his reply of 22 September, which he is seeing hastened.
iiihamdaiiinr12367-009: A letter from Warsaw to the consul general Schmidt (no. 301), signed on the scan “R. Fuhrmann”. Following Schmidt's intervention of 10 December 1831 in support of Weigel's request, the writer has ordered the finance commission to hasten the valuation of the domain of Trąbczyn, to examine at the same time how well secured the capital is that Weigel has on that estate, and to lay the matter before him; the commission was already charged with this work the year before. The special authority that His Majesty had given Prince Lubecki to treat with Weigel can serve no one else, and he has taken the steps needed to remove that obstacle. As soon as both difficulties are lifted he will do all he can so that the well-founded claims of a Prussian subject succeed promptly.
iiihamdaiiinr12367-010: Copy of a letter from Engel at Warsaw to the consul general Schmidt (no. 2216). Referring to his note of 12 February (no. 1871), he reports that the councillor of state Joseph Lubowidzki, president of the Bank of Poland, has been charged by order of the Emperor and King with carrying out the convention of 29 May 1830 and has received the necessary instructions. This new commissioner is also authorised to settle the questions arising from the claim of the banker Weigel. Engel hopes he will justify the Emperor's confidence and work for the adjustment of every point still to be finally settled between the government of Poland and that of the King of Prussia.
iiihamdaiiinr12367-011: A second letter in the same hand as document 9 to the consul general Schmidt, answering his note of 1 March (no. 432) on the settlement of the affair of Weigel of Wrocław. As a result of the measures the writer took and reported to Schmidt on 24 December of the previous year, the Commission of Finance and Treasury on 29 February charged Mr Drake, a commissioner in the department of state domains, with valuing the Trąbczyn estates. The work will take some time; as soon as it is finished he will inform Schmidt. He asks him meanwhile to tell the trading house of Weigel.
iiihamdaiiinr12765-001: Triebenfeld reminds Hardenberg that on 6 May in Paris he handed him a letter from the Prince of Hohenlohe to the Russian Emperor. He encloses a Copy of the resolution issued on it on 14 May and asks to be allowed to bring the matter, which is important to the Prince, back to mind at what is now the decisive moment. The chancery notes that the petition was handed over to Councillor of State Stägemann on 20 November 1814.
iiihamdaiiinr12765-002: 'Reply to Triebenfeld on his petition of the 25th of last month: the matter of the Prince of Hohenlohe concerning the claims to Trąbczyn and Kamionna will, it is said, settle itself as soon as the general settlement and agreement regarding the Duchy of Warsaw is carried out.'
iiihamdaiiinr12765-003: 'Copy of a letter from Hardenberg to Triebenfeld: he says the claims of the Prince of Hohenlohe to the South Prussian estates of Trąbczyn and Kamionna, given to him in 1796, could only be raised with any prospect of success once definitive arrangements have been made about the Warsaw affairs. That, he says, is not yet the case. Hardenberg is therefore holding back the Prince''s letter to Emperor Alexander and asks that this be made known to the Prince.'
iiihamdaiiinr12765-004: 'Triebenfeld describes the case to Hardenberg: in 1796 the Prince received Kamionna and Kolno, Trąbczyn with its villages in the district of Konin, and Brzyce, which had been confiscated from the fugitive Prusimski. He sold Kamionna and Kolno in 1804 to Leixner, a bank director. In 1807 the Polish administrative commission took all the estates without a judgment and gave them to Prusimski''s daughter Miączyńska; the tribunal at Kalisz declared that it had no authority in the matter. He asks that Leixner''s estates be returned to him and that the Russian Emperor be moved to return the Trąbczyn estates together with 36,500 Rthl in revenues.'
iiihamdaiiinr12765-005: 'Draft of a reply to Triebenfeld: a diplomatic negotiation has been opened, it says, about compensating the grantees of South Prussian estates who have been deprived of their possession since the Peace of Tilsit, and its outcome will be communicated to the Prince. Leixner, it says, did not come under judicial investigation through the loss of Kolno and Kamionna, but through the irregular management of his post and the unauthorised pledging of an asset registered there for the merchant Simon.'
iiihamdaiiinr12765-006: The Prince asks Stein in French to obtain from the Emperor compensation for Kamionna and Trąbczyn, which were granted to him in 1796 and taken from him in 1807 by the Polish treasury and awarded to Prusimski's daughter. He says that to free the mortgaged estates he had to pay 55,000 Reichsthaler; his claim in cash amounts to 85,400 Reichsthaler and his total loss to 325,400 Reichsthaler. The chancery notes that the reply should be that the settlement of Polish affairs must be awaited.
iiihamdaiiinr12765-007: 'Draft of a French reply from Hardenberg to the Prince: he says Stein has passed on to him the Prince''s letter of the 12th. The Prince should wait, with his claim to Kamionna and Trąbczyn, for the final settlement of Polish affairs, which he says does not seem far off. Hardenberg says he will then do everything he can to support the request with the King.'
iiihamdaiiinr12765-008: The Prince writes to Hardenberg that the district of his Trąbczyn estates falls under Russian sovereignty; since both sovereigns have confirmed the commission's acts, he says the estates are lost to him, and that the donees should be compensated with other estates. He says his loss amounts to more than 261,000 Rthl. He would be satisfied with the small domain of Sokolnik, which yields 8 to 10,000 Rthl in rent, and he asks Hardenberg to intercede for this with the Russian Emperor.
iiihamdaiiinr12765-009: Draft of Hardenberg's reply to the Prince concerning his letter of the 12th of the previous month about the Trąbczyn estates. He says a minister has also passed on to him the letter addressed to that minister regarding Kamionna and Trąbczyn. He says he has asked Zerboni to inform him fully about both estates, and he reserves the right to notify the Prince of his further steps.
iiihamdaiiinr12765-010: 'Draft of a letter to Zerboni in Poznań: Hardenberg sends, in the original, two letters of the Prince, one to himself and one to Stein, concerning the claims over the confiscated estates of Kamionna and Trąbczyn, and asks to be told what steps can still be taken in the Prince''s favour. He says the Prince sold Kamionna to Leixner, and that the 55,000 Rthl and interest are owed to the bank. He expects Zerboni''s report as soon as possible.'
iiihamdaiiinr12765-011: 'Cancelled draft of a reply to the Prince: the territorial arrangements of the Duchy of Warsaw have, he says, been settled definitively for the provinces returning to Prussia; the compensation of the holders of donations is reserved for a separate negotiation, which has already been begun. It would be a particular pleasure for Hardenberg to find in it an opportunity to further the compensation for the Trąbczyn estates taken from him. The draft refers to the other order of 6 June 1815.'
iiihamdaiiinr12765-012: 'Reply to the Prince: he writes that the territorial arrangements of the Duchy of Warsaw have been finally settled as regards the provinces returning to Prussia, and that compensation of the donataries has been reserved for a separate negotiation. He says he will seek an opportunity in the course of it to further the compensation for the Trąbczyn estates taken from the Prince.'
iiihamdaiiinr12765-013: 'French reply to the Prince: Stein has passed on his letter of the 12th of last month. The Prince is asked to wait, with his claim to Kamionna and Trąbczyn, for the final settlement of Polish affairs; the writer says he will then do everything he can to support the request with the King.'
iiihamdaiiinr12765-014: 'Zerboni reports to Hardenberg: he says the Prince sold Kolno and Kamionna to Leixner before 1806, but not Trąbczyn, and that all the estates passed back in 1806/7 to the heirs of the previous owner. He says a certain Schenck, acting as authorised agent, is claiming 318,500 Rthl in compensation, best provided through the office of Sokolnik. Zerboni considers the calculations nonsense; he says the Prince let Trąbczyn fall into disrepair and burdened it with debts. The cabinet, he says, can only induce the Russian cabinet to compensate the Prince. A note in the margin records that Triebenfeld and Leixner have died.'
iiihamdaiiinr12765-015: 'Order: following Zerboni''s proposal, Schöler in St Petersburg is to be instructed to bring the Prince''s wish to the Emperor''s notice only in quite general terms, since it is purely a matter of grace. The Prince is to be informed, in His Serene Highness''s name, that his claim for compensation is being brought to the Emperor''s notice through the royal legation.'
iiihamdaiiinr12765-016: 'Draft of a letter to the Prince: Hardenberg says he has today informed the envoy in St Petersburg, Major General von Schöler, of the request for compensation for the Trąbczyn estates and instructed him to bring it to the attention of the Emperor of Russia. He leaves it to the Prince to pursue his case directly in St Petersburg from now on, and wishes him the most favourable success.'
iiihamdaiiinr12765-017: 'Draft of an instruction to Schöler: the Prince received the Trąbczyn estates from the late King; they had formerly belonged to the Starost Prusimski and in 1806 and 1807 they passed back to his daughter Miączyńska, whose possession the Emperor of Russia confirmed. Since some other grantees in the Kingdom of Poland have been compensated, the Prince too is making a claim. Schöler is to bring the request to the Emperor''s notice, but only in general terms and without supporting it urgently, since it is a matter of grace.'
iiihamdaiiinr12765-018: 'Registry note: the report was handed over under No. 3278 C to the 3rd Section of the Department of Foreign Affairs, signed Bever; it is enclosed with the files, signed Strenger.'
iiihamdaiiinr12765-019: 'The widow von Brehmer asks Hardenberg for help: she says her late brother, Major von Seehausen, lent the Prince a capital of 5,000 Rthl in 1803 against the pledge of the Szetlewek estate. She says the Prince paid neither the capital nor the interest, and that in 1807 the estate was taken from him and given back to the heiress of its former owner. She asks to be satisfied out of the Prince''s remaining property. A marginal note by Stägemann: any compensation from the Russian Emperor must benefit the creditors registered against the estates.'
iiihamdaiiinr12765-020: 'Two orders: the widow von Brehmer is to be informed that, in respect of her capital of 5,000 Rthl registered against Szetlewek, she must first sue the Prince before his own court, so that the claim is legally established. Schöler is to be told that the mortgage creditors are in danger of losing their capital, since the Prince is said to have let Trąbczyn deteriorate and to have burdened it with debts; he is to report if the Emperor grants compensation.'
iiihamdaiiinr12765-021: 'Draft of a reply to the widow Brehmer: her petition of 26 April addressed to Hardenberg has been passed to the ministry. If she wishes to seek satisfaction for the capital of 5,000 Rthl registered on Szetlewek out of the Prince''s remaining property, she must first sue him before his own court in order to establish the claim at law, in case the Emperor of Russia should declare himself willing to grant the Prince compensation.'
iiihamdaiiinr12765-022: 'Draft of a letter to Schöler: with reference to the letter of 29 April, the ministry reports that the mortgage creditors are in danger of losing their capital, since the Prince has let Trąbczyn deteriorate and has burdened it with debts; Schöler is asked to raise this. He is to send word if the Emperor grants the Prince compensation, so that the creditors can pursue their claims.'
iiihamdaiiinr12765-023: The widow von Brehmer submits to the ministry a legally binding judgment of the former South Prussian Government at Kalisz of 1806, by which the Prince was ordered to pay the 5,000 Rthl together with interest, and the will of her brother, Major von Seehausen. She asks the ministry to intercede on her behalf regarding the capital and the interest. According to the ministry's order, nothing further can be done as circumstances stand.
iiihamdaiiinr12765-024: 'Draft of a reply to the widow Brehmer: the ministry says it has already informed the legation at St Petersburg that the mortgage creditors are in danger of losing their capital. It says it can do no more for her; she must look after her own rights herself should the Emperor grant the Prince compensation. The enclosures submitted on 25 July are returned.'
iiihamdaiiinr12765-025: Schöler reports to the ministry from St Petersburg that on 17 May he handed Count Nesselrode a note in the Prince's matter, and that in a later note of 1 August he raised the point touched on in the order of 29 June. He says the answer, given only yesterday, was a refusal. The ministry directs that a Copy of the enclosure be sent to the Prince.
iiihamdaiiinr12765-026: 'Draft of a letter to the Prince: the ministry sends a Copy of the note with which the Russian ministry answered the intervention of the legation at Petersburg concerning the compensation for Kamionna and Trąbczyn, and regrets that, despite the legation''s efforts, it has not been possible to bring about a favourable outcome.'
iiihamdaiiinr12765-027: 'Note from the Russian envoy Alopeus to Ancillon: Duke Eugen of Württemberg had recommended the claims of the heirs of the Prince of Hohenlohe and of Count Bethusy against the Kingdom of Poland. The heirs appeal to Generals von Zastrow and von Sanitz; the matter was already negotiated with Schöler in 1816 and refused. Bethusy''s request under Article 18 of the Treaty of Vienna was refused by the Polish government. The Emperor regrets that he cannot act on the recommendation.'
iiihamdaiiinr12765-028: 'Copy of a report by Prince Zajączek to the Emperor: Count Ernst Bethusy asked to be admitted, together with his three sons, to the benefits of Article 18 of the Treaty of Vienna. Zajączek says the article applies only to properties cut through by the border between the Kingdom of Poland and the Grand Duchy of Poznań. He says Bethusy evidently wants only to export iron ore for his ironworks in Silesia, which the customs regulations forbid.'
iiihamdaiiinr12765-029: 'Draft of a letter to Minister von Schuckmann: the heirs of the late Prince of Hohenlohe and Count Bethusy had themselves represented before the Russian government by Prince Eugen of Württemberg; according to the Russian envoy''s note, the Emperor has rejected both requests. For the heirs, as this is a mere matter of grace, no intervention can take place. Bethusy''s request is said to be inadmissible, since his properties are not cut through by the new border. Further action is left to the Minister.'
iiihamdaiiinr12765-030: 'Schuckmann replies to the Ministry of Foreign Affairs: he says he agrees that Count Bethusy''s claim to free movement between his estates in Silesia and the Kingdom of Poland is inadmissible under the treaty as well. He says he has informed Bethusy of this with reference to Article 18, adding the remark that the Prussian government would have objected if the Russian government had granted the request.'
oe1bu14525-001: 'A royal deed of gift by which Friedrich Wilhelm grants Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, Lieutenant-General and Governor of Wrocław, heritable and full property in estates fallen to the Crown: the town of Kamionna and market-town of Kolno in the Poznań district; the villages of Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laske, Osiny and Hauland Trąbczyński in the Konin district; and Brzyce in Cujavia, reserving sovereign taxes, with governments and chambers forbidden to obstruct him. Certified at Kalisz and entered in the Konin mortgage book for Szetlewek.'
oe1bu14525-002: A mortgage certificate confirming the Prince of Hohenlohe-Ingelfingen's title to the free allodial estate of Szetlewek in the Konin district, held in full ownership under a grant of 9 August 1796 from Friedrich Wilhelm II and valued by him at 24,000 Reichsthaler. It records a bar on sale to natives of the land without consent to alienate, an interest-free loan of 8,333 Rthl 8 Groschen (50,000 Polish florins) from Ignatz von Radzinski securing lease moneys, and a protest by Jacob von Przespolewski over 30,000 Polish florins claimed from a former possessor, von Prusimski.
oe1bu14525-003: 'A royal deed of donation by Friedrich Wilhelm, granting Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, lieutenant general of infantry and governor of Wrocław, hereditary and full property in estates fallen to the crown: the town of Kamionna and market township of Kolno in the Poznań district, the villages of Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laske, Osiny and Hauland Trąbczyński in the Konin district, and Brzyce in Cujavia, subject only to sovereign taxes and public dues, with orders to the South Prussian governments and chambers not to obstruct him. Certified at Wrocław in 1798.'
oe1bu14525-004: 'A royal grant by Friedrich Wilhelm, King of Prussia, conveying South Prussian estates in hereditary and full ownership to his uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, Lieutenant General and Governor of Wrocław, in return for long service: the town of Kamionna and market town of Kolno in the Poznań district, villages including Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laske, Osiny and Hauland Trąbczyński in the Konin district, and Brzyce in Cujavia. Sovereign taxes and public dues are reserved, and all governments and chambers are forbidden to obstruct his possession or later transfers. Certified at Wrocław in 1802 by Sonnabend, the regiment''s judge advocate.'
oe1bu14525-005: 'A royal grant by Friedrich Wilhelm, replacing an earlier gift that had failed because the estates of the absconded former starosta von Prusimski proved heavily indebted: the King instead conveys to the Prince of Hohenlohe-Ingelfingen, hereditarily and in full property, sixteen formerly ecclesiastical villages including Pszczew, Łowyń, Zagórów, Kopojno and Wrąbczyn, subject only to a fixed unalterable canon of sovereign dues and the maintenance owed to the ecclesiastical bodies. Provincial authorities are ordered not to obstruct possession. Certified copy of 1803.'
oe1bu14525-006: 'A royal grant by Friedrich Wilhelm, King of Prussia, adding to the estates of Pszczew, Zagórów and Wienietz already given to his uncle Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, on 19 June the outlying parcels: the villages of Stołuń, Kuligowo, Szarcz, Silna, the bailiwick of Zielomyśl, the Pomherr Hauländer settlement and Heydemühle; Swięcin; and Konty, Szedlemin, Bątkowo and Karezin. Granted heritably and in full property, subject to a fixed sovereign due and the allowance payable to church foundations, with authorities forbidden to disturb possession. A certified copy of 1802.'
oe1bu14525-007: 'A royal letter of grant from Friedrich Wilhelm adds to the estates already given to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, on 19 June the outlying parcels belonging to Pszczew, Zagórów and Wienietz: the Stołuń, Kuligowo, Szarcz, Vogtey, Zielomyśl and Silna settlements with their Hauländer holdings and Heÿdemühle, the village of Swięcin, and Konty, Siedlemyn, Bątkowo and Karczyn, subject to a fixed canon and church stipends. Filed with it are a mortgage certificate and registration of title for Swięcia and the farm Broniki, which may not be sold to a native without consent.'
oe1bu14525-008: A royal grant by Friedrich Wilhelm making over to his uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, in heritable ownership, sixteen formerly church villages including Pszczew, Świechocin, Łowyń, Zagórów, Kopojno, Drzewce and Wrąbczyn with all appurtenances, subject only to the existing sovereign dues as a fixed canon and the allowance payable to the ecclesiastical foundations. It compensates for an earlier grant of the absconded starosta von Prusimski's heavily indebted estates, and orders all authorities not to obstruct possession. Certified copy.
oe1bu14525-009: A royal grant by Friedrich Wilhelm conveying to his uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, as unrestricted heritable property, sixteen formerly ecclesiastical villages including Pszczew, Łowyń, Zagórów, Kopojno, Drzewce and Wrąbczyn with all appurtenances, subject only to the existing territorial dues as a fixed canon and the stipend owed to the ecclesiastical foundations. It replaces an earlier, debt-burdened grant of the absconded former Starosta von Prusimski's estates, and orders all authorities not to disturb his possession.
oe1bu14525-010: A royal grant by Friedrich Wilhelm conveying to Friedrich Ludwig, Reigning Prince of Hohenlohe-Ingelfingen, sixteen formerly ecclesiastical villages, among them Pszczew, Łowyń, Zagórów, Kopojno, Drzewce and Wrąbczyn, in hereditary and full ownership, subject only to the existing sovereign dues as a fixed unalterable payment and to the maintenance allowance owed to the ecclesiastical foundations. It replaces an earlier grant of the absconded former Starost von Prusimski's estates, which proved too heavily indebted, and orders all provincial boards not to obstruct his possession. Certified copy.
oe1bu14525-011: 'A royal grant by Friedrich Wilhelm, given as a certified copy from a South Prussian archive, adding to the estates of Pszczew, Zagórów and Wienietz already conferred on his uncle Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, in June: at Pszczew the villages of Stołuń, Kuligowo, Szarcz, the bailiwick of Zielomyśl and Silna with their Hauländer holdings and Heidemühle; at Zagórów, Swięcin; near Wienietz, Konty, Szedlemin, Bątkowo and Karczyn. Held heritably and as property, subject to a fixed unalterable rent equal to the sovereign dues hitherto paid and to church dues, with authorities forbidden to obstruct him.'
oe1bu14525-012: 'A mortgage certificate for the noble estate of Kolno in the Poznań district, comprising the town of Kamionna and the market-town of Kolno, confirming the Prince of Hohenlohe-Ingelfingen''s registered title under a royal grant of 1796 after Anton von Prusimski''s property was confiscated for joining the 1794 insurrection. It lists the charges standing against it: protests lodged for Anton von Broniewski over a disputed pledge-possession and claims of 79,795 Rthl, plus 250 Rthl and small annual dues owed to Kamionna church.'
oe1bu14525-013: A valuation of Kamionna and Kolno in the Międzyrzecz district, drawn up for the Prince of Hohenlohe-Ingelfingen as hereditary lord on West Prussian principles of 1794, then corrected to South Prussian domain principles by Bading and attested by Beugnitz. It gives distances and boundaries, an area of 10,642 Morgen 35 rods, and describes the town of Kamionna with 466 inhabitants, its trades, livestock and the lordship's brandy and patronage rights, the two demesne farms and the village of Kolno with its labour-bound holdings, noting a disputed right to free wood from the Krobilewe heath.
oe1bu14525-014: A forest valuation for the estates of Kamionna and Kolno, certified at Kalisz by notaries Carl Anton Diener and Joh. Jacob Schmerck and drawn up by Forest Inspector Rochlitz. It proposes clearing 344 Morgen of oak, alder and beech for settlement, since a timber-taking right in the Gorcey and Krobilewer heaths makes the stands unprofitable, and reckons the gains from timber, purchase money at 15 Rthl per Morgen, ground rents, milling and propination dues, raising the estates' value from 186,943 to 199,463 and finally 255,833 Rthl 12 Groschen.
oe1bu14525-015: 'A mortgage certificate issued by the Royal South Prussian Government at Poznań registering the Prince of Hohenlohe-Ingelfingen''s title to the lordship of Pszczew or Pszczew with its villages, from Świechocin and Łowyń to Szarcz, the bailiwick of Zielomyśl and Silna, the Hauländer settlements and the Heydemühle, formerly Cathedral Chapter property. No debts are recorded, only two permanent burdens: an unquantified annual payment to the War and Domains Treasury, and a ban on selling to former Polish subjects without royal consent.'
oe1bu14525-016: A royal confirmation, issued under the South Prussian Government's seal at Poznań, of the handing over of the lordship of Pszczew or Pszczew in the district of Poznań to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, as heritable property. The Treasury's fiscal officer Beyer ceded it on the grant of Friedrich Wilhelm of 19 June 1797 and the declaration of 1 December 1797; the Prince's agent, councillor of justice Melzer, accepted. Appurtenances named include Świechocin, Łowyń, Dormowo, Szarcz, the bailiwick of Zielomyśl and Silna, Hauländer settlements and Heyde Mühlen. A note records the title entered in the mortgage book Vol. VII, Fol. 1.
oe1bu14525-017: A royal grant by Friedrich Wilhelm conveying to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, in heritable full property, sixteen formerly church villages including Pszczew, Łowyń, Zagórów, Kopojno, Drzewce and Wrąbczyn, with all rights, jurisdictions, woods, ponds and waters, subject only to the existing sovereign dues as a fixed unchangeable canon and the maintenance payments owed to the ecclesiastical corporations. Made because an earlier grant of the absconded starosta von Prusimski's debt-laden estates had fallen short. Filed with it are a certified copy made at Poznań and a note recording entry of the Prince's title to the lordship of Pszczew in the mortgage book.
oe1bu14525-018: 'A royal grant by Friedrich Wilhelm adding to an earlier grant of 19 June 1797 the appurtenances of the Pszczew, Zagórów and Wienietz estates: the settlements of Stołuń, Kuligowo, Szarcz, the bailiwick of Zielomyśl and Silna with their Hauländer holdings, the Pomher Hauländer holding and Heydemühle, the hamlet of Swięcin, and Konty, Szedlemin, Bątkowo and Karczyn near Wienietz, in full hereditary property against a fixed canon and the share due to church foundations. Filed with it are a certified copy and a mortgage certificate entering the Prince''s title to the lordship of Pszczew or Pszczew in the mortgage book.'
oe1bu14525-019: A royal rescript from the Government at Kalisz notifies the Prince of Hohenlohe-Ingelfingen that the War and Domains Chamber has verified the grant to him, under noble tenure, of the formerly church estates of Kopojno, Drzewce, Swięcia and Zagórów in the district of Konin, already handed over in kind, and requires him within four weeks to prove proprietary possession and to apply for a hearing date to have the title registered in his name.
oe1bu14525-020: Answering a petition of the 8th, the South Prussian Government at Kalisz grants the Prince of Hohenlohe-Ingelfingen a further period of grace to settle his title of possession in the estates of Drzewce, Kopojno, Swięcia and Zagórów, but only until the last day of October 1800, and for all purposes. Addressed to Glenck, the Prince's building and economy councillor at Wrocław, in place of a formal resolution.
oe1bu14525-021: 'An official extract from the Kalisz mortgage register sets out the charges on Zagórów, granted to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen in 1797 and registered in 1801: an annual allowance of 88 Rthl 5 Groschen 9 Pfennig to the Kalisz War and Domains Treasury, treasury and hereditary-lessee protests over wood and pasture rights, and a 250,000 Rthl loan to von Triebenfeld, portions of it pledged or ceded to the General Invalids'' Fund and to the Oppenheim and Wolff banking houses, plus an 8,000 Rthl claim by the Seher-Thoss heirs.'
oe1bu14525-022: A grant by Friedrich Wilhelm, made because an earlier gift of the absconded former Starosta von Prusimski's debt-laden estates had fallen short, conveying to his uncle Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, sixteen formerly ecclesiastical villages including Pszczew, Łowyń, Zagórów, Kopojno and Wrąbczyn in full heritable ownership, subject only to a fixed sovereign canon and payments to the ecclesiastical foundations. Filed with it are a certified copy made for registration and a mortgage certificate for the town of Zagórów, showing no debts but a bar on sale to a native without consent.
oe1bu14525-023: A judicial valuation of the noble estate of Szetlewek in the Konin district, parish of Rzgow, belonging to the Prince of Hohenlohe-Ingelfingen, issued in provable form by the Kalisz Government. It records the 1798 survey by Sprengel at 1,724 Morgen, graded arable, meadow, pasture, gardens, woods and ponds, the peasant holdings, mill, tavern and smithy, a lease to Ignatz von Radzinski to 1805, and a gross value of 34,803 Rthl, reduced to 31,171 Rthl 23 Groschen after deducting the lessee's inventory, with separate brewery, distillery and brickworks yields.
oe1bu14525-024: A badly damaged single-page note, largely illegible. What survives identifies it as a supplement or annex to an enclosed submission involving von Laski and one Melzer, dated 18 April 1803, and refers to outstanding matters arising from a hereditary-lease contract for Bątkowo. Too fragmentary to establish the parties' claims, the sums involved or the outcome; useful only as evidence that such an enclosure once accompanied the file.
oe1bu14525-025: A mortgage certificate for the lordship of Pszczew or Pszczew with its villages, the bailiwick of Zielomyśl and Silna, the Hollander settlements and the Heidemühle, held by the Prince of Hohenlohe-Ingelfingen as confiscated church land of the Poznań Cathedral Chapter. It records a yearly maintenance allowance of 2,470 Rthl 16 Groschen 3 Pfennig to the former ecclesiastical holders, and secured debts of 48,000 Rthl and 5,000 Rthl to Building and Economy Councillor Johann Wilhelm Glenck, 2,000 Rthl to Abraham Moses Hirschel, and 5,000 Rthl each to Baron von der Marwitz and Christiane Dorothea Michaelis. Issued to Glenck.
oe1bu14525-026: Notifies the Prince of Hohenlohe-Ingelfingen that, on his petition of the previous month and the original papers attached to it, three debts of 5,000 Rthl each, owed to Baron von der Marwitz, to the wife of Senior District Councillor Michaelis and to Councillor of Economy Glenck, have been ordered entered in the mortgage book against the lordship of Pszczew, with a mortgage certificate acknowledging each creditor's claim to be collected from the government archive after four weeks.
oe1bu14525-027: A royal attestation, made out at the Prince's request from the Pszczew land and mortgage records, certifying that the Pszczew estates in the district of Międzyrzecz were conferred on the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen by a deed of donation of 10 June 1797 and a declaration of 1 December that year; that only the Treasury's resignation is still wanted to settle his title; that the estates formerly belonged to the bishopric of Poznań; and that he has registered no debts upon them.
oe1bu14525-028: 'A mortgage certificate for the noble estate of Bątkowo in the Radziejewo district, held with Siedlemin in the Brześć district: formerly church property of the cathedral chapter at Włocławek, confiscated in South Prussia and granted with noble rights to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen by a deed of 1 December 1797, his title entered by decree of 19 July 1802. Two perpetual burdens stand: an unquantified annual allowance to the chapter, and a ban on selling to native-born Poles without royal consent. No secured debts.'
oe1bu14525-029: Johann Wilhelm Glenck, Princely Hohenlohe Councillor of Building and Economy, reports to the King that he has done everything needed to produce the documents rectifying the title of possession to the Hohenlohe estates of Kopojno, Zagórów, Drzewce and others, as ordered on 18 November. He believes the obstacle that has held matters up is now removed, expects the command to be fully carried out within four weeks, and asks that any severe measures be withheld meanwhile.
oe1bu14525-030: 'A royal warning from the South Prussian Government at Kalisz to Glenck, building and economy councillor to the Prince of Hohenlohe-Ingelfingen, at Wrocław: unless the mortgage affairs of the estate Swięcia and the estates belonging with it, Kopojno, Drzewce and Zagórów, are put in order within fourteen days, the Treasury will be obliged to proceed against his principal, the Prince. A single short page, signed Meuser.'
oe1bu14525-031: A royal rescript from the South Prussian Government at Kalisz calls on the Prince of Hohenlohe-Ingelfingen, having bought the estate of Trąbczyn and its appurtenances from the Treasury, to have his title entered in the mortgage book. Within four weeks he is to produce a certified copy of the judgment awarding the whole property of Anton von Prusimski to the Treasury, with a court attestation that the judgment has taken legal effect.
oe1bu14525-032: A request from Schultz at Kalisz to the Supreme Government Board at Wrocław, following up an earlier requisition of 24 September, asking that Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, be required to perform his oath of homage for the granted estates at the earliest convenient date, and that the record made of the ceremony be sent back to Kalisz. A single short administrative note with no financial content.
oe1bu14525-033: Glenck, writing for the Prince of Hohenlohe-Ingelfingen, presses the Royal Chamber at Poznań to have the treasury resign its claim quickly over the whole of the princely estates in Cujavien and Pszczew. He recalls that the Government at Poznań had itself demanded correction of the title of possession within fourteen days on pain of proceedings, and that the Prince then supplied the missing original deeds of donation. A draft of the same request to the government follows.
oe1bu14525-034: 'Replying to a representation of the 13th, the Royal South Prussian Government at Poznań informs Glenck, building and economy councillor to the Prince of Hohenlohe at Wrocław, of the state of the title transfers: the Treasury has already resigned Kolno and Kamionna, a term for resigning the Pszczew estates is set for 22 March, while for the Cujavian estates granted to the reigning Prince of Hohenlohe-Ingelfingen no resignation has yet been sought, and the title is to be put right promptly through an approved judicial commissary.'
oe1bu14525-035: Answering an application of the 13th, the Royal South Prussian War and Domains Chamber at Poznań tells Wilhelm Glenck, building and economy councillor to the Prince of Hohenlohe-Ingelfingen at Wrocław, that the chamber's fiscal officer Beyer has already been instructed to carry out the formal resignation by the Treasury of its claim to the Pszczew estates and those lying in Cujavia belonging to the Prince. A brief notice of authority given, with no further terms set out.
oe1bu14525-036: A petition to the King, on behalf of the Prince of Hohenlohe-Ingelfingen, pressing for the Treasury to resign title to the whole of the princely estates in Cujavia and Pszczew as quickly as possible. It recalls that a Royal Government at Poznań had earlier demanded that the title of possession to the Hohenlohe estates be put right as urgent, and that the Prince accordingly submitted the missing deeds of donation in the original. Signed by J. Wilhelm Glenck, princely Hohenlohe Councillor of Building and Economy.
oe1bu14525-037: A royal order from Friedrich Wilhelm, issued by the South Prussian Government at Poznań over Götz's signature, giving the Hohenlohe-Ingelfingen Building and Economy Councillor Glenck John a final fourteen days to carry out an earlier ordinance of 30 October and correct the title of possession of the lordship of Pszczew in the land and mortgage records in favour of the reigning Prince of Hohenlohe-Ingelfingen. A single page, chiefly a reminder to act.
oe1bu14525-038: Melzer reports from Poznań that the Chamber's fiscal officer again failed to appear at the hearing for the resignation of the Pszczew estates, having still received no authorisation, and that the business will not conclude until the Chamber instructs him plainly what he is to resign; he asks that the Prince press Chamber President von Harlem to expedite it. A postscript notes an appeal judgment in the case with the Cathedral Chapter and Kruhtswitz has been reversed in their favour.
oe1bu14525-039: Hoym reports that a Cabinet Order of the 23rd has granted the Prince of Hohenlohe-Ingelfingen, in heredity and full property, the town of Kamionna with the market town of Kolno, the villages of Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laske, Osiny, Hauland Trąbczyński and Brzyce; he is pressing the Feudal Department for the deed of donation and asking the Poznań Government about debts charged on these estates, forfeited by a leading insurgent, von Prusimski. Yield is put at 4,000 Thalers yearly, and Chamber Councillor Peucker at Fraustadt is recommended as manager or, if wanted, to find a buyer.
oe1bu14525-040: 'A royal rescript to the chambers at Poznań and Petrikau, complaining that the handing over of the South Prussian estates granted to the Prince of Hohenlohe-Ingelfingen was a superficial ceremony: persons holding pledge or lease contracts, some proven false, have been left in possession without proof of any real right. The chambers are to examine and settle such claims quickly, settle disputes amicably or through the fiscal officers, put the Prince''s agents in free possession, and fix and report the clergy''s competence monies.'
oe1bu14525-041: Hoym reassures the Prince of Hohenlohe-Ingelfingen that his South Prussian estates are being handed over, blaming a misunderstanding, and encloses dispositions sent by express courier to the Poznań and Petrikau chambers ordering the quickest possible transfer. He explains that the clergy have held the estates for the Treasury since 1 June 1796, may manage them only until Midsummer 1798, and that valuation assessments, not the surveys, now fix their maintenance allowances; existing leases should be tolerated to that term rather than risk compensation claims. Wieniec and Wolica are left to the Bishop of Cujavia.
oe1bu14525-042: A royal order from the South Prussian Government at Kalisz requires the Prince of Hohenlohe-Ingelfingen, within four weeks, to produce a certified copy of the confiscation judgment against Anton von Prusimski, together with an attestation that it has force of law, so that his title of possession to the estate of Szetlewek can be fully put in order. Signed for the government by Meuser, with Lucas noted.
oe1bu14525-043: 'A royal reply to the Prince of Hohenlohe-Ingelfingen, who had asked for a certified copy of the judgment confiscating von Prusimski''s property, attested as having force of law, so that he could put in order his title to the Trąbczyn estates granted to him. The petition is refused as misdirected: the judgment was drawn up not before the Government at Poznań but before that at Toruń, and he must apply there. His original enclosure is returned.'
oe1bu14525-044: 'A royal reply to a petition of 31 January by the Prince of Hohenlohe-Ingelfingen, who had asked for a certified copy of the sentence confiscating von Prusimski''s property, with attestation that it had taken legal force, so as to settle his title to the Trąbczyn estates granted to him. The request is refused as misdirected: the sentence was drawn up not by the Government at Poznań but by that at Toruń, to which he must apply. The original enclosure is returned.'
oe1bu14526-001: A covering note sending on the long-missing Witów files, with an urgent request that the recipient speak in person to the criminal-court councillor in Grimm about the matter. The writer explains that the papers had been searched for in vain in the registry at Trąbczyn, where he himself believed them to be, and only came to light on his move from his Wrocław lodgings to Wilhelmsruh, among his wife's belongings, she having received them in his absence and forgotten to pass them on.
oe1bu14526-002: 'Preliminary terms of sale, in eleven points, of the noble estate of Witów in the Warta district, sold by Forest Inspector Rochlitz for the Prince of Hohenlohe-Ingelfingen to Martin Honrichs and Valentin v. Kwasieborski for 16,000 Rthl in three instalments: no warranty for 1,016 składy of arable claimed by the burgesses of Warta, a fallback one-year lease at 800 Rthl if royal consent fails, and a 1,000 Rthl penalty. Filed with it, the Prince cedes 8,000 Rthl of the purchase money to the Wrocław banker Carl Ferdinand Weigel.'
oe1bu14526-003: Confirms and puts on record a sale, made at Birnbaum in June 1797, of the free village mayor's holding at Dormowo near Birnbaum by Joseph von Jankowski of Ninino to Captain and district tax collector Andreas Ernst Gneust for 2,000 Rthl. cash, with buildings, fields, meadows, fisheries, implements and sowing. Eleven clauses set the annual dues to the Pszczew manor, rights to graze 250 sheep, to brew for household use, and to free firewood and building timber. The purchaser bears all costs; Prince Friedrich Ludwig confirms, reserving examination of his entitlements against the old land registers. The deed was read to Jankowski in Polish by a sworn interpreter.
oe1bu14526-004: 'A purchase contract selling the Kolno and Kamionna (Kamionna) estates in the Międzyrzecz district, granted to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, by Friedrich Wilhelm II in 1796, to the Frankfurt an der Oder bank director George Conrad Leixner for 142,000 Rthl, already paid: 53,139 Rthl to the creditor in possession von Broniewski and 88,860 Rthl in cash. Sold without valuation; the buyer takes over two church capitals, clears a 100,000 Rthl mortgage, and assumes a disputed timber right in the Krobilaw forests against von Kwilecki.'
oe1bu14526-005: Sells the estates Kolno and Kamionna, with mills, forests, lakes, rents, brewing and distilling rights, labour services, hunt and jurisdiction, to bank cashier George Conrad Leixner of Frankfurt an der Oder for 142,000 Rthl, in Pausch und Bogen without valuation. Payment runs 76,000 Rthl already made to Bernhardi, 53,139 Rthl to cavalry captain von Broniewski under a settlement returning the estates, and a final 12,860 Rthl at handover. Leixner takes over church rents and taxes and intends to break the estates up.
oe1bu14526-006: 'A hereditary-lease contract granting the farmer Blazy Kukulski one Hufe of arable land, Magdeburg measure, near the estate of Osiny, made before the Hohenlohe patrimonial court by Councillor of War and Forests von Triebenfeld for the Prince of Hohenlohe-Ingelfingen: 100 Rthl purchase money already paid, 30 Rthl yearly rent from Christmas 1806, public dues, milling and drink obligations on the lessee, freedom from labour service, and the lordship''s pre-emption and tenth-Groschen transfer fee. Filed with it is Triebenfeld''s 1805 general power of attorney for Zagórów, Witów and Trąbczyn.'
oe1bu14526-007: 'A hereditary-lease contract, opening in Polish, by which the Prince of Hohenlohe-Ingelfingen, through his general authorised representative, Councillor of War and Forests von Triebenfeld, grants Gottlieb Sarre, a Hollander farmer from the Peyserschen Hauland, 1 1/2 Hufen of waste forest land near Trąbczyn in perpetuity: 150 Rthl entry money already paid, 45 Rthl annual rent in half-yearly instalments, three rent-free years to Midsummer 1809, half the rent redeemable, and binding terms on building timber, drink from the lordship''s brewery, milling, transfer fees and forfeiture for arrears.'
oe1bu14526-008: 'A hereditary-lease contract in sixteen paragraphs granting Christian Friedenberger of Szymanowicer Hauland one Hufe Magdeburg measure in the Trąbczyn forest in perpetuity for 100 Rthl paid, with an annual rent of 30 Rthl, three rent-free years on unbroken ground, half the rent redeemable at 100 Rthl per 5 Rthl abated, milling and drink compulsion, no building timber, and a tenth-Groschen transfer fee on sale. Filed with it: the Prince''s general power of attorney for von Triebenfeld, and royal consent to dismembering the Zagórów and Trąbczyn lordships.'
oe1bu14526-009: 'A six-year lease of the demesne farm of Kopojno, from Midsummer 1805 to Midsummer 1811, made before the Hohenlohe patrimonial court at Trąbczyn between the Prince of Hohenlohe-Ingelfingen, through his general authorised representative the Councillor of War and Forests von Triebenfeld, and Maciej von Niedźwiecki: 1,500 Rthl a year, payable in advance, in Pausch und Bogen without valuation, brewery, distillery and mill rents excluded, with terms on labour services, firewood, repairs and crop rotation. A supplement adds 13 Hufen at 625 Rthl, raising the rent to 2,125 Rthl.'
oe1bu14526-010: A hereditary quit-rent contract made before the Hohenlohe patrimonial court at Trąbczyn granting building inspector Johann Wilhelm Wollenhaupt 18 Hufen of arable at the Drzewce demesne farm and 2 Hufen of meadow near Wrąbczyn, with dwelling house and brewhouse, for 6,000 Rthl and 300 Rthl yearly rent, on condition he divide the land into ten peasant holdings. Filed with it is its cancellation three months later, von Triebenfeld paying Wollenhaupt 600 Rthl in full settlement of all claims from his service, with Wollenhaupt to quit the Drzewce house by Michaelmas.
oe1bu14526-011: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn between Councillor of War and Forests von Triebenfeld, general attorney for the Prince of Hohenlohe-Ingelfingen, and Johann Seymert, dyer and town councilman of Zagórów, granting him in perpetuity 3 Hufen of the Trąbczyn demesne, 2 Hufen 24 Morgen arable and 6 Morgen meadow, for 900 Rthl down and 45 Rthl yearly rent. Twelve clauses cover taxes, compulsory purchase of manorial drink, building at his own cost, a tenth-Groschen transfer fee on sale, and forfeiture after two years' arrears.
oe1bu14526-012: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn, by which the Prince of Hohenlohe-Ingelfingen, through his attorney Councillor von Triebenfeld, grants the forester George Friedrich Kammer of Pietrzykowo 6 Hufen 20 Morgen from the Przybysław demesne farm with its buildings and timber, for 2,100 Rthl payable in two instalments and a fixed yearly rent of 100 Rthl. Kammer bears all royal taxes and dues to Ląd monastery, must buy drink from the manorial tavern, and forfeits the holding if two years in arrears.
oe1bu14526-013: A hereditary-lease contract in nineteen clauses by which von Triebenfeld, general attorney of the Prince of Hohenlohe-Ingelfingen, makes over 20 Magdeburg Hufen of Trąbczyn field and meadow on the Kopojno side to district administrator Johann Gottlieb Tschachmann for 6,000 Rthl, 200 Rthl paid down and 5,800 Rthl due that June, plus an irredeemable yearly rent of 15 Rthl per Hufe. Tschachmann may resell in parcels; takers owe a tenth-Groschen transfer fee, must buy drink from the lordship, get no pasture or timber, and forfeit for two years' arrears.
oe1bu14526-014: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn between Councillor of War and Forests von Triebenfeld, acting for the Prince of Hohenlohe-Ingelfingen, and the princely forest inspector Carl Titz, granting Titz five Hufen Magdeburg measure of the Trąbczyn demesne arable, from the Podbiele road to the mill ditch, with the orchard by the stables. Purchase money 1,500 Rthl in two instalments, plus 75 Rthl yearly quit-rent, royal taxes, dues to Ląd monastery, compulsory lordship beer and brandy, and a tenth-Groschen fee on sale.
oe1bu14526-015: A hereditary-lease contract in 22 articles by which von Triebenfeld, general attorney of the Prince of Hohenlohe-Ingelfingen, makes over 270 Magdeburg Hufen of field, meadow and woodland at Trąbczyn, Łazy, Osiny, Neudorff and Przybysław to named settlers at 300 Rthl purchase money and an irredeemable rent of 15 Rthl per Hufe, with four free years on woodland, a tenth-penny transfer fee on resale, compulsory purchase of drink from the manorial tavern and joint liability. A closing note deducts 156 Hufen already parcelled out.
oe1bu14526-016: An eighteen-paragraph hereditary-lease contract made before the Hohenlohe patrimonial court at Trąbczyn, granting the demesne farm Althütte, 10 Hufen 10 Morgen Magdeburg measure, to six settlers, Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Damt and Christoph Schoenfisch, for 150 Rthl purchase money per Hufe, 1,500 Rthl in all, and 225 Rthl yearly rent. Terms cover free years on land still to be cleared, joint liability, a tenth-Groschen transfer fee, compulsory manorial drink, and cancellation of an earlier contract of 26 May.
oe1bu14526-017: 'A seventeen-clause contract by which Kunkel, acting for the Prince of Hohenlohe-Ingelfingen, sells ten Hufen and ten Morgen of the Alte Hütte demesne farm at Trąbczyn, with buildings but not the cow-byre, to six Hollander settlers led by Martin Giering, to be split into six equal indivisible holdings: 250 Rthl a Hufe, 2,500 Rthl in all, paid in instalments to March 1805, plus yearly hereditary rent, 10 per cent transfer fee on sales, forest wood and pasture rights, brick from the Trąbczyn works, and compulsory purchase of drink from the lordship.'
oe1bu14526-018: 'A hereditary-lease and sale of the whole lordship of Pszczew by Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, to the burgesses of Pszczew and the villages of Stołuń, Kuligowo, Szarcz, Stoki, Schwichodzyn and Łowyń, negotiated by his attorney Johann Wilhelm Glenck with the representatives Matheus Młynkiewicz and Jan Chmara: 180,000 Rthl plus 1,000 Rthl yearly ground-rent, largely met by taking over 137,000 Rthl of mortgage debts. Jurisdiction, hunt, transfer fee and forest oversight are reserved. A Polish interpreter was used; royal approval of 1806 follows.'
oe1bu14526-019: A hereditary-lease and purchase contract of 28-29 July 1804 by which Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, makes over the whole lordship of Pszczew, demesne farms, forests, lakes, brewing and distilling rights and the Obra farm, to the burgesses of Pszczew and the villages of Stołuń, Kuligowo, Szarcz, Stoki, Świechocin and Łowyń for 180,000 Rthl plus 1,000 Rthl yearly ground-rent, 137,000 Rthl of it by taking over mortgage debts. Jurisdiction, hunt, 10 per cent transfer fees and the castle are reserved; pending lawsuits pass to the communities. Negotiated through attorneys Glenck, Młynkiewicz and Chmara with an interpreter.
oe1bu14526-020: A grant by Friedrich Ludwig, Prince of Hohenlohe, of the manorial dwelling house at Swięcia to Friedrich Götzinger, innkeeper at Poznań, in full heritable ownership. The house had been expressly excepted from a hereditary lease of the Swięcia demesne farm buildings, fields, meadows and woodlands made the same day to Götzinger with Johann Christian Birlack of Zilenzig, Johan Götzinger and Joh. Siebert. It is given for Götzinger's trouble and travel in arranging the lease, and because he can use it as a tap-house under the brewery lease he has taken on.
oe1bu14526-021: Heads of agreement in twelve paragraphs by which von Triebenfeld, as general attorney for the Prince of Hohenlohe-Ingelfingen, sells the Witów estate in the Warta district outright to Franz Meierowitz with all appurtenances, in Pausch und Bogen and without warranty, for 20,000 Rthl (8,000 at St George's Day, 12,000 at Midsummer) plus a perpetual yearly canon of 500 Rthl, redeemable for 10,000 Rthl. Completion awaits annulment of an earlier sale to Honrichs, held incapable of possession and insolvent; a widowed Colonel von Schliesen's 6,000 Rthl may stand at priority, and Meierowitz must obtain royal concession to hold noble estates at his own cost.
oe1bu14526-022: A covering rescript from the Royal South Prussian Government at Poznań to the reigning Prince of Hohenlohe-Ingelfingen, sending him an official copy of the purchase contract for the estates of Kolno and Kamionna made with the bank cashier Leixner, confirmed that same day. A single page in the usual royal courtesies, with no detail of the sale terms beyond the naming of the buyer and the two estates.
oe1bu14526-023: 'A royal confirmation of a ten-paragraph contract by which Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, sold Kolno and Kamionna (Kamionna) in the Poznań district, granted to him in 1796, to bank director George Conrad Leixner for 142,000 Rthl., sold in Pausch und Bogen: 53,139 Rthl. went to the possessing creditor von Broniewski, the rest in cash, with two church capitals taken over, a 100,000 Rthl. mortgage ceded by von Triebenfeld to be cancelled, and a disputed timber right in the Krabielew woods passing unwarranted. Filed with it are Leixner''s powers of attorney to Guderian and their notarial attestations.'
oe1bu14526-024: 'Refuses the Prince of Hohenlohe-Ingelfingen permission to let the lordship of Pszczew in hereditary lease to the burgesses and rural residents, returning his submitted hereditary-lease contract. Three grounds are given: other landed lordships would follow suit and shrink the province''s noble estates; the Pszczew forest, the only substantial one in the district, would be devastated once lessees had free use of it; and the residents already hold enough land, lack the means, and the burgesses should pursue urban trades instead.'
oe1bu14526-025: A sale of the demesne farm of Szetlewek near Trąbczyn, 1,000 Morgen Magdeburg measure (arable, meadow, garden, land to be cleared and woodland) with its manor house, barns, stables and granary, by Johann Wilhelm Glenck for the Prince of Hohenlohe-Ingelfingen to the miller Samuel Lucke for 12,333 Rthl, 8,333 to the pledge-holder von Radzinsky, plus 500 Rthl yearly ground rent. Brewhouse, distillery and brewing and distilling rights follow for 400 a year; building timber is granted; villagers' labour services are withheld. Lucke, buying with associates, reserves four weeks to obtain their signatures.
oe1bu14526-026: 'Police burgomaster Nüchler of Pyzdry, the miller Luka of Białobrzeg and the marksman Reise of Wrąbczynek cancel their contract of 20 November 1798 with Glencke, the Prince of Hohenlohe''s building and economy councillor, to recruit settlers and pay the purchase money for parcelling out Szetlewek in the Trąbczyn estates: von Brzezinski, holding it in mortgage tenure, has obstructed clearance. They ask 200 Rthl for travel costs, which Glencke offers subject to the Prince''s approval, and settlers who paid earnest-money must look to the lordship.'
oe1bu14526-027: Titz and Bancke report to a Councillor of Building and Economy that the miller Luka has given up the contract and will settle details at Kalisz, having received 25 Rthl. Two more men seeking land were put off until matters with Trąbczyn and von Szucki are closed. They ask that the Royal Government be told of von Szucki's withdrawal-payment, and that the Prince add to the 1,000 Rthl the community offers, since the offer is inflaming von Szucki's harassment of the subjects; they request instructions.
oe1bu14526-028: Glenck reports to criminal-court councillor Grimm at Kalisz that his contract with von Radzinski is annulled, enclosing the correspondence. The three contracting parties Luck, Kriede and Nüchler refuse to withdraw, having already produced 18 farmers who have lodged pledges for nearly two thirds of the fields; Griese offers surety of 2,000 Rthl, to be secured at Pyzdry. Damages claimed should be charged to von Radzinski. A map is ready in the Slugozin meadow dispute, and the Trąbczyn Hollanders' privilege may cover only the first possessors and their descendants.
oe1bu14526-029: A court office at Pszczew notifies the Prince of Hohenlohe-Ingelfingen that Sigismund von Rzadkowski has sold his hereditary quit-rent holding at Głażewo to his half-sister Susanna, née Treben, enclosing a copy of the sale deed of 28 September and its papers. The contract has been approved subject to the princely rights, and the Prince is asked to declare within a set number of weeks whether he will exercise his right of pre-emption; silence will count as waiving it.
oe1bu14526-030: A 1766 privilege of Theodor, Prince Czartoryski, Bishop of Poznań, granted at Dolsk and approved by the cathedral chapter in 1767, selling Simeon and Apollonia Rządkowski and their heirs a waste Hufe of arable at Głażewo in the Pszczew key, with a manor-built house and barn, for 30 ducats, against 130 Polish gulden yearly in two instalments, poll-tax and winter money, four days of labour service and clearing of the Obsko meadow, with beer from the Pszczew brewhouse. Given in German, in the Latin and Polish original extracted from the chapter archive, and with a sworn translator's certificate.
oe1bu9454-001: 'The Prince presses Triebenfeld to obtain from Prince Hardenberg the advance of 112,000 Rthl and the immediate administration of the entailed estates; with that, he says, Cosmar''s power would end. He says an agent has promised to hand over the debt instrument in return for 12,000 Rthl and a secure order for a hundred thousand Rthl. The favourable report of the High Provincial Court at Brzeg has been sent in, he says. Triebenfeld is also to pursue the matter of Trąbczyn and Kamionna: the estates granted by the King were taken away by the Poles on their own authority, and the Emperor must order their return.'
oe1bu9454-001a: 'Triebenfeld submits a letter he has just received from the Prince of Hohenlohe, who is living in great distress, and asks that mercy be shown him. He says only the advance of 112,000 Rthl can save him: the Courland heirs would be satisfied, Cosmar''s power would end, and His Majesty would get the 112,000 Rthl back from the funds of the entailed estates. Regarding the Trąbczyn estates in the district of Konin mentioned in that letter, he asks for instructions whether he may now submit the deeds and documents.'
oe1bu9454-002: Triebenfeld is appalled that the Prince claims to have received no letters since the 13th. He recalls his 7 letters, among them one to General Schöler about Trąbczyn and the news that the districts of the estates are to fall to Russia. He begs for 200 ducats, since he says he must give the Prince Chancellor 100 and Barbe 70. He says the matters lie with Stägemann, the money will be paid and an administrator appointed. Prince August is to revoke Cosmar's power of attorney at once and notify the courts of this.
oe1bu9454-003: 'Von Triebenfeld complains of a shortage of money: he says he had counted on 1,400 Rthl for 4 weeks, but received only 932 Rthl in 5 months, and he urgently asks for 200 #. He says he intends to go with Barbe to Minister Nesselrode about the Polish matter. He advises proposing, by way of a memorandum, a loyal administrator of the entailed estates for the royal account, one able to give security and competent in the business. He hopes soon to have the Prince''s decision on the advance and the Polish estates.'
oe1bu9454-004: 'Reports on Napoleon''s return: he says Grenoble is in his power, that he has about 30/m men, and that 10 million Francken have been put on his head. Asks the Prince for a basket wagon for the servant of Court Councillor Barbe, who is to travel from Sławięcice to fetch Barbe''s sister from Switzerland, and for a vehicle with 2 horses for glass crates belonging to the Court Councillors Barbe, Heym and Philipsborn from Prague. Wishes Eberhard would come, asks what steps F. August has taken about the power of attorney, and requests further blank forms.'
oe1bu9454-005: Zerboni has called on Trzciński to pay him on the strength of an alleged assignment of the princely claim of 10,000 and 5,000 Rthl. v. Triebenfeld disputes this for the time being and urgently asks for information; he fears the Prince may have given Zerboni a blank signed paper. Trzciński claims to have already paid König on Zerboni's instruction for the business at Biskupice, which v. Triebenfeld considers fraud. He says the Prefect v Smiedecki in Kalisz has been won over and will report favourably in the compensation matter concerning the Sokolnik office.
oe1bu9454-006: 'Triebenfeld reports on the compensation in the Russian share: he has claimed the Starost''s estate of Sokolnik, set against the Prince''s claim; Minister Stein is to settle this with Nesselrode. In the Curisch matter he received, through Stägemann, instructions to come to terms with the Curisch heirs. They gave notice that Cosmar had offered them the Sytener estates. He expects the King''s declaration in 2 days. He says Hardenberg only makes promises. He urgently asks for 100 ducats by express courier.'
oe1bu9454-007: Charlotte von Triebenfeld asks the Prince to have one of his subordinates send her her father's address, so that she can write to him herself. This is her third letter without a reply; she says a letter from her father referred her once again to the Prince's kindness. She says her misery has passed all bounds, especially as she must give up the hope of describing her situation to her father in person. She no longer dares to ask for help.
oe1bu9454-008: Von Triebenfeld urgently asks the Prince to send 120 Rthl to his children, who are in distress, and 60 Rthl a month if his stay lasts longer. He says he is living on borrowed money. He says the Prince's case stands well. He asks whether a written assurance can be obtained from the Curian agent that the matter is to be settled with 112/m Rthl. He says there are powerful enemies. Apart from this assurance he says he needs nothing here. He intends to write to Hahn himself.
oe1bu9454-010: von Triebenfeld is surprised that his letters, mostly sent by way of Teichelmann, have not arrived, and intends to send a tracking slip after them. He says Stägemann has not yet made his report, but the Prince Chancellor gives the best assurances. He says he has handed the Polish matter over to the commission and expects estates rather than money for it. He passes on war news and rumours, wonders at Prince August's delay in revoking the power of attorney, and encloses a letter to Eberhard.
oe1bu9454-011: 'Triebenfeld reports that the Prince''s matter is to be decided favourably this week, but urges that Eberhard be sent to Vienna in haste to conclude a settlement with the heiresses; in the worst case the estates would have to be administered for 5 years longer. He complains that Prince August Cosmar will not accept the power of attorney, proposes a step to be pursued through Hardenberg in favour of Prince Adolph, and asks for 100 # in order to pay Barbe. With news of the congress and rumours of war.'
oe1bu9454-012: 'Triebenfeld urgently asks for the 200 # to be sent, since nothing can be achieved here without money and otherwise, despite a good position, all will be lost. Prince August should quickly demand the power of attorney back from Cosmar. He warns against the young gentleman''s written undertaking, which he hears the Prince left behind in Öhringen. He says the King of Württemberg has recognised those who were mediatised as estates and has sent a draft constitution.'
oe1bu9454-013: 'Triebenfeld urgently asks for 200 # and two blank forms signed in French. He says he owes Barbe 145 # and needs a coat, and that the papers are losing much of their value. The Prince is willing to have 100 # advanced to him, to be repaid to the treasury. Having had no news for three and a half weeks, he says he is living on water and bread. According to a report, H. wants Adolph to buy Koszęcin, which is said to yield 55/m Rthl a year. Triebenfeld compares it with Sławięcice.'
oe1bu9454-014: 'The writer asks why nothing has yet been decided on the complaint of the Prince of Hohenlohe. He considers an investigation said to have been opened against Cosmar harmful, since Cosmar could then withhold the rent outstanding since Midsummer 1812. A settlement over the debt, he says, has failed: the general attorneys refuse, because councillor of justice Henneberg was told in Berlin to let the matter rest. The King should take over the debt entirely; the Prince might well also be released from 35,000 Rthl.'
oe1bu9454-015: 'Triebenfeld reports that, according to a letter from the State Chancellor, the King has no objection to the payment of the 100,000 Rthl claimed by Prince August, a bequest of Princess Sakkin; he says Kircheisen has been instructed. The advance of 112,000 Rthl is regarded as secured, and Cosmar''s removal has been decided. He says the Trąbczyn matter will meet great difficulties: the Polish files would have to be translated, but he lacks the 260 gulden for the translator. Gravely ill and without means, he urgently asks for help, also for his daughter.'
oe1bu9454-016: Triebenfeld has asked Lieutenant Colonel v Thiel whether the King will still be in Vienna when Prince Adolph arrives on the 20th. Thiel assures him the King will be pleased and that no one will leave before the 22nd. Triebenfeld has not yet spoken with Hardenberg, and the Prince's affairs continue to rest. He reports that Murat has advanced as far as Mantua and that Bonaparte is gathering troops near Paris. An equivalent must be given to the Prince for estates. The closing passage, about a mortgage at Zagórów, is barely legible.
oe1bu9454-017: 'Triebenfeld defends himself against the charge General Kleist made before Prefect Count Garczynski at Kalisz: that the Prince''s sons had said in Berlin that Triebenfeld was pocketing all the income. He points to Cabanis, Hecker, Honrichs and the sequestrators, and is having the matter investigated by the komornik v. Chomanowski. He says the arrears of interest, leaving aside the Oleśnica, Wrąbczyn and peasant estates, come to nearly 30,000 Rthl. He complains of Sommer''s rumours about the Prince''s debts and asks for a quick answer regarding Sobottendorff, Weigel and the invalids'' sum.'
oe1bu9454-018: v. Triebenfeld returns the instrument and power of attorney sent by the Prince, since he says he already holds a general power of attorney and everything has been seized. He says that under French seizure he had to pay the Invalids' Fund on the Prince's behalf. The French General Direction ordered the 3,121 Rthl to be repaid out of the estates. He asks for a declaration assigning him 4,219 Rthl from the arrears of interest owed by the inhabitants of Wrąbczyn, Alt Olesnica, Kopojno, Skokum, Świątniki and other places, to be collected through a komornik.
oe1bu9454-019: Triebenfeld presses for an agreement with Sobottendorff, to whom the Prince owes 40,000 Rthl. After the agreement with Tschachmann and with Hawich, to whom he must give a mortgage on his Blizanów for 1,300 Rthl, he intends to lease lands, buildings and meadows to Sobottendorff for 18 years for 36,000 Rthl. He asks urgently for the instrument drawn up according to his instructions, since everything is under seizure, and holds out to the Prince the prospect of 4,000 Rthl from the Witów lawsuit, should it be won.
oe1bu9454-020: 'Under a new cabinet order, payment must be made in Courant even where the sum was lent in paper money. He says this means a loss of 1,500 Rthl in the van der Lahr matter. The writer fears arrest by van der Lahr over 3,000 Rthl. He says he wrote to Amelang telling him to offer van der Lahr a settlement: 1,000 Rthl in cash and 350 Centner of iron at 6 Rthl by the end of April. For this he asks for 950 or 1,000 Centner of iron to be sent to Konotop by 20 April.'
oe1bu9454-021: Triebenfeld is sending another messenger to the Prince by way of Lombardini. After a visit from Dlugo Lędcki he reports fear of the Russians arriving soon; in the judgement of every Pole, he says, the Prince will get back the Trąbczyn, Kamionna and Brzyce estates. He asks for a quick reply and for money for bribes, since he is without means; he says he has leased out Konotop and Świniary for 14,000 Rthl a year. He expects the document and the money. Lombardini is to give his daughters in Wrocław at least 200 Rthl in coin.
oe1bu9454-022: 'Triebenfeld complains about the lawsuits he is conducting on account of his surety for the Prince: over the Invalids'' Fund, with Oppenheimer and with Schliefen. In Poland he says he is suing Meierowitz, who owes Schliefen 6,000 Rthl of purchase money from Witów and the Prince 2,500 Rthl of ground rents. He says Stenger is to pursue the matters; he calls Hawich the greatest rogue, and says a Badenski is collecting in all the money. Lombardini did not pay the 150 Rthl; he would like 500 Rthl in coin for his children.'
oe1bu9454-023: Triebenfeld complains that the Prince has sent his daughters no money; he says that beyond the 4,300 Rthl he received he has borne great costs himself, is subject to execution and is ill with gout. Criminal Councillor Stenger is to put everything in order in Zagórów, Trąbczyn, Pszczew and Witów; he promises to recover Trąbczyn and Kamionna and proposes a clerk of the court, Seifert, for 250 to 300 Rthl, and Triebenfeld asks for approval. Honrichs is to prove his identity, or Stenger will have him arrested. It is said that the Russians are going to occupy Poland.
oe1bu9454-024: The writer asks a privy councillor to arrange a loan of 400,000 Rthl to pay off all the debts, secured by a first mortgage on Zagórów and Trąbczyn. He says their net yield after the settlement has been confirmed by the Chamber of Kalisz at 40,247 Rthl. A power of attorney and documents are to follow. Enclosed are a list of the places in both lordships (among them Trąbczyn, Szetlewek, Przybysław), a calculation of yield signed by v Triebenfeld (hereditary rents of the colonies 16,781 Rthl) and a list of debts totalling 366,000, including Prusimska at about 16,000.
oe1bu9454-025: 'Triebenfeld says he has settled a new peasant uprising in Zagórów against the separation of the lands. Through Councillor of Justice Bucholz, 80,000 Rthl from a von Bredow have been promised to him: 30,000 Rthl on Konotop, 20,000 on Świniary, 30,000 on Trąbczyn for Weigel''s Grotowski mortgage. To be paid out are 25,000 to Countess Schlabrendorff, 25,000 to Weigel, 5,000 to Hahn for Koszęcin and 5,000 in cash to the Prince. Tesmar is negotiating with Nathusius in Magdeburg over 360,000 Rthl on the South Prussian estates.'
oe1bu9454-026: Triebenfeld says he has learned from Secretary Koppe that the Prince survived the army's defeat. Minister von Stein lent him 8,000 Rthl on the Konotop mortgage of 10,000 Rthl. He is sending the order for 6,000 Rthl to Koppe, and he intends to bring 4,000 Rthl as soon as he knows where the Prince is staying. On a mortgage on Świniary of 20,000 Rthl he means to ask Stein for money again. He hopes the Prince will receive the Kolzig estates; then he could raise 100,000 Rthl.
oe1bu9454-027: Triebenfeld reports that the Prusimski family has taken Trąbczyn and Kamionna by force. He has only had protests entered in order to secure the sum he registered, but for the time being he expects them to be rejected. He says Napoleon's answer to a letter from General von Sanitz's wife, whose husband's estates were taken from her, will serve as the standard. He intends to travel tomorrow to Memel, perhaps on to St Petersburg, and hopes to obtain help through Emperor Alexander or Grand Duke Constantin.
oe1bu9454-028: 'Hawich reports that, by order of the governing commission, the Trąbczyn estates were taken away by the appeal judge von Lipski and handed over to Canon von Jezierski, general attorney of Mrs von Dąbska née von Prusimska; he says he lodged a protest. New lawsuits: Provost Iwanski demands the tithe from Swięcia, and Martin von Otocki and the miller Ekstaedt demand about 7,000 Rthl in compensation arising from a Trąbczyn lease contract of 1798. He asks for the settlement from Wrocław and for a power of attorney.'
oe1bu9454-029: Bally reminds von Triebenfeld of the meeting the latter had promised him when they met Court Councillor Hahn at Łosiów near Brzeg. He supposes him to be in Wrocław again and asks whether and when he might call on him there, since his master (His Serene Highness) has asked about it. He has heard that French troops are to be quartered at Sławięcice as well. In that case he could not get away, and it would be worse still if he had to clear out the stables. He hopes for a talk soon.
oe1bu9454-030: Triebenfeld reports that French gendarmes held him under arrest as general attorney until the arrears of interest of 5,000 Rthl on the 50,000 Rthl of the Invalids' Fund were paid. Oppenheimer, who had taken on the payment, bought himself free. Zastrow stood surety for 5,000 Rthl, to be repaid by 1 June. Triebenfeld urgently asks for the return of the order for 6,000 Rthl assigned to Eysenhardt, so that he can redeem his pledged mortgage of 10,000. Zastrow is pressing the French authority for the return of the Trąbczyn estates.
oe1bu9454-031: 'Triebenfeld, who says he fell ill after his arrest over unpaid interest, asks for the return of the order for 6,000 Rthl so that he can recover the pledged mortgage of 10,000 Rthl. He complains that the Prince has appointed Hawich of Pyzdry as justiciary and has given Honrichs a general power of attorney, which he says should be demanded back, and he proposes salaries totalling 1,800 Rthl. On the lawsuits: Ignatz von Radzinski is in arrears as hereditary lessee of Szetlewek; the Przespolewski case belongs to Trąbczyn and the Prusimski heirs.'
oe1bu9454-032: Triebenfeld says he cannot send a new statement; in the one sent two years ago only the Trąbczyn revenues need to be deducted. He puts the income of the lordship of Zagórów at 27,700 Rthl a year and the debts at 148,800 Rthl, so that 20,260 Rthl would remain. Oppenheimer has not paid the 50,000 Rthl to the Invalids' Fund; Triebenfeld has sued him. He does not consider the Trąbczyn estates lost. He had had 200,000 Rthl from Holland in prospect and asks for early news of the Prince's prospects.
oe1bu9454-033: 'He urges great caution with general powers of attorney: according to Chief Inspector Hecker, Honrichs used his power of attorney to lower the price of the Hufen to be sold from 600 to 300 Rthl. He proposes using a capital of 150/m Rthl to settle with Oppenheimer, Haugt, Ephraim and Eysenhardt, and to pay the Invalids'' Fund 50,000 Rthl in Courant. He says he obtained from the French authorities an order concerning the arrears in South Prussia, with military assistance.'
oe1bu9454-034: 'Triebenfeld calls Honrichs''s submission boundless nonsense: he says Honrichs never answered any of 21 letters and delivered neither money nor account. He says that after Schmid''s death he engaged Hecker at 600 Rthl a year plus an allowance in kind, since the French authority wants to have the arrears collected and proof attested by a court is needed for that. His chief concern is the repayment of the money borrowed for the Invalids'' Fund and the return of Zastrow''s bill of exchange and mortgage.'
oe1bu9454-035: 'Triebenfeld protests against the instructions the Prince issued through Court Councillor Meyer to Privy Councillor Amelang: sums are to be drawn on the bank order for 6,000 Rthl that has been declared invalid. He says he was arrested as authorised representative over 5,000 Rthl of interest; with the help of Minister v Zastrow, 5,000 Rthl were borrowed from van der Lahr, payable on 14 May. He urgently asks for advice on paying the missing 3,125 Rthl and for an order to Amelang to return the bank order to him.'
oe1bu9454-036: 'Letter to von Triebenfeld, partly illegible. The writer defends his handling of the order for 6,000 Rthl: he says Eysenhardt demanded 2,500 Rthl in cash in January 1807 on account of an old debt and received the order in return for repayment of 3,500 Rthl. After payment was suspended, the writer says he instructed Assessor Koppe to pay Eysenhardt and to take back the order held in safekeeping by Amelang. He sends the 3,000 Rthl Courant demanded and asks for a visit on the journey to Vienna.'
oe1bu9454-037: Triebenfeld says he does not want to pass on the Prince's deposits to Koppe, because Eysenhardt is then to draw money from the bank assignment. He says the bill of exchange belonging to it has expired. The Prince should instruct Amelang to return the assignment and satisfy Eysenhardt in some other way; otherwise Triebenfeld intends to have it publicly declared invalid. He says he is as good as under arrest and asks for 2,000 Rthl for the interest on the invalids' fund. He says Laar must receive 5,000 Rthl Courant, or Zastrow will be put in difficulty.
oe1bu9454-038: Triebenfeld, seriously ill, reports the receipt of 3,000 Rthl from the banker Veit and the handing over of the order of payment to Amelang. He says he has used it to pay off part of new debts of 5,176 Rthl. Instead of money, timber and boards from Konotop were accepted, with which 4,176 Rthl are to be paid off. He says the Prince should make good to him the loss of 3,480 Rthl. He advises raising 150,000 Rthl in order to acquire papers worth 750,000 Rthl and pay all the debts.
oe1bu9454-039: On his return Triebenfeld faces enforcement proceedings over 3,000 Rthl of debts. Of the 6,125 Rthl to be settled, the Prince has authorised 3,000 Rthl, leaving 3,125 Rthl outstanding. He begs for an authorisation for at least 2,000 Rthl so that he can travel to Königsberg, and intends to look for guarantors. Nothing is coming in from Zagórów, so he says the strictest enforcement through the French authority is needed. Letters should go to Justice Commissioner Empich. He recalls the large loan.
oe1bu9454-040: Triebenfeld argues for a loan of 250,000 Rthl on the Zagórów mortgage, with which, he says, securities worth 750,000 Rthl could be bought and all debts paid off. He says 46,000 Rthl are needed first (Oppenheimer about 28,000, the Invalids' Fund 15,000, Meyer Bernhard and small items 3,000). He is to go first to Vienna, then to Holland and Paris. He says the French government promised military help in collecting the Zagórów arrears; the subjects are refusing the interest due because of a ban by the King of Saxony.
oe1bu9454-041: Triebenfeld received the letter too late to travel to Erfurt with the Count, and he has no cash. He means to borrow money and, when the Emperors return, to work through the Grand Duke on the Prince's behalf. He says the French government has partly lifted the sequestration in South Prussia and ordered the revenues released. He says Lichnowski belongs at Trąbczyn and must wait there. Metzig is to be reprimanded for not collecting the townspeople's debts of 8 to 9,000 Rthl.
oe1bu9454-042: Triebenfeld reports that he was arrested by French gendarmes as the Prince's authorised representative, so that arrears of interest of 3,521 Rthl would be paid to the Invalids' Fund. Since van der Lahr is suing him for a further 3,000 Rthl and is preventing his departure, he urgently asks for 2,068 Rthl to be sent to Konotop, which his creditors are placing under sequestration. He says the French General Government has ordered the lifting of the sequestration on account of the Invalids' Fund. He says he has protested against the sequestration of Zagórów and has begun proceedings against Oppenheimer.
oe1bu9454-043: 'Triebenfeld reports a judgment passed on to him by Amelang: Lahr is to receive the remaining 3,000 Rthl in cash rather than in paper, and in the bill of exchange proceedings Triebenfeld otherwise faces arrest. Amelang has appealed and, with Grevenitz, considers victory certain, which would save about 1,500 Rthl. Triebenfeld begs for the 3,000 Rthl to be deposited quickly. He says the sequestration is to be lifted after payment of about 10,000 Rthl in interest. He asks for 600 Centner of iron for the merchant Michaelis, who gave him 2,000 Rthl.'
oe1bu9454-044: 'The Lahr lawsuit is keeping Triebenfeld back: according to the judgement communicated by Amelang, Lahr is to receive a further 3,000 Rthl with interest, but must accept paper. He says he has repaid Coste the 9,000 Rthl and paid 450 Rthl in interest; he needs 2,068 Rthl. By order of the French government these monies are to be reimbursed out of the Zagórów estates. Michaelis is willing to settle the 2,068 Rthl if the Prince delivers him 600 Centner of iron at 4 Rthl, free to Opole, by May.'
oe1bu9454-045: Triebenfeld says he has left Berlin to avoid imprisonment after the court ordered the immediate payment of 3,000 Rthl to Lahr. Amelang has appealed. The merchant Michaelis gave 2,400 Rthl for the payment of Mathieu. Triebenfeld thanks the Prince for the promise of 600 Centner of iron, which he says he has sold to Michaelis, to be delivered by 1 May at 4 Rthl per Centner free to Berlin, and he asks for delivery to Konotop at the beginning of April and for 100 Friedrich d'or and 100 ducats. Hawich and Hecker brought good news from Zagórów.
oe1bu9454-046: 'Amelang reports that Triebenfeld will probably have received the letter of the Prince of Hohenlohe together with the enclosed money; he says it was drawn from Berlin on Konotop. In one matter, he says, the files lie with the court of appeal for judgment, but no favourable decision is to be expected. The reason is a declaration of the King printed in the Berlin newspapers today: bonds are to be paid in Courant, retroactively back to 1806. Amelang expresses his sympathy for Triebenfeld. The text is partly illegible.'
oe1bu9454-047: Triebenfeld replies to a Court Councillor on four points. He says the Saxon moratorium protects the estates for 3 years provided the interest is paid. The 50,000 Rthl of the Invalids' Fund, he says, stand as the first mortgage, and lawsuits against Oppenheimer are pending in Berlin and Kalisz. Meyer's claim, he says, is unfounded; a suit for 25,000 Rthl is pending against Giese et Consorten, as is one in Niedźwiecki's case. The Augustinow colonists' petition for remission should be rejected, since their hereditary lease contracts oblige them to pay.
oe1bu9454-048: 'Triebenfeld has received Hawich and Chief Inspector Hecker and has issued thirteen court powers of attorney. Hawich is to press for the dismissal of Dąbska''s claim to the Trąbczyn estates and to work for the lifting of the sequestration. Further instructions: to collect interest, to sue Oppenheimer et Wolff in Kalisz, to remove the sequestrator Honrichs and annul his unauthorised sales of land, to recover arrears of rent from Niedźwiecki, to conduct boundary lawsuits and to represent the Prince at the Diet in Warsaw. Triebenfeld believes his bond for 250,000 Rthl gives him a say among the creditors.'
oe1bu9454-049: 'Triebenfeld complains that a messenger from the Prince''s house came without any answer to his letter. He says he is under arrest and may not leave until the promised 600 Centner of iron have been sent off and justice-burgomaster Schenck has released him. He urgently asks that the iron be sent to Bojadła (Boyadel) to his administrator Neumann. With 1,000 Centner, he says, Michaelis Lahr and all the Berlin costs would be satisfied. Postscript: a rumour of a Russian corps on the Polish-Silesian border.'
oe1bu9454-050: 'Friedrich Ludwig asks the King not to force v. Triebenfeld by execution or distraint to pay a sum for which he himself stands surety. The French government had extracted from Triebenfeld 3,125 Rthl in interest owed to the Invalids'' Fund on a capital of 50,000 Rthl secured on the Zagórów estates. For this Triebenfeld borrowed 5,140 Rthl from van der Lahr against a bill of exchange with Zastrow. Van der Lahr sued for the remainder. Amelang is to settle: 1,000 Rthl in cash, the rest in iron by May.'
oe1bu9454-051: 'Triebenfeld reports that the execution has been lifted, he says, but the iron has still not arrived. He travels to Königsberg tomorrow and will not judge the inheritance matter until after that. Because of the new decree on seizure of property in Poland he has summoned Honrichs, who he says means to bring the Prince several thousand. He says Hawich seems to be a scoundrel; Triebenfeld fears he is holding back original papers entrusted to him. Bethusy lies gravely ill. Rumours from Saxony: Prince Hohenzollern near Leipzig, Austrians in Munich. Postscript: Honrichs is coming and is to bring money.'
oe1bu9454-052: v. Triebenfeld says he has presented the Prince's letter together with its enclosures to the Queen, who received it kindly. She passed the matter to the Grand Chancellor, who forwarded it to Cabinet and High Court Councillor Albrecht, with whom Triebenfeld is now working on it. Since Beyme appears to pay close attention to form, he fears a long drawn out business. The King has forbidden any talk about politics, and especially about the war between France and Austria, as the reports contradict one another. Köckritz sends his regards.
oe1bu9454-053: 'Triebenfeld reports that no decision has yet been issued in the inheritance matter; the case lies with Grand Chancellor Beyme together with the opinion of Cabinet Councillor Albrecht. He urges the Prince to write frankly to the King about his court martial case and to ask for it to be brought to an end. He says Major von Pirch is his most faithful friend. Massenbach''s case, he says, depends on Scharnhorst, who is ill with fever. He adds war news: Russia, he says, is breaking off the diplomatic negotiations with Austria, and Schill is said to have cut down 2 regiments and taken 4 cannon.'
oe1bu9454-054: Triebenfeld begs the Prince to deliver the 600 Centner of iron (300 of bar and hoop iron, 300 of rail iron) to Bojadła by 23 April instead of to Opole at the end of May. He says delivery in Berlin on 1 May was promised to Michaelis, under a penalty of 500 Rthl and a bill of exchange for 2,400 Rthl. Van der Lahr, he says, offers 5 1/2 Rthl per Centner and should accept 6 Rthl. Triebenfeld intends to raise the 4,000 Rthl assigned at Zagórów. Against an alleged threat by Weigel, he says the general moratorium until Midsummer 1810 gives protection.
oe1bu9454-055: Triebenfeld reports that van der Lahr is now proceeding against him in Wrocław as well. He is waiting for 1,000 Centner of iron at Konotop. On the Colonna inheritance for the Queen, he says Count Götzen can serve as a witness, but advises restraint because of Count Wratislaw. Triebenfeld proposes that the Queen should take the estates, worth about 3 million, and leave Wratislaw the money. For Götzen he has drafted a letter to the Queen. With this, war news and Bethusy's debts of about 500,000 Rthl.
oe1bu9454-056: Triebenfeld waits in vain for the 1,000 Centner of iron, without which he says he has neither travel money nor any way to satisfy Michaelmas and travel to Königsberg, and he asks for prompt delivery to Bojadła. In a postscript he reports that iron has left Opole, but that he is expected to pay the freight. Lahr is to receive 400 Centner at 5 Rthl 12 Groschen, that is 2,200 Rthl. He asks that the freight be taken over and that the missing 217 Centner be sent.
oe1bu9454-057: 'Triebenfeld says he cannot come to report for lack of money: a trunk worth more than 800 Rthl was stolen from him on the journey. The iron, he says, is lying at Konotop, and the remaining 400 Centner are not enough to pay van der Lahr the 3,000 Rthl. From Königsberg: he says the King ordered that the Prince be spared, and that in the inheritance matter Hoyok is to search for the will in Warszawa. Once his case is decided, he says, the Prince is to become Governor General of Silesia.'
oe1bu9454-058: 'Triebenfeld thanks the Prince for 50 Friedrich d''or, which he says he received through Bally and used to buy himself off from the execution for four weeks. At Kosten he says he must provide 80 armed men. Writing from Kalisz, where Garczynski is Chief Prefect and Zychlinski holds office, he reports on the plans of the Poles: the restoration of Poland and Constantine as king. He says he is writing to the King to forbid exports as well, and warns that acting too hastily risks confiscation of the estates.'
oe1bu9454-059: Triebenfeld complains about the sequestration of Konotop and the execution against the Świniary estates on account of 2,560 Rthl in interest and the debt owed to van der Lahr. He says he sent the latter iron and boards worth 2,570 Rthl, leaving 430 Rthl outstanding. Grain, wool and timber worth about 7,000 Rthl are finding no buyer, which is why he cannot come to the Prince. The Prince should write directly to the King. Honrichs may not take money out of the country, and Triebenfeld asks Brzechffa whether cattle and grain may be exported.
oe1bu9454-060: Triebenfeld reports that at van der Lahr's instigation everything in Świniary has been sealed and placed under sequestration, and in Konotop too. Van der Lahr has been paid, he says, and Grevenitz is sending his receipt and consent, which Triebenfeld is forwarding to Loen in Wrocław. The sequestration, however, remains in force on account of the interest on 1,860 Rthl. Fetching money from Zagórów has been forbidden, he says, and Honrichs arrested. He asks the Prince to raise 1,800 Rthl and send it to Professor Schade. He says he cannot travel to the Prince for the time being.
oe1bu9454-061: The writer urgently asks a Court Councillor in Wrocław to obtain 1,800 Rthl from the Prince for interest now due. He says the van der Lahr affair has left him exposed and that his estates have been placed under sequestration. With 1,800 Rthl, he says, Świniary could be saved. He then intends to break up part of his estates, assign the interest to his children for their support, and go to the King. Without help he says he will go to Königsberg; with it he could leave on 12 September and be in Sławięcice on the 16th.
oe1bu9454-062: 'Triebenfeld complains that he has had no answer to five letters, and sends this sixth one through the Chief Post Director Mann. He reports that everything seems to be succeeding: he says the Curische debt will be paid off, the settlement annulled, Cosmar must withdraw, the Prince will come into possession of the entailed estate, and the Polish estates will have to be given back. He says he is suffering pressing hardship and urgently asks for money, if need be by express messenger. Letters should be sent to Mann in Vienna.'
oe1bu9454-063: Writing after a seven-week illness, Triebenfeld reports that before Konotop can be leased he must pay 8,000 Rthl in arrears, and that he hopes for a timber buyer. Honrichs has arrived; Triebenfeld advises coming to terms with the Prefect, who wants to buy the estates and can help in recovering the Trąbczyn estates, in wresting the appropriated estates from Dąbska and in turning away the administrator. He says Hecker and Hawich incited Niedźwiecki and Ostarszewski to make a denunciation that brought about Honrichs' arrest, and that the informers have retracted it in writing.
oe1bu9454-064: 'Triebenfeld reports the death of the Queen at Strelitz and the King''s serious illness. He says the Collonna affair is now an absurdity and the Prince should secure his 100,000 Rthl. Because of the interest on the invalids'' capital, he says sequestration of his estates is threatened. Enclosed is a proposal to a friend: Knobelsdorff''s estates Biskupice and Molna at 700,000 Rthl in exchange for the Zagórów estates and the discharge of the claims of Weigelt and Stössel. In a postscript Triebenfeld urgently asks for 300 Rthl in Gold.'
oe1bu9454-065: Triebenfeld asks that the Koszęcin ironworks lend him 300 Centner of bar and hoop iron against the enclosed bill of exchange, at 4 Rthl 12 Groschen per Centner delivered free to Bojadła. The freight charges should be paid there, since he says boatmen have taken iron from him in the past. He intends to trade iron for spirits. A commission is to bring his sequestration to an end, after which he means to travel to Sławięcice. He sets out his debts, amounting to 25,100 Rthl in all, and reports a rumour that the Prince has been appointed Governor General of Silesia.
oe1bu9454-066: Triebenfeld says he expects the false informers to be given six years' imprisonment in a fortress and the agitators to be expelled. Honrichs' claim against Hecker, he says, is three times the latter's security. Requests from the colonists and peasants for a reduction of interest should be refused. For Garczynski, Zakrzewski and Brzechffa he is having three bucks shot. The boatmen Kulawy and Neumann are holding back some seventy odd Centner of iron over 243 Rthl 14 sg of freight charges; he asks for the receipts. The Trąbczyn lawsuit will cost a great deal. Coste, he says, would pay 8,000 Rthl for 2,000 Centner of bar iron.
oe1bu9454-067: Triebenfeld cannot leave Konotop because Coste has not come; Konotop has been leased out, Świniary not yet. Hawich accuses Honrichs of fraud; Triebenfeld has summoned both and wants to send an actuary to Zagórów to find out who has taken money from subjects and tenants. He says Hawich, Honrichs and Hecker have unlawfully appropriated Hufen for themselves. More than 12 deputations from the village communities asked for time to pay. He asks for the freight, customs and weighing notes for the iron.
oe1bu9454-068: Honrichs has shown Hawich's statements to be false. Under the contract, the settlers must reimburse the Prince for the requisitions of 22,000 Rthl. For the hearing on the 28th before the justice of the peace Kwilecki in Konin, Honrichs needs the original deed of donation for Trąbczyn. Triebenfeld urgently asks that it be sent by express courier, saying the Kamionna matter also depends on it. Kwilecki advises suing Lipski, who handed the Trąbczyn estates over to Dąbska. Triebenfeld is without means and demands at least 1,000 Rthl Courant.
oe1bu9454-069: Bally reports that he could not obtain the money at once in Wrocław and was delayed by the roads and the weather. At midday on the 25th he still found Honrichs and Cabanis there. Both left the same day, Honrichs with 6,000 Rthl and the original deeds of gift, and in the happiest of spirits. Triebenfeld is suffering from his right arm. He has promised to come to Schlawentz for a few weeks as soon as his own business is finished. Bally intends to return soon.
oe1bu9454-070: 'From Trąbczyn, Triebenfeld reports an advantage: Kramplitz failed to appear, and a new hearing has been set for 2 April. He says Raczkowski and Küntzel are pursuing the matter with Honrichs, and he considers recovery certain. Hecker, who has given surety and means to pay by Midsummer, remains at the cash office because of a misunderstanding on the part of Chief Prefect Garczynski; Cabanis is to check on him. Triebenfeld intends to go to Berlin for 6 days. For the sequestration of his own estates the Landschaft is demanding some 4,000 Rthl in costs.'
oe1bu9454-071: The Rochlitz matter has been started. Triebenfeld hopes the Prince will not have to pay anything, and calls it a swindle. He says he dismissed Rochlitz in 1804 as general attorney, which Glenck could confirm. He urgently asks for two or three printed powers of attorney for the lawsuit, signed and sealed, so that Metzig can pursue the matter and call in outstanding balances of close to 18,000 Rthl. He expects Honrichs and wants to come to Sławięcice as soon as the matter is safely on track.
oe1bu9454-072: The writer says he has given up the exchange project with General v Schimmelpfennig and suspects that the lease to Brzechffa has fallen through. He says he has permitted an inspection of the estates around Zagórów for a new exchange project. He also wants to sell his claims on the Trąbczyn estates and is sending a messenger about the original deed of gift. He asks what came of Brzechffa's intercession in Warsaw in the Trąbczyn lawsuit, and requests the 300 Rthl for Lieutenant Sommer.
oe1bu9454-072a: 'He reports that the lawsuit against the peasants of Wrąbczyn has been won: the contract has been annulled, the arrears are to be paid, and eviction is possible. The journey with Brzechffa to Sławięcice has been postponed, since he and Prefect Garczynski have been summoned to Warszawa; he says Brzechffa is bringing 2 to 3,000 Rthl, and the Prince should decide on the lease contract for Zagórów. The Trąbczyn matter is to go before the Rada Stanu. Despite 80,000 Rthl of debts, he says the estates would be free of debt if the old Hollanders pay 40,000 Rthl for the forest and Dąbska has to pay damages.'
oe1bu9454-072b: Triebenfeld reports, on the basis of the enclosed letters from Brzechffa and Thiele, that Brzechffa cannot leave Warsaw until the 15th and intends to bring money with him to Sławięcice. He says Brzechffa has promised to avert the new assessment of the Zagórów estates at 5,897 Rthl. Niedźwiecki, he reports, lost the lawsuit and is to pay 2,000 Rthl, while the Wrąbczyn peasants are threatening to appeal. The district under-judge Piekarski, ringleader in the Trąbczyn affair, who had forbidden the collection of interest and induced the colonists to bring complaints, has been suspended.
oe1bu9454-072c: Councillor of the District Thiel sends Triebenfeld a letter from the sub-prefect v Brzechffa, just received through the lawyer v Wieckowski. From it, he says, it appears that because of his business Brzechffa does not intend to leave Warszawa until the 15th of this month, and that as regards the lordship of Trąbczyn there is a good prospect.
oe1bu9454-072d: Brzechffa informs Triebenfeld that because of various pieces of business he cannot leave Warsaw until the 15th of the month. He says that, according to reliable information he has gathered, the matter concerning Trąbczyn stands quite well. He will report the details in person. Because the post is about to leave, he writes only briefly.
oe1bu9454-072e: Brzechffa reports that because of various pieces of business he cannot leave Warszawa before the 15th of the month. According to reliable information he has gathered, he says the matter concerning Trąbczyn stands well. He intends to report in more detail after his return. Because of the departing opportunity to send the letter, he writes only briefly.
oe1bu9454-072f: Triebenfeld reports that an excessive delivery of grain and straw has been imposed on the Zagórów estates and that they have again been placed under sequestration; he says the Upper Prefecture in Kalisz refused to collect the interest from the peasants. He says Brzechffa was willing, at his request, to settle the deliveries, and that the sequestrator was recalled. Triebenfeld is laid up with gout and complains of the billeting of troops, of subjects who have fled and of lack of money. He says Honrichs is to be arrested for embezzling dues.
oe1bu9454-073: 'The Prince sets conditions for Brzechffa''s offer to lease the Zagórów estates: lease payments every half year in advance, a cash security, protection against claims for remission, all burdens to be borne by the tenant, and a sum to be paid for withdrawal in case of a sale. Triebenfeld is to come soon with Brzechffa, who is to bring several thousand Rthl with him. The estate dealings with Schimmelpfennig have stalled. He thinks the plan to sell to Weigelt and Stössel has little prospect. He wishes success in the Oleschnica and Trąbczyn matter and hopes for a considerable sum.'
oe1bu9454-074a: Application by the General Invalids' Fund to the Superior Court of Appeal for an attachment, concerning a loan of 50,000 Rthl to v. Triebenfeld secured by the Prince's bond for 250,000 Rthl on the Zagórów estates. Since 1807 interest of 9,375 Rthl has been in arrears. The advocate Mitschke in Kalisz is to sue and, if necessary, apply for sequestration. Since the Kalisz prefecture counted the mortgage among the Bayonne sums and Konotop and Świniary are encumbered with debt, the legacy of 80,000 Rthl from the Princess von Sacken is to be attached in the hands of Kircheisen, said to be the executor of the will.
oe1bu9454-074b: Triebenfeld thinks it necessary to appoint a head forester at Zagórów. He says the judge now has to manage the propination rights, because Nageln has called away her nephew, who had been intended as the propination official. If the Prince wishes to help poor Radszewski, he should send him quickly; Radszewski would have to be content with 300 Rthl a year. Triebenfeld also asks for the Prince's opinion on the exchange of the estates.
oe1bu9454-074c: The Court of Appeal calls on Kircheisen, as executor of the will of the late Princess of Sacken, to pay Triebenfeld nothing from a legacy. This applies if the suit of the General Invalids' Fund is correct, according to which Prince Hohenlohe-Ingelfingen is to receive 80,000 Rthl from the estate and has assigned this sum to Triebenfeld in settlement of his claims. A letter in the same terms goes to Cosmar. The High Court of Silesia sends Triebenfeld at Konotop the Court of Appeal's summons and requires a receipt for it.
oe1bu9454-074d: 'Summons from the Supreme Court in Berlin: on the application of the General Invalids'' Fund against Triebenfeld, an attachment has been imposed on the legacy of 80,000 Rthl which the late Princess von Sacken bequeathed to the Prince of Hohenlohe. Triebenfeld is to appear on 23 August at 10 o''clock before Councillor of the Supreme Court Roitsch, in person or through a justice commissioner, to present his objections and his loss, state the amount of the security and attempt a settlement. If he fails to appear, the attachment stands.'
oe1bu9454-075: Triebenfeld returns the letters of Count v. S. that were sent to him. He is glad the Count is behaving honestly, but regrets that he cannot win the Prince 40 to 50/m Rthl. According to Reinhardt, nothing has come of the matter of the assistance of the Treasury. Goldbeck hears that Hoym is keeping the South Prussian Department; Priebich, on the other hand, assured Councillor Kruger that Haugwitz would become minister. Chelmski has not appealed, and the estates might perhaps be leased out at Midsummer. The form for the power of attorney will follow after Melzer's return.
oe1bu9454-076: Von Triebenfeld reports that the exchange of estates is now under way and may perhaps soon be concluded. He intends to travel to Berlin at the beginning of September and to stay until the end of the month. There he hopes to see the Prince again and to report to him in person on several pieces of business.
oe1bu9454-077: 'Triebenfeld reports that the matter is going as wished: the King has written by way of Beyme, and Minister v Voss is to report with all speed. He says Glenck is to work out the estimates thoroughly, to match the schedule and the contracts. Triebenfeld has won over a man in Potsdam and is arranging a loan. He says Michaelis will write asking for a power of attorney. Triebenfeld asks for signed blank forms. Postscript: Buerensprung has become Land Forestmaster, Wedel stays in office, and Lindenau has been given the title of Excellency.'
oe1bu9454-078: 'Michaelis reports on his visit to the Privy Finance Councillor Schulze, who knew only the Prince''s letter to Minister v. Voss and expressed himself neither for nor against it. Michaelis asked him not to decide, should obstacles arise, without a hearing. On Schulze''s advice he requests a power of attorney to be deposited in the registry, and proposes its wording: to pursue, with the South Prussian Department, the proposed exchange of the estates granted in fief for a lordship. Triebenfeld says the cabinet''s orders are only now going to Voss.'
oe1bu9454-079: 'Triebenfeld is waiting for Minister von Voss''s report on the exchange of estates and will stay in Berlin until the Krotoszyn matter is settled. He says Schulenburg and Hoym are well disposed towards the business and that Hoym is willing to give 1,000 Rthl if it comes about soon. He sets out how the sum is to be divided: Schulze''s daughter 2,500 Rthl, Klewitz 3,000 Rthl, Michaelis 300 ducats. He intends to borrow 120/m Rthl from the Widows'' Fund, reports on the dispute at court over a war, and asks for the blank forms.'
oe1bu9454-080: Triebenfeld adds to his letter of the previous day, which Captain Hahn took with him. He says Minister Hoym has returned from Potsdam satisfied, where, according to another man, the Prince was spoken of several times. This, he says, confirms that the King holds the Prince in esteem, and he hopes for a good outcome. In Berlin there is talk of marches or war, but he says he does not yet believe it. Nothing has come back yet from Mr von Voss.
oe1bu9454-081: Despite pressure from von Triebenfeld and Eysenhardt, Michaelis can report nothing definite yet about the exchange of estates. Nothing has come in at the South Prussian expedition, so he says the matter is still in the correspondence between Minister v. Voss and the Privy Finance Councillor Schulze, and that nothing has been decided. He expects the Prince's power of attorney next Tuesday. With it he intends to prove his authority and obtain reliable information from Schulze.
oe1bu9454-082: Eysenhardt reports that the royal cabinet letter in the Prince's case was forwarded to Minister v. Voss at Havelberg and has not yet arrived at the chancellery. He says Voss will return early, already next Thursday, and may bring it himself. If it is worded as decisively as v. Triebenfeld says, Eysenhardt expects a favourable outcome. He has also paid v. Triebenfeld 300 Pr Courant on the Prince's account against a receipt.
oe1bu9454-083: 'v. Triebenfeld reports that Krotoszyn will certainly be made over to the Prince. In the case of Polajewo there are still doubts, but he says Privy Finance Councillor Schulze assures him that this too can be obtained; there, he says, 100/m Rthl are to be gained, despite the resistance of the chambers. He asks that Prince George be held back, should he arrive earlier, until he himself comes. He says Hoym has travelled to Pomerania and Voss will return on Thursday. Triebenfeld has written to Voss, Schulze, Beyme and the colonel. Added to this are rumours: he says Repnin has received a ukase and the French want to take Hanover.'
oe1bu9454-084: On the Krotoszyn exchange, von Triebenfeld reports that Your Royal Majesty has charged Voss with settling the matter, and that Voss asked for 4 weeks to produce the final report. The chambers are to examine whether the revenues are equal. Because of the doubts about Polajewo, estates to the value of the surplus yield are to be given from the district of Adelnau, which borders on Krotoszyn. He is travelling to Pszczew, intends to look into the Broniewski business, and will settle Prince George's affair in Wrocław. He says all but Voss are well disposed.
oe1bu9454-085: The King refuses the exchange, applied for by the Prince, of his South Prussian estates for the domain offices of Krotoszyn and Polajewo. According to the report of Minister v. Voss, Krotoszyn alone could yield 49,043 Rthl in revenue once the appurtenances not valued in the present lease are added; he says v. Triebenfeld received 26,000 Rthl in compensation for giving up the lease. The state would lose 17,400 Rthl a year. The Prince's estates, valued at 8,650 Rthl, now bring in 40,500 Rthl after improvements of about 26,000 Rthl.
oe1bu9454-086: Friedrich Ludwig, Prince of Hohenlohe, contradicts the report of the Minister of State von Voss on the exchange of his South Prussian estates for Krotoszyn. He says Voss apparently did not report the renunciation of Polajewo and relied only on the councillor of war Nöldichen. Instead of the claimed 49,043 Rthl in yield and 17,400 Rthl in loss, he says Krotoszyn pays 30,100 Rthl in rent, while his own estates yield 41,500 Rthl. He asks for an impartial commissioner to examine both estates. He says the aim had been to obtain capital to pay off his debts.
oe1bu9454-087: The Prince of Hohenlohe-Ingelfingen asks Colonel von Köckritz to support his justification before the King in the failed exchange of the estates granted to him for the Krotoszyn estates. Minister v. Voss and the King declared the exchange disadvantageous, since Krotoszyn yields 17,400 Rthl more. The Prince objects that Krotoszyn yields 30,100 Rthl and his own estates 41,500 Rthl. He says Voss reported on the advice of the councillor of war Nöldichen without an investigation on the spot. He has asked the King for an impartial investigation and for the files to be submitted by Struensee.
oe1bu9454-088: The Prince replies to Voss's letter of the 1st of this month. Voss has not agreed in the desired way to the exchange, applied for from the King, of the Prince's South Prussian estates for the district of Krotoszyn, without Polajewo. In the Prince's view, Voss's reasons rest only on the reports of the commissioners, who he says assumed more in the case of Krotoszyn than an impartial investigation would show. He is almost resolved to convince the King of the disinterestedness of his proposal.
oe1bu9454-089: Triebenfeld is pursuing the exchange of the Prince's estates for Krotoszyn and Polajewo. Letters to the King, to Beyme and to Zastrow have been delivered. Under Triebenfeld's plan the King is to appoint a commissioner or else decide on the basis of equal yield and value. Glenck, as general tenant, pays 44,500 Rthl a year. Triebenfeld disputes that Krotoszyn brings in 49,000 Rthl (rent 30,000 Rthl), and insists on his own disinterestedness. He says Princess Sacken will give at most 30/m Rthl, so about 7,000 Rthl are still lacking.
oe1bu9454-090: 'Triebenfeld reports that the struggle over "the matter" is now great, and hopes for success. He complains about conditions in Berlin and about the villains there: he says the monarch is good, but not the ministers. The 7,000 Rthl which Princess Sacken is in no way willing to advance he says he would raise in his own name, pledging all his possessions for it, so that the matter is not lost. Several passages are unclear.'
oe1bu9454-091: Beyme thanks the Prince for the information he has given in the matter of the exchange of estates. He says he is glad that the King has ordered a further investigation, and he gives his assurance that he will continue to carry out his duties conscientiously. In doing so he intends to reconcile the Prince's wishes, his own master's readiness to accommodate him, and the interest of the state.
oe1bu9454-092: Michaelis reports that Building Councillor Glenck has handed him the receipts of Gleissenbergen and of Schneider. With these he can reply to the General Auditoriat concerning its orders, which had been communicated to the Prince. He expects that Councillor of War von Triebenfeld will report to the Prince today on the state of a further matter, whose name is uncertainly read.
oe1bu9454-093: Triebenfeld sends the royal reply to the last petition. Minister v Struensee had to lay the files before the King. Colonel v. Köckritz, who presented a memorandum by Triebenfeld to the King, promises a good outcome. In it Triebenfeld offers, should Polajewo stand in the way, to lease the estates for 30 years, to build 6 peasant farms each year, to clear waste ground and to pay 20,000 Rthl in rent. Because of the 7,000 Rthl he wants to bring the Niedernhall matter to an end.
oe1bu9454-094: 'Zastrow gives notice of a letter from the King going out with today''s post: the King wishes to have the true value of the Prince''s South Prussian estates and of Krotoszyn and Polajewo investigated, in order to weigh them against one another. If no important obstacles stand in the way of the intended exchange, he says the King will gladly grant the wish. Zastrow thanks him for the letter of the 7th of the month. He says the matter does not belong to his department, but that he hopes for a satisfactory conclusion.'
oe1bu9454-095: Colonel v. Köckritz has v. Triebenfeld give the assurance that the exchange transaction stands very well and is as good as concluded; he will not write until it is settled. He says the Privy Cabinet Councillor is acting against his own wishes at the sovereign's desire. A firm refusal, he says, has been planned with B. The King is unwell, so there is no audience; v. Triebenfeld fears fresh intrigues by H. v. Voss. He takes the secularisation business to be bait from the French.
oe1bu9454-096: Triebenfeld reports, on the instructions of Colonel v Köckritz, that the exchange is as good as approved; only the King's indisposition is delaying its conclusion. For the journey to Öhringen he advises asking the King for leave at once, sending the letter to him by express courier, and travelling by way of Berlin rather than through Bohemia. He says Wedel in Wrocław gave a false opinion in the Krotoszyn matter, and that another gentleman credited Krotoszyn with a capacity of 50/m Rthl. Beyme let him read the files.
oe1bu9454-097: 'The King wishes the Prince to travel by way of Berlin and to stay a few days. Triebenfeld hears that the exchange is to be concluded before his arrival: according to Colonel v. Zastrow, the King declared that both estates were to be examined in such a way that neither the state nor the Prince would lose; only a public cabinet order was lacking. Minister v. Voss worked against it, while Beyme and Köckritz stood firm. On the secularisation business he advises saying nothing for the time being. He will stay in Berlin until the Krotoszyn matter is settled.'
oe1bu9454-098: Triebenfeld says he will stay in Berlin until the matter is settled, and is sending Glenck ahead to the Prince. The King invites the Prince to Berlin; if he leaves on the 14th or 15th, he can stay 3 to 4 days. In confidence he reports the secret marriage of Prince Solms to the widowed Princess Louise, and Hoym's secret opinion, which Voss cites, and advises not mentioning the secularisation business but pursuing it with Prince George in Vienna.
oe1bu9454-099: Triebenfeld reports that he was assured in Berlin that the Prince would receive the Krotoszyn estates. He says Voss has become more yielding. According to Köckritz, Knobloch and Prittwitz are to bring the matter to an end, with Wildeganst assisting Prittwitz. Voss received a draft by Councillor v Cöln at Krotoszyn and applied to the King to have it quashed. In Berlin war is expected. A patent as Councillor of Commissions is requested for Carl Theodor Fischbach in Pszczew. Broniewski will probably receive nothing.
oe1bu9454-100: Copy. Beyme informs the Prince that, after his letter of the 21st of this month was presented, His Majesty has ordered that the reply to it be held back until the report arrives that the Minister of State v. Voss is to supply. According to Beyme, the Prince himself seemed to expect this.
oe1bu9454-101: 'Copy of a petition from the Prince of Hohenlohe to the King for the exchange of his South Prussian estates for Krotoszyn and Polajewo. It rebuts the rejection by Minister von Voss: he says 30,100 Rthl is the net yield, the supposed demesne farm is a Hollander Hufe acquired by Triebenfeld, and the woods are laid waste. New offer: he gives up Polajewo, pays 8,000 Rthl a year on Krotoszyn, and settles the difference in value in cash to the Maritime Trading Company. He asks for an investigation by the Poznań Chamber and a report from Hoym.'
oe1bu9454-102: Triebenfeld reports that Minister v. Voss is expected at Krotoszyn in about 3 weeks. Chełmski has lost in the second instance as well. With Broniewski he says he will not settle for several thousand Rthl until after the Krotoszyn exchange. There was an intention to confiscate Brzyce at Poznań; he obtained a term of 6 weeks and advises asking the Grand Chancellor for an extension of 5 months. Hoym had the papers on the confiscation decree against the Prusimska quietly set aside so that the girl might receive something.
oe1bu9454-103: Triebenfeld says he is delaying a settlement in the Broniewski matter, because Rapacki's evidence tells against the patron, unless the Krotoszyn exchange requires it. He says he won the Chełmski lawsuit in the second instance. Against the charge that the Prince received too many estates he is drawing up a description. He says the Prusimski estates are to be regarded as purchased, since they must first be won in court. As yield he gives Kamionna and Kolno 6,000, Trąbczyn 8,400, Szetlewek 1600 and Brzyce 4,000 Rthl. Glenck is to lay the account before Prittwitz.
oe1bu9454-104: v. Triebenfeld guarantees that the Prince's affair will be brought to an honourable and advantageous end within a couple of months. He says the intention is to prevent a valuation of the princely estates and to make everything appear as a matter of grace. The exchange, he says, will be decided by the balance between the estates. He says he has persuaded Count Schlabrendorff to accept a bill of exchange for one year for the interest. Around 16 April he will travel to Berlin until the end of May. The estates sold to Prince George, he says, are now valued at over 700/m Rthl.
oe1bu9454-105: 'Triebenfeld has satisfied Count Schlabrendorff; the interest amounted to 11,085 Rthl, the receipt is made out in the Prince''s name, and there is no cover for Triebenfeld himself. He says he was refused admission to the Princess three times; he mentions a letter from Prittwitz. Glenck reports unfavourable news in the Prusimski lawsuit; Triebenfeld says he would use the blank forms entrusted to him to ask the Grand Chancellor for an extension of the deadline. He adds court news: the Queen is recovering, and war is out of the question.'
oe1bu9454-106: Triebenfeld thinks the purchase of estates proposed by the Jew Dann is a swindle. He says Dann wants to win over Mr. von Echart, the buyer of the Lichtenau houses, for it, and that Dann has also put such plans to Prince George. He reports that under a decree by default of the Poznań Government the estates in Brzyce are to be taken from the Prince again. The chambers are intriguing over the forests, lawsuits are causing high costs, and the exchange matter is at a standstill. He believes the ministers would permit the exchange only on the monarch's order.
oe1bu9454-107: Triebenfeld forwards a letter from Colonel von Zastrow and intends to keep the royal cabinet letter until the Prince's expected arrival. Princess Sacken did not receive him. He had the Prince's letter delivered to her. He says she declared that she would never return to the Prince, that she wished to live freely and would be content with an allowance of 2/m Rthl. He says she left out of dislike and out of love for her children. Friends advise the Prince to stand firm.
oe1bu9454-108: Triebenfeld complains that Prince George does not reply, despite the letters delivered by President v. Schuckmann, and sends no remittances. He says Kuh has sued him for 5,800 Rthl and obtained a decree of execution, and that seizure is threatened for Friday. The minister wanted to calm Kuh but is said not to be coming until Thursday. He says the Prince has burdened the estates sold to him for 280,000 Rthl with debts of 270,000 Rthl. Due are 20,000 Rthl to Liepman Meyer and, on 7 August, 12,000 Rthl. Triebenfeld intends to call on the Prince and asks for a way out.
oe1bu9454-109: 'The writer reports to a friend that Wildegansch is in Berlin and claims the Prince has sent him; he says Wildegansch and his followers have invented a money transaction with Asch and Schlabrendorff in order to cheat the Prince out of the costs. He hears that nothing will be decided for 2 months. Postscript: Bukowiecki will pay only 2,400 Rthl in yearly rent for Pszczew. He hears that there are plans to sue the writer over a bill of exchange for 11/m given to Schlabrendorff and to obtain a decree of execution; the friend is to warn the Prince.'
oe1bu9454-110: Triebenfeld reports that he believes he has concluded the business concerning the deeds for all the church estates. Should his stay be prolonged, he intends to send them to Wrocław by the next post. At first two and a half times the amount was demanded; now he is paying only 240 Friedrich d'or and about 200 Rthl. He says he has borrowed the money from the Privy Senior Councillor of Accounts Mathias, who needs it back in 14 days. He asks the Prince to authorise payment soon.
oe1bu9454-111: Triebenfeld says he cannot raise the money to redeem the document, since Wildegansct is ruining all his credit in Berlin. He says he gave the friend who arranged the matter 300 Rthl as a deposit out of his travel money. He asks for an order for the 240 Friedrich d'or against 200 Rthl Courant, failing which he fears a nasty turn. He calls Köckritz and Zastrow true friends of the Prince. Because of the gossip he wants to keep himself in the background.
oe1bu9454-112: Postscript. Triebenfeld learns from Court Councillor Wunster that Wildeganst and the Jew Heymann have done nothing in the Prince's business. According to Wildeganst, he says judgment has already been given on the bill of exchange for 11/m Rthl that Triebenfeld signed for the Prince, and that he is to be arrested. The bailiff Rudolph has already enquired after him. He begs for swift measures. He says Prince George has sold his estates for 750,000 Rthl. He proposes that the Prince induce Count Schlabrendorff to take the bill of exchange back from the Jews.
oe1bu9454-113: 'Triebenfeld thanks the Prince for the assurance that everything has been settled with Asch and Gad over the 11,000 Rthl, but reports that in this matter an order for his arrest has been issued against him: if the Prince does not pay the promised 4,000 Rthl, he is to be arrested at once. He says Prince George declares himself on nothing and is dragging out his case. Wildeganst sends word that Asch and one other would wait until Midsummer, which he says is no rescue for him. He begs earnestly that the matter of the 4,000 Rthl be put in order.'
oe1bu9454-114: 'Largely illegible. What can be made out: the writer calls an unnamed person a cunning rogue who, he says, has caused His Serene Highness much trouble and now, since there is nothing more to extort, wants to close the whole matter. He hopes for an early conclusion, so that Triebenfeld will not be wronged any longer. In his own affair, he says, someone wants something that should not succeed. Collection is to be on Tuesday, at the latest on Wednesday. His health, he says, is improving.'
oe1bu9454-115: 'Triebenfeld apologises for missing lunch: his tenant in Świniary urgently asks him to bring to order the peasants who are refusing their services. He says the minister seems to take it somewhat amiss, on account of Schlabrendorff, that the Prince tells him nothing. He says he has summoned Schlabrendorff here for the 15th and advised him to withdraw all complaints, since otherwise he cannot save him; Asch too is to press him to do so. Triebenfeld is going to Lądek but means to be back on the 15th and to bring in Hirsch.'
oe1bu9454-116: Triebenfeld says illness prevents him from coming in person to obtain orders about the sale of the estates. He regards the talk that debts of 150,000 Rthl rest on Trąbczyn, which Walichnowski is to take over, and that he is nevertheless to pay 56,000 Rthl and a canon of 5,000 Rthl a year, as a misunderstanding, and he fears for the Prince's honour. He proposes demanding firmly from Walichnowski 60,000 or 80,000 Rthl as hereditary purchase money and 4 to 5,000 Rthl in annual hereditary rent. He asks for secrecy and for secret instructions. He says Walichnowski seriously wants to acquire the Trąbczyn estates.
oe1bu9454-117: 'Triebenfeld is working to pay off v. Grotowski''s claim: he says Weigel has promised him 30/m Rthl with interest against Triebenfeld''s guarantee. But the Bank will only discount after a judicial cession, the instrument for which Court Councillor Ebersbach has drafted. The Prince is to send Weigel''s letter to Grotowski by express messenger. Grotowski''s agent in Kalisz is to inform the government that no forced sale is pending. Also: the deaths of Captain v Müllern and of Morgenbeßer, Nelson''s victory, rejoicing in Vienna, Bernhardi''s letter to Stössel.'
oe1bu9454-118a: Kunkel and 2 colonists from Oleśnica offer 1,500 Rthl and want a contract. Triebenfeld thinks them adventurers who could hardly pay the 17,000 Rthl at Martinmas and Midsummer, and he expects endless lawsuits. Only on the Prince's order will he have a contract drawn up. Senior Steward Nerlich wants to take Trąbczyn or Zagórów on hereditary lease through Kunkel and has 80,000 Rthl in cash. Walichnowski asks what he is to pay. Urbanowski has requested the Trąbczyn valuation. Triebenfeld asks for instructions.
oe1bu9454-118b: Countess Schlabrendorff is willing to wait for the 50,000 Rthl until 1 January 1805; Homuth could not obtain a longer term. She complains of her loss, since she receives no interest. If no interest has to be paid until then, 2,500 Rthl are gained. Homuth asks for the settlement so that he can send it to the Countess for execution, and he intends to try to get the old bills of exchange back. The surveyor Cabanis has departed; the Wrocław hired coachmen demanded 20 Rthl.
oe1bu9454-118c: Countess Schlabrendorff is willing to wait for the 50,000 Rthl until 1 January 1805. Homuth could not obtain a longer term, and she complains of her loss. If the Prince need pay no interest until then, Triebenfeld advises accepting the date, since 2,500 Rthl would be gained. Homuth asks for the settlement so that he can draw up the deed, and intends to try to get the old bills of exchange back. The surveyor Cabanis has departed and means to hire a peasant's cart outside, which he thinks he can get for 4 or 5 Rthl.
oe1bu9454-119: Triebenfeld proposes sending the surveyor Cabanis to Husiten and having some 500 farmers recruited. According to Glenck's table from Zagórów, around 31,000 Morgen of manorial land would be available for division. Cabanis had already divided a small estate near Strehlen among Husiten, who paid 25/m Rthl in cash for 23 Hufen. Uminski, according to Prince Biron, finds the price for the Kamionna estates too high, but wants to view them. Triebenfeld considers this mockery, since Broniewski is still sitting there. Rapacki's prospective buyers demand payment terms that are too long.
oe1bu9454-120: Cabanis reports prospective buyers among the Hussites in Husinich and Rentsch. He says they consider 300 Rthl per Hufe and 15 Rthl in yearly interest fair, that they have sent a messenger to their Moravian fellow believers, and that they mean to appear together within a fortnight. Cabanis is to press them further through the clergyman in Hussinitz. Countess Schlabrendorff will release the instrument only once the remaining 50/m Rthl have been received. Homuth obtains an extension until 1 January 1805.
oe1bu9454-122: The writer forwards a note that had been left behind by mistake at his former lodgings. He says Mr Homuth urgently asks that this item be settled soon, so that he can report through the messenger the receipt of the 166 Rthl 16 Groschen. Cabanis is leaving by post coach for Hussinitz; the writer says he expects a quick and happy outcome from this. He has had no news today from Berlin or Frankfurth.
oe1bu9454-123: Triebenfeld submits a letter from Kunkel that arrived by express courier and asks for instructions on how to proceed. He considers an arrangement with Otocki necessary; an amicable settlement, in which Otocki would be satisfied with 1500 or 2,000 Rthl, would be advantageous, he says. Whether Kunkel should be given a power of attorney to settle he leaves to the Prince. He fears that Kunkel and Jentsch are working against each other and advises instructing both. Glenck did not come again, but left behind the accounts from Konotop, which explain everything.
oe1bu9454-124: von Triebenfeld sends the Prince his draft of the reply to Kunkel so that the Prince may check whether it matches his wishes. He asks that both letters be copied out fair by someone else, since his wife is being buried today and he has withdrawn with the children to his brother-in-law's. In his own letter to Kunkel he intends to set everything out thoroughly. He says he has a map of Kopojno, Skokum and Świątniki with him.
oe1bu9454-125: He reports that the men from Oleśnica have arrived with the money and wish to appear before the Prince at 4 o'clock. Von Triebenfeld has already negotiated with them. He says he will report on the matter to the Prince in the afternoon, and believes it will not be unwelcome to him.
oe1bu9454-126: Triebenfeld reports that Cabanis has returned with the Hussites, who he says liked it extremely well. They want to hurry back, gather their fellow believers and settle everything within 14 days. He says Cabanis brings a great deal of news that Triebenfeld must discuss with the Prince; urgently, someone should go there at once. Triebenfeld is working with the people from Oleśnica and asks the Prince to come to him for a quarter of an hour after the parade, to hear them himself and give orders.
oe1bu9454-127: 'Triebenfeld asks the Prince for help with 900 Rthl, since to avoid enforcement he must pay 910 Rthl: 700 Rthl for the inventory promised by the Prince under his guarantee, 175 Rthl of interest from 1799, and 35 Rthl of legal costs. He says the Prince has settled no interest. His cash is exhausted, as yesterday he already paid 1,537 Rthl 12 Groschen in another of the Prince''s affairs. Wildegans and Heyman Pincus promise settlement. At Midsummer he intends to support the Prince with timber money.'
oe1bu9454-128: Triebenfeld reports on 11 lawsuits, for which he obtained a postponement and is seeking settlements. The tenants are demanding high sums to give up their leases. With Flörken and Ribbeck (12,600 Rthl paid in cash, 8,000 Rthl settled for buildings) he is seeking an agreement and has applied for execution and sequestration. He says v. Rudnicki is to depart at Midsummer. With the help of the district administrator the old subjects are paying 1 Rthl of ground rent per Hufe; today buyers were found for 87 Hufe. Glenck mocks the Oleśnica contract to the district administrator.
oe1bu9454-129: Triebenfeld says he has had no letters from either Berlin or Frankfurt, and asks the Prince to send him comforting news of Glenck. On the matter of Kolzig, Amelang is not replying; if he stays silent, he says the sale of Konotop must be pursued eagerly. He has summoned the tenant Bernhardi and instructed him to recommend the estates to any prospective buyer instead of obstructing the sale out of self-interest, and to receive Ludolff and Stubenrauch well. In the afternoon he intends to bring out the consignment to South Prussia.
oe1bu9454-130: Von Triebenfeld reports that nothing has happened yet and that no one trusts anyone else. He says he has agreed with M. Bernhard that Bernhard is to bring the matter at Pszczew to a conclusion, that the estates are to remain in the Prince's name, and that Leixner wants to take over Kamionna, either in the Prince's name or in Triebenfeld's. He says Leixner is under pressure and is content if Triebenfeld lends him his name. He says he has sent an express courier after Glenck; he is travelling to Berlin, expects to be back on Saturday and will then conclude matters at Pszczew.
oe1bu9454-131: 'Triebenfeld says he has found nothing in Berlin but fraud and lies: without his coming Your Serene Highness would have been taken in, and not a Heller is to be expected from there. He means to return to Frankfurt on the 20th, to conclude matters with Leixner over Kamionna and to secure the funds needed for Koszęcin. He says hopes are held out rather for the estates, since the King does not wish to give away any money. In the Broniewski matter the arrest is to be accepted as soon as the causae arresti have been shown.'
oe1bu9454-132: The writer is travelling back to Wrocław having achieved nothing, since he waited in vain for Glenck. He complains that in the case of Pszczew others made 30,000 Rthl at the Prince's expense. His friend is to persuade Director Stubenrauch to buy Kamionna, so that he hands over the money by Midsummer. The writer says he will stand surety for an annual revenue of 10,000 Rthl. The Prince would be satisfied with 180,000 Rthl. Without an entry payment the subjects paid 50 Rthl per Hufe yearly. He urges caution with the Cabinet Councillor.
oe1bu9454-133: 'v. Triebenfeld reports on the failure of the various transactions: Glenck can prove nothing; Leixner, put off by fraud at Pszczew, is to keep up the payments, and demands for Kamionna eviction and incolat as well as the cancellation of the partnership contract with Glenck. The loan of 100/m Rthl from the Invalids'' Fund is uncertain. Triebenfeld intends to conclude matters in Berlin with Amelang at Stubenrauch''s. He says Beyme has presented the Prince''s request for compensation and advised that debts of over 200,000 Rthl be remitted to him. He says that in the event of war the Prince will receive the command.'
oe1bu9454-134: The loan from the Invalids' Fund promised by von Glenck has fallen through, because the Otto valuation was reduced to 78/m Rthl; Stubenrauch and the Wards' Board also refuse. Beyme had Amelang told that the King wishes to remit the Prince's debts as compensation for the Brzyce estates. Amelang proposed Schlabrendorff's confiscated Kolzig estates. Triebenfeld intends to try whether 120/m Rthl can be borrowed on Konotop and Zagórów; if this succeeded, the Zagórów and Trąbczyn estates could be broken up at leisure.
oe1bu9454-135: Copies concerning the sale of Kamionna and Kolno. Cabinet Councillor Werner asks the Chamber Director for 2 pc commission under a written undertaking of the Prince of Hohenlohe of 17 December 1803, since he says he proposed a buyer. He fears objections from Glenck. Glenck enquires whether the addressee would lend 60,000 Rthl as a second mortgage behind 100/m Rthl on a value of 200/m Rthl. Stubenrauch returns the papers and declines, saying the estates have fallen into bad repute through brokers.
oe1bu9454-136: Triebenfeld, without a power of attorney, waits in vain for Glenck; he says the buyers of Kolno and Kamionna are to pay 76/m Rthl here. He has largely finished with Radzinski at Szetlewek, and two interested parties are offering 1 Rthl ground rent per Morgen for Szetlewek. A decree of payment has been issued against the tenants around Floricke. He wants to lease Trąbczyn to Otocki for a year and to settle the Mennonites on about 400 Hufen. Voss, he says, intends to forbid dismemberments from 1 July. According to Blomberg, Glenck is keeping settlers away at Wrąbczyn.
oe1bu9454-137: Triebenfeld complains about Leixner and Meyer Bernhard, who keep putting him off. He says they now promise to send 76/m Rthl and about 20/m Rthl in bank bonds to Bernhardi, but are holding back 30/m Rthl because the Prince has bought Pszczew back. For Trąbczyn he raised a few thousand Rthl on a bill of exchange. Through the Grand Chancellor and Köckritz he obtained an order for the deposit of the Broniewski money. Köckritz holds out the prospect of estates on hereditary lease. Princess Sacken, through Cosmar, has called in the capital of 30/m Rthl on Koszęcin.
oe1bu9454-138: Amelang reports in the Broniewski matter that the deposit has now been ordered. According to information from v. Triebenfeld, he says the Prince wishes to deposit a security as well in order to obtain possession of the estates. Amelang has offered this security of 10,000 Rthl. The Government at Poznań was thereupon instructed to make the deposit and to issue an order concerning Kolno and Kamionna. For the first attempt at a deposit he refers to a resolution of 25 Juny. He expects that the order will be agreeable to the Prince.
oe1bu9454-139: Triebenfeld reports that the settlement with Broniewski can no longer be undone. Glenck submitted it for approval on the 6th, and the Prince's protest arrived on the 8th but was set aside. No one will take the blame, each shifting it onto the other, though Melzer admits that a deposit would have defeated Broniewski. He says that against Bornstädt, as against the Trąbczyn tenants, they sued for eviction without fixing a liquidated sum. Triebenfeld intends to go to Pszczew. Melzer expects a liquidation suit lasting 6 to 8 years.
oe1bu9454-140: 'Triebenfeld asks for help by express courier: the village communities at Pszczew, stirred up by Rochlitz, want to withdraw from the purchase. What is demanded is the cancellation of the contract between Leixner and v. Brandenstein, Glenck''s surrender of the partnership contract, and an arrangement with Bornstädt. The Prince is to demand the papers from Glenck and send Brandenstein''s written undertaking. Triebenfeld asks what he should reply to Bornstädt about the promised 1,000 Friedrich d''or. He says Glenck has advised Meyer Bernhard against paying the 66/m Rthl on the 29th in Poznań.'
oe1bu9454-141: 'Triebenfeld, bedridden with bilious fever in Poznań, reports on the Broniewski affair. He says the settlement that was concluded offers no security and should be altered; Broniewski''s wife would be needed for that. He considers Wunster a rogue who is in league with Broniewski and Guderian. He says Meyer Bernhard and Simon want to pay only 6,000 Rthl instead of 13,000 Rthl. The plan: Broniewski provides security and Glenck presses for the 66,000 Rthl to be deposited; Broniewski receives 53,000 Rthl and the Prince 13,000 Rthl. He intends to fetch 30,000 Rthl from Pszczew.'
oe1bu9454-142: Triebenfeld is ill and confined to bed. Bornstädt wants to leave, but the dispute with him should be settled first. Triebenfeld asks the Prince to instruct Glenck to send the contracts, settlements and accounts concluded with Bornstädt. The Prince should also declare in writing that he is willing to give Bornstädt 5,000 Rthl as a special favour. According to an expert opinion, Bornstädt would be entitled to 7,500 Rthl in the purchase transaction of Pszczew, without the promised fee.
oe1bu9454-143: Amelang confirms that he has been informed by the Prince of the outcome of the compensation matter concerning him. The Prince declares himself satisfied with the conclusion of this business. The passage that follows, on the King's continuing favour towards the Prince, is partly illegible.
oe1bu9454-144: Amelang confirms that he has received the princely order of the 31st of last month. He says he intends to call on Count von Schulenburg tomorrow morning, to hand him the letter addressed to him and to await his further explanation. He says he will report on the outcome of this conversation by the next post.
oe1bu9454-145: 'Honrichs is not paying the 4,000 Rthl, although everything has been cancelled and settled with the consent of the Wards'' Board. Court Councillor Grimm, who is seriously ill, wants to sue him, but the contract and the power of attorney are missing; the contract is with Rochlitz. Triebenfeld asks that it be called in from there urgently and sent to Grimm with a power of attorney. At Trąbczyn, he hears, orders are being given that contradict his plan: 100 Scheffel of grain have been lent out and many fields sown. After a carriage broke he means to hurry there once it is repaired.'
oe1bu9454-146: Triebenfeld reports that the Mennonites want to buy the Zagórów and Trąbczyn estates as a whole; he intends to travel to Lunau tomorrow. He says the valuation is held up by Glenck's contract of 5 September covering 300 Morgen of manorial land and by his sale of the Komornitzen in Wrąbczyn to v Malachowski; the parish is protesting. He asks for Glenck's bonds as well as the contracts of the miller's wife from Wrąbczyn and of the Swięcie Hollander. He says he has lodged an objection against an execution for 6,500 Rthl on account of Przespolewski.
oe1bu9454-147: The writer (signing v. Triebenfeld) reports, after a journey through West and East Prussia, that the Mennonites want to conclude on 19 December in Wrocław, but are demanding the propination rights. He has summoned men from Landsberg and the Oderbruch in order to compare their offers. He rejects a sale in separate pieces. The valuation by Schenck is proceeding slowly. In a postscript he complains of Glenck's reproaches and of his orders issued against his own. The mayor for judicial affairs asks for instructions on the Wrąbczyn lands. The bailiff's estate is likely to be valued at about 11,000 Rthl.
oe1bu9454-148: Von Triebenfeld calculates that the Swięcia estate has been sold off far too cheaply. Glenck's table showed 1,800 Rthl in yearly interest and 10,000 Rthl of capital, whereas the valuers' revision, completed today, yields only 918 Rthl in interest. He says the estate, with 3,792 Morgen, was given away for 28,360 Rthl, which means a loss of 47,340 Rthl. Together with the Oleśnica loss of 48,000 Rthl, the Prince loses a net 95,340 Rthl on both estates. He says a shortfall of the same size is now arising in the valuation.
oe1bu9454-149: Triebenfeld says he is expecting the people from the Oder and Netze marshes and has sold waste land on the border on favourable terms; no Hufe, he says, is to be given up for less than 600 Rthl. He hopes the valuation of the Zagórów estates will come to more than 400,000 Rthl, and intends to raise money in Berlin for Schlabrendorff and Lichnowski. The Wrąbczyn subjects, he reports, are refusing the rent, complaining of Glenck's threats and of forced services for citizens of Zagórów, and offering one Rthl per Morgen; he referred them to justice-burgomaster Schenck.
oe1bu9454-150: 'Extract from the files: in a letter of 23 November 1804 the Senior Land Councillor von Lichnowski demands from the Prince arrears of interest of 5,572 Rthl 12 Groschen for one and a half years (4 May 1803 to 4 November). An order of the Kalisz Government set a payment deadline of 14 days, which has passed without payment. He threatens to apply for sequestration, but hopes for good relations. The reply is that the tenants have not paid; he will be satisfied, since Mr von Triebenfeld is putting everything in order.'
oe1bu9454-151: 'The Mennonites are at Trąbczyn and want to buy both estates together, but deep snow is preventing all work. The valuation must be reworked: Swięcia yields only 918 Rthl instead of 1800, Wrąbczyn only 1,123 Rthl instead of 1500. A hundred Hufen of woodland near Grądzyń and Drzewce are expected to bring 3,000 Rthl in interest, so 60,000 Rthl in capital. Lichnowski has had part of the 10,000 Rthl belonging to the Oleśnica people seized. According to Nerlich, the people of Wrąbczyn are refusing the Christmas instalment.'
oe1bu9454-152: Triebenfeld announces the free pass for the Hohenlohe wines and hopes to transfer the 25,000 Rthl soon. He says the debts registered by Glenck burden not only Swięcia and Oleśnica but all the villages of the Zagórów estates, which makes the matter more difficult. Nothardt has died and Goldbeck is president in Kalisz; should obstacles arise with the dismemberment, Triebenfeld hopes to remove them in Berlin. Bernhardi left him in the lurch over the money. He says Voss will certainly withdraw soon. Nothard leaves 28,000 Rthl of debts.
oe1bu9454-153: v. Triebenfeld is worried about raising the 25,000 Rthl, since the bank president von Stein has again forbidden any discounting. He says the capital of 140,000 Rthl is to be provided by the Invalids' Fund or the Potsdam orphanage, but only once all the formalities have been settled, and not in instalments. Together with Amelang he is trying to raise the 25,000 Rthl for the time being. He reports a shortage of money and looming bankruptcies in South Prussia. The letter breaks off.
oe1bu9454-154: Triebenfeld reports that the loan is going well and is with a man for examination. Against Wollenhaupt's talk of a sequestration he says that Lichnowski has lifted the attachment for 6 weeks, and that according to Grimm the attachment on account of Magnuski has likewise been lifted. He says Przespolewski has no claim to 30,000 Rthl, and that Dębinska has only laid an attachment against payments to Magnuski. He says Blomberg threatens, in a letter of 25 December, that without the fulfilment of his demands nothing will come of the dismemberment. Triebenfeld has sharply rebuked him.
oe1bu9454-155: Hahn reports on the Prince's instructions that Chancellor Hohmuth will not promise any longer delay over the Schlabrendorff payment. He says the Countess, annoyed by the delay, will only be kept from reviving the suit by quick payment before the next Berlin post day. If 25/m Rthl were paid soon, he says Hohmuth would try to persuade her to wait a while for the other half; he says Hohmuth refuses a bond for it. The wild boar has been sent off by way of Kalisz to Trąbczyn.
oe1bu9454-156: Triebenfeld reports that he cannot obtain the 25,000 Rthl without the large transaction. He says the money has twice been thwarted, probably by young Eysenhardt, who is demanding 18,000 Rthl. He declined, for the time being, an offer from Court Councillor Meyer, since 9,000 Rthl are entered against Szetlewek. Enclosed is a Copy in which Countess Schlabrendorff threatens to continue the suit in Berlin if the outstanding settlement money for her children is not paid by the next post day.
oe1bu9454-157: Triebenfeld reports that through the mediation of General v. Köckritz a loan from the Invalids' Fund has been promised to him. Once it is granted he intends to take 60,000 Rthl, repay the ten thousand he borrowed, and send the Prince 50/m Rthl so that Schlabrendorff can be paid. He says Pochammer will not bring a suit if she receives money in this quarter. He intends to pay Giraud and Haugt their interest and have their mortgage assigned to someone who will provide 18,000 Rthl for four years.
oe1bu9454-158: 'Through the mediation of General v. Köckritz, the Invalids'' Department has promised 150,000 Rthl: first 50,000 Rthl on mortgage and on Triebenfeld''s bill of exchange, the 100,000 Rthl after revision of the valuations by the Chamber, which he intends to direct from Wednesday in Kalisz. He then wants to pay 10,000 Rthl and send the remainder. He advises against the suit over the proxenetica and rejects the reproach in the Schlabrendorff affair. Of 30/m Rthl for the Empire, about half might be together.'
oe1bu9454-159: Amelang has, with great difficulty, obtained from the banker leve an order on the brothers Kuh for 36,755 Rthl 7 Groschen, in connection with the money of the Invalids' Fund, which actually consists of Maritime Trading Company bonds. Von Triebenfeld sends the order and asks that the letter to the gentlemen Kuh be delivered at once. Tomorrow the Hanusch and the Eysenhardt matters are to be settled. After that he intends to return to Kalisz to see to the 100,000 Rthl.
oe1bu9454-160: Triebenfeld reports that the Invalids' Fund is releasing the Maritime Trading Company bonds and that he can now satisfy Livi. He says further monies will follow once the valuations have been reviewed by the Chamber. Girard received 900 Rthl in interest, and the capital is to remain uncalled for some years. In the case of Seebald, 1,800 Rthl of brokerage fee was saved. The people of Oleśnica, who are protesting against the division of the woods, he intends to throw out. The subsequent purchasers have paid 10,000 Rthl and want to pay a further 10,000 Rthl. He plans to leave on the 5th by way of Konotop and Głogów.
oe1bu9454-161: Amelang reports that the princely letter of the 3rd arrived just as von Triebenfeld was about to depart. He says he was still able to show it to him, and that Triebenfeld was glad of the Prince's satisfaction. He says payment of the assignation has been made. Everything now depends on the revision and on its being speeded up. Three or four months ago the business would have been settled more quickly. Amelang assures the Prince of his zeal. Partly hard to read.
oe1bu9454-162: A new order from the General Finance Department forbids the chambers to carry out revisions of court valuations without its prior knowledge. Triebenfeld traces it back to Prince George and Councillor of War Korn. He hopes for the permission that President v Goldbeck has applied for and that Amelang is to pursue in Berlin. He intends to submit the dismemberment plans. The Prince is asked to buy and send three busts and a washbasin for Goldbeck. The Oleśnica matter has gone back to the patrimonial court through Hussarzewski.
oe1bu9454-163: He reports a hearing at Trąbczyn against the people of Oleśnica, who, despite earlier protests against the 10,000 Rthl, are now giving way. He says Otocki wants to take Szetlewek on hereditary lease for 10,000 Rthl in deposit money and 1,500 Rthl canon, together with the propination rights of both estates and 20 to 30 Hufen on the same terms as the colonists. Honrichs is not paying; if his contract were cancelled, Meierowitz would buy. Grimm offers 2,000 Rthl for Witów. Szczucki and Czizewski are to be sued. Old Lichnowski asks for 1,390 Rthl.
oe1bu9454-164: Triebenfeld is waiting for the Berlin resolution and puts the new revision of the valuation down to Prince George and Kalckreuth. He says Otocki promises 10,000 Rthl and 2,000 Rthl of propination rights rent in advance, and that Meierowitz would pay 20,000 Rthl and an annual canon of 500 Rthl once Honrichs leaves. A chamber edict forbade hereditary leases to non-nobles without royal consent; he says Glenck kept this quiet and let the contract with the people of Oleśnica be concluded. According to Dombrowski, the Prusimski compromise and receipts for Prusimski's payment are in the archive.
oe1bu9454-165: 'Hahn sends, on the Prince''s orders and as a supplement to the princely letter already dispatched, a copied extract from what came in by mounted post from Glenck. The Prince thinks it useful. The Prince is better: the attack has moved from his right hand into his left foot, and the pain stopped during the night. Bernhardi has arrived, but is not entirely well. The Prince had Hahn reassure him. Hahn wishes Triebenfeld a recovery.'
oe1bu9454-166: Minister Voss had the dismemberment at Trąbczyn stopped. Triebenfeld reports that the Chamber's commission has confirmed his evidence and withdrawn the prohibition, and that the net annual income was fixed at 31,000 Rthl. Once the concession is granted he hopes for credit of 3 to 400,000 Rthl, and he intends to use the outstanding 180,850 Rthl to pay off debts. The buyers, however, have pulled out. Because of his own losses of 19,500 Rthl he must go to Świniary and Konotop. Schenck is to collect the money in the meantime.
oe1bu9454-167: Hahn writes that, on the orders of the Prince, who is just then driving to church with the old gentleman, he is sending an enclosed letter together with the Prince's compliments to Triebenfeld. The Prince would gladly have written himself, he says, but the orderly leaves within the hour. He reports that the old Prince is very well for his age and shows much attachment to Hahn's master, and that the return to Wrocław has been fixed, without fail, for the 25th.
oe1bu9454-168: 'Triebenfeld says he has concluded contracts with the old peasants and secured the dues before the court. He is negotiating with v. Otocki over Szetlewek and the propination rights. Amelang promises help with the loan. Glenck, Wollenhaupt, the three men of Oleśnica and a Meyer are talking buyers out of purchasing. Claims of 3,011 Rthl are being made; against Wollenhaupt he raises counterclaims. The old subjects in Swięcia have been bought out, and for 28 Hufen a new contract was concluded: 400 Rthl per Hufe and 15 Rthl annual interest.'
oe1bu9454-169: Minister Voss has forbidden any revision of the valuations, and Triebenfeld is waiting for Amelang's answer about the revision by the district councillor. For the dismemberment a councillor is to inspect Zagórów and Trąbczyn. He says he has concluded the business with Meierowitz. Radzinski is offering 48,000 Rthl in all for Szetlewek (1,700 Morgen), with only the pasture in dispute. Triebenfeld hopes for 80,000 Rthl by July. Amelang is making a noise because Oppenheimer refuses priority for the Glenck mortgage on Oleśnica that was assigned to him.
oe1bu9454-170: Hahn reports that on the Prince's orders he rode to Triebenfeld's hereditary estate Świniary to speak with the steward Käufer and the forester Bezold. He says the forester asked who had blackened his name with the Prince and assured him that he was devoting all his energies to the interests of the estate. Hahn met the steward in Wrocław. He says the steward replied in the same terms, pointed to his excellent testimonials and his good name, and awaits an investigation of his conduct calmly.
oe1bu9454-171: Hahn reports that the Prince's foot is almost healed and that he is otherwise well. He says the foot is only slightly swollen and causes no pain. The Order of St Andrew gave pleasure, he says, and still more the courteous behaviour of the Emperor, by whom the Prince is said to be charmed. In Wrocław too the Emperor is said to have spoken flatteringly of the Prince. The Hohenlohe regiment marched through Erfurt, he reports, and the Prince rode out to meet it. The Duke of Weimar is expected.
oe1bu9454-172: 'Triebenfeld is pursuing the dismemberment at Trąbczyn. He has postponed the main hearing to Monday and intends then to conclude the contracts for all the parcels. He quotes a letter from President v. Goldbeck to Minister Voss: the Chamber, he says, has already given its consent, Councillor of War zur Höllen has made mistakes, and these are to be corrected as far as possible if Voss grants the consent. Kunkel, one of the men from Oleśnica, has been taken into custody. Over Szetlewek Triebenfeld expects a hard day.'
oe1bu9454-173: Triebenfeld asks the Prince to instruct Glenck to obtain the preliminary agreement between Rochlitz and Honrichs concerning Witów, together with Rochlitz's power of attorney. Nothing was found in the Trąbczyn archive, and otherwise, he says, 14,000 Rthl would be lost. With a councillor of the chamber he intends to inspect the site at Trąbczyn according to the dismemberment plans; in all he hopes for 350,000 Rthl. He means to settle Szetlewek this week. He asks for names for 8 new villages. He says the Prince should object to the enclosed contract with Schenck on account of 5 Hufen of land and the clerk of the court.
oe1bu9454-174: He calculates that a justiciary who also takes on the post of cashier would, through savings, bring in as much as Schenck receives; the fees, he says, would rise to at least 1,200 Rthl. He asks that Hahn be sent to Świniary to issue a warning to the steward Käufer and the forester Peltzold. At Trąbczyn, buyers are waiting for several Hufen of land to be paid for in cash. He mentions the 1,390 Rthl for Lichnowski and returns Amelang's letter. Wiesolowski reports Russian troops, together more than 300/m men.
oe1bu9454-175: Hahn sends, on orders, two enclosed documents, an original and a copy. The Prince asks von Triebenfeld for his opinion on what should be done in these matters. He says Girard in particular is pressing. The Prince says he would send the necessary sum at once to satisfy the gentlemen, were his means not so exhausted by the journey.
oe1bu9454-176: Hahn reports the death of the reigning Prince of Hohenlohe-Neuenstein on 27 July from a stroke. He says that under the will Hahn's Prince is sole heir, and that possession was taken at once in Öhringen and the other places. Measures by the Princes of Langenburg and Kirchberg, based on a partition treaty, were repelled and their troops turned back. The Prince intends to travel there in September after the Silesian reviews. He leaves the South Prussian affairs to Triebenfeld's judgement, since he will be away for a long time.
oe1bu9454-177: Because of the mobilisation little can be achieved in Berlin. Privy Councillor Reinbeck is pursuing the approval of the dismemberment at Zagórów and Trąbczyn; on this depends the money hoped for from the Invalids' Fund and the Wards' Board. Enclosed is a list of the new colonies (21,407 Morgen, 578 farmers; 4,575 Morgen remain to the manorial lordship (Dominium)). Radzinski is to pay in 6,000 Rthl. Scattered colonists promised several thousand Rthl. Still to be paid are Prusimska 20,000, Weigel 23,000 and Schlabrendorff 25,000 Rthl.
oe1bu9454-178: 'Hahn reports that among his papers he has found a few more chartes blanches signed by His Serene Highness which were intended for Triebenfeld. He excuses the oversight: he says that in the last nights before the departure the Chamber Director Count had arrived and everything concerning Hohenlohe had to be settled before the journey. He has sent the remaining chartes blanches to the young ladies von Triebenfeld. Postscript: he says His Serene Highness appointed him Councillor of Dispatch before the departure.'
oe1bu9454-179: Triebenfeld reports that the dismemberment and the Pszczew affair have been approved by the King and that the yield of the estates has been fixed at 40,260 Rthl. The debts amount to 698,000 Rthl. Together with General v. Köckritz he intends to ask the King for treasury notes to pay them off, the matter being pursued by Court Fiscal Pochammer, for whom he urgently requests a power of attorney. He says Glenck knows nothing of the Prusimska affair; he promised him 8,000 Rthl sub spe rati for the repurchase of his lands. For the 30,000 Rthl he still sees no way.
oe1bu9454-179a: 'Copies relating to a debt clearance plan for Zagórów and Trąbczyn: a chamber survey showing a net annual yield of 40,260 Rthl, including Honrichs for the demesne farm Trąbczyn 3,000 Rthl and Radzinski on Szetlewek 1,500 Rthl; the Prince''s liabilities of 698,784 Rthl, including Lichnowski on Trąbczyn 42,000 Rthl and a protest by Prusimska of 8,333 Rthl; and v. Triebenfeld''s draft petition to the King for 698,000 Rthl in treasury notes with an amortisation fund of 34,000 Rthl a year, pointing to 16 new villages and 500 families.'
oe1bu9454-180: Triebenfeld replies that the claim of the Jew Nathan Liepmann is already listed in the schedule of liabilities; all creditors are to be satisfied. He says he cannot count on the dismemberment money of about 60,000 Rthl coming in quickly and must go on borrowing. Once the Pszczewer matter is concluded, the people are to pay 2,000 Rthl and Raven 1,200 Rthl in transfer fees (Laudemium); should Raven refuse, the communities are to reclaim the estate. Pochammer is to speak with Beyme on the 11th about the loan; the valuations are going back to Kalisz.
oe1bu9454-182: Triebenfeld asks urgently for the forgotten power of attorney for Court Fiscal Pochammer, for blank forms and for blank powers of attorney attested by a court. Without them he says he has been unable to do anything for weeks. He has written to Beyme and Minister v. Voss in the Prince's name and recommended Pochammer. He intends to call on Faudel, Haugwitz and Count von Keller. He complains about the lazy Amelang and about Grattenauer, who wants titles and testimonials and who, from what Triebenfeld hears, wants to become a councillor of justice, and he proposes a refusal.
oe1bu9454-183: He reports on a libel entitled "Preußischer Charaktüre" which attacks the Prince sharply and also names Triebenfeld. It says, he reports, that the Prince needs a great deal of money and that Triebenfeld enriches himself from the Prince's property, a scheming man who has worked his way up from being a servant. He says he wanted to send the book along, but the French authority had it confiscated. Colonel Massenbach and a local professor are held to be the authors. Köckritz is attacked in it as well.
oe1bu9454-184: 'Hahn sends on the enclosed blank forms, which had been forgotten when the express courier left, and asks to be excused. He complains of sad experiences in service to a lord: he says the old Ingelfingen servants are forgotten in favour of the newer ones, who are made fortunate without having earned it. He says he means to extricate himself by his own efforts, and trusts that Triebenfeld will make no use of this outburst.'
oe1bu9454-185: Triebenfeld says he is waiting urgently for the requested powers of attorney and blank forms, without which he can do nothing. He fears the delay is rousing mistrust among those he is negotiating with. He asks again for a power of attorney for Court Fiscal Pochammer, 2 judicially attested blank powers of attorney and a few blank forms. Help is promised in Berlin against Württemberg's encroachments on the princely states, but he doubts the sincerity of this. He may perhaps come to Öhringen.
oe1bu9454-186: The writer reports that the business with Weigelt is as good as settled. He says Weigelt has sent his agreement, and that he has asked him to come to him at Świniary tomorrow. In order to entertain the old gentleman well, which serves the Prince's interest, he asks his friend for a bottle of good old sweet Hungarian Ausbruch, 6 peaches and 2 bunches of grapes. The wine and fruit should be sent out if need be.
oe1bu9454-187: The powers of attorney and blank forms have arrived. He says the Grand Chancellor is to provide 90,000 Rthl from the justice fund, with which Weigel, Schlabrendorff and Lichnowski are to be paid, and the Prince is to receive the 30,000 Rthl he wants. The mortgage certificate of the Zagórów and Trąbczyn estates is so encumbered that no one will lend further. Triebenfeld wants to be rid of Oppenheimer in order to recover the mortgage of 250,000 Rthl. He intends to go to Pszczew because of Meyer Bernhard's suit, then to Kalisz and Trąbczyn to collect money.
oe1bu9454-188: Triebenfeld reports that the Grand Chancellor is giving some 176,000 Rthl from the justice fund, with which the troublesome creditors, especially Weigel, are to be paid; he wants to redeem the mortgage of 200,000 Rthl pledged with Oppenheimer. At Pszczew he says he has settled everything and Echaust is satisfied. He is travelling to Kalisz and Trąbczyn to collect money for Fürth; some 102,000 Rthl are outstanding there (tenants, entry monies, interest, Wrąbczyn, Swięcia, Olesnica). Schenck is to recover it. He complains about Grattenauer, who he says does nothing and serves the minister.
oe1bu9454-189: Hahn reports that after the death of the mining councillor Bernhardi he received orders to travel to Upper Silesia and to settle the affairs of the lordship of Koszęcin with Inspector Krenig and Master of Forests Reichmann. From what he hears, he says not everything there is in order. He asks permission to visit v. Triebenfeld at Trąbczyn before returning to the Empire by way of Wrocław. He has also applied to the Prince for this. He asks for a few lines to be sent to Koszęcin.
oe1bu9454-190: On the Prince's instructions, Hahn sends a charta blanche and an extract from Glenck's letter of 22 March 1806. The Prince wants to rescue Glenck once more and calls on Triebenfeld to act in the same way and to send him the draft of the consent. If Glenck again rejects the conditions, he is to be left to his ruin. Glenck complains of hardship because of the Wrąbczyn estates, says he has saved Wilhelmsruh from forced sale, and wants to use the consent to get Ribbeck out of the purchase of Wrąbczyn.
oe1bu9454-191: An execution decree from Poznań demanded some 22,000 Rthl for the Prusimska; at Kalisz he says he gained time with documents from Rapacki. Peasants had left the plots assigned to them, sown the old ones and driven off German settlers; he had the ringleaders beaten with the whip and the plots marked out. The leases of Honrichs, v. Zglinski and the tenant of Kopojno were cancelled or shortened to one year; demesne farms are to be broken up at 600 Rthl per Hufe. He says Glenck is talking buyers out of it with a libel.
oe1bu9454-192: 'The writer reports from his sickbed: he says 360,000 Rthl have been promised in Berlin. He says he has calmed the peasants, who had been stirred up, and driven off the tenants. He says Glenck, together with the people of Olesnica, is inciting the inhabitants, turning buyers away and circulating a lampoon among colonists willing to buy. He says the Prince has already received 10,000 Rthl from Swięcia, 10,000 Rthl from Olesnica and 12,000 Rthl from Szetlewek. The judgment on the hereditary lease at Olesnica forbids eviction; the writer now intends to apply for consent.'
oe1bu9454-193: 'The Prince''s letter arrived only after 10 days, so the travel plan falls through. Triebenfeld advises against a journey to Parchwitz. He wants to come to Sławięcice still in April, before Berlin, to learn the Prince''s wishes. The Polish estates: he says the Dąbska is paying all the costs. Prefect Garczynski is having Honrichs arrested, who owes more than 10,000 Rthl. Triebenfeld says he got 600 Rthl back from him. The arrears are to be paid quickly and the estates returned free of encumbrance.'
oe1bu9454-194: Before the justice of the peace the claim to recover the Trąbczyn estates turned out very favourably, and the matter has been referred to the tribunal in Kalisz. The King of Saxony is said to be granting an indult for 10 years. The Invalids' Fund is demanding the whole capital from Triebenfeld and has brought suit, with a hearing on the 26th. He has asked the prefecture to suspend Honrichs and to use the 11,700 Rthl for the arrears of interest. He says sub-prefect Brzechffa gave security for Honrichs and issued false certificates.
oe1bu9454-195: 'Triebenfeld is waiting in Wrocław for Count Strachwitz, who is said to be arriving on the 23rd. The matter concerns a transaction over estates near Głubczyce, whose value is given as 900,000 Rthl. Flesch rebukes Goldstücker for having named the Count, and urges discretion. Triebenfeld suspects a swindle. He reports rumours: the King is said to be paying the contribution quickly, otherwise the French would move in; Napoleon is said to be demanding 20,000 men against the Turks; Hardenberg is said to be returning. The moratorium has been extended by 2 years.'
oe1bu9454-196: 'Triebenfeld has fled Wrocław: Lahr, to whom he owes 1,500 Rthl, had an arrest warrant obtained secretly through his agent Ludwig, despite a promised extension until Michaelmas. He must sell his mill for half its price. He suspects Flesch and his associates and regards Flesch''s exchange dealings as a swindle, but says he still wants to pursue the claim for recovery of the Trąbczyn estates. The Dutch loan has failed. The Prince should write to the Liquidation Commission in Berlin, citing Berger''s testimony.'
oe1bu9454-197: 'Triebenfeld reports that, according to Richter, General Köckritz told van der Lahr firmly to be quiet; he says Lahr is now willing to wait. He says Köckritz is also to obtain patience over the interest owed to the Invalids'' Fund. Triebenfeld means to start the business in Kalisz, then return to Wrocław, and is pressing Goldstucker and Flesch to agree to the exchange. Senior Steward Hegener is to review everything in Zagórów. He says he would pursue the Trąbczyn matter vigorously. Postscript: according to Tesmar, Lahr knows nothing of it; Triebenfeld suspects a piece of knavery by Flesch and his associates.'
oe1bu9454-198: Trąbczyn is to come back by Michaelmas at the latest; the sequestration has been lifted. The accounts of Honrichs and Frankiewicz, for which Brzechffa stands surety, are being examined by the calculator Schneider. Hecker and Hawich are to prove the 11,700 Rthl said to have been embezzled. Hecker may become administrator. The tenant Smidkowski is willing to pay several thousand at once in order to stay on the estates. Dąbska has been refused by the King in Warsaw with her petition concerning Trąbczyn. Köckritz says he will send the papers in the Colonna case. Hardenberg is to put the debt affairs in order.
oe1bu9454-199: Triebenfeld encloses a letter from T. about the King and Köckritz. He says he is not going to Berlin, but wants to send wine and game birds to T. so that a number of matters may be discussed at the farewell dinner. T. is to bring Hardenberg along to it. He doubts that Hardenberg will come with the King, as a note from H v M claims. He says he means to go quickly to Zagórów, where he hopes to sell his mill in Świniary for 6,000 Rthl and to collect arrears from his subjects.
oe1bu9454-200: Triebenfeld regrets that the birds sent by the Prince arrive only after General v. Köckritz has departed. Seegebarth, he says, should be put off with the prospect of money hoped for from the Polish estates. Triebenfeld intends to travel to Zagórów. He doubts that Weigel will accept Stössel as a debtor, and proposes to Weigel that he acquire the estates the Prince is to take over in Silesia and satisfy Stössel. He has asked whether the Prince may show himself to the King at Koźle or elsewhere.
oe1bu9454-201: Triebenfeld reports that Weigel is willing to take over the estates to be acquired for Zagórów (the Knobelsdorff or Poninski ones) and to settle his own and Stössel's claims against them; on the 30th he wants to confer at Świniary. For Świniary a buyer offered 220,000 Rthl in cash, while 250,000 Rthl is being asked; since only 90,000 Rthl is entered in the mortgage book, 160,000 Rthl would remain. If Weigel and Stössel are satisfied and Grotowski, Lichnowski, Zerboni and others are charged against Trąbczyn, he believes all the remaining debts can be cleared with 150,000 Rthl. He urges that the plan be pursued with F. August.
oe1bu9454-202: 'The writer tells a friend that Father Weigel, after a visit, is satisfied and has left the whole matter to him. He says Weigel is willing to take over the estates that the Prince is acquiring. The writer is to work everything out for him in detail, so that Weigel can explain it to his son. He reports that Weigel praised his lack of self-interest at length and wants to visit him more often. Postscript: the writer hopes to sell the 2 free holdings soon.'
oe1bu9454-203: Von Triebenfeld sends the statement given to Weigel concerning the planned exchange of the estates of a von Knobelsdorff for Polish estates. According to Fischbach, the Knobelsdorff estates are left with a net 310,000 Rthl; the Zagórów estates (worth about 540,000 Rthl, debts 247,000 Rthl) are left with 293,000 Rthl. Fischbach is willing to arrange the exchange for 1 1/2 percent. Knobelsdorff may perhaps also take over the Trąbczyn estates together with their debts and see the lawsuit through himself. Triebenfeld asks for orders on whether both of them should come to Sławięcice.
oe1bu9454-204: Triebenfeld complains that the Prince's letter to Heyne, saying he wished to give up Koszęcin to Weigel or Stössel, had almost wrecked his plan. He says Weigel now wants to let the matter rest and asks whether Stössel would credit the Prince's payments. Heyne is to put everything back on track. Triebenfeld asks for a frank answer and warns that if Koszęcin is handed back to Stössel the Prince would lose everything he has put into it. He asks the Prince to show his letters to no one.
oe1bu9454-205: 'Triebenfeld pursues the exchange deal: according to the letter to Fischbach, Knobelsdorff is ready from the 11th for the journey to Zagórów, and Triebenfeld says he has asked him about the date and meeting place. Weigel wants, should Stössel take the Biskupice estates, to have himself entered there, to give the Prince a receipt and to have everything cancelled on Koszęcin. He reports that Labage is to offer linen and iron in Paris for contributions, and he expects iron prices to rise. He warns the Prince against false friends.'
oe1bu9454-206: 'Triebenfeld warns of dangers, advises expecting nothing from the government, and says he will travel to Petersburg if need be. He says Knobelsdorff''s exchange is secure. As for the 35/m Rthl, he says Eberhard''s schedule is missing. Scharnhorst spoke at length in Koźle on the Prince''s account; a sum of money offered to him should be refused. On the 2nd Triebenfeld intends to go to Poland: Cabanis is to prove on oath which lands belong to Zagórów, all contracts are to be produced, every hereditary tenant and colonist is to acknowledge what has been paid and what is in arrears, and matters are to be settled with Honrichs.'
oe1bu9454-207: 'Copy of a memorandum signed by Hecker and Honrichs: the Trąbczyn lawsuit has been set in motion at Kalisz, with a hearing on 24 October. The lawyer promises a favourable outcome and has received 200 Rthl in advance. The sequestration of the estates has ended. A settlement with the hereditary leaseholders of Oleśnica over 12 Hufen in hereditary lease is recommended. The Dutchmen consider only 2 gulden per Morgen bearable instead of 3 gulden v. Triebenfeld thinks arrears could be partly remitted; he says Knobelsdorff would rather have land than interest.'
oe1bu9454-208: 'v. Triebenfeld says he cannot yet travel to Poland for lack of money. In the Schlieben matter his Świniary rent money has been placed under seizure, and an execution for 48 Rthl 6 Groschen in costs has been sent to him. Triebenfeld asks the Prince to instruct Lombardini to pay the 48 Rthl 6 Groschen. He also reports news: the King''s manoeuvres near Potsdam and Berlin, the confiscation of colonial goods on the Elbe, rumours of 60,000 Frenchmen, 30 arrests in Berlin, and that things are beginning to go badly with Kalckreuth.'
oe1bu9454-209: Triebenfeld confirms that he has received the order of payment. He says he intends to collect the money and leave at once. From Zagórów he says he will report everything to the Prince immediately by a mounted messenger, who is to bring H. v. Knobelsdorff there.
oe1bu9454-210: Triebenfeld reports on three lawsuits. He hopes to recover Trąbczyn by vindication and so save 22,000 Rthl of dowry money. Falz, President Smagorzewski and the assessors received payments. He says the people of Oleśnica owe 39,270 Rthl, and that Polish peasants from Oleśnica wish to enter into their contract. Niedźwiecki owes 6,000 Rthl and the tenant of the propination rights 3,000 Rthl. Hawich must go. By New Year he hopes for 44,000 Rthl, including 12,000 Rthl from the old Hollanders and 6,000 Rthl from Radzinski of Szetlewek. The Prince is asked to obtain leave from Danckelmann for the clerk Sommer.
oe1bu9454-211: 'Mr von Knobelsdorff has inspected the place and likes it. Triebenfeld now means to arrange everything so that the matter can be taken in at a glance. He complains of great confusion and of stubborn people, who are being heard by von Hawich. From the lawsuit over Trąbczyn he expects a good outcome: the hearing has been under way since the 24th, and it may take another 14 days until the Tribunal''s decree is read out. If he wins, he says, all the hardship should come to an end.'
oe1bu9454-212: 'Triebenfeld reports, after a serious illness, that no one is paying and that 31 lawsuits are pending. He says the people of Oleśnica, Niedźwiecki of Kopojno and Hawich of Drzewce should be turned out and 3 demesne farms set up again. Napoleon''s declaration on paying off the debts to Prussia over 40 years is confusing the colonists, who will not accept the reduction of interest offered them. After Poniatowski''s letter the tribunal referred the Trąbczyn matter to the higher authority. The old Hollanders offer 40,000 Rthl at once. Valuation of Zagórów: 22,140 Rthl annual yield, 7,140 Rthl surplus from Midsummer.'
oe1bu9454-213: Triebenfeld reports that the state taxes have been paid apart from 900 Rthl; he hopes to have the sequestration lifted soon. Because no one is paying, he is conducting 43 lawsuits, among them against Niedźwiecki (6,000 Rthl), Nossalski (3,000 Rthl), the people of Oleśnica (about 33,000 Rthl), the Wrąbczyn peasants, and in 29 cases against settlers with 39,000 Rthl of unpaid interest. The costs of the lawsuits come to 1,450 Rthl, of which 750 Rthl are for the Trąbczyn lawsuit and the Meierowitz one. Hardenberg demands proof of the new seizure on the sums given from Prussia to Poland.
oe1bu9454-214: 'Triebenfeld reports the confirmed settlement: the bank and invalids'' debts are to be paid off over 41 ¾ years at 6 per cent. For the private debts and Weigel the minister holds out the prospect of a similar moratorium. The hereditary leaseholders are paying nothing; he expects their contracts to be annulled and wants to set up demesne farms. The lawsuits over Oleśnica and Wrąbczyn are pending, and matters stand the same with Swięcia. Hecker and Hawich are stirring up the people, and Hecker is said still to owe 2,500 Rthl. On the 28th he intends to travel to Berlin.'
oe1bu9454-215: Triebenfeld confirms 1,000 Rthl through Bally. He says Hawich and Hecker are to be dismissed. After the payment of 5,100 Rthl in interest he presses for the lifting of the sequestration of Zagórów. He says Dąbska has taken possession of Trąbczyn without a judgment and that her entry in the mortgage book has been rejected; he is pursuing the recovery of Trąbczyn and Kamionna. Land appropriated by Honrichs, Hawich and Hecker is to be returned and settled with colonists; the colonists of the lordship of Zagórów are to be remitted a third of their interest this year.
oe1bu9454-216: Triebenfeld expects that private debts and the Bayonne sums (bank, invalid and wards' moneys) will be made subject to a moratorium of 41 3/4 years; 200,000 Rthl charged on the estates would thus be paid off at 6 per cent. He urgently presses for a decision whether the Prince will keep the estates or exchange them; if he keeps them, Triebenfeld means to drive out the Hollander by legal action and form demesne farms. He asks for a power of attorney for the lawyer Schmid in Kalisz against Hecker, who with Hawich is stirring up the subjects, and for a letter to Hecker.
oe1bu9454-217: Von Sanitz asks whether the first tribunal has already decided on the Prince's Trąbczyn estates, and asks if possible for copies of the justice of the peace's judgment and of the tribunal's sentence. He has moved to Berlin to save what remains of his lost fortune. He says his former agent in Poznań, Weltzer, holds out little hope. From the Saxon court he hears that Polish Commissioners, acting on a petition from Dąbska, have ordered the estates to be returned to her. He says war in the north is expected soon.
oe1bu9454-218: Triebenfeld proposes exchanging the Zagórów estates for Count Wartensleben's Skorogoszcz; Stössel and Weigel are to take over Skorogoszcz and a mortgage of 207,625 Rthl. If need be, he intends to exchange Blizanów with Wartensleben's eldest son and to contribute a mortgage of 30,000 Rthl on Konotop. He asks for a quick and secret reply, since Wartensleben is negotiating with Gumperts. He means to win the lawsuits with Oleśnica and Wrąbczyn, recommends Heuthausen for the arrears at Pszczew (about 20,000 Rthl), and reports seizures on Świniary.
oe1bu9454-219: Triebenfeld urgently asks for a decision on the plan he sent in, since a councillor of medicine from Kalisz is already negotiating with the old Count Wartensleben. The advantage would be clear, he says, if Weigel and Stössel were satisfied by it. If the Prince agrees, he intends to travel to Nysa and exchange his Blizanów with Wartensleben's elder son in order to satisfy the creditors. He complains of rising dues and growing hardship and fears murder and revolt. He says President Dierschlag has been asked whether he has bought estates.
oe1bu9454-220: Triebenfeld says he came too late to the old Count Wartensleben in Nysa, who has already concluded a sale of Skorogoszcz with a merchant from Kalisz. He proposes the Wołczyn estates of the young Wartensleben (asking price 200,000 Rthl, debts 120,000 Rthl). Weigel and Stössel are to take over these estates together with the mortgage on Zagórów and give the Prince a receipt for more than 350,000 Rthl. Koszęcin could be taken as an entailed estate for Prince Alexander.
oe1bu9454-221: Triebenfeld says he cannot send the 18,000 Rthl ordered from the Zagórów estates before two lawsuits have been won. He hopes to pay the Christmas interest so that the moratorium holds. He has set in motion the sale of Zagórów to Stössel through Count Leopold v Wartensleben; according to Wartensleben, Stössel demands that Rusinowice be included. Triebenfeld may want to exchange Blizanów for the Pila estates, settle with Weigel and Stössel (total account 470,000 Rthl) and so save Koszęcin. He rejects Wołczyn and Skorogoszcz.
oe1bu9454-222: Triebenfeld reports that Baron Stössel is willing to take over the Zagórów estates for his claims according to his plan, and urgently asks for an answer whether the Prince wants the matter settled in this way with Stössel and Weigel. He says Stössel demands a letter from the Prince; Count Wartensleben advises that it should state that, because of the mother-in-law's will, Koszęcin cannot be paid for, and that he is therefore giving Zagórów, to which Triebenfeld wishes to add the Blizanów estates. Köckritz calls Triebenfeld to Berlin.
oe1bu9454-223: The Prince reports an exchange offer from General v Schimmelpfennig, who wants to trade the Zagórów estates for his own estates Szelce and Maderzewo near Mysłowice (yield 8,000 Rthl, according to others 6,000 Rthl). Lieutenant Sommer is to prepare the inspection at Zagórów. He doubts a deal with Weigel will be concluded. He urgently needs cash by Christmas, no longer asks about the Trąbczyn lawsuit, and permits Trąbczyn to be included in a transaction if this is advantageous. He gave a suitor from Hohenlohe-Kirchberg his consent to marry Adele.
oe1bu9454-224: 'The writer is negotiating the sale of the Zagórów estates to General Schimmelpfennig, who wants them for 200/m Rthl. Schimmelpfennig''s sons-in-law, cavalry captain von Kotzow and v. Johnston, are to inspect the estates together with Lieutenant Sommer. The payment plan: the estates Seliz and Modzewo for 110/m, the estate Goła Wieś, 66,000 Rthl in mortgage bonds at par, the remainder in cash or in Silesian mortgage bonds. According to cavalry captain v Stössel of Rusinowice, the sale to Weigel and Stössel has fallen through. The addressee should bring the lawsuits to an end.'
oe1bu9454-226: 'Triebenfeld thinks the exchange plan with General Schimmelpfennig has fallen through or been held up by obstacles, since neither Sommer nor the General has arrived. He sends on a letter from Count Wartensleben: he says everything depends only on a letter from the Prince to Stössel, to the effect that Stössel and Weigel can be satisfied only out of the estates in the Duchy of Warsaw. The Prefect demands the original deed for Zagórów, failing which confiscation threatens. He asks whether the lawsuit over the Trąbczyn estates should be continued.'
oe1bu9454-227: Triebenfeld forwards the offer of the sub-prefect von Brzechffa to lease the lordship of Zagórów for 6 years at 20,000-25,000 Rthl a year and to put the 3 demesne farms in order for 3,000 Rthl. Triebenfeld advises accepting the contract, since he says he cannot raise the dues and interest, among them 1,250 Rthl to the Invalids' Fund, and a new sequestration threatens. He asks for a decision between a deal with General von Schimmelpfennig and the lease, followed by a settlement with Weigel and Stössel to free Koszęcin.
oe1bu9454-228: The memorandum signed by Sommer reports on his mission to General Schimmelpfennig v der Oye. He says the General is still willing to enter into the planned exchange involving the Zagórów estates. What has delayed him, he says, is his illness and the difficult negotiations of his son, the cavalry captain, with Stägemann in Berlin over the money to be handed over; through the mediation of the Saxon envoy these now stand more favourably. Since no inspection of the estates is possible in winter, the General asks that the matter be put off until spring.
oe1bu9454-229: Triebenfeld sends birthday wishes. He reports the thanks of the Attorney General Count Lipski, the President of the Tribunal Smogorzewski and the councillors of the Tribunal for the game, and he expects this to have an effect when the Oleśnica and Wrąbczyn case is decided. With Brzechffa he has concluded the lease of the Zagórów estates for 20,000 Rthl, subject to approval. On 8 February he intends to arrive with him at Sławięcice. He says the interest is secured and the Bayonne capital will be paid off; the documents submitted have removed every dispute, and perhaps the dues will be reduced.
oe1bu9454-230: The Prince complains that Triebenfeld has missed the date of the 8th, which he had set himself, for coming to him with Brzechffa. Since he draws nothing from the estates, he wants to make use of General von Schimmelpfennig's interest in buying Zagórów; the General means to view it at the beginning of March. He demands a definite answer and financial help. He has no objection to the lease to Brzechffa, but presses for haste, since he has asked the King for a commission to settle his debts.
oe1bu9454-231: Weigel asks von Triebenfeld to fix a day for a meeting in Kalisz or at another place of his choosing. There he wants to discuss and take counsel on the matters between the Prince of Hohenlohe and himself. He says that some weeks ago he was in Kalisz on his own business and had hoped to see von Triebenfeld there, but that he could not find out with certainty where he was staying. He asks for a prompt reply.
oe1bu9454-232: Triebenfeld, ill for weeks and without money for a doctor, reports harassment over the leasing; he says Brzechffa has declared he will pay at Midsummer. He means to go to Warszawa with Brzechffa to pursue the Trąbczyn and Wrąbczyn business. He urgently asks for a declaration issued by a court assigning him 3,125 Rthl, with interest and costs 4,219 Rthl, out of the interest from Swięcia, Wrąbczyn, Alt Olesnica, Skokum, Sophienthal, Kopojno and Adelow. He says grain, livestock and fodder have been taken away and the hardship is great.
oe1bu9454-233: 'He proposes plans for paying off the debts: v. Sobottendorff, to whom the Prince owes 40,000 Rthl, is to lease Drzewce for 18 years at 2,000 Rthl a year, and his two sons are to receive 4 free settler holdings in Swięcia at 1,000 Rthl each. Weigel is to lease the demesne farm of Kopojno with propination rights for 9 years at 6,000 Rthl a year for his 50,000 Rthl. Prince August is to pay 50,000 Rthl to the Invalids'' Fund. Cabanis is to present his account before Chomanowski and bring it to Sławięcice.'
oe1bu9454-234: 'Triebenfeld has sent an express messenger to Wrocław so that Weigel will come quickly. If his plan with Weigel succeeds, he says the Prince will be rid of a debt of about 54,000 Rthl. The obstacle is the Invalids'' Fund: it is demanding some 9,000 Rthl in arrears of interest and has placed an attachment on all interest. Triebenfeld wants to obtain from the King that the capital of 50,000 Rthl from the Sacken estate be paid to the Fund, and he recommends the help of Prince August for this.'
oe1bu9454-235: 'Triebenfeld reports that old Weigel is willing to conclude the lease contract and, on his advice, is not averse to buying the Zagórów estates: he would take over the debts and pay a further 200,000 Rthl, which he wishes to set against Koszęcin. Weigel advises keeping the matter secret and having Koszęcin sold at auction. He would make it over to the Prince by a written undertaking and believes it can be had for under 600,000 Rthl. Triebenfeld asks for secret instructions and for the papers to be sent quickly.'
oe1bu9454-236: Weigel has handed over to Triebenfeld all of his business with the Prince. Once he has recovered, Triebenfeld is to travel with him to the Prince. He considers Weigel's offers advantageous. Weigel wants to buy, so the lease contract has been postponed. Triebenfeld is waiting for the papers and asks that the enclosed letter to the Prefect be signed and sent back by express. He says Sobottendorff can rest easy and that Honrichs is a scoundrel; he says Cosmar assured his son that no creditor of the Prince will ever get a single Groschen.
oe1bu9454-237: Triebenfeld asks that the Prince's letter be sent to him at Dresden to be held at the post office; with the letter to the Emperor, he says, he will certainly get Trąbczyn and Kamionna back. He is leaving for Dresden because his eldest son is lying at Naumburg, shot through both thighs. Steward König posted his last letter at Syców instead of sending it to Sławięcice. Trzciński, Zerboni and Meierowitz offer nothing but excuses; execution is proceeding only against Meierowitz. Radke cannot get away because of 80,000 Russians.
oe1bu9454-238: Hohenlohe complains that Trzciński has paid nothing and that Zerboni has not met his obligations. He says Mr Weigelt is pressing him, and he means to calm him with Trzciński's bills of exchange. An earlier letter from Triebenfeld, he thinks, was probably lost in the fire at the post house in Wartenberg. He encloses an open letter to the Russian Emperor for use as needed. The King, the State Chancellor and the Minister of Justice, he says, refused him help with the settlement with the creditors at Brzeg. He hopes to obtain something from Meierowitz, and asks after Ratke.
oe1bu9454-239: Having arrived late at Nysa because of his gout, Triebenfeld reports that the King left after three days for Teplitz, where the Russian Emperor is staying with his sister; he says it is doubted that Emperor Franz will come. He says Austria wants to remain neutral and that Napoleon has hurried to Paris. The government, he says, is moving to Ząbkowice Śląskie. Triebenfeld intends to go to General Ortel at Neustadt, and says his plan has met with approval. Letters for Mrs. v. Hahn and Chief Forest Master v Kleist have been seen to.
oe1bu9454-240: Triebenfeld reports that Austria wants to stay neutral and only mediate. Russian troops and generals, he says, were grumbling about the armistice. Köckritz, he says, has fallen out with Hardenberg and mocked his confidence in front of the monarch. Supplies, he says, are uncertain, grain scarce and the roads bottomless. Zastrow is to command the militia at Nysa (55,000 men), while Ortel lies ill. Triebenfeld intends to travel by way of Nysa to Ząbkowice Śląskie, to the headquarters and to Świniary, to bring up produce and raise money.
oe1bu9454-241: Triebenfeld says he has handed General Gneisenau the Prince's letter at Nysa. Gneisenau intends to reply and sends word that the Prince should be calm, matters will improve. Gneisenau now commands the Silesian militia and is chief of the general staff. Köckritz has changed Zastrow's mind, and Zastrow now speaks warmly of the Prince. Hardenberg is with the Russian Emperor in Bohemia and returns in 5 days. Everyone speaks in favour of Triebenfeld's plan for supplies from Poland.
oe1bu9454-242: v. Triebenfeld reports from Vienna that the congress has been adjourned until 1 November and that France is resisting the Saxon and Polish acquisition, but that Hardenberg remains firm. He says the Württemberg affairs are going well. He has submitted his plan for Sławięcice after consulting Barbe Hardenberg, and it was approved. Koszęcin must wait until the Curian matter has succeeded. On Kolno, Kamionna and Trąbczyn, he says nothing will be settled before the decision on Poland's fate. He says the Miączyńska, born Prusimska, has powerful friends.
oe1bu9454-243: Triebenfeld asks for 300 Rthl in Gold because of the terrible high prices in Vienna; otherwise, he says, he will have to leave on the 23rd. For 400 Rthl he exchanged he received 1,200 gulden in Vienna redemption notes, of which he has spent 392 gulden. He reckons on 50 gulden W.W. or 15 Rthl a day and 260 gulden for the return journey. He says he can live only another 10 days, but that the matter is to last at least 5 more weeks. He is lodging at the Golden Duck, Schulerstraße.
oe1bu9454-244: 'Reports from the Congress of Vienna: the Emperor, the King and Grand Duke Constantine have been given Austrian regiments. The princes and estates of the Empire have asked Metternich to reinstate the Emperor of Austria as head of the Empire. Nothing has been decided about Poland, and Wilhelm von Humboldt is doing excellent work. Triebenfeld assures the Prince of a quiet life in Sławięcice, urgently awaits his letter and asks whether someone should be sent to Brzeg about Cosmar and the settlement of 1811.'
oe1bu9454-245: Petition to State Chancellor Hardenberg on behalf of the distressed Prince Hohenlohe, partly illegible. It says the Councillor of Medicine Cosmar, as executor of the will of Princess Sacken, controls the entailed estates of Sławięcice, Lasowice and Oppurg (79,500 Rthl in yield); that he relies on a settlement of 1811, pays nothing and submits no account; and that the Curland heirs will take 112,000 for 426,000 Rthl. Requested are an advance of 112,000 Rthl, annulment of the settlement, Cosmar's removal and a report from the High Court of Appeal in Brzeg. Triebenfeld offers 60,000 Rthl as security.
oe1bu9454-246: 'In the matter of the Polish estates, von Triebenfeld is to stay quiet until a decision has been reached about Poland. If the district of the Trąbczyn estates falls to Russia, he says the Prince Chancellor will speak for the Prince with the Emperor. He says he submitted a petition after altering it twice. In the Koszęcin matter nothing of substance has yet happened. News from the congress: Saxony falls entirely to Prussia, and nothing has been decided about Poland. Zerboni received the Order of the Red Eagle. He encloses a pamphlet by Gärtner.'
oe1bu9454-247: 'Triebenfeld reports that Poland''s fate has been decided favourably; now, he says, come the affairs of the Empire, for which he sends a copy of the petition of Privy Councillor Goerch on behalf of the whole House of Hohenlohe. Wilhelm von Humboldt promised support. The State Chancellor declared that the money should be given, but that cancelling the settlement pursued by von Cosmar would cause an outcry. He says the Curische heirs are to be satisfied with 112/m Rthl and the remaining creditors with 12,000 Rthl a year. Enclosed account: income 79,500 Rthl, expenditure 79,462 Rthl.'
oe1bu9454-248: Triebenfeld reports that the Prince Chancellor has the best of intentions and that Minister von Humboldt is pursuing the Prince's case eagerly. He says the Curisch heirs have asked the King to satisfy their claim, and that the King wants to settle the matter after his return. Count Winzingerode, he says, intends to demand 100,000 Rthl for Prince August under the will of Princess Sacken out of the income from Sławięcice and Lasowice; Triebenfeld replies that she was only a life tenant. Because of Warsaw, the Trąbczyn and Kamionna matter is at a standstill.
oe1bu9454-249: Triebenfeld acknowledges two letters from the Prince. He says Court Councillor Hahn's paper can no longer be added to the petition, since it is already before His Majesty. He says he urgently needs 12,000 Rthl to conclude matters with the authorised representatives; after that 100,000 Rthl would be made payable in Berlin. He says the enclosure shows Wilhelm von Humboldt's goodwill. Gärtner is to submit a paper on the Hohenlohe grievances to the Congress. He says the Prince should issue Göschel's power of attorney without a name; Triebenfeld intends to enter either Göschel or Gärtner.
oe1bu9454-250: Wilhelm von Humboldt confirms receipt of Triebenfeld's letter of the 3rd of the month, which informed him of the memorial handed to Prince von Hardenberg. He returns the Copy left with him and promises to support its content so far as this lies within his sphere of activity. The letter is filed as an enclosure to the letter of 17 November.
oe1bu9454-251: 'Triebenfeld submits an opinion which the Prince of Hohenlohe had drawn up from the files of the High Provincial Court at Brzeg. He asks for written assurance of the hope that 112/m Rthl will be advanced to settle with the C. heirs, so that the Prince can conclude the agreement with their attorneys. He says the transaction and the codicil of 1811 were fabricated by Cosmar. The Prince is nearly 66 years old, so any delay is dangerous: the monarch could lose 461,000 Rthl including 35,000 Rthl.'
oe1bu9454-252: Hardenberg replies to Triebenfeld's request of the 25th of the previous month. He says the claims of the Prince of Hohenlohe to Trąbczyn and Kamionna will settle themselves as soon as the general settlement and agreement concerning the Duchy of Warsaw, which is now in progress, is carried out.
oe1bu9454-253: On Trąbczyn and Kamionna, Triebenfeld says that in answer to his enquiry he received only a short reply (enclosed). He concludes from it that the matter will be settled along with the great general settlement. He says he handed Court Councillor Hahn's opinion to the State Chancellor, who saw nothing new in it. The Duchess of Żagań wishes to raise money on Żagań and is pledging for it the royal debt, the sum guaranteed for Prince Hohenlohe. The King has postponed this. Triebenfeld wants a written assurance so as to conclude with the Courland agents.
oe1bu9454-254: 'Triebenfeld complains that he is left without an answer and without money, and demands funds. He says he asked for 1,400 Rthl for four to five weeks but received only 640 Rthl, and that within fourteen days he will need a further 600 Rthl or 200 #. He promises the return of the Polish estates, the paying off of the Curian debt of 461,000 Rthl, and release from the Koszęcin ties. The Prince is to say nothing about the sale of Koszęcin. Enclosures: two receipts and the request to send 200 Rthl to his daughter.'
oe1bu9454-255: Triebenfeld reports that State Chancellor Hardenberg has been ill for five days; without him the Prince's affairs are at a standstill. He says Hardenberg has taken them in hand, that Minister Wilhelm von Humboldt speaks of the game being won, and that Court Councillor Hahn's opinion has had its effect. The priorities, he says, are ending the Curian matter, Cosmar's fall, and possession of the estates as holder of the entailed estate. According to news he has received, the King of Prussia travels to Berlin on 8 December; Triebenfeld intends to appear in person on the 11th and asks that no more letters be sent.
oe1bu9454-256: Triebenfeld reports that the order is to go to Berlin to Kircheisen and the Finance Minister v. Bulow to set up a commission to investigate Cosmar's conduct. He says Stägemann is to draw up an opinion for the State Chancellor, but Triebenfeld distrusts him as a friend of Zerboni and Cosmar. The settlement with the Curische heirs and an advance of 112/m Rthl remain unresolved. He complains of a lack of money, files and instructions, the settlement of 1811 being incomplete, and asks for evidence, blank forms and support for his children in Wrocław.
oe1bu9454-257: The writer refers to the addressee's representation that the Prince of Hohenlohe had undertaken, in the settlement of 1811, to pay the capital owed to the Courland heirs himself. Since he cannot find the passage, he asks that it be marked in the enclosed settlement and that the document be sent back to him by the bearer.
oe1bu9454-258: 'Submission by von Triebenfeld to an unnamed Serene Highness in the matter of the Prince of Hohenlohe, which is to be sent back. He objects to the referral to a commission in Berlin communicated through Stägemann. He repeats his proposal: he says the Curisch heirs would regard the debt as settled with 112,000 Rthl, the Prince paying off 25,000 Rthl a year and discharging the 35/m Rthl raised at Wrocław in 1790. He warns against making inquiries of Count Wratislaw and offers a security of 60,000 Rthl.'
oe1bu9454-259: v. Triebenfeld says he expects Hardenberg's decision at any hour, ordering the Higher Regional Court at Brzeg to investigate the matter at once and report. If the report agrees with his submissions, he says the State Chancellor will have the 112/m Rthl paid. The Prince should declare openly before the Commissioner that he was induced to join, that the settlements harm the creditors, that the debts are fictitious and that Cosmar forged the whole thing. He should consult Court Councillor Hahn and spare not even his own son. Barbe is speaking up for him.
oe1bu9454-260: 'Triebenfeld says he has sent Hardenberg''s resolution and the order to the Brzeg Higher Regional Court by express courier, and he is counting on Court Councillor Hahn. He sets out the points for the princely declaration: that while in custody the Prince was induced to agree to the settlements and the codicil, that the sums were largely fictitious, and that all of it was driven by Cosmar, who he says stirred up the son against the father. The aim: annulment of the settlements, surrender of the estates, and an advance of 112/m Rthl. He asks for a Copy, blank forms and a letter of thanks to Hardenberg. Postscript: he urgently asks for 300 Rthl in Gold.'
oe1bu9454-261: Triebenfeld reports a firm promise that the Polish estates will be recovered. For the Trąbczyn estates he is to have a calculation ready, and he suggests Leixner present the calculation of damages for Kamionna. He says everything depends on the Prince's declaration and on the report of the High Court of Appeal at Brzeg, which would have to agree with his own submission. Then 112,000 Rthl would come in to pay the Curische, and Cosmar would be brought down. He asks that Hahn be allowed to act, and sends a form of power of attorney for v. Göschel. According to Gärtner the Hohenlohe case stands very well.
oe1bu9454-262: 'Triebenfeld reports that Hardenberg has promised Prince Hohenlohe-Bartenstein that he will take up the Prince''s case actively. Everything now depends, he says, on the Prince''s declaration and the confirmation of his Memoirs; then the Cur. heirs would be satisfied and Cosmar called to account. A letter of thanks to the State Chancellor should mention that Cosmar gave only 2,500 Rthl instead of 72,000 Rthl. He asks urgently for 100 #. Postscript: he suggests reminding Hardenberg of the 100/m Friedrich d''or sent to Koblenz through Meyer.'
oe1bu9454-263: Triebenfeld welcomes the sending of Court Councillor Hahn and Lombardini to Brzeg with powers of attorney, and hopes with Eberhard that the Curische heirs will be satisfied. He warns, however, that the Prince Chancellor wants the Prince examined in person, either at Brzeg or through a commissioner at Sławięcice who is to report to him. Göschel is submitting a further note to the Congress. As for Poland, everything rests until the Congress ends. He also reports the departure of the King of Württemberg.
oe1bu9454-264: Triebenfeld asks for strict secrecy about his plan for Koszęcin. Since he had heard that the King would no longer permit any exchange or purchase of estates, he took Court Councillor Barbe into his confidence, who was outraged at the gift of 30,000 Rthl said to have been demanded for Prince Hardenberg. Now Count Pourtalès, who wishes to buy property in Silesia, is to purchase Koszęcin; the Prince would still receive 38,000 Rthl. Triebenfeld says he has promised Barbe 30,000 Rthl and asks that the drafted bond be sent to him.
oe1bu9454-265a: 'The writer thanks the Privy Councillor of State for having guided his affairs. Everything depends on the advance of 112/m Rthl: then, he says, the King would be released from the obligation, would get back the debt instrument for 300/m Rthl, and the creditors would be satisfied. The advance could be paid off, he says, out of monies that Cosmar is holding back: 60,000 Rthl for his son August, 100/m Rthl for the eldest son, and more than 48,000 Rthl for the writer himself.'
oe1bu9454-265b: The writer asks a general to obtain from the Emperor the return to him of the Trąbczyn estates together with 8 years of revenues. The late King, he says, granted him the confiscated Prusimski estates of Kamionna and Trąbczyn in 1796. In 1807 the administrative commission handed them over to Prusimski's daughter, now Miączyńska. The tribunal at Kalisz referred him to Napoleon. Now the Prosna is to become the border. He fears Miączyński's influence with the Governor General and asks that v. Triebenfeld be heard.
oe1bu9454-266: He reports that Russia is demanding the Prosna as the border, which would place Trąbczyn and Triebenfeld's Blizanów estates under foreign sovereignty and make Trąbczyn hard to recover. He says the Prince Chancellor is opposing this. Should Russia obtain the districts, he says the matter would have to be settled with Emperor Alexander, since Dąbska or Miączyńska stands in favour with Lanskoy. He awaits the report of the High Court of Appeal at Brzeg. He asks for blank forms, powers of attorney, the letter to the Chancellor, and the written undertaking for Barbe, since Pourtalès will probably come in.
oe1bu9454-267: Triebenfeld complains that since the letter of 17 December, which he received on the 21st, he has had nothing further from the Prince. He waits in vain for the letter to the Prince Chancellor, the blank forms, the power of attorney for Göschel, the written undertaking for Barbe concerning Koszęcin, and for money; he says Barbe can give nothing more. What worries him most is the report from Brzeg that has not arrived. He says Russia intends to approach our master about Poland.
oe1bu9454-268: Triebenfeld confirms the receipt of 1,125 gulden in paper money. He has delivered the letters to the King and to the State Chancellor and has had letters written to General v. Schöler and to Stägemann. The Trąbczyn affair worries him, since the area will probably fall to Russia. He intends to have the Emperor worked on through General v. Schöler. According to Court Councillor Hahn, the officials' statement shows barely half as much income from the entailed estates.
oe1bu9454-269: Triebenfeld sends his letter to the State Chancellor, which Court Councillor Barbe handed over together with the Kircheisen correspondence. The matter now lies with Stägemann. He fears for Trąbczyn should the district fall to Russia. He says Hardenberg states that the Prince must otherwise be compensated. He does not yet have permission to approach the Russian authorities about Trąbczyn. He intends to pursue Cosmar's removal and the administration of the entailed estates, and awaits the reply of Count Pourtalès.
oe1bu9454-269a: 'Copy of a submission by Triebenfeld on behalf of the Prince of Hohenlohe. He sends the correspondence with Kircheisen, which the High Court of Appeal at Brzeg would not take down in the record. He says Cosmar has blocked the claim of the Curische heirs for 300/m Rthl and placed it under seizure. He says the heirs are content with 112,000 Rthl: 12/m Rthl in cash and an order for 100,000 Rthl. Triebenfeld asks that this sum be advanced to the Prince and that the entailed estates be put under administration. In return he offers to hand over the debt instruments and the royal guarantee.'
oe1bu9454-270: Kalisz will probably become Russian. Triebenfeld is to recover Trąbczyn, but receives no assurance. He says the Emperor is unlikely to overturn the measures of the Administration Commission, and will rather compensate the Prince in some other way. The State Chancellor forbids him any approach. Miączyński, husband of a woman born Prusimska, is a close friend of Count Lanskoy. The matter rests with Stägemann. If the Cur. are satisfied, Cosmar's attachment falls away. The estimate of revenues for the Brzeg protocol alarms him. Also rumours about Saxony and Wellington.
oe1bu9454-271: 'Triebenfeld reports from the Congress of Vienna: he says the Polish border over Słupca near Pyzdry, the Warthe and the Prosna has been accepted, and that the King of Saxony keeps Dresden, Leipzig and Bautzen. He says he continues to press the Prince Chancellor, and that the files are with Stägemann. The advance of 112/m Rthl he says may be regarded as secure. August is to cancel Cosmar''s power of attorney and write about this to the Minister of Justice and to the High Court of Appeal in Brzeg. On the Polish estates he awaits word whether he should come.'
oe1bu9454-272: Hahn sends, as ordered, the draft reply to Prince August. He attributes the withdrawal of the power of attorney to the decisions taken in Vienna. He fears fresh missteps in Öhringen, which he says could only be averted in person. Should the worst come, he says he would need a secret instruction together with a power of attorney. By inspecting the estates Hahn means to establish their true yield and what building work they require. The estates' funds, he says, should no longer go to a Berlin lawyer.
oe1bu9454-273: Triebenfeld defends himself against the Prince's accusations. He says he entered the revenues at 79,000 Rthl in line with the Prince's own figure, and that the officials reduced them to 36,000 Rthl. He says Court Councillor Hahn values the estates at 2 millions and the yield at 60/m Rthl, and that the advance of 112/m Rthl will be granted. He indignantly rejects any suggestion of secret arrangements with the Curische heirs. Nesselrode shrugs his shoulders. He asks that a successor be sent soon, and has named Hahn as administrator.
oe1bu9454-274: On the Trąbczyn vindication Triebenfeld says he has still had no decision from the Prince Chancellor. At a commission under General Amstetten he was advised against submitting it for the time being. He says he had the documents copied and certified, and the court papers translated into German under oath. He hopes the advance of 112,000 Rthl will soon be granted. From the congress he reports on the Württemberg assembly of estates set for 15 March and the protest of the estates. Barbe and Göschel ask that Prince August be warned to concede nothing.
oe1bu9454-275: 'Triebenfeld reports that Stägemann has still not made a presentation to the State Chancellor. He suspects ill will; he says a decision would be made in Cosmar''s favour if the Brzeg report were not so favourable to the Prince. His greatest worry is the submission of the files and documents concerning Trąbczyn, Kolno and Kamionna to the commission: the translator will only hand over the files with the translation against payment. He urgently asks for money and for the blank forms that were offered. He is ill and confined to bed.'
oe1bu9454-276: Triebenfeld sends a worrying letter from Eberhard written at Brzeg and asks for it back. He says Stägemann has not yet brought the matter forward and that Hardenberg has again promised help. He says he has only ever asked for 112,000 Rthl to satisfy the Curische heirs and to administer the estates under the Prince. He urgently asks that Eberhard be sent to Vienna for a settlement with the princesses. The petition concerning the Polish estates is ready; what is lacking is an order from the State Chancellor and money for translations.
oe1bu9454-277: 'Triebenfeld confirms receipt of the letter of the 6th with the order for 200 # and three blank forms, and again hopes that Eberhard and Hahn will come to Vienna. He says he has handed in the Polish estate matter once more with all the documents, and, on Beguelin''s advice, has written to Zerboni; the reply is enclosed. Stägemann had not yet made his report. Cosmar, he says, is as good as ruined, and August should demand the power of attorney back. He reports Napoleon''s landing at Antibes.'
oe1bu9454-278: Eberhard urgently asks the Prince to raise at least 5 to 600 Rthl for a journey to Vienna, which v. Triebenfeld is pressing him to make. He says a settlement with the Curisch heirs is possible only now, while the 3 princesses are in Vienna in person. The obstacles are an instruction from the heirs' general mandataries not to interfere, his lack of money, and the passports he needs. He is sending v. Triebenfeld a plan setting out 2 ways of justifying the journey.
oe1bu9454-279: Triebenfeld considers a genuine settlement with the Curisch heiresses decisive. After that, he says, the State Chancellor would arrange an advance and the administration. He is eagerly awaiting Eberhard. Hohenlohe-Bartenstein, Winzingerode and Göschel have written to Langenburg and Kirchberg. He suspects that Prince August has demanded the power of attorney back, which would leave Cosmar unprotected. As to the Polish estates, he says the Chancellor asks for patience until the decision on the estates taken from the donatories. He also reports news and rumours about Napoleon's advance and his outlawing.
oe1bu9454-280: 'Triebenfeld regrets that Eberhard is not coming and that no settlement has been reached with the Curland heiresses; he fears delay by Cosmar and Stägemann. He says Prince August has not yet revoked the power of attorney, and that nothing can be done with Prince Adolph regarding Koszęcin. On the Polish estates the Prince Chancellor replied; Triebenfeld is not to write to the Emperor. He adds news from Vienna: Napoleon''s march on Paris, Wellington''s departure, and Talleyrand''s quarrel with Emperor Alexander. He asks that Eberhard be sent quickly.'
oe1bu9454-281: Triebenfeld asks that Stock, the servant of Court Councillor Barbe, who is to fetch Barbe's sister to Berlin with Triebenfeld's 3 horses, be given a basket wagon, and in addition a two-horse transport to bring the cases of glass belonging to the Court Councillors Barbe, Heym and Philippsborn from Prague to Sławięcice. He says Stägemann has not yet made a report; an intrigue is suspected. Eberhard cannot conclude the settlement with the Curische heiresses. If Trąbczyn is lost, the Prince is to receive other estates, perhaps in Silesia.
oe1bu9454-282: Von Triebenfeld states that without a settlement with the Princesses nothing more can be achieved in Vienna, since the Prince Chancellor has been led to believe there was a settlement over 162/m Rthl. He urges that Eberhard be sent here with a passport. He complains that Prince August has accepted the post of president. A letter demands that the 100/m Rthl be paid to him in cash. He asks that Barbe's servant be dispatched, that a wagon be sent to Prague, and that Tambour and Wawrzyn be sent back to Blizanów. He reports on Napoleon's advance on Paris.
oe1bu9454-283: Beguelin promises to hand over the Prince's letter addressed to the Prince State Chancellor without delay and to put the Prince's wishes to him at the same time. He says he would be happy to help fulfil these wishes on the State Chancellor's instructions. He says he had not known Triebenfeld before and only met him in Vienna; that Triebenfeld referred to the Prince was enough for him to give him his full attention.
oe1bu9454-284: 'Triebenfeld reports that Trąbczyn, Kamionna and Kolno are no longer to be expected: he says Alexander has secured that the Poles keep the estates returned to them. He applies for compensation. For Kamionna he demands 93,000 Rthl in cash (the Broniewski mortgage sum together with interest) and 120,000 Rthl in estates. For Trąbczyn, valued at 316,000 Rthl, 246,000 Rthl remain after deduction of the debts. In all 459,000 Rthl. Weigel''s 30,000 Rthl have been transferred to Zagórów. Stägemann does nothing. He asks for blank forms and for Eberhard to come because of the settlement.'
oe1bu9454-285: Memorandum with a calculation of the compensation claim of Prince Hohenlohe for Kamionna and Trąbczyn. Kamionna, granted in 1796 to Anton v. Prusimski and pledged to Broniewski, was redeemed by the Prince in 1804 by settlement for 55,000 Rthl; with legal costs and interest, the Prusimska is to repay 94,550 Rthl in cash. Trąbczyn was valued at 316,000 Rthl; of 138,000 Rthl of debts (Lichnowski, Weigel, Grotowski, Zerboni and others), 78,000 Rthl remain. The sovereigns are to provide 367,164 Rthl in estates or cash, 461,714 Rthl in all.
oe1bu9454-286: 'Triebenfeld reports on Napoleon''s return and the threat of war; he says little can be achieved amid the confusion, that Hardenberg promises everything and that Stägemann acts as he pleases. Since Prusimska has had the Polish estates restored to her, he submitted the enclosed memorandum: it calculates the losses on Kamionna and Trąbczyn (assessed at 316,000 Rthl, net value 240,000 Rthl) and demands 390,100 Rthl in cash or in estates. He asks for the swiftest possible reply and for blank forms; Beguelin would like a letter from the Prince.'
oe1bu9454-287: Triebenfeld complains that the letter of 3 April lay unsealed with the Post Director and was probably read. He welcomes Prince Adolph's decision and intends, before the King's departure, said to be on the 18th, to lay the decision before him and to ask where Adolph is to go and which uniform he should wear. Beguelin gave Lombardini's letter to the Chancellor; Triebenfeld does not show Hahn's threatening letter. He reports on the armaments against Bonaparte and rejects the reproaches about the money sent.
oe1bu9454-288: Triebenfeld hopes Prince Adolph will arrive by the 22nd at the latest. He complains that the Cosmar matter has been dragged out for 5 months; Cosmar, he says, should deposit all the money with the High Court of Appeal at Brzeg and render an account. Over Trąbczyn he has approached Minister v. Stein, and he expects much from a French letter by the Prince that can be shown to the Russian Emperor. He rejects Otto's valuation of Trąbczyn at no more than 160,000 Rthl; compensation, he says, should be demanded according to Blomberg's estimate of 316,000 Rthl.
oe1bu9454-289: Triebenfeld asks Albrecht to obtain a categorical decision from the King on the claim of the Curische heirs. He says the debt amounts to 300/m Rthl, 426/m Rthl with interest, and that the King signed it as principal debtor. If the King pays, Cosmar's administration of the entailed estates should be lifted. If he disclaims it, Triebenfeld wants to reach a settlement with the heirs, who earlier were willing to accept about 112/m Rthl, and he asks for a royal advance for that purpose. He says Cosmar submits no account.
oe1bu9454-290: 'After seven months Cosmar has been instructed to pay the money from three years, of which 12/m Rthl a year is assigned to the creditors, into the High Court at Brzeg as quickly as possible and to render account. Stägemann defends Cosmar and advises the Curische heiresses. Minister Stein is pursuing compensation through the office of Sokolnik and has brought in the Chancellor, so that both may propose it to the Emperor. Triebenfeld intends to submit a memorandum on the Curische affair and on his military salary. Triebenfeld urgently asks for 100 # by express courier.'
oe1bu9454-291: Triebenfeld reports that a cabinet order of 27 April commands the immediate payment of the 100,000 Rthl to Prince August. He says the compensation for the Polish estates has been decided by Minister Wilhelm von Humboldt, but that the manner and timing depend on the Emperor. Stein, Worowzow and Nesselrode are working for it. Cosmar is to deposit the Prince's money at once, failing which he faces arrest and a supervisor. In the military matter there is nothing new. Triebenfeld urgently asks for money.
oe1bu9454-292: He reports that the compensation case is before the Emperor; he says Minister v. Stein has promised help and that Hardenberg will give his assurance in writing. In the dispute with Cosmar, he says Stägemann is defending him; before the Prince Chancellor, Triebenfeld demanded that the sums from the deed of 1799 and the settlement of 1811 be deposited with the High Court of Appeal at Brzeg. He says Prince August is to be paid 100,000 Rthl at once by cabinet order, and that Cosmar has reportedly been denounced for embezzling family money. He proposes meeting the Prince Chancellor in Nysa.
oe1bu9454-294: 'Bisenti reports on negotiations with the Duchess of Żagań concerning her claim of 30,000 Rthl or 100,000 # in Gold. She hopes, he says, that the King will pay the whole sum himself. As long as she is not told from higher quarters that he will not pay, Bisenti can do nothing. After that he expects a settlement on the offer of 150,000 Rthl made to her, subject to ratification from above. He asks Triebenfeld to see that the heiresses are told this openly.'
oe1bu9454-295: Von Triebenfeld says he missed the Russian Emperor at Kalisz. According to Chief Postal Director Espagne, Prince Chancellor Hardenberg is still in Paris and will not reach Berlin for another three weeks; Barbe, he says, is lying ill there with nervous fever. Triebenfeld is looking into the matter of Pszczew (Betsche), where the subjects have applied for the contract to be cancelled, intends to collect money from the tenant in Blizanów, and plans to travel to Berlin. He encloses Zerboni's reply to Schenck and doubts the report Schenck claims to have sent Hardenberg. Also rumours about Stein, Radziwiłł and Biron.
oe1bu9454-296: Grevenitz sends Triebenfeld the post that has reached him together with two original enclosures. He reports that Court Councillor Barby has died in Paris and says he intends to make enquiries with the widow. The State Chancellor had been expected and has meanwhile arrived. Philippischen is said to be dangerously ill. Grevenitz expresses his sympathy over Triebenfeld's illness. Cosmar, he says, has been convicted of dishonest dealing in the first instance but has appealed; should that stand, he will lose the guardianship.
oe1bu9454-297: Triebenfeld reports the death of his daughter, of Barbe and Trzciński, and his own serious illness. In the Pszczew matter the residents are applying for the contract to be annulled; Zerboni demands an explanation and seems somewhat dissatisfied with Schenck's report. He says nothing is to be hoped for from Kolno and Kamionna, and that Prusimski's daughter can hardly be compelled beyond the pledge sum already paid. He intends to come to an agreement with Leixner, to check Echaust's accounts, and asks for an answer in the Prince's own hand regarding the general power of attorney for Schenck.
oe1bu9454-298: Triebenfeld is still ill. As regards the compensation promised in the Treaty of Vienna, he says he has no fears, since his friend Boidelang, a confidant of Wilhelm von Humboldt, is to take Barbe's place. He says he wants first to settle matters here, then to put the business at Pszczew in order, and afterwards to travel to Berlin. He asks that the post office at Strelitz be instructed and that letters be sent to him by express messenger. The game he has asked for is to be delivered at Gostyszyn to the chief tenant Faust. In Kalisz, he says, the Prussian taler is now worth only 20 Groschen.
oe1bu9454-299: Triebenfeld intends to press the receipt that has been found with Leixner at Międzyrzecz while in Pszczew, and to have the debt struck off. He says he will agree to a cancellation of the contract, which the townspeople, the peasants and Zerboni want, only on conditions, among them 11,000 Rthl of canon arrears to the Prince. He says a further 99,000 Rthl from Pszczew are still due to the Prince. Triebenfeld insists that the 72,000 and 65,000 Rthl belonged to Kamionna. Trzciński is granted a postponement until Midsummer. Schenck wants a general power of attorney; Triebenfeld asks for a letter so as to be rid of him.
oe1bu9454-300: 'Reports a dispute in Poznań: Zerboni had an opinion on the organisation of Poznań drafted with his secretary Schmidt. Prince Radziwiłł refused to countersign it, because it went against the King''s order, whereupon Zerboni declared that he was the ruling lord here. Zerboni was sent to Berlin. Rumours: the Senate in Petersburg is said to have rejected the Polish constitution, and Grand Duke Constantin hurried to Petersburg. Once his messenger returns from Sławięcice, Triebenfeld intends to travel to Pszczew and then to Berlin about the compensation.'
oe1bu9454-301: Triebenfeld acknowledges the letter of the 26th brought by Lombardini. He reports nothing new and asks for the Prince's decisions; Lombardini is to report. He is expecting his son and a tenant for Świniary, and intends afterwards to travel to Poznań and Pszczew. In the compensation matter he hopes for a good outcome, since he says he has won over the Chief Prefect v Smiedecki in Kalisz. Game for here and for Zerboni in Poznań would have a good effect; the last lot, he says, was almost entirely spoiled.
oe1bu9454-302: 'Triebenfeld reports that he had Hawich and Chief Inspector Hecker with him and has issued thirteen court powers of attorney: concerning the Dąbska and the Trąbczyn estates; for the lifting of the sequestration; for a suit against Oppenheimer et Wolf in Kalisz for the cancellation of over 72,000 Rthl; for the removal of the sequestrator Honrichs and the annulment of his unauthorised land sales; against Niedźwiecki over arrears of rent; against the Oleśnica hereditary tenants; and for representation at the Diet in Warszawa. He says his bonds for 250,000 Rthl give him a say.'
oe1bu9454-303: Extract from the Princely Hohenlohe liquidation records listing 142 capital claims, totalling 17,874 Rthl Gold and 1,414,377 Rthl 7 Groschen 11 Pfennig Courant. Among the largest claims are Carl v Stössel with 191,000 Rthl, Goldstücker with 170,000 Rthl, the Stössel curator with 169,400 Rthl, Fr. Charlotte von Triebenfeld with 112,000 Rthl, the merchant Koppan in Wrocław with 80,000 Rthl, the v Köckritz heirs with 50,000 Rthl and the v Sobottendorff heirs with 44,200 Rthl. Bornstädt, Zerboni and Lombardini are also named.
oe1u199-001: The King of Prussia's confirmation, as sovereign, of the family majorat and fideicommiss that Friedrich Ludwig of Hohenlohe-Ingelfingen founded in his will of 7 October 1805. The extract of the will it recites makes majorat his houses in Wrocław, the park at Szczytniki, Bytków, Koszęcin with Boronów, Olszyna, Harbultowitz and Cieszowa, and the South Prussian lordships of Zagórów, Trąbczyn, Pszczew, Wieniec and Bątkowo. If the male line dies out, his third daughter Auguste receives the South Prussian estates, Adelheid the Silesian ironworks, and Emilie Koszęcin.

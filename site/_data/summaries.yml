adwl85-001: 'In 1790 and 1791 the archbishop of Gniezno had the parish of Trąbczyn, in the Konin deanery, inspected. Its priest, Józef Zurkowski, born in the diocese of Poznań in 1740 and ordained in 1767, had been instituted in 1785 on the presentation of Antoni Prusimski, Starost of Niszczewice, the owner of Trąbczyn and lay patron of the church. A fund existed for a vicar, an organist and a schoolmaster, but none of them was at the church. The parish took in Trąbczyn, Mariantów, Porąbki, a farm, the new and old Olędry (the Hollander settlements), Łazy, Osiny and Nowa Wieś, all Prusimski''s hereditary property. It counted 760 souls in 1791, 555 Catholics and 205 dissidents (Protestants), 189 of the dissidents in the Olędry, with the figures given village by village; in 1790 it had 28 baptisms, 10 marriages and 29 burials. The cruciform church of St Martin, consecrated in 1546, had two wooden chapels, five altars, a cemetery, a belfry with two bells and an ossuary, and needed repairs. The Trąmpczyński family, once owners of Trąbczyn, had built part of it, and Katarzyna Prusimska, née Rozdrażewska, the Chamberlain''s wife, had later enlarged it, at a time no one could tell. The registers of baptisms and marriages began in 1597, that of the dead in 1728; books that an earlier visitor, the Reverend Dorposki, had found there had gone, by a trick and because no one knew whose they were, to the creditors of the late parish priest Paprocki. The church''s foundations and documents ran from 1636 to 1697: sums charged on Trąbczyn, Kurów, Strzałkowo and Przespolew to pay for Masses, the tithes the Gniezno consistory awarded in 1692, its right to an inn, confirmed in 1694, and the land Andrzej Trąmpczyński gave to the church in 1697.'
adwl85-002: In 1791 the parish of Zagórów, next to Trąbczyn, had 2,734 souls, counted in twenty-four places from the town of Zagórów (275 men, 298 women) to the Hollander settlement of Holendry Wrąbczyn, among them Łukom, Drzewce, Oleśnica, Kopojno, Skokum and Wrąbczyn. Each place is counted by Catholic men, women, boys and girls and by dissidents (Protestants), who lived only in Łomow, Myszakowko, Imielno and Holendry Wrąbczyn. The totals are 1,028, 1,030, 270 and 246 Catholics and 57, 55, 27 and 27 dissidents; the figures do not quite agree, as the women's column adds up to 1,040 and the totals together to 2,740. At Myszakowko lived a woman of 110.
agad1169011745-001: In about 1797 the Prussian administration of South Prussia, the province Prussia formed from its share of partitioned Poland, counted the houses, churches and Christian and Jewish inhabitants, men and women, of the villages around Konin; the survey is undated. Trąbczyn, written "Trąpczyn", had 32 houses, a church and 165 inhabitants, 51 men and 114 women; its Hollander settlement had 34 houses and 271 inhabitants. The neighbouring Szetlew had 11 houses and 84 inhabitants, Szetlewek 20 houses and 140 inhabitants, 4 of them Jews, and Łukom 28 houses and 149 inhabitants. The places counted include villages, Hollander settlements, mills, demesne farms, an inn and the monastery of Ląd, among them Ląd, Lądek and Rzgów.
agad1174016-001: At Warsaw on 12 July 1807 the Governing Commission, the provisional Polish government Napoleon had set up, orders its Director of Internal Affairs to give Józef Wybicki, one of its members, back his estates of Manieczki, Przylepki, Boreczek and Esterpol in the department of Poznań, which the Prussian government had seized and given away. Napoleon had decreed their return at Finckenstein on 5 June; the director is to have the Poznań administrative chamber hand the estates over and put Wybicki in possession without delay.
agad1174016-002: 'On 21 July 1807 at Dresden the Governing Commission, the provisional Polish government Napoleon had set up, extended Napoleon''s decree of 5 June, which gave back to its member Józef Wybicki the estates Prussia had confiscated, to three others whose hereditary estates Prussia had confiscated: Michalina Dąbska, born Prusimska, daughter of the Starost Antoni Prusimski, whose case Napoleon had referred to the commission; General Niemojewski; and Wichrowski. Their estates were to return to their owners. The resolution names no estate; it is the act by which Trąbczyn came back to Antoni Prusimski''s daughter after eleven years in the hands of Prince Hohenlohe-Ingelfingen, a Prussian general to whom the King of Prussia had given it.'
agad11740273-001: 'At Dresden on 21 July 1807 the Governing Commission, the provisional Polish government Napoleon had set up, resolved to extend to Michalina Dąbska, born Prusimska, the justice Napoleon had done its member Józef Wybicki by his decree of June given at Finckenstein. Dąbska asked for the return of her hereditary estates, which Prussia had confiscated and given to others, and the Emperor had referred her case to the commission. The commission applied the judgment for Wybicki also to General Niemojewski and to Wichrowski: the hereditary estates of these persons, confiscated by the former Prussian government, were to return to their true owners. The commission''s president, Stanisław Małachowski, initialled the draft.'
agad11740273-002: 'On 20 July 1807 at Dresden Michalina Dąbska, born Prusimska, daughter of the Starost Antoni Prusimski, asked the Governing Commission, the provisional Polish government Napoleon had set up, to help her recover her father''s estates. She had twice asked for the return of the estates confiscated from her father for the benefit of the Prussian generals Prince Hohenlohe, Bischoffswerder and Sanitz: Trąbczyn in the department of Kalisz, and Kamionna, Kolno, Pawłowo, Pawłówko and a storehouse at a place written "Włocławek" in the department of Poznań. She had had no answer. Knowing that Wybicki, a member of the commission, had had his estates, confiscated like hers, given back by the Emperor, she asked the commission to intercede for her and to give her the means of obtaining the same judgment. The commission noted that the petition was presented on 21 July.'
agad11740273-003: On 21 July 1807 at Dresden Michalina Dąbska, born Prusimska, daughter of the Starost Antoni Prusimski, petitioned Emperor Napoleon for the return of her father's confiscated estates. She had already had her complaints and hopes laid before him through the Polish government, but had so far heard nothing of a decree restoring her to the estates that were confiscated for the benefit of the Prussian generals Prince Hohenlohe, Bischoffswerder and Sanitz. She was persuaded that the same justice that restored Count Wybicki to his possessions would be done to her, and begged the Emperor not to refuse it. By Napoleon's order Prince Józef Poniatowski, the Governing Commission's Director of War, presented the petition to the commission at an extraordinary session at Dresden the same day; the commission's president, Małachowski, initialled the note.
agad11740273-004: On 23 July 1807 at Dresden Michalina Dąbska, born Prusimska, daughter of the Starost Antoni Prusimski, wrote again to the Governing Commission, the provisional Polish government Napoleon had set up. The Emperor's decree of 5 June, which gave back to Józef Wybicki the estates confiscated and disposed of by the Prussian government, had been taken as the principle and pattern for doing equal justice to the persons named in the commission's resolution of 21 July. She did not doubt that the commission would have its resolution carried out in the same way as for Wybicki, and asked it to direct the Directorate of Internal Affairs to order the administrative chambers to put her in possession of the estates. The commission noted the petition as presented the same day.
agad118501169-001: In 1834 the Council of State of the Kingdom of Poland considered whether to overturn a judgment by which the courts had struck from the mortgage register of the Trąbczyn estate a claim of 30,000 Reichsthaler held by Karol Weigel, a banker. Prussia had confiscated Trąbczyn in 1796 and given it to Prince Hohenlohe-Ingelfingen, who in 1800 borrowed the money against it from a Sieur Grotowski; Weigel bought the claim from Grotowski. In 1807 the Governing Commission, the provisional Polish government Napoleon had set up, returned the estate to Michalina Miączyńska, the daughter of its last Polish owner, Antoni Prusimski. When Weigel sued her for the interest, the Kalisz tribunal struck the claim from the mortgage register, holding that the decree of 1807 returning Trąbczyn to her had restored it free of such encumbrances; the Court of Appeal set that judgment aside in 1820, because the Prince, who had borrowed the money, had not been summoned, but in 1826 the Supreme Tribunal confirmed it. In 1830 the government's Commission of Finances asked the Council of State to overturn the judgment as beyond the courts' powers. The Council's Commission of Instruction, which prepared its decisions, answered in a report signed by its president, Faltz, that the finance commission showed at most that the courts judged wrongly, not that they had no right to judge; what it wanted was a further appeal, and the Council of State is no court. It advised that the demand be rejected.
agad14320139-001: In his annual report for 1882 to the General Superintendent of the Warsaw Evangelical-Augsburg (Lutheran) consistorial district, Pastor E. Erdmann describes the parish of Zagórów. The congregation has a brick-built church that still lacks a baptismal font, organ and bells; the pastor's house and the cantor's house are very small and low, and the schoolroom is spacious in proportion to the number of children. Besides the religion school at Zagórów there are 7 more schools with prayer houses, one of them an elementary school at Michalinowo; the 8 schools have about 240 children, the sexton (reading uncertain) has no dwelling of his own, and the congregation has 8 cemeteries, in good condition and provided with crosses. Church life is satisfactory. 726 men and 871 women, 1,597 in all, took communion. The collection for the heathen mission, 10 roubles 71 kopecks, was passed on to Superintendent Pastor Manitius at Warsaw. There are no Baptists, Irvingians or other sects, no special vices (reading uncertain) occur in the congregation, no one converted to another confession and nothing remarkable happened; 67 were confirmed (36 boys and 31 girls), and no candidates live in the congregation. Nothing was collected for the congregation's own benefit; for other purposes 4 roubles 61 kopecks (the figure is uncertain) was collected for grammar-school pupils intending to study theology, which the pastor-administrator sent to the High Consistory at Warsaw, and 2 roubles 36 kopecks for the widows' and orphans' fund, sent to Superintendent von Boerner.
agad14320139-002: In his annual report for 1882 on the filial congregation of Lissewo-Pyzdry, in nearly the same words as his report on the parish of Zagórów, Pastor E. Erdmann tells the General Superintendent of the Warsaw Evangelical-Augsburg (Lutheran) consistorial district that the filial has neither a church nor a sexton's house, and that divine service at Pyzdry is held in a rented room. It has five schools combined with prayer houses, all in good condition, with about 120 children, and five cemeteries, all fenced and provided with crosses. Church life is satisfactory. The baptisms are performed by the cantors in the prayer houses. 326 men and 408 women, 734 in all, took communion, 131 more than in 1881. The Evangelicals of Pyzdry would gladly set up a school of their own but are too poor for it, the town counting only 9 families (reading uncertain); the colonies have their own teachers and prayer houses. The mission collection, 3 roubles 40 kopecks, was passed on to Superintendent Pastor Manitius at Warsaw. There are no Baptists, Irvingians and the like, no special vices occur in the congregation, no one converted to another confession and nothing remarkable happened; 23 were confirmed (13 boys and 10 girls), and no candidates live in the congregation. Nothing was collected for the congregation's own benefit; for other purposes 1 rouble 76 kopecks was collected for pupils intending to study theology, sent to the High Evangelical-Augsburg Consistory at Warsaw, and for the widows' and orphans' fund a sum of 36 kopecks and some roubles, sent to Superintendent von Boerner at Plock.
apl399801333-001: 'Between 1864 and 1870, after the emancipation of the peasants of Russian Poland, the liquidation of the Trąbczyn estate, which fixed what land each peasant household would own, produced a file of 145 papers: petitions of the estate''s agent Grodziecki, of the peasants of Trąbczyn, Nowa Wieś and Marianton, of Count Włodzimierz Miączyński, the estate''s owner, and of the colonists of Łazińsk; resolutions of the commissioner of the district, most of May 1865; letters to the military chiefs of Konin and Kalisz and to the central commission at Warsaw; orders of that commission of 1867 to 1869; and reports of the commissioners. Among them are a plan of the village of Trąbczyn and the liquidation table Count Miączyński submitted in November 1865.'
apl399801333-002: The plan of the village of Trąbczyn, in the Konin district of the Warsaw governorate, drawn on 15 May 1865 among the papers of the liquidation of the Trąbczyn estate, shows the gardens and buildings of the peasants and of the manor.
apl399801333-003: 'On 10/22 August 1865 Count Włodzimierz Miączyński, the owner of the Trąbczyn estate, petitioned the Kalisz Commission for Peasant Affairs against the decision of the Commissioner of the 5th District of 13/25 May 1865, which ordered six farmsteads in Nowa Wieś (nos. 2, 4, 5, 6, 9 and 10 in the table of dues of 1846, 5 Morgen each) to be returned with their crops and buildings to the last holders or their successors; he asked that the farmsteads be left as the estate''s property. His case: in 1846 there were eight peasant farmsteads in Nowa Wieś, farmed until 1856; because their land lay too low and could not be tilled in wet years, the peasants themselves asked to be moved, and he marked out land elsewhere and put up buildings; even before that, six farmers had left their farmsteads of their own will and gone into service. Under article 2 of the Ukase of 1846 he had to find new peasants; they received farmsteads from the folwark land and have already been enfranchised there; the old land was added to the folwark, under crop rotation, and the buildings given to the manor servants. The exchange stands in the supplementary table of 1846, confirmed by the district chief and the Commission of Internal Affairs; under articles 6 and 8 of the Ukase of 1864, which made the peasants owners of their land, those who left have no right. He names the witnesses Wawrzeniec Sowiński and Józef Czajka, says the peasants in all hold more land than falls to them by the table of dues, and that Nowa Wieś never had pasture in common with the manor.'
apl399801333-004: On 23 July 1865 Count Włodzimierz Miączyński, the owner of the Trąbczyn estate, petitioned the Commission for Peasant Affairs of the Kalisz district to annul the attached decision of Baron von Rosen, which granted Krystian Lippeldt of a neighbouring village a servitude of pasture for 2 horses and 7 head of horned cattle on the folwark Włodzimirów, at the places called "smugi", three hollows in a field on the boundary of Emilienhejm. On that folwark lies his only pasture for the young stock. Lippeldt grazed there only by his written leave, first until 1 November for money, then for labour; the field lay fallow. His contract of 1863 ended on 1 November, before the Ukase of 1864 that made the peasants owners of their land, and the new written agreement was made on 1 May 1864, after it; in the same year Lippeldt also made the attached contract, gave it up and returned the original in the presence of the former steward Swiderski. A temporary leave is no title, still less for a stranger; the Ukase favours the peasants of the village where they grew up, and by its articles requires the right to have been exercised at the time of the Ukase.
apl399801333-005: On 6/18 December 1867 the colonists of Łazińsk, in the commune of Trąbczyn, Słupca district, Kalisz governorate, petitioned the Constituent Committee in the Kingdom of Poland, the body carrying out the peasant reform; Daniel Hohm and Wilhelm Moritz signed with crosses in the name of the others. Earlier that year, as a postal receipt shows, they had asked the committee to recognise the servitudes the manor had granted them in former years – free pasture in the Trąbczyn forest, the raking of litter and the digging of stumps – but had had no decision. They ask that an impartial official be sent from the Słupca district office to examine their claims, and that the decision be sent to the chief of the Słupca district.
apl399801333-006: On 10/22 August 1868 the colonists of the Łazińsk colony, in the commune of Trąbczyn, petitioned the Constituent Committee at Warsaw, the body carrying out the peasant reform, for their old rights in the Trąbczyn forest; Ludwig Hintz and Krystyan Sehr signed in the name of all. Under the contract of purchase of the farmsteads with Prince Hohenlohe, the former owner of Trąbczyn, and his privilege of 1805, they say, they may graze their stock together with the manor's in the Studzienka forest section as far as the Bishop's boundary and rake litter every year, and they had 6 Morgen of clay land for a clay pit; Commissioner Baron Rosen recognised this and obliged the owner to produce the mortgage map of 1805 by 3/15 August. In 1838 the owner drew up a new table, divided the forest section into three, forbade grazing on two and made 11 clearings and young plantations on the third; he forbids the raking of litter and takes the clay pit for himself. At the visit of Commissioner Władimirow he brought forward false witnesses and gave each 12 roubles; the witnesses to this are Marcin Rywarski and Libner, a joiner, of Trąbczyn, and Tomasz Janicki, a witness of the owner's, declared it himself. In 1867 they turned three times to the President of the Kalisz Commission (6/18 June, 30 June/12 July, 3/15 September) and in October to the Committee, with a copy of the privilege; the answer of 31 January 1868 referred them to the Kalisz Commission; no decision came, and the copy was not returned to them. They ask for an inquiry on the spot by an official from Warsaw, the return of the clay pit and the pasture, and the confirmation of their old right; if they fail to prove it, they will bear the costs.
apl399806603-001: Under the Ukases of 19 February (2 March) 1864, which made the peasants of the Kingdom of Poland owners of the land they farmed, 91 farmsteads of the Łazińsk colony ("Колонія Лазинская"), in the commune of Trąbczyn, circuit of Pyzdry, Słupca district, governorate of Kalisz, passed into the full ownership of the peasants. The colony also had the farmstead of the village school, the common cemetery, a plot of common land, the village head's plot, a farmstead of one Morgen and the land under the roads. Together they come to 1,691 Morgen 219 rods, of which 9 Morgen 224 rods are unusable; the dues the government compensates the former owner for amount to 603 roubles 34⅕ kopecks a year. On 8 February 1868 the Central Commission for Peasant Affairs attached to the Constituent Committee confirmed the list, after examining and correcting it, and fixed at 10,055 roubles 70 kopecks the capital the former owner of the village was to receive in compensation.
apl399806603-002: 'In a copy of the liquidation table of the Łazińsk colony, made at the Kalisz Commission for Peasant Affairs under article 56 of the Ukase of 19 February (2 March) 1864 to be kept at the Governorate Government, Kalisz, on 10 September 1869, the entries, extents and totals are the same as in the table, in another hand and spelling; at no. 65 it has 36 Morgen 234 rods, the table 254, and at no. 48 only "Мурицъ". The servitudes the colonists kept stand beside the first entries: all the peasants of the Łazińsk Hollanders may graze all the cattle they have in the forest "Studzianka" and gather there twice a week fallen and lying wood and dry branches and carry it away in cloths; they have no other rights to servitudes. The confirmation of 8 February 1868, with the compensation capital of 10,055 roubles 70 kopecks, is copied too.'
apl399806603-003: In March 1884 the Kalisz Governorate Government certified, under articles 1302 and 2800 of the resolutions of the Constituent Committee and the resolution of the Kalisz Governorate Board for Peasant Affairs of 25 February 1882, that the peasants of the Łazińsk colony who have the right to the servitude of fuel may receive from the manor forest "Studzianka" 104 cloth-loads a year for each farmstead, equal to 10½ ordinary two-horse peasant carts. It also certified that the same farmsteads may graze 408 head of horned cattle in the same tract.
apl399806603-004: 'By a voluntary transaction of 14 June 1892, made under a resolution of the Łazińsk village assembly of the same day (no. 4) and confirmed by the Kalisz Governorate Board for Peasant Affairs on 29 April 1894, the peasants of the Łazińsk colony gave up once and for all, for farmsteads nos. 1 to 91 and 96, in favour of the owner of the Trąbczyn estate, Countess Maria Wielopolska, the servitude of pasture in the forest "Studzianka" and the gathering of lying wood and dry branches there. In return they received usable manor land into full ownership: 84 farmsteads 4 Morgen each, seven farmsteads 6 Morgen each and no. 47 5 Morgen, together 383 Morgen. Besides they received 10 Morgen 154 rods of unusable land under roads and boundaries, in all 393 Morgen 154 rods, within the boundaries described in the record of the commissioner of the Słupca district of 27 and 28 June 1893. The Board entered the transaction in the liquidation table by its resolution of 12 October 1894.'
apl399806603-005: After a survey by a surveyor in 1896, the Kalisz Governorate Board for Peasant Affairs resolved on 29 November 1897 that the whole peasant allotment of the Łazińsk colony, with the land the peasants received for giving up their forest and pasture servitudes under the transaction of 14 June 1892, is 1,068 desiatins 1,272 sazhens, of which 1,034 desiatins 2,102 sazhens usable and 33 desiatins 1,570 sazhens unusable. The extent of each kind of land in each farmstead stands in the columns of the liquidation table, the former figures, which proved wrong, having been removed.
apl399806603-006: 'After the survey of 1896, the peasant allotment of the colony "Łazińskie Olędry" in the Słupca district was entered in the liquidation table, for entries 1 to 96: the land under buildings and gardens, arable, meadow, pasture, unusable and in all, in desiatins and sazhens. The entries are 91 farmsteads, some under another name than in 1868 (no. 77, for one), the school, the cemetery, the common land, the village head''s plot and one more farmstead; and besides 12 desiatins 741 sazhens of unusable land. The total is 1,068 desiatins 1,272 sazhens, the figure of the resolution of 1897. In four rows the parts do not add up to the row''s total.'
app5314550221-001: 'In 1399 at Ląd, on the Sunday within the octave of Corpus Christi (1 June), Mikołaj, heir of Venacia and general judge of the land of Kalisz, had his estate of Makownica marked out by boundary mounds (kopce) with a court summoner, by the custom of the land. He had earlier resigned the estate to the Cistercian monastery of Ląd before King Władysław, who had confirmed it by letters patent. The line runs from the boundaries of the village of Malenin to those of the heritage of Ruchocin. Half of the thicket of Kobielnica is to belong to Makownica for ever. As his last will he adds that after his death the monastery and its convent are to have all his goods in Makownica: bees, cattle, sheep, mares and all things movable and immovable. The witnesses are the parish priest Jakusz, the castellan of Czarnków, the burgrave of Pyzdry and others. The charter is known from an eighteenth-century copy.'
app5314550221-002: At Pyzdry on 21 September 1461 (the Monday after the Exaltation of the Holy Cross) Piotr of Szamotuły, castellan of Poznań and general captain of Greater Poland, attested that the undivided brothers Jan Wochneth, parish priest at Koscielec, Mikołaj Wochneth of Bartodzieje and a third brother of Osiecza, together with their nephews Marcin, Jan and Maciej Bochneth, had resigned for ever to Abbot Cornelius, Prior Jan, Wolmar, rector of the parish church at Ląd, and the whole convent of the Cistercian abbey of Ląd, with King Kazimierz's consent, three whole mansi with gardens in the village and heritage of Łukom in the district of Konin, in the parish of Zagórów, with the forest of Grądzyń and its woods. They also resigned the forests of Chmielniki and Lome as far as the road called Rosiszewska, which runs from Łukom and the village of Lomowo to the hill of Karczemne gory, the marshes of Karczemne Lugi and a field above Imielno, all with all rights and profits, reserving nothing to themselves. The price is 400 marks of broad groschen, 48 groschen to the mark. Among the witnesses is Jan Sobocki, burgrave of Poznań. A note in the margin of the copy adds "and with the forest of Lomy, from the boundaries".
app5314550221-003: 'At Gniezno on the Tuesday before the feast of St Lawrence (8 August 1447) King Kazimierz of Poland confirmed the purchase by which Abbot Maciej of Ląd had acquired from the brothers Mikołaj, Jan and Warsz of Koscielec, heirs, and their stepson three mansi of fields in the village of Łukomia in the district of Konin and the forest of Grądzyń, with further forests, meadows, fields, heaths, fishponds, beehives and waters. The sellers reserved no right in them. The abbot asked for the king''s consent, and the king consents and confirms the contract for ever: to buy heavenly things for earthly ones and to increase divine worship in the monastery, but above all because the monastery lacks forests elsewhere with which it might be restored, and so that it may be better provided when he visits. Among the witnesses are Bishop Andrzej, Łukasz of Górka, voivode of Poznań, and Przedbor of Koniecpol, castellan of Sandomierz; the charter was given by the chancellor, Jan of Koniecpol. The year is written over in the copy and read as 1447, as a later hand noted in the margin; the witnesses held their offices in that year. The copy is cut off below its end.'
app5314550221-004: 'At Pyzdry on 18 January 1362 (the Tuesday after the octave of the Epiphany), with the counsel of his barons, King Kazimierz of Poland made an exchange with Abbot Jan and the Cistercian convent of Ląd: the monastery gave the king and the kingdom its heritage of Little Wronczyn near the town of Pyzdry and its mill below the castle of Pyzdry. In return the king gave the monastery for ever a part of his forest called Czirnetz, in the district of Konin, fit for clearing and sixty Franconian mansi in size, measured by his messengers and bounded by boundary mounds (kopce). The monastery may found there as many villages as it wishes, under Polish or German law, and they are to be as free of all royal payments as the monastery''s other estates. What it leaves as forest is its own with all profits; only the hunting of deer and boar the king keeps for himself. The village of Drzewce was later founded in this forest, as the copyist''s heading says. Among the witnesses are Albert, voivode of Brześć, Wyrzbięta, castellan of Poznań, and Florian, chancellor of Łęczyca.'
app5314550221-005: 'King Kazimierz of Poland granted the settlers in the forest of Czernetz in the land of Kalisz, which he had given in exchange to the abbot and convent of Ląd and in which they were to have sixty mansi, twenty years of full freedom from the date of the charter. So that the mansi may be settled more easily, he releases all peasants who settle or have settled there from all levies and services, which he lists: sep, naraz, the pig, the cow, the sheep, powos and carting of every kind. The privilege survives only as a beginning: the copy breaks off in the sentence by which the king wills that no castellan or official ..., and the rest and the date are on a page the edition does not include.'
app5314550221-006: In 1761 arbitrators gave the Cistercian abbey of Ląd a piece of ground in the estate of Łukom, on the boundary of the abbey's village of Drzewce, and marked it out. The decree counts the boundary mounds, with their distances in rods, along the roads from Huta to Grądzyń, Rosiszewo and Lomowo, from Łukom to Lomowo and from Tomice to Zagórów and Łukom. At the parties' wish the arbitrators had two small hills towards Huta opened, which the abbey claimed as boundary mounds; nothing was found in them. On 10 April 1761 they went on to renew the mounds between Łukom, the town of Zagórów and Drzewce, with Zagórów's burgomaster Maciej Kwiecinski, its wójt Albert Rozewicz and its notary Antoni Zalewski present. The copy breaks off in the list of witnesses.
app53150kaliszgr414-001: 'On 4 November 1771 Wawrzyniec Wstowski, sworn commissioner of the provinces of Poznań and Kalisz, put Stanisław Ścibor Chełmski, owner of the Łukomia estate, into possession of the Lusnia wood, at his request, because Chełmski had won at law against his neighbour Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn. Wstowski recited the judgments on which the delivery rested: a condemnation of 1761, decrees of the Crown Tribunal of 1766, 1767 and 1768 under which the estates of Łukom and Trąbczyn were to be divided by a boundary, and a third condemnation of 1770 against Prusimski for contravention. In the presence of three noblemen, of the Trąbczyn steward Józef Jaroszewski and of a court messenger he handed over to Chełmski the pine forest and wood called Lusnia as belonging to Łukomia from of old, with the Olęder settlement founded in it not long before. It comprised a tavern house with a new stable, without a keeper, and twelve Olęder settlers, named one by one. No one objected; an inventory was drawn up, Chełmski was left in peaceful possession, and the settlers were ordered to obey him. The delivery was entered in the records of the municipal court at Kalisz on 9 November.'
app53150kaliszgr424-001: On 23 November 1776 the municipal court office at Kalisz certified that the boundary decree between the estates of the villages of Łukom, Trąbczyn and others had not been brought to it for entry. Antoni Leszczyc Mierzewski had asked whether the decree, given by the commissioners appointed by the Estates of the Commonwealth on the part of Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, had been brought in. The office went through its books of reports, in which such papers are received, from 17 October 1776 to that day and found no such decree.
app53150kaliszgr425-001: On 28 September 1776 five commissioners appointed by the Estates of the Commonwealth to judge the boundary cause between Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, and Stanisław Ścibor Chełmski, owner of Łukomia, declared that they could not end the cause by a final judgment at the term then due, because some of them had business at the parliament in Warsaw and others at the Crown Tribunal in Piotrków. The term went back to the adjournment in the decree of 13 September of the year before. They put the meeting off to the first Monday after Epiphany 1777 and kept for the parties the final term for appearing before the commission's court on the ground of Łukomia. The five were Stefan Leszczyc Zielonacki, deputy judge of the Kalisz land court, Maciej Leszczyc Mierzewski, Tomasz Radoński, boundary surveyor of Kalisz, Stanisław Jabłkowski and Stanisław Otto-Trąmpczyński. The adjournment was entered in the records of the municipal court at Kalisz on 30 September.
app53170koningr114-001: On Holy Saturday 1767, at the request of Antoni Prusimski of Kolno, owner of the Trąbczyn estate, the court messenger Bartłomiej Szepczyński of Trąbczyn went onto the estate with two noblemen, Stanisław Lipiński and Józef Rudkowski, and inspected an embankment lately raised at the end of the pond-ground, the bed of a former pond on the boundary with the neighbouring estate of Łukom. On 22 April 1767 he reported at Konin that because of the embankment the water that flows from the pond-ground through the Trąbczyn lands backed up and flooded the Olęder settlers living in the Trąbczyn woods, with their manured fields and their meadows. He stated that people of Łukom had done this on the order of the estate's owner.
app53170koningr114-002: On the Friday after Saint James 1767 the court messenger Bartłomiej Szepczyński of Trąbczyn went onto the Trąbczyn estate again, at the request of its owner Antoni Prusimski of Kolno, with two noblemen, Józef Gołembiewski and Rudkowski, and inspected the embankment on the pond-ground that had flooded Trąbczyn's Olęder settlers in April. In his report of 6 August 1767 he stated that the embankment is raised in the wood on the pond-ground, by the boundary of the Łukom lands, on Trąbczyn ground; the water dammed in the pond spills onto the fields and meadows of the Trąbczyn Olęder settlers, so that the meadows of four of them are flooded and cannot be mown. He declared with the two noblemen that the embankment was raised some years ago by the owners of the neighbouring estate of Łukomia and has now been repaired.
app53170koningr115-001: In January 1768 Stanisław Chełmski, owner of the Łukomia estate, obtained a summons before the Kalisz land court against Antoni Prusimski, owner of the neighbouring Trąbczyn estate, and the successors of the late Katarzyna Prusimska, born Rozdrażewska; the report of the summons was among the documents produced at the municipal court at Konin.
app53170koningr115-002: On 17 May 1768 Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, had the Chełmskis, the Żychliński heirs, Ignacy Gałecki, Starost of Bydgoszcz, and the abbot and convent of Ląd summoned before the Crown Tribunal at Bydgoszcz, the kingdom's highest court, for the fixing of the boundary. Stanisław Chełmski, owner of the neighbouring Łukomia, for his part had the abbot Słowiecki and the convent of Ląd, Prusimski and Gałecki summoned.
app53170koningr115-003: In May 1768 Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, brought to the municipal court at Konin an authentic extract from the records of the municipal court at Bydgoszcz. It contains the approval he declared there of the date for having a condemnation, a judgment given against him by default, quashed.
app53170koningr115-004: On 2 December 1771 Stanisław Ścibor Chełmski, owner of the Łukomia estate, had the delivery of possession of the Lusnia wood with its Olęder settlers, made to him in November, brought in at the municipal court at Konin; it was among the documents produced.
app53170koningr115-005: 'On 20 December 1771 the court messenger Nicolaus Krzepczyński of Myszaków, specially commissioned by Stanisław Ścibor Chełmski, owner of Łukomia, laid weapons before the municipal court office at Konin: four sabres in sheaths with belts and one unsheathed, four spears with iron points, three long guns and one gun mounted with brass, loaded with lead and fine powder. He stated that Chełmski had taken them on the Monday before in the Lusnia wood, the disputed wood of which he had been given possession that year, when Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, broke in there by force and armed men besieged the innkeeper''s house. The messenger took the weapons back.'
app53170koningr115-006: On 20 December 1771 the court messenger Nicolaus Krzepczyński reported, for Stanisław Ścibor Chełmski, owner of Łukomia, what he had seen on the Monday before with two noblemen, Antoni Wolski and Konstanty Folwarski, on the ground of Łukomia and in the Lusnia wood, a wood disputed with the neighbouring estate of Trąbczyn. At the pond-ground in the Łukom wood they saw the embankment dug through, the weir with its posts, sluices and channels hacked with axes and wholly removed, with fourteen pogrodki hewn with axes among them, and the water let out with the fish; twenty thick clubs, freshly cut and made ready for battle, lay there. In the tavern house among the Olęder settlers in the Lusnia wood eight loopholes had been cut in the walls all round and three windows shot out. He stated that the breaking of the embankment was done by more than thirty subjects of Trąbczyn in the presence of Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, and the shooting through of the house by his men at his order, on the same day.
app53170koningr115-007: 'On 1 December 1772 the court messenger Joannes Bikierski of Węgierce reported, for Stanisław Ścibor Chełmski, owner of Łukom, Łomowo and Myszakowo and possessor of the Olęder settlers in the Lusnia wood, what he had found with two noblemen on the Saturday before: three windows and four doors with iron hinges had been taken out of the tavern in Lusnia. He stated that this was done that night by the Trąbczyn steward Lipiński, the clerk Radzewski, the bailiff and forest keeper and the manor servant Wąchnicki, at the order of Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, and that the pieces were carried off to Trąbczyn, with a table and a barrel of beer, by a band of Trąbczyn subjects.'
app53170koningr115-008: 'On 26 February 1773 the court messenger Bartłomiej Szepczyński of Trąbczyn reported, for Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, what he had inspected and counted with two noblemen the day before in the woods and meadows of Trąbczyn: in the wood beyond the Lusnia grove fifty-one stumps of felled pines fit for building, and on the meadows called Kąty thirty-two alder stumps. He stated that the subjects of Stanisław Chełmski, owner of the neighbouring Łukomia, had carted the timber out of the wood, and that men of the Podbiele estate of the lady Zakrzewska had cut the alders on the meadows.'
app53170koningr115-009: In March 1773 Stanisław Ścibor Chełmski, owner of Łukom and possessor of the Olęder settlers of Lusnia, protested at Konin against Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, his household and his subjects, and signed the protest. Prusimski, although he knew that possession of the Lusnia settlers had been adjudged to Chełmski at law, let his steward Lipiński and his chamber servant Marzęcki, with others, ride upon the tavern and the settlers; they committed acts of violence there.
app53170koningr115-010: 'In March 1773 the court messenger Joannes Bikierski of Węgierki reported, for Stanisław Chełmski, owner of Łukom, what he had seen with two noblemen on the Wednesday before in the Olęder settlement of Lusnia: in the tavern the stove, three windows and four doors, which Chełmski had newly had put in order, were hacked and cut out, the chimney was ruined, and the vessels for beer and spirits were smashed. He stated that this was done by the noblemen Lipiński, Marzęcki and others, followers of Antoni Prusimski, Starost of Niszczewice and owner of the neighbouring Trąbczyn, in the night of 29 January of the current year.'
app53170koningr116-001: In August 1775 Antoni Prusimski, owner of the Trąbczyn estate, brought to the municipal court at Konin an extract of the constitution by which the Estates of the Republic ordered a commission to the ground of Trąbczyn, to mark that estate off from the neighbouring Łukom. The extract was drawn from the records of the royal court at Warsaw and was among the documents produced.
app53170koningr116-002: On 16 August 1775, as the boundary commission between Trąbczyn and Łukom was about to open, three notes were entered at Konin. For Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, the letters of notice for the commission appointed to the ground of Trąbczyn were brought in, handed in by the first of those who signed them. Also noted were the report of the citations that Prusimski had served on the heirs and possessors of Łukom, Podbiele and Szetlew and on the abbot and convent of Ląd, and the report of the citations that Stanisław Chełmski, owner of Łukom, had served on the heirs of Trąbczyn, Drzewce and Biskupice for the term of the commission.
app53170koningr116-003: 'In September 1775 five commissioners of the field commission appointed to settle the boundary between Trąbczyn and Łukom appeared in person at Konin: Ludwik Dąmbski, voivode of Brześć Kujawski, Brzeziński, Starost of Inowrocław, Dąmbski, standard-bearer of Brześć Kujawski, Kwilecki and Umiński. They protested against Stanisław Chełmski, owner of Łukom, and the commissioners brought in on his side, for an act that these made unilaterally on the disputed ground of Łukom and Trąbczyn. All five signed in their own hands, Ludwik Dąmbski as commissioner and president.'
app53170koningr116-004: In September 1775 Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, appeared in person at Konin and protested against the Gliszczyńskis of Tomice, Stanisław Chełmski of Łukomia and others, for the entangling of the boundary proceedings in the field and for other circumstances. He handed in the protest in the original and signed it.
app53170koningr116-005: In September 1775 Piotr Rajewicz appeared in person at Konin and declared, as a precaution, that he in no way took part in the boundary proceedings conducted between Łukom and Trąbczyn. He signed.
app53170koningr116-006: On 3 October 1775 an inspection of the boundary line between Trąbczyn and the neighbouring Łukom was entered at Konin for the owner of Trąbczyn, Antoni Prusimski; the entry itself was never written.
app53170koningr116-007: On 9 October 1775 Stanisław Ścibor Chełmski, owner of the Łukomia lands, appeared in person at Konin and protested in his turn against Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, and against the act of the boundary commission between Trąbczyn and Łukom. He signed.
app53170koningr116-008: 'On 16 February 1776 Antoni Lipiński and Nicolaus Ostrowski came to the municipal court office at Konin with the court messenger Bartłomiej Szepczyński of Trąbczyn. In the name of Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, they asked to be given a commission decree pronounced under the new constitution on the disputed ground of Trąbczyn and Łukom in default of Prusimski, which was claimed to have been brought in to the office for entry. The office looked through its register: the decree had not been brought in up to that day; it could not give it out and certified the search. Both men signed.'
app53170koningr116-009: On 1 July 1776 Stanisław Ścibor Chełmski, owner of Łukom, had a search entered at Konin for the commission decree given at Trąbczyn and Łukom; the search was never carried out.
app53170koningr116-010: On 5 September 1776 Stanisław Ścibor Chełmski, owner of Łukom, had a search entered at Konin for the mandate and the field decree given between the estates of Łukom and Trąbczyn. The entry was never written, and Chełmski signed the empty space on the following page.
app53170koningr116-011: 'An undated protest of Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, against Stanisław Chełmski, owner of Łukom, probably of 1777, was never carried out: the clerk notes that the information for it was not supplied and that, at the party''s request and three days having passed, it "is limited". Prusimski signed.'
app53170koningr116-012: Probably in October 1777 Stanisław Ścibor Chełmski, owner of Łukom, appeared in person before the municipal court office at Konin and asked to be given a field commission decree pronounced between the owners of the villages of Nowa Wieś, Łazy, Osiny, Trąbczyn, Łukom and others. It was pronounced under the commission granted by the Estates in the constitution of 1775 and signed by the commissioners on the side of Antoni Prusimski, owner of Trąbczyn. The office did not find it in its records, could not give it out, and certified the search. Chełmski signed.
app53170koningr117-001: On 7 March 1778 the court messenger Jan Jankowski of Łukom reported that he had served a royal citation on Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, at the instance of Stanisław Ścibor Chełmski, owner of Łukom, as plaintiff. Prusimski was to appear at the sitting of the Kalisz land court on the ground of Trąbczyn (condescensio) that the court at Konin had ordered by its decree of the Monday after St Hedwig of the year before, fixed for the Monday after Invocavit Sunday. He was to produce there his subjects Albert Livoy, Andrzej Rataj, Kazimierz the keeper and Albert the shepherd of Nowa Wieś. The citation is dated at Konin on the Monday after St Matthias 1778; the messenger left it on the table in the estate office at Trąbczyn.
app53170koningr117-002: 'On 30 March 1778 the court messengers Bartłomiej Szepczyński of Trąbczyn and Mateusz Matuszkiewicz of Szetlewek reported that they had served two copies of a royal citation before the Crown Tribunal at Piotrków, the kingdom''s highest court, dated at Piotrków on the Saturday after Reminiscere Sunday 1778, at the instance of Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn. Cited were Stanisław Chełmski, owner of the neighbouring Łukomia, and the officers of the Kalisz land court: the judge Franciszek Wierusz Walknowski, the sub-judge Stefan Zielonacki and the notary Xawery Mikorski. The land court''s decree of 20 October of the year before, said to contradict its earlier one, is to be lifted and the cause sent to the Tribunal; Prusimski asks to be freed from the claim that Chełmski bought from the townsman Jan Tracholz. One copy was left at Konin in the house of the townsman Palszewicz, the other at the manor of Łukom.'
app53170koningr117-003: 'In March 1778 Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, protested at Konin, in a signed protest, against Stanisław Chełmski, owner of Łukom, and against the judges of the Kalisz land court. Chełmski, he says, has acquired from the townsman Jan Tracholz an unlawful claim arising from a contract for oak timber made in 1744 with Prusimski''s late uncle Paweł Prusimski, and now pursues it against him. He lacks the papers he needs: they are with the heirs of his uncle''s widow, and he has sued for them but not yet received them. The land court had earlier sent the cause with Tracholz to a sitting on the ground with those heirs; yet at Chełmski''s instance a contrary decree was given, ordering a sitting on the ground of Trąbczyn. Prusimski declares that decree, given at Konin on 20 October of the year before, null, and protests against the transfer of the claim to Chełmski.'
app53170koningr117-004: 'In April 1778 Stanisław Ścibor Chełmski, Treasurer of Wschowa and owner of Łukomia, Łomów, Imielno and Bukowo, protested at Konin, in a signed protest, in his boundary dispute with Antoni Prusimski, owner of Trąbczyn. He relies on the field decree that the commissioners brought in on his side gave in 1775 between Łukom and Trąbczyn: resting on documents and in particular on the inspection of 1592, confirmed by oath at the last boundary mound with neighbouring witnesses, and brought in good time to the records of its own province. Against it, he says, the act that the commissioners engaged by Prusimski drew up later, after the boundary had been drawn and the mounds raised, privately and with the greatest favour, is unlawful. Prusimski neither brought it to the records of his own province nor carried out what it prescribed, and so himself treated it as invalid. So that his silence should not pass for acceptance, Chełmski declares it invalid and announces that he will seek to have it quashed.'
app53170koningr117-005: 'In April 1778 Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, protested again at Konin, in a signed protest; its heading names as his opponent one Sokołowski, whom the text does not mention. Chełmski takes up his earlier protests: the boundary decree between his Łukom and Antoni Prusimski''s Trąbczyn was given by the commissioners brought in on his side, following the inspection of 1592 and two decrees of the Crown Tribunal of 1766 and 1768, and the boundary mounds were raised. Prusimski''s commissioners knew of this and nonetheless abused their power: they left to Albert Czarnecki, boundary chamberlain of Kalisz, whom Prusimski had engaged, the inspection of the boundary line, the raising of the mounds and the taking of the oath. Czarnecki had the decree written only some weeks after the commissioners had left. Prusimski offered oath against oath and took as fellow-swearers a neighbour who was himself cited, a man in Czarnecki''s service who had never been in those parts, and other persons of no account. Chełmski accuses Prusimski of all this and offers to prove it by an inquiry of witnesses.'
app53170koningr117-006: 'On Saturday 21 February 1778 the court messenger Bartłomiej Szepczyński of Trąbczyn, with two noblemen, Piotr Gostarski and Tomasz Jachimowicz, was at the boundary of Trąbczyn, and reported in April, for Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, what he saw there: a pine several decades old, standing on the boundary mound that divides Trąbczyn from Biskupie and marked with three crosses as boundary signs, had been cut down and carried off, by his account at night by Mr Bogusławski, heir of a part of Kurów.'
app53170koningr117-007: On 15 April 1778 Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, protested, in a signed protest, against Stanisław Chełmski, owner of Łukom, and against Stefan Zielonacki, sub-judge of the Kalisz land court, in respect both of the full land court and of the sitting on the ground of Trąbczyn. Prusimski refers to his protest and his citation against the land court's decree of 20 October of the year before. His suit for the surrender of the papers, against the heirs of the widow of his uncle Paweł Prusimski, is pending before the Crown Tribunal; without those papers the claim that Chełmski bought from Jan Tracholz cannot be judged. The sub-judge, at Chełmski's instance, sent the cause to the full land court although that court stands cited before the Tribunal, and so caused Prusimski useless costs; Prusimski declares that remission null.
app53170koningr117-008: On 15 April 1778 the court messenger Bartłomiej Szepczyński of Trąbczyn reported that he had served three copies of a royal citation before the Crown Tribunal at Piotrków, dated at Piotrków on the Monday after Laetare Sunday 1778, on Stanisław Chełmski, owner of Łukom, on the judge Franciszek Wierusz Walknowski, on the sub-judge Stefan Zielonacki, who was also judge at the sitting on the ground, and on the notary Xawery Mikorski. At the instance of Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, the suit over the claim Chełmski bought from Jan Tracholz is to be sent to the Tribunal and the decree of 20 October of the year before lifted; it cannot be decided, Prusimski says, without the papers he is claiming back from the heirs of his uncle's widow, Katarzyna Prusimska, born Rozdrażewska. If the papers show the claim of Tracholz and Chełmski to be unlawful, the transfer is to be quashed; if they show instead a debt of Tracholz to the uncle, Chełmski is to pay it with interest. The copies were left at Trąbczyn, at Konin in the house of the townsman Paulszewicz, where the chancery of the land court keeps its records, and at the manor of Łukom.
app53170koningr117-009: On 25 April 1778 the court messenger Jan Jankowski of Łukom reported at Konin that he had served on Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, a royal citation before the Kalisz land court at Konin, dated at Kalisz on Good Friday 1778, at the instance of Stanisław Chełmski, owner of Łukomia. Prusimski is to hear the decree by which the court of the sitting on the ground at Trąbczyn sent the cause to the full court; Chełmski asks that the sum made over to him by Jan Tracholz be adjudged to him with interest and costs. The messenger left the citation in the estate office at Trąbczyn in the presence of the steward.
app53170koningr117-010: In 1778 the decree by which the court of the sitting on the ground of Trąbczyn remitted the suit between Stanisław Chełmski, owner of Łukom, and Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, over the claim Chełmski bought from Jan Tracholz to the full Kalisz land court was brought in for entry at Konin.
app53170koningr117-011: 'On 29 January 1779 the court messenger Bartłomiej Szepczyński of Trąbczyn reported, for Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, that with two noblemen he had been in the pine woods of Trąbczyn on the 23rd of that month: on Trąbczyn''s own ground he counted twelve stumps of freshly felled pines, and more beyond and between the boundary mounds, cut by his account by subjects of the estate of Rzgów. He laid before the office twenty axes taken that day on the ground of Szetlewek from those subjects as they fled at night with the pines, took them back, and gave the office a quittance.'
app53170koningr117-012: On 1 May 1779 Marcin Nosalski, heir and possessor of Rzgów, protested at Konin in a signed protest, as a precaution, so that the testimony of Bartłomiej Szepczyński and Mateusz Wąchnicki in his cause with Antoni Prusimski, owner of Trąbczyn, before the Kalisz land court at Konin should not harm him. The two, he says, on the orders of Tomasz Joachimowicz, stopped his people on the public road as they were carting trees on sledges from the hereditary woods of Stanisław Chełmski, owner of Łukom, beat them, took them with the sledges to Trąbczyn and seized their axes by force. Nosalski protests against them as the authors of the violence, offers to prove it by an inquiry of witnesses, and means to have them shut out from giving testimony in this cause.
app53170koningr117-013: In 1779 a copy of the protest that Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, made against the Nosalskis was among the documents produced at Konin; Prusimski signed.
app53170koningr118-001: In 1780 Stefan Zielonacki, judge of the Kalisz land court, and Stanisław Chełmski, Treasurer of Wschowa and owner of Łukomia, obtained a citation before the Crown Tribunal against the Prusimskis and the Bogdańskis; the entry at Konin breaks off after the plaintiffs' names.
app53170koningr118-002: In 1781 Stefan Zielonacki, judge of the Kalisz land court, obtained a citation against Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, for the sitting on the ground of the estate of Grab; a copy of the report of it was among the documents produced at Konin.
app53170koningr118-003: In 1781 Antoni Ostroróg Prusimski, Starost of Niszczewice, knight of the Order of St Stanislaus, owner of Trąbczyn, Trąbczynek and Nowa Wieś, appeared in person at Konin and protested, as a precaution, against Stanisław Chełmski, Treasurer of Wschowa, owner of Łukomia and Łomów; a copy of the protest was among the documents produced. Prusimski signed.
app53170koningr118-004: In October 1781 Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, obtained a citation before the Crown Tribunal at Piotrków against Kazimierz Zakrzewski and his sons Nepomucen, Ignacy and Ludwik, who claimed a share of the estate of Prusimski's uncles, and against the Kalisz land court; the report of it was entered at Konin on 15 October 1781.
app53170koningr118-005: On 30 October 1781 the report was entered at Konin that the citation had been served which Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, obtained before the Crown Tribunal at Piotrków against Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn.
app53170koningr118-006: In 1781 Ignacy Gałecki, Starost of Bydgoszcz, and Michał Drogosław Skórzewski, sub-chamberlain of Poznań, the former and the present owner of Biskupice, an estate bordering Trąbczyn, obtained a citation before the Crown Tribunal at Piotrków against Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn; the report of it was entered at Konin.
app53170koningr118-007: In 1781 Stanisław Ścibor Chełmski, Treasurer of Wschowa and owner of Łukom, obtained a citation before the Crown Tribunal at Piotrków against Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn; the report of it was entered at Konin.
app53170koningr118-008: 'On 22 November 1781 Father Tesselin Malechowski, administrator of the Cistercian convent of Ląd, declared in Konin, in his own name and that of the whole convent, against the charge of Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, that it had colluded with Stanisław Chełmski, owner of Łukomia: in the boundary disputes with Łukomia and Trąbczyn, which touch the convent''s estate of Drzewce, the convent was led by no collusion or favour at the last commission. It acknowledged the point where the three grounds of Łukomia, Trąbczyn and Drzewce meet as Chełmski showed it, for the reasons given in the commission''s decree, and stands by that. The convent is ready to swear to it and will seek penalties for the charge. Malechowski signed.'
app53170koningr118-009: On 4 December 1781 the report was entered at Konin that the citation had been served which Stefan Zielonacki, judge of the Kalisz land court, and Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, obtained against Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, for the sitting on the ground of the estate of Grab.
app53170koningr118-010: In January 1782 the court messenger Simon Głabik of Drzewce reported at Konin that he had served on Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, a royal citation before the Crown Tribunal at Piotrków, dated at Piotrków on 4 January 1782, at the instance of Abbot Benedykt Lubstowski and the convent of Ląd, owners of Drzewce. The convent asks to be cleared of the charge of collusion with the owner of Łukomia and relies on Tribunal decrees and the inspection of 1592. The messenger left the citation at the manor of Trąbczyn.
app53170koningr118-011: On 18 March 1782 the decree of the sitting on the ground concerning the Olęder settlement that belongs to Trąbczyn, given between Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, and Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, was brought in for entry at Konin.
app53170koningr118-012: On 19 April 1782 the report was entered at Konin of the citation that Antoni Prusimski, Starost of Niszczewice, knight of the Order of St Stanislaus and owner of Trąbczyn, obtained before the Crown Tribunal at Piotrków against the Zakrzewskis, father and sons, who claimed a share of the estate of Prusimski's uncles, and against the Kalisz land court.
app53170koningr118-013: In 1782 Piotr Gosławski, as plenipotentiary of Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, protested at Konin, in a signed protest, against a decree of the Kalisz land court. Before the land court at Konin on 15 October of the year before, his principal laid down a certificate of Franciszek Ksawery Kęszycki, Marshal of the Crown Tribunal, of 13 October, and asked for a delay. The land court disregarded the certificate and admitted neither the delay nor the motion; the representative, without the papers, had to withdraw. Gosławski protests against the land court and the other party and announces that he will seek to have the decree and the condemnation obtained under it quashed.
app53170koningr118-014: 'In 1782 the court messenger Bartłomiej Wrzask of Sławsk reported at Konin, for Stanisław Ścibor Chełmski, Treasurer of Wschowa and owner of Łukom, that he had served a royal citation to the sitting on the ground of the estate of Grab, dated at Piotrków on 26 November 1781. Cited were Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, and the Bogdańskis, husband and wife: Ludwik, land chamberlain of Kalisz, and Teresa, born Rozdrażewska, heiress of Katarzyna Prusimska, born Rozdrażewska, the heiress of Grab. They are to appear on 3 June 1782 before the court of the sitting on the ground, which a decree of the Crown Tribunal ordered. Chełmski claims payment of the sum that the merchant Tracholz made over to him, with interest; four subjects from Nowa Wieś are to be produced as witnesses. The messenger left the citation at Trąbczyn on the Friday on the eve of the Immaculate Conception 1781.'
app53170koningr118-015: On 25 May 1782 Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, entered a protest at Konin against a decree of the Crown Tribunal; the text was never written. Piotr Gosławski, as plenipotentiary, who inquired about the space, and Chełmski signed beneath the heading.
app53170koningr118-016: On 1 June 1782 the report was entered at Konin of the citation that Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, obtained against Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, for the sitting on the ground at the estate of Grab; a copy was among the documents produced.
app53170koningr118-017: In June 1782 Jakub Pomian Górski, boundary chamberlain of the palatinate of Inowrocław, protested at Konin, in a signed protest, against Stanisław Ścibor Chełmski, Treasurer of Wschowa and owner of Łukom. Górski, engaged by Antoni Prusimski, owner of Trąbczyn, had come to the sitting on the ground between Trąbczyn Minus or Nowa Wieś and Łukom that the Crown Tribunal at Piotrków fixed by its decree of 23 January 1782 for the raising of boundary mounds. The Tribunal had decided the boundary cause from the map and ruled on two commission decrees that contradicted each other. When he set about carrying out the decree along the line the Tribunal had drawn on the map, Chełmski in person, with his followers, resisted, pushed away the man who was drawing the surveyor's chain, kicked the chain off the line, made threats, and declared that he would allow no further correction of the line. Górski broke off his proceedings in order to obtain military help from the War Department.
app53170koningr118-018: In June 1782 an inspection of a place on the hereditary ground of Trąbczyn, made for Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, by two noblemen and a court messenger, was brought in for entry at Konin; the noblemen signed it in their own hands.
app53170koningr118-019: On 15 June 1782 Stanisław Ścibor Chełmski, owner of Łukomia and Myszakowo, protested in a signed protest against Jakub Górski, boundary chamberlain of Inowrocław. Executive offices, he says, are to carry out the decrees of the Crown Tribunal, not to interpret them. At the sitting on the ground of Trąbczyn Górski went beyond the rule of the Tribunal's decree, departed from the field office of the land of Dobrzyń, and took upon himself to interpret the decree. He described Chełmski as though he had resisted, put off his proceedings without the parties' consent to an unnamed time, and sent his acts to the War Department of the Permanent Council for military help, instead of remitting the cause to the Tribunal. Chełmski declares Górski's act null. A note of 16 August adds that Piotr Gosławski, plenipotentiary of Antoni Prusimski, owner of Trąbczyn, inquired before witnesses about the space, for which no information and no copy had been supplied.
app53170koningr118-020: On 16 August 1782 Piotr Gosławski, plenipotentiary of Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, asked in the chancery at Konin, with two noblemen, whether the report of a citation served at Trąbczyn, which Stanisław Chełmski, owner of Łukom, is said to have obtained against Prusimski before the Crown Tribunal at Piotrków, had been declared before the office. The office certified that there was no such report and that none could be given out. Gosławski signed.
app53170koningr118-021: In 1782 the report was entered at Konin of the citation that Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, obtained before the Crown Tribunal at Piotrków against Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, and Jakub Górski, boundary chamberlain of Inowrocław.
app53170koningr118-022: In September 1782 the report was entered at Konin that the citation had been served which Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, obtained before the Crown Tribunal at Piotrków against Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, against Jan Alojzy Orłowski, chamberlain of the land of Dobrzyń, and against Abbot Benedykt Lubstowski and the whole convent of Ląd.
app53170koningr118-023: 'On 21 September 1782 the court messenger Bartłomiej Szepczyński of Trąbczyn reported that he had served three copies of a royal citation before the Crown Tribunal at Piotrków, dated at Piotrków on the Monday after St Bartholomew 1782. Cited are Kazimierz Zakrzewski, land judge of Brześć Kujawski, and his sons Nepomucen, Ignacy and Ludwik by his marriage with the late Marianna Prusimska; her sons of her first marriage, Paweł and Józef Tomicki; Franciszek Tworowicz and Elżbieta, wife of Jakub Taczanowski, children of the late Wiktoria Prusimska; and Kunegunda Kołaczkowska, daughter of the late Konstancja Prusimska and Jan Kowalski. Cited too are the officers of the Kalisz land court: the judge Stefan Leszczyc Zielonacki, the sub-judge Andrzej Bogdański, the notary Xawery Mikorski and the chamberlain Ignacy Rapacki. The plaintiff is Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn: son of the late Stefan Prusimski and Wiktoria Malczewska, grandson of Krzysztof Prusimski and Teresa Golińska, nephew of their sons Jan, Bogumił, Antoni and Paweł Prusimski and, after Antoni and Paweł died childless, their sole successor. He relies on a Tribunal decree of 1738, which denied the Kowalskis the succession to Jan and Bogumił Prusimski, and on its confirmation by a decree of 1760. He asks that the decrees of the land court be quashed, that he be freed from the claim to the succession of Antoni and Paweł Prusimski, and that perpetual silence be laid on those cited: daughters whom their father has dowered can claim nothing from their brothers. The copies were left at the manors of Zieleniec and Mostki and at Konin in the house of the townswoman Wiśniewska, where the chancery of the land court is.'
app53170koningr118-024: In September 1782 the report was entered at Konin of the citation that the Cistercian convent of Ląd obtained before the Crown Tribunal at Piotrków against Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn; a copy was among the documents produced.
app53170koningr118-025: In 1782 the court messenger Mateusz Matuszkiewicz of Szetlewek reported at Konin that he had served on Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, and on others a citation before the municipal court of Kalisz, at the instance of Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, for the penalties for acts of violence committed, with the seizing of people. He left it at the manor of Łukom in the presence of the man cited.
app53170koningr118-026: On 7 December 1782 the court messenger Bartłomiej Szepczyński of Trąbczyn reported, for Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, that with two noblemen, Adam Milewski and Jan Wilgiewicz, he had been in the pine wood of Trąbczyn on the 4th of that month. On the left of the line that was cut and staked under the decree of the Crown Tribunal and of the sitting on the ground he counted 221 felled building pines. By his account they were cut on 28 November 1782 by people from Łukomia, Łomów and other estates of Stanisław Chełmski and carried off to those estates, all but seven logs. He states that it was done at Chełmski's order.
app53170koningr118-027: On 7 December 1782 Leon Maszewski, steward of Trąbczyn, protested at Konin at the order of his lord Antoni Prusimski of Kolno, Starost of Niszczewice, who could not come before the books himself, against Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, his servant Jaroszewski and others; Maszewski signed in his lord's name. Chełmski knows from the decrees of the Crown Tribunal and of this year's sitting on the ground that the line from the corner of Trąbczyn, Łukom and Drzewce to the corner with Biskupice, drawn on the map by the Tribunal and cut and staked on the ground by the surveyor in Chełmski's own presence, divides Trąbczyn from Łukomia. Yet he sent his people from Łomów and Łukom, whom the protest names, with sledges, horses, oxen and axes into the pine wood on the left of the line, which belongs to Trąbczyn; they felled a great number of pines and took them to Łukomia. Chełmski's people also rode into Trąbczyn, attacked people of Trąbczyn on the road and committed other acts of violence.
app53170koningr118-028: In December 1782 the boundary decree of the sitting on the ground between the estates of Trąbczyn and Łukom, given between Antoni Prusimski, Starost of Niszczewice, Stanisław Chełmski, Treasurer of Wschowa, and others, with the description of the boundary mounds, was brought in for entry at Konin and was among the documents produced.
app53170koningr118-029: In December 1782 the handing over of Martin Hunt, an Olęder settler of Trąbczyn, to Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, carried out by Józef Łukaszewicz, commissioner of the palatinate of Greater Poland, was among the documents produced at Konin.
app53170koningr119-001: In March 1783 the court messenger Stanisław Stachowski of Łukomia reported at Konin that he had served a citation of the Starost General of Greater Poland, Kazimierz Raczyński, of 10 March 1783, before the municipal court of Kalisz, on Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, and on his steward Leon Maszewski, at the instance of Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, and of his steward Ignacy Jaroszewski. Maszewski is charged with breaking into the pine wood that the Crown Tribunal's line on the map left, with one Olęder settler, to the estate of Łukom, and with taking oxen, carts and axes from Chełmski's people, who were fetching only the wood they needed. Named men of Trąbczyn and Nowa Wieś are put under arrest by the citation; Prusimski too is to be punished if the acts of violence were done at his order. The messenger left the citation at the farm at Nowa Wieś.
app53170koningr119-002: In March 1783 the court messenger Jan Bekierski of Węgierce reported at Konin that he had served on Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, a citation of the Starost General of Greater Poland of 10 March 1783 before the municipal court of Kalisz, at the instance of Stanisław Chełmski, owner of Łukom, and of his steward Ignacy Jaroszewski. Prusimski is to be punished for an inroad with men and dogs into the estate of Łomowo, which belongs to Chełmski's principal estate of Łukom, and for acts of violence done there, and is to make good the damage. The messenger left the citation among the Olęder settlers of Trąbczyn, at the house of one Mathias, in the presence of his wife.
app53170koningr119-003: On 18 March 1783 the court messenger Stanisław Stachowski of Łukomia asked the office at Konin, in the name of Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, whether the reports of two citations that Antoni Prusimski, Starost of Niszczewice and owner of Trąbczyn, obtained against Chełmski before the municipal court of Kalisz and had taken to Łukomia had been declared before the office. The office looked through its register from 26 November 1782 to that day and found only one report, of 29 November, declared by the court messenger Matuszkiewicz of Podbiele; it certified that there were no others. Stachowski signed for himself and his master.
app53170koningr119-004: On 18 March 1783 the court messenger Bartłomiej Szepczyński of Trąbczyn reported at Konin that he had served a citation before the municipal court of Kalisz that Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, with Leon Maszewski, Franciszek Liberacki and others, obtained against Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, and others. He left it the day before at the manor of Łukom in the presence of the man cited.
app53170koningr119-005: On 22 May 1783 the court messenger Bartłomiej Szepczyński of Trąbczyn reported that he had served on Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, a citation of the Starost General Kazimierz Raczyński of 15 May 1783 before the municipal court of Kalisz, at the instance of Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn. It concerns a penalty of fourteen Polish marks paid into the chest of the Instigator of the Crown Tribunal at Piotrków; the process obtained against Prusimski on that account from the register of penalties is to be quashed and Prusimski declared free. The messenger left the citation at the manor of Łukom.
app53170koningr119-006: In May 1783 the court messenger Stanisław Stachowski of Łukomia reported at Konin that he had served a citation before the municipal court of Kalisz that Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom, and others obtained against Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, and others. He left it at the farm at Nowa Wieś.
app53170koningr119-007: 'In October 1783 Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, protested at Konin, in a signed protest, against Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom. Chełmski has cited him before the land court at Konin to produce men, some of them in his service and others not to be found with him, and to be punished for an act of violence said to have been done. Prusimski declares: if the act was done by those men, it was done without his knowledge and without his order; he can produce only two of those named in the citation, Gregory and Thomas; the arrest did not reach the others. He offers to clear himself by an examination of witnesses as well, and means to claim penalties for the groundless vexation.'
app53170koningr119-008: On 15 September 1784 Leon Maszewski, commissioner of the Trąbczyn estates, asked the office at Konin in the name of Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, whether the report of a citation before the Crown Tribunal at Piotrków, obtained by Stanisław Ścibor Chełmski, Treasurer of Wschowa and owner of Łukom, and taken to Trąbczyn on the Thursday after the Nativity of the Virgin of that year, had been declared before the office. The office looked through its register and certified that there was no such report. Maszewski signed in Prusimski's name.
app53170koningr120-001: 'On 14 March 1785 Andrzej Kinos, a subject from the village of Trąbczyn, showed the municipal court office at Konin his injuries: the right eye suffused with blood all round and swollen and livid beneath, the left eye suffused with blood and livid, the whole face swollen, the right shoulder swollen. He stated that Marcin Sarzyński inflicted them on him with fists and a stick on the Saturday before, barring his way on the public road in the village of Obory as he was going to the town of Pleszew.'
app53170koningr120-002: 'At the end of 1786 the court messenger Sebastian Biegański of Sławsk reported at Konin that he had served on Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, a royal citation before the Crown Tribunal at Piotrków, dated at Piotrków on 2 October 1786, at the instance of Stanisław Chełmski, Treasurer of Wschowa and owner of Łukom. Prusimski is to be bound under oath to produce a particular document said to have stayed with him: the contract made with the merchant Jan Tracholz for the sale of an oak wood, from which Chełmski''s claim comes. He is also to be punished for having had the cause sent from the court of the sitting on the ground to the full land court and from there to the Tribunal; the decrees of the Kalisz land court at Konin that fix the sitting on the ground are to be carried out. The messenger left the citation at the manor of Trąbczyn.'
app53170koningr121-001: 'On 9 June 1788 Ludwik Żurawski, in the service of Antoni Prusimski of Kolno, Starost of Niszczewice and owner of Trąbczyn, brought a team before the municipal court office at Konin: a cart with unshod front wheels and iron-shod rear wheels, two oxen, a cow and a chestnut mare. The team belonged to Marcin Gryndel, a peasant of Łomowo, an estate of Stanisław Chełmski, Treasurer of Wschowa, which belongs to his principal estate of Łukom. Gryndel had driven into the pine wood that belongs to Prusimski''s hereditary estate of Trąbczyn and was never in dispute, and was already carting home from it a felled tree fit for building; the Trąbczyn forest keeper stopped him in the wood. After showing the team, Żurawski left the animals and the cart at the chancery to be given back to Gryndel, who asked for them at once; a receipt for this was entered the same day.'
app53170koningr136-001: 'In July 1754 the Trąbczyn estate was inspected at the request of Katarzyna Prusimska, born Rozdrażewska, the widow of Paweł Prusimski, the King''s chamberlain and owner of Trąbczyn, who had died shortly before, and who held her dower and a life interest in all his estates. The court messenger Bartłomiej Szeptycki of Trąbczyn made the inspection on 9 July and reported it at the municipal court at Konin on 12 July 1754. The buildings of the manor farm at Trąbczyn were described one by one: the old manor house is past repair and a new one stands finished in the frame; then come the kitchen, four barns, the sheepfold, the granary, the stables and sties, the distillery and the malthouse with their gear. At Nowa Wieś there are fifteen Olęder settlers, and the sixteenth plot is empty. The people who owe labour in Trąbczyn, Osiny, Łazy and Nowa Wieś are counted as full farmers, half-farmers, cottagers and lodgers. Two noblemen, Kazimierz Świerczewski and Józef Puchalski, state over their signatures that in the pine woods of Trąbczyn, from Osiny to the Biskupice boundary and round Łazy, the better trees have been felled or picked out and only the leavings stand, and the same of the oaks, except where the Olęder settlers have taken the timber on their plots.'
app53170koningr145-001: In 1775 a boundary commission decided the boundary dispute, decades old, between Trąbczyn, the estate of Antoni Prusimski, Starost of Niszczewice, and Łukomia, the estate of the Chełmski brothers. It had been appointed by an act of parliament, recorded at Warsaw on 1 June 1774, and met on 13 September 1775, in the forest on the disputed ground, under Ludwik Dąmbski, voivode of Brześć Kujawski. A quarrel over which commissioner should hold the pen split the court; a settlement it proposed to the parties was not reached, and it went on sitting divided. Prusimski led the court along his boundary line, past roads, boundary mounds, blazed trees, woods and a pond-ground, and relied on documents and sworn examinations of witnesses. The court also examined Chełmski's line, found Prusimski's boundary line the better, had new boundary mounds raised between Trąbczyn and Łukomia and between Trąbczyn and Biskupice, and required Prusimski to swear to it on the last mound with six witnesses. Stanisław Chełmski, for his encroachments on Trąbczyn ground and for an armed raid on the inn on the highway, in which shots were fired into the house and it was set alight, was sentenced to two weeks in the tower at Konin and to penalties payable to Prusimski. He was sentenced besides to 8,000 Polish złoty for felled timber and other damage. The rest of the boundary with Biskupice was adjourned to 21 May 1776. Six commissioners signed, and with them Wojciech Czarnecki, the boundary surveyor of Kalisz, who raised the mounds. The decree was entered in the municipal court records at Brześć Kujawski on 23 September 1776 and copied from an extract into the court book of Konin.
app53170koningr153-001: 'In late 1782 the boundary between Trąbczyn, the estate of Antoni Prusimski, Starost of Niszczewice, and Łukom, the estate of Stanisław Chełmski, Treasurer of Wschowa, was marked on the ground under a judgment of the Crown Tribunal, the nobility''s court of appeal, at Piotrków. Franciszek Ksawery Jasiński, boundary chamberlain of the palatinate of Gniezno, opened his court on 28 November 1782 at the three corner mounds where Trąbczyn (Trąbczyn Minus or Nowa Wieś), Łukom and Drzewce meet, to carry out the Tribunal''s decree of 17 October 1782. That decree had also cited the boundary chamberlains Jakub Górski of Inowrocław and Alojzy Orłowski of the land of Dobrzyń, and Abbot Lubstowski and the convent of Ląd. The commission appointed by the Estates had decided the boundary cause by two decrees that contradicted each other and were given in default; under the law of 1776 both parties came before the Tribunal, which gave its final decree on 23 January 1782. That decree fixed the corner of Trąbczyn and Łukom with Drzewce and the end point with Biskupice as the map shows them, confirming on that point the decree of the commissioners engaged by Prusimski, and drew a straight line between them on the map, signed by the Tribunal''s President and Marshal. The Olęder settlers whom Chełmski had taken into possession were to be given back to Prusimski, all but one, Martin Hunt, who was left to Chełmski; this was done on 6 March and entered at Konin on 18 March. On 27 May the sworn surveyor drew the line on the ground. But Hunt did not lie on the right-hand side of the line, the side adjudged to Chełmski, and the two boundary chamberlains disagreed: Orłowski, whom Chełmski had engaged, sent the cause back to the Tribunal, and Górski, whom Prusimski had engaged, meant to correct the line so that the site of an Olęder holding burnt down four years before should stay on the right, which Chełmski refused. The Tribunal ruled that a sworn surveyor has to measure only boundary lines and boundary signs, and marks houses and villages merely by their position; the decree of 23 January cannot be changed and is to be carried out, and the acts of both chamberlains are quashed. Within six weeks a sub-chamberlain or chamberlain is to come to the ground with a sworn surveyor, have the line drawn from the three corner mounds to the end point with Biskupice, and raise wall mounds only. What lies to the right of the line belongs to Łukom, what lies to the left to Trąbczyn or Nowa Wieś. The mounds raised in 1775 by Chełmski''s commissioners are all to be levelled, and the wall mounds raised by Prusimski''s commissioners as well. Because Martin Hunt does not sit to the right of the line, Chełmski is to hand him over into Prusimski''s possession within six weeks before the commissioner of the palatinate of Greater Poland, on pain of banishment. Chełmski is to pay Prusimski the sum already adjudged for the revenue drawn from the Olęder settlers, with penalties, on 20 January 1783 at Poznań. Górski is sentenced for correcting the line on his own authority to a week in the tower of Radziejów castle and a money penalty to Chełmski; Orłowski, for sending the cause back without ground, to a money penalty to Prusimski. The convent of Ląd is freed from the penalty claimed: its protest at Poznań of 26 June was only a precaution and was withdrawn on 16 October. On 29 November Prusimski appeared before Jasiński and Chełmski stayed away; Prusimski produced the map with the line signed by the President, Sebastian Sierakowski, and the Marshal, Ksawery Kęszycki, and the sworn surveyor Benedykt Woronowski, canon of Łęczyca, set out the line with poles. On 30 November and on 2 and 3 December the court had forty-one wall mounds thrown up along the line and thirty-one stakes of alder and oak driven into the marsh called Stawisko; on 2 December Chełmski appeared in person. The last mound stands twelve and a half perches short of the end mounds of Trąbczyn, Łukom and Biskupice, which were left untouched; each mound measures six cubits square and holds as signs five stones in the form of a cross, pieces of brick, broken glass and charcoal. The court then had the older mounds levelled and declared void.'
app53170koningr153-002: On 28 November 1782, in the Olęder settlement of Trąbczyn at the house of the settler Martin Hunt, the commissioner's office of the palatinate of Greater Poland carried out the Crown Tribunal's decree of 17 October 1782 in the dispute between Antoni Prusimski, Starost of Niszczewice, and Stanisław Chełmski, Treasurer of Wschowa. The Tribunal had found that Hunt, an Olęder settler whom Chełmski had held until then, did not sit on the right-hand side of the boundary line it had fixed, the side adjudged to Chełmski, and so could not belong to Chełmski, who was to give him up to Prusimski within six weeks before the commissioner. At Prusimski's request, he being present in person, the general commissioner of the palatinate, Józef Łukaszewicz, delivered Hunt into Prusimski's actual possession and bound Hunt to obey him; no one objected. Michał Brzeżański, Leon Maszewski and others were present, and the court messenger Bartłomiej Szepczyński of Trąbczyn proclaimed the act.
app5320pozgr1181-001: 'On Monday 29 March 1784 the castellany offices of Greater Poland sat at the manor of Trąbczyn to settle the ultimate limitation of the succession that the childless brothers Antoni and Paweł Prusimski had left. On one side stood Antoni in Kolno Prusimski, starost of Niszczewice and knight of the Order of St Stanisław, the brothers'' nephew; on the other the heirs of the brothers'' sisters, the Zakrzewski, Tomicki, Taczanowski, Kołaczkowski and Tworowicz parties. The abbot and convent of Ląd were cited over the reproduction of the receipt for 3,500 Hungarian ducats and for the jewels and silver of the Prusimski house lodged in the convent''s treasury. After the sworn bringing of the documents, completed in December 1783, the court went through the whole history of the suit. First came the Crown Tribunal''s decree of 8 October 1782 (the court gives the 8th; the Monday after St Francis of that year was the 7th). Next came the division of 1740 between the brothers, into three shares with the debts charged on them, with its history from the bond of 1700 and the death of Ludwik at Kamionna in 1708 to the dowry provisions and receipts of the three daughters. Last came the mother''s Golińska estates (Oporowo with Oporówka and Kałowo, Prusinowo, Szetlewek) with their leases and the church inscriptions on them back to 1616. The court decided: the mother''s clear fortune of 98,379 złoty 5 groszy is divided among six heads, three brothers and three sisters, at 16,396 złoty 15 groszy and 2½ solidi each. The clean paternal fortunes are adjudged to the starost as the brother''s son (the court writes "filiaster"): Paweł''s share at 154,436 złoty 24½ groszy and his own at 154,936 złoty 24½ groszy, each after the deduction of the maternal portion. The widow Nierzychowska''s 30,000, though settled in 1740, and Puchalski''s 10,000, presumed paid, are not counted into the estate, so that nothing out of them can come to the female line. The claim of the Radoliński successors to 43,000 złoty on Trąbczyn rests on a letter of 1736 that is disputed as not in Andrzej Radoliński''s hand; the cause was sent to Gniezno and has been undecided since 1777, and the 18,000 listed stand as the original sum, with the load removed, until the competent court decides. The court then took up what the brothers had given away beyond the division: Katarzyna, born Rozdrażewska, Paweł''s widow, and her 40,000 złoty inscribed in 1745 on Peczyska, Dubno and other estates. Then came the sitting on the ground at Grab of 3 June 1782 with Ludwik Bogdański, chamberlain of Kalisz, and Teresa, born Rozdrażewska. The account breaks off in mid-sentence at the naming of Ewa de Maniewska Potocka, widow of Joachim Potocki.'
app5321pyzdrygr115-001: 'A table from the register of the municipal court office of Pyzdry for 1791-1792 gives the farming households (dymy rolne, "hearths") of the parish of Trąbczyn, with two further columns headed "gara zyta" and "gara owcza", whose meaning is not certain. Seven places stand under the parish: the village of Trąbczyn itself with 21 hearths, 22 and 84; the parsonage (Plebania) with 4, 8 and 16; Nowawieś with 5, 10 and 20; Osiny with 6, 12 and 24; Łazy with 5, 10 and 20; Kuznia Maryantów, the smithy, with 1, 2 and 4; and "Hollendry Luzne Stare i nowe z Hutą", the scattered Hollander settlements old and new with the Huta, with 31, 62 and 124. In every row but the first the figures double from column to column; in the first the middle figure is 22 where doubling would give 42, and stands as written. The table is undated.'
app5321pyzdrygr75-001: The merchant Jan Tracholz of Witkowo declares before the municipal court of Pyzdry that he makes over to Stanisław Chełmski, who pays him for them, his own monetary claims against the late Paweł Prusimski. The first sum, 1,053 imperials, 13 groszy and (it seems) 6 Pfennig, concerns trees from the pine forests of Trąbczyn that he had bought under a written contract and which Prusimski seized from him by force and sold to a merchant Simon of Szczecin. The second, 1,513 złoty, he had spent partly on the making of sawn goods (nine stacks), which Paweł's full brother Antoni Prusimski likewise seized, and partly laid out for Paweł's benefit. With the sums pass the rights to them, the interest, and the proceedings Tracholz had begun against Paweł Prusimski's successors. Tracholz signs "by his held hand", another hand guiding his.
app534062-001: In 1727 the court messenger Sebastian Szetlewicz of Szetlewko (Szetlewek) reported to the land court at Kalisz that he had carried a summons to the estate of the village of Szetlew, to the residence of the person summoned, and that on the Thursday next past he had laid and left it there on the table in the heated room, before the summoned person's "Conte~" (a word not fully read, perhaps a member of the household). Neither the case nor the parties are named. The messenger's name shows a Szetlewicz family living at Szetlewek in the 1720s, over fifty years before the messenger Mathias Matuszkiewicz "de villa Szetlewek" appears in the Konin court register.
app536017-001: In 1589 Albertus Trąmpczyński Otha of Trąbczyn cited Thomas Łukomski of Łukom before the land court at Konin for the second time, after Łukomski failed to appear the first time. He charged that Łukomski, with other neighbours, had built a pond that year on the estate of the village of Łukom and, by holding back too much water, had flooded a great quantity of woodland, pine forest, barren pasture and meadow on the estates of Trąbczyn, Nowa Wieś and Osiny; oak, beech and ash, fit for building and for bee-trees, had drowned and dried up. He valued the harm at ten thousand Hungarian gold florins and as much again in damages. At Łukomski's request the court ordered a judicial inspection of the ground and added a court messenger, whom Łukomski chooses and pays, to see in what place and on whose ground the wrong was done, and whether it was done. Łukomski must carry out the inspection within six weeks at the place in dispute, both parties must be present, and at the next court terms at Konin they have a final term to hear the outcome.
app536036-001: In 1644 the land court at Konin gave judgment by default for Jerzy Chełmski of Łukom against the brothers Marcin, Wojciech, Władysław and Andrzej Trąmpczyński of Trąbczyn, sons of the late Stanisław, and Stanisław's widow Anna of Słończyce, who holds her dower and a life interest in what he left. Chełmski charged that they had sent their subjects into his woodland by the village of Łukom and had about eighty notches cut into trees there in the manner of boundary marks, so as to add a great part of his ground to their own. Leaving the ground itself aside, he reckoned the harm at a thousand Polish marks and as much again in damages, and demanded that the marks be annulled, the penalties having been paid, once the sub-chamberlain's office had been brought out. The court messenger Mikołaj Jaworowski of Karmin called the defendants and they did not appear at the first term; Chełmski had them condemned, with the court's leave, in the penalty of contumacy. The court messenger Bartłomiej Koelmarek of Łukom declared that he had laid the citation on the Monday before at the manor of the cited in the village of Trąbczyn, in the presence of the household.
app536036-002: In 1644 the land court at Konin gave a second judgment by default against the Otto-Trąmpczyński brothers Marcin, Wojciech, Władysław and Andrzej of Trąbczyn and their widowed mother, Anna, at the suit of their neighbour Jerzy Chełmski of Łukom, who charged them with having lately had about a hundred trees fit for building, chiefly pines, and about three hundred cartloads of firewood felled in the woods of the village and estate of Łukom and used as they pleased. Leaving the ground itself aside, he reckoned the harm at three hundred Polish marks.
app536040-001: At its sitting that opened on the Monday after Septuagesima 1728 the land court at Konin heard the suit of the brothers Franciszek and Józef Ścibor Chełmski, heirs of Łukom and Łomowo, against Krzysztof Prusimski of Trąbczyn as principal defendant, his son Antoni, six named noblemen in his service, and unnamed subjects of Trąbczyn; the suit had been brought at the sitting after Trinity 1727 and not decided then. They charged that Prusimski, with no regard for neighbourly friendship, had a hundred threescore of shingles made on their ground burned together with a hut, so that children living in the hut were nearly burned; that he had four working oxen kept for the glassworks taken in an armed raid; and that he plotted against Józef Chełmski's life. They charged also that, while they were at the Crown Tribunal at Piotrków, he sent his son, his retainers and his subjects in arms onto ground that belongs to Łukom from of old, and had hay taken there in no small number of cartloads. Both sides appeared. The court found that a sworn commissioner of the provinces of Poznań and Kalisz, Wojciech Biskupski, on whom both had agreed, must go with two friends of each side onto the disputed ground on the Monday after Misericordia Sunday, engaged at the parties' common cost. They are to examine old and knowledgeable witnesses on oath about the ownership of the ground, the acts of violence and the damage, and to decide all the claims. Appeal lies only from the final sentence. Both parties are to pay a penalty of fourteen Polish marks, half to the other side and half to the court; whoever does not comply falls under banishment.
app536045-001: In 1763 the land court at Konin heard the widow Katarzyna Prusimska of Trąbczyn, born Rozdrażewska, with Joseph Puchalski on one side, and Stanisław Ścibor Chełmski of Łukom with one Czajkowski on the other; each side was both plaintiff and summoned. The court held that sworn witnesses must be examined and had their testimony read out. It showed that in 1761 Prusimska had sent potash-burners off with potash; Chełmski, travelling to Poznań, came upon them near Pyzdry as they were making for Gdańsk, had the potash seized and stored at an inn in Pyzdry, and laid an arrest on it with the notary of the customs house. The burners, helped by the noblemen Wawrowski and Gotartowski, took it away over the notary's objection and brought it to Gdańsk. Because the dispute over the boundary between Trąbczyn and Łukom was still undecided between the parties before the Crown Tribunal, and only the fixing of the boundary would show on whose ground the potash was made, the court suspended its decision and ordered the testimony handed to the parties from the chancery in a closed roll.
app536046-001: At the land court's sitting at Konin that opened on 20 October 1777, Stanisław Chełmski, heir of Łukomia, demanded of Antoni Prusimski, Starost of Niszczewice, the production of an act said to have been given, as though a boundary act, between the estates of Łukom and Trąbczyn by commissioners of the Estates and brought in by the Starost. He laid down three searches of court records, at Kalisz on the Saturday after the Presentation of the Virgin 1776, at Kościan on 2 January and at Konin in October of the current year, and proved by them that the act is not in the records of its own province. Prusimski laid down a search made at the municipal court of Brześć Kujawski on 10 October 1777 and entered at Konin on 16 October, and showed that the decree of the commission that had fixed the boundary was entered at Brześć Kujawski in 1776. Because rights, settlements and decrees are to be brought in in their own province, the court ordered Prusimski to have the decree entered in the municipal court records at Konin within four weeks, on pain of outlawry. The reading, made from a microfilm, is uncertain in several places.
app536046-002: At the sitting of the land court of Kalisz at Konin that opened on 20 October 1777, Stanisław Chełmski sued Antoni Prusimski, Starost of Niszczewice, who appeared in person. Chełmski relied on a transfer acknowledged before the municipal court of Pyzdry on the Wednesday, the eve of the Nativity of the Virgin, 1768, by which the merchant Jan Tracholz made over to him various sums that he claimed from the late Paweł Prusimski. He demanded that Prusimski produce the contract for the sale of the Trąbczyn pine wood that was made with Tracholz and Paweł Prusimski. It was shown to the court that a decree of its earlier sitting, of the Monday after Septuagesima Sunday 1766, between Tracholz and Antoni Prusimski, had sent the cause to a sitting on the ground and had not been carried out. The court therefore suspended the whole matter and, at the parties' request, found a sitting of the court on the ground of Trąbczyn necessary, on the Monday after Laetare Sunday of the coming year. The judge brought there is to order Prusimski to produce the contract, decide the cause finally, hold inquiries and take oaths. The parties are to obey him on pain of outlawry and to cite whom the matter requires; a penalty of fourteen Polish marks, half to the other side and half to the court, is laid on them.
app536047-001: In October 1783 the land court of Kalisz sitting at Konin heard Stanisław Chełmski, Treasurer of the land of Wschowa, against Antoni Prusimski of Kolno, Starost of Niszczewice. Chełmski raised against Prusimski a condemnation that he had obtained against him in 1780, at the sitting on the ground at the estate of Grab, for breach of a Tribunal decree. Prusimski did not show his right to be heard and submitted to the court's discretion; the court laid on him half the capitaneal penalty, half to the objecting party and half to the court, payable at once, admitted him to the cause, and, because the cause concerned acts of violence, ordered sworn witnesses examined. They showed that men of Prusimski's household from Trąbczyn, having strayed from their road, came to the deserted settlement of Smoleniec, which belongs to Chełmski's hereditary estate of Łukom, had the way shown to them, and asked the Olęder settler Jan Kłonica whose village it was. When Kłonica said that these settlers belonged to Chełmski, Prusimski's under-coachman called him a liar and struck him with a whip; the coachman beat him with a pine stick, which broke, and the under-coachman shouted that he should be struck dead; Kłonica fled into an alder grove. The men then turned to the settler's house, took a servant from it by force, beat him, and went on beating him on the way to the tavern of Tomice; he came home only the next day. A witness complained the same day to Prusimski, who came along the same road; Prusimski promised to put the matter right at home. The acts were done on Chełmski's own ground; whether with Prusimski's knowledge or at his order is not shown, and the coachman and under-coachman are not to be found at Trąbczyn. Only the coachman Józef and the under-coachman Walenty are accused; Prusimski declared that he cannot produce them and offered an oath to clear himself. The court ordered him to swear within six weeks before the municipal court office at Konin that the arrest Chełmski obtained (an order to keep named subjects ready to be produced in court) did not reach the two men and that he cannot produce them, on pain of banishment.
app53640kalisztab21-001: For the midsummer instalment of 1789 the Kalisz voivodeship collected the hearth tax (podymne), a tax on every household that paid the Crown army; some towns and villages paid it straight to the army on an order to pay. In the Pyzdry and Kalisz districts and around Konin, Trąbczyn, written "Trąpczyn", paid 80 złoty and its parish priest's subjects 20; Łazy paid 12 złoty 15 groszy, Osiny 17 złoty 15 groszy, Nowa Wieś 12 złoty 15 groszy, and Trąbczyn's Olęder settlers ("Olendry Trąbczynskie"), colonists who held their land by contract with the owner, 35 złoty. Łukom owed 97 złoty 15 groszy, the Olęder settlement "Olędry Lusnie" 35 złoty, and Szetlewek 55 złoty.
app5371057-001: On 31 March 1806 Peter Friedrich von Triebenfeld, as authorised representative of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, granted the settler Christoph Erbet of the Trąbczyn Hauland one Hufe, Magdeburg measure, in the Trąbczyn forest in hereditary lease, for 100 Reichsthaler entry money and a yearly rent of 30 Reichsthaler. Because the land was wholly uncleared, Erbet had three rent-free years; the first payment, of 15 Reichsthaler, fell due at Christmas 1809. In 1811 Hawich handed the file to the peace court of the Konin district and asked that 9 Reichsthaler 18 groschen of costs be recovered from Erbet.
app539680545-001: The historian Albert Breyer's list headed "P. Winkler Polonisierte Namen" gives nine German surnames of the commune of Zagórów with the Polonised forms that families took, from Bobel – Rybicki ("7. 1855") to Gutschke – Gucz. The surname Waldowski stands without its pair, and "1843. Szuberski" at the foot. The P. Winkler of the heading is presumably the Pastor Winkler in Wieluń whom Breyer's essay on German surnames in the towns names as one of two pastors who had German names transferred into Polish wholesale.
app539680545-002: 'The historian Albert Breyer''s list "Polonisirte Deutsche Namen" gives nineteen German surnames with the Polonised or altered forms they took: Niemann – Nowak, Berwald – Jagodziński, Rode – Czerwiński, Nachtigall – Słowiński, Fuhrmann – Fuhrmański, Rotloff – Surowiecki, Krebs – Rakowski, Will – Dzikowski, Pidda – Peda, Pidd – Studziński, Schienke – Stodulski, Wiese – Wiza, Quella – Quelle, Neuwert – Nowaczyński, Martin – Marcinkowski, Hahn – Koguciński, Schmidtke – Schmidtka, Kybs – Kübsch and Brodel – Brudel.'
app539680545-003: The historian Albert Breyer's alphabetical list names thirty-nine Polonised German surnames, from Arminski under A through Bartmański, Funkiewicz, Holendajski, Kuntski, Licznerowski, Murnerowski and Najderski to Weynerowski and Wilmański under W; the reading of Jursowski is doubtful.
app539680545-004: From a Breslau print of 1741, George Schlag's "Polnisch-deutsche Briefe", written by the morning preacher at St Hieronymus who was also appointed moderator of the Polish school, the historian Albert Breyer copied eight pairs of a Polish first name and surname against a German one, from Wojciech Wilkotek – Albrecht Bärwolff through Jakub Maślanka – Jacob Buttermilch and Tomasz Kapusta – Thomas Kraut to Jakub Wierzbrecki – Jacob Weidner.
app539680545-005: 'The historian Albert Breyer''s list "Polonisirte Deutsche Namen" gives fifty-three Polonised German surnames. Seventeen pairs among them set a German name against its Polish translation (Zech – Czech, Rolle – Rola, Sack – Zak, Blum – Kwiatkowska, Erdmann – Ziemiecki among them), and two entries are themselves pairs (Riewe – Riwa, Madaliński – Mude); one more pair, Bohrer – Swiderski, closes the list. Beneath it Breyer jotted topics for further study: "Geschichtskrankheiten", "Polacy-ewangelicy" and "Erste deutsche Einwand", with a sentence fragment on what a mouth has swallowed.'
app539680545-006: 'The historian Albert Breyer''s notes on the German secondary schools of the Łódź region say that the choice of so important a subject as the pupil''s is left to the insight and pedagogical conscience of those responsible for it. The five remaining German secondary schools, the boys'' and the girls'' gymnasium at Łódź and those at Pabianice, Zgierz and Sompolno, have agreed on a common basis: the subject matter from pre-school I up to the top class is to be worked through in twelve school years, though individual gentlemen argued for eleven. The majority kept to twelve, in view of the overburdening of learning three foreign languages. The coming into being of a directors'' conference is welcomed most warmly; what is wished is that subject conferences of the teachers at the German institutions follow it. For lack of time the conference settled no fundamental questions exhaustively, still less a rebuilding or a reduction of subjects; the judgement of the long-serving teaching staff is in any case decisive. Subject conferences would also counteract the dangerous going-it-alone to be observed in the individual institutions; it would lie in the interest of the former German community to receive word of their coming into being.'
app539680545-007: 'The historian Albert Breyer''s essay on German surnames in the towns says that whoever walks today through Warsaw, Lublin or a market town far from the great trade routes comes everywhere upon German family names on the shop signs; the bearers will put up with most things, but on no account may one address them as Germans. Dead and spoiled is the smallest trace of the former folk property; as a public scandal nothing is left such people but their German name. The legal way out, a lawful change of name, is beset with greater or lesser difficulties and of late costs a considerable sum; a simpler way leading more comfortably to the goal has been found in the resourcefulness of some commune heads, even of evangelical pastors, Pastor Winkler in Wieluń and Pastor v. Boerner in Zduńska-Wola: the complete transfer of the German family name into Polish, so that out of a Jahn a Koguziński, a Schneider a Krawczykowski, a Rot a Czerwiński, and Blum became Kwiatkowski. A closer examination finds three kinds of altered name, of which the essay names two before it breaks off: names translated literally from the German into Polish, and names written in Polish spelling that at first sight pass for Polish family names. A list of some fifty of them follows, from Brojerski, Bartnowski and Bauerowicz to Schulborski, Wegnerowski and Wilmanski. Thus German family names are mutilated, fitted to the language-feeling and language-use of the majority people.'
app539680669-001: 'In July 1936 the historian Albert Breyer wrote down what the people of the German settlements of the commune of Trąbczyn told him. The colony of Łazińsk has 2,040 Morgen and 250 farmers; about 1880 (Breyer adds a question mark) it received servitudes from the Trąbczyn estate, which were added to the old land at the notary''s and are heavily taxed. Breyer asks when the remaining manor land of Trąbczyn was parcelled out; one Jesse bought it, and it is now called Włodzimierów. He lists the teachers of Łazińsk: Mielke since 1925, Klingbeil 9 years, Eduard Zelmer 34 years, Radke 10 years, Rasch 50 years, who still taught at 80; on the first day of lessons there were 186 children in the school, and for ten years one teacher had 170 pupils. The military authorities complained to the Ministry of Education that the recruits of the commune of Trąbczyn could not speak Polish. Many emigrated to Volhynia, people from Łazińsk also to Russia and back, others to America and Brazil. Emilienheim was joined to Drzewce because 11 persons were lacking to make 200. He also recorded marriage circles, hymn books from Wrocław and Züllichau, field names, the speech of the "Brücher" of the marsh villages ("ick war do"), houses, barns and wooden grave boards. His photographs are logged at the end, one part headed "Juli 1935" and naming Gostynin, Leonberg and Grabie.'
app539680669-002: In July 1936 the historian Albert Breyer also wrote down that 65 years earlier, in March, very many people from Łazińsk had gone to Russia, a month on foot; shortly before the First World War people from Volhynia had come back as well. Włodzimierów had been parcelled out 25 years earlier from the Trąbczyn estate, whose owner was called Count Miączyński, almost all of it to Germans; the remaining manor had some 60 Morgen, and Jesse came from Białobłoty. On forest land of the Trąbczyn estate, which a Jew had bought and sold on to Germans 5–6 years before the war, lies the new settlement "Trompczyn D." with Bochenski, Kinast, Retzlaff, Schwarz, Lipelt, Schmechel and a Pole. In Łazińsk, according to the doctor Brede in Zagórów, consumption is widespread; during prayers the congregation kneels. Germans from Łazińsk received drained land through the Prussian Colonisation Commission, which settled Germans on land in the province of Posen, and were driven out by the Poles at Ostfelde near Września. He also noted teachers and sextons from 1895 to 1928, Low German and Kashubian, servitudes from the estates of Biała, Niniew and Chocz, post-built and Pomeranian barns, grave boards at Kazimierka and Józefów, and illegitimate children, and the dates of a Züllichau hymn book of 1744, Old Kazimierka 1782 and Józefów 9 November 1790, "from the Chocz estate", whose owner was called Lipski.
app539680716-001: On 3/15 December 1858 the wójt (village head) of the commune of Kopojno made out at Kopojno a Polish list of the hearth tax, together with the barracks money, that the colony of Emilienheim was to pay in two equal instalments in March and September. It names 29 householders, from Krystyan Szejnwald to Gottlieb Dykhof, two of them widows. Twenty-seven owe 1 złoty 50 groszy each; Gottlieb Liepelt and the widow Szurak are entered with different figures (1–3 in the first column). The whole comes to 40 złoty 50 groszy.
app539680716-002: Albert Breyer's copy of the Russian liquidation table of the village of Emilienheim, "now Mikhalenov", in the governorate of Kalisz, district of Słupca, circuit of Pyzdry, dated 28 March 1868, which fixed each settler's holding and the sum due to the landowner. It lists 35 holdings, each with its unusable land in Morgen and its whole extent in Morgen and rods; the largest holding has 30 Morgen 182 rods. To these are added the village head's share, the school farmstead with 7 Morgen 116 rods, the cemetery and the roads. Together they come to 319 Morgen 250 rods; 4,420 roubles 53 kopecks are due to the landowner.
app539680716-003: Albert Breyer's notes record that after the survey by the surveyor at Kalisz, Emilienheim had on 26 November 1870 331 Morgen 179 rods of usable and 5 Morgen 179 rods of unusable land, and that on 29 September 1892 the board of the governorate of Kalisz renamed Emilienheim Michalinów, after its local name.
app539680716-004: Albert Breyer's copy of the Russian liquidation table of the colony of Łazińsk, in the governorate of Kalisz, district of Słupca, circuit of Pyzdry, commune of Trąbczyn, dated Słupca, 29 June 1868, which fixed the colonists' holdings and the sum due to the former owner. It lists 91 holdings, the largest of 54 Morgen 292 rods, held by settlers with German and Polish names; beside many of them Breyer noted in pencil who held them in 1875. To these are added the farmstead of the village school with 20 Morgen 218 rods, the cemetery, the common land, the village head's share, the roads and 9 Morgen 224 rods of unusable land. Together they come to 1,691 Morgen 219 rods; the liquidation sum for the former owner is 10,055 roubles 70 kopecks.
app539680716-005: 'Albert Breyer''s copy of a Russian statement of the servitudes, the rights in the landowner''s forest, of the peasants of Łazińsk, undated: all the peasants of the village of the Łazińsk Hollanders have the right to graze all their cattle in the forest "Studzianki" and to gather there twice a week fallen wood, lying wood and dry branches, and carry it away; they have no other rights to servitudes.'
app539680716-006: Albert Breyer's German notes on the number of farmers and their land name no village; they stand with his notes on Łazińsk. By the Russian entry after 1875 there were 1,655 Morgen 63 rods and 94 farmers; in 1901, 1,660 Morgen 271 rods and 91 farmers; in 1906, 2,044 Morgen 181 rods, 91 old and 21 new farmers with 112 Morgen; in 1907, 91 old and 21 new farmers; in 1914, 137 farmers with 2,037 Morgen.
app539680716-007: 'Albert Breyer''s table of farmers and Morgen gives nine years from 1840 to 1935: in 1840, 87 farmers and 1,368 Morgen; in 1868, 91 farmers and 1,691 Morgen; in 1875, 93 farmers and 1,691; in 1890, 94 and 1,655; in 1895, 96 and 1,657; in 1901, 97 and 1,660; in 1906, 112 and 2,044; in 1914, 137 and 2,037; in 1935, 146 and 1,996. The table names no village, but its 1,691 Morgen of 1868 are those of the liquidation table of Łazińsk.'
app539680716-008: 'In July 1935 Albert Breyer noted that Huta Trąbczyńska has 18 farmers and 217 Morgen and Orlin 85 farmers. For Orliny he notes 152 cows and 343 sheep, in 1879 52 cartloads of fuel for the whole village, in 1880 300 Morgen 97 rods, and names from a forestry plan, among them Biskupice, Szetlew and Grzebień. In Józefów Becker, Wegert and Jesswein were among the first farmers. He also notes the old houses, gable to the street, the hymn books, the Züllichau one among them, and dress: the women wear aprons right round the body, and the bonnets disappeared 30 years ago. The old people spoke some Low German; the people of Orlin call those of Białobłoty "the stupid Kashubians"; a Protestant landowner, Riedel, in Wielki Bór gave Mr Schmidt a hymn book. Under the heading "Holędry Orliny Biskupicki" he writes of the German settlers, naming Grodziec, Łazińsk, Białobłoty and Obory: theft of wood and potatoes, mostly from poverty, less in Łazińsk; wild marriages and illegitimate children; many marry into Białobłoty. They get on well with the Poles, the Poles speak good German, and there is no tendency to assimilation. The Volksverband works through the "Volksfreund" and the calendar. In Orlin there are two preachers and, for two years, Pentecostalists and Baptists. He adds customs, and the young, mostly girls, going to the Poznań region.'
app539680716-009: Albert Breyer's list of the farmers of the Orlin Hauland of Biskupice with their land in Morgen counts 36 entries, from Bloch to Hoffmann, among them 15 Morgen belonging to the school and 34 Morgen of common land, and ten more farmers, from Ziebart to Kress. The largest holding is Kolański's, with 43 Morgen. The total reads 27 Hufen 28 Morgen.
app539680716-010: 'Albert Breyer''s notes on Orlin of July 1936, headed "Orlin Hauland 1 Oct. 1806", say that Kashubian was spoken in Orlin; with it a statement of Weber''s about Bloch''s father, who came from Czarny Bród, and Kashubian. Because of the wet years people in Orlin went bankrupt; the word he gives is "Kjaufft". He then gives the land of the village of Orlino (wieś Orlino) by classes: class I 17, II 370 and IV 464.69 Morgen, and 300 Morgen of waste land (nieużytki); his total is 1,157.69 Morgen, though the figures add up to 1,151.69.'
app539680716-011: Albert Breyer's copy of the undated Russian liquidation table of the village of Orliny, which belonged to Count Albert Taczanowski, lists 57 holdings with their extent in Morgen, for some also in rods and for some without a figure, the largest of 48 Morgen, and the village head's farmstead of 4 Morgen. Together they come to 850 Morgen 272 rods; 6,049 roubles 89 kopecks are to be paid to the landowner.
app539680716-012: Albert Breyer notes that the separation, the exchange of the peasants' servitudes in the landowner's forest for land, took place in Great Orlin and Czarny Bród 60 years earlier, by the number and then by Morgen, and in Białobłoty and Little Orlin two years earlier, by the number; and that the servitude in Orlin covers 300 Morgen.
app539680716-013: Albert Breyer's copy of an undated Russian statement of the servitudes of Orliny says that all the farmsteads of Orliny have forest and pasture servitudes in one half of the forest "Velskii Bor", which adjoins the village. Every Saturday they may gather fallen wood, break off dry branches and grub up stumps, and carry away no more than one cartload a week for each farmstead. Each farmstead receives one tree a year for repairing its buildings, 8 inches thick at a height of 2 ells, with its top and branches. They may graze their cattle and rake litter in April, May, September, October and November. The number of carts and cattle for each farmstead is set by a list that follows.
app539680782-001: 'On 14 March 1820 the village board of Tropiczyner Holland, the old Olęder colony on the Trąbczyn estate, engaged Samuel Adolph of Borwiezer Holland as teacher of the colony''s school. The board had put him to the test and was pleased with him. Ten terms were set: a free dwelling; for the school three Morgen of land and some meadow, which he may use without payment, the land tilled by the community; from the community five Viertel of grain and a half Viertel of seed, which he must carry at his going. School money is 3 Groschen for a child learning from the a b c to reading and 6 Groschen for writing and reckoning; every child that is confirmed gives a present of 1 St.; burial fees are 7 Böhm 3 Groschen for an old corpse and 1 St. for a child; at the high feasts of Christmas, Easter and Whitsun every householder gives an offering of 6 Groschen; and on his New Year''s round he receives 6 Groschen Polish at New Year and 3 Groschen Polish on Maundy Thursday. The teacher binds himself to continue his office as an honest man, the Sunday school as well as the children''s teaching; the board engages him for one year and binds itself to fulfil its side faithfully. The village mayor Johann George Lindner and the assessors Christoph Rimpel and Samuel Gellert sign for the board.'
app539680783-001: 'Count Włodzimierz Miączyński, heir of Trąbczyn, whom the colonists on his estate had sued on 6/18 August 1859 over their rights in his forest, counterclaimed before the Civil Tribunal of the Warsaw Governorate at Kalisz and had 97 colonists summoned: 80 of the Staro-Łazińska colony and 17 of the Nowo-Łazińska colony, the two Olęder colonies of his estate, among them Henryk, August and Michał Zelmer (the print has "Celmer") and the widow and children of Daniel Zelmer. The court messenger Michał Piechowski served the summons on 7/19 October 1860 on Karolina Fridenberg of the Staro-Łazińska colony, a widow listed as Friedenberg. The Count asks the court to declare that the contract of 18 May 1805 between Prince Friedrich Ludwig of Hohenlohe-Ingelfingen and fourteen colonists does not bind him. He asks it also to award the right of pasture and of gathering wood in the Studzianka district of the Trąbczyn forest only to the seven holdings of the contract of 21 December 1828, or failing that to the fourteen holdings of 1805. Experts are to say for how many cattle and how much wood. His grounds: under the privilege of Paweł and Katarzyna Prusimski of 1746, pasture depended on each Olęder''s agreement with the owner of the estate. When the Governing Commission of the Duchy of Warsaw gave the confiscated estate back to Michalina Dąbska on 21 July 1807, the Prince''s obligations lapsed, as the highest court held on 7 July 1826 against Weigel, who claimed interest on 200,000 Polish złoty. The division of the holdings has multiplied hearths, inhabitants and livestock to the harm of the manor; a resolution of the Administrative Council of 1858 forbids perpetual leaseholders to divide a farm without the manor''s permission.'
app539680801-001: 'On 19 February 1805, at the Guhrwitz justice office near Wrocław, Prince Friedrich Ludwig of Hohenlohe-Ingelfingen gave the War and Forest Councillor Peter Friedrich von Triebenfeld, his agent, a general power of attorney for his estates of Zagórów, Witów and Trąbczyn in the Kalisz department. Triebenfeld may act for the Prince in all matters of parcelling, sale, lease or mortgage: apply to the War and Domains Chamber and to the Government at Kalisz, the provincial court, settle with the lessees, pay and receive money, and give orders to the officials of the estates and suspend them. The Prince promises to approve everything and to repay his costs.'
app539680801-002: 'On 28 January 1806 the South Prussian War and Domains Chamber at Kalisz, in the King''s name and on his cabinet orders of 22 October and 7 December of the year before, allowed Prince Friedrich Ludwig of Hohenlohe-Ingelfingen to parcel out the demesne farms of Drzewce, Kopojno, Świątniki, Święcia and Broniki in the lordship of Zagórów and of Nowa Wieś, Przybysław, Stara Huta and part of Trąbczyn. He may let Oleśnica and Szetlewek in hereditary lease, and turn the services of all his subjects into a fixed money rent. He keeps back part of Trąbczyn, the land at Mariantów and a part of the forest. Four conditions are attached: the compensation of the subjects for their rights of pasture and wood is to be fixed; no peasant holding may lapse; the state''s taxes remain and are secured in the mortgage book; and the wood rights of the abbey and provostry of Ląd are secured in the mortgage book, and if the reserved forests prove too small for the wood rights of the domain office of Ratyń, a yearly compensation is to be fixed.'
app539680801-003: By a hereditary-lease contract engrossed by the patrimonial court at Mariantów on 21 March 1806 (its beginning is lost), Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, through his general attorney Peter Friedrich von Triebenfeld, lets 100 Magdeburg Hufen of forest of his estate of Drzewce to eighteen named settlers for ever; sixteen take 5 Hufen each and two take 10. No entry money is paid, because the land has still to be cleared; four rent-free years are allowed for the clearing, until Christmas 1808. After that the hereditary rent is 30 Reichsthaler a Hufe, 3,000 Reichsthaler a year in all, payable at Midsummer and at Christmas; half of it can be redeemed. At every sale a tenth of the price goes to the lordship. The lessees are free of hereditary subjection and labour service but remain under the lordship's court, must buy their beer and spirits from it, and are jointly liable. The community receives 21 Morgen free of rent for a schoolmaster, a village mayor and a churchyard. Eleven of the eighteen sign with three crosses.
ihagrrep7cnr1414-001: On 11 January 1797 the Prussian Department of Foreign Affairs at Berlin sent Count von Hoym, minister for South Prussia, and in the same words Baron von Schroetter, minister for New East Prussia, a copy of what the royal resident at Venice, Count von Cattaneo, had reported at the request of Anton Prusimski, a resident of the provinces acquired from the former Republic of Poland, who was then staying at Venice. The Grand Chancellor, von Goldbeck, head of Prussian justice, was added as a recipient, and three fair copies were ordered. Haugwitz signed the letter.
ihagrrep7cnr1414-002: 'On 14 December 1796 Count Cattaneo, the Prussian resident (diplomatic agent) at Venice, reported in dispatch No. 423 that the Polish gentleman Antoine Prusimski had come to him in truly ruined health and dulled almost to stupor by the death of his wife, and had asked for a certificate of his sad situation and that he could not travel at present and in that season. Cattaneo did not think he could refuse it: a man who is exhausted by going from one house to another cannot travel from one country to another. The foreign department in Berlin received the report on 2 January 1797, and Mr von Raumer directed on 8 January that Hoym and Schrötter be notified.'
ihagrrep7cnr1414-003: On 29 January 1797 Baron von Schrötter, minister for New East Prussia, thanked the Department of Foreign Affairs for its news of the 11th of the month about Anton Prusimski, who is settled in the new acquisition from Poland and is at present staying at Venice. He passed it on to the Minister of State Count von Hoym, because it is not established whether Prusimski is settled in New East Prussia or in South Prussia.
ihagrrep7cnr3067-001: 'On 16 February 1797 Heinrich Julius von Goldbeck, Grand Chancellor of Prussia and head of its justice, laid before King Friedrich Wilhelm II a memorandum on what had become of the participants in the South Prussian rising of 1794 and on extending the King''s mercy to them. By the laws many would have incurred death and the rest confiscation and fortress imprisonment for life; but letters of pardon, the amnesty patents of 24 September and 10 December 1794 and the Immediate Instruction of 3 April 1795 had softened this: only 6 or 8 chief ringleaders were to be punished with the rigour of the laws, though not with death, the rest to pay fines assessed by a finance commission in Poznań, and only those who would not submit or could not pay were to be sentenced to the fortress for a time. Goldbeck notes that the justice had no share in these ordinances and was only sent them to follow. The chief ringleaders, Niemoiewski, Wybicki, Xaver Dombrowski, Mniewski, Antoni Prusimski, owner of Trąbczyn (written "Prudzinski"), Krupecki, Xaver Jezierski, canon of Włocławek (written "Jetzierski"), Rokittnicki and others, had fled, so that only the property they left behind could be confiscated; other promoters of the rising had settled with the commission by paying fines. Of 387 insurgents, 307 paid fines only, 49 were sentenced to the fortress for up to 3 years, 26 for long terms, 2 for life and 3 to death, of whom one was pardoned under the gallows and one escaped by flight. Should the King wish to extend his grace, Goldbeck advises that the confiscation imposed on the rebels who had left the country stand, since the confiscated estates had for the most part already been disposed of; that the fines still be collected, even those in arrears, because the province''s necessary expenses counted on them; that those sentenced to short terms, most of whom had already served them, could be remitted the rest if still held; that those sentenced to long terms be remitted about half, except Pratzmowski, Ryczewski and Maruczewski, who had incurred their sentences chiefly as highway robbers; and that of those sentenced for life Nowicki, already spared the death sentence, and Sobolewski, condemned chiefly for murders and highway robberies, stay as sentenced, while Stockowski, who seemed to have sinned from simplicity and vanity rather than evil intent, might be pardoned down to 10 years, with a pension or dowry out of the confiscated estates for his under-age daughter, who had no property of her own. A few investigations still pending against insurgents who had lately answered the public summonses are to be judged under the old rules, the new principles to be considered when the rescripts of confirmation are submitted. If the King agrees, a public notice of the amnesty and the orders to the Minister of State Count von Hoym and to the Grand Chancellor are to be laid before him for signature. The King refused: in his own hand, on the same day, he found none of the condemned worthy of a reduction of their punishment; those condemned to money fines are rather to be held to pay them and, those who cannot pay, to be put under arrest in proportion. Of the condemned, Goldbeck''s list names for death Franz von Wittwicki and Andreas Retznowski, who at the attack on the town of Włocławek led the canons'' servants against the military and murdered an officer and an excise official. For life: Joseph von Stockowski, general of the insurgents of Wieluń, who led them against the royal troops, robbed magazines and plundered treasuries; Joseph Nowicki, sentenced to the gallows for his part in seizing the artillery transport at Włocławek and pardoned by the King; and Joseph Sobolewski, who after the rising was dissolved joined a band of robbers and helped in murders of soldiers and travellers. For long terms, 26 men, for 4 to 15 years, the sentences beginning between February 1795 and November 1796: nine of them for especially active participation in the rising; among them Johann Thiele, secretary at the insurgents'' commission of order and war; the provost von Chicomski and Cajetan von Smolinski, for abusing their spiritual office; Lorenz von Masowiecki and Dominic v. Dziewanowski, for having been present at the insurgents'' attack on the town of Rypin; Komornick von Wardenski, strongly suspected of having known of the insurrection beforehand; Felix von Krettkowski, who had become general of the insurgents of Łęczyca, though not entirely of his own free will; Paul von Skorzewski, general of the insurgents of Kalisz; Samuel Czimay and Szekus Ruba, for taking an active part in the attack on the garrison at Włocławek; Friedrich Jacob v. Psarski, president of the confederation of Wieluń and Ostrzewo; and Constantin v. Mielewski, also on suspicion of the murder of a Jew. The longest terms, 15 years, are those of Casimir von Pratzmowski, also for highway robbery, and von Ryczewski, who had joined a band of robbers.'
ihagrrep7cnr3132-001: On 19 February 1803 the Grand Chancellor Goldbeck wrote to the cabinet minister Count von Haugwitz that King Friedrich Wilhelm III had sent them both, for a report, the petition of a former Starost von Prusimski (Antoni Prusimski) and of one Xaver Jezierski, who had left the country after the South Prussian rising of 1794, for leave to return to their fatherland. Since Goldbeck thought it necessary to see the files of the proceedings on their offences and their property, he had a rescript to the Government at Poznań dispatched, which he enclosed in draft and fair copy; he asked Haugwitz to countersign it, forward the fair copy and return the draft to the Privy State Chancery.
ihagrrep7cnr3132-002: On 22 April 1803 Goldbeck sent Haugwitz the files of the confiscation proceedings against the former Starost Anton von Prusimski and the canon von Jezierski, which the Government at Poznań had sent in, in 6 volumes, with his draft of the joint report the King had asked for. If Haugwitz had no objection to the draft, he was to countersign it, have the fair copy made and sent to Goldbeck for his co-signature, and return the draft and the files.
ihagrrep7cnr3132-003: 'On 29 April 1803 Haugwitz drafted his reply to Goldbeck: in full agreement with Goldbeck''s opinion on Prusimski and Jezierski, he had signed the report Goldbeck sent him and had it engrossed, and sent the fair copy for Goldbeck''s countersignature and dispatch. At the one place where the report says that the confiscation of their property must remain unalterable, he had added that he refrains from expressing an opinion, because the point belongs to Goldbeck''s department and lies outside his own. He returned the files with thanks.'
ihagrrep7cnr3132-004: On 11 May 1803 Goldbeck told Haugwitz that King Friedrich Wilhelm III's cabinet order of the day before had answered their joint report on the return of Anton von Prusimski and Xaver von Jezierski. He sent the order in the original, to be returned, and with it, for Haugwitz's countersignature, the drafts and fair copies of the resolution to be given to the two petitioners and of the order to the Government at Poznań. He asked for the drafts and fair copies back once co-signed.
ihagrrep7cnr3132-005: 'On 30 April 1803 the Grand Chancellor Goldbeck and Count Haugwitz reported jointly to King Friedrich Wilhelm III on the representation of the former Starost von Prusimski and of Xaver von Jezierski, who had left the country because of their part in the South Prussian insurrection of 1794 and had asked from Dresden for leave to return. The files from the Government at Poznań show: Anton von Prusimski was accused of having gone on 2 August 1794, before the outbreak of the insurrection, from his estates near Kalisz to his Smiłowice estates in the district of Kuyavia, of having received daily visits there from the neighbouring nobility, and of the so-called Kuyavian insurrection having been concluded with him on 21 August, with the act of confederation drafted and executed; he is also said to have been among the South Prussian noblemen who met at Dresden in the winter of 1793/94 on account of the changes in the Polish state. These accusations rest mostly on a Memoire raisonné drawn up from the statements of unnamed trusted Poles and officials, and were not closely examined. The Government did not think them sufficient for the criminal proceedings against absent offenders that were brought against some chief insurgents, but at the instance of the fiscal instituted only the confiscation proceedings, because he had not returned under the general ordinances. Publicly summoned, he held out hope of his return from Italy, where his wife, who also died there, was said to have had to stay for her health, and tried to avert the confiscation; as he did not appear, the sentence of confiscation was passed, and when it had become final his Trąbczyn estates were given to the Prince of Hohenlohe, his Pawłów estates to the present Major General von Sanitz and his Smiłowice estates to Lieutenant General von Bischofswerder; he held no other property in the country. Xaver von Jezierski, canon in Włocławek and parish priest at Neustadt, was named, in the Memoire and by named persons, as one of those who had stayed most often with Prusimski at Smiłowice before the Kuyavian insurrection and worked most actively to bring it about; he is said to have drafted the proclamations to the people, raised men and sat on the insurgents'' security commission. Against him too only the confiscation proceedings were brought, and his small property, the income of his benefices, was confiscated and he was deprived of the benefices. Neither has been declared to have forfeited his nobility, and no capital punishment has been fixed or reserved against them. The ministers find that by the confiscation, which must stand (a point on which Haugwitz, as outside his department, expresses no opinion), and nine years'' banishment the two have been punished more harshly than many who returned and submitted to a moderate fine or fortress term, and that their part does not mark them out as more dangerous than others who stayed or returned; since they ask only for leave to return, the ministers advise that it might be granted, leaving it to the King''s judgement.'
ihagrrep7cnr3132-006: 'On 10 May 1803, at Potsdam, King Friedrich Wilhelm III ordered the ministers of state Grand Chancellor von Goldbeck and Count von Haugwitz: in view of the reasons in their report of 30 April, and joining the Grand Chancellor in the view that the petitioners Prusimski and Jezierski have been punished hard enough by the confiscation of their estates and nine years'' banishment, the King grants them the leave they asked for to return to their fatherland, and leaves the further dispositions to the ministers.'
ihagrrep7cnr3132-007: On 11 May 1803 Goldbeck and Haugwitz sent, in the King's name, a rescript to the South Prussian Government at Poznań and a resolution to the two petitioners. The rescript returns the 6 volumes of files in the inquiry against the former Starost Anton v. Prusimski and the former canon Xaver von Jezierski, which the Government had sent in with its report of 24 March, and sends a copy of the cabinet order of 10 May, by which both are granted leave to return to their fatherland, the confiscation of their property together with their nine years' banishment being deemed sufficient punishment for their part in the insurrection. The resolution, addressed to Prusimski and Jezierski at Dresden, answers their immediate representation of 27 January of that year. They are granted leave to return to their fatherland, on the assumption that they will conduct themselves there as [loyal?] subjects; the confiscation of their property decreed with final effect stands unalterably, and Jezierski remains deprived of his clerical offices and benefices; otherwise they need fear no further inquiry or punishment for their part in the insurrection. The Government at Poznań was given the necessary orders the same day.
ihagrrep7cnr3132-008: On 30 May 1803 Haugwitz drafted two letters at Berlin, one after the other. The first, to the minister for South Prussia, von Voss, informs him, by an enclosed copy, that the King had granted the former Starost von Prusimski and Xaver von Jezierski leave to return to their fatherland by the cabinet order of 10 May, and asks whether Voss will countersign the notificatorium on the matter to the Chamber at Poznań, enclosed in draft and fair copy. The second, to Goldbeck, thanks him for his letter of 11 May with the news of the return of Prusimski and Xaver von Jezierski, returns the original cabinet order with the drafts and fair copies he has countersigned, and adds that, with von Voss's countersignature, he has already instructed the Chamber at Poznań to have the two now take the oath of allegiance.
ihagrrep7cnr3132-009: On 30 May 1803 Haugwitz drafted a rescript in the King's name to the Chamber at Poznań, for the countersignature of the minister for South Prussia, von Voss. It sends a copy of the cabinet order of 10 May granting the former Starost Anton von Prusimski and the former canon Xaver von Jezierski leave to return to their fatherland, and commands the Chamber now to have both take the oath of allegiance and to report that it has been done.
ihagrrep7cnr3570-001: 'In July 1796 Count Hoym, the minister responsible for South Prussia, proposed granting confiscated and vacant estates there to officers. For Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, a Prussian general, he proposed the estates confiscated from the insurgent Anton von Prusimski: Kamionna, Kolno, Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laski, Osiny, the Trąbczyn Hauland and Brzyce. The King approved this by a cabinet order of 23 July, and also granted estates to von Sanitz, Blücher, von Dolffs, von Pontanus, von Holtzendorff and von Larisch. On 30 July Hoym asked that each deed of gift be drawn "cum appertinentia", with everything belonging to the estate, and the draft of the deed of gift for the Prince was prepared.'
ihagrrep7cnr3705-001: Peter Friedrich von Triebenfeld, the general agent of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, asks the King of Prussia to order the Government at Kalisz to place the Prince's estate of Oleśnica, in his lordships of Trąbczyn and Zagórów, under court administration. Giese, Bagans and Gietzinger had taken it in hereditary lease for 20,000 thalers entry money, but had paid the Prince only 10,000, and that out of money from their own sub-lessees. Since then they had paid him no rent, paid no taxes and sold off parts of the estate, although the war and domains chamber, whose consent a lease of this kind needed, had never confirmed their lease. He disputes the Kalisz government's refusals to act, asks for the files to be called in, and offers security.
ihagrrep7cnr3709-001: On a complaint from Michalina von Prusimska, a minor who was suing Prince Friedrich Ludwig of Hohenlohe-Ingelfingen over her mother's property, King Friedrich Wilhelm III ordered the Government at Poznań, the province's high court, to call in the files of her case as they stood and to send them in at once. The Government sent the King a copy of this order.
ihagrrep7cnr3709-002: On 1 July 1800 the King returned to the Government at Poznań the files of the case of Michalina von Prusimska against the Prince of Hohenlohe-Ingelfingen that it had sent in with its report of 18 June. The Government was to finish preparing the case, which had been much delayed by too much indulgence towards the defendant's agent, with all diligence, and then to have suitable proposals for a settlement made. If no settlement was reached, it was to see to a speedy judgment, especially if the laws should require judgment to be given once more in the first instance. The Government reported that the hearing for taking evidence and closing the proceedings was set for 22 July.
ihagrrep7cnr3709-003: Prince Friedrich Ludwig of Hohenlohe-Ingelfingen wrote to the Grand Chancellor that the minor Michalina von Prusimska had sued him before the Government at Poznań for the recovery of the Brzyce estates, which the King had given him, and that the case was now to be laid before the court for judgment. Since the guardianship board at Poznań conducts the suit in her name and its members are also members of the Government, and so would be his judges, he asked that the judgment be entrusted to the Government at Kalisz and the files sent there. In a covering letter of the same day he wrote that the settlement proposal made by the court's deputy at the last hearing made him fear that the Government at Poznań would not judge impartially. The lifetime right of the plaintiff's father, Antoni Prusimski, who is still living, in his late wife's property is, he says, part of the father's confiscated property; the deputy nevertheless doubted that it belongs to the fisc. The Prince asked again, urgently, that the judgment be entrusted to the Government at Kalisz or to another South Prussian court.
ihagrrep7cnr3709-004: On 7 December 1800 the Grand Chancellor ruled of his own motion that, because most councillors of the Government at Poznań are members of the guardianship board there, which occasioned the suit of the guardian of the minor Michalina von Prusimska against the Prince of Hohenlohe-Ingelfingen for the recovery of the Brzyce estates and directs it, the case is to be decided in the first instance by the full bench of the Government at Warsaw and in the second by the Senate of Higher Appeal of the Kammergericht, the high court in Berlin. The Government at Poznań is to be told; rescripts go also to the Government at Warsaw and to the Senate.
ihagrrep7cnr3709-005: 'On 7 December 1800 three rescripts in the King''s name were drafted to take the suit of Michalina von Prusimska''s guardian against the Prince of Hohenlohe-Ingelfingen for the Brzyce estates away from Poznań. To the Government at Poznań: most of its councillors are members of the guardianship board there, which occasioned and directs the suit; the case will therefore be decided in the first instance by the full bench of the Government at Warsaw and in the second by the Senate of Higher Appeal of the Kammergericht, and both courts have been instructed the same day. To the Government at Warsaw: since the Poznań councillors mostly belong to that board, the case is to be decided in the first instance by its full bench, and the Government at Poznań has been informed. To the Senate of Higher Appeal of the Kammergericht: the case is to be decided in the first instance by the full bench of the Government at Warsaw and in the second by the Senate, and the Governments at Poznań and Warsaw have been instructed. The rescripts went to the post on the 13th.'
ihagrrep7cnr3709-006: A draft reply to the Prince of Hohenlohe-Ingelfingen says that his wish that his case with Michalina von Prusimska's guardian should not be decided by the Government at Poznań is well founded by the one fact that most of the councillors there belong to the guardianship board that occasioned the lawsuit. The writer has therefore ordered that the full bench of the Government at Warsaw decide in the first instance and the Senate of Appeal of the Kammergericht in the second. He chose Warsaw and not Kalisz because the president at Poznań, Count von Danckelmann, has lately moved to the Government at Kalisz.
ihagrrep7cnr3709-007: The Government at Poznań reported that in the case of Michalina von Prusimska's guardian against the Prince of Hohenlohe-Ingelfingen it had already given judgment in the first instance on 9 December 1800, because the cabinet order of 1 July had especially urged speed. If an appeal is lodged, it will send the files to the Senate of Higher Appeal of the Kammergericht for decision in the second instance. The Government at Warsaw was then told that the order of 7 December no longer applied.
ihagrrep7cnr3709-008: A draft royal rescript tells the Government at Warsaw that, although the rescript of 7 December had charged it with the judgment in the first instance in the suit between Michalina von Prusimska's guardian and the Prince of Hohenlohe-Ingelfingen over the Brzyce estates, the Government at Poznań has reported that it gave judgment on the 9th, before the order reached it; the rescript therefore does not apply.
ihagrrep7cnr3709-009: A draft letter to the Prince of Hohenlohe-Ingelfingen says that the Government at Poznań, following the cabinet order of 1 July that urged it to move the case quickly, so hastened his case against Michalina von Prusimska that judgment had already been given when the order of 7 December arrived there. The files are still to be sent to the Senate of Higher Appeal of the Kammergericht for judgment in the second instance.
ihagrrep7cnr3709-010: 'In January 1802 Michalina Prusimska asked King Friedrich Wilhelm III to hasten her case against Prince Friedrich Ludwig of Hohenlohe-Ingelfingen: eighteen months earlier she had handed him a memorandum at Poznań asking for the fortune due to her after her mother''s death, and he had promised to speed justice. After four years the suit begun at Poznań had been decided only in the first instance, and the decision had now gone to the court in Berlin. She is, she writes, an abandoned orphan pleading against the Prince. On 26 January the petition was passed to Minister of State von der Reck to be hastened; on 29 January he had her told that she may expect the appeal judgment to be published.'
ihagrrep7cnr421-001: 'On 8 October 1799 Stanisław von Chełmski of Łukom petitioned the King of Prussia from Kalisz. In 1794 he had lent the Starost Antoni Prusimski 12,000 ducats in gold against a written undertaking, repayable at St John''s Day 1795; before then Prusimski became a fugitive, and by the sentence of confiscation his property was seized by the Fiscus, the Prussian state treasury. After consulting him, Chełmski took possession of Prusimski''s estates of Trąbczyn and Nowawies, but after the judgment of revision had to give them up to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, to whom the King had given them, and was referred with his claim to the Fiscus. The Government at Kalisz answered his suit against the Fiscus of 6 September on 10 September: he must first prove the claim to be a real one, secured on the estates themselves; when he pressed for a hearing to take evidence, citing the cabinet order of 14 September 1796, it dismissed the suit on the 27th. He argues that under that cabinet order the Fiscus takes precedence over all the personal creditors of an insurgent for compensation but ranks after them with the penalty of confiscation, and so must satisfy from the confiscated property a personal claim whose correctness is shown other than by his mere written undertaking; that the explanatory rescript of 17 September 1796 extends the cabinet order and interprets it against its clear content, an interpretation that belongs to the King alone and not to the Chief of Justice; and that even that rescript admits personal suits against the Fiscus, which may lay before the plaintiff a certified statement of the damage of the insurrection showing that the confiscated property does not cover it. He accepts that procedure, reserving his objections to such a liquidation of damages, and asks for a hearing at law and that the Government at Kalisz be instructed to open the taking of evidence on his suit against the Fiscus. On 21 October 1799 the King answered that the Government''s resolution of 10 September stands, since every creditor with personal claims on an insurgent''s property will understand of himself that the costs of the war far exceed the whole estate of such an insurgent.'
ihagrrep7cnr421-002: The South Prussian Government at Kalisz decided Stanisław Chełmski's suit against the Fiscus in two rulings. On 10 September 1799, answering his representation of 6 September, it held that before the suit could go forward he must first prove that his claim is a real one, secured on the confiscated estates themselves, and that he must for that reason be satisfied from the estates. On 27 September it held that, on the ground of the entirely clear content of the judgment of revision, the ruling of the 10th stands, all the more as he treats this claim as a personal one.
ihagrrep7cnr421-003: On 21 October 1799 King Friedrich Wilhelm III answered Stanisław von Chełmski at Kalisz on his claim on the insurgent Antoni Prusimski. In answer to the representation Chełmski submitted on the 8th, the resolution of the Government at Kalisz of 10 September must simply stand, since every creditor with personal claims on the former property of an insurgent will understand of himself that the costs of war spent on putting down the unrest the insurgents raised, and the damage they caused, far exceed the whole estate of such an insurgent.
ihagrrep7cnr421-004: On 7 December 1799 the criminal councillor Mondro, as Chełmski's attorney, asked the King from Kalisz for a preliminary ruling on Stanisław Chełmski's complaint against the Government at Kalisz over the dismissal of his suit against the Fiscus for a claim of 12,000 ducats; Chełmski had submitted the complaint on 9 October and had had no preliminary ruling. The Government's decrees, Mondro writes, confuse the suit Chełmski first brought against Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, as present owner of the Trąbczyn estates confiscated from Prusimski, with the present one, which is directed against the Fiscus alone; Chełmski accepts that the claim cannot be sued for against the Prince, but the court rescript of 17 September 1796 does not prevent him from claiming the capital from the Fiscus under the cabinet order of the 16th of that month, and the rescript itself requires the taking of evidence and a formal judgment where a party does not rest content with a dismissal by decree. He encloses the suit, with the bond, that Chełmski had brought before the Government at Poznań, first against Prusimski, before the judgment of confiscation was passed; when it was resumed against the Fiscus only the person was changed. He asks for a ruling without delay. On 23 December the ministry ordered that Mondro be sent a copy of the answer of 21 October.
ihagrrep7cnr421-005: 'On 1 December 1799 the criminal councillor Mondro, Chełmski''s attorney, sent the King at Kalisz an earlier version of the petition he repeated on 7 December, in the same words: a request for a preliminary ruling on Chełmski''s complaint of 9 October over the dismissal of his suit against the Fiscus for 12,000 ducats; the confusion of the suit against Prince Friedrich Ludwig of Hohenlohe-Ingelfingen with the one against the Fiscus; the court rescript of 17 September 1796 and the cabinet order of the 16th of that month; and the enclosed copy of the suit with the bond.'
ihagrrep7cnr421-006: 'In a suit addressed to the King and dated Poznań, 19 March 1799, Stanisław Chełmski claimed 12,000 ducats from the Starost Anton von Prusimski of Trąbczyn on a note of hand. On 16 June 1794, he writes, he advanced Prusimski 12,000 ducats for one year, to St John''s Day 1795, and received a blank note for it in the presence of Jacob von Bieńkowski of Mierzewo near Gniezno and Antonius v Przeradzki; it was agreed that if payment was not made at the fixed date he might treat the note as a contract of antichresis (the pledge''s income in place of interest) and take possession of the estates as a pledge. It was not paid on the agreed date, and he took possession. Meanwhile the Fiscus charged Prusimski with taking part in the insurrection of 1794; as he had not returned, his property was to be seized in May, which Chełmski forestalled by taking possession in June. The Fiscus brought a suit for eviction on 7 December 1795; at the hearing of 27 February a settlement was made: Chełmski was to sequestrate the estates, first deduct the interest for delay at 7 per cent from the income, then render account, and, it seems, still pursue further claims at law. He asked for a hearing to take evidence and that Prusimski be condemned to pay the 12,000 ducats and interest for delay at 7 per cent, with costs, and refers to the witnesses. Prusimski''s Polish undertaking, made at Łukom on 16 June 1794, secures to Stanisław Chełmski, Treasurer of Wschowa, payment on the eve of St John the Baptist 1795 of the 12,000 Dutch ducats in gold named in the blank note, without interest: if Prusimski does not pay, Chełmski may enter his estates, the villages of Trąbczyn, Nowawies, Osiny, Zarobna, Łazy and all the Hollanders of the estate, excepting no village or wood, only the ironworks, a magazine and the stores of timber for it, and hold them in lieu of interest, without account, until the sum is repaid; the undertaking is to have the force of one made before a court. Prusimski signed it before two witnesses, Jakub Bieńkowski and Antoni Przeradzki.'
ihagrrep7cnr421-007: 'On 23 December 1799 the ministry at Berlin answered the criminal councillor Mondro at Kalisz, Chełmski''s attorney, on Chełmski''s complaints against the Government at Kalisz over the dismissal of his suit against the Fiscus: from the enclosed copy of the answer given to Chełmski on 21 October he can see how Chełmski''s complaints had already been answered.'
iharep162nr295-001: 'On 28 January 1805, at Berlin, the Councillor of War and Forests Peter Friedrich August von Triebenfeld, agent of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, bound himself by a bond for a loan: the third department of the Supreme War College had granted him 50,000 Thaler Courant out of the General Invalids'' Fund of the Prussian army and paid it out in bonds of the Seehandlung, the Prussian state bank. He promises to repay it after six months'' notice, which either side may give, and until then to pay 5 per cent interest in half-yearly instalments at Berlin. As security he pledges his whole property and, specially, the Prince''s bond to him of 1 June 1804 for 250,000 Thaler, registered on the Prince''s South Prussian estates of Zagórów, Drzewce, Kopojno, Świątniki, Skokum, Oleśnica, Wrąbczyn and Grądzyń. In case of non-payment he cedes 50,000 Thaler of it to the fund, with priority over the 200,000 that remain his. The same day he acknowledged the deed before the first Kurmark justice office at Berlin.'
iharep162nr295-002: On 5 March 1805 the South Prussian Government at Kalisz certified, in the King's name, that Triebenfeld had appeared at Kalisz on 27 February 1805 before the Government Councillor Stosch as commissary and once more acknowledged his deed of debt and pledge of 28 January for 50,000 Thaler from the General Invalids' Fund, and likewise the protocol of acknowledgement standing under the bond; the Government Councillor von Lichnowski vouched for his identity. On 13 March 1805, on the ground of a decree of the 5th of the month, the clerk Beda entered the 50,000 Thaler, bearing 5 per cent interest and payable after six months' notice, for the Invalids' Fund in the mortgage book of the Konin district upon Zagórów, Drzewce and Kopojno.
iharep162nr295-003: 'On 13 March 1805 the South Prussian Government at Kalisz issued to the General Invalids'' Fund a mortgage certificate for the town of Zagórów in the Konin district, listing what was charged on it. Prince Friedrich Ludwig of Hohenlohe-Ingelfingen holds the estate by the deed of grant of King Friedrich Wilhelm II of 19 June 1797; his title of possession was registered by a decree of 31 July 1801. As perpetual charges there stand on it a yearly due of 88 Reichsthaler 5 Groschen 9 Pfennig to the Kalisz Treasury of War and Domains, and a caveat of the Treasury for building timber and firewood from the estate''s forests, after the confiscation of the ecclesiastical estates. There also stands a caveat for Johann Giese, Johann Bagans and Friedrich Gietzinger for the rights of wood and pasture that their hereditary lease of Oleśnica of 22 February 1804 gives them in the Zagórów forests. As debts there stand on it: a caveat for the Provincial Elder von Lichnowski at Brzeg for a claim of 32,300 Reichsthaler already registered on Trąbczyn; 250,000 Reichsthaler for Triebenfeld under the Prince''s bond of 1 June 1804; and 50,000 Reichsthaler of these, which Triebenfeld has pledged and ceded to the Invalids'' Fund, with priority over the remainder.'
iiihamdaiiinr12366-001: 'On 20 January 1819 Alopeus, the Russian envoy at Berlin, sent the Prussian foreign minister Count Bernstorff, on the orders of his court, a report of the Viceroy of the Kingdom of Poland, of 29 April 1818, on a claim that Countess Michalina Miączyńska, born Prusimska, made against the Prussian government, and supported it. The report, he wrote, contains arguments so conclusive that he has nothing to add; he asked Bernstorff to recommend the Countess''s case to the authorities who will have to decide it. The report sets out her claim as the commissioners for the liquidation of the former Duchy of Warsaw stated it. Her hereditary estates were confiscated from her father, the Starost Prusimski, by the Prussian government in 1796 and given to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen and General Sanitz; a decision of the Duchy''s governing commission of 21 July 1807 put her back in possession. She asks that the debts the donees raised on the estates be charged to Prussia: the Prince, the report says, loaded Trąbczyn and Szetlewek with 156,000 thalers, and Kolno and Kamionna, which he sold to the bank cashier Leixner for 142,000 thalers, carry 160,000 thalers. The report argues that as an orphan under age she was entitled to the protection of the Prussian government, that Niemojewski and Wichrowski recovered their estates free of debt, and that Prussia compensated Generals Sanitz and Zastrow with other estates for those returned. It could compensate the Prince in the same way, by taking over his debts. A Prussian ministry official objected in pencil in the margin: Prussia is answerable to no one for acts of government in the former South Prussia. Not even Napoleon granted a claim for what was done in the years between. The donee, for as long as he possessed the estate, possessed it lawfully and with full right of ownership.'
iiihamdaiiinr12366-002: In a draft reply to the Russian envoy Alopeus on the claims of Countess Michalina Miączyńska, the Prussian foreign minister states that the Starost Prusimski took part in the Polish uprising and fled; his estates were confiscated by a court's judgment, the King disposed of them, and the donees raised mortgages on them. Prusimski died abroad in 1803, and after the Peace of Tilsit his daughter received the estates back from the government of the Duchy of Warsaw. She now asks that the debts resting on the estates be paid off. The Prussian government has refused the request once already; after a fresh examination the decision of the Prussian courts stands, and an enclosed memorandum sets out its reasons.
iiihamdaiiinr12366-003: The advocate Tarczewski at Warsaw tells a client, who is not named, that Mitschke at Kalisz has sent him the files of the suit against Madame Miączyńska. They are in order; only the mortgage certificates for the sum claimed are missing, and these must be produced in the original or in certified copies. The other side is pressing to bring the case before the court of appeal. He is drawing out the preparation of the case, but once all the time limits are used up it will have to go to judgment.
iiihamdaiiinr12366-004: General von Schöler, the Prussian envoy at St Petersburg, wrote to the Russian foreign minister Count Nesselrode about the claim of the Breslau merchant Weigel. Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, to whom King Friedrich Wilhelm II gave the confiscated lordship of Trąbczyn on 9 August 1796, borrowed 30,000 thalers from Grotowski; the mortgage was assigned through the court to Weigel. In 1807 the governing commission of the Duchy of Warsaw returned the estates to Prusimski's daughter Michalina, now Countess Miączyńska; the registered claims remained. When the interest went unpaid Weigel sued; the civil tribunal at Kalisz dismissed his suit on 6 March 1819 and ordered the claim struck out. Prussia asked in 1819 and 1820, without an answer, that the question be kept for diplomatic negotiation; meanwhile the court of appeal set the judgment aside, but the high tribunal at Warsaw confirmed it on 17 July 1826. Schöler relies on the Peace of Tilsit and on the conventions of 1815 and 1819, which uphold mortgage claims, and asks that the judgment be annulled and, first of all, that its execution be suspended.
iiihamdaiiinr12366-005: 'On 30 July 1827 the civil tribunal of first instance of the Kalisz voivodeship gave judgment in the suit of Michalina Miączyńska, born Prusimska, with her husband Count Stanisław Miączyński, the spouses together heirs of the Trąbczyn estates, against the Lichnowski brothers, as heirs of Karl Heinrich Lichnowski, and Maria Anna, born Blacha, the widow of Franciszek Grotowski. The court rejected two objections to the summons and reasoned as follows: Trąbczyn and Szetlewek belonged to Antoni Prusimski, were confiscated from him for his part in the uprising and given to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen; the governing commission returned them to the plaintiff. The Prince, it held, was only a conditional possessor, the debts he raised lapsed with his title, and the Treaty of Tilsit does not change this; against Weigel the plaintiff had already won final judgments in the same matter. It ordered the claim of the Lichnowski brothers and that of Grotowski''s widow struck out of the mortgage register of Trąbczyn and Szetlewek and awarded costs against the defendants.'
iiihamdaiiinr12367-001: 'On 7 February 1828 Baron Mohrenheim, who directed the diplomatic chancellery of Grand Duke Constantine at Warsaw, answered the note of 6 February from the Prussian consul general Schmidt: he was not losing sight of the matter of Weigel, the banker at Wrocław whose mortgage on the Trąbczyn estates the Polish courts had struck out, and once the Grand Duke had returned would tell Schmidt what it had been possible to settle.'
iiihamdaiiinr12367-002: In an undated note to the Prussian consul general Schmidt, written as he was leaving, Baron Mohrenheim says that the day before he had read to the council his memorandum on the affair of the bankers Weigel and Eisenhardt, and that the council recognised unanimously that payment must be made. How it is to be made will be deliberated.
iiihamdaiiinr12367-003: In another undated note to the Prussian consul general Schmidt, written on a Tuesday, Baron Mohrenheim returns Schmidt's "Dubois", which he says he read with great interest, and asks pressingly for the continuation. He will push the Weigel matter; Schmidt should be easy about the rest, they will come out of it with honour. He has dreadful weather where he is, which at times dampens his pleasure in the country. He also asks Schmidt to let him have something for two days; what it is is unclear.
iiihamdaiiinr12367-004: On 20 February 1830 Baron Mohrenheim told the Prussian consul general Schmidt that he had laid Schmidt's note of 18 February before Grand Duke Constantine. The Administrative Council had reported to the Grand Duke in August of the previous year that the competence of the courts which had ruled in the case of the bankers Weigel and Eisenhardt was recognised as open to question, because by its nature the case could be resolved only by diplomatic means. The Council had therefore authorised the Commission of Finance and Treasury to declare a conflict of jurisdiction and to bring it before the general assembly of the Council of State for decision. Having heard nothing further since, the Grand Duke has asked the Council to hasten the conclusion of the matter.
iiihamdaiiinr12367-005: A letter from Warsaw tells the Prussian consul general Schmidt that its writer has laid Schmidt's note of 26 July, on the suit pending before the courts of the Kingdom of Poland between Madame Miączyńska and her creditors over the debts contracted by Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, before the minister of finance. As Schmidt wished, he has also reminded the minister of the claim that the banker Weigel raises against the treasury of the Kingdom because judgments denied him a debt of this kind. From two enclosed pieces Schmidt will see that his communications have brought about the measures needed, and that his note of 26 July did the Polish administration a signal service by warning it in time against an unfavourable outcome of these suits.
iiihamdaiiinr12367-006: 'Prince Lubecki, the minister of finance of the Kingdom of Poland, wrote to the banker Weigel that he had received Weigel''s letter of 10 August and its renewal of 14 September, which ask compensation for the losses Weigel suffered when the courts of the country had his claim of 30,000 thalers struck off the Trąbczyn estates. With the first letter came a reckoning: 30,000 thalers of capital, 31,800 of interest and 1,300 of costs, 63,100 thalers in all. Lubecki finds this demand excessive, because under the laws in force in the country Weigel could never have obtained so much even had the suit gone wholly in his favour. Wishing nonetheless to make good the losses really suffered, not the nominal ones, he has ordered the value of the estates once charged with the claim to be established on the spot, so as to assess the real value of the capital lost. That is why he has not yet been able to give a detailed answer.'
iiihamdaiiinr12367-007: Weigel replied from Wrocław to the minister of finance, Prince Lubecki, answering his letter of 22 September, and sent certified copies of the mortgage certificate of 14 August 1803 and of the court valuation of 6 May 1803 for the estates of Trąbczyn, Osiny, Łazy, Nowawieś, Zarobna and the Trąbczyn settlers' villages. By the mortgage certificate the estates are taken to be worth 160,000 Reichstaler. Entered ahead of his claim are church capitals of 7,000 florins or 1,166 Reichstaler 16 groschen, 5,000 for von Przepolewski, though paid, and 42,000 for von Lichnowski, 48,166 Reichstaler 16 groschen together. For his own entry, made for von Grottowski and now standing in his name, 111,833 Reichstaler 8 groschen remained, which is 48,733 Reichstaler 8 groschen more than his claim of 63,100. The valuation, he says, was drawn up on the low principles used for assessing crown domains and so comes to only 128,917 Reichstaler 17 groschen; even of that, 80,751 Reichstaler 1 groschen remain to cover him once the prior entries are deducted. His claim was therefore wholly secure, and had he not been denied the help of the law he could have paid off the prior entries and bid at the forced sale. He expects the Prince to bring about his satisfaction and to set an early date for an agreement, at which he or an agent would appear. Lubecki answered that he has passed the papers valuing the Trąbczyn estates, which Weigel sent with his submission of 14 October 1830, to the authority he has charged with assessing what the estates are worth now. Weigel holds that by the court valuation his capital was fully secured on Trąbczyn; but that valuation was made in 1803, at a time of inflated land prices. The real value of the claim must be reckoned by what landed property is worth today, because the last judgment in Weigel's case was given in 1826 and only from then could execution have been sought. As Weigel's letter offers no more acceptable terms for a settlement, he must await the completion of the work he mentioned in his reply of 22 September, which he is seeing hastened.
iiihamdaiiinr12367-008: A letter from Warsaw signed R. Fuhrmann tells the Prussian consul general Schmidt that, following Schmidt's intervention of 10 December 1831 in support of Weigel's request, the writer has ordered the finance commission to hasten the valuation of the domain of Trąbczyn, to examine at the same time how well secured the capital is that Weigel has on that estate, and to lay the matter before him. The commission was already charged with this work the year before. The special authority that His Majesty had given Prince Lubecki to treat with Weigel can serve no one else, and he has taken the steps needed to remove that obstacle. As soon as both difficulties are lifted he will do all he can so that the well-founded claims of a Prussian subject succeed promptly.
iiihamdaiiinr12367-009: Engel, who headed the provisional government at Warsaw, reports to the Prussian consul general Schmidt, referring to Schmidt's note of 12 February, that the councillor of state Joseph Lubowidzki, president of the Bank of Poland, has been charged by order of the Emperor and King with carrying out the convention of 29 May 1830 and has received the necessary instructions. This new commissioner is also authorised to settle the questions arising from the claim of the banker Weigel. Engel hopes he will justify the Emperor's confidence and work for the adjustment of every point still to be finally settled between the government of Poland and that of the King of Prussia.
iiihamdaiiinr12367-010: Another letter from Warsaw to the Prussian consul general Schmidt, answering his note of 1 March on the settlement of the affair of Weigel of Wrocław, says that, as a result of the measures the writer took and reported to Schmidt on 24 December of the previous year, the Commission of Finance and Treasury on 29 February charged Mr Drake, a commissioner in the department of state domains, with valuing the Trąbczyn estates. The work will take some time; as soon as it is finished he will inform Schmidt. He asks him meanwhile to tell the trading house of Weigel.
iiihamdaiiinr12765-001: 'Peter Friedrich von Triebenfeld, general agent of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, reminded the Prussian State Chancellor Hardenberg that on 6 May in Paris he had handed him a letter from the Prince to the Russian Emperor. He enclosed a copy of the resolution issued on it on 14 May and asked to be allowed to bring the matter, which was important to the Prince, back to mind at what was now the decisive moment. The reply drafted on 25 November 1814 said that the matter of the Prince''s claims to Trąbczyn and Kamionna would settle itself as soon as the general settlement and agreement regarding the Duchy of Warsaw was carried out. The enclosed resolution is Hardenberg''s letter to Triebenfeld of 14 May 1814: he said the claims of the Prince to the South Prussian estates of Trąbczyn and Kamionna, given to him in 1796, could only be raised with any prospect of success once definitive arrangements had been made about the Warsaw affairs, which was not yet the case. Hardenberg was therefore holding back the Prince''s letter to Emperor Alexander and asked that this be made known to the Prince.'
iiihamdaiiinr12765-002: 'In March 1815 Triebenfeld described the case to Hardenberg: in 1796 the Prince of Hohenlohe-Ingelfingen received Kamionna and Kolno, Trąbczyn with its villages in the district of Konin, and Brzyce, which had been confiscated from the fugitive Antoni Prusimski. He sold Kamionna and Kolno in 1804 to Leixner, a bank director. In 1807 the Polish administrative commission took all the estates without a judgment and gave them to Prusimski''s daughter Miączyńska; the tribunal at Kalisz declared that it had no authority in the matter. Triebenfeld asked that the estates sold to Leixner be returned to the Prince and that the Russian Emperor be moved to return the Trąbczyn estates together with nine years'' revenue, 36,500 Reichsthaler.'
iiihamdaiiinr12765-003: A draft reply to Triebenfeld says that a diplomatic negotiation has been opened about compensating the grantees of South Prussian estates who have been deprived of their possession since the Peace of Tilsit, and that its outcome will be communicated to the Prince. Leixner, the bank director to whom the Prince had sold Kolno and Kamionna, did not come under judicial investigation through the loss of those estates, it says, but through the irregular management of his post and the unauthorised pledging of an asset registered there for the merchant Simon.
iiihamdaiiinr12765-004: Prince Friedrich Ludwig of Hohenlohe-Ingelfingen wrote to Baron vom Stein, in French, asking him to obtain from the Russian Emperor compensation for Kamionna and Trąbczyn, which were granted to him in 1796 and taken from him in 1807 by the Polish treasury and awarded to Prusimski's daughter. He says that to free the mortgaged estates he had to pay 55,000 Reichsthaler; his claim in cash amounts to 85,400 Reichsthaler and his total loss to 325,400 Reichsthaler. A note on the letter says the reply should be that the settlement of Polish affairs must be awaited.
iiihamdaiiinr12765-005: In a draft reply to the Prince of Hohenlohe-Ingelfingen, Hardenberg says that Stein has passed on to him the Prince's letter of the 12th. The Prince should wait, with his claim to Kamionna and Trąbczyn, for the final settlement of Polish affairs, which does not seem far off. Hardenberg says he will then do everything he can to support the request with the King.
iiihamdaiiinr12765-006: 'Prince Friedrich Ludwig of Hohenlohe-Ingelfingen wrote to Hardenberg that the district of his Trąbczyn estates falls under Russian sovereignty; since both sovereigns have confirmed the acts of the Polish commission that gave the estates to Prusimski''s daughter, he says the estates are lost to him, and the donees should be compensated with other estates. He says his loss amounts to more than 261,000 Reichsthaler. He would be satisfied with the small domain of Sokolnik, which yields 8 to 10,000 Reichsthaler in rent, and he asks Hardenberg to intercede for this with the Russian Emperor. On 6 June 1815 two drafts were written. The first is Hardenberg''s reply to the Prince concerning his letter of the 12th of the previous month about the Trąbczyn estates: another minister has also passed on to him the letter addressed to that minister regarding Kamionna and Trąbczyn; he has asked Zerboni to inform him fully about both estates, and he reserves the right to notify the Prince of his further steps. The second is a letter to Zerboni in Poznań: Hardenberg sends, in the original, two letters of the Prince, one to himself and one to Stein, concerning the claims over the confiscated estates of Kamionna and Trąbczyn, and asks to be told what steps can still be taken in the Prince''s favour. He says the Prince sold Kamionna to Leixner, and that the 55,000 Reichsthaler and interest are owed to the bank. He expects Zerboni''s report as soon as possible.'
iiihamdaiiinr12765-007: In a cancelled draft reply to the Prince of Hohenlohe-Ingelfingen, Hardenberg says the territorial arrangements of the Duchy of Warsaw have been settled definitively for the provinces returning to Prussia; the compensation of the holders of royal grants is reserved for a separate negotiation, which has already been begun. It would be a particular pleasure for him to find in it an opportunity to further the compensation for the Trąbczyn estates taken from the Prince.
iiihamdaiiinr12765-008: Hardenberg replied to the Prince of Hohenlohe-Ingelfingen that the territorial arrangements of the Duchy of Warsaw had been finally settled as regards the provinces returning to Prussia, and that compensation of the holders of royal grants had been reserved for a separate negotiation. He said he would seek an opportunity in the course of it to further the compensation for the Trąbczyn estates taken from the Prince.
iiihamdaiiinr12765-009: A reply in French to the Prince of Hohenlohe-Ingelfingen says that Stein has passed on his letter of the 12th of the previous month. The Prince is asked to wait, with his claim to Kamionna and Trąbczyn, for the final settlement of Polish affairs; the writer says he will then do everything he can to support the request with the King.
iiihamdaiiinr12765-010: Zerboni reported to Hardenberg that the Prince of Hohenlohe-Ingelfingen sold Kolno and Kamionna to Leixner before 1806, but not Trąbczyn, and that all the estates passed back in 1806/7 to the heirs of the previous owner. He says a certain Schenck, acting as authorised agent, is claiming 318,500 Reichsthaler in compensation, best provided through the office of Sokolnik. Zerboni considers the calculations nonsense; he says the Prince let Trąbczyn fall into disrepair and burdened it with debts. The Prussian cabinet, he says, can only induce the Russian cabinet to compensate the Prince. A note records that Triebenfeld and Leixner have died.
iiihamdaiiinr12765-011: On 20 April 1816 it was ordered, following Zerboni's proposal, that Schöler in St Petersburg be instructed to bring the wish of the Prince of Hohenlohe-Ingelfingen to the Russian Emperor's notice only in quite general terms, since it is purely a matter of grace. The Prince is to be informed, in Hardenberg's name, that his claim for compensation is being brought to the Emperor's notice through the royal legation.
iiihamdaiiinr12765-012: In a draft letter to the Prince of Hohenlohe-Ingelfingen, Hardenberg says he has today informed the Prussian envoy in St Petersburg, Major General von Schöler, of the request for compensation for the Trąbczyn estates and instructed him to bring it to the attention of the Emperor of Russia and to support the application as well as he could. He leaves it to the Prince to pursue his case directly in St Petersburg from now on, and wishes him the most favourable success.
iiihamdaiiinr12765-013: A draft instruction to Schöler, the Prussian envoy at St Petersburg, says that Prince Friedrich Ludwig of Hohenlohe-Ingelfingen received the Trąbczyn estates from the late King Friedrich Wilhelm II; they had formerly belonged to the Starost Prusimski and in 1806 and 1807 they passed back to his daughter Miączyńska, whose possession the Emperor of Russia confirmed. Since some other grantees in the Kingdom of Poland have been compensated, the Prince too is making a claim. Schöler is to bring the request to the Emperor's notice, but only in general terms and without supporting it urgently, since it is a matter of grace.
iiihamdaiiinr12765-014: A note of 1816 records that a report in the matter of the Prince of Hohenlohe-Ingelfingen's claim was passed to the third section of the Department of Foreign Affairs and attached to the file.
iiihamdaiiinr12765-015: 'The widow von Brehmer asked Hardenberg for help: she says her late brother, Major von Seehausen, lent Prince Friedrich Ludwig of Hohenlohe-Ingelfingen 5,000 Reichsthaler in 1803 against the pledge of the Szetlewek estate. She says the Prince paid neither the capital nor the interest, and that in 1807 the estate was taken from him and given back to the heiress of its former owner. She asked to be satisfied out of the Prince''s remaining property. Stägemann noted in the margin that any compensation from the Russian Emperor must benefit the creditors registered against the estates.'
iiihamdaiiinr12765-016: Two orders followed. The widow von Brehmer is to be informed that, in respect of her capital of 5,000 Reichsthaler registered against Szetlewek, she must first sue the Prince of Hohenlohe-Ingelfingen before his own court, so that the claim is legally established. Schöler is to be told that the mortgage creditors are in danger of losing their capital, since the Prince is said to have let Trąbczyn deteriorate and to have burdened it with debts; he is to report if the Emperor grants compensation.
iiihamdaiiinr12765-017: A draft reply tells the widow Brehmer that her petition of 26 April addressed to Hardenberg has been passed to the ministry. If she wishes to seek satisfaction for the capital of 5,000 Reichsthaler registered on Szetlewek out of the remaining property of the Prince of Hohenlohe-Ingelfingen, she must first sue him before his own court in order to establish the claim at law, in case the Emperor of Russia should declare himself willing to grant the Prince compensation. A draft letter to Schöler says that the mortgage creditors are in danger of losing their capital, since the Prince has let Trąbczyn deteriorate and has burdened it with debts; Schöler is asked to raise this and to send word if the Emperor grants the Prince compensation, so that the creditors can pursue their claims.
iiihamdaiiinr12765-018: The widow von Brehmer submitted to the ministry a legally binding judgment of the former South Prussian Government at Kalisz of 1806, by which Prince Friedrich Ludwig of Hohenlohe-Ingelfingen was ordered to pay the 5,000 Reichsthaler together with interest, and the will of her brother, Major von Seehausen. She asked the ministry to intercede on her behalf regarding the capital and the interest. The ministry ordered that nothing further could be done as circumstances stood.
iiihamdaiiinr12765-019: A draft reply tells the widow Brehmer that the ministry has already informed the legation at St Petersburg that the mortgage creditors of the Prince of Hohenlohe-Ingelfingen are in danger of losing their capital. It can do no more for her; she must look after her own rights herself should the Emperor grant the Prince compensation. The papers she submitted on 25 July are returned.
iiihamdaiiinr12765-020: Schöler reported from St Petersburg that on 17 May he had handed the Russian foreign minister Count Nesselrode a note in the matter of the Prince of Hohenlohe-Ingelfingen's claim for compensation, and that in a later note of 1 August he had raised the point touched on in the ministry's order of 29 June. The answer, given only the day before, was a refusal. The ministry directed that a copy of the enclosure be sent to the Prince.
iiihamdaiiinr12765-021: The Prussian foreign ministry sends Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, on 22 December 1816, a copy of the Russian ministry's answer to the intercession of the Prussian legation at St Petersburg for the compensation he had sought for his estates of Kamionna and Trąbczyn, and regrets that, despite the legation's efforts, no favourable result could be brought about.
iiihamdaiiinr12765-022: 'The Russian envoy at Berlin, Alopeus, tells Ancillon on 31 January 1820 that the Emperor cannot act on Duke Eugen of Württemberg''s recommendation of two claims against the Kingdom of Poland, those of the heirs of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen and of Count Bethusy. The heirs cite as precedent Generals von Zastrow and von Sanitz, who were compensated by the Prussian government; but the Emperor had already refused the claim in 1816, in discussions with General von Schöler. Count Ernst Bethusy, who owns land in the Kingdom of Poland and in Prussian Silesia, had asked, with his three sons, for the benefits that Article 18 of the Treaty of Vienna gives owners whose land is cut through by the border. The Polish government refused: Prince Zajączek reported to the Emperor that the article covers only properties cut through by the border between the Kingdom of Poland and the Grand Duchy of Poznań, and that Bethusy evidently wants only to export iron ore for his ironworks in Silesia, which the customs regulations forbid.'
iiihamdaiiinr12765-023: On 13 May 1820 the Prussian foreign ministry tells the Minister of the Interior, von Schuckmann, that the heirs of the late Prince Friedrich Ludwig of Hohenlohe-Ingelfingen and Count Bethusy of Silesia had themselves represented before the Russian government by Prince Eugen of Württemberg, and that, according to the Russian envoy's note, the Emperor has refused both requests. The heirs had asked for compensation for the estates of Kamionna and Trąbczyn taken from the Prince; since this is a mere matter of grace, no intervention can take place. Bethusy had asked for free traffic between his possessions in Silesia and Poland; the ministry holds his request inadmissible, since his possessions are not cut through by the new border but lie far apart in different provinces. It leaves further action to the Minister.
iiihamdaiiinr12765-024: On 19 May 1820 the Minister of the Interior, Schuckmann, tells the Prussian Ministry of Foreign Affairs that he agrees that Count Bethusy's claim to free movement between his estates in Silesia and the Kingdom of Poland is inadmissible, even under the Prussian-Russian treaty of 21 April and 3 May 1815. Bethusy and the heirs of the late Prince Friedrich Ludwig of Hohenlohe-Ingelfingen had applied to the Russian government through Prince Eugen of Württemberg, and it had refused. Schuckmann has told Bethusy so, citing Article 18, and adding that the Prussian government would have objected if the Russian government had granted the request.
kdw-001: At Gniezno, on 31 August 1173, Duke Mieszko of Poland gives the Cistercian abbey of Ląd, his own foundation, at the request of Abbot Bertold, the estate of "parvum Vronchin", today Wrąbczynek, with salt, lakes, fishing and hunting, free of all the rights of Poland, to be held by hereditary right. The editors judge the script of the original to be of the first half of the thirteenth century.
kdw-002: Archbishop Fulko of Gniezno gives the Cistercian abbey of Ląd the tithes of the chapels of St Peter and St Andrew, among them those from Zagórów, Skokum, Kopojno, Trąbczyn, Szetlew, Łukom and Wrąbczyn, even if the villages are divided, moved or called by another name. The gift is dated 30 September 1240, a year the editors mark "sic".
kdw-003: At Gniezno, on 4 May 1243, Duke Przemysł of Poland, with his brother Bolesław and their mother Jadwiga, gives the hospital of Gniezno to the canons of the Holy Sepulchre at Miechów under their provost Henryk, with the consent of Archbishop Fulko; the hospital is to care for the sick and keep poor scholars. The hospital's villages are listed and freed of dues. Among them is "Chemelino", which the editors identify as Imielno.
kdw-004: At Sechowa, on 10 December 1261, Duke Bolesław of Poland confirms to the Cistercian abbey of Ląd the estates and liberties Duke Mieszko had given it at its foundation in 1145, and adds new ones. Among them are Szetlew with the cooks, Rzgów with the sanctuary people (Świątniki, in the editors' note), and Zagórów, Skokum and Oleśnica, given to the abbey by nobles of Poland; Kopojno marks a boundary.
kdw-005: At Dłusk, on 27 March 1276, Duke Bolesław of Poland gives the village of Trąbczyn ("Trupcino") to Count Mikołaj, treasurer of Ląd, and his heirs, free of the ducal dues. The duke had given the village before to Count Janko son of Szymon and then to a priest Mikołaj, both of whom died without heirs.
kdw-006: 'At Kalisz, on 18 October 1280, Duke Przemysł II renews Duke Mieszko''s privilege for the Cistercian abbey of Ląd: he confirms its villages with their people, dues and services, among them Szechouo with the cooks (in the editors'' view probably Szetlew) and Irgouo with the sanctuary people (Świątniki, in the editors'' view), and three markets with inns, and frees the people of all ducal burdens and courts.'
kdw-007: At Gniezno, on 21 October 1291, Duke Przemysł II of Greater Poland confirms the exchange by which the Cistercian abbey of Ląd gave its estates of Głowiew, Sławsk and Chocicza for Kopojno, the estate of Count Sędziwój the under-chamberlain, and endows Kopojno with the widest liberties.
kdw-008: 'At Kalisz, on 29 September 1292, Duke Przemysł II of Poland confirms an exchange made five years before: Wojsław son of Gosław gives his estate of Niałek for the estates of Wrąbczyn ("Wroncino") and Bieganin of Wisław son of Gerlach.'
kdw-009: At Pyzdry, on 13 November 1346, Dobiesław, judge of the lands of Gniezno and Kalisz, adjudges the estates of Stropiszyn and Pępocin to the church of Gniezno against the claims of the brothers Jan and Przedpełk, heirs of Trąbczyn, and the estate of Kokanin against the suit of Pietrasz, heir of Rzegocin.
kdw-010: On the same day, 13 November 1346, at Pyzdry, Dobiesław, judge of the lands of Gniezno and Kalisz, adjudges the estates of Stropiszyn and Pępocin to the church of Gniezno against the claims of Andrzej, heir of Trąbczyn, and his kin, who are put to perpetual silence.
kdw-011: At Gniezno, on 27 May 1377, Przecław, palatine of Kalisz, and the other judges declare before King Louis that the villages of Wrąbczynek and Adamierz, with the mill near the town of Pyzdry, have belonged to the Cistercian abbey of Ląd from of old.
kdw-012: At Poznań, on 31 January 1384, Mikołaj of Wenecja, judge of Kalisz, decides a suit between Piotrko, heir of Łęg, and Rudger, key-keeper of the Cistercian abbey of Ląd, and adjudges to the abbey the investiture of the estate of "Vronczino"; Piotrko and his brother may still pursue it at law. The editors take the estate to be Wrąbczyn or Wrąbczynek.
kdw-013: 'In the stone room of the Cistercian abbey of Ląd, on 13 October 1399, Archbishop Dobrogost of Gniezno decides the dispute between the abbey and Jan, parish priest of Trąbczyn: the sheaf tithe of the fields of the village of Trąbczyn belongs to the abbey.'
kdw-014: At Niepołomice, on 19 November 1407, King Władysław II of Poland allows Abbot Gerhard and the convent of Ląd to found a town at their village of Zagórów in the district of Konin, and gives it German, Magdeburg law, free of the jurisdiction of the royal officers, with a weekly market on Wednesdays.
kdw-015: At Ląd, on 30 November 1411, Abbot Gerhard of Ląd exchanges with Piotr, schultheiss in Nowe Zagórowo, also called Drzewiec, the schultheiss's office in Drzewiec for that in Kownaty, and sells him a mansus and a half there for twelve marks. The free years, rents and services of the schultheiss and the peasants of Kownaty are fixed.
kdw-016: At Ląd, on 13 June 1414, Mikołaj Kicki, archdeacon of Gniezno, attests that Paweł, rector of Zagórów, gives up the parish church of Zagórów, which the Pope had incorporated into the abbey of Ląd, to Abbot Gerard and the convent; in return the abbey takes him in for life with food, clothing and a servant. A Przybysław, servant of the church of Zagórów, is a witness.
kdw-017: At Gniezno, on 16 April 1415, Jan of Szczekociny, captain general of Greater Poland, attests that the brothers Swanseck and Supracht of Gulczewo have sold Abbot Gerhard and the convent of Ląd their plot by the church of St Lawrence in the suburb of Gniezno for sixteen marks. Among the witnesses are Mikołaj and Andrzej of Trąbczyn. The copy gives the year as 1414, which the editors take to be a copyist's error.
kdw-018: At Ląd, on 3 June 1418, Abbot Zygfryd and the convent of Ląd exchange with the peasant Wawrzyniec Jeleniowicz their farm in Great Wrąbczyn, with the meadows Obroczna and Dokolowka, for his farm in Drzewce, and for his beehives in the forest between Great Wrąbczyn and Zagórów give him four gardeners; he pays a mark and a half in rent and guards the forest. The editors place Wronczyn in the district of Poznań, but the document locates it beside Zagórów.
kdw-019: At Trąbczyn, on 15 May 1434, in the house of his mother Mścichna, Wojciech son of Otto of Trąbczyn, canon of Kruszwica, appoints his brother Jan, heir in Trąbczyn, his proctor, to collect from Jarand, scholastic of Kruszwica, seventy Hungarian florins owed him under an agreement over a prebend at Wieluń. The copy gives the year as 1435, which the editors read as 1434.
kdw-020: 'At Buda, on 10 August 1440, King Władysław III charges 300 marks for Stanisław Czarny on the royal villages of Wrąbczynek, Adamierz and Borzykowo in the district of Pyzdry, until they are repaid: a hundred marks for a horse, two hundred for his services on the journey to Hungary for the coronation.'
kdw-021: At Buda, on 22 November 1440, King Władysław III charges a further 200 marks for Stanisław Czarny of Pietrzyków, for his services at the coronation in Hungary, on the villages of Adamierz, Borzykowo and Wrąbczynek, which he is allowed to redeem from the hands of Bartosz Płomikowski.
kdw-022: At Kopojno, on 17 June 1241, before Bosek, castellan of Ląd, the treasurer Mikołaj and others, Duke Kazimierz of Kujawy and Ląd exchanges with Jan, abbot of Ląd, and his brothers his estates of Glovevo (Głowiewo) and Wronecino (Wrąbczyn), once the huntsmen's land, for their estate of Coscheno (Koszanów), and grants the two villages the same liberty as the other estates of their church.
kdw-023: 'At Kalisz, on 18 February 1284, Duke Przemysł II of Poland gives Count Mikołaj, treasurer of Ląd, free authority to locate his estate of Tropcssino (Trąbczyn) under German law, as all the towns and villages of his district are held, and frees the estate for ever from all the Polish payments: the naraz, the povoz, the prevod, the stroza, the podvorove, the castle''s summons, the opole, the ox and the cow, the cifo of honey; the settlers are not to pay the poradlne.'
kdw-024: 'At Pyzdry, on 1 August 1291, Duke Przemysł II gives his village Wronchino (Wrąbczyn), located under Polish law, to Henryk, citizen of Pyzdry, to locate under the German law of the town of Pyzdry: the sixth mansus free, a tavern, a fishpond, a mill and the free shoemakers'' shop; the woods and marshes, which cannot be cleared, for the pasture of pigs and sows, the meadows of the village with all their uses; if the bees of the wood perish through the location, Henryk is not to be blamed for it; twelve years free of every payment, then six measures of rye, as much oats and one ferton from each mansus, as they count in Pyzdry; Henryk may build a church with his heirs and assign it a free mansus; the village is joined to the duke''s town of Sal, one district with it; the hunt of hares and partridges free. The editors cannot interpret "Sal", but point to the old salt-working near Zagórów.'
kdw-025: At Pyzdry, on 9 September 1298, Duke Władysław of Poland allows his faithful servant Count Wojsław and his lawful posterity to locate his village of Vronztino (Wrąbczyn) under German law, and frees the village and its inhabitants from all the Polish payments and the castle's summons, so that they need appear before no official, but before the duke alone; Wojsław and his heirs are to judge all causes, greater, middling and lesser, within the bounds of the estate, and to collect the fines themselves.
kdw-026: 'At Pyzdry, on 9 August 1324, King Władysław of Poland gives the Cistercian abbey of Ląd, in satisfaction of the great desolation he had worked upon it with his army in Poland, the site of a water mill on the Warta below the castle of Pyzdry, to be possessed hereditarily, with full liberty to build there or to restore the old mill, and forbids all the officials of the town of Pyzdry every hindrance. He also confirms to the abbey the estates given to it by nobles of Poland or honestly bought by the brothers: Mycielin, Chrzamlice, Bronki, Czyżew, Wardężyn, Sczonów and Wrąbczyn (Wronchyno) with the lake of Seborowo, whose people are to enjoy the liberty of the founding privilege of Mieszko the Great.'
kdw-027: 'At Konin, on 14 August 1357, Wyrzbenta, the general captain of Poland, attests the exchange that Abbot Jan of Ląd, with his convent, and the reverend lady Zemka, wife of Albert, made of their free will: the monastery''s estate of Usczonowo (Szczonowo) with all its uses for her third part of great Wrąbczyn (Wroenschino); when Zemka''s mother dies, she is to raise no further claim from the maternal portion in the village.'
kdw-028: At Konin, on 31 May 1362, within the octave of the Ascension, Wyrzbenta, castellan of Poznań and general captain of Poland, attests that the knight Laurentius, heir of Królikowo and castellan of Ląd, of his free will sold to Abbot Jan and the monastery of Ląd the third part of the estate of Magnum Wronchyno (great Wrąbczyn), which he had held peaceably for three years, with all its uses and revenues, for 56 marks of ready groschen, counting 24 scotos to the mark and 2 groschen to the scotus, hereditarily and for the free use of the abbey.
kdw-029: At Ląd, on 16 March 1363, the Thursday after Laetare, Wyrzbenta, castellan of Poznań and general captain of Poland, attests that Stasco, with his wife the lady Iachna, heirs of great Wrąbczyn, of their free will sold to Abbot Jan of Ląd and the abbey their third part of the estate, with all its uses, revenues and jurisdictions, for 70 marks of ready groschen.
kdw-030: At Ląd, on 16 March 1363, the Thursday after Laetare, Wyrzbenta, castellan of Poznań and general captain of Poland, attests that Mikołaj, subdapifer of the bishop of Poznań, with his wife the honoured lady Czerska, of their free will sold the half of the lordship (medium dominium) in the village of great Wrąbczyn to Abbot Jan and his convent in Ląd for 14 marks of ready groschen.
kdw-031: At Ląd, on 27 April 1364, the Saturday after St Mark's day, Wyrzbenta, castellan of Poznań and general captain of Poland, attests that the noble lady Dobrocha, heiress of great Wrąbczyn, sound and unharmed, has acknowledged publicly that all her substance, the unbroken beasts of burden as much as the cattle, with the flocks, is not hers but Abbot Jan of Ląd's and his monastery's, and that after her death neither the children nor any of her friends is to have a right in it; the abbot with his monastery alone. Near its end the document calls her "Dobroslawa".
kuryerpolski1754075-001: The Warsaw newspaper Kuryer Polski reports from Kalisz, on 5 December 1754, the funeral of Paweł Prusimski, Chamberlain of the King, at Trąbczyn, five miles from Kalisz, on the hereditary estate of the Prusimski family (the report spells the name "Prusiński"). Many related houses and the Cistercians of the convent of Ląd attended. The Abbot of Ląd, Głowiecki, had been invited to sing the High Mass, but an unexpected frost prevented his crossing the Warta. The sermon was preached by the prefect of the schools of the Jesuit college at Kalisz, and the funeral oration after the procession was given by his own nephew, Antoni Prusimski. At the order of the widow, Katarzyna Prusimska, born Rozdrażewska, exequies with vigils and many Masses were held the same day in the monasteries nearby, at Pyzdry, Konin and Kaźmierz, as there was not room enough in the parish church of Trąbczyn.
oe1bu14525-001: 'King Friedrich Wilhelm of Prussia gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, a lieutenant general and the governor of Wrocław, for long service the estates that had fallen to the Crown: Kamionna and Kolno in the Poznań district; Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laske, Osiny and Hauland Trąbczyński in the Konin district; and Brzyce in Cujavia. The Prince holds them heritably and may dispose of them freely, saving the sovereign''s taxes. The deed is dated 9 August 1796. The Government at Kalisz certifies the copy, and the title to Szetlewek is entered in the Konin mortgage book.'
oe1bu14525-002: The Government at Kalisz certifies the debts and restrictions on the allodial estate of Szetlewek, which Prince Friedrich Ludwig of Hohenlohe-Ingelfingen received by the King's deed of gift of 9 August 1796 and valued at 24,000 Reichsthaler. The estate may not be sold to natives of the country without consent. Ignatz von Radzinski lent the Prince 8,333 Reichsthaler 8 Groschen (50,000 Polish florins) free of interest as security for the rent of Szetlewek, and Jacob von Przespolewski protests over 30,000 Polish florins under a bond of the former owner, von Prusimski, which is entered on Trąbczyn as well.
oe1bu14525-003: King Friedrich Wilhelm of Prussia gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, a lieutenant general and the governor of Wrocław, for long service estates that had fallen to the Crown, heritably and to dispose of freely, saving the sovereign's taxes. The grant names Kamionna and Kolno in the Poznań district and Brzyce in Cujavia; an endorsement adds Trąbczyn, Szetlewek and the other villages of the Konin district. Richter, judge advocate of the governor's court, certifies the copy.
oe1bu14525-004: King Friedrich Wilhelm of Prussia gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, a lieutenant general and the governor of Wrocław, estates for long service, heritably and to dispose of freely, saving the sovereign's taxes. The grant names Kamionna and Kolno in the Poznań district and Brzyce in Cujavia; an endorsement adds Trąbczyn, Szetlewek and the other villages of the Konin district. Sonnabend, judge advocate of the Hohenlohe infantry regiment, certifies the copy against the original.
oe1bu14525-005: King Friedrich Wilhelm of Prussia, by a grant of 19 June 1797, gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen sixteen former church villages, among them Pszczew, Zagórów, Drzewce and Wieniec, heritably and to dispose of freely. The estates of the absconded Starost von Prusimski, with which the King had meant to honour the Prince, were burdened with many debts. In return the Prince pays the sovereign's dues paid from the villages so far as a fixed rent, and the allowance due from them to the church bodies. Sonnabend certifies the copy against a court copy of 24 February 1798.
oe1bu14525-006: By a grant of 1 December 1797, King Friedrich Wilhelm of Prussia gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, heritably and to dispose of freely, the appurtenances of the estates of Pszczew, Zagórów and Wieniec granted to him in June. They are several villages and Olęder settlements by Pszczew, the hamlet of Swięcia by Zagórów, and four places by Wieniec, among them Konty, Szedlemin and Bątkowo. In return the Prince pays the sovereign's dues paid from them so far as a fixed rent, and the allowance due from them to the church bodies. Sonnabend, judge advocate of the Hohenlohe infantry regiment, certifies the copy.
oe1bu14525-007: By a grant of 1 December 1797, King Friedrich Wilhelm of Prussia gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen the appurtenances of the estates of Pszczew, Zagórów and Wieniec granted to him in June, among them the hamlet of Swięcia by Zagórów. The Government at Kalisz has certified the copy for the entry of the title. The Government at Kalisz also certifies that the only entry on the estate of Swięcia with the farm of Broniki is the ban on selling it to natives of the country without special consent; no debts stand on it. Sonnabend certifies both at Wrocław.
oe1bu14525-008: King Friedrich Wilhelm of Prussia, by a grant of 19 June 1797, gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen sixteen former church villages heritably, among them Pszczew, Zagórów, Drzewce and Wieniec. In return the Prince pays the sovereign's dues paid from them so far as a fixed rent, and the allowance due from them to the church bodies. The reason given is that the estates of the absconded Starost von Prusimski, with which the King had meant to honour him, were burdened with many debts. Richter, judge advocate of the governor's court, certifies the copy against the original.
oe1bu14525-009: King Friedrich Wilhelm of Prussia, by a grant of June 1797, gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen sixteen former church villages heritably, among them Pszczew, Zagórów, Drzewce and Wieniec, in return for the sovereign's dues paid from them so far, as a fixed rent, and the allowance due from them to the church bodies. The reason given is that the estates of the absconded Starost von Prusimski, with which the King had meant to honour him, were burdened with many debts. Sonnabend, judge advocate of the Hohenlohe infantry regiment, certifies the copy against the original.
oe1bu14525-010: King Friedrich Wilhelm of Prussia, by a grant of 19 June 1797, gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen sixteen former church villages heritably, among them Pszczew, Zagórów, Drzewce and Wieniec. In return the Prince pays the sovereign's dues paid from them so far as a fixed rent, and the allowance due from them to the church bodies. The reason given is that the estates of the absconded Starost von Prusimski, with which the King had meant to honour him, were burdened with many debts. Richter, judge advocate of the governor's court and the garrison, certifies the copy against the original.
oe1bu14525-011: By a grant of 1 December 1797, King Friedrich Wilhelm of Prussia gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, heritably and to dispose of freely, the appurtenances of the estates of Pszczew, Zagórów and Wieniec granted to him in June. They are several villages and Olęder settlements by Pszczew, the hamlet of Swięcia by Zagórów, and Konty, Szedlemin, Bątkowo and Karczyn by Wieniec. In return the Prince pays the sovereign's dues paid from them so far as a fixed rent, and the allowance due from them to the church bodies. The Secret South Prussian Archive certifies the copy against the original.
oe1bu14525-012: The Government at Poznań certifies the debts and charges on the estate of Kolno, which consists of the town of Kamionna and the market town of Kolno. It fell to the fisc when the whole property of Anton von Prusimski was confiscated for his part in the uprising of 1794, and came to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen by the deed of grant of 9 August 1796. Entered on it are protests of Anton von Broniewski, who claims to hold the estate in pledge and demands 79,795 Reichsthaler 18 Groschen 8 4/5 Pfennig, both disputed by the Prince, and two standing charges in favour of the church at Kamionna. The certificate is issued to the Prince for information only.
oe1bu14525-013: A valuation of the estates of Kamionna and Kolno in the Międzyrzecz district, which belong to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, drawn up at his request on the West Prussian principles of 1794 and corrected to the South Prussian principles by the calculator Bading, certified at Berlin in 1804. The estates lie three miles from Międzyrzecz. Their area is 10,642 Morgen. The town of Kamionna has 75 hearths and 466 inhabitants and the lordship holds the right to sell drink. There are two home farms, and the village of Kolno has its peasants. The free building timber and firewood from the Krobilewer heath is at present disputed to the town and the lordship. The valuation breaks off before the reckoning of the value.
oe1bu14525-014: 'The end of a valuation of the estates of Kamionna and Kolno, of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen: two notaries at Kalisz certify on 13 February 1803 that the valuation was acknowledged as correct in every part. The forest inspector Rochlitz reckons how the value of the estates would rise if 344 Morgen of forest were separated off and settled with 22 families of half a Hufe each, and the land sold that the burgesses of Kamionna (700 Morgen) and the subjects of Kolno (1,200 Morgen) hold beyond their deeds. By his reckoning the value would rise from 186,943 Reichsthaler, calculated on West Prussian principles, to 255,833 Reichsthaler 12 Groschen.'
oe1bu14525-015: The Government at Poznań certifies the charges on the lordship of Pszczew with its villages, Olęder settlements and the heath mill, which belong to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. The estates belonged to the cathedral chapter of Poznań and came to the Prince, after the church estates were taken over by the state, by the deeds of grant of 19 June and 1 December 1797. Entered on them are the yearly allowance due to the former church owners, payable to the treasury of the War and Domains Chamber at Poznań and not yet fixed in amount, and the ban on selling the estates to natives of former Poland without royal consent. No debts are entered.
oe1bu14525-016: On 22 March 1802 the chamber's fiscal officer Beyer, on behalf of the fisc, formally surrenders the lordship of Pszczew with its villages and Olęder settlements to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, on the strength of the deeds of grant of 1797. The district justice councillor Melzer accepts it for the Prince, as his specially instructed mandatary. The transfer is confirmed, with the right to sell, give away, exchange and pledge the lordship, and a note confirms the entry of the title in the mortgage book.
oe1bu14525-017: King Friedrich Wilhelm of Prussia, by a grant of 19 June 1797, gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen sixteen former church villages heritably, among them Pszczew, Zagórów, Drzewce and Wieniec. In return the Prince pays the sovereign's dues paid from them so far as a fixed rent, and the allowance due from them to the church bodies. The reason given is that the estates of the absconded Starost von Prusimski, with which the King had meant to honour him, were burdened with many debts. The Government at Poznań certifies the copy for the entry of the title to the lordship of Pszczew, and a note confirms the entry.
oe1bu14525-018: By a grant of 1 December 1797, King Friedrich Wilhelm of Prussia gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen the appurtenances of the estates of Pszczew, Zagórów and Wieniec granted to him in June. The Government at Poznań has certified the copy for the entry of the title to the lordship of Pszczew, and a note confirms the entry. Richter, judge advocate of the governor's court, also certifies that the copies of the mortgage certificate and of the brief of resignation for Pszczew agree with the originals shown to him.
oe1bu14525-019: On 29 July 1800 the Government at Kalisz calls on Prince Friedrich Ludwig of Hohenlohe-Ingelfingen at Wrocław to prove within four weeks his ownership of the former church estates of Kopojno, Drzewce, Swięcia and Zagórów in the Konin district, and to apply for a hearing to enter his title. According to the War and Domains Chamber the estates have been granted to him and already handed over.
oe1bu14525-020: On 30 September 1800 the Government at Kalisz grants Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen at Wrocław, at his request of the 8th of the month, a final extension to the end of October to have the Prince's title to Drzewce, Kopojno, Swięcia and Zagórów entered.
oe1bu14525-021: The keeper of mortgages of the department of Kalisz confirms in 1811 that the entries on the town of Zagórów, which Prince Friedrich Ludwig of Hohenlohe-Ingelfingen received by the grant of 19 June 1797, have not changed. Entered are a yearly church allowance of 88 Reichsthaler 5 Groschen 9 Pfennig, and protests of the fisc and of the hereditary leaseholders of Oleśnica over rights to wood in the Zagórów forests. Also entered is a loan of 250,000 Reichsthaler secured by the owner in favour of the Prince's agent, Triebenfeld, a councillor of war and forests, who has pledged parts of it to the General Invalids' Fund and assigned parts to bankers in Berlin and Königsberg. Also entered is a protest over 8,000 Reichsthaler for the heirs of Count Seher-Thoss.
oe1bu14525-022: King Friedrich Wilhelm of Prussia, by a grant of 19 June 1797, gives Prince Friedrich Ludwig of Hohenlohe-Ingelfingen sixteen former church villages heritably, among them Pszczew, Zagórów, Drzewce and Wieniec. In return the Prince pays the sovereign's dues paid from them so far as a fixed rent, and the allowance due from them to the church bodies. The Government at Kalisz has certified the copy for the entry of the title. The Government at Kalisz also certifies that the only entry on the town of Zagórów is the ban on selling it to natives of the country without special consent; no debts stand on it. Schenck, the burgomaster for justice, certifies both copies at Trąbczyn.
oe1bu14525-023: The Government at Kalisz values the estate of Szetlewek in the Konin district, which belongs to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, at 31,171 Reichsthaler 23 Groschen 4 Pfennig, less the stock, which belongs to the lessee. The estate measures 1,724 Morgen; on it live three full-holding peasants, five half-holders and nine lodgers, with an inn, a smithy and a water mill. The subjects have had their firewood from the Trąbczyn wood, since the two estates always had one lord. Szetlewek is leased from 1799 to 1805 to Ignatz von Radzinski for 7,800 florins a year.
oe1bu14525-024: A short supplement, for the most part not read. What can be made out is the name Melzer, the date 18 April 1803 and a hereditary-lease contract for Bątkowo.
oe1bu14525-025: The Government at Poznań certifies the charges on the lordship of Pszczew, for Johann Wilhelm Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, who claims 5,000 Reichsthaler. Entered on the lordship are the yearly allowance due to the former church owners, now fixed at 2,470 Reichsthaler 16 Groschen 3 Pfennig, and the Prince's debts. These are 48,000 Reichsthaler to Glenck, 2,000 Reichsthaler to the Wrocław merchant Abraham Moses Hirschel, and 5,000 Reichsthaler each to Freiherr von der Marwitz of Rudnik, to the widow Christiane Dorothea Michaelis and again to Glenck.
oe1bu14525-026: The Government at Poznań informs Prince Friedrich Ludwig of Hohenlohe-Ingelfingen that, at his request, 5,000 Reichsthaler each for Baron von der Marwitz, for Mrs Michaelis, wife or widow of a senior councillor, and for the estate councillor Glenck have been entered as debts on the lordship of Pszczew, and a mortgage certificate ordered for each of the three creditors. He may have the certificates collected from the Government's archive after four weeks, on payment of the costs.
oe1bu14525-027: The Government at Poznań certifies to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, from the mortgage files of the estates of Pszczew in the Międzyrzecz district, that the estates have been granted to him by the deed of gift of June 1797 and its declaration of 1 December 1797. The entry of his title waits only on the formal surrender by the fisc. The estates formerly belonged to the bishopric of Poznań, and the Prince has so far raised no debts on them and submitted no bonds for entry.
oe1bu14525-028: The Government at Poznań certifies the charges on the estate of Bątkowo in the Radziejów district and the estate of Szedlemin in the Brześć district, both held by Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. Both belonged to the cathedral chapter of Włocławek and came to the Prince, after the church estates were taken over by the state, by the deed of grant of 1 December 1797. Entered on them are the yearly allowance due to the chapter, not yet fixed in amount, and the ban on selling the estates to natives of former Poland without royal consent; no debts are entered.
oe1bu14525-029: 'On 3 November 1800 Johann Wilhelm Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, writes to the King of Prussia: in obedience to the King''s order of 18 November to put in order the title to the Prince''s estates of Kopojno, Zagórów, Drzewce and others, he has done everything needed to supply the documents. He hopes that the obstacle so far is removed and the order can be carried out within four weeks, and asks that all severe measures be held off.'
oe1bu14525-030: On 18 November 1800 the Government at Kalisz, in the mortgage business of the estate of Swięcia, gives Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen at Wrocław, 14 days to put in order the mortgage records of that estate and of the estates belonging with it, Kopojno, Drzewce and Zagórów. It warns that the fisc would otherwise without fail have to be set in motion against the Prince.
oe1bu14525-031: On 28 December 1798 the Government at Kalisz informs Prince Friedrich Ludwig of Hohenlohe-Ingelfingen that, since he has acquired the estate of Trąbczyn with its appurtenances from the fisc, his title must first be entered in the mortgage book. For this he is to submit within four weeks a certified copy of the judgment by which the whole property of Anton von Prusimski was awarded to the fisc, and a certificate of the competent court that the judgment is final.
oe1bu14525-032: On 18 March 1800 Schultz, writing from Kalisz, asks the provincial high court at Wrocław to take the oath of homage from Prince Friedrich Ludwig of Hohenlohe-Ingelfingen as soon as possible, as requested on 24 September of the year before, and to send the record of it.
oe1bu14525-033: 'On 10 February 1802 Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, writes in the Prince''s name to the Chamber at Poznań and to the Government: the Government at Poznań, he says, demanded that the title to the Prince''s estates be put in order within 14 days, or the fisc would act. The Prince then sent in the missing deeds of gift in the original. Glenck now asks for the speedy formal surrender by the fisc of all the Prince''s estates in Cujavia and at Pszczew.'
oe1bu14525-034: 'The Government at Poznań answers Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen at Wrocław, on his representation of the 13th of the month: the fisc has already surrendered the estates of Kolno and Kamionna; for the estates of Pszczew the hearing is set for 22 March. For the estates in Cujavia the surrender has not yet been applied for at all; the Government expects a qualified justice commissary to see to the entry of the title.'
oe1bu14525-035: The War and Domains Chamber at Poznań informs Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen at Wrocław, on his application of the 13th of the month, that the chamber's fiscal officer Beyer has received the orders needed to surrender, on behalf of the fisc, all the Prince's estates at Pszczew and in Cujavia.
oe1bu14525-036: 'Johann Wilhelm Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, writes to the King of Prussia: the Government at Poznań, he says, demanded as necessary and urgent that the title to the Prince''s estates be put in order, and the Prince sent in the missing deeds of gift in the original. In the Prince''s name he asks urgently for the speediest formal surrender by the fisc of all the Prince''s estates in Cujavia and at Pszczew.'
oe1bu14525-037: The Government at Poznań orders Glenck, the councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, to comply within a final 14 days with the order of 30 October of the year before on putting in order the Prince's title to the lordship of Pszczew.
oe1bu14525-038: 'On 25 January 1802 Melzer writes to a councillor for building and estate management: at that day''s hearing for the formal surrender of the estates of Pszczew to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen the chamber''s fiscal officer again failed to appear, because the Chamber had not yet authorised him. Melzer has asked for a new hearing, but sees no end to it unless the Chamber gives the fiscal officer clear instructions, and advises that the Prince ask the Chamber''s president, von Harlem, to hasten matters. In a postscript he reports that the judgment on appeal in a case with the cathedral chapter has reversed the first and dismissed the chapter.'
oe1bu14525-039: Count Hoym, the minister for South Prussia, tells Prince Friedrich Ludwig of Hohenlohe-Ingelfingen that by a cabinet order of the 23rd of the month the King has given him Kamionna and Kolno, Trąbczyn and the other villages of the Konin district and Brzyce in Cujavia, heritably; Hoym is seeing to the issue of the deed of gift. Since the estates belonged to a principal insurgent, von Prusimski, he is asking the Government at Poznań about the debts on them. The estates are said to yield at least 4,000 Thaler a year; to value them he recommends the chamber councillor Peucker at Fraustadt, who could also sell them should the Prince not wish to keep them. Colonel von Sanitz has received Prusimski's estates in the Wągrowiec district.
oe1bu14525-040: On 20 October 1797 King Friedrich Wilhelm of Prussia, by a rescript signed by Count Hoym, orders the Chambers at Poznań and Petrikau to hasten the handing over of the confiscated and church estates granted to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. The handing over had been a mere superficial ceremony, and people with unexamined, in part allegedly false, pledge and lease contracts are said to sit on the estates. The Chambers are to examine the claims quickly, hand the estates over to the Prince's agents to manage freely, settle disputes amicably as far as possible and have any necessary lawsuits conducted by the shortest way. They are also to fix at once the dues and church allowances the Prince has to pay.
oe1bu14525-041: On 3 October 1797 Count Hoym writes to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen that the Prince's unease about the handing over of his South Prussian estates rests on a misunderstanding, and encloses his orders to the Chambers at Poznań and Petrikau to take over and hand over the estates as soon as possible. The church owners, he writes, have sat on them for the fisc's account since 1 June 1796 and must leave as soon as they receive their allowance; the Bishop of Cujavia is still at Wieniec and Wolica only because the Prince is willing to leave him there. A lessee who will not leave amicably the Prince had better leave in his lease until June 1798, taking the rent, or the royal treasury would have to compensate him.
oe1bu14525-042: The Government at Kalisz calls on Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, so that his title to the estate of Szetlewek can be entered in full, to submit within four weeks a certified copy of the judgment confiscating the property of Anton von Prusimski, with a certificate that it is final.
oe1bu14525-043: 'The Government at Poznań answers the request of 31 January in which Prince Friedrich Ludwig of Hohenlohe-Ingelfingen asked, for the entry of his title to the Trąbczyn estates, for a certified copy of the judgment confiscating Anton von Prusimski''s property, with a certificate that it is final: the judgment was given not at Poznań but by the Government at Toruń, and he must apply there. His enclosure is returned to him in the original.'
oe1bu14525-044: 'The Government at Poznań answers the request of 31 January in which Prince Friedrich Ludwig of Hohenlohe-Ingelfingen asked, for the entry of his title to the Trąbczyn estates, for a certified copy of the judgment confiscating Anton von Prusimski''s property, with a certificate that it is final: the judgment was given not at Poznań but by the Government at Toruń, and he must apply there. His enclosure is returned to him in the original.'
oe1bu14526-001: 'An unnamed writer asks that the criminal-court councillor Grimm be spoken to about the enclosed files on Witów. The files had long been looked for in the registry at Trąbczyn; when the writer moved from his lodgings in Wrocław to Wilhelmsruh they were found among his wife''s papers: she had received them while he was away, put them away safely and forgotten to give them to him.'
oe1bu14526-002: In a preliminary agreement, the forest inspector Rochlitz sells the noble estate of Witów in the Warta district, on behalf of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, to Martin Honrichs and Valentin von Kwasieborski for 16,000 Reichsthaler in three instalments. The Prince had bought the estate, which the King had granted to Colonel von Schlieben, from Schlieben's widow and heirs in 1799. He gives no warranty for fields that the burgesses of Warta might win at law; if consent to the purchase is refused only after the handover, the buyers keep the estate for a year as a lease at 800 Reichsthaler. The Prince then assigns 8,000 Reichsthaler of the purchase money to the Wrocław banker Carl Ferdinand Weigel.
oe1bu14526-003: 'The court office at Pszczew of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen confirms a sale: Joseph von Jankowski has sold the free mayor''s holding at Dormowo near Birnbaum for 2,000 Reichsthaler, paid in cash, to the captain and district tax collector Andreas Ernst Gneust. The sale lists the dues to the manor of Pszczew, the right to keep 250 sheep and to brew beer for the household, and free firewood from the Pszczew forest. Jankowski, who did not understand German, had the contract read to him in Polish. The Prince confirms it without prejudice to his rights, which he means to have checked against the old land books.'
oe1bu14526-004: 'Prince Friedrich Ludwig of Hohenlohe-Ingelfingen sells the estates of Kolno and Kamionna in the Międzyrzecz district, granted to him by the deed of gift of 9 August 1796, for 142,000 Reichsthaler to the bank director George Conrad Leixner of Frankfurt an der Oder. The money is paid: over 53,139 Reichsthaler went to the former Polish cavalry captain von Broniewski, who held the estates as a creditor put in possession, and the rest to the Prince. The buyer takes over two capital sums owed to the church at Kamionna and the disputed right to wood in the Krobilawer forests; a mortgage of 100,000 Reichsthaler in favour of the Prince''s agent, Triebenfeld, a councillor of war and forests, has been paid off. The banker Meyer Bernhard acts for Leixner, who approves the contract at Frankfurt.'
oe1bu14526-005: Prince Friedrich Ludwig of Hohenlohe sells the estates of Kolno and Kamionna for 142,000 Reichsthaler, without a valuation, to the bank cashier George Conrad Leixner of Frankfurt an der Oder. Captain von Broniewski, who holds the estates, gives them up under a settlement of 3 July against over 53,139 Reichsthaler, which Leixner pays him at Poznań on 8 September; on 10 September the estates are handed over free of debt. Leixner has already paid 76,000 Reichsthaler to the mining councillor Bernhardi. Leixner means to divide the estates into smaller holdings, and the Prince promises not to hinder it.
oe1bu14526-006: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, grants the farmer Blazy Kukulski of Osiny one Hufe of arable land at Osiny in perpetual hereditary lease, in a contract made on 18 July 1806 before the Prince's patrimonial court at Trąbczyn. He acts under the Prince's general power of attorney for the estates of Zagórów, Witów and Trąbczyn. Kukulski has paid 100 Reichsthaler entry money and pays 30 Reichsthaler rent a year; he is free of labour services and of hereditary subjection, builds at his own cost and must take his drink from the manor's brewery or inn. The contract was read out in German and Polish.
oe1bu14526-007: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, grants the Olęder farmer Gottlieb Sarre of the Peyserschen Hauland one and a half Hufen of waste land in the wood by Trąbczyn in perpetual hereditary lease, in a contract made before the patrimonial court at Trąbczyn. Sarre has paid 150 Reichsthaler entry money and pays 45 Reichsthaler rent a year, for the land still to be cleared only after three free years; he may redeem half the rent, 5 Reichsthaler for each 100 Reichsthaler of capital. He is free of labour services, builds at his own cost, and must take his drink from the manor and grind at its mill.
oe1bu14526-008: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, grants the settler Christian Friedenberger of the Szymanowicer Hauland one Hufe of land in the Trąbczyn wood in perpetual hereditary lease, in a contract made before the patrimonial court at Trąbczyn. It is granted for 100 Reichsthaler entry money, paid, and 30 Reichsthaler rent a year, for the land to be cleared after free years running to 1809. Triebenfeld acts under the Prince's general power of attorney, and the War and Domains Chamber at Kalisz had consented on 28 January 1806 to divide the lordships of Zagórów and Trąbczyn into holdings, to give Szetlewek and Oleśnica in hereditary lease and to turn the services of the subjects into a money rent.
oe1bu14526-009: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, leases the home farm of Kopojno, without livestock and without the brewery, for six years from midsummer 1805 to 1811 to Maciej von Niedźwiecki, lessee of the drink monopoly, for 1,500 Reichsthaler a year in advance. The lessee has the services of ten komorniks and of the lodgers, and takes over the taxes and the allowance due to the monastery of Ląd. In a supplement Triebenfeld leases 13 Hufen more; the rent rises to 2,125 Reichsthaler. Niedźwiecki waived a record in Polish; the contract was explained to him in Polish.
oe1bu14526-010: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, grants the building inspector Johann Wilhelm Wollenhaupt 18 Hufen of arable of the Drzewce home farm and 2 Hufen of meadow at Wrąbczyn, with the dwelling house and brewhouse at Drzewce, at perpetual hereditary rent, for 6,000 Reichsthaler entry money and 300 Reichsthaler a year. Wollenhaupt undertakes to divide the land into ten peasant holdings of at least one Hufe each. On 25 August 1805 both cancel the contract because circumstances have changed; Triebenfeld pays Wollenhaupt 600 Reichsthaler, with which he is satisfied for all claims from his administration for the Prince. Wollenhaupt is to leave the house at Drzewce by Michaelmas for the farm lessees Titz and Schatzmann.
oe1bu14526-011: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, grants Johann Seymert, dyer and town councillor of Zagórów, three Hufen of the Trąbczyn home-farm land, 2 Hufen 24 Morgen of arable and 6 Morgen of meadow, at perpetual hereditary rent, in a contract made before the patrimonial court at Trąbczyn. It is granted for 900 Reichsthaler entry money due at midsummer and 45 Reichsthaler a year. Seymert builds at his own cost, has no right of pasture or wood, bears all taxes and the allowance due to the monastery of Ląd, and is free of labour services.
oe1bu14526-012: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, grants the forester George Friedrich Kammer of Pietrzykowo 6 Hufen of arable and 20 Morgen of meadow of the Przybysław home farm, with all the farm buildings, at perpetual hereditary rent, in a contract made before the patrimonial court at Trąbczyn. Kammer pays 2,100 Reichsthaler entry money, 100 Reichsthaler of it for the buildings, and 100 Reichsthaler rent a year; this once the manor lends him its teams free to cart the dung onto two Hufen.
oe1bu14526-013: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, makes over to the bailiff Johann Gottlieb Tschachmann 20 Hufen of fields and meadows of Trąbczyn, on the side towards Kopojno, for ever in hereditary lease, for 6,000 Reichsthaler entry money and 15 Reichsthaler a year for each Hufe. Tschachmann may pass the land on to others in parts. The hereditary lessees are free of hereditary subjection and labour services, have no right of pasture or wood, and must lay out the new villages in one or two straight lines.
oe1bu14526-014: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, grants the Prince's forest inspector Carl Titz five Hufen of the Trąbczyn home-farm land, from the road to Podbiele to the mill ditch, with the orchard beside the stables, at perpetual hereditary rent, in a contract made before the patrimonial court at Trąbczyn. It is granted for 1,500 Reichsthaler entry money in two instalments up to midsummer 1806 and 75 Reichsthaler a year.
oe1bu14526-015: In a preliminary agreement of 6 April 1805, Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, makes over, subject to the Prince's approval, to the undersigned hereditary lessees, Carl Titz among them, 270 Hufen of fields, meadows and woods of the estates of Trąbczyn, Łazy, Osiny, Nowawies and Przybysław, for 300 Reichsthaler entry money and 15 Reichsthaler rent a year for each Hufe. They may sell on, must clear the woodland within four free years, are free of hereditary subjection and labour services, and are jointly liable; each new village with a mayor and a schoolmaster receives 13 Morgen free of rent. A note lists 156 Hufen 25 Morgen already given out to individual buyers, Tschachmann and Seymert among them; 113 Hufen 4 Morgen remain for the contractors.
oe1bu14526-016: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, grants the settlers Martin Giering, Wilhelm Daniel Schulz, Gottfried and Michel Dümmel, Gottfried Dams and Christoph Schoenfisch the home farm of Althütte by Trąbczyn, 10 Hufen 10 Morgen, with the farm buildings except the new cowshed, in perpetual hereditary lease, in a contract made before the patrimonial court at Trąbczyn and approved by Prince Friedrich Ludwig of Hohenlohe himself. They pay 1,500 Reichsthaler entry money and 225 Reichsthaler a year, for the land to be cleared after free years running to midsummer 1808, and are jointly liable. An earlier contract with them for the same ten Hufen, made by a certain Kunkel, is cancelled.
oe1bu14526-017: Acting for Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, Kunkel, clerk of the district justice commission, sells 10 Hufen 10 Morgen of the Alte Hütte home farm of the lordship of Trąbczyn, with the farm buildings except the cowshed, to six Olęder settlers, Martin Giering, Wilhelm Daniel Schulz, Gottfried and Michael Dümel, Gottfried Damt and Christoph Schoenfisch, to be divided into six equal holdings; the sale is subject to the Prince's approval. They pay 2,500 Reichsthaler, are jointly liable for all dues, pay a yearly hereditary rent, may gather fallen and dead wood in the Trąbczyn forest and graze there, and may join the Olęder community of Trąbczyn for schooling.
oe1bu14526-018: Johann Wilhelm Glenck, estates director and general attorney of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, makes over to the burgesses of Pszczew and the village communities of Stołuń, Kuligowo, Szarcz, Stoki, Świechocin and Łowyń the whole lordship of Pszczew, with its home farms, forests and drink monopoly, as their property, in a hereditary-lease contract made before the court office at Pszczew. The Prince keeps the jurisdiction, the transfer fee, the hunting and the castle. The price is 180,000 Reichsthaler and a ground rent of 1,000 Reichsthaler a year; the communities take over mortgage debts of 137,000 Reichsthaler and the pending lawsuits. Their representatives, the burgher Matheus Młynkiewicz and the village mayor Johann Chmara, had the contract interpreted to them. A rescript of the Chamber at Poznań of 1806 records that the King has approved the sale and the division into holdings.
oe1bu14526-019: Johann Wilhelm Glenck, estates director and general attorney of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, makes over to the burgesses of Pszczew and the village communities of Stołuń, Kuligowo, Szarcz, Stoki, Świechocin and Łowyń the whole lordship of Pszczew as their property, in a hereditary-lease contract made before the court office at Pszczew. It is made over for 180,000 Reichsthaler and a ground rent of 1,000 Reichsthaler a year. The communities take over the registered mortgage debts and pay 35,000 Reichsthaler at once; the Prince keeps the jurisdiction, the transfer fee, the hunting and the castle. The former lessee Bornstädt stays on the home farm until his eviction suit is decided. Their representatives, the burgher Matheus Młynkiewicz and the village mayor Johann Chmara, had the contract interpreted to them.
oe1bu14526-020: Prince Friedrich Ludwig of Hohenlohe gives the manor house at Swięcia to Friedrich Götzinger, innkeeper at Poznań, in thanks for his trouble and journeys in the hereditary-lease business. He has the same day given the buildings and lands of the Swięcia home farm in hereditary lease to Johann Christian Birlack of Zilenzig, Johann Götzinger, Johann Siebert and Friedrich Götzinger, the manor house excepted; Götzinger can use the house as a tavern together with the brewery he has taken on hereditary lease.
oe1bu14526-021: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, undertakes, in a preliminary agreement, to sell the estate of Witów in the Warta district to Franz Meierowitz as soon as the sale to Honrichs is cancelled; Honrichs, it says, is neither qualified to hold the estate nor able to pay. Meierowitz pays 20,000 Reichsthaler and a perpetual rent of 500 Reichsthaler a year, which he may redeem with 10,000 Reichsthaler. Since he cannot yet show that he is entitled to hold noble estates, Triebenfeld will help him to the King's permission; Meierowitz bears the costs.
oe1bu14526-022: The Government at Poznań confirms the contract of January 1805 by which Prince Friedrich Ludwig of Hohenlohe-Ingelfingen sells the estates of Kolno and Kamionna for 142,000 Reichsthaler to the bank cashier George Conrad Leixner of Frankfurt an der Oder, and sends the Prince the engrossment. On 6 February 1805 the representatives of the two parties, the justice councillor Melzer for the Prince and the criminal councillor Guderian for Leixner, acknowledged the contract before the government assessor Bewert. Leixner extended his power of attorney because a new contract had replaced the one of 15 June 1804.
oe1bu14526-023: The War and Domains Chamber at Poznań, on a royal cabinet resolution, refuses the request of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen to give the lordship of Pszczew in hereditary lease to the burgesses and the other inhabitants, and returns the contract. Other lords, it says, would follow, and the estates of the province's numerous nobility, whose preservation must be considered, would be diminished; the Pszczew forest, the only large one in the area, could not be properly managed; the inhabitants have land enough, the burgesses should rather follow town trades, and most are too poor.
oe1bu14526-024: Johann Wilhelm Glenck, councillor for building and estate management, acting for Prince Friedrich Ludwig of Hohenlohe-Ingelfingen and subject to the Prince's approval, sells to the miller Samuel Lucke of the Białobrzeg mill near Wrąbczynek 1,000 Morgen of the home-farm land of the estate of Szetlewek, with the farm buildings. It is sold for 12,333 Reichsthaler, 8,333 Reichsthaler of it to the pledge holder von Radzinski when he leaves, and a yearly rent of 500 Reichsthaler. Lucke receives the drink monopoly, the brewhouse and the distillery for a yearly rent of 400; the services of the subjects are excepted, the manor having declared itself ready to free them from service at their wish. Lucke acts for several would-be buyers and asks for two to four weeks.
oe1bu14526-025: On 1 July 1799 at Zagórów, before the police magistrate, the police burgomaster Nüchler of Pyzdry, the miller Luka of Białobrzeg and Kriede of Wrąbczynek declare that on 20 November 1798 they had agreed with Glenck, the general authorised representative of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, to divide up the estate of Szetlewek, find settlers for it and pay the purchase money at midsummer. Because the pledge holder of Szetlewek is making difficulties about leaving, they renounce the contract, provided they are repaid 200 Reichsthaler in travelling costs and the people they recruited, who have already paid earnest money, look to the manor. Glenck offers to pay if the Prince approves.
oe1bu14526-026: 'Titz and Bancke report from Zagórów to a councillor for building and estate management: the miller Luka has withdrawn from his contract, has received the 25 Reichsthaler and will settle the rest with the councillor at Kalisz. Two people he brought to take on land have been put off until matters with Trąbczyn and Herr von Szucki are ended. They ask that Szucki''s withdrawal be reported to the Government, and whether Prince Friedrich Ludwig of Hohenlohe-Ingelfingen could add something to the 1,000 Reichsthaler the community will pay for it, since Szucki''s spite against the subjects is growing. A joiner who had meant to live at Szetlewek has in despair bought a house at Zagórów.'
oe1bu14526-027: 'Glenck, councillor for building and estate management of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, writes to the criminal councillor Grimm at Kalisz: his contract with von Radzinski is cancelled, as the enclosed letters show. The three contracting parties Luck, Kriede and Nüchler would not withdraw, since they have already brought forward 18 farmers who have enrolled against a deposit and take nearly two thirds of the fields; Griese offers a security of 2,000 Reichsthaler. Glenck wants the loss from the breaking off charged to Radzinski. In the contract of the Trąbczyn Olęder settlers, he has been assured by von Kramplitz, von Prusimski''s commissary, there stands the reservation that their privilege runs only to the first holders, their sons and grandsons, and that they must already apply for a new one.'
oe1bu14526-028: The court office at Pszczew of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen reports to him on 10 April 1805 that Sigismund von Rzadkowski has sold his hereditary-rent holding at Głażewo to his half-sister Susanna, born Treben; the contract has been approved without prejudice to the Prince's rights. Since the Prince holds the right of pre-emption, he is to declare within a set time whether he will use it; otherwise by law he is taken to have waived it in this case.
oe1bu14526-029: In 1766 Bishop Teodor Czartoryski of Poznań makes over to the married couple Simeon and Apollonia Rządkowski one Hufe of waste land at Głażewo in the Pszczew estates, with the house and barn built at the manor's cost, for 30 ducats. They pay 130 Polish florins a year in two instalments, besides the poll tax and the winter-quarters money, send people four times a year to work on the Głażewo home farm and at the Obsko meadow, and may take a barrel of beer from the Pszczew brewhouse for every two quarters of barley. The Bishop assures them of quiet possession. The privilege is known from a certified German translation, with the Polish text, of an extract from the book of privileges of the cathedral chapter of Poznań.
oe1bu9454-001: 'Prince Hohenlohe-Ingelfingen presses his agent Triebenfeld, then at the Congress of Vienna, to obtain from State Chancellor Prince Hardenberg the advance of 112,000 Reichsthaler and the immediate administration of the entailed estates; with that, he says, the power of Cosmar, who administers them for the creditors, would end. He says an agent has promised to hand over the debt instrument in return for 12,000 Reichsthaler and a secure order for a hundred thousand Reichsthaler. He says the favourable report of the High Provincial Court at Brzeg has been sent in. Triebenfeld is also to pursue the matter of Trąbczyn and Kamionna: the estates granted to the Prince by the King were taken away by the Poles on their own authority, and the Emperor must order their return.'
oe1bu9454-001a: 'Triebenfeld, the agent of Prince Hohenlohe-Ingelfingen, writing from Vienna, passes on a letter just received from the sorely pressed Prince and asks the recipient to show mercy to him. He says only the advance of 112,000 Reichsthaler can save the Prince: the Courland heirs would be satisfied, the power of Cosmar, who administers the Prince''s entailed estates for the creditors, would end, and the King would get the 112,000 Reichsthaler back from the funds of the entailed estates. Regarding the Trąbczyn estates in the district of Konin, mentioned in the Prince''s letter, he asks for instructions whether he may now submit the deeds and documents.'
oe1bu9454-002: Triebenfeld, the agent of Prince Hohenlohe-Ingelfingen, is appalled that the Prince claims to have received no letters from him since the 13th of January. He recalls the 7 letters he has sent from Vienna since then, among them one to General Schöler about Trąbczyn and the news that the districts of the estates are to fall to Russia. He begs for 200 ducats, since he says he must give State Chancellor Hardenberg 100 and Barbe 70. He says the matters lie with Stägemann, the money will be paid and an administrator appointed. Prince August is to revoke Cosmar's power of attorney at once and notify the courts of this.
oe1bu9454-003: 'Triebenfeld, the agent of Prince Hohenlohe-Ingelfingen, complains of a shortage of money: he says he had counted on 1,400 Reichsthaler for 4 weeks, but received only 932 Reichsthaler in 5 months, and he urgently asks for 200 ducats. He says he intends to go with Barbe to Minister Nesselrode about the Polish matter. He advises proposing, by way of a memorandum, a loyal administrator of the entailed estates for the royal account, one able to give security and competent in the business. He hopes soon to have the Prince''s decision on the advance and the Polish estates.'
oe1bu9454-004: 'Triebenfeld, the agent of Prince Hohenlohe-Ingelfingen, reports from Vienna on Napoleon''s return: he says Grenoble is in Napoleon''s power, that he has about 30,000 men, and that 10 million francs have been put on his head. He asks the Prince for a basket wagon for the servant of Court Councillor Barbe, who is to travel from Sławięcice to fetch Barbe''s sister from Switzerland, and for a vehicle with 2 horses to fetch glass crates belonging to the Court Councillors Barbe, Heym and Philipsborn from Prague. He wishes Eberhard would come, asks what steps Prince August has taken about the power of attorney, and requests further blank forms.'
oe1bu9454-005: Zerboni has demanded that Trzciński pay him, on the strength of an alleged assignment of the claim of 10,000 and 5,000 Reichsthaler belonging to Prince Hohenlohe-Ingelfingen. Triebenfeld, the Prince's agent, disputes this for the time being and urgently asks the Prince for information; he fears the Prince may have given Zerboni a blank signed sheet of paper. Trzciński claims to have already paid König on Zerboni's instruction for the business at Biskupice, which Triebenfeld considers fraud. He says the prefect von Smiedecki at Kalisz has been won over and will report favourably in the compensation matter concerning the Sokolnik office.
oe1bu9454-006: 'Triebenfeld, the agent of Prince Hohenlohe-Ingelfingen, reports on the compensation due the Prince in the Russian share of partitioned Poland: he has claimed the starosty of Sokolnik, set against the Prince''s claim, and Minister Stein is to settle this with Nesselrode. In the Courland matter he received instructions through Stägemann to come to terms with the Courland heirs. They gave notice that Cosmar, who administers the Prince''s entailed estates, had offered them the Syten estates. He expects the King''s declaration in 2 days. He says Hardenberg only makes promises. He urgently asks for 100 ducats by express courier.'
oe1bu9454-007: Charlotte von Triebenfeld, writing from Wrocław, asks Prince Hohenlohe-Ingelfingen to have one of his subordinates send her her father's address, so that she can write to him herself. This is her third letter to the Prince without a reply; she says a letter from her father referred her once again to the Prince's kindness. She says her misery has passed all bounds, especially as she must give up the hope of describing her situation to her father in person. She no longer dares to ask the Prince for help.
oe1bu9454-008: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, urgently asks the Prince to send 120 Reichsthaler to his children, who are in distress, and 60 Reichsthaler a month if his own stay lasts longer. He says he is living on borrowed money. He says the Prince's case stands well. He asks whether a written assurance can be obtained from the Courland agent that the matter is to be settled with 112,000 Reichsthaler. He says there are powerful enemies. Apart from this assurance he says he needs nothing there. He intends to write to Hahn, the Prince's agent, himself.
oe1bu9454-009: The beginning of the letter is lost. Triebenfeld says the Privy Councillor of State Beguelin is working on the matter through the mediation of Court Councillor Barbe, and that through Beguelin he is pursuing the Koszęcin business. Everything is already agreed, he says, if only the 112,000 Reichsthaler are granted first. He asks Prince Hohenlohe-Ingelfingen to help his children with 100 Reichsthaler; he says he lives meagrely and must borrow again in 6-7 days. The Prince should have Triebenfeld's servant watched so that he does not run away; he says the man has angered him.
oe1bu9454-010: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is surprised that his letters to the Prince, mostly sent by way of Teichelmann, have not arrived, and intends to have the post trace them. He says Stägemann has not yet made his report, but State Chancellor Hardenberg gives the best assurances. He says he has handed the Polish matter over to the commission and expects estates rather than money for it. He passes on war news and rumours, wonders at Prince August's delay in revoking the power of attorney, and encloses a letter to Eberhard.
oe1bu9454-011: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the matter of the Prince is to be decided favourably this week, but urges that Eberhard be sent to Vienna in haste to conclude a settlement with the Courland heiresses; in the worst case the estates would have to be administered for 5 years longer. He complains that the Prince's son August will not take the power of attorney away from Cosmar, proposes a step to be pursued through Hardenberg in favour of Prince Adolph, and asks for 100 ducats in order to pay Barbe. He adds news of the Congress of Vienna and rumours of war.
oe1bu9454-012: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, urgently asks the Prince to send 200 ducats, since he says nothing can be achieved without money and otherwise, despite a good position, all will be lost. Prince August should quickly demand the power of attorney back from Cosmar. He warns the Prince against the young gentleman's written undertaking, which he hears the Prince left behind in Öhringen. He says the King of Württemberg has recognised those who were mediatised as estates and has sent a draft constitution.
oe1bu9454-013: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, urgently asks the Prince for 200 ducats and two blank forms signed in French. He says he owes Barbe 145 ducats and needs a coat, and that the papers are losing much of their value. He says a Prince is willing to have 100 ducats advanced to him, to be repaid at the treasury there. Having had no news for three and a half weeks, he says he is living on water and bread. According to a report, Hahn wants Prince Adolph to buy Koszęcin, which is said to yield 55,000 Reichsthaler a year. Triebenfeld compares it with Sławięcice.
oe1bu9454-014: 'Eberhard, writing from Brzeg to a friend then at Vienna, asks why nothing has yet been decided on the complaint of Prince Hohenlohe-Ingelfingen. He considers an investigation said to have been opened against Cosmar harmful, since Cosmar could then withhold the rent outstanding since Midsummer 1812. A settlement over the debt to the Duke of Courland''s heirs, he says, has failed: the general attorneys refuse, because the councillor of justice Henneberg was told in Berlin to let the matter rest. The King should take over the debt entirely; the Prince might well also be released from 35,000 Reichsthaler owed to the King.'
oe1bu9454-015: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that, according to a letter from State Chancellor Hardenberg, the King has no objection to the payment of the 100,000 Reichsthaler claimed by Prince August, a legacy of Princess Sakkin; he says Kircheisen, the Minister of Justice, has been instructed. He says the advance of 112,000 Reichsthaler to the Prince is regarded as secured and Cosmar''s removal from the Prince''s entailed estates has been decided. He says the Trąbczyn matter will meet great difficulties: the Polish files would have to be translated, but he lacks the 260 gulden for the translator. Gravely ill and without means, he urgently asks the Prince for help, also for his daughter.'
oe1bu9454-016: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, has asked Lieutenant Colonel von Thiel whether the King of Prussia will still be at Vienna when Prince Adolph arrives on the 20th. Thiel assures him the King will be pleased and that no one will leave before the 22nd. Triebenfeld has not yet spoken with Hardenberg, and the affairs of the Prince continue to rest. He reports that Murat has advanced as far as Mantua and that Bonaparte is gathering troops near Paris. He says the Prince must be given an equivalent for the Kosten estates. He tells the Prince he may now make out a mortgage on Zagórów in Triebenfeld's favour.
oe1bu9454-017: 'Triebenfeld, the agent of Prince Hohenlohe-Ingelfingen, defends himself against the charge General Kleist made before Prefect Count Garczynski at Kalisz: that the Prince''s sons had said in Berlin that Triebenfeld was pocketing all the income of the estates. He points to Cabanis, Hecker, Honrichs and the sequestrators, and is having the matter investigated by the komornik (court officer) von Chomanowski. He says the arrears of interest, leaving aside the Oleśnica, Wrąbczyn and peasant estates, come to nearly 30,000 Reichsthaler. He complains of Sommer''s rumours about the Prince''s debts and asks for a quick answer regarding Sobottendorff, Weigel and the sum owed to the army''s Invalids'' Fund.'
oe1bu9454-018: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, returns the instrument and power of attorney that the Prince sent him, since he says he already holds a general power of attorney and everything has been seized. He says that under French seizure he had to pay the army's Invalids' Fund on the Prince's behalf. The French General Direction ordered the 3,121 Reichsthaler to be repaid out of the estates. He asks for a declaration assigning him 4,219 Reichsthaler from the arrears of interest owed by the inhabitants of Wrąbczyn, Alt Olesnica, Kopojno, Skokum, Świątniki and other places, to be collected through a komornik (court officer).
oe1bu9454-019: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, presses the Prince for an agreement with Sobottendorff, to whom the Prince owes 40,000 Reichsthaler. After an agreement with Tschachmann and with Hawich, to whom he must give a mortgage on his own estate of Blizanów for 1,300 Reichsthaler, he intends to lease lands, buildings and meadows to Sobottendorff for 18 years for 36,000 Reichsthaler. He asks urgently for the instrument drawn up according to his instructions, since everything is under seizure, and holds out to the Prince the prospect of 4,000 Reichsthaler from the Witów lawsuit, should it be won.
oe1bu9454-020: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince that under a new cabinet order, payment must be made in Courant even where the sum was lent in paper money. This means, he says, a loss of 1,500 Reichsthaler in the matter of van der Lahr, a creditor who is suing him. He fears arrest by van der Lahr over 3,000 Reichsthaler. He says he wrote to Amelang, the Prince''s legal agent in Berlin, telling him to offer van der Lahr a settlement: 1,000 Reichsthaler in cash and 350 Centner of iron at 6 Reichsthaler by the end of April. For this he asks the Prince to send 950 or 1,000 Centner of iron to Konotop by 20 April.'
oe1bu9454-021: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends the Prince another messenger, by way of Lombardini. After a visit from Dlugo Lędcki he reports fear of the Russians arriving soon; in the judgement of every Pole, he says, the Prince will get back the Trąbczyn, Kamionna and Brzyce estates. He asks for a quick reply and for money for bribes, since he is without means; he says he has leased out Konotop and Świniary for 14,000 Reichsthaler a year. He expects the document and the money. Lombardini is to give Triebenfeld's daughters in Wrocław at least 200 Reichsthaler in coin.
oe1bu9454-022: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains to the Prince about the lawsuits he is conducting on account of his surety for the Prince: over the army''s Invalids'' Fund, with Oppenheimer and with Schliefen. In Poland he says he is suing Meierowitz, who owes Schliefen 6,000 Reichsthaler of purchase money from Witów and the Prince 2,500 Reichsthaler of ground rents. He says Stenger is to pursue the matters; he calls Hawich the greatest rogue, and says a Badenski is collecting in all the money. Lombardini did not pay the 150 Reichsthaler; Triebenfeld would like 500 Reichsthaler in coin for his children.'
oe1bu9454-023: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains that the Prince has sent Triebenfeld's daughters no money; he says that beyond the 4,300 Reichsthaler he received he has borne great costs himself, is subject to execution and is ill with gout. Criminal Councillor Stenger is to put everything in order in Zagórów, Trąbczyn, Pszczew and Witów; Stenger promises to recover Trąbczyn and Kamionna and proposes a clerk of the court, Seifert, for 250 to 300 Reichsthaler, and Triebenfeld asks for approval. Honrichs is to prove his identity, or Stenger will have him arrested. It is said that the Russians are going to occupy Poland.
oe1bu9454-024: Prince Hohenlohe-Ingelfingen asks a privy councillor to arrange a loan of 400,000 Reichsthaler to pay off all his debts, secured by a first mortgage on his lordships of Zagórów and Trąbczyn. He says their net yield after the colonisation has been confirmed by the Kalisz Chamber of War and Domains at 40,247 Reichsthaler. A power of attorney and documents are to follow. With the letter go a list of the places in both lordships (among them Trąbczyn, Szetlewek, Przybysław), a calculation of yield signed by Triebenfeld (hereditary rents of the colonies 16,781 Reichsthaler) and a list of debts totalling 366,000 Reichsthaler, including Prusimska at about 16,000.
oe1bu9454-025: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince he has settled a new peasant uprising in Zagórów against the separation of the lands. Through Councillor of Justice Bucholz, 80,000 Reichsthaler from a von Bredow have been promised to him: 30,000 Reichsthaler on Konotop, 20,000 on Świniary, 30,000 on Trąbczyn for Weigel''s Grotowski mortgage. To be paid out are 25,000 to Countess Schlabrendorff, 25,000 to Weigel, 5,000 to Hahn for Koszęcin and 5,000 in cash to the Prince. Tesmar is negotiating with Nathusius in Magdeburg over 360,000 Reichsthaler on the South Prussian estates.'
oe1bu9454-026: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince he has learned from Secretary Koppe that the Prince survived the Prussian army's defeat. Minister von Stein lent Triebenfeld 8,000 Reichsthaler on the Konotop mortgage of 10,000 Reichsthaler. He is sending the order for 6,000 Reichsthaler to Koppe, and he intends to bring 4,000 Reichsthaler as soon as he knows where the Prince is staying. On a mortgage on Świniary of 20,000 Reichsthaler he means to ask Stein for money again. He hopes the Prince will receive the Kolzig estates; then he could raise 100,000 Reichsthaler.
oe1bu9454-027: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that the Prusimski family has taken Trąbczyn and Kamionna by force. He has only had protests entered in order to secure the sum he registered, but for the time being he expects them to be rejected. He says Napoleon's answer to a letter from General von Sanitz's wife, whose husband's estates were taken from her, will serve as the standard. He intends to travel tomorrow to Memel, perhaps on to St Petersburg, and hopes to obtain help through Emperor Alexander or Grand Duke Constantin.
oe1bu9454-028: 'Hawich, who helped administer the Prince''s estates locally, reports to Prince Hohenlohe-Ingelfingen that, by order of the governing commission, the Trąbczyn estates were taken away by the appeal judge von Lipski and handed over to Canon von Jezierski, general attorney of Mrs von Dąbska née von Prusimska; he says he lodged a protest. New lawsuits: Provost Iwanski demands the tithe from Swięcia, and Martin von Otocki and the miller Ekstaedt demand about 7,000 Reichsthaler in compensation arising from a Trąbczyn lease contract of 1798. He asks for the settlement from Wrocław and for a power of attorney.'
oe1bu9454-029: Bally, in the service of Prince Hohenlohe-Ingelfingen at Sławięcice, reminds Triebenfeld of the meeting Triebenfeld had promised him when they met Court Councillor Hahn at Łosiów near Brzeg. He supposes Triebenfeld to be in Wrocław again and asks whether and when he might call on him there, since his master, the Prince, has asked about it. He has heard that French troops are to be quartered at Sławięcice as well. In that case he could not get away, and it would be worse still if he had to clear out the stables. He hopes for a talk soon.
oe1bu9454-030: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that French gendarmes held him under arrest as the Prince's general attorney until the arrears of interest of 5,000 Reichsthaler on the Invalids' Fund's loan of 50,000 Reichsthaler were paid. Oppenheimer, who had taken on the payment, bought himself free. Zastrow stood surety for 5,000 Reichsthaler, to be repaid by 1 June. Triebenfeld urgently asks for the return of the order for 6,000 Reichsthaler assigned to Eysenhardt, so that he can redeem his pledged mortgage of 10,000. Zastrow is pressing the French authority for the return of the Trąbczyn estates.
oe1bu9454-031: 'Triebenfeld, who says he fell ill after his arrest over unpaid interest, asks Prince Hohenlohe-Ingelfingen for the return of the order for 6,000 Reichsthaler so that he can recover the pledged mortgage of 10,000 Reichsthaler. He complains that the Prince has appointed Hawich of Pyzdry as justiciary and has given Honrichs a general power of attorney, which he says should be demanded back, and he proposes salaries totalling 1,800 Reichsthaler. On the lawsuits: Ignatz von Radzinski is in arrears as hereditary lessee of Szetlewek; the Przespolewski case belongs to Trąbczyn and the Prusimski heirs.'
oe1bu9454-032: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince he cannot send a new statement of the Zagórów estates; in the one sent two years ago only the Trąbczyn revenues need to be deducted. He puts the income of the lordship of Zagórów at 27,700 Reichsthaler a year and the debts at 148,800 Reichsthaler, so that 20,260 Reichsthaler would remain. Oppenheimer has not paid the 50,000 Reichsthaler to the army's Invalids' Fund; Triebenfeld has sued him. He does not consider the Trąbczyn estates lost. He had had 200,000 Reichsthaler from Holland in prospect and asks for early news of the Prince's prospects.
oe1bu9454-033: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, urges the Prince to be very cautious with general powers of attorney: according to Chief Inspector Hecker, Honrichs used his power of attorney to lower the price of the Hufen to be sold from 600 to 300 Reichsthaler. He proposes using a capital of 150,000 Reichsthaler to settle with Oppenheimer, Haugt, Ephraim and Eysenhardt, and to pay the army''s Invalids'' Fund 50,000 Reichsthaler in Courant. He says he obtained from the French authorities an order concerning the arrears in South Prussia, with military assistance.'
oe1bu9454-034: 'Triebenfeld, replying to Prince Hohenlohe-Ingelfingen, calls Honrichs''s submission boundless nonsense: he says Honrichs never answered any of 21 letters and delivered neither money nor account. He says that after Schmid''s death he engaged Hecker at 600 Reichsthaler a year plus an allowance in kind, since the French authority wants to have the arrears collected and proof attested by a court is needed for that. His chief concern is the repayment of the money borrowed for the army''s Invalids'' Fund and the return of Zastrow''s bill of exchange and mortgage.'
oe1bu9454-035: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, protests against the instructions the Prince issued through Court Councillor Meyer to Privy Councillor Amelang: sums are to be drawn on the bank order for 6,000 Reichsthaler that has been declared invalid. He says he was arrested as the Prince''s authorised representative over 5,000 Reichsthaler of interest; with the help of Minister von Zastrow, 5,000 Reichsthaler were borrowed from van der Lahr, payable on 14 May. He urgently asks for advice on paying the missing 3,125 Reichsthaler and for an order to Amelang to return the bank order to him.'
oe1bu9454-036: 'Writing from Öhringen to Triebenfeld, the writer defends his handling of the order for 6,000 Reichsthaler: he says Eysenhardt demanded 2,500 Reichsthaler in cash in January 1807 on account of an old debt and received the order in return for repayment of 3,500 Reichsthaler. After payment was suspended, the writer says he instructed Assessor Koppe to pay Eysenhardt and to take back the order held in safekeeping by Amelang. He sends the 3,000 Reichsthaler in Courant that Eysenhardt demanded and asks for a visit on the journey to Vienna.'
oe1bu9454-037: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he does not want to pass on the deposits of the Prince to Koppe, because Eysenhardt is then to draw money from the bank assignment. He says the bill of exchange belonging to it has expired. The Prince should instruct Amelang to return the assignment and satisfy Eysenhardt in some other way; otherwise Triebenfeld intends to have it publicly declared invalid. He says he is as good as under arrest and asks for 2,000 Reichsthaler for the interest on the Invalids' Fund's loan. He says Laar must receive 5,000 Reichsthaler in Courant, or Zastrow will be put in difficulty.
oe1bu9454-038: Triebenfeld, seriously ill, reports to Prince Hohenlohe-Ingelfingen the receipt of 3,000 Reichsthaler from the banker Veit and the handing over of the order of payment to Amelang. He says he has used it to pay off part of new debts of 5,176 Reichsthaler. Instead of money, timber and boards from Konotop were accepted, with which 4,176 Reichsthaler are to be paid off. He says the Prince should make good to him the loss of 3,480 Reichsthaler. He advises raising 150,000 Reichsthaler in order to acquire papers worth 750,000 Reichsthaler and pay all the debts.
oe1bu9454-039: On his return to Berlin, Triebenfeld faces enforcement proceedings over 3,000 Reichsthaler of debts. Of the 6,125 Reichsthaler to be settled, Prince Hohenlohe-Ingelfingen has authorised 3,000, leaving 3,125 outstanding. Triebenfeld begs for an authorisation for at least 2,000 Reichsthaler so that he can travel to Königsberg, and intends to look for guarantors. Nothing is coming in from Zagórów, so he says the strictest enforcement through the French authority is needed. Letters should go to Justice Commissioner Empich. He reminds the Prince of the large loan.
oe1bu9454-040: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, argues to the Prince for a loan of 250,000 Reichsthaler on the Zagórów mortgage, with which, he says, securities worth 750,000 Reichsthaler could be bought and all debts paid off. He says 46,000 Reichsthaler are needed first (Oppenheimer about 28,000, the Invalids' Fund 15,000, Meyer Bernhard and small items 3,000). He is to go first to Vienna, then to Holland and Paris. He says the French government promised military help in collecting the Zagórów arrears; the subjects are refusing the interest due because of a ban by the King of Saxony.
oe1bu9454-041: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, received the letter of the Prince too late to travel with the Count to Erfurt, where the two Emperors were meeting, and he has no cash. He means to borrow money and, when the Emperors return, to work through the Grand Duke on the Prince's behalf. He says the French government has partly lifted the sequestration in South Prussia and ordered the revenues released. He says Lichnowski belongs at Trąbczyn and must wait there. Metzig is to be reprimanded for not collecting the townspeople's debts of 8,000 to 9,000 Reichsthaler.
oe1bu9454-042: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that he was arrested by French gendarmes as the Prince's authorised representative, so that arrears of interest of 3,521 Reichsthaler would be paid to the army's Invalids' Fund. Since van der Lahr is suing him for a further 3,000 Reichsthaler and is preventing his departure, he urgently asks for 2,068 Reichsthaler to be sent to Konotop, which his creditors are placing under sequestration. He says the French General Government has ordered the lifting of the sequestration on account of the Invalids' Fund. He says he has protested against the sequestration of Zagórów and has begun proceedings against Oppenheimer.
oe1bu9454-043: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince a judgment passed on to him by Amelang: van der Lahr, a creditor, is to receive the remaining 3,000 Reichsthaler in cash rather than in paper, and in the bill of exchange proceedings Triebenfeld otherwise faces arrest. Amelang has appealed and, with Grevenitz, considers victory certain, which would save about 1,500 Reichsthaler. Triebenfeld begs for the 3,000 Reichsthaler to be deposited quickly. He says the sequestration is to be lifted after payment of about 10,000 Reichsthaler in interest. He asks for 600 Centner of iron for the merchant Michaelis, who gave him 2,000 Reichsthaler.'
oe1bu9454-044: 'The lawsuit of van der Lahr, a creditor, is keeping Triebenfeld at Konotop: according to the judgement communicated by Amelang, van der Lahr is to receive a further 3,000 Reichsthaler with interest, but must accept paper. Triebenfeld tells Prince Hohenlohe-Ingelfingen he has repaid Coste the 9,000 Reichsthaler and paid 450 Reichsthaler in interest; he needs 2,068 Reichsthaler. By order of the French government these sums are to be reimbursed out of the Zagórów estates. Michaelis is willing to settle the 2,068 Reichsthaler if the Prince delivers him 600 Centner of iron at 4 Reichsthaler, free to Opole, by May.'
oe1bu9454-045: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he has left Berlin to avoid imprisonment after the court ordered the immediate payment of 3,000 Reichsthaler to van der Lahr, a creditor. Amelang has appealed. The merchant Michaelis gave 2,400 Reichsthaler for the payment of Mathieu. Triebenfeld thanks the Prince for the promise of 600 Centner of iron, which he says he has sold to Michaelis, to be delivered by 1 May at 4 Reichsthaler per Centner free to Berlin, and he asks for delivery to Konotop at the beginning of April and for 100 Friedrich d'or and 100 ducats. Hawich and Hecker brought good news from Zagórów.
oe1bu9454-046: Amelang, the legal agent of Prince Hohenlohe-Ingelfingen in Berlin, writes to Triebenfeld that he will probably have received the Prince's letter together with the enclosed money, which was drawn from Berlin on Konotop. In one lawsuit, he says, the files lie with the court of appeal for judgment, but no favourable decision is to be expected, because a declaration of the King printed in the Berlin newspapers today orders that bonds be paid in Courant, retroactively to 1806. Amelang expresses his sympathy for Triebenfeld.
oe1bu9454-047: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, replies to a court councillor on four points. He says the general moratorium granted by the King of Saxony protects the Zagórów estates for 3 years provided the interest is paid. The 50,000 Reichsthaler of the Invalids' Fund, he says, stand as the first mortgage, and lawsuits against Oppenheimer are pending in Berlin and Kalisz. Meyer's claim, he says, is unfounded; a suit for 25,000 Reichsthaler is pending against Giese et Consorten, as is one in Niedźwiecki's case. The petition of the colonists of Augustinow for remission of their payments should be rejected, since their hereditary lease contracts oblige them to pay.
oe1bu9454-048: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, has received Hawich and Chief Inspector Hecker, who administer the Zagórów estates for the Prince, and has issued thirteen court powers of attorney. Hawich is to press for the dismissal of the claim of Dąbska, daughter of the former owner Prusimski, to the Trąbczyn estates and to work for the lifting of the sequestration. Further instructions: to collect interest, to sue Oppenheimer et Wolff in Kalisz, to remove the sequestrator Honrichs and annul his unauthorised sales of land, to recover arrears of rent from Niedźwiecki, to conduct boundary lawsuits and to represent the Prince at the Diet in Warsaw. Triebenfeld believes the bond for 250,000 Reichsthaler gives him a say among the creditors.'
oe1bu9454-049: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains that a messenger from the household of the Prince came without any answer to his letter. He says he is under arrest and may not leave until the promised 600 Centner of iron have been sent off and justice-burgomaster Schenck has released him. He urgently asks that the iron be sent to Bojadła (Boyadel) to his administrator Neumann. With 1,000 Centner, he says, Michaelis, van der Lahr and all the Berlin costs would be satisfied. In a postscript he reports a rumour of a Russian corps on the Polish-Silesian border.
oe1bu9454-050: 'Prince Friedrich Ludwig of Hohenlohe-Ingelfingen asks King Friedrich Wilhelm III not to force his agent Triebenfeld by execution or distraint to pay a sum for which the Prince himself stands surety. The French government had extracted from Triebenfeld 3,125 Reichsthaler in interest owed to the army''s Invalids'' Fund on a capital of 50,000 Reichsthaler secured on the Prince''s Zagórów estates. For this Triebenfeld borrowed 5,140 Reichsthaler from van der Lahr against a bill of exchange with Zastrow. Van der Lahr sued for the remainder. Amelang is to settle: 1,000 Reichsthaler in cash, the rest in iron by May.'
oe1bu9454-051: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that the execution against him has been lifted, but the iron has still not arrived. He travels to Königsberg tomorrow and will not judge the inheritance matter until after that. Because of the new decree on seizure of property in Poland he has summoned Honrichs, who he says means to bring the Prince several thousand. He says Hawich seems to be a scoundrel; Triebenfeld fears he is holding back original papers entrusted to him. Bethusy lies gravely ill. Rumours from Saxony: Prince Hohenzollern near Leipzig, Austrians in Munich. In a postscript he says Honrichs is coming and is to bring money.'
oe1bu9454-052: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from Königsberg to the Prince that he has presented the Prince's letter together with its enclosures to the Queen, who received it kindly. She passed the matter to the Grand Chancellor, who forwarded it to Cabinet and High Court Councillor Albrecht, with whom Triebenfeld is now working on it. Since Beyme appears to pay close attention to form, he fears a long drawn out business. The King has forbidden any talk about politics, and especially about the war between France and Austria, as the reports contradict one another. Köckritz sends the Prince his regards.
oe1bu9454-053: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from Königsberg that no decision has yet been issued in the inheritance matter of the Prince; the case lies with Grand Chancellor Beyme together with the opinion of Cabinet Councillor Albrecht. He urges the Prince to write frankly to the King about his court martial case and to ask for it to be brought to an end. He says Major von Pirch is his most faithful friend. Massenbach''s case, he says, depends on Scharnhorst, who is ill with fever. He adds war news: Russia, he says, is breaking off the diplomatic negotiations with Austria, and Schill is said to have cut down 2 regiments and taken 4 cannon.'
oe1bu9454-054: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, begs the Prince to deliver the 600 Centner of iron (300 of bar and hoop iron, 300 of rail iron) to Bojadła by 23 April instead of to Opole at the end of May. He says delivery in Berlin on 1 May was promised to the merchant Michaelis, under a penalty of 500 Reichsthaler and a bill of exchange for 2,400 Reichsthaler. Van der Lahr, a creditor, he says, offers 5 1/2 Reichsthaler per Centner and should accept 6. Triebenfeld intends to raise the 4,000 Reichsthaler assigned at Zagórów. Against an alleged threat by the creditor Weigel, he says the general moratorium until Midsummer 1810 gives protection.
oe1bu9454-055: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that van der Lahr, a creditor, is now proceeding against him in Wrocław as well. He is waiting for 1,000 Centner of iron at Konotop. On the Colonna inheritance for the Queen, he says Count Götzen can serve as a witness, but advises restraint because of Count Wratislaw. Triebenfeld proposes that the Queen should take the estates, worth about 3 million, and leave Wratislaw the money. For Götzen he has drafted a letter to the Queen. He adds war news and Bethusy's debts of about 500,000 Reichsthaler.
oe1bu9454-056: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, waits in vain for the 1,000 Centner of iron, without which he says he has neither travel money nor any way to satisfy Michaelis, who has just arrived from Berlin, and travel to Königsberg, and he asks the Prince for prompt delivery to Bojadła. He reports in a postscript that iron has left Opole, but that he is expected to pay the freight. Van der Lahr, a creditor, is to receive 400 Centner at 5 Reichsthaler 12 Groschen, that is 2,200 Reichsthaler. He asks the Prince to take over the freight and to send the missing 217 Centner.
oe1bu9454-057: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince he cannot come to report for lack of money: a trunk worth more than 800 Reichsthaler was stolen from him on the journey. The iron, he says, is lying at Konotop, and the remaining 400 Centner are not enough to pay van der Lahr, a creditor, the 3,000 Reichsthaler. Reporting on his stay at Königsberg, he says the King ordered that the Prince be spared, and that in the inheritance matter Hoyok is to search for the will in Warsaw. Once the Prince''s case is decided, he says, the Prince is to become Governor General of Silesia.'
oe1bu9454-058: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, thanks the Prince for 50 Friedrich d''or, which he says he received through Bally and used to buy himself off from the execution for four weeks. At Kosten he says he must provide 80 armed men. Reporting on a visit to Kalisz, where Garczynski is Chief Prefect and Zychlinski holds office, he describes the plans of the Poles: the restoration of Poland and Constantine as king. He says he is writing to the King to forbid exports as well, and warns that acting too hastily risks confiscation of the estates.'
oe1bu9454-059: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains to the Prince about the sequestration of Konotop and the execution against the Świniary estates on account of 2,560 Reichsthaler in interest and the debt owed to van der Lahr, a creditor. He says he sent van der Lahr iron and boards worth 2,570 Reichsthaler, leaving 430 Reichsthaler outstanding. Grain, wool and timber worth about 7,000 Reichsthaler are finding no buyer, which is why he cannot come to the Prince. The Prince should write directly to the King. Honrichs may not take money out of the country, and Triebenfeld asks Brzechffa whether cattle and grain may be exported.
oe1bu9454-060: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that at the instigation of van der Lahr, a creditor, everything in Świniary has been sealed and placed under sequestration, and in Konotop too. Van der Lahr has been paid, he says, and Grevenitz is sending his receipt and consent, which Triebenfeld is forwarding to Loen in Wrocław. The sequestration, however, remains in force on account of the interest on 1,860 Reichsthaler. Fetching money from Zagórów has been forbidden, he says, and Honrichs arrested. He asks the Prince to raise 1,800 Reichsthaler and send it to Professor Schade. He says he cannot travel to the Prince for the time being.
oe1bu9454-061: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, urgently asks a court councillor in Wrocław to obtain 1,800 Reichsthaler for interest now due from the Prince. He says the affair of van der Lahr, a creditor, has left him exposed and that his estates have been placed under sequestration. With 1,800 Reichsthaler, he says, Świniary could be saved. He then intends to break up part of his estates, assign the interest to his children for their support, and go to the King. Without help he says he will go to Königsberg; with it he could leave on 12 September and be in Sławięcice on the 16th.
oe1bu9454-062: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains to the Prince that he has had no answer to five letters, and sends this sixth one through the Chief Post Director Mann. He reports that everything seems to be succeeding: he says the Courland debt will be paid off, the settlement annulled, Cosmar, who administers the Prince''s entailed estates, must withdraw, the Prince will come into possession of the entailed estate, and the Polish estates will have to be given back. He says he is suffering pressing hardship and urgently asks for money, if need be by express messenger. Letters should be sent to Mann in Vienna.'
oe1bu9454-063: Writing to Prince Hohenlohe-Ingelfingen after a seven-week illness, Triebenfeld reports that before Konotop can be leased he must pay 8,000 Reichsthaler in arrears, and that he hopes for a timber buyer. Honrichs has arrived; Triebenfeld advises coming to terms with the Prefect, who wants to buy the estates and can help in recovering the Trąbczyn estates, in wresting the appropriated estates from Dąbska and in turning away the administrator. He says Hecker and Hawich incited Niedźwiecki and Ostarszewski to make a denunciation that brought about Honrichs' arrest, and that the informers have retracted it in writing.
oe1bu9454-064: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince the death of the Queen at Strelitz and the King''s serious illness. He says the Colonna affair is now an absurdity and the Prince should secure his 100,000 Reichsthaler. Because of the interest on the Invalids'' Fund''s capital, he says, sequestration of his estates is threatened. He encloses a proposal to a friend: Knobelsdorff''s estates Biskupice and Molna at 700,000 Reichsthaler in exchange for the Zagórów estates and the discharge of the claims of Weigel and Stössel. In a postscript Triebenfeld urgently asks for 300 Reichsthaler in gold.'
oe1bu9454-065: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks that the Prince's Koszęcin ironworks lend him 300 Centner of bar and hoop iron against the enclosed bill of exchange, at 4 Reichsthaler 12 Groschen per Centner delivered free to Bojadła. The freight charges should be paid there, since he says boatmen have taken iron from him in the past. He intends to trade iron for spirits. A commission is to bring his sequestration to an end, after which he means to travel to Sławięcice. He sets out his debts, amounting to 25,100 Reichsthaler in all, and reports a rumour that the Prince has been appointed Governor General of Silesia.
oe1bu9454-066: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince he expects the false informers who denounced Honrichs to be given six years' imprisonment in a fortress and the agitators to be expelled. Honrichs' claim against Hecker, he says, is three times the latter's security. Requests from the colonists and peasants for a reduction of interest should be refused. For Garczynski, Zakrzewski and Brzechffa he is having three bucks shot. The boatmen Kulawy and Neumann are holding back some seventy odd Centner of iron over 243 Reichsthaler 14 Groschen of freight charges; he asks for the receipts. The Trąbczyn lawsuit will cost a great deal. Coste, he says, would pay 8,000 Reichsthaler for 2,000 Centner of bar iron.
oe1bu9454-067: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince he cannot leave Konotop because Coste has not come; Konotop has been leased out, Świniary not yet. Hawich accuses Honrichs of fraud; Triebenfeld has summoned both and wants to send an actuary to Zagórów to find out who has taken money from subjects and tenants. He says Hawich, Honrichs and Hecker have unlawfully appropriated Hufen for themselves. More than 12 deputations from the village communities asked for time to pay. He asks for the freight, customs and weighing notes for the iron.
oe1bu9454-068: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that Honrichs has shown Hawich's statements to be false. Under their contracts, the colonists must reimburse the Prince for the requisitions of 22,000 Reichsthaler. For the hearing on the 28th before the justice of the peace Kwilecki in Konin, Honrichs needs the original deed of gift for Trąbczyn. Triebenfeld urgently asks that it be sent by express courier, saying the Kamionna matter also depends on it. Kwilecki advises suing Lipski, who handed the Trąbczyn estates over to Dąbska. Triebenfeld is without means and demands at least 1,000 Reichsthaler in Courant.
oe1bu9454-069: Bally writes from Konotop to Prince Hohenlohe-Ingelfingen that he could not obtain the money at once in Wrocław and was delayed by the roads and the weather. At midday on the 25th he still found Honrichs and Cabanis at Konotop. Both left the same day, Honrichs with 6,000 Reichsthaler and the original deeds of gift, and in the happiest of spirits. Triebenfeld is suffering from his right arm. He has promised to come to Sławięcice for a few weeks as soon as his own business is finished. Bally intends to return soon.
oe1bu9454-070: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince an advantage in the Trąbczyn lawsuit: Kramplitz failed to appear, and a new hearing has been set for 2 April. He says Raczkowski and Küntzel are pursuing the matter with Honrichs, and he considers recovery certain. Hecker, who has given surety and means to pay by Midsummer, remains at the cash office because of a misunderstanding on the part of Chief Prefect Garczynski; Cabanis is to check on him. Triebenfeld intends to go to Berlin for 6 days. For the sequestration of his own estates the Landschaft is demanding some 4,000 Reichsthaler in costs.'
oe1bu9454-071: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince that the Rochlitz matter has been started. He hopes the Prince will not have to pay anything, and calls it a swindle. He says he dismissed Rochlitz in 1804 as general attorney, which Glenck could confirm. He urgently asks for two or three printed powers of attorney for the lawsuit, signed and sealed, so that Metzig can pursue the matter and call in outstanding balances of close to 18,000 Reichsthaler. He expects Honrichs and wants to come to Sławięcice as soon as the matter is safely on track.
oe1bu9454-072: Writing to Triebenfeld about his Polish possessions, the writer says he has given up the exchange project with General von Schimmelpfennig and suspects that the lease to the sub-prefect Brzechffa has fallen through. He says he has permitted an inspection of the estates around Zagórów for a new exchange project. He also wants to sell his claims on the Trąbczyn estates and is sending a messenger about the original deed of gift. He asks what came of Brzechffa's intercession in Warsaw in the Trąbczyn lawsuit, and requests the 300 Reichsthaler for Lieutenant Sommer.
oe1bu9454-072a: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that the lawsuit against the peasants of Wrąbczyn has been won: the contract has been annulled, the arrears are to be paid, and eviction is possible. The journey with the sub-prefect Brzechffa to Sławięcice has been postponed, since Brzechffa and Prefect Garczynski have been summoned to Warsaw; he says Brzechffa is bringing 2,000 to 3,000 Reichsthaler, and the Prince should decide on the lease contract for Zagórów. The Trąbczyn matter is to go before the Rada Stanu. Despite 80,000 Reichsthaler of debts, he says, the estates would be free of debt if the old Hollander settlers pay 40,000 Reichsthaler for the forest and Dąbska has to pay damages.'
oe1bu9454-072b: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince, on the basis of the enclosed letters from Brzechffa and Thiele, that the sub-prefect Brzechffa cannot leave Warsaw until the 15th and intends to bring money with him to Sławięcice. He says Brzechffa has promised to avert the new assessment of the Zagórów estates at 5,897 Reichsthaler. Niedźwiecki, he reports, lost the lawsuit and is to pay 2,000 Reichsthaler, while the Wrąbczyn peasants are threatening to appeal. The district under-judge Piekarski, ringleader in the Trąbczyn affair, who had forbidden the collection of interest and induced the colonists to bring complaints, has been suspended.
oe1bu9454-072c: Thiel, a district councillor at Kalisz, sends Triebenfeld a letter from the sub-prefect von Brzechffa, just received through the lawyer von Wieckowski. From it, he says, it appears that Brzechffa, because of his business, does not intend to leave Warsaw until the 15th of March, and that there is a good prospect regarding the lordship of Trąbczyn.
oe1bu9454-072d: Brzechffa writes from Warsaw on 5 March 1812 to Triebenfeld, whom he addresses as friend and brother, that because of various pieces of business he cannot leave Warsaw until the 15th of the month. According to reliable information he has gathered, the matter concerning Trąbczyn stands quite well. He will tell Triebenfeld the details in person.
oe1bu9454-072e: Brzechffa writes from Warsaw on 5 March 1812 to Triebenfeld, whom he addresses as friend and brother, that because of various affairs he cannot leave Warsaw before the 15th of the month. According to certain information he has received, the matter concerning Trąbczyn stands well. He intends to explain more fully on his return.
oe1bu9454-072f: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that an excessive delivery of grain and straw has been imposed on the Zagórów estates and that they have again been placed under sequestration; he says the Upper Prefecture in Kalisz refused to collect the interest from the peasants. He says Brzechffa was willing, at his request, to settle the deliveries, and that the sequestrator was recalled. Triebenfeld is laid up with gout and complains of the billeting of troops, of subjects who have fled and of lack of money. He says Honrichs is to be arrested for embezzling dues.
oe1bu9454-073: 'Prince Hohenlohe-Ingelfingen sets conditions for the offer of Brzechffa, a sub-prefect, to lease the Zagórów estates: lease payments every half year in advance, a cash security, protection against claims for remission, all burdens to be borne by the tenant, and a sum to be paid for withdrawal in case of a sale. Triebenfeld is to come soon with Brzechffa, who is to bring several thousand Reichsthaler with him. The dealings over an exchange of estates with Schimmelpfennig have stalled. The Prince thinks the plan to sell to Weigel and Stössel has little prospect. He wishes Triebenfeld success in the Oleśnica and Trąbczyn matter and hopes for a considerable sum.'
oe1bu9454-074a: The army's General Invalids' Fund asks the Superior Court of Appeal at Berlin to attach the legacy of 80,000 Reichsthaler which Princess von Sacken left to Prince Hohenlohe-Ingelfingen. In 1805 the Fund lent Triebenfeld 50,000 Reichsthaler, secured by the Prince's bond for 250,000 Reichsthaler on the Zagórów estates; interest of 9,375 Reichsthaler has been in arrears since 1807. The Fund's advocate Mitschke at Kalisz is to sue and, if necessary, apply for sequestration of the estates. Since the Kalisz prefecture counted the mortgage among the Bayonne sums and Triebenfeld's estates of Konotop and Świniary are encumbered with debt, the legacy is to be attached in the hands of Kircheisen, said to be the executor of the will.
oe1bu9454-074b: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince it is necessary to appoint a head forester at Zagórów. He says the judge now has to manage the propination rights, because the woman Nagel has called away her nephew, who had been intended as the propination official. If the Prince wishes to help poor Radszewski, he should send him quickly; Radszewski would have to be content with 300 Reichsthaler a year. Triebenfeld also asks for the Prince's opinion on the exchange of the estates.
oe1bu9454-074c: 'The Berlin Court of Appeal calls on Kircheisen, as executor of the will of the late Princess von Sacken, to pay Triebenfeld nothing from a legacy of 80,000 Reichsthaler, should the General Invalids'' Fund''s complaint prove well founded: that Prince Hohenlohe-Ingelfingen is to receive that sum from the estate and has assigned it to Triebenfeld in settlement of his claims. A letter in the same terms goes to Cosmar. The Superior Provincial Court of Silesia sends Triebenfeld at Konotop the summons and requires a receipt for it.'
oe1bu9454-074d: 'The Berlin Court of Appeal summons Triebenfeld at Konotop on the application of the army''s General Invalids'' Fund: an attachment has been imposed on the legacy of 80,000 Reichsthaler which the late Princess von Sacken bequeathed to Prince Hohenlohe-Ingelfingen. Triebenfeld is to appear on 23 August at 10 o''clock before Court of Appeal Councillor Roitsch, in person or through a justice commissioner, to present his objections and the loss he faces, state the amount of the security and attempt a settlement. If he fails to appear, the attachment stands.'
oe1bu9454-075: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, returns to the Prince the letters of Count v. S. that the Prince sent him. He is glad the Count is behaving honestly, but regrets that he cannot win the Prince 40,000 to 50,000 Reichsthaler. According to Reinhardt, nothing has come of the matter of the assistance of the Treasury. Goldbeck hears that Hoym is keeping the South Prussian Department; Priebich, on the other hand, assured Councillor Kruger that Haugwitz would become minister. Chelmski has not appealed, and the estates might perhaps be leased out at Midsummer. The form for the power of attorney will follow after Melzer's return.
oe1bu9454-076: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that the exchange of his estates for crown estates is now under way and may perhaps soon be concluded. He intends to travel to Berlin at the beginning of September and to stay until the end of the month. There he hopes to see the Prince again and to report to him in person on several pieces of business.
oe1bu9454-077: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that the exchange of his estates is going as wished: the King has written by way of Cabinet Councillor Beyme, and Minister von Voss, the minister for South Prussia, is to report with all speed. He says Glenck, who leases the Prince''s estates, is to work out the valuations thoroughly, to match the schedule and the contracts. Triebenfeld has won over a man in Potsdam and is arranging a loan. He says Michaelis will write asking for a power of attorney. Triebenfeld asks for signed blank forms. In a postscript: Buerensprung has become Land Forestmaster, Wedel stays in office, and Lindenau has been given the title of Excellency.'
oe1bu9454-078: 'Michaelis, an agent of Prince Hohenlohe-Ingelfingen at Berlin, reports on his visit to the Privy Finance Councillor Schulze, who knew only the Prince''s letter to Minister von Voss and expressed himself neither for nor against it. Michaelis asked him not to decide, should obstacles arise, without a hearing. On Schulze''s advice he requests a power of attorney to be deposited in the registry, and proposes its wording: to pursue, with the South Prussian Department, the proposed exchange of the estates granted to the Prince in fief for a lordship. Triebenfeld says the cabinet''s orders are only now going to Voss.'
oe1bu9454-079: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells the Prince he is waiting for Minister von Voss''s report on the exchange of estates and will stay in Berlin until the Krotoszyn matter is settled. He says Schulenburg and Hoym are well disposed towards the business and that Hoym is willing to give 1,000 Reichsthaler if it comes about soon. He sets out how the money is to be divided: Schulze''s daughter 2,500 Reichsthaler, Klewitz 3,000 Reichsthaler, Michaelis 300 ducats. He intends to borrow 120,000 Reichsthaler from the Widows'' Fund, reports on a dispute at court over a war, and asks for the blank forms.'
oe1bu9454-080: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, adds to his letter of the previous day to the Prince, which Captain Hahn took with him. He says Minister Hoym has returned from Potsdam satisfied, where, according to another man, the Prince was spoken of several times. This, he says, confirms that the King holds the Prince in esteem, and he hopes for a good outcome. In Berlin there is talk of marches or war, but he says he does not yet believe it. Nothing has come back yet from Mr von Voss.
oe1bu9454-081: Michaelis, an agent of Prince Hohenlohe-Ingelfingen at Berlin, reports that despite pressure from Triebenfeld and Eysenhardt he can say nothing definite yet about the exchange of the Prince's estates. Nothing has come in at the South Prussian expedition, so he says the matter is still in the correspondence between Minister von Voss and the Privy Finance Councillor Schulze, and that nothing has been decided. He expects the Prince's power of attorney next Tuesday. With it he intends to prove his authority and obtain reliable information from Schulze.
oe1bu9454-082: Eysenhardt, an agent of Prince Hohenlohe-Ingelfingen at Berlin, reports that the King's cabinet letter in the Prince's case was forwarded to Minister von Voss at Havelberg and has not yet arrived at the chancery. He says Voss will return early, already next Thursday, and may bring it himself. If it is worded as decisively as Triebenfeld says, Eysenhardt expects a favourable outcome. He has also paid Triebenfeld 300 in Prussian Courant on the Prince's account against a receipt.
oe1bu9454-083: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that Krotoszyn will certainly be made over to the Prince in the exchange. In the case of Polajewo there are still doubts, but he says Privy Finance Councillor Schulze assures him that this too can be obtained; there, he says, 100,000 Reichsthaler are to be gained, despite the resistance of the chambers. He asks that Prince George be held back, should he arrive earlier, until he himself comes. He says Hoym has travelled to Pomerania and Voss will return on Thursday. Triebenfeld has written to Voss, Schulze, Beyme and the colonel. He adds rumours: Repnin has received a ukase and the French want to take Hanover.'
oe1bu9454-084: On the exchange of Prince Hohenlohe-Ingelfingen's estates for Krotoszyn, Triebenfeld reports that the King has charged Minister von Voss with settling the matter, and that Voss asked for 4 weeks to produce the final report. The chambers are to examine whether the revenues are equal. Because of the doubts about Polajewo, estates to the value of the surplus yield are to be given from the district of Adelnau, which borders on Krotoszyn. Triebenfeld is travelling to Pszczew, intends to look into the Broniewski business, and will settle Prince George's affair in Wrocław. He says all but Voss are well disposed.
oe1bu9454-085: King Friedrich Wilhelm III refuses Prince Hohenlohe-Ingelfingen's application to exchange his South Prussian estates for the crown domain offices of Krotoszyn and Polajewo. According to the report of Minister von Voss, Krotoszyn alone could yield 49,043 Reichsthaler in revenue once the appurtenances not valued in the present lease are added; the King says Triebenfeld received 26,000 Reichsthaler in compensation for giving up the lease. The state would lose 17,400 Reichsthaler a year. The Prince's estates, valued at 8,650 Reichsthaler, now bring in 40,500 Reichsthaler after improvements of about 26,000 Reichsthaler.
oe1bu9454-086: Prince Friedrich Ludwig of Hohenlohe-Ingelfingen tells King Friedrich Wilhelm III that the report of Minister of State von Voss on the exchange of his South Prussian estates for Krotoszyn is wrong. He says Voss apparently did not report the renunciation of Polajewo and relied only on the councillor of war Nöldichen. Instead of the claimed 49,043 Reichsthaler in yield and 17,400 Reichsthaler in loss, he says, Krotoszyn pays 30,100 Reichsthaler in rent, while his own estates yield 41,500 Reichsthaler. He asks for an impartial commissioner to examine both estates. He says the aim had been to obtain capital to pay off his debts.
oe1bu9454-087: Prince Hohenlohe-Ingelfingen asks Colonel von Köckritz to support his justification before the King after the failure of the exchange of his South Prussian estates for the Krotoszyn estates. Minister von Voss and the King declared the exchange disadvantageous, since Krotoszyn yields 17,400 Reichsthaler more. The Prince objects that Krotoszyn yields 30,100 Reichsthaler and his own estates 41,500 Reichsthaler. He says Voss reported on the advice of the councillor of war Nöldichen without an investigation on the spot. He has asked the King for an impartial investigation and for the files to be submitted by Struensee.
oe1bu9454-088: Prince Hohenlohe-Ingelfingen replies to the letter of 1 December 1798 from Minister von Voss, who has not agreed in the desired way to the exchange, applied for from the King, of the Prince's South Prussian estates for the district of Krotoszyn, without Polajewo. In the Prince's view, Voss's reasons rest only on the reports of the commissioners, who he says assumed more in the case of Krotoszyn than an impartial investigation would show. He is almost resolved to convince the King of the disinterestedness of his proposal.
oe1bu9454-089: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is pursuing for the Prince the exchange of the Prince's estates for Krotoszyn and Polajewo. Letters to the King, to Beyme and to Zastrow have been delivered. Under Triebenfeld's plan the King is to appoint a commissioner or else decide on the basis of equal yield and value. Glenck, as general tenant, pays 44,500 Reichsthaler a year. Triebenfeld disputes that Krotoszyn brings in 49,000 Reichsthaler (rent 30,000 Reichsthaler), and insists on his own disinterestedness. He says the Prince's mother-in-law, Princess Sacken, will give at most 30,000 Reichsthaler, so about 7,000 Reichsthaler are still lacking.
oe1bu9454-090: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to the Prince that the struggle over the exchange of estates is now great, and hopes for success. He complains about conditions in Berlin and about the villains there: he says the monarch is good, but not the ministers. The 7,000 Reichsthaler which Princess Sacken is in no way willing to advance he says he would raise in his own name, pledging all his possessions for it, so that the matter is not lost.'
oe1bu9454-091: Cabinet Councillor Beyme thanks Prince Hohenlohe-Ingelfingen for the explanations the Prince gave in the matter of the exchange of his estates. He says he is glad that the King has ordered a further investigation, and assures the Prince that he will continue to carry out his duties conscientiously. In doing so he intends to reconcile the Prince's wishes, the King's readiness to accommodate him, and the interest of the state.
oe1bu9454-092: Michaelis, an agent of Prince Hohenlohe-Ingelfingen at Berlin, reports that the building councillor Glenck has handed him the receipts of Gleissenbergen and of Schneider. With these he can reply to the General Auditoriat concerning its orders, which had been communicated to the Prince. He expects that Councillor of War von Triebenfeld will report to the Prince today on the state of the Krotoszyn exchange.
oe1bu9454-093: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends the Prince the King's reply to the Prince's last petition. Minister von Struensee had to lay the files before the King. Colonel von Köckritz, who presented a memorandum by Triebenfeld to the King, promises a good outcome. In it Triebenfeld offers, should Polajewo stand in the way, to lease the estates for 30 years, to build 6 peasant farms each year, to clear waste ground and to pay 20,000 Reichsthaler in rent. Because of the 7,000 Reichsthaler he wants to bring the Niedernhall matter to an end.
oe1bu9454-094: 'General von Zastrow tells Prince Hohenlohe-Ingelfingen that a letter from the King goes out with today''s post: the King wishes to have the true value of the Prince''s South Prussian estates and of Krotoszyn and Polajewo investigated, in order to weigh them against one another. If no important obstacles stand in the way of the intended exchange, he says the King will gladly grant the wish. Zastrow thanks the Prince for his letter of the 7th of the month. He says the matter does not belong to his department, but that he hopes for a satisfactory conclusion.'
oe1bu9454-095: Colonel von Köckritz has asked Triebenfeld to assure Prince Hohenlohe-Ingelfingen that the exchange of his estates stands very well and is as good as concluded; Köckritz will not write until it is settled. Triebenfeld says the Privy Cabinet Councillor is acting against his own wishes at the King's desire. A firm refusal, he says, had been planned with someone he names only as B. The King is unwell, so there is no audience; Triebenfeld fears fresh intrigues by Mr von Voss. He takes the secularisation business to be bait from the French.
oe1bu9454-096: Colonel von Köckritz has asked Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, to assure the Prince that the exchange of his South Prussian estates for the crown estates of Krotoszyn is as good as approved; only the King's indisposition is delaying its conclusion. For the Prince's journey to Öhringen, Triebenfeld advises asking the King for leave at once, sending the letter to him by express courier, and travelling by way of Berlin rather than through Bohemia. He says Wedel in Wrocław gave a false opinion in the Krotoszyn matter, and that another gentleman credited Krotoszyn with a capacity of 50,000 Reichsthaler. Cabinet Councillor Beyme let him read the files.
oe1bu9454-097: 'The King wishes Prince Hohenlohe-Ingelfingen to travel by way of Berlin and to stay a few days, the Prince''s agent, Triebenfeld, reports. Triebenfeld hears that the exchange of the Prince''s South Prussian estates for Krotoszyn is to be concluded before the Prince arrives: according to Colonel von Zastrow, the King declared that both sets of estates were to be examined in such a way that neither the state nor the Prince would lose, and only a public cabinet order was lacking. Minister von Voss worked against the exchange, while Cabinet Councillor Beyme and Colonel von Köckritz held firm. On the secularisation business Triebenfeld advises saying nothing for the time being. He will stay in Berlin until the Krotoszyn matter is settled.'
oe1bu9454-098: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he will stay in Berlin until the matter is settled, and is sending Glenck ahead so that the Prince has someone there to take his commands. The King invites the Prince to Berlin; if the Prince leaves on the 14th or 15th, he can stay three to four days. In confidence Triebenfeld reports that Prince Solms married the widowed Princess Louise in secret five months earlier, and that Minister Hoym gave a secret opinion, on which Minister von Voss relies. He advises the Prince not to mention the secularisation business but to pursue it with Prince George in Vienna.
oe1bu9454-099: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that he left Berlin assured from every quarter that the Prince would receive the Krotoszyn estates. He says Minister von Voss has become more yielding. According to Colonel von Köckritz, von Knobloch and Prittwitz are to bring the matter to an end, with Wildeganst assisting Prittwitz. Voss received from Cabinet Councillor Beyme a draft on Krotoszyn by Councillor of War von Cöln, and wrote to the King in terms Triebenfeld calls impertinent. Berlin expects war. A patent as commission councillor is requested for Carl Theodor Fischbach in Pszczew. Broniewski, who has already taken more out of the estates than he is due, will probably receive nothing.
oe1bu9454-100: In a copy of his letter of 25 January 1799, Cabinet Councillor Beyme informs Prince Hohenlohe-Ingelfingen that, after the Prince's letter of the 21st was presented, the King has ordered that the reply be held back until the report arrives that Minister of State von Voss is to supply. Beyme says the Prince himself seemed to expect this.
oe1bu9454-101: A copy of Prince Hohenlohe-Ingelfingen's petition to the King asks him to allow the exchange of the Prince's South Prussian estates for the lordships of Krotoszyn and Polajewo, rebutting the rejection by Minister von Voss. The Prince says 30,100 Reichsthaler is the net yield, the supposed demesne farm is a Hollander Hufe acquired by the Prince's agent, Triebenfeld, and the woods are laid waste. In a new offer he gives up Polajewo, pays 8,000 Reichsthaler a year on Krotoszyn, and settles the difference in value in cash to the Maritime Trading Company. He asks for an investigation by the Poznań Chamber and a report from Hoym.
oe1bu9454-102: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Minister von Voss is expected at Krotoszyn in about three weeks to examine the exchange of the Prince's estates for Krotoszyn. Chełmski has lost in the second instance as well. Triebenfeld says he will not settle with Broniewski for several thousand Reichsthaler until after the Krotoszyn exchange. At Poznań there was an intention to seize Brzyce at once for the daughter of Prusimski; Triebenfeld obtained a term of six weeks and advises asking the Grand Chancellor for an extension of five months. Minister Hoym had the papers on the confiscation decree against the Prusimska woman quietly set aside so that the girl might receive something.
oe1bu9454-103: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he is delaying a settlement in the Broniewski matter, because the proofs Rapacki has newly furnished tell against Broniewski, unless the Krotoszyn exchange requires it. He says he won the Chełmski lawsuit in the second instance. Against the charge that the Prince received too many estates he is drawing up a description of the estates the King gave the Prince. He argues that the Prusimski estates are to be regarded as purchased, since they must first be won in court. As yield he gives Kamionna and Kolno 6,000, Trąbczyn 8,400, Szetlewek 1,600 and Brzyce 4,000 Reichsthaler. Glenck is to lay the account before Prittwitz.
oe1bu9454-104: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, guarantees that the Prince's affair will be brought to an honourable and advantageous end within a couple of months. He says the intention is to prevent a valuation of the Prince's estates and to make everything appear as a matter of grace, and that the exchange will be decided by the balance between the estates. He says he has persuaded Count Schlabrendorff to accept a bill of exchange for one year for the interest owed to him. Around 16 April he will travel to Berlin and stay until the end of May. The estates he sold to Prince George are now valued, he says, at over 700,000 Reichsthaler.
oe1bu9454-105: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, has satisfied Count Schlabrendorff; the interest amounted to 11,085 Reichsthaler, the receipt is made out in the Prince''s name, and Triebenfeld himself has nothing in hand to cover his outlay. He says he was announced to the Princess three times and not once received; he mentions a letter from Prittwitz. Glenck reports unfavourable news in the Prusimski lawsuit; Triebenfeld says he would use the blank forms entrusted to him to ask the Grand Chancellor for an extension of the deadline. He adds court news: the Queen is recovering, and war is out of the question.'
oe1bu9454-106: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, thinks the purchase of estates proposed by the Jew Dann is a swindle. He says Dann wants to win over Mr von Echart, the buyer of the Lichtenau houses, for it, and that Dann has also put such plans to Prince George. He reports that under a decree by default of the Poznań Government the Brzyce estates are to be taken from the Prince again. The chambers are intriguing over the forests, lawsuits are causing high costs, and the exchange of the Prince's estates for Krotoszyn is at a standstill. He believes the ministers would permit the exchange only on the monarch's order.
oe1bu9454-107: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, forwards a letter from Colonel von Zastrow and intends to keep the royal cabinet letter until the Prince's expected arrival. Princess Sacken did not receive him, but he had the Prince's letter delivered to her. He says she declared that she would never return to the Prince, that she wished to live freely and would be content with an allowance of 2,000 Reichsthaler. He says she left out of aversion to the Prince and out of love for her children. Friends advise the Prince to stand firm.
oe1bu9454-108: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains that Prince George, to whom Triebenfeld sold estates, does not reply, despite the letters delivered by President von Schuckmann, and sends no remittances. Triebenfeld says the Jew Kuh has sued him for 5,800 Reichsthaler and obtained a decree of execution, and that he must pay or be arrested on Friday. The minister wanted to calm Kuh but is said not to be coming until Thursday. He says Prince George has burdened the estates Triebenfeld sold him for 280,000 Reichsthaler with debts of 270,000 Reichsthaler. Due are 20,000 Reichsthaler to Liepman Meyer and, on 7 August, 12,000 Reichsthaler. Triebenfeld intends to seek out Prince George and asks Prince Hohenlohe-Ingelfingen for a way out.
oe1bu9454-109: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports to a friend that Wildegansch is in Berlin and claims the Prince has sent him; he says Wildegansch and his followers have invented a money transaction with Asch and Schlabrendorff in order to cheat the Prince out of the costs. He hears that nothing will be decided for two months. In a postscript he adds that Bukowiecki will pay only 2,400 Reichsthaler in yearly rent for Pszczew. He hears that there are plans to sue him over a bill of exchange for 11,000 Reichsthaler given to Schlabrendorff and to obtain a decree of execution; the friend is to warn the Prince.
oe1bu9454-110: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from Berlin that he believes he has concluded the business concerning the deeds for all the former church estates. If his stay is prolonged, he intends to send them to Wrocław by the next post. At first two and a half times the amount was demanded; now he is paying only 240 Friedrich d'or and about 200 Reichsthaler. He says he has borrowed the money from the Privy Senior Councillor of Accounts Mathias, who needs it back in 14 days, and asks the Prince to authorise payment soon.
oe1bu9454-111: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he cannot raise the money to redeem the document, since Wildegansct is ruining all his credit in Berlin. He says he gave the friend who arranged the matter 300 Reichsthaler as a deposit out of his travel money. He asks the Prince for an order to pay the 240 Friedrich d'or against 200 Reichsthaler Courant, failing which he fears a nasty turn. He calls Colonels von Köckritz and von Zastrow true friends of the Prince. Because of the gossip he wants to keep himself in the background.
oe1bu9454-112: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, learns from Court Councillor Wunster that Wildeganst and the Jew Heymann have done nothing in the Prince's business. Wunster says Wildeganst told him that judgment has already been given on the bill of exchange for 11,000 Reichsthaler that Triebenfeld signed for the Prince, and that Triebenfeld is to be arrested; the bailiff Rudolph has already enquired after him. He begs for swift measures. He says Prince George has sold estates for 750,000 Reichsthaler. He proposes that the Prince induce Count Schlabrendorff to take the bill of exchange back from the Jews.
oe1bu9454-113: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, thanks the Prince for the assurance that everything has been settled with Asch and Gad over the 11,000 Reichsthaler, but reports that in this matter an arrest order has been issued against him: if the Prince does not pay the promised 4,000 Reichsthaler, he is to be arrested at once. He says Prince George declares himself on nothing and is dragging out his case. Wildeganst sends word that Asch and Gad would wait until Midsummer, which Triebenfeld says is no rescue for him. He begs earnestly that the matter of the 4,000 Reichsthaler be put in order.'
oe1bu9454-114: Only fragments of this letter to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, can be read. The writer calls an unnamed man a cunning rogue who has caused the Prince much trouble and now, since there is nothing more to extort, wants to close the whole matter. He hopes for an early conclusion, so that Triebenfeld will not be wronged any longer. In his own affair, he says, someone wants something that should not succeed. Collection is to be on Tuesday, at the latest on Wednesday. His health, he says, is improving.
oe1bu9454-115: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, apologises to the Prince for missing lunch: his tenant in Świniary urgently asks him to bring to order the peasants who are refusing their services. He says the minister seems to take it somewhat amiss, on account of Schlabrendorff, that the Prince tells him nothing. Schlabrendorff has been summoned for the 15th and told to withdraw all complaints, since otherwise the minister cannot save him; Asch too is to press him to do so. Triebenfeld is going to Lądek but means to be back on the 15th and to bring in Hirsch.'
oe1bu9454-116: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says illness prevents him from coming in person to obtain the Prince's orders about the sale of the estates. He regards the talk that debts of 150,000 Reichsthaler rest on Trąbczyn, which Walichnowski is to take over, and that Walichnowski is nevertheless to pay 56,000 Reichsthaler and a canon of 5,000 Reichsthaler a year, as a misunderstanding, and he fears for the Prince's honour. He proposes demanding firmly from Walichnowski 60,000 or 80,000 Reichsthaler as hereditary purchase money and 4,000 to 5,000 Reichsthaler in annual hereditary rent. He asks for secrecy and for secret instructions. He says Walichnowski seriously wants to acquire the Trąbczyn estates.
oe1bu9454-117: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is working to pay off von Grotowski''s claim: he says Weigel has promised him 30,000 Reichsthaler with interest against Triebenfeld''s guarantee. But the Bank will only discount once Grotowski has legally assigned his claim, an instrument that Court Councillor Ebersbach has drafted. The Prince is to send Weigel''s letter to Grotowski by express messenger. Grotowski''s agent in Kalisz is to inform the government that no forced sale is pending. Triebenfeld also reports the deaths of Captain von Müllern and of Morgenbeßer, Nelson''s victory, rejoicing in Vienna, and a letter from Bernhardi to Stössel.'
oe1bu9454-118a: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Kunkel and two colonists from Oleśnica offer 1,500 Reichsthaler and want a contract. He thinks them adventurers who could hardly pay the 17,000 Reichsthaler due at Martinmas and Midsummer, and he expects endless lawsuits. Only on the Prince's order will he have a contract drawn up. Senior Steward Nerlich wants Kunkel to obtain Trąbczyn or Zagórów for him on hereditary lease and has 80,000 Reichsthaler in cash. Walichnowski asks what he is to pay. Urbanowski has requested the Trąbczyn valuation. Triebenfeld asks for instructions.
oe1bu9454-118b: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Countess Schlabrendorff is willing to wait for the 50,000 Reichsthaler owed to her until 1 January 1805; Homuth could not obtain a longer term. She complains of her loss, since she receives no interest. If the Prince need pay no interest until then, 2,500 Reichsthaler are gained. Homuth asks for the settlement so that he can send it to the Countess to be executed, and he intends to try to get the old bills of exchange back. The surveyor Cabanis has departed; the hired coachmen in Wrocław demanded 20 Reichsthaler.
oe1bu9454-118c: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Countess Schlabrendorff is willing to wait for the 50,000 Reichsthaler owed to her until 1 January 1805. Homuth could not obtain a longer term, and she complains of her loss. If the Prince need pay no interest until then, Triebenfeld advises accepting the date, since 2,500 Reichsthaler would be gained. Homuth asks for the settlement so that he can draw up the deed, and intends to try to get the old bills of exchange back. The surveyor Cabanis has departed and means to hire a peasant's cart outside Wrocław, which he thinks he can get for 4 or 5 Reichsthaler.
oe1bu9454-119: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, proposes sending the surveyor Cabanis to the Hussites and having some 500 farmers recruited. According to Glenck's table from Zagórów, around 31,000 Morgen of manorial land would be available for division among settlers. Cabanis had already divided a small estate near Strehlen among Hussites, who paid 25,000 Reichsthaler in cash for 23 Hufen. Uminski, according to Prince Biron, finds the price for the Kamionna estates too high, but wants to view them. Triebenfeld considers this mockery, since Broniewski is still sitting in the estates. Rapacki's prospective buyers demand payment terms that are too long.
oe1bu9454-120: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the surveyor Cabanis has found prospective buyers among the Hussites in Husinich and Rentsch. They consider 300 Reichsthaler per Hufe and 15 Reichsthaler in yearly rent fair, have sent a messenger to their Moravian fellow believers, and mean to appear together within a fortnight. Cabanis is to press them further through the clergyman in Hussinitz. Countess Schlabrendorff will release the instrument only once the remaining 50,000 Reichsthaler have been received. Homuth obtains an extension until 1 January 1805.
oe1bu9454-122: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, forwards a note that had been left behind by mistake at his former lodgings. He says Mr Homuth urgently asks that this item be settled soon, so that he can report through the messenger the receipt of the 166 Reichsthaler 16 Groschen. Cabanis is leaving by post for Hussinitz; Triebenfeld expects a quick and happy outcome from this. He has had no news today from Berlin or Frankfurt.
oe1bu9454-123: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, submits to the Prince a letter from Kunkel that arrived by express courier and asks for instructions on how to proceed. He considers an arrangement with Otocki necessary; an amicable settlement, in which Otocki would be satisfied with 1,500 or 2,000 Reichsthaler, would be advantageous, he says. Whether Kunkel should be given a power of attorney to settle he leaves to the Prince. He fears that Kunkel and Jentsch are working against each other and advises instructing both. Glenck did not come again, but left behind the accounts from Konotop, which explain everything.
oe1bu9454-124: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends the Prince his draft of the reply to Kunkel so that the Prince may check whether it matches his wishes. He asks that both letters be copied out fair by someone else, since his wife is being buried today and he has withdrawn with the children to his brother-in-law's. In his own letter to Kunkel he intends to set everything out thoroughly. He has a map of Kopojno, Skokum and Świątniki with him.
oe1bu9454-125: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the men from Oleśnica have arrived with the money and wish to appear before the Prince at 4 o'clock. Triebenfeld has already negotiated with them. He says he will report on the matter to the Prince in the afternoon, and believes it will not be unwelcome to him.
oe1bu9454-126: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the surveyor Cabanis has returned with the Hussites, who he says liked it extremely well. They want to hurry back, gather their fellow believers and settle everything within 14 days. Cabanis brings a great deal of news that Triebenfeld must discuss with the Prince; he urges that someone go there at once. Triebenfeld is working with the people from Oleśnica and asks the Prince to come to him for a quarter of an hour after the parade, to hear them himself and give orders.
oe1bu9454-127: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks the Prince for help with 900 Reichsthaler, since to avoid enforcement he must pay 910 Reichsthaler: 700 for the inventory promised by the Prince under Triebenfeld''s guarantee, 175 of interest from 1799, and 35 of legal costs. He says the Prince has settled no interest. His cash is exhausted, as yesterday he already paid 1,537 Reichsthaler 12 Groschen in another of the Prince''s affairs. Wildegans and Heyman Pincus promise settlement. At Midsummer he intends to support the Prince with timber money.'
oe1bu9454-128: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports on 11 lawsuits, for which he obtained a postponement and is seeking settlements. The tenants are demanding high sums to give up their leases. With Flörken and Ribbeck, who show that they paid 12,600 Reichsthaler in cash and claim 8,000 Reichsthaler for buildings, he is seeking an agreement and has applied for execution and sequestration. He says v. Rudnicki is to depart at Midsummer. With the help of the district administrator the old subjects are paying 1 Reichsthaler of ground rent per Hufe; today buyers were found for 87 Hufen. Glenck mocks the Oleśnica contract to the district administrator.
oe1bu9454-129: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he has had no letters from either Berlin or Frankfurt an der Oder, and asks the Prince to send him comforting news of Glenck. On the matter of Kolzig, Amelang is not replying; if he stays silent, Triebenfeld says the sale of Konotop must be pursued eagerly. He has summoned the tenant Bernhardi and instructed him to recommend the estates to any prospective buyer instead of obstructing the sale out of self-interest, and to receive Ludolff and Stubenrauch well. In the afternoon he intends to bring out the consignment to South Prussia.
oe1bu9454-130: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from Frankfurt an der Oder that nothing has happened yet and that no one trusts anyone else. He says he has agreed with M. Bernhard that the matter at Pszczew is to be brought to a conclusion, that the estates are to remain in the Prince's name, and that Leixner wants to take over Kamionna, either in the Prince's name or in Triebenfeld's. He says Leixner is under pressure and is content if Triebenfeld lends him his name. He has sent an express courier after Glenck; he is travelling to Berlin, expects to be back on Saturday and will then conclude matters at Pszczew.
oe1bu9454-131: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from Berlin that he has found nothing there but fraud and lies: without his coming the Prince would have been taken in, and not a heller is to be expected from there. He means to return to Frankfurt an der Oder on the 20th, to conclude matters with Leixner over Kamionna and to secure the funds needed for Koszęcin, the Prince''s estate in Upper Silesia. He says hopes are held out rather for the estates, since the King does not wish to give away any money. In the Broniewski matter the arrest is to be accepted as soon as the grounds for it (causae arresti) have been shown.'
oe1bu9454-132: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, writes to a friend that he is travelling back to Wrocław having achieved nothing, since he waited in vain for Glenck. He complains that in the case of Pszczew others made 30,000 Reichsthaler at the Prince's expense. The friend is to persuade Director Stubenrauch to buy Kamionna, so that Stubenrauch hands over the money by Midsummer. Triebenfeld says he will stand surety for an annual revenue of 10,000 Reichsthaler. The Prince would be satisfied with 180,000 Reichsthaler. Without an entry payment the subjects paid 50 Reichsthaler per Hufe yearly. He urges caution with the Cabinet Councillor.
oe1bu9454-133: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports on the failure of the various transactions: Glenck can prove nothing; Leixner, put off by fraud at Pszczew, is to keep up the payments, and demands for Kamionna a warranty against eviction and the right of residence (incolat) as well as the cancellation of the partnership contract with Glenck. The loan of 100,000 Reichsthaler from the Invalids'' Fund is uncertain. Triebenfeld intends to try, with Amelang''s help, to conclude something in Berlin with Stubenrauch. He says Beyme has presented the Prince''s request for compensation and advised that debts of over 200,000 Reichsthaler be remitted to him. He says that in the event of war the Prince will receive the command.'
oe1bu9454-134: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the loan from the Invalids' Fund promised by Building Councillor Glenck has fallen through, because the Otto valuation was reduced to 78,000 Reichsthaler; Stubenrauch and the Wards' Board also refuse. Beyme had Amelang told that the King wishes to remit the Prince's debts as compensation for the Brzyce estates. Amelang proposed Schlabrendorff's confiscated Kolzig estates. Triebenfeld intends to try whether 120,000 Reichsthaler can be borrowed on Konotop and Zagórów; if this succeeded, the Zagórów and Trąbczyn estates could be broken up at leisure.
oe1bu9454-135: In copies concerning the sale of Kamionna and Kolno, Cabinet Councillor Werner asks the Chamber Director to pay him a commission of 2 per cent under a written undertaking of Prince Hohenlohe-Ingelfingen of 17 December 1803, since he says he proposed a buyer. He fears objections from Glenck. Glenck enquires whether the addressee would lend 60,000 Reichsthaler as a second mortgage behind 100,000 Reichsthaler on a value of 200,000 Reichsthaler. Stubenrauch returns the papers and declines, saying the estates have fallen into bad repute through brokers.
oe1bu9454-136: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, without a power of attorney, waits in vain for Glenck; he says the buyers of Kolno and Kamionna are to pay 76,000 Reichsthaler. He has largely finished with Radzinski at Szetlewek, and two interested parties are offering 1 Reichsthaler ground rent per Morgen for Szetlewek. A decree of payment has been issued against the tenants around Floricke. He wants to lease Trąbczyn to Otocki for a year and to settle the Mennonites on about 400 Hufen. Voss, he says, intends to forbid the division of estates into settlers' holdings from 1 July. According to Blomberg, Glenck is keeping settlers away at Wrąbczyn.
oe1bu9454-137: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains about Leixner and Meyer Bernhard, who keep putting him off. He says they now promise to send 76,000 Reichsthaler and about 20,000 Reichsthaler in bank bonds to Bernhardi, but are holding back 30,000 Reichsthaler because the Prince has bought Pszczew back. For Trąbczyn he raised a few thousand Reichsthaler on a bill of exchange. Through the Grand Chancellor and General von Köckritz he obtained an order for the deposit of the Broniewski money. Köckritz holds out the prospect of estates on hereditary lease. Princess Sacken, through Cosmar, has called in the capital of 30,000 Reichsthaler on Koszęcin.
oe1bu9454-138: Amelang reports to Prince Hohenlohe-Ingelfingen that the deposit of the Broniewski money has now been ordered; a first attempt had failed, as the resolution of 25 June shows. Having been told by the Prince's agent, Triebenfeld, that the Prince would also deposit a security in order to obtain possession of the estates, Amelang offered a security of 10,000 Reichsthaler. The Government at Poznań was thereupon instructed to make the deposit and to issue an order concerning Kolno and Kamionna. He expects that the order will be agreeable to the Prince.
oe1bu9454-139: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the settlement with Broniewski can no longer be undone. Glenck submitted it for approval on the 6th, and the Prince's protest arrived on the 8th but was set aside. No one will take the blame, each shifting it onto the other, though Melzer admits that a deposit would have defeated Broniewski. He says that against Bornstädt, as against the Trąbczyn tenants, they sued for eviction without fixing a liquidated sum. Triebenfeld intends to go to Pszczew. Melzer expects a liquidation suit lasting 6 to 8 years.
oe1bu9454-140: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks for help by express courier: the village communities at Pszczew, stirred up by Rochlitz, want to withdraw from the purchase of the lordship. What is demanded is the cancellation of the contract between Leixner and v. Brandenstein, Glenck''s surrender of the partnership contract, and an arrangement with Bornstädt. The Prince is to demand the papers from Glenck and send Brandenstein''s written undertaking. Triebenfeld asks what he should reply to Bornstädt about the promised 1,000 Friedrich d''or. He says Glenck has advised Meyer Bernhard against paying the 66,000 Reichsthaler on the 29th in Poznań.'
oe1bu9454-141: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, bedridden with bilious fever in Poznań, reports on the Broniewski affair. He says the settlement that was concluded offers no security and should be altered; Broniewski''s wife would be needed for that. He considers Wunster a rogue who is in league with Broniewski and Guderian. He says Meyer Bernhard and Simon want to pay only 6,000 Reichsthaler instead of 13,000 Reichsthaler. The plan: Broniewski provides security and Glenck presses for the 66,000 Reichsthaler to be deposited; Broniewski receives 53,000 Reichsthaler and the Prince 13,000 Reichsthaler. He intends to fetch 30,000 Reichsthaler from Pszczew.'
oe1bu9454-142: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is ill and confined to bed. Bornstädt wants to leave, but the dispute with him should be settled first. Triebenfeld asks the Prince to instruct Glenck to send the contracts, settlements and accounts concluded with Bornstädt. The Prince should also declare in writing that he is willing to give Bornstädt 5,000 Reichsthaler as a special favour. According to an expert opinion, Bornstädt would be entitled to 7,500 Reichsthaler in the purchase transaction of Pszczew, without the promised fee.
oe1bu9454-143: Amelang writes from Berlin to Prince Hohenlohe-Ingelfingen, confirming that the Prince has informed him of the outcome of the Prince's compensation matter. The Prince declares himself satisfied with the conclusion of this business. Amelang wishes that the King's continuing favour towards the Prince may be boundless.
oe1bu9454-144: Amelang confirms to Prince Hohenlohe-Ingelfingen that on 3 November 1804 he received the Prince's order of 31 October. He says he intends to call on Count von Schulenburg the next morning, to hand him the letter addressed to him and to await his further explanation. He says he will report on the outcome of this conversation by the next post.
oe1bu9454-145: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, writes from Kalisz, where he has arrived after breaking his carriage. Honrichs is not paying the 4,000 Reichsthaler, although everything has been cancelled and settled with the consent of the Wards'' Board. Court Councillor Grimm, who is seriously ill, wants to sue Honrichs, but the contract and the power of attorney are missing; the contract is with Rochlitz. Triebenfeld asks that it be called in from there urgently and sent to Grimm with a power of attorney. At Trąbczyn, he hears, orders are being given that contradict his plan: 100 bushels of grain have been lent out and many fields sown. Once the carriage is repaired he means to hurry there.'
oe1bu9454-146: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the Mennonites want to buy the Zagórów and Trąbczyn estates as a whole; he intends to travel to Lunau tomorrow. He says the valuation is held up by Glenck's contract of 5 September covering 300 Morgen of manorial land and by his sale of the komornik holdings in Wrąbczyn to v. Malachowski; the village community is protesting. He asks for Glenck's bonds as well as the contracts of the miller's wife from Wrąbczyn and of the Swięcie Hollander. He says he has lodged an objection against an execution for 6,500 Reichsthaler on account of Przespolewski.
oe1bu9454-147: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports, after a journey through West and East Prussia, that the Mennonites want to conclude on 19 December in Wrocław, but are demanding the propination rights. He has summoned men from Landsberg and the Oderbruch in order to compare their offers. He rejects a sale in separate pieces. The valuation by Schenck is proceeding slowly. He complains of Glenck's reproaches and of his orders issued against his own. The justice-burgomaster asks for instructions on the Wrąbczyn lands. The bailiff's estate is likely to be valued at about 11,000 Reichsthaler.
oe1bu9454-148: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, calculates that the Swięcia estate has been sold off far too cheaply. Glenck's table showed 1,800 Reichsthaler in yearly interest and 10,000 Reichsthaler of capital, whereas the valuers' revision, completed today, yields only 918 Reichsthaler in interest. He says the estate, with 3,792 Morgen, was given away for 28,360 Reichsthaler, which means a loss of 47,340 Reichsthaler. Together with the Oleśnica loss of 48,000 Reichsthaler, the Prince loses a net 95,340 Reichsthaler on both estates. He says a shortfall of the same size is now arising in the valuation.
oe1bu9454-149: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he is expecting the people from the Oder and Netze marshes and has sold waste land on the border on favourable terms; no Hufe, he says, is to be given up for less than 600 Reichsthaler. He hopes the valuation of the Zagórów estates will come to more than 400,000 Reichsthaler, and intends to raise money in Berlin for Schlabrendorff and Lichnowski. The Wrąbczyn subjects, he reports, are refusing the rent, complaining of Glenck's threats and of forced services for citizens of Zagórów, and offering one Reichsthaler per Morgen; he referred them to justice-burgomaster Schenck.
oe1bu9454-150: In a letter of 23 November 1804, the Senior Land Councillor von Lichnowski demands from Prince Hohenlohe-Ingelfingen arrears of interest of 5,572 Reichsthaler 12 Groschen for one and a half years (4 May 1803 to 4 November). An order of the Kalisz Government set a payment deadline of 14 days, which has passed without payment. He threatens to apply for sequestration, but hopes for good relations. The reply of 27 November is that the tenants have not paid and that Lichnowski will be satisfied, since the Prince's agent, Triebenfeld, is putting everything in order.
oe1bu9454-151: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the Mennonites are at Trąbczyn and want to buy both estates together, but deep snow is preventing all work. The valuation must be reworked: Swięcia yields only 918 Reichsthaler instead of 1,800, Wrąbczyn only 1,123 Reichsthaler instead of 1,500. A hundred Hufen of woodland near Grądzyń and Drzewce are expected to bring 3,000 Reichsthaler in rent, so 60,000 Reichsthaler in capital. Lichnowski has had part of the 10,000 Reichsthaler that the Oleśnica people are to pay at Christmas seized. According to Nerlich, the people of Wrąbczyn are refusing the Christmas instalment.'
oe1bu9454-152: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, announces that the Prince will receive the free pass for the Hohenlohe wines and hopes to transfer the 25,000 Reichsthaler soon. He says the debts registered by Glenck burden not only Swięcia and Oleśnica but all the villages of the Zagórów estates, which makes the matter more difficult. Nothardt has died and Goldbeck is president in Kalisz; should obstacles arise with the division of the estates into settlers' holdings, Triebenfeld hopes to remove them in Berlin. Bernhardi left him in the lurch over the money. He says Voss will certainly withdraw soon. Nothard leaves 28,000 Reichsthaler of debts.
oe1bu9454-153: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is worried about raising the 25,000 Reichsthaler, since the bank president von Stein has again forbidden any discounting. He says the capital of 140,000 Reichsthaler is to be provided by the Invalids' Fund or the Potsdam orphanage, but only once all the formalities have been settled, and not in instalments. Together with Amelang he is trying to raise the 25,000 Reichsthaler for the time being. He reports a shortage of money and looming bankruptcies in South Prussia. The letter breaks off.
oe1bu9454-154: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the loan is going well and is with a man for examination. Against Wollenhaupt's talk of a sequestration he says that Lichnowski has lifted the attachment for six weeks, and that according to Grimm the attachment on account of Magnuski has likewise been lifted. He says Przespolewski has no claim to 30,000 Reichsthaler, and that Dębinska has only laid an attachment against payments to Magnuski. He says Blomberg threatens, in a letter of 25 December, that without the fulfilment of his demands nothing will come of the division of the estates into settlers' holdings. Triebenfeld has sharply rebuked him.
oe1bu9454-155: Hahn reports to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, on the Prince's orders that Chancellor Hohmuth will not promise any longer delay over the payment to Countess Schlabrendorff. Hohmuth says the Countess, annoyed by the delay, can be kept from reviving her suit only by quick payment before the next Berlin post day. If 25,000 Reichsthaler were paid soon, Hohmuth would try to persuade her to wait a while for the other half; he refuses a bond for it. The wild boar has been sent off by way of Kalisz to Trąbczyn.
oe1bu9454-156: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that he cannot obtain the 25,000 Reichsthaler without the large transaction. He says the money has twice been thwarted, probably by young Eysenhardt, who is demanding 18,000 Reichsthaler. He declined, for the time being, an offer from Court Councillor Meyer, since 9,000 Reichsthaler are entered against Szetlewek. In an enclosed copy, Countess Schlabrendorff threatens to continue the suit in Berlin if the outstanding settlement money for her children is not paid by the next post day.
oe1bu9454-157: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that through the mediation of General von Köckritz a loan from the Invalids' Fund has been promised to him. Once it is granted he intends to take 60,000 Reichsthaler, repay the ten thousand he borrowed, and send the Prince 50,000 Reichsthaler so that Schlabrendorff can be paid. He says Pochammer will not file a complaint if Schlabrendorff receives money in this quarter. He intends to pay Giraud and Haugt their interest and have their mortgage assigned to someone who will provide 18,000 Reichsthaler for four years.
oe1bu9454-158: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that through the mediation of General von Köckritz the Invalids'' Department has promised 150,000 Reichsthaler: first 50,000 Reichsthaler on mortgage and on Triebenfeld''s bill of exchange, the other 100,000 Reichsthaler after revision of the valuations by the Chamber, which he intends to direct from Wednesday in Kalisz. He then wants to pay 10,000 Reichsthaler and send the remainder. He advises against the suit over the proxenetica (brokerage fees) and rejects the reproach in the Schlabrendorff affair. Of 30,000 Reichsthaler for the Empire, about half might be together.'
oe1bu9454-159: Amelang has, with great difficulty, obtained from the banker Leve an order on the brothers Kuh for 36,755 Reichsthaler 7 Groschen, in connection with the money of the Invalids' Fund, which actually consists of Maritime Trading Company bonds. Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends the order to the Prince and asks that the letter to the Messrs Kuh be delivered at once. Tomorrow the Hanusch and the Eysenhardt matters are to be settled. After that he intends to return to Kalisz to see to the 100,000 Reichsthaler.
oe1bu9454-160: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the Invalids' Fund is releasing the Maritime Trading Company bonds and that he can now satisfy Livi. He says further money will follow once the Chamber has reviewed the valuations. Girard received 900 Reichsthaler in interest, and the capital is to remain uncalled for some years. In the case of Seebald, 1,800 Reichsthaler of brokerage fee was saved. The people of Oleśnica, who are protesting against the division of the woods, he intends to throw out. The subsequent purchasers have paid 10,000 Reichsthaler and want to pay a further 10,000 Reichsthaler. He plans to leave on the 5th by way of Konotop and Głogów.
oe1bu9454-161: Amelang reports to Prince Hohenlohe-Ingelfingen that the Prince's letter of the 3rd arrived just as the Prince's agent, Triebenfeld, was about to depart. Amelang was still able to show it to him, and Triebenfeld was glad of the Prince's satisfaction. He says payment of the assignation has been made. Everything now depends on the revision and on its being speeded up. Three or four months ago the business would have been settled more quickly. Amelang assures the Prince of his zeal.
oe1bu9454-162: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that a new order from the General Finance Department forbids the chambers to carry out revisions of court valuations without its prior knowledge. He traces it back to Prince George and Councillor of War Korn. He hopes for the permission that President von Goldbeck has applied for and that Amelang is to pursue in Berlin. He intends to submit the plans for dividing the estates into settlers' holdings. The Prince is asked to buy and send three busts and a washbasin for Goldbeck. The Oleśnica matter has gone back to the patrimonial court through Hussarzewski.
oe1bu9454-163: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports on the hearing at Trąbczyn against the people of Oleśnica, who, despite earlier protests against the 10,000 Reichsthaler, are now giving way. He says Otocki wants to take Szetlewek on hereditary lease for 10,000 Reichsthaler in deposit money and 1,500 Reichsthaler canon, together with the propination rights of both estates and 20 to 30 Hufen on the same terms as the colonists. Honrichs is not paying; if his contract were cancelled, Meierowitz would buy. Grimm offers 2,000 Reichsthaler for Witów. Szczucki and Czizewski are to be sued. Old Lichnowski asks for 1,390 Reichsthaler.
oe1bu9454-164: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is waiting for the Berlin resolution and puts the new difficulties over the revision of the valuations down to Prince George and Kalckreuth. He says Otocki promises 10,000 Reichsthaler and 2,000 Reichsthaler of propination rights rent in advance, and that Meierowitz would pay 20,000 Reichsthaler and an annual canon of 500 Reichsthaler once Honrichs leaves. A chamber edict forbade hereditary leases to non-nobles without royal consent; he says Glenck kept this quiet and let the contract with the people of Oleśnica be concluded. According to Dombrowski, the Prusimski compromise and receipts for Prusimski's payment are in the archive.
oe1bu9454-165: 'Hahn sends Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, on the Prince''s orders and as a supplement to the Prince''s letter already dispatched, a copied extract from what came in by mounted post from Glenck. The Prince thinks it useful. The Prince is better: the attack has moved from his right hand into his left foot, and the pain stopped during the night. Mining Councillor Bernhardi has arrived, but is not entirely well. The Prince had Hahn reassure him. Hahn wishes Triebenfeld a recovery.'
oe1bu9454-166: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Minister von Voss had the division of the Trąbczyn estate into settlers' holdings stopped, but that the Chamber's commission has confirmed Triebenfeld's evidence and withdrawn the prohibition, and that the net annual income was fixed at 31,000 Reichsthaler. Once the concession is granted he hopes for credit of 300,000 to 400,000 Reichsthaler, and he intends to use the outstanding 180,850 Reichsthaler to pay off debts. The buyers, however, have pulled out. Because of his own losses of 19,500 Reichsthaler he must go to Świniary and Konotop. Schenck is to collect the money in the meantime.
oe1bu9454-167: Writing from Öhringen, Hahn tells Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, that on the orders of the Prince, who is just then driving to church with the old Prince, he is sending an enclosed letter together with the Prince's compliments. The Prince would gladly have written himself, but the courier leaves within the hour. Hahn reports that the old Prince is very well for his age and shows much attachment to Hahn's master, and that the return to Wrocław has been fixed, without fail, for the 25th.
oe1bu9454-168: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he has concluded contracts with the old peasants and secured the dues before the court. He is negotiating with v. Otocki over Szetlewek and the propination rights. Amelang promises help with the loan. Glenck, Wollenhaupt, the three men of Oleśnica and a Meyer are talking buyers out of purchasing. Claims of 3,011 Reichsthaler are being made; against Wollenhaupt he raises counterclaims. The old subjects in Swięcia have been bought out, and for 28 Hufen a new contract was concluded: 400 Reichsthaler per Hufe and 15 Reichsthaler annual interest.'
oe1bu9454-169: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Minister von Voss has forbidden any revision of the valuations, and he is waiting for Amelang's answer about the revision by the district councillor. For the division of the estates into settlers' holdings a councillor is to inspect Zagórów and Trąbczyn. He says he has concluded the business with Meierowitz. Radzinski is offering 48,000 Reichsthaler in all for Szetlewek (1,700 Morgen), with only the pasture in dispute. Triebenfeld hopes for 80,000 Reichsthaler by July. Amelang is making a noise because Oppenheimer refuses priority for the Glenck mortgage on Oleśnica that was assigned to him.
oe1bu9454-170: Hahn reports to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, that on the Prince's orders he rode to Triebenfeld's hereditary estate Świniary to speak with the district administrator Käufer and the forester Bezold. The forester asked who had blackened his name with the Prince and assured him that he was devoting all his energies to the interests of the estate. Hahn met the district administrator in Wrocław. He replied in the same terms, pointed to his excellent testimonials and his good name, and awaits an investigation of his conduct calmly.
oe1bu9454-171: Hahn reports to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, from Erfurt that the Prince's foot is almost healed and that he is otherwise well. The foot is only slightly swollen and causes no pain. The Order of St Andrew gave pleasure, Hahn says, and still more the courteous behaviour of the Emperor, by whom the Prince is said to be charmed. In Wrocław too the Emperor is said to have spoken flatteringly of the Prince. The Hohenlohe regiment marched through Erfurt, and the Prince rode out to meet it. The Duke of Weimar is expected.
oe1bu9454-172: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is pursuing the division of the Trąbczyn estate into settlers'' holdings. He has postponed the main hearing to Monday and intends then to conclude the contracts for all the parcels. He quotes a letter from President von Goldbeck to Minister von Voss: the Chamber, he says, has already given its consent, Councillor of War zur Höllen has made mistakes, and these are to be corrected as far as possible if Voss grants the consent. Kunkel, one of the men from Oleśnica, has been taken into custody. Over Szetlewek Triebenfeld expects a hard day.'
oe1bu9454-173: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks the Prince to instruct Glenck to obtain the preliminary agreement between Rochlitz and Honrichs concerning Witów, together with Rochlitz's power of attorney. Nothing was found in the Trąbczyn archive, and otherwise, he says, 14,000 Reichsthaler would be lost. With a councillor of the chamber he intends to inspect the site at Trąbczyn according to the plans for dividing the estate into settlers' holdings; in all he hopes for 350,000 Reichsthaler. He means to settle Szetlewek this week. He asks for names for 8 new villages. He says the Prince should object to the enclosed contract with Schenck on account of 5 Hufen of land and the clerk of the court.
oe1bu9454-174: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, calculates that a justiciary who also takes on the post of cashier would, through savings, bring in as much as Schenck receives; the fees, he says, would rise to at least 1,200 Reichsthaler. He asks that Hahn be sent to Świniary to issue a warning to the district administrator Käufer and the forester Peltzold. At Trąbczyn, buyers are waiting for several Hufen of land to be paid for in cash. He mentions the 1,390 Reichsthaler for Lichnowski and returns Amelang's letter. Wiesolowski reports Russian troops, together more than 300,000 men.
oe1bu9454-175: Hahn forwards to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, two papers, an original and a copy. The Prince asks Triebenfeld for his opinion on what should be done in these matters. Girard in particular is pressing. The Prince says he would send the necessary sum at once to satisfy the gentlemen, were his means not so exhausted by the journey.
oe1bu9454-176: Hahn reports to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, the death of the reigning Prince of Hohenlohe-Neuenstein on 27 July from a stroke. Under the will, Hahn's Prince is sole heir, and possession was taken at once in Öhringen and the other places. Measures by the Princes of Langenburg and Kirchberg, based on a partition treaty, were repelled and their troops turned back. The Prince intends to travel there in September after the Silesian reviews. He leaves the South Prussian affairs to Triebenfeld's judgement, since he will be away for a long time.
oe1bu9454-177: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that, because of the mobilisation, little can be achieved in Berlin. Privy Councillor Reinbeck is pursuing the approval of the division of the Zagórów and Trąbczyn estates into settlers' holdings; on this depend the money hoped for from the Invalids' Fund and the Wards' Board. Enclosed is a list of the new colonies (21,407 Morgen, 578 farmers; 4,575 Morgen remain to the manorial lordship (Dominium)). Radzinski is to pay in 6,000 Reichsthaler. Scattered colonists promised several thousand Reichsthaler. Still to be paid are Prusimska 20,000, Weigel 23,000 and Schlabrendorff 25,000 Reichsthaler.
oe1bu9454-178: 'Hahn tells Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, that among his papers he has found a few more signed blank sheets (chartes blanches) of the Prince that were intended for Triebenfeld. He excuses the oversight: in the last nights before the departure the Chamber Director Graf had arrived, and everything concerning Hohenlohe had to be settled before the journey. He has sent the remaining chartes blanches to Miss von Triebenfeld. He adds that the Prince appointed him Councillor of Dispatches before the departure.'
oe1bu9454-179: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the division of the estates into settlers' holdings and the Pszczew affair have been approved by the King and that the yield of the estates has been fixed at 40,260 Reichsthaler. The debts amount to 698,000 Reichsthaler. Together with General von Köckritz he intends to ask the King for treasury notes to pay them off, the matter being pursued by Court Fiscal Pochammer, for whom he urgently requests a power of attorney. He says Glenck knows nothing of the Prusimska affair; he promised him 8,000 Reichsthaler sub spe rati (in hope of ratification) for the repurchase of his lands. For the 30,000 Reichsthaler he still sees no way.
oe1bu9454-179a: A plan to clear the debts on the Zagórów and Trąbczyn estates rests on a chamber survey showing a net annual yield of 40,260 Reichsthaler, including 3,000 from Honrichs for the demesne farm of Trąbczyn and 1,500 from Radzinski on Szetlewek. Prince Hohenlohe-Ingelfingen's liabilities come to 698,784 Reichsthaler, including 42,000 owed to Lichnowski on Trąbczyn and a protest by Prusimska of 8,333 Reichsthaler. The plan includes a draft petition by the Prince's agent, Triebenfeld, to the King for 698,000 Reichsthaler in treasury notes with an amortisation fund of 34,000 Reichsthaler a year, pointing to 16 new villages and 500 families.
oe1bu9454-180: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, replies that the claim of the Jew Nathan Liepmann is already listed in the schedule of liabilities; all creditors are to be satisfied. He says he cannot count on the money from the division of the estates into settlers' holdings, about 60,000 Reichsthaler, coming in quickly and must go on borrowing. Once the Pszczew matter is concluded, the people there are to pay 2,000 Reichsthaler and Raven 1,200 Reichsthaler in transfer fees (Laudemium); should Raven refuse, the communities are to reclaim the estate. Pochammer is to speak with Beyme on the 11th about the loan; the valuations are going back to Kalisz.
oe1bu9454-182: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks urgently for the forgotten power of attorney for Court Fiscal Pochammer, for blank forms and for blank powers of attorney attested by a court. Without them, he says, he has been unable to do anything for weeks. He has written to Beyme and Minister von Voss in the Prince's name and recommended Pochammer. He intends to call on Faudel, Haugwitz and Count von Keller. He complains about the lazy Amelang and about Grattenauer, who wants titles and testimonials and who, from what Triebenfeld hears, wants to become a councillor of justice, and he proposes a refusal.
oe1bu9454-183: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports on a lampoon entitled "Prussian Characters" that attacks the Prince sharply and also names Triebenfeld. It says, he reports, that the Prince needs a great deal of money and that Triebenfeld enriches himself from the Prince's property, a scheming man who has worked his way up from being a servant. He says he wanted to send the book along, but the French authority had it confiscated. Colonel Massenbach and a local professor are held to be the authors. Köckritz is attacked in it as well.
oe1bu9454-184: 'Hahn sends Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, the enclosed blank forms, which had been forgotten when the express courier left, and asks to be excused. He complains of sad experiences in service to a lord: he says the old Ingelfingen servants are forgotten in favour of the newer ones, who are made fortunate without having earned it. He says he means to extricate himself by his own efforts, and trusts that Triebenfeld will make no use of this outburst.'
oe1bu9454-185: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he is waiting urgently for the requested powers of attorney and blank forms, without which he can do nothing. He fears the delay is rousing mistrust among those he is negotiating with. He asks again for a power of attorney for Court Fiscal Pochammer, two judicially attested blank powers of attorney and a few blank forms. Help is promised in Berlin against Württemberg's encroachments on the Prince's states, but he doubts the sincerity of this. He may perhaps come to Öhringen.
oe1bu9454-186: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, writes to a friend that the business with Weigelt is as good as settled: Weigelt has sent his agreement, and Triebenfeld has asked him to come to him at Świniary tomorrow. In order to entertain the old gentleman well, which serves the Prince''s interest, he asks his friend for a bottle of good old sweet Hungarian Ausbruch, 6 peaches and 2 bunches of grapes. The wine and fruit should be sent out if need be.'
oe1bu9454-187: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the powers of attorney and blank forms have arrived. The Grand Chancellor is to provide 90,000 Reichsthaler from the justice fund, with which Weigel, Schlabrendorff and Lichnowski are to be paid, and the Prince is to receive the 30,000 Reichsthaler he wants. The mortgage certificate of the Zagórów and Trąbczyn estates is so encumbered that no one will lend further. Triebenfeld wants to be rid of Oppenheimer in order to recover the mortgage of 250,000 Reichsthaler. He intends to go to Pszczew because of Meyer Bernhard's suit, then to Kalisz and Trąbczyn to collect money.
oe1bu9454-188: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the Grand Chancellor is giving some 176,000 Reichsthaler from the justice fund, with which the troublesome creditors, especially Weigel, are to be paid; he wants to redeem the mortgage of 200,000 Reichsthaler pledged with Oppenheimer. At Pszczew he says he has settled everything and Echaust is satisfied. He is travelling to Kalisz and Trąbczyn to collect money so as to pay the Prince a sum at Fürth; some 102,000 Reichsthaler are outstanding there (tenants, entry monies, interest, Wrąbczyn, Swięcia, Oleśnica). Schenck is to recover it. He complains about Grattenauer, who he says does nothing and serves the minister.
oe1bu9454-189: Hahn reports to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, that after the death of the mining councillor Bernhardi he received orders to travel to Upper Silesia and to settle the affairs of the lordship of Koszęcin with Inspector Krenig and Master of Forests Reichmann. From what he hears, he says, not everything there is in order. He asks permission to visit Triebenfeld at Trąbczyn before returning to the Empire by way of Wrocław. He has also applied to the Prince for this. He asks for a few lines to be sent to Koszęcin.
oe1bu9454-190: On the instructions of Prince Hohenlohe-Ingelfingen, Hahn sends Peter Friedrich von Triebenfeld, the Prince's agent, a charta blanche and an extract from Glenck's letter of 22 March 1806. The Prince wants to rescue Glenck once more and calls on Triebenfeld to act in the same way and to send him the draft of the consent. If Glenck again rejects the conditions, he is to be left to his ruin. Glenck complains of hardship because of the Wrąbczyn estates, says he has saved Wilhelmsruh from forced sale, and wants to use the consent to get Ribbeck out of the purchase of Wrąbczyn.
oe1bu9454-191: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that an execution decree from Poznań demanded some 22,000 Reichsthaler for Prusimska; at Kalisz he says he gained time with documents from Rapacki. Peasants had left the plots assigned to them, sown the old ones and driven off German settlers; he had the ringleaders beaten with the whip and the plots marked out. The leases of Honrichs, v. Zglinski and the tenant of Kopojno were cancelled or shortened to one year; demesne farms are to be broken up at 600 Reichsthaler per Hufe. He says Glenck is talking buyers out of it with a libel.
oe1bu9454-192: Writing from his sickbed, Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says 360,000 Reichsthaler have been promised in Berlin. He says he has calmed the peasants, who had been stirred up, and driven off the tenants. He says Glenck, together with the people of Oleśnica, is inciting the inhabitants, turning buyers away and circulating a lampoon among colonists willing to buy. The Prince has already received 10,000 Reichsthaler from Swięcia, 10,000 Reichsthaler from Oleśnica and 12,000 Reichsthaler from Szetlewek. The judgment on the hereditary lease at Oleśnica forbids eviction; Triebenfeld now intends to apply for consent.
oe1bu9454-193: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says the Prince's letter arrived only after ten days, so the travel plan falls through. He advises against a journey to Parchwitz. He wants to come to Sławięcice still in April, before Berlin, to learn the Prince's wishes. Of the estates in Poland, he says Dąbska is paying all the costs. Prefect Garczynski is having Honrichs arrested, who owes more than 10,000 Reichsthaler. Triebenfeld says he got 600 Reichsthaler back from him. The arrears are to be paid quickly and the estates returned free of encumbrance.
oe1bu9454-194: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that before the justice of the peace the claim to recover the Trąbczyn estates turned out very favourably, and the matter has been referred to the tribunal in Kalisz. The King of Saxony is said to be granting an indult for ten years. The Invalids' Fund is demanding the whole capital from Triebenfeld and has brought suit, with a hearing on the 26th. He has asked the prefecture to suspend Honrichs and to use the 11,700 Reichsthaler for the arrears of interest. He says sub-prefect Brzechffa gave security for Honrichs and issued false certificates.
oe1bu9454-195: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is waiting in Wrocław for Count Strachwitz, who is said to be arriving on the 23rd. The matter concerns a transaction over estates near Głubczyce, whose value is given as 900,000 Reichsthaler. Flesch rebukes Goldstücker for having named the Count, and urges discretion. Triebenfeld suspects a swindle. He reports rumours: the King is said to be paying the contribution quickly, otherwise the French would move in; Napoleon is said to be demanding 20,000 men against the Turks; Hardenberg is said to be returning. The moratorium has been extended by two years.'
oe1bu9454-196: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, has fled Wrocław: Lahr, to whom he owes 1,500 Reichsthaler, had an arrest warrant obtained secretly through his agent Ludwig, despite a promised extension until Michaelmas. He must sell his mill for half its price. He suspects Flesch and his associates and regards Flesch''s exchange dealings as a swindle, but says he still wants to pursue the claim for recovery of the Trąbczyn estates. The Dutch loan has failed. The Prince should write to the Liquidation Commission in Berlin, citing Berger''s testimony.'
oe1bu9454-197: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that, according to Richter, General Köckritz told van der Lahr firmly to be quiet; he says Lahr is now willing to wait. Köckritz is also to obtain patience over the interest owed to the Invalids' Fund. Triebenfeld means to start the business in Kalisz, then return to Wrocław, and is pressing Goldstucker and Flesch to agree to the exchange. Senior Steward Hegener is to review everything in Zagórów. He says he would pursue the Trąbczyn matter vigorously. According to Tesmar, Lahr knows nothing of it; Triebenfeld suspects a piece of knavery by Flesch and his associates.
oe1bu9454-198: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Trąbczyn is to come back by Michaelmas at the latest; the sequestration has been lifted. The accounts of Honrichs and Frankiewicz, for which Brzechffa stands surety, are being examined by the calculator Schneider. Hecker and Hawich are to prove the 11,700 Reichsthaler said to have been embezzled. Hecker may become administrator. The tenant Smidkowski is willing to pay several thousand at once in order to stay on the estates. Dąbska has been refused by the King in Warsaw with her petition concerning Trąbczyn. Köckritz says he will send the papers in the Colonna case. Hardenberg is to put the debt affairs in order.
oe1bu9454-199: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, encloses a letter from T. about the King and Köckritz. He says he is not going to Berlin, but wants to send wine and game birds to T. so that a number of matters may be discussed at the farewell dinner. T. is to bring Hardenberg along to it. He doubts that Hardenberg will come with the King, as a note from H v M claims. He says he means to go quickly to Zagórów, where he hopes to sell his mill in Świniary for 6,000 Reichsthaler and to collect arrears from his subjects.
oe1bu9454-200: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, regrets that the birds the Prince sent arrive only after General von Köckritz has left on his journey. Seegebarth, he advises, should be put off with the prospect of money the Prince hopes to draw from his Polish estates. Triebenfeld intends to travel to Zagórów as soon as he finds a way to pay for the journey. He doubts that Weigel will accept Stössel as a debtor, and proposes to Weigel that he himself acquire the estates the Prince is to take over in Silesia, give the Prince a receipt in full and satisfy Stössel. He has asked whether the Prince may show himself to the King at Koźle or elsewhere.
oe1bu9454-201: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Weigel, one of the Prince's largest creditors, is firmly resolved to take over the estates to be obtained in exchange for the Zagórów lordship (the Knobelsdorff or Poninski ones) and to offset his own and Stössel's claims against them. Weigel is to spend the 30th with Triebenfeld at Świniary to confer on it. A buyer has offered 220,000 Reichsthaler in cash for Świniary, Triebenfeld's own estate, for which he asks 250,000; since only 90,000 is entered in the mortgage book against it, 160,000 would remain to him. Once Weigel and Stössel are satisfied and the debts to Grotowski, Lichnowski, Zerboni and others are charged to Trąbczyn, he believes the Prince's remaining debts can be cleared with 150,000 Reichsthaler. He urges the Prince to see that the plan with Prince August succeeds.
oe1bu9454-202: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, tells a friend that old Weigel, one of the Prince''s largest creditors, has visited him at Świniary, left well satisfied and put the whole affair in his hands. Weigel is willing to take over the estates the Prince is acquiring; Triebenfeld is to work everything out for him in detail, so that Weigel can explain it to his son. Weigel praised Triebenfeld''s lack of self-interest at length and wants to visit him more often. Postscript: Triebenfeld hopes to sell his two free holdings soon.'
oe1bu9454-203: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends the Prince the statement he gave Weigel, one of the Prince's largest creditors, on a planned exchange of the estates of a von Knobelsdorff for the Prince's Polish estates. According to Fischbach, the Knobelsdorff estates are left with a net 310,000 Reichsthaler, and the Zagórów estates (worth about 540,000 Reichsthaler, with debts of 247,000) with 293,000. Fischbach is willing to arrange the exchange for 1 1/2 per cent. Knobelsdorff may perhaps also take over the Trąbczyn estates together with their debts and see the lawsuit over them through himself. Triebenfeld asks the Prince for orders on whether Fischbach and Knobelsdorff should both come to Sławięcice.
oe1bu9454-204: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains that the Prince's letter to Heyne, saying he was willing to cede Koszęcin, the Prince's Silesian estate, to Weigel or Stössel, has almost wrecked Triebenfeld's plan. Weigel, one of the Prince's largest creditors, now wants to let the matter rest and asks whether Stössel would credit what the Prince has paid in. Heyne is to put everything back on track. Triebenfeld asks the Prince for a frank answer and warns that if Koszęcin is handed back to Stössel, the Prince would lose everything he has put into it. He asks the Prince to show his letters to no one.
oe1bu9454-205: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, pursues the exchange of estates: Knobelsdorff wrote to Fischbach that he will be free from the 11th to travel to Zagórów, and Triebenfeld has asked him the date and meeting place. Weigel, one of the Prince''s largest creditors, would be content if Stössel took the Biskupice estates, provided Weigel is entered there; he would then give the Prince a receipt and have everything cancelled on Koszęcin. Labage has been sent to Paris to offer linen and iron toward the contributions still to be paid, and Triebenfeld expects iron prices to rise. He warns the Prince against false friends.'
oe1bu9454-206: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, warns the Prince of dangers, advises him to expect nothing from the government, and says he will go to Petersburg himself if need be. He says Knobelsdorff''s exchange of estates is certain. For the 35,000 Reichsthaler he is still waiting for Eberhard''s schedule. Scharnhorst spoke at length at Koźle on the Prince''s behalf; a sum of money said to be offered to the Prince should be refused. On the 2nd Triebenfeld intends to go to Poland to prepare for Knobelsdorff: Cabanis, the surveyor, is to prove on oath which lands belong to Zagórów, all contracts are to be produced, every hereditary tenant and colonist is to acknowledge what has been paid and what is in arrears, and matters are to be settled with Honrichs, one of the men who administered Zagórów locally.'
oe1bu9454-207: Hecker and Honrichs, two of the men who administered the Zagórów lordship locally, report from Kalisz on 30 September 1810 that the lawsuit over Trąbczyn has been set in motion before the tribunal there, with a hearing on 24 October; the delay came from the judges' eight-week vacation. The lawyer, Councillor of Justice Falz, promises a favourable outcome and has received 200 Reichsthaler in advance. The sequestration of the estates has ended. They recommend a settlement with the hereditary leaseholders of Oleśnica, who ask for 12 Hufen in hereditary lease. The Hollander settlers consider only 2 gulden per Morgen bearable instead of 3. Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, adds that arrears could be partly remitted and that Knobelsdorff would rather have land than interest.
oe1bu9454-208: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he still cannot travel to Poland for lack of money. In the Schlieben matter the rent money from his Świniary lease has been placed under seizure, and an execution for 48 Reichsthaler 6 Groschen in costs has been sent to him; he asks the Prince to instruct Lombardini to pay it. He also reports news: the King''s manoeuvres near Potsdam and Berlin, the confiscation of colonial goods on the Elbe, rumours of 60,000 French troops passing through Berlin, 30 arrests in Berlin, and that things are beginning to go badly for Field Marshal Kalckreuth.'
oe1bu9454-209: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, confirms that the order to pay has come in. He intends to collect the money and leave at once. From Zagórów he will report everything to the Prince immediately by mounted messenger, who is to bring von Knobelsdorff there.
oe1bu9454-210: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from Kalisz on lawsuits over the Prince's estates. He hopes to win back Trąbczyn by vindication, which would also save 22,000 Reichsthaler of dower money registered on it; the lawyer Falz, the president of the tribunal, Smagorzewski, and two assessors have received payments. He wants the people of Oleśnica, who owe 39,270 Reichsthaler, evicted, and Polish peasants from Oleśnica are willing to take over their contract. Niedźwiecki owes 6,000 Reichsthaler and the tenant of the propination rights 3,000. Hawich, who stirs up the rent peasants, must go. By New Year Triebenfeld hopes for 44,000 Reichsthaler, including 12,000 from the old Hollanders and 6,000 from Radzinski of Szetlewek. He asks the Prince to obtain leave from President Count Danckelmann for the referendary Sommer.
oe1bu9454-211: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that von Knobelsdorff has inspected the estates and likes them, so Triebenfeld is now putting everything in order so that the matter can be taken in at a glance. He complains of great confusion and of stubborn people, who are being heard by Hawich. He expects a good outcome in the lawsuit over Trąbczyn: the hearing has been under way since the 24th, and it may take another 14 days until the tribunal''s decree is read out. If he wins, he says, all the hardship will end.'
oe1bu9454-212: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, writes after a serious illness that no one on the Zagórów estates is paying and that 31 lawsuits are pending. He says the people of Oleśnica, Niedźwiecki of Kopojno and Hawich of Drzewce should be turned out and three demesne farms set up again. Napoleon's declaration that debts owed to Prussia may be paid off over 40 years is confusing the colonists, who will not accept the reduction of interest offered them. After a letter from Prince Poniatowski, the tribunal at Kalisz referred the Trąbczyn matter to the higher authority. The old Hollanders offer 40,000 Reichsthaler at once. His valuation of the Zagórów estates gives an annual yield of 22,140 Reichsthaler and a surplus of 7,140 for the Prince from Midsummer.
oe1bu9454-213: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the state taxes on the estates are paid apart from 900 Reichsthaler, and hopes soon to have the costly sequestration lifted. Because no one is paying, he is conducting 43 lawsuits, among them against Niedźwiecki (6,000 Reichsthaler), Nossalski (3,000), the people of Oleśnica (about 33,000), the Wrąbczyn peasants, and, in 29 cases, settlers who owe 39,000 Reichsthaler of unpaid interest. The lawsuits have cost 1,450 Reichsthaler, of which 750 is for the Trąbczyn suit and the Meierowitz one. State Chancellor Hardenberg demands proof of the new seizure of the sums given from Prussia to Poland.
oe1bu9454-214: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the minister has confirmed the settlement: the bank and invalids'' debts are to be paid off over 41 3/4 years at 6 per cent. For the private debts, and for Weigel, the minister holds out the prospect of a similar moratorium. The hereditary leaseholders are paying nothing; Triebenfeld expects their contracts to be annulled and wants to set up demesne farms. The lawsuits over Oleśnica and Wrąbczyn are pending, and matters stand the same with Swięcia. Hecker and Hawich are stirring up the people, and Hecker is said still to owe 2,500 Reichsthaler. On the 28th Triebenfeld intends to travel to Berlin.'
oe1bu9454-215: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, confirms 1,000 Reichsthaler delivered through Bally. He says Hawich and Hecker are to be dismissed. He has ordered the payment of the 5,100 Reichsthaler of interest and presses for the immediate lifting of the sequestration of Zagórów. Dąbska, Prusimski's daughter, has taken possession of Trąbczyn without a judgment, and her request to be entered in the mortgage book has been rejected; Triebenfeld is pursuing the recovery of Trąbczyn and Kamionna. Land appropriated by Honrichs, Hawich and Hecker is to be returned and settled with colonists, and the colonists of the lordship of Zagórów are to be remitted a third of their interest this year.
oe1bu9454-216: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, expects that private debts and the so-called Bayonne sums (bank, invalid-fund and wards' moneys) will be placed under the same moratorium of 41 3/4 years, so that the 200,000 Reichsthaler charged on the Prince's South Prussian estates would be paid off at 6 per cent. He urgently presses the Prince for a decision whether to keep the estates or exchange them; if he keeps them, Triebenfeld means to drive out the Hollanders by legal action and form demesne farms. He asks for a power of attorney for the lawyer Schmid in Kalisz against Hecker, who with Hawich is stirring up the subjects, and for a letter from the Prince to Hecker.
oe1bu9454-217: Von Sanitz writes from Berlin, to which he has moved from Wrocław to save what remains of his lost fortune. He asks whether the first tribunal has already decided on the Trąbczyn estates of Prince Hohenlohe-Ingelfingen, and asks if possible for copies of the justice of the peace's judgment and of the tribunal's sentence. He says his old former lawyer in Poznań, Weltzer, holds out little hope. From the Saxon court he hears that Polish commissioners, acting on a petition from Dąbska, Prusimski's daughter, have ordered the estates returned to her. He says war in the north is expected soon.
oe1bu9454-218: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, proposes exchanging the Zagórów estates for Count Wartensleben's Skorogoszcz; Stössel and Weigel, two of the Prince's largest creditors, are to take over Skorogoszcz and a mortgage of 207,625 Reichsthaler on Zagórów. If need be, Triebenfeld intends to exchange his own Blizanów estate with Wartensleben's eldest son and to contribute a mortgage of 30,000 Reichsthaler on his Konotop estate. He asks for a quick and secret reply, since Wartensleben is negotiating with Gumperts. He means to win the lawsuits against the people of Oleśnica and Wrąbczyn, recommends that Heuthausen collect the arrears at Pszczew (about 20,000 Reichsthaler), and reports seizures on Świniary.
oe1bu9454-219: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, urgently asks the Prince to decide on the plan he sent in, since a councillor of medicine from Kalisz is already negotiating with old Count Wartensleben. The advantage would be clear, he says, if Weigel and Stössel, two of the Prince's largest creditors, were satisfied by it. If the Prince agrees, Triebenfeld intends to travel to Nysa and exchange his own Blizanów with Wartensleben's elder son in order to satisfy the creditors. He complains of rising dues and growing hardship and fears murder and revolt. President Dierschlag, the mortgage conservator, has been asked whether Triebenfeld had money entered in the mortgage book and bought estates for himself.
oe1bu9454-220: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he came too late to old Count Wartensleben in Nysa, who has already concluded a sale of Skorogoszcz with a merchant from Kalisz. He proposes instead the Wołczyn estates of the young Wartensleben (asking price 200,000 Reichsthaler, debts 120,000). Weigel and Stössel, two of the Prince's largest creditors, are to take over these estates together with the mortgage on Zagórów and give the Prince a receipt for 350,000 Reichsthaler (270,000 on the mortgage and 80,000 more). Koszęcin, the Prince's Silesian estate, could then be taken as an entailed estate for Prince Alexander.
oe1bu9454-221: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he cannot send the 18,000 Reichsthaler the Prince ordered from the Zagórów estates before two lawsuits have been won. He hopes to pay the Christmas interest so that the moratorium holds. He has set in motion the sale of Zagórów to Stössel through Count Leopold von Wartensleben; according to Wartensleben, Stössel demands that Rusinowice be included. Triebenfeld may want to exchange his Blizanów for the Piła estates, settle with Weigel and Stössel, two of the Prince's largest creditors (total account 470,000 Reichsthaler), and so save Koszęcin. He rejects Wołczyn and Skorogoszcz.
oe1bu9454-222: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Baron Stössel, one of the Prince's largest creditors, is willing to take over the Zagórów estates for his claims according to Triebenfeld's plan, and urgently asks whether the Prince wants the matter settled this way with Stössel and Weigel. Stössel demands a letter from the Prince; Count Wartensleben advises that it state that, because of the will of the Prince's mother-in-law, he cannot pay for Koszęcin and is therefore giving Zagórów, to which Triebenfeld wishes to add the Blizanów estates. Köckritz calls Triebenfeld to Berlin.
oe1bu9454-223: Prince Hohenlohe-Ingelfingen tells the Prince's agent, Triebenfeld, of an exchange offer from General von Schimmelpfennig, who wants to trade the Zagórów estates for his own debt-free estates Szelce and Maderzewo near Mysłowice (yield 8,000 Reichsthaler, according to others 6,000). Lieutenant Sommer is to prepare the inspection at Zagórów. The Prince doubts that a deal with Weigel will be concluded. He urgently needs cash by Christmas, no longer asks about the Trąbczyn lawsuit, and permits Trąbczyn to be included in a transaction if this is advantageous. He has consented to the marriage proposal of a suitor from Hohenlohe-Kirchberg for his daughter Adele.
oe1bu9454-224: 'The writer, who is selling the Zagórów estates, reports that General Schimmelpfennig wants them for 200,000 Reichsthaler. Schimmelpfennig''s sons-in-law, cavalry captain von Kotzow and von Johnston, are to inspect the estates together with Lieutenant Sommer. The payment plan: the estates Seliz and Modzewo at 110,000, the small estate Goła Wieś, 66,000 Reichsthaler in mortgage bonds at par, and the remainder in cash or in Silesian mortgage bonds. According to cavalry captain von Stössel of Rusinowice, the sale of the estates to Weigel and Stössel has fallen through. The writer asks the man he addresses to bring the lawsuits to an end.'
oe1bu9454-226: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, thinks the exchange plan with General Schimmelpfennig has fallen through or been held up by obstacles, since neither Sommer nor the General has arrived. He sends on a letter from Count Wartensleben, who says everything depends only on a letter from the Prince to Stössel, to the effect that Stössel and Weigel can be satisfied only out of the estates in the Duchy of Warsaw. The prefecture demands the original deed for Zagórów, failing which confiscation threatens. Triebenfeld asks whether the lawsuit over the Trąbczyn estates should be continued.
oe1bu9454-227: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, forwards the offer of the sub-prefect von Brzechffa to lease the lordship of Zagórów for 6 years at 20,000-25,000 Reichsthaler a year and to put its three demesne farms in order for 3,000. Triebenfeld advises accepting the contract, since he says he cannot raise the taxes and the interest, among them 1,250 Reichsthaler to the Invalids' Fund, and a new sequestration threatens. He asks the Prince to decide between a deal with General von Schimmelpfennig and the lease, followed by a settlement with Weigel and Stössel to free Koszęcin.
oe1bu9454-228: Lieutenant Sommer reports to Prince Hohenlohe-Ingelfingen on his mission to General Schimmelpfennig von der Oye. The General is still willing to enter into the planned exchange involving the Zagórów estates; what has delayed him is his illness and the difficult negotiations of his son, a cavalry captain, with Stägemann in Berlin over the money to be handed over, which through the mediation of the Saxon envoy now stand more favourably. Since no inspection of the estates is possible in winter, the General asks that the matter be put off until spring.
oe1bu9454-229: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends birthday wishes. He reports the thanks of the Attorney General Count Lipski, the President of the Tribunal Smogorzewski and the councillors of the Tribunal for the game the Prince sent, and expects this to have an effect when the Oleśnica and Wrąbczyn case is decided. With the sub-prefect Brzechffa he has concluded the lease of the Zagórów estates alone for 20,000 Reichsthaler, subject to approval. On 8 February he intends to arrive with him at Sławięcice. He says the interest is secured and the Bayonne capital will be paid off; the documents submitted have removed every dispute, and perhaps the dues will be reduced.
oe1bu9454-230: Prince Hohenlohe-Ingelfingen complains to the Prince's agent, Triebenfeld, that Triebenfeld missed the 8th, the date he had set himself for coming with Brzechffa. Since the Prince draws nothing from his Zagórów estates, he wants to make use of General von Schimmelpfennig's interest in buying them; the General means to view them at the beginning of March. The Prince demands a definite answer and financial help. He has no objection to the lease to Brzechffa, but presses for haste, since he has asked the King for a commission to settle his debts.
oe1bu9454-231: Weigel, one of Prince Hohenlohe-Ingelfingen's largest creditors, asks the Prince's agent, Triebenfeld, to fix a day for a meeting in Kalisz or at another place of his choosing, to discuss and take counsel on the matters between the Prince and himself. A few weeks earlier he was in Kalisz on his own business and had hoped to see Triebenfeld there, but could not find out with certainty where he was staying. He asks for a prompt reply.
oe1bu9454-232: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, ill for weeks and without money for a doctor, reports harassment over the leasing of the Zagórów estates; he says Brzechffa has declared he will pay at Midsummer. He means to go to Warszawa with Brzechffa to pursue the Trąbczyn and Wrąbczyn business. He urgently asks for a declaration issued by the Prince's courts assigning him 3,125 Reichsthaler, with interest and costs 4,219, out of the interest from Swięcia, Wrąbczyn, Alt Oleśnica, Skokum, Sophienthal, Kopojno and Adelow. He says grain, livestock and fodder have been taken away and the hardship is great.
oe1bu9454-233: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, proposes plans for paying off the Prince's debts. Von Sobottendorff, to whom the Prince owes 40,000 Reichsthaler, is to lease Drzewce for 18 years at 2,000 a year, and his two sons are to receive four free settler holdings in Swięcia at 1,000 each. Weigel is to lease the demesne farm of Kopojno with propination rights for 9 years at 6,000 a year for his 50,000. Prince August is to pay 50,000 to the Invalids' Fund. Cabanis, the surveyor, is to present his account before Chomanowski and bring it to Sławięcice.
oe1bu9454-234: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, has sent an express messenger to Wrocław so that Weigel will come quickly. If his plan with Weigel succeeds, he says, the Prince will be rid of a debt of about 54,000 Reichsthaler. The obstacle is the Invalids'' Fund: it demands some 9,000 Reichsthaler in arrears of interest and has placed an attachment on all interest. Triebenfeld wants to obtain from the King that the capital of 50,000 Reichsthaler be paid to the Fund out of the estate of Princess Sacken, and he recommends the help of Prince August for this.'
oe1bu9454-235: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that old Weigel is willing to conclude the lease contract and, on Triebenfeld''s advice, is not averse to buying the Zagórów estates: he would take over the debts and pay a further 200,000 Reichsthaler, which he wishes to set against Koszęcin. Weigel advises keeping the matter secret and having Koszęcin sold at auction; he would bid as a creditor, make it over to the Prince by a written undertaking, and believes it can be had for under 600,000. Triebenfeld asks the Prince for secret instructions and for the papers to be sent quickly.'
oe1bu9454-236: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Weigel has handed over to him all of his business with the Prince; once Triebenfeld has recovered, he is to travel with Weigel to the Prince. He considers Weigel's offers advantageous. Weigel wants to buy, so the lease contract has been postponed. Triebenfeld is waiting for the papers and asks that the enclosed letter to the Prefect be signed and sent back by express. He says Sobottendorff can rest easy and that Honrichs is a scoundrel. His son has heard from the medical councillor Cosmar that no creditor of the Prince will ever get a single Groschen.
oe1bu9454-237: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks that the Prince's letter to the Russian Emperor be sent to him at Dresden, to be held at the post office; with it, he says, he will certainly get Trąbczyn and Kamionna back. He is leaving for Dresden because his eldest son is lying at Naumburg, shot through both thighs. The steward König posted his last letter at Syców instead of sending it to Sławięcice. Trzciński, Zerboni and Meierowitz offer nothing but excuses; execution is proceeding only against Meierowitz. Radke cannot get away because of 80,000 Russians.
oe1bu9454-238: Prince Hohenlohe-Ingelfingen complains to the Prince's agent, Triebenfeld, that Trzciński has paid nothing and that Zerboni has not met his obligations. Weigel is pressing the Prince hard, and he means to calm him with Trzciński's bills of exchange. An earlier letter from Triebenfeld was probably lost in the fire at the post house in Syców. The Prince encloses an open letter to the Russian Emperor for Triebenfeld to use as needed. The King, the State Chancellor and the Minister of Justice refused him help with the settlement with the creditors at Brzeg. He hopes to obtain something from Meierowitz, and asks after Ratke.
oe1bu9454-239: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, writes from Nysa, where he arrived late because of gout, that the King left after three days for Teplitz, where the Russian Emperor is staying with his sister; he says it is doubted that Emperor Franz will come. Austria, he says, wants to remain neutral, and Napoleon has hurried to Paris. The government is moving to Ząbkowice Śląskie. Triebenfeld intends to go to General Ortel at Neustadt, whose plan has his approval. He has seen to letters for Mrs von Hahn and Chief Forest Master von Kleist.
oe1bu9454-240: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Austria wants to stay neutral and only mediate. Russian troops and generals, he says, were grumbling about the armistice. Köckritz, he says, has fallen out with Hardenberg and mocked his confidence in front of the monarch. Supplies are uncertain, grain scarce and the roads bottomless. Zastrow is to command the militia at Nysa (55,000 men), while Ortel lies ill. Triebenfeld intends to travel by way of Nysa to Ząbkowice Śląskie, to the headquarters and to Świniary, to bring up produce and raise money.
oe1bu9454-241: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he has handed General Gneisenau the Prince's letter at Nysa. Gneisenau intends to reply and sends word that the Prince should be calm, matters will improve. Gneisenau now commands the Silesian militia and is chief of the general staff. Köckritz has changed Zastrow's mind, and Zastrow now speaks warmly of the Prince. Hardenberg is with the Russian Emperor in Bohemia and returns in 5 days. Everyone speaks in favour of Triebenfeld's plan for supplies from Poland.
oe1bu9454-242: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from the Congress of Vienna that it has been adjourned until 1 November and that France is resisting the Saxon and Polish acquisition, but that State Chancellor Hardenberg remains firm. He says the Württemberg affairs are going well. He discussed his plan for Sławięcice with Barbe and another adviser, who approved it, before he submitted it to Hardenberg. Koszęcin, the Prince's Silesian estate, must wait until the Courland matter, the claim of the Courland heirs against the Prince, has succeeded. On Kolno, Kamionna and Trąbczyn, he says nothing will be settled before the decision on Poland's fate. He says the Miączyńska, born Prusimska, the daughter of Prusimski, has powerful friends.
oe1bu9454-243: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks the Prince for 300 Reichsthaler in gold because of the terrible high prices in Vienna; otherwise, he says, he will have to leave on the 23rd. For 400 Reichsthaler he exchanged he received 1,200 gulden in Vienna redemption notes, of which he has spent 392 gulden. He reckons on 50 gulden in Vienna currency, or 15 Reichsthaler, a day and 260 gulden for the return journey. He says he can live only another 10 days, but that the matter is to last at least 5 more weeks. He is lodging at the Golden Duck, Schulerstraße.
oe1bu9454-244: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from the Congress of Vienna that the Emperor, the King and Grand Duke Constantine have been given Austrian regiments. The princes and estates of the Empire have asked Metternich to reinstate the Emperor of Austria as head of the Empire. Nothing has been decided about Poland, and Wilhelm von Humboldt is working excellently for the Prince's cause. Triebenfeld assures the Prince of a quiet life in Sławięcice, urgently awaits his letter and asks whether someone should be sent to Brzeg about the medical councillor Cosmar, who administers the Prince's entailed estates, and the settlement of 1811.
oe1bu9454-245: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, petitions State Chancellor Hardenberg on behalf of the distressed Prince. He says the medical councillor Cosmar, executor of the will of Princess Sacken, has lodged himself in the Prince's entailed estates of Sławięcice, Lasowice and Oppurg (79,500 Reichsthaler in yield), relying on a settlement of 1811 that the dying Princess signed only with three crosses. Cosmar, he says, draws all the revenues and submits no account. The Courland heirs, who claim 426,000 Reichsthaler from the Prince, will take 112,000. Triebenfeld requests an advance of 112,000 Reichsthaler, annulment of the settlement, Cosmar's removal and a report from the Higher Provincial Court at Brzeg, and offers 60,000 Reichsthaler as security.
oe1bu9454-246: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is to stay quiet in the matter of the Polish estates until a decision has been reached about Poland. If the district of the Trąbczyn estates falls to Russia, he says, State Chancellor Hardenberg will speak for the Prince with the Emperor. He says he submitted a petition after altering it twice. In the Koszęcin matter nothing of substance has yet happened. News from the Congress of Vienna: Saxony falls entirely to Prussia, and nothing has been decided about Poland. Zerboni received the Order of the Red Eagle. Triebenfeld encloses a pamphlet by Gärtner.'
oe1bu9454-247: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from the Congress of Vienna that Poland's fate has been decided favourably; now, he says, come the affairs of the Empire, for which he sends a copy of the petition of Privy Councillor Goerch on behalf of the whole House of Hohenlohe. Wilhelm von Humboldt promised support. State Chancellor Hardenberg declared that the money should be given, but that cancelling the settlement pursued by the medical councillor Cosmar would cause an outcry. He says the Courland heirs are to be satisfied with 112,000 Reichsthaler, and the remaining creditors, so long as the Prince lives, with 12,000 a year. An account of the entailed estates shows income of 79,500 Reichsthaler and expenditure of 79,462.
oe1bu9454-248: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that State Chancellor Hardenberg has the best of intentions and that Minister Wilhelm von Humboldt is pursuing the Prince's case eagerly. The Courland heirs have asked the King to satisfy their claim against the Prince, and the King wants to settle the matter after his return. Count Winzingerode, he says, intends to demand 100,000 Reichsthaler for Prince August under the will of Princess Sacken out of the income from Sławięcice and Lasowice; Triebenfeld replied that she was only a life tenant. Because the decision on Poland has not been announced, the Trąbczyn and Kamionna matter is at a standstill.
oe1bu9454-249: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, acknowledges two letters from the Prince. Court Councillor Hahn's paper can no longer be added to the petition, since it is already before the King. He says he urgently needs 12,000 Reichsthaler to conclude matters with the authorised representatives of the Courland heirs; after that 100,000 Reichsthaler would be made payable in Berlin. An enclosure shows Wilhelm von Humboldt's goodwill. Gärtner is to submit a paper on the Hohenlohe grievances to the Congress. The Prince should issue Göschel's power of attorney without a name; Triebenfeld intends to enter either Göschel or Gärtner.
oe1bu9454-250: Minister Wilhelm von Humboldt confirms to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, that he received his letter of the 3rd, which told him of the memorial handed to State Chancellor Hardenberg. He returns the copy left with him and promises to support its content so far as this lies within his sphere of activity.
oe1bu9454-251: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, submits an opinion that the Prince had drawn up from the files of the Higher Provincial Court at Brzeg. He asks for written assurance of the hope that 112,000 Reichsthaler will be advanced to settle with the Courland heirs, so that the Prince can conclude the agreement with their attorneys. He says the settlement and the codicil of 1811 were fabricated by the medical councillor Cosmar. The Prince is nearly 66 years old, so any delay is dangerous: the monarch could lose 461,000 Reichsthaler, including 35,000.'
oe1bu9454-252: State Chancellor Hardenberg replies to the request of Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, of the 25th of the previous month. The claims of Prince Hohenlohe-Ingelfingen to Trąbczyn and Kamionna will settle themselves, he says, as soon as the general settlement and agreement concerning the Duchy of Warsaw, now in progress, is carried out.
oe1bu9454-253: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says that on Trąbczyn and Kamionna he received only a short reply to his enquiry. He concludes from it that the matter will be settled along with the great general settlement. He handed Court Councillor Hahn's opinion to State Chancellor Hardenberg, who saw nothing new in it. The Duchess of Żagań wishes to raise money on Żagań and is pledging for it the royal debt, the sum guaranteed for Prince Hohenlohe-Ingelfingen. The King has postponed this. Triebenfeld wants a written assurance so as to conclude with the Courland attorneys.
oe1bu9454-254: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains that he is left without an answer and without money, and demands funds from the Prince. He says he asked for 1,400 Reichsthaler for four to five weeks but received only 640, and that within fourteen days he will need a further 600 Reichsthaler or 200 ducats. He promises the return of the Polish estates, the paying off of the Courland debt of 461,000 Reichsthaler, and release from the Koszęcin ties. The Prince is to say nothing about the sale of Koszęcin. He certifies receipt of 60 Friedrich d'or from Carl and 50 from the referendary Bally, and asks the Prince to send 200 Reichsthaler to his daughter.
oe1bu9454-255: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that State Chancellor Hardenberg has been ill for five days; without him the Prince's affairs are at a standstill. He says Hardenberg has taken them in hand, that Minister Wilhelm von Humboldt speaks of the game being won, and that Court Councillor Hahn's opinion has had its effect. The priorities, he says, are ending the Courland matter, Cosmar's fall, and possession of the estates by the Prince as holder of the entailed estate. According to news he has received, the King of Prussia travels to Berlin on 8 December; Triebenfeld intends to appear in person on the 11th and asks that no more letters be sent.
oe1bu9454-256: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that an order is to go to Berlin, to Minister of Justice von Kircheisen and Finance Minister von Bülow, to set up a commission to investigate the conduct of the medical councillor Cosmar. He says Stägemann is to draw up an opinion for State Chancellor Hardenberg, but Triebenfeld distrusts him as a friend of Zerboni and Cosmar. The settlement with the Courland heirs and an advance of 112,000 Reichsthaler remain unresolved. He complains of a lack of money, files and instructions, the settlement of 1811 being incomplete, and asks for evidence, blank forms and support for his children in Wrocław.
oe1bu9454-257: A correspondent whose name is partly illegible refers to the addressee's representation that Prince Hohenlohe-Ingelfingen had undertaken, in the settlement of 1811, to pay himself the capital owed to the Courland heirs. Since he cannot find the passage, he asks that it be marked in the enclosed settlement and that the document be sent back to him by the bearer.
oe1bu9454-258: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, objects to the referral of the Prince''s matter to a commission in Berlin, communicated through Stägemann. He repeats his proposal: he says the Courland heirs would regard the debt as settled with 112,000 Reichsthaler, the Prince paying off 25,000 a year and discharging the 35,000 Reichsthaler raised at Wrocław in 1790. He warns against making inquiries of Count Wratislaw and offers a security of 60,000 Reichsthaler.'
oe1bu9454-259: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he expects State Chancellor Hardenberg's decision at any hour, ordering the Higher Provincial Court at Brzeg to investigate the matter at once and report. If the report agrees with his submissions, he says, Hardenberg will have the 112,000 Reichsthaler paid. The Prince should declare openly before the commissioner that he was induced to join the settlements, that they harm the creditors, that the debts are fictitious and that the medical councillor Cosmar forged the whole thing. He should consult Court Councillor Hahn and spare not even his own son. Barbe is speaking up for him.
oe1bu9454-260: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he has sent State Chancellor Hardenberg''s resolution and the order to the Higher Provincial Court at Brzeg to the Prince by express courier, and he is counting on Court Councillor Hahn. He sets out the points for the Prince''s declaration: that while in custody the Prince was induced to agree to the settlements and the codicil, that the sums were largely fictitious, and that all of it was driven by the medical councillor Cosmar, who he says stirred up the Prince''s son against his father. The aim: annulment of the settlements, surrender of the entailed estates, and an advance of 112,000 Reichsthaler. He asks for a copy, blank forms and a letter of thanks to Hardenberg. Postscript: he urgently asks for 300 Reichsthaler in gold.'
oe1bu9454-261: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports a firm promise that the Polish estates will be recovered. For the Trąbczyn estates he is to have a calculation of damages ready, and he suggests that Leixner present the calculation of damages for Kamionna. He says everything depends on the Prince's declaration and on the report of the Higher Provincial Court at Brzeg, which would have to agree with his own submission. Then 112,000 Reichsthaler would come in to pay the Courland heirs, and the medical councillor Cosmar would be brought down. He asks that Hahn be allowed to act, and sends a form of power of attorney for Privy Councillor von Göschel. According to Gärtner the Hohenlohe case stands very well.
oe1bu9454-262: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that State Chancellor Hardenberg has promised Prince Hohenlohe-Bartenstein that he will take up the Prince''s case actively. Everything now depends, Triebenfeld says, on the Prince''s declaration and the confirmation of his memoirs; then the Courland heirs would be satisfied and the medical councillor Cosmar called to account. A letter of thanks to Hardenberg should mention that Cosmar gave the Prince only 2,500 Reichsthaler instead of 72,000. He asks urgently for 100 ducats. Postscript: he suggests reminding Hardenberg of the 100,000 Friedrich d''or sent to Koblenz through Meyer.'
oe1bu9454-263: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, welcomes the sending of Court Councillor Hahn and Lombardini to Brzeg with powers of attorney from the Prince, and hopes with Eberhard that the Courland heirs will be satisfied. He warns, however, that State Chancellor Hardenberg wants the Prince examined in person, either at Brzeg or through a commissioner at Sławięcice who is to report to him. Göschel is submitting a further note to the Congress of Vienna. As for Poland, everything rests until the Congress ends. He also reports the departure of the King of Württemberg.
oe1bu9454-264: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks for strict secrecy about his plan for Koszęcin, the Prince's Silesian estate. Since he had heard that the King would no longer permit any exchange or purchase of estates, he took Court Councillor Barbe into his confidence, who was outraged at the gift of 30,000 Reichsthaler said to have been demanded for Prince Hardenberg. Now Count Pourtalès, who wishes to buy property in Silesia, is to purchase Koszęcin; the Prince would still receive 38,000 Reichsthaler. Triebenfeld says he has promised Barbe 30,000 Reichsthaler and asks the Prince to send him the drafted written undertaking to pay it.
oe1bu9454-265a: 'Prince Hohenlohe-Ingelfingen thanks a Privy Councillor of State for guiding his affairs, as the Prince''s agent, Triebenfeld, had written. Everything depends on the advance of 112,000 Reichsthaler: then, the Prince says, the King would be released from the obligation, would get back the debt instrument for 300,000 Reichsthaler, and the creditors would be satisfied. The advance could be repaid out of money that the medical councillor Cosmar is holding back: 60,000 Reichsthaler for the Prince''s son August, 100,000 for his eldest son, and more than 48,000 for the Prince himself.'
oe1bu9454-265b: Prince Hohenlohe-Ingelfingen asks a general to obtain from the Russian Emperor the return to him of the Trąbczyn estates together with 8 years of revenues. The late King, he says, granted him the confiscated Prusimski estates of Kamionna and Trąbczyn in 1796. In 1807 the administrative commission handed them over to Prusimski's daughter, now Mrs Miączyńska. The tribunal at Kalisz referred him to Napoleon. Now the Prosna is to become the border, and the Prince fears Miączyński's influence with the Governor General. He asks that the Prince's agent, Triebenfeld, be given a hearing.
oe1bu9454-266: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Russia is demanding the Prosna as the border, which would place Trąbczyn and Triebenfeld's own Blizanów estates under foreign sovereignty and make Trąbczyn hard to recover. He says State Chancellor Hardenberg is opposing this. Should Russia obtain the districts, he says the matter would have to be settled with Emperor Alexander, since Dąbska or Miączyńska, Prusimski's daughter, stands in favour with Lanskoy. He awaits the report of the Higher Provincial Court at Brzeg. He asks for blank forms, powers of attorney, the letter to the Chancellor, and the written undertaking for Barbe, since Pourtalès will probably come in.
oe1bu9454-267: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains that since the Prince's letter of 17 December, which he received on the 21st, he has had nothing further from him. He waits in vain for the letter to State Chancellor Hardenberg, the blank forms, the power of attorney for Göschel, the written undertaking for Barbe concerning Koszęcin, and for money; he says Barbe can give nothing more. What worries him most is the report from Brzeg that has not arrived. He says Russia intends to approach the King about Poland.
oe1bu9454-268: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, confirms the receipt of 1,125 gulden in paper money. He has delivered the Prince's letters to the King and to State Chancellor Hardenberg and has had letters written to General von Schöler and to Stägemann. The Trąbczyn affair worries him, since the area will probably fall to Russia. He intends to have the Emperor worked on through General von Schöler. According to Court Councillor Hahn, the officials' statement shows barely half as much income from the entailed estates.
oe1bu9454-269: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends the Prince his letter to State Chancellor Hardenberg, which Court Councillor Barbe handed over together with the Kircheisen correspondence. The matter now lies with Stägemann. He fears for Trąbczyn should the district fall to Russia. He says Hardenberg states that the Prince must otherwise be compensated. He does not yet have permission to approach the Russian authorities about Trąbczyn. He intends to pursue Cosmar's removal and the administration of the entailed estates, and awaits the reply of Count Pourtalès.
oe1bu9454-269a: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends on the Prince''s behalf the correspondence with Minister of Justice von Kircheisen, which the Higher Provincial Court at Brzeg would not take down in the record. He says that, because of the Courland heirs'' claim of 300,000 Reichsthaler, the medical councillor Cosmar has cut off and placed under arrest everything belonging to the Prince. He says the heirs are content with 112,000 Reichsthaler: 12,000 in cash and an order for 100,000. Triebenfeld asks that this sum be advanced to the Prince and that the entailed estates be put under administration. In return he offers to hand over the debt instruments and the royal guarantee.'
oe1bu9454-270: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Kalisz will probably become Russian. He must now work to recover Trąbczyn from the Russian side, but receives no assurance: he says the Emperor is unlikely to overturn the measures of the commission that governed the Duchy of Warsaw in 1807, and will rather compensate the Prince in some other way. State Chancellor Hardenberg forbids him any approach. Miączyński, husband of Prusimski''s daughter, is a close friend of Count Lanskoy. The matter rests with Stägemann. If the Courland heirs are satisfied, the attachment of the medical councillor Cosmar falls away. The estimate of revenues for the Brzeg protocol alarms him. He also relays rumours about Saxony and Wellington.'
oe1bu9454-271: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports from the Congress of Vienna: he says the Polish border over Słupca near Pyzdry, the Warta and the Prosna has been accepted, and that the King of Saxony keeps Dresden, Leipzig and Bautzen. He continues to press State Chancellor Hardenberg, and the files are with Stägemann. The advance of 112,000 Reichsthaler may be regarded as secure. Prince August is to cancel the power of attorney he gave Cosmar and write about this to the Minister of Justice and to the Higher Provincial Court at Brzeg. On the Polish estates Triebenfeld awaits word whether he should come.'
oe1bu9454-272: Hahn sends Prince Hohenlohe-Ingelfingen, as ordered, the draft reply to Prince August. He attributes the withdrawal of the power of attorney to the decisions taken in Vienna. He fears fresh missteps in Öhringen, which he says could only be averted in person; should the worst come, he would need a secret instruction together with a power of attorney. By inspecting the estates Hahn means to establish their true yield and what building work they require. The estates' funds, he says, should no longer go to a Berlin lawyer.
oe1bu9454-273: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, defends himself against the Prince's accusations. He says he entered the revenues of the entailed estates at 79,000 Reichsthaler in line with the Prince's own figure, and that the officials reduced them to 36,000. Court Councillor Hahn values the estates at 2 millions and the yield at 60,000 Reichsthaler, and the advance of 112,000 Reichsthaler will be granted. Triebenfeld indignantly rejects any suggestion of secret arrangements with the Courland heirs. General Schöler will not intervene with the Emperor, and Nesselrode shrugs his shoulders. Triebenfeld asks that a successor be sent soon, and has named Hahn as administrator.
oe1bu9454-274: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says that on the Trąbczyn vindication he has still had no decision from State Chancellor Hardenberg. At a commission under General Amstetten he was advised against submitting it for the time being. He says he had the documents copied and certified, and the court papers translated into German under oath. He hopes the advance of 112,000 Reichsthaler will soon be granted. From the Congress of Vienna he reports on the Württemberg assembly of estates set for 15 March and the protest of the estates. Barbe and Göschel ask that Prince August be warned to concede nothing.
oe1bu9454-275: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Stägemann has still not made a presentation to State Chancellor Hardenberg. He suspects ill will; he says a decision would be made in Cosmar''s favour if the Brzeg report were not so favourable to the Prince. His greatest worry is the submission of the files and documents concerning Trąbczyn, Kolno and Kamionna to the commission: the translator will only hand over the files with the translation against payment. He urgently asks for money and for the blank forms that were offered. He is ill and confined to bed.'
oe1bu9454-276: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, sends the Prince a worrying letter from the justice commissioner Eberhard at Brzeg and asks for it back. He says Stägemann has not yet brought the matter forward and Hardenberg has again promised help. He says he has only ever asked for 112,000 Reichsthaler to satisfy the Courland heirs and to administer the estates under the Prince. He urgently asks that Eberhard be sent to Vienna for a settlement with the Courland princesses. The petition concerning the Polish estates is ready; what is lacking is an order from the State Chancellor and money for translations.
oe1bu9454-277: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, confirms receipt of the Prince's letter of the 6th with the order for 200 ducats and three blank forms, and again hopes that Eberhard and Hahn will come to Vienna. He says he has handed in the Polish estate matter once more with all the documents and, on Beguelin's advice, has written to Zerboni; the reply is enclosed. Stägemann had not yet made his report. Cosmar, he says, is as good as ruined, and Prince August should demand back the power of attorney. He reports Napoleon's landing at Antibes.
oe1bu9454-278: Eberhard, a justice commissioner at Brzeg, urgently asks Prince Hohenlohe-Ingelfingen to raise at least 500 to 600 Reichsthaler for a journey to Vienna, which the Prince's agent, Triebenfeld, is pressing him to make. A settlement with the Courland heirs is possible only now, while the three princesses are in Vienna in person. The obstacles are an instruction from the heirs' general mandataries not to interfere, his lack of money, and the passports he needs. He is sending Triebenfeld a plan setting out two ways of justifying the journey.
oe1bu9454-279: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, considers a genuine settlement with the Courland heiresses decisive. After that, he says, State Chancellor Hardenberg would arrange an advance and the administration of the entailed estates. He is eagerly awaiting Eberhard. Hohenlohe-Bartenstein, Winzingerode and Göschel have written to Langenburg and Kirchberg. He suspects that Prince August has demanded the power of attorney back, which would leave Cosmar unprotected. As to the Polish estates, Hardenberg asks for patience until the decision on the estates taken from the donatories. Triebenfeld also reports news and rumours about Napoleon's advance and his outlawing.
oe1bu9454-280: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, regrets that Eberhard is not coming and that no settlement has been reached with the Courland heiresses; he fears delay by Cosmar and Stägemann. He says Prince August has not yet revoked the power of attorney, and that nothing can be done with Prince Adolph regarding Koszęcin. On the Polish estates State Chancellor Hardenberg has replied; Triebenfeld is not to write to the Emperor. He adds news from Vienna: Napoleon''s march on Paris, Wellington''s departure, and Talleyrand''s quarrel with Emperor Alexander. He asks that Eberhard be sent quickly.'
oe1bu9454-281: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks that Stock, the servant of Court Councillor Barbe, who is to fetch Barbe's sister to Berlin with Triebenfeld's 3 horses, be given a basket wagon by the Prince, and in addition a two-horse transport to bring the cases of glass belonging to the Court Councillors Barbe, Heym and Philippsborn from Prague to Sławięcice. He says Stägemann has not yet made a report; an intrigue is suspected. Eberhard cannot conclude the settlement with the Courland heiresses. If Trąbczyn is lost, the Prince is to receive other estates, perhaps in Silesia.
oe1bu9454-282: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, states that without a settlement with the Courland princesses nothing more can be achieved in Vienna, since State Chancellor Hardenberg has been led to believe there was a settlement over 162,000 Reichsthaler. He urges that Eberhard be sent to Vienna with a passport. He complains that Prince August has accepted the post of president. Letters to Prince August and to Berlin demand that the 100,000 Reichsthaler be paid to August in cash. He asks that Barbe's servant be dispatched, that a wagon be sent to Prague, and that Tambour and Wawrzyn be sent back to Blizanów. He reports on Napoleon's advance on Paris.
oe1bu9454-283: Beguelin, a privy councillor of state, promises Prince Hohenlohe-Ingelfingen to hand over the Prince's letter addressed to State Chancellor Hardenberg without delay and to put the Prince's wishes to him at the same time. He says he would be happy to help fulfil these wishes on the Chancellor's instructions. He says he had not known the Prince's agent, Triebenfeld, before and only met him in Vienna; that Triebenfeld referred to the Prince was enough for him to give him his full attention.
oe1bu9454-284: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that Trąbczyn, Kamionna and Kolno are no longer to be expected: he says Alexander has secured that the Poles keep the estates returned to them. He applies for compensation. For Kamionna he demands 93,000 Reichsthaler in cash (the Broniewski mortgage sum together with interest) and 120,000 in estates. For Trąbczyn, valued at 316,000, 246,000 remain after deduction of the debts. In all 459,000 Reichsthaler. Weigel''s 30,000 Reichsthaler have been transferred to Zagórów. Stägemann does nothing. He asks for blank forms and for Eberhard to come because of the settlement.'
oe1bu9454-285: A calculation of the compensation claim of Prince Hohenlohe-Ingelfingen for Kamionna and Trąbczyn. The King granted Kamionna in 1796 to the Prince after Anton von Prusimski, who had pledged it to Broniewski for more than 100,000 Reichsthaler; the Prince redeemed it in 1804 by a settlement for 55,000 Reichsthaler, and with legal costs and interest Prusimski's daughter is to repay 94,550 Reichsthaler in cash. Trąbczyn was valued at 316,000 Reichsthaler; of 138,000 Reichsthaler of debts (Lichnowski, Weigel, Grotowski, Zerboni and others), 78,000 remain. The sovereigns are to provide 367,164 Reichsthaler in estates or cash, 461,714 Reichsthaler in all.
oe1bu9454-286: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports on Napoleon''s return and the threat of war: he says little can be achieved amid the confusion, that Hardenberg promises everything and that Stägemann acts as he pleases. Since Prusimski''s daughter has had the Polish estates restored to her, he submitted a memorandum that calculates the losses on Kamionna and Trąbczyn (assessed at 316,000 Reichsthaler, net value 240,000) and demands 390,100 Reichsthaler in cash or in estates. He asks for the swiftest possible reply and for blank forms; Beguelin would like a letter from the Prince.'
oe1bu9454-287: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, complains that the Prince's letter of 3 April lay unsealed with the Post Director and was probably read. He welcomes Prince Adolph's decision and intends, before the King's departure, said to be on the 18th, to lay the decision before him and to ask where Adolph is to go and which uniform he should wear. Beguelin gave Lombardini's letter to the Chancellor; Triebenfeld does not show Hahn's threatening letter. He reports on the armaments against Bonaparte and rejects the reproaches about the money sent.
oe1bu9454-288: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, hopes Prince Adolph will arrive by the 22nd at the latest. He complains that the Cosmar matter has been dragged out for 5 months; Cosmar, he says, should deposit all the money with the Higher Provincial Court at Brzeg and render an account. Over Trąbczyn he has approached Minister von Stein, and he expects much from a French letter by the Prince that can be shown to the Russian Emperor. He rejects Otto's valuation of Trąbczyn at no more than 160,000 Reichsthaler; compensation, he says, should be demanded according to Blomberg's estimate of 316,000.
oe1bu9454-289: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, asks Albrecht, a Privy Cabinet Councillor, to obtain a categorical decision from the King on the claim of the Courland heirs against the Prince. He says the debt amounts to 300,000 Reichsthaler, 426,000 with interest, and that the late King signed it as principal debtor. If the King pays, Cosmar's administration of the entailed estates should be lifted; the Prince, he says, has received only 2,500 Reichsthaler in four years instead of 96,000. If the King disclaims it, Triebenfeld wants to reach a settlement with the heirs, who earlier were willing to accept about 112,000, and he asks for a royal advance for that purpose. He says Cosmar submits no account.
oe1bu9454-290: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that after seven months the medical councillor Cosmar has been instructed to pay the money from three years, of which 12,000 Reichsthaler a year is assigned to the Prince's creditors, into the Higher Provincial Court at Brzeg as quickly as possible and to render account. Stägemann defends Cosmar and advises the Courland heiresses. Minister Stein is pursuing compensation through the office of Sokolnik and has brought in the Chancellor, so that both may propose it to the Emperor. Triebenfeld intends to submit a memorandum on the Courland affair and on the Prince's military salary. He urgently asks for 100 ducats by express courier.
oe1bu9454-291: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that a cabinet order of 27 April commands the immediate payment of the 100,000 Reichsthaler to Prince August. He says the compensation for the Polish estates has been decided by Minister Wilhelm von Humboldt, but that the manner and timing depend on the Emperor. Stein, Worowzow and Nesselrode are working for it. Cosmar is to deposit the Prince's money at once, failing which he faces arrest and a supervisor. In the military matter there is nothing new. Triebenfeld urgently asks for money.
oe1bu9454-292: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that the case for compensation for the Polish estates is before the Emperor; he says Minister von Stein has promised help and Hardenberg will give his assurance in writing. In the dispute with Cosmar, he says, Stägemann is defending him; before State Chancellor Hardenberg, Triebenfeld demanded that the sums from the deed of 1799 and the settlement of 1811 be deposited with the Higher Provincial Court at Brzeg. He says Prince August is to be paid 100,000 Reichsthaler at once by cabinet order, and that Cosmar has reportedly been denounced for embezzling family money. He suggests that the Prince approach the State Chancellor, Hardenberg, in person at Nysa.
oe1bu9454-294: Bisenti reports to Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, on negotiations with the Duchess of Żagań concerning her claim of 30,000 Reichsthaler, or 100,000 in gold. She hopes, he says, that the King will pay the whole sum himself. As long as she is not told from higher quarters that he will not pay, Bisenti can do nothing. After that he expects a settlement on the offer of 150,000 Reichsthaler made to her, subject to ratification from above. He asks Triebenfeld to see that the Courland heiresses are told this openly.
oe1bu9454-295: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, says he missed the Russian Emperor at Kalisz. According to Chief Postal Director Espagne at Poznań, State Chancellor Hardenberg is still in Paris and will not reach Berlin for another three weeks; Barbe, he says, is lying ill there with nervous fever. Triebenfeld is looking into the matter of Pszczew (Betsche), where the subjects have applied for the contract to be cancelled, intends to collect money from the tenant in Blizanów, and plans to travel to Berlin. He encloses Zerboni's reply to Schenck and doubts that the report Zerboni claims to have sent Hardenberg exists. He also relays rumours about Stein, Radziwiłł and Biron.
oe1bu9454-296: Grevenitz sends Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, the post that has reached him together with two original enclosures. He reports that Court Councillor Barby has died in Paris and says he intends to make enquiries with the widow. State Chancellor Hardenberg, who had been expected, has meanwhile arrived. Philippischen is said to be dangerously ill. Grevenitz expresses his sympathy over Triebenfeld's illness. Cosmar, he says, has been convicted of dishonest dealing in the first instance but has appealed; should that stand, he will lose the guardianship.
oe1bu9454-297: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports the death of his daughter, of Barbe and of Trzciński, and his own serious illness. In the Pszczew matter the residents are applying for the contract to be annulled; Zerboni wants information on everything and seems somewhat dissatisfied with the report of Schenck, an assessor. Triebenfeld says nothing is to be hoped for from Kolno and Kamionna, and that Prusimski's daughter can hardly be compelled beyond the pledge sum already paid. He intends to come to an agreement with Leixner, to check Echaust's accounts, and asks the Prince for an answer in his own hand regarding a general power of attorney for Schenck.
oe1bu9454-298: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, is still ill. As regards the compensation promised in the Treaty of Vienna, he says he has no fears, since his friend Boidelang, a confidant of Wilhelm von Humboldt, is to take Barbe's place. He wants first to settle matters at Blizanów, then to put the business at Pszczew in order, and afterwards to travel to Berlin. He asks that the post office at Strehlitz be instructed and that letters be sent to him by express messenger. The game he has asked for is to be delivered at Gostyszyn to the chief tenant Faust. In Kalisz, he says, the Prussian taler is now worth only 20 Groschen.
oe1bu9454-299: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, intends in Pszczew to enforce the receipt that has been found with Leixner at Międzyrzecz and to have the debt struck off. He says he will agree to a cancellation of the Pszczew contract, which the townspeople, the peasants and Zerboni want, only on conditions, among them 11,000 Reichsthaler of canon arrears to the Prince. He says a further 99,000 Reichsthaler from Pszczew are still due to the Prince. Triebenfeld insists that the 72,000 and 65,000 Reichsthaler belonged to Kamionna. Trzciński is granted a postponement until Midsummer. Schenck wants a general power of attorney; Triebenfeld asks for a letter so as to be rid of him.
oe1bu9454-300: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports a dispute in Poznań: Zerboni had an opinion on the organisation of the Grand Duchy of Poznań drafted with his secretary Schmidt. Prince Radziwiłł refused to countersign it, because it went against the King''s order, whereupon Zerboni declared that he was the ruling lord there. Zerboni was sent to Berlin. Rumours: the Senate in Petersburg is said to have rejected the Polish constitution, and Grand Duke Constantin hurried to Petersburg. Once his messenger returns from Sławięcice, Triebenfeld intends to travel to Pszczew and then to Berlin about the compensation.'
oe1bu9454-301: Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, acknowledges the Prince's letter of the 26th, brought by the house steward Lombardini. He reports nothing new and asks for the Prince's decisions; Lombardini is to report. He is expecting his son and a tenant for Świniary, and intends afterwards to travel to Poznań and Pszczew. In the compensation matter he hopes for a good outcome, since he says he has won over the Chief Prefect von Smiedecki in Kalisz. Game for Blizanów and for Zerboni in Poznań would have a good effect; the last lot, he says, was almost entirely spoiled.
oe1bu9454-302: 'Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, reports that he had the justice-burgomaster Hawich and Chief Inspector Hecker with him and has issued thirteen judicial powers of attorney: concerning Dąbska, Prusimski''s daughter, and the Trąbczyn estates; for the lifting of the sequestration. There are also powers for a suit against Oppenheimer et Wolf in Kalisz for the cancellation of over 72,000 Reichsthaler; for the removal of the sequestrator Honrichs and the annulment of his unauthorised land sales; against Niedźwiecki over arrears of rent; against the Oleśnica hereditary tenants; and for representation at the Diet in Warszawa. He says his bonds for 250,000 Reichsthaler give him a say.'
oe1bu9454-303: The liquidation records of Prince Hohenlohe-Ingelfingen's debts list 142 capital claims against him, totalling 17,874 Reichsthaler in gold and 1,414,377 Reichsthaler 7 Groschen 11 Pfennig in Courant. Large claims include Carl von Stössel with 191,000 Reichsthaler, Goldstücker with 170,000, the curator of Stössel with 169,400, Charlotte von Triebenfeld with 112,000, the merchant Koppan in Wrocław with 80,000, the heirs of von Köckritz with 50,000 and the heirs of von Sobottendorff with 44,200. Bornstädt, Zerboni and Lombardini are also named.
oe1u199-001: King Friedrich Wilhelm III of Prussia confirms, as sovereign, the family majorat and fideicommiss that Prince Friedrich Ludwig of Hohenlohe-Ingelfingen founded in his will of 7 October 1805 so that his estates pass undivided to one heir; the confirmation is dated 19 December 1805. The will makes majorat his houses in Wrocław, the park at Szczytniki, Bytków, Koszęcin with Boronów, Olszyna, Harbultowitz and Cieszowa, and the South Prussian lordships of Zagórów, Trąbczyn, Pszczew, Wieniec and Bątkowo. If the male line dies out, his third daughter Auguste receives the South Prussian estates, Adelheid the Silesian ironworks, and Emilie Koszęcin.
ossol2289-001: 'On 3 September 1798, in Paris, Tadeusz Kościuszko, the commander of the Polish uprising of 1794, answers a Polish émigré correspondent who had written to him from Dresden in August of that year. He read the expressions of goodwill with the same courtesy as in the letters that had reached him in America; he regrets that events did not let him meet the writer in London, and would have liked to know him in person. When circumstances point out the time for regaining national independence, which he does not yet see, he will stand by every Pole of a truly Republican soul, and therefore by all who fought with him against the enemies of the country; then the ways of common defence and the nation''s true happiness will be founded on the principles the writer''s letter mentions. For now care must be taken not to expose them, through premature steps while happier events are awaited, to the persecutions of the enemies. He asks the writer to keep the letter, and promises to preserve his friendship. The letter is known from a copy in a collection made mostly by the Lwów bibliographer Stanisław Przyłęcki. It never names its addressee; it opens only "Obywatelu!" (Citizen!). A link to Antoni Prusimski, drawn from Pachoński''s entry on him in the Polish Biographical Dictionary, whose sources cite this manuscript, has been ruled out for now: the entry gives its sources only as a list, with nothing tying the manuscript to any claim, and its quoted wording does not appear in the copy. Only new evidence could show to whom the letter was written.'

oe1bu14525-001: 'A royal deed of gift by which Friedrich Wilhelm grants Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, Lieutenant-General and Governor of Wrocław, heritable and full property in estates fallen to the Crown: the town of Kamionna and market-town of Kulm in the Poznań district; the villages of Trąbczyn, Szetlewek, Nowa wies, Łazy, Old and New Laske, Osiny and Hauland Trąbczyński in the Konin district; and Brzyce in Cujavia, reserving sovereign taxes, with governments and chambers forbidden to obstruct him. Certified at Kalisz and entered in the Konin mortgage book for Szetlewek.'
oe1bu14525-002: A mortgage certificate confirming the Prince of Hohenlohe-Ingelfingen's title to the free allodial estate of Szetlewek in the Konin district, held in full ownership under a grant of 9 August 1796 from Friedrich Wilhelm II and valued by him at 24,000 Reichsthaler. It records a bar on sale to natives of the land without consent to alienate, an interest-free loan of 8,333 Rthl 8 Groschen (50,000 Polish florins) from Ignatz von Radzinski securing lease moneys, and a protest by Jacob von Przespolewski over 30,000 Polish florins claimed from a former possessor, von Prusimski.
oe1bu14525-003: 'A royal deed of donation by Friedrich Wilhelm, granting Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, lieutenant general of infantry and governor of Wrocław, hereditary and full property in estates fallen to the crown: the town of Kamionna and market township of Kulm in the Poznań district, the villages of Trąbczyn, Szetlewek, Nowa wieś, Łazy, Old and New Laske, Osiny and Hauland Trąbczyński in the Konin district, and Brzyce in Cujavia, subject only to sovereign taxes and public dues, with orders to the South Prussian governments and chambers not to obstruct him. Certified at Wrocław in 1798.'
oe1bu14525-004: 'A royal grant by Friedrich Wilhelm, King of Prussia, conveying South Prussian estates in hereditary and full ownership to his uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, Lieutenant General and Governor of Wrocław, in return for long service: the town of Kamionna and market town of Kulm in the Poznań district, villages including Trąbczyn, Szetlewek, Nowa wies, Łazy, Old and New Laske, Osiny and Hauland Trąbczyński in the Konin district, and Brzyce in Cujavia. Sovereign taxes and public dues are reserved, and all governments and chambers are forbidden to obstruct his possession or later transfers. Certified at Wrocław in 1802 by Sonnabend, the regiment''s judge advocate.'
oe1bu14525-005: 'A royal grant by Friedrich Wilhelm, replacing an earlier gift that had failed because the estates of the absconded former starosta von Prusimski proved heavily indebted: the King instead conveys to the Prince of Hohenlohe-Ingelfingen, hereditarily and in full property, sixteen formerly ecclesiastical villages including Pszczew, Łowyń, Zagórów, Kopojno and Wrąbczyn, subject only to a fixed unalterable canon of sovereign dues and the maintenance owed to the ecclesiastical bodies. Provincial authorities are ordered not to obstruct possession. Certified copy of 1803.'
oe1bu14525-006: 'A royal grant by Friedrich Wilhelm, King of Prussia, adding to the estates of Pszczew, Zagórów and Wienietz already given to his uncle Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, on 19 June the outlying parcels: the villages of Stołuń, Kuligowo, Szarcz, Silna, the bailiwick of Zielomyśl, the Pomherr Hauländer settlement and Heydemühle; Swięcin; and Konty, Szedlemin, Botkow and Karezin. Granted heritably and in full property, subject to a fixed sovereign due and the allowance payable to church foundations, with authorities forbidden to disturb possession. A certified copy of 1802.'
oe1bu14525-007: 'A royal letter of grant from Friedrich Wilhelm adds to the estates already given to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, on 19 June the outlying parcels belonging to Pszczew, Zagórów and Wienietz: the Stołuń, Kuligowo, Szarcz, Vogtey, Zielomyśl and Silna settlements with their Hauländer holdings and Heÿdemühle, the village of Swięcin, and Konty, Siedlemyn, Botkowo and Karczin, subject to a fixed canon and church stipends. Filed with it are a mortgage certificate and registration of title for Swięcia and the farm Broniki, which may not be sold to a native without consent.'
oe1bu14525-008: A royal grant by Friedrich Wilhelm making over to his uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, in heritable ownership, sixteen formerly church villages including Pszczew, Świechocin, Łowyń, Zagórów, Kopojno, Drzewce and Wrąbczyn with all appurtenances, subject only to the existing sovereign dues as a fixed canon and the allowance payable to the ecclesiastical foundations. It compensates for an earlier grant of the absconded starosta von Prusimski's heavily indebted estates, and orders all authorities not to obstruct possession. Certified copy.
oe1bu14525-009: A royal grant by Friedrich Wilhelm conveying to his uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, as unrestricted heritable property, sixteen formerly ecclesiastical villages including Pszczew, Łowyń, Zagórów, Kopojno, Drzewce and Wrąbczyn with all appurtenances, subject only to the existing territorial dues as a fixed canon and the stipend owed to the ecclesiastical foundations. It replaces an earlier, debt-burdened grant of the absconded former Starosta von Prusimski's estates, and orders all authorities not to disturb his possession.
oe1bu14525-010: A royal grant by Friedrich Wilhelm conveying to Friedrich Ludwig, Reigning Prince of Hohenlohe-Ingelfingen, sixteen formerly ecclesiastical villages, among them Pszczew, Łowyń, Zagórów, Kopojno, Drzewce and Wrąbczyn, in hereditary and full ownership, subject only to the existing sovereign dues as a fixed unalterable payment and to the maintenance allowance owed to the ecclesiastical foundations. It replaces an earlier grant of the absconded former Starost von Prusimski's estates, which proved too heavily indebted, and orders all provincial boards not to obstruct his possession. Certified copy.
oe1bu14525-011: 'A royal grant by Friedrich Wilhelm, given as a certified copy from a South Prussian archive, adding to the estates of Pszczew, Zagórów and Wienietz already conferred on his uncle Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, in June: at Pszczew the villages of Stołuń, Kuligowo, Szarcz, the bailiwick of Zielomyśl and Silna with their Hauländer holdings and Heidemühle; at Zagórów, Swięcin; near Wienietz, Konty, Szedlemin, Botkowo and Karczin. Held heritably and as property, subject to a fixed unalterable rent equal to the sovereign dues hitherto paid and to church dues, with authorities forbidden to obstruct him.'
oe1bu14525-012: 'A mortgage certificate for the noble estate of Kolno in the Poznań district, comprising the town of Kamionna and the market-town of Kolno, confirming the Prince of Hohenlohe-Ingelfingen''s registered title under a royal grant of 1796 after Anton von Prusimski''s property was confiscated for joining the 1794 insurrection. It lists the charges standing against it: protests lodged for Anton von Broniewski over a disputed pledge-possession and claims of 79,795 Rthl, plus 250 Rthl and small annual dues owed to Kamionna church.'
oe1bu14525-013: A valuation of Kamionna and Kolno in the Międzyrzecz district, drawn up for the Prince of Hohenlohe-Ingelfingen as hereditary lord on West Prussian principles of 1794, then corrected to South Prussian domain principles by Bading and attested by Beugnitz. It gives distances and boundaries, an area of 10,642 Morgen 35 rods, and describes the town of Kamionna with 466 inhabitants, its trades, livestock and the lordship's brandy and patronage rights, the two demesne farms and the village of Kolno with its labour-bound holdings, noting a disputed right to free wood from the Krobilewe heath.
oe1bu14525-014: A forest valuation for the estates of Kamionna and Kolno, certified at Kalisz by notaries Carl Anton Diener and Joh. Jacob Schmerck and drawn up by Forest Inspector Rochlitz. It proposes clearing 344 Morgen of oak, alder and beech for settlement, since a timber-taking right in the Gorcey and Krobilewer heaths makes the stands unprofitable, and reckons the gains from timber, purchase money at 15 Rthl per Morgen, ground rents, milling and propination dues, raising the estates' value from 186,943 to 199,463 and finally 255,833 Rthl 12 Groschen.
oe1bu14525-015: 'A mortgage certificate issued by the Royal South Prussian Government at Poznań registering the Prince of Hohenlohe-Ingelfingen''s title to the lordship of Pszczew or Pszczew with its villages, from Świechocin and Łowyń to Szarcz, the bailiwick of Zielomyśl and Silna, the Hauländer settlements and the Heydemühle, formerly Cathedral Chapter property. No debts are recorded, only two permanent burdens: an unquantified annual payment to the War and Domains Treasury, and a ban on selling to former Polish subjects without royal consent.'
oe1bu14525-016: A royal confirmation, issued under the South Prussian Government's seal at Poznań, of the handing over of the lordship of Pszczew or Pszczew in the district of Poznań to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, as heritable property. The Treasury's fiscal officer Beyer ceded it on the grant of Friedrich Wilhelm of 19 June 1797 and the declaration of 1 December 1797; the Prince's agent, councillor of justice Melzer, accepted. Appurtenances named include Świechocin, Łowyń, Dormowo, Szarcz, the bailiwick of Zielomyśl and Silna, Hauländer settlements and Heyde Mühlen. A note records the title entered in the mortgage book Vol. VII, Fol. 1.
oe1bu14525-017: A royal grant by Friedrich Wilhelm conveying to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, in heritable full property, sixteen formerly church villages including Pszczew, Łowyń, Zagórów, Kopojno, Drzewce and Wrąbczyn, with all rights, jurisdictions, woods, ponds and waters, subject only to the existing sovereign dues as a fixed unchangeable canon and the maintenance payments owed to the ecclesiastical corporations. Made because an earlier grant of the absconded starosta von Prusimski's debt-laden estates had fallen short. Filed with it are a certified copy made at Poznań and a note recording entry of the Prince's title to the lordship of Pszczew in the mortgage book.
oe1bu14525-018: 'A royal grant by Friedrich Wilhelm adding to an earlier grant of 19 June 1797 the appurtenances of the Pszczew, Zagórów and Wienietz estates: the settlements of Stołuń, Kuligowo, Szarcz, the bailiwick of Zielomyśl and Silna with their Hauländer holdings, the Pomher Hauländer holding and Heydemühle, the hamlet of Swięcin, and Konty, Szedlemin, Botkowo and Karczyn near Wienietz, in full hereditary property against a fixed canon and the share due to church foundations. Filed with it are a certified copy and a mortgage certificate entering the Prince''s title to the lordship of Pszczew or Pszczew in the mortgage book.'
oe1bu14525-019: A royal rescript from the government at Kalisz notifies the Prince of Hohenlohe-Ingelfingen that the War and Domains Chamber has verified the grant to him, under noble tenure, of the formerly church estates of Kopojno, Drzewce, Swięcia and Zagórów in the district of Konin, already handed over in kind, and requires him within four weeks to prove proprietary possession and to apply for a hearing date to have the title registered in his name.
oe1bu14525-020: Answering a petition of the 8th, the South Prussian government at Kalisz grants the Prince of Hohenlohe-Ingelfingen a further period of grace to settle his title of possession in the estates of Drzewce, Kopojno, Swięcia and Zagórów, but only until the last day of October 1800, and for all purposes. Addressed to Glenck, the Prince's building and economy councillor at Wrocław, in place of a formal resolution.
oe1bu14525-021: 'An official extract from the Kalisz mortgage register sets out the charges on Zagórów, granted to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen in 1797 and registered in 1801: an annual allowance of 88 Rthl 5 Groschen 9 d to the Kalisz War and Domains Treasury, treasury and hereditary-lessee protests over wood and pasture rights, and a 250,000 Rthl loan to von Triebenfeld, portions of it pledged or ceded to the General Invalids'' Fund and to the Oppenheim and Wolff banking houses, plus an 8,000 Rthl claim by the Seher-Thoss heirs.'
oe1bu14525-022: A grant by Friedrich Wilhelm, made because an earlier gift of the absconded former Starosta von Prusimski's debt-laden estates had fallen short, conveying to his uncle Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, sixteen formerly ecclesiastical villages including Pszczew, Łowyń, Zagórów, Kopojno and Wrąbczyn in full heritable ownership, subject only to a fixed sovereign canon and payments to the ecclesiastical foundations. Filed with it are a certified copy made for registration and a mortgage certificate for the town of Zagórów, showing no debts but a bar on sale to a native without consent.
oe1bu14525-023: A judicial valuation of the noble estate of Szetlewek in the Konin district, parish of Rzgow, belonging to the Prince of Hohenlohe-Ingelfingen, issued in provable form by the Kalisz government. It records the 1798 survey by Sprengel at 1,724 Morgen, graded arable, meadow, pasture, gardens, woods and ponds, the peasant holdings, mill, tavern and smithy, a lease to Ignatz von Radzinski to 1805, and a gross value of 34,803 Rthl, reduced to 31,171 Rthl 23 Groschen after deducting the lessee's inventory, with separate brewery, distillery and brickworks yields.
oe1bu14525-024: A badly damaged single-page note, largely illegible. What survives identifies it as a supplement or annex to an enclosed submission involving von Laski and one Melzer, dated 18 April 1803, and refers to outstanding matters arising from a hereditary-lease contract for Batkowo. Too fragmentary to establish the parties' claims, the sums involved or the outcome; useful only as evidence that such an enclosure once accompanied the file.
oe1bu14525-025: A mortgage certificate for the lordship of Pszczew or Pszczew with its villages, the bailiwick of Zielomyśl and Silna, the Hollander settlements and the Heidemühle, held by the Prince of Hohenlohe-Ingelfingen as confiscated church land of the Poznań Cathedral Chapter. It records a yearly maintenance allowance of 2,470 Rthl 16 Groschen 3 Pfennig to the former ecclesiastical holders, and secured debts of 48,000 Rthl and 5,000 Rthl to Building and Economy Councillor Johann Wilhelm Glenck, 2,000 Rthl to Abraham Moses Hirschel, and 5,000 Rthl each to Baron von der Marwitz and Christiane Dorothea Michaelis. Issued to Glenck.
oe1bu14525-026: Notifies the Prince of Hohenlohe-Ingelfingen that, on his petition of the previous month and the original papers attached to it, three debts of 5,000 Rthl each, owed to Baron von der Marwitz, to the wife of Senior District Councillor Michaelis and to Councillor of Economy Glenck, have been ordered entered in the mortgage book against the lordship of Pszczew, with a mortgage certificate acknowledging each creditor's claim to be collected from the government archive after four weeks.
oe1bu14525-027: A royal attestation, made out at the Prince's request from the Pszczew land and mortgage records, certifying that the Pszczew estates in the district of Międzyrzecz were conferred on the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen by a deed of donation of 10 June 1797 and a declaration of 1 December that year; that only the Treasury's resignation is still wanted to settle his title; that the estates formerly belonged to the bishopric of Poznań; and that he has registered no debts upon them.
oe1bu14525-028: 'A mortgage certificate for the noble estate of Batkowo in the Radziejewo district, held with Siedlemin in the Brześć district: formerly church property of the cathedral chapter at Wrocławek, confiscated in South Prussia and granted with noble rights to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen by a deed of 1 December 1797, his title entered by decree of 19 July 1802. Two perpetual burdens stand: an unquantified annual allowance to the chapter, and a ban on selling to native-born Poles without royal consent. No secured debts.'
oe1bu14525-029: Johann Wilhelm Glenck, Princely Hohenlohe Councillor of Building and Economy, reports to the King that he has done everything needed to produce the documents rectifying the title of possession to the Hohenlohe estates of Kopojno, Zagórów, Drzewce and others, as ordered on 18 November. He believes the obstacle that has held matters up is now removed, expects the command to be fully carried out within four weeks, and asks that any severe measures be withheld meanwhile.
oe1bu14525-030: 'A royal warning from the South Prussian government at Kalisz to Glenck, building and economy councillor to the Prince of Hohenlohe-Ingelfingen, at Wrocław: unless the mortgage affairs of the estate Swięcia and the estates belonging with it, Kopojno, Drzewce and Zagórów, are put in order within fourteen days, the Treasury will be obliged to proceed against his principal, the Prince. A single short page, signed Meuser.'
oe1bu14525-031: A royal rescript from the South Prussian government at Kalisz calls on the Prince of Hohenlohe-Ingelfingen, having bought the estate of Trąbczyn and its appurtenances from the Treasury, to have his title entered in the mortgage book. Within four weeks he is to produce a certified copy of the judgment awarding the whole property of Anton von Prusimski to the Treasury, with a court attestation that the judgment has taken legal effect.
oe1bu14525-032: A request from Schultz at Kalisz to the Supreme Government Board at Wrocław, following up an earlier requisition of 24 September, asking that Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, be required to perform his oath of homage for the granted estates at the earliest convenient date, and that the record made of the ceremony be sent back to Kalisz. A single short administrative note with no financial content.
oe1bu14525-033: Glenck, writing for the Prince of Hohenlohe-Ingelfingen, presses the Royal Chamber at Poznań to have the treasury resign its claim quickly over the whole of the princely estates in Cujavien and Pszczew. He recalls that the government at Poznań had itself demanded correction of the title of possession within fourteen days on pain of proceedings, and that the Prince then supplied the missing original deeds of donation. A draft of the same request to the government follows.
oe1bu14525-034: 'Replying to a representation of the 13th, the Royal South Prussian Government at Poznań informs Glenck, building and economy councillor to the Prince of Hohenlohe at Wrocław, of the state of the title transfers: the Treasury has already resigned Kolno and Kamionna, a term for resigning the Pszczew estates is set for 22 March, while for the Cujavian estates granted to the reigning Prince of Hohenlohe-Ingelfingen no resignation has yet been sought, and the title is to be put right promptly through an approved judicial commissary.'
oe1bu14525-035: Answering an application of the 13th, the Royal South Prussian War and Domains Chamber at Poznań tells Wilhelm Glenck, building and economy councillor to the Prince of Hohenlohe-Ingelfingen at Wrocław, that the chamber's fiscal officer Beyer has already been instructed to carry out the formal resignation by the Treasury of its claim to the Pszczew estates and those lying in Cujavia belonging to the Prince. A brief notice of authority given, with no further terms set out.
oe1bu14525-036: A petition to the King, on behalf of the Prince of Hohenlohe-Ingelfingen, pressing for the Treasury to resign title to the whole of the princely estates in Cujavia and Pszczew as quickly as possible. It recalls that a Royal Government at Poznań had earlier demanded that the title of possession to the Hohenlohe estates be put right as urgent, and that the Prince accordingly submitted the missing deeds of donation in the original. Signed by J. Wilhelm Glenck, princely Hohenlohe Councillor of Building and Economy.
oe1bu14525-037: A royal order from Friedrich Wilhelm, issued by the South Prussian Government at Poznań over Götz's signature, giving the Hohenlohe-Ingelfingen Building and Economy Councillor Glenck John a final fourteen days to carry out an earlier ordinance of 30 October and correct the title of possession of the lordship of Pszczew in the land and mortgage records in favour of the reigning Prince of Hohenlohe-Ingelfingen. A single page, chiefly a reminder to act.
oe1bu14525-038: Melzer reports from Poznań that the Chamber's fiscal officer again failed to appear at the hearing for the resignation of the Pszczew estates, having still received no authorisation, and that the business will not conclude until the Chamber instructs him plainly what he is to resign; he asks that the Prince press Chamber President von Harlem to expedite it. A postscript notes an appeal judgment in the case with the Cathedral Chapter and Kruhtswitz has been reversed in their favour.
oe1bu14525-039: Hoym reports that a Cabinet Order of the 23rd has granted the Prince of Hohenlohe-Ingelfingen, in heredity and full property, the town of Kamionna with the market town of Kulm, the villages of Trąbczyn, Szetlewek, Nowa wies, Łazy, Old and New Laske, Osiny, Hauland Trąbczyński and Brzyce; he is pressing the Feudal Department for the deed of donation and asking the Poznań government about debts charged on these estates, forfeited by a leading insurgent, von Prusimski. Yield is put at 4,000 Thalers yearly, and Chamber Councillor Peucker at Fraustadt is recommended as manager or, if wanted, to find a buyer.
oe1bu14525-040: 'A royal rescript to the chambers at Poznań and Petrikau, complaining that the handing over of the South Prussian estates granted to the Prince of Hohenlohe-Ingelfingen was a superficial ceremony: persons holding pledge or lease contracts, some proven false, have been left in possession without proof of any real right. The chambers are to examine and settle such claims quickly, settle disputes amicably or through the fiscal officers, put the Prince''s agents in free possession, and fix and report the clergy''s competence monies.'
oe1bu14525-041: Hoym reassures the Prince of Hohenlohe-Ingelfingen that his South Prussian estates are being handed over, blaming a misunderstanding, and encloses dispositions sent by express courier to the Poznań and Petrikau chambers ordering the quickest possible transfer. He explains that the clergy have held the estates for the Treasury since 1 June 1796, may manage them only until Midsummer 1798, and that valuation assessments, not the surveys, now fix their maintenance allowances; existing leases should be tolerated to that term rather than risk compensation claims. Wieniec and Wolica are left to the Bishop of Cujavia.
oe1bu14525-042: A royal order from the South Prussian Government at Kalisz requires the Prince of Hohenlohe-Ingelfingen, within four weeks, to produce a certified copy of the confiscation judgment against Anton von Prusimski, together with an attestation that it has force of law, so that his title of possession to the estate of Szetlewek can be fully put in order. Signed for the government by Meuser, with Lucas noted.
oe1bu14525-043: 'A royal reply to the Prince of Hohenlohe-Ingelfingen, who had asked for a certified copy of the judgment confiscating von Prusimski''s property, attested as having force of law, so that he could put in order his title to the Trąbczyn estates granted to him. The petition is refused as misdirected: the judgment was drawn up not before the government at Poznań but before that at Thorn, and he must apply there. His original enclosure is returned.'
oe1bu14525-044: 'A royal reply to a petition of 31 January by the Prince of Hohenlohe-Ingelfingen, who had asked for a certified copy of the sentence confiscating von Prusimski''s property, with attestation that it had taken legal force, so as to settle his title to the Trąbczyn estates granted to him. The request is refused as misdirected: the sentence was drawn up not by the government at Poznań but by that at Thorn, to which he must apply. The original enclosure is returned.'
oe1bu14526-001: A covering note sending on the long-missing Witów files, with an urgent request that the recipient speak in person to the criminal-court councillor in Grimm about the matter. The writer explains that the papers had been searched for in vain in the registry at Trąbczyn, where he himself believed them to be, and only came to light on his move from his Wrocław lodgings to Wilhelmsruh, among his wife's belongings, she having received them in his absence and forgotten to pass them on.
oe1bu14526-002: 'Preliminary terms of sale, in eleven points, of the noble estate of Witów in the Warta district, sold by Forest Inspector Rochlitz for the Prince of Hohenlohe-Ingelfingen to Martin Honrichs and Valentin v. Kwasieborski for 16,000 Rthl in three instalments: no warranty for 1,016 składy of arable claimed by the burgesses of Warta, a fallback one-year lease at 800 Rthl if royal consent fails, and a 1,000 Rthl penalty. Filed with it, the Prince cedes 8,000 Rthl of the purchase money to the Wrocław banker Carl Ferdinand Weigel.'
oe1bu14526-003: Confirms and puts on record a sale, made at Birnbaum in June 1797, of the free village mayor's holding at Dormowe near Birnbaum by Joseph von Jankowski of Ninino to Captain and district tax collector Andreas Ernst Gneust for 2,000 Rthl. cash, with buildings, fields, meadows, fisheries, implements and sowing. Eleven clauses set the annual dues to the Pszczew manor, rights to graze 250 sheep, to brew for household use, and to free firewood and building timber. The purchaser bears all costs; Prince Friedrich Ludwig confirms, reserving examination of his entitlements against the old land registers. The deed was read to Jankowski in Polish by a sworn interpreter.
oe1bu14526-004: 'A purchase contract selling the Kolno and Kamionna (Kamionna) estates in the Międzyrzecz district, granted to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, by Friedrich Wilhelm II in 1796, to the Frankfurt an der Oder bank director George Conrad Leixner for 142,000 Rthl, already paid: 53,139 Rthl to the creditor in possession von Broniewsky and 88,860 Rthl in cash. Sold without valuation; the buyer takes over two church capitals, clears a 100,000 Rthl mortgage, and assumes a disputed timber right in the Krobilaw forests against von Kwilecki.'
oe1bu14526-005: Sells the estates Kollno and Kamionna, with mills, forests, lakes, rents, brewing and distilling rights, labour services, hunt and jurisdiction, to bank cashier George Conrad Leixner of Frankfurt an der Oder for 142,000 Rthl, in Pausch und Bogen without valuation. Payment runs 76,000 Rthl already made to Bernhardi, 53,139 Rthl to cavalry captain von Broniewsky under a settlement returning the estates, and a final 12,860 Rthl at handover. Leixner takes over church rents and taxes and intends to break the estates up.
oe1bu14526-006: 'A hereditary-lease contract granting the farmer Blazy Kukulski one Hufe of arable land, Magdeburg measure, near the estate of Osiny, made before the Hohenlohe patrimonial court by Councillor of War and Forests von Triebenfeld for the Prince of Hohenlohe-Ingelfingen: 100 Rthl purchase money already paid, 30 Rthl yearly rent from Christmas 1806, public dues, milling and drink obligations on the lessee, freedom from labour service, and the lordship''s pre-emption and tenth-Groschen transfer fee. Filed with it is Triebenfeld''s 1805 general power of attorney for Zagórów, Witów and Trąbczyn.'
oe1bu14526-007: 'A hereditary-lease contract, opening in Polish, by which the Prince of Hohenlohe-Ingelfingen, through his general authorised representative, Councillor of War and Forests von Triebenfeld, grants Gottlieb Sarre, a Hollander farmer from the Peyserschen Hauland, 1 1/2 Hufen of waste forest land near Trąbczyn in perpetuity: 150 Rthl entry money already paid, 45 Rthl annual rent in half-yearly instalments, three rent-free years to Midsummer 1809, half the rent redeemable, and binding terms on building timber, drink from the lordship''s brewery, milling, transfer fees and forfeiture for arrears.'
oe1bu14526-008: 'A hereditary-lease contract in sixteen paragraphs granting Christian Friedenberger of Szymanowicer Hauland one Hufe Magdeburg measure in the Trąbczyn forest in perpetuity for 100 Rthl paid, with an annual rent of 30 Rthl, three rent-free years on unbroken ground, half the rent redeemable at 100 Rthl per 5 Rthl abated, milling and drink compulsion, no building timber, and a tenth-Groschen transfer fee on sale. Filed with it: the Prince''s general power of attorney for von Triebenfeld, and royal consent to dismembering the Zagórów and Trąbczyn lordships.'
oe1bu14526-009: 'A six-year lease of the demesne farm of Kopojno, from Midsummer 1805 to Midsummer 1811, made before the Hohenlohe patrimonial court at Trąbczyn between the Prince of Hohenlohe-Ingelfingen, through his general authorised representative the Councillor of War and Forests von Triebenfeld, and Maciey von Niedzwiedzki: 1,500 Rthl a year, payable in advance, in Pausch und Bogen without valuation, brewery, distillery and mill rents excluded, with terms on labour services, firewood, repairs and crop rotation. A supplement adds 13 Hufen at 625 Rthl, raising the rent to 2,125 Rthl.'
oe1bu14526-010: A hereditary quit-rent contract made before the Hohenlohe patrimonial court at Trąbczyn granting building inspector Johann Wilhelm Wollenhaupt 18 Hufen of arable at the Drzewce demesne farm and 2 Hufen of meadow near Wrąbczyn, with dwelling house and brewhouse, for 6,000 Rthl and 300 Rthl yearly rent, on condition he divide the land into ten peasant holdings. Filed with it is its cancellation three months later, von Triebenfeld paying Wollenhaupt 600 Rthl in full settlement of all claims from his service, with Wollenhaupt to quit the Drzewce house by Michaelmas.
oe1bu14526-011: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn between Councillor of War and Forests von Triebenfeld, general attorney for the Prince of Hohenlohe-Ingelfingen, and Johann Seymert, dyer and town councilman of Zagórów, granting him in perpetuity 3 Hufen of the Trąbczyn demesne, 2 Hufen 24 Morgen arable and 6 Morgen meadow, for 900 Rthl down and 45 Rthl yearly rent. Twelve clauses cover taxes, compulsory purchase of manorial drink, building at his own cost, a tenth-Groschen transfer fee on sale, and forfeiture after two years' arrears.
oe1bu14526-012: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn, by which the Prince of Hohenlohe-Ingelfingen, through his attorney Councillor von Triebenfeld, grants the forester George Friedrich Kammer of Pietrzykowo 6 Hufen 20 Morgen from the Przybysław demesne farm with its buildings and timber, for 2,100 Rthl payable in two instalments and a fixed yearly rent of 100 Rthl. Kammer bears all royal taxes and dues to Ląd monastery, must buy drink from the manorial tavern, and forfeits the holding if two years in arrears.
oe1bu14526-013: A hereditary-lease contract in nineteen clauses by which von Triebenfeld, general attorney of the Prince of Hohenlohe-Ingelfingen, makes over 20 Magdeburg Hufen of Trąbczyn field and meadow on the Kopojno side to district administrator Johann Gottlieb Tschachmann for 6,000 Rthl, 200 Rthl paid down and 5,800 Rthl due that June, plus an irredeemable yearly rent of 15 Rthl per Hufe. Tschachmann may resell in parcels; takers owe a tenth-Groschen transfer fee, must buy drink from the lordship, get no pasture or timber, and forfeit for two years' arrears.
oe1bu14526-014: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn between Councillor of War and Forests von Triebenfeld, acting for the Prince of Hohenlohe-Ingelfingen, and the princely forest inspector Carl Titz, granting Titz five Hufen Magdeburg measure of the Trąbczyn demesne arable, from the Podbiele road to the mill ditch, with the orchard by the stables. Purchase money 1,500 Rthl in two instalments, plus 75 Rthl yearly quit-rent, royal taxes, dues to Ląd monastery, compulsory lordship beer and brandy, and a tenth-Groschen fee on sale.
oe1bu14526-015: A hereditary-lease contract in 22 articles by which von Triebenfeld, general attorney of the Prince of Hohenlohe-Ingelfingen, makes over 270 Magdeburg Hufen of field, meadow and woodland at Trąbczyn, Łazy, Osiny, Neudorff and Przybisław to named settlers at 300 Rthl purchase money and an irredeemable rent of 15 Rthl per Hufe, with four free years on woodland, a tenth-penny transfer fee on resale, compulsory purchase of drink from the manorial tavern and joint liability. A closing note deducts 156 Hufen already parcelled out.
oe1bu14526-016: An eighteen-paragraph hereditary-lease contract made before the Hohenlohe patrimonial court at Trąbczyn, granting the demesne farm Althütte, 10 Hufen 10 Morgen Magdeburg measure, to six settlers, Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Damt and Christoph Schoenfisch, for 150 Rthl purchase money per Hufe, 1,500 Rthl in all, and 225 Rthl yearly rent. Terms cover free years on land still to be cleared, joint liability, a tenth-Groschen transfer fee, compulsory manorial drink, and cancellation of an earlier contract of 26 May.
oe1bu14526-017: 'A seventeen-clause contract by which Kunkel, acting for the Prince of Hohenlohe-Ingelfingen, sells ten Hufen and ten Morgen of the Alte Hütte demesne farm at Trąbczyn, with buildings but not the cow-byre, to six Hollander settlers led by Martin Giering, to be split into six equal indivisible holdings: 250 Rthl a Hufe, 2,500 Rthl in all, paid in instalments to March 1805, plus yearly hereditary rent, 10 per cent transfer fee on sales, forest wood and pasture rights, brick from the Trąbczyn works, and compulsory purchase of drink from the lordship.'
oe1bu14526-018: 'A hereditary-lease and sale of the whole lordship of Pszczew by Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, to the burgesses of Pszczew and the villages of Stołuń, Kuligowo, Szarcz, Stoki, Schwichodzyn and Łowyń, negotiated by his attorney Johann Wilhelm Glenck with the representatives Matheus Młynkiewicz and Jan Chmara: 180,000 Rthl plus 1,000 Rthl yearly ground-rent, largely met by taking over 137,000 Rthl of mortgage debts. Jurisdiction, hunt, transfer fee and forest oversight are reserved. A Polish interpreter was used; royal approval of 1806 follows.'
oe1bu14526-019: A hereditary-lease and purchase contract of 28-29 July 1804 by which Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, makes over the whole lordship of Pszczew, demesne farms, forests, lakes, brewing and distilling rights and the Obra farm, to the burgesses of Pszczew and the villages of Stołuń, Kuligowo, Szarcz, Stoki, Świechocin and Łowyń for 180,000 Rthl plus 1,000 Rthl yearly ground-rent, 137,000 Rthl of it by taking over mortgage debts. Jurisdiction, hunt, 10 per cent transfer fees and the castle are reserved; pending lawsuits pass to the communities. Negotiated through attorneys Glenck, Młynkiewicz and Chmara with an interpreter.
oe1bu14526-020: A grant by Friedrich Ludwig, Prince of Hohenlohe, of the manorial dwelling house at Swięcia to Friedrich Götzinger, innkeeper at Poznań, in full heritable ownership. The house had been expressly excepted from a hereditary lease of the Swięcia demesne farm buildings, fields, meadows and woodlands made the same day to Götzinger with Johann Christian Birlack of Zilenzig, Johan Götzinger and Joh. Siebert. It is given for Götzinger's trouble and travel in arranging the lease, and because he can use it as a tap-house under the brewery lease he has taken on.
oe1bu14526-021: Heads of agreement in twelve paragraphs by which von Triebenfeld, as general attorney for the Prince of Hohenlohe-Ingelfingen, sells the Witów estate in the Warta district outright to Franz Meierowitz with all appurtenances, in Pausch und Bogen and without warranty, for 20,000 Rthl (8,000 at St George's Day, 12,000 at Midsummer) plus a perpetual yearly canon of 500 Rthl, redeemable for 10,000 Rthl. Completion awaits annulment of an earlier sale to Honrichs, held incapable of possession and insolvent; a widowed Colonel von Schliesen's 6,000 Rthl may stand at priority, and Meierowitz must obtain royal concession to hold noble estates at his own cost.
oe1bu14526-022: A covering rescript from the Royal South Prussian Government at Poznań to the reigning Prince of Hohenlohe-Ingelfingen, sending him an official copy of the purchase contract for the estates of Kolno and Kamionna made with the bank cashier Leixner, confirmed that same day. A single page in the usual royal courtesies, with no detail of the sale terms beyond the naming of the buyer and the two estates.
oe1bu14526-023: 'A royal confirmation of a ten-paragraph contract by which Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, sold Kolno and Kamionna (Kamionna) in the Poznań district, granted to him in 1796, to bank director George Conrad Leixner for 142,000 Rthl., sold in Pausch und Bogen: 53,139 Rthl. went to the possessing creditor von Broniewski, the rest in cash, with two church capitals taken over, a 100,000 Rthl. mortgage ceded by von Triebenfeld to be cancelled, and a disputed timber right in the Krabielew woods passing unwarranted. Filed with it are Leixner''s powers of attorney to Guderian and their notarial attestations.'
oe1bu14526-024: 'Refuses the Prince of Hohenlohe-Ingelfingen permission to let the lordship of Pszczew in hereditary lease to the burgesses and rural residents, returning his submitted hereditary-lease contract. Three grounds are given: other landed lordships would follow suit and shrink the province''s noble estates; the Pszczew forest, the only substantial one in the district, would be devastated once lessees had free use of it; and the residents already hold enough land, lack the means, and the burgesses should pursue urban trades instead.'
oe1bu14526-025: A sale of the demesne farm of Szetlewek near Trąbczyn, 1,000 Morgen Magdeburg measure (arable, meadow, garden, land to be cleared and woodland) with its manor house, barns, stables and granary, by Johann Wilhelm Glenck for the Prince of Hohenlohe-Ingelfingen to the miller Samuel Lucke for 12,333 Rthl, 8,333 to the pledge-holder von Radzinsky, plus 500 Rthl yearly ground rent. Brewhouse, distillery and brewing and distilling rights follow for 400 a year; building timber is granted; villagers' labour services are withheld. Lucke, buying with associates, reserves four weeks to obtain their signatures.
oe1bu14526-026: 'Police burgomaster Nüchler of Pyzdry, the miller Luka of Białobrzeg and the marksman Reise of Wrąbczynek cancel their contract of 20 November 1798 with Glencke, the Prince of Hohenlohe''s building and economy councillor, to recruit settlers and pay the purchase money for parcelling out Szetlewek in the Trąbczyn estates: von Brzezinski, holding it in mortgage tenure, has obstructed clearance. They ask 200 Rthl for travel costs, which Glencke offers subject to the Prince''s approval, and settlers who paid earnest-money must look to the lordship.'
oe1bu14526-027: Titz and Bancke report to a Councillor of Building and Economy that the miller Luka has given up the contract and will settle details at Kalisz, having received 25 Rthl. Two more men seeking land were put off until matters with Trąbczyn and von Szucki are closed. They ask that the Royal Government be told of von Szucki's withdrawal-payment, and that the Prince add to the 1,000 Rthl the community offers, since the offer is inflaming von Szucki's harassment of the subjects; they request instructions.
oe1bu14526-028: Glenck reports to criminal-court councillor Grimm at Kalisz that his contract with von Radzinski is annulled, enclosing the correspondence. The three contracting parties Luck, Kriede and Nüchler refuse to withdraw, having already produced 18 farmers who have lodged pledges for nearly two thirds of the fields; Griese offers surety of 2,000 Rthl, to be secured at Pyzdry. Damages claimed should be charged to von Radzinski. A map is ready in the Slugozin meadow dispute, and the Trąbczyn Hollanders' privilege may cover only the first possessors and their descendants.
oe1bu14526-029: A court office at Pszczew notifies the Prince of Hohenlohe-Ingelfingen that Sigismund von Rzadkowski has sold his hereditary quit-rent holding at Głażewo to his half-sister Susanna, née Treben, enclosing a copy of the sale deed of 28 September and its papers. The contract has been approved subject to the princely rights, and the Prince is asked to declare within a set number of weeks whether he will exercise his right of pre-emption; silence will count as waiving it.
oe1bu14526-030: A 1766 privilege of Theodor, Prince Czartoryski, Bishop of Poznań, granted at Dolsk and approved by the cathedral chapter in 1767, selling Simeon and Apollonia Rządkowski and their heirs a waste Hufe of arable at Głażewo in the Pszczew key, with a manor-built house and barn, for 30 ducats, against 130 Polish gulden yearly in two instalments, poll-tax and winter money, four days of labour service and clearing of the Obsko meadow, with beer from the Pszczew brewhouse. Given in German, in the Latin and Polish original extracted from the chapter archive, and with a sworn translator's certificate.

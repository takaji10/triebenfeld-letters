oe1bu14526-001: A covering note sending on the long-missing Witów files, with an urgent request that the recipient speak in person to the criminal-court councillor in Grimm about the matter. The writer explains that the papers had been searched for in vain in the registry at Trąbczyn, where he himself believed them to be, and only came to light on his move from his Breslau lodgings to Wilhelmsruh, among his wife's belongings, she having received them in his absence and forgotten to pass them on.
oe1bu14526-002: 'Preliminary terms of sale, in eleven points, of the noble estate of Witów in the Warta district, sold by Forest Inspector Rochlitz for the Prince of Hohenlohe-Ingelfingen to Martin Honrichs and Valentin v. Kwasieborski for 16,000 Rthl in three instalments: no warranty for 1,016 składy of arable claimed by the burgesses of Warta, a fallback one-year lease at 800 Rthl if royal consent fails, and a 1,000 Rthl penalty. Filed with it, the Prince cedes 8,000 Rthl of the purchase money to the Breslau banker Carl Ferdinand Weigel.'
oe1bu14526-003: Confirms and puts on record a sale, made at Birnbaum in June 1797, of the free village mayor's holding at Dormowe near Birnbaum by Joseph von Jankowski of Ninino to Captain and district tax collector Andreas Ernst Gneust for 2,000 Rthl. cash, with buildings, fields, meadows, fisheries, implements and sowing. Eleven clauses set the annual dues to the Betsche manor, rights to graze 250 sheep, to brew for household use, and to free firewood and building timber. The purchaser bears all costs; Prince Friedrich Ludwig confirms, reserving examination of his entitlements against the old land registers. The deed was read to Jankowski in Polish by a sworn interpreter.
oe1bu14526-004: 'A purchase contract selling the Kolno and Kaemen (Kamionna) estates in the Meseritz district, granted to Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, by Friedrich Wilhelm II in 1796, to the Frankfurt an der Oder bank director George Conrad Leixner for 142,000 Rthl, already paid: 53,139 Rthl to the creditor in possession von Broniewsky and 88,860 Rthl in cash. Sold without valuation; the buyer takes over two church capitals, clears a 100,000 Rthl mortgage, and assumes a disputed timber right in the Krobilaw forests against von Kwilecki.'
oe1bu14526-005: Sells the estates Kollno and Kamionne, with mills, forests, lakes, rents, brewing and distilling rights, labour services, hunt and jurisdiction, to bank cashier George Conrad Leixner of Frankfurt an der Oder for 142,000 Rthl, in Pausch und Bogen without valuation. Payment runs 76,000 Rthl already made to Bernhardi, 53,139 Rthl to cavalry captain von Broniewsky under a settlement returning the estates, and a final 12,860 Rthl at handover. Leixner takes over church rents and taxes and intends to break the estates up.
oe1bu14526-006: 'A hereditary-lease contract granting the farmer Blazy Kukulski one Hufe of arable land, Magdeburg measure, near the estate of Osiny, made before the Hohenlohe patrimonial court by Councillor of War and Forests von Triebenfeld for the Prince of Hohenlohe-Ingelfingen: 100 Rthl purchase money already paid, 30 Rthl yearly rent from Christmas 1806, public dues, milling and drink obligations on the lessee, freedom from labour service, and the lordship''s pre-emption and tenth-Groschen transfer fee. Filed with it is Triebenfeld''s 1805 general power of attorney for Zagorowo, Witów and Trąbczyn.'
oe1bu14526-007: 'A hereditary-lease contract, opening in Polish, by which the Prince of Hohenlohe-Ingelfingen, through his general authorised representative, Councillor of War and Forests von Triebenfeld, grants Gottlieb Sarre, a Hollander farmer from the Peyserschen Hauland, 1 1/2 Hufen of waste forest land near Trąbczyn in perpetuity: 150 Rthl entry money already paid, 45 Rthl annual rent in half-yearly instalments, three rent-free years to Midsummer 1809, half the rent redeemable, and binding terms on building timber, drink from the lordship''s brewery, milling, transfer fees and forfeiture for arrears.'
oe1bu14526-008: 'A hereditary-lease contract in sixteen paragraphs granting Christian Friedenberger of Szymanowicer Hauland one Hufe Magdeburg measure in the Trąbczyn forest in perpetuity for 100 Rthl paid, with an annual rent of 30 Rthl, three rent-free years on unbroken ground, half the rent redeemable at 100 Rthl per 5 Rthl abated, milling and drink compulsion, no building timber, and a tenth-Groschen transfer fee on sale. Filed with it: the Prince''s general power of attorney for von Triebenfeld, and royal consent to dismembering the Zagorowo and Trąbczyn lordships.'
oe1bu14526-009: 'A six-year lease of the demesne farm of Kopojno, from Midsummer 1805 to Midsummer 1811, made before the Hohenlohe patrimonial court at Trąbczyn between the Prince of Hohenlohe-Ingelfingen, through his general authorised representative the Councillor of War and Forests von Triebenfeld, and Maciey von Niedzwiedzki: 1,500 Rthl a year, payable in advance, in Pausch und Bogen without valuation, brewery, distillery and mill rents excluded, with terms on labour services, firewood, repairs and crop rotation. A supplement adds 13 Hufen at 625 Rthl, raising the rent to 2,125 Rthl.'
oe1bu14526-010: A hereditary quit-rent contract made before the Hohenlohe patrimonial court at Trąbczyn granting building inspector Johann Wilhelm Wollenhaupt 18 Hufen of arable at the Drzewce demesne farm and 2 Hufen of meadow near Wrąbczyn, with dwelling house and brewhouse, for 6,000 Rthl and 300 Rthl yearly rent, on condition he divide the land into ten peasant holdings. Filed with it is its cancellation three months later, von Triebenfeld paying Wollenhaupt 600 Rthl in full settlement of all claims from his service, with Wollenhaupt to quit the Drzewce house by Michaelmas.
oe1bu14526-011: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn between Councillor of War and Forests von Triebenfeld, general attorney for the Prince of Hohenlohe-Ingelfingen, and Johann Seymert, dyer and town councilman of Zagorowo, granting him in perpetuity 3 Hufen of the Trąbczyn demesne, 2 Hufen 24 Morgen arable and 6 Morgen meadow, for 900 Rthl down and 45 Rthl yearly rent. Twelve clauses cover taxes, compulsory purchase of manorial drink, building at his own cost, a tenth-Groschen transfer fee on sale, and forfeiture after two years' arrears.
oe1bu14526-012: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn, by which the Prince of Hohenlohe-Ingelfingen, through his attorney Councillor von Triebenfeld, grants the forester George Friedrich Kammer of Pietrzykowo 6 Hufen 20 Morgen from the Przybysław demesne farm with its buildings and timber, for 2,100 Rthl payable in two instalments and a fixed yearly rent of 100 Rthl. Kammer bears all royal taxes and dues to Ląd monastery, must buy drink from the manorial tavern, and forfeits the holding if two years in arrears.
oe1bu14526-013: A hereditary-lease contract in nineteen clauses by which von Triebenfeld, general attorney of the Prince of Hohenlohe-Ingelfingen, makes over 20 Magdeburg Hufen of Trąbczyn field and meadow on the Kopojno side to district administrator Johann Gottlieb Tschachmann for 6,000 Rthl, 200 Rthl paid down and 5,800 Rthl due that June, plus an irredeemable yearly rent of 15 Rthl per Hufe. Tschachmann may resell in parcels; takers owe a tenth-Groschen transfer fee, must buy drink from the lordship, get no pasture or timber, and forfeit for two years' arrears.
oe1bu14526-014: A hereditary quit-rent contract made before the patrimonial court at Trąbczyn between Councillor of War and Forests von Triebenfeld, acting for the Prince of Hohenlohe-Ingelfingen, and the princely forest inspector Carl Titz, granting Titz five Hufen Magdeburg measure of the Trąbczyn demesne arable, from the Podbiele road to the mill ditch, with the orchard by the stables. Purchase money 1,500 Rthl in two instalments, plus 75 Rthl yearly quit-rent, royal taxes, dues to Ląd monastery, compulsory lordship beer and brandy, and a tenth-Groschen fee on sale.
oe1bu14526-015: A hereditary-lease contract in 22 articles by which von Triebenfeld, general attorney of the Prince of Hohenlohe-Ingelfingen, makes over 270 Magdeburg Hufen of field, meadow and woodland at Trąbczyn, Łazy, Osiny, Neudorff and Przybisław to named settlers at 300 Rthl purchase money and an irredeemable rent of 15 Rthl per Hufe, with four free years on woodland, a tenth-penny transfer fee on resale, compulsory purchase of drink from the manorial tavern and joint liability. A closing note deducts 156 Hufen already parcelled out.
oe1bu14526-016: An eighteen-paragraph hereditary-lease contract made before the Hohenlohe patrimonial court at Trąbczyn, granting the demesne farm Althütte, 10 Hufen 10 Morgen Magdeburg measure, to six settlers, Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Damt and Christoph Schoenfisch, for 150 Rthl purchase money per Hufe, 1,500 Rthl in all, and 225 Rthl yearly rent. Terms cover free years on land still to be cleared, joint liability, a tenth-Groschen transfer fee, compulsory manorial drink, and cancellation of an earlier contract of 26 May.
oe1bu14526-017: 'A seventeen-clause contract by which Kunkel, acting for the Prince of Hohenlohe-Ingelfingen, sells ten Hufen and ten Morgen of the Alte Hütte demesne farm at Trąbczyn, with buildings but not the cow-byre, to six Hollander settlers led by Martin Giering, to be split into six equal indivisible holdings: 250 Rthl a Hufe, 2,500 Rthl in all, paid in instalments to March 1805, plus yearly hereditary rent, 10 per cent transfer fee on sales, forest wood and pasture rights, brick from the Trąbczyn works, and compulsory purchase of drink from the lordship.'
oe1bu14526-018: 'A hereditary-lease and sale of the whole lordship of Betsche by Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, to the burgesses of Betsche and the villages of Stalluhn, Kulligowo, Schartzig, Stocki, Schwichodzyn and Lowin, negotiated by his attorney Johann Wilhelm Glenck with the representatives Matheus Młynkiewicz and Jan Chmara: 180,000 Rthl plus 1,000 Rthl yearly ground-rent, largely met by taking over 137,000 Rthl of mortgage debts. Jurisdiction, hunt, transfer fee and forest oversight are reserved. A Polish interpreter was used; royal approval of 1806 follows.'
oe1bu14526-019: A hereditary-lease and purchase contract of 28-29 July 1804 by which Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, makes over the whole lordship of Betsche, demesne farms, forests, lakes, brewing and distilling rights and the Obra farm, to the burgesses of Betsche and the villages of Stalluhn, Kulligowo, Schartzig, Stocki, Schwiechodezin and Lowin for 180,000 Rthl plus 1,000 Rthl yearly ground-rent, 137,000 Rthl of it by taking over mortgage debts. Jurisdiction, hunt, 10 per cent transfer fees and the castle are reserved; pending lawsuits pass to the communities. Negotiated through attorneys Glenck, Młynkiewicz and Chmara with an interpreter.
oe1bu14526-020: A grant by Friedrich Ludwig, Prince of Hohenlohe, of the manorial dwelling house at Swięcia to Friedrich Götzinger, innkeeper at Posen, in full heritable ownership. The house had been expressly excepted from a hereditary lease of the Swięcia demesne farm buildings, fields, meadows and woodlands made the same day to Götzinger with Johann Christian Birlack of Zilenzig, Johan Götzinger and Joh. Siebert. It is given for Götzinger's trouble and travel in arranging the lease, and because he can use it as a tap-house under the brewery lease he has taken on.
oe1bu14526-021: Heads of agreement in twelve paragraphs by which von Triebenfeld, as general attorney for the Prince of Hohenlohe-Ingelfingen, sells the Witów estate in the Warta district outright to Franz Meierowitz with all appurtenances, in Pausch und Bogen and without warranty, for 20,000 Rthl (8,000 at St George's Day, 12,000 at Midsummer) plus a perpetual yearly canon of 500 Rthl, redeemable for 10,000 Rthl. Completion awaits annulment of an earlier sale to Honrichs, held incapable of possession and insolvent; a widowed Colonel von Schliesen's 6,000 Rthl may stand at priority, and Meierowitz must obtain royal concession to hold noble estates at his own cost.
oe1bu14526-022: A covering rescript from the Royal South Prussian Government at Posen to the reigning Prince of Hohenlohe-Ingelfingen, sending him an official copy of the purchase contract for the estates of Kolno and Kaemen made with the bank cashier Leixner, confirmed that same day. A single page in the usual royal courtesies, with no detail of the sale terms beyond the naming of the buyer and the two estates.
oe1bu14526-023: 'A royal confirmation of a ten-paragraph contract by which Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, sold Kolno and Kaemen (Kamionna) in the Posen district, granted to him in 1796, to bank director George Conrad Leixner for 142,000 Rthl., sold in Pausch und Bogen: 53,139 Rthl. went to the possessing creditor von Broniewski, the rest in cash, with two church capitals taken over, a 100,000 Rthl. mortgage ceded by von Triebenfeld to be cancelled, and a disputed timber right in the Krabielew woods passing unwarranted. Filed with it are Leixner''s powers of attorney to Guderian and their notarial attestations.'
oe1bu14526-024: 'Refuses the Prince of Hohenlohe-Ingelfingen permission to let the lordship of Betsche in hereditary lease to the burgesses and rural residents, returning his submitted hereditary-lease contract. Three grounds are given: other landed lordships would follow suit and shrink the province''s noble estates; the Betsche forest, the only substantial one in the district, would be devastated once lessees had free use of it; and the residents already hold enough land, lack the means, and the burgesses should pursue urban trades instead.'
oe1bu14526-025: A sale of the demesne farm of Szetlewek near Trąbczyn, 1,000 Morgen Magdeburg measure (arable, meadow, garden, land to be cleared and woodland) with its manor house, barns, stables and granary, by Johann Wilhelm Glenck for the Prince of Hohenlohe-Ingelfingen to the miller Samuel Lucke for 12,333 Rthl, 8,333 to the pledge-holder von Radzinsky, plus 500 Rthl yearly ground rent. Brewhouse, distillery and brewing and distilling rights follow for 400 a year; building timber is granted; villagers' labour services are withheld. Lucke, buying with associates, reserves four weeks to obtain their signatures.
oe1bu14526-026: 'Police burgomaster Nüchler of Pyzdry, the miller Luka of Białobrzeg and the marksman Reise of Wrąbczynek cancel their contract of 20 November 1798 with Glencke, the Prince of Hohenlohe''s building and economy councillor, to recruit settlers and pay the purchase money for parcelling out Szetlewek in the Trąbczyn estates: von Brzezinski, holding it in mortgage tenure, has obstructed clearance. They ask 200 Rthl for travel costs, which Glencke offers subject to the Prince''s approval, and settlers who paid earnest-money must look to the lordship.'
oe1bu14526-027: Titz and Bancke report to a Councillor of Building and Economy that the miller Luka has given up the contract and will settle details at Kalisz, having received 25 Rthl. Two more men seeking land were put off until matters with Trąbczyn and von Szucki are closed. They ask that the Royal Government be told of von Szucki's withdrawal-payment, and that the Prince add to the 1,000 Rthl the community offers, since the offer is inflaming von Szucki's harassment of the subjects; they request instructions.
oe1bu14526-028: Glenck reports to criminal-court councillor Grimm at Kalisz that his contract with von Radozimski is annulled, enclosing the correspondence. The three contracting parties Luck, Kriede and Nüchler refuse to withdraw, having already produced 18 farmers who have lodged pledges for nearly two thirds of the fields; Griese offers surety of 2,000 Rthl, to be secured at Pyzdry. Damages claimed should be charged to von Radozimski. A map is ready in the Slugozin meadow dispute, and the Trąbczyn Hollanders' privilege may cover only the first possessors and their descendants.
oe1bu14526-029: A court office at Betsche notifies the Prince of Hohenlohe-Ingelfingen that Sigismund von Rzadkowski has sold his hereditary quit-rent holding at Głazewo to his half-sister Susanna, née Treben, enclosing a copy of the sale deed of 28 September and its papers. The contract has been approved subject to the princely rights, and the Prince is asked to declare within a set number of weeks whether he will exercise his right of pre-emption; silence will count as waiving it.
oe1bu14526-030: A 1766 privilege of Theodor, Prince Czartoryski, Bishop of Posen, granted at Dolsk and approved by the cathedral chapter in 1767, selling Simeon and Apollonia Rządkowski and their heirs a waste Hufe of arable at Głazewo in the Betsche key, with a manor-built house and barn, for 30 ducats, against 130 Polish gulden yearly in two instalments, poll-tax and winter money, four days of labour service and clearing of the Obsko meadow, with beer from the Betsche brewhouse. Given in German, in the Latin and Polish original extracted from the chapter archive, and with a sworn translator's certificate.
oe1bu9454-001: 'Written amid rumours that Austria, Russia and Prussia have settled the Saxon and Polish questions, this appeal urges Triebenfeld to press Prince Hardenberg before the Congress closes: the sole request is a royal advance of 112,000 Rthl and immediate state administration of the entailed estates, which would let the attorney Kurz surrender the receipted debt instrument and end Cosmar''s execution, supported by a favourable Brieg High Provincial Court report. Also asks that the Emperor order Trąbczyn and Kaemen restored, with revenues repaid by Mrs Moszynska.'
oe1bu9454-001a: 'Forwards a just-received letter from another, hard-pressed Prince of Hohenlohe and pleads for an advance of 112,000 Rthl to relieve him: it would satisfy the Courland heirs at once, end Cosmar''s hold on the entailed estates (which he had forced himself into alone), free His Majesty from the entanglement, repay the advance before long from the estates'' funds and pay creditors by degrees. Asks whether to submit the deeds and papers for the Trąbczyn estates in the Konin district.'
oe1bu9454-002: 'A distraught report from the Congress that seven earlier letters have gone unanswered, with desperate repeated pleas for 200 ducats: 100 Rthl are owed to the State Chancellor and 70 Rthl to Barben, and Triebenfeld says he is going hungry and losing credit. He reports Stägemann, Hardenberg and Humboldt favourable, money and an administrator expected, Kalisz and Saxony feared lost, Wellington''s arrival, and Count Pourt''s wish to buy though only 150 Rthl cash is available. He urges Prince August to revoke Cosmar''s power of attorney publicly.'
oe1bu9454-003: 'A desperate plea for money: Triebenfeld has had only 932 Rthl in five months against the 1400 Rthl he reckoned for four weeks, is 170 Rthl in debt to the Prince and to Barben, cannot even find 12 fl. for a hired coach, and threatens to leave in secret. He wants 200 ff at once, reports planned calls on Minister Nesselrode and Privy Councillor Schröder over the Polish matter, and advises sending a separate memorandum naming a loyal, solvent, economically and ironworks-trained administrator for the entailed estates on the King''s account, not one of the old servants.'
oe1bu9454-004: 'News from Vienna of Napoleon''s return: Grenoble and Lyon taken, some 30,000 men under arms, Soult and Berthier named as his chief supporters, a 10 million franc price on his head with Massena pledging 3 million of his own, and alarm at his appeals to the rabble; rumours swing hourly. Amid this, requests favours for Court Councillors Barbe, Kraibe, Heym and Philipsborn: a wicker waggon and horses to Schlawenschitz, passes for servants, blank forms, and urgently that Eberhard be sent.'
oe1bu9454-005: Warns that Zerboni is demanding 5,000 Rthl from Trzciński out of the Prince's claim of 10,000 Rthl, supposedly by a cession from the Prince; Triebenfeld has contested it, doubts Trzciński's story of 1,000 Rthl already paid to König for the Bischdorff business, and fears Zerboni has misused a blank signed paper. He asks urgently for confirmation, reports that the prefect at Kalisz, von Smiedecki, will report favourably in the compensation case turning on Sokolnik, and awaits replies on the Betsche matter.
oe1bu9454-006: 'Reports from the Congress on the Prince''s claims: the Württemberg business must wait, while indemnification and the Courland affair are pressed, with a demand for the district governorships of Sokolnik and Wieruszew and dealings with Ministers Stein, Nesselrode, Cabinet Councillor Allbrecht and Stägemann. Warns that Hardenberg promises and delivers nothing, recounts Cosmar''s disgrace and the denunciation by the Courland heirs over the Syten estates, notes Adolph''s departure and Pourtales'' silence, and begs 100 ducats by express courier.'
oe1bu9454-007: A third unanswered appeal from Charlotte von Triebenfeld, daughter of the war and forests councillor, who has no address for her father and has lost hope of putting her case to him in person. Describing her distress as beyond all bounds, she no longer asks the Prince for help himself but begs only that one of his subordinates pass on her father's address, so that she need not keep troubling him.
oe1bu9454-008: A desperate appeal, written on receipt of three letters and news of his destitute children, for the Prince to send Lüder 120 Rthl at once and 60 Rthl monthly while Triebenfeld remains away; he says he lives on borrowed money and sacrifices his family for the Prince's business. He also asks for written assurance from the Curz attorney that the matter will be settled at 112,000, and reports having had von Kirchen treated as an interested party.
oe1bu9454-010: Reports from the Congress that letters sent twice weekly, mostly via Teichelmann, have gone astray, and promises to chase the post director Mann. The Prince Chancellor has again given the best assurances and means to settle the Prince's affairs before leaving; von Steegemann has still submitted nothing. The fehlinische claim has gone to the commission with a calculation in an accompanying memorandum, compensation expected in estates since cash is needed for the war. Long account of troop movements before war with Napoleon.
oe1bu9454-011: Urges the Prince to send Eberhard to Vienna at once, with a letter to the State Chancellor Hardenberg and a blank sheet for the King, since the case will be heard within the week but is worthless unless a settlement is reached with the Churp. heiress, even at 50,000-100,000 more. Reports Prince August's refusal to withdraw Cosmar's power of attorney, proposes Prince Adolph instead, and begs 100 Rthl to pay Starben. Adds news of the Congress, Saxony and Austrian war preparations.
oe1bu9454-012: A desperate plea for 200 ducats to be sent at once, without which nothing can be achieved and everything so far gained will be lost. Urges that Prince August quickly recover the power of attorney from Cosmar, warns against trusting the young gentleman over a written undertaking apparently left behind at Öhringen, and reports that the King of Württemberg's own draft constitution has been ignored and protested against by the Estates.
oe1bu9454-013: 'A confidential report, marked for the Prince alone, criticising how the case has been set down: trivia such as the Adolph affair dragged in while important points were passed over, and Hahn''s scheme for Adolph to acquire Koschentin, said to yield 55,000 Rthl, queried against Schlawenschitz and Oppurg at barely 40,000. Triebenfeld begs for 200 Rthl and blank forms signed in French, having lost some 300 Rthl on falling paper, and describes living on bread and water while ill. Barbe has found a translator for 15 ducats; no word yet from Pourtales; a prince may secure the Prince 6,000-7,000 Rthl yearly.'
oe1bu9454-014: Asks why no ruling has come on the Prince's complaint, and doubts a report from Berlin that an investigation has instead been opened before a wards' board, which would let Cosmar strip the Prince of everything and withhold rents owed since 1812. Reports the failure of attempts to settle the ducal Karl debt, the general attorneys having refused any composition; urges that the King take the debt over outright and perhaps remit the 35,000 Rthl the Prince owes him. Signed Eberhard, with a sceptical note added.
oe1bu9454-015: 'Reports from Vienna that the State Chancellor has written to Öhringen releasing the 100,000 Rthl bequeathed by the late Princess for Prince August to settle debts, that the 112,000 Rthl advance may be counted secured, and that Cosmar''s removal is resolved; the Polish papers need a sworn translator who wants 260 fl., which Triebenfeld cannot pay. He then begs for rescue: ill, penniless, fed on bread and water, owing Barbe 70 H and facing eviction.'
oe1bu9454-016: Written from Vienna during the Congress, with conflicting rumours about when the King of Prussia and the Russian Emperor will leave for the army, and an enclosed note on the German settlement. Triebenfeld reports approaching Lieutenant Colonel von Thiel about presenting Prince Adolph to the King on the 20th and securing him a place in the army; Thiel promises the court will stay until the 22nd. Also news of Murat at Mantua and Bonaparte's build-up, and anxiety over the Kosten estates and compensation for the Prince.
oe1bu9454-017: A furious rebuttal of talk, traced to the Prince's sons in Berlin and repeated by General Kleist to the prefect Count Garczynski at Kalisz, that Triebenfeld pockets the estate revenues; he is having the komornik von Chomanowski investigate, blames gossip from Schlawenschitz and from Sommer, who is spreading reports of 1,700,000 Rthl of family debt, and cites rent arrears of some 30,000 Rthl. He presses for answers on Sobottendorff, Weigel and the 50,000 Rthl Invalids' Fund capital.
oe1bu9454-018: Writing from a sickbed, Triebenfeld rejects the instrument and power of attorney the Prince has sent as useless, since everything is under attachment and he already holds a general power. Because the French General Direction ordered the 3,121 Rthl seized from him during his arrest in Berlin repaid, he, not the Prince, must claim it. He dictates the wording of a declaration acknowledging 4,219 Rthl in capital, interest and costs, recoverable by court officer from villagers' arrears at Wrąbczyn, Kopojno and elsewhere, ahead of the Invalids' Fund, and demands it by the 15th.
oe1bu9454-019: Urges the Prince to close an 18-year lease of the remaining land, buildings and meadows to Mr. von Sobottendorff for 36,000 Rthl, satisfying a creditor owed 40,000 Rthl without touching present revenues, made possible by settlements with Tschachmann or Cybalski and Hainrich, the latter secured by a mortgage on Triebenfeld's Blizanow. Begs for the power of attorney worded exactly as prescribed, since everything is under arrest and he can only act as creditor; 300 Rthl is needed for the Warsaw suit, and the Wytwiver suit should yield 4,000 Rthl. Complains of costs, hunger and the lawyer Lorenz.
oe1bu9454-020: Alarm at a new Cabinet order requiring payment in cash Courant even where value was given in paper, costing 1500 Rthl in the van der Lahr affair. With a sequestrator in his Kontop estates and arrest threatened over the outstanding 3000 Rthl, Triebenfeld has written in the Prince's name offering van der Lahr 1000 Rthl cash and 350 hundredweight of iron at 6 Rthl; he begs 950-1000 hundredweight of bar and hoop iron by 20 April, and encloses a draft of that offer. General von Zastrow's defence of the Prince's conduct at Jena is reported.
oe1bu9454-021: 'An agitated night letter, partly illegible, reporting panic at the expected arrival of the Russians and urging the Prince to act on Polish affairs: Triebenfeld predicts he will recover the Trąbczyn, Kaemener and Brzyrer estates, floats schemes involving Grand Duke Constantine, the principality of Lowicz and Talleyrand, and begs for money to bribe and work, being penniless. Kontop and Schweineren are leased out at 14,000 Rthl yearly; 200 Rthl is requested for his daughters at Breslau.'
oe1bu9454-022: 'Refuses, on grounds of honour and illness (gout), to be named co-defendant or to travel to Poland, having already four suits on his neck as the Prince''s surety: over the Invalids'' Fund, with the Jew Oppenheimer, and with Colonel von Schlieffen''s widow, whose 6,000 Rthl purchase money for Witów he guaranteed to secure the Prince 500 Rthl yearly hereditary quit-rent, now four years in arrears. Details 259 Rthl paid out, 500 Rthl in costs, the agent Stieger''s fees, and Lombardini''s failure to pay 150 Rthl to his destitute children.'
oe1bu9454-023: 'A desperate appeal for money: Triebenfeld, crippled by gout and under distraint, itemises what he has spent on the Prince''s affairs, setting 4,300 Rthl received against borrowings from v. d. Lahr (5,140 Rthl, 1,600 still owing), Cote (9,000) and Blochsräff and Holzapfel (3,500), with 591 Rthl 18 g. paid and 185 Rthl of court dues due. He lists seven pending lawsuits, reports engaging criminal-court councillor Stenger to recover Trąbczyn, Zagorowo, Betsche and Witów, proposes Seifert as clerk, and threatens Honrichs with arrest.'
oe1bu9454-024: A draft letter in the Prince's name asking a Privy Councillor to negotiate a single loan of 100,000 Rthl to clear all his debts, secured by a first and sole mortgage on Zagorowo and Trąbczyn, with a power of attorney and documents promised and 5 per cent offered to the agents involved. Appended are a list of the 34 places in the two lordships, a Kalisz Chamber valuation of their net yield at 40,247 Rthl, and a schedule of debts totalling 366,000 Rthl.
oe1bu9454-025: Reports a fresh peasant revolt at Zagorowo against the division of interior lands, now settled, and the loss of a hoped-for source of funds when the King and Triebenfeld's patron left Berlin. Instead the councillor of justice Bucholz has arranged 80,000 Rthl from von Bredow's capital, secured on Kontop, Schwammern and Trąbczyn, to pay Countess Schlabrendorff and Weigel 25,000 each, Hahn 5,000, the Prince 5,000 in cash and Triebenfeld 30,000 for the Wulffs, against a mortgage to him. Mentions von Tismar's projected 360,000 Rthl loan and slow land sales.
oe1bu9454-026: Relief at news, brought by an express courier from Secretary Koppe in Stettin, that the Prince survived the army's defeat, after false reports from von Dorville and Postmaster General von Secqebarth sent Triebenfeld chasing him toward Sagan. He forwards an instruction for 6000 Rthl, part of 8000 Rthl lent by Minister von Stein on the Kontop mortgage, promises a further 4000 Rthl and hopes for 20000 Rthl on a Schweinen mortgage; no money can be got out of South Prussia.
oe1bu9454-027: Reports that the Prusimski family have seized Trąbczyn and Kaemen by force, that nothing can be done for now, and that protests have been entered only to protect the sum Triebenfeld has registered. Cites General von Sanitz's wife appealing to Napoleon over her husband's confiscated estates, whose answer will set the pattern here. Announces his departure for Memel and possibly Petersburg, hoping to work through Grand Duke Constantine, since the Prussian court, however devoted to the Prince, can do nothing.
oe1bu9454-028: Reports that the Trąbczyn estates were seized on the 3rd by the Kalisz Court of Appeal commissioner, the appellate judge von Lipski, and handed to canon von Jezierski, attorney of Madame von Dąbska née von Prusimska, on the Warsaw governing Commission's decree; protests were lodged citing the Peace of Tilsit, a copy of the decree refused, and the Prince's rights reserved. Warns of two new suits, including a 7,000 Rthl claim on a 1798 lease, and asks for the Breslau settlement and a power of attorney.
oe1bu9454-029: A short request for a meeting, recalling an earlier encounter with Court Councillor Hahn at Lohsen near Brieg and a promised rendezvous after the return from Memel; the writer asks when he may wait upon the addressee in Breslau, having been questioned about it by his master, the Prince. He adds that French troops are expected to be quartered at Schlawenschitz, which may tie him to the spot, force him to clear his stables and seek other lodging.
oe1bu9454-030: Triebenfeld reports being held under arrest by French gendarmes in Berlin as the Prince's general attorney until two years' interest arrears of 5,000 Rthl on the 50,000 Rthl borrowed from the Invalids' Fund were paid, though he argues the banker Apenheimer was liable. He raised 2,000 Rthl himself, with Minister von Zastrow guaranteeing 5,000 Rthl in paper money, repayable 1 June, and urgently asks the Prince to return a 6,000 Rthl bank instruction ceded to Eysenhardt so he can recover a 10,000 mortgage. Zastrow is pressing the French to restore the Trąbczyn estates.
oe1bu9454-031: Written from Berlin while ill and under arrest for unpaid interest, Triebenfeld begs urgently for the return of the order to pay on 6,000 Rthl so he can recover a pledged 10,000 Rthl mortgage, and urges raising 150,000-250,000 Rthl in Holland, debts to be cleared cheaply with treasury notes standing at 48 per cent, including Ephraim's claim. He protests at Honrichs's general power of attorney, proposes a cheaper slate of estate officials saving 1,900 Rthl, and dismisses the Otocki, Radzinski, Iwanski and Przespolewski suits as fabricated.
oe1bu9454-032: 'A revenue and debt statement for the lordship of Zagorowo alone, the Trąbczyn income deducted: yields of 27,700 Rthl from liquor rights, dues and hereditary leases at Olesnica, Wrąbczin, Klein Ingelfingen, Swięcia, Sophienthal, Kopojno and elsewhere, against debts of 148,800 Rthl to Oppenheimer, Glenck, Bernhardi and the Invalids'' Fund, leaving 20,260 Rthl. Triebenfeld reports suing Oppenheimer, complains of paying costs from his own pocket, and offers to raise 200,000 Rthl from Holland.'
oe1bu9454-033: Written from his sickbed, Triebenfeld urges the Prince to recall a bank order from Eysenhardt at once to save both their credit, and sets out a scheme for using a 250 Rthl mortgage and discounted treasury notes to pay off Oppenheimer, Eysenhardt and the Invalids' Fund at half their value. He warns bitterly against blank forms and general powers of attorney, citing Honrichs's cut of the Hufe price from 600 to 300 Rthl, reports French orders to collect arrears in South Prussia by military help, and complains of Minister von Stein's hostility.
oe1bu9454-034: 'Denounces Honrich''s submission to the Prince as absurd: despite 21 letters sent by mounted and foot messengers he has had no money, accounts or reckoning from him, while costs were met through Professor Rhoda; with Schmid dead, he has engaged Hochern at 600 Rthl a year plus allowances in kind, far cheaper than Schanck, and hopes French authorities will help collect arrears. Begs above all for money to repay the Invalids'' Fund borrowings and return von Zastrow''s bill of exchange and pledged mortgage; reports himself gravely ill.'
oe1bu9454-035: 'A bitter appeal from an ill and effectively detained agent: arrested over 5,000 Rthl of interest owed by the Prince, guarded by two gendarmes costing some 20 Rthl a day, Triebenfeld says he paid with 2,000 Rthl of travel money and 5,000 Rthl borrowed through Minister von Zastrow from van der Laar, falling due 14 May. He begs for 3,125 Rthl, protests at Court Councillor Meyer''s orders to Amelang diverting his own pledged money, demands return of a void bank payment order for 6,000 Rthl, and warns his Vienna mission and both men''s reputations are at risk.'
oe1bu9454-036: 'Answering a reproachful letter, an explanation of what became of Triebenfeld''s bond: in January 1807 the writer, pressed by the Berlin justice councillor Eysenhardt over an old debt, ceded it to him through privy councillor Meyer against a 6,000 Rthl payment order, only for Triebenfeld''s suspension of payment to leave him short of the expected 3,500 Rthl. Assessor Koeppe has been instructed to redeem it for 2,500 Rthl. Encloses 3,000 Rthl Courant, regrets any coolness towards Minister von Stein, and urges a personal visit on the way to Vienna.'
oe1bu9454-037: Refuses to pass enclosures to Mr. von Koppen, since they would let Justus Eysenhardt draw on an assignation that Triebenfeld must return whole to the bank, the accompanying bill of exchange being long overdue. He urges the Prince to order privy councillor Amelang to give the assignation back at once, failing which he will advertise it void, and asks for 2,000 Rthl for the invalids' interest and 5,000 Rthl Courant for Laar, to spare Major von Zastrow; his own recovery is slow.
oe1bu9454-038: 'Written from a sickbed, an account of how pressing debts were met: 3,000 Rthl received from Baugnier Veit and an order to pay handed to Amelang, 5,125 Rthl paid to the treasury, 300 Rthl borrowed with help from Minister von Zastrow, and a fresh 5,176 Rthl of debt cleared only by letting timber and boards from Kontop go at half price, at a loss of 3,480 Rthl which the Prince is asked to make good. Urges him to raise 150,000 Rthl quickly while depreciated papers are rising, enough to buy 750,000 Rthl of paper and settle Courland and the rest.'
oe1bu9454-039: 'An urgent appeal for money: debts of 6,125 Rthl have been called in, of which the Prince has ordered 3,000 Rthl paid, leaving 3,125 Rthl unmet, and Triebenfeld faces execution and cannot leave until it is settled. He explains that in February he surrendered funds to escape arrest by the French and borrowed to cover inn bills, costs and travel; nothing comes in from Zagorowo. He begs an order to pay 2,000-3,125 Rthl, asks that letters go to the justice commissioner Empuch, and recalls the large loan still pending.'
oe1bu9454-040: 'A scheme to clear the Prince''s debts: raise 250,000 Rthl on a Zagorowo mortgage, buy 750,000 Rthl of depreciated paper, and redeem 300,000 Rthl owed the King with 90,000 Rthl of bonds, Triebenfeld offering his own land as surety and naming Oppenheimer, the Invalids'' Fund and Meyer Bernhard among advances of 46,000 Rthl. New valuations are impossible amid the dismemberment. He warns of enemies at court, pleads his own want of travel money, and reports a French promise of troops to extract Zagorowo arrears.'
oe1bu9454-041: 'Political advice and news: Triebenfeld regrets missing a chance to travel to Erfurt for the meeting of the two Emperors, lacking funds, and expects nothing to be settled there. He urges the Prince to go to Silesia or Königsberg and present himself to the King, blaming Stein''s remarks on his command for the court''s cooling, and disparaging Kalckreuth. The French government has lifted part of the sequestration on the South Prussian estates; Metzig should collect 8,000-9,000 Rthl owed by the burgesses in transfer fees and purchase money.'
oe1bu9454-042: 'A desperate appeal for 2,068 Rthl to secure release from arrest in Berlin: French gendarmes seized Triebenfeld as the Prince''s representative over 3,521 Rthl of interest arrears owed to the Invalids'' Fund, and he has since juggled pledges, bills and depreciated state paper with von Zastrow, the merchant Lahr, the dyer Coste and Mathieu. He reports his own estate at Kontop sequestrated, six months'' illness, protests lodged against the Zagorowo sequestration, a fiscal suit against Oppenheimer over an inflated 105,000 Rthl claim, and a scheme to clear 122,000 Rthl of debt cheaply through paper.'
oe1bu9454-043: 'A desperate appeal for money: a Berlin judgment obtained through Privy Councillor Amelang has awarded Lahr his remaining 3,000 Rthl in hard cash rather than state papers, and Triebenfeld, as defendant in a bill-of-exchange suit, faces arrest unless the sum is deposited. He reports the Oppenheimer suit going well, expects the sequestration lifted once interest on some 10,000 Rthl is paid, and begs for 600 hundredweight of iron promised to the merchant Michaelis.'
oe1bu9454-044: 'Pleads to be released from Berlin, where the Lahr lawsuit keeps him: a judgement awards Lahr 3,000 Rthl in paper plus interest, with 1,500 Rthl of costs needed to redeem his own pledged bonds. He has repaid Coste''s 9,000 Rthl with 450 Rthl interest, and asks urgently for 2,068 Rthl, and 932 Rthl cash for Oppenheimer suit costs and for feeding the French gendarmerie. Michaelis offers to settle if given 600 hundredweight of iron at 4 Rthl, delivered free to Oppeln.'
oe1bu9454-045: Reports fleeing Berlin to avoid personal arrest over a 3,000 Rthl bill claimed by von der Lahn, a first-instance decree Amelang has appealed while petitioning the Grand Chancellor to correct a misread Cabinet Order; the merchant Michaelis advanced 2,400 Rthl to pay Mathieu. Thanks the Prince for promising 600 hundredweight of bar and hoop iron, contracted to Michaelis at 4 Rthl delivered to Berlin by 1 May, and begs 100 ducats to buy state paper as security.
oe1bu9454-046: 'A badly damaged and partly illegible private letter, reporting that a bill of exchange drawn on Berlin for the Prince of Hohenlohe should by now have arrived, and that the lawsuit''s files await judgment in the appellate court with no favourable outcome likely: a royal declaration printed in the Berlin newspapers rules that bonds are to be repaid in Courant even where paid in state notes, and permits interest of 10, 12, 16, 20 or 50 per cent on overdue sums.'
oe1bu9454-047: 'Point-by-point answers on four questions after meetings with justice-burgomaster Hawich and inspector Hecker from Zagorowo: a three-year moratorium from the King of Saxony shields the estates so long as interest is paid, and the Invalids'' Fund''s 50,000 Rthl holds first mortgage and is not at risk, though the banker Oppenheimer has broken his court promise; Meyer''s building claim is rejected; the Giese suit over promised lands and timber rights is four years old; and the Augustinower and other colonists must be refused any remission under their hereditary-lease contracts. Pleads his own arrest and the sequestration of his Kontop estates as preventing a visit to Schlawenschitz.'
oe1bu9454-048: 'Reports a meeting with justice-burgomaster Hawich of Zagorowo, now a notary public of the Duchy of Warsaw, and Chief Inspector Hertes, at which thirteen special powers of attorney were made out: to lift the sequestration, collect and distribute interest to creditors holding judgments, sue Oppenheimer and Wolff at Kalisz over entries exceeding 72,000 Rthl, force the sequestrator Honrichs to account and undo his land sales, recover 23,000 Rthl from the Olesnica hereditary leaseholders, pursue boundary suits, and represent the Prince at the Warsaw Diet.'
oe1bu9454-049: 'A plea for rescue: Triebenfeld, held under arrest at Kontop and unable to leave until he delivers 600 hundredweight of iron pledged on his word of honour and obtains his release from justice-burgomaster Scheu of Neufall, complains that the Prince''s messenger brought neither a line nor an answer. He asks that the iron, or the full thousand hundredweight covering the Michaelmas year and the Berlin costs, be sent directly to his administrator Neumann at Bogadel, and reports rumours of a Russian corps on the Polish and Silesian frontier.'
oe1bu9454-050: A draft petition to the King, written in the Prince's own voice, over a debt of 3,125 Rthl in arrears of interest on a 50,000 Rthl capital advanced from the Invalids' Fund against the Zagorowo estates. The French administration extracted the sum from von Triebenfeld by arrest and military execution, forcing him to borrow 5,140 Rthl in depreciated paper from the merchant van der Lahr, who is now suing for the remaining 3,000 Rthl. The Prince, settling through his agent Amelang in Berlin with cash and iron deliveries, asks that Triebenfeld be released from liability and spared execution.
oe1bu9454-051: 'Reports that the iron has still not arrived but the execution has been lifted, so Triebenfeld will leave for Königsberg and defer his opinion on an inheritance matter until his return in about three weeks. He has summoned Honrichs over a new attachment at Wohlen and vouches with his honour that Honrichs will bring money, while warning against exposing funds to Polish confiscation and calling Hawich a scoundrel for withholding original papers. Bethney lies gravely ill at Malsdorff. War news from Zillichau bankers: the Prince of Hohenzollern near Leipzig, Austrian success in Bavaria and Munich occupied, French removing magazines.'
oe1bu9454-052: 'Reports having laid the Prince''s letter and enclosures before the Queen, who received them with satisfaction and passed the business to the Grand Chancellor; it went on to Cabinet and Supreme Court Councillor Allbrecht, with whom Triebenfeld is now working, though von Beym''s attention to correct form promises delays. Praises Allbrecht''s integrity. Adds that no political news can be given: reports of the French and Austrian fighting contradict each other daily and the King has forbidden discussion of them.'
oe1bu9454-053: Reports that no decision has yet come in the inheritance matter, the papers resting with a minister after opinions from the High Court of Appeal and Cabinet Councillor Albrecht, with the Queen awaiting the outcome. Urges the Prince to write plainly to the King for a speedy conclusion of his war-related case and to answer the Commission frankly; praises Major von Pirch as his ablest advocate, alongside General von Köckritz and Haacke. Notes Massenbach's petition and war news of Schill's successes and Austrian losses.
oe1bu9454-054: 'A desperate plea that 600 hundredweight of iron reach Boyadel near Grünberg by 23 April, not Oppeln by the end of May: Triebenfeld has judicially contracted with Michaelis to deliver it in Berlin by 1 May, given a bill of exchange on 2,400 Rthl and risks a 500 Rthl penalty and forced sale of his estates. He also urges that von der Lahr, now offering 5 1/2 Rthl, be held to 6 Rthl per hundredweight through Amelang, promises 4,000 Rthl from Zagorowo, and notes the general moratorium protects the Prince from Weigel''s old claims until Midsummer 1810.'
oe1bu9454-055: 'Reports on the contested Colonna inheritance: Count Götzen can testify that Colonna adopted the Queen as his daughter and left her his estate, and Triebenfeld argues from territorial law that the Prince''s legacy of 10,000 Rthl, being under a twentieth of the estate, is secure despite the will''s defects. He proposes the Queen take the estates, worth some 3 millions, leaving Wratislaw cash, and has drafted a letter to the Queen for Count Poten. Also von der Lahr''s harassment, iron awaited at Kontop, Rüchel''s rumoured Silesian command, war between France and Austria, and Massow''s discharge.'
oe1bu9454-056: 'Stranded at Kontop for want of travelling money and the promised iron, Triebenfeld begs the Prince to have the full 1000 hundredweight delivered, the 217 units still missing sent at speed, and the freight paid: Michaelis is to take 600 Rthl of iron, Lahr 2200 Rthl, with some 240 and 200 Rthl freight and toll to Berlin. He also reports war expectations, Russian troop movements near Brzesc, silver deliveries, and the King''s letter to General von Zastrow.'
oe1bu9454-057: 'An account of a mission to Königsberg: the King was angry that the High Provincial Court treated the Prince harshly and ordered by courier that he be spared; the inheritance matter goes to Hoyok in Warsaw to look for the will, failing which to Count Danckelmann; the Prince is said to be destined for General Governor of Silesia, though Scharnhorst withholds his statement on Massenbach. Triebenfeld pleads destitution: robbed of 800 Rthl, unsold iron at Kontop, 1200 and 2000 Rthl owed, and reports on Poland, Russia and the "Black Brothers" conspiracy.'
oe1bu9454-058: Thanks for 50 Fr received through the referendary Bally, which has bought off a pressing execution for four weeks, and reports on a secret intelligence journey into Poland, sent by express courier to Königsberg. Triebenfeld urges the King to ban wool, grain and cattle exports that finance Polish arming, describes Garczynski and Zychlinsche as his men in the Kahrs but unable to act under a secret court, notes plans to make Constantine king, and warns against premature action risking confiscation of the estates.
oe1bu9454-059: 'A despairing account of Triebenfeld''s own ruin: Kontop stays under sequestration, executions press on the Schweiner estates for 2,560 Rthl interest and the von der Lahr debt, part paid in iron and boards at a loss of 1,800 Rthl, and he needs 4,560 Rthl to free his estates while grain, 105 stone of wool and 2,000 cords of wood find no buyers. He urges the Prince to write directly to the King, warns against Greischau, and reports Polish arming and rumoured partition schemes.'
oe1bu9454-060: 'A desperate appeal for 1,800 Rthl: everything at Schweiner and Kontop has been sealed and attached, and sequestration of estates said to be worth 200,000 Rthl threatens a forced sale at a third of their value. Triebenfeld blames von der Lahr, whose iron and boards arrived late by low water, and describes his own destitution and his daughters working for money. He asks that the money go straight to Professor Schade, and excuses himself from travelling.'
oe1bu9454-061: 'A desperate appeal to a Court Councillor to obtain 1,800 Rthl of interest from the Prince, without which Triebenfeld says he cannot show himself in Breslau, disgraced by the von der Lahr affair and by a distraint that has left his estates sequestrated. He encloses mention of a despairing letter from his daughter, and sets out his plan: to clear himself, break up part of his estates for his children''s maintenance, and appeal to the King. Otherwise he will go to Königsberg.'
oe1bu9454-062: 'A sixth unanswered appeal, written after five earlier letters, complaining bitterly that the Prince will not reply while his agent labours in Vienna. Triebenfeld reports progress on every front: the Kosch business set moving though referred back to Berlin, the Courland debt to be paid off, the settlement annulled, Cosmar forced to withdraw, the entailed estate and the Polish estates recovered. He begs urgently for money, to be sent care of Chief Post Director Mann in Vienna.'
oe1bu9454-063: 'Writing after seven weeks'' illness, Triebenfeld describes his own ruin: a tenant found for Kontop but 8,000 Rthl of arrears to clear first, and hopes of a timber sale to a Stettin war-profiteer. On the Prince''s affairs he urges dealings with the sub-prefect who wants to buy the estates, action to recover those seized, and that with the sequestration lifted revenues go to the Prince, not the intruded administrator. He asks authorisation for Honrichs, whom Hecker had denounced for burying Bonaparte''s portrait in a privy.'
oe1bu9454-064: Reports the Queen's death at Strelitz and the King's illness, declares the Collorina affair void, and urges recovery of 100,000 Rthl and the papers held by Köckritz. Encloses a copy of a scheme for exchanging the Zagorowo estates against von Knobelsdorff's Bischdorff and Mollna, with valuations, Landschaft assessments and claims by Weigel (190,000 Rthl) and Stössel (180,000 Rthl). A postscript records Chancellor Hardenberg's promise of help over 112,000 Rthl and begs repeatedly for 300 Rthl in gold.
oe1bu9454-065: Writing on the eve of a commission that should release his own estates from sequestration, Triebenfeld recounts his ruin at the hands of the Glogau Landschaft, von der Lahr and Berlin usurers, itemising debts of some 25,100 Rthl including 18,000 in wartime interest arrears, and asks the Prince for 40 pieces and for 300 hundredweight of bar and hoop iron from the Koschentin foundry on credit until 18 January, at 4 Rthl 12 g. delivered to Boyadel, to trade against spirits. He reports rumours that the Prince has been made Governor General of Silesia.
oe1bu9454-066: Reports an expected verdict of six years' fortress imprisonment for the false denouncers and banishment for the agitators; advises granting the colonists and old peasants no remission of interest since arrears can be reckoned into a sale, and describes three roebucks sent to Polish officials to secure the lifting of the administration and Honrichs's lease. Adds war and political rumours, asks for receipts to free 70 hundredweight of iron held at Neusalz for freight, complains of mounting lawsuit and stamp costs, and proposes delivering 2,000 hundredweight of bar iron for 8,000 Rthl.
oe1bu9454-067: Reports that departure is delayed because Coste has not arrived, Schweinere is unleased and the Berlin affair remains unresolved. Hawich's charge that Honrichs is a swindler has prompted Triebenfeld to summon Honrichs and Hawich and to send a German court clerk with Polish training to Zagorowo to question the subjects and tenants about monies taken; he suspects rather that Hawich, Honrichs and Heckert have seized Hufen and built on them. Also Berlin news of von Köckritz, Kleist and the moratorium, and a request for freight, toll and weighing dockets for iron.
oe1bu9454-068: An urgent plea for the original deed of donation for Trapponin, needed for a hearing before the justice of the peace Kwilecki on the 28th, where Honrichs is to produce it; Honrichs has disproved Hawich's claims and shown 22,000 Rthl in requisitions recoverable from the colonists. Triebenfeld also wants at least 1,000 Rthl in Courant, having borrowed 59 Rthl 18 Groschen to feed Stenger and Honrichs, and proposes suing Lipschi over the seized estates.
oe1bu9454-069: Bally reports, after Lombardini's earlier word, that the money could not be collected at once in Breslau and that dreadful roads and weather delayed him; even so he reached Kontop by midday on the 25th, still in time to find Honrichs and Cabanis, who left the same day once Honrichs had 6,000 f. and the original deeds of donation. Councillor of War von Triebenfeld, his right arm badly affected, promises some weeks at Schlawentz once his own business is done. Bally awaits instructions before returning.
oe1bu9454-070: 'Reports on the administrator Hecker, kept on after a misunderstanding with Chief Prefect Garczynski: he has pledged himself to pay everything by Midsummer and is summoned to Costen with Honrichs to repeat this before the court, with Cabanis as controller. At Trąbczyn the opponent Kramplitz has failed to appear and a new hearing is set for 2 April; Raczkowski, Künzel and Honrichs are pressing the suits. Triebenfeld excuses not coming to Schlawenschitz, plans six days in Berlin, and complains of the Landschaft''s 4,000 charge.'
oe1bu9454-071: 'Reports that the Rochlitz claim has been set going and the Prince should owe nothing, denouncing it as a fraud pushed through in secret: Triebenfeld insists he dismissed Rochlitz in 1804 as general attorney and demanded accounts Rochlitz never rendered, with Glenck able to testify and no secret promise likely from building councillor Otocki. Asks urgently for three signed and sealed blank litigation powers of attorney so Melzig can pursue Rochlitz and collect some 18,000 Rthl of liquid arrears.'
oe1bu9454-072: Writing as the estate owner rather than the manager, the Prince explains that after waiting in vain for Triebenfeld and Mr von Brzechsta to arrive, and abandoning an exchange scheme with General von Schimmelfennig at Triebenfeld's wish, he has allowed a new exchange project and an inspection of the Zagorowo estates without consulting him. Pressed by creditors and by arrangements made with his son and sons-in-law, he asks for the original deed of donation, news of a Warsaw lawsuit, and 300 Rthl for Lieutenant Sommer.
oe1bu9454-072a: A lease of the Zagorowo estates agreed provisionally with sub-prefect von Brzechsta awaits the Prince's ratification; Brzechsta, delayed by a summons to Warsaw, will travel to Schlawenschitz around 11-12 March bringing 2,000-3,000 Rthl and plans strict execution against arrears-debtors. Reports the Wrobeziner peasants' suit won at the Tribunal Solenne, their contract annulled and eviction possible, and confidence in the Olernizer case. The Trąbczyn recovery is to go before the Council of State; with 80,000 Rthl of debts, 40,000 Rthl offered for the forest and compensation from the Dąbska woman, estates worth 300,000 Rthl would be clear. Levies for troops leave nothing for costs.
oe1bu9454-072b: Reports that the sub-prefect von Brzechsta cannot leave Warsaw before the 15th, but will then travel to Schlawenschitz with whatever money he can gather, and has promised to undo the 897 Rthl tax laid on the Zagorowo estates in a new classification. Zaborowski and Szimanowski demanded 500 Th through a third party; Hawich takes 1200 Rthl salary but surrenders 9 Hufen sold to him by Heiller; Niedzwiedzki has lost his suit and owes 2000 Rthl; the hostile assistant land judge Piekowski, who blocked interest collection, is suspended.
oe1bu9454-072c: 'Thiel, a district councillor writing from Kalisz, forwards to Triebenfeld an enclosed letter from the sub-prefect Brzechsta, received through the advocate von Wieckowski. He points out two things from it: Brzechsta''s business keeps him in Warsaw until the 15th of the month, and the prospects regarding the lordship of Trąbczyn look good. A short covering note, its value lying in the enclosure and in the encouraging word about Trąbczyn.'
oe1bu9454-072d: A brief note from Brzechsta, writing as "dear brother", reporting that business will keep him in Warsaw until the 15th of the month, and that on reliable information the Trąbczyn affair stands quite well, details to follow in person. Written in haste as the conveyance was leaving, it gives no particulars and closes with greetings to the friend and to both.
oe1bu9454-072e: A brief note from B. Brzechsta, writing as "brother", saying that business will keep him in Warsaw until the 15th of the month, and that on reliable information the Trąbczyn affair stands well, with fuller explanation promised on his return. Nothing further is given, the writer breaking off because the coach was leaving. A hasty few lines rather than a substantive report.
oe1bu9454-072f: 'An account of crisis on the Zagorowo estates: a forced grain and straw delivery imposed by the Upper Prefecture at Kalisz, refusal of leave to levy execution on the peasants for rent arrears, and a renewed sequestration which Triebenfeld averted by persuading the sub-prefect Brzechsta to settle the deliveries from 2000 Rthl in hand and receipt them as rent. Troops quartered daily, up to 62 persons fed, peasants fled, courts halted; he writes ill with fever and gout, expecting 10000 Rthl for Brzechsta and a visit at Midsummer.'
oe1bu9454-073: 'A reply, drafted with von Weithausen of Cosel and Bolli, to a tenancy offer for the Zagorowo estates from Mr von Brzechsta: the Prince welcomes it but wants rent paid half-yearly in advance, cash security in hard coin, all burdens on the tenant, claims for remission forestalled, and a fixed sum for withdrawal should the estates be sold. Talks with General von Schimmelpfennig have stalled; little is expected of the Weigel and Baron von Stössel sale plan. He urges Triebenfeld to come soon with 300 Rthl for L. Sommer, game and a dog.'
oe1bu9454-074a: A copy of a Treasury petition by Seelmann to the Supreme Court, seeking urgent attachment of 80,000 Rthl legacy money left to the Prince of Hohenlohe-Ingelfingen by the late Princess von Sacken and said to be destined for Triebenfeld. The General Invalids' Fund lent Triebenfeld 50,000 Rthl in 1805 against his conditional cession of the Prince's 250,000 Rthl Zagorowo bond; interest of 9,375 Rthl is unpaid, the Zagorowo mortgage has been reckoned to the Bayonne sums, and his Kontop and Schwammern estates are overburdened.
oe1bu9454-074b: 'A head forester is needed at Zagorowo: the old judge''s son had been designated, and Nogeln''s nephew put over the liquor monopoly rights at the distillery, but the nephew has been recalled and the judge must now take that on. Triebenfeld proposes the impoverished Radzowski for the forester''s post at 300 Rthl a year and urges the Prince to send him at once, together with his views on the naming of the estates.'
oe1bu9454-074c: 'A copy of a court order arising from the General Invalids'' Fund''s suit of 30 July before the Superior Court of Appeal in Berlin: Minister of State and Justice von Kircheisen is forbidden, on his own liability, to pay out anything to von Triebenfeld at Kontop near Grüneberg from a 50,000 Rthl legacy said to be due to the Prince of Hohenlohe-Ingelfingen from the estate of Princess von Sacken and assigned to Triebenfeld against his claims. Like orders went to Chief Medical Councillor Cosmar and to Triebenfeld, forwarded through the Silesian Superior Provincial Court at Glogau.'
oe1bu9454-074d: A summons from the Prussian High Court of Appeal in Berlin ordering Councillor of War and Forests von Triebenfeld, at Kontop near Grüneberg, to appear on 23 August before Appeal Court Councillor Koitsch, in person or through a judicial commissioner. The Royal General Invalids' Fund has obtained an attachment on the 80,000 Rthl legacy left to the Prince of Hohenlohe-Ingelfingen by the late Princess von Sacken; Triebenfeld is to answer it, state any damage, propose the level of security, and negotiate a settlement or release against surety, on pain of the attachment standing.
oe1bu9454-075: 'Returns letters from the Count of S., praising his straightforwardness but lamenting the lost chance to gain the Prince some 40,000-50,000 Rthl. Reinhardt reports from Bonn that the hoped-for treasury assistance has not materialised. Conflicting news on the South Prussian ministry: Minister von Goldbeck writes that Count von Hoym keeps it and has been given the Ansbach and Bayreuth provinces, while Haugwitz''s confidant Priebich claims Haugwitz will have it. Chełmski has not yet appealed; a form of power of attorney awaits Metzer''s return.'
oe1bu9454-076: A planned exchange of estates is under way and may be concluded shortly. Triebenfeld announces that he will travel to Berlin at the beginning of September and has leave to stay until the end of the month, where he hopes to find the Prince in good health and to report in person, rather than in writing, on several items of business. A brief notice of movements, with no figures or names given.
oe1bu9454-077: 'Reports that the business is going well: a royal letter comes through Privy Councillor Beyhm, and Minister von Voss is instructed to report with all speed. Asks that Glen prepare thorough valuations matching the schedule and contracts, that the Prince send a power of attorney through Herr von Michaelis, and, more awkwardly, some pre-signed blank letter sheets, one being needed for a man engaged at Potsdam. A suitable loan is being arranged; Triebenfeld prefers to stay out of sight to avoid envy. Notes appointments: Burensprung as Land Master of Forests, Lindenau''s new title.'
oe1bu9454-078: Michaelis reports on a first approach to Privy Councillor Schultz in Berlin, who claimed to know nothing of the Prince's letter to Minister von Voss beyond having read it; Schultz advises that a power of attorney be lodged in the registry so that papers can be handed over. Michaelis proposes wording empowering him to pursue the exchange of the estates granted by the King with the South Prussian Department, asks for the promised reports on the Grotowski affair, and praises Triebenfeld's zeal.
oe1bu9454-079: 'Lobbying report from Berlin on a projected exchange of the Prince''s estates: Triebenfeld awaits Minister of State von Voss''s report, counts on Count Schulemburg (now holding the Disposition Treasury), Struensee and Hoym, who resents having proposed the estates without cabinet order and would pay 1000 Rthl for a quick conclusion, and names the bribes expected, 2500 Rthl to the village headman''s daughter, 3000 Rthl to Klewis, 300 ducats to Court Fiscal Michaelis. Adds court gossip on the King''s resistance to war and moves against Struensee, and renews a request for blank forms.'
oe1bu9454-080: 'A short follow-up to a letter sent the previous day by Captain and Hahn: Minister Hoym has come back from Potsdam well satisfied, having heard several matters concerning the Prince discussed there, which Triebenfeld takes as proof of the monarch''s regard and grounds for optimism. Berlin is full of talk of troop movements or war, which he disbelieves, trusting the King''s principles. Nothing has yet been heard back from Herr von Voss.'
oe1bu9454-081: 'Reports that no news of the proposed exchange of estates has yet reached the dispatch office registry, despite pressure from von Triebenfeld and Eysenhardt for definite information: the business is evidently still passing between Minister von Roth and Privy Councillor Schulze, with nothing yet decreed. The writer, Michaelis, thinks further visits to Schulze pointless for now and will wait for the Prince''s power of attorney, expected the following Tuesday, before identifying himself and pressing for a reliable answer.'
oe1bu9454-082: A report that the King's cabinet letter in the Prince's matter has been sent after Minister von Voss at Havelberg and has not yet reached the department in Berlin, enquiries in the chancery having produced nothing; Voss, back from leave a fortnight early, may bring it himself on Thursday. If it is worded as firmly as Triebenfeld suggests, a favourable outcome is assured. Also notes 300 Prussian Courant paid to Triebenfeld on the Prince's account against a written note.
oe1bu9454-083: 'Reports that negotiations in Berlin are going well: Krotoszyn is now certain to be granted to the Prince in compensation for his Suprenstis possessions, and Privy Finance Councillor Schulze expects Polajewo, worth some 100,000 Rthl, to follow, though resistance from the Chambers will be a struggle. Asks that Prince George be kept waiting until Triebenfeld reaches Breslau, since no official knows the province or the language well enough. Adds news of Minister Hoym, Voss, Mencke, and rumours of French designs on Hanover.'
oe1bu9454-084: Reports that the King has charged von Voss with settling the Krotoszyn exchange, and that he has asked four weeks for a final report while the Chambers check that the revenues balance. Triebenfeld, leaving for Betsche, urges that instead of Polajewo the Prince be given estates from the district governorship of Adelnau bordering Krotoszyn, reckoned at 4 per cent. Notes goodwill from Colonel von Köckritz, von Voss's reliance on war councillor Nöldichen, Prince George's visit to Breslau, and confused news from Russia.
oe1bu9454-085: 'King Friedrich Wilhelm refuses, in a copy of a royal letter, the Prince of Hohenlohe-Ingelfingen''s proposal of 29 February to exchange his South Prussian estates for the domain offices of Krotoszyn and Polajewo: on the minister von Voss''s report, Krotoszyn alone yields 49,043 Rthl, so the State would lose some 17,400 Rthl a year. He notes Councillor of War von Triebenfeld received 26,000 Rthl in 1795 for surrendering the lease, and that he had already ordered such proposals rejected.'
oe1bu9454-086: A draft petition to the King defending the Prince's proposed exchange of his South Prussian estates for the lordship of Krotoszyn against Minister of State von Voss's unfavourable report. He states he had already dropped the 30,000 Rthl cash payment and Polajewo, disputes Voss's yield figure of 49,043 Rthl against Krotoszyn's actual rent of 30,100 Rthl and his own estates' 41,500 Rthl, and asks that an impartial commissioner value both, mentioning Count von Höym.
oe1bu9454-087: A defence of the Prince's honour over a proposed swap of his estates for the Krotoszyn estates, addressed to Colonel von Köckritz for laying before the King. Having spent some 50,000 Rthl on estates he could not borrow against, he sought Krotoszyn as security for a loan from von Karnhowsky; Minister von Voss now claims the exchange would cost the State 17,400 Rthl a year. He puts Krotoszyn's yield at 30,100 Rthl against his own 41,500 Rthl, cites Höym and boundary suits with Count Kalbreuth, and asks for an impartial investigation.
oe1bu9454-088: A copy of a reply to Minister von Voss, who has refused to support the proposed exchange of the Prince's South Prussian estates (Polajewo expressly excluded) for the district of Krotoszyn. The Prince argues that the refusal rests on the commissioners' reports, which overvalue Krotoszyn, rather than on von Voss's own judgement, invokes the King's repeated promises of favour, and announces that he will take the matter further to clear himself of any imputation of self-interest.
oe1bu9454-089: Lays out a strategy for the proposed exchange of the Prince's estates for Krotoszyn and Polajewo, enclosing Glenck's copy of a letter to the King and urging that a commissary be appointed or the King decide at once on equal yield and value. Attacks von Voss and the official Nöldichen for claiming Krotoszyn yields 49,000 Rthl against lease and valuation figures of 23,000-30,000, citing Glenck's nine-year lease at 44,500 Rthl and 64,000 Rthl advanced. Reports Count Schulenburg's assurance, and a shortfall of some 7,000 Rthl on the Princess's 30,000 Rthl loan.
oe1bu9454-090: An agitated report that the affair has reached its critical stage, with hints that a certain person may be working against it indirectly, as the Prince himself suggested in a letter to Glenck. Triebenfeld despairs of the ministers and the local judges while praising the monarch, and offers, since Princess Sacken will not advance the 7,000 Rthl, to raise the sum in his own name and pledge all his property rather than let so good a cause fail.
oe1bu9454-091: Beyme thanks the Prince of Hohenlohe-Ingelfingen for his information on the proposed exchange of estates, welcomes the King's order that the further investigation be carried out, and pledges to pursue the matter as conscientiously as before, leaving nothing untried that might reconcile the Prince's wishes, his own master's willingness to accommodate them, and the interest of the State. A short letter of acknowledgement and assurance, with no details of the estates or terms.
oe1bu9454-092: 'Michaelis reports that the information the Prince of Hohenlohe-Ingelfingen asked for on the last post day has been obtained: Councillor of Works Glenck handed over receipts from the Gleissenbergs and from Schneider, which put him in a position to answer the General Auditoriate on the orders communicated to the Prince. He expects Councillor of War von Triebenfeld to report separately the same day on the state of the Krotoszyn business. A short covering note from a third party, not Triebenfeld.'
oe1bu9454-093: Encloses a royal decision obtained on the Prince's latest petition, with Minister von Struensee laying the files before the King and Colonel von Köckritz, praised as the Prince's only real advocate at court, presenting a memorandum. In it Triebenfeld offers, should Polajewo obstruct matters, to lease the estates for 30 years, building six peasant farms yearly and clearing waste land at his own cost, paying 20,000 Rthl rent and making good any shortfall. He will next pursue the 7,000 Rthl for the Niedernhall business, and advises courteous but plain speaking to the departing minister.
oe1bu9454-094: Notice that the King, in a letter going out by the same post, wants the true value of the Prince's South Prussian estates and of Krotoszyn and Polajewo examined more closely so that the properties can be weighed against each other; the writer assures the Prince that, barring serious obstacles, the King will gladly grant the proposed exchange. He thanks the Prince for his confidence of the 7th, notes the business falls outside his own department, and promises his warm support.
oe1bu9454-095: Reports that Colonel von Köckritz sends his regards and considers the estate-exchange business as good as concluded, though he will not write until all is done, and that the Privy Councillor of the Cabinet acts against his own feelings on the sovereign's orders. Denounces as lies what the Prince has been told about the division of the department, warns that a hard refusal was planned before the departure and that Mr. von V. may again put false representations before the well-meaning King, and dismisses the secularisation question as French bait, with rumours of peace with the Emperor.
oe1bu9454-096: Reports that Colonel von Köckritz considers the exchange as good as approved, delayed only by the King's illness, which bars an audience for Bernhardi to present it. Urges the Prince to write at once to the King applying for leave to travel to Öhringen and send it by express courier, and to come by way of Berlin rather than Bohemia. Promises advice on the secularisation business, and denounces Wedel in Breslau over the Krotoszyn affair and a claim that Prot. could bear 50,000 Rthl.
oe1bu9454-097: Word from Colonel von Zastrow that the King, now tolerably recovered, would be pleased to see the Prince in Berlin for a couple of days; Triebenfeld urges him to come and to raise the question of a stay in the Empire himself, doubting a six-month absence from Silesia would be well received. The estate exchange is to be examined so that neither state nor Prince loses, then confirmed by cabinet order, despite Minister von Voss's furious opposition. Advises silence on the secularisation schemes.
oe1bu9454-098: 'Court news and advice from Berlin: Triebenfeld will stay until the quarters question is settled but sends Glenck ahead to take the Prince''s orders. He reads the King''s invitation, and the goodwill of Köckritz and Zastrow, as an honour worth a three or four day stay. He reports Prince Solms''s secret marriage to the widowed Princess Louis, her loss of the style of Royal Highness and his posting to Ansbach; warns of Minister Hoym''s and Wedell''s double dealing; urges silence on the secularisation scheme, better pursued in Vienna with Prince George.'
oe1bu9454-099: 'Reports on lobbying in Berlin for the Prince''s acquisition of the Krotoszyn estates: von Zastrow''s reply is enclosed, von Voss has moderated his tone, Nöldichen is in difficulty, and von Köckritz says the matter will go to Knobloch and Prittwitz, whom Triebenfeld has urged to take Wildeganst as assistant. He passes on Berlin talk of imminent war and of new cabinet councillors, asks for a commission councillor''s patent for Carl Theodor Fischbach at Betsche, and promises to prove Broniewski has drawn more from the estates than was owed him.'
oe1bu9454-100: A copy of a brief reply from the cabinet secretary Beyme, reporting that the King, having been shown the Prince of Hohenlohe-Ingelfingen's letter of the 21st, has ordered that any answer be held back until the report called for from Minister of State von Voss comes in, an outcome the Prince had himself anticipated. Noted as received on 1 February 1799.
oe1bu9454-101: 'A copy of the Prince of Hohenlohe-Ingelfingen''s renewed petition to the King, rebutting point by point Privy Minister of State von Voss''s rejection of his proposed exchange of his scattered South Prussian estates for the lordships of Krotoszyn and Polajewo: on the reserve fund of 9,540 Rthl, a Hollander Hufe acquired by Triebenfeld, the woodlands ruined by von Goerne, and the estates'' noble rather than domain status. He now renounces Polajewo, offering 8,000 Rthl yearly toward Krotoszyn, and asks that the Posen Chamber and Count von Höym investigate.'
oe1bu9454-102: Minister von Voss is expected at Krotoszyn in about three weeks to examine the business there, and von Prittwitz should attend in person; Chelmshi has lost at second instance. Reports that nothing is likely to be recovered at Posen, that dismemberment and an exchange with Broniewski will go ahead, and that Glenck's survey of Kaemen and Kulm yields some 6000 Rthl in interest. Advises applying to the Grand Chancellor for a five month extension over Brzyze, where the Prusimski daughter's claim and a threatened confiscation, quietly shelved by Minister Hoym, press. Notes the Winieces forest dispute and unrest in South Prussia.
oe1bu9454-103: 'Reports on the lawsuits over the granted estates: instruction in the Broniewski case falls due on the 14th, the opposing patron would settle for some 20,000 Rthl, but Rapacki''s proofs show he is owed nothing, so settlement is deferred unless the Krotoszyn exchange demands it; the Chelmski suit is won at second instance, while Brzyza and Winzingerode need watching. A defence against Prittwitz and the Minister''s claim that too much was given, comparing revenues of 8,640 and 20,000 Rthl and sale prices of other estates, is to be submitted by Glenck.'
oe1bu9454-104: Pledges on his honour that the Prince's business will be concluded within two months, honourably and profitably, and insists a valuation of the estates is being blocked from a quarter the Prince knows. The King has approved the proposed exchange provided the estates balance in value, which Triebenfeld says is secured; he refuses anything resembling begging for favour. Count Schlabrendorff will take a bill of exchange at a year for his interest; Prittwitz is denounced as a liar. Estates sold to Prince George are now valued above 700,000 Rthl.
oe1bu9454-105: 'Reports that Count Schlabrendorff has been paid interest of 11,085 Rthl, with a receipt made out to the Prince himself, while Triebenfeld has nothing towards his own costs. He complains that the Princess refused to receive him despite three requests, blaming von Prittwitz''s claim that he is hated by the King and public. News from Glenck on the Prusimski lawsuit looks bad, so he will use the blank signed forms to ask the Grand Chancellor for an extension. Court and military news from Berlin: the Queen''s illness, the King''s activity, no prospect of war.'
oe1bu9454-106: Dismisses a purchase offer relayed through the court fiscal Michaelis as a broker's scheme by the Jew Dann, who claims he can bring in von Eckart, buyer of the Lichtenau houses, and has put similar plans to Prince George. Warns that after a decree for non-appearance by the Posen government the Brzyz estates are to be taken back, that the Chambers and forest officials are intriguing for the woods, that costly suits multiply, and that the ministers will block the exchange unless the monarch orders it.
oe1bu9454-107: 'Forwards a letter from Colonel von Zastrow, brought by a huntsman, and holds back an expected royal cabinet letter until the Prince''s own arrival in Berlin. Reports on the Prince''s marital dispute: Princess Sacken refused to receive Triebenfeld, declares she will never return, wants to live where she pleases on 2,000 Rthl allowance, and blames personal aversion and the Prince''s debts. Names her supporters, including Professor Selle and the advocate Cosmar, urges firmness, and passes on court rumour that Suvorov has been beaten and captured.'
oe1bu9454-108: 'A desperate appeal for rescue: Prince George ignores Triebenfeld''s letters, relayed through President von Schuckman, and sends no money, while the estates he sold the Prince for 280,000 Rthl are already burdened with some 270,000 Rthl, including 55,000 drawn through Schuz and 23,000 in bills. Kuh has a writ of execution for 5,800 Rthl and arrest threatened by Friday; Lupman Meyr''s 20,000 and 12,000 due 7 August follow. He proposes to flee and confront the Prince.'
oe1bu9454-109: An agitated letter to a confidant urging that an informant, whatever his character, be courted for what he can reveal about certain frauds, and denouncing Wildegansch, who claims to be the Prince's envoy while having invented a money negotiation with An and Schlabrendorff to cheat him over costs. Bukowiecki offers only 2400 Rthl yearly rent for Betsche. Triebenfeld fears execution proceedings by the Jew Asch over an 11,000 bill of exchange given to Schlabrendorff, and bailiffs reaching his wife.
oe1bu9454-110: Reports that the instruments covering all the ecclesiastical estates have been settled, to be sent on to Breslau by the earliest post, though the office at first demanded 2½ times as much again because of the value given in an earlier ministerial report. Triebenfeld has paid some 240 Fr and about 200 Rthl with money borrowed from Privy Senior Auditing Councillor Mathias, repayable within a fortnight, and presses the Prince to remit it at once; a further matter is to be reported next post.
oe1bu9454-111: Reports failure to raise the money to redeem a deed, Wildegansch having destroyed Triebenfeld's credit in Berlin; he has paid 300 to the friend who arranged the business as earnest money and cannot spare more from his travelling funds without being stranded. He begs the Prince to send an order to pay 240 f., that is 200 Rthl Courant, so the deed can be redeemed, and promises, given bad gossip, to keep in the background and act coldly.
oe1bu9454-112: 'A panicked postscript: Court Councillor Wünster has warned that judgment has been given on a bill of exchange for 11,000 Rthl signed by Triebenfeld for the Prince, and that he faces arrest, with the bailiff Rudolph already calling at his house. He blames Wildegans and the Jew Heymann for destroying his credit and for fleecing Prince George, who has sold Triebenfeld''s estates for 750,000 Rthl, and begs the Prince to press Count Schlabrendorff to recover the bill from the Jews and allow an extension.'
oe1bu9454-113: 'A desperate appeal over the 11,000 Rthl owed to Asch and Gad: despite the Prince''s assurance that the matter is settled, an order for arrest still stands against Triebenfeld in Berlin, and he hears he will be seized at once if the promised 4,000 Rthl is not paid. Prince George will commit to nothing and lets the business drag on. Wildegensch offers to wait until John''s day, which Triebenfeld says would not save him; he begs that the 4,000 Rthl be paid and his honour and liberty secured.'
oe1bu9454-114: A short, damaged and partly illegible note, apparently to Triebenfeld rather than from him, abusing an unnamed opponent as a rascal who made difficulties for the Prince and now, with nothing more to be got, wants the matter closed; urges that the favourable moment be pressed. The writer reports his own affair going neither well nor badly, notice given against Asch the elder, a large bill of exchange expected to be settled within days, and his health improving.
oe1bu9454-115: 'Excuses himself from attending at midday: his tenant at Schwammen has sent word that the peasants are refusing their labour services, and he must ride out to prevent disorder. Reports a conversation with the Minister about Schlabrendorff, who has been summoned for the 15th over the Quist affair and urged to drop all complaint, since he is closely watched and the Minister could not protect a relative if any blemish were found. Asch is to press the point with the Count at Stolze.'
oe1bu9454-116: 'Too ill to travel for instructions, Triebenfeld reports that the Poles keep using him as negotiator over the sale of the estates while no settled plan exists: rumour has it that 150,000 Rthl of debt on Trąbczyn would pass to Walichnowski, who is also to take on 56,000 Rthl and a yearly charge of 5,000 Rthl. He urges a fixed demand of 60,000-80,000 Rthl purchase money plus 4,000-5,000 Rthl annual hereditary rent on first mortgage, warns of damage to the Prince''s honour, and asks that the note be kept from Wünstere.'
oe1bu9454-117: 'Reports progress on the 30,000 Rthl due to von Grotowski: Weigel, backed by a guarantee, confirms the money and interest lie ready with him, but the bank will not discount until Grotowski executes a deed of cession in court, a draft of which Court Councillor Ebersbach has prepared. Asks the Prince to forward Weigel''s enclosed letter by express, and a further letter to Grotowski''s agent at Kalisz halting the forced sale. Notes the deaths of Captain von Müllern and Morgenbesser, urges the Prince to spare his health, and passes on news of Nelson off Toulon.'
oe1bu9454-118a: 'Reports on rival buyers and lessees: two colonists from Olesnica, brought by an agent named Kunckel, offer 1,500 Rthl but want a contract, though Triebenfeld judges them speculators unable to find the 17,000 Rthl due at Martinmas and Midsummer and likely to bring lawsuits. Kunckel is also commissioned by a chief district steward Nerlich, who has 80,000 Rthl in cash for Trąbczyn or Zagorow on hereditary lease. Walichnowski and Urbanowski are also interested; instructions are requested.'
oe1bu9454-118b: Countess Schlabrendorff will wait for repayment of 50,000 Rthl until 1 January 1805 but no longer, Homuth having failed to obtain a longer term; she complains of her losses and of receiving no interest. If no interest is due until then, Triebenfeld advises accepting, since 2,500 Rthl is saved and money will have come in. Homuth wants the settlement drawn up for her signature and will try to recover her old bills of exchange. The surveyor Cabanis has set off, hiring a peasant's cart for 4 or 5 Rthl rather than a coachman at 20.
oe1bu9454-118c: Countess Schlabrendorff will wait for repayment of 50,000 Rthl only until 1 January 1805; Homuth could not persuade her to a longer term, and she complains bitterly of her losses since she draws no interest on the capital. Triebenfeld advises accepting, since no interest is due meanwhile, a saving of 2,500 Rthl, and asks the Prince's agreement so Homuth can draw up the papers and try to recover her old bills of exchange. The surveyor Cabanis has left, hiring a peasant's cart cheaply.
oe1bu9454-119: Reports that Uminski, through Prince Biron, called the price of the Kaemen estates too high yet asked for a letter accrediting him to inspect them; Triebenfeld thinks he is trifling, since Broniszewski still occupies the estates. Encloses a survey table from Glenck showing some 31,000 Morgen of manorial land available for division, and proposes sending the surveyor Cabanis to recruit around 500 well-off Hussite farmers, who paid 25,000 z. for 23 Hufen at Petsche, as settlers. Rapacki's buyers want overlong payment terms and are rejected.
oe1bu9454-120: Reports that Cabanis has returned with word that Hussite settlers in Hussenich, Rentsch and nearby are willing to buy, find 300 Rthl per Hufe with 15 Rthl annual rent fair, and have sent word to their Moravian brethren to make up the numbers; they should appear within a fortnight, and Cabanis is to press the matter through the clergyman at Hussinitz. Countess Schlabrendorff refuses to release the instrument until a further 50 is paid. Asks a few Thaler for Kunckel's destitute, sick mother.
oe1bu9454-122: 'A brief note forwarding an enclosure that had been left behind at Triebenfeld''s former lodgings: Herr Homuth has sent again and presses urgently for settlement of 166 Rthl 16 Groschen so that he can confirm receipt to the messenger. Cabanis is leaving by post for Hussinietz, from which Triebenfeld expects a quick and favourable outcome. Nothing at all has come in that day from Berlin or Frankfurt an der Oder.'
oe1bu9454-123: Forwards a letter just arrived by express courier from Kunckel and asks the Prince for instructions, urging that a settlement be reached with von Otocki, ideally amicably for 1,500 or 2,000, and leaving it to the Prince whether Kunckel should be given power to settle. Warns that Kunckel and Jentsch are working against each other, the one rash, the other spiteful, and advises keeping both in check. Glenck failed to call again, leaving the Kontop accounts behind.
oe1bu9454-124: 'Submits a draft reply to Kunckel for the Prince''s approval, asking whether it matches his wishes, and requests that someone else be allowed to make fair copies of the two letters: Triebenfeld is crushed by grief, his wife being buried that day, and has withdrawn with the children to his brother in law''s house. He promises to explain everything fully in a further letter once he has collected himself, and notes that he has a map of Kopojno, Skokum and Swiątniki.'
oe1bu9454-125: A brief note announcing that the men from Olesnica have arrived with the money and wish to wait on the Prince of Hohenlohe-Ingelfingen at four o'clock. Triebenfeld reports having already negotiated something with them, the details of which he will lay before the Prince that afternoon, and expresses confidence that the terms he has obtained will meet with approval.
oe1bu9454-126: A short note reporting that Cabanis has returned from the Hussites, who have taken an extraordinary liking to the land and mean to fetch their fellow believers and settle everything within a fortnight. Cabanis brings much other news that Triebenfeld must relay in person, and someone should go there at once. Triebenfeld is meanwhile dealing with the Olesnicas people and asks the Prince to call on him for a quarter of an hour after the parade to hear them himself and give orders.
oe1bu9454-127: 'An urgent appeal for 900 Rthl: with the Prince having paid not a Groschen of interest, Triebenfeld must himself meet 700 Rthl promised for the inventory under his guarantee, 175 Rthl interest since 1799 and 35 Rthl costs, some 910 Rthl in all. His cash is gone after paying 1537 Rthl 12 gg the day before in the Nudnichisch matter; Wildegans and Heyman Pincus promise settlement but nothing comes, and execution threatens. He offers repayment from timber monies at Midsummer.'
oe1bu9454-128: 'Reports on efforts to clear up the estates'' tangled affairs: eleven lawsuits postponed and to be settled by composition; buying out the tenants, Otcibi agreeing to quit for 3,000 Rthl plus 2,000 security and 1,000 for seed and housing, while Flörten and Rybbel might be awarded 11,600 Rthl under a badly drawn contract, so execution and sequestration have been sought. Purchasers found for 87 Hufen with the district administrator''s help; Glenck is reported mocking the Olesnice contract and touting loan brokerage.'
oe1bu9454-129: Anxious at the absence of letters from Berlin and Frankfurt an der Oder, Triebenfeld asks the Prince for any reassuring news from Glenck. Amelang's silence over the plan put to him has dashed hopes for Kolzig, so the sale of Kontop must now be pushed hard. He has called in Bernhardi, the tenant, warning that such a man might talk down the estate to keep his lease or be bribed by a buyer, and sent him back to receive Budolf and Stubenrauch well.
oe1bu9454-130: 'A hurried report on arrival that nothing has been settled: Glenck has travelled on and Leixner is away until the next day, and the parties do not trust one another. Triebenfeld describes his agreement with Mr Bernhard that the estates stay in the Prince''s name while Leixner takes over elsewhere, under the Prince''s name or Triebenfeld''s own; Leixner, pressed and blocked by Count Schulemburg, wants only the use of Triebenfeld''s name. An express courier has been sent after Glenck; Triebenfeld goes to Berlin, then Bersch.'
oe1bu9454-131: Reports from Berlin that every prospect of money there is a lie and that nothing could have been raised, so the Prince would have been deceived had Triebenfeld not come. He will return to Frankfurt an der Oder to conclude with Leixner over Kaemen and find the funds needed for Koschentin, and will press for Koltzig or a loan; the King is unwilling to lend since Russia wants war. In the Broniewski matter arrest will be granted if grounds are shown, but not without 2,000 Rthl in friedrichs d'or; he blames Mell. and Glenck for the delay.
oe1bu9454-132: Departing for Breslau after a fruitless wait on Mr Glenck, Triebenfeld complains that speculators are profiting barbarously at the Prince's expense, citing 30,000 marks made at Betsche and worse expected at Kaemen. He urges instead that Chamber Director Stubenrauch buy the estates and find the money by Midsummer, offering to guarantee 10,000 Rthl yearly, or 12,000 if no entry money is taken; values of 180,000-300,000 Rthl are canvassed. He wants an express courier, and caution with the Cabinet Councillor over Koltzig and indemnification.
oe1bu9454-133: 'A gloomy progress report on tangled deals: nothing done by Glenck, whom Triebenfeld waited three days in vain for; Leixner, unnerved by fraud at Betsche, wants out of his contract and refuses obligations over Kaemen; the Order''s Chamber, the Harlem purchase and a 100,000 Rthl loan from the Invalids'' Fund all rest on mere prospects. He reports Beym''s advice to the King to settle the Prince''s compensation claim by remitting his 200,000 Rthl debt, Köckritz''s counter-moves, and talk that war would bring the Prince the command.'
oe1bu9454-134: 'A despairing report that the Invalids'' Fund loan has collapsed: Court Councillor Lengnich, engaged by building councillor Glenck for 25 Fr., recast the Otto valuation downwards to 78,000 Rthl, wrecking credit in Frankfurt an der Oder and the prospects of sale. Stubenrauch has withdrawn; Glenck''s written undertakings to disreputable speculators may bring 50 lawsuits. Amelang reports Beyen''s offer of the King''s debts as a gift instead of compensation for the Brzyzer estates, with the confiscated Kolzig estates proposed instead. Triebenfeld will seek 120,000 Rthl on Kontop and Zagorowo.'
oe1bu9454-135: 'Chamber councillor H. K. Werner claims a 2 per cent commission on the sale of the Prince of Hohenlohe''s South Prussian estates Kaemen and Kolno, enclosing a copy of the Prince''s sealed undertaking of 17 December 1803 and threatening a judicial attachment on the purchase money if the general attorney Glenck disputes it. Also filed: Glenck''s enquiry about a 60,000 Rthl second mortgage behind 100,000 Rthl on estates valued at 200,000 Rthl, and Stubenrauch''s refusal, the estates being in ill repute from repeated touting.'
oe1bu9454-136: 'Congratulating the Prince on the sale of Kolno and Kaemen, Triebenfeld reports that buyers will pay the 76,000 Rthl in hard coin, to go to the Foundry Department, and that a fresh judicial valuation secured this; he awaits Glenck''s power of attorney. Also: a Zagorowo mortgage and Lichnowski''s offer behind 130,000 Rthl, the reckoning with Radzimski at Szetlewek, eviction of the Floricke tenants, plans to dismember Trąbczyn and settle Mennonites on some 400 Hufen, Minister von Voss''s 1 July deadline, and a bitter denunciation of Glenck.'
oe1bu9454-137: 'Wiener, Meyer Bernhard and associates are denounced as bad faith debtors: after promises in Berlin they now undertake to remit 76,000 Rthl plus some 20,000 in bank obligations by courier, withholding 30,000 on the pretext that the Prince has bought back Betsche, with a further 10,000 wrung from Meyer Bernhard. Triebenfeld reports securing, through the Grand Chancellor and General von Köckritz, the deposit of the Bruniewe monies, worth perhaps 70,000 Rthl; Köckritz holds out estates in hereditary lease rather than cash, and Princess Sacken has called in 30,000 Rthl on Koschentin.'
oe1bu9454-138: Amelang reports that a renewed first attempt at the deposition in the von Broniewski matter came to nothing, as a resolution of 25 June shows, and that he pressed again for reconsideration. Acting on von Triebenfeld's word that the Prince would if necessary lodge security to gain possession of the estates, he offered 10,000 Rthl; the deposition and the vacating of Kolno and Kaemen have now been ordered of the Government at Posen.
oe1bu9454-139: 'A furious report that the settlement with Broniewski cannot now be undone: Glenck submitted it for approval on the 6th, two days before the Prince''s written protest arrived, and it was confirmed and sent to the court despite a rescript about the deposit. Metzer and Wünster each blame the other, while conceding that a deposit of even six days would have broken Broniewski; liquidation proceedings may run 6 to 8 years. Triebenfeld will go to Betsche over Bornstädt''s mishandled eviction.'
oe1bu9454-140: 'An urgent express report that the sale of Betsche to the peasant communities is collapsing: Rochlitz, through his cousin the merchant Klein, holds a ceded contract claiming the demesne farm and woodland, while Councillor von Glenck is said to be urging the villagers to withdraw and has stalled Meyer Bernhard''s payment of 66,000 Rthl. Triebenfeld begs the Prince to order Glenck and Lieutenant von Brandenstein to surrender and judicially cancel both contracts, and asks how to answer von Bornstädt''s claim to 1,000 Friedrichsd''or promised for selling Betsche at 200,000 Rthl.'
oe1bu9454-141: Laid up with a bilious fever, Triebenfeld reports that the compromise settling the Bruniewski business is so defective as to give no security, and must be redone, though Bruniewski's wife cannot be found. He accuses Wanstern (Wünster) of taking bribes from Bruniewski and Guderian and foisting the bargain on the guileless Glenck. The Jews M. Bernhard and Simon offer 6,000 instead of 13,000 Rthl; he insists on full security, deposit of 66,000 Rthl, and 30,000 Rthl from Betsche, and defends his openness with Glenck.
oe1bu9454-142: Confined to bed by illness and barely able to write, Triebenfeld reports that Bornstädt intends to leave, probably out of money, and urges that his claims be settled before he goes. He asks the Prince to order Glenck, who answered his civil request with a curt note, to hand over the lease and settlement contracts and accounts made with Bornstädt, and to offer 5,000 Rthl as a final settlement, against Braun's estimate of 7,500 Rthl plus the honorarium promised in the Betsche purchase.
oe1bu9454-143: Amelang, writing from Berlin, acknowledges the Prince of Hohenlohe-Ingelfingen's notice that the indemnification matter has been settled and that the Prince declares himself satisfied with how it was concluded. Beyond that acknowledgement the letter contains only the wish that the King's favour towards the Prince may match his services to the State, with closing expressions of reverence and devotion. No figures, conditions or further business are mentioned.
oe1bu9454-144: Acknowledges the Prince's instruction of 31 October and reports that its writer, Amelang, will call on Count von Schulenburg the following morning, hand over the letter addressed to him and hear what he has to say, promising to report the outcome of the interview by the next post. A short holding note, reporting nothing of substance beyond the arrangement of this errand; parts of the closing lines are hard to read.
oe1bu9454-145: Reports a carriage accident on the road, which has stranded the writer in Kalisz while repairs are made. Court Councillor Grimm is seriously ill but will prepare work for von Radzinski if the contracts can be supplied. Honrichs is refusing to pay 4,000 Rthl despite the receipts being settled; Grimm wants to sue at once but lacks the contract, held by Nochlitz, and a power of attorney. Asks that the contract be recovered from Köckritz urgently. Complains that orders at Trąbczyn contradict his plan, 100 bushels of grain having been lent out irrecoverably.
oe1bu9454-146: Reports that the Mennonites, through their elder Pankratz, mean to buy Zagorowo and Trąbczyn outright at the Prince's price and divide the land among themselves; Triebenfeld will travel to Lunau to close with them. He asks the Prince to obtain written undertakings from Building Councillor Glenck returning 300 Morgen and admitting the komornik holdings were wrongly sold to von Małachowski, since these claims have stalled the valuation. Complains of the surveyors and of district administrator von Blomberg, and reports an execution for 6,500 Rthl in the Przespolewski case.
oe1bu9454-147: 'Reports on an exhausting recruiting journey through West and East Prussia: the Mennonites are willing to build and promise to come to Breslau on 19 December to sign, though they scattered too widely to sign heads of agreement on the spot and want the drink-selling rights valued in. Settlers from Landsberg and the Oderbruch have been summoned as rivals, and parcelling of plots is refused. The estate assessment drags for want of data; Glenck''s countermanding orders and accusations prompt a threat to lay down the pen.'
oe1bu9454-148: 'Challenges Glenck''s revenue table for the estates: Swięcia is entered there at 1,800 Rthl yearly interest on 10,000 Rthl capital, but a revision by assessors completed that day yields only 918 Rthl. Triebenfeld argues the 3,792 Morgen property has been given away far below worth, a loss of 47,340 Rthl, which with a 48,000 Rthl loss on Olesnica makes 95,340 Rthl against the Prince. A short, indignant note, unfinished at the foot.'
oe1bu9454-149: Awaiting settlers from the Oder and Netze marshes, Triebenfeld reports selling waste corner plots profitably and holds to his plan that no Hufe go for under 600 Rthl; a valuation of the Zagorowo estates should exceed 400,000 Rthl, letting him borrow in Berlin to pay Schlabrendorff, Legnowelii and other pressing creditors. Quarrels with Glenck and the Olesnica hereditary lessees have made him ill. The Wrgbiner subjects refuse their contract, protesting forced labour and Glenck's intended sale of them with the bailiff's holding to von Marowecke for 15,000 Rthl.
oe1bu9454-150: 'A note of a creditor''s demand and the answer sent: the provincial elder von Lichnowski claims 5,572 Rthl 12 Groschen in interest arrears for the eighteen months from 4 May 1803 to 4 November 1804, reports that he obtained a mandate from the government at Kalisz ordering payment within fourteen days, and, nothing having come, threatens to apply for sequestration while professing goodwill and hoping for settlement by Christmas. The reply blames non-paying tenants and points to von Triebenfeld''s presence.'
oe1bu9454-151: 'Progress report from Trąbczyn: Mennonites have arrived wanting to buy both estates, but deep snow halts surveying; 100 Hufen of the Grądzin and Drzewitz woodland are offered at rents worth 3,000 Rthl, or 60,000 Rthl capital. Revenues fall far short (Suvigria 918 instead of 1,800 Rthl, Wrąbczyn 1,123 instead of 1,500), forcing the whole assessment to be redrawn. Lichnowski''s arrest cuts the Olesnic payment to about 6,000 Rthl; some 8,000 Rthl promised for Christmas.'
oe1bu9454-152: Reports that a free pass for Hohenlohe wines and 25,000 Rthl will follow shortly, but that debts registered by Glenck burden not only Swiecia and Olesnica but every part of the Zagorowo estates, a fresh obstacle to the planned division of the property. Nothardt's death, leaving 28,000 Rthl of debts, and von Goldbeck's arrival as president at Kalisz are judged unhelpful. Bernhardi failed to supply promised money; funds have been raised in Berlin instead.
oe1bu9454-153: 'Reports difficulty raising 25,000 Rthl: Herr von Stein, now President of the Bank, has again banned all discounting, and although the Invalids'' Fund or the Potsdam Orphanage would advance 140,000 Rthl, neither will accept payment by instalments or lend before the formalities are settled. Triebenfeld is working with Amelang for an interim 25,000 Rthl. Business is at a standstill, the Widows'' Fund and Orphans'' Board fear South Prussian bankruptcies, and the King is asking where the millions sent there went. Breaks off mid-sentence.'
oe1bu9454-154: 'Reports that a loan is progressing well and under examination by a reliable man, and denies Wollenhaupt''s talk of a sequestration: Lichnowski has lifted the attachment over interest for six weeks and, on Grimm''s assurance, so has the one obtained by Magnuski, though the Dębinska woman has attached again to stop any payment to Magnuski; Przespolewski cannot be owed 30,000 Rthl. Denounces a letter from Blomberg, who threatens to block the dismemberment unless his demands are met, and reports warning him off.'
oe1bu9454-155: 'Reports, on the Prince''s orders, an interview with Chancellor Hohmuth about the Schlaberndorff debt: Countess Schlaberndorff, provoked by delay, will renew her suit unless 25,000 Thl is paid before the next Berlin post day, after which Hohmuth would persuade her to wait for the remaining 25,000 Rthl; he would not consider, or even propose, a bond for that second payment. Notes that Nurlich left with a wild boar for Government Councillor von Kreczinski, travelling via Kalisz to Trąbczyn.'
oe1bu9454-156: Explains why the 25,000 Rthl loan cannot be raised in smaller portions, since the same securities must be pledged either way, and blames delays on young Eysenhardt, whose claimed 18,000 Rthl and Court Councillor Meyer's proposed transfer of 20,000 Rthl Triebenfeld has refused pending the Janvelen suit and because 9,000 Rthl are secured on Szetlewek. Complains of Bernhardi's diverted 3,200 and 1,200 Rthl. Encloses a copy of Countess von Schlabrendorff's threat to resume her Berlin suit over her children's overdue settlement money.
oe1bu9454-157: Reports that General von Köckritz has secured a promise of a loan from the Invalids' Fund, though the timing is uncertain amid a severe shortage of money in Berlin, with the Bank and the Maritime Trading Company not discounting. Once granted, Triebenfeld will draw 60,000 Rthl, repay the 10,000 already taken, and remit 50,000 Rthl to satisfy the Schlabrendorff woman. He will pay interest to Giraud and Haukt and reassign an 18,000 Rthl mortgage, and has written to Homuth to calm the Countess.
oe1bu9454-158: Reports that through General von Köckritz's mediation the Invalids' Department will lend 150,000 Rthl, 50,000 at once on mortgage and Triebenfeld's bill of exchange, the remaining 100,000 after the Chamber revises the assessments at Kalisz, repayable over 50 years; other funds and banks have stopped lending into South Prussia, leaving only usurious bankers. He will settle the 10,000 Rthl demanded, has closed the Tirard and Hauk matter, advises against suing for brokerage, defends his honour over the Schlabrendorff affair, and dismisses Wöllenhaupt on dismembering the estates.
oe1bu9454-159: Reports that after great difficulty Amelang has obtained an instruction on the bank to pay the brothers Kuh, in advance of monies from the Invalids' Fund tied up in a negotiable obligation of 36,755 Rthl 7 Groschen; the instruction is forwarded and the Prince is asked to have the accompanying letter to the Kuh brothers delivered at once. The Hang and Eysenhardt affairs are to be settled next, after which Triebenfeld will go to Kalisz to pursue a loan of 100,000 Rthl.
oe1bu9454-160: Reports that the Invalids' Fund has at last released the Maritime Trading Company bonds, enabling payment to the banker, with a further hundred thousand to follow once the Chamber has reviewed the assessments; brokers take 6 per cent. Gerard has been paid 900 Rthl interest against a promise not to call in the capital, Seebald's deal collapsed but saved 1,800 Rthl brokerage, and Eysenhard is next. Urges expelling the Olesnica men, who have protested against dividing the woods over their firewood rights.
oe1bu9454-161: Acknowledges the Prince's letter of the 3rd, which arrived just as von Triebenfeld was leaving Berlin and which pleased him by expressing satisfaction with his efforts. Reports that payment of an assignation has already been made at the counting-house, the rest depending on review and dispatch of the matter; complains that the authorities now apply shifting principles and let four weeks pass over business settled in three or four months earlier with fewer scruples. Written by a third party, not Triebenfeld.
oe1bu9454-162: 'Reports that a new order from the General Finance Department, forbidding any Chamber to commission revision of a judicial valuation without its knowledge, has stalled the revision of the valuations: it arose from Prince George having councillor of war Korn revise valuations Korn himself had made. President von Goldbeck has applied for permission, pressed by express courier through Amelang and Langen. Asks the Prince to send three bronzed busts and a washbasin to gratify Goldbeck; the Olesnica case has gone back to the patrimonial court.'
oe1bu9454-163: Reports on a hearing due at Trąbczyn against the Olesnicers, who protested with the district councillor to avoid paying 10,000 Rthl. Recommends closing with von Otocki, who offers 10,000 Rthl entry money and 1,500 Rthl yearly for Szetlewek in hereditary lease, plus drink-selling rights of both estates at 4,000 Rthl, and further woodland. Urges annulling Honrichs's contract in favour of Meierowitz, suing Szczucki and Ceizewski, paying old Lichnowski 1,390 Rthl, and sending plate to bribe the Chamber President.
oe1bu9454-164: 'Still no resolution from Berlin on revising the land assessments; Triebenfeld blames Amelang''s slowness and obstruction traced to Prince George and the Kalckreuths, and will if need be have the district administrator attest the figures. He expects large sums: 10,000 Rthl from Otochten, 2,000 Rthl propination rent, and 20,000 Rthl plus a 500 Rthl annual payment from Meierowitz once Honrichs is settled. Noblemen are bidding for the lands to be divided. He reports Chamber edicts of December 1803 and January 1804 forbidding the Oleśnicki hereditary lease, concealed by Glenck, and notes the Prussiemski papers at Kowal and his own failing health.'
oe1bu9454-165: 'Forwards further papers arrived by that day''s riding post from Mr. Glenck, together with an extract copied from a postscript the Prince ordered added to a letter already posted, thought likely to be of use. Reports on the Prince''s health: the attack has moved from his right hand to his left foot, painful the previous day but easing overnight. Notes the arrival at Breslau of Bernhardi, mining councillor, himself unwell, whom the Prince sent Hahn to reassure, and wishes Triebenfeld recovery.'
oe1bu9454-166: 'Reports a hard-won victory over Minister von Voss and the Finance Department, whose inhibition halted the dismemberment and scattered the purchasers: a Chamber commission sent to check the sales has verified Triebenfeld''s six points, accepted clear annual revenues of 31,000 Rthl and lifted the inhibition, so that 300,000-400,000 Rthl could be raised and 180,850 Rthl still owing applied to debts. He pleads exhaustion and his own losses of 19,500 Rthl, and must leave for Schweinen and Kontop, entrusting collection to Schenck.'
oe1bu9454-167: 'A short covering note from the Prince''s secretary Hahn, sending on an enclosed letter at the Prince''s command: the Prince was setting off for church with his father and the courier left within the hour, so he could not write himself. Hahn reports that the old Prince is in very good health for his age and much attached to his master, and confirms that the return to Breslau is fixed for the 25th.'
oe1bu9454-168: Deep snow halts work, but contracts with the old peasants and their dues are now settled before the court, and talks proceed with von Otocki over Szetlewek and the tavern rights. Amelang reports well of the loan; Klewitz will allow the dismemberment if land goes for rent rather than cash. Glenck is accused of obstructing sales with Wollenhaupt and others, and claims totalling 3,011 Rthl from Winnicki's heirs, Chwalowski, Sprengel and Wollenhaupt are disputed.
oe1bu9454-169: 'Reports that Minister von Voss has flatly forbidden any revision of the assessments, and weighs relying instead on the district councillor''s certificate, since dismemberment will make the administration accounts fall away; a councillor is being sent to Zagorowo and Trąbczyn before consent is given. Sets out a plan to raise 130,000 Rthl: settlements with Meierowitz, Weigel, Schliefen and Honrichs, Radzinski''s offer for Szetlewek, hereditary lease of Olesnica, and a three-year lease of the drink-selling rights at 4,000 Rthl yearly.'
oe1bu9454-170: 'Reports, on the Prince''s orders, on confronting two estate servants with complaints against them: the forester Bezold, met at ErtheSchweiner, who showed no alarm and asked who had blackened him with the Prince, insisting he did all he could for the lordship; and the district steward Käufer, found in Breslau, who claimed testimonials from creditable men, valued his good name, and said he could face any investigation calmly. Notes the Wüsten leave by carrying post.'
oe1bu9454-171: 'News of the Prince of Hohenlohe-Ingelfingen''s health, sent by Hahn as a courtesy: the sore on his foot is almost healed and painless, though the foot remains a little swollen, and he is otherwise perfectly well. He sends his regards to Triebenfeld. The Order of St Andrew pleased him, but the Emperor''s gracious behaviour pleased him more; he is enchanted by the young monarch, who is said to have spoken flatteringly of him in Breslau.'
oe1bu9454-172: 'Reports from Trąbczyn on pushing through the dismemberment of the estates with Eyster: the main appointed day is put off to Monday so that contracts for all parcels can be concluded. Quotes President von Goldbeck''s letter to Minister Voss admitting that councillor of war zur Höllen made grave errors, that the Chamber had already consented, and that the matter cannot be reversed. Notes Mona Kunckel''s arrest, a hearing over Szetlewek, and a fresh claim by the Winnich heirs for 1300 Rthl of surveying arrears.'
oe1bu9454-173: 'Reports that a memorandum of heads of agreement between Rochlitz and Honrichs over Witów, with its power of attorney, cannot be found in the Trąbczyn archive despite searches by old Tiel and justice-burgomaster Schenck, and urges the Prince to order Glenck to produce it or lose a gained advantage of 14,000 Rthl. Also: Blomberg demands 1,000 Rthl in advance, a Chamber councillor will review the dismemberment plan, projected gains of 350,000 Rthl, names wanted for new villages, and objections to Schenck''s contract terms.'
oe1bu9454-174: Argues that combining the justiciary's post with cashier's duties would end fraud over actuary's fees, carriage services and board and save some 600 Rthl, with rising fees of 1200 Rthl leaving a surplus and making an advocate unnecessary. Asks the Prince to have Hahn frighten his own steward Käufer and forester Pelzold at Schweiner, chases 1390 due in the Lichnowchi matter, reports buyers ready to pay cash for several Hufen at Trąbczyn, returns an Amelang letter, and relays a 100,000 loan stalled by revision of assessments and news of over 300,000 Russian troops mobilised.
oe1bu9454-175: Writing on behalf of the Prince of Hohenlohe-Ingelfingen, A. Huhn forwards to Councillor of War and Forests von Triebenfeld two enclosed papers, one an original and one a copy, and asks him to write his opinion on them and on what should be done. The creditors Girard and Haupt are pressing hard for payment; the Prince would settle with them at once but for his cash being depleted by his recent journey.
oe1bu9454-176: 'News of the death on 27 July of the reigning Prince of Hohenlohe-Neuenstein, after a stroke: he had been shooting in the deer park on 20 July and fell ill on the 24th. Under his will Hahn''s master is sole heir, possession was taken at once at Öhringen and elsewhere and the oath of fealty sworn; armed moves by the Princes of Langenburg and Kirchberg, resting on a partition treaty, were repulsed and their patents replaced by Ingelfingen ones. The Prince travels there in September, leaving South Prussian affairs to Triebenfeld.'
oe1bu9454-177: Business in Berlin is stalled by the army's mobilisation, though Privy Councillor Reinbeck promises to lay the division of the estates before Minister von Voss and obtain the King's approval within days; on that approval depends raising money from the Invalids' Fund and Wards' Board. Enclosed is a register of fifteen new colonies at Zagorowo and Trąbczyn, 21,407 Morgen and 578 farmers, with land left to the lordship. Only 7,130 Rthl has come in; Radzinski owes 6,000; Prusimska, Weigel and Schlabrendorff claim 68,000 Rthl. War news follows.
oe1bu9454-178: Hahn apologises for having packed up, among his own papers at Breslau, several sheets signed in blank by the Prince that were meant for Triebenfeld; he pleads the sleepless nights before his departure, when Chamber Director Count arrived from Behringen and all the Hohenlohe business had to be settled before the journey. The rest of the blank signed sheets have gone to the young ladies von Triebenfeld. A postscript notes his appointment as Councillor of Expeditions.
oe1bu9454-179: 'Reports progress in Berlin: the dismemberment and the Betsche affair approved by the King, and the Kalisz Chamber''s valuation fixing estate revenues at 40,260 Rthl, against debts of 698,000 Rthl. Urges the Prince to execute and return quickly a power of attorney for Court Fiscal Pochammer, who is to secure treasury notes at 3 per cent to clear all debts; encloses schedules and an amortisation plan. Also advises against consenting to Glenck''s land sale, promising him 8,000 Rthl, and against approving the Santomist sale.'
oe1bu9454-179a: 'Four enclosures supporting a scheme to refinance the Prince''s debts: a Kalisz Chamber valuation of 28 March 1806 putting the net revenue of Zagorowo and Trąbczyn at 40,260 Rthl (quit-rents, hereditary-lease canon from Olesnica and Szetlewek, leased demesne farms, liquor rights, mills, brickworks), plus 4,900 Morgen of reserved forest; a schedule of debts totalling 363,933 Rthl, with the Courland debt reaching 698,784; Triebenfeld''s draft petition to the King for 698,000 Rthl in treasury notes against a sole first mortgage, with a 34,000 Rthl yearly amortisation fund and his personal surety; and an amortisation table clearing the capital in 39 1/2 years.'
oe1bu9454-180: Answering two princely letters, Triebenfeld reports that the Jew Nathan Luipmann's claim is already on a schedule of known debts and that creditors must be held off until funds come in; the roughly 60,000 Rthl of dismemberment monies will arrive slowly, forcing short-term borrowing. The concluded Betsche affair yields 2,000 Rthl after 6,000 Rthl for Echaust, plus 1,200 Rthl transfer fees from Raven, who is resisting payment, towards 30,000 Rthl. A loan is to be discussed at Steglitz; the valuation has gone back to Kalisz.
oe1bu9454-182: 'Complains that the Prince''s dispatch of the 11th omitted the two things needed most: a power of attorney for the court fiscal Pochammer and blank letter forms, leaving Triebenfeld idle in Berlin for weeks; asks urgently for these plus judicially attested powers of attorney in blank. Reports writing in the Prince''s name to Privy Cabinet Councillor Beyme and Minister von Voss, and planned calls on von Haugwitz and Count von Keller. Urges the Prince to refuse Gratsenauer''s demands for a title, a certificate and a judicial appointment.'
oe1bu9454-183: Reports a lampoon circulating under the title Prussian Characters which attacks the Prince and names Triebenfeld himself as a self-enriching intriguer who rose from servant to nobleman; the copy he sent has been confiscated by the French authorities. He names Colonel Massenbach or Professor Buchholz as the likely author and offers his pistols should Massenbach's authorship be proved. Rochritz is said to be treated just as harshly.
oe1bu9454-184: 'A covering note apologising that blank forms were left behind when the express courier departed, turning into a confidential complaint: Hahn, writing from Ingelfingen, laments that long-serving old Ingelfingen servants are passed over in favour of newer and less deserving men who prosper from the Hohenlohe lands, while he is left to starve. He trusts Triebenfeld to make no use of this outpouring and hopes to extricate himself by his own efforts.'
oe1bu9454-185: 'An urgent plea for the powers of attorney and blank forms already requested: without them Triebenfeld can achieve nothing in Berlin and fears the delay will breed mistrust among those he is negotiating with. He asks specifically for a power of attorney for the Court Fiscal Pochammer, two judicially attested blank powers, and blank forms. On Württemberg''s encroachments he reports promises of support but doubts their sincerity, and urges pressure from the Prince''s side too. Reports news of the Prince''s gout from President von Höhneln and recommends treatment.'
oe1bu9454-186: Reports that the business with Mr. Weigel is as good as settled, Weigel having sent his agreement the previous evening and being expected out to dinner the next day. To entertain the old gentleman properly, and in the Prince's interest, Triebenfeld requisitions from his correspondent a bottle of old wine, a bottle of good old sweet Hungarian Ausbruch, six peaches and two bunches of grapes, to be sent out if his note misses him.
oe1bu9454-187: 'Reports that powers of attorney and blank forms have arrived and been used: with help from a General and others the Lord High Chancellor will advance 90,000 Rthl from the Justice Fund to satisfy the most pressing creditors Weigel, the Schlabrendorff woman and Lichnowski, freeing 30,000 Rthl for the Prince. Complains that the Zagorowo and Trąbczyn mortgage certificate will bear no further loans, that Oppenheimer has paid only 32,000 of 113,600 Rthl, and that Meyer Bernhard is suing despite royal approval of the Betsche lease; sets out a journey to Betsche, Kalisz and Trąbczyn to raise money.'
oe1bu9454-188: 'Reports success in Berlin: the Grand Chancellor will advance some 176,000 Rthl from the Justice Fund to clear the pressing creditors, including Weigel, while Triebenfeld works to revive the 200,000 Rthl mortgage with Oppenheimer and to settle Schlabrendorff by taking 20,000 Rthl from Councillor of War von Hellen. Betsche is settled, Echaust receipted, 4000 Rthl due 6 July. Lists some 102,000 Rthl of arrears expected at Trąbczyn, and denounces Grattenauer as idle and now serving the Minister.'
oe1bu9454-189: Hahn reports that the death of the mining councillor Bernhardi has obliged him to travel to Upper Silesia to put the affairs of the lordship in order jointly with inspector Kreinig and master of forests Reichmann, both of whom he knows as sound men of business. Koschentin, he warns, is not in the best order and will give trouble. He asks leave to call on Triebenfeld at Trąbczyn before returning to the Empire, having already sought the Prince's permission, and hopes for a reply at Koschentin.
oe1bu9454-190: Hahn, writing on the Prince's orders, sends a blank authority for a reply to Mr von Rewek, to be filled in as Triebenfeld sees fit, and urges him to join the Prince in rescuing the mining councillor Glenck, whose speculation and frivolity have ruined him; a draft consent should be sent on to silence his weekly complaints. An enclosed extract from Glenck's letter describes pawning goods, dismissed servants, lost credit and creditors, and asks for the consent freeing Ribbek from the Wrąbczyn purchase.
oe1bu9454-191: 'Written from a sickbed after five weeks of bilious fever, an account of the estate campaign since leaving Berlin: a list of debts to be cleared totalling some 311,000 Rthl, including 110,000 to Oppenheimer, against 184,000 owed to the Prince; Prusimska''s bridal settlement and an execution decree at Trąbczyn; the leases of Honrichs, von Zglinski, Kopojno and Tietz cancelled or reduced, dismemberment at 600 Rthl per Hufe, peasants flogged into submission, and Glenck''s lampoon frightening off German purchasers.'
oe1bu9454-192: Bedridden in a fifth week and unable to travel to Berlin, where 360,000 Rthl are promised, Triebenfeld reports pacifying rebellious peasants, dismissing the tenants, and standing surety that Weigel and Lichnowski will be paid from the judicial fund on ceding their mortgages. He accuses Glenck of allying with Olesnica men, circulating a lampoon among prospective colonist buyers, and details sums already received from Swięcia, Olesnica and Szetlewek, plus a judgement favouring Giese's hereditary lease.
oe1bu9454-193: A letter ten days in transit has wrecked the travel plan; Triebenfeld urges the Prince not to come as far as Parchwitz, where they would be noticed, and promises to come himself to Schlawenschitz before going to Berlin, needing the Prince's decisions first. He reports unrest brewing in Petersburg on Colonel Scharffenberg's word, delaying tactics by the Dabsha woman, and the arrest of Honrichs, who owes over 10,000 Rthl and passed nothing on; 600 Rthl have been recovered.
oe1bu9454-194: Triebenfeld's journey to Schlawenschitz is delayed by the Invalids' Fund, which is demanding repayment of the whole capital, has sued him and threatens compulsory auction of his estates; a hearing is set for the 26th at Glogau. In Poland the recovery action for the Trąbczyn estates has gone well and been referred to Kalisz, and the King of Saxony is expected to grant a ten-year moratorium repaying a tenth yearly, of which Weigel should learn nothing. He has asked the prefecture to suspend Honrichsen, attach his goods and apply 11,700 Rthl of alleged debt to interest arrears, blaming the sub-prefect Brzechsta's false certificates.
oe1bu9454-195: Reports from Breslau that nothing can be settled until Count Strachwitz arrives on the 23rd; Flesch, angry that Goldstücker named the Count and treated the business lightly, demands secrecy, which Triebenfeld suspects conceals a swindle and an undisclosed lawsuit. The estates in question are said to be the Oder estates near Leobschütz, valued at 900,000 Rthl, Zackraw excepted. Adds political rumour of war with France, Austria and the Turks, Prussian contributions, Hardenberg's return, and talk of a testament given to Henckel.
oe1bu9454-196: Triebenfeld reports fleeing Breslau to avoid arrest over 1,500 Rthl still owed to Lahr, whose agent Ludwig obtained a warrant despite a promised respite until Michaelmas; he blames Flesch and Sterch, dismisses a proposed exchange bargain as a swindle, and must sell his mill at half value. He passes on Breslau rumours of Napoleon's contribution demands, troop reductions and Hardenberg, notes the Dutch loan has collapsed, and advises the Prince to write to the Liquidation Commission citing Berger over the 35,000 Rthl.
oe1bu9454-197: Reports that General Köckritz has warned off von der Lahr, who has agreed to wait a year, and will press the treasury officials for patience over interest due to the Invalids' Fund. Triebenfeld will settle matters at Kalisz, then return to Breslau, and urges the Prince to push Goldstücher to complete an exchange transaction despite acute shortage of money. A senior district administrator, Hegener, is to prepare Strachwitz and inspect Zagorowo. A postscript quotes privy councillor Tismar and blames Flesch for the trouble.
oe1bu9454-198: 'Reports on returning from Poland: Trąbczyn will revert to the Prince by Michaelmas, the sequestration is lifted, and the accounts of Honrichs and Frankiewitz, guaranteed by sub-prefect Brzechsta, are under audit over 11,700 Rthl said to have been defrauded; Hecker is conceded as administrator. The tenant Smidkowski pays several thousand to stay; Dąbska''s petition to the King failed. Court gossip from Köckritz, Tismar and Richter on Hardenberg''s return, the debt settlement, the Colonna papers and 35,000 Rthl.'
oe1bu9454-199: 'Reports on arrival and a change of plan: rather than travel to Berlin, Triebenfeld will lobby where he is, sending wine and wildfowl ahead of a farewell banquet at which he hopes, through his contact "T", to have Hardenberg brought in and matters advanced. He then means to ride to Zagorowo to settle the main business beyond challenge, expecting 6,000 Rthl cash for his mill plus arrears from his subjects. Encloses a letter from T.'
oe1bu9454-200: Acknowledges a consignment that arrived too late for General von Köckritz, who leaves before Sunday, and advises putting off Herr von Seegebarth until money can be drawn from the Polish possessions, suggesting the courier money from the campaigns may be chargeable to the King. Reports that Weigel refuses Stössel as his debtor and is being urged instead to buy up the Silesian estates himself, give a full receipt and satisfy Stössel. Plans a trip to Zagorowo; awaits news of the King's visit.
oe1bu9454-201: 'Reports that Weigel has resolved to take the estates offered for the Zagorowo lordship, whether the Knobelsdorff or Pommahisch ones, setting his own and Stossel''s claims against them, with a meeting arranged at Schweinerin. Triebenfeld outlines a wider scheme to clear the Prince''s debts: rich Breslau merchants covet large estates, one already offering 220,000 Rthl for his own Schweinern, for which he asks 250,000, and Grotowski, Lichnowski and Zerboni hold claims on Trąbczyn. He urges the Prince to advance the plan concerning Herr August.'
oe1bu9454-202: 'Reports the outcome of a day''s negotiation: Father Weigel has left satisfied, entrusting the whole affair to Triebenfeld and willing to take on the estates the Prince is acquiring, though the terms must be written out again so that Weigel''s son can understand them. Triebenfeld quotes at length Weigel''s praise of his disinterestedness, including his refusal of gain in Berlin. He hopes to sell two free holdings quickly. Warm, personal in tone.'
oe1bu9454-203: Reports sending Weigel an exposé and working on Hainen's consent, and needing 500 Rthl to travel to Zagorowo on the 11th. Negotiations over Schweinern with the merchants Wiener and Schiller continue; rumours about the Lausch and Strachnitz estates are baseless. Fischbach proposes exchanging von Knobelsdorff's estates for the Zagorowo estates, with valuations and debts set out (247,000 Rthl against Zagorowo, 390,000 Rthl against Knobelsdorff's), for 1.5 per cent commission; asks whether Fischbach and Knobelsdorff should come to Schlawenschitz.
oe1bu9454-204: 'Alarm that the Prince''s letter to von Heyne, saying he would cede Koschentin to Weigel or to Stösseln, has all but wrecked Triebenfeld''s plan: Weigel now sees no point in exerting himself, since he will get no ready money that way and doubts whether Stösseln would credit what the Prince has paid in or cover his other claims. Heyne is promising to repair matters. Triebenfeld begs a candid decision, warns that returning Koschentin to Stösseln means losing all outlay on it, and asks that his letters be shown to no one but the Prince''s son and Balley.'
oe1bu9454-205: 'A report on an exchange transaction being pushed forward: Knobelsdorff, delayed by a commission from the General Director of the Landschaft, is expected to travel to Zagorowo after the 10th, and Weigel will accept the Bischdorff estates and clear the charges on Koschentin provided he is entered in the register. Notes Köchlich''s departure and Köckritz''s regards, Polish debts now payable, fears of war between France and Russia, prospects for iron sales, and warns the Prince that trusted confidants are false friends.'
oe1bu9454-206: 'Urges the Prince to stay calm and expect nothing from the Prussian government, promising that satisfaction will come from the north, even offering to travel to Petersburg himself. Reports that Knobelsdorff will go through with the exchange, that Tatz will be met at the wool market over Trąbczyn, and that the 35,000 Rthl must wait until Eberhard sends a schedule. Sets out a four-point plan for Zagorowo: Cabanis to swear to the number of parcels, contracts and arrears to be verified, and Honrichs brought to terms. Three free holdings at Petersdorff are to be sold for 1,800 Rthl, at a 3,200 Rthl loss, to raise travel money.'
oe1bu9454-207: 'A copy of a report from Hecker and Honrichs at Kalisz: the Trąbczyn suit has been set in motion, with a hearing on 24 October delayed by the tribunal''s eight-week vacation, Councillor Falz now conducting it, content with a 200 Rthl advance and leaving his fee to the Prince. The sequestration of the estates is ended; settlement with the hereditary leaseholders of Olesnica over 12 Hufe is urged; Polish peasants and Hollanders resist rents of 3 gulden per Morgen. Triebenfeld''s note advises remitting some arrears.'
oe1bu9454-208: Lack of money still prevents the journey to Pehlen, though prospects look better than feared, with an unnamed third party beside Knobelsdorff and Strachwitz now interested. Complains bitterly of being distrained for 48 Rthl 6 g of costs in the Schlieben matter, his Schwänner lease monies attached pending reopening at Potsdam, and of Lombardini's refusal to pay the bailiff Schock; asks the Prince to order payment. Adds news of royal manoeuvres near Berlin, French troop movements, confiscations on the Elbe, and Kalckreuth's waning standing.
oe1bu9454-209: 'A hurried note, written as the post was leaving: the payment order has arrived, and Triebenfeld will collect the money and depart immediately. He promises to report everything from Zagorowo at once by mounted messenger, who is also to bring Mr. von Knobelsdorff there. Nothing further is given on the sum involved or the purpose of the payment.'
oe1bu9454-210: A report on five lawsuits pending at the tribunal in Kalisz, with frank account of payments to the advocate Falz, President Smagorzewski, assessors and wine bills to speed them. Triebenfeld expects to recover Trąbczyn with a 22,000 Rthl marriage portion from Dąbska, seeks eviction of the Olesnica leaseholders who owe 39,270 Rthl, has arrested Niedzwiedzki's wood and cattle, would replace defaulting German settlers and Hawich with Polish peasants, and forecasts 44,000 Rthl by New Year. He begs a further four weeks' leave for the referendary Sommer.
oe1bu9454-211: Reports that Herr von Knobelsdorff has visited and inspected the place, is pleased with it, and is judged an entirely truthful man; Triebenfeld is meanwhile trying to put the accounts and affairs into order so the whole can be seen at a glance, complaining of great confusion and stubborn people. The Trąbczyn lawsuit, with a hearing pending since the 24th, may take another fortnight before the tribunal's decree; winning it would end all distress. Asks to be left sole direction.
oe1bu9454-212: 'Writing from a peasant''s hut while recovering from severe illness, Triebenfeld reports that no one on the estates pays: 31 lawsuits are pending, and he means to evict the Olesnica people, Niedzwiedzki of Kopojno and Hawich of Drzewce and restore three demesne farms. Some 8,657 Rthl of taxes, 7,500 Rthl interest to the Invalids'' Fund and further charges fall due by Easter. Napoleon''s new terms for colonists have unsettled everyone. On Trąbczyn, Prince Poniatowski''s intervention has pushed the case to higher authority; Zagorowo is valued at 22,140 Rthl yearly, leaving the Prince 7,140 Rthl.'
oe1bu9454-213: 'Reports recovery from illness and a carriage accident that crushed his head, then the state of the Trąbczyn and Zagorowo affairs: state taxes cleared but for 900 Rthl, with hopes of paying the rest and the bank interest to end the costly sequestration, whose sequestrator, a favourite of Prefect Garczynski, has liquidated 2,236 Rthl. Lists 43 pending suits against lessees, peasants, Hollanders and colonists, the largest for 33,000 and 39,000 Rthl, projects revenues of 23,000 Rthl, and warns of new French and Saxon ordinances and a 40 year, 6 per cent repayment plan.'
oe1bu9454-214: Condolences on the Princess's death open a report that the departmental minister has approved repayment of the Bank and Invalids' debts with interest arrears over 41¾ years at 6 per cent, with a similar moratorium hinted at for private debts and Weigel. Hereditary leaseholders pay nothing; suits to annul their contracts, including Olemizur, Werbizier and Swiecia, are pending, with revenues expected at 22,000-24,000 Rthl. Hecker, who owes some 5,000 Rthl, faces arrest and prosecution. Triebenfeld describes his own destitution and reduced staffing costs of 1,000 Rthl yearly.
oe1bu9454-215: 'A point by point report on the Prince''s Polish affairs: receipt of 1,000 Rthl from Master of the Horse Bally; the conduct of Honrichs, Hawich, Hecker and Cabanis; and above all the lifting of the sequestration at Zagorowo, where 5,100 Rthl of yearly interest would be deposited under protest against Mendel Oppenheimer''s disputed 102,000 Rthl claim. Triebenfeld has dropped the advocate Stenger for Raszkowski at 300 Rthl, urges recovery of Trąbczyn and Kaemen from the Dąbska woman with 60,000 Rthl damages, proposes remitting colonists a third of their interest, and reports arrears at Betschin and a suit over Witów.'
oe1bu9454-216: Reports that private debts and the Bayonne sums look likely to fall under a 41¾ year moratorium, leaving some 200,000 Rthl on the estates, including a Weigel debt of 50,000 Rthl, effectively converted into an annuity. Presses the Prince to say by return of the express messenger whether he means to keep or exchange the estates, since keeping them would require judicial removal of the Hauländer. Asks for a power of attorney for the advocate Schmid at Kalisz and a letter to Hecker, who is inciting the subjects.
oe1bu9454-217: 'Von Sanitz, having left Silesia after losing his fortune, reports on his efforts to recover confiscated Polish estates: his counsel Weltzer holds out little hope, the Foreign Department has intervened, and the French envoy in Berlin may take up his cause if no Imperial command exists, since it emerges that Prussian commissioners, not the Emperor, ordered restitution to the lady Dąbska. He asks Triebenfeld for copies of the rulings on the Prince''s Trąbczyn estates and mentions rumours of war in the north.'
oe1bu9454-218: 'Sets out a secret scheme, devised with von Heuthausen and Bally the Master of the Horse, to clear the Prince''s debts: Schurgast, bought from General Count von Wartensleben for 207,000 Rthl, and a mortgage on the Zagorowo estates (valued at 560,000 Rthl, less 237,375 owing) would be taken over by Stöckel and Weigel, lifting 322,625 Rthl of debt; Triebenfeld offers his own Blizanow and a 30,000 mortgage on Kontop if needed. He urges haste, reports lawsuits against Olemia and Weyberin worth 20,000-30,000 Rthl, uncollectable arrears at Olesnica and Wrąbczyn, 20,000 Rthl outstanding at Betsche, and begs that Heuthausen be given travelling money; he complains bitterly of the multiple arrests on Schwimmern and his own ruin.'
oe1bu9454-219: Urgent plea for a decision on a plan already submitted, since a councillor from Kalisz is negotiating with the elder Count Wartensleben. If approved, Triebenfeld will go to Münse and exchange his own Blizanow for that of Wartensleben's elder son, letting the Prince satisfy creditors, notably Weigel and Stössel, and hold the entailed estates in peace. Dues and distress on the estates are mounting; he fears unrest. An embassy enquiry to the mortgage conservator, President Dierschlag, has subsided.
oe1bu9454-220: 'Reports a wasted journey to Count Wartensleben at Neisse: the Schurguet deal was already closed with a bankrupt Kulins merchant at 135,000 Rthl, a sum Triebenfeld thinks wildly inflated. The younger Wartensleben will sell the Constadt estates, worth 200,000 Rthl against 120,000 Rthl of debt. Triebenfeld sketches a scheme by which Weigel and Stössel take over Constadt and the Zagorowo mortgage, receipting some 350,000 Rthl and freeing Koschentin, and asks for instructions by express to Blizanow.'
oe1bu9454-221: Reports that the 18,000 Rthl expected from the Zagorowo estates cannot be sent, since nothing can be got from them until two lawsuits are won; hopes only that the Christmas interest is paid so the moratorium holds. Sets out two rival schemes (A and B) for selling Zagorowo to Stössel, with Count Leopold von Wartensleben, Weigel and Count Sandrelzki involved, an exchange of Blizanow for the Pila estates, and figures totalling 470,000 Rthl. Rejects Constadt and Schurgast.
oe1bu9454-222: Urges the Prince to authorise a plan under which Baron Stossel and old Weigel would be satisfied by surrendering the Zagorowo estates, with Blizanow added, freeing some 670,000 m. of the late Prince Sacken's money set aside to buy entailed estates for Princes Adolph and Alexander. Count Wartensleben, just from Breslau, reports Stossel will treat but wants written consent, ideally a letter explaining that the mother-in-law's will left nothing to pay for Koschentin. Begs an answer by the messenger within five days.
oe1bu9454-223: Dictated by the Prince because of inflamed eyes, an urgent plea for ready money before Christmas and for the quick sale of the Zagorowo estates to clear his private debts. General von Schimmelpfennig and his sons have inspected maps and valuations and would exchange their debt-free Szelce and Maderzewo, once bought for 26,000 ducats and now valued near 100,000 Rthl; the General is warned to be sly and grasping. Doubts about terms with Weigel and Stössel, praise for Lieutenant Sommer, whose pay he asks be arranged, complaints of abandoned Polish lawsuits, and news of his daughter Adele's betrothal.
oe1bu9454-224: 'Reports a possible exchange of the estates for General Schimmelpfennig, who is too old to inspect Zagorowo himself and will send his sons-in-law, cavalry captain von Kotzow and von Johnston, with Lieutenant Sommer after the holidays. Sets out the General''s proposed terms: his own Seliz and Modkewo at 110,000, Johnston''s Goła wies at 6,000 Rthl, 66,000 Rthl in East Prussian mortgage bonds at par, and further mortgage security. Confirms the Weigel and Stössel sale has collapsed, and urges that the lawsuits be concluded to raise funds.'
oe1bu9454-226: Reports that a proposed exchange deal with General von Schimmelpfennig appears to have collapsed, no messenger having arrived, and forwards a letter from Count von Wartensleben, close friend of old Stössel, showing that satisfying Stössel and Weigel depends on the Prince writing to him and offering estates in the Duchy of Warsaw. Defends himself bitterly against reproaches over the stalled lawsuits and lack of revenue, and urgently requests the original title deed for Zagorowo, which the Prefecture demands on pain of confiscation.
oe1bu9454-227: Forwards by mounted messenger an offer from sub-prefect von Brzechsta to lease the Zagorowo lordship for six years at 20,000-25,000 rl a year, restoring the three demesne farms for 3,000 Rthl and bearing all burdens, but demanding 10,000 Rthl compensation if the estates are sold; urges acceptance. Lists urgent payments of some 6,600 Rthl, warns that sequestration will resume, and asks whether to treat instead with General von Schimmelpfennig, and about Weigel, Stössel and freeing Köschentin.
oe1bu9454-228: 'Report on a mission to General Schimmelpfennig von der Oye about a proposed exchange for the Zagorowo estates: the General remains willing, but his illness still keeps him to his room, and the linked money negotiations with Mr von Stägemann in Berlin, at first unpromising, have improved through the Saxon envoy''s mediation after Cavalry Captain von Schimmelpfennig approached him. Since winter prevents the necessary inspection of the estates, the General asks the Prince to postpone matters until spring. Signed Sommer.'
oe1bu9454-229: 'Birthday good wishes open a report of business: Attorney-General Count Lipski, Tribunal President Smogorzewski and Tribunal Councillors Rembowski, Michalski and Sobocki send thanks for a gift of game, and a favourable decision in the Olesnica and Wrąbczyn cases is expected shortly. A lease of the Zagorowo estates alone has been agreed with sub-prefect Brzechsta at 20,000 Rthl, subject to confirmation at Schlawenschitz on 8 February; interest is covered and the Bayonne capital will be paid off. Original documents returned.'
oe1bu9454-230: Three sharp reminders from the Prince to Triebenfeld, who has failed to arrive with Mr von Brzechsta on the 8th and has left an earlier letter unanswered. The Prince, unable to live on estates that yield him nothing, demands the Trąbczyn deed of gift, a definite plan for Zagorowo's administration or lease to von Brechso, and swift money. He reports General von Schimmelpfennig's renewed interest in buying Zagorowo, a visit due in March, and a royal commission on his debts, for which Lieutenant Sommer is sent to inspect.
oe1bu9454-231: C. F. Weigel reports a recent visit to Kalisz on his own business, where he had hoped to meet Triebenfeld but could not, having been unable to learn where he was then living. He asks him to name a day and place, at Kalisz or elsewhere, for a meeting to discuss and take advice on the matters outstanding between Weigel and Johann, Prince of Hohenlohe, and presses for a speedy reply.
oe1bu9454-232: 'Written from Kopojno in acute distress: Triebenfeld reports weeks of illness, an empty treasury, sequestrations on everything, and peasants eating grass after troops carried off grain, cattle, horses and sheep. He wants the King of Saxony approached so Attorney General Lipski will regulate relations between the lordship and the subjects; he cannot find Sommer''s 300 Rthl until Brzechsta''s lease is active, and asks urgently for a declaration authorising him to collect 4,219 Rthl from the interest of Swięcia, Wrąbczyn, Olesnica, Kopojno, Sophienthal and Adelow.'
oe1bu9454-233: 'Proposes three ways to clear debts: leasing Drzewce to von Sobottendorff for 18 years at 2000 Rthl yearly, plus four vacant colonists'' holdings at Swixce valued at 1000 Rthl each, to extinguish a 40000 Rthl bond; leasing the demesne farm Kopojno with its drink-selling rights to Weigel for nine years at 6000 Rthl; and having Prince August pay off 50000 Rthl owed to the Invalids'' Fund. Estimates resulting revenues, notes delays in the Meierowitz suit, and reports Cabanis rendering accounts at Schlawenschitz.'
oe1bu9454-234: Negotiations with Weigel, summoned urgently from Breslau, promise to clear a debt of some 54,000 Rthl and extinguish around 90,000 Rthl without touching the estates' substance. The Invalids' Fund, owed some 9,000 Rthl in interest arrears, has attached everything; Triebenfeld proposes paying its 50,000 Rthl capital from the Sacken bequest, with Prince August's help and a royal order, to lift the execution and yield yearly revenues of 6,000-8,000 Rthl. He begs for a power of attorney, preferably certified in court.
oe1bu9454-235: Reports that old Weigel has arrived and is willing not only to conclude the lease contract but, on Triebenfeld's advice, to buy the Zagorowo estates, assuming the debts and paying a further 200,000 Rthl to be set against Koschentin. Weigel proposes that Koschentin be forced to compulsory auction, where he would bid as creditor below valuation, perhaps under 600,000 Rthl, and undertake in writing to cede it back; secrecy is essential, and the papers are urgently wanted.
oe1bu9454-236: Reports that Weigel has handed over all his business with the Prince and intends to buy rather than lease, so the lease contract has been deferred pending the Prince's wishes and his position with his children; Triebenfeld promises to travel to the Prince with him once his health allows. Sobottendorff's affair can also be settled then. He begs urgently for the papers and for the Prince's signature on an enclosed letter for the prefect, and relays Cosmar's claim, reported by Triebenfeld's son, that no creditor will be paid a Groschen.
oe1bu9454-237: 'Complains that a messenger put an earlier letter in the post at Pol Wartemberg instead of carrying it by express to the district administrator König, and asks the Prince to direct his awaited reply to Dresden, marked to lie at the post office until called for: Triebenfeld must leave that night for Naumburg an der Saale, where his eldest son lies shot through both thighs. With the Prince''s letter to the Emperor he promises to recover Trąbczyn and Kaemen. Trzciński, König, Zerboni and Meierowitz all evade him; only Meierowitz faces execution; Radke is hemmed in by some 80,000 Russians.'
oe1bu9454-238: 'Complaints of long silence: only Triebenfeld''s dispatch of 29 April has reached him, an earlier letter apparently burnt with the post-house at Würtemberg, and Trzciński, Zerboni and Koenig have paid nothing while Weigel presses hard, to be pacified if possible with Trzciński''s bills. Encloses an unsealed letter to the Russian Emperor for use as Triebenfeld thinks fit; reports that the King, the State Chancellor and the Minister of Justice have all refused to back his proposed settlement with the creditors at Brieg and a maintenance allowance for himself.'
oe1bu9454-239: 'Wartime news from Silesia: gout and a bottomless road forced a night in the open short of Neisse; the King has just left for Töplitz, where the Russian Emperor is, and Austria''s accession is doubted, neutrality being posted publicly in the Austrian states. The armistice is judged to favour the enemy, Bülow and Chernyshev having had to submit, Napoleon hastening to Paris. Reports the government''s move to Frankenstein, Gneisenau and Valentini at headquarters, approval of his own plan, and letters forwarded for Madame von Hahn and Chief Forest Master von Kleist.'
oe1bu9454-240: 'A war report: Austria is certainly staying neutral and posing as mediator, Russian troops and their generals are cursing the armistice and talk of falling back to the Vistula. Recounts a quarrel before the monarch between Lieutenant General von Koch and Minister Hardenberg over whether the six weeks'' truce, the abandonment of Saxony and the retreat to the Oder can be called success. Notes grain shortage, ruined roads, dead horses, Zastrow''s 55,000 militia at Neisse, and plans to travel via Neisse and Frankenstein to headquarters and Schwierin to sell produce and raise money.'
oe1bu9454-241: 'Reports meeting General Gneisenau at Neisse and delivering the Prince''s letter; Gneisenau will answer and speaks as an admirer, so the Prince should be reassured. News of appointments: Zastrow posted to Prussia, Gneisenau now commanding the Silesian militia of 55,000 men while also Chief of the General Staff and military governor, with Lieutenant General von Koch''s support. Notes reviews of 15,000 militia at Oppendorff, hopes for provisioning the poor from Poland, fears of Russian annexation, and his own gout.'
oe1bu9454-242: 'A report from Vienna on arrival for the Congress: ruinous prices and depreciated paper money, the Congress postponed to 1 November while the sovereigns visit Ofen and Pest, and French opposition to the Saxon and Polish acquisitions. Hardenberg is well and unyielding; the King of Württemberg will concede a constitution for the allies'' approval. The Schlaw plan is approved, Koschentin and the Courland business must wait, and the Külm, Kaehmin and Trąbczyn matters depend on Poland''s fate, with Moscinska née Prusimska well connected.'
oe1bu9454-243: 'An urgent appeal for a further 300 Rthl in gold within eight days, or Triebenfeld will leave Vienna on the 23rd. He sets out his costs: 400 Rthl exchanged for 1,200 fl in Vienna redemption notes since Prussian currency is refused, 392 fl already spent, and a daily outlay of some 50 fl (15 Rthl) on lodging, meals, a hired lackey and fodder, against business expected to last five more weeks. His address at the Golden Duck, Schulerstraße, is given.'
oe1bu9454-244: 'A report from the Congress of Vienna: the great review of troops, the King of Württemberg''s absence from the saddle and his withheld constitution, the warmth between the two Emperors and the Prussian King, a deputation of Princes and Estates to Prince Metternich seeking the Emperor of Austria as their head, Saxony, and Holland''s new royal title. On Poland nothing is settled, though Baron von Humboldt is helping the Prince''s cause; Privy Councillor von Gärtner is ill. Triebenfeld urges pressing the Brieg High Provincial Court to annul an 1811 settlement and awaits instructions.'
oe1bu9454-245: A draft petition to State Chancellor von Hardenberg, pleading the Prince's ruin at the hands of Cosmar, executor of the late Princess von Sacken's will, who has seized the Schlawenschitz, Lassowitz and Oppurg entailed estates, installed his under-age son as administrator, drawn the 79,500 Rthl yearly revenue, paid the Prince only 2,500 Rthl in three years and withheld over 43,000 Rthl. Asks that a settlement of 1811, signed with three crosses, be set aside, Cosmar removed and made to account, and 112,000 Rthl advanced to buy off the Lutz heirs' 426,000 Rthl claim.
oe1bu9454-246: 'A report from the Congress of Vienna: the sovereigns have gone to Hungary, delaying the opening, while Saxony''s fate is settled in Prussia''s favour and Poland remains undecided, Austria resisting and Talleyrand intriguing; a frontier from Thorn past Kalisz to Kempen would leave Silesia and Prussia unconnected. Business on the Polish estates must wait until Poland''s fate is decided, when the State Chancellor will intervene; nothing new at Koschentin. Zerboni decorated; Gärtner''s pamphlet enclosed.'
oe1bu9454-247: 'Reports from the Congress of Vienna on the Hohenlohe family''s entailed estates: Minister von Humboldt has promised particular support, and the State Chancellor thinks the money a trifle but expects trouble from the Justice department over annulling a settlement the old Prince approved. Argues that Cosmar forced the dying Princess Sacken into a forged settlement loading it with debts, and that his guardianship and her life-interest have lapsed. Satisfying the Courland heirs would cost 112,000 Rthl; a damaged schedule totals 79,500 and 147,000 Rthl.'
oe1bu9454-248: 'Optimistic report from the Congress of Vienna on the Prince''s claim against the King: the State Chancellor and Minister Baron von Humboldt are pressing it, the Courland heirs have petitioned the King, and the King appears resigned to paying, with 314,000 Rthl to gain, 112,000 Rthl to advance and nine years'' arrears of salary to be raised. Count Winzingerode''s rival demand for 10,000 Rthl for Prince August from Schlawenschitz and Lasswitz is countered by citing the deed of 1799. Also rumours of French troops and unrest in Baden and Württemberg.'
oe1bu9454-249: Reporting from the Congress, Triebenfeld acknowledges money received but says much went on debts already incurred; Court Councillor Hahn's paper cannot now be added to a petition already before the King. He urges the speedy provision of 12,000 Rthl to settle with short-term representatives, after which 10,000 Rthl will be ordered paid in Berlin. He reports Chancellor and Humboldt goodwill, secret talks between Metternich, Wrede and Wessling, the monarchs' travel plans, and asks for a power of attorney naming Gärtner rather than Göschell.
oe1bu9454-250: Humboldt, writing from Vienna, acknowledges Triebenfeld's letter of 3 November and confirms that he has seen the memorial submitted to Prince von Hardenberg, a copy of which he returns enclosed, promising to support its contents so far as his own official sphere allows. A brief, non-committal reply, filed as an enclosure to Triebenfeld's letter of 17 November, evidencing his lobbying of Prussian ministers at the Congress of Vienna.
oe1bu9454-251: Forwards a further legal opinion drawn up from the files on behalf of an aged, indebted prince, and begs the Prince of Hohenlohe-Ingelfingen to give written hope, even without cash, that 112,000 Rthl will be advanced for a settlement with the L. heirs, which would let a compromise be concluded at once. Warns that delay favours Cosmar, and that if the 66-year-old dies the Crown stands to lose 461,000 Rthl, including 35,000 Rthl advanced in 1790.
oe1bu9454-252: 'A brief reply from Chancellor Hardenberg, written at Vienna, to Triebenfeld''s petition of the previous month: the Prince of Hohenlohe''s affair concerning the claims on Trąbczyn and Kaemen will resolve itself once the general settlement and agreement over the Duchy of Warsaw, then under negotiation at the Congress, is put into effect. No action is promised or instruction given; the answer defers the matter to the outcome of the wider territorial arrangement.'
oe1bu9454-253: Reports from the Congress that Court Councillor Hahn's second opinion has been laid before the State Chancellor, who found nothing new in it but was glad the legal view agreed; the Duchess of Sagan, badly in need of money, is seeking the King's leave to borrow on Sagan and to pledge the very sum secured to the Prince, a decision again postponed. An enclosed reply on Trąbczyn and Kaemen offers nothing; also notes the King of Württemberg's threats to quit Vienna and unrest in Württemberg, Baden and Switzerland.
oe1bu9454-254: 'A desperate plea for money from Vienna, where Triebenfeld has been lobbying for months: the Prince Chancellor is rarely available, so he must entertain the officials who do the work at 20-30 Rthl an evening. Of the 1,400 Rthl he asked for he has had 940, and owes Barbe 94 ducats; he wants 100 ducats more and 200 Rthl for his hungry children. He lists six gains promised: recovery of the Polish estates, extinction of a 461,000 Rthl Courland debt, and release from the Koschentin bonds, which must stay secret from creditors. He also prescribes routing letters through Chief Postal Director Mann in Vienna, and appends receipts for money handed over at Breslau.'
oe1bu9454-255: Reports from the Congress that the Prince State Chancellor Hardenberg has been confined to bed for five days, alarming because he has drafted the Prince's submissions himself and means to help; Minister Humboldt hints the case is already won, and Court Councillor Hahn's opinion supports it. The military claims lie dormant until Berlin. Everything turns on ending the Courland business, defeating Cosmar and securing possession of the entailed estates. Announces his arrival in person on the 11th.
oe1bu9454-256: Reports from the Congress that the allied sovereigns' departure has been put off by another four to six weeks, so nothing on the Polish estates can yet be settled, though the State Chancellor remains well disposed and has set Privy Councillor of State Stägemann to report; a supreme order is going to Ministers von Kircheisen and von Bülow in Berlin for a commission to investigate Commer's conduct. The settlement with the Caric heirs and an advance of 112,000 Rthl stand still. Begs for proofs, blank forms, money, and support for his children in Breslau.
oe1bu9454-257: Gruemann questions a claim made in a submission of the 23rd that the Prince of Hohenlohe had undertaken, in an 1811 settlement, to pay the capital owed to the Courland heirs (a figure of some 500,000) himself and to release the Countess from joint liability. Unable to locate any such passage, he returns the settlement and asks that the wording be marked in red chalk and sent back by the bearer. A brief, damaged note.
oe1bu9454-258: Following earlier representations of 23 October and 28 November, Triebenfeld protests that Privy Councillor of State Stägemann has referred the Hohenlohe debt matter to a commission in Berlin, and that enquiries of Count Wratislaw, a former guardian, will lose the State an advantage of 46,000 Rthl. He explains that the Courland (Kurz) heirs, including the Duchess of Sagan and short of money, would settle a debt of 426,000 Rthl for 112,000 Rthl payable in yearly instalments of 25,000 Rthl, plus 35,000 Rthl drawn at Breslau in 1790, offers security of 60,000 Rthl, and begs an hour's audience.
oe1bu9454-259: Triumphant news that State Chancellor Hardenberg is expected to order the Brieg high court to investigate the Prince's affairs at speed and report, keeping the case out of Berlin, whereupon 42,000 Rthl would be paid and Triebenfeld's plan followed. He urges the Prince to testify frankly before the commissary at Brieg or Schlawenschitz that the family settlements were fabricated by Cosmar to defraud creditors, the debts fictitious, and his acknowledgement of 300,000 Rthl and the codicil extorted while under arrest at Öhringen; he should spare no one, not even his son, and act only with Court Councillor Hahn.
oe1bu9454-260: 'Reports having sent on, by express courier, a resolution obtained from Prince State Chancellor Hardenberg with an order to the Brieg Superior Provincial Court, and coaches the Prince on the line Court Councillor Hahn must take there: that the settlements and codicil extorted during the Prince''s confinement, with sums largely fictitious and forged by Cosmar and the older Princes to defraud creditors, be annulled, the estates restored and creditors compounded with. Urges a thank-you letter to Hardenberg, a copy of the resolution, and 300 Rthl in gold, his funds being down to 118 florins.'
oe1bu9454-261: 'Reports firm assurances at Vienna that the Polish estates will be restored, with compensation for lost yield possible, and a reckoning held ready, though only for the Trąbczyn estates; the Kujawy claims remain unclear. Urges the Prince to make his declaration to the Higher Land Court at Brieg match Triebenfeld''s own submission, back Hahn and Eberhardt unreservedly, and spare no one: success would bring 112,000 Rthl to pay the Courland parties and defeat Cosmar. Encloses a draft power of attorney for privy councillor von Göschel, and reports himself 50 ducats in debt.'
oe1bu9454-262: 'Reports from the Congress that State Chancellor Hardenberg has publicly called the Prince the worst-treated of men and is pressing his case: if the memorials are confirmed without contradiction, the Curl heirs will be paid off, the settlement annulled by the King and Cosmar called to account. Asks urgently for blank forms, advance copies of the Commission and High Court of Appeal reports, a personal letter of thanks to Hardenberg detailing Connus''s withholding of 72,000 Rthl, and 100 ducats, being destitute. Suggests reviving Meyer''s French claims.'
oe1bu9454-263: 'News from the Congress: the King of Württemberg has left Vienna incognito as a Count of Teck, having handed out 4000 ducats to Imperial household staff and favoured actresses, leaving the Crown Prince, Winzingerode and Linden behind with powers of attorney; Privy Councillor Göschel submits a further note for the Prince. Welcomes the powers of attorney given to Court Councillor Hahn and Lombardini for Brieg, but warns the Chancellor wants the Prince examined in person, at Brieg or by a commissioner at Schlawenschitz, to confirm the submissions on satisfying the Courland heirs. Poland awaits the Congress''s close.'
oe1bu9454-264: A confidential account of the attempt to sell the Koschentin, Boronow and Cieschow estates, urging the Prince to tell no one. Triebenfeld reports that the King will allow no further estate purchases or exchanges, and that Court Councillor Barbe reacted with fury to the suggested 30,000 Rthl present for Prince Hardenberg, threatening to break off relations. Instead Barbe has recommended Koschentin to the wealthy Count Pourtales, who wants to invest in Silesia; Triebenfeld asks for a signed undertaking, drafted here, promising 30,000 Rthl on conclusion of that sale.
oe1bu9454-265a: Thanks a Privy Councillor of State for steering the writer's affairs and asks him to approve an advance of about 112,000 Rthl to satisfy the Burisch heirs, which would free the King from the nexus, return a guaranteed debt instrument for 300,000 Rthl, pay off all creditors and end Cosmar's hold on the entailed estates. Argues the six-year repayment term Triebenfeld proposed is unnecessary, citing 60,000, 100,000 and 48,000 Rthl still owed by Cosmar.
oe1bu9454-265b: A draft appeal, in the Prince's own voice, for help recovering the Kaemen and Trąbczyn estates, granted him in 1796 from the confiscated property of one Prussiemski and seized in 1807, fourteen weeks after the Peace of Tilsit, by the Warsaw administrative commission and returned to Prussiemski's daughter, now Miączyńska. The Kalisz tribunal declined jurisdiction; Hardenberg advised waiting on Pahlen. With the Prosna to become the border, he asks intercession with the Emperor for restitution plus eight years' revenues, and that Triebenfeld be heard.
oe1bu9454-266: 'Reports alarm at the Congress of Vienna: Russia now demands the Prosna as the boundary, which would place the Trąbczyn estates and Triebenfeld''s own Blizanow property under foreign rule; the Prince Chancellor is resisting and the King dines alone, and war is rumoured. Asks that letters be routed through Post Director Balke in Dresden and Barbe, and presses urgently for the blank powers of attorney, a letter to the Chancellor, a written undertaking to Barbe, and money: he owes Barbe 104 ducats and wants 300 more.'
oe1bu9454-267: 'Complains that nothing has arrived from the Prince in the 27 days since a letter of 17 December: no letter to the Prince Chancellor, no blank forms, no power of attorney for privy councillor von Goeschel, no written undertaking over Koschentin, and no money, leaving Triebenfeld stranded in Vienna and losing Hungern''s confidence. He waits above all on news from Brieg, asks for waybills, and reports Congress talk: England''s peace with America, Russian pressure over Poland, Hardenberg''s recovery, and a suggestion that the Prince negotiate in Paris himself.'
oe1bu9454-268: 'Reports from the Congress of Vienna: receipt of 1125 fl in paper money, delivery of letters to the Emperor and the State Chancellor, and further letters to General von Schöler and Privy Councillor of State Stägemann, with Schöler to be used to work on the Emperor over Trąbczyn, which may fall to Russia. Hopes Cosmar''s removal and the 112,000 Rthl will collapse the 1811 settlement; alarmed by Court Councillor Hahn''s report of halved entail revenues. War talk, Köckritz''s discharge, the King of Würtemberg''s departure. A postscript begs for 200 ducats to pay clothing costs of 926 fl and repay Hardenberg''s 100 ducats.'
oe1bu9454-269: Reports from the Congress of Vienna that a memorandum on the von Kircheisen correspondence has been laid before State Chancellor Hardenberg, who promised support; the matter now rests with Privy Councillor of State Stägemann, and Cosmar's removal and the loan are thought as good as settled. Fears Trąbczyn may fall to Russia, where female influence prevails, though Hardenberg talks of compensation; still lacks authority to approach the Russian authorities. Notes Constantine's conscription in Poland, talk of war, and Metternich's and Talleyrand's intrigues.
oe1bu9454-269a: A copy of a petition submitted on behalf of Prince August, forwarding a file of correspondence with Minister von Kircheisen that a court refused to enter in its record. Triebenfeld argues that Cosmar, citing the Kurz heirs' claim of 300,000 Rthl, has placed the Prince's property under arrest; the heirs would settle for 112,000 Rthl, only 12,000 in cash with an assignment for the rest. He asks for the advance, offers his whole property and liberty as security, and urges that Cosmar be made to account.
oe1bu9454-270: 'Political reporting from the Congress of Vienna: Kalisz too is to go to Russia, so recovery of Traperin must be pursued there, though the Prince-Chancellor forbids any approach and Moszynski and Count Landskoy are thought hostile. Wellington has arrived and is said to favour the King of Saxony''s restoration to Dresden and Leipzig. Humboldt promises help; the business waits on Privy Councillor Stägemann. Once the Lux creditors are paid and Cosmar''s attachment lifted, the Prince resumes lordship of the entailed estates.'
oe1bu9454-271: 'News from the Congress: the Polish boundary running from Thorn by Slupce near Pyzdry across the Warta and down the Prosna has been agreed, and the King of Saxony keeps Dresden, Leipzig and Bautzen, though English designs on East Friesland and Alexander''s demand of German land for the Viceroy of Italy may prolong things. Triebenfeld keeps pressing the Prince Chancellor and Privy Councillor of State Stägemann, reports the 112,000 Rthl advance as good as certain, and urges that Cosmar''s power of attorney be revoked and the Ministry of Justice and Brieg Superior Court told so. He awaits instructions on the Polish estates.'
oe1bu9454-272: Hahn encloses a drafted reply to Prince August, arguing that the withdrawal of the power of attorney follows from the Vienna resolutions but that further mistakes at Öhringen can only be prevented in person; he asks for a secret instruction and power of attorney to use in the last resort, and for a note in the Prince's own hand about travelling money. He blames Herr von Braun, no match for Cosmar, for past failures, promises to settle Goldstüker over a bill of exchange, and proposes inspecting the estates to establish their true yield and building costs.
oe1bu9454-273: 'A wounded point-by-point defence against the Prince''s reproaches: General Schüler and Count Nessetrock will not act, so help must come through the State Chancellor and Minister Humboldt; two French blank forms are wanted for a fresh appeal to the Emperor. Triebenfeld denies fault for the contradiction between the Prince''s own figure of 79,000 Rthl in estate revenue and the officials'' 36,000, Hahn valuing the estates at 2 millions; he rejects any secret deal with the Courland heirs over the 112,000 Rthl advance, asks to be replaced, and names Hahn as administrator.'
oe1bu9454-274: 'News from the Congress: the King of Württemberg has restored the Estates but summoned a diet for 15 March forbidding any reduction of taxes raised by 50 per cent, prompting protests to the Congress, and Prince August is to be warned to concede nothing. Reports on the King of Saxony, Hesse-Darmstadt, East Friesland and Swedish Pomerania. Hopes the 112,000 Rthl advance will now be approved, and has had the deeds and process records copied, certified and translated for the Trąbczyn claim.'
oe1bu9454-275: 'Complains that Privy Councillor of State Stägemann has still drafted no contract for the Prince State Chancellor despite repeated reminders, and suspects ill will; the decision would favour Cosmar but for a favourable Brieg report. Reports goodwill towards the Hohenlohe houses, with something going off to the King of Württemberg. Writes from his sickbed, working through friends, and begs for money: the translator will not release the Trąbczyn, Kulm and Kaemen files needed by the Commission until paid.'
oe1bu9454-276: 'Alarm at news from the councillor of justice Eberhard in Brieg, enclosed in the original and to be returned: something appears to have been written to Berlin, though the business still rests untouched with Privy Councillor of State Stägemann, suggesting betrayal from Brieg. Hardenberg has again promised help, with Prince Bartenstein to remind him. Triebenfeld urges that Eberhard be sent to Vienna to settle with the Princesses over the 112,000 demanded by the Curian heirs, reports the King''s reply as a form of words drafted by Minister von Humboldt, and adds news of Saxony and the sovereigns'' movements.'
oe1bu9454-277: 'A hurried report from the Congress, written with a headache two hours before the post: acknowledges an order to pay 200 M, French blank forms and enclosed letters; hopes Eberhard and Hahn will come; Stägemann still has no audience, the estates business has gone back to the Prince with its papers, and Zerboni''s reply is enclosed. Urges August to demand a power of attorney in proper form, reporting criticism of his lawyer''s arrest of his father''s property. Adds news of Napoleon''s landing near Antibes and march on Toulon.'
oe1bu9454-278: 'Urges the Prince to raise 500-600 Rthl in travel money so that the writer, Eberhard, can go to Vienna, where the three princesses of the Curian heirs are present in person and a settlement is, he argues, obtainable now or never after the Ministry''s repeated refusals. He sets out three obstacles: the heirs'' general attorneys have told him not to interfere, he has no money, and he needs passes from the Minister of Justice and the Chancellor of State. Triebenfeld''s reply will decide matters; Korb could find the funds.'
oe1bu9454-279: Written while sick in Vienna, a report that everything now depends on reaching a settlement with the Curish co-heiresses, after which the State Chancellor will release the advance and start the administration; Triebenfeld awaits J. C. Eberhardt urgently. A resolution on the Polish estates is again promised, but delayed until the status of estates taken by the Poles from grantees after the Peace of Tilsit is decided. Much news of Napoleon's return, his outlawry and the troops sent against him.
oe1bu9454-280: 'Regrets that Eberhard will not come to Vienna: without him no settlement with the Burisch heiresses can be secured, and Cosmar and Stägemann will spin the matter out; urges the Prince to send him at once, since the Electoral Princesses need money and Prince August has still not revoked Cosmar''s power of attorney. Notes the Chancellor''s unhelpful answer on the Polish estates, and reports war news: Napoleon nearing Paris, Wellington''s departure, a quarrel between Talleyrand and Emperor Alexander.'
oe1bu9454-281: Asks the Prince to provide Court Councillor Barbi's servant Stock with a basket-wagon for a journey into the Empire, and a two-horse cart so that crates of glass belonging to Hardenberg's officials Barbe, Heym and Philippsborn can be collected in Prague and taken to Schlawenschitz, favours worth cultivating. Reports no word yet from von Stägemann, suspects intrigue, regrets Eberhard's absence for a settlement with the Courland heiresses worth 50,000-100,000 Rthl more, and notes silence from Pourtales, possible Silesian estates, and news from the Congress.
oe1bu9454-282: Urges a settlement with the princesses while they need money, warning that delay will cost them 300,000 Rthl, and presses for Councillor von Eberhard to come to Vienna, offering to arrange everything if he travels with his own horses and a passport from the Prince and a border magistrate. Reports that 100,000 Rthl are to be paid over to Prince August in cash, not paper, criticises his acceptance of the presidency others refused, and passes on news of Napoleon's advance on Paris.
oe1bu9454-283: Beugelin undertakes to hand the Prince's letter to the Prince Chancellor of State without delay and to put the Prince's wishes before him in person, hoping to be the means by which the Chancellor satisfies them. He notes that he met von Triebenfeld only at Vienna, having known nothing of him before, but gave close attention to all he said once he spoke on the Prince's behalf. Otherwise a letter of compliment and assurance.
oe1bu9454-284: 'Reports from Vienna that the renewed war blocks progress, but sets out a claim for indemnification to be laid before the Emperor and King: 60,000 Rthl pledge-money paid to von Broniewski plus 33,000 Rthl interest, the Kaemen estates valued at 180,000 Rthl, and Trąbczyn at 316,000 Rthl less debts to Lichnowski, Grotowski and Seher, giving 366,000 Rthl in debt-free estates and 93,000 Rthl cash. Alegemann does nothing, Pourtales has not answered. Long news of Napoleon''s return to Paris, Ney''s defection, and a Württemberg scandal.'
oe1bu9454-285: 'A memorandum totting up what the Prince of Hohenlohe-Ingelfingen is owed. It traces the Kaemen estates, granted by the King in 1796 after Anton von Prussiemski but pledged to Broniewski for over 100,000 Rthl: two lost instances, 6,000 Rthl in costs and a 55,000 Rthl cash settlement in 1804, with interest to 1815 bringing the claim to 94,550 Rthl against the born Prusimska. Adds Trąbczyn, valued at 316,000 Rthl against 78,000 Rthl of remaining debts to Lichnowski, Grotowski and von Zerboni, and concludes that the sovereigns must indemnify him by some 367,164 Rthl in cash or estates.'
oe1bu9454-286: 'A report from Vienna on Napoleon''s return: French forces near the Rhine, Wellington''s departure, Russians passing through Prague, and Triebenfeld''s doubt that Prussia''s allies will act. Hardenberg promises everything, Stägemann obstructs, only General Amstetten favours compensation in estates. Enclosed is a memorandum costing the Prince''s losses on the Kaemener and Trąbczyn estates, taken from him in 1807: 85,400 Rthl pledge money and 390,100 Rthl in all, to be made good in cash or land. A postscript of 14 April continues the war news.'
oe1bu9454-287: 'Written amid the mobilisation against Bonaparte, this reports on Prince Adolph''s decision to enter military service: Triebenfeld will approach the King before his departure on the 18th to learn where Adolph should join him and what uniform to have made, expecting a place in the Guard. He defends Hardenberg''s slowness on the Prince''s business, refuses to show the Hahns'' threatening letter, notes Lombardini''s and von Beugelin''s efforts, awaits Pourtales, and lists the allies'' agreed contingents totalling 1,307,000 men.'
oe1bu9454-288: Urges that Prince Adolph reach Vienna by the 22nd, before the King moves on, and reports the Prince Chancellor's promise to commend him; complains that Stägemann still will not report on Cosmar, who should be made to deposit all monies with the Brüger High Court of Appeal, render account and lose his powers of execution to a supervisor. On Trąbczyn he has approached Minister von Stein and wants a French letter for the Emperor, valuing compensation at 316,000 Rthl on Blomberg and zur Höllen's estimate rather than Otto's; adds war rumours and talk of the Prince's debts.
oe1bu9454-289: 'Appeal to Cabinet Councillor Albrecht for a categorical decision from the King on a 300,000 Rthl debt to the Churish heirs, now 426,000 Rthl with interest, acknowledged by the Prince, his divorced wife and the late King in person: either the treasury pays and the Cosmar administration of the entailed estates, yielding some 80,000 Rthl yearly without accounting, is dissolved, or the King renounces the claim and advances circa 112,000 Rthl for a compromise, repayable within four years.'
oe1bu9454-290: Reports that Cosmar has finally been ordered, after seven months, to pay the three years of withheld monies to the Brieg High Provincial Court, from which 12,000 Rthl a year goes to the Prince's creditors; Stägemann is obstructive and now sides with Cosmar and the Curian heiresses, the Prince Chancellor promises but does nothing, while Minister Stein works to secure compensation through the office of Sokolnick. Complains that the Prince's son Adolph made a poor impression before the King, and asks urgently for 100 ducats by courier.
oe1bu9454-291: 'A report on business at the Congress: a royal cabinet order of 27 April directs immediate payment of the 100,000 Rthl to Prince August, and compensation for the Polish estates, some 300,000 Rthl, has been settled through Minister Humboldt but awaits the Emperor, with Stein, Vorontsov and Nesselrode pressing and Stein threatening to pursue it at Heilbronn. Cosmar is ordered to deposit the Prince''s monies on pain of arrest. Nothing yet on the military affair, and Triebenfeld asks urgently for money to leave Vienna.'
oe1bu9454-292: A report from Vienna on efforts against the administrator Cosmar, who has never deposited the sums fixed in the 1799 instrument and the 1811 settlement with the Brieg Higher Provincial Court, leaving creditors unpaid; Stägemann defends him furiously and would refer all to the Minister of Justice, while the State Chancellor Hardenberg was moved by the plea that the old Prince must live. Also the compensation claim before the Emperor, Stein's support, Prince August's 100,000 Rthl now ordered paid, and a proposal to intercept Hardenberg at Neisse.
oe1bu9454-294: Negotiations with the Duchess of Sagan over her claim of 30,000 Rthl, or 100,000 ducats in gold, are stalled because she believes the King of Prussia has promised to pay it himself; until she is told plainly from higher quarters that he will pay nothing, nothing can be done. Once that happens the writer expects her to settle readily on the offer of 150,000 Rthl, subject to ratification. She stays in Vienna, then goes to Baden for the baths.
oe1bu9454-295: 'Reports a wasted journey: the Russian Emperor had passed through Kalisz the night before Triebenfeld arrived, wrecking his plan to petition him, and the Chancellor is still in Paris, returning to Berlin only in about three weeks by way of Cassel and Frankfurt. News gathered from Chief Postal Director Espagne in Posen; doubts that Chief President Zerboni ever sent his promised report, the original records having gone to Schenck. Meanwhile pursuing the Betsche affair, whose subjects seek annulment of the contract, and money from his Blizanow tenants.'
oe1bu9454-296: A short, disjointed note forwarding papers as they arrive, with two original enclosures returned. Reports the death in Paris of Court Councillor Barbey, with an intention to approach his widow; the State Chancellor's expected and then confirmed arrival in Berlin; and that Cosmar has been found guilty of dishonest dealing at first instance and has appealed, which if upheld will cost him his guardianship. Expresses distress at Philippischen's dangerous illness and sympathy for the recipient's own.
oe1bu9454-297: Written from his sickbed, Triebenfeld reports his daughter's death four days after childbirth, Barbe's decease, and Trzciński's suffocation while drunk in Warsaw, then his own gout and haemorrhoidal colic, treated with fly-plasters after his physician gave him up. On the Betsche business he has extracted papers at Posen costing 22 ducats, claims Echaust ruined the forest by 170,000 Rthl, and refuses a general power of attorney for Assessor Schenck, asking the Prince to reply in his own hand.
oe1bu9454-298: Forwards a bundle of much delayed letters sent on by Schank, costing some 7 Rthl in charges, and reports that illness still prevents him walking or standing. Dismisses Zerboni's arguments, since compensation was promised in the Vienna treaty, and expects no difficulty there, noting a new contact friendly to him and to Humboldt. Asks that the Strehlitz post office release letters to him by express messenger before 15 January, requests game be sent via the leaseholder Faust at Gostyszyn, and reports Prussian currency devalued at Kalisz, the thaler to 20 Groschen.
oe1bu9454-299: 'Recovering from illness at Blizanow and waiting on the Prince''s approval before travelling to Posen and Betsche, Triebenfeld sets out a plan for Betsche: agree terms with the destitute Leixner in Miedzeritz, validate a recovered receipt and clear the mortgage entries, and consent to annulling the contract the insolvent burgesses and peasants seek, while keeping their earnest money and claiming arrears of canon of 11,000 Rthl, ending the sequestration, and pursuing Echaust. Also reports Humboldt and the compensation case, Trzciński''s plea for time, and his wish to be rid of Schenck.'
oe1bu9454-300: 'A damaged report, chiefly political gossip: a valuation has arrived at Gosztiszyn but no covering letter; Zerboni, having drafted an opinion on the organisation of the Grand Duchy of Posen with his secretary Schmidt and been refused a counter-signature by Prince Radziwill, declared himself the governing lord and has been packed off to Stettin. Also rumours from Petersburg of the Senate rejecting the Polish constitution. Triebenfeld plans journeys to Betsche and on to press the indemnification business.'
oe1bu9454-301: Acknowledges the Prince's letter of the 26th, brought by the house-steward Lombardini, whose arrival relieved fears for a missing messenger, and sends birthday congratulations with wishes for health free of gout. Refers the Prince to earlier letters for news of his affairs and asks for decisions; promises Lombardini can vouch for everything. Awaits his son and a tenant for Schweinern before travelling to Posen and Betsche, hopes for success in a compensation case having won over von Smiedecki at Kalisz, and requests game.
oe1bu9454-302: 'Reports thirteen special powers of attorney drawn up with justice-burgomaster Hawich of Zagorowo, now a Warsaw notary, and Chief Inspector Hecker: to lift the sequestration of the estates, collect and pay interest to judgment creditors, sue Oppenheimer and Wolf at Kalisz over entries exceeding 72,000 Rthl, remove the sequestrator Honrichs and annul his land sales, recover arrears from Niedzwiedzki''s heirs and the Olesnica hereditary leaseholders of some 32,000 Rthl, pursue boundary suits, and represent the Prince at the Warsaw Diet.'
oe1bu9454-303: 'An extract from the Hohenlohe liquidation registers listing 142 numbered creditors and their claims, with a few entries left without a figure. Sums run from 10 Rthl owed to J. C. Müller to the largest claims: 191,000 Rthl to Carl von Stössel, 170,000 to Goldstücker, 169,400 to Sigismund von Stössel''s guardian, 165,000 to Hein in Breslau, 112,000 to Charlotte von Triebenfeld and 76,791 to Barnheim in Berlin. Totals: 17,874 Rthl gold and 1,414,377 Rthl 7 g 11 d courant.'

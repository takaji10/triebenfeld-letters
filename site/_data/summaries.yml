oe1bu14526-001: A covering note forwarding the enclosed Wittowes deeds to Herr Criminal-Rath in Grimm, with the urgent request that the recipient speak to him in person about the circumstance. The writer explains that the files had long been searched for in the Trąbczyn registry, where he himself believed them to be, but that they turned up among his wife's papers when he moved from his Breslau lodging to Wilhelmsruh, she having received them during his absence and set them aside for safekeeping.
oe1bu14526-002: Punctation of purchase for the noble estate, village and Scholtisey Witow in the Warta district of the Kalisch Department, sold by Forest-Inspector Christian Friedrich Rochlitz for Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen to Martin Honrichs and Walęty v. Kwasiborski for 16000 Reichsthaler in three instalments, with no eviction-warranty for 1016 Skladen claimed by the burghership of Warta, a fallback one-year lease at 800 rtl, and a 1000 rtl penalty; appended is the Fürst's cession of 8000 rtl to the Breslau banker Carl Ferdinand Weigel, attested by the St. Vincenz Justice-Office.
oe1bu14526-003: Confirmation by the Hohenlohe-Ingelfingen Court Office at Betsche of the sale of the free schulz-holding No. 1 at Dormowe near Birnbaum by Joseph von Jankowski of Ninino to Captain and District Tax Receiver Andreas Ernst Gneust for 2,000 Reichsthaler cash, with the enclosed contract of 24 June 1797 recognised at Birnbaum, its schedule of onera (travelling-money, ground-rent, oats, fox-money, church dues), rights to 250 manorial sheep, brewing and Betsche timber, the publication protocol with Polish interpretation by Senator Hintsch, and the Fürst's reserved confirmation.
oe1bu14526-004: 'Contract of sale by which Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen conveys Kollno and Kaemen (Kamionna) in the Posen Department, granted him by Friedrich Wilhelm II in 1796, to Banco-Director George Conrad Leixner for 142,000 Rthl, already paid: 53,139 Rthl to the immissed creditor von Broniewsky and 88,860 in cash. Sold in Pausch und Bogen, with church capitals, the disputed Krobilawer timber right, a discharged 100,000 Rthl Triebenfeld mortgage, plus notarial attestations at Breslau and Leixner''s Frankfurt ratification.'
oe1bu14526-005: 'Contract of sale by which Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, Governor of Breslau, conveys the donated estates Kollno and Kamionne, with mills, propination, hunt and jurisdiction, to Banco-Rendant George Conrad Leixner of Frankfurth an der Oder for 142,000 Rthl in Pausch und Bogen: 76,000 already paid to Berg-Rath Bernhardi, 53,139 Rthl 13 Gg 8 4/5 Pf to Rittmeister von Broniewsky at Posen, 12,860 Rthl at delivery. Terms cover the Gory and Krobilaw felling right, church rents and taxes, Justitiarius Metzig, royal concession and Leixner''s intended dismemberment.'
oe1bu14526-006: Hereditary-lease and purchase contract before the von Hohenlohe Patrimonial Court at Trąbczyn by which War and Forests Councillor von Triebenfeld, General Bevollmächtigter of Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen, grants the farmer Blazy Kukulski one Hufe Magdeburg measure at Osiny in perpetuity for 100 Rthl purchase-money already paid and 30 Rthl annual hereditary rent, with public dues, brewery and milling compulsion, Laudemium of the tenth Groschen and no remission for misfortune. Filed with it are Triebenfeld's general power of attorney of 1805 for Zagorowo, Wittow and Trąbczyn, its Guhrwitz attestation, and the engrossment.
oe1bu14526-007: Hereditary-lease contract, opened and attested in Polish by the patrimonial court at Pyzdry, by which Councillor of War and Forests v. Triebenfeld, as General Bevollmächtigter of the Prince of Hohenlohe-Ingelfingen, grants the Hausländer Gottlieb (Bogumił) Sarre of the Peyser Hauland 1 1/2 Hufen of waste forest land near Trąbczyn in perpetuity for 150 Reichsthaler purchase money, already paid, and 45 Reichsthaler annual canon after three free years. Sixteen paragraphs fix redemption, milling and drink constraint, laudemium, pre-emption and forfeiture for two years' arrears.
oe1bu14526-008: 'Hereditary-lease contract before the Hohenlohe Patrimonial Court by which War and Forests Councillor v. Triebenfeld, General Bevollmächtigter of Fürst Friedrich Ludwig, grants Christian Friedenberger of Szymanowicer Hauland one Hufe Magdeburg measure in the Trąbczyn forest: 100 Rthaler entry-money receipted, thirty Rthaler yearly canon in half-yearly instalments, three free years to 1809, half redeemable, with milling and drink compulsion, Laudemium of the tenth Groschen and no remission for misfortune. Filed with it are Triebenfeld''s general power of attorney (Guhrwitz, 1805) and the royal Kalisch Chamber Consens for dismembering Zagorowo and Trąbczyn.'
oe1bu14526-009: Six-year lease (Johanni 1805 to Johanni 1811) of the demesne farm Kopoyno, granted before the Princely Hohenlohe Patrimonial Court at Trąbczyn by War and Forests Councillor von Triebenfeld as the Prince's General Bevollmächtigter to Maciey v. Niedzwiedzki, in Pausch und Bogen at 1500 Rthl. yearly, brewery, distillery and inventory excluded; eighteen clauses cover komornik and cottager services, free grinding at Tarzewo and Kopoyno, 50 cords of firewood, taxes and the Ląd monastery competency, repairs, sub-letting and remissions. A supplement of 24 August adds 13 Hufen at 625 Rthl., raising the rent to 2125 Rthl. Witnessed by Anton v. Rapacki, engrossed by Justitiarius Schenck.
oe1bu14526-010: 'Hereditary quit-rent contract before the Princely Hohenlohe Patrimonial Court at Trąbczyn: von Triebenfeld, general Bevollmächtigter of the Prince zu Hohenlohe-Ingelfingen, grants Building Inspector Johann Wilhelm Wollenhaupt 18 Hufe of arable at Drzewce and 2 Hufe of meadow at Wrąbczyn, with dwelling house and brewhouse, for 6000 Rthaler and 300 Rthaler annual quit-rent, obliging him to dismember the land into ten holdings. A later protocol annuls the contract entirely, Wollenhaupt receiving 600 Rthaler and giving general receipt, reserving 43 rttl 1 Silber-gr amelioration; engrossed under court seal.'
oe1bu14526-011: 'Hereditary quit-rent contract before the Trąbczyn Patrimonial Court between Councillor of War and Forests v. Triebenfeld, General Bevollmächtigter of the Prince of Hohenlohe-Ingelfingen, and Johann Seymert, fine-cloth dyer and councilman of Zagorowo: three Magdeburg Hufen of demesne land (2 Hufen 24 Morgen arable, 6 Morgen meadow) for 900 Rthaler purchase-money at Johannis and 45 Rthaler yearly quit-rent in two instalments, with tavern compulsion, tenth-Groschen Laudemium on sale, exemption from labour services, and renunciation of all remission. Signed Triebenfeld, Seimert, Schenck, Brauer.'
oe1bu14526-012: 'Hereditary quit-rent contract before the Trąbczyn Patrimonial Court between War and Forests Councillor v. Triebenfeld, general plenipotentiary of the Prince of Hohenlohe-Ingelfingen, and forester George Friedrich Kammer of Pietrzykowo: 6 Hufen 20 Morgen Magdeburg of arable and meadow from the Przybysław demesne farm, with its buildings and timber, for 2100 Rthaler (800 at Johanni, 1300 at Christmas) and a perpetual annual quit-rent of 100 Rthaler. Kammer bears all taxes, Kloster Ląd dues and clergy levies, must take beer and brandy from the manorial tavern, remains under the Dominium''s jurisdiction, pays Laudemium on sale or exchange, and renounces all remission. Signed by Triebenfeld, Kammer, Schenck and Brauer.'
oe1bu14526-013: Hereditary-lease contract in nineteen paragraphs by which von Triebenfeld, General Plenipotentiary of the Fürst zu Hohenlohe-Ingelfingen, cedes 20 Magdeburg Hufen (560 Morgen arable, 40 meadow) of Trąbczyn land on the Kopoyner side to Amtmann Johann Gottlieb Tschachmann for 6,000 Rthaler, 200 paid down and 5,800 due 22 June, plus 15 Rthaler yearly rent per Hufe, unredeemable, with Laudemium of the tenth Groschen on resale, tavern obligation, free lodging in the cooper's house to Midsummer 1806, no pasture or timber rights, and forfeiture after two years' arrears; witnessed by Cabanis and Richter.
oe1bu14526-014: Irrevocable hereditary quit-rent contract concluded before the Patrimonial Court at Trąbczyn between Councillor of War and Forests Peter Friedrich August v. Triebenfeld, General Bevollmächtigter of the Fürst zu Hohenlohe-Ingelfingen, and the princely Forest Inspector Carl Titz, granting Titz five Magdeburg Hufen of the Trąbczyn demesne arable towards Podbiele and the mill-ditch, with orchard, for 1500 Rthaler purchase-money in two Johanni instalments and 75 Rthaler yearly quit-rent, plus taxes, Ląd monastery assessment, beer and brandy monopoly, Laudemium on sale, and no remission for misfortune.
oe1bu14526-015: Hereditary-lease contract in 22 articles by which von Triebenfeld, General Plenipotentiary of the Fürst zu Hohenlohe-Ingelfingen, makes over 270 Magdeburg Hufen of field, meadow and woodland from Trąbczyn, Łazy, Osiny, Neudorff and Przybisław at 300 Rthl purchase money and an irredeemable annual rent of 15 Rthl per Hufe, with Laudemium of the tenth Groschen, tavern compulsion, joint liability and 13 free Morgen per new village; signed by Titz, Zander and other lessees, with a Pro Memoria deducting 156 Hufe 25 Morgen 9 Ruten already parcelled out.
oe1bu14526-016: Hereditary-lease contract, engrossed under the Trąbczyn patrimonial court seal, by which Friedrich Ludwig Fürst zu Hohenlohe-Ingelfingen, through his general plenipotentiary the Councillor of War and Forests v. Triebenfeld, cedes in perpetuity the Trąbczyn demesne farm Althütte, 10 Hufen 10 Morgen Magdeburg measure, to the tenants Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dämmel, Gottfried Dams and Christoph Schoenfisch for 1,500 rtl purchase-money (450 paid, 1,050 due St. George 1805) and 225 rtl annual canon, with laudemium, tavern obligation, joint liability, and cancellation of an earlier Kunkel contract.
oe1bu14526-017: Sale and hereditary-rent contract by which Justice Commission Actuarius Kunkel, as Bevollmächtigter of Friedrich Ludwig, Fürst zu Hohenlohe Ingelfingen, sells ten Hufen and ten Morgen of the Alte Hütte demesne farm of the Trąbczyn lordship to six Hollanders — Martin Giering, Wilhelm Daniel Schulz, Gottfried and Michael Dumel, Gottfried Damt and Christoph Schoenfisch — for 250 rtr per Hufe, 2500 rtr in all, payable 450 down, 550 at St. John's 1804 and 1500 in March 1805, with five rtr hereditary rent per Hufe, wood and pasture rights, brick allowance and ten per cent laudemium; signed by marks, subject to princely ratihabition.
oe1bu14526-018: Hereditary-lease and sale contract by which Friedrich Ludwig zu Hohenlohe-Ingelfingen, through Building Councillor Johann Wilhelm Glenk, conveys the Lordship of Betsche - demesne farms, Obra farm, forests, propination, brewing and distilling - to the town of Betsche and the villages Stalluhn, Kulligowo, Schartzig, Stoki, Schwichodzyn and Lowin for 180,000 Rthlr and 1,000 Rthlr yearly ground-rent, the communities assuming 137,000 Rthlr of intabulated debt (Glenk, Meyer Bernhard, Nathan and others), with jurisdiction, Laudemium and hunt reserved. Plenipotentiaries Matheus Młynkiewicz and Jan Chmara sign, with Polish interpretation by Echaust; a supplement of 29 July and the royal Chamber's 1806 approval follow.
oe1bu14526-019: 'Engrossed hereditary-lease and purchase contract by which Friedrich Ludwig zu Hohenlohe-Ingelfingen, through General Plenipotentiary Baurath Johann Wilhelm Glenk, makes over the Lordship of Betsche — demesne farms, Obra farm, forests, propination, brewing and distilling rights — to the town of Betsche and the villages Stalluhn, Kulligowo, Schartzig, Stocki, Schwiechodezin and Lowin, represented by Matheus Młynkiewicz and Jan Chmara, for 180,000 Rthl plus 1,000 Rthl annual canon: 137,000 Rthl in assumed mortgages (Glenk, Meyer Bernhard, Hirschel, von der Marwitz, Michaelis), 35,000 Rthl cash, 8,000 Rthl at St John. Jurisdiction, Laudemien and hunt reserved; interpreted by Echaust; supplement of 29 July appended.'
oe1bu14526-020: Deed of gift by which Friedrich Ludwig Fürst zu Hohenlohe conveys the manorial dwelling-house at Swięcia — expressly excepted from the hereditary lease of the demesne-farm, husbandry buildings, arable, meadows and woodlands granted the same day to Johann Christian Birlack of Zilenzig, Johan Götzinger of Brennenhofs Fleis, Joh. Siebert of Zamaika near Sonnenburg and Friedrich Götzinger — to Götzinger, innkeeper at Posen, and his heirs as his own property, in acknowledgement of his trouble and journeys in the hereditary-lease business and for use as a tap with his brewery lease.
oe1bu14526-021: 'Punctation in twelve paragraphs between Peter Friederich August v. Triebenfeld, acting as General Mandatarius for the Fürst zu Hohenlohe, and Franz Meierowitz for the sale of the estate Wittow in the Warta district with all appurtenances, in Pausch und Bogen and without warranty: 20,000 Reichsthaler Courant (8,000 at George, 12,000 at Johanny) plus a perpetual annual canon of 500 Rthl, redeemable by 10,000 Rthl capital. Conveyance awaits annulment of the sale to Honrichs and a royal concession to hold noble estates; costs shared, with 6,000 Rthl owed the widowed Frau Obristen von Schliesen possibly left standing at priority. Witnessed by Friedrich Willhelm Eger.'
oe1bu14526-022: 'Royal rescript to the reigning Fürst zu Hohenlohe-Ingelfingen, transmitting an engrossed copy of the purchase contract concluded with the Banco-Rendant Leixner over the estates Kolno and Kaemen, confirmed under the same date, with the customary formulas of Royal grace and friendship. Issued by the Royal South Prussian Government at Posen over an illegible signature, and endorsed with the charges levied: fee 1 rt 2 g, stamp 6 g, fair-copying 2 g, service 3 g.'
oe1bu14526-023: Royal confirmation, under the South Prussian Government at Posen, of the purchase contract of 16/25 January 1805 by which Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, sold Kolno and Kaemen (Kamionna) in the Meseritz district to Bank Rendant George Conrad Leixner for 142,000 rtl., already paid, partly 53,139 rt. to von Broniewski. Filed with it are the notarial recognitions, the Posen protocol of 6 February 1805 (Melzer, Glenk, Guderian), church capitals, the 100,000 rt. Triebenfeld mortgage, the Krabielew timber suit against von Kwilecki, and Leixner's powers of attorney and their extension.
oe1bu14526-024: 'Refusal, on the strength of a Cabinet Resolution and a rescript of the South Prussian Finance Department, of the Fürst zu Hohenlohe-Ingelfingen''s petition of 31 December to hereditary-lease the lordship of Betsche to the town''s burghership and rural residents; the submitted contract is returned. Three grounds are given: other lordships would follow suit and diminish noble landholding; the Betsche forest, the only sizeable one there, would be devastated by lessees; and the residents already hold sufficient land and lack means, the burghers being better directed to urban trades.'
oe1bu14526-025: 'Sale, subject to princely ratification, of the estate Szetlewek near Trąbczyn by Johann Wilhelm Glenck, Councillor of Building and Economy and plenipotentiary of the Prince zu Hohenlohe-Ingelfingen, to the flour-miller Samuel Lucke of the Białobrzeg mill near Wrąbczynek: 1000 Morgen Magdeburg of arable, meadow, garden, clearing and woodland with the farm buildings, for 12333 rthlr (8333 to the pledge-holder von Radzinsky on vacating, 4000 to the Dominium) plus 500 rthlr yearly canon; propination, brewhouse and distillery at 400 yearly rent, building timber granted, subjects'' services excepted, and four weeks allowed for Lucke''s co-purchasers to sign.'
oe1bu14526-026: Protocol before the Police Magistracy at Zagorowo in which Police Burgomaster Nüchler of Peisern, the miller Luka of Białobrzeg and the Schütze Reise of Wrąbczynek renounce their contract of 20 November 1798 with Hohenlohe Building and Economy Councillor Glencke, General Bevollmächtigter, for parcelling out Szetlewek in the Trąbczyn estates, the possessor v. Brzezinski having obstructed vacating it. They demand 200 rt for travelling expenses and disclaim liability to settlers who paid earnest-money; Glencke agrees subject to the Fürst's approbation.
oe1bu14526-027: Titz and Bancke report to the Building and Economy Councillor that the miller Luka has renounced the contract and will settle the particulars at Kalisch, having received his 25 Rthl; two men seeking land were put off until matters with Trąbczyn and Herr v. Szucki are concluded. They ask that the Royal Government be informed of Szucki's withdrawal-payment, that His Serene Highness supplement the community's 1000 Rthl, and for further instructions; a postscript notes the joiner intended for Szetlewek has bought a house in Zagorowo.
oe1bu14526-028: Glenk reports to Criminal Rath Grimm at Kalisch that his contract with Ehe von Radozimski is annulled, enclosing the exchange of letters. The contracting parties Luck, Kriede and Nüchler refuse to withdraw, having already produced 18 farmers who lodged pledges for nearly two-thirds of the fields; Griese is bound for 2/M. rt. security, to be pursued judicially at Peysern. Damages should be charged to von Radozimski. Also touches the Slugozin meadow dispute, maps by Gunter and Sprengel, the Trąbczyn Hauländer privilege, and 5 ducks.
oe1bu14526-029: Notification from the Court Office at Betsche, signed Metzig and Neumann, that Sigismund von Rzadkowski has sold his hereditary quit-rent holding at Głazewo to his half-sister Susanna née Treben, the contract of 28 September being appended in Copy and approved under reservation of the princely rights; as holder of the right of pre-emption, the Fürst is asked to declare within the stated weeks whether he will exercise it, silence being taken in law as renunciation for this case.
oe1bu14526-030: 'Vidimated extract from the Privilege Book of the Posen cathedral chapter, issued in Forma probanti, reproducing Bishop Theodor Prince v. Czartoryski''s privilege for the married couple Simeon and Apollonia Rząkowski: one Hufe of waste arable land in Głazewo, of the Betsche key, with manor-built dwelling-house and barn, sold for thirty ducats in specie, against 130 fl. po. yearly in two instalments of 65 fl., head-money and Hibernen, fourfold labour-service on the Głazewo demesne and clearing of the Obsko meadow, with beer allowance and guarantee of quiet possession to their Successores.'
oe1bu14526-031: 'Transumed privilege from the Book of Privileges of Poznań Cathedral, issued under the Chapter''s seal by Melchior Janowski, Apostolic Notary, reproducing the grant of Teodor Czartorski, Prince, Bishop of Poznań, to the spouses Simeon and Apollonia Rządkowcy: a vacant Ślad of arable at Głazewo in the Pszczew key, with dwelling-house and barn, sold for thirty red złoty in specie against an annual rent of 130 Polish złoty in two instalments, plus poll-tax, hiberna, four tłuki yearly, meadow-clearing at Obska, and a beer allowance from the Pszczew brewery; approved in the St Martin General Chapter of 1767.'
oe1bu14526-032: 'Closing certification of a translated chapter extract: the notarial subscription of Melchior Janowski, Notarius Apostolicus and secretary of the Reverendissimum Capitulum Cathedrale Posnaniense, followed by the attestation of the sworn translator George Wilhelm Behr, who certifies under oath that the preceding German rendering agrees word for word with the Polish original extract. Only these two authenticating clauses survive on the page; the substantive text of the extract itself is not present here.'
oe1bu9454-001: Reports word from a trusted friend that Austria, Russia and Prussia have agreed over Saxony and Poland and the Congress may soon close; having had no news since 13 January, the writer fears ruin if nothing is settled for him. Urges pressure on Prince Hardenberg for an advance of 112000 Rthl and administration of the entailed estates, which would end Cosmar's execution, satisfy the Curl heirs and the mandatary's 12000 Rthl, citing the favourable Brieg High Provincial Court report; also asks that the Trąbcziner and Kaemener estates, seized after Tilsit, be restored with revenues reimbursed by the Moszynska.
oe1bu9454-001a: 'Forwards a just-received letter from the hard-pressed Prince of Hohenlohe, describing the old man''s boundless and unspeakable distress, and pleads for an advance of 112,000 Rthl as the sole means of rescue: it would at once satisfy the Courlandish heirs, whose claims allowed Cosmar to force himself alone into the entailed estates, end Cosmar''s power, release His Majesty ex nexu, and repay creditors bit by bit from the entail''s funds. Asks instruction whether to submit the deeds for the Trąbcziner estates in the Koniner district.'
oe1bu9454-002: 'Protests that seven letters since the 13th of last month have gone unacknowledged, listing their contents: approaches to Gm. Schöler over Trąbczin, thanks to Privy Councillor of State Stägemann, Kircheisen''s correspondence, and news that Kalisz and the districts containing the estates fall to Russia, with much of Saxony lost. Reports Hardenberg''s, Humboldt''s and Stägemann''s goodwill, Wellington''s arrival, rumours of new war, and Count Pourt:''s wish to buy though only 150 Rthl is available. Begs desperately for 200 ducats, owing 100 Rthl to the Prince Chancellor and 70 Rthl to Barben, and urges Prince August to revoke Cosmar''s power of attorney publicly.'
oe1bu9454-003: 'Desperate appeal for money: only 932 Rthl received in five months against 1400 Rthl reckoned for four weeks, leaving 170 th owed to the Prince and Barbe, and no 12 fl. for a hired coach to visit Minister Nesselrode and Privy Councillor Schröder over the Pohl affair; begs 200 ff be sent at once. Advises caution in nominating an administrator of the entailed estates in the King''s name — a devoted man able to give cash security, with economic and ironworks knowledge — and urges a Pro Memoria be sent quickly for the Prince Chancellor''s approval.'
oe1bu9454-004: 'Reports from Vienna on Napoleon''s return: Grenoble and Lyon taken, some 30,000 men and the Grenoble artillery gathered, Soult, le terre and Bertherand named as adherents, 10 million francs set on Napoleon''s head with 3 million pledged by Massena, and rumours swinging hourly. Requests a wicker waggon with tilt-cover and horses at Schlawenschitz for Court Councillor Barbe''s servant and for glass belonging to Kraibe, Heym and Philippsborn at Prague, passes for the drummer and coachman to Blizanow, blank forms, and Eberhard''s coming; asks about J. Augeit and the power of attorney, and whether the Prince would act as administrator.'
oe1bu9454-005: Reports that "the tall" Zerboni has pressed Trzcinski, on the strength of an alleged cession, to pay him 5000 Rthl out of the Prince's claim of 10000 Rthl; Triebenfeld has contested this and wants Trzcinski's declaration made before the court, but begs immediate confirmation. Doubts Trzcinski's claim to have paid 1000 to König for the Bischdorff business, and fears Zerboni may have abused a blank signed sheet. Notes Prefect v. Smiedecki at Kalisz will report favourably in the indemnification affair touching Sokolnik, and awaits replies on the Betscher and other matters.
oe1bu9454-006: Reports from Vienna, on Prince Adolph's departure, that the Würtemberg matter must await the conjunctures, while he pursues indemnification and the Curish affair, having demanded the starosties Sokolnik and Wieruszew; expects Stein and Nesselrode to decide, distrusts Zerboni, Hardenberg and Stägemann, and calls the 85/m d. from Kaemen cash advanced. Recounts Cosmar's exposure, the Syten bacchanalia and the Curish heirs' denunciation, Pourtales's silence, disparages August, and begs 100 ducats by express courier.
oe1bu9454-007: Third unanswered appeal from Charlotte von Triebenfeld, writing from Breslau, who has again been referred to the Prince by a letter from her father. Describing her misery as having overstepped all bounds and abandoning hope of putting her case to her father in person, she withdraws any plea for financial aid and asks only that the Prince have one of his subordinates send her her father's address, so that she need trouble him no further with complaints.
oe1bu9454-008: Acknowledging three letters at once, Triebenfeld writes in near-frenzy after news of his destitute children, begging the Prince to send 120 Rthl to the Lüder woman and a further 60 Rthl monthly while he remains away, since he lives on borrowed money and sacrifices his family's welfare. He also asks for a brief written assurance from the Curz Mandatarius that the matter will be settled for 112000 dH, warns of powerful enemies and of z. M. v. Kirchen's position as guardian and party, and mentions Hahn.
oe1bu9454-010: Reports from Vienna that his own twice-weekly letters, usually sent via Teichelmann, have failed to arrive, and that a tracer will be requested from Post Director Mann. The Prince Chancellor has given favourable assurances and means to settle the Prince's affairs before leaving; Steegemann has still made no report. The fehlinische matter has gone to the Commission with a Pro Memoria of his calculation, compensation likely in estates since cash is wanted for the war. Detailed troop numbers for the coming campaign against Napoleon; rumours of Massena as pretender. Urges revocation of Prince August's power of attorney and encloses a letter for H. C. Eberhard.
oe1bu9454-011: Urges the Prince to send Herr Eberhard to Vienna at once, since the case will be heard this week and will be won only if a settlement with the Churp. heiress is reached; even at 50,000–100,000 more, Hardenberg's goodwill would secure it, at the cost of five further years of administration and yearly returns of 6,000 Rthl. Reports Prince August's refusal of Cosmar's power of attorney, proposes having Prince Adolph declared instead, relays Congress rumours of war, Saxony, Talleyrand at Pressburg and Murat, and begs 100 Rthl to pay Starben.
oe1bu9454-012: Desperate appeal for 200 ducats (later called 200 Th.), without which nothing can be accomplished and the writer fears disgrace and the Prince's anger. Urges that Prince August quickly demand the return of the power of attorney from Cosmar, warning that the young man is ill regarded despite his moustache, and that his written undertaking, apparently left behind at Öhringen, be carefully guarded. Notes that the King of Würtemberg has recognised the mediatised princes as Estates and sent a constitutional project, against which the Estates have protested.
oe1bu9454-013: 'Written for the Fürst alone: criticises the record of the case as long-winded, passing over essentials while dwelling on the Adolph affair, and reports Hahn''s scheme to wrest Adolph from the villain, have the King declare it entailed, then buy Koschentin (said to yield 55000 Rthl, against Schlawentzitz with Oppurg at barely 40000). Pleads urgently for 200 Rthl and French blank forms, detailing losses on paper (near 400 fl.), a 145 x debt to Barbe, tailoring costs, near-starvation and illness; the Prince hopes for 6000–7000 annually against 114000 Rthl lost since 1800; Barbe has found a translator for 15 ducats; no word yet from Pourtales.'
oe1bu9454-014: Puzzles over the lack of any decision on the Prince zu Hohenlohe's complaint, and over Berlin reports that an investigation has begun before the Kurmärkisches Board of Wards against Cremne, which is thought likely to embolden Cosmar to withhold rents in arrears since 1812 for the creditors. Reports the failure to compose the ducal Karl debt, the General Mandataries refusing, Justice-Councillor Bennebirg prosecuting; urges that the King assume the debt outright and remit the Prince's own 35000 Rthl.
oe1bu9454-015: Reports from Vienna that the Prince State Chancellor has written to Öhringen that His Majesty will not oppose surrender of the 100000 Rthl bequeathed by the late Princess Sahhin and claimed by Prince August, Kircheisen being instructed to expedite it; the 112000 Rthl advance is deemed secured and Cosmar's removal resolved. The Polish files, especially the Traperin matter, await a sworn translator demanding 260 fl. Triebenfeld, gravely ill, penniless, owing Barbe 70 H and facing eviction, begs rescue and support for his daughter.
oe1bu9454-016: Conflicting rumours in Vienna about the monarchs' departure — one day the King of Prussia and the Russian Emperor leaving by Berlin for the army, the next not before May; an enclosed note on Germany's arrangements, with Harum a point of contention. Lieutenant-Colonel v. Thiel confirms the King will still be present on the 20th for Prince Adolph's presentation and request for army service, and that nothing departs before the 22nd. Reports Murat's advance to Mantua, Russian marches and Bonaparte's build-up around Paris; the Kosten estates still await an equivalent, and Zagorow is offered as security.
oe1bu9454-017: 'Reports gossip in Kalisz: General Kleist, told by Prefect Count Garczynski that the Hohenlohe estates were considerable but ruined by war and arrears, repeated the Prince''s sons'' claim in Berlin that Triebenfeld pockets the revenues; Triebenfeld protests his poverty, illness and lawsuits, is having Chomanowski investigate, and blames Sommer and Schlawenschitz for rumours of 1,700000 Rthl of debts. Cites rent arrears of some 30000 Rthl and presses for answers on Sobottendorff, Weigel and the 50000 Rthl Invalids'' Fund, and for the French department''s decree and receipt.'
oe1bu9454-018: Written from a violent fever, rejects the instrument and power of attorney the Prince has had drawn up as needless, since Triebenfeld already holds a general power. Explains that all funds are under arrest and that, under the French General Government's decree, he alone may reclaim the 3121/3125 Rthl paid under French duress to Intendant Maluce and the Invalids' Fund. Demands a declaration assigning him 4219 Rthl from the arrears of Wrąbczyn, Alt Olesnica, Kopoyno, Skokum, Swiątniki, Adelow, Sophienthal and Neu Swięce, recoverable by komornik, and sends his forester to fetch it by the 15th or 16th.
oe1bu9454-019: 'Urges the Fürst to conclude the Sobottendorff business as vital: an 18-year lease of grounds, buildings and meadows for 36000 Rthl would satisfy a creditor owed 40000 Rthl without touching present revenues, made possible by settlements with Tschachmann or Cybalski and with Heinrich, whose 1300 Rthl withdrawal-money is secured on Blizanow. Presses for the prescribed instrument and the Sobottendorffs'' speedy arrival, since all funds here are under arrest; complains of daily costs, judges, Lorenz, 300 Rthl demanded for the Warsaw suit, and expects 4000 Rthl interest from the Wytwiver case.'
oe1bu9454-020: Reports Amelang's news of a new Cabinet Order requiring payment in cash Courant despite valuta given in paper, costing 1500 Rthl in the von Lahr affair; a sequestrator sits in Triebenfeld's Kontopp estates and he fears renewed arrest over the outstanding 3000 Rthl. He has offered van der Lahr, in the Fürst's name, 1000 Rthl cash plus 350 Zentner iron at 6 Rthl, and begs 950-1000 Zentner iron at Kontopp by 20 April; notes 163 Rthl Zagorow legal costs and General von Zastrow's defence of the Fürst at Jena. With a copy of the letter to banker van der Lahr.
oe1bu9454-021: A hurried, partly garbled night letter sent via Lombardini, reporting panic at the expected arrival of the Russians and Plugo Ledeli's visit. Triebenfeld predicts, on Polish opinion, the restitution of the Trąbcziner, Kaemener and Brzyrer estates, floats schemes involving Constantin, the Principality of Łowicz, Talleyrand and "little Dorothea," and reports leasing Kontop and Schweineren for 14000 Rthl yearly. He begs money for bribes, being penniless — Richter has pawned his watch — and asks that Lombardin pay 200 Rthl to his daughters in Breslau.
oe1bu9454-022: 'Writing while laid up with gout, Triebenfeld details the four lawsuits he bears as the Prince''s surety: the Invalids'' Fund affair, the suit with the Jew Oppenheimer (conducted by Empich), and Colonel''s lady Schliefen''s action in Breslau, met by his own suit in Poland against Meierowitz over 6000 Rthl purchase money for Wittow and 2500 Rthl of arrears in hereditary quit-rent. He itemises 132 Rthl paid to the executor Alexius and 259 Rthl owed, names Stieger, Hawich, Honrichs and Radenski, and complains bitterly that Lombardini has not paid the 100 and 50 Rthl ordered for his destitute son and daughters, begging 500 Rthl.'
oe1bu9454-023: Renewed, desperate appeal for a few hundred in coin for his starving daughter and children, with a reckoning of advances received (3000, 1000 and 300 Rthl, plus 4000 in iron) against 17500 Rthl in borrowings from v. d. Lahr, Cote, Blochsräff and Holzapfeln and costs, leaving 1600 and 3500 Rthl outstanding; reports gout, execution by the Glogau executor Allexius, 591 Rthl 18 g. borrowed and 185 Rthl of fees due, seven pending lawsuits, Stenger's engagement for Karge, Zagorowo, Trąbczin, Betsche and Wittow, Honrichs's silence, and rumours of Russian occupation.
oe1bu9454-024: Prince Hohenlohe's own appeal to a Privy Councillor to negotiate a single loan of 100,000 Rthl, secured by a first and sole mortgage on the colonised South Prussian lordships Zagorowo and Trombschen, with interest and amortisation payable yearly and a 5 pt. gratuity for the agents; power of attorney and documents promised. Appended are Triebenfeld's schedule of the 34 constituent places and a net yearly yield of 40247 Rthl 14 g 11 d certified by the Kalisch Chamber, and a list of debts (Schlabrendorff, Lichnowski, Oppenheimer and Wolff, the Invalids' Fund and others) totalling 366000.
oe1bu9454-025: Reports hastening to Zagorowo to quell a renewed peasant insurrection against the separation of the interior lands, now settled, and missing the King's departure from Berlin along with his patron's fund. Instead Justice Councillor Bucholz has arranged 80000 Rthl of von Bredow's Seehandlung money against mortgages on Kontop (30000), Schwammern (20000) and Trąbczin (30000), to pay Countess Schlabrendorff 25000, Weigel 25000, Hahn 5000 for Koschentin, the Prince 5000 cash and Triebenfeld 30000 for the Wulffs, against a note for 30000; v Tismar meanwhile negotiates 360000 Rthl with Nathusius of Magdeburg, and Honrichs reports new purchasers for the lands.
oe1bu9454-026: Relief at learning through Secretary Koppe that the Prince has survived; malicious rumours had made matters seem far worse. Reports borrowing 8000 Rthl from Minister von Stein on a Kontopp mortgage, false reports from Rittmeister v. Dorville and Postmaster v. Secqebarth that the Prince had gone to Silesia or Sagan, and a fruitless journey with a 6000 Rthl order of payment and 2000 Rthl in Treasury notes. Promises a further 4000 Rthl, hopes for a 20000 Rthl Schweiner mortgage, notes South Prussia yields nothing, and expects the Kolzig estates to raise 100000 Rthl.
oe1bu9454-027: Reports that Trąbczin and Kaemen have been seized by force by the Prusimski family, against which nothing can presently be done; protestations have been lodged to secure the sum he registered, though he expects dismissal. Notes that Frau Generalin v. Sanitz, similarly dispossessed, has petitioned Emperor Napoleon, whose reply will set the norm. Plans to travel to Memel and perhaps Petersburg to reach Emperor Alexander, hoping Grand Duke Constantin, recipient of a set of firearms, may help; Höst can achieve nothing.
oe1bu9454-028: 'Reports that on the 3rd the Trąbczyn estates were taken over by Appellate Judge v Lipski, commissioner of the Kalisz Court of Appeal, and handed to Canonicus v Jezierski, mandatary of Madame v Dąbska née v Prusimska, allegedly by order of the governing Commission at Warsaw; a remonstrance was lodged invoking the Peace of Tilsit and reserving all rights on account of debts paid, but no copy of the ordinance was granted. Notes two new suits: Provost Iwanski and Kuchary claiming the Swięciacie tithe, and Martin v. Otocki with the miller Ekstaedt claiming circa 7000 Rthl over the 1798 Trąbczyn lease; asks that the Breslau composition be sent and a power of attorney issued. Signed Hawich.'
oe1bu9454-029: Requests an appointment in Breslau, recalling a meeting with Court Councillor Hahn at Lohsen near Brieg where a rendez-vous was promised after the return from Memel; the writer has been pressed on the matter by his master, His Serene Highness. He warns that French quartering is now expected at Schlawenschitz, which would prevent his leaving, oblige him to clear the stables and seek other lodgings. Signature partly illegible.
oe1bu9454-030: Reports his arrest in Berlin by two French gendarmes, held under guard as the Prince's General Plenipotentiary until 5000 rtt of two years' arrears of interest on the 50000 Rthl borrowed from the Invalids' Fund was paid, though the banker Apenheimer had contracted to discharge it. Released only after paying 2000 Rthl of his own and a surety of 5000 Rthl from Minister v. Zastrow, repayable 1 June. Begs return of the 6000 Rthl bank order ceded to Eysenhardt to recover his 10000 mortgage, hoping for money from a Generalin von Blücher; Zastrow is pressing the French for restitution of the Trabezyner estates.
oe1bu9454-031: Writing from Berlin while ill and under arrest for interest arrears, Triebenfeld begs urgently for the return of the instruction for 6000 Rthl so he can recover his pledged 10000 Rthl mortgage, and presses the loan scheme (150000–250000 Rthl, with 102000 retained). He protests the appointment of Hawich of Peisern as Justitiarius and the general power of attorney given to Heinrichs, whom he calls a knave, defends Mitschke and Hecker, proposes salaries totalling 1800 Rthl against 3700 formerly, dismisses the Otocki, Radzinski, Iwanski and Przespolewski claims as fabricated, and urges paying Ephraim in treasury notes at nominal value.
oe1bu9454-032: Answering an enquiry of the 23rd, Triebenfeld sets out a fresh revenue statement for the Zagorowo lordship, itemising propination rights, hereditary-lease interest from Olesnica, Wrąbczin, Emilienhain, Klein Ingelfingen, Swięcia, Sophienthal, Kopojer and others, and jurisdictional dues, totalling 27,700 Rthl, against effective debts of 148,800 Rthl (Lichnowsky, Glenck, the Invalids' Fund, Bernhardi), leaving 20,260. He reports suing the Jew Oppenheimer over the unpaid 250,000 mortgage, arrears of marriage and hereditary-lease monies, expenses met from his own pocket, the Prępiziner estates, and a possible 200,000 Rthl loan from Holland.
oe1bu9454-033: Writing while ill and impoverished, Triebenfeld urges the Prince to recall the bank Anweisung from Eysenhardt lest he be ruined, and sets out a scheme to raise gold, cede his 250 Rthl mortgage and settle the Oppenheimer, Eysenhardt, Invalids' Fund and Madame Schlabrendorff claims for half their sum. He warns against general powers of attorney and Blanquette, citing Hecker's report that Honrichs halved the price of the Hufen from 600 to 300 Rthl, and reports obtaining French authorisation for military collection of arrears in South Prussia, complaining of Minister von Stein's disfavour.
oe1bu9454-034: 'Rejects Honrich''s complaint as nonsense: despite 21 letters by mounted and foot messenger, Honrichs has sent neither money nor accounts, while costs had to be met through Professor Rhoda; since Schmid''s death Triebenfeld has installed cheaper men, Hester at 600 Rthl and allowances, with French authority ready to help collect arrears. Urges the Prince to secure money there, laments his illness and the Invalids'' Fund debt, and promises to come and cede the 250 Rthl mortgage and repay von Zastrow.'
oe1bu9454-035: Bitter protest at dispositions issued through Court Councillor Meyer to Privy Councillor Amelang, which assign 1600 Rthl to Triebenfeld and 3400 to Eysenhardt out of the very 6000 Rthl bank instruction he had declared void. Reports his arrest in Berlin over 5000 Rthl of arrears of interest plus 125 costs, guarded by two gendarmes at his own cost, and the loan raised through Minister von Zastrow from the banker von der Laar, repayable 14 May. Begs 3125 Rthl and the return of the instruction, so he may travel on to Vienna.
oe1bu9454-036: 'Defends himself at length against the suspicion, raised in Triebenfeld''s letter of the 20th, of unfriendly conduct, and narrates the history of the Berlin creditor Eysenhardt (Eysach), settled in January 1807 through the Privy Councillor Major: the 6000 Rthlr instruction from Stettinius was ceded to him against 2500 Rthlr, the remaining 3500 Rthlr being lost when payment was suspended; Assessor Koppe has been instructed to pay Eysenhardt and retrieve the Alligl. Encloses 3000 Rthlr Courant, remarks on relations with Minister v. Stein, presses for a personal visit en route to Vienna via Dresden, and asks advice on the Wildegans matter.'
oe1bu9454-037: Refuses to hand the enclosures to Herr p. Koppen, newly returned from Paris, since they would let Justus Eysenhardt draw on an assignation Triebenfeld must return intact to the Bank, the accompanying bill of exchange having long expired; urges the Prince to order Privy Councillor Amelang to retrocede it at once, else he will annul it publicly. Asks that only 2000 Rthl be assigned for the Invalids' interest, warns that Laar must have 5000 Rthl Courant to spare Herr von Zastrow, advises raising money in Holland rather than on Polish estates, and reports his health mending slowly amid vexation and virtual arrest in Berlin.
oe1bu9454-038: 'Writing from his sickbed, Triebenfeld reports receiving 3000 Rthl from the Baugnier Veit and passing the instruction to Amelang, but must raise 3000 more: the treasury took 5125 Rthl, new debts stood at 5176 Rthl, and the Märkische Landschaft obligations Stecher had pledged had fallen so far that nothing could be raised on them. Timber and boards from Contop, given at half price, discharged the balance at a loss of 3480 Rthl, for which he expects compensation; Minister v. Zastrow''s papers are returned. He urges the Prince to raise 150000 Rthl to clear Curland and all debts, and plans to travel to Vienna, perhaps Öhringen.'
oe1bu9454-039: 'Reports returning from IV., where everything was settled as desired, only to be met with execution over the 3000 Rthl now fallen due; having in February escaped French arrest by surrendering that sum toward the Zewalden fund, he borrowed further to cover inn, costs and travel. Of 6125 Rthl owing, 3000 are ordered paid, leaving 3125; nothing yet comes in from Zagorowo. Begs an order for 3125 or at least 2000 Rthl, and sureties, so he may reach König: Morgen unhindered; letters to be addressed to Justice Commissary Empuch.'
oe1bu9454-040: Fears further interception of letters; revises his itinerary via Wirr, Königsberg, Holland, Paris and Öhringen. Urges a loan of 250000 Rthl on the Zagorowo mortgage, with which 750000 Rthl of paper could be bought and all debts cleared, advances of 46000 Rthl to Oppenheimer, the Invalids' Fund and Meyer Bernhard deducted; 300000 Rthl of obligations bought for 90000 would settle the King's Lursch debt. Warns of enemies at Court, reports new valuations impossible, his own want of money and 4000 Rthl borrowed for von der Lahr, and French promises of military help to collect Zagorowo arrears.
oe1bu9454-041: Regrets missing the Count's passage to Erfurth and lacking money for the journey, doubting that the meeting of the two Emperors will settle anything; plans to borrow a few thousand and attach himself to the Emperors and the Grand Duke, through whom he will press the Prince's cause. Reports Herr v. Stein's fall and Kalckreuth's manoeuvring, urges the Prince to go to Silesia or Königsberg to seek the King, and notes the French Government's partial lifting of the South Prussian sequestration, with monies to come via Warsaw and Kalisz; demands Metzig collect 8,000–9,000 Rthl of laudemial and purchase monies.
oe1bu9454-042: An account of Triebenfeld's arrest in Berlin by French gendarmerie over 3521 Rthl of interest arrears owed to the Invalids' Fund, his release on security from Kammergericht Councillor von Trevinitz and the innkeeper Mathieu, and his desperate dealings in state paper with von der Lahr, Coste, Zastrow and Hecker. He begs urgently for 2068 Rthl to clear the Lahr suit, reports sequestration of Kontop, protests at Zagorowo, a fiscal suit against the Jew Oppenheimer over claims of 72,000 rather than 105,000 Rthl, illness costing 300 Rthl, and news from Königsberg and Princess Sacken.
oe1bu9454-043: Reports Amelang's news that Lahr has won judgment for 3000 Rthl in hard coin rather than papers, exposing Triebenfeld to arrest under bill-of-exchange law; begs the Prince to provide cash or state papers for the deposit, since appeal to the Senate of Appeals should save some 1500 Rthl. Notes the Oppenheimer suit going well, the French General Government's repayment and lifting of the sequestration once interest on circa 10000 Rthl is paid, Honrichs summoned, and pleads for 600 hundredweight of iron promised to Michaelis.
oe1bu9454-044: Detained in Berlin by the Lahr lawsuit, Triebenfeld reports the judgment awarding Lahr 3000 Rthl, met by deposited obligations pledged at 800, 360 and 340 Rthl, and needing 1500 Rthl in costs to redeem them. He has repaid Coste the 9000 Rthl covering the Zastrow, own and Grevenitz bills, plus 450 Rthl interest and 118 Rthl to Oldekopp, leaving 2068 Rthl outstanding, recoverable from the Zagorow estates. Michaelis offers settlement against 600 Centner of iron at 4 Rthl delivered free to Oppeln; he further requests 932 Rthl cash for Oppenheimer costs and French gendarmerie expenses.
oe1bu9454-045: Reports fleeing Berlin to avoid personal arrest after a decree required immediate payment of 3000 Rthl to Lahr; the merchant Michaelis advanced 2400 Rthl to settle Mathieu and small debts. Amelang has appealed, will petition the Grand Chancellor over the damaging Cabinet Order, and advises holding 3000 Rthl in State papers. Confirms a contract with Michaelis for 600 hundredweight of bar and hoop iron at 4 Rthl, deliverable at the Ober Baum by 1 May; requests 100 f dor and 100 ducats. Hawich and Hecker have arrived from Zagorowo with good news.
oe1bu9454-046: 'Reports that the Prince of Hohenlohe''s letter and bill of exchange, with the money, should by now have arrived. Warns that the pending appeal case will fail: a royal Declaration in that day''s Berlin newspapers rules that all bonds in money, even where paid in state paper, are to be reckoned in Courant, retroactive to 1806, so no legal argument remains. Notes harsher treatment of interest at rates of 10 to 50 per cent, and offers sympathy. Text partly corrupt and uncertain.'
oe1bu9454-047: 'Answers four queries after meetings with justice-burgomaster Hawich and Inspector Zagorowo''s Inspector Hecker: the King of Saxony''s three-year General Moratorium shields the estates provided interest is paid, and the Invalids'' Fund''s 50000 Rthl holds the first mortgage, unchallenged by French or Saxon authorities, though the banker Oppenheimer''s broken undertaking has brought suits in Berlin and Kalisz; rejects the Meyer''s building claim and his offer to raise money from sequestrated estates; reports suits against Giese and consorts for 25000 M. and against v. Viedrenricht; urges refusal of the Augustinower colonists'' plea for remission; and pleads that his own Kontop estates'' sequestration and Berlin arrest delay his journey to Schlawenschitz.'
oe1bu9454-048: 'Reports engaging justice-burgomaster Hawich of Zagorowo, newly appointed Ducal-Warsaw notary, with Chief Inspector Hertes, and executing thirteen special powers of attorney recorded by justice-burgomaster Schench of Neusatz: dismissal of the Dqbska over the Traperin estates; full lifting of the sequestration under the King of Saxony''s three-year indult; collection and payment of interest; suit against Oppenheimer et Wolff in Kalisz over 72000 Rthl; removal and accounting of the sequestrator Honrichs and annulment of his land sales; arrears from v Niedzewiecki, the Olesnitz lessees (23000 Rthl) and the Radrimin heirs (over 10000 Rthl); boundary suits; and representation at the Warsaw Diet.'
oe1bu9454-049: Dismay that the Prince's messenger brought no letter and no answer to his last. Triebenfeld remains under arrest, bound by his word of honour until 600 Centner of iron have been despatched and he obtains release from justice-burgomaster Scheu of Neufall; he begs the iron be sent, if possible the full thousand Centner, which would satisfy Michaelis Lahr and the Berlin costs, and delivered directly to Bogadel to his administrator Neumann. Rumour of a Russian corps on the Polish and Silesian frontier.
oe1bu9454-050: Petition to the King, written in the Fürst's own name, recounting how 3125 Rthl of interest owed to the Invalids' Fund on the 50000 Rthl capital secured on the Zagorower estates was extorted from von Triebenfeld by the French administration under arrest and military execution, forcing him and Lieutenant-General von Zastrow to raise 5140 Rthl in paper from the merchant van der Lahr. With 3000 Rthl still outstanding and judgment obtained, Amelang at Berlin is to pay 1000 Rthl and deliver bar- and hoop-iron; asks that von Triebenfeld be released ex nexu.
oe1bu9454-051: Reports the iron has still not arrived but the execution has been lifted, so he departs for Königsberg; the inheritance question and Bethney's affair are deferred until his return in three weeks, Bethney lying gravely ill at Malsdorff. Honrichs, summoned over the new attachment at Wohlen, is expected hourly and promises several thousand more, for which Triebenfeld pledges honour and life; warns against Polish confiscation and distrusts Hawich. Adds war rumours from Zillichau bankers of Prince Hohenzollern near Leipzig, fighting in Bavaria and Munich occupied, and French magazines removed from Klogen.
oe1bu9454-052: Reports delivering the Prince's letter and enclosures to Her Majesty the Queen, who received them with pleasure and passed the matter to the Grand Chancellor, thence to Cabinet and Kammergericht Councillor Allbrecht, with whom Triebenfeld is now working; Herr J M v. Beym's insistence on correct form threatens delay. Political news is unreportable, rumours of French and Austrian victories alternating daily, and the King has forbidden discussion of the Franco-Austrian war. Lieutenant General v. Köchn sends his respects; the length of the stay remains uncertain.
oe1bu9454-053: Reports that the inheritance case awaits resolution, the papers lying with the Chamber Court's and Cabinet Councillor Albrecht's opinion before a high official whom the Queen presses for it, and that the distraint business is proceeding. Urges the Prince to write plainly to the King and answer the Commission openly, praising Major von Pirch as his ablest advocate and noting General von Köckritz, Haacke and Massenbach's parallel appeal, delayed by Scharnhorst's fever. Doubts the Consul's reports of Austrian losses and Russian war declaration; recounts Schill's stroke against French and Westphalian regiments.
oe1bu9454-054: Reports that the 100 Fr. sent him were largely absorbed by the Chief Post Office against arrears and 480 Rthl of Concur. monies, delaying receipt of the Prince's letter of 3 February. Desperately begs that 600 Centner of iron (bar, hoop and rail) reach Boyadel by 23 April, since a court-registered contract and bill of exchange with Michaelis for 2400 Rthl, with a 500 Rthl penalty, require delivery in Berlin by 1 May. Also urges pressure on Amelang over von der Lahr's iron at 6 Rthl, promises 4000 Rthl assigned in Zagorowo, and notes Hahn's warning of Weigel's threats and the general moratorium's protection until Midsummer 1810.
oe1bu9454-055: Reports von der Lahr's fresh attack on him, falling paper values, and hopes that 1000 Centner of iron reach Kontop in time. Argues from Landrecht I, XII, §165 that the Prince's legacy from the Colonna estate is secure, witnesses attesting the signature; Counts Götzen and Pohne urge delay lest Wrätislaw be angered, and a proposal is drafted whereby the Queen takes estates worth some 3 millions. Identifies Countess Henckel at Schimanowicz as author of the anonymous letter; adds war news, Rüchel's rumoured Silesian command, Massow's discharge, and Bethusy's illness and 500000 Rthl of debts.
oe1bu9454-056: 'Triebenfeld waits at Kontop for the iron and cannot leave for Königsberg, having no travelling money and being unable to satisfy Michaelis, newly arrived from Berlin; he begs that the 1000 Centner be delivered to Beyndel quickly. He relays war news: live cartridges issued in Berlin, the "Carl and Hoff" watchword angering the French envoy, Russian troops massing near Brzesc under Grand Duke Konstantin, silver deliveries, and the King''s letter to General von Zastrow. A postscript details carriage and toll charges of some 240 and 200 Rthl, Lahr''s 2200 Rthl claim, and the 217 still lacking of the 1000 of iron for von der Lahn.'
oe1bu9454-057: 'Reports on his return from Königsberg: robbed on the road of a trunk worth over 800 Rthl, penniless, with execution in the house and 1200 Rthl pressing on him; the journey cost 713 Rthl, 600 borrowed against 700 due at Johanni. Michaelis satisfied, but iron for Lahr lies unsent at Kontop. The King has ordered the Fürst spared by the Higher Provincial Court and may make him General Governor of Silesia; Hoyok is to seek the testament in Warschau, failing which Count Danckelmann takes it up. Notes Scharnhorst''s illness and the Massenbach declaration, von Pirch''s advice, the Archduke Ferdinand''s overtures, and the "Black Brothers" conspiracy; he leaves for Kalisz to retrieve his arrested youngest son.'
oe1bu9454-058: 'Acknowledges the Prince''s letter and 50 Francs delivered by Referendarius Bally, which bought him four weeks'' respite from Execution; reports departure for Kontop and Kosten, sending Honrichs with some 80 armed men and two months'' pay, and summoning Cabani and Hecker. Describes intelligence gathered in Poland for the King: export bans, Polish spies, opened mail, plans to restore Poland under Constantin, the prefects Garczynski and Zychlinski, and towns up to Wieluń refusing men and arms.'
oe1bu9454-059: 'Triebenfeld pleads his own ruin: Kontopp remains sequestrated for want of some 2000 Rthl, the Schweinersche estates are under execution for 2560 Rthl interest and the von der Lahr debt, partly settled with iron and boards worth 2570 Rthl at a loss of 1800 Rthl in cash. Grain, 105 stone of wool and 2000 Klafter of wood are unsaleable because Königsberg admits Polish produce. He urges the Prince to write directly to the King, rating Pirch and Hache trustworthy but Greischau, Knesebeck and Scharnhoritz not, and reports Polish rearmament, rumoured partition schemes, and Honrichs''s blocked money transfer via Kalisz.'
oe1bu9454-060: 'Reports his ruin: everything at Schweiner and Kontop sealed and placed under attachment towards sequestration, obtained by the usurer von der Lahr over iron and boards delayed six weeks by low water; estates worth 200000 Rthl face subhastation at a third of value. Grävenitz has sent von der Lahr''s receipt to J. W. v. Loen at Strelan, but 1860 Rthl of old and new interest must be paid first; Loen has sold goods worth 1000 Rthl for 460 Rthl. Attempts to raise money on Zagorow under French decrees failed, Honrichs being arrested and threatened with shooting. Begs 1800 Rthl be sent to Professor Schade, laments his daughters working for money, and pleads inability to obey Lombardini''s summons to attend the Prince.'
oe1bu9454-061: 'A desperate personal appeal to the Court Councillor: 1800 Rthl of interest must be found, or the writer cannot show himself in Breslau, disgraced as he is by the v. d. Lahr affair and the distraint that drove his daughter to write in despair. With the sum, Schweineren could be freed, his estates partly dismembered, interest assigned to his children, and his cause pressed before the King; without it, Königsberg and abandonment of all. Estates here lie under sequestration; departure planned for 12 September, Schlawenschutz by the 16th.'
oe1bu9454-062: A sixth appeal after five unanswered letters, sent via the Royal Prussian Chief Post Director Mann in Vienna (Massakrop 1156), to whom replies should be addressed. Reports progress on the Kosch business, referred back to Berlin pending the return, and expects the Curische debt discharged, the settlement annulled, Cosmar obliged to withdraw, the entailed estate recovered and the Polish estates restored. Complains bitterly of destitution and begs for gold, or an express messenger with money.
oe1bu9454-063: 'Reports recovering after seven weeks'' illness, half of it delirious, and his own precarious affairs: a tenant found for Kon tap but 8000 Rthl of arrears must first be paid, with hopes of a timber sale to the newly enriched Carte of Stettin. Encloses a decree and Honrichs''s Pro Memoria, urging authorisation to treat with the sub-prefect, recover the appropriated Polish estates and divert monies from the improperly appointed administrator. Recounts Hecker''s denunciation of Honrichs for insulting Bonaparte, his arrest, release, and the denunciants'' retraction.'
oe1bu9454-064: 'Reports the Queen''s death at Strelitz on the 19th and the King''s grave illness, urges recovery of the 100000 Rthl and asks whether Köckritz has returned the papers, and complains of harassment over interest on the Invalids'' capital and of Roßem''s threatened sequestration of Triebenfeld''s estates. Appended: a copy valuing the Knobelsdorff (Bischdorff, Mollna) estates against Zagoraa, with the Weigel and Stössel claims of 190000 and 180000 Rthl; and an October postscript on Hardenberg''s promised help over the 112000 Rthl, with repeated pleas for 300 Rthl in gold.'
oe1bu9454-065: Reports his ruin at the hands of the Glogau Landschaft, v. d. Lahr and the Higher Provincial Court, but announces that a Commission arrives to lift the sequestration of his estates, after which he will travel via Glatz to Schlawenschitz. Begs 40 pieces from Lombardini and asks that the Koschäntner foundry lend 300 Centner of bar and hoop iron until 18 January, carriage-free to Boyadel at 4 Rthl 12 g. the Centner, for a projected iron-for-spirits trade; itemises Berlin debts to Lahr and Holz Apfel and arrears totalling 25100 Rthl. Notes rumours of the Prince's appointment as General Governor of Silesia.
oe1bu9454-066: Reports the expected verdict against the false denouncers (six years' fortress imprisonment) and the agitators; pleads for Heiler while noting Honrichs's claim against him, and urges refusing the colonists' and old peasants' requests for remission of interest, since arrears can be reckoned in on a sale. Recommends gifts of roebucks to the Polish Upper Prefect and tribunal president, retails rumours of the King, Napoleon and Russian moves in Galicia, presses for receipts to free 70-74 Centner of iron arrested at Neusalz by the skippers Kulawy and Neumann (243 Rthl 14 s. freight outstanding), complains of soaring process costs (Trąbcziner, Niedrewiciliische, Octaviowshische) and of his own want of money, and proposes delivering 2000 Centner of bar iron for 8000 Rthl.
oe1bu9454-067: 'Reports he cannot yet leave Kontop: Coste has not arrived, Schweinere is not leased, and the Berlin affair remains an open wound. Hawich denounces Henrichs/Honrichs as a swindler, so both are summoned and an Actuarius is to be sent to Zagorowo to question subjects and lease-holders about monies taken; the sequestration is lifted and only an overseer appointed. Alleges Hawich, Honrichs and Heckert have appropriated and built on Hufen. Notes Köckritz, Kleist, Count Götz, the moratorium extended to Johanni 1810 or 1812, and asks for the freight, toll and weighing notes for the iron.'
oe1bu9454-068: Honrichs has arrived and disproved the claims of Hawich and consorts, showing the 22000 Rthl of money and grain requisitions must be repaid by the colonists under their contracts. Triebenfeld urgently demands the original deed of donation for Trapponin for the hearing before the justice of the peace Kwilecki on the 28th, to be sent by express courier to König, together with at least 1000 Rthl Courant; he is penniless, has borrowed 59 Rthl 18 g and owes 185 Rthl, and proposes suing Lipski, who gave the estates to the Dąbska.
oe1bu9454-069: Reports, via Lombardini, that the money could not be collected at once in Breslau and that dreadful roads and weather delayed the journey; nonetheless the writer reached Kontop by midday on the 25th, still finding Honrichs and Cabanis there, who left the same day in high spirits after Honrichs received 6000 f. and the original deeds of donation. Notes von Triebenfeld's badly afflicted right arm and his promise to come to Schlawentz for some weeks once his business is concluded. Signed Bally.
oe1bu9454-070: Reports that Hecker, whom he had meant to dismiss, must stay owing to a misunderstanding with Ober-Präfect Garczynski, who wished to hand everything to Heiller; Hecker has pledged payment by St John's, but will be summoned to Costen with Honrichs, bound before the court, and watched by Cabanis as controller. In the Trąbczin suit Kramplitz failed to appear, a new term set for 2 April; Raczkowski, Künzel and Honrichs are acting. Hopes to free Zagorowo and recover Traperin, defends staying away from Schlawenschitz, plans six days in Berlin, notes 600 Rthl spent on Hungarian wine for Garczynski's cellar, and complains of the Landschaft's 4000 ℔ sequestration costs.
oe1bu9454-071: Reports that the Rochliz affair has been set in motion, with the Prince expected to owe nothing; denounces it as a knavish swindle pushed through in secret, insists he dismissed Rochlitz as General Plenipotentiary in 1804 and demanded accounts Rochlitz refused to render, citing Glenck as witness and doubting Building Councillor Otocki gave assurances. Requests three signed and sealed blank printed powers of attorney so Melzig may prosecute and recover arrears of some 18,000 Rthl; awaits Honrich and promises to come to Schlawenschitz.
oe1bu9454-072: Written to Triebenfeld by his employer, who has waited in vain for the promised visit with Herr v. Brzechsta, assumes the leasing project with him has collapsed, and reports that he abandoned the exchange scheme with General v. Schimmelpfennig accordingly. Pressed by creditors and by arrangements made with his son and sons-in-law, he has admitted a new exchange project and allowed inspection of the Zagorow estates, encloses the original deed of donation concerning his claims on the Trappyner estates, asks for news of Brzechsta's intercession in his Warsaw suit, and urgently requests 300 Rthl for Lieutenant Sommer.
oe1bu9454-072a: Reports the lease of the Zagorow estates concluded sub spe rati with sub-prefect v. Brzechsta, whose summons to Warsaw with Prefect Count Garczynski postponed their journey to Schlawenschitz; Brzechsta will bring 2–3000 Rthl for the Prince to ratify or dispose otherwise. The Wrobezin peasants' suit is won in the Tribunal Solenne, permitting eviction and execution for arrears; the Olernitz case looks secure, and the Trąbczin claim is to go before the Rada Stanu, with 80000 Rthl of debts against estates worth 300000 Rthl. Taxes and deliveries to Warsaw leave nothing over.
oe1bu9454-072b: 'Encloses letters from Sub-prefect v. Brzechsta and Kreis-Rath Thiele: Brzechsta cannot leave Warsaw before the 15th, but will travel to Schlawenschitz with what money he can collect, though taking over the Konin prefecture may delay him. Reports a new assessment of 897 Rthl on the Zagorow estates, which Brzechsta has pledged to reverse; the extortion of 500 Th by Zaborowski and Szimanowski; threatened appeals by the Wegbezirn peasants; the Olerniger case; Hawich''s settlement at 1200 Rthl and surrender of 9 Hufen; Niedzewiecki''s lost suit and 2000 Rthl; and the suspension of Land-Unterrichter Piekowski, who had blocked interest collection.'
oe1bu9454-072c: District Councillor Thiel forwards to Triebenfeld an enclosed letter from Sub-prefect Herr v. Brzechsta, received via the advocate v. Wieckowski, reporting that Brzechsta's business will keep him in Warsaw until the 15th of the month, and that prospects concerning the Trąbczyner lordship are good. Written from Kalisz, with a note of receipt on 12 March 1812; otherwise consisting largely of formal assurances of service.
oe1bu9454-072d: A brief note from Brzechsta to a correspondent addressed as "Dear Brother," reporting that various affairs will delay his departure from Warsaw until after the 15th of the month, and that reliable intelligence indicates the Trąbczyn matter stands quite well, details of which he will convey in person. The writer breaks off for want of time, the conveyance being about to leave, and sends greetings.
oe1bu9454-072e: A brief note from B. Brzechsta, written in haste as the post was leaving, announcing that various affairs will keep him in Warsaw until the 15th of the month. He reports, on the strength of reliable intelligence received, that the Trąbczyn matter stands well, and promises a fuller explanation in person on his return. Addressed to "Dear Brother"; the closing salutation is partly illegible.
oe1bu9454-072f: Reports exorbitant grain and straw deliveries demanded of the Zagorow estates, the Ober-Prefecture at Kalisch refusing execution against the peasants, and a renewed sequestration averted only when the Siedern sub-prefect Brzechsta applied 2000 Rthl and took receipts as rent; the sequestrator has been recalled and is under observation. Describes constant quartering (62 persons victualled), murdered noblemen, subjects fled to the woods, no revenue, courts at rest, appeals pending over Werbizer and Olleinue, Honrichs's embezzlement, and his own bilious fever and podagra.
oe1bu9454-073: Replying to Triebenfeld's letter of 1 January after consulting Herr v Weithausen from Cosel and Bolli, the Prince accepts in principle Herr v Brzechsta's leasehold offer for the Zagorow estates, insisting on half-yearly rent paid prenumerando, cash security in hard coin, repair of the three demesne farms, the lessee bearing all burdens, and clauses barring actions for remission or recourse; hopes for a higher bid. Reports no progress with General v Schimmelpfennig, awaits the old Baron v Stössel, urges haste, asks 300 Rthl for L. Sommer, and requests game and the promised dog.
oe1bu9454-074a: Copy of a fiscal petition by Seelmann to the Kammergericht seeking urgent arrest, danger being in delay, of the 80000 Rthl bequeathed to the Prince of Hohenlohe-Ingelfingen from the estate of the deceased Princess von Sacken, to cover the General Invalids' Fund's loan of 50000 Rthl Courant made to Triebenfeld in February 1805 and 9375 Rthl of interest unpaid since November 1807. Cites the pledged 250000 Rthl Zagorow obligation of 1 June 1804, now reckoned to the Bayonne sums, the encumbered Kontop and Schwammern estates, Advocate Mitschke's suit at Kalisz, and asks that Justice Minister von Kircheisen as executor be ordered accordingly.
oe1bu9454-074b: 'A postscript reporting that a Chief Forester must be appointed at Zagorowo: old Richter''s son had been designated, and the Nogeln''s nephew as propination official at the distillery, but since the Nageln has recalled her nephew, Richter must take that post instead. Proposes the impoverished Radzowski (Radzewski) for the forestry place at 300 Rthl yearly and urges that he be sent quickly, together with the Prince''s opinion on the baptism of the estates.'
oe1bu9454-074c: 'Legal instrument: an injunction of the Royal Prussian Chamber Court in Berlin directing Minister of State and Justice von Kircheisen, executor of the will of the late Frau Fürstin von Sacken, to pay nothing, on his own liability, to von Triebenfeld at Kontop near Grüneberg out of the 50000 Rthl legacy said to fall to Fürst von Hohenlohe Ingelfingen and assigned to Triebenfeld — this at the suit of the General Invalids'' Fund; copies to Upper Medical Councillor Cosmar and to Triebenfeld, forwarded by the Silesian Superior Provincial Court at Glogau (Fülleborn), No 1103.'
oe1bu9454-074d: Summons from the Royal Prussian Cammergericht (signed Woldermann), enclosing the General Invalids' Fund's representation of 30 July, which has obtained an arrest on the 80000 Rthl legacy left to the Prince of Hohenlohe-Ingelfingen by the late Princess von Sacken. Von Triebenfeld, at Kontop near Grünberg in Silesia, is ordered to appear in person or by a justice-commissioner on 23 August before Kammergerichtsrath Koitsch, to object, state his damage, propose the amount of security and negotiate lifting the arrest against surety, on pain of the arrest standing and judgment following the plaintiff's motion.
oe1bu9454-075: Returns the enclosed letter of Count v. S., welcoming his straightforward conduct while regretting a dishonouring episode and the lost chance of securing the Fürst some 40 to 50,000 Rthl. Reinhardt writes from Bonn that no assistance from the Fiscus has followed; Minister v. Goldbeck reports from Berlin that Count v. Hoym retains the South Prussian Department, though Haugwitz's confidant Priebich assured Councillor Krüger otherwise. Chełmski has not appealed; the estates may be leased from Johanni; Metzer's absence delays the power of attorney.
oe1bu9454-076: Reports that the projected exchange of estates is under way and may soon be concluded. Triebenfeld announces that he will travel to Berlin at the beginning of September and has leave to stay until the end of that month, where he hopes to find the Prince in good health, present himself in person, and give a full verbal report on several items of business. Otherwise wholly formulaic in its expressions of devotion.
oe1bu9454-077: 'Reports progress on the affair in Berlin: a royal letter has come through Privy Councillor Beyhm and the matter goes to Minister v. Voss for speedy report. Urges thorough valuations conforming to the submitted Designation and the contracts, which Triebenfeld holds; notes an agent engaged at Potsdam, a power of attorney to be requested via Herr v. Michaelis, and a loan being arranged. Requests signed blank letter-sheets, and reports appointments: Burensprung as Land Forest Master, Lindenau''s Excellency title.'
oe1bu9454-078: Michaelis reports on his approach to Privy Councillor Schultz, who had only read the Prince's letter to Minister v. Voss and would commit himself neither way; Schultz advised that a power of attorney lodged in the Registratur would secure Michaelis access to the papers. He drafts wording empowering him to press the proposed exchange of estates before the South Prussian Department, notes from v. Triebenfeld that the Cabinet dispositions go off only now, and requests the promised intelligence on the Grotowski matter.
oe1bu9454-079: 'Reports on lobbying in Berlin over the projected exchange of estates: awaits Minister von Voss''s report, finds Count Schulemburg (now controlling the Disposition Fund since Worner''s death) and Struensee well disposed, and Count Hoym, summoned to Potsdam, promising help to end his embarrassment at having proposed the Prince''s estates without Cabinet order. Itemises the bribes to be shared — 2500 Rthl to the Schulze daughter, 3000 to Klewis, 300 ducats to Court Fiscal Michaelis, plus 200 fr for Potsdam informants — and describes court divisions over war, the King, Köckritz and Struensee opposing it, Schulemburg pressing for it and asking Haugwitz about Russian movements in South Prussia. Renews his request for blank forms.'
oe1bu9454-080: Follows up a letter sent the previous day by Herr Captain and Hahn, reporting that Minister Hoym has returned from Potsdam well satisfied, where matters touching the Prince were discussed, and that the monarch genuinely esteems him, so that all should go as wished. Discounts the current Berlin talk of marches or war, the King holding firmly to his principles. Nothing yet received back from His Excellency Herr von Voss.
oe1bu9454-081: Michaelis reports from Berlin that, despite pressure from Herr von Triebenfeld and Eysenhardt for definite news, nothing has yet come in at the South Prussian Registry and Expedition office concerning the proposed exchange of estates; the business evidently still rests in correspondence between Minister v. Roth and Privy Councillor Schulze, with nothing decreed. He declines to call on Schulze again so soon and will wait for the Prince's power of attorney, expected Tuesday, to legitimate himself and press for a reliable answer.
oe1bu9454-082: Eysenhardt reports from Berlin that Minister v. Voss is at Havelberg, whither the King's Cabinet order in the Prince's affair has been forwarded, so that it has not yet reached the Department; enquiries in the chancery have produced nothing, though Voss, returning fourteen days before his leave expires, may bring it himself by Thursday. If the order is as decided as Triebenfeld suggests, success is assured. He also notes paying Triebenfeld 300 Prussian Courant against written acknowledgement.
oe1bu9454-083: 'Reports from Berlin on the exchange negotiations: Krotoszyn is now certain to be granted for the Suprenstis possessions, while Polajewo still meets objections, though Privy Finance Councillor Schulze gives hope; some 100000 Rthl might be gained there despite obstruction from the Chambers. Urges that Prince George be detained until Triebenfeld reaches Breslau, since only he knows the province and language. Notes Minister Hoym''s journey to Pomerania, Voss''s return, letters to Schulze, H. C. W. Beym and the Colonel, the King''s low spirits, Reppnin''s ukase, Mencke''s recovery, and rumours of a French move on Hannover.'
oe1bu9454-084: Reports that the King has charged Herr von Voss with settling the Krotoszyn affair, Voss having requested four weeks for his final report while the Chambers examine how the revenues balance; Triebenfeld's own plans are drafted and he sets out for Betschen, will consider Bronzewski, and urges that, rather than Polajewo, estates from the neighbouring Starosty of Adelnau be granted to make up the higher revenue value, reckoned at 4 per cent. Notes Prince George's business at Breslau, a letter from Colonel von Köckritz, Voss's dependence on Councillor of War Nöldichen, and confused news from Russia involving Reppnin, the Kurakins, Zubow, Panin and the Emperor's mistress.
oe1bu9454-085: Copy of a royal rescript from Friedrich Wilhelm refusing the Prince's proposal, forwarded through Etats-Minister von Voß, to exchange his South-Prussian estates for the Domain Offices Krotoszyn and Polajewo. Krotoszyn alone yields 49,043 Reichsthaler and could yield more on fresh valuation, von Triebenfeld having received 26,000 for ceding the 1795 lease; the exchange would cost the State some 17,400 yearly. Voß had been instructed on 19 July to reject such offers outright.
oe1bu9454-086: 'Draft petition to the King rebutting Minister of State von Voss''s report on the proposed exchange of the writer''s South Prussian estates for the lordship of Krotoszyn: the offer of 30000 Rthl in cash and of Polajewo had already been withdrawn; von Voss''s figure of 49043 Rthl yield rests on Councillor of War Nöldichen''s one-sided statement, whereas Krotoszyn pays 30100 Rthl rent against the writer''s estates'' 41500 Rthl. Asks for an impartial Commissarius, mentioning Count von Hoym, and explains the aim of raising capital to pay debts.'
oe1bu9454-087: Appeal to Obrist von Köckritz over the collapsed exchange of the Prince's conferred estates for Krotoszyn, on which Minister v. Voss, relying on Kriegsrath Nöldichen's one-sided report and no local inspection, told the King the State would lose 17400 Rthl yearly. Insisting Krotoszyn yields only 30100 Rthl against his own estates' 41500, and citing v. Karnhowsky's refusal to lend on confiscated and clerical property, Count von Höym's approval, the Seehandlung guarantee and boundary suits with Count Kalckreuth, he renounces Krotoszyn but demands impartial investigation to clear his honour.
oe1bu9454-088: Copy of a remonstrance to Minister v. Voss, who has declined to support the proposed exchange of the writer's South Prussian estates for the Amt Krotoszyn, a proposal laid before the King and expressly excluding Polajewo. Voss's objections are ascribed to the Commissioners' reports, which are said to overvalue Krotoszyn against the writer's own renseignements and Voss's earlier declarations; invoking royal assurances of favour and his wounded honour, he announces further démarches to convince the King that no self-interest was involved.
oe1bu9454-089: Reports confidently on the exchange negotiation, enclosing Glenck's letter with copies of the writings to the King and to Noch, and citing Minister v. Struensee's declaration that Krotoszyn and Polajewo can yield no more than the lease figures (23–30,000 Rthl, not the 49,000 claimed by v. Voss's man Nöldichen). Sets out Glenck's nine-year general lease at 44,500 Rthl, the 10,000 Rthl security, 64,000 Rthl advanced, and the claims of Broniewski and Trąpczynski; rebuts suspicion of self-interest, and reports the Princess will give only 30,000 Rthl, leaving 7,000 Rthl unfound.
oe1bu9454-090: Reports from Berlin that the affair has reached its decisive stage and voices fears of betrayal, alluding to the Prince's letter to Glenck and to a "certain person" who might thwart matters. Laments the state of the country — the Monarch good, the ministry not — and the wickedness of the judges there and in Breslau. Offers, since Princess Sacken will not advance the 7000 Rthl, to raise the sum in his own name and pawn all his possessions.
oe1bu9454-091: Beyme, writing from Berlin, thanks the Prince for the explanations given concerning the proposed exchange of estates, and expresses satisfaction that His Majesty has ordered the further investigation that had been suggested. He pledges to pursue the business as conscientiously as before and to leave no expedient untried that might reconcile the Prince's wishes, the King's willingness to accommodate them, and the interest of the State, closing with assurances of reverence.
oe1bu9454-092: Reports that Baurath Glenck has handed over the receipts of the Gleissenbergen and of Schneider, which the writer, Michaelis, considers sufficient to allow him to answer the General Auditoriat on the dispositions already communicated to the Prince. Expects that Kriegsrath v. Triebenfeld will report the same day on the current state of the Krotoszyn exchange affair. Written from Berlin; the day of Glenck's delivery is uncertain in the original.
oe1bu9454-093: Encloses the All-Highest rescript issued on the last petition, reporting that Minister v. Struensee has laid all the files before His Majesty and that Colonel von K. promises a favourable outcome; Cabinet Councillor Beyme is busy but honest, and Councillor of War v. Cöln has stated the case well. Through Colonel v. Köckritz he submitted a Pro Memoria offering, should Polajewo obstruct matters, to lease the estates for 30 years at 20000 Rthl yearly, building six peasant holdings annually and clearing waste ground at his own cost. Also pressing the 7000 Rthl for the Nidernhall affair; complains of the departing Minister, who received a costly snuff-box.
oe1bu9454-094: Reports that a royal letter dispatched by the same post explains the King's wish to have the true value of the Prince's South Prussian estates, and of Krotoszyn and Polajewo, more closely investigated so that the properties can be balanced against one another; assures the Prince that, barring weighty impediments, the King will gladly grant the proposed exchange. The writer, Zartmo[illegible] at Berlin, thanks the Prince for his letter of the 7th and, though the business lies outside his department, offers his warm support.
oe1bu9454-095: Colonel v. Köckritz sends his compliments and word that the Quiet exchange business stands exceedingly well and may be counted as concluded, though he will not write until all is done. The G. C. R. acts contre Coeur at the Sovereign's insistence. Reports of a division of the Department are dismissed as gross lies, a hard oral refusal having been planned before departure; warns against H. v V.'s misrepresentations to the indisposed King, and dismisses the Secular business and peace rumours.
oe1bu9454-096: Reports from Berlin that Colonel v. Köckritz sends his respects and regards the exchange as good as approved and concluded, delayed only by the King's indisposition, which has suspended audience-reports. Urges the Prince to write to the King at once for leave for the Öhringen journey, sending the letter by express courier, and to travel via Berlin rather than Bohemia. Names the King, Köckritz and the Prince of Hessen Darmstadt as his only true friends; denounces Wedel in Breslau over his report on the Krotoszyn affair and an opinion that Prot. could bear 50000 Rthl, papers shown him by Cabinet Councillor Beyme. Secularisation business deferred.
oe1bu9454-097: Reports that the King wishes the Prince to travel via Berlin and stay some days, Colonel v. Zastrow having sounded him out about a route through Dresden; doubts a six-month absence from Silesia would be well received. The King, now recovered, has agreed that both estates be examined so that neither State nor Prince loses, so the exchange may proceed once confirmed by Cabinet Order, despite Minister v. Voss's furious opposition. Advises silence for now on the secularisation business.
oe1bu9454-098: 'Reports from Berlin that he will stay until the Quat: affair is clear, and sends Glenck ahead to take the Prince''s orders. The King, Köckritz and Zastrow are well disposed, and the royal invitation should be accepted with a stay of three or four days. Recounts the Court scandal of Prince Solms''s secret marriage to the widowed Princess Louis, her loss of Royal Highness rank and his transfer to Ansbach; warns against Hoym and Wedell''s double-dealing, dismisses the secularisation business as a farce better pursued in Vienna with Prince George, and notes Haugwitz''s rise and Schulemburg''s removal.'
oe1bu9454-099: 'Reports from Berlin and Breslau on the Krotoszyn business: despite only a formal reply from Zastrow, all assurances are that the Prince will obtain the Krotoszyn estates; v. Voss has moderated his tone and Nöldichen is under pressure, while v. Köckritz says conclusion will fall to Knobloch and Prittwitz, whom Wildegans can influence. Notes war expectations, possible ministerial and Cabinet Councillor changes, Cöln''s draft, requests a Commission Councillor''s patent for Carl Theodor Fischbach at Betschen, and insists Broniewski receive nothing.'
oe1bu9454-100: Beyme reports, in a copy, that His Majesty, on being presented with the Prince's letter of the 21st of the month, has ordered that the reply be postponed — as the Prince himself had anticipated — until the report demanded from Minister of State v. Voss arrives. A brief court communication in the most deferential terms, noted as received 1 February 1799, conveying only this deferral and no substantive decision.
oe1bu9454-101: 'Copy of the Prince of Hohenlohe''s renewed petition to the King, rebutting Minister von Voss''s rejection of the exchange of his scattered South Prussian estates for Krotoszyn and Polajewo: the Reservation Fund of 9540 Rthl is gross, not net, leaving only 30100 Rthl after contributions and remissions; the alleged demesne farm is a Hollander Hufe acquired by Triebenfeld; the forests were devastated under von Goerne; and both offices remain noble estates until the Maritime Trading Society''s debt is amortised. He now renounces Polajewo, offering 8000 Rthl yearly transferred to Krotoszyn, and asks that the Posen Chamber and Count von Höym report.'
oe1bu9454-102: Reports Minister v. Voss expected at Krotoszyn in three weeks to examine the business, and urges that Herr p. Prittwitz attend in person; Chelmshi has lost at second instance, and a settlement with Broniewski of a few thousand awaits the Krotoszyn outcome before dismemberment and exchange proceed. Glenck's survey of Kaemen and Kulm yields 6000 Rthl in interest. Advises petitioning the Grand Chancellor for a five-month extension over Brzyze, the Prusimski daughter's claim and Hoym's suppressed confiscation files; notes the Winieces forest dispute, Schlabrendorff, Wildeganst and disorder in South Prussia.
oe1bu9454-103: 'Reports on litigation: the Broniewski Instructionis Termin falls on the 14th, the patron willing to compound for some 20000 Rthl, though Rapachi''s proofs suggest he is owed nothing; settlement deferred unless the Krotoszyn exchange demands it. The Chelmski suit is won in second instance; Brzyze and Winzingerode remain troublesome. Answers Prittwitz''s and the Minister''s charge that too many estates were received, with a computation of yields (Kaemen, Kulm, Trąbczyn, Szetlewek, Brzyze) totalling 42640 Rthl, citing comparable sales.'
oe1bu9454-104: Pledges on his honour and property that the Prince's affair will be concluded within a couple of months, hinting that an insignificant, unnamed man will decide it and that details cannot be committed to paper. Reports the Monarch's goodwill and the King's approval of the exchange provided the estates balance, blames obstruction of the valuation on a source known to the Prince, and resents any appearance of begging. Count Schlabrendorff will accept a twelve-month bill for his interest; dismisses Prittwitz as a liar. Estates sold to Prince George now valued above 700,000 Rthl.
oe1bu9454-105: Reports that Count Schlabrendorff has been satisfied, the interest amounting to 11085 Rthl, with the receipt made out to the Prince, while nothing has come towards covering Triebenfeld's own 10 [thousand]. Notes three failed attempts to be received by the Princess and the sensation caused in Breslau by the writing to Prittwitz; describes the Queen's illness and recovery, the King's activity and troop drills in Berlin, and the absence of any prospect of war. Bad news from Glenck in the Prusimski lawsuit prompts him to use the blank forms entrusted to him to petition the Grand Chancellor for an extension of the term.
oe1bu9454-106: Dismisses the estate-purchase scheme put forward through Court Fiscal Michaelis by the Jew Dann, who claims he can bring in Herr v. Eckart, buyer of the Lichtenau houses, as mere brokerage and swindling, already touted to Prince George. Reports that a contumacial decree of the Posen government threatens the recovery of the Brzyzer estates, that the Chambers and forest officials intrigue for the forests, and that the exchange affair is stalled, the Ministers acting en souverain. Urges the Prince, after his fall from his horse, to take care.
oe1bu9454-107: Forwards an enclosed letter from Colonel von Zastrow, sent on by a huntsman, and reports that the Royal Cabinet letter will be kept until the Prince's expected arrival in Berlin. Princess Sacken refused to receive him, though she has been given the Prince's letter; her visitors include von Rietesel, the advocate Cosmar, a Minister, a certain Hoym and Professor Selle. Reports her declaration never to return, wanting freedom and 2000 Rthl appanage, and rumours that Suvarow has been beaten and captured.
oe1bu9454-108: 'A desperate account of Prince George''s silence and non-payment: President v. Schuckman has delivered Triebenfeld''s letters but no remittances follow. The Jew Kuh has obtained an execution decree over 5800 Rthl, with payment or arrest due Friday; a visit to Dyhrenfurth found the Minister absent until Thursday. Triebenfeld tallies encumbrances of some 206000 plus 64000 Rthl against a sale price of 280000, with 20000 due to Lupman Meyr and 12000 on 7 August, and threatens to flee and confront the Prince.'
oe1bu9454-109: Urges that the man be tracked down and coaxed into disclosing the villainies, arguing this course must not be dropped. Denounces Wildegansch, who claims in Berlin to have been sent by the Prince and who, with An and Schlabrendorff, contrived the money-negotiation project to cheat the Prince of the costs; nothing will be settled for two months. Bukowiecki offers only 2400 Rthl yearly rent for Betsche. Fears the Jew Asch and Gad will sue on the 11000 bill of exchange and send a distrainer to his wife.
oe1bu9454-110: Reports that the business of the deeds for all the ecclesiastical estates is settled to the Prince's satisfaction, the documents to be sent to Breslau by the earliest post. The initial demand was 2½ times the first sum, owing to the valuation given in the Ministerial report, but only 240 Fr and some 200 Rthl were paid, borrowed from Privy Senior Auditing Councillor Mathias and repayable within 14 days; Triebenfeld urges an immediate order for the money, expecting no receipts before Johanni, and promises news of the Prince's other affair by the next post.
oe1bu9454-111: Reports failure to raise the money to redeem a deed, blaming Wildegansch for destroying his credit; he has paid 300 Rück as earnest-money to the friend who arranged the matter and cannot spare more from his travelling money without being stranded. Begs the Prince for an instruction on the 240 f., some 200 Rthl Courant, to secure the redemption. Vouches for Ob. v. K. and v. Z. as true friends, and, given the bad gossip, promises to keep in the background and act coldly.
oe1bu9454-112: Postscript reporting, on information from Court Councillor Wünster, that Wildegansch and the Jew Heymann have achieved nothing in the Prince's affair, and that judgment having been given on the 11000 Rthl bill of exchange subscribed on the Prince's behalf, the writer faces arrest — the attacher Rudolph having called repeatedly at his house. He blames Wildegansch for ruining his credit, describes Prince George's sale of estates for 750000 Rthl, and urges that Count Schlabrendorff be pressed to recover the bill from the Jews and grant prolongation.
oe1bu9454-113: 'A desperate personal appeal: despite the Prince''s assurance that the affair of the 11000 Rthl with Asch and Gad is settled, the arrest against Triebenfeld still stands in Berlin, and he is threatened with immediate imprisonment if the promised 4000 Rthl are not paid. Prince George gives no answer and delays his case; Wildegensch reports the creditors would wait until Johanni, which he considers no rescue. He begs that the 4000 Rthl clear the matter, fearing for honour, liberty and life.'
oe1bu9454-114: A short, badly preserved and partly illegible note, apparently to Triebenfeld rather than from him. The writer abuses an unnamed opponent who has caused the Fürst much difficulty and, now that nothing further can be extracted, wishes to settle; he hopes for a quick conclusion, mentions a greeting from v. Schlabrendorff, reports his own affair with "L. Asch" as neither good nor bad, promises documents and declarations within days, and notes his health improving.
oe1bu9454-115: 'Excuses himself from attending at midday because his tenant at Schwammen has called him out to deal with peasants refusing their labour services. Reports a conversation with the Herr Minister about Schlabrendorff: the Minister resents the Prince''s silence, has summoned Schlabrendorff for the 15th over the Quist affair, and urges him to withdraw his complaint since he is closely watched and could not be protected. Asch carries this message to the Count at Stolze; Triebenfeld goes to Landen but will return by the 15th and also engage Hirsch.'
oe1bu9454-116: 'Excuses himself from attending in person through illness, and complains that he is used as the Poles'' negotiator without any settled plan, the terms being stated differently each time: talk that 150000 Rthl of debts rest on Trąbczin, to be assumed by Walichnowski along with 56000 Rthl and a yearly canon of 5000 Rthl, he thinks garbled gossip damaging to the Prince''s honour. Proposes a firm demand of 60000–80000 Rthl hereditary purchase money and 4–5000 Rthl annual quit-rent, citing his success at Dombrowchen, and asks that the note be shown to no one.'
oe1bu9454-117: 'Reports progress with Herr Weigel on the 30000 Rthl: the bank will not discount until v. Grotowski grants the jura cessa, so Court Councillor Ebersbach has drafted the instrument of cession for Grotowski to execute in court, and the Prince is asked to forward Weigel''s enclosed letter by express. Urges Grotowski also to write to his mandatary at Kalisz that no subhastation is now in question. Notes the deaths of Captain v. Müllern and Morgenbeßer, urges care for the Prince''s health, relays Nelson''s action off Toulon and Sidney Smith at Vliesingen, and Bernhardi''s letter to M. Stösseln.'
oe1bu9454-118a: Reports that a Kunckel has appeared with two colonists from Olesnica offering 1500 Rthl and wanting a contract, but judges them soldiers of fortune unable to meet the 17000 Rthl due at Martinmas and Midsummer, and likely to bring endless lawsuits; awaits instructions and will stall them. Kunckel also acts for Head Bailiff Nerlich, who has 80000 Rthl cash for Trąbczin or Zagorow in hereditary lease. Walichnowski asks what he must offer; Urbanowski has sent for the Trąbczin valuation.
oe1bu9454-118b: Reports that Countess Schlabrendorff, despite Homuth's efforts, will grant no delay on the 50000 Rthl beyond Christmas, properly 1 January 1805, pleading her losses since she receives no interest on the capital; if no interest is due until then the term seems acceptable, saving 2500 Rthl. Homuth requests the agreement so as to draft the papers for the Countess to execute, and will attempt to recover the old bills of exchange. The Conducteur Cabanis has left, intending to hire a peasant's cart for 4 or 5 Rthl rather than the 20 Rthl demanded by Breslau coachmen.
oe1bu9454-118c: Reports that Countess Schlabrendorff will wait for the 50000 Rthl only until Christmas, or strictly 1 January 1805, Homuth having failed to obtain a longer term; she complains of her losses and of receiving no interest. Since no interest is owed until then, some 2500 Rthl is gained and enough money should come in. Homuth asks for the agreement to draft the instrument for the Countess's execution and will try to recover the old bills of exchange. Conducteur Cabanis has left, hiring a peasant's conveyance for 4 or 5 Rthl rather than a coachman at 20 Rthl.
oe1bu9454-119: Reports through Prince Biron that Uminski calls the price for the Kaemen estates too high yet wants a letter accrediting him to the administrator; Triebenfeld suspects mockery, since Broniszewski still occupies the estates. Encloses Glenck's survey table showing some 31,000 Morgen of demesne land available for dismemberment. Proposes sending the surveyor Cabanis, who divided Petsche near Strehlen (23 Hufen for 25,000 z.), to recruit some 500 Hussite husbandmen from Bohemia; dismisses the Rapacki purchasers as wanting overlong payment terms, and notes Schöneich's similar plan for Mstow.
oe1bu9454-120: Reports Cabanis's return with news that Hussites in Hussenich, Rentsch and thereabouts are willing to buy, but too few for the number of Hufen, so an express has gone to their Moravian brethren; they accept 300 Rthl per Hufe and 15 Rthl yearly interest and mean to appear in corpore within a fortnight. Countess Schlabrendorff refuses to release the instrument before receiving the other 50; Hornuth arranges extension to 1 January 1805. Awaits Kunckel, and begs a couple of Thaler for Kunckel's destitute, sick mother.
oe1bu9454-122: Forwards an enclosed note only received that morning, having been left behind through an oversight at his former lodging. Herr Homuth has sent again and presses urgently for early settlement of the item, so that he can confirm to the messenger receipt of the 166 Rthl 16 g. Reports that Cabanis is leaving by post that moment for Hussinietz, from which quarter he expects swift success, and that nothing has come from Berlin or Franckfurth.
oe1bu9454-123: Forwards an express letter just received from Kunckel and asks for instructions. Urges a settlement with von Otocki, ideally an amicable one in which Otocki would accept 1500 or 2000 ℔, and asks whether Kunckel should be given full authority to settle. Warns that Kunckel and Jentsch are working at cross purposes — Kunckel rash, Jentsch malicious and intriguing — and advises keeping both in check. Notes Glenck failed to return, leaving the Kontopp accounts behind.
oe1bu9454-124: 'Encloses a draft reply to Kunckel for the Fürst''s approval, and asks that fair copies of the two letters be made by another hand: Triebenfeld is "as though crushed", his wife being buried that day, and he has withdrawn with the children to his brother-in-law''s, promising a fuller exposition once he has collected himself. Notes that he has to hand a map of Kopoyno, Skokum and Swiątniki.'
oe1bu9454-125: A brief note announcing that the people from Olesnica have arrived with the monies and wish to attend the Prince at four o'clock; Triebenfeld reports having already negotiated something with them and promises a fuller account that afternoon, expressing confidence that the terms agreed will not displease His Serene Highness. No sums or names of the Olesnica party are given.
oe1bu9454-126: Reports that Cabunis (Cabanis) has returned from the Hussites, who were exceedingly pleased and now wish to hurry back, assemble their co-religionists and settle everything within a fortnight; he has brought much news requiring discussion, and someone must go there at once to put matters on the best footing. Triebenfeld, meanwhile negotiating with the Olesnicas people, asks the Prince to call on him for a quarter of an hour after the parade to hear them himself and give orders.
oe1bu9454-127: 'Complains that pleading is useless: the Prince has not paid a single Groschen of interest, so Triebenfeld must himself meet the 700 Rthl promised for the inventory under his guarantee, plus 175 in interest since 1799 and 35 Rthl costs of suit, 910 Rthl in all. His treasury is empty, having paid 1537 Rthl 12 gg the previous day in the Nudnich affair; Wildegans and Heyman Pincus promise settlement but nothing comes. Asks for 900 Rthl to avoid execution, offering timber monies at Midsummer.'
oe1bu9454-128: 'Reports on untangling affairs at Trąbczin: eleven lawsuits prorogued and to be compromised; tenants demanding heavy withdrawal-money, Otcibi settled at 3000 Rthl withdrawal, 2000 Rthl surety and 1000 Rthl for seed-corn and housing. Flörten and Rybbel, whose badly drawn contract could cost 11600 Rthl, are pressed by execution and sequestration to quit; von Rudnicki to leave at Midsummer. Praises the Landrath''s help in letting land, ground-rents of 1 Rthl per Hufe and purchasers for 87 Hufen, and reports Glenck''s mockery of the Olesnices contract and his proposals for proxenetica and removing Kunckel.'
oe1bu9454-129: Reports no post from Berlin or Frankfurt and mounting anxiety; begs any comforting news from Glenck. Hopes pinned on Kolzig have faded since Amelang does not answer the plan put to him, so the sale of Kontop must now be pushed hard rather than forbidden. Bernhardi, the lessee, has been summoned to Breslau and instructed to describe the estates favourably and truthfully to Rudolf and Stubenrauch, lest he obstruct the sale or be bought off.
oe1bu9454-130: Reports arriving to find Glenck departed and Leixner absent, with nothing yet settled and the parties mistrusting one another; recalls the agreement made with M Bernhard that the estates remain in the Prince's name and that Leixner take Kaemen, held either in the Prince's name or Triebenfeld's. Notes Leine's straits, his abandoning the Incolat application, and Count Schulemburg's interference; an express courier has been sent after Gleich, and Triebenfeld goes to Berlin, then Bersch.
oe1bu9454-131: Reports from Berlin that the prospects held out there are lies and not a Heller is to be had; promises instead to return to Frankfurth on the 20th, conclude with Leixner over Kaemen and raise the money needed for Koschentin, while arranging for Koltzig or the loan. Notes the King's reluctance to lend since Russia wants war, and that in the Broniewalische affair arrest depends on proving the causae arresti and on 2000 Rthl in f. Dor, blaming Mell and Glenck for delay.
oe1bu9454-132: 'Reports the failure of prolonged waiting on Mr. Glenck and departure for Breslau with the errand unaccomplished, complaining that speculators fish in troubled waters at the Prince''s expense: at Betsche the subjects bought their freedom for 30000 mk above the purchasers'' price, and worse is expected at Kaemen. Urges that Director Stubenrauch buy the estates by Midsummer, offering guarantees of 10000 Rthl yearly revenue through dismemberment, valuations of 250000–300000 Rthl against the Prince''s acceptance of 180000, a tantième from the Order''s Chamber, and caution with the Cabinets-Rath over the Koltzig indemnification.'
oe1bu9454-133: 'Despairing report on tangled negotiations: Glenck has produced nothing and failed to appear at Frankfurt; Leixner, having gone secretly to Betsche, wants out of his contract, refuses any dealing over Kaemen unless given eviction-warranty and Incolat, and demands annulment of the partnership contract securing Glenck a third of the profit and a farm for Baron von Brandenstein. Also: no progress with the Order''s Chamber, the Harlem purchase abandoned, the 100000 Rthl Invalids'' Fund loan unsecured; and Beyme''s advice to the King to settle the compensation claim by remitting the Prince''s debt of over 200000 Rthl, with Köckritz''s confidences and talk of war and the Russian–Austrian alliance.'
oe1bu9454-134: Reports the collapse of the Invalids' Fund loan after Building Councillor Glenck, advised by Captain Lange, let Court Councillor Lengnich recast the Otto valuation for 25 Fr., reducing it to 78000 Rthl and wrecking credit at Frankfurth and with Stubenrauch, Leixner and the Pupillen-Collegium; denounces Glenck's written undertakings to Dietz, Werner, the Jew Borchart and others. Relays Beyme's offer, via Amelang, to remit the King's claims and Curland debt instead of Brzyzer compensation, and Amelang's counter-proposal of Schlabrendorff's Kolzig estates; plans to raise 120000 Rthl on Kontop and Zagorow.
oe1bu9454-135: 'A dossier of four enclosures on the attempted sale of Kaemen and Kolno in South Prussia: Chamber Councillor Werner of Berlin claims his 2 per cent commission from the first purchase monies, citing the Prince''s sealed undertaking of 17 December 1803 (transcribed here), alleging he named the purchaser through Hahn and fearing chicanery from plenipotentiary Glenck, and recalling 30,000 Rthl lost on Hereditary Count v Stolberg; Glenck seeks 60,000 Rthl on second mortgage behind 100,000 Rthl for the Braniuschisch protestation; Stubenrauch declines, the estates being discredited by brokers.'
oe1bu9454-136: Congratulates the Prince on the sale of Kolno and Kaemen; reports that the 76000 Rthl will be paid locally in hard coin to Bernhardi's Foundry Department order, aided by a freshly attested Otto valuation, and that the Broniszewski and Kölzig matters are being pressed in Berlin through Unruh, with confiscation pending on Luchesini's certificate. Details the Zagorowo mortgage, Lichnowski's 130000 Rthl backing, reckonings with Radzimski at Szetlewek, plans for Trąbczin, Swięcia, Drzewce and Mennonite settlement of some 400 Hufen, and a wager lost over Glenck's disloyalty.
oe1bu9454-137: Reports on dealings with Herr Wiener, Meyer Bernhard and consorts, who after evasions in Berlin (Friedländer's absence) now promise to remit 76000 Rthl plus some 20000 Rthl in bank obligations by courier, while withholding 30000 Rthl on the pretext of the repurchase of Betsch; Meyer Bernhard adds 10000 Rthl. Notes the deposition of the Brunieweisch moneys pushed through via the Grand Chancellor and General Köckritz, the King's civil reply on compensation and an offer of estates in hereditary lease rather than money, and Princess Sacken's calling in of 30000 Rthl on Koschentin through Herr Cosmar.
oe1bu9454-138: Amelang reports that the renewed first attempt at deposition in the v. Broniewski matter failed, as shown by the enclosed resolution of 25 June, and that he pressed for a rescission. Acting on v. Triebenfeld's assurance that the Prince would lodge security to gain possession of the estates, he offered 10000 Rthl; the deposition and the clearing of Kolno and Kaemen have accordingly been ordered to the Government at Posen.
oe1bu9454-139: Reports bitterly that the disputed settlement with Broniewski has been approved and expedited in Posen despite the court rescript on the deposition and the Prince's written protest, which arrived on the 8th and was set aside; Glenck submitted it for approbation on the 6th, admitting he had seen the decree, while Metzer blames Wünster and estimates six to eight years for the liquidation suit. Triebenfeld plans to go to Betsch, then return to dislodge Bornstädt and check Braniewehr's security.
oe1bu9454-140: 'Reports the collapse of the Betsche sale to the peasant communes: Glenck is accused of urging the villagers to withdraw, of lying about the contract with Leixner (in fact ceded to the merchant Klein, cousin of Rochlitz), and of persuading Meyer Bernhard to delay paying 66000 Rthl at Posen. Encloses letters from v. Bornstädt (who claims a promised 1000 Friedrichsd''or for selling Betschen at 200000 Rthl and alleges a 500 Rthl proxenticium to Glenck), asks for express orders compelling Glenck and Lieut. v. Brandenstein to surrender and judicially cancel both contracts, and complains of ruined woodland and fraudulent timber contracts.'
oe1bu9454-141: Reports falling ill with bilious fever in Posen and denounces the Bruniewski settlement as so faulty it gave security "not worth a Groschen"; it must be redrawn, but Bruniewski's wife is untraceable, said to be at Kollo or Warschau. Accuses Wünster of colluding with Bruniewski and Guderian and foisting the compromise on the simple Glenck. The Jew M Bernhard and Simon offer only 6000 instead of 13000 Rthl; pledges to press Metzer for the full 66000 Rthl deposit and bring 30000 Rthl from Betsche plus 13000 Rthl.
oe1bu9454-142: Confined to bed or sofa by an obstinate illness and finding even writing difficult, Triebenfeld reports Bornstädt's enclosed announcement that he intends to depart, his money presumably spent. Glenck, asked to bring out the lease and settlement contracts made with Bornstädt, sent only a curt note; Triebenfeld petitions the Prince to order Glenck to surrender the contracts, settlements and accounts, and to authorise in writing a final payment of 5000 Rthl, Braun reckoning Bornstädt's claim at 7500 Rthl besides the honorarium promised in the Betscher purchase.
oe1bu9454-143: Amelang, writing from Berlin, acknowledges the Prince's notification of the outcome of his compensation matter and expresses satisfaction that the Prince himself is content with the way the business has been settled, adding the wish that the King's continuing favour toward the Prince may match his services to the State. A short, purely complimentary reply containing no financial or administrative detail beyond the reference to the concluded compensation case.
oe1bu9454-144: Acknowledgement by Amelang, writing from Berlin, that the Prince's instruction of the 31st of the previous month has arrived; he will call on Count von Schulenburg the following morning to hand over the letter addressed to him, hear his declaration, and report the outcome of the conference by the next post. A brief covering note containing no other business.
oe1bu9454-145: Reports a carriage accident on the road and his arrival at Kalisz shaken but unhurt, delayed until the vehicle is repaired. Court Councillor Grimm lies gravely ill but will prepare everything for von Radzinski if the contracts arrive; Honrichs still refuses to pay 4000 Rthl despite receipts and the Collegium's consent, and Grimm cannot sue without the contract, which is with Nochlitz. Asks that it be reclaimed from Köckritz with a power of attorney, and complains that orders at Trąbczin contradict his plan, 100 Scheffel of corn having been lent out and much land sown.
oe1bu9454-146: Encloses Pankratz's letter as proof that the Mennonites, whose elder he is, will buy Zagorow and Trąbczyn entire and divide the estates among themselves at the Prince's price; Triebenfeld leaves for Lunau to conclude. Glenck's contract of 5 September over 300 Morgen and the komorniks, protested by Tappert and the commune, has stalled the Taxation Commission, and written retractions are requested by express. Denounces Leopold's 368 Rthl, Wollenhaupt and Landrath v. Blomberg, and objects to execution for Przespolewski's 6500 Rthl.
oe1bu9454-147: 'Reports an exhausting journey through West and East Prussia: the Mennonites, scattered and unreachable on impassable roads, promise to come to Breslau on 19 December to conclude the contract, but insist the propination rights be included in the valuation, so Landsberg and Oderbruch settlers have been summoned as alternatives. Refuses to parcel the plots, blaming cheap purchases by the Olesnice and Swierer men; assessment at Trąbczin is delayed by missing data. A postscript protests bitterly at Glenck''s reproaches and contrary dispositions, mentions Kochlitz, Schema''s request for instructions on the Wrąbczin lands, the Dominium''s 53 Morgen at Wegberin, and the Voigtey valued at about 11000 Rthl.'
oe1bu9454-148: 'Corrects Glenck''s revenue tableaux for the South Prussian estates: Swięcia is entered at 1800 Rthl annual interest on 10000 Rthl capital, but the assessors'' revision completed that day yields only 918 Rthl, so the 3792-Morgen property has effectively been alienated for 28360 Rthl, a loss of 47340 Rthl. Added to the Olesnicer loss of 48000 Rthl against the present sale, the Fürst stands to lose 95340 Rthl.'
oe1bu9454-149: 'Reports on the parcelling sales: buyers from the Oder and Nezzbruch are expected in numbers, waste corners cut from the Swięce parcels have been sold advantageously, and no Hufe will go under 600 Rthl; the Zagorow assessment should exceed 400000 Rthl, enabling borrowing in Berlin to satisfy Schlabrendorff, Legnowelii and other pressing creditors. Quarrels with Glenck and the Olesnice hereditary lessees brought on a three-day colic. The Wrgbin subjects, threatened with removal of their parcels, forced labour and sale with the Voigtey to von Marowecke for 15000 Rthl, have been referred to justice-burgomaster Schenck.'
oe1bu9454-150: Reports a letter of 23 November 1804 from Provincial Elder v. Lichnowski demanding 5572 Rthl 12 Groschen in interest arrears accrued from 4 May 1803 to 4 November 1804; expecting payment from the administered Trąbczyn, he obtained a mandate from the Kalisch Government setting a fourteen-day term, now expired, and threatens to apply for sequestration while professing goodwill and hoping for settlement at Christmas. The reply pleads unpaid tenants and v. Triebenfeld's ongoing regulation of affairs.
oe1bu9454-151: Acknowledges two princely letters, welcomes Herr v. Nothardt's appointment as Director and notes the alarm caused by the Harlem–Nöldichen affair. Reports Mennonites at Trąbczin wishing to buy both estates, but deep snow halting all survey work; revenues fall far short (Suvigria 918 instead of 1800 Rthl, Wrąbczyn 1123 instead of 1500), forcing a wholly revised assessment. Lichnowski has arrested part of the Olesnic 10,000 Rthl; promises some 8000 Rthl at Christmas and capital fetched from Berlin for Schlabrendorff and Lichnowski.
oe1bu9454-152: Promises the free-pass for Hohenlohe wines and the early remittance of 25000 Rthl. Reports that Glenck's registered debts encumber not merely Swiecia and Olesnica but all the Zagorow localities, complicating the intended dismemberment, which is further threatened by Nothardt's death and v. Goldbeck's arrival as President at Kalisz. Complains that B. R. Bernhardi failed to supply the money, sending an impertinent letter instead; funds have been found in Berlin. Notes v. Voss's fête, a princely christening, and Nothard's 28000 Rthl of debts.
oe1bu9454-153: Reports difficulty raising 25,000 Rthl since Herr von Stein, now President of the Bank, has again forbidden all discounting; the 140,000 Rthl capital may come from the Invalids' Fund or the Potsdam Orphanage, but neither will accept payment by instalments or release funds before the formalities are complete, so he and Amelang seek the 25,000 Rthl provisionally. Commerce stands idle, the Widows' Fund and Pupillen-Collegium fear South Prussian bankruptcies, and the King is enquiring where the millions sent to South Prussia have gone. Breaks off mid-sentence.
oe1bu9454-154: Reports the loan negotiation proceeding well and under examination; denies Wollenhaupt's talk of a sequestration, noting that Lichnowski has lifted the attachment on the interest for six weeks and that Grimm assures him the attachment on Magnuski's account is also lifted, though Przespolewski has no claim to 30000 Rthl and the Dębinska has newly attached payments to Magnuske. Denounces Blomberg's letter of 25 December as extortionate threats over the dismemberment, and describes the sharp rebuke sent him.
oe1bu9454-155: 'Reports, on the Prince''s command, a personal interview with Chancellor Herr Hohmuth about the Schlaberndorff payment: the Countess can be kept from reviving her suit only by payment of 25000 Thl. before the next Berlin post-day, after which Hohmuth would persuade her to wait for the remaining 25000 Rthl.; he would not hear of a bond for that second half. Notes that Nurlich left with the wild boar for Government Councillor von Kreczinski, via Kalisch to Trąbczyn.'
oe1bu9454-156: 'Reports on the stalled effort to raise 25000 Rthl in Berlin: the papers are approved but lenders delay, and two near-certain arrangements were thwarted, probably by young Eyſenhardt, who claims 18000 Rthl and whom Court Councillor Meyer would satisfy by assigning 20000 Rthl; Triebenfeld refused, citing the undecided Janvelen suit and 9000 Rthl charged on Szetlewek, offering interest only, and similarly over Ziemecki. Complains of Bernhardi''s eleven-day delay and his diversion of 3200 Rthl due to Professor Rhode to Liep Meyer. Encloses a copy of Countess von Schlabrendorff''s threat to press her Berlin suit for her children''s arrears of settlement money; mentions General von Köckritz, Amelang, and a free pass for 120 Eimer of wine.'
oe1bu9454-157: Reports that, through General v. Köckritz's personal exertions, the loan from the Invalids' Fund is assured, though its timing is uncertain; describes an acute shortage of money in Berlin, with bankers paying 10 to 12 per cent while the Bank and Seehandlung do not discount. Pochammer will lodge no complaint if the Schlabrendorff woman is paid within the quarter. Interest to Giraud and Haupt will be paid and the 18000 Rthl mortgage ceded; of 60000 Rthl to be drawn in advance, 50000 will be sent on. Homuth is asked to reassure the Countess.
oe1bu9454-158: 'Reports that through General v. Köckritz''s mediation the Invalids'' Department will advance 150000 Rthl without royal application: 50000 Rthl at once on mortgage and Triebenfeld''s bill, the remaining 100000 Rthl after the Chamber revises the assessments, repayable over 50 years. Notes that the Depositorium, Widows'' Fund, Bank and Seehandlung lend nothing into South Prussia, and bankers demand 10–12 per cent proxenetica. Promises the demanded 10000 Rthl, settles the Tirard and Hauk debt, advises against the proxenetica suit, defends himself over the Schlabrendorff affair, dismisses Wöllenhaupt on dismemberment, and proposes remitting 15000 Rthl to the Reich.'
oe1bu9454-159: Reports that Amelang has finally settled matters far enough to issue an instruction on the brothers Kuh, drawn against monies from the Invalids' Fund held as a negotiation-obligation, amounting to 36,755 Rthl 7 gg, which is forwarded without delay; asks that the enclosed letter to the Messieurs Kuh be delivered at once. The Hangsche and Eysenhardtsche affairs are to be put in order next, after which he will travel to Kalisz to pursue the 100,000 Rthl.
oe1bu9454-160: 'Complains of obstruction in Berlin: the Invalids'' Fund has only now released the Seehandlung obligations, enabling him to satisfy Bang: Livi, with a hundred thousand to follow once the Chamber has revised the assessments; friends are watching the monies, businessmen taking 6 per cent. Reports 900 Rthl interest paid to Gerard against a surety, the Seebald deal abandoned but 1800 Rthl Proxeneticum saved, and Eysenhard to be settled. Plans departure via Kontop and Glogau, having missed two terms, and urges expelling the Olesnic men, who protest the woods'' dismemberment though after-purchasers paid 10000 Rthl with 10000 more promised.'
oe1bu9454-161: Reports that the Prince's letter of the 3rd reached Berlin just as Kl. v. Triebenfeld was departing, and was laid before him; he was pleased at the Prince's satisfaction with his efforts. The assignation has reportedly already been paid at the counting-house, and all now turns on the revision and expedition of the case; the authorities' shifting principles cause delays of weeks, where three or four months ago such business was settled quickly. Invokes Mr. v. Truberger as witness to the writer's diligence.
oe1bu9454-162: Reports that a General Finance Department order, provoked by Prince George's arrangement to have Councillor of War Korn revise valuations Korn himself had drawn up, now bars Chambers from ordering revision of judicial valuations without prior consent, halting Triebenfeld's work; President v. Goldbeck has applied for permission, forwarded by express courier with Amelang and Langen enlisted, though Voss may refuse. Meanwhile he will submit dismemberment plans, notes the Olesnice case returned to the patrimonial court through v. Husslarzewski, and twice begs for three bronzed busts and a lavoir for Goldbeck.
oe1bu9454-163: Reports the Olesnicers' evasions over 10000 Rthl, with a hearing due at Trąbczin and a Berlin decision awaited; Otocki offers 10000 Rthl and 1500 Rthl canon for Szetlewek in hereditary lease, plus propination of both estates (3000 Rthl offered, 4000 Rthl demanded), and further woodland; proposes buying out thirteen peasants at Swincin. Honrichs will not pay, so the contract should be annulled in favour of Maierowitz or Grimm; Szczucki and Ceizewski to be sued as evictores; asks 1390 Rthl for old Lichnowski, and gifts to soften the Chamber President.
oe1bu9454-164: Complains that no resolution has come from Berlin and doubts Amelang's diligence, blaming new chicaneries over revision of the assessments on Prince George and General Kalckreuth's lady; offers to have the Landrath attest them instead. Reports expected payments — 10000 Rthl and 2000 Rthl propination-rent from Otochten, 20000 Rthl from Meierowitz with a 500 Rthl canon — and awaits news of Swięcia from Nerlich. Denounces Glenck and v. Blomberg for concealing the Chamber's edicts of 1803–04 against the Olesnice contract, cites Dąbrowski on the Prussiemski compromise at Kowal, and laments his shattered health.
oe1bu9454-165: 'Forwards further items arrived by that day''s mounted post from Glenck, together with an extract in copy of a postscript ordered by His Serene Highness the Prince after the princely letter had already been posted, thought to be of use. Reports on the Prince''s health: the attack has moved from the right hand to the left foot, painful the previous day but eased overnight. Notes Bergrath Bernhardi''s arrival at Breslau in poor health, and wishes Triebenfeld recovery.'
oe1bu9454-166: Reports that Minister v. Voss and the Finance Department had the dismemberment inhibited and sent a Chamber commission to investigate; Triebenfeld defended his conduct on six points, the inhibition was withdrawn, and clear annual revenues of 31000 Rthl acknowledged, on which 3–400000 Rthl might be raised, with 180850 Rthl still to come in and freedom from debt within nine years. Complains that purchasers fled at news of the inhibition, and of his own losses of 19500 Rthl through lawsuits, hail at Schweinen and an insolvent tenant at Kontop, obliging him to leave Schenck to collect monies.
oe1bu9454-167: Hahn, writing on the Prince's behalf as His Serene Highness sets off to church with the old gentleman, forwards an enclosed letter with the Prince's compliments, explaining that he would have written himself had the ordonnance not been leaving within the hour. Reports that the old Prince is very well for his age and much attached to his most gracious Lord, and notes that the return to Breslau is fixed for the 25th.
oe1bu9454-168: Deep snow halts operations; contracts with the old peasants and their dues have been secured before the court, while negotiations over Szettleich and the propination rights with v. Otocki drag on. Amelang reports good prospects for the Berlin loan but needs the refusals of Minister v. Voss and the Chamber; Klewitz will consent to the dismemberment if plots go for rent rather than cash. Complains that P. Glenck, Wollenhaupt, the three Olesnice lads and Meyer are deterring purchasers, and itemises claims of 3011 Rthl (Winnicki heirs 1300, Chwalowski 850, Sprengel 61, Wollenhaupt 800), against whom he counter-claims 400 Rthl; Schenck demands 4 Hufen and his own Actuarius.
oe1bu9454-169: Reports that Minister v Voss has forbidden any revision of the assessments and awaits Amelang's answer on whether the Landrath's revision will suffice; the dismemberment is submitted, with a Councillor sent to Zagorow for Trąbczin. Details terms concluded with Meierowitz, Weigel, Schliefen and Honrichs (20000 Rthl purchase money), Radzinski's offers for Szetlewek totalling 48000 Rthl, and plans for Olesnica and propination leases, expecting 80000 Rthl by 1 July. Complains of Goldstücker's mortgage ceded to Oppenheimer, and of Glenck, Sprengel and Chwalowski's claims.
oe1bu9454-170: Reports on a mission undertaken at the Prince's command to ErtheSchweiner to confront the forester Bezold and the Amtmann Käufer over complaints against them. Bezold, unabashed, asked who had discredited him with His Serene Highness and protested that he did his utmost for the manorial interest; Käufer, found later at Breslau, cited excellent testimonials, valued his good name, and declared himself ready to face an investigation. Adds that the [Wüsten] go off by the carrying post.
oe1bu9454-171: 'Reports on the Prince''s health: the affliction of his foot is almost entirely healed, only slightly swollen and painless, and he is otherwise well. The Order of St Andrew pleased him, but the obliging conduct of the Emperor gratified him still more, and he is enchanted by the young monarch, who reportedly spoke flatteringly of him in Breslau. The Regiment Hohenlohe marched through Erfurt, the Prince riding out to meet it; the Duke of Weimar is expected next day.'
oe1bu9454-172: Reports from Trąbczin on pushing the dismemberment business with Eyster, the main term postponed to Monday when all parcel contracts are to be concluded. Quotes President v. Goldbeck's letter to Minister Voss defending the Chamber's earlier consent, blaming Councillor of War zur Höllen's errors and praising the Princely Dominium. Notes Mona Kunckel taken into custody, a difficult day expected over Szetlewek, and a fresh Winnich suit for 1300 Rthl of survey arrears; asks that six tables and thirty fruit trees be carted to the President.
oe1bu9454-173: Reports that the Rochlitz–Honrichs punctation and Nochli's power of attorney concerning Wittow cannot be found in the Trąbczin archive despite a search by old Tiel and justice-burgomaster Schenck, and urges the Prince to order Glenck to bring them, lest 14000 Rthl be lost. Details Blomberg's demand for 1000 Rthl beyond 900 already paid, the dismemberment inspection at Trąbczin, expected gains of 350000 Rthl from Olesnica, dismemberment and a loan, propination leases, names wanted for new villages, and requests amendment of Schenck's contract (salary 950 Rthl, land and actuarius appointments) before Grimm's dismissal.
oe1bu9454-174: Argues that combining the offices of Actuarius, Rendant and Justitiarius would end abuses worth some 200 Rthl yearly in fees, plus carriage-services and board, saving 600 Rthl, with Sporteln expected to reach 1200 Rthl. Complains that constant service ruins his own husbandry at Schweinen, where steward Käufer and forester Pelzold cheat him, and asks that Hahn be sent to overawe them; presses for the 1390 dkg promised in the Lichnowchi matter, hoping to recoup it from land sales at Trąbczin; returns the Amelang letter, urges writing to the patron about the 100000 and the assessment revision; reports from Colonel von Wiesołowski Russian forces of over 300000 men.
oe1bu9454-175: Writing on behalf of His Serene Highness, A. Huhn forwards two enclosures, one an original and one a copy, and asks Triebenfeld to set down his opinion on the matters and on what should be done. The creditors Girard and Haupt are pressing especially hard; the Prince would remit the sum needed to satisfy them at once, but his cash-box has been much depleted by his recent journey.
oe1bu9454-176: Reports the death of the reigning Prince zu Hohenlohe-Neuenstein, who shot fir-wood in the game park on 20 July, fell ill on the 24th and died of an apoplectic stroke on the 27th. Under the testament naming Hahn's prince sole heir, possession was taken at Oehringen and other Hohenlohe places, oaths of fealty sworn, and rival attempts by the Princes of Langenburg and Kirchberg, resting on a disputed partition treaty, repulsed and their patents replaced. His Highness travels there in September, leaving South Prussian affairs to Triebenfeld.
oe1bu9454-177: 'Business in Berlin is stalled by the army''s mobilisation: Klewiz has left for South Prussia and Minister v. Voss, summoned home from psalm-singing at Havelberg, is expected back, whereupon Privy Councillor Reinbeck promises to lay the Zagorowo/Trąbczyn dismemberment before the King for approbation, on which all borrowing from the Invalids'' Fund and Wards'' Collegium depends. Includes a schedule of fifteen new colonies (21,407 Morgen, 578 householders) and demesne and woodland remainders; only 7,130 Rthl received, with 68,000 Rthl owed to the Prusimska, Weigel and the Schlabrendorff woman; 2,000 Rthl paid to Colonel v. Schlieben; war news of mobilisation, generals'' postings and retirements.'
oe1bu9454-178: Hahn apologises for having mislaid, among his papers, chartes blanches signed by His Serene Highness that were meant for Triebenfeld, explaining that in the last nights before departure he had no rest, the Chamber Director Count from Behringen having arrived and all Hoheelohisch business needing settlement before the journey. The remaining chartes blanches he has sent to the young ladies von Triebenfeld. A postscript notes his appointment, before the departure, as Expeditions-Kathern.
oe1bu9454-179: Reports from Berlin that the dismemberment and the Betscher matter have won royal approbation, and that the Kalisch Chamber's assessments fix the estates' yield at 40260 Rthl, excluding forest and Laudemien; debts total 698000 Rthl (enclosures A–E, including an amortisation plan). Seeks a power of attorney for Court Fiscal Pochammer to secure Treasury notes at 3 per cent through Cabinet Councillor B. Recounts Glenck's demand of 8000 Rthl, warns against consenting to the Santomist/Sartomiel sales, doubts raising 30000 Rthl, and complains of Grattenauer, Schenck, Grimm and Malzern.
oe1bu9454-179a: 'Copies of four enclosures: (A) a Kalisch Chamber revenue survey of Zagorowo and Trąbczyn certified by Mencke v. Hellen and Mündel, showing an unalterable net yield of 40260 Rthl 14 g. 11 d. from dues, hereditary canons from Olesnica and Szetlewek, and leases to Honrichs, Glinicki, Niedzewiecki and others, plus 4900 Morgen of reserved forest; (B) a schedule of the Prince''s debts totalling 363933 Rthl, rising with the Courland debt to 698784; (C) Triebenfeld''s draft memorial to the King seeking 698000 Rthl in Treasury notes secured as sole mortgage, with a 34000 Rthl amortisation fund; (D) the amortisation plan over 39½ years, and part of a power of attorney.'
oe1bu9454-180: 'Answers the Prince''s letters of 8 and 18 April: the Jew Nathan Luipmann''s claim already stands in the transmitted Designation of liabilities, and creditors must be held off for now. The dismemberment monies of some 60000 Rthl will come in slowly, so short-term borrowing continues; the concluded Betschen affair yields 2000 Rthl after 6000 for Eichaust, plus 1200 Rthl laudemium from Raven, towards 30000 Rthl. Complains of the Prince''s mandataries, disputes Raven''s refusal of Laudemien, and awaits the Kalisz valuation while Pochammer discusses the loan at Steglitz.'
oe1bu9454-182: Acknowledges receipt of the Prince's letter of the 11th with dispatches for M. v. Haugwitz, Faudel and Glenck, but complains that the power of attorney for Court Fiscal Pochammer and the blank forms are missing, leaving him idle for weeks in Berlin; begs for these and for judicially attested blank powers, the stated sum needing amendment. Reports writing to Cabinet Councillor Beyme and Minister v. Voss, and planned calls on Haugwitz and Count von Keller. Denounces Gratsenauer's demands for money, a title and a Justice Councillorship at Breslau.
oe1bu9454-183: Reports a lampoon circulating under the title Prussian Characters, which attacks the Prince as a man greatly in need of money and depicts Triebenfeld himself as an intriguer who exploits his employer's affairs to enrich himself, a former servant risen to nobility. The copy he had sent has been confiscated by the French authority. Authorship is attributed to Colonel Massenbach or Professor Buchholz; if Massenbach is proved the author, Triebenfeld offers his pistols. Rochritz is likewise abused.
oe1bu9454-184: 'Hahn apologises for having forgotten to send the enclosed blank forms when the express courier left, then vents at length about his treatment in the service of great lords: old Ingelfingen servants, he complains, are forgotten in favour of undeserving newcomers who feast on the fat of the Hohenlohe lands while he is left to dangle on the lean hook. He hopes to extricate himself by his own strength and asks Triebenfeld to make no use of this confidence.'
oe1bu9454-185: Renewed and urgent pleas for the promised powers of attorney — one for the Court Fiscal Herr Pochammer, two judicially attested blank powers, and several blank forms — without which Triebenfeld can achieve nothing in Berlin and fears the delay will breed mistrust among those negotiating with him. Reports assurances given against Württemberg's encroachments on the Prince's territories, advises pursuing official channels there too, and, having met President v Höhneln, urges treatment of the Prince's gout by a fontenelle; hopes to attend him at Öhringen.
oe1bu9454-186: Reports that the business with Herr Weigel is as good as settled, his assent having arrived the previous evening, and that Weigel will spend Thursday with the writer in the country. Lacking the means to entertain the old gentleman properly — a matter, he insists, solely for the Prince's good — Triebenfeld requisitions from his correspondent a bottle of old Rhine wine, a bottle of good old sweet Hungarian Ausbruch, six peaches and two bunches of grapes, to be sent out to him if the note arrives late.
oe1bu9454-187: 'Reports that the powers of attorney and blank forms have arrived and been used: the Grand Chancellor will advance 90000 Rthl from the Justice Fund to satisfy the three most restive creditors, Weigel, the Schlabrendorff woman and Lichnowski, of whom the last is to return 20000 Rthl on a Schweiner mortgage, so that the Prince may have his 30000 Rthl. Complains of the motley Zagorow and Trąbczin mortgage certificate, of Oppenheimer''s unpaid 113600 Rthl, and of Meyer Bernhard''s suit despite the approved Betsch lease; travels via Beteche, Kalisz and Trąbczyn, with the von Wulffen claim of 30000 Rthl on Kontoppt averted by the General and Chancellor.'
oe1bu9454-188: 'Reports success in Berlin: through friends, the Grand Chancellor will release some 176000 Rthl from the Justice Fund to pay off the pressing creditors, notably H. Weigel, while Triebenfeld hopes to refloat the 200000 Rthl mortgage with Oppenheimer and settle Schlabrendorff by taking 20000 Rthl on a Schweiner mortgage from War Councillor von Hellen. Small creditors clamour most. Betsche is settled, Eichaust receipted, and he lists some 102000 Rthl of arrears expected at Trąbczyn; denounces Grattenauer as idle and false.'
oe1bu9454-189: Reports that the death of Mining Councillor Bernhardi has brought orders to travel to Upper Silesia and to regulate the affairs of the lordship jointly with Inspector Kreinig and Master of Forests Reichmann, both esteemed as upright men of business; matters at Koschentin are not in the best order and will give work. Once finished there Hahn will return to Breslau and thence into the Reich, and asks leave — already sought from His Serene Highness — to call on Triebenfeld at Trąbczyn, requesting a reply to Koschentin; sends Herlich's compliments.
oe1bu9454-190: Forwards, on the Prince's command, a carte blanche for the reply to Herr von Rewek, to be drawn up at Triebenfeld's discretion, together with an extract from a letter of B. R. Glenck of 22 March 1806. Hahn attributes Glenck's ruin to reckless speculation, frivolity and his wife, and urges Triebenfeld to join the Prince in rescuing him by sending the schema for the consent, which would release Ribbek from the Wrąbczyn purchase and silence Glenck's weekly complaints; Glenck describes pawning goods, selling clothes, lost credit and creditors' suits, and the delayed sale of Wilhelmsruhe.
oe1bu9454-191: 'Written from a sickbed after five weeks of bilious fever, an account of the summer''s business: a schedule of debts totalling 311000 Rthl (Oppenheimer 110000, Lichnowski 40000, Grotowski 20000, Radzinski 24000 and others) against 184000 Rthl receivable; suits by Meyer Bernhard at Betsche; the Prusimska dowry execution at Trąbczyn contested at Kalisz; empty coffers, insolvent lessees and peasants reoccupying allotted ground; contracts with Honrichs, v. Zglinski and the Kopojno lessee cancelled or reduced to one year, resistance broken by knout-strokes; Tietz''s claimed 300 Rthl pension queried; Glenck''s lampoon and conspiracy deterring purchasers; supervision entrusted to v. Hallen, Honrichs and Cabanis; news from von Tesmar that 360000 Rthl may be had.'
oe1bu9454-192: Writing from his sickbed in the fifth week of illness, Triebenfeld reports 360000 Rthl promised him in Berlin, the pacification of stirred-up peasants and the dismissal of tenants. Glenck has allied with the Olesnica agitators, engaging Kramplich, Bergemann and Rybbeh, and circulated a lampoon among prospective colonist purchasers. Weigel and Lichnowski are to be paid from the Justice Fund and cede their mortgage. The Prince is still to receive 190000 Rthl cash and 40000 in perpetuity; receipts from Swięcia, Olesnica and Szetlewek are itemised, and the Giese judgment is criticised.
oe1bu9454-193: Reports the prince's letter took ten days to arrive, wrecking the travel plan, and urges him not to come as far as Parchwitz, being too conspicuous; Triebenfeld will instead visit Schlawenschitz before going to Berlin. Relays Colonel Scharffenberg's word that Petersburg is close to an uprising. On the Polish estates, the Dabsha delays and pays costs; Prefect Garczyński has Honrichs, a debtor of over 10000 Rthl, arrested, with Heckern and Administrator Radecki investigating so arrears may be paid and the estates returned; notes 600 Rthl recovered and Count Trzcinski's involvement concealed.
oe1bu9454-194: Departure for Schlawentschitz is delayed by the Invalids' Fund, which demands renewed interest payments and the whole capital and threatens judicial auction of Triebenfeld's estates; suit is brought and a hearing set for the 26th, after which he will leave Glogau. In Poland the vindicatio of the Trąbczyn estates has gone favourably before the Court of Peace and been referred from the Tribunal to Kalisz; the King of Saxony grants a ten-year indulgence repaying a tenth yearly. He has asked the Prefecture to suspend Honrichsen, attach his goods and apply the 11700 Rthl he reportedly owes to arrears of interest, implicating his surety, sub-prefect Brzechsta.
oe1bu9454-195: Awaiting Count Strachwitz, expected in Breslau on the 23rd, before proceeding; reports a vexatious interview with Herr Flesch, who rails at Goldstücker for naming the Count and urges secrecy, suggesting a swindle and an unknown lawsuit attached to the business. The properties are said to be the Oderish estates near Leobschütz, valued at 900000 Rthl., Zackraw excepted. Adds rumours of war with France, Austria and the Turks, French contribution demands, Hardenberg's return, Prince Wilhelm's popularity, Koloma's testament given to Legation Councillor Henckel, and a two-year extension of the moratorium.
oe1bu9454-196: 'Reports narrowly escaping arrest in Breslau over a debt of 1500 Rthl to Sp. Lahr, whose mandatary Ludwig obtained a warrant despite a promised respite until Michaelmas; blames Flesch and consorts, and suspects Sterch''s proposed exchange transaction as fraud. He must sell his mill at half value. Also relays Breslau political rumours: Napoleon pressing for the contribution, threatened execution troops, a possible remission of 10 millions against 20000 men, the collapse of the Dutch loan, Hardenberg''s labours, and advice to write to the Berlin Liquidation Commission citing Berger''s testimony, with Professor Schade to report on the 35000 Rthl business.'
oe1bu9454-197: Reports that his judge has returned from Berlin with news that the two General Köckritz have silenced von d. Lahr, who will wait a year, and will speak to the Gl. Etats officials about forbearance over interest due to the Invalids' Fund. Triebenfeld will settle affairs at Kalisz before returning to Breslau, urges the Prince to press Goldstücher over the barter transaction, and reports engaging Chief Bailiff Hegener of Ollaboch to work on Strachwitz and to revise matters at Zagorowo, while pushing the Trąbczyn and Konojader business. A postscript quotes Privy Councillor Tismar's letter denying Lahr's involvement, which Triebenfeld ascribes to knavery by Flesch and consorts.
oe1bu9454-198: 'Reports on his return from Poland: Trąbczyn will be recovered by Michaelmas, the sequestration is lifted, and the Calculator Schneider is auditing the accounts of Honrichs and Frankiewitz, guaranteed by pod prefect Brzechsta, with 11700 Rthl embezzled at issue; Hecker is conceded as administrator and liable. The tenant Smidkowski pays several thousand to stay; Dąbska''s petition to the King over Tropiren failed. Relays Köckritz''s, Tismar''s and Rhaden''s remarks on the Colonna papers, Hardenberg''s return and the 35000 Rthl.'
oe1bu9454-199: 'Reports his arrival and encloses a letter from T confirming that the King will certainly come with K2; he therefore abandons his journey to Berlin, working instead on the spot and sending wine and fowl-game to T for a farewell banquet at which much may be settled. A note from Herr v. M suggests Hardenberg will accompany the King, which he doubts but hopes for, urging T to bring Hard: to the banquet. He then intends to ride to Zagorowe, expecting 6000 Rthl cash from the sale of his mill and arrears from his subjects.'
oe1bu9454-200: Reports that the Prince's letter arrived too late for Gen. v. Köckritz, who leaves before Sunday; suggests referring v. Seegebarth to the express-courier monies from the campaign. Brufurt's failure to appear has delayed the writer's journey to Jogorowo, planned within days and a return by the 7th. Details negotiations urging Weigel, who refuses Stössel as debtor, to acquire the Silesian estates himself, arguing the fideicommiss shields the Prince from arrest. Awaits news of the King's coming visit.
oe1bu9454-201: Reports that Weigel has resolved to accept estates negotiated for the Zagorow lordship, whether the Knobelsdorff or Pommahisch ones, setting his own and Stossel's claims against them, and will confer with Triebenfeld at Schweinerin on the 30th. Outlines a scheme to sell Schweinern to wealthy Breslau merchants, one having offered 220000 Rthl against his asking price of 250000, leaving 160000 in cash after 40000 intabulated; with Weigel, Stössel, Grotowski, Lichnowski and Zerboni satisfied, the Prince's remaining debts might be extinguished. Urges pursuit of the plan with H August.
oe1bu9454-202: Reports the outcome of a meeting with Father Weigel, who has left well satisfied and placed the whole affair in Triebenfeld's hands, being willing to take on the estates the Prince is acquiring by exchange; Triebenfeld must now set it out precisely so that Weigel's son can also understand it. Quotes at length Weigel's praise of his disinterestedness in Berlin dealings, noticed by the King, Bischoffswerder and old Eysenhardt. Hopes to sell the two free holdings soon.
oe1bu9454-203: Encloses the Exposée given to Weigel, who is engrossed in the affair and means the Knobelsdorff estates; Hainen is to be brought round, though Weigel may act without him. Triebenfeld is scraping together 500 Rthl to leave on the 11th for Zagorowo, and negotiates over Schweinern with the merchants Wiener and Schiller; Tismar writes mystically from Berlin. Fischbach's figures compare Knobelsdorff's estates (390,000 Rthl debts, 310,000 clear) with Zagorowo (247,000 debts, 293,000 clear), proposing an exchange for 1½ per cent; asks whether Fischbach and Knobelsdorff should come to Schlawenschitz, Trąbczyn possibly included.
oe1bu9454-204: 'Alarm at the Prince''s letter to Herr v. Heyne offering to cede Koschentin to Weigel or Stössel, which has all but wrecked Triebenfeld''s plan: Weigel, calling that forenoon, declared he would not exert himself since he would get no ready money anyway, and queried whose account the Prince''s payments would be credited to. Heyne has been drawn in to retrieve matters. Warns that returning Koschentin to Stössel would forfeit the outlay upon it, and asks for a candid answer and that his letters be shown to no one, others being intent on thwarting and ridiculing his proposals.'
oe1bu9454-205: Reports Köchlich's departure at five, the King to follow an hour later, and Köckritz's compliments; pursues the exchange transaction, and relays that Knobelsdorff, engaged for the General Landschaft Director until the 10th, can travel to Zagorowo thereafter. Weigel would accept Stössel's taking the Bischdorff estates if registered there, giving a receipt and clearing Koschentin. Notes forced repayment of monies in Poland, expected war between France and Russia, rumoured Russo-Turkish peace, Labage's mission to Paris offering linen and iron for contributions, and warns the Prince against false friends.
oe1bu9454-206: Reports on Lombardini's visit and warns the Prince to expect nothing from the present government, predicting satisfaction "from the North" and offering to travel to Petersburg himself. Knobelsdorff will certainly exchange; Tatz is expected for the wool market and then Trąbczyn. The 35000 Rthl must wait until Eberhard(t) sends his schedule; Scharnhorst has spoken at Cosel, and an offered money settlement should be refused. Three free holdings at Petersdorff are to be sold for 1800 Rthl, a loss of 3200 Rthl, to fund journeys. Sets out a four-point plan for Zagorowo — Cabanis to swear to the number of plots, contracts to be produced, payments and arrears acknowledged, and terms reached with Honrichs — verified by Referendarius Sommer, a Polish lawyer and Chief Bailiff Hegener.
oe1bu9454-207: 'Copy of a report from Hecker and Honrichs at Kalisz: the Trąbczyner suit has been initiated, with the term set for 24 October after an eight-week tribunal vacation; Court Councillor Falz has taken it on, received the 200 Rthl advance and leaves his honorarium to the Prince. The sequestration of the estates is ended, with rumours the King of Prussia will reclaim outstanding moneys; Olesnica''s hereditary lessees demand 12 Hufen at moderate canon; Polish peasants and Hauländer resist the 3 fl. per Morgen rate. Kwilecki requests the promised live stag; Triebenfeld advises remitting arrears only.'
oe1bu9454-208: Lack of money still prevents the journey to Pehlen, though prospects in the affair look better than expected, with a third deceiver besides Knobelsdorff and Strachwitz. Reports distraint over the Schlieben matter, arrest of his Schwänner lease-monies pending reopening from Potsdam on General v. Köckritz's promise, and Lombardini's refusal to pay the executor Schoch 48 Rthl 6 g; begs the Prince to order payment. Adds news of royal manoeuvres near Potsdam and Köpnick, Kuralien, Labaye's Paris contribution offer, jägers along the Elbe, confiscations at Hamburg, arrests, and Kalckreuth's declining standing.
oe1bu9454-209: 'Brief note acknowledging receipt of the instruction: Triebenfeld will draw the money and depart immediately, promising to report everything from Zagorowo at once by mounted messenger, who is also to bring Herr v. Knobelsdorff there. Written in haste as the post was leaving, with a possibly damaged closing phrase, and signed at Breslau.'
oe1bu9454-210: 'Reports on three (numbered up to five) suits pressed at Kalisz: the Trąbczyn vindication against the Dąbska, which would also save 22000 Rthl of registered dower, with fees to the advocate Falz (300 Rthl), Tribunal President Smagorzewski (100), assessors and 160 Rthl of wine; eviction of the Olesnica lads, who owe 39270 Rthl, and the offer of Polish peasants to take the holdings; arrest of Niedzewiecki''s wood and cattle; and action against the propination lessee Nassalski. Complains of Hawich, useless military execution, and empty hands; expects 44000 Rthl by New Year and begs four weeks'' further leave for Referendarius Sommer from President Count Danckelmann at Breslau.'
oe1bu9454-211: Reports that Herr von Knobelsdorff has visited and inspected the locality to his satisfaction, and that Triebenfeld is now bringing the papers into order so the whole may be surveyed at a glance, despite great confusion and obstinate people. Expects the Trąbczyn lawsuit to end well, the term having run since the 24th, with the Tribunal's decree perhaps a fortnight off; a win would end all distress. Praises Knobelsdorff's honesty and asks to be left sole conduct of the business.
oe1bu9454-212: Recovering from severe illness in a peasant's hut at Swiątniki, Triebenfeld reports 31 lawsuits for non-payment, plans to evict the Olesnicer tenants, Niedzewiecki from Kopoyno and Hawich from Drzewce, and to re-establish three demesne farms. Outstanding are 8657 Rthl taxes, 7500 Rthl Invalids' Fund interest and charges on 27000 Rthl; Napoleon's new terms for colonists have unsettled everything. In the Trąbczyner suit Poniatowski secretly urged the Tribunal to defer to higher authority. Encloses figures valuing the Zagorower estates at 22140 Rthl yearly.
oe1bu9454-213: Recovered from illness but injured when his carriage overturned on the road to Konin, Triebenfeld reports State dues paid down to 900 Rthl and hopes, with 3000 Rthl due from Nassals before the Kalisch Tribunal, to lift the costly sequestration, the sequestrator's new account standing at 2236 Rthl. He schedules some 43 suits, against Niedzewiecki, Nossalski, the Olesnicer lessees (33000 Rthl), Wrabczyner peasants, Berda, Hauländer, Ribbeck and 29 colonists, totalling 89115 Rthl; tenants refuse payment as the Prince is a foreigner. Notes Hardenberg's ignorance of the new 40-year amortisation and attachment, and Zerboni's manoeuvres.
oe1bu9454-214: Condolences on the death of the Princess Sanken, then news that the Departmental Minister has confirmed a settlement spreading the Bank and Invalids' debts over 41¾ years at 6 per cent, with a like moratorium expected for private debts and Herr Weigel. Hereditary lessees pay nothing; suits over Olemizur, Werbizier and Swiecia should annul the contracts and lift revenues to 22–24,000 Rthl. Hecker, dismissed at the Tribunal, owes some 2500 Rthl; Triebenfeld defends himself, reports personnel cut to 1000 Rthl yearly, and plans a Berlin journey on the 25th.
oe1bu9454-215: 'Point-by-point report: receipt of 1000 Rthl through Master of the Horse Bally, 255 rt sent for his children, and 245 Rthl for redeeming iron. Honrichs cleared, Hawich unmasked and expelled by Count Kwilecki, Hecker discharged, Cabanis defended. Presses for lifting the Zagorowo sequestration by depositing 5100 Rthl interest against Mendel Oppenheimer''s disputed 102000 Rthl claim; Stenger dismissed for Raszkowski at 300 Rthl; vindication of Trąbczyn and Kaemen from the Dąbska, with 60000 Rthl damages, remission of a third of colonists'' interest, Betschin and Wyttow arrears, the Collonmasche affair, and Brzechsta''s inability to buy the South Prussian estates.'
oe1bu9454-216: Reports that private debts and the Bayonne sums (Bank, Jesuit and Pupillen gulden) will likely fall under the 41¾-year moratorium, leaving some 200000 Rthl on the estates, amortisable at 6 pCt., with a document on the Weigel 50000 Rthl expected. Presses the Fürst to declare by express whether he will keep or exchange the estates, since keeping them requires judicial annulment of the Hauländer to form demesne farms. Requests a power of attorney for advocate Schmid at Kalisz against Hecker, notes the Olesnice and Wrąbczyner cases, widespread insolvency, and payment of the messenger.
oe1bu9454-217: Sanitz explains his removal from Silesia and Brau after nearly 49 years to pursue the loss of his fortune and the recovery of estates taken by the Dąbska woman; his former legal agent Weltzer in Josen holds out little hope of Polish justice, the Dresden court excuses the Polish judges and denies the Peace of Tilsit's application, while the French envoy may take up his cause if Imperial orders are lacking. He asks for copies of the judgment and tribunal sentence in the Prince's Trombschyner suit, and reports rumours of imminent war in the North.
oe1bu9454-218: Proposes, with Herr von Heuthausen and Master of the Horse Bally, exchanging Schurgast (bought for 207000 Rthl, 92000 in debts) with General Count Wartensleben, valuing the Zagorow estates at 560000 Rthl against 237375 owing, leaving the Prince a clear mortgage of 207625; Stöckel and Weigel must be induced to take Schurgast and the mortgage. Offers his own Blizanow and a 30000 mortgage on Kontop; urges secrecy and haste against Medical Councillor Gumperts. Reports arrears at Betschen, uncollectable Olesnica debts of 35000 fl, the Wrąbczyn contract quashed, lawsuits with Olemia and Weyberin, and his own tenfold arrest and destitution.
oe1bu9454-219: Presses urgently for a decision on the submitted plan, since a Medizinal Rath from Kalisz is already negotiating with old Count Wartensleben; if approved, Triebenfeld will travel to Münse and exchange his own Blizanow with Wartensleben's elder son, so that Weigel and Stössel in particular can be satisfied and the Prince left in quiet possession of the entailed estates. Warns that mounting dues and distress may end in revolt; reports enquiries by the Conservator of Mortgages, President Dierschlag, about estates registered in Triebenfeld's name.
oe1bu9454-220: Reports that the prince's letter, left lying by the tenant at Schweinere, reached him three weeks late; he sold his wool at Oxtrow for travel money and rode to Count Wartensleben at Neisse, only to find the Schurguet estates already sold to a bankrupt Kulins merchant for 135000 Rthl. Proposes buying young Wartensleben's Constadt estates (asking 200000 Rthl, 120000 in debts), contingent on Weigel and Stössel assuming the Zagorow mortgage of 270000 Rthl and receipting 350000 Rthl, with Koschentin recovered as an entail for Prince Alexander; asks for instructions by express to Blizanow and the return of the valuation and arrears schedule in original.
oe1bu9454-221: Reports that the 18000 Rthl requested from the Zagorow estates cannot be raised; two pending lawsuits offer the only prospect, and he hopes merely that the Christmas interest is paid so the moratorium holds. Sets out rival plans (sub A and sub B) for alienating Zagorowo to Stössel, with Count Leopold v Wartensleben, Weigel, Sandrelzki and an exchange of Blizanow for the Pila estates, tabulating claims to 470000 Rthl; rejects Constadt and Schurgast, and asks for his papers back.
oe1bu9454-222: Reports, on the Chief Court Official's authority, that Baron Stossel will accept the Zagorow estates in settlement of his claims under Triebenfeld's plan, which would also satisfy old Weigel and free some 670000 m. in cash from the late Princess Sacken's legacy, earmarked for entailed estates for Princes Adolph and Allexander. Presses urgently for written consent, noting Count Caesar Wartensleben's advice to plead Koschentin and offer Blizanow too; asks 5 Rthl for the messenger, and mentions Koch's summons to Berlin and his son's commission in the Garde du Corps.
oe1bu9454-223: 'Written from Schlawenschitz by the Fürst himself, replying to Triebenfeld''s letter of 20 November: he presses for rapid sale of the Zagorow estates to clear his private debts, doubts any bargain with Weigel and Stössel unless both agree, and declines Ruszynowią and Blizanow. General v. Schimmelpfennig and his sons want Zagorow, offering the debt-free Szelce and Maderzewo (bought for 26000 ducats, now valued above 100000 Rthl), plus Gollawia; Lieut. Sommer is to be sent ahead and rewarded. Also reports Adele''s betrothal to the Hereditary Prince of Hohenloh Kirchberg, and his need of ready money by Christmas.'
oe1bu9454-224: 'Reports at length on General Schimmelpfennig''s terms for acquiring the Zagorow estates at 23000: he would bring in Seliz and Modkewo for 110000, Johnston''s Goła wies (6000 Rthl), and 66000 Rthl of East Prussian mortgage bonds al pari, with further sums in cash or Silesian bonds; his sons-in-law Rittmeister von Kotzow and v. Johnston are to inspect after the holidays with Lieut. Sommer. The rival sale to Weigel and Stössel has collapsed, as Rittmeister v. Stössel of Ruzynowice confirms. Urges speedy conclusion of the lawsuits, money being indispensable, and mentions an express courier to Öhringen summoning his son.'
oe1bu9454-226: Reports that the projected exchange-bargain with General Schimmelpfennig appears to have collapsed, no messenger, Sommer or the General having appeared, though all parties have been coached as instructed. Forwards, for return by the same messenger, a letter from Count v. Wartensleben, intimate friend of old Stössel, urging that only a letter in the Prince's own hand will bring Stössel and Weigel to accept satisfaction out of the Duchy of Warsaw estates. Resents the reproach over the lawsuits, recounting a year of unrewarded labour and personal distress. The Prefecture demands the original title-deeds of the Zagorow estates on pain of confiscation, and asks whether the Trąbczyn suit should proceed.
oe1bu9454-227: Forwards by mounted messenger Sub-Prefect von Brzechsta's offer to lease the Zagorow lordship for six years at 20,000–25,000 rl. annually, restoring the three demesne farms for 3000 Rthl and giving security on his estates, but demanding 10,000 Rthl compensation should the estates be sold. Urges acceptance rather than dealing with General von Schimmelpfennig, given impending war; lists urgent payments (Warsaw deliveries 1240 Rthl 8 gr., Invalids' Fund and Weigel 1250 Rthl each) and warns sequestration will resume if costs go unpaid. Notes the Olesnica and Wrąbczyn case, and the stormy close of the Warsaw Diet.
oe1bu9454-228: Reports on the outcome of a mission to General Schimmelpfennig v der Oye, who remains willing to exchange for the Zagorow estates but is no longer pressing. His illness confines him to his room, and the Berlin negotiations of his son, Rittmeister v Schimmelpfennig, with H. v Stägemann over the money for the payment out have only now improved through the Saxon envoy's mediation. With winter preventing the necessary inspection of the estates, the General asks that the matter be deferred until spring. Signed Sommer.
oe1bu9454-229: Birthday congratulations open a report that Attorney General Count Lipski, Tribunal President Smogorzewski and Tribunal Councillors Rembowski, Michalski and Sobocki thank the Prince for the gift of game, with effect expected on the imminent decision in the Olesnice and Wrąbczyn cases. Triebenfeld has concluded, sub spe rati, a lease of the Zagorow estates alone with sub-prefect Brzechsta at 20,000 Rthl, to be formally executed at Schlawenschitz on 8 February; interest is secured and the Bayonne capital will be amortised, though new taxes consume much ready money.
oe1bu9454-230: The Fürst complains that Triebenfeld has failed by twelve days to appear with H. v. Brzechsta as promised, and presses for a wholly definite answer before his son's imminent visit ends. General von Schimmelpfennig has renewed his interest in acquiring Zagorowo and will inspect it in early March; immediate pecuniary assistance is begged. Further sections, apparently from related drafts, demand the Trapergner deed of donation, a workable plan for the Zagorowo estates, and cooperation with the Lieutenant ahead of the royal debt-regulation Commission.
oe1bu9454-231: C. F. Weigel, writing from Breslau, reports a recent visit to Kalisch on his own business, where he had hoped but failed to meet his correspondent, and could not discover his present whereabouts. Wishing to confer about the outstanding affairs between himself and Prince v. Hohenlohe (possibly Johann), he asks that a day be appointed for a meeting at Kalisz or any other convenient place, and presses for an early and favourable reply.
oe1bu9454-232: Reports weeks of grave illness, an empty treasury and universal sequestration, with no money for a doctor or living costs; only 4 Rthl came in, passed to Herr Sommer, so the 300 Rthl for him cannot be found until Brzechsta's lease is active. Describes attempts to lease the propination rights separately, appeals to the King of Saxony, General Procurator Lipski and Justizrath Kuntzel, Count Kwilecki's intervention, and plans with Brzechsta to go to Warsaw over the Trąbczyner and Wrąbczyner matters. Requests a declaration authorising him to levy 4219 Rthl (principal 3125) on the interest of New and Old Swięcia, Wrąbczyn, Old Olesnica, Skokum, Sophienthal, Kopoyno and Adelow, and reports troop marches leaving people eating grass.
oe1bu9454-233: 'Proposes three schemes to extinguish some 90000 Rthl of debt: leasing Drzewce to v. Sobottendorff for 18 years at 2000 Rthl yearly (36000 Rthl) plus four vacated colonists'' holdings in Swixce at 1000 Rthl each for his sons, against return of the receipted bond; advising Weigel to lease Kopoyno with propination rights for nine years at 6000 Rthl; and having Prince August redeem the 50000 Rthl owed at the Invalids'' Fund. Notes delays in the Meierowitz suit and Cabanis''s accounting before Chomanowski.'
oe1bu9454-234: Reports on negotiations with Weigel, for whom an express messenger has been sent to Breslau; if the plan succeeds a debt of some 54,000 Rthl will be cleared and the estates free in nine or ten years, some 90,000-odd Rthl of debts discharged without loss of substance. The Invalids' Fund, owed some 9,000 Rthl arrears of interest, has laid arrest on everything; proposes that 50,000 Rthl from the Sacken bequest pay it off, with Prince August's and the King's intervention. Urges dispatch of the instrument, judicially attested or signed by two witnesses. Written from his bed.
oe1bu9454-235: Reports the messenger's two-day delay and his dispatch by another route, then that old Weigel has arrived, is willing to conclude the lease contract and, on Triebenfeld's advice, is not averse to buying the Zagorow estates, assuming the debts and paying a further 200000 Rthl to be set off against Koschentin. Weigel would bid as creditor at a compulsory auction, hoping to secure Koschentin for under 600000 Rthl and cede it back; secrecy from Stössel and others is urged, and the papers are wanted with all haste.
oe1bu9454-236: Reports that old Weigel has been at Blizanow and made over his whole business with the Prince, with offers judged advantageous; Weigel now wishes to buy rather than lease, so the lease contract has been deferred pending the Prince's sentiments and his standing with his children. Triebenfeld promises to travel to the Prince with Weigel once his health allows, reassures Herr v. Sobottendorff, presses urgently for the awaited papers and for the enclosed letter to the Prefect to be signed and returned by express, calls Honrichs a villain, and relays Cosmar's reported boast that no creditor of the Prince will ever be paid a Groschen.
oe1bu9454-237: Complains that a messenger, instead of forwarding an earlier letter by express to Schlawenschi via Amtman König, posted it at Pol Wartemberg. Must leave at once for Naumburg on the Saale, where his eldest son lies shot through both thighs, travelling via Dresden and returning there within twelve days; asks that the Prince's reply be addressed to Dresden and held at the post until called for personally. Once he has the letter to the Emperor, drawn up in Fieder's manner, he expects to recover Trąbczyn and Kaemen. Trzcinski, König, Zerboni and Meierowitz remain unseen and evasive; execution has been laid on Meierowitz alone; Radke cannot leave, 80000 Russians being nearby.
oe1bu9454-238: Complains of Triebenfeld's long silence and of lost correspondence — one letter posted by Koenige at Würtemberg probably burned with the post-house — and of the delays caused by Schenck detaining an express four days. Trzcinski and Zerboni have paid nothing, while Weigel presses hard; the Großen monies went on necessities. Encloses an open letter to the Russian Emperor for use as Triebenfeld sees fit, reports refusals from the King, State Chancellor and Minister of Justice over the creditors' composition at Brieg and a maintenance allowance, and hopes for money from Maierowitz and Ratke.
oe1bu9454-239: 'Reports his podagra delayed his journey to Neisse, forcing a night''s bivouac in the rain, though the foot now bears a boot. Political news: the King has just left for the Topliz region, where the Russian Emperor is with his sister; Kaiser Franz''s arrival is doubted and Austria is not acceding, neutrality being publicly posted. The armistice has duped the Combined Powers; Bülow and Czerniczeff objected but submitted. Napoleon has hurried to Paris. Mentions Gneizenau, Valentini, Ortel, Hardenberg, and letters delivered for Frau v. Hahn and v. Kleist.'
oe1bu9454-240: 'Political and military intelligence: Austria is certain to stay neutral and merely mediate; Russian troops and their generals curse the armistice and would fall back to the Vistula. Reports at length a quarrel before the Monarch between Lieutenant-General von Koch and Minister Hardenberg over rejoicing at the six-week armistice, the abandonment of Saxony and Prussian lands. Notes grain shortage, ruined roads and dead horses, Zastrow''s command of 55,000 Landwehr at Neiss, Ortell''s illness, and plans to travel via Neisse and Frankenstein to headquarters and Schwierin to raise produce and money.'
oe1bu9454-241: Reports meeting General Gneisenau at Neisse and delivering the Fürst's letter, with assurances of Gneisenau's regard and hopes of improvement; notes command changes — Zastrow appointed Governor-General in Prussia, Gneisenau commanding the Silesian Landwehr of 55,000 men while also Chief of the General Staff and Military Governor. Mentions General Koch's altered tone, Hardenberg's absence with the Emperor in Bohemia, demands for a categorical declaration, support for his plan for provisioning out of Poland despite fears of Russian requisition, Landwehr reviews of over 15,000 men, and his own gout.
oe1bu9454-242: 'Reports arrival in Vienna after a three-day journey, complaining of extreme dearness and the ragged paper money that ruins strangers; the Congress is postponed to 1 November, the sovereigns travelling to Ofen and Pest, and France opposes the Saxon and Polish acquisitions, though Hardenberg stands firm. Württemberg affairs go well, the King preparing a constitution; dealings with Gärtner, Goesch, B. and A. on the Schlaw: business; Koschentin, Külm, Kaehmin and Trąbczyn must await Poland''s fate, the Moscinska née Prusimska having powerful friends.'
oe1bu9454-243: 'An urgent appeal for a further 300 Rthl in gold within eight days, failing which Triebenfeld will leave Vienna on the 23rd. He itemises the ruinous cost of living: 400 Rthl exchanged (no Prussian Courant accepted) yielded 1200 fl. in Vienna redemption notes, of which 392 fl. are already spent; room, coffee, meals, wine, hired lackey and other charges come to some 45 fl. 30 x, reckoned at 50 fl. or 15 Rthl daily, with 260 fl. needed for the return journey and carriage repairs, leaving barely ten days'' money against five more weeks of business. He gives his lodging as the Golden Duck, Schulerstraße.'
oe1bu9454-244: 'Reports from the Congress: the great Vienna manoeuvre, regiments given to Grand Duke Constantin and others, the King of Wurtemberg driving in an eight-horse Oriental turn-out, and the King of Prussia toasting the soldiery from the balcony amid unprecedented Austro-Prussian cordiality. Notes the Estates'' deputation to Metternich seeking the Emperor as their head, talk of Saxony, and Bar. v. Hum.''s helpful exertions; promises the Prince quiet at Schlawenschitz and his enemy''s fall, under strict secrecy; asks about Hardenberg''s report on Cosmar, the Brieg Superior Provincial Court and annulling the 1811 settlement; awaits instructions. Holland''s Sovereign Prince takes the royal title.'
oe1bu9454-245: 'Petition to Prince State Chancellor v. Hardenberg on the Fürst zu Hohenlohe-Ingelfingen''s distress: the entailed Schlawenschitz, Lassowitz and Oppurg estates, confirmed as Fideicommiss in 1799 and worth over two million Rthl with 79500 revenue, are controlled by Cosmar as testamentary executor of the late Princess Sacken, who withholds accounts and over 43000 Rthl. Triebenfeld seeks annulment of the 1811 settlement, Cosmar''s exclusion, an honest administrator, a report from the Brieg Upper Provincial Court, and a 112000 Rthl advance to settle the Lutz heirs'' 426000 Rthl claim, offering 60000 security.'
oe1bu9454-246: 'Reports from Vienna on postal delays and Congress business: the monarchs have left for Hungary, the Congress will open on their return, Saxony is to pass wholly to Prussia, while Poland remains undecided, with Austria resisting and Talleyrand intriguing; a Thorn–Kalisz–Kempen line would leave Silesia and Prussia unconnected and indefensible. Notes his and Gärtner''s illness, hopes from the State Chancellor, delay in the Koschentiner affair, silence enjoined on the Trąbczyner estates until Poland''s fate is settled, Zerboni''s Red Eagle 3rd class, and the imperial estates'' deputation to Emperor Franz; encloses a memorial and Gärtner''s brochure.'
oe1bu9454-247: Reports from Vienna that Palen's case is settled favourably, that Privy Councillor Goerch has petitioned on behalf of the whole House of Hohenlohe (copy enclosed), and that Minister von Stumbolt promises support. Argues at length that Cosmar forged the Transact in fraudem tertii, extorting the dying old Princess's mark, and that his guardianship and the late Princess Sacken's claims on the entail must lapse; the Courland heirs could be satisfied with 112000 Rthl, other creditors with 12000 Rthl yearly. Notes the departure of the two Emperors and the King, and appends a damaged revenue and payments schedule totalling 79462 Rthl.
oe1bu9454-248: Reports from Vienna that the Prince State Chancellor and Minister Baron v Humboldt are pressing the Prince's claims, Humboldt having demanded copies of all submissions; the King refuses to settle "nach keiner retour", raising hopes of annulling the settlement, gaining 314000 Rthl, advancing 112000 Rthl and recovering nine years' salary. Count Winzingerode's petition for Prince August's 10000 Rthl from Schlawenschitz and Lasswitz is countered by the 1799 deed. Adds rumours of French troops and the Monarchs' departure.
oe1bu9454-249: Acknowledges receipt of two princely letters and reports relief of his own straitened circumstances; Court Councillor Hahn's paper cannot be added to the petition, which already lies before His Majesty. Urges the swift remittance of 12000 Rthl to conclude with the recently empowered agents, the 10000 Rthl to follow at Berlin; cites the goodwill of the Prince Chancellor and Baron von Humbolt. Notes Poland's fate settled, the mediatised princes' prospects, a secret Metternich–Wrede–Wessenberg conference, the monarchs' projected journey to Grätz and Triest, and a power of attorney from Privy Councillor Göschet, to be drawn up naming von Gärtner instead.
oe1bu9454-250: Humboldt, writing from Vienna and enclosed with Triebenfeld's letter of 17 November, acknowledges Triebenfeld's letter of the 3rd and confirms he has learned of the memorial submitted to Prince von Hardenberg. He returns a copy of the memorial and promises to take up its contents so far as his own sphere of action permits, closing with assurances of esteem.
oe1bu9454-251: 'Copy of an appeal, transmitting a further legal opinion drawn from the records and pleading the Prince''s cause against Cosmar''s obstruction: if Your Serene Highness will merely give written hope that 112,000 Rthl for the settlement with the L. heirs be advanced, however not in cash, the compromise with the Mandatarii can be concluded at once, the Transact and codicil fall away, the guarantee and the 35,000 Rthl advanced in 1790 return, and the Crown avoids a loss of 461,000 Rthl. Delay is dangerous; the Prince is some 66 years old and worn down.'
oe1bu9454-252: 'Reply from Hardenberg in Vienna to the Councillor of War von Triebenfeld''s petition of the 25th of the previous month: the Prince of Hohenlohe''s affair concerning the claims upon Trąbczyn and Kaemen will resolve itself of its own accord once the general partition and agreement now under negotiation over the Duchy of Warsaw is carried into effect. A brief official note, offering no further action or undertaking in the meantime.'
oe1bu9454-253: Reports delivering Court Councillor Hahn's second opinion to the Prince State Chancellor, who found nothing new but welcomed the agreement of views; the Duchess of Sagan seeks the King's leave to raise money on Sagan, assigning the King's debt to her — precisely the sum guaranteed for Prince Hohenlohe — and the King has again deferred until his return. Triebenfeld works to secure written authority to conclude with the Courland mandatories, encloses a reply on Trąbczyn and Kaemen, and relays the King of Würtemberg's threats to quit Vienna and unrest in Würtemberg and Baden.
oe1bu9454-254: 'Complains of long silence and want of funds while lobbying in Vienna, where the Prince Chancellor is inaccessible and the attendants who really decide must be entertained nightly at 20–30 Rthl; he asked 1400 Rthl for four or five weeks but has had only 640, owes Barbe 94 ducats, and demands 100 ducats more. Lists six benefits promised: recovery of the Polish estates, shedding Leixner and Meyer Bernhard, discharge of the Curish debt of 461000 Rthl, and release from the Koschentin bonds. Enclosed receipts for monies from Referendarius Bally; begs 200 Rthl for his starving children; asks letters be sent via Chief Post Director Mann in Vienna and the Koschentin sale kept secret from creditors.'
oe1bu9454-255: Reports from Vienna that State Chancellor Hardenberg has kept to his room and bed for five days, and fears the Prince's business would be left half finished; Hardenberg has drafted the submissions himself and clearly means to help, Minister Humboldt hints the game is already won, and Court Councillor Hahn's opinion supports Triebenfeld's account. Military affairs are deferred to Berlin. All now depends on ending the Curian matter, overthrowing Cosmar, and securing possession of the entailed estate. Notes the courts' removal to Berlin on the 10th, and announces his own arrival on the 11th.
oe1bu9454-256: Reports from Vienna that the Allies' expected departure on the 8th-10th has given way to a further four to six weeks, so nothing can yet be settled on the Polish estates, though the State Chancellor remains favourably disposed; Privy Councillor of State Stägemann, whom Triebenfeld distrusts as a friend of Zerboni and Cosmar, is to report, and orders go to Ministers v. Kircheisen and v. Bulow for a commission on Commer's conduct. The composition with the Carisch heirs and the 112000 Rthl advance remain unresolved. Begs urgently for money, proofs, Blanquette and the incomplete 1811 settlement, and for support of his children in Breslau.
oe1bu9454-257: A short note from Gruemann, replying to a representation of the 23rd, which had asserted that the Prince of Hohenlohe undertook in the Settlement of 1811 to pay the capital of some 500,000 owed to the Courland heirs himself and to release the Lady Countess from her joint liability. Unable to locate the passage in the enclosed Settlement, he asks that it be marked in red chalk and returned by the bearer.
oe1bu9454-258: 'Following earlier representations of 23 October and 28 November, protests that Privy Councillor of State Stägemann has only now revealed the Carz debt matter is to go before a Commission in Berlin. Urges instead his own proposal: the Cur./Kurz heirs (the Duchess of Sagan and others) would surrender the documents for 112,000 Rthl against a debt of 426,000, the Prince paying by yearly instalments of 25,000 plus the 35,000 Rthl drawn in 1790 from the Breslau Treasury, gaining the State 46,000 Rthl; offers 60,000 Rthl security, warns against consulting Count Wratislaw, and asks for an audience.'
oe1bu9454-259: Reports that Hardenberg has ordered the Brieg court to investigate the Prince's affair with the utmost dispatch and to report briefly, sparing it the delays of Berlin, and that the Chancellor is having the 42000 rt. paid. Urges the Prince to declare everything freely before the Commissarius at Brieg or Schlawenschitz, to prove the settlements fraudulent and the debts fictitious, to expose Cosmar's forgeries and the coerced acknowledgement of 300000 Rthl. extracted at Öhringen, and to act only on Court Councillor Hahn's advice.
oe1bu9454-260: Reports having forwarded, via Neisse and express courier, the Resolution obtained from Prince State Chancellor Hardenberg and the order to the Brieg Superior Provincial Court, and urges the Prince to have Court Councillor Hahn frame the declaration on seven heads against Cosmar and the elder Princes — fictitious settlement sums, the stolen power of attorney, the son's revolt — so the settlements and codicil conflicting with the 1799 Senate instrument be annulled and the 112000 capital treated per the Triebenfeld plans; asks for a copy, blank forms, a letter of thanks to Hardenberg, and 300 Rthl in gold, only 118 f remaining.
oe1bu9454-261: Reports firm assurances in Vienna that the Polish estates will be restored, with a compensation calculation ready for the Trąbczyner estates only; damages for Kaemen he leaves to Leixner, wishing the Prince to remain ex nexu, and raises doubt over what is registered on Kaemen and the Cujawsch district. Everything now hangs on the Prince's declaration and the Brieg Higher Regional Court's report matching his own submission, which would yield 112000 Rthl for the Curisch parties and oust Cosmar. Urges reliance on Hahn and Eberhardt, encloses a power-of-attorney formulary for Privy Councillor v. Göschel, and complains of being 50 ducats in debt.
oe1bu9454-262: Reports Hardenberg's remark to Prince H. of Bartenstein that Hohenlohe is the worst-treated of men and that he now champions his cause; urges an autograph letter of thanks and a declaration confirming Triebenfeld's Memoirs, lest he be compromised with Hahn, so the Curl heirs may be paid, the settlements annulled and Cosmar cast out. Asks for advance copies of the Commission and Ober Landes Gericht reports, blank forms, and 100 ducats, pleading hunger and 50 ducats borrowed. Suggests Meyer's French claims (240000 Livres from Pr. Artois) be pressed via Humboldt under §19 of the Peace of Paris.
oe1bu9454-263: Reports the King of Württemberg's abrupt incognito departure from Vienna as Count v Teck, with anecdotes of his 4000 ducats distributed among Imperial servants and gifts to Casperle actresses; the Crown Prince, Winzingerode and Linden remain for the Congress, and Göschel submits a further note in the Prince's name. Welcomes the powers of attorney given to Hahn and Lombardini for Brieg, but warns the Prince Chancellor requires the Fürst's personal examination at Brieg or by a Commissarius at Schlawenschitz. Polish matters await the Congress's close.
oe1bu9454-264: 'Urges absolute secrecy over the Köschentin affair: royal policy now forbids exchange or purchase of estates because of the Bayonne sums, and Court Councillor Barbe reacted with outrage to the proposed 30000 Rthl present for Prince Hard: and the Weigel/Stössel arrangement, threatening Triebenfeld with the dungeon until shown the Prince''s signed instruction. Reports instead that the wealthy Count Pourtales may buy Koschentin, Boronow and Cieschow for cash, and requests a signed undertaking, drafted in full, promising 30000 Rthl on conclusion of that contract.'
oe1bu9454-265a: Written from Schlawenschitz to a Privy Councillor of State, thanking him for steering the writer's affairs and for rescue from Cosmar's hands, and citing the Brieg High Provincial Court's report as confirming what von Triebenfeld and Court Councillor Hater have represented. Everything now hinges on an advance of some 112,000 Rthl to satisfy the Burisch heirs, which would free the King ex nexu, return the guaranteed 300,000 Rthl bond, and yield 461,000 Rthl in place of the old 35,000 Rthl debt; repayment, it is argued, needs no six-year term, since Cosmar holds sums of about 60,000, 100,000 and 48,000 Rthl.
oe1bu9454-265b: Petition to a general seeking intercession with the Russian Emperor over the Kaemener and Trąbczyner estates, confiscated from Prussiemski and granted by the late King in 1796, but seized by the Warsaw administrative Commission in 1807, fourteen weeks after the Peace of Tilsit, and restored to Prussiemski's daughter, now Miączyńska. The Kalisch Tribunal declined jurisdiction; Hardenberg advised awaiting Pahlen's affairs. With the Prosna to form the new boundary, restitution of Trąbczyn plus eight years' revenues is requested, and a hearing for Triebenfeld.
oe1bu9454-266: Reports fierce debates at Vienna over Poland, one party demanding the Prosna as frontier from Thorn to its fall into the Wartha, which would place the Trąbczyner and his own Blizanower estates under Russian sovereignty; the Prince Chancellor opposes this and has taken to his bed, while the King dines alone and rumours of war circulate from Vienna and Berlin. Urges dispatch of the O L Court report, blank powers of attorney and the written undertaking to Barbe, gives a three-cover postal route via Breslau, Dresden and Post Director Balke, and pleads for 100 ducats to repay Barbe plus 200 more, complaining of hunger and neglect.
oe1bu9454-267: 'Complains that nothing has arrived since the Prince''s letter of 17 December, received on the 21st: no letter to the Prince Chancellor, no blank forms, no power of attorney for Privy Councillor v. Goeschel, no written undertaking concerning Koschentin, and no money, B being unable to advance more. Awaits news from Brieg; Hungern grows sceptical. Reports Congress affairs: England''s peace with America, Russia''s pressure over Poland, Prince Bertenstein Stetten''s 400,000 francs from the French King, Hardenberg''s recovery.'
oe1bu9454-268: Acknowledges receipt of enclosures and 1125 fl. in paper money, delivery of letters to the Emperor and the Prince State Chancellor, and further letters written to General v. Schöler and Privy Councillor Stägemann; awaits the Brieg report and Count v. Pourtales's answer, and hopes Cosmar's dismissal and surrender of the 112000 Rthl will collapse the 1811 settlement. Fears the Trąbczyn lands will fall to Russia, reports war talk and gloom at the Congress, Köckritz's discharge, and Hahn's news that officials return barely half the entailed revenues. A postscript begs for 200 ducats to cover 926 fl. of clothing and Hardenberg's 100-ducat loan.
oe1bu9454-269: Reports that his memorandum with the v. Kircheisen correspondence, delivered to the State Chancellor Hardenberg by Court Councillor B[ß], was graciously received and now rests with Privy Councillor of State Stägemann; B. thinks Cosmar's fall and the loan as good as settled. Voices alarm over Trąbczyn should the district pass to Russia, lacking permission to approach Russian authorities, though Hardenberg promises indemnification. Notes Constantine's exactions in Poland, talk of war, sovereigns leaving Vienna, and awaits Count Pourtales's answer.
oe1bu9454-269a: Copy of a petition, on the commission of the Prince of Hohenlohe, forwarding the correspondence with M. v. Kircheisen which the Q. L. Court refused to protocol, and medical councillor Cosmar's letter of 22 June 1810, cited as proof that Cosmar has arrested the Prince's whole property over the Kurz heirs' claim of 300000 Rthl. Triebenfeld urges that the heirs be satisfied with 112000 Rthl — 12000 in cash, 100000 by secure order — the entailed estates be administered for the treasury, and Prince August's annual 18000 Rthl applied to clear the debt.
oe1bu9454-270: 'Reports from the Congress that even Kalisz will fall to Russia, and that recovery of the Traperin looks hopeless: the Emperor is unlikely to overturn the Chief Administration Commission and may compensate the Prince otherwise, while Prince St.K. forbids any démarche. Notes Moszynski''s and Count Landskoy''s friendship, Wellington''s arrival as Ambassadeur Extraordinair, Metternich and Talleyrand''s intrigues, talk of restoring the King of Saxony with a 1,200,000 Rthl appanage, and, at home, delays with Stägemann and Cosmar''s attachment on the entailed estates.'
oe1bu9454-271: Reports from the Congress that the Polish frontier has been settled from Thorn by Slupce near Peisern across the Wartha and down the Prosna, and Saxony's border fixed, the King keeping Dresden, Leipzig and Bautzen; England now demands East Friesland and Alexander presses land for the Viceroy of Italy. Triebenfeld keeps pressing the Prince Chancellor and Stägemann; the 112000 Rthl advance is thought secure, and Prince August should revoke Cosmar's power of attorney.
oe1bu9454-272: Encloses the drafted reply to Prince August, noting that withdrawal of the power of attorney follows from the Vienna resolutions, and warns of fresh blunders at Öhringen that only a personal journey could avert; requests a secret instruction and power of attorney for that extremity, and a note in the Prince's own hand about travel money. Goldstücker will be pacified over the bill of exchange. Blames Mr. v. Braun, no match for Cosmar and condemned by Princess Emilie, and proposes inspecting the estates to establish their true income and a fund for building costs, so their means no longer benefit a Berlin advocate.
oe1bu9454-273: 'Answers point by point three coldly worded letters, defending his honour: General Schüler and Count Nesselrode will not act, leaving only the State Chancellor and Minister Humboldt, for which he asks two French blank sheets to petition the Emperor; explains the contradiction between the Fürst''s figure of 79000 Rthl revenue and the officials'' 36000, Hofrath Hahn valuing the estates at 2 millions with 60000 yield; discusses the 112000 Rthl advance, the Curish heirs and the Cosmarian declaration, denies secret dealings, asks to be replaced, and names Hahn as administrator.'
oe1bu9454-274: 'Reports from Vienna that the King of Würtemberg has restored the Estates and summoned a Diet for 15 March while forbidding any reduction of the taxes raised by 50 per cent; the Estates, including old Metternich, have protested to the Congress. B: and Göschel urge that Prince August be warned to concede nothing; notes Göschel''s lack of access to the Prince Chancellor and v. Gärtner''s illness. Also the King of Saxony''s summons to Brünn, Heßendarmstadt''s compliance, East Friesland to England and Swedish Pomerania to Prussia, hopes that the 112000 Rthl advance will now be approved, anxiety over the Trąbczyner vindication and General Amstetten''s commission, and von Bülow''s illness.'
oe1bu9454-275: 'Reports from Vienna that Councillor of State Stägemann has still drafted no contract for the Prince State Chancellor, despite repeated reminders, which Triebenfeld now ascribes to ill will; the Brieg report nonetheless favours the Prince, though Cosmar and fears of Bar: and Beng: complicate matters. Assurances of the Chancellor''s goodwill towards all Hohenlohe houses, with a further step taken towards the King of Würtemberg. Confined to bed, he cannot recover the Trąbczyn, Kulm and Kaemen files from the unpaid translator, and begs for money and the blank forms.'
oe1bu9454-276: Reports on enquiries made for Minister v. Humboldt through Justice Commissioner Eberhard at Brieg, whose enclosed letter he suspects betrays a treachery originating in Brieg, since nothing has been ordered and the matter still rests unreported with Privy Councillor of State Stägemann. Fürst Hardenberg has again promised help, with Fürst Bartenstein to remind him. Urges that Eberhard be sent to Vienna to settle with the Princesses; insists on the 112000 Rthl advance. Notes the King's reply as a political formula drafted by Humboldt, the King of Saxony's refusal at Preßburg, imperial travel plans, and the Polish estates submission awaiting money for translations.
oe1bu9454-277: Acknowledges receipt by courier of an instruction to pay 200 M, three French Blanquette and various letters, but pleads weakness and headache and defers a fuller reply. Renews the request that Eberhard and Hahn come to Vienna; reports Stägemann still without audience, the high estates' affair handed on with its documents, a letter written to Zerboni on Beugelin's advice, and Cosmar's ruin. Notes warnings from Bastenstein, Göschel and Wintzingerode against August's power of attorney, Pourtalès's silence amid the Neuchâtel deputations, Napoleon's landing at Antibes and march on Toulon, Masséna's discontent, Murat, and the King of Saxony's refusal to sign; encloses papers on the King of Würtemberg and the Hohenlohe.
oe1bu9454-278: 'Copy of a letter from Eberhard at Brieg, reporting that Triebenfeld urges him to come to Vienna, where the presence of the Curian (Cuheian) heirs and the three Princesses offers the only chance of a settlement, given the Ministry''s dilatory resolutions. He cites three obstacles: the general mandatories'' instruction not to interfere, want of money, and the need of a pass from the Minister of Justice and State Chancellor. He begs the Prince to raise 500–600 Rthl for travel costs, stressing the incalculable damage otherwise, and awaits Triebenfeld''s decisive answer.'
oe1bu9454-279: Urges a genuine settlement with the Curian heiresses, on which the Prince State Chancellor will make the advance and start the administration depend; awaits J. C. Eberhardt impatiently and reports letters to Langenburg and Kirchberg, Prince August's recall of the power of attorney, and Cosmar's exposure. A resolution on the Polish estates is again promised, pending decisions on lands taken from the donataries after the Peace of Tilsit. Extensive news of Napoleon's advance from Elba, his outlawry, and Marie Louise's distress; the sovereigns are to leave Vienna in a fortnight. Written while ill.
oe1bu9454-280: Regrets that Eberhard will not come to Vienna and that no settlement has been reached with the Burisch heiresses, fearing Cosmar and Stägemann will exploit this to delay; urges Eberhard's despatch to secure the Princesses' declaration and the State Chancellor's approval of an advance. Notes the entail clause on Adolph's majority, Prince August's unrevoked power of attorney, sums of 18000 and 100000 Rthl, the Prince Chancellor's unhelpful reply on the Polish estates, and Napoleon's advance on Paris, Wellington's departure and Talleyrand's clash with Emperor Alexander.
oe1bu9454-281: Requests a wicker wagon with ticking half-cover for Stock, servant of Court Councillor Barbi, sent with Triebenfeld's three horses to fetch Barbi's sister to Berlin, plus a two-horse conveyance to collect crates of glass at Prague for the Hardenberg privy councillors Barbe, Heym and Philippsborn and carry them to Schlawenschitz. Reports Stägemann's continued silence, suspected intrigue, Eberhard's absence blocking settlement with the Curish heiresses even at 50-100,000 Rthl more, unsettled Pourtales and Köhl affairs, possible compensation estates in Silesia, Würtemberg's constitution, and intercepted letters to Bonaparte.
oe1bu9454-282: 'Replies hurriedly to two letters of the 18th with Eberhardt''s enclosure: without a compromise with the "short princesses" nothing can be done, the Prince Chancellor having been misled that the Weilers would settle, and delay may cost the ladies 300000 Rthl. Urges Eberhard''s journey to Vienna, though no passport or money can be obtained there. Reports Prince August''s acceptance of the presidency others declined, the Congress''s rebuff to the King of Würtemberg, orders that 100000 Rthl be paid in cash, transport arrangements for Barbe''s servant, glass from Prag and Blizanow, and Napoleon''s advance on Paris.'
oe1bu9454-283: Undertakes, at the Fürst's request, to hand the enclosed letter to the Prince Chancellor of State (Hardenberg) without delay and to put the Fürst's wishes before him personally, professing that his own intervention can add nothing to a letter from the Fürst and hoping to serve as the Chancellor's instrument in satisfying them. Notes that he made Mr. de Triebenfeld's acquaintance only at Vienna, having been previously unknown to him.
oe1bu9454-284: 'War''s outbreak stalls everything: the Kohlen are to retain estates restored by the Sequestration Commission, Allexander having secured a signature, so Triebenfeld now petitions Emperor and King for indemnification, itemising Broniewski''s pledge-money of 60000 Rthl with 33000 interest, Kaemen valued at 180000, and Trąbczyn at 316000 less debts for Lichnowski, Grotowski and Seher Thos, claiming 366000 in debt-free estates plus 93000 cash. Pourtales silent, Alegemann inactive; reports on Napoleon in Paris, Murat, Württemberg''s scandal, dearness in Vienna, and a request for Blanquettes and Eberhard.'
oe1bu9454-285: 'Pro Memoria tallying the Prince''s claims: the Kaemen estates, granted him in 1796 after Anton v. Prussiemski but pledged to Broniewski for over 100000 Rthl, cost more than 6000 Rthl in a lawsuit lost in two instances and 55000 Rthl paid in compromise in 1804, with interest to 1815 of 33550 Rthl and 4164 Rthl in Senate treasury fees; against a judicial valuation of 180000 Rthl. Trąbczyn, assessed at 316000, carries debts to Lichnowski, Weigel, Grotowski, Seeher Thoch and v. Zerboni of 138000, of which 60000 is repaid. Totals: 94550 Rthl due from the née Prusimska and 367164 Rthl from the Sovereigns.'
oe1bu9454-286: 'Alarmed reporting from Vienna on Napoleon''s return: he stands almost at the Rhine with over 200,000 men, Ney moves toward Switzerland, Russian troops pass Prague on 7 April, Wellington has only just left, and Prussia risks fighting alone; Poland rejoices at Napoleon. Hardenberg promises much, Stägemann obstructs, General Amstetten favours indemnification in estates. Encloses a Pro Memoria costing the Kaemen and Trąbczyn claims (Prussiemski, Broniewski, Chełmski, Leixner) at 390,100 Rthl, and asks about Eberhardt, blank forms and Beugelin.'
oe1bu9454-287: Complains that the Prince's letter of 3 April reached him unsealed through Post Director Mann, who certainly read it. Approves P. Adolph's resolve to serve and undertakes, before the King's departure (said to be the 18th), to ask him where Adolph should join and what uniform to make, expecting a place in the Guard. Reports Hardenberg's activity, Beugelin's use of Lombardini's letter with the Chancellor, and refusal to show the threatening letter of the two Hahns; Pourtales still absent. Gives the allies' troop quotas totalling 1,307,000 men against outlawed Bonaparte, the Hortenau–Eugen intercept sent by the King of Würtemberg, and Prince Rodecurii's and Zerboni's journey to Posen for the homage amid renewed Polish agitation.
oe1bu9454-288: Urges that Prince Adolph reach Vienna by the 22nd, before the King departs, to profit from the Prince Chancellor's promised recommendation and to press Cosmar's knavery in his ear; demands Cosmar be made to deposit monies with the Bromberg Superior Provincial Court, surrender the Executoria and submit to a Chief Overseer, complaining of five months' delay and Stägemann's inaction. On Trąbczyn he has applied to Minister von Stein, urging a French letter for the Emperor, rejects Otto's tableau valuing Szetlewek at 160,000 Rthl against 760,000 in debts, and cites Blomberg and zur Höllen's estimate of 316,000 Rthl as the basis for compensation; proposes the offices of Sokolnick and Klunowo. Reports warlike rumours, fighting in Italy, and Lucian Bonaparte's arrival in Paris.
oe1bu9454-289: Appeals to Cabinet Councillor Albrecht for a categorical royal decision on the Churisch heirs' claim of 300000 Rthl, now 426000 Rthl with interest, acknowledged by the late King in person and served by interest payments to 1806. The heirs, encouraged by fresh royal assurances in Vienna, have broken off a compromise settling at circa 112000 Rthl; Triebenfeld asks either payment with removal of Cosmar's unaccountable administration of the entailed estates, or disclaimer, and an advance repayable within four years, citing the Brieg Superior Provincial Court's confirming report.
oe1bu9454-290: Reports that after seven months Cosmar is finally ordered to pay the three years' withheld monies into the Brieg High Provincial Court, of which 12000 Rthl yearly is assigned to creditors; complains that Stägemann obstructs matters as defender of Cosmar and adviser of the Curian heiresses, that the Prince Chancellor promises but does nothing, while Minister Stein pursues compensation through the office of Sokolnick. Promises a Pro Memoria on the kurz affair and the military salary, recounts Adolph's awkward conduct before the King, and urgently requests 100 ducats by express courier.
oe1bu9454-291: Reports the Cabinet Order of 27 April, sent to Kircheisen, commanding prompt payment of the 100000 Rthl to Prince August, notified to him on 6 May. The compensation for the Polish estates, worth 300000 Rthl, is settled through Minister Humboldt but awaits the Emperor, despite efforts by Stein, Woronzow and Nesselrode; Stein threatens to pursue it at Heilbronn. Cosmar is ordered to deposit the monies on pain of arrest; the military affair remains withheld by the Prince Chancellor. Notes the King's departure, Koppe's Hanoverian appointment, and requests money.
oe1bu9454-292: Reports from Vienna on the indemnification claim, now before the Emperor, with promises of support from Minister von Stein and written assurance expected from Prince Hardenberg. Recounts a heated conference in which Stägemann defended Cosmar and dismissed the old Prince's complaints, against Triebenfeld's demand that Cosmar deposit the sums fixed by the 1799 deed and 1811 settlement at the Oberlandesgericht in Brieg. Notes Prince August's 100,000 Rthl secured by Cabinet Order, rumours of Cosmar's denunciation over Curland family moneys, and proposes meeting the Chancellor at Neisse.
oe1bu9454-294: Reports on negotiations in Vienna with the Duchess of Sagan over her claim of 30000 Rthl, or 100000 ducats in gold. So long as she believes the King will pay the sum himself, nothing can be done; once told from higher quarters that His Majesty pays nothing, she is expected to settle willingly on the offered 150000 Rthl, subject to ratification. She has asked for repeated visits and goes to Baden to take the baths. Signed Bisenti.
oe1bu9454-295: 'Reports the failure of his journey: the Russian Emperor had passed through Kalisz the night before his arrival and returned to his own dominions. From Espagne, Chief Postal Director at Posen, he learned the Prince Chancellor remains in Paris and will not reach Berlin for three weeks, and that Barbe lies ill of a nervous fever. He is investigating the Betscher affair, doubts Zerboni''s promised report to the Chancellor since the files went to Schenck, plans to press his tenant at Blizanow for money before hastening to Berlin, and notes Minister Stein''s disgrace and rumours about Prince Radziwill and Biron.'
oe1bu9454-296: 'A short, damaged note from Grewen[z] in Berlin, forwarding papers and two original enclosures: reports the death in Paris of Court Councillor Bar[?]bey, whose widow he intends to question further; the awaited Chancellor of State has now arrived; Philippischen is said to be dangerously ill at Stachen, which the writer laments; and Cosmar has been found guilty at first instance of a dishonest proceeding but has appealed, with his guardianship at stake. Sympathy is offered for the recipient''s own illness.'
oe1bu9454-297: Written from his sickbed at Blizanow after gout and haemorrhoidal colic nearly killed him, Triebenfeld reports the deaths of his daughter in childbed and of the drunken Trzcinski, Zerboni's delayed report, and costs of 247 Rthl for the Betsche journey, 70 Rthl for medicines and 22 ducats for extracted papers. He hopes to force satisfaction for Pally and Lombardini, presses Eichaust's and sub-prefect Kurnatowski's forest devastation of 170000 Rthl, expects nothing from Kulm and Kaemen, and refuses Assessor Schenck a general power of attorney.
oe1bu9454-298: Reports his messenger detained three days by Madame Schenck, and some 7 Rthl paid in charges on long-delayed letters, including the Fürst's letter with the copy of the Zerbonian letter. Still bedridden, unable to walk or stand. Dismisses Zerboni's objections, trusting the Vienna Treaty's promised indemnification, and notes Bvidlang replacing Barbe and his link to Herr v. Humboldt. Asks that letters at the Strehlitz post office be forwarded by express before 15 January, and that wild boar and venison from Sansenberg be delivered to the leaseholder Faust at Gostyszyn near Kalisz to evade Polish customs. Prussian money cried down at Kalisz, the thaler at 20 gg, 2 gg pieces refused.
oe1bu9454-299: Recovering from illness but still too weak to travel, Triebenfeld reports settling his Kohlen affairs (62000 Rthl remaining, Schenck having leased the estates badly to a Jew) and plans to go via Betsche to Berlin, where Emperor Alexander is expected in late April. He sets out terms for annulling the Betsche contract with the insolvent burghers and peasants pleading laesio — forfeited earnest-money, 2000 Rthl to end the sequestration, 11000 Rthl canon arrears — and reckons 99000 Rthl still recoverable if Leixner in Miedzeritz can be brought to transfer the 72000 and 65000 Rthl charges to Kaemen. Also mentions Zerboni, Humboldt's indemnification business, Major Trzcinski's debt, and forest devastation enquiries.
oe1bu9454-300: 'Damaged and lacunose report noting that a valuation has been delivered at Gosztiszyn, to be fetched and used. At length recounts the quarrel over the opinion on the organisation of the Grand Duchy of Posen: Zerboni, drafting it with his secretary Schmidt, was refused co-signature by Prince Radziwill and disparaged him, whereupon Radziwill complained to the King and Zerboni was sent to Stettin. Adds rumours from Petersburg of the Senate rejecting the Polish constitution, and plans travel to Betsche and Sterbui for the indemnification business.'
oe1bu9454-301: Acknowledges the Prince's letter of the 26th, delivered by Lombardini, whose arrival relieved fears for the earlier messenger, and offers birthday congratulations and wishes for freedom from gout. Refers the Prince to his recent successive letters for news of affairs, promising Lombardini will report on proofs. Awaits his son and a tenant for Schweinern before travelling to Posen and Betsche; hopes for a favourable indemnification outcome having won over von Smiedecki at Kalisz; asks for game, the last consignment having spoiled.
oe1bu9454-302: 'Reports negotiations with justice-burgomaster Hawich of Zagorowo, now a Ducal Warsaw notarius publicus, and Chief Inspector Hecker, and lists thirteen powers of attorney taken down judicially by justice-burgomaster Schenk of Neusatz: instruction of the Döbske over the Trąbczyn estates; full lifting of the sequestration under the King of Saxony''s three-year indult; collection of interest for creditors holding judgments; suit against the Jews Oppenheimer et Wolf in Kalisz to cancel entries of over 72000 Rthl; removal of the sequestrator Honrichs and annulment of his sales; recovery of purchase arrears, 32000 Rthl from Olesnica leaseholders and over 10000 Rthl from the Niedzewiecki heirs; boundary suits; representation at the Warsaw Diet; and recovery of interest advanced to the Invalids'' Fund towards the Larisch sum, Triebenfeld citing his 250000 Rtl bonds as priority.'
oe1bu9454-303: A numbered extract from the Princely Hohenlohe liquidation protocols listing 142 creditors and their claims, in gold and Courant Reichsthaler, totalling 17,874 Rthl gold and 1,414,377 Rthl 7 g 11 d Courant. Creditors range from tradesmen and household servants — the saddler Gleisberger at Potsdam, the joiner Schick, the gardener Nickel — to bankers, Breslau and Frankfurt merchants and noble heirs. The largest entries include Herr Carl v. Stössel (191,000 Rthl), Goldstücker (170,000), the Stössel curator (169,400), Hein in Breslau (165,000), Frau Charlotte von Triebenfeld (112,000), Koppan (80,000) and Barnheim in Berlin (76,791).

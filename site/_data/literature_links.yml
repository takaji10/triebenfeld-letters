app53640kalisztab21-1:
- de: 'Chodyła (2015) zählt nach dem Register der Herdsteuer der Woiwodschaft Kalisch für die Johannisrate 1789 (Kalisz Tab.21, Bl. 20) 3 Herdstellen in Łazy, 10 für die „Olędry Trąbczyńskie“ und 13 in Nowa Wieś. Das Register der Edition gibt Geldsummen, keine Herdstellen: Trąpczyn 80 Złoty, Łazy 12 Złoty 15 Groschen, Nowa Wieś 12 Złoty 15 Groschen, „Olendry Trąbczynskie“ 35 Złoty. Die Herdstellen sind eine Rechnung des Buches und folgen nicht aus einem Satz: bei 2 Złoty 15 Groschen je Herdstelle, dem Satz dieser Blätter, ergeben die Summen 32 Herdstellen in Trąbczyn, je 5 in Łazy und Nowa Wieś und 14 für die Olędry (eine Rechnung, nicht im Register). Die Edition gibt die Summen, wie das Register sie hat.'
  en: 'Chodyła (2015) counts, from the register of the hearth tax of the Kalisz voivodeship for the Midsummer instalment of 1789 (Kalisz Tab.21, fol. 20), 3 hearths at Łazy, 10 for the "Olędry Trąbczyńskie" and 13 at Nowa Wieś. The register in the edition gives sums of money, not hearths: Trąpczyn 80 zł, Łazy 12 zł 15 gr, Nowa Wieś 12 zł 15 gr, "Olendry Trąbczynskie" 35 zł. The hearths are the book''s reckoning and do not follow from one rate: at 2 zł 15 gr a hearth, the rate of these leaves, the sums give 32 hearths at Trąbczyn, 5 each at Łazy and Nowa Wieś and 14 for the Olędry (a calculation, not in the register). The edition gives the sums as the register has them.'
  id: chodyla2015-hearthtax-1789

- de: 'Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, der Sejm von 1773-1775 habe mehrere Kommissionen zur Entscheidung von Streitigkeiten über Antoni Prusimskis Güter eingesetzt, darunter über Trąbczyn. Die Edition hat das Dekret der Kommission für Trąbczyn: durch eine am 1. Juni 1774 in Warschau eingetragene Konstitution des Sejm eingesetzt, um die Grenze zwischen Trąbczyn und dem Łukomia der Chełmski zu entscheiden, tagte sie im September 1775 auf dem strittigen Grund und befand Prusimskis Grenzlinie für die bessere.'
  en: 'The Polski Słownik Biograficzny (Pachoński, 1982) says that the Sejm of 1773-1775 appointed several commissions to settle disputes over Antoni Prusimski''s estates, Trąbczyn among them. The edition has the decree of the commission for Trąbczyn: appointed by an act of the Sejm recorded at Warsaw on 1 June 1774 to decide the boundary between Trąbczyn and the Chełmskis'' Łukomia, it sat on the disputed ground in September 1775 and found Prusimski''s boundary line the better.'
  id: pachonski1982-commission

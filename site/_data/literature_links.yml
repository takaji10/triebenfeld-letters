- de: 'Chodyła (2015) zitiert die Besichtigung des Gutes Trąbczyn, 1754 auf Antrag Katarzyna Prusimskas vorgenommen (Konin Gr.136): fünfzehn Olęder, die sechzehnte Hufe leer, die einen gut gebaut, die anderen nur mit Erdhütten, und die Eichen, die die Olęder mit den jedem von ihnen längst zugeteilten Hufen genommen hätten. Die Transkription der Edition, datiert vom 9. Juli 1754, hat dieselben Worte bis auf eines: sie liest „drudzy“, wo das Buch „drugi (!)“ druckt. Die Besichtigung zählt die fünfzehn Olęder unter Nowa Wieś („Wieś Nowa“) und nennt weder den Wald Lusina noch die zwölf Olęder und die Schenke, die das Buch (S. 28) dazu angibt; diese stehen in der Urkunde von 1771 (Kalisz Gr.414).'
  en: 'Chodyła (2015) quotes the inspection of the Trąbczyn estate made at Katarzyna Prusimska''s request in 1754 (Konin Gr.136): fifteen Olęders, the sixteenth huba empty, some well built and the others with only huts in the ground, and the oaks taken by the Olęders with the hubas long allotted to each of them. The edition''s transcription of the inspection, dated 9 July 1754, has the same words but one: it reads "drudzy" where the book prints "drugi (!)". The inspection counts the fifteen Olęders under Nowa Wieś ("Wieś Nowa") and does not name the wood Lusina, the twelve Olęders or the inn that the book (p. 28) gives with it; those are in the act of 1771 (Kalisz Gr.414).'
  id: chodyla2015-inspection-1754
  works:

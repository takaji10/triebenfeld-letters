- de: Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, nach dem Aufstand von 1794 habe die preußische Regierung Antoni Prusimski zum Rebellen erklärt und sein Vermögen konfisziert, und nennt General Hohenlohe-Ingelfingen den Inhaber des ihm konfiszierten Gutes. In der Akte der Edition vom Juli und August 1796 schlägt Hoym vor, dem Fürsten von Hohenlohe-Ingelfingen die "dem Haupt-Insurgenten Anton von Prusimski" konfiszierten Güter zu geben, darunter Kamionna, Kolno und Trąbczyn, und dem Obristen von Sanitz die Dörfer Pawłów, Dzwonów und Beerenbusch, die der PSB unter den Gütern nennt, über die die Kommissionen des Sejm entscheiden sollten; die Kabinettsorder genehmigt es.
  en: The Polski Słownik Biograficzny (Pachoński, 1982) says that after the rising of 1794 the Prussian government declared Antoni Prusimski a rebel and confiscated his property, and calls General Hohenlohe-Ingelfingen the holder of the estate confiscated from him. In the edition's file of July and August 1796 Hoym proposes to give the Prince of Hohenlohe-Ingelfingen the estates confiscated from "the chief insurgent Anton von Prusimski", Kamionna, Kolno and Trąbczyn among them, and Colonel von Sanitz the villages of Pawłów, Dzwonów and Beerenbusch, which the PSB names among the estates the Sejm's commissions were to settle; the King's order approves.
  id: pachonski1982-confiscation
  works:
  - cite: Pachoński (1982)
    pages:
    - de: S. 583
      en: p. 583
      key: '583'
    work: pachonski1982
oe1bu9454-1:
- de: Żychliński (1891) sagt, Michalina geborene Prusimska, die Witwe des Grafen Józef Dąmbski, habe im August 1809 den Grafen Stanisław Miączyński geheiratet und ihm die Güter von Trąbczyn zugebracht. In den Briefen an und von dem Fürsten Hohenlohe aus den Jahren 1814 und 1815 ist sie "die Moscinska geborene Prusimska", die die ihr 1807 zurückgegebenen Güter besitzt und beim russischen Generalgouverneur Lanskoy in hoher Gunst steht; ein Brief vom 2. Februar 1815 sagt, "Moscinski, Ehemann der geborenen Prusimska; und Graf Lanskoy, sind Busenfreunde". Die Edition hält Moscinski für die Form, in der die Briefe Miączyński schreiben. Die Briefe nennen kein Datum der Heirat.
  en: Żychliński (1891) says that Michalina, born Prusimska, the widow of Count Józef Dąmbski, married Count Stanisław Miączyński in August 1809 and brought him the Trąbczyn estates. In the letters to and from the Prince of Hohenlohe of 1814 and 1815 she is "the Moscinska born Prusimska", who holds the estates given back to her in 1807 and stands high in favour with the Russian governor general Lanskoy; a letter of 2 February 1815 says that "Moscinski, husband of the born Prusimska" and Lanskoy are bosom friends. The edition takes Moscinski for the letters' form of Miączyński. The letters give no date for the marriage.
  id: zychlinski1891-marriage
  works:
  - cite: Żychliński (1891)
    pages:
    - de: S. 221
      en: p. 221
      key: '221'
    work: zychlinski1891

app53170koningr118-23:
- de: 'Żychliński (1885) gibt die Trąbczyner Linie der Prusimski: Krzysztof, Herr auf Kolno, Kamionna und Trąbczyn, und seine Frau Teresa Golińska; ihren Sohn Stefan und dessen Frau Wiktorya Malczewska; und Stefans einzigen Sohn Antoni, Starosten von Nieszczewice. Die Gerichtsbücher stimmen damit überein: das 1776 eingetragene Grenzdekret nennt den verstorbenen Krzysztof Prusimski, Erbherrn von Trąbczyn, den Großvater des Starosten, und Antonis Ladung von 1782 nennt ihn Sohn Stefans und der Wiktoria Malczewska und Enkel Krzysztofs und der Teresa Golińska. Die Ladung nennt als Krzysztofs andere Söhne Jan, Bogumił, Antoni und Paweł, wo Żychliński Jan Paweł, Teofil und Antoni hat (Bogumił ist die polnische Form von Teofil); ein Prozess von 1728 nennt schon Krzysztof mit seinem Sohn Antoni. Die Besichtigung von Trąbczyn vom Juli 1754 wurde für Katarzyna geborene Rozdrażewska vorgenommen, die Witwe des Paweł Prusimski, königlichen Kammerherrn und Erbherrn von Trąbczyn; Żychlińskis Paweł Apollo,
    Kammerherr und Ehemann der Katarzyna Rozdrażewska, steht eine Generation höher, als Bruder Krzysztofs.'
  en: 'Żychliński (1885) gives the Trąbczyn branch of the Prusimskis: Krzysztof, lord of Kolno, Kamionna and Trąbczyn, and his wife Teresa Golińska; their son Stefan and his wife Wiktorya Malczewska; and Stefan''s only son Antoni, Starost of Nieszczewice. The court books agree: the boundary decree entered in 1776 calls the late Krzysztof Prusimski, heir of Trąbczyn, the Starost''s grandfather, and Antoni''s summons of 1782 names him son of Stefan and Wiktoria Malczewska and grandson of Krzysztof and Teresa Golińska. The summons names Krzysztof''s other sons Jan, Bogumił, Antoni and Paweł, where Żychliński has Jan Paweł, Teofil and Antoni (Bogumił is the Polish form of Teofil); a suit of 1728 already names Krzysztof with his son Antoni. The inspection of Trąbczyn of July 1754 was made for Katarzyna born Rozdrażewska, widow of Paweł Prusimski, the King''s chamberlain and heir of Trąbczyn; Żychliński''s Paweł Apollo, chamberlain and husband of Katarzyna Rozdrażewska, stands a generation higher,
    as Krzysztof''s brother.'
  id: zychlinski1885-line
  works:
  - cite: Żychliński (1885)
    pages:
    - de: S. 187
      en: p. 187
      key: '187'
    - de: S. 188
      en: p. 188
      key: '188'
    work: zychlinski1885
app53170koningr136-1:
- de: 'Breyer (1935) sagt, 1746 habe Paul von Kolno-Prusiński, Besitzer des Gutes Trąbczyn, die Wälder und Ödländereien südlich davon an Holländer in Erbpacht gegeben, und daraus sei das Dorf Łazińsk Holland entstanden, eine der beiden Hauländereien des Gutes Trąbczyn. Die Edition hat kein Dokument von 1746. Ihr frühestes über die Hauländer von Trąbczyn ist die Besichtigung vom 9. Juli 1754, vorgenommen für die Witwe des kurz zuvor verstorbenen Paweł Prusimski, königlichen Kammerherrn und Erbherrn von Trąbczyn: sie nennt die Olędry unter den zu Trąbczyn gehörigen Orten, zählt in Nowa Wieś fünfzehn Hauländer, die sechzehnte Hufe leer, und sagt, die Hauländer hätten mit den jedem von ihnen längst zugeteilten Hufen das beste Holz an sich genommen.'
  en: 'Breyer (1935) says that in 1746 Paul von Kolno-Prusiński, owner of the Trąbczyn estate, gave the woods and waste land south of it to Hollanders in hereditary lease, and that the village of Łazińsk Holland arose from it, one of the two Olęder colonies of the Trąbczyn estate. The edition has no document of 1746. Its earliest on the Olęder settlers of Trąbczyn is the inspection of 9 July 1754, made for the widow of Paweł Prusimski, the King''s chamberlain and heir of Trąbczyn, who had died shortly before: it names the Olędry among the places belonging to Trąbczyn, counts fifteen Olęder settlers at Nowa Wieś with the sixteenth plot empty, and says the Olęders had taken the best wood with the plots allotted to each of them long before.'
  id: breyer1935gaue-hollanders
  works:
  - cite: Breyer (1935a)
    pages:
    - de: S. 41
      en: p. 41
      key: '41'
    work: breyer1935gaue

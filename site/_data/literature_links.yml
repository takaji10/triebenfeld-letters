app53170koningr153-1:
- de: Chodyła (2015, Anm. 34) führt ein Dekret des Kommissionsgerichts im Streit zwischen Antoni Prusimski und Stanisław Chełmski an, „am 17. Oktober 1782 im Haus des Olęders Marcin Hunt in den Trąmpczyńskie Olędry“ gehalten, das Hunts Hof dem Gut Trąbczyn Prusimskis zuschlug. In der Edition (Konin Gr.153) ist der 17. Oktober 1782 das Datum des Dekrets des Krontribunals in Petrikau, das Chełmski befahl, Hunt binnen sechs Wochen in Prusimskis Besitz zurückzugeben; der Kommissar Józef Łukaszewicz kam am 28. November 1782 in Hunts Haus und wies ihn in Prusimskis Besitz ein. Die Edition folgt den Daten der Dokumente.
  en: Chodyła (2015, note 34) cites a decree of the commission court in the suit between Antoni Prusimski and Stanisław Chełmski, "held on 17 October 1782 in the house of the Olęder Marcin Hunt in the Trąmpczyńskie Olędry", ordering Hunt's farm joined to Prusimski's Trąbczyn estate. In the edition (Konin Gr.153) 17 October 1782 is the date of the Crown Tribunal's decree at Piotrków, which ordered Chełmski to restore Hunt to Prusimski's possession within six weeks; the commissary Józef Łukaszewicz came to Hunt's house on 28 November 1782 and put him into Prusimski's possession. The edition follows the documents' dates.
  id: chodyla2015-hunt-1782
  works:
  - cite: Chodyła (2015)
    pages:
    - de: S. 28
      en: p. 28
      key: '28'
    work: chodyla2015

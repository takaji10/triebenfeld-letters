app539680783-1:
- de: Żychliński (1891) sagt, Graf Włodzimierz Miączyński, Offizier von 1831, habe das Gut Trąbczyn besessen, das er nach seiner Rückkehr aus dem Exil von seinem Bruder Mieczysław kaufte, und sei im Dezember 1879 unverheiratet in Trąbczyn gestorben. Die gedruckte Ladung der Edition vom 19. Oktober 1860 ergeht auf Verlangen "Włodzimierza Hrabiego Miączyńskiego, dziedzica dóbr Trąbczyna" (des Grafen Włodzimierz Miączyński, Erbherrn der Güter Trąbczyn), in seiner Widerklage gegen die Kolonisten von Trąbczyn.
  en: Żychliński (1891) says that Count Włodzimierz Miączyński, an officer of 1831, held the Trąbczyn estate, which he bought from his brother Mieczysław after his return from exile, and that he died at Trąbczyn, unmarried, in December 1879. The edition's printed summons of 19 October 1860 is issued at the demand of "Włodzimierz Count Miączyński, heir of the Trąbczyn estates, living in the village of Trąbczyn", in his counterclaim against the colonists of Trąbczyn.
  id: zychlinski1891-wlodzimierz
  works:
  - cite: Żychliński (1891)
    pages:
    - de: S. 222
      en: p. 222
      key: '222'
    work: zychlinski1891
app539680801-2:
- de: 'Breyer (1938) berichtet vom Erbpachtvertrag, durch den Triebenfeld für den Fürsten Hohenlohe 100 Hufen Wald an achtzehn deutsche Siedler gab, mit der Genehmigung der Kalischer Kammer vom 28. Januar 1806, und zitiert dessen Paragraphen 13: die Erbpächter für immer frei von Erbuntertänigkeit und allen Diensten. Die Edition hat die Genehmigung und eine Abschrift des Vertrags, der den Wald als den des fürstlichen Gutes Drzewce nennt, und sie stimmen mit ihm überein in den achtzehn Annehmern, in Paragraph XIII, im Kanon von 30 Reichstalern für die Magdeburgische Hufe nach vier Freijahren, je zur Hälfte zu Johanni und zu Weihnachten, und in den 21 Morgen für Schullehrer, Schulzen und Kirchhof. In drei Punkten weichen sie ab. Breyer datiert den Vertrag auf den 18. Mai 1805; die Abschrift der Edition, deren Anfang fehlt, nennt keinen Tag des Abschlusses und wurde am 21. März 1806 in Mariantów ausgefertigt. Die Klausel über die Entwässerung des Landes und einen Damm an der Warthe, die Breyer
    zitiert, steht in keinem Paragraphen der Abschrift. Und wo Breyer sagt, die Siedler hätten Weide und Holz in der fürstlichen Heide gehabt, gibt ihnen der Vertrag (Paragraph VIII) keinen Anspruch auf Brennholz und erlaubt die Hütung nur in dem Teil der Waldungen bei Drzewce, den die Herrschaft behielt, bis auch dieser verkauft wird.'
  en: 'Breyer (1938) tells of the hereditary lease by which Triebenfeld, for the Prince of Hohenlohe, gave 100 Hufen of forest to eighteen German settlers, with the Kalisz chamber''s consent of 28 January 1806, and quotes its paragraph 13: the lessees free for ever of hereditary subjection and of all services. The edition has the consent and a copy of the lease, which names the forest as that of the Prince''s estate of Drzewce, and they agree with him on the eighteen takers, on paragraph XIII, on the rent of 30 Reichsthaler a Magdeburg Hufe after four free years, paid half at St John''s and half at Christmas, and on the 21 Morgen for the schoolmaster, the headman and the cemetery. They differ in three points. Breyer dates the lease 18 May 1805; the edition''s copy, whose beginning is lost, gives no day it was made and was engrossed at Mariantów on 21 March 1806. The clause on draining the land and a dike on the Warta that Breyer quotes is not among the copy''s paragraphs. And where Breyer
    says the settlers had pasture and wood in the Prince''s heath, the lease (paragraph VIII) gives them no claim to firewood, and lets them graze only in the part of the Drzewce woods the lordship kept, until that too is sold.'
  id: breyer1938-lease

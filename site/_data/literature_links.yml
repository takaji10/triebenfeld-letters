- de: 'Chodyła (2015) setzt die ältesten Olęder-Siedlungen der Pyzdry-Heide, die Trąbczyńskie Stare Olędry und die Luśnie Olędry, in das Jahr 1746, gegründet von Paweł und Katarzyna Prusimski mit einem nicht erhaltenen Privileg, und zeigt als Beleg zwei Blätter des Grenzdekrets (Konin Gr.145, Bl. 681 und 692). Das Dekret sagt, der Onkel Antoni Prusimskis habe auf den Wäldern Miąsykąt, Dziadulina und Luśnie, die sich vom Stawisko gegen Czarny Bród ziehen, Holländer angesiedelt, „wie es die ihnen 1746 verliehenen Rechte bezeugen“; Katarzyna nennt es nicht. Die Vorladung von 1860, die das Buch ebenfalls anführt, nennt beide Verleiher: „Paweł z Kolna Prusiński“ und seine Frau Katarzyna z Rozdrażewskich. Das Buch nennt das Dekret das von 1776, dem Jahr seiner Eintragung in die Gerichtsbücher; die Kommission tagte seit dem 13. September 1775. Nach dem Buch (Anm. 34) stritten die Kolonisten 1860 mit Graf Władysław Miączyński; die Vorladung erging auf Antrag des Grafen Włodzimierz Miączyński, und
    die Edition folgt der Vorladung.'
  en: 'Chodyła (2015) dates the oldest Olęder settlements of the Pyzdry Forest, the Trąbczyńskie Stare Olędry and the Luśnie Olędry, to 1746, founded by Paweł and Katarzyna Prusimski by a charter that does not survive, and shows two folios of the boundary decree (Konin Gr.145, fols. 681 and 692) as the evidence. The decree says that the uncle of Antoni Prusimski settled Hollanders on the woods Miąsykąt, Dziadulina and Luśnie, which run from the Stawisko towards Czarny Bród, "as the rights granted them in 1746 attest"; it does not name Katarzyna. The summons of 1860, which the book also cites, names both grantors: "Paweł z Kolna Prusiński" and his wife Katarzyna z Rozdrażewskich. The book calls the decree that of 1776, the year it was entered in the court books; the commission sat from 13 September 1775. The book (note 34) has the colonists of 1860 at law with Count Władysław Miączyński; the summons was issued at the request of Count Włodzimierz Miączyński, and the edition follows the summons.'
  id: chodyla2015-founding-1746

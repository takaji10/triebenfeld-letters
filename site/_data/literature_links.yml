oe1bu9454-104:
- de: 'Der Eintrag des schwarzen Registers über Triebenfeld: Güter, bei der Schenkung auf 31.000 Taler taxiert (und 20.000 für die Herrschaft Laski gezahlt), von der Regierung in Kalisch im Frühjahr 1797 auf über 700.000 taxiert, von ihm an den Prinzen George von Hessen-Darmstadt für 400.000 verkauft und von diesem im März 1801 für 750.000 weiterverkauft. Triebenfelds Briefe an den Fürsten Hohenlohe nennen dieselbe Taxe (über 700.000, April 1799) und denselben Weiterverkauf (750.000, Februar 1801), aber als seinen eigenen Preis an den Prinzen George 280.000, nicht 400.000 (Juli 1800). Cölln merkte 1807 an, in den Zahlen steckten Triebenfelds eigene Güter. Es sind nicht die Güter von Trąbczyn: der Eintrag zeigt, wie die geschenkten Güter bewertet wurden.'
  en: 'The black register''s entry on Triebenfeld: estates valued at 31,000 Thaler when they were given to him (and 20,000 paid for the lordship of Laski), valued by the Kalisz government in the spring of 1797 at over 700,000, sold by him to Prince George of Hesse-Darmstadt for 400,000, and sold on by Prince George in March 1801 for 750,000. Triebenfeld''s letters to the Prince of Hohenlohe give the same valuation (over 700,000, April 1799) and the same resale (750,000, February 1801), but put his own price to Prince George at 280,000, not 400,000 (July 1800). Cölln remarked in 1807 that the figures include estates that were Triebenfeld''s own property. These are not the Trąbczyn estates: the entry bears on how the gifted estates were valued.'
  id: register-triebenfeld

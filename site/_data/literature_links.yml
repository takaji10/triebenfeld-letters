agad1169011745-1:
- de: 'Chodyła (2015) führt das Häuser- und Einwohnerregister des Generaldirektoriums von Südpreußen an (AGAD, Nr. 1745), das es auf 1796 datiert: „Łazy H.“ mit 5 Häusern (S. 401), „Trąbczyn H.“ mit 34 Häusern und „Stara Huta Trąbczyn“ mit 2 (S. 406). Die Edition hat diese Seiten (AGAD 1/169/0/1/1745) mit denselben Zahlen: Nr. 150 „Haul. Lazy.“, 5 Häuser und 42 Menschen; Nr. 292, die Hauländerei von Trąpczyn, 34 Häuser und 271 Menschen, nach dem Dorf Trąpczyn mit 32; Nr. 283, Stara Huta von Trąpczyn, 2 Häuser. Die Seiten tragen kein Datum, das Archiv datiert den Band auf 1797; die Edition behält dieses Datum. Das Buch hält „Łazy H.“ für das Dorf Łazy unter Olęder-Recht; die Anmerkung der Edition zu diesem Eintrag (nach dem Herausgeber der Edition, 14.10.2026) hielt es für wahrscheinlich die Łazińskie Olędry.'
  en: 'Chodyła (2015) cites the register of houses and population of the General Directory of South Prussia (AGAD, no. 1745), which it dates 1796: "Łazy H." with 5 houses (p. 401), and "Trąbczyn H." with 34 houses and "Stara Huta Trąbczyn" with 2 (p. 406). The edition has these pages (AGAD 1/169/0/1/1745), with the same figures: no. 150 "Haul. Lazy.", 5 houses and 42 people; no. 292, the Hauland of Trąpczyn, 34 houses and 271 people, after the village of Trąpczyn with 32; no. 283, Stara Huta of Trąpczyn, 2 houses. The pages carry no date, and the archive dates the volume 1797; the edition keeps that date. The book takes "Łazy H." for the village of Łazy under Olęder law; the edition''s note on that entry (the editor, 2026-10-14) took it to be probably the Łazińskie Olędry.'
  id: chodyla2015-register-1797
  works:

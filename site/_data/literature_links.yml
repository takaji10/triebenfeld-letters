oe1bu9454-220:
- de: 'Breyer (1938) sagt, die Zagórower Güter hätten von 1828 an K. G. von Weigel gehört, einem Großgrundbesitzer aus Hennersdorf in Schlesien. Ein Weigel steht schon lange vorher in den Briefen an den Fürsten Hohenlohe, als Gläubiger auf denselben Gütern: im Oktober 1811 schreibt Triebenfeld, alles komme darauf an, dass Weigel und Stössel die Constadter Güter und die Hypothek auf die Zagorower Güter wieder annehmen, und im März 1815: "Weigel seine 30000 rt sind auf Zagorowo übertragen". Ob der Weigel der Briefe, der Breslauer Bankier Carl Ferdinand Weigel, Breyers K. G. von Weigel ist oder zu seiner Familie gehört, ist nicht erwiesen.'
  en: 'Breyer (1938) says that from 1828 the Zagórów estates were owned by K. G. von Weigel, a great landowner from Hennersdorf in Silesia. A Weigel stands in the Prince of Hohenlohe''s letters long before, as a creditor on the same estates: in October 1811 Triebenfeld writes that everything turns on Weigel and Stössel taking back the Constadt estates and the mortgage on the Zagórów estates, and in March 1815 that "Weigel''s 30,000 Thaler are transferred to Zagorowo". Whether the Weigel of the letters, the Breslau banker Carl Ferdinand Weigel, is Breyer''s K. G. von Weigel, or of his family, is not shown.'
  id: breyer1938-weigel
  works:
  - cite: Breyer (1938)
    pages:
    - de: S. 22
      en: p. 22
      key: '22'
    work: breyer1938
oe1bu9454-242:
- de: Żychliński (1891) sagt, Michalina geborene Prusimska, die Witwe des Grafen Józef Dąmbski, habe im August 1809 den Grafen Stanisław Miączyński geheiratet und ihm die Güter von Trąbczyn zugebracht. In den Briefen an und von dem Fürsten Hohenlohe aus den Jahren 1814 und 1815 ist sie "die Moscinska geborene Prusimska", die die ihr 1807 zurückgegebenen Güter besitzt und beim russischen Generalgouverneur Lanskoy in hoher Gunst steht; ein Brief vom 2. Februar 1815 sagt, "Moscinski, Ehemann der geborenen Prusimska; und Graf Lanskoy, sind Busenfreunde". Die Edition hält Moscinski für die Form, in der die Briefe Miączyński schreiben. Die Briefe nennen kein Datum der Heirat.
  en: Żychliński (1891) says that Michalina, born Prusimska, the widow of Count Józef Dąmbski, married Count Stanisław Miączyński in August 1809 and brought him the Trąbczyn estates. In the letters to and from the Prince of Hohenlohe of 1814 and 1815 she is "the Moscinska born Prusimska", who holds the estates given back to her in 1807 and stands high in favour with the Russian governor general Lanskoy; a letter of 2 February 1815 says that "Moscinski, husband of the born Prusimska" and Lanskoy are bosom friends. The edition takes Moscinski for the letters' form of Miączyński. The letters give no date for the marriage.
  id: zychlinski1891-marriage
  works:
  - cite: Żychliński (1891)
    pages:
    - de: S. 221
      en: p. 221
      key: '221'
    work: zychlinski1891

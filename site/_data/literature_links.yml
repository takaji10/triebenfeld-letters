- de: Die Materialien sagen nach dem "schwarzen Buch", Triebenfeld habe die Herrschaft Krotoszyn neun Jahre für die Seehandlung verwaltet, Struensee habe sie 1791 an den Amtmann Früson für 30.100 Taler im Jahr verpachtet, und Hoym und Triebenfeld hätten Früson vertrieben. In den Briefen der Edition über den Tausch des Fürsten gegen Krotoszyn sagt der König, Triebenfeld habe für die Abtretung der Pacht 1795 einen Abstand von 26.000 Talern erhalten, und der Fürst nennt als Pacht von Krotoszyn dieselben 30.100.
  en: The Materialien, quoting the "black book", say that Triebenfeld ran the lordship of Krotoszyn for the Seehandlung (the state's Maritime Trading Company) for nine years, that Struensee leased it in 1791 to the steward Früson for 30,100 Thaler a year, and that Hoym and Triebenfeld drove Früson out. In the edition's letters on the Prince's proposed exchange for Krotoszyn the King says Triebenfeld received 26,000 Thaler when the lease was given up in 1795, and the Prince gives Krotoszyn's rent as the same 30,100.
  id: krotoszyn-administration
  works:
  - cite: Materialien (1861)
    pages:
    - de: S. 163
      en: p. 163
      key: '163'
    work: materialien1861
oe1bu9454-103:
- de: 'Gegen den Vorwurf, der Fürst Hohenlohe habe zu viele Güter erhalten, stellte Triebenfeld dessen Schenkung neben andere aus derselben Zeit, alle niedrig taxiert und seither teuer verkauft oder mit weit höherem Ertrag: die Bischofswerders (die er, wie er sagt, für 207.000 Taler verkauft habe), die Zastrows (sollten 2.000 im Jahr tragen, bringen jetzt an die 20.000), die Dolffs'' (die Treskow jetzt für 360.000 verkaufe) und die des Generals Rüchel (für 140.000 verkauft). Das schwarze Register erhebt denselben Vorwurf gegen dieselben Schenkungen: Bischofswerders an den Grafen Lüttichau für 25.000 Friedrichsd''or verkauft, Zastrows bei der Schenkung 87.650 und "jetzt zum Mindesten 200.000" wert, Treskows zusammen etwa 350.000 wert, Rüchels an Reibnitz für 130.000 verkauft und danach auf 380.000 taxiert.'
  en: 'Answering the charge that the Prince of Hohenlohe had been given too many estates, Triebenfeld set his gift beside others made at the same time, each valued low and since sold or yielding far more: Bischofswerder''s (which he says he sold for 207,000 Thaler), Zastrow''s (meant to bear 2,000 a year, now some 20,000), Dolffs''s (which Treskow is now selling for 360,000) and General Rüchel''s (sold for 140,000). The black register makes the same complaint of the same gifts: Bischofswerder''s sold to Count Lüttichau for 25,000 Friedrichsd''or, Zastrow''s given at 87,650 and "now worth at least 200,000", Treskow''s worth together about 350,000, Rüchel''s sold to Reibnitz for 130,000 and valued afterwards at 380,000.'
  id: register-other-gifts

app53170koningr136-1:
- de: 'Breyer (1935) sagt, 1746 habe Paul von Kolno-Prusiński, Besitzer des Gutes Trąbczyn, die Wälder und Ödländereien südlich davon an Holländer in Erbpacht gegeben, und daraus sei das Dorf Łazińsk Holland entstanden, eine der beiden Hauländereien des Gutes Trąbczyn. Das Privileg von 1746 liegt in der Edition nicht vor, aber zwei ihrer Dokumente führen es an. Das Dekret der Grenzkommission von 1775 sagt, der Onkel Antoni Prusimskis, des Erbherrn von Trąbczyn, habe Holländer auf den Trąbczyner Wäldern angesetzt, „wie die ihnen 1746 verliehenen Rechte bezeugen“. Die Ladung von 1860, im Prozess zwischen Graf Włodzimierz Miączyński und den Kolonisten der Kolonien Staro- und Nowo-Łazińska, nennt, wer dieses Privileg verlieh: „Paweł z Kolna Prusiński“, Breyers Paul von Kolno-Prusiński, und seine Frau Katarzyna Rozdrażewska. Das früheste Zeugnis der Edition über die Siedler selbst ist die Besichtigung vom 9. Juli 1754, vorgenommen für Katarzyna als Witwe des kurz zuvor verstorbenen Paweł Prusimski,
    königlichen Kammerherrn: sie nennt die Olędry unter den zu Trąbczyn gehörigen Orten, zählt in Nowa Wieś fünfzehn Hauländer, die sechzehnte Hufe leer, und sagt, die Hauländer hätten mit den jedem von ihnen längst zugeteilten Hufen das beste Holz an sich genommen. Dass das Privileg eine Erbpacht war, ist Breyers Darstellung; die beiden Dokumente sagen nur, dass es das Verhältnis zwischen den Besitzern und den Holländern regelte.'
  en: 'Breyer (1935) says that in 1746 Paul von Kolno-Prusiński, owner of the Trąbczyn estate, gave the woods and waste land south of it to Hollanders in hereditary lease, and that the village of Łazińsk Holland arose from it, one of the two Olęder colonies of the Trąbczyn estate. The privilege of 1746 is not in the edition, but two of its documents cite it. The decree of the boundary commission of 1775 says that the uncle of Antoni Prusimski, heir of Trąbczyn, settled Hollanders on the Trąbczyn woods, "as the rights granted them in 1746 attest". The summons of 1860, in the lawsuit between Count Włodzimierz Miączyński and the colonists of the Staro- and Nowo-Łazińska colonies, names who granted that privilege: "Paweł z Kolna Prusiński", Breyer''s Paul von Kolno-Prusiński, and his wife Katarzyna Rozdrażewska. The edition''s earliest record of the settlers themselves is the inspection of 9 July 1754, made for Katarzyna as widow of Paweł Prusimski, the King''s chamberlain, who had died shortly
    before: it names the Olędry among the places belonging to Trąbczyn, counts fifteen Olęder settlers at Nowa Wieś with the sixteenth plot empty, and says the Olęders had taken the best wood with the plots allotted to each of them long before. That the privilege was a hereditary lease is Breyer''s account; the two documents say only that it settled the relations between the owners and the Hollanders.'
  id: breyer1935gaue-hollanders
  works:
  - cite: Breyer (1935a)
    pages:
    - de: S. 41
      en: p. 41
      key: '41'
    work: breyer1935gaue

app53150kaliszgr414-1:
- de: 'Chodyła (2015) sagt, 1771 sei ein Teil des Gutes Trąbczyn mit der „unlängst“ im Wald Luśnie gegründeten Olęder-Siedlung durch gerichtliche Vollstreckung an Stanisław Chełmski von Łukomia übergeben worden, und sie habe damals zwölf Olęder und einen Schäfer gehabt. Die Urkunde vom 4. November 1771 in der Edition (Kalisz Gr.414) übergibt Chełmski den Wald „Luśnię“ und die „ufundowane niezbyt dawnym czasem“ Olędry, eine Schenke mit neuem Stall ohne Wirt und zwölf Personen mit Namen, darunter den Schäfer Brudzewski: Michał Kinos, Chenryk Bedka, Jan und Krystyan Tulka, Bogusław Celmer, Samól Frinderberg, Bogusław Effthman, Krzysztofowa Kulawa, Maci Klinczpor, Antoni Pisarz und Wawrzyń Welner.'
  en: 'Chodyła (2015) says that in 1771 a part of the Trąbczyn estate, with the Olęder settlement founded "not very long ago" in the wood Luśnie, was handed over to Stanisław Chełmski of Łukomia by a court''s execution, and that it then had twelve Olęders with a shepherd. The act of 4 November 1771 in the edition (Kalisz Gr.414) hands over to Chełmski the wood "Luśnię" and the Olędry "ufundowane niezbyt dawnym czasem", an inn with a new stable but no host, and twelve people by name, the shepherd Brudzewski among them: Michał Kinos, Chenryk Bedka, Jan and Krystyan Tulka, Bogusław Celmer, Samól Frinderberg, Bogusław Effthman, Krzysztofowa Kulawa, Maci Klinczpor, Antoni Pisarz and Wawrzyń Welner.'
  id: chodyla2015-tradition-1771
  works:

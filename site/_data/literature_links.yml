ihagrrep7cnr1414-1:
- de: 'Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, Antoni Prusimski sei Ende 1794 mit seiner Frau nach Venedig geflohen, dort auch nach dem Basler Frieden tätig geblieben, wie Hoym am 9. Mai 1796 meldete, und Mitte März 1797 von den Österreichern nach Mantua vertrieben worden. Die Akte des auswärtigen Departements in der Edition fällt in diese Monate: die Depesche des preußischen Residenten in Venedig, Graf Cattaneo, vom 14. Dezember 1796 über Prusimskis zerrüttete Gesundheit und seine Bitte um ein Attest, dass er nicht reisen könne; das Schreiben des Departements vom 11. Januar 1797, das sie den Ministern Hoym und Schroetter mitteilt; und Schrötters Antwort vom 29. Januar 1797, es stehe nicht fest, ob Prusimski in Neuostpreußen oder in Südpreußen angesessen sei. Hoyms Bericht vom Mai 1796 ist nicht in der Akte.'
  en: 'The Polski Słownik Biograficzny (Pachoński, 1982) says that Antoni Prusimski fled to Venice with his wife at the end of 1794, stayed active there after the Peace of Basel, as Hoym reported on 9 May 1796, and was driven out to Mantua by the Austrians in the middle of March 1797. The edition''s file of the foreign department falls in those months: the dispatch of the Prussian resident at Venice, Count Cattaneo, of 14 December 1796, on Prusimski''s ruined health and his request for a certificate that he could not travel; the department''s letter of 11 January 1797 passing it to the ministers Hoym and Schroetter; and Schrötter''s reply of 29 January 1797, which says it is not known whether Prusimski is settled in New East Prussia or in South Prussia. Hoym''s report of May 1796 is not in the file.'
  id: pachonski1982-venice
  works:
  - cite: Pachoński (1982)
    pages:
    - de: S. 583
      en: p. 583
      key: '583'
    work: pachonski1982
ihagrrep7cnr1414-2:
- de: Żychliński (1891) sagt in einer Fußnote, Maryanna geborene Dąmbska, Antoni Prusimskis Frau, sei am 2. September 1797 in Padua im Alter von 38 Jahren gestorben und in der Kirche des heiligen Antonius dort begraben worden. Der preußische Resident in Venedig, Graf Cattaneo, berichtete am 14. Dezember 1796, Prusimski sei in zerrütteter Gesundheit zu ihm gekommen, vom Tod seiner Frau fast bis zur Stumpfheit betroffen. Sprechen beide vom selben Tod, so fiel er vor den Dezember 1796, und Żychlińskis Jahr 1797 kann nicht stimmen.
  en: Żychliński (1891) says in a footnote that Maryanna born Dąmbska, Antoni Prusimski's wife, died at Padua on 2 September 1797, aged 38, and was buried in the church of St Anthony there. The Prussian resident at Venice, Count Cattaneo, reported on 14 December 1796 that Prusimski had come to him in ruined health and dulled almost to stupor by the death of his wife. If both speak of the same death, it came before December 1796, and Żychliński's year 1797 cannot stand.
  id: zychlinski1891-maryanna
  works:
  - cite: Żychliński (1891)
    pages:
    - de: S. 221
      en: p. 221
      key: '221'

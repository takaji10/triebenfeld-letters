oe1bu9454-97:
- de: 'Das schwarze Register führt die dem Fürsten Hohenlohe geschenkten Güter, darunter Trąbczyn, mit einem Wert von etwa 800.000 Talern und 50.000 Talern Ertrag im Jahr, wo der verstorbene König nur eine Schenkung von 6.000 Talern Ertrag gemeint habe; der Fürst habe diesen Ertrag von 50.000 selbst im Kabinett angegeben, als er die Güter gegen die Domäne Krotoszyn tauschen wollte, und der Kabinettsrat Beyme habe den Tausch verhindert. Cölln hielt 1807 dagegen, der Minister Voss habe ihn vereitelt, und die Briefe der Edition geben ihm recht: die Schenkung von 1796, die Ablehnung des Königs vom Dezember 1798 auf den Bericht von Voss (die auf 8.650 Taler Jahresertrag veranschlagten Güter brächten jetzt 40.500), die Antwort des Fürsten an den König (seine Güter trügen 41.500, die Pacht von Krotoszyn sei 30.100) und seine spätere Eingabe.'
  en: 'The black register lists the estates given to the Prince of Hohenlohe, Trąbczyn among them, as worth about 800,000 Thaler and yielding 50,000 a year, where the late King had meant a gift yielding 6,000; it says the Prince himself gave the King''s cabinet that yield of 50,000 when he tried to exchange the estates for the crown domain of Krotoszyn, and that the cabinet councillor Beyme stopped the exchange. Cölln answered in 1807 that it was the minister Voss who stopped it, and the edition''s letters bear him out: the gift of 1796, the King''s refusal of December 1798 on Voss''s report (estates valued at a yield of 8,650 a year now bring 40,500), the Prince''s answer to the King (his estates yield 41,500, Krotoszyn''s rent is 30,100) and his later petition.'
  id: register-hohenlohe

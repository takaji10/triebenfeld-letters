- de: Żychliński (1891) sagt, Graf Włodzimierz Miączyński, Offizier von 1831, habe das Gut Trąbczyn besessen, das er nach seiner Rückkehr aus dem Exil von seinem Bruder Mieczysław kaufte, und sei im Dezember 1879 unverheiratet in Trąbczyn gestorben. Die gedruckte Ladung der Edition vom 19. Oktober 1860 ergeht auf Verlangen "Włodzimierza Hrabiego Miączyńskiego, dziedzica dóbr Trąbczyna" (des Grafen Włodzimierz Miączyński, Erbherrn der Güter Trąbczyn), in seiner Widerklage gegen die Kolonisten von Trąbczyn.
  en: Żychliński (1891) says that Count Włodzimierz Miączyński, an officer of 1831, held the Trąbczyn estate, which he bought from his brother Mieczysław after his return from exile, and that he died at Trąbczyn, unmarried, in December 1879. The edition's printed summons of 19 October 1860 is issued at the demand of "Włodzimierz Count Miączyński, heir of the Trąbczyn estates, living in the village of Trąbczyn", in his counterclaim against the colonists of Trąbczyn.

agad1174016-2:
- de: 'Der Polski Słownik Biograficzny (Pachoński, 1982) sagt, nach der Niederlage Preußens, als General Hohenlohe-Ingelfingen, der Inhaber des Antoni Prusimski konfiszierten Gutes, Gefangener der Franzosen war, seien die Bemühungen erneuert worden, der Familie die verlorenen Güter zurückzugeben. Die Edition hat diese Bemühungen, in Dresden im Juli 1807: die Bittschriften seiner Tochter Michalina Dąbska an die Regierungskommission und an Napoleon um Trąbczyn, Kamionna, Kolno und Pawłowo, konfisziert zugunsten der preußischen Generale Hohenlohe, Bischoffswerder und Sanitz, und den Beschluss der Kommission vom 21. Juli 1807, der das in Finckenstein für Wybicki ergangene Dekret des Kaisers auf sie ausdehnte.'
  en: 'The Polski Słownik Biograficzny (Pachoński, 1982) says that after Prussia''s defeat, while General Hohenlohe-Ingelfingen, who held the estate confiscated from Antoni Prusimski, was a prisoner of the French, efforts were renewed to have the lost estates given back to his family. The edition has those efforts, at Dresden in July 1807: the petitions of his daughter Michalina Dąbska to the Governing Commission and to Napoleon for Trąbczyn, Kamionna, Kolno and Pawłowo, confiscated for the Prussian generals Hohenlohe, Bischoffswerder and Sanitz, and the commission''s resolution of 21 July 1807, which extended to her the Emperor''s decree given at Finckenstein for Wybicki.'
  id: pachonski1982-restitution
  works:
  - cite: Pachoński (1982)
    pages:
    - de: S. 583
      en: p. 583
      key: '583'
    work: pachonski1982

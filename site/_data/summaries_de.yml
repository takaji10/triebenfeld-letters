oe1bu14525-001: 'Schenkungsurkunde Friedrich Wilhelms, die dem Prinzen Friedrich Ludwig von Hohenlohe-Ingelfingen, Generallieutenant und Gouverneur von Breslau, für langjährige Dienste die dem König anheimgefallenen Güter erblich und als freies Eigentum überträgt: Stadt Kamionna mit dem Marktort Kulm im Posener Kreis, die Dörfer Trąbczyn, Szetlewek, Nowa wies, Łazy, Alt und Neu Laske, Osiny und Hauland Trąbczyński im Kreis Konin sowie Brzyce in Kujawien, vorbehalten allein die landesherrlichen Steuern und öffentlichen Lasten. Beigefügt sind Beglaubigungen der südpreußischen Regierung zu Kalisz und der Vermerk über die Eintragung des Besitztitels von Szetlewek im Hypothekenbuch des Kreises Konin.'
oe1bu14525-002: Ein Hypothekenschein für das freie Allodialgut Szetlewek im Kreis Konin bestätigt Fürst Friedrich Ludwig von Hohenlohe-Ingelfingen den Besitztitel aus der Schenkungsurkunde Friedrich Wilhelms II. vom 9. August 1796; den Wert gibt er mit 24000 Reichsthaler an. Eingetragen sind das Verbot, das Gut an Landeseingesessene zu verkaufen, ein zinsloses Darlehen des Ignatz von Radzinski über 8333 Rthl 8 ggl (50000 poln. Gulden) als Sicherheit für Pachtgelder, sowie eine Protestation Jacob von Przespolewskis über 30000 poln. Gulden aus einer Schuldverschreibung des Vorbesitzers von Prusimski.
oe1bu14525-003: 'Eine Schenkungsurkunde Friedrich Wilhelms, mit der dem Fürsten Friderich Ludewig von Hohenlohe-Ingelfingen, Generalleutnant der Infanterie, Regimentschef und Gouverneur von Breslau, für seine Verdienste die an den König gefallenen südpreußischen Güter erb- und eigentümlich übertragen werden: Stadt Kamionna und Marktort Kulm im Posener Kreis, die Dörfer Trąbczyn, Szetlewek, Nowa wieś, Łazy, Alt- und Neu-Laske, Osiny, Hauland Trąbczyński im Kreis Konin sowie Brzyce in Cujavien, unter Vorbehalt der landesherrlichen Steuern und Abgaben, mit freiem Verfügungsrecht; Regierungen und Kriegs- und Domänenkammern wird Nichtbehinderung befohlen. Beglaubigte Abschrift durch Richter.'
oe1bu14525-004: Eine Schenkungsurkunde Friedrich Wilhelms, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, Generallieutenant der Infanterie und Gouverneur von Breslau, für langjährige Dienste die Stadt Kamionna und das Städtchen Kulm im Posener Kreis, die Dörfer Trąbczyn, Szetlewek, Nowa wies, Łazy, Alt- und Neu-Laske, Osiny und Hauland Trąbczyński im Koniner Kreis sowie Brzyce in Kujawien samt Zubehör erblich und eigentümlich erhält, vorbehalten die landesherrlichen Steuern und öffentlichen Abgaben; Regierungen und Kriegs- und Domänenkammern wird jede Behinderung untersagt. Als beglaubigte Abschrift, bestätigt von Sonnabend, Auditeur des Regiments.
oe1bu14525-005: 'Eine Schenkungsurkunde Friedrich Wilhelms für seinen Oheim Friedrich Ludwig, regierenden Fürsten von Hohenlohe-Ingelfingen: weil die zuvor überlassenen Güter des entflohenen Starosten von Prusimski stark verschuldet waren, werden ihm nun die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Swiątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienitz und Wolica mit allem Zubehör erblich und als volles Eigentum verliehen, gegen Zahlung der bisherigen landesherrlichen Abgaben als feste Canon und der Kompetenz an die geistlichen Stiftungen. Beglaubigte Abschrift durch Sonnabend.'
oe1bu14525-006: 'Ein offener Schenkungsbrief Friedrich Willhelms, der dem Fürsten Friedrich Ludewig von Hohenlohe-Ingelfingen über die schon am 19. Juni verliehenen Güter Betsche, Zagórów und Wienietz hinaus auch die zugehörigen Pertinenzstücke erblich und zu vollem Eigentum überträgt: bei Betsche die Dörfer Stołuń, Kuligowo, Szarcz, die Vogtei Zielomyśl und Silna sowie die Hauländereien Pomherr und Heydemühle, bei Zagórów das Dörfchen Swięcin, bei Wienietz Konty, Szedlemin, Botkow und Karezin. Gegenleistung sind der bisherige Landesherrschaftszins als fester Canon und die Abgaben an geistliche Stiftungen. Beglaubigt durch Sonnabend.'
oe1bu14525-007: 'Eine vidimirte Abschrift einer königlichen Schenkungsurkunde Friedrich Wilhelms, die dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen über die schon am 19. Juni verliehenen Güter Betsche, Zagórów und Wienietz hinaus auch deren Pertinenzstücke erb- und eigentümlich überträgt: bei Betsche Stołuń, Kuligowo, Szarcz, Vogtey, Zielomyśl und Silna mit den Hauländereien, dem Pommser Hauländer und der Heÿdemühle, bei Zagórów das Dorf Swięcin, bei Wienitz Konty, Siedlemyn, Botkowo und Karczin, gegen unveränderlichen Canon und die Abgaben an geistliche Stiftungen. Beigefügt sind der Titulus possessionis für Swięcia mit dem Vorwerk Broniki im Koniner Kreis (Hypothekenbuch Bd. 3 fol. 94) und ein Hypothekenschein, der als einzige Last das Verkaufsverbot an Nichtinländer verzeichnet.'
oe1bu14525-008: Eine Schenkungsurkunde Friedrich Wilhelms, mit der dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen die vormals geistlichen Güter, nämlich die Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienietz und Wolica mit allem Zubehör, zu erblichem Eigentum übertragen werden, gegen den bisherigen landesherrlichen Canon und die Abgabe an die geistlichen Korporationen. Begründet wird dies mit Diensten des Fürsten und damit, daß die früher verliehenen Güter des entwichenen Starosten von Prusimski zu hoch verschuldet waren. Alle Behörden werden zur Nichtbehinderung angewiesen. Beigefügt eine Beglaubigung des Regierungsauditors Richter.
oe1bu14525-009: Königliche Schenkungsurkunde Friedrich Wilhelms, die dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienietz und Wolica mit allen Zubehörungen als erbliches Eigentum überlässt, gegen einen festen, unveränderlichen Kanon der bisherigen landesherrlichen Abgaben und die Zahlung der Stipendien an die geistlichen Stiftungen. Begründet wird sie damit, dass die früher zugedachten Güter des entwichenen Starosten von Prusimski zu hoch verschuldet waren. Alle Behörden werden angewiesen, den Besitz nicht zu störren; gegengezeichnet Hoym und Reck. Beigefügt ist die Beglaubigung der Abschrift durch Sonnabend, Auditeur des Hohenlohischen Infanterieregiments.
oe1bu14525-010: 'Königliche Schenkungsurkunde Friedrich Wilhelms für seinen Oheim Friedrich Ludwig, regierenden Fürsten von Hohenlohe-Ingelfingen: weil die zuvor übertragenen Güter des entflohenen Starosten von Prusimski mit Schulden belastet waren, werden ihm nun die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienietz und Wolica samt Zubehör zu Erb- und Eigentumsbesitz verliehen, gegen die bisherigen landesherrlichen Abgaben als festen Canon und die Unterhaltsgelder an die geistlichen Stiftungen. Beigefügt eine Beglaubigung der Abschrift durch den Auditeur Richter.'
oe1bu14525-011: 'Nachtrag zur Schenkung vom 19. Juni: Friedrich Wilhelm überträgt seinem Oheim Friedrich Ludewig, regierendem Fürsten von Hohenlohe-Ingelfingen, erblich und eigentümlich die Zubehörungen der Güter Betsche, Zagórów und Wienietz – bei Betsche die Dörfer Stołuń, Kuligowo, Szarcz, die Vogtei Zielomyśl und Silna mit den Hauländereien, der Pomherr-Hauländerei und Heidemühle, bei Zagórów das Dörfchen Swięcin, bei Wienietz Konty, Szedlemin, Botkowo und Karczin. Bedingung ist die Zahlung der bisherigen landesherrlichen Abgaben als unveränderlicher Kanon sowie der Kompetenz für geistliche Stiftungen. Beigefügt die Beglaubigung des Geheimen Südpreußischen Archivs (Beugnitz).'
oe1bu14525-012: 'Ein Hypothekenschein über das Gut Kolno im Posener Kreis, bestehend aus Kamionna und dem Marktflecken Kolno, ausgestellt für den regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen. Er verzeichnet den Erwerb durch Schenkungsurkunde Friedrich Wilhelms II. vom 9. August 1796 nach Einziehung des Vermögens des Anton von Prusimski wegen Teilnahme am Aufstand von 1794 sowie die eingetragenen Lasten: einen Protest des Anton von Broniewski, 250 Rthl für die Kirche zu Kamionna, vier polnische Mark jährlichen Zins und Forderungen von 79.795 Rthl 18 g 8 4/5 pf nebst 21.666 Rthl 16 gg Meliorationskosten.'
oe1bu14525-013: Eine Taxe der im Meseritzer Kreis des Departements Posen gelegenen Güter Kamionna und Kolno des Fürsten Friederich Ludwig von Hohenlohe-Ingelfingen, von Bading nach südpreußischen Grundsätzen berichtigt und von Beugnitz beglaubigt. Sie verzeichnet Lage und Grenzen, eine Fläche von 5523 Morgen 33 Ruten und 5119 Morgen 2 Ruten, zusammen 10642 Morgen 35 Ruten, das Städtchen Kamionna mit 75 Feuerstellen und 466 Seelen nach Gewerben, Konfession und Vieh, die Propinations- und Patronatsrechte samt 100 polnischen Gulden für den Pfarrer, die Hofflächen beider Vorwerke und das Dorf Kolno mit Bauern, Hofwehr und streitigem Holzbezug aus der Krobilewer Heide.
oe1bu14525-014: 'Eine Forsttaxe des Forstinspektors Rochlitz zu den Gütern Kamionna und Kolno, beglaubigt von den Notaren Carl Anton Diener und Joh. Jacob Schmerck. Berechnet wird, was die Zerstückelung von 344 Morgen 151 Ruten Eichen-, Erlen- und Buchenwald (Nr. 1, 3, 4) einbringt: Kaufgeld 15 Rthl je Morgen, Grundzinsen, Zwangsmühlen- und Propinationsgelder, Laudemium, zusammen 15 788 Rthl, nach Abzug 12 520 Rthl, mit dem Taxwert von 186 943 Rthl also 199 463 Rthl. Eine zweite Rechnung mit Holzwert und dem Überland der Kamionnaer Bürger (700 Morgen) und Kolnoer Untertanen (1200 Morgen) führt auf 255 833 Rthl 12 g.'
oe1bu14525-015: Ein Hypothekenschein der Südpreußischen Regierung zu Posen über die Herrschaft Pszczew oder Betsche im Posener Departement mit den Dörfern Świechocin, Stoki, Łowyń, Głażewo, Dormowo, Stołuń, Kuligowo, Szarcz, dem Vorwerk Zielomyśl und Silna, den Hauländereien, dem Tomecher Hauland und der Heydemühle. Der Titulus Possessionis ist für Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, eingetragen aufgrund der Gnadenbriefe vom 19. Juni und 1. Dezember 1797 und der Resignation vom 29. März 1802. Eingetragen sind eine unbestimmte jährliche Kompetenz an die Kriegs- und Domänenkasse Posen sowie das Verbot der Veräußerung an Altpolen; Schulden sind nicht eingetragen.
oe1bu14525-016: 'Königliche Bestätigung der Resignation: Vor der Südpreußischen Regierung übergab der Kammerfiskal Beyer namens des Fiskus dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen, vertreten durch Justizrat Melzer, die im Posener Kreis gelegene Herrschaft Pszczew oder Betsche mit den Zubehörungen Świechocin, Stoki, Łowyń, Głażewo, Dormowo, Stołuń, Kuligowo, Szarcz, der Vogtei Zielomyśl und Silna, den Hauländereien, dem Pomcher Hauländerdorf und den Heyde Mühlen zu Erb- und Eigentumsrecht, gestützt auf die Gnadenbriefe vom 19. Juni und 1. Dezember 1797. Ein angefügter Vermerk bezeugt die Eintragung des Besitztitels im Hypothekenbuch Vol. VII Fol. 1.'
oe1bu14525-017: Eine königliche Schenkungsurkunde Friedrich Wilhelms, mit der dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno, Olesnica, Drzewce, Grądzyn, Wrąbczyn, Winietz und Wolica samt Zubehör erblich und eigentümlich übertragen werden, gegen Zahlung des bisherigen landesherrlichen Kanons und der Kompetenz an die geistlichen Stiftungen; Anlass ist, dass die früher geschenkten Güter des entflohenen Starosten von Prusimski zu hoch verschuldet waren. Beigefügt sind die Beglaubigung der Abschrift durch von Steudener und die Eintragung des titulus possessionis für die Herrschaft Pszczew oder Betsche im Hypothekenbuch Vol. VII fol. 1.
oe1bu14525-018: 'Friedrich Wilhelm schenkt seinem "Oheim" Friedrich Ludwig, regierendem Fürsten von Hohenlohe-Ingelfingen, erb- und eigentümlich die Zubehörungen der ihm am 19. Juni 1797 verliehenen Güter Betsche, Zagórów und Wienietz: bei Betsche Stołuń, Kuligowo, Szarcz, die Vogtei Zielomyśl und Silna samt Hauländereien, das Pomher Hauländerei und Heydemühle, bei Zagórów Swięcin, bei Wienietz Konty, Szedlemin, Botkowo und Karczyn, gegen Zahlung der bisherigen landesherrlichen Abgaben als fester Kanon und des Anteils der geistlichen Stiftungen. Beigefügt sind eine vidimirte Abschrift (Posen 1801), ein Hypothekenschein über die Eintragung des Besitztitels an Pszczew oder Betsche (Hypothekenbuch Bd. VII fol. 1) und eine Beglaubigung.'
oe1bu14525-019: 'Aufforderung der Regierung zu Kalisch an Friedrich Ludwig, regierenden Fürsten von Hohenlohe-Ingelfingen in Breslau: da nach Bestätigung der Kriegs- und Domänenkammer die vormals geistlichen Güter Kopojno, Drzewce, Swięcia und Zagórów im Kreis Konin ihm zu adligem Besitz verliehen und bereits tatsächlich übergeben worden sind, soll er binnen vier Wochen den Eigentumsbesitz nachweisen und einen Termin zur Berichtigung des Besitztitels auf seinen Namen nehmen. Unterzeichnet Reck.'
oe1bu14525-020: Auf ein Gesuch vom 8. des Monats gewährt die Königlich Südpreußische Regierung dem Fürsten von Hohenlohe-Ingelfingen eine Gnadenfrist zur Berichtigung des Besitztitels für die Güter Drzewce, Kopojno, Swięcia und Zagórów, jedoch pro omni nur bis zum letzten Tag des Oktober des laufenden Jahres. Der Bescheid ergeht an den fürstlich Hohenloheschen Bau- und Wirtschaftsrat Glenck in Breslau als Bevollmächtigten und gilt als Resolution.
oe1bu14525-021: Ein amtlicher Auszug aus dem Hypothekenbuch der Stadt Zagórów, Kreis Konin, bestätigt den Besitztitel des regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen aus der Verleihung Friedrich Wilhelms II. Eingetragen sind eine jährliche Abgabe von 88 Rthl 5 Groschen 9 d an die Kammerkasse Kalisch, Protestationen wegen Bau- und Brennholz sowie wegen der Erbpachtrechte von Johann Giese, Johann Bagans und Friedrich Gietzinger, ferner ein Darlehen von 250000 Rthl an von Triebenfeld mit Abtretungen an den Invalidenfonds und die Bankhäuser Oppenheim und Wolff, sowie 8000 Rthl für die Erben Seher-Thoss.
oe1bu14525-022: Abschrift einer Schenkungsurkunde Friedrich Wilhelms II. vom 19. Juni 1797, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienitz und Wolica erb- und eigentümlich erhält, gegen die bisherigen landesherrlichen Abgaben als festen Kanon und die Leistungen an die geistlichen Stiftungen; Anlass ist die verschuldete frühere Schenkung der Güter des entflohenen Starosten von Prusimski. Beigefügt ein Hypothekenschein über die Stadt Zagórów mit der einzigen Beschränkung, dass kein Verkauf an einen Landeseingesessenen ohne Genehmigung erfolgen darf; keine Schulden eingetragen.
oe1bu14525-023: 'Gerichtliche Taxe des dem regierenden Fürsten Friederich Ludewig von Hohenlohe-Ingelfingen gehörenden Gutes Szetlewek im Kreis Konin, Pfarrei Rzgow: 1724 M 22 R Fläche nach der Vermessung des Landmessers Sprengel von 1798, Acker, Wiesen, Kiefernwald, Teiche, dazu Vorwerk, Kmieci, Chalupnici, Komornice, Schenke, Schmiede und Wassermühle. Verpachtet 1799 bis 1805 an Ignatz von Radzinski für 7800 fl, tatsächlich 10.865 fl. Wert 34.803 Rthl 15 gg, nach Abzug des Inventars 31.171 Rthl 23 gg 4 d. Beigefügt Taxen für Brauerei, Brennerei und Ziegelei.'
oe1bu14525-024: Ein stark beschädigter Aktenvermerk von einer Handschriftenseite, dessen Text nur bruchstückhaft lesbar ist. Erkennbar bleiben ein Hinweis auf eine Beilage, die Namen von Laski und Melzer, ein Datum vom 18. April 1803 sowie die Erwähnung von Rückständen aus einem Erbpachtvertrag über Batkowo. Weitere Angaben zu Parteien, Summen und Zusammenhang sind wegen der Textverluste nicht zu gewinnen.
oe1bu14525-025: Ein Hypothekenschein über die Herrschaft Pszczew oder Betsche mit den Dörfern Świechocin, Stoki, Łowyń, Głażewo, Dormowo, Stołuń, Kuligowo, Szarcz, dem Vorwerk Zielomyśl und Silna, den Hauländereien und der Heidemühle, die Fürst Friedrich Ludwig von Hohenlohe-Ingelfingen als eingezogenes geistliches Gut erhielt. Eingetragen sind eine jährliche Kompetenz von 2470 Rthl 16 Gr 3 Pf an die Kriegs- und Domänenkasse Posen sowie Schulden von 48000 Rthl und 5000 Rthl an Bauund Wirtschaftsrat Johann Wilhelm Glenck, 2000 Rthl an Abraham Moses Hirschel, je 5000 Rthl an Freiherr von der Marwitz und die Witwe Christiane Dorothea Michaelis.
oe1bu14525-026: 'Bescheid der Südpreußischen Regierung an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, auf dessen Gesuch vom 20. des Vormonats und die beigefügten Originalurkunden: auf die Herrschaft Betsche werden im Hypothekenbuch je 5000 Rthl. für den Baron von der Marwitz, für die Frau des Oberlandrats Michaelis und für den Wirtschaftsrat Glenck eingetragen. Für jeden der drei Gläubiger wird ein Hypothekenschein in vim recognitionis ausgestellt, den der Fürst nach vier Wochen gegen Zahlung der Kosten aus dem Archiv erhalten kann.'
oe1bu14525-027: 'Eine Bescheinigung der südpreußischen Regierung aus den Betscher Land- und Hypothekenbüchern: Die Güter Betsche im Kreis Meseritz seien dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen durch Schenkungsurkunde vom 10. Juni 1797 und Erklärung vom 1. Dezember desselben Jahres verliehen worden; die Eintragung seines Besitztitels hänge nur noch an der vom Fiskus zu leistenden Resignation. Betsche sei früher geistliches Gut des Bistums Posen gewesen; Schulden habe der Fürst darauf bisher nicht aufgenommen, Schuldurkunden seien nicht zur Eintragung eingereicht. Unterzeichnet Steudener.'
oe1bu14525-028: Ein Hypothekenschein der Königlich Südpreußischen Regierung zu Posen für das adlige Gut Batkowo im Kreis Radziejewo, das mit dem Gut Siedlemin im Kreis Brześć als eingezogenes geistliches Gut des Domkapitels Wrocławek dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen erb- und eigentümlich verliehen wurde. Eingetragen sind der Besitztitel aufgrund der Verleihungsurkunde vom 1. Dezember 1797 und des Resignationsbriefs, ferner eine unbestimmte jährliche Abgabe an das Domkapitel und das Verbot der Veräußerung an geborene Polen ohne königliche Genehmigung. Schulden sind nicht eingetragen.
oe1bu14525-029: 'Eine Abschrift einer untertänigen Eingabe des fürstlich Hohenloheschen Bau- und Wirtschaftsrats Johann Wilhelm Glenck an den König: auf den höchsten Befehl vom 18. November, den Besitztitel (titulus possessionis) der fürstlich Hohenloheschen Güter Kopojno, Zagórów, Drzewce und weiterer zu berichtigen, habe er alles zur Beschaffung der Urkunden Nötige veranlasst; das bisherige Hindernis sei beseitigt und der Befehl binnen vier Wochen erfüllbar. Glenck bittet daher, bis dahin von Zwangsmaßnahmen abzusehen.'
oe1bu14525-030: Aufforderung der Königlich Südpreußischen Regierung an den fürstlich hohenlohischen Bau- und Wirtschaftsrat Glenck in Breslau, die Hypothekensachen des Gutes Swięcia und der dazugehörigen Güter Kopojno, Drzewce und Zagórów binnen 14 Tagen in Ordnung zu bringen. Andernfalls werde die Fiskalbehörde veranlasst, gegen seinen Auftraggeber, den Fürsten von Hohenlohe-Ingelfingen, vorzugehen. Unterzeichnet Meuser, mit Nummer 2092.
oe1bu14525-031: 'Aufforderung der Königlich Südpreußischen Regierung an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen: da er das Gut Trąbczyn mit Zubehör vom Fiskus erworben hat, muss der Besitztitel zuerst im Hypothekenbuch eingetragen werden. Dazu soll der Fürst binnen vier Wochen eine vidimirte Abschrift des Urteils einreichen, mit dem das gesamte Vermögen des Anton von Prusimski dem Fiskus zugesprochen wurde, dazu eine Bescheinigung des zuständigen Gerichts über die Rechtskraft des Urteils.'
oe1bu14525-032: Ersuchen der Kalischer Behörde an die Oberregierung in Breslau, den regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen entsprechend der Anforderung vom 24. September des Vorjahres nun bei nächster Gelegenheit den Huldigungseid (Homagium) leisten zu lassen und das darüber aufgenommene Protokoll zu übersenden. Ein knappes Schreiben von wenigen Zeilen, unterzeichnet von Schultz; weiterer Inhalt ist nicht vorhanden.
oe1bu14525-033: 'Ein Konzept zweier Schreiben Glencks an die Königliche Kammer und an die Regierung zu Posen: Nachdem die Regierung im Vorjahr die Berichtigung des Besitztitels der Hohenloheschen Güter binnen vierzehn Tagen gefordert und andernfalls das Vorgehen des Fiscus angedroht hatte, habe der Prinz von Hohenlohe die noch fehlenden Original-Schenkungsurkunden eingesandt. Im Namen seines Herrn bittet Glenck nun dringend um die baldige Resignation des Fiscus über sämtliche fürstlichen Güter in Cujavien und Betsche.'
oe1bu14525-034: 'Antwort der Königlich Südpreußischen Regierung auf eine Anfrage des fürstlich hohenloheschen Bau- und Wirtschaftsrats Glenck vom 13. desselben Monats: Die Resignation des Fiscus für die Güter Kolno und Kamionna ist bereits erfolgt, für die Betscher Güter ist ein Termin auf den 22. März angesetzt. Für die in Cujavien gelegenen, dem regierenden Fürsten von Hohenlohe-Ingelfingen verliehenen Güter ist die Resignation noch nicht beantragt; die Richtigstellung des Besitztitels soll unverzüglich durch einen zugelassenen Justizkommissar bewirkt werden. Unterzeichnet Götz.'
oe1bu14525-035: 'Bescheid der Königlichen Südpreußischen Kriegs- und Domänenkammer an den fürstlich hohenlohischen Bau- und Ökonomierat Wilh. Glenck in Breslau auf dessen Eingabe vom 13. desselben Monats: Für die Resignation sämtlicher Betscher und in Cujavien gelegener Güter des Fürsten von Hohenlohe-Ingelfingen habe der Kammerfiskal Beyer die nötige Anweisung zur Vornahme der Resignation seitens des Fiskus bereits erhalten. Unterzeichnet Münling.'
oe1bu14525-036: 'Bittschrift an den König: Die Regierung zu Posen habe schon länger die Berichtigung des titulus possessionis der fürstlich Hohenloheschen Güter verlangt, worauf der Fürst die dazu fehlenden Schenkungsurkunden im Original eingesandt habe. Namens seines Herrn bittet der fürstlich Hohenlohesche Bau- und Wirtschaftsrat J. Wilhelm Glenck um die schnellste Resignation des Fiscus auf sämtliche fürstlichen Güter in Cujavien und Betsche, damit die Sache endlich zum Abschluss kommt.'
oe1bu14525-037: Mahnung der Königlich Südpreußischen Regierung an den fürstlich Hohenlohe-Ingelfingenschen Bau- und Ökonomierat Glenck John, binnen einer letzten Frist von vierzehn Tagen der Verfügung vom 30. Oktober des Vorjahres nachzukommen und die Berichtigung des Besitztitels der Herrschaft Betsche zugunsten des regierenden Fürsten von Hohenlohe-Ingelfingen in den Land- und Hypothekenbüchern zu bewirken. Unterzeichnet von Götz.
oe1bu14525-038: 'Meldung Melzers an einen Bau- und Wirtschaftsrat, dass der Kammerfiskal zum Termin über die Resignation der Betscher Güter erneut nicht erschienen ist, weil ihm die Kammer noch keine Vollmacht erteilt hat; ein neuer Termin ist beantragt, doch werde die Sache erst vorangehen, wenn die Kammer dem Fiskal eine klare Anweisung gibt, was er zu resignieren hat. Vorgeschlagen wird, der Fürst möge Kammerpräsident von Harlem um Beschleunigung angehen. Nachschrift: das Appellationsurteil in der Sache mit dem Domkapitel und Kruhtswitz ist zugunsten der eigenen Seite ausgefallen.'
oe1bu14525-039: Anzeige des Ministers Hoym, dass Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, durch Kabinettsorder vom 23. des Monats die Stadt Kamionna mit dem Marktort Kulm, die Dörfer Trąbczyn, Szetlewek, Nowa wies, Łazy, Alt- und Neu-Laske, Osiny, Hauland Trąbczyński sowie Brzyce geschenkt erhalten hat; die Ausfertigung der Schenkungsurkunde werde beim Lehnsdepartement betrieben, die Schulden des vormaligen Besitzers von Prusimski bei der Regierung in Posen ermittelt. Ertrag mindestens 4000 Rthl jährlich; als Verwalter oder Verkaufsvermittler wird Kammerrat Peucker in Fraustadt vorgeschlagen. Beglaubigte Abschrift durch Sonnabend.
oe1bu14525-040: 'Abschrift eines königlichen Rescripts an die Kammern zu Posen und Petrikau: Die Übergabe der dem Prinzen von Hohenlohe-Ingelfingen verliehenen südpreußischen Güter sei bloß oberflächlich erfolgt; Personen mit Pfand- und Pachtverträgen, teils nachweislich gefälschten, seien ohne Prüfung ihres dinglichen Rechts im Besitz gelassen worden. Die Kammern sollen die Ansprüche prüfen, die Güter den fürstlichen Mandatarien zur freien Wirtschaft übergeben, Streitpunkte möglichst gütlich beilegen, nötigenfalls durch die Fiscale klagen, die Competenzgelder für die Geistlichkeit schleunig festsetzen und über jedes Gut einzeln berichten.'
oe1bu14525-041: 'Hoym beruhigt den Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen über die Übergabe seiner südpreußischen Güter: er habe den Kammern zu Posen und Petrikau schon am 26. des Vormonats durch Eilboten Anweisung zur schnellsten Übernahme gegeben, noch vor Ausstellung der letzten Schenkungsurkunde; seit Johanni sei der Fürst alleiniger Eigentümer. Die bisherigen geistlichen Besitzer sitzen seit dem 1. Juni 1796 nur für Rechnung des Fiskus, dürfen bis Juni 1798 weiterverwalten; Kompetenzgelder richten sich nach den Taxen, nach Abzug von 15 Prozent Verwaltungskosten und 50 Prozent Abgaben. Wieniec und Wolica bleiben dem Bischof von Cujavien. Beglaubigte Abschrift.'
oe1bu14525-042: Aufforderung der Königlich Südpreußischen Regierung an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, zur vollständigen Berichtigung des Besitztitels (Titulus possessionis) am Gut Szetlewek binnen vier Wochen eine vidimirte Abschrift des Konfiskationsurteils gegen Anton von Prusimski nebst einer Bescheinigung der Rechtskraft einzureichen. Unterzeichnet für die Regierung von Meuser, mit dem Vermerk Lucas in der Adresse. Ein kurzes Reskript ohne weitere Angaben zu Summen oder Bedingungen.
oe1bu14525-043: Abschlägige Antwort auf ein Gesuch des Fürsten von Hohenlohe-Ingelfingen vom 31. Januar, der eine vidimirte Abschrift des gegen von Prusimski ergangenen Konfiskationsurteils samt Rechtskraftbescheinigung erbeten hatte, um seinen Besitztitel an den Trąbczyn'schen Gütern in Ordnung zu bringen. Die Regierung erklärt, das Urteil sei nicht bei ihr, sondern bei der Regierung in Thorn ergangen; der Fürst müsse sich dorthin wenden. Die eingereichte Anlage wird zurückgegeben. Unterzeichnet Danckelmann und Enge[r].
oe1bu14525-044: 'Antwort auf eine Bittschrift des Fürsten von Hohenlohe-Ingelfingen vom 31. Januar, der in der Sache Fiskus gegen von Prusimski eine beglaubigte Abschrift des Konfiskationsurteils mit Rechtskraftbescheinigung erbeten hatte, um den Besitztitel (Titulus Possessionis) der ihm verliehenen Güter Trąbczyn zu ordnen: Das Urteil sei nicht bei der hiesigen Regierung, sondern bei der Regierung in Thorn ergangen, weshalb er sich dorthin wenden müsse; die eingereichte Anlage wird zurückgegeben. Unterzeichnet Danckelmann.'
oe1bu14526-001: 'Begleitschreiben zu übersandten Akten: Der Verfasser bittet dringend, die beiliegenden Witów-Akten dem Kriminalgerichtsrat in Grimm zu übergeben und mit ihm persönlich über den Vorgang zu sprechen. Die Akten seien lange in der Registratur zu Trąbczyn vermutet und gesucht worden; erst beim Umzug aus der Breslauer Wohnung nach Wilhelmsruh habe man sie unter den Papieren seiner Frau gefunden, die sie in seiner Abwesenheit erhalten, verwahrt und danach zu übergeben vergessen habe.'
oe1bu14526-002: 'Kaufpunkte über das adlige Gut Witów im Kalischer Departement, Kreis Warta: Forstinspektor Christian Friedrich Rochlitz verkauft als Bevollmächtigter des Fürsten von Hohenlohe-Ingelfingen an Martin Honrichs und Walęty v. Kwasiborski für 16000 Rthl, zahlbar in drei Raten mit 5 Prozent Zinsen. Ohne Titelgewähr für 1016 składy strittiger Äcker der Warthaer Bürger; bei ausbleibendem Konsens gilt ein Pachtjahr zu 800 Rthl. Vadium 1000 Rthl. Angehängt die Cession von 8000 Rthl Kaufgeld an den Bankier Carl Ferdinand Weigel in Breslau.'
oe1bu14526-003: Bestätigung eines Kaufvertrags in elf Paragraphen, mit dem Joseph von Jankowski aus Ninino sein freies Schulzengut Nr. 1 in Dormowe bei Birnbaum samt Gebäuden, Feldern, Wiesen, Teichen, Geräten und Aussaat für 2000 Rthl. preußisch Courant erblich an den Kreissteuereinnehmer und Hauptmann Andreas Ernst Gneust verkauft; genannt werden die jährlichen Abgaben an das Amt Betsche, Schafhaltung, Brau- und Holzrechte. Das Hohenlohe-Ingelfingensche Justizamt Betsche publiziert den Vertrag, wobei er Jankowski durch den Dolmetscher Hintsch polnisch verlesen wird; Fürst Friedrich Ludwig bestätigt unter Vorbehalt seiner Rechte.
oe1bu14526-004: Kaufvertrag in zehn Paragraphen, mit dem Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, die ihm 1796 geschenkten Güter Kollno und Kaemen (Kamionna) im Departement Posen, Kreis Meseritz, an den Bankdirektor George Conrad Leixner für 142000 Rthl verkauft; davon gingen 53139 Rthl 13 g an den eingewiesenen Gläubiger von Broniewsky, 88860 Rthl 10 g an den Fürsten. Verkauf in Pausch und Bogen, Nutzung ab Johanni 1804; übernommen werden zwei Kirchenkapitalien und die streitige Holzberechtigung in den Krobilawer Wäldern. Mit notarieller Beglaubigung und Leixners Genehmigung.
oe1bu14526-005: Ein Kaufvertrag in dreizehn Paragraphen, mit dem Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, die Güter Kollno und Kamionne mit Mühlen, Wäldern, Seen, Zinsen, Propinations- und Jagdrechten sowie der Gerichtsbarkeit in Pausch und Bogen an den Bankkassierer George Conrad Leixner in Frankfurt an der Oder für 142000 Rthl Courant verkauft. Gezahlt werden 76000 Rthl an Bernhardi, 53139 Rthl 13 Gr 8 4/5 Pf an den Rittmeister von Broniewsky und der Rest bei der Übergabe am 10. September; der Käufer übernimmt Abgaben und Kirchenlasten und beabsichtigt die Zerstückelung.
oe1bu14526-006: 'Erbpachtvertrag in vierzehn Paragraphen über eine Hufe Magdeburgischen Maßes (30 Morgen) bei Osiny, geschlossen vor dem Hohenlohischen Patrimonialgericht zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen und dem Bauern Blazy Kukulski: Kaufgeld 100 Rthl, bereits gezahlt, dazu jährlich 30 Rthl Erbzins in halbjährlichen Raten ab Weihnachten 1806, Freiheit von Frondiensten, aber Bier- und Mühlenzwang, Laudemium des zehnten Groschen und Vorkaufsrecht der Gutsherrschaft. Beigefügt sind die Vollmacht von 1805 und eine beglaubigte Abschrift.'
oe1bu14526-007: 'Ein Erbpachtvertrag in sechzehn Paragraphen, geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem holländischen Bauern Gottlieb (Bogumił) Sarre vom Peyserschen Hauland über 1 1/2 Hufen Magdeburger Maß Wüstland im Wald bei Trąbczyn: 150 Rthl Einkaufsgeld, bereits bezahlt, jährlicher Erbkanon von 30 Rthl je Hufe, also 45 Rthl in zwei Raten, drei Freijahre bis Johanni 1809, halber Kanon ablösbar, Bau-, Mahl- und Getränkezwang, Verzicht auf Nachlass in Unglücksfällen. Das Gerichtsprotokoll ist polnisch eröffnet; beigefügt ist die Vollmacht.'
oe1bu14526-008: 'Ein Erbpachtvertrag in sechzehn Paragraphen, geschlossen vor dem fürstlich Hohenloheschen Patrimonialgericht zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen und dem Einwohner Christian Friedenberger aus dem Szymanowicer Hauland über eine Hufe Magdeburgischen Maßes in der Trąbczyner Forst: 100 Rthl Kaufgeld, bereits gezahlt, dazu 30 Rthl jährlicher Erbzins, halb ablösbar, drei Freijahre bis Johanni 1809, Laudemium des zehnten Groschens, Mahl- und Bierzwang. Beigefügt sind die Vollmacht von 1805 und der königliche Konsens zur Zerstückelung der Herrschaften Zagorowo und Trąbczyn.'
oe1bu14526-009: Pachtvertrag in achtzehn Paragraphen über das Vorwerk Kopojno, den Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigter des regierenden Fürsten von Hohenlohe-Ingelfingen mit Maciey von Niedzwiedzki auf sechs Jahre von Johanni 1805 bis Johanni 1811 schließt, jährlich 1500 Rthl Courant, praenumerando; ohne Brauerei und Brennerei, ohne Inventar, in Pausch und Bogen. Geregelt sind Hand-Dienste der Komorniks und Häusler, Freimahlen, Königliche Abgaben, Brennholz, Baulast und Nachlaß bei Unglücksfällen. Ein Nachtrag vom 24. August fügt 13 Hufen für 625 Rthl hinzu, Gesamtpacht 2125 Rthl.
oe1bu14526-010: 'Vor dem fürstlich hohenlohischen Patrimonialgericht Trąbczyn schließen der Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigter des regierenden Fürsten Hohenlohe-Ingelfingen und Bauinspektor Johann Wilhelm Wollenhaupt einen Erbzinsvertrag in vierzehn Paragraphen über 18 Hufen Acker vom Vorwerk Drzewce und 2 Hufen Wiesen bei Wrąbczyn samt Wohnhaus und Brauhaus: Kaufgeld 300 Rthl je Hufe, zusammen 6000 Rthl, jährlicher Erbzins 300 Rthl, Zerschlagung in zehn Bauernstellen, Laudemium des zehnten Groschen. Ein zweites Protokoll hebt den Vertrag wieder auf; Wollenhaupt erhält 600 Rthl und quittiert alle Forderungen, räumt das Wohnhaus zu Michaelis für die Pächter Tietz und Schatzmann und behält 43 Rthl 1 Silbergroschen Bauverbesserung vor.'
oe1bu14526-011: 'Ein Erbzinsvertrag in zwölf Paragraphen, vor dem Patrimonialgericht Trąbczyn geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des regierenden Fürsten zu Hohenlohe-Ingelfingen und dem Schönfärber und Ratsherrn Johann Seymert aus Zagorowo: dieser erhält 3 Hufen Magdeburger Maß (2 Hufen 24 Morgen Acker, 6 Morgen Wiese) vom Vorwerk Trąbczyn für 900 Rthl Kaufgeld, zahlbar zu Johanni, und 45 Rthl jährlichen Erbzins in zwei Raten. Er baut ohne Bauhilfe, trägt alle Abgaben, unterliegt dem Bierzwang, ist frei von Diensten; bei Verkauf fällt Laudemium an.'
oe1bu14526-012: 'Ein Erbzinsvertrag in zwölf Paragraphen, vor dem Patrimonialgericht Trąbczyn geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Förster George Friedrich Kammer aus Pietrzykowo: Kammer erhält vom Vorwerk Przybysław 6 Hufen Acker und 20 Morgen Wiese samt Gebäuden für 2100 Rthl Kaufgeld, zahlbar zu Johanni und Weihnachten, dazu einen unveränderlichen jährlichen Erbzins von 100 Rthl. Er trägt alle Abgaben, unterliegt dem Dominium und dem Krugzwang, Nachlass bei Unglücksfällen ist ausgeschlossen.'
oe1bu14526-013: Ein Erbpachtvertrag in neunzehn Paragraphen, geschlossen zwischen dem Kriegs- und Forstrat Peter Friedrich August von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Amtmann Johann Gottlieb Tschachmann über 20 Magdeburgische Hufen (560 Morgen Acker, 40 Morgen Wiese) aus den Ländereien von Trąbczyn auf der Kopojno-Seite. Kaufgeld 300 Rthl je Hufe, zusammen 6000 Rthl, davon 200 Rthl angezahlt, 5800 Rthl zum 22. Juni fällig; jährlicher Canon 15 Rthl je Hufe, unablöslich. Weiterverkauf erlaubt gegen Laudemium des zehnten Groschens; Brau- und Brennzwang, Gerichtsbarkeit des Dominiums, kein Nachlass bei Unglücksfällen.
oe1bu14526-014: 'Erbzinsvertrag in dreizehn Paragraphen: Kriegs- und Forstrat von Triebenfeld übergibt als Generalbevollmächtigter des Fürsten von Hohenlohe-Ingelfingen dem fürstlichen Forstinspektor Carl Titz fünf Hufen Magdeburger Maß aus dem Vorwerksacker Trąbczyn, vom Weg nach Podbiele bis zum Mühlgraben samt Obstgarten, auf ewige Zeit in Erbpacht. Kaufgeld 300 Rthl je Hufe, zusammen 1500 Rthl in zwei Raten zu Johanni 1805 und 1806, dazu jährlich 75 Rthl Erbzins. Titz trägt Steuern, Abgaben an Ląd und Bauten selbst; Verkauf nur mit Zustimmung der Grundherrschaft gegen Laudemium.'
oe1bu14526-015: 'Ein Erbpachtvertrag in 22 Paragraphen, geschlossen vom Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen mit den unterzeichneten Erbpächtern über 270 Hufen Magdeburgischen Maßes aus den Gütern Trąbczyn, Łazy, Osiny, Neudorff und Przybisław: Kaufgeld 300 Rthl je Hufe, unablöslicher Erbzins von 15 Rthl jährlich in halbjährlichen Raten, vier Freijahre für Waldgrund, Laudemium des zehnten Groschens bei Besitzwechsel, Zwang zum Bierbezug aus der Herrschaft, Freiland für Schulmeister, Schulze und Kirche, gesamtschuldnerische Haftung. Ein Nachtrag verzeichnet bereits abgetrennte 156 Hufen 25 Morgen.'
oe1bu14526-016: Ein Erbpachtvertrag in achtzehn Paragraphen über das zu Trąbczyn gehörende Vorwerk Althütte von 10 Hufen 10 Morgen Magdeburgischen Maßes, geschlossen zwischen dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen, vertreten durch den Kriegs- und Forstrat von Triebenfeld, und den Einwohnern Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dämmel, Gottfried Damt und Christoph Schoenfisch. Kaufgeld 150 Rthl je Hufe, zusammen 1500 Rthl, davon 450 Rthl angezahlt; jährlicher Erbzins 225 Rthl, Freijahre für Rodeland bis 1808, Laudemium des zehnten Groschen, Bier- und Branntweinzwang. Ein früherer Vertrag vom 26. Mai wird aufgehoben.
oe1bu14526-017: Ein Kaufvertrag in siebzehn Paragraphen, geschlossen von Kunkel als Bevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen, Herrn der Herrschaft Trąbczyn, mit sechs Holländern (Martin Giering, Wilhelm Daniel Schulz, Gottfried Dumel, Michael Dumel, Gottfried Damt, Christoph Schoenfisch) über zehn Hufen und zehn Morgen des Vorwerks Alte Hütte zu 250 Rthl je Hufe, insgesamt 2500 Rthl in Raten (450 Angeld, 550 Johanni 1804, 1500 im März 1805), dazu jährliche Erbpacht, Holz-, Weide- und Ziegelrechte, 10 Prozent Laudemium und Bierzwang; gültig unter Vorbehalt der fürstlichen Genehmigung.
oe1bu14526-018: Beglaubigte Abschrift eines Erbpachtvertrags in 18 Paragraphen, durch den Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen die Herrschaft Betsche mit Vorwerken, Wäldern, Braurecht und Propination in Pausch und Bogen an die Stadt Betsche und die Dörfer Stalluhn, Kulligowo, Schartzig, Stocki, Schwichodzyn und Lowin überträgt, vertreten durch Matheus Młynkiewicz und Jan Chmara, für 180.000 Rthl und 1000 Rthl jährlichen Canon; die Gemeinden übernehmen 137.000 Rthl eingetragene Schulden. Jurisdiktion, Jagd, Laudemium von 10 Prozent und Forstaufsicht bleiben vorbehalten. Beigefügt ein Nachtrag vom 29. Juli 1804 und die königliche Genehmigung der Dismembration.
oe1bu14526-019: 'Ein Erbpachtvertrag in 18 Paragraphen, geschlossen am 28./29. Juli 1804 zwischen dem Generalbevollmächtigten Bauart Johann Wilhelm Glenck für Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen und den Bevollmächtigten Matheus Młynkiewicz für die Bürger von Betsche sowie Jan Chmara für Stalluhn, Kulligowo, Schartzig, Stocki, Schwiechodezin und Lowin: Vorwerke, Wälder, Seen und Propinationsrecht gehen in Pausch und Bogen für 180000 Rthl und 1000 Rthl jährlichen Kanon über, davon 137000 Rthl übernommene Hypotheken, 35000 Rthl bar, 8000 Rthl später. Vorbehalten bleiben Gerichtsbarkeit, Jagd, Schloss und 10 Prozent Laudemium.'
oe1bu14526-020: 'Schenkung des herrschaftlichen Wohnhauses in Swięcia an den Posener Gastwirt Friedrich Götzinger, erb- und eigentümlich, zur freien Verfügung: eine Anerkennung für seine Mühen und Reisen im Erbpachtgeschäft und weil er das Haus als Schankhaus zu der von ihm übernommenen Brauerei-Erbpacht gut nutzen kann. Das Wohnhaus war ausdrücklich ausgenommen von der am selben Tag erfolgten Erbpachtvergabe der Vorwerksgebäude mit Äckern, Wiesen und Wäldern an Johann Christian Birlack, Johan Götzinger, Joh. Siebert und Friedrich Götzinger. Ausgestellt von Friedrich Ludwig, Prinz von Hohenlohe.'
oe1bu14526-021: 'Punktation in zwölf Paragraphen zwischen dem Kriegs- und Forstrat Peter Friederich August von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und Franz Meierowitz über den erblichen Verkauf des Guts Witów im Wartedistrikt mit allen Einwohnern, Krügen, Ländereien, Schulzenamt, Gewässern, Gebäuden und Inventar in Pausch und Bogen: Kaufpreis 20.000 Rthl Courant, 8.000 am 23. April, 12.000 zu Johanni 1805, dazu ein ewiger Kanon von 500 Rthl jährlich, ablösbar mit 10.000 Rthl. Vollzug erst nach Aufhebung des Kaufs mit Honrichs; die 6.000 Rthl der verwitweten Obristin von Schliesen dürfen stehen bleiben, der Fürst tritt im Rang zurück. Die Konzession zum Gutsbesitz will der Verkäufer beim König erwirken, die Kosten trägt der Käufer.'
oe1bu14526-022: Übersendung einer beglaubigten Abschrift des mit dem Bankkassierer Leixner geschlossenen Kaufvertrags über die Güter Kolno und Kaemen an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, mit der Mitteilung, dass der Vertrag am selben Tag königlich bestätigt worden sei. Ein kurzes Begleitschreiben der Königlich Südpreußischen Regierung im Namen König Friedrich Wilhelms, ohne weitere Angaben zum Inhalt des Vertrages.
oe1bu14526-023: 'Königliche Bestätigung eines Kaufvertrags in zehn Paragraphen: Fürst Friedrich Ludwig von Hohenlohe-Ingelfingen verkauft die ihm 1796 von Friedrich Wilhelm II. geschenkten Güter Kolno und Kaemen (Kamionna) im Posener Departement an den Bankdirektor George Conrad Leixner in Pausch und Bogen für 142.000 Rthl., davon 53.139 Rthl. an den vormaligen Possessor von Broniewski gezahlt. Übernommen werden zwei Kirchenkapitalien, gelöscht wird ein Kapital von 100.000 Rthl. für von Triebenfeld; der Holzungsstreit gegen von Kwilecki geht als rem litigiosam mit über. Beigefügt sind die Vollmachten für Melzer und Guderian.'
oe1bu14526-024: 'Ablehnender Bescheid auf das Gesuch Friedrich Ludwigs, Fürst von Hohenlohe-Ingelfingen, vom 31. Dezember des Vorjahres, die Herrschaft Betsche den dortigen Bürgern und Landbewohnern in Erbpacht zu geben; der eingereichte Erbpachtvertrag wird zurückgesandt. Gestützt auf eine Kabinettsordre und ein Rescript der südpreußischen Finanzkammer wird die Erbverpachtung für unzulässig erklärt: der Adel des Landes würde Erwerbsmöglichkeiten verlieren, der einzige bedeutende Forst bei Betsche wäre der Verwüstung ausgesetzt, und die Bewohner besitzen schon genug Land und zu wenig Mittel.'
oe1bu14526-025: Ein Kaufvertrag über das Vorwerk Szetlewek bei Trąbczyn mit 1000 Magdeburger Morgen (459 Morgen Acker, 109 Wiesen, 19 5/8 Gärten, 380 zu rodendes Land, 32 3/8 Wald) samt allen Wirtschaftsgebäuden, geschlossen zwischen dem Bau- und Wirtschaftsrat Johann Wilhelm Glenck als Bevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Mahlmüller Samuel Lucke von der Mühle Białobrzeg bei Wrąbczynek, vorbehaltlich fürstlicher Ratifikation. Kaufpreis 12333 Rthl (8333 an den Pfandbesitzer von Radzinsky, 4000 an die Herrschaft), dazu 500 Rthl Kanon jährlich, Bauholz aus den Trąbczyner Wäldern, Propinationsrecht mit Brauhaus und Brennerei für 400 jährlich; Untertanendienste bleiben ausgenommen. Lucke erbittet vier Wochen Frist zur Beibringung seiner Mitkäufer.
oe1bu14526-026: 'Vor der Polizeiobrigkeit erklären der Polizeibürgermeister Nüchler aus Pyzdry, der Müller Luka aus Białobrzeg und der Schütze Reise aus Wrąbczynek ihren mit dem hohenlohischen Bau- und Wirtschaftsrat Glencke als Generalbevollmächtigten am 20. November 1798 geschlossenen Vertrag über die Parzellierung des Gutes Szetlewek in den Trąbczyner Gütern für null und nichtig: der Pfandbesitzer von Brzezinski hindert die Räumung. Bedingung sind 200 Rthl Ersatz der Reisekosten; die angeworbenen Siedler sollen sich allein an das Dominium halten. Glencke sagt Zahlung unter dem Vorbehalt fürstlicher Genehmigung zu.'
oe1bu14526-027: 'Bericht von Titz und Bancke an einen Bau- und Wirtschaftsrat: Der Müller Luka tritt vom Vertrag zurück, will die Einzelheiten in Kalisz regeln und hat die 25 Rthl erhalten; zwei von ihm mitgebrachte Landinteressenten wurden vertröstet, bis die Sache mit Trąbczyn und Herrn von Szucki beendet ist. Erbeten wird ein Vortrag bei der Königlichen Regierung, ob der Fürst zu den 1000 Rthl Abzugsgeld der Gemeinde zuschießt, sowie Anweisungen zum weiteren Verhalten. Nachschrift: Ein Tischler kaufte stattdessen ein Haus in Zagorowo.'
oe1bu14526-028: 'Bericht Glencks an den Kriminalgerichtsrat Grimm in Kalisch: Der Vertrag mit von Radzinski ist nach beiliegender Abschrift des Schriftwechsels aufgehoben. Die drei Kontrahenten Luck, Kriede und Nüchler treten nicht zurück, da sie bereits 18 Bauern mit Handgeld für fast 2/3 der Felder gestellt haben; der Mitkontrahent Griese stellt eine Kaution von 2/M. Rthl, die in Pyzdry gerichtlich beantragt werden soll. Die Schadensforderung sei von Radzinski anzurechnen. Ferner zum Slugoziner Wiesenstreit eine Karte und zur Erbpacht der Trąbczyner Holländer der Vorbehalt, das Privileg gelte nur für die ersten Besitzer, Sohn und Enkel.'
oe1bu14526-029: 'Anfrage des hiesigen Hofgerichts an Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, wegen des Vorkaufsrechts: Nach einem beigefügten Kaufvertrag vom 28. September hat Sigismund von Rzadkowski das in Głazewo gelegene Erbzinsgut an seine Halbschwester Susanna, geborene Treben, verkauft. Der Vertrag ist unter Vorbehalt der fürstlichen Rechte bestätigt. Der Fürst wird gebeten, binnen einer gesetzten Frist von Wochen zu erklären, ob er vom Vorkaufsrecht Gebrauch macht; nach Fristablauf gilt es als aufgegeben. Unterzeichnet Metzig und Neumann.'
oe1bu14526-030: 'Beglaubigter Auszug aus dem Privilegienbuch des Posener Domkapitels, deutsch und im lateinisch-polnischen Original: Bischof Theodor Fürst Czartoryski verkauft 1766 zu Dolsk den Eheleuten Simeon und Apollonia Rządkowski und ihren Nachfolgern eine wüste Hufe Acker im Dorf Głazewo beim Schlüssel Betsche samt herrschaftlich erbautem Wohnhaus und Scheune für 30 Ducaten in specie, gegen jährlich 130 fl. polnisch in zwei Raten, Kopfsteuer und Hibern, vier Hoftage auf dem Vorwerk Głazewo und Räumung der Wiese Obsko; je zwei Viertel Gerste geben eine Tonne Bier aus der Betscher Brauerei. Auszug durch den apostolischen Notar Melchior Janowski, Übersetzung beglaubigt.'

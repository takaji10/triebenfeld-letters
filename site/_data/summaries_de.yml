oe1bu14526-001: 'Begleitschreiben zu übersandten Akten: Der Verfasser bittet dringend, die beiliegenden Witów-Akten dem Kriminalgerichtsrat in Grimm zu übergeben und mit ihm persönlich über den Vorgang zu sprechen. Die Akten seien lange in der Registratur zu Trąbczyn vermutet und gesucht worden; erst beim Umzug aus der Breslauer Wohnung nach Wilhelmsruh habe man sie unter den Papieren seiner Frau gefunden, die sie in seiner Abwesenheit erhalten, verwahrt und danach zu übergeben vergessen habe.'
oe1bu14526-002: 'Kaufpunkte über das adlige Gut Witów im Kalischer Departement, Kreis Warta: Forstinspektor Christian Friedrich Rochlitz verkauft als Bevollmächtigter des Fürsten von Hohenlohe-Ingelfingen an Martin Honrichs und Walęty v. Kwasiborski für 16000 Rthl, zahlbar in drei Raten mit 5 Prozent Zinsen. Ohne Titelgewähr für 1016 składy strittiger Äcker der Warthaer Bürger; bei ausbleibendem Konsens gilt ein Pachtjahr zu 800 Rthl. Vadium 1000 Rthl. Angehängt die Cession von 8000 Rthl Kaufgeld an den Bankier Carl Ferdinand Weigel in Breslau.'
oe1bu14526-003: Bestätigung eines Kaufvertrags in elf Paragraphen, mit dem Joseph von Jankowski aus Ninino sein freies Schulzengut Nr. 1 in Dormowe bei Birnbaum samt Gebäuden, Feldern, Wiesen, Teichen, Geräten und Aussaat für 2000 Rthl. preußisch Courant erblich an den Kreissteuereinnehmer und Hauptmann Andreas Ernst Gneust verkauft; genannt werden die jährlichen Abgaben an das Amt Betsche, Schafhaltung, Brau- und Holzrechte. Das Hohenlohe-Ingelfingensche Justizamt Betsche publiziert den Vertrag, wobei er Jankowski durch den Dolmetscher Hintsch polnisch verlesen wird; Fürst Friedrich Ludwig bestätigt unter Vorbehalt seiner Rechte.
oe1bu14526-004: Kaufvertrag in zehn Paragraphen, mit dem Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, die ihm 1796 geschenkten Güter Kollno und Kaemen (Kamionna) im Departement Posen, Kreis Meseritz, an den Bankdirektor George Conrad Leixner für 142000 Rthl verkauft; davon gingen 53139 Rthl 13 g an den eingewiesenen Gläubiger von Broniewsky, 88860 Rthl 10 g an den Fürsten. Verkauf in Pausch und Bogen, Nutzung ab Johanni 1804; übernommen werden zwei Kirchenkapitalien und die streitige Holzberechtigung in den Krobilawer Wäldern. Mit notarieller Beglaubigung und Leixners Genehmigung.
oe1bu14526-005: Ein Kaufvertrag in dreizehn Paragraphen, mit dem Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, die Güter Kollno und Kamionne mit Mühlen, Wäldern, Seen, Zinsen, Propinations- und Jagdrechten sowie der Gerichtsbarkeit in Pausch und Bogen an den Bankkassierer George Conrad Leixner in Frankfurt an der Oder für 142000 Rthl Courant verkauft. Gezahlt werden 76000 Rthl an Bernhardi, 53139 Rthl 13 Gr 8 4/5 Pf an den Rittmeister von Broniewsky und der Rest bei der Übergabe am 10. September; der Käufer übernimmt Abgaben und Kirchenlasten und beabsichtigt die Zerstückelung.
oe1bu14526-006: 'Erbpachtvertrag in vierzehn Paragraphen über eine Hufe Magdeburgischen Maßes (30 Morgen) bei Osiny, geschlossen vor dem Hohenlohischen Patrimonialgericht zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen und dem Bauern Blazy Kukulski: Kaufgeld 100 Rthl, bereits gezahlt, dazu jährlich 30 Rthl Erbzins in halbjährlichen Raten ab Weihnachten 1806, Freiheit von Frondiensten, aber Bier- und Mühlenzwang, Laudemium des zehnten Groschen und Vorkaufsrecht der Gutsherrschaft. Beigefügt sind die Vollmacht von 1805 und eine beglaubigte Abschrift.'
oe1bu14526-007: 'Ein Erbpachtvertrag in sechzehn Paragraphen, geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem holländischen Bauern Gottlieb (Bogumił) Sarre vom Peyserschen Hauland über 1 1/2 Hufen Magdeburger Maß Wüstland im Wald bei Trąbczyn: 150 Rthl Einkaufsgeld, bereits bezahlt, jährlicher Erbkanon von 30 Rthl je Hufe, also 45 Rthl in zwei Raten, drei Freijahre bis Johanni 1809, halber Kanon ablösbar, Bau-, Mahl- und Getränkezwang, Verzicht auf Nachlass in Unglücksfällen. Das Gerichtsprotokoll ist polnisch eröffnet; beigefügt ist die Vollmacht.'
oe1bu14526-008: 'Ein Erbpachtvertrag in sechzehn Paragraphen, geschlossen vor dem fürstlich Hohenloheschen Patrimonialgericht zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen und dem Einwohner Christian Friedenberger aus dem Szymanowicer Hauland über eine Hufe Magdeburgischen Maßes in der Trąbczyner Forst: 100 Rthl Kaufgeld, bereits gezahlt, dazu 30 Rthl jährlicher Erbzins, halb ablösbar, drei Freijahre bis Johanni 1809, Laudemium des zehnten Groschens, Mahl- und Bierzwang. Beigefügt sind die Vollmacht von 1805 und der königliche Konsens zur Zerstückelung der Herrschaften Zagorowo und Trąbczyn.'
oe1bu14526-009: Pachtvertrag in achtzehn Paragraphen über das Vorwerk Kopojno, den Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigter des regierenden Fürsten von Hohenlohe-Ingelfingen mit Maciey von Niedzwiedzki auf sechs Jahre von Johanni 1805 bis Johanni 1811 schließt, jährlich 1500 Rthl Courant, praenumerando; ohne Brauerei und Brennerei, ohne Inventar, in Pausch und Bogen. Geregelt sind Hand-Dienste der Komorniks und Häusler, Freimahlen, Königliche Abgaben, Brennholz, Baulast und Nachlaß bei Unglücksfällen. Ein Nachtrag vom 24. August fügt 13 Hufen für 625 Rthl hinzu, Gesamtpacht 2125 Rthl.
oe1bu14526-010: 'Vor dem fürstlich hohenlohischen Patrimonialgericht Trąbczyn schließen der Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigter des regierenden Fürsten Hohenlohe-Ingelfingen und Bauinspektor Johann Wilhelm Wollenhaupt einen Erbzinsvertrag in vierzehn Paragraphen über 18 Hufen Acker vom Vorwerk Drzewce und 2 Hufen Wiesen bei Wrąbczyn samt Wohnhaus und Brauhaus: Kaufgeld 300 Rthl je Hufe, zusammen 6000 Rthl, jährlicher Erbzins 300 Rthl, Zerschlagung in zehn Bauernstellen, Laudemium des zehnten Groschen. Ein zweites Protokoll hebt den Vertrag wieder auf; Wollenhaupt erhält 600 Rthl und quittiert alle Forderungen, räumt das Wohnhaus zu Michaelis für die Pächter Tietz und Schatzmann und behält 43 Rthl 1 Silbergroschen Bauverbesserung vor.'
oe1bu14526-011: 'Ein Erbzinsvertrag in zwölf Paragraphen, vor dem Patrimonialgericht Trąbczyn geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des regierenden Fürsten zu Hohenlohe-Ingelfingen und dem Schönfärber und Ratsherrn Johann Seymert aus Zagorowo: dieser erhält 3 Hufen Magdeburger Maß (2 Hufen 24 Morgen Acker, 6 Morgen Wiese) vom Vorwerk Trąbczyn für 900 Rthl Kaufgeld, zahlbar zu Johanni, und 45 Rthl jährlichen Erbzins in zwei Raten. Er baut ohne Bauhilfe, trägt alle Abgaben, unterliegt dem Bierzwang, ist frei von Diensten; bei Verkauf fällt Laudemium an.'
oe1bu14526-012: 'Ein Erbzinsvertrag in zwölf Paragraphen, vor dem Patrimonialgericht Trąbczyn geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Förster George Friedrich Kammer aus Pietrzykowo: Kammer erhält vom Vorwerk Przybysław 6 Hufen Acker und 20 Morgen Wiese samt Gebäuden für 2100 Rthl Kaufgeld, zahlbar zu Johanni und Weihnachten, dazu einen unveränderlichen jährlichen Erbzins von 100 Rthl. Er trägt alle Abgaben, unterliegt dem Dominium und dem Krugzwang, Nachlass bei Unglücksfällen ist ausgeschlossen.'
oe1bu14526-013: Ein Erbpachtvertrag in neunzehn Paragraphen, geschlossen zwischen dem Kriegs- und Forstrat Peter Friedrich August von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Amtmann Johann Gottlieb Tschachmann über 20 Magdeburgische Hufen (560 Morgen Acker, 40 Morgen Wiese) aus den Ländereien von Trąbczyn auf der Kopojno-Seite. Kaufgeld 300 Rthl je Hufe, zusammen 6000 Rthl, davon 200 Rthl angezahlt, 5800 Rthl zum 22. Juni fällig; jährlicher Canon 15 Rthl je Hufe, unablöslich. Weiterverkauf erlaubt gegen Laudemium des zehnten Groschens; Brau- und Brennzwang, Gerichtsbarkeit des Dominiums, kein Nachlass bei Unglücksfällen.
oe1bu14526-014: 'Erbzinsvertrag in dreizehn Paragraphen: Kriegs- und Forstrat von Triebenfeld übergibt als Generalbevollmächtigter des Fürsten von Hohenlohe-Ingelfingen dem fürstlichen Forstinspektor Carl Titz fünf Hufen Magdeburger Maß aus dem Vorwerksacker Trąbczyn, vom Weg nach Podbiele bis zum Mühlgraben samt Obstgarten, auf ewige Zeit in Erbpacht. Kaufgeld 300 Rthl je Hufe, zusammen 1500 Rthl in zwei Raten zu Johanni 1805 und 1806, dazu jährlich 75 Rthl Erbzins. Titz trägt Steuern, Abgaben an Ląd und Bauten selbst; Verkauf nur mit Zustimmung der Grundherrschaft gegen Laudemium.'
oe1bu14526-015: 'Ein Erbpachtvertrag in 22 Paragraphen, geschlossen vom Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen mit den unterzeichneten Erbpächtern über 270 Hufen Magdeburgischen Maßes aus den Gütern Trąbczyn, Łazy, Osiny, Neudorff und Przybisław: Kaufgeld 300 Rthl je Hufe, unablöslicher Erbzins von 15 Rthl jährlich in halbjährlichen Raten, vier Freijahre für Waldgrund, Laudemium des zehnten Groschens bei Besitzwechsel, Zwang zum Bierbezug aus der Herrschaft, Freiland für Schulmeister, Schulze und Kirche, gesamtschuldnerische Haftung. Ein Nachtrag verzeichnet bereits abgetrennte 156 Hufen 25 Morgen.'
oe1bu14526-016: Ein Erbpachtvertrag in achtzehn Paragraphen über das zu Trąbczyn gehörende Vorwerk Althütte von 10 Hufen 10 Morgen Magdeburgischen Maßes, geschlossen zwischen dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen, vertreten durch den Kriegs- und Forstrat von Triebenfeld, und den Einwohnern Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dämmel, Gottfried Damt und Christoph Schoenfisch. Kaufgeld 150 Rthl je Hufe, zusammen 1500 Rthl, davon 450 Rthl angezahlt; jährlicher Erbzins 225 Rthl, Freijahre für Rodeland bis 1808, Laudemium des zehnten Groschen, Bier- und Branntweinzwang. Ein früherer Vertrag vom 26. Mai wird aufgehoben.
oe1bu14526-017: Ein Kaufvertrag in siebzehn Paragraphen, geschlossen von Kunkel als Bevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen, Herrn der Herrschaft Trąbczyn, mit sechs Holländern (Martin Giering, Wilhelm Daniel Schulz, Gottfried Dumel, Michael Dumel, Gottfried Damt, Christoph Schoenfisch) über zehn Hufen und zehn Morgen des Vorwerks Alte Hütte zu 250 Rthl je Hufe, insgesamt 2500 Rthl in Raten (450 Angeld, 550 Johanni 1804, 1500 im März 1805), dazu jährliche Erbpacht, Holz-, Weide- und Ziegelrechte, 10 Prozent Laudemium und Bierzwang; gültig unter Vorbehalt der fürstlichen Genehmigung.
oe1bu14526-018: Beglaubigte Abschrift eines Erbpachtvertrags in 18 Paragraphen, durch den Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen die Herrschaft Betsche mit Vorwerken, Wäldern, Braurecht und Propination in Pausch und Bogen an die Stadt Betsche und die Dörfer Stalluhn, Kulligowo, Schartzig, Stocki, Schwichodzyn und Lowin überträgt, vertreten durch Matheus Młynkiewicz und Jan Chmara, für 180.000 Rthl und 1000 Rthl jährlichen Canon; die Gemeinden übernehmen 137.000 Rthl eingetragene Schulden. Jurisdiktion, Jagd, Laudemium von 10 Prozent und Forstaufsicht bleiben vorbehalten. Beigefügt ein Nachtrag vom 29. Juli 1804 und die königliche Genehmigung der Dismembration.
oe1bu14526-019: 'Ein Erbpachtvertrag in 18 Paragraphen, geschlossen am 28./29. Juli 1804 zwischen dem Generalbevollmächtigten Bauart Johann Wilhelm Glenck für Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen und den Bevollmächtigten Matheus Młynkiewicz für die Bürger von Betsche sowie Jan Chmara für Stalluhn, Kulligowo, Schartzig, Stocki, Schwiechodezin und Lowin: Vorwerke, Wälder, Seen und Propinationsrecht gehen in Pausch und Bogen für 180000 Rthl und 1000 Rthl jährlichen Kanon über, davon 137000 Rthl übernommene Hypotheken, 35000 Rthl bar, 8000 Rthl später. Vorbehalten bleiben Gerichtsbarkeit, Jagd, Schloss und 10 Prozent Laudemium.'
oe1bu14526-020: 'Schenkung des herrschaftlichen Wohnhauses in Swięcia an den Posener Gastwirt Friedrich Götzinger, erb- und eigentümlich, zur freien Verfügung: eine Anerkennung für seine Mühen und Reisen im Erbpachtgeschäft und weil er das Haus als Schankhaus zu der von ihm übernommenen Brauerei-Erbpacht gut nutzen kann. Das Wohnhaus war ausdrücklich ausgenommen von der am selben Tag erfolgten Erbpachtvergabe der Vorwerksgebäude mit Äckern, Wiesen und Wäldern an Johann Christian Birlack, Johan Götzinger, Joh. Siebert und Friedrich Götzinger. Ausgestellt von Friedrich Ludwig, Prinz von Hohenlohe.'
oe1bu14526-021: 'Punktation in zwölf Paragraphen zwischen dem Kriegs- und Forstrat Peter Friederich August von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und Franz Meierowitz über den erblichen Verkauf des Guts Witów im Wartedistrikt mit allen Einwohnern, Krügen, Ländereien, Schulzenamt, Gewässern, Gebäuden und Inventar in Pausch und Bogen: Kaufpreis 20.000 Rthl Courant, 8.000 am 23. April, 12.000 zu Johanni 1805, dazu ein ewiger Kanon von 500 Rthl jährlich, ablösbar mit 10.000 Rthl. Vollzug erst nach Aufhebung des Kaufs mit Honrichs; die 6.000 Rthl der verwitweten Obristin von Schliesen dürfen stehen bleiben, der Fürst tritt im Rang zurück. Die Konzession zum Gutsbesitz will der Verkäufer beim König erwirken, die Kosten trägt der Käufer.'
oe1bu14526-022: Übersendung einer beglaubigten Abschrift des mit dem Bankkassierer Leixner geschlossenen Kaufvertrags über die Güter Kolno und Kaemen an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, mit der Mitteilung, dass der Vertrag am selben Tag königlich bestätigt worden sei. Ein kurzes Begleitschreiben der Königlich Südpreußischen Regierung im Namen König Friedrich Wilhelms, ohne weitere Angaben zum Inhalt des Vertrages.
oe1bu14526-023: 'Königliche Bestätigung eines Kaufvertrags in zehn Paragraphen: Fürst Friedrich Ludwig von Hohenlohe-Ingelfingen verkauft die ihm 1796 von Friedrich Wilhelm II. geschenkten Güter Kolno und Kaemen (Kamionna) im Posener Departement an den Bankdirektor George Conrad Leixner in Pausch und Bogen für 142.000 Rthl., davon 53.139 Rthl. an den vormaligen Possessor von Broniewski gezahlt. Übernommen werden zwei Kirchenkapitalien, gelöscht wird ein Kapital von 100.000 Rthl. für von Triebenfeld; der Holzungsstreit gegen von Kwilecki geht als rem litigiosam mit über. Beigefügt sind die Vollmachten für Melzer und Guderian.'
oe1bu14526-024: 'Ablehnender Bescheid auf das Gesuch Friedrich Ludwigs, Fürst von Hohenlohe-Ingelfingen, vom 31. Dezember des Vorjahres, die Herrschaft Betsche den dortigen Bürgern und Landbewohnern in Erbpacht zu geben; der eingereichte Erbpachtvertrag wird zurückgesandt. Gestützt auf eine Kabinettsordre und ein Rescript der südpreußischen Finanzkammer wird die Erbverpachtung für unzulässig erklärt: der Adel des Landes würde Erwerbsmöglichkeiten verlieren, der einzige bedeutende Forst bei Betsche wäre der Verwüstung ausgesetzt, und die Bewohner besitzen schon genug Land und zu wenig Mittel.'
oe1bu14526-025: Ein Kaufvertrag über das Vorwerk Szetlewek bei Trąbczyn mit 1000 Magdeburger Morgen (459 Morgen Acker, 109 Wiesen, 19 5/8 Gärten, 380 zu rodendes Land, 32 3/8 Wald) samt allen Wirtschaftsgebäuden, geschlossen zwischen dem Bau- und Wirtschaftsrat Johann Wilhelm Glenck als Bevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Mahlmüller Samuel Lucke von der Mühle Białobrzeg bei Wrąbczynek, vorbehaltlich fürstlicher Ratifikation. Kaufpreis 12333 Rthl (8333 an den Pfandbesitzer von Radzinsky, 4000 an die Herrschaft), dazu 500 Rthl Kanon jährlich, Bauholz aus den Trąbczyner Wäldern, Propinationsrecht mit Brauhaus und Brennerei für 400 jährlich; Untertanendienste bleiben ausgenommen. Lucke erbittet vier Wochen Frist zur Beibringung seiner Mitkäufer.
oe1bu14526-026: 'Vor der Polizeiobrigkeit erklären der Polizeibürgermeister Nüchler aus Pyzdry, der Müller Luka aus Białobrzeg und der Schütze Reise aus Wrąbczynek ihren mit dem hohenlohischen Bau- und Wirtschaftsrat Glencke als Generalbevollmächtigten am 20. November 1798 geschlossenen Vertrag über die Parzellierung des Gutes Szetlewek in den Trąbczyner Gütern für null und nichtig: der Pfandbesitzer von Brzezinski hindert die Räumung. Bedingung sind 200 Rthl Ersatz der Reisekosten; die angeworbenen Siedler sollen sich allein an das Dominium halten. Glencke sagt Zahlung unter dem Vorbehalt fürstlicher Genehmigung zu.'
oe1bu14526-027: 'Bericht von Titz und Bancke an einen Bau- und Wirtschaftsrat: Der Müller Luka tritt vom Vertrag zurück, will die Einzelheiten in Kalisz regeln und hat die 25 Rthl erhalten; zwei von ihm mitgebrachte Landinteressenten wurden vertröstet, bis die Sache mit Trąbczyn und Herrn von Szucki beendet ist. Erbeten wird ein Vortrag bei der Königlichen Regierung, ob der Fürst zu den 1000 Rthl Abzugsgeld der Gemeinde zuschießt, sowie Anweisungen zum weiteren Verhalten. Nachschrift: Ein Tischler kaufte stattdessen ein Haus in Zagorowo.'
oe1bu14526-028: 'Bericht Glencks an den Kriminalgerichtsrat Grimm in Kalisch: Der Vertrag mit von Radozimski ist nach beiliegender Abschrift des Schriftwechsels aufgehoben. Die drei Kontrahenten Luck, Kriede und Nüchler treten nicht zurück, da sie bereits 18 Bauern mit Handgeld für fast 2/3 der Felder gestellt haben; der Mitkontrahent Griese stellt eine Kaution von 2/M. Rthl, die in Pyzdry gerichtlich beantragt werden soll. Die Schadensforderung sei von Radozimski anzurechnen. Ferner zum Slugoziner Wiesenstreit eine Karte und zur Erbpacht der Trąbczyner Holländer der Vorbehalt, das Privileg gelte nur für die ersten Besitzer, Sohn und Enkel.'
oe1bu14526-029: 'Anfrage des hiesigen Hofgerichts an Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, wegen des Vorkaufsrechts: Nach einem beigefügten Kaufvertrag vom 28. September hat Sigismund von Rzadkowski das in Głazewo gelegene Erbzinsgut an seine Halbschwester Susanna, geborene Treben, verkauft. Der Vertrag ist unter Vorbehalt der fürstlichen Rechte bestätigt. Der Fürst wird gebeten, binnen einer gesetzten Frist von Wochen zu erklären, ob er vom Vorkaufsrecht Gebrauch macht; nach Fristablauf gilt es als aufgegeben. Unterzeichnet Metzig und Neumann.'
oe1bu14526-030: 'Beglaubigter Auszug aus dem Privilegienbuch des Posener Domkapitels, deutsch und im lateinisch-polnischen Original: Bischof Theodor Fürst Czartoryski verkauft 1766 zu Dolsk den Eheleuten Simeon und Apollonia Rządkowski und ihren Nachfolgern eine wüste Hufe Acker im Dorf Głazewo beim Schlüssel Betsche samt herrschaftlich erbautem Wohnhaus und Scheune für 30 Ducaten in specie, gegen jährlich 130 fl. polnisch in zwei Raten, Kopfsteuer und Hibern, vier Hoftage auf dem Vorwerk Głazewo und Räumung der Wiese Obsko; je zwei Viertel Gerste geben eine Tonne Bier aus der Betscher Brauerei. Auszug durch den apostolischen Notar Melchior Janowski, Übersetzung beglaubigt.'
oe1bu9454-001: 'Dringende Bitte um Verwendung beim Fürsten Staatskanzler Hardenberg: seit dem 13. Januar ohne Nachricht, fürchtet der Schreiber, der Kongress ende ohne Hilfe für ihn. Er erbittet allein einen Vorschuss von 112000 Rthl, wogegen die Fideikommissgüter sofort in Verwaltung zu nehmen seien; der Anwalt Kurz habe zugesagt, gegen 12000 Rthl bar und sichere Anweisung auf die 100000 Rthl den quittierten Schuldschein herauszugeben, womit Cosmars Exekution ende und dieser Rechnung legen müsse. Ein günstiger Bericht des Brieger Oberlandesgerichts vom 14. des Vormonats liege dem Kanzler vor. Ferner soll die Sache Trąbczyn und Kaemen weiterbetrieben werden: die vom König verliehenen und 12 Jahre besessenen Güter hätten die Polen 14 Wochen nach dem Tilsiter Frieden eigenmächtig genommen; der Kaiser möge Rückgabe und Ersatz der Einkünfte durch Frau Moszynska befehlen. Eingangs die Nachricht, Österreich, Russland und Preußen seien über Sachsen und Polen einig.'
oe1bu9454-001a: 'Bittschrift, mit der Triebenfeld einen soeben eingegangenen Brief des bedrängten Fürsten von Hohenlohe vorlegt und für dessen Notlage einen Vorschuss von 112000 Rthl erbittet: damit seien die kurländischen Erben, die Cosmar gegen ihren Willen aus den Fideikommissgütern gedrängt habe, sogleich befriedigt, Cosmars Macht beendet, der König aus der Verstrickung gelöst und die Gläubiger nach und nach bezahlt. Zugleich Anfrage, ob er zu den Trąbczyner Gütern im Kreis Konin die Urkunden einreichen dürfe.'
oe1bu9454-002: 'Beschwerde, der Fürst habe angeblich keine seiner sieben Briefe seit dem 13. des Vormonats erhalten, und dringende Bitte um 200 Ducaten, da 100 Rthl an den Staatskanzler und 70 Rthl an Barben zu zahlen sind; Triebenfeld schildert seine Not, Hunger und Mahnungen Jordans. Die Akten liegen beim Staatsrat Stägemann, Hardenberg und Humboldt seien gewogen, Geldzahlung und Bestellung eines Administrators erwartet. Graf Pourt: will kaufen, hat aber nur 150 Rthl bar. Dazu Nachrichten vom Wiener Congress, Sachsen, Kalisz und Wellington sowie die Forderung, Prinz Augusts Vollmacht für Cosmar überall zu widerrufen.'
oe1bu9454-003: 'Dringende Geldbitte: Triebenfeld hat seit fünf Monaten nur 932 Rthl statt der veranschlagten 1400 Rthl für vier Wochen erhalten, steht mit 170 Rthl beim Fürsten und bei Barben in der Schuld und kann nicht einmal die 12 fl für die Mietkutsche zu Minister Nesselrode und Geheimrat Schröder aufbringen; er erbittet umgehend 200 ff. Dazu Rat zur Besetzung der Königlichen Verwaltung der Fideikommissgüter: kein alter Bediensteter, Kaution in Bargeld, Wirtschafts- und Hüttenkenntnis, und ein schnell einzusendendes Pro Memoria mit Vorschlag an den Fürsten Kanzler.'
oe1bu9454-004: 'Nachrichten aus Wien über Napoleons Rückkehr: Grenoble und Lyon seien in seiner Hand, er stehe mit 30000 Mann und dem Geschütz aus Grenoble; Soult und Bertherand gälten als Anhänger, auf Napoleons Kopf seien 10 Millionen Francs gesetzt, wozu Massena 3 Millionen aus eigenem Vermögen zugesagt habe. Dazu Bitten um einen Korbwagen mit Plane und Pferde, um von Schlawenschitz aus die Schwester des Hofrats Barbe sowie Glaskisten der Hofräte Kraibe, Heym und Philipsborn aus Prag zu holen, um Pässe für Trommler und Kutscher nach Blizanow, um Eberhards Herreise und um weitere Blanketten; offen bleibt die Frage der Vollmacht und ob der Fürst selbst als Administrator auftreten wolle.'
oe1bu9454-005: 'Warnung vor einer angeblichen Cession: Der große Zerboni fordere von Trzciński 5000 Rthl aus der dem Fürsten zustehenden Forderung von 10000 Rthl, die dieser ihm überlassen haben solle; Triebenfeld hat den Anspruch bestritten und bittet um schnellste Auskunft, zumal Trzciński 1000 Rthl auf Zerbonis Anweisung an König für die Bischdorffer Sache gezahlt haben will, was Triebenfeld für Betrug hält – vielleicht auf einem Blankett des Fürsten. Vom Präfekten von Smiedecki in Kalisz erwartet er einen günstigen Bericht in der Entschädigungssache wegen Sokolnik; Antwort zur Betsche-Sache steht aus.'
oe1bu9454-006: 'Bericht über den Stand mehrerer Geschäfte: die württembergische Sache ruht, während Triebenfeld die Indemnisation und die kurländische Angelegenheit verfolgt; für die Entschädigung fordert er die Landratsämter Sokolnik und Wieruszew, nennt Minister Stein, Nesselrode und Zerboni. Über Kabinettsrat Allbrecht und Stägemann sei der König unterrichtet; ein Vergleich stehe binnen 48 Stunden bevor. Hardenberg verspreche nur; ausführlich über Cosmars Sturz, die Denunziation der kurländischen Erben und die Gelage in Syten. Bitte um 100 Ducaten per Kurier; Klage über August.'
oe1bu9454-007: Bittschreiben der Tochter des Kriegs- und Forstrats, Charlotte von Triebenfeld, die zum dritten Mal ohne Antwort an den Fürsten schreibt. Da sie die Adresse ihres Vaters nicht kennt, kann sie sich ihm nicht selbst mitteilen; die Hoffnung auf ein persönliches Gespräch mit ihm gibt sie auf. Sie schildert ihre Not als grenzenlos, bittet aber nur noch darum, ihr die Adresse des Vaters durch einen Untergebenen des Fürsten mitteilen zu lassen, um nicht weiter beschwerlich zu sein.
oe1bu9454-008: 'Dringende Bitte um Geld für die in Not geratenen Kinder Triebenfelds: nach Eingang von drei Briefen (8., 25. und 27. November) fordert er, dem Lüder 120 Rthl zu senden und bei längerem Aufenthalt monatlich weitere 60 Rthl; er lebe nur von geliehenem Geld. Ferner der Wunsch, vom Curz''schen Anwalt eine schriftliche Zusicherung zu erhalten, daß die Sache mit 112000 zu erledigen sei; von Kirchen sei als Oberpfleger selbst Partei, sonst wäre alles an Becke gegangen.'
oe1bu9454-010: 'Klage über ausgebliebene Post: Triebenfeld schreibt zweimal wöchentlich über Teichelmann und will beim Postdirektor Mann nachfragen lassen. Die fehlinische Sache ist samt einem Pro Memoria mit seiner Berechnung an die Kommission gegeben; statt Geld, das der Krieg verschlinge, sei mit Gütern zu rechnen. Der Fürst Kanzler habe Förderung zugesagt, von Steegemann noch nichts eingereicht. Dazu ausführliche Kriegsnachrichten, Bitte um Weiterleitung eines Briefes an C. Eberhard und Hinweis auf die Vollmacht des Prinzen August.'
oe1bu9454-011: Dringende Bitte, Eberhard sofort nach Wien zu schicken, damit ein Vergleich mit der Churp. Erbin zustande kommt; bei gutem Willen des Fürsten Staatskanzlers Hardenberg sei die Sache trotz 50- oder 100000 mehr zu regeln, koste aber fünf weitere Jahre Verwaltung der Güter, während dem Fürsten jährlich 6000 Rthl blieben. Nachrichten vom Kongreß, zu Sachsen, Talleyrand und Kriegsrüstungen. Klage, daß Prinz August Cosmar die Vollmacht lasse, Vorschlag zugunsten Prinz Adolphs, und Bitte um 100 Rthl für Starben.
oe1bu9454-012: Dringende Bitte um sofortige Übersendung von 200 Ducaten, ohne Geld sei in der Sache nichts zu erreichen und alles bisher Erreichte verloren. Dazu die Mahnung, Prinz August solle die Vollmacht schnell von Cosmar zurückfordern; vor dem jungen Herrn und seiner schriftlichen Zusage, die in Öhringen zurückgeblieben sei, wird gewarnt. Ferner die Nachricht, der König von Württemberg habe die Mediatisierten als Stände anerkannt und einen eigenen Verfassungsentwurf eingesandt, gegen den die Stände bereits protestierten.
oe1bu9454-013: 'Vertrauliche Klage über eine schlecht geführte Aktenaufnahme, in der Wichtiges übergangen und die Adolph-Sache breit ausgewalzt sei; Hahn wolle Adolph vom König anerkennen lassen und Koschentin kaufen, das angeblich jährlich 55000 Rthl trage, wogegen Schlawenschitz mit Oppurg kaum 40000 Rthl bringe. Dringende Geldbitte: Kursverluste bei den Papieren von rund 300 Rthl, Schulden bei Barbe, Kosten für Kleidung, erbeten werden 200 Rthl und blanko unterschriebene französische Formulare. Bericht über Krankheit, Not, einen Übersetzer für 15 Ducaten und eine in Aussicht gestellte Jahreszahlung von 6000 bis 7000.'
oe1bu9454-014: 'Klage über die ausbleibende Entscheidung auf die Beschwerde des Fürsten von Hohenlohe: aus Berlin heiße es, stattdessen sei eine Untersuchung vor dem Vormundschaftsamt eingeleitet, was die Lage nur verschlimmere, da Cosmar dann auch die seit 1812 rückständige Pacht für die Gläubiger zurückhalte. Ein Vergleich über die herzogliche Karl-Schuld scheiterte am Widerspruch der Generalmandatare; der Justizrat Bennebirg in Berlin lasse die Sache ruhen. Bitte, beim König die vollständige Übernahme der Schuld und den Nachlass der 35000 Rthl zu erwirken. Mit angefügter Notiz.'
oe1bu9454-015: 'Bericht aus Wien über den Stand der Verhandlungen: Ein Schreiben des Fürsten Staatskanzlers nach Öhringen teilt mit, daß gegen die Freigabe der 100000 Rthl, eines Vermächtnisses zur Schuldentilgung, nichts einzuwenden sei und Justizminister Kircheisen angewiesen wurde; der Vorschuß von 112000 Rthl gilt als gesichert, Cosmars Entfernung als beschlossen, eine Sache liegt noch bei Stägemann. Die polnischen Akten müßten beeidigt übersetzt werden, wofür 260 fl fehlen. Triebenfeld schildert Krankheit, Mittellosigkeit, 70 H Schulden bei Barbe und bittet dringend um Rettung und Unterstützung seiner Tochter.'
oe1bu9454-016: 'Bericht aus dem Wiener Kongressbetrieb: Über die Abreise der Monarchen gehen widersprüchliche Gerüchte, vom kommenden Samstag bis Anfang Mai. Triebenfeld hat beim Oberstleutnant von Thiel vorgesprochen, damit Prinz Adolph am 20. dem König von Preußen vorgestellt und zur Armee gestellt werden kann; Thiel sichert zu, vor dem 22. werde nicht abgereist. Mit Hardenberg wurde nicht gesprochen. Ferner Nachrichten über Murats Vormarsch bis Mantua und Bonapartes Rüstungen sowie Sorge um die Kostener Güter und ein angemessenes Äquivalent.'
oe1bu9454-017: 'Beschwerde über üble Nachrede: General Kleist habe in Kalisch dem Präfekten Graf Garczynski gegenüber geäußert, die Söhne des Fürsten hätten in Berlin erzählt, Triebenfeld stecke alle Einkünfte der Güter in die eigene Tasche; genannt werden Cabanis, Hecker, Honrichs und die Sequestratoren, die Untersuchung führe der Komornik von Chomanowski. Triebenfeld rechtfertigt sich mit Kriegsschäden, leeren Häusern und Pachtrückständen von etwa 30000, insgesamt 80000 bis 90000 Rthl, verweist auf die Invaliden-, Weigel- und Bayonner Kapitalien sowie 1400 bis 1500 Rthl jährliche Einkünfte, wehrt sich gegen Gerüchte Sommers über 1700000 Rthl Schulden und bittet dringend um Antwort wegen Sobottendorff, Weigel und der 50000 Rthl für den Invalidenfonds sowie um Übersendung des französischen Dekrets mit Originalquittung.'
oe1bu9454-018: Zurückweisung der vom Fürsten übersandten Urkunde samt Vollmacht als unnötig und untauglich, da eine Generalvollmacht vorliege und alle Einkünfte derzeit unter Sequestration stünden. Triebenfeld schildert seine Arrestierung in Berlin und den Zwangseinzug von 3121 bzw. 3125 Rthl durch den Intendanten Maluce und den Invalidenfonds (Quittung vom 14. Februar 1808) und verlangt Kapital, Zinsen und Kosten von 4219 Rthl. Erbeten wird eine Erklärung, diese Summe vorab aus alten und neuen Zinsen der Einwohner von Wrąbczyn, Alt Olesnica, Kopojno, Skokum, Swiątniki, Adelow, Sophienthal und Neu Swięce durch einen Komornik einziehen zu dürfen, dringend bis zum 15. oder 16.
oe1bu9454-019: 'Dringendes Drängen auf den Abschluss mit den Herren von Sobottendorff: Die Ländereien samt Gebäuden und einigen Wiesen sollen für 18 Jahre und 36000 Rthl verpachtet werden, nachdem sich Triebenfeld mit Tschachmann oder Cybalski und mit Hainrich verglichen hat, dem er wegen 1300 Rthl Abtretung eine Hypothek auf Blizanow geben muss. Erbeten wird die Vollmacht genau im vorgeschriebenen Wortlaut, da alles unter Arrest liege. Für den Warschauer Prozess werden 300 Rthl gebraucht; der Wytwiver-Prozess verspreche 4000 Rthl. Klagen über Lorenz, die Richter und eigene Not.'
oe1bu9454-020: 'Dringende Bitte um Eisenlieferung: Wegen einer neuen Kabinettsorder muss die Schuld bei van der Lahr in barem Courant statt in Papier gezahlt werden, was 1500 Rthl Verlust bringt. In Kontop sitzt ein Sequestrator, Triebenfeld fürchtet erneute Verhaftung. Er hat im Namen des Fürsten 1000 Rthl bar und 350 Ztr Eisen zu 6 Rthl angeboten und erbittet 950 bis 1000 Ztr Stab- und Bandeisen bis 20. April an seinen Ladeplatz Royadler, auch für Michaelis. Beigelegt ein Briefentwurf an van der Lahr, die Zagorowoer Vollmachtskosten von 163 Rthl und Grüße des Generals von Zastrow.'
oe1bu9454-021: 'Eiliger Nachtbrief über die Kriegsangst in der Gegend: die Leute fürchten das schnelle Anrücken der Russen und wenden sich an Triebenfeld. Er verspricht dem Fürsten die Rückgabe der Güter Trąbczyn und weiterer Besitzungen, spricht von Verbindungen zu Constantin und Talleyrand und bittet dringend um Geld, um "bestechen und arbeiten" zu können; er selbst sei mittellos, Richter habe seine Uhr verpfändet. Kontop und Schweineren seien für jährlich 14000 Rthl verpachtet. Bitte, Lombardin möge seinen Töchtern in Breslau 200 Rthl auszahlen; Urkunde und Geld erwartet er stündlich.'
oe1bu9454-022: 'Antwort auf das Verlangen des Fürsten, als Mitbeklagter benannt zu werden: Triebenfeld führt bereits vier Prozesse in fürstlichen Angelegenheiten – wegen des Invalidenfonds, gegen den Juden Oppenheimer (Anwalt Empich) und gegen die Obristin von Schlieffen –, zahlte dem Exekutor Alexius 132 Rthl, dem Kammergericht 127 Rthl, zusammen 259 Rthl Courant, und für den Schlieffen-Streit in Breslau und Polen gegen Meierowitz etwa 500 Rthl; es geht um 6000 Rthl Kaufgeld für Witów und 2500 Rthl rückständige Erbpacht. Er sendet drei Dekrete, nennt Stieger, Honrichs, Hawich und Radenski und klagt, Lombardini habe die für Sohn und Töchter angewiesenen 150 Rthl nicht gezahlt.'
oe1bu9454-023: 'Eindringliche Bitte um Geld: Lombardini habe die erbetenen 150 Rthl nicht an Triebenfelds Töchter gezahlt. Eine Abrechnung stellt den Fürsten gewährten 4300 Rthl die Aufnahmen bei v. d. Lahr (5140 Rthl, davon 1600 Rthl offen), Cote (9000 Rthl) und Blochsräff und Holzapfeln (3500 Rthl) sowie Kosten gegenüber, zusammen 17500 Rthl. Triebenfeld nennt 591 Rthl 18 g bezahlte und 185 Rthl fällige Gerichtskosten, Execution und Sequestration seiner Güter und listet sieben laufende Prozesse. Der Criminalrath Stenger solle Trąbczyn, Zagorowo, Betsche und Witów vindicieren; Honrichs soll Rechnung legen.'
oe1bu9454-024: Entwurf eines Schreibens des Fürsten an einen Geheimen Rat mit der Bitte, ein Darlehen von 100000 Rthl in einer Summe zu vermitteln, gesichert durch erste und alleinige Hypothek auf die südpreußischen Herrschaften Zagorowo und Trombschen; Vollmacht und Unterlagen sollen folgen, den Vermittlern werden 5 Prozent zugesagt. Beigefügt eine von Triebenfeld gezeichnete Aufstellung der 34 Ortschaften und des von der Kalischer Kriegs- und Domänenkammer geprüften Reinertrags von 40247 Rthl 14 g 11 d sowie ein Schuldenverzeichnis über 366000 Rthl, darunter Oppenheimer und Wolff 110000 und der Invalidenfonds 50000.
oe1bu9454-025: 'Bericht über eine eilige Reise nach Zagorowo, wo die Bauern sich erneut gegen die Grundstückstrennung erhoben hatten, und über ein durch Justizrat Bucholz zugesagtes Darlehen von 80000 Rthl aus Mitteln eines von Bredow: 30000 auf Kontop, 20000 auf Schwammern, 30000 auf Trąbczyn für die Grotowski-Hypothek Weigels. Davon 25000 an die Gräfin Schlabrendorff, 25000 an Weigel, 5000 an Hahn für Koschentin, 5000 bar an den Fürsten, 30000 für Triebenfeld zur Zahlung der Wulffs, gegen Hypothek. Dazu Tismars Verhandlung mit Nathusius über 360000 Rthl und Nachrichten Honrichs'' über neue Käufer.'
oe1bu9454-026: Erleichterung über die Nachricht des Sekretärs Koppe, daß der Fürst die Schlacht überlebt hat, verbunden mit der Übersendung einer Anweisung über 6000 Rthl, die Minister von Stein auszahlen soll; weitere 2000 Rthl hält Triebenfeld in Kassenscheinen bereit. Bei Stein hatte er 8000 Rthl auf eine Kontoper Hypothek von 10000 Rthl erhalten und will nun 20000 Rthl auf eine Schweiner Hypothek erbitten, da aus Südpreußen kein Geld kommt. Hoffnung auf die Kolziger Güter und dann 100000 Rthl.
oe1bu9454-027: Bericht über die gewaltsame Inbesitznahme von Trąbczyn und Kaemen durch die Familie Prusimski; Triebenfeld hat lediglich Protest einlegen lassen, um die von ihm eingetragene Summe zu sichern, rechnet aber mit Abweisung. Die Gemahlin des Generals von Sanitz habe sich an Kaiser Napoleon gewandt, dessen Antwort auch für den Fürsten maßgeblich sein werde. Triebenfeld reist nach Memel, möglicherweise weiter zu Kaiser Alexander, und hofft über Großfürst Constantin, dem er ein Gewehrgarnitur schenkte, zu wirken; am eigenen Hof sei nichts zu erreichen.
oe1bu9454-028: 'Meldung, dass die Trąbczyner Güter am 3. des Monats durch den Appellationsrichter von Lipski als Kommissar des Kalischer Appellationsgerichts weggenommen und dem Generalbevollmächtigten der Frau von Dąbska geb. von Prusimska, dem Domherrn von Jezierski, übergeben wurden; dagegen Protest unter Berufung auf den Tilsiter Frieden, Vorbehalt aller Rechte wegen gezahlter Schulden, vergeblich erbetene Copie des Dekrets der Regierungskommission zu Warschau. Dazu zwei neue Prozesse: Zehntforderung des Propstes Jwanski, und 7000 Rthl Ersatzforderung des Martin von Otocki und des Müllers Ekstaedt aus einem Pachtvertrag von 1798; erbeten werden der Breslauer Vergleich und eine Vollmacht.'
oe1bu9454-029: 'Anfrage um einen Termin: Nach der Begegnung mit Hofrat Hahn in Lohsen bei Brieg war ein Wiedersehen nach der Rückkehr aus Memel zugesagt worden; der Schreiber bittet nun um Nachricht, ob und wann er von Triebenfeld in Breslau aufwarten dürfe, da sein Herr, Seine Durchlaucht, danach gefragt habe. Zugleich die Einschränkung, dass in Schlawenschitz französische Einquartierung erwartet wird, er deshalb den Ort nicht verlassen und womöglich die Stallungen räumen und eine andere Wohnung suchen müsse.'
oe1bu9454-030: Bericht über die Verhaftung Triebenfelds in Berlin durch zwei französische Gendarmen, die ihn als Generalbevollmächtigten des Fürsten bis zur Zahlung der zweijährigen Zinsrückstände von 5000 Rthl auf die beim Invalidenfonds aufgenommenen 50000 Rthl festhielten; der Bankier Apenheimer habe die Schuld längst übernommen. Mit eigenen 2000 Rthl und einer Bürgschaft des Ministers von Zastrow über 5000 Rthl kam er frei. Bitte um Rücksendung der an Eysenhardt zedierten Bankanweisung über 6000 Rthl, um die verpfändete Hypothek von 10000 zurückzuerhalten; Zastrow bemühe sich um Rückgabe der Güter Trąbczyn.
oe1bu9454-031: Bericht über Triebenfelds Arrest wegen rückständiger Zinsen und seine Krankheit, verbunden mit der dringenden Bitte, die Zahlungsanweisung über 6000 Rthl zurückzusenden, damit die verpfändete Hypothek von 10000 Rthl frei wird; beigefügt der Hypothekenschein. Zur Anleihe genügt eine Zession der Hypothek; mit 150000 bis 250000 Rthl, in billig stehenden Tresorscheinen ausgezahlt, ließen sich die Schulden, auch Ephraims Forderung, tilgen. Klage über die an Honrichs erteilte Generalvollmacht, Vorschlag einer Beamtenliste (Haller 600, Mitschke 300, Cabanis 300, Honrichs 400 Rthl) mit 1900 Rthl Ersparnis, und Bestreitung der Prozesse Otocki, Exstädt, Radzinski, Iwanski und Przespolewski.
oe1bu9454-032: 'Aufstellung der Erträge der Herrschaft Zagorowo ohne Trąbczyn: Propinationsrecht 5000 Rthl, Zinsen der alten Untertanen 2000, dazu Erbpachtzinsen aus Olesnica, Wrąbczin, Emilienhain, Klein Ingelfingen, Grądzin, Swięcia, Alt Drewie, Swiątniki, Sophienthal, Klein Schrazberg, Kopojno u.a., Gerichtsgebühren und Laudemia, zusammen 27700 Rthl; Steuern tragen die Erbpächter. Dagegen Schulden von 148800 Rthl (Lichnowsky/Oppenheimer 32300, Invalidenfonds 50000, Glenck 20000 u.a.), Zinsen 7440, Überschuss 20260. Klage gegen Oppenheimer wegen der nicht gezahlten 50000; Aussicht auf ein Kapital von 200000 Rthl aus Holland.'
oe1bu9454-033: 'Antwort auf ein Schreiben vom 28. des Vormonats, verfasst in Krankheit: Triebenfeld bittet dringend, die Banko-Anweisung sofort von Eysenhardt zurückzufordern, sonst sei er ruiniert, und schlägt vor, mit beschafften Geldern Tresorscheine zu kaufen, um Oppenheimer, Eysenhardt und andere abzulösen, während der Invalidenfonds 50000 in Courant erhalte; er will gegen Zession der Hypothek von 250 Rthl selbst nach Berlin kommen. Warnung vor Generalvollmachten und Blanketten, da Honrichs den Preis der zu verkaufenden Hufen von 600 auf 300 Rthl gesenkt habe; erwirkte zudem französische Anordnung zur militärischen Eintreibung der Rückstände in Südpreußen.'
oe1bu9454-034: 'Antwort auf ein fürstliches Schreiben vom 7.: Honrichs Eingabe sei unsinnig; Triebenfeld habe ihm 21 Briefe geschickt und weder Geld noch Rechnung erhalten, Kosten habe Professor Rhoda bestreiten müssen. Nach Schmids Tod habe er neue Leute bestellt, Hochern für 600 Rthl jährlich nebst Naturalien wie Tietz. Dringend sei die Rückzahlung der für den Invalidenfonds geliehenen Gelder und die Rückgabe von Wechsel und Hypothek an Herrn von Zastrow; er erbietet sich, eine Hypothek von 250 Rthl abzutreten. Briefe an Amelang und Kopp liegen noch unbeantwortet; er selbst sei schwer krank.'
oe1bu9454-035: 'Dringende Bitte um Geld: Als Bevollmächtigter des Fürsten wurde Triebenfeld für 5000 Rthl Zinsen (zwei Jahre) samt 125 Rthl Kosten in Arrest genommen und von zwei Gendarmen bewacht; Minister von Zastrow habe ihm geholfen, die Summe bei van der Laar aufzunehmen, rückzahlbar am 14. Mai. Es fehlen noch 3125 Rthl. Zugleich soll Geheimrat Amelang die für 6000 Rthl ausgestellte, längst für ungültig erklärte Bank-Zahlungsanweisung zurückgeben; Hofrat Meyers Anweisung, 1600 Rthl an ihn und 3400 Rthl an Eysenhardt zu zahlen, verschärfe seine Lage.'
oe1bu9454-036: 'Rechtfertigung des Fürsten gegenüber Triebenfeld wegen der Obligation über 6000 Rthl: Im Januar 1807 habe er sie zur Abfindung einer alten Forderung des Justizrats Eysenhardt (vermittelt durch Geheimrat Meyer) zediert, gegen Rückzahlung von 3500 Rthl, ohne von der angeordneten Zahlungssperre zu wissen. Assessor Koeppe sei beauftragt, Eysenhardt 2500 Rthl zu zahlen und die Obligation zurückzugeben. Beiliegend 3000 Rthl Courant. Bitte um Besuch auf der Reise nach Wien, um Abtretung der Hypothek und um Rat, auch zum Verhältnis zum Minister von Stein.'
oe1bu9454-037: Dringende Bitte, Geheimrat Amelang sofort zur Rückgabe der bei ihm liegenden Assignation anzuweisen, damit Justus Eysenhardt kein Geld daraus ziehen kann; sonst müsse Triebenfeld die Summe der Bank ersetzen, deren Wechsel längst überfällig sei, oder die Assignation öffentlich für ungültig erklären lassen. Die Beilagen erhält Herr p. Koppen daher nicht. Für die Invalidenzinsen erbittet er 2000 Rthl, Laar brauche 5000 Rthl Courant, sonst sei Major von Zastrow in Verlegenheit. Auf polnische Güter sei kein Geld zu erhalten, wohl aber in Holland. Klage über schleppende Genesung.
oe1bu9454-038: 'Krankheitsbedingt kurzer Bericht über die Beschaffung von Geldern: 3000 Rthl von Baugnier Veit erhalten, die Anweisung an Amelang übergeben; der Kasse waren 5125 Rthl zugeflossen, 300 Rthl mit Hilfe des Ministers von Zastrow geborgt, neue Schulden von 5176 Rthl zu tilgen. Auf die von Stecher verpfändeten 4000 Rthl Mark''sche Landschaftsobligationen gab man kaum 500 Rthl. Statt Geld nahm der Käufer Holz und Bretter aus Kontop, wobei Triebenfeld 3480 Rthl Verlust erlitt und Ersatz fordert. Er drängt, 150000 Rthl aufzubringen, um Courland und alle Schulden zu bezahlen, und kündigt eine Reise nach Wien an.'
oe1bu9454-039: 'Bittschreiben um Geld: Nach der Rückkehr von einer Reise droht Triebenfeld erneut die Execution wegen fälliger 3000 Rthl, da er sich im Februar nur durch Hingabe dieser Summe der Verhaftung durch die Franzosen entzog und weitere Gelder für Gasthof, Kosten und Reisegeld aufnehmen musste. Von 6125 Rthl seien 3000 Rthl angewiesen, es blieben 3125 Rthl; aus Zagorowo komme nichts ein. Er erbittet eine Zahlungsanweisung über wenigstens 2000 Rthl, sucht inzwischen Bürgen für 14 Tage bis 3 Wochen und nennt als Anschrift den Justizkommissar Empuch; auch die große Anleihe möge der Fürst nicht vergessen.'
oe1bu9454-040: 'Vorschlag eines Anleihegeschäfts: gegen eine gerichtlich zu zedierende Hypothek auf Zagorowo über 250000 Rthl sollen 750000 Rthl Papiere gekauft und damit sämtliche Schulden getilgt werden; Oppenheimer mit 28000 Rthl Courant, der Invalidenfonds und Meyer Bernhard ergäben einen Vorschuss von 46000 Rthl. Neue Taxen seien wegen der Zerstückelung unmöglich. Ferner Bericht über Feinde bei Hofe, das Warten auf Prinz August, Reisen nach Königsberg, Holland und Paris, eigene Geldnot (4000 Rthl in Münze aufgenommen für von der Lahr) und zugesagte französische Militärhilfe zur Eintreibung der Rückstände.'
oe1bu9454-041: Rat an den Fürsten, nicht nach Erfurth zur Zusammenkunft der beiden Kaiser zu reisen, sondern die Rückkehr der Monarchen und des Großherzogs abzuwarten; Triebenfeld will sich diesen anschließen, sucht dafür einige tausend Rthl zu leihen und drängt den Fürsten, nach Schlesien und dem König entgegenzugehen, um wieder ins Amt zu kommen. Kritik an Stein und Kalckreuth. Die französische Regierung habe einen Teil der Sequestration aufgehoben; über Warschau und Kalisch seien Gelder zu erwarten. Metzig solle die von den Bürgern geschuldeten 8–9000 Rthl eintreiben.
oe1bu9454-042: 'Bittschrift um 2068 Rthl: Triebenfeld wurde von französischer Gendarmerie verhaftet, weil er als Bevollmächtigter des Fürsten 3521 Rthl Zinsrückstände an den Invalidenfonds zahlen sollte; gegen Bürgschaft von von Trevinitz und dem Gastwirt Mathieu freigelassen, beschaffte er das Geld über Wechsel, ein Pfand des Ministers von Zastrow und 9000 Rthl Staatspapier des Färbers Coste. Der Kaufmann Lahr klagt und hindert seine Abreise; Kontop ist sequestriert. Dazu Bericht über Protestationen in Zagorowo, die Klage gegen den Juden Oppenheimer (72000 statt behaupteter 105000 Rthl) und einen Plan, 122000 Rthl Schulden mit 40000-60000 Rthl abzulösen.'
oe1bu9454-043: 'Dringender Hilferuf wegen eines Wechselprozesses: Nach einem von Geheimrat Amelang übersandten Urteil muss Lahr statt der Papiere Bargeld erhalten, die restlichen 3000 Rthl in harter Münze; bei Nichtzahlung droht Triebenfeld Verhaftung in der Hausvogtey. Er bittet den Fürsten, die Summe bar oder in Staatspapieren zu hinterlegen, und verweist auf gute Aussichten in der Appellation sowie im Prozess gegen Oppenheimer. Das Geld für Lahr komme vom französischen Generalgouvernement zurück, die Sequestration werde nach Zinszahlung auf circa 10000 Rthl aufgehoben; dazu habe er den Justitiar Honrichs bestellt. Außerdem erbittet er die Lieferung von 600 Zentnern Eisen an den Kaufmann Michaelis, von dem er 2000 Rthl erhielt.'
oe1bu9454-044: 'Dringende Bitte um Geld, um den Lahrschen Prozeß abzuschließen und abreisen zu können: Lahr stehen nach dem durch Amelang mitgeteilten Urteil 3000 Rthl nebst Zinsen zu, die in Papieren gedeckt werden; Triebenfeld braucht 1500 Rthl, um seine verpfändeten Obligationen einzulösen. Mit Coste sind 9000 Rthl abgetragen, dazu 450 Rthl Zinsen und 118 Rthl an Oldekopp, zusammen 2068 Rthl. Der Kaufmann Michaelis biete deren Tilgung gegen 600 Zentner Eisen zu 4 Rthl, frei bis Oppeln. Ferner erbittet er 52 Rthl Auslagen im Prozeß mit Oppenheimer und 411 Rthl für die französische Gendarmerie, zusammen 932 Rthl.'
oe1bu9454-045: 'Bericht über die Flucht aus Berlin vor der Verhaftung: ein Urteil erster Instanz verlangte von Lahr sofort 3000 Rthl in Bargeld; der Kaufmann Michaelis gab 2400 Rthl, womit Mathieu bezahlt wurde. Amelang hat appelliert und rät, 3000 Rthl in Staatspapieren bereitzuhalten. Bitte um 100 Ducaten. Ein mit Michaelis geschlossener Vertrag über 600 Zentner Stab- und Bandeisen, bis 1. Mai frei zum Oberbaum vor Berlin, zu 4 Rthl Courant; Bitte, das Eisen Anfang April nach Kontop zu senden.'
oe1bu9454-046: 'Mitteilung über einen von Berlin aus gezogenen Wechsel, dessen Eingang samt Geld vorausgesetzt wird, und über eine ungünstige Rechtslage: die Akten liegen beim Appellationsgericht zur Entscheidung, doch eine königliche Erklärung in den Berliner Zeitungen bestimme, dass alle Obligationen auch bei Zahlung in Staatspapieren in Courant fortgelten; damit seien die Erleichterungen von 1806 aufgehoben. Dazu Klagen über Zinsen von 10, 12, 16, 20 bis 50 Prozent bei fälligen Forderungen. Teils unleserlich.'
oe1bu9454-047: 'Antwort auf vier vorgelegte Fragen: Ein vom König von Sachsen gewährtes Moratorium schützt die Güter drei Jahre, solange die Zinsen für die auf erster Stelle eingetragenen 50.000 Rthl des Invalidenfonds gezahlt werden; der Bankier Oppenheimer hat sein Wort nicht gehalten, weshalb in Berlin und Kalisch Prozesse laufen. Die Forderung des Meyer wegen Bauten wird als unbegründet abgewiesen, ebenso das Gesuch der Augustinower Kolonisten, die nach ihren Erbpachtverträgen ohne Nachlass zahlen müssen. Die Reise nach Schlawenschitz verhindert die Sequestration seiner eigenen Güter Kontop.'
oe1bu9454-048: 'Bericht über dreizehn gerichtliche Spezialvollmachten, die Triebenfeld mit dem Justizbürgermeister Hawich aus Zagorowo, nun Notarius publicus des Herzogtums Warschau, und Oberinspektor Hertes aufsetzen ließ: Abweisung der Dqbska in Sachen der Traperschen Güter, völlige Aufhebung der Sequestration, Einziehung und Auszahlung der Zinsen an rechtskräftige Gläubiger, Klage gegen Oppenheimer et Wolff in Kalisz wegen über 72000 Rthl, Rechnungslegung und Rückgabe der eigenmächtigen Landverkäufe des Sequestrators Honrichs, Forderungen gegen Niedzewiecki, 23000 Rthl von den Oleśnicer Erbpächtern, über 10000 Rthl von den Radrimini-Erben sowie Vertretung auf dem Warschauer Reichstag.'
oe1bu9454-049: 'Dringende Bitte um Eisen: Triebenfeld sitzt nach eigenen Worten in Kontop fest, steht unter Arrest und darf sich nicht entfernen, ehe er die auf sein Ehrenwort zugesagten 600 Zentner Eisen abgeliefert und die Entlassung durch den Justizbürgermeister Scheu in Neufall erhalten hat. Er bittet den Fürsten, das Eisen umgehend, womöglich die vollen tausend Zentner, nach Bogadel an seinen Administrator Neumann zu schicken; damit seien das Michaelisjahr und die Berliner Kosten gedeckt. Enttäuscht vermerkt er, dass ein Bote ohne Antwort kam. Nachschrift über ein angeblich an der polnisch-schlesischen Grenze stehendes russisches Korps.'
oe1bu9454-050: 'Bittschrift an den König, den Kriegsrat von Triebenfeld aus der Haftung (ex nexu) zu entlassen: Für rückständige Zinsen von 3125 Rthl auf ein Kapital von 50000 Rthl aus dem Invalidenfonds, auf die Güter Zagorowo gegeben, hatte die französische Verwaltung Triebenfeld durch Arrest und militärische Exekution gepfändet; dieser nahm gegen Wechsel 5140 Rthl beim Kaufmann van der Lahr auf. Nach 1000 Rthl Zahlung bleiben 3000 Rthl, weshalb van der Lahr klagte und mit Exekution droht. Der Postrat Amelang soll vergleichen, 1000 Rthl zahlen und den Rest in Stabeisen liefern; ein Originalschreiben van der Lahrs liegt bei.'
oe1bu9454-051: Nach Aufhebung der Execution kündigt Triebenfeld eine Reise nach Königsberg an und bittet, die Erbschaftssache und die Verhandlung mit dem schwer erkrankten Bethney in Malsdorff bis zu seiner Rückkehr in drei Wochen ruhen zu lassen. Zur neuen Beschlagnahme in Wohlen hat er Honrichs zu sich bestellt, der Zahlung mehrerer Tausend verspricht; vor Hawich, der übergebene Originalurkunden zurückhält, warnt er. Dazu Kriegsnachrichten der Zillichauer Bankiers über Hohenzollerns Corps bei Leipzig, ein Gefecht in Bayern und die Besetzung Münchens.
oe1bu9454-052: 'Bericht über den Fortgang einer Bittsache: Das Schreiben des Fürsten samt Anlagen wurde der Königin überreicht, die es wohlwollend aufnahm und die Sache dem Großkanzler übergab; dieser leitete sie an den Kabinetts- und Obertribunalrat Allbrecht weiter, mit dem Triebenfeld nun arbeitet. Wegen der Formstrenge des von Beym rechnet er mit langer Dauer. Dazu die Mitteilung, daß über politische Nachrichten und den Krieg Frankreichs mit Österreich auf königlichen Befehl nicht gesprochen werden darf, und ein Gruß des Generalleutnants von Köchn.'
oe1bu9454-053: 'Antwort auf zwei fürstliche Schreiben vom 24. und 29. des Vormonats: In der Erbschaftssache liegt noch kein Bescheid vor, die Akten sind mit dem Gutachten des Ober-Appellationsgerichts und des Cabinetsraths Albrecht beim Minister, den die Königin dränge. In der Kriegssache rät Triebenfeld dringend, unmittelbar an den König zu schreiben, der Commission offen zu antworten und niemandem zu schmeicheln; als zuverlässigster Fürsprecher gelte Major von Pirch, ferner General von Köckritz und Haacke. Nachrichten über Massenbach, Scharnhorst, Österreich, Rußland und Schills Vorstoß nach Cassel.'
oe1bu9454-054: Dringende Bitte, 600 Zentner Eisen (Stab-, Band- und Schieneneisen) spätestens bis 23. April nach Boyadel bei Grüneberg zu liefern, da Triebenfeld sich Michaelis gegenüber gerichtlich zur Lieferung in Berlin am Oberbaum zum 1. Mai verpflichtet hat, auf 2400 Rthl einen Wechsel gab und bei Verzug 500 Rthl Strafe drohen; sonst sei sein Kredit und Gut verloren. Weiter zu 400 Zentnern für von der Lahr (6 statt 5½ Rthl), zu Amelang, zu 4000 Rthl aus Zagorowo und zum Generalmoratorium gegen Weigels Forderungen.
oe1bu9454-055: 'Bericht über die Colonna-Erbschaft: Graf Götzen bezeugt, Colonna habe die Königin als Tochter angenommen und ihr sein Vermögen vermacht; das Testament sei zwar nach Hofrat Hahn nicht rechtsgültig, doch stützt Triebenfeld die dem Fürsten vermachten 100000 bzw. 10000 Rthl auf § 165 Tit. XII Teil I des Landrechts. Vorschlag, der Königin die Güter (etwa 3 Millionen) zu lassen und Wratislaw mit Geld abzufinden; Reibnitz, Gartner und Gasthum müßten 150000 Rthl zurückgeben. Dazu Klagen über von der Lahr, ein Brief der Gräfin Henckel zu Schimanowicz, Nachrichten über Rüchel, Massow und Bethusy sowie die Eisenlieferung nach Kontop.'
oe1bu9454-056: Dringende Bitte, die 1000 Zentner Eisen schnell nach Beyndel zu liefern, da Triebenfeld ohne sie nicht nach Königsberg abreisen und Michaelis nicht befriedigen kann; es fehlt an Reisegeld, ein Versprechen über 500 Rthl steht für Sonntag aus. Michaelis erhält Eisen für 600 Rthl, dazu 240 Rthl Fracht und Zoll nach Berlin, Lahr 2200 Rthl für Zinsen, Kosten und Kapital. Dazu Nachrichten über Kriegsvorbereitungen, Erzherzog Carl, General Astog, russische Truppen unter Großfürst Konstantin bei Bržesc, die Silberablieferung und einen Handbrief des Königs an General von Zastrow.
oe1bu9454-057: 'Bericht über eine Reise nach Königsberg, die Triebenfeld wegen Geldmangels nicht persönlich erstatten kann: er sei unterwegs um über 800 Rthl an Geld, Kleidung und Wäsche beraubt worden, habe keine 10 Rthl mehr, die Reise habe 713 Rthl gekostet, für sie 600 Rthl geliehen und 700 Rthl zu Johanni versprochen. Das Eisen liege unversandt in Kontop; 400 Zentner deckten die 2000 Rthl für den Lahrer nicht. Der König habe die harte Behandlung des Fürsten gerügt, in der Erbschaftssache sei an Hoyok nach Warschau geschrieben worden, ersatzweise an Graf Danckelmann; Aussicht auf das Generalgouvernement Schlesien. Dazu Nachrichten über Scharnhorst, Massenbach, Major von Pirch, Köckritz, Erzherzog Ferdinand, Falkenhausen und die "Schwarzen Brüder" um Crocow. Zudem Reise nach Kalisch zum dort arretierten jüngsten Sohn.'
oe1bu9454-058: Dank für 50 Fr, überbracht durch den Referendar Bally, womit sich Triebenfeld für vier Wochen von der drückenden Execution freikaufen konnte. Angekündigt werden Reisen nach Kontop und Kosten, wo Honrichs 80 bewaffnete Männer mit zwei Monaten Sold zu stellen hat und Cabani und Hecker bestellt sind, danach nach Schlawenschitz. Ausführlicher Bericht über Ausfuhrverbote, Spitzel und geheime Gerichte in Polen, über die ihm ergebenen Präfekten Garczynski und Zychlinsche, die Pläne zur Wiederherstellung Polens unter Constantine und die Unmöglichkeit, derzeit aus den Gütern etwas zu erlangen.
oe1bu9454-059: Klage über die anhaltende Sequestration von Kontop und die Exekutionen auf den Schweiner Gütern wegen 2560 Rthl Zinsen und der von der Lahr-Schuld, die Triebenfeld mit 300 Zentnern Eisen und 14 Schock Brettern (2570 Rthl) teils abgetragen hat; nötig seien 4560 Rthl. Getreide, 105 Stein Wolle und 2000 Klafter Holz (etwa 7000 Rthl) blieben unverkäuflich. Dazu Nachrichten über Honrichs' blockierte Geldausfuhr nach Kalisz, die Königsberger Kommission mit von Pirch, von Hache und Greischau sowie Gerüchte über Rußland, Österreich und Polen; der Fürst solle selbst an den König schreiben.
oe1bu9454-060: 'Verzweifelte Bitte um 1800 Rthl: Nach Antrag des Gläubigers von der Lahr ist alles in Schweiner und in Kontop versiegelt und mit Beschlag belegt, die Sequestration der Güter droht, die 200000 Rthl werten Güter würden im Zwangsverkauf ein Drittel bringen. Mit 1860 Rthl an alten und neuen Zinsen wäre die Sache abzulösen; Loen hat Getreide für 460 Rthl verkauft, Grävenitz eine Quittung übersandt. Honrichs, der Geld aus Zagorow beschaffen sollte, ist verhaftet. Das Geld soll eilig an Professor Schade gehen; der Reise zum Fürsten, zu der Lombardini schrieb, kann Triebenfeld nicht folgen.'
oe1bu9454-061: 'Dringende Bitte an den Hofrat, beim Fürsten 1800 Rthl Zinsen zu erwirken: ohne diese Summe könne Triebenfeld wegen der Affäre von der Lahr, der Pfändung und des dadurch ausgelösten Gerüchts, das die Sequestration der Güter nach sich zog, nicht in Breslau erscheinen. Mit dem Geld wolle er einen Teil seiner Güter abtrennen, den Kindern die Zinsen zum Unterhalt zuweisen und sich an den König wenden; sonst gehe er nach Königsberg. Beigelegt ein Verzweiflungsbrief seiner Tochter an den jüngsten Sohn. Abreise am 12. September, Ankunft in Schlawenschitz um den 16.'
oe1bu9454-062: 'Dringende Mahnung, endlich zu antworten und Geld zu schicken: Fünf Briefe seien ohne Antwort geblieben, dieser sechste gehe wie der letzte über den Oberpostdirektor Mann in Wien (Wohnung Massakrop 1156), an den der Fürst seine Briefe richten oder einen Boten mit Geld senden solle. Bericht über die Geschäfte: die Sache Kosch sei in Gang, bis zur Rückkehr aber nach Berlin zurückverwiesen; die kurländische Schuld werde bezahlt, der Vergleich aufgehoben, Cosmar müsse zurücktreten, das Fideikommiss und die polnischen Güter kämen zurück. Dafür leide er bittere Not.'
oe1bu9454-063: Nach sieben Wochen Krankheit berichtet Triebenfeld über eigene Geldnot in Kontop, wo erst 8000 Rthl rückständige Zinsen und Schulden zu zahlen sind, und über einen reich gewordenen Holzkäufer aus Stettin. Zu den fürstlichen Gütern rät er, mit dem kaufwilligen Unterpräfekten zu verhandeln, die entrissenen Güter zurückzufordern und nach Aufhebung der Sequestration die Gelder unmittelbar dem Fürsten zuzuleiten; für Honrichs erbittet er Bestätigung der vorläufig erteilten Vollmacht. Ausführlich schildert er die von Hecker angestiftete Denunziation gegen Honrichs wegen Beleidigung Bonapartes samt Widerruf der Anzeiger.
oe1bu9454-064: 'Nachricht vom Tod der Königin in Strelitz am 19. und von der Krankheit des Königs; die Collorina-Sache sei damit erledigt, es gehe nur noch um die 100000 Rthl und um die durch Köckritz zurückerbetenen Papiere. Triebenfeld klagt über Mahnungen wegen der Zinsen des Invalidenkapitals und drohende Sequestration seiner Güter. Beigefügt eine Abschrift zum Tauschgeschäft mit von Knobelsdorff: Landschaftstaxen von Bischdorff und Mollna, Schulden von 330000 Rthl, Forderungen Weigels (190000 Rthl) und Stössels (180000 Rthl), dagegen die Zagorowo-Güter zu 550000 Rthl. In einem Nachtrag vom 30. Oktober berichtet er über Hardenbergs Zusage, dem Fürsten zu 112000 Rthl zu verhelfen, und bittet dringend um 300 Rthl in Gold.'
oe1bu9454-065: 'Bitte um Lieferung von 300 Zentner Stab- und Bandeisen aus der Hütte Koschentin, frachtfrei bis Boyadel, gegen beiliegenden Wechsel zahlbar bis 18. Januar, zu 4 Rthl 12 g je Zentner, um damit Handel gegen Branntwein zu treiben; zugleich Bitte an Lombardini um 40 Stück. Triebenfeld schildert seine Schuldenlage: Invalidenfonds 3125 Rthl, Berliner Schulden bei Lahr und Holzapfel 7100 Rthl, Zinsrückstände der Güter 18000 Rthl, und erwartet die Aufhebung der Sequestration durch eine Kommission sowie seine Reise nach Schlawenschitz.'
oe1bu9454-066: Bericht über den erwarteten Urteilsspruch gegen falsche Denunzianten (sechs Jahre Festung) und die Aufwiegler, über Heiler und dessen Vater als Oberkonsistorialrat in Berlin sowie über Honrichs' Forderung; bei den Kolonisten in Trąbczyn soll kein Zinsnachlass bewilligt werden, Rückstände seien beim Verkauf anrechenbar. Drei erlegte Rehböcke sind für Präfekt und Tribunalspräsidenten bestimmt. Dazu Nachrichten über Truppenbewegungen und Napoleon, Bitte um Quittungen zur Freigabe von 70 Zentnern Iron in Neusalz (Frachtschulden der Schiffer Kulawy und Neumann, 243 Rthl 14 s.), Klage über Stempelkosten und Prozessausgaben sowie das Angebot, 2000 Zentner Stangeneisen für 8000 Rthl Courant zu liefern.
oe1bu9454-067: 'Meldung über die verzögerte Abreise, da Coste nicht erschienen ist und Schweinere noch nicht verpachtet ist, sowie über die Berliner Sache und den Witwenfonds. Vor allem die polnischen Güter: Hawich bezeichnet Honrichs als Betrüger, weshalb Triebenfeld beide vorlädt und einen deutschen Gerichtsschreiber nach Zagorowo schickt, um bei Untertanen und Pächtern zu prüfen, wer Gelder erhoben hat; Hawich, Honrichs und Heckert hätten sich Hufen angeeignet und bebaut. Ferner Nachrichten über Köckritz, Kleist, den falschen Grafen Götz und das bis Johannis 1810 verlängerte Moratorium; erbeten werden Fracht-, Zoll- und Wiegescheine für das im Mai gesandte Eisen.'
oe1bu9454-068: Dringende Bitte um sofortige Übersendung der Original-Schenkungsurkunde über Trapponin, die Honrichs am 28. des Monats im Termin vor dem Friedensrichter Kwilecki in König vorlegen muss; das Gericht nehme nur eine Abschrift, das Original komme zurück. Honrichs habe die Angaben Hawichs widerlegt; die durch Exekution erpressten Requisitionen von 22000 Rthl seien von den Kolonisten zu ersetzen. Klage gegen Lipschi wegen der Wegnahme der Güter und der von der Dqbsha nach Warschau gebrachten 15000 Rthl. Dazu Bitte um wenigstens 1000 Rthl Courant, da kein Geld im Hause sei.
oe1bu9454-069: Bericht über eine verzögerte Geldübernahme in Breslau, die sich auch wegen der schlechten Wege und des Wetters hinzog; trotzdem sei der Schreiber am 25. mittags eingetroffen und habe Honrichs und Cabanis noch angetroffen, die nach Auszahlung von 6000 f. an Honrichs und Übergabe der Schenkungsurkunden im Original noch am selben Tag abgereist seien. Von Triebenfeld leide stark am rechten Arm, wolle aber nach Abschluss seiner Geschäfte für einige Wochen nach Schlawentz kommen. Bally erbittet Weisungen und kündigt seine Rückkehr an.
oe1bu9454-070: Bericht über den Kassenverwalter Hecker, der wegen eines Missverständnisses des Oberpräfekten Garczynski im Amt bleibt, sich mit Leib und Gut verbürgt und bis Johanni alles zahlen will; Triebenfeld bestellt ihn samt Honrichs nach Costen zur gerichtlichen Bestätigung und will Cabanis als Kontrolleur beiordnen. Zu Trąbczyn ist Kramplitz nicht erschienen, neuer Termin am 2. April; Raczkowski, Künzel und Honrichs führen den Prozess. Angekündigt wird eine sechstägige Reise nach Berlin, auch wegen der Sache Colloma. 600 Rthl wurden in zwei Fass Ungarwein für Garczynskis Keller verwandelt; die Landschaft liquidiert für zweijährige Sequestration weitere 4000 Rthl Kosten.
oe1bu9454-071: Bericht über den eingeleiteten Prozess gegen Rochlitz, den Triebenfeld 1804 als Generalbevollmächtigter entlassen habe und der nie Rechnung gelegt habe; die Forderung sei ein betrügerisches Machwerk, der Fürst werde nichts zahlen müssen, wofür Glenck als Zeuge diene, während ein heimliches Zugeständnis des Baurats Otocki bestritten wird. Erbeten werden umgehend zwei bis drei unterschriebene und gesiegelte Blanko-Prozessvollmachten, damit Melzig den Fall führen und die liquiden Rückstände von etwa 18000 Rthl einziehen kann; danach Reise nach Schlawenschitz.
oe1bu9454-072: Nach dem Ausbleiben von Triebenfeld und Herrn von Brzechsta erklärt der Fürst, das Tauschprojekt mit General von Himmelfennig aufgegeben und stattdessen eigenmächtig ein neu angetragenes Tauschprojekt samt Besichtigung der Zagorower Güter zugelassen zu haben; der Druck der Gläubiger und die mit Sohn und Schwiegersöhnen getroffenen Abreden duldeten keinen Aufschub. Erbeten werden die Rücksendung der Original-Schenkungsurkunde über die Trąbczyner Ansprüche durch den Eilboten, Nachricht über den Warschauer Prozess und 300 Rthl für Lieutenant Sommer.
oe1bu9454-072a: 'Bericht über einen sub spe rati mit dem Unterpräfekten von Brzechsta geschlossenen Pachtvertrag über die Zagorower Güter; Brzechsta, durch eine Ladung nach Warschau verhindert, werde am 11. oder 12. März zurück sein und 2 bis 3000 Rthl in Barem nach Schlawenschitz mitbringen, wo der Fürst über Ratifikation oder andere Verfügung entscheide. Ferner: gewonnener Prozeß gegen die Wrobeziner Bauern vor dem Tribunal Solenne, geplante Execution wegen der Rückstände, die Olernizer Sache sowie die Trąbczyner Sache, die vor die Rada Stanu gebracht werden soll; 80000 Rthl Schulden bei 300000 Rthl Gutswert, 40000 Rthl Angebot der Altz-Hauländer für den Wald.'
oe1bu9454-072b: 'Bericht über den Stand der Geschäfte unter Berufung auf beiliegende Briefe des Unterpräfekten von Brzechsta und des Kreisrats Thiele: Brzechsta kann Warschau erst am 15. verlassen, reist dann mit eingetriebenem Geld nach Schlawenschitz und will die in der neuen Klassifikation auf Zagorowo gelegten 897 Rthl abwenden. Mit Hawich ist verglichen: 1200 Rthl Gehalt für anderthalb Jahre gegen Rückgabe der von Heiller verkauften 9 Hufen. Niedzwiedzki verlor seinen Prozess und soll 2000 Rthl zahlen; der Zinsrückstand soll nach Suspendierung Piekowskis eingezogen werden.'
oe1bu9454-072c: Übersandt wird abschriftlich ein über den Advokaten von Wieckowski eingegangenes Schreiben des Unterpräfekten Brzechsta. Daraus gehe hervor, dass Brzechsta seiner Geschäfte wegen erst am 15. des Monats aus Warschau abreisen werde und dass für die Herrschaft Trąbczyn gute Aussichten bestünden. Der Kreisrat Thiel teilt dies Triebenfeld mit; ein Eingangsvermerk hält den 12. März 1812 fest.
oe1bu9454-072d: Kurze Mitteilung an den Empfänger, die Abreise aus Warschau verzögere sich wegen verschiedener Geschäfte bis nach dem 15. des Monats. Die Angelegenheit Trąbczyn stehe nach zuverlässig eingeholten Nachrichten recht gut; Näheres wolle Brzechsta mündlich berichten. Weitere Ausführungen unterbleiben, da die Post abgeht. Anrede als „Bruder", Gruß an den Freund und beide.
oe1bu9454-072e: 'Kurze Mitteilung eines B. Brzechsta an den Adressaten, den er als Bruder anredet: Wegen mehrerer Geschäfte könne er Warschau erst am 15. des Monats verlassen. Die Angelegenheit Trąbczyn stehe nach sicheren Nachrichten, die er erhalten habe, gut; Näheres wolle er nach seiner Rückkehr mündlich erläutern. Mehr könne er aus Zeitmangel nicht schreiben, da die Post bereits abgehe.'
oe1bu9454-072f: 'Bericht über die Lage der Güter Zagorowo: Nach einer überzogen angesetzten Getreide- und Strohlieferung wies die Oberpräfektur Kalisch die Bitte um Exekution gegen die Bauern und Eintreibung rückständiger Pacht ab; darauf wurden die Güter erneut unter Sequestration gestellt. Triebenfeld erwirkte beim Unterpräfekten Brzechsta, die Lieferungen aus dessen 2000 Rthl zu bestreiten und die Quittungen als Pacht anzurechnen; der Sequestrator wurde abberufen. Dazu Einquartierungen von bis zu 62 Personen, geflohene Untertanen, eigene Krankheit, ausstehende Entscheidungen des Kassationshofs und drohende Verhaftung Honrichs'' wegen Unterschlagung.'
oe1bu9454-073: 'Antwort auf Triebenfelds Schreiben vom 1. Januar, nach Beratung mit von Weithausen aus Cosel und Bolli abgefasst: Das Pachtangebot des Herrn von Brzechsta findet Zustimmung, doch sollen Pachtdauer, Pachtzins und Bedingungen genau festgelegt, der Zins halbjährlich im Voraus gezahlt und eine Sicherheit in barer Münze gestellt werden, ebenso eine Rücktrittssumme für den Fall eines Verkaufs; Brzechsta müsse mehrere tausend Rthl mitbringen. Mit General von Schimmelpfennig stocken die Güterverhandlungen; der Verkaufsplan an Weigel und Baron von Stössel bleibt zweifelhaft. Erbeten werden 300 Rthl für L. Sommer, daneben Wildbret und ein großer Hund.'
oe1bu9454-074a: 'Arrestgesuch des Justitiars Seelmann für den General-Invalidenfonds an das Obertribunal: Triebenfeld schuldet aus einem Darlehen von 50000 Rthl Courant vom 1. Februar 1805 Zinsen von 9375 Rthl seit 1. November 1807. Die als Sicherheit verpfändete Obligation des Fürsten über 250000 Rthl auf die Zagorower Güter ist zu den Bayonner Summen gezogen, Kontop und Schwammern sind überschuldet. Beantragt wird Arrest auf 80000 Rthl Erbschaft aus dem Nachlaß der Fürstin von Sacken, Testamentsvollstrecker von Kircheisen, sowie Sequestration der Güter durch Advocat Mitschke in Kalisch.'
oe1bu9454-074b: 'Dringende Bitte um Besetzung einer Oberförsterstelle in Zagorowo: Für die Propination war der Neffe der Nageln vorgesehen, den diese jedoch zurückgerufen hat, so dass nun der Richter das Amt versehen muss; dessen Sohn hatte Triebenfeld bereits bestimmt. Vorgeschlagen wird der mittellose Radzowski (Radzewski), der mit 300 Rthl jährlich vorliebnehmen müsse; er solle schnellstens geschickt werden. Zugleich wird um die Meinung des Fürsten zur "Taufe" der Güter gebeten.'
oe1bu9454-074c: 'Ein Arrestbefehl des Königlichen Ober-Appellationsgerichts: Staats- und Justizminister von Kircheisen wird angewiesen, aus einem angeblichen Legat von 50000 Rthl, das dem Fürsten von Hohenlohe-Ingelfingen aus dem Nachlass der Fürstin von Sacken zustehe und das dieser dem Kriegs- und Forstrat von Triebenfeld in Kontop bei Grüneberg zur Deckung seiner Forderungen angewiesen habe, nichts an Triebenfeld auszuzahlen. Gleichlautend an Obermedizinalrat Cosmar und an Triebenfeld; Zustellung durch das Oberlandesgericht Schlesien in Glogau (Fülleborn).'
oe1bu9454-074d: 'Ladung des Kammergerichts an den Kriegs- und Forstrat von Triebenfeld in Kontop bei Grüneberg: Auf Antrag des Königlichen General-Invalidenfonds vom 30. des Vormonats ist ein Arrest auf das dem Fürsten von Hohenlohe-Ingelfingen von der verstorbenen Fürstin von Sacken vermachte Legat von 80000 Rthl bewilligt worden. Triebenfeld soll am 23. August, 10 Uhr vormittags, vor Oberappellationsgerichtsrat Koitsch persönlich oder durch einen Justizkommissar erscheinen, sich zu Einwendungen, drohendem Schaden und Höhe der Sicherheit erklären und über eine Aufhebung des Arrests gegen Bürgschaft verhandeln; bei Ausbleiben bleibt der Arrest bestehen.'
oe1bu9454-075: Rücksendung der überlassenen Briefe des Grafen von S., dessen offenes Verhalten Triebenfeld lobt, während ihm die Gelegenheit entgangen sei, dem Fürsten 40 bis 50000 Rthl zu verschaffen. Reinhardt melde aus Bonn, dass die Hilfe der Kasse noch nicht zustande gekommen sei. Minister von Goldbeck schreibe, Graf von Hoym behalte das südpreußische Departement, während ein Priebich dem Rat Krüger versicherte, Minister Haugwitz erhalte es. Chełmski habe noch nicht appelliert; die Güter könnten zu Johanni mitverpachtet werden. Die Form der Vollmacht folge nach Metzers Rückkehr.
oe1bu9454-076: Meldung, dass ein bestimmter Gütertausch eingeleitet sei und sich vielleicht bald erledigen werde. Triebenfeld kündigt an, Anfang September nach Berlin zu reisen und bis Ende des Monats dort bleiben zu dürfen; er hofft, den Fürsten bei guter Gesundheit wiederzusehen und ihm dann über mehrere Geschäftssachen mündlich und ausführlich zu berichten. Weitere Angaben zu den Gütern, Beteiligten oder Summen enthält das kurze Schreiben nicht.
oe1bu9454-077: 'Bericht über den guten Fortgang der Sache bei Hofe: ein Schreiben des Königs geht über den Geheimen Rat Beyhm ein, Minister von Voss soll umgehend berichten. Glen soll die Taxen genau nach eingereichtem Verzeichnis und den Verträgen anfertigen; die Kontrakte, außer denen Tietens, liegen bei Triebenfeld. Er hat einen Mann in Potsdam gewonnen, erbittet über Herrn von Michaelis eine Vollmacht sowie einige blanko unterschriebene Briefbogen und sorgt für ein Darlehen. Nachrichten über Burensprung, Wedel und Lindenau.'
oe1bu9454-078: Bericht über eine erste Unterredung mit dem Geheimen Rat Schultz, der das Schreiben des Fürsten an den Minister von Voss gelesen hatte, sich aber unwissend stellte; Michaelis erbat sich, vor etwaigen Einwänden gehört zu werden. Schultz verlangt eine bei der Registratur niederzulegende Vollmacht, die Michaelis so gefasst wünscht, dass er beim Südpreußischen Departement den Tausch der dem Fürsten verliehenen Güter gegen eine Herrschaft verfolgen und verhandeln darf. Erbittet die Nachrichten zur Sache Grotowski und die Quittung des Schneiders; lobt den Eifer von Triebenfelds.
oe1bu9454-079: 'Bericht über den Stand der Verhandlungen in Berlin: Minister von Voss'' Gutachten steht noch aus, Graf Schulemburg (nun Herr der Dispositionskasse nach Werners Tod) und Struensee zeigen sich geneigt, Minister Hoym sagt in Potsdam Unterstützung zu und würde 1000 Rthl für einen raschen Abschluss geben. Verteilung der Bestechungsgelder: 2500 Rthl an die Schulze-Tochter, 3000 Rthl an Klewis, 300 Ducaten an Hoffiskal Michaelis, Rest an Treskow. Dazu Nachrichten über den Streit um Krieg oder Frieden, Verhandlungen mit der Witwenkasse wegen Geldern für den Gütertausch und erneute Bitte um Blanko-Vollmachten.'
oe1bu9454-080: 'Nachtrag zu einem tags zuvor durch Capitain und Hahn übergebenen Schreiben: Minister Hoym sei sehr zufrieden aus Potsdam zurückgekehrt, wo nach Versicherung eines Dritten mehrere Angelegenheiten des Fürsten zur Sprache gekommen seien; der Monarch schätze ihn wirklich, weshalb Triebenfeld einen günstigen Ausgang erwartet. In Berlin werde viel von Märschen oder Krieg geredet, woran er nicht glaube. Von Herrn von Voss sei noch keine Antwort eingegangen.'
oe1bu9454-081: 'Bericht über den Stand des Gütertausches, zu dem Michaelis trotz des Drängens von Herrn von Triebenfeld und Eysenhardt nichts Verlässliches mitteilen kann: in der Registratur bei der Expedition sei noch nichts eingegangen, die Sache stecke offenbar noch im Schriftwechsel zwischen Minister von Roth und dem Geheimen Rat Schulze, entschieden sei nichts. Häufigere Besuche bei Schulze hält er für unnötig; er will sich nach Eintreffen der erwarteten Vollmacht des Fürsten ausweisen und eine verlässliche Nachfrage erreichen.'
oe1bu9454-082: 'Bericht über den Verbleib eines königlichen Kabinettsschreibens in der Sache des Fürsten: Da Minister von Voss in Havelberg weilt, wurde das Schreiben dorthin nachgesandt und ist beim hiesigen Departement noch nicht eingegangen; Eysenhardt hat in der Kanzlei nachfragen lassen und erwartet den Minister am kommenden Donnerstag zurück. Ist das Schreiben so bestimmt gefasst, wie Herr von Triebenfeld angibt, rechnet er mit gutem Ausgang. Zudem meldet er, Triebenfeld auf Rechnung des Fürsten 300 Rthl preußisch Courant gegen Handschein ausgezahlt zu haben.'
oe1bu9454-083: 'Bericht über den Stand der Entschädigungsverhandlungen: Krotoszyn werde dem Fürsten für die Suprenstischen Besitzungen sicher zugesprochen, bei Polajewo bestehe noch Zögern, doch nach Zusicherung des Geheimen Finanzrats Schulze sei auch dies zu erlangen, mit einem Gewinn von etwa 100000 Rthl; Widerstand der Kammern sei zu erwarten. Triebenfeld bittet, Prinz George bis zu seiner Ankunft in Breslau zurückzuhalten. Nachrichten über Minister Hoym, von Voss, Kabinettsrat Mencke, Fürst Reppnin und Gerüchte über französische Absichten auf Hannover.'
oe1bu9454-084: 'Bericht zur Krotoszyner Sache: Auf Befehl des Königs soll Herr von Voss sie regeln und hat dafür 4 Wochen erbeten, die Kammern prüfen den Ausgleich der Revenüen. Triebenfeld hat seine Pläne entworfen, reist nach Betsche und will Bronzewski klären; statt Polajewo empfiehlt er Güter aus der Landrätei Adelnau, zu 4 Prozent gerechnet. Erwähnt einen Brief an Oberst von Köckritz, Voss'' Abhängigkeit von Kriegsrat Nöldichen, Prinz Georgs Aufenthalt in Breslau und verwirrende Nachrichten aus Russland (Zubow, Panin, Repnin).'
oe1bu9454-085: 'Abschrift einer Ablehnung König Friedrich Wilhelms: Der vom Fürsten mit Schreiben vom 29. Februar vorgeschlagene Tausch seiner südpreußischen Güter gegen die Domänenämter Krotoszyn und Polajewo kommt nicht zustande. Nach dem Bericht des Staatsministers v. Voß bringe allein Krotoszyn 49043 Rthl Ertrag, zumal der Kriegsrat v. Triebenfeld schon 1795 für die Abtretung der Pacht 26000 Rthl Entschädigung erhielt; der Staat verlöre jährlich 17400 Rthl. Voß sei angewiesen, solche Tauschanträge künftig abzulehnen.'
oe1bu9454-086: 'Entwurf einer Rechtfertigung an den König gegen den Bericht des Staatsministers von Voss über den erbetenen Tausch der südpreußischen Güter gegen die Herrschaft Krotoszyn: die Zuzahlung von 30000 Rthl und Polajewo seien längst zurückgenommen, Voss habe sich allein auf Angaben des Kriegsrats Nöldichen gestützt und rechne Krotoszyn mit 49043 r., während es nur 30100 Rthl Pacht bringe, die eigenen Güter aber 41500 Rthl. Bitte um einen unparteiischen Kommissar zur Wertermittlung; Graf von Höym wird als befangen ausgeschlossen.'
oe1bu9454-087: 'Beschwerde über den gescheiterten Gütertausch: Der Fürst erklärt, er habe die ihm verliehenen Güter, in die er 50000 Rthl gesteckt habe, gegen die Krotoszyner Güter tauschen wollen, um darauf Geld aufzunehmen; der Edelmann von Karnhowsky habe 90000 Ducaten nur gegen solche Sicherheit zugesagt. Minister von Voss habe dem König auf Rat des Kriegsrats Nöldichen einen Verlust von 17400 Rthl vorgerechnet; dagegen führt er Erträge von 30100 gegen 41500 Rthl an, verzichtet auf Krotoszyn und bittet Köckritz, seine Bitte um unparteiische Untersuchung beim König zu unterstützen.'
oe1bu9454-088: 'Abschrift eines Schreibens an Minister von Voss: Der Fürst hält an seinem beim König eingereichten Gesuch fest, seine südpreußischen Güter gegen den Kreis Krotoszyn zu tauschen, wobei Polajewo ausdrücklich nicht einbezogen ist. Die ablehnenden Gründe beruhten allein auf den Berichten der Kommissarien, die den Wert von Krotoszyn zu hoch angesetzt hätten; eine unparteiische Prüfung durch Sachverständige werde dies zeigen. Er kündigt weitere Schritte beim König an, um den Vorwurf eigennütziger Absichten zu widerlegen, und erbittet Voss'' Unterstützung.'
oe1bu9454-089: 'Bericht über den Stand des Gütertauschs: Triebenfeld legt einen Brief Glencks mit Abschrift des Schreibens an den König bei und entwirft eine Argumentation gegen Herrn von Voss und dessen Beamten Nöldichen. Der König solle einen Kommissar bestellen oder den Tausch nach gleichem Ertrag entscheiden. Angeführt werden Glencks neunjähriger Pachtvertrag über 44500 Rthl, 10000 Rthl Sicherheit, 64000 Rthl Vorschüsse sowie die streitigen Erträge von Krotoszyn und Polajewo (23000 bis 49000 Rthl). Zur Geldsache: die Fürstin gibt höchstens 30000 Rthl, etwa 7000 Rthl fehlen noch.'
oe1bu9454-090: 'Bericht über die zugespitzte Lage der Sache in Berlin: Triebenfeld hält den Erfolg für möglich, äußert sich aber düster über die Minister und die Richter und verweist auf eine Äußerung des Fürsten in einem Schreiben an Glenck über eine "gewisse Person", die ein Scheitern begrüßen würde. Da die Fürstin Sacken die 7000 Rthl nicht vorschießen will, bietet Triebenfeld an, diese Summe auf seinen eigenen Namen aufzunehmen und sein gesamtes Vermögen dafür zu verpfänden.'
oe1bu9454-091: Dank für die Mitteilungen des Fürsten in der Sache des Gütertausches und Ausdruck der Freude darüber, daß der König die vorgeschlagene weitere Untersuchung angeordnet hat. Beyme versichert, seine Pflichten bei der weiteren Verfolgung der Angelegenheit ebenso gewissenhaft wie bisher zu erfüllen und keinen Weg unversucht zu lassen, der die Wünsche des Fürsten, das Entgegenkommen seines Herrn und das Interesse des Staates miteinander vereinbaren könne. Ohne Angabe von Gütern oder Summen.
oe1bu9454-092: 'Meldung, dass die vom Fürsten am letzten Posttag verlangten Auskünfte beschafft sind: Baurat Glenck habe am Sonntag die Quittungen der Gleissenbergs und Schneiders übergeben, so dass Michaelis dem General-Auditoriat auf dessen mitgeteilte Verfügungen antworten kann. Zur Lage der Krotoszyner Sache verweist er auf einen für denselben Tag erwarteten Bericht des Kriegsrats von Triebenfeld.'
oe1bu9454-093: 'Übersendung des auf die letzte Bittschrift ergangenen königlichen Handschreibens; Minister von Struensee hat die Akten dem König vorgelegt. Oberst von Köckritz hat ein Schreiben samt einem Pro Memoria beim König eingereicht, in dem Triebenfeld selbst anbietet, Polajewo auf 30 Jahre in Pacht zu nehmen: jährlich sechs Bauernhöfe auf eigene Kosten zu bauen, Ödland zu urbaren und 20000 Rthl Pacht zu zahlen. Weiter Nachricht zu von Cöln, zum Kabinettsrat B. und zur Sache der 7000 Rthl wegen Niedernhall, dazu Rat zum Umgang mit dem abgereisten Minister.'
oe1bu9454-094: 'Nachricht über ein mit derselben Post abgehendes Schreiben des Königs: Seine Majestät will den wahren Wert der südpreußischen Güter des Fürsten sowie von Krotoszyn und Polajewo genauer prüfen lassen, um die Besitzungen gegeneinander abwägen zu können; stehen dem beabsichtigten Tausch keine erheblichen Hindernisse entgegen, werde der König dem Wunsch des Fürsten gern entsprechen. Dank für das Vertrauen laut Schreiben vom 7. des Monats, verbunden mit dem Hinweis, die Sache gehöre nicht zum eigenen Ressort.'
oe1bu9454-095: 'Nachricht vom Stand des Gütertauschgeschäfts: Oberst von Köckritz lässt melden, die Sache stehe sehr gut und sei so gut wie abgeschlossen, werde aber erst nach Vollzug selbst schreiben; der Geheime Kabinettsrat handle nur auf Befehl des Königs gegen eigene Überzeugung. Triebenfeld warnt vor falschen Darstellungen aus Breslau und vor Herrn von V., rät zu seinem eigenen Vorgehen und kündigt einen Kurier an, worauf der Fürst wegen des Urlaubs schreiben möge; dazu Bemerkungen zur Säkularisation und zu Friedensgerüchten.'
oe1bu9454-096: Nachricht von Oberst von Köckritz, der Tausch sei so gut wie genehmigt und abgeschlossen; nur die Krankheit des Königs verhindere die Audienz und den Abschluss durch Bernhardi. Triebenfeld rät dringend, sofort beim König um Urlaub für die Reise nach Öhringen zu schreiben, das Schreiben per Eilboten an ihn zu senden und den Weg über Berlin, nicht durch Böhmen, zu nehmen; er nennt einen genauen Zeitplan bis Breslau. Zur Säkularisationssache folgt später ein Gutachten. Klagen über Wedels Bericht zur Krotoszyner Sache und ein Gutachten, Prot. könne 50000 Rthl tragen.
oe1bu9454-097: 'Nachricht, der König wünsche den Fürsten für einige Tage in Berlin zu sehen; Oberst von Zastrow habe dies beim Monarchen erfragt. Triebenfeld rät, den Aufenthalt im Reich vorerst nicht zu erwähnen, und zweifelt, ob eine halbjährige Abwesenheit aus Schlesien gut aufgenommen würde. Die Tauschsache stehe günstig: beide Güter sollen geprüft werden, damit weder Staat noch Fürst verlieren; nötig sei nur noch eine Kabinettsordre. Minister von Voss arbeite dagegen. Von den Säkularisationssachen ("Mausefallen") solle geschwiegen werden.'
oe1bu9454-098: 'Bericht aus Berlin über die Stimmung bei Hof und Ratschläge zum Verhalten des Fürsten: Triebenfeld bleibt bis zur Erledigung der Quartiersache und schickt Glenck voraus. Die Einladung des Königs zeige das Wohlwollen von König, Köckritz und Zastrow; ein Aufenthalt von drei bis vier Tagen sei ratsam. Bericht über die heimliche Heirat des Prinzen Solms mit der verwitweten Prinzessin Louis, deren Verlust des Titels Königliche Hoheit und die Versetzung des Gatten nach Ansbach. Warnung vor dem doppelten Spiel Hoyms und Wedells; von der Säkularisationssache solle der Fürst schweigen, sie sei besser in Wien mit Prinz George zu betreiben. Haugwitz steige, Schulemburg werde entfernt.'
oe1bu9454-099: 'Bericht über den Stand der Bemühungen um die Krotoszyner Güter: auf das Schreiben an Zastrow sei nur die beiliegende Antwort erfolgt, von Voss habe sich gemäßigt, Nöldichen sei in Bedrängnis, und von Köckritz erwarte den Abschluss durch Knobloch und Prittwitz, dem Triebenfeld Wildeganst als Beistand empfiehlt. Aus Berlin wird von Kriegsfurcht, erwarteten Veränderungen im Ministerium und geplanten neuen Kabinettsräten berichtet, ferner vom Entwurf des Kriegsrats von Cöln. Bitte, für Carl Theodor Fischbach in Betsche ein Patent als Kommissionsrat auszustellen; gegen Broniewski lägen nun Zeugen vor.'
oe1bu9454-100: 'Abschrift einer Mitteilung des Kabinettsrats Beyme: Der König habe das Schreiben des Fürsten vom 21. des Monats zur Kenntnis genommen und befohlen, die Antwort darauf – wie der Fürst selbst erwartet habe – bis zum Eingang des vom Staatsminister von Voss angeforderten Berichts aufzuschieben. Mit Eingangsvermerk zum 1. Februar 1799. Mehr als diese Nachricht über den Aufschub enthält das Blatt nicht.'
oe1bu9454-101: 'Abschrift einer Immediatvorstellung an den König: Der Fürst verteidigt seinen Vorschlag, seine südpreußischen Güter gegen die Herrschaften Krotoszyn und Polajewo zu tauschen, gegen die Einwände des Staatsministers von Voss vom 1. Dezember. Er bestreitet Reservefonds von 9540 Rthl, das angebliche Vorwerk (eine Holländer Hufe Triebenfelds), den Wert der von Goerne verwüsteten Waldungen und die Erwartung von 60000 Rthl Ertrag; Krotoszyn und Polajewo seien erst nach 36 Jahren Domänen. Neues Angebot: Verzicht auf Polajewo gegen 8000 Rthl jährlich auf Krotoszyn, Ausgleich in bar an die Seehandlung; erbeten werden eine Untersuchung durch die Kammer Posen und ein Bericht des Grafen von Höym.'
oe1bu9454-102: 'Bericht über den Stand mehrerer Güterangelegenheiten: Minister von Voss werde in etwa drei Wochen in Krotoszyn prüfen, weshalb auch von Prittwitz hinreisen solle; Chelmshi habe auch in zweiter Instanz verloren. Mit Broniewski sei ein Abschluß über einige Tausend möglich, doch werde erst Krotoszyn abgewartet; die Dismembration in Posen werde vorbereitet, nach der Vermessung von Kaemen und Kulm bringe Glenck etwa 6000 Rthl Zinsen. Wegen Brzyze erbittet Triebenfeld ein Schreiben an den Großkanzler um fünf Monate Fristverlängerung; Minister Hoym habe die Akten zur Prussiemski heimlich beiseitelegen lassen. Ferner Streit der Kammer um den Winieces-Wald und Nachrichten zum Krieg.'
oe1bu9454-103: 'Bericht über die Rechtsstreitigkeiten um die Güter: im Broniewski-Handel ist der Termin zur Instruktion auf den 14. gesetzt, ein Vergleich um etwa 20000 Rthl wird hinausgezögert, weil Rapackis Beweise die Forderung entkräften; der Chelmski-Prozeß ist in zweiter Instanz gewonnen, die Sachen Brzyza und Winzingerode bleiben bedenklich. Ausführlich rechtfertigt Triebenfeld gegen Prittwitz und den Minister den Wert der verliehenen Güter: Kaemen und Kulm 6000, Trąbczyn 8400, Szetlewek 1600, Brzyza 4000 Rthl, insgesamt 42640 Rthl, mit Vergleichen zu den Gütern Bischofswerder, Zastrow und Ruchel.'
oe1bu9454-104: 'Zuversicht, den Gütertausch binnen weniger Monate zum Abschluss zu bringen: Der König habe ihn gebilligt, sofern die Güter sich im Wert die Waage halten; eine Taxe der fürstlichen Güter solle von bekannter Seite verhindert und die Sache als Gnadenerweis dargestellt werden, was Triebenfeld als Betteln ablehnt. Graf Schlabrendorff nehme für die fälligen Zinsen einen Wechsel auf ein Jahr an; Prittwitz wird als Lügner bezeichnet. Ab 16. April Aufenthalt in Berlin. Die an Prinz George verkauften Güter seien nach Taxe über 700000 Rthl wert.'
oe1bu9454-105: Meldung, dass Graf Schlabrendorff befriedigt und die Quittung über 11085 Rthl Zinsen unmittelbar auf den Fürsten ausgestellt ist, während Triebenfeld für seine eigene Deckung nichts erhalten hat. Die Fürstin habe ihn in Breslau trotz dreimaliger Anmeldung nicht empfangen; ein Brief von von Prittwitz über seine Verhasstheit beim König habe dort Aufsehen gemacht. Nachrichten von Glenck im Prusimski-Prozess seien schlecht; mit den überlassenen Blankounterschriften wolle er beim Großkanzler eine Fristverlängerung erbitten. Dazu Berichte über Hof, König, Königin und Truppen.
oe1bu9454-106: 'Warnung vor einem vom Juden Dann über den Hoffiskal Michaelis angetragenen Güterkauf: Dann wolle den Käufer der hiesigen Lichtenauer Häuser, Herrn von Eckart, zum Kauf bewegen, doch sei dies bloße Maklerei, die er auch dem Prinzen George vorgelegt habe. Ferner drohe nach einem Contumacialdecret der Posener Regierung der Verlust der Brzyz''schen Güter, die Kammern und Forstbeamten intrigierten um die Wälder, Prozesse und Kosten nähmen kein Ende, das Tauschgeschäft stocke ohne Besichtigung und Taxe; die Minister handelten en Souverain.'
oe1bu9454-107: 'Übersendung eines Schreibens des Obristen von Zastrow, das ein Jäger überbracht hat; das königliche Kabinettsschreiben will Triebenfeld bis zur erwarteten Ankunft des Fürsten in Berlin zurückbehalten. Bei der Fürstin Sacken wurde er nicht empfangen und ließ den Brief nur überreichen. Bericht über die Ehesache: Hof und Monarch stehen auf Seiten des Fürsten, zur Partei der Fürstin zählen von Rietesel, der Advocat Cosmar, Minister Heinel, ein Hoym und Professor Selle. Die Fürstin erklärt, nie zurückzukehren und sich mit 2000 Rthl Apanage zu begnügen, da sie keine weiteren Schulden mitverschreiben wolle. Dazu die Nachricht, Suvarow sei geschlagen und gefangen.'
oe1bu9454-108: 'Notruf wegen der Geschäfte mit Prinz George: der Jude Kuh hat wegen 5800 Rthl Vollstreckung erwirkt, am Freitag droht Triebenfeld die Verhaftung; Münster soll in Breslau vermitteln, kommt aber erst Donnerstag. Präsident von Schuckman hat die Briefe übergeben, der Prinz antwortet nicht und schickt kein Geld. Eine Aufrechnung ergibt 270000 Rthl Lasten auf den für 280000 Rthl verkauften Gütern; weitere Forderungen von Lupman Meyr (20000 Rthl) und 12000 Rthl zum 7. August. Triebenfeld kündigt Abreise zum Prinzen an und bittet um Rat.'
oe1bu9454-109: Warnung vor Wildegansch, der in Berlin behauptet, im Auftrag des Fürsten zu handeln, tatsächlich aber mit An und Schlabrendorff ein Geldgeschäft erfunden habe, um den Fürsten bei den Kosten zu betrügen; eine Entscheidung sei binnen zwei Monaten nicht zu erwarten. Zugleich die Nachricht, von Bukowiecki biete für Betsche nur 2400 Rthl Jahrespacht. Dringende Bitte, dem Fürsten vorzutragen, dass die Juden Asch und Gad wegen des Schlabrendorff gegebenen Wechsels über 11000 gegen Triebenfeld klagen und Exekution erwirken wollen.
oe1bu9454-110: Bericht über den Abschluss der Verhandlungen um die Urkunden zu den geistlichen Gütern, die Triebenfeld nach Breslau nachsenden will, falls sein Aufenthalt länger dauert. Anfangs sei das 2½fache gefordert worden, weil der erste Ministerialbericht den Wert so angegeben habe; tatsächlich zahle er nur 240 Fr und etwa 200 Rthl. Das Geld hat er beim Geheimen Oberrevisionsrat Mathias geliehen und muss es binnen 14 Tagen zurückgeben; er bittet den Fürsten um raschen Ersatz, da er selbst vor Johanni nichts erhalte. Zur anderen Sache folgt Nachricht mit der nächsten Post.
oe1bu9454-111: Bittet dringend um eine Zahlungsanweisung über 240 f., also 200 Rthl Courant, um einen Schuldschein einlösen zu können; das Geld dafür sei nicht aufzutreiben, da Wildegansch ihm in Berlin allen Kredit verderbe. Dreihundert habe er dem vermittelnden Freund als Angeld gegeben, mehr könne er von seinem Reisegeld nicht entbehren, ohne festzusitzen. Oberst v. K. und v. Z. seien zuverlässige Freunde des Fürsten; wegen des üblen Geredes wolle er sich vorerst zurückhalten.
oe1bu9454-112: 'Nachschrift in dringender Not: Nach Mitteilung des Hofrats Wünster haben Wildegansch und der Jude Heymann in der Sache des Fürsten nichts erreicht; wegen des von Triebenfeld für den Fürsten unterzeichneten Wechsels über 11000 Rthl sei bereits Urteil ergangen, ihm drohe Haft, der Amtsbote Rudolph erscheine schon mehrfach an seinem Haus. Er bittet um schnelle Abhilfe, klagt über zerstörten Kredit, über Prinz George, der Güter für 750000 Rthl verkauft habe, und schlägt vor, Graf Schlabrendorff zur Rücknahme und Prolongation des Wechsels zu bewegen.'
oe1bu9454-113: 'Bittschreiben wegen der Schuld von 11000 Rthl bei Asch und Gad: Trotz der fürstlichen Versicherung, die Sache sei geregelt, liegt der Arrest weiter gegen Triebenfeld, und man droht ihm mit sofortiger Verhaftung, falls die zugesagten 4000 Rthl ausbleiben. Prinz George erkläre sich zu nichts und verzögere die Angelegenheit; Wildegensch lasse wissen, Asch werde bis Johannistag warten, was keine Rettung sei. Triebenfeld bittet inständig, die 4000 Rthl zu zahlen, da Ehre, Freiheit und Leben auf dem Spiel stünden.'
oe1bu9454-114: 'Nachricht an den Kriegs- und Forstrat von Triebenfeld über einen Gegner, der dem Fürsten viele Schwierigkeiten gemacht habe und nun, da nichts mehr herauszuholen sei, die Sache abschließen wolle; der Schreiber hofft auf baldige Erledigung und erwähnt einen Gruß von Schlabrendorff. In eigener Sache steht es weder gut noch schlecht: gegen Asch den Älteren wurde Anzeige erstattet, eine Erklärung wird noch erwartet, ebenso Rückgabe von Papieren und Erledigung des großen Wechsels binnen weniger Tage. Die Gesundheit des Schreibers bessert sich; stellenweise unsicher lesbar.'
oe1bu9454-115: 'Entschuldigung für das Ausbleiben beim Mittagessen: Der Pächter aus Schwammen habe dringend gerufen, weil die Bauern ihm den Gehorsam und die Dienste verweigern. Bericht über ein Gespräch mit dem Minister in der Sache Schlabrendorff und Quist; der Minister nehme das Schweigen des Fürsten übel, habe Schlabrendorff zum 15. des Monats nach Breslau bestellt und ihm dringend geraten, alle Klage zurückzuziehen, da man ihn scharf beobachte und er ihn sonst nicht schützen könne. Asch soll dies dem Grafen in Stolze übermitteln; Triebenfeld reist nach Landen, will aber am 15. zurück sein und auch Hirsch einspannen.'
oe1bu9454-116: 'Krankheitshalber ans Zimmer gebunden, bittet Triebenfeld um klare Weisung zum Verkauf der Güter, da er von den Polen ständig als Unterhändler herangezogen werde, ohne einen festen Plan zu kennen: es heiße, auf Trąbczyn lägen 150000 Rthl Schulden, die Walichnowski übernehmen solle, dazu 56000 Rthl und 5000 Rthl Kanon jährlich. Sein Vorschlag: von Walichnowski 60000 oder 80000 Rthl Erbkaufgeld sogleich und 4 bis 5000 Rthl jährlicher Erbpacht auf erster Hypothek, unverrückbar. Die Notiz solle Wünstere nicht zu sehen bekommen.'
oe1bu9454-117: 'Bericht über den Stand der 30000 Rthl: Weigel hat sich nach Stellung einer Sicherheit verpflichtet, das Geld liege bei ihm bereit, doch diskontiere die Bank erst nach Abtretung der Rechte durch von Grotowski. Hofrat Ebersbach entwarf dazu die Cessionsurkunde, die Grotowski gerichtlich vollziehen soll; der Fürst möge Weigels beigelegten Brief verschließen und per Estafette weiterleiten, auch ein Schreiben an Grotowskis Mandatar in Kalisch erwirken, damit die Zwangsversteigerung entfällt. Dazu Nachrichten vom Tod des Hauptmanns von Müllern und Morgenbeßers, von Nelsons Erfolg bei Toulon und Absprachen mit Bernhardi und Stösseln.'
oe1bu9454-118a: 'Bericht über mehrere Kaufinteressenten: Ein gewisser Kunckel erscheint mit zwei Kolonisten aus Oels, die 1500 Rthl zahlen wollen, sofern ein Vertrag geschlossen wird; Triebenfeld hält sie für Glücksritter ohne Mittel für die 17000 Rthl zu Martini und Johannis und erwartet endlose Prozesse. Kunckel hat zudem Auftrag des Oberamtmanns Nerlich, Trąbczyn oder Zagorow in Erbpacht zu erwerben, mit 80000 Rthl bar binnen eines Jahres. Walichnowski fragt nach Bedingungen, Urbanowski verlangt die Trąbczyner Taxe. Bitte um Weisung.'
oe1bu9454-118b: 'Bericht über die Stundung der 50000 Rthl: Gräfin Schlabrendorff wartet nur bis Weihnachten, genauer bis zum 1. Januar 1805; Homuth konnte keine längere Frist erreichen, da sie keine Zinsen erhält und Verluste geltend macht. Triebenfeld rät zuzustimmen, weil bis dahin keine Zinsen fällig seien und so 2500 Rthl gewonnen würden; Homuth erbittet die Abrechnung für die Ausfertigung und will die alten Wechsel zurückerhalten. Der Landmesser Cabanis ist abgereist und nimmt vor Ort ein Bauernfuhrwerk für 4 bis 5 Rthl, da hiesige Kutscher 20 Rthl verlangten.'
oe1bu9454-118c: 'Bericht über die Verhandlungen mit der Gräfin Schlabrendorff wegen der 50000 Rthl: sie will nur bis Weihnachten, genauer bis 1. Januar 1805, warten, Homuth konnte keine längere Frist erreichen. Da bis dahin keine Zinsen zu zahlen seien, rät Triebenfeld zur Annahme, es seien 2500 Rthl gewonnen; Homuth bittet um die Einwilligung, um das Nötige aufzusetzen und der Gräfin zur Vollziehung zu senden, und will dabei die alten Wechsel zurückerhalten. Ferner: der Landmesser Cabanis ist abgereist und will sich statt einer teuren Mietkutsche für 4 oder 5 Rthl einen Bauernwagen nehmen.'
oe1bu9454-119: 'Bericht über die stockenden Verkaufsverhandlungen: Uminski habe über Fürst Biron den Preis für die Kaemener Güter zu hoch gefunden und nur ein Empfehlungsschreiben an den Administrator verlangt; Triebenfeld hält das für Spott, da Broniszewski weiter in den Gütern sitze. Aus Zagorow eingetroffene Tabellen Glencks weisen etwa 31000 Morgen herrschaftliches Land zur Zerstückelung aus. Vorschlag, den Feldmesser Cabanis zu den Hussiten zu senden und etwa 500 zahlungsfähige Bauern als Siedler anzuwerben; Rapackis Kaufliebhaber seien wegen langer Zahlungsfristen abzulehnen.'
oe1bu9454-120: 'Bericht über den Fortgang der Ansiedlung: Cabanis hat Kaufwillige unter den Hussiten in Hussenich und Rentsch gefunden, die den Preis von 300 Rthl je Hufe und 15 Rthl jährlichen Zins für angemessen halten und Boten zu ihren mährischen Glaubensbrüdern gesandt haben; binnen 14 Tagen wollen sie geschlossen erscheinen. Die Gräfin Schlabrendorff verweigert die Herausgabe des Instruments vor Zahlung der weiteren 50; Hornuth bewirkt Frist bis 1. Januar 1805. Kunckel wird erwartet; Bitte um einige Thaler für dessen notleidende Mutter.'
oe1bu9454-122: 'Mahnung wegen einer Zahlung: Ein beigelegter Zettel war irrtümlich in der alten Wohnung liegen geblieben und traf erst am Morgen ein; Herr Homuth hat deshalb erneut geschickt und bittet dringend um baldige Erledigung, damit er dem Boten auch den Empfang der 166 Rthl 16 g. anzeigen kann. Cabanis reist eben mit der Post nach Hussinietz ab, wovon Triebenfeld schnellen Erfolg erwartet. Aus Berlin und Frankfurt an der Oder keine Nachricht.'
oe1bu9454-123: 'Vorlage eines mit Estafette eingetroffenen Schreibens von Kunckel mit der Bitte um Weisung: Ein Vergleich mit von Otocki sei nötig, und ein gütlicher Abschluss, bei dem sich Otocki mit 1500 bis 2000 Rthl begnüge, wäre vorteilhaft; ob Kunckel dazu Vollmacht erhalten solle, bleibe dem Fürsten überlassen. Triebenfeld warnt vor dem Gegeneinander von Kunckel und Jentsch und rät, beide in Schranken zu halten. Glenck habe die Kontoper Rechnungen zurückgelassen.'
oe1bu9454-124: 'Vorlage eines Antwortentwurfs an Kunckel zur Prüfung, ob er dem Willen des Fürsten entspricht, verbunden mit der Bitte, die beiden Briefe von anderer Hand ins Reine schreiben zu lassen. Triebenfeld entschuldigt sich mit seinem Zustand: seine Frau wird an diesem Tag begraben, er hat sich mit den Kindern zu seinem Schwager zurückgezogen und will erst später alles ausführlich darlegen. Eine Karte von Kopojno, Skokum und Swiątniki befindet sich bei ihm.'
oe1bu9454-125: Meldung, dass die Leute aus Olesnica mit den Geldern eingetroffen sind und sich um 4 Uhr beim Fürsten einfinden wollen. Triebenfeld hat bereits mit ihnen verhandelt und kündigt für den Nachmittag einen mündlichen Bericht über das Ausgehandelte an, das dem Fürsten seiner Ansicht nach zusagen wird. Ein kurzes Billett ohne Angabe der Summen oder der Bedingungen der Abrede.
oe1bu9454-126: 'Meldung über die Werbung von Siedlern: Cabunis (Cabanis) sei von den Hussiten zurück, die Leute hätten großes Gefallen an der Sache gefunden und wollten binnen 14 Tagen ihre Glaubensbrüder sammeln und alles regeln. Cabanis bringe weitere Nachrichten mit, über die Triebenfeld mündlich berichten will; es sei höchst nötig, dass sogleich jemand hinreise. Da er zugleich mit den Leuten aus Olesnicas verhandele, bittet er den Fürsten, nach der Parade auf eine Viertelstunde zu ihm zu kommen, um die Leute selbst zu hören und Befehle zu erteilen.'
oe1bu9454-127: 'Dringende Bitte um 900 Rthl: Triebenfeld muss für die vom Fürsten zugesagten 700 Rthl Inventariengeld, für die er gebürgt hat, samt Zinsen seit 1799 (175 Rthl) und 35 Rthl Gerichtskosten, zusammen 910 Rthl, selbst aufkommen, da der Fürst laut Beilage keinen Groschen Zinsen gezahlt hat. Seine Kasse sei erschöpft, weil er am Vortag 1537 Rthl 12 gg in der Nudnichischen Sache zahlte; Wildegans und Heyman Pincus versprächen Ausgleich. Sonst drohe Execution. Rückzahlung zu Johanni aus Holzgeldern.'
oe1bu9454-128: 'Bericht über den Stand der Auseinandersetzung mit den Pächtern: elf Prozesse sind prorogiert, mit Otcibi ist ein Abstand von 3000 Rthl, 2000 Rthl Sicherheit und 1000 Rthl für Saatkorn und Bauten vereinbart; Flörten und Rybbel fordern über 11600 Rthl, weshalb Triebenfeld Exekution und Sequestration erwirkt hat; mit von Rudnicki soll zu Johanni abgeschlossen werden. Der Landrat verschafft Käufer für 87 Hufen; Glenck verspottet den Olesnices-Vertrag und wirbt den Landrat für eigene Geldgeschäfte ab.'
oe1bu9454-129: Klage über ausbleibende Post aus Berlin und Frankfurt an der Oder und Bitte, etwaige beruhigende Nachrichten von Glenck mitzuteilen. Da Amelang auf den ihm vorgelegten Plan wegen Kolzig nicht antwortet, sei der Verkauf von Kontop nun nachdrücklich zu betreiben; sonst hätte Triebenfeld geraten, ihn zu untersagen. Er habe den Pächter Bernhardi kommen lassen und ihm eingeschärft, die Güter den Kaufinteressenten Budolf und Stubenrauch wahrheitsgemäß und günstig zu schildern, statt den Verkauf zu hintertreiben oder sich bezahlen zu lassen.
oe1bu9454-130: 'Kurzer Reisebericht über den Stand der Verhandlungen: Glenck ist abgereist, Leixner abwesend, und nichts ist erledigt, da keiner dem anderen traut. Mit Bernhard ist verabredet, daß die Güter auf den Namen des Fürsten bleiben, während Leixner Kaemen übernimmt, auf den Namen des Fürsten oder Triebenfelds; Leixner ist in Bedrängnis, soll den Incolat nicht weiter beantragen, und Graf Schulemburg setzt ihm zu. Triebenfeld hat einen Eilboten nach Gleich geschickt, reist nach Berlin und will danach in Bersch abschließen.'
oe1bu9454-131: 'Bericht über erfolglose Geldsuche in Berlin: die dort gemachten Zusagen seien Lügen, kein Heller sei zu erwarten, weil der König wegen des drohenden Krieges mit Rußland nichts hergebe. Triebenfeld reist am 20. nach Frankfurt an der Oder, will mit Leixner wegen Kaemen abschließen und die für Koschentin nötigen Mittel beschaffen, ferner Koltzig oder das Darlehen erreichen. In der Sache Broniewski soll der Arrest bewilligt werden, sobald die Arrestgründe nachgewiesen sind; dafür seien 2000 Rthl in Friedrichsd''or erforderlich. Kritik an Mell: und Glenck.'
oe1bu9454-132: 'Bericht über das ergebnislose Warten auf Herrn Glenck und die bevorstehende Rückreise nach Breslau: bei Betsche hätten Käufer binnen kurzem 30000 verdient, weil die Untertanen sich freikauften, ähnliches drohe bei Kaemen zum Schaden des Fürsten. Triebenfeld drängt, Kammerdirektor Stubenrauch möge die Güter kaufen und das Geld bis Johanni stellen; er verbürgt sich für 10000 Rthl jährliche Revenüe, bei Zerstückelung und Erbpacht sogar 12000 Rthl, also 300000 Rthl Wert bei 4 Prozent, während der Fürst mit 180000 Rthl zufrieden wäre. Bei Zusage erbittet er einen Eilboten. Vorsicht gegenüber dem Kabinettsrat in Sachen Koltzig und Indemnisation.'
oe1bu9454-133: 'Sachstandsbericht in sieben Punkten über den Verkauf von Betsche und weitere Geschäfte: Glenck kann nichts belegen, Leixner will vom Vertrag zurücktreten, verweigert jede Bindung wegen Kaemen und verlangt Titelgewähr sowie Aufhebung des mit Glenck geschlossenen Gesellschaftsvertrags; für Kaemen werden 160000 Rthl genannt. Beim Ordenskammer- und Harlem-Plan sowie beim Darlehen von 100000 Rthl aus dem Invalidenfonds fehlt jede Sicherheit. Triebenfeld will in Berlin mit Stubenrauch und Amelang abschließen und berichtet über Beyms Vorschlag, die Entschädigung mit der Schuld von über 200000 Rthl zu verrechnen, sowie über Köckritz und die Kriegsaussichten.'
oe1bu9454-134: 'Bericht über das Scheitern des Darlehens aus dem Invalidenfonds: Hofrat Lengnich habe die Otto''sche Taxe auf 78000 Rthl herabgesetzt und so eingereicht, was Kredit und Verkauf der Güter verderbe; Schuld trägt Baurat Glenck, der sich mit Dietz, Werner, dem Juden Borchart und Hauptmann Lange einließ und Schuldscheine ausstellte. Auch Stubenrauch, Frankfurt an der Oder und das Pupillenkollegium versagen. Beyen bietet durch Amelang statt südpreußischer Güter nur Schenkung der Königsschulden und Übernahme der kurländischen Schuld; Amelang fordert stattdessen die Kolziger Güter. Triebenfeld will 120000 Rthl auf Kontop und Zagorowo aufnehmen.'
oe1bu9454-135: 'Provisionsstreit um den Verkauf der südpreußischen Güter Kaemen und Kolno: Kammerrat H. K. Werner fordert vom Kammerdirektor die ihm zugesagten 2 Prozent aus den ersten Kaufgeldern, da er den Käufer nachgewiesen habe, und droht mit gerichtlicher Beschlagnahme; beigefügt eine Abschrift der Zusage des Fürsten (Breslau 1803), ein Schreiben Glencks über ein zweites Darlehen von 60000 Rthl hinter 100000 Rthl bei angenommenem Gutswert von 200000 Rthl sowie Stubenrauchs Rückgabe der Akten mit Absage.'
oe1bu9454-136: Bericht über den Verkauf von Kolno und Kaemen, die zugesagte Zahlung von 76000 Rthl in barem Geld an das Hüttendepartement nach Bernhardis Anweisung, die neu gerichtlich beglaubigte Otto'sche Taxe, die Sache Broniszewski, Kölzig und die drohende Konfiskation der Güter Schlabrendorffs. Weiter die Hypothek auf Zagorowo und Lichnowskis Bürgschaft für 130000 Rthl, die Abrechnung mit Radzimski in Szetlewek, Pläne zur Verpachtung und Zerstückelung von Trąbczyn, Kopojno und Swięcia an Kolonisten und Mennoniten sowie heftige Klagen über Glenck, der ohne Vollmacht verschwunden bleibt.
oe1bu9454-137: Bericht über zähe Verhandlungen mit Wiener, Meyer Bernhard und Genossen, die 76000 Rthl und weitere rund 20000 Rthl in Bankobligationen durch Estafette senden wollen, jedoch 30000 Rthl zurückhalten mit dem Hinweis auf den Rückkauf von Betsche; Meyer Bernhard sagt nun 10000 Rthl mehr zu. In Trąbczyn wurden einige tausend Rthl auf Wechsel aufgenommen. Die Deposition der Brunieweischen Gelder sei über den Großkanzler und General Köckritz durchgesetzt; dieser stellt statt Geld gute Güter in Erbpacht in Aussicht. Die Fürstin Sacken lässt 30000 Rthl auf Koschentin durch Cosmar kündigen.
oe1bu9454-138: 'Bericht über den Fortgang der Sache v. Broniewski: Ein erneuter Versuch der Deposition blieb erfolglos, wie eine beiliegende Resolution vom 25. Juni zeigt. Amelang hat daher eine nochmalige Prüfung erwirkt und, wie von Herrn v. Triebenfeld angedeutet, eine Sicherheit von 10000 Rthl angeboten, um den Besitz der Güter zu erlangen. Darauf sei der Regierung zu Posen die Deposition sowie die Räumung von Kolno und Kaemen aufgegeben worden.'
oe1bu9454-139: 'Bericht über das Scheitern der Versuche, den von Glenck geschlossenen Vergleich mit Broniewski rückgängig zu machen: obwohl das gerichtliche Rescript wegen des Deposits vorlag und der Fürst am 8. Widerspruch einlegte, wurde der Vergleich am 6. zur Approbation eingereicht und eilig bestätigt. Metzer und Wünster schieben sich die Schuld gegenseitig zu; ein Deposit hätte Broniewski nach Metzers Eingeständnis zu Fall gebracht. Die Liquidation werde 6 bis 8 Jahre dauern. Triebenfeld will nach Betsche reisen, wo mit Bornstädt ebenso fehlerhaft auf Eviction geklagt wurde.'
oe1bu9454-140: 'Bericht über das Scheitern des Verkaufs von Betsche: Glenck und Rochlitz reden die Gemeinden vom Kauf ab, weil ein an den Kaufmann Klein abgetretener Vertrag zwischen Leixner und Leutnant von Brandenstein Vorwerk und Waldungen betrifft; der Justizbürgermeister Metzig verlangt zuvor Klärung mit von Bornstädt. Bitte um fürstliche Weisung per Estafette zur Herausgabe von Societäts- und Kaufvertrag und gerichtlichem Verzicht. Meyer Bernhard zögert mit den 66000 Rthl; Bornstädt beansprucht 1000 Friedrichsd''or Verkaufsprovision. Mit Beilagen Lit. A–F.'
oe1bu9454-141: 'Krankheitsbedingt in Posen ans Bett gefesselt, berichtet Triebenfeld über die verfahrene Sache Bruniewski: ein geschlossener Vergleich sei so mangelhaft, dass er keine Sicherheit biete und geändert werden müsse, wozu Bruniewskis Frau fehle. Wanstern (Wünster) habe im Einvernehmen mit Bruniewski und Guderian den nachteiligen Vergleich betrieben und Glenck untergeschoben. Der Jude M. Bernhard und Simon wollten statt 13000 Rthl nur 6000 zahlen; Triebenfeld verlangt Sicherheit, Deposition von 66000 Rthl bei Metzer, gerichtliche Besitzübergabe, 53000 Rthl für Baragnieur und 30000 Rthl aus Betsche.'
oe1bu9454-142: 'Bettlägerig wegen anhaltender Krankheit, bittet Triebenfeld den Fürsten, Glenck die mit Bornstädt geschlossenen Pacht- und Ansiedlungsverträge, Abrechnungen und Vergleiche herauszugeben; auf eine höfliche Anfrage habe er nur eine schnöde Notiz erhalten. Da Bornstädt abreisen wolle und sein Geld wohl aufgezehrt sei, solle der Fürst in wenigen Zeilen 5000 Rthl zur Beilegung aller Sachen zusagen; nach Brauns Meinung stünden Bornstädt 7500 Rthl zu, ohne das im Betsche-Kauf versprochene Honorar. Beilagen: Bornstädts Brief und Glencks Notiz.'
oe1bu9454-143: 'Bestätigung des Ausgangs der Indemnisationssache des Fürsten: Amelang nimmt zur Kenntnis, dass Friedrich Ludwig sich mit der Art der Erledigung des Geschäfts zufrieden erklärt hat, und wünscht ihm die fortdauernde Gnade des Königs, seinen Verdiensten um den Staat entsprechend. Sachliche Angaben zu Summen, Gütern oder weiteren Schritten fehlen; der kurze Brief erschöpft sich in dieser Rückmeldung und den Ergebenheitsbezeugungen des Schreibers.'
oe1bu9454-144: 'Kurze Empfangsbestätigung eines fürstlichen Befehls vom 31. des Vormonats: Amelang will am folgenden Morgen zum Greiff von Schulenburg gehen, ihm das beiliegende, an ihn gerichtete Schreiben übergeben und dessen nähere Erklärung abwarten. Das Ergebnis der Unterredung soll mit der nächsten Post berichtet werden. Weitere Angaben zur Sache fehlen; einzelne Wörter des Schlusses sind unsicher zu lesen.'
oe1bu9454-145: 'Bericht über einen Wagenbruch auf der Reise und den dadurch verzögerten Weiterweg sowie die Bitte, den bei Köckritz liegenden Vertrag umgehend zurückzufordern und mit einer Vollmacht an den erkrankten Hofrat Grimm zu senden: Honrichs zahlt die 4000 Rthl nicht, obwohl alles quittiert und geordnet ist, und Grimm will ihn sofort gerichtlich belangen. Dazu Klage über eigenmächtige Anordnungen in Trąbczyn, wo 100 Scheffel Getreide verliehen wurden.'
oe1bu9454-146: 'Bericht über die geplante Zerstückelung: Nach einem beigefügten Schreiben des Ältesten Pankratz wollen die Mennoniten Zagorowo und Trąbczyn insgesamt zum festgesetzten Preis kaufen und unter sich teilen; Triebenfeld reist dazu nach Lunau. Die Taxierung stockt, weil ein Vertrag vom 5. September Baurat Glenck 300 Morgen Herrschaftsland zusagt und Glenck Komornik-Stellen an von Małachowski verkauft hat; erbeten werden schriftliche Erklärungen Glencks und fehlende Verträge. Klagen über Blomberg, Wollenhaupt und 368 Rthl an den Landmesser Leopold; in Sachen Przespolewski Exekution über 6500 Rthl, gegen die Einwendungen erhoben wurden.'
oe1bu9454-147: 'Bericht über eine beschwerliche Reise nach West- und Ostpreußen: die Mennoniten wollen bauen und sollen am 19. Dezember in Breslau den Vertrag schließen; da sie zerstreut wohnen und zudem die Propination in die Taxe einbezogen sehen wollen, hat Triebenfeld zugleich Ansiedler aus Landsberg und dem Oderbruch kommen lassen und will beim besseren Angebot sofort abschließen. Eine Parzellierung lehnt er ab. Die Taxation stockt wegen fehlender Daten; Bürgermeister Schema erbittet Weisung, dem Dominium bleiben 53 Morgen, die Vogtei wäre mit etwa 11000 Rthl anzusetzen. Wegen Vorwürfen Glencks und Kochlitz'' droht er, die Geschäfte niederzulegen.'
oe1bu9454-148: 'Vorhalt gegen eine von Glenck vorgelegte Ertragsübersicht der S. P. Güter: dort sei Swięcia mit 1800 Rthl Jahreszins und 10000 Rthl Kapital angesetzt, nach der abgeschlossenen Revision der Taxatoren bringe es aber nur 918 Rthl Zins. Das Gut von 3792 Morgen sei für insgesamt 28360 Rthl weggegeben worden, woraus ein Verlust von 47340 Rthl folge; zusammen mit dem Verlust von 48000 Rthl bei Olesnica ergebe sich ein Ausfall von 95340 Rthl.'
oe1bu9454-149: 'Bericht über den Fortgang der Ansiedlung: Triebenfeld erwartet die Oder- und Netzebrucher Leute, hat abseitige Reststücke an der Grenze vorteilhaft verkauft und bürgt dafür, dass keine Hufe unter 600 Rthl (Kaufgeld samt Zinsen) weggegeben wird; die Taxe der Zagorowoer Güter werde über 400000 Rthl ergeben, worauf er in Berlin Geld für Schlabrendorff, Legnowelii und andere drängende Gläubiger aufnehmen wolle. Streit mit Glenck und den Oelsnicker Erbpächtern machte ihn drei Tage bettlägerig. Die Wrgbiner Untertanen verweigern Zins und Vertrag, weil Glencks Schreiber sie ganzjährig zu Diensten zwingt, nach Zagorowo zu fremder Arbeit schickt und ihr Verkauf mit dem Vorwerk an von Marowecke für 15000 Rthl droht; verwiesen an Justizbürgermeister Schenck.'
oe1bu9454-150: 'Auszug eines Schreibens des Landesältesten von Lichnowski, der für die Zeit vom 4. Mai 1803 bis 4. November 1804 Zinsrückstände von 5572 Rthl 12 Groschen fordert. Er habe bei der Regierung in Kalisch ein Mandat erwirkt, das Zahlung binnen 14 Tagen auferlegt; da diese fruchtlos verstrichen sind, droht er mit Sequestration, will aber Verdruss vermeiden und hofft auf Befriedigung zu Weihnachten. Vermerkt ist die Antwort vom 27. November 1804: die Pächter hätten nicht gezahlt, Herr von Triebenfeld ordne alles vor Ort.'
oe1bu9454-151: 'Bericht über den Stand der Geschäfte in Trąbczyn: Mennoniten sind vor Ort und wollen beide Güter zusammen kaufen, doch verhindert über einen Fuß hoher Schnee jede Vermessung. Triebenfeld will 100 Hufen der Waldungen Grądzin und Drzewitz zu 3000 Rthl Zins (60000 Rthl Kapital) vergeben, unter 1 Rthl je Morgen nichts. Die Einnahmen bleiben zurück (Suvigria 918 statt 1800 Rthl, Wrąbczyn 1123 statt 1500 Rthl), die Taxe muss neu gemacht werden. Lichnowski hat Arrest auf die Oelsner Zahlung gelegt; zu Weihnachten etwa 8000 Rthl. Dazu Nachrichten über von Nothardt.'
oe1bu9454-152: Bericht über den Freipaß für Hohenlohe-Weine und die in Aussicht gestellte Übersendung von 25000 Rthl. Die von Herrn Glenck auf die Zagorower Güter eingetragenen Schulden lasten nicht nur auf Swiecia und Olesnica, sondern auf allen übrigen Orten und erschweren die Dismembration, ebenso der Tod Nothardts und die Ankunft des Herrn von Goldbeck als Präsident in Kalisch. Bankrat Bernhardi hat das zugesagte Geld nicht geliefert, statt dessen einen anmaßenden Brief geschickt; Triebenfeld hat sich in Berlin anderweitig Mittel verschafft. Nothardt hinterläßt 28000 Rthl Schulden.
oe1bu9454-153: 'Bericht über die stockende Beschaffung von 25000 Rthl: Herr von Stein, nun Bankpräsident, hat alles Diskontieren erneut untersagt. Das Kapital von 140000 Rthl sollen entweder der Invalidenfonds oder das Potsdamer Waisenhaus geben, doch Ratenzahlung bewilligt keiner, und vor Erledigung aller Formalitäten zahlt kein Fonds. Triebenfeld arbeitet daher mit Amelang an einer vorläufigen Aufnahme der 25000 Rthl. Witwen- und Waisenkasse sind wegen drohender Bankrotte in Südpreußen bedrängt; der König fragt nach dem Verbleib der dorthin gegebenen Millionen.'
oe1bu9454-154: 'Bericht über den Fortgang des Darlehens, das bei einem zuverlässigen Prüfer liege, und über die Arreste auf den Gütern: Lichnowski habe den Arrest wegen der Zinsen für 6 Wochen aufgehoben, der auf Magnuskis Betreiben erwirkte nach Grimms Versicherung ebenfalls; von Wollenhaupts Rede über eine Sequestration hält Triebenfeld nichts, auch habe Przespolewski keine 30000 Rthl zu fordern; die Dębinska habe nur erneut Arrest gelegt, damit an Magnuske nichts gezahlt werde. Ausführlich empört sich Triebenfeld über einen Brief Blombergs vom 25. Dezember, der die Zerstückelung von erpresserischen Forderungen abhängig mache; er habe ihm weiteres Einmischen untersagt.'
oe1bu9454-155: 'Bericht über eine Unterredung mit dem Kanzler Hohmuth wegen der Schlaberndorffschen Zahlung: die Gräfin lasse sich von der Wiederaufnahme des Prozesses nur durch eine schnelle Zahlung von 25000 Thl. noch vor dem nächsten Berliner Posttag abhalten; erst dann werde Hohmuth sie zu weiterer Wartezeit auf die zweite Hälfte von 25000 Rthl bewegen, eine Obligation dafür lehne sie sicher ab. Nurlich sei früh mit dem Wildschwein für den Regierungsrat von Kreczinski über Kalisz nach Trąbczyn abgereist.'
oe1bu9454-156: 'Bericht über die stockende Beschaffung der 25000 Rthl: ohne das große Geschäft sei nichts zu erreichen, da auch für ein kleineres Darlehen die Papiere verpfändet werden müßten; zweimal sei das Geld schon sicher geschienen, vermutlich vom jungen Eyſenhardt vereitelt, der 18000 Rthl fordere und dem Hofrat Meyer die 20000 Rthl anweisen wolle – von Triebenfeld hat dies abgelehnt, solange der Prozeß um die Janvelen läuft und 9000 Rthl auf Szetlewek eingetragen sind. Klagen über Bernhardi. Beiliegend eine Abschrift des Mahnschreibens der Gräfin von Schlabrendorff, die bei Nichtzahlung der rückständigen Abfindungsgelder ihrer Kinder den Prozeß in Berlin fortsetzen will.'
oe1bu9454-157: Bericht über die Bemühungen um ein Darlehen aus dem Invalidenfonds, das General von Köckritz in Berlin persönlich betreibt und zugesagt hat; über die große Geldknappheit, da Bank und Seehandlung nicht diskontieren. Giraud und Haukt sollen die Zinsen erhalten, die Hypothek von 18000 Rthl an einen Geldgeber auf vier Jahre abgetreten werden. Nach Bewilligung will Triebenfeld 60000 Rthl vorwegnehmen, davon 10000 Rthl hier tilgen und 50000 Rthl übersenden, um die Schlabrendorff abzufinden; Pochammer verzichtet einstweilen auf Klage, Homuth soll die Gräfin beruhigen.
oe1bu9454-158: 'Meldung über den durch General von Köckritz vermittelten Erfolg: Das Invalidendepartement will 150000 Rthl geben, zunächst 50000 Rthl auf Hypothek und Triebenfelds Wechsel, die weiteren 100000 Rthl nach Revision der Taxen in Kalisch, auf 50 Jahre. Berliner Banken und Kassen zahlen nichts mehr nach Südpreußen; Liep: Meyer Wolff nimmt 10 bis 12 Prozent Courtage. Die Sache Tirard und Hauk ist geregelt, gegen den Courtage-Prozeß wird gewarnt. Zurückweisung des Vorwurfs im Schlabrendorff-Handel; Antwort an die Mennoniten, Wöllenhaupts Zerstückelungsgutachten abgelehnt, 15000 Rthl ins Reich vorgeschlagen.'
oe1bu9454-159: Meldung, daß Amelang nach großer Mühe eine Anweisung der Bank erwirkt hat, mit der die Gebrüder Kuh bezahlt werden können, noch bevor die Gelder aus dem Invalidenfonds – eine Negotiationsobligation über 36755 Rthl 7 gg. – eingegangen sind; die Anweisung wird beigelegt, der Fürst möge den Brief an die Herren Kuh sogleich zustellen lassen. Angekündigt werden die Erledigung der Sachen Hang und Eysenhardt sowie eine Reise nach Kalisch wegen der 100000 Rthl.
oe1bu9454-160: 'Bericht über die zähe Abwicklung in Berlin: Erst jetzt gibt die Invalidenkasse die Seehandlungs-Obligationen heraus, so daß der Bankier befriedigt werden kann; die weiteren hunderttausend folgen nach Prüfung der Taxen durch die Kammer. Mit Gerard ist man einig – 900 Rthl Zinsen gezahlt, dazu eine schriftliche Bürgschaft gegen Zusage längerer Laufzeit; mit Seebald zerschlagen, wodurch 1800 Rthl Provision gespart sind; mit Eysenhard soll morgen abgeschlossen werden. Abreise am 5. über Kontop und Glogau, zwei versäumte Gerichtstermine. Die Oelsner sollen hinaus: sie haben gegen die Zerstückelung der Waldungen protestiert wegen freien Brennholzes.'
oe1bu9454-161: Antwort auf ein fürstliches Schreiben vom 3. des Monats, das noch vor der Abreise von Triebenfelds vorgelegt werden konnte und diesen wegen der ausgesprochenen Zufriedenheit erfreute. Die Zahlung der Assignation sei nach eingegangenem Bericht bei der Kasse bereits geleistet; alles Weitere hänge von der Prüfung und Bearbeitung der Sache ab. Klage über die wechselnden Grundsätze der Behörden, die vier Wochen verstreichen lassen, während dieselbe Sache vor drei bis vier Monaten noch rasch und ohne Bedenken erledigt worden wäre. Verweis auf Herrn von Truberger als Zeugen des eigenen Fleißes.
oe1bu9454-162: 'Bericht über eine Verfügung der General-Finanz-Direktion, die den Kammern Revisionen gerichtlicher Taxen ohne deren Vorwissen verbietet und damit die Revision der Taxen aufhält; Anlass waren die Machenschaften des Prinzen George, der den Kriegsrat Korn als Revisor seiner eigenen Taxen durchsetzte. Präsident von Goldbeck hat um Erlaubnis gebeten, Amelang und Langen sollen in Berlin helfen. Ferner: Rückverweisung der Sache Olesnica an das Patrimonialgericht durch von Husslarzewski sowie die Bitte, für Goldbeck drei bronzierte Büsten und ein Waschbecken zu kaufen.'
oe1bu9454-163: 'Bericht über laufende Verkäufe und Prozesse: Für morgen ist in Trąbczyn ein Termin im Streit mit den Olesnicern angesetzt, die 10000 Rthl schulden; von Otocki bietet für Szetlewek in Erbpacht 10000 Rthl Einkaufsgeld und 1500 Rthl Canon sowie 3000 Rthl für die Propination beider Güter, wofür Triebenfeld 4000 Rthl fordert. Honrichs zahlt nicht, sein Vertrag soll aufgehoben und an Meierowitz (13000 Rthl) verkauft werden; Grimm bietet für Witów 2000 Rthl. Klage gegen Szczucki und Ceizewski; der alte Lichnowski bittet um 1390 Rthl. Erbeten werden Glencks Punktation, Vollmacht und Geschenke für den Kammerpräsidenten.'
oe1bu9454-164: 'Bericht über die stockende Genehmigung aus Berlin: Amelang bringt keine Resolution bei, die Schwierigkeiten bei der Revision der Taxen führt Triebenfeld auf Prinz Georg und Kalckreuth zurück; notfalls will er den Landrat revidieren und bürgen lassen. Weiter Verkaufs- und Zahlungsaussichten: Otochten, 10000 Rthl, 2000 Rthl halbjährige Propinationspacht, von Meierowitz 20000 Rthl bar vor Johanni und 500 Rthl jährlicher Kanon. Scharfe Vorwürfe gegen Glenck und von Blomberg, die die Kammerverfügungen vom 23. Dezember 1803 und 24. Januar 1804 verschwiegen und den Vertrag vom 22. Februar 1804 mit den Oleśnicki zuließen; dazu der Prussiemski-Vergleich im Kowaler Archiv.'
oe1bu9454-165: 'Übersendung weiterer mit der reitenden Post von Herrn Glenck eingegangener Schreiben an Triebenfeld, dazu ein Auszug in Abschrift, den der Fürst nachträglich beizulegen befahl, weil er Triebenfeld nützlich sein könne. Bericht über das Befinden des Fürsten: der Anfall sei von der rechten Hand in den linken Fuß gewichen, der Schmerz in der Nacht vergangen. Der Bergrat Bernhardi ist in Breslau angekommen, jedoch unwohl; Hahn wurde zu ihm geschickt, da der Fürst ihn noch nicht empfangen konnte. Wünsche für Triebenfelds Genesung.'
oe1bu9454-166: 'Bericht über die Widerstände des Ministers von Voss gegen die Dismembration: Die Kammer schickte eine Kommission, die alles inhibierte und prüfte, ob vorschriftsgemäß gehandelt und die onera publica gedeckt seien. Triebenfeld führte sechs Rechtfertigungspunkte an, worauf die Inhibition aufgehoben und ein reiner Jahresertrag von 31000 Rthl anerkannt wurde; auf die erwartete Concession seien 3 bis 400000 Rthl zu erlangen, dazu 180850 Rthl ausstehende Kaufgelder zur Schuldentilgung. Zugleich Bitte um Abreise nach Schweinen und Kontop wegen eigener Verluste von 19500 Rthl; Schenck soll die Gelder einziehen.'
oe1bu9454-167: Übersendung eines beigefügten Schreibens des Fürsten, der selbst nicht schreiben konnte, weil die Ordonnanz binnen einer Stunde abging; er fuhr eben mit dem alten Fürsten zur Kirche. Hahn berichtet, der alte Fürst befinde sich für sein Alter sehr wohl und zeige große Zuneigung zu seinem Herrn, wünscht Triebenfeld gute Gesundheit und meldet abschließend, die Rückkehr nach Breslau sei bestimmt auf den 25. festgesetzt.
oe1bu9454-168: Bericht über den Abschluss der Verträge mit den alten Bauern und die gerichtliche Sicherung der Abgaben, über Verhandlungen mit von Otocki wegen Szetlewek und der Propination sowie über das Darlehen, das Amelang in Berlin betreibt; für die Zerstückelung fehlen noch Erklärungen des Ministers von Voss und der Kammer, Klewitz verlangt Verrentung statt Barverkauf. Klage über Glenck, der sich mit Wollenhaupt verbunden habe, und über Forderungen der Winnicki-Erben, Chwalowskis, Sprengels und Wollenhaupts von zusammen 3011 Rthl; Wollenhaupt soll nach Abzügen noch 400 Rthl zahlen.
oe1bu9454-169: Bericht über den Widerstand des Ministers von Voss gegen jede Revision der Taxen und die Hoffnung, das Zeugnis des Landrats genügen zu lassen; nach eingereichter Dismembration schickt der Präsident einen Rat nach Zagorowo und Trąbczyn. Abschluss mit Meierowitz, Rückfluss von 4000 Rthl samt 500 Rthl Canon, Verkaufsgelder von 20000 Rthl für Weigel, Schliefen und Honrichs; Szetlewek an Radzinski für insgesamt 48000 Rthl, Streit nur noch um die Hütung. Pläne für Olesnica mit neuer Erbpacht, Propinationspacht zu 4000 Rthl jährlich; erwartet 80000 Rthl bis 1. Juli. Klagen über Amelang, Goldstücker, Oppenheimer, Glenck und Sprengel.
oe1bu9454-170: Bericht über einen im Auftrag des Fürsten ausgeführten Ritt nach ErtheSchweiner, um dem Förster bezold und dem Kreisverwalter Käufer die gegen sie erhobenen Vorwürfe vorzuhalten. bezold zeigte sich unbeeindruckt und fragte, wer ihn beim Fürsten angeschwärzt habe; er wurde zu Rechtschaffenheit und Aufmerksamkeit im Dienst ermahnt. Käufer, in Breslau angetroffen, verwies auf gute Zeugnisse angesehener Männer, auf seinen guten Namen und erklärte, eine Untersuchung seines Handelns gelassen abwarten zu können. Angefügt die Mitteilung, dass die Wüsten heute mit der Fahrpost abgehen.
oe1bu9454-171: 'Nachricht über das Befinden des Fürsten: Das Leiden am Fuß sei fast völlig geheilt, der Fuß nur etwas geschwollen und ohne Schmerzen, im Übrigen sei der Fürst ganz wohlauf. Hahn übermittelt Grüße an Triebenfeld und berichtet, der Andreasorden habe Freude gemacht, mehr noch aber das gnädige Verhalten des Kaisers, von dem der Fürst sehr eingenommen sei; auch in Breslau habe der Kaiser sich über den Fürsten sehr schmeichelhaft geäußert.'
oe1bu9454-172: 'Bericht über den Stand des Zerstückelungsgeschäfts mit Eyster in Trąbczyn: wegen des starken Andrangs ist der Haupttermin auf den kommenden Montag verschoben, dann sollen die Verträge über alle Grundstücke geschlossen werden. Präsident von Goldbeck hat sich bei Minister Voss für die Kammer entschuldigt, die Fehler des Kriegsrats zur Höllen eingeräumt und die Einwilligung zur Zerstückelung befürwortet. Mona Kunckel wurde in Haft genommen; die Winnich''schen Erben klagen auf weitere 1300 Rthl rückständiger Vermessungskosten. Dazu 6 Tische und 30 Obstbäume für den Präsidenten.'
oe1bu9454-173: 'Meldung, dass der von Rochlitz und Honrichs geschlossene Punktationsvertrag über Witów samt Vollmacht im Trąbczyner Archiv nicht auffindbar ist; Tiel und Justizbürgermeister Schenck haben vergeblich gesucht, weshalb der Fürst Glenck zur sofortigen Beschaffung anweisen soll, sonst drohe der Verlust von 14000 Rthl. Weiter: Zahlungen an Blomberg (900 bereits, 1000 Rthl gefordert, vorgestreckt vom Kassierer Peter), Reise mit einem Kammerrat nach Trąbczyn wegen des Zerstückelungsplans, erhoffter Gesamtertrag 350000 Rthl, Bitte um Namen für neue Dörfer sowie um Rücksendung des Vertrags mit Schenck (800 Rthl Gehalt, 5 Hufen zu viel).'
oe1bu9454-174: 'Berechnung, dass die Vereinigung von Justitiariat, Kassen- und übrigen Geschäften in einer Hand jährlich mehrere hundert Rthl einbringe: 200 Rthl aus den Gebühren des Actuarius, 200 Rthl für Fuhren und Kost, 600 Rthl bei Übernahme der Kasse, künftige Gebühren von 1200 Rthl, so dass kein Advocat mehr nötig sei. Bitte, Hahn nach Schweinen zu schicken, um Verwalter Käufer und Förster Pelzold zu warnen, sowie Anfrage nach den 1390 in der Sache Lichnowchi. In Trąbczyn warten Käufer für mehrere Hufen gegen Barzahlung; Rücksendung des Amelang-Briefs; Nachrichten über russische Truppenmassierungen von über 300000 Mann.'
oe1bu9454-175: Übersendung zweier Schriftstücke – eines im Original, eines in Abschrift – im Auftrag des Fürsten an Triebenfeld, mit der Bitte, sein Gutachten dazu und zum weiteren Vorgehen niederzuschreiben. Besonders dringend mahnen Girard und Haupt auf Zahlung; der Fürst würde die nötige Summe sogleich anweisen, wäre seine Kasse nicht durch die Reise erschöpft. Geschrieben von A. Huhn als Sekretär.
oe1bu9454-176: Nachricht vom Tod des regierenden Fürsten von Hohenlohe-Neuenstein, der am 20. Juli noch im Tiergarten jagte, am 24. erkrankte und am 27. einem Schlagfluss erlag. Nach dem Testament ist Friedrich Ludwig Alleinerbe; in Öhringen und den übrigen Orten wurde sofort Besitz ergriffen und der Huldigungseid geleistet. Einwendungen der Fürsten von Langenburg und Kirchberg unter Berufung auf einen Teilungsvertrag wurden abgewiesen, ihre Patente abgenommen und Ingelfinger angeschlagen. Der Fürst reist im September nach Franken; die südpreußischen Geschäfte bleiben Triebenfeld überlassen.
oe1bu9454-177: 'Bericht über den Stand der Zerstückelung: Geheimrat Reinbeck will sie nach Rückkehr des Ministers Voss dem König zur Genehmigung vorlegen, wovon das Geldgeschäft abhängt; aus dem Invalidenfonds und vom Pupillenkollegium sollen Mittel zur Schuldentilgung kommen. Beigefügt ein Verzeichnis der 15 neuen Kolonien bei Zagorowo und Trąbczyn (21407 Morgen, 578 Wirte, u. a. Klein Ingelfingen, Augustinow, Ludwigslust, Fürstenfelde) und der beim Dominium verbleibenden Gründe. Eingegangen erst 7130 Rthl; Radzinski soll 6000 Rthl zahlen, Forderungen der Prusimska (20000), Weigel (23000) und der Schlabrendorff (25000) stehen offen. Dazu Nachrichten über die Mobilmachung der Armee.'
oe1bu9454-178: 'Entschuldigung dafür, dass einige von Seiner Durchlaucht blanko unterzeichnete Bögen (chartes blanches), die für Triebenfeld bestimmt waren, beim eiligen Packen in Breslau versehentlich unter Hahns Papieren geblieben sind; die übrigen blanko unterzeichneten Bögen hat Hahn den Fräulein von Triebenfeld geschickt. Zur Erklärung nennt Hahn die unruhigen letzten Nächte vor der Abreise, da der Kammerdirektor Graf aus Behringen eintraf und alle Hohenlohischen Angelegenheiten noch vor der Reise erledigt werden mussten. Nachschrift: Hahn wurde vor der Abreise zum Expeditionsrat bestellt.'
oe1bu9454-179: 'Bericht über den Stand der Geschäfte in Berlin: die Dismembration und die Betscher Sache sind vom König genehmigt, die Einschätzung der Kalischer Kammer beziffert den Ertrag der Güter auf 40260 Rthl (ohne Forst, Laudemium und Gerichtsgefälle), die Schulden auf 698000 Rthl. Beigefügt sind Verzeichnisse, ein Amortisationsplan und eine Vollmachtsformel für den Hoffiskal Pochammer, um beim König Tresorscheine zu 3 Prozent zu erlangen; der Fürst wird um schleunige Ausfertigung gebeten. Ferner zu Glencks Forderung von 8000 Rthl und zur verweigerten Konsens für Santomist.'
oe1bu9454-179a: 'Vier Anlagen zu einem Kreditplan: eine von der Kriegs- und Domänenkammer Kalisz beglaubigte Ertragsübersicht der Herrschaften Zagorowo und Trąbczyn mit 40260 Rthl 14 g. 11 d. Reinertrag (Erbpachtcanon Olesnica, Pächter Honrichs, Glinicki, Niedzewiecki, Tieltz, Propination, Mühlen, Ziegeleien), eine Schuldenliste von 363933 Rthl (Schlabrendorff, Weigel, Lichnowski, Oppenheimer, Invalidenfonds) samt kurländischer Schuld auf 698784 Rthl, ein Bittschriftentwurf Triebenfelds an den König um 698000 Rthl Tresorscheine gegen erste Hypothek und Amortisationsfonds von 34000 Rthl jährlich, dazu ein Amortisationsplan und ein Vollmachtsauszug.'
oe1bu9454-180: 'Antwort auf zwei fürstliche Schreiben vom 8. und 18. April: Die Forderung des Juden Nathan Luipmann steht bereits im übersandten Verzeichnis der Schulden; alle Gläubiger sollen befriedigt werden, doch die Zerstückelungsgelder von etwa 60000 Rthl kommen nur langsam ein, so daß Triebenfeld kurzfristige Anleihen aufnimmt. Aus dem abgeschlossenen Betsche-Geschäft fließen 2000 Rthl nach Abzug von 6000 Rthl für Echaust sowie 1200 Rthl Laudemium von Raven, zusammen 3200 Rthl der benötigten 30000 Rthl. Weiter zur Sache Glenck, zu Pochammers Anleihegespräch in Steglitz und zur Taxe, die nach Kalisz zurückgehen mußte.'
oe1bu9454-182: Dringende Mahnung, die vergessene Vollmacht für den Hoffiskal Pochammer und Blanketten, darunter einige gerichtlich beglaubigte Vollmachten in blanco, endlich zu schicken, da ohne diese Stücke seit Wochen nichts vorangeht. Mit den letzten beiden Blanketten wurde im Namen des Fürsten an den Geheimen Kabinettsrat Beyme und Minister von Voss geschrieben und Pochammer als Bevollmächtigter empfohlen; Besuche bei von Haugwitz und Graf von Keller stehen bevor. Klage über Gratsenauer, der Titel, Justizrat-Stellung und Gehalt aus den schlesischen Gütern fordert.
oe1bu9454-183: 'Bericht über eine Schmähschrift "Preußische Charaktere", in der der Fürst heftig angegriffen und Triebenfeld selbst als Geschäftsmann des Fürsten verunglimpft wird: er nutze die fürstlichen Angelegenheiten zum eigenen Vorteil, sei ein Intrigant und habe sich vom Bedienten zum Adligen hochgearbeitet. Ein übersandtes Exemplar wurde von der französischen Behörde eingezogen. Als Verfasser gelten Oberst Massenbach oder Professor Buchholz; bei erwiesener Urheberschaft Massenbachs stellt Triebenfeld seine Pistolen zur Verfügung. Auch Rochritz werde übel behandelt.'
oe1bu9454-184: 'Nachsendung der Blanketten, die bei der eiligen Abfertigung des Expressboten liegengeblieben waren, verbunden mit einer persönlichen Klage: Hahn sieht sich als alter Ingelfinger Diener gegenüber neu Angestellten zurückgesetzt, die ohne Verdienst versorgt würden, während man ihn hungern lasse. Er kündigt an, sich notfalls aus eigener Kraft zu helfen, und bittet Triebenfeld im Vertrauen, von dieser Herzensäußerung keinen Gebrauch zu machen.'
oe1bu9454-185: 'Dringende Mahnung, die erbetenen Vollmachten endlich zu schicken: verlangt werden eine Vollmacht für den Hoffiskal Pochammer, zwei gerichtlich beglaubigte Blankovollmachten und einige Blanketts, ohne die Triebenfeld in Berlin nichts ausrichten kann und die Verhandelnden Mißtrauen zu fassen drohen. Zu den Übergriffen der Württemberger auf die fürstlichen Lande werden hier Zusagen gemacht, doch rät er, auch dort alle Stellen in Bewegung zu setzen. Nach Auskunft des Präsidenten von Höhneln leidet der Fürst weiter an Gicht; Triebenfeld empfiehlt ein Fontanell und kündigt einen Besuch in Öhringen an.'
oe1bu9454-186: 'Mitteilung, dass die Sache mit Herrn Weigel so gut wie erledigt sei: Weigel habe am Abend zuvor seine Zustimmung geschickt und wolle den Donnerstag bei Triebenfeld auf dem Gut zubringen, worauf dieser ihn für den folgenden Tag eingeladen hat. Zur Bewirtung des alten Herrn – allein im Interesse des Fürsten – erbittet Triebenfeld eine Flasche alten Wein, eine Flasche guten alten süßen ungarischen Ausbruch sowie 6 Pfirsiche und 2 Trauben, die ihm hinausgeschickt werden sollen.'
oe1bu9454-187: 'Bericht über den Eingang der Vollmachten und Blankette und die daraufhin eingeleitete Kreditaufnahme: Durch Vermittlung des Generals sollen 90000 Rthl aus dem Justizfonds kommen, womit Weigel, die Schlabrendorff und Lichnowski abgefunden werden; 20000 Rthl gibt Lichnowski gegen eine Schweiner Hypothek zurück, 10000 Rthl sind noch zu beschaffen, damit der Fürst die gewünschten 30000 Rthl erhält. Klagen über Oppenheimer, der von 113600 Rthl nur 32000 zahlte, und über die Klage des Meyer Bernhard. Geplante Reise nach Betsche, Kalisz und Trąbczyn.'
oe1bu9454-188: 'Erfolgsmeldung aus Berlin: Der Großkanzler gibt aus dem Justizfonds rund 176000 Rthl, womit die drängenden Gläubiger der Güter, besonders Weigel, bezahlt werden; die bei Oppenheimer verpfändete Hypothek von 200000 Rthl soll wieder flottgemacht, die Forderung Schlabrendorff durch 20000 Rthl vom Kriegsrat von Hellen gedeckt werden. In Betsche ist Echaust befriedigt, 4000 Rthl fallen zum 6. Juli an. Für Trąbczyn rechnet Triebenfeld rund 102000 Rthl Rückstände vor und klagt über Grattenauer, dem er anderthalb Jahre Gehalt vorgestreckt habe.'
oe1bu9454-189: Anzeige Hahns, dass ihn der Tod des Bergrats Bernhardi nach Oberschlesien führt, wo er zusammen mit dem Inspektor Kreinig und dem Forstmeister Reichmann die Angelegenheiten der Herrschaft Koschentin ordnen soll; beide hält er für redliche und einsichtige Geschäftsleute, doch sei in Koschentin nicht alles in bester Ordnung. Nach Abschluss der Arbeiten will er über Breslau zurück ins Reich und bittet um Erlaubnis, Triebenfeld zuvor in Trąbczyn aufzuwarten; dazu habe er auch beim Fürsten um Genehmigung nachgesucht. Er erbittet Antwort nach Koschentin; Herlich empfiehlt sich.
oe1bu9454-190: Übersendung einer Carte blanche des Fürsten für eine Antwort an Herrn von Rewek, die Triebenfeld nach eigenem Ermessen ausfertigen soll, samt einem Auszug aus einem Brief des Bergrats Glenck vom 22. März 1806. Glenck schildert darin Pfändung seiner Sachen, Verkauf von Kleidern, drängende Gläubiger und die Abtretung seines Gehalts; durch Beibringung des Consenses will er Ribbek vom Kauf Wrąbczyns lösen und Wilhelmsruhe vor billigem Verkauf retten. Hahn bittet im Namen des Fürsten um nochmalige Hilfe für Glenck.
oe1bu9454-191: 'Ausführlicher Lagebericht nach fünfwöchiger Krankheit an Gallenfieber: Aufstellung der in Berlin zu ordnenden Schulden von zusammen 311000 Rthl, darunter Oppenheimer 110000, Lichnowski 40000, Grotowski 20000, Haugt 18000, dagegen 184000 Rthl Forderungen. Ferner Prusimskas Heiratsgut, Prozeß in Kalisz, leere Kassen in Trąbczyn, Aufkündigung der Pachtverträge mit Honrichs, von Zglinski und dem Kopojner Pächter, Prügelstrafen gegen die Bauern, Zerstückelung der Vorwerke zu 600 Rthl je Hufe, Tietz'' Pension von 300 Rthl und Glencks Schmähschrift und Erbpacht.'
oe1bu9454-192: Krankheitsbedingt bettlägerig seit fünf Wochen, berichtet Triebenfeld über beruhigte Bauern, fortgejagte Pächter und die Umtriebe Glencks, der sich mit den Olesnicern und Kramplich, Bergemann und Rybbeh verbündet, Käufer abschreckt und ein beigelegtes Pasquill unter den Kolonisten verteilt hat. Weigel und Lichnowski sollen aus dem Gerichtsfonds bezahlt werden und ihre Hypotheken abtreten. Dem Fürsten stünden noch 190000 Rthl bar und 40000 Rthl jährlich zu; eingegangene Zahlungen aus Swięcia, Olesnica und Szetlewek gingen für Kosten, Zinsen und Altschulden auf. Dazu ein Urteil im Streit mit Giese über die Erbpacht Olesnica.
oe1bu9454-193: 'Ein fürstliches Schreiben kam erst nach zehn Tagen an, wodurch der geplante Reiseplan hinfällig wird; Triebenfeld bittet, nicht bis Parchwitz zu reisen, da dies auffalle, und will noch im selben Monat vor seiner Berliner Reise selbst nach Schlawenschitz kommen, um Weisungen einzuholen. Nachrichten über Gärungen in Petersburg nach Oberst Scharffenberg. Zu den polnischen Gütern: die Dabsha lässt Termine verstreichen, Präfekt Garczynski lässt Honrichs, der über 10000 Rthl schuldet, verhaften; 600 Rthl wurden zurückerlangt, Administrator Radecki soll die Rückstände klären.'
oe1bu9454-194: 'Bericht über die verschobene Reise nach Schlawenschitz: Der Invalidenfonds verlangt Zinsen und das ganze Kapital und droht mit Zwangsversteigerung von Triebenfelds Gütern; am 26. steht ein Termin an, danach Abreise von Glogau. In Polen sei die Vindikationsklage um die Trąbczyner Güter günstig ausgefallen und nach Kalisch verwiesen; der König von Sachsen gewähre ein zehnjähriges Indult bei jährlicher Abzahlung eines Zehntels, wovon Weigel nichts erfahren solle. Zu Honrichsen erbittet er Suspension, Beschlagnahme und Verwendung der 11700 Rthl Schuld, wofür Subprefekt Brzechsta gebürgt habe.'
oe1bu9454-195: 'Zwischenbericht über einen noch nicht zustande gekommenen Gutsverkauf: Graf Strachwitz wird erst am 23. in Breslau erwartet, Flesch gibt sich verschlossen und schilt Goldstücker, den Namen des Grafen genannt zu haben; Triebenfeld vermutet einen Betrug und einen mitzuerledigenden Prozess. Betroffen sollen die Odergüter bei Leobschütz im Wert von 900000 Rthl sein, ohne Zackraw. Dazu Nachrichten über Kriegsgefahr, die preußische Contribution, Hardenberg, ein angeblich Henckel übergebenes Testament Kolomas und die um 2 Jahre verlängerte Moratorium.'
oe1bu9454-196: 'Bericht über die Flucht aus Breslau: der Gläubiger Lahr, dem Triebenfeld noch 1500 Rthl schuldet, hat durch seinen Mandatar Ludwig heimlich einen Haftbefehl erwirkt, obwohl er Stundung bis Michaelis versprochen hatte; Triebenfeld muss nun seine Mühle zum halben Wert verkaufen und beschuldigt Flesch und den Juden Sterch der Ränke. Dazu politische Nachrichten über Napoleons Kontributionsforderung, Truppenabgaben, Hardenberg und Merkel, das Scheitern der holländischen Anleihe sowie Ratschläge zur Sache der 35000 Rthl (Schade, Merckel, Berger, Liquidationskommission Berlin).'
oe1bu9454-197: 'Bericht über eine Reise des Justitiars nach Berlin: General Köckritz habe von d. Lahr zurückgewiesen und wolle mit der Generalkasse wegen der Zinsen an den Invalidenfonds Geduld erwirken. Triebenfeld will die Geschäfte in Kalisch ordnen, dann nach Breslau zurückkehren, und drängt den Fürsten, bei Goldstücher das Tauschgeschäft zu betreiben; an Goldstuckes und Flesch schreibe er selbst. Der Landrat Hegener soll Strachwitz gewinnen und Zagorowo besichtigen. Ein Nachtrag zitiert Geheimrat Tismar; Triebenfeld hält die Sache für eine Intrige Fleschs.'
oe1bu9454-198: 'Bericht über die Lage in Polen nach Triebenfelds Rückkehr: Trąbczyn fällt bis Michaelis zurück, die Sequestration ist aufgehoben, die Rechnungen von Honrichs und Frankiewitz prüft der vom Präfekturamt bestellte Calculator Schneider, für die unterschlagenen 11700 Rthl haftet notfalls Unterpräfekt Brzechsta; Hecker wird als Administrator zugelassen, die Untersuchungskommission beginnt am 12. Der Pächter Smidkowski zahlt mehrere Tausend, Dąbskas Bittgesuch beim König wurde abgewiesen. Dazu Nachrichten aus Berlin über Köckritz, Tismar, Hardenbergs Rückkehr und die 35000 Rthl.'
oe1bu9454-199: 'Bericht unmittelbar nach der Ankunft: Ein beiliegender Brief von T. melde das gewisse Kommen des Königs, weshalb Triebenfeld nicht nach Berlin reise, sondern vor Ort wirke; er schicke Wein und Wildgeflügel, damit beim Abschiedsessen die Sache vorangebracht werde, und dränge darauf, auch Hardenberg beizuziehen, dessen Mitkommen ein Zettel des Herrn von M. andeutet. Danach wolle er eilig nach Zagorowe. Hoffnung, seine Mühle übermorgen für 6000 Rthl bar zu verkaufen und Rückstände der Untertanen einzuziehen.'
oe1bu9454-200: Bericht über den Empfang der fürstlichen Sendung, die den General von Köckritz vor dessen Abreise nicht mehr erreicht, und über die Forderung des Herrn von Seegebarth, die auf künftige Einkünfte aus den polnischen Gütern verwiesen oder an die Kurierkassa des Königs gelenkt werden soll. Triebenfeld berichtet ferner von seinen Verhandlungen mit Weigel, der Stössel als Schuldner ablehnt und stattdessen die schlesischen Güter selbst übernehmen und quittieren solle, und von seiner geplanten Reise nach Zagorowo bis zum 7.
oe1bu9454-201: 'Meldung, dass Weigel nun entschlossen ist, die für die Herrschaft Zagorowo zu verhandelnden Güter – ob die Knobelsdorffschen oder die Pommahischen – zu übernehmen und seine sowie Stossels Forderungen darauf zu verrechnen; am 30. will er dazu in Schweinerin mit Triebenfeld beraten. Dazu der Plan, Schweinern an einen der kaufwütigen reichen Breslauer Kaufleute zu verkaufen: geboten seien 220000 Rthl Courant, gefordert 250000, bei nur 40000 eingetragener Schuld, womit sich die Forderungen von Grotowski, Lichnowski, Zerboni u. a. auf Trąbczyn tilgen ließen. Bitte, auch den Plan mit Herrn August zu fördern.'
oe1bu9454-202: Bericht über eine Unterredung mit Vater Weigel, der die vom Fürsten hier erworbenen Güter übernehmen will und die Sache ganz Triebenfeld überlässt; Weigel verlangt nur eine nochmalige genaue Ausarbeitung, um sie auch seinem Sohn erklären zu können. Wiedergegeben wird Weigels Lob, Triebenfeld habe in Berlin Hunderttausende gewinnen können und stets alles abgelehnt, was selbst König, Bischoffswerder und den alten Eysenhardt verwundert habe. Hoffnung auf den baldigen Verkauf zweier Freigüter.
oe1bu9454-203: 'Bericht über ein von Fischbach angebotenes Tauschgeschäft: ein von Knobelsdorff will seine Güter gegen polnische tauschen; deren Wert und Schulden (255000 Rthl Pfandbriefe, 135000 Rthl Privatschulden) werden den Zagorowoer Gütern gegenübergestellt, bei denen 247000 Rthl Schulden stehen (Invalidenfonds 50000, Oppenheimer 115000, Weigel 50000). Erbeten wird Weisung, ob Fischbach mit Knobelsdorff nach Schlawenschitz kommen soll; dazu Nachrichten über Weigel, Hainen, Tismar und Verhandlungen über Schweinern mit den Kaufleuten Wiener und Schiller sowie der Bedarf von 500 Rthl für die Reise nach Zagorowo.'
oe1bu9454-204: 'Klage darüber, dass die Äußerung des Fürsten gegenüber Herrn von Heyne, Koschentin an Weigel oder an Stösseln abtreten zu wollen, Triebenfelds Plan gefährde: Weigel habe erklärt, er sehe von der Sache ab, da er auf diesem Weg kein bares Geld erhalte, und wisse nicht, ob die eingezahlten Gelder und seine übrigen Forderungen bei Stösseln angerechnet würden. Triebenfeld hat Heyne eingeschaltet, bittet um klare Weisung und darum, seine Briefe niemandem außer dem Sohn des Fürsten und Balley zu zeigen.'
oe1bu9454-205: Bericht über die Abreise Köchlichs und des Königs sowie Grüße von Köckritz; zum Tauschgeschäft ist Knobelsdorff bis zum 10. durch einen Auftrag der Landschaft gebunden, danach zur Reise nach Zagorowo bereit, weshalb Triebenfeld ihm durch Lombardini eine Estafette sandte. Weigel zeigt sich willig, die Bischdorffer Güter Stössel zu überlassen, wenn er selbst eingetragen wird und die Last auf Koschentin gelöscht werden kann. Dazu Nachrichten über die Rückzahlung preußischer Gelder aus Polen, drohenden Krieg Frankreichs mit Rußland, Friedensgerüchte aus Wien, Lieferung von Leinen und Eisen nach Paris sowie die Warnung vor Scheinfreunden des Fürsten.
oe1bu9454-206: Nach Lombardinis Besuch versichert Triebenfeld dem Fürsten, von der preußischen Regierung nichts zu erwarten, sondern Genugtuung aus dem Norden, wozu er notfalls selbst nach Petersburg reise; ein angebotenes Geldgeschenk solle der Fürst ausschlagen. Knobelsdorff tausche laut Beilage sicher; mit den 35000 Rthl müsse man warten, da Eberhardt die Aufstellung schulde. Für Reisegeld verkauft er drei Freistellen in Petersdorff für 1800 Rthl mit 3200 Rthl Verlust. Ab dem 2. will er in Polen Cabanis die Grundstücke von Zagorowo beeiden lassen, Contracte und Rückstände der Erbpächter und Colonisten belegen, sich mit Honrichs vergleichen und Sommer, einen polnischen Rechtsfreund sowie Hegener hinzuziehen; mit Tatz bespricht er Trąbczyn.
oe1bu9454-207: 'Abschrift eines Pro Memoria von Hecker und Honrichs: Der Trąbczyner Prozeß ist in Kalisch eingeleitet, Termin am 24. Oktober, nachdem achtwöchige Gerichtsferien ihn verzögert hatten; Rat Falz führt die Sache, verspricht günstigen Ausgang, hat 200 Rthl Vorschuß erhalten und stellt sein Honorar dem Fürsten anheim. Die Sequestration der Güter ist beendet. Mit den Erbpächtern von Olesnica, die 12 Hufen in Erbpacht fordern, soll man sich vergleichen; polnische Bauern und Holländer klagen über niedrige Getreidepreise und den Canon. Triebenfeld rät, Rückstände teils zu erlassen.'
oe1bu9454-208: 'Geldmangel verhindert weiter die Reise nach Pehlen; neben Knobelsdorff und Strachwitz wolle sich ein dritter, dem Fürsten bekannter Interessent beteiligen. Wegen der Schlieben-Sache droht Pfändung: die Schwänner Pachtgelder sind mit Arrest belegt, bis die Sache nach Zusage des Generals von Köckritz aus Potsdam wieder aufgenommen wird; Lombardini wies den Gerichtsboten Schock ab. Bitte, Lombardini zur sofortigen Zahlung der 48 Rthl 6 g Kosten anzuweisen. Dazu Nachrichten über Manöver des Königs, Elbsperre, Kalckreuth und Labayes Kontributionsangebot.'
oe1bu9454-209: Kurze Meldung, dass die Zahlungsanweisung eingegangen ist; Triebenfeld will das Geld einziehen und sogleich abreisen. Aus Zagorowo werde er dem Fürsten alles unverzüglich durch einen reitenden Boten berichten, der zugleich Herrn von Knobelsdorff dorthin bringen soll. Wegen des abgehenden Postgangs bricht er das Schreiben ab; weitere Angaben zu Summen oder Geschäften fehlen.
oe1bu9454-210: 'Bericht über fünf Prozesse vor dem Tribunal: In der Sache Trąbczyn, noch als elfte im Register, hofft Triebenfeld auf Sieg und die Rettung der eingetragenen 22000 Rthl Heiratsgut gegen die Dąbska; der Advokat Falz erhielt 300 Rthl, Präsident Smagorzewski 100, zwei Assessoren je dreißig, dazu 160 Rthl Wein. Gegen die Olesnicaer Wirte, die 39270 Rthl schulden, soll ein Räumungsdekret ergehen, an ihrer Stelle zahlungswillige polnische Bauern treten; ferner Arrest gegen Niedzwiedzki (6000 Rthl) und Klage gegen den Propinationspächter. Erwartete Einnahmen 44000 Rthl. Bitte um Urlaubsverlängerung für Referendar Sommer.'
oe1bu9454-211: Bericht über einen Besuch des Herrn von Knobelsdorff, der die Güter in Augenschein genommen hat und zufrieden ist; Triebenfeld will nun alles ordnen, damit die Lage auf einen Blick zu übersehen ist, klagt jedoch über große Verwirrung und widerspenstige Leute. Der Prozeß um Trąbczyn stehe gut, der Termin sei seit dem 24. anhängig, das Urteil des Tribunals könne noch 14 Tage dauern; gewinne er, sei alle Not beendet. Er bittet, ihm die Direktion allein zu überlassen.
oe1bu9454-212: 'Bericht über die aussichtslose Zahlungslage der Güter: niemand zahlt, 31 Prozesse laufen, Niedzwiedzki aus Kopojno und Hawich aus Drzewce sollen ausgesetzt und 3 Vorwerke neu errichtet werden. Offen sind rund 8657 Rthl Abgaben, 7500 Rthl Zinsen an den Invalidenfonds sowie Zinsen auf 27000 Rthl, alles bis Ostern fällig. Napoleons Freijahre für Kolonisten verderben die Einigung; Triebenfelds eigene Güter sind sequestriert. Im Trąbczyner Streit verwies das Tribunal auf Poniatowskis Betreiben an die höhere Instanz. Taxe Zagorowo: 22140 Rthl Ertrag, davon 7140 Rthl Überschuss.'
oe1bu9454-213: 'Bericht über den Stand der Geldeintreibung auf den Gütern: die Staatssteuern sind bis auf 900 Rthl abgetragen, danach soll die kostspielige Sequestration fallen, deren Sequestrator (Günstling des Präfekten Garczynski) bereits 2236 Rthl liquidiert hat. Aufgeführt werden rund 43 Prozesse, darunter Niedzwiedzki 6000 Rthl, Nossalski 3000 Rthl, die drei Olesnicer 33000 Rthl, Berda 1190 Rthl, acht Holländer 5000 Rthl, Ribbeck zu Drzewce 225 Rthl und 29 Kolonistenklagen über 39000 Rthl. Triebenfeld klagt, die Leute zahlten nichts, weil der Fürst Ausländer sei, und erwähnt seinen Unfall sowie den 40jährigen Amortisationsplan.'
oe1bu9454-214: 'Kondolenz zum Tod der Fürstin, dann Bericht über den beim Departementsminister erreichten Vergleich: Bank- und Invalidenschulden samt Zinsrückständen sind über 41 3/4 Jahre zu 6 Prozent abzuzahlen, Abschriften beiliegend; ein ähnlicher Aufschub für die Privatschulden und eine Regelung mit Weigel werden erwartet. Die Erbpächter zahlen nichts, Prozesse um Olemizur, Werbizier und Swiecia laufen; nach gewonnenen Verfahren seien 22.000 bis 24.000 Rthl Einkünfte zu erwarten. Gegen Hecker, dem über 5000 Rthl fehlen, soll Strafverfolgung eingeleitet werden.'
oe1bu9454-215: 'Punktweise Antwort auf Anfragen des Fürsten: Empfang von 1000 Rthl vom Stallmeister Bally und 255 rt für Triebenfelds Kinder; Beurteilung von Honrichs, Hawich, Hecker und Cabanis. Kern ist die Aufhebung der Sequestration in Zagorowo gegen Hinterlegung von 5100 Rthl Zinsen bei Protest gegen Mendel Oppenheimers Forderung von 102000 Rthl, ferner die Vindikation von Trąbczyn und Kaemen gegen die Dąbska, Schadensersatz von etwa 60000 Rthl, Ablösung des Advokaten Stenger durch Raszkowski für 300 Rthl, Nachlass eines Drittels der Kolonistenzinsen, Rückstände in Betschin und der Witów-Prozess sowie Verhandlungen mit Brzechsta.'
oe1bu9454-216: Bericht, dass nach Aussage mehrerer Magnaten alle Privatschulden wie auch die Bayonner Summen unter das Moratorium von 41¾ Jahren fallen; auf den Gütern ruhen damit 200000 Rthl, darunter die Weigelschen 50000 Rthl, die in dieser Frist zu 6 Prozent getilgt würden. Dringende Bitte um Entscheidung, ob die Güter behalten oder vertauscht werden sollen; im ersten Fall will Triebenfeld die Hauländer gerichtlich aufheben lassen. Erbeten werden eine Vollmacht für den Advokaten Schmid in Kalisch und ein eigenhändiges Schreiben an Hecker.
oe1bu9454-217: 'Sanitz berichtet über seine eigenen Bemühungen, sein in Polen verlorenes Vermögen zurückzuerlangen: er hat Schlesien nach fast 49 Jahren verlassen und lebt nun in Berlin, sein früherer Anwalt Weltzer macht ihm wenig Hoffnung, und der französische Gesandte will die Sache übernehmen, falls kein kaiserlicher Befehl vorliegt. Die Güter seien der Dąbska auf Anordnung der Kommissare zurückgegeben worden. Er bittet Triebenfeld um Abschriften des Erkenntnisses zu den fürstlichen Gütern Trąbczyn und meldet Gerüchte über einen bevorstehenden Krieg im Norden.'
oe1bu9454-218: 'Vorschlag eines Tauschplans zur Entschuldung: Die Zagorower Güter, mit 560000 Rthl bewertet und mit 237375 Rthl belastet, sollen zusammen mit Schurgast (für 207000 Rthl gekauft, 92000 Rthl Schulden, 115000 Rthl frei) an Stöckel und Weigel übergehen, wodurch der Fürst 322625 Rthl Schuldenlast los würde; Verhandlungen mit General Graf von Wartensleben drängen, da dieser schon mit Medizinalrat Gumperts verhandelt. Triebenfeld bietet notfalls sein Blizanow und eine Hypothek von 30000 auf Kontop an, empfiehlt Heuthausen samt Reisegeld für die Geschäfte vor Ort, hofft aus den Prozessen gegen Olemia und Weyberin 20–30000 Rthl, hält 35000 fl. Rückstände in Oleśnica für uneinbringlich und klagt über Arreste auf Schwimmern und die eigene Not.'
oe1bu9454-219: Dringende Bitte um baldige Entscheidung über einen eingereichten Plan, die polnischen Güter zu veräußern, da bereits ein Rat aus Kalisch mit dem alten Grafen Wartensleben verhandelt; bei Zustimmung wolle Triebenfeld nach Münse reisen und sein Blizanow gegen das des älteren Sohnes des Grafen von Wartensleben tauschen, damit die Gläubiger, besonders Weigel und Stössel, befriedigt und die Fideikommissgüter ruhig besessen werden könnten. Klage über wachsende Abgaben und Not, Furcht vor Aufruhr; die Nachfrage beim Hypothekenkonservator Präsident Dierschlag habe sich erledigt.
oe1bu9454-220: 'Bericht über eine verspätet erhaltene Weisung und die daraufhin unternommene Reise nach Neisse: Der ältere Wartensleben hat Schurguet bereits an einen bankrotten Kaufmann für 135000 Rthl vergeben, doch der jüngere Wartensleben biete die Constadter Güter für 200000 Rthl bei 120000 Rthl Schulden, also 80000 Rthl Verhandlungsmasse. Vorgeschlagen wird, Weigel und Stössel Constadt samt der Hypothek auf die Zagorowoer Güter für 350000 Rthl übernehmen zu lassen, um Koschentin zurückzuerhalten; Triebenfeld erbittet Antwort durch Eilboten nach Blizanow und die Taxe im Original zurück.'
oe1bu9454-221: 'Absage an die erwartete Übersendung von 18000 Rthl aus den Zagorower Gütern: vor Ausgang zweier Prozesse sei nichts herauszuholen, allenfalls die Weihnachtszinsen zur Erhaltung des Moratoriums. Bericht über die betriebene Veräußerung Zagorowos an Stössel, den Besuch Graf Leopold von Wartenslebens, die Reise des Landrats König nach Breslau sowie einen möglichen Tausch Blizanow (127000 Rthl, davon 27000 Schulden) gegen die Pilaer Güter Sandrelzkis (250000 Rthl); mit Rechnung über 470000 Rthl, Abfindung Weigels und Rückgabe der Papiere erbeten.'
oe1bu9454-222: Dringende Bitte um Entscheidung, ob die Forderungen des Freiherrn Stossel und des alten Weigel nach Triebenfelds Plan durch Abtretung der Zagorowo-Güter, ergänzt um die Blizanower Güter, befriedigt werden sollen; dann bleibe Koschentin und von den Geldern des verstorbenen Fürsten Sacken für die Fideikommisse der Prinzen Adolph und Alexander kämen 670000 m. bar zurück. In einem Nachtrag berichtet Triebenfeld von Graf Wartensleben aus Breslau, der ein zustimmendes Schreiben des Fürsten an Stössel empfiehlt; dem Boten seien noch 5 Rthl zu zahlen.
oe1bu9454-223: 'Antwort auf Triebenfelds Plan einer Verhandlung mit Weigel und Stössel, den der Fürst nicht ablehnt, aber für aussichtslos hält; die Übernahme von Ruszynowią und Blizanow lehnt er ab. Vordringlich ist ihm bares Geld zu Weihnachten und die Veräußerung der Zagorower Güter: General von Schimmelpfennig und seine Söhne bieten die schuldenfreien Güter Szelce und Maderzewo im Tausch, einst für 26000 Ducaten gekauft, zuletzt mit 85000 Rthl Courant bewertet, dazu bis 100000 Rthl in Geld. Leutnant Sommer soll als Sachverständiger vorausreisen und entlohnt werden. Ferner die Verlobung der Tochter Adele mit dem Erbprinzen von Hohenloh Kirchberg.'
oe1bu9454-224: 'Bericht über einen neuen Kaufinteressenten: General Schimmelpfennig will die Güter für 230000 Rthl übernehmen und dabei seine Güter Seliz und Modkewo mit 110000, das Gut Goła wies des Herrn von Johnston mit 6000 Rthl sowie ein Kapital der Generalin von 66000 Rthl in ostpreußischen Pfandbriefen zum Nennwert einbringen, Fehlendes durch schlesische Hypotheken. Da er selbst zu alt ist, schickt er die Schwiegersöhne Rittmeister von Kotzow und von Johnston nach Zagorowo; Lieutenant Sommer ist unterrichtet. Der Plan eines Verkaufs an Weigel und Stössel gilt nach Auskunft des Rittmeisters von Stössel als gescheitert. Bitte, die Prozesse zum Abschluss zu bringen.'
oe1bu9454-226: Bericht über das Scheitern des geplanten Tauschgeschäfts mit General von Schimmelpfennig, der samt Sommer und dem ersten Boten ausgeblieben ist. Beigelegt wird ein Schreiben des Grafen von Wartensleben, Freund des alten Stössel, wonach eine Befriedigung Stössels und Weigels nur über die Güter im Herzogtum Warschau möglich wäre; Stössel solle mit Triebenfeld verhandeln und die Güter besehen. Triebenfeld weist den Vorwurf wegen der stockenden Prozesse zurück, verlangt die Originalurkunde über Zagorowo, da die Präfektur sonst Konfiskation androht, und fragt, ob der Trąbczyner Prozess fortzuführen sei.
oe1bu9454-227: 'Ein Pachtangebot des Unterpräfekten von Brzechsta für die Herrschaft Zagorowo auf 6 Jahre wird zur Entscheidung vorgelegt: jährlich 20.000 bis 25.000 rl, Instandsetzung der drei Vorwerke für 3000 Rthl, halbjährliche Zahlung und Sicherheit auf seine Güter, dagegen 10.000 Rthl Abstandsgeld bei Verkauf. Triebenfeld rät zum Abschluss, schildert seine Zahlungsnöte (1200 Rthl, 1240 Rthl 8 gr nach Warschau, 1250 Rthl Zinsen an den Invalidenfonds, 1250 Rthl an Weigel, 1730 Rthl Kosten) und die drohende neue Sequestration und fragt, ob stattdessen mit General von Schimmelpfennig verhandelt, Weigel und Stössel abgefunden und Köschentin freigemacht werden solle.'
oe1bu9454-228: 'Bericht über den Ausgang einer Sendung zum General Schimmelpfennig v der Oye: dieser ist zum geplanten Tausch der Zagorowoer Güter weiter bereit, doch drängt die Sache weniger, da er krank ist und das Zimmer noch nicht verlassen kann und die Verhandlungen des Rittmeisters v Schimmelpfennig mit Herrn v Stägemann in Berlin über die auszuzahlenden Gelder erst durch Vermittlung des sächsischen Gesandten eine günstigere Wendung nahmen. Da die nötige Besichtigung der Güter im Winter unmöglich ist, bittet der General um Aufschub bis zum Frühjahr.'
oe1bu9454-229: 'Glückwunsch zum Geburtstag des Fürsten, verbunden mit Geschäftsnachrichten: Generalprokurator Graf Lipski, Tribunalpräsident Smogorzewski sowie die Tribunalräte Rembowski, Michalski und Sobocki danken für das übersandte Wild; eine Entscheidung in der Sache Olesnica und Wrąbczyn stehe bald an. Mit dem Unterpräfekten Brzechsta ist sub spe rati ein Pachtvertrag über die Zagorowoer Güter allein zu 20000 Rthl geschlossen, der am 8. Februar in Schlawenschitz förmlich abgeschlossen werden soll; Zinsen seien gedeckt, das Bayonner Kapital werde getilgt. Die übersandten Originalurkunden gehen zurück.'
oe1bu9454-230: 'Drängende Mahnungen des Fürsten an Triebenfeld, der den für den 8. angesetzten Termin zur Ankunft mit Herrn von Brzechsta ohne Nachricht verstreichen ließ: erbeten werden endlich die Übersendung der Trąbczyner Schenkungsurkunde, klare Auskunft über Plan und Verwaltung der Zagorower Güter sowie schnelle Geldhilfe. Gegen die geplante Verpachtung an von Brechso kein Einwand, doch sei Eile nötig. Angekündigt wird der Kaufwunsch des General von Schimmelpfennig für Zagorowo (Besichtigung Anfang März) und eine beim König erbetene Kommission zur Regulierung der Schulden, zu der der Lieutenant Sommer geschickt wird.'
oe1bu9454-231: 'Bitte um ein persönliches Treffen: C. F. Weigel war vor einigen Wochen in eigener Sache in Kalisch und hoffte, Triebenfeld dort zu sprechen, erfuhr aber auch dessen derzeitigen Aufenthaltsort nicht. Da er sich über die Angelegenheiten zwischen dem Prinzen Johann zu Hohenlohe und sich selbst beraten möchte, bittet er Triebenfeld, einen Tag zu bestimmen, an dem er ihn in Kalisch oder an einem anderen Ort antreffen könne, und erwartet baldige Antwort.'
oe1bu9454-232: 'Bericht über schwere Krankheit, leere Kasse und die Lage der Güter: Triebenfeld bittet, die Pacht an Brzechsta und die gesonderte Verpachtung der Propination sollten die Rückstände von 1808 über 2000 einbringen; über Justizrat Kuntzel will er sich an den König von Sachsen wenden, damit Generalanwalt Lipski das Verhältnis zwischen Dominium und Untertanen regelt. Er erbittet dringend eine Vollmacht, 3125 Rthl, mit Zinsen und Kosten 4219 Rthl, aus den Dörfern Neu- und Alt-Swięcia, Wrąbczyn, Alt-Olesnica, Skokum, Kopojno, Sophienthal und Adelow durch einen Komornik einzutreiben. Sommer erhielt nur 4 Rthl.'
oe1bu9454-233: 'Drei Vorschläge zur Schuldentilgung: Drzewce solle von Sobottendorff, dem 40000 Rthl geschuldet werden, auf 18 Jahre zu 2000 Rthl jährlich verpachtet werden (36000 Rthl), dazu vier freigewordene Kolonistenstellen in Swixce zu je 1000 Rthl für die beiden Söhne; Weigel solle für seine 50000 M das Vorwerk Kopojno samt Propination neun Jahre zu 6000 Rthl erhalten und 2000 Rthl bar zahlen; Prinz August solle Triebenfelds 50000 Rthl beim Invalidenfonds ablösen. Ferner Nachricht zum verzögerten Meierowitz-Prozeß und zur Rechnungslegung des Cabanis.'
oe1bu9454-234: 'Bericht über die Verhandlungen mit Weigel, dessen schnelles Erscheinen erwartet wird: gelingt der Plan, entfällt eine Schuldpost von etwa 54000 Rthl und nach neun bis zehn Jahren sind die Güter frei, insgesamt etwa 90000 Rthl Schulden getilgt. Hauptschwierigkeit bleibt der Invalidenfonds, der etwa 9000 Rthl Zinsrückstände fordert und alles mit Beschlag belegt hat. Vorschlag, das Kapital von 50000 Rthl aus der Sackenschen Erbschaft an den Fonds zu zahlen; Bitte, Prinz August einzuschalten und den König um Befehl anzugehen, sowie um sofortige Übersendung des Instruments, notfalls mit zwei Zeugen.'
oe1bu9454-235: 'Bericht über ein Angebot des alten Weigel: Er will nicht nur den Pachtvertrag abschließen, sondern auch die Güter Zagorowo kaufen, die Schulden übernehmen und weitere 200000 Rthl zahlen, die er gegen Koschentin verrechnen möchte. Weigel rät, Koschentin heimlich zur Zwangsversteigerung zu bringen, dort als Gläubiger unter dem Schätzwert zu erwerben – vermutlich unter 600000 Rthl – und es dem Fürsten schriftlich abzutreten; niemand dürfe Fürst August oder den Fürsten dahinter vermuten. Triebenfeld erbittet dringend die Papiere und eine geheime Willenserklärung.'
oe1bu9454-236: Bericht über einen Besuch des alten Weigel, der Triebenfeld alle seine Geschäfte mit dem Fürsten übertragen hat und nun kaufen statt pachten will; deshalb hat Triebenfeld den Pachtvertrag zurückgestellt und bittet um die Ansichten des Fürsten, auch zum Verhältnis zu dessen Kindern. Sobottendorffs Sache lasse sich nach seiner Ankunft regeln. Dringend erbeten werden die Papiere und der unterschriebene, für den Präfekten bestimmte Brief. Cosmar habe gegenüber Triebenfelds Sohn erklärt, kein Gläubiger des Fürsten werde einen Groschen erhalten.
oe1bu9454-237: Nachricht, dass ein Bote den Brief an Landrat König nicht per Expressen nach Schlawenschi gebracht, sondern in Pol Wartemberg zur Post gegeben hat. Triebenfeld muss noch in der Nacht nach Dresden und weiter nach Naumburg an der Saale reisen, wo sein ältester Sohn mit Schüssen durch beide Schenkel verwundet liegt; er bittet, die Antwort postlagernd nach Dresden zu senden. Mit dem angekündigten Schreiben an den Kaiser hofft er Trąbczyn und Kaemen zurückzuerlangen. Trzciński, König, Zerboni und Meierowitz weichen aus; nur gegen Meierowitz läuft Execution. Radke ist durch etwa 80000 Russen gehindert.
oe1bu9454-238: 'Klage über ausgebliebene Nachrichten: der Fürst habe seit Triebenfelds Abreise aus Schlawenschitz nur dessen Schreiben vom 29. April erhalten; ein früherer Brief sei durch Koenigs Aufgabe zur Post beim Brand in Würtemberg verloren. Trzciński und Zerboni hätten noch nichts gezahlt, Weigel dränge, weshalb der Fürst ihn mit Trzciński-Wechseln beruhigen wolle. Beigelegt ist ein offenes Schreiben an den russischen Kaiser; berichtet wird auch von abgelehnten Gesuchen an König, Staatskanzler und Justizminister um Unterstützung des Vergleichs mit den Gläubigern in Brieg und eines Unterhalts.'
oe1bu9454-239: 'Reisebericht von der Fahrt nach Neisse: ein Gichtanfall und eine Nacht im Freien bei Regen, weil der Weg grundlos war. Nachrichten zur Lage nach dem Waffenstillstand: der König drei Tage in Neisse, Aufbruch Richtung Töplitz zum russischen Kaiser, Zweifel am Kommen König Franz'' und am Beitritt Österreichs, das Neutralität anzeigt; Bülow und Czerniczeff mussten sich fügen, Napoleon nach Paris geeilt. Die Regierung zieht nach Franckenstein, die Post ist wiederhergestellt. Triebenfeld reist zu General Ortel nach Neustad, sein Plan fand Beifall; Briefe an Madame von Hahn und Oberforstmeister von Kleist sind besorgt.'
oe1bu9454-240: 'Lagebericht aus dem Kriegsjahr 1813: Österreich bleibe gewiss neutral und wolle nur vermitteln, die russischen Truppen murrten, selbst Generale verwünschten den Waffenstillstand und wollten hinter die Weichsel zurück. Wiedergegeben wird ein Streitgespräch zwischen Generalleutnant von Koch: und Minister Hard: vor dem Monarchen über den Rückzug, die Aufgabe Sachsens und den Nutzen der Waffenruhe für Nap:. Ferner Sorge um die Verpflegung, verschlammte Wege und Pferdesterben; General Zastrow soll die 55000 Mann Landwehr bei Neisse führen, Generalleutnant Ortell liege krank. Triebenfeld reist über Neisse und Frankenstein zum Hauptquartier und nach Schwierin, um Naturalien zu verkaufen und Geld zu beschaffen.'
oe1bu9454-241: 'Bericht über die Übergabe eines fürstlichen Schreibens an General Gneizenau in Neisse, der Antwort zusagt und den Fürsten beruhigt. Mitteilungen zur Lage: General Zastrow in Preußen ernannt, Gneizenau befehligt die schlesische Landwehr von 55000 Mann und ist zugleich Chef des Generalstabs und Militärgouverneur; Generallieutenant von Koch habe dies bewirkt und spreche warm vom Fürsten. M Hard: sei beim Kaiser in Böhmen. Zur Verpflegung der Armen aus Polen halte man an Triebenfelds Plan fest; Truppenschauen bei Oppendorff. Klage über Gicht.'
oe1bu9454-242: 'Bericht über die Ankunft in Wien nach dreitägiger Reise, die hohe Teuerung und das entwertete Papiergeld sowie die Verschiebung des Congresses auf den 1. November, da die Souveräne nach Ofen und Pest reisen; Frankreich widersetze sich dem sächsischen und polnischen Erwerb. Hardenberg sei wohlauf und standhaft. Zu den Geschäften: die württembergischen Sachen gehen gut, Gespräche mit Gärtner und Goesch; der Schlaw. Plan sei gebilligt, Koschentin ruhe bis zum Erfolg der kurländischen Sache, Külm, Kaehmin und Trąbczyn bis zur Entscheidung über Polen, wobei die Moscinska geb. Prusimska starke Fürsprecher habe.'
oe1bu9454-243: 'Dringende Bitte um weitere 300 Rthl in Gold binnen acht Tagen, da die Teuerung in Wien die Mittel verzehrt: 400 Rthl mussten gewechselt werden, weil kein preußisches Courant angenommen wird, dafür 1200 fl. in Wiener Einlösungsscheinen, von denen bereits 392 fl. verbraucht sind. Eine Aufstellung der täglichen Kosten – Zimmer, Essen, Wein, gemieteter Lackei, Fuhren – ergibt rund 50 fl. oder 15 Rthl am Tag, dazu 260 fl. Rückreise. Bleibt das Geld aus, will Triebenfeld am 23. abreisen; Quartier zur Goldenen Ente, Schulerstraße.'
oe1bu9454-244: 'Bericht aus dem Wiener Kongress: das große Manöver der Monarchen, der Kaiser von Österreich, Großfürst Constantin und der preußische König zu Pferde, der König von Württemberg dagegen im achtspännigen Wagen und vom Manöver ausgeschlossen; der Trinkspruch des Königs auf die Soldaten. Fürsten und Stände wollen über Fürst Metternich die Rückkehr Österreichs an ihre Spitze erbitten, werden aber zur Geduld verwiesen. Über Sachsen und Polen ist noch nichts entschieden; Minister von Hum. wirke günstig für den Fürsten. Geheimer Rat von Gärtner ist krank. Anfrage, ob wegen des aufzuhebenden Vergleichs von 1811 jemand zum Oberlandesgericht Brieg geschickt werden solle.'
oe1bu9454-245: 'Bittschrift an Staatskanzler von Hardenberg zugunsten des Fürsten zu Hohenlohe-Ingelfingen: Die 1799 königlich bestätigten Fideikommissgüter Schlawenschitz, Lassowitz und Oppurg, über zwei Millionen Rthl wert und mit 79500 Rthl Jahresertrag, würden vom Testamentsexekutor Cosmar beherrscht, der die Einkünfte ohne Rechnungslegung einziehe. Triebenfeld greift den Vergleich von 1811 als erschlichen an, verlangt dessen Aufhebung, Cosmars Entfernung und einen Vorschuss von 112000 Rthl zur Abfindung der Lutz-Erben (Forderung 426000 Rthl), wofür er selbst 60000 Rthl Sicherheit bietet. Beilagen A–E.'
oe1bu9454-246: 'Nachrichten vom Wiener Kongress: die Monarchen sind nach Ungarn abgereist, die Eröffnung verschiebt sich, Sachsen soll ganz an Preußen fallen, über Polen ist nichts entschieden, da Österreich und Talleyrand hinhalten; ein Streifen von Thorn über Kalisz nach Kempen wäre für Preußen kein ausreichender Ersatz. In der Sache der polnischen Güter soll Triebenfeld stillhalten, bis Polens Schicksal entschieden ist; der Staatskanzler will dann in Trąbczyn tätig werden. Ein zweimal umgearbeitetes Gesuch mit Beilagen wurde eingereicht, da das fürstliche Schreiben als Vollmacht gilt. Beigefügt eine Druckschrift Gärtners; Koschentin ruht, Zerboni erhielt den Roten Adlerorden.'
oe1bu9454-247: 'Bericht aus Wien über den Stand der Verhandlungen: Nach der Entscheidung über Polens Schicksal sei für den Fürsten nichts mehr zu erbitten; Minister von Humboldt habe Unterstützung zugesagt, und der Staatskanzler habe die verlangte Summe als Kleinigkeit bezeichnet, doch Widerstand des Justizressorts gegen die Aufhebung des von Cosmar erschlichenen Vergleichs erwartet. Triebenfeld bestreitet Rechte der alten Fürstin Sacken und Cosmars an den Fideikommissgütern; mit 112000 Rthl seien die kurländischen Erben zu befriedigen, andere Gläubiger mit 12000 Rthl jährlich. Beigefügt eine Ertrags- und Zahlungsaufstellung über 79462 Rthl.'
oe1bu9454-248: 'Bericht über den Stand der Entschädigungssache am Wiener Kongress: Staatskanzler und Minister Freiherr von Humboldt betrieben die Angelegenheit eifrig, der König habe eine Regelung zugesagt, es gehe um 314000 Rthl und den Vorschuss von 112000 Rthl sowie um neun Jahre rückständiges Gehalt. Graf Winzingerode fordere für Prinz August aus dem Testament der Fürstin Sacken 10000 Rthl aus den Fideikommissgütern Schlawenschitz und Lasswitz; Triebenfeld verweist dagegen auf die 1799 bestätigte Urkunde und erwähnt mögliche Sequestration. Dazu Nachrichten über Sachsen, Frankreich und Unruhen in Baden und Württemberg.'
oe1bu9454-249: Bestätigt den Empfang zweier fürstlicher Schreiben vom 30. Oktober und 4. November und drängt auf schnelle Übersendung von 12000 Rthl für die kurzfristig Bevollmächtigten, um mit ihnen abzuschließen; weitere 10000 Rthl würden dann in Berlin zur Zahlung angewiesen. Die Eingabe liege schon beim Kaiser, weshalb Hofrat Hahns Aufsatz nicht mehr beigefügt werden könne. Berichtet über Stimmungen auf dem Congress, eine geheime Konferenz Metternichs mit Wrede und Wessling, die Rückgewinnung alter Rechte der Mediatisierten sowie eine von Göschell übersandte Vollmacht, die der Fürst neu ausstellen möge.
oe1bu9454-250: Bestätigung des Empfangs eines Schreibens Triebenfelds vom 3. November und der darin mitgeteilten, an den Fürsten von Hardenberg gerichteten Denkschrift; Humboldt sendet eine Abschrift der Denkschrift zurück und stellt in Aussicht, sich der Sache zu widmen, soweit sie in seinen Wirkungskreis fällt. Beigelegt als Anlage zu Triebenfelds Brief vom 17. November.
oe1bu9454-251: Abschrift einer Bittschrift für einen namentlich nur mit Initialen bezeichneten Fürsten, für den ein Rechtskundiger aus den Akten ein weiteres Gutachten gefertigt hat, das Triebenfeld auftragsgemäß übersendet. Erbeten wird die schriftliche Zusage, die 112000 Rthl zur Abfindung der L.schen Erben vorzuschießen, auch nicht sogleich bar; dann könne der Vergleich mit dem Mandatar rechtsverbindlich geschlossen, die Garantie zurückgegeben und die 1790 vorgeschossenen 35000 Rthl gerettet werden. Jede Verzögerung sei gefährlich, da dem König sonst ein Verlust von 461000 Rthl drohe.
oe1bu9454-252: 'Antwort Hardenbergs auf eine Eingabe Triebenfelds vom 25. des Vormonats: Die Angelegenheit des Fürsten von Hohenlohe wegen der Forderungen an Trąbczyn und Kaemen werde sich von selbst erledigen, sobald die laufende allgemeine Auseinandersetzung und Übereinkunft über das Herzogtum Warschau zur Ausführung komme. Eine eigene Entscheidung oder Zusage enthält das kurze Schreiben nicht; es verweist Triebenfeld auf den Ausgang der Verhandlungen.'
oe1bu9454-253: 'Bericht über die Bemühungen beim Staatskanzler: Das zweite Gutachten des Hofrats Hahn wurde samt Abschrift eines Schreibens übergeben; die Antwort brachte nichts Neues, doch stimmen die Urteile überein. Die Herzogin von Sagan wolle Gelder auf Sagan aufnehmen und weise dafür gerade die dem Fürsten garantierte Summe an; der König habe die Sache erneut bis zur Rückkehr vertagt. Beigefügt eine Antwort auf eine mündliche Anfrage wegen Trąbczyn und Kaemen. Dazu Nachrichten vom Wiener Kongress und über die Unruhe in Württemberg und Baden.'
oe1bu9454-254: 'Dringende Geldforderung aus Wien: Für 4-5 Wochen hatte Triebenfeld 1400 Rthl erbeten, bislang aber nur 640 Rthl erhalten und schuldet Barbe 94 Ducaten; die Vertrauten des Fürsten Kanzlers kosten täglich 20-30 Rthl. Er verlangt binnen 14 Tagen Geld, 100 Ducaten nach Wien und 200 Rthl für seine hungernden Kinder, und zählt auf, was er erreiche: Rückgabe der polnischen Güter, Tilgung der kurländischen Schuld von 461000 Rthl, Lösung aus den Koschentiner Bindungen. Ferner Postweg über Neisse und Oberpostdirektor Mann, Schweigen über den Koschentiner Verkauf, Bitte um Bericht des Brieger Oberlandesgerichts. Beiliegend zwei Empfangsbestätigungen (60 Stück; Beutel vom Referendar Bally).'
oe1bu9454-255: 'Bericht über den Stand der Sache am Wiener Kongress: Staatskanzler Fürst Hardenberg liegt seit fünf Tagen krank, hat die Angelegenheiten des Fürsten aber eigenhändig aufgesetzt und einen weiteren Bericht verlangt; Minister Humboldt spricht von einem schon gewonnenen Spiel, unterstützt durch das Gutachten des Hofrats Hahn. Die Militärsache ruht bis Berlin. Alles hänge am Abschluss der kurländischen Sache, am Sturz Cosmars und am Besitz der Güter als Fideikommissherr. Abreise des Königs und des Kaisers nach Berlin; Triebenfeld kündigt seine Ankunft für den 11. an und bittet, keine Briefe mehr zu senden.'
oe1bu9454-256: 'Bericht über den Stand der Verhandlungen am Kongreß: die Abreise der Verbündeten ist um vier bis sechs Wochen verschoben, in der polnischen Gütersache daher noch nichts entschieden. Der Staatskanzler hat den Geheimen Staatsrat Stägemann mit einem Gutachten beauftragt; nach Berlin geht Befehl an Minister von Kircheisen und Finanzminister von Bulow, eine Kommission zur Untersuchung des Vorgehens Commers einzusetzen. Offen bleiben der Ausgleich mit den Caric-Erben und ein Vorschuß von 112000 Rthl. Triebenfeld bittet dringend um Geld, Beweisstücke, den Vergleich von 1811 und Blankovollmachten sowie um Unterstützung seiner Kinder in Breslau.'
oe1bu9454-257: 'Rückfrage zu einer Eingabe vom 23. desselben Monats: Dort sei behauptet worden, der Fürst von Hohenlohe habe im Vergleich von 1811 zugesagt, das den kurländischen Erben geschuldete Kapital von 500000 Rthl selbst zu zahlen und die Gräfin aus der Mitverpflichtung zu entlassen. Da Gruemann diese Stelle im beigelegten Vergleich nicht findet, bittet er, sie mit Rotstift zu bezeichnen und ihm die Schrift durch den Boten zurückzugeben.'
oe1bu9454-258: Erneuter Vorstoß zur Ablösung der Kurz'schen Schuld, nachdem Triebenfeld auf seine Schreiben vom 23. Oktober und 28. November keine Antwort erhielt und durch Geheimen Staatsrat Stägemann erfuhr, die Sache solle einer Kommission in Berlin vorgelegt werden. Die kurländischen Erben, darunter die Herzogin von Sagan, würden die Schuld von 426000 Rthl mit 112000 Rthl in Jahresraten von 25000 Rthl für erledigt halten; dazu sollen 35000 Rthl von 1790 aus der Breslauer Kasse getilgt werden, Vorteil für den Staat 46000 Rthl. Er bietet 60000 Rthl Sicherheit und bittet um eine Audienz; Rückfrage bei Graf Wratislaw hält er für schädlich.
oe1bu9454-259: 'Nachricht, dass Staatskanzler Hardenberg die Hohenlohe-Sache vorziehe und eine Resolution an das Oberlandesgericht Brieg zu schnellster Untersuchung und Berichterstattung erwartet werde; bei entsprechendem Bericht würden die 42000 rt. gezahlt. Triebenfeld drängt den Fürsten, vor dem Kommissar in Brieg oder Schlawenschitz selbst offen auszusagen: die Auseinandersetzungen seien zum Nachteil der Gläubiger errichtet, die Schulden fiktiv, die Erklärung über 300000 Rthl und das Kodizill von Cosmar erschlichen. Rat: nichts ohne Hofrat Hahn tun, niemanden schonen, auch den Sohn nicht. Übersendung per Kurier bis Neisse.'
oe1bu9454-260: 'Nachtrag zur am Vortag übersandten Resolution des Staatskanzlers Fürst Hardenberg und der Verfügung an das Oberlandesgericht Brieg: Triebenfeld gibt dem Fürsten sieben Punkte an die Hand, die Hofrat Hahn in Brieg vertreten soll – erzwungene Zustimmung zu Vergleichen und Codicill, zum größten Teil erdichtete Summen zugunsten der älteren Prinzen, Fälschungen Cosmars, die durch Vollmacht erschlichene Wendung des Sohnes gegen den Vater samt Sequestration; Ziel ist Aufhebung der Vergleiche gegen das Senatsinstrument von 1799 und Vergleich mit den Gläubigern bei 112000 Kapital. Erbittet Abschrift der Resolution, vier Blanketts und eilig 300 Rthl in Gold, da ihm nur 118 f bleiben.'
oe1bu9454-261: 'Nachricht von der zugesicherten Rückgabe der polnischen Güter: eine Berechnung der Erträge liegt bereit, betrifft aber nur die Trąbczyner Güter, während Leixner seine Schadensrechnung für die Kaemer Güter selbst vertreten soll; unklar bleibt, was auf die Güter im Kujawischen eingetragen ist. Alles hänge nun an der Erklärung des Fürsten und dem Bericht des Oberlandesgerichts Brieg; dann seien 112000 Rthl für die kurländischen Ansprüche da und Cosmar samt Vergleichen und Codicillen erledigt. Beigelegt ein Formular zur Vollmacht für den Geheimrat von Göschel; Triebenfeld ist 50 Ducaten verschuldet.'
oe1bu9454-262: 'Bericht über Staatskanzler Hardenbergs Wohlwollen: dieser habe den Fürsten als den am schlimmsten behandelten Geschädigten bezeichnet und wolle nach Bestätigung der Denkschriften das Geld zur Befriedigung der Curlschen Erben zahlen lassen, den Vergleich aufheben und Cosmar zur Rechenschaft ziehen. Triebenfeld erbittet Blanketten, vor allem einen eigenhändigen Dankbrief an Hardenberg mit Hinweis, daß Connus statt 72000 Rthl nur 2500 Rthl zahlte, ferner rasche Abschriften der Kommissions- und Oberappellationsberichte, 100 Ducaten für seine Not und Unterstützung seiner Kinder in Breslau. Anhang zu französischen Forderungen Meyers.'
oe1bu9454-263: 'Bericht aus dem Wiener Kongress: Der württembergische König ist als Graf von Teck abgereist, nachdem er 4000 Ducaten unter der kaiserlichen Hofdienerschaft verteilt hatte; Kronprinz, Winzingerode und Linden bleiben mit Vollmachten bis zum Kongressende, Geheimrat Göschel überreicht eine weitere Note im Namen des Fürsten. Hauptsache ist die Vollmacht für Hofrat Hahn und Lombardini nach Brieg; der Fürst Staatskanzler verlangt persönliche Vernehmung des Fürsten in Brieg oder durch einen Kommissar in Schlawenschitz, um die Angaben zur Befriedigung der kurländischen Erben zu bestätigen. Die polnische Sache ruht bis Kongressende.'
oe1bu9454-264: 'Bericht über den gescheiterten Versuch, Koschentin an den Staat zu verkaufen: nachdem der König Tausch und Kauf von Gütern nicht mehr zulässt, vertraute Triebenfeld sich dem Hofrat Barbe an, der über das geforderte Geschenk von 30000 Rthl für den Fürsten Hard: empört war. Stattdessen soll nun der reiche Graf Pourtales, dem Barbe Auszüge aus Taxen und Tabellen zusandte, Koschentin, Boronow und Cieschow für etwa 900000 Rthl bar erwerben. Erbeten wird eine eigenhändige Verschreibung über 30000 Rthl preußisch Courant für Barbe, gültig wie ein Wechsel.'
oe1bu9454-265a: Dank an einen Geheimen Staatsrat für dessen Betreiben in der Fideikommissangelegenheit und Bitte, den entscheidenden Vorschuss von 112000 Rthl zur Abfindung der Burischen Erben zu bewilligen; dann falle der König aus dem Nexus, erhalte die garantierte Schuldverschreibung über 300000 Rthl zurück und für die alte Schuld von 35000 Rthl insgesamt 461000 Rthl, Cosmars Einfluss ende. Zur Tilgung verweist der Schreiber auf Cosmars Rückstände von 60000, 100000 und über 48000 Rthl; Belege könne von Triebenfeld vorlegen.
oe1bu9454-265b: 'Bittschreiben um Fürsprache bei der Wiedererlangung der Güter Trąbczyn: 1796 hatte der verstorbene König dem Fürsten die von Prussiemski eingezogenen Güter Kaemen (bei Miedzeritz, Departement Posen) und Trąbczyn (Kreis Konin, Departement Kalisch) verliehen; 1807 nahm sie die Warschauer Verwaltungskommission weg und gab sie Prussiemskis Tochter, verheirateter Miączyńska, zurück. Das Tribunal Kalisch erklärte sich für unzuständig und verwies an Napoleon. Nun soll der Adressat beim Kaiser die Rückgabe samt achtjähriger Einkünfte erwirken; Bedenken wegen des Einflusses der Moscinska auf den Generalgouverneur Landskog. Verweis auf Triebenfeld.'
oe1bu9454-266: 'Bericht über die Verhandlungen um Polen: Russland fordere die Prosna als Grenze von Thorn bis zur Warthe-Mündung, wodurch die Trąbczyner Güter und Triebenfelds Blizanow unter fremde Hoheit fielen; der Fürst Staatskanzler widersetze sich, der König zeige sich verstimmt, in Wien und Berlin gehe Kriegsgerede um. Dazu eine genaue Anweisung für den Briefweg über Breslau und Dresden (Postdirektor Balke, Barbe), Mahnung nach den Blanko-Vollmachten und dem Schreiben an den Staatskanzler, Hinweis auf Pourtales'' Vermögen sowie die Bitte um 100 und weitere 200 Ducaten, da Triebenfeld B. 104 Ducaten schulde und in Not lebe.'
oe1bu9454-267: 'Dringende Mahnung, dass seit dem am 21. Dezember eingetroffenen Schreiben vom 17. Dezember keine Nachricht mehr kam: Triebenfeld erbittet das Schreiben an den Fürsten Staatskanzler, die Blanketten, die Vollmacht für den Geheimen Rat von Goeschel, die schriftliche Zusage wegen Koschentin sowie Geld, da B nichts mehr zahle und Hungern die Sache schon für halb unwahr halte. Vor allem fehle der Bericht aus Brieg. Dazu Nachrichten vom Wiener Kongress: Englands Frieden mit Amerika, Russlands Druck wegen Polen, Prinz Bertenstein Stetten erhielt in Paris 400000 Francs, Hardenbergs Erholung.'
oe1bu9454-268: 'Empfangsbestätigung eines Schreibens mit 1125 fl Papiergeld sowie Bericht über die Wiener Verhandlungen: die Briefe an den Kaiser und den Fürsten Staatskanzler sind übergeben, weitere an General von Schöler und Staatsrat Stägemann abgegangen; erwartet werden der Bericht aus Brieg und die Antwort des Grafen von Pourtales. Bei Cosmars Entfernung und Aufgabe der 112000 Rthl für die Kur''schen Erben löse sich alles; die Trąbczyner Sache und Hahns Nachricht über zu geringe Einkünfte der Fideikommissgüter bereiten Sorge. In einem Nachtrag bittet Triebenfeld dringend um 200 Ducaten, auch zur Rückzahlung von 100 Ducaten an Hardenberg.'
oe1bu9454-269: Bericht über die Übergabe der von Kircheisen-Korrespondenz an den Fürsten Staatskanzler Hardenberg durch den Hofrat B:, mit beiliegender Abschrift des eigenen Schreibens; die Sache liege nun bei Geheimer Staatsrat Stägemann, Cosmars Sturz und die Bewilligung des Darlehns gelten als fast gesichert. Sorge um Trąbczyn, falls der Kreis an Russland fällt; noch fehlt die Erlaubnis, sich an die russischen Behörden zu wenden. Dazu Nachrichten über Constantins Werben in Polen, Kriegsgerüchte, das Auseinandergehen des Wiener Kongresses und die erwartete Antwort des Grafen Pourtales.
oe1bu9454-269a: Abschrift einer Bittschrift, mit der Triebenfeld im Auftrag des Fürsten von Hohenlohe eine Aktensammlung überreicht, darunter den Schriftwechsel mit Minister von Kircheisen und ein Schreiben des Medizinalrats Cossnar vom 22. Juni 1810, das Cosmars Vorgehen gegen den alten Prinzen belegen soll. Die Erben Kurz forderten 300000 Rthl, seien aber mit 112000 Rthl abzufinden, davon 12000 Rthl sofort in Barem, für 100000 Rthl eine sichere Anweisung. Triebenfeld bittet um Vorschuss und verbürgt sich mit Vermögen und Freiheit; Prinz August ziehe Cosmars Vollmacht zurück.
oe1bu9454-270: 'Lagebericht vom Wiener Kongreß: Auch Kalisch werde russisch, so daß die Rückgewinnung von Traperin nur noch auf russischer Seite zu betreiben sei; der Fürst-Staatskanzler verbietet Triebenfeld jede Démarche, Moszynski und Graf Landskoy stehen entgegen. Zugleich Hoffnung auf den Kanzler und Herrn von Humboldt; die Sache liegt beim Geheimen Staatsrat Stägemann. Sind die Lux befriedigt und Cosmars Arrest von den Fideikommißgütern gelöst, sei Cosmar erledigt. Sorge bereitet der dem Brieger Protokoll beigefügte Ertragsanschlag. Ferner Nachrichten über Wellington, Sachsen und Metternich.'
oe1bu9454-271: 'Bericht aus dem Wiener Kongress: Die polnische Grenze ist von Thorn über Slupce bei Pyzdry, die Warthe und die Prosna festgelegt, ebenso der bei Sachsen verbleibende Rest mit Dresden, Leipzig und Bautzen. England fordere Ostfriesland, Kaiser Alexander ein deutsches Gebiet für den Vizekönig von Italien. Triebenfeld mahnt beim Fürsten Staatskanzler und bei Geheimrat Stägemann; der Vorschuss von 112000 Rthl gelte als sicher. Er rät, Cosmar die Vollmacht zu entziehen und dies dem Justizminister und dem Oberlandesgericht Brieg anzuzeigen; die Entscheidung über die polnischen Güter stehe aus.'
oe1bu9454-272: Übersendung eines entworfenen Antwortschreibens an Prinz August; der Widerruf der Vollmacht ergebe sich aus den Wiener Beschlüssen. Hahn hält eine mündliche Verhandlung in Öhringen für nötig, um neue Fehlgriffe zu verhindern, und erbittet für den äußersten Fall eine geheime Instruktion samt Vollmacht sowie eine eigenhändige Zeile zum Reisegeld. Goldstüker sei mit der Reise wegen des Wechsels zu beruhigen; Herr von Braun, Cosmar nicht gewachsen, gelte ihm als Ursache aller Schwierigkeiten. Zudem kündigt er eine Besichtigung der Güter zum Ertrag und zu den Baukosten an.
oe1bu9454-273: 'Punktweise Rechtfertigung gegen die Vorwürfe des Fürsten: General Schüler und Graf Nessetrock halten sich zurück, Hilfe sei nur über den Staatskanzler und Minister Humboldt zu erwarten; für ein weiteres Schreiben an den Kaiser werden zwei französische Blanketts erbeten, das Hofrat Barbe entwerfen soll. Zum Widerspruch der Erträge (79000 gegen 36000 Rthl, Hahns Ansatz 60000 Rthl und zwei Millionen Wert) weist Triebenfeld jede Schuld zurück, ebenso den Verdacht heimlicher Abrede mit den kurländischen Erben; er verlangt einen Nachfolger und nennt Hofrat Hahn als Administrator.'
oe1bu9454-274: 'Nachrichten vom Wiener Kongress: Der König von Württemberg hat die Stände wiederhergestellt und auf den 15. März einen Landtag einberufen, verbietet aber jede Senkung der um 50 Prozent erhöhten Abgaben; der alte Metternich und andere Stände haben dagegen beim Kongress protestiert. B. und Göschel bitten, Prinz August zu warnen, dort nichts zuzugestehen. Ferner zum König von Sachsen, Hessen-Darmstadt, Ostfriesland und Schwedisch-Pommern. Der Vorschuss von 112000 Rthl verzögere sich bis zur Friedensgewissheit; für die Trąbczyner Vindikation sind Urkunden beglaubigt abgeschrieben und die Prozessakten übersetzt.'
oe1bu9454-275: 'Klage, daß der Geheime Staatsrat Stägemann für den Fürsten Staatskanzler noch immer keinen Vertrag aufgesetzt habe; trotz Mahnungen werde stets auf Arbeitslast verwiesen, Triebenfeld vermutet Unwillen. Die Entscheidung fiele zugunsten Cosmars aus, wäre der Brieger Bericht nicht so günstig. Krank und ans Bett gebunden, arbeitet er nur durch Freunde. Dringend nötig seien Geld und die angebotenen Blanketten: der Übersetzer gebe die Akten zu Trąbczyn, Kulm und Kaemen ohne Bezahlung nicht heraus, sodaß die Vorlage bei der Kommission stocke.'
oe1bu9454-276: 'Bestürzung über eine beiliegende Abschrift eines Schreibens des Justizrats Eberhard aus Brieg: in Wien sei nichts verfügt, die Sache liege noch bei Geheimem Staatsrat Stägemann; ein Verrat müsse aus Brieg selbst stammen. Triebenfeld verlangt nur die 112000 mk zur Abfindung der Curischen Erben und Verwaltung der Güter zur Deckung des Vorschusses von 112000 Rthl, bittet um Eberhards sofortige Reise nach Wien zum Vergleich mit den Prinzessinnen und berichtet, die königliche Antwort sei nur eine von Minister von Humboldt verfasste Floskel; dazu Nachrichten über Hardenberg, Sachsen und die Reisen der Monarchen sowie die fertige Bittschrift wegen der polnischen Güter.'
oe1bu9454-277: 'Bestätigt den Empfang eines Kuriersendung mit der Anweisung über 200 M, drei französischen Blanketten und Briefen, darunter von Hofrat Hahn. Kurz gefasst wegen Zeitnot: Stägemann hat noch keine Audienz erhalten, die Standessache samt Akten liegt wieder beim Fürsten, auf Rat des Geheimen Staatsrats von Beugelin wurde an Zerboni geschrieben, dessen Antwort beiliegt; Cosmar gilt als erledigt. August soll die Vollmacht in vorgeschriebener Form fordern; Göschel, E. Bastenstein und Winzingerode drängen auf Widerruf. Schließlich Nachrichten von Napoleons Landung bei Antiber, Massena, Murat und dem Congress.'
oe1bu9454-278: Eberhard drängt den Fürsten, 5 bis 600 Rthl für eine Reise nach Wien aufzubringen, da nur jetzt, bei persönlicher Anwesenheit der drei Prinzessinnen, ein Vergleich mit den Curischen Erben zu erreichen sei. Er selbst habe kein Geld und könne es nicht leihen; zudem hindere ihn die Weisung der Generalmandatare der Erben, sich nicht einzumischen, und er brauche Pässe von Justizminister und Staatskanzler. Er habe Triebenfeld seinen Plan mit zwei möglichen Anlässen für die Reise vorgelegt und verweist auf Korb als Geldquelle.
oe1bu9454-279: 'Bericht über den Stand der polnischen Güter: Ein Vergleich mit den Curischen Miterbinnen sei vordringlich; komme er zustande, werde der Fürst Staatskanzler den Vorschuss und die Verwaltung veranlassen. Triebenfeld erwartet dringend J. C. Eberhardt, erwähnt die von Prinz August zurückverlangte Vollmacht, Cosmars bedrohte Lage, die Kohlensache, Pourtales und Landskoy. Eine Resolution werde hinausgezögert, bis über die den Donatoren nach dem Tilsiter Frieden entzogenen Güter entschieden sei. Ausführlich Nachrichten über Napoleons Vormarsch, Ächtung und Grenoble sowie den Wiener Kongress.'
oe1bu9454-280: 'Antwort auf zwei Schreiben vom 10. und 13.: Dringend wird Eberhards Reise nach Wien gefordert, weil ohne Vergleich mit den Burischen Erbinnen Cosmar und Stägemann die Sache verschleppen; Eberhard könne die Erklärung der Prinzessinnen und die Zustimmung des Staatskanzlers zum Vorschuß erwirken, notfalls 50 bis 100 teurer. Beklagt wird die Klausel im Testament wegen Adolphs Volljährigkeit und daß Prinz August die Vollmacht noch nicht widerrufen hat; genannt werden 18000 Rthl und 100000 Rthl. In der polnischen Sache verweist der Fürst Staatskanzler nur weiter. Dazu Nachrichten über Napoleons Marsch auf Paris, Wellington, Talleyrand und Kaiser Alexander.'
oe1bu9454-281: 'Bitte um Fuhrwerk für Stock, den Bedienten des Hofrats Barbi, der die Schwester des Hofrats ins Reich abholen soll: ein Korbwagen mit Halbverdeck aus Zwillich sowie ein zweispänniger Wagen, um für Barbe, Heym und Philippsborn in Prag lagernde Kisten Glas mit Freipass nach Schlawenschitz zu bringen; Knecht und Trommelschläger sollen mit Pass zurückgeschickt werden. Ferner: von Stägemann und Pourtales schweigen, die Köhl-Sache bleibt ungewiss, Eberhard fehlt zum Vergleich mit den kurländischen Erbinnen, auch bei 50 000 bis 100 000 Rthl mehr; Nachrichten zu Württemberg, Kongress und Napoleon.'
oe1bu9454-282: 'Dringende Antwort auf zwei fürstliche Schreiben vom 18.: Ohne Vergleich mit den Prinzessinnen sei nichts zu erreichen; dem Fürsten Kanzler sei vorgespiegelt worden, die Weiler wollten sich einigen, und bei weiterem Zögern verlören die Damen 300000 Rthl. Triebenfeld verlangt die Reise des Rats von Eberhard nach Wien, für den nur ein fürstlicher und ein städtischer Paß nötig sei. Kritik an Prinz Augusts Annahme des Präsidentenamts; die 100000 Rthl sollen ihm bar ausgezahlt werden. Dazu Aufträge zu Pferden, Wagen und Glas aus Prag sowie Nachrichten über Napoleons Vormarsch.'
oe1bu9454-283: Zusage, ein dem Fürsten Staatskanzler zugedachtes Schreiben des Fürsten unverzüglich zu übergeben und bei dieser Gelegenheit auch dessen mündlich mitgeteilte Wünsche vorzutragen; Beugelin stellt sich für die Ausführung etwaiger Aufträge des Staatskanzlers zur Verfügung, hält aber seine eigene Fürsprache für entbehrlich. Herrn von Triebenfeld habe er erst in Wien kennengelernt; dessen Anliegen habe er allein wegen der Empfehlung durch den Fürsten aufmerksam angehört. Französisch geschrieben.
oe1bu9454-284: 'Bericht über den Stand der Entschädigungsforderung: Nachdem Alexander durchgesetzt hat, daß die Kohlen die von der Sequestrationskommission zurückgegebenen Güter behalten, will Triebenfeld beim Kaiser und König eine Abfindung erwirken. Seine Rechnung: 60000 Rthl Pfandgeld an von Broniewski samt 33000 Rthl Zinsen, Kaemen zu 180000 Rthl veranschlagt, Trąbczyn zu 316000 Rthl abzüglich der Schulden für Lichnowski (40000), Grotowski (20000) und Seher (8000), zusammen 459000 Rthl, davon 93000 Rthl in Barem. Weigels 30000 Rthl stehen auf Zagoran. Dazu ausführlich Napoleons Rückkehr nach Paris, Ney, Murat, die Teuerung in Wien und der Württemberger Skandal. Bitte um Blanketten und um Eberhards Anwesenheit.'
oe1bu9454-285: 'Eine Aufstellung der Ansprüche des Fürsten als Pro Memoria: Für die 1796 vom König verliehenen Kaemenschen Güter, die Anton von Prussiemski zuvor an Broniewski für über 100000 Rthl verpfändet hatte, zahlte der Fürst 1804 nach verlorenem Prozeß (Kosten über 6000 Rthl) 55000 Rthl Vergleichssumme, samt Zinsen 1804-1815 rund 94550 Rthl, die die geborene Prusimska zurückzahlen soll. Trąbczyn ist auf 316000 taxiert, darauf Schulden bei Lichnowski, Weigel, Grotowski, Seeher und von Zerboni von 138000 Rthl, davon 60000 bezahlt. Gesamtforderung 461714 Rthl, in Gütern oder Geld zu entschädigen.'
oe1bu9454-286: 'Lagebericht über Napoleons Rückkehr: er stehe fast am Rhein, habe über 200000 Mann, Ney ziehe gegen die Schweiz, Wellington sammle englische Truppen, die Russen passierten am 7. April Prag; nur die preußischen Truppen würden vorgeschoben. Hardenberg versprech alles, Stägemann handle eigenmächtig; allein General Amstetten sei gutwillig und rate zur Entschädigung durch Güter. Beigefügt ein Pro Memoria zu Kaemen und Trąbczyn (Prussiemski, Broniewski 55000 Rthl, Chełmski 36000 Ducaten, Leixner, Meyer Bernhard) mit einer Gesamtforderung von 390100 Rthl; Nachtrag vom 14. April.'
oe1bu9454-287: 'Bericht über den Plan, den jungen Adolph beim König in Wien vorzustellen: Triebenfeld will vor dessen Abreise am 18. um Bestimmung des Aufenthalts und der Uniform bitten und rechnet mit Aufnahme in die Garde. Klage, daß der Brief unverschlossen beim Postdirektor Mann lag. Lombardinis Schreiben wurde durch den Geheimen Staatsrat von Beugelin dem Kanzler übergeben, der Drohbrief der beiden Hahn dagegen zurückgehalten. Ausführliche Nachrichten über die Rüstungen der Verbündeten mit Truppenzahlen bis 1307000 Mann, die Ächtung Bonapartes, Württembergs abgefangenen Kurier; Pourtales bleibt aus, die Rohr-Sachen stocken.'
oe1bu9454-288: Dringende Bitte, Prinz Adolph spätestens zum 22. eintreffen zu lassen, da der Fürst Staatskanzler ihn dem König empfehlen will und sich sonst die Gelegenheit verliert, nochmals gegen Cosmars Betrügereien zu sprechen; verlangt werden Hinterlegung aller Gelder beim Brüger Oberappellationsgericht, Rechnungslegung und ein Oberaufseher, doch Stägemann berichtet nicht. In der Trąbczyner Sache ist Minister von Stein angegangen; erbeten wird ein französischer Brief des Fürsten. Ottos Tableau sei unbrauchbar; maßgeblich die Schätzung von Blomberg und zur Höllen über 316000 Rthl als Entschädigungsforderung. Dazu Kriegsgerüchte.
oe1bu9454-289: Bitte an Kabinettsrat Albrecht um eine klare Entscheidung des Königs zur Forderung der Churischen Erben gegen den Fürsten von Hohenlohe über 300000 Rthl, mit Zinsen inzwischen 426000 Rthl, für die der verstorbene König als Selbstschuldner mitgezeichnet hatte. Ein Vergleich über etwa 112000 Rthl scheiterte, nachdem den Erben in Berlin Aussicht auf volle Zahlung gemacht wurde. Triebenfeld verlangt entweder Zahlung durch den Fiskus samt Auflösung der Cosmarschen Verwaltung der Fideikommissgüter oder Verzicht und Vorschuss zum Vergleich; beigefügt ein Tilgungsplan. Verweis auf einen Bericht des Oberlandesgerichts Brieg.
oe1bu9454-290: 'Bericht über den Stand der Geldsachen: Nach sieben Monaten ist endlich angeordnet, dass Cosmar die drei Jahre zurückgehaltenen Gelder eiligst an das Oberlandesgericht Brieg zahlt, aus denen jährlich 12000 Rthl an die Gläubiger angewiesen sind. Stägemann arbeite dagegen und decke Cosmar und die Curischen Erbinnen, der Fürst Staatskanzler verspreche nur, Minister Stein betreibe dagegen ehrlich die Entschädigung durch das Amt Sokolnick. Angekündigt sind eine Denkschrift zum Militärgehalt und eine Konferenz mit Stägemann. Klage über Adolphs ungeschicktes Auftreten vor dem König; dringende Bitte um 100 Ducaten per Estafette.'
oe1bu9454-291: 'Bericht über den Stand mehrerer Verhandlungen: eine Kabinettsordre vom 27. April, mit der der König die sofortige Zahlung der 100000 Rthl an Prinz August befiehlt und die an Kircheisen ging; die durch Minister Humboldt vermittelte Entschädigung für die polnischen Güter, über die nun der Kaiser entscheiden muß, wobei Stein, Worowzow und Nesselrode um 300000 Rthl bemüht sind; die Anweisung an Cosmar, die Gelder sofort zu deponieren, sonst Arrest; dazu Nachrichten über Abreise des Königs nach Heilbronn, Koppes hannoversche Anstellung und die Bitte um Geld für die eigene Rückreise.'
oe1bu9454-292: 'Bericht über den Stand mehrerer Verfahren: die Entschädigungssache liege beim Kaiser, Minister von Stein habe Unterstützung zugesagt, von Hardenberg solle eine schriftliche Zusicherung geben. Ausführlich über eine Konferenz mit Stägemann, der Cosmar verteidige und den alten Fürsten für belanglos erklärt habe, während Triebenfeld die Hinterlegung der im Instrument von 1799 und im Vergleich von 1811 festgesetzten Summen beim Oberlandesgericht Brieg fordert. Prinz August seien laut Cabinetsordre 100000 Rthl sofort zu zahlen; Cosmars Einwand einer Schuld von 300000 Rthl an den Landgrafen von Hessen sei widerlegt. Vorschlag, Hardenberg in Neisse persönlich anzusprechen.'
oe1bu9454-294: 'Bericht über Verhandlungen mit der Herzogin von Sagan wegen ihrer Forderung von 30000 Rthl bzw. 100000 Ducaten in Gold: Solange die Herzogin darauf vertraut, der König werde diese Summe allein zahlen, sei nichts auszurichten. Werde ihr von höherer Stelle klar gesagt, dass der König nichts zahlt, sei ein Vergleich auf das ihr gemachte Angebot von 150000 Rthl vorbehaltlich höherer Bestätigung zu erwarten. Die Herzogin bleibt vorerst in Wien und geht zur Kur nach Baden; sie wünscht weitere Besuche des Schreibers Bisenti.'
oe1bu9454-295: 'Bericht über eine gescheiterte Reise: In Kalisch war der russische Kaiser bereits in der Nacht zuvor durchgereist und in seine Staaten zurückgekehrt, womit der Hauptzweck der Reise hinfällig wurde. Der Oberpostdirektor Espagne teilte mit, der Fürst Staatskanzler sei noch in Paris, reise über Cassel und Frankfurt am Main und komme erst in drei Wochen nach Berlin; Barbe liege im Nervenfieber, Minister Stein sei kaltgestellt. Triebenfeld prüft die Betsche-Sache, deren Vertragsaufhebung die Untertanen erbeten haben, will in Blizanow Geld von den Pächtern eintreiben und dann nach Berlin. Zweifel am angeblichen Bericht Zerbonis, dessen Antwort beiliegt, da die Originalakten an Schenck gingen.'
oe1bu9454-296: 'Kurze Nachrichten aus Berlin mit Übersendung zweier Originalbeilagen: Der Hofrat Bar...bey ist in Paris gestorben, bei dessen Witwe soll weiter nachgefragt werden; der Staatskanzler ist inzwischen tatsächlich eingetroffen. Cosmar wurde in erster Instanz eines unredlichen Verfahrens für schuldig befunden, hat aber Appellation eingelegt und würde, bliebe es dabei, die Vormundschaft verlieren. Dazu Mitteilungen über die schwere Erkrankung Philippischens in Stachen und Teilnahme an der Krankheit des Empfängers.'
oe1bu9454-297: 'Krankheitsbericht und Bitte um eigenhändige Antwort: Triebenfeld meldet den Tod seiner Tochter vier Tage nach der Geburt, das Ableben Barbes und den Erstickungstod Trzcińskis in Warschau sowie eigene Gicht- und Kolikleiden, die ihn über Betsche und Posen nach Blizanow brachten; die Reise kostete 247 Rthl, Arzt und Arznei 70 Rthl, Aktenauszüge 22 Ducaten. Er berichtet über Zerbonis verzögerten Bericht, die Betsche-Sache, Echausts Waldverwüstung von 170000 Rthl und widersetzt sich einer Generalvollmacht für Assessor Schenck.'
oe1bu9454-298: 'Krankheitsbedingt weiter bettlägerig, kann Triebenfeld nicht reisen und wiederholt seinen Bericht vom 19.; über Schenck eingetroffene Post samt Abschrift Zerbonis kostete ihn etwa 7 Rthl Gebühren. Wegen der im Wiener Vertrag zugesagten Entschädigung fürchtet er nichts, zumal ein Vertrauter Humboldts an Barbes Stelle trete. Er bittet, das Postamt Strehlitz anzuweisen, alle Briefe per Estafette nach Blizanow zu senden, sowie um Wildbret über den Generalpächter Faust in Gostyszyn. In Kalisz wurde preußisches Geld herabgesetzt: der Thaler gilt nur 20 gg, 2-gg-Stücke gar nicht.'
oe1bu9454-299: Bericht über die Genesung von einer Krankheit und über die eigenen Güter in Kohlen, aus denen 62000 Rthl bleiben. Angekündigt wird die Reise über Betsche nach Posen und Berlin, ein Vergleich mit Leixner in Miedzeritz und die Löschung der Schuld im Hypothekenbuch. Die zahlungsunfähigen Bürger und Bauern von Betsche verlangen die Aufhebung des Vertrags; Triebenfeld will zustimmen, fordert aber Verfall des Angelds, 2000 Rthl zur Beendigung der Sequestration, 11000 Rthl rückständigen Kanon und rechnet mit insgesamt 127000 Rthl. Ferner Trzciński, Humboldt, Zerboni und die von Schenck begehrte Generalvollmacht.
oe1bu9454-300: 'Nachricht, dass in Gosztiszyn eine Taxe eingegangen sei, die Triebenfeld abholen lassen will; dazu ausführlich der Streit um ein Gutachten zur Einrichtung des Großherzogtums Posen: Zerboni habe es mit seinem Sekretär Schmidt verfasst und Fürst Radziwill zur Mitunterschrift vorgelegt, der sie verweigerte; Zerboni sei daraufhin nach Stettin geschickt worden. Weiter Gerüchte aus Petersburg über die Verwerfung der polnischen Konstitution. Angekündigt sind Reisen nach Betsche und zur Indemnisationssache. Stark beschädigt, mit Textverlusten.'
oe1bu9454-301: Empfangsbestätigung des fürstlichen Schreibens vom 26., überbracht durch den Hausverwalter Lombardini, dessen Ankunft die Sorge um den lange ausgebliebenen Boten beendet; dazu Glückwünsche zum Geburtstag. Neue Nachrichten aus den Geschäften gibt es nicht, Triebenfeld verweist auf seine früheren Briefe und bittet um Entschließungen; Lombardini werde alles belegt berichten. Er erwartet seinen Sohn und einen Pächter für Schweinern, will dann nach Posen und Betsche reisen und hofft in der Entschädigungssache auf gutes Ende, da er von Smiedecki in Kalisch gewonnen habe. Bitte um Wildbret.
oe1bu9454-302: 'Bericht über dreizehn gerichtliche Vollmachten, die Triebenfeld gemeinsam mit dem Justizbürgermeister Hawich aus Zagorowo (nun Warschauer Notar) und Oberinspektor Hecker ausgestellt hat: Instruktion wegen der Trąbczyner Güter, Aufhebung der Sequestration, Einziehung und Auszahlung der Zinsen, Klage gegen Oppenheimer et Wolf in Kalisz wegen über 72000 Rthl, Entfernung und Rechnungslegung des Sequestrators Honrichs samt Rückgängigmachung seiner Grundverkäufe, Forderungen gegen Niedzwiedzki und dessen Erben (über 10000 Rthl), Kaufgeldrückstände, 32000 Rthl von den Erbpächtern in Olesnica, Grenzprozesse sowie Vertretung auf dem Reichstag in Warschau.'
oe1bu9454-303: 'Ein Auszug aus den fürstlich hohenloheschen Liquidationsregistern verzeichnet 142 angemeldete Forderungen mit Namen und Beträgen, darunter Charlotte von Triebenfeld mit 112000 Rthl, Carl von Stössel mit 191000 Rthl und der Vormundschaft des Sigismund von Stössel mit 169400 Rthl, Goldstücker mit 170000 Rthl, Hein in Breslau mit 165000 Rthl, der Kaufmann Barnheim in Berlin mit 76791 Rthl, die Erben von Köckritz mit 50000 Rthl sowie viele kleine Posten von Handwerkern, Förstern und Dienstleuten. Summe: 17874 Rthl Gold und 1414377 Rthl 7 g 11 d Courant.'

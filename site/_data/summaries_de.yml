'001': Nachricht eines vertrauten Freundes, Österreich, Rußland und Preußen hätten sich über Sachsen und Polen geeinigt, der Congreß gehe dem Ende zu; seit dem 13. Januar fehlt jede Nachricht, daher große Angst. Dringende Bitte, Fürst Hardenberg zum Vorschuß von 112000 Rthl und zur Übernahme der Fideicommißgüter in Administration zu bewegen; dann ende Cosmars Execution, der Mandatar gebe gegen 12000 Rthl bar den Schuldschein heraus. Ferner soll die Trąbcziner und Kaemener Sache betrieben, die von der Moszynska gezogenen Revenüen ersetzt werden. Der günstige Bericht des Brieger Oberlandesgerichts liegt vor.
001a: 'Übersendung eines soeben eingetroffenen Schreibens des schwer bedrängten Fürsten von Hohenlohe, dessen Not als unbeschreiblich geschildert wird, mit der dringenden Bitte um einen Vorschuß von 112000 Rthl: damit seien die kurländischen Erben, durch deren Willen sich Cosmar allein in die Fideikommißgüter gedrängt habe, befriedigt, Cosmars Macht beendet, Seine Majestät aus dem nexus gelöst und der Vorschuß aus den Fonds bald zurückerstattet, jeder Gläubiger nach und nach befriedigt. Erbittet Weisung, ob die Dokumente zu den Trąbcziner Gütern im Koniner Kreis vorgelegt werden dürfen.'
'002': 'Empört über den Vorwurf, seit dem 13. v. M. nichts geschrieben zu haben, zählt Triebenfeld sieben abgesandte Briefe auf: Schreiben an Gm. Schöler wegen Trąbczin, Dank an Geheimen Staatsrath Stägemann, Vorlage der Correspondenz Kircheisens, Verlust von Kalisch und der Güterkreise an Rußland, Aufteilung Sachsens, Wellingtons Ankunft. Dringend erbittet er 200 Ducaten, da er dem Fürsten Staatskanzler 100 Rthl und Barben 70 Rthl schuldet. Graf Pourt: will kaufen, verfügt aber nur über 150 Rthl bar. Prinz August solle die Vollmacht für Cosmar überall widerrufen lassen.'
'003': 'Dringende Geldnot: nur zwei Briefe (19. und 28. Januar) erhalten, während sieben abgesandt wurden; von den kalkulierten 1400 Rthl für vier Wochen seien in fünf Monaten nur 932 Rthl eingegangen, 170 th sei man dem Prinzen und Barbe schuldig, es fehlten schon 12 fl. für die Mietkutsche; Bitte um schleunige Übersendung von 200 ff. Geplante Vorsprache bei Minister Nesselrode und Geheimrath Schröder in der Pohl-Sache; Rath, für die Verwaltung der Fideicommißgüter auf Königliche Rechnung mittels eigenem Pro Memoria einen cautionsfähigen, treuen und ökonomisch wie im Eisenhüttenwesen erfahrenen Mann vorzuschlagen, keinen der alten Leute (König, Cosmar).'
'004': 'Berichtet aus Wien von Napoleons Vormarsch: Grenoble und Lyon in seiner Hand, angeblich 30000 Mann und die Artillerie von Grenoble, Soult und Bertherand als Anhänger; auf Napoleons Kopf seien 10 Millionen Francs ausgesetzt, Massena verspreche 3 Millionen aus eigenem Vermögen. Erbittet für Hofrath Barbe einen guten Korbwagen mit Plane sowie ein Fuhrwerk mit 2 Pferden für Glaskisten der Hofräthe Kraibe, Heym und Philippsborn von Prag nach Schlawenschitz, ferner Pässe für Trommler und Kutscher nach Blizanow. Drängt auf Eberhards Reise, fragt nach J. Augeits Vollmacht und erbittet Blanquette.'
'005': Bericht über Zerbonis Forderung, Trzcinski solle ihm aufgrund einer Cession 5000 Rthl aus der dem Fürsten zustehenden Forderung von 10000 Rthl zahlen; Triebenfeld hat dies vorläufig bestritten und will Trzcinski zur gerichtlichen Erklärung zwingen, bittet aber um schnellste Auskunft, ob die Cession echt sei, und befürchtet, der Fürst habe Zerboni ein Blankett gegeben. Von den angeblich auf Anweisung Zerbonis an König für die Bischdorffer Sache gezahlten 1000 Rthl hält er nichts. Der Präfect v Smiedecki in Kalisch werde in der Indemnisationssache wegen Sokolnik günstig berichten; Antwort in der Betscher-Sache erwartet.
'006': 'Bericht über die Verhandlungen: in der Würtembergschen Sache sei derzeit nichts zu tun, betrieben würden nur die Indemnisation und die Curische Affaire; gefordert seien die Starosteien Sokolnik und Wieruszew, Minister Stein wirke mit Nesselrode, von Hardenberg und Stägemann sei nichts zu erwarten. Ausführlich über Cosmars Sturz, die Bacchanalien zu Syten und die Denunciation der Curischen Erben; Plan mit Cabinetsrath Allbrecht, Erklärung des Königs binnen zwei Tagen. Von Pourtales keine Antwort; Klage über August. Dringende Bitte um 100 Ducaten per Courier.'
'007': Charlotte von Triebenfeld wendet sich zum dritten Mal an den Fürsten, ohne bisher eine Antwort erhalten zu haben, da ein Brief ihres Vaters sie an den Fürsten verwies. Ihre Not habe alle Grenzen überschritten; die Hoffnung, dem Vater ihre Lage mündlich vorzutragen, müsse sie aufgeben. Um Beistand wage sie nicht mehr zu bitten, erneuert aber demütig die Bitte, ihr durch einen Untergebenen die Adresse ihres Vaters mitteilen zu lassen, um nicht länger mit Klagen beschwerlich zu fallen.
008: 'Nach dem Empfang dreier Briefe (vom 8., 25. und 27. November) beschwört Triebenfeld den Fürsten in höchster Erregung, seinen in Not gelassenen Kindern beizustehen: 120 Rthl an die Lüdersche und, bei längerem Verbleib, monatlich weitere 60 Rthl; er selbst lebe hier nur von geliehenem Geld. Die Sache stehe gut; erbittet vom Curz Mandatarius eine kleine schriftliche Zusicherung, daß mit 112000 dH abgeschlossen werde, und warnt vor mächtigen Gegnern, da v. Kirchen als Vormund selbst Partei sei. Hahn will er selbst schreiben; Papiere braucht er nicht.'
'010': Beklagt, daß seine zweimal wöchentlich, meist über Teichelmann gesandten Briefe nicht angekommen seien; beim Post-Director Mann werde ein Laufzettel veranlaßt. Der Fürst Staatskanzler habe die besten Zusicherungen gegeben und wolle die fürstlichen Sachen vor seiner Abreise ordnen; Steegemann habe noch nicht berichtet. Die fehlinische Sache sei mit beiliegendem Pro Memoria der Commission übergeben, Entschädigung wohl in Gütern, da das Geld für den Krieg gebraucht werde. Ausführliche Nachrichten über die Truppenaufstellungen gegen Frankreich, Murat, Massena; zur Wüstemberger Sache und zum Widerruf der Vollmacht des Prinzen August; Beilage für H. C. Eberhard.
'011': Dringende Bitte, Herrn Eberhard schleunigst nach Wien zu senden, samt Schreiben an den Fürsten Staatskanzler Hardenberg und einem Blanquet für den König, da die Sache des Fürsten diese Woche zur Entscheidung komme, aber ohne Vergleich mit der Erbin vergeblich sei; auch bei 50-100.000 Rthl mehr bliebe nur fünf Jahre längere Verwaltung, bei 6000-12.000 Rthl jährlicher Rente. Prinz August verweigere Cosmar die Vollmacht; Vorschlag, Prinz Adolph einzusetzen. Nachrichten vom Congress, Pressburg, Talleyrand, Sachsen, Murat, russischer Willkür in Polen; Bitte um 100 Rthl zur Zahlung an Starben.
'012': Dringende, in scharfem Ton vorgetragene Bitte um Übersendung der 200 Ducaten (200 Rthl), ohne die in Wien nichts zu erreichen sei; Klage über die Schwierigkeit, an die maßgebenden Personen heranzukommen. Prinz August solle die Vollmacht rasch von Cosmar zurückfordern; vor dem von diesem gegebenen schriftlichen Versprechen wird gewarnt, das in Öhringen zurückgelassen worden sei und noch nötig werden könne. Der König von Würtemberg habe die mediatisierten Fürsten als Stände anerkannt und einen eigenen Verfassungsentwurf eingesandt, gegen den die Stände protestiert hätten.
'013': 'Kritik an der Darstellung der Sache in den Akten: Wichtiges sei übergangen, die Adolph-Angelegenheit unnötig breit behandelt; Hahn wolle Adolph dem "Bösewicht" entwinden, zum Fideikommiß erklären lassen und Koschentin (angeblich 55000 Rthl Ertrag) erwerben, verglichen mit Schlawentzitz und Oppurg (kaum 40000 Rthl); von Pourtales noch keine Antwort. Klage über den Kursverfall der Papiere (Ducaten über 15), Verlust von rund 300 Rthl, Schulden bei Barbe, Kosten für Kleidung; dringende Bitte um 200 Rthl und blanko unterzeichnete französische Formulare. Bericht über Krankheit, Hunger, einen Übersetzer für 15 Ducaten und die Aussicht auf jährlich 6000-7000 Rthl gegen den seit 1800 erlittenen Verlust von 114000 Rthl.'
'014': Klage über das Ausbleiben einer Entscheidung auf die Beschwerde des Fürsten zu Hohenlohe; Berliner Privatnachrichten melden eine Untersuchung beim Kurmärkischen Vormundschaftsgericht gegen Cremne, was die Lage nur verschlimmere, da Cosmar die seit 1812 rückständige Pacht für die Gläubiger zurückhalte. Die Vermittlung in der herzoglich Karlischen Schuld scheiterte an den Generalmandatarien; Justizrath Bennebirg führe die Sache. Bitte, bei Sr. Majestät die vollständige Übernahme der Schuld sowie Erlaß der 35000 Rthl zu erwirken; Erinnerung an Beteiligung bei künftigem Vergleich, Gespräch nach Rückkehr aus Wien erhofft.
'015': Auskunft über die von Prinz August verlangten 100000 Rthl, ein Legat der verstorbenen Fürstin, zur Deckung der Schulden; der Fürst Staatskanzler schreibt nach Öhringen, Justizminister Kircheisen ist zur beschleunigten Ausführung angewiesen, eine Sache liegt noch bei Geheimen Staatsrath Stägemann. Der Vorschuß von 112000 Rthl gilt als gesichert, Cosmars Entfernung als beschlossen. Die polnischen Akten (Kalisch, Posen, Traperin) erfordern beeidigte Übersetzung für 260 fl., die Triebenfeld nicht bezahlen kann. Er ist mittellos, schwer krank, Barbe schuldet er 70, und bittet dringend um Rettung und Unterstützung seiner Tochter.
'016': Widersprüchliche Gerüchte über die Abreise der Monarchen; Triebenfeld sprach beim Oberstlieutenant v. Thiel vor, um zu erfahren, ob der König von Preußen am 20. noch anwesend sei, und meldete Prinz Adolphs Wunsch, vorgestellt und bei der Armee angestellt zu werden, Thiel sichert Wohlwollen zu und nennt den 22. als Abreisetag; mit Hardenberg noch nicht gesprochen. Beigefügt eine Note zum Kongreßergebnis; Harum umstritten. Nachrichten über Murat bei Mantua, Rußlands Märsche und Bonapartes Rüstungen in Paris. Die Sache der Kostener Güter bleibt ungewiß, ein Äquivalent fehlt.
'017': Empört berichtet Triebenfeld, General Kleist habe in Kalisch beim Präfekten Graf Garczynski über die Hohenlohe'schen Güter geforscht und, den Söhnen des Fürsten folgend, behauptet, Triebenfeld stecke alle Revenüen ein; er lasse dies durch den komornik v. Chomanowski untersuchen, wobei Cabanis Rechnung lege. Er verweist auf verarmte Zinsleute, Rückstände von etwa 30000 Rthl, die Capitalien des Invaliden-Fonds, Weigels und die Bayonner Summe sowie auf Sommers Gerüchte über 1700000 Rthl Schulden. Erbittet schleunige Antwort wegen Sobottendorff, Weigel und der 50000 Rthl des Invaliden-Fonds nebst Decret und Original-Quittung.
018: Aus schwerer Fieberkrankheit berichtet Triebenfeld, das übersandte Instrument samt Vollmacht sei unnötig, da er eine Generalvollmacht besitze; einzubringen sei derzeit nichts, weil alles unter Arrest liege. Nach dem Dekret der französischen Generaldirektion gegen Intendant Maluce und den Invalidenfonds stehe ihm die Rückforderung der am 14. Februar 1808 erzwungenen 3125 Rthl zu, mit Kosten und Zinsen 4219 Rthl. Der Fürst solle diese Summe auf die Zinsrückstände der Untertanen in Wrąbczyn, Alt Olesnica, Kopoyno, Skokum, Swiątniki, Adelow, Sophienthal und Neu Swięce anweisen und exekutierbar erklären; die Urkunde müsse bis zum 15./16. durch den Boten eintreffen.
019: 'Dringende Empfehlung, die Verhandlung mit Herrn von Sobottendorff rasch abzuschließen: Grundstücke, Gebäude und Wiesen sollen auf 18 Jahre für 36000 Rthl verpachtet werden, wodurch der Gläubiger mit 40000 Rthl Forderung befriedigt werde, ohne Substanz und laufende Einkünfte zu schmälern; Vergleiche mit Tschachmann bzw. Cybalski und Heinrich, dem wegen 1300 Rthl Abzugsgeld eine Hypothek auf Blizanow eingeräumt wird. Bitte um unverzügliche Übersendung der vorgeschriebenen Vollmacht, da alles unter Arrest liege. Klage über Kosten, Boten, Richter, 300 Rthl für den Warschauer Prozeß; der Wytwiver-Prozeß verspreche 4000 Rthl Zinsen.'
'020': Klage über eine neue Cabinets-Ordre, die Zahlung in Courant erzwingt, obwohl die Valuta in Papier gegeben war, Verlust von 1500 Rthl in der Sache van der Lahr. Da ein Sequestrator auf Triebenfelds Gütern Kontopp sitzt und ihm wegen der restlichen 3000 Rthl erneute Arrestierung droht, hat er im Namen des Fürsten dem van der Lahr durch Geheimrath Amelang 1000 Rthl bar und 350 Zentner Eisen à 6 Rthl angeboten; erbittet 950-1000 Zentner Stab- und Bandeisen bis 20. April nach Kontopp, davon 600 Zentner für Michaelis. Zagorower Vollmachtskosten (Hawich, Hecker, Justizbürgermeister Schnee) 163 Rthl. Grüße des General v. Zastrow mit Bemerkungen zu Jena; beigefügt Copie des Schreibens an van der Lahr.
'021': Nach dem mittags abgesandten Expressboten geht ein weiterer Bote über Lombardini; Nachricht von allgemeiner Furcht vor dem raschen Anmarsch der Russen. Zuversicht, der Fürst werde die Güter Trąbcziner, Kaemener und Brzyrer zurückerhalten; Pläne um Constantin, das Fürstenthum Łowicz und Talleyrand, dazu Erwägungen zu Dorothea. Kontop und Schweineren sind für jährlich 14000 Rthl verpachtet, Waldnutzungen und juridische Gebühren 6000 Rthl, doch zehren alte Rückstände alles auf. Bitte um Geld zum Bestechen und Wirken (Richter habe seine Uhr verpfändet) sowie um 200 Rthl in Münze für die Töchter in Breslau.
'022': 'Trotz schweren Gichtanfalls Bericht über vier für den Fürsten geführte Prozesse, für die Triebenfeld als Bürge allein haftet: Invaliden-Fonds, der Streit mit dem Juden Oppenheimer (geführt durch Empich) und der Prozeß der Obristin Schliefen in Breslau; dem Executor Alexius zahlte er 132 Rthl, das Kammergericht fordert 85 und 42 Rthl, zusammen 259 Rthl Courant, der Schliefen-Prozeß kostet gegen 500 Rthl. Gegen Meierowitz klagt er wegen 6000 Rthl Kaufgeld für Wittow und 2500 Rthl rückständiger Erbpacht (500 Rthl jährlich). Klage über Hawich und Radenski, über den unterbliebenen Wechsel Lombardinis und die Not seiner Kinder; Bitte um 500 Rthl.'
'023': 'Eindringliche Notklage: die erbetenen einigen hundert Rthl in Münze für seine Töchter blieben aus, Lombardini zahlte die 150 Rthl nicht. Detaillierte Abrechnung der für den Fürsten aufgewandten Summen (4300 Rthl, 5140 Rthl von v. d. Lahr, 9000 Rthl von Cote, Kosten 3400, zusammen 17500 Rthl); offen bleiben 1600 Rthl an v. d. Lahr sowie 3500 Rthl an Blochsräff und Holzapfel, dazu 185 Rthl Gebühren, weshalb der Glogauer Executor Allexius pfänden wollte. Criminalrath Stenger soll Karge, Zagorowo, Trąbczin, Betsche und Wittow ordnen, Trąbczin vindicieren, gegen Honrichs vorgehen und Seifert als Actuarius (250-300 Rthl) erhalten; Aufzählung sieben laufender Processe. Eigene Güter sequestriert, er selbst gichtkrank.'
'024': Fürst Hohenlohe bittet den Geheimen Rath, mit seinen weitreichenden Verbindungen ein Darlehen von 100000 Rthl in einer Summe zu vermitteln, gesichert durch erste und alleinige Hypothek auf die südpreußischen Herrschaften Zagorowo und Trombschen; Vollmacht und Unterlagen folgen, den mitwirkenden Geschäftsleuten sind 5 pt. zugesagt. Beigefügt v. Triebenfelds Verzeichnis der 34 Ortschaften sowie die von der Kalischer Kriegs- und Domänenkammer geprüfte Reinertragsberechnung von 40247 Rthl 14 g 11 d aus Zinsen, Erbpachtcanon und Ziegeleien, dazu eine Schuldenliste (Schlabrendorff, Lichnowski, Oppenheimer und Wolff, Invalidenfonds u. a.) über 366000 Rthl.
'025': 'Nach dem Aufstand der Bauern in Zagorowo, der die Separation der Ländereien verhinderte, reiste Triebenfeld eilig dorthin; die Sache ist beigelegt, doch versäumte er in Berlin den König und dessen Gefolge samt seinem Gönner. Durch Justizrath Bucholz sind nun 80000 Rthl aus Mitteln eines von Bredow (Seehandlung) gesichert: Hypotheken auf Kontop 30000, Schwammern 20000, Trąbczin 30000; daraus an Gräfin Schlabrendorff 25000, Weigel 25000, Hahn für Koschentin 5000, an den Fürsten 5000 bar, an Triebenfeld 30000 zur Zahlung der Wulffs, wogegen er eine Hypothek über 30000 Rthl erbittet. Geheimrath v Tismar verhandelt mit Nathusius in Magdeburg über 360000 Rthl auf die südpreußischen Güter zur Ablösung der Oppenheimer-Hypothek; der Güterverkauf stockt kriegsbedingt, doch meldet Honrichs neue Käufer.'
'026': Erleichterung über die durch Secretair Koppes Brief bestätigte Rettung des Fürsten nach der Niederlage der Armee; nach falschen Nachrichten von Rittmeister v. Dorville und Postpräsident v. Secqebarth über einen Aufenthalt in Schlesien vergebliche Reise Richtung Sagan. Von Minister v. Stein wurden auf eine Kontopper Hypothek 8000 Rthl erlangt; eine Anweisung über 6000 Rthl geht durch Estafette an Koppe, 2000 Rthl in Tresorscheinen und weitere 4000 Rthl sollen folgen. Aus Südpreußen ist kein Geld zu erhalten; geplant ist eine Anleihe von 20000 Rthl auf eine Schweiner Hypothek sowie Hoffnung auf die Kolzigschen Güter und 100000 Rthl.
'027': Bericht über die gewaltsame Besitznahme von Trąbczin und Kaemen durch die Familie Prusimski, gegen die vorläufig nichts zu erreichen ist; zur Sicherung der eingetragenen Summe wurden lediglich Protestationen eingelegt. Die Frau Generalin v. Sanitz hat sich wegen der ihrem Mann entzogenen Güter unmittelbar an Kaiser Napoleon gewandt, dessen Antwort auch für die fürstliche Sache maßgeblich sein werde. Der Schreiber reist nach Memel, evtl. weiter zu Kaiser Alexander, und hofft über den Großfürsten Constantin zu wirken; König und Königin verehrten den Fürsten, könnten aber nicht helfen.
028: 'Meldung, daß die Güter Trąbczyn am 3. d. M. durch den Commissarius des Kalischer Appellationsgerichts, Appellationsrichter v Lipski, übernommen und dem General-Mandatarius der Frau v Dąbska geb. v Prusimska, Canonicus v Jezierski, übergeben wurden; Protest und Remonstration unter Berufung auf den Tilsiter Frieden, Copie der Verfügung der Regierungscommission verweigert, alle Rechte wegen der bezahlten Schulden vorbehalten. Ferner zwei neue Prozesse: Propst Iwanski wegen des Zehnten von Swięciacie, sowie Martin v. Otocki als Cessionarius Constantin Orczykowskis und Müller Ekstaedt zu Wrąbczyn auf circa 7000 Rthl aus dem Pachtcontract von 1798; Bitte um Aufsuchung des Breslauer Vergleichs und um Vollmacht.'
029: Erinnerung an die bei der Begegnung mit Hofrath Hahn in Lohsen bei Brieg gegebene Zusage eines Rendez-vous nach der Rückkehr aus Memel; da dieses ausblieb, bittet der Schreiber um Nachricht, ob und wann er in Breslau aufwarten dürfe, wonach ihn Seine Durchlaucht befragt habe. Zugleich die Sorge, wegen erwarteter französischer Einquartierung in Schlawenschitz nicht abkommen zu können, gar die Stallungen räumen und eine andere Wohnung suchen zu müssen.
'030': 'Bericht über seine Verhaftung in Berlin: zwei französische Gendarmen hielten ihn als Generalbevollmächtigten des Fürsten in Arrest, bis die auf 5000 Rthl angewachsenen Zinsrückstände der beim Invalidenfonds aufgenommenen 50000 Rthl bezahlt seien; vergeblich verwies er auf den Banquier Apenheimer als eigentlichen Schuldner. Mit 2000 Rthl eigenen Mitteln und einer Bürgschaft des Ministers v. Zastrow über 5000 Rthl (in Courant 2875 Rthl, rückzahlbar 5000 Rthl am 1. Juni) kam er frei. Er erbittet die an Eysenhardt cedirte Anweisung über 6000 Rthl zurück, um seine Hypothek von 10000 zu lösen; v. Zastrow wirke für die Rückgabe der Trabezyner Güter, die Reise nach Petersburg sei unterblieben.'
'031': Bericht über Arrest wegen rückständiger Zinsen, Krankheit (Unterleibsentzündung) und Mittellosigkeit; erneute dringende Bitte um Rücksendung der Instruction über 6000 Rthl, um die verpfändete Hypothek von 10000 Rthl zurückzuerlangen, samt Nachweis und Hypothekenschein. Vorschläge zum Darlehen (150000-250000 Rthl) und zur Schuldenzahlung mit Tresorscheinen zu 48 Prozent, auch an Ephraim. Klage über Heinrichs' General-Vollmacht und Hawich aus Peisern; Mitschke in Kalisch als Justitiarius; Gehaltsplan von 1800 Rthl statt 3700. Zu Prozessen Otocki, Radzinski, Iwanski, Przespolewski.
'032': 'Antwort auf die fürstliche Anfrage vom 23. v. M. mit einer neuen Ertragsaufstellung der Herrschaft Zagorowo (ohne die Trąbcziner Einkünfte): Propinationsrecht 5000 Rthl, Zinsen der Erbpachtcontracte für Olesnica, Wrąbczin, Emilienhain, Augustinow, Allexandrow, Adolphsberg, Klein Ingelfingen, Grądzin, Swięcia, Alt Drewie, Swiętnik, Sophienthal, Klein Schrazberg, Kopojer u. a., Gerichtsgebühren und Laudemien, zusammen 27700 Rthl; Lasten tragen die Erbpächter. Schulden von 148800 Rthl (Lichnowsky, Meyer Bernhard, Glenck, Invalidenfonds, Bernhardi, Fürther Obligation) mit 7440 Rthl Zinsen; Klage gegen den Juden Oppenheimer wegen der Hypothek von 250000 Rthl; Aussicht auf 200000 Rthl Capital aus Holland.'
'033': 'Aus Krankheit und Schwäche berichtet Triebenfeld über die Geldbeschaffung: die Bank-Anweisung sei sogleich von Eysenhardt zurückzufordern, sonst drohe ihm der Ruin; gegen ein Capital wolle er die Hypothek von 250 Rthl cedieren, um Oppenheimer, Eysenhardt, den Invaliden-Fonds und Madame Schlabrendorff abzufinden. Er warnt eindringlich vor Generalvollmachten und Blanquetten, da Honrichs den Preis der Hufen von 600 auf 300 Rthl herabgesetzt habe, verweist auf das Tableau, meldet die von den französischen Behörden erlangte militärische Beitreibung der Rückstände in Südpreußen und klagt über Minister von Stein und eigene Armut.'
'034': 'Zurückweisung der Vorstellungen Honrichs'' als unsinnig: Trotz 21 Schreiben durch Reit- und Fußboten habe dieser weder Geld noch Rechnung geschickt; Kosten hätten über Professor Rhoda bestritten werden müssen. Nach Schmids Tod sei Hester mit 600 Rthl jährlich und Naturalien wie Tietz bestellt worden, keineswegs für 10000; die französische Behörde wolle bei der Beitreibung der Rückstände helfen, wofür gerichtlich attestierte Nachweisungen nötig seien. Dringende Sorge um Rückzahlung der für den Invaliden-Fonds geliehenen Gelder, Rückgabe des Wechsels und der verpfändeten Hypothek an von Zastrow; Angebot, gegen Geld nach Gringen zu kommen und die Hypothek von 250 Rthl zu cedieren. Klagen über Krankheit und ausbleibende Antworten; Briefe an Amelang und Kopp noch unbeantwortet.'
'035': 'Heftige Klage über die durch Hofrath Meyer an Geheimrath Amelang ergangenen Anordnungen: Triebenfeld, als Bevollmächtigter wegen 5000 Rthl rückständiger Zinsen (nebst 125 Rthl Kosten) verhaftet und mit zwei Gendarmen bewacht, mußte mit Hilfe des Ministers von Zastrow bei dem Banquier von der Laar 5000 Rthl in Staatspapieren aufnehmen, rückzahlbar am 14. Mai; es fehlen noch 3125 Rthl. Er bittet um schleunige Abhilfe und um Rückgabe der für ungültig erklärten Bank-Instruction über 6000 Rthl, damit Hypothek und Wechsel frei werden und die Reise nach Wien erfolgen kann.'
'036': 'Rechtfertigung gegen den Verdacht unfreundlichen Verhaltens: Ausführliche Darstellung der Anweisung über 6000 Rthl von Stettinius, die im Januar 1807 zur Abfindung des Berliner Gläubigers Eysenhardt (1500 bzw. 2500 Rthl) unter Vermittlung des Geheimen Raths Meyer cedirt wurde, sowie der in Breslau veranlassten Zahlungssperre; Assessor Koppe ist angewiesen, Eysenhardt die 2500 Rthl zu zahlen und das Alligl. zurückzunehmen. Übersendung von 3000 Rthl Courant; Beilage für Amelang; Bemerkung zum Verhältnis zu Minister v. Stein; Bitte um persönlichen Besuch auf der Reise nach Wien über Dresden; Anfragen zur Sache Wildegans.'
'037': 'Antwort auf das fürstliche Schreiben vom 23. April: Triebenfeld hält die Einlagen gegenüber Herrn p. Koppen zurück, weil daraus Justus Eysenhardt Gelder aus der Assignation ziehen solle; da der beigegebene Wechsel längst verfallen ist, müsste er der Bank jeden Abruf sofort ersetzen. Der Fürst möge den Geheimen Rath Amelang zur unverzüglichen Rückgabe der ganzen Assignation anweisen, sonst werde sie öffentlich für ungültig erklärt. Erbeten werden 2000 Rthl für die Invalidenzinsen und 5000 Rthl Courant für Laar (Herr von Zastrow); Geld sei nur in Holland, nicht auf polnische Güter zu erhalten. Seine Genesung gehe im Schneckengang.'
038: Krank und erschöpft berichtet Triebenfeld über den Empfang der 3000 Rthl von Baugnier Veit und die tags zuvor an Amelang übergebene Anweisung; weitere 3000 Rthl seien aufzubringen, da die Kasse 5125 Rthl erhielt und neue Schulden von 5176 Rthl bestanden. Die von Stecher hinterlegten 4000 Rthl Märkische Landschaft-Obligationen brachten nichts; Minister v. Zastrow habe seine Papiere zurück. Statt Geld nahm der Gläubiger Holz und Bretter aus Contop, wobei 3480 Rthl Verlust entstanden, den der Fürst ersetzen möge. Dringend seien 150000 Rthl zu beschaffen, um Curland und alle Schulden zu tilgen; danach Reise nach Wien, eventuell Öhringen.
039: Nach der Rückkehr von einer erfolgreich abgeschlossenen Reise berichtet Triebenfeld von neuerlicher Execution wegen der fälligen 3000 Rthl; von 6125 Rthl Gesamtschuld seien 3000 Rthl angewiesen, es bleibe ein Rest von 3125 Rthl, für den er keine Deckung sehe, da aus Zagorowo nichts eingehe. Er bittet dringend um Anweisung von 3125, wenigstens 2000 Rthl, um unbehindert nach Königl. Morgen reisen zu können, will indes Bürgen für 14 Tage bis 3 Wochen suchen; Briefe seien an den Justizcommissarius Empuch in Berlin zu richten, die große Anleihe möge nicht vergessen werden.
'040': 'Sorge, daß Briefe abgefangen werden; Ankündigung einer Reise über Wirr, Königsberg, Öhringen, Paris und Holland, wobei Prinz August noch abgewartet wird. Ausführlicher Vorschlag zum Anleihegeschäft: gegen judizielle Cession der Zagorowoer Hypothek von 250000 Rthl seien 750000 Rthl Papiere zu kaufen und die Schulden abzulösen (Oppenheimer 28000, Invalidenfonds 50000/15000, Meyer Bernhard, zusammen 46000 Vorschuß); dazu 300000 Rthl Negotiationsobligationen für 90000 Rthl und Abzahlung der Lursch-Schuld an den König. Neue Taxen unmöglich; Klage über Geldmangel, 4000 Rthl in Münze für die von der Lahr aufgenommen; die französische Regierung habe Militärhilfe zur Eintreibung der Zagorower Rückstände zugesagt.'
'041': Bedauert, das fürstliche Schreiben vier Tage zu spät erhalten zu haben, da er sonst dem Grafen nach Erfurth hätte folgen können; ohne Geld sei dort nichts zu erreichen. Er sucht einige tausend Rthl zu leihen, um sich der Rückreise der beiden Kaiser und des Großfürsten anzuschließen und für den Fürsten zu wirken. Nach dem Sturz des Herrn v. Stein rät er dringend, nach Schlesien und zum König zu gehen. In Südpreußen habe die französische Regierung die Sequestration teilweise aufgehoben; über Warschau und Kalisch seien Gelder zu erwarten; Metzig solle 8 bis 9000 Rthl Laudemialgelder und Restkaufgeld eintreiben.
'042': Ausführliche Klage über die eigene Verhaftung durch französische Gendarmerie auf Befehl des General-Gouvernements, weil als Vollmachtträger des Fürsten 3521 Rthl Zinsrückstände an den Invalidenfonds zu zahlen waren; Freilassung auf vier Wochen gegen Bürgschaft des Kammergerichtsrats von Trevinitz und des Gastwirts Mathieu. Bericht über Geldbeschaffung bei von der Lahr, Zastrow, Coste und Hecker, Papierhandel und Agiotage; erbittet dringend 2068 Rthl nach Kontop. Ferner Sequestration in Zagorowo, Fiskalprozess gegen den Juden Oppenheimer (72000 statt 105000 Rthl), Gesamtschuld 122000 Rthl, Krankheitskosten 300 Rthl, Nachrichten aus Königsberg.
'043': 'Meldet ein von Geheimrath Amelang aus Berlin übersandtes Urtheil: Lahr sei entgegen dem Landrecht Barzahlung statt Papieren zugesprochen, die restlichen 3000 Rthl seien in harter Münze zu zahlen, andernfalls drohe wegen der Wechselklage Arrest (Hausvogtey). Bittet inständig um schnelle Anweisung zur Deposition in Bargeld oder Staatspapieren; Amelang und Grevenitz erwarten Sieg beim Appellationssenat und Ersparnis von etwa 1500 Rthl. Die Sequestration werde aufgehoben, sobald von circa 10000 Rthl die Zinsen gezahlt seien; dazu sei Justitiarius Honrichs herbeigerufen. Der Prozeß mit Oppenheimer stehe günstig. Erbittet die 600 Zentner Eisen für den Kaufmann Michaelis (2000 Rthl Vorschuß), Lieferung je 300 Zentner bis Ende April und Johannis; Briefe über Professor Rhode in Breslau.'
'044': 'Bericht über den Prozeß mit Lahr: nach dem von Amelang mitgeteilten Urteil stehen Lahr 3000 Rthl nebst Zinsen zu, die durch deponierte Obligationen gedeckt sind; zur Einlösung fehlen 1500 Rthl. Coste sind die zur Deckung der 5000 Rthl (Wechsel Zastrow, Triebenfeld, Grevenitz) deponierten 9000 Rthl samt 450 Rthl Zinsen zurückgezahlt, dem Buchhalter und Oldekopp 118 Rthl gegeben; erbeten werden 2068 Rthl, ferner 52 Rthl Prozeßkosten (Oppenheimer) und 411 Rthl für die französische Gendarmerie, zusammen 932 Rthl Courant. Der Kaufmann Michaelis biete, gegen 600 Centner Eisen zu 4 Rthl frei Oppeln, die Bereinigung der 2068 Rthl an; Ersatz aus den Zagorower Gütern sei angeordnet. Auch Mathein fordert 1000 Rthl Courant.'
'045': 'Bericht über die Flucht aus Berlin vor der drohenden Personalhaft: Vandertahr (Lahr) forderte laut Dekret sofort 3000 Rthl bar oder wechselrechtliche Vollstreckung; der Kaufmann Michaelis streckte 2400 Rthl vor, womit Mathieu befriedigt wurde. Amelang hat appelliert, wendet sich an den Großkanzler wegen der dem Landrecht widersprechenden Cabinets-Ordre und rät, 3000 Rthl in Staatspapieren bereitzuhalten. Erbeten werden 100 fr d''or und 100 Ducaten. Mit Michaelis ist die Lieferung von 600 Ctr Stab- und Bandeisen zu 4 Rthl Courant, bis 1. Mai am Ober Baum bei Berlin, kontrahiert; das Eisen soll Anfang April nach Kontop gehen. Nachricht von Hawich und Hecker aus Zagorowo angekündigt.'
'046': 'Bestätigt die vermutlich schon eingetroffene Sendung des fürstlichen Schreibens samt Wechsel und Geld. Zur Prozeßsache liegen die Akten beim Appellationsgericht, doch sei kein günstiges Urteil zu erwarten: eine in den Berliner Zeitungen abgedruckte königliche Declaration bestimme, daß alle auf Geld lautenden Obligationen, rückwirkend bis 1806, in Courant zu berechnen seien; auch die Zinsregelung (10, 12, 16, 20, 50 Prozent) sei verschärft. Klagen über die Lage der Schuldner. Textstellen unsicher lesbar; Grüße, u. a. von Frau Amelang.'
'047': 'Antwort auf vier vorgelegte Fragen nach Besprechung mit Justizbürgermeister Hawich und Inspector Hecker aus Zagorowo: das vom König von Sachsen bewilligte Generalmoratorium schütze die Güter drei Jahre, sofern die Zinsen der auf erster Hypothek eingetragenen 50000 Rthl des Invalidenfonds gezahlt werden; Oppenheimer habe sein gerichtliches Versprechen gebrochen, Prozesse laufen in Berlin und Kalisch. Die Ansprüche des Meyer seien unbegründet, die Sache Giese und Consorten (25000 M.) sowie v. Viedrenricht schweben im Prozeß; das Gesuch der Augustinower Colonisten sei wegen der Erbpachtcontracte abzuschlagen. Die Reise nach Schlawenschitz verhindere die Sequestration seiner Kontoper Güter.'
048: 'Bericht über dreizehn mit dem Justizbürgermeister Hawich aus Zagorowo (Notarius publ.) und Oberinspektor Hertes gerichtlich aufgenommene Spezial-Vollmachten: Abweisung der Dqbska in Sachen der Traperiner Güter, gänzliche Aufhebung der Sequestration unter dem dreijährigen Indult des Königs von Sachsen, Zinseinziehung und Zahlung an Kreditoren, Klage gegen die Juden Oppenheimer et Wolff in Kalisch wegen über 72000 Rthl, Entfernung und Rechnungslegung des Sequestrators Honrichs samt Annullierung seiner Landverkäufe, Beitreibung der Pachtreste von v Niedzewiecki, der Olesnitzer Erbpachtsrückstände von 23000 Rthl, der Radrimin''schen Erbkaufgelder über 10000 Rthl sowie Vertretung auf dem Reichstag zu Warschau; Triebenfeld beruft sich auf seine Obligation von 25000 Rthl.'
049: Enttäuschung darüber, daß der eingetroffene Bote weder Zeilen noch Antwort des Fürsten brachte. Triebenfeld befindet sich weiterhin in Arrest und darf sich nicht entfernen, ehe er die auf sein Ehrenwort zugesagten 600 Centner Eisen abgeliefert und die Quittung des Justizbürgermeisters Scheu in Neufall erhalten hat; besser noch wären die vollen tausend Centner, womit Michaelis Lahr und sämtliche Berliner Kosten gedeckt wären. Er bittet, das Eisen unmittelbar nach Bogadel an seinen Administrator Neumann zu senden. Gerücht über ein russisches Korps an der polnisch-schlesischen Grenze.
'050': 'Darstellung der Schuldsache van der Lahr: Für Zinsen von 3125 Rthl auf das aus dem Invalidenfonds gewährte Kapital von 50000 Rthl, das auf den Zagorower Gütern im Herzogthum Warschau haftet, wurde der Kriegsrath von Triebenfeld als Bevollmächtigter durch Arrest und Militärexecution der französischen Verwaltung belangt und musste gegen solidarischen Wechsel mit dem Generallieutenant von Zastrow 5140 Rthl in Papieren aufnehmen. Nach Zahlung von 1000 Rthl bleiben 3000 Rthl; der Geheime Postrath Amelang in Berlin soll 1000 Rthl zahlen und den Rest in Stab- und Bandeisen liefern. Bitte, von Triebenfeld ex nexu zu lassen.'
'051': 'Nach Aufhebung der Execution bricht Triebenfeld morgen nach Königsberg auf; über die Erbschaftssache will er erst nach der Rückkehr urtheilen, da ein vorausgeschicktes neues Gesetz vieles abwenden könne. Zum neuen Arrest in Wohlen hat er Honrichs zu sich beschieden, der mehrere Tausend einbringen und Geld überbringen will; vor Einlassung mit den Polen wird gewarnt, da diese sonst confiscieren. Bethney liegt in Malsdorff schwer krank. Nachrichten der Zillichauer Banquiers: Prinz Hohenzollern bei Leipzig, Treffen in Bayern, Besetzung Münchens; die Franzosen führen ihre Magazine ab.'
'052': Bericht über die Übergabe des fürstlichen Schreibens samt Anlagen an die Königin, die es mit Vergnügen aufnahm; die Sache wurde an den Großkanzler und von diesem an den Cabinets- und Kammergerichtsrath Allbrecht abgegeben, mit dem Triebenfeld nun arbeitet; da J M v. Beym auf die Form sehe, sei ein langwieriger Verlauf zu erwarten. Politische Nachrichten seien widersprüchlich; der König habe bei der Parole jedes Räsonnieren über den französisch-österreichischen Krieg verboten. Dauer des Aufenthalts unbestimmt; Empfehlung des Generallieutenants v. Köchn.
'053': Meldet, daß in der Erbschaftssache noch keine Resolution ergangen sei; die Akten liegen mit den Gutachten des Kammergerichts und des Cabinetsraths Albrecht bei der obersten Behörde, worauf die Königin dringend wartet. Zur Kriegssache mahnt er den Fürsten, selbst an den König zu schreiben und der Commission offen zu antworten; als redlichste Fürsprecher nennt er Major von Pirch, ferner General v. Köckritz und Haacke; Massenbach berufe sich auf Scharnhorst, der erkrankt sei. Nachrichten über österreichische Verluste, die russische Erklärung und Schills Unternehmungen gegen Franzosen und Westphalen.
'054': Dringende Bitte, die 600 Centner Eisen (300 Stab- und Bandeisen, 300 Schieneneisen) spätestens bis zum 23. April nach Boyadel bei Grünberg zu liefern, da Triebenfeld sich gegenüber Michaelis vor Gericht zur Ablieferung in Berlin am Ober Baum bis 1. Mai verpflichtet, einen Wechsel über 2400 Rthl gegeben und 500 Rthl Strafe verabredet hat; andernfalls Verlust von Credit und Gütern. Die übersandten 100 Fr. gingen für Postgebühren und 480 Rthl Concursgelder auf. Weitere 400 Centner für von der Lahr (6 statt 5½ Rthl), Verhandlung mit Amelang, erhoffte 4000 Rthl in Zagorowo; Hinweis auf Weigels Drohung und das Generalmoratorium bis Johanni 1810.
'055': 'Bericht über die Angriffe von der Lahrs, den Kursverfall der Papiere und die erhoffte Lieferung von 1000 Centnern Eisen nach Kontop. Ausführlich zur Colonna-Erbschaft: das Testament sei nach Hofrath Hahn nicht rechtsförmlich, doch die dem Fürsten vermachten Legate seien nach Landrecht (Tit. XII, § 165) gesichert; Bardthe habe seine 50000 Rthl aufgegeben. Der anonyme Brief stamme von Gräfin Henckel zu Schimanowicz. Graf Götzen und Graf Pohne rathen zum Aufschub wegen Graf Wratislaw; Vorschlag, der Königin die Güter (ca. 3 Millionen) zuzuweisen. Ferner Kriegserklärung Frankreich-Oesterreich, Rüchels Commando in Schlesien, v. Massows Abschied und Bethusys Schulden von 500000 Rthl.'
'056': 'Klage über das noch ausstehende Eisen, das die Abreise nach Königsberg verzögert: erbeten wird die schleunige Lieferung der 1000 Centner nach Beyndel, davon fehlen noch 217; Michaelis, aus Berlin angekommen, erhält Eisen für 600 Rthl, Lahr bzw. von der Lahn für Zinsen, Kosten und Kapital 2200 Rthl; Fracht und Zoll nach Berlin je etwa 240 bzw. 200 Rthl könne Triebenfeld ohne Reisegeld nicht bestreiten, 500 Rthl seien zugesagt. Nachrichten über Kriegsvorbereitungen, Silberablieferung, russische Truppen bei Brzesc, Großfürst Konstantin, Erzherzog Carl, Losung "Carl und Hoff", Handschreiben des Königs an General von Zastrow.'
'057': 'Bericht über die Rückreise aus Königsberg: Triebenfeld wurde unterwegs beraubt (Koffer mit Geld, Kleidung, Wäsche, über 800 Rthl), hat keine 10 Rthl mehr, Execution im Hause, 1200 Rthl Schulden, 600 Rthl Reisegeld gegen 700 Rthl zu Johanni; Michaelis befriedigt, doch das Eisen für Lahr liegt in Kontop, 400 Centner decken die 2000 Rthl nicht. Der König habe Schonung befohlen; wegen des Testaments schreibe man an Hoyok in Warschau, sonst an Graf Danckelmann. Aussicht auf das Generalgouvernement Schlesien; Scharnhorst krank, Massenbach, von Pirch, Erzherzog Ferdinand, Falkenhausen, Warnung vor den "Schwarzen Brüdern". Reise nach Kalisz zum arretierten Sohn.'
058: Dankt für die durch Referendarius Bally übersandten 50 Fr, mit denen er sich auf vier Wochen von der Execution freigekauft hat. Reise über Kontop nach Kosten, wohin Honrichs mit 80 bewaffneten Mann und zweimonatigem Sold geschickt wird; Cabani und Hecker sind beordert, danach Besuch in Schlawentzig. Berichtet über eine Kundschaftsreise nach Vater, die Ausfuhrverbote der Polen, deren Spitzelwesen und Rüstung, über Garczynski und Zychlinski als seine Vertrauensleute im Kahrs sowie über Pläne zur Wiederherstellung Polens unter Constantin; vor übereiltem Handeln in Südpreußen warnt er wegen drohender Confiscation.
059: Klage über die fortdauernde Sequestration von Kontopp und laufende Execution in den Schweinerschen Gütern wegen 2560 Rthl Zinsen und der von der Lahrschen Schuld; an v. d. Lahr gingen Eisen und 14 Schock Bretter (2570 Rthl), weitere 10 Schock sollen nach Berlin folgen. Erst nach Zahlung von 4560 Rthl darf Triebenfeld über 1000 Scheffel Getreide, 105 Stein Wolle und 2000 Klafter Holz verfügen; Geldmangel und polnische Einfuhr verhindern jeden Verkauf. Der Fürst solle direkt an den König schreiben; verlässlich seien nur v. Pirch und v. Hache, nicht Greischau. Nachrichten über Honrichs, Cabanic und Kalisz, Rüstungen der Polen, Rußland und Erzherzog Carl.
'060': 'Klage über die eigene Zahlungsunfähigkeit: In Schweinern und Kontop ist alles versiegelt und mit Arrest belegt, die Sequestration der Güter droht, betrieben von dem "wucherischen" von der Lahr wegen verspätet gelieferter Eisen- und Bretterlieferungen; Grävenitz übersendet nun Quittung an J. W. v. Loen, doch bleibt die Sequestration wegen 1860 Rthl Zinsen bestehen. Loen ließ Bestände für nur 460 Rthl verkaufen; die Zagorower Geldbeschaffung scheiterte, Honrichs wurde verhaftet. Bitte, 1800 Rthl an Professor Schade zu senden; die Reise zum Fürsten (Lombardinis Schreiben vom 29. Juli) sei unmöglich.'
'061': 'Verzweifelte Bitte um 1800 Rthl Zinsen, ohne die eine Reise nach Breslau bzw. Schlawenschutz unmöglich sei: die v. d. Lahr-Sache habe ihn nach dem Berliner Gerede öffentlich entehrt und zur Sequestration der Güter geführt; mit der Summe ließe sich Schweineren retten und sein Plan ausführen, Teilung der Güter, Zinsen zum Unterhalt der Kinder, Reise zum König. Ein in Verzweiflung geschriebener Brief der Tochter sei dem Fürsten übersandt; bleibe die Hilfe aus, gehe er nach Königsberg. Abreise am 12. September, Ankunft um den 16.'
'062': 'Klage, daß fünf Briefe unbeantwortet blieben; dies sei der sechste, wieder über den Königlich Preußischen Oberpostdirektor Mann in Wien (Massakrop 1156), an den der Fürst seine Antworten richten möge. Bericht über die Geschäfte: die Kosch-Sache sei eingeleitet, jedoch bis zur Rückkehr nach Berlin verwiesen; die Curische Schuld werde getilgt, der Vergleich aufgehoben, Cosmar müsse zurücktreten, das Fideikommiß falle an den Fürsten, auch die polnischen Güter müßten zurückgegeben werden. Dringende Bitte um Geld, Gold oder Übersendung durch Estafette, wegen äußerster Not.'
'063': 'Bericht nach siebenwöchiger Krankheit über die eigene Lage: für Kon tap sei ein Pächter gefunden, doch müßten zuvor 8000 Rthl rückständige Zinsen und Schulden gezahlt werden; der durch französische Lieferungen reich gewordene Carte aus Stettin wolle Holz vorauszahlen. Zu den fürstlichen Angelegenheiten: Königsberg stehe gut, in Polen sei die Geldbeschaffung gescheitert (beiliegendes Decret und Pro Memoria Honrichs''); nach Aufhebung der Sequestration müßten die Gelder dem Fürsten zufließen, der Administrator abgewiesen werden; Vollmacht und Autorisation erbeten. Ausführlich über Heckers Denunciation Honrichs'' wegen Äußerungen gegen Bonaparte, dessen Arrest, Befreiung und den laufenden Proceß sowie Pachtrückstände von 7000 und 5000 Rthl.'
'064': 'Nachricht von "Freund F" in Berlin über den Tod der Königin am 19. in Strelitz und die schwere Krankheit des Königs; die Collorina-Sache sei nun gegenstandslos, es gelte nur noch die 100000 Rthl zu erlangen und zu erfahren, ob die Papiere durch Köckritz zurückgelangten. Triebenfeld klagt über Zinsforderungen wegen des Invaliden-Capitals, drohende Sequestration seiner Güter durch Roßem und fehlendes Reisegeld nach Berlin. Beigefügt Abschriften: Berechnung der Güter Bischdorff und Mollna (Landschafts-Taxe, Erträge 20462 und 10955 Rthl), der Knobelsdorff''schen Güter (700000 Rthl) gegen die Forderungen Weigel (190000 Rthl) und Stössel (180000 Rthl) sowie der polnischen Zagoraa-Güter; ferner ein Nachtrag vom 30. October aus Wien über Hardenbergs Zusage, die 112000 Rthl beim König zu erwirken, mit dringenden Bitten um 300 Rthl in Gold.'
'065': Klage über die durch Glogauer Landschaft, v. d. Lahr und das Oberlandesgericht bewirkte Verarmung; übermorgen erscheint die Commission, die die Sequestration seiner Güter aufhebt, danach Reise über Glatz nach Schlawenschitz. Bittet um 40 Stück von Lombardini sowie um Darlehn von 300 Centner Stab- und Bandeisen aus der Koschentiner Hütte bis 18. Januar gegen beiliegenden Wechsel, frachtfrei bis Boyadel, à 4 Rthl 12 g Courant, zum Tauschhandel gegen Branntwein. Ausführliche Aufstellung der Berliner Schulden (Lahr 5040, Holz Apfel 1000, Invalidenfonds 3125 Rthl) und der Zinsrückstände von 18000 Rthl, zusammen 25100 Rthl. Gerücht über die Ernennung des Fürsten zum Generalgouverneur von Schlesien.
'066': Bericht über das erwartete Urteil gegen die falschen Denuncianten (sechs Jahre Festungshaft) und die Aufwiegler; für Heiler will Triebenfeld sich um dessen Vaters willen verwenden, doch fordert Honrichs mehr als dessen Sicherheit. Zinsnachlässe für Colonisten und Bauern seien abzulehnen; drei Rehböcke sollen Praefect, Tribunalspräsident und Oberpraefect gewinnen, damit die Administration aufgehoben werde. Nachrichten über Russen, Polen und Napoleon. Bitte um Quittungen für die Frachtgelder der Schiffer Kulawy und Neumann (noch 243 Rthl 14 s.) zur Freigabe der 70 Centner Eisen in Neuholz; Prozeßkosten (Trąbcziner u. a.) und Angebot, 2000 Centner Stabeisen für 8000 Rthl Courant zu liefern.
'067': 'Meldet die Verzögerung der Abreise, da Coste nicht eingetroffen ist und Schweinere noch nicht verpachtet sei; die Berliner Sache bleibe eine immer wieder aufbrechende Wunde. Ausführlich zur polnischen Angelegenheit: Hawich beschuldigt Henrichs des Betrugs, weshalb Triebenfeld beide vorlädt und einen Actuarius nach Zagorowo schickt, um Erhebungen bei Untertanen und Pächtern zu prüfen; die Sequestration sei aufgehoben, nur ein Aufseher bestellt. Verdacht gegen Hawich, Honrichs und Heckert wegen angeeigneter Hufen (mehrere tausend Rthl wert). Nachrichten über Gen. v. Köckritz, Kleist, Graf Götz und die Verlängerung des Moratoriums bis Johanni 1810 bzw. 1812; erbittet Fracht-, Zoll- und Wiegezettel für das Eisen.'
068: Honrichs ist eingetroffen und hat die Angaben von Hawich und Consorten widerlegt; die von ihm unter Androhung militärischer Execution erhobenen Requisitionen von 22000 Rthl seien von den Colonisten zu ersetzen. Dringend erbeten wird die Original-Schenkungsurkunde über Trapponin für den Termin am 28. vor dem Friedensrichter Kwilecki in König, dazu wenigstens 1000 Rthl Courant, da 59 Rthl 18 g geborgt und 185 Rthl offen sind. Klage gegen Lipski wegen der an die Dąbska (15000 Rthl in Ducaten) gebrachten Güter; Nachricht vom russischen Vormarsch.
069: 'Bericht über die verzögerte Rückreise: Das Geld konnte in Breslau nicht sogleich empfangen werden, dazu behinderten unwegsame Straßen und schlechtes Wetter die Reise; dennoch traf der Schreiber am 25. mittags ein und fand Honrichs und Cabanis noch vor, die nach Übergabe von 6000 f. an Honrichs sowie der Schenkungsurkunden im Original noch am selben Tage zuversichtlich abreisten. Der Kriegs- und Forstrath von Triebenfeld leidet am rechten Arm, will aber nach Abschluß seiner hiesigen Geschäfte für einige Wochen nach Schlawentz kommen; um weitere Weisungen wird gebeten.'
'070': Bericht über Hecker, der wegen eines Mißverständnisses des Ober-Präfect Garczynski bleibt, sich zur Zahlung bis Johanni verpflichtet und in Costen vor Gericht nochmals stipulieren soll; als Controleur wird ihm Cabanis beigegeben, die Caution an Garczynski angewiesen. In Sachen Trąbczin erschien Kramplitz nicht, neuer Termin 2. April; Raczkowski, Künzel und Honrichs führen die Sache, Beilagen zurückerbeten. Statt nach Schlawenschitz will Triebenfeld auf 6 Tage nach Berlin; die Sache Colloma sei begonnen. Die 600 Rthl gingen in ungarischen Wein für Garczynskis Keller; die Landschaft liquidiert für zwei Jahre Sequestration weitere 4000 an Kosten.
'071': Bericht über den in Gang gebrachten Prozeß in der Sache Rochlitz, der als betrügerische Machenschaft dargestellt wird; Triebenfeld versichert, Rochlitz 1804 als Generalbevollmächtigter entlassen und vergeblich Rechnungslegung verlangt zu haben, wofür Glenck Zeuge sei; ein heimliches Zugeständnis durch Baurath Otocki hält er für unwahrscheinlich. Erbittet umgehend zwei oder drei unterschriebene und gesiegelte Blanko-Vollmachten zum Prozeßführen, damit Melzig die Sache betreibe und die liquiden Rückstände von etwa 18000 Rthl einziehe; danach Reise nach Schlawenschitz.
'072': Klage über das lange vergebliche Warten auf die Ankunft mit Herrn v. Brzechsta, weshalb das Tauschprojekt mit General v. Schimmelpfennig aufgegeben wurde; da das Pachtprojekt Brzechsta offenbar hinfällig ist und der Druck der Gläubiger keine Frist mehr lässt, wurde ohne Wissen des Fürsten die Besichtigung der Zagorower Güter gestattet und über die Ansprüche an den Trappyner Gütern verfügt; beigefügt die Original-Schenkungsurkunde. Erbeten werden Nachricht über Brzechstas Fürsprache im Warschauer Prozess und 300 Rthl für Lieutenant Sommer.
072a: Bericht über den sub spe rati mit dem Sub-Präfekten v. Brzechsta geschlossenen Pachtvertrag über die Zagorower Güter; die Reise nach Schlawenschitz verzögerte sich, da Präfekt Graf Garczynski und Brzechsta nach Warschau berufen wurden; letzterer bringe 2-3000 Rthl mit, die Ratification bleibe dem Fürsten überlassen. Der Prozeß gegen die Wrobezin-Bauern ist im Tribunal Solenne gewonnen, der Vertrag annulliert, Execution soll folgen; die Trąbczin-Sache muß vor die Rada Stanu. Auf den Gütern (Wert 300000 Rthl) stehen 80000 Rthl Schulden; Klage über drückende Lasten und Lieferungen nach Warschau.
072b: 'Berichtet nach beiliegenden Schreiben des Sub-Präfekten v. Brzechsta und des Kreis-Raths Thiele, daß Brzechsta Warschau erst nach dem 15. verlassen und dann samt eingetriebenem Geld nach Schlawenschitz reisen könne, zuvor aber die Präfektur Konin übernehmen müsse; er wolle die bei der neuen Klassifikation auf die Zagorower Güter gelegten 897 Rthl abwenden. Zaborowski und Szimanowski forderten 500 Th. Mit Hawich verglichen: 1200 Rthl Gehalt für anderthalb Jahre gegen Rückgabe der 9 Hufen. Niedzewiecki, statt 6000 Rthl zu zahlen, unterlag im Prozeß und soll 2000 Rthl herausgeben. Der feindliche Land-Unterrichter Piekowski ist suspendiert; Krieg werde es nicht geben.'
072c: Übersendet in der Anlage ein durch den Advocaten v. Wieckowski überbrachtes Schreiben des Sub-präfecten v. Brzechsta, aus dem hervorgeht, daß dieser seiner Geschäfte wegen erst am 15. des Monats aus Warschau abzureisen beabsichtigt; hinsichtlich der Herrschaft Trąbczyn bestehe gute Aussicht. Der District-Rath Thiel versichert dem Kriegs- und Forstrath von Triebenfeld seine Ergebenheit; Vermerk des Empfangs zum 12. März 1812.
072d: Mitteilung an den "lieben Bruder", daß die Abreise aus Warschau wegen verschiedener Geschäfte nicht vor dem 15. des Monats erfolgen könne. Die Angelegenheit Trąbczyn stehe nach zuverlässig eingezogenen Nachrichten recht gut; Näheres wolle der Schreiber mündlich berichten. Wegen Kürze der Zeit, die Post gehe ab, bleibt der eigenhändige Brief kurz; Grüße an den Freund und beide. Unterzeichnet Brzechsta.
072e: Kurze Mitteilung an den "lieben Bruder", dass verschiedene Geschäfte die Abreise aus Warschau bis zum 15. des Monats verzögern. Die Angelegenheit Trąbczyn stehe nach sicheren Nachrichten günstig; Näheres werde der Schreiber nach seiner Rückkehr mündlich erläutern. Wegen abgehender Gelegenheit (Post) und Zeitmangels bricht er ab. Unterzeichnet B. Brzechsta; die Grußformel vor der Anrede "Bruder" ist unsicher lesbar.
072f: 'Bericht über die Notlage der Zagorower Güter: übermäßig geforderte Getreide- und Strohlieferungen, von der Ober-Präfektur in Kalisch abgelehnte Execution gegen die Bauern, sodann erneute Sequestration, die nur durch den Unterpräfekten Brzechsta mit 2000 Rthl und Quittungen als Pachtzahlung abgewendet wurde; der Sequestrator ist abberufen. Triebenfeld liegt an Gallenfieber und Podagra krank, klagt über täglich bis 62 zu verpflegende Einquartierte, geflohene Untertanen und ausbleibende Einkünfte. Er erwartet die Entscheidungen zu den Werbizer Bauern (Cassationshof Warschau) und zu Olleinue, will zu Johanni mit 10000 Rthl erscheinen; Honrichs drohe Arrest wegen Unterschlagung.'
'073': 'Antwort auf Triebenfelds Schreiben vom 1. Januar, nach Beratung mit v. Weithausen (Cosel) und Bolli: Das Erbpacht- bzw. Pachtangebot des Herrn v. Brzechsta wird grundsätzlich begrüßt, doch verlangt der Fürst halbjährige Pachtzahlung pränumerando, Barcaution in klingender Münze, Übernahme aller Lasten und einen Vertrag ohne Remissions- und Rekursklagen; Brzechsta solle mehrere tausend Rthl mitbringen. Mit General v. Schimmelpfennig stockt der Güterhandel; ein Verkauf der Zagorower Güter bleibt erwünscht, auch der Plan mit Weigel und Baron v. Stössel. Erbeten werden 300 Rthl für L. Sommer, Nachrichten aus dem Oleschwitzer und Trotziner Geschäft, baldiger Besuch sowie der zugesagte große Hund; Wildbret geht nach Blizanow.'
074a: 'Abschrift eines fiskalischen Arrestgesuchs (Pro Fisco, periculum in mora) des Seelmann an das Kammergericht: Triebenfeld schuldet dem General-Invalidenfonds das am 1. Februar 1805 aufgenommene Darlehen von 50000 Rthl Courant samt 5 % Zinsen vom 1. November 1807 bis Ende Juli 1811, also 9375 Rthl; die zur Sicherheit cedirte, auf den Zagorower Gütern des Fürsten haftende Obligation über 250000 Rthl (Brulau, 1. Juni 1804) ist den Bayonner Summen zugerechnet, Kontop und Schwammern sind überschuldet. Beantragt wird Arrest auf die dem Fürsten aus dem Nachlass der Fürstin von Sacken vermachten 80000 Rthl, ausführbar durch Testamentsexecutor Justizminister von Kircheisen.'
074b: 'Für Zagorowo wird die Anstellung eines Oberförsters als notwendig dargestellt: vorgesehen war der Sohn des alten Richter, während der Neffe der Nogeln (Nageln) das Propinationsamt bei der Brauerei bzw. Brennerei übernehmen sollte; da die Nageln ihren Neffen zurückgerufen hat, muß nun Richter dieses Amt verwalten. Vorgeschlagen wird, dem armen Radzowski (Radzewski) mit 300 Rthl jährlich zu helfen und ihn eilends herzuschicken; zugleich wird die Meinung des Fürsten zur "Taufe" der Güter erbeten.'
074c: 'Gerichtliche Verfügung: Das Königliche Kammergericht Berlin fordert den Staats- und Justizminister von Kircheisen als Testamentsexecutor der verstorbenen Frau Fürstin von Sacken auf, an Triebenfeld auf eigene Verantwortung nichts auszuzahlen, sofern die Behauptung des General-Invalidenfonds aus dessen Klage vom 30. v. M. zutrifft, der Fürst zu Hohenlohe-Ingelfingen erhalte aus dem Nachlaß ein Legat von 50000 Rthl und habe dieses dem Kriegs- und Forstrath von Triebenfeld zu Kontop bei Grüneberg zur Befriedigung seiner Forderungen cediert; gleichlautend an Oberme­dicinalrath Cosmar. Das Oberlandesgericht Schlesien zu Glogau (Fülleborn) übersendet Triebenfeld die Vorladung No 1103 mit Gehorsams- und Empfangsbescheinigungsbefehl.'
074d: 'Verfügung des Königlich Preußischen Cammergerichts (Woldermann) an den Kriegs- und Forstrath von Triebenfeld: Auf Antrag des Königlichen General-Invaliden-Fonds vom 30. des Vormonats ist der Arrest auf das dem Fürsten zu Hohenlohe-Ingelfingen von der verstorbenen Fürstin von Sacken vermachte Legat von 80000 Rthl bewilligt worden. Termin am 23. August, 10 Uhr vormittags, vor Kammergerichtsrath Koitsch; Triebenfeld soll persönlich oder durch einen Justizcommissarius erscheinen, sich zu den Bescheinigungsmitteln, zum drohenden Schaden und zur Höhe der Caution erklären und gütliche Verhandlung, etwa Aufhebung des Arrestes gegen Sicherheit, versuchen. Bei Ausbleiben Bestätigung des Arrestes.'
'075': Rücksendung des mitgeteilten Schreibens des Grafen v. S., dessen offenes Verhalten Triebenfeld begrüßt, während er bedauert, dem Fürsten nicht mehr die erhofften 40 bis 50000 Rthl verschaffen zu können. Reinhardt melde aus Bonn, die Unterstützung des Fiscus sei noch nicht erfolgt. Nach Minister v. Goldbeck in Berlin behalte Graf v. Hoym das südpreußische Departement, dem noch Ansbach und Bayreuth zugefügt worden seien; Priebich, Vertrauter des Ministers Haugwitz, habe dem Rath Krüger dagegen Haugwitz als künftigen südpreußischen Minister versichert. Chełmski habe noch nicht appelliert; die Güter könnten von Johanni an verpachtet werden. Metzer sei abwesend, Vollmachtsformular und weitere Berichte folgen.
'076': Meldung, daß der beabsichtigte Gütertausch nun im Gange sei und die Sache möglicherweise in Kürze abgeschlossen werde. Triebenfeld kündigt an, Anfang September nach Berlin zu reisen und dort bis Ende des Monats bleiben zu dürfen; er hoffe, den Fürsten wohlbehalten wiederzusehen und ihm persönlich über mehrere Geschäftsangelegenheiten den treuesten Bericht zu erstatten. Im übrigen Ergebenheitsbekundungen ohne weitere sachliche Angaben.
'077': 'Meldet günstigen Fortgang der Angelegenheit: das Schreiben des Königs sei durch Geheimen Rath Beyhm ergangen, die Sache gehe noch heute an Minister v. Voss zur schleunigen Berichterstattung. Bittet, die Taxen mit der eingereichten Designation und den Contracten in Übereinstimmung bringen zu lassen; die Contracte habe er bei sich, nur die Tietener seien dort zu verwahren. Herr v. Michaelis werde um eine Vollmacht schreiben; ferner erbittet er unterschriebene Blanquette, auch für einen in Potsdam gewonnenen Mann. Kündigt Bemühungen um ein Darlehn und einen Besuch bei Fürst Sacken an; Personalnachrichten über v. Burensprung, Wedel und Lindenau.'
078: 'Bericht über die Unterredung mit dem Geheimen Rath Schultz, der von der Sache bisher nur aus dem Schreiben des Fürsten an Minister v. Voss wisse und sich weder dafür noch dagegen erklärte; er empfahl, eine Vollmacht des Fürsten in der Registratur niederzulegen, um Akteneinsicht zu erhalten. Vorschlag zur Fassung der Vollmacht: Betreibung des Gütertausches beim Südpreußischen Departement und Verhandlungen zum Erwerb der Güter. Bitte um die versprochene Nachricht zur Grotowski-Sache; Lob des Eifers des Kriegsraths v. Triebenfeld.'
079: 'Bericht über den Stand der Sache bei den Ministern: erwartet wird das Votum des Staatsministers von Voss, während Graf Schulemburg (dem nach dem Tode Worners der Dispositionsfonds zufiel), Minister Hoym und Struensee sowie Cabinetsrath Beyhm gewonnen scheinen; Hoym, nach Potsdam berufen, verspricht Unterstützung. Aufstellung der Zahlungen: der Schulze-Tochter 2500 Rthl, Klewis 3000 Rthl, Hoffiscal Michaelis 300 Ducaten, Rest an Treskow; 200 fr für einen Cabinetssecretär. Ferner politische Nachrichten über die Kriegspartei und russische Truppenbewegungen; Bitte um Blanquette.'
080: 'Nachtrag zu dem tags zuvor durch Herrn Capitain und Hahn übersandten Schreiben: Minister Hoym sei zufrieden aus Potsdam zurückgekehrt, wo nach Versicherung eines Dritten mehrfach von den Angelegenheiten des Fürsten die Rede gewesen sei; der Monarch schätze ihn wahrhaft, so daß alles nach Wunsch gehen werde. Vom Gerede über Märsche oder Krieg hält Triebenfeld nichts, da der König an seinen Grundsätzen festhalte. Von der Excellenz Herrn von Voss steht eine Antwort noch aus.'
081: 'Trotz des Drängens von Triebenfeld und Eysenhardt kann über den Stand des Gütertausches noch nichts Bestimmtes berichtet werden: bei der südpreußischen Registratur und Expedition, von wo Michaelis eben zurückkommt, ist nichts eingegangen, woraus zu schließen ist, daß die Sache noch im Schriftwechsel zwischen Minister v. Roth und Geheimrath Schulze liege und nichts verfügt sei. Weitere Besuche bei Schulze hält er vorerst für unzweckmäßig; er erwartet die fürstliche Vollmacht am kommenden Dienstag, um sich damit zu legitimieren und verläßliche Auskunft zu erlangen.'
082: 'Meldet, daß die vom König in der Angelegenheit des Fürsten ergangene Cabinets-Ordre dem Minister v. Voss nach Havelberg nachgesandt wurde und dem hiesigen Departement noch nicht zugegangen ist; Erkundigungen in der Kanzlei blieben ohne Ergebnis, doch werde der Minister, seinen Urlaub um 14 Tage verkürzend, schon am Donnerstag zurückerwartet und die Ordre wohl selbst mitbringen. Lautet sie so bestimmt, wie Herr von Triebenfeld angibt, sei ein wunschgemäßer Ausgang gewiß, wie auch die Gönner versichern. Ferner: an Triebenfeld auf Hohe Rechnung 300 Rthl Pr. Cour. gegen schriftliche Quittung ausgezahlt.'
083: 'Bestätigt den Empfang des fürstlichen Schreibens mit Anlagen durch Herrn Michaelis und meldet günstigen Fortgang der Entschädigungsverhandlungen: Krotoszyn werde für die Suprenstischen Besitzungen sicher zugestanden, wegen Polajewo bestünden noch Bedenken, doch nach Versicherung des Geheimen Finanzraths Schulze seien dort etwa 100000 Rthl zu gewinnen; hinderlich blieben die Kammern. Bittet, Prinz Georg bis zu seiner Ankunft aufzuhalten, da nur er Provinz und Sprache kenne. Minister Hoym nach Pommern abgereist, von Voss Donnerstag zurück; Nachrichten über Mencke, Fürst Reppnin und angebliche französische Absichten auf Hannover.'
084: Der König hat von Voss mit der Regelung der Krotoszyner Sache beauftragt; dieser erbat vier Wochen Frist für den Endbericht, die Kammern sollen die Gleichheit der Revenüen prüfen. Triebenfeld reist nach Betschen, will Bronzewski klären und schlägt vor, statt des umstrittenen Polajewo Güter aus der benachbarten Starostei Adelnau zu erhalten, zu 4 Prozent gerechnet. Prinz George kommt nach Breslau. Von Köckritz sei geneigt, von Voss werde von Kriegsrath Nöldichen gelenkt. Beiläufig Nachrichten über Verwirrungen am russischen Hof (Reppnin, Kurakins, Zubow, Panin).
085: 'Abschrift eines königlichen Schreibens Friedrich Wilhelms an den Fürsten zu Hohenlohe-Ingelfingen in Breslau: Nach dem Bericht des Etats-Ministers von Voß wird der vorgeschlagene Tausch der südpreußischen Güter des Fürsten gegen die Domänenämter Krotoszyn und Polajewo abgelehnt. Allein Krotoszyn bringe 49043 Rthl Revenüe, wie die dem Kriegs- und Forstrath von Triebenfeld für die Cession der Pacht von 1795 gezahlten 26.000 Rthl belegten; dem Staat entstünde ein jährlicher Verlust von 17400 Rthl gegenüber den auf 40.500 Rthl gestiegenen Erträgen der fürstlichen Güter. Voß sei bereits am 19. Juli angewiesen, solche Anträge abzulehnen.'
086: 'Rechtfertigungsschreiben an den König gegen den Bericht des Staatsministers von Voss zum erbetenen Tausch der südpreußischen Güter gegen die Herrschaft Krotoszyn: die Zuzahlung von 30000 Rthl und die Veräußerung von Polajewo seien bereits zurückgenommen worden; der auf Angaben des Kriegsraths Nöldichen gestützte Ertrag von 49043 Rthl sei überhöht (tatsächlich 30100 Rthl Pacht, höchstens 36000 Rthl), die eigenen Güter trügen 41500 Rthl. Erbeten wird ein unparteiischer Commissarius zur Wertermittlung; Graf von Hoym wird erwogen. Zweck sei die Aufnahme eines Capitals zur Schuldentilgung.'
087: 'Beschwerde über den gescheiterten Gütertausch: Der Verfasser wollte die ihm verliehenen, mit rund 50000 Rthl Aufwand verbesserten Güter gegen die Krotoszyner Güter tauschen, weil der südpreußische Edelmann von Karnhowsky 90000 Ducaten nur auf solche Sicherheit vorstrecken wollte; auf Polajewo habe er gegenüber Minister v. Voss verzichtet. Gegen Voss'' Bericht (Nachteil von 17400 Rthl jährlich, nach Rath Nöldichen ohne Lokaluntersuchung) wird geltend gemacht, Krotoszyn trage nur 30100 Rthl, die eigenen Güter 41500 Rthl; Bitte an Obrist von Köckritz, beim König unparteiische Untersuchung und Einsicht der Akten bei Minister von Struensee zu erwirken.'
088: 'Abschrift eines Schreibens an den Minister v. Voss: Nach dessen Antwort vom 1. des Monats wird die Ablehnung des beim König beantragten Tausches der südpreußischen Güter gegen das Amt Krotoszyn, Polajewo ausdrücklich nicht eingerechnet, auf die Berichte der Commissarien zurückgeführt, die den Wert von Krotoszyn zu hoch angesetzt hätten. Unter Berufung auf die Gnadenzusagen des Königs, eigene Renseignements und frühere Äußerungen von Voss wird angekündigt, weitere Schritte zur Wahrung der Ehre und zum Nachweis uneigennütziger Absicht zu unternehmen.'
089: 'Zuversichtlicher Bericht über das Tauschgeschäft: beigefügt Glencks Schreiben mit der Copia der Eingabe an den König; Minister v. Struensee soll erklären, daß Krotoszyn und Polajewo nie mehr als die geringeren Sätze tragen. Ausführlich Glencks neunjähriger Generalpachtcontract über 44500 Rthl bei 10000 Rthl Caution, die vorgeschossenen 64000 Rthl sowie Broniewski und Trąpczynski; ausführliche Widerlegung der von v. Voss und Nöldichen behaupteten 49000 Rthl Ertrag mit Verweis auf Schmudels Rechnungen. Zur Geldnegotiation gibt die Fürstin nur 30000 Rthl; 7000 Rthl fehlen noch, Nising soll die Instrumente ausfertigen.'
090: 'Bericht über den kritischen Stand der Sache in Berlin: der Kampf sei groß, der Monarch gut, doch die Minister und die "bösen Richter" in Berlin und Breslau bedrohten den Erfolg. Triebenfeld nimmt auf des Fürsten Schreiben an Glenck Bezug und warnt, ein Dritter könne die Sache hintertreiben. Die 7000 Rthl, welche die Fürstin Sacken nicht vorschießen wolle, will er auf eigenen Namen aufnehmen und dafür sein gesamtes Vermögen verpfänden.'
091: Dank für die vom Fürsten erteilten Aufklärungen in der Sache des Gütertausches; Beyme äußert seine Freude darüber, daß Seine Majestät die vorgeschlagene weitere Untersuchung angeordnet hat, und versichert, die Angelegenheit ebenso gewissenhaft wie bisher weiterzuverfolgen und kein Mittel unversucht zu lassen, um die Wünsche des Fürsten, die Bereitwilligkeit seines Herrn und das Interesse des Staates miteinander zu vereinigen. Schluß mit Ergebenheitsbekundungen; sachliche Angaben zu Gütern oder Summen fehlen.
092: 'Michaelis meldet, die vom Fürsten mit letzter Post erbetene Auskunft beschafft zu haben: Baurath Glenck habe ihm die Quittungen der Gleissenbergen und Schneiders übergeben, so daß er nun in der Lage sei, dem General-Auditoriat auf die dem Fürsten mitgeteilten Verfügungen zu antworten. Über den gegenwärtigen Stand der Krotoszyner Tausch-Angelegenheit werde Kriegsrath v. Triebenfeld noch am selben Tage Nachricht geben.'
093: Übersendung des auf die letzte Bittschrift ergangenen allerhöchsten Rescripts; Minister v. Struensee hat sämtliche Akten dem König vorlegen müssen, Kriegsrath v. Cöln hat die Sache in der Beilage gut dargestellt. Oberst v. Köckritz, der allein den König günstig gestimmt und Cabinetsrath Beyme unterrichtet habe, überreichte Schreiben und Pro Memoria, worin Triebenfeld anbietet, Polajewo auf 30 Jahre in Pacht zu nehmen, jährlich 6 Bauernstellen zu bauen, Wüstungen zu räumen und 20000 Rthl Pacht zu zahlen. Ferner Arbeit wegen der 7000 Rthl zum Abschluß der Nidernhaller Sache; der Minister ist mit einer wertvollen Dose abgereist.
094: Mitteilung, daß mit der heutigen Post ein Schreiben Seiner Majestät des Königs abgeht, wonach der wahre Wert der südpreußischen Güter des Fürsten sowie derjenige von Krotoszyn und Polajewo näher untersucht werden soll, um die Besitzungen gegeneinander abwägen und den beabsichtigten Tausch prüfen zu können; stehen keine erheblichen Hindernisse entgegen, werde der König dem Wunsch des Fürsten gern entsprechen. Dank für das im gnädigen Schreiben vom 7. d. M. bezeigte Vertrauen, verbunden mit dem Hinweis, daß die Sache nicht in sein Departement falle, er aber warmen Anteil nehme.
095: Oberst v. Köckritz läßt sich empfehlen und versichert, das Tauschgeschäft (Quiet) stehe ausgezeichnet und sei so gut wie abgeschlossen; er selbst werde erst nach Vollzug schreiben. Der G. C. R. handle contre coeur, so wolle es der Souverain. Nachrichten von einer Theilung des Departements seien gröbste Lügen; kurz vor der Abreise sei ein hartes Refus verabredet worden. Warnung vor falschen Vorstellungen des H. v. V. beim König, der erkrankt sei, daher keine Audienz. Das Säcular-Geschäft bleibe ungewiß; Friedenshoffnungen seien bloße Ideen. Ankündigung eines Couriers, danach solle sogleich wegen des Urlaubs geschrieben werden.
096: Meldet über Oberst v. Köckritz, der Tausch sei so gut wie genehmigt und abgeschlossen; nur die Indisposition des Königs verzögere den Audienzvortrag. Rät, sofort das Urlaubsgesuch an Seine Majestät zu schreiben und ihm per Estafette zu senden, damit die Reise nach Öhringen über Berlin, nicht durch Böhmen, gehe. Zur Secularisation sei derzeit nichts zu erreichen. Wahre Freunde seien nur der König, v. Köckritz und der Prinz von Hessen-Darmstadt; heftige Klage über Wedel in Breslau wegen dessen Gutachten in der Krotoszyner Sache, wonach Prot. 50000 Rthl tragen könne; Cabinetsrath Beyme gab Einsicht in die Akten.
097: Meldet, der König wünsche, der Fürst möge seine Reise über Berlin nehmen und einige Tage bleiben; Oberst v. Zastrow habe den Monarchen unmittelbar auf den Weg über Dresden angesprochen. Über den Aufenthalt im Reich habe er aus Zartgefühl geschwiegen; eine sechsmonatige Abwesenheit aus Schlesien scheine bedenklich. Die Tauschsache solle noch vor der Ankunft entschieden und durch öffentliche Cabinets-Ordre bestätigt werden, beide Güter würden geprüft, damit weder Staat noch Fürst Schaden nehme; Minister v. Voss arbeite erbittert dagegen. Zur Secularisations-Angelegenheit rät er vorläufig zum Schweigen und mündlichem Vortrag.
098: Bericht über die zähen Verhandlungen in der Quat:-Sache, deren Abschluß Triebenfeld abwarten will; Glenck wird eilends vorausgeschickt. Die Einladung des Königs sowie das Wohlwollen von Köckritz und Zastrow werden als Erfolg gedeutet; ein Aufenthalt von drei bis vier Tagen wird empfohlen. Ausführlich der Hofskandal um Prinz Solms und dessen heimliche Heirat mit der verwitweten Prinzessin Louis, der der Titel Königliche Hoheit entzogen wurde. Warnung vor dem Doppelspiel Hoyms und Wedells; Abraten von der Säkularisationssache, die besser mit Prinz George in Wien zu betreiben sei; Haugwitz im Aufstieg, Schulemburg im Abgang.
099: 'Bericht über den Stand der Krotoszyn-Angelegenheit: nach dem Schreiben an Zastrow sei nur die beiliegende Antwort erfolgt, doch werde dem Fürsten allseits der Erwerb der Krotoschiner Güter zugesichert; v. Voss habe seinen Ton gemäßigt, Nöldichen sei bedrängt, v. Köckritz nenne Knobloch und Prittwitz als Entscheider, weshalb Wildegans als Beihilfe eingeschaltet werde. Ferner Nachrichten aus Berlin über drohenden Krieg, mögliche Ministerwechsel und neue Cabinetsräthe, der Entwurf des Kriegsrath v. Cöln, Bitte um ein Patent als Commissionsrath für Carl Theodor Fischbach zu Betschen sowie die Absicht, Broniewski jede Zahlung zu verweigern.'
'100': 'Abschrift einer Antwort des Kabinettsrats Beyme: Auf die Vorlegung des fürstlichen Schreibens vom 21. dieses Monats habe Se. Majestät befohlen, die Beantwortung, wie der Fürst selbst erwartet zu haben scheine, bis zum Eingang des vom Staatsminister v. Voss eingeforderten Berichts auszusetzen. Beigefügt der Präsentationsvermerk "ad 1. Febr 1799". Sonst kein sachlicher Inhalt.'
'101': 'Abschrift einer Immediateingabe des Fürsten zu Hohenlohe an den König: Widerlegung der vom Geheimen Staatsminister von Voss (Schreiben vom 1. Dezember) gegen den Tausch der südpreußischen Güter gegen Krotoszyn und Polajewo erhobenen Einwände zu Reservationsfonds (9540 Rthl), Vorwerk, Hollander Hufe, verwüsteten Forsten und Mastnutzung Triebenfelds (3327 Rthl). Krotoszyn und Polajewo seien keine Domänen, sondern erst nach 36 Jahren, wegen Goernes Schulden an die Seehandlung, Sequestration, Amortisation 50000 Rthl. Neues Angebot: Verzicht auf Polajewo, 8000 Rthl jährlich mehr für Krotoszyn (38000 statt 30000); erbeten wird Untersuchung durch die Posener Kammer und Bericht des Grafen von Höym.'
'102': Angekündigt wird die Ankunft des Ministers v. Voss in Krotoszyn binnen drei Wochen zur Prüfung des Geschäfts; wünschenswert wäre die persönliche Anreise des Herrn p. Prittwitz. Chelmshi hat auch in zweiter Instanz verloren; mit Broniewski könnte gegen einige tausend abgeschlossen und die Dismembration verfügt werden. Glenck bringt nach Vermessung von Kaemen und Kulm 6000 Rthl Zinsen heraus. Wegen Brzyze und der Prusimski-Tochter erwirkte er nur sechs Wochen Frist; empfohlen wird ein Schreiben an den Großkanzler um fünf Monate Verlängerung. Minister Hoym ließ die Akten zum Confiscationsdecret heimlich beiseitelegen. Klagen über den Winieces-Forst, den Krieg und die Zustände in Südpreußen.
'103': 'Bericht zur Broniewski-Sache: der Instructionis Termin steht am 14. an, der Patron wäre mit etwa 20000 Rthl zufrieden, doch Rapachis Beweise sprechen ihm alles ab, weshalb der Vergleich aufgeschoben wird; nur der Krotoszyner Tausch könnte ein Opfer von einigen Tausend rechtfertigen. Der Chelmski-Prozeß ist in zweiter Instanz gewonnen; Brzyze und Winzingerode bleiben bedenklich. Ausführliche Rechtfertigung der Gütererträge gegen Prittwitz und den Minister: Prusimski-Güter 20000 Rthl, geschenkte Güter 22640 Rthl, zusammen 42640 Rthl, mit Vergleichen zu Bischofswerder, Zastrow, Dolfi und Ruchil. Der Krieg ist ausgebrochen.'
'104': Versichert bei Ehre und Vermögen, die Angelegenheit des Fürsten binnen zweier Monate zum gewünschten Ende zu führen; ein unbedeutender Mann werde entscheiden, Näheres sei dem Papier nicht anzuvertrauen. Der Monarch billige den Gütertausch, sofern die Güter einander die Waage hielten; Bitten und Gnadensachen widerstreben seinem Ehrgefühl. Graf Schlabrendorff nehme für die Zinsen einen Wechsel auf ein Jahr, Abschluß am Sonntag. Prittwitz sei ein Lügner. Ab 16. April in Berlin. Die an Prinz George verkauften Güter seien auf über 700000 Rthl geschätzt.
'105': Meldung, Graf Schlabrendorff sei mit 11085 Rthl Zinsen befriedigt, die Quittung lautet unmittelbar auf den Fürsten; für die eigenen Forderungen von Triebenfelds sei nichts geblieben, worauf er nicht dringe. Die Fürstin habe ihn trotz dreimaliger Anmeldung nicht empfangen; das Schreiben an Prittwitz habe auch in Breslau Aufsehen gemacht. Nachrichten aus Berlin über Königin, Monarch, Garde, K. Zastrow und R.; kein Krieg zu erwarten. Nach schlechten Mitteilungen Glencks im Prusimski-Prozeß will er mittels der ihm überlassenen Blanquette beim Großkanzler Fristverlängerung erbitten.
'106': 'Zum von Hoffiscal Michaelis übermittelten Gütererwerbsvorschlag des Juden Dann, der Herrn v. Eckart, Käufer der hiesigen Lichtenauer Häuser, gewinnen will: ein blosses Maklergeschäft, dieselben Pläne habe Dann auch dem Prinzen George vorgelegt. Nach einem Contumacialdecret der Posener Regierung sollen die Brzyzer Güter entzogen werden; Kammern und Forstbeamte intriguieren um die Forsten, die Processe verursachen schreckliche Kosten, an ruhigen Besitz sei nicht zu denken. Die Tauschsache stockt, Besichtigung und Taxation unterbleiben; die Minister handelten en souverain. Warnung vor Übelwollen, Bitte um Schonung nach dem von Eysenhardt berichteten Sturz mit dem Pferde.'
'107': Übersendet ein durch einen Jäger überbrachtes Schreiben des Obristen von Zastrow; das königliche Cabinetsschreiben behält er bis zur erwarteten Ankunft des Fürsten zurück. Bei der Fürstin Sacken wurde er nicht vorgelassen und ließ ihr den fürstlichen Brief nur übergeben. Berichtet über deren Umgang (von Rietesel, Advocat Cosmar, Minister, Hoym, Professor Selle) und ihre Erklärung, nie zurückzukehren, mit 2000 Rthl Appanage zufrieden zu sein und keine weiteren Schulden mitzuzeichnen. Hof und Freunde raten zu festem Auftreten. Gerücht von Suworows Niederlage und Gefangennahme.
'108': 'Klage über die immer bedrängtere Lage in der Sache mit Prinz George: Präsident v. Schuckman habe die Briefe übergeben, doch der Prinz antworte nicht und sende keine Remessen. Der Jude Kuh habe wegen 5800 Rthl Execution erwirkt, Zahlung oder Arrest drohten am Freitag; der in Dyhrenfurth aufgesuchte Minister solle ihn beruhigen. Aufrechnung der Belastungen (120000, 55000 durch Schuz, 23000 Wechsel, 8000 Kosten, 64000 Schulden) auf 270000 Rthl gegenüber dem Kaufpreis von 280000 Rthl. Weitere Forderungen: 20000 Rthl Lupman Meyr, 12000 Rthl zum 7. August. Bittet um Rat zu seiner Rettung.'
'109': 'Dringende Warnung vor dem "Wildegansch", der sich in Berlin als Beauftragter des Fürsten ausgibt und die angebliche Geldnegoziation mit An und Schlabrendorff nur zum eigenen Vorteil erfunden habe; eine Entscheidung sei vor zwei Monaten nicht zu erwarten. Ferner: v. Bukowiecki biete für Betsche nur 2400 Rthl Jahrespacht. Der Jude Asch und Gad wollen wegen des dem Schlabrendorff ausgestellten Wechsels über 11000 gegen Triebenfeld Exekution erwirken; er bittet, den Fürsten zu unterrichten, ehe der Gerichtsvollzieher zu seiner Frau komme.'
'110': Bericht über die Erledigung der Urkundensache zu den geistlichen Gütern; die Dokumente sollen bei längerem Aufenthalt mit erster Post nach Breslau abgehen. Anfangs seien wegen der im ersten Ministerialbericht angegebenen Werte 2½fache Gebühren verlangt worden, nun aber nur 240 Fr und etwa 200 Rthl zu zahlen; das Geld habe Triebenfeld beim Geheimen Oberrevisionsrath Mathias geliehen, der es binnen 14 Tagen zurückfordert. Bitte um eiligen Zahlungsbefehl, da eigene Einnahmen erst zu Johanni erfolgen; über die andere Angelegenheit folge Nachricht mit nächster Post.
'111': Klage, daß die Summe zur Einlösung des Documents nicht aufzubringen war, weil Wildegansch allen Credit in Berlin zerstöre; dem vermittelnden Freunde seien 300 Rück als Handgeld gegeben, mehr könne aus dem Reisegeld nicht entnommen werden, ohne liegenzubleiben. Bitte um gnädige Anweisung auf die 240 f., etwa 200 Rthl Courant, zur Einlösung des Documents, sonst drohe Übles. Ob. v. K. und v. Z. gelten als wahre Freunde; wegen des schlimmen Geredes wolle er sich zurückhalten und kalt zeigen.
'112': 'Nachschrift: Der Hofrath Wünster habe mitgeteilt, daß der K. v. Wildegansch und der Jude Heymann in der fürstlichen Sache nichts bewirkt hätten; wegen des von Triebenfeld für den Fürsten unterschriebenen Wechsels über 11000 Rthl sei bereits Urtheil ergangen, ihm drohe Arrest, der Amtsbüttel Rudolph habe schon mehrfach nach ihm gefragt. Bitte um schleunige Maßregeln zur Abwendung von Schande und Arrest; Vorschlag, Graf Schlabrendorff zur Rücknahme des Wechsels aus Judenhand und zur Prolongation zu bewegen. Klage über Prinz George, der Güter für 750000 Rthl verkauft habe.'
'113': 'Dringende Bitte, die Angelegenheit der 11000 Rthl mit Asch und Gad endlich zu bereinigen: trotz fürstlicher Versicherung liegt der Arrest weiter gegen Triebenfeld, und man droht, ihn sogleich verhaften zu lassen, falls die zugesagten 4000 Rthl nicht gezahlt werden. Prinz George erklärt sich zu nichts und verschleppt die Sache; Wildegensch lasse Aufschub bis Johanni anbieten, was keine Rettung sei. Triebenfeld sieht Ehre, Freiheit und Leben bedroht.'
'114': Klage über einen Gegner, der dem Fürsten viele Schwierigkeiten gemacht habe und nun, da nichts mehr herauszupressen sei, abschließen wolle; der günstige Augenblick solle genutzt werden, damit der Adressat nicht länger beschwert bleibe, wobei auch der Gruß v. Schlabrendorffs erwähnt wird. Die eigene Sache stehe weder gut noch schlecht; von L. Asch sei Antwort samt Erklärung erwartet, die Erledigung binnen weniger Tage zugesagt. Der Schreiber berichtet von zunehmender Besserung seiner Gesundheit und dankt für die Anteilnahme. Text stellenweise unleserlich.
'115': 'Entschuldigt sein Ausbleiben zur Mittagstafel: der Pächter aus Schwammen habe um sofortiges Erscheinen gebeten, da die Bauern ihm den Gehorsam und die Dienste verweigerten. Berichtet vom Gespräch mit dem Herrn Minister über Schlabrendorff, der dem Fürsten dessen Schweigen verüble; Schlabrendorff sei zum 15. d. M. hierher beschieden, um in der Quist''schen Sache zu sprechen, und solle alle Klage zurückziehen, da man ihn scharf beobachte und der Minister ihn dann nicht schützen könne. Asch reise übermorgen nach Stolze zum Grafen; Triebenfeld gehe morgen nach Landen, sei am 15. zurück und wolle dann auch Hirsch einspannen.'
'116': Entschuldigt sein Fernbleiben wegen Krankheit und bittet um klare Weisung zum Verkauf der Güter, da beim Verhandeln mit den Polen kein einheitlicher Plan bestehe. Beklagt das Gerede, auf Trąbczin ruhten 150000 Rthl Schulden, die Walichnowski neben 56000 Rthl und einem Canon von 5000 Rthl jährlich übernehmen solle; dies schade der fürstlichen Ehre. Schlägt vor, von Walichnowski 60000 bis 80000 Rthl Erbkaufgeld und jährlich 4 bis 5000 Rthl Erbzins zu fordern, festen Tones und ohne Bestechung, wie in Dombrowchen bewährt. Bittet, die Notiz niemandem zu zeigen.
'117': 'Bericht über die Abwicklung der 30000 Rthl mit Herrn Weigel: die Bank diskontiert erst, wenn v. Grotowski die jura cessa erteilt hat; Hofrath Ebersbach hat den Cessionsinstrument-Entwurf gefertigt, den Grotowski gerichtlich vollziehen soll. Der Fürst möge Weigels beigelegten Brief unter fliegendem Siegel per Estafette an Grotowski senden, ebenso ein Schreiben an dessen Mandatar in Kalisch, damit die Subhastation vor dem 22. entfällt. Ferner Nachricht vom plötzlichen Tod des Capitain v. Müllern und Morgenbeßers, Mahnung zur Schonung der Gesundheit, Nelsons Erfolg vor Toulon, Sidney Smith vor Vliesingen sowie Absprachen mit Bernhardi und M. Stösseln.'
118a: 'Bericht über Kaufinteressenten: Ein Kunckel erscheint mit zwei Kolonisten aus Olesnica, die 1500 Rthl zahlen und einen Contract wollen; Triebenfeld hält sie für unsichere Speculanten, die die 17000 Rthl zu Martini und Johanni nicht aufbringen und endlose Processe verursachen würden. Kunckel habe zudem Auftrag des Oberamtmanns Nerlich, Trąbczin oder Zagorow in Erbpacht zu erwerben, 80000 Rthl bar binnen eines Jahres. Walichnowski fragt nach Bedingungen, Urbanowski verlangt die Trąbcziner Taxe; Triebenfeld erbittet Weisung.'
118b: 'Bericht über die Verhandlungen Homuths mit der Gräfin Schlabrendorff: Sie räumt für die 50000 Rthl Frist bis Weihnachten, genauer bis zum 1. Januar 1805, ein; eine längere Stundung sei nicht zu erlangen, da sie keine Zinsen erhalte. Da bis dahin keine Zinsen zu zahlen seien, empfiehlt Triebenfeld Annahme, ein Gewinn von 2500 Rthl. Homuth erbittet die Übereinkunft zur Ausfertigung für die Gräfin und will dabei die alten Wechsel herausbekommen. Der Conducteur Cabanis ist abgereist und nimmt eine Bauernfuhre für 4 bis 5 Rthl, da hiesige Kutscher 20 Rthl forderten.'
118c: Die Gräfin Schlabrendorff will mit den 50000 Rthl bis Weihnachten, genauer bis zum 1. Januar 1805, zuwarten; eine längere Frist hat Homuth nicht erwirken können, da sie keine Zinsen erhält und den Verlust beklagt. Triebenfeld rät zur Annahme, weil bis dahin keine Zinsen fällig seien, 2500 Rthl gewonnen würden und genug Geld einkomme. Homuth erbittet die Einwilligung zur Ausfertigung für die Gräfin und will die alten Wechsel herausbekommen. Der Conducteur Cabanis ist abgereist und mietet auf dem Lande ein Bauernfuhrwerk für 4 bis 5 Rthl statt 20 Rthl.
'119': 'Uminski hält den Preis für die Kaemen''schen Güter für zu hoch und erbittet nur ein Empfehlungsschreiben an den Administrator zur Besichtigung; Triebenfeld hält dies für Spielerei, da Broniszewski noch auf den Gütern sitzt. Der Bote aus Zagorow bringt Glenck''s Tabelle: etwa 31000 Morgen Dominialland zur Dismembration, dazu Rustical- und Waldland. Vorschlag, den Landmesser Cabanis (der Petsche bei Strehlen an Hussiten für 25000 z. aufteilte) 500 Wirthe anwerben zu lassen; die Rapacki''schen Käufer verlangen zu lange Zahlungsfristen. Schöneich plane Gleiches für Mstow.'
'120': Cabanis bringt aus Hussenich, Rentsch und Umgebung die Nachricht, daß die Hussiten kaufwillig sind; da die Zahl der Hufen ihre Kräfte übersteigt, haben sie Eilboten an ihre mährischen Glaubensbrüder gesandt. Der Preis von 300 Rthl je Hufe und 15 Rthl jährlicher Zins gilt als billig; binnen vierzehn Tagen will man in corpore erscheinen. Die Gräfin Schlabrendorff verweigert die Herausgabe des Instruments vor Zahlung der weiteren 50; Hornuth erwirkt Prolongation bis 1. Januar 1805. Bitte um einige Thaler für die notleidende, kranke Mutter Kunckels.
'122': Übersendung eines erst am Morgen erhaltenen Zettels, der versehentlich in Triebenfelds alter Wohnung liegengeblieben war; Herr Homuth habe deshalb erneut nachgefragt und bitte dringend um baldige Berichtigung der 166 Rthl 16 g, damit er dem Boten den Empfang anzeigen könne. Cabanis reise eben mit der Post nach Hussinietz ab, wovon Triebenfeld schnellsten und glücklichsten Erfolg erwartet. Aus Berlin und Franckfurth sei an diesem Tage keine Nachricht eingegangen.
'123': Übersendet ein spät am Abend durch Estafette eingegangenes Schreiben Kunckels und bittet um Weisung für sein weiteres Verhalten. Ein Vergleich mit von Otocki sei nötig; würde dieser sich gütlich mit 1500 oder 2000 Rthl begnügen, wäre dies vorteilhaft, doch bleibe zu entscheiden, ob Kunckel volle Vollmacht zum Abschluß erhalte. Warnt vor dem Gegeneinander Kunckels und Jentschs (Heftigkeit des einen, Intrigen des anderen) und rät, beide anzuweisen und in Schranken zu halten. Glenck erschien nicht wieder und ließ die Kontopper Rechnungen zurück.
'124': 'Übersendung des Antwortentwurfs an Kunckel mit der Bitte, ihn auf Übereinstimmung mit dem fürstlichen Willen zu prüfen; zugleich Bitte, die beiden Schreiben von anderer Hand ins Reine schreiben zu lassen, da der Verfasser wie zerschlagen sei: seine Frau werde heute zu Grabe getragen, er habe sich mit den Kindern zu seinem Schwager zurückgezogen. Ausführlichere Darlegung in dem beigefügten eigenen Brief wird angekündigt. Eine Karte von Kopoyno, Skokum und Swiątniki liege bei ihm vor.'
'125': Meldung, daß die Leute aus Olesnica mit den Geldern eingetroffen sind und um 4 Uhr bei dem Fürsten erscheinen wollen. Triebenfeld hat mit ihnen bereits etwas verhandelt und will darüber am Nachmittag mündlich Bericht erstatten; er hofft, das Ergebnis werde dem Fürsten nicht mißfallen. Kurzes Billett ohne Angabe von Summen oder näheren Bedingungen der Abrede.
'126': Cabanis ist von den Hussiten zurückgekehrt; die Leute seien höchst zufrieden, wollten eilends zurückkehren, ihre Glaubensbrüder versammeln und alles binnen 14 Tagen abschließen. Cabanis bringe viele Nachrichten mit, über die Triebenfeld mündlich berichten müsse; dringend nötig sei, daß sogleich jemand hinreise, um die Sache in den besten Gang zu bringen. Triebenfeld verhandelt zugleich mit den Leuten aus Olesnica und bittet den Fürsten, nach der Parade für eine Viertelstunde zu ihm zu kommen, um die Leute selbst zu hören und Befehle zu erteilen.
'127': 'Klage über die eigene erschöpfte Kasse: Da der Fürst nach beiliegendem Nachweis keinen Groschen Zinsen berichtigt hat, muß Triebenfeld die unter seiner Bürgschaft für das Inventarium versprochenen 700 Rthl, dazu Zinsen seit 1799 von 175 sowie 35 Rthl Prozeßkosten, insgesamt 910 Rthl zahlen; erst am Vortag habe er in der Nudnich-Sache 1537 Rthl 12 gg entrichtet. Wildegans und Heyman Pincus versprächen Berichtigung, doch drohe Execution; er bittet um 900 Rthl und stellt zu Johannis wieder Holzgelder in Aussicht.'
'128': 'Bericht über die verworrenen Verhältnisse: elf Prozesse sind prorogiert und sollen möglichst durch Vergleich beendet werden; die Pächter fordern hohe Abzugsgelder, mit Otcibi ist ein Abkommen über 3000 Rthl Abzugsgeld, 2000 Rthl Caution und 1000 Rthl für Saatkorn und Wohnungskosten geschlossen, mit Flörten und Rybbel drohen Forderungen bis 11600 Rthl, weshalb Execution und Sequestration auf Pächterrechnung erwirkt wurden; von Rudnicki soll zu Johanni abziehen. Der eifrige Landrath verschaffte Käufer für 87 Hufen; Glenck verspottet den Olesnices-Contract und betreibt eigene Geldgeschäfte.'
'129': Klagt über ausbleibende Nachrichten aus Berlin und Frankfurt und wachsende Unruhe; bittet um Mitteilung tröstlicher Nachrichten von Glenck. Wegen Kolzig hatte er Hoffnung, doch Amelang antwortet nicht auf den vorgelegten Plan; daher sei der Verkauf von Kontop eifrig zu betreiben, statt ihn zu untersagen. Zu diesem Zweck hat er den Pächter Bernhardi nach Breslau kommen lassen und ihn angewiesen, die Güter jedem Kaufliebhaber wahrheitsgemäß und günstig darzustellen und Rudolf und Stubenrauch gut aufzunehmen, um Verhinderung des Verkaufs oder Bestechung vorzubeugen.
'130': 'Klage über den unverrichteten Stand der Geschäfte: Glenck ist abgereist, Leixner abwesend, keiner traut dem anderen. Mit M Bernhard ist verabredet, daß die Güter auf den Namen des Fürsten bleiben und Leixner Kaemen übernimmt, auf fürstlichen oder Triebenfelds Namen. Leixner, in Bedrängnis und von Graf Schulemburg bedrängt, verzichtet auf das Incolat und begnügt sich mit Triebenfelds Namensleihe. Ein Expreßbote ist Gleich nachgesandt; Triebenfeld reist nach Berlin, will Sonnabend hier und dann in Bersch abschließen.'
'131': 'Bericht über ergebnislose Bemühungen in Berlin: die dort gemachten Aussichten seien Lügen, kein Heller sei von dieser Seite zu erwarten. Triebenfeld reist am 20. nach Frankfurth zurück, will mit Leixner wegen Kaemen abschließen und die für Koschentin nötigen Gelder beschaffen; in Berlin sucht er Koltzig oder das Darlehen zu erlangen, doch der König gebe wegen des drohenden Krieges mit Russland kein Geld. In der Broniewalischen Sache soll der Arrest bei nachgewiesenen causae arresti erfolgen, doch fehlen 2000 Rthl in f. Dor; Kritik an Mell. und Glenck.'
'132': 'Verärgert über das ergebnislose Warten auf Herrn Glenck bricht Triebenfeld nach Breslau auf; in Betsche hätten die Käufer binnen kurzem 30000 Mk gewonnen, da die Untertanen sich freikauften, und bei Kaemen drohe Ähnliches zum Schaden des Fürsten. Director Stubenrauch möge die Güter kaufen: bei Dismembration verbürgt er 10000, ja 12000 Rthl jährliche Revenüen, also 250000 bis 300000 Rthl Wert, während der Fürst mit 180000 Rthl zufrieden wäre; erbetteten Expressboten, Tantième, Vorsicht gegenüber dem Cabinets-Rath, dazu Koltzig und Indemnisationssache.'
'133': 'Klage über die zerrütteten Geschäfte: Glenck bleibt in Frankfurt aus, Leixner war heimlich in Betsche, will vom Contract zurücktreten, verlangt Eviktionsgarantie und Incolat und lehnt Kaemen über 160000 Rthl ab; der Societätscontract mit Glenck (1/3 Gewinn und ein Vorwerk für Baron von Brandenstein) soll aufgehoben werden. Mit der Ordenskammer, dem Harlem-Kauf und dem Darlehn von 100000 Rthl aus dem Invalidenfonds ist nichts erreicht; Rückreise nach Berlin zu Amelang und dem alten Stubenrauch. Beyme rieth dem König, die Entschädigung durch Erlaß der über 200000 Rthl Schulden zu leisten; Köckritz grüßt und erwartet im Kriegsfall das Commando für den Fürsten; Haugwitz und die russisch-österreichische Allianz.'
'134': 'Bericht über das Scheitern des von Baurath Glenck zugesagten Darlehns aus dem Invalidenfonds: die Otto''sche Taxe sei durch Hofrath Lengnich für 25 Fr. neu gefertigt und auf 78000 Rthl herabgesetzt worden, was Verkauf und Kreditaufnahme, auch in Frankfurth bei Leixner, vereitle; Klage über Glencks Verbindungen mit Dietz, Werner, dem Juden Borchart und Capitain Lange samt drohenden Prozessen. Ferner Amelangs Unterredung mit Beyme: statt südpreußischer Güter oder Geld Schenkung der Königsschulden nebst Curländer Zinsen als dédommagement für Brzyzer; vorgeschlagen die Kolziger Güter Schlabrendorffs. Versuche bei Stubenrauch, Rietz, Prinz Ferdinand und Pliehen; 120000 Rthl auf Kontop und Zagorow.'
'135': 'Konvolut von vier Schriftstücken zum Verkauf der südpreußischen Güter Kaemen und Kolno: Kammerrath Werner verlangt vom Kammerdirektor die ihm vom Fürsten Friedrich Ludwig zu Hohenlohe unter Siegel zugesagten 2 pro Cent Provision aus den ersten Kaufgeldern, da er den Käufer (Hahn) nachgewiesen habe, fürchtet Schikanen des Generalbevollmächtigten Bauraths Glenck und erwähnt seinen Verlust von 30000 Rthl beim Erbgrafen v. Stolberg; beigefügt die Zusage vom 17. Xbr. 1803, Glencks Anfrage wegen 60000 Rthl zweiter Hypothek hinter 100000 Rthl (Werth 200000 Rthl) sowie Stubenrauchs ablehnende Rücksendung der Papiere.'
'136': Glückwunsch zum Verkauf von Kolno und Kaemen; die 76000 Rthl sollen nun in harter Münze hier gezahlt und nach Bernhardis Anweisung in Berlin an das Hüttendepartement abgeführt werden, wozu die neu beglaubigte Otto'sche Taxe half; Koschentin sei erledigt, die Broniszewski-Sache und Kölzig (Confiscation, Großkanzler, Glogau, Schlabrendorff) werden weiter betrieben. Berichtet ferner über Zagorowo, Lichnowski (130000 Rthl), Abrechnung mit Radzimski auf Szetlewek, Floricke und Otocki in Trąbczin, Erbpacht-Pläne mit Mennoniten (400 Hufen, ca. 240000 Rthl), Voß' Dismembrations-Frist zum 1. Juli sowie heftige Klagen über Glenck, dessen Vollmacht fehle.
'137': Klage über Herrn Wiener, Meyer Bernhard und Konsorten, die Zahlungen von Berlin nach Frankfurth verschleppten und nun 76000 Rthl samt etwa 20000 Rthl in Bankobligationen per Estafette zusagen, während sie 30000 Rthl mit Verweis auf den Rückkauf von Betsch zurückhalten; Meyer Bernhard verspricht weitere 10000 Rthl. Trotz fehlerhafter Obligation Wansters wurde in Berlin Geld erlangt, einiges in Wechseln für Trąbczin. Die Deposition der Brunieweischen Gelder ist über den Großkanzler und Gen. Köckritz durchgesetzt; der König verspricht statt Geld gute Güter in Erbpacht. Fürstin Sacken kündigte durch Cosmar 30000 Rthl auf Koschentin.
'138': 'Bericht in der Sache v. Broniewski: der erneute erste Versuch der Deposition blieb fruchtlos, wie die beigefügte Resolution vom 25. Juni zeigt. Nach Vorstellungen um Rescission und gemäß der Mitteilung des Herrn v. Triebenfeld, der Fürst werde nötigenfalls eine Sicherheit hinterlegen, um die Güter in Besitz zu nehmen, wurde eine solche von 10000 Rthl angeboten. Daraufhin sind Deposition sowie die Räumung von Kolno und Kaemen der Regierung zu Posen aufgetragen worden. Verfasser: Amelang.'
'139': 'Bericht über das Scheitern aller Versuche, den berüchtigten Vergleich mit Broniewski umzustoßen: Glenck habe ihn am 6. zur Approbation eingereicht und beschleunigt, obwohl das gerichtliche Rescript wegen der Deposition bereits vorlag und der fürstliche Protest am 8. eintraf. Metzer und Wünster schieben die Schuld einander zu; bei erfolgter Deposition wäre Broniewski verloren gewesen. Der Liquidationsprozeß werde 6 bis 8 Jahre dauern. Triebenfeld will nach Betsch reisen, Bornstädt entsetzen und Braniewehrs Sicherheit prüfen.'
'140': 'Bericht über die gefährdete Veräußerung von Betsche: Glenck habe die Gemeinden zum Rücktritt vom Kaufvertrag aufgestachelt, den mit Leixner geschlossenen Contract über Klein, einen Verwandten des Rochlitz, cediert und leugne dies; Justizbürgermeister Metzig und v. Bornstädt (Beilagen A-F) bestätigten die Umtriebe. Gefordert werden fürstliche Befehle per Estafette an Glenck und Lieut. v. Brandenstein zur Herausgabe und gerichtlichen Cassation beider Contracte sowie des Societätsvertrags. Meyer Bernhard verzögere die Zahlung der 66000 Rthl in Posen; Bornstädt berufe sich auf zugesagte 1000 Fried:d''or bei Verkauf für 200000 Rthl; der Wald sei ruiniert.'
'141': 'Krankheitsmeldung wegen eines Gallenfiebers und Bericht über die verwickelte Bruniewski-Sache: der geschlossene Compromiß sei fehlerhaft und ohne Sicherheit, zu seiner Änderung fehle Bruniewskis Frau, die in Kollo oder Warschau vermutet wird. Wünster habe im Einverständnis mit Bruniewski und Guderian den nachteiligen Vergleich abgefaßt und Glenck aufgedrängt; der Jude M Bernhard und Simon wollten statt 13000 Rthl nur 6000 Rthl zahlen. Metzer soll zur Deposition der 66000 Rthl gedrängt, die Tradition der Güter zugestanden werden; angestrebt sind 30000 Rthl aus Betsche und 13000 Rthl von Posen.'
'142': Wegen anhaltender Krankheit ans Bett und Sofa gefesselt, kann Triebenfeld nicht persönlich vortragen. Nach beiliegendem Schreiben will Bornstädt abreisen, vermutlich weil sein Geld aufgezehrt ist; die mit ihm geschlossenen Pacht- und Vergleichsverträge müssten vor der Abreise erledigt werden. Er bittet den Fürsten, Glenck die Übersendung der Contracte, Vergleiche und Rechnungen zu befehlen und schriftlich zuzusagen, Bornstädt aus besonderer Gnade 5000 Rthl zu geben; nach Brauns Meinung stünden ihm 7500 Rthl nebst dem im Betscher Kaufgeschäft versprochenen Honorar zu.
'143': Amelang bestätigt den Empfang der fürstlichen Mitteilung über den Ausgang der Entschädigungssache und äußert seine Befriedigung darüber, dass Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, sich mit der Art der Erledigung des Geschäfts zufrieden erklärt; er wünscht, dass die Gnade Seiner Majestät des Königs gegenüber dem Fürsten dessen Verdiensten um den Staat entspreche. Keine Angaben zu Summen, Gütern oder Einzelheiten der Entschädigung; ein reines Höflichkeits- und Ergebenheitsschreiben.
'144': Bestätigt den Empfang des fürstlichen Befehls vom 31. des vorigen Monats und kündigt an, am folgenden Morgen zum Grafen von Schulenburg zu gehen, ihm das an ihn gerichtete Schreiben zu übergeben und seine Erklärung abzuwarten; über das Ergebnis der Unterredung werde mit der nächsten Post berichtet. Unterzeichnet von Amelang, nicht von Triebenfeld; das Stück fällt mit 1834 aus dem Zeitraum der übrigen Briefe heraus.
'145': 'Bericht über einen Wagenbruch auf der Reise; nach Kalisch gleichwohl unversehrt gelangt, verzögert die Reparatur die Weiterreise. Hofrath Grimm liegt schwer krank, will alles für von Radzinski ausarbeiten, benötigt dazu aber die Contracte. Honrichs zahlt die 4000 Rthl nicht, obwohl alles quittiert und mit Zustimmung des (Pupillen-)Collegiums geordnet ist; Grimm will gerichtlich vorgehen, es fehlen Contract und Vollmacht, beides bei Nochlitz. Bitte, den Contract eilig von Köckritz zurückzufordern und mit Vollmacht an Grimm zu senden. In Trąbczin ergehen plangegenläufige Anordnungen: 100 Scheffel Korn verliehen, Felder besät.'
'146': Nach beiliegendem Schreiben des Mennoniten-Ältesten Pankratz wollen die Mennoniten Zagorow und Trąbczyn insgesamt kaufen und unter sich teilen; Triebenfeld reist deshalb nach Lunau. Für die Dismembration fehlen Contracte (Müller, Swięcier Hauländer); der mit Baurath Glenck am 5. September geschlossene Contract über 300 Morgen und der Verkauf der Komorniks an v. Małachowski behindern die Taxationscommission, Glenck soll schriftliche Reverse ausstellen. Klagen über Leopold (368 Rthl), Wollenhaupt und Landrath v. Blomberg. Gegen die Execution von 6500 Rthl wegen Przespolewski wurden Einwendungen erhoben.
'147': 'Bericht über die überaus mühsame Reise nach West- und Ostpreußen: die Mennoniten wollen am 19. Dezember nach Breslau kommen und dort den Contract schließen, verlangen aber Einbeziehung der Propinationsrechte; ersatzweise sind die Landsberger und Oderbrucher Interessenten geladen. Eine Parzellierung lehnt Triebenfeld ab. Die Taxation der Güter stockt aus Mangel an Daten. Beschwerde über Glenck und Kochlitz, deren Vorwürfe und eigenmächtige Dispositionen ihn zum Rücktritt drängen; Justizbürgermeister Schema erbittet Anweisung wegen der Wrąbczin''schen Ländereien; die Voigtey sei auf etwa 11000 Rthl zu taxieren, das Dominium Wegberin bei 53 Morgen.'
'148': 'Berichtigung der von Glenck vorgelegten Tableaux über die Revenüen der südpreußischen Güter: Während dort Swięcia mit 1800 Rthl jährlichen Zinsen und 10000 Rthl Capital angesetzt sei, ergebe die heute abgeschlossene Revision der Taxatoren nur 918 Rthl Zinsen, mithin bei 3792 Morgen einen Wert von bloß 28360 Rthl und einen offenbaren Verlust von 47340 Rthl; zusammen mit dem Olesnicer Verlust von 48000 Rthl belaufe sich der Schaden des Fürsten auf 95340 Rthl. Das schöne Gut sei verschleudert.'
'149': 'Bericht über den Fortgang der Parzellenverkäufe: die Oder- und Nezzbruch-Kolonisten werden erwartet, abgelegene Randstücke der Swięce-Parzellen sind vorteilhaft verkauft, keine Hufe soll unter 600 Rthl (Grundgeld und Zinsen) abgegeben werden; die Taxe der Zagorow-Güter dürfte über 400000 Rthl ergeben, wovon in Berlin Geld für Schlabrendorff, Legnowelii und andere drängende Creditoren aufzunehmen sei. Ärger mit Glenck und den Olesnice-Erbpächtern hat Triebenfeld drei Tage ans Bett gefesselt. Die Wrgbin-Untertanen verweigern Zins, klagen über erzwungene Dienste in Zagorowo und den geplanten Verkauf der Voigtey an von Marowecke für 15000 Rthl; verwiesen an Justizbürgermeister Schenck.'
'150': 'Der Landesälteste v. Lichnowski fordert für anderthalb Jahre, vom 4. Mai 1803 bis 4. Nov. 1804, rückständige Zinsen von 5572 Rthl 12 Groschen; er hatte auf Zahlung aus der Administration von Trąbczyn gehofft und ein Mandat der Kalischer Regierung erwirkt, das Zahlung binnen 14 Tagen auferlegte, doch nach fruchtlosem Ablauf droht er mit dem Antrag auf Sequestration, will jedoch Verdruß ersparen und erwartet Befriedigung zu Weihnachten. Antwort vom 27. Nov. 1804: die Pächter hätten nicht gezahlt, Herr v. Triebenfeld bringe alles in Ordnung.'
'151': 'Antwort auf zwei fürstliche Schreiben: Freude über v. Nothardts Direktorenstelle, Unruhe wegen der Sache v. Harlem/Kriegsrath Nöldichen und v. Voss. Mennoniten sind in Trąbczin und wollen beide Güter zusammen kaufen; hoher Schnee verhindert die Vermessung. 100 Hufen Grądzin- und Drzewitzer Forst sollen für 3000 Rthl Zins (60000 Rthl Kapital) vergeben werden, kein Morgen unter 1 Rthl. Erträge bleiben weit hinter dem Anschlag (Suvigria 918 statt 1800, Wrąbczyn 1123 statt 1500 Rthl); Lichnowski hat Arrest auf die Olesnicer Zahlung gelegt, so daß nur 6000 Rthl fließen; zu Weihnachten etwa 8000 Rthl zu erwarten, Kapitalien für die Schlabrendorff und Lichnowski aus Berlin zu holen.'
'152': Ankündigung, den Freipaß für Hohenlohe-Weine sowie bald die 25000 Rthl zu übersenden. Die von Herrn Glenck eingetragenen Schulden lasten nicht nur auf Swiecia und Olesnica, sondern auf allen Ortschaften der Zagorower Güter und erschweren die Dismembration; Triebenfeld will das Hindernis beseitigen. Der Tod Nothardts, der 28000 Rthl Schulden hinterläßt, und die Ankunft des Herrn v. Goldbeck als Präsident in Kalisch seien ungünstig. Klage über B. R. Bernhardi, der das zugesagte Geld verweigerte; Mittel seien nun in Berlin beschafft. Nachrichten über das Fest des Herrn v. Voss, dessen baldigen Rücktritt und die Taufe des neugeborenen Prinzen.
'153': Klage über die stockende Beschaffung der 25000 Rthl, da der nunmehrige Bankpräsident von Stein alles Diskontieren erneut verboten habe. Das Kapital von 140000 Rthl sei zwar vom Invalidenfonds oder vom Potsdamer Waisenhaus zu erlangen, doch nur ohne Ratenzahlung und erst nach Erledigung aller Formalitäten; daher versuche er mit Amelang, die 25000 Rthl vorläufig anderweitig aufzubringen. Handel und Wandel lägen still, Witwenkasse und Pupillen-Collegium seien wegen drohender Bankrotte in Südpreußen bedrängt; der König frage nach dem Verbleib der dorthin gegebenen Millionen.
'154': 'Die Anleihe steht in bester Aussicht und liegt einem gutwilligen Mann zur Prüfung vor; die Aufträge vom 13. werden befolgt. Wollenhaupts Rede von einer Sequestration sei erlogen: Lichnowski habe den Arrest auf die Zinsen für 6 Wochen aufgehoben, der von Magnuski erwirkte nach Grimms Versicherung ebenfalls; Przespolewski habe keine 30000 Rthl zu fordern, die Dębinska nur neuen Arrest gegen Auszahlung an Magnuske gelegt. Blombergs Schreiben vom 25. Dezember enthalte ehrlose Forderungen und Drohungen gegen die Dismembration; Triebenfeld hat ihm scharf jede weitere Einmischung untersagt.'
'155': 'Bericht im Auftrag des Fürsten über eine persönliche Unterredung mit Justizrath Hohmuth wegen der Schlaberndorffschen Zahlung: die Gräfin lasse sich von einer Erneuerung des Prozesses nur durch schleunige Zahlung von 25000 Thl. noch vor dem nächsten Berliner Posttag abhalten; für die zweite Hälfte von 25000 Rthl. wolle Hohmuth dann Aufschub erwirken, von einer Obligation hierfür jedoch nichts hören. Ferner: Nurlich sei früh mit dem Wildschwein für Regierungsrath von Kreczinski über Kalisch nach Trąbczyn abgereist.'
'156': 'Bericht über die stockende Beschaffung der 25000 Rthl: die Papiere gelten als gut, doch verzögere sich die Zusage; eine kleinere Summe binde die Papiere ebenso. Zweimal habe der junge Eyſenhardt das Geschäft durchkreuzt, der 18000 Rthl fordere und dem Hofrath Meyer 20000 Rthl anweisen wolle; Triebenfeld verweigert dies wegen des unentschiedenen Janvelen-Prozesses und der auf Szetlewek eingetragenen 9000 Rthl, ebenso in der Sache Ziemecki. Klage über Bernhardi, der 3200 und 1200 Rthl statt an Professor Rhode an Liep Meyer angewiesen habe. Beigefügt Copie der Mahnung der Gräfin von Schlabrendorff wegen der Abfindungsgelder ihrer Kinder samt Prozessdrohung in Berlin; ferner General von Köckritz, Amelang und Freipass für 120 Eimer Wein.'
'157': Bericht über die durch Vermittlung des Generals v. Köckritz zugesicherte Anleihe aus dem Invalidenfonds, deren Zeitpunkt jedoch offen bleibt; Klage über die große Geldknappheit in Berlin, da Bank und Seehandlung nicht diskontieren und Bankiers 10 bis 12 Prozent geben. Giraud und Haupt sollen Zinsen erhalten, die Hypothek von 18000 Rthl auf vier Jahre cediert werden. Nach Bewilligung will Triebenfeld 60000 Rthl vorweg nehmen, 10000 Rthl hier abtragen und 50000 Rthl übersenden; Pochammer und Homuth sollen die Gräfin Schlabrendorff beruhigen.
'158': 'Durch Vermittlung des Generals v. Köckritz hat sich das Invalidendepartement bereit erklärt, 150000 Rthl zu geben, davon zunächst 50000 Rthl gegen Hypothek und Wechsel, die übrigen 100000 Rthl nach Revision der Taxen, auf 50 Jahre bei pünktlicher Zinszahlung. Kreditsperre in Südpreußen, Wucher der Berliner Bankiers (Liep: Meyer Wolff). Zahlung der geforderten 10000 Rthl zugesagt; Sache Tirard und Hauk erledigt, vom Prozeß wegen der Proxenetica abgeraten. Rechtfertigung in der Schlabrendorff-Sache gegen den fürstlichen Vorwurf des Wortbruchs; Mennoniten, Wöllenhaupt, Dismembration, Betschener Untertanen, Eysenhardt; 15000 Rthl könnten ins Reich gesandt werden.'
'159': Amelang hat nach mühsamen Verhandlungen endlich eine Anweisung auf die Gebrüder Kuh ausgestellt, noch vor Eingang der Gelder aus dem Invalidenfonds, die eigentlich in einer Negotiations-Obligation über 36755 Rthl 7 gg bestehen; diese wird unverzüglich übersandt, mit der Bitte, den Brief an die Herren Kuh sogleich bestellen zu lassen. Morgen sollen die Hangsche und die Eysenhardtsche Sache geordnet werden; danach Reise nach Kalisz wegen der Beschaffung der 100000 Rthl.
'160': 'Klage über die Schwerfälligkeit der Berliner Geschäfte: erst jetzt gebe der Invalidenfonds die Seehandlungs-Obligationen frei, so daß das Bankhaus Livi, das die Anweisung vorschußweise gab, befriedigt werden könne; die weiteren Gelder folgen nach Revision der Taxen durch die Kammer. Die Geschäftsleute nehmen 6 pC. Mit Gerard Einigung: 900 Rthl Zinsen gezahlt und Bürgschaft für pünktliche Zinszahlung gegen Stehenlassen des Capitals; mit Seebald zerschlagen, wodurch 1800 Rthl Proxeneticum erspart; mit Eysenhard Regelung bevorstehend. Abreise am 5. über Kontop und Glogau, wo zwei versäumte Termine Contumaz drohen. Die Olesnicer, auf 330 Morgen angewiesen, protestieren gegen die Waldzertrennung; die Nachkäufer zahlten 10000 Rthl und verpflichten sich zu weiteren 10000 Rthl nebst Zinsen.'
'161': Bestätigt den Eingang des fürstlichen Schreibens vom 3. des Monats, das dem Kriegs- und Forstrath von Triebenfeld unmittelbar vor dessen Abreise noch vorgelegt werden konnte und ihn wegen der bezeugten gnädigen Zufriedenheit erfreute. Die Zahlung der Assignation sei nach eingegangener Nachricht bei der Kasse bereits erfolgt; alles hänge nun an der Revision und Beschleunigung der Sache. Klagt über die schwankenden Grundsätze der Behörden, die jeden Vorgang um vier Wochen verzögerten, während er drei bis vier Monate zuvor kürzer erledigt worden wäre. Beruft sich für seinen Fleiß auf das Zeugnis des Herrn v. Truberger.
'162': 'Eine vor etwa 14 Tagen ergangene Verfügung des General-Finanz-Departements untersagt den Kammern, ohne dessen Vorwissen die Revision gerichtlicher Taxen anzuordnen, und hemmt die Geschäfte; Anlaß gaben Prinz George und Kriegsrath Korn, der seine eigenen Taxen revidieren sollte. Präsident v. Goldbeck hat um Erlaubnis nachgesucht, Amelang und Langen sollen in Berlin helfen; Minister Voss bleibt abzuwarten. Inzwischen werden Dismembrationspläne eingereicht. Die Olesnice-Sache ist durch v. Husslarzewski ans Patrimonialgericht zurückverwiesen. Erbeten: drei bronzierte Büsten und ein Lavoir für Goldbeck.'
'163': Bericht über den Rechtsstreit mit den Olesnicern (Termin zu Trąbczin, 10000 Rthl) und die erwartete Antwort aus Berlin; von Otocki will Szetlewek in Erbpacht nehmen (10000 Rthl Kaufgeld, 1500 Rthl Canon) sowie die Propination beider Güter pachten, Triebenfeld fordert 4000 statt 3000 Rthl, dazu 20-30 Hufen Wald und Acker; Ausbau der Bauern in Swincin; Honrichs zahlt nicht, der Contract soll annulliert und an Maierowitz (13000 Rthl) verkauft werden; Grimm bietet für Wittow nur 2000 Rthl; Klage gegen Szczucki und Ceizewski; Bitte um 1390 Rthl für den alten Lichnowski; Glenck soll die Punctation vorlegen; Klage über Kammerpräsident, Zerboni und eigene Krankheit.
'164': Klage über das Ausbleiben einer Resolution aus Berlin und über Amelangs Säumigkeit; die Chicanen bei der Revision der Taxen führt Triebenfeld auf Prinz George und die General Kalckreuthern zurück, notfalls will er den Landrath revidieren und attestiren lassen. Otochten verspricht 10000 Rthl nebst 2000 Rthl halbjähriger Propinationspacht anticipando, Meierowitz nach Abfindung Honrichs 20000 Rthl bar vor Johanni und 500 Rthl jährlichen Canon; Nachrichten zu Swięcia, Dismembration und Consens. Zum Oelsnicer Contract vom 22. Februar 1804 belastet er Glenck und Landrath v. Blomberg wegen verschwiegener Kammer-Verfügungen vom 23. Dezember 1803 und 24. Januar 1804; ferner Prussiemski-Vergleich im Kowaler Archiv, Brzyze, Ritlach und Floriche sowie eigene Krankheit.
'165': 'Übersendet weitere mit der reitenden Post von Glenck eingegangene Nachrichten sowie einen vom Fürsten nachträglich befohlenen Auszug in Abschrift, den der fürstliche Brief nicht mehr aufnehmen konnte und der Triebenfeld nützlich sein dürfte. Berichtet über das Befinden Seiner Durchlaucht: der Anfall sei aus der rechten Hand in den linken Fuß gezogen, der Schmerz aber über Nacht gewichen. Bergrath Bernhardi sei in Breslau eingetroffen, jedoch unpäßlich und daher noch nicht zur Aufwartung fähig. Wünsche für Triebenfelds Genesung.'
'166': Klage über die Kabalen des Finanzdepartements und die von Minister v. Voss veranlasste Inhibition des Dismembrationsgeschäfts; die von der Kammer entsandte Commission habe Triebenfelds sechs Rechtfertigungspunkte (Vorwissen der Provinzialbehörde, Schuldentilgung aus den Einkaufsgeldern, Fideicommiss der fürstlichen Familie) bestätigt, die Inhibition aufgehoben und 31000 Rthl reine Jahresrevenüen anerkannt; darauf seien 3 bis 400000 Rthl bei einer Bank zu erlangen, ferner stünden 180850 Rthl aus. Bericht über eigene Verluste von 19500 Rthl durch verlorene Prozesse, Hagelschlag in Schweinen und einen insolventen Pächter in Kontop; Reise dorthin nötig, Schenck soll die Gelder einnehmen.
'167': Im Auftrag des Fürsten, der eben mit dem alten Herrn zur Kirche fährt, übersendet Hahn ein beigeschlossenes Schreiben nebst Komplimenten; der Fürst hätte selbst geschrieben, wäre die Ordonnanz nicht binnen einer Stunde abgegangen. Der alte Fürst befinde sich für sein Alter sehr wohl und zeige seinem gnädigsten Herrn ausnehmend viel Anhänglichkeit. Höflichkeitswünsche für Triebenfelds Gesundheit; die Rückkehr nach Breslau ist unfehlbar auf den 25. festgesetzt.
'168': 'Fußhoher Schnee lähmt alle Arbeiten; dennoch sind die Contracte mit den alten Bauern und die Sicherung der Abgaben gerichtlich abgeschlossen, Verhandlungen über Szettleich und die Propinationsrechte mit v. Otocki laufen. Amelang verspricht das Anleihegeschäft; für die Dismembration fordert Klewitz Verkauf gegen Rente, Goldbecks Schreiben lässt Consens erwarten. Klage über P. Glenck, Wollenhaupt, die Olesnicer Burschen und Meyer, die Käufer abhalten. Forderungen: Winnicki-Erben 1300, Chwalowski 850, Sprengel 61, Wollenhaupt 800, zusammen 3011 Rthl; Wollenhaupt soll wegen 5 Hufen 400 Rthl zurückzahlen. Schenck verlangt 4 Hufen und eigene Actuariuswahl.'
'169': 'Minister v Voss habe jede Revision der Taxen untersagt; Triebenfeld wartet auf Amelangs Antwort, ob die Revision des Landraths genüge, und will sich sonst der Dismembration bedienen, zu der der Präsident einen Rath nach Zagorow wegen Trąbczin schickt. Abschluss mit Meierowitz: der Fürst erhält 4000 Rthl zurück und 500 Rthl Canon jährlich oder 10000 Rthl; Weigel, Schliefen und Honrichs zusammen 20000 Rthl Kaufgeld. Radzinski biete für Szetlewek 18000 Rthl Antrittsgeld, insgesamt 48000 Rthl, strittig bleibt die Hütung. Für Olesnica plant er Erbpacht, Propinationspacht 4000 Rthl jährlich, Rückstände 2000 Rthl, insgesamt 50000 Rthl, und erwartet bis 1. Juli 80000 Rthl. Ferner Goldstückers Cession der Glenckschen Hypothek an Oppenheimer, die Priorität verweigert; Klagen über Sprengel (761 Rthl) und Chwalowski (800 Rthl).'
'170': Bericht über einen im Auftrag des Fürsten unternommenen Ritt nach ErtheSchweiner, um mit Amtmann Käufer und Förster Bezold zu sprechen. Käufer war nach Breslau geritten; Bezold, dem der Auftrag eröffnet wurde, zeigte sich unbeeindruckt und fragte, wer ihn beim Fürsten angeschwärzt habe, versicherte aber, alle Kräfte für das herrschaftliche Interesse einzusetzen. Käufer, später in Breslau angetroffen, berief sich auf beste Zeugnisse glaubwürdiger Männer und seinen guten Namen und stellte sich einer Untersuchung. Zudem Hinweis auf einen Postversand.
'171': 'Nachricht über den Gesundheitszustand des Fürsten: das Fußleiden sei nahezu geheilt, die Schwellung geringfügig und schmerzlos, im Übrigen sei Seine Durchlaucht ganz wohlauf. Der verliehene Andreas-Orden habe Freude gemacht, mehr noch das verbindliche Betragen des Kaisers, von dem der Fürst ganz entzückt sei; auch in Breslau habe der Kaiser sich höchst schmeichelhaft über ihn geäußert. Das Regiment Hohenlohe sei durchmarschiert, der Fürst ihm entgegengeritten; für den folgenden Tag werde der Herzog von Weimar erwartet.'
'172': 'Bericht über das Dismembrationsgeschäft mit Eyster in Trąbczin: wegen zu geringen Zulaufs ist der Haupttermin auf den kommenden Montag verlegt, dann sollen die Contracte über alle Parzellen geschlossen werden. Präsident v. Goldbeck hat sich gegenüber Minister v. Voss für die Dismembration verwendet und die Fehler des Kriegsraths zur Höllen sowie die vom Landrath v. Blomberg erhaltenen Grundsätze vom 2. September eingeräumt; der Consens sei zu erwarten. Mona Kunckel wurde vom Landreuter in Haft gebracht; wegen Szetlewek steht ein schwerer Tag bevor. Die Winnich''schen Erben fordern weitere 1300 Rthl rückständige Vermessungskosten. 6 Tische und 30 Obstbäume gehen an den Präsidenten.'
'173': Bericht über die vergebliche Suche nach der zwischen Rochlitz und Honrichs geschlossenen Punctation über Wittow samt Vollmacht, die Gleich im Archiv Trąbczin vermutete; Tiel und Justizbürgermeister Schenck fanden nichts, weshalb der bereits gewonnene Vorteil von 14000 Rthl gefährdet sei. Weiter zu Amelang, den Dismembrationsplänen des Landraths, Blombergs Forderung von 1000 Rthl Vorschuß neben bereits gezahlten 900 Rthl, erwarteten Einnahmen von 350000 Rthl (Olesnica, Stetteweck, Anleihe), Propinationsverpachtung, Namen für neue Dörfer sowie dem beigefügten Dienstvertrag mit Schenck (800 Rthl Gehalt, 5 Hufen zu viel) und Grimms Entlassung.
'174': 'Kostenrechnung für die Justizverwaltung: die Sporteln des Actuarius, Fuhren und Beköstigung mit je rund 200 Rthl, dazu bei Übernahme des Rendantenpostens 600 Rthl Ersparnis, künftige Sporteln von mindestens 1200 Rthl, so daß der Justitiarius nichts koste. Bitte, Hahn nach Schweiner zu senden und dem Wirtschafter Käufer und dem Förster Pelzold fürstliches Interesse anzudeuten, da Triebenfelds eigene Güter verfallen. Mahnung wegen der 1390 dkg in Sachen Lichnowchi; Hufenverkauf in Trąbczin geplant; Rücksendung des Amelang-Briefs, 100000 und 50/2 Rthl. Nachrichten über russische Truppen, über 300000 Mann.'
'175': Übersendung zweier beigefügter Schriftstücke, eines im Original, eines in Copie, im Auftrag des Fürsten, der um Triebenfelds gutachtliche Äußerung bittet, was in diesen Angelegenheiten zu veranlassen sei. Besonders drängen die Forderungen von Girard und Haupt; der Fürst würde die erforderliche Summe sogleich zu deren Befriedigung anweisen, wäre seine durch die Reise stark erschöpfte Casse nicht knapp. Schreiber ist A. Huhn.
'176': Meldung vom Tode des regierenden Fürsten zu Hohenlohe-Neuenstein, der am 20. Juli noch im Thiergarten geschossen habe, am 24. erkrankt und am 27. früh nach 10 Uhr einem Schlagfluß erlegen sei. Gemäß Testament, das den eigenen Fürsten zum Alleinerben einsetzt, wurde in Oehringen und allen Orten dieser Linie sogleich Besitz genommen und der Huldigungseid geleistet; Eingriffe der Fürsten zu Langenburg und Kirchberg unter Berufung auf einen Theilungsvertrag wurden abgewiesen, ihre Patente abgenommen. Reise des Fürsten nach Franken im September nach Schluß der schlesischen Revuen; die südpreußischen Geschäfte bleiben Triebenfelds Ermessen überlassen.
'177': 'Wegen der Mobilmachung der Armee stockt alles: Klewiz mußte nach Südpreußen, Minister v. Voss ist in Havelberg, wird aber zurückbeordert; Geheimrath Reinbeck, Amelangs Jugendfreund, will die königliche Approbation der Dismembration binnen Tagen erwirken, wovon das Geldgeschäft abhängt. Beigefügt Verzeichnis der neuen Colonien zu Zagorowo, Drzewce, Kopojno und Trąbczyn (Klein Ingelfingen, Ludwigslust, Fürstenfelde u.a.), 21407 Morgen, 578 Wirthe. Eingegangen erst 7130 Rthl; Radzinski soll 6000 Rthl zahlen; fällig sind der Prusimska 20000, Weigel 23000, der Schlabrendorff 25000 Rthl; Anleihe beim Invalidenfonds erwogen; an Oberst v. Schlieben 2000 Rthl gezahlt. Dazu Nachrichten über Ruchel, Köckritz, Hardenberg und die Kriegslage.'
'178': 'Hahn entschuldigt sich, erst jetzt unter seinen Papieren mehrere von Seiner Durchlaucht unterzeichnete Chartes blanches gefunden zu haben, die für Triebenfeld bestimmt waren; in den letzten Nächten vor der Abreise habe er wegen der Ankunft des Kammerdirektors Graf von Behringen keine Ruhe gehabt, da alle Hohenlohischen Angelegenheiten noch vor der Reise erledigt werden mussten. Die übrigen Chartes blanches habe er den Fräulein von Triebenfeld übersandt. Nachschrift: Er sei noch vor der Abreise zum Expeditions-Rath bestellt worden.'
'179': Bericht aus Berlin über die genehmigte Dismembration und die erledigte Betscher Sache, über die von der Kalischer Kammer festgestellten Revenuen von 40260 Rthl (ohne Forst und Laudemien) sowie Schulden von 698000 Rthl; erbittet eilig eine Vollmacht in forma probante für den Hoffiskal Pochammer, der beim Cabinetsrath Tresorscheine zu 3 Prozent erwirken soll, samt Amortisationsplan. Glenck fordert 8000 Rthl für seine Ländereien; vor dem Consens für Santomist und dem Verkauf wird wegen Laudemien und drohender Prozesse gewarnt; die 30000 Rthl seien vorerst nicht zu beschaffen.
179a: 'Aktenkonvolut in vier Teilen: A. von der Kalischer Kriegs- und Domänenkammer bestätigte Ertragsübersicht der Herrschaften Zagorowo und Trąbczyn mit Prestationen, Erbpacht-Canon (Olesnica 2000, Radzinski/Szetlewek 1500), Pachten (Honrichs, Glinicki, Niedzewiecki, Tiel), Propination 4560, Mühlen und Ziegeleien, netto 40260 Rthl 14 g. 11 d. nebst 4900 Morgen Forst; B. Schuldenverzeichnis (Schlabrendorff, Weigel, Meyer Bernhard, Zerboni, Lichnowski 42000, Invalidenfonds 50000, Oppenheimer 110000) von 363933 Rthl, mit kurländischer Schuld 698784; C. Entwurf einer Immediatvorstellung Triebenfelds um 698000 Rthl in Tresorscheinen mit Amortisationsfonds von 34000 Rthl jährlich; D. Amortisationsplan und Vollmachtstext.'
'180': 'Antwort auf die fürstlichen Schreiben vom 8. und 18. April: Die Forderung des Juden Nathan Luipmann steht bereits in der übersandten Designation aller bekannten Passiva; alle Gläubiger seien zu befriedigen, vorerst aber nur hinzuhalten. Auf die Dismembrationsgelder von etwa 60000 Rthl sei nicht so schnell zu rechnen, daher weitere kurzfristige Anleihen nötig. Aus der abgeschlossenen Betschen Sache seien nach Abzug von 6000 Rthl für Eichaust 2000 Rthl, von Raven 1200 Rthl Laudemien zu erwarten, zusammen nur 3200 Rthl; die 30000 Rthl sollen aus Pacht, Zinsen und Einzugsgeldern aufgebracht werden. Klage über die Mandatarien; Pochammer werde am 11. in Steglitz über das Darlehn verhandeln, die Taxe gehe nochmals nach Kalisz.'
'182': Bestätigt den Eingang der Sendung vom 11. d. M. mit Schreiben an M. v. Haugwitz, Faudel, Glenck samt Klage und Gegenklage, rügt aber, daß Vollmacht für Hoffiscal Pochammer und die Blanquette fehlen, weshalb er seit Wochen untätig sei; bittet dringend um beides sowie gerichtlich attestierte Blanko-Vollmachten. An Cabinetsrath Beyme und Minister v. Voss habe er Pochammer als Bevollmächtigten empfohlen; Besuche bei Haugwitz und Graf v. Keller angekündigt. Klagt über Gratsenauer, der Titel, Zeugnis und Justizrath-Stellung begehre und unbrauchbar sei.
'183': 'Bericht über eine erschienene Schmähschrift unter dem Titel "Preußische Charaktere", in welcher der Fürst heftig angegriffen und auch Triebenfeld selbst genannt wird: der Fürst brauche viel Geld und habe im Kriegsrath v. Triebenfeld einen Geschäftsträger, der aber in den fürstlichen Sachen seinen eigenen Vortheil suche, sich bereichere und als Intrigant vom Bedienten zum Adligen aufgestiegen sei. Das übersandte Buch wurde von der französischen Behörde konfisziert; als Verfasser gelten Oberst Massenbach oder Professor Buchholz. Bei erwiesener Autorschaft Massenbachs stellt Triebenfeld seine Pistolen zur Verfügung; auch Rochritz werde übel behandelt.'
'184': 'Entschuldigt sich, daß die beiliegenden Blanquette bei der eiligen Abfertigung des Estafettenboten vergessen worden seien. Anschließend beklagt Hahn vertraulich seine Lage im Dienst großer Herren: die alten Ingelfinger Diener würden über den neueren vergessen, diese, so unverdient auch immer, glücklich gemacht, während man ihn am mageren Haken verschmachten lasse, indes andere sich vom Fett der Hohenlohischen Lande nährten. Er hoffe, sich aus eigener Kraft zu helfen, und vertraut auf Triebenfelds Verschwiegenheit.'
'185': 'Dringende Mahnung um die erbetenen Vollmachten und Blanquette: ohne die Vollmacht für den Hoffiscal Pochammer sowie zwei gerichtlich attestirte Vollmachten in blanco und einige Blanquette könne Triebenfeld in Berlin nichts bewirken; die Verzögerung erwecke Mistrauen bei den Verhandlungspartnern und verderbe die gute Sache. Zu den württembergischen Eingriffen in die fürstlichen Lande werde hier Beistand versprochen, doch rathe er, auch dort alle Wege zu betreiben. Nach Auskunft des Präsidenten v Höhneln leide der Fürst weiter an Gichtanfällen; Empfehlung einer Fontenelle, Aussicht auf persönliche Aufwartung in Öhringen.'
'186': Meldet, das Geschäft mit Herrn Weigel sei so gut wie abgeschlossen; dieser habe am Vorabend seine Zustimmung übersandt und wolle den Donnerstag bei Triebenfeld verbringen, der ihn stattdessen für den folgenden Tag zu sich hinausgebeten hat. Zur angemessenen Bewirtung des alten Herrn, allein zum Besten des Fürsten, erbittet Triebenfeld vom Adressaten je eine Flasche alten Rheinwein und guten alten süßen ungarischen Ausbruch sowie 6 Pfirsiche und 2 Trauben, nötigenfalls hinauszusenden.
'187': Vollmachten und Blanquette sind eingetroffen und sogleich genutzt; durch Vermittlung des Generals stellt der Großkanzler 90000 Rthl aus dem Justizfonds in Aussicht, womit die drängendsten Gläubiger Weigel, die Schlabrendorff und Lichnowski befriedigt werden sollen; Lichnowski erstattet 20000 Rthl auf eine Schweiner Hypothek, 10000 Rthl sind zu beschaffen, damit der Fürst 30000 Rthl erhält. Klage über die belastete Hypothek von Zagorow und Trąbczin, über Oppenheimers unerfüllte Zahlungen (113600 Rthl, nur 32000 geleistet) und über den Prozeß Meyer Bernhards; Reise über Betsche, Kalisz und Trąbczyn geplant, Rückkehr nach Berlin in achtzehn Tagen. Der von Wulffen waren 30000 Rthl auf Kontopp zugesprochen.
'188': 'Bericht über den erfolgreichen Berliner Aufenthalt: der Großkanzler bewillige aus dem Justizfonds etwa 176000 Rthl, womit die drängenden Gutsgläubiger, besonders H. Weigel, befriedigt würden; die bei Oppenheimer verpfändete Hypothek von 200000 Rthl solle wieder flottgemacht, Schlabrendorff durch 20000 Rthl auf eine Schweiner Hypothek vom Kriegsrath von Hellen (statt an Madame v. Wulffen zu Kontop) gedeckt werden. In Betsche sei alles geordnet, Eichaust quittiert, 4000 Rthl zum 6. Juli fällig. Für Trąbczyn werden rund 102000 Rthl Rückstände aufgelistet; Klage über Grattenauers Untätigkeit.'
'189': Hahn berichtet, daß ihn der Tod des Bergrathes Bernhardi zu einer Reise nach Oberschlesien veranlaßt habe, um die Angelegenheiten der Herrschaft gemeinschaftlich mit Inspector Kreinig und Forstmeister Reichmann zu ordnen, die er als rechtschaffene und einsichtige Geschäftsmänner kennt; in Koschentin liege nicht alles in bester Ordnung. Nach Abschluß dort wolle er über Breslau ins Reich zurück und erbittet die Erlaubnis, Triebenfeld zuvor in Trąbczyn seine Aufwartung zu machen; die Genehmigung des Fürsten sei erbeten. Er wünscht Antwort nach Koschentin; Herlich empfiehlt sich.
'190': 'Übersendet auf Befehl des Fürsten eine Carte blanche für die Antwort an Herrn von Rewek, zur beliebigen Ausfertigung durch Triebenfeld, sowie einen Auszug aus einem Schreiben B. R. Glencks vom 22. März 1806. Glenck schildert darin seinen Ruin durch die Wrąbczyner Gutssache: Verpfändung seiner Habe, Kleiderverkauf, kleine Anleihen, laute Gläubiger, für Schuldenzahlung hingegebenes Gehalt und die Verzögerung des Verkaufs von Wilhelmsruhe. Zur Beruhigung Glencks soll Triebenfeld das Schema zum Consens einsenden, damit Ribbek vom Kauf Wrąbczyns loskommt; andernfalls bleibe er seinem Untergang überlassen.'
'191': 'Bericht nach fünfwöchiger Krankheit (hitziges Gallenfieber) über die Geschäftsreise von Berlin über Betsche und Kalisch nach Trąbczyn: aufgeführt wird der Schuldenplan von zusammen 311000 Rthl (Oppenheimer 110000, Lichnowski 40000, Grotowski 20000, Haugt 18000, Prusimska 8000, Zerboni/Eysenhardt/Seehausen 24000), dazu 184000 Rthl Forderungen. Berichtet werden das Executionsdecret wegen der Prusimska (22000 Rthl), leere Kassen, neue Einjahrescontracte mit Honrichs (2800 Rthl), Zglinski und Kopojno (2500 Rthl), Prügelstrafen an Bauern, Tietz'' Pension zu 300 Rthl sowie Glencks Umtriebe und rückständige Zinsen über 400 Rthl.'
'192': Krankheitsbedingt seit fünf Wochen bettlägerig, berichtet Triebenfeld von der Beruhigung der aufgewiegelten Bauern und der Entfernung der Pächter; Glenck habe sich mit den Oleśnicaer Gegnern (Kramplich, Bergemann, Rybbeh) verbunden, Käufer abgeschreckt und ein Pasquill unter den Kolonisten verteilt. Weigel und Lichnowski sollen aus dem Justizfonds bezahlt werden und ihre Hypothek cedieren. Dem Fürsten stehen noch 190000 Rthl bar und 40000 an Revenuen zu; eingegangen sind 10000 Rthl aus Swięcia, 10000 aus Oleśnica, 12000 aus Szetlewek, 9000 für Grundstücke. Zum Urteil in Sachen Giese und zur Erbpacht kündigt er den Consens-Antrag an.
'193': 'Das fürstliche Schreiben traf erst nach zehn Tagen ein, wodurch der Reiseplan hinfällig wird; von einer Reise bis Parchwitz wird abgeraten, da sie Aufsehen erregt, stattdessen kündigt Triebenfeld noch im Monat einen Besuch in Schlawenschitz vor der Berliner Reise an. Nach Oberst Scharffenbergs Versicherung gäre es in Petersburg. Die polnischen Gütersachen ständen gut: Präfekt Garczyński lasse Honrichs, der über 10000 Rthl schulde, verhaften und durch Heckern und Administrator Radecki alles untersuchen; 600 Rthl wurden zurückerlangt, der Sub-Präfekt Sarzechscha habe Sicherheit geleistet.'
'194': Die geplante Reise nach Schlawentschitz verzögert sich, weil der Invalidenfonds Zinsen und das ganze Capital fordert und die Subhastation der Güter betreibt; den Termin am 26. muß Triebenfeld in Glogau abwarten. In Polen fiel die vindicatio der Trąbczyner Güter beim Friedensgericht günstig aus, die Sache ging vom Tribunal nach Kalisz. Der König von Sachsen bewilligt ein Indult von 10 Jahren bei jährlicher Tilgung des zehnten Teils, noch unpubliciert; Weigel soll davon nichts erfahren. Für Honrichsen sind Suspension, Beschlag und Verrechnung der laut Hecker schuldigen 11700 Rthl beantragt; Bürge ist Subpräfect Brzechsta.
'195': 'Bericht über die stockenden Verhandlungen: Graf Strachwitz wird erst am 23. in Breslau erwartet; Flesch verlangt Geheimhaltung und schilt Goldstücker, worin Triebenfeld einen Schwindel und einen mitzuerledigenden Prozeß vermutet. Betroffen seien die Oderschen Güter bei Leobschütz, Wert 900000 Rthl, ohne Zackraw. Weiter Gerüchte über Krieg Frankreichs mit Österreich und den Türken, Druck auf den König wegen der Contribution und 20000 Mann, Hardenbergs Wiederaufstieg, sowie Nachrichten über das Testament Kolomas beim Legationsrath Henckel; das Moratorium sei um 2 Jahre verlängert.'
'196': 'Bericht über die knapp abgewendete Verhaftung in Breslau: Der Gläubiger Lahr, dem noch 1500 Rthl geschuldet werden, hatte Frist bis Michaelis versprochen, doch sein Mandatar Ludwig erwirkte heimlich den Haftbefehl; nur eine Warnung durch Freunde bewahrte vor dem Stadthaus, nun muss die Mühle zum halben Wert verkauft werden. Verdacht gegen Flesch und Sterch, dessen Wechselgeschäft für Betrug gehalten wird. Die Vindication der Trąbczyner Güter werde weiter betrieben. Politische Nachrichten: Napoleons Contributionsforderung, Truppenreduction, gescheiterte holländische Anleihe; zur 35000-Rthl-Sache schreibe Professor Schade, empfohlen wird eine Eingabe an die Liquidations-Commission unter Berufung auf Berger.'
'197': 'Bericht über die Rückkehr seines Justitiars aus Berlin: die beiden General Köckritz hätten von d. Lahr Schweigen auferlegt und Aufschub um ein Jahr erlangt; auch bei den Gl. Etats-Leuten solle wegen der Zinsen an den Invalidenfonds Geduld erwirkt werden. Triebenfeld will die Geschäfte in Kalisch ordnen, dann nach Breslau zurückkehren, drängt Goldstücher und Flesch zum Tauschgeschäft und setzt auf Oberamtmann Hegener aus Ollaboch, der Strachwitz überreden und Zagorowo unentgeltlich revidieren soll; Trąbczyn und Konojader sollen nachdrücklich vorangetrieben werden. Nachschrift: nach einem Brief des Geheimrats Tismar leugnet Lahr alles; Triebenfeld vermutet eine Intrige von Flesch und Konsorten.'
'198': 'Nach der Rückkehr aus Polen Bericht über den günstigen Stand der Geschäfte: Trąbczyn fällt bis Michaelis zurück, die Sequestration ist aufgehoben, die Rechnungen von Honrichs und Frankiewitz prüft der von der Präfektur bestellte Calculator Schneider; für die veruntreuten 11700 Rthl hafte notfalls der Podpräfect Brzechsta. Hecker wird als Administrator zugelassen, die Untersuchungscommission beginnt am 12.; Pächter Smidkowski zahlt mehrere Tausend. Ferner: abgewiesene Bittschrift der Dąbska beim König, Nachrichten von Köckritz, Tismar und v. Rhaden über die Colonna-Sache und die 35000 Rthl, Hardenbergs Rückkehr zur Schuldenregulierung.'
'199': 'Nach Ankunft meldet Triebenfeld den Inhalt eines beiliegenden Schreibens von T.: der König komme nun gewiß mit K2, weshalb er die Reise nach Berlin aufgibt und stattdessen an Ort und Stelle wirken, auch Wein und Federwild nach B an T senden will, damit beim Abschiedsmahl viel verhandelt werde; einer Notiz des Herrn v. M zufolge komme auch Hardenberg mit, was er bezweifelt, doch T solle ihn unbedingt zur Tafel ziehen. Er plant erneuten Ritt nach Zagorowe und hofft, seine Mühle übermorgen für 6000 Rthl bar sowie einige tausend Rthl Rückstände von seinen Untertanen zu erlangen; Grüße an Prinzessin Emilie und Albert.'
'200': 'Bestätigt den Empfang des fürstlichen Schreibens; das Geschenk kommt für Gen: v. Köckritz zu spät, da dieser vor Sonntag abreist. Zu v. Seegebarth empfiehlt er den Verweis auf erhoffte Gelder aus den polnischen Gütern oder auf die Courier-Gelder aus dem Feldzug. Die Reise nach Jogorowo verzögert sich, Rückkehr bis zum 7. Weigel lehne Stössel als Schuldner ab; Triebenfeld verhandelt, daß Weigel selbst die schlesischen Güter übernehme, quittiere und Stössel befriedige, da die fürstlichen Güter im Fideicommiß liegen. Erwartet Nachricht über die Ankunft des Königs; Grüße an Prinzessin Emilie und Albert.'
'201': 'Meldet als erfreuliche Wendung, daß Weigel entschlossen sei, die für die Herrschaft Zagorow zu verhandelnden Güter, die Knobelsdorffschen oder die Pommahischen, anzunehmen und seine sowie Stossels Forderungen dagegen aufzurechnen; am 30. werde man in Schweinerin alles besprechen. Erläutert seinen Plan: reiche Breslauer Kaufleute wollten Schweinern kaufen, geboten seien 220000 Rthl Cour., gefordert 250000, wovon nach 40000 intabulierten Schulden 160000 bar blieben; nach Befriedigung Weigels und Stössels sowie Grotowski, Lichnowski und Zerboni (Trąbczyn) hoffe er mit 150000 die übrigen Schulden zu tilgen. Mahnt, den Plan mit H August zu fördern.'
'202': Bericht über die erfolgreiche Unterredung mit Vater Weigel, der die ganze Sache in Triebenfelds Hände gelegt hat und bereit ist, die vom Fürsten im Tausch erworbenen Güter zu übernehmen; es bedarf nur noch einer genauen schriftlichen Ausarbeitung, damit auch Weigels Sohn die Sache versteht. Ausführlich wiedergegebenes Lob Weigels auf Triebenfelds Uneigennützigkeit, die schon König und Bischoffswerder erstaunt habe; statt Bezahlung erbittet er nur Dank. Hoffnung auf baldigen Verkauf der zwei freien Höfe.
'203': 'Übersendung des Weigel überreichten Exposée; Weigel meine die Knobelsdorffschen Güter und werde diesmal wohl ohne Hainen handeln. Triebenfeld sucht 500 Rthl zusammenzubringen, um am 11. nach Zagorowo zu reisen; wegen Schweinern verhandelt er mit den Kaufleuten Wiener und Schiller, Tismar schreibe aus Berlin nur mystisch. Nach Eberhardt und Strachard sei an den Gütern Lausch mit Strachnitz nichts. Fischbach bietet gegen 1 1/2 Prozent einen Gütertausch: Knobelsdorffs Güter (390000 Rthl Schulden, 310000 Rthl Rest) gegen Zagorowo (247000 Rthl Schulden, 293000 Rthl Rest), eventuell samt Trąbczyn; Anfrage, ob Fischbach und Knobelsdorff nach Schlawenschitz kommen sollen.'
'204': 'Bestürzt über die Nachricht, der Fürst wolle Koschentin an Weigel oder an Stössel abtreten: Weigel habe daraufhin erklärt, er lasse die Sache ruhen, da er ohnehin kein bares Geld erhalte, und frage, ob die geleisteten Zahlungen Stössel angerechnet und daraus seine übrigen Forderungen gedeckt würden. Triebenfeld hat v. Heyne eingeschaltet, warnt vor dem Verlust der auf Koschentin verwendeten Aufwendungen, bittet um offene Weisung und darum, seine Briefe niemandem zu zeigen.'
'205': Bericht über die Abreise Köchlichs und des Königs, Grüße von Köckritz; das Tauschgeschäft werde eifrig verfolgt. Knobelsdorff habe an Fischbach geschrieben und sei ab dem 11. zur Reise nach Zagorowo bereit; Triebenfeld erwartet dessen Antwort. Weigel zeige sich willig, die Bischdorffer Güter Stössel zu überlassen, wenn er dort eingetragen werde, und wolle dann quittieren und alles von Koschentin abschreiben lassen. Klagen über die Zahlungsnot der Polen (27 Millionen), drohenden Krieg Frankreichs mit Rußland, angeblichen Frieden Rußlands mit der Türkei; Labage soll in Paris Leinwand und Eisen für Contributionen anbieten. Warnung vor Scheinfreunden des Fürsten.
'206': 'Nach Lombardinis Besuch versichert Triebenfeld, er habe alle Gefahren offengelegt; von der preußischen Regierung sei nichts zu erwarten, Genugtuung werde "vom Norden" kommen, notfalls wolle er selbst nach Petersburg reisen. Knobelsdorff tausche gewiß; Tatz komme zum Wollmarkt, dann über Trąbczyn. Wegen der 35000 Rthl fehle noch Eberhardts Aufstellung; Scharnhorst habe in Cosel eine Geldsumme in Aussicht gestellt, die der Fürst nicht annehmen solle. Zur Geldbeschaffung verkauft er 3 Freistellen in Petersdorff für 1800 Rthl (Verlust 3200 Rthl). Am 2. reist er nach Polen: Cabanis soll die Zagorowoer Stellen beeiden, Contracte und Rückstände nachweisen, Vergleich mit Honrichs; Beteiligung des Referendarius Sommer, eines polnischen Rechtsfreundes der Präfectur und des Oberamtmanns Hegener.'
'207': 'Kopie eines Pro Memoria von Hecker und Honrichs: der Trąbczyner Prozeß ist in Kalisch eingeleitet, Termin am 24. October, verzögert durch achtwöchige Ferien des Tribunals; Hofrath Falz führt die Sache, erhielt 200 Rthl Vorschuß und stellt das Honorar in fürstliches Belieben. Die Sequestration der Güter ist beendet; Gerücht, der König von Preußen ziehe die Außenstände ein. Mit den Erbpächtern von Olesnica (Forderung: 12 Hufen in Erbpacht gegen mäßigen Canon), polnischen Bauern (Termin 12. October) und Hauländern (3 fl. pro Morgen) wird verhandelt; Triebenfelds Anmerkung: Nachlaß nur aus Rückständen. Kwilecki bittet um den zugesagten lebenden Hirsch.'
'208': 'Geldmangel verhindert weiterhin die Reise nach Pehlen; die Aussichten seien gut, da neben Knobelsdorff und Strachwitz ein dritter, dem Fürsten wohlbekannter Mann mitwirke. In der Schlieben-Sache droht Pfändung: Arrest auf die Schwänner Pachtgelder bis zur Wiederaufnahme aus Potsdam nach Zusage des General v. Köckritz; Lombardini verweigerte dem Executor Schoch die 48 Rthl 6 g Kosten, deren Zahlung Triebenfeld anzuweisen bittet. Ferner Nachrichten von Manövern des Königs bei Potsdam, Köpnick und Charlottenbourg, Labayes Kontributionsverhandlungen in Paris, Jägerposten an der Elbe, Beschlagnahme von Colonialwaren, Gerüchten über 60000 Franzosen, Verhaftungen und E. M. Kalckreuth.'
'209': Meldet den Eingang der Instruction; er werde das Geld erheben und sogleich aufbrechen. Aus Zagorowo wolle er dem Fürsten alles unverzüglich durch einen reitenden Boten berichten, der zugleich Herrn v. Knobelsdorff dorthin bringen solle. Wegen des abgehenden Postabgangs bricht er das kurze Schreiben ab. Ohne weitere Angaben zu Summen oder Geschäften.
'210': 'Bericht über fünf gleichzeitig laufende Prozesse und die schleppende Registerpraxis der Gerichte: im Trąbczyner Verfahren, dessen Vindikation samt Ersparnis der eingetragenen 22000 Rthl Leibgedinge der Dąbska erhofft wird, sind an Falz 300 Rthl, an Tribunalspräsident Smagorzewski 100 und an Assessoren je 30 gezahlt, dazu 160 Rthl Wein; die Olesnicaer schulden 39270 Rthl, wofür polnische Bauern Kontrakt, 10000 Rthl Einkaufsgeld und Vorauszinsen anbieten; Niedzewiecki schuldet 6000 Rthl, der Propinationspächter 3000; Hawich hetzt die Zinsbauern auf. Erwartete Einnahmen 44000 Rthl. Bitte, bei Präsident Graf Danckelmann in Breslau Urlaubsverlängerung für Referendarius Sommer zu erwirken.'
'211': Bericht über den Besuch des Herrn von Knobelsdorff, der sich vor Ort von der Lage überzeugt hat; Triebenfeld ordnet nun alles so, daß die Verhältnisse auf einen Blick übersehbar sind, klagt jedoch über große Verwirrung und widersetzliche Leute. Im Prozeß um Trąbczyn steht der Termin seit dem 24., die Sache ist noch unentschieden, die Verlesung des Dekrets durch das Tribunal könne noch 14 Tage dauern; bei günstigem Ausgang habe alle Not ein Ende. Knobelsdorff gilt ihm als durchaus redlich; er bittet, ihm die Führung allein zu überlassen.
'212': 'Nach schwerer Krankheit berichtet Triebenfeld, dass niemand zahle: 31 Prozesse seien anhängig, Execution und Auspfändung erhofft, die Olesnicer sollen ausgewiesen, Niedzewiecki aus Kopoyno und Hawich aus Drzewce gesetzt und 3 Vorwerke wieder eingerichtet werden. Fällig seien 8657 Rthl 20 Abgaben, 7500 Rthl Zinsen an den Invalidenfonds sowie Zinsen aus 27000 Rthl; Napoleons Freijahre-Erlass verwirre alles. In der Trąbczyner Sache habe Poniatowski heimlich ans Tribunal geschrieben, die Güter fielen laut Tilsiter Frieden an den Fürsten; die Hauländer böten 40000 Rthl. Taxe der Zagorower Güter: 22140 Rthl Ertrag, davon 7140 Rthl Überschuss. Seine eigenen Güter seien sequestriert.'
'213': 'Nach überstandener Krankheit und einem Kutschenunfall mit Kopfverletzung berichtet Triebenfeld über die Reise nach Konin: die Staatsschulden seien bis auf 900 Rthl bezahlt, mit dem Propinationspächter und Nassals (3000 Rthl vor dem Kalischer Tribunal) hoffe er die kostspielige Sequestration ganz zu beseitigen; der Sequestrator, Günstling des Präfekten Garczynski, liquidiere bereits 2236 Rthl. Es folgt eine Aufstellung von 43 Prozessen (Niedzewiecki 6000, Nossalski 3000, die drei Olesnicer 33000, Wrabczyner Bauern 1200, Berda 1190, Hauländer 5000, Ribbeck 225, Müller in Swięcia 500, 29 Kolonistenprozesse über 39000 Rthl), Ertragsberechnungen bis Johanni sowie Klagen über Zahlungsverweigerung seit Napoleons neuen Verfügungen, den 40jährigen Amortisationsplan, Hardenberg und Zerboni.'
'214': Kondolenz zum Tode der Fürstin; Triebenfeld meldet die bestätigte Vergleichsregelung, wonach Bank- und Invalidenschulden samt Rückständen in 41 3/4 Jahren zu 6 Prozent abzutragen sind, und erwartet ein ähnliches Moratorium für die Privatschulden (Weigel). Die Erbpächter zahlen nichts; Prozesse um Olemizur, Werbizier und Swiecia laufen, Einkünfte künftig 22-24000 Rthl. Gegen Hecker (Rückstand über 5000 Rthl) und Hawich soll ein Kriminalprozess folgen; eigene Schulden von 6500 Rthl, Personalkosten 1000 Rthl jährlich, Reise nach Berlin am 25.
'215': 'Ausführlicher Punktbericht: Empfang von 1000 Rthl durch Stallmeister Bally sowie 255 rt für Triebenfelds Kinder; Untersuchung gegen Honrichs (entlastet), Hawich (von Graf Kwilecki als Verleumder verstoßen), Hecker und Cabanis. Zur Aufhebung der Sequestration in Zagorowo Deponierung von 5100 Rthl Zinsen wegen des Berliner Prozesses um Mendel Oppenheimers Forderung von 102000 Rthl; Termin am 28. Vindication von Trąbczyn und Kaemen gegen die Dąbska, Schadensersatz von 60000 Rthl erwogen, Stenger durch Raszkowski (300 Rthl) ersetzt; Erlass eines Zinsdrittels für die Kolonisten, Rückstände in Betschin über 14000 Rthl, Prozess der Schließen wegen Wyttow, Collonmasche Sache, Reise nach Schlawenschitz, Verkauf an v. Brzechsta hingehalten.'
'216': Nach Versicherungen mehrerer Magnaten würden alle Privatschulden wie auch die Bayonner Summen (Bank-, Jesuiten- und Pupillengelder) dem Moratorium von 41¾ Jahren unterworfen; ein Dokument über die Weigelschen 50000 Rthl sei zu erwarten, so daß insgesamt 200000 Rthl zu 6 pCt. auf den Gütern amortisiert würden. Erbittet Entscheidung, ob die Güter behalten oder vorteilhaft vertauscht werden sollen; im ersten Fall gerichtliche Aufhebung der Hauländer und Bildung reiner Dominialhöfe. Rückstände meist uneinbringlich; für den Prozeß gegen Hecker Vollmacht für Advocat Schmid in Kalisz erbeten.
'217': Sanitz berichtet von seiner Übersiedlung nach Berlin, um den Verlust seines Vermögens und die Rückforderung seiner an die Dąbska gefallenen Güter zu betreiben; sein früherer Justitiar Weltzer gibt wenig Hoffnung, das Departement der auswärtigen Angelegenheiten wandte sich an den Dresdner Hof, der die polnischen Richter entschuldigt und den Tilsiter Frieden für unanwendbar hält. Der französische Gesandte stellt Hilfe in Aussicht, falls kein kaiserlicher Befehl vorliegt. Bitte um Abschriften des Friedensspruchs und des Tribunalsurteils zu den fürstlichen Trombschyner Gütern; erwartet Kriegsausbruch im Norden.
'218': 'Vorschlag eines Tauschplans, den Triebenfeld mit von Heuthausen und Stallmeister Bally entworfen hat: Schurgast (Kaufpreis 207000 Rthl, 92000 Rthl Schulden) soll mit Gen. Graf Wartensleben getauscht, die Zagorower Güter zu 560000 Rthl angesetzt werden, woraus dem Fürsten eine Hypothek von 207625 Rthl bliebe; Stöckel und Weigel sollen Schurgast und die Hypothek übernehmen. Ersatzweise bietet Triebenfeld sein Blizanow samt 30000 Rthl auf Kontop. Eile wegen Verhandlungen mit Medicinalrath Gumperts; Prozesse gegen Olemia und Weyberin, Rückstände in Olesnica und Betschen, eigene Bedrängnis durch zehnfachen Arrest.'
'219': Dringende Bitte um schnellste Entscheidung über den eingereichten Plan, da ein Medizinal Rath aus Kalisz bereits mit dem alten Grafen Wartensleben verhandle; bei Zustimmung wolle Triebenfeld nach Münse reisen, sein Blizanow gegen Güter des älteren Wartensleben-Sohnes vertauschen und so vor allem Weigel und Stössel befriedigen, damit der Fürst die Gläubiger größtenteils abfinden und die Fideikommißgüter ruhig besitzen könne. Klage über täglich steigende Abgaben, wachsende Not, drohenden Aufstand. Die Nachfrage der Gesandtschaft beim Hypothekenkonservator, Präsident Dierschlag, sei verstummt.
'220': 'Bericht über die verspätet, erst drei Wochen nach Absendung, weil in Schweinere liegengeblieben, erhaltene Weisung: Triebenfeld verkaufte in Oxtrow seine Wolle als Reisegeld und eilte zu Graf Wartensleben nach Neisse, kam aber zu spät, da dieser Schurguet einem bankrotten Kaufmann für 135000 Rthl überlassen hat. Der junge Wartensleben fordert für die Constadter Güter 200000 Rthl bei 120000 Rthl Schulden. Vorschlag, Weigel und Stössel Constadt samt der Zagorower Hypothek gegen Quittung über 350000 Rthl zu übertragen, um Koschentin für Prinz Alexander zurückzugewinnen; erbittet eilige Antwort nach Blizanow sowie die Rückgabe von Taxe und Restantenverzeichnis im Original für den Gerichtstermin.'
'221': Die verlangten 18000 Rthl aus den Zagorower Gütern können vorerst nicht übersandt werden; erhofft wird nur die Zahlung der Weihnachtszinsen zur Erhaltung des Moratoriums. Berichtet über die eingeleitete Veräußerung Zagorows an Stossel, die Vermittlung des Grafen Leopold v. Wartensleben und Oberamtmann Königs Reise nach Breslau zu Heymen, einen möglichen Tausch Blizanow (127000 Rthl) gegen die Pila-Güter Sandrelzkis (250000 Rthl), Ablösung Weigels und Rettung Koschentins mit 60000 Rthl; Constadt und Schurgast werden verworfen. Bittet um Rücksendung der Papiere.
'222': Baron Stossel sei bereit, die Zagorower Güter für seine Forderungen nach Triebenfelds Plan zu übernehmen; damit wäre auch die Sache mit dem alten Weigel erledigt. Triebenfeld drängt auf schnellste Antwort, ob der Fürst dem Plan zustimme, und erbittet ein Schreiben an Stossel, worin dieser auf Triebenfeld verwiesen wird; auch Blizanow soll hinzugegeben werden. Nach dem Testament der verstorbenen Fürstin Sacken bleibe Koschentin unbezahlbar; von deren für Fideikommisse der Prinzen Adolph und Allexander bestimmten Geldern seien etwa 670000 m. bar zu erwarten. Graf Caesar Wartensleben aus Breslau bestätigt Stossels Bereitschaft. Dem Boten sind 5 Rthl zu zahlen. Koch ruft nach Berlin; der älteste Sohn wird Secondelieutenant der Garde du Corps.
'223': 'Antwort auf Triebenfelds Schreiben vom 20. Novb.: Der Fürst hält den Plan einer Einigung mit Weigel und Stössel für nicht durchführbar, lehnt die Übernahme von Ruszynowią und Blizanow ab und drängt statt dessen auf rasche Veräußerung der Zagorower Güter zur Deckung seiner Privatschulden. Ein Angebot der Familie Schimmelpfennig wird erläutert: die schuldenfreien Güter Szelce und Maderzewo bei Mysłowic (Kaufpreis einst 26000 Ducaten, Forderung über 100000 Rthl, 85000 Rthl ausgeschlagen), Kapitalien der Generalin von 60000 Rthl, ferner Gollawia. Lieut. Sommer soll als Unterhändler entlohnt werden; Nachricht über Adeles Verlobung mit dem Erbprinzen von Hohenloh Kirchberg.'
'224': 'Bericht über die Verhandlungen mit General Schimmelpfennig, der die Zagorower Güter für 23000 zu erwerben hofft und wegen seines Alters seine Schwiegersöhne, Rittmeister von Kotzow und Herrn v. Johnston, zur Besichtigung schicken will; dazu sein Zahlungsplan: Einbringung der Güter Seliz und Modkewo für 110000, des Guts Goła wies (6000 Rthl), ostpreußische Pfandbriefe von 66000 Rthl al pari, weitere 12000 und notfalls 20000 Rthl gegen schlesische Hypotheken. Lieut. Sommer ist instruiert. Der Verkauf an Weigel und Stössel ist endgültig gescheitert; Bitte um Beschleunigung der Prozesse und Geldeingänge.'
'226': Weder der erste Bote noch Sommer oder General v. Schimmelpfennig sind eingetroffen; Triebenfeld hält den geplanten Tauschhandel für gescheitert, hat aber alle Beteiligten instruiert. Beigelegt wird ein zurückerbetener Brief des Grafen v. Wartensleben, wonach alles von einem eigenhändigen Schreiben des Fürsten an Stössel abhänge, der samt Weigel nur durch die Güter im Herzogtum Warschau zu befriedigen sei und diese besichtigen möge. Er verwahrt sich heftig gegen den Vorwurf wegen der Prozesse, verweist auf allgemeine Not und ausbleibende Einkünfte. Die Präfektur fordert die Originalurkunden der Zagorower Güter, sonst drohe Konfiskation; Anfrage wegen Fortführung des Trąbczyner Prozesses.
'227': 'Übermittelt per reitendem Boten den Vorschlag des Sub-Präfekten von Brzechsta, die Herrschaft Zagorow auf 6 Jahre zu pachten: jährlich 20.000-25.000 Rthl, Instandsetzung der drei Vorwerke für 3000 Rthl, halbjährliche Zahlung und Sicherheit auf seine Güter, jedoch 10.000 Rthl Abzugsquantum bei Verkauf. Drängt wegen des drohenden Krieges auf schnelle Entscheidung, listet unaufschiebbare Zahlungen (u.a. 1240 Rthl 8 gr nach Warschau, 1250 Rthl Invalidenfonds, 1250 Rthl an Weigel) und warnt vor erneuter Sequestration; Alternative wäre General von Schimmelpfennig. Berichtet vom stürmisch beendeten Warschauer Reichstag und neuen Abgaben.'
'228': 'Bericht über die Sendung zu General Schimmelpfennig v der Oye: dieser sei zum geplanten Tausch gegen die Zagorower Güter weiterhin bereit, doch drängt die Sache derzeit weniger, da er krank und noch nicht ausgehfähig ist und die Berliner Verhandlungen seines Sohnes, des Rittmeisters v Schimmelpfennig, mit H. v Stägemann über die zur Auszahlung bestimmten Gelder erst durch Vermittlung des sächsischen Gesandten günstiger stehen. Da winterbedingt keine Besichtigung möglich ist, bittet der General um Aufschub bis zum Frühjahr. Unterzeichnet Sommer.'
'229': Glückwünsche zum Festtag des Fürsten, verbunden mit dem Dank des Generalprokurators Graf Lipski, des Tribunalspräsidenten Smogorzewski sowie der Tribunalsräthe Rembowski, Michalski und Sobocki für das übersandte Wildbret, dessen Wirkung sich bei der Entscheidung der Sachen Olesnice und Wrąbczyn zeigen werde. Mit dem Unterpräfecten von Brzechsta ist sub spe rati der Pachtvertrag über die Zagorower Güter allein zu 20000 Rthl abgeschlossen; am 8. Februar will Triebenfeld mit ihm in Schlawenschitz zur Ausfertigung in forma probante eintreffen. Alle Zinsen seien gedeckt, das Bayonner Capital werde amortisiert; die eingesandten Documente wurden der Behörde vorgelegt, Originale folgen zurück.
'230': 'Dringende Mahnung des Fürsten: Triebenfeld ist den auf den 8. selbst gesetzten Termin, gemeinsam mit H. v. Brzechsta zu erscheinen, seit zwölf Tagen schuldig geblieben; auch das Schreiben vom 19. v. M. bleibt unbeantwortet, insbesondere hinsichtlich der Trapergner Schenkungsurkunde und eines tragfähigen Plans für die Zagorowoer Güter. Da keine Revenuen fließen und die Creditoren drängen, ist die Hülfe des Königs und eine Commission zur Regulirung der Schuldensachen erbeten; General von Schimmelpfennig will Zagorowo im März besehen und kaufen. Erbeten werden bestimmte Antwort durch den Reitknecht und sofortige Geldhülfe.'
'231': C. F. Weigel berichtet, er sei vor einigen Wochen in eigenen Geschäften in Kalisch gewesen und habe dort gehofft, Triebenfeld zu treffen, dessen Aufenthaltsort er nicht mit Sicherheit habe erfahren können. Da ihm eine Beratung über die zwischen dem Fürsten v. Hohenlohe und ihm bestehenden Angelegenheiten sehr am Herzen liege, bittet er höflich um Bestimmung eines Tages für eine Zusammenkunft in Kalisz oder an einem anderen Ort und erbittet baldige Antwort.
'232': 'Bericht über schwere Krankheit und äußerste Geldnot: kein Groschen in der Casse, alles unter Sequestration, von 4 eingegangenen Rthl erhielt Herr Sommer die zugesagten 300 Rthl nicht. Die Verpachtung, auch der Propination, sowie Brzechstas Zahlung zu Johanni bleiben ungewiss; Rückstände von 1808 (2000 d.). Bitte, über Justizrath Kuntzel beim König von Sachsen und Generalprocurator Lipski zu wirken; erbittet eiligst eine Erklärung über 3125 Rthl Capital, mit Zinsen und Kosten 4219 Rthl, exequierbar aus den Zinsen von Neu- und Alt-Swięcia, Wrąbczyn, Alt-Olesnica, Skokum, Sophienthal, Kopoyno und Adelow. Erwähnt Graf Kwilecki, Durchmärsche und Hungersnot.'
'233': 'Vorschläge zur Tilgung drückender Schulden: v. Sobottendorff, dem 40000 Rthl geschuldet werden, solle Drzewce auf 18 Jahre zu jährlich 2000 Rthl (36000 Rthl) in Pacht erhalten, dazu vier erledigte Kolonistenstellen in Swixce zu je 1000 Rthl für die beiden Söhne, gegen Rückgabe des quittierten Schuldscheins; Weigel solle für seine 50000 M das Vorwerk Kopoyno samt Propinationsrecht auf 9 Jahre zu 6000 Rthl nehmen. Ferner Ablösung der 50000 Rthl beim Invalidenfonds durch Prinz August, Aussichten in Olesnice und Wrąbczyn, Verzögerung der Meierowitz-Sache sowie Rechnungslegung des Cabanis vor v. Chomanowski in Schlawenschitz.'
'234': 'Bericht über die Verhandlungen mit Weigel, den Triebenfeld durch einen Eilboten nach Breslau dringend herbeiruft: gelingt der Plan, entfalle eine Schuldpost von etwa 54000 Rthl, insgesamt seien gegen 90000 Rthl Schulden ohne Substanzverlust der Güter tilgbar. Hauptes Hindernis bleibe der Invalidenfonds, der wegen etwa 9000 Rthl Zinsrückständen alles mit Arrest belegt habe; das Kapital von 50000 Rthl solle aus dem Sackenschen Vermächtnis gezahlt werden, wozu Prinz August und ein Befehl des Königs wirken sollten. Erbittet dringend das eigenhändig oder gerichtlich beglaubigte Instrument; schreibt krank im Bett.'
'235': 'Meldet die Verzögerung des Boten und die Ankunft des alten Weigel, der nicht nur den Pachtvertrag abschließen, sondern auf Triebenfelds Rat auch die Zagorower Güter kaufen will: Übernahme der Schulden und weitere 200000 Rthl, die er gegen Koschentin verrechnen möchte. Koschentin solle heimlich zur Zwangsversteigerung kommen, von Weigel als Gläubiger unter Taxe, vermutlich unter 600000 Rthl, erstanden und dem Fürsten schriftlich zediert werden; niemand dürfe Absichten des Fürsten oder des Prinzen August ahnen. Bittet dringend um Übersendung der Papiere.'
'236': Bericht über den Besuch des alten Weigel, der Triebenfeld sein ganzes Geschäft mit dem Fürsten übertragen hat; dessen Angebote seien vorteilhaft, da Weigel kaufen wolle, weshalb der Pachtvertrag zurückgestellt wurde, erst seien die Absichten des Fürsten und dessen Verhältnis zu den Kindern zu erfahren. Auch die Sache des Herrn v. Sobottendorff lasse sich bei einer Reise regeln. Dringende Bitte um die erwarteten Papiere und um Unterzeichnung des beiliegenden Schreibens an den Präfekten per Estafette. Klage über Honrichs; Cosmar habe geäußert, kein Gläubiger des Fürsten erhalte je einen Groschen.
'237': Klage, daß ein früherer, dem Amtman König übergebener Brief nicht per Expresse nach Schlawenschi, sondern in Pol Wartemberg zur Post gegeben wurde; da die erwartete Antwort ausbleibt, reist Triebenfeld noch in der Nacht über Dresden nach Naumburg an der Saale, wo sein ältester Sohn mit Schüssen durch beide Schenkel verwundet liegt, und bittet, künftige Post postlagernd nach Dresden zu richten. Mit dem nach Art Fieders gefaßten Schreiben an den Kaiser hofft er Trąbczyn und Kaemen zurückzuerlangen; Trzcinski, König, Zerboni und Meierowitz weichen aus, gegen Meierowitz ist Execution verhängt, Radke ist durch 80000 Russen festgehalten.
'238': 'Klage über ausbleibende Nachrichten und Zahlungen: Trzcinski hat nichts gezahlt, Zerboni seine Verpflichtungen nicht erfüllt, Weigel drängt, weshalb der Fürst ihn mit Trzcinskis Wechseln zu beruhigen sucht; die Gelder aus Großen fehlten zum Nötigsten. Ein durch Koenige Nachlässigkeit in Würtemberg zur Post gegebener Brief ist offenbar beim Brand des Posthauses verloren. Beigelegt ein offenes Schreiben an den russischen Kaiser; Gesuche an König, Staatskanzler v. Hardenberg und Justizminister um Unterstützung des Vergleichs mit den Gläubigern zu Brieg und eines Unterhalts blieben erfolglos. Hoffnung auf Maierowitz und Ratke; Glückwunsch zur Auszeichnung des verwundeten ältesten Sohnes.'
'239': 'Bericht über die eigene Podagra, die Triebenfeld auf dem Weg nach Neisse zum Biwakieren im Regen zwang, und über die politisch-militärische Lage: Der König sei drei Tage hier gewesen und Richtung Topliz abgereist, wo der russische Kaiser weile; Österreichs Beitritt bleibe zweifelhaft, überall seien Neutralitätszeichen angeschlagen, der Waffenstillstand habe die verbündeten Mächte getäuscht, Bülow und Czerniczeff hätten sich fügen müssen. Erwähnt Gneizenau, Valentini, Ortel, Merkel und Hardenberg sowie erledigte Aufträge für Frau v. Hahn und v. Kleist.'
'240': 'Politisch-militärischer Lagebericht: Österreich werde neutral bleiben und nur vermitteln; die russischen Truppen murrten, selbst die Generale verwünschten den Waffenstillstand und wollten sich hinter die Weichsel zurückziehen. Ausführlich wiedergegeben wird ein heftiger Wortwechsel des Generallieutenants von Koch mit Minister Hardenberg über die Aufgabe Sachsens und eigener Lande. Klagen über Verpflegung, Getreidemangel, grundlose Wege und Pferdeseuche; General Zastrow solle die 55000 Mann Landwehr bei Neiss befehligen; Generallieutenant Ortell liege in Neustadt krank. Reise über Neisse, Frankenstein und das Hauptquartier nach Schwierin, um Naturalien einzubringen und Geld zu beschaffen.'
'241': 'Bericht über die Begegnung mit General Gneisenau, dem das Schreiben des Fürsten übergeben wurde; Gneisenau äußert sich wohlwollend und will antworten. Mitteilung veränderter Verhältnisse: General Zastrow sei Gouverneur-General in Preußen, Gneisenau kommandiere die schlesische Landwehr von 55000 Mann und sei zugleich Chef des Generalstabes und Militärgouverneur; auch Gen. L. v. Koch spreche nun warm vom Fürsten. Hardenberg beim Kaiser in Böhmen, Rückkehr in fünf Tagen; eine kategorische Erklärung werde gefordert. Zum Plan der Verpflegung aus Polen allgemeine Zustimmung, doch fürchte Gneisenau die russische Requisition. Truppenschauen bei Oppendorff; Klage über Gichtbeschwerden.'
'242': Bericht über die Ankunft in Wien nach dreitägiger Reise, über die dortige Teuerung und das entwertete Papiergeld sowie über die Verschiebung des Congresses auf den 1. November und die Reise der Souveräne nach Ofen und Pest; Frankreich widersetze sich dem sächsischen und polnischen Erwerb, doch stehe Fürst Hardenberg fest. Günstiger Stand der württembergischen Sache; Gespräche mit v. Gärtner und Goesch. Die Schlaw. Angelegenheit sei mit B. und A. beraten und gebilligt, Koschentin noch nicht spruchreif, Külm, Kaehmin und Trąbczyn erst nach Entscheidung über Polens Schicksal; die Moscinska geb. Prusimska habe mächtige Freunde.
'243': 'Klage über die entsetzliche Teuerung in Wien und dringende Bitte um Übersendung weiterer 300 Rthl in Gold binnen acht Tagen, andernfalls Triebenfeld am 23. abreisen müsse. Detaillierte Aufstellung: 400 Rthl umgewechselt, da kein preußisch Courant angenommen werde, dafür 1200 fl. Wiener Einlösungsscheine, davon 392 fl. verbraucht; täglich rund 50 fl. Wiener Währung (Zimmer, Kost, Lohnlackey, Wein), 260 fl. für die Rückreise, Wagenreparatur. Da die Geschäfte noch mindestens fünf Wochen dauern, reiche das Geld nur zehn Tage. Quartier: Zur Goldenen Ente, Schulerstraße.'
'244': 'Bericht vom Wiener Kongreß: das große Manöver bei Wien, an dem die Monarchen und Großfürst Constantin als Inhaber österreichischer Regimenter teilnahmen, während der König von Wurtemberg im achtspännigen Wagen erschien; herzliches Einvernehmen der Kaiser mit dem König, dessen Trinkspruch auf die Soldaten. Reichsfürsten und Stände erbaten von Fürst Metternich vergeblich die Wiederherstellung alter Rechte; zu Sachsen bleibe es bei früheren Beschlüssen. Minister Bar. v. Hum. wirke günstig für den Fürsten, der bald ruhig in Schlawenschitz leben werde; Geheimrath v. Gärtner erkrankt. Anfrage wegen Hardenbergs Bericht über Cosmar und der zu annullierenden Vergleichs von 1811 beim Brieger Oberlandesgericht; Bitte um Weisung.'
'245': Bittschrift an den Staatskanzler Fürst v. Hardenberg um Rettung des Fürsten zu Hohenlohe-Ingelfingen aus den Machenschaften des Testamentsexecutors Cosmar, der sich in das 1799 königlich bestätigte Fidei-Commiss der Güter Schlawentzitz, Lassowitz und Oppurg (Wert über zwei Millionen, Revenüen 79500 Rthl) und in den Nachlaß der Fürstin v. Sacken eingedrängt, seinen minderjährigen Sohn als Administrator eingesetzt, Rechnungslegung verweigert und statt 24000 Rthl nur 2500 Rthl gezahlt habe. Erbeten werden Aufhebung des von der sterbenden Fürstin mit drei Kreuzen unterzeichneten Vergleichs von 1811, ein Vorschuß von 112000 Rthl zur Abfindung der Lutz-Erben (Forderung 426000 Rthl), Einsetzung eines redlichen Administrators und ein Bericht des Oberlandesgerichts Brieg; Triebenfeld bietet Sicherheit von 60000 Rthl.
'246': 'Klage über die verzögerte Post; Bericht aus Wien: die Monarchen sind nach Ungarn abgereist, danach werde der Congress eröffnet, die Minister arbeiten fort. Sachsens Schicksal gelte als entschieden (Preußen erhalte es ganz, Weimar einen Zuwachs), über Polen sei nichts entschieden; die Linie von Thoren bei Kalisch gegen Kempen wäre kein Äquivalent, Schlesien und Preußen blieben ohne Verbindung. In der Koschentiner Sache noch nichts Wesentliches; wegen der Trąbczyner Güter soll er stillhalten, Hilfe des Staatskanzlers erhofft. Das eingereichte Schriftstück musste zweimal geändert werden, da das fürstliche Schreiben als Vollmacht anzuführen war. Zerboni erhielt den Rothen Adlerorden 3. Klasse und geht nach Warschau; Reichsstände-Deputation bei Kaiser Franz, vom König abgewiesen; Beilage einer Brochure von v. Gärtner.'
'247': 'Bericht über den günstigen Ausgang der Palen-Sache und die beim Wiener Kongreß betriebenen Angelegenheiten: die von Geheimrath Goerch namens des ganzen Hauses Hohenlohe eingereichte Eingabe folgt in Copie, Minister von Stumbolt sagte besondere Unterstützung zu. Ausführlich zur Anfechtung des von Cosmar erschlichenen Transacts, zur Advitalität der verstorbenen Fürstin Sacken, zur Vormundschaft Cosmars sowie zur Volljährigkeit der Prinzen Adolph und Alexander (Apanage 1200 Rthl). Abfindung der kurländischen Erben mit 112000 Rthl, den übrigen Gläubigern jährlich 12000 Rthl; beigefügt eine Ertrags- und Zahlungsaufstellung über 79462 Rthl. Nachricht von der Abreise der Monarchen.'
'248': Berichtet aus Wien über gute Aussichten der Sache beim Staatskanzler und beim Minister Baron v Humboldt, der Abschriften aller Eingaben verlangt; der König wolle die Angelegenheit nicht "nach retour" abtun, so daß Aufhebung des Vergleichs, 314000 Rthl und Vorschuß von 112000 Rthl sowie das rückständige Gehalt aus 9 Jahren zu erwarten seien. Graf Winzingerode fordere für Prinz August 10000 Rthl aus Schlawenschitz und Lasswitz nach dem Testament der Fürstin Sacken; dem hält Triebenfeld die Urkunde von 1799 und deren bloßes Advitalitium entgegen, ferner Sequestration von Quldt. Dazu Gerüchte über Sachsen, Frankreich und Unruhen in Baden und Württemberg.
'249': Bestätigt den Empfang zweier fürstlicher Schreiben vom 30. Oktober und 4. November; klagt über eigene Geldnot. Das Papier des Hofraths Hahn könne der bereits bei Seiner Majestät liegenden Bittschrift nicht beigefügt werden. Dringend erbittet er 12000 Rthl für die erteilten Vollmachten, die 10000 Rthl würden danach in Berlin angewiesen. Berichtet über Wohlwollen des Fürsten Staatskanzlers und des Baron von Humbolt, die entschiedene Sache Polens, die Aussicht der Mediatisierten auf alte Vorrechte, eine geheime Konferenz Metternichs mit Wrede und Wessenberg, die geplante Reise der drei Monarchen nach Grätz und Triest sowie eine von Geheimrath Göschell übergebene Vollmacht, in die statt dessen Namen der des von Gärtner zu setzen sei. Bruchstückhaft.
'250': 'Beilage zum Brief vom 17. 9br.: Humboldt bestätigt den Empfang des Schreibens Triebenfelds vom 3. dieses Monats und die dadurch erhaltene Kenntnis der dem Fürsten von Hardenberg überreichten Denkschrift (Memorial). Eine Kopie derselben wird in der Anlage zurückgesandt; Humboldt sagt zu, sich für den Inhalt einzusetzen, soweit es in seinem Wirkungskreis liegt, und versichert Triebenfeld seiner vollkommenen Hochachtung.'
'251': 'Übermittelt als Copia ein weiteres, aus den Acten gezogenes Rechtsgutachten des bekannten Rechtsgelehrten für einen bedrängten Fürsten und bittet inständig um Beistand: werde die schriftliche Hoffnung auf Vorschuß von 112000 Rthl zur Abfindung der L.schen Erben gegeben, so könne der Vergleich mit den Mandatarien rechtsverbindlich geschlossen, Transact und Codicill hinfällig, die Garantie samt den 1790 vorgeschossenen 35000 Rthl zurückerlangt werden. Warnt vor Verzug, da Cosmar die Sache täglich verwirre und der 66jährige Fürst der Not erliegen könne; sonst Verlust von 461000 Rthl.'
'252': 'Antwort auf Triebenfelds Gesuch vom 25. des Vormonats: Die Angelegenheit des Fürsten zu Hohenlohe hinsichtlich der Ansprüche auf Trąbczyn und Kaemen werde sich von selbst regeln, sobald die derzeit in Verhandlung stehende allgemeine Teilung und Übereinkunft über das Herzogtum Warschau zur Ausführung komme. Kurze Auskunft Hardenbergs an den Kriegsrath von Triebenfeld, ohne weitere Zusagen oder Angabe von Summen und Fristen.'
'253': Auch das zweite Gutachten des Hofraths Hahn ist samt beiliegender Copie dem Fürsten Staatskanzler übergeben worden; dieser bestätigt die Übereinstimmung der Rechtsansichten, meldet aber, daß die Herzogin von Sagan beim König um Erlaubnis nachsucht, Gelder auf Sagan aufzunehmen, und die königliche Schuld, eben die für den Fürsten Hohenlohe garantierte Summe, als Sicherheit anweist; der König hat die Sache bis zur Rückkehr verschoben. Triebenfeld bemüht sich um schriftliche Zusicherung zum Abschluß mit den kurländischen Mandataren; auf Anfrage wegen Trąbczyn und Kaemen liegt Antwort bei. Dazu Nachrichten vom Congreß und über den König von Würtemberg.
'254': 'Dringende Geldforderungen aus der Mission bei Hof: statt der veranschlagten 1400 Rthl für 4-5 Wochen habe er in bald 12 Wochen nur 640 Rthl erhalten und schulde Barbe bereits 94 Ducaten; täglich kosteten ihn die einflußreichen Vertrauten des Fürsten Staatskanzlers 20-30 Rthl. Er verspricht Rückgewinn der polnischen Güter, Tilgung der Curischen Schuld von 461000 Rthl, Lösung aus den Koschentiner Banden und Befreiung von Leixner und Meyer Bernhard, erbittet 100 Ducaten sowie 200 Rthl für seine hungernden Kinder, Nachrichten über das Oberlandesgericht Brieg und Postsendungen über Neisse an Oberpostdirektor Mann in Wien; beigefügt zwei Empfangsbescheinigungen (sechzig Stück; versiegeltes Beutelchen mit fünfzig vom Referendarius Bally).'
'255': Sorge um den seit fünf Tagen bettlägerigen Staatskanzler Fürst Hardenberg, von dessen Erhaltung der Fortgang der fürstlichen Sache abhänge; Hardenberg habe die vorgelegten Anliegen eigenhändig aufgesetzt und einen weiteren Bericht verlangt, Minister Humboldt gebe sich verschlossen, das Gutachten des Hofrath Hahn habe gewirkt. Die Militärangelegenheit sei nach Berlin verschoben. Alles hänge am Abschluß der Curischen Sache, am Sturz Cosmars und am Besitz des Fideicommisses. Abreise des Hofes und der Souveräne nach Berlin; eigenes Erscheinen am 11. angekündigt, weitere Briefe erbeten zu unterlassen.
'256': Bericht über die verzögerte Abreise der hohen Alliierten, weshalb in der Sache der polnischen Güter noch nichts zu entscheiden sei; der Staatskanzler habe den Geheimen Staatsrath Stägemann mit Prüfung und Gutachten beauftragt, ferner solle eine Commission unter Minister v. Kircheisen und Finanzminister v. Bulow das Verhalten Commers untersuchen. Ungelöst bleiben der Vergleich mit den Carisch'schen Erben und der Vorschuß von 112000 Rthl. Triebenfeld klagt über fehlende Gelder, Acten und Beweise, mißtraut Stägemann (Freund Zerbonis und Cosmars), erbittet Belege und Blanquette sowie Unterstützung seiner Kinder in Breslau.
'257': Rückfrage zu einer Vorstellung vom 23. des Monats, in der behauptet worden sei, der Fürst zu Hohenlohe habe im Vergleich von 1811 die Zahlung des den kurländischen Erben geschuldeten Capitals von 500000 (Betrag unsicher) selbst übernommen und die Frau Gräfin von ihrer Mitverpflichtung befreit. Da die betreffende Stelle im beigefügten Vergleich nicht auffindbar sei, wird gebeten, sie mit Rothstein zu bezeichnen und die Schrift durch den Überbringer zurückzusenden. Unterzeichnet Gruemann (unsicher).
'258': 'Nach seinen Vorstellungen vom 23. October und 28. November drängt Triebenfeld erneut in der Schuldensache: der Geheime Staatsrath Stägemann habe eröffnet, die Angelegenheit solle einer Commission in Berlin zur Entscheidung vorgelegt werden, wobei das Staatsinteresse unbeachtet bleibe. Die Curz''schen Erben, die Herzogin von Sagan u. a., gegenwärtig geldbedürftig, wollten die Schuld von 426000 Rthl gegen 112000 Rthl und Rückgabe der Documente für getilgt halten, abzutragen in Raten von 25000 Rthl jährlich nebst den 35000 Rthl aus der Königlichen Kriegskasse Breslau von 1790; Vorteil für den Staat 46000 Rthl. Er bietet 60000 Rthl Sicherheit, warnt vor Rückfragen bei Graf Wratislaw und bittet um eine Audienzstunde; sofortige Rücksendung des Schreibens, keine Copie.'
'259': 'Meldet den bevorstehenden günstigen Bescheid des Fürsten Staatskanzlers Hardenberg: das Ober-Landesgericht Brieg soll die Sache beschleunigt untersuchen und kurz berichten, die 42000 rt werden gezahlt, alles nach Triebenfelds Vorschlag. Drängt den Fürsten, vor dem Commissarius in Brieg oder Schlawenschitz freimütig auszusagen, die zum Nachteil der Gläubiger errichteten Vergleiche und die fingierten Schulden, die Erklärung über 300000 Rthl und das Codicill als Machwerk Cosmars (unter Arrest in Öhringen erzwungen) darzulegen, niemanden zu schonen und stets den Rat des Hofrats Hahn zu nehmen. Das Ende des Congresses sei nicht abzusehen.'
'260': 'Nach Übersendung der von Staatskanzler Fürst Hardenberg erwirkten Resolution samt Ordre an das Oberlandesgericht Brieg drängt Triebenfeld den Fürsten, über Hofrath Hahn die Erklärung und den Bericht seinen Eingaben gemäß zu fassen: Aufhebung der mit dem Senatsinstrument von 1799 streitenden Transactionen und des Codicills, Rückgabe der Güterverwaltung, Vergleich mit den Creditoren, Capital von 112000 zur Schuldentilgung, dazu Vorwürfe gegen Cosmar (erschlichene Vollmacht des Sohnes, fingirte Summen, unterlassene Rechnungslegung). Erbittet Copie der Resolution, 4 Blanquette, Dankschreiben an Hardenberg sowie eilig 300 Rthl in Gold, da nur 118 fl verblieben.'
'261': 'Meldet festeste Zusicherung der Rückgabe der polnischen Güter und hält eine Schadensberechnung für die Trąbczyner Güter bereit; die Kaemer Entschädigung solle Leixner allein vertreten, damit der Fürst ex nexu bleibe, unklar bleibe die Lage der Güter im Cujawschen Kreise. Alles hänge nun von der fürstlichen Erklärung und dem Bericht des Brieger Oberlandesgerichts ab: dann seien 112000 Rthl an die Curischen Interessenten zahlbar und Cosmar beseitigt. Rät, Hahn und Eberhardt zuzuziehen; übersendet Vollmachtsformular für Geheimrath v. Göschel; klagt über 50 Ducaten Schulden.'
'262': 'Bericht über Staatskanzler Hardenbergs wohlwollende Äußerung gegenüber dem Prinzen H. von Bartenstein; alles hänge nun an der Erklärung des Fürsten und der Bestätigung der Memoiren, damit die Curl''schen Erben befriedigt, die Vergleiche kassiert und Cosmar zur Rechenschaft gezogen würden. Erbeten werden Blanquits, ein eigenhändiges Dankschreiben an Hardenberg sowie schnelle Copien des Commissions- und Ober-Landes-Gerichts-Berichts. Klage über Not: dringende Bitte um 100 Ducaten, da 50 geliehene bald verbraucht seien; Hinweis auf Connus'' 2500 statt 72000 Rthl, die Apanage von 2000 mk und Meyers Forderung von 240000 Livres an Artois.'
'263': 'Bericht über die überstürzte Abreise des Württemberger Königs aus Wien unter dem Namen eines Grafen v. Teck, der zuvor 4000 Ducaten unter Hofbedienstete und Theaterdamen verteilt habe; Kronprinz, Winzingerode und Linden bleiben mit Vollmacht bis Kongressende, Geheimrath Göschel reicht eine weitere Note ein. Zur Hauptsache: Freude über die Vollmachten für Hofrath Hahn und Lombardini nach Brieg wegen Abfindung der Curischen Erben; der Fürst Staatskanzler verlangt persönliche Vernehmung in Brieg oder durch einen Commissarius zu Schlawenschitz. Polen ruht bis Kongressschluss.'
'264': 'Vertrauliche, ausdrücklich zur Geheimhaltung erbetene Darstellung der Köschentiner Sache: da der König Tausch und Kauf von Gütern nicht mehr duldet, war der eingeschlagene Weg gefährlich; Hofrath Barbe reagierte auf die für den Fürsten Hard: erbetene Geschenksumme von 30000 Rthl empört und beruhigte sich erst nach Vorlage der eigenhändigen Instruktion. Nun soll der reiche Graf Pourtales Koschentin, Boronow und Cieschow gegen bar erwerben; erbeten wird eine unterschriebene Verschreibung über 30000 Rthl in preußisch 64er Courant.'
265a: Dank an den Geheimen Staatsrath für die Förderung der Sache und die Aussicht auf Befreiung aus den Händen Cosmars; der Bericht des Brieger Oberlandesgerichts werde bestätigen, was durch von Triebenfeld und Hofrath Hater vorgetragen wurde. Alles hänge nun am Vorschuß von 112000 Rthl zur Befriedigung der Burischen Erben; dann werde der König ex nexu gesetzt, das garantierte Schuldinstrument über 300000 Rthl zurückerhalten und statt 35000 Rthl eine Summe von 461000 Rthl gewinnen. Zur Tilgung binnen sechs Jahren werden Cosmars Rückstände (60000, 100000 und 48000 Rthl) angeführt.
265b: 'Bittschreiben an einen General um Fürsprache beim russischen Kaiser: Die 1796 vom verstorbenen König in Südpreußen verliehenen, dem Prussiemski konfiszierten Güter Kaemen (bei Miedzeritz, Departement Posen) und Trąbczyn (Departement Kalisch, Kreis Konin) wurden 1807 von der Warschauer Administrations-Commission entzogen und der Tochter Prussiemskis, verheirateten Miączyńska, zurückgegeben. Die Klage beim Tribunal Kalisch blieb erfolglos; Hardenberg riet zum Abwarten bis zur Entscheidung der Pahlenschen Sache. Da die Prosna Grenze werden soll, wird um kaiserlichen Befehl zur Restitution samt achtjähriger Revenüen gebeten; v. Triebenfeld als Generalbevollmächtigter soll gehört und instruiert werden.'
'266': 'Bericht über die Verhandlungen um Polen: eine Partei fordere die Prosna als Grenze, wodurch die Güter Trąbczyn und selbst Blizanow unter russische Hoheit fielen; der Fürst Staatskanzler widersetze sich, sei erkrankt und beim König in Ungnade, Wien voll Kriegsgerüchte. Erbittet dringend die Blankovollmachten, ein Schreiben an den Kanzler und die schriftliche Zusage an Barbe (Pourtales sei gewinnbar), ferner Geld: 104 Ducaten Schuld bei B, dazu 100 und weitere 200 Ducaten; klagt über Not und Hunger. Postweg künftig über Breslau und Dresden an Postdirector Balke.'
'267': 'Klage über 27tägiges Ausbleiben jeder Nachricht seit dem Schreiben vom 17. December: fehlen weiterhin der Brief an den Fürsten Staatskanzler, die Blanquette, die Vollmacht für den Geheimen Rath v. Goeschel, der Revers wegen Koschentin und Geld; B könne nichts mehr vorstrecken, Hungern zweifle bereits an der Sache. Dringend erbeten wird Nachricht aus Brieg; Bitte um Postscheine. Politisches: Englands Friede mit America, ostindische Verwicklungen, Rußlands Druck wegen Polens, Prinz Bertenstein Stetten erhielt in Paris 400000 Francs, Hardenbergs Genesung.'
'268': 'Bestätigt Empfang der Beilagen und 1125 fl. Papiergeld; die Schreiben an den König und den Staatskanzler sind übergeben, ferner Briefe an General v. Schöler und Geheimen Staatsrath Stägemann. Erwartet den Bericht aus Brieg und die Antwort des Grafen v. Pourtales; hofft auf Cosmars Entlassung und Aufgabe der 112000 Rthl für die Kur:schen Erben. Sorge um die Trąbczyner Sache, Kriegsgerüchte und Stimmung auf dem Congress. Hahns Nachricht über halbierte Fideicommiß-Revenüen beunruhigt. Nachschrift: Kleidung kostete 926 fl.; erbittet dringend 200 Ducaten, auch zur Rückzahlung der 100 Ducaten Hardenbergs.'
'269': 'Bericht über die dem Fürsten Staatskanzler Hardenberg durch Hofrath B: überreichte Eingabe samt v. Kircheisen''scher Correspondenz, die nun beim Geheimen Staatsrath Stägemann liegt; B: hält Cosmars Sturz und die Bewilligung des Darlehns für gesichert. Sorge um Trąbczyn, falls der Kreis an Russland fällt; Hardenberg verspricht notfalls Indemnisation, doch fehlt noch die Erlaubniß, sich an russische Behörden zu wenden. Erwähnt werden Humboldt und Beugelin, Constantins Aushebungen und Unabhängigkeitsproclamation in Polen, Kriegsfurcht, die Abreise der Congressteilnehmer, das erwartete Schreiben des Grafen Pourtales sowie die Cabalen Metternichs und Talleyrands.'
269a: Übersendung einer Abschrift des Schriftwechsels mit Justizminister M. v. Kircheisen, den das Q. L. Gericht nicht zu Protokoll nahm, sowie eines Schreibens des Medizinalraths Cosmar vom 22. Juni 1810, aus dem hervorgehe, dass Cosmar den Prinzen August wegen der Forderung der Kurz'schen Erben von 300000 Rthl völlig arrestiert habe. Bitte um Vorschuss zur Befriedigung der Erben mit 112000 Rthl (12000 Rthl bar, 100000 Rthl gegen sichere Zahlungsanweisung) und um Verwaltung der Fideikommissgüter; Triebenfeld verbürgt sich mit Gut und Freiheit und verweist auf vorhandene Mittel, auch die jährlichen 18000 Rthl des Prinzen August.
'270': 'Bericht aus dem Wiener Kongreß: auch Kalisch werde russisch, weshalb die Rückgewinnung der Traperin nur noch auf russischer Seite zu erreichen sei; der Kaiser werde die Verfügung der Hauptverwaltungskommission kaum aufheben, sondern eher anders entschädigen, doch verbiete der Fürst St.K. jede démarche. Moszynski und Graf Landskoy seien Intimfreunde. Wellington sei als Ambassadeur Extraordinair eingetroffen und trete für den König von Sachsen ein (Appanage von 1200000 Rthl); Metternich und Talleyrand intrigierten. Die Sache liege bei Stägemann; Humboldt und der Fürst Staatskanzler sicherten Beistand zu. Beunruhigend sei der dem Brieger Protokoll beigefügte Revenüen-Anschlag der Fideikommißgüter; nach Befriedigung der Lux und Aufhebung des Cosmarschen Arrests entfielen Cosmars Ansprüche.'
'271': 'Bericht vom Wiener Congress: die Grenze Polens sei von Thorn über Slupce bei Peisern, über die Wartha und die Prosna bis Saoleslawiae festgelegt, ebenso die Grenze für das verbleibende Sachsen, dessen König Dresden, Leipzig und Bautzen behalte; England fordere Ostfriesland, Kaiser Alexander Land für den Vicekönig von Italien. Triebenfeld dränge den Fürsten Staatskanzler; die Papiere lägen bei Geheimen Staatsrath Stägemann. Der Vorschuß von 112000 Rthl gelte als gesichert; Prinz August solle die Cosmar erteilte Vollmacht widerrufen und dies dem Justizminister und dem Brieger O L Gericht anzeigen. Entscheidung über die polnischen Güter erwartet.'
'272': Übersendet den entworfenen Antwortbrief an Prinz August; der Widerruf der Vollmacht folge aus den Wiener Beschlüssen, doch seien in Öhringen neue Fehlgriffe zu befürchten, die nur mündlich abzuwenden wären. Erbittet für den äußersten Fall geheime Instruction und Vollmacht sowie eigenhändigen Zusatz wegen des Reisegeldes; Goldstücker werde durch die Reise wegen des Wechsels beruhigt. Beklagt v. Braun als Ursache des Übels gegenüber Cosmar, beruft sich auf Prinzessin Emilie, und kündigt Besichtigung der Güter samt Vorschlag eines neuen Fonds für Baukosten an.
'273': 'Rechtfertigung gegen den kalten Ton dreier fürstlicher Schreiben: General Schüler und Graf Nesselrode verweigern Unterstützung, Hilfe sei nur von Staatskanzler Hardenberg und Minister Humboldt zu erwarten; erbittet zwei französische Blanquette für eine erneute Eingabe an den Kaiser, die Fruth Barbe abfassen soll. Zum Widerspruch der Gutserträge (79000 gegen 36000 Rthl) beruft er sich auf Hofrath Hahns Angaben (Wert 2 Millionen, Ertrag 60000 Rthl) und von Stägemann; der Vorschuß von 112000 Rthl werde erfolgen. Er weist einseitige Abmachungen mit den Curischen Erben zurück, verweist auf 54500 Rthl Gläubigerforderungen und F. Augusts 100000 Rthl, klagt über Mittellosigkeit und bittet um einen Nachfolger; als Administrator schlägt er Hahn vor.'
'274': 'Bericht über die Wiederherstellung der Landstände durch den König von Würtemberg und den auf den 15. März einberufenen Landtag, bei dem eine Senkung der um 50 pC. erhöhten Abgaben ausgeschlossen bleibt; Proteste der Stände, darunter des alten Metternich, beim Congress; B: und Göschel bitten, Prinz August zu warnen, nichts zum eigenen Nachtheil zuzugestehen. Weiter zu Sachsen, Heßendarmstadt, Ostfriesland und Schwedisch-Pommern, zur erhofften Bewilligung des Vorschusses von 112000 Rthl, zur Trąbczyner Vindication (Commission unter General Amstetten, beglaubigte Übersetzungen bereit) und zur Krankheit Bülows.'
'275': 'Klage, daß Staatsrath Stägemann für den Fürsten Staatskanzler noch immer keinen Vertrag entworfen hat; trotz Mahnungen werde stets auf die Überlast an Arbeiten verwiesen, was Triebenfeld nun als Übelwollen deutet: man neige zu Cosmars Gunsten, wäre der Brieger Bericht nicht zu günstig; auch Bar: und Beng: würden gefürchtet. Zugunsten der Hohenlohischen Häuser gehe eine Eingabe an den König von Würtemberg ab. Akten und Übersetzung zu Trąbczyn, Kulm und Kaemen bleiben beim Translator liegen, da Geld fehlt; Bitte um Vorschuß und Blanquette. Andauernde Krankheit.'
'276': 'Bericht über eine im Auftrag des Ministers v. Humboldt betriebene Nachfrage in Brieg: die von Justizcommissarius Eberhard erhaltene Nachricht (Copie beiliegend, Rückgabe erbeten) sei unerklärlich, da alles noch bei Geheimer Staatsrath Stägemann liege; ein Verrath müsse aus Brieg selbst stammen. Fürst Hardenberg habe erneut Hilfe zugesagt, Fürst Bartenstein mahne. Gefordert würden nur die 112000 mk zur Abfindung der Curischen Erben bzw. Verwaltung der Güter zur Deckung des Vorschusses von 112000 Rthl; Eberhards Entsendung zur Composition mit den Prinzessinnen (Nichte Talleyrands) wird dringend erbeten. Nachrichten zu Sachsen, Abreisen der Monarchen; die Vorstellung wegen der polnischen Güter liege fertig, es fehle Geld für die Übersetzungen.'
'277': 'Eilige, wegen Krankheit knappe Antwort auf das Schreiben vom 6.: Eingang der Anweisung über 200 M, dreier französischer Blanquette und mehrerer Briefe, u. a. von Hahn. Erneuerte Bitte, Eberhard und Hahn möchten nach Wien kommen; Stägemann hat noch keine Audienz erhalten, die Sache der hohen Stände samt Acten weitergegeben, an Zerboni geschrieben, Cosmar erledigt. August solle die Vollmacht ordnungsgemäß fordern; Göschel und Wintzingerode warnen ihn vor dem Advocaten. Pourtalès antwortet nicht. Nachrichten von Napoleons Landung bei Antibes, Masséna, Murat, dem König von Sachsen und den württembergischen Ansprüchen gegen die Hohenlohe.'
'278': 'Copia eines Schreibens Eberhards an den Fürsten: Triebenfeld dringe brieflich auf seine Reise nach Wien, wo während der persönlichen Anwesenheit der drei Prinzessinnen (Curian''sche Erben) ein Vergleich erreichbar sei. Dem stünden entgegen die Weisung der Generalmandatare, sich jeder Einmischung zu enthalten, der fehlende Pass von Justizminister und Staatskanzler und vor allem Geldmangel: er bittet um Beschaffung von mindestens 5 bis 600 Rthl Reisekosten. Triebenfeld sei sein Plan zur Beurteilung vorgelegt; dessen Antwort entscheide alles.'
'279': Dringend erwartet Triebenfeld die Ankunft J. C. Eberhardts, um einen Vergleich mit den Curischen Erbinnen zu schließen; danach werde der Fürst Staatskanzler Vorschuß und Administration veranlassen. Prinz August habe wohl die Vollmacht zurückgefordert; mit dem Wegfall dieses Rückhalts sei Cosmars Ruin entschieden. Von Pourtales fehle noch Antwort. Die Resolution über die polnischen Güter verzögere sich, bis über die den Donataren nach dem Tilsiter Frieden entzogenen Güter entschieden sei. Ausführlich über Napoleons Vormarsch nach Grenoble, seine Ächtung, Marie Louise und das nahe Ende des Congresses; Triebenfeld liegt krank.
'280': 'Bedauern über das Ausbleiben Eberhards, dessen Anwesenheit zur Erklärung der Prinzessinnen und zur Genehmigung des Geldvorschusses durch den Staatskanzler nötig wäre; ohne Vergleich mit den Burisch-Erbinnen werden Cosmar und Stägemann die Sache verzögern. Klage über die im Testament wegen Adolphs Volljährigkeit eingeschobene Klausel und darüber, daß Prinz August die Vollmacht nicht widerrufen hat (18000 Rthl, 100000 Rthl). Zu den polnischen Gütern verweist der Fürst Staatskanzler ablehnend. Nachrichten vom Wiener Kongreß: Napoleons Marsch auf Paris, Wellingtons Abreise, Streit Talleyrands mit Kaiser Alexander, Verbote gegen den König von Württemberg.'
'281': Bittet um einen Korbwagen für Stock, den Bedienten des Hofrats Barbi, der mit Triebenfelds 3 Pferden die Schwester des Hofraths ins Reich abholen soll, sowie um ein zweispänniges Fuhrwerk, damit über Prag mehrere Kisten Glas der Hardenbergschen Geheimen Hofräthe Barbe, Heym und Philippsborn nach Schlawenschitz gebracht werden; der Trommelschläger habe den Pass. Von Stägemann noch kein Bericht; Intrigue vermutet. Eberhards Ausbleiben verhindere den Vergleich mit den Curischen Erbinnen, für den 50-100000 Rthl mehr aufzuwenden wären; Pourtales schweigt, die Köhl-Sache offen, statt Trąbczyner eventuell Güter in Schlesien. Nachrichten zur württembergischen Constitution und zu abgefangenen Briefen an Bonaparte.
'282': 'Antwort auf zwei fürstliche Schreiben vom 18. samt Beilage Eberhardts: ohne Vergleich mit den Prinzessinnen sei nichts zu erreichen, zumal dem Fürsten Staatskanzler vorgespiegelt worden sei, die Weilers wollten sich einigen; unterbleibe der Abschluß jetzt, während die Damen Geld brauchen, seien sie um 300000 Rthl ärmer. Eberhards Anreise sei nötig, Paß und Geld könne Triebenfeld hier nicht erlangen. Klage über Cosmar sowie über Prinz Augusts Annahme des Präsidentenamts; Nachricht, die 100000 Rthl seien ihm bar zu übergeben. Aufträge zu Wagen, Glas aus Prag und Blizanow; Nachrichten über Napoleons Vormarsch auf Paris.'
'283': 'Ergebenheitserklärung auf einen fürstlichen Auftrag: Beugelin will das an den Staatskanzler (Fürst Hardenberg) gerichtete Schreiben unverzüglich übergeben und bei dieser Gelegenheit die Wünsche des Fürsten mündlich vortragen, wobei er bescheiden bemerkt, seine Vermittlung könne einem Brief des Fürsten keinen zusätzlichen Wert verleihen. Herrn von Triebenfeld habe er erst in Wien kennengelernt; dessen Berufung auf den Fürsten habe genügt, ihm volle Aufmerksamkeit zu schenken. Ohne Angabe von Summen oder Gütern.'
'284': 'Der Kriegsausbruch verhindert einen Abschluß: Trąbczyn, Kaemen und Kulm bleiben verloren, da Allexander die Bestätigung des von der Sequestrations-Commission an die Kohlen zurückgegebenen Besitzes erreicht hat; deshalb wird beim Kaiser und König Indemnisation beantragt, Broniewskis Pfandgeld 60000 Rthl mit 33000 Rthl Zinsen, Kaemen zu 180000, Trąbczyn zu 316000 Rthl abzüglich der Schulden Lichnowski 40000, Grotowski 20000, Seher 8000, zusammen 459000 Rthl. Alegemann bleibt untätig, Pourtales ohne Antwort. Ausführlich zu Napoleons Rückkehr nach Paris, Murat und dem Skandal um Wurtemberg; Bitte um deutsche und französische Blanquettes.'
'285': 'Pro Memoria zur Berechnung der fürstlichen Ansprüche: die 1796 nach Anton v. Prussiemski verliehenen Güter Kaemen waren an Broniewski für über 100000 Rthl verpfändet; der Prozess kostete über 6000 Rthl, 1804 zahlte der Fürst 55000 Rthl Vergleichsgeld, mit Zinsen 1804-1815 (33550 Rthl) und 4164 Rthl Instrumentskosten zusammen 98714 Rthl. Bei gerichtlicher Taxe der Güter von 180000 Rthl verbleiben 125000 Rthl. Trąbczyn ist auf 316000 taxiert, Schulden bei Lichnowski, Weigel, Grotowski, Seeher und v. Zerboni 138000, davon 60000 gezahlt. Forderung insgesamt: 94550 Rthl von der geborenen Prusimska, 367164 Rthl von den Souveränen.'
'286': 'Lagebericht zur Rückkehr Napoleons: dieser stehe mit über 200000 Mann fast am Rhein, Ney marschiere gegen die Schweiz, Wellington sammle englisch-hannoversche Truppen, russische Truppen passierten am 7. April Prag; allein die preußischen Truppen würden vorgeschoben, Polen und Sachsen seien nicht zu trauen. Geschäftlich verspreche Fürst Hardenberg alles, Stägemann handle willkürlich, General Amstetten rate zur Entschädigung durch Güter. Beigefügt ein Pro Memoria über Kaemen und Trąbczyn (Ansprüche gegen Prussiemski, Broniewski 55000 Rthl, Chełmski 36000 Ducaten, Lichnowski, Weigel, Zerboni), Gesamtforderung 390100 Rthl. Bitte um Blanko-Vollmachten und Eberhardts Kommen.'
'287': Beschwert sich, daß das fürstliche Schreiben vom 3. April uneingeschlagen im Umschlag an Postdirector Mann lag und von diesem geöffnet wurde. Billigt P. Adolphs Entschluß, in Kriegsdienste zu treten, und will beim König, der am 18. abreist, Bestimmung über Ort und Uniform erbitten; erhofft Aufnahme in die Garde. Meldet, daß Lombardini und Staatsrath von Beugelin dem Kanzler geholfen, das drohende Schreiben der beiden Hahn aber zurückgehalten wurde. Ausführlich über die Truppenkontingente der Verbündeten (zusammen 1307000 Mann), Hardenberg, die abgefangene Hortenau-Correspondenz, Pourtales' Ausbleiben und die Reise des Prinzen nach Posen zur Huldigung mit Zerboni.
'288': Erwartet dringend die Ankunft des Prinzen Adolph, spätestens zum 22., da der Fürst Staatskanzler ihn dem König empfehlen will und sich hier zugleich über Cosmars Betrügereien reden lasse; klagt über Stägemanns ausbleibenden Bericht und fordert Deposition aller Gelder beim Bromberger Oberlandesgericht, Rechnungslegung, Entziehung der Executoria und Bestellung eines Oberaufsehers. In der Trąbczyner Sache wandte er sich an Minister von Stein und erbittet ein französisches Schreiben; Ottos Tableau sei unbrauchbar, maßgeblich die Taxe von Blomberg und zur Höllen mit 316000 Rthl Entschädigung. Kriegsgerüchte, Lucian Bonaparte in Paris.
'289': Vortrag an Cabinetsrath Albrecht über die Forderung der Churischen Erben von 300000 Rthl gegen den Fürsten zu Hohenlohe, mit Zinsen nunmehr 426000 Rthl, deren Schuldverschreibung der höchstselige König als Selbstschuldner mitunterzeichnet und bis 1806 verzinst hatte. Nach anfänglicher Ablehnung des Fiscus habe man einen Vergleich über etwa 112000 Rthl verabredet, den die Erben nach neuer königlicher Zusage aufkündigten. Triebenfeld erbittet kategorische Entscheidung, Vorschuß und Aufhebung der Cosmarschen Verwaltung der Fideicommißgüter; Bezug auf ein Gutachten des Brieger Oberlandesgerichts.
'290': Nach sieben Monaten ist endlich die Anweisung ergangen, daß Cosmar die zurückbehaltenen Gelder dreier Jahre schleunigst an das Brieger Oberlandesgericht einzahlt, wovon jährlich 12000 Rthl den Gläubigern zugewiesen sind. Stägemann zeige übelsten Willen und mache sich zum Verteidiger Cosmars und Berater der Curischen Erbinnen; der Fürst Staatskanzler verspreche alles, tue nichts, während Minister Stein die Kompensation durch das Amt Sokolnick beim Kaiser betreibe. Angekündigt sind ein Pro Memoria zur kurz-Sache und zur Militärgage sowie eine Konferenz mit Stägemann. Klage über Adolphs unbeholfenes Auftreten beim König; Bitte um Übersendung der 100 Ducaten per Kurier.
'291': Bericht über die Cabinets-Ordre vom 27. April, mit der der König die unverzügliche Zahlung der 100000 Rthl an Prinz August befahl und sie Kircheisen zuleitete; am 6. Mai sei sie dem Prinzen bekannt gemacht worden. Die Entschädigungssache der polnischen Güter (300000 Rthl) ist durch Vermittlung des Ministers Humboldt entschieden, hängt aber noch am Kaiser; Stein, Woronzow und Nesselrode betreiben sie, Stein notfalls in Heilbronn. Cosmar soll die Gelder unter Arrestdrohung deponieren; die Frage der 30000 Rthl bleibt offen. Zur Militärsache nichts; Bitte um Geldsendung wie durch Adolph Both.
'292': Bericht über den Stand der Indemnisationssache, die dem Kaiser vorliegt; Minister von Stein verspricht russische Unterstützung, eine schriftliche Zusicherung Hardenbergs soll folgen. Ausführlich über Cosmar, der die im Vertrag von 1799 und im Vergleich von 1811 festgesetzten Summen trotz Mahnungen nicht beim Oberlandesgericht Brieg deponiert; Stägemann verteidigt ihn heftig und verweist die Sache an den Justizminister Kircheisen. Prinz August erhält per Cabinetsordre 100000 Rthl; Cosmars Einwand einer Schuld von 300000 Rthl an den Landgrafen von Hessen widerlegt. Vorschlag, den Fürsten Hardenberg in Neisse persönlich anzusprechen.
'294': 'Bericht über Verhandlungen mit der Herzogin von Sagan wegen ihrer Forderung von 30000 Rthl bzw. 100000 Ducaten in Gold: Solange die Herzogin auf ein ihr gegebenes Versprechen hin auf Zahlung durch Se. Majestät den König hofft, sei nichts zu erreichen; werde ihr von höherer Stelle eröffnet, daß der König nichts zahle, sei ein Vergleich auf der Grundlage der angebotenen 150000 Rthl vorbehaltlich höherer Ratification zu erwarten. Die Herzogin bleibt in Wien und geht diesen Monat zur Cur nach Baden; weitere Besuche erbeten. Unterzeichnet Bisenti.'
'295': 'Berichtet über die verfehlte Reise: der russische Kaiser sei in der Nacht zuvor durch Kalisch gereist und in sein Reich zurückgekehrt, womit der Hauptzweck der Reise vereitelt sei. Vom Oberpostdirector Espagne erfuhr er, der Fürst Staatskanzler weile noch in Paris, reise über Cassel und Frankfurth am Main und komme erst in drei Wochen nach Berlin; Barbe liege im Nervenfieber, Minister Stein sei kaltgestellt. Untersucht die Betscher-Sache, deren Contract die Unterthanen aufgehoben wünschen, zweifelt an Zerbonis angeblichem Gutachten und den an Schenck abgegebenen Acten, will nach Blizanow zum Pächter und dann nach Berlin.'
'296': Übersendung der eingegangenen Schreiben nebst zwei Originaleinlagen; Meldung vom Tod des Hofraths Bar. bey in Paris, dessen Witwe noch befragt werden soll. Der Staatskanzler wird erwartet und ist inzwischen eingetroffen. Cosmar sei in erster Instanz eines unredlichen Verfahrens für überwiesen erachtet worden, habe aber appelliert; bei Bestätigung verliere er die Vormundschaft. Klage über die schwere, nun lebensgefährliche Krankheit der Philippischen in Stachen sowie Teilnahme an der Erkrankung des Adressaten.
'297': Klagt über schwere Krankheit (Podagra, hämorrhoidale Kolik) nach dem Tod seiner Tochter im Wochenbett und dem Ableben Barbes sowie Trzcinskis, weshalb er sich von Betsche über Posen nach Blizanow bringen ließ; Reisekosten 247 Rthl, Arzt und Arznei 70 Rthl, Aktenauszüge 22 Ducaten. Berichtet über Zerbonis verzögerten Bericht, den bindenden Pachtcontract, die von Eichaust und Unterpräfect Kurnatowski verursachte Forstverwüstung von 170000 Rthl und verweigert eine Generalvollmacht für Assessor Schenck; von Kulm, Kaemen, Kehr und Verena nichts zu hoffen, Vergleich mit Leixner geplant.
'298': 'Meldet die verspätete Ankunft der Post durch Schenck, für Fürstenbrief, Copie des Zerbonischen Schreibens und Berliner Briefe waren etwa 7 Rthl Gebühren zu zahlen, dazu fortdauernde Krankheit, die Gehen und Stehen verhindert. Zerbonis Einwände hält er wegen der im Wiener Vertrag zugesagten Indemnisation für unerheblich; Bvidlang trete an Barbes Stelle und sei mit v. Humboldt befreundet. Bittet, alle Briefe über das Postamt Strehlitz per Expressboten nach Blizanow zu senden, ferner Wildbret über Gostyszyn an den Generalpächter Faust. In Kalisz wurde das preußische Geld herabgesetzt: der Thaler nur zu 20 gg, 2-gg-Stücke gar nicht.'
'299': Nach überstandener Krankheit noch reisebehindert; die Gutssachen in Kohlen geordnet, es verbleiben 62000 Rthl, 500 Rthl fließen ihm zu für die Reise über Betsche nach Berlin, wo Kaiser Alexander erst Ende April erwartet wird. Bürger und Bauern erklären sich insolvent und verlangen Aufhebung des Contracts wegen laesio (Taxe nur 64000 Rthl); Triebenfeld will zustimmen unter Vorbehalt, Verlust des Handgelds, Zahlung der Canonrückstände (2000 zur Beendigung der Sequestration, 11000 Rthl), zusammen 127000 Rthl Erwartung. Alles hängt von Leixner in Miedzeritz und der aufgefundenen Quittung ab; ferner Zerboni, Schenck (Generalvollmacht), Trzcinski und Waldverwüstungen.
'300': Nachricht von einer in Gosztiszyn eingelieferten Taxe, die abgeholt werden soll; ausführlich der Streit zwischen Zerboni und Fürst Radziwill über das gemeinsam zu erstattende Gutachten zur Organisation des Großherzogthums Posen, das Radziwill nicht mitunterzeichnete, samt Zerbonis Äußerungen, der Beschwerde beim König und Zerbonis Abgang nach Stettin. Ferner Gerüchte aus Petersburg über die Verwerfung der polnischen Constitution durch den Senat. Geplante Reisen nach Betsche und Sterbui wegen des Indemnisationsgeschäfts; im Hauptpunkt Verweis auf den letzten Brief. Textverluste.
'301': Bestätigt den Empfang des fürstlichen Schreibens vom 26., das ihm Lombardini überbrachte, dessen unerwartete Ankunft die Sorge um den lange ausgebliebenen Boten beendete; übermittelt Glückwünsche zum Festtag und Grüße an Prinz Adolph. Im übrigen verweist er auf seine fortlaufenden Berichte und auf den beweisgestützten mündlichen Bericht Lombardinis. Er erwartet seinen Sohn und einen Pächter für Schweinern und will dann nach Posen und Betsche reisen; in der Indemnisationssache hofft er auf günstigen Ausgang, da er von Smiedecki in Kalisch gewonnen habe. Bittet um Wildbret.
'302': 'Bericht über Verhandlungen mit dem Justizbürgermeister Hawich aus Zagorowo, nunmehr herzoglich-warschauischer Notarius publicus, und Oberinspector Hecker: dreizehn gerichtliche Spezial-Vollmachten wurden ausgestellt, u. a. zur Anweisung der Döbske wegen der Trąbczyner Güter, zur gänzlichen Aufhebung der Sequestration (unter dem dreijährigen Indult des Königs von Sachsen), zur Zinseinziehung, zur Klage gegen die Juden Oppenheimer et Wolf in Kalisz wegen über 72000 Rthl, zur Entfernung des Sequestrators Honrichs samt Rechnungslegung und Annullierung seiner Landverkäufe, gegen Niedzewiecki und dessen Erben (über 10000 Rthl), gegen die Olesnicaer Erbpächter wegen 32000 Rthl, zu Grenzprozessen sowie zur Vertretung auf dem Landtag in Warschau; Triebenfeld beruft sich auf seine Obligationen von 250000 Rthl.'
'303': 'Auszug aus den fürstlich Hohenloheschen Liquidationsprotokollen: Verzeichnis von 142 Gläubigerposten mit Forderungen in Gold und Courant, darunter Frau Charlotte von Triebenfeld (112000 Rthl), Carl v. Stössel (191000 Rthl) und der Curator des Sigism. v. Stössel (169400 Rthl), Goldstücker (170000 Rthl), Hein in Breslau (165000 Rthl), Barnheim in Berlin (76791 Rthl), Koppan in Breslau (80000 Rthl), die v. Sobottendorff-Erben (44200 Rthl), der Fiscus (35000 Rthl), daneben zahlreiche Handwerker, Kaufleute, Bankiers und Bedienstete; Summe 17874 Rthl Gold und 1414377 Rthl 7 g 11 d Courant.'

agad1174016-001: 'Eintrag im Register der Regierungskommission, in polnischer Sprache: eine Anordnung an den Direktor der inneren Angelegenheiten, in Warschau in der Sitzung vom 12. Juli 1807 ergangen. Die Kommission übersendet ihm in beglaubigter Abschrift das Dekret des Kaisers der Franzosen und Königs von Italien, am 5. Juni in Finckenstein erlassen, das ihrem Mitglied Wybicki den Besitz der Güter Manieczki, Przylepki, Boreczek und Esterpol zurückgibt, die im Departement Poznań sequestriert waren und über die die preußische Regierung verfügt hatte, und das der provisorischen polnischen Regierung die Ausführung aufträgt. Der Direktor soll das Dekret unverzüglich ausführen: der Verwaltungskammer des Departements Poznań befehlen, die Güter für Wybicki zu übergeben, und ihn ohne Verzug in den Besitz einweisen lassen. Unter dem Eintrag stehen die Namen des Präsidenten Stanisław Małachowski und des Generalsekretärs Jan Łuszczewski.'
agad1174016-002: Eintrag im Register der Regierungskommission, in polnischer Sprache, mit dem das Verzeichnis der Beschlüsse beginnt, die die Kommission während ihres Aufenthalts in Dresden gefasst hat. Der Beschluss vom 21. Juli 1807 stellt die von der preußischen Regierung konfiszierten Erbgüter der Michalina Dąbska, des Generals Niemojewski und Wichrowskis unter das Urteil, das der Kaiser zugunsten Wybickis erlassen hat. Die Sache der Michalina Dąbska, geborene Prusimska, sei der Kommission vom Kaiser überwiesen worden; nach dem Vorbild des in Finckenstein erlassenen Dekrets vom 5. Juni dehnt die Kommission das Urteil auf die drei Fälle aus, damit die Güter an ihre wahren Eigentümer zurückfallen. Unter dem Eintrag stehen die Namen des Präsidenten Stanisław Małachowski und des Generalsekretärs Jan Łuszczewski.
agad11740273-001: 'Entwurf eines Beschlusses der Regierungskommission, in Dresden gefasst, in polnischer Sprache. Die Sache der Michalina Dąbska, geborene Prusimska, die die Rückgabe ihrer unter der früheren Regierung konfiszierten und anderen übergebenen Erbgüter verlangt, ist der Kommission vom Kaiser überwiesen worden. Die Kommission nimmt sich die Gerechtigkeit zum Vorbild, die der Kaiser ihrem Mitglied Wybicki durch das in Finckenstein erlassene Dekret vom Juni erwiesen hat, und dehnt dieses Urteil auf den Fall der Michalina Dąbska, des Generals Niemojewski und Wichrowskis aus: Die von der früheren preußischen Regierung konfiszierten Erbgüter dieser Personen sollen an ihre wahren Eigentümer zurückfallen. Der Entwurf ist an mehreren Stellen verbessert und trägt die Paraphe des Präsidenten Małachowski.'
agad11740273-002: 'Michalina Dąbska, geborene Prusimska, schreibt in Dresden an die Regierungskommission, in polnischer Sprache. Sie habe schon zweimal um die Rückgabe der Güter gebeten, die ihrem Vater zugunsten der preußischen Generale Fürst Hohenlohe, Bischoffswerder und Sanitz konfisziert wurden: Trąbczyn im Departement Kalisz sowie Kamionna, Kolno, Pawłowo, Pawłówko und ein Magazin in einem Ort, der „Wrocławek“ geschrieben ist, im Departement Poznań. Eine Antwort habe sie noch nicht erhalten. Da sie wisse, dass Wybicki seine ebenso konfiszierten Güter vom Kaiser zurückerhalten hat, bittet sie die Kommission, sich für sie zu verwenden und ihr Gelegenheit zu geben, ein gleiches Urteil zu erlangen. Die Kommission vermerkt die Vorlage am 21. Juli.'
agad11740273-003: Michalina Dąbska, geborene Prusimska, bittet in Dresden den Kaiser Napoleon auf Französisch. Sie habe ihm ihre Beschwerden und Hoffnungen schon über die polnische Regierung vorlegen lassen, bisher aber nichts von einem Dekret erfahren, das sie wieder in die Güter einsetzt, die zugunsten der preußischen Generale Fürst Hohenlohe, Bischoffswerder und Sanitz konfisziert wurden. Sie sei überzeugt, dass ihr dieselbe Gerechtigkeit zuteilwerde, die den Grafen Wybicki in seine Besitzungen wieder eingesetzt hat, und bittet den Kaiser, sie ihr nicht zu verweigern. Nach dem Vermerk der Kommission wurde die Bittschrift am 21. Juli 1807 in einer außerordentlichen Sitzung in Dresden vom Fürsten, dem Kriegsdirektor, auf Befehl des Kaisers vorgelegt; der Vermerk trägt die Paraphe des Präsidenten Małachowski, an den das Blatt auf der Rückseite adressiert ist.
agad11740273-004: Michalina Dąbska, geborene Prusimska, schreibt in Dresden erneut an die Regierungskommission, in polnischer Sprache. Das Dekret des Kaisers vom 5. Juni, das Wybicki die von der preußischen Regierung konfiszierten und vergebenen Güter zurückgab, sei zum Grundsatz und Muster genommen worden, um den Personen, die im Dekret der Kommission vom 21. Juli genannt sind, gleiche Gerechtigkeit zu erweisen. Sie zweifle nicht, dass die Kommission ihren Beschluss ebenso ausführen lasse wie für Wybicki und die Direktion der inneren Angelegenheiten anweise, den Verwaltungskammern die Einweisung in die Güter zu befehlen. Die Kommission vermerkt die Vorlage am 23. Juli 1807 und legt das Schreiben zu den Akten.
app53150kaliszgr414-001: 'Protokoll einer Besitzeinweisung, vorgenommen am 4. November 1771 im Wald Lusnia und am 9. November in die Akten des Burggerichts Kalisz eingetragen; das Original ist in das Buch eingenäht. Der vereidigte Kommissar der Woiwodschaften Posen und Kalisz, Wawrzyniec Wstowski, handelt auf Verlangen von Stanisław Ścibor Chełmski, Erbherrn von Łukomia, der vor Gericht obsiegt hat. Er führt die Urteile an, auf die sich die Einweisung stützt: eine Verurteilung von 1761, Dekrete des Krontribunals von 1766, 1767 und 1768, nach denen die Güter Łukom und Trąbczyn abzugrenzen waren, und eine dritte Verurteilung von 1770 gegen Antoni Prusimski, Starost von Niszczewice, wegen Zuwiderhandlung. Im Beisein dreier Adliger, des Trąbczyner Verwalters Józef Jaroszewski und eines Gerichtsboten übergibt er Chełmski den Kiefern- und Laubwald Lusnia als von alters zu Łukomia gehörig, samt der vor nicht langer Zeit darin gegründeten Olęder-Siedlung: ein Schankhaus mit neuem Stall, ohne Wirt, und zwölf mit Namen genannte Olęder. Niemand widerspricht; ein Inventar wird aufgenommen, Chełmski wird im ruhigen Besitz belassen, und den Olędern wird auferlegt, ihm Gehorsam zu leisten.'
app53150kaliszgr424-001: Bescheinigung des Burgamts Kalisz vom 23. November 1776. Antoni Leszczyc Mierzewski fragt das Amt, ob das Grenzdekret zwischen den Gütern der Dörfer Łukom, Trąbczyn und anderen, das die von den Ständen der Republik bestellten Kommissare aufseiten von Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherrn von Trąbczyn, erlassen haben, zur Eintragung vorgelegt worden sei. Das Amt sieht seine Berichtsbücher, in die solche Vorlagen aufgenommen werden, vom 17. Oktober 1776 bis zum heutigen Tag durch und antwortet, in seinen Akten finde sich kein solches Dekret. Es bescheinigt das; Mierzewski unterschreibt.
app53150kaliszgr425-001: Vertagung in der Grenzsache zwischen Prusimski, Starost von Niszczewice und Erbherrn von Trąbczyn, und Stanisław Ścibor Chełmski, Erbherrn von Łukomia, ausgestellt am 28. September 1776 und am 30. September in die Akten des Burggerichts Kalisz eingetragen; das Original ist in das Buch eingenäht. Fünf von den Ständen der Republik bestellte Kommissare erklären, sie könnten die Sache im jetzt fälligen Termin nicht durch ein Endurteil abschließen, weil einige von ihnen beim Reichstag in Warschau, andere beim Krontribunal in Piotrków zu tun haben. Der Termin geht auf die Vertagung im Dekret vom 13. September des Vorjahres zurück. Sie vertagen die Zusammenkunft auf den ersten Montag nach Dreikönig 1777 und erhalten den Parteien den letzten Termin zum Erscheinen vor dem Kommissionsgericht auf dem Grund von Łukomia. Es unterzeichnen und siegeln Stefan Leszczyc Zielonacki, Unterrichter des Kalischer Landgerichts, Maciej Leszczyc Mierzewski, Tomasz Radoński, Grenzvermesser von Kalisz, Stanisław Jabłkowski und Stanisław Otto-Trąmpczyński.
app53170koningr114-001: Bericht des Gerichtsboten Bartłomiej Szepczyński aus dem Dorf Trąbczyn, am 22. April 1767 in die Akten des Burggerichts Konin eingetragen. Auf Verlangen von Antoni Prusimski von Kolno, Erbherrn von Trąbczyn, ist er am Karsamstag mit zwei Adligen, Stanisław Lipiński und Józef Rudkowski, auf das Gut gegangen und hat einen Damm besichtigt, der vor kurzem am Ende des Teichgrunds aufgeschüttet wurde. Durch den Damm staute sich das Wasser, das aus dem Teichgrund durch die Trąbczyner Fluren fließt, zurück und überschwemmte die Olęder, die in den Trąbczyner Wäldern angesiedelt sind, samt ihren gedüngten Äckern und ihren Wiesen. Nach seiner Angabe haben das Leute des Nachbarguts Łukom auf Befehl von dessen Erbherrn getan.
app53170koningr114-002: Zweiter Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn über denselben Damm, am 6. August 1767 in die Akten des Burggerichts Konin eingetragen. Auf Verlangen von Antoni Prusimski von Kolno ist er am Freitag nach St. Jakob mit zwei Adligen, Józef Gołembiewski und Rudkowski, wieder auf das Gut gegangen. Der Damm ist im Wald auf dem Teichgrund an der Grenze der Łukomer Fluren auf Trąbczyner Grund aufgeschüttet; das im Teich gestaute Wasser tritt auf die Äcker und Wiesen der Trąbczyner Olęder über, so dass die Wiesen von vier von ihnen überschwemmt sind und sich nicht mähen lassen. Der Bote erklärt mit den beiden Adligen, der Damm sei vor einigen Jahren von den Erbherren von Łukomia aufgeschüttet und jetzt ausgebessert worden.
app53170koningr115-001: 'Registervermerk im Buch des Burggerichts Konin, Januar 1768: Der Bericht über die Ladung, die Stanisław Chełmski gegen Antoni Prusimski und die Rechtsnachfolger der verstorbenen Prusimska, geborene Rozdrażewska, vor das Kalischer Landgericht erwirkt hat, liegt bei den vorgelegten Schriftstücken.'
app53170koningr115-002: Zwei Registervermerke vom 17. Mai 1768 über Ladungen vor das Krontribunal in Bromberg. Antoni Prusimski von Kolno, Starost von Niszczewice, hat die Chełmski, die Żychliński-Erben, Ignacy Gałecki, Starost von Bromberg, sowie Abt und Konvent von Ląd laden lassen, zur Festlegung der Grenze; Stanisław Chełmski seinerseits den Abt Słowiecki und den Konvent von Ląd, Prusimski und Gałecki. Beide Vermerke sind nur teilweise transkribiert.
app53170koningr115-003: 'Registervermerk vom Mai 1768: Für Antoni Prusimski von Kolno, Starost von Niszczewice, wird ein beglaubigter Auszug aus den Akten des Burggerichts Bromberg vorgelegt; er enthält die von ihm dort erklärte Anerkennung des Termins zur Aufhebung der Verurteilung.'
app53170koningr115-004: 'Registervermerk vom 2. Dezember 1771: Für Stanisław Ścibor Chełmski, Erbherrn von Łukomia, wird die Besitzeinweisung in den Wald Lusnia mit den Olędern vorgelegt; sie liegt bei den vorgelegten Schriftstücken.'
app53170koningr115-005: 'Eintrag vom 20. Dezember 1771. Der Gerichtsbote Nicolaus Krzepczyński von Myszaków legt im besonderen Auftrag von Stanisław Ścibor Chełmski dem Burgamt Konin Waffen vor: vier Säbel in Scheiden mit Riemen und einen blanken, vier Spieße mit eisernen Spitzen, drei lange Büchsen und eine mit Messing beschlagene Flinte, mit Blei und feinem Pulver geladen. Nach seiner Angabe hat Chełmski sie am vergangenen Montag im Wald Lusnia erbeutet, als Antoni Prusimski von Kolno, Starost von Niszczewice, dort gewaltsam einfiel und Bewaffnete das Haus des Schankwirts belagerten. Der Bote nimmt die Waffen wieder an sich.'
app53170koningr115-006: Bericht des Gerichtsboten Nicolaus Krzepczyński vom 20. Dezember 1771, für Stanisław Ścibor Chełmski. Mit zwei Adligen, Antoni Wolski und Konstanty Folwarski, hat er am vergangenen Montag den Grund von Łukomia und den Wald Lusnia besichtigt. Am Teichgrund im Łukomer Wald sahen sie den Damm aufgegraben, das Wehr mit Pfosten, Schützen und Rinnen mit Äxten zerhauen und völlig beseitigt, das Wasser mit den Fischen abgelassen; dort lagen zwanzig frisch geschnittene dicke Knüppel. Im Schankhaus bei den Olędern im Wald Lusnia waren ringsum acht Schießlöcher in die Wände gehauen und drei Fenster zerschossen. Nach seiner Angabe geschah der Dammbruch durch mehr als dreißig Untertanen von Trąbczyn in Gegenwart Prusimskis, das Durchschießen des Hauses durch seine Leute auf seinen Befehl, am selben Tag.
app53170koningr115-007: 'Bericht des Gerichtsboten Joannes Bikierski von Węgierce vom 1. Dezember 1772, für Stanisław Ścibor Chełmski, Erbherrn von Łukom, Łomowo und Myszakowo und Besitzer der Olęder im Wald Lusnia. Mit zwei Adligen hat er am vergangenen Samstag das Schankhaus in Lusnia besichtigt: Drei Fenster und vier Türen mit eisernen Angeln waren aus dem Haus herausgenommen. Nach seiner Angabe haben das in derselben Nacht der Trąbczyner Verwalter Lipiński, der Schreiber Radzewski, der Vogt und Waldhüter und der Hofdiener Wąchnicki auf Befehl von Antoni Prusimski getan und die Stücke samt einem Tisch und einem Fass Bier mit einer Schar Trąbczyner Untertanen nach Trąbczyn fortgeschafft.'
app53170koningr115-008: 'Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 26. Februar 1773, für Antoni Prusimski von Kolno, Starost von Niszczewice. Mit zwei Adligen hat er am Vortag die Trąbczyner Wälder und Wiesen besichtigt und gezählt: im Wald hinter dem Gehölz Lusnia einundfünfzig Stümpfe gefällter, zum Bauen tauglicher Kiefern, auf den Wiesen namens Kąty zweiunddreißig Erlenstümpfe. Nach seiner Angabe haben die Untertanen Chełmskis das Holz aus dem Wald abgefahren und Leute vom Gut Podbiele der Frau Zakrzewska die Erlen auf den Wiesen geschlagen.'
app53170koningr115-009: Protest von Stanisław Ścibor Chełmski, Erbherrn von Łukom und Besitzer der Olęder von Lusnia, gegen Antoni Prusimski von Kolno, Starost von Niszczewice, dessen Hofleute und Untertanen, eingetragen in Konin im März 1773 und von Chełmski unterschrieben. Prusimski habe, obwohl er wisse, dass der Besitz der Olęder von Lusnia Chełmski rechtlich zuerkannt sei, seinen Verwalter Lipiński und seinen Kammerdiener Marzęcki mit anderen das Schankhaus und die Olęder überfallen lassen; sie hätten dort Gewalttaten verübt.
app53170koningr115-010: 'Bericht des Gerichtsboten Joannes Bikierski von Węgierki, eingetragen in Konin im März 1773, für Stanisław Chełmski. Mit zwei Adligen hat er am vergangenen Mittwoch die Olęder-Siedlung Lusnia besichtigt: Im Schankhaus waren der Ofen, drei Fenster und vier Türen, die Chełmski neu hatte herrichten lassen, zerhauen und herausgeschlagen, der Schornstein zerstört, das Bier- und Branntweingeschirr zerschlagen. Nach seiner Angabe haben das die Adligen Lipiński, Marzęcki und andere in der Nacht des 29. Januar des laufenden Jahres getan.'
app53170koningr116-001: 'Registervermerk im Buch des Burggerichts Konin, August 1775: Vorgelegt wird ein Auszug der Konstitution, mit der die Stände der Republik eine Kommission auf den Grund von Trąbczyn angeordnet haben, um dieses Gut gegen Łukom abzugrenzen; der Auszug ist den Akten des königlichen Hofes in Warschau entnommen und liegt bei den vorgelegten Schriftstücken.'
app53170koningr116-002: Drei Registervermerke vom 16. August 1775 zur Bekanntmachung der Grenzkommission. Für Prusimski wird das Bekanntmachungsschreiben für die auf den Grund von Trąbczyn angesetzte Kommission vorgelegt, eingereicht vom ersten der Unterzeichner. Vermerkt wird ferner der Bericht über die Ladungen, die Antoni Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn, an die Erbherren und Besitzer von Łukom, Podbiele und Szetlew sowie an Abt und Konvent von Ląd hat ergehen lassen, und der Bericht über die Ladungen, die Chełmski, Erbherr von Łukom, an die Erbherren von Trąbczyn, Drzewce und Biskupice zum Termin der Grenzkommission zwischen Trąbczyn und Łukom hat ergehen lassen.
app53170koningr116-003: 'Registervermerk über einen Protest, eingetragen in Konin im September 1775. Fünf Kommissare der Feldkommission zwischen Trąbczyn und Łukom sind persönlich erschienen: Dąmbski, Woiwode von Brześć Kujawski, Brzeziński, Starost von Inowrocław, Dąmbski, Fähnrich von Brześć Kujawski, Kwilecki und Umiński. Sie protestieren gegen Chełmski und die von seiner Seite beigezogenen Kommissare wegen einer Handlung, die diese einseitig auf dem strittigen Grund von Łukom und Trąbczyn vorgenommen haben. Alle fünf haben eigenhändig unterschrieben, Ludwik Dąmbski als Kommissar und Präses.'
app53170koningr116-004: Registervermerk über einen Protest, eingetragen in Konin im September 1775. Antoni Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn, ist persönlich erschienen und protestiert gegen die Gliszczyński von Tomice, gegen Stanisław Chełmski von Łukomia und andere, wegen der Verwicklung des Grenzverfahrens im Feld und anderer Umstände. Der Protest wurde im Original eingereicht und liegt bei den vorgelegten Schriftstücken. Prusimski hat unterschrieben.
app53170koningr116-005: Registervermerk über einen Protest, eingetragen in Konin im September 1775. Piotr Rajewicz ist persönlich erschienen und erklärt vorsorglich, er habe sich in das zwischen Łukom und Trąbczyn betriebene Grenzverfahren in keiner Weise eingelassen, und was geschehen sei, sei ohne seine Zustimmung geschehen. Er hat unterschrieben.
app53170koningr116-006: 'Überschrift eines Eintrags vom 3. Oktober 1775: für den Erbherrn von Trąbczyn, Besichtigung des Grenzzugs. Der Eintrag selbst wurde nicht geschrieben.'
app53170koningr116-007: Registervermerk über einen Gegenprotest vom 9. Oktober 1775. Stanisław Ścibor Chełmski, Erbherr des Gebiets von Łukomia, ist persönlich erschienen und protestiert seinerseits gegen Antoni Prusimski, Starost von Niszczewice, und gegen die Handlung der Grenzkommission zwischen Trąbczyn und Łukom. Der Gegenprotest liegt bei den vorgelegten Schriftstücken. Chełmski hat unterschrieben.
app53170koningr116-008: 'Eintrag vom 16. Februar 1776. Antoni Lipiński und Nicolaus Ostrowski erscheinen mit dem Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vor dem Burgamt Konin. Im Namen von Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, verlangen sie die Herausgabe eines Kommissionsdekrets, das kraft der neuen Konstitution auf dem strittigen Grund von Trąbczyn und Łukom als Versäumnisdekret gegen Prusimski ergangen und angeblich dem Amt zur Eintragung eingereicht worden sei. Das Amt hat sein Protokoll durchgesehen: Das Dekret ist bis zum heutigen Tag nicht eingereicht worden; das Amt kann es nicht herausgeben und bescheinigt die Nachsuche. Die beiden haben unterschrieben.'
app53170koningr116-009: 'Überschrift eines Eintrags vom 1. Juli 1776: für Chełmski, Nachsuche nach dem in Trąbczyn und Łukom ergangenen Kommissionsdekret. Der Eintrag wurde nicht geschrieben; über dem leeren Platz steht „Vacuum“, darunter die Unterschrift Fr. Zielonacki.'
app53170koningr116-010: 'Überschrift eines Eintrags vom 5. September 1776: für Chełmski, Nachsuche nach dem Mandat und dem Felddekret, die zwischen den Gütern Łukom und Trąbczyn ergangen sind. Der Eintrag wurde nicht geschrieben; über dem leeren Platz steht „Vacuum“, auf der folgenden Seite unterschrieben von Stanisław Ścibor Chełmski.'
app53170koningr116-011: Überschrift eines Protests von Prusimski gegen Chełmski, ohne Datum, wohl 1777. Darunter vermerkt der Schreiber, dass die Angaben dazu nicht geliefert wurden und dass auf Verlangen der Partei nach Ablauf von drei Tagen „limitiert“ wird. Antoni Prusimski von Kolno, Starost von Niszczewice, hat unterschrieben.
app53170koningr116-012: Eintrag ohne Datum, wohl vom Oktober 1777. Stanisław Ścibor Chełmski, Erbherr von Łukom, erscheint persönlich vor dem Burgamt Konin und verlangt die Herausgabe eines Feldkommissionsdekrets, das zwischen den Erbherren der Dörfer Nowa Wieś, Łazy, Osiny, Trąbczyn, Łukom und anderer ergangen sei, kraft der von den Ständen mit der Konstitution von 1775 erteilten Kommission, und das die Kommissare auf Seiten Prusimskis unterschrieben hätten. Das Amt findet es in seinen Akten nicht, kann es nicht herausgeben und bescheinigt die Nachsuche. Chełmski hat unterschrieben.
app53170koningr117-001: 'Bericht des Gerichtsboten Jan Jankowski von Łukom vom 7. März 1778. Er hat Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, eine königliche Ladung zugestellt: Prusimski soll zu dem Ortstermin (condescensio) erscheinen, den das Kalischer Landgericht in Konin mit seinem Dekret vom Montag nach St. Hedwig des Vorjahres angeordnet hat und der auf den Montag nach Invocavit auf dem Grund von Trąbczyn angesetzt ist, auf Betreiben von Stanisław Ścibor Chełmski, Erbherr von Łukom, als Kläger. Er soll dazu seine Untertanen Albert Livoy, Andrzej Rataj, Kazimierz den Hüter und Albert den Hirten von Nowa Wieś stellen. Die Ladung ist in Konin am Montag nach St. Matthias 1778 ausgestellt; der Bote hat sie im Gutsamt von Trąbczyn auf den Tisch gelegt.'
app53170koningr117-002: 'Bericht der Gerichtsboten Bartłomiej Szepczyński von Trąbczyn und Mateusz Matuszkiewicz von Szetlewek vom 30. März 1778. Sie haben zwei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Samstag nach Reminiscere 1778. Geladen sind Stanisław Chełmski, Erbherr von Łukomia, und die Richter des Kalischer Landgerichts: der Richter Franciszek Wierusz Walknowski, der Unterrichter Stefan Zielonacki und der Notar Xawery Mikorski, auf Betreiben Prusimskis. Das Dekret des Landgerichts vom 20. Oktober des Vorjahres, das dem früheren widerspreche, soll aufgehoben und die Sache an das Tribunal verwiesen werden; Prusimski verlangt, von der Forderung befreit zu werden, die Chełmski von Jan Tracholz erworben hat. Eine Ausfertigung wurde in Konin im Haus des Bürgers Palszewicz hinterlegt, die andere im Gutshof von Łukom.'
app53170koningr117-003: 'Protest von Antoni Prusimski, Starost von Niszczewice, eingetragen in Konin im März 1778: ein Vermerk mit seiner Unterschrift und, auf dem gegenüberliegenden Blatt, der Text nach einer vorbereiteten Abschrift. Er richtet sich gegen Stanisław Chełmski, Erbherr von Łukom, und gegen die Richter des Kalischer Landgerichts. Chełmski habe von dem Bürger Jan Tracholz eine unrechtmäßige Forderung erworben, die aus einem 1744 mit Prusimskis verstorbenem Onkel Paweł Prusimski geschlossenen Geschäft über Eichenholz stamme, und verfolge sie nun gegen ihn. Ihm fehlten die nötigen Urkunden: Sie lägen bei den Erben der Witwe seines Onkels, und er habe sie eingeklagt, aber noch nicht erhalten. Das Landgericht habe die Sache mit Tracholz früher auf einen Ortstermin mit diesen Erben verwiesen; dennoch sei auf Chełmskis Betreiben ein entgegengesetztes Dekret ergangen, das einen Ortstermin auf dem Grund von Trąbczyn anordnet. Prusimski erklärt dieses Dekret, ergangen in Konin am 20. Oktober des Vorjahres, für nichtig und protestiert gegen die Übertragung der Forderung auf Chełmski.'
app53170koningr117-004: 'Protest von Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, Erbherr von Łukomia, Łomów, Imielno und Bukowo, eingetragen in Konin im April 1778 und von ihm unterschrieben. Er beruft sich auf das Felddekret, das die von seiner Seite beigezogenen Kommissare 1775 zwischen Łukom und Trąbczyn erlassen haben: gestützt auf Urkunden und namentlich auf die Besichtigung von 1592, am letzten Grenzhügel mit benachbarten Zeugen durch Eid bekräftigt und rechtzeitig zu den Akten der eigenen Woiwodschaft eingereicht. Dagegen sei die Handlung, die die von Prusimski beigezogenen Kommissare später, nach der Grenzziehung und nach Errichtung der Hügel, privat und mit größter Gunst abgefasst hätten, unrechtmäßig. Prusimski habe sie weder zu den Akten der eigenen Woiwodschaft eingereicht noch ihre Auflagen befolgt und sie damit selbst als ungültig behandelt. Damit sein Schweigen nicht als Anerkennung gelte, erklärt Chełmski sie für ungültig und kündigt an, ihre Aufhebung zu betreiben.'
app53170koningr117-005: 'Protest von Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, eingetragen in Konin im April 1778 und von ihm unterschrieben; die Überschrift nennt als Gegner einen Sokołowski, den der Text nicht erwähnt. Chełmski nimmt seine früheren Proteste auf: Das Grenzdekret zwischen seinem Łukom und Prusimskis Trąbczyn sei durch die von seiner Seite beigezogenen Kommissare nach der Besichtigung von 1592 und nach zwei Tribunalsdekreten von 1766 und 1768 ergangen, und die Grenzhügel seien errichtet. Prusimskis Kommissare hätten davon gewusst und dennoch ihre Befugnis missbraucht: Sie hätten Albert Czarnecki, Grenzkämmerer von Kalisz, den Prusimski angenommen hatte, die Besichtigung des Grenzzugs, die Errichtung der Hügel und die Abnahme des Eides überlassen. Czarnecki habe das Dekret erst einige Wochen nach der Abreise der Kommissare schreiben lassen. Prusimski habe Eid gegen Eid angeboten und als Mitschwörer einen selbst geladenen Nachbarn, einen Mann aus Czarneckis Dienst, der nie in der Gegend gewesen sei, und andere unbedeutende Leute herangezogen. Chełmski beschuldigt Prusimski all dessen und bietet an, es durch Zeugenverhör zu beweisen.'
app53170koningr117-006: Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn, eingetragen in Konin im April 1778, für Antoni Prusimski von Kolno, Starost von Niszczewice. Mit zwei Adligen, Piotr Gostarski und Tomasz Jachimowicz, war er am Samstag, dem 21. Februar des laufenden Jahres, an der Grenze von Trąbczyn. Dort sah er, dass eine mehrere Jahrzehnte alte Kiefer auf dem Grenzhügel, der Trąbczyn von Biskupie scheidet, mit drei Kreuzen als Grenzzeichen versehen, gefällt und weggeschafft war, nach seiner Angabe bei Nacht durch Herrn Bogusławski, Erbherrn eines Teils von Kurów.
app53170koningr117-007: Protest von Antoni Prusimski von Kolno, Starost von Niszczewice, vom 15. April 1778, nach einer vorbereiteten Abschrift eingetragen und von ihm unterschrieben. Er richtet sich gegen Stanisław Chełmski und gegen Stefan Zielonacki, Unterrichter des Kalischer Landgerichts, wegen des vollen Landgerichts wie wegen des Ortstermins auf dem Grund von Trąbczyn. Prusimski verweist auf seinen Protest und seine Ladung gegen das Dekret des Landgerichts vom 20. Oktober des Vorjahres. Der Streit um die Herausgabe der Urkunden mit den Erben der Witwe seines Onkels Paweł Prusimski sei beim Tribunal anhängig; ohne diese Urkunden könne über die Forderung, die Chełmski von Jan Tracholz erworben hat, nicht entschieden werden. Der Unterrichter habe die Sache auf Betreiben Chełmskis an das volle Landgericht verwiesen, obwohl dieses vor das Tribunal geladen sei, und Prusimski damit unnütze Kosten verursacht; Prusimski erklärt diese Verweisung für nichtig.
app53170koningr117-008: 'Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 15. April 1778. Er hat drei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Montag nach Laetare 1778: an Stanisław Chełmski, an den Richter Franciszek Wierusz Walknowski, an den Unterrichter Stefan Zielonacki, zugleich Richter des Ortstermins, und an den Notar Xawery Mikorski. Auf Betreiben Prusimskis soll die Sache an das Tribunal verwiesen und das Dekret vom 20. Oktober des Vorjahres aufgehoben werden; sie lasse sich nicht entscheiden ohne die Urkunden, die Prusimski von den Erben der Witwe seines Onkels, Katarzyna Prusimska, geborene Rozdrażewska, zurückfordert. Erweise sich daraus die Forderung von Tracholz und Chełmski als unrechtmäßig, soll die Übertragung aufgehoben werden; ergebe sich vielmehr eine Schuld von Tracholz gegenüber dem Onkel, soll Chełmski sie samt Zinsen zahlen. Die Ausfertigungen wurden in Trąbczyn, in Konin im Haus des Bürgers Paulszewicz, wo die Kanzlei des Landgerichts ihre Akten hat, und im Gutshof von Łukom hinterlegt.'
app53170koningr117-009: Bericht des Gerichtsboten Jan Jankowski von Łukom, eingetragen in Konin am 25. April 1778. Er hat Antoni Prusimski eine königliche Ladung vor das Kalischer Landgericht in Konin zugestellt, ausgestellt in Kalisz am Karfreitag 1778, auf Betreiben von Stanisław Chełmski, Erbherr von Łukomia. Prusimski soll das Dekret hören, mit dem das Gericht des Ortstermins in Trąbczyn die Sache an das volle Gericht verwiesen hat; Chełmski verlangt, dass ihm die von Jan Tracholz auf ihn übertragene Summe samt Zinsen und Kosten zugesprochen wird. Der Bote hat die Ladung im Gutsamt von Trąbczyn in Gegenwart des Verwalters hinterlegt.
app53170koningr117-010: 'Registervermerk von 1778: Das Dekret, mit dem das Gericht des Ortstermins auf dem Grund von Trąbczyn die Sache zwischen Chełmski und Prusimski, Starost von Niszczewice, verwiesen hat, wird zur Eintragung vorgelegt. Der Vermerk verweist auf einen Text gegenüber unter dem Zeichen #.'
app53170koningr117-011: 'Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 29. Januar 1779, für Antoni Prusimski von Kolno, Starost von Niszczewice. Mit zwei Adligen war er am 23. des laufenden Monats in den Kiefernwäldern von Trąbczyn: Auf eigenem Trąbczyner Grund zählte er zwölf Stümpfe frisch gefällter Kiefern, hinter und zwischen den Grenzhügeln weitere, nach seiner Angabe von Untertanen des Gutes Rzgów geschlagen. Er legt dem Amt zwanzig Äxte vor, die an jenem Tag auf dem Grund von Szetlewek diesen Untertanen abgenommen wurden, als sie bei Nacht mit den Kiefern flohen, nimmt sie wieder an sich und quittiert dem Amt.'
app53170koningr117-012: Protest von Marcin Nosalski, Erbherr und Besitzer von Rzgów, eingetragen in Konin am 1. Mai 1779 und von ihm unterschrieben. Er legt ihn vorsorglich ein, damit ihm die Aussagen von Bartłomiej Szepczyński und Mateusz Wąchnicki in seiner Sache mit Prusimski vor dem Kalischer Landgericht in Konin nicht schaden. Die beiden hätten auf Befehl von Tomasz Joachimowicz seine Leute, die auf Schlitten Bäume aus den Erbwäldern Chełmskis fuhren, auf öffentlicher Straße angehalten, geschlagen, mit den Schlitten nach Trąbczyn gebracht und ihnen die Äxte mit Gewalt abgenommen. Nosalski protestiert gegen sie als Urheber der Gewalt, bietet an, die Gewalttaten durch Zeugenverhör zu beweisen, und will sie vom Zeugnis in dieser Sache ausschließen lassen.
app53170koningr117-013: 'Registervermerk von 1779: Eine Abschrift des Protests, den Prusimski gegen die Nosalski eingelegt hat, liegt bei den vorgelegten Schriftstücken. Antoni Prusimski, Starost von Niszczewice, hat unterschrieben.'
app53170koningr118-001: 'Unvollendeter Registervermerk im Buch des Burggerichts Konin, 1780: Bericht über eine Ladung vor das Tribunal, erwirkt von Stefan Zielonacki, Richter des Kalischer Landgerichts, und Stanisław Chełmski, Schatzmeister von Wschowa, gegen die Prusimski und die Bogdański. Der Vermerk bricht nach den Namen der Kläger ab.'
app53170koningr118-002: 'Registervermerk von 1781: Bericht über die Ladung, die Stefan Zielonacki, Richter des Kalischer Landgerichts, gegen Antoni Prusimski, Starost von Niszczewice, zum Ortstermin auf dem Grund des Gutes Grab erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken.'
app53170koningr118-003: 'Registervermerk über einen Protest, 1781: Antoni Ostroróg Prusimski, Starost von Niszczewice, Ritter des St.-Stanislaus-Ordens, Erbherr von Trąbczyn, Trąbczynek und Nowa Wieś, ist persönlich erschienen und protestiert vorsorglich gegen Stanisław Chełmski, Schatzmeister von Wschowa, Erbherr von Łukomia und Łomów; eine Abschrift liegt bei den vorgelegten Schriftstücken. Prusimski hat unterschrieben.'
app53170koningr118-004: 'Registervermerk vom 15. Oktober 1781: Bericht über die Ladung, die Antoni Prusimski, Starost von Niszczewice, gegen Kazimierz Zakrzewski und dessen Söhne Nepomucen, Ignacy und Ludwik sowie gegen das Kalischer Landgericht vor das Krontribunal in Petrikau erwirkt hat.'
app53170koningr118-005: 'Registervermerk vom 30. Oktober 1781: Bericht über die Zustellung der Ladung, die Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat.'
app53170koningr118-006: 'Registervermerk von 1781: Bericht über die Ladung, die Ignacy Gałecki, Starost von Bromberg, und Michał Drogosław Skórzewski, Unterkämmerer von Posen, der frühere und der jetzige Erbherr von Biskupice, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt haben.'
app53170koningr118-007: 'Registervermerk von 1781: Bericht über die Ladung, die Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat.'
app53170koningr118-008: 'Protest vom 22. November 1781, auf Polnisch. Pater Tesselin Malechowski, Verwalter des Konvents von Ląd, erklärt im eigenen Namen und im Namen des ganzen Konvents gegen einen Vorwurf von Antoni Prusimski, Starost von Niszczewice: Im Grenzstreit mit Łukomia und Trąbczyn, der das Konventsgut Drzewce berührt, habe sich der Konvent bei der letzten Kommission von keiner Absprache und Begünstigung leiten lassen. Er habe den Punkt, an dem die drei Gemarkungen Łukomia, Trąbczyn und Drzewce zusammenstoßen, so anerkannt, wie Chełmski ihn zeigte, aus den im Kommissionsdekret genannten Gründen, und bleibe dabei. Der Konvent sei bereit, das zu beschwören, und werde wegen des Vorwurfs Strafen betreiben. Malechowski hat unterschrieben.'
app53170koningr118-009: 'Registervermerk vom 4. Dezember 1781: Bericht über die Ladung, die Stefan Zielonacki, Richter des Kalischer Landgerichts, und Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, zum Ortstermin auf dem Grund des Gutes Grab erwirkt haben.'
app53170koningr118-010: Bericht des Gerichtsboten Simon Głabik von Drzewce, eingetragen in Konin im Januar 1782. Er hat Antoni Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn, eine königliche Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am 4. Januar 1782, auf Betreiben von Abt Benedykt Lubstowski und dem Konvent von Ląd, Erbherren von Drzewce. Der Konvent will von dem Vorwurf der Absprache mit dem Erbherrn von Łukomia freigesprochen werden und beruft sich auf Tribunalsdekrete und die Besichtigung von 1592. Der Bote hat die Ladung im Gutshof von Trąbczyn hinterlegt.
app53170koningr118-011: 'Registervermerk vom 18. März 1782: Das Dekret des Ortstermins über die zu Trąbczyn gehörende Olęder-Siedlung, ergangen zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa, wird zur Eintragung vorgelegt; das Original ist bei den vorgelegten Schriftstücken eingeheftet.'
app53170koningr118-012: 'Registervermerk vom 19. April 1782: Bericht über die Ladung, die Antoni Prusimski, Starost von Niszczewice, Ritter des St.-Stanislaus-Ordens, gegen Vater und Söhne Zakrzewski sowie gegen das Kalischer Landgericht vor das Krontribunal in Petrikau erwirkt hat.'
app53170koningr118-013: Protest von Piotr Gosławski als Bevollmächtigtem von Antoni Prusimski, Starost von Niszczewice, gegen ein Dekret des Kalischer Landgerichts, eingetragen in Konin 1782 und von ihm unterschrieben. Vor dem Landgericht in Konin habe sein Auftraggeber am 15. Oktober des Vorjahres ein Zeugnis von Franciszek Ksawery Kęszycki, Marschall des Krontribunals, vom 13. Oktober vorgelegt und um Aufschub gebeten. Das Landgericht habe das Zeugnis nicht beachtet und Aufschub und Antrag nicht zugelassen; der Vertreter habe sich, ohne Urkunden, zurückziehen müssen. Gosławski protestiert gegen das Landgericht und die Gegenpartei und kündigt an, die Aufhebung des Dekrets und der erwirkten Verurteilung zu betreiben.
app53170koningr118-014: 'Bericht des Gerichtsboten Bartłomiej Wrzask von Sławsk, eingetragen in Konin 1782, für Stanisław Ścibor Chełmski, Schatzmeister von Wschowa. Er hat eine königliche Ladung zum Ortstermin auf dem Grund des Gutes Grab zugestellt, ausgestellt in Petrikau am 26. November 1781. Geladen sind Antoni Prusimski, Starost von Niszczewice, sowie die Eheleute Bogdański: Ludwik, Landkämmerer von Kalisz, und Teresa, geborene Rozdrażewska, Erbin der Katarzyna Prusimska, geborene Rozdrażewska, Erbfrau von Grab. Sie sollen am 3. Juni 1782 vor dem Gericht des Ortstermins erscheinen, das ein Dekret des Krontribunals angeordnet hat. Chełmski verlangt die Zahlung der Summe, die der Kaufmann Tracholz ihm abgetreten hat, samt Zinsen; vier Untertanen aus Nowa Wieś sollen als Zeugen gestellt werden. Der Bote hat die Ladung am Freitag, dem Vorabend von Mariä Empfängnis 1781, in Trąbczyn hinterlegt.'
app53170koningr118-015: 'Überschrift eines Eintrags vom 25. Mai 1782: Chełmski, Schatzmeister von Wschowa, protestiert gegen ein Dekret des Krontribunals. Der Text wurde nicht geschrieben. Darunter haben Piotr Gosławski als Bevollmächtigter, auf seine Nachfrage wegen des Platzes, und Stanisław Ścibor Chełmski unterschrieben.'
app53170koningr118-016: 'Registervermerk vom 1. Juni 1782: Bericht über die Ladung, die Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, zum Ortstermin auf dem Gut Grab erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken.'
app53170koningr118-017: Protest von Jakub Pomian Górski, Grenzkämmerer der Woiwodschaft Inowrocław, gegen Stanisław Ścibor Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, eingetragen in Konin im Juni 1782 und von ihm unterschrieben. Górski war, von Prusimski beigezogen, zum Ortstermin zwischen Trąbczyn Minus oder Nowa Wieś und Łukom erschienen, den das Krontribunal in Petrikau mit seinem Dekret vom 23. Januar des laufenden Jahres angesetzt hatte, um Grenzhügel zu errichten; das Tribunal hatte den Grenzstreit nach der Karte entschieden und über zwei einander widersprechende Kommissionsdekrete befunden. Als er das Dekret nach der vom Tribunal in die Karte eingetragenen Linie vollziehen wollte, widersetzte sich Chełmski persönlich mit seinem Gefolge, stieß den Mann fort, der die Messkette zog, trat die Kette von der Linie, drohte und erklärte, er lasse eine weitere Berichtigung der Linie nicht zu. Górski brach die Amtshandlung ab, um beim Kriegsdepartement militärische Hilfe zu erwirken.
app53170koningr118-018: 'Registervermerk vom Juni 1782: Für Antoni Prusimski, Starost von Niszczewice, wird die Besichtigung eines Ortes auf Trąbczyner Erbgrund zur Eintragung vorgelegt, von zwei Adligen und einem Gerichtsboten auf Stempelpapier zu einem Silbergroschen aufgesetzt und von den Adligen eigenhändig unterschrieben; das Original liegt bei den vorgelegten Schriftstücken.'
app53170koningr118-019: 'Protest von Stanisław Ścibor Chełmski, Erbherr von Łukomia und Myszakowo, gegen Jakub Górski, Grenzkämmerer von Inowrocław, vom 15. Juni 1782, von Chełmski unterschrieben. Vollziehende Ämter hätten Dekrete des Krontribunals zu vollziehen, nicht auszulegen. Górski habe beim Ortstermin auf dem Grund von Trąbczyn die Regel des Tribunalsdekrets überschritten, sei vom Feldamt des Landes Dobrzyń abgewichen und habe sich in die Auslegung des Dekrets eingelassen. Er habe Chełmski beschrieben, als hätte dieser sich widersetzt, seine Amtshandlung ohne Zustimmung der Parteien auf unbestimmte Zeit vertagt und seine Akten wegen militärischer Hilfe an das Kriegsdepartement des Immerwährenden Rates geschickt, statt die Sache an das Tribunal zu verweisen. Chełmski erklärt Górskis Handlung für nichtig. Darunter ein Vermerk vom 16. August: Piotr Gosławski, Bevollmächtigter Prusimskis, hat vor Zeugen wegen des Platzes nachgefragt, für den keine Angaben und keine Abschrift geliefert worden waren.'
app53170koningr118-020: Eintrag vom 16. August 1782. Piotr Gosławski, Bevollmächtigter von Antoni Prusimski, Starost von Niszczewice, fragt mit zwei Adligen in der Kanzlei, ob der Bericht über die Zustellung einer Ladung in Trąbczyn, die Stanisław Chełmski gegen Prusimski vor das Krontribunal in Petrikau erwirkt haben soll, vor dem Amt erklärt worden ist. Das Amt bescheinigt, dass ein solcher Bericht nicht vorliegt und nicht herausgegeben werden kann. Gosławski hat unterschrieben.
app53170koningr118-021: 'Registervermerk von 1782: Bericht über die Ladung, die Stanisław Chełmski, Schatzmeister von Wschowa, gegen Antoni Prusimski, Starost von Niszczewice, und Jakub Górski, Grenzkämmerer von Inowrocław, vor das Krontribunal in Petrikau erwirkt hat.'
app53170koningr118-022: 'Registervermerk vom September 1782: Bericht über die Zustellung der Ladung, die Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, gegen Jan Alojzy Orłowski, Kämmerer des Landes Dobrzyń, und gegen Abt Benedykt Lubstowski und den ganzen Konvent von Ląd vor das Krontribunal in Petrikau erwirkt hat.'
app53170koningr118-023: 'Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 21. September 1782. Er hat drei Ausfertigungen einer königlichen Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am Montag nach St. Bartholomäus 1782. Geladen sind Kazimierz Zakrzewski, Landrichter von Brześć Kujawski, und seine Söhne Nepomucen, Ignacy und Ludwik aus der Ehe mit der verstorbenen Marianna Prusimska; deren Söhne erster Ehe Paweł und Józef Tomicki; Franciszek Tworowicz und Elżbieta, Frau von Jakub Taczanowski, Kinder der verstorbenen Wiktoria Prusimska; und Kunegunda Kołaczkowska, Tochter der verstorbenen Konstancja Prusimska und des Jan Kowalski. Geladen sind ferner die Amtsträger des Kalischer Landgerichts: der Richter Stefan Leszczyc Zielonacki, der Unterrichter Andrzej Bogdański, der Notar Xawery Mikorski und der Kämmerer Ignacy Rapacki. Kläger ist Antoni Prusimski von Kolno, Starost von Niszczewice: Sohn des verstorbenen Stefan Prusimski und der Wiktoria Malczewska, Enkel von Krzysztof Prusimski und Teresa Golińska, Neffe von deren Söhnen Jan, Bogumił, Antoni und Paweł Prusimski und nach dem kinderlosen Tod von Antoni und Paweł deren einziger Rechtsnachfolger. Er beruft sich auf ein Tribunalsdekret von 1738, das den Eheleuten Kowalski die Erbfolge nach Jan und Bogumił Prusimski absprach, und auf dessen Bestätigung durch ein Dekret von 1760. Er verlangt, die Dekrete des Landgerichts aufzuheben, ihn von dem Anspruch auf die Erbfolge nach Antoni und Paweł Prusimski freizusprechen und den Geladenen ewiges Schweigen aufzuerlegen: Töchter, die der Vater ausgestattet hat, könnten von den Brüdern nichts fordern. Die Ausfertigungen wurden in den Gutshöfen von Zieleniec und Mostki und in Konin im Haus der Bürgerin Wiśniewska hinterlegt, wo die Kanzlei des Landgerichts ist.'
app53170koningr118-024: 'Registervermerk vom September 1782: Bericht über die Ladung, die der Konvent von Ląd gegen Antoni Prusimski, Starost von Niszczewice, vor das Krontribunal in Petrikau erwirkt hat; eine Abschrift liegt bei den vorgelegten Schriftstücken.'
app53170koningr118-025: 'Bericht des Gerichtsboten Mateusz Matuszkiewicz von Szetlewek, eingetragen in Konin 1782. Er hat Stanisław Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, und anderen eine Ladung vor das Burggericht Kalisz zugestellt, auf Betreiben von Antoni Prusimski von Kolno, Starost von Niszczewice: wegen der Strafen für verübte Gewalttaten samt der Festnahme von Leuten. Er hat sie im Gutshof von Łukom in Gegenwart des Geladenen hinterlegt.'
app53170koningr118-026: Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 7. Dezember 1782, für Antoni Prusimski von Kolno, Starost von Niszczewice. Mit zwei Adligen, Adam Milewski und Jan Wilgiewicz, war er am 4. des laufenden Monats im Trąbczyner Kiefernwald. Links der Linie, die nach dem Dekret des Tribunals und des Ortstermins ausgehauen und mit Pflöcken bezeichnet ist, zählte er 221 gefällte Baukiefern, nach seiner Angabe am 28. November des laufenden Jahres von Leuten aus Łukomia, Łomów und anderen Gütern Chełmskis geschlagen und auf dessen Güter fortgeschafft, bis auf sieben Klötze. Nach seiner Angabe geschah es auf Befehl Chełmskis.
app53170koningr118-027: Protest vom 7. Dezember 1782, auf Polnisch, von Leon Maszewski, Verwalter von Trąbczyn, auf Befehl seines Herrn Antoni Prusimski von Kolno, Starost von Niszczewice, der selbst nicht vor den Büchern erscheinen konnte, gegen Stanisław Chełmski, Schatzmeister von Wschowa, dessen Diener Jaroszewski und andere; Maszewski hat im Namen seines Herrn unterschrieben. Chełmski wisse aus den Dekreten des Tribunals und des Ortstermins dieses Jahres, dass die Linie von der Ecke von Trąbczyn, Łukom und Drzewce bis zur Ecke mit Biskupice, vom Tribunal in die Karte gezogen und vom Geometer in Chełmskis Gegenwart im Gelände ausgehauen und abgepflockt, Trąbczyn von Łukomia scheidet. Dennoch habe er seine Leute aus Łomów und Łukom, die der Protest mit Namen nennt, mit Schlitten, Pferden, Ochsen und Äxten in den Kiefernwald links der Linie geschickt, der zu Trąbczyn gehört; sie hätten eine große Zahl Kiefern gefällt und nach Łukomia gebracht. Chełmskis Leute seien außerdem in Trąbczyn eingefallen, hätten Leute aus Trąbczyn auf der Straße angegriffen und andere Gewalttaten verübt.
app53170koningr118-028: 'Registervermerk vom Dezember 1782: Das Grenzdekret des Ortstermins zwischen den Gütern Trąbczyn und Łukom, ergangen zwischen Antoni Prusimski, Starost von Niszczewice, Stanisław Chełmski, Schatzmeister von Wschowa, und anderen, mit der Beschreibung der Grenzhügel, wird zur Eintragung vorgelegt und liegt bei den vorgelegten Schriftstücken.'
app53170koningr118-029: 'Registervermerk vom Dezember 1782: Für Antoni Prusimski, Starost von Niszczewice, liegt die Übergabe des Trąbczyner Olęders Martin Hunt bei den vorgelegten Schriftstücken, vorgenommen von Józef Łukaszewicz, Kommissar der großpolnischen Woiwodschaften.'
app53170koningr119-001: 'Bericht des Gerichtsboten Stanisław Stachowski von Łukomia, eingetragen in Konin im März 1783. Er hat eine Ladung des großpolnischen Generalstarosten Kazimierz Raczyński vom 10. März 1783 vor das Burggericht Kalisz zugestellt: an Antoni Prusimski, Starost von Niszczewice und Erbherrn von Trąbczyn, und an dessen Verwalter Leon Maszewski, auf Betreiben von Stanisław Chełmski, Schatzmeister von Wschowa und Erbherr von Łukom, und dessen Verwalter Ignacy Jaroszewski. Maszewski sei in den Kiefernwald eingefallen, den die Linie des nachkommissarischen Dekrets auf der Karte samt einem Olęder dem Gut Łukom belassen habe, und habe Chełmskis Leuten, die dort nur das nötige Holz holten, Ochsen, Wagen und Äxte abgenommen. Genannte Leute aus Trąbczyn und Nowa Wieś werden mit der Ladung unter Arrest gestellt; auch Prusimski soll bestraft werden, falls die Gewalttaten auf seinen Befehl geschahen. Der Bote hat die Ladung im Vorwerk von Nowa Wieś hinterlegt.'
app53170koningr119-002: Bericht des Gerichtsboten Jan Bekierski von Węgierce, eingetragen in Konin im März 1783. Er hat Antoni Prusimski, Starost von Niszczewice, eine Ladung des Generalstarosten vom 10. März 1783 vor das Burggericht Kalisz zugestellt, auf Betreiben von Stanisław Chełmski und dessen Verwalter Ignacy Jaroszewski. Prusimski soll bestraft werden wegen eines Einfalls mit Leuten und Hunden in das Gut Łomowo, das zu Chełmskis Hauptgut Łukom gehört, und wegen dort verübter Gewalttaten, und den Schaden ersetzen. Der Bote hat die Ladung bei den Olędern von Trąbczyn im Haus eines Mathias hinterlegt, in Gegenwart von dessen Frau.
app53170koningr119-003: Eintrag vom 18. März 1783. Der Gerichtsbote Stanisław Stachowski von Łukomia fragt im Namen von Stanisław Chełmski, Schatzmeister von Wschowa, ob die Berichte über zwei Ladungen, die Antoni Prusimski, Starost von Niszczewice, gegen Chełmski vor das Burggericht Kalisz erwirkt und nach Łukomia hat bringen lassen, vor dem Amt erklärt worden sind. Das Amt hat das Register vom 26. November 1782 bis zu diesem Tag durchgesehen und nur einen Bericht vom 29. November gefunden, erklärt vom Gerichtsboten Matuszkiewicz von Podbiele; es bescheinigt, dass weitere nicht vorliegen. Stachowski hat für sich und seinen Herrn unterschrieben.
app53170koningr119-004: Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 18. März 1783. Er hat eine Ladung vor das Burggericht Kalisz zugestellt, die Antoni Prusimski von Kolno, Starost von Niszczewice, mit Leon Maszewski, Franciszek Liberacki und anderen gegen Stanisław Chełmski, Schatzmeister von Wschowa, und andere erwirkt hat. Er hat sie am Vortag im Gutshof von Łukom in Gegenwart des Geladenen hinterlegt.
app53170koningr119-005: Bericht des Gerichtsboten Bartłomiej Szepczyński von Trąbczyn vom 22. Mai 1783. Er hat Stanisław Chełmski, Schatzmeister von Wschowa, eine Ladung des Generalstarosten Kazimierz Raczyński vom 15. Mai 1783 vor das Burggericht Kalisz zugestellt, auf Betreiben von Antoni Prusimski von Kolno, Starost von Niszczewice. Es geht um eine Strafe von vierzehn polnischen Mark, die an die Kasse des Instigators des Krontribunals in Petrikau gezahlt wurde; das deswegen aus dem Strafregister gegen Prusimski erwirkte Verfahren soll aufgehoben und Prusimski freigesprochen werden. Der Bote hat die Ladung im Gutshof von Łukom hinterlegt.
app53170koningr119-006: Bericht des Gerichtsboten Stanisław Stachowski von Łukomia, eingetragen in Konin im Mai 1783. Er hat eine Ladung vor das Burggericht Kalisz zugestellt, die Stanisław Chełmski, Schatzmeister von Wschowa, und andere gegen Antoni Prusimski von Kolno, Starost von Niszczewice, und andere erwirkt haben. Er hat sie im Vorwerk von Nowa Wieś hinterlegt.
app53170koningr119-007: 'Protest von Antoni Prusimski von Kolno, Starost von Niszczewice, gegen Stanisław Chełmski, Schatzmeister von Wschowa, eingetragen in Konin im Oktober 1783 und von ihm unterschrieben. Chełmski habe ihn vor das Landgericht in Konin geladen, damit er Leute stelle, von denen einige in seinem Dienst stehen und andere bei ihm nicht zu finden sind, und damit er wegen einer angeblich verübten Gewalttat bestraft werde. Prusimski erklärt: Sollte die Gewalttat von diesen Leuten begangen worden sein, so geschah sie ohne sein Wissen und ohne seinen Befehl; stellen könne er nur zwei der in der Ladung Genannten, Gregor und Thomas; die anderen habe der Arrest nicht erreicht. Er bietet an, sich auch durch Zeugenverhöre zu reinigen, und will wegen der unbegründeten Belästigung Strafen fordern.'
app53170koningr119-008: Eintrag vom 15. September 1784. Leon Maszewski, Kommissar der Trąbczyner Güter, fragt im Namen von Antoni Prusimski von Kolno, Starost von Niszczewice, ob der Bericht über eine Ladung vor das Krontribunal in Petrikau, die Stanisław Ścibor Chełmski, Schatzmeister von Wschowa, erwirkt hat und die am Donnerstag nach Mariä Geburt des laufenden Jahres nach Trąbczyn gebracht wurde, vor dem Amt erklärt worden ist. Das Amt hat sein Register durchgesehen und bescheinigt, dass ein solcher Bericht nicht vorliegt. Maszewski hat im Namen Prusimskis unterschrieben.
app53170koningr120-001: 'Eintrag vom 14. März 1785 im Buch des Burggerichts Konin. Andrzej Kinos, ein Untertan aus dem Dorf Trąbczyn, zeigt dem Amt seine Verletzungen: das rechte Auge ringsum blutunterlaufen, darunter geschwollen und blau, das linke Auge blutunterlaufen und blau, das ganze Gesicht geschwollen, die rechte Schulter geschwollen. Er gibt an, Marcin Sarzyński habe sie ihm am vergangenen Samstag mit Fäusten und einem Stock zugefügt, als er ihm im Dorf Obory auf öffentlicher Straße den Weg zur Stadt Pleszew versperrte.'
app53170koningr120-002: 'Bericht des Gerichtsboten Sebastian Biegański von Sławsk, eingetragen in Konin Ende 1786. Er hat Antoni Prusimski von Kolno, Starost von Niszczewice, eine königliche Ladung vor das Krontribunal in Petrikau zugestellt, ausgestellt in Petrikau am 2. Oktober 1786, auf Betreiben von Stanisław Chełmski, Schatzmeister von Wschowa. Prusimski soll unter Eid angehalten werden, eine bestimmte Urkunde vorzulegen, die bei ihm verblieben sei: den mit dem Kaufmann Jan Tracholz geschlossenen Vertrag über den Verkauf eines Eichenwaldes. Er soll ferner dafür bestraft werden, dass er die Sache vom Gericht des Ortstermins an das volle Landgericht und von dort an das Tribunal hat verweisen lassen; die Dekrete des Kalischer Landgerichts in Konin, die den Ortstermin ansetzen, sollen vollzogen werden. Der Bote hat die Ladung im Gutshof von Trąbczyn hinterlegt.'
app53170koningr121-001: 'Eintrag vom 9. Juni 1788 im Buch des Burggerichts Konin. Ludwik Żurawski, im Dienst von Antoni Prusimski von Kolno, Starost von Niszczewice und Erbherr von Trąbczyn, führt dem Amt ein Gespann vor: einen Wagen, vorn mit unbeschlagenen und hinten mit beschlagenen Rädern, zwei Ochsen, eine Kuh und eine kastanienbraune Stute. Das Gespann gehört Marcin Gryndel, einem Bauern aus Łomowo, einem Gut von Chełmski, Schatzmeister von Wschowa, das zu dessen Hauptgut Łukom gehört. Gryndel war in den Kiefernwald gefahren, der zu Prusimskis Erbgut Trąbczyn gehört und nie strittig war, und fuhr von dort schon einen gefällten, zum Bauen tauglichen Baum nach Hause; der Trąbczyner Waldhüter hielt ihn im Wald an. Nach der Vorführung überlässt Żurawski Tiere und Wagen bei der Kanzlei zur Herausgabe an Gryndel, der sie sofort verlangt; darüber ist am selben Tag eine Quittung eingetragen.'
app53170koningr136-001: 'Bericht des Gerichtsboten Bartłomiej Szeptycki von Trąbczyn, am 12. Juli 1754 in die Akten des Burggerichts Konin eingetragen, mit der Besichtigung, die er am 9. Juli auf Verlangen der Katarzyna Prusimska, geborene Rozdrażewska, vorgenommen hatte. Sie ist die Witwe des kurz zuvor verstorbenen Paweł Prusimski, königlichen Kämmerers und Erbherrn von Trąbczyn, und hat an allen seinen Gütern ihr Leibgedinge und ein lebenslanges Nutzungsrecht. Die Besichtigung beschreibt die Gebäude des Gutshofs in Trąbczyn eines nach dem anderen: Das alte Herrenhaus ist nicht mehr zu reparieren, ein neues ist im Rohbau fertig; es folgen Küche, vier Scheunen, Schafstall, Speicher, Ställe, Brennerei und Mälzerei mit ihrem Gerät. In Nowa Wieś sitzen fünfzehn Olęder, die sechzehnte Hufe ist leer. Eine Aufstellung zählt die dienstpflichtigen Leute in Trąbczyn, Osiny, Łazy und Nowa Wieś nach Vollbauern, Halbbauern, Häuslern und Einliegern. Zwei Adlige, Kazimierz Świerczewski und Józef Puchalski, bezeugen mit ihrer Unterschrift, dass in den Kiefernwäldern von Trąbczyn von Osiny bis zur Grenze von Biskupice und um Łazy die besseren Stämme gefällt oder herausgesucht sind und nur Ausschuss steht, ebenso bei den Eichen, außer wo die Olęder das Holz auf ihren Hufen genommen haben. Die Beschreibung der Dorfhäuser im mittleren Teil des Eintrags ist nicht transkribiert.'
app53170koningr145-001: Dekret einer Grenzkommission, am 23. September 1776 in die Burggerichtsakten von Brześć Kujawski eingetragen und nach einem Auszug daraus in das Gerichtsbuch von Konin übernommen. Die Kommission war durch einen Beschluss des Reichstags eingesetzt, der am 1. Juni 1774 in Warschau zu den Akten gegeben wurde, um den seit Jahrzehnten geführten Grenzstreit zwischen Trąbczyn, dem Gut des Antoni Prusimski, Starost von Niszczewice, und Łukomia, dem Gut der Brüder Chełmski, endgültig zu entscheiden. Sie trat am 13. September 1775 unter dem Vorsitz von Ludwik Dąmbski, Woiwode von Brześć Kujawski, im Wald auf dem strittigen Grund zusammen. Ein Streit darüber, welcher Kommissar die Feder führen solle, spaltete das Gericht; ein Vergleich, den es den Parteien vorschlug, kam nicht zustande, und es verhandelte geteilt weiter. Prusimski führte das Gericht seine Grenzlinie entlang, an Wegen, Grenzhügeln, eingekerbten Bäumen, Waldstücken und einem Teichgrund vorbei, und berief sich auf Urkunden und beeidete Zeugenverhöre. Das Gericht prüfte auch die Linie Chełmskis, erkannte Prusimskis Grenzlinie als die bessere an, ließ zwischen Trąbczyn und Łukomia und zwischen Trąbczyn und Biskupice neue Grenzhügel aufwerfen und legte Prusimski auf, sie auf dem letzten Hügel mit sechs Zeugen zu beschwören. Stanisław Chełmski wurde wegen der Übergriffe auf Trąbczyner Grund und wegen eines bewaffneten Überfalls auf das Wirtshaus an der Landstraße, bei dem in das Haus geschossen und es angezündet wurde, zu zwei Wochen Turmhaft in Konin und zu Bußen an Prusimski verurteilt, dazu zu 8.000 polnischen Gulden für gefälltes Holz und andere Schäden. Die Fortsetzung der Grenze gegen Biskupice wurde auf den 21. Mai 1776 vertagt. Sechs Kommissare und der Kalischer Grenzvermesser Wojciech Czarnecki, der die Hügel aufwarf, unterzeichnen.
app53170koningr153-001: 'Dekret des Feldgerichts von Franciszek Ksawery Jasiński, Grenzkämmerer der Woiwodschaft Gnesen, begonnen am 28. November 1782 auf dem Grund von Trąbczyn bei den drei Eckhügeln von Trąbczyn Minus oder Nowa Wieś, Łukom und Drzewce. Es rückt das Dekret des Krontribunals in Petrikau vom 17. Oktober 1782 zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa, im Wortlaut ein; geladen waren auch die Grenzkämmerer Jakub Górski von Inowrocław und Alojzy Orłowski vom Land Dobrzyń sowie Abt Lubstowski und der Konvent von Ląd. Das Tribunal hält fest: Die von den Ständen eingesetzte Kommission hatte den Grenzstreit durch zwei einander widersprechende, in Abwesenheit ergangene Dekrete entschieden; nach dem Gesetz von 1776 kamen beide Parteien vor das Tribunal, das am 23. Januar 1782 endgültig entschied. Jenes Dekret bestimmte den Eckpunkt von Trąbczyn und Łukom mit Drzewce und den Endpunkt mit Biskupice so, wie die Karte sie zeigt, und bestätigte darin das Dekret der von Prusimski beigezogenen Kommissare; dazwischen zog es auf der Karte eine gerade Linie, vom Präsidenten und vom Marschall unterschrieben. Die Olęder, die Chełmski in Besitz genommen hatte, waren Prusimski zurückzugeben, bis auf einen, Martin Hunt, der Chełmski belassen wurde; das geschah am 6. März und wurde am 18. März in Konin eingetragen. Beim Ortstermin am 27. Mai zog der vereidigte Geometer die Linie; Hunt lag aber nicht auf der Chełmski zugesprochenen rechten Seite, und die beiden Feldämter gingen auseinander: Das von Dobrzyń verwies die Sache an das Tribunal zurück, das von Inowrocław wollte die Linie so verbessern, dass die Stelle einer vor vier Jahren abgebrannten Olęder-Stelle rechts bliebe, was Chełmski ablehnte. Das Tribunal entscheidet: Ein vereidigter Geometer hat nur Grenzzüge und Grenzzeichen zu vermessen, Häuser trägt er bloß der Lage nach ein; das Dekret vom 23. Januar ist unabänderlich und zu erfüllen, die Akten beider Feldämter werden aufgehoben. Binnen sechs Wochen soll ein Unterkämmerer oder Kämmerer mit einem vereidigten Geometer auf dem Grund erscheinen, die Linie von den drei Eckhügeln bis zum Endpunkt mit Biskupice ziehen lassen und nur Wandhügel errichten; was rechts der Linie liegt, gehört zu Łukom, was links liegt, zu Trąbczyn oder Nowa Wieś; die 1775 von Chełmskis Kommissaren errichteten Hügel sind alle, die von Prusimskis Kommissaren errichteten Wandhügel ebenfalls zu schleifen. Weil Martin Hunt nicht rechts der Linie sitzt, hat Chełmski ihn binnen sechs Wochen vor dem Kommissar der großpolnischen Woiwodschaft in Prusimskis Besitz zu übergeben, bei Strafe der Verbannung. Chełmski soll Prusimski die schon zuerkannte Summe für die von den Olędern bezogenen Einkünfte samt Strafgeldern am 20. Januar 1783 in Posen zahlen. Górski, den Prusimski beigezogen hatte, wird wegen der eigenmächtigen Verbesserung der Linie zu einer Woche Turmhaft in der Burg Radziejów und zu einer Geldbuße an Chełmski verurteilt; Orłowski, den Chełmski beigezogen hatte, wegen der unbegründeten Rückverweisung zu einer Geldbuße an Prusimski. Der Konvent von Ląd wird von der geforderten Strafe freigesprochen: Sein Protest in Posen vom 26. Juni war nur vorsorglich und ist am 16. Oktober zurückgenommen worden. Der Vollzug: Am 29. November erschien Prusimski, Chełmski blieb aus; Prusimski legte die Karte mit der vom Präsidenten Sebastian Sierakowski und vom Marschall Ksawery Kęszycki unterschriebenen Linie vor, und der vereidigte Geometer Benedykt Woronowski, Kanoniker von Łęczyca, stellte die Linie mit Stangen her. Am 30. November, am 2. und am 3. Dezember ließ das Gericht entlang der Linie einundvierzig Wandhügel aufwerfen und im Sumpf namens Stawisko einunddreißig Pfähle aus Erle und Eiche einschlagen; am 2. Dezember erschien Chełmski persönlich. Der letzte Hügel steht zwölfeinhalb Ruten vor den Endhügeln von Trąbczyn, Łukom und Biskupice, die unberührt blieben; jeder Hügel misst sechs Ellen im Geviert und enthält als Zeichen fünf Steine in Kreuzform, Ziegelstücke, Glasscherben und Kohle. Danach ließ das Gericht die älteren Hügel schleifen und für nichtig erklären; Jasiński hat unterschrieben. Ein Vermerk hält fest, dass Leon Maszewski das Dekret am 7. Dezember 1782 dem Burgamt Konin vorgelegt hat und das Original in die Akten eingeheftet wurde.'
app53170koningr153-002: Urkunde vom 28. November 1782, aufgenommen in der Trąbczyner Olęder-Siedlung im Haus von Martin Hunt, in Gegenwart von Michał Brzeżański, Leon Maszewski und anderen; der Gerichtsbote Bartłomiej Szepczyński von Trąbczyn rief die Handlung aus. Das Kommissariatsamt der großpolnischen Woiwodschaft handelt nach dem Dekret des Krontribunals in Petrikau vom 17. Oktober desselben Jahres zwischen Antoni Prusimski, Starost von Niszczewice, und Stanisław Chełmski, Schatzmeister von Wschowa. Danach sitzt der Olęder Martin Hunt nicht rechts der vom Tribunal bestimmten Linie und kann nicht Chełmski gehören, der ihn bis dahin besaß; Chełmski sollte ihn binnen sechs Wochen vor dem Kommissar an Prusimski herausgeben. Auf Verlangen Prusimskis, der persönlich anwesend ist, übergibt der Kommissar Martin Hunt in dessen tatsächlichen Besitz und verpflichtet Hunt zum Gehorsam gegenüber Prusimski; niemand widerspricht. Józef Łukaszewicz, Generalkommissar der großpolnischen Woiwodschaft, hat unterschrieben.
app536017-001: Eintrag des Landgerichts in Konin von 1589, überschrieben damit, dass Łukomski eine Besichtigung durchzuführen hat. Albertus Trąmpczyński Otha hat als Kläger Thomas Łukomski zum zweiten Mal geladen, nachdem dieser beim ersten Mal ausgeblieben war. Er wirft ihm vor, er habe in diesem Jahr mit anderen Nachbarn im Gut des Dorfes Łukom einen Teich angelegt und durch zu starkes Aufstauen des Wassers eine große Menge Wald, Kiefernwald, unfruchtbare Weide und Wiesen in den Gütern der Dörfer Trąbczyn, Nowa Wieś und Osiny überschwemmt; ein polnischer Satz nennt Eichen, Buchen und Eschen, die zum Bauen und für Bienenbeuten taugten und durch die Überschwemmung abgestorben seien. Den Schaden schätzt der Kläger auf zehntausend ungarische Goldgulden und ebenso viel Schadenersatz. Das Gericht ordnet auf Antrag des Beklagten eine gerichtliche Besichtigung an und gibt einen Gerichtsboten bei, den der Beklagte wählt und bezahlt; er soll sehen, an welchem Ort und auf wessen Grund das Unrecht geschehen ist und ob es geschehen ist. Der Beklagte hat die Besichtigung binnen sechs Wochen am strittigen Ort durchzuführen, beide Parteien müssen anwesend sein, und bei den nächsten Gerichtsterminen in Konin haben sie einen letzten Termin, um das Ergebnis vor Gericht zu hören.
app536036-001: Versäumnisurteil des Landgerichts in Konin aus dessen Sitzung von 1644, überschrieben „Contumaces“. Jerzy Chełmski hat als Kläger die Brüder Marcin, Wojciech, Władysław und Andrzej Trąmpczyński, Söhne des verstorbenen Stanisław, und dessen Witwe Anna von Słończyce geladen, die an seinem Nachlass ihr Leibgedinge und ein lebenslanges Nutzungsrecht hat. Er wirft ihnen vor, sie hätten ihre Untertanen in seinen eigenen Wald beim Dorf Łukom geschickt und dort etwa achtzig Kerben nach Art von Grenzzeichen in Bäume schlagen lassen, um einen großen Teil seines Grundes ihrem eigenen zuzuschlagen. Den Schaden setzt er, den Grund selbst nicht gerechnet, auf tausend polnische Mark und ebenso viel Schadenersatz an und verlangt, dass die Zeichen nach Hinzuziehung des Unterkämmereramts getilgt werden. Die Beklagten wurden durch den Gerichtsboten Mikołaj Jaworowski von Karmin aufgerufen und erschienen im ersten Termin nicht; der Kläger verurteilte sie mit Zulassung des Gerichts in die Strafe des Ungehorsams. Der Gerichtsbote Bartłomiej Koelmarek von Łukom erklärt, er habe die Ladung am vergangenen Montag im Hof der Geladenen im Dorf Trąbczyn in Gegenwart des Gesindes niedergelegt.
app536036-002: Zweites Versäumnisurteil derselben Sitzung von 1644, gegen dieselben Beklagten und mit denselben Worten wie das erste. Jerzy Chełmski wirft den Trąmpczyński vor, sie hätten in den Wäldern, die zum Dorf und Gut Łukom gehören, vor kurzem etwa hundert zum Bauen taugliche Bäume, vor allem Kiefern, und etwa dreihundert Fuhren Brennholz schlagen lassen und nach Belieben verwendet. Den Schaden setzt er, den Grund selbst nicht gerechnet, auf dreihundert polnische Mark an. Für das Übrige verweist der Eintrag auf den vorangehenden.
app536040-001: Dekret des Landgerichts in Konin aus der Sitzung, die am Montag nach Septuagesima 1728 begann, überschrieben „Decretum Locationis“. Die Brüder Franciszek und Józef Ścibor Chełmski, Erbherren von Łukom und Łomowo, haben Krzysztof Prusimski als Hauptbeklagten, seinen Sohn Antoni, sechs namentlich genannte adlige Dienstleute und ungenannte Untertanen von Trąbczyn geladen; die Klage war schon zur Sitzung nach Trinitatis 1727 erhoben und damals nicht entschieden worden. Sie werfen Prusimski vor, er habe ohne Rücksicht auf nachbarliche Freundschaft hundert Schock Schindeln, die auf ihrem Grund gefertigt worden waren, samt einer Hütte verbrennen lassen, wobei Kinder, die in der Hütte lebten, beinahe verbrannt wären; er habe vier Arbeitsochsen, die für die Glashütte gehalten wurden, bei einem bewaffneten Überfall wegnehmen lassen und Józef Chełmski nach dem Leben getrachtet; und er habe, während die Kläger am Krontribunal in Piotrków waren, seinen Sohn, die Dienstleute und Untertanen bewaffnet auf Grund geschickt, der seit alters zu Łukom gehöre, und dort Heu in nicht geringer Zahl von Fuhren wegnehmen lassen. Beide Seiten erscheinen vor Gericht. Das Gericht befindet, dass ein vereidigter Kommissar der Woiwodschaften Posen und Kalisz, Wojciech Biskupski, auf den beide sich geeinigt haben, mit je zwei Freunden beider Seiten am Montag nach dem Sonntag Misericordia auf den strittigen Grund gehen muss; sie sollen über das Eigentum am Grund, die Gewalttaten und die Schäden alte, kundige Zeugen unter Eid vernehmen und alle Ansprüche entscheiden. Berufung ist nur gegen das Endurteil zulässig. Beide Parteien haben eine Buße von vierzehn polnischen Mark zu zahlen, halb an die Gegenseite und halb an das Gericht; wer dem Dekret nicht nachkommt, verfällt der Verbannung.
app536045-001: Dekret des Landgerichts in Konin aus dessen Sitzung von 1763 im Streit zwischen der Witwe Katarzyna Prusimska, geborene Rozdrażewska, mit Joseph Puchalski auf der einen und Stanisław Ścibor Chełmski mit einem Czajkowski auf der anderen Seite; beide Seiten klagen und sind zugleich geladen. Das Gericht hält eine Vernehmung beeideter Zeugen für nötig, lässt sie durchführen und die Aussagen verlesen. Danach hatte die Prusimska 1761 Pottaschebrenner mit Pottasche auf den Weg geschickt; Chełmski, der nach Posen reiste, traf sie bei Pyzdry, als sie nach Danzig zogen, ließ die Pottasche beschlagnahmen und in einem Wirtshaus in Pyzdry einlagern und legte beim Notar des Zollamts Arrest darauf. Die Brenner schafften sie trotz des Widerspruchs des Notars mit Hilfe der Adligen Wawrowski und Gotartowski fort und brachten sie nach Danzig. Weil zwischen den Parteien der Streit um die Grenze zwischen Trąbczyn und Łukom vor dem Krontribunal noch unentschieden ist und erst die Grenzziehung zeigen wird, auf wessen Grund die Pottasche hergestellt wurde, setzt das Gericht die Entscheidung aus und ordnet an, den Parteien die Zeugenaussagen aus der Kanzlei in verschlossener Rolle herauszugeben.
app536046-001: Dekret des Landgerichts in Konin aus der Sitzung, die am 20. Oktober 1777 begann, Eintrag Nr. 16. Stanisław Chełmski, Erbherr von Łukomia, verlangt als Kläger von Antoni Prusimski, Starost von Niszczewice, die Vorlage eines Akts, der wie ein Grenzakt zwischen den Gütern Łukom und Trąbczyn von Kommissaren der Stände erlassen worden sei. Er legt drei Nachsuchen vor, in Kalisz vom Samstag nach Mariä Opferung 1776, in Kościan vom 2. Januar und in Konin vom Oktober des laufenden Jahres, und beweist damit, dass der Akt nicht in den Akten der eigenen Woiwodschaft steht. Prusimski legt seinerseits eine Nachsuche vor, die am 10. Oktober 1777 beim Burggericht Brześć Kujawski vorgenommen und am 16. Oktober in Konin eingetragen wurde, und zeigt, dass das Dekret der Kommission 1776 in Brześć Kujawski eingetragen worden ist. Weil Rechte, Vergleiche und Dekrete in der eigenen Woiwodschaft vorzulegen sind, verpflichtet das Gericht Prusimski, das Dekret binnen vier Wochen bei den Burgakten in Konin eintragen zu lassen, bei Strafe der Acht. Die Lesung beruht auf einem Mikrofilm und ist an mehreren Stellen unsicher.
app536046-002: 'Dekret des Kalischer Landgerichts in Konin, Eintrag Nr. 17 der Sitzung, die am 20. Oktober 1777 begann, zwischen denselben Parteien wie der Eintrag davor: dem Kläger und dem Geladenen, der persönlich erschienen ist. Stanisław Chełmski klagt aus einer Übertragung, die am Mittwoch, dem Vorabend von Mariä Geburt 1768, vor dem Burggericht Pyzdry anerkannt wurde: Der Kaufmann Jan Tracholz hat ihm darin verschiedene Summen abgetreten, die er vom verstorbenen Paweł Prusimski forderte. Chełmski verlangt, dass Prusimski, Starost von Niszczewice, den Vertrag über den Verkauf des Trąbczyner Kiefernwaldes vorlegt, der mit Tracholz und Paweł Prusimski geschlossen wurde. Dem Gericht wird nachgewiesen, dass ein Dekret seiner früheren Sitzung vom Montag nach Septuagesima 1766 zwischen Tracholz und Antoni Prusimski die Sache auf einen Ortstermin verwiesen hat und dass es nicht ausgeführt worden ist. Das Gericht setzt deshalb die ganze Sache aus und hält auf Antrag der Parteien einen Ortstermin des Gerichts auf dem Grund von Trąbczyn für nötig, am Montag nach Laetare des kommenden Jahres. Der Richter, der dorthin geholt wird, soll Prusimski die Vorlage des Vertrags auferlegen, die Sache endgültig entscheiden, Zeugen verhören und Eide abnehmen. Die Parteien haben ihm bei Strafe der Acht zu gehorchen und zu laden, wen die Sache erfordert.'
app536047-001: 'Dekret des Kalischer Landgerichts in Konin von 1783, Eintrag Nr. 26 seiner Sitzung, zwischen Stanisław Chełmski, Schatzmeister des Landes Wschowa, als Kläger und Antoni Prusimski von Kolno, Starost von Niszczewice, als Geladenem. Chełmski hält Prusimski eine Verurteilung entgegen, die er 1780 beim Ortstermin auf dem Gut Grab wegen Verstoßes gegen ein Tribunalsdekret gegen ihn erwirkt hat. Prusimski weist sein Recht, gehört zu werden, nicht nach und unterwirft sich dem Ermessen des Gerichts; es legt ihm eine Geldbuße auf, lässt ihn zur Sache zu und ordnet Verhöre beeideter Zeugen an, weil es um Gewalttaten geht. Aus den Verhören ergibt sich: Leute vom Hof Prusimskis aus Trąbczyn kamen, vom Weg abgeirrt, zur Wüstung Smoleniec, die zu Chełmskis Erbgut Łukom gehört, ließen sich den Weg zeigen und fragten den Olęder Jan Kłonica, wem das Dorf gehöre. Als Kłonica sagte, diese Olęder gehörten Chełmski, schalt ihn Prusimskis Unterkutscher einen Lügner und schlug ihn mit der Peitsche; der Kutscher schlug ihn mit einem Kiefernstock, der dabei zerbrach, und der Unterkutscher schrie, man solle ihn totschlagen; Kłonica floh in ein Erlengehölz. Die Leute wandten sich darauf zum Haus des Olęders, holten dort gewaltsam einen Knecht, schlugen ihn und schlugen ihn weiter auf dem Weg zum Krug von Tomice; er kam erst am folgenden Tag nach Hause. Ein Zeuge beschwerte sich noch am selben Tag bei Prusimski, der denselben Weg kam; Prusimski versprach, die Sache zu Hause zu bereinigen. Die Taten geschahen auf Chełmskis eigenem Grund; ob mit Wissen oder auf Befehl Prusimskis, klären die Verhöre nicht, und Kutscher und Unterkutscher sind in Trąbczyn nicht zu finden. Beschuldigt sind nach den Verhören nur der Kutscher Józef und der Unterkutscher Walenty; Prusimski erklärt, er könne sie nicht stellen, und bietet einen Reinigungseid an. Das Gericht legt ihm auf, binnen sechs Wochen vor dem Burgamt Konin zu beschwören, dass der von Chełmski erwirkte Arrest die beiden nicht erreicht hat und er sie nicht stellen kann, bei Strafe der Verbannung. Die Verhörprotokolle bleiben in der Kanzlei und werden den Parteien gegen Quittung herausgegeben.'
app536047-002: 'Dekret des Kalischer Landgerichts in Konin, Eintrag Nr. 43 der Sitzung, die am 3. Mai 1784 begann. Parteien sind Michał Drogosław Skórzewski, Unterkämmerer von Posen und Erbherr von Biskupie oder Bystrzyca, und Stanisław Ścibor Chełmski, Schatzmeister von Wschowa und Erbherr von Łukomia und Łomowa, jeder zugleich Kläger und Geladener; mit ihnen geladen sind Franciszek Stadnicki, Starost von Ostrzeszów, samt seinen Kindern mit der verstorbenen Teresa, geborene Wężyk, und Prusimski, Starost von Niszczewice und Erbherr von Trąbczyn. Prusimski wird die Verurteilung entgegengehalten, die Chełmski beim Ortstermin in Grab am 11. September 1780 wegen Zuwiderhandlung gegen das Tribunalsdekret erwirkt hat. Eine am Donnerstag nach Cantate 1783 in Pyzdry ausgestellte Vollmacht wird als ausreichend befunden; Prusimski weist sein Recht, gehört zu werden, nicht nach und unterwirft sich dem Gericht, das ihn gegen Zahlung einer halben Buße an die Gegenseite und einer Viertelbuße an das Gericht zulässt. Zur Sache: Weil die Parteien einander wegen der Abgrenzung von Biskupice oder Bystrzyca gegen Łomowa oder Łukom vor Gericht gebracht haben, hält das Gericht einen Ortstermin auf dem strittigen Grund für nötig, am 16. Juli des laufenden Jahres. Für die Grenze sollen die Parteien den Unterkämmerer des Kalischer Distrikts oder sein Feldamt gewinnen; für die Gewalttaten und Schäden sollen sie das Gericht selbst oder einen der Kämmerer beiziehen, der untersuchen, Eide abnehmen und den Ersatz festsetzen soll. Die Parteien haben bei Strafe der Verbannung zu gehorchen und auch die Anrainer zu laden.'
app5371057-001: 'Erbpachtvertrag: Triebenfeld als Bevollmächtigter des Fürsten zu Hohenlohe Ingelfingen verleiht dem Einsassen Christoph Erbet aus dem Hauland von Trąbczyn eine Magdeburger Hufe im Trąbczyner Wald gegen 100 Rthl Einkaufsgeld und 30 Rthl jährlichen Erbzins. Nach drei Freijahren sind zu Weihnachten 1809 15 Rthl fällig. Beigefügt sind die Generalvollmacht vom 19. Februar 1805 und die Ausfertigung vom 23. Mai 1806. Hawich übergibt 1811 die Akten dem Friedensgericht des Kreises Konin und bittet, 9 Rthl 18 dgl Kosten von Erbet einzutreiben.'
app539680801-001: 'Abschrift der Generalvollmacht des Fürsten zu Hohenlohe-Ingelfingen für den Kriegs- und Forstrat von Triebenfeld, ausgestellt im Guhrwitzer Justizamt bei Breslau am 19. Februar 1805. Triebenfeld darf den Fürsten in allen Angelegenheiten seiner Güter Zagórów, Witów und Trąbczyn im Kalischer Departement vertreten, sie mögen Parzellierung, Verkauf, Verpachtung oder Verpfändung betreffen: bei der Kammer und der Regierung in Kalisch Anträge stellen, sich mit den Pächtern auseinandersetzen, Gelder zahlen und empfangen und den Beamten der Güter Befehle erteilen und sie suspendieren. Der Fürst verspricht, alles zu genehmigen und ihm die Kosten zu erstatten. Das Justizamt bezeugt am selben Tag seine Unterschrift; das Patrimonialgericht auf Trąbczyn beglaubigt die Abschrift am 21. März 1806.'
app539680801-002: 'Abschrift des Konsenses, den die Südpreußische Kriegs- und Domänenkammer in Kalisch am 28. Januar 1806 im Namen des Königs erteilt, auf Kabinettsordres vom 22. Oktober und 7. Dezember des Vorjahres. Der Fürst zu Hohenlohe-Ingelfingen darf die Vorwerke Drzewce, Kopojno, Świątniki, Święcia und Broniki der Herrschaft Zagórów sowie Nowa Wieś, Przybysław, Stara Huta und einen Teil von Trąbczyn parzellieren, Oleśnica und Szetlewek vererbpachten und die Dienste aller Untertanen in einen festen Geldzins verwandeln; einen Teil von Trąbczyn, die Grundstücke in Mariantów und einen Teil des Forstes behält er zurück. Vier Bedingungen: Die Entschädigung der Untertanen für ihre Hütungs- und Holzungsrechte ist festzusetzen; keine Bauernstelle darf eingehen; die staatlichen Abgaben bleiben und werden im Hypothekenbuch gesichert; die Holzungsrechte des Klosters und der Propstei Ląd werden im Hypothekenbuch gesichert, und reichen die vorbehaltenen Forsten für die Holzungsrechte des Domänenamts Ratyń nicht aus, ist eine jährliche Entschädigung festzusetzen.'
app539680801-003: Abschrift eines Erbpachtvertrags, dessen Anfang fehlt. Der Fürst zu Hohenlohe-Ingelfingen überlässt durch seinen Generalbevollmächtigten von Triebenfeld achtzehn namentlich genannten Einsassen 100 Magdeburger Hufen Wald seines Gutes Drzewce auf ewige Zeiten; sechzehn nehmen je 5 Hufen, zwei je 10. Einkaufsgeld wird nicht gezahlt, weil das Land erst zu roden ist; zum Roden gelten vier Freijahre bis Weihnachten 1808. Danach beträgt der Erbzins 30 Reichstaler je Hufe, zusammen 3000 Reichstaler jährlich, zahlbar zu Johanni und zu Weihnachten; die Hälfte ist ablösbar. Bei jedem Verkauf fällt der zehnte Groschen an die Herrschaft. Die Erbpächter sind frei von Erbuntertänigkeit und Hofdiensten, unterstehen aber der Gerichtsbarkeit der Herrschaft, müssen Bier und Branntwein von ihr nehmen und haften solidarisch. Die Gemeinde erhält 21 Morgen zinsfrei für Schullehrer, Schulzen und Kirchhof. Elf der achtzehn unterzeichnen mit drei Kreuzen. Das Patrimonialgericht fertigt den Vertrag in Mariantów am 21. März 1806 aus.
ihagrrep7cnr1414-001: Konzept eines Schreibens des Departements der auswärtigen Angelegenheiten, Berlin, 11. Januar 1797, an den Minister Graf von Hoym und gleichlautend an den Minister Freiherr von Schroetter; eine größere Hand fügt den Großkanzler von Goldbeck hinzu, und drei Reinschriften werden angeordnet. Das Departement teilt in Abschrift mit, was der königliche Resident in Venedig, Graf von Cattaneo, auf Verlangen des Anton Prusimski berichtet hat, eines Eingesessenen der von der ehemaligen Republik Polen erworbenen Provinzen, der sich gegenwärtig in Venedig aufhält. Von den beiden Unterschriften ist die zweite die des Ministers Haugwitz. Am 12. gingen alle Schreiben zur Post.
ihagrrep7cnr1414-002: 'Auszug aus der Depesche Nr. 423 des Grafen Cattaneo, Venedig, 14. Dezember 1796, in französischer Sprache. Der polnische Edelmann Antoine Prusimski ist bei ihm erschienen, in wirklich zerrütteter Gesundheit und durch den Tod seiner Frau fast bis zur Stumpfheit getroffen, und hat um ein Attest über seine traurige Lage und darüber gebeten, dass er gegenwärtig und in dieser Jahreszeit nicht reisen könne. Cattaneo glaubte es ihm nicht verweigern zu können: Wer schon erschöpft sei, wenn er von einem Haus ins andere gehe, könne nicht von einem Land ins andere reisen. Das Departement erhielt den Auszug am 2. Januar 1797 und leitete ihn dem Herrn von Raumer zu; dieser verfügte am 8. Januar, Hoym und Schrötter zu benachrichtigen.'
ihagrrep7cnr1414-003: Schrötter dankt dem Departement der auswärtigen Angelegenheiten für die Nachricht vom 11. des Monats über Anton Prusimski, der in der neuen Erwerbung von Polen ansässig ist und sich gegenwärtig in Venedig aufhält. Er hat davon dem Staatsminister Graf von Hoym weiter Nachricht gegeben, weil nicht feststeht, ob Prusimski in Neuostpreußen oder in Südpreußen ansässig ist. Berlin, 29. Januar 1797. Das Departement erhielt das Schreiben am 8. Februar und legte es am 16. März zu den Akten.
ihagrrep7cnr3570-001: 'Akte zur Schenkung konfiszierter und vakanter Güter in Südpreußen an Offiziere. Hoym schlägt vor, dem Fürsten von Hohenlohe-Ingelfingen die dem Insurgenten Anton von Prusimski konfiszierten Güter zu verleihen: Kamionna, Kolno, Trąbczyn, Szetlewek, Nowawies, Lazy, Alt- und Neu-Laske, Osiny, das Hauland Trąbczyński und Brzyce. Die Kabinettsordre genehmigt dies sowie Güter für von Sanitz, Blücher, von Dolffs, von Pontanus, von Holtzendorff und von Larisch. Enthalten sind der Entwurf der Schenkungsurkunde für den Fürsten und Hoyms Wunsch nach der Klausel „cum appertinentia“.'
ihagrrep7cnr3705-001: v. Triebenfeld bittet als General Bevollmächtigter des Fürsten den König, der Regierung in Kalisz die Sequestration des Gutes Oleśnica (Herrschaft Trąbczyn und Zagórów) zu befehlen. Die Erbpächter Giese, Bagans und Gietzinger zahlten vom Erbstandsgeld (20000 Rthl) nur 10000 Rthl aus Geldern von Untererbpächtern. Seitdem schulden sie Zins und Abgaben und veräußern Gutsteile, während die Kammer den Vertrag nicht bestätigte. Er widerlegt die ablehnenden Resolutionen, verlangt die Abforderung der Akten und bietet Kaution an.
ihagrrep7cnr3709-001: Die Regierung zu Posen überreicht dem König eine Abschrift der Kabinettsordre, die in der Sache Prusimska gegen den Fürsten von Hohenlohe an sie ergangen ist. Die empfangende Behörde legt den Bericht am 23. Juni 1800 zu den Akten.
ihagrrep7cnr3709-002: 'Abschrift einer Kabinettsordre des Königs an die Regierung zu Posen, dort eingegangen am 16. Juni 1800: Durch eine beiliegende Beschwerde der von Prusimska veranlasst, fordert der König die Akten ihrer Sache gegen den Fürsten von Hohenlohe-Ingelfingen wegen des mütterlichen Vermögens der Bittstellerin ein, so wie sie liegen, und befiehlt, sie sofort einzusenden.'
ihagrrep7cnr3709-003: Die Regierung zu Posen überreicht dem König eine Abschrift der Kabinettsordre vom 1. Juli, eingegangen am 7. Juli, unter Bezug auf ihren Bericht vom 18. des Vormonats. Sie bemerkt, dass der Termin zur Beweisaufnahme und zum Schlussverfahren in der Sache der Michalina von Prusimska gegen den Fürsten zu Hohenlohe-Ingelfingen auf den 22. Juli ansteht. Die empfangende Behörde legt den Bericht am 1. August 1800 in Berlin zu den Akten.
ihagrrep7cnr3709-004: 'Abschrift einer Kabinettsordre des Königs an die Regierung zu Posen: Er sendet die mit dem Bericht vom 18. des Vormonats eingesandten Akten der Sache Prusimska gegen den Fürsten zu Hohenlohe-Ingelfingen zurück. Die Regierung soll die Instruktion, die durch zu viel Nachsicht gegen den Bevollmächtigten des Beklagten sehr verzögert worden sei, mit allem Fleiß beenden und dann angemessene Vergleichsvorschläge machen lassen. Kommt der Vergleich nicht zustande, soll sie für ein rasches Urteil sorgen, besonders falls nach den Gesetzen nochmals in erster Instanz erkannt werden müsste.'
ihagrrep7cnr3709-005: 'Der Fürst von Hohenlohe schreibt dem Großkanzler: Die minderjährige Michalina von Prusimska hat bei der Regierung zu Posen gegen ihn auf Herausgabe der ihm vom König geschenkten Brzycer Güter geklagt; die Sache soll nun zum Spruch vorgelegt werden. Da das Pupillenkollegium zu Posen den Prozess im Namen der Klägerin betreibt und seine Mitglieder zugleich Mitglieder der Regierung sind, also seine Richter wären, bittet er, das Urteil der Regierung zu Kalisch zu übertragen und ihr die Akten zuzuschicken. Die empfangende Behörde vermerkte darauf den 2. Dezember 1800.'
ihagrrep7cnr3709-006: Begleitschreiben des Fürsten von Hohenlohe an den Großkanzler zu seinem Bittschreiben vom selben Tag. Der Vergleichsvorschlag, den der Deputierte im letzten Termin gemacht hat, lasse ihn fürchten, dass die Regierung zu Posen nicht unbefangen urteilen werde. Das Lebtagsrecht des noch lebenden Vaters der Klägerin am Vermögen seiner verstorbenen Frau sei ein Teil des ihm konfiszierten Vermögens; der Deputierte habe dennoch bezweifelt, dass es dem Fiskus zustehe. Der Fürst bittet nochmals dringend, den Spruch der Regierung zu Kalisch oder einem anderen südpreußischen Kollegium aufzutragen.
ihagrrep7cnr3709-007: 'Verfügung von Amts wegen: Da die meisten Räte der Regierung zu Posen Mitglieder des dortigen Vormundschaftskollegiums sind, das die Klage des Vormunds der minderjährigen Michalina von Prusimska gegen den Fürsten von Hohenlohe-Ingelfingen auf Herausgabe der Brzycer Güter veranlasst hat und den Prozess leitet, soll die Sache in erster Instanz vom Plenum der Regierung zu Warschau und in zweiter Instanz vom Oberappellationssenat des Kammergerichts entschieden werden. Dies ist der Regierung zu Posen mitzuteilen; Reskripte ergehen auch an die Regierung zu Warschau und an den Senat.'
ihagrrep7cnr3709-008: 'Entwurf eines königlichen Reskripts an die Regierung zu Posen: Da die meisten ihrer Räte Mitglieder des dortigen Vormundschaftskollegiums sind, das die Klage des Vormunds der Michalina von Prusimska gegen den Fürsten von Hohenlohe-Ingelfingen auf Herausgabe der Brzycer Güter veranlasst hat und leitet, wird festgesetzt, dass die Sache in erster Instanz vom Plenum der Regierung zu Warschau und in zweiter vom Oberappellationssenat des Kammergerichts entschieden wird. Beide Kollegien sind am selben Tag angewiesen worden.'
ihagrrep7cnr3709-009: 'Entwurf eines königlichen Reskripts an die Regierung zu Warschau: Bei der Posener Regierung schwebt zwischen dem Vormund der minderjährigen Michalina von Prusimska und dem Fürsten von Hohenlohe-Ingelfingen ein Prozess auf Herausgabe der Brzycer Güter. Da das dortige Pupillenkollegium die Klage veranlasst hat und leitet und die meisten Posener Räte ihm angehören, soll die Sache in erster Instanz vom Plenum der Regierung zu Warschau entschieden werden. Die Regierung zu Posen ist benachrichtigt. Die Reskripte gingen am 13. zur Post.'
ihagrrep7cnr3709-010: 'Entwurf eines königlichen Reskripts an den Oberappellationssenat des Kammergerichts: Zwischen der minderjährigen Michalina von Prusimska und dem Fürsten von Hohenlohe-Ingelfingen schwebt bei der Posener Regierung ein Prozess auf Herausgabe der Brzycer Güter. Da das Posener Vormundschaftskollegium die Klage veranlasst hat und leitet und die meisten Posener Räte ihm angehören, soll die Sache in erster Instanz vom Plenum der Regierung zu Warschau und in zweiter Instanz vom Senat entschieden werden. Die Regierungen in Posen und Warschau sind angewiesen.'
ihagrrep7cnr3709-011: 'Entwurf einer Antwort an den Fürsten von Hohenlohe: Sein Wunsch, dass seine Sache mit dem Vormund der Michalina von Prusimska nicht von der Regierung zu Posen entschieden werde, sei schon dadurch begründet, dass die meisten dortigen Räte dem Vormundschaftskollegium angehören, das den Rechtsstreit veranlasst hat. Der Schreiber hat deshalb verfügt, dass in erster Instanz das Plenum der Regierung zu Warschau und in zweiter der Appellationssenat des Kammergerichts entscheidet. Warschau statt Kalisch habe er gewählt, weil der Posener Präsident Graf von Danckelmann kürzlich zur Regierung in Kalisch übergegangen ist.'
ihagrrep7cnr3709-012: 'Die Regierung zu Posen berichtet auf das Reskript vom 7., eingegangen am 16. Dezember: In der Sache des Vormunds der Michalina von Prusimska gegen den Fürsten von Hohenlohe-Ingelfingen ist bereits am 9. Dezember in erster Instanz erkannt worden, weil die Kabinettsordre vom 1. Juli die Beschleunigung besonders empfohlen hatte. Wird ein Rechtsmittel eingelegt, will sie die Akten an den Oberappellationssenat des Kammergerichts zur Entscheidung in zweiter Instanz einsenden. Die empfangende Behörde verfügt am 31. Dezember 1800, der Regierung zu Warschau mitzuteilen, dass das Reskript vom 7. Dezember keine Anwendung finde.'
ihagrrep7cnr3709-013: 'Entwurf eines königlichen Reskripts an die Regierung zu Warschau: Ihr war durch das Reskript vom 7. Dezember das Urteil erster Instanz im Prozess zwischen dem Vormund der Michalina von Prusimska und dem Fürsten von Hohenlohe-Ingelfingen wegen der Brzycer Güter aufgetragen worden. Die Posener Regierung hat aber angezeigt, dass sie das Urteil bereits am 9. gefällt hat, also vor Eingang der Verfügung; das Reskript findet daher keine Anwendung. Zur Post gegeben am 5. Januar 1801.'
ihagrrep7cnr3709-014: 'Entwurf eines Schreibens an den Fürsten von Hohenlohe, stark korrigiert und schlecht lesbar: Die Regierung zu Posen hat seine Sache gegen Michalina von Prusimska infolge der Kabinettsordre vom 1. Juli, die ihr den schnellen Betrieb empfahl, so beschleunigt, dass bereits erkannt war, als die Verfügung vom 7. Dezember dort einging. Es bleibt bei der Verfügung, dass die Akten zum Spruch in zweiter Instanz an den Oberappellationssenat des Kammergerichts eingeschickt werden.'
ihagrrep7cnr3709-015: 'Michalina Prusimska bittet den König auf Französisch um Beschleunigung: Vor achtzehn Monaten habe sie ihm in Posen eine Denkschrift überreicht und um das Vermögen gebeten, das ihr nach dem Tod ihrer Mutter zustehe; er habe versprochen, die Justiz zu beschleunigen. Nach vier Jahren sei der in Posen begonnene Prozess erst in erster Instanz entschieden, und die Entscheidung sei nun an den Gerichtshof in Berlin gegangen. Als verlassene Waise klage sie gegen den Fürsten von Hohenlohe. Die Bitte wird am 26. Januar 1802 dem Minister von der Reck zur Beschleunigung zugewiesen; er lässt ihr am 29. Januar mitteilen, sie habe die Publikation des Appellationsurteils zu erwarten.'
iharep162nr295-001: Abschrift der Schuldverschreibung des Kriegs- und Forstrats Peter Friedrich August von Triebenfeld, Berlin, 28. Januar 1805. Das dritte Departement des Ober-Kriegs-Kollegiums hat ihm aus der General-Invalidenkasse ein Darlehen von 50.000 Talern Courant bewilligt und in Seehandlungs-Obligationen ausgezahlt. Er verspricht, es nach sechsmonatiger, beiden Teilen freistehender Kündigung zurückzuzahlen und bis dahin mit 5 Prozent in halbjährlichen Raten in Berlin zu verzinsen. Zur Sicherheit verpfändet er sein ganzes Vermögen und besonders die Obligation des Fürsten zu Hohenlohe-Ingelfingen vom 1. Juni 1804 über 250.000 Taler, die auf dessen südpreußische Güter Zagórów, Drzewce, Kopojno, Świątniki, Skokum, Oleśnica, Wrąbczyn und Grądzyń eingetragen ist. Für den Fall der Nichtzahlung tritt er der Kasse 50.000 Taler davon ab, mit Vorrang vor den ihm verbleibenden 200.000. Am selben Tag erkennt er die Urkunde vor dem ersten Kurmärkischen Justizamt in Berlin an.
iharep162nr295-002: 'Abschrift einer Urkunde der Südpreußischen Regierung in Kalisch vom 5. März 1805, im Namen des Königs ausgestellt. Vor dem Regierungsrat Stosch als Kommissar ist Triebenfeld am 27. Februar 1805 in Kalisch erschienen und hat seine Schuld- und Verpfändungsurkunde vom 28. Januar über 50.000 Taler aus der General-Invalidenkasse nochmals anerkannt, ebenso das unter der Obligation stehende Anerkennungsprotokoll; der Regierungsrat von Lichnowski bezeugte seine Identität. Darunter steht der Vermerk des Ingrossators Beda vom 13. März 1805: Aufgrund eines Dekrets vom 5. des Monats sind die 50.000 Taler, zu 5 Prozent verzinslich und nach sechsmonatiger Kündigung zahlbar, im Hypothekenbuch des Koniner Kreises auf Zagórów, Drzewce und Kopojno für die Invalidenkasse eingetragen worden.'
iharep162nr295-003: 'Abschrift des Hypothekenscheins über die Stadt Zagórów im Koniner Kreis, den die Südpreußische Regierung in Kalisch am 13. März 1805 der General-Invalidenkasse erteilt (Nr. 1179). Der Fürst zu Hohenlohe-Ingelfingen besitzt das Gut durch die Verleihungsurkunde König Friedrich Wilhelms II. vom 19. Juni 1797; sein Besitztitel ist durch Dekret vom 31. Juli 1801 eingetragen. Als dauernde Lasten stehen darauf: eine jährliche Abgabe von 88 Reichstalern 5 Groschen 9 Pfennig an die Kalischer Kriegs- und Domänenkasse; ein Vorbehalt des Fiskus wegen Bau- und Brennholz aus den Forsten des Gutes nach der Einziehung der geistlichen Güter; und ein Vorbehalt für Johann Giese, Johann Bagans und Friedrich Gietzinger wegen der Holz- und Weiderechte, die ihnen ihr Erbpachtvertrag über Oleśnica vom 22. Februar 1804 in den Zagórówer Forsten gibt. Als Schulden stehen darauf: ein Vorbehalt für den Landesältesten von Lichnowski in Brieg wegen einer schon auf Trąbczyn eingetragenen Forderung von 32.300 Reichstalern; 250.000 Reichstaler für Triebenfeld aus der Schuldverschreibung des Fürsten vom 1. Juni 1804; und davon 50.000 Reichstaler, die Triebenfeld der Invalidenkasse verpfändet und abgetreten hat, mit Vorrang vor dem Rest. Die letzte Zeile beginnt wie dieser Schein und bricht ab.'
iiihamdaiiinr12366-001: Der russische Gesandte in Berlin, Alopeus, übersendet dem preußischen Außenminister Graf Bernstorff auf Befehl seines Hofes einen beiliegenden Bericht des Statthalters des Königreichs Polen über eine Forderung, die Gräfin Michalina Miączyńska, geborene Prusimska, gegen die preußische Regierung erhebt, und unterstützt sie. Der Bericht enthalte so schlüssige Gründe, dass er nichts hinzuzufügen wisse. Er bittet Bernstorff, die Sache der Gräfin den Behörden zu empfehlen, die darüber zu entscheiden haben.
iiihamdaiiinr12366-002: 'Abschrift eines Berichts aus Warschau über die Forderung der Gräfin Michalina Miączyńska, geborene Prusimska, wie die bevollmächtigten Kommissare für die Liquidation des ehemaligen Herzogtums Warschau sie dargelegt haben. Ihre Erbgüter wurden 1796 ihrem Vater, dem Starosten Prusimski, von der preußischen Regierung konfisziert und an Fürst Hohenlohe-Ingelfingen und General Sanitz vergeben; ein Beschluss der Regierungskommission des Herzogtums vom 21. Juli 1807 setzte sie wieder in den Besitz ein. Sie verlangt, dass die Schulden, die die Beschenkten auf die Güter aufgenommen haben, zu Lasten Preußens gehen: Der Fürst habe Trąbczyn und Szetlewek mit 156.000 Talern belastet, und auf Kolno und Kamionna, die er für 142.000 Taler an den Bankkassierer Leixner verkaufte, lägen 160.000 Taler. Der Bericht führt an, dass sie als minderjährige Waise Anspruch auf den Schutz der preußischen Regierung hatte, dass Niemojewski und Wichrowski ihre Güter schuldenfrei zurückerhielten
  und dass Preußen die Generale Sanitz und Zastrow für die zurückgegebenen Güter mit anderen entschädigte. Ebenso könne es den Fürsten entschädigen, indem es dessen Schulden übernimmt. Ein Leser im preußischen Ministerium hat mit Bleistift Einwände an den Rand geschrieben: Preußen sei für Regierungsakte im ehemaligen Südpreußen niemandem verantwortlich, nicht einmal Napoleon habe einen Anspruch wegen des in der Zwischenzeit Geschehenen zugestanden, und der Beschenkte habe das Gut, solange er es besaß, rechtmäßig und mit vollem Eigentumsrecht besessen.'
iiihamdaiiinr12366-003: Entwurf der Antwort des preußischen Außenministers an den russischen Gesandten Alopeus auf dessen Note und die Denkschrift über die Forderungen der Gräfin Miączyńska. Der Starost Prusimski habe am Aufstand der Polen teilgenommen und sei geflohen; seine Güter wurden durch gerichtliches Urteil konfisziert, der König verfügte darüber, und die Beschenkten nahmen Hypotheken darauf auf. Prusimski starb 1803 im Ausland, und seine Tochter erhielt die Güter nach dem Frieden von Tilsit von der Regierung des Herzogtums Warschau zurück. Sie verlangt nun, dass die Schulden getilgt werden, die auf den Gütern ruhen. Die preußische Regierung hat das Gesuch schon einmal abgelehnt; nach erneuter Prüfung bleibt es bei der Entscheidung der preußischen Gerichte, deren Gründe eine beigefügte Denkschrift darlegt.
iiihamdaiiinr12366-004: 'Abschrift eines Schreibens des Advokaten Tarczewski aus Warschau an einen nicht genannten Mandanten: Mitschke in Kalisz hat ihm die Akten des Prozesses gegen Frau Miączyńska geschickt. Sie sind in Ordnung; es fehlen nur die Hypothekenscheine über die eingeklagte Summe, die im Original oder in beglaubigter Abschrift vorzulegen sind. Die Gegenseite betreibt die Einführung der Sache vor dem Appellationsgericht. Er zieht die Instruktion hin, doch wenn alle Fristen erschöpft sind, muss die Sache zur Entscheidung gestellt werden.'
iiihamdaiiinr12366-005: Abschrift einer Note des preußischen Gesandten in St. Petersburg, General von Schöler, an den russischen Außenminister Graf Nesselrode. Fürst Hohenlohe-Ingelfingen, dem König Friedrich Wilhelm II. am 9. August 1796 die konfiszierte Herrschaft Trąbczyn geschenkt hatte, nahm bei Grotowski 30.000 Taler auf; die Hypothek wurde gerichtlich an den Breslauer Kaufmann Weigel abgetreten. 1807 gab die Regierungskommission des Herzogtums Warschau die Güter an Prusimskis Tochter Michalina zurück, die jetzige Gräfin Miączyńska; die eingetragenen Forderungen blieben bestehen. Als die Zinsen ausblieben, klagte Weigel; das Ziviltribunal in Kalisz wies ihn am 6. März 1819 ab und ließ die Forderung löschen. Preußen verlangte 1819 und 1820 ohne Antwort, die Frage der diplomatischen Verhandlung vorzubehalten; inzwischen hat das Appellationsgericht das Urteil verworfen, das Obertribunal in Warschau es aber am 17. Juli 1826 bestätigt. Schöler beruft sich auf den Frieden von Tilsit und
  auf die Konventionen von 1815 und 1819, die Hypothekenforderungen aufrechterhalten, und bittet, das Urteil aufheben und seine Vollstreckung zunächst aussetzen zu lassen.
iiihamdaiiinr12366-006: 'Beglaubigter Auszug eines Urteils des Ziviltribunals erster Instanz der Woiwodschaft Kalisz vom 30. Juli 1827, in polnischer Sprache. Klägerin ist Michalina Miączyńska, geborene Prusimska, mit ihrem Mann Graf Stanisław Miączyński, Erbherrin von Trąbczyn; Beklagte sind die Brüder Lichnowski als Erben des Karl Heinrich Lichnowski und Maria Anna, geborene Blacha, die Witwe des Franciszek Grotowski. Das Gericht weist zwei Einreden gegen die Ladung zurück und erwägt: Trąbczyn und Szetlewek gehörten Antoni Prusimski, wurden ihm wegen seiner Teilnahme am Aufstand konfisziert und dem Fürsten Hohenlohe-Ingelfingen geschenkt; die Regierungskommission gab sie der Klägerin zurück. Der Fürst sei nur bedingter Besitzer gewesen, mit seinem Titel seien auch die von ihm aufgenommenen Schulden erloschen, und der Vertrag von Tilsit ändere daran nichts; gegen Weigel habe die Klägerin in gleicher Sache bereits endgültige Urteile erlangt. Es lässt die Forderung der Brüder Lichnowski und
  die der Witwe Grotowski aus dem Hypothekenbuch von Trąbczyn und Szetlewek löschen und legt den Beklagten die Kosten auf.'
iiihamdaiiinr12367-001: 'Baron Mohrenheim antwortet aus Warschau, unter dem Briefkopf der auswärtigen Angelegenheiten des Königreichs Polen, dem preußischen Generalkonsul Schmidt auf dessen Schreiben vom 6. Februar (Nr. 275): Er verliere die Sache Weigel nicht aus den Augen und werde ihm nach der Rückkehr des Großfürsten Konstantin mitteilen, was darin geregelt werden konnte.'
iiihamdaiiinr12367-002: 'Undatiertes Billett Mohrenheims an Schmidt, beim Aufbruch geschrieben: Er habe am Vortag im Rat seine Denkschrift über die Sache Weigel und Eisenhardt vorgelesen, und dort sei einstimmig anerkannt worden, dass gezahlt werden müsse. Wie, darüber werde man noch beraten.'
iiihamdaiiinr12367-003: Undatiertes Billett Mohrenheims an Schmidt, an einem Dienstag geschrieben. Er schickt ihm dessen „Dubois“ zurück, den er mit großem Interesse gelesen habe, und bittet dringend um die Fortsetzung. Die Sache Weigel werde er vorantreiben; wegen des Übrigen solle Schmidt ruhig sein, man werde mit Ehren herauskommen. Er habe dort schreckliches Wetter, das zuweilen seine Lust am Landleben dämpfe. In einer quer an den Rand geschriebenen Zeile bittet er Schmidt, ihm für zwei Tage etwas zu überlassen; was, ist nicht gelesen.
iiihamdaiiinr12367-004: Mohrenheim teilt Schmidt mit, er habe dessen Schreiben vom 18. Februar (Nr. 352) dem Großfürsten Konstantin vorgelegt. Der Administrationsrat habe dem Großfürsten im August des Vorjahres berichtet, es sei anerkannt worden, dass die Zuständigkeit der Gerichte, die in der Sache der Bankiers Weigel und Eisenhardt geurteilt haben, in Frage gestellt werden könne, weil der Fall seiner Natur nach nur auf diplomatischem Weg zu lösen sei. Der Rat habe deshalb die Kommission der Finanzen und des Schatzes ermächtigt, einen Zuständigkeitskonflikt zu erklären und ihn der Generalversammlung des Staatsrats zur Entscheidung vorzulegen. Da der Großfürst seither keine weitere Mitteilung erhalten hat, hat er den Rat aufgefordert, den Abschluss der Sache zu beschleunigen.
iiihamdaiiinr12367-005: Ein Schreiben aus Warschau an den Generalkonsul Schmidt; die Unterschrift ist nicht gelesen. Der Verfasser hat Schmidts Schreiben vom 26. Juli (Nr. 1648) über den Prozess, der vor den Gerichten des Königreichs zwischen Frau Miączyńska und ihren Gläubigern wegen der vom Fürsten Hohenlohe aufgenommenen Schulden anhängig ist, dem Finanzminister vorgelegt. Er hat den Minister außerdem, wie Schmidt wünschte, an die Forderung erinnert, die der Bankier Weigel gegen den Fiskus des Königreichs erhebt, weil Urteile ihm eine Forderung dieser Art aberkannt haben. Aus zwei beiliegenden Stücken werde Schmidt sehen, dass seine Mitteilungen die nötigen Maßnahmen veranlasst haben und dass sein Schreiben vom 26. Juli der polnischen Verwaltung einen großen Dienst erwiesen hat, weil es sie rechtzeitig vor einem ungünstigen Ausgang dieser Prozesse warnte.
iiihamdaiiinr12367-006: 'Abschrift eines Schreibens des Finanzministers Fürst Lubecki an Weigel, in polnischer Sprache. Er hat Weigels Schreiben vom 10. August und dessen Erneuerung vom 14. September erhalten, die Entschädigung für die Verluste verlangen, die Weigel dadurch erlitt, dass die Gerichte des Landes seine Forderung von 30.000 Talern aus den Gütern von Trąbczyn löschen ließen. Dem ersten Schreiben lag eine Aufstellung bei: 30.000 Taler Kapital, 31.800 Zinsen und 1300 Kosten, zusammen 63.100 Taler. Lubecki hält diese Forderung für überhöht, weil Weigel nach den im Land geltenden Gesetzen selbst beim günstigsten Ausgang des Prozesses nie so viel hätte erlangen können. Da er aber die wirklich erlittenen, nicht die nominellen Verluste ersetzen will, hat er angeordnet, den Wert der früher mit der Forderung belasteten Güter an Ort und Stelle festzustellen, um den wirklichen Wert des verlorenen Kapitals zu schätzen. Deshalb habe er bisher keine genaue Antwort geben können.'
iiihamdaiiinr12367-007: 'Abschrift der Antwort Weigels an den Finanzminister Fürst Lubecki, aus Breslau. Auf dessen Schreiben vom 22. September (Nr. 59607/938) übersendet er in beglaubigter Abschrift den Hypothekenschein vom 14. August 1803 und die gerichtliche Taxe vom 6. Mai 1803 über die Güter Trąbczyn, Osiny, Łazy, Nowawieś, Zarobna und die Trąbczyner Hauländer. Nach dem Hypothekenschein ist der Wert der Güter auf 160000 Reichstaler angenommen. Vor seiner Forderung sind eingetragen: Kirchenkapitalien von 7000 Gulden oder 1166 Reichstalern 16 Groschen, für von Przepolewski, obschon bezahlt, 5000 und für von Lichnowski 42000, zusammen 48166 Reichstaler 16 Groschen. Für seinen Posten, für von Grottowski und jetzt für ihn eingetragen, blieben 111833 Reichstaler 8 Groschen, also 48733 Reichstaler 8 Groschen mehr als seine Forderung von 63100. Die Taxe sei nach den niedrigen Grundsätzen der Domänenveranschlagung angelegt und komme deshalb nur auf 128917 Reichstaler 17 Groschen; auch davon
  blieben nach Abzug der vorstehenden Posten 80751 Reichstaler 1 Groschen zu seiner Deckung. Seine Forderung sei also ganz sicher gewesen, und wäre ihm die Rechtshilfe nicht versagt worden, hätte er die vorstehenden Posten ablösen und in der Zwangsversteigerung mitbieten können. Er erwartet, dass der Fürst seine Befriedigung veranlasst und einen nahen Termin für eine Übereinkunft bestimmt, zu dem er selbst oder ein Bevollmächtigter erscheinen würde.'
iiihamdaiiinr12367-008: Abschrift eines zweiten Schreibens des Finanzministers Fürst Lubecki an Weigel (Nr. 77775), in polnischer Sprache. Die Unterlagen zur Schätzung der Güter von Trąbczyn, die Weigel mit seiner Eingabe vom 14. Oktober 1830 gesandt hat, hat er der Behörde übergeben, die er mit der Schätzung des heutigen Werts dieser Güter beauftragt hat. Weigel meine zwar, sein Kapital sei nach der gerichtlichen Taxe auf Trąbczyn vollkommen gesichert gewesen; diese Taxe sei aber 1803 aufgenommen worden, in einer Zeit überhöhter Güterpreise. Der wirkliche Wert der Forderung sei nach dem heutigen Wert der Liegenschaften zu schätzen, weil das letzte Urteil in Weigels Sache 1826 erging und erst von da an die Zwangsvollstreckung hätte betrieben werden können. Da Weigels Schreiben keine annehmbareren Bedingungen für einen Vergleich enthält, müsse er die Fertigstellung der Arbeit abwarten, die er in seiner Antwort vom 22. September erwähnt hat und deren Beschleunigung er überwacht.
iiihamdaiiinr12367-009: Ein Schreiben aus Warschau an den Generalkonsul Schmidt (Nr. 301), auf der Aufnahme mit „R. Fuhrmann“ unterzeichnet. Auf Schmidts Verwendung vom 10. Dezember 1831 für das Gesuch Weigels hat der Verfasser die Finanzkommission angewiesen, die Schätzung der Domäne Trąbczyn zu beschleunigen, zugleich die Sicherheit des Kapitals zu prüfen, das Weigel auf diesem Gut hat, und ihm die Sache vorzulegen; mit dieser Arbeit war die Kommission schon im Vorjahr beauftragt. Die besondere Vollmacht, die Seine Majestät dem Fürsten Lubecki zum Verhandeln mit Weigel erteilt hatte, könne keinem anderen dienen; er habe die nötigen Schritte getan, um dieses Hindernis zu beseitigen. Sobald beide Schwierigkeiten behoben sind, werde er alles tun, damit die begründeten Ansprüche eines preußischen Untertanen rasch Erfolg haben.
iiihamdaiiinr12367-010: Abschrift eines Schreibens Engels aus Warschau an den Generalkonsul Schmidt (Nr. 2216). Unter Bezug auf sein Schreiben vom 12. Februar (Nr. 1871) teilt er mit, dass der Staatsrat Joseph Lubowidzki, Präsident der Bank von Polen, auf Befehl des Kaisers und Königs mit der Ausführung der Konvention vom 29. Mai 1830 beauftragt ist und die nötigen Anweisungen erhalten hat. Dieser neue Kommissar sei auch ermächtigt, die Fragen zu bereinigen, die sich aus der Forderung des Bankiers Weigel ergeben. Engel hofft, er werde das Vertrauen des Kaisers rechtfertigen und sich um die Regelung aller Punkte bemühen, die zwischen der Regierung von Polen und der des Königs von Preußen noch endgültig zu ordnen sind.
iiihamdaiiinr12367-011: Ein zweites Schreiben derselben Hand wie Dokument 9 an den Generalkonsul Schmidt, in Antwort auf dessen Schreiben vom 1. März (Nr. 432) über die Erledigung der Sache des Weigel in Breslau. Infolge der Maßnahmen, die der Verfasser getroffen und Schmidt am 24. Dezember des Vorjahres mitgeteilt hat, hat die Kommission der Finanzen und des Schatzes am 29. Februar Herrn Drake, Kommissar in der Abteilung der Staatsdomänen, mit der Schätzung der Güter von Trąbczyn beauftragt. Die Arbeit werde einige Zeit brauchen; sobald sie abgeschlossen ist, werde er Schmidt unterrichten. Er bittet ihn, dies inzwischen dem Handelshaus Weigel mitzuteilen.
iiihamdaiiinr12765-001: Triebenfeld erinnert Hardenberg daran, dass er ihm am 6. Mai in Paris ein Schreiben des Fürsten Hohenlohe an den russischen Kaiser übergeben hat. Er legt die darauf erteilte Resolution vom 14. Mai in Abschrift bei und bittet, die für den Fürsten wichtige Sache im jetzt entscheidenden Zeitpunkt wieder in Erinnerung bringen zu dürfen. Die Kanzlei vermerkt, das Gesuch sei am 20. November 1814 an Staatsrat Stägemann abgegeben worden.
iiihamdaiiinr12765-002: 'Antwort an Triebenfeld auf sein Gesuch vom 25. des Vormonats: Die Angelegenheit des Fürsten Hohenlohe wegen der Ansprüche auf Trąbczyn und Kamionna werde sich von selbst ausgleichen, sobald die allgemeine Auseinandersetzung und Übereinkunft wegen des Herzogtums Warschau zur Ausführung komme.'
iiihamdaiiinr12765-003: 'Abschrift eines Schreibens Hardenbergs an Triebenfeld: Die Ansprüche des Fürsten von Hohenlohe auf die ihm 1796 geschenkten südpreußischen Güter Trąbczyn und Kamionna könnten erst mit Aussicht auf Erfolg angeregt werden, wenn über die Warschauer Angelegenheiten definitive Bestimmungen erfolgt sind. Das sei noch nicht der Fall. Hardenberg hält deshalb das Schreiben des Fürsten an Kaiser Alexander zurück und bittet, dies dem Fürsten zu eröffnen.'
iiihamdaiiinr12765-004: 'Triebenfeld schildert Hardenberg den Fall: 1796 erhielt der Fürst Kamionna und Kolno, Trąbczyn mit Dörfern im Kreis Konin und Brzyce, die dem entwichenen Prusimski konfisziert waren. Kamionna und Kolno verkaufte er 1804 an Bankdirektor Leixner. 1807 nahm die polnische Verwaltungskommission alle Güter ohne Urteil und gab sie Prusimskis Tochter Miączyńska; das Tribunal zu Kalisz erklärte sich für nicht ermächtigt. Er bittet, Leixner seine Güter zurückzugeben und beim russischen Kaiser die Rückgabe der Trąbczyner Güter samt 36500 Rthl Revenuen zu erwirken.'
iiihamdaiiinr12765-005: 'Entwurf einer Antwort an Triebenfeld: Über die Entschädigung der Donatare südpreußischer Güter, denen der Besitz seit dem Frieden von Tilsit entzogen wurde, sei eine diplomatische Unterhandlung eingeleitet, deren Ergebnis dem Fürsten mitgeteilt werde. Leixner sei nicht durch den Verlust von Kolno und Kamionna in gerichtliche Untersuchung geraten, sondern durch die unregelmäßige Verwaltung seines Postens und die unerlaubte Beleihung eines dort für den Kaufmann Simon eingetragenen Aktivums.'
iiihamdaiiinr12765-006: Der Fürst bittet Stein auf Französisch, beim Kaiser eine Entschädigung für Kamionna und Trąbczyn zu erwirken, die ihm 1796 verliehen und 1807 vom polnischen Fiskus genommen und Prusimskis Tochter zugesprochen wurden. Um die verpfändeten Güter zu befreien, habe er 55000 Reichstaler zahlen müssen; seine Forderung in barem Geld betrage 85400 Reichstaler, sein Verlust insgesamt 325400 Reichstaler. Die Kanzlei vermerkt, es sei zu antworten, dass die Regelung der polnischen Angelegenheiten abzuwarten sei.
iiihamdaiiinr12765-007: 'Entwurf einer französischen Antwort Hardenbergs an den Fürsten: Stein habe ihm dessen Schreiben vom 12. mitgeteilt. Der Fürst möge mit seiner Forderung auf Kamionna und Trąbczyn die endgültige Regelung der polnischen Angelegenheiten abwarten, die nicht fern scheine. Hardenberg werde dann alles tun, um das Gesuch beim König zu unterstützen.'
iiihamdaiiinr12765-008: Der Fürst schreibt Hardenberg, der Distrikt seiner Trąbczyner Güter falle unter russische Hoheit; da beide Souveräne die Handlungen der Kommission bestätigt hätten, seien sie für ihn verloren, und den Donataren solle eine Entschädigung durch andere Güter gegeben werden. Sein Verlust betrage über 261000 Rthl. Er wäre mit dem kleinen Amt Sokolnik zufrieden, das 8 bis 10000 Rthl Pacht gibt, und bittet Hardenberg, sich beim russischen Kaiser dafür zu verwenden.
iiihamdaiiinr12765-009: Entwurf einer Antwort Hardenbergs an den Fürsten auf das Schreiben vom 12. des Vormonats wegen der Trąbczyner Güter. Ein Minister habe ihm auch das an ihn gerichtete Schreiben wegen Kamionna und Trąbczyn mitgeteilt. Hardenberg habe Zerboni ersucht, ihn über beide Güter in vollständige Kenntnis zu setzen, und behalte sich vor, dem Fürsten von seinen weiteren Schritten Nachricht zu geben.
iiihamdaiiinr12765-010: 'Entwurf eines Schreibens an Zerboni in Poznań: Hardenberg übersendet urschriftlich zwei Schreiben des Fürsten, an ihn und an Stein, über die Ansprüche wegen der entzogenen Güter Kamionna und Trąbczyn und bittet um Mitteilung, welche Schritte zugunsten des Fürsten noch getan werden können. Kamionna habe der Fürst an Leixner verkauft; die 55000 Rthl und Zinsen habe die Bank zu fordern. Er erwartet Zerbonis Bericht so bald als möglich.'
iiihamdaiiinr12765-011: 'Kassierter Entwurf einer Antwort an den Fürsten: Die Territorialverhältnisse des Herzogtums Warschau seien für die an Preußen zurückfallenden Provinzen definitiv entschieden; die Entschädigung der Donatare sei einer besonderen Unterhandlung vorbehalten, zu der schon geschritten worden sei. Es werde Hardenberg ein besonderes Vergnügen sein, darin Gelegenheit zu finden, die Entschädigung für die entzogenen Trąbczyner Güter zu befördern. Der Entwurf verweist auf die anderweitige Verfügung vom 6. Juni 1815.'
iiihamdaiiinr12765-012: 'Antwort an den Fürsten: Die Territorialverhältnisse des Herzogtums Warschau seien für die an Preußen zurückfallenden Provinzen definitiv entschieden; die Entschädigung der Donatare sei einer besonderen Unterhandlung vorbehalten. Der Schreiber werde darin Gelegenheit suchen, die Entschädigung für die entzogenen Trąbczyner Güter zu befördern.'
iiihamdaiiinr12765-013: 'Französische Antwort an den Fürsten: Stein habe dessen Schreiben vom 12. des Vormonats mitgeteilt. Der Fürst möge mit seiner Forderung auf Kamionna und Trąbczyn die endgültige Regelung der polnischen Angelegenheiten abwarten; der Schreiber werde dann alles tun, um das Gesuch beim König zu unterstützen.'
iiihamdaiiinr12765-014: 'Zerboni berichtet Hardenberg: Kolno und Kamionna habe der Fürst vor 1806 an Leixner verkauft, Trąbczyn nicht; alle Güter gelangten 1806/7 an die Erben des vorigen Eigentümers zurück. Ein gewisser Schenck fordere als Mandatar 318500 Rthl Entschädigung, am besten durch das Amt Sokolnik. Zerboni hält die Berechnungen für Unsinn; der Fürst habe Trąbczyn deterioriert und mit Schulden überladen. Das Kabinett könne nur das russische Kabinett bewegen, den Fürsten zu entschädigen. Ein Randvermerk nennt Triebenfeld und Leixner verstorben.'
iiihamdaiiinr12765-015: 'Verfügung: Schöler in St. Petersburg soll nach Zerbonis Antrag beauftragt werden, den Wunsch des Fürsten, da es eine reine Gnadensache sei, nur ganz im Allgemeinen zur Kenntnis des Kaisers zu bringen. Dem Fürsten soll namens Seiner Durchlaucht mitgeteilt werden, dass sein Entschädigungsgesuch durch die königliche Gesandtschaft zur Kenntnis des Kaisers gebracht werde.'
iiihamdaiiinr12765-016: 'Entwurf eines Schreibens an den Fürsten: Hardenberg habe heute den Gesandten in St. Petersburg, Generalmajor von Schöler, vom Entschädigungsgesuch für die Trąbczyner Güter unterrichtet und ihm aufgetragen, es dem Kaiser von Russland zur Kenntnis zu bringen. Er stellt dem Fürsten anheim, seine Angelegenheit nunmehr in St. Petersburg unmittelbar zu verfolgen, und wünscht ihm den günstigsten Erfolg.'
iiihamdaiiinr12765-017: 'Entwurf einer Weisung an Schöler: Der Fürst erhielt vom verstorbenen König die Trąbczyner Güter, früher Eigentum des Starosten Prusimski; sie gelangten 1806 und 1807 an dessen Tochter Miączyńska zurück, der der Kaiser von Russland den Besitz bestätigte. Da einige Donatare im Königreich Polen entschädigt worden sind, macht auch der Fürst Anspruch. Schöler soll den Antrag zur Kenntnis des Kaisers bringen, jedoch nur im Allgemeinen und ohne ihn dringend zu unterstützen, da es eine Gnadensache sei.'
iiihamdaiiinr12765-018: 'Registraturvermerk: Der Bericht ist unter Nr. 3278 C an die 3. Sektion des auswärtigen Departements abgegeben worden, gezeichnet Bever; er ist mit den Akten beigefügt, gezeichnet Strenger.'
iiihamdaiiinr12765-019: 'Die Witwe von Brehmer bittet Hardenberg um Hilfe: Ihr verstorbener Bruder, Major von Seehausen, lieh dem Fürsten 1803 ein Kapital von 5000 Rthl gegen Verpfändung des Gutes Szetlewek. Der Fürst zahlte weder Kapital noch Zinsen; 1807 wurde ihm das Gut abgenommen und der Erbin des früheren Besitzers zurückgegeben. Sie bittet um Befriedigung aus dem übrigen Vermögen des Fürsten. Ein Randvermerk Stägemanns: eine Entschädigung des russischen Kaisers müsse den auf die Güter ingrossierten Gläubigern zustattenkommen.'
iiihamdaiiinr12765-020: 'Zwei Verfügungen: Der Witwe von Brehmer ist zu eröffnen, sie müsse den Fürsten wegen ihres auf Szetlewek eingetragenen Kapitals von 5000 Rthl zuerst vor seiner Gerichtsbehörde belangen, damit der Anspruch rechtlich feststehe. Schöler ist mitzuteilen, dass die hypothekarischen Gläubiger Gefahr laufen, ihre Kapitalien zu verlieren, da der Fürst Trąbczyn deterioriert und mit Schulden belastet habe; er soll berichten, falls der Kaiser eine Entschädigung gewährt.'
iiihamdaiiinr12765-021: 'Entwurf einer Antwort an die Witwe von Brehmer: Ihre an Hardenberg gerichtete Vorstellung vom 26. April sei dem Ministerium zugefertigt worden. Wolle sie wegen des auf Szetlewek eingetragenen Kapitals von 5000 Rthl aus dem übrigen Vermögen des Fürsten Befriedigung suchen, so müsse sie ihn zuerst vor seiner Gerichtsbehörde belangen, um den Anspruch rechtlich festzustellen, falls der Kaiser von Russland sich geneigt erklären sollte, dem Fürsten eine Entschädigung zu gewähren.'
iiihamdaiiinr12765-022: 'Entwurf eines Schreibens an Schöler: Mit Bezug auf das Schreiben vom 29. April teilt das Ministerium mit, dass die hypothekarischen Gläubiger Gefahr laufen, ihre Kapitalien zu verlieren, da der Fürst Trąbczyn deterioriert und mit Schulden belastet hat; Schöler möge dies zur Sprache bringen. Er soll Nachricht geben, falls der Kaiser dem Fürsten eine Entschädigung gewährt, damit die Gläubiger ihre Gerechtsame verfolgen können.'
iiihamdaiiinr12765-023: Die Witwe von Brehmer überreicht dem Ministerium ein rechtskräftiges Erkenntnis der ehemaligen südpreußischen Regierung zu Kalisz von 1806, wonach der Fürst zur Zahlung der 5000 Rthl nebst Zinsen verurteilt wurde, und das Testament ihres Bruders, des Majors von Seehausen. Sie bittet, sich wegen Kapital und Zinsen zu verwenden. Laut Verfügung des Ministeriums kann nach Lage der Umstände ein Mehreres nicht geschehen.
iiihamdaiiinr12765-024: 'Entwurf einer Antwort an die Witwe von Brehmer: Das Ministerium habe der Gesandtschaft zu Petersburg bereits mitgeteilt, dass die hypothekarischen Gläubiger Gefahr laufen, ihre Kapitalien zu verlieren. Mehr könne es für sie nicht tun; sie müsse ihre Rechte selbst wahrnehmen, falls der Kaiser dem Fürsten eine Entschädigung gewährt. Die am 25. Juli eingereichten Anlagen gehen zurück.'
iiihamdaiiinr12765-025: Schöler berichtet dem Ministerium aus St. Petersburg, er habe am 17. Mai dem Grafen Nesselrode eine Note in der Angelegenheit des Fürsten übergeben und in einer späteren Note vom 1. August den im Erlass vom 29. Juni berührten Umstand zur Sprache gebracht. Die erst gestern erteilte Antwort sei abschlägig ausgefallen. Das Ministerium verfügt, dem Fürsten Abschrift der Anlage zu senden.
iiihamdaiiinr12765-026: 'Entwurf eines Schreibens an den Fürsten: Das Ministerium übersendet Abschrift der Note, mit der das russische Ministerium die Verwendung der Gesandtschaft zu Petersburg wegen der Entschädigung für Kamionna und Trąbczyn beantwortet hat, und bedauert, dass es trotz der gesandtschaftlichen Bemühung nicht gelungen ist, einen günstigen Erfolg herbeizuführen.'
iiihamdaiiinr12765-027: 'Note des russischen Gesandten Alopeus an Ancillon: Herzog Eugen von Württemberg empfahl die Forderungen der Erben des Fürsten von Hohenlohe-Ingelfingen und des Grafen Bethusy an das Königreich Polen. Die Erben berufen sich auf die Generale von Zastrow und von Sanitz; die Sache wurde schon 1816 mit Schöler verhandelt und abgelehnt. Bethusys Antrag nach Artikel 18 des Wiener Vertrags lehnte die polnische Regierung ab. Der Kaiser bedauert, der Empfehlung nicht folgen zu können.'
iiihamdaiiinr12765-028: 'Abschrift eines Berichts des Fürsten Zajączek an den Kaiser: Graf Ernst Bethusy bat, mit seinen drei Söhnen zu den Vergünstigungen des Artikels 18 des Wiener Vertrags zugelassen zu werden. Der Artikel gelte nur für Besitzungen, die von der Grenze zwischen dem Königreich Polen und dem Großherzogtum Posen durchschnitten werden. Bethusy wolle offenbar nur Eisenerz für seine Hütten in Schlesien ausführen, was die Zollvorschriften verbieten.'
iiihamdaiiinr12765-029: 'Entwurf eines Schreibens an Minister von Schuckmann: Die Erben des verstorbenen Fürsten von Hohenlohe-Ingelfingen und Graf Bethusy ließen sich bei der russischen Regierung durch Prinz Eugen von Württemberg vertreten; nach der Note des russischen Gesandten hat der Kaiser beide Gesuche abgelehnt. Für die Erben könne, als in einer bloßen Gnadensache, keine Verwendung stattfinden. Bethusys Antrag sei unzulässig, da seine Besitzungen nicht von der neuen Grenze durchschnitten werden. Die weitere Verfügung wird dem Minister anheimgestellt.'
iiihamdaiiinr12765-030: 'Schuckmann antwortet dem Ministerium der auswärtigen Angelegenheiten: Er stimme zu, dass der Anspruch des Grafen Bethusy auf freien Verkehr zwischen seinen Besitzungen in Schlesien und dem Königreich Polen auch nach dem Traktat unzulässig sei. Er habe dies Bethusy unter Verweis auf Artikel 18 eröffnet, mit der Bemerkung, dass die preußische Regierung Einspruch erhoben hätte, wenn die russische dem Gesuch stattgegeben hätte.'
oe1bu14525-001: 'Schenkungsurkunde Friedrich Wilhelms, die dem Prinzen Friedrich Ludwig von Hohenlohe-Ingelfingen, Generallieutenant und Gouverneur von Breslau, für langjährige Dienste die dem König anheimgefallenen Güter erblich und als freies Eigentum überträgt: Stadt Kamionna mit dem Marktort Kolno im Posener Kreis, die Dörfer Trąbczyn, Szetlewek, Nowawies, Łazy, Alt und Neu Laske, Osiny und Hauland Trąbczyński im Kreis Konin sowie Brzyce in Kujawien, vorbehalten allein die landesherrlichen Steuern und öffentlichen Lasten. Beigefügt sind Beglaubigungen der südpreußischen Regierung zu Kalisz und der Vermerk über die Eintragung des Besitztitels von Szetlewek im Hypothekenbuch des Kreises Konin.'
oe1bu14525-002: Ein Hypothekenschein für das freie Allodialgut Szetlewek im Kreis Konin bestätigt Fürst Friedrich Ludwig von Hohenlohe-Ingelfingen den Besitztitel aus der Schenkungsurkunde Friedrich Wilhelms II. vom 9. August 1796; den Wert gibt er mit 24000 Reichsthaler an. Eingetragen sind das Verbot, das Gut an Landeseingesessene zu verkaufen, ein zinsloses Darlehen des Ignatz von Radzinski über 8333 Rthl 8 ggl (50000 poln. Gulden) als Sicherheit für Pachtgelder, sowie eine Protestation Jacob von Przespolewskis über 30000 poln. Gulden aus einer Schuldverschreibung des Vorbesitzers von Prusimski.
oe1bu14525-003: 'Eine Schenkungsurkunde Friedrich Wilhelms, mit der dem Fürsten Friderich Ludewig von Hohenlohe-Ingelfingen, Generalleutnant der Infanterie, Regimentschef und Gouverneur von Breslau, für seine Verdienste die an den König gefallenen südpreußischen Güter erb- und eigentümlich übertragen werden: Stadt Kamionna und Marktort Kolno im Posener Kreis, die Dörfer Trąbczyn, Szetlewek, Nowawies, Łazy, Alt- und Neu-Laske, Osiny, Hauland Trąbczyński im Kreis Konin sowie Brzyce in Cujavien, unter Vorbehalt der landesherrlichen Steuern und Abgaben, mit freiem Verfügungsrecht; Regierungen und Kriegs- und Domänenkammern wird Nichtbehinderung befohlen. Beglaubigte Abschrift durch Richter.'
oe1bu14525-004: Eine Schenkungsurkunde Friedrich Wilhelms, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, Generallieutenant der Infanterie und Gouverneur von Breslau, für langjährige Dienste die Stadt Kamionna und das Städtchen Kolno im Posener Kreis, die Dörfer Trąbczyn, Szetlewek, Nowawies, Łazy, Alt- und Neu-Laske, Osiny und Hauland Trąbczyński im Koniner Kreis sowie Brzyce in Kujawien samt Zubehör erblich und eigentümlich erhält, vorbehalten die landesherrlichen Steuern und öffentlichen Abgaben; Regierungen und Kriegs- und Domänenkammern wird jede Behinderung untersagt. Als beglaubigte Abschrift, bestätigt von Sonnabend, Auditeur des Regiments.
oe1bu14525-005: 'Eine Schenkungsurkunde Friedrich Wilhelms für seinen Oheim Friedrich Ludwig, regierenden Fürsten von Hohenlohe-Ingelfingen: weil die zuvor überlassenen Güter des entflohenen Starosten von Prusimski stark verschuldet waren, werden ihm nun die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Świątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienitz und Wolica mit allem Zubehör erblich und als volles Eigentum verliehen, gegen Zahlung der bisherigen landesherrlichen Abgaben als feste Canon und der Kompetenz an die geistlichen Stiftungen. Beglaubigte Abschrift durch Sonnabend.'
oe1bu14525-006: 'Ein offener Schenkungsbrief Friedrich Willhelms, der dem Fürsten Friedrich Ludewig von Hohenlohe-Ingelfingen über die schon am 19. Juni verliehenen Güter Betsche, Zagórów und Wienietz hinaus auch die zugehörigen Pertinenzstücke erblich und zu vollem Eigentum überträgt: bei Betsche die Dörfer Stołuń, Kuligowo, Szarcz, die Vogtei Zielomyśl und Silna sowie die Hauländereien Pomherr und Heydemühle, bei Zagórów das Dörfchen Swięcin, bei Wienietz Konty, Szedlemin, Batkowo und Karezin. Gegenleistung sind der bisherige Landesherrschaftszins als fester Canon und die Abgaben an geistliche Stiftungen. Beglaubigt durch Sonnabend.'
oe1bu14525-007: 'Eine vidimirte Abschrift einer königlichen Schenkungsurkunde Friedrich Wilhelms, die dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen über die schon am 19. Juni verliehenen Güter Betsche, Zagórów und Wienietz hinaus auch deren Pertinenzstücke erb- und eigentümlich überträgt: bei Betsche Stołuń, Kuligowo, Szarcz, Vogtey, Zielomyśl und Silna mit den Hauländereien, dem Pommser Hauländer und der Heÿdemühle, bei Zagórów das Dorf Swięcin, bei Wienitz Konty, Siedlemyn, Batkowo und Karczyn, gegen unveränderlichen Canon und die Abgaben an geistliche Stiftungen. Beigefügt sind der Titulus possessionis für Swięcia mit dem Vorwerk Broniki im Koniner Kreis (Hypothekenbuch Bd. 3 fol. 94) und ein Hypothekenschein, der als einzige Last das Verkaufsverbot an Nichtinländer verzeichnet.'
oe1bu14525-008: Eine Schenkungsurkunde Friedrich Wilhelms, mit der dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen die vormals geistlichen Güter, nämlich die Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Świątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienietz und Wolica mit allem Zubehör, zu erblichem Eigentum übertragen werden, gegen den bisherigen landesherrlichen Canon und die Abgabe an die geistlichen Korporationen. Begründet wird dies mit Diensten des Fürsten und damit, daß die früher verliehenen Güter des entwichenen Starosten von Prusimski zu hoch verschuldet waren. Alle Behörden werden zur Nichtbehinderung angewiesen. Beigefügt eine Beglaubigung des Regierungsauditors Richter.
oe1bu14525-009: Königliche Schenkungsurkunde Friedrich Wilhelms, die dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Świątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienietz und Wolica mit allen Zubehörungen als erbliches Eigentum überlässt, gegen einen festen, unveränderlichen Kanon der bisherigen landesherrlichen Abgaben und die Zahlung der Stipendien an die geistlichen Stiftungen. Begründet wird sie damit, dass die früher zugedachten Güter des entwichenen Starosten von Prusimski zu hoch verschuldet waren. Alle Behörden werden angewiesen, den Besitz nicht zu störren; gegengezeichnet Hoym und Reck. Beigefügt ist die Beglaubigung der Abschrift durch Sonnabend, Auditeur des Hohenlohischen Infanterieregiments.
oe1bu14525-010: 'Königliche Schenkungsurkunde Friedrich Wilhelms für seinen Oheim Friedrich Ludwig, regierenden Fürsten von Hohenlohe-Ingelfingen: weil die zuvor übertragenen Güter des entflohenen Starosten von Prusimski mit Schulden belastet waren, werden ihm nun die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Świątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienietz und Wolica samt Zubehör zu Erb- und Eigentumsbesitz verliehen, gegen die bisherigen landesherrlichen Abgaben als festen Canon und die Unterhaltsgelder an die geistlichen Stiftungen. Beigefügt eine Beglaubigung der Abschrift durch den Auditeur Richter.'
oe1bu14525-011: 'Nachtrag zur Schenkung vom 19. Juni: Friedrich Wilhelm überträgt seinem Oheim Friedrich Ludewig, regierendem Fürsten von Hohenlohe-Ingelfingen, erblich und eigentümlich die Zubehörungen der Güter Betsche, Zagórów und Wienietz – bei Betsche die Dörfer Stołuń, Kuligowo, Szarcz, die Vogtei Zielomyśl und Silna mit den Hauländereien, der Pomherr-Hauländerei und Heidemühle, bei Zagórów das Dörfchen Swięcin, bei Wienietz Konty, Szedlemin, Batkowo und Karczyn. Bedingung ist die Zahlung der bisherigen landesherrlichen Abgaben als unveränderlicher Kanon sowie der Kompetenz für geistliche Stiftungen. Beigefügt die Beglaubigung des Geheimen Südpreußischen Archivs (Beugnitz).'
oe1bu14525-012: 'Ein Hypothekenschein über das Gut Kolno im Posener Kreis, bestehend aus Kamionna und dem Marktflecken Kolno, ausgestellt für den regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen. Er verzeichnet den Erwerb durch Schenkungsurkunde Friedrich Wilhelms II. vom 9. August 1796 nach Einziehung des Vermögens des Anton von Prusimski wegen Teilnahme am Aufstand von 1794 sowie die eingetragenen Lasten: einen Protest des Anton von Broniewski, 250 Rthl für die Kirche zu Kamionna, vier polnische Mark jährlichen Zins und Forderungen von 79.795 Rthl 18 g 8 4/5 pf nebst 21.666 Rthl 16 gg Meliorationskosten.'
oe1bu14525-013: Eine Taxe der im Meseritzer Kreis des Departements Posen gelegenen Güter Kamionna und Kolno des Fürsten Friederich Ludwig von Hohenlohe-Ingelfingen, von Bading nach südpreußischen Grundsätzen berichtigt und von Beugnitz beglaubigt. Sie verzeichnet Lage und Grenzen, eine Fläche von 5523 Morgen 33 Ruten und 5119 Morgen 2 Ruten, zusammen 10642 Morgen 35 Ruten, das Städtchen Kamionna mit 75 Feuerstellen und 466 Seelen nach Gewerben, Konfession und Vieh, die Propinations- und Patronatsrechte samt 100 polnischen Gulden für den Pfarrer, die Hofflächen beider Vorwerke und das Dorf Kolno mit Bauern, Hofwehr und streitigem Holzbezug aus der Krobilewer Heide.
oe1bu14525-014: 'Eine Forsttaxe des Forstinspektors Rochlitz zu den Gütern Kamionna und Kolno, beglaubigt von den Notaren Carl Anton Diener und Joh. Jacob Schmerck. Berechnet wird, was die Zerstückelung von 344 Morgen 151 Ruten Eichen-, Erlen- und Buchenwald (Nr. 1, 3, 4) einbringt: Kaufgeld 15 Rthl je Morgen, Grundzinsen, Zwangsmühlen- und Propinationsgelder, Laudemium, zusammen 15 788 Rthl, nach Abzug 12 520 Rthl, mit dem Taxwert von 186 943 Rthl also 199 463 Rthl. Eine zweite Rechnung mit Holzwert und dem Überland der Kamionnaer Bürger (700 Morgen) und Kolnoer Untertanen (1200 Morgen) führt auf 255 833 Rthl 12 g.'
oe1bu14525-015: Ein Hypothekenschein der Südpreußischen Regierung zu Posen über die Herrschaft Pszczew oder Betsche im Posener Departement mit den Dörfern Świechocin, Stoki, Łowyń, Głażewo, Dormowo, Stołuń, Kuligowo, Szarcz, dem Vorwerk Zielomyśl und Silna, den Hauländereien, dem Tomecher Hauland und der Heydemühle. Der Titulus Possessionis ist für Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, eingetragen aufgrund der Gnadenbriefe vom 19. Juni und 1. Dezember 1797 und der Resignation vom 29. März 1802. Eingetragen sind eine unbestimmte jährliche Kompetenz an die Kriegs- und Domänenkasse Posen sowie das Verbot der Veräußerung an Altpolen; Schulden sind nicht eingetragen.
oe1bu14525-016: 'Königliche Bestätigung der Resignation: Vor der Südpreußischen Regierung übergab der Kammerfiskal Beyer namens des Fiskus dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen, vertreten durch Justizrat Melzer, die im Posener Kreis gelegene Herrschaft Pszczew oder Betsche mit den Zubehörungen Świechocin, Stoki, Łowyń, Głażewo, Dormowo, Stołuń, Kuligowo, Szarcz, der Vogtei Zielomyśl und Silna, den Hauländereien, dem Pomcher Hauländerdorf und den Heyde Mühlen zu Erb- und Eigentumsrecht, gestützt auf die Gnadenbriefe vom 19. Juni und 1. Dezember 1797. Ein angefügter Vermerk bezeugt die Eintragung des Besitztitels im Hypothekenbuch Vol. VII Fol. 1.'
oe1bu14525-017: Eine königliche Schenkungsurkunde Friedrich Wilhelms, mit der dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Świątniki, Kopojno, Olesnica, Drzewce, Grądzyn, Wrąbczyn, Winietz und Wolica samt Zubehör erblich und eigentümlich übertragen werden, gegen Zahlung des bisherigen landesherrlichen Kanons und der Kompetenz an die geistlichen Stiftungen; Anlass ist, dass die früher geschenkten Güter des entflohenen Starosten von Prusimski zu hoch verschuldet waren. Beigefügt sind die Beglaubigung der Abschrift durch von Steudener und die Eintragung des titulus possessionis für die Herrschaft Pszczew oder Betsche im Hypothekenbuch Vol. VII fol. 1.
oe1bu14525-018: 'Friedrich Wilhelm schenkt seinem "Oheim" Friedrich Ludwig, regierendem Fürsten von Hohenlohe-Ingelfingen, erb- und eigentümlich die Zubehörungen der ihm am 19. Juni 1797 verliehenen Güter Betsche, Zagórów und Wienietz: bei Betsche Stołuń, Kuligowo, Szarcz, die Vogtei Zielomyśl und Silna samt Hauländereien, das Pomher Hauländerei und Heydemühle, bei Zagórów Swięcin, bei Wienietz Konty, Szedlemin, Batkowo und Karczyn, gegen Zahlung der bisherigen landesherrlichen Abgaben als fester Kanon und des Anteils der geistlichen Stiftungen. Beigefügt sind eine vidimirte Abschrift (Posen 1801), ein Hypothekenschein über die Eintragung des Besitztitels an Pszczew oder Betsche (Hypothekenbuch Bd. VII fol. 1) und eine Beglaubigung.'
oe1bu14525-019: 'Aufforderung der Regierung zu Kalisch an Friedrich Ludwig, regierenden Fürsten von Hohenlohe-Ingelfingen in Breslau: da nach Bestätigung der Kriegs- und Domänenkammer die vormals geistlichen Güter Kopojno, Drzewce, Swięcia und Zagórów im Kreis Konin ihm zu adligem Besitz verliehen und bereits tatsächlich übergeben worden sind, soll er binnen vier Wochen den Eigentumsbesitz nachweisen und einen Termin zur Berichtigung des Besitztitels auf seinen Namen nehmen. Unterzeichnet Reck.'
oe1bu14525-020: Auf ein Gesuch vom 8. des Monats gewährt die Königlich Südpreußische Regierung dem Fürsten von Hohenlohe-Ingelfingen eine Gnadenfrist zur Berichtigung des Besitztitels für die Güter Drzewce, Kopojno, Swięcia und Zagórów, jedoch pro omni nur bis zum letzten Tag des Oktober des laufenden Jahres. Der Bescheid ergeht an den fürstlich Hohenloheschen Bau- und Wirtschaftsrat Glenck in Breslau als Bevollmächtigten und gilt als Resolution.
oe1bu14525-021: Ein amtlicher Auszug aus dem Hypothekenbuch der Stadt Zagórów, Kreis Konin, bestätigt den Besitztitel des regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen aus der Verleihung Friedrich Wilhelms II. Eingetragen sind eine jährliche Abgabe von 88 Rthl 5 Groschen 9 d an die Kammerkasse Kalisch, Protestationen wegen Bau- und Brennholz sowie wegen der Erbpachtrechte von Johann Giese, Johann Bagans und Friedrich Gietzinger, ferner ein Darlehen von 250000 Rthl an von Triebenfeld mit Abtretungen an den Invalidenfonds und die Bankhäuser Oppenheim und Wolff, sowie 8000 Rthl für die Erben Seher-Thoss.
oe1bu14525-022: Abschrift einer Schenkungsurkunde Friedrich Wilhelms II. vom 19. Juni 1797, mit der Friedrich Ludwig, regierender Fürst von Hohenlohe-Ingelfingen, die vormals geistlichen Dörfer Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Świątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienitz und Wolica erb- und eigentümlich erhält, gegen die bisherigen landesherrlichen Abgaben als festen Kanon und die Leistungen an die geistlichen Stiftungen; Anlass ist die verschuldete frühere Schenkung der Güter des entflohenen Starosten von Prusimski. Beigefügt ein Hypothekenschein über die Stadt Zagórów mit der einzigen Beschränkung, dass kein Verkauf an einen Landeseingesessenen ohne Genehmigung erfolgen darf; keine Schulden eingetragen.
oe1bu14525-023: 'Gerichtliche Taxe des dem regierenden Fürsten Friederich Ludewig von Hohenlohe-Ingelfingen gehörenden Gutes Szetlewek im Kreis Konin, Pfarrei Rzgow: 1724 M 22 R Fläche nach der Vermessung des Landmessers Sprengel von 1798, Acker, Wiesen, Kiefernwald, Teiche, dazu Vorwerk, Kmieci, Chalupnici, Komornice, Schenke, Schmiede und Wassermühle. Verpachtet 1799 bis 1805 an Ignatz von Radzinski für 7800 fl, tatsächlich 10.865 fl. Wert 34.803 Rthl 15 gg, nach Abzug des Inventars 31.171 Rthl 23 gg 4 d. Beigefügt Taxen für Brauerei, Brennerei und Ziegelei.'
oe1bu14525-024: Ein stark beschädigter Aktenvermerk von einer Handschriftenseite, dessen Text nur bruchstückhaft lesbar ist. Erkennbar bleiben ein Hinweis auf eine Beilage, die Namen von Laski und Melzer, ein Datum vom 18. April 1803 sowie die Erwähnung von Rückständen aus einem Erbpachtvertrag über Batkowo. Weitere Angaben zu Parteien, Summen und Zusammenhang sind wegen der Textverluste nicht zu gewinnen.
oe1bu14525-025: Ein Hypothekenschein über die Herrschaft Pszczew oder Betsche mit den Dörfern Świechocin, Stoki, Łowyń, Głażewo, Dormowo, Stołuń, Kuligowo, Szarcz, dem Vorwerk Zielomyśl und Silna, den Hauländereien und der Heidemühle, die Fürst Friedrich Ludwig von Hohenlohe-Ingelfingen als eingezogenes geistliches Gut erhielt. Eingetragen sind eine jährliche Kompetenz von 2470 Rthl 16 Gr 3 Pf an die Kriegs- und Domänenkasse Posen sowie Schulden von 48000 Rthl und 5000 Rthl an Bauund Wirtschaftsrat Johann Wilhelm Glenck, 2000 Rthl an Abraham Moses Hirschel, je 5000 Rthl an Freiherr von der Marwitz und die Witwe Christiane Dorothea Michaelis.
oe1bu14525-026: 'Bescheid der Südpreußischen Regierung an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, auf dessen Gesuch vom 20. des Vormonats und die beigefügten Originalurkunden: auf die Herrschaft Betsche werden im Hypothekenbuch je 5000 Rthl. für den Baron von der Marwitz, für die Frau des Oberlandrats Michaelis und für den Wirtschaftsrat Glenck eingetragen. Für jeden der drei Gläubiger wird ein Hypothekenschein in vim recognitionis ausgestellt, den der Fürst nach vier Wochen gegen Zahlung der Kosten aus dem Archiv erhalten kann.'
oe1bu14525-027: 'Eine Bescheinigung der südpreußischen Regierung aus den Betscher Land- und Hypothekenbüchern: Die Güter Betsche im Kreis Meseritz seien dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen durch Schenkungsurkunde vom 10. Juni 1797 und Erklärung vom 1. Dezember desselben Jahres verliehen worden; die Eintragung seines Besitztitels hänge nur noch an der vom Fiskus zu leistenden Resignation. Betsche sei früher geistliches Gut des Bistums Posen gewesen; Schulden habe der Fürst darauf bisher nicht aufgenommen, Schuldurkunden seien nicht zur Eintragung eingereicht. Unterzeichnet Steudener.'
oe1bu14525-028: Ein Hypothekenschein der Königlich Südpreußischen Regierung zu Posen für das adlige Gut Batkowo im Kreis Radziejewo, das mit dem Gut Siedlemin im Kreis Brześć als eingezogenes geistliches Gut des Domkapitels Włocławek dem regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen erb- und eigentümlich verliehen wurde. Eingetragen sind der Besitztitel aufgrund der Verleihungsurkunde vom 1. Dezember 1797 und des Resignationsbriefs, ferner eine unbestimmte jährliche Abgabe an das Domkapitel und das Verbot der Veräußerung an geborene Polen ohne königliche Genehmigung. Schulden sind nicht eingetragen.
oe1bu14525-029: 'Eine Abschrift einer untertänigen Eingabe des fürstlich Hohenloheschen Bau- und Wirtschaftsrats Johann Wilhelm Glenck an den König: auf den höchsten Befehl vom 18. November, den Besitztitel (titulus possessionis) der fürstlich Hohenloheschen Güter Kopojno, Zagórów, Drzewce und weiterer zu berichtigen, habe er alles zur Beschaffung der Urkunden Nötige veranlasst; das bisherige Hindernis sei beseitigt und der Befehl binnen vier Wochen erfüllbar. Glenck bittet daher, bis dahin von Zwangsmaßnahmen abzusehen.'
oe1bu14525-030: Aufforderung der Königlich Südpreußischen Regierung an den fürstlich hohenlohischen Bau- und Wirtschaftsrat Glenck in Breslau, die Hypothekensachen des Gutes Swięcia und der dazugehörigen Güter Kopojno, Drzewce und Zagórów binnen 14 Tagen in Ordnung zu bringen. Andernfalls werde die Fiskalbehörde veranlasst, gegen seinen Auftraggeber, den Fürsten von Hohenlohe-Ingelfingen, vorzugehen. Unterzeichnet Meuser, mit Nummer 2092.
oe1bu14525-031: 'Aufforderung der Königlich Südpreußischen Regierung an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen: da er das Gut Trąbczyn mit Zubehör vom Fiskus erworben hat, muss der Besitztitel zuerst im Hypothekenbuch eingetragen werden. Dazu soll der Fürst binnen vier Wochen eine vidimirte Abschrift des Urteils einreichen, mit dem das gesamte Vermögen des Anton von Prusimski dem Fiskus zugesprochen wurde, dazu eine Bescheinigung des zuständigen Gerichts über die Rechtskraft des Urteils.'
oe1bu14525-032: Ersuchen der Kalischer Behörde an die Oberregierung in Breslau, den regierenden Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen entsprechend der Anforderung vom 24. September des Vorjahres nun bei nächster Gelegenheit den Huldigungseid (Homagium) leisten zu lassen und das darüber aufgenommene Protokoll zu übersenden. Ein knappes Schreiben von wenigen Zeilen, unterzeichnet von Schultz; weiterer Inhalt ist nicht vorhanden.
oe1bu14525-033: 'Ein Konzept zweier Schreiben Glencks an die Königliche Kammer und an die Regierung zu Posen: Nachdem die Regierung im Vorjahr die Berichtigung des Besitztitels der Hohenloheschen Güter binnen vierzehn Tagen gefordert und andernfalls das Vorgehen des Fiscus angedroht hatte, habe der Prinz von Hohenlohe die noch fehlenden Original-Schenkungsurkunden eingesandt. Im Namen seines Herrn bittet Glenck nun dringend um die baldige Resignation des Fiscus über sämtliche fürstlichen Güter in Cujavien und Betsche.'
oe1bu14525-034: 'Antwort der Königlich Südpreußischen Regierung auf eine Anfrage des fürstlich hohenloheschen Bau- und Wirtschaftsrats Glenck vom 13. desselben Monats: Die Resignation des Fiscus für die Güter Kolno und Kamionna ist bereits erfolgt, für die Betscher Güter ist ein Termin auf den 22. März angesetzt. Für die in Cujavien gelegenen, dem regierenden Fürsten von Hohenlohe-Ingelfingen verliehenen Güter ist die Resignation noch nicht beantragt; die Richtigstellung des Besitztitels soll unverzüglich durch einen zugelassenen Justizkommissar bewirkt werden. Unterzeichnet Götz.'
oe1bu14525-035: 'Bescheid der Königlichen Südpreußischen Kriegs- und Domänenkammer an den fürstlich hohenlohischen Bau- und Ökonomierat Wilh. Glenck in Breslau auf dessen Eingabe vom 13. desselben Monats: Für die Resignation sämtlicher Betscher und in Cujavien gelegener Güter des Fürsten von Hohenlohe-Ingelfingen habe der Kammerfiskal Beyer die nötige Anweisung zur Vornahme der Resignation seitens des Fiskus bereits erhalten. Unterzeichnet Münling.'
oe1bu14525-036: 'Bittschrift an den König: Die Regierung zu Posen habe schon länger die Berichtigung des titulus possessionis der fürstlich Hohenloheschen Güter verlangt, worauf der Fürst die dazu fehlenden Schenkungsurkunden im Original eingesandt habe. Namens seines Herrn bittet der fürstlich Hohenlohesche Bau- und Wirtschaftsrat J. Wilhelm Glenck um die schnellste Resignation des Fiscus auf sämtliche fürstlichen Güter in Cujavien und Betsche, damit die Sache endlich zum Abschluss kommt.'
oe1bu14525-037: Mahnung der Königlich Südpreußischen Regierung an den fürstlich Hohenlohe-Ingelfingenschen Bau- und Ökonomierat Glenck John, binnen einer letzten Frist von vierzehn Tagen der Verfügung vom 30. Oktober des Vorjahres nachzukommen und die Berichtigung des Besitztitels der Herrschaft Betsche zugunsten des regierenden Fürsten von Hohenlohe-Ingelfingen in den Land- und Hypothekenbüchern zu bewirken. Unterzeichnet von Götz.
oe1bu14525-038: 'Meldung Melzers an einen Bau- und Wirtschaftsrat, dass der Kammerfiskal zum Termin über die Resignation der Betscher Güter erneut nicht erschienen ist, weil ihm die Kammer noch keine Vollmacht erteilt hat; ein neuer Termin ist beantragt, doch werde die Sache erst vorangehen, wenn die Kammer dem Fiskal eine klare Anweisung gibt, was er zu resignieren hat. Vorgeschlagen wird, der Fürst möge Kammerpräsident von Harlem um Beschleunigung angehen. Nachschrift: das Appellationsurteil in der Sache mit dem Domkapitel und Kruhtswitz ist zugunsten der eigenen Seite ausgefallen.'
oe1bu14525-039: Anzeige des Ministers Hoym, dass Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, durch Kabinettsorder vom 23. des Monats die Stadt Kamionna mit dem Marktort Kolno, die Dörfer Trąbczyn, Szetlewek, Nowawies, Łazy, Alt- und Neu-Laske, Osiny, Hauland Trąbczyński sowie Brzyce geschenkt erhalten hat; die Ausfertigung der Schenkungsurkunde werde beim Lehnsdepartement betrieben, die Schulden des vormaligen Besitzers von Prusimski bei der Regierung in Posen ermittelt. Ertrag mindestens 4000 Rthl jährlich; als Verwalter oder Verkaufsvermittler wird Kammerrat Peucker in Fraustadt vorgeschlagen. Beglaubigte Abschrift durch Sonnabend.
oe1bu14525-040: 'Abschrift eines königlichen Rescripts an die Kammern zu Posen und Petrikau: Die Übergabe der dem Prinzen von Hohenlohe-Ingelfingen verliehenen südpreußischen Güter sei bloß oberflächlich erfolgt; Personen mit Pfand- und Pachtverträgen, teils nachweislich gefälschten, seien ohne Prüfung ihres dinglichen Rechts im Besitz gelassen worden. Die Kammern sollen die Ansprüche prüfen, die Güter den fürstlichen Mandatarien zur freien Wirtschaft übergeben, Streitpunkte möglichst gütlich beilegen, nötigenfalls durch die Fiscale klagen, die Competenzgelder für die Geistlichkeit schleunig festsetzen und über jedes Gut einzeln berichten.'
oe1bu14525-041: 'Hoym beruhigt den Fürsten Friedrich Ludwig von Hohenlohe-Ingelfingen über die Übergabe seiner südpreußischen Güter: er habe den Kammern zu Posen und Petrikau schon am 26. des Vormonats durch Eilboten Anweisung zur schnellsten Übernahme gegeben, noch vor Ausstellung der letzten Schenkungsurkunde; seit Johanni sei der Fürst alleiniger Eigentümer. Die bisherigen geistlichen Besitzer sitzen seit dem 1. Juni 1796 nur für Rechnung des Fiskus, dürfen bis Juni 1798 weiterverwalten; Kompetenzgelder richten sich nach den Taxen, nach Abzug von 15 Prozent Verwaltungskosten und 50 Prozent Abgaben. Wieniec und Wolica bleiben dem Bischof von Cujavien. Beglaubigte Abschrift.'
oe1bu14525-042: Aufforderung der Königlich Südpreußischen Regierung an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, zur vollständigen Berichtigung des Besitztitels (Titulus possessionis) am Gut Szetlewek binnen vier Wochen eine vidimirte Abschrift des Konfiskationsurteils gegen Anton von Prusimski nebst einer Bescheinigung der Rechtskraft einzureichen. Unterzeichnet für die Regierung von Meuser, mit dem Vermerk Lucas in der Adresse. Ein kurzes Reskript ohne weitere Angaben zu Summen oder Bedingungen.
oe1bu14525-043: Abschlägige Antwort auf ein Gesuch des Fürsten von Hohenlohe-Ingelfingen vom 31. Januar, der eine vidimirte Abschrift des gegen von Prusimski ergangenen Konfiskationsurteils samt Rechtskraftbescheinigung erbeten hatte, um seinen Besitztitel an den Trąbczyn'schen Gütern in Ordnung zu bringen. Die Regierung erklärt, das Urteil sei nicht bei ihr, sondern bei der Regierung in Toruń (Thorn) ergangen; der Fürst müsse sich dorthin wenden. Die eingereichte Anlage wird zurückgegeben. Unterzeichnet Danckelmann und Enge[r].
oe1bu14525-044: 'Antwort auf eine Bittschrift des Fürsten von Hohenlohe-Ingelfingen vom 31. Januar, der in der Sache Fiskus gegen von Prusimski eine beglaubigte Abschrift des Konfiskationsurteils mit Rechtskraftbescheinigung erbeten hatte, um den Besitztitel (Titulus Possessionis) der ihm verliehenen Güter Trąbczyn zu ordnen: Das Urteil sei nicht bei der hiesigen Regierung, sondern bei der Regierung in Toruń (Thorn) ergangen, weshalb er sich dorthin wenden müsse; die eingereichte Anlage wird zurückgegeben. Unterzeichnet Danckelmann.'
oe1bu14526-001: 'Begleitschreiben zu übersandten Akten: Der Verfasser bittet dringend, die beiliegenden Witów-Akten dem Kriminalgerichtsrat in Grimm zu übergeben und mit ihm persönlich über den Vorgang zu sprechen. Die Akten seien lange in der Registratur zu Trąbczyn vermutet und gesucht worden; erst beim Umzug aus der Breslauer Wohnung nach Wilhelmsruh habe man sie unter den Papieren seiner Frau gefunden, die sie in seiner Abwesenheit erhalten, verwahrt und danach zu übergeben vergessen habe.'
oe1bu14526-002: 'Kaufpunkte über das adlige Gut Witów im Kalischer Departement, Kreis Warta: Forstinspektor Christian Friedrich Rochlitz verkauft als Bevollmächtigter des Fürsten von Hohenlohe-Ingelfingen an Martin Honrichs und Walęty v. Kwasiborski für 16000 Rthl, zahlbar in drei Raten mit 5 Prozent Zinsen. Ohne Titelgewähr für 1016 składy strittiger Äcker der Warthaer Bürger; bei ausbleibendem Konsens gilt ein Pachtjahr zu 800 Rthl. Vadium 1000 Rthl. Angehängt die Cession von 8000 Rthl Kaufgeld an den Bankier Carl Ferdinand Weigel in Breslau.'
oe1bu14526-003: Bestätigung eines Kaufvertrags in elf Paragraphen, mit dem Joseph von Jankowski aus Ninino sein freies Schulzengut Nr. 1 in Dormowo bei Birnbaum samt Gebäuden, Feldern, Wiesen, Teichen, Geräten und Aussaat für 2000 Rthl. preußisch Courant erblich an den Kreissteuereinnehmer und Hauptmann Andreas Ernst Gneust verkauft; genannt werden die jährlichen Abgaben an das Amt Betsche, Schafhaltung, Brau- und Holzrechte. Das Hohenlohe-Ingelfingensche Justizamt Betsche publiziert den Vertrag, wobei er Jankowski durch den Dolmetscher Hintsch polnisch verlesen wird; Fürst Friedrich Ludwig bestätigt unter Vorbehalt seiner Rechte.
oe1bu14526-004: Kaufvertrag in zehn Paragraphen, mit dem Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, die ihm 1796 geschenkten Güter Kolno und Kaemen (Kamionna) im Departement Posen, Kreis Meseritz, an den Bankdirektor George Conrad Leixner für 142000 Rthl verkauft; davon gingen 53139 Rthl 13 g an den eingewiesenen Gläubiger von Broniewski, 88860 Rthl 10 g an den Fürsten. Verkauf in Pausch und Bogen, Nutzung ab Johanni 1804; übernommen werden zwei Kirchenkapitalien und die streitige Holzberechtigung in den Krobilawer Wäldern. Mit notarieller Beglaubigung und Leixners Genehmigung.
oe1bu14526-005: Ein Kaufvertrag in dreizehn Paragraphen, mit dem Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, die Güter Kolno und Kamionna mit Mühlen, Wäldern, Seen, Zinsen, Propinations- und Jagdrechten sowie der Gerichtsbarkeit in Pausch und Bogen an den Bankkassierer George Conrad Leixner in Frankfurt an der Oder für 142000 Rthl Courant verkauft. Gezahlt werden 76000 Rthl an Bernhardi, 53139 Rthl 13 Gr 8 4/5 Pf an den Rittmeister von Broniewski und der Rest bei der Übergabe am 10. September; der Käufer übernimmt Abgaben und Kirchenlasten und beabsichtigt die Zerstückelung.
oe1bu14526-006: 'Erbpachtvertrag in vierzehn Paragraphen über eine Hufe Magdeburgischen Maßes (30 Morgen) bei Osiny, geschlossen vor dem Hohenlohischen Patrimonialgericht zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen und dem Bauern Blazy Kukulski: Kaufgeld 100 Rthl, bereits gezahlt, dazu jährlich 30 Rthl Erbzins in halbjährlichen Raten ab Weihnachten 1806, Freiheit von Frondiensten, aber Bier- und Mühlenzwang, Laudemium des zehnten Groschen und Vorkaufsrecht der Gutsherrschaft. Beigefügt sind die Vollmacht von 1805 und eine beglaubigte Abschrift.'
oe1bu14526-007: 'Ein Erbpachtvertrag in sechzehn Paragraphen, geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem holländischen Bauern Gottlieb (Bogumił) Sarre vom Peyserschen Hauland über 1 1/2 Hufen Magdeburger Maß Wüstland im Wald bei Trąbczyn: 150 Rthl Einkaufsgeld, bereits bezahlt, jährlicher Erbkanon von 30 Rthl je Hufe, also 45 Rthl in zwei Raten, drei Freijahre bis Johanni 1809, halber Kanon ablösbar, Bau-, Mahl- und Getränkezwang, Verzicht auf Nachlass in Unglücksfällen. Das Gerichtsprotokoll ist polnisch eröffnet; beigefügt ist die Vollmacht.'
oe1bu14526-008: 'Ein Erbpachtvertrag in sechzehn Paragraphen, geschlossen vor dem fürstlich Hohenloheschen Patrimonialgericht zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen und dem Einwohner Christian Friedenberger aus dem Szymanowicer Hauland über eine Hufe Magdeburgischen Maßes in der Trąbczyner Forst: 100 Rthl Kaufgeld, bereits gezahlt, dazu 30 Rthl jährlicher Erbzins, halb ablösbar, drei Freijahre bis Johanni 1809, Laudemium des zehnten Groschens, Mahl- und Bierzwang. Beigefügt sind die Vollmacht von 1805 und der königliche Konsens zur Zerstückelung der Herrschaften Zagorowo und Trąbczyn.'
oe1bu14526-009: Pachtvertrag in achtzehn Paragraphen über das Vorwerk Kopojno, den Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigter des regierenden Fürsten von Hohenlohe-Ingelfingen mit Maciej von Niedźwiecki auf sechs Jahre von Johanni 1805 bis Johanni 1811 schließt, jährlich 1500 Rthl Courant, praenumerando; ohne Brauerei und Brennerei, ohne Inventar, in Pausch und Bogen. Geregelt sind Hand-Dienste der Komorniks und Häusler, Freimahlen, Königliche Abgaben, Brennholz, Baulast und Nachlaß bei Unglücksfällen. Ein Nachtrag vom 24. August fügt 13 Hufen für 625 Rthl hinzu, Gesamtpacht 2125 Rthl.
oe1bu14526-010: 'Vor dem fürstlich hohenlohischen Patrimonialgericht Trąbczyn schließen der Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigter des regierenden Fürsten Hohenlohe-Ingelfingen und Bauinspektor Johann Wilhelm Wollenhaupt einen Erbzinsvertrag in vierzehn Paragraphen über 18 Hufen Acker vom Vorwerk Drzewce und 2 Hufen Wiesen bei Wrąbczyn samt Wohnhaus und Brauhaus: Kaufgeld 300 Rthl je Hufe, zusammen 6000 Rthl, jährlicher Erbzins 300 Rthl, Zerschlagung in zehn Bauernstellen, Laudemium des zehnten Groschen. Ein zweites Protokoll hebt den Vertrag wieder auf; Wollenhaupt erhält 600 Rthl und quittiert alle Forderungen, räumt das Wohnhaus zu Michaelis für die Pächter Tietz und Schatzmann und behält 43 Rthl 1 Silbergroschen Bauverbesserung vor.'
oe1bu14526-011: 'Ein Erbzinsvertrag in zwölf Paragraphen, vor dem Patrimonialgericht Trąbczyn geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des regierenden Fürsten zu Hohenlohe-Ingelfingen und dem Schönfärber und Ratsherrn Johann Seymert aus Zagorowo: dieser erhält 3 Hufen Magdeburger Maß (2 Hufen 24 Morgen Acker, 6 Morgen Wiese) vom Vorwerk Trąbczyn für 900 Rthl Kaufgeld, zahlbar zu Johanni, und 45 Rthl jährlichen Erbzins in zwei Raten. Er baut ohne Bauhilfe, trägt alle Abgaben, unterliegt dem Bierzwang, ist frei von Diensten; bei Verkauf fällt Laudemium an.'
oe1bu14526-012: 'Ein Erbzinsvertrag in zwölf Paragraphen, vor dem Patrimonialgericht Trąbczyn geschlossen zwischen dem Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Förster George Friedrich Kammer aus Pietrzykowo: Kammer erhält vom Vorwerk Przybysław 6 Hufen Acker und 20 Morgen Wiese samt Gebäuden für 2100 Rthl Kaufgeld, zahlbar zu Johanni und Weihnachten, dazu einen unveränderlichen jährlichen Erbzins von 100 Rthl. Er trägt alle Abgaben, unterliegt dem Dominium und dem Krugzwang, Nachlass bei Unglücksfällen ist ausgeschlossen.'
oe1bu14526-013: Ein Erbpachtvertrag in neunzehn Paragraphen, geschlossen zwischen dem Kriegs- und Forstrat Peter Friedrich August von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Amtmann Johann Gottlieb Tschachmann über 20 Magdeburgische Hufen (560 Morgen Acker, 40 Morgen Wiese) aus den Ländereien von Trąbczyn auf der Kopojno-Seite. Kaufgeld 300 Rthl je Hufe, zusammen 6000 Rthl, davon 200 Rthl angezahlt, 5800 Rthl zum 22. Juni fällig; jährlicher Canon 15 Rthl je Hufe, unablöslich. Weiterverkauf erlaubt gegen Laudemium des zehnten Groschens; Brau- und Brennzwang, Gerichtsbarkeit des Dominiums, kein Nachlass bei Unglücksfällen.
oe1bu14526-014: 'Erbzinsvertrag in dreizehn Paragraphen: Kriegs- und Forstrat von Triebenfeld übergibt als Generalbevollmächtigter des Fürsten von Hohenlohe-Ingelfingen dem fürstlichen Forstinspektor Carl Titz fünf Hufen Magdeburger Maß aus dem Vorwerksacker Trąbczyn, vom Weg nach Podbiele bis zum Mühlgraben samt Obstgarten, auf ewige Zeit in Erbpacht. Kaufgeld 300 Rthl je Hufe, zusammen 1500 Rthl in zwei Raten zu Johanni 1805 und 1806, dazu jährlich 75 Rthl Erbzins. Titz trägt Steuern, Abgaben an Ląd und Bauten selbst; Verkauf nur mit Zustimmung der Grundherrschaft gegen Laudemium.'
oe1bu14526-015: 'Ein Erbpachtvertrag in 22 Paragraphen, geschlossen vom Kriegs- und Forstrat von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen mit den unterzeichneten Erbpächtern über 270 Hufen Magdeburgischen Maßes aus den Gütern Trąbczyn, Łazy, Osiny, Neudorff und Przybysław: Kaufgeld 300 Rthl je Hufe, unablöslicher Erbzins von 15 Rthl jährlich in halbjährlichen Raten, vier Freijahre für Waldgrund, Laudemium des zehnten Groschens bei Besitzwechsel, Zwang zum Bierbezug aus der Herrschaft, Freiland für Schulmeister, Schulze und Kirche, gesamtschuldnerische Haftung. Ein Nachtrag verzeichnet bereits abgetrennte 156 Hufen 25 Morgen.'
oe1bu14526-016: Ein Erbpachtvertrag in achtzehn Paragraphen über das zu Trąbczyn gehörende Vorwerk Althütte von 10 Hufen 10 Morgen Magdeburgischen Maßes, geschlossen zwischen dem Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen, vertreten durch den Kriegs- und Forstrat von Triebenfeld, und den Einwohnern Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dämmel, Gottfried Damt und Christoph Schoenfisch. Kaufgeld 150 Rthl je Hufe, zusammen 1500 Rthl, davon 450 Rthl angezahlt; jährlicher Erbzins 225 Rthl, Freijahre für Rodeland bis 1808, Laudemium des zehnten Groschen, Bier- und Branntweinzwang. Ein früherer Vertrag vom 26. Mai wird aufgehoben.
oe1bu14526-017: Ein Kaufvertrag in siebzehn Paragraphen, geschlossen von Kunkel als Bevollmächtigtem des Fürsten Friedrich Ludwig zu Hohenlohe-Ingelfingen, Herrn der Herrschaft Trąbczyn, mit sechs Holländern (Martin Giering, Wilhelm Daniel Schulz, Gottfried Dumel, Michael Dumel, Gottfried Damt, Christoph Schoenfisch) über zehn Hufen und zehn Morgen des Vorwerks Alte Hütte zu 250 Rthl je Hufe, insgesamt 2500 Rthl in Raten (450 Angeld, 550 Johanni 1804, 1500 im März 1805), dazu jährliche Erbpacht, Holz-, Weide- und Ziegelrechte, 10 Prozent Laudemium und Bierzwang; gültig unter Vorbehalt der fürstlichen Genehmigung.
oe1bu14526-018: Beglaubigte Abschrift eines Erbpachtvertrags in 18 Paragraphen, durch den Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen die Herrschaft Betsche mit Vorwerken, Wäldern, Braurecht und Propination in Pausch und Bogen an die Stadt Betsche und die Dörfer Stalluhn, Kulligowo, Schartzig, Stocki, Schwichodzyn und Lowin überträgt, vertreten durch Matheus Młynkiewicz und Jan Chmara, für 180.000 Rthl und 1000 Rthl jährlichen Canon; die Gemeinden übernehmen 137.000 Rthl eingetragene Schulden. Jurisdiktion, Jagd, Laudemium von 10 Prozent und Forstaufsicht bleiben vorbehalten. Beigefügt ein Nachtrag vom 29. Juli 1804 und die königliche Genehmigung der Dismembration.
oe1bu14526-019: 'Ein Erbpachtvertrag in 18 Paragraphen, geschlossen am 28./29. Juli 1804 zwischen dem Generalbevollmächtigten Bauart Johann Wilhelm Glenck für Fürst Friedrich Ludwig zu Hohenlohe-Ingelfingen und den Bevollmächtigten Matheus Młynkiewicz für die Bürger von Betsche sowie Jan Chmara für Stalluhn, Kulligowo, Schartzig, Stocki, Schwiechodezin und Lowin: Vorwerke, Wälder, Seen und Propinationsrecht gehen in Pausch und Bogen für 180000 Rthl und 1000 Rthl jährlichen Kanon über, davon 137000 Rthl übernommene Hypotheken, 35000 Rthl bar, 8000 Rthl später. Vorbehalten bleiben Gerichtsbarkeit, Jagd, Schloss und 10 Prozent Laudemium.'
oe1bu14526-020: 'Schenkung des herrschaftlichen Wohnhauses in Swięcia an den Posener Gastwirt Friedrich Götzinger, erb- und eigentümlich, zur freien Verfügung: eine Anerkennung für seine Mühen und Reisen im Erbpachtgeschäft und weil er das Haus als Schankhaus zu der von ihm übernommenen Brauerei-Erbpacht gut nutzen kann. Das Wohnhaus war ausdrücklich ausgenommen von der am selben Tag erfolgten Erbpachtvergabe der Vorwerksgebäude mit Äckern, Wiesen und Wäldern an Johann Christian Birlack, Johan Götzinger, Joh. Siebert und Friedrich Götzinger. Ausgestellt von Friedrich Ludwig, Prinz von Hohenlohe.'
oe1bu14526-021: 'Punktation in zwölf Paragraphen zwischen dem Kriegs- und Forstrat Peter Friederich August von Triebenfeld als Generalbevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und Franz Meierowitz über den erblichen Verkauf des Guts Witów im Wartedistrikt mit allen Einwohnern, Krügen, Ländereien, Schulzenamt, Gewässern, Gebäuden und Inventar in Pausch und Bogen: Kaufpreis 20.000 Rthl Courant, 8.000 am 23. April, 12.000 zu Johanni 1805, dazu ein ewiger Kanon von 500 Rthl jährlich, ablösbar mit 10.000 Rthl. Vollzug erst nach Aufhebung des Kaufs mit Honrichs; die 6.000 Rthl der verwitweten Obristin von Schliesen dürfen stehen bleiben, der Fürst tritt im Rang zurück. Die Konzession zum Gutsbesitz will der Verkäufer beim König erwirken, die Kosten trägt der Käufer.'
oe1bu14526-022: Übersendung einer beglaubigten Abschrift des mit dem Bankkassierer Leixner geschlossenen Kaufvertrags über die Güter Kolno und Kaemen an Friedrich Ludwig, Fürst von Hohenlohe-Ingelfingen, mit der Mitteilung, dass der Vertrag am selben Tag königlich bestätigt worden sei. Ein kurzes Begleitschreiben der Königlich Südpreußischen Regierung im Namen König Friedrich Wilhelms, ohne weitere Angaben zum Inhalt des Vertrages.
oe1bu14526-023: 'Königliche Bestätigung eines Kaufvertrags in zehn Paragraphen: Fürst Friedrich Ludwig von Hohenlohe-Ingelfingen verkauft die ihm 1796 von Friedrich Wilhelm II. geschenkten Güter Kolno und Kaemen (Kamionna) im Posener Departement an den Bankdirektor George Conrad Leixner in Pausch und Bogen für 142.000 Rthl., davon 53.139 Rthl. an den vormaligen Possessor von Broniewski gezahlt. Übernommen werden zwei Kirchenkapitalien, gelöscht wird ein Kapital von 100.000 Rthl. für von Triebenfeld; der Holzungsstreit gegen von Kwilecki geht als rem litigiosam mit über. Beigefügt sind die Vollmachten für Melzer und Guderian.'
oe1bu14526-024: 'Ablehnender Bescheid auf das Gesuch Friedrich Ludwigs, Fürst von Hohenlohe-Ingelfingen, vom 31. Dezember des Vorjahres, die Herrschaft Betsche den dortigen Bürgern und Landbewohnern in Erbpacht zu geben; der eingereichte Erbpachtvertrag wird zurückgesandt. Gestützt auf eine Kabinettsordre und ein Rescript der südpreußischen Finanzkammer wird die Erbverpachtung für unzulässig erklärt: der Adel des Landes würde Erwerbsmöglichkeiten verlieren, der einzige bedeutende Forst bei Betsche wäre der Verwüstung ausgesetzt, und die Bewohner besitzen schon genug Land und zu wenig Mittel.'
oe1bu14526-025: Ein Kaufvertrag über das Vorwerk Szetlewek bei Trąbczyn mit 1000 Magdeburger Morgen (459 Morgen Acker, 109 Wiesen, 19 5/8 Gärten, 380 zu rodendes Land, 32 3/8 Wald) samt allen Wirtschaftsgebäuden, geschlossen zwischen dem Bau- und Wirtschaftsrat Johann Wilhelm Glenck als Bevollmächtigtem des Fürsten von Hohenlohe-Ingelfingen und dem Mahlmüller Samuel Lucke von der Mühle Białobrzeg bei Wrąbczynek, vorbehaltlich fürstlicher Ratifikation. Kaufpreis 12333 Rthl (8333 an den Pfandbesitzer von Radzinsky, 4000 an die Herrschaft), dazu 500 Rthl Kanon jährlich, Bauholz aus den Trąbczyner Wäldern, Propinationsrecht mit Brauhaus und Brennerei für 400 jährlich; Untertanendienste bleiben ausgenommen. Lucke erbittet vier Wochen Frist zur Beibringung seiner Mitkäufer.
oe1bu14526-026: 'Vor der Polizeiobrigkeit erklären der Polizeibürgermeister Nüchler aus Pyzdry, der Müller Luka aus Białobrzeg und der Schütze Reise aus Wrąbczynek ihren mit dem hohenlohischen Bau- und Wirtschaftsrat Glencke als Generalbevollmächtigten am 20. November 1798 geschlossenen Vertrag über die Parzellierung des Gutes Szetlewek in den Trąbczyner Gütern für null und nichtig: der Pfandbesitzer von Brzezinski hindert die Räumung. Bedingung sind 200 Rthl Ersatz der Reisekosten; die angeworbenen Siedler sollen sich allein an das Dominium halten. Glencke sagt Zahlung unter dem Vorbehalt fürstlicher Genehmigung zu.'
oe1bu14526-027: 'Bericht von Titz und Bancke an einen Bau- und Wirtschaftsrat: Der Müller Luka tritt vom Vertrag zurück, will die Einzelheiten in Kalisz regeln und hat die 25 Rthl erhalten; zwei von ihm mitgebrachte Landinteressenten wurden vertröstet, bis die Sache mit Trąbczyn und Herrn von Szucki beendet ist. Erbeten wird ein Vortrag bei der Königlichen Regierung, ob der Fürst zu den 1000 Rthl Abzugsgeld der Gemeinde zuschießt, sowie Anweisungen zum weiteren Verhalten. Nachschrift: Ein Tischler kaufte stattdessen ein Haus in Zagorowo.'
oe1bu14526-028: 'Bericht Glencks an den Kriminalgerichtsrat Grimm in Kalisch: Der Vertrag mit von Radzinski ist nach beiliegender Abschrift des Schriftwechsels aufgehoben. Die drei Kontrahenten Luck, Kriede und Nüchler treten nicht zurück, da sie bereits 18 Bauern mit Handgeld für fast 2/3 der Felder gestellt haben; der Mitkontrahent Griese stellt eine Kaution von 2/M. Rthl, die in Pyzdry gerichtlich beantragt werden soll. Die Schadensforderung sei von Radzinski anzurechnen. Ferner zum Slugoziner Wiesenstreit eine Karte und zur Erbpacht der Trąbczyner Holländer der Vorbehalt, das Privileg gelte nur für die ersten Besitzer, Sohn und Enkel.'
oe1bu14526-029: 'Anfrage des hiesigen Hofgerichts an Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, wegen des Vorkaufsrechts: Nach einem beigefügten Kaufvertrag vom 28. September hat Sigismund von Rzadkowski das in Głazewo gelegene Erbzinsgut an seine Halbschwester Susanna, geborene Treben, verkauft. Der Vertrag ist unter Vorbehalt der fürstlichen Rechte bestätigt. Der Fürst wird gebeten, binnen einer gesetzten Frist von Wochen zu erklären, ob er vom Vorkaufsrecht Gebrauch macht; nach Fristablauf gilt es als aufgegeben. Unterzeichnet Metzig und Neumann.'
oe1bu14526-030: 'Beglaubigter Auszug aus dem Privilegienbuch des Posener Domkapitels, deutsch und im lateinisch-polnischen Original: Bischof Theodor Fürst Czartoryski verkauft 1766 zu Dolsk den Eheleuten Simeon und Apollonia Rządkowski und ihren Nachfolgern eine wüste Hufe Acker im Dorf Głazewo beim Schlüssel Betsche samt herrschaftlich erbautem Wohnhaus und Scheune für 30 Ducaten in specie, gegen jährlich 130 fl. polnisch in zwei Raten, Kopfsteuer und Hibern, vier Hoftage auf dem Vorwerk Głazewo und Räumung der Wiese Obsko; je zwei Viertel Gerste geben eine Tonne Bier aus der Betscher Brauerei. Auszug durch den apostolischen Notar Melchior Janowski, Übersetzung beglaubigt.'
oe1bu9454-001: 'Der Fürst drängt Triebenfeld, bei Fürst Hardenberg den Vorschuss von 112000 Rthl und die sofortige Administration der Majoratsgüter zu erwirken; damit ende Cosmars Macht. Ein Mandatarius habe gegen 12000 Rthl und eine sichere Anweisung auf hunderttausend Rthl die Auslieferung des Schuldinstruments zugesagt. Der günstige Bericht des Oberlandesgerichts Brzeg sei eingesandt. Zudem soll Triebenfeld die Sache Trąbczyn und Kamionna betreiben: Die vom König verliehenen Güter hätten die Polen eigenmächtig weggenommen, der Kaiser müsse die Rückgabe befehlen.'
oe1bu9454-001a: 'Triebenfeld legt ein soeben erhaltenes Schreiben des in großer Not lebenden Fürsten von Hohenlohe vor und bittet, sich seiner zu erbarmen. Nur der Vorschuss von 112000 Rthl könne ihn retten: Die Curländischen Erben würden befriedigt, Cosmars Gewalt ende, Sr Majestät erhalte die 112000 Rthl aus den Fonds der Majoratsgüter zurück. Zu den in jenem Schreiben erwähnten Trąbczyner Gütern im Kreis Konin erbittet er Weisung, ob er jetzt die Urkunden und Dokumente einreichen darf.'
oe1bu9454-002: Triebenfeld ist entsetzt, dass der Fürst seit dem 13. keine Briefe erhalten haben will. Er erinnert an seine 7 Briefe, darunter an General Schöler wegen Trąbczyn und die Nachricht, dass die Kreise der Güter an Russland fallen. Er fleht um 200 Ducaten, da er dem Fürsten Kanzler 100 und Barbe 70 geben müsse. Die Sachen lägen bei Stägemann, das Geld werde gezahlt und ein Administrator angestellt. Fürst August soll Cosmars Vollmacht sofort widerrufen und dies den Gerichten anzeigen.
oe1bu9454-003: 'v. Triebenfeld klagt über Geldnot: Er rechnete mit 1400 Rthl auf 4 Wochen, erhielt in 5 Monaten aber nur 932 Rthl, und bittet dringend um 200 #. Mit Barbe will er in der polnischen Sache zu Minister Nesselrode. Er rät, per Pro Memoria einen ergebenen, kautionsfähigen und sachkundigen Administrator der Majoratsgüter für königliche Rechnung vorzuschlagen. Er hofft bald auf die Resolution des Fürsten über den Vorschuss und die polnischen Güter.'
oe1bu9454-004: 'Berichtet über Napoleons Rückkehr: Grenoble sei in seiner Gewalt, er habe etwa 30/m Mann, auf seinen Kopf seien 10 Millionen Francken gesetzt. Bittet den Fürsten um einen Korbwagen für den Diener von Hoffrath Barbe, der von Sławięcice aus Barbes Schwester aus der Schweiz holen soll, und um ein Fuhrwerk mit 2 Pferden für Glaskisten der Hoffräthe Barbe, Heym und Philipsborn aus Prag. Wünscht Eberhards Kommen, fragt nach F. Augusts Schritten wegen der Vollmacht und erbittet weitere Blanquets.'
oe1bu9454-005: Zerboni hat Trzciński aufgefordert, ihm aufgrund einer angeblichen Cession der fürstlichen Forderung von 10000 und 5000 Rthl zu zahlen. v. Triebenfeld bestreitet dies vorläufig und bittet dringend um Auskunft; er fürchtet, der Fürst habe Zerboni etwa ein Blanquett gegeben. Trzciński will auf Zerbonis Anweisung schon an König für das Geschäft in Biskupice gezahlt haben, was v. Triebenfeld für Betrug hält. Präfekt v Smiedecki in Kalisz sei gewonnen und werde in der Entschädigungssache wegen Amt Sokolnik günstig berichten.
oe1bu9454-006: 'Triebenfeld berichtet über die Entschädigung im russischen Anteil: Er hat die Starostei Sokolnik gefordert, verrechnet mit der Forderung des Fürsten; Minister Stein soll dies mit Nesselrode regeln. In der Curischen Angelegenheit erhielt er über Stägemann den Auftrag, sich mit den Curischen Erben zu vergleichen. Diese zeigten an, Cosmar habe ihnen die Sytener Güter angetragen. In 2 Tagen erwartet er die Erklärung des Königs. Hardenberg verspreche nur. Er bittet dringend um 100 Ducaten per Estaffette.'
oe1bu9454-007: Charlotte von Triebenfeld bittet den Fürsten, ihr durch einen seiner Untergebenen die Adresse ihres Vaters zukommen zu lassen, damit sie ihm selbst schreiben kann. Es ist ihr dritter Brief ohne Antwort; ein Brief des Vaters habe sie erneut an die Gnade des Fürsten verwiesen. Ihr Elend habe alle Grenzen überschritten, zumal sie die Hoffnung aufgeben müsse, dem Vater ihre Lage mündlich zu schildern. Um Hilfe wage sie nicht mehr zu bitten.
oe1bu9454-008: Von Triebenfeld bittet den Fürsten eindringlich, seinen notleidenden Kindern 120 Rthl zu schicken und bei längerem Aufenthalt monatlich 60 Rthl. Er lebe von geborgtem Geld. Die Sache des Fürsten stehe gut. Er fragt, ob vom Curischen Mandatarius eine schriftliche Zusage zu erhalten sei, dass die Sache mit 112/m Rthl abgemacht sein solle. Es gebe mächtige Feinde. Außer dieser Zusage brauche er hier nichts. An Hahn will er selbst schreiben.
oe1bu9454-010: v. Triebenfeld wundert sich, dass seine Briefe, meist über Teichelmann geschickt, nicht angekommen sind, und will ihnen einen Laufzettel nachsenden. Stägemann hat noch keinen Vortrag gehalten, der Fürst Kanzler aber gibt beste Versicherungen. Die polnische Angelegenheit hat er der Commission übergeben und erwartet dafür Güter statt Geld. Er berichtet Kriegsnachrichten und Gerüchte, wundert sich über das Zögern von Fürst August, die Vollmacht zu widerrufen, und legt einen Brief an Eberhard bei.
oe1bu9454-011: 'Triebenfeld meldet, die Angelegenheit des Fürsten solle diese Woche günstig entschieden werden, drängt aber, Eberhard eilig nach Wien zu senden, um einen Vergleich mit den Erbinnen zu schließen; schlimmstenfalls müssten die Güter 5 Jahre länger administriert werden. Er beklagt, dass Fürst August Cosmar die Vollmacht nicht abnehmen will, schlägt einen über Hardenberg zu betreibenden Schritt zugunsten Prinz Adolphs vor und erbittet 100 #, um Barbe zu bezahlen. Dazu Kongressnachrichten und Kriegsgerüchte.'
oe1bu9454-012: 'Triebenfeld bittet dringend um die Übersendung der 200 #, da man hier ohne Geld nichts ausrichten könne und sonst trotz guter Lage alles verloren sei. Fürst August solle die Vollmacht rasch von Cosmar zurückfordern. Er warnt vor dem Revers des jungen Herrn, den der Fürst, wie er höre, in Öhringen gelassen habe. Der König von Württemberg habe die Mediatisierten als Stände anerkannt und einen Verfassungsentwurf geschickt.'
oe1bu9454-013: 'Triebenfeld bittet dringend um 200 # und 2 französisch unterzeichnete Blanquets. Er schuldet Barbe 145 # und braucht einen Rock, die Papiere verlieren stark an Wert. Der Fürst will ihm 100 # Vorschuss geben lassen, gegen Rückzahlung an die Casse. Seit 3 1/2 Wochen ohne Nachricht, lebt er von Wasser und Brot. Laut Bericht will H., dass Adolph Koszęcin kauft, das 55/m Rthl jährlich trage. Triebenfeld vergleicht es mit Sławięcice.'
oe1bu9454-014: 'Der Schreiber fragt, warum auf die Beschwerde des Fürsten zu Hohenlohe noch nichts verfügt sei. Er hält eine angeblich eingeleitete Untersuchung gegen Cosmar für schädlich, da Cosmar dann die seit Johannis 1812 rückständige Rente zurückhalten könnte. Ein Vergleich über die Schuld sei gescheitert: Die Generalmandatarien lehnen ab, weil Justizrath Henneberg in Berlin beschieden wurde, die Sache ruhen zu lassen. Der König solle die Schuld ganz übernehmen; dem Fürsten dürften wohl auch 35000 Rthl erlassen werden.'
oe1bu9454-015: Triebenfeld meldet, der König habe laut Schreiben des Staats Kanzlers gegen die Auszahlung der von Fürst August geforderten 100000 Rthl, eines Vermächtnisses der Fürstin Sakkin, nichts einzuwenden; Kircheisen sei beauftragt. Der Vorschuss von 112000 Rthl gelte als gelungen, Cosmars Entfernung sei beschlossen. Die Trąbczyner Sache werde große Schwierigkeiten haben; die polnischen Akten müssten übersetzt werden, doch fehlten ihm die 260 fl für den Translateur. Schwer krank und mittellos bittet er dringend um Hilfe, auch für seine Tochter.
oe1bu9454-016: Triebenfeld hat Obristlieutenant v Thiel gefragt, ob der König bei Prinz Adolphs Ankunft am 20. noch in Wien sei. Thiel versichert, der König werde sich freuen und man reise nicht vor dem 22. ab. Mit Hardenberg hat Triebenfeld noch nicht gesprochen, die Sachen des Fürsten ruhen weiter. Er berichtet, Murat sei bis Mantua vorgedrungen und Bonaparte sammle Truppen bei Paris. Dem Fürsten müsse für Güter ein Äquivalent gegeben werden. Der Schluss über eine Hypothek bei Zagórów ist kaum lesbar.
oe1bu9454-017: 'Triebenfeld wehrt sich gegen den Vorwurf, den General Kleist vor Prefect Graf Garczynski in Kalisz erhob: Die Söhne des Fürsten hätten in Berlin erzählt, Triebenfeld stecke alle Einkünfte ein. Er verweist auf Cabanis, Hecker, Honrichs und die Sequestratoren und lässt die Sache durch Komornik v. Chomanowski untersuchen. Die Zinsrückstände betrügen ohne die Olesnicer, Wrąbczyner und Bauerngüter an 30000 Rthl. Er beklagt Gerüchte Sommers über die Schulden des Fürsten und bittet um schnelle Antwort wegen Sobottendorff, Weigel und der Invaliden-Summe.'
oe1bu9454-018: v. Triebenfeld weist das vom Fürsten übersandte Instrument samt Vollmacht zurück, da er Generalvollmacht besitze und alles mit Arrest belegt sei. Unter französischem Arrest habe er für den Fürsten an die Invaliden Casse zahlen müssen. Die französische General Direction ordnete die Rückzahlung der 3121 Rthl aus den Gütern an. Er verlangt eine Erklärung, die ihm 4219 Rthl aus den Zinsresten der Einwohner von Wrąbczyn, Alt Olesnica, Kopojno, Skokum, Świątniki und anderen Orten anweist, beizutreiben durch einen Komornik.
oe1bu9454-019: Triebenfeld drängt auf eine Einigung mit Sobottendorff, dem der Fürst 40000 Rthl schuldet. Nach der Einigung mit Tschachmann und mit Hawich, dem er für 1300 Rthl eine Hypothek auf sein Blizanów geben muss, will er Gründe, Gebäude und Wiesen auf 18 Jahre für 36000 Rthl an Sobottendorff verpachten. Er bittet eilig um das Instrument nach seiner Vorschrift, da alles mit Arrest belegt ist und stellt dem Fürsten 4000 Rthl aus dem Witower Prozess in Aussicht, falls dieser gewonnen wird.
oe1bu9454-020: 'Nach einer neuen Cabinets Ordre muss trotz Valuta in Papier in Courant gezahlt werden. Das bringt in der von der Lahrschen Sache 1500 Rthl Verlust. Der Schreiber fürchtet wegen 3000 Rthl eine Verhaftung durch van der Lahr. Er schrieb Amelang, dieser solle van der Lahr einen Vergleich anbieten: 1000 Rthl bar und 350 Centner Eisen a 6 Rthl bis Ende April. Dafür erbittet er 950 oder 1000 Centner Eisen bis zum 20. April nach Konotop.'
oe1bu9454-021: Triebenfeld schickt über Lombardini einen weiteren Boten an den Fürsten. Nach Dlugo Lędckis Besuch berichtet er von Furcht vor der baldigen Ankunft der Russen; nach dem Urteil jedes Polen erhalte der Fürst die Güter Trąbczyn, Kamionna und Brzyce zurück. Er bittet um schnelle Antwort und Geld zum Bestechen, da er mittellos sei; Konotop und Świniary habe er für 14000 Rthl jährlich verpachtet. Er erwartet Urkunde und Geld. Lombardini soll seinen Töchtern in Wrocław wenigstens 200 Rthl Münze geben.
oe1bu9454-022: 'v. Triebenfeld klagt über Prozesse, die er wegen seiner Bürgschaft für den Fürsten führt: wegen der Invaliden Casse, mit Oppenheimer und mit der Schliefen. In Polen klagt er gegen Meierowitz, der der Schliefen 6000 Rthl Kaufgeld von Witów und dem Fürsten 2500 Rthl Erbzinsen schuldet. Stenger soll die Sachen betreiben; Hawich nennt er den größten Spitzbuben, ein Badenski ziehe alle Gelder ein. Lombardini zahlte die 150 Rthl nicht; er wünscht sich 500 Rthl Münze für seine Kinder.'
oe1bu9454-023: Triebenfeld klagt, der Fürst habe seinen Töchtern kein Geld geschickt; er selbst habe über die erhaltenen 4300 Rthl hinaus große Kosten getragen, erleide Execution und sei gichtkrank. Criminal Rath Stenger soll in Zagórów, Trąbczyn, Pszczew und Witów alles ordnen, verspricht Trąbczyn und Kamionna zurückzubringen und schlägt einen Actuarius Seifert für 250 bis 300 Rthl vor; Triebenfeld erbittet die Genehmigung. Honrichs soll sich ausweisen, sonst lässt Stenger ihn verhaften. Es heißt, die Russen würden Polen besetzen.
oe1bu9454-024: Der Schreiber bittet einen Geheimen Rath, ein Anlehn von 400000 Rthl zur Tilgung sämtlicher Schulden zu vermitteln, gesichert durch erste Hypotheque auf Zagórów und Trąbczyn. Deren reiner Ertrag sei nach der Colonisirung von der Kalischen Kammer auf 40247 Rthl bestätigt. Vollmacht und Documente sollen folgen. Beiliegen ein Ortsverzeichnis beider Herrschaften (u. a. Trąbczyn, Szetlewek, Przybysław), eine von v Triebenfeld unterzeichnete Ertragsberechnung (Erbzinsen der Colonien 16781 Rthl) und eine Schuldenliste über 366000, darunter Prusimska circa 16000.
oe1bu9454-025: 'Triebenfeld hat einen neuen Bauernaufstand in Zagórów gegen die Separation der Gründe beigelegt. Über Justiz Rath Bucholz sind ihm 80000 Rthl eines von Bredow zugesichert: 30000 Rthl auf Konotop, 20000 auf Świniary, 30000 auf Trąbczyn für die Grotowskische Hypothek Weigels. Auszuzahlen sind 25000 an Gräfin Schlabrendorff, 25000 an Weigel, 5000 an Hahn für Koszęcin und 5000 bar an den Fürsten. Tesmar verhandelt mit Nathusius in Magdeburg über 360000 Rthl auf die südpreußischen Güter.'
oe1bu9454-026: Triebenfeld hat durch Secretair Koppe erfahren, dass der Fürst die Niederlage der Armee überlebt hat. Minister von Stein lieh ihm auf die Konotoper Hypothek von 10000 Rthl 8000 Rthl. Die Anweisung über 6000 Rthl schickt er an Koppe, 4000 Rthl will er bringen, sobald er den Aufenthalt des Fürsten kennt. Auf eine Hypothek auf Świniary von 20000 Rthl will er Stein erneut um Geld bitten. Er hofft, der Fürst erhalte die Kolziger Güter; dann könne er 100000 Rthl beschaffen.
oe1bu9454-027: Triebenfeld meldet, dass die Familie Prusimski Trąbczyn und Kamionna mit Gewalt an sich genommen hat. Er hat nur Protestationen einlegen lassen, um die von ihm eingetragene Summa zu sichern, erwartet aber vorerst Abweisung. Die Antwort Napoleons auf ein Schreiben der Generalin v. Sanitz, der man die Güter ihres Gemahls nahm, werde als Norm dienen. Er will morgen nach Memel reisen, vielleicht nach St Petersburg, und hofft über Kaiser Alexander oder Großfürst Constantin Hilfe zu erreichen.
oe1bu9454-028: 'Hawich meldet, dass die Trąbczyner Güter auf Verordnung der regierenden Commission durch den Appellationsrichter v Lipski abgenommen und Canonicus v Jezierski, Generalbevollmächtigtem der Frau v Dąbska geb. v Prusimska, übergeben wurden; er protestierte. Neue Prozesse: Probst Iwanski fordert den Decem von Swięcia, Martin v. Otocki und Müller Ekstaedt etwa 7000 Rthl Entschädigung aus einem Trąbczyner Pachtvertrag von 1798. Er bittet um den Vergleich aus Wrocław und eine Vollmacht.'
oe1bu9454-029: Bally erinnert von Triebenfeld an das Treffen, das dieser ihm bei der Begegnung mit Hoffrath Hahn in Łosiów bei Brzeg versprochen hatte. Er vermutet ihn wieder in Wrocław und fragt, ob und wann er ihm dort aufwarten könne, da sein Herr (Durchlaucht) danach gefragt habe. Er hat gehört, dass auch in Sławięcice französische Einquartierung kommen soll. Dann könne er nicht fort, schlimmer noch, wenn er die Stallungen räumen müsse. Er hofft auf ein baldiges Gespräch.
oe1bu9454-030: Triebenfeld berichtet, dass französische Gendarmen ihn als Generalbevollmächtigten unter Arrest hielten, bis die rückständigen Zinsen von 5000 Rthl auf die 50000 Rthl der Invaliden Casse bezahlt waren. Oppenheimer, der die Zahlung übernommen hatte, kaufte sich los. Zastrow bürgte für 5000 Rthl, die zum 1. Juny zurückzuzahlen sind. Triebenfeld bittet dringend um Rücksendung der an Eysenhardt zedierten Anweisung auf 6000 Rthl, um seine verpfändete Hypotheque von 10000 auszulösen. Zastrow betreibt bei der französischen Behörde die Rückgabe der Trąbczyner Güter.
oe1bu9454-031: 'Triebenfeld, nach der Arretirung wegen rückständiger Zinsen erkrankt, bittet um Rücksendung der Anweisung über 6000 Rthl, um die verpfändete Hypotheque von 10000 Rthl zurückzuerhalten. Er beklagt, dass der Fürst Hawich aus Pyzdry als Justitiarius angestellt und Honrichs eine General Vollmacht gegeben hat, die zurückgefordert werden soll, und schlägt Gehälter von zusammen 1800 Rthl vor. Zu Prozessen: Ignatz von Radzinski ist als Erbpachter von Szetlewek im Rückstand; die Przespolewskische Sache gehört zu Trąbczyn und den Prusimskischen Erben.'
oe1bu9454-032: Triebenfeld kann keine neue Nachweisung schicken; in der vor 2 Jahren übersandten seien nur die Trąbczyner Revenuen abzuziehen. Die Einkünfte der Herrschaft Zagórów beziffert er auf 27700 Rthl jährlich, die Schulden auf 148,800 Rthl, sodass 20260 Rthl blieben. Oppenheimer hat die 50000 Rthl an die Invaliden Casse nicht bezahlt; Triebenfeld hat ihn verklagt. Die Trąbczyner Güter hält er nicht für verloren. Er hatte 200000 Rthl aus Holland in Aussicht und bittet um baldige Nachricht über Aussichten des Fürsten.
oe1bu9454-033: 'Rät dringend zur Vorsicht mit Generalvollmachten: Laut Ober Inspector Hecker hat Honrichs kraft seiner Vollmacht den Preis der zu verkaufenden Hufen von 600 auf 300 Rthl gesenkt. Schlägt vor, mit einem Kapital von 150/m Rthl Oppenheimer, Haugt, Ephraim und Eysenhardt abzufinden und der Invaliden Casse 50000 Rthl in Courant zu zahlen. Bei französischen Behörden erwirkte er einen Befehl betreffend die Reste in Südpreußen mit militärischer Assistenz.'
oe1bu9454-034: 'Triebenfeld nennt die Eingabe von Honrichs grenzenlosen Unsinn: Auf 21 Briefe habe dieser nie geantwortet und weder Geld noch Rechnung geliefert. Nach Schmids Tod habe er Hecker für jährlich 600 Rthl und Deputat angestellt, da die französische Behörde die Reste beitreiben lassen wolle und dafür gerichtlich attestierte Nachweise nötig seien. Hauptsorge ist die Rückzahlung der für die Invaliden Casse geborgten Gelder und die Rückgabe von Zastrows Wechsel und Hypotheque.'
oe1bu9454-035: 'Triebenfeld protestiert gegen die Verfügungen, die der Fürst durch Hoffrath Meyer an Geh. Rath Amelang erließ: Beträge sollen auf die für ungültig erklärte Bankanweisung über 6000 Rthl angewiesen werden. Wegen 5000 Rthl Zinsen sei er als Bevollmächtigter arretiert worden; mit Hilfe des Ministers v Zastrow wurden 5000 Rthl von der Lahr geborgt, zahlbar am 14. May. Er bittet dringend um Rat zur Zahlung der fehlenden 3125 Rthl und um Befehl an Amelang, ihm die Bankanweisung zurückzugeben.'
oe1bu9454-036: 'Schreiben an v. Triebenfeld, teils unleserlich. Der Schreiber rechtfertigt sein Vorgehen mit der Anweisung über 6000 Rthl: Eysenhardt verlangte im Januar 1807 wegen einer alten Schuld 2500 Rthl bar und erhielt dafür die Anweisung gegen Rückzahlung von 3,500 Rthl. Nach der Zahlungssistierung beauftragte der Schreiber Assessor Koppe, Eysenhardt zu bezahlen und die bei Amelang verwahrte Anweisung zurückzunehmen. Er schickt die geforderten 3000 Rthl Courant und bittet um einen Besuch auf der Reise nach Wien.'
oe1bu9454-037: v. Triebenfeld will die Einlagen des Fürsten nicht an Koppen weitergeben, weil danach Eysenhardt Gelder aus der Bank-Assignation beziehen soll. Der zugehörige Wechsel sei abgelaufen. Der Fürst soll Amelang anweisen, die Assignation zurückzugeben, und Eysenhardt anderweitig befriedigen. Sonst will v. Triebenfeld sie öffentlich für ungültig erklären lassen. Er sei so gut wie arretiert und bittet um 2000 Rthl für die Invalidenzinsen. Laar müsse 5000 Rthl Courant erhalten, sonst gerate Zastrow in Verlegenheit.
oe1bu9454-038: Triebenfeld, schwer krank, meldet den Empfang von 3000 Rthl vom Bankier Veit und die Übergabe der Anweisung an Amelang. Neue Schulden von 5176 Rthl habe er damit teils getilgt. Statt Geld wurden Holz und Bretter aus Konotop angenommen, womit 4176 Rthl getilgt werden sollen. Den Verlust von 3480 Rthl soll der Fürst ihm ersetzen. Er rät, 150000 Rthl aufzubringen, um für 750000 Rthl Papiere zu erwerben und alle Schulden zu bezahlen.
oe1bu9454-039: Triebenfeld droht nach seiner Rückkehr eine Execution wegen 3000 Rthl Schulden. Von den zu berichtigenden 6125 Rthl hat der Fürst 3000 Rthl angewiesen, 3125 Rthl bleiben offen. Er bittet flehentlich um eine Anweisung über wenigstens 2000 Rthl, damit er nach Königsberg reisen kann, und will Bürgen suchen. Aus Zagórów geht nichts ein, daher sei die strengste Execution bei der französischen Behörde nötig. Briefe sollen an Justiz Commissarius Empich gehen. Er erinnert an das große Anlehn.
oe1bu9454-040: Triebenfeld wirbt für ein Darlehen von 250000 Rthl auf die Zagórówer Hypothek, mit dem Papiere für 750000 Rthl gekauft und alle Schulden getilgt werden könnten. Vorab nötig seien 46000 Rthl (Oppenheimer ohngefähr 28000, Invaliden Casse 15000, Meyer Bernhard und Kleinigkeiten 3000). Er soll zuerst nach Wien, dann nach Holland und Paris. Das französische Gouvernement sagte militärische Hilfe beim Eintreiben der Zagórówer Reste zu; die Untertanen verweigern die fälligen Zinsen wegen eines Verbots des Königs von Sachsen.
oe1bu9454-041: Triebenfeld erhielt das Schreiben zu spät, um mit dem Grafen nach Erfurt zu reisen, und hat kein Bargeld. Er will Geld borgen und bei der Rückkehr der Kaiser über den Großfürsten für den Fürsten wirken. Das französische Gouvernement habe die Sequestration in Südpreußen teilweise aufgehoben und die Freigabe der Revenuen befohlen. Lichnowski gehöre nach Trąbczyn und müsse dort abwarten. Melzig soll zurechtgewiesen werden, weil er die Schulden der Bürger von 8 bis 9000 Rthl nicht eintreibt.
oe1bu9454-042: Triebenfeld berichtet, er sei als Bevollmächtigter des Fürsten von französischer Gendarmerie verhaftet worden, um rückständige Zinsen von 3521 Rthl an die Invaliden Casse zu zahlen. Da van der Lahr ihn wegen noch 3000 Rthl verklagt und seine Abreise verhindert, bittet er dringend um 2068 Rthl nach Konotop, das seine Gläubiger sequestrieren. Das französische Generalgouvernement habe die Aufhebung der Sequestration wegen der Invaliden Casse angeordnet. Gegen die Sequestration von Zagórów habe er protestiert und gegen Oppenheimer einen Prozess eingeleitet.
oe1bu9454-043: 'Triebenfeld meldet ein von Amelang mitgeteiltes Urteil: Lahr soll die restlichen 3000 Rthl bar statt in Papieren erhalten, im Wechselprozess droht Triebenfeld sonst Arrest. Amelang hat appelliert und hält mit Grevenitz den Sieg für gewiss, was etwa 1500 Rthl rettet. Triebenfeld fleht um schnelle Deponierung der 3000 Rthl. Die Sequestration soll nach Zahlung von etwa 10000 Rthl Zinsen aufgehoben werden. Er bittet um 600 Centner Eisen für Kaufmann Michaelis, der ihm 2000 Rthl gab.'
oe1bu9454-044: 'Der Lahrsche Prozeß hält Triebenfeld zurück: Lahr erhält laut dem von Amelang mitgeteilten Erkenntnis noch 3000 Rthl nebst Zinsen, muss aber Papiere nehmen. Coste hat er die 9000 Rthl zurückgewährt und 450 Rthl Zinsen gezahlt; er benötigt 2068 Rthl. Laut Befehl des französischen Gouvernements sind diese Gelder aus den Gütern von Zagórów zu erstatten. Michaelis will die 2068 Rthl berichtigen, wenn der Fürst ihm bis Mai 600 Centner Eisen zu 4 Rthl frei Opole liefert.'
oe1bu9454-045: Triebenfeld hat Berlin verlassen, um der Haft zu entgehen, nachdem das Gericht die sofortige Zahlung von 3000 Rthl an Lahr verfügte. Amelang hat appelliert. Kaufmann Michaelis gab 2400 Rthl zur Bezahlung Mathieus. Triebenfeld dankt für die Zusage von 600 Centner Eisen, die er Michaelis bis 1. May zu 4 Rthl je Centner frei Berlin verkauft hat, und bittet um Lieferung nach Konotop Anfang April sowie um 100 f d'or und 100 Ducaten. Hawich und Hecker brachten gute Nachricht aus Zagórów.
oe1bu9454-046: 'Amelang meldet, Triebenfeld werde das Schreiben des Fürsten von Hohenlohe samt beiliegendem Geld wohl erhalten haben; es sei von Berlin auf Kontop gezogen. In einer Sache lägen die Akten im Appellatorium zum Spruch, doch sei kein günstiges Erkenntnis zu erwarten. Grund ist eine heute in den Berliner Zeitungen stehende Deklaration des Königs: Verschreibungen seien in Courant zu zahlen, rückwirkend bis 1806. Amelang bedauert Triebenfeld. Der Text ist teilweise unleserlich.'
oe1bu9454-047: Triebenfeld antwortet einem Hoffrath auf vier Punkte. Das sächsische Moratorium schütze die Güter 3 Jahre, wenn die Zinsen gezahlt würden. Die 50000 Rthl der Invaliden Casse stünden als erste Hypothek, gegen Oppenheimer liefen Prozesse in Berlin und Kalisz. Meyers Forderung sei unbegründet, gegen Giese et Consorten laufe ein Prozess wegen 25000 Rthl, ebenso in Niedźwieckis Sache. Das Gesuch der Augustinower Colonisten um Remission soll abgewiesen werden, da ihre Erbpachtcontracte zur Zahlung verpflichten.
oe1bu9454-048: 'Triebenfeld hat Hawich und Oberinspektor Hecker empfangen und dreizehn gerichtliche Vollmachten ausgestellt. Hawich soll auf Abweisung der Dąbska wegen der Trąbczyner Güter dringen und die Aufhebung der Sequestration betreiben. Weitere Aufträge: Zinsen eintreiben, Oppenheimer et Wolff in Kalisz verklagen, Sequester Honrichs absetzen und seine eigenmächtigen Landverkäufe annullieren, Pachtrückstände von Niedźwiecki beitreiben, Grenzprozesse führen und den Fürsten auf dem Reichstag zu Warschau vertreten. Triebenfeld glaubt, seine Obligation über 250000 Rthl verschaffe ihm Mitsprache bei den Gläubigern.'
oe1bu9454-049: 'Triebenfeld klagt, dass ein Bote aus dem Haus des Fürsten ohne Antwort auf sein Schreiben kam. Er stehe unter Arrest und dürfe erst fort, wenn die zugesagten 600 Centner Eisen abgeschickt sind und Justiz Bürgermeister Schenck ihn losgesprochen hat. Er bittet dringend, das Eisen nach Bojadła (Boyadel) an seinen Verwalter Neumann zu senden. Mit 1000 Centnern wären Michaelis Lahr und alle Berliner Kosten befriedigt. Nachschrift: Gerücht über ein russisches Corps an der polnisch-schlesischen Grenze.'
oe1bu9454-050: 'Friedrich Ludwig bittet den König, v. Triebenfeld nicht durch Execution oder Auspfändung zur Zahlung einer Summe zu zwingen, für die er selbst einsteht. Das französische Gouvernement hatte von Triebenfeld 3125 Rthl Zinsen der Invaliden Casse auf ein Capital von 50000 Rthl auf den Zagórówer Gütern erzwungen. Dafür lieh Triebenfeld bei van der Lahr 5140 Rthl gegen einen Wechsel mit Zastrow. Van der Lahr klagte auf den Rest. Amelang soll sich vergleichen: 1000 Rthl bar, der Rest in Eisen bis Mai.'
oe1bu9454-051: 'Triebenfeld meldet, die Execution sei aufgehoben, das Eysen aber noch nicht da. Er reist morgen nach Königsberg und will über die Erbschaftsangelegenheit erst danach urteilen. Wegen des neuen Dekrets über Arrestschlag in Pohlen hat er Honrichs herbestellt, der dem Fürsten mehrere Tausend zuführen will. Hawich scheine ein Cujon zu sein; Triebenfeld fürchtet, er halte ihm anvertraute Originalpapiere zurück. Bethney liegt schwer krank. Gerüchte aus Sachsen: Fürst Hohenzollern bei Leipzig, Österreicher in München. Nachschrift: Honrichs kommt und soll Geld bringen.'
oe1bu9454-052: v. Triebenfeld hat das Schreiben des Fürsten samt Beilagen der Königin überreicht, die es wohlwollend aufnahm. Sie übergab die Sache dem Groß Kanzler, der sie an Cabinets und Cammergerichts Rath Albrecht weiterleitete, mit dem Triebenfeld nun daran arbeitet. Weil Beyme sehr auf die Form zu achten scheint, fürchtet er eine langwierige Sache. Der König hat verboten, über Politik und besonders über den Krieg zwischen Frankreich und Österreich zu räsonieren, da die Nachrichten sich widersprechen. Köckritz lässt sich empfehlen.
oe1bu9454-053: 'Triebenfeld meldet, dass in der Erbschaftsangelegenheit noch keine Resolution ergangen ist; die Sache liegt mit dem Gutachten des Cabinets Rath Albrecht bei Großkanzler Beyme. Er drängt den Fürsten, in seiner Kriegssache offen an den König zu schreiben und um Beendigung zu bitten. Major von Pirch sei sein treuester Freund. Massenbachs Sache hängt am fieberkranken Scharnhorst. Dazu Kriegsnachrichten: Russland breche die diplomatischen Verhandlungen mit Österreich ab, Schill habe 2 Regimenter zusammengehauen und 4 Kanonen genommen.'
oe1bu9454-054: Triebenfeld fleht den Fürsten an, die 600 Centner Eisen (300 Stab- und Reifeneisen, 300 Schieneisen) bis zum 23. April nach Bojadła statt Ende Mai nach Opole zu liefern. Michaelis sei Lieferung am 1. Mai in Berlin zugesagt, bei 500 Rthl Strafe und einem Wechsel über 2400 Rthl. Von der Lahr biete 5 1/2 Rthl pro Centner, solle 6 Rthl annehmen. Triebenfeld will die in Zagórów assignierten 4000 Rthl beschaffen. Gegen eine angebliche Drohung Weigels schütze das Generalmoratorium bis Johanni 1810.
oe1bu9454-055: Triebenfeld berichtet, van der Lahr gehe nun auch in Breslau gegen ihn vor. Er wartet auf 1000 Centner Eisen in Konotop. Zur Colonnaschen Erbschaft für die Königin kann Graf Götzen Zeuge sein, rät aber wegen Graf Wratislaw zur Zurückhaltung. Triebenfeld schlägt vor, die Königin solle die Güter von an 3 Millionen Wert nehmen und Wratislaw das Geld lassen. Für Götzen hat er ein Schreiben an die Königin entworfen. Dazu Kriegsnachrichten und Bethusys Schulden von an 500000 Rthl.
oe1bu9454-056: Triebenfeld wartet vergeblich auf die 1000 Centner Eisen, ohne die er weder Reisegeld hat noch Michaelis befriedigen und nach Königsberg reisen kann, und bittet um baldige Lieferung nach Bojadła. Im Nachtrag meldet er, dass Eisen von Opole abgegangen ist, er aber die Fracht zahlen soll. Lahr soll 400 Centner zu 5 Rthl 12 ggl, also 2200 Rthl, erhalten. Er bittet, die Fracht zu übernehmen und die fehlenden 217 Centner zu schicken.
oe1bu9454-057: 'Triebenfeld kann aus Geldmangel nicht berichten kommen: Unterwegs wurde ihm ein Koffer im Wert von über 800 Rthl gestohlen. Das Eisen liegt in Konotop; die restlichen 400 Centner reichen nicht, um an von der Lahr die 3000 Rthl zu zahlen. Aus Königsberg: Der König befahl, den Fürsten zu schonen; in der Erbschaftssache soll Hoyok in Warszawa nach dem Testament forschen. Nach Entscheidung seiner Sache soll der Fürst General Gouverneur von Schlesien werden.'
oe1bu9454-058: 'Triebenfeld dankt für 50 fr d''or, die er durch Bally erhielt und mit denen er sich für 4 Wochen von der Execution loskaufte. In Kosten muss er an 80 bewaffnete Männer stellen. Aus Kalisz, wo Garczynski Ober Prefect ist und Zychlinski amtiert, berichtet er über die Pläne der Pohlen: Wiederherstellung Pohlens und Konstantin als König. Er schreibt dem König, die Ausfuhr ebenfalls zu verbieten, warnt vor Confiscation der Güter bei voreiligem Handeln.'
oe1bu9454-059: Triebenfeld klagt über Sequestration von Kontop und Execution auf den Schweinernschen Gütern wegen 2560 Rthl Zinsen und der Schuld bei von der Lahr. Diesem schickte er Eisen und Bretter für 2570 Rthl, 430 Rthl bleiben offen. Getreide, Wolle und Holz für etwa 7000 Rthl findet keinen Käufer, darum kann er nicht zum Fürsten kommen. Der Fürst soll direkt an den König schreiben. Honrichs darf kein Geld ausführen, Triebenfeld fragt Brzechffa, ob Vieh und Getreide ausgeführt werden dürfen.
oe1bu9454-060: Triebenfeld meldet, dass auf Betreiben van der Lahrs in Świniary alles versiegelt und sequestriert ist, auch in Konotop. Van der Lahr ist bezahlt, und Grävenitz schickt dessen Quittung und Einwilligung, die Triebenfeld an Loen nach Wrocław sendet. Die Sequestration bleibt aber wegen der Zinsen von 1860 Rthl bestehen. Geld aus Zagórów zu holen wurde verboten, Honrichs verhaftet. Er bittet den Fürsten, 1800 Rthl aufzutreiben und an Professor Schade zu schicken. Zum Fürsten reisen könne er vorerst nicht.
oe1bu9454-061: Der Schreiber bittet einen Hoffrath in Wrocław dringend, beim Fürsten 1800 Rthl für fällige Zinsen zu erwirken. Durch die v. d. Lahrsche Geschichte sei er bloßgestellt, und seine Güter seien sequestriert. Mit 1800 Rthl könne Świniary gerettet werden. Er will dann einen Teil seiner Güter dismembrieren, den Kindern die Zinsen zum Unterhalt anweisen und zum König gehen. Ohne Hilfe gehe er nach Königsberg. Mit Hilfe könne er am 12. Sept. abreisen und am 16. in Sławięcice sein.
oe1bu9454-062: 'Triebenfeld klagt, auf fünf Briefe keine Antwort erhalten zu haben, und schickt diesen sechsten über den Ober Post Director Mann. Er berichtet, alles scheine zu gelingen: Die Curische Schuld werde getilgt, der Transact cassirt, Cosmar müsse ausscheiden, der Fürst komme in Besitz des Majorats, und die polnischen Güter müssten zurückgegeben werden. Er leide drückende Not und bittet dringend um Geld, notfalls durch einen Expressen. Briefe sollen an Mann in Wien gehen.'
oe1bu9454-063: Triebenfeld berichtet nach siebenwöchiger Krankheit, er müsse vor Verpachtung von Konotop 8000 Rthl Rückstände zahlen und hoffe auf einen Holzkäufer. Honrichs ist eingetroffen; Triebenfeld rät, auf den Prefect einzugehen, der die Güter kaufen will und bei der Wiedererlangung der Trąbczyner Güter helfen kann, Dąbska die angeeigneten Güter zu entreißen und den Administrator abzuweisen. Hecker und Hawich stifteten Niedźwiecki und Ostarszewski zu einer Denunziation an, die Honrichs' Verhaftung bewirkte; die Denuncianten haben sie schriftlich widerrufen.
oe1bu9454-064: 'Triebenfeld meldet den Tod der Königin zu Strelitz und die schwere Krankheit des Königs. Die Collonnasche Sache sei nun ein Unding, der Fürst solle seine 100000 Rthl sichern. Wegen der Zinsen des Invaliden Capitals droht ihm die Sequestration seiner Güter. Beigefügt ist ein Vorschlag an einen Freund: Knobelsdorffs Güter Biskupice und Molna zu 700000 Rthl gegen die Zagórówer Güter und Quittierung der Forderungen Weigelts und Stössels. Im Nachtrag bittet Triebenfeld dringend um 300 Rthl in Gold.'
oe1bu9454-065: Triebenfeld bittet, dass die Koszęciner Hütte ihm 300 Centner Schien- und Reifeneisen gegen beiliegenden Wechsel borgt, zu 4 Rthl 12 g je Centner frei bis Bojadła. Die Fracht soll dort bezahlt werden, da Schiffer ihm früher Eisen genommen hätten. Er will Eisen gegen Spiritus umsetzen. Eine Kommission soll seine Sequestration beenden, danach will er nach Sławięcice reisen. Er schildert seine Schulden (zusammen 25100 Rthl) und berichtet ein Gerücht, der Fürst sei zum General Gouverneur von Schlesien ernannt.
oe1bu9454-066: Triebenfeld erwartet, dass die falschen Denuncianten 6 Jahre Festungsstrafe erhalten und die Aufwiegler ausgewiesen werden. Honrichs' Forderung an Hecker übersteigt dessen Caution dreifach. Bitten der Collonisten und Bauern um Zinsnachlass seien abzuweisen. Für Garczynski, Zakrzewski und Brzechffa lässt er drei Böcke schießen. Die Schiffer Kulawy und Neumann halten etliche 70 Centner Eisen wegen 243 Rthl 14 sg Frachtlohn fest; er bittet um die Quittungen. Der Trąbczyner Prozess wird viel kosten. Coste würde 2000 Centner Schieneisen mit 8000 Rthl bezahlen.
oe1bu9454-067: Triebenfeld kann Kontop nicht verlassen, da Coste nicht gekommen ist; Kontop ist verpachtet, Świniary noch nicht. Hawich bezichtigt Honrichs des Betrugs; Triebenfeld hat beide vorgeladen und will einen Actuarius nach Zagórów senden, um zu ermitteln, wer von Untertanen und Pächtern Geld genommen hat. Hawich, Honrichs und Hecker hätten sich widerrechtlich Hufen angeeignet. Über 12 Deputationen der Gemeinden baten um Zahlungsfrist. Er bittet um die Fracht-, Zoll- und Wagezettel für das Eisen.
oe1bu9454-068: Honrichs hat die Angaben des Hawich als falsch erwiesen. Die Requisitionen von 22000 Rthl müssen laut Contract die Colonisten dem Fürsten erstatten. Für den Termin am 28. beim Friedensrichter Kwilecki in Konin braucht Honrichs die Original-Donationsurkunde über Trąbczyn. Triebenfeld bittet dringend, sie per Estaffette zu schicken, auch die Sache Kamionna hänge davon ab. Kwilecki rät, Lipski zu verklagen, der die Trąbczyner Güter der Dąbska übergab. Triebenfeld ist mittellos und verlangt mindestens 1000 Rthl Courant.
oe1bu9454-069: Bally berichtet, dass er das Geld in Wrocław nicht sofort erhalten konnte und durch Wege und Wetter aufgehalten wurde. Am 25. mittags traf er Honrichs und Cabanis noch an. Beide reisten noch am selben Tag ab, Honrichs mit 6000 Rthl und den Schenkungsurkunden im Original, und zwar mit den frohesten Aussichten. Triebenfeld leidet am rechten Arm. Er hat versprochen, für einige Wochen nach Schlawentz zu kommen, sobald seine eigenen Geschäfte beendet sind. Bally will bald zurückkehren.
oe1bu9454-070: 'Zu Trąbczyn meldet Triebenfeld einen Vorteil: Kramplitz ist nicht erschienen, am 2. April ist ein neuer Termin angesetzt. Raczkowski und Küntzel betreiben die Sache mit Honrichs, er hält die Rückgewinnung für gewiss. Hecker, der sich verbürgt hat und bis Johanni zahlen will, bleibt wegen eines Missverständnisses des Ober Prefectus Garczynski an der Kasse; Cabanis soll ihn kontrollieren. Triebenfeld will für 6 Tage nach Berlin. Für die Sequestration seiner eigenen Güter fordert die Landschaft an 4000 Rthl Kosten.'
oe1bu9454-071: Die Rochlitzsche Sache ist eingeleitet. Triebenfeld hofft, dass der Fürst nichts zahlen muss, und nennt sie eine Prellerei. Er habe Rochlitz 1804 als Generalbevollmächtigter abgesetzt, was Glenck bezeugen könne. Er bittet dringend um zwei bis drei unterschriebene und gesiegelte gedruckte Prozessvollmachten, damit Melzig die Sache betreiben und ausstehende Reste von an 18000 Rthl einfordern kann. Er erwartet Honrichs und will nach Sławięcice kommen, sobald die Sache in sicherem Geleise ist.
oe1bu9454-072: Der Schreiber hat das Tauschprojekt mit General v Schimmelpfennig aufgegeben und vermutet, dass die Verpachtung an Brzechffa gescheitert ist. Er hat die Besichtigung der Güter um Zagórów für ein neues Tauschprojekt erlaubt. Er will auch seine Praetensionen an die Trąbczyner Güter verkaufen und schickt wegen der Original-Schenkungsurkunde einen Expressen. Er fragt nach dem Erfolg von Brzechffas Fürsprache in Warschau im Trąbczyner Prozess und bittet um die 300 Rthl für Lieutenant Sommer.
oe1bu9454-072a: 'Meldet den gewonnenen Prozess gegen die Wrąbczyner Bauern: Kontrakt kassiert, Rückstände zu zahlen, Exmission möglich. Die Reise mit Brzechffa nach Sławięcice verschiebt sich, da er und Präfekt Garczynski nach Warszawa berufen wurden; Brzechffa bringt 2 bis 3000 Rthl, der Fürst soll über den Pachtkontrakt für Zagórów entscheiden. Die Trąbczyner Sache soll vor die Rada Stanu. Trotz 80000 Rthl Schulden wären die Güter schuldenfrei, wenn die alten Hauländer 40000 Rthl für den Wald zahlen und die Dąbska Schadenersatz leisten muss.'
oe1bu9454-072b: Triebenfeld berichtet nach beiliegenden Schreiben von Brzechffa und Thiele, dass Brzechffa erst am 15. aus Warschau abreisen kann und Geld nach Sławięcice mitbringen will. Brzechffa hat versprochen, die neue Veranlagung der Zagórów-Güter mit 5897 Rthl abzuwenden. Niedźwiecki verlor den Prozess und soll 2000 Rthl zahlen. Die Wrąbczyner Bauern drohen mit Appellation. Landunterrichter Piekarski, Rädelsführer in der Trąbczyner Sache, der die Zinsbeitreibung untersagt und die Kolonisten zu Klagen verleitet hatte, ist suspendiert.
oe1bu9454-072c: Kreis Rath Thiel übersendet Triebenfeld einen soeben über den Advokaten v Wieckowski erhaltenen Brief des Podprefecten v Brzechffa. Daraus gehe hervor, dass Brzechffa seiner Geschäfte wegen erst am 15. d. M. aus Warszawa abzureisen gedenkt und dass in Ansehung der Herrschaft Trąbczyn gute Aussicht besteht.
oe1bu9454-072d: Brzechffa teilt Triebenfeld mit, dass er wegen verschiedener Geschäfte erst am 15. des Monats aus Warschau abreisen kann. Nach eingezogenen zuverlässigen Nachrichten steht die Sache wegen Trąbczyn recht gut. Näheres will er mündlich berichten. Wegen der abgehenden Gelegenheit schreibt er nur kurz.
oe1bu9454-072e: Brzechffa teilt mit, dass er wegen verschiedener Geschäfte erst am 15. des Monats aus Warszawa abreisen kann. Nach zuverlässigen Nachrichten, die er eingezogen hat, stehe die Sache wegen Trąbczyn gut. Näheres will er nach seiner Rückkehr berichten. Wegen der abgehenden Gelegenheit schreibt er nur kurz.
oe1bu9454-072f: Triebenfeld berichtet, dass den Zagórówer Gütern eine übermäßige Getreide- und Strohlieferung auferlegt und sie erneut sequestriert wurden; die Ober Prefectur in Kalisz verweigerte die Zinsbeitreibung bei den Bauern. Brzechffa war auf seine Bitte bereit, die Lieferungen zu begleichen; der Sequestor wurde abgerufen. Triebenfeld liegt mit Podagra, klagt über Einquartierung, geflohene Untertanen und Geldnot. Honrichs soll wegen unterschlagener Abgaben verhaftet werden.
oe1bu9454-073: 'Der Fürst stellt Bedingungen für Brzechffas Pachtangebot auf die Zagorower Güther: halbjährige Pachtzahlung prenumerando, eine bare Caution, Schutz vor Remissionsklagen, alle Lasten beim Pächter, ein Abstandsquantum bei Verkauf. Triebenfeld soll bald mit Brzechffa kommen, der mehrere tausend Rthl mitbringen soll. Der Güterhandel mit Schimmelpfennig stockt. Den Verkaufsplan an Weigelt und Stössel hält er für wenig aussichtsreich. Er wünscht Erfolg in der Oleschnicer und Trąbczyner Sache und hofft auf eine bedeutende Summe.'
oe1bu9454-074a: Arrestgesuch der General Invaliden Casse an das Kammergericht wegen eines Darlehns von 50000 Rthl an v. Triebenfeld, gesichert durch eine Obligation des Fürsten über 250000 Rthl auf die Zagórówer Güter. Seit 1807 sind 9375 Rthl Zinsen rückständig. Advocat Mitschke in Kalisz soll klagen und nötigenfalls Sequestration beantragen. Da die Kalischer Präfektur die Hypothek zu den Bayonner Summen schlug und Konotop und Świniary verschuldet sind, soll das Vermächtnis der Fürstin von Sacken von 80000 Rthl beim angeblichen Testamentsvollstrecker Kircheisen arrestiert werden.
oe1bu9454-074b: Triebenfeld hält die Anstellung eines Oberförsters in Zagórów für nötig. Der Richter muss jetzt die Propination verwalten, weil die Nageln ihren Neffen, der als Propinationsbeamter vorgesehen war, abgerufen hat. Will der Fürst dem armen Radszewski helfen, soll er ihn schnell schicken; mit 300 Rthl jährlich müsse dieser zufrieden sein. Triebenfeld bittet zugleich um die Meinung des Fürsten zum Tausch der Güter.
oe1bu9454-074c: Das Kammergericht fordert Kircheisen als Testamentsvollstrecker der verstorbenen Fürstin von Sacken auf, Triebenfeld nichts von einem Legat auszuzahlen. Dies gilt, falls die Klage der General Invaliden Casse zutrifft, wonach Fürst Hohenlohe-Ingelfingen aus dem Nachlass 80000 Rthl erhalte und diese Triebenfeld zur Begleichung seiner Forderungen angewiesen habe. Gleichlautend ergeht das Schreiben an Cosmar. Das Ober Landes Gericht von Schlesien übersendet Triebenfeld in Konotop die Vorladung des Kammergerichts und verlangt eine Empfangsbescheinigung.
oe1bu9454-074d: 'Vorladung des Kammergerichts Berlin: Auf Antrag der General Invaliden Casse gegen Triebenfeld ist ein Arrest auf das Legat von 80000 Rthl verhängt, das die verstorbene Fürstin von Sacken dem Fürsten von Hohenlohe-Ingelfingen vermacht hat. Triebenfeld soll am 23. August um 10 Uhr vor Kammergerichtsrath Roitsch selbst oder durch einen Justizkommissar erscheinen, seine Einwendungen und seinen Schaden vortragen, die Höhe der Caution angeben und einen Vergleich versuchen. Bleibt er aus, bleibt der Arrest bestehen.'
oe1bu9454-075: Triebenfeld schickt die ihm mitgeteilten Schreiben des Gr. v. S. zurück. Er freut sich, dass der Graf sich gerade verhält, bedauert aber, dem Fürsten nicht 40 bis 50/m Rthl gewinnen zu können. Laut Reinhardt ist wegen der Assistenz des Fisci nichts erfolgt. Goldbeck hört, Hoym behalte das Südpreußische Departement; Priebich versicherte Rath Kruger dagegen, Haugwitz werde Minister. Chełmski hat nicht appelliert, die Güter könnten vielleicht zu Johanni verpachtet werden. Das Formular zur Vollmacht folgt nach Melzers Rückkehr.
oe1bu9454-076: Von Triebenfeld meldet, dass der Gütertausch jetzt im Gange ist und vielleicht bald abgeschlossen wird. Er will Anfang September nach Berlin reisen und bis Ende des Monats bleiben. Dort hofft er den Fürsten wiederzusehen und ihm persönlich über mehrere Geschäfte zu berichten.
oe1bu9454-077: 'Triebenfeld meldet, die Sache laufe nach Wunsch: Der König hat über Beyme geschrieben, Minister v Voss soll schleunigst berichten. Glenck soll die Anschläge passend zur Designation und zu den Contracten gründlich ausarbeiten. Triebenfeld hat einen Mann in Potsdam gewonnen und sorgt für eine Anleihe. Michaelis werde um eine Vollmacht schreiben. Triebenfeld bittet um unterschriebene Blanketts. Nachschrift: Buerensprung wurde Land Forstmeister, Wedel bleibt im Amt, Lindenau erhielt den Titel Excellenz.'
oe1bu9454-078: 'Michaelis berichtet vom Besuch beim Geheimen Finanzrat Schulze. Dieser kannte nur das Schreiben des Fürsten an Minister v. Voss und äußerte sich weder dafür noch dagegen. Michaelis bat ihn, bei Hindernissen nicht ohne Anhörung zu entscheiden. Auf Schulzes Rat erbittet er eine Vollmacht zur Hinterlegung in der Registratur und schlägt ihren Wortlaut vor: Betreibung des vorgeschlagenen Tausches der verliehenen Güter gegen eine Herrschaft beim Südpreußischen Departement. Laut Triebenfeld gehen die Verfügungen des Kabinetts erst jetzt an Voss.'
oe1bu9454-079: 'Triebenfeld wartet auf den Bericht des Ministers von Voss zum Güter Tausch und bleibt in Berlin, bis die Krotoszyn Sache geregelt ist. Schulenburg und Hoym seien der Sache gewogen, Hoym wolle 1000 Rthl geben, wenn die Sache bald zustande käme. Er nennt die Verteilung der Summe: Schulzes Tochter 2500 Rthl, Klewitz 3000 Rthl, Michaelis 300 Ducaten. Er will 120/m Rthl aus der Wittwen Casse aufnehmen, berichtet über den Streit am Hof um einen Krieg und bittet um die Blanquets.'
oe1bu9454-080: Triebenfeld ergänzt sein Schreiben vom Vortag, das Hauptmann Hahn mitnahm. Minister Hoym sei zufrieden aus Potsdam zurückgekehrt, wo nach Aussage eines anderen Mannes mehrfach vom Fürsten die Rede gewesen sei. Dies bestätige, dass der König den Fürsten schätze, und er hofft auf einen guten Ausgang. In Berlin rede man von Märschen oder Krieg, er glaube aber noch nicht daran. Von Herrn von Voss sei noch nichts zurück.
oe1bu9454-081: Michaelis kann trotz Drängens von Triebenfeld und Eysenhardt noch nichts Bestimmtes über den Gütertausch melden. Bei der südpreußischen Expedition ist nichts eingegangen, die Sache stecke also noch in der Korrespondenz zwischen Minister v. Voss und dem Geheimen Finanzrat Schulze, und entschieden sei noch nichts. Er erwartet die Vollmacht des Fürsten am kommenden Dienstag. Mit ihr will er sich legitimieren und bei Schulze eine zuverlässige Erkundigung einholen.
oe1bu9454-082: Eysenhardt berichtet, dass das königliche Cabinets Schreiben in der Sache des Fürsten dem Minister v. Voss nach Havelberg nachgesandt wurde und in der Kanzeley noch nicht eingegangen ist. Voss kehre vorzeitig schon nächsten Donnerstag zurück und bringe es vielleicht selbst mit. Lautet es so entschieden, wie v. Triebenfeld sagt, rechnet Eysenhardt mit einem günstigen Ausgang. Außerdem hat er v. Triebenfeld für Rechnung des Fürsten 300 Pr Courant gegen Schein gezahlt.
oe1bu9454-083: 'v. Triebenfeld meldet, Krotoszyn werde dem Fürsten sicher überlassen. Bei Polajewo gebe es noch Bedenken, doch Geh. Finanzrat Schulze versichere, auch dies sei zu erhalten; dort seien 100/m Rthl zu gewinnen, trotz Widerstand der Kammern. Er bittet, Prinz George, falls dieser früher eintreffe, aufzuhalten, bis er selbst kommt. Hoym sei nach Pommern gereist, Voss komme Donnerstag zurück. Triebenfeld hat an Voss, Schulze, Beyme und den Obersten geschrieben. Dazu Gerüchte: Repnin habe einen Ukas erhalten, die Franzosen wollten Hannover nehmen.'
oe1bu9454-084: 'Zum Krotoszyn-Tausch berichtet v. Triebenfeld: Königl. Majestät hat Voss mit der Regelung beauftragt, der 4 Wochen für den Finalbericht erbat. Die Kammern sollen prüfen, ob die Revenuen gleichkommen. Wegen der Bedenken um Polajewo sollen aus der Starostei Adelnau, die an Krotoszyn grenzt, Güter im Wert des Mehrertrags gegeben werden. Er reist nach Pszczew, will wegen Broniewski sehen und in Wrocław die Sache des Prinzen George erledigen. Alle außer Voss seien wohlgesinnt.'
oe1bu9454-085: Der König lehnt den vom Fürsten beantragten Tausch seiner südpreußischen Güter gegen die Domänenämter Krotoszyn und Polajewo ab. Laut Bericht des Ministers v. Voss könne Krotoszyn allein schon 49043 Rthl Revenue gewähren, wenn die bei der jetzigen Verpachtung nicht veranschlagten Pertinenzien hinzukommen; v. Triebenfeld habe für die Abtretung der Pacht einen Abstand von 26,000 Rthl erhalten. Der Staat verlöre jährlich 17400 Rthl. Die auf 8650 Rthl veranschlagten Güter des Fürsten brächten nach etwa 26,000 Rthl Meliorationen jetzt 40,500 Rthl.
oe1bu9454-086: Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, widerspricht dem Bericht des Staatsministers von Voss zum Tausch seiner südpreußischen Güter gegen Krotoszyn. Voss habe den Verzicht auf Polajewo anscheinend nicht angezeigt und sich nur auf Kriegesrath Nöldichen gestützt. Statt der behaupteten 49043 Rthl Ertrag und 17400 Rthl Verlust zahle Krotoszyn 30100 Rthl Pacht, seine Güter trügen 41500 Rthl. Er bittet um einen unparteiischen Commissarius zur Prüfung beider Güter. Ziel sei ein Kapital zur Tilgung seiner Schulden gewesen.
oe1bu9454-087: Fürst Hohenlohe-Ingelfingen bittet Obrist von Köckritz, beim König seine Rechtfertigung im gescheiterten Tausch seiner verliehenen Güter gegen die Krotoszyner Güter zu unterstützen. Minister v. Voss und der König erklärten den Tausch für nachteilig, da Krotoszyn 17400 rt mehr trage. Der Fürst hält dagegen, Krotoszyn trage 30100 rtl, seine Güter 41500 rt. Voss habe auf Anraten des Kriegesrath Nöldichen ohne Untersuchung vor Ort berichtet. Er hat den König um eine unparteiische Untersuchung und die Vorlage der Akten von Struensee gebeten.
oe1bu9454-088: Der Fürst antwortet auf das Schreiben von Voss vom 1ten dieses. Voss hat dem beim König beantragten Tausch der südpreußischen Güter des Fürsten gegen das Amt Krotoszyn, ohne Polajewo, nicht in der gewünschten Art beigepflichtet. Nach Ansicht des Fürsten beruhen Voss' Gründe nur auf den Berichten der Commissarien, die bei Krotoszyn mehr angenommen hätten, als eine unparteiische Untersuchung ergeben würde. Er ist fast entschlossen, den König von der Uneigennützigkeit seines Vorschlags zu überzeugen.
oe1bu9454-089: Triebenfeld betreibt den Tausch der Güter des Fürsten gegen Krotoszyn und Polajewo. Schreiben an den König, an Beyme und Zastrow sind abgegeben. Nach Triebenfelds Plan soll der König einen Commissarius ernennen oder nach gleichem Ertrag und Werth entscheiden. Glenck zahlt als General Pächter jährlich 44500 Rthl. Triebenfeld bestreitet, dass Krotoszyn 49000 Rthl bringe (Pacht 30000 Rthl), und beteuert seine Uneigennützigkeit. Die Fürstin Sacken gibt höchstens 30/m Rthl, circa 7000 Rthl fehlen noch.
oe1bu9454-090: 'Triebenfeld meldet, der Kampf um „die Sache“ sei jetzt groß, und hofft auf Erfolg. Er klagt über die Zustände in Berlin und über die Bösewichter dort: Der Monarch sei gut, nicht aber die Minister. Die 7000 Rthl, die die Fürstin Sacken keinesfalls vorschießen will, würde er auf seinen eigenen Namen negociren und dafür seine ganze Habe verpfänden, damit die Sache nicht verloren geht. Mehrere Stellen sind unklar.'
oe1bu9454-091: Beyme dankt dem Fürsten für die Aufschlüsse in der Güter-Vertauschungs-Angelegenheit. Er freut sich, dass der König eine weitere Untersuchung verfügt hat, und versichert, er werde seine Pflichten weiter gewissenhaft erfüllen. Dabei will er die Wünsche des Fürsten, die Bereitschaft seines Herrn, ihm entgegenzukommen, und das Interesse des Staates miteinander vereinigen.
oe1bu9454-092: Michaelis meldet, dass Baurath Glenck ihm die Quittungen der Gleisſenbergen und des Schneider übergeben hat. Damit kann er dem General Auditoriat auf dessen Verfügungen antworten, die dem Fürsten mitgeteilt worden waren. Er erwartet, dass Krieges Rath v. Triebenfeld dem Fürsten heute über den Stand einer weiteren Angelegenheit berichtet, deren Bezeichnung unsicher gelesen ist.
oe1bu9454-093: Triebenfeld schickt das königliche Schreiben auf die letzte Eingabe. Minister v Struensee musste die Akten dem König vorlegen. Obrist v. Köckritz, der eine Pro Memoria Triebenfelds dem König vorlegte, verspricht einen guten Ausgang. Darin bietet Triebenfeld an, falls Polajewo im Wege stehe, die Güter 30 Jahre zu pachten, jährlich 6 Bauerngüter zu bauen, wüste Gründe zu roden und 20000 Rthl Pacht zu zahlen. Wegen der 7000 Rthl will er die Niedernhallsche Sache beenden.
oe1bu9454-094: 'Zastrow kündigt ein mit heutiger Post abgehendes Schreiben des Königs an: Der König will den wahren Wert der südpreußischen Güter des Fürsten sowie von Krotoszyn und Polajewo untersuchen lassen, um sie gegeneinander abzuwägen. Stehen dem beabsichtigten Tausch keine wichtigen Hindernisse entgegen, werde der König den Wunsch gern erfüllen. Zastrow dankt für das Schreiben vom 7. des Monats. Die Sache gehöre nicht in sein Fach, er hoffe aber auf einen befriedigenden Abschluss.'
oe1bu9454-095: Obrist v. Köckritz lässt durch v. Triebenfeld versichern, das Tauschgeschäft stehe sehr gut und sei so gut wie beendigt; schreiben will er erst nach dem Abschluss. Der Geheime Cabinets Rath handle nach eigener Aussage gegen seinen Willen auf Wunsch des Souveräns. Mit B sei eine harte Ablehnung geplant worden. Der König ist unpässlich, daher gibt es keinen Vortrag; v. Triebenfeld fürchtet neue Umtriebe von H. v. Voss. Das Säkularisationsgeschäft hält er für einen Köder der Franzosen.
oe1bu9454-096: Triebenfeld meldet im Auftrag von Obrist v Köckritz, dass der Tausch so gut wie genehmigt sei. Nur die Unpäßlichkeit des Königs verzögere den Abschluss. Für die Reise nach Öhringen rät er, sofort beim König um Urlaub zu bitten, den Brief per Estaffette an ihn zu schicken und über Berlin statt durch Böhmen zu reisen. Wedel in Breslau habe zur Krotoszyner Sache ein lügenhaftes Gutachten abgegeben, ein anderer Herr Krotoszyn 50/m Rthl Tragfähigkeit zugeschrieben. Beyme ließ ihn die Akten lesen.
oe1bu9454-097: 'Der König wünscht, dass der Fürst über Berlin reist und einige Tage bleibt. Triebenfeld hört, der Tausch solle vor der Ankunft abgeschlossen werden: Laut Obrist v. Zastrow erklärte der König, beide Güter seien so zu prüfen, dass weder Staat noch Fürst verliere; es fehle nur eine öffentliche Cabinets Ordre. Minister v. Voss arbeitete dagegen, Beyme und Köckritz blieben fest. Zum Secularisations Geschäft rät er vorerst zu schweigen. Er bleibt in Berlin, bis die Krotoszyner Sache geregelt ist.'
oe1bu9454-098: Triebenfeld bleibt in Berlin, bis die Sache geklärt ist, und schickt Glenck zum Fürsten voraus. Der König lädt den Fürsten nach Berlin ein; reist er am 14. oder 15. ab, kann er 3 bis 4 Tage bleiben. Vertraulich berichtet er von der geheimen Heirat des Prinzen Solms mit der verwitweten Prinzessin Louise, von Hoyms geheimem Gutachten, auf das sich Voss beruft, und rät, das Secularisations Geschäft nicht zu erwähnen, sondern mit Prinz George in Wien zu betreiben.
oe1bu9454-099: Triebenfeld berichtet, man habe ihm in Berlin versichert, der Fürst werde die Krotoszyner Güter erhalten. Voss soll nachgiebiger geworden sein. Nach Köckritz sollen Knobloch und Prittwitz die Sache beenden, Wildeganst soll Prittwitz assistieren. Einen Entwurf des K. Rath v Cöln zu Krotoszyn erhielt Voss, der beim König auf dessen Kassation antrug. In Berlin erwartet man Krieg. Erbeten wird ein Patent als Comissions Rath für Carl Theodor Fischbach in Pszczew. Broniewski wird wohl nichts erhalten.
oe1bu9454-100: Abschrift. Beyme teilt dem Fürsten mit, dass Sr Majestät nach dem Vortrag seines Schreibens vom 21. d. M. befohlen hat, die Antwort darauf bis zum Eingang des Berichts zurückzustellen, den der Etats Minister v. Voss liefern soll. Der Fürst habe dies nach Beymes Worten selbst zu erwarten geschienen.
oe1bu9454-101: 'Abschrift einer Vorstellung des Fürsten von Hohenlohe an den König zum Tausch seiner südpreußischen Güter gegen Krotoszyn und Polajewo. Sie widerlegt die Ablehnung durch Minister von Voss: 30100 Rthl sei der Nettoertrag, das angebliche Vorwerk eine von Triebenfeld erworbene Holländer Hufe, die Wälder seien verwüstet. Neues Angebot: Verzicht auf Polajewo, jährlich 8000 Rthl auf Krotoszyn, Ausgleich des Wertunterschieds in bar an die Seehandlungs Societaet. Erbeten werden eine Untersuchung durch die Posener Kammer und ein Bericht Hoyms.'
oe1bu9454-102: Triebenfeld meldet, Minister v. Voss werde in etwa 3 Wochen in Krotoszyn erwartet. Chełmski hat auch in zweiter Instanz verloren. Mit Broniewski will er erst nach dem Krotoszyner Tausch für etliche Tausend Rthl abschließen. Brzyce wollte man in Poznań einziehen; er erreichte 6 Wochen Frist und rät, beim Groß Kanzler 5 Monate Verlängerung zu erbitten. Hoym ließ die Akten zum Konfiskationsdekret gegen die Prusimska heimlich zurücklegen, damit das Mädchen etwas bekomme.
oe1bu9454-103: Triebenfeld verzögert einen Vergleich in der Broniewskischen Sache, weil Rapackis Beweise gegen den Patron sprechen, außer der Krotoszyner Tausch verlange ihn. Den Chełmskischen Prozess gewann er in zweiter Instanz. Gegen den Vorwurf, der Fürst habe zu viele Güter erhalten, verfasst er eine Beschreibung. Die Prusimskischen Güter seien als gekauft anzusehen, weil sie erst gerichtlich zu erstreiten seien. Als Ertrag nennt er Kamionna und Kolno 6000, Trąbczyn 8400, Szetlewek 1600 und Brzyce 4000 Rthl. Glenck soll die Darstellung Prittwitz vorlegen.
oe1bu9454-104: v. Triebenfeld verbürgt sich, die Sache des Fürsten werde in ein paar Monaten ehrenvoll und vorteilhaft beendet. Man wolle eine Taxe der fürstlichen Güter verhindern und alles als Gnadensache erscheinen lassen. Über den Tausch entscheide das Gleichgewicht der Güter. Graf Schlabrendorff habe er überredet, für die Zinsen einen Wechsel auf ein Jahr zu nehmen. Etwa am 16. April reist er bis Ende Mai nach Berlin. Die an Prinz George verkauften Güter seien nun über 700/m Rthl taxiert.
oe1bu9454-105: 'Triebenfeld hat Graf Schlabrendorff befriedigt; die Zinsen betrugen 11085 Rthl, die Quittung lautet auf den Fürsten, eine Deckung für ihn selbst fehlt. Bei der Fürstin wurde er dreimal nicht vorgelassen; er erwähnt ein Schreiben von Prittwitz. Glenck meldet Ungünstiges im Prusimski-Prozess; Triebenfeld würde mit den ihm anvertrauten Blanquets beim Großkanzler um Verlängerung des Termins bitten. Dazu Hofnachrichten: die Königin erholt sich, an Krieg ist nicht zu denken.'
oe1bu9454-106: Triebenfeld hält den vom Juden Dann vorgeschlagenen Güterkauf für Schwindel. Dann wolle H. v. Echart, den Käufer der Lichtenauschen Häuser, dafür gewinnen, und er habe auch Prinz George solche Pläne vorgetragen. Nach einem Contumacial Decret der Posener Regierung sollen dem Fürsten die Güter in Brzyce wieder genommen werden. Die Cammern intrigieren wegen der Forsten, Prozesse verursachen hohe Kosten, und die Tauschsache stockt. Er glaubt, die Minister würden den Tausch nur auf Befehl des Monarchen zulassen.
oe1bu9454-107: Triebenfeld leitet ein Schreiben des Obristen von Zastrow weiter und will das königliche Cabinets Schreiben bis zur baldigen Ankunft des Fürsten behalten. Die Fürstin Sacken empfing ihn nicht. Er ließ ihr das Schreiben des Fürsten übergeben. Sie soll erklärt haben, nie zum Fürsten zurückzukehren, frei leben zu wollen und mit 2/m Rthl Appanage zufrieden zu sein. Sie sei aus Abneigung und aus Liebe zu ihren Kindern gegangen. Freunde raten dem Fürsten zu Festigkeit.
oe1bu9454-108: Triebenfeld klagt, Prinz George antworte trotz der von Präsident v. Schuckmann zugestellten Briefe nicht und schicke keine Remessen. Kuh habe ihn wegen 5800 Rthl verklagt und ein Exekutionsdekret erwirkt; am Freitag drohe Arrest. Der Minister wollte Kuh beruhigen, soll aber erst Donnerstag kommen. Der Prinz habe die ihm für 280000 Rthl verkauften Güter mit 270000 Rthl verschuldet. Fällig sind 20000 Rthl an Liepman Meyer und am 7. August 12000 Rthl. Triebenfeld will den Prinzen aufsuchen und bittet um einen Ausweg.
oe1bu9454-109: 'Der Schreiber berichtet einem Freund, Wildegansch sei in Berlin und behaupte, der Fürst habe ihn gesandt; er habe mit seinem Anhang ein Geldgeschäft mit Asch und Schlabrendorff erfunden, um den Fürsten um die Kosten zu prellen. Wie er höre, werde in 2 Monaten nichts entschieden. Nachschrift: Bukowiecki will für Pszczew nur 2400 Rthl Jahrespacht zahlen. Er höre, man wolle den Schreiber wegen eines an Schlabrendorff gegebenen Wechsels von 11/m verklagen und ein Exekutionsdekret erwirken; der Freund soll den Fürsten warnen.'
oe1bu9454-110: Triebenfeld meldet, er glaube, das Geschäft wegen der Urkunden über sämtliche geistliche Güter abgeschlossen zu haben. Sollte sich sein Aufenthalt hinziehen, will er sie mit der nächsten Post nach Wrocław schicken. Anfangs verlangte man das 2½-fache, jetzt zahlt er nur 240 Fr d'or und etwa 200 Rthl. Das Geld hat er beim Geheimen Ober Rechnungsrath Mathias geliehen, der es in 14 Tagen zurück braucht. Er bittet den Fürsten, es bald anzuweisen.
oe1bu9454-111: Triebenfeld kann das Geld zur Auslösung der Urkunde nicht aufbringen, da Wildegansct ihm in Berlin allen Kredit verderbe. Dem Freund, der die Sache vermittelt hat, gab er 300 Rthl als Angeld aus seinem Reisegeld. Er bittet um eine Anweisung auf die 240 f. d'or um 200 Rthl Courant, sonst drohe ein böser Streich. Köckritz und Zastrow nennt er wahre Freunde des Fürsten. Wegen des Geklätsches will er sich im Hintergrund halten.
oe1bu9454-112: Nachschrift. Triebenfeld erfährt vom Hoffrath Wunster, dass Wildeganst und der Jude Heymann in der Sache des Fürsten nichts getan haben. Nach Wildeganst sei über den von Triebenfeld für den Fürsten unterschriebenen Wechsel über 11/m Rthl bereits erkannt, er solle arretiert werden. Der Amtpfänder Rudolph hat sich schon nach ihm erkundigt. Er fleht um schleunige Vorkehrungen. Prinz George habe seine Güter für 750000 Rthl verkauft. Er schlägt vor, der Fürst möge Graf Schlabrendorff bewegen, den Wechsel von den Juden zurückzunehmen.
oe1bu9454-113: 'Triebenfeld dankt für die Zusicherung, mit Asch und Gad sei wegen der 11000 Rthl alles abgemacht, meldet aber, dass in dieser Sache ein Arrest gegen ihn vorliege: Zahle der Fürst die versprochenen 4000 Rthl nicht, solle er sofort verhaftet werden. Prinz George erkläre sich über nichts und verschleppe seine Sache. Wildeganst lasse ausrichten, Asch und ein Weiterer würden bis Johanni warten, was ihm keine Rettung sei. Er bittet flehentlich, die Sache mit den 4000 Rthl zu bereinigen.'
oe1bu9454-114: 'Großenteils unleserlich. Erkennbar ist: Der Schreiber nennt einen Ungenannten einen abgefeimten Buben, der Sr. Durchlaucht viele Schwierigkeiten gemacht habe und nun, da nichts mehr zu erpressen sei, das Ganze schließen wolle. Er hofft auf baldigen Abschluss, damit Triebenfeld nicht länger gekränkt werde. In seiner eigenen Sache wolle jemand etwas, was ihm nicht gelingen solle. Abgeholt werde am Dienstag, spätestens am Mittwoch. Seine Gesundheit bessere sich.'
oe1bu9454-115: 'Triebenfeld entschuldigt sein Fernbleiben vom Mittag: Sein Pächter in Świniary bittet ihn dringend, die Bauern zur Ordnung zu bringen, die die Dienste verweigern. Der Minister scheine es wegen Schlabrendorff etwas krumm zu nehmen, dass der Fürst ihm nichts sage. Er habe Schlabrendorff zum 15. herbestellt und ihm geraten, alle Klagen zurückzunehmen, sonst könne er ihn nicht retten. Auch Asch soll ihn dazu bewegen. Triebenfeld geht nach Lądek, will aber am 15. zurück sein und Hirsch hinzuziehen.'
oe1bu9454-116: Triebenfeld kann krankheitshalber nicht persönlich Befehle zum Güterverkauf einholen. Er hält das Gerede, auf Trąbczyn hafteten 150000 Rthl Schulden, die Walichnowski übernehmen solle, und er solle dennoch 56000 Rthl und einen Canon von 5000 Rthl jährlich zahlen, für missverstanden und fürchtet um die Ehre des Fürsten. Er schlägt vor, von Walichnowski 60000 oder 80000 Rthl Erbkaufgeld und 4 bis 5000 Rthl jährlichen Erbzins fest zu fordern. Er bittet um Verschwiegenheit und geheime Weisung. Walichnowski wolle die Trąbczyner Güter ernsthaft erwerben.
oe1bu9454-117: 'Triebenfeld betreibt die Ablösung der Forderung des v. Grotowski: Weigel sichert ihm gegen Garantie Triebenfelds 30/m Rthl samt Zinsen zu. Die Banque discontirt aber erst nach gerichtlicher Cession, deren Instrument Hoffrath Ebersbach entworfen hat. Der Fürst soll Weigels Brief per Expressen an Grotowski schicken. Grotowskis Mandatarius in Kalisz soll der Regierung melden, dass keine Subhastation mehr anstehe. Dazu: Tod des Hauptmanns v Müllern und Morgenbeßers, Nelsons Sieg, Jubel in Wien, Bernhardis Brief an Stössel.'
oe1bu9454-118a: Kunkel und 2 Kolonisten aus Oleśnica bieten 1500 Rthl und wollen einen Vertrag. Triebenfeld hält sie für Glücksritter, die die 17000 Rthl zu Martini und Johanni kaum zahlen könnten, und rechnet mit endlosen Prozessen. Nur auf Befehl des Fürsten will er einen Vertrag entwerfen lassen. Oberamtmann Nerlich will durch Kunkel Trąbczyn oder Zagórów in Erbpacht nehmen und hat 80000 Rthl bar. Walichnowski fragt, was er zahlen soll. Urbanowski hat den Trąbczyner Anschlag angefordert. Triebenfeld bittet um Weisung.
oe1bu9454-118b: Die Gräfin Schlabrendorff will mit den 50000 Rthl bis zum 1. Januar 1805 warten; eine längere Frist konnte Homuth nicht erreichen. Sie beklagt ihren Verlust, da sie keine Zinsen erhält. Müssen bis dahin keine Zinsen gezahlt werden, sind 2500 Rthl gewonnen. Homuth bittet um den Vergleich, um ihn der Gräfin zur Vollziehung zu schicken, und will versuchen, die alten Wechsel zurückzubekommen. Der Conducteur Cabanis ist abgereist; die Breslauer Mietkutscher verlangten 20 Rthl.
oe1bu9454-118c: Gräfin Schlabrendorff will mit den 50000 Rthl bis zum 1. Januar 1805 warten. Einen längeren Termin konnte Homuth nicht erreichen, sie beklagt ihren Verlust. Muss der Fürst bis dahin keine Zinsen zahlen, rät Triebenfeld, den Termin anzunehmen, da 2500 Rthl gewonnen seien. Homuth bittet um den Vergleich, um die Urkunde aufzusetzen, und will versuchen, die alten Wechsel zurückzubekommen. Der Conducteur Cabanis ist abgereist und will draußen eine Bauernfuhre mieten, die er für 4 oder 5 Rthl zu bekommen glaubt.
oe1bu9454-119: Triebenfeld schlägt vor, den Geometer Cabanis zu Husiten zu schicken und etwa 500 Wirte anwerben zu lassen. Laut Glencks Tabelle aus Zagórów wären rund 31000 Morgen Dominialgründe zu dismembrieren. Cabanis hatte bei Strehlen bereits ein Gütchen an Husiten aufgeteilt, die für 23 Hufen 25/m Rthl bar zahlten. Uminski findet laut Prinz Biron den Preis für die Kamionna-Güter zu hoch, will sie aber besichtigen. Triebenfeld hält das für Spott, da Broniewski dort noch sitzt. Rapackis Kaufwillige verlangen zu lange Zahlungsfristen.
oe1bu9454-120: Cabanis meldet Kaufwillige unter den Husiten in Husinich und Rentsch. Sie halten 300 Rthl pro Hufe und 15 Rthl jährlichen Zins für billig, haben einen Boten an ihre mährischen Glaubensbrüder geschickt und wollen binnen 14 Tagen in Corpore erscheinen. Cabanis soll sie über den Geistlichen in Hussinitz weiter antreiben. Gräfin Schlabrendorff gibt das Instrument erst nach Erhalt der übrigen 50/m Rthl heraus. Homuth bewirkt eine Frist bis 1. Januar 1805.
oe1bu9454-122: Der Schreiber leitet ein Billet weiter, das versehentlich in seinem alten Logis liegen geblieben war. Herr Homuth bittet dringend, diese Post bald zu berichtigen, damit er durch den Boten den Eingang der 166 Rthl 16 g anzeigen kann. Cabanis reist mit der Post nach Hussinitz ab; der Schreiber verspricht sich davon schnellen, glücklichen Erfolg. Aus Berlin oder Frankfurth hat er heute keine Nachricht erhalten.
oe1bu9454-123: Triebenfeld reicht ein per Estaffette eingegangenes Schreiben Kunckels ein und bittet um Verhaltungsbefehle. Er hält ein Abkommen mit Otocki für nötig; ein gütlicher Vergleich, bei dem Otocki mit 1500 oder 2000 Rthl zufrieden wäre, sei vorteilhaft. Ob Kunkel Vollmacht zum Vergleich erhalten soll, stellt er dem Fürsten anheim. Er fürchtet, dass Kunkel und Jentsch gegeneinander handeln, und rät, beide zu instruieren. Glenck kam nicht mehr, ließ aber die Rechnungen von Konotop zurück, die über alles Aufschluss geben.
oe1bu9454-124: v. Triebenfeld legt dem Fürsten seinen Entwurf der Antwort an Kunkel vor, damit dieser prüft, ob sie seinem Willen entspricht. Er bittet, beide Schreiben von jemand anderem ins Reine schreiben zu lassen, da seine Frau heute beigesetzt wird und er sich mit den Kindern zu seinem Schwager zurückgezogen hat. In seinem eigenen Schreiben an Kunkel will er alles gründlich darlegen. Eine Karte von Kopojno, Skokum und Świątniki habe er bei sich.
oe1bu9454-125: Meldet, dass die Leute aus Oleśnica mit den Geldern angekommen sind und um 4 Uhr beim Fürsten erscheinen wollen. v. Triebenfeld hat bereits mit ihnen verhandelt. Er will dem Fürsten am Nachmittag darüber Vortrag halten und glaubt, es werde ihm nicht unlieb sein.
oe1bu9454-126: Triebenfeld meldet, dass Cabanis mit den Hussiten zurückgekehrt ist, denen es außerordentlich gefallen habe. Sie wollen zurückeilen, ihre Glaubensbrüder sammeln und in 14 Tagen alles abmachen. Cabanis bringe viele Neuigkeiten, die Triebenfeld mit dem Fürsten besprechen müsse; dringend solle sogleich jemand hingehen. Triebenfeld arbeitet mit den Leuten aus Oleśnica und bittet den Fürsten, nach der Parade eine Viertelstunde zu ihm zu kommen, sie selbst anzuhören und Befehle zu erteilen.
oe1bu9454-127: 'Triebenfeld bittet den Fürsten um Hilfe mit 900 Rthl, da er, um Execution zu vermeiden, 910 Rthl zahlen muss: 700 Rthl für das vom Prinzen unter seiner Garantie zugesagte Inventarium, 175 Rthl Zinsen von 1799 und 35 Rthl Prozesskosten. Der Prinz habe keine Zinsen berichtigt. Seine Kasse sei erschöpft, da er gestern bereits 1537 Rthl 12 gg in einer weiteren Sache des Prinzen gezahlt habe. Wildegans und Heyman Pincus versprechen Berichtigung. Zu Johanni will er den Fürsten mit Holzgeldern unterstützen.'
oe1bu9454-128: Triebenfeld berichtet von 11 Prozessen, für die er Prorogation erhielt und Vergleiche anstrebt. Die Pächter fordern hohe Abstandsgelder. Mit Flörken und Ribbeck (12600 Rthl bar gezahlt, 8000 Rthl für Bauten liquidiert) sucht er einen Vergleich und hat Execution und Sequestration beantragt. v. Rudnicki soll zu Johanni abreisen. Mit Hilfe des Landraths zahlen die alten Unterthanen 1 Rthl Grundzins pro Hufe, heute fanden sich Käufer für 87 Hufen. Glenck verspottet gegenüber dem Landrath den Olesnicer Contract.
oe1bu9454-129: Triebenfeld hat weder aus Berlin noch aus Frankfurt Briefe und bittet den Fürsten, ihm tröstliche Nachrichten von Glenck mitzuteilen. Wegen Kolzig antwortet Amelang nicht; schweigt er weiter, müsse der Verkauf von Konotop eifrig betrieben werden. Den Pächter Bernhardi hat er herbestellt und angewiesen, die Güter jedem Kauflustigen zu empfehlen, statt den Kauf aus Eigennutz zu hindern, und Ludolff und Stubenrauch gut aufzunehmen. Nachmittags will er die Sendung nach Südpreußen herausbringen.
oe1bu9454-130: 'v. Triebenfeld berichtet, dass noch nichts geschehen ist und einer dem anderen nicht traut. Mit M. Bernhard hat er vereinbart: Er soll die Sache in Pszczew zustande bringen, die Güter bleiben auf den Namen des Fürsten, und Leixner will Kamionna übernehmen, auf den Namen des Fürsten oder Triebenfelds. Leixner ist bedrängt und zufrieden, wenn Triebenfeld ihm seinen Namen leiht. Triebenfeld hat Glenck eine Estafette nachgeschickt, reist nach Berlin, will Sonnabend zurück sein und danach in Pszczew abschließen.'
oe1bu9454-131: 'Triebenfeld hat in Berlin nur Schwindel und Lügen vorgefunden: Ohne sein Kommen wäre Ewr Durchlaucht angeführt worden, von dort sei kein Heller zu erwarten. Er will am 20. nach Frankfurt zurück, mit Leixner wegen Kamionna abschließen und die für Koszęcin nötigen Gelder sichern. Man mache eher Hoffnung auf die Güter, da der König kein Geld weggeben wolle. In der Broniewskischen Sache soll der Arrest angenommen werden, sobald die Causae arresti nachgewiesen sind.'
oe1bu9454-132: Der Schreiber reist unverrichteter Dinge nach Wrocław zurück, weil er vergeblich auf Glenck gewartet hat. Er klagt, bei Pszczew hätten andere 30000 Rthl am Fürsten gewonnen. Der Freund soll Director Stubenrauch zum Kauf von Kamionna bewegen, damit dieser das Geld bis Johanni hergibt. Der Schreiber will für 10000 Rthl jährliche Revenue haften. Der Fürst wäre mit 180000 Rthl zufrieden. Ohne Einstandsgeld zahlten die Unterthanen 50 Rthl pro Hufe jährlich. Er mahnt zur Vorsicht beim Cabinets Rath.
oe1bu9454-133: 'v. Triebenfeld berichtet vom Scheitern der Geschäfte: Glenck kann nichts nachweisen; Leixner, durch Betrug in Pszczew abgeschreckt, soll die Zahlungen halten, verlangt für Kamionna Eviction und Incolat sowie die Aufhebung des Societätskontrakts mit Glenck. Das Darlehen von 100/m Rthl der Invalidenkasse ist unsicher. Triebenfeld will in Berlin mit Amelang bei Stubenrauch abschließen. Beyme habe das Entschädigungsgesuch des Fürsten vorgetragen und geraten, ihm Schulden über 200000 Rthl zu erlassen. Im Kriegsfall erhalte der Fürst das Kommando.'
oe1bu9454-134: Das von Glenck zugesicherte Anlehn der Invaliden Casse scheitert, weil die Ottosche Taxe auf 78/m Rthl herabgesetzt wurde; auch Stubenrauch und das Pupillen Collegio versagen. Beyme ließ Amelang sagen, der König wolle dem Fürsten als Entschädigung für die Brzyce-Güter seine Schulden erlassen. Amelang schlug die konfiszierten Kolziger Güter Schlabrendorffs vor. Triebenfeld will versuchen, ob man auf Konotop und Zagórów 120/m Rthl leiht; gelänge dies, könnte man die Güter von Zagórów und Trąbczyn in Ruhe dismembrieren.
oe1bu9454-135: Abschriften zum Verkauf von Kamionna und Kolno. Kabinets Rath Werner fordert beim Cammer Director 2 pc Provision laut Revers des Fürsten zu Hohenlohe vom 17. Dezember 1803, da er einen Käufer vorgeschlagen habe. Er fürchtet Einwände Glencks. Glenck fragt an, ob der Adressat bei einem Wert von 200/m Rthl hinter 100/m Rthl 60000 Rthl als zweite Hypothek leihen würde. Stubenrauch schickt die Papiere zurück und lehnt ab, weil die Güter durch Makler in üblen Ruf gekommen seien.
oe1bu9454-136: Triebenfeld wartet ohne Vollmacht vergeblich auf Glenck; die Käufer von Kolno und Kamionna sollen 76/m Rthl hier zahlen. Mit Radzinski in Szetlewek ist er weitgehend fertig, zwei Interessenten bieten für Szetlewek 1 Rthl Grundzins pro Morgen. Gegen die Pächter um Floricke liegt ein Solutionsdecret vor. Trąbczyn will er ein Jahr an Otocki verpachten, die Mennonisten auf etwa 400 Hufen ansiedeln. Voss will Dismembrationen ab 1. July untersagen. Blomberg zufolge hält Glenck in Wrąbczyn Ansiedler ab.
oe1bu9454-137: Triebenfeld klagt über die hinhaltenden Leixner und Meyer Bernhard. Sie versprechen nun, 76/m Rthl und etwa 20/m Rthl in Banco Obligation an Bernhardi zu schicken, halten aber 30/m Rthl zurück, weil der Fürst Betsche zurückgekauft habe. Für Trąbczyn nahm er einige Tausend Rthl auf Wechsel. Durch den Groß Kanzler und Köckritz erreichte er, dass die Deposition der Broniewskischen Gelder angeordnet wird. Köckritz stellt Güter in Erbpacht in Aussicht. Fürstin Sacken kündigte durch Cosmar das Capital von 30/m Rthl auf Koschentin.
oe1bu9454-138: Amelang meldet zur Broniewski-Sache, dass die Deposition nun angeordnet ist. Nach Auskunft v. Triebenfelds wolle der Fürst eine Caution mit deponieren, um in den Besitz der Güter zu gelangen. Amelang hat diese Caution von 10000 Rthl angeboten. Daraufhin wurden der Regierung zu Poznań die Deposition und eine Verfügung zu Kolno und Kamionna anbefohlen. Zum ersten Depositionsversuch verweist er auf eine Resolution vom 25 Juny. Er erwartet, dass dem Fürsten die Verfügung angenehm ist.
oe1bu9454-139: Triebenfeld berichtet, der Vergleich mit Broniewski sei nicht mehr rückgängig zu machen. Glenck reichte ihn am 6. zur Approbation ein, der Protest des Fürsten traf am 8. ein, wurde aber beiseitegelegt. Keiner will schuld sein, einer schiebt es auf den anderen, Melzer gibt aber zu, eine Deposition hätte Broniewski besiegt. Gegen Bornstädt habe man wie gegen die Trąbczyner auf Exmission geklagt, ohne ein Liquidum festzusetzen. Triebenfeld will nach Pszczew. Melzer erwartet einen Liquidationsprozess von 6 bis 8 Jahren.
oe1bu9454-140: 'Triebenfeld bittet per Estaffette um Hilfe: Die Gemeinden in Pszczew wollen, von Rochlitz aufgehetzt, vom Kauf zurücktreten. Verlangt werden die Cassation des Contracts zwischen Leixner und v. Brandenstein, Glencks Herausgabe des Societaets Contracts und eine Abmachung mit Bornstädt. Der Fürst soll Glenck die Papiere abfordern und Brandensteins Revers schicken. Triebenfeld fragt, was er Bornstädt wegen der zugesagten 1000 Friedrichsd''or antworten soll. Glenck habe Meyer Bernhard abgeraten, die 66/m Rthl am 29. in Posen zu zahlen.'
oe1bu9454-141: 'Triebenfeld, in Poznań mit Gallenfieber bettlägerig, berichtet über die Broniewski-Sache. Der geschlossene Vergleich biete keine Sicherheit und solle umgeändert werden; dazu brauche es Broniewskis Frau. Wunster halte er für einen Spitzbuben, der mit Broniewski und Guderian zusammenstecke. Meyer Bernhard und Simon wollten statt 13000 Rthl nur 6000 Rthl zahlen. Plan: Broniewski leistet Sicherheit, Glenck dringt auf Deponierung der 66000 Rthl; Broniewski erhält 53000 Rthl, der Fürst 13000 Rthl. Aus Pszczew will er 30000 Rthl holen.'
oe1bu9454-142: Triebenfeld ist krank und bettlägerig. Bornstädt will abreisen, doch der Streit mit ihm soll vorher beigelegt werden. Triebenfeld bittet den Fürsten, Glenck zur Übersendung der mit Bornstädt geschlossenen Contracte, Vergleiche und Berechnungen anzuweisen. Außerdem soll der Fürst schriftlich erklären, Bornstädt aus besonderer Gnade 5000 Rthl geben zu wollen. Nach einem Gutachten stünden Bornstädt ohne das versprochene Honorar im Kaufgeschäft von Pszczew 7500 Rthl zu.
oe1bu9454-143: Amelang bestätigt, vom Fürsten über den Ausgang der ihn betreffenden Entschädigungsangelegenheit unterrichtet worden zu sein. Der Fürst erklärt sich mit dem Abschluss dieses Geschäfts zufrieden. Die anschließende Passage über die fortdauernde Gnade des Königs gegenüber dem Fürsten ist teilweise unleserlich.
oe1bu9454-144: Amelang bestätigt den Eingang des fürstlichen Befehls vom 31. des Vormonats. Er will morgen früh den Grafen von Schulenburg aufsuchen, ihm das an ihn gerichtete Schreiben übergeben und seine nähere Erklärung abwarten. Über das Ergebnis dieser Unterredung will er mit der nächsten Post berichten.
oe1bu9454-145: 'Honrichs zahlt die 4000 Rthl nicht, obwohl alles gelöscht und mit Zustimmung des Pupillen Collegiums geregelt ist. Hoffrath Grimm, schwer krank, will ihn gerichtlich belangen, doch fehlen Contract und Vollmacht; der Contract liegt bei Rochlitz. Triebenfeld bittet, ihn dort eilig anzufordern und mit Vollmacht an Grimm zu schicken. In Trąbczyn werden, wie er hört, seinem Plan widersprechende Befehle gegeben: 100 Scheffel Korn wurden verliehen, viele Äcker besät. Nach einem Wagenbruch will er nach der Reparatur dorthin eilen.'
oe1bu9454-146: Triebenfeld berichtet, die Mennonisten wollten die Güter Zagórów und Trąbczyn im Ganzen kaufen; er will morgen nach Lunau reisen. Die Taxation stockt wegen Glencks Contract vom 5. Sept. über 300 Morgen Dominalgründe und seines Verkaufs der Komornitzen in Wrąbczyn an v Malachowski; die Gemeinde protestiert. Er erbittet Reverse Glencks sowie die Contracte der Müllerin aus Wrąbczyn und der Swięcier Hauländer. Gegen eine Execution über 6500 Rthl wegen Przespolewski hat er Einspruch eingelegt.
oe1bu9454-147: Der Schreiber (unterzeichnet v. Triebenfeld) meldet nach einer Reise durch West- und Ostpreußen, die Mennoniten wollten am 19. Dezember in Breslau abschließen, verlangten aber die Propination. Er hat Landsberger und Oderbrücher kommen lassen, um deren Angebote zu vergleichen. Stückweisen Verkauf lehnt er ab. Die Taxe durch Schenck geht langsam voran. Im Nachsatz beklagt er Glencks Vorwürfe und Anordnungen gegen seine eigenen. Der Justizbürgermeister erbittet Weisung zu den Wrąbczyner Gründen. Die Voigtey dürfte auf etwa 11000 Rthl taxiert werden.
oe1bu9454-148: v. Triebenfeld rechnet vor, dass das Gut Swięcia verschleudert worden sei. Glencks Tableau wies 1800 Rthl jährliche Zinsen und 10000 Rthl Capital aus. Die heute beendete Revision der Taxatoren ergibt dagegen nur 918 Rthl Zinsen. Das Gut mit 3792 Morgen sei für 28360 Rthl weggegeben worden, was einen Verlust von 47340 Rthl bedeute. Zusammen mit dem Olesnicer Verlust von 48000 Rthl verliere der Fürst an beiden Gütern netto 95340 Rthl. Ein ebensolcher Ausfall entstehe jetzt bei der Taxe.
oe1bu9454-149: Triebenfeld erwartet die Leute aus dem Oder- und Netzebruch und hat wüste Gründe an der Grenze vorteilhaft verkauft; keine Hufe soll unter 600 Rthl abgegeben werden. Er hofft, die Taxe der Zagorower Güter ergebe über 400000 Rthl, und will in Berlin Geld für Schlabrendorff und Lichnowski aufnehmen. Die Wrąbczyner Untertanen verweigern den Zins, klagen über Glencks Drohungen und Zwangsdienste bei Zagorower Bürgern und bieten einen Rthl pro Morgen; er verwies sie an Justiz Bürgermeister Schenck.
oe1bu9454-150: 'Aktenauszug: Landesältester v. Lichnowski fordert mit Schreiben vom 23. Nov. 1804 vom Fürsten einen Zinsrückstand von 5572 Rthl 12 gg für anderthalb Jahre (4. Mai 1803 bis 4. Nov.). Ein Mandat der Kalischer Regierung setzte eine Zahlungsfrist von 14 Tagen, die ohne Zahlung verstrichen ist. Er droht mit einem Antrag auf Sequestration, wünscht aber gutes Einvernehmen. Die Antwort lautet, die Pächter hätten nicht gezahlt. Er werde befriedigt werden, da Herr v. Triebenfeld alles in Ordnung bringe.'
oe1bu9454-151: 'Die Mennonisten sind in Trąbczyn und wollen beide Güter zusammen kaufen, doch hoher Schnee verhindert alle Arbeiten. Die Taxe muss umgearbeitet werden: Swięcia bringt statt 1800 nur 918 Rthl, Wrąbczyn statt 1500 nur 1123 Rthl. Hundert Hufen Wald bei Grądzyń und Drzewce sollen 3000 Rthl Zinsen, also 60000 Rthl Capital, bringen. Lichnowski hat einen Teil der 10000 Rthl der Oleśnicer mit Arrest belegt. Laut Nerlich verweigern die Wrąbczyner die Weihnachtsrate.'
oe1bu9454-152: Triebenfeld kündigt den Freipass für Hohenlohische Weine an und hofft, die 25000 Rthl bald zu übermachen. Die von Glenck eingetragenen Schulden lasten nicht nur auf Swięcia und Oleśnica, sondern auf allen Ortschaften der Zagórówer Güter, was die Sache erschwert. Nothardt ist gestorben und Goldbeck Präsident in Kalisz; sollten Hindernisse bei der Dismembration eintreten, hofft Triebenfeld, sie in Berlin zu beheben. Bernhardi ließ ihn mit dem Geld im Stich. Voss werde sich gewiss bald zurückziehen. Nothard hinterlässt 28000 Rthl Schulden.
oe1bu9454-153: v. Triebenfeld sorgt sich um die Beschaffung der 25000 Rthl, da Bankpräsident von Stein erneut jedes Diskontieren untersagt hat. Das Kapital von 140000 Rthl soll die Invaliden Casse oder das Potsdamer Waisenhaus geben, aber erst nach Erledigung aller Formalien und nicht in Raten. Mit Amelang sucht er die 25000 Rthl vorläufig zu beschaffen. Er berichtet über Geldmangel und drohende Bankrotte in Südpreußen. Der Brief bricht ab.
oe1bu9454-154: Triebenfeld meldet, die Anleihe sei in gutem Gang und liege einem Mann zur Prüfung vor. Gegen Wollenhaupts Gerede von einer Sequestration stellt er, Lichnowski habe den Arrest auf 6 Wochen aufgehoben, der Arrest wegen Magnuski sei laut Grimm ebenfalls aufgehoben. Przespolewski habe keine 30000 Rthl zu fordern, die Dębinska habe nur Arrest gegen Auszahlungen an Magnuski gelegt. Blomberg drohe in einem Brief vom 25. Dezember, ohne Erfüllung seiner Forderungen werde aus der Dismembration nichts. Triebenfeld hat ihn scharf zurechtgewiesen.
oe1bu9454-155: Hahn meldet im Auftrag des Fürsten, dass Kanzler Hohmuth wegen der Schlabrendorffischen Zahlung keinen längeren Aufschub zusagt. Die Gräfin, gereizt durch die Verzögerung, lasse sich nur durch schnelle Zahlung vor dem nächsten Berliner Posttag von der Wiederaufnahme der Klage abhalten. Würden 25/m Rthl bald gezahlt, wolle Hohmuth sie bewegen, auf die übrige Hälfte noch zu warten. Eine Obligation dafür lehne er ab. Das wilde Schwein ist über Kalisz nach Trąbczyn abgeschickt.
oe1bu9454-156: Triebenfeld berichtet, dass er die 25000 Rthl ohne das große Geschäft nicht erhalten kann. Zweimal sei das Geld hintertrieben worden, vermutlich vom jungen Eysenhardt, der 18000 Rthl fordert. Ein Angebot des Hoffrath Meyer lehnte er vorerst ab, da 9000 Rthl auf Szetlewek eingetragen seien. Beigelegt ist eine Abschrift, in der Gräfin Schlabrendorff mit Fortsetzung der Klage in Berlin droht, falls die rückständigen Vergleichsgelder für ihre Kinder nicht bis zum nächsten Posttag gezahlt werden.
oe1bu9454-157: Triebenfeld meldet, dass ihm durch Vermittlung des Generals v. Köckritz ein Darlehn aus der Invaliden Casse zugesagt ist. Nach der Bewilligung will er 60000 Rthl nehmen, die geliehenen zehntausend zurückzahlen und dem Fürsten 50/m Rthl schicken, damit die Schlabrendorff bezahlt werden kann. Pochammer werde keine Klage einreichen, wenn sie in diesem Vierteljahr Geld erhält. Giraud und Haugt will er die Zinsen zahlen und ihre Hypothek an jemanden cedieren lassen, der 18000 Rthl auf vier Jahre gibt.
oe1bu9454-158: 'Durch Vermittlung des Generals v. Köckritz hat das Invaliden Departement 150000 Rthl zugesagt: vorerst 50000 Rthl auf Hypothek und Triebenfelds Wechsel, die 100000 Rthl nach Revision der Taxen durch die Kammer, die er ab Mittwoch in Kalisz leiten will. Danach will er 10000 Rthl zahlen und den Rest senden. Er rät von der Klage wegen der proxenetica ab und weist den Tadel in der Schlabrendorffschen Sache zurück. Von 30/m Rthl für das Reich könnte etwa die Hälfte beisammen sein.'
oe1bu9454-159: Amelang hat mit großer Mühe vom Bankier leve eine Anweisung an die Gebrüder Kuh auf 36755 Rthl 7 gg erhalten, im Zusammenhang mit den Geldern der Invaliden Casse, die eigentlich in Seehandlungs Obligationen bestehen. v. Triebenfeld übersendet die Anweisung und bittet, den Brief an die Herren Kuh sofort abgeben zu lassen. Morgen sollen die Hanusche und die Eysenhardtsche Sache geordnet werden. Danach will er nach Kalisz zurück, um die 100000 Rthl zu besorgen.
oe1bu9454-160: Triebenfeld meldet, dass die Invaliden Casse die Seehandlungs Obligationen herausgibt und er nun Livi befriedigen kann. Weitere Gelder sollen nach Revision der Taxen durch die Cammer folgen. Girard erhielt 900 Rthl Zinsen, das Kapital soll einige Jahre ungekündigt bleiben. Bei Seebald wurden 1800 Rthl Proxeneticum erspart. Die Olesnicer Leute, die gegen die Dismembrierung der Wälder protestieren, will er hinauswerfen. Die Nachkäufer haben 10000 Rthl bezahlt und wollen weitere 10000 Rthl zahlen. Geplante Abreise am 5ten über Kontop und Glogau.
oe1bu9454-161: Amelang meldet, dass das fürstliche Schreiben vom 3. eintraf, als v. Triebenfeld gerade abreisen wollte. Er konnte es ihm noch vorlegen, und Triebenfeld freute sich über die Zufriedenheit des Fürsten. Die Zahlung der Assignation ist erfolgt. Alles hängt nun von der Revision und ihrer Beschleunigung ab. Vor 3 bis 4 Monaten wäre das Geschäft schneller erledigt worden. Amelang versichert seinen Eifer. Teilweise schwer lesbar.
oe1bu9454-162: Ein neuer Befehl des General Finanz Departements verbietet den Kammern Revisionen gerichtlicher Taxen ohne dessen Vorwissen. Triebenfeld führt ihn auf Prinz George und Krieges Rath Korn zurück. Er hofft auf die Erlaubnis, die Präsident v Goldbeck beantragt hat und die Amelang in Berlin betreiben soll. Er will die Dismembrationspläne einreichen. Der Fürst soll für Goldbeck drei Büsten und ein Lavoir kaufen und schicken. Die Olesnicer Sache ist durch Hussarzewski an das Patrimonialgericht zurückgegangen.
oe1bu9454-163: Meldet einen Termin in Trąbczyn gegen die Olesnicer, die trotz früherer Protestationen gegen die 10000 Rthl nun einlenken. Otocki will Szetlewek für 10000 Rthl Bestandsgeld und 1500 Rthl Canon in Erbpacht, die Propination beider Güter und 20 bis 30 Hufen wie die Colonisten übernehmen. Honrichs zahlt nicht; nach Aufhebung seines Contracts würde Meierowitz kaufen. Grimm bietet 2000 Rthl für Witów. Szczucki und Czizewski sollen verklagt werden. Der alte Lichnowski bittet um 1390 Rthl.
oe1bu9454-164: Triebenfeld wartet auf die Berliner Resolution und führt die neue Taxenrevision auf Prinz George und Kalckreuth zurück. Otocki verspricht 10000 Rthl und 2000 Rthl Propinationspacht im Voraus; Meierowitz würde nach Honrichs' Abgang 20000 Rthl und 500 Rthl jährlichen Canon zahlen. Ein Kammeredikt verbot die Erbpacht an Nichtadlige ohne königlichen Consens; Glenck habe dies verschwiegen und den Contract mit den Olesnicern schließen lassen. Laut Dombrowski liegen der Prusimskische Compromiss und Quittungen über Prusimskis Zahlung im Archiv.
oe1bu9454-165: 'Hahn schickt im Auftrag des Fürsten als Nachtrag zum schon abgesandten fürstlichen Schreiben einen abschriftlichen Auszug aus dem, was mit der reitenden Post von Glenck eingegangen ist. Der Fürst hält es für nützlich. Dem Fürsten geht es besser: Der Anfall ist aus der rechten Hand in den linken Fuß gezogen, der Schmerz hat nachts aufgehört. Bernhardi ist angekommen, aber nicht ganz gesund. Der Fürst ließ ihn durch Hahn beruhigen. Hahn wünscht Triebenfeld Genesung.'
oe1bu9454-166: Minister Voss hatte die Dismembration in Trąbczyn inhibieren lassen. Triebenfeld berichtet, die Kommission der Kammer habe seine Nachweise bestätigt und die Inhibition zurückgenommen. Die reinen Jahreseinkünfte wurden auf 31000 Rthl festgestellt. Nach der Konzession hofft er auf Kredit von 3 bis 400000 Rthl und will die ausstehenden 180850 Rthl zur Schuldentilgung verwenden. Die Käufer sind jedoch abgesprungen. Wegen eigener Verluste von 19500 Rthl muss er nach Świniary und Konotop. Schenck soll inzwischen die Gelder einnehmen.
oe1bu9454-167: Hahn übersendet auf Befehl des Fürsten, der eben mit dem alten Herrn zur Kirche fährt, einen beiliegenden Brief mit dessen Empfehlung an Triebenfeld. Der Fürst hätte gern selbst geschrieben, doch die Ordonanz gehe schon in einer Stunde ab. Der alte Fürst sei für sein Alter sehr wohl und zeige viel Attachement für Hahns Herrn. Die Rückkunft nach Wrocław sei unfehlbar auf den 25. bestimmt.
oe1bu9454-168: 'Triebenfeld hat mit den alten Bauern Verträge und die Sicherung der Abgaben gerichtlich abgeschlossen. Mit v. Otocki verhandelt er über Szetlewek und die Propination. Amelang verspricht Hilfe beim Anlehen. Glenck, Wollenhaupt, die drei Oleśnicaer und ein Meyer reden Käufern ab. Es werden Forderungen von 3011 Rthl erhoben; Wollenhaupt stellt er Gegenforderungen. Die alten Untertanen in Swięcia wurden ausgekauft, und für 28 Hufen wurde ein neuer Vertrag geschlossen: 400 Rthl je Hufe und 15 Rthl jährlicher Zins.'
oe1bu9454-169: Minister Voss hat jede Revision der Taxen untersagt, Triebenfeld wartet auf Amelangs Antwort zur landrätlichen Revision. Für die Dismembration soll ein Rat Zagórów und Trąbczyn besichtigen. Mit Meierowitz hat er abgeschlossen. Radzinski bietet für Szetlewek (1700 Morgen) zusammen 48000 Rthl, strittig ist nur die Weide. Triebenfeld hofft bis Juli auf 80000 Rthl. Amelang lärmt, weil Oppenheimer für die an ihn zedierte Glencksche Hypothek auf Oleśnica die Priorität verweigert.
oe1bu9454-170: Hahn berichtet, er sei auf Befehl des Fürsten nach Triebenfelds Erbgut Świniary geritten, um mit dem Amtmann Käufer und dem Förster Bezold zu reden. Der Förster fragte, wer ihn beim Fürsten angeschwärzt habe, und versicherte, alle Kräfte für das herrschaftliche Interesse einzusetzen. Den Amtmann traf Hahn in Breslau. Dieser erwiderte dasselbe, verwies auf beste Zeugnisse und seinen guten Namen und sieht einer Untersuchung seiner Handlungen ruhig entgegen.
oe1bu9454-171: Hahn berichtet, dass der Fürst am Fuß fast geheilt und sonst wohlauf sei. Der Fuß sei nur noch wenig geschwollen und schmerze nicht. Der Andreas Orden habe Freude bereitet, mehr noch das artige Benehmen des Kaysers, von dem der Fürst bezaubert sei. Auch in Wrocław soll der Kayser schmeichelhaft vom Fürsten gesprochen haben. Das Regiment Hohenlohe sei durch Erfurt marschiert, der Fürst ritt ihm entgegen. Der Herzog von Weimar werde erwartet.
oe1bu9454-172: 'Triebenfeld betreibt in Trąbczyn die Dismembration. Er hat den Haupttermin auf Montag verschoben und will dann die Contracte über alle Gründe abschließen. Er zitiert einen Brief des Präsidenten v. Goldbeck an Minister Voss: Die Kammer habe bereits eingewilligt, Krieges Rath zur Höllen habe Fehler begangen, und diese sollen, wenn Voss den Consens erteilt, nach Möglichkeit berichtigt werden. Kunkel von den Olesnicern ist in Verwahrung gebracht worden. Wegen Szetlewek erwartet Triebenfeld einen schweren Tag.'
oe1bu9454-173: Triebenfeld bittet den Fürsten, Glenck zur Beschaffung der Punctation zwischen Rochlitz und Honrichs über Witów samt Rochlitz' Vollmacht anzuweisen. Im Trąbczyner Archiv fand sich nichts, sonst drohe der Verlust von 14000 Rthl. Mit einem Kammerrat will er in Trąbczyn das Locale nach den Dismembrationsplänen revidieren; insgesamt erhofft er 350000 Rthl. Szetlewek will er diese Woche erledigen. Für 8 neue Dörfer erbittet er Namen. Den beiliegenden Vertrag mit Schenck soll der Fürst wegen 5 Huben Land und des Actuarius beanstanden.
oe1bu9454-174: Rechnet vor, dass ein Justitiarius, der auch den Posten eines Rendanten übernimmt, durch Ersparnisse so viel einbringe, wie Schenck erhält; die Sporteln würden auf wenigstens 1200 Rthl steigen. Bittet, Hahn nach Świniary zu schicken, um Amtmann Käufer und Förster Peltzold zu verwarnen. In Trąbczyn warten Kaufwillige auf etliche Huben Land gegen Barzahlung. Erwähnt die 1390 Rthl für Lichnowski und sendet Amelangs Brief zurück. Wiesolowski berichtet von russischen Truppen, zusammen über 300/m Mann.
oe1bu9454-175: Hahn übersendet auf Befehl zwei beiliegende Schriftstücke, ein Original und eine Abschrift. Der Fürst bittet v. Triebenfeld um seine Meinung, was in diesen Sachen zu tun sei. Besonders Girard dränge. Der Fürst würde die nötige Summe sofort schicken, um die Herren zufriedenzustellen, wären seine Mittel durch die Reise nicht so erschöpft.
oe1bu9454-176: Hahn meldet den Tod des regierenden Fürsten zu Hohenlohe-Neuenstein am 27. Juli durch Schlagfluss. Laut Testament ist Hahns Fürst Alleinerbe; in Öhringen und den übrigen Orten wurde sofort Besitz ergriffen. Maßnahmen der Fürsten zu Langenburg und Kirchberg, gestützt auf einen Teilungsvertrag, wurden abgewehrt, ihre Truppen zurückgewiesen. Der Fürst will im September nach den schlesischen Revuen dorthin reisen. Er überlässt die südpreußischen Angelegenheiten Triebenfelds Einsicht, da er lange abwesend sein wird.
oe1bu9454-177: Wegen der Mobilmachung ist in Berlin wenig zu erreichen. Die Approbation der Dismembration bei Zagórów und Trąbczyn betreibt Geheimer Rath Reinbeck; davon hängt das erhoffte Geld von Invaliden Casse und Pupillen Collegium ab. Beigefügt ist ein Verzeichnis der neuen Kolonien (21407 Morgen, 578 Wirthe; dem Dominium bleiben 4575 Morgen). Radzinski soll 6000 Rthl erlegen. Zerstreute Colonisten versprachen etliche Tausend Rthl. Zu zahlen bleiben Prusimska 20000, Weigel 23000, Schlabrendorff 25000 Rthl.
oe1bu9454-178: 'Hahn meldet, dass er unter seinen Papieren noch einige von Sr Durchlaucht unterschriebene chartes blanches gefunden hat, die für Triebenfeld bestimmt waren. Er entschuldigt das Versehen: In den letzten Nächten vor der Abreise sei der Cammer Director Graf eingetroffen und alles Hohenlohische musste vor der Reise erledigt werden. Die übrigen chartes blanches hat er an die Fräulein von Triebenfeld geschickt. Nachschrift: Sr Durchlaucht hat ihn vor der Abreise zum Expeditions Rath ernannt.'
oe1bu9454-179: Triebenfeld meldet, dass Dismembration und Pszczew-Sache vom König genehmigt sind und der Ertrag der Güter auf 40260 Rthl festgesetzt ist. Die Schulden betragen 698000 Rthl. Mit General v. Köckritz will er vom König Tresorscheine zu ihrer Tilgung erbitten, betrieben durch Hoff Fiscal Pochammer, für den er eilig eine Vollmacht erbittet. Glenck wisse nichts von der Prusimska-Sache; ihm sagte er für den Rückkauf seiner Gründe 8000 Rthl sub spe rati zu. Für die 30000 Rthl sieht er noch keinen Weg.
oe1bu9454-179a: 'Abschriften zu einem Entschuldungsplan für Zagórów und Trąbczyn: Kammerübersicht mit reinem Jahresertrag von 40260 Rthl, darunter Honrichs für Vorwerk Trąbczyn 3000 Rthl und Radzinski auf Szetlewek 1500 Rthl; Passiva des Fürsten von 698784 Rthl, darunter Lichnowski auf Trąbczyn 42000 Rthl und eine Protestation der Prusimska 8333 Rthl; Eingabeentwurf v. Triebenfelds an den König um 698000 Rthl in Tresorscheinen mit Amortisationsfonds von 34000 Rthl jährlich, unter Hinweis auf 16 neue Dörfer und 500 Familien.'
oe1bu9454-180: Triebenfeld antwortet, die Forderung des Juden Nathan Liepmann stehe schon in der Designation der Passiva; alle Creditoren sollen befriedigt werden. Auf die Dismembrationsgelder von an 60000 Rthl könne er nicht schnell rechnen und müsse weiter borgen. Nach Ende der Pszczewer Sache sollen die Leute 2000 Rthl, Raven 1200 Rthl Laudemien zahlen; weigert Raven sich, sollen die Gemeinden das Gut zurückfordern. Pochammer soll am 11. bei Beyme über das Anlehn sprechen; die Taxen gehen zurück nach Kalisz.
oe1bu9454-182: Triebenfeld bittet dringend um die vergessene Vollmacht für Hof Fiscal Pochammer, um Blanquets und gerichtlich attestierte Blankovollmachten. Ohne sie kann er seit Wochen nichts tun. An Beyme und Minister v. Voss hat er im Namen des Fürsten geschrieben und Pochammer empfohlen. Er will Faudel, Haugwitz und Graf von Keller aufsuchen. Er klagt über den faulen Amelang und über Grattenauer, der Titel und Zeugnisse will und nach dem, was Triebenfeld hört, Justiz Rath werden will, und schlägt eine abweisende Antwort vor.
oe1bu9454-183: Berichtet über ein Pasquill mit dem Titel „Preußischer Charaktüre“, das den Fürsten scharf angreift und auch Triebenfeld nennt. Darin heißt es, der Fürst brauche viel Geld und Triebenfeld bereichere sich an dessen Sachen, ein intriganter Mensch, der sich vom Bedienten emporgearbeitet habe. Das Buch wollte er mitschicken, die französische Behörde ließ es aber konfiszieren. Als Verfasser gelten Obrist Massenbach und ein hiesiger Professor. Auch Köckritz wird darin angegriffen.
oe1bu9454-184: 'Hahn schickt die anliegenden Blanquets nach, die beim Abgang der Estaffette vergessen worden waren, und bittet um Nachsicht. Er klagt über traurige Erfahrungen im Herrendienst: Die alten Ingelfingischen Diener würden über den neueren vergessen, die man ohne Verdienst glücklich mache. Er will sich aus eigener Kraft loswinden und vertraut darauf, dass Triebenfeld von diesem Ausbruch keinen Gebrauch macht.'
oe1bu9454-185: Triebenfeld wartet dringend auf die erbetenen Vollmachten und Blanquets, ohne die er nichts ausrichten kann. Er fürchtet, die Verzögerung wecke Misstrauen bei den Verhandlungspartnern. Er bittet erneut um eine Vollmacht für Hof Fiscal Pochammer, 2 gerichtlich attestierte Blankovollmachten und einige Blanquets. Gegen die Eingriffe Württembergs in die fürstlichen Staaten verspricht man in Berlin Hilfe, doch er zweifelt an der Aufrichtigkeit. Er will vielleicht nach Öhringen kommen.
oe1bu9454-186: Der Schreiber meldet, die Sache mit Weigelt sei so gut wie abgemacht. Weigelt habe seine Zusage geschickt, und er habe ihn für morgen zu sich nach Świniary gebeten. Um den alten Herrn gut zu bewirten, was dem Wohl des Fürsten diene, bittet er den Freund um eine Flasche guten alten süßen Ungarischen Ausbruch, 6 Pfirsiche und 2 Weintrauben. Wein und Früchte sollen notfalls herausgeschickt werden.
oe1bu9454-187: Die Vollmachten und Blanquets sind eingegangen. Der Gros Kanzler soll 90000 Rthl aus dem Justiz Fond geben, womit Weigel, die Schlabrendorff und Lichnowski bezahlt werden; der Fürst soll die gewünschten 30000 Rthl erhalten. Der Hypothekenschein der Güter Zagórów und Trąbczyn ist so belastet, dass man nicht weiter borgen will. Triebenfeld will Oppenheimer loswerden, um die Hypothek von 250000 Rthl zurückzubekommen. Er will nach Pszczew wegen der Klage Meyer Bernhards, dann nach Kalisz und Trąbczyn, um Geld einzutreiben.
oe1bu9454-188: Triebenfeld meldet, dass der Gros Kanzler aus dem Justiz Fond an 176000 Rthl gibt, womit die lästigen Gläubiger, besonders Weigel, bezahlt werden; die bei Oppenheimer versetzte Hypothek von 200000 Rthl will er auslösen. In Pszczew hat er alles geordnet, Eichaust ist befriedigt. Er reist nach Kalisz und Trąbczyn, um Geld für Fürth einzutreiben; dort stehen an 102000 Rthl aus (Pächter, Einstandsgelder, Zinsen, Wrąbczyn, Swięcia, Olesnica). Schenck soll beitreiben. Klagt über Grattenauer, der nichts tue und dem Minister diene.
oe1bu9454-189: Hahn meldet, dass er nach dem Tod des Bergrath Bernhardi den Befehl erhielt, nach Oberschlesien zu reisen und die Angelegenheiten der Herrschaft Koszęcin mit Inspector Krenig und Forstmeister Reichmann zu regeln. Nach vernehmen sei dort nicht alles in Ordnung. Er bittet um Erlaubnis, v. Triebenfeld in Trąbczyn zu besuchen, bevor er über Wrocław ins Reich zurückkehrt. Beim Fürsten hat er ebenfalls darum nachgesucht. Er erbittet einige Zeilen nach Koszęcin.
oe1bu9454-190: Hahn übersendet im Auftrag des Fürsten eine Charta blanche und einen Auszug aus Glencks Schreiben vom 22. März 1806. Der Fürst will Glenck noch einmal retten und fordert Triebenfeld auf, ebenso zu handeln und ihm das Schema zum Consens zu schicken. Lehnt Glenck die Bedingungen erneut ab, soll man ihn seinem Verderben überlassen. Glenck klagt über Not wegen der Wrąbczyner Güter, hat Wilhelmsruh vor der Subhastation gerettet und will mit dem Consens Ribbeck aus dem Kauf von Wrąbczyn bringen.
oe1bu9454-191: Ein Executions Decret aus Posen verlangte für die Prusimska an 22000 Rthl; in Kalisz gewann er mit Dokumenten von Rapacki Zeit. Bauern hatten angewiesene Gründe verlassen, alte besät und deutsche Colonisten verjagt; er ließ Wortführer mit dem Kantschu schlagen und die Gründe abgrenzen. Die Pachtverträge von Honrichs, v. Zglinski und dem Pächter von Kopojno wurden aufgehoben oder auf ein Jahr verkürzt; Vorwerke sollen zu 600 Rthl je Hufe dismembriert werden. Glenck rede mit einem Pasquill Käufer ab.
oe1bu9454-192: 'Der Schreiber berichtet krank aus dem Bett: In Berlin seien 360000 Rthl zugesagt. Er habe die aufgehetzten Bauern beruhigt und die Pächter verjagt. Glenck wiegle mit den Olesnicaer Leuten die Menschen auf, weise Käufer ab und verbreite ein Pasquill unter kaufwilligen Kolonisten. Der Fürst habe bereits 10000 Rthl von Swięcia, 10000 Rthl von Olesnica und 12000 Rthl von Szetlewek erhalten. Das Urteil zur Olesnicaer Erbverpachtung verbietet die Exmittierung; der Schreiber will nun den Konsens beantragen.'
oe1bu9454-193: 'Das Schreiben des Fürsten kam erst nach 10 Tagen an, daher scheitert der Reiseplan. Triebenfeld rät von einer Reise nach Parchwitz ab. Er will noch im April vor Berlin nach Sławięcice kommen, um den Willen des Fürsten zu erfahren. Die polnischen Güter: Die Dąbska zahlt alle Kosten. Prefect Garczynski lässt Honrichs verhaften, der über 10000 Rthl schuldet. Triebenfeld erhielt 600 Rthl von ihm zurück. Die Rückstände sollen rasch bezahlt, die Güter frei zurückgegeben werden.'
oe1bu9454-194: Beim Friedensgericht ist die Vindication der Trąbczyner Güter sehr vorteilhaft ausgefallen, die Sache ist an das Tribunal in Kalisz verwiesen. Der König von Sachsen soll einen Indult auf 10 Jahre geben. Die Invaliden Casse verlangt von Triebenfeld das ganze Capital und hat geklagt, Termin am 26ten. Er hat die Prefectur gebeten, Honrichs zu suspendieren und die 11700 Rthl für die rückständigen Zinsen zu verwenden. Podprefect Brzechffa habe für Honrichs Caution geleistet und falsche Atteste gegeben.
oe1bu9454-195: 'Triebenfeld wartet in Breslau auf Graf Strachwitz, der am 23. eintreffen soll. Es geht um ein Geschäft über Güter bei Głubczyce, deren Wert mit 900000 Rthl angegeben wird. Flesch tadelt Goldstücker, weil er den Namen des Grafen genannt hat, und mahnt zur Verschwiegenheit. Triebenfeld vermutet eine Schwindelei. Er meldet Gerüchte: Der König soll die Contribution rasch zahlen, sonst rückten die Franzosen ein. Napoleon verlange 20000 Mann gegen die Türken. Hardenberg kehre zurück. Das Moratorium ist auf 2 Jahre verlängert.'
oe1bu9454-196: 'Triebenfeld ist aus Breslau geflohen: Lahr, dem er 1500 Rthl schuldet, ließ trotz zugesagter Frist bis Michaeli durch seinen Mandatarius Ludwig heimlich einen Haftbefehl erwirken. Er muss seine Mühle zum halben Preis verkaufen. Er verdächtigt Flesch und Consorten und hält dessen Tauschhandel für Schwindel, will aber die Vindication der Trąbczyner Güter weiter betreiben. Die Holländische Anleihe ist gescheitert. Der Fürst soll unter Berufung auf Bergers Zeugnis an die Liquidations Commission in Berlin schreiben.'
oe1bu9454-197: 'Triebenfeld berichtet, dass General Köckritz van der Lahr laut Richter derb zur Ruhe verwiesen habe; Lahr wolle nun warten. Köckritz solle zudem Geduld wegen der Zinsen an die Invaliden Casse erwirken. Triebenfeld will die Angelegenheiten in Kalisz einleiten, dann nach Wrocław zurück, und drängt Goldstucker und Flesch zum Tauschhandel. Ober Amtmann Hegener soll alles in Zagórów revidieren. Die Trąbczyner Sache würde er energisch betreiben. Nachschrift: Laut Tesmar weiß Lahr von nichts; Triebenfeld vermutet eine Büberei von Flesch und Consorten.'
oe1bu9454-198: Trąbczyn soll bis spätestens Micheli zurückkommen, die Sequestration ist aufgehoben. Die Rechnungen von Honrichs und Frankiewicz, für die Brzechffa bürgt, prüft der Calculator Schneider. Hecker und Hawich sollen die veruntreuten 11700 Rthl beweisen. Hecker darf Administrator werden. Der Pächter Smidkowski will gleich etliche Tausend zahlen, um auf den Gütern zu bleiben. Die Dąbska ist beim König in Warschau mit ihrem Gesuch wegen Trąbczyn abgewiesen worden. Köckritz will die Papiere der Colonnaschen Sache schicken. Hardenberg soll das Schuldenwesen ordnen.
oe1bu9454-199: Triebenfeld legt einen Brief von T. über den König und Köckritz bei. Er geht nicht nach Berlin, will aber Wein und Wildgeflügel an T. schicken, damit beim Abschiedsschmaus manches besprochen wird. T. soll Hardenberg dazu mitnehmen. Dass Hardenberg laut einem Billet des H v M mit dem König komme, bezweifelt er. Er will eilig nach Zagórów, hofft seine Mühle in Świniary für 6000 Rthl zu verkaufen und Rückstände von seinen Untertanen einzuziehen.
oe1bu9454-200: Triebenfeld bedauert, dass die vom Fürsten gesandten Vögel erst nach der Abreise des Generals v. Köckritz eintreffen. Seegebarth soll man auf erhoffte Gelder aus den polnischen Besitzungen vertrösten. Triebenfeld will nach Zagórów reisen. Er bezweifelt, dass Weigel Stössel als Schuldner annimmt, und schlägt Weigel vor, die vom Fürsten in Schlesien anzunehmenden Güter zu erwerben und Stössel zu befriedigen. Er hat angefragt, ob der Fürst sich dem König in Koźle oder anderswo zeigen dürfe.
oe1bu9454-201: Triebenfeld meldet, Weigel wolle die für Zagórów einzuhandelnden Güter (Knobelsdorffsche oder Poninskische) annehmen und dafür seine und Stössels Forderungen abrechnen; am 30. will er in Świniary konferieren. Für Świniary bot ein Käufer 220000 Rthl bar, verlangt werden 250000 Rthl; da nur 90000 Rthl intabuliert sind, blieben 160000 Rthl. Sind Weigel und Stössel befriedigt und gehören Grotowski, Lichnowski, Zerboni u. a. auf Trąbczyn, glaubt er mit 150000 Rthl alle übrigen Schulden zu tilgen. Mahnt, den Plan mit F. August zu betreiben.
oe1bu9454-202: 'Der Schreiber meldet einem Freund, dass Vater Weigel nach einem Besuch zufrieden ist und ihm die ganze Sache überlassen hat. Weigel will die Güter annehmen, die der Fürst einhandelt. Der Schreiber soll ihm alles genau ausarbeiten, damit Weigel es seinem Sohn erklären kann. Weigel lobt ausführlich die Uneigennützigkeit des Schreibers und will ihn öfter besuchen. Nachschrift: Der Schreiber hofft, die 2 Freystellen bald zu verkaufen.'
oe1bu9454-203: v. Triebenfeld übersendet das Weigel übergebene Exposée zum geplanten Tausch der Güter eines v. Knobelsdorff gegen Pohlnische Güter. Laut Fischbach bleiben den Knobelsdorffschen Gütern netto 310000 Rthl; den Zagorower Gütern (Wert etwa 540000 Rthl, Schulden 247000 Rthl) bleiben 293000 Rthl. Fischbach will den Tausch gegen 1 1/2 Prozent vermitteln. Vielleicht übernimmt Knobelsdorff auch die Trąbczyner Güter samt Schulden und führt den Prozess selbst zu Ende. Triebenfeld bittet um Befehl, ob beide nach Sławięcice kommen sollen.
oe1bu9454-204: 'Triebenfeld klagt, das Schreiben des Fürsten an Heyne, er wolle Koszęcin an Weigel oder Stössel abtreten, habe seinen Plan beinahe scheitern lassen. Weigel will die Sache dann ruhen lassen und fragt, ob Stössel die Einzahlungen des Fürsten anrechne. Heyne soll alles wieder ins Geleis bringen. Triebenfeld bittet um aufrichtigen Bescheid und warnt: Bei Rückgabe an Stössel verliere der Fürst alles auf Koszęcin Gegebene. Seine Briefe soll der Fürst niemandem zeigen.'
oe1bu9454-205: 'Triebenfeld betreibt den Tauschhandel: Knobelsdorff steht laut Brief an Fischbach ab dem 11ten für die Reise nach Zagórów bereit, Triebenfeld hat ihn nach Termin und Treffpunkt gefragt. Weigel will, falls Stössel die Bischdorfer Güter nimmt, sich dort eintragen lassen, den Fürsten quittieren und auf Koszęcin alles löschen lassen. Berichtet, Labage solle in Paris Leinwand und Eisen für Kontributionen anbieten, und erwartet steigende Eisenpreise. Warnt den Fürsten vor falschen Freunden.'
oe1bu9454-206: 'Triebenfeld warnt vor Gefahren, rät, von der Regierung nichts zu erwarten, und will notfalls nach Petersburg reisen. Knobelsdorffs Tausch sei sicher. Wegen der 35/m Rthl fehle Eberhards Schema. Scharnhorst sprach in Cosel viel wegen des Fürsten; ein angebotenes Stück Geld soll dieser ablehnen. Am 2. will Triebenfeld nach Polen: Cabanis soll eidlich die zu Zagórów gehörenden Gründe beweisen, alle Contracte sollen vorgelegt werden, jeder Erbpächter und Colonist soll Gezahltes und Rückstände anerkennen, und mit Honrichs soll man sich auseinandersetzen.'
oe1bu9454-207: 'Abschrift eines Pro Memoria, unterzeichnet von Hecker und Honrichs: Die Einleitung des Trąbczyner Prozesses in Kalisz ist besorgt, Termin am 24. Oktober. Der Anwalt sagt günstigen Ausgang zu und erhielt 200 Rthl Vorschuss. Die Sequestration der Güter ist beendet. Mit den Erbpächtern von Oleśnica wird ein Vergleich über 12 Hufen in Erbpacht empfohlen. Die Holländer halten statt 3 fl nur 2 fl pro Morgen für tragbar. v. Triebenfeld meint, Rückstände könnten teilweise erlassen werden; Knobelsdorff wolle lieber Land als Zinsen.'
oe1bu9454-208: 'v. Triebenfeld kann aus Geldmangel noch nicht nach Pohlen reisen. In der Sache Schlieben wurde Arrest auf seine Schweinernschen Pachtgelder gelegt, und man schickte ihm eine Execution über 48 Rthl 6 g Kosten. Triebenfeld bittet den Fürsten, Lombardini zur Zahlung der 48 Rthl 6 g anzuweisen. Außerdem berichtet er Neuigkeiten: Manöver des Königs bei Potsdam und Berlin, Beschlagnahme von Colonialwaaren an der Elbe, Gerüchte über 60000 Franzosen, 30 Verhaftungen in Berlin, mit Kalckreuth fange es an zu hinken.'
oe1bu9454-209: Triebenfeld bestätigt den Eingang der Anweisung. Er will das Geld erheben und sofort abreisen. Aus Zagórów will er dem Fürsten sogleich alles durch einen reitenden Boten melden, der H. v. Knobelsdorff dorthin bringen soll.
oe1bu9454-210: Triebenfeld berichtet über drei Prozesse. Trąbczyn hofft er zu vindizieren und damit 22000 Rthl Brautschatz zu retten. Falz, Präsident Smagorzewski und Assessoren erhielten Zuwendungen. Die Oleśnicer schulden 39270 Rthl, polnische Bauern aus Oleśnica wollen in ihren Contract treten. Niedźwiecki schuldet 6000 Rthl, der Propinationspächter 3000 Rthl. Hawich muss fort. Bis Neujahr erhofft er 44000 Rthl, darunter 12000 Rthl von den alten Hauländern und 6000 Rthl von Radzinski von Szetlewek. Der Fürst soll bei Danckelmann Urlaub für Referendarius Sommer erwirken.
oe1bu9454-211: 'Herr von Knobelsdorff hat die Örtlichkeit besichtigt, sie gefällt ihm. Triebenfeld will nun alles so ordnen, dass man die Sache sofort überblicken kann. Er klagt über große Verwirrung und halsstarrige Leute, die von Hawich gehört werden. Vom Prozess um Trąbczyn erwartet er ein gutes Ende: Der Termin steht seit dem 24. an, bis zur Verlesung des Dekrets des Tribunals kann es noch 14 Tage dauern. Gewinnt er, soll alle Not enden.'
oe1bu9454-212: 'Triebenfeld berichtet nach schwerer Krankheit, dass niemand zahlt und 31 Prozesse schweben. Die Olesnicer, Niedźwiecki aus Kopojno und Hawich aus Drzewce sollen hinausgesetzt, 3 Vorwerke wieder eingerichtet werden. Napoleons Erklärung zur Tilgung der Schulden an Preußen in 40 Jahren verwirrt die Kolonisten; angebotenen Zinsnachlass nehmen sie nicht an. Die Trąbczyner Sache verwies das Tribunal nach Poniatowskis Schreiben an die höhere Magistratur. Die alten Hauländer bieten sofort 40000 Rthl. Anschlag Zagórów: 22140 Rthl Jahresertrag, 7140 Rthl Überschuss ab Johanni.'
oe1bu9454-213: Triebenfeld meldet, die Staatsabgaben seien bis auf 900 Rthl bezahlt; er hofft, die Sequestration bald aufzuheben. Weil niemand zahlt, führt er 43 Prozesse, u. a. gegen Niedźwiecki (6000 Rthl), Nossalski (3000 Rthl), die Olesnicer (circa 33000 Rthl), die Wrąbczyner Bauern und in 29 Fällen gegen Colonisten mit 39000 Rthl Zinsrückständen. Die Prozesskosten betragen 1450 Rthl, davon 750 Rthl für den Trąbczyner und den Meierowitzschen Prozess. Hardenberg verlangt Beweise über den neuen Arrest auf die aus Preußen nach Polen gegebenen Summen.
oe1bu9454-214: 'Triebenfeld meldet den bestätigten Transact: Bank- und Invalidenschulden sollen in 41 ¾ Jahren mit 6 pct. bezahlt werden. Für Privatschulden und Weigel stellt der Minister ein gleiches Moratorium in Aussicht. Die Erbpächter zahlen nichts, er erwartet die Kassierung ihrer Contracte und will Vorwerke anlegen. Die Prozesse um Oleśnica und Wrąbczyn schweben, mit Swięcia steht es ebenso. Hecker und Hawich wiegeln die Leute auf, Hecker soll noch 2500 Rthl herauszahlen. Am 28. will er nach Berlin reisen.'
oe1bu9454-215: Triebenfeld bestätigt 1000 Rthl über Bally. Hawich und Hecker sollen entlassen werden. Er drängt nach Anweisung von 5100 Rthl Zinsen auf Aufhebung der Sequestration von Zagórów. Die Dąbska habe Trąbczyn ohne Urteil in Besitz genommen, ihre Eintragung ins Hypothekenbuch sei abgewiesen; er betreibt die Vindikation von Trąbczyn und Kamionna. Von Honrichs, Hawich und Hecker angeeignete Gründe sollen zurück und mit Colonisten besetzt werden; den Colonisten der Herrschaft Zagórów soll dieses Jahr ein Drittel der Zinsen erlassen werden.
oe1bu9454-216: Triebenfeld erwartet, dass Privatschulden und Bayonner Summen (Bank-, Invaliden- und Pupillengelder) einem Moratorium von 41 3/4 Jahren unterworfen werden; 200000 Rthl auf den Gütern würden so mit 6 pCt. amortisiert. Er verlangt dringend Entscheidung, ob der Fürst die Güter behält oder vertauscht; beim Behalten will er die Hauländer gerichtlich vertreiben und Vorwerke bilden. Er bittet um Vollmacht für Advocat Schmid in Kalisz gegen Hecker, der mit Hawich die Unterthanen aufwiegelt, und um einen Brief an Hecker.
oe1bu9454-217: Von Sanitz fragt, ob das erste Tribunal über die Trąbczyner Güter des Fürsten schon entschieden hat, und bittet möglichst um Abschriften des Friedensrichter-Urteils und der Tribunalsentenz. Er ist nach Berlin gezogen, um Reste seines verlorenen Vermögens zu retten. Sein früherer Posener Sachwalter Weltzer hat wenig Hoffnung. Vom sächsischen Hof hört er, Polnische Commissarien hätten auf eine Bittschrift von Dąbska befohlen, ihr die Güter zurückzugeben. Man vermute einen baldigen Krieg im Norden.
oe1bu9454-218: Triebenfeld schlägt vor, die Güter von Zagórów gegen Skorogoszcz des Grafen Wartensleben zu tauschen; Stössel und Weigel sollen Skorogoszcz und eine Hypothek von 207625 Rthl übernehmen. Notfalls will er Blizanów an Wartenslebens ältesten Sohn vertauschen und eine Hypothek von 30000 Rthl auf Konotop beisteuern. Er bittet um schnelle, geheime Antwort, da Wartensleben mit Gumperts verhandelt. Er will die Prozesse mit Oleśnica und Wrąbczyn gewinnen, empfiehlt Heuthausen für die Reste in Pszczew (an 20000 Rthl) und meldet Arreste auf Świniary.
oe1bu9454-219: Triebenfeld bittet dringend um Entscheidung über den eingesandten Plan, da ein Medicinal Rath aus Kalisz bereits mit dem alten Graf Wartensleben verhandelt. Der Vorteil sei klar, wenn Weigel und Stössel dadurch befriedigt würden. Bei Zustimmung will er nach Nysa reisen und sein Blizanów mit dem älteren Sohn Wartenslebens tauschen, um die Gläubiger zu befriedigen. Er klagt über steigende Abgaben und wachsende Not und fürchtet Mord und Aufruhr. Bei Präsident Dierschlag sei nachgefragt worden, ob er Güter gekauft habe.
oe1bu9454-220: Triebenfeld kam beim alten Grafen Wartensleben in Nysa zu spät, der über Skorogoszcz schon mit einem Kaufmann aus Kalisz abgeschlossen hat. Er schlägt die Güter von Wołczyn des jungen Wartensleben vor (Forderung 200000 Rthl, Schulden 120000 Rthl). Weigel und Stössel sollen diese Güter samt der Hypothek auf Zagórów übernehmen und dem Fürsten über 350000 Rthl quittieren. Koszęcin könnte als Majorat für Prinz Alexander genommen werden.
oe1bu9454-221: Die befohlenen 18000 Rthl aus den Zagórówer Gütern kann Triebenfeld nicht senden, bevor zwei Prozesse gewonnen sind. Er hofft, die Weihnachtszinsen zu zahlen, damit das Moratorium gilt. Den Verkauf Zagórów an Stössel hat er über Graf Leopold v Wartensleben eingeleitet. Stössel verlangt laut Wartensleben, dass Rusinowice mitgenommen wird. Blizanów will Triebenfeld vielleicht gegen die Pilaer Güter tauschen, Weigel und Stössel abfinden (Gesamtrechnung 470000 Rthl) und so Koszęcin retten. Wołczyn und Skorogoszcz lehnt er ab.
oe1bu9454-222: Triebenfeld meldet, dass Baron Stössel die Güter von Zagórów nach seinem Plan für seine Forderungen annehmen will, und bittet dringend um Antwort, ob der Fürst die Sache so mit Stössel und Weigel abgemacht wissen will. Stössel verlangt ein Schreiben des Fürsten; Graf Wartensleben rät, darin zu erklären, wegen des Testaments der Schwiegermutter könne Koszęcin nicht bezahlt werden, daher gebe er Zagórów, dem Triebenfeld die Güter von Blizanów zufügen wolle. Köckritz ruft Triebenfeld nach Berlin.
oe1bu9454-223: Der Fürst berichtet über ein Tauschangebot des Generals v Schimmelpfennig, der die Zagorower Güter gegen seine Güter Szelce und Maderzewo bei Mysłowice eintauschen will (Ertrag 8000 Rthl, nach anderen 6000 Rthl). Lieutenant Sommer soll die Besichtigung in Zagórów vorbereiten. Einen Abschluss mit Weigel bezweifelt er. Er braucht bis Weihnachten dringend Bargeld, fragt nach dem Trąbczyner Prozess nicht mehr und erlaubt, Trąbczyn vorteilhaft in einen Handel einzubeziehen. Einem Werber aus Hohenlohe-Kirchberg gab er seine Zustimmung zur Heirat mit Adele.
oe1bu9454-224: 'Der Schreiber verhandelt über den Verkauf der Zagórówer Güter an General Schimmelpfennig, der sie für 200/m Rthl erhalten will. Dessen Schwiegersöhne Rittmeister von Kotzow und v. Johnston sollen die Güter mit Lieutenant Sommer besichtigen. Zahlungsplan: Güter Seliz und Modzewo für 110/m, das Gut Goła Wieś, 66000 Rthl in Pfandbriefen al pari, Rest bar oder in schlesischen Pfandbriefen. Der Verkauf an Weigel und Stössel ist laut Rittmeister v Stössel auf Rusinowice gescheitert. Der Adressat soll die Prozesse beenden.'
oe1bu9454-226: 'Triebenfeld hält den Tauschplan mit General Schimmelpfennig für gescheitert oder durch Hindernisse aufgehalten, da weder Sommer noch der General eingetroffen sind. Er übersendet ein Schreiben des Grafen Wartensleben: Es komme lediglich auf ein Schreiben des Fürsten an Stössel an, wonach Stössel und Weigel nur durch die Güter im Herzogtum Warschau befriedigt werden könnten. Der Prefect verlangt die Originalurkunde über Zagórów, sonst droht die Konfiskation. Er fragt, ob der Prozess um die Trąbczyner Güter fortgesetzt werden soll.'
oe1bu9454-227: Triebenfeld übersendet das Angebot des Unterpräfecten von Brzechffa, die Herrschaft Zagórów 6 Jahre für jährlich 20,000-25,000 Rthl zu pachten und die 3 Vorwerke für 3000 Rthl instand zu setzen. Triebenfeld rät zum Vertrag, da er Abgaben und Zinsen, darunter 1250 Rthl an die Invaliden Casse, nicht aufbringen kann und neue Sequestration droht. Er bittet um Entscheidung zwischen einem Handel mit General von Schimmelpfennig und der Pacht mit anschließendem Vergleich mit Weigel und Stössel zur Freimachung von Koszęcin.
oe1bu9454-228: Das von Sommer unterzeichnete Promemoria berichtet über seine Sendung zu General Schimmelpfennig v der Oye. Der General ist weiter bereit, den geplanten Tausch mit den Zagórówer Gütern einzugehen. Verzögert haben ihn seine Krankheit und die schwierigen Verhandlungen seines Sohnes, des Rittmeisters, mit Stägemann in Berlin über die herauszugebenden Gelder. Diese stehen durch Vermittlung des sächsischen Gesandten nun günstiger. Weil im Winter keine Besichtigung der Güter möglich ist, bittet der General, die Sache bis zum Frühjahr auszusetzen.
oe1bu9454-229: Triebenfeld übermittelt Geburtstagswünsche. Er meldet den Dank des Generalprokurators Graf Lipski, des Tribunalspräsidenten Smogorzewski und der Tribunalsräte für das Wildpret; die Wirkung erwartet er bei der Entscheidung der Olesnicer und Wrąbczyner Sache. Mit Brzechffa hat er vorbehaltlich der Genehmigung den Pachtvertrag über die Zagórówer Güter auf 20000 Rthl geschlossen. Am 8. Februar will er mit ihm in Sławięcice eintreffen. Die Zinsen seien gesichert, das Bayonner Kapital werde getilgt. Die eingereichten Urkunden hätten jeden Streit beseitigt, vielleicht würden die Abgaben gemildert.
oe1bu9454-230: Der Fürst beklagt, dass Triebenfeld den selbst gesetzten Termin des 8. versäumt hat, mit Brzechffa zu ihm zu kommen. Da er aus den Gütern nichts bezieht, will er das Kaufinteresse des Generals von Schimmelpfennig an Zagórów nutzen, der Anfang März besichtigen will. Er verlangt bestimmte Antwort und Geldhilfe. Gegen die Verpachtung an Brzechffa hat er nichts, drängt aber auf Eile, da er beim König eine Kommission zur Regelung seiner Schulden erbeten hat.
oe1bu9454-231: Weigel bittet v. Triebenfeld, einen Tag für ein Treffen in Kalisz oder an einem anderen Ort seiner Wahl zu bestimmen. Dort will er die Angelegenheiten zwischen dem Fürsten v. Hohenlohe und sich besprechen und beraten. Vor einigen Wochen war er in eigenen Geschäften in Kalisz und hatte gehofft, v. Triebenfeld dort zu sehen. Dessen Aufenthaltsort konnte er aber nicht sicher erfahren. Er bittet um baldige Antwort.
oe1bu9454-232: Triebenfeld, seit Wochen krank und ohne Geld für einen Arzt, berichtet von Schikanen um die Verpachtung; Brzechffa habe erklärt, zu Johanni zu zahlen. Mit Brzechffa will er nach Warszawa, um die Trąbczyner und Wrąbczyner Sache zu betreiben. Er bittet eilig um eine gerichtlich ausgestellte Erklärung, die ihm 3125 Rthl, mit Zinsen und Kosten 4219 Rthl, aus den Zinsen von Swięcia, Wrąbczyn, Alt Olesnica, Skokum, Sophienthal, Kopojno und Adelow anweist. Getreide, Vieh und Futter seien weggenommen, die Not sei groß.
oe1bu9454-233: 'Schlägt Pläne zur Tilgung der Schulden vor: v. Sobottendorff, dem der Fürst 40000 Rthl schuldet, soll Drzewce 18 Jahre für jährlich 2000 Rthl pachten; seine beiden Söhne sollen 4 freie Colonistenstellen in Swięcia zu je 1000 Rthl erhalten. Weigel soll für seine 50000 Rthl das Vorwerk Kopojno mit Propination 9 Jahre für jährlich 6000 Rthl pachten. Fürst August soll 50000 Rthl an die Invaliden Casse zahlen. Cabanis legt vor Chomanowski Rechnung und bringt sie nach Sławięcice.'
oe1bu9454-234: 'Triebenfeld hat einen Eilboten nach Wrocław geschickt, damit Weigel schnell kommt. Gelingt sein Plan mit Weigel, sei der Fürst eine Schuldpost von etwa 54000 Rt los. Hindernis ist die Invaliden Casse: Sie fordert rund 9000 Rt rückständige Zinsen und hat Arrest auf alle Zinsen gelegt. Triebenfeld will beim König erwirken, dass das Kapital von 50000 Rt aus dem Sackenschen Nachlass an die Casse gezahlt wird, und empfiehlt dafür die Mithilfe von Fürst August.'
oe1bu9454-235: 'Triebenfeld meldet, der alte Weigel wolle den Pachtvertrag schließen und sei auf seinen Rat nicht abgeneigt, die Zagorower Güter zu kaufen: Er übernehme die Schulden und zahle 200000 Rthl zu, die er auf Koszęcin anrechnen wolle. Weigel rät, die Sache geheim zu halten und Koszęcin versteigern zu lassen. Er würde es per Revers dem Fürsten abtreten und glaubt, es sei unter 600000 Rthl zu erhalten. Triebenfeld bittet um geheime Weisung und um eilige Zusendung der Papiere.'
oe1bu9454-236: Weigel hat Triebenfeld seine gesamten Sachen mit dem Fürsten übergeben. Nach seiner Genesung soll Triebenfeld mit ihm zum Fürsten reisen. Weigels Offerten hält er für vorteilhaft. Weigel will kaufen, daher ist der Pachtvertrag aufgeschoben. Triebenfeld wartet auf die Papiere und bittet, den beiliegenden Brief an den Prefecten unterschrieben per Expressen zurückzuschicken. Sobottendorff könne beruhigt sein, Honrichs sei ein Bösewicht. Cosmar habe seinem Sohn versichert, kein Gläubiger des Fürsten erhalte je einen Groschen.
oe1bu9454-237: Triebenfeld bittet, ihm das Schreiben des Fürsten postlagernd nach Dresden zu senden; mit dem Schreiben an den Kaiser erhalte er Trąbczyn und Kamionna gewiss zurück. Er reist nach Dresden ab, da sein ältester Sohn in Naumburg durch beide Schenkel geschossen liegt. Amtmann König gab seinen letzten Brief in Syców zur Post, statt ihn nach Sławięcice zu schicken. Trzciński, Zerboni und Meierowitz bieten nur Ausflüchte, nur gegen Meierowitz läuft die Execution. Radke kann wegen 80000 Russen nicht abkommen.
oe1bu9454-238: Hohenlohe klagt, dass Trzciński nichts gezahlt und Zerboni seine Verbindlichkeiten nicht erfüllt habe. Herr Weigelt dränge ihn, er will ihn mit Trzcińskis Wechseln beruhigen. Ein früherer Brief Triebenfelds sei wohl beim Brand des Posthauses in Wartenberg verloren. Er legt ein offenes Schreiben an den russischen Kaiser zum Gebrauch bei. König, Staats Kanzler und Justiz Minister verweigerten ihm Hilfe beim Vergleich mit den Gläubigern zu Brieg. Er hofft, von Meierowitz etwas zu erhalten, und fragt nach Ratke.
oe1bu9454-239: Wegen seines Podagras verspätet in Nysa angekommen, berichtet Triebenfeld, der König sei nach drei Tagen Richtung Teplitz abgereist, wo der russische Kaiser bei seiner Schwester sei; dass Kaiser Franz komme, werde bezweifelt. Österreich wolle neutral bleiben. Napoleon sei nach Paris geeilt. Die Regierung gehe nach Ząbkowice Śląskie. Triebenfeld will zu General Ortel nach Neustadt, sein Plan habe Beifall. Briefe für Frau v. Hahn und Ober Forst Meister v Kleist seien besorgt.
oe1bu9454-240: Triebenfeld berichtet, Österreich wolle neutral bleiben und nur vermitteln. Russische Truppen und Generäle murrten über den Waffenstillstand. Köckritz habe sich mit Hardenberg überworfen und vor dem Monarchen dessen Zuversicht verspottet. Die Verpflegung sei ungewiss, Getreide knapp, die Wege grundlos. Zastrow soll die Landwehr in Nysa (55000 Mann) kommandieren, Ortel liege krank. Triebenfeld will über Nysa nach Ząbkowice Śląskie, in die Hauptquartiere und nach Świniary reisen, um Produkte heranzubringen und Geld zu beschaffen.
oe1bu9454-241: Triebenfeld hat General Gneisenau in Neisse das Schreiben des Fürsten übergeben. Gneisenau will antworten und lässt ausrichten, der Fürst solle ruhig sein, es werde besser werden. Gneisenau führt jetzt die schlesische Landwehr und ist Chef des Generalstabs. Köckritz hat Zastrow umgestimmt, der jetzt warm vom Fürsten spricht. Hardenberg ist mit dem russischen Kaiser in Böhmen und kehrt in 5 Tagen zurück. Für Triebenfelds Plan zur Verpflegung aus Polen sprechen sich alle aus.
oe1bu9454-242: v. Triebenfeld berichtet aus Wien, der Kongress sei bis 1. November ausgesetzt und Frankreich sträube sich gegen die sächsische und polnische Erwerbung, Hardenberg bleibe aber fest. Die württembergischen Angelegenheiten gingen gut. Seinen Plan zu Sławięcice hat er nach Beratung mit Barbe Hardenberg eingereicht, er wurde gutgeheißen. Koszęcin muss warten, bis die Curische Sache gelungen ist. Zu Kolno, Kamionna und Trąbczyn werde vor der Entscheidung über Polens Schicksal nichts bestimmt. Die Miączyńska geborene Prusimska habe große Freunde.
oe1bu9454-243: Triebenfeld bittet wegen der schrecklichen Teuerung in Wien um 300 Rthl in Gold, sonst müsse er am 23. abreisen. Für umgetauschte 400 Rthl erhielt er 1200 fl. Wiener Einlösungsscheine, von denen er 392 fl ausgab. Er rechnet mit täglich 50 fl. W.W. oder 15 Rthl und 260 fl. für die Rückreise. Er könne nur noch 10 Tage leben, die Sache solle aber noch mindestens 5 Wochen dauern. Er wohnt in der Goldenen Ente, Schulerstraße.
oe1bu9454-244: 'Berichtet vom Wiener Kongress: Der Kayser, der König und Großfürst Constantin erhielten österreichische Regimenter. Reichsfürsten und Stände baten Metternich, den Kaiser von Österreich wieder als Oberhaupt einzusetzen. Über Polen ist nichts bestimmt, Humboldt wirkt bestens. Triebenfeld verbürgt dem Fürsten ein ruhiges Leben in Sławięcice, erwartet dringend dessen Schreiben und fragt, ob jemand wegen Cosmar und des Transacts von 1811 nach Brzeg gesandt werden soll.'
oe1bu9454-245: Eingabe an Staats Kanzler Hardenberg für den notleidenden Fürsten Hohenlohe, teils unleserlich. Medizinalrat Cosmar beherrsche als Testamentsvollstrecker der Fürstin Sacken die Majoratsgüter Sławięcice, Lasowice und Oppurg (79500 Rthl Ertrag). Er stütze sich auf einen Transact von 1811, zahle nichts und lege keine Rechnung. Die Curischen Erben wollen für 426000 Rthl 112000 nehmen. Erbeten werden ein Vorschuss von 112000 Rthl, Aufhebung des Transacts, Absetzung Cosmars und ein Bericht des Oberlandesgerichts Brzeg. Triebenfeld bietet 60000 Rthl Kaution.
oe1bu9454-246: 'In der Sache der polnischen Güter soll v. Triebenfeld ruhig bleiben, bis über Polen entschieden ist. Fällt der Bezirk der Trąbczyner Güter an Russland, werde der Fürst Kanzler sich beim Kaiser für den Fürsten einsetzen. Eine Eingabe hat er nach zweimaliger Änderung eingereicht. In der Koszęciner Sache ist noch nichts Wesentliches geschehen. Kongressnachrichten: Sachsen fällt ganz an Preußen, über Polen ist nichts entschieden. Zerboni erhielt den Roten Adlerorden. Er legt eine Broschüre Gärtners bei.'
oe1bu9454-247: 'Triebenfeld meldet, Polens Schicksal sei günstig entschieden; nun kämen die Reichsangelegenheiten, wozu er die Eingabe des Geh. Rath Goerch für das Gesamthaus Hohenlohe abschriftlich schickt. Humboldt versprach Unterstützung. Der Staats Kanzler erklärte, das Geld solle gegeben werden, die Aufhebung des von Cosmar betriebenen Transacts werde aber Lärm geben. Die Curischen Erben seien mit 112/m Rthl, die übrigen Creditoren mit 12000 Rthl jährlich zu befriedigen. Beiliegende Rechnung: Ertrag 79500 Rthl, Ausgaben 79462 Rthl.'
oe1bu9454-248: Triebenfeld berichtet, dass der Fürst Kanzler den besten Willen hat und Minister v. Humboldt die Sache des Fürsten eifrig betreibt. Die Curischen Erben haben den König um Befriedigung gebeten; der König will die Sache nach seiner Rückkehr erledigen. Graf Winzingerode will für Fürst August 100000 Rthl nach dem Testament der Fürstin Sacken aus den Einkünften von Sławięcice und Lasowice fordern; Triebenfeld entgegnet, sie sei nur lebenslange Besitzerin gewesen. Wegen Warschau ruht die Trąbczyner und Kamionnaer Sache.
oe1bu9454-249: Triebenfeld bestätigt zwei Schreiben des Fürsten. Hoffrath Hahns Aufsatz könne der Eingabe nicht mehr beigefügt werden, da diese schon Seiner Majestät vorliege. Er brauche rasch 12000 Rthl zum Abschluss mit den Bevollmächtigten; danach würden 100000 Rthl in Berlin angewiesen. Humboldts Wohlwollen belege die Beilage. Gärtner soll dem Kongress eine Schrift zu den hohenlohischen Gravamina übergeben. Göschels Vollmacht soll der Fürst ohne Namen ausfertigen; Triebenfeld will Göschel oder Gärtner eintragen.
oe1bu9454-250: Humboldt bestätigt den Empfang von Triebenfelds Schreiben vom 3. des Monats, das ihn über das dem Fürsten v. Hardenberg übergebene Memorial unterrichtet hat. Er sendet die ihm überlassene Abschrift zurück und sagt zu, sich für dessen Inhalt einzusetzen, soweit es in seinem Wirkungskreis liegt. Das Schreiben liegt als Beilage dem Brief vom 17. November bei.
oe1bu9454-251: 'Triebenfeld legt ein Gutachten vor, das der Fürst zu Hohenlohe aus den Akten des Brieger Oberlandesgerichts anfertigen ließ. Er bittet um die schriftliche Hoffnung, dass 112/m Rthl zur Abfindung der C. Erben vorgeschossen werden, damit der Fürst den Vergleich mit deren Mandatarien schließen kann. Transakt und Codizill von 1811 seien von Cosmar geschmiedet. Der Fürst ist an 66 Jahre alt, jede Verzögerung sei daher gefährlich: Der Monarch könnte 461000 Rthl einschließlich 35000 Rthl verlieren.'
oe1bu9454-252: Hardenberg antwortet auf Triebenfelds Gesuch vom 25. des Vormonats. Die Ansprüche des Fürsten von Hohenlohe auf Trąbczyn und Kamionna würden sich von selbst ausgleichen, sobald die im Werk begriffene allgemeine Auseinandersetzung und Übereinkunft wegen des Herzogtums Warschau ausgeführt werde.
oe1bu9454-253: Zu Trąbczyn und Kamionna erhielt Triebenfeld auf Nachfrage nur einen kurzen Bescheid (beigelegt). Er schließt daraus, dass die Sache in der großen allgemeinen Regelung mit erledigt wird. Hoffrath Hahns Gutachten übergab er dem Staats Kanzler, der darin nichts Neues sah. Die Herzogin von Sagan will Geld auf Żagań aufnehmen und verpfändet dafür die königliche Schuld, die für Fürst Hohenlohe garantierte Summa. Der König hat dies vertagt. Triebenfeld will eine schriftliche Zusicherung, um mit den Curischen Mandatarien abzuschließen.
oe1bu9454-254: 'Triebenfeld klagt, dass er ohne Antwort und Geld bleibt, und fordert Mittel. Für 4-5 Wochen habe er 1400 Rthl verlangt, aber nur 640 Rthl erhalten. Binnen 14 Tagen brauche er noch 600 Rthl oder 200 #. Er verspricht die Rückgabe der polnischen Güter, die Tilgung der Curischen Schuld von 461000 Rthl und die Befreiung aus den Koszęciner Banden. Über den Verkauf von Koszęcin soll der Fürst schweigen. Beilagen: zwei Quittungen und die Bitte, 200 Rthl an seine Tochter zu senden.'
oe1bu9454-255: Triebenfeld berichtet, dass Staatskanzler Hardenberg seit fünf Tagen krank liegt; ohne ihn blieben die Angelegenheiten des Fürsten liegen. Hardenberg habe diese an sich gezogen, Minister Humboldt spreche von gewonnenem Spiel, Hoffrath Hahns Gutachten habe gewirkt. Vorrangig seien die Beendigung der Curischen Sache, Cosmars Sturz und der Besitz der Güter als Majoratsherr. Laut einer erhaltenen Nachricht reise der König von Preußen am 8ten Dezember nach Berlin; Triebenfeld will sich am 11ten persönlich einfinden und bittet, keine Briefe mehr zu senden.
oe1bu9454-256: Triebenfeld berichtet, dass der Befehl nach Berlin an Kircheisen und Finanzminister v. Bulow abgehen soll, eine Kommission zur Untersuchung von Cosmars Handeln einzusetzen. Stägemann soll für den Staats Kanzler ein Gutachten erstellen, doch Triebenfeld misstraut ihm als Freund Zerbonis und Cosmars. Abfindung der Curischen Erben und Vorschuss von 112/m Rthl bleiben offen. Er klagt über fehlendes Geld, Akten und Instruktionen (Transact von 1811 unvollständig), erbittet Beweise und Blanquette und Unterstützung seiner Kinder in Wrocław.
oe1bu9454-257: Der Schreiber bezieht sich auf die Vorstellung des Adressaten, wonach sich der Fürst zu Hohenlohe im Transact von 1811 verpflichtet habe, das den Curländischen Erben geschuldete Capital selbst zu bezahlen. Da er die Stelle nicht finden kann, bittet er, sie im beigefügten Transact anzustreichen und ihm das Stück durch den Überbringer zurückzuschicken.
oe1bu9454-258: 'Eingabe v. Triebenfelds an eine ungenannte Durchlaucht in Sachen des Fürsten von Hohenlohe, die zurückgesandt werden soll. Er wendet sich gegen die über Stägemann eröffnete Überweisung an eine Commission in Berlin. Dabei wiederholt er seinen Vorschlag: Die Curischen Erben sähen die Schuld mit 112000 Rthl als getilgt an, der Fürst zahle jährlich 25000 Rthl ab und tilge die 1790 in Wrocław erhobenen 35/m Rthl. Er warnt vor Nachfragen bei Graf Wratislaw, bietet eine Caution von 60000 Rthl an.'
oe1bu9454-259: v. Triebenfeld erwartet stündlich Hardenbergs Resolution, dass das Oberlandesgericht Brzeg die Sache schleunigst untersuchen und berichten soll. Stimmt der Bericht mit seinen Eingaben überein, lasse der Staatskanzler die 112/m Rthl zahlen. Der Fürst soll vor dem Commissarius offen erklären, er sei zum Beitritt verleitet worden, die Transacte schadeten den Creditoren, die Schulden seien fingiert und Cosmar habe alles geschmiedet. Er soll Hoffrath Hahn zu Rate ziehen und auch seinen Sohn nicht schonen. Barbe setzt sich für ihn ein.
oe1bu9454-260: 'Triebenfeld hat die Resolution Hardenbergs und die Verfügung an das Brieger Oberlandesgericht per Estaffette übersandt und setzt auf Hoffrath Hahn. Er gibt die Punkte der fürstlichen Erklärung vor: in Haft zu Transacten und Codizill induziert, Summen größtenteils fingiert, alles von Cosmar betrieben, der den Sohn gegen den Vater aufgebracht habe. Ziel: Aufhebung der Transacte, Überlassung der Güter, Vorschuss von 112/m Rthl. Er bittet um Abschrift, Blanquets und einen Dankbrief an Hardenberg. Nachschrift: bittet dringend um 300 Rthl in Gold.'
oe1bu9454-261: Triebenfeld meldet die feste Zusage zur Wiedererhaltung der polnischen Güter. Für die Trąbczyner Güter soll er eine Berechnung bereithalten, die Schadensberechnung für Kamionna möge Leixner vortragen. Alles hänge von der Erklärung des Fürsten und dem Bericht des Oberlandesgerichts Brzeg ab, die mit seiner Eingabe übereinstimmen müssten. Dann kämen 112000 Rthl zur Bezahlung der Curischen, und Cosmar wäre gestürzt. Er bittet, Hahn wirken zu lassen, und sendet ein Vollmachtsformular für v. Göschel. Laut Gärtner steht die Hohenlohische Sache sehr gut.
oe1bu9454-262: 'Triebenfeld berichtet, Hardenberg habe dem Prinzen Hohenlohe-Bartenstein zugesagt, sich der Sache des Fürsten tätig anzunehmen. Alles hänge nun an der Erklärung des Fürsten und der Bestätigung seiner Memoirs; dann würden die Cur. Erben befriedigt und Cosmar zur Verantwortung gezogen. Ein Dankschreiben an den Staatskanzler soll erwähnen, dass Cosmar nur 2500 Rthl statt 72000 Rthl gegeben habe. Er bittet dringend um 100 #. Nachschrift: regt an, Hardenberg an die über Meyer nach Koblenz gesandten 100/m Fr. d''or zu erinnern.'
oe1bu9454-263: 'Triebenfeld begrüßt, dass Hoffrath Hahn und Lombardini mit Vollmachten nach Brzeg gesandt wurden, und hofft mit Eberhard auf Befriedigung der Curischen Erben. Er warnt jedoch: Der Fürst Kanzler will den Fürsten persönlich vernehmen lassen, in Brzeg oder durch einen Commissarius in Sławięcice, der an ihn berichten soll. Göschel reicht eine weitere Note beim Congress ein. Zu Polen ruht alles bis Congressende. Außerdem berichtet er von der Abreise des Königs von Württemberg.'
oe1bu9454-264: Triebenfeld bittet um strenge Geheimhaltung seines Plans für Koszęcin. Da er gehört hatte, der König dulde keinen Tausch oder Ankauf von Gütern mehr, zog er Hoffrath Barbe ins Vertrauen, der über das angeblich für Fürst Hardenberg verlangte Geschenk von 30000 Rthl empört war. Nun soll Graf Pourtalès, der sich in Schlesien ankaufen will, Koszęcin kaufen; der Fürst erhielte noch 38000 Rthl heraus. Triebenfeld hat Barbe 30000 Rthl zugesagt und bittet um Zusendung des entworfenen Reverses.
oe1bu9454-265a: 'Der Schreiber dankt dem Geheimen Staats Rath dafür, dass er seine Angelegenheiten gelenkt hat. Alles hängt am Vorschuss von 112/m Rthl: Dann wäre der König ex nexu, erhielte das Schuldinstrument über 300/m Rthl zurück, und die Gläubiger würden befriedigt. Tilgen ließe sich der Vorschuss aus Geldern, die Cosmar zurückhält: 60000 Rthl für Sohn August, 100/m Rthl für den ältesten Sohn und über 48000 Rthl für den Schreiber.'
oe1bu9454-265b: Der Schreiber bittet einen General, beim Kaiser zu erwirken, dass ihm die Trąbczyner Güter samt 8 Jahren Revenuen zurückgegeben werden. Der verstorbene König hatte ihm 1796 die konfiszierten Prusimski-Güter Kamionna und Trąbczyn verliehen. 1807 übergab die Verwaltungskommission sie der Tochter Prusimskis, jetzt Miączyńska. Das Tribunal in Kalisz verwies ihn an Napoleon. Nun soll die Prosna Grenze werden. Er fürchtet Miączyńskis Einfluss auf den Generalgouverneur und bittet, v. Triebenfeld anzuhören.
oe1bu9454-266: Berichtet, Russland verlange die Prosna als Grenze, wodurch Trąbczyn und Triebenfelds Blizanower Güter unter fremde Hoheit kämen und Trąbczyn schwer zurückzubekommen wäre. Der Fürst Kanzler widersetze sich. Erhalte Russland die Distrikte, müsse die Sache mit Kaiser Alexander abgemacht werden, da Dąbska oder Miączyńska bei Lanskoy in Gnaden stehe. Erwartet den Bericht des Brieger Oberlandesgerichts. Bittet um Blanquets, Vollmachten, den Brief an den Kanzler und den Revers für Barbe, da Pourtalès wohl eintrete.
oe1bu9454-267: Triebenfeld klagt, seit dem am 21. erhaltenen Schreiben vom 17. Dezember nichts mehr vom Fürsten erhalten zu haben. Vergeblich wartet er auf das Schreiben an den Fürsten Kanzler, die Blanquets, die Vollmacht für Göschel, den Revers für Barbe wegen Koszęcin und auf Geld; Barbe könne nichts mehr geben. Am meisten sorgt ihn der ausbleibende Bericht aus Brzeg. Russland wolle unserem Herrn wegen Polen nahetreten.
oe1bu9454-268: Triebenfeld bestätigt den Empfang von 1125 fl Papiergeld. Er hat die Schreiben an den König und den Staats Kanzler abgegeben und Briefe an General v. Schöler und Stägemann schreiben lassen. Die Trąbczyner Sache macht ihm Sorge, weil die Gegend wahrscheinlich an Russland fällt. Er will den Kaiser durch General v. Schöler bearbeiten lassen. Nach Hoffrath Hahn ergibt der Ausweis der Beamten kaum halb so viel Einkünfte der Majoratsgüter.
oe1bu9454-269: Triebenfeld übersendet sein Schreiben an den Staatskanzler, das Hoffrath Barbe mit der Kircheisenschen Korrespondenz überreicht hat. Die Sache liegt nun bei Stägemann. Um Trąbczyn fürchtet er, falls der Kreis an Russland fällt. Hardenberg sage, der Fürst müsse sonst entschädigt werden. Eine Erlaubnis, sich wegen Trąbczyn an russische Behörden zu wenden, hat er noch nicht. Er will Cosmars Sturz und die Administration der Majoratsgüter betreiben und erwartet die Antwort des Grafen Pourtalès.
oe1bu9454-269a: 'Abschrift einer Eingabe Triebenfelds im Auftrag des Fürsten von Hohenlohe. Er übersendet die Korrespondenz mit Kircheisen, die das Oberlandesgericht Brieg nicht zu Protokoll nehmen wollte. Cosmar habe die Forderung der Curischen Erben von 300/m Rthl blockiert und mit Arrest belegt. Die Erben seien mit 112000 Rthl zufrieden: 12/m Rthl bar und eine Anweisung auf 100000 Rthl. Triebenfeld bittet, dem Fürsten diese Summe vorzuschießen und die Majoratsgüter verwalten zu lassen. Dafür will er die Schuldinstrumente und die königliche Garantie ausliefern.'
oe1bu9454-270: Kalisz wird wohl russisch. Triebenfeld soll Trąbczyn zurückgewinnen, erhält aber keine Zusicherung. Man sagt, der Kaiser werde die Maßnahmen der Wohlverwaltungs Commission kaum aufheben, eher den Fürsten anders entschädigen. Der Staats Kanzler verbietet ihm jede Demarche. Miączyński, Ehemann der geborenen Prusimska, ist mit Graf Lanskoy eng befreundet. Die Sache liegt bei Stägemann. Werden die Cur. befriedigt, fällt Cosmars Arrestschlag. Der Revenuen Überschlag zum Brieger Protocoll erschreckt ihn. Dazu Gerüchte über Sachsen und Wellington.
oe1bu9454-271: 'Triebenfeld berichtet vom Wiener Kongress: Die polnische Grenze über Słupca bei Pyzdry, Warthe und Prosna sei angenommen, der König von Sachsen behalte Dresden, Leipzig und Bautzen. Er dränge weiter den Fürsten Kanzler, die Akten lägen bei Stägemann. Der Vorschuss von 112/m Rthl gelte als sicher. August solle Cosmars Vollmacht aufheben und dies dem Justizminister und dem Oberlandesgericht in Brzeg schreiben. Zu den polnischen Gütern erwartet er Bescheid, ob er kommen soll.'
oe1bu9454-272: Hahn übersendet auf Befehl die entworfene Antwort an Fürst August. Die Rücknahme der Vollmacht führt er auf die Wiener Beschlüsse zurück. Er fürchtet neue Missgriffe in Öhringen, die nur mündlich abzuwenden seien. Für den äußersten Fall wäre ihm eine geheime Instruction nebst Vollmacht nöthig. Durch Besichtigung der Güter will Hahn deren wahren Ertrag und den Baubedarf nachweisen. Die Mittel der Güter dürften nicht länger an einen Berliner Advocaten gehen.
oe1bu9454-273: Triebenfeld verteidigt sich gegen die Vorwürfe des Fürsten. Die Revenuen habe er nach dessen Angabe mit 79000 Rthl eingesetzt, die Beamten setzten sie auf 36000 Rthl herab. Hoffrath Hahn schätze den Wert der Güter auf 2 Millionen und den Ertrag auf 60/m Rthl. Der Vorschuss von 112/m Rthl werde gegeben. Geheime Abmachungen mit den Curischen Erben weist er empört zurück. Nesselrode zuckt die Achseln. Er bittet, bald einen Nachfolger zu schicken, und hat Hahn als Administrator genannt.
oe1bu9454-274: Zur Trąbczyner Vindication hat Triebenfeld noch keine Resolution des Fürsten Kanzler. Bei einer Kommission unter General Amstetten wurde ihm die Einreichung vorerst widerraten. Die Urkunden ließ er abschreiben und vidimieren, die Prozessakten beeidigt ins Deutsche übersetzen. Die Bewilligung des Vorschusses von 112000 Rthl erhofft er bald. Vom Kongress berichtet er über den württembergischen Landtag zum 15. März und den Protest der Stände. Barbe und Göschel bitten, Fürst August zu warnen, nichts einzuräumen.
oe1bu9454-275: 'Triebenfeld berichtet, dass Stägemann dem Staats Kanzler noch immer keinen Vortrag gehalten hat. Er vermutet bösen Willen; man würde für Cosmar entscheiden, wäre der Brieger Bericht nicht so günstig für den Fürsten. Seine größte Sorge ist die Einreichung der Akten und Dokumente wegen Trąbczyn, Kolno und Kamionna bei der Kommission: Der Übersetzer gibt die Akten mit der Übersetzung nur gegen Bezahlung heraus. Er bittet dringend um Geld und die angebotenen Blanquets. Er ist krank und bettlägerig.'
oe1bu9454-276: Triebenfeld schickt ein beunruhigendes Schreiben Eberhards aus Brzeg und bittet es zurück. Stägemann hat die Sache noch nicht vorgetragen, Hardenberg hat erneut Hilfe zugesagt. Verlangt habe er stets nur 112000 Rthl zur Befriedigung der Curischen Erben und Verwaltung der Güter unter dem Fürsten. Er bittet dringend, Eberhard für einen Vergleich mit den Prinzessinnen nach Wien zu senden. Die Eingabe wegen der polnischen Güter ist fertig, es fehlen Befehl des Staatskanzlers und Geld für Übersetzungen.
oe1bu9454-277: 'Triebenfeld bestätigt den Empfang des Schreibens vom 6ten mit der Anweisung auf 200 # und drei Blanquets und wünscht erneut, dass Eberhard und Hahn nach Wien kommen. Die polnische Güterangelegenheit hat er nochmals mit allen Aktenstücken übergeben und auf Anraten Beguelins an Zerboni geschrieben; dessen Antwort liegt bei. Stägemann hatte noch keinen Vortrag. Cosmar gelte als so gut wie vernichtet, August solle die Vollmacht zurückfordern. Er meldet Napoleons Landung in Antibes.'
oe1bu9454-278: Eberhard bittet den Fürsten dringend, mindestens 5 bis 600 Rthl für eine Reise nach Wien aufzubringen, zu der v. Triebenfeld ihn drängt. Ein Vergleich mit den Curischen Erben sei nur jetzt möglich, solange die 3 Prinzessinnen persönlich in Wien seien. Hindernisse sind eine Weisung der General Mandatarien der Erben, sich nicht einzumischen, sein Geldmangel und nötige Pässe. Einen Plan mit 2 Wegen, die Reise zu begründen, schickt er v. Triebenfeld.
oe1bu9454-279: Triebenfeld hält einen echten Vergleich mit den Curischen Erbinnen für entscheidend. Danach würde der Staats Kanzler Vorschuss und Administration besorgen. Er erwartet sehnlich Eberhard. Hohenlohe-Bartenstein, Winzingerode und Göschel haben nach Langenburg und Kirchberg geschrieben. Er vermutet, Fürst August habe die Vollmacht zurückgefordert, womit Cosmar ungeschützt wäre. Zu den polnischen Gütern verlangt der Kanzler Geduld bis zur Entscheidung über die den Donatarien abgenommenen Güter. Außerdem berichtet er Nachrichten und Gerüchte über Napoleons Vormarsch und seine Ächtung.
oe1bu9454-280: 'Triebenfeld bedauert, dass Eberhard nicht kommt und kein Vergleich mit den curischen Erbinnen zustande gebracht ist; er fürchtet Verschleppung durch Cosmar und Stägemann. Fürst August hat die Vollmacht noch nicht aufgehoben; mit Prinz Adolph ist wegen Koszęcin nichts zu machen. Zu den polnischen Gütern antwortete der Fürst Kanzler; an den Kaiser soll Triebenfeld nicht schreiben. Dazu Wiener Nachrichten: Napoleons Marsch auf Paris, Wellingtons Abreise, Talleyrands Streit mit Kaiser Alexander. Er bittet, Eberhard eilig zu schicken.'
oe1bu9454-281: Triebenfeld bittet, Stock, dem Bedienten des Hoffraths Barbe, der mit Triebenfelds 3 Pferden Barbes Schwester nach Berlin holen soll, einen Korbwagen zu geben, dazu eine zweispännige Fuhre, die Kisten Glas der Hoffräthe Barbe, Heym und Philippsborn von Prag nach Sławięcice bringen soll. Stägemann hat noch keinen Vortrag gemacht; eine Intrige wird vermutet. Eberhard kann den Vergleich mit den Curischen Erbinnen nicht abschließen. Bei Verlust von Trąbczyn soll der Fürst andere Güter, vielleicht in Schlesien, erhalten.
oe1bu9454-282: v. Triebenfeld erklärt, ohne Vergleich mit den Prinzessinnen lasse sich in Wien nichts mehr erreichen, da man dem Fürsten Kanzler einen Vergleich über 162/m Rthl vorgespiegelt habe. Er drängt, Eberhard mit einem Pass herzuschicken. Er beklagt, dass Fürst August die Präsidentenstelle angenommen hat. Ein Schreiben fordert, ihm die 100/m Rthl bar auszuzahlen. Er bittet, Barbes Bedienten abzufertigen, eine Fuhre nach Prag zu schicken und Tambour und Wawrzyn nach Blizanów zurückzusenden. Er berichtet von Napoleons Vormarsch auf Paris.
oe1bu9454-283: Beguelin sagt zu, den an den Fürsten Staatskanzler gerichteten Brief des Fürsten unverzüglich zu übergeben und ihm dabei die Wünsche des Fürsten vorzutragen. Er wäre glücklich, im Auftrag des Staatskanzlers diese Wünsche erfüllen zu helfen. Triebenfeld habe er vorher nicht gekannt und erst in Wien kennengelernt. Dass dieser sich auf den Fürsten berief, habe genügt, ihm volle Aufmerksamkeit zu schenken.
oe1bu9454-284: 'Triebenfeld meldet, dass Trąbczyn, Kamionna und Kolno nicht mehr zu erwarten sind: Alexander habe erreicht, dass die Polen die ihnen zurückgegebenen Güter behalten. Er beantragt Entschädigung. Für Kamionna fordert er 93000 Rthl baar (Pfandschilling Broniewski samt Zinsen) und 120000 Rthl in Gütern. Für Trąbczyn, taxiert auf 316000 Rthl, bleiben nach Abzug der Schulden 246000 Rthl. Insgesamt 459000 Rthl. Weigels 30000 Rthl sind auf Zagórów übertragen. Stägemann tut nichts. Bittet um Blanquets und um Eberhards Kommen wegen des Vergleichs.'
oe1bu9454-285: Pro Memoria mit Berechnung der Entschädigungsforderung des Fürsten Hohenlohe für Kamionna und Trąbczyn. Kamionna, 1796 nach Anton v. Prusimski verliehen und an Broniewski verpfändet, löste der Fürst 1804 per Vergleich mit 55000 Rthl ein; mit Prozesskosten und Zinsen soll die Prusimska 94550 Rthl baar erstatten. Trąbczyn wurde auf 316000 Rthl taxiert; von 138000 Rthl Schulden (Lichnowski, Weigel, Grotowski, Zerboni u.a.) bleiben 78000 Rthl. Die Souverains sollen 367164 Rthl in Gütern oder baar leisten, zusammen 461714 Rthl.
oe1bu9454-286: 'Triebenfeld berichtet über Napoleons Rückkehr und den drohenden Krieg; bei den Verwirrungen sei wenig zu erreichen, Hardenberg verspreche alles, Stägemann handle, wie es ihm gefalle. Da die Prusimska die polnischen Güter zurückerhalten habe, reichte er ein beiliegendes Pro Memoria ein: Es berechnet die Verluste an Kamionna und Trąbczyn (taxiert auf 316000 Rthl, reiner Wert 240000 Rthl) und fordert 390100 Rthl bar oder in Gütern. Er bittet um schnellste Antwort und Blanquets; Beguelin wünscht ein Schreiben des Fürsten.'
oe1bu9454-287: Triebenfeld beklagt, dass der Brief vom 3ten Aprill unverschlossen beim Post Director lag und wohl gelesen wurde. Er begrüßt Prinz Adolphs Entschluss und will vor der Abreise des Königs, angeblich am 18ten, diesem den Entschluss vortragen und fragen, wohin Adolph kommen und welche Uniform er tragen soll. Beguelin gab Lombardinis Schreiben dem Kanzler, Hahns drohendes Schreiben zeigt Triebenfeld nicht. Er berichtet über die Rüstungen gegen Bonaparte und weist die Vorwürfe wegen des geschickten Geldes zurück.
oe1bu9454-288: Triebenfeld wünscht, dass Prinz Adolph bis spätestens zum 22. eintrifft. Er klagt, die Sache Cosmar werde seit 5 Monaten verschleppt; Cosmar solle alle Gelder beim Oberlandesgericht Brzeg deponieren und Rechnung legen. Wegen Trąbczyn hat er sich an Minister v. Stein gewandt und erhofft sich viel von einem französischen Brief des Fürsten, der dem russischen Kaiser vorgezeigt werden kann. Ottos Wertansatz für Trąbczyn von höchstens 160000 Rthl verwirft er; Entschädigung sei nach Blombergs Überschlag von 316000 Rthl zu fordern.
oe1bu9454-289: Triebenfeld bittet Albrecht, beim König einen kategorischen Bescheid zur Forderung der Curischen Erben zu erwirken. Die Schuld beträgt 300/m Rthl, mit Zinsen 426/m Rthl, und der König hat sie als Selbstschuldner unterschrieben. Zahlt der König, soll die Cosmarische Administration der Majoratsgüter aufgehoben werden. Sagt er sich los, will Triebenfeld mit den Erben vergleichen, die zuvor circa 112/m Rthl annehmen wollten, und bittet um einen königlichen Vorschuss dafür. Cosmar legt keine Rechnung.
oe1bu9454-290: 'Nach 7 Monaten ist Cosmar angewiesen, die Gelder aus 3 Jahren, von denen jährlich 12/m Rthl den Gläubigern zugewiesen sind, schleunigst beim Oberlandesgericht Brzeg einzuzahlen und Rechnung zu legen. Stägemann verteidigt Cosmar und berät die Curischen Erbinnen. Minister Stein betreibt die Entschädigung durch das Amt Sokolnik und hat den Kanzler hinzugezogen, damit beide sie dem Kaiser vorschlagen. Triebenfeld will ein Memoire zur Curischen Sache und zum Militärgehalt einreichen. Triebenfeld bittet dringend um 100 # per Estaffette.'
oe1bu9454-291: Triebenfeld meldet, dass eine Cabinets Ordre vom 27. April die sofortige Auszahlung der 100000 Rthl an Fürst August befiehlt. Die Entschädigung für die polnischen Güter sei durch Minister Humboldt entschieden, das Wie und Wann hänge aber vom Kayser ab. Stein, Worowzow und Nesselrode setzen sich dafür ein. Cosmar soll die Gelder des Fürsten sofort hinterlegen, sonst drohen ihm Arrest und ein Oberaufseher. In der Militärsache gibt es nichts Neues. Triebenfeld bittet dringend um Geld.
oe1bu9454-292: Meldet, die Entschädigungssache liege dem Kayser vor; Minister v. Stein habe Hilfe versprochen, Hardenberg werde schriftlich zusagen. Im Streit mit Cosmar verteidige Stägemann diesen; Triebenfeld verlangte vor dem Fürst Kanzler die Hinterlegung der Summen aus der Urkunde von 1799 und dem Transact von 1811 beim Oberlandesgericht Brzeg. Fürst August sollen per Cabinets Ordre 100000 Rthl sofort gezahlt werden. Cosmar soll wegen unterschlagener Familiengelder denunziert sein. Schlägt vor, den Fürst Kanzler in Nysa zu treffen.
oe1bu9454-294: 'Bisenti berichtet über Verhandlungen mit der Herzogin von Żagań wegen ihrer Forderung von 30000 Rthl oder 100000 # in Gold. Sie hofft, dass der König allein zahlt. Solange ihr nicht von höherer Seite gesagt wird, dass er nicht zahlt, kann Bisenti nichts unternehmen. Danach erwartet er einen Vergleich auf das ihr gemachte Angebot von 150000 Rthl, vorbehaltlich höherer Ratifikation. Er bittet Triebenfeld, dafür zu sorgen, dass man den Erbinnen dies offen sagt.'
oe1bu9454-295: v. Triebenfeld verfehlte in Kalisz den russischen Kaiser. Laut Ober Post Director Espagne ist Fürst Kanzler Hardenberg noch in Paris und kommt erst in drei Wochen nach Berlin; Barbe liege dort am Nervenfieber. Triebenfeld prüft die Sache von Pszczew (Betsche), wo die Untertanen Aufhebung des Contracts beantragten, will Geld vom Pächter in Blizanów holen und nach Berlin reisen. Er legt Zerbonis Antwort an Schenck bei und bezweifelt dessen angeblichen Bericht an Hardenberg. Außerdem Gerüchte über Stein, Radziwiłł und Biron.
oe1bu9454-296: Grevenitz schickt Triebenfeld die bei ihm eingegangene Post und zwei Original-Anlagen. Er meldet, dass Hoffrath Barby in Paris gestorben ist, und will bei der Witwe nachfragen. Der Staats Kanzler wurde erwartet und ist inzwischen angekommen. Philippischen soll gefährlich krank sein. Grevenitz bekundet Anteil an Triebenfelds Krankheit. Cosmar wurde in erster Instanz unredlichen Verfahrens überführt, hat aber appelliert; bleibt es dabei, verliert er die Vormundschaft.
oe1bu9454-297: Triebenfeld meldet den Tod seiner Tochter, Barbes und Trzcińskis sowie seine schwere Krankheit. In der Pszczewer Sache beantragen die Einsassen Aufhebung des Contracts; Zerboni verlangt Aufschluss und scheint mit Schencks Vortrag etwas unzufrieden. Von Kolno und Kamionna sei nichts zu hoffen, die Tochter Prusimskis kaum über den gezahlten Pfandschilling hinaus zu zwingen. Er will sich mit Leixner einigen, Eichausts Rechnungen prüfen und bittet um eigenhändige Antwort zur Generalvollmacht für Schenck.
oe1bu9454-298: Triebenfeld ist weiter krank. Wegen der im Wiener Tractat zugesagten Entschädigung fürchtet er nichts, da sein Freund Boidelang, Vertrauter Humboldts, an Barbes Stelle treten soll. Er will erst hier aufräumen, dann die Angelegenheit in Pszczew ordnen, danach nach Berlin reisen. Er bittet, das Postamt Strelitz anweisen zu lassen und ihm Briefe durch Expresse zu schicken. Erbetenes Wild soll in Gostyszyn beim Generalpächter Faust abgegeben werden. In Kalisz gelte der preußische Taler nur noch 20 gg.
oe1bu9454-299: Triebenfeld will in Pszczew mit Leixner in Międzyrzecz die aufgefundene Quittung geltend machen und die Schuld löschen lassen. Einer Aufhebung des Kontrakts, die Bürger, Bauern und Zerboni wünschen, will er nur unter Bedingungen zustimmen, darunter 11000 Rthl rückständiger Canon an den Fürsten. Aus Pszczew stünden dem Fürsten noch 99000 Rthl zu. Triebenfeld besteht darauf, dass die 72000 und 65000 Rthl auf Kamionna gehörten. Trzciński erhält Aufschub bis Johanni. Schenck will eine Generalvollmacht; Triebenfeld bittet um ein Schreiben, um ihn loszuwerden.
oe1bu9454-300: 'Berichtet über einen Streit in Posen: Zerboni ließ mit seinem Sekretär Schmidt ein Gutachten zur Organisation Posens entwerfen. Fürst Radziwiłł verweigerte die Mitunterschrift, weil es dem Befehl des Königs widersprach, worauf Zerboni erklärte, er sei hier regierender Herr. Zerboni wurde nach Berlin geschickt. Gerüchte: Der Senat in Petersburg soll die polnische Verfassung verworfen haben, Großfürst Constantin eilte nach Petersburg. Nach Rückkehr seines Boten aus Sławięcice will Triebenfeld nach Pszczew und dann nach Berlin wegen der Entschädigung reisen.'
oe1bu9454-301: Triebenfeld bestätigt das durch Lombardini überbrachte Schreiben vom 26.. Neues berichtet er nicht, er bittet um die Entschlüsse des Fürsten; Lombardini soll berichten. Er erwartet seinen Sohn und einen Pächter für Świniary und will danach nach Poznań und Pszczew reisen. In der Entschädigungssache hofft er auf guten Ausgang, da er den Ober Prefect v Smiedecki in Kalisz gewonnen habe. Wildbret für hier und für Zerboni in Poznań würde gut wirken, das letzte sei fast ganz verdorben.
oe1bu9454-302: 'Triebenfeld berichtet, er habe Hawich und Ober-Inspektor Hecker bei sich gehabt und dreizehn gerichtliche Vollmachten ausgestellt: wegen der Dąbska und der Trąbczyner Güter, zur Aufhebung der Sequestration, zur Klage gegen Oppenheimer et Wolf in Kalisz auf Löschung von über 72000 Rthl, zur Absetzung des Sequesters Honrichs und Annullierung seiner eigenmächtigen Grundverkäufe, gegen Niedźwiecki wegen rückständiger Pacht, gegen die Olesnicer Erbpächter und zur Vertretung auf dem Reichstag in Warszawa. Seine Obligationen über 250000 Rthl gäben ihm Mitspracherecht.'
oe1bu9454-303: Auszug aus den Fürstlich Hohenloheschen Liquidationsprotokollen mit 142 Kapitalforderungen, zusammen 17,874 Rthl Gold und 1,414,377 Rthl 7 g 11 d Courant. Zu den größten Forderungen gehören Carl v Stoessel mit 191,000 Rthl, Goldstücker mit 170,000 Rthl, der Stoesselsche Curator mit 169,400 Rthl, Fr. Charlotte von Triebenfeld mit 112,000 Rthl, Kaufmann Koppan in Breslau mit 80,000 Rthl, die v Köckritzschen Erben mit 50,000 Rthl und die v Sobottendorffischen Erben mit 44,200 Rthl. Genannt sind auch Bornstädt, Zerboni und Lombardini.
oe1u199-001: 'Landesherrliche Bestätigung des Königs von Preußen für das Familienmajorat und Fideicommiss, das Friedrich Ludwig zu Hohenlohe-Ingelfingen im Testament vom 7. October 1805 stiftete. Der eingerückte Testamentsauszug erklärt zu Majorat: seine Häuser in Wrocław, den Park in Szczytniki, Bytków, Koszęcin mit Boronów, Olszyna, Harbultowitz und Cieszowa sowie die südpreußischen Herrschaften Zagórów, Trąbczyn, Pszczew, Wieniec und Batkowo. Stirbt der Mannsstamm aus, erhält die dritte Tochter Auguste die südpreußischen Güter, Adelheid die schlesischen Hüttenwerke, Emilie Koszęcin.'

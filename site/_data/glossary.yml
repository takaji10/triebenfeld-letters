- id: "groschen"
  kind: "money"
  lang: "de"
  head_en: "Groschen"
  head_de: "Groschen"
  orig: "Groschen, g."
  short_en: "A silver coin and unit worth one twenty-fourth of a Reichsthaler, and divided into 12 Pfennig. Sums are written in three columns: thalers, Groschen, Pfennig."
  short_de: "Silbermünze und Rechnungseinheit, der vierundzwanzigste Teil eines Reichsthalers, unterteilt in 12 Pfennig. Summen stehen in drei Spalten: Taler, Groschen, Pfennig."

- id: "indult"
  kind: "law"
  lang: "de_la"
  head_en: "indult"
  head_de: "Indult"
  orig: "Indult"
  short_en: "A period of grace for meeting an obligation; here one granted by the sovereign, during which creditors could not enforce their claims. By March 1809 the King of Saxony, as Duke of Warsaw, the Polish state Napoleon created in 1807, had granted landowners a general indult of three years."
  short_de: "Eine Frist zur Erfüllung einer Pflicht; hier eine vom Landesherrn gewährte, in der Gläubiger ihre Forderungen nicht vollstrecken durften. Bis März 1809 hatte der König von Sachsen als Herzog von Warschau den Grundbesitzern einen dreijährigen Generalindult gewährt."
  long_en: ""
  long_de: ""
  source: "Adelung, Grammatisch-kritisches Wörterbuch, s.v. Indult (https://woerterbuchnetz.de/?sigle=Adelung&lemid=I00098); the letters (Oe 1 Bü 9454, 48)"

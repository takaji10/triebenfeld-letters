- id: "titulus-possessionis"
  kind: "land"
  lang: "la"
  head_en: "title of possession (titulus possessionis)"
  head_de: "Titulus possessionis"
  orig: "Titulus possessionis, Besitztitel"
  short_en: "An owner's title, entered on his estate's folio in the mortgage book. Until it was entered, the owner could not sell, mortgage or lease with effect; from 1795 Prussia required the title to rest on legal proof, so having Prince Friedrich Ludwig of Hohenlohe-Ingelfingen entered as owner of the estates the King gave him took years."
  short_de: "Der Besitztitel eines Eigentümers, auf dem Blatt seines Guts im Hypothekenbuch eingetragen. Ohne Eintragung konnte er nicht wirksam verkaufen, belasten oder verpachten; seit 1795 verlangte Preußen, dass der Titel auf rechtlichen Beweisen beruhte, und die Eintragung des Fürsten kostete Jahre an Papieren."
  long_en: ""
  long_de: ""
  source: "Szukaj w Archiwach, after T. Mencel's introduction to the inventory (reference/sources/patrimonial_courts_mencel.md), for the rule of 1795"
  check_against: "Allgemeine Hypothekenordnung 1783"
  lang_note_en: ""
  source_html: "Szukaj w Archiwach, after T. Mencel&#x27;s introduction to the inventory, for the rule of 1795"
  checked: false

- id: "laudemium"
  kind: "land"
  lang: "de_la"
  head_en: "Laudemium"
  head_de: "Laudemium"
  orig: "Laudemium"
  short_en: "A fee paid to the lord whenever a hereditary holding changed hands, by sale or inheritance, in acknowledgement of his superior ownership; on a sale it was owed for his confirming the new holder."
  short_de: "Eine Abgabe an den Grundherrn, sobald ein erblicher Besitz den Inhaber wechselte, durch Verkauf oder Erbgang, zur Anerkennung seines Obereigentums; bei einem Verkauf wurde sie dafür gezahlt, dass er den neuen Besitzer bestätigte."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Lehen=Ware (https://www.kruenitz1.uni-trier.de/xxx/l/kl02991.htm)"

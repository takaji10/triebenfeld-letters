- id: "competenz"
  kind: "land"
  lang: "de_la"
  head_en: "competence (Competenz)"
  head_de: "Competenz"
  orig: "Competenz"
  short_en: "The fixed income owed from an estate to a church foundation or its clergy. Villages that had been church property, such as Zagórów, passed to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen in 1797 with the duty to keep paying it. It has nothing to do with ability."
  short_de: "Die festen Einkünfte, die ein Gut einer kirchlichen Stiftung oder ihren Geistlichen schuldete. Güter aus Kirchenbesitz gingen an den Fürsten mit der Pflicht über, sie weiter zu zahlen."

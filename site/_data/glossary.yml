- id: "invalidenkasse"
  kind: "law"
  lang: "de"
  head_en: "Invalids' Fund"
  head_de: "Invalidenkasse"
  orig: "Invaliden-Casse"
  short_en: "The Prussian fund for disabled soldiers, which invested its capital in loans to landowners. In 1805 it lent 50,000 Reichsthaler on the estate of Zagórów through Prince Friedrich Ludwig of Hohenlohe-Ingelfingen's agent, Triebenfeld, and later sued for the interest before the Kammergericht in Berlin."
  short_de: "Die preußische Kasse für invalide Soldaten, die ihr Kapital in Darlehen an Gutsbesitzer anlegte. Sie lieh dem Fürsten 1805 Geld und klagte es später ein."

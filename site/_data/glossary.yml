- id: "friedensgericht"
  kind: "law"
  lang: "de"
  head_en: "peace court"
  head_de: "Friedensgericht"
  orig: "Friedens Gericht"
  short_en: "The lowest court of the Duchy of Warsaw, one in each district (sąd pokoju), on the French model: it tried small cases, sought settlements and kept guardianships and records. In 1808 it took over the business of the abolished patrimonial courts; in 1811 the peace court at Konin was asked to collect the costs of a settler's lease on Trąbczyn."
  short_de: "Das unterste Gericht des Herzogtums Warschau, eines in jedem Kreis (sąd pokoju), nach französischem Vorbild: es entschied kleine Sachen, suchte Vergleiche und führte Vormundschaften und Akten. 1808 übernahm es die Geschäfte der aufgehobenen Patrimonialgerichte; das Gericht in Konin erhielt 1811 die Pachtakte."
  long_en: ""
  long_de: ""
  source: "Szukaj w Archiwach, after T. Mencel's introduction to the inventory (reference/sources/patrimonial_courts_mencel.md)"
  check_against: "Gloger, Encyklopedia staropolska (sąd pokoju)"
  lang_note_en: ""
  source_html: "Szukaj w Archiwach, after T. Mencel&#x27;s introduction to the inventory"
  checked: false
  sort_en: "peace court"
  initial_en: "P"

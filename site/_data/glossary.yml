  head_en: "record (Protocoll)"
  head_de: "Protocoll"
  orig: "Protocoll, ad protocollum"
  short_en: "The official record of a hearing or transaction, written down by the court as the parties declared it. To declare something \"ad protocollum\", \"to the protocol\", put it on record. It has nothing to do with etiquette."
  short_de: "Die amtliche Niederschrift einer Verhandlung, vom Gericht so aufgenommen, wie die Parteien erklärten. Etwas „ad protocollum“ erklären hieß, es zu Protokoll geben."

- id: "justitiarius"
  kind: "law"
  lang: "de_la"
  head_en: "justiciary"
  head_de: "Justitiarius"
  orig: "Justitiarius"
  short_en: "The lawyer who held a landowner's patrimonial court for him. The owner could also judge in person, but most had a justiciary sit in their name."
  short_de: "Der Jurist, der das Patrimonialgericht für den Gutsbesitzer hielt. Der Besitzer konnte auch selbst richten, ließ aber meist einen Justitiarius in seinem Namen sitzen."

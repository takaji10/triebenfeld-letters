- id: "einstand"
  kind: "land"
  lang: "de"
  head_en: "entry money"
  head_de: "Einstandsgeld"
  orig: "Einstand, Einkaufsgeld"
  short_en: "The sum a tenant paid once, on taking up a hereditary lease, besides the yearly canon. Settlers often owed it in instalments, and arrears of it were sued for."
  short_de: "Die Summe, die ein Pächter beim Antritt einer Erbpacht einmal zahlte, neben dem jährlichen Canon. Siedler schuldeten es oft in Raten, und Rückstände wurden eingeklagt."

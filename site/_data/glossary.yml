- id: "vollmacht"
  kind: "law"
  lang: "de"
  head_en: "power of attorney"
  head_de: "Vollmacht"
  orig: "Vollmacht"
  short_en: "A written authority to act for someone in law: to sue, collect, sign or sell in their name. A general power of attorney covered all their affairs."
  short_de: "Eine schriftliche Ermächtigung, rechtlich für jemanden zu handeln: in seinem Namen zu klagen, einzuziehen, zu unterschreiben oder zu verkaufen. Eine Generalvollmacht umfasste alle seine Angelegenheiten."

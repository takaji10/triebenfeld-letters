- id: "tribunal"
  kind: "law"
  lang: "de_fr"
  head_en: "Tribunal"
  head_de: "Tribunal"
  orig: "Tribunal"
  short_en: "A court of the Duchy of Warsaw, set up on the French model with the Code Napoléon; each department had a civil tribunal. The claims against the former estates of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, and Michalina Prusimska's to them, were fought out before them."
  short_de: "Ein Gericht des Herzogtums Warschau nach französischem Vorbild, mit dem Code Napoléon; jedes Departement hatte ein Ziviltribunal. Die Ansprüche gegen die Güter des Fürsten wurden vor ihnen ausgetragen."

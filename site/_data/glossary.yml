- id: "notarius"
  kind: "law"
  lang: "la"
  head_en: "notary public"
  head_de: "Notarius publicus"
  orig: "Notarius publicus"
  short_en: "A lawyer appointed after examination, by the sovereign's authority, to draw up and certify deeds, contracts, wills and powers of attorney in a set form, so that courts would accept them as full proof."
  short_de: "Ein nach Prüfung im Namen des Landesherrn bestellter Rechtskundiger, der Urkunden, Verträge, Testamente und Vollmachten in vorgeschriebener Form aufsetzte und beglaubigte, sodass Gerichte sie als vollen Beweis annahmen."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Notar (https://www.kruenitz1.uni-trier.de/xxx/n/kn02782.htm)"

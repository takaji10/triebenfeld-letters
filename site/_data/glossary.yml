- id: "ducat"
  kind: "money"
  lang: "de"
  head_en: "ducat"
  head_de: "Dukaten"
  orig: "Ducaten"
  short_en: "A gold coin of standard weight, current across central Europe, and the money of large payments and of travel. At the Congress of Vienna in 1814–15 the Prince's agent, Peter Friedrich von Triebenfeld, counted his expenses in ducats and gulden."
  short_de: "Eine Goldmünze von festem Gewicht, in ganz Mitteleuropa gängig, das Geld großer Zahlungen und der Reise. In Wien 1814/15 rechnen die Briefe in Dukaten und Gulden."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Ducaten (https://www.kruenitz1.uni-trier.de/xxx/d/kd01432.htm)"

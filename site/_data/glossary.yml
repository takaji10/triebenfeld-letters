  short_en: "The measure of firewood: a stack of split logs a fathom (six feet) long and six feet high, as deep as the logs were long. With the three-foot logs usual in Prussia it held 108 cubic feet, about three and a third cubic metres. Woodland was valued by the cords it would yield."

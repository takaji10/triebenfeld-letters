- id: "grod"
  kind: "law"
  lang: "pl"
  head_en: "gród (municipal court)"
  head_de: "Gród (Burggericht)"
  orig: "gród, grodzki; in Latin castrensis (Acta Castrensia)"
  short_en: "A castle, and the court held there. In the old Polish Commonwealth the starost held the gród court in a royal castle, in Latin iudicium castrense: it judged nobles for the gravest crimes, and later also suits over land and money. Beside the court was its office, where deeds, bonds and other acts not in dispute were entered in its books, which then counted as proof. The court books of Konin and Kalisz that record the boundary quarrel between Trąbczyn and Łukom are its books. In English it is here called the municipal court, meaning the court of the gród, not of a town."
  short_de: "Eine Burg und das Gericht, das dort gehalten wurde. In der alten polnischen Adelsrepublik hielt der Starost das Burggericht auf einer königlichen Burg, lateinisch iudicium castrense: Es richtete Adlige wegen der schwersten Verbrechen, später auch in Klagen um Land und Geld. Neben dem Gericht stand seine Kanzlei, in deren Bücher Urkunden, Schuldverschreibungen und andere unstrittige Akte eingetragen wurden, die damit als Beweis galten. Die Gerichtsbücher von Konin und Kalisz sind seine Bücher. Das Englische nennt es \"municipal court\"; gemeint ist das Gericht des Gród, nicht das einer Stadt."
  long_en: ""
  long_de: ""
  source: "Arct, Słownik ilustrowany języka polskiego (1916), vol. 1, p. 405, s.v. Gród (https://pl.wikisource.org/wiki/M._Arcta_S%C5%82ownik_ilustrowany_j%C4%99zyka_polskiego/Gr%C3%B3d); the State Archive in Poznań's description of the fonds Księgi sądu i urzędu grodzkiego w Koninie (docs/PRUSIMSKI_ERA_PLAN.md)"

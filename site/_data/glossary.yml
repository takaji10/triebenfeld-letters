- id: "sequestration"
  kind: "law"
  lang: "de_la"
  head_en: "sequestration"
  head_de: "Sequestration"
  orig: "Sequestration"
  short_en: "The seizure of an estate by order of a court, to enforce a debt: a sworn administrator, the sequestrator, runs it and pays its income to the court for the creditors until the debts are settled. The owner keeps the title but loses the use; where many creditors sue, a sale may follow."
  short_de: "Die gerichtlich angeordnete Beschlagnahme eines Guts zur Beitreibung einer Schuld: ein vereidigter Verwalter, der Sequester, bewirtschaftet es und liefert die Einkünfte an das Gericht für die Gläubiger ab, bis die Schulden getilgt sind. Der Eigentümer behält den Titel, verliert aber die Nutzung; klagen viele Gläubiger, kann der Verkauf folgen."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Sequestration (https://www.kruenitz1.uni-trier.de/xxx/s/ks20190.htm)"
  check_against: "Allgemeines Landrecht 1794; Krünitz"
  lang_note_en: "German <i>Sequestration</i>, from Latin <i>sequestratio</i>"
  source_html: "Krünitz, Oekonomische Encyklopädie, s.v. <a href=\"https://www.kruenitz1.uni-trier.de/xxx/s/ks20190.htm\">Sequestration</a>"

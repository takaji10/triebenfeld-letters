- id: "unterthanen"
  kind: "land"
  lang: "de"
  head_en: "subjects (Unterthanen)"
  head_de: "Unterthanen"
  orig: "Unterthanen"
  short_en: "The peasants of a manor: bound to its lord, owing him labour and dues, and under his court. In the Prussian estate papers the word means them, not the subjects of a king."
  short_de: "Die Bauern eines Guts: an ihren Grundherrn gebunden, ihm zu Diensten und Abgaben verpflichtet und seinem Gericht unterstellt. In diesen Dokumenten sind sie gemeint, nicht die Untertanen eines Königs."

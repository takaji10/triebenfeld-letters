  head_en: "quit-rent"
  head_de: "Erbzins"
  orig: "Erbzins"
  short_en: "A yearly rent paid for land held by inheritance: the holder had the use of it and passed it on, and the rent acknowledged that the soil remained the lord's. Unlike a lease rent, it bound the land itself, whoever held it."
  short_de: "Ein jährlicher Zins für erblich besessenes Land: der Inhaber hatte die Nutzung und vererbte sie, und der Zins erkannte an, dass der Grund dem Herrn gehörte. Anders als ein Pachtzins haftete er am Grundstück selbst, gleich wer es besaß."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Erb=Zins (https://www.kruenitz1.uni-trier.de/xxx/e/ke01206.htm)"

- id: "intressen"
  kind: "law"
  lang: "de"
  head_en: "interest (Intressen)"
  head_de: "Intressen"
  orig: "Intressen, Interessen"
  short_en: "Interest on borrowed money. \"The Intressen\" are the yearly payments on a debt, not anyone's interests or concerns."
  short_de: "Zinsen auf geliehenes Geld. „Die Intressen“ sind die jährlichen Zahlungen auf eine Schuld, nicht die Belange von jemandem."

- id: "justiz-commissarius"
  kind: "law"
  lang: "de_la"
  head_en: "justice commissary"
  head_de: "Justiz-Commissarius"
  orig: "Justiz Commissarius, Justiz Commissar"
  short_en: "A Prussian lawyer admitted to represent parties before the courts and to draw up their instruments, an attorney; many were also notaries. One was engaged to have Prince Friedrich Ludwig of Hohenlohe-Ingelfingen entered in the mortgage book as owner of the estates the King gave him."
  short_de: "Ein preußischer Jurist, zugelassen, Parteien vor Gericht zu vertreten und ihre Urkunden aufzusetzen, ein Anwalt; viele waren zugleich Notare. Einer wurde beauftragt, den Besitztitel des Fürsten im Hypothekenbuch eintragen zu lassen."

- id: "erbpacht"
  kind: "land"
  lang: "de"
  head_en: "hereditary lease"
  head_de: "Erbpacht"
  orig: "Erbpacht"
  short_en: "A lease that passed to the tenant's heirs and could be sold. The tenant paid a sum on entry and then a yearly rent, the canon, for ever; the lord kept the ownership. It was the main way in which Prince Friedrich Ludwig of Hohenlohe-Ingelfingen turned his Polish estates into money after 1798."
  short_de: "Eine Pacht, die auf die Erben überging und verkauft werden konnte. Der Pächter zahlte beim Antritt eine Summe und danach für immer einen jährlichen Zins, den Canon; das Eigentum blieb beim Grundherrn. Für den Fürsten der wichtigste Weg, Land zu Geld zu machen."
  long_en: ""
  long_de: ""
  source: ""
  check_against: "Allgemeines Landrecht 1794, Teil I Titel 18; Krünitz"
  lang_note_en: ""
  source_html: ""
  checked: false

- id: "canon"
  kind: "land"
  lang: "de_la"
  head_en: "canon"
  head_de: "Canon"
  orig: "Canon"
  short_en: "The yearly rent a hereditary tenant paid to the lord, who kept the ownership; in Latin canon emphyteuticus. Nothing to do with the church. In the hereditary leases of the Trąbczyn and Zagórów estates it is a sum of money, set in each contract."
  short_de: "Der jährliche Zins, den ein Erbpächter dem Herrn zahlte, der das Eigentum behielt; lateinisch canon emphyteuticus. Mit der Kirche hat er nichts zu tun. In den Briefen ist er eine im Vertrag festgesetzte Geldsumme."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Canon (https://www.kruenitz1.uni-trier.de/xxx/c/kc00325.htm)"

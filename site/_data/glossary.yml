- id: "patrimonialgericht"
  kind: "law"
  lang: "de"
  head_en: "patrimonial court"
  head_de: "Patrimonialgericht"
  orig: "Patrimonial Gericht"
  short_en: "The court a landowner held over the people of his estate, by a jurisdiction the King delegated with the land. It heard all matters between the lord and his peasants except criminal ones, and drew up their contracts and mortgages."
  short_de: "Das Gericht, das ein Gutsbesitzer über die Leute seines Guts hielt, kraft einer vom König mit dem Land übertragenen Gerichtsbarkeit. Es entschied alle Sachen zwischen Grundherrn und Bauern außer Strafsachen und nahm ihre Verträge und Hypotheken auf."
  long_en: "In South Prussia the Prussian General Law Code, introduced in 1796, gave the highest jurisdiction to the King, who could delegate it. Delegated with the land, it was patrimonial: it passed to each new owner, and belonged in principle to the nobility. All subjects and free persons on the estate were under it. The owner could judge in person or have a justiciary sit for him; he answered to the District Judicial Commission (Kreis-Justiz-Commission) above him, took the court fees in return for the court's costs, and might set up more than one court, but could not interfere with its rulings. Contracts and the mortgage register were much of its business, though the mortgages reached only a few of the wealthier peasants. In the Duchy of Warsaw the patrimonial courts were abolished in 1808 and their business passed to the peace courts. The Prince's court sat at Trąbczyn."
  long_de: "In Südpreußen gab das 1796 eingeführte Allgemeine Landrecht die oberste Gerichtsbarkeit dem König, der sie übertragen konnte. Mit dem Land übertragen, war sie patrimonial: sie ging auf jeden neuen Besitzer über und stand grundsätzlich dem Adel zu. Alle Untertanen und Freien auf dem Gut unterstanden ihr. Der Besitzer konnte selbst richten oder einen Justitiarius für sich sitzen lassen; er unterstand der Kreis-Justiz-Commission, erhob als Ausgleich für die Kosten des Gerichts die Gerichtsgebühren und durfte mehrere Gerichte einrichten, aber nicht in ihre Entscheidungen eingreifen. Verträge und das Hypothekenwesen waren ein großer Teil seiner Arbeit, wobei die Hypotheken nur wenige wohlhabendere Bauern erreichten. Im Herzogtum Warschau wurden die Patrimonialgerichte 1808 aufgehoben, ihre Geschäfte gingen an die Friedensgerichte. Das Gericht des Fürsten saß in Trąbczyn."
  source: "Szukaj w Archiwach, after T. Mencel's introduction to the inventory (reference/sources/patrimonial_courts_mencel.md)"
  check_against: "Allgemeines Landrecht 1794, Teil II Titel 17"
  source_html: "Szukaj w Archiwach, after T. Mencel&#x27;s introduction to the inventory"
  checked: true
  sort_en: "patrimonial court"
  initial_en: "P"
  sort_de: "patrimonialgericht"
  initial_de: "P"

- id: "gulden"
  kind: "money"
  lang: "de"
  head_en: "gulden"
  head_de: "Gulden"
  orig: "Gulden, fl."
  short_en: "The florin, written fl. In Vienna, the Austrian gulden of 60 kreuzer, in which the Prince's agent, Triebenfeld, paid his way at the Congress of 1814–15. In Polish contracts, \"Polish gulden\" is the złoty, a money of account of 30 Polish groschen."
  short_de: "Der Gulden (Florin), abgekürzt fl. In den Briefen vom Wiener Kongress der österreichische Gulden zu 60 Kreuzer (x), in dem der Beauftragte des Fürsten seine Ausgaben bestritt. In den Urkunden ist der „polnische Gulden“ der Złoty, eine Rechnungsmünze zu 30 polnischen Groschen."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Gulden (https://www.kruenitz1.uni-trier.de/xxx/g/kg04337.htm)"

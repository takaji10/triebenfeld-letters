- id: "pertinenz"
  kind: "land"
  lang: "de_la"
  head_en: "appurtenances"
  head_de: "Pertinenzien"
  orig: "Pertinenz, Pertinenzien"
  short_en: "Everything that belongs with an estate and passes with it: its villages, farms, mills, forests, rights and dues. A grant \"with all appurtenances\" gave all of them."
  short_de: "Alles, was zu einem Gut gehört und mit ihm übergeht: Dörfer, Höfe, Mühlen, Wälder, Rechte und Abgaben. Eine Schenkung „mit allen Pertinenzien“ umfasste all das."

- id: "skarbnik"
  kind: "title"
  lang: "pl"
  head_en: "Treasurer (skarbnik)"
  head_de: "Schatzmeister (Skarbnik)"
  orig: "Skarbnik, Skarbnikowi, S[karbnikowi]. W[schowskiemu]."
  short_en: "In the old Polish Commonwealth the treasurer of a land, one of its land offices (urząd ziemski); by the eighteenth century a title of honour without duties, the lowest in rank of those offices. Stanisław Chełmski of Łukom, the neighbour and adversary of the owners of Trąbczyn, was Treasurer of the land of Wschowa and is often called by the title."
  short_de: "In der alten polnischen Adelsrepublik ein Landamt (urząd ziemski) eines Bezirks, der Schatzmeister, im 18. Jahrhundert ein Ehrentitel ohne Amtsgeschäfte, der letzte im Rang der Landämter. Stanisław Chełmski auf Łukom war Schatzmeister des Landes Wschowa und wird in den Dokumenten so genannt."
  long_en: ""
  long_de: ""
  source: "Gloger, Encyklopedia staropolska, s.v. Skarbnik, vol. IV, pp. 242-243 (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Skarbnik)"
  check_against: "Gloger, Encyklopedia staropolska"

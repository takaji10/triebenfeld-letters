- id: "chirograph"
  kind: "law"
  lang: "la"
  head_en: "handwritten bond (chirographum)"
  head_de: "Handschrift (Chirographum)"
  orig: "ex Chirographo, Chirographum"
  short_en: "A debtor's acknowledgement of a debt written and signed in his own hand, not confirmed by a notary or a court. A creditor who held only such a bond had no right of pledge in the debtor's goods and ranked behind those whose claims were entered in the mortgage books. To sue \"ex chirographo\" was to sue on the strength of such a bond."
  short_de: "Die vom Schuldner eigenhändig geschriebene und unterschriebene Anerkennung einer Schuld, weder notariell noch gerichtlich bestätigt. Ein Gläubiger, der nur eine solche Handschrift besaß, hatte kein Pfandrecht an den Gütern des Schuldners und stand hinter den im Hypothekenbuch eingetragenen Gläubigern. „Ex chirographo“ klagen hieß, aus einer solchen Handschrift klagen."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Chirographarius (https://www.kruenitz1.uni-trier.de/xxx/c/kc01197.htm)"
  check_against: "Krünitz, Oekonomische Encyklopädie"
  lang_note_en: ""
  source_html: "Krünitz, Oekonomische Encyklopädie, s.v. <a href=\"https://www.kruenitz1.uni-trier.de/xxx/c/kc01197.htm\">Chirographarius</a>"
  checked: true
  sort_en: "handwritten bond (chirographum)"
  initial_en: "H"
  sort_de: "handschrift (chirographum)"
  initial_de: "H"

- id: "kopiec"
  kind: "land"
  lang: "pl"
  head_en: "boundary mound (kopiec)"
  head_de: "Grenzhügel (kopiec)"
  orig: "kopiec, kopce; in Latin scopulus"
  short_en: "A mound of earth raised to mark a boundary, in Latin scopulus. To show that it was made by hand and not by nature, things that do not rot were laid under it: the decree that fixed the boundary between Trąbczyn and Łukom in 1775 records a few whole bricks, slag, glass, stones and coals where each mound was to stand, and a glass bottle with the boundary commission's description under one of them. Corner mounds (narożne) stood where boundaries met, wall mounds (ścienne) along one side of the line; in a marsh, stakes were driven in. When the boundary between Trąbczyn and Łukom was finally marked in 1782, forty-one wall mounds were raised along it."
  short_de: "Ein Erdhügel, aufgeschüttet, um eine Grenze zu bezeichnen, lateinisch scopulus. Damit man sah, dass ihn Menschenhand gemacht hatte und nicht die Natur, legte man Unverwesliches darunter: Das Grenzdekret von 1775 (Konin Gr.145) verzeichnet einige ganze Ziegel, Schlacke, Glas, Steine und Kohlen an der Stelle jedes Hügels und unter einem von ihnen eine gläserne Flasche mit der Beschreibung der Kommission. Eckhügel (narożne) standen, wo Grenzen zusammentrafen, Wandhügel (ścienne) an einer Seite der Linie; im Sumpf schlug man Pfähle ein. Die Linie von 1782 zwischen Trąbczyn und Łukom hat einundvierzig Wandhügel (Gr.153)."
  long_en: ""
  long_de: ""
  source: "Gloger, Encyklopedia staropolska, s.v. Kopce graniczne (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Kopce_graniczne); for the mounds of Trąbczyn, the documents: Konin Gr.145 and Gr.153"

- id: "scheffel"
  kind: "money"
  lang: "de"
  head_en: "bushel (Scheffel)"
  head_de: "Scheffel"
  orig: "Scheffel"
  short_en: "The measure of grain by volume: the Prussian Scheffel held about 55 litres. Rents in kind and the yield of a mill were reckoned in it."
  short_de: "Das Hohlmaß für Getreide: der preußische Scheffel fasste etwa 55 Liter. Naturalabgaben und der Ertrag einer Mühle wurden danach berechnet."

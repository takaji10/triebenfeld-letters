  lang: "de"
  head_en: "demesne farm"
  head_de: "Vorwerk"
  orig: "Vorwerk"
  short_en: "A farm belonging to the manor itself and run for the lord, by him or by his steward, worked largely by the labour the peasants owed him. Polish folwark, from the German. A large estate had several, each working its own part of the land."
  short_de: "Ein Wirtschaftshof, der dem Gut selbst gehörte und für die Herrschaft bewirtschaftet wurde, vom Herrn selbst oder von seinem Verwalter, großenteils mit den Diensten, die die Bauern schuldeten. Polnisch folwark, aus dem Deutschen. Ein großes Gut hatte mehrere, jeder für einen Teil der Flur."

- id: "komornik"
  kind: "law"
  lang: "pl"
  head_en: "komornik (court officer)"
  head_de: "Komornik (Gerichtsbeamter)"
  orig: "komornik, Komornik; komornik graniczny, komornik ziemski; in Latin camerarius"
  short_en: "A Polish court officer. In the old Commonwealth the judges and the starosts did their work through komorniks, and the boundary komornik (komornik graniczny), who acted for the sub-chamberlain as judge of boundaries, had to be a surveyor: the decree that fixed the boundary between Trąbczyn and Łukom in 1775 names several. In the Duchy of Warsaw the komornik served writs and carried out judgments, seizures and sales, and appear so in the Prince of Hohenlohe-Ingelfingen's lawsuits there. Not the lodger komornik, who has his own entry."
  short_de: "Ein polnischer Gerichtsbeamter. In der alten Adelsrepublik ließen Richter und Starosten ihre Geschäfte durch Komorniks besorgen, und der Grenzkomornik (komornik graniczny), der für den Unterkämmerer als Grenzrichter handelte, musste Landmesser sein: Die Grenzdekrete von 1775 und 1776 nennen mehrere, die Übersetzungen heißen sie Boundary Surveyors. Im Herzogtum Warschau stellte der Komornik Ladungen zu und vollstreckte Urteile, Pfändungen und Versteigerungen, so in Triebenfelds Briefen. Nicht der Komornik als Einlieger, der einen eigenen Eintrag hat."
  long_en: ""
  long_de: ""
  source: "Gloger, Encyklopedia staropolska, s.v. Komornik (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Komornik)"
  check_against: "Gloger, Encyklopedia staropolska (komornik)"

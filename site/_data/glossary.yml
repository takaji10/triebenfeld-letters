- id: "tilsit"
  kind: "event"
  lang: "de"
  head_en: "Peace of Tilsit"
  head_de: "Frieden von Tilsit"
  orig: "Tilsit"
  short_en: "The peace of July 1807 between Napoleon, Russia and a defeated Prussia. Prussia lost half its territory, including its Polish provinces, which became the Duchy of Warsaw."
  short_de: "Der Friede vom Juli 1807 zwischen Napoleon, Russland und dem besiegten Preußen. Preußen verlor die Hälfte seines Gebiets, darunter seine polnischen Provinzen, aus denen das Herzogtum Warschau wurde."

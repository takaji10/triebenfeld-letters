- id: "centner"
  kind: "money"
  lang: "de"
  head_en: "Centner"
  head_de: "Centner"
  orig: "Centner"
  short_en: "A hundredweight: at Berlin 110 pounds, about 51 kilograms, though in Silesia 132. Goods in bulk, such as iron or wool, were weighed by it."
  short_de: "Ein Gewichtsmaß: in Berlin 110 Pfund, etwa 51 Kilogramm, in Schlesien dagegen 132. Massengüter wie Eisen oder Wolle wurden danach gewogen."

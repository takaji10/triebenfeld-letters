- id: "conducteur"
  kind: "law"
  lang: "de_fr"
  head_en: "surveyor (Conducteur)"
  head_de: "Conducteur"
  orig: "Conducteur"
  short_en: "A trained technical official of the Prussian building administration, who oversaw works for the Crown; sworn Conducteurs also measured and mapped land. On the Hohenlohe-Ingelfingen estates they surveyed land for valuation, sale or settlement."
  short_de: "Ein ausgebildeter Baubeamter der preußischen Verwaltung, der Bauten für den Staat beaufsichtigte; vereidigte Conducteure vermaßen und kartierten auch Land. In den Briefen vermessen sie Güter für Taxe, Verkauf oder Besiedlung."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Conducteur (https://www.kruenitz1.uni-trier.de/xxx/c/kc01726.htm); s.v. Bau=Conducteur (https://www.kruenitz1.uni-trier.de/xxx/b/kb00487.htm)"

- id: "congress-of-vienna"
  kind: "event"
  lang: "de"
  head_en: "Congress of Vienna"
  head_de: "Wiener Kongress"
  orig: "Congress"
  short_en: "The meeting of the European powers in 1814–15 that redrew the map after Napoleon. Triebenfeld was there for the Prince, petitioning for his lost Polish estates."
  short_de: "Die Versammlung der europäischen Mächte 1814/15, die nach Napoleon die Landkarte neu ordnete. Triebenfeld war für den Fürsten dort und bemühte sich um dessen verlorene polnische Güter."
  long_en: "From September 1814 to June 1815 the powers that had defeated Napoleon met in Vienna to settle Europe. The fate of the Duchy of Warsaw was among the hardest questions: Russia wanted it whole, Prussia wanted its Polish provinces back. The compromise gave most of it to Russia as the Kingdom of Poland and the west to Prussia as the Grand Duchy of Posen, with the border along the Prosna. Triebenfeld's letters from Vienna follow the Prince's attempt to recover his estates there, and the border question that decided on which side Trąbczyn would lie."
  long_de: "Von September 1814 bis Juni 1815 berieten die Sieger über Napoleon in Wien über die Neuordnung Europas. Das Schicksal des Herzogtums Warschau gehörte zu den schwierigsten Fragen: Russland wollte es ganz, Preußen seine polnischen Provinzen zurück. Der Kompromiss gab den größten Teil als Königreich Polen an Russland und den Westen als Großherzogtum Posen an Preußen, mit der Grenze an der Prosna. Triebenfelds Briefe aus Wien verfolgen den Versuch des Fürsten, dort seine Güter zurückzugewinnen, und die Grenzfrage, die entschied, auf welcher Seite Trąbczyn liegen würde."
  check_against: "a standard history of the Congress of Vienna"
  checked: false
  sort_en: "congress of vienna"
  initial_en: "C"
  sort_de: "wiener kongress"
  initial_de: "W"

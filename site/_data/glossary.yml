- id: "auditeur"
  kind: "law"
  lang: "de_fr"
  head_en: "Auditeur"
  head_de: "Auditeur"
  orig: "Auditeur"
  short_en: "The legal officer of a military court: the lawyer of a regiment, garrison or fortress government, who conducted its proceedings and kept its record. An auditeur of the governor's court at Wrocław certified several copies of the King's grants of estates to Prince Friedrich Ludwig of Hohenlohe-Ingelfingen."
  short_de: "Der Jurist eines Militärgerichts bei einem Regiment, einer Garnison oder einem Festungsgouvernement, der dessen Verfahren führte und die Akten hielt. Ein Gouvernements-Auditeur in Breslau beglaubigte mehrere Abschriften der Schenkungen."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Regimentsauditeur (https://www.kruenitz1.uni-trier.de/xxx/r/kr01984.htm)"

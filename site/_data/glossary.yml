- id: "term-days"
  kind: "phrase"
  lang: "de"
  head_en: "Midsummer, Michaelmas, Martinmas"
  head_de: "Johannis, Michaelis, Martini"
  orig: "Johannis, Michaelis, Martini"
  short_en: "Saints' days that served as the year's fixed dates for business: St John's Day (24 June), Michaelmas (29 September) and Martinmas (11 November). Rents and interest fell due, and leases began and ended, on such days."
  short_de: "Heiligentage, die im Jahr als feste Geschäftstermine dienten: Johannis (24. Juni), Michaelis (29. September) und Martini (11. November). An ihnen wurden Pacht und Zinsen fällig, begannen und endeten Pachten."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Johannis=Tag (https://www.kruenitz1.uni-trier.de/xxx/j/kj01182.htm); s.v. Martins=Tag (https://www.kruenitz1.uni-trier.de/xxx/m/km02524.htm)"

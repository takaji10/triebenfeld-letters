- id: "south-prussia"
  kind: "event"
  lang: "de"
  head_en: "South Prussia"
  head_de: "Südpreußen"
  orig: "Südpreußen"
  short_en: "The Prussian province made from the Polish lands taken in the partitions of 1793 and 1795, with Posen, Kalisch and Warsaw. It lasted until 1807. Trąbczyn and the Prince's other Polish estates lay in it."
  short_de: "Die preußische Provinz aus den polnischen Gebieten, die in den Teilungen von 1793 und 1795 an Preußen fielen, mit Posen, Kalisch und Warschau. Sie bestand bis 1807. Trąbczyn und die anderen polnischen Güter des Fürsten lagen in ihr."
  long_en: "Prussia took the western part of Greater Poland in the Second Partition of 1793, and Warsaw with the lands around it in the Third, of 1795, and made of them the province of South Prussia. The estates of Poles who had joined the Kościuszko uprising of 1794 were confiscated, and in 1796 the King gave many of them to Prussian generals and officials; that is how Trąbczyn came to the Prince of Hohenlohe-Ingelfingen. The province was run on Prussian lines, with Chambers at Posen, Petrikau (later Kalisch) and Warsaw, and the Prussian mortgage book. After Prussia's defeat in 1806 it was lost, and in 1807 it became most of the Duchy of Warsaw."
  long_de: "Preußen nahm in der Zweiten Teilung 1793 den Westen Großpolens, in der Dritten 1795 Warschau mit seinem Umland, und machte daraus die Provinz Südpreußen. Die Güter von Polen, die sich dem Kościuszko-Aufstand von 1794 angeschlossen hatten, wurden eingezogen, und 1796 schenkte der König viele davon preußischen Generalen und Beamten; so kam Trąbczyn an den Fürsten zu Hohenlohe-Ingelfingen. Die Provinz wurde nach preußischem Muster verwaltet, mit Kammern in Posen, Petrikau (später Kalisch) und Warschau und dem preußischen Hypothekenbuch. Nach der Niederlage von 1806 ging sie verloren und wurde 1807 zum größten Teil des Herzogtums Warschau."
  check_against: "a standard history of the Partitions"
  checked: false
  sort_en: "south prussia"
  initial_en: "S"
  sort_de: "sudpreußen"

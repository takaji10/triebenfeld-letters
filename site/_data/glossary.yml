- id: "estaffette"
  kind: "law"
  lang: "de_fr"
  head_en: "express courier (Estaffette)"
  head_de: "Estaffette"
  orig: "Estaffette"
  short_en: "A letter sent express by mounted postilions, dispatched out of turn, each riding to the next post station, where another took it on. It was costly, and used when an answer could not wait for the ordinary post."
  short_de: "Ein Eilbrief, von reitenden Postillionen außer der Reihe befördert, jeder bis zur nächsten Poststation, wo ein anderer ihn übernahm. Teuer und nur genutzt, wenn eine Antwort nicht auf die gewöhnliche Post warten konnte."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Staffette (https://www.kruenitz1.uni-trier.de/xxx/s/ks29522.htm)"

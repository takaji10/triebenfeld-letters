- id: "dismembration"
  kind: "land"
  lang: "de_la"
  head_en: "dismemberment"
  head_de: "Dismembration"
  orig: "Dismembration"
  short_en: "The breaking-up of an estate into separate holdings to be sold or let. In Prussia it needed the state's consent, which is why Prince Friedrich Ludwig of Hohenlohe-Ingelfingen's plans to divide Trąbczyn and Zagórów among settlers waited on ministers in Berlin."
  short_de: "Die Zerschlagung eines Guts in einzelne Stellen, die verkauft oder verpachtet werden. In Preußen bedurfte sie der staatlichen Genehmigung; deshalb warteten die Pläne des Fürsten für seine Güter auf die Minister."

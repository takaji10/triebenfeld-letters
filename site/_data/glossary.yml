- id: "wozny"
  kind: "law"
  lang: "pl"
  head_en: "woźny (court messenger)"
  head_de: "Woźny (Gerichtsbote)"
  orig: "woźny, Woźny; in Latin ministerialis"
  short_en: "A sworn officer of a Polish court, in Latin ministerialis. He served summonses on the parties, called out the court's orders in public, and went to see wounds, damage or a boundary and reported what he saw to the court's books. His report that a summons had been served made it valid. The office went on in the courts of the Kingdom of Poland in the nineteenth century."
  short_de: "Ein vereidigter Bediensteter eines polnischen Gerichts, lateinisch ministerialis. Er stellte den Parteien die Ladungen zu, rief die Anordnungen des Gerichts öffentlich aus, besichtigte Wunden, Schäden oder eine Grenze und berichtete darüber in die Bücher des Gerichts. Erst sein Bericht über die Zustellung machte eine Ladung gültig. Das Amt bestand in den Gerichten des Königreichs Polen im neunzehnten Jahrhundert fort. Die deutschen Texte nennen ihn Gerichtsbote."
  long_en: ""
  long_de: ""
  source: ""

- id: "donation"
  kind: "land"
  lang: "de_la"
  head_en: "donation (royal grant)"
  head_de: "Donation"
  orig: "Donation, Donations-Güter"
  short_en: "A gift of land by the King. In 1796–97 Friedrich Wilhelm II gave estates confiscated in South Prussia to generals and officials as donations; the Polish estates of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, Trąbczyn among them, were such donation estates (Donationsgüter)."
  short_de: "Eine Schenkung von Land durch den König. 1796/97 schenkte Friedrich Wilhelm II. in Südpreußen eingezogene Güter an Generale und Beamte; die polnischen Güter des Fürsten waren solche Donationsgüter."
  long_en: ""
  long_de: ""
  source: ""
  check_against: "Acta Borussica; a standard history of South Prussia"

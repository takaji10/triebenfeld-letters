  short_de: "Das alleinige Recht des Grundherrn, auf seinem Gut Bier zu brauen, Branntwein zu brennen und Met zu bereiten und Getränke auszuschenken, ein Vorrecht des polnischen Adels (propinacja), das aus dem Eigentum am Land folgte. Meist war es verpachtet, oft an einen Krüger, und Käufer und Pächter der Güter verhandelten darum."

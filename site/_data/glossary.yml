- id: "ex-officio"
  kind: "law"
  lang: "la"
  head_en: "ex officio"
  head_de: "ex officio"
  orig: "ex officio"
  short_en: "\"By virtue of office\": done by an authority on its own motion, because its duty required it, not at a party's request. Entries in the mortgage book were often made ex officio."
  short_de: "„Von Amts wegen“: von einer Behörde aus eigenem Antrieb vorgenommen, weil ihr Amt es verlangte, nicht auf Antrag einer Partei. Eintragungen ins Hypothekenbuch geschahen oft ex officio."

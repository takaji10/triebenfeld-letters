- id: "pro-memoria"
  kind: "law"
  lang: "la"
  head_en: "Pro Memoria"
  head_de: "Pro Memoria"
  orig: "Pro Memoria"
  short_en: "A memorandum: a written request, statement of a case or simple reminder, headed \"Pro Memoria\" in place of titles and address, and handed in rather than sent as a personal letter."
  short_de: "Eine Denkschrift: eine schriftliche Bitte, Darlegung einer Sache oder bloße Erinnerung, die statt Titel und Anrede „Pro Memoria“ zur Überschrift hat und eingereicht, nicht als persönlicher Brief geschickt wird."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Promemoria (https://www.kruenitz1.uni-trier.de/xxx/p/kp07809.htm)"

- id: "stawisko"
  kind: "land"
  lang: "pl"
  head_en: "stawisko"
  head_de: "Stawisko"
  orig: "stawisko"
  short_en: "A Polish word for a large, boggy pond, or for ground taken up by a pond or left where one had been. Here it is the boggy ground on the boundary between the neighbouring estates of Trąbczyn and Łukom, near Konin, overgrown with trees, which the owners of the two estates disputed from 1728: who owned it, and the dams whose water flooded it. Some acts use the word as that ground's name, Stawisko."
  short_de: "Ein polnisches Wort für einen großen, sumpfigen Teich oder für Grund, den ein Teich einnimmt oder den er hinterlassen hat. Hier ist es der sumpfige, mit Bäumen bewachsene Grund an der Grenze zwischen Trąbczyn und Łukom, um den die Besitzer der beiden Güter seit 1728 stritten: um das Eigentum und um die Dämme, deren Wasser ihn überflutete. Manche Akten gebrauchen das Wort als Namen dieses Grundes, Stawisko. Die Übersetzungen lassen es polnisch stehen."
  long_en: ""
  long_de: ""
  source: "Arct, Słownik ilustrowany języka polskiego (1916), vol. 2, p. 784, s.v. Stawisko (https://pl.wikisource.org/wiki/M._Arcta_S%C5%82ownik_ilustrowany_j%C4%99zyka_polskiego/Stawisko); for the ground, the documents: Konin Gr.145, Gr.114 and Gr.153"
  check_against: "Arct, Słownik ilustrowany języka polskiego"
  lang_note_en: ""
  source_html: "Arct, Słownik ilustrowany języka polskiego (1916), vol. 2, p. 784, s.v. <a href=\"https://pl.wikisource.org/wiki/M._Arcta_S%C5%82ownik_ilustrowany_j%C4%99zyka_polskiego/Stawisko\">Stawisko</a>; for the ground, the documents: Konin Gr.145, Gr.114 and Gr.153"

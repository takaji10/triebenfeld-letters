- id: "kammer"
  kind: "law"
  lang: "de"
  head_en: "Chamber"
  head_de: "Kammer"
  orig: "Cammer, Kammer"
  short_en: "The Kriegs- und Domänenkammer, the board that ran a Prussian province: its taxes, crown lands, settlement and police. South Prussia's chambers sat at Posen and at Petrikau, later Kalisch. In 1808 their work passed to new administrative boards, also called Governments (Regierungen)."
  short_de: "Die Kriegs- und Domänenkammer, die Behörde, die eine preußische Provinz verwaltete: Steuern, Domänen, Siedlung und Polizei. Die südpreußischen Kammern saßen in Posen und in Petrikau, später in Kalisch. 1808 traten die „Regierungen“ an ihre Stelle."

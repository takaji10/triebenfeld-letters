  head_en: "Courant"
  head_de: "Courant"
  orig: "Courant"
  short_en: "The coin current in everyday trade, as against gold: in Prussia the silver thaler and its parts, small change apart. A sum \"in Courant\" was paid in silver; a sum \"in Gold\" in gold coin, worth more. Contracts and accounts kept the two strictly apart."
  short_de: "Die im täglichen Handel umlaufende Münze, im Gegensatz zum Gold: in Preußen der Silbertaler und seine Teilstücke, ohne die Scheidemünze. Eine Summe „in Courant“ wurde in Silber gezahlt, eine „in Gold“ in den höherwertigen Goldmünzen. Die Briefe halten beides streng auseinander."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Current=Geld (https://www.kruenitz1.uni-trier.de/xxx/c/kc02385.htm); s.v. Pistole (https://www.kruenitz1.uni-trier.de/xxx/p/kp05380.htm)"

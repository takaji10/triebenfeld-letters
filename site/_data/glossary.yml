- id: "komornik-lodger"
  kind: "law"
  lang: "pl"
  head_en: "komornik (lodger)"
  head_de: "Komornik (Einlieger)"
  orig: "komornik, komornica; plural komornicy, komornice; German Komornitzen"
  short_en: "In the Polish countryside, a peasant without land of his own, or a woman (komornica), who lived in a room or hut of the manor or of a farmer and worked for it, paid with the room, a garden and other small benefits: the lowest rank of a village. An inspection of the estate of Trąbczyn, near Konin, in 1754 counted eight; a Prussian valuation of the neighbouring Szetlewek in 1803 calls them Einlieger; and when the farm of Kopojno was let in 1805, each was to have four Morgen. Not the court officer komornik, who has his own entry."
  short_de: "Auf dem polnischen Land ein Bauer ohne eigenes Land, oder eine Frau (komornica), der in einer Kammer oder Kate des Gutshofs oder eines Bauern wohnte und für ihn arbeitete, entlohnt mit der Kammer, einem Garten und anderen kleinen Vorteilen: der unterste Stand im Dorf. Die Besichtigung von Trąbczyn von 1754 zählt acht; die preußische Taxe von Szetlewek von 1803 nennt sie Einlieger; in Kopojno sollte 1805 jeder vier Morgen erhalten. Nicht der Gerichtsbeamte Komornik, der einen eigenen Eintrag hat."
  long_en: ""
  long_de: ""
  source: "Gloger, Encyklopedia staropolska, s.v. Komornik (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Komornik)"

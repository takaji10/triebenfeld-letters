- id: "hypothekenbuch"
  kind: "law"
  lang: "de"
  head_en: "mortgage book"
  head_de: "Hypothekenbuch"
  orig: "Hypothequenbuch, Hypothequenschein"
  short_en: "The Prussian land register. Each estate had its folio, recording who owned it and every debt secured on it, in order of rank. A mortgage certificate (Hypothekenschein) is an official extract from it."
  short_de: "Das preußische Grundbuch. Jedes Gut hatte sein Blatt, auf dem der Eigentümer und jede darauf gesicherte Schuld in ihrer Rangfolge standen. Ein Hypothekenschein ist ein amtlicher Auszug daraus."

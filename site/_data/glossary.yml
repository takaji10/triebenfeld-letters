- id: "decret"
  kind: "law"
  lang: "de_la"
  head_en: "decree (Decret)"
  head_de: "Decret"
  orig: "Decret, Decretum"
  short_en: "A written order of a court or an office, often a short ruling written on the petition itself. \"Vigore Decreti\", by virtue of the decree, cites the order an entry rests on."
  short_de: "Eine schriftliche Verfügung eines Gerichts oder einer Behörde, oft ein kurzer Bescheid auf der Eingabe selbst. „Vigore Decreti“, kraft der Verfügung, nennt die Anordnung, auf der eine Eintragung beruht."
  long_en: ""
  long_de: ""
  source: "Adelung, Grammatisch-kritisches Wörterbuch, s.v. Decret (https://woerterbuchnetz.de/?sigle=Adelung&lemid=D00316)"

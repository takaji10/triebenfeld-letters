- id: "regierung"
  kind: "law"
  lang: "de"
  head_en: "Government (Regierung)"
  head_de: "Regierung"
  orig: "Regierung"
  short_en: "Before 1808 a Prussian province's \"Government\" (Regierung) was its high court of law, keeper of the mortgage book; the Chamber did the administering. After the reforms of 1808 the name passed to the new administrative boards, and the courts became Oberlandesgerichte. Before 1808 the Prussian deeds place the estates around Konin \"under the jurisdiction\" of the Government at Posen."
  short_de: "Vor 1808 war die „Regierung“ einer preußischen Provinz ihr oberstes Gericht und führte das Hypothekenbuch; verwaltet hat die Kammer. Nach den Reformen von 1808 ging der Name auf die neuen Verwaltungsbehörden über, und die Gerichte wurden zu Oberlandesgerichten. Die Urkunden stellen Güter „unter die Gerichtsbarkeit“ der Regierung zu Posen."
  long_en: ""
  long_de: ""
  source: ""
  check_against: "Acta Borussica; Allgemeine Gerichtsordnung 1793"

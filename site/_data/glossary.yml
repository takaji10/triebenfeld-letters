- id: "departement"
  kind: "law"
  lang: "de_fr"
  head_en: "department (Departement)"
  head_de: "Departement"
  orig: "Departement"
  short_en: "In Prussia, a branch of the ministry under a departmental minister (the finance department, the military department). In the Duchy of Warsaw, one of the provinces into which it was divided on the French model, each governed from one seat, such as the department of Poznań or of Kalisz."
  short_de: "Zweierlei. Ein Zweig des preußischen Ministeriums unter einem Departementsminister (das Finanzdepartement, das Militärdepartement). Und ein von einem Sitz aus verwalteter Bezirk, etwa das Posensche Departement; im Herzogtum Warschau dessen Provinzen."

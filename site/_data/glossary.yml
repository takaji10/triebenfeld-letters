- id: "landschaft"
  kind: "law"
  lang: "de"
  head_en: "Landschaft"
  head_de: "Landschaft"
  orig: "Landschaft, Pfandbriefe"
  short_en: "A credit association of the landowners of a province. It lent to its members on their estates, up to half their assessed value, raising the money by issuing mortgage bonds (Pfandbriefe) that the association stood behind. Not a landscape."
  short_de: "Ein Kreditverband der Gutsbesitzer einer Provinz. Er lieh seinen Mitgliedern Geld auf ihre Güter, bis zur Hälfte des geschätzten Werts, und beschaffte es durch Pfandbriefe, für die der Verband einstand."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Credit=System (https://www.kruenitz1.uni-trier.de/xxx/c/kc02210.htm); s.v. Pfandbrief (https://www.kruenitz1.uni-trier.de/xxx/p/kp03129.htm)"

- id: "partitions"
  kind: "event"
  lang: "pl"
  head_en: "Partitions of Poland"
  head_de: "Teilungen Polens"
  orig: "rozbiory"
  short_en: "The three divisions of the Polish–Lithuanian Commonwealth between Russia, Prussia and Austria, in 1772, 1793 and 1795, which ended its existence as a state. The estates in these documents came to Prussia in the second."
  short_de: "Die drei Aufteilungen Polen-Litauens zwischen Russland, Preußen und Österreich 1772, 1793 und 1795, mit denen es als Staat zu bestehen aufhörte. Die Güter in diesen Dokumenten kamen mit der zweiten an Preußen."
  long_en: "In 1772 the three neighbouring powers took a quarter of the Commonwealth's territory. In 1793 Russia and Prussia took more, Prussia gaining Greater Poland with Posen and Kalisch. After the Kościuszko uprising of 1794 was crushed, the third partition of 1795 divided what remained, and Prussia took Warsaw. The Polish nobility who had owned these lands lost them, or kept them under foreign rule; the confiscated estates of those who had risen in 1794 were what the King of Prussia gave away in 1796."
  long_de: "1772 nahmen die drei Nachbarmächte ein Viertel des Staatsgebiets. 1793 nahmen Russland und Preußen mehr, Preußen erhielt Großpolen mit Posen und Kalisch. Nach der Niederschlagung des Kościuszko-Aufstands von 1794 teilte die Dritte Teilung 1795 den Rest, und Preußen erhielt Warschau. Der polnische Adel, dem dieses Land gehört hatte, verlor es oder behielt es unter fremder Herrschaft; die eingezogenen Güter der Aufständischen von 1794 waren es, die der König von Preußen 1796 verschenkte."
  check_against: "a standard history of the Partitions"
  checked: false
  sort_en: "partitions of poland"
  initial_en: "P"
  sort_de: "teilungen polens"
  initial_de: "T"

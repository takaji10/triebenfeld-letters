- id: "hufe"
  kind: "money"
  lang: "de"
  head_en: "Hufe"
  head_de: "Hufe"
  orig: "Hufe, Hufen"
  short_en: "A farm holding and a measure of land: the arable one household could live on, reckoned at 30 Morgen. Its size varied with the Morgen; the Hufe of Chełmno (Kulm) law usual in Greater Poland, the Polish włóka, was about 17 hectares, and in Greater Poland the włóka itself was often called Hufe. Settlers on the estates of Trąbczyn and Zagórów were let land by the Hufe."
  short_de: "Ein Bauernhof und zugleich ein Flächenmaß: das Ackerland, von dem ein Haushalt leben konnte, zu 30 Morgen gerechnet. Die Größe schwankte mit dem Morgen; die hier übliche kulmische Hufe, polnisch włóka, maß etwa 17 Hektar, und in Großpolen hieß die włóka selbst oft Hufe. Den Siedlern auf den Gütern wurde Land nach Hufen ausgetan."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Hufe (https://www.kruenitz1.uni-trier.de/xxx/h/kh04717.htm); Gloger, Encyklopedia staropolska, s.v. Włóka (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Włóka)"
  check_against: "Krünitz, Oekonomische Encyklopädie; Gloger, Encyklopedia staropolska (włóka)"
  lang_note_en: ""
  source_html: "Krünitz, Oekonomische Encyklopädie, s.v. <a href=\"https://www.kruenitz1.uni-trier.de/xxx/h/kh04717.htm\">Hufe</a>; Gloger, Encyklopedia staropolska, s.v. <a href=\"https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Włóka\">Włóka</a>"

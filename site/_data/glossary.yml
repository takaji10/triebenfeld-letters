  head_de: "Reichsthaler"
  orig: "Rthl, rt."
  short_en: "The Prussian unit of account, a silver thaler, written Rthl or rt. It was divided into 24 Groschen of 12 Pfennig each. Nearly every sum in the Prince of Hohenlohe-Ingelfingen's affairs, 1796 to 1816, is reckoned in it."
  short_de: "Die preußische Rechnungseinheit, ein Silbertaler, abgekürzt Rthl oder rt. Er galt 24 Groschen zu je 12 Pfennig. Fast jede Summe in den Briefen ist in ihm gerechnet."

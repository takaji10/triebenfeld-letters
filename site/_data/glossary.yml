- id: "vidimirt"
  kind: "law"
  lang: "de_la"
  head_en: "certified copy (vidimus)"
  head_de: "vidimirte Abschrift"
  orig: "vidimirt, vidimata"
  short_en: "A copy that a notary or an authorised official has compared with the original and certified as true, from the Latin vidimus, \"we have seen\". Such a copy could stay in the files in place of the original, and many of the deeds of the Hohenlohe-Ingelfingen estates survive only in such copies."
  short_de: "Eine Abschrift, die ein Notar oder eine dazu befugte Amtsperson mit dem Original verglichen und als richtig beglaubigt hat, vom lateinischen vidimus, „wir haben gesehen“. Sie konnte statt des Originals bei den Akten bleiben; viele der Urkunden sind nur in solchen Abschriften erhalten."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Vidimiren (https://www.kruenitz1.uni-trier.de/xxx/v/kv07838.htm); Grimm, Deutsches Wörterbuch, s.v. vidimieren (https://woerterbuchnetz.de/?sigle=DWB&lemid=V07186)"

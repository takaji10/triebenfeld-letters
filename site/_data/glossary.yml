- id: "kreis-justiz-commission"
  kind: "law"
  lang: "de"
  head_en: "District Judicial Commission"
  head_de: "Kreis-Justiz-Commission"
  orig: "Kreis Justiz Commission, Kreis Justiz Rath"
  short_en: "In South Prussia, the royal court of a district, above the patrimonial courts: the owner who held a patrimonial court answered to it. Its members were Kreis-Justiz-Räthe."
  short_de: "In Südpreußen das königliche Gericht eines Kreises, den Patrimonialgerichten übergeordnet: der Gutsbesitzer, der ein Patrimonialgericht hielt, unterstand ihr. Ihre Mitglieder waren Kreis-Justiz-Räthe."
  long_en: ""

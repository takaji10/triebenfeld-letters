- id: "morgen"
  kind: "money"
  lang: "de"
  head_en: "Morgen"
  head_de: "Morgen"
  orig: "Morgen"
  short_en: "A measure of land, roughly what a team could plough in a day or, as the name was explained, in a morning. The Prussian (Magdeburg) Morgen of 180 square rods was about a quarter of a hectare; other Morgen were larger, so a document often names the one it means."
  short_de: "Ein Flächenmaß, ungefähr das, was ein Gespann an einem Tag oder, nach der Deutung des Namens, an einem Vormittag pflügen konnte. Der preußische (Magdeburger) Morgen zu 180 Quadratruten maß etwa einen Viertelhektar; andere Morgen waren größer, weshalb ein Dokument oft angibt, welcher gemeint ist."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Morgen (https://www.kruenitz1.uni-trier.de/xxx/m/km08444.htm); s.v. Hufe (https://www.kruenitz1.uni-trier.de/xxx/h/kh04717.htm)"

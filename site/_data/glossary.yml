  short_de: "Die im täglichen Handel umlaufende Münze, im Gegensatz zum Gold: in Preußen der Silbertaler und seine Teilstücke, ohne die Scheidemünze. Eine Summe „in Courant“ wurde in Silber gezahlt, eine „in Gold“ in den höherwertigen Goldmünzen. Die Briefe halten beides streng auseinander."

  short_en: "In the old Polish Commonwealth, a nobleman to whom the king gave crown lands (a starostwo) as a reward, in practice for life. A castle starost also held the district's courts and kept the peace in it; others only ran the lands. After the partitions the title stayed with those who held such lands. Prusimski, the estates' former owner, was a starost."
  short_de: "In der alten polnischen Adelsrepublik ein Adliger, dem der König Krongüter (ein starostwo) zur Belohnung überließ, praktisch auf Lebenszeit. Ein Burgstarost hielt zudem die Gerichte des Bezirks und wahrte dort den Frieden; die übrigen verwalteten nur die Güter. Nach den Teilungen blieb der Titel denen, die solche Güter besaßen. Prusimski, der frühere Besitzer der Güter, war Starost."

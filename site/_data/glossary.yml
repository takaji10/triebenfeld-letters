- id: "grzywna"
  kind: "money"
  lang: "pl"
  head_en: "grzywna (plural grzywny)"
  head_de: "grzywna (Plural grzywny)"
  orig: "grzywna, grzywny, grzywien"
  short_en: "The Polish mark (Latin marca, German Mark): first a weight of about half a pound for silver and gold, from which the coins were struck, 48 groszy to the grzywna of Kraków from the fourteenth century; then a unit of account, in which the courts set fines and penalties, as in the boundary decree between Trąbczyn and Łukom of 1775. In the Latin documents it is the mark."
  short_de: "Die polnische Mark (lateinisch marca): zuerst ein Gewicht von etwa einem halben Pfund für Silber und Gold, aus dem die Münzen geschlagen wurden, seit dem 14. Jahrhundert 48 Groschen auf die Krakauer grzywna; dann eine Rechnungseinheit, in der die Gerichte Strafen und Bußen festsetzten, so im Grenzdekret zwischen Trąbczyn und Łukom von 1775. In den lateinischen Dokumenten ist es die Mark."
  long_en: ""
  long_de: ""
  source: "Gloger, Encyklopedia staropolska, II, s.v. Grzywna (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Grzywna)"
  check_against: "Gloger"

- id: "majorat"
  kind: "land"
  lang: "de"
  head_en: "entail"
  head_de: "Majorat"
  orig: "Majorat"
  short_en: "An estate settled so that it passed whole to the eldest heir and could not be sold or divided. In 1805 Prince Friedrich Ludwig of Hohenlohe-Ingelfingen bound his Silesian estates and his Polish estates of Trąbczyn and Zagórów in this way, to pass undivided to one heir."
  short_de: "Ein Besitz, der ungeteilt an den ältesten Erben fiel und weder verkauft noch geteilt werden durfte. 1805 band der Fürst seine schlesischen und südpreußischen Güter auf diese Weise."

- id: "schulze"
  kind: "land"
  lang: "de"
  head_en: "village mayor (Schulze)"
  head_de: "Schulze"
  orig: "Schulze, Scholtisey"
  short_en: "The head of a village, answerable to the lord for its dues and order, and judge in small matters with assessors chosen from the villagers; Polish sołtys, from the German Schultheiß. A free Schulze held the office and its land by inheritance, free of dues. His holding is the Scholtisey."
  short_de: "Das Oberhaupt eines Dorfes, dem Grundherrn für Abgaben und Ordnung verantwortlich und mit Schöffen aus dem Dorf Richter in kleinen Sachen; polnisch sołtys, aus dem deutschen Schultheiß. Ein Freischulze besaß Amt und Land erblich und abgabenfrei. Sein Hof ist die Scholtisey."
  long_en: ""
  long_de: ""
  source: "Gloger, Encyklopedia staropolska, s.v. Sołtys, sołtystwo (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Sołtys,_sołtystwo)"

  short_en: "Land held from a lord or the crown in return for loyalty and service, which the holder could not freely sell. By 1800 most Prussian fiefs had been turned into outright property."
  short_de: "Land, das von einem Herrn oder der Krone gegen Treue und Dienst verliehen war und nicht frei verkauft werden durfte. Um 1800 waren die meisten preußischen Lehen in freies Eigentum umgewandelt."

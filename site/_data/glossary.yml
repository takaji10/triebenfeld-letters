- id: "execution"
  kind: "law"
  lang: "de_la"
  head_en: "execution"
  head_de: "Execution"
  orig: "Execution"
  short_en: "Enforcement of a judgment or a debt by the authorities: seizing goods, quartering soldiers on the debtor, or selling his property. It never means putting anyone to death in these letters."
  short_de: "Die Vollstreckung eines Urteils oder einer Schuld durch die Behörden: Pfändung, Einquartierung beim Schuldner oder Verkauf seines Besitzes. Eine Hinrichtung ist in diesen Briefen nie gemeint."

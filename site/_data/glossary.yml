- id: "herrschaft"
  kind: "land"
  lang: "de"
  head_en: "lordship"
  head_de: "Herrschaft"
  orig: "Herrschaft"
  short_en: "An estate made up of several villages and farms under one lord, with his rights over them: \"the lordship of Betsche\" is a territory. Paid \"to the Herrschaft\", money goes to the lord or the estate's management."
  short_de: "Ein Besitz aus mehreren Dörfern und Höfen unter einem Grundherrn, samt seinen Rechten darüber: „die Herrschaft Betsche“ ist ein Gebiet. Was „an die Herrschaft“ gezahlt wird, geht an den Grundherrn oder die Gutsverwaltung."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Herrschaft (https://www.kruenitz1.uni-trier.de/xxx/h/kh02611.htm)"

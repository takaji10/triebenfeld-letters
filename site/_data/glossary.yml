- id: "inventarium"
  kind: "land"
  lang: "la"
  head_en: "inventory (Inventarium)"
  head_de: "Inventarium"
  orig: "Inventarium"
  short_en: "The livestock, implements and seed that belonged to a farm, and the list of them drawn up when it changed hands: \"Vieh und Feld Inventarium\". A lease said whether the tenant took it over, and at what value; a missing inventory was deducted."
  short_de: "Das Vieh, die Geräte und das Saatgut, die zu einem Hof gehörten, und ihr Verzeichnis, aufgenommen, wenn der Hof den Inhaber wechselte: „Vieh und Feld Inventarium“. Eine Pacht regelte, ob und zu welchem Wert der Pächter es übernahm; fehlendes Inventar wurde abgezogen."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Inventarium (https://www.kruenitz1.uni-trier.de/xxx/j/kj01092.htm)"

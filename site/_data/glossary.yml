- id: "intabulation"
  kind: "law"
  lang: "de_la"
  head_en: "intabulation"
  head_de: "Intabulation"
  orig: "Intabulation"
  short_en: "Entering an owner's title or a debt in the mortgage book. Only an intabulated debt was secured on the land and ranked against other creditors."
  short_de: "Die Eintragung eines Besitztitels oder einer Schuld in das Hypothekenbuch. Nur eine eingetragene Schuld war auf dem Grundstück gesichert und hatte ihren Rang unter den Gläubigern."
  long_en: ""
  long_de: ""
  source: ""

- id: "pisarz"
  kind: "law"
  lang: "pl"
  head_en: "pisarz (court clerk)"
  head_de: "Pisarz (Gerichtsschreiber)"
  orig: "pisarz ziemski, pisarz grodzki; in Latin notarius (terrestris, castrensis)"
  short_en: "The writer of a court or an office, in Latin notarius. The lowest in rank of a court's members and often without a vote, he yet did almost all its work, keeping its books and writing its judgments into the book of decrees. The land clerk (pisarz ziemski), elected like the judges, sat in the land court with the judge and the sub-judge: in 1778 the land clerk of Kalisz, Ksawery Mikorski, sat with them when the court heard the suit between the owners of Trąbczyn and Łukom. The castle court (gród) and other offices, a customs post among them, had their own. He is not the notary public, who has his own entry."
  short_de: "Der Schreiber eines Gerichts oder eines Amtes, lateinisch notarius. Gloger: im Rang das niedrigste Mitglied eines Gerichts und oft ohne Stimme, besorgte er doch fast dessen ganze Arbeit, führte seine Bücher und schrieb die Urteile in das Dekretbuch. Der Landschreiber (pisarz ziemski), wie die Richter gewählt, saß mit dem Richter und dem Unterrichter im Landgericht: 1778 saß Ksawery Mikorski, Landschreiber von Kalisch, mit ihnen (Konin Gr.117). Das Burggericht (gród) und andere Ämter, darunter eine Zollstelle, hatten ihre eigenen. Die englischen Übersetzungen nennen ihn Notary, Clerk oder Scribe; er ist nicht der Notar, der einen eigenen Eintrag hat."
  long_en: ""
  long_de: ""
  source: "Gloger, Encyklopedia staropolska, s.v. Pisarze (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Pisarze)"
  check_against: "Gloger, Encyklopedia staropolska (pisarze)"
  lang_note_en: ""
  source_html: "Gloger, Encyklopedia staropolska, s.v. <a href=\"https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Pisarze\">Pisarze</a>"

- id: "hofrath"
  kind: "title"
  lang: "de"
  head_en: "Court Councillor"
  head_de: "Hofrath"
  orig: "Hofrath, Hoffrath"
  short_en: "Properly a councillor at a prince's court, the Hof being his household and government; by this time often a mere title of rank, given to officials, lawyers and agents in his service with no post attached. The court is the prince's, not a court of law."
  short_de: "Eigentlich ein Rat am Hof eines Fürsten, also bei seiner Hofhaltung und Regierung; inzwischen oft ein bloßer Rangtitel, an Beamte, Juristen und Beauftragte in seinem Dienst verliehen, ohne damit verbundenes Amt. Der Hof ist der des Fürsten, kein Gericht."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Hof=Rath (https://www.kruenitz1.uni-trier.de/xxx/h/kh03543.htm)"

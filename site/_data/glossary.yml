- id: "kriegsrath"
  kind: "law"
  lang: "de"
  head_en: "Councillor of War"
  head_de: "Kriegsrath"
  orig: "Kriegsrath, Kriegs- und Domänenrath"
  short_en: "A member of a Chamber (Kriegs- und Domänenrat), or the title alone, granted as an honour. It had long ceased to mean anything military. Peter Friedrich von Triebenfeld, the Prince of Hohenlohe-Ingelfingen's agent, held the title of Councillor of War and Forests."
  short_de: "Mitglied einer Kammer (Kriegs- und Domänenrat) oder der Titel allein, als Auszeichnung verliehen. Mit dem Militär hatte er längst nichts mehr zu tun. Triebenfeld war Kriegs- und Forstrath."

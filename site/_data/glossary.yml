- id: "gouvernement"
  kind: "law"
  lang: "de_fr"
  head_en: "General Government (Gouvernement)"
  head_de: "Gouvernement"
  orig: "Gouvernement, General-Gouvernement"
  short_en: "The French military government of occupied Prussia, seated in Berlin from 1806 to 1808, which collected contributions and gave orders to Prussian offices. Elsewhere a Gouvernement is a fortress governor's office, with its own court and judge (Auditeur)."
  short_de: "Die französische Militärregierung des besetzten Preußens mit Sitz in Berlin 1806 bis 1808, die Kontributionen eintrieb und preußischen Behörden Befehle gab. Sonst ist ein Gouvernement das Amt eines Festungsgouverneurs, mit eigenem Gericht und Auditeur."

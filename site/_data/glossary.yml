- id: "propination"
  kind: "land"
  lang: "de_la"
  head_en: "propination"
  head_de: "Propination"
  orig: "Propination"
  short_en: "The lord's sole right to brew beer, distil spirits and make mead on his estate, and to sell drink there, a right of the Polish nobility (propinacja) that followed from owning the land. It was usually let, often to an innkeeper, and buyers and tenants of the Trąbczyn and Zagórów estates bargained for it."
  short_de: "Das alleinige Recht des Grundherrn, auf seinem Gut Bier zu brauen, Branntwein zu brennen und Met zu bereiten und Getränke auszuschenken, ein Vorrecht des polnischen Adels (propinacja), das aus dem Eigentum am Land folgte. Meist war es verpachtet, oft an einen Krüger, und Käufer und Pächter der Güter verhandelten darum."
  long_en: ""
  long_de: ""
  source: "Gloger, Encyklopedia staropolska, s.v. Propinacja (https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Propinacja)"
  check_against: "Gloger, Encyklopedia staropolska (propinacja)"
  lang_note_en: "German <i>Propination</i>, from Latin <i>propinatio</i>"
  source_html: "Gloger, Encyklopedia staropolska, s.v. <a href=\"https://pl.wikisource.org/wiki/Encyklopedia_staropolska/Propinacja\">Propinacja</a>"

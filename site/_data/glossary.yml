- id: "antichresis"
  kind: "law"
  lang: "la"
  head_en: "antichresis"
  head_de: "Antichresis"
  orig: "contractus antichreticus, antichretisch"
  short_en: "A pledge by which the creditor holds the debtor's land and takes its income in place of interest until the debt is repaid. In 1794 Antoni Prusimski, the owner of Trąbczyn, gave his neighbour Stanisław Chełmski, who had lent him 12,000 ducats, the Trąbczyn estates on these terms, \"without any account\", and Chełmski's later suit calls the bond an antichretic contract."
  short_de: "Eine Verpfändung, bei der der Gläubiger das Land des Schuldners besitzt und dessen Einkünfte statt der Zinsen zieht, bis die Schuld bezahlt ist. Prusimskis Verschreibung von 1794 gab Chełmski die Güter von Trąbczyn auf diese Weise, „ohne alle Abrechnung“, und Chełmskis Klage nennt sie einen antichretischen Vertrag."
  long_en: ""
  long_de: ""
  source: ""
  check_against: "Krünitz, Oekonomische Encyklopädie (s.v. Hypothek)"
  lang_note_en: ""
  source_html: ""
  checked: false
  sort_en: "antichresis"
  initial_en: "A"
  sort_de: "antichresis"
  initial_de: "A"

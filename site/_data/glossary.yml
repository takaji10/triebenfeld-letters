- id: "pfennig"
  kind: "money"
  lang: "de"
  head_en: "Pfennig"
  head_de: "Pfennig"
  orig: "Pfennig, d."
  short_en: "The smallest unit: a twelfth of a Groschen. It is often written d., from the Latin denarius, as the English penny was."

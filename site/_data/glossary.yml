- id: "ruthe"
  kind: "money"
  lang: "de"
  head_en: "rod"
  head_de: "Ruthe"
  orig: "Ruthe, R."
  short_en: "A measure of length, the Prussian rod of 12 feet, about 3.77 metres; as a square rod, a measure of area. A Magdeburg Morgen was 180 square rods, so land is often given as \"Morgen and rods\"."
  short_de: "Ein Längenmaß, die preußische Rute zu 12 Fuß, etwa 3,77 Meter; als Quadratrute ein Flächenmaß. Ein Magdeburger Morgen hatte 180 Quadratruten, daher die Angaben in „Morgen und Ruthen“."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Ruthe (https://www.kruenitz1.uni-trier.de/xxx/r/kr07670.htm); s.v. Hufe (https://www.kruenitz1.uni-trier.de/xxx/h/kh04717.htm)"

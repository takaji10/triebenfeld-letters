- id: "klafter"
  kind: "money"
  lang: "de"
  head_en: "cord (Klafter)"
  head_de: "Klafter"
  orig: "Klafter"
  short_en: "The measure of firewood: a stack of split logs a fathom (six feet) long and six feet high, as deep as the logs were long. With the three-foot logs usual in Prussia it held 108 cubic feet, about three and a third cubic metres. Woodland was valued by the cords it would yield."
  short_de: "Das Maß für Brennholz: ein Stapel gespaltener Scheite, eine Klafter (sechs Fuß) lang und sechs Fuß hoch, so tief wie die Scheite lang waren. Bei den in Preußen üblichen dreifüßigen Scheiten hielt sie 108 Kubikfuß, gut drei Kubikmeter. Wald wurde nach den Klaftern bewertet, die er hergab."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Klafter (https://www.kruenitz1.uni-trier.de/xxx/k/kk02966.htm)"
  check_against: "Krünitz, Oekonomische Encyklopädie"
  lang_note_en: ""
  source_html: "Krünitz, Oekonomische Encyklopädie, s.v. <a href=\"https://www.kruenitz1.uni-trier.de/xxx/k/kk02966.htm\">Klafter</a>"

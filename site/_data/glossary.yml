  lang: "de_fr"
  head_en: "Friedrich d'or"
  head_de: "Friedrichsdor"
  orig: "Fr. d'or, fr d'or, f. d'or"
  short_en: "The Prussian gold coin, written Fr. d'or. By law it was worth 5¼ Reichsthaler in silver Courant; in trade it was reckoned at five thalers in gold, with a premium over silver that moved, and in 1809 the royal offices took it at six. Sums \"in Gold\" were reckoned in it; it was the coin of savings, large payments and travel."
  short_de: "Die preußische Goldmünze, abgekürzt Fr. d'or. Gesetzlich galt sie 5¼ Reichsthaler in Silbercourant; im Handel rechnete man sie zu fünf Talern in Gold, mit einem wechselnden Aufgeld gegen Silber, und 1809 nahmen die königlichen Kassen sie zu sechs. Summen „in Gold“ wurden in ihr gerechnet; sie war die Münze der Ersparnisse, großer Zahlungen und der Reise."
  long_en: ""

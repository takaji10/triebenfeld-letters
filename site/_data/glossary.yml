- id: "duchy-of-warsaw"
  kind: "event"
  lang: "de"
  head_en: "Duchy of Warsaw"
  head_de: "Herzogtum Warschau"
  orig: "Herzogthum Warschau"
  short_en: "The Polish state Napoleon created in 1807 from Prussia's Polish provinces, under the King of Saxony as Duke. It ended with Napoleon's defeat, and in 1815 was divided between Russia and Prussia."
  short_de: "Der polnische Staat, den Napoleon 1807 aus Preußens polnischen Provinzen schuf, mit dem König von Sachsen als Herzog. Er endete mit Napoleons Niederlage und wurde 1815 zwischen Russland und Preußen geteilt."
  long_en: "By the Peace of Tilsit in 1807 Prussia gave up most of what it had taken from Poland, and Napoleon made of it the Duchy of Warsaw, with Friedrich August, King of Saxony, as Duke. It had a constitution, French-style departments under prefects, and the Code Napoléon. For the Prince, a Prussian general, it meant estates in a foreign state allied to France: sequestrations, claims by the former owners' family, and courts he could not influence. Russian troops occupied the Duchy in 1813, and the Congress of Vienna divided it, the west going back to Prussia as the Grand Duchy of Posen."
  long_de: "Im Frieden von Tilsit 1807 gab Preußen den größten Teil seiner polnischen Gebiete ab, und Napoleon machte daraus das Herzogtum Warschau, mit Friedrich August, König von Sachsen, als Herzog. Es hatte eine Verfassung, Departements unter Präfekten nach französischem Muster und den Code Napoléon. Für den Fürsten, einen preußischen General, hieß das Güter in einem fremden, mit Frankreich verbündeten Staat: Sequestrationen, Ansprüche der Familie der früheren Besitzer und Gerichte, auf die er keinen Einfluss hatte. 1813 besetzten russische Truppen das Herzogtum, der Wiener Kongress teilte es; der Westen kam als Großherzogtum Posen an Preußen zurück."
  check_against: "a standard history of the Duchy of Warsaw"
  checked: false

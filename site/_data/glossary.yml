- id: "in-solidum"
  kind: "law"
  lang: "la"
  head_en: "in solidum"
  head_de: "in solidum"
  orig: "in solidum"
  short_en: "Jointly and severally: each of several debtors answers for the whole debt, so the creditor may sue any one of them. The townspeople and villages that bought the lordship of Pszczew (Betsche) from Prince Friedrich Ludwig of Hohenlohe-Ingelfingen in 1804 were bound so."
  short_de: "Gesamtschuldnerisch: jeder von mehreren Schuldnern haftet für die ganze Schuld, „einer für beyde“, und der Gläubiger kann sich an jeden halten. Die Gemeinden, die Betsche übernahmen, hafteten so."
  long_en: ""
  long_de: ""
  source: ""
  check_against: "Allgemeines Landrecht 1794, Teil I Titel 5"

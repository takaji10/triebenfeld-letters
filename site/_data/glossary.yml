- id: "taxe"
  kind: "land"
  lang: "de_la"
  head_en: "valuation (Taxe)"
  head_de: "Taxe"
  orig: "Taxe, Taxa"
  short_en: "The valuation of an estate, worked out from its yield in grain, timber, rents and dues. It was made by order of a court, or privately, for an owner selling or letting of his own accord. Sales, loans and grants all rested on it, and its figures were argued over."
  short_de: "Die Wertermittlung eines Guts aus seinen Erträgen an Getreide, Holz, Zinsen und Abgaben. Sie wurde gerichtlich aufgenommen oder außergerichtlich, wenn ein Eigentümer aus freien Stücken verkaufen oder verpachten wollte. Verkäufe, Darlehen und Schenkungen beruhten auf ihr, und um ihre Zahlen wurde gestritten."
  long_en: ""
  long_de: ""
  source: "Krünitz, Oekonomische Encyklopädie, s.v. Taxation (https://www.kruenitz1.uni-trier.de/xxx/t/kt02298.htm)"
  check_against: "Krünitz, Oekonomische Encyklopädie"

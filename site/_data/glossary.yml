  short_de: "Die gerichtlich angeordnete Beschlagnahme eines Guts zur Beitreibung einer Schuld: ein vereidigter Verwalter, der Sequester, bewirtschaftet es und liefert die Einkünfte an das Gericht für die Gläubiger ab, bis die Schulden getilgt sind. Der Eigentümer behält den Titel, verliert aber die Nutzung; klagen viele Gläubiger, kann der Verkauf folgen."

- id: "fiscus"
  kind: "law"
  lang: "de"
  head_en: "Fiscus"
  head_de: "Fiskus"
  orig: "Fiscus, Fisco, fiscum"
  short_en: "The Crown's treasury as a party at law. In the 1790s the property confiscated from the insurgents of 1794 fell to the Fiscus, and a creditor who wanted to be paid out of it had to sue the Fiscus before the provincial Government."
  short_de: "Die Staatskasse als Partei vor Gericht. In den Dokumenten der 1790er Jahre fiel das den Insurgenten von 1794 eingezogene Vermögen an den Fiskus, und ein Gläubiger, der daraus bezahlt werden wollte, musste den Fiskus vor der Regierung der Provinz verklagen. Die deutschen Texte behalten die lateinischen Fälle, „vom Fisco“, „gegen den fiscum“."

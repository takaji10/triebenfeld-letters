- id: "haulaender"
  kind: "land"
  lang: "de"
  head_en: "Hollanders (Olęders)"
  head_de: "Hauländer (Olędrzy)"
  orig: "Hauländer, Holländer"
  short_en: "Settlers holding land under \"Dutch law\": personally free, with long or hereditary leases and their own village self-government, in return for clearing and farming land. The first were Dutch Mennonites; in Greater Poland most were Germans. The Olęder colonies on the estate of Trąbczyn, near Konin, were of this kind."
  short_de: "Siedler, die Land nach „holländischem Recht“ besaßen: persönlich frei, mit langen oder erblichen Pachten und eigener Dorfverwaltung, gegen Rodung und Bewirtschaftung. Die ersten waren niederländische Mennoniten, in Großpolen meist Deutsche. Auch die Kolonien von Trąbczyn waren solche."
  long_en: ""
  long_de: ""
  source: ""

- id: "closing-formulas"
  kind: "phrase"
  lang: "de"
  head_en: "humble servant, faithful Knecht"
  head_de: "unterthänigster Diener, treuester Knecht"
  orig: "unterthänigster Diener, treuester Knecht"
  short_en: "The signature line of a letter to a superior: \"most humble servant\", \"most obedient servant\". The degree mattered: unterthänigst is a step above unterthänig. A Knecht, as Triebenfeld signs to the Prince, is humbler than a Diener: by then the word was used only to persons far above the writer, to mark the distance."
  short_de: "Die Unterschriftszeile eines Briefs an einen Höherstehenden: „unterthänigster Diener“, „gehorsamster Diener“. Die Abstufung zählte: unterthänigst steht eine Stufe über unterthänig. Knecht, wie Triebenfeld dem Fürsten unterschreibt, ist demütiger als Diener: man gebrauchte es nur noch gegenüber weit Höherstehenden, um den Abstand zu zeigen."
  long_en: ""
  long_de: ""
  source: "Adelung, Grammatisch-kritisches Wörterbuch, s.v. Knecht (https://woerterbuchnetz.de/?sigle=Adelung&lemid=K01543); s.v. Diener (https://woerterbuchnetz.de/?sigle=Adelung&lemid=D00613); s.v. unterthänig (https://woerterbuchnetz.de/?sigle=Adelung&lemid=U01283)"

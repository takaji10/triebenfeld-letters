  orig: "Resignation"
  short_en: "The formal surrender of property to a new owner, made before a court. A Resignationsbrief is the deed that conveys an estate. Nobody is leaving a post."
  short_de: "Die förmliche Übertragung von Besitz an einen neuen Eigentümer vor Gericht. Ein Resignationsbrief ist die Urkunde, durch die ein Gut übergeht. Ein Amt wird dabei nicht niedergelegt."

- id: "landrecht"
  kind: "law"
  lang: "de"
  head_en: "General Law Code (Landrecht)"
  head_de: "Allgemeines Landrecht"
  orig: "Landrecht, allgemeines Landrecht"
  short_en: "The Prussian code of 1794, the Allgemeines Landrecht für die Preußischen Staaten, cited by part, title and section (\"Th. I. Tit. 15. §. 103\"). It was introduced in South Prussia in 1796, with Polish law kept as provincial law alongside it."
  short_de: "Das preußische Gesetzbuch von 1794, das Allgemeine Landrecht für die Preußischen Staaten, zitiert nach Teil, Titel und Paragraph („Th. I. Tit. 15. §. 103“). In Südpreußen wurde es 1796 eingeführt; das polnische Recht blieb daneben als Provinzialrecht in Kraft."
  long_en: ""
  long_de: ""
  source: "Szukaj w Archiwach, after T. Mencel's introduction to the inventory (reference/sources/patrimonial_courts_mencel.md)"

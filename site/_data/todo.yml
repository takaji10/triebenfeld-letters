- name: APP 53/968/0/-/669 - Breyer's notebooks
  items:
  - id: t925-add-the-bruntsch-list
    title: Add the Bruntsch list and the Honrichs permission of 1808?
    kind: decision
    text: 'Claude and two readers read the two passages you named in Breyer''s other notebooks (units/app539680669/intake/other_notebooks_2026-11-28.md).
      (1) IMG_5189: a list of 1838, each line one person: ''Bruntsch, okup. Tromp. Hol., Benssen, Pr.
      58'' and ''Brüllow, gorzel. w Gosławicach, ur. Berlin 24'' are its first two lines. They read as
      two separate men, each with his own trade, place and age (the second is a distiller), not as a couple,
      and the page does not say what the list records. (2) IMG_5190 and IMG_5208: not Honrichs''s marriage,
      but the banns of 1808 at Sophiental, one of the Prince''s colonies, of the schoolmaster Peter Abraham
      Piper, for which ''die Erlaubnis hierzu'' was given by Honrichs, the Prince''s commissary at Trąbczyn,
      in 1808: the Prince''s man still acting there after the estates were returned in 1807. Claude proposes
      adding both passages, and only them, as document 3 of this holding.'
    options:
    - Add both passages as document 3
    - Add the Honrichs passage only
    - Add the Bruntsch lines only
    - Add neither
    links:
    - label: Breyer's notebook, July 1936
      href: /sources/app539680669/
    - label: Honrichs
      href: /people/honrichs/

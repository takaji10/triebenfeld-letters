zbiersk-kolonia:
  slug: zbiersk-kolonia
  order: 10
  title: Zbiersk Kolonia
  title_de: Lutherischer Friedhof in Zbiersk Kolonia
  place: zbiersk-kolonia
  place_name: Zbiersk Kolonia
  place_name_de: Zbiersk Kolonia
  place_url_en: /places/zbiersk-kolonia/
  place_url_de: /de/orte/zbiersk-kolonia/
  graves: approximately 10
  visited: '2023'
  account_en: This cemetery is located on the northern edge of a forest complex that is a few square kilometres
    in area and is east of Stawiszyn. While Zbiersk Kolonia's cemetery is approximately 25 kilometres
    southeast of the Trąbczyn area, it has been included in this survey of Evangelical cemeteries as some
    Zelmers from the Trąbczyn area moved to Zbiersk Kolonia and the nearby settlement of Łyczyn. Approximately
    ten graves were counted, but there may possibly be more. Most graves were damaged, with headstones
    laying on their sides.
  account_de: Dieser Friedhof liegt am Nordrand eines Waldkomplexes von einigen Quadratkilometern Fläche
    östlich von Stawiszyn. Zwar liegt der Friedhof von Zbiersk Kolonia ungefähr 25 Kilometer südöstlich
    des Gebiets von Trąbczyn, doch ist er in diese Aufnahme der evangelischen Friedhöfe aufgenommen, weil
    einige Zelmers aus dem Gebiet von Trąbczyn nach Zbiersk Kolonia und zur nahen Siedlung Łyczyn zogen.
    Ungefähr zehn Gräber wurden gezählt, es können aber möglicherweise mehr sein. Die meisten Gräber waren
    beschädigt, mit Grabsteinen, die auf der Seite lagen.
  has_gid: false
  sources: []

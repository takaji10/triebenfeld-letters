michalinow-trabczynski:
  slug: michalinow-trabczynski
  order: 3
  title: Michalinów Trąbczyński Lutheran Cemetery
  title_de: Lutherischer Friedhof in Michalinów Trąbczyński
  place: michalinow-oledry
  place_name: Michalinów Trąbczyński
  place_name_de: Michalinów Trąbczyński
  place_url_en: /places/michalinow-oledry/
  place_url_de: /de/orte/michalinow-oledry/
  graves: 83, plus some without nameplates
  visited: '2023'
  account_en: The Evangelical cemetery at Michalinów is the largest in the Trąbczyn and Zagórów area in
    terms of number of graves, but occupies a smaller footprint than the cemetery at Orlina Duża. There
    are very few remnants of the stone wall that surrounded the cemetery. An information sign was erected
    by the local Evangelical-Augsburg Parish in Konin in 2018. A modern-era large wooden cross made from
    logs has been erected in the middle of the cemetery.
  account_de: Der evangelische Friedhof in Michalinów ist der grabreichste der Gegend von Trąbczyn und
    Zagórów, nimmt aber eine kleinere Fläche ein als der Friedhof in Orlina Duża. Von der steinernen Mauer,
    die den Friedhof umgab, sind nur sehr wenige Reste vorhanden. Die örtliche Evangelisch-Augsburgische
    Pfarrei in Konin hat 2018 eine Informationstafel aufstellen lassen. In der Mitte des Friedhofs ist
    ein großes Holzkreuz neuerer Zeit, gefertigt aus Balken, errichtet worden.
  has_gid: true
  sources: []

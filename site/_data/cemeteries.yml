  place_name: Michalinów gm. Oleśnica
  place_name_de: Michalinów gm. Oleśnica
  place_url_en: /places/michalinow-olesnicki/
  place_url_de: /de/orte/michalinow-olesnicki/
  graves: '3'
  visited: '2023'
  account_en: This cemetery is heavily overgrown by creeping ivy and is located in a very small patch
    of forest which likely traces the original boundaries of the cemetery. Of the graves that were visible,
    all were in an advanced state of ruin, and no descriptive nameplates were found.
  account_de: Dieser Friedhof ist stark von kriechendem Efeu überwuchert und liegt in einem sehr kleinen
    Waldflecken, der vermutlich den ursprünglichen Grenzen des Friedhofs folgt. Von den sichtbaren Gräbern
    waren alle in fortgeschrittenem Verfall, und es wurden keine nennenden Namensschilder gefunden.
  has_gid: false

orlina-duza:
  slug: orlina-duza
  order: 5
  title: Orlina Duża Lutheran Cemetery
  title_de: Lutherischer Friedhof in Orlina Duża
  place: orlina-duza
  place_name: Orlina Duża
  place_name_de: Orlina Duża
  place_url_en: /places/orlina-duza/
  place_url_de: /de/orte/orlina-duza/
  graves: 57, plus a handful without identification
  visited: '2023'
  account_en: 'The cemetery at Orlina Duża is the largest of the cemeteries in the area, and also includes
    a low stone wall that surrounds the property. There are signs of upkeep, along with a contemporary
    wooden cross that stands in the cemetery. Many headstones are well-preserved and still standing upright.
    There appeared to be a separate section for infants. Notably, there is a larger unique carved stone
    gravestone for the Jursch family, which mentions a birth of Gustav Jursch in Pleschen (Pleszew), located
    20 kilometres south. Gustav Jursch appears to be the oldest person found in the survey of cemeteries,
    with a birth year from the 18th century (1797). The three headstones of the Jesse family are also
    unique in that they appear to be recently repainted—the letters are painted gold, and the background
    of the nameplates is white, and a layer of glass has been added to cover the face of the nameplates.
    The headstones also have inscriptions on the backside, similarly painted and protected with glass.

    The original cantor''s house still stands and is located across the road from the cemetery; its original
    function indicated by a metal cross affixed to its roof. The building appears to be inhabited, and
    is constructed of bog iron masonry and features carved wooden doors which may be original to the building.'
  account_de: 'Der Friedhof in Orlina Duża ist der größte der Friedhöfe der Gegend und hat eine niedrige
    steinerne Mauer, die das Grundstück umgibt. Es gibt Zeichen der Pflege, neben einem hölzernen Kreuz
    der Gegenwart, das auf dem Friedhof steht. Viele Grabsteine sind gut erhalten und stehen noch aufrecht.
    Es schien einen eigenen Abschnitt für Säuglinge zu geben. Bemerkenswert ist ein größerer, einzigartiger
    gemeißelter Grabstein für die Familie Jursch, der eine Geburt Gustav Jurschs in Pleschen (Pleszew),
    zwanzig Kilometer südlich, nennt. Gustav Jursch scheint die älteste Person zu sein, die die Aufnahme
    der Friedhöfe fand, mit einem Geburtsjahr aus dem 18. Jahrhundert (1797). Die drei Grabsteine der
    Familie Jesse sind dazu einzigartig, dass sie offenbar kürzlich neu gefasst wurden — die Buchstaben
    sind goldfarben gemalt, der Grund der Namensschilder weiß, und eine Schicht Glas deckt die Fläche
    der Namensschilder. Die Grabsteine tragen auch Inschriften auf der Rückseite, ebenso gemalt und mit
    Glas geschützt.

    Das ursprüngliche Kantorenhaus steht noch und liegt gegenüber dem Friedhof, seine ursprüngliche Funktion
    an einem Metallkreuz zu erkennen, das auf seinem Dach befestigt ist. Das Gebäude scheint bewohnt zu
    sein, ist aus Raseneisenerz-Mauerwerk gebaut und trägt geschnitzte hölzerne Türen, die ursprünglich
    zum Gebäude gehören können.'
  has_gid: true
  sources: []
anielewo:
  slug: anielewo
  order: 6
  title: Anielewo (Ingelfingen)
  title_de: Lutherischer Friedhof in Anielewo (Ingelfingen)
  place: anielewo
  place_name: Anielewo (Ingelfingen)
  place_name_de: Anielewo (Ingelfingen)
  place_url_en: /places/anielewo/
  place_url_de: /de/orte/anielewo/
  graves: 11 identifiable, a few unidentified
  visited: '2023'
  account_en: This cemetery is located just within the northern edge of the large forest complex that
    stretches across the southern part of the old Trąbczyn estate through Łazińsk Pierwszy and Łazińsk
    Drugi and sits on a slightly elevated piece of land. Most of the graves are overgrown with moss, and
    some are missing their headstones. A large wooden cross (likely installed in recent times) lays on
    the ground.
  account_de: Dieser Friedhof liegt unmittelbar innerhalb des Nordrandes des großen Waldkomplexes, der
    sich über den südlichen Teil des alten Gutes Trąbczyn hinzieht, durch Łazińsk Pierwszy und Łazińsk
    Drugi, und steht auf einem leicht erhöhten Stück Land. Die meisten Gräber sind mit Moos überwuchert,
    und einigen fehlen ihre Grabsteine. Ein großes Holzkreuz (wohl in neuerer Zeit aufgestellt) liegt
    am Boden.
  has_gid: false
  sources: []

zagorowo:
  heading: Zagórów
  heading_de: Zagórów (Zagorowo)
  standfirst_en: A small town on the Warta, the seat of its own urban-and-rural commune in Słupca county;
    the medieval documents name it Zagorowo, and its estate is one of the estates in focus.
  standfirst_de: Eine kleine Stadt an der Warthe, Sitz einer eigenen Stadt-Land-Gemeinde im Kreis Słupca;
    die mittelalterlichen Dokumente nennen sie Zagorowo, und ihr Gut ist eines der betroffenen Güter.
  intro_en: 'The page gathers what the place tells about itself, beside what the edition''s documents
    tell about it: sources about Zagórów that are neither archival holdings nor the press, shown as they
    print, with an English translation and an account of what kind of witness each is. Where a source
    and the documents differ, the documents stand.'
  intro_de: 'Die Seite versammelt, was der Ort über sich selbst erzählt, neben dem, was die Dokumente
    der Edition über ihn erzählen: Quellen über Zagórów, die weder Archivalien noch Presse sind, abgedruckt
    wie sie drucken, mit englischer Übersetzung und dem Bericht, was für ein Zeuge jede ist. Wo eine Quelle
    und die Dokumente verschieden sind, gelten die Dokumente.'
  sources:
  - slug: zagorowpl20220614
    ref: 'zagorow.pl, "Miasto i gmina Zagórów": the town''s own presentation of its history, location,
      attractions and culture, captured by the Wayback Machine on 14 June 2022'
    title: '"Miasto i gmina Zagórów" — historia, położenie, atrakcje, kultura: the town''s situation and
      street plan, the fragments of the documents of 1240 and 1261 quoted, the king''s location act of
      1407 given whole, the town''s history from the founding of 1445 to the commune of today, the coat
      of arms, the nature of the commune and the Nadwarciański Landscape Park, and the town''s development'
    title_en: '"The town and commune of Zagórów" — history, location, attractions, culture: the English
      of the town''s own presentation'
    cite: zagorow.pl (2022)
    site: zagorow.pl
    original_url: http://www.zagorow.pl/z/index.html?page=2
    captured: 2022-06-14
    published: zagorow.pl (www.zagorow.pl), the site of the town and commune of Zagórów; the page undated,
      kept by the Wayback Machine in a capture of 14 June 2022
    year: 2022
    date_span: '2022'
    language: pl
    kind: web
    era: twentieth-century
    english_by: Claude, 2026-10-22
    source: https://web.archive.org/web/20220614193516/http://www.zagorow.pl/z/index.html?page=2
    account_en: 'The town of Zagórów''s own presentation of itself, published on the municipality''s site
      zagorow.pl as a digital flip-book, "Miasto i gmina Zagórów — historia, położenie, atrakcje, kultura",
      kept by the Wayback Machine in a capture of 14 June 2022. The page is anonymous and undated; the
      capture is the only date the source carries. Four turning pages: the location and history of the
      town — its situation on the Warta, its oval early settlement on the road from Pyzdry to Konin, the
      fragment of the document of 1240 and of the confirmation of 1261 quoted, the king''s location act
      of 1407 given whole, the history from the founding of 1445 through the Swedish destruction, the
      fire of 1790, the partitions and the loss and 1919 restoration of the town rights to the ghetto,
      the narrow-gauge railway and the commune of today; then the nature of the commune and the Nadwarciański
      Landscape Park; then the town''s development and its emblems, the white rose. The text is the town''s
      own voice — a summary of the literature''s findings in its history, and the commune''s account of
      itself in the pages on nature and development. It is shown whole at the editor''s word.'
    account_de: 'Die Selbstdarstellung der Stadt Zagórów, veröffentlicht auf der Seite der Gemeinde zagorow.pl
      als digitales „Flipbook“ „Miasto i gmina Zagórów — historia, położenie, atrakcje, kultura“, aufbewahrt
      von der Wayback Machine in einer Aufzeichnung vom 14. Juni 2022. Die Seite ist anonym und undatiert;
      die Aufzeichnung ist das einzige Datum, das die Quelle trägt. Vier umzublätternde Seiten: die Lage
      und die Geschichte der Stadt — ihre Lage an der Warthe, ihre ovale frühe Siedlung an der Straße
      von Pyzdry nach Konin, der zitierte Bruchstück der Urkunde von 1240 und der Bestätigung von 1261,
      der ganze Lokationsakt des Königs von 1407, die Geschichte von der Lokation 1445 über die schwedische
      Zerstörung, den Brand von 1790, die Teilungen und den Verlust und die Wiederherstellung der Stadtrechte
      1919 bis zum Ghetto, der Schmalspurbahn und der Gemeinde von heute; dann die Natur der Gemeinde
      und der Nadwarciański-Landschaftspark; dann die Entwicklung der Stadt und ihre Embleme, die weiße
      Rose. Der Text ist die eigene Stimme der Stadt — in der Geschichte eine Zusammenfassung dessen,
      was die Literatur weiß, in den Seiten über Natur und Entwicklung die eigene Rechenschaft der Gemeinde.
      Er wird auf des Editors Wort ganz gezeigt.'
    visible: true
    summary_only: false
    summary_en: 'The town and commune of Zagórów''s own presentation on zagorow.pl, a flip-book of four
      turning pages (the cover; "Położenie i historia"; "Przyroda i rozwój Zagórowa."; the page of the
      emblems, whose own title row is empty). Location: Zagórów lies close to the Warta in Słupca county,
      3.44 km2 and 2,985 inhabitants, the seat of an urban-and-rural commune of 159.71 km2 and 9,079 inhabitants;
      the elongated street plan parallel to the Warta keeps the remains of an oval early settlement of
      about 105 × 450 m on the old road from Pyzdry to Konin; the Duży Rynek with the monuments of 1979
      and 2003, the Evangelical-Augsburg church of 1884 with the pastor''s house of 1938 and the cantor''s
      house of 1913, the triangular Mały Rynek with the Baroque figure of St John of Nepomuk of 1747,
      and behind the gate of 1800 the church of St Peter and St Paul — probably fourteenth-century in
      origin, built anew 1740-60, with the chapel of 1686 and the tablets to Kościuszko (1917) and to
      57 parishioners who fell 1918-20. The page then carries a photograph of the document of 1240 and
      quotes a fragment of the confirmation of the abbey''s possessions — Zagorowo named among Marcinkowo,
      Jaroszyno, Gorzyza, Skokum and Oleszyno — captioned by the page itself as the document of 10.XII.1261
      drawn up in Sechów, while its own prose dates the same confirmation to 1262 and mentions a confirmation
      by Mieszko III the Old in 1145. The location: the abbot of Ląd obtained from King Władysław Jagiełło
      in 1407 the permission to found the town under Magdeburg law (the act, quoted in full in the box
      "Akt lokacyjny miasta Zagórów", dated by the page 8 July 1407); the actual location came only on
      3 IX 1445, after Ląd''s own location of 1418, with the right of weighing beer and of felling timber.
      The history: the Swedish invasion of 1655 destroyed the town, occupied for a year after the capitulation
      at Ujście; the southern chapel was added in 1686; the fire of 1790; the Prussian partition of 1793
      (544 inhabitants, 100 rebuilt houses); the Kingdom of Poland from 1815; the loss of the town rights
      — the box "Lokalizacja miasta" says 1870, the box "Historia" 1869 — the January Uprising''s skirmish
      at Myszaków (26 February 1863); about 2,300 inhabitants at the beginning of the twentieth century;
      the rights restored in 1919; 3,715 inhabitants in 1921 and 4,389 in 1939, a fifth to a sixth of
      them Jews, beside descendants of the Olędrzy of the Evangelical confession settled in the Puszcza
      Pyzdrska in the eighteenth century; the ghetto of about 2,500 Jews from spring 1940 to November
      1941 and the death of about 570 Jews and Poles of Zagórów; a third of the population lost, 3,054
      inhabitants in 1946; the narrow-gauge railway from Witaszyce of 1947-1991, once meant to run through
      Rzgów to Konin; the powiat of Konin, from 1956 of Słupca; the commune of 1973; the voivodeship of
      Greater Poland from 1999. The coat of arms: the white rose of five petals on a red field, a sign
      of the Virgin Mary and of the bond with the Cistercian abbey of Ląd, confirmed in its present shape
      on 19 November 2004; the page''s two boxes on the emblems repeat the same paragraph of the town''s
      history. Nature and development: the Nadwarciański Landscape Park (the Regulation of the Voivode
      of Konin no. 60 of 19 October 1995, on the base of the Pyzdry Protected Landscape Area of 1985;
      13,428 ha; a "Globally Important Bird Area" of BirdLife International, 147 nesting and 232 observed
      species, about 1,000 vascular plants), the Puszcza Pyzdrska of the Grodziec forest district (16.5
      thousand ha), the commune''s grounds and their figures, the new settlements growing toward Wrąbczyn,
      Imielno, Kościołków and Drzewce; and the commune of today — its 600th place in Poland by area and
      949th by population, the A2 junction near Słupca, the Wednesday and Saturday markets and the monthly
      fair of the privilege of Stanisław August of 1778, the investments of the self-government (the market
      hall "MÓJ RYNEK", the Gymnasium, the M-GOK and the library, the "Orlik" fields, the sports hall),
      the men''s choir "Quarta" and its "Zagórowskie tango", and the statistics of the commune''s firms
      and ages.'
    summary_de: 'Die Selbstdarstellung von Stadt und Gemeinde Zagórów auf zagorow.pl, ein „Flipbook“ von
      vier umzublätternden Seiten (das Deckblatt; „Położenie i historia“; „Przyroda i rozwój Zagórowa.“;
      die Seite der Embleme, deren eigene Titelzeile leer ist). Die Lage: Zagórów liegt nahe der Warthe
      im Kreis Słupca, 3,44 km2 und 2985 Einwohner, Sitz einer Stadt-Land-Gemeinde von 159,71 km2 und
      9079 Einwohnern; der in die Länge gezogene Stadtgrundriß parallel zur Warthe bewahrt die Reste einer
      ovalen frühen Siedlung von etwa 105 × 450 m an der alten Straße von Pyzdry nach Konin; der Duży
      Rynek mit den Denkmälern von 1979 und 2003, die evangelisch-augsburgische Kirche von 1884 mit Pfarrhaus
      von 1938 und Kantorenhaus von 1913, der dreieckige Mały Rynek mit der barocken Figur des hl. Johannes
      von Nepomuk von 1747 und hinter dem Tor von 1800 die Kirche St. Peter und Paul — ihres Ursprungs
      wohl aus dem 14. Jahrhundert, neu gebaut 1740-60, mit der Kapelle von 1686 und den Tafeln für Kościuszko
      (1917) und für 57 gefallene Gemeindemitglieder 1918-20. Die Seite trägt dann ein Photo der Urkunde
      von 1240 und zitiert ein Bruchstück der Bestätigung des Klosterbesitzes — Zagorowo genannt unter
      Marcinkowo, Jaroszyno, Gorzyza, Skokum und Oleszyno —, von der Seite selbst als die Urkunde vom
      10.XII.1261, ausgestellt in Sechów, bezeichnet, während ihr eigener Text dieselbe Bestätigung auf
      1262 datiert und eine Bestätigung durch Mieszko III. den Alten von 1145 erwähnt. Die Lokation: der
      Abt von Ląd erhielt von König Władysław Jagiełło 1407 die Erlaubnis, die Stadt unter Magdeburger
      Recht zu gründen (der Akt, im Kasten „Akt lokacyjny miasta Zagórów“ ganz zitiert, von der Seite
      auf den 8. Juli 1407 datiert); die tatsächliche Lokation geschah erst am 3. IX. 1445, nach Ląds
      eigener Lokation von 1418, mit dem Recht des Bierwägens und des Holzfällens. Die Geschichte: der
      schwedische Einfall von 1655 zerstörte die Stadt, nach der Kapitulation von Ujście ein Jahr besetzt;
      die Südkapelle kam 1686 dazu; der Brand von 1790; die preußische Teilung 1793 (544 Einwohner, 100
      wiederaufgebaute Häuser); das Königreich Polen von 1815 an; der Verlust der Stadtrechte — der Kasten
      „Lokalizacja miasta“ sagt 1870, der Kasten „Historia“ 1869 — das Scharmützel des Januaraufstands
      bei Myszaków (26. Februar 1863); etwa 2300 Einwohner zu Beginn des zwanzigsten Jahrhunderts; die
      Rechte 1919 wiederhergestellt; 3715 Einwohner 1921 und 4389 1939, ein Fünftel bis ein Sechstel Juden,
      daneben Nachkommen der evangelischen Olędrzy, die im 18. Jahrhundert in der Puszcza Pyzdrska angesiedelt
      waren; das Ghetto von etwa 2500 Juden vom Frühjahr 1940 bis November 1941 und der Tod von etwa 570
      Juden und Polen aus Zagórów; ein Drittel der Bevölkerung verloren, 3054 Einwohner 1946; die Schmalspurbahn
      von Witaszyce 1947-1991, einmal über Rzgów bis Konin geplant; der Kreis Konin, von 1956 an Słupca;
      die Gemeinde von 1973; die Woiwodschaft Großpolen von 1999. Das Wappen: die weiße fünfblättrige
      Rose auf rotem Grund, ein Zeichen der Gottesmutter und der Verbindung mit der Zisterzienserabtei
      Ląd, in ihrer heutigen Gestalt am 19. November 2004 bestätigt; die beiden Kästen der Seite über
      die Embleme wiederholen denselben Absatz der Stadtgeschichte. Natur und Entwicklung: der Nadwarciański-Landschaftspark
      (die Verordnung des Woiwoden von Konin nr 60 vom 19. Oktober 1995, auf der Grundlage des Pyzdryer
      geschützten Landschaftsgebiets von 1985; 13.428 ha; ein „Globally Important Bird Area“ von BirdLife
      International, 147 brütende und 232 beobachtete Arten, etwa 1000 Gefäßpflanzen), die Puszcza Pyzdrska
      des Forstamts Grodziec (16,5 Tausend ha), die Grundstücke der Gemeinde und ihre Zahlen, die neuen
      Siedlungen, die gegen Wrąbczyn, Imielno, Kościołków und Drzewce wachsen; und die Gemeinde von heute
      — ihr 600. Platz in Polen nach Fläche und 949. nach Einwohnerzahl, der A2-Anschluß bei Słupca, die
      Mittwoch- und Samstagmärkte und der monatliche Jahrmarkt des Privilegs Stanisław Augusts von 1778,
      die Investitionen der Selbstverwaltung (die Markthalle „MÓJ RYNEK“, das Gymnasium, das M-GOK und
      die Bibliothek, die „Orlik“-Plätze, die Sporthalle), der Männerchor „Quarta“ und sein „Zagórowskie
      tango“, und die Statistik der Firmen und Altersgruppen der Gemeinde.'

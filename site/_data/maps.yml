    note:
      en: 'Дес. (десятинъ) is desyatinas, Саж. (квадратныхъ саженъ) square sazhens: one desyatina is 2400
        square sazhens, about 1.09 hectares, and one square sazhen about 4.55 m². The figures sum correctly
        (870 + 197 = 1067 desyatinas and 1454 + 2218 = 3672 sazhens = 1 desyatina 1272 sazhens), which
        supports the readings of the digits. The dashes after Итого and Всего in the original are filler
        strokes.'
      de: 'Дес. (десятинъ) heißt Desjatinen, Саж. (квадратныхъ саженъ) Quadratsaschen: eine Desjatina
        zählt 2400 Quadratsaschen, rund 1,09 Hektar, eine Quadratsasche rund 4,55 m². Die Zahlen gehen
        richtig auf (870 + 197 = 1067 Desjatinen und 1454 + 2218 = 3672 Saschen = 1 Desjatina 1272 Saschen),
        was die Ziffernlesungen stützt. Die Striche hinter Итого und Всего in der Vorlage sind Füllstriche.'

    note:
      en: The stamped capitals (А–У) are the boundary points of the plan, two columns of them at the left
        of the list; each row runs from one point to the next around the perimeter, and the original writes
        «отъ» (from) as a ditto mark at the head of each line. Rows 1 to 15 run from one letter to the
        next (А–Б, Б–В … О–П); rows 16 to 18 are П–А, Р–Р and С–С (the editor's ruling), where the second
        letter repeats the first or breaks the sequence; rows 19 and 20 close the loop (Т→У, У→Т). The
        spellings are the Russian renderings of the Polish names (Тромбчинъ = Trąbczyn, the nasal ą written
        ом); the Polish forms are confirmed by the editor. Фольварокъ is a manor farm (folwark), коренная
        усадьба the principal homestead, вырубленный лѣсъ felled forest, дополнительный надѣлъ the additional
        allotment (as in the explication).
      de: Die gestempelten Großbuchstaben (А–У) sind die Grenzpunkte des Plans, in zwei Spalten links
        neben der Liste; jede Zeile läuft von einem Punkt zum nächsten entlang der Grenze, und die Vorlage
        schreibt «отъ» (von) als Wiederholungszeichen am Kopf jeder Zeile. Die Zeilen 1 bis 15 laufen
        von einem Buchstaben zum nächsten (А–Б, Б–В … О–П); die Zeilen 16 bis 18 sind П–А, Р–Р und С–С
        (Festlegung des Herausgebers), wo der zweite Buchstabe den ersten wiederholt oder die Reihe bricht;
        die Zeilen 19 und 20 schließen den Kreis (Т→У, У→Т). Die Schreibungen sind die russischen Wiedergaben
        der polnischen Namen (Тромбчинъ = Trąbczyn, das nasalę als om geschrieben); die polnischen Formen
        hat der Herausgeber bestätigt. Фольварокъ ist ein Vorwerk (folwark), коренная усадьба der Haupthof,
        вырубленный лѣсъ Kahlschlagwald, дополнительный надѣлъ der zusätzliche Anteil (wie in der Explication).

  texts:
  - id: cartouche
    names:
      en: The title block (cartouche)
      de: Der Titelblock (Kartusche)
    margin:
      en: 'Top left, in a different hand and blue pencil: "Копія" (copy), with the number 3.'
      de: 'Oben links, anderer Hand und in blauem Bleistift: „Копія“ (Kopie), mit der Zahl 3.'
    groups:
    - lines:
      - ПЛАНЪ
      - земель поступившихъ въ собственность крестьянъ
      - селенія
      - ЛАЗИНСКІЕ ГОЛЕНДРЫ
      - Калишской Губерніи Слупецкаго Уѣзда
      - Гмины Тромчинъ
      - Составленъ въ 1896 году Штатнымъ Землемѣромъ 2го класса Г. А. Пелзуцкимъ [?]
      - на пяти листахъ
      - По указанію магнитной стрѣлки, которая имѣла отклоненіе отъ истиннаго меридіана на западъ на 7
        град. 30 минутъ
      - Планъ сей составленъ [?] на основаніи произведеннаго измѣренія въ натурѣ въ 1896 году состоящей
        [?] при Калишскомъ Губернскомъ Присутствіи.
      - Штатный Землемѣръ (подписалъ) Пелзуцкій [?]
      - Коммисаръ по крестьянскимъ дѣламъ Слупецкаго Уѣзда (подписалъ) А. Жемчужинъ [?]
      translation:
        en:
        - PLAN
        - of the lands that passed into the ownership of the peasants of the village
        - ŁAZIŃSKIE HOLENDRY
        - Kalisz Governorate, Słupca uezd
        - Gmina Tromczyn
        - Drawn up in 1896 by the Staff Land Surveyor of the 2nd class G. A. Pelzutskiy [?]
        - on five sheets.
        - By the indication of the magnetic needle, which had a deviation from the true meridian to the
          west of 7 degrees 30 minutes.
        - This plan was drawn up [?] on the basis of the field survey carried out in 1896 [...] attached
          to the Kalisz Governorate Board.
        - Staff Land Surveyor (signed) Pelzutskiy [?]
        - Commissioner for Peasant Affairs of the Słupca uezd (signed) A. Zhemchuzhin [?]
        de:
        - PLAN
        - der Ländereien, die in das Eigentum der Bauern des Dorfes übergegangen sind
        - ŁAZIŃSKIE HOLENDRY
        - Gouvernement Kalisch, Ujezd Słupca
        - Gemeinde Tromczyn
        - Aufgenommen im Jahre 1896 durch den etatmäßigen Landvermesser zweiter Klasse G. A. Pelzutskij
          [?]
        - auf fünf Blättern.
        - Nach Angabe der Magnetnadel, die vom wahren Meridian um 7 Grad 30 Minuten nach Westen abwich.
        - Dieser Plan ist [?] auf Grund der im Jahre 1896 vorgenommenen örtlichen Vermessung angefertigt
          worden, [...] beim Kalischer Gouvernements-Präsenium.
        - Etatmäßiger Landvermesser (unterzeichnet) Pelzutskij [?]
        - Kommissar für Bauernangelegenheiten des Ujezd Słupca (unterzeichnet) A. Shemtschuschin [?]
  - id: certification
    names:
      en: The certification texts
      de: Die Beglaubigungstexte
    groups:
    - lines:
      - Планъ сей по освидѣтельствованіи найденъ составленнымъ правильно.
      - Межевой Ревизоръ (подписалъ) Л. Шиманскій
      - Непремѣнный Членъ Калишскаго Губернскаго по крестьянскимъ дѣламъ Присутствія (подписалъ) Н. Базинъ
      - За Предсѣдателя, состоящаго при Земскомъ Отдѣлѣ Министерства Внутреннихъ Дѣлъ Присутствія по крестьянскимъ
        дѣламъ Губерній Царства Польскаго, (подписалъ) Сарѣсковъ [?]
      - Межевой Техникъ (подписалъ) Городецкій
      translation:
        en:
        - This plan, having been examined, has been found to be correctly drawn up.
        - Land Survey Inspector (signed) L. Shimanskiy
        - Permanent Member of the Kalisz Governorate Board for Peasant Affairs (signed) N. Bazin
        - For the Chairman of the Board for Peasant Affairs of the Governorates of the Kingdom of Poland,
          attached to the Zemsky Department of the Ministry of Internal Affairs, (signed) Saresk[o]v [?]
        - Land Survey Technician (signed) Gorodetskiy
        de:
        - Dieser Plan ist nach stattgehabter Prüfung als richtig angefertigt befunden worden.
        - Vermessungsrevisor (unterzeichnet) L. Schimanski
        - Ständiges Mitglied des Kalischer Gouvernementsausschusses für Bauernangelegenheiten (unterzeichnet)
          N. Basin
        - Für den Vorsitzenden des bei dem Zemskij-Departement des Ministeriums des Innern bestehenden
          Präseniums für Bauernangelegenheiten der Gouvernemente des Königreichs Polen (unterzeichnet)
          Sareskov [?]
        - Vermessungstechniker (unterzeichnet) Gorodezki
    - lines:
      - Вѣрность настоящей копіи съ подлиннымъ планомъ удостовѣряется моею подписью.
      - гор. Калишъ, 27 [?] Марта 1898 года.
      - Межевой Ревизоръ [signature]
      - Непремѣнный Членъ Калишскаго Губернскаго по крестьянскимъ дѣламъ Присутствія [signature]
      translation:
        en:
        - The accuracy of this copy with the original plan is certified by my signature.
        - City of Kalisz, 27 [?] March 1898.
        - Land Survey Inspector [signature]
        - Permanent Member of the Kalisz Governorate Board for Peasant Affairs [signature]
        de:
        - Die Richtigkeit der vorliegenden Kopie gegenüber dem Originalplan wird durch meine Unterschrift
          beglaubigt.
        - Stadt Kalisch, 27. [?] März 1898.
        - Vermessungsrevisor [Unterschrift]
        - Ständiges Mitglied des Kalischer Gouvernementsausschusses für Bauernangelegenheiten [Unterschrift]
    - lines:
      - Сія копія выдается изъ Калишскаго Губернскаго по крестьянскимъ дѣламъ Присутствія, на основаніи
        1465 ст. Постановленія Учредительнаго Комитета, крестьянамъ селенія Лазинскіе Голендры, гмины
        Тромчинъ, Слупецкаго уѣзда, Калишской Губерніи, въ семъ подписью съ приложеніемъ казенной печати
        удостовѣряется.
      - г. Калишъ, 19 Іюля 1900 года.
      - Непремѣнный Членъ Калишскаго Губернскаго по крестьянскимъ дѣламъ Присутствія [signature]
      translation:
        en:
        - This copy is issued by the Kalisz Governorate Board for Peasant Affairs, on the basis of Article
          1465 of the Decree of the Establishment Committee, to the peasants of the village of Łazińskie
          Holendry, gmina Tromczyn, Słupca uezd, Kalisz Governorate, and is certified herein by signature
          with the affixing of the official seal.
        - City of Kalisz, 19 July 1900.
        - Permanent Member of the Kalisz Governorate Board for Peasant Affairs [signature]
        de:
        - Diese Kopie wird aus dem Kalischer Gouvernementsausschuss für Bauernangelegenheiten auf Grund
          des Artikels 1465 der Verordnung des Errichtungskomitees den Bauern des Dorfes Łazińskie Holendry,
          Gemeinde Tromczyn, Ujezd Słupca, Gouvernement Kalisch, ausgehändigt und hierdurch durch Unterschrift
          mit Beidrückung des Amtssiegels beglaubigt.
        - Stadt Kalisch, 19. Juli 1900.
        - Ständiges Mitglied des Kalischer Gouvernementsausschusses für Bauernangelegenheiten [Unterschrift]
    - lines:
      - Масштабъ русской мѣры 1:4200
      - Межевой Ревизоръ [signature]
      translation:
        en:
        - Scale in Russian measure 1:4200.
        - Land Survey Inspector [signature]
        de:
        - Maßstab in russischem Maß 1:4200.
        - Vermessungsrevisor [Unterschrift]
  - id: adjoining-lands

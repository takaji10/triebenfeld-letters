  translation: ''
  account_en: 'An unsigned note in the Poznań daily Kurjer Poznański of 12 July 1933, headed "Zhitleryzowani koloniści", Hitlerized colonists. Since Hitler took power in Germany, it says, the German colonists of the rural communes of Oleśnica, Trąbczyn and Szymanowice around Zagórów, whose colonies once bore German names (Emilienhain, Ludwigslust), behave "as if something turned over in their heads": at the commune office they speak German, not Polish, and their children at school answer a Polish "dzień dobry" in German. When the school inspector visited a school taught by an Evangelical, not one of the colonists'' children came, and the teacher was dismissed.'
  account_de: 'Eine ungezeichnete Notiz in der Posener Tageszeitung Kurjer Poznański vom 12. Juli 1933, überschrieben „Zhitleryzowani koloniści“, hitlerisierte Kolonisten. Den deutschen Kolonisten der Landgemeinden Oleśnica, Trąbczyn und Szymanowice um Zagórów, deren Kolonien einst deutsche Namen trugen (Emilienhain, Ludwigslust), ist seit Hitlers Machtergreifung „als hätte sich etwas in ihren Köpfen umgedreht“: Auf dem Gemeindeamt sprechen sie deutsch, nicht polnisch, und ihre Kinder antworten in der Schule auf ein polnisches „dzień dobry“ deutsch. Als der Schulinspektor eine Schule besuchte, an der ein Evangelischer lehrte, kam keines der Kolonistenkinder, und der Lehrer wurde entlassen.'
  brief_en: A note in the Kurjer Poznański of 12 July 1933 on the German colonists around Zagórów turning to Hitler, and a teacher dismissed.
  brief_de: Eine Notiz im Kurjer Poznański vom 12. Juli 1933 über die Hinwendung der deutschen Kolonisten um Zagórów zu Hitler und einen entlassenen Lehrer.

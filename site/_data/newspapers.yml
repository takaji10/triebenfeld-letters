  newspaper: Zdrowie
  title: '"Jak mieszka lud nasz?" ("How does our people live?"): the survey of the dwellings of the Polish countryside that Dr. Konstanty Lidmanowski, the physician of Zagórów, published in the Warsaw Hygiene Society''s journal — 1,200 farmhouses, 80 manor servants'' quarters and 140 seasonal labourers'' lodgings examined over many years, 91 of every 100 farmers'' dwellings one single room serving as kitchen, living room and bedroom, damp walls and the manure pile by the well, and the verdict that ignorance, dear brick and the lack of cheap credit keep the peasant living as he lives'
  title_en: '"How does our people live?": Dr. Konstanty Lidmanowski''s survey of rural housing in the hygiene journal Zdrowie of 1914'
  cite: Zdrowie (1914)
  ref: Zdrowie, R. XXX, z. 6 (1914), s. 432-440
  published: 'Zdrowie: organ Warsz. Towarzystwa Hygienicznego, poświęcony hygienie publicznej i prywatnej, R. XXX, z. 6, Warsaw, 1914, pp. 432-440 ("Jak mieszka lud nasz?")'
  year: 1914
  language: pl
  english_by: Claude, 2026-10-22 (with the editor's file, corrected against the Polish)
  source: https://polona.pl/item-view/93a25386-9781-4518-835b-e222ca5678c3?page=0
  image: ''
  translation: ''
  account_en: 'An article, "Jak mieszka lud nasz?" ("How does our people live?"), signed in the issue''s table of contents "Lidmanowski K. Dr. z Zagórowa" — Dr. Konstanty Lidmanowski, the physician who settled in Zagórów in 1893 and practised there to his death in 1943, the founder of the town''s volunteer fire brigade, loan society and Polish school — in Zdrowie, the organ of the Warsaw Hygiene Society (Warszawskie Towarzystwo Higieniczne), the specialist monthly of public and private hygiene, its thirtieth year, zeszyt 6 of 1914, pp. 432-440. It reports the survey of rural dwellings the doctor carried out himself in the course of his rounds, "visiting almost daily the dwellings of our people": 1,200 dwellings of independent farmers, 80 of manor servants and 140 of seasonal labourers, measured in steps of three-fifths of a metre. The article does not name the district surveyed; the doctor''s study of nutrition in the same journal two years earlier (also in the Newspapers, Zdrowie 1912)
    took the Słupca powiat — the edition''s own — and says its figures extend along the whole Prussian border, and the two articles are one work of observation, made on the edition''s ground. What it records is what the edition''s documents do not: the one-room cottage housing a family and its beasts'' fodder, the damp walls, the well by the manure pile, the farmhand''s room with the cabbage barrel at the bed''s foot.'
  account_de: 'Ein Aufsatz, „Jak mieszka lud nasz?" („Wie lebt unser Volk?"), im Inhaltsverzeichnis des Heftes gezeichnet „Lidmanowski K. Dr. z Zagórowa" — Dr. Konstanty Lidmanowski, der Arzt, der sich 1893 in Zagórów niederließ und dort bis zu seinem Tode 1943 praktizierte, der Gründer der Freiwilligen Feuerwehr, der Darlehnskasse und der polnischen Schule der Stadt — in Zdrowie, dem Organ der Warschauer Hygienischen Gesellschaft (Warszawskie Towarzystwo Higieniczne), der Fachmonatsschrift für öffentliche und private Hygiene, in ihrem dreißigsten Jahre, Heft 6 von 1914, S. 432-440. Er berichtet über die Untersuchung der Landwohnungen, die der Arzt selbst auf seinen Gängen ausführte, „fast täglich in den Wohnungen unseres Volkes": 1.200 Wohnungen selbständiger Bauern, 80 von Gutsdiensten und 140 von Saisonarbeitern, in Schritten von drei Fünfteln Meter gemessen. Der Aufsatz nennt den untersuchten Kreis nicht; die Ernährungsstudie des Arztes in derselben Zeitschrift zwei Jahre früher (ebenfalls
    in den Zeitungen, Zdrowie 1912) nahm den Powiat Słupca — den Boden dieser Edition — und sagt, ihre Zahlen gelten für den ganzen preußischen Grenzstreifen, und die beiden Aufsätze sind eine Beobachtungsarbeit, gemacht auf dem Grund dieser Edition. Was er festhält, ist, was die Dokumente der Edition nicht tun: die Einraumhütte, die eine Familie und das Futter des Viehs beherbergt, die feuchten Wände, der Brunnen beim Misthaufen, die Kammer des Guts- knechts mit dem Kohlfass am Fußende des Bettes.'
  brief_en: 'Dr. Lidmanowski''s survey of the dwellings of the Polish countryside, in the Warsaw Hygiene Society''s journal of 1914: 1,200 farmhouses measured, nine in ten of the farmers'' a single room serving as kitchen, living room and bedroom — what the edition''s documents do not say, from the physician of Zagórów who visited the houses himself.'
  brief_de: 'Dr. Lidmanowskis Aufnahme der Wohnungen des polnischen Landvolks im Organ der Warschauer Hygienischen Gesellschaft von 1914: 1.200 Bauernhäuser ausgemessen, in neun von zehn der Bauernwohnungen ein einziges Zimmer als Küche, Wohnstube und Schlafraum — was die Dokumente der Edition nicht sagen, von dem Zagórower Arzt, der die Wohnungen auf seinen Gängen selbst besuchte.'

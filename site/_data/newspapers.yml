- slug: echotureckie1931018
  newspaper: Echo Tureckie
  title: '"Zajście w Zagórowie": the report of the clash at the recruiting commission in the Zagórów edition of the Turek weekly Echo Tureckie of 6 May 1931 — the crowd of workers gathered for the seasonal work for Germany stoning the commission''s premises when the season''s quota ran out, the starosta of Słupca arriving with reinforcements of police, the second storming of the premises, and the dispersal of the crowd with a dozen or more arrests.'
  title_en: '"A disturbance in Zagórów": the report of the clash at the recruiting commission in the Zagórów edition of the Turek weekly Echo Tureckie of 6 May 1931'
  cite: Echo Tureckie (1931)
  ref: Echo Tureckie, R. 8, nr 18 (6 maja 1931), nr 379
  published: Echo Tureckie, R. 8, nr 18, nr 379, 6 May 1931, the Turek weekly's Zagórów edition ("Zajście w Zagórowie")
  year: 1931
  language: pl
  english_by: Claude, 2026-10-22
  source: https://zagorowzhistoria.com/2024/10/02/kolejne-wycinki-z-prasy-sprzed-lat-cz-3/
  image: clipping.jpg
  translation: ''
  account_en: 'A report in the Zagórów edition of the Turek weekly Echo Tureckie, R. 8, nr 18 (nr 379) of 6 May 1931, anonymous, under the headline "Zajście w Zagórowie" (a disturbance in Zagórów). The events of 24 April of that year: the town was the scene of violent clashes in connection with the recruiting of seasonal workers for work in Germany. The report is dated to the event''s day and tells it with a "yesterday" of its own dispatch — the issue of 6 May carrying it nine days on. No person is named, from the commission''s chairman to the arrested.'
  account_de: 'Ein Bericht der Zagórower Ausgabe des Tureker Wochenblatts Echo Tureckie, R. 8, Nr. 18 (Nr. 379) vom 6. Mai 1931, anonym, unter der Überschrift „Zajście w Zagórowie" (ein Zusammenstoß in Zagórów). Die Ereignisse des 24. April jenes Jahres: die Stadt war der Schauplatz heftiger Zusammenstöße im Zusammenhang mit der Anwerbung saisonaler Arbeiter für die Arbeit in Deutschland. Der Bericht ist auf den Tag des Ereignisses datiert und erzählt ihn mit einem „gestern" des eigenen Einsatzes — das Heft vom 6. Mai brachte ihn neun Tage später. Keine Person wird genannt, vom Vorsitzenden der Kommission bis zu den Verhafteten.'
  brief_en: 'The report of a disturbance in Zagórów in the Turek weekly Echo Tureckie of 6 May 1931, anonymous: when the season''s quota for the work in Germany ran out, the workers gathered for the recruiting stoned the commission''s premises and stormed them a second time, and the crowd was dispersed by the police the starosta of Słupca brought with him, a dozen arrests or more.'
  brief_de: 'Der Bericht eines Zusammenstoßes in Zagórów im Tureker Wochenblatt Echo Tureckie vom 6. Mai 1931, anonym: Als das Kontingent der Saisonarbeit für Deutschland aufgezehrt war, bewarfen die zur Anwerbung Gesammelten die Räumlichkeiten der Kommission mit Steinen und stürmten sie ein zweites Mal; die Menge wurde von der Polizei, die der Starost von Słupca mit Verstärkungen brachte, zerstreut, mit einem Dutzend Verhaftungen und mehr.'

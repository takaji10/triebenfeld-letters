- slug: zdrowie1912z10
  newspaper: Zdrowie
  title: '"W sprawie odżywiania się ludu" ("On the nutrition of the people"): Dr. Konstanty Lidmanowski of Zagórów''s study of what the rural people of the Słupca powiat eat — the district of the edition''s own Trąbczyn, taken as a strip of like conditions along the whole Prussian border, the people divided by wealth and each day''s food reckoned in "heat units" against the 3,500 a working body needs: 5,374 for the farmer of more than fifteen morgens, 3,192 for the smallholder and the manor servant, and some 2,000 for the day-labourer who summers in Prussia — in the Warsaw Hygiene Society''s journal of 1912'
  title_en: '"On the nutrition of the people": Dr. Lidmanowski''s study of the food of the rural Słupca powiat, in the hygiene journal Zdrowie of 1912'
  cite: Zdrowie (1912)
  ref: Zdrowie, R. XXVIII, z. 10 (1912), s. 720-725
  published: 'Zdrowie: Organ Warszaw. Towarzystwa Hygienicznego: poświęcony hygienie publicznej i prywatnej, R. XXVIII, z. 10, Warsaw, 1912, pp. 720-725 ("W sprawie odżywiania się ludu")'
  year: 1912
  language: pl
  english_by: Claude, 2026-10-22 (with the editor's file, corrected against the Polish)
  source: https://crispa.uw.edu.pl/object/files/701189/display/PDF
  image: ''
  translation: ''
  account_en: 'An article, "W sprawie odżywiania się ludu" ("On the nutrition of the people"), by Dr. Konstanty Lidmanowski — the physician of Zagórów, whose study of rural dwellings of 1914 stands beside it in the Newspapers — in Zdrowie, the organ of the Warsaw Hygiene Society, its twenty-eighth year, zeszyt 10 of 1912, pp. 720-725. It is the edition''s own ground named by its own observer: "For my research on the nutrition of the people, I took the Słupca district, which stretches in a narrow strip on the border of the Grand Duchy of Poznań" — the powiat in which Trąbczyn lies — and, since the whole borderland lives in like material conditions, the doctor extends his figures to the whole strip along the Prussian frontier. The data he had been collecting "for over a dozen years". The unit of the reckonings is the ciepłostka, the "heat unit" — the old calorie: some 50 per kilogram of body weight a day for a hard-working person, 3,500 for a man of seventy kilograms, against which each category''s
    day is set out meal by meal. The piece is a witness of the diet of the very people the edition''s court books, registers and tables name: what their bread, milk, potatoes and meat weighed, and how far short of need the smallholder''s and the day-labourer''s day fell.'
  account_de: 'Ein Aufsatz, „W sprawie odżywiania się ludu" („Über die Ernährung des Volkes"), von Dr. Konstanty Lidmanowski — dem Arzt von Zagórów, dessen Untersuchung der Landwohnungen von 1914 neben ihm in den Zeitungen steht — in Zdrowie, dem Organ der Warschauer Hygienischen Gesellschaft, in seinem achtundzwanzigsten Jahre, Heft 10 von 1912, S. 720-725. Er ist der Boden dieser Edition, von seinem eigenen Beobachter genannt: „Für meine Untersuchungen über die Ernährung des Volkes nahm ich den Powiat Słupca, der sich in einem schmalen Streifen an der Grenze des Großherzogtums Posen hinzieht" — der Powiat, in dem Trąbczyn liegt — und, da die ganze Grenzbevölkerung unter ungefähr gleichen materiellen Verhältnissen lebt, dehnt der Arzt seine Zahlen auf den ganzen Streifen an der preußischen Grenze aus. Die Angaben sammelte er „durch ein Dutzend Jahre". Die Einheit der Rechnungen ist die ciepłostka, die „Wärmeeinheit" — die alte Kalorie: rund 50 je Kilogramm Körpergewicht und Tag für einen
    Schwerarbeitenden, 3.500 für einen Menschen von siebzig Kilogramm, woran der Tag jeder Kategorie Mahlzeit für Mahlzeit abgemessen wird. Das Stück ist ein Zeuge der Kost eben der Leute, die die Gerichtsbücher, Register und Tafeln der Edition nennen: was ihr Brot, ihre Milch, ihre Kartoffeln und ihr Fleisch wogen, und wie weit der Tag des Kleinpächters und des Tagelöhners hinter dem Bedarf zurückblieb.'
  brief_en: 'Dr. Konstanty Lidmanowski of Zagórów reckons, in the Warsaw Hygiene Society''s journal of 1912, what the rural people of the Słupca powiat — the district of Trąbczyn — eat, the day of each wealth set out meal by meal in "heat units" against the 3,500 a working body needs: the farmer of more than fifteen morgens provided for, the day-labourer who summers in Prussia far short.'
  brief_de: 'Der Zagórower Arzt Dr. Konstanty Lidmanowski rechnet im Organ der Warschauer Hygienischen Gesellschaft von 1912 ab, was das Landvolk des Powiat Słupca — des Kreises von Trąbczyn — isst, der Tag jedes Vermögens Mahlzeit für Mahlzeit in „Wärmeeinheiten" gegen die 3.500 eines arbeitenden Körpers abgemessen: der Bauer von mehr als fünfzehn Morgen ausreichend versehen, der Tagelöhner, der den Sommer über in Preußen arbeitet, bleibt weit dahinter zurück.'

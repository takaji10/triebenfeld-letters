- slug: luteraniezagorow
  newspaper: Luteranie Konin
  title: 'The chronicle of the Zagórów filial on the Konin parish''s website: the more important events in the life of the parish of Zagórów, from the Reformation conducted by the monks of Ląd in the sixteenth century, through the evangelicals'' arrival from Silesia, Pomerania and Prussia (1720-1817), the filial of the parish of Grodziec and the parish erected on 24 December 1856, the church bought for, founded and consecrated between 1857 and 1882, the cantor''s house of 1913 and the rectory of 1938, the first service after the Second World War (18 July 1954) and the Evangelical Senior Citizens'' Home of 1995, to the electronic clock and bells of 2008 and the closing of the Senior Citizens'' Home in 2009'
  title_en: 'The chronicle of the Zagórów filial on the Konin parish''s website: the more important events in the life of the parish, from the Reformation of the sixteenth century to the closing of the Evangelical Senior Citizens'' Home in 2009'
  cite: Luteranie Konin, bd. (the site © 2011)
  ref: 'Luteranie Konin (luteranie.konin.pl), bd. [bez daty]: "Zagórów filiał Parafii Ewangelicko - Augsburskiej w Koninie"'
  published: Luteranie Konin (luteranie.konin.pl), the website of the Parafia Ewangelicko-Augsburska w Koninie; the page undated, the site's footer reading "Projekt i wykonanie © Walrom 2011"
  year: 2011
  language: pl
  english_by: Claude, 2026-10-22
  source: https://luteranie.konin.pl/zagorow.html
  image: ''
  translation: ''
  account_en: 'The chronicle of the Zagórów filial on the Konin parish''s own website, Luteranie Konin: the more important events in the life of the parish in Zagórów, anonymous and undated, told in the shape of dated entries from the Reformation among the monks of Ląd in the sixteenth century to the closing of the Evangelical Senior Citizens'' Home in 2009. The page is the congregation speaking of itself on its own site: the evangelicals who came from Silesia, Pomerania and Prussia between 1720 and 1817 and were served from Września; the filial of Grodziec; the parish erected on 24 December 1856; the plot of 1857, the foundation stone of 1878 and the consecration on the first Sunday in Advent 1882; the cantor''s house of 1913 and the rectory of 1938; the first service after the Second World War, celebrated by the Rev. Karol Świtalski on 18 July 1954; the Evangelical Senior Citizens'' Home consecrated in the former cantor''s house by Bishop Michał Warczyński in 1995 and closed in 2009; and
    the electronic clock and bells of 2008.'
  account_de: 'Die Chronik der Filiale Zagórów auf der eigenen Website der Gemeinde Konin, Luteranie Konin: die wichtigeren Ereignisse aus dem Leben der Parafie in Zagórów, anonym und undatiert, in der Form datierter Einträge erzählt, von der Reformation unter den Mönchen von Ląd im sechzehnten Jahrhundert bis zur Schließung des Evangelischen Seniorenheims 2009. Die Seite ist die Gemeinde, die von sich selbst auf ihrer eigenen Site spricht: die Evangelischen, die zwischen 1720 und 1817 aus Schlesien, Pommern und Preußen kamen und von Września aus betreut wurden; die Filiale von Grodziec; die am 24. Dezember 1856 errichtete Parafie; der Platz von 1857, der Grundstein von 1878 und die Weihe am ersten Adventssonntag 1882; das Kantorenhaus von 1913 und das Pfarrhaus von 1938; der erste Gottesdienst nach dem Zweiten Weltkrieg, den am 18. Juli 1954 Pfarrer Karol Świtalski hielt; das Evangelische Seniorenheim, das 1995 im ehemaligen Kantorenhaus durch Bischof Michał Warczyński geweiht und 2009
    geschlossen wurde; und die elektronische Uhr und die elektronischen Glocken von 2008.'
  brief_en: 'The chronicle of the Zagórów filial on the Konin parish''s own website: dated entries telling the parish''s life from the Reformation under the monks of Ląd and the evangelicals'' arrival from Silesia, Pomerania and Prussia (1720-1817), by way of the church of 1882 and the cantor''s house, to the senior citizens'' home of 1995 and its closing in 2009.'
  brief_de: 'Die Chronik der Filiale Zagórów auf der eigenen Website der Gemeinde Konin: datierte Einträge, die das Leben der Parafie erzählen, von der Reformation unter den Mönchen von Ląd und der Ankunft der Evangelischen aus Schlesien, Pommern und Preußen (1720-1817), über die Kirche von 1882 und das Kantorenhaus, bis zum Seniorenheim von 1995 und zu dessen Schließung 2009.'

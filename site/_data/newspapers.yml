- slug: jutrzenka1913z8
  newspaper: Jutrzenka
  title: '"Jak się ubiera nasz lud." ("How our people dress"): the folk attire of the Kingdom''s countryside and its hygiene — the linen shirt and the sheepskin coat that costs some fifteen rubles and grows colder each year, the leather belt that cuts into the flesh, the foot-wraps and the clogs, the tight town shoes of the women, the "American''s" starched collar and celluloid tie, the newborn swaddled so it cannot sleep — carried in the Łódź educational fortnightly from Dr. Lidmanowski''s article in the March issue of the hygiene journal Zdrowie; whether the Jutrzenka page itself is signed is open (NEEDS_CONFIRMATION)'
  title_en: '"How our people dress": the folk attire and its hygiene, carried in the Łódź fortnightly Jutrzenka of April 1913 from Dr. Lidmanowski''s article in the March Zdrowie'
  cite: Jutrzenka (1913)
  ref: Jutrzenka, R. 3, nr 8 (24 kwietnia 1913), s. 7-10
  published: 'Jutrzenka: dwutygodnik ogólno-kształcący, ilustrowany, R. 3, nr 8, Łódź, 24 April 1913, pp. 7-10 ("Jak się ubiera nasz lud.")'
  year: 1913
  language: pl
  english_by: Claude, 2026-10-22 (with the editor's file, corrected against the Polish)
  source: https://mbc.cyfrowemazowsze.pl/dlibra/publication/16784/edition/14458/content?format_id=2
  image: ''
  translation: ''
  account_en: 'A four-page piece, "Jak się ubiera nasz lud." ("How our people dress"), in Jutrzenka, a fortnightly of general education printed in Łódź, its third year, no. 8, of 24 April 1913, pp. 7-10. The piece names its own origin in its second paragraph: "In the March issue of Zdrowie, Dr. Lidmanowski draws attention to various deficiencies of today''s folk attire" — the March 1913 issue of the Warsaw Hygiene Society''s journal, the specialist paper of which Dr. Konstanty Lidmanowski, the physician of Zagórów, had an article on the folk attire; this is that article''s matter, carried to the educational fortnightly''s readers. It speaks of the doctor in the third person throughout, and the file gives no signature: whether the Jutrzenka page itself is signed by him or carries an anonymous digest of his Zdrowie article cannot be settled from the file, and the digitisation was not reachable from the working session — the question is open (NEEDS_CONFIRMATION, "The newspapers"). What it records
    stands whether he wrote it or digested it: how the people of the Kingdom''s countryside — the same people the edition''s documents move among — dressed, by wealth from the farmhand to the well-to-do farmer, and what the doctor thought of it from the hygienic standpoint.'
  account_de: 'Ein vierseitiger Aufsatz, „Jak się ubiera nasz lud." („Wie kleidet sich unser Volk"), in Jutrzenka, einem zweiwöchigen Blatt allgemeiner Bildung, gedruckt in Łódź, in seinem dritten Jahre, Nr. 8, vom 24. April 1913, S. 7-10. Der Aufsatz nennt seinen Ursprung selbst, im zweiten Absatz: „In der Märzausgabe von Zdrowie lenkt Dr. Lidmanowski die Aufmerksamkeit auf verschiedene Mängel der heutigen Volkstracht" — die Märzausgabe 1913 der Zeitschrift der Warschauer Hygienischen Gesellschaft, der Fachzeitschrift, in der Dr. Konstanty Lidmanowski, der Arzt von Zagórów, einen Aufsatz über die Volkstracht hatte; dies ist der Stoff jenes Aufsatzes, den Lesern des Bildungsblattes getragen. Er spricht durchweg vom Arzt in der dritten Person, und die Datei gibt keine Unterschrift: ob die Seite der Jutrzenka selbst von ihm gezeichnet ist oder einen anonymen Auszug seines Zdrowie-Aufsatzes trägt, lässt sich aus der Datei nicht entscheiden, und die Digitalisierung war von der Arbeitssitzung
    aus nicht erreichbar — die Frage ist offen (NEEDS_CONFIRMATION, „Die Zeitungen"). Was das Stück festhält, gilt, ob Lidmanowski es schrieb oder ein anderer es aus ihm auszog: wie die Leute des polnischen Landessss — dieselben Leute, unter denen die Dokumente dieser Edition sich bewegen — sich kleideten, nach Vermögen vom Gutsknecht bis zum wohlhabenden Bauern, und was der Arzt davon vom hygienischen Standpunkt hielt.'
  brief_en: A four-page piece of the Łódź educational fortnightly Jutrzenka of 1913 on how the rural people of the Kingdom dress — the linen shirt of the farmhand, the sheepskin coat of some fifteen rubles that grows colder each year, the tight town shoes of the women — its matter carried there from a hygiene-journal article by Dr. Konstanty Lidmanowski of Zagórów.
  brief_de: Ein vierseitiges Stück der Łodzer Bildungszeitschrift Jutrzenka von 1913 darüber, wie das Landvolk des Königreichs sich kleidet — das Leinenhemd des Gutsknechts, der Schafpelz von etwa fünfzehn Rubeln, der mit jedem Jahr kälter wird, die engen Stadtschuhe der Frauen —, dessen Stoff dorthin getragen ist aus einem Aufsatz des Zagórower Arztes Dr. Konstanty Lidmanowski in einer Hygienezeitschrift.

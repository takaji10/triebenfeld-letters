- slug: ostdeutscherbeobachter19420197
  newspaper: Ostdeutscher Beobachter
  title: '"225 Jahre alte deutsche Siedlung im Wartheland": a feature on the German settlement of Lazinsk (Łazińsk) in the NSDAP daily Ostdeutscher Beobachter of 19 July 1942 — the settlement in the Amtsbezirk Drommin, the wartime name of the rural commune of Trąbczyn, its cemetery of 1727 and its cantor school, and the teacher and farmer Mielke''s new German school of 1933'
  title_en: 'A 225-year-old German settlement in the Wartheland: a feature on Lazinsk (Łazińsk) in the NSDAP daily Ostdeutscher Beobachter of 19 July 1942'
  cite: Ostdeutscher Beobachter (1942)
  ref: 'Ostdeutscher Beobachter: Organ der Nationalsozialistischen Deutschen Arbeiterpartei: Verkündungsblatt des Reichsstatthalters im Reichsgau Wartheland und seiner Behörden, Jg. 4, Nr. 197 (19. Juli 1942)'
  published: Ostdeutscher Beobachter, Jg. 4, Nr. 197, Posen, NS-Gauverlag, 19 July 1942
  year: 1942
  language: de
  english_by: Claude, 2026-10-22 (with the file)
  source: https://www.wbc.poznan.pl/dlibra/publication/121214/edition/131605/content
  image: page.jpg
  translation: ''
  account_en: 'A feature article, signed Willi Spatz, in the Ostdeutscher Beobachter, the NSDAP''s daily for the Reichsgau Wartheland: from 1 November 1939 to 1945 the party''s organ in Posen ("Verkündungsblatt des Reichsstatthalters"), the successor of the Posener Tageblatt, printed by the NS-Gauverlag. A paper of the German occupation, written to its purposes; the article is kept as a witness of its day — of what was printed about the edition''s own ground in 1942 — and its judgements are the paper''s, not the edition''s. Its subject is the "purely German settlement" of Lazinsk — Łazińsk — in the Amtsbezirk Drommin. Both names are the editor''s rulings of 2026-10-22: Drommin is the wartime name of the rural commune of Trąbczyn, the register''s renamed name; Lazinsk is the German-era name of Łazińsk — the colony the edition''s register records as Trąbczyńskie Stare Olędry, which went by many name variants (the register''s Łazińsk and Łaziny, the summons'' Staro-Łazińska, Mielewczyk''s Kolonia
    Łazińskie). The paper treats the place as one village of some 170 families; Breyer''s notebook of 1936 distinguishes its Alt and Nowo Łazinsk — the Stare and Nowe colonies. The article walks from Konin southwest along the Warta into the Amtsbezirk, names the settlement beside Michalinow, and gives it a founding in 1718 by fourteen families out of Silesia led by the village headman (a date the edition''s records contradict — see the summary); the families Kuhn, Merk, Schönfisch and Haupt; a cemetery of 1727 on the hill, with the wooden and iron grave tablets the paper finds "long forgotten in the great German Reich"; and the cantor school, where the service was also held, whose German children were taught until 1933 — when the teacher and farmer Mielke built a new German school at his own expense. The paper tells his transfer to Galicia in 1937, the school taken by the Polish authorities and made a Polish school, his dismissal in 1939, and his return in the autumn of that year: head of
    the school since 1940, with four teachers over 153 German children. Mielke is the teacher Albert Breyer''s notebook of July 1936 names in Łazinsk ("Lehrer i. Łazinsk: Mielke seit 1925", APP 53/968/0/-/669), and Michalinow stands in that notebook too — the article and the notebook are witnesses to the same place and the same man six years apart.'
  account_de: 'Ein Aufsatz, gezeichnet Willi Spatz, im Ostdeutscher Beobachter, dem Tagesblatt der NSDAP im Reichsgau Wartheland: vom 1. November 1939 bis 1945 das Organ der Partei in Posen („Verkündungsblatt des Reichsstatthalters"), Nachfolger des Posener Tageblatts, gedruckt beim NS-Gauverlag. Ein Blatt der deutschen Besatzung, nach ihren Zwecken geschrieben; der Aufsatz wird als Zeuge seines Tages gehalten — als Zeuge dessen, was 1942 über den Grund dieser Edition gedruckt wurde — und seine Urteile sind die der Zeitung, nicht der Edition. Sein Gegenstand ist die „rein deutsche Siedlung" Lazinsk — Łazińsk — im Amtsbezirk Drommin. Beide Namen sind des Editors Entscheidungen vom 2026-10-22: Drommin ist der kriegszeitliche Name der Landgemeinde Trąbczyn, der im Register vermerkte umbenannte Name; Lazinsk ist die Namensform der deutschen Besatzungszeit für Łazińsk — der Kolonie, die das Register der Edition als Trąbczyńskie Stare Olędry führt und die viele Namensvarianten hatte (des Registers
    Łazińsk und Łaziny, der Vorladung von 1860 „Staro-Łazińska", Mielewczyks „Kolonia Łazińskie"). Das Blatt behandelt den Ort als ein Dorf von etwa 170 Familien; Breyers Heft von 1936 unterscheidet sein Alt- und Nowo-Łazinsk — die Kolonien Stare und Nowe. Der Aufsatz geht von Konin südwestlich an der Warthe entlang in den Amtsbezirk, nennt die Siedlung neben Michalinow und gibt ihr eine Gründung im Jahre 1718 durch vierzehn Familien aus Schlesien unter der Führung des Dorfschulzen (ein Datum, dem die Aufzeichnungen der Edition widersprechen — siehe die Zusammenfassung); die Familien Kuhn, Merk, Schönfisch und Haupt; einen Friedhof von 1727 auf dem Hügel, mit den hölzernen und eisernen Grabtafeln, die das Blatt „im großen Deutschen Reich längst vergessen" findet; und die Kantoratsschule, in der auch der Gottesdienst gehalten wurde, in deren deutscher Schule Kinder bis 1933 unterrichtet wurden — als der Lehrer und Bauer Mielke aus eigenen Mitteln eine neue deutsche Schule bauen ließ. Das
    Blatt erzählt seine Versetzung nach Galizien 1937, die von den polnischen Behörden genommene und zur polnischen Schule erklärte Schule, seine Entlassung 1939 und seine Rückkehr im Herbst dieses Jahres: Leiter der Schule seit 1940, mit vier Lehrkräften für 153 deutsche Kinder. Mielke ist der Lehrer, den Albert Breyers Heft vom Juli 1936 in Łazinsk nennt („Lehrer i. Łazinsk: Mielke seit 1925", APP 53/968/0/-/669), und Michalinow steht in jenem Heft ebenfalls — der Aufsatz und das Heft sind Zeugen desselben Ortes und desselben Mannes, sechs Jahre auseinander.'
  brief_en: A feature, signed Willi Spatz, in the NSDAP's daily at Posen of 19 July 1942, on the 'purely German settlement' of Łazińsk in the wartime Amtsbezirk Drommin — the founding of 1718, the cemetery of 1727, the cantor school, and the German school of 1933 — kept as a witness of its day; its judgements are the paper's.
  brief_de: Ein Aufsatz, gezeichnet Willi Spatz, im Tagesblatt der NSDAP in Posen vom 19. Juli 1942, über die Siedlung Łazińsk im kriegszeitlichen Amtsbezirk Drommin — die Gründung von 1718, der Friedhof von 1727, die Kantoratsschule und die deutsche Schule von 1933 — als Zeuge seines Tages gehalten; die Urteile sind die des Blattes.

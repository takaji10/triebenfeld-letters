  translation: ''
  account_en: A death notice on page 4 of the Poznań daily Dziennik Poznański, no. 292 of 20 December 1879, set in a black-bordered box with the dead man's name in display capitals. Włodzimierz hr. Miączyński, "dziedzic majętności Trąbczyna w Królestwie Polskiem", the proprietor of the Trąbczyn estates in the Kingdom of Poland, "died after long sufferings, fortified with the holy sacraments, on the 18th of December of the current year at Trąbczyn". The body was to be sent off ("ekspedycya zwłok") on Monday the 22nd and buried the day after. The notice is signed "the grieving nephew, Władysław hr. Miączyński of Pawłowa".
  account_de: Eine Todesanzeige auf Seite 4 der Posener Tageszeitung Dziennik Poznański, Nr. 292 vom 20. Dezember 1879, in einem schwarz umrandeten Kasten, der Name des Toten in Zierversalien. Włodzimierz hr. Miączyński, „dziedzic majętności Trąbczyna w Królestwie Polskiem“, der Besitzer der Güter von Trąbczyn im Königreich Polen, „starb nach langen Leiden, versehen mit den heiligen Sakramenten, am 18. Dezember des laufenden Jahres in Trąbczyn“. Die Überführung der Leiche („ekspedycya zwłok“) sollte am Montag, dem 22., stattfinden, das Begräbnis am Tag darauf. Gezeichnet ist die Anzeige „der trauernde Neffe, Władysław hr. Miączyński aus Pawłowa“.
  brief_en: The death notice of Włodzimierz Count Miączyński, proprietor of Trąbczyn, in the Dziennik Poznański of 20 December 1879, signed by his nephew Władysław.
  brief_de: Die Todesanzeige des Grafen Włodzimierz Miączyński, Besitzers von Trąbczyn, im Dziennik Poznański vom 20. Dezember 1879, gezeichnet von seinem Neffen Władysław.

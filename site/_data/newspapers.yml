  account_en: A report from Kalisz, dated there 5 December, in the Warsaw newspaper Kuryer Polski, no. 75 of 25 December 1754, on the funeral held at Trąbczyn, "five miles from Kalisz", for Paweł Prusimski, Chamberlain of His Royal Majesty, on the family's hereditary estate. Many related houses came. The abbot of Ląd, Głowiecki, invited to sing the High Mass, was kept from crossing the Warta by an unexpected frost. The prefect of the schools of the Jesuit college at Kalisz preached, and Antoni Prusimski, the dead man's nephew and the later Starost of Niszczewice, gave the funeral oration. At the order of the widow, Katarzyna Prusimska, born Rozdrażewska, exequies were held the same day in the monasteries at Pyzdry, Konin and Kaźmierz, probably Kazimierz Biskupi, because the parish church of Trąbczyn had not room enough. The paper writes the family "Prusiński" and the convent "Łędzki".
  account_de: Ein Bericht aus Kalisch, dort am 5. Dezember datiert, in der Warschauer Zeitung Kuryer Polski, Nr. 75 vom 25. Dezember 1754, über das Begräbnis, das in Trąbczyn, „fünf Meilen von Kalisch“, auf dem Erbgut der Familie für Paweł Prusimski, Kammerherrn Seiner Königlichen Majestät, gehalten wurde. Viele verwandte Häuser kamen. Der Abt von Ląd, Głowiecki, eingeladen, das Hochamt zu singen, wurde durch einen unerwarteten Frost gehindert, die Warthe zu überqueren. Der Präfekt der Schulen des Jesuitenkollegs in Kalisch predigte, und Antoni Prusimski, der Neffe des Toten und spätere Starost von Niszczewice, hielt die Leichenrede. Auf Anordnung der Witwe, Katarzyna Prusimska geb. Rozdrażewska, wurden am selben Tag Exequien in den Klöstern von Pyzdry, Konin und Kaźmierz, wohl Kazimierz Biskupi, gehalten, weil die Pfarrkirche von Trąbczyn nicht Raum genug hatte. Die Zeitung schreibt die Familie „Prusiński“ und das Kloster „Łędzki“.
  brief_en: A report in the Kuryer Polski of 25 December 1754 on the funeral of Paweł Prusimski, the King's chamberlain, at Trąbczyn.
  brief_de: Ein Bericht im Kuryer Polski vom 25. Dezember 1754 über das Begräbnis des Paweł Prusimski, Kammerherrn des Königs, in Trąbczyn.

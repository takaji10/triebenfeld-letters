  image: clipping.jpg
  translation: ''
  account_en: A column of local news from Zagórów in the Poznań daily Dziennik Poznański, no. 180 of 7 August 1937, signed only "(mat)". It has three notes. Some sixty of the town's unemployed have been recruited for seasonal farm work in Germany, and more than one has already sent his family hard-earned money, which eases the town's budget. The old people's home is moving out of its rented rooms in the town, which "did not answer in its rooms", to a brick building on the property of the heirs of Ignacy Ciszewski at Oleśnica, on the highway from Zagórów to Konin, some 300 metres from the old home; there the inmates will have fresh air and the free run of the garden, under the supervision of the deputy mayor, Franciszek Łukaszewski. The paving of the town's streets has begun, and trees are to be planted along the pavements.
  account_de: Eine Ortsspalte aus Zagórów in der Posener Tageszeitung Dziennik Poznański, Nr. 180 vom 7. August 1937, nur mit „(mat)“ gezeichnet. Sie bringt drei Notizen. Etwa sechzig Erwerbslose der Stadt sind für die saisonale Landarbeit in Deutschland angeworben worden, und mancher hat seiner Familie schon erarbeitetes Geld geschickt, was den Stadthaushalt entlastet. Das Altenheim zieht aus seinen gemieteten Räumen in der Stadt, die „in ihren Räumen nicht entsprachen“, in ein massives Gebäude auf dem Grundstück der Erben von Ignacy Ciszewski in Oleśnica, an der Chaussee von Zagórów nach Konin, etwa 300 Meter vom alten Heim; dort werden die Insassen frische Luft und den freien Zugang zum Garten haben, unter der Aufsicht des Vizebürgermeisters Franciszek Łukaszewski. Die Pflasterung der Straßen hat begonnen, und an den Gehwegen sollen Bäume gepflanzt werden.
  brief_en: 'Three notes from Zagórów in the Dziennik Poznański of 7 August 1937: seasonal workers recruited for Germany, the old people''s home moved to Oleśnica, and the streets paved.'
  brief_de: 'Drei Notizen aus Zagórów im Dziennik Poznański vom 7. August 1937: Saisonarbeiter für Deutschland angeworben, das Altenheim nach Oleśnica verlegt und die Straßen gepflastert.'

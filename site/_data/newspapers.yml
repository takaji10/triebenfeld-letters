  translation: ''
  account_en: 'The chronicle of the Zagórów filial on the website of the Lutheran parish of Konin, Luteranie Konin: the parish''s chief events in dated entries, anonymous and undated, from the Reformation among the monks of Ląd in the sixteenth century to 2009. It tells of the evangelicals who came from Silesia, Pomerania and Prussia between 1720 and 1817 and were served from Września, the parish erected on 24 December 1856, the church begun in 1878 and consecrated in Advent 1882, the cantor''s house of 1913 and the rectory of 1938, the first service after the war on 18 July 1954, and the senior citizens'' home opened in the cantor''s house in 1995 and closed in 2009.'
  account_de: 'Die Chronik des Zagórower Filials auf der Website der lutherischen Gemeinde Konin, Luteranie Konin: die wichtigsten Ereignisse der Gemeinde in datierten Einträgen, anonym und undatiert, von der Reformation unter den Mönchen von Ląd im 16. Jahrhundert bis 2009. Sie erzählt von den Evangelischen, die zwischen 1720 und 1817 aus Schlesien, Pommern und Preußen kamen und von Września aus versorgt wurden, der am 24. Dezember 1856 errichteten Gemeinde, der 1878 begonnenen und im Advent 1882 geweihten Kirche, dem Kantorhaus von 1913 und dem Pfarrhaus von 1938, dem ersten Gottesdienst nach dem Krieg am 18. Juli 1954 und dem 1995 im Kantorhaus eröffneten und 2009 geschlossenen Seniorenheim.'
  brief_en: The chronicle of the Lutheran congregation of Zagórów from the parish of Konin's website, from the Reformation to 2009.
  brief_de: Die Chronik der lutherischen Gemeinde Zagórów von der Website der Gemeinde Konin, von der Reformation bis 2009.

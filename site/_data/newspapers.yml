  image: ''
  translation: ''
  account_en: A four-page piece, "Jak się ubiera nasz lud." ("How our people dress"), in Jutrzenka, a fortnightly of general education printed in Łódź, year 3, no. 8 of 24 April 1913, pp. 7-10. It carries to the fortnightly's readers the matter of an article that Dr. Konstanty Lidmanowski, the physician of Zagórów, had published in the March issue of Zdrowie, the journal of the Warsaw Hygiene Society, and it speaks of the doctor in the third person. It tells how the people of the countryside dressed, by wealth from the farmhand to the well-to-do farmer, from the linen shirt to the sheepskin coat and the tight town shoes of the women, and what the doctor thought of it from the standpoint of hygiene.
  account_de: Ein vierseitiger Beitrag, „Jak się ubiera nasz lud.“ („Wie sich unser Volk kleidet“), in Jutrzenka, einer in Lodz gedruckten Halbmonatsschrift für Allgemeinbildung, 3. Jahrgang, Nr. 8 vom 24. April 1913, S. 7-10. Er trägt den Lesern den Inhalt eines Aufsatzes zu, den Dr. Konstanty Lidmanowski, der Arzt von Zagórów, in der Märzausgabe von Zdrowie, der Zeitschrift der Warschauer Hygienischen Gesellschaft, veröffentlicht hatte, und spricht von dem Arzt in der dritten Person. Er erzählt, wie sich die Leute auf dem Land kleideten, nach Vermögen vom Knecht bis zum wohlhabenden Bauern, vom Leinenhemd bis zum Schafpelz und den engen städtischen Schuhen der Frauen, und was der Arzt vom Standpunkt der Hygiene davon hielt.
  brief_en: A piece in the Łódź fortnightly Jutrzenka of 1913 on how the rural people dress, after an article by Dr. Konstanty Lidmanowski of Zagórów.
  brief_de: Ein Beitrag der Lodzer Halbmonatsschrift Jutrzenka von 1913 darüber, wie sich das Landvolk kleidet, nach einem Aufsatz von Dr. Konstanty Lidmanowski aus Zagórów.

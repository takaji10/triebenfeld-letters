- slug: dziennikpoznanski19370807
  newspaper: Dziennik Poznański
  title: '"Z Zagórowa": three municipal notes from Zagórów in the Poznań daily Dziennik Poznański of 7 August 1937 — the recruitment of some sixty unemployed of the town for seasonal farm work in Germany, the moving of the old people''s home from its rented rooms in the town to a property of the heirs of Ignacy Ciszewski at Oleśnica on the road to Konin, under the deputy mayor Franciszek Łukaszewski, and the paving of the town''s streets with trees to be planted along them.'
  title_en: '"From Zagórów": three municipal notes from Zagórów in the Poznań daily Dziennik Poznański of 7 August 1937'
  cite: Dziennik Poznański (1937)
  ref: Dziennik Poznański, R. 79, nr 180 (7 sierpnia 1937)
  published: Dziennik Poznański, R. 79, nr 180, Poznań, 7 August 1937 ("Z Zagórowa")
  year: 1937
  language: pl
  english_by: Claude, 2026-10-22
  source: https://zagorowzhistoria.com/2024/10/02/kolejne-wycinki-z-prasy-sprzed-lat-cz-3/
  image: clipping.jpg
  translation: ''
  account_en: 'A local column from Zagórów in the Poznań daily Dziennik Poznański, no. 180 of 7 August 1937, anonymous and signed only "(mat)". Three notes: the recruitment in the town of some sixty unemployed for seasonal agricultural work in Germany, more than one of whom has already sent his family hard-earned cash, which relieves the municipal budget; the moving of the old people''s home out of its rented rooms in the town — the building "did not answer in its rooms" — to a brick building on the property of the heirs of Ignacy Ciszewski at Oleśnica, on the highway from Zagórów to Konin, some 300 metres from the old home, where the inmates will have fresh air and the free run of the garden, under the supervision of the deputy mayor Franciszek Łukaszewski; and the paving of the town''s streets, begun, with trees to be planted along the pavements.'
  account_de: 'Eine Ortsspalte aus Zagórów in der Posener Tageszeitung Dziennik Poznański, Nr. 180 vom 7. August 1937, anonym, nur mit „(mat)“ gezeichnet. Drei Notizen: die Anwerbung von etwa sechzig Erwerbslosen der Stadt für die saisonale landwirtschaftliche Arbeit in Deutschland, von denen mancher der Familie schon etwas erarbeitetes Geld geschickt hat, was den Stadthaushalt entlastet; die Verlegung des Altenheims aus den gemieteten Räumen in der Stadt — das Haus „entsprach in seinen Räumen nicht“ — in ein massives Gebäude auf dem Grundstück der Erben von Ignacy Ciszewski in Oleśnica an der Chaussee von Zagórów nach Konin, etwa 300 Meter vom alten Heim entfernt, wo die Insassen frische Luft und den freien Zugang zum Garten haben werden, unter der Aufsicht des Vizebürgermeisters Franciszek Łukaszewski; und die begonnene Pflasterung der Straßen der Stadt, entlang derer Bäume gepflanzt werden sollen, die die Stadt schmücken.'

  image: ''
  translation: ''
  account_en: 'An article, "W sprawie odżywiania się ludu" ("On the nutrition of the people"), by Dr. Konstanty Lidmanowski, the physician of Zagórów, in Zdrowie, the journal of the Warsaw Hygiene Society, year 28, no. 10 of 1912, pp. 720-725. For his study he took "the Słupca district, which stretches in a narrow strip on the border of the Grand Duchy of Poznań", the district of Trąbczyn, and extends his figures to the whole strip along the Prussian frontier, from data gathered "for over a dozen years". He reckons in the ciepłostka, the old calorie: some 3,500 a day for a working man of seventy kilograms, against which each kind of household''s day is set out meal by meal, from the farmer of more than fifteen morgens to the day-labourer who summers in Prussia and falls far short.'
  account_de: 'Ein Aufsatz, „W sprawie odżywiania się ludu“ („Zur Ernährung des Volkes“), von Dr. Konstanty Lidmanowski, dem Arzt von Zagórów, in Zdrowie, der Zeitschrift der Warschauer Hygienischen Gesellschaft, 28. Jahrgang, Heft 10 von 1912, S. 720-725. Für seine Untersuchung nahm er „den Kreis Słupca, der sich in schmalem Streifen an der Grenze des Großherzogtums Posen hinzieht“, den Kreis von Trąbczyn, und dehnt seine Zahlen auf den ganzen Streifen entlang der preußischen Grenze aus, aus Angaben, die er „seit über einem Dutzend Jahren“ sammelte. Er rechnet in der ciepłostka, der alten Kalorie: etwa 3.500 am Tag für einen arbeitenden Mann von siebzig Kilogramm, und daran misst er den Tag jeder Art Haushalt, Mahlzeit für Mahlzeit, vom Bauern mit mehr als fünfzehn Morgen bis zum Tagelöhner, der den Sommer in Preußen verbringt und weit darunter bleibt.'
  brief_en: Dr. Lidmanowski of Zagórów on what the rural people of the Słupca district ate, in the Warsaw Hygiene Society's journal of 1912.
  brief_de: Dr. Lidmanowski aus Zagórów darüber, was das Landvolk des Kreises Słupca aß, in der Zeitschrift der Warschauer Hygienischen Gesellschaft von 1912.

- slug: kurjerpoznanski19330712
  newspaper: Kurjer Poznański
  title: '"Zhitleryzowani koloniści" (Hitlerized colonists): a note in the Poznań daily Kurjer Poznański of 12 July 1933 on the German colonists of the rural communes of Oleśnica, Trąbczyn and Szymanowice around Zagórów — since Hitler''s taking power in Germany speaking German at the commune office and answering German at school, and the evangelical teacher dismissed after not one of the colonists'' children came to school on the school inspector''s visit.'
  title_en: 'Hitlerized colonists: a note in the Poznań daily Kurjer Poznański of 12 July 1933 on the German colonists around Zagórów, who since Hitler''s rise speak German at the commune office and at school, and the evangelical teacher dismissed after the colonists'' children stayed away from school on the inspector''s visit.'
  cite: Kurjer Poznański (1933)
  ref: Kurjer Poznański (12 lipca 1933)
  published: Kurjer Poznański, Poznań, 12 July 1933
  year: 1933
  language: pl
  english_by: Claude, 2026-10-22
  source: https://zagorowzhistoria.com/2024/05/24/to-i-owo-cz-2/
  image: clipping.jpg
  translation: ''
  account_en: 'An anonymous note in the Poznań daily Kurjer Poznański of 12 July 1933, headed "Zhitleryzowani koloniści" ("Hitlerized colonists" - the completive z- of Zhitleryzowani is the print''s own, the word set solid). The German colonists of the rural communes of Oleśnica, Trąbczyn and Szymanowice around Zagórów, whose colonies once bore German names (Emilienhain, Ludwigslust), have, since Hitler took power in Germany, "as if something turned over in their heads": at the commune office they make themselves heard in German, not Polish, and the colonists'' children at school answer German to a Polish "dzień dobry". The note closes with an incident: on the school inspector''s visit to a school where an Evangelical taught, not one of the German colonists'' children came, and the teacher was dismissed from his post after it.'
  account_de: 'Eine anonyme Notiz in der Posener Tageszeitung Kurjer Poznański vom 12. Juli 1933, überschrieben „Zhitleryzowani koloniści“ („hitlerysierte Kolonisten“; das kompletive z- von Zhitleryzowani ist des Drucks eigene Schreibung, das Wort zusammen gesetzt). Die deutschen Kolonisten der Landgemeinden Oleśnica, Trąbczyn und Szymanowice um Zagórów, deren Kolonien einst deutsche Namen trugen (Emilienhain, Ludwigslust), haben, seit Hitler in Deutschland die Macht übernommen hat, „als ob sich ihnen im Kopf etwas verdreht hätte“: im Gemeindeverset sprechen sie deutsch, nicht polnisch, und die Kinder der Kolonisten antworten in der Schule auf ein polnisches „dzień dobry“ („guten Tag“) deutsch. Die Notiz schließt mit einem Vorfall: bei dem Besuch des Schulinspektors in einer Schule, in der ein Evangelischer unterrichtete, kam keins der Kinder der deutschen Kolonisten, und der Lehrer wurde nach dem Vorfall von seiner Stelle entlassen.'
  brief_en: A note in the Poznań daily Kurjer Poznański of 12 July 1933 on the German colonists of the rural communes of Oleśnica, Trąbczyn and Szymanowice around Zagórów, who since Hitler's taking of power make themselves heard in German at the commune office and answer German at school; when, on the school inspector's visit, not one of the colonists' children is there, the evangelical teacher is dismissed from his post.
  brief_de: Eine Notiz in der Posener Tageszeitung Kurjer Poznański vom 12. Juli 1933 über die deutschen Kolonisten der Landgemeinden Oleśnica, Trąbczyn und Szymanowice um Zagórów, die sich seit Hitlers Machtübernahme im Gemeindeamt auf Deutsch vernehmbar machen und in der Schule auf Deutsch antworten; als bei dem Besuch des Schulinspektors keins der Kinder der Kolonisten da ist, wird ein evangelischer Lehrer von seiner Stelle entlassen.

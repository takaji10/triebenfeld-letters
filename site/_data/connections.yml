iiihamdaiiinr12366-1:
- de: 'Die Präzedenzfälle des Berichts gehen auf eine Liste zurück: Die Promemoria des Großkanzlers Goldbeck an den König vom 16. Februar 1797 nennt Wybicki, Niemoiewski und Prusimski (geschrieben „Prudzinski“) unter den Haupträdelsführern des Aufstands, die geflohen waren, so dass nur ihr zurückgelassenes Vermögen eingezogen werden konnte. Der Bericht lässt Prusimski 1794 seiner und seiner Frau Gesundheit wegen nach Italien gehen; die Promemoria zählt ihn zu den Geflohenen.'
  en: 'The report''s precedents go back to one list: the Grand Chancellor Goldbeck''s promemoria to the King of 16 February 1797 names Wybicki, Niemoiewski and Prusimski (written "Prudzinski") among the chief ringleaders of the rising who had fled, so that only the property they left behind could be confiscated. The report has Prusimski leave for Italy in 1794 for his and his wife''s health; the promemoria counts him among those who fled.'
  id: fled-ringleaders-restitution-1807
  others:

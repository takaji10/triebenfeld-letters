app53640kalisztab21-1:
- de: 'Das Register der Herdsteuer der Woiwodschaft Kalisch, die Johannisrate von 1789, zählt die Dörfer des Gutes in Geld: Trąpczyn 80 zł, Łazy 12 zł 15 gr, Nowa Wieś 12 zł 15 gr, die Olędry Trąbczyńskie 35 zł und die Olędry Lusnie 35 zł.'

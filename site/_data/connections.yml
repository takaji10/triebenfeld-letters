- de: Die Forderung sagt, Prusimski sei 1794 seiner und seiner Frau Gesundheit wegen nach Italien gegangen und habe sie „peu de tems“ überlebt. Der Bericht der preußischen Minister vom 30. April 1803 hat seine Frau ebenfalls ihrer Gesundheit wegen in Italien und dort gestorben, ihn aber im August 1794 auf seinen Smiłowicer Gütern in Kujawien, wo der kujawische Aufstand bei ihm zum Abschluss gekommen sein soll, und im Januar 1803 noch am Leben, mit einem Gesuch aus Dresden.
  en: The claim says that Prusimski went to Italy in 1794 for his and his wife's health and survived her "peu de tems". The Prussian ministers' report of 30 April 1803 also has his wife in Italy for her health and dead there, but has him at his Smiłowice estates in Kuyavia in August 1794, where the Kuyavian rising was said to have been concluded with him, and still alive, petitioning from Dresden, in January 1803.
  id: prusimski-wife-italy

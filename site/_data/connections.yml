ihagrrep7cnr3570-1:
- de: 'Die Akte trägt die Zuweisung selbst: Hoyms Vorschlag vom 14. Juli 1796 legt dem König die von Prusimski konfiszierten Güter vor — Kamiono und Kulm, die Koniner Dörfer (Trąbczyn, Szetlewek, Nowa Wieś, Łazy, Osiny, die Laski und der Hauland von Trąbczyn unter ihnen) und Brzyce in Kujawien — auf einen Wert von 120.000 rt und einen erwarteten Ertrag von 4 bis 6.000 rt, und die Urkunde vom 9. August 1796 weist sie zu.'
  en: 'The dossier carries the grant itself: Hoym''s proposal of 14 July 1796 puts before the King the estates confiscated from Prusimski — Kamiono and Kulm, the Konin villages (Trąbczyn, Szetlewek, Nowa Wieś, Łazy, Osiny, the Laski and the Hauland of Trąbczyn among them) and Brzyce in Cujavia — at a value of 120,000 rt and an expected yield of 4 to 6,000 rt, and the deed of 9 August 1796 grants them.'
  id: donation-dossier-yields
  others:
  - label_de: Oe 1 Bü 9454, Dokument 103 (13. März 1799)
    label_en: Oe 1 Bü 9454, document 103 (13 March 1799)
    permalink: /documents/oe1bu9454/103/
    uid: oe1bu9454-103
oe1bu9454-103:
- de: 'Der Brief meldet, drei Jahre später, was dieselbe Schenkung brachte: Im März 1799 tragen Kamiono und Kulm 6.000 rt, Trąbczyn 8.400, Szetlewek 1.600 und Brzyce 4.000 — zusammen 20.000, wo der Vorschlag der Akte von 1796 von dem Ganzen 4 bis 6.000 erwartet hatte.'
  en: 'The letter reports, three years on, what the same gift brought: by March 1799 Kamiono and Kulm yield 6,000 rt, Trąbczyn 8,400, Szetlewek 1,600 and Brzyce 4,000 — 20,000 together, where the dossier''s proposal of 1796 had expected 4 to 6,000 from the whole.'
  id: donation-dossier-yields
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3570, Dokument 1 (9. August 1796)
    label_en: I. HA GR, Rep. 7 C, Nr. 3570, document 1 (9 August 1796)
    permalink: /documents/ihagrrep7cnr3570/1/
    uid: ihagrrep7cnr3570-1

ihagrrep7cnr421-4:
- de: 'Mondro unterscheidet „die von dem von Chełmski gegen den Fürsten von Hohenlohe, als nunmehrigen Eigenthümer der dem Prusimski confiscirten Güter Trąmpczyn anfänglich angestellte Klage“ von der jetzigen gegen den Fiskus: Die erste ist der Prozess, den Triebenfelds Briefe an den Fürsten verfolgen.'
  en: 'Mondro distinguishes "die von dem von Chełmski gegen den Fürsten von Hohenlohe, als nunmehrigen Eigenthümer der dem Prusimski confiscirten Güter Trąmpczyn anfänglich angestellte Klage" from the present suit against the Fiscus: the first is the process Triebenfeld''s letters to the Prince follow.'

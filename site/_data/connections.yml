app53170koningr145-1:
- de: Das Grenzdekret bezeugt die Ansiedlung der Holländer auf den Trąbczyner Wäldern „wie die ihnen 1746 verliehenen Rechte bezeugen". Das Privileg selbst ist nicht erhalten; mit der Besichtigung von 1754 ist dieses Dekret der früheste erhaltene Zeuge davon.
  en: The boundary decree attests the Hollanders' settlement on the Trąbczyn woods "as the rights granted them in 1746 attest". The privilege itself does not survive; with the inspection of 1754 this decree is the earliest surviving witness of it.

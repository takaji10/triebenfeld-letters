agad1169011745-1:
- de: 'Das Häuser- und Einwohnerregister des Generaldirektoriums (die Seiten tragen kein Datum; das Archiv datiert den Band auf 1797) zählt dieselben Dörfer in Häusern und Menschen: „Haul. Lazy." 5 Häuser und 42 Menschen, die Hauländerei von Trąpczyn 34 Häuser und 271 Menschen, Stara Huta von Trąpczyn 2 Häuser. Die beiden Register, acht Jahre auseinander, zählen denselben Grund zweimal — Herdgeld 1789, Häuser und Menschen 1797.'
  en: 'The General Directory''s house-and-population register (the pages carry no date; the archive dates the volume 1797) counts the same villages in houses and people: "Haul. Lazy." 5 houses and 42 people, the Hauland of Trąpczyn 34 houses and 271 people, Stara Huta of Trąpczyn 2 houses. The two registers, eight years apart, count the same ground twice — hearth money in 1789, houses and people in 1797.'
  id: two-counts-trabczyn
  others:
  - label_de: 53/64/0/-/Kalisz Tab.21, Dokument 1 (1789)
    label_en: 53/64/0/-/Kalisz Tab.21, document 1 (1789)
    permalink: /documents/app53640kalisztab21/1/
    uid: app53640kalisztab21-1
agad1174016-2:
- de: Das Protokoll des Registers desselben Tages trägt dieselbe Resolution, unterschrieben von Małachowski als Präsidenten und Łuszczewski als Generalsekretär — derselbe Beschluss wie der Entwurf der Akte, von zwei Stellen der Kommission verwahrt.
  en: The register's protocol of the same day carries the same resolution, signed by Małachowski as President and Łuszczewski as General Secretary — the same decision as the file's draft, kept by two offices of the Commission.
  id: dabska-resolution-two-offices

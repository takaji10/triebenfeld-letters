- de: 'Drei der Haupträdelsführer, die die Promemoria als geflohen nennt und deren Vermögen eingezogen wurde — Wybicki, Niemoiewski und Prusimski (geschrieben „Prudzinski“) —, sind die Männer, deren Güter im Juli 1807 zurückkamen: Die Regierungskommission erstreckte das Urteil des Kaisers für Wybicki auf General Niemojewski, auf Wichrowski und auf Prusimskis Tochter Michalina Dąbska, und der Warschauer Bericht von 1818 über ihren Anspruch führt die Rückgaben an Wybicki und Niemojewski als Präzedenzfälle an.'
  en: 'Three of the chief ringleaders the promemoria names as fled, their property confiscated — Wybicki, Niemoiewski and Prusimski (written "Prudzinski") — are the men whose estates came back in July 1807: the Governing Commission extended the Emperor''s judgment for Wybicki to General Niemojewski, to Wichrowski and to Prusimski''s daughter Michalina Dąbska, and the Warsaw report of 1818 on her claim cites the restitutions to Wybicki and Niemojewski as precedents.'
  id: fled-ringleaders-restitution-1807
  others:
  - label_de: 1/174/0/1/6, Dokument 2 (21. Juli 1807)
    label_en: 1/174/0/1/6, document 2 (21 July 1807)
    permalink: /documents/agad1174016/2/
    uid: agad1174016-2
  - label_de: III. HA MdA, III. Nr. 12366, Dokument 1 (20. Januar 1819)

    uid: agad11740273-2
- de: 'Sechs Jahre nach seiner Promemoria von 1797 rät Goldbeck erneut zur Gnade und hält die Konfiskation erneut heraus: Die beiden Supplikanten seien „durch die Confiscation ihres Vermögens, wobey es unabänderlich verbleiben muß“, bestraft und könnten heimkehren.'
  en: 'Six years after his promemoria of 1797, Goldbeck again advises mercy and again keeps the confiscation out of it: the two petitioners have been punished "durch die Confiscation ihres Vermögens, wobey es unabänderlich verbleiben muß", and may be allowed home.'
  id: goldbeck-confiscation-stands
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3067, Dokument 1 (16. Februar 1797)

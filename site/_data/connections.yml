    uid: agad11740273-1
agad11740273-1:
- de: Der Entwurf der Resolution der Kommission vom 21. Juli 1807, in Dresden gefertigt, erstreckt das dem Wybicki in Finckenstein gegebenen kaiserliche Dekret auf die Fälle von Michalina Dąbska, General Niemojewski und Wichrowski, damit die vom früheren preußischen Staat konfiszierten Güter an ihre wahren Eigentümer zurückkehren.
  en: The draft of the Commission's resolution of 21 July 1807, drawn up at Dresden, extends the Emperor's decree given at Finckenstein for Wybicki to the cases of Michalina Dąbska, General Niemojewski and Wichrowski, so that the estates confiscated by the former Prussian government return to their rightful owners.
  id: dabska-resolution-two-offices
  others:
  - label_de: 1/174/0/1/6, Dokument 2 (21. Juli 1807)
    label_en: 1/174/0/1/6, document 2 (21 July 1807)
    permalink: /documents/agad1174016/2/
    uid: agad1174016-2
app53170koningr145-1:
- de: Das Grenzdekret bezeugt die Ansiedlung der Holländer auf den Trąbczyner Wäldern „wie die ihnen 1746 verliehenen Rechte bezeugen". Das Privileg selbst ist nicht erhalten; mit der Besichtigung von 1754 ist dieses Dekret der früheste Zeuge davon in der Edition.
  en: The boundary decree attests the Hollanders' settlement on the Trąbczyn woods "as the rights granted them in 1746 attest". The privilege itself does not survive; with the inspection of 1754 this decree is the earliest witness of it in the edition.
  id: privilege-1746-chain

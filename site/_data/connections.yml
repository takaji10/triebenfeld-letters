oe1bu9454-286:
- de: Die Promemoria sagt, Prusimski habe die Trąbczyner Güter „an den v. Chełmski für 36000 Ducaten“ verpfändet. Chełmskis eigene Eingabe und Klage von 1799 nennen das Darlehen mit 12.000 Dukaten, im Juni 1794 gegen Prusimskis Verschreibung gegeben, er dürfe die Güter bis zur Rückzahlung besitzen.
  en: The memorandum says Prusimski had pledged the Trąbczyn estates "an den v. Chełmski für 36000 Ducaten". Chełmski's own petition and suit of 1799 give the loan as 12,000 ducats, lent in June 1794 against Prusimski's undertaking that he might hold the estates until repaid.

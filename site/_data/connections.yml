ihagrrep7cnr1414-1:
- de: Der Großkanzler, an den dieser Entwurf auch geht, schreibt dem König fünf Wochen später, am 16. Februar 1797, von den Haupträdelsführern des Aufstands, die sich mit der Flucht gerettet hatten, nennt Prusimski, geschrieben „Prudzinski“, unter ihnen und rät, die Konfiskation der Güter der geflohenen Rebellen bestehen zu lassen.
  en: The Grand Chancellor to whom this draft also goes writes to the King five weeks later, on 16 February 1797, of the chief ringleaders of the rising who had saved themselves by flight, names Prusimski among them, written "Prudzinski", and advises that the confiscation of the fled rebels' estates stand.
  id: prusimski-venice-goldbeck
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3067, Dokument 1 (16. Februar 1797)
    label_en: I. HA GR, Rep. 7 C, Nr. 3067, document 1 (16 February 1797)
    permalink: /documents/ihagrrep7cnr3067/1/
    uid: ihagrrep7cnr3067-1
ihagrrep7cnr1414-2:
- de: Der Resident berichtet, Prusimski sei „pour la mort de son epouse“ gebrochen. Der Bericht der Minister von 1803 sagt, seine Frau habe sich ihrer Gesundheit wegen in Italien aufhalten müssen und sei dort gestorben, und er habe von Italien aus vor der Konfiskation Hoffnung auf seine Rückkehr gemacht; 1803 lebte er in Dresden und durfte heimkehren.
  en: The resident reports Prusimski broken "pour la mort de son epouse". The ministers' report of 1803 says that his wife had had to stay in Italy for her health and died there, and that he had held out hope of his return from Italy before the confiscation was decreed; in 1803 he was living at Dresden and was allowed home.
  id: prusimski-wife-italy
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3132, Dokument 5 (30. April 1803)
    label_en: I. HA GR, Rep. 7 C, Nr. 3132, document 5 (30 April 1803)

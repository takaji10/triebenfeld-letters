  en: '"Chełmski hatt noch nicht apellirt": Triebenfeld reports in April 1798 that Chełmski has not yet appealed. Chełmski''s own petition of 1799 tells his side: he had held Trąbczyn on Prusimski''s undertaking and had to give it up to the Prince after the judgment of revision.'

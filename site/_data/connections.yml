    uid: iiihamdaiiinr12366-1
- de: Die Konfiskation gegen die geflohenen Rädelsführer, die Goldbeck hier bestehen lassen will, erklären er und Haugwitz 1803 für unabänderlich, als der König Prusimski, einem dieser Rädelsführer, die Heimkehr erlaubt.
  en: The confiscation of the fled ringleaders, which Goldbeck advises here should stand, is the one he and Haugwitz declare unalterable in 1803, when the King allows Prusimski, one of those ringleaders, to return home.
  id: goldbeck-confiscation-stands
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3132, Dokument 5 (30. April 1803)

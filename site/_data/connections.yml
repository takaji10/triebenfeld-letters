app539680783-1:
- de: 'Die Vorladung nennt, wer jenes Privileg verlieh: „Paweł z Kolna Prusiński" und seine Frau Katarzyna z Rozdrażewskich. Sie beruft sich auf den späteren Vertrag vom 18. Mai 1805, geschlossen zwischen dem Fürsten Hohenlohe und vierzehn Kolonisten der Gmina Trąbczyn vor seinem Patrimonialgericht zu Zagórów, dessen Weide- und Sammelrechte in den Studziankaer Wäldern der Prozess verteidigt.'
  en: 'The summons names who granted that privilege: "Paweł z Kolna Prusiński" and his wife Katarzyna z Rozdrażewskich. It pleads the later contract of 18 May 1805, made between Prince Hohenlohe and fourteen colonists of the gmina of Trąbczyn before his patrimonial court at Zagórów, whose grazing and gathering rights in the Studzianka woods the suit defends.'
  id: privilege-1746-chain

    label_en: III. HA MdA, III. Nr. 12366, document 1 (20 January 1819)
    permalink: /documents/iiihamdaiiinr12366/1/
    uid: iiihamdaiiinr12366-1
ihagrrep7cnr3067-1:
- de: Goldbeck rät dem König, bei jeder Begnadigung die Konfiskation gegen die ausgetretenen Rebellen zu belassen, „da besonders über die eingezogenen Güter größtentheils schon disponirt ist“. Ein halbes Jahr zuvor hatte er selbst mit Hoym dem König die Schenkungsurkunden für sieben Offiziere vorgelegt; die des Fürsten zu Hohenlohe-Ingelfingen bestand aus den Gütern Prusimskis, den die Promemoria, geschrieben „Prudzinski“, unter den geflohenen Rädelsführern nennt.
  en: Goldbeck advises the King that, whatever pardon is granted, the confiscation of the rebels who had left the country should stand, "da besonders über die eingezogenen Güter größtentheils schon disponirt ist" — most of the confiscated estates had already been disposed of. Half a year earlier he had himself, with Hoym, laid before the King the deeds granting such estates to seven officers; the Prince of Hohenlohe-Ingelfingen's grant was made up of the estates taken from Prusimski, whom the promemoria names, written "Prudzinski", among the ringleaders who fled.
  id: goldbeck-confiscated-estates-disposed
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3570, Dokument 1 (9. August 1796)
    label_en: I. HA GR, Rep. 7 C, Nr. 3570, document 1 (9 August 1796)
    permalink: /documents/ihagrrep7cnr3570/1/
    uid: ihagrrep7cnr3570-1
- de: Fünf Wochen vor der Promemoria hatte das Auswärtige Departement Goldbeck, mit Hoym und Schroetter, den Bericht des preußischen Residenten in Venedig über Anton Prusimski mitgeteilt, der sich dort aufhielt. Die Promemoria zählt ihn, geschrieben „Prudzinski“, zu den Haupträdelsführern, die „sich mit der Flucht gerettet“ haben.
  en: Five weeks before the promemoria the foreign department had sent Goldbeck, with Hoym and Schroetter, the Prussian resident's report from Venice on Anton Prusimski, who was staying there. The promemoria counts him, written "Prudzinski", among the chief ringleaders who "haben sich mit der Flucht gerettet" — had saved themselves by flight.
  id: prusimski-venice-goldbeck
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 1414, Dokument 1 (11. Januar 1797)
    label_en: I. HA GR, Rep. 7 C, Nr. 1414, document 1 (11 January 1797)
    permalink: /documents/ihagrrep7cnr1414/1/

- de: 'Der Bericht von 1803 nennt die drei Generäle, denen Prusimskis Güter geschenkt wurden: „seine Trampczyner Güter dem Herrn Fürsten von Hohenlohe, seine Pawlower Güter dem jetzigen General Major von Sanitz, und seine Smilowicer Güter dem General Lieutenant von Bischofswerder“. 1807 nennt seine Tochter dieselben drei, Hohenlohe, Bischoffswerder und Zanitz, als sie Trąbczyn, Kamionna, Kolno, Pawłów und Pawłówek zurückverlangt.'
  en: 'The report of 1803 names the three generals who were given Prusimski''s estates: "seine Trampczyner Güter dem Herrn Fürsten von Hohenlohe, seine Pawlower Güter dem jetzigen General Major von Sanitz, und seine Smilowicer Güter dem General Lieutenant von Bischofswerder". In 1807 his daughter names the same three, Hohenlohe, Bischoffswerder and Zanitz, when she asks for Trąbczyn, Kamionna, Kolno, Pawłów and Pawłówek back.'
  id: prusimski-estates-three-donees
  others:

agad11740273-1:
- de: Der Entwurf der Resolution der Kommission vom 21. Juli 1807, in Dresden gefertigt, erstreckt das dem Wybicki in Finckenstein gegebenen kaiserliche Dekret auf die Fälle von Michalina Dąbska, General Niemojewski und Wichrowski, damit die vom früheren preußischen Staat konfiszierten Güter an ihre wahren Eigentümer zurückkehren.
  en: The draft of the Commission's resolution of 21 July 1807, drawn up at Dresden, extends the Emperor's decree given at Finckenstein for Wybicki to the cases of Michalina Dąbska, General Niemojewski and Wichrowski, so that the estates confiscated by the former Prussian government return to their rightful owners.
  id: dabska-resolution-two-offices
  others:
  - label_de: 1/174/0/1/6, Dokument 2 (21. Juli 1807)
    label_en: 1/174/0/1/6, document 2 (21 July 1807)
    permalink: /documents/agad1174016/2/
    uid: agad1174016-2
agad11740273-2:
- de: 'Die Bittschrift nennt die Güter „Oycu memu na rzecz Generałów Pruskich, Xięcia de Hohenlo[h]e, Bischoffswerder i Zanitz skonfiskowanych“. Der Bericht der preußischen Minister von 1803 sagt, welche an wen gingen: die Trąbczyner Güter an den Fürsten von Hohenlohe, die Pawłower an General von Sanitz, die Smiłowicer an General von Bischofswerder.'
  en: 'The petition names the estates "Oycu memu na rzecz Generałów Pruskich, Xięcia de Hohenlo[h]e, Bischoffswerder i Zanitz skonfiskowanych". The Prussian ministers'' report of 1803 says which went to whom: the Trąbczyn estates to the Prince of Hohenlohe, the Pawłów estates to General von Sanitz, the Smiłowice estates to General von Bischofswerder.'
  id: prusimski-estates-three-donees
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3132, Dokument 5 (30. April 1803)
    label_en: I. HA GR, Rep. 7 C, Nr. 3132, document 5 (30 April 1803)

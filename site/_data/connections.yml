- de: '„Chełmski hatt in der 2ten Instanz auch verlohren“: Chełmskis Eingabe vom Oktober 1799 sagt, er habe Trąmpczyn nach dem Revisionserkenntnis dem Fürsten räumen müssen und sei mit seiner Forderung an den Fiskus verwiesen worden, der ihn dann nicht hörte.'
  en: '"Chełmski hatt in der 2ten Instanz auch verlohren": Chełmski''s petition of October 1799 says that after the judgment of revision he had to give Trąbczyn up to the Prince and was referred with his claim to the Fiscus, which then refused to hear him.'

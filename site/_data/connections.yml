agad1169011745-1:
- de: 'Das Häuser- und Einwohnerregister des Generaldirektoriums (die Seiten tragen kein Datum; das Archiv datiert den Band auf 1797) zählt dieselben Dörfer in Häusern und Menschen: „Haul. Lazy." 5 Häuser und 42 Menschen — eine Zeile, die eine frühere Anmerkung für wahrscheinlich die Łazińskie Olędry hielt, nicht für das Dorf Łazy —, die Hauländerei von Trąpczyn 34 Häuser und 271 Menschen, Stara Huta von Trąpczyn 2 Häuser. Die beiden Register, acht Jahre auseinander, zählen denselben Grund zweimal — Herdgeld 1789, Häuser und Menschen 1797.'
  en: 'The General Directory''s house-and-population register (the pages carry no date; the archive dates the volume 1797) counts the same villages in houses and people: "Haul. Lazy." 5 houses and 42 people — a row an earlier note took to be probably the Łazińskie Olędry, not the village of Łazy it appears beside —, the Hauland of Trąpczyn 34 houses and 271 people, Stara Huta of Trąpczyn 2 houses. The two registers, eight years apart, count the same ground twice — hearth money in 1789, houses and people in 1797.'
  id: two-counts-trabczyn
  others:
  - label_de: 53/64/0/-/Kalisz Tab.21, Dokument 1 (1789)
    label_en: 53/64/0/-/Kalisz Tab.21, document 1 (1789)
    permalink: /documents/app53640kalisztab21/1/
    uid: app53640kalisztab21-1
agad1174016-2:
- de: Das Protokoll des Registers desselben Tages trägt dieselbe Resolution, unterschrieben von Małachowski als Präsidenten und Łuszczewski als Generalsekretär — derselbe Beschluss wie der Entwurf der Akte, von zwei Stellen der Kommission verwahrt.
  en: The register's protocol of the same day carries the same resolution, signed by Małachowski as President and Łuszczewski as General Secretary — the same decision as the file's draft, kept by two offices of the Commission.
  id: dabska-resolution-two-offices
  others:
  - label_de: 1/174/0/2/73, Dokument 1 (21. Juli 1807)
    label_en: 1/174/0/2/73, document 1 (21 July 1807)
    permalink: /documents/agad11740273/1/
    uid: agad11740273-1
- de: Zehn Jahre zuvor, am 16. Februar 1797, hatte der Großkanzler Goldbeck dem König Wybicki, Niemoiewski und Prusimski (geschrieben „Prudzinski“) unter den Haupträdelsführern des Aufstands von 1794 genannt, die geflohen waren, so dass nur ihr zurückgelassenes Vermögen eingezogen werden konnte. Diese Resolution stellt die Güter des zweiten und die der Tochter des dritten unter das für den ersten ergangene Urteil.
  en: Ten years earlier, on 16 February 1797, the Grand Chancellor Goldbeck had named Wybicki, Niemoiewski and Prusimski (written "Prudzinski") to the King among the chief ringleaders of the rising of 1794 who had fled, so that only the property they left behind could be confiscated. This resolution brings the estates of the second, and of the third's daughter, under the judgment given for the first.
  id: fled-ringleaders-restitution-1807
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3067, Dokument 1 (16. Februar 1797)
    label_en: I. HA GR, Rep. 7 C, Nr. 3067, document 1 (16 February 1797)

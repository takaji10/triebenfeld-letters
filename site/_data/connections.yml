  en: 'The hearth-tax register of the Kalisz voivodeship, the Midsummer instalment of 1789, counts the estate''s villages in money: Trąpczyn 80 zł, Łazy 12 zł 15 gr, Nowa Wieś 12 zł 15 gr, the Olędry Trąbczyńskie 35 zł and the Olędry Lusnie 35 zł.'

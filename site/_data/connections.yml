    uid: ihagrrep7cnr3132-5
ihagrrep7cnr3132-5:
- de: Der Bericht der Minister von 1803 sagt, Prusimski habe „von Italien aus, wo sich damals angeblich seine auch dort verstorbene Ehegattin zur Herstellung ihrer Gesundheit, aufhalten mußte“, Hoffnung auf seine Rückkehr gemacht. Der preußische Resident in Venedig hatte im Dezember 1796 berichtet, er sei krank und durch ihren Tod gebrochen zu ihm gekommen; die Forderung seiner Tochter von 1818 sagt, er sei 1794 seiner und seiner Frau Gesundheit wegen nach Italien gegangen und habe sie nur kurz überlebt - während dieser Bericht ihn im Januar 1803 von Dresden aus bitten lässt.
  en: The ministers' report of 1803 says that Prusimski held out hope of his return "von Italien aus, wo sich damals angeblich seine auch dort verstorbene Ehegattin zur Herstellung ihrer Gesundheit, aufhalten mußte". The Prussian resident at Venice had reported in December 1796 that he came to him ill and broken by her death; his daughter's claim of 1818 says he went to Italy in 1794 for his and his wife's health, and survived her only a short time - while this report has him petitioning from Dresden in January 1803.
  id: prusimski-wife-italy

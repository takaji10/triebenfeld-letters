    uid: ihagrrep7cnr3067-1
ihagrrep7cnr3570-1:
- de: 'Die Akte trägt die Zuweisung selbst: Hoyms Vorschlag vom 14. Juli 1796 legt dem König die von Prusimski konfiszierten Güter vor — Kamiono und Kulm, die Koniner Dörfer (Trąbczyn, Szetlewek, Nowa Wieś, Łazy, Osiny, die Laski und der Hauland von Trąbczyn unter ihnen) und Brzyce in Kujawien — auf einen Wert von 120.000 rt und einen erwarteten Ertrag von 4 bis 6.000 rt, und die Urkunde vom 9. August 1796 weist sie zu.'
  en: 'The dossier carries the grant itself: Hoym''s proposal of 14 July 1796 puts before the King the estates confiscated from Prusimski — Kamiono and Kulm, the Konin villages (Trąbczyn, Szetlewek, Nowa Wieś, Łazy, Osiny, the Laski and the Hauland of Trąbczyn among them) and Brzyce in Cujavia — at a value of 120,000 rt and an expected yield of 4 to 6,000 rt, and the deed of 9 August 1796 grants them.'
  id: donation-dossier-yields
  others:
  - label_de: Oe 1 Bü 9454, Dokument 103 (13. März 1799)
    label_en: Oe 1 Bü 9454, document 103 (13 March 1799)
    permalink: /documents/oe1bu9454/103/
    uid: oe1bu9454-103
- de: 'Die Akte ist die Verfügung, auf die sich der Großkanzler ein halbes Jahr später beruft: Hoym schlägt die dem „Haupt Insurgenten“ Anton von Prusimski konfiszierten Güter für den Fürsten zu Hohenlohe-Ingelfingen vor, und am 9. und 20. August 1796 legen Goldbeck und Hoym dem König die Schenkungsurkunden für sieben Offiziere vor. In seiner Promemoria vom 16. Februar 1797 rät Goldbeck, die Konfiskation gegen die geflohenen Rebellen bestehen zu lassen, da über die eingezogenen Güter größtenteils schon verfügt sei, und nennt Prusimski, geschrieben „Prudzinski“, unter ihnen.'
  en: 'The dossier is the disposal the Grand Chancellor refers to six months later: Hoym proposes the estates confiscated from "the chief insurgent" Anton von Prusimski for the Prince of Hohenlohe-Ingelfingen, and on 9 and 20 August 1796 Goldbeck and Hoym lay the deeds of gift for seven officers before the King. In his promemoria of 16 February 1797 Goldbeck advises that the confiscation of the fled rebels stand, since most of the confiscated estates had already been disposed of, and names Prusimski, written "Prudzinski", among them.'
  id: goldbeck-confiscated-estates-disposed
  others:
  - label_de: I. HA GR, Rep. 7 C, Nr. 3067, Dokument 1 (16. Februar 1797)
    label_en: I. HA GR, Rep. 7 C, Nr. 3067, document 1 (16 February 1797)
    permalink: /documents/ihagrrep7cnr3067/1/
    uid: ihagrrep7cnr3067-1
ihagrrep7cnr421-1:
- de: 'Chełmski schreibt, er habe sich in den Besitz von Trąmpczyn und Nowa Wieś gesetzt, „müste jedoch solche an den Furst v Hohenlohe Ingelfingen ... nach Eröfnung des Revirions Erkenntnißes räumen“: der Prozess gegen den Fürsten, den Triebenfeld 1798 und 1799 für den Fürsten verfolgte; im März 1799 meldete er, Chełmski habe in zweiter Instanz verloren.'
  en: 'Chełmski writes that he had taken possession of Trąbczyn and Nowa Wieś but "müste jedoch solche an den Furst v Hohenlohe Ingelfingen ... nach Eröfnung des Revirions Erkenntnißes räumen": the suit against the Prince that Triebenfeld followed for the Prince in 1798 and 1799; in March 1799 he reported that Chełmski had lost in the second instance.'
  id: chelmski-suit-against-hohenlohe

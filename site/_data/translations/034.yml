status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness''s most highly esteemed
    letter of the 7th of this month I have just received with the enclosures, and reply to it most obediently
    that Honrich''s representation is a boundless nonsense, which however has been answered by Your Serene
    Highness at once just as the fellow deserves. I had written 21 letters to the lad, partly by mounted
    and partly by foot messengers, but never did the man answer me — I was pressed here and there, had
    to have costs of every kind paid through Professor Rhoda, but from Honrichs I received neither money,
    nor account, nor a single syllable of a reckoning — since Schmid was dead and all further enquiry
    would now be in vain, I resolved to appoint other men there, who were faithful and who taken together
    should cost less than Schanck alone — I did this all the more since the French authority was willing
    to intervene there in my favour and to have the arrears in part collected. For that the accounts and
    judicially attested statements were now required. Something, and to that end I engaged Hester, who
    receives 600 Rthl yearly and some allowance in kind as Tietz does; but otherwise not a farthing more
    — how can such a lad say that the man will cost 10000 a year — the Bösmacht has cost them thus far,
    and now he is vexed that Hester stands in his way. Something Hester has already sent in by way of
    statements of the advances. Your Serene Highness''s decided letter will now doubtless take from Honrichs
    the courage to withhold the papers any longer, and once I have the statements I shall summon men here
    who will indeed take effect — from our own authorities one may by no means promise oneself any help
    at all; that looks a sorry business — Be that as it may, that friend will shortly still do something
    for the [uncertain: Gmacher]; let Your Serene Highness only take care that you receive the money there,
    as I have written in all my 6 letters. The first news of it will give me new strength to come to Gringen,
    and then much shall be made clear to you.'
- page: 2
  en: 'My greatest grief and care is that I may first pay off the borrowed monies for the Invalids'' Fund,
    and return to Herr von Zastrow his bill of exchange and the pledged mortgage. Shame and disgrace would
    press me to the ground if this were left undone. Everything must be summoned up so that this is set
    right. The letters to Amelang and Kopp I still have lying behind me, because the latter in particular
    is not yet back — but I very much doubt his help — Still I lie wretchedly ill; grief and sorrow all
    but wear me away. The Invalids'' affair has given my health a great blow. It may be that the setting
    right of it will contribute much to my recovery. — Still more, however, if I may see Your Serene Highness
    in person and so make my reckoning. There all shall soon be [uncertain: settled] for him. In short,
    if Your Serene Highness can obtain money there, then I shall come thither, cede the mortgage of 250
    Rthl, and both your sorrow and mine will at once be wholly lifted. In deepest reverence I remain,
    until death, Your Most Serene Highness''s — I do not know whether I address my letters rightly; it
    always takes so long before I am graciously favoured with an answer to them. I have sent the estimates
    and other judicially certified documents — I have in three, this is the [uncertain: fourth] letter
    — described everything as it stands and what may be done to Your Serene Highness''s advantage — but
    to all of these I have as yet had not a single answer. Most faithful and most obedient servant, Breslau,
    the 18th of April 1808. v Triebenfeld'

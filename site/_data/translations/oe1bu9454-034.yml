- page: 2
  en: 'My greatest [uncertain: Gräne] and care is that I may first pay off the borrowed monies for the
    Invalids'' Fund, and return to Mr von Zastrow his bill of exchange and the pledged mortgage. [uncertain:
    Schonau] and shame would press me to the ground if this were left undone. Everything must be exerted
    to have this set right. The letters to Amelang and Kopp I still have lying by me, because the latter
    in particular is not yet back — but I very much doubt his help — I still lie wretchedly ill; grief
    and sorrow all but wear me away. The Invalids'' business has given my health a great blow. It may
    be that the settling of it will contribute much to my recovery. — Still more, however, if I may see
    Your Serene Highness in person and settle accounts so. Then all shall soon be [uncertain: soll] for
    him. In short, if Your Serene Highness can have money there, then I shall come thither, cede the mortgage
    of 250/m rt, and both your sorrow and mine will at once be wholly lifted. In deepest reverence I remain,
    until death, Your Most Serene Highness''s — I do not know whether I also address my letters rightly;
    it always takes so long before I am graced with an answer to them. I have sent the valuations and
    other judicially certified pieces — I have in three — this is the [illegible]th letter — everything
    as it stands, and what can be done to Your Serene Highness''s advantage, described — but to all these
    I have not yet a syllable of answer.


    Wrocław, the 18th of April


    1808.


    most faithful and obedient servant


    v Triebenfeld'

- page: 2
  en: 'My greatest grief and care is that I may first pay off the borrowed monies for the Invalids'' Fund,
    and return to Mr. von Zastrow his bill of exchange and the pledged mortgage. [uncertain: Schonau]
    and shame would press me to the ground if this were left undone. Everything must be exerted so that
    this is put right. The letters to Amelang and Kopp I still have lying behind me, because the latter
    in particular is not yet back — but I doubt his help very much — I still lie wretchedly ill; grief
    and sorrow all but wear me away. The Invalids'' affair has given my health a great blow. It may be
    that the settling of it will contribute much to my recovery. — Still more, however, if I may see Your
    Serene Highness in person and so render account. There all shall soon be made [uncertain: soll] to
    him. In short, if Your Serene Highness can obtain money there, then I shall come thither, cede the
    mortgage of 250 Rthl, and both your sorrow and mine are at once wholly lifted. In deepest reverence
    I remain, until death, Your Most Serene Highness''s — I do not know whether I address my letters rightly;
    it always takes so long before I am graciously favoured with an answer to them. I have sent the estimates
    and other judicially certified documents — I have in three, this is the [uncertain: Mädte] letter
    — everything as it stands, and what can be done to Your Serene Highness''s advantage, depicted — but
    to all of these I have as yet had not the same answer.


    most faithful and obedient servant


    Breslau, the 18th of April


    1808.


    v. Triebenfeld'

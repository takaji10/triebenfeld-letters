- page: 1
  en: '34


    Most Serene Prince


    Most gracious Prince and Lord, Your Most Serene Highness''s most highly revered letter of the 7th
    inst. I receive this very moment with its enclosures, and reply thereto most obediently that Honrichs''s
    submission is boundless nonsense, which however has been answered by Your Serene Highness just as
    the fellow deserves. I had written 21 letters to the boy, partly by mounted and partly by foot messengers,
    but never did the man answer me — I was pressed here and there, had to have costs of every kind paid
    through Professor Rhoda, but from Honrichs I received neither money, nor statement, nor a single syllable
    of account — since Schmid was dead and all further enquiry would now be in vain, I resolved to appoint
    other men there, who were loyal and who taken together should cost less than Schanck alone — I did
    this all the more since the French authority was willing to intervene there in my favour and to have
    the arrears in part collected. For that, now, the accounts and judicially attested statements would
    be required, and to that end I engaged Hecker, who receives 600 rt. annually and some allowance in
    kind as Tietz receives, but otherwise not a further penny — how can such a fellow say that the man
    will cost 10/m rt annually — the [uncertain: Bösmacht] has cost her/them up to now, and now he is
    vexed that Hecker gets in his way. Hecker has already sent in something of the statements of the advances.
    Your Serene Highness''s decided letter will now surely take from Honrichs the courage to withhold
    the papers any longer, and once I have the statements I shall summon men here who will indeed have
    effect — from our own authorities one may by no means promise oneself any help; that looks sorry indeed
    — Be that as it may, that friend will shortly do something more for the [uncertain: Gmacher]; let
    Your Serene Highness take care only of this, that you there receive the money, as I have written in
    all my 6 letters. The first news of it will give me new strength to come to Gringen, and then much
    shall become clear to you.'

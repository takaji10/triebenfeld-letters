- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most highly esteemed letter of the 7th of this month I receive this very
    moment together with the enclosures, and reply thereupon most obediently that Honrich''s submission
    is a boundless absurdity, which however has been answered by Your Serene Highness precisely as the
    fellow deserves. I had written 21 letters to the rascal, partly by mounted and by foot messengers,
    but never did the man answer me — I was pressed here and there, had to have costs of every sort paid
    through Professor Rhoda, but from Honrich I received neither money, nor account, nor a single syllable
    of a reckoning — since Schmid was dead and all further enquiry would now be in vain, I resolved to
    appoint other men there, who were faithful and taken together were to cost less than Schanck alone
    — I did this all the more since the French authority there was willing to intervene in my favour and
    to have the arrears in part collected. For that, the accounts and the judicially attested statements
    would now be required. Something, and to that end I engaged Hochern at 600 Rthl yearly and some allowance
    in kind such as Tietz receives, but otherwise not a further heller — how can such a rascal say the
    man will cost 10000 yearly — the villain has cost that much up to now, and now he is vexed that Hester
    stands in his way. Heiter has already sent in something by way of statements of the advances. Your
    Serene Highness''s decided letter will now surely take from Honrich the courage to hold the papers
    back any longer, and once I have the statements I shall summon men here who will indeed take effect
    — from our authorities one may by no means speak of any help, that looks sad — Be it as it may, that
    friend will shortly do something more for the [uncertain: Gmacher], what cares Your Serene Highness
    only that you receive the money there, as I have written in all my 6 letters. The first news of it
    will give me new strength to come to [uncertain: Gringen], and then much shall be made clear to you.'

segments:
- page: 1
  en: 'Yesterday I had the honour of forwarding to Your Most Serene Highness the resolution which has
    only now been obtained from His Serene Highness the Prince State Chancellor, together with the order
    to the Brieg Superior Provincial Court, by an opportunity as far as Neisse and from there on by express
    courier, for this reason: that Your Serene Highness should be swiftly convinced of the happy turn
    of your affair, and at the same time be forewarned, so as to be active there in your concerns. I count
    now entirely upon the [uncertain: fairness] and discernment of the good Court Councillor Hahn; he
    must now in Brieg give the affair such a turn that the report of the Superior Provincial Court and
    Your Serene Highness''s declaration turn out in every respect conformable with my submissions. On
    this at present everything depends — deadly mockery and shame, or honour, fortune and peace of life.
    [text lost] be done, that 5 with Your Serene Highness were everywhere induced to accede to those shameful
    settlements, codicils etc. in your period of suffering, when you yourself were deprived of your liberty,


    2. that the sums stated in the settlement in favour of the older Princes are for the greater part
    fictitious, and are entered there in order to defraud the State and other creditors — that it is precisely
    for this reason, 3rdly, that the so-called Courland sum alone was undertaken to be paid, and your
    former consort ex neom, in spite of her signature, to be set down;


    4. that all these matters were forged solely by Cosmar and the Princes in Berlin, and were sent to
    you for accession under glittering promises or threats.


    5. that Cosmar so directed the matter that they wished to press you, most gracious Lord, out of the
    possession of the entailed estates and to put your son in their place, so that all creditors should
    be set back;


    6. that Cosmar, once this had succeeded with him, knew how to obtain a power of attorney from the
    son by stealth, and brought this weak person so far that he himself rose up against the father, curtailed
    him in every revenue, and had a distraint laid upon everything;


    7. that when you perceived your error, you wished to redress the matter and to come to terms with
    your creditors, or had agreed with them — but that Cosmar hindered this too, and then the proofs as
    they lie there, and as the good Hahn knows all this better than I do.


    The conclusion'

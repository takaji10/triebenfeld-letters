status: draft
segments:
- page: 1
  en: 'Yesterday I had the honour of transmitting to Your Most Serene Highness the Resolution obtained
    only from His Serene Highness the Prince State Chancellor, together with the order to the Brieg Superior
    Provincial Court, by an opportunity as far as Neisse and from there by express courier, for this reason:
    that Your Serene Highness should be quickly convinced of the fortunate turn of your affair, and at
    the same time be forewarned to be active there in your affairs. I count now [uncertain: sahr] upon
    the fairness and insight of the good Court Councillor Hahn, who must now in a letter give the matter
    such a turn that the report of the Superior Provincial Court and Your Serene Highness''s declaration
    come out everywhere in conformity with my submissions. On this everything now depends — killing mockery
    and shame, or honour, fortune and peace of life. [text lost] be shown, that 5 with Your Serene Highness
    were everywhere induced to accede to those shameful settlements, codicils etc. in your period of suffering,
    when you were yourself deprived of your liberty; 2. that the sums stated in the settlement in favour
    of the elder Princes are for the greatest part fictitious, and are entered there in order to defraud
    the State and other creditors — that for this very reason 3rdly [they undertook] to pay the so-called
    Curian sum alone, and to set your former consort ex neom, in spite of her signature; 4. that all these
    matters were forged solely by Cosmar and the Princes in Berlin, and sent to you for accession under
    glittering promises or threats; 5. that Cosmar so conducted the matter that they wished to push you,
    gracious Lord, out of possession of the entailed estates and to put your son in their place, so that
    all creditors should be set back; 6. that Cosmar, once this had succeeded with him, contrived to obtain
    a power of attorney from the son by stealth, and brought this weak man to the point of himself rebelling
    against his father, curtailing him of every revenue and having arrest laid upon everything; 7. that
    when you perceived your error, you wished to address the matter and to come to terms with your creditors,
    or had agreed with them — but that Cosmar hindered this too; and then the proofs, as they lie there,
    and as the good Hahn knows all this better than I. The conclusion'
- page: 2
  en: 'must go to this, that the settlements and the codicil, which conflict with the Senate instrument
    of 1799, be immediately annulled; that the estates be left to them to manage as soon as possible;
    that they be permitted to come to terms with the creditors, or that the association already concluded
    may stand — and finally that, for the discharge of the principal debt, a capital of 112000 was only
    advanced, against which, according to the Triebenfeld plans, is to be discharged within the stated
    period etc. etc. Finally, let the good Hahn box Cosmar on every ground, on account of his omission
    of the rendering of accounts, on account of his [uncertain: instanien] administrations. You have,
    most gracious Prince, truth and the greatest right on your side; only make no compliments and spare
    nobody. Your son has not dealt honestly with you. Out of stupid [uncertain: Gritz] he has entered
    into a plot with your mortal enemies against you. It is an exceeding grace if the possessions in [uncertain:
    Mich] are left to him, all the more since much good may be hoped for there, of which, however, I unfortunately
    [have] a profiting [uncertain: Bau], because I have very much attacked the Württemberg Majesty — I
    may never with Gärtner set foot on Württemberg soil — it is a good fortune that we may not make too
    great [uncertain: bewegen]. For the rest, yesterday, in the highest fury, when I received the letter
    from my daughter, I took no Copy of the Prince Hard[enberg] Resolution before the same was delivered
    to me at the very moment. It is now advised that I should remain here so long, until the matter comes
    back from Brieg — also until things are clear regarding Poland — Let Your Serene Highness command
    that a Copy be sent here to me by the first post. Also send me a piece of 4 blank forms, so that I
    may give some letters of thanks to deserving persons. To the noble Prince Hardenberg write for the
    [uncertain: eeligsten] yourself and thank him meanwhile [uncertain: Toni] whereby to commend to him
    the further course of your affair — deign to send me this very soon [illegible], so that it may be
    delivered and everything further attended to. With the most perfect esteem I persist, [as] Your Serene
    Highness''s

    Vienna, the 10th of December 1814.

    wholly obedient servant

    v Triebenfeld'
- page: 3
  en: '260a) One thousand — this I have already [uncertain: udirt] to the most active friend. A speaking
    proof that people wish, and will, help in the Princely House. Minister Humboldt too helps in both
    [uncertain: Sachezlichen] [uncertain: Schide]. Your Serene Highness, [send] indeed in haste the 300
    Rthl, but converted into Gold. What I took with me is nearly all gone; the expenses are found to be
    far more than I [uncertain: was] reported. The vidimation of several papers, the drawing up of the
    cession, costs with the stamp duty over 190 fr, and so many a thing turns up. My whole remaining stock
    today is 118 f. What am I then to begin with, at this increased dearness here? — the friends indeed
    whom I had here, and who in case of need would have helped at all events, have died since 1807. I
    can take my refuge with nobody; [text lost] I cannot let go the matter I have begun, which now stands
    very well — So provide, Your Serene Highness, counsel; otherwise I should be here boundlessly but'

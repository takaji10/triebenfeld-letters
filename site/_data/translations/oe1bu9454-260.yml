- page: 3
  en: '260a) One thousand [uncertain: of that] I have already ceded to the most active friend — A speaking
    proof that in the Princely Hohenlohe house they wish, and will, help. Minister Wilhelm von Humboldt
    is helping too in both matters — Your Serene Highness, do send the 300 Rthl in haste, but converted
    into Gold; what I brought with me is nearly all gone — the expenses turn out far greater than I reported
    beforehand — The certifying of several papers and the official copy of the cession cost, on account
    of the stamp, over 190 fl, and so much of the kind turns up. My whole stock today is 118 fl. What
    am I to begin with that, amid this enormous dearness here — two friends whom I had here, and who in
    case of need would at all events have helped me, have died since 1807. I can take my refuge with nobody;
    lie idle I cannot, nor can I let go the matter begun, which now stands very well. Provide, therefore,
    Your Serene Highness''s counsel, for otherwise I should be boundlessly wretched here —'

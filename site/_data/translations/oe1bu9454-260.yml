- page: 2
  en: 'must go to this, that the settlements and the codicil, which are at variance with the Senate instrument
    of 1799, be immediately annulled; that the estates be left to them to manage as soon as may be; that
    they be permitted to come to terms with the creditors, or that the association already concluded may
    stand — for finally, that for the extinguishing of the principal debt a capital of 112000 only was
    advanced, [uncertain: against] which, according to the Triebenfeld plans, it is to be extinguished
    within the said time etc. etc.


    Finally, let the good Hahn [have] the whole ground against Cosmar, on account of his omitted rendering
    of accounts, on account of his [uncertain: instanien] administrations — box them. You have, most gracious
    Prince, truth and the greatest right on your side; only make no compliments and spare nobody. Your
    son has not dealt honestly with you. Out of stupid [uncertain: Gritz] he has entered into a plot with
    your mortal enemies against you. It is an exceeding grace that he is left the possessions in [illegible],
    the more so as much good is to be hoped for there, from which, however, I unhappily [have] a profiting
    [illegible], because I have also greatly offended the Württemberg Majesty — I may never with Gärtner
    set foot on Württemberg soil — it is a good fortune that we are not permitted to make too great stirrings.


    For the rest, yesterday, in the highest fury, when I received the letter from my daughter, I took
    no copy of the Prince Hard[enberg] resolution, [uncertain: since] it was delivered to me at that very
    moment. It is now advised that I should remain here so long until the matter comes back from Brieg
    — and also until things are clear with regard to Poland — Your Serene Highness will therefore order
    that a copy be sent here by the first post. Also send me a set of 4 blank forms, so that I may give
    some letters of thanks to deserving persons. To the noble Prince Hardenberg write for the [uncertain:
    most blessed] yourself and thank him meanwhile [uncertain: Toni], wherein commend to him the further
    course of your affair — this be pleased to send me very [uncertain: soon], so that it may be handed
    over and everything further attended to. With the most perfect respect I remain


    Your Serene Highness''s


    Vienna, the 10th of December


    1814.


    entirely obedient servant


    v. Triebenfeld'

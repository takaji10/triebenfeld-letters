- page: 3
  en: '260a) One thousand — this I have already [uncertain: applied] to the most active friend. A speaking
    proof that there is a will to help in the princely house of Hohenlohe, and that it will be done. Minister
    Humboldt also helps in both matters [uncertain: Schide]. Your Serene Highness, do send in haste the
    300 Rthl, but converted into Gold; what I brought with me is nearly all gone, the expenses turn out
    far greater than I reported. The attestation of several papers, the drawing up of the cession, costs
    with the stamp on account of over 190 fr, and so one thing and another turns up. My whole stock today
    is 118 f. What am I then to begin with, in the present dearness here? — indeed the friends I had here,
    and who would at need have helped in any case, have died since 1807. Nor can I take my refuge to anyone;
    yet I cannot let go the business begun, which now stands very well — therefore let Your Serene Highness
    provide counsel; otherwise I should be here boundlessly'

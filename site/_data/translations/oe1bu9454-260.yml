- page: 2
  en: 'must go to this, that the settlement and codicil, which conflict with the [illegible] deed of 1799,
    be forthwith annulled; that the estates be left to you to farm as soon as may be; that you be permitted
    to come to terms with the creditors, or that the association already concluded may stand — for finally,
    that for the discharge of the principal debt a capital of 112/m Rthl might be advanced to you — which,
    according to the Triebenfeld plan, is to be discharged within the named period, and so on and so forth
    — Lastly, let the good Hahn [have] Cosmar thoroughly at the root, on account of his omitted rendering
    of accounts, on account of his infamous administrations, sheets — You have, most gracious Prince,
    truth and the greatest right on your side — only make no compliments and spare nobody either. Your
    son has not dealt honestly with you. Out of stupid avarice he has entered into a plot with your mortal
    enemies against you. It is exceeding grace if you charge the possessions to me, the more so as much
    good may be hoped for there — of which, however, I can now unhappily profit, because I have attacked
    the Württemberg Majesty very severely — I may never with Gärtner set foot on Württemberg soil — It
    is a piece of luck that we need not make too great detours — For the rest, yesterday, in the highest
    rage, when I received the letter from my daughter, I took no copy of the resolution of Prince Hardenberg,
    inasmuch as the same was delivered to me in all that moment. It is now advised that I should remain
    here so long, until the matter comes back from Brzeg — and also until there is clarity concerning
    Poland — Your Serene Highness will therefore command that a copy be sent to me here by the first post
    — Also send me a piece, 4 blank sheets, along with it, so that I may give some letters of thanks to
    deserving persons — To the noble Prince Hardenberg write [uncertain: in your own hand] yourself and
    thank him in the most touching tone, in doing which you commend to him the further course of your
    affair — be pleased to send this here soon, so that it may be handed over and everything further attended
    to — With the most perfect respect I persist,


    Your Serene Highness''s


    Vienna, the 10th of December


    1814.


    most obedient servant


    v Triebenfeld'

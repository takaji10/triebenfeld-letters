- page: 1
  en: '260


    To Your Most Serene Highness I had yesterday the honour of forwarding the resolution which has only
    now been obtained from His Serene Highness the Prince State Chancellor, together with the order to
    the Brzeg Higher Provincial Court, by an opportunity as far as Nysa and from there by express courier,
    and this for the reason that Your Serene Highness should be quickly convinced of the fortunate turn
    of your affair, and at the same time be forewarned to be active there in your concerns. I now count
    very much upon the [uncertain: community] and discernment of the good Court Councillor Hahn; he must
    now, at Brzeg, give the matter such a turn that the report of the Higher Provincial Court and Your
    Serene Highness''s declaration come out throughout in conformity with my submissions. On this everything
    now depends — deadly mockery and shame, or honour, fortune and peace of life. [text lost] be set forth
    — that firstly Your Serene Highness was throughout induced into the accession to that shameful settlement,
    codicil etc. during your period of suffering, when you were yourself deprived of your liberty — secondly
    that the sums stated in the settlement in favour of the old Prince are for the greater part fictitious,
    and are entered for the purpose of defrauding the State and other creditors — that for this very reason,
    thirdly, [it was] undertaken to pay the so-called Courland sum alone, and to place your former consort
    out of the legal bond, notwithstanding her signature


    4. that all these things were forged by Cosmar and the Prince in Berlin alone, and were sent to you
    for accession under glittering promises or threats.


    5. that Cosmar so directed the matter that they meant to press you, most gracious Lord, out of the
    possession of the entailed estates and to put your son in their place, so that all creditors might
    be set back —


    6. that Cosmar, when this had succeeded for him, knew how to obtain a power of attorney from the son
    by stealth and brought this weak person to the point of rising up against his own father, of cutting
    off every revenue from him and having an attachment laid upon everything


    7. that when you perceived your error, you wished, or had agreed, to redirect the matter and to come
    to terms with your creditors — but that Cosmar hindered this too — and then the proofs as they lie
    there, and as the good Hahn knows all this better than I do — The conclusion'

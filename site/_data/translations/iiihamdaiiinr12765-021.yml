- page: 1
  en: 'Berlin, 29 June 1816.


    To the Right Honourable widowed Mrs von Brehmer, Colonel''s widow.


    At Sommerfeldt, concerning: the compensation of the Prince of Hohenlohe-Ingelfingen. Hg. 3 July, fair
    copy made.


    On the 6th of July both to the post, No. 3997.


    The representation addressed by Your Right Honourable to the State Chancellor, the Prince of Hardenberg,
    under date of the 26th of April of this year, has been forwarded to me for further action. If [uncertain:
    Ewohnfrau] therein declares the intention of seeking satisfaction, out of the remaining property of
    the Prince, her debtor, in respect of the capital of 5000 Rthl inherited from her deceased brother,
    which he had lent to the Prince of Hohenlohe-Ingelfingen and which was registered upon the latter''s
    estate of Szetlewek, confiscated in the year 1807; then it will first of all be your affair to sue
    him before his own court of jurisdiction, in order to establish the claim at law, in case you, should
    His Majesty the Emperor of Russia be pleased to declare himself inclined to grant the Prince of Hohenlohe
    some compensation for the loss of Szetlewek and Trąbczyn, without consideration here, [text lost]
    desire thereby.


    Berlin, 22 June 1816.'

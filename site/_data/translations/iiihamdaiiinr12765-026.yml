- page: 1
  en: 'Berlin, 22 December 1816. To His Serene Highness the Prince of Hohenlohe.


    at Sławięcice, the 24th of this month, enclosed: dispatch note No. 9882. B.


    In having the honour most humbly to communicate to His Serene Highness, in the enclosure, a copy of
    the note with which the Imperial Russian ministry has answered the intercession entered by the Royal
    legation at Petersburg on account of the compensation at that time sought by Your [Serene Highness]
    for the estates of Kamionna and Trąbczyn taken from you, I can only express my regret that, notwithstanding
    the legation''s efforts, it has not been possible to bring about a favourable result.


    Ministry of Foreign Affairs, 3rd Section.


    H[arden]b[er]g 21/12 B[alan].'

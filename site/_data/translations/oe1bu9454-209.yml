segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The order to pay has come in; I shall collect
    the money and set out at once. From Zagorowo I shall report everything to Your Serene Highness immediately
    by a mounted messenger, who is to bring Mr. von Knobelsdorff thither. The post is about to go; I must
    close. In deepest reverence there remains Your Most Serene Highness''s most humble and obedient servant,
    v. Triebenfeld


    Breslau


    16th October


    1810.'

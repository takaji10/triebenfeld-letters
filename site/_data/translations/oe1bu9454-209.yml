status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The instruction has come in; I shall draw the
    money and set out at once. From Zagorowo I shall report everything to Your Serene Highness immediately
    by a mounted messenger, who is to bring Herr v. Knobelsdorff there. The post is about to leave, [uncertain:
    I must] close. In deepest reverence there remain Your Most Serene Highness''s most humble and obedient
    servant v Triebenfeld. Breslau, 16th 8br. 1810.'

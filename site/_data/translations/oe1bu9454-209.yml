segments:
- page: 1
  en: '209 Most Serene Prince, most gracious Prince and Lord. The order to pay has come in; I shall draw
    the money and depart at once. From Zagórów I shall report everything to Your Serene Highness immediately
    by a mounted messenger, who is to bring Mr von Knobelsdorff there. The post is about to go out, I
    must close. In deepest reverence remaining Your Most Serene Highness''s Wrocław


    16th October


    1810.


    most humble and obedient servant v Triebenfeld'

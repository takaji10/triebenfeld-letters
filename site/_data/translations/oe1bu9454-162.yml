  en: '162


    Most Serene Prince,


    Most gracious Lord!


    An order of the General Finance Department, issued a fortnight ago to all the Chambers here, hinders
    the course of my business extraordinarily, and it may be long before I reach my goal with the revision
    of the valuations, if indeed it is permitted at all. The cause of these new difficulties is Prince
    George together with the councillor of war Korn here. The former, some time ago, petitioned the Kalisz
    Chamber for Korn as reviser of his valuations of the estates situated in this, the Poznań, and other
    departments; and the Chamber granted this. But since, unhappily, the judicial valuations which were
    to be revised had been drawn up by Korn himself, and were contested in the [uncertain: Abord], this
    had to be laid before the head of the Department; and, indignant at this swindling — that a member
    of the Chamber should revise the valuations which he himself had made, and against which so many objections
    are raised, and make the Chamber answerable for them — the Minister issued the order that'

- page: 2
  en: 'that no Chamber should any longer be permitted, without the foreknowledge of the General Finance
    Department, to order revisions of a judicial valuation, whereby the revision of Prince George''s affairs
    would at once be forbidden for ever.


    The President von Goldbeck has meanwhile written at once to the said Department and sought permission.
    I have sent this by express courier to Berlin, and at the same time have begged Amelang and Langen
    to help obtain the permission and to see to it that the same be sent here with all speed. It now remains
    to be seen whether the malicious Voss will concede the revision.


    In the meantime I must lie here at anchor and await the answer. Meanwhile I shall submit the plans
    of dismemberment for approbation, and smooth everything in this matter. Mr. von Goldbeck was at first
    very lukewarm; at the last he reproached me that I had not helped him to the two [uncertain: Strahlitz],
    which Dolfs afterwards obtained, and which the Minister had so firmly promised him. To furnish proof
    that I had done everything for him was not difficult for me'

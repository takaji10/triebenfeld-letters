- page: 3
  en: 'and we were reconciled again. He wishes very much to have, as soon as possible, three bronzed busts,
    which he means to set upon his bookcase. Likewise he has asked me to procure him a washstand as soon
    as may be, so as to be able to wash his ailing lower abdomen daily. May Your Serene Highness have
    the grace to let three busts of that kind, and a washstand also, be bought, and send me these hither
    by the first post. The washstand is to be had in the joiners'' warehouses.


    I should dearly like to surprise the good man with it quite promptly. The Oleśnica matter has, through
    the friendly mediation of Mr von Hussarzewski, been sent back to the patrimonial court for decision;
    this is for us a great satisfaction — I shall now bring about the swiftest prosecution of the matter,
    and in the interim calm Lichnowski, so as to be able to dismember at leisure. Heaven grant only that
    I obtain the permission for the revision of the valuations as soon as possible; the cursed swindles
    of Prince George have already caused much terror, and will yet arouse much misfortune and mistrust.
    He is a frightful man indeed — I cannot praise God enough that I am parted from the man. In deepest
    reverence I remain, until death,


    Your Most Serene Highness''s — If only I might soon receive the 3 [uncertain: bronzed] busts and the
    washstand, it would give much joy. Kalisz, the 24th of February 1805.


    faithful, humble and obedient servant


    v Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    An order issued a fortnight ago by the General Finance Department to all the Chambers here hinders
    the course of my business extraordinarily, and it may be long before I come to the end of the revision
    of the valuations, if indeed such is still permitt


    ed at all. The cause of these new difficulties


    is Prince George together with the local councillor of war Korn. The former, some time ago, applied
    to the Chamber of Kalisz for Korn as reviser of his valuations of the estates situated in this, the
    Posen, and other departments; the Chamber had also granted this. But since, unluckily, the judicial
    valuations which were to be revised had been drawn up by Korn himself, and were contested in the [uncertain:
    dispatch], the matter had to be laid before the head of the Department; incensed at these swindles,
    that a member of the Chamber should revise the valuations which he himself had made, and against which
    so many objections are raised, and make the Chamber answerable, the Minister issued the order that'

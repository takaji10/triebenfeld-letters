- page: 2
  en: 'that no Chamber should any longer be permitted, without the prior knowledge of the General Finance
    Department, to order the revision of a judicial valuation; whereby the revision of Prince George''s
    affairs was at once forbidden for ever. His Excellency the President von Goldbeck has, however, written
    at once to the Department and sought permission. I have sent this to Berlin by express courier, and
    at the same time have asked Amelang and Langens[illegible] to help procure the permission and to see
    to it that the same be dispatched here with all speed. It now remains to be seen whether the spiteful
    Voss will concede the revision.


    Meanwhile I must lie here at anchor and await the answer. In the interim I shall submit the dismemberment
    plans for approbation, and level everything in this matter. Mr von Goldbeck was at first very [uncertain:
    Bau], and at the last he reproached me that I had not helped him to the Starostey Strehlitz, which
    afterwards Dolfs obtained, and which the Minister had promised him so firmly. The proof that I had
    done everything for him was not difficult for me to furnish,'

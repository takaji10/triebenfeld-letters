- page: 3
  en: 'and we came to agreement again. He wishes very much to have, as soon as possible, three [uncertain:
    bronzed] busts, which he means to set upon his bookcase. Likewise he has begged me to procure him,
    as soon as possible, a washbasin, so as to be able to wash his ailing abdomen daily. May Your Serene
    Highness have the grace to let three busts of that kind, and likewise a washbasin, be bought, and
    send me these here by the first post. The washbasin is to be had in the joiners'' warehouses.


    I should dearly like to surprise the good man with them quite promptly. The affair of Olesnica has,
    through the friendly mediation of Mr. von Husslarzewski, been sent back to the patrimonial court for
    decision; this is for us a great satisfaction. — I shall now procure the speediest prosecution of
    the matter, and meanwhile quiet Lichnowski, so that — Heaven only grant


    that I may be able to dismember at leisure, that I may obtain the permission for the revision of the
    valuations as soon as possible. The accursed swindles of Prince George have already caused much terror,
    and will yet stir up much misfortune and mistrust. He is truly a dreadful man — I cannot praise God
    enough that I am parted from that man. In deepest reverence I remain, until death,


    Your Most Serene Highness''s — If only I might soon receive the 3 [uncertain: bronzed] busts and the
    washbasin, it would give much joy. Kalisz, the 24th of February 1805.


    faithful, humble and obedient servant v Triebenfeld'

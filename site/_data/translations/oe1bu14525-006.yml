- page: 1
  en: 'We Friedrich Willhelm, by the Grace of God King of Prussia etc., do hereby, and by force of this
    Our open letter, for Ourselves and Our descendants and successors to the Crown, the Electorate, and
    Our remaining lands, witness and declare that We, out of the particular friendship and affection We
    bear towards the high-born Prince, Our amicably beloved uncle Friedrich Ludewig, reigning Prince of
    Hohenlohe-Ingelfingen, and likewise in order to give him a fresh proof of Our royal gratitude for
    the distinguished and fruitful services rendered to Us and to Our Royal House, have found Ourselves
    moved to grant, confer and convey to Your Lordship, in addition to the estates already conferred upon
    him by the instrument of the 19th of June, namely Pszczew, Zagórów and Wieniec, the appurtenant parcels
    belonging thereto, namely:


    1.) at Pszczew, the villages of Stołuń(7), Kuligowo(8), Szarcz(9), the bailiwick of Zielomyśl(10),
    and Silna, and among the Hollander settlements the Pomherr Hollander settlement(12) and Heydemühle.


    2.) at Zagórów, the little village of Swięcia, and finally


    3.) near Wieniec, Konty, Szedlemin, Botkow, and Karezin[uncertain: Karezin], against payment of


    1.) the sovereign dues hitherto discharged by the said villages, Hollander settlements and landholdings,
    as a fixed'

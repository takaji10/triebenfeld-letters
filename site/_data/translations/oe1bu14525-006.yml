- page: 2
  en: 'and unalterable canon, and


    2.) of the allowance due therefrom to the ecclesiastical corporations and foundations, to cede the
    same to him heritably and in full property, to confer and to convey it.


    We do so likewise hereby, and by force of this present, out of royal power and plenitude, for Ourselves
    and Our descendants and successors to the Crown, the Electorate and Our remaining lands, in such manner
    and so that Our above-mentioned amicably beloved uncle, the reigning Prince of Hohenlohe-Ingelfingen,
    shall irrevocably have, possess and enjoy the above-named appurtenant parcels belonging to the estates
    of Pszczew, Zagórów and Wieniec, with all rights and privileges attaching thereto, as such have been
    exercised up to this time or may lawfully be exercised, with all the lands belonging thereto in fields,
    woodlands and meadows, likewise in ponds and waters, according to the measure of the lawful boundaries
    and bounds, just as everything has hitherto been used or may of right be used, from now on for all
    time, for himself and his descendants and heirs, as a true, well-acquired and unrestricted property
    from Us and Our descendants and successors; and that to him there shall also be'

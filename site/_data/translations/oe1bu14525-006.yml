- page: 3
  en: 'annexed the power and authority to dispose thereof at pleasure, subject to the conditions mentioned
    above, unhindered by any man.


    We accordingly command and enjoin all Our supreme provincial collegiate boards, as also all authorities
    whom this concerns, herewith as graciously as earnestly, that they in no way hinder or disturb either
    the Lordship of the oft-mentioned Prince of Hohenlohe-Ingelfingen in the heritable and proprietary
    possession thus conferred upon him of the above-named appurtenant parcels belonging to the estates
    of Pszczew, Zagórów and Wieniec, nor him or those to whom he may one day bequeath the same by force
    of this Our letter of conferment, or otherwise lawfully transfer it by other acts inter vivos aut
    mortis causa; but rather that they let His Lordship, and eventually also them, enjoy the same freely
    and quietly, do nothing themselves against it, nor occasion or permit that such be done by others,
    on pain of Our most supreme displeasure and unfailing severe punishment. In witness whereof etc.


    Berlin, the 1st of December 1797.


    Friedrich Willhelm


    Letter of conferment for the reigning Prince of Hohenlohe-Ingelfingen, to the heritable and proprietary
    possession of the appurtenant parcels belonging to the estates of Pszczew, Zagórów and Wieniec.


    (L. S.)



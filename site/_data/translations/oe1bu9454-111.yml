- page: 1
  en: 'Most Serene Prince


    Most gracious Lord, I have not been able to raise the money for the redemption of the deed, for Wildegansch
    is ruining all my credit here. Three hundred [uncertain: Rück] I have given to the friend who arranged
    the matter, as earnest-money — more than that I cannot spare out of my travelling money, otherwise
    I shall be left stranded here. If it be possible to Your Most Serene Highness, may the same most graciously
    deign only to send an order to pay upon the 240 f., that is for 200 Rthl Courant, so that I may redeem
    the deed. Otherwise an evil turn might come to pass. — The gentlemen Col. v. K. and v. Z. are assuredly
    Your Serene Highness''s true friends, and I am likewise assured that all will turn out very well.
    Only the gossip here is now so bad that for the present I merely keep groaning at a distance, as it
    were, and in particular, for one person''s sake, I shall hold myself in the background and act as
    coldly as possible. In deepest submission I remain, until death,


    Your Most Serene Highness''s


    Berlin, 10 February 1801.


    most faithful servant


    v. Triebenfeld'

- page: 1
  en: '111


    Most Serene Prince,


    Most gracious Lord!


    I have not been able to raise the money for the redemption of the document, for Wildegansct is ruining
    all my credit here — Three hundred Rtrl I have given to the friend who arranged the matter, as a deposit
    — more than that I cannot spare out of my travelling money, or else I shall be left sitting here.
    If it be possible for Your Most Serene Highness, may the same be pleased only to send an instruction
    to pay upon the 240 Friedrich d''or for 200 Rthl Courant, so that I may redeem the document. Otherwise
    an ugly turn might come to pass — Colonels von K[öckritz] and von Z[astrow] are assuredly Your Serene
    Highness''s true friends, and I am likewise sure that all will turn out very well. Meanwhile the gossip
    here is now so bad that for the present I only ever keep at a distance, and for one person''s sake
    in particular I shall hold myself in the background and act as coldly as possible. In deepest reverence
    I remain, until death,


    Your Most Serene Highness''s


    Berlin, 10 February 1801.


    most faithful servant


    v Triebenfeld'

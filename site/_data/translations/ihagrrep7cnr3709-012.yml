status: draft
segments:
- page: 1
  en: 'In reply to the most gracious rescript of the 7th, received the 16th of this month, in the case
    of the guardian of Michalina von Prusimska against the Prince of Hohenlohe-Ingelfingen, we do not
    fail hereby most humbly to report that judgment has already been given in this case in the first instance,
    on the 9th of this month, since the most exalted cabinet order of 1 July of this year, of which we
    sent a copy to Your Royal Majesty''s court with our report of the 10th of the same month, especially
    enjoined on us the hastening of this case. Should a legal remedy be lodged against the judgment drawn
    up by us, we shall not fail dutifully to comply with the high instruction cited, and, once the preparation
    of the case is complete, to send the files to the Superior Appeal Senate of the Kammergericht for
    judgment in the second instance.


    Poznań, 18 Dec. 1800.


    The Government


    Dühring


    Hering


    v. Götz Fromme


    Diederichs


    Dannenberg


    Bormann


    Schwarz


    Hoening


    Leuchert


    Richter


    [Written by the receiving office:]


    Let the Government at Warsaw be notified that, since judgment has already been given in this case
    in the first instance, the rescript of 7 Dec. of this year has no application. Berlin, 31 Dec. 1800
    G[oldbeck]


    No. 6,334.'

- page: 1
  en: 'Most Serene Prince


    Most gracious Lord. Over the misfortune that has befallen me here, or rather over the arrest on account
    of the outstanding interest, I have vexed myself to such a degree that I contracted an inflammation
    of the abdomen and cramps; through the efforts of an honest physician I have indeed been placed out
    of danger, but I should also have had to keep to my room and bed for a couple [uncertain: of weeks]
    had I been entirely [text lost]. The grief over all these adverse events wears me down still; from
    my estates I have or receive not a Groschen, from the State and the King I draw nothing, from no man
    do I take anything — on what am I to live? I have given up everything so as not to become the mockery
    of men — I was sent hither and was to go from here to Vienna, but instead I had to suffer this disgrace,
    and my career, just then embarked upon, was undone. Now I sit here and heap debt upon debt, for I
    cannot get away — I therefore repeat the entreaty that the former order to pay on the 6000 Rthl be
    sent back to me with all possible speed, so that I may help myself thereby, inasmuch as I shall get
    back the mortgage of 10000 Rthl that was given in pledge.


    As to the further proof demanded by Your Serene Highness, the same follows herewith together with
    the mortgage certificate. I was on the point of obtaining the money from Holland; but if Your Serene
    Highness can obtain it there, so much the better for me. If they give you the full 250000 Rthl, then
    I need only cede the mortgage, and you will retain 102000 for yourself, and likewise the outstanding
    arrears, which (should the times change) can be swiftly recovered. For the rest, there will now be
    a sorry confusion upon the estates there, and I shall again have much vexation.


    I had engaged the judicial commissary Mitschke at Kalisz, that he should act as justiciary on the
    estates and at the same time attend to the conduct of all suits. For this I had promised him 300 Rthl
    salary and, when he travelled, 1 Rthl [uncertain: per day of service].'

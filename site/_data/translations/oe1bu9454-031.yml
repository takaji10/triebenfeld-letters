- page: 3
  en: 'In this way alone does Your Serene Highness''s disposition stand unimpaired, and I too am not compromised,
    and much is saved besides. With regard to the loan I must once again beg most earnestly that news
    be given me as speedily as is possible, so that I do not fall into embarrassment. Your Serene Highness''s
    letter is of 23 March and I received it on the 3rd of April, thus eleven days on the road; wherefore
    I repeat once more that nothing more is needed than the cession of the mortgage, and that it is very
    easy to deal in this matter. The returns then come out as I have described them, indeed rather higher
    still — Of what Your Serene Highness writes me concerning various lawsuits I know not a word — All
    this, apart from the Przespolewski matters, must be new business, of which the knavish Honrichs has
    not written a word either; I shall write what is needful in that regard at once by tomorrow''s post
    — for at bottom, as I see it, it is all invented and fabricated, rascally claims. Otocki and Exstädt
    have nothing to claim, the matters were settled long since. Ignac v. Radzinski is a hereditary leaseholder
    and is still much in arrears on Szetlewek; as to the 6000 Rthl. of damages on account of the lease
    not received, the [uncertain: honourable gentleman] was already dismissed upon it, and the 1500 Rthl
    have surely been credited to the knave in the hereditary lease.


    The provost Iwanski had likewise lost the lawsuit and was dismissed; also, had he obtained, this would
    have had to be paid by the German community at Swięcia. The Przespolewski matter belongs purely to
    Trąbczyn and to the Prusimski heirs — Meanwhile, at that time the receipt was found showing that the
    fellow had long since been paid by Prusimski. Your Serene Highness will pardon my somewhat confused
    writing; I am so weak that I have had trouble in bringing it about.


    In [uncertain: deepest] respect I remain, until death,


    Your Serene Highness''s


    of Swięcia I have no mortgage


    certificate — as it seems to me, Glenck has had Haucht and consorts entered upon it, in which case
    the mass of debts would


    Berlin, the 3rd of April


    1808.


    your most faithful and obedient


    v Triebenfeld'

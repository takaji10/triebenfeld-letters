status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord, Over the misfortune that has befallen me here, or rather
    over the arrest on account of the arrears of interest, I have vexed myself to such a degree that I
    contracted an inflammation of the abdomen and cramps; through the efforts of an honest physician I
    have indeed been put out of danger, but I should also have had to keep to my room and bed for a pair
    of [uncertain: weeks/true] as I was wholly [text incomplete]. The grief over all these adverse events
    wears me out still; from my estates I have or receive not a Groschen; from the State and the King
    I draw nothing; from no man do I take anything — on what am I to live? I have given everything away
    so as not to become the mockery of men — I was sent hither and was to go from here to Vienna, but
    instead I had to live through this disgrace, and my career, only just entered upon, was undone. Now
    I sit here and heap debts upon debts, for I cannot get away — I therefore repeat the request, only
    to send back the former instruction for the 6000 Rthl with all possible speed, so that I may help
    myself thereby, inasmuch as I shall recover the pledged mortgage of 10000 Rthl. As to the further
    proof demanded by Your Serene Highness, the same follows herewith together with the mortgage certificate.
    I was on the point of obtaining the money out of Holland; but if Your Serene Highness can obtain it
    there, so much the better for me; if they give You the full 250000 Rthl, then I need only cede the
    mortgage, and then You retain 102000 for Yourself, and also the outstanding arrears, which (when the
    times change) can quickly be brought in. For the rest, there will now be a wicked confusion upon the
    estates there, and I shall again have much vexation. I had engaged the Justice Commissioner Mitschke
    in Kalisz, that he should act as Justitiarius in the estates and at the same time attend to the conduct
    of all the lawsuits. For this I had promised him 300 Rthl salary and, when he travelled, 1 Rthl per
    diem.'
- page: 2
  en: 'Your Serene Highness has now, however, appointed a certain Hawich from Peisern as Justitiarius,
    without my having known a word of it; You have also sent Heinrichs a general power of attorney — how
    is that now to be [uncertain: rectified]? Heinrichs and Niedrierechi hold together; the result is
    that the fellows will now cheat Your Serene Highness in common, particularly since the one of them
    is authorised to do so. For two years the [uncertain: bösereichte] have not rendered up a heller,
    but have already pocketed everything; I had therefore taken on a [uncertain: Cassus] and just now
    sent him thither with extended powers of attorney. Today I receive from this man — he is the son of
    the Privy Upper Consistorial Councillor Hecker here — the news that His Serene Highness''s general
    plenipotentiary, Herr Heinrichs Doct., will not tolerate him. What am I now to do with this man and
    with the [uncertain: Mitstelle]? Heinrichs has at once taken a lease from the Poles; he is a knave
    — I took him on at that time provisionally, in order to get the notorious Witowes affair out of the
    world; but never was I minded to grant him an authority in which he could do harm. Hecker furnishes
    a security of 4 to 5 [uncertain: thousand] in treasury notes; with that one could, although they are
    worth only half their value, nevertheless cover something — the matter has been settled here judicially
    — what am I now to begin? My advice is that Your Serene Highness write to Haberich that he is to apply
    to me in everything, and likewise to Heinrichs, and demand back from the latter the general power
    of attorney at once, with the remark that such a thing is of no use to him since he is no man of the
    law, but that You require men versed in justice; he could remain in the capacity in which Triebenfeld
    had appointed him. I then determine that Habeschal''s justice [uncertain: Contenz] receives 200 Rthl,
    fees remain; Mitschke as General Advocate receives, instead of Trumm, 300 Rthl 5. [uncertain: A Serene
    Highness] Haller as Chief Inspector 600 Rthl; Cabanis as Chief Forester and [uncertain: the said]
    300; Heinrichs as the said Commissioner without influence 400. Su[uncertain: m] 1800. d. Sansta[illegible]
    Schenk 800 Rthl had some [uncertain: Husten] land horses God knows what 400; the fraud Gr[uncertain:
    a]mm 300; Tietz 300; Cabanis 300; Heinrichs 400; fees which Schenckk [uncertain: drew] amounted to
    1200 Rthl; sum 3.700 Rthl; there is thus saved as against formerly 1900 Rthl'
- page: 3
  en: 'In this way alone does Your Serene Highness''s disposition remain undamaged and standing, and I
    am also not compromised, and much will also be saved. With regard to the loan I must once again beg
    most earnestly that news be given me as speedily as is possible, so that I do not come into embarrassment.
    Your Serene Highness''s letter is of the 23 March and I received it on the 3rd of April, so it was
    11 days on the road; therefore I repeat once more that nothing is needed but the cession of the mortgage,
    and that it is very easy to deal in this matter. The rents then turn out as I have described them,
    or even higher — What Your Serene Highness writes to me concerning various lawsuits, of that I know
    not a word — All this must, apart from the Przespolewski matters, be new business, of which the knavish
    Heinrichs has not written a word either; I shall write what is necessary in this regard at once by
    tomorrow''s post — for at bottom, as I see it, all is invented and fabricated rascally demand. Otocki
    and Exstädt have nothing to demand; the matters were settled long ago. Ignac v. Radzinski is hereditary
    lessee and is still much in arrears from Szettlewch; with the 6000 Rthl damages on account of the
    lease not being obtained, the [uncertain: Erl.] was indeed already dismissed, and the 1500 Rthl are
    surely reckoned to the knave''s credit in the hereditary lease. The Provost Iwanski had indeed also
    lost the lawsuit and was dismissed; also this would have had to be the German congregation at Swięcia,
    in case he had obtained judgment, to give. The Przespolewski matter belongs purely to Trąbczin and
    to the Prusimski heirs — Meanwhile the receipt had at that time been found, that the fellow von Prussiemski
    was long since paid. Your Serene Highness will pardon my somewhat confused writing; I am so weak that
    I have had trouble bringing this to completion. In deepest reverence I remain, until death, Your Serene
    Highness''s — Of Swięcia I have no mortgage certificate — as [illegible] to me, [uncertain: G]lenck
    has thereupon had the Harckt[uncertain: reading] and consorts entered — Berlin, the 3rd of April 1808
    — let it be, for then the body of debts would [illegible] Most obedient serv[ant] v Triebenfeld'
- page: 4
  en: 'a further 18000 [uncertain: would] accede. Meanwhile this is not upon my mortgage and could not
    be an impediment to the loan. Enough — [uncertain: it was] the — Most gracious Prince and Lord — if
    150000 Rthl in Prussian Courant could be obtained, then one can with that pay off, at once here in
    Berlin, more than 200000 Rthl of debts. One buys treasury notes; these stand low, and one pays [text
    lost] these out at full value — [uncertain: names] must everyone who has claims and demands these
    back [text lost]; and [uncertain: der Ende] and Haucht et Consort would now qualify precisely for
    this, that they be paid with [uncertain: Behr-]notes. All this I beg may be well taken to heart, and
    that news be given me as speedily as possible, and also that You write to Trąbczin and Peisern, and
    in particular demand back the general power of attorney given to [uncertain: Hennochs]; for I cannot
    [uncertain: be answerable] that the many general plenipotentiaries do not play the rogue and in the
    end negotiate sums and keep them for themselves. Especially with a fellow [uncertain: wittwärlicher]
    is this much to be feared. Once again: if Your Serene Highness can now speedily obtain 200000 [uncertain:
    ₰] in cash there, then You can, with the greedy [uncertain: consumers] — where money is so [uncertain:
    scarce] and the papers stand so [uncertain: steep] — settle almost Your whole debt. One thing more:
    Eysenhardt demands of Your Serene Highness a considerable [text lost], because the Ephraim item is
    [uncertain: mixed in] — Ephraim demands the money here too and has already been with me several times
    on that account. Let Your Serene Highness not deceive me in this; pay Ephraim off here with treasury
    notes, which stand, as I [uncertain: see], only at 48 per cent, but which must nevertheless be taken
    at their nominal value. v Triebenfeld'

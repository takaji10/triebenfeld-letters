- page: 1
  en: '31


    Most Serene Prince


    Most gracious Lord. Over the misfortune that has befallen me here, or rather over the arrest on account
    of the interest still outstanding, I have vexed myself to such a degree that I contracted an inflammation
    of the abdomen and cramps; through the efforts of an honest physician I have indeed been put out of
    danger, but I should also have had to keep to my room and bed for a couple of [uncertain: weeks] [text
    lost] as I was entirely. The grief over all these adverse events wears me down still; from my estates
    I have or receive not a Groschen, from the State and the King I draw nothing, from no man do I take
    anything — on what am I to live? I have given up everything so as not to become the mockery of men
    — I [text lost] was sent hither and was to go from here to Vienna, but I had to live through this
    disgrace, and my career, just then entered upon, was undone. Now I sit here and heap debt upon debt,
    for I cannot get away — I therefore repeat the request that the former instruction for the 6000 Rthl.
    be sent back with all possible speed, so that I may help myself thereby, inasmuch as I shall recover
    the pledged mortgage of 10000 Rthl.


    As concerns further the evidence Your Serene Highness has required, the same follows herewith together
    with the mortgage certificate. I was on the point of obtaining the money from Holland, but if Your
    Serene Highness can get it there, that is the more agreeable to me; if they give you the full 250000
    Rthl, then I need only cede the mortgage, and then you keep 102000 for yourself, and the outstanding
    arrears as well, which — when the times change — can quickly be recovered. For the rest, there will
    now be a bad confusion on the estates there, and I shall again have much vexation.


    I had engaged the justice commissary Mitschke in Kalisz, that he should act as justiciary on the estates
    and at the same time attend to the conduct of all the lawsuits. For this I had promised him 300 Rthl.
    salary and, when he travelled, 1 Rthl. [uncertain: service money].'

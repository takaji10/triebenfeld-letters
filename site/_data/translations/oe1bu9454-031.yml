- page: 3
  en: 'In this way alone does Your Serene Highness''s disposition remain standing unimpaired, and I too
    am not compromised, and much is saved besides. With regard to the loan I must once more most earnestly
    beg that news be given me as speedily as is possible, so that I do not fall into embarrassment. Your
    Serene Highness''s letter is of the 23rd of March and I received it on the 3rd of April, thus 11 days
    in transit; so I repeat once again that nothing is required but the cession of the mortgage, and that
    it is very easy to deal in this matter. The revenues will then turn out as I have described them,
    or rather even higher. — As to what Your Serene Highness writes to me concerning various suits, of
    that I know not a word. — These must all be new stories, apart from the Przespolewski matters, of
    which that knavish Herrrichs has not written a word either; I shall write what is needful in that
    regard at once by tomorrow''s post — for at bottom, as I see it, all of it is invented and fabricated,
    rascally claims. Otocki and Exstädt have nothing to claim, the matters were settled long ago. Ignac
    von Radzinski is hereditary lessee and is still much in arrears from Szetlewek; with the 6000 Rthl
    of damages on account of the lease not being received, the [uncertain: worthy gentleman] was indeed
    already dismissed, and the 1500 Rthl have surely been credited to the knave in the hereditary lease.


    The provost Iwanski had likewise lost his suit and was dismissed; and moreover it would have to be
    the German congregation at Swiątniki to [uncertain: pay], had he prevailed. The Pzespolewski matter
    belongs purely to Trąbczyn and to the Prusimski heirs. — Meanwhile the receipt had at that time been
    found, showing that the fellow of Prussiemski had long since been paid. Your Serene Highness will
    pardon my somewhat confused writing; I am so weak that I have had trouble bringing this to completion.


    In [uncertain: deepest] respect I remain, until death,


    Your Serene Highness''s


    of Swiątniki I have no mortgage


    certificate — as [uncertain: it seems] to me, Glenck has had the [uncertain: Harckt] and consorts
    entered upon it


    Berlin, the 3rd of April 1808.


    [had it] done, whereby the body of debts would


    [illegible] most obedient servant v. Triebenfeld'

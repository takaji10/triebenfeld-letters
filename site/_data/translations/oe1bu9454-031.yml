- page: 4
  en: 'a further 18000 [uncertain: would accede]. In the meantime this is not upon my mortgage and could
    not be an impediment to the loan. It is enough, Most gracious Prince and Lord, that if [you] could
    obtain 150000 Rthl in Prussian Courant, then more than 200000 Rthl of debts could be paid therewith,
    at once here in Berlin. One buys treasury notes; these stand low, and one pays them out at full [value]
    — [uncertain: for] everyone who has a claim upon us and demands it back must take them; and [uncertain:
    the Ende] and the [uncertain: Haucht] and consorts would qualify precisely for being paid with such
    notes. All this I beg may be well weighed, and that news be given me as speedily as possible; also
    that you write to Trąbczyn and Pyzdry, and in particular that the general power of attorney given
    to Hennochs be demanded back, for I cannot [uncertain: vouch] that the many general attorneys will
    not play the rogue and in the end negotiate sums and keep them for themselves. This is especially
    much to be feared in the case of a fellow [uncertain: such as that one]. Once more: should Your Serene
    Highness now speedily obtain 200000 ₰ in ready money there, then, with the grasping [uncertain: consumers],
    where money is so [scarce] and the papers stand so [uncertain: steeply], you could settle nearly your
    whole debt. One thing more: Eysenhardt demands of Your Serene Highness a considerable [sum], because
    the Ephraim entry has been [uncertain: made]. — Ephraim demands the money here too, and has already
    been with me several times on that account; let Your Serene Highness not be deceived in this by me.
    Pay Ephraim off here with treasury notes; they stand, as I [see], at only 48 [uncertain: per cent],
    yet must be taken at their nominal value.


    v. Triebenfeld'

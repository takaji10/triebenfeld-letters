- page: 4
  en: 'come to a further 18000 Rthl. Meanwhile this does not lie upon my mortgage and could not be [uncertain:
    obstructive] to the loan. Enough that if [text lost] Most gracious Prince and Lord [text lost] could
    obtain 150000 Rthl in Prussian Courant, then with it they can pay off over 200000 Rthl of debts at
    once here in Berlin. One buys treasury notes — these stand low — and pays with them there, these at
    their full value — [illegible] every man who has a claim must [uncertain: accept] them and demand
    these back from us; and the [uncertain: Ende] and Haucht et consorts would now qualify precisely for
    being paid with [uncertain: bearer notes]. All this I beg may be well taken to heart, and that I be
    given news as speedily as possible, and also that you write to Trąbczyn and Pyzdry, and in particular
    demand back from Honrichs the general power of attorney given him; for I cannot [uncertain: be answerable]
    that the many general attorneys do not play the rascal and in the end negotiate sums and keep them
    for themselves. This is especially much to be feared in the case of a fellow like Honrichs. Once again,
    if Your Serene Highness can now speedily obtain 200000 Rthl in cash there, then, with the [uncertain:
    grasping consumers] where money is so [text lost] and the papers stand so [uncertain: high], you can
    settle nearly your whole debt. One thing more: Eysenhardt claims of Your Serene Highness a considerable
    [text lost], because of which the Ephraim item has been [uncertain: mixed in] — Ephraim demands the
    money here too and has already been with me several times on that account. Let Your Serene Highness
    not be deceived in this by me; pay off Ephraim [uncertain: in part] for here with treasury notes,
    which stand, as I [text lost], only 48 per cent, but must nonetheless be taken at their nominal value.


    v Triebenfeld'

- page: 2
  en: 'Your Serene Highness has now, however, appointed a certain Hawich from [uncertain: Peision] as
    justiciary, without my having known a word of it; you have also sent Honrichs a general power of attorney
    — how is this now to be [uncertain: rectified]? Henrichs and Niedrierechi hold together, and the result
    is that the fellows will now cheat Your Serene Highness in common, especially since the one of them
    is authorised to do so. For two years the [illegible] have not remitted a farthing, but have already
    pocketed everything; I had therefore taken on a [uncertain: Cassus] and have just now sent him thither
    with extensive powers. Today I receive from this man — he is the son of the Privy Chief Consistorial
    Councillor Hecker here — the news that the general authorised representative of His Serene Highness,
    Mr Honrichs, Doctor, will not tolerate them. What am I now to do with this man and with [uncertain:
    Mitschke]? Honrichs has at once taken a lease from the Poles; he is a knave — I took him on at the
    time provisionally, in order to get the notorious Witów affair out of the world, but never was I minded
    to grant him a power in which he could do harm. Hecker furnishes a security of 4 to 5 [uncertain:
    thousand] in treasury notes; with these one could, even though they are worth only half, at least
    cover something — the matter is settled here before the court — what am I now to undertake? My counsel
    is that Your Serene Highness write to Haberich that he is to apply to me in all things, and likewise
    to Honrichs, and that you demand back from the latter the general power of attorney forthwith, with
    the observation that such a thing does not [uncertain: suit] him since he is no man of law, but that
    you require men versed in justice; he might remain in the capacity in which Triebenfeld had appointed
    him. I then determine that [uncertain: Haberich''s] judicial [uncertain: Contenz] receives 200 Rthl,
    fees remain; Mitschke as general advocate receives, in place of [uncertain: Trumm], 300 Rthl 5. [illegible]
    Haller as Chief Inspector 600 Rthl


    Cabanis as [uncertain: forester] and [uncertain: named] 300


    Honrichs as the said commissary, without influence 400


    Su[uncertain: m] 1800. d.


    [uncertain: Sansta] Schenk 800 Rthl had some [uncertain: Husten] land horses [uncertain: God''s] what
    400 the fraud Gr[uncertain: a]mm 300


    Tietz 300


    Cabanis 300


    Honrichs 400


    Fees, which Schenck''s amounted to, some 1200 Rthl


    sum 3.700 Rthl


    thus there is saved, as against formerly, 1900 Rthl'

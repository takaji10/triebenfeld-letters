- page: 2
  en: 'But Your Serene Highness has now appointed a certain Hawich from Pyzdry as justiciary, without
    my having known a word of it, and you have also sent Honrichs a general power of attorney — how is
    that now to be put right? Honrichs and Niedźwiecki hold together; the result is that the fellows will
    now cheat Your Serene Highness in concert, especially since the one of them is authorised to do so.
    For two years the villains have remitted not a heller, but have already pocketed everything; I had
    therefore taken on a [uncertain: case] and have just now sent him thither with extensive powers of
    attorney. Today I receive from this man — he is the son of the privy senior consistorial councillor
    Hecker here — the news that the general authorised representative of His Serene Highness, Mr Honrichs,
    Doctor, will not tolerate them. What am I now to do with this man and with Mitschke? Honrichs has
    at once taken a lease from the Poles; he is a knave — I took him on at that time on an interim footing,
    to get the notorious Witów affair out of the world; but never did I intend to grant him a power in
    which he could do harm. Hecker is putting up a security of 4 to 5/m Rthl. in treasury notes; with
    those one could, even though they are worth only half their value, still cover something — the matter
    has been settled here before the court — what am I now to begin upon? My advice is that Your Serene
    Highness write to Hawich that he is to apply to me in everything, and likewise to Honrichs, and that
    you demand back from the latter the general power of attorney forthwith, with the remark that such
    a thing is of no use to him since he is no man of the law, but that you require men versed in justice;
    he could remain in the capacity in which Triebenfeld had appointed him. I then determine that Hawich
    as justice [uncertain: contentious business] receives 200 Rthl. (the fees remain Your Serene Highness''s),
    Mitschke as general advocate receives, in place of Grimm, 300 Rthl., Hecker as Chief Inspector 600
    Rthl.


    Cabanis as head forester and [uncertain: official] 300 Rthl; Honrichs as [uncertain: named] commissary
    without influence 400 Rthl; total 1800 Rthl.


    [illegible] Schenck 800 Rthl, had some [text lost] 400 Rthl amounted to; Grimm 300 Rthl


    Tietz 300 Rthl


    Cabanis 300 Rthl


    Honrichs 400 Rthl


    Fees, which Schenck [uncertain: received], amounted to about 1200 Rthl


    total 3,700 Rthl.


    thus saved as against formerly 1900 Rthl.'

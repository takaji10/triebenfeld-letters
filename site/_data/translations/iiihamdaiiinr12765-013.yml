status: draft
segments:
- page: 1
  en: 'My Prince, His Excellency Baron vom Stein has communicated to me the letter which Your Serene Highness
    wrote to him on the 12th of last month. I am acquainted with the claim which you are making upon the
    estates of Kamionna and Trąbczyn; but I urge you, in order to make them good, to await the definitive
    settlement of the affairs of Poland. That moment does not appear to be far off, and I beg you, my
    Prince, to be assured that I shall then do everything in my power to support your request with the
    King, whose principles of justice must inspire in you an entire confidence.


    I have the honour to offer to Your Serene Highness the expression of my high consideration.


    Vienna, the  May 1815.


    To His Serene Highness the Prince Friedrich Ludwig of Hohenlohe at Sławięcice.'

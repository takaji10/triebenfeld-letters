status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord,


    Your Serene Highness''s gracious letter of the 23rd of April I have just this moment received, and
    I reply thereto most obediently that I shall not deliver the present and the earlier enclosures to
    Herr p. Koppen, who has just returned from Paris, because the talk in them is always that Justus Eysenhardt
    is to draw a part of the moneys from the assignation. This I cannot allow, for I should have to repay
    the Bank at once whatever is drawn upon it, since the bill of exchange which was given therewith has
    already been expired these 7/4 years — I should be coming out of the rain into the downpour. I must
    have this assignation back, in order to be able to return it to the Bank, without a single Groschen
    being drawn upon it. The assignation lies with the Privy Councillor Amelang; to him Your Serene Highness
    need only write that he is to retrocede the same forthwith, and that You would satisfy Eysenhardt
    by other means. Should this not happen, then I must have it annulled in all the public papers, with
    a breadth [of publication] befitting the matter. I am here as good as under arrest, and cannot depart
    without the complete settlement of this business, and likewise on account of the Invalids'' interest,
    notwithstanding that my orders direct me elsewhere. May Your Serene Highness therefore deign to write
    to Herr Amelang with all possible speed, that he give me back the whole assignation at once, and provide
    [uncertain: Rath/counsel] that for the payment of the Invalids'' interest only 2000 Rthl be assigned
    to me here — for the 2000 Rthl I receive for the Heihertsche security placed in papers; if You assign
    2000 Rthl to that, then I shall procure the rest [uncertain: Rath].'
- page: 2
  en: 'and Laar must have the 5000 Rthl Courant, otherwise Herr von Zastrow is in embarrassment, I am
    under arrest anew, and Your Serene Highness truly has no honour from it. Money I can have enough of
    in Holland, but not a single stiver upon estates in Poland. Consequently I most obediently advise
    Your Serene Highness by all means to see to it there alone, and to have the moneys negotiated.


    With unbounded veneration I am Your Serene Highness''s


    [uncertain: Beneten] 30 Stadt [uncertain: Schenck]


    Berlin, the 2nd of May 1808


    With my recovery it goes very much at a snail''s pace. The constant vexation hinders my restoration
    to health.


    Humble and obedient servant

    v Triebenfeld'

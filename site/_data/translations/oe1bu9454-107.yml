  en: '107


    Most Serene Prince


    Most gracious Lord!


    The accompanying letter has been sent to me by Colonel von Zastrow by way of a huntsman, that I should
    most humbly transmit the same to Your Most Serene Highness. The royal cabinet letter I shall not receive
    until today or tomorrow. Since Your Most Serene Highness will probably be arriving here at once, I
    shall keep it by me until your most high arrival. Upon the Princess Sacken I did indeed wish to wait,
    but I was not received, and in this regard I have only had Your Most Serene Highness''s letter delivered
    to the Princess'

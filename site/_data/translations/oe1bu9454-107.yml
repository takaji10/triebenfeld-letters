- page: 2
  en: 'be delivered. Just now I am sending her a further letter, obtained from Colonel von Zastrow to
    von K[öckritz], from which the Princess is to be satisfied that Your Serene Highness can arrive shortly.


    The good monarch and the whole [uncertain: custody] take the liveliest interest in the affair, and
    everything is on Your Serene Highness''s side — the Princess Sa: has probably had Professor Selle
    lay the matter out in certain quarters in such a fashion that she alone is to be pitied by all. To
    the Princess there come, as I hear, the lady von Rietesel, the advocate Cosmar, the minister Heinitz,
    a certain Hoym, and Professor Selle —'

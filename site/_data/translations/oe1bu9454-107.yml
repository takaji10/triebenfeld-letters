- page: 3
  en: 'For the rest [illegible] in public almost everything [uncertain: is picked apart to the last hair],
    and here the notes are appended to it — One [text lost] the Princess has declared through Hein that
    she will never return to Your Serene Highness. She wishes to live freely wherever it pleases her;
    she would be content with 2/m Rthl appanage. She, the Princess, was pure as an angel, had no connexion
    with any other man, and had gone away from me, 1. because her personal aversion to Your Serene Highness
    was too great, and


    2. Because she would not help bring her children''s whole fortune to ruin, for she has already countersigned
    unspeakably many debts, but more she could not countersign; on that account she had chosen this step
    out of love for her children, to be rather dead in civil law than to be willing to squander the entire
    fortune. To this must [uncertain: the prattle] of other souls'

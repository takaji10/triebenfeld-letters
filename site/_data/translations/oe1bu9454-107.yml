- page: 4
  en: 'Your Most Serene Highness''s friends now wish of me that you most highly show yourself towards
    the Princess Sacken with firmness, and settle everything briefly; gladly will everything be approved
    on [uncertain: every] side. Since the day before yesterday there is here, even at court, the news
    that Suvarow has now likewise been beaten, and he himself taken prisoner; one is therefore full of
    expectation over the various reports — but the worthy Colonel


    von K[öckritz] rejoices that he judged rightly, and even the warlike parties now say: God, how good
    it is that our monarch has meddled in nothing.


    In deepest submission I remain, until death, Your Most Serene Highness''s


    Berlin, the 21st of October


    1799


    faithful servant


    v Triebenfeld'

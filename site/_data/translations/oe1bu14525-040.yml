status: draft
segments:
- page: 1
  en: 'Copy.


    Friedrich Wilhelm etc. In the taking-over and delivery, commanded of you, of the South Prussian estates
    of your department granted to His Lordship the Prince of Hohenlohe, it has been Our will and intention
    that the same should at once, and as far as is in any way possible without prejudice to the rights
    of a third party, be left to His Lordship''s free disposition, and hence also to his husbandry and
    improvement as he shall please. Notwithstanding this, We come to learn that the delivery carried out
    has consisted merely in a superficial ceremony, and that the remark made in some places, that His
    Lordship is to settle all debts charged upon these estates, has confirmed various persons in the false
    notion that they may seat themselves in the estates and frame all manner of claims. Both in the confiscated
    noble and in the ecclesiastical estates granted to His Lordship the Prince there are said to be persons
    seated who have indeed produced pledge or lease contracts, but in respect of which it was not at all
    thoroughly investigated at the delivery whether these contracts were in themselves validly concluded,
    and, even were that the case, whether the holders thereof also really have a real claim upon this
    or that estate, and whether rather mere personal obligations were not contracted. It is said even
    to be already proven that some of these persons have false pledge contracts, and on that account the
    suits are said to be already pending before the Governments. But you yourself perceive that if His
    Lordship the Prince of Hohenlohe must first laboriously and through all instances conduct suits of
    this kind, Our Most High intention of putting His Lordship soon into the full enjoyment of the granted
    estates is thereby entirely delayed. Also the Treasury is bound, in pursuance of the deeds of grant,
    to procure for each donee as far as possible an unencumbered estate (fundum liberum). The delivery
    commissioners ought therefore also to have'
- page: 2
  en: more closely ascertained those claims which have been made upon these estates by outside persons,
    and to have left in possession of such an estate only those claimants who were able at once to prove
    a real right in one or the other estate and have exercised such real right by actual possession of
    the estate, and not to have acted so superficially, and to have conceded to many persons the continuing
    possession and further use of these estates even when they had by no means laid down undoubted proofs
    of their right. Now, in order not to burden His Lordship with unnecessary and protracted suits, yet
    also not to injure anyone in well-acquired rights, you are yourselves to take every pains to examine
    and settle the various demands upon these estates as soon as may be, to have these estates, so far
    as can in any way lawfully be done, handed over to the princely mandatories for the sole disposition
    and free husbandry of the Prince, to compose all disputed points amicably so far as ever possible
    — the more so as His Lordship himself, with sacrifice of his own interest, shews every inclination
    thereto — and, in those cases where it absolutely cannot be otherwise arranged without great danger
    to the Treasury and without legal proceedings, to take the shortest ways, and, according to the circumstances,
    to have the suit conducted either by the fiscal officers alone, or by them as assistants of the princely
    mandatory. For the complete settlement you will have to examine most exactly the circumstances of
    each single estate, and then to set the further matter in train upon the constant presupposition that
    His Lordship be at once in
- page: 3
  en: 'stalled in all rights and powers that can in any way be lawfully transferred by the Treasury. Also,
    since the detailed valuations of all the ecclesiastical estates have already been remitted to you
    with approbation, you will very easily and soon be able to determine the dues and the competence monies
    which His Lordship the Prince of Hohenlohe has to pay; and since the discontent of the clergy grows
    ever greater the longer you delay the fixing and advance payment of these competence monies, you are
    to ascertain the same with the utmost despatch and to make report thereof to Us. In general you are
    to report to Us fully upon the settled business of delivery of possession of these estates, and what
    difficulties have arisen therein, and, according as the estates belong together or are separate, to
    report upon them severally; wherein We hold Ourselves assured that you will carefully order everything
    according to this Our will and intention, and will urge the Domains Establishment Commission, the
    delivery commissioners and the office of the Treasury, each in its own relation, to the speedy fulfilment
    of what has been ordered. [uncertain: Sinde G.] Wrocław, the 20th October 1797.


    A. S. B. signed Count von Hoym. To the p Chamber at Poznań and Petrikau.'

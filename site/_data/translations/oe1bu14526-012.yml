- page: 3
  en: 'Magdeburg measure, together 2000 rt, written out: two thousand Rthl, and for the buildings 100
    rt, written out: one hundred Rthl, hence in all 2100 Rthl, written out: two thousand one hundred Rthl,
    and that at Midsummer of this year with 800 rt, written out: eight hundred Rthl, and at Christmas
    of this year with 1300 rt, written out: one thousand three hundred Rthl, in cash and in good Prussian
    Courant of full treasury weight.


    §. III. The hereditary lessee binds himself for these acquired 6 Hufen 20 Morgen, from Midsummer of
    this year onward, to a perpetual hereditary quit-rent, which may never be raised or diminished, of
    15 rt per Hufe Magdeburg measure, written out: fifteen Rthl, hence for 6 Hufen 20 Morgen 100 Rthl,
    written out: one hundred Rthl, in'
  names:
  - de: Magdeburg.
    en: Magdeburg
    kind: place

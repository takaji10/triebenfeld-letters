- page: 4
  en: 'in Courant cash, and that annually in two instalments, at Christmas and at Midsummer, each time
    with 50 rt, written out: fifty Rthl, yet not in advance but after the expiry of each half year, consequently
    to be paid for the first time at Christmas.


    §. IV. He must effect his establishment himself, at his own cost and without receiving either now
    or for the future timber or any other building assistance; he likewise receives neither right of pasturage
    nor right of wood-taking on the remaining manorial territory.


    §. V. The 20 Morgen Magdeburg measure acquired [uncertain: by purchase] shall be measured out to Kammer
    as soon as possible'
  names:
  - de: komme
    en: Kammer
    kind: person
  numbers:

- page: 1
  en: 'Actum Trąbczyn, the 10th of May 1805. Before the undersigned patrimonial court there appeared:


    1., the Councillor of War and Forests von Triebenfeld, as is known the general attorney of His Serene
    Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court of the
    estates here, on the one part,


    and


    2., the forester Mr. George Friedrich Kammer of Pietrzykowo on the other part. The parties are personally
    known to the undersigned, and their capacity to execute [uncertain: valid] transactions is subject
    to no doubt.


    The same do voluntarily and after mature deliberation declare into the protocol the following hereditary
    quit-rent contract concluded between them, irrevocable and in nothing to be altered'

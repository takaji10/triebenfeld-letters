- page: 5
  en: 'and the same receives winter and summer field unsown; yet for the working of the present summer
    field, for the carting out of the dung, the requisite team-service shall be furnished him by the manorial
    lordship, and that upon two Hufen for this once without charge.


    §. VI. Besides the cash hereditary quit-rent, the hereditary lessee obliges himself, for himself and
    his successors in possession of these six Hufen 20 Morgen, to discharge all and every royal tax, as
    likewise the quota due to the monastery of Ląd and the dues to the clergy, chimney money, forage delivery,
    and whatever else may occur, without any exception whatsoever,'
  names:
  - de: Kloster Ląd
    en: the monastery of Ląd
    kind: place
  numbers:
  - VI.
  - '20'
- page: 6
  en: 'without making or obtaining on that account any remission of the hereditary quit-rent.


    §. VII. The hereditary lessee must take his drink, in beer and brandy, from the manorial tavern or
    the brew- and distilling-house, and in case of contravention must pay to the manorial lordship a fine
    of one Rthl for every garniec of foreign brandy brought in and five Rthl for every barrel of foreign
    beer.


    §. VIII. The hereditary lessee and his successors in possession are subject to the jurisdiction of
    the manorial lordship (Dominium) here, yet are wholly and for ever'
  numbers:
  - VII.
  - VIII.
- page: 7
  en: 'and perpetual times exempted from all and every delivery in kind and Hufe-service.


    S. IX.


    The hereditary lessee and his successors in possession are at liberty to [uncertain: alienate] this
    acquired holding to another by sale or by exchange; yet such must take place with the consent of the
    manorial lordship, and upon every such change of possession there shall be paid to the manorial lordship,
    out of the purchase money or the sum given in exchange, the [uncertain: Groschen received] as a transfer
    fee (Laudemium). Upon inheritance by [uncertain: direct] and collateral relations, no transfer fee
    is paid.


    §. X. The hereditary lessee renounces, for himself and his successors in possession, all and every
    remission'
  numbers:
  - IX.
  - X.
- page: 8
  en: 'in cases of misfortune arising through fire from heaven, through arson by evil persons, crop failure,
    hail, flood, cattle plague, war and pestilence, or in any other manner whatsoever, and on that account
    there shall never accrue to them any indemnification from the manorial lordship or remission of the
    hereditary quit-rent.


    §. XI. The costs of this contract and of its engrossment are paid by the hereditary lessee.


    §. XII. So long as the hereditary lessee and his successors in possession of this holding shall fulfil
    all the above obligations,'
  numbers:
  - XI.
  - XII.
- page: 9
  en: 'the manorial lordship promises to protect them everywhere in their rights and to defend them against
    every man''s real claims.


    Should, however, the hereditary lessee and his successors lay this holding waste, or remain in arrears
    with the yearly hereditary quit-rent for longer than two years, then this hereditary lease contract
    shall cease and the manorial lordship shall be entitled to let out this holding otherwise.


    Both parties promise to hold the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal'
  numbers:
  - zwey
- page: 10
  en: 'evasions available against it, particularly the objection of cunning persuasion, of precipitancy,
    of an injury suffered above or below the half, and of matters otherwise agreed than written down;
    and they have been duly instructed by the court as to the consequences of this renunciation.


    His Most Serene Highness expressly consents that the hereditary lessee may, upon the ground of this
    contract, have the title of possession of this acquired holding [uncertain: registered] in his name.'
- page: 11
  en: 'Further the contracting parties had nothing to bring forward; after this protocol had been read
    over to them word for word, they approved the same throughout and have signed below in their own hands.
    Peter Friedrich August von Triebenfeld. I have read and approve this contract. George Friedrich Kammer


    a. u. s. Schenck


    Brauer'

- page: 5
  en: 'and he receives the winter and summer field unsown; however, for the cultivation of the present
    summer field, for the carting out of the manure, the requisite team service will be provided him by
    the manorial lordship, and that upon two Hufen, free of charge for this once.


    §. VI. Besides the cash hereditary quit-rent, the hereditary lessee obliges himself, for himself and
    his descendants in possession of these six Hufen 20 Morgen, to discharge all and every royal taxes,
    as also the competence due to the monastery of Ląd and the dues to the clergy, chimney money, forage
    delivery, and whatever else may arise, without any exception whatsoever,'
  names:
  - de: Kloster Ląd
    en: the monastery of Ląd
    kind: place
  numbers:
  - '20'
- page: 6
  en: 'without making or obtaining on this account any remission of the hereditary quit-rent.


    §. VII. The hereditary lessee must take his drink, beer and brandy, from the manorial tavern or the
    brewing and distilling house, and in case of contravention must pay to the manorial lordship as a
    penalty one Rthaler for every garniec of foreign brandy brought in, and five Rthaler for every barrel
    of foreign beer.


    §. VIII. The hereditary lessee and his successors in possession are subject to the jurisdiction of
    the local manorial lordship (Dominium), yet are wholly and for all'
- page: 7
  en: 'time exempt from all and every deliveries in kind and Hufe services.


    §. IX.


    The hereditary lessee and his successors in possession are at liberty to [uncertain: alienate] this
    acquired holding to another by sale or exchange; however, this must be done with the consent of the
    manorial lordship, and upon any such change of possession the [uncertain: customary] Groschen shall
    be paid to the manorial lordship out of the purchase money or the exchange amount as a transfer fee
    (Laudemium). Upon inheritances to [uncertain: direct] and collateral relations, no transfer fee is
    paid.


    §. X. The hereditary lessee renounces, for himself and his successors in possession, all and every
    remission'
- page: 8
  en: 'in cases of misfortune arising through fire from heaven, through the incendiarism of evil persons,
    crop failure, hailstorm, inundation, cattle plague, war and pestilence, or in any other manner whatsoever,
    and on that account no compensation from the manorial lordship nor any remission of the hereditary
    quit-rent shall ever accrue to them.


    §. XI. The costs of this contract and of its official copy are paid by the hereditary lessee.


    §. XII. So long as the hereditary lessee and his successors in possession of this holding shall fulfil'
- page: 9
  en: 'all the above obligations, the manorial lordship promises to protect them in their rights in every
    respect and to defend them against everyone''s real claims.


    Should, however, the hereditary lessee and his successors lay this holding waste, or remain in arrears
    with the annual hereditary quit-rent for longer than two years, then this hereditary-lease contract
    shall cease and the manorial lordship shall be entitled to dispose of this holding elsewhere.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal'
  numbers:
  - zwey
- page: 10
  en: 'evasions available against it, in particular the objection of cunning persuasion, of precipitancy,
    of an injury sustained above or below the half, and of matters otherwise agreed than set down in writing;
    and they have been duly instructed by the court as to the consequences of this renunciation.


    His Most Serene Highness expressly consents that the hereditary lessee may, on the ground of this
    contract, have the title of possession of this acquired holding entered in his own name.'
- page: 11
  en: 'Further the contracting parties had nothing to bring forward; after this protocol had been read
    over to them word for word, they approved it in every respect and signed it below in their own hands.
    Peter Friedrich August von Triebenfeld. I have read and approve this contract. George Friedrich Kammer


    a. u. s. Schenck


    Brauer'

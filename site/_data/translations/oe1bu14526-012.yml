- page: 3
  en: 'Magdeburg measure, together 2000 rt, written two thousand Rthaler, and for the buildings 100 rt,
    written one hundred Rthaler, in all therefore 2100 rthl., written two thousand one hundred Rthaler,
    and that at Midsummer of this year with 800 rt, written eight hundred Rthaler, and at Christmas of
    this year with 1300 rt, written one thousand three hundred Rthaler, in cash and in good Prussian Courant
    of the standard of the public treasury.


    §. III. The hereditary lessee binds himself for these acquired 6 Hufen 20 Morgen, from Midsummer of
    this year, to a perpetual hereditary quit-rent which may never be raised or lowered, per Hufe Magdeburg
    measure at 15 rt, written fifteen Rthaler, hence for 6 Hufen 20 Morgen 100 rthl., written one hundred
    Rthaler, in'

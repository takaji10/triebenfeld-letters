status: draft
segments:
- page: 1
  en: 'Actum Trąbczyn, the 10th of May 1805. Before the undersigned Patrimonial Court there appeared


    1st, Herr Councillor of War and Forests v. Triebenfeld, as the known General Plenipotentiary of His
    Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court
    of the estates here, on the one part


    and


    2nd, the forester H. George Friedrich Kammen of Pietrzykowo on the other part. The parties are personally
    known to the subscribers, and their capacity to execute [uncertain: gewähtlicher] transactions is
    subject to no doubt.


    The same declare, freely and after due deliberation, for the record, the following irrevocable hereditary
    quit-rent contract concluded between them, in nothing to be al-'
- page: 2
  en: 'tered, [text continues] into the record.


    § I. His Most Serene Highness accordingly grants in hereditary quit-rent, out of the demesne farm
    Przybysław belonging to the Trąbczyn estates, 6 Hufen [uncertain: keines] of arable land and, in meadow
    within the boundaries of the Trąbczyn estates, 20 Morgen, together therefore 6 Hufen 20 Morgen, in
    writing six Hufen twenty Morgen Magdeburg measure, to George Friedrich Kammer from now on and for
    ever-enduring times, together with all the farm buildings situated at Przybisław, nothing at all being
    excepted therefrom, as likewise the building timber lying there upon the demesne farm.


    § II. Kammer pays as purchase-money for the granted [uncertain: Rechtshafen], twenty Morgen'
- page: 3
  en: 'Magdeburg measure, together 2000 rt, in writing two thousand Rthaler, and for the buildings 100
    rt, in writing one hundred Rthaler, thus in all 2100 rthl., in writing two thousand one hundred Rthaler,
    and that indeed at Johanni of this year with 800 rt, in writing eight hundred Rthaler, and at Christmas
    of this year with 1300 rt, in writing one thousand three hundred Rthaler, in cash and in good Prussian
    Courant of the standard of the treasury.


    § III. The hereditary lessee binds himself, for these acquired 6 Hufen 20 Morgen, from Johanni of
    this year onward to [pay] an ever-enduring hereditary quit-rent, which may never be raised or diminished,
    per Hufe Magdeburg measure at 15 rt, in writing fifteen Rthaler, hence for 6 Hufen 20 Morgen 100 rthl.,
    in writing one hundred Rthaler, in'
- page: 4
  en: 'in Courant cash, and that annually in two instalments at Christmas and at Johanni, each time with
    50 rt, in writing fifty Rthaler, yet not in advance, but rather after the lapse of each half-year,
    consequently to be paid at Christmas for the first time.


    § IV. His establishment he must effect himself at his own cost, and without receiving, either for
    the present or for the future, timber or other building assistance; nor does he receive any right
    of pasture or of wood-cutting on the remaining seigneurial territory.


    § V. The acquired [uncertain: bekaufen] 20 Morgen Magdeburg measure shall be measured out to Kammer
    as soon as possible,'
- page: 5
  en: 'and he receives the same, winter and summer field, unsown; yet for the tilling of the present summer
    field, for the carting out of the [uncertain: Muses], the requisite team-service will be furnished
    him by the ground lordship, and that for two Hufen, free of charge for this once.


    § VI. Besides the cash hereditary quit-rent, the hereditary lessee obliges himself, for himself and
    his descendants in possession of these six Hufen 20 Morgen, to discharge all and every Royal taxes,
    as likewise the Competenz for the monastery Ląd and the dues to the clergy, chimney-money, forage
    deliveries, and whatever else may arise, without any exception whatever,'
- page: 6
  en: 'without making or obtaining any remission of the hereditary quit-rent on that account.


    § VII. The hereditary lessee must take his drink in beer and brandy from the seigneurial [uncertain:
    Frage] or brew- and distilling-house, and in case of contravention must pay to the ground lordship,
    for every Garniec of foreign brandy brought in, one Rthaler, and for every barrel of foreign beer
    five Rthaler, as a penalty.


    § VIII. The hereditary lessee and his successors in possession are subject to the jurisdiction of
    the local Dominium, yet are wholly and for ever'
- page: 7
  en: 'enduring times exempt from all and every deliveries in kind and Hufe-services.


    § IX.


    The hereditary lessee and his successors and [uncertain: Besizze] are at liberty to alienate this
    acquired holding to another by sale or by exchange, yet such must take place with the consent of the
    ground lordship, and upon every such change of possession there shall be paid to the ground lordship,
    out of the purchase-money or the exchange sum, the [uncertain: gehabte] Groschen as a Laudemium. In
    cases of inheritance to [uncertain: sonder] and collateral relations, no Laudemium is paid.


    § X. The hereditary lessee renounces, for himself and his successors and [uncertain: besag], all and
    every remission'
- page: 8
  en: 'in cases of misfortune which arise through fire from heaven, through the incendiarism of evil people,
    crop failure, [uncertain: smagelschlag], flood, cattle-plague, war and pestilence, or in any other
    manner whatsoever, and no compensation from the ground lordship, nor remission of the hereditary quit-rent,
    shall ever on that account accrue to them.


    § XI. The costs of this contract and of its engrossment are paid by the hereditary lessee.


    § XII. So long as the hereditary lessee and his successors and [uncertain: besitze] of this holding
    shall fulfil all the above obligations,'
- page: 9
  en: 'the ground lordship promises to protect them in their rights in every respect and to defend them
    against every man''s real claims.


    Should, however, the hereditary lessee and his successors [uncertain: verwüßen] this holding, or remain
    in arrears with the annual hereditary quit-rent for longer than two years, then this hereditary-lease
    contract shall cease, and the ground lordship shall be entitled to dispose of this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal'
- page: 10
  en: 'evasions available against it, in particular the objection of cunning persuasion, of precipitancy,
    of an injury suffered above or below the half, of matters agreed otherwise than as set down in writing;
    and they have been duly instructed by the court as to the consequences of this renunciation.


    His Most Serene Highness expressly consents thereto, that the hereditary lessee may, upon the ground
    of this contract, have the title of possession of this acquired holding entered in his name.'
- page: 11
  en: 'Further the contracting parties had nothing to bring forward; after this protocol had been read
    over to them word for word, they approved the same in every respect and subscribe it below in their
    own hand.


    Peter Friedrich August v. Triebenfeld


    I have read and approve this contract

    George Friedrich Kammer


    a. u. s. Schenck


    Brauer'

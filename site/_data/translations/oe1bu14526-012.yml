- page: 2
  en: 'hereditary quit-rent contract, into the protocol.


    §. I. His Most Serene Highness does, namely, grant out of the demesne farm Przybysław belonging to
    the Trąbczyn estates 6 Hufen of clean arable land, and in meadow within the bounds of the Trąbczyn
    estates 20 Morgen, thus together 6 Hufen 20 Morgen, written out: six Hufen twenty Morgen Magdeburg
    measure, to George Friedrich Kammer from now on and for perpetual times in hereditary quit-rent, together
    with all the farm buildings standing at Przybisław, nothing at all excepted therefrom, as likewise
    the building timber lying there on the demesne farm.


    §. II. Kammer pays as purchase money for the [uncertain: holdings] granted to him, twenty Morgen'

- page: 4
  en: 'in Courant in cash, and that annually in two instalments at Christmas and at Midsummer, each time
    with 50 rt, written fifty Rthaler, yet not in advance, but after the lapse of each half year, and
    consequently to be paid for the first time at Christmas.


    §. IV. His establishment he must effect himself at his own cost, and without receiving either now
    or for the future any timber or other building assistance; nor does he receive any right of pasturage
    or of wood-taking on the remaining manorial territory.


    §. V. The acquired [uncertain: purchased] 20 Morgen Magdeburg measure shall be measured out to Kammer
    as soon as possible'

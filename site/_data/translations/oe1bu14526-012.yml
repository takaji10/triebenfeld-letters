status: draft
segments:
- page: 1
  en: 'Actum Trąbczyn, the 10 May 1805. Before the undersigned Patrimonial Court there appeared


    1., Herr Councillor of War and Forests v. Triebenfeld, as the known General Plenipotentiary of His
    Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court
    of the estates here, on the one part


    and


    2., the forester H. George Friedrich Kammer of Pietrzykowo, on the other part. The parties are personally
    known to the Subscripti, and their capacities for the execution of [uncertain: valid] transactions
    are subject to no doubt.


    The same declare, freely and after due deliberation, for the protocol the following hereditary quit-rent
    contract concluded between them, irrevocable and in nothing to be altered'
- page: 2
  en: '-able hereditary quit-rent contract, to the protocol.


    §. I. His Most Serene Highness namely grants in hereditary quit-rent, out of the demesne farm Przybysław
    belonging to the Trąbczyn estates, 6 Hufen of clear arable land and in meadows within the boundaries
    of the Trąbczyn estates 20 Morgen, together therefore 6 Hufen 20 Morgen, in words six Hufen twenty
    Morgen Magdeburg [measure], to George Friedrich Kammer from now on and for perpetual times, together
    with all the farm buildings situated at Przybisław, nothing at all excepted, as also the building
    timber lying there upon the demesne farm.


    §. II. The said Kammer pays as purchase-money for the [uncertain: rightful holdings] granted to him,
    twenty Morgen'
- page: 3
  en: 'Magdeburg, together 2000 rt, in words two thousand Rthaler, and for the buildings 100 rt, in words
    one hundred Rthaler, altogether therefore 2100 rthl., in words two thousand one hundred Rthaler; and
    this, at Johanni of this year with 800 rt, in words eight hundred Rthaler, and at Christmas of this
    year with 1300 rt, in words one thousand three hundred Rthaler, in cash and in good Prussian Courant
    of the Treasury standard.


    §. III. The hereditary lessee binds himself for these acquired 6 Hufen 20 Morgen, from Johanni of
    this year onward, to a perpetual hereditary quit-rent, which may never be raised or diminished, per
    Hufe Magdeburg at 15 rt, in words fifteen Rthaler, hence for 6 Hufen 20 Morgen 100 rthl., in words
    one hundred Rthaler, in'
- page: 4
  en: 'in Courant, in cash, and indeed yearly in two instalments, at Christmas and at Johanni, each time
    with 50 rt, in words fifty Rthaler, yet not in advance, but to be paid after the expiry of each half
    year, consequently at Christmas for the first time.


    §. IV. His establishment [uncertain: he] must effect himself at his own cost, and without his receiving
    either now or in future timber or other building assistance; he likewise receives neither pasturage
    nor timber rights upon the remaining manorial territory.


    §. V. The acquired [uncertain: six Hufen] 20 Morgen Magdeburg are to be measured out to the said Kammer
    as soon as possible'
- page: 5
  en: 'and the same receives the winter and summer field unsown; however, for the cultivation of the present
    summer field, for the carting out of the [uncertain: manure], the requisite team-service shall be
    furnished by the ground-lordship, and indeed for two Hufen, this once, free of charge.


    §. VI. Besides the cash hereditary quit-rent, the hereditary lessee binds himself, for himself and
    his successors in possession of these six Hufen 20 Morgen, to discharge all and every Royal taxes,
    as also the dues to the Kloster Ląd and the levies to the clergy, chimney-money, forage deliveries,
    and whatever else may occur, without any exception whatever,'
- page: 6
  en: 'without making or receiving on this account any remission of the hereditary quit-rent.


    §. VII. The hereditary lessee shall take his drink of beer and brandy from the manorial tavern or
    from the brew- and brandy-house, and in case of contravention shall pay to the ground-lordship as
    penalty, for every Garniec of foreign brandy brought in, one Rthaler, and for every barrel of foreign
    beer five Rthaler.


    §. VIII. The hereditary lessee and his successors in possession are subject to the jurisdiction of
    the Dominium here, yet are wholly and for all perpetual'
- page: 7
  en: 'times exempted from all and every deliveries in kind and Hufe-services.


    §. IX.


    It stands free to the hereditary lessee and his successors in possession to [uncertain: alienate]
    this acquired holding to another by sale or exchange; yet such must take place with the consent of
    the ground-lordship, and upon every such change of possession there shall be paid to the ground-lordship,
    out of the purchase-money or the amount of the exchange, the [uncertain: Groschen accustomed] as a
    Laudemium. Upon inheritances to [uncertain: descendants] and collateral relations, no Laudemium is
    paid.


    §. X. The hereditary lessee renounces, for himself and his successors in possession, all and every
    remission'
- page: 8
  en: 'in cases of misfortune, whether arising through fire from heaven, through the malice of wicked
    people, crop failure, [uncertain: hail-stroke], inundation, cattle plague, war and pestilence, or
    in any other manner whatsoever, entirely; and on this account no indemnification from the ground-lordship,
    nor any remission of the hereditary quit-rent, shall ever accrue to them.


    §. XI. The costs of this contract and of its engrossment are paid by the hereditary lessee.


    §. XII. So long as the hereditary lessee and his successors in possession of this holding shall fulfil
    all the above obligations,'
- page: 9
  en: 'the ground-lordship promises to protect them everywhere in their rights and to defend them against
    every man''s real claims.


    But should the hereditary lessee and his successors lay this holding waste, or remain in arrears with
    the yearly hereditary quit-rent for longer than two years, then this hereditary-lease contract ceases,
    and the ground-lordship shall be entitled to dispose of this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all'
- page: 10
  en: 'legal evasions available against it, in particular the objection of cunning persuasion, of precipitancy,
    of an injury occurring above or below the half, of matters otherwise agreed than written down; and
    they have been duly instructed by the court as to the consequences of this renunciation.


    His Most Serene Highness expressly consents that the hereditary lessee may, on the ground of this
    contract, have the title of possession of this acquired holding entered in his own name.'
- page: 11
  en: 'Further the contracting parties had nothing to bring forward; after this protocol had been read
    over to them word for word, they approved the same throughout and subscribed it below with their own
    hands.


    Peter Friedrich August v. Triebenfeld


    I have read and approve this contract

    George Friedrich Kammer


    a. u. s. Schenck


    Brauer'

- page: 2
  en: 'hereditary quit-rent contract, to the protocol.


    §. I. His Most Serene Highness grants, namely, from the demesne farm Przybysław belonging to the Trąbczyn
    estates, 6 Hufen of clean arable land and, in meadows within the bounds of the Trąbczyn estates, 20
    Morgen, together therefore 6 Hufen 20 Morgen, written six Hufen twenty Morgen Magdeburg measure, to
    George Friedrich Kammer from now on and for [uncertain: ever-enduring] times in hereditary quit-rent,
    together with all the farm buildings situated at Przybisław, nothing at all excepted therefrom, as
    also the building timber lying there on the demesne farm.


    §. II. Kammer pays as purchase money for the [uncertain: lawful Hufen] granted to him, twenty Morgen'

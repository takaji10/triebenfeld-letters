- page: 3
  en: 'itself. Meanwhile the hereditary lease should be negotiated advantageously. For the rest, the Princess
    Sacken has, out of particular grace and mildness, deigned to have the capital of 30/m rt standing
    [illegible] Koszęcin called in through Mr Cosmar, as soon as she heard that Your Serene Highness had
    bought the estates. Oh the shame of it. General von Köckritz despises her [uncertain: Breenhau], and
    so does every honest man.


    May God bring Your Serene Highness back in good health — everything will nevertheless go well, and
    you will in every way yet stand as the victor.


    In deepest respect I remain, until death,


    Your Most Serene Highness''s Frankfurt an der Oder, the 21st of June 1804.


    most faithful servant


    v Triebenfeld'

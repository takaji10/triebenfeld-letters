- page: 3
  en: 'itself. In each case the hereditary lease should be arranged advantageously. For the rest, the
    Princess Sacken, out of particular grace and mildness, has deigned, as soon as she heard that Your
    Serene Highness had bought the estates, to have the capital of 30000 Rthl standing on [illegible]
    Koschentin called in through Mr. Cosmar. O the shame. General v. K. despises her [illegible] and so
    does every honest man. God bring Your Serene Highness back only in health – all will nevertheless
    go well, and Your Most High Self will in every way yet stand as victor.


    In deepest respect I remain, until death,


    Your Most Serene Highness''s


    Frankfurt an der Oder, the 21st of June


    1804.


    most faithful servant


    v. Triebenfeld'

- page: 1
  en: '137


    Most Serene Prince,


    Most gracious Lord!


    Mr Leixner, Meyer Bernhard and their partners are wretched fellows. First they promised to pay everything
    in Berlin — in Berlin it was said again that Friedländer had gone away. They would settle everything
    in Frankfurt an der Oder. Now that I arrive here today, they assure me that they mean to send the
    76/m rt, and likewise a further 20/m rt or so, by express courier in Bank Obligations, directly from
    Bernhardi. To the question why they are holding back 30/m rt — answer: we are already paying too much,
    for Your Serene Highness has bought Pszczew back In[illegible].


    I am still doing battle with the [illegible], and just now Meyer Bernhard promises to add a further
    10/m rt, but with 20 the rascal stays in arrears.


    In Berlin, since Wunster had drawn up the obligation faultily, I was still able to obtain the money;
    I have merely taken a few thousand rt on bills of exchange'

- page: 2
  en: 'so as to be able to present a face in Trąbczyn in every way, and so that Your Serene Highness may
    find money there.


    The deposition of the Broniewski monies will nevertheless without doubt be ordered; I have pushed
    it through by means of the Grand Chancellor and General von Köckritz. This is honourable for Your
    Serene Highness, and certainly some seventy thousand rt will be gained thereby. Had I acted sooner,
    on my own and with such boldness, everything would already have been disposed of. The answer from
    the King concerning the indemnification is quite obliging and seems to betoken good will. Meanwhile
    General von Köckritz has charged me to convey his most cordial greetings to Your Serene Highness,
    and to tell you most highly that you should most certainly receive estates, and indeed right good
    ones, in hereditary lease, from which something might be gained; for the King would not be in a position
    to give money, and since Schlabrendorff wished to return, this would follow of'

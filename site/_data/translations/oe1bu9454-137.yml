- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Mr. Wiener, Meyer Bernhard, and consorts are bad fellows. First they promised to pay everything in
    Berlin – in Berlin the word was again that Friedländer had gone away. They would settle everything
    in Frankfurt. Now that I arrive here today they assure me that they mean to send the 76000 Rthl, and
    likewise a further some 20000 Rthl by express courier in bank obligations, directly [uncertain: to
    Bernhardi]. To the question why they are holding back 30000 Rthl – answer: we are already paying too
    much, for Your Serene Highness has bought back Betsche.


    I am still doing battle with the [illegible], and just now Meyer Bernhard promises to add a further
    10000 Rthl, but with 20 the wretch holds back.


    In Berlin, since Wanster had drawn up the obligation faultily, I was still able to obtain the money.
    Merely a few thousand th. have I taken up on bills of exchange'

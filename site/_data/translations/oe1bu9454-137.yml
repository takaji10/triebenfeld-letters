- page: 2
  en: 'in Trąbczyn to be able to present a face in every respect, and so that Your Serene Highness may
    find money on hand.


    The deposition of the Brunieweische monies will nevertheless without doubt be ordered; I have carried
    it through by way of the Grand Chancellor and General Köckritz. This is honourable for Your Serene
    Highness, and certainly some seventy thousand [uncertain: Rthl] will thereby be gained. Had I acted
    earlier, alone and with boldness, everything would already have been disposed of. The answer from
    the King concerning the compensation is quite obliging and seems to betray good will. Meanwhile General
    v. K. has charged me to convey his most cordial greetings to Your Serene Highness and to tell you
    most highly that you should most certainly receive estates, and indeed right good ones, in hereditary
    lease, from which something might be gained. For money the King would not be in a position to give,
    and since Schlabrendorff wishes to return, this follows of'

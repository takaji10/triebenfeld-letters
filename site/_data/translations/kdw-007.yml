- page: 1
  en: 'Document no. 678


    Przemysł the Second, Duke of Greater Poland, 21 October 1291, at Gniezno; confirms the exchange of
    the estates of the monastery of Ląd called Głowiew, Sławsk and Chocicza for the estate of Count Sędziwój
    the under-chamberlain called Kopojno, which he endows with the most ample privileges.


    Original on parchment. On a thick cord of green silk thread hangs the seal of Duke Przemysł (seal
    XXVI).


    Library of the Princes Czartoryski. Diplomata. Rzyszczewski and Muczkowski, Codex diplomaticus Poloniae
    I, no. 77; from another original, which has at the end: Data per Iasconem notarium curie nostre anno
    Domini M.CC. nonagesimo primo in Gnezna, in die XI millium Virginum.


    In the name of the Lord, amen. Since the forgetfulness inborn in human memory leads into error the
    settlements of temporal acts that have not been firmly strengthened by the point of letters or the
    subscription of witnesses, we, Przemysł the Second, by the grace of God Duke of Greater Poland, wish
    it to be known to all the faithful of Christ, present as well as to come, that the venerable abbot
    Lord Gerhard of Ląd and his convent made an exchange with our beloved under-chamberlain Count Sędziwój
    for the good of their house, with our gracious favour and consent, giving him three estates, namely
    Głowiew, Sławsk and Chocicza, for the estate called Kopojno, which the same Sędziwój had held by inheritance,
    exchanged with us for his patrimony, namely Górczyn, free and exempt from every Polish right by whatever
    name it is called; the sons of the said Sędziwój, namely Janko and Marcin, to whom the hereditary
    right belonged, resigning the said estate before us and yielding up the hereditary right, and the
    said abbot with his brothers entering the said estate of Kopojno to possess it by inheritance. And
    we, desiring to increase the affection which we have always had for the house of Ląd, will that the
    said estate with its inhabitants, their own or free, shall be exempt and free, as it was before when
    it was held by the said Sędziwój: from every conveyance, from carting, from watch, from tribute, from
    the naraz, from the podworowe, from market and bridge tolls, from the building of castles or of any
    bridges, from receiving, guarding or escorting beaver-keepers (sic), for we have given the beavers
    to the lord abbot and his brothers to hunt for ever. Moreover from the neighbourhood which is called
    in the common tongue opole, from receiving the under-huntsman or huntsmen of any kind, from the guarding
    or payment of falcons, which is popularly called socol, from every exaction or levy which is called
    povolove, from carting and military expeditions, and from all the rights established in Poland by
    whatever names they are called. We have given the said brothers, through their own judge, free authority
    to carry out all judgements, such as of strife, striking, maiming of limbs, or even beheading, so
    that we may have the greater trust towards God at the dreadful judgement, reserving to no castellan
    or judge any right to summon or judge in that estate. And that this our deed, to the honour of God
    and of holy Mary ever Virgin, may obtain the strength of lasting firmness, we strengthen the present
    page with the protection of our seal. Witnesses of this are: Filip, archdeacon of Gniezno; Berwold,
    castellan of Kalisz; Abraham, treasurer of Gniezno. These things were done in the year of the Lord
    1291 at Gniezno, on the day of the Eleven Thousand Virgins.


    Lenda, Ląd. Glovevo, Głowiew. Slavsco, Sławsk. Chociczha, Chocicza. Copaino, Kopojno. Gorcino, Górczyn.'

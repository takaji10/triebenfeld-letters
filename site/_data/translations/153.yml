segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The procuring of the 2[uncertain: 5]000 Rthl
    causes me much distress, since Herr von Stein, who is now President of the Bank, has anew forbidden
    all discounting. The capital will be given either by the Invalids'' Fund or by the Potsdam Orphanage
    in the amount of 140000 Rthl, but to payment by instalments none of them will resolve; and before
    all the formalities have been cleared away, no fund will hand over the capital — I am therefore working
    upon it together with Amelang, merely to obtain the 25000 Rthl provisionally from somewhere, such
    that, where the 140000 d are given, they may be repaid again. Matters look altogether melancholy here
    – all commerce lies idle on account of the above ordinance, and the dear Widows'' Fund, together with
    the Pupillen-Collegium, is cruelly hard pressed on account of the threatened bankruptcies in South
    Prussia — these too will no longer venture anything. Moreover the King is very much after it, [as
    to] where all the millions have got to that were given to South Prussia, since, despite the great
    sums given thither, the greatest want of money nevertheless prevails, and it has the appearance as
    though all these monies, together with the proprietors of the estates, had emigrated to Russia. It
    is therefore to be the case that whosoever falls into arrears with the interest, or otherwise 12 Jan
    1805'

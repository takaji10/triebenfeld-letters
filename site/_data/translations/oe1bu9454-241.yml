- page: 2
  en: 'only the Russian [uncertain: Eignung] — yet so it must come about, for from where are we to take
    / as you have also rightly observed / our subsistence, if we are to press into Saxony again. Mr von
    Gneisenau today holds a review of over 15000 men of Landwehr near Oppendorff, and so tomorrow and
    the day after [illegible] an equal number. in [illegible]


    my gout torments me


    Nysa the 22nd of June


    1813


    von Triebenfeld'

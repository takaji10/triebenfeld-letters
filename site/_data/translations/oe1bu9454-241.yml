- page: 1
  en: '241 General Gneisenau I found already here at Nysa upon my arrival yesterday. I spoke with him
    very soon and handed him Your Serene Highness''s letter. He will reply, and as a true admirer of Your
    Serene Highness — most [illegible] you should only be quite easy, things should and would become better
    than Your Serene Highness now believed.


    For the rest, matters here have changed again — General Zastrow has been appointed in Prussia as General
    [uncertain: Gewerner]. General Gneisenau now commands the Sil[esian] Landwehr, which consists of 55000
    rt. He is moreover still Chief of the General Staff and Sil[esian] Military Governor.


    Lieutenant General von Köckritz has at one stroke brought von Zastrow so far round — this gentleman
    now speaks with much warmth of Your Serene Highness, and everything may be hoped for — Mr Hardenberg
    is with the R[ussian] Emperor in Bohemia, from which he returns in 5 days — A categorical declaration
    is being demanded, and a pretext might easily be found to act vigorously again — As regards the provisioning
    of the [uncertain: Armen] out of Poland, everyone holds to my plan — Mr [uncertain: Ewr] von Gneisenau
    said: I fear only'

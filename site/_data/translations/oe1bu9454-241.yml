- page: 2
  en: 'only the Russian appropriation [uncertain: Eignung] — yet it must come to that, for whence are
    we (as you too have rightly observed) to take our subsistence, if we are to be brought back to Saxony
    again. His Excellency von Gniez. is today holding a review of over 15000 men of militia at Oppendorff,
    and so tomorrow and the day after over an equal number in Fall and Schwartz


    my gout torments me


    von Triebenfeld


    Neisse, the 22nd of June


    1813'

segments:
- page: 1
  en: 'General Gneisenau I found already here in Neisse upon my arrival yesterday. I spoke with him very
    soon and delivered to him Your Serene Highness''s letter. He will reply, and as a true admirer of
    Your Serene Highness Most High Sen they should only be quite easy, it should and would become better
    become. than Your Serene Highness now believed. For the rest, matters here have altered again — General
    Zastrow has been appointed in Prussia as Governor-General. General Gneisenau now commands the Silesian
    Landwehr, which consists of 55000 men. He is besides this still Chief of the General Staff and Sch
    Military Governor. Gen. L. v. Koch has all at once brought the [uncertain: of this year] on so far
    — this gentleman now speaks with much warmth of Your Serene Highness and everything may be hoped for
    — Herr v. Hardenberg is with the R. Emperor in Bohemia from as the same returns in 5 days — A categorical
    declaration is demanded, and a pretext might easily be found to act actively again — As regards the
    provisioning of the poor out of Poland, everyone holds to my plan — H Your v. Gneis. said, I fear'
- page: 2
  en: 'only the Russian [uncertain: appropriation] — yet so it must come about, for whence are we (as
    you have also rightly remarked) to take our subsistence, if we are to bring [ourselves] back to Saxony
    again. Herr v. Gneisenau holds a review today of over 15000 men of Landwehr near [uncertain: Oppendorff],
    so tomorrow and the day after over an equal number in Fall and Schwartz my gout torments me


    v Triebenfeld


    Neisse, the 22nd of June 1813'

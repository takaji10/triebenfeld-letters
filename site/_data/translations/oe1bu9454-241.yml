- page: 1
  en: 'I found General Gneizenau here in Neisse upon my arrival yesterday. I spoke with him very soon
    after and handed over Your Serene Highness''s letter. He will reply, and as a true admirer of Your
    Serene Highness Most High Sen [uncertain: Sen] should only be quite at ease; it should and would become
    better than Your Serene Highness now believed.


    For the rest, matters here have changed again — General Zastrow has been appointed in Prussia as General
    Gewerner [uncertain: Gewerner]. General Gneizenau now commands the Silesian militia, which consists
    of 55000 men. He is besides this still Chief of the General Staff and Sch [uncertain: Sch] Military
    Governor.


    Lieutenant General von Koch has all at once brought this so far along — this gentleman now speaks
    with much warmth of Your Serene Highness, and everything may be hoped for — M Hard: is with the R.
    Emperor in Bohemia, from which the same returns in 5 days. A categorical declaration is demanded,
    and a pretext might easily be found to act actively again — As regards the provisioning of the poor
    out of Poland, everyone holds to my plan — His [uncertain: Ewr] von Gneiz. said, I fear'

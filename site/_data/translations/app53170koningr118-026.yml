  en: 'Done in Konin, on Saturday, the Eve of the Feast of the Immaculate Conception of the Most Blessed
    Virgin Mary, namely the 7th day of the month of December, in the Year of the Lord 1782.


    For the part of the Illustrious Prusimski — a Report of the Judicial Site Inspection of the Felled
    Pine Forest


    Having come in person to the present Office and Records of the Konin Municipal Court, the Honest Bartłomiej
    Szepczyński of Trąbczyn, General Royal Process Server, sound [of mind], acknowledged: that he, having
    with him two Nobles, namely the Honourables Adam Milewski and Jan Wilgiewicz, although absent here
    from the court at present, but present at the time at the location of the below-written matter — at
    the instance and official requisition of the Illustrious Magnificent Antoni of Kolno Prusimski, Starost
    of Niszczewice, Knight of the Order of Saint Stanislaus, Heir of the estates of Trąbczyn with appurtenances
    — on the 4th day of the present month and year, had descended with the above-mentioned Nobles into
    the pine forest belonging to the estate of Trąbczyn; and being there in such manner, stated that he
    had duly seen and counted:


    namely pines in the pine forest itself belonging to the estates of Trąbczyn, on the left side of the
    cut line, visible by the Tribunal Decree and the field [session], and marked by stakes driven into
    the ground — two hundred and twenty-one construction-grade [trees], cut down by the people of the
    estates of Łukomia, Łomowa, and other hereditary [estates] of the Right Honourable Pan Stanisław Chełmski,
    Treasurer of [uncertain: Wschowa], on the 28th day of November of the present year, during the Act
    of the Condescension of the two [sessions] called by the deponent himself — cut down; which timber
    was taken away from the aforementioned estates, except for seven [odsiemnych] logs and [uncertain:
    branches] lying in place.


    The same Process Server, with the above-mentioned Nobles, saw and counted the above-mentioned things
    on the day as above, and attested that the same were done by the order and mandate of the Illustrious
    Chełmski, Treasurer of Wschowa, through [the court''s] acts — of which he made this his report to
    the present Office, requesting that the same be received from him, which he obtained.'

- page: 4
  en: 'to learn of Your Serene Highness''s happy arrival at Breslau. With these sentiments I remain, until
    death, Your Most Serene Highness''s


    most humble, faithful and most obedient.


    Michaelis Berlin, the 6th October 1798'

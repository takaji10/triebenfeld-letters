status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! I have complied with Your Most Serene Highness''s
    gracious command and have been with the Privy [uncertain: Ewang] Councillor Schultz, whom I met the
    day before yesterday. He knew as yet nothing more particular of the matter than that he had read Your
    Serene Highness''s letter to Minister v. Voss. Upon the matter itself he expressed himself neither
    for nor against the same, and he said he did not yet know it. I therefore held it advisable not to
    expand further upon it, since it was the first time, beyond requesting him in general terms that,
    should he find obstacles, he should not decide at once, but hear me first, and'
- page: 2
  en: 'and to have information given him by me upon everything that might raise doubts in him. Upon my
    desire to be informed of everything that goes forward in the matter, he expressed himself thus: that
    I might have a power of attorney sent to me from Your Serene Highness, and lodge the same in the Registratur,
    whereupon everything should be delivered to me, if it issues from Your Serene Highness. It has been
    agreeable to me to be informed, by the Councillor of War v. Triebenfeld, whom I spoke with only today,
    that Mr. Schulze has not deceived me in this, that it should give out that it knows nothing, because
    — as Mr. v. Triebenfeld will have the grace to report more particularly to Your Serene Highness —
    the dispositions from the Cabinet only go off today or on account, to the Minister v. [uncertain:
    Rath], and the Lebritz therefore cannot receive the Royal order otherwise than as next Wednesday or
    Thursday. Since I convey to Your Honour nothing but truths, and shall never depart from them, I can
    render to Your Most Exalted Self only the most humble assur-'
- page: 3
  en: '-ance, that I shall not fail to contribute all that lies within my powers toward the [uncertain:
    putting-in-order]; also, by the power of attorney to be transmitted, I shall be placed in a position
    to reconnoitre more exactly. I would propose that the power of attorney be filled out to this effect:
    that I be empowered, before the Imperial and Most Laudable South Prussian Department, to press forward
    the proposed exchange of the estates conferred upon Your Most Serene Highness by His Most Princely
    Royal Majesty — against the lordship — and, for the acquisition of the — estates, to make proposals
    and to enter into negotiations. Furthermore, I would most humbly beg for the intelligence concerning
    the Grotowski matter, which Your Most Serene Highness most graciously promised me, and the receipt
    of the [uncertain: tailor]. I must do justice to Mr. v. Triebenfeld''s zeal for Your Honour''s interest.
    It will be most gratifying to me'
- page: 4
  en: 'to learn of Your Serene Highness''s happy arrival at Breslau. With these sentiments I [uncertain:
    remain, until death,] Your Most Serene Highness''s most humble, faithful and most obedient. Michaelis
    Berlin, the 6th October 1798'

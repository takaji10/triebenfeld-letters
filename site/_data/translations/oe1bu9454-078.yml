  en: '78


    Most Serene Prince,


    Most gracious Prince and Lord!


    I have complied with Your Most Serene Highness''s gracious command and have called upon the Privy
    Councillor of Finance Schulze, whom I met the day before yesterday. He knew nothing further of the
    matter as yet, save that he had read Your Serene Highness''s letter to Minister von Voss. Upon the
    matter itself he declared himself neither for nor against it, and said that he was not yet acquainted
    with it. I therefore held it advisable not to expand upon it further, this being the first occasion,
    beyond requesting him in general terms that, should he find impediments, he would not decide at once
    but hear me beforehand, and'
  names:

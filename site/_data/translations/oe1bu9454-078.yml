    en: '[uncertain: Lebritz]'
    kind: other
- page: 3
  en: '-surance that I shall not fail to contribute everything in my power towards [uncertain: putting
    the matter in order], and I shall also, by means of the power of attorney to be sent me, be put in
    a position to reconnoitre more exactly. I would propose that the power of attorney be drawn up to
    this effect,


    that I be empowered, with the Royal Highly Laudable South Prussian Department, to prosecute the proposed
    exchange of the estates conferred upon Your Most Serene Highness by His Royal Majesty — against the
    lordship — and to make proposals for the acquisition of the — estates, and to enter into negotiations.


    The reports upon the Grotowski affair most graciously promised me by Your Most Serene Highness, and
    the tailor''s receipt, I would most humbly beg for. I must do justice to Mr. von Triebenfeld''s zeal
    for Your Honour''s interest. It will be most gratifying to me'
  names:

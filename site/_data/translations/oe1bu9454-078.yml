segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    I have complied with Your Most Serene Highness''s gracious command and have been with the Privy [uncertain:
    Ewang] Councillor Schultz, whom I met the day before yesterday. He knew nothing more particular of
    the matter as yet than that he had read Your Serene Highness''s letter to the Minister von Voss. Upon
    the matter itself it expressed itself neither for nor against the same, and he said he did not yet
    know it. I therefore held it advisable not to go further into it, this being the first time, than
    that I requested him in general terms, should he find obstacles, not to decide at once, but to hear
    me beforehand, and'
  names:
  - de: Geh. Ewang Rath Schultz
    en: 'Privy [uncertain: Ewang] Councillor Schultz'
    kind: person
  - de: Minister v. Voss
    en: Minister von Voss
    kind: person
- page: 2
  en: 'and to allow himself to be given information by me upon everything that might raise doubts in him.
    Upon my desire to be informed of everything that goes forward in the matter, he expressed himself
    thus: that I might have a power of attorney sent me from Your Serene Highness, and deposit the same
    in the registry, whereupon everything should be delivered to me, when it issues from Your Serene Highness.


    It has been agreeable to me to have been informed by Mr. Councillor of War


    von Triebenfeld, whom I spoke with only today, that Mr. Schulze has not deceived me in this, that
    he pretended to know nothing, because — as Mr. von Triebenfeld will have the grace to report more
    particularly to Your Serene Highness — the dispositions from the Cabinet go off to the Minister von
    Rath only today or [illegible], and the [uncertain: Lebritz] therefore cannot receive the Royal order
    otherwise than as next Wednesday or Thursday. Since I bear to Your Honour nothing but truths, and
    shall never depart therefrom, I can only give to the same most high person the most humble as-'
  names:
  - de: dHl. Kr. Rath v. Triebenfeld
    en: Mr. Councillor of War von Triebenfeld
    kind: person
  - de: dH Schulze
    en: Mr. Schulze
    kind: person
  - de: Minister v. Rath
    en: Minister von Rath
    kind: person

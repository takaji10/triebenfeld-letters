- page: 3
  en: '-surance that I shall not fail to [uncertain: contribute to the bringing into order] of everything
    that lies within my powers; also I shall, by means of the power of attorney to be transmitted, be
    put in a position to reconnoitre the matter more exactly. I would propose that the power of attorney
    be filled out to this effect:


    "that I am empowered, at the Imperial and most laudable Department of South Prussia, to prosecute
    the proposed exchange of the estates granted to Your Most Serene Highness by His Princely Royal Majesty
    — against the lordship — and to make proposals for the acquisition of the — estates, and to enter
    into negotiations." — H.


    The reports concerning the Grolltowski matter which Your Most Serene Highness most graciously promised
    me, and the receipt of Schneides, I would most humbly beg for. I must do justice to the zeal of Mr
    von Triebenfeld for Your Honour''s interest. It will be very gratifying to me'

  - '78'
- page: 2
  en: 'and that he would allow himself to be furnished by me with information upon everything that might
    give him cause for hesitation. Upon my request to be informed of everything that should occur in the
    matter, he declared: I might have a power of attorney sent me by Your Serene Highness and deposit
    the same in the Registratus, whereupon everything, when it comes to Your Serene Highness, should be
    delivered to me.


    It has been agreeable to me to be informed by the Councillor of War von Triebenfeld, with whom I spoke
    only today, that Mr Schulze did not deceive me in this, that he pretends to know nothing of the matter,
    because — as Mr von Triebenfeld will have the grace to report to Your Serene Highness more particularly
    — the dispositions from the Cabinet go off to Minister von Voss only today or because of, and the
    said Schultz therefore cannot receive the Royal order otherwise than as next Wednesday or Thursday.
    Since I bear Your Honour nothing but truths, and shall never depart from them, I can give the same
    none but the most humble as-'

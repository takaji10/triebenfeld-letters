- page: 1
  en: 'Document no. 1253


    Dobiesław, judge of the lands of Gniezno and Kalisz, 13 November 1346, at Pyzdry; adjudges to the
    church of Gniezno the estates of Stropiszyn and Pępocin against the claims of Andrzej, heir of Trąbczyn,
    and his kin.


    Gniezno. Archive of the Metropolitan Chapter. Liber privilegiorum of the 15th century, fol. 93v.


    We, Dobiesław, judge of the lands of Gniezno and Kalisz, make known to all and acknowledge by these
    presents that at Pyzdry on the feast of St Brice, in the year of the Lord 1346, in the presence of
    Mikołaj, captain of Poland, Maćko of Poznań and Mikołaj of Kalisz, palatines, Tomisław of Poznań,
    Zbylut of Gniezno and Janusz of Kalisz, castellans, and others worthy of trust, on their counsel and
    command we adjudged to Lord Kiełcz the custodian and to the church of Gniezno the estates of Stropiszyn
    and Panpycze to be possessed for ever, absolving him and the church of Gniezno from the suit and claim
    of Andrzej, heir of Trąbczyn, and of all his kin, who, setting him up before us, entrusted to him,
    in his name and theirs, the power to go to law for those estates; having heard his pleadings and those
    of the opposing party on both sides, we imposed perpetual silence concerning that estate on him and
    all his kin, granting to the said Lord Kiełcz and the church of Gniezno these our present letters,
    strengthened with our seal, concerning this judgment. Given and done at Pyzdry on the feast of St
    Brice, in the year of the Lord 1346, in the presence of the witnesses named above.


    Troppessino, Stropiszyn. Panpycze, added in the margin: sive Kopydłowo, probably Pępocin; Kopydłowo
    lies 5 miles from the latter. Trampczino, Trąbczyn.'

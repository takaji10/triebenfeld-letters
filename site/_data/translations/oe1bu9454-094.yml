  en: '94


    Most Serene Prince,


    Most gracious Prince and Lord!


    From the letter of His Majesty the King going out by today''s post, Your Most Serene Highness will
    be pleased to perceive more fully how His Majesty is minded to have the true value of Your Serene
    Highness''s South Prussian estates, and that of Krotoszyn and Polajewo, more closely examined, in
    order then to be able duly to balance these possessions one against the other; and I can assuredly
    assure Your Serene Highness that, if no weighty obstacles stand in the way of the intended exchange,
    it will afford His Majesty the King pleasure to have complied with Your Serene Highness''s wish in
    this matter.


    For the gracious confidence which Your Most Serene Highness is pleased to show me by Your Serene Highness''s
    gracious letter of the 7th of this month, I offer Your Serene Highness [uncertain: my] most deeply
    obliged thanks; and although the matter itself does not pass through my hands, inasmuch as it does
    not fall within my'

- page: 2
  en: 'I shall nonetheless rejoice no less to see it brought to Your Most Serene Highness''s complete
    satisfaction, since the reverence I harbour for Your Highness will assuredly make me take the warmest
    part in it. Nothing in the world could make me happier hereafter than to be able to lay before Your
    Most Serene Highness proofs of the true deference with which I remain, until death, Your Most Serene
    Highness''s Berlin,


    the 18th of December


    1798.


    entirely most humble, faithful,


    most obedient


    Zartmo[uncertain]'

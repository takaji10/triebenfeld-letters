status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! From the letter of His Majesty the King, which
    goes out by today''s post, Your Most Serene Highness will graciously be pleased to gather in fuller
    detail how His Majesty wishes to have the true value of Your Highness''s South Prussian estates, and
    that of Krotoszyn and Polajewo, more closely investigated, in order thereafter to be able properly
    to balance these possessions against one another; and I can assuredly assure Your Highness that, if
    no weighty impediments stand in the way of the intended exchange, it will be a pleasure to His Majesty
    the King to have complied with Your Highness''s wish in the matter. For the gracious confidence which
    Your Most Serene Highness is pleased to show me by Your gracious letter of the 7th of this month,
    I render to Your Highness [uncertain: and] my most deeply obliged thanks; and although the affair
    itself does not pass through my hands, inasmuch as it does not fall within my department'
- page: 2
  en: 'falls [within my department], I shall nonetheless be no less glad to see it brought to Your Most
    Serene Highness''s complete satisfaction, inasmuch as the singular reverence which I cherish for Your
    Highness assuredly makes me take the warmest part therein. Nothing in the world could make me happier
    henceforth than to be able to lay before Your Most Serene Highness proofs of the true veneration with
    which I remain, until death, Your Most Serene Highness''s


    Berlin, the 18th of December 1798.


    wholly most humble and obedient, faithful and most obedient

    Zartmo[illegible]'

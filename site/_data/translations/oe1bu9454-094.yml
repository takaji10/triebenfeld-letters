- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    From the letter of His Majesty the King going out with today''s post, Your Most Serene Highness will
    be pleased to gather more fully how His Majesty wishes to have the true value of Your Highness''s
    South Prussian estates, and that of Krotoszyn and Polajewo, more closely examined, in order then to
    be able to balance these possessions properly one against the other; and I can assuredly assure Your
    Highness that, if no weighty impediments stand in the way of the intended exchange, it will be a pleasure
    to His Majesty the King to have complied with Your Highness''s wish in this matter.


    For the gracious confidence which Your Most Serene Highness has been pleased to show me by Your gracious
    letter of the 7th of this month, I render Your Highness my most deeply obliged thanks; and although
    the matter itself does not pass through my hands, inasmuch as it does not fall within my department,'

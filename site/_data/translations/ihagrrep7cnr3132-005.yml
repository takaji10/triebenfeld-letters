status: draft
segments:
- page: 1
  en: 'Copy


    Your Royal Majesty has most graciously been pleased to send us, for a report, the enclosed original
    representation of the former Starost von Prusimski and of Xaver von Jezierski, who left the country
    because of their part in the South Prussian insurrection and have now asked from Dresden for leave
    to return to their fatherland.


    The files required from the Government at Poznań having come in, we can now most humbly report the
    following.


    1., Anton von Prusimski was accused of having gone on 2 August 1794, before the outbreak of the South
    Prussian insurrection, from his estates near Kalisz to his Smiłowice estates in the district of Kuyavia,
    which now belongs to the department of the Government at Poznań; of having received daily visits there
    from the neighbouring nobility; and of the so-called Kuyavian insurrection having been brought to
    completion at his house on 21 Aug., and the act of confederation drafted and executed. He is also
    said to be among those South Prussian noblemen who met at Dresden in the winter of 1793/94 on account
    of the changes in the Polish state. All these accusations, however, rest for the most part only on
    a so-called Memoire raisonné, drawn up from the statements of some unnamed trusted Poles and officials,
    and have not been closely examined.


    Nor did the Government think them sufficient to order against him the criminal proceedings against
    absent offenders, as was done in respect of some chief insur'
- page: 2
  en: 'gents, but, at the instance of the fiscal, only instituted the confiscation proceedings, because
    he had not returned in accordance with the general ordinances issued.


    The fugitive was duly summoned in public; he did, from Italy, where his wife, who also died there,
    allegedly had to stay at the time to recover her health, hold out hope of his return and seek to avert
    the confiscation; but as he did not appear after all, the sentence of confiscation was drawn up, and
    after it had become final, his Trąbczyn estates were given to the Prince of Hohenlohe, his Pawłów
    estates to the present Major General von Sanitz, and his Smiłowice estates to Lieutenant General von
    Bischofswerder. Besides these he held no other property in the country.


    2., The second petitioner, Xaver von Jezierski, was a canon in Włocławek and parish priest at Neustadt.
    He was named, partly in the Memoire mentioned above, partly by persons who were named, as one of those
    who stayed most often with von Prusimski at Smiłowice before the outbreak of the Kuyavian insurrection
    and worked most actively to bring this insurrection about. He is said to have drafted the proclamations
    to the people, to have'
- page: 3
  en: 'raised men, and to have been a member of a security commission set up by the insurgents at the
    time.


    Against him too, who did not return from his flight, only the confiscation proceedings were instituted,
    and confiscation of his small property was decreed with final effect; it consisted only of the income
    of his benefices, taken into sequestration and since filled otherwise, of which he was also deprived
    by the sentence.


    Neither of the two petitioners has been declared to have forfeited his nobility, nor has any capital
    punishment otherwise been fixed or reserved against them.


    In proportion to their part in the insurrection, they have been punished, by the confiscation of their
    property, at which it must remain unalterably /: a point on which I, Count von Haugwitz, refrain from
    expressing an opinion, since it is not of my department :/, and by a 9 years'' banishment from their
    fatherland, more harshly than many others who returned and submitted to a moderate fine or a term
    in a fortress. Nor is their part of such a kind that it would mark them out as dangerous men before
    others who stayed in the country or returned to it later; and since their petition is directed only'
- page: 4
  en: 'at leave to return, we are most humbly of the opinion:


    that it might well be granted;


    which, however, we most devotedly leave entirely to Your Royal Majesty''s most high judgement.


    Berlin, 30 April 1803


    Goldbeck. Haugwitz


    To His Royal Majesty.'

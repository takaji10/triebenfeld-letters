- page: 1
  en: 'Between the Most Serene Prince and Lord, Lord Friedrich Ludewig, Reigning Prince of Hohenlohe-Ingelfingen,
    Royal General of Infantry and Governor at Breslau, and the Royal bank director at Frankfurt an der
    Oder, Mr. George Conrad Leixner, the following purchase contract has been concluded:


    § 1. His Most Serene Highness sells to the bank director Mr. Leixner the estates of Kollno and Kaemen
    or Kamionna, situated in South Prussia in the Department of Posen and in the Meseritz district thereof,
    acquired in full ownership by virtue of the deed of donation of His Majesty the late King Friedrich
    Wilhelm II of 9 August 1796, with all appurtenances, mills, residents, fields, forests, lakes, waters,
    services, hunting, propination rights, and in general with all rights and privileges, burdens and
    encumbrances, as his true property, for a purchase price of 142,000 Rthl, one hundred and forty-two
    thousand Reichsthaler, according to the coinage standard of 1764.


    § 2. The purchase money of the 142000 Rthl has already been paid in full.


    His Most Serene Highness gives receipt therefor, and acknowledges in general that He has no further
    claim upon the purchaser arising out of this transaction of sale.'

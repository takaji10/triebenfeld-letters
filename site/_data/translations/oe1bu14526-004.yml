- page: 6
  en: 'and likewise to have those delivered to the purchaser which are still at present required in His
    Serene Highness''s accounting suit against von Broniewsky, after the conclusion of that suit. It shall,
    however, as goes without saying, also be free to the purchaser to have these papers not yet delivered
    over inspected as often as he finds it necessary.


    § 10. The contracting parties bind themselves to hold fast to this contract in all its points and
    clauses, renounce all objections against it, particularly the objection of injury beyond the half
    and whatever others they might bear the name of, and have executed this instrument by their own-hand
    signatures of their names and the seals appended.


    Breslau, the 16th of


    January 1805.


    Read by myself and approved. Friedrich Ludwig, Prince of Hohenlohe, as having read and approved this
    instrument


    Meyer Bernhard, in the name of and subject to the approval of the bank director Mr. Leixner. That
    this purchase contract between the Most Serene Prince and Lord, Lord Friedrich Ludwig, Reigning Prince
    of Hohenlohe'

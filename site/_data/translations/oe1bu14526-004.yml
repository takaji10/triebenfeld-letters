- page: 3
  en: 'in Pausch und Bogen.


    However, His Most Serene Highness gives warranty for the following:


    a., that the surface content of arable, meadows, heaths and lakes set out in the survey registers,
    which together with the maps have been delivered over to the purchaser, is actually present. His Most
    Serene Highness assures herewith that no claim by anyone whatsoever to the parcels set out in these
    survey registers has hitherto been known to Him. The obligation of His Most Serene Highness to answer
    for the correctness of the survey register in the manner above is limited to three years.


    b., that no more is charged upon these estates in public dues than yearly


    for Kaemen


    153 Rthl 22 g. 8 pf.


    for Kolno


    125 Rthl 21 g. 2 pf. and in ecclesiastical


    dues for


    Kaemen


    16 Rthl 16 pf.


    § 5. The physical delivery of possession of the estates to the purchaser has already taken place in
    the month of September 1804, and the judicial proceedings recorded thereupon shall stand as they are.


    With regard to the warranty, the following principles have been'

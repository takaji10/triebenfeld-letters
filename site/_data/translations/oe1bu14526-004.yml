- page: 5
  en: 'and the purchaser herewith expressly renounces all claims in that regard, both against His Most
    Serene Highness and against the Councillor of War and Forests von Triebenfeld. It is likewise solely
    the purchaser''s own affair to procure the cancellation of this encumbrance in the land and mortgage
    books. The costs of cancellation, however, shall be borne one half by His Most Serene Highness and
    one half by the purchaser.


    § 7. The costs of the drawing-up and confirmation of this sale, of the physical and civil delivery
    of possession, and in general all costs of the sale by whatever name, shall likewise be borne in halves
    by both contracting parties.


    § 8. Passive servitudes are not known to His Serene Highness the seller. On the other hand, there
    belongs to these estates a right of timber-taking in the Krobilaw forests. In a possessory suit against
    von Kwilecki this was adjudged to His Serene Highness, but in petitorio it was denied Him in the first
    instance.


    The purchaser assumes this rem litigiosam without demanding any warranty from His Serene Highness
    the seller.


    § 9. His Serene Highness the seller promises faithfully to deliver over to the purchaser all documents
    and files belonging to the estates, so far as it has not yet been done,'

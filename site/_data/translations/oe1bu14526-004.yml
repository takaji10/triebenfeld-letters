- page: 4
  en: 'adopted between the contracting parties.


    a., that the usufruct of the estates is due to the purchaser from Midsummer 1804, from which time
    the purchaser also has to bear the burdens.


    Any older arrears are to be answered for by His Most Serene Highness.


    His Most Serene Highness likewise bears the justiciary''s salary up to Michaelmas of last year.


    b., that the estates shall be handed over to the purchaser as they stood and lay on the 15th of June
    of last year.


    c., that, however, the purchaser may demand only that appurtenant stock, in field, cattle and farm
    inventory, which von Broniewsky received at his being placed in possession in the year 1786, according
    to the instrument handed over to the purchaser in the German language, and which he was obliged to
    render back.


    § 6. Besides the church capitals noted in § 3, there stands upon the estates a mortgage capital of
    100,000 Rthl, one hundred thousand Reichsthaler, entered by virtue of a bond of indebtedness of His
    Most Serene Highness of 1 June 1804 in favour of the Councillor of War and Forests von Triebenfeld,
    who has ceded this mortgage to the purchaser. This debt, however, has already been fully settled,'

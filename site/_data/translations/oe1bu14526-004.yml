status: draft
segments:
- page: 1
  en: 'Between the Most Serene Prince and Lord, Lord Friedrich Ludewig, Reigning Prince [Fürster] of Hohenlohe
    Ingelfingen, Royal General of Infantry and Governor at Breslau, and the Royal Banco-Director at Frankfurth
    an der Oder, Herr George Conrad Leixner, the following contract of sale has been concluded:


    §. 1. His Most Serene Highness sells to Herr Banco Director Leixner the estates Kollno and Kaemen
    or Kamionna, situate in South Prussia in the Pösen Department and its Me sevitz district, acquired
    in full property by virtue of the deed of donation of His Majesty the late King Friedrich Wilhelm
    II of the 9th of August 1796, together with all appurtenances, mills, inhabitants, fields, woodlands,
    lakes, waters, services, hunting, propination rights, and generally with all rights and prerogatives,
    burdens and encumbrances, as his true property, for a purchase price of 142,000 rthl., one hundred
    and forty-two thousand Reichsthaler, according to the coinage standard of 1764.


    §. 2. The purchase money of the 142000 rthl has already been fully paid.


    His Most Serene Highness gives receipt therefor, and acknowledges generally that from this transaction
    of sale He has no further demand against the purchaser.'
- page: 2
  en: 'It is noted here historically that the payment of the purchase moneys took place in the following
    manner:


    A. 53139 Rthl 13 g 8/5 d. the purchaser has paid to the former Polish Rittmeister von Broniewsky,
    who as an immitted creditor was in natural possession of the estates, as the sum adjudged to him at
    law, upon the instruction [Anweisung] of His Most Serene Highness.


    b, 88860 rttl 10 g. 3 1/5 d. have been paid in cash by the purchaser to His Most Serene Highness Himself
    and upon His most high instructions [Anweisungen].


    i. e. 142,000 Rthl


    §. 3. Besides the purchase price the purchaser assumes the following items entered in the mortgage
    books upon Kollno and Kaemen:


    a., a capital of 100 Floren, one hundred Polish Floren, for the church at Kaemen, the interest whereon
    is fixed at four Polish Mark yearly.


    b., for the same church a capital of


    250. rthl., two hundred and fifty Reichsthaler, or 1500, fifteen hundred Polish Floren, which bear
    interest yearly at 3 1/2, three and one half per cent. The interest of these two items the purchaser
    assumes from Midsummer [Johannis] 1804.


    §. 4. The present sale is made without valuation,'
- page: 3
  en: 'in Pausch und Bogen.


    His Most Serene Highness however gives warranty for this:


    a., that the surface content of arable, meadows, heaths and lakes set out in the survey registers,
    which together with the maps have been extradited to the purchaser, is really present. His Most Serene
    Highness herewith assures that to Him no claim by anyone whatsoever against the parcels of ground
    set out in these survey registers has hitherto been known. The obligation of His Most Serene Highness
    to answer for the correctness of the survey register in the above manner is limited to three years.


    b., that in public dues no more is charged upon these estates than yearly


    for Kaemen.


    153 rt. 22 g. 8 pf.


    for Kolno


    125. rt. 21. g. 2. pf. and in ecclesiastical


    dues for


    Kaemen


    16 rt. 16 pf.


    §. 5. The natural delivery of the estates to the purchaser has already taken place in the month of
    September 1804, and the judicial proceedings taken down thereupon shall stand as they are.


    With a view to the warranty the following principles have been'
- page: 4
  en: 'adopted between the contracting gentlemen:


    a., that the usufruct of the estates from Midsummer [Johannis] 1804 is due to the purchaser, from
    which time the purchaser has also to bear the burdens.


    Any older arrears are to be answered for by His Most Serene Highness.


    His Most Serene Highness also bears the salary of the Justitiariat up to Michaelmas of last year.


    b., that the estates shall be delivered to the purchaser as they stood and lay on the 15th of June
    of last year.


    c., that the purchaser may however demand only such stock, in field cattle and farming inventory,
    as von Broniewsky received upon his immission in the year 1786, according to the instrument handed
    over to the purchaser in the German language, and was bound to render back.


    §. 6. Besides the church capitals noted in §. 2., there stands entered upon the estates a mortgage
    capital of 100,000 rthl., one hundred thousand Reichsthaler, arising from a bond of indebtedness of
    His Most Serene Highness of the 1st of June 1804 in favour of the Councillor of War and Forests von
    Triebenfeld, who has ceded this mortgage to the purchaser. This debt, however, has already been fully
    discharged,'
- page: 5
  en: 'and the purchaser herewith expressly renounces all claims on that account, both against His Most
    Serene Highness and against the Councillor of War and Forests von Triebenfeld. It is likewise solely
    the affair of the purchaser to procure the cancellation of this nexus in the land and mortgage books.
    The costs of cancellation, however, shall be borne one half by His Most Serene Highness and one half
    by the purchaser.


    §. 7. The costs of the drawing up and confirmation of this sale, of the natural and civil tradition,
    and generally all costs of the sale by whatever name, shall likewise be borne by both contracting
    gentlemen in halves.


    §. 8. Passive servitudes are not known to the vendor''s Serene Highness. On the other hand, there
    belongs to these estates a right of timber in the Krobilaw woods. In a possessory suit against von
    Kwilecki this was adjudged to His Serene Highness, but in petitorio it was disallowed in the first
    instance.


    The purchaser assumes this rem litigiosam without demanding any warranty from the vendor''s Serene
    Highness.


    §. 9. All documents and files belonging to the estates the purchaser''s Serene Highness promises,
    so far as it has not yet been done,'
- page: 6
  en: 'faithfully to make over to the purchaser; likewise also to have those delivered to the purchaser
    which are still for the time being required in the accounting suit of His Serene Highness against
    von Broniewsky, after the conclusion of that suit. Yet it remains free to the purchaser, as goes without
    saying, to have those papers not yet extradited inspected as often as he finds it necessary.


    §. 10. The contracting gentlemen bind themselves to hold fast to this contract in all points and clauses,
    renounce all objections thereto, especially the objection of laesio enormis [Verlegung über die Hälfte]
    and whatever others they might be called, and have executed this instrument by their own hand-written
    signatures and appended seals.


    Breslau, the 16th of January 1805.


    Read and approved by myself. Friedrich Ludwig Prince of Hohenlohe, as having read and approved this
    instrument.


    Meyer Bernhard, in the name and subject to the approval of Herr Banco Director Leixner.


    That this contract of sale between the Most Serene Prince and Lord, Lord Friedrich Ludwig, Reigning
    Prince of Hohenlohe'
- page: 7
  en: 'Ingelfingen, Royal General of Infantry and Governor at Breslau etc., who alone is personally well
    known to the undersigned notary and witnesses, and the banker at Franckfürth an der Oder, Herr Meyer
    Bernhard, likewise personally well known to us, in the name and subject to the ratihabition of the
    Royal Banco Director Herr George Conrad Leixner, was in the foregoing manner and with our attendance
    negotiated and concluded, and that this instrument, after it had been read through and approval declared,
    was executed by their own hand-written signatures and appended seals, is herewith attested upon the
    ground of the protocol taken down thereupon.


    Breslau, the 16th of January 1805. Carl Gottlob [uncertain: Pl...ler] Royal Councillor of the Justice
    Commission and Notarius publicus in the Breslau Department. Johann Georg Strebel


    as witness.


    Johann Carl Stude


    as witness.


    The foregoing contract of sale I have read myself, and have found it drawn up in accordance with my
    intention. Franckfurth an der Oder, the 25th of January 1805.


    George Conrad Leixner


    That the personally to me


    known, of disposing'
- page: 8
  en: 'capable Royal Banco Rendant Herr Georg Conrad Leixner has here, after having himself read it through
    and approved it, signed in my presence and sealed with his signet the fore- and overleaf contract
    of sale, dated Breslau the 16th of January 1805, by the content whereof His Most Serene Highness the
    reigning Prince Lord Friedrich Ludwig zu Hohenlöhe Ingelfingen etc. has sold to Herr v. Leixner the
    estates Kollno and Kaemen, situate in South Prussia, Posen Department, acquired by virtue of the deed
    of gift of His Majesty the late King Friedrich Wilhelm II of the 9th of August 1796, for the sum of
    142,000 rt., say one hundred and forty-two thousand — this is attested, upon the ground of the protocol
    held this day in that behalf, in due form under the impress of the seal of the Justice Office of Francfort
    1/2 and my own, the Justice Officer''s, signature.


    So done at Frankfurt an der Oder on the twenty-fifth of January one thousand eight hundred and five.
    Dr. Ernst Gottlob Born.


    Royal Justice Officer and


    University Syndic, also


    Assessor of the Faculty of Jurists


    at Frankfurt pp.'

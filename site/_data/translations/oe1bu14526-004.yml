- page: 8
  en: 'Royal bank cashier Mr. Georg Conrad Leixner did here, after having read it through himself and
    approved it, sign in my presence and seal with his signet the fore-going and overleaf purchase contract
    dated Breslau the 16th of January 1805, by the content whereof His Most Serene Highness the reigning
    Prince Lord Friedrich Ludwig of Hohenlöhe-Ingelfingen etc. has sold to Mr. von Leixner the estates
    of Kollno and Kaemen, situated in South Prussia, Department of Posen, acquired by virtue of the deed
    of gift of His Majesty the late King Friedrich Wilhelm II


    of 9 August 1796, for the sum of 142,000 Rthl, that is, one hundred and forty-two thousand: the same
    is, on the basis of the protocol held this day for that purpose, attested by these presents under
    the impress of the seal of the Judicial Office of Frankfurt an der Oder and my own, the judicial officer''s,


    signature.


    So done at Frankfurt an der Oder on the twenty-fifth of January one thousand eight hundred and five.
    Dr. Ernst Gottlob Born.


    Royal judicial officer and


    university syndic, also


    assessor of the Faculty of Jurists


    at Frankfurt pp.'

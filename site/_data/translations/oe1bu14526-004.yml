- page: 2
  en: 'It is noted here as a matter of record that the payment of the purchase moneys was effected in
    the following manner:


    A. 53139 Rthl 13 g 8/5 d the purchaser has paid, upon the instruction of His Most Serene Highness,
    to the former Polish cavalry captain von Broniewsky, who, as a creditor placed in possession, was
    in actual physical possession of the estates, as the sum legally adjudged to him.


    b, 88860 Rthl 10 g. 3 1/5 d have been paid in cash by the purchaser to His Most Serene Highness Himself
    and upon His most high instructions.


    i. e. 142,000 Rthl


    § 3. Besides the purchase price, the purchaser assumes the following items entered in the mortgage
    books upon Kollno and Kaemen:


    a., a capital of 100 florins, one hundred Polish florins, for the church at Kaemen, the interest whereon
    is fixed at four Polish marks yearly.


    b., for that same church a capital of


    250 Rthl, two hundred and fifty Reichsthaler, or 1500, fifteen hundred Polish florins, which bear
    interest at 3 1/2, three and one half per cent yearly. The interest on these two items the purchaser
    assumes from Midsummer 1804.


    § 4. The present sale is made without valuation,'

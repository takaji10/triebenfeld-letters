status: draft
segments:
- page: 1
  en: 'Between the Most Serene Prince and Lord, Lord Friedrich Ludewig, Reigning Fürst zu Hohenlohe Ingelfingen,
    Royal General of Infantry and Governor at Breslau, and the Royal Banco-Director at Frankfurth an der
    Oder, Herr George Conrad Leixner, the following contract of sale has been concluded:


    §. 1. His Most Serene Highness sells to Herr Banco Director Leixner the estates Kollno and Kaemen
    or Kamionna, situated in South Prussia in the Posen Department and in the Meseritz district thereof,
    acquired in full ownership by virtue of the deed of donation of His Majesty the late King Friedrich
    Wilhelm II of the 9th of August 1796, with all appurtenances, mills, inhabitants, fields, woodlands,
    lakes, waters, services, hunting, propination rights, and generally with all rights and prerogatives,
    burdens and encumbrances, as his true property, for a purchase price of 142,000 rthl., one hundred
    and forty-two thousand Reichsthaler, according to the coinage standard of 1764.


    §. 2. The purchase money of the 142000 rthl has already been paid in full.


    His Most Serene Highness gives receipt therefor, and acknowledges generally that He has no further
    claim upon the Herr purchaser arising from this transaction of sale.'
- page: 2
  en: 'It is noted here historically that the payment of the purchase moneys took place in the following
    manner:


    A. 53139 Rthl 13 g 8/5 d. Herr purchaser has paid to the former Polish Rittmeister von Broniewsky,
    who as a creditor put in possession found himself in the actual (natural) possession of the estates,
    as the sum legally awarded to him, upon instruction of His Most Serene Highness.


    b, 88860 rttl 10 g. 3 1/5 d. have been paid in cash by the Herr purchaser to His Most Serene Highness
    Himself and upon His Most High instructions.


    i. e. 142,000 Rthl


    §. 3. Besides the purchase price the Herr purchaser assumes the following items entered in the mortgage
    books upon Kollno and Kaemen:


    a., a capital of 100 Floren, one hundred Polish Floren, for the church at Kaemen, whereof the interest
    is fixed annually at four Polish Marks.


    b., for the same church a capital of


    250. rthl., two hundred and fifty Reichsthaler, or 1500., fifteen hundred Polish Floren, which bear
    interest at 3 1/2, three and one half per cent annually. The interest of these two items the Herr
    purchaser assumes from Johannis 1804.


    §. 4. The present sale is made without valuation,'
- page: 3
  en: 'in Pausch und Bogen.


    However, His Most Serene Highness gives warranty for this:


    a., that the surface content of arable, meadows, heaths and lakes set out in the survey registers,
    which together with the maps have been extradited to the Herr purchaser, is actually present. His
    Most Serene Highness herewith assures that no claim by anyone whatsoever to the parcels set out in
    these survey registers has hitherto been known to Him. The obligation of His Most Serene Highness
    to warrant the correctness of the survey register in the above manner is limited to three years.


    b., that no more in public dues than annually


    for Kaemen


    153 rt. 22 g. 8 pf.


    for Kolno


    125. rt. 21. g. 2. pf. and in ecclesiastical


    dues for


    Kaemen


    16 rt. 16 pf.


    lie upon these estates.


    §. 5. The actual (natural) delivery of the estates to the Herr purchaser has already taken place in
    the month of September 1804, and the judicial proceedings taken down thereon shall stand as they are.


    With regard to the warranty the following principles have been'
- page: 4
  en: 'adopted between the Herren contracting parties:


    a., that the usufructs of the estates are due to the Herr purchaser from Johannis 1804, from which
    time the Herr purchaser also has to bear the burdens. Any older arrears are to be answered for by
    His Most Serene Highness. His Most Serene Highness also bears the Justitiariat salary up to Michaelis
    of last year.


    b., that the estates shall be handed over to the Herr purchaser as they stood and lay on the 15th
    of June of last year.


    c., that however the Herr purchaser may demand only that appurtenant stock, in field, cattle and husbandry
    inventory, which von Broniewsky received at his immission in the year 1786, according to the instrument
    delivered to the Herr purchaser in the German language, and which he was obliged to render back.


    §. 6. Besides the church capitals noted in §. 3, there stands entered upon the estates a mortgage
    capital of 100,000. rthl., one hundred thousand Reichsthaler, arising from a bond of indebtedness
    of His Most Serene Highness of the 1st of June 1804 in favour of the Herr Councillor of War and Forests
    von Triebenfeld, who has ceded this mortgage to the Herr purchaser. This debt, however, has already
    been fully discharged,'
- page: 5
  en: 'and the Herr purchaser hereby expressly renounces all claims on that account, both against His
    Most Serene Highness and against the Herr Councillor of War and Forests von Triebenfeld. It is likewise
    solely the business of the Herr purchaser to effect the cancellation of this nexus in the land and
    mortgage books. The costs of cancellation, however, shall be borne half by His Most Serene Highness
    and half by the Herr purchaser.


    §. 7. The costs of the drawing up and confirmation of this sale, of the natural and civil tradition,
    and generally all costs of the sale by whatever name, shall likewise be borne in halves by both Herren
    contracting parties.


    §. 8. Passive servitudes are not known to the Serene Highness of the Herr seller. On the other hand
    a right of timber in the Krobilawer woods belongs to these estates. In a possessory suit against von
    Kwilecki this was awarded to His Serene Highness, but in petitorio it was denied at first instance.


    The Herr purchaser assumes this rem litigiosam without demanding any warranty from the Serene Highness
    of the Herr seller.


    §. 9. All documents and files belonging to the estates the Serene Highness of the Herr purchaser promises,
    so far as it has not yet been done,'
- page: 6
  en: 'faithfully to deliver over to the Herr purchaser, and likewise to have those handed over to the
    Herr purchaser, after the conclusion of that suit, which are still for the time being required in
    the accounting suit of His Serene Highness against von Broniewsky. However, it is also free to the
    Herr purchaser, as goes without saying, to have these papers not yet extradited inspected as often
    as he finds it necessary.


    §. 10. The Herren contracting parties bind themselves to the maintenance of this contract in all points
    and clauses, renounce all objections against it, in particular the objection of injury beyond the
    half [laesio enormis] and whatever else they might be called, and have executed this instrument by
    their own-hand signatures of name and appended seals.


    Breslau, the 16th of January 1805.


    Read by myself and approved. Friedrich Ludwig Fürst zu Hohenlohe, as have read and approved this instrument.


    Meyer Bernhard, in the name and subject to the approval of Herr Banco Director Leixner.


    That this contract of sale between the Most Serene Prince and Lord, Lord Friedrich Ludwig, Reigning
    Fürst zu Hohenlohe'
- page: 7
  en: 'Ingelfingen, Royal General of Infantry and Governor at Breslau etc., who is personally well known
    to us, the undersigned Notary and witnesses, and the banker at Franckfürth an der Oder, Herr Meyer
    Bernhard, likewise personally well known to us, in the name and subject to the ratihabition of the
    Royal Banco Director Herr George Conrad Leixner, was agreed and concluded in the foregoing manner
    and with our participation, and that this instrument, after it had been read through and approval
    declared, was executed by their own-hand signatures of name and appended seals, is hereby attested
    on the ground of the protocol taken down thereon.


    Breslau, the 16th of January 1805. Carl Gottlob [uncertain: Pl...ler], Royal Councillor of the Judicial
    Commission and Notarius publicus in the Breslau Department. Johann Georg Strebel, as witness. Johann
    Carl Stude, as witness.


    The foregoing contract of sale I have read myself, and have found it drawn up in accordance with my
    intention. Franckfurth an der Oder, the 25th of January 1805.


    George Conrad Leixner


    That the personally to me known, [text lost] of disposing'
- page: 8
  en: '-capable Royal Banco Rendant Herr Georg Conrad Leixner has here, after reading it through himself
    and approving it, signed in my presence and sealed with his signet the fore- and overleaf contract
    of sale, dated Breslau the 16th of January 1805, by the content whereof His Most Serene Highness the
    Reigning Fürst Herr Friedrich Ludwig zu Hohenlöhe Ingelfingen etc. has sold to Herr v. Leixner the
    estates Kollno and Kaemen, situated in South Prussia, Posen Department, acquired by the deed of gift
    of His Majesty the late King Friedrich Wilhelm II of the 9th of August 1796, for the sum of 142,000
    rt., say one hundred and forty-two thousand — the same is, on the ground of the protocol held this
    day for that purpose, attested by these presents under the impression of the seal of the Justiz-Amt
    Francfort a/O and my own, the judicial officer''s, signature.


    So done at Frankfurt an der Oder on the twenty-fifth of January One Thousand Eight Hundred and Five.
    Dr. Ernst Gottlob Born, Royal judicial officer and University Syndic, also Assessor of the Faculty
    of Jurists at Frankfurt pp.'

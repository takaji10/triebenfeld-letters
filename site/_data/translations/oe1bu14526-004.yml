- page: 7
  en: 'Ingelfingen, Royal General of Infantry and Governor at Breslau etc., who is personally well known
    to us, the undersigned notary and witnesses, and the banker at Frankfurt an der Oder, Mr. Meyer Bernhard,
    likewise personally well known to us, in the name of and subject to the ratification of the Royal
    bank director Mr. George Conrad Leixner, was agreed and concluded in the foregoing manner and with
    our participation, and that this instrument, after its having been read through and approval having
    been declared, was executed by their own-hand signatures of their names and the seals appended, is
    hereby attested on the basis of the protocol taken up in that regard.


    Breslau, the 16th of January 1805. Carl Gottlob [uncertain: Pl...ler], Royal Councillor of the Judicial
    Commission and notary public in the Department of Breslau. Johann Georg Strebel


    as witness.


    Johann Carl Stude


    as witness.


    The foregoing purchase contract I have read myself, and have found it drawn up in accordance with
    my intention. Frankfurt an der Oder, the 25th of January 1805.


    George Conrad Leixner



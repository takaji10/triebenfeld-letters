- page: 1
  en: 'Berlin, 20 April 1816 ad no: c. 2,278. To His Serene Highness the Prince of Hohenlohe at


    Sławięcice.


    the 30th, to the post.


    Most Serene Prince. In pursuance of my most devoted letter of 6 June of last year, I have the honour
    to acquaint Your Serene Highness, in most devoted [illegible], that under today''s date I have informed
    the Royal envoy at St Petersburg, Major General von Schöler, of Your Serene Highness''s request for
    compensation for the Trąbczyn estates in Poland formerly possessed by Your Serene Highness, and have
    charged him to bring the same to the knowledge of His Majesty the Emperor of Russia and to support
    [uncertain: Your] [illegible] application to the best of his ability.


    In leaving it most devotedly [uncertain: wholly] to Your Serene Highness to pursue your affair henceforth
    directly at St Petersburg, and wishing you the most favourable success therein, I take this opportunity
    with pleasure to [text continues, garbled] you a'

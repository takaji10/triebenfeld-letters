status: draft
segments:
- page: 1
  en: 'Most gracious Prince and Lord! Several weeks ago, when I was on the point of travelling to Schlawenschitz
    with Herr D. Bræckl., word was sent [uncertain: we] to Blizanow that an exorbitant delivery of grain
    [text lost: "zum" stands without a noun] and straw had been announced upon the Zagorow estates under
    dreadful threats. I [uncertain: as/how] against this at the Ober-Prefecture at Kalisch received a
    refusal in answer; I begged that execution should be laid upon the peasants etc. and that a portion
    of the arrears of interest be brought in, so as to pay for the delivery as well as the dues; this
    was again refused, with the observation that the inhabitants must be spared, since they likewise had
    much to deliver, much team-service (Vorspann) to render, and must feed the foreign troops passing
    through. Scarcely had I received this resolution when I received by express the news that the estates
    had again been taken under sequestration. I hastened here at once to rescue the estates from the claws
    of the sequestrator, for the fellow would have reckoned ten times as much again for the victualling
    of the troops - here many a day 30, 40 and more officers, not counting their men, must be fed gratis
    by the lordship - and would have carried off no delivery at all. The Siedern sub-prefect had 2000
    Rthl lying by, which he [uncertain: one] through'
- page: 2
  en: 'wished to bring with him to Schlawenschitz. I begged him therewith to settle the deliveries and
    to hand over the receipts for them as rent, so that we might only get the sequestration off our necks
    and save the estates; the noble Brzechsta was at once ready to do so. The sequestrator was recalled
    some days since and, on account of various proceedings, has been placed under observation. But I had
    so dreadfully vexed myself over all these adverse events that I fell into a bilious fever; lying wretched
    with this, I was seized fourteen days ago with the worst podagra in both feet, and now for many weeks
    I have lain like a [uncertain: Erquilett] under the most raging pains. Daily since [uncertain: Mahn]
    there is quartering here; often there are 20 officers with their servants to be fed - the day before
    yesterday, poorly enough, 62 persons to be victualled. The people are coarse; if one does not give,
    they take everything away by force. The subjects have run off, because they themselves have nothing;
    the houses stand empty, and if the proprietor will not expose himself to the most frightful maltreatment,
    and let his cattle, horses and sheep be taken from him, then he must himself provide richly. Some
    noblemen have been murdered, others regulated with a hundred [illegible] cudgel-blows, one [uncertain:
    Vod] concealed [uncertain: on the spot] beaten dead'
- page: 3
  en: 'God knows what will come of it and how long this dreadful plague will yet last. - Here all would
    have been lost, had not the honest Brzechsta helped. I lie wretched, have not a Groschen of money,
    nowhere to take any from; the subjects even on my own estates have fled and are [uncertain: sipping/creeping]
    about in the woods, living on herbs and roots. No revenue can be had, since they take everything -
    drink and horses - away from nobleman and peasant alike; [uncertain: bin] and brandy is not sold,
    no one has any longer a Groschen to drink away, and what can be brewed and distilled scarcely suffices
    for the troops. In short, the distress has reached its highest pitch. Until the first of June this
    scourge of the land is to endure - then I shall treat with the sub-prefect. Nor can anything be given
    until then, since all the courts of justice are at rest. The Werbizer peasants have gone to Warsaw
    to the Court of Cassation; I must await the decree. Likewise I am awaiting the decision concerning
    Olleinue. Once this is decided, [uncertain: Sorrechsta] receives his money against Johann, which is
    to be paid out to him with 10000 Rthl, and then I shall come at Johanni with him to Your Serene Highness'
- page: 4
  en: 'we shall bring what ready money is possible with us; concerning the [uncertain: c] matter Your
    Serene Highness will learn nothing further. More [uncertain: herinaden] I am loath [uncertain: to
    write] - the distress is boundless. I suffer the greatest of it with my children. I have had to employ
    every means to save the estates for myself, for they would have been lost for good had the worthy
    sequestrator kept his hold in them. As soon as this [uncertain: house] plague of the land ceases and
    I am restored to health I shall [uncertain: act], and I hope to God that, however frightful everything
    looks, I shall nevertheless preserve all and remove the distress. It is in the deepest reverence that
    I, Respective, remain, until death, Your Serene Highness''s - Honrichs will probably be arrested one
    of these days. He was patented, as far as over the estates here - but has embezzled dues and committed
    other frauds. Your Serene [text lost] will forgive my scrawl; I have had to spend some 4 hours over
    it. Kopoyno, the 22nd of May 1812, most humble and obedient servant v Triebenfeld'

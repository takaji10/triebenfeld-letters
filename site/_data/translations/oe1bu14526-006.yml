- page: 2
  en: '1. the Councillor of War and Forests von Triebenfeld, as general attorney of His Serene Highness
    the reigning Prince of Hohenlohe-Ingefingen, sole hereditary lord and lord of the court, legitimated
    by the [uncertain: attached] power of attorney, of the one part, and


    2. the farmer Blazy Kukulski from the princely estate of Osniy, of the other part. The appearing parties
    are precisely known to the undersigned justiciary, and their capacity to perform judicial acts is
    subject to no doubt. They declare, freely and after due deliberation, the following hereditary lease
    contract concluded between them, irrevocable'

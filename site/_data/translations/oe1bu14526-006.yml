- page: 3
  en: 'and in no respect alterable hereditary lease contract, which they herewith at once publish to the
    judicial protocol.


    § I. His Most Serene Highness grants, namely, to Blazy Kukulski


    1 Hufe, in words one Hufe Magdeburg measure, the Hufe reckoned at thirty Morgen and each Morgen at
    one hundred and eighty square rods, at Kotikale Czazy w Kierzäwn, arable land situated by Osiny, in
    hereditary lease for perpetual times.


    § II. Huba Maydebuska — and this one Hufe Magdeburg measure has already been assigned to Blazy Kukulski
    and handed over into actual possession'
  names:
  - de: Blazy Kukulski
    en: Blazy Kukulski
    kind: person

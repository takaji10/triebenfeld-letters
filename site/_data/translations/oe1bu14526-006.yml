- page: 13
  en: 'In witness whereof I have subscribed this general power of attorney in my own hand and confirmed
    it by the impression of my arms. Done at the Guhrwitz justice office near Breslau, the 19th of February
    1805.


    (L. S.) read by myself and approved, Friedrich Ludwig, Prince of Hohenlohe. That His Serene Highness
    the reigning Prince and Lord, well known in person to the undersigned justice office and fully capable
    of disposition, General of Infantry, Chief of a Regiment, Governor of the City and Fortress of Breslau
    and Knight of the Great Order of the Black and Red Eagle, Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen,
    did on this date draw up before us and with our attendance the foregoing general power of attorney
    directed to the Royal Councillor of War and Forests Mr von Triebenfeld, acknowledged himself throughout
    to the literal tenor of the same, and thereupon, after His Highness had once more read it through
    beforehand and approved it, subscribed and sealed the same in our presence with his own hand. The
    same is herewith, testante Protocolli de hodierno, in fidem publicam attested'

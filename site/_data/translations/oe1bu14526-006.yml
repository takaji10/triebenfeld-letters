segments:
- page: 1
  en: 'The Most Serene Hohenlohe Patrimonial Court hereby makes known that between the Councillor of War
    and Forests von Triebenfeld, as general attorney of His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen
    on the one part, and Blazy Kukulski on the other part, the following contract of sale and purchase
    has been concluded and published concerning one Hufe of land, Magdeburg measure, situated by the estate
    of Osiny.


    Actum Trąbczyn, the eighteenth of July, one thou


    sand eight hundred and


    six.


    Before the undersigned local Patrimonial Court there appeared in person


    firstly'

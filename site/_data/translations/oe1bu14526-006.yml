- page: 12
  en: government at Kalisz and before all other authorities, and respectively to make report, and to attend
    to all other requisite business for me, to come to terms with the tenants and to conclude compositions,
    to pay moneys, to receive the like and to give receipts therefor, to issue to my officials and servants
    there the orders serviceable to his purpose, to examine their conduct and their performance of duty,
    and should he by his own insight find the same fitting and prejudicial to me, to suspend them if need
    be, and in general to act unrestrictedly and freely before all authorities and in all matters as he
    shall find good and most conformable to my interest. Whatsoever my said authorised representative
    shall do by virtue of this commission received, I hereby promise to approve and to hold to inviolably
    in such wise as though I had done it myself. At the same time I bind myself also to indemnify my authorised
    representative in every quarter on account of this commission, and to make good to him all costs and
    outlays, pledging my present and future property so far as shall be required thereto. [illegible]
  names:

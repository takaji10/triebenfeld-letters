- page: 3
  en: 'and in nothing to be altered, which they hereby forthwith publish to the judicial protocol.


    §. I. His Most Serene Highness namely grants to Blazy Kukulski


    1 Hufe, in words one Hufe Magdeburg measure, the Hufe reckoned at thirty Morgen and each Morgen at
    one hundred and eighty square rods, at Kotikale Czazy w Kierzäwn arable land situated near Osiny,
    in hereditary lease for perpetual time.


    §. II. Huba Maydebuska, and this one Hufe Magdeburg measure has already been assigned to Blazy Kukulski
    and delivered into actual possession'
  names:
  - de: Blazy Kukulski
    en: Blazy Kukulski
    kind: person
  - de: Kotikale Czazy w Kierzäwn
    en: Kotikale Czazy w Kierzäwn
    kind: place
  - de: Osiny
    en: Osiny
    kind: place
  - de: Huba Maydebuska
    en: Huba Maydebuska
    kind: other
  numbers:

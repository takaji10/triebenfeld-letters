  - '180'
- page: 4
  en: 'with which he is fully content.


    § III. Blazy Kukulski pays for this one Hufe Magdeburg measure as purchase money 100 Rthl, in words
    one hundred Reichsthaler, and since he has already discharged this purchase money in full, he is hereby
    given a receipt for it.


    § IV. Moreover Blazy Kukulski hereby binds himself, for himself and his successors in possession,
    to pay to the manorial lordship (Dominium) from this one Hufe Magdeburg measure an annual hereditary
    rent of 30 Rthl, in words thirty Reichsthaler, in ready current Courant, and this hereditary rent
    shall now and'
  names:
  - de: Blazy Kukulski
    en: Blazy Kukulski
    kind: person
  - de: Magdeburgisch
    en: Magdeburg
    kind: place
  numbers:
  - '100'
  - '30'
- page: 5
  en: 'for the future be discharged in half-yearly instalments, namely the one at Midsummer and the other
    at Christmas, each time post numerando, and the first half-yearly hereditary rent shall not be paid
    until Christmas 1806.


    § V. The settlement and rendering of the royal and other public dues falling upon this one Hufe, without
    any distinction, likewise the chimney money, the delivery of forage and the provision of carting service,
    the hereditary lessee takes upon himself now and for perpetual times, without any deduction from the
    hereditary rent, or any demand upon the manorial lordship for reimbursement thereof.'
  numbers:
  - '1806'
- page: 6
  en: 'In return the hereditary lessee is now and for perpetual times wholly free from any and every manorial
    labour service, as also from hereditary subjection.


    § VI. The hereditary lessee must set up and build his establishment entirely at his own cost, and
    receives for this purpose neither now nor in future any building timber or other building assistance,
    and just as little any remission of the annual hereditary rent; however, all the timber standing on
    this Hufe remains, without exception, his property, and he may dispose of it without restriction.


    § VII. Outside his own holding the hereditary lessee has no right'
- page: 7
  en: 'to firewood or pasturage in the manorial woods and fields.


    § VIII. The hereditary lessee must always take his drink from the manorial brewery and distillery
    or from the tavern.


    If foreign drink be brought in by him or his people, the hereditary lessee incurs on each occasion
    a penalty of five Reichsthaler for every barrel of beer and one Reichsthaler for every garniec of
    brandy, which penalty shall be paid over to the manorial lordship by way of compensation.


    § IX. The hereditary lessee remains at all times subject to the jurisdiction of the manorial lordship,
    as also to the milling obligation within the manorial estates.


    § X. The hereditary lessee is entitled to dispose of this holding and to alienate it otherwise at
    his pleasure.'
- page: 8
  en: 'The manorial lordship reserves to itself, however, once and for all hereby the right of pre-emption,
    and if it does not wish to exercise the same, then the tenth Groschen of the purchase or exchange
    sum must be paid over to the manorial lordship by the seller of the day as a transfer fee (Laudemium).


    In the case of inheritance by children and other relatives no transfer fee is paid.


    § XI.


    The hereditary lessee renounces entirely, for himself and his successors in possession, any and every
    remission in cases of misfortune, be they caused by fire from heaven, arson by evil persons, hailstorm,
    crop failure, cattle plague, war and pestilence, or arise in whatever manner it may be; and in the
    event of such cases there shall be neither any allowance nor'
- page: 9
  en: 'remission of the hereditary rent.


    § XII. His Most Serene Highness consents that the hereditary lessee may, upon the ground of this contract,
    have the title of possession to this one Hufe so acquired entered in his own name in the land and
    mortgage book.


    § XIII. The purchaser undertakes to settle all the costs pertaining to this contract.


    § XIV. So long as the hereditary lessee and his successors in possession shall fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights and
    to defend them against any man''s real claim. Should, however, the hereditary lessee or his successors
    in possession remain in arrears with the annual hereditary rent for longer than two years,'
- page: 10
  en: 'or else lay this holding waste and thereby diminish the revenues of the manorial lordship, then
    the manorial lordship shall be entitled to put out this holding elsewhere, and the hereditary lessee
    thereupon forfeits his whole right, and the purchase moneys paid in remain the property of the manorial
    lordship.


    Both parties promise to keep this contract firmly and inviolably; being judicially instructed as to
    the consequences, they renounce all evasions available against it, particularly the objection of an
    injury suffered above or below the half, of cunning persuasion, fear, coercion, of matters agreed
    otherwise than written down or not rightly understood; they moved that this contract be confirmed
    and an engrossment issued, and after it had been'
- page: 11
  en: 'read out in the German and Polish languages, they have in token of approval subscribed and signed
    below in their own hands.


    v. Triebenfeld.


    xxx signifies Blazy Kukulski.


    a u s


    Schenk


    Justiciary


    Ogrodowicz


    Keeper of the protocol


    General power of attorney. I, the undersigned, do hereby make known and confess that I hereby expressly
    empower the Royal Councillor of War and Forests, the Right Honourable Mr Peter Friedrich August von
    Triebenfeld of Schweinern etc., to attend, in my name, both judicially and extrajudicially, to any
    and every matter concerning the estates of Zagorowo, Witów and Trąbczyn belonging to me and situated
    in South Prussia in the department of Kalisz, whether they concern a dismemberment or purchase and
    sale, leasing or mortgaging, or by whatever other name they may go, and may have bearing and influence;
    to petition for all approbations or instructions needful in that regard, as also for all other requisites
    appearing to him needful, both at the most laudable Chamber and at the most laudable'

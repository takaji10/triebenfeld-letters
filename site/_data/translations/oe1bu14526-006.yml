- page: 2
  en: '1. the Councillor of War and Forests von Triebenfeld, as general attorney of His Serene Highness
    the reigning Prince of Hohenlohe-Ingefingen, sole hereditary lord and lord of the court, legitimated
    by the power of attorney [uncertain: appended] on the one part, and


    2. the farmer Blazy Kukulski from the princely estate of Osniy on the other part. The parties appearing
    are exactly known to the undersigned justiciary, and their capacity to execute judicial acts is subject
    to no doubt. They declare freely and after due deliberation the following irrevocable'

- page: 1
  en: 'The Serene Highness of Hohenlohe''s patrimonial court hereby makes known that between the Councillor
    of War and Forests von Triebenfeld, as general attorney of His Serene Highness the reigning Prince
    of Hohenlohe-Ingelfingen, on the one part, and Blazy Kukulski on the other part, the following contract
    of sale and purchase concerning one Hufe of land, Magdeburg measure, situated by the estate of Osiny,
    has been concluded and published.


    Actum Trąbczyn, the eighteenth of July, one thou


    sand eight hundred and


    six.


    Before the undersigned local patrimonial court there appeared in person


    firstly'

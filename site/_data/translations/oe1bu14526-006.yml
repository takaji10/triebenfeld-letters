status: draft
segments:
- page: 1
  en: 'The Serene [uncertain: Dürchlauch] von Hohenlohe Patrimonial Court hereby gives notice that between
    the Councillor of War and Forests von Triebenfeld, as General Bevollmächtigter of His Serene Highness
    the reigning Prince zu Hohenlohe Ingelfingen, of the one part, and Blazy Kukulski of the other part,
    concerning One Hufe of land, Magdeburg measure, situated by the estate of Osiny, the following contract
    of sale and purchase has been concluded and published.


    Actum Trąbczyn, the eighteenth of July, one thou-


    sand eight hundred and


    six.


    Before the undersigned local Patrimonial Court there appeared in person


    firstly'
- page: 2
  en: '1. the Councillor of War and Forests von Triebenfeld, as General Bevollmächtigter of His [uncertain:
    durch haupt] the reigning Prince zu Hohenlohe Ingefingen, sole hereditary and jurisdictional lord,
    legitimated by the [uncertain: bediegende] power of attorney, of the one part; and


    2. the farmer Blazy Kukulski from the Princely estate of Osniy, of the other part. The comparents
    are exactly known to the undersigned Justitiarius, and their capacity to perform judicial acts is
    subject to no doubt. They declare, freely and after due deliberation, the following irrevocable [contract]
    concluded between them'
- page: 3
  en: 'and in nothing to be altered hereditary-lease contract, which they hereby forthwith publish to
    the judicial protocol.


    §. I. His Most Serene Highness namely grants to Blazy Kukulski


    1 Hufe, in words One Hufe Magdeburg measure, the Hufe reckoned at thirty Morgen and each Morgen at
    one hundred and eighty square rods, [uncertain: an Kotikale Czazy w Kierzäwn] arable land situated
    by Osiny, in hereditary lease for perpetual times.


    §. II. Huba Maydebuska, and this One Hufe Magdeburg measure has already been assigned to Blazy Kukulski
    and given over into natural possession'
- page: 4
  en: 'over, wherewith the same is fully content.


    §. III. Blazy Kukulski pays for this one Hufe Magdeburg measure as purchase-money 100 Rthl, in words
    one hundred Reichsthaler, and since he has already discharged this purchase-money in full, he is hereby
    given receipt for it.


    §. IV. Moreover Blazy Kukulski hereby binds himself, for himself and his successors in possession,
    to pay to the ground-lordship from this one Hufe Magdeburg measure an annual hereditary rent of 30
    Rthl, in words thirty Reichsthaler, in ready current Courant; and this hereditary rent shall be, now
    and'
- page: 5
  en: 'for the future, discharged in half-yearly instalments, namely the one at Midsummer (Johanni) and
    the other at Christmas, each time post numerando; and the first half-yearly hereditary rent shall
    not be paid until Christmas 1806.


    §. V. The settlement and rendering of the Royal and other public dues falling upon this one Hufe,
    without any distinction whatever, likewise the chimney-money, the delivery of forage and the provision
    of transport service (Vorspann), the hereditary lessee takes upon himself, now and for perpetual times,
    without any deduction from the hereditary rent, or demanding any reimbursement for it from the ground-lordship.'
- page: 6
  en: 'In return the hereditary lessee is, now and for perpetual times, wholly free of any and every manorial
    labour service, as likewise of hereditary subjection.


    §. VI. The hereditary lessee must set up and build his establishment entirely at his own cost, and
    receives for this purpose neither now nor in future any building timber or other building assistance,
    and just as little any remission of the annual hereditary rent; however all the timber standing on
    this Hufe remains, without exception, his property, and he may dispose of it without restriction.


    §. VII. Outside his own holding the hereditary lessee has no right'
- page: 7
  en: 'to firewood or pasturage in the manorial woods and fields.


    §. VIII. The hereditary lessee must always take his drink from the manorial brewery and distillery
    or from the tavern.


    If foreign drink is brought in by him or his people, then the hereditary lessee incurs each time a
    penalty of Five Reichsthaler for every barrel of beer and one Reichsthaler for every Garniec of brandy,
    which penalty is to be paid over to the ground-lordship by way of compensation.


    §. IX. The hereditary lessee remains always subject to the jurisdiction of the ground-lordship, as
    likewise to the milling compulsion within the manorial estates.


    §. X. The hereditary lessee is entitled to dispose of this holding and to alienate the same elsewhere
    at his pleasure.'
- page: 8
  en: 'The ground-lordship, however, hereby reserves to itself once and for all the right of pre-emption,
    and if it will not exercise the same, then the tenth Groschen of the purchase or exchange sum must
    be paid over by each successive seller to the ground-lordship as a Laudemium.


    Upon inheritance by children and other relatives no Laudemium is to be rendered.


    §. XI.


    The hereditary lessee renounces, for himself and his successors in possession, entirely all and every
    remission in cases of misfortune, whether these arise through fire from heaven, incendiarism by evil
    people, hailstorm, crop failure, cattle plague, war and pestilence, or in whatever manner it may be;
    and in the event of such cases there shall be neither any bonification nor'
- page: 9
  en: 'remission of the hereditary rent take place.


    §. XII. His Most Serene Highness consents that the hereditary lessee may have the title of possession
    to this One Hufe thus acquired entered in his own name in the Land and Mortgage Book on the ground
    of this contract.


    §. XIII. The purchaser undertakes to settle all the costs pertaining to this contract.


    §. XIV. So long as the hereditary lessee and his successors in possession fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights and
    to defend them against any man''s real claim. Should, however, the hereditary lessee or his successors
    in possession remain in arrears with the annual hereditary rent for longer than two years,'
- page: 10
  en: 'or else lay waste this holding and thereby diminish the revenues of the ground-lordship, then the
    ground-lordship shall be entitled to let out this holding elsewhere, and the hereditary lessee shall
    thereupon forfeit his whole right, and the purchase-monies paid in remain the property of the ground-lordship.


    Both parties promise to hold this contract firmly and inviolably; having been judicially instructed
    as to the consequences, they renounce all evasions available against it, in particular the objection
    of an injury sustained above or below the half, of cunning persuasion, fear, compulsion, of matters
    otherwise agreed than written down, or not properly understood; they moved that this contract be confirmed
    and an engrossment issued, and, after the reading having taken place,'
- page: 11
  en: 'the reading having taken place in the German and Polish languages, they have, in token of approval,
    subscribed and signed below in their own hands.


    v Triebenfeld.


    xxx signifies Blazy Kukulski.


    a u s


    Schenk


    Justitiarius


    Ogrodowicz


    Keeper of the protocol


    General power of attorney. I, the undersigned, hereby make known and confess that I do hereby expressly
    empower the Royal Councillor of War and Forests, Herr Peter Friedrich August von Triebenfeld, Your
    Right Honourable, of Schweinern etc., to attend, in my name, both judicially and extra-judicially,
    to any and every affair touching the estates of Zagorowo, Wittow and Trąbczyn belonging to me, situated
    in South Prussia in the Kalisch Department, whether they concern a dismemberment or purchase and sale,
    leasing or pledging, or by whatever other name they may go, and may have bearing and influence; to
    petition for, and respectively to notify, all approbations or orders of conduct necessary in that
    regard, as also all other requirements appearing to him necessary, both with the most laudable Chamber
    and also with the most laudable'
- page: 12
  en: 'Government at Kalisch and with all other authorities, and to attend for me to all other requisite
    business, to come to an accounting with the tenants and to conclude compositions, to pay monies, to
    receive the like and to give receipts for them, to issue to my officials and servantry there such
    orders as are conducive to the purpose, to investigate their conduct and performance of duty, and,
    if in his discretion he should find such [conduct] fitting and prejudicial to me, to suspend them
    if need be, and generally to act without restriction and freely before all authorities and in all
    affairs as he shall find good and most conformable to my interest. Whatsoever my said Bevollmächtigter
    shall do by virtue of this commission received, I hereby promise to approve and to hold inviolably
    thereto in such manner as if I had done it myself. At the same time I also bind myself to indemnify
    my Bevollmächtigter in every respect on account of this commission, and [to make good] to him all
    costs and outlays, on the pledge of my present and future property, so far as shall be required for
    this purpose. [uncertain: lesen]'
- page: 13
  en: 'In witness whereof I have subscribed this general power of attorney in my own hand and confirmed
    it by the impression of my arms. So done in the Guhrwitz Justice Office near Breslau, the 19th of
    February 1805.


    (L. S.) read by myself and approved, Fridrich Ludwig Fürst zu Hohenlohe.


    That His Serene Highness the reigning Prince and Lord, well known in person to the undersigned Justice
    Office and fully capable of disposition, General of Infantry, Chief of a Regiment, Governor of the
    city and fortress of Breslau and Knight of the Great Black and Red Eagle Orders, Herr Fridrich Ludwig
    Fürst zu Hohenlohe Ingelfingen, executed the foregoing general power of attorney directed to the Royal
    Councillor of War and Forests Herr v. Triebenfeld before us this day with our concurrence, acknowledged
    himself throughout to the verbatim content of the same, and thereupon, after His Highness had once
    more read through and approved it beforehand, subscribed and sealed the same in our presence with
    his own hand: this is hereby, testante Protocolli de hodierno, in fidem publicam attested.'
- page: 14
  en: 'attested. So done in the Guhrwitz Justice Office near Breslau, the 19th of February 1805. Baronial
    von Stillfried Gehrwitz Justice Office.


    L.S. Koeppen


    Justitiarius


    Kaleschke


    Actuarius.


    Issued in due form under the impression of the court seal and the customary signature. Done at Allexandrien,
    the 28th of January 1808.


    [uncertain: Aislich] von Hohenlohe Patrimonial Court, office of Zagorow. Hawich.


    Engrossment. The contract of sale and purchase concluded between the Councillor of War and Forests
    von Triebenfeld, as General Bevollmächtigter of His Serene Highness the Prince v Hohenlohe Ingelfingen,
    and Blazy Kukulski, concerning [uncertain: für] Hufe of land, Magdeburg measure, situated by the estate
    of Osiny.'

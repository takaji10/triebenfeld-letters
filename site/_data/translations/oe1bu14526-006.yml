- page: 12
  en: Government at Kalisz and with all other authorities, and to attend to all other requisite business
    for me, to come to terms with the tenants and conclude settlements, to pay moneys, to receive the
    like and to give receipts for them, to issue to my officials and servants there the orders serviceable
    to his purpose, to investigate their conduct and performance of service, and if in his judgement he
    should find such [conduct] fitting and prejudicial to me, to suspend them if need be, and generally
    to act without restriction and freely with all authorities and in all matters as he shall find good
    and most conducive to my interest. Whatever my said authorised representative shall do by virtue of
    this commission received, I hereby promise to approve and to hold to it as inviolably as though I
    had done it myself. At the same time I also bind myself to indemnify my authorised representative
    in every respect on account of this commission, and to make good to him all costs and outlays, on
    the pledge of my present and future estate so far as shall be required for this purpose. [illegible]
  names:
  - de: Kalisch
    en: Kalisz
    kind: place
- page: 13
  en: 'In witness whereof I have subscribed this general power of attorney in my own hand and confirmed
    it by the impression of my arms. Done at the Guhrwitz Justice Office near Breslau, the 19th February
    1805.


    (L. S.) read by myself and approved, Fridrich Ludwig, Prince of Hohenlohe. That His Serene Highness
    the reigning Prince and Lord, very well known in person to the undersigned Justice Office and fully
    capable of disposing, General of Infantry, Chief of a Regiment, Governor of the city and fortress
    of Breslau and Knight of the Great Black and of the Red Eagle Orders, Fridrich Ludwig, Prince of Hohenlohe-Ingelfingen,
    drew up the foregoing general power of attorney directed to the Royal Councillor of War and Forests
    von Triebenfeld this day before us and with our participation, acknowledged himself throughout to
    the literal content of the same, and thereupon, after His Highness had once more read it through beforehand
    and approved it, subscribed and sealed it in our presence in his own hand. The same is hereby testande
    Protocolli de hodierno in fidem publicam att[ested]'

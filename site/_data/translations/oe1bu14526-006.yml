  - '1'
  - '30'
  - '180'
- page: 4
  en: 'with which he is entirely content.


    §. III. Blazy Kukulski pays for this one Hufe Magdeburg measure as purchase money 100 Rthl, in words
    one hundred Reichsthaler, and since he has already discharged this purchase money in full, he is hereby
    receipted for it.


    §. IV. Besides this, Blazy Kukulski hereby binds himself, for himself and his successors in possession,
    to pay to the ground lordship an annual hereditary rent of 30 Rthl, in words thirty Reichsthaler,
    in ready current Courant, from this one Hufe Magdeburg measure, and this hereditary rent shall now
    and'
  names:
  - de: Blazy Kukulski
    en: Blazy Kukulski
    kind: person
  numbers:
  - '100'
  - '30'
- page: 5
  en: 'in future be discharged in half-yearly instalments, namely the one at Midsummer and the other at
    Christmas, each time post numerando, and the first half-yearly hereditary rent shall not be paid until
    Christmas 1806.


    §. V. The settlement and rendering of the royal and other public dues falling upon this one Hufe,
    without any distinction, as also the chimney money, forage delivery and carting service, the hereditary
    lessee takes upon himself now and for perpetual time, without any deduction from the hereditary rent,
    or demanding any reimbursement for it from the ground lordship.'
  numbers:
  - '1806'
- page: 6
  en: 'In return the hereditary lessee is now and for perpetual time entirely free of all and every manorial
    labour service, as also of hereditary subjection.


    §. VI. The hereditary lessee must establish and build his settlement entirely at his own cost, and
    receives for this neither now nor in future any building timber or other building assistance, and
    just as little any remission of the annual hereditary rent; however, all the timber standing on this
    Hufe remains without exception his property, and he may dispose of it without restriction.


    §. VII. Outside his own holding the hereditary lessee has no right'
- page: 7
  en: 'to firewood or pasturage in the manorial woods and fields.


    §. VIII. The hereditary lessee must always take his drink from the manorial brewery and distillery
    or from the inn.


    If foreign drink is brought in by him or his people, the hereditary lessee incurs each time a penalty
    of five Reichsthaler for every barrel of beer and one Reichsthaler for every garniec of brandy, which
    penalty is to be paid to the ground lordship as compensation.


    §. IX. The hereditary lessee remains always subject to the jurisdiction of the ground lordship, as
    also to the milling obligation on the manorial estates.


    §. X. The hereditary lessee is entitled to dispose of this holding and to alienate it otherwise at
    his pleasure.'
- page: 8
  en: 'The ground lordship, however, hereby reserves to itself once and for all the right of pre-emption,
    and if it will not exercise the same, then the tenth Groschen of the purchase or exchange sum must
    be paid by each respective seller to the ground lordship as a transfer fee (Laudemium).


    On inheritances to children and other relatives no transfer fee is paid.


    §. XI.


    The hereditary lessee renounces entirely, for himself and his successors in possession, all and every
    remission in cases of misfortune, whether these arise through fire from heaven, arson by evil people,
    hailstorm, crop failure, cattle plague, war and pestilence, or in whatever manner it may be, and in
    such cases there shall be neither any allowance nor'
- page: 9
  en: 'remission of the hereditary rent.


    §. XII. His Most Serene Highness consents that the hereditary lessee may have the title of possession
    of this one Hufe thus acquired entered in his name in the land and mortgage book on the ground of
    this contract.


    §. XIII. The purchaser undertakes to settle the whole of the costs attending this contract.


    §. XIV. So long as the hereditary lessee and his successors in possession fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights and
    to defend them against any man''s real claim. But should the hereditary lessee or his successors in
    possession remain in arrears with the annual hereditary rent for longer than two years,'
- page: 10
  en: 'or lay this holding waste and thereby diminish the revenues of the ground lordship, then the ground
    lordship shall be entitled to let out this holding otherwise, and the hereditary lessee thereupon
    forfeits the whole right, and the purchase moneys paid in remain the property of the ground lordship.


    Both parties promise to keep this contract firmly and inviolably; having been judicially instructed
    as to the consequences, they renounce all evasions available against it, particularly the objection
    of an injury suffered above and below the half, of cunning persuasion, fear, coercion, of matters
    otherwise agreed than written down or not rightly understood; they applied to have this contract confirmed
    and an official copy made out, and after it had been'
- page: 11
  en: 'read out in the German and Polish languages, they have in token of approval subscribed and signed
    below in their own hands.


    v. Triebenfeld.


    xxx signifies Blazy Kukulski.


    a u s


    Schenk


    Justiciary


    Ogrodowicz


    Keeper of the protocol


    General power of attorney. I, the undersigned, hereby make known and confess that I expressly empower
    the Royal Councillor of War and Forests Peter Friedrich August von Triebenfeld, Your Right Honourable,
    of Schweinern etc., to attend, both judicially and extrajudicially, to all and every matter in my
    name touching my estates of Zagorowo, Witów and Trąbczyn situated in South Prussia in the Kalisz Department,
    whether they concern a dismemberment or purchase and sale, leasing or pledging, or by whatever other
    name they may go and with which they may have connection and bearing; to petition for and respectively
    to notify all approvals or instructions necessary in that regard, as also all other requisites appearing
    to him necessary, both with the most laudable Chamber and with the most laudable'

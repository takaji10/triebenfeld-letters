status: draft
segments:
- page: 1
  en: 'The Serene [uncertain: Dürchlauch] von Hohenlohe Patrimonial Court hereby makes known that between
    the Herr Krieg es und derst Rath von Triebenfeld, as General Bevollmächtigter of His Serene Highness
    the reigning Prince of Hohenlohe Ingelfingen on the one part, and Blazy Kukulski on the other part,
    the following contract of sale and purchase concerning One Hufe of land, Magdeburg measure, situated
    by the estate of Osiny, has been concluded and published.


    Actum Trąbczyn, the eighteenth of July, one thou-


    sand eight hundred and


    six.


    Before the undersigned local Patrimonial Court there appeared in person


    1st'
- page: 2
  en: '1. the Herr Councillor of War and Forests von Triebenfeld, as General Bevollmächtigter of [uncertain:
    Er durch haupt] the reigning Prince of Hohenlohe Ingefingen, sole hereditary and jurisdictional lord,
    legitimated by the power of attorney here appended, on the one part, and


    2. the farmer Blazy Kukulski from the princely estate of Osniy on the other part. The comparents are
    precisely known to the undersigned Justitiarius, and their capacity for the performance of judicial
    acts is subject to no doubt of mine. They declare freely and after due deliberation the following
    irrevocable [contract] concluded between them'
- page: 3
  en: 'and in no respect alterable hereditary-lease contract, which they hereby forthwith publish to the
    judicial protocol.


    §. I. His Most Serene Highness namely grants to Blazy Kukulski


    1 Hufe, in words One Hufe Magdeburg measure, the Hufe reckoned at thirty Morgen and each Morgen at
    one hundred and eighty square rods, in [uncertain: Kotikale Czazy w Kierzäwn] arable land situated
    by Osiny, in hereditary lease for perpetual times.


    §. II. Huba Maydebuska: and this One Hufe Magdeburg measure has already been assigned to Blazy Kukulski
    and made over into natural possession'
- page: 4
  en: 'over to him, with which the same is entirely content.


    §. III. Blazy Kukulski pays for this one Hufe Magdeburg measure as purchase-money 100 rtl., in words
    one hundred Reichsthaler, and since he has already discharged this purchase-money in full, he is hereby
    given receipt for it.


    §. IV. Furthermore Blazy Kukulski hereby binds himself, for himself and [uncertain: keine] his successors
    in possession, to pay to the ground lordship from this one Hufe Magdeburg measure a yearly hereditary
    quit-rent of 30 rtl., in words thirty Reichsthaler, in cash current Courant; and this hereditary quit-rent
    shall now and'
- page: 5
  en: 'for the future be discharged in half-yearly instalments, namely the one at Midsummer (Johanni)
    and the other at Christmas, each time post numerando; and the first half-yearly hereditary quit-rent
    shall only be paid off at Christmas 1806.


    §. V. The settlement and rendering of the Royal and other public dues falling upon this one Hufe,
    without any distinction whatever, as also the chimney-money, forage delivery and carting service (Vorspann),
    the hereditary lessee takes upon himself now and for perpetual times, without any deduction from the
    hereditary quit-rent, or demanding any reimbursement for it from the ground lordship.'
- page: 6
  en: 'In return, the hereditary lessee is now and for perpetual times entirely free of any and all manorial
    labour services, as also of hereditary subjection.


    §. VI. The hereditary lessee must set up and build his establishment wholly at his own cost, and receives
    for this purpose neither now nor in future any building timber or other building assistance, and just
    as little any remission of the yearly hereditary quit-rent; however, all the timber standing on this
    Hufe remains without exception his property, and he may dispose of it without restriction.


    §. VII. Outside his own holding the hereditary lessee has no right'
- page: 7
  en: 'to firewood or pasturage in the manorial woods and fields.


    §. VIII. The hereditary lessee must always take his drink from the manorial brewery and distillery,
    or from the tavern.


    If foreign drink is brought in by him or his people, the hereditary lessee incurs each time a penalty
    of Five Reichsthaler for every [uncertain: Tane] of beer and one Reichsthaler for every Garniec of
    brandy, which penalty is to be paid to the ground lordship as compensation.


    §. IX. The hereditary lessee remains always subject to the jurisdiction of the ground lordship, as
    also to the milling compulsion in the manorial estates.


    §. X. The hereditary lessee is entitled to dispose of this holding and to alienate it elsewhere at
    his pleasure.'
- page: 8
  en: 'The ground lordship, however, hereby reserves to itself once and for all the right of pre-emption;
    and if it does not wish to exercise the same, then the tenth Groschen of the purchase or exchange
    sum must be paid by the seller of the time to the ground lordship as a Laudemium.


    On inheritances passing to children and other relatives no Laudemium is to be paid.


    §. XI.


    The hereditary lessee renounces entirely, for himself and his successors in possession, any and all
    remissions in cases of misfortune, whether these arise through fire from heaven, incendiar[y] malice
    of wicked people, hail-stroke, crop failure, cattle plague, war and pestilence, or in whatever manner
    it may [uncertain: mir] be; and in the event of such cases neither a bonification nor'
- page: 9
  en: 'remission of the hereditary quit-rent shall take place.


    §. XII. [uncertain: Deiner] His Most Serene Highness consents that the hereditary lessee may, on the
    ground of this contract, have the title of possession to this one Hufe so acquired entered in his
    own name in the land and mortgage book.


    §. XIII. All the costs pertaining to this contract the purchaser undertakes to settle.


    §. XIV. So long as the hereditary lessee and his successors in possession shall fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights and
    to defend them against every man''s real claim. Should, however, the hereditary lessee or his successors
    in possession remain in arrears with the yearly hereditary quit-rent for longer than two years'
- page: 10
  en: 'or else lay waste this holding and thereby diminish the revenues of the ground lordship, the ground
    lordship shall be entitled to let out this holding elsewhere, and the hereditary lessee shall then
    forfeit the whole right, and the purchase-money paid in shall remain the property of the ground lordship.


    Both parties promise to keep this contract firmly and inviolably; they renounce, having been judicially
    instructed as to the consequences, all exceptions available against it, in particular the objection
    of an injury suffered above or below the half, of cunning persuasion, fear, coercion, of matters otherwise
    agreed than written down, or not rightly understood; they requested that this contract be confirmed
    and engrossed, and after it had been'
- page: 11
  en: 'read aloud in the German and Polish languages, they have in token of approval subscribed and signed
    below in their own hands.


    v Triebenfeld.


    xxx signifies Blazy Kukulski.


    a u s


    Schenk


    Justitiarius


    Ogrodowicz


    Keeper of the Protocol


    General Power of Attorney. I, the undersigned, hereby make known and confess that I do expressly empower
    the Royal Councillor of War and Forests, Herr Peter Friedrich August von Triebenfeld, Your Right Honourable,
    of Schweinern etc., to attend, in my name, both judicially and extrajudicially, to any and all affairs
    concerning the estates belonging to me in South Prussia in the Kalisch Department, namely Zagorowo,
    Wittow and Trąbczyn, whether they concern a dismemberment or purchase and sale, leasing or pledging,
    or by whatever other name they may go, and may have bearing and influence; to petition for, and respectively
    to notify, all approbations or orders of conduct necessary in the matter, as well as all other requisites
    appearing needful to him, both with the most laudable Chamber and with the most laudable'
- page: 12
  en: 'Government at Kalisch and with all other authorities; and to attend to all other necessary business
    for me; to settle accounts with the tenants and to conclude compositions, to pay moneys, to receive
    the like and give receipt for them; to issue to my officials and servants there such orders as he
    finds serviceable, to examine their conduct and performance of duty, and if in his judgement he should
    find such [uncertain: für angemeßen und mir nachteilig] fitting and prejudicial to me, to suspend
    them if need be; and in general to act unrestrictedly and freely before all authorities and in all
    affairs as he shall find good and most conformable to my interest. Whatever my said Bevollmächtigter
    shall do by virtue of this commission received, I hereby promise to approve and to hold so inviolably
    as if I had done it myself. At the same time I bind myself to indemnify my Herr Bevollmächtigter in
    every respect on account of this commission, and to make good to him all costs and outlays, pledging
    my present and future property so far as shall be required for this. [uncertain: lesen]'
- page: 13
  en: 'In witness whereof I have signed this general power of attorney in my own hand and confirmed it
    by the impression of my arms. Done in the Guhrwitz Justice Office near Breslau, the 19th February
    1805.


    (L. S.) read by myself and approved, Fridrich Ludwig Fürst zu Hohenlohe.


    That His Serene Highness the reigning Prince and Lord, very well known in person to the undersigned
    Justice Office and fully capable of disposition, General of Infantry, Chief of a Regiment, Governor
    of the city and fortress of Breslau and Knight of the Great Black and Red Eagle Order, Herr Fridrich
    Ludwig Fürst zu Hohenlohe Ingelfingen, executed the above general power of attorney, directed to the
    Royal Councillor of War and Forests Herr v. Triebenfeld, this day before us with our participation,
    acknowledged himself throughout to the literal contents of the same, and thereupon, after His Highness
    had once more read it through beforehand and approved it, subscribed and sealed it in our presence
    with his own hand: this is hereby, testante Protocolli de hodierno, in fidem publicam attested'
- page: 14
  en: 'attested. Done in the Guhrwitz Justice Office near Breslau, the 19th Februarii 1805. Freiherrlich
    von Stillfried, Gehrwitz Justice Office.


    L.S. Koeppen


    Justitiarius


    Kaleschke


    Actuarius.


    Issued in due form under the impression of the court seal and the customary signature. Done at Allexandrien,
    the 28th Januarii 1808.


    [uncertain: Aislich] von Hohenlohe Patrimonial Court, Office of Zagorow. Hawich.


    Engrossment. The contract of sale and purchase concluded between the Herr Councillor of War and Forests
    von Triebenfeld, as General Bevollmächtigter of His Serene Highness the Prince v Hohenlohe Ingelfingen,
    and Blazy Kukulski, concerning [uncertain: für] Hufe of land, Magdeburg measure, situated by the estate
    of Osiny.'

- page: 2
  en: 'to ferment; it is curious that nobody says anything to him about it, but rather pays him compliments.
    Russia treads all human rights in Poland into the dust; thousands of [uncertain: grievances] come
    in here, but none of the authorities deigns to lend an ear to a complainant — There now reigns great
    confusion everywhere, and God forbid that the [illegible] smouldering under the ashes should not turn
    to flame and break forth with a fearful explosion —. Oh! My God, this very moment I hear that Prince
    August will not take the power of attorney away from Cosmar — Is it possible that a son who has been
    treated by his father with overflowing kindness can think so — and can ally himself with a convicted
    villain and robber against his father? I do not know in what category one is to place this. Here it
    can astonish nobody if the Courland and other creditors harbour suspicions, when the man''s own son
    acts so — Ah, a pity about the 100/m Rthl — Meanwhile, patience — Your Serene Highness has indeed
    said so much good of Prince Adolph, has praised his head, his heart, and his firm attachment to his
    father — What do you think, most gracious Lord, if one were to have the honest young man declared
    [uncertain: of age] — then you would after all have a son and a support on which you could lean in
    old age. Tell me your opinion on this — Prince Hardenberg will set it in train at once, if this has
    not been expressly forbidden in the will of the old Princess Sakkin, whose sole heir he is after all
    — Let the brave young man be rescued from the claws of the villain, who riots in good Adolph''s [uncertain:
    property] and [illegible: mälert] himself frightfully — Let Your Serene Highness take this faithfully
    meant counsel to heart, and if my proposal is agreeable to you, then only send Eberhard and give him
    a letter to the Prince State Chancellor, and a blank sheet for writing to the King as well — that
    goes quickly and securely — B[arbe] says the Prince would attend to this alone — but M[inister] Hum[boldt]
    thinks it may well be necessary to submit a letter to the King — Ah, if this too succeeded, then all
    would have succeeded — Now, most gracious Prince, only have mercy and send me at least 100 #, out
    of which I can at least pay Barbe, who is really beginning to grumble. — As surely as heaven is above
    us, I know of no counsel or help for myself. It is so furiously dear here, I live worse than a day-labourer.
    You cannot possibly wish that I should perish in disgrace and mockery, vexation and hunger, for all
    that I do for you? I remain, until death,


    Your Serene Highness''s


    Vienna, the 6th of March


    1815.


    wholly most obedient and faithful servant


    von Triebenfeld'

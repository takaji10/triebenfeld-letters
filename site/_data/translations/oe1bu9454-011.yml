- page: 2
  en: 'to ferment; it is singular that nobody says anything to him about it, but rather pays him compliments.
    Russia treads all human rights in Poland into the dust; thousands of [uncertain: complaints] come
    in here, but nobody among the authorities deigns to lend a complainant his ear – There now prevails
    great confusion in all quarters, and God forbid that what smoulders under the ashes should turn to
    flame and break out in a frightful explosion. O my God, at this very moment I hear that Prince August
    will not take the power of attorney away from Cosmar – Is it possible that a son who has been treated
    by his father with overflowing kindness can think so, and can league himself with a convicted villain
    and robber against his father? I do not know in what category one is to place this. Here it can astonish
    nobody if the Courlandish and other creditors are suspicious, when the son''s own self so - acts -
    Ah, a pity about the 100 Rthl - Meanwhile, patience - Your Serene Highness have indeed spoken so much
    good of Prince Adolph, praising his head, his heart, and his firm attachment to his father - What
    do you think, most gracious Lord, if the honest young man were to be declared as [uncertain: Magirenn]
    - then you would after all have a son and a support on whom you could lean in old age. Tell me your
    opinion on this - the Prince Hardenberg will set this in train at once, if this has not been expressly
    forbidden in the testament of the old Prince Sacken, whose sole heir he is after all - One rescues
    the worthy young man from the claws of the villain, who [uncertain: schmelget] in good Adolph''s bonnet
    and [illegible]. Let Your Serene Highness take to heart this faithfully meant counsel, and if my proposal
    is agreeable to you, then only send Eberhard and give him a letter to the Prince State Chancellor,
    and a blank sheet for writing to the King as well - this then goes quickly and surely - B says the
    Prince would attend to this alone – M. Hun: however thinks it might well be necessary to submit a
    letter to the King — Ah, were this too to succeed, then all would have succeeded — Now, most gracious
    Prince, only have mercy and send me at least 100 Rthl, out of which I can pay Starben at least; he
    is really beginning to grumble. — As true as heaven is above us, I know of no counsel or help. It
    is so ragingly dear here, I live worse than a day-labourer. Surely you cannot possibly wish that,
    for all I do for you, I should perish in shame and mockery, vexation and hunger? I remain, until death,


    Your Serene Highness''s


    most obedient faithful servant


    Vienna, the 6th of March


    1815.


    v Triebenfeld'

- page: 3
  en: 'At this hour I learn / a report which comes from the [uncertain: Neuperg] Court, Cabinet Secretary
    of the Grand [uncertain: Duke] / that since today''s order the [uncertain: Austrian] army is being
    put on a war footing. That troops are already marching today and much artillery is being carried off
    to Italy — It is said that Murat is making [illegible: pertacte] and means also [illegible: einzerhoben]
    the King of Saxony and Napoleon — Mad stuff is being chattered, everything is reasoning about war
    — Saxony remains occupied by Prussia —'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! According to a [uncertain: firm] assurance,
    Your Serene Highness''s affair will come up this very week and will certainly be decided favourably.
    In the end, however, one would after all have been threshing empty straw, if no settlement should
    be brought about with the [uncertain: Churp.] heiress. I therefore beg by everything in the world
    to send Herr Eberhard here as speedily as possible, so that no new obstacle may arise. — Given the
    good will of His Serene Highness the Prince State Chancellor, everything could yet be arranged, if
    the settlement were concluded, even if now 50 or a hundred thousand more had to be given in all. The
    misfortune for the House of Hohenlohe would consist only in this, that the estates would have to be
    administered 5 years longer. Your Serene Highness will receive yearly, according to the first plan,
    10 or 12 Rthl, and if God grants good fortune, even if only 6000 Rthl yearly, then you can live happily,
    let who will administer the estates. No other, most gracious Lord, can then disturb you or diminish
    anything. Only let Your Serene Highness send Herr Eberhardt here in haste; the Congress may now come
    quickly to its end. Matters at the Congress change here like ebb and flood — now one flatters oneself
    to have won a little peace, but all too soon everyone is reasoning again about a very near war — the
    King of Saxony is at Pressburg; thither the Prince Talleyrand hastened immediately upon his arrival,
    and now the Emperor Franz and all, except our Lord, are to go thither — He persists obstinately in
    his self-will and will hear nothing of any partition of Saxony; he even believes he can demand back
    what is wanting. Upon what he so defiantly relies, nobody knows; whether he counts upon heavenly hosts
    or again upon southern robber-hordes, this is still unknown. But I believe that when he sees that
    our Lord is in true earnest, he will indeed submit, sign, and take what God has allotted him. The
    King of Würtemberg rages and threatens anew — it seems here and there to be fermenting'
- page: 2
  en: 'to ferment; it is singular that nobody says anything to him about it, but rather pays him compliments.
    Russia treads all human rights in Poland into the dust; thousands of [uncertain: Zernmieden] come
    in here, but none of the authorities deigns to lend an ear to a complainant. — Great confusion now
    reigns in all quarters, and God forbid that what smoulders beneath the ashes should turn to flame
    and break forth with a fearful explosion. O my God, at this very moment I hear that Prince August
    will not take the power of attorney from Cosmar. — Is it possible that a son, who has been treated
    by his father with overflowing kindness, can think so, and can join with a convicted villain and robber
    against his father? I do not know in what category one is to place this. Here it can astonish nobody
    if the Curish and other creditors grow suspicious, when the very son acts so. — Ah, a pity about the
    100 Rthl. — Meanwhile, patience. — Your Serene Highness has indeed said so much good of Prince Adolph,
    and praised his head, his heart, and his firm attachment to his father. — What do you think, most
    gracious Lord, if one were to have the honest young man declared as [uncertain: Magirenn] — then you
    would after all have a son and a support on whom you could lean in old age. Tell me your opinion on
    this. — Prince Hardenberg will set this in train at once, if it has not been expressly forbidden in
    the testament of the old Prince [uncertain: Sahkin / Sagan], whose heir he alone is after all. — One
    rescues the worthy young man from the claws of the villain, who [uncertain: schmelget] in good Adolph''s
    hood and [text lost] himself terribly. Let Your Serene Highness take to heart this faithfully meant
    counsel, and if my proposal is agreeable to you, then only send Eberhard, and give him a letter to
    the Prince State Chancellor, and a Blanquet for writing to the King along with it — this goes then
    quickly and surely. — B says the Prince would attend to this alone — M. Hun: however thinks it might
    well be necessary to submit a letter to the King. — Ah, if this too should succeed, then all would
    have succeeded. — Now, most gracious Prince, only have mercy and send me at least 100 Rthl, out of
    which I can at least pay Starben; he is really beginning to grumble. — I know, as truly as heaven
    is above us, of no counsel or help. It is so ragingly dear here; I live worse than a day-labourer.
    You cannot possibly wish that I, for all that I do for you, should perish in shame and mockery, vexation
    and hunger? I remain, until death, Your Serene Highness''s wholly most obedient faithful servant.
    Vienna, the 6th of March 1815. v Triebenfeld'
- page: 3
  en: 'At this hour I learn / a report which comes from the Privy Cabinet Secretary Neipperg / that since
    today''s order the Eastern Army is being put on a war footing. That already today troops are marching
    and much artillery is being carried off towards Italy. — It is said Murat is making [uncertain: &
    pertacte] and wishes also to [uncertain: einzerhoben] the King of Saxony to Napoleon. — Mad stuff
    is being chattered; everyone is reasoning about war. — Saxony remains occupied by Prussia. —'

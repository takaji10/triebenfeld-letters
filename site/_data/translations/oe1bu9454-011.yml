- page: 1
  en: '11


    Most Serene Prince,


    Most gracious Prince and Lord!


    According to a [uncertain: firm] assurance, Your Serene Highness''s affair will come up this very
    week and will certainly be decided favourably. In the end, however, one would after all have been
    threshing empty straw, should no settlement with the Churp. heiresses be brought about. I therefore
    beg, by all that is in the world, that Mr Eberhard be sent hither as speedily as possible, so that
    no new obstacles arise. — Given the good will of His Serene Highness the Prince State Chancellor,
    everything could nevertheless still be arranged, once the settlement were concluded, even if 50 or
    a hundred thousand more of them had to be given. The misfortune for the Hohenlohe house would consist
    only in this, that the estates would have to be administered 5 years longer.


    If Your Serene Highness receives yearly, according to the first plan, 10 or 12/m Rthl, and, if God
    grants good fortune, even only 6/m Rthl pension yearly, then you can live happily, let whoever will
    administer the estates. No other can then trouble you, most gracious Lord, or diminish anything. Only
    let Your Serene Highness send Mr Eberhard here in haste; the Congress may now come quickly to an end.


    Affairs at the Congress change here like the ebb and the flood — now one [uncertain: boasts] of having
    won a little peace, but too soon everything is again reasoning about a war very close at hand — the
    King of Saxony is in Pressburg; thither Prince Talleyrand hurried immediately upon his arrival, and
    now the Emperor Franz and all of them, except our Lord, are going there — He persists [uncertain:
    firmly] in his obstinacy and will hear nothing of a partition of Saxony; he believes he can even reclaim
    [uncertain: lack]. On what he so defiantly relies, nobody knows; whether he counts on [illegible:
    hinwelischen] hosts of armies or again on southern robber-hordes, this is still unknown. But I believe
    that when he sees that our Lord is in true earnest, he will indeed submit, sign, and take what God
    has allotted him. The King of Württemberg rages and threatens anew — here and there it seems to be
    fermenting'

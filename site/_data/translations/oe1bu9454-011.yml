- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    According to a firm assurance, Your Serene Highness''s affair will come up this very week and will
    certainly be decided favourably. In the end, however, one would after all have been threshing empty
    straw, if no settlement were to be brought about with the Churp. heiress. I therefore beg for all
    the world that Mr. "Eberhard be sent here as swiftly as possible, so that no new obstacle arises.
    — Given the good will of His Serene Highness the Prince State Chancellor, everything could nevertheless
    still be managed, if the settlement were concluded, even if now 50 or a hundred thousand more had
    to be given in all. The misfortune for the House of Hohenlohe would consist only in this, that the
    estates would have to be administered 5 years longer.


    If Your Serene Highness receives yearly, according to the first plan, 10 or 12 Rthl, and if God grants
    good fortune, even only 6000 Rthl yearly, then you can live happily, let whoever will administer the
    estates. No other can disturb you in that, most gracious Lord, nor diminish anything. Only let Your
    Serene Highness send Mr. Eberhardt here in haste; the Congress may now quickly come to an end.


    Matters at the Congress change here like ebb and flood — now one boasts of having won a modest peace,
    but too soon everything is talking again of a war very near at hand - the King of Saxony is at Preaburg;
    thither the Prince Talleyrand hastened immediately upon his arrival, and now the Emperor Franz and
    all, except our Lord, are going thither – He persists firmly in his obstinacy and will hear of no
    partition of Saxony; he even believes he can demand back what is wanting. On what he so defiantly
    relies, nobody knows; whether he counts on heavenly hosts or again on southern robber-hordes, this
    is still unknown. But I believe that when he sees that our Lord is in true earnest, then he will surely
    comply, sign, and take what God has allotted him. The King of Würtemberg rages and threatens anew
    – here and there it seems to be fermenting'

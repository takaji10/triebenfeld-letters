- page: 3
  en: 'At this hour I learn / a report which comes from the [uncertain: Privy Cabinet Secretary] Neuperg
    / that by today''s order the Austrian army is being placed on a war footing. That already today troops
    are marching and much artillery is being carried off to Italy - It is said that Murat is making [uncertain:
    & pertacte] and means also to bring in the King of Saxony to Napoleon - Mad stuff is being chattered;
    everything is talking of war - Saxony remains occupied by Prussia -'

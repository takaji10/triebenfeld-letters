status: draft
segments:
- page: 1
  en: 'Report of the Commission of Instruction on a conflict of jurisdiction raised by the Commission
    of Finances against a definitive judgment rendered in [1829] by the Supreme Tribunal, by virtue of
    which the sum of 30,000 Reichsthaler owed to Sieur Weigel was struck from the mortgage on the Trąbczyn
    property belonging to the Dame Miączyńska.


    The Prussian Government, having in 1796 confiscated the property of Trąbczyn belonging to the Starost
    Prusimski, gave it in full ownership to Prince Hohenlohe-Ingelfingen.


    In 1800, Prince Hohenlohe, having borrowed from a Sieur Grotowski the sum of 30,000 Reichsthaler,
    this claim was inscribed in the mortgage book of the Trąbczyn estate. Later, in 1807, the daughter
    of the late Starost Prusimski, Micheline — by her first marriage Dąbska,'
- page: 2
  en: 'by her second Miączyńska — presented to His Majesty the Emperor Napoleon a petition in which she
    sought the restitution of the property confiscated from her Father.


    This petition having at the time been referred to the Governing Commission of the country, the latter
    rendered, on 5 June of the same year, a decree ordering that the Dame Miączyńska be restored to possession
    of the Trąbczyn estate, the patrimony of her late father.


    The Court of Appeal of the Department of Posen, in carrying this decree into execution, had the title
    of Ownership of the Dame Miączyńska to the Trąbczyn estate inscribed in the mortgage book, but with
    the express reservation of the rights of third parties.


    In 1808, Sieur Weigel presented himself before the competent mortgage authority as Assignee'
- page: 3
  en: 'of the sum of 30,000 Reichsthaler owed to Grotowski and mortgaged upon the Trąbczyn estate, and
    obtained the inscription of the said sum in his own name.


    In 1808, Prince Hohenlohe, wishing to re-enter into possession of the said property, brought an action
    before the Tribunal of Kalisz against the Dame Miączyńska. — The Tribunal of Kalisz, having alleged
    that the examination of the acts of the Sovereign authority was not within the Tribunal''s province,
    and that the matter in question had been decided by the Supreme Authority, declared itself incompetent
    to judge the case. —


    In 1810, the said Weigel brought before the Tribunal of Kalisz a suit against the Dame Miączyńska
    for the payment of the accumulated interest on the sum of 30,000 Reichsthaler.


    The Tribunal, having taken into consideration:'
- page: 4
  en: '1° that in the matter at issue the decree of the Governing Commission had to be taken as the basis,
    which, regarded as a special privilege, formed an exception to the general laws;


    2° that it follows from the spirit of the said decree that, in causing'
- page: 5
  en: 'the Dame Miączyńska to be reinstated in the possession of her property confiscated by [the] decree,
    [the intention] was to restore it to her in the state in which it stood at the time of the confiscation;
    for otherwise the restitution would become an onerous burden, seeing that the debts contracted by
    the Donee exceed the value of the restored property.


    3° that His Majesty the King of Prussia was deemed the legitimate possessor of property confiscated
    from private individuals only so long as his Authority was in force in the country; but that from
    the moment it ceased to exist, the new Government of the country, in restoring the property to the
    original proprietors, has consequently annulled the title of possession attached to the former Sovereign
    and has in fact regarded him only as a conditional possessor.


    4° that the Donee could not acquire more extensive rights than those of his Donor; that thus,'
- page: 6
  en: '[upon] the cessation of the Authority of His Prussian Majesty in this country, the rights of ownership
    to the confiscated property likewise ceased, as did their effects; that is to say the donation, and
    consequently the acts done by the Donee are likewise declared null, and namely the debts contracted
    upon the fortune of another, and this nullity of rights extended likewise to the creditor of Prince
    Hohenlohe, Sieur Grotowski, as well as to the assignee of the latter, Sieur Weigel — on these grounds
    the Tribunal, having rejected Weigel''s demand, acquiesced in that of the Dame Miączyńska and consequently
    had the claim of 30,000 Reichsthaler struck from the mortgage registers of the Trąbczyn property.


    The two parties appealed from this judgment. — Both reproduced the submissions they had presented
    at first instance. Weigel demanded the award'
- page: 7
  en: 'of the interest; the Dame Miączyńska objected to the incompetence of the Tribunal.


    By its Ruling of 9 November 1820, the Court of Appeal, in deciding the question of incompetence, rejected
    it, seeing that the cause, arising from a mortgage obligation, fell within the competence of the Tribunals
    — all the more so since the Dame Miączyńska, having brought before the Tribunals the demand for the
    cancellation of the sums claimed by Weigel, had herself recognized them as competent in the matter.


    As regards the merits of the case, the same ruling of the Court of Appeal, having annulled the judgment
    of the Tribunal of Kalisz, ordered the summoning of the personal debtor, namely Prince Hohenlohe.


    The Dame Miączyńska, in her memorial brought before the Supreme Court, demanded that Weigel''s cause,
    as infringing'
- page: 8
  en: 'upon the rights of Sovereignty, not be admitted. —


    The means of defence having been exhausted on both sides, there intervened, on 15 and 17 July 1826,
    a ruling of the said Court by which the recourse was admitted and the judgment of the Tribunal of
    Kalisz confirmed. —


    The principal grounds on which the Supreme Court founded its decision are the following:


    1° that the effects of the confiscation as well as of the donation, being a consequence of the circumstances
    of the time, could last only so long as there existed the order of things which produced them.


    2° that the spirit and aim of the decree of the former Governing Commission could be none other than
    that the original proprietor be reinstated in the fullness of the rights he enjoyed at the moment
    he was dispossessed of them.


    3° that the Tribunal, in the grounds'
- page: 9
  en: 'of its judgment, has, in accordance with the real state of things, established that the decree
    of the former Governing Commission must be taken as the basis of the decision.


    4° that the principal aim which the Supreme Authority set itself in restoring the property to the
    original proprietor would be defeated if these properties remained encumbered with debts he did not
    contract, which, exceeding the real value of the said property, would render the benefit illusory.


    5° finally, that the acts both of the Government of the country and those of the Prussian Government
    have established this principle, that the original possessor reinstated in his ownership cannot be
    held responsible for claims that might be raised by third parties bound in their interests.


    Such was the course this affair followed in the judicial channel. It remains now to retrace the one
    it followed in the administrative channel.'
- page: 10
  en: 'In 1811, the Dame Miączyńska petitioned the King of Saxony, then Duke of Warsaw, for an injunction
    to strike from the mortgage registers of the Trąbczyn estate the debts contracted by Prince Hohenlohe,
    the former Prussian Donee.


    The Minister of Justice, to whom this petition was communicated, declared that:


    the examination of the question whether the debts contracted by mortgage by Prince Hohenlohe upon
    the aforesaid property ought or ought not to be struck from the mortgage registers fell within the
    province of the Tribunals.


    The said Dame, addressing herself later to the Liquidation Commission, framed the demand that the
    debts encumbering her Trąbczyn estate might be included in the category of debts chargeable to Prussia,
    which, by placing her beyond the reach of the creditors'' pursuits,'
- page: 11
  en: 'would assure her the full and entire enjoyment of her patrimony.


    The Liquidation Commission, after having examined in depth the claims of the Dame Prusimska, presented
    in 1818 its report, in this regard, to the late Prince Czapyski, Minister of the Kingdom, in which,
    after tracing the history of the affair, it expressed the following opinion:


    that the claims of the Dame Miączyńska ought to be set forth in their true light to His Majesty the
    King of Prussia by diplomatic channels, and if that Sovereign refused to have discharged from his
    treasury the debts contracted by Prince Hohenlohe and mortgaged upon the Trąbczyn estate, it is only
    then that the pretensions of the Dame Miączyńska might be brought before the Trilateral Liquidation
    Commission, to be included there among the passive debts of the Duchy of Warsaw, which fall to the'
- page: 12
  en: 'charge of three high Courts.


    Sharing in all points the opinion of the Liquidation Commission, the late Prince Czapski presented
    an analogous report to His Majesty the Emperor and King.


    In 1819, following the aforementioned report, the Minister of State Affairs communicated to the First
    Lieutenant a reply from the Prussian Ministry, accompanied by a memorandum in which all the allegations
    of the Dame Miączyńska were refuted and her demand recognized as inadmissible. —


    The Lieutenant of the King, by his rescript of 24 September, had this document transmitted to the
    liquidating Commissioners, and matters rested there.


    For his part, Sieur Weigel, independently of the appeal he had lodged from the judgment rendered by
    the Tribunal of Kalisz, further invoked the assistance of his'
- page: 13
  en: 'Government, requesting its intervention in this regard with the Polish Government.


    Indeed, the Ministry of Berlin, interceding in favour of Sieur Weigel, set forth by diplomatic channels
    that the Tribunal of Kalisz, called by the nature of its attributions to take cognizance solely of
    questions of Civil law, had exceeded the bounds of its powers in deciding upon a question of political
    law and of the law of nations, and it demanded in consequence that the question of whether:


    the claims encumbering the Trąbczyn estate ought to be struck from the mortgage registers of the aforesaid
    property without prior discharge —


    be withdrawn from the cognizance of the Tribunals to be submitted to decision by diplomatic channels.
    —


    This claim having been'
- page: 14
  en: 'communicated by the Minister Secretary of State to the First Lieutenant of the King, the latter
    conveyed it to the Commission of Justice, which declared, for its part:


    that the affair in question having been brought to the decision of the Court of Appeal, a detailed
    report in this regard would be premature, for if the said Court reforms the judgment of the Tribunal
    of Kalisz, by that very fact the claim of the cabinet of Berlin will be satisfied.


    Later, the judgment of the Court of Appeal having intervened, the Commission of Justice submits to
    the First Lieutenant, on 12 January 1821, a report with this observation:


    that the ruling of the Court of Appeal had indeed reformed the judgment of the Tribunal of Kalisz,
    but that nevertheless the affair could not be'
- page: 15
  en: 'regarded as concluded, since it was indispensable to have Prince Hohenlohe summoned as the original
    debtor.


    While these various communications were taking place by diplomatic and administrative channels, there
    intervened in 1826 the Definitive sentence of the Supreme Tribunal which, confirming the decision
    of the Court of Appeal, upheld the judgment rendered by the Tribunal of Kalisz. —


    This sentence provoked fresh claims on the part of the Prussian Government, following which various
    opinions were rendered both by the Commission of Finances and by that of Justice. —


    Finally, after long debates, the former Council of Administration, adopting the proposal of Mr. the
    Prince Lubecki, then Minister of Finances, authorized — by a decision taken at the session of 4 October
    1829 — the Commission of Finances and of the Treasury to raise a conflict of jurisdiction on the ground
    of the incompetence of the Tribunals in the affair in question.


    It was by virtue of this authorization that the said Commission presented, in July 1830, to the Council
    of State, a report on the affair in question.'
- page: 16
  en: 'Two principal arguments serve as the basis of the developments it presents therein, namely:


    1° that the Tribunals, in pronouncing in the affair in question, gave an ironical interpretation to
    the decree of the former Governing Commission by virtue of which the Dame Miączyńska was reinstated
    in her property, and that they thereby infringed upon the Treaty of the State.


    2° that the Tribunals, in exceeding the limits of their power, arrogated to themselves cognizance
    of a matter outside their attributions and thereby encroached upon the rights of the Sovereign.


    The Commission of Instruction, as regards the first argument of the Commission of Finances, observes
    that throughout its exposition it strives to prove only that the Tribunal of Kalisz and the Supreme
    Tribunal misapplied in their judgments the decree of the former Governing Commission; that the aim
    of this decree was quite other than that which the said Tribunals ascribed to it, as is shown'
- page: 17
  en: 'more clearly by the Convention of 8/20 February 1822 concluded between the Polish and Prussian
    Governments; in a word, the Commission of Finances applies itself to proving that the Tribunals judged
    wrongly and that they ought to have judged otherwise; but it in no way proves that these same Tribunals
    ought to have abstained entirely from taking cognizance of this affair and rendered no judgment, neither
    good nor bad; and yet it is this latter assertion which, had it been able to be clearly demonstrated,
    could alone have given ground for a conflict of jurisdiction; the Commission not having done so, it
    follows that the whole of the reasoning it deduces cannot justify its conclusion. —


    As regards the second argument of the Commission of Finances, namely:


    that the Tribunals were competent to decide the affair according to the principles of civil law, but
    that they were incompetent to'
- page: 18
  en: 'pronounce on the matters by taking as their basis the decree of the former Governing Commission,
    and that thus, in ruling according to this latter rule, they encroached upon the attributions of the
    Sovereign authority.


    The Commission of Instruction believes it must set forth the following observations.


    The Commission of Finances itself acknowledges that the Tribunals were competent to judge the dispute
    raised between Sieur Weigel and the Dame Miączyńska; but it contests them only the faculty of interpreting
    the decree of the former Governing Commission, and of taking this decree as the basis of its judgment.


    Thus, while striving to prove the contrary, the Commission of Finances could not avoid conceding:


    that, as regards the matter, the Civil Tribunals were incontestably competent, but that they merely
    judged in an improper manner.


    And this conviction, so well founded, acquires still more weight from what the Commission of Finances
    declares'
- page: 19
  en: 'itself:


    that the competence of the Tribunal cannot otherwise be established than by the nature of the object
    in litigation. —


    Now, here the object in litigation was mortgage claims; now, claims by their nature are indubitably
    within the province of the Civil Tribunals, and the latter, being legally invested with the [power]
    to decide questions arising from mortgage obligations, could no longer become incompetent in the course
    of the suit, since they did not depart from the matter and since their judgments confine themselves
    strictly to resolving the question whether a claim ought to be struck from the mortgage book. —


    The Commission of Finances itself acknowledges that it is necessarily within the attribution of the
    Tribunals to have a claim struck from the mortgage book, [and] to declare the obligation as having
    ceased to exist. —


    Now the Tribunals, in pronouncing the cancellation of the claim, acted within the circle of their
    attributions. What was the basis of their decision is another question.'
- page: 20
  en: 'But once the competence of the Tribunals is recognized according to the principles invoked by the
    Commission of Finances itself, then in pronouncing in the affair in question they did not exceed the
    bounds of their attributions, nor did they make any infringement of the prerogative of the Sovereign
    authority; and irrefutable proof of this is found in the Supreme decision of His Majesty the Emperor
    Alexander of 4 September 1821, where it is said:


    that the course of the proceedings in the affair of Sieur Weigel against the Dame Miączyńska ought
    not to be impeded.


    Could the Tribunals decide, according to the principles of civil law, a question arising from public
    law? Did they arrogate to themselves the faculty of interpreting public law? In what sense did they
    understand the latter? All these questions cannot here be the object of any particular examination,
    for they have no bearing on the question of competence, irrevocably established by the nature of the
    object in'
- page: 21
  en: 'litigation.


    The Commission of Instruction will confine itself merely to observing that the interpretation of Decrees
    emanating from the Supreme Authority belongs indubitably to the Sovereign whenever [the latter] avail
    themselves of it and the necessity thereof is recognized, but the application of this Decree in civil
    relations between private individuals cannot, either, be contested to the Civil Tribunals. —


    The interpretation of the Sovereign can only have for its aim to enlighten the Tribunals as to the
    manner of applying a law or a Decree of the Sovereign; but so long as no such authentic interpretation
    exists, the Tribunals are bound to apply the law or the Decree in civil relations between private
    individuals according to the judge''s own inmost conviction, arising from the spirit and the letter
    of the law or of the decree. —


    Now the Tribunals must draw the grounds of their judgments solely from the ordinary law, without regard
    to a special decree which forms'
- page: 22
  en: precisely an exception to these laws; this is an assertion that is not tenable, for otherwise the
    Tribunal, upon the demand of Prince de Hohenlohe — who claimed that the Trąbczyn property be returned
    to him — would have had to adjudge him the possession of these properties by virtue of civil law,
    without taking into consideration the Special decree rendered by the former Governing Commission which
    caused the said property to be restored to the Dame Miączyńska.
- page: 23
  en: 'The analogy which the Commission of Finances seeks to establish between the affair of Weigel and
    that of Sieur Godłewski — concerning a dispute over the boundaries between the lands of the latter
    and those of a domain of the State, and which had likewise given rise to a conflict of jurisdiction
    — cannot here serve as a precedent, for the reason that the declaration of conflict of jurisdiction
    had there preceded the judgment of the Tribunal, whereas in the affair of Weigel the conflict of jurisdiction
    was declared several years after the affair had been definitively judged at third and last instance.


    Finally, to justify'
- page: 24
  en: 'the present conflict, the Commission of Finances alleges the following grounds.


    a° that a conflict of jurisdiction may be invoked even in the case where the action is prosecuted
    between two private parties without the Government being interested therein.


    b° that a like conflict may be raised even against a ruling of the Supreme Court which has already
    acquired the force of res judicata.


    c° that, in bringing this conflict of jurisdiction to the decision of the Council of State, the Commission
    does not place itself in contradiction with the Supreme decision providing that in this affair there
    was no ground to impede the judicial course in the ordinary channel of the Tribunals.'
- page: 25
  en: 'To these three grounds the Commission of Instruction opposes the following observations:


    ad a. — To prove that, in a suit between two private parties — one which, without participation or
    concurrence of the Government, had been judged in the three judicial instances — a conflict of jurisdiction
    could be raised, the Commission of Finances alleges as an example two fictitious cases in which the
    Civil Tribunals would have caused to be separated from the landed property the taxes entered as a
    charge attaching to the person, which would suffice to annihilate the whole collection of revenues,
    if the treasury had no other means of annulling this judicial ruling than that of the intervention
    and opposition of a third party.


    But from the example alleged above one can infer nothing other than that, if ever, in consequence
    of the cessation of the collection of taxes, the danger to the treasury were real, [there] would arise
    the necessity of forming an intervention or a third-party opposition; but when, according to the'
- page: 26
  en: 'provisions of the law, decrees definitively intervened are binding only on the parties who are
    interested in the suit [and] who are duly summoned to it, this circumstance dispels all fears that
    such rulings might infringe upon the rights of the treasury, which, on the contrary — without needing
    to form an intervention or third-party opposition, and without regard to rulings rendered in respect
    of which it has not intervened — could effect the collection of taxes by the economic-administrative
    channel. —


    The allegation that the Tribunals ought to have recognized their incompetence as soon as the question
    of civil law changed into a diplomatic question can likewise not be admitted, seeing that the conclusions
    and reasonings of the Commission of Finances itself prove that the Tribunals, whose competence has
    already been recognized as to the nature of the object submitted to their cognizance, could not become
    incompetent when, in their judgments, they did not depart from that nature; and one might here further
    add that'
- page: 27
  en: 'the imputation made against the Tribunals that it did not belong to them to interpret the decree
    of the former Governing Commission is mitigated by the Supreme decision of 4 September 1821, which
    on the contrary upheld the course in the judicial channel of the suit in question.


    all the more so since this decision was rendered after the Tribunal of Kalisz had already interpreted
    the aforesaid decree, and after a claim made by the Prussian Government against the judgment of the
    said Tribunal.


    Moreover, it would be superfluous to seek to prove that a purely civil cause could become diplomatic.
    —


    ad b. — The judgment of the Supreme Tribunal, intervened in 1826, by reason of its being definitive
    must be regarded as unassailable, since Art. 1 of the former Constitution { then in force } says,
    presuming that: "This Tribunal is charged with judging at last resort all civil causes."


    Neither the former nor the new organization of the Council of State has'
- page: 28
  en: 'conferred upon it the attributions of the Court of Cassation; on the contrary, these attributions
    are attached to the Supreme Tribunal.


    The Commission of Finances, giving a new extension to the provisions of the former Constitution as
    well as to an article of the former organization of the Council of State, and generalizing them, strives
    to demonstrate that the powers of the Council of State have no limits, that it can not only prevent
    the administrative and judicial authorities from encroaching upon their respective attributions, but
    further quash a judgment rendered on the merits by one authority without opposition on the part of
    the other, and [has] this power to annul that judgment and consequently to pronounce absolutely as
    a Court of Cassation. —


    To convince oneself how far these assertions — as well as the extensive interpretation of the provisions
    of the former Constitution and of Art. 31 of the organization of the former Council'
- page: 29
  en: 'of State — are well founded, it suffices to give attention to the origin of a conflict of jurisdiction
    and to its nature. —


    Special regulations have traced certain limits between the power of the Civil Tribunals and that of
    the administrative Tribunals and authorities, by determining what falls within their respective provinces,
    that is to say what is the circle of their respective attributions within which they must confine
    themselves. —


    Thus, according to the former and the new organization of the Council of State, a conflict of jurisdiction
    arises:


    when the Civil Tribunal believes that an administrative authority seeks to encroach upon its attributions,
    or reciprocally when an administrative authority imputes a like encroachment to a Tribunal.


    In this case the authority which has a ground for complaint is bound to forewarn the other through
    its President'
- page: 30
  en: 'by declaring a conflict of jurisdiction. —


    If this declaration remains without effect, and the authority forewarned does not declare, within
    the period of 8 days, that it desists from all further action, then the authority which raised the
    conflict makes its Report thereof to the respective Governing Commission, which submits the affair
    to the decision of the Council of State, which, in conformity with the rules indicated, determines
    which of the authorities — whether judicial or administrative — is competent to pronounce in the affair
    that gave rise to the conflict. —


    Now, for a conflict of jurisdiction to be legitimately raised, the concurrence of the four following
    conditions is required:


    1° a declaration of conflict by the President of the Tribunal before the President of the Instituting
    Commission, to forewarn the other party that it does not have the power to rule on the matter submitted
    to its decision'
- page: 31
  en: '2° to leave to the authorities in conflict the faculty of settling, within the period of 8 days,
    so as to have the conflict amicably lifted. —


    3° to denounce the conflict to the respective Governing Commission, if it could not be amicably settled.


    4° to produce to the Council of State the proof that a conflict between two authorities has effectively
    taken place. —'
- page: 32
  en: 'It remains now to examine whether the case presented by the Commission of Finances as a conflict
    between the authority of the Throne and the Tribunals is really a conflict of jurisdiction understood
    in the legal sense, namely: a conflict of jurisdiction between the Tribunals and the administrative
    authorities. —


    The dispute between Sieur Weigel and the Dame Miączyńska had for its object the validity or invalidity'
- page: 33
  en: 'of the claim of the former, mortgaged upon the Trąbczyn property; thus it was a question arising
    from purely Civil relations. —


    The Commission of Finances, while acknowledging the competence of the Tribunals to judge this affair,
    contests them only the faculty of interpreting the decree of the former Governing Commission and of
    basing their decision on that same decree. — Now, in fact, the Commission of Finances imputes to them
    that they pronounced illegally.


    The decision of a Tribunal is a final result that cannot be foreseen in advance. — It follows that,
    since the Tribunal, by reason of the nature of the object in litigation, was recognized as competent,
    the conflict of jurisdiction could not have been raised, seeing that the decision of the Tribunal
    could not be foreseen. —


    This conflict of jurisdiction not having been able to be declared, and none of the 4 conditions mentioned
    above having established its existence, and the proof produced by the'
- page: 34
  en: 'Commission of Finances itself, far from demonstrating the existence of a conflict of jurisdiction,
    demonstrating only that the affair had, several years before, been decided at third and last instance
    by the Supreme Tribunal — it follows that, in the case at issue, no conflict of jurisdiction had existed,
    as none exists at present.


    But the Commission of Finances, in protesting against a ruling that is definitive and has passed into
    the force of res judicata, not having been able to have in view a conflict of jurisdiction such as
    is provided for and determined by the organization of the Council of State — and which has for its
    aim to cause the decision of an affair to be stayed, for such a conflict would not have answered the
    aim of annulling a judgment against which the Commission of Finances brings recourse — found itself
    constrained to give the regulatory provisions an extension analogous to its views, and consequently
    it took it upon itself to demonstrate that, independently of the conflicts of jurisdiction'
- page: 35
  en: 'such as the organization of the Council determines — namely, conflicts which have for their aim
    to prevent a decision that would encroach upon the attributions of another authority — there exists
    yet another conflict, unlimited in its scope and in its consequence, by means of which any definitive
    judgment having the force of res judicata may be assailed. —


    But such an interpretation of the organization of the Council of State demonstrates that, according
    to the opinion of the Commission of Finances, the consequence of this new species of conflict ought
    to be:


    that the notification of a conflict would no longer be bounded by any period of time; that the jurisdiction
    of any Tribunal, purely civil or administrative, could be contested even several years after the definitive
    judgment rendered by it; that rulings rendered whether by the Civil Tribunals or by the Administrative
    Tribunals could be annulled at all times indefinitely, and the'
- page: 36
  en: 'affairs remitted [to the proper forum] as of right; that the Court which would have to decide such
    a conflict would be a Court of Cassation with unlimited power; that consequently it could, without
    regard to prescription, annul all civil relations legally established, efface and abolish the rights
    legally acquired by each person, whenever the authority of the Tribunal which consolidated them had
    been contested.


    The consequences strictly deduced from the extension given by the Commission of Finances to the provisions
    of the organization of the Council of State prove that such a species of conflict of jurisdiction,
    and such a kind of Civil-judicial attribution, are incompatible with the organization of the Council
    of State regarded as a Supreme administrative Tribunal; that the action which the Commission of Government
    calls a conflict of jurisdiction is in effect a recourse brought by way of cassation to the Council
    of State regarded as a Court of Cassation.


    ad c. — The Supreme decision of 4 September'
- page: 37
  en: '1821, which declares that the course of ordinary justice in this affair ought not to be impeded,
    is so clear and so precise that it admits of no interpretation; and for this it suffices to direct
    attention to the facts which had preceded this decision. —


    The Tribunal of Kalisz, basing its decision on the decree of the former Governing Commission, had
    the claim of Sieur Weigel struck from the mortgage book of the Trąbczyn estate. The latter, having
    addressed his claims to the Prussian Government, which by a Ministerial note protested against the
    competence of the Tribunal and demanded that the affair be referred to the diplomatic channel. —


    The Commission of Justice, invited to give its opinion in this regard, declared in its report of 12
    January 1821:


    "that to resolve this affair there were but two channels, namely the political channel and the judicial.
    —


    "As, however, the Government cannot rule upon the rights'
- page: 38
  en: '"of a third party (that is to say, of Weigel) to the prejudice of the adverse party, namely the
    Dame Miączyńska, the Commission of Justice was of opinion that, for the first case — namely a political
    arrangement — it would be necessary either to engage the Prussian Government to discharge the debts
    contracted by Prince de Hohenlohe upon the Trąbczyn estate, or that the Government of the Kingdom
    take this obligation upon itself; that, finally, for the case where the affair could not be arranged
    by diplomatic channels, its decision had to be left to the civil Tribunals as the sole legal channel."


    It is following this report — and while reserving to itself cognizance of what advantages had been
    granted to other private individuals reinstated in the possession of their confiscated property, [as
    compared] with those to whom these properties had been conceded by the Prussian Government, as well
    as of the extent of the obligations that would result for the Treasury of the Kingdom if it were to
    undertake to satisfy all claims of this kind — that the late His Majesty the Emperor'
- page: 39
  en: 'and King had decided that the judicial course in this affair ought in no way to be impeded.


    Now the argument which the Commission of Finances draws from the date of this Supreme decision — that
    it appeared at the moment when the Court of Appeal annulled the judgment of the Civil Tribunal, in
    order to conclude therefrom that the said Court had then restored to this affair its purely civil
    character — gives occasion for the following observations:


    The Court of Appeal, in annulling the judgment of the Tribunal of Kalisz solely for the reason that
    Prince Hohenlohe had not been summoned as debtor, in no way thereby changed the nature of the affair
    itself; it could not convert it into a suit purely Civil and arising from civil relations, for according
    to the opinion of the Commission of Government itself this cause was, from the first, purely Civil.
    — The Court did not rid [it] of extraneous elements other than those arising from the relations of
    policy, of the right of Sovereignty, and from diplomatic relations. —'
- page: 40
  en: 'for a suit involving a mortgage charge had nothing in common with those relations. — The Court
    of Appeal ruled only on the necessity of having Prince Hohenlohe summoned as debtor; thus the substance
    of the affair always remained the same, for it was always a matter of a dispute raised in consequence
    of a decree of the former Governing Commission. It follows, therefore, that the Supreme decision of
    4 September 1821, having upheld the judicial course in the suit in question, is not susceptible of
    all the restrictions which the Commission of Finances seeks to deduce from it. —


    In conformity with this development, and taking into consideration that, according to Arts. 31, 32,
    33, 34 and 38 of the former, and under the terms of Arts. 37, 38, 39, 40 and 41 of the New organization
    of the Council of State, the law knows no conflicts of jurisdiction other than those which precede
    a definitive judgment of a Tribunal in an affair, and following which the Council of State decides
    the question whether it is the Tribunal or the administrative authority that must judge'
- page: 41
  en: 'the affair that gave rise to the conflict;


    that the imputation of incompetence made by the Commission of Finances against the Tribunals, after
    the affair between Sieur Weigel and the Dame Miączyńska had been definitively judged at last Instance
    and without prior declaration in due time of a conflict of jurisdiction, bears none of the characteristics
    proper to a conflict of jurisdiction. —


    that likewise, the case denounced by the Commission of Finances being really a conflict of jurisdiction,
    even so it could no longer be decided by the Council, having regard to the Supreme decision of 4 September
    1821 providing that the judicial course followed in this cause cannot be impeded;


    that since, under the denomination of conflict of jurisdiction, the Commission of Finances has presented
    a recourse by way of cassation tending to quash a judgment of the Supreme Court rendered at last instance
    and passed into the force of res judicata, it follows that the Council of State, not being invested
    by its Organization with the attributions of a Court of Cassation, cannot decide such a recourse.
    —


    For these grounds the Commission'
- page: 42
  en: 'of Instruction is of opinion:


    That, while acknowledging the non-existence of the conflict of jurisdiction concerning the suit between
    Sieur Weigel and the Dame Miączyńska, the Council of State set aside the demand of the Commission
    of Finances as being based on no legal principle.


    The Commission of Instruction presents a draft Decree drawn up in conformity with its conclusions.


    Done at the Session of the Commission of Instruction, Warsaw, 28 October 1834.


    The President


    [signed] Faltz'

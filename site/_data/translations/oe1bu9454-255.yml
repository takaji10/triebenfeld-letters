- page: 2
  en: 'and everything that is Prussian, but the D[?] departs from here for Berlin – the Emperor; all the
    rest follows with everything belonging to his court on the 10th to that place, and at the same time
    all the other sovereigns and other high personages; then too the worthy Emperor Franz sets out on
    his journey thither, and presumably this will last through the Carnival. To Your Serene Highness I
    shall now write no further. May you also be pleased to send no further letters to me, for on the 11th
    of [uncertain: M] I intend to lay myself personally at your most exalted feet. – In deepest reverence
    I remain


    Your Serene Highness''s


    Vienna, the 30th of November


    1814.


    faithful and most obedient servant


    v. Triebenfeld'

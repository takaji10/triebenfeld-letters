segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    His Serene Highness the Prince State Chancellor has today already kept to his room and bed for the
    5th day. If anyone quietly prays to God for the preservation of this man, then truly I do so. [uncertain:
    Not only that] the whole machine would come to a standstill, but Your Serene Highness''s affairs would
    be left lying half-way. At present everything still stands very well – Prince H. wishes Your Serene
    Highness to be helped; may God preserve him for that – the gentleman''s labours are exorbitant, and
    notwithstanding this he has written up Your Serene Highness''s matters, so far as I submitted them,
    entirely himself. A true proof that he means to help. The Prince has required a further report, but
    from where I do not know; only Minister Humboldt seems to know more, yet says nothing further than
    that we already had a won game – Court Councillor Hahn''s opinion has had its effect besides, because
    everything I have said is confirmed by it. I hope, with firm trust in God, that Your Serene Highness,
    through the help of the exalted Prince Hard:, will now yet enjoy a very peaceful and happy old age.
    Of Your Serene Highness''s military affairs there is at present complete silence; B., however, says
    this is kept in reserve and laid aside until Berlin – which is well too, for there the helpers are
    more numerous. For the present everything depends solely upon the Courland matter being brought to
    an end, so that Your Serene Highness may be rid of this dreadful business, that Cosmar may be overthrown,
    and that you may come into possession of the estates as actual lord of the entailed estate, and no
    longer have to live there on the mercy of your servants. Everything else will then follow of itself.
    – Just now B. was able to, and brings me the news, that His Majesty the King'

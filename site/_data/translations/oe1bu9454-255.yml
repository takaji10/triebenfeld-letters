- page: 2
  en: 'and all that is Prussian departs from here for Berlin on the 8th of December — the Emperor Alles
    ander follows thither on the 10th with all that belongs to his court, and at the same time all the
    other sovereigns and other high personages; then the worthy Emperor Franz too sets out on his journey
    thither, and presumably this will last through the Carnival — To Your Serene Highness I shall now
    write no further. May you also be pleased to send no further letters to me, for on the 11th of [uncertain:
    next month] I think to lay myself personally at your most exalted feet —


    In deepest reverence I remain


    Your Serene Highness''s


    Vienna, the 30th of November


    1814.


    most faithful and obedient servant


    v Triebenfeld'

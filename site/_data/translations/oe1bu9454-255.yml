  en: '255


    Most Serene Prince


    Most gracious Prince and Lord!


    His Serene Highness the Prince State Chancellor has today for the fifth day kept to his room and his
    bed. If anyone quietly prays to God for the preservation of this man, then it is truly I who do. Not
    only would the whole machine come to a standstill, but Your Serene Highness''s affairs would be left
    lying half-way. For the present everything still stands very well — the Prince H. wishes Your Serene
    Highness to be helped; may God then preserve him — the gentleman''s labours are exorbitant, and notwithstanding
    this he has, of Your Serene Highness''s matters, so many of them as I submitted, assigned to himself
    alone. A true proof that he means to help. The Prince has required a further report, but from whence
    I do not know; only the Minister Wilhelm von Humboldt appears to know more, yet says nothing further
    than that we already have the game won — Court Councillor Hahn''s opinion has still had its effect,
    because thereby everything I have said is confirmed — I hope, with [uncertain: firm] trust in God,
    that Your Serene Highness, through the help of the exalted Prince Hard:, will now yet enjoy a very
    peaceful and happy old age. Concerning Your Serene Highness''s military affairs, one is now wholly
    silent; Barbe, however, says this is being kept in reserve and laid aside until Berlin — That too
    is well, for there the helpers are more numerous — For the present everything depends only on this,
    that the Courland matter be brought to an end, that Your Serene Highness be rid of this dreadful business;
    that Cosmar be thrown out, and that you, as actual lord of the entailed estate, come into possession
    of the estates, and need no longer live there on the mercy of your own servants. Everything else will
    then follow of itself — Just now Barbe [uncertain: came] — and brings me the news that His Majesty
    the King'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord!


    The certain exchange of estates is now in train, and perhaps the matter will shortly be settled. I
    go to Berlin at the beginning of September, and shall be permitted to remain until the end of the
    same month.


    The foremost good fortune of which I hope to partake in Berlin is to see Your Most Serene Highness
    again in good health, and to be able to lay myself personally at your exalted feet, whereupon I shall
    render the most faithful report upon several matters of business.


    In deepest reverence I remain, until death, Your Most Serene Highness''s, Breslau, the 23rd of August
    1798, most faithful and humble and obedient servant, v. Triebenfeld'

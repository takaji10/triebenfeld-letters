- page: 1
  en: '76


    Most Serene Prince,


    Most gracious Lord!


    The said exchange of estates is now under way, and perhaps the matter will shortly be settled. I shall
    go to Berlin at the beginning of September, and shall remain there until the end of that same month.
    The chief good fortune which I hope to partake of in Berlin is to see Your Most Serene Highness again
    in health, and to be able to lay myself personally at the feet of the same, whereupon I shall then
    render the most faithful report upon several matters of business.


    In deepest reverence I remain, until death, Your Most Serene Highness''s Wrocław, the 23rd of August
    1798. truly most humble and obedient servant v Triebenfeld'

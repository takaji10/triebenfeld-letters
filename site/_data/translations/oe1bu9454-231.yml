  en: '231


    Right Honourable,


    highly revered Sir and Friend!


    A few weeks ago I was in Kalisz [uncertain: on] my own business, whereby I at the same time hoped
    to see and to speak with you, my esteemed friend, there; which pleasure, however, I had to forgo,
    nor could I learn with certainty the place of your present sojourn, since otherwise I should have
    paid you my visit; but as I nevertheless very much wished to confer and take counsel with you concerning
    the affairs between your Prince of Hohenlohe and myself, I would herewith politely beg you only to
    be so good as to appoint a day on which I might have the pleasure of finding you in Kalisz, or wherever
    else you may desire it; I shall recognise this as a proof of the friendship you bear towards me, and
    shall always let myself be found ready for every return of kindness. In expectation of an obliging
    and speedy answer I am unchangingly Your Right Honourable''s


    Wrocław, 9th January 1812


    devoted friend and servant


    C. F. Weigel'

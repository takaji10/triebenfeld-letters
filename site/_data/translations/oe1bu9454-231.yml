- page: 1
  en: 'Right Honourable,


    most highly revered Sir and Friend!


    Some weeks ago I was at Kalisz on my own business, where I at the same time hoped to see and to speak
    with you, my esteemed Friend, in that place, which pleasure however I had to forgo; nor could I learn
    with certainty the place of your present residence, for otherwise I should have paid you my visit;
    since however I greatly wished to confer and take counsel with you concerning the affairs between
    Johann, Prince of Hohenlohe, and myself, I would herewith politely beg you only to be so kind as to
    appoint a day on which I might have the pleasure of finding you at Kalisz, or wherever else you may
    desire it; I shall acknowledge this as a proof of the friendship you bear towards me, and shall always
    let myself be found ready for every return of favours. In expectation of an obliging and speedy reply
    I am, unchangingly, Your Right Honourable''s


    Breslau, the 9th of January 1812


    devoted Friend and servant


    C. F. Weigel'

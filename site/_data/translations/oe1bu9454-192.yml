- page: 1
  en: 'My dear friend!


    There lie in Berlin 360000 Rthl that have been promised to me. Only I lie here and have been keeping
    to my bed now in the 5th week; I have quite ruined myself here with vexation. Meanwhile I have now
    put everything here in order, and have entirely pacified the peasants who were stirred up by arch-rogues,
    and have also driven the tenants to the devil. When God or devils and hell-brands of men play me crosswise
    tricks, so that I must all but perish of vexation [uncertain: Argus], then all splendour comes to
    an end. Glenck was here and has joined together with the Olesnicer hell-brands, and for that has engaged
    a certain Kramplich, Bergemann and Rybbeh; the [illegible] pack of hell incites the people and turns
    the buyers away; it is too mad how it goes with me. If meanwhile my constitution helps itself and
    I am well again, then may the devil fetch all the knaves. The tenants are, as said before, all gone
    to the devil, and from Christmas and St. John''s onward everything must be so understood that monies
    alone may be raised, and that nothing more must arise for expenditure. Mr. Weigel will be paid, for
    that I stand surety, for I obtain from the judicial fund the money for Weigel and Lichnowski; these
    must cede their mortgages, and get their money; I have already said this to the witnesses at Weigel''s
    too; for me, when I lie here in misery, I cannot act in Berlin; as soon as I recover somewhat I shall
    come to Breslau and go at once with my daughters to Berlin'

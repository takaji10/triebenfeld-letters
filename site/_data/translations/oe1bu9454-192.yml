- page: 2
  en: 'From here I can as yet draw nothing, but from Michaelmas onward much money should come in little
    by little. It would have been easy to obtain money here if I had been willing to give away the parcels
    of land for a third of the price, but from that may God preserve me. — Now the Prince still receives
    190000 Rthl in cash and 40000 in perpetuity, that being the annual revenues. The Prince has already
    received 10000 Rthl from Swięcia, 10000 Rthl from Olesnica, 12000 Rthl from Szetlewek, and 9000 Rthl
    have been given for grounds, all of which has gone upon the costs and interest and also upon old debts.
    The peasants'' revolution and the Plenck knaveries have had their use — I have indeed had to give
    much back, but now it is all the better and more amply made out. Enough: everything will go well —
    if only I am well again first — the writing comes very hard to me. So only this further, that I am
    unceasingly yours,


    v Triebenfeld


    Trąbczyn


    the 12th of Aug


    1806 Upon the whole Prochenkamr affair I must suspend my judgement, for I do not know it — As it seems
    to me, what is lacking is a man who knows the locality thoroughly, and a good deal of money — the
    Stöz: praise is suspect to me, well evaded — the Pro Memoria of the Koſchenkin officials give sufficient
    [illegible] true friend and serve guidance.


    the enclosed lampoon Glenck has made upon me and has had it distributed among the colonists who are
    minded to buy; the original I have sent to His Serene Highness — It is drafted and dealt out by Glenck''s
    own high hand.'

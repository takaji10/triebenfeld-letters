- page: 2
  en: 'From here I can as yet draw nothing, but from Michaelmas onward much money should come in by degrees.
    It would have been easy to obtain money here if I had been willing to give away the plots of land
    for a [uncertain: third part] of the price, but from that God preserve me — Now the Prince will still
    receive 190000 Rthl in cash and 40000 Rthl in yearly revenues in perpetuity. The Prince has already
    received 10000 Rthl from Swięcia, 10000 Rthl from Oleśnica, 12000 Rthl from Szetlewek, and 9000 Rthl
    have been given for grounds, all of which has gone on the costs and interest and also on old debts.
    The peasants'' revolution and the Glenck knaveries have had their use — I have indeed had to give
    a good deal back, but now it has turned out all the better and the more abundant for it. Enough; everything
    will go well — if only I am well again first — writing comes very hard to me. So only this further,
    that I am unceasingly.


    Yours. On the whole Koszęcin affair I must suspend my judgement, for I do not know it — As it seems
    to me, what is wanting is a man who knows the locality thoroughly, and rather a deal of money — the
    [uncertain: Stös:] praise is suspect to me — Well evaded — the Pro Memoria of the Koszęcin officials
    give sufficient[illegible]


    guidance.


    The enclosed lampoon Glenck has made upon me and had distributed among the colonists who wish to buy;
    the original I have sent to His Serene Highness — It was drafted and dealt out by Glenck''s own high
    hand. Trąbczyn


    12th August


    1806


    Humble friend and servant


    v Triebenfeld'

- page: 1
  en: '192


    My dear friend, there are 360000 Rthl lying in Berlin which have been promised to me. Only I lie here
    and have been keeping to my bed into the fifth week; I have vexed myself here quite to ruin. Meanwhile
    I have now put everything here in order and entirely calmed the peasants who had been stirred up by
    arch-rogues, and have also driven the tenants to the devil. When God or devils and hell-brands of
    men play me crosswise tricks, so that I must perish of [uncertain: Argus schien] — then all glory
    is at an end — Glenck is here, has joined together with the Oleśnica hell-brands and has engaged for
    the purpose a certain Kramplitz, Bergemann and Rybbek, the [text lost] gang of hell stirs the people
    up and turns the buyers away; it is too mad how it goes with me. If meanwhile my constitution recovers
    and I am well again, then the devil take all the rascals. The tenants are, as said before, all gone
    to the devil, and from Christmas and Midsummer onward everything must be so understood that only monies
    may be raised, and that nothing more may come up for expenditure. Mr Weigel will be paid, for which
    I had it, since I receive the money from the Justice Fund for Weigel and Lichnowski; these must cede
    their mortgages and receive their money. I have already said this to the witnesses Mr Weigel also;
    but while I lie here in misery I cannot act in Berlin; as soon as I recover somewhat I shall come
    to Wrocław and go at once with my daughters to Berlin'

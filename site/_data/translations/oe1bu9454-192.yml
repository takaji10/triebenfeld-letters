- page: 3
  en: 'To the Oleśnica [uncertain: Schluzbuben] he has, to be sure, given certificates and helped to support
    their cause, and for that they have promised him to sell him the bailiwick. Yesterday the judgement
    came down upon the fellows:


    1. [uncertain: Fenſe] may not evict the fellows


    2. he is to discharge the debts encumbering Oleśnica


    3. he is to apply for the consent.


    4. When that is given, to have the hereditary lease entered in the mortgage book,


    6. but Giese is dismissed, in that the Prince may not hand over the estates to him before the consent
    has hitherto been issued. That is a sentence at which the dogs might howl. I shall now at once apply
    to the authority for the consent; then the resolution will be that such scoundrels may not possess
    noble estates, and the Chamber will throw them out; then all the feud will be at an end.'

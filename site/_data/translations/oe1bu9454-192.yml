- page: 3
  en: 'To the Olesnicer [uncertain: Schluzbuben] he has indeed given certificates and helped to support
    their cause, and for that they have promised him to sell the bailiwick. Yesterday the judgement came
    down upon the fellows: 1. the said Giese may not evict the fellows;


    2. he is to discharge the debts encumbering Olesnica;


    3. he is to apply for the consent.


    4. When that is given, to have the hereditary lease entered in the mortgage book; but 6. Giese is
    refused, in that the Prince may not hand over the estates to him before the consent has hitherto been
    granted. That is a sentence at which the dogs might well howl. I shall now at once apply to the authority
    for the consent; there the resolution will be that such curials may not possess noble estates, and
    the Chamber will throw them out — then all feuding will have an end.'

- page: 1
  en: '215


    Pro Memoria.


    ad 1. The 1000 Rthl were duly delivered to me by the master of the horse Bally against my own and
    Honrichs''s receipt; of these, 600 Rthl were sent in cash that very hour to [text lost: garbled] and
    with the remainder various costs were satisfied, in cases where I was under execution.


    ad 2. I express my most deeply moved thanks for the two hundred and fifty-five Rthl in coin sent to
    my children, which I shall gratefully return or bring to account. Should the 245 Rthl which had been
    assigned to me for the redemption of the iron, but which are here charged again, still be received,
    I would most humbly bring this too into the account upon the delivery of the iron.


    ad 3. So Honrichs, Hawich and Cabanis have been here. Honrichs''s affair has been cleared up and he
    was not found to be a scoundrel, whereas Hawich has been unmasked as the very worst of fellows. Hecker
    will now be rewarded according to his dealings, his paper security returned to him, and he will be
    dismissed. Cabanis, in my unpresumptuous opinion, remains always of his generally known honesty, and
    is to be treasury controller as soon as God helps and His Serene Highness has all his estates in possession
    again. Hawich is to be entirely dismissed, and Count Kwilecki has already thrown him out of the courtroom
    himself as a slanderer and pettifogging hole-and-corner scribbler and forbidden him all access — as
    to


    ad 4. what concerns the situation of the Zagórów and Trąbczyn estates, the sequestration must now
    absolutely be lifted in the case of Zagórów. To that end I have had a schedule drawn up by Honrichs
    and Cabanis of what can be collected in cash at once. The sum stated by the Jew Mendel Oppenheimer
    would amount to 102000 Rthl / which, however, is more than 20000 Rthl again /, and in which case the
    suit is pending in Berlin.


    Meanwhile the interest thereon would amount to about 5100 Rthl a year; this would have to be deposited
    at once together with the protestation "that since the suit concerning the Jew Oppenheimer''s claim
    and his false cession is pending in Berlin, the interest may not be handed over to him —". The statement
    of Honrichs and Cabanis gives 13610 Rthl, the annual interest 5100 Rthl.


    After these, 8510 would remain — this matter now lies before the justice of the peace Count Kwilecki;
    I have given instruction for the 5100 Rthl and insist upon the instant lifting of the sequestration,
    or of what is now called the administration, all the more since of late the general lifting of sequestration
    has been conceded, provided only that the running interest is settled.'

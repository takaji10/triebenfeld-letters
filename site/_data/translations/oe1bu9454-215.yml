- page: 7
  en: 'Now that God sends help from all sides, I shall soon be put in a position to act again as a free
    man. My first business, or my first road, will be to Schlawenschitz, in order then to pursue this
    matter. I foresee that here I shall have to struggle again with a hundred-headed hydra, all the more
    since the Grand Chancellor B — appears to be prejudiced against it; but that shall not paralyse my
    courage, rather it shall [uncertain: rouse] my zeal to bring this affair too to the desired [uncertain:
    end].


    At the same time, he says, in such a matter it is the form that signifies, and if the Queen could
    obtain a hundred times a hundred thousand, he would not vote for it if the form had been wanting.


    He also granted that Reibniz and the commissioners had proceeded somewhat very hastily in the matter,
    but that they had not violated the form; indeed that they had acted therein according to his will,
    because he was no friend of [uncertain: delay]. Everything else appears to him mere gossip. These
    utterances alone prove how cautiously one will have to go in order to shape the matter at once now
    in such a way that neither Herr B: nor the devil will be able to object anything against it. The Queen
    wishes that here the proof'

- page: 5
  en: 'On account of Witów I have a lawsuit on my hands through [uncertain: the Schiffen woman] — she
    has still 6000 Rthl of purchase money to claim. At that time I did not wish to let her see the contract
    with Meierowitz, so that Your Serene Highness might obtain the 500 Rthl of hereditary quit-rent —
    I gave the lady a written undertaking that I would stand surety to her for the [uncertain: remainder]
    of the purchase price. In the course of the war Meierowitz has paid nothing, and now the woman has
    sued me. For the rest, Meierowitz owes the 6000 Rthl of purchase money to the Schließen woman, as
    also the annual interest for five years past to the Prince, amounting to 2500 Rthl. The matter will
    be prosecuted at Kalisz, and a separate Tribunal advocate must be engaged for it. Meanwhile such stuff
    presses very hard upon me; it causes much cost and diminishes my credit. Yet I shall bear this, and
    the Grattenau, Leiche Detessche and Epstein affairs, in patience for the sake of the worthy good Prince''s
    Serene Highness until God helps. It must one day become otherwise and also better. For the reassurance
    of the best of Princes I will only observe this further here regarding the Trąbczyn matter: that the
    Dąbska woman, with her petition to have the Trąbczyn estates entered in the mortgage book in her own
    name, has been refused three times, and the last time in particular by the Tribunal President v. Kiełczewski
    with the words — that she could by no means be regarded as proprietress of the Trąbczyn estates, that
    she held them unlawfully, and that until she had come to terms with the Prince of Hohenlohe and proved
    her capacity to possess, her title could not be allowed her.


    This surely is then the most telling proof that the Trąbczyn estates must absolutely be rescued. The
    gain therein is not so insignificant as short-sighted people perhaps believe. The revenues from it
    will in the sequel be over 16000 Rthl; the entry monies which have still to come in will be sufficient
    to discharge the debts encumbering it, and then the revenue is not to be despised. Moreover, when
    the Prince gets the estates back, it will'

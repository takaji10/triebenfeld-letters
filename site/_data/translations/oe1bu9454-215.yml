- page: 6
  en: 'give his affairs a good complexion and help restore his credit; the vindication of the lordship
    of Trąbczyn also aims at the recovery of the Kaemen estates, whereby the Prince escapes a vexation
    that might yet have drawn upon him unspeakable annoyance and lawsuits for a series of years.


    As concerns my coming to Schlawenschitz, this will certainly follow as soon as I have handed over
    my estates; until now it was a pure impossibility. Want of money was not all that held me back from
    it: it was the total loss of my estates, which I had to be at pains to clear out of the way and to
    forestall all mischief. Now, through the friendly intercessions of His Excellency the worthy General
    v. Köckritz, I am so far advanced that the sequestration here must give way. To that end I have found
    two [uncertain: sound] tenants who will take over the estates at once; indeed I have set everything
    aside, and in order to gain quiet, to have a secure income so as to be able to live freely, and not
    to have to suffer want in the future.


    As concerns the Collonmasch affair, this is only now my endeavour, an ever-gnawing worm at my heart;
    I think of it day and night; it has once been begun and must now be honourably


    concluded.


    Gladly would I have flown on that account from one pole to the other to discover the golden fleece,
    but the loss of my estates, the misery of my poor children were an indescribable hindrance and a barrier
    which by my own strength I was [uncertain: unable] to burst or to remove.'

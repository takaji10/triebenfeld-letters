- page: 8
  en: 'found here, and that the matter might then soon be so conducted that one could act without the
    concurrence of Mr Beyme — As regards the sale of the South Prussian estates to the sub-prefect von
    Brzechffa, I have so ordered the matter that Honrichs concedes nothing and says nothing that binds
    — Brzechffa is at present powerful; he can do harm and help, and therefore I keep him in good faith;
    but because he himself said to Honrichs that things in Poland would soon be otherwise and that the
    Prince might have the estates back sooner than the tribunal''s judgment would be there, in which case
    he too might no longer be in place, I let it hang thus; for since I have known Brzechffa''s circumstances
    from those earlier times, his means do not suffice to buy the estates once they are together again
    — unless indeed he has gained so much in the course of the war, or unless the estates were to be [uncertain:
    squandered] from the [illegible: garbled] side. In my opinion, the purchase of these estates calls
    for a man who can come forward at once with at least 3 to 400000 Rthl, and Brzechffa has not so much.
    To send anyone further to Poland now is not needed, for everything is now arranged. Serene Highness
    cannot, to my feeling, go there in person; the good Prince would not be much respected there at present,
    nor is there any dwelling in which to be lodged. As soon as Trąbczyn is won, I shall myself go there
    at once


    von Triebenfeld'

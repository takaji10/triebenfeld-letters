- page: 4
  en: '— Meanwhile the one thing will have to be done, namely that for this year one remit to all the
    colonists a third part of their interest, with the notice that Your Serene Highness, upon the many
    pressing petitions, or [uncertain: on the advice] of the colonists and the inhabitants of the lordship
    of Zagorowo, has out of particular grace made them a gift for this year of one third of the interest
    payable by them, and remitted it with the intimation that in return they should very promptly settle
    the remaining two thirds of the interest at sixteen good Groschen instead of one thaler, or instead
    of a hundred round — thirty-three, sixty-six at 16 gg, etc.


    But this is a necessary evil; it must be done, because otherwise the people out of obstinacy will
    give nothing at all. It causes a considerable shortfall for the year, but it awakens great confidence
    and draws after it the further benefit that, upon complete peace or upon quiet among the people in
    the country, they will come streaming to the Prince in droves, whereby the lands still unoccupied,
    or now lying [uncertain: newest], which the people abandoned in the course of the unhappy war, can
    easily be disposed of again and settled with [uncertain: sound] people.


    At Betschin considerable arrears stand out, namely the annual canon of 1000 Rthl and many transfer
    fees. Bornstädt has, as I have heard, been settled with out of the remainder of the purchase price
    still outstanding — I therefore have no reliable intelligence, but so far as I am aware all the arrears,
    as purchase price, annual hereditary quit-rent and transfer fees, must amount to more than 14000 Rthl.
    At this moment nothing at all is likely to be obtainable from the inhabitants. But as soon as complete
    quiet sets in, the delivery of the arrears must be pressed for, particularly once Kaemen shall first
    have been rescued. For purely on that account I did not wish to say anything there at present, because
    Leixner, with Meyer Bernhard of Betschen, on account of considerable loans of which I have no exact
    knowledge, were minded to draw their interest.'

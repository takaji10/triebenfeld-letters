- page: 6
  en: 'give a good complexion to his affair and help restore his credit; also the vindication of the lordship
    of Trąbczyn has as its object the recovery of the Kamionna estates, whereby the Prince escapes a vexation
    which could yet have drawn upon him unspeakable annoyance and lawsuits for a series of years.


    As concerns my coming to Sławięcice, this will certainly follow as soon as I have handed over my estates;
    until now it has been a pure impossibility. It was not want of money at all that held me back from
    it; it was the total loss of my estates, which I had to be at pains to clear aside and to forestall
    all mischief. Now, through the friendly intercessions of His Excellency the worthy General von Köckritz,
    I am so far advanced that the sequestration here must give way; to that end I have found two solid
    lessees who will take the estates over at once; indeed I have settled everything, and, to gain calm,
    to have a secure establishment so as to be able to live free and not to have to suffer want in future.


    As concerns the Collonna affair, this is only now my endeavour, a gnawing worm at the heart; I think
    on it day and night; it has once been begun, and must now be honourably


    brought to an end.


    Gladly would I have flown from one pole to the other in the matter to discover the golden [uncertain:
    fleece], but the loss of my estates, the misery of my poor children, were an indescribable hindrance
    and a barrier which I was able to burst or to clear away by my own strength.'

- page: 2
  en: 'On the 28th of this month the hearing in the matter is set down; I hope for the best outcome, and
    observe most obediently that the arrears, were such to come in little by little, would cover everything.


    For the rest, however, it will be necessary to cultivate both judges, in Konin as well as in Kalisz,
    so far as is possible, and to keep them in their good disposition, on which account I must encroach
    very closely upon my own means. Stenger I have had to let go. He was too costly for me: before he
    would set pen to paper he wanted 2000 Rthl in advance. I have now entirely abandoned him and taken
    on a certain Raszkowski, who promises to work all of it up for 300 Rthl. Given the exceedingly good
    disposition of the Justice of the Peace and of the Tribunal Presidents von Kwilecki and Kietszewski,
    there is at present simply no need of such a damnably costly advocate, who besides the advance of
    2000 Rthl also wished to be bathed in Hungarian wine and champagne. The Dąbska woman has, without
    any decrees or judgments whatever, swung herself into possession of the estates by the help of two
    wretched fellows, a certain Scholrech and Lipelli. The two aforementioned judges Kur[illegible] and
    [illegible]geti have [illegible] had her called upon to plead, and promise the very promptest satisfaction.
    I am almost convinced of the most desirable outcome, as of my own [text illegible in sense]. I have
    gratefully seized the opportunity offered by God through these men, in order not only speedily to
    rescue my princely friend''s property amid these never before anticipated fortunate events, but if
    possible to increase it. Indeed, with the vindication of the Trąbczyn estates I join at once that
    of the Kaemen estates (which would have caused the worthy Prince much grief), as also thereafter the
    rescue of the Brzyzna estates, which must in the end be regarded as an equivalent for the damage inflicted
    upon the Prince by the Dąbska woman, since otherwise there would be no [uncertain: fund] at hand from
    which to obtain indemnification from that notorious lady.


    This is likewise the advice of Count Kwilecki, who has it said to me that as soon as the decree or
    judgment concerning'

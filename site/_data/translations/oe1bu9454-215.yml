- page: 5
  en: 'On account of Witów I have a lawsuit on my hands through the Schlieffen woman — She has still 6000
    Rthl of purchase money to claim; at the time I would not let her see the contract with Meierowitz,
    in order to secure to His Serene Highness the 500 Rthl of hereditary quit-rent — I gave the lady a
    written undertaking that I would stand surety to her for the [uncertain: balance] of the purchase
    price — In the course of the war Meierowitz has paid nothing, and now the woman has sued me. For the
    rest, Meierowitz owes the 6000 Rthl of purchase money to the Schlieffen woman, as also the annual
    interest for the last five years to the Prince, amounting to 2500 Rthl — the matter will be prosecuted
    at Kalisz, and a separate tribunal advocate must be engaged for it. Meanwhile such stuff oppresses
    me greatly; it causes much cost and diminishes my credit. Nevertheless I shall bear this, and the
    Grattenau, Deter and Epstein affairs, in patience for the sake of the worthy good Prince''s Serene
    Highness until God helps. Things must one day be otherwise and also better; for the reassurance of
    the best of Princes I will only note here this further point on the Trąbczyn affair:


    "that the Dąbska, with her petition to have the Trąbczyn estates entered in the mortgage book in her
    name, has been refused three times, and the last time in particular by the tribunal president von
    Kiełczewski in these words — that she can by no means be regarded as proprietress of the Trąbczyn
    estates, that she holds them unlawfully, and that until she has come to terms with the Prince of Hohenlohe
    and proved her capacity to possess, her title of possession cannot be allowed her." This surely is
    the [uncertain: most telling] proof that the Trąbczyn estates must absolutely be rescued. The gain
    in it is not so trifling as short-sighted persons may perhaps believe. The revenues from it will hereafter
    be over 16000 Rthl; the entry moneys which must still come in will be sufficient to extinguish the
    debts charged upon it, and then the revenue is not to be despised. Besides, when the Prince recovers
    the estates, it will'

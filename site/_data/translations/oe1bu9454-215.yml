- page: 7
  en: 'Now that God sends help from all sides, I shall soon be put in a position to act again as a free
    man. My first business, or my first journey, will be to Sławięcice, in order then to pursue this matter.
    I foresee that here I shall have to fight again with a hundred-headed hydra, the more so as the Grand
    Chancellor Beyme seems to be prejudiced against it; but that shall not cripple my courage, rather
    [illegible: garbled] my zeal, so as to bring this history too to the wished-for goal.


    Beyme says that in the matter it is the form that is wanting, and that if the Queen could thereby
    obtain a hundred times a hundred thousand Rthl, he would not vote for it if the form had been defective.


    He also conceded that Reibnitz and the commissioners had proceeded somewhat very hastily in the matter,
    but that they had not violated the form; indeed they had acted therein according to his will, because
    he was no friend of [uncertain: delay] — All the rest seemed to him gossip — These utterances alone
    prove how cautiously one will have to go, so as to shape the matter at once in such a way that neither
    Mr Beyme nor the devil will be able to object to it. The Queen wishes that the proofs be'

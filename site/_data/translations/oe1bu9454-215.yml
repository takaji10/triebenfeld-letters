- page: 8
  en: 'be found out, and that the matter might then soon be so directed that one could act without the
    concurrence of Herr B. As regards the sale of the South Prussian estates to the sub-prefect v. Brzechsta,
    I have so arranged the matter that Honrichs concedes nothing and says nothing binding. Brzechsta is
    now powerful; he can harm and he can help, and therefore I keep him in good faith. But since he himself
    said to Honrichs that matters in Poland would soon become otherwise, and that the Prince might have
    the estates back sooner than the Tribunal''s judgment would be there, in which case he too might no
    longer be standing in the place — I therefore let the thing merely be strung along; for since I know
    Brzechsta''s circumstances from those earlier times, his means do not suffice to buy the estates once
    they are brought together again. Unless it be that he had gained so much in the course of the war,
    or that one wished to squander the estates from [uncertain: Your] Serene Highness''s side. In my opinion
    the purchase of these estates requires a man who can come forward at once with at least 3 to 400000
    Rthl, and Brzechsta has not so much. To send anyone further to Poland at present is not needful, for
    everything is now arranged. Your Serene Highness cannot, according to my feeling, go there yourself:
    the good Prince would not be much respected there at present, and there is besides no dwelling in
    which to be lodged. As soon as Trąbczyn is won, I go there myself at once.


    v Triebenfeld'

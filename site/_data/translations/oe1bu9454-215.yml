status: draft
segments:
- page: 1
  en: P. M. ad 1. the 1000 Rthl were duly delivered to me by the Master of the Horse Herr Bally against
    my receipt and that of Honrichs; of these 600 Rthl were sent in cash within the hour without fail,
    and out of the remainder various costs were satisfied, in the matter in which I had execution against
    me. ad 2. I express my most deeply moved thanks for the two hundred and fifty-five rt. in coin sent
    to my children, which I shall gratefully return or bring to account. Should the 245 Rthl which had
    been assigned to me for the redemption of the iron, but which are here charged again, still be received,
    I would most humbly bring this too into account with the iron delivery. ad 3. Honrichs, Hawich and
    Cabanis have been here. Honrichs's affair has been cleared up and he was not found to be a villain,
    whereas Hawich has been unmasked as the worst of fellows. Hecker will now be rewarded according to
    his dealings, his paper security returned to him, and he will be discharged. Cabanis remains, in my
    unassailable opinion, ever true to his generally known honesty, cash controller as soon as God helps
    and Your Serene Highness has all your estates back in possession. Hawich will be entirely dismissed,
    and Count Kwilecki has already thrown him out of the court-room himself as a slanderer and Nabulistic
    pettifogger and forbidden him all access; as to what concerns ad 4., the situation of the Zagorowo
    and Trąbczyn estates, the sequestration at Zagorowo must now absolutely be lifted; to that end I have
    had a register given me by Honrichs and Cabanis of what can be collected in cash at once. The sum
    stated by the Jew Mendel Oppenheimer would amount to 102000 Rthl (which, however, is again more than
    20000 Rthl), and in which matter the suit is pending in Berlin. Meanwhile the interest thereon would
    come to about 5100 Rthl a year; these would have to be deposited at once with the protestation that
    the suit concerning the Jew Oppenheimer's claim and his false cession is pending in Berlin, so that
    the interest might not be handed over to him. The statement of Honrichs and Cabanis gives 13610 Rthl,
    the annual interest 5100; after these 8510 would remain. This matter now lies before the Justice of
    the Peace Count Kwilecki; I have ordered payment of the 5100 Rthl [Anweisung] and insist upon the
    immediate lifting of the sequestration, or of what is now called the administration, the more so as
    of late the general lifting of sequestration has been conceded, provided only that the running interest
    is settled.
- page: 2
  en: 'On the 28th of this month the hearing in the matter is set down; I hope for the best outcome, and
    note most obediently that the arrears, in so far as such come in little by little, will cover everything.
    For the rest, however, it will be necessary to cultivate the two judges, both at Konin and at Kalisz,
    as much as possible and to keep them in their good disposition, for which purpose I must come very
    close upon my own means. Stenger I have had to let go. He was too costly for me; before he would set
    a pen to paper he wanted 2000 Rthl in advance; I have now wholly abandoned him and engaged a certain
    Raszkowski who promises to work all of it for 300 Rthl - with the exceedingly good disposition of
    the Justice of the Peace and of the Tribunal Presidents von Kwilecki and Kiełczewski there is now
    simply no need of so damnably costly an advocate, who besides the advance of 2000 Rthl also wished
    to be bathed in Hungarian wine and champagne. The Dąbska has swung herself into possession of the
    estates without any decrees or judgments whatever, by the help of two wretched fellows, a certain
    Scholrech and Lipelli. The two aforenamed judges Kur[illegible] and [illegible]geti have [illegible]
    caused a summons to sue and promise the very promptest satisfaction - I am almost convinced of the
    most desirable outcome, as of my own [outcome] - I have seized with favour the opportunity offered
    to me by God in these men, in order not only to save my princely friend''s property speedily amid
    these never before anticipated happy events, but if possible to increase it. Indeed, with the vindication
    of the Trąbczyn estates I join at once the Kaemen ones (which would have caused the worthy Prince
    much grief), as also thereafter the rescue of the Brzyz estates, which must in the end be regarded
    as an equivalent for the damage inflicted upon the Prince by the Dąbska, because otherwise there would
    be no [uncertain: fund] available to obtain an indemnification from the notorious lady. This is indeed
    the advice of Count Kwilecki, who has it said to me that as soon as the decree or judgment concerning'
- page: 3
  en: 'Trąbczyn is there, I too should press so firmly for compensation for damages and should not be
    bashful in setting the costs - I think some 60000 Rthl will be neither too little nor yet so very
    much. So much on the subject, or on the vindication of the Trąbczyn and Kaemen estates. Concerning
    the lamentations of Grotowski, Lichnowski, Zerboni and Eysenhardt, who have [uncertain: moneys] upon
    Trąbczyn and Szetlewek [text lost], there is nothing to be said at present - the vindication of the
    estates also removes the worry for the future. I believe that if the Prince gets the estates back,
    15000 Rthl are at once to be had from the tenant Smid, for he will not willingly go out and leave
    in the lurch the rent he has paid in advance to the Dąbska; with the aforesaid 15000 Rthl of rent
    one pays the four men their interest and they will gladly be quiet - Enough: everything depends upon
    the swiftest vindication of these estates; if this follows as desired and as it is now set in train,
    then the greatest worry is removed and the credit restored at the same time. For the rest, that tableau
    which I gave His Serene Highness three years ago remains always the basis of what the estates are,
    once Trąbczyn is regained, and what they will be in the end. The war will cause a shortfall, but meanwhile
    much interest that has not been raised has accrued, and this in the end covers the shortfall, so that
    the sum will always remain the same. The dismemberment stands as it is set out in that tableau - especially
    once Trąbczyn shall first have been rescued again, it must not suffer the least alteration. For neither
    Honrichs, Hawich, Hecker, nor the Karzunki had any right to appropriate to themselves a single Morgen
    of land, and not a single one shall remain in possession with my consent; rather, the lands must be
    given back and, according to the plan I once made and which was itself approved by the former Chamber
    for heavy money, be made known through colonists and those be established thereon. I grant that at
    present there is no influx of colonists, but let calm and peace return entirely, and then there will
    be people enough'
- page: 4
  en: '- Meanwhile the one thing that will have to be done is that for this year one remit to all the
    colonists a third part of their interest, with the notice that His Serene Highness, upon the manifold
    pressing petitions or [uncertain: counsel] of the colonists, the inhabitants of the lordship of Zagorowo,
    out of especial grace bestows upon them for this year one third of the interest payable by them and
    remits it with the intimation that they in return should settle very promptly the remaining two thirds
    of the interest, as: instead of one rtum, sixteen good Groschen, or instead of a hundred round - thirty-three,
    sixty-six at the 16 gg, etc. But this is a necessary evil; it must be done, because otherwise the
    people out of obstinacy will give nothing at all. It causes a considerable shortfall for the year,
    but it awakens a great confidence and gives rise to, or draws after it, the profit that upon complete
    peace, or [uncertain: the calming] of the people in the land, [they] would come streaming to the Prince
    in droves, whereby the still unoccupied lands, or those now lying newest, which the people abandoned
    in the course of the unhappy war, can easily be alienated again and settled with [uncertain: Lohden]
    persons. At Betschin considerable arrears stand out, namely the annual canon of 1000 Rthl and many
    Laudemien. Bornstædt has, as I have heard, been settled with out of the remainder of the purchase
    price still outstanding - I have therefore no reliable information, but so far as I recall, all the
    arrears together, as purchase price, annual ground-rent and laudemia, must amount to over 14000 Rthl.
    At this moment nothing at all will be obtainable from the inhabitants. But as soon as complete calm
    sets in, the discharge of the arrears must be pressed for, especially once Kaemen shall have been
    rescued. For purely on that account I have been unwilling to say anything there at present, because
    Leixner with Meyer Bernhard of Betschen were minded to draw their interest on account of considerable
    loans, which I do not know exactly.'
- page: 5
  en: 'Concerning Wyttow I have a lawsuit round my neck through the Schließen - she still has 6000 Rthl
    of purchase money to demand; at that time I did not wish to let her see the contract with Meierowitz,
    in order that Serene Highness should receive the 500 Rthl of ground-rent — I gave the lady a written
    undertaking that I would stand surety to her for the [uncertain: remainder] of the purchase price
    - In the course of the war Meierowitz has paid nothing, and now the woman has sued me. For the rest,
    Meierowitz owes the 6000 Rthl of purchase moneys to the Schließen, as also the annual interest for
    5 years to the Prince at 2500 Rthl; the matter will be prosecuted at Kalisz, and a separate Tribunal
    advocate must be engaged for it. Meanwhile such stuff presses hard upon me; it makes much cost and
    diminishes my credit. Yet I shall bear these - the Grattenau affair, the Leiche Detessche and the
    Epstein affair - in patience for the sake of the worthy good Prince''s Serene Highness, until God
    helps. It must one day be otherwise and also better. For the reassurance of the best of Princes I
    will note only this further here concerning the Trąbczyn affair: that the Dąbska, with the request
    to have the Trąbczyn estates entered in the mortgage book in her name, has been refused three times,
    and the last time in particular by the Tribunal President v. Kiełczewski with the words - that she
    could by no means be regarded as proprietress of the Trąbczyn estates, she possessed them against
    right, and until she had come to an arrangement with the Prince Hohenlohe and shown her capacity to
    possess, her Tit: post: could not be allowed her. This is surely the [uncertain: clearest] proof that
    the Trąbczyn estates must absolutely be rescued. The gain therein is not so insignificant as short-sighted
    people may perhaps believe. The revenues therefrom will in the sequel be over 16000 Rthl; the entry-moneys
    which have still to come in will be sufficient to pay off the debts charged upon them, and then the
    revenue is not to be despised. Moreover, when the Prince gets the estates back, it'
- page: 6
  en: 'will give a good complexion to his affairs and help restore his credit; the vindication of the
    lordship of Trąbczyn also has for its aim the recovery of the Kaemen estates, and thereby the Prince
    escapes a vexation which might yet draw upon him unspeakable annoyance and lawsuits for a series of
    years. As to my coming to Schlawenschitz, this will certainly follow as soon as I have handed over
    my estates; until now it was a pure impossibility. It was not want of money alone that held me back
    from it; it was the total loss of my estates, which I had to be at pains to set aside and to forestall
    all mischief. Now, through the friendly intercessions of His Excellency the worthy General v. Köckritz,
    I am so far advanced that the sequestration here must give way; to that end I have found 2 [uncertain:
    solid] tenants who will take over the estates at once; indeed I have settled everything, and, to win
    calm, to have a secure establishment, so as to be able to live free and not to have to want in future.
    As to the Collonmasche affair, this is only now [uncertain: an effort], a gnawing worm at the heart;
    I think on it day and night; it is once begun, and must now be brought honourably to an end. Gladly
    would I have flown from one pole to the other on that account, to discover the golden fleece, but
    the loss of my estates, the misery of my poor children, were an indescribable hindrance and a barrier
    which I was able to burst or remove by my own strength.'
- page: 7
  en: 'Now that God sends help from all sides, I shall soon be placed in a position to act again as a
    free man. My first business, or my first journey, will be to Schlawenschitz, in order then to pursue
    this affair. I foresee that here I shall have to fight again with a hundred-headed hydra, the more
    so as the Grand Chancellor B - appears to be prejudiced against it; but that shall not cripple my
    courage, rather the more inflame my zeal, so as to bring this business too to the desired [uncertain:
    end]. [uncertain: In this] the form counts for much in the matter, and if the Queen could obtain 100
    times a hundred thousand, he would not consent to it if the form had been faulted. He also granted
    that Reibniz and the commissioners had proceeded somewhat too rashly in the matter, but that they
    had not violated the form; indeed that they had acted therein according to his will, because he was
    no friend of [uncertain: delay] - all the rest seemed to him mere gossip. These utterances alone prove
    how cautiously one will have to go, in order to shape the matter at once now in such a way that neither
    H. B: nor the devil will be able to object anything against it. The Queen wishes that the proofs be'
- page: 8
  en: 'found here, and that the matter might then soon be so conducted that one could act without the
    participation of H. B. As to the sale of the South Prussian estates to the sub-prefect v Brzechsta,
    I have so ordered the matter that Honrichs [uncertain: promises] nothing away and nothing that binds.
    Brzechsta is now powerful; he can harm and he can help, and therefore I keep him in good faith; but
    since he himself said to Honrichs that affairs in Poland will soon be otherwise and that the Prince
    might have the estates back sooner than the Tribunal''s judgment would be there, whereupon he too
    might no longer be standing in the place - I therefore let it be merely held in suspense; for since
    I know Brzechsta''s circumstances from those earlier times, his fortune is not sufficient to buy the
    estates once they are together again. Unless he had gained so much in the course of the war, or unless
    one wished to [uncertain: squander] the estates from Your Serene Highness''s side. In my opinion the
    purchase of these estates requires a man who can come forward at once with at least 3 to 400000 Rthl,
    and Brzechsta has not so much. To send anyone further to Poland now is not needed, for everything
    is now ordered. Your Serene Highness cannot, according to my feeling, go there in person; the good
    Prince would not be much respected there at present, nor is there any lodging in which one might be
    accommodated. As soon as Trąbczyn is won, I shall myself go there at once v Triebenfeld'

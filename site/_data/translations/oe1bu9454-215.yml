- page: 3
  en: 'Trąbczyn is there, I should likewise press so [illegible: garbled] for compensation for damages,
    and should not be bashful in setting the costs — I think something like 60000 Rthl will surely be
    neither too little nor too much — So much upon this subject, or the vindication of the Trąbczyn and
    Kamionna estates. As to the lamentations of Grotowski, Lichnowski, Zerboni and Eysenhardt, who have
    [text lost] [uncertain: money] upon Trąbczyn and Szetlewek, there is nothing to be said at present
    — the vindication of the estates also removes the trouble for the future — I believe that if the Prince
    recovers the estates, 15000 Rthl are at once to be taken from the lessee Smidkowski / for he will
    not willingly go out, and will not wish to leave in the lurch the rent he paid in advance to the Dąbska;
    with the aforesaid 15000 Rthl of rent one pays the four persons their interest, and they will gladly
    be quiet — Enough: everything depends upon the speediest vindication of these estates; if this follows
    as wished and as it has now been set in train, then the greatest trouble is removed and credit restored
    at the same time.


    For the rest, that tableau which I gave His Serene Highness three years ago remains always the basis
    of what the estates of Trąbczyn, once regained, are and what they will be in the end — The war will
    cause a shortfall, but meanwhile much interest that has not been raised has accrued in addition, and
    these in the end cover the shortfall, so that the sum will always remain the same.


    The dismemberment remains as it is set out in that tableau — especially once Trąbczyn has been rescued
    again, it may not suffer the least alteration. For neither Honrichs, Hawich, Hecker, nor the [uncertain:
    Karzunki] had any right to appropriate a Morgen of land to himself, and not a single one of them shall
    remain in possession with my consent; rather the lands must be given back and, according to the plan
    I once drew up and which was itself approved by the former Chamber for heavy money, be [illegible:
    garbled] by colonists and established for that purpose. I concede that at present there is no influx
    of colonists, but if calm and peace return entirely, then there will be people enough'

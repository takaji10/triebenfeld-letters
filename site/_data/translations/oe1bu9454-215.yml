- page: 2
  en: 'On the 28th of this month the hearing in the matter is set down; I hope for the best outcome and
    observe most obediently that the arrears, should such come in by degrees, will cover everything.


    For the rest, however, it will be necessary to cultivate the two judges, both at Konin and at Kalisz,
    as far as possible, and to keep them in their good disposition, since to that end I must encroach
    very closely upon my own means — Stenger I have had to let go. He was too costly for me; before he
    would set pen to paper he wanted 2000 Rthl in advance. I have now entirely abandoned him and engaged
    a certain Raszkowski, who promises to handle all of it for 300 Rthl — given the exceedingly good disposition
    of the president of the justice court and of the tribunal, von Kwilecki and Kiełszewski, there is
    now simply no need of such a damnably costly advocate, who besides the advance of 2000 Rthl also wanted
    to be bathed in [uncertain: Unger] and champagne — the Dąbska has, without any decrees or judgments
    whatsoever, swung herself into possession of the estates by the help of two wretched fellows, a certain
    Sokolniki and Lipski. The two aforenamed judges [illegible] and [illegible] have had [illegible] summoned
    to bring suit and promise the very promptest satisfaction — I am almost convinced of the most desirable
    outcome as well as of my own [illegible: garbled] — I have eagerly seized the opportunity offered
    by God in these men, in order not only speedily to rescue my princely friend''s property amid these
    never before anticipated happy events, but if possible to increase it. Indeed, with the vindication
    of the Trąbczyn estates I at once join that of the Kamionna ones / which would have caused the worthy
    Prince much grief / and thereafter likewise the rescue of the Brzyzna estates, which must in the end
    be regarded as an equivalent for the damage inflicted on the Prince by the Dąbska, because otherwise
    there would be no [illegible: garbled] available for obtaining an indemnification from the notorious
    lady.


    This is indeed the advice of Count Kwilecki, who sends me word that as soon as the decree or judgment
    concerning'

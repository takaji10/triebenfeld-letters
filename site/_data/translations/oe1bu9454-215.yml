- page: 3
  en: 'Trąbczyn is there, I should likewise press firmly for compensation of damages and not be bashful
    in setting the costs. I think some 60000 Rthl will be neither too little nor too much. So much on
    the subject, that is, on the vindication of the Trąbczyn and Kaemen estates. Concerning the lamentations
    of Grotowski, Lichnowski, Zerboni and Eysenhardt, who have [text lost] [uncertain: money] upon Trąbczyn
    and Szetlewek, there is nothing to be said at present. The vindication of the estates also removes
    the worry for the future. I believe that if the Prince gets the estates back, then 15000 Rthl are
    straightway to be had from the tenant Smid, for he will not willingly go out, and will not wish to
    abandon the rent he has paid in advance to the Dąbska woman; with the aforesaid 15000 Rthl of rent
    one pays the four men their interest, and they will gladly keep quiet. Enough: everything depends
    on the speediest vindication of these estates; if this follows as wished and as it is now set in train,
    then the greatest worry is lifted and the credit restored at the same time.


    For the rest, that tableau given by me to His Serene Highness three years ago remains always the basis
    of what the estates are, once Trąbczyn is won back, and what they will be in the end. The war will
    cause a shortfall, but in the meantime much interest that has not been raised has accrued in addition,
    and this in the end covers the shortfall, so that the sum total will always remain the same.


    The dismemberment remains as it is set out in that tableau; particularly once Trąbczyn shall first
    have been rescued again, it must not suffer the least alteration. For as little as Honrichs, Hawich,
    Hecker, or the Karzunki had any right to appropriate a Morgen of land to themselves, so also not a
    single one shall remain in possession with my consent; rather the lands must be given back and, according
    to the plan I once made and which was approved even by the former Chamber for heavy money, made known
    through colonists and settled for that purpose. I grant that at present there is no influx of colonists,
    but let quiet and peace return entirely and there will be people enough'

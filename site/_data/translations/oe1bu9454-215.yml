- page: 4
  en: '— Meanwhile the one thing that will have to be done is that for this year a third part of their
    interest be remitted to all the colonists, with the intimation "that His Serene Highness, upon the
    many pressing petitions of the inhabitants, or on the advice of the colonists on the lordship of Zagórów,
    has of special grace made them a gift for this year of one third of the interest payable by them,
    and has remitted it with the direction that in return they settle the remaining two thirds of the
    interest — that is, instead of one Rthl, sixteen good Groschen, or instead of a hundred Rthl


    sixty-six Rthl 16 Groschen — very


    promptly, etc." This is a necessary evil, but it must be done, because otherwise the people out of
    obstinacy will give nothing at all. It causes a considerable shortfall for the year, but it awakens
    great confidence and brings after it the advantage that, when there is full peace or calm in the land,
    people will [uncertain: stream in] to the Prince in [uncertain: droves], whereby the still unoccupied
    lands, or those now lying [uncertain: newest], which the people abandoned in the course of the unhappy
    war, can easily be disposed of again and settled with solid people.


    At Pszczew considerable arrears are outstanding, namely the annual canon of 1000 Rthl and many transfer
    fees (Laudemia) — Bornstädt has, as I have heard, been settled with out of the remainder of the purchase
    price still standing — I therefore have no reliable intelligence, but so far as I recollect, all the
    arrears together — purchase price, annual hereditary quit-rent and transfer fees — must amount to
    over 14000 Rthl. At this moment nothing is likely to be obtainable from the inhabitants. But as soon
    as complete calm sets in, the discharge of the arrears must be pressed for, especially once Kamionna
    has been rescued. For purely on that account I have wished to say nothing there at present, because
    Leixner, with Meyer Bernhard of Pszczew, on account of considerable loans which I do not exactly know
    of, were minded to draw their interest'

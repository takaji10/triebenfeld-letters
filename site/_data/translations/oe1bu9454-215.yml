- page: 1
  en: 'P. M.


    ad 1. The 1000 Rthl from the Master of the Horse Bally were duly delivered into my hands against my
    own and Honrichs''s receipt, of which 600 Rthl were sent in cash within the hour [uncertain: for the
    shortfalls], and with the remainder various costs were satisfied, in which matter I had execution
    against me.


    ad 2. I say the most deeply moved thanks for the two hundred and fifty-five rt. in coin sent to my
    children, which I shall gratefully return or account for. Should the 245 Rthl which had been assigned
    to me for the redemption of the iron, but which are here charged again, still be received, I would
    most humbly bring this too into the account upon the delivery of the iron.


    ad 3. Thus Honrichs, Hawich and Cabanis have been here. Honrichs''s affair has been cleared up and
    he was not found to be a scoundrel, whereas Hawich has been unmasked as the worst of fellows. Hecker
    will now be rewarded according to his dealings, his paper security returned to him, and he will be
    dismissed. Cabanis remains, in my unpresumptuous opinion, constant in his generally known honesty,
    and will be treasury controller as soon as God helps and Your Serene Highness has all the estates
    in possession again. Hawich will be entirely discharged, and Count Kwilecki has already thrown him
    out of the court chamber himself as a slanderer and a shyster pettifogging scribbler, and has forbidden
    him all access; as to what


    ad 4. concerns the situation of the Zagorowo and Trąbczyn estates, the sequestration must now absolutely
    be lifted at Zagorowo. To that end I have had a schedule drawn up by Honrichs and Cabanis of what
    can at once be collected in cash. The sum stated by the Jew Mendel Oppenheimer would amount to 102000
    Rthl (but which is more than 20000 Rthl again), in which matter the suit is pending in Berlin.


    Meanwhile the interest thereon would come to about 5100 Rthl a year; these would have to be deposited
    at once together with the protestation that the suit concerning the Jew Oppenheimer''s claim and his
    false cession is pending in Berlin, so that the interest may not be handed over to him. The statement
    of Honrichs and Cabanis says 13610 Rthl, the annual interest


    5100


    After these, 8510 would remain. This matter now lies before the Justice of the Peace Count Kwilecki;
    I have given the instruction for the 5100 Rthl and insist upon the immediate lifting of the sequestration,
    or what is now called the administration, all the more since of late the general lifting of sequestration
    has been conceded, provided only that the current interest is settled.'

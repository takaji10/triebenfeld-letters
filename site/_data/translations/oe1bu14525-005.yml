- page: 2
  en: '1.) the sovereign dues hitherto discharged therefrom, as a fixed and unalterable canon, and


    2, the competence due therefrom to the ecclesiastical corporations or foundations.


    to be left over to him hereditarily and in full property, granted and conveyed.


    We do so likewise hereby and by virtue of this present, out of Royal power and plenitude, for Ourselves
    and Our descendants and successors to the Crown, to the Electorate and to Our remaining lands, in
    such wise and so that Our aforesaid kindly beloved uncle, the reigning Prince of Hohenlohe-Ingelfingen,
    shall from now on and for all time, for Himself and His descendants and heirs, irrevocably have, possess
    and enjoy the above-named estates with all rights and liberties attaching thereto, as these have hitherto
    been exercised or may lawfully be exercised, and no less with all their pertinences and other appurtenances,
    by whatever name they may be called, as the same have hitherto been used or may lawfully be used,
    and with all the lands belonging thereto, in fields, woods and meadows, likewise in ponds and waters,
    as a true, well-acquired and unrestricted property, from Us and Our descendants and successors; and
    that there shall further be conferred upon the same the power and authority to dispose thereof at
    pleasure under the above-mentioned conditions, unhindered by any man.'
  names:

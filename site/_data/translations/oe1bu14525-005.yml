- page: 3
  en: 'We therefore command and enjoin all Our Supreme Provincial Colleges, as also all other authorities
    whom this concerns, herewith as graciously as earnestly, that they in no wise hinder or impede the
    Lordship of the oft-mentioned Lord Prince of Hohenlohe-Ingelfingen in the hereditary and proprietary
    possession of the above-named estates granted to Him, together with their pertinences and appurtenances,
    nor him or those upon whom He may one day bequeath the same, or may otherwise lawfully transfer them
    by other acts inter vivos aut mortis causa, but rather shall let His Lordship, and eventually them
    also, enjoy the same freely and quietly, shall themselves do nothing against it, nor cause or permit
    that such be done by others, on pain of Our Most High disfavour and unfailing severe punishment. In
    witness whereof etc. Given at Berlin, the 19th of June 1797. Deed of Grant.


    Friedrich Wilhelm


    for the reigning Prince of Hohenlohe-Ingelfingen, to the hereditary and proprietary possession of
    the villages of Pszczew, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Świątniki, Kopojno,
    Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wieniec and Wolica, together with appurtenances. Hoym. Reck.


    That the foregoing copy has been found in perfect accord and agreement with the government-'

segments:
- page: 1
  en: We Friedrich Wilhelm, by the Grace of God King of Prussia etc., do hereby attest and declare by
    this Our open letter, for Ourselves and Our descendants and successors to the Crown, to the Electorate,
    and to Our remaining lands, that whereas it has been most humbly laid before Us in what manner Our
    intention — namely, to give to the High-born Prince, Our kindly beloved uncle, Friedrich Ludwig, reigning
    Prince of Hohenlohe-Ingelfingen, by the grant of the estates that had belonged to the absconded former
    starosta von Prusimski, a mark of the friendship and goodwill We bear towards him, as also of Our
    Royal gratitude for the distinguished and beneficial services rendered to Us and to Our Royal House
    — has not been attained entirely as We had willed it, because the said estates were burdened with
    many debts, We have most highly resolved to make over, grant and convey to His Lordship the hereinafter-named
    formerly ecclesiastical estates, namely the villages of Pszczew, Świechocin, Stoki, Łowyń, Głażewo,
    Tarnowo, Zagórów, Skokum, Świątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wieniec and Wolica,
    together with all their appurtenances, by whatever name they may be called, against payment of,

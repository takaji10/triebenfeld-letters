- page: 1
  en: 'V[ienna], 6 June [18]15


    To


    His Serene Highness the Prince of Hohenlohe


    at Sławięcice


    No. 3205.


    In [uncertain: most dutifully reporting] to Your Serene Highness the receipt of your least [uncertain:
    esteemed] letter of the 12th of last month concerning the reclamation of the Trąbczyn estate, hitherto
    I at the same time [take the occasion] to [uncertain: empower/notify] you that the [illegible] Minister
    of State has communicated to me, for further action, your letter addressed to him of < April, in which
    Your Serene Highness raised your claims respecting Kamionna and Trąbczyn. I have requested the Privy
    Councillor von Zerboni, in order also to be able to let a further intercession be entered upon on
    behalf of Your Serene Highness''s claims, to put me fully in possession of the present [uncertain:
    renunciations/circumstances] with regard to both estates, and I reserve to myself, upon receipt of
    the [uncertain: information] required thereupon, to send Your Serene Highness word of the steps which
    I shall thereafter be in a position to take. With the most sincere sympathy and the [uncertain: truest]
    [uncertain: Vorhaus] for Your Serene Highness, it will be only a matter of earnest duty to meet your
    wishes in this place also. — Be pleased, Your Excellency, to accept the assurance of my unaltered
    high esteem and devotion. Vienna, 6 June [18]15


    In His Serene Highness''s name.'

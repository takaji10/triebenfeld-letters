segments:
- page: 1
  en: 'Privilege "Gradziem Ruchowia". 15.


    In the name of the Lord, Amen. For the perpetual memory of the matter. We, Piotr of Szamotuły, castellan
    of Poznań, general captain of Greater Poland, make known by the tenor of these presents to all whom
    it concerns: that, coming to our knowledge and to the presence of other nobles of the same land, the
    honourable and noble lords Jan'
- page: 2
  en: 'Jan Wochneth, parish priest at Koscielec, Mikołaj Wochneth of Bartodzieje, and [uncertain: Barlyus]
    Wochneth of Osiecza, three brothers german, undivided; and also the honourable and noble Marcin Bochneth,
    Jan Bochneth and Maciej Bochneth, brothers german, heirs german of the aforesaid Jan Bochneth, parish
    priest at Koscielec, of Mikołaj of Bartodzieje and of [uncertain: Wardzch] of Osiecza, undivided in
    their said goods with their said paternal uncles; not compelled, not forced, nor led astray by any
    other error, but sound in mind and body, having used the wholesome counsel of their friends and having
    first deliberated maturely among themselves, resigned in perpetuity three whole mansi with gardens
    in the village and heritage of Łukom in the district of Konin, lying in the parish of Zagórów; the
    forest Grądzyń with the woods and groves and the Pyzdry mounds; with the forest Chmielniki and with
    the forest Lome, up to the road called Rosiszewska, which goes from Łukom and the village of Lomowo
    to the hill Karczemne gory, and the marshes otherwise called Karczemne Lugi; and with the field above
    Imielno; and with all right, dominion and property, as they alone held, had and possessed them, reserving
    for themselves and their lawful successors no right whatever of dominion or property in them; with
    all and singular plots, courts, houses, barns, fields, meadows, pastures, grasslands, forests, woods,
    groves, thickets, enclosures, brushwood, oak woods, scrub, pine woods, hills, rises, [uncertain: Stenis],
    marshes, lakes, ponds, peasants, labours, burdens, gardens and gardeners, and generally with all and
    singular useful fruits, incomes and revenues, by whatever name and word they are called, belonging
    and pertaining in any way to the said mansi and the other goods described and designated above, far
    and wide, as the said mansi are marked off and bounded round about in their bounds and limits; for
    four hundred marks of good broad middle groschen of the coin and count customary in Poland, reckoning
    forty-eight groschen to each mark; to the Reverend Father, Lord Cornelius, abbot, and the religious
    Jan, prior, and Wolmar, rector of the parish church at Ląd, and to the whole convent of the monastery
    of Ląd, having for this the consent and special will of the Most Serene Prince and Lord, Lord Kazimierz,
    by the grace of God King of Poland etc., our most gracious lord: for the said lords the abbot, the
    prior and the whole convent and their successors to hold, have and possess, to use and enjoy, to sell,
    alienate, exchange, give, donate, and turn to their own uses and pleasure, as shall seem better and
    more useful to them and their successors for the time being. In witness of which our seals are hung
    beneath these presents. Done and given at Pyzdry on the Monday next after the feast of the Exaltation
    of the Holy Cross, in the year 1,461. Present there the well-born and noble lords Jan Swidwa the younger,
    Jan Sobocki, burgrave of Poznań, Mikołaj Kamski, [uncertain: Gavisso] Gorecki, Mikołaj Dabrowski,
    Krystyn Goszdychowski, and many others worthy of trust in the matters above.


    [Written in the margin:]


    And with the forest of Lomy, from the boundaries'

- page: 1
  en: '35


    Most Serene Prince


    Gracious Lord!


    Your Serene Highness''s dispositions, which Your Highness issued through Court Councillor Meyer to
    Privy Councillor Amelang, have shaken my [uncertain: zumres] and have so aggravated my bodily sufferings
    that I can hope for my complete recovery a good 4 weeks later than before. How was it possible for
    you, gracious Prince and Lord, to take such resolutions as could have plunged me, in these times and
    given the sentiments of Baron von Stein, into the deepest misery — You assign sums even today upon
    that bank order which I declared null and void already [uncertain: 1]/4 years ago, and Mr Meyer says
    that you did this out of mercy towards me, in that you were reaching into your last penny put by for
    need. How painfully these expressions wound my heart I am not able to depict — You wish, Serene Lord,
    out of mercy towards me, to assign 2600 Rthl of my own property — What is this to mean? I have here
    suffered unjustly and dreadfully for you, indeed I have even had to endure arrest / which I have never
    suffered in my life — I had to procure and pay the money, unless I wished to have 2 gendarmes permanently
    in my room, who cost me here some 20 Rthl. daily — the worthy Minister von Zastrow helped in this;
    meanwhile I had to bind myself towards him not to depart from here any sooner than when the 6000 Rthl
    were paid and he had his bill of exchange back. I reported this unheard-of occurrence to Your Serene
    Highness, and beg you to contribute so that the 6000 Rthl, which I have had to pay here for you, may
    be settled. At the same time I begged that that bank order, likewise for [illegible]000 Rthl, be sent
    back to me, inasmuch as it has been declared invalid and I have already several times been admonished
    by the bank to procure its return, so that my Konotop mortgage, together with my bill of exchange
    — which was made out for only 3 months and had long since expired — might be redelivered to me.'

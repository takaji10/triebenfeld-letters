- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Your Serene Highness''s dispositions, which you most highly issued through Court Councillor Meyer
    to Privy Councillor Amelang, have shaken my [uncertain: innermost] and have so aggravated my bodily
    sufferings that I can hardly hope for my complete recovery until some 4 weeks later. How was it possible
    for you, most gracious Prince and Lord, to take such resolutions as could have plunged me, in these
    times and given the sentiments of Baron von Stein, into the deepest misery — You point again to that
    bank order to pay, which I already three-quarters of a year ago declared null and void [uncertain:
    acklärknoch] sums still today, and Mr. Meyer says that you do this out of mercy towards me, in that
    you draw upon your last penny of need. How painfully these expressions wound my heart I am not in
    a position to describe — You wish, Most Serene Lord, out of mercy towards me, to order the payment
    of 2600 Rthl out of my own property — What is this to mean? I have here suffered unjustly and dreadfully
    on your account, indeed I have even had to endure arrest (which I have never suffered in my life)
    — I had to procure and pay the money, if I did not wish to have 2 gendarmes permanently in my room,
    who here cost me some 20 Rthl daily — the worthy Minister von Zastrow helped in this, but I had to
    bind myself towards him not to depart from here any sooner than until the 6000 Rthl were paid and
    he had his bill of exchange back. I reported this unheard-of occurrence to Your Serene Highness, and
    beg you to contribute so that the 6000 Rthl, which I have had to pay here for you, may be settled.
    I begged at the same time that that bank order to pay, also for [illegible]000 Rthl, be sent back
    to me, inasmuch as it has been declared invalid, and I have already several times been admonished
    by the bank to return the same, so that my Kontop mortgage together with my bill of exchange, which
    was drawn for only 3 months and had long since expired, might be handed back to me.'

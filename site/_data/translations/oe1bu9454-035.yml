- page: 3
  en: 'petual arrest — To Königsberg I cannot write the cause, for the sake of Your Serene Highness''s
    honour, — I have had just cause hitherto to excuse myself on the ground of illness, but in the end
    the matter will nevertheless come to light, and it might prove prejudicial to Your Serene Highness
    yourself.


    With an honest heart I have laboured to find a remedy; I hoped to obtain something through your help,
    and have already 2000 Rthl — there are only 3125 Rthl still wanting. Now I learn through Amelang,
    to my very greatest dismay, that the 2000 Rthl which Mr Meyer assigns out of compassion for me — are
    to be taken from those 6000 Rthl which I assigned to Your Serene Highness 2 years ago — Had this not
    been discovered to me by Amelang, the monies being paid with 2600 Rthl to me and with 3400 Rthl to
    Eysenhardt, then the bank, or Minister Stein, since the bill of exchange given by me for the 6000
    Rthl has long since expired — and would forthwith have been dealt with according to the law of bills
    of exchange and have had me formally arrested anew. I now beg Your Serene Highness most urgently of
    all to find a remedy, so that at least the 3125 Rthl can be paid here. For with my 2000 Rthl and with
    the costs laid out I am willing to wait, and to procure myself money for the journey to Vienna. Thereupon
    I beg just as urgently that an order be sent at once to Privy Councillor Amelang, that he redeliver
    to me the bank order for 6000 Rthl, since Eysenhardt has deposited it with him in the original — This
    is the only means whereby these notorious matters may be set aside, Your Serene Highness''s honour
    and mine saved, and I set free again, so as to be able to pursue the business most graciously committed
    to me — once my health, which is quite [uncertain: erinnert] by these accursed events, has been restored
    — and where possible to re-establish much. In all other matters I refer myself to my preceding letters,
    and leave it to Your Serene Highness''s discretion what you may be pleased to do. Only for the payment
    of the 3125 Rthl find the speediest remedy, and write to Mr Amelang that he redeliver to me at once
    the bank order for the 6000 Rthl, to which he is willing and ready — for I should be all too unwilling
    to let the matter become notorious in Königsberg, and to make known the true cause of the delay of
    my journey. In the hope of the very speediest compliance with my request, I remain as Your Serene
    Highness''s


    I observe that the term of payment to von der Lahr falls on the 14th of May, and that it is only 22
    days net [uncertain: güet] — these I will yet await here; then let it go as God wills. Berlin, the
    25th of April


    1808


    faithful and most obedient servant


    v Triebenfeld'

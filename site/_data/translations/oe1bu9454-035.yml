- page: 3
  en: 'ous arrest — To Königsberg I cannot write the cause, for the sake of Your Serene Highness''s honour
    — I have had just cause to excuse myself hitherto on grounds of illness, but in the end the matter
    will come to light after all, and it might even prove prejudicial to Your Serene Highness.


    With an honest heart I have striven to find means; I hoped to obtain something through your help,
    and already have 2000 Rthl; there are wanting only a further 3125 Rthl. Now I learn through Amelang,
    to my very greatest horror, that the 2000 r. which Mr. Meyer orders to be paid out of compassion for
    me — are to be taken from those 6000 Rthl which I ordered to Your Serene Highness 2 years ago. Had
    this not been disclosed to me by Amelang, the monies being paid out with 1600 Rthl to me and with
    3400 Rthl to Eysenhardt, then the bank or Minister Stein would — since the bill of exchange given
    by me for the 6000 Rthl has long since expired — have proceeded forthwith according to the law of
    bills of exchange and had me formally arrested anew. Your Serene Highness I now beg in the most urgent
    manner to have means found.


    that at least the 3125 Rthl may be paid here. For with my 2000 Rthl and with the costs I have laid
    out I am willing to wait, and to procure myself money for the journey to Vienna. Thereupon I beg just
    as urgently that an order be sent at once to Privy Councillor Amelang, that he hand back to me the
    bank order to pay for 6000 Rthl, since Eysenhardt has deposited it with him in the original — This
    is the only means by which these notorious matters may be set aside, Your Serene Highness''s honour
    and mine saved, and I be made free again, in order to pursue the business most graciously entrusted
    to me — once my health, which has been quite [uncertain: erinnert] by these cursed events, has been
    restored — and if possible to re-establish much. In all other matters I refer myself to my preceding
    letters, and leave it to Your Serene Highness''s discretion what you may be pleased to do. Only for
    the payment of the 3125 Rthl provide the speediest means, and write to Mr. Amelang that he hand back
    to me the bank order to pay for the 6000 Rthl at once, to which he is willing and ready — for I should
    be all too reluctant to let the matter become notorious in Königsberg, and to make known the true
    cause of the delay of my journey. In the hope of the most speedy compliance with my request I remain
    Your Serene Highness''s


    most faithful and obedient servant


    Berlin, the 25th of April 1808


    I observe that the term of payment to van der Laar falls due on the 14th of May, and that there are
    only 22 days net remaining — these I will still await here, and then let it go as God wills. von Triebenfeld'

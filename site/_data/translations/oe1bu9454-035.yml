- page: 2
  en: 'Your Serene Highness''s replies to my letter express the deepest pity for me, but made no mention
    of the bank order to pay — on the other hand Mr. Meyer writes to Privy Councillor Amelang in a threatening
    style and orders the payment, out of mercy towards me, of 1600 Rthl to the [text lost] the Privy Councillor
    is to have paid out my own money through the Royal Bank, against which I have pledged my property
    and given my bill of exchange.


    That is truly more than unheard of — I am sent hither by [uncertain: Marcul] on the weightiest affairs
    — I am, when I have concluded the business here, then to go to Vienna; I am here attacked, in a manner
    never conceivable, for 5000 Rthl of interest which Your Serene Highness is to pay, as your authorised
    representative; I prove that I am not bound to render this payment — all this avails nothing — they
    arrest me, place 2 gendarmes upon me who must guard me, and whom I must here feed daily at the inn
    — I am to pay [uncertain: vor yre mal gre] — the business entrusted to me I neither might nor could
    pursue under such surveillance — the consequences of this will yet have great influence on more than
    one man''s fate. Indeed, in this extremity the honest Minister von Zastrow advised raising the money
    and paying it. The interest amounted for 2 years to 5000 Rthl and the costs to 125. I had 2000 Rthl
    of travel money with me; upon 5000 Rthl the Minister von Z. borrowed from a certain [uncertain: Baugmer]
    van der Laar in state papers, repayable in Courant on the 14th of May of this year — the 5000 Rthl
    were converted into Courant, and we barely brought the sum together in order to be able to settle
    the interest. The term is now again at the door for paying van der Laar the 5000 Rthl — I have already
    moved heaven and hell to raise the money. But in these hard times it is in vain. I have fallen ill
    over it and lie here in wretchedness — have been held fast here, have no travel money, and what is
    worst of all I cannot act in the business entrusted to me — To this there is now further added that
    Minister Stein is not my patron, and that I am to give back the order to pay upon the bank for those
    6000 Rthl borrowed 2 years ago, and in this manner I am, for Your Serene Highness''s cause, in continu-'

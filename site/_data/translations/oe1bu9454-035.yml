- page: 2
  en: 'Your Serene Highness''s replies to my letter [uncertain: erreichen] express your great regret for
    me, but mentioned nothing of the bank order — on the contrary, Mr Meyer writes to Privy Councillor
    Amelang in a threatening style and, out of mercy towards me, assigns — 1600 Rthl upon the [text lost]
    which the Privy Councillor is to have paid out of my money through the Royal Bank, to which I pledged
    my property for it and gave my bill of exchange.


    That is truly more than unheard-of — I am sent hither by Marcul in the weightiest affairs — I am,
    when I have concluded the business here, then to go to Vienna; I am here attacked, in a manner not
    to be conceived, as his authorised representative for 5000 Rthl of interest which Your Serene Highness
    ought to pay; I prove that I am not bound to render this payment — all this avails nothing — they
    arrest me, put 2 gendarmes upon me who must guard me, and whom I must feed here daily in custody at
    the inn — I am to pay before [uncertain: yre mal gre] — the business committed to me I neither might
    nor could pursue under such supervision — the consequences of this will yet have great influence upon
    the fate of more than one person. Yes, in this [uncertain: Lange] the upright Minister von Zastrow
    advised raising the money and paying it. The interest for 2 years amounted to 5000 Rthl and the costs
    125. I had 2000 Rthl of travelling money by me; for 5000 Rthl the Minister v. J. borrowed of a certain
    [uncertain: Baugmer] von der Lahr in state papers, repayable on the 14th of May of this year in Courant,
    — the 5000 Rthl were converted into Courant, and we scarcely brought the sum together to be able to
    settle the interest. The term is now again at the door to pay von der Lahr the 5000 Rthl, — I have
    already moved heaven and hell to raise the money now. But in these hard times it is in vain. I have
    fallen ill over it and lie here wretched — I have bound myself fast here, have no travelling money,
    and what is worst of all, I cannot act in the business committed to me — And to this is now added
    that Minister Stein is no patron of mine, and that I am to give back the order on the bank for those
    6000 Rthl borrowed 2 years ago, and in this fashion I am, for the sake of Your Serene Highness''s
    affair, in per-'

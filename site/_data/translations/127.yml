- page: 1
  en: All pleading is of no help, I am to and must pay. The Prince has, as the enclosure shows, not settled
    even a single Groschen of interest. I must therefore pay the 700 Rthl promised by the Prince for the
    inventory under my guarantee, and from 1799 the interest amounting to 175 b, likewise costs of suit
    35 Rthl, together 910 Rthl. My treasury is exhausted, for only yesterday I paid 1537 Rthl 12 gg in
    the Nudnich affair – which the Prince, according to fourfold judicial documents, so solemnly promised
    to settle. Wildegans and Heyman Pincus promise to settle everything – only God knows when. I must
    pay in the meantime, if I do not wish to have execution in the house. Could Your Serene Highness help
    me with the 900 Rthl? Then have the graciousness – At Midsummer I can again support Your Serene Highness
    with the timber monies. Breslau, the 2nd of May 1804. v Triebenfeld

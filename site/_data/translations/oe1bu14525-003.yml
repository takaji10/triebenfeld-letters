- page: 3
  en: 'and of unfailing severe penalty. In witness whereof We have signed the present letter of donation
    with Our own All-Highest hand, etc. Friedrich Willhelm


    Deed of donation, for the Reigning Prince of Hohenlohe-Ingelfingen, to the hereditary and proprietary
    possession of the town of Kamionna and of the market township of Kolno, in the district of Poznań,
    of the villages of Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laske, Osiny, Hauland Trąbczyński,
    in the district of Konin, and of the village of Brzyce together with appurtenances in Cujavia.


    The verbatim agreement of the foregoing copy with the original of the All-Highest executed deed of
    donation is hereby attested and authenticated in fidem publicam. Done at Wrocław, the __th of ______
    1798. Richter, Government Audit[uncertain: or]'

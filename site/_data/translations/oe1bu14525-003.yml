- page: 2
  en: 'We also do the same hereby and by force of this present instrument, out of Royal power and plenitude,
    for Ourselves and Our descendants and successors in the Crown, the Electorate and Our remaining lands,
    in such manner and wise that the aforesaid Our kindly beloved uncle, the Prince of Hohenlohe-Ingelfingen,
    shall have, possess and enjoy the above-named estates with all rights and privileges attaching thereto,
    as such have hitherto been exercised or may lawfully be exercised, and no less with all their appurtenances
    and other belongings, by whatever name they may be called, just as the same have hitherto been used
    or may in law be used, as a well-acquired and unrestricted property — yet under reservation of the
    sovereign taxes and other public dues to be laid thereupon as upon the other estates of Our South
    Prussian vassals — for himself and his descendants and heirs, from now on for all eternity, irrevocably
    from Us and Our successors; and there shall likewise be conferred upon him the power to dispose thereof
    at his pleasure, unhindered by any man.


    We therefore command and enjoin all Our South Prussian Governments and Chambers of War and Domains,
    as also all other authorities whom the same concerns, herewith as graciously as earnestly, that they
    in no wise hinder nor trouble the oft-mentioned Prince of Hohenlohe-Ingelfingen in the hereditary
    and proprietary possession of the above-named possessions and estates together with their appurtenances
    and belongings conferred upon him, nor him or those persons upon whom he, by virtue and in force of
    this Our letter of donation, may one day bequeath the same, or may otherwise lawfully transfer it
    by other acts inter vivos aut mortis causa, but rather let him, and eventually them also, [text lost]
    the same freely and quietly, and themselves do nothing against it, [text lost]'

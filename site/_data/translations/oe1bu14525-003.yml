segments:
- page: 1
  en: 'We Friedrich Willhelm, by the Grace of God King of Prussia, do hereby, by means of this Our open
    letter, certify and declare, for Ourselves and Our successors in the Crown, the Electorate, and Our
    remaining lands, and herewith graciously give to know to each and every one whom the same concerns,
    that as We, out of inborn favour and clemency, are much inclined to acknowledge and to requite the
    good and fruitful services rendered to Us and to Our Royal House by particular marks of Our Royal
    good will, We have weighed in Our Royal mind the important, distinguished and useful [text lost: service]
    rendered to Us and to Our Royal House for [uncertain: several] years by the High-born Prince, Our
    kindly beloved uncle, Friderich Ludewig, reigning Prince of Hohenlohe-Ingelfingen, Our Lieutenant
    General of Infantry, Chief of a regiment of foot, Governor of the capital city of Wrocław, Knight
    of Our Orders etc., and have resolved, in order to give the said Prince a mark of the recognition
    of his excellent merits and of Our Royal gratitude, to confer and convey to the same, hereditarily
    and in full property, the hereinafter named estates fallen in to Our All-Highest disposition, namely:
    the town of Kamionna, and the market township of Kolno, in the district of Poznań, and the village
    of Brzyce together with its appurtenances in Cujavia, with all their appurtenances, by whatever name
    they may be called.'

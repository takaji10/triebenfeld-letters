- page: 2
  en: 'The Prince-Chancellor is Your Serene Highness''s true friend, and will certainly help, as His Excellency
    Herr von Humboldt assured me only yesterday - if the labours here were not so very numerous, what
    can be done here would already have been settled - the matter lies, as I reported last, before the
    Privy Councillor of State Stägemann, but on account of the exorbitant volume of business he cannot
    get to it. B — who after all sits with him daily, himself excuses him — But the matter will turn out
    well - In short: once the Lux are satisfied, once Cosmar''s attachment is lifted from the entailed
    estates, and Your Serene Highness is reinstated as actual lord of the entailed estate, then Cosmar
    has no further share in these estates - here he must at once withdraw, his knaveries will be discovered,
    and his end will be a sorry one — What chiefly alarmed me, moreover, was the estimate of revenues
    from the entailed estates appended to the Brieg protocol; that departs frightfully from Your Serene
    Highness''s statement. How could one ask the hamsters whether they had dragged in much or little,
    and whether there is anything still to be gathered in? I fear this will in the end cause me some grief.
    At this moment the Privy Councillor and Land [uncertain: Triechses] von Fullenbaum was here [uncertain:
    bezwieder] assuring me that Wellington too was speaking in favour of the King of Saxony - the King
    himself, however, they will not have led [uncertain] - a kind of [uncertain: Nanage] of 1200000 Rthl
    he had granted for the old gentleman, but nothing more – For the rest, the Austrian Emperor too would
    cede to Russia what he holds of Poland - and would receive in exchange a considerable piece on the
    Lotharingian [uncertain: Lotterongenſehen] side. The most effective person here at present is the
    lady whom Your'

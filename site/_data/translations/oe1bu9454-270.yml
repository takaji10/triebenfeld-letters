- page: 3
  en: 'Serene Highness once destined to be consort to Prince August — She is the [uncertain: chosen one]
    and ardently beloved of Metternich. Since she is now the [uncertain: niece] of the Prince Talleyrand,
    she stands between the two of them and does great business — Lastly, and to my horror, I [uncertain:
    hear] that the Emperor Franz has commanded that all the lodgings for the friends here, and likewise
    the people hired for their service, be maintained and kept on at his charge for a further 2 months
    — God stand by us — By the next post I [uncertain: can] report more, and certainly something of importance
    already.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 2nd of February


    1815.


    most faithful and humble and obedient servant


    v Triebenfeld'

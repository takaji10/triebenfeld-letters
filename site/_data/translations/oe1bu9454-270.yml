- page: 2
  en: 'The Prince Chancellor is Your Serene Highness''s faithful friend, and will certainly help, as His
    Excellency Mr Wilhelm von Humboldt assured me only yesterday — were the labours here not altogether
    so many, then what can be done here would already be despatched — the matter lies, as I lately reported,
    before the Privy Councillor of State Mr Stägemann, but he cannot get to it on account of the exorbitant
    press of business. Barbe — who nevertheless sits with him daily — excuses him himself — But the matter
    will turn out well — In short, once the creditors are satisfied, Cosmar''s arrest is lifted from the
    entailed estates, and Your Serene Highness reinstated as actual lord of the entailed estate, and then
    Cosmar has no further part in these estates — here he must withdraw at once, his knaveries are being
    discovered, and his end will be a sorry one — What, moreover, chiefly alarmed me was the estimate
    of revenues from the entailed estates appended to the Brzeg protocol; it departs dreadfully from Your
    Serene Highness''s statement — How could one then ask the hoarders whether they had carried off much
    or little, and whether there is still anything to be gathered in — I fear that in the end this will
    cause me some grief — this moment the Privy Councillor and Land [uncertain: Triechses] von Fullenbaum
    was [illegible], who assures me that Wellington too speaks in favour of the King of Saxony — but that
    they will [uncertain: führe] nothing to the King [illegible] Pr — an appanage of 1200000 Rthl he has
    granted for the old gentleman, but nothing more — Moreover the Austrian Emperor too would cede to
    Russia what he holds of Poland — and would receive in exchange a considerable piece on the Lorraine
    side — The most effectual person here now is the lady whom Your'

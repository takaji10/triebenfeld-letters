- page: 3
  en: 'Serene Highness once destined as consort for Herr August. She is the betrothed and hotly beloved
    of Prince Met. Since she is now the niece of the Prince [uncertain: Eürz. Failli.], she stands between
    the two and does great business.


    Finally, and to my alarm, I report that the Emperor Franz has ordered the lodgings for the friends
    here, and likewise the people hired for their service, to be maintained and kept on at his cost for
    a further 2 months. God stand by us. By the next post I shall be able to report more, and certainly
    something of importance already.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 2nd of February


    1815.


    most faithful humble and obedient servant


    v. Triebenfeld'

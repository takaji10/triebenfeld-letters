- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    If no quite extraordinary events intervene, it is settled that even the city of Kalisz will become
    Russian - I must now work solely on that side to recover Traperin again. But as yet no one from that
    quarter has given me any comforting assurance; rather it is said that the Emperor [uncertain: Räyser]
    would scarcely quash what the Administration Commission had done, and would sooner compensate the
    Prince in some other way. I am on that account in a desperate situation: the Prince-Chancellor [uncertain:
    FürstStK.] forbids me to make any démarche whatever on that side, and there I must obey, and yet all
    the while I fear that everything will be concluded quickly, and that then the gate of grace may be
    shut - Moszynski, husband of the born Prusimska, and Count Landskoy are bosom friends, so not much
    good is to be hoped for there. Yesterday the great Wellington arrived here as Ambassador Extraordinary;
    he is said to look somewhat askance at the cost [uncertain: Kosten], and from that something might
    be surmised. Meanwhile the harmony between our King and the Emperor continues firmly, whereas Prince
    Met: and Ernst Tail: are making cabals without end - and on that account there is much talk here of
    one and of great wars. Today it is said that Dresden and Leipzig together with the whole tract beyond
    the Elbe are to be taken from us again, and the King of Saxony to be reinstated there - Were that
    to happen, we should have gained nothing for all our exertion, but rather, since Russia [uncertain:
    muet] all of Poland, have lost much - It is to be hoped that our acknowledgedly brave King will after
    all not let this happen.'

- page: 1
  en: '270


    Most Serene Prince


    Most gracious Prince and Lord!


    If no quite extraordinary events intervene, it is settled that even the town of Kalisz will yet become
    Russian — I must now work solely on that side to get Trąbczyn back again. But as yet not one of them
    all has given me any comforting assurance from that quarter; rather, it is said that the Emperor would
    hardly annul what the Commission of Good Administration had done, and would sooner compensate the
    Prince in some other way. I am on that account in a desperate position: the Prince Chancellor of State
    forbids me to make any démarche whatever on that side, and so I must obey, and all the same I fear
    that everything will be quickly concluded and that the gate of grace will then be shut — Miączyński,
    husband of the lady née Prusimska, and Count Lanskoy are bosom friends, so not much good is to be
    hoped for there — Yesterday the great Wellington arrived here as Ambassador Extraordinary [uncertain:
    eingetrösten]; he is said to look somewhat askance at Kosten, and so something might be suspected
    there — Meanwhile the harmony between our King and the Emperor continues firmly — whereas the Prince
    Metternich and the Prince Talleyrand carry on intrigues without end — and on that account there is
    much talk here of one and of great wars — Today it is said that Dresden and Leipzig, together with
    the whole tract beyond the Elbe, are to be taken from us again, and the King of Saxony to be reinstated
    there — If that should happen, then for all our exertions we should have gained nothing, but rather,
    since Russia takes all Poland, have lost much — It is to be hoped that our King, acknowledged brave
    as he is, will not let this come to pass.'

- page: 1
  en: '253


    Most Serene Prince,


    Most gracious Prince and Lord, The latest opinion of Court Councillor Hahn also I have delivered,
    together with the letter appended here in copy, to His Serene Highness the Prince Chancellor of State.
    The answer was: "Well! here too there is nothing further than what was said in the first submission
    — meanwhile it is good that the judgement from that quarter is of one mind. The Duchess of Żagań is
    seeking the King''s permission to raise monies upon Żagań, and assigns as security that which the
    King owes her. She [uncertain: weit] precisely the sum guaranteed for Prince Hohenlohe. The King has
    once again postponed the matter until his return home. As soon as it can be done I shall certainly
    press the matter forward." Now I am working day and night to obtain the assurance in writing that
    I may conclude with the Courland attorneys. The Duchess is here; she has the most pressing need of
    money — I wished to go to the Duchess myself, but Barbe, who pursues the matter with genuine zeal,
    would by no means have it. I can therefore only observe [uncertain: the ladies] from a distance —
    Upon a verbal enquiry concerning Trąbczyn and Kamionna, I have received the answer here enclosed.
    I begged urgently to be able to send Your Serene Highness something consoling; I got a rebuff, and
    thereupon yesterday evening this curt reply. [uncertain: Gewesen] I am now that the matter will be
    roasted along on the great hearth. For the rest, little has yet been settled here; not until about
    the 15th of the coming month is it to be made known what has been resolved in the council of the gods.


    The King of Württemberg is ready to burst with vexation that they will not communicate to him the
    plans of the things now in train. He has now declared that if they do not put him au fait of everything,
    he would leave Vienna at once and protest against everything.'

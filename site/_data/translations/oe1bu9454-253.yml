- page: 2
  en: 'There is great anxiety on that account, especially as to who is to give counsel and direct [uncertain:
    the affairs] here if this shrewd, discerning, humane man withdraws. He is certainly in earnest with
    his zeal, for he is said already to have drawn together an army of 4,000 men.


    Meanwhile things are said to be beginning to grow very unquiet in the Württemberg lands, and likewise
    in the Baden lands; joined with the restless Swiss, the spark might well become a blazing flame —
    and will it not then be said, what does not burn me I need not put out. More by the next post — In
    deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 26th of November


    1814


    most faithful and obedient servant


    v Triebenfeld'

- page: 2
  en: 'On that account there is great anxiety, especially as to who is to counsel and to guide the high
    affairs here if this shrewd, discerning, humane man withdraws. He must surely be in earnest with his
    zeal, for he is said already to have drawn together an army of 4000 men.


    Meanwhile things are said to be beginning to grow very restless in the Württemberg lands, and likewise
    in the Baden lands; joined with the restless Swiss, the spark might well become a demanding flame,
    and will it not then be said: what does not burn me I need not put out. More by the next post. In
    deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 26th of November


    1814


    faithful and most obedient servant


    v. Triebenfeld'

- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    The latter opinion of the Court Councillor Hahn also I have delivered, together with the letter appended
    here in copy, to His Serene Highness the Prince State Chancellor. The answer was: "Well! here too
    there is nothing further than what was said in the first submission – meanwhile "it is good that the
    judgement from that side agrees. "The Duchess of Sagan is seeking the King''s permission to raise
    monies upon Sagan, "and assigns what the King owes her as security. "She [uncertain: assigns] precisely
    the sum guaranteed for the Prince of Hohenlohe. "The King has once again deferred the matter until
    his return home. "As soon as it can be done I shall certainly press the matter. At present I am working
    day and night to obtain the assurance for myself in writing, so as to be permitted to conclude with
    the Courland mandatories. The Duchess is here, she has the most pressing need of money – I wished
    to go to the Duchess myself, but B:, who pursues the matter with genuine zeal, would by no means have
    it. I can therefore only observe the lady from a distance. Upon an oral enquiry concerning Trąbczyn
    and Kaemen I have received the answer appended herewith. I begged urgently to be able to send Your
    Serene Highness something consoling; as it was, I got a [illegible: Wirscher], and thereupon yesterday
    evening this brief reply, so that I am now [uncertain: of the view] that the matter is now being roasted
    along with the rest on the great hearth. For the rest, little has yet been settled here; not until
    about the 15th of next month is it to become known what has been resolved in the council of the gods.


    The King of Württemberg is ready to burst with vexation that they will not communicate to him the
    plans of the things in hand. He has now declared that if they do not [text lost] him of everything
    in time, he would leave Vienna at once and protest against everything.'

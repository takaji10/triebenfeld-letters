- page: 3
  en: 'Naming of the new villages which arise through the dismemberment at Zagórów and Trąbczyn.


    Friedrichsfeld, Ludwigslust. = Grądzyń. Sophienberg, Adelow.


    = Drzewce. Augustinow, Emilienhein. = the old foundry. Wildenbruch, Schönau, or Klein Ingelfingen.
    = behind Kopojno.'

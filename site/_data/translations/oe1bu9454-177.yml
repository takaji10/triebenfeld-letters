- page: 2
  en: 'that tomorrow the dismemberment matter will be laid before the Minister, and the day after that
    the report will go off to the King and the highest approbation will be procured. According to the
    state of the files he would answer for it that the same cannot [uncertain: fail to be granted] but
    must absolutely be granted. As regards Betsche, upon Reinbeck''s advice I am to submit nothing until
    I have that approbation — then I am to submit the matter to the Minister myself, so that he may turn
    the whole of it to the best advantage. As respects the war business, it remains the case that the
    whole army is being mobilised.


    The Emperor has now proposed an interview between [uncertain: himself and] our King. The King has
    answered him par Courier that he would be content with that. From his resolve to mobilise his whole
    army he would not depart, however — for he would not let the [uncertain: penalty] be drawn through
    his country; that would be worse than if he lost a whole campaign — In general he would now meddle
    no further in anything, but whoever should seek to force him to something, him he would meet with
    his whole might, and he would sooner be buried beneath the ruins with his last man than depart from
    this resolve.


    General Ruchel goes off tomorrow to East Prussia; likewise General Relitirente /who is very dissatisfied
    and means to demand his discharge/ is to go off these days to Pomerania. As General Köckritz says,
    it is wished that Your Serene Highness might also soon be in South Prussia. Seven generals are being
    placed on the retired list, among whom General Dolfs was [uncertain: named] when I heard them named.
    Field Marshal Mollendorf is said to [text lost]'

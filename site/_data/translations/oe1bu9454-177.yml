  en: 'the best course, that one should further take 150,000 Rthl, together 30,000 Rthl, from the Invalids''
    Fund, pay off Oppenheimer and everything here, clear everything, and discharge this item of debt little
    by little out of the revenues of the [uncertain: estates]. As soon as I have leased out the demesne
    farm here and have a lump of money together, I shall hasten at once to Kalisz to direct everything
    there, and shall come to Wrocław to learn Your Serene Highness''s further high opinion.


    von Triebenfeld'

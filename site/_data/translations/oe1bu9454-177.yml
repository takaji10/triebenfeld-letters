- page: 5
  en: 'Of monies only 7,130 Rthl have so far come in; out of these the interest has been paid and the
    remainder sent to Wrocław!


    Radzinski is to and must pay down 6,000 Rthl these days, otherwise he will be subjected to execution
    — he is truly the wickedest man I have ever come across. On Thursday some of the colonists who were
    driven apart mean to present themselves again. God knows whether they will keep their word. They promised
    to pay down several thousand rt in cash. On Monday a man who wishes to lease the little demesne farm
    and to buy grounds has likewise promised to bring 5,000 Rthl. Had Mr von Voss begun his clamour after
    the harvest, I should have laughed at his follies; as it is, however, he frightened my people away
    at the wrong time — now the people will hardly come together again before after the harvest.


    Here it has again been ordered that Prusimska be paid her 20,000 Rthl.


    Mr Weigel is to and must have the 23,000 Rthl still coming to him; then the Schlabrendorff woman is
    to be satisfied with 25,000 Rthl. That is a further sum of 68,000 Rthl. These and more than a hundred
    thousand besides are supposed to come in. Only God knows when this will happen — If I could but very
    soon get back the approved contracts / for I have had to submit them all as proof / together with
    the concession of all the revenues, then I believe it will indeed be'

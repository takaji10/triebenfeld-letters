  en: the best course, that one should take a further 150000 Rthl, together 30000 Rthl, from the Invalids'
    Fund, pay off Appenhumer and everything here, clear everything, and extinguish this debt little by
    little out of the revenues of the estates. As soon as I have leased the demesne farm here and have
    a lump of money together, I shall hasten at once to Kalisz, to direct everything there, and shall
    come to Breslau to learn Your Serene Highness's further high opinion. von Triebenfeld

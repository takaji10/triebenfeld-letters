- page: 7
  en: '[text lost] and command this army if it comes to anything. The Duke of Brunswick, however, the
    whole [uncertain: direction]. The tidings which I wrote already eight weeks ago, and which at that
    time were held to be of very little consequence, are now found confirmed, and only three days ago
    Chlebowski and Vöhler wrote the same as important news — the King has been much [uncertain: exercised]
    over many things — I am to go along, as I wrote last time — but I shall look to myself — Your Serene
    Highness can [uncertain: be to] go by way of Vielen to Lenschitz; there you are not far from your
    estates. In deepest reverence I remain, until death, as Your Most Serene Highness''s To Colonel von
    Schlieben I gave 2000 Rthl yesterday, since Mucrowis had sent no money, and he must quash the suit
    — I have also paid here a further 100 fr. d''or to the assistants — Everything truly goes well. Hardenberg
    has hitherto been too scarce; I have not yet been able to speak with him. Today he has gone for a
    couple of days to his estates, and the King is at Paretz, where he means to stay until the [uncertain:
    torch-dance] of Ferdinand''s jubilee wedding, which is on the 27th. Berlin, the 24th September.


    1805


    most humble and obedient servant


    von Triebenfeld'

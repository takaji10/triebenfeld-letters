- page: 4
  en: 'B. Register of the established new villages and of the grounds remaining to the manorial lordship
    (Dominium)


    1. In the Zagórów lordship there have been dismembered


    a. at Grądzyń


    1. Colony of 1,650 Morgen, settled with 39 husbandmen, called Klein Ingelfingen


    b. on Drzewce


    2. Colony of 960 Morgen, settled with 18 husbandmen, called Alexandrow


    3. Colony of 1,200 Morgen, settled with 40 M husbandmen, called Augustinow


    4. Colony of 1,221 Morgen, settled with 40 M husbandmen, called Emilienhain


    5. Colony of 600 Morgen, settled with 20 M husbandmen, called Adolphsberg


    c. at Kopojno


    6. Colony of 1,830 Morgen, settled with 31 husbandmen, called Friedrichsfelde


    7. Colony of 1,590 Morgen, settled with 40 husbandmen, called Ludwigslust


    8. Colony of 720 Morgen, settled with 24 husbandmen, called Sophienthal


    9. Colony of 1,530 Morgen, settled with 35 husbandmen, called Adelowo. To old [uncertain: Poland].
    severally 1,230 Morgen, settled with 20 husbandmen, called at Kopojno village and Skokum


    d. at Trąbczyn


    10. Colony of 1,524 Morgen, settled with 40 husbandmen, called Justinsau


    11. Colony of 1,274 Morgen, settled with 34 husbandmen, called Kaschubowe


    12. Colony of 1,866 Morgen, settled with 60 husbandmen, called Furstenfelde. Colony of 538 Morgen,
    settled with 8 husbandmen, called the former Przybysław


    13. Colony of 1,266 Morgen, settled with 42 husbandmen, called Klein Schrotzberg. Colony of 300 Morgen,
    settled with 8 husbandmen, called die alte Hütte


    14. Colony of 1,632 Morgen, settled with 54 husbandmen, called Hellendorff


    15. Colony of 476 Morgen, settled with 25 husbandmen, called Stetten[uncertain: i]feld. Total 21,407
    Morgen and 578 husbandmen


    At Trąbczyn there remains


    1. demesne farm of 724 Morgen


    2. at Mariantów 60 Morgen (= 784 Morgen) woodland. There remains at Trąbczyn 1,500 Morgen


    at Kopojno 832 Morgen


    at Grądzyń 1,126 Morgen


    at Wrąbczyn 333 Morgen (= 3,791 Morgen)


    = 4,575 Morgen


    Besides this, the old subjects have had their pasture and wood [uncertain: allowances] fixed by contract.'

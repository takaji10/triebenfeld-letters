- page: 1
  en: '177


    Most Serene Prince


    Most gracious Prince and Lord, there is little to be settled here at present, since everything is
    now in confusion on account of the mobilisation of the army. Klewitz had to hurry off yesterday to
    South Prussia to drive grain together there; Minister von Voss sits in Havelberg and sings psalms,
    and therefore in whatever falls into this department there is nothing to be done for the moment. The
    approval is being pressed forward by Privy Councillor Reinbeck, who intends to attend to it and have
    it executed immediately upon Voss''s return. Upon the approval of the dismemberment the money business
    depends; as soon as I have this, the revenues stand [uncertain: travelled], and then I hope to obtain
    from the Invalids'' Fund and from the Board of Wards the sum of money needed for the payment of all
    debts. All this has been set in train — meanwhile I cannot wait upon the thing, but must hasten back
    to Trąbczyn to work there. With Pszczew the matter will, and must, likewise go forward. Reinbeck is
    Amelang''s bosom and boyhood friend, and through him everything will be capable of being pressed.
    Should anyone be in any way refractory, I have the promise of the most powerful protection from the
    Court.


    To Minister von Voss there went out yesterday from Potsdam an order that he should suspend the psalm-singing
    until another time and come home, since there were more important affairs to be dispatched here. He
    is to arrive this evening. Reinbeck has just now given Amelang the [uncertain: seduction]'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, There is at present little to be settled here, for everything is now
    in confusion on account of the mobilisation of the army. Klewiz had to hasten to South Prussia yesterday
    and drive the [uncertain: the] grain together; Minister Voss sits in Havelberg and sings psalms, and
    therefore there is, as regards what falls within this [illegible], nothing to be done for the time
    being. The approbation is being pressed forward by Privy Councillor Reinbeck, who intends to see to
    it and have it executed as soon as Voss returns. Upon the approbation of the dismemberment the money
    business depends; as soon as I have this the revenues stand [uncertain: ready], and then I hope to
    obtain from the Invalids'' Fund and from the Wards'' Board the sum of money needed for the payment
    of all debts. All this has been set in train; meanwhile I cannot wait upon the thing, but must hasten
    back to Trąbczyn in order to work there. With Betsche the matter must go too. Reinbeck is Amelang''s
    bosom and boyhood friend, and through him everything will be capable of being pushed forward. Should
    anyone prove in some measure refractory, I have the assurance of the most powerful protection from
    the court.


    To Minister von Voss there went out from Potsdam yesterday an order that he should suspend the psalm-singing
    until another time and come home, inasmuch as there were more important matters to be dispatched here.
    He is to arrive this evening. Reinbeck has just now given Amelang the [uncertain: guidance]'

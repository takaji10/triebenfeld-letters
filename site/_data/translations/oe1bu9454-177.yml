- page: 5
  en: 'Of monies there have so far come in only 7130 Rthl; out of these the interest has been paid and
    the remainder sent to Breslau!


    Radzinski shall and must pay down 6000 Rthl these days, otherwise he will have execution levied upon
    him — he is truly the most malicious man I have ever met with. On Thursday some of the colonists who
    were driven apart from one another mean to present themselves again. God knows whether they will keep
    their word. They promised to pay down several thousand Rthl in cash. On Monday a man who wishes to
    lease the little demesne farm and buy grounds has likewise promised to bring 5000 Rthl. Had Herr von
    Voss begun the racket after the harvest, I should have laughed at his follies; as it is, however,
    he [uncertain: frightened off] the people for me at the wrong season — now the men will hardly come
    together again before after the harvest.


    Here too it has again been ordered that the Prusimska be paid her 20000 Rthl


    Herr Weigel shall and must have the 23000 Rthl still coming to him; then the Schlabrendorff woman
    is to be satisfied with 25000 Rthl. That is a further sum of


    68000 Rthl. These and above a hundred thousand more are to come in; only God knows when this will
    happen — If I only had back very soon the approved contracts /for I have had to submit them all as
    evidence/ together with the concession of all revenues, then I believe it will surely be'

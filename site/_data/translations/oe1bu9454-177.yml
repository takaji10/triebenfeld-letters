- page: 2
  en: 'that tomorrow the dismemberment matter will be laid before the Minister, and the day after tomorrow
    the report will go off to the King and the highest approval be obtained. According to the state of
    the files he would vouch for it that the same cannot [uncertain: arise] but must absolutely be granted.
    As to Pszczew, upon Reinbeck''s [uncertain: Reinb] advice I am to submit nothing before I have that
    approval — then I am to submit the matter to the Minister myself, so that he may turn the same to
    everyone''s best advantage. As regards the war business, it remains the case that the whole army is
    being mobilised.


    The Emperor has now proposed a meeting between himself and our King. The King has answered him by
    courier that he was content with that. From his intention of mobilising his whole army, however, he
    would not depart — for he would not let the [uncertain: penance] march through his country, that would
    be worse than if he lost a whole campaign — in general he wished now to meddle in nothing further,
    but whoever should try to force him to anything, him he would meet with his whole might, and he would
    sooner be buried with his last man beneath the ruins than depart from this intention.


    General Rüchel departs tomorrow for East Prussia, and likewise General Kalckreuth / who is very discontented
    and wishes to demand his discharge / is to depart these days for Pomerania. As General Köckritz says,
    it is wished that Your Serene Highness might also soon be in South Prussia. Seven generals are being
    put into retirement, among whom General Dolfe was included as I heard them named. Field Marshal Mollendorf
    is to [text lost] house'

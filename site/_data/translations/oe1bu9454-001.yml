- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests! A few hours ago I received
    from a trusted friend the news that Austria, Russia and Prussia had come to an agreement concerning
    Saxony and Poland, and that the Congress may now be almost brought to a close. Since the 13th of January
    I have had no news from you; I live in great anxiety on that account. — After the several assurances
    on the part of His Serene Highness the Prince State Chancellor, I might count with the highest confidence
    upon rescue. But if the Congress is concluded without anything having been done for me, then I am
    irretrievably lost and must perish in the greatest distress; exert yourself therefore in every way,
    and lay my distress[?] to the heart of Prince Hardenberg, who was after all always my friend. The
    report of the Brieg High Provincial Court was already sent in on the 14th of last month to His Serene
    Highness the Prince Chancellor. — It is favourable to me and proves everything that has been said
    by me on the matter. The Prince can now help me with every right. I ask nothing further / and this
    you will take well to heart / than that His Serene Highness the Prince grant the advance of 112000
    Rthl, and against it have all the entailed estates taken at once into administration. Then Cosmar''s
    power is at an end. Only the day before yesterday the [uncertain: Kurz] mandatary gave the assurance
    that as soon as he receives the 12000 Rthl in cash and a secure [uncertain: instruction/order to pay]
    upon the hundred thousand Rthl, he will at once deliver up the instrument of debt with a receipt;
    and this is indeed the only thing, if the entailed estates always [uncertain: einzinsicht] — If the
    Prince grants only that, then I am already saved; the estates are of such importance that the King
    will soon have the advance back again, everyone receives what is his, and I need no longer go hungry.
    As regards Cosmar the matter then settles itself: he withdraws at once from the entailed estates,
    his execution ceases, he must at once render account and place all sums he has in hand ad Depositum,
    for that is where the report of the Brieg High Provincial Court points, and the matter is founded
    upon law and equity. These things you need at bottom only urge in passing, since here everything must
    follow of itself. Only, only for the 112000 Rthl do beg His Serene Highness, that he grant this advance;
    then I am quit with the King and with the Curl heirs, and am saved from Cosmar''s clutches. Next to
    this I beg that the Trąbcziner and Kaemener affair now be taken up further. The King has (conferred
    upon me the said estates by the deed which you have there; I have possessed the estates in peace for
    over 12 years, and the Poles took the same away arbitrarily only 14 weeks after the Peace of Tilsit.
    Here, then, the Emperor would have to order that the estates be restored to me and that the revenues
    drawn from them be reimbursed by the Moszynska. Further I can add nothing more today, but only assure
    you, as ever, of my grateful friendship and high esteem, as Your Right Honourable''s Schlawenschitz,
    the 29th of January 1815'

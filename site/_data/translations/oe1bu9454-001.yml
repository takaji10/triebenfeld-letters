segments:
- page: 1
  en: 'Right Honourable Sir,


    Highly Honoured Sir, Councillor of War and Forests!


    A few hours ago I received from a trusted friend the news that Austria, [uncertain: Russia] and Prussia
    have come to agreement concerning Saxony and Poland, and that the matter may now be very nearly concluded.


    Since the 13th of January I have had no news from you; I live in great anxiety on that account. —
    After the several assurances on the part of His Serene Highness the Prince State Chancellor, I might
    count with the highest confidence upon rescue. But if the Congress is brought to an end without anything
    having been done for me, then I am irretrievably lost, and must perish in the greatest distress. Therefore
    exert everything you can, and lay my distress[?] before the heart of Prince Hardenberg, who has after
    all always been my friend. The report of the Brieg High Provincial Court was already sent in to His
    Serene Highness the Prince Chancellor under the 14th of last month — it is favourable to me and proves
    everything that has been said by me upon the matter. The Prince can now help me with every right.


    I ask for nothing further — take this well to heart — than that His Serene Highness the Prince grant
    the advance of 112000 Rthl, and in return have all the entailed estates taken into administration
    at once. Then Cosmar''s power is at an end. Only the day before yesterday the attorney Kurz gave this
    assurance, that as soon as he receives the 12000 Rthl in cash and a secure instruction for payment
    upon the hundred thousand Rthl, he will immediately deliver up the debt instrument receipted, and
    this is indeed all that is wanted if the entailed estates are once brought under [uncertain: assessment].
    If the Prince grants only that, then I am already saved; the estates are of such consequence that
    the King will soon have the advance back again, each receives what is his, and I need no longer [uncertain:
    languish]. As regards Cosmar, the matter then settles itself; he withdraws at once from the entailed
    estates, his execution ceases, he must immediately render account and deposit in court all sums he
    holds behind him, for to that effect the report of the Brieg High Provincial Court points, and the
    matter rests upon law and equity. In substance you need only urge these things incidentally, since
    here everything must follow of itself. Only beg His Serene Highness for the 112000 Rthl, that he may
    take the trouble of this advance; then I am clear with the King and with the [uncertain: Curl] heirs,
    and am saved out of the claws of Cosmar.


    Next I beg that the Trąbczyn and Kaemen matter now be taken up further. The King granted me the said
    estates by the instrument which you have there; I possessed the estates in peace for over 12 years,
    and the Poles took the same away by their own authority only 14 weeks after the Peace of Tilsit. Here
    now the Emperor would have to command that the estates be restored to me and that the revenues drawn
    from them be reimbursed by Mrs. Moszynska. Further I can add nothing more today, but only assure you,
    as ever, of my grateful friendship and high esteem, as Your Right Honourable


    Schlawenschitz, the 29th of January


    1815'

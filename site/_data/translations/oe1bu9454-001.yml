- page: 1
  en: '1


    Right Honourable Sir,


    Highly Honoured Councillor of War and Forests!


    A few hours ago I received from a trusted friend the news that Austria, [uncertain: Vnß land] and
    Prussia had come to agreement concerning Saxony and Poland, and that the [uncertain: Begrif jezt schreib]
    may now be brought to a conclusion.


    Since the 13th of January I have had no news from you; I live in great anxiety on that account. —
    After the repeated assurances on the part of His Serene Highness the Prince State Chancellor, I might
    count with the highest confidence upon rescue. But if the Congress is brought to an end without anything
    having been done for me, then I am irretrievably lost and must perish in the greatest distress; therefore
    exert everything, and lay my distress to the heart of Prince Hardenberg, who has after all always
    been my friend. — The report of the Brzeg Upper Provincial Court was already sent in on the 14th of
    last month to His Serene Highness the Prince Chancellor. — It is favourable to me and proves everything
    that has been said by me on the matter. The Prince can now help me with every right.


    I ask for nothing further — take this well to heart — than that His Serene Highness the Prince grant
    the advance of 112000 Rthl, and against it have all the entailed estates taken at once into administration.
    Then Cosmar''s power is at an end. Only the day before yesterday the mandatary [uncertain: Kurz] gave
    this assurance, that as soon as he receives the 12000 Rthl [uncertain: Baur] and a secure order to
    pay upon the hundred thousand Rthl, he will at once deliver up the debt instrument with a receipt;
    and this is indeed the only thing, if always the entailed estates [uncertain: einzinsicht]. Let the
    Prince only grant that, and I am already saved; the estates are of such consequence that the King
    will soon have the advance back again, everyone receives what is his, and I need not go hungry any
    longer. As for Cosmar, the matter then settles itself. He withdraws at once from the entailed estates,
    his executorship ceases, he must render account forthwith and give over into deposit all sums he has
    behind him, for so the report of the Brzeg Upper Provincial Court directs, and the matter rests upon
    right and equity. These you need at bottom only urge in passing, because here everything must follow
    of itself. Only, only beg His Serene Highness for the 112000 Rthl, that he [uncertain: gemühet] this
    advance; then [uncertain: bey] I settled with the King and with the Cur. heirs, and am rescued out
    of Cosmar''s [uncertain: Kleinen].


    Next to this I beg that the Trąbczyn and Kamionna matter be now attended to. The King has (conferred
    these same estates upon me by means of the instrument which you have there; I have held the estates
    in quiet possession for over 12 years, and the Poles took the same away by their own authority only
    14 weeks after the Peace of [uncertain: Tilsit]. Here the Kaiser would now have to command that the
    estates be restored to me and that the revenues drawn from them be reimbursed by the Miączyńska. I
    can add nothing more today, but only assure you, as ever, of my grateful friendship and high esteem,
    as


    Your Right Honourable''s


    Sławięcice, the 29th of January


    1815'

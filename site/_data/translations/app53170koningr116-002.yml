status: draft
segments:
- page: 1
  en: 'Done in Konin on the Wednesday next after the Feast of the Assumption into Heaven of the Most Glorious
    Virgin Mary, namely on the 16th day of the month of August in the Year of the Lord 1775.


    On behalf of the Most Illustrious Right Honourable Prusimski — Letters of Innotescence — Oblata


    Let there be seen here the Letters of Innotescence for the Commission assigned to the estate of the
    goods of Trąbczyn, enrolled by the first in order of those subscribed, among the Produced Documents.


    On behalf of the same, against the Right Honourables Chełmski — Innotescentia — Relatio


    Let there be seen here the Citations of Innotescence on behalf of the Right Honourable Antoni Prusimski,
    Starost of Niszczewice, heir of the goods of Trąbczyn, in and against the [Heirs] and Possessors of
    the goods of Łukom, Podbiele, Szetlew, and also the Most Illustrious Most Reverend Abbot and Convent
    of Ląd, for the Commission issued for the Field — Relatio, among the Produced Documents.'
- page: 2
  en: 'On behalf of the Right Honourable Chełmski, against the [Heirs], Collaterals and Trąbczyn — Innotescentia
    — Relatio


    Let there be seen here the Citations of Innotescence on behalf of the Right Honourable Chełmski, heir
    of the goods of Łukom, against the [Heirs] of Trąbczyn, Drzewce, Biskupice, for the term of the Boundary
    Commission between Trąbczyn and Łukom assigned by the Estates of the Republic, then occurring — Relatio,
    issued among the Produced Documents.'

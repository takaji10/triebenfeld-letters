- page: 1
  en: '266


    Most Serene Prince


    Most gracious Prince and Lord!


    For some days past there have been great debates here concerning Poland, when on the other side they
    depart from the first treaty and demand absolutely the Prosna as the border, that is to say from Thorn
    onward as far as the fall of the Prosna into the Wartha and then down the Prosna as far as Ostroszew
    — If this comes to pass, then the Trąbczyn estates and even my own Blizanów estates come under [uncertain:
    Waste] sovereignty — And then it will be a hot business to get Trąbczyn back again — The upright Prince
    Chancellor sets himself alone vehemently against all this and appeals to the word given by the Emperor
    of Russia — the honest man had vexed himself quite feverish, and had to keep to his bed for 3 days
    — His Majesty the King seem also very [uncertain: pleased], for 6 days now the gentleman has dined
    quite alone off the napkin and sees no one — this gives occasion here to many rumours — All Vienna
    is a [uncertain: Gesammste] of great wars impending — indeed even from Berlin such reports come in
    — I must now be all the more attentive and watch which way the scale will incline, for if Russia obtains
    the districts in which the estates lie, then the Prince Chancellor alone will [uncertain: umfürehr]
    settle the matter with the Emperor Alexander, since he did not allow that I might present Your Serene
    Highness''s letter to the Emperor — for the Dąbska or Miączyńska stands in high favour with Lanskoy
    and therefore everything can only be done with the Emperor alone — For the rest, every friend and
    admirer of Your Serene Highness here awaits eagerly the report of the Brzeg Superior Provincial Court;
    [text lost] indeed that I may receive the same speedily here and that it turns out conformable to
    the first memorial — then all will end according to our wish — Your letters to me may it please you
    now to have sent by way of Wrocław and Dresden under the address of the Royal Prussian Post Director
    Balke at Dresden —


    1. To me nothing further than to the said von Triebenfeld, and take care to make it up with a wafer
    seal, then have 2 a [uncertain: courier] over it made out to Barbe; the address is — to the Royal
    Prussian Court Councillor and [uncertain: Maß] Knight Mr Barbe, Right Honourable [uncertain: Hochwol],
    at Vienna


    3. Over this a cover is made out to the Royal Prussian Post Director Mr Balke, Your Honour, at Dresden
    — only in this manner do we receive the letters securely and [uncertain: geſcheinnde], for since the
    17th of December'

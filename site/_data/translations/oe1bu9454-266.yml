- page: 2
  en: 'I have not had a syllable from Your Serene Highness — Full of longing, I look for the blanks, the
    powers of attorney and everything, and especially useful would be the letter to His Serene Highness
    the Chancellor. Dreadfully prejudicial may these delays prove in the end — The written undertaking
    to Barbe is also most necessary, for Pourtalès / not Portalis / will answer very quickly, and will
    certainly enter into it — He has a fortune of more than 1 1/2 million Rthl in ready money and follows
    blindly his friend from youth and schoolfellow B[arbe]: as for how I live here in other respects,
    that is hand to mouth, I have nothing on my back, and often nothing in my belly — Already today I
    am 104 ducats in debt to B; [uncertain: Auf] he looks a little dark when I wish to borrow. What is
    to become of it I do not know, for if the King should once break up suddenly, what is then to become
    of me? I would and do act for you, most gracious Lord, on as an honest fellow. The matter is of the
    highest importance for you — peace, honour and happiness for you are at stake, this I am to win, and
    you let me all but perish in want and distress, indeed you let me go hungry — even B[arbe] already
    shakes his head — B[arbe] has friends in the Russian cabinet; these too will have to be courted in
    the end, and with an empty hand that is impossible — If only the 100 ducats could first be here, that
    I might satisfy B — but then I must absolutely, at the very soonest, have 200 ducats more, so that
    I may pay everything and at last do well by the good people for their faithful assistance — Concerning
    your letters sent to me, be pleased, most gracious Lord, to have tracers sent after them, so that
    I may receive the letters and the money —


    Most respectfully I remain, until death,


    Your Serene Highness''s


    My poor children, do not


    forget them either —


    J. Mother: they say she is to be removed.


    Vienna, the 10th of January


    1815.


    most faithful and humble and obedient servant


    von Triebenfeld'

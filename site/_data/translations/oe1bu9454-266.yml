- page: 2
  en: 'I have not had a syllable from Your Serene Highness - Full of longing, I await the blank powers
    of attorney and everything else; the letter to His Serene Highness the Prince Chancellor would be
    especially [uncertain: welcome]. Frightfully injurious may these delays prove in the end. The written
    undertaking to Barbe is likewise most needful, for Pourtales (not Portalis) will answer very quickly,
    and will certainly enter in - He has a fortune of more than 1 1/2 million in ready money and follows
    blindly his friend of youth and schoolfellow B: As for how I live here in the meantime, it is hand
    to mouth; I have nothing to put on, and often nothing in my belly – Already today I am 104 ducats
    in debt to B; and he looks a little dark when I wish to borrow. What is to become of this I do not
    know, for if the King once breaks up in haste, what is then to become of me? I would and do continue
    to act for you, most gracious Lord, as an honest fellow. The matter is of the highest importance for
    you - peace, honour and fortune for you are at stake, this I am to win, and yet you let me all but
    perish in want and sorrow, indeed you let me [uncertain: hunger] - even so my head is already shaken
    - Thus it has been manoeuvred in the Russian [uncertain: friends]; these too will in the end have
    to be courted, and with an empty hand that is impossible. If only the 100 ducats could come here so
    that I might satisfy B – but then I must absolutely have, as soon as possible, another 200 ducats,
    so that I may pay everything and at last do well by the good people for their faithful assistance
    — Concerning the letters sent to me, be pleased, most gracious Lord, to have enquiry slips sent after
    them, so that I may receive the letters and the money -


    With high esteem I remain, until death,


    Your Serene Highness''s


    Vienna, the 10th of January


    1815.


    My poor children, do not forget


    them either, I beg.


    J. Mother: it is said she is being deposed.


    faithful and most humble and obedient servant


    von Triebenfeld'

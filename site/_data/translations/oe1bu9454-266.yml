- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    For some days now there have been great debates here on account of Poland, since on the other side
    they are departing from the first treaty and absolutely demand the Prosna as the boundary, that is
    to say from Thorn onward as far as the confluence of the Prosna with the Warta, and then down the
    Prosna as far as [illegible]stroczew — Should this happen, then the Trąbczyn estates and even my Blizanow
    properties come under [uncertain: Wüste] sovereignty — And then it will be [uncertain: Hyzje fezzan]
    to get Trąbczyn back again – The [uncertain: both] Prince Chancellor alone sets himself violently
    against this and appeals to the word given by the Emperor Z — the honest man had vexed himself quite
    raw, and had to keep to his bed for 3 days — His Majesty the King is likewise most displeased; for
    6 days now the gentleman has dined quite alone from the napkin and sees no one — this gives rise here
    to many rumours — All Vienna is one [uncertain: whole] of impending great wars — indeed even from
    Berlin such reports come in — I must now be all the more attentive and watch which way the scale of
    the balance will incline, for if Russia obtains the districts in which the estates lie, then the Prince
    Chancellor alone will settle the matter [uncertain: beforehand] with the Emperor Alexander, as he
    did not allow that I might present Your Serene Highness''s letter to the Emperor – for the Dąbska
    or Moscinska stands in high favour with [uncertain: Landskog]


    and therefore only


    everything can be done with the Emperor alone. For the rest, every friend and admirer of Your Serene
    Highness here awaits the report of the citizens'' [uncertain: O L] court eagerly, [see to it] indeed
    that I receive the same speedily here and that it turns out conformable to the first memorial - then
    all will end according to our wish - Be pleased now to let your letters to me go by way of Breslau
    and Dresden under the address of the Royal Prussian Post Director Balke in Dresden -


    1. To me nothing further than to the aforesaid von Triebenfeld, and to make the folds with a wafer;
    then have 2 a [uncertain: Courirt] made over it to Barbe; the address is [uncertain: d Köcke Haßrath]
    and Knight of the Order Sir Barbe, Your Right Honourable


    3. Over this a [uncertain: cover] is made to the Royal Post Director Mr. Balke, Your Honour, in Dresden;
    only in this way do we receive the letters securely and [uncertain: quickly], for since the 17th of
    December'

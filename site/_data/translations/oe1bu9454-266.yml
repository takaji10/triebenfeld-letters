status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! For some days past there have been great debates
    here on account of Poland, [uncertain reading: "wann weicht außer Seits man erſten Vertrage ab"] one
    party departs from the first treaty and demands absolutely the Prosna as the frontier, that is to
    say from Thorn onward as far as the fall of the Prosna into the Wartha, and then down the Prosna as
    far as [illegible]stroczew. Should this come to pass, then the Trąbczyner and even my Blizanower estates
    come under Russian sovereignty — and then it will be [uncertain: Hyzje fezzan] to get Trąbczyn back
    again. — The [uncertain: beidere] Prince Chancellor sets himself violently against this alone, and
    appeals to the word given by the Z Kaysen[uncertain] — the honest man had vexed himself quite [uncertain:
    brand], and had to keep to his bed for 3 days — His Majesty the King is likewise very much displeased
    with him(?); these 6 days past the gentleman has dined quite alone from the napkin and sees nobody
    — this gives occasion here to many rumours. All Vienna is full of rumours of impending great wars
    — indeed even from Berlin such reports come in. — I must now be all the more attentive and watch which
    way the scale of the balance will incline; for if Russia obtains the districts in which the estates
    lie, then the Prince Chancellor alone [uncertain: umfürehr] must settle the matter with the Emperor
    Allexander, since he did not permit that I might present Your Serene Highness''s letter to the Emperor
    — for the Dąbska or Moscinska stands in high favour with Landskog, and therefore everything can only
    be done with the Emperor alone. For the rest, every friend and admirer of Your Serene Highness here
    awaits eagerly the report of the Bürger O L Court; see to it that I receive the same here speedily,
    and that it turns out conformable to the first Memoirs — then all will end according to our wish.
    — Your letters to me be pleased now to send by way of Breslau and Dresden, under the address of the
    Royal Prussian Post Director Balke at Dresden. — 1. To me nothing further than to the p v Triebenfeld,
    and to fasten it with a wafer; then have 2 a courier[uncertain] to Barbe made over it; the address
    is d Köcke Haßrath and Maß Ritter Hl. Barbe Hochwolzschien. 3. Over this a cover[uncertain] is to
    be made to the Royal Post Director H. Balke Your Honour at Dresden; only in this manner shall we receive
    the letters safely and swiftly, for since the 17th of December'
- page: 2
  en: 'I have not had a syllable from Your Serene Highness. Full of longing I await the blank powers of
    attorney and everything else; especially useful would be the letter to His Serene Highness the [uncertain:
    dH. E.] Chancellor. Frightfully prejudicial may these delays become in the end. The written undertaking
    to Barbe is likewise most necessary, for Pourtales (not Portalis) will answer very quickly, and will
    certainly enter into it. He has a fortune of more than 1 1/2 million in ready money, and follows blindly
    his friend of youth and school-comrade B. As for how I live here besides — it is [uncertain: Hände
    mäßig]; I have nothing on my back, and often nothing in my belly. Already today I owe B 104 ducats;
    and he looks a little black when I wish to borrow. What is to become of this I do not know, for if
    the King should once break up in haste, what is then to become of me? I would and do continue to act
    for you, most gracious Lord, as an honest fellow. The matter is of the highest importance for you
    — peace, honour and fortune for you are at stake; this I am to win, and you let me all but perish
    in want and care, indeed you let me hunger — even so the head is already shaken. Thus one has manoeuvred
    on the Russian side, friends; and these too one will in the end have to court, and with an empty hand
    that is impossible. If only the 100 ducats could get here, that I might satisfy B — but then I must
    absolutely, at the very soonest, have 200 ducats more, so that I may pay everything, and at the last
    do a kindness to the good people for their faithful help. — Concerning the letters sent to me, be
    pleased, most gracious Lord, to have tracers sent after them, so that I may receive the letters and
    the money. — Most respectfully I remain, until death, Your Serene Highness''s Vienna, the 10th of
    January 1815. My poor children do not forget either. J. Mother: it is said, is being dismissed. Your
    faithful most humble and obedient servant v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! At this very moment I receive Your Most Serene
    Highness''s most highly esteemed letter of the 11th of this month. It contains the dispatches to Herr
    M. v. Haugwitz, to Herr Faudel, together with complaint and countercomplaint [uncertain: Glagte und
    Beclage], a letter to Herr Glenck, a letter to myself on 1½ sheets, and a postscript in Your Most
    Serene Highness''s own hand. The power of attorney for Herr Court Fiscal Pochammer and the blank forms
    — both of which items I need above all else — have been forgotten to be enclosed. I have already been
    here several weeks and can do nothing, because it is precisely these pieces that are wanting. To the
    King I am not to write in Your Serene Highness''s name; these blank forms all still lie there, but
    smaller ones, to write to men who absolutely must be brought to act, I have no more of. May Your Serene
    Highness therefore deign to let me see, at the very soonest, the power of attorney for Herr Doct.
    Pochammer and the necessary blank forms, and also a few judicially attested powers of attorney in
    blank, so that I may have them filled out as they may be required. To the Privy Cabinet Councillor
    Beyme and to the Minister v. Voss I have written in Your Serene Highness''s name upon the last two
    blank forms, recommending the Court Fiscal Pochammer as plenipotentiary, so that he may at least to
    some degree be'
- page: 2
  en: 'effective. Both copies I shall send with the next post, so that Your Serene Highness may gather
    from them the steps I am taking in every direction and how the matter is being conducted. Tomorrow
    morning, or today — for it is quite [text lost] o''clock in the night as I receive the express courier
    — I shall hasten to Herr v. [uncertain: Tandel / Faudel], shall also meet with Count v. Haugwitz,
    and shall afterwards speak with Herr Count von Keller, who is lodging here at the Golden Eagle and
    who is now to take over the portefeuille when Herr v. Haugwitz, as Herr von Hardenberg has already
    done, goes away on leave for several months. What I hear here and there I shall report by the first
    post. Only may Your Serene Highness deign to send me speedily the blank forms, the power of attorney
    for Herr Pochammer, and especially a few judicially attested powers of attorney in blank, so that
    in the latter case I may fill out another power of attorney for Herr Pochammer. For the [uncertain:
    Aufgabet] ought not to stand as it is — I had forgotten in my haste to strike it out — and it might
    also easily be that one would not wish to give so much money; in that case a lesser sum would have
    to be inserted.'
- page: 3
  en: 'The very great distance from Your Serene Highness makes the conduct of business harder, and when
    on top of that the power of attorney and other papers are wanting, then everything comes to a standstill.
    It is more than sad for me that I have not a single man about me who means truly and honestly by Your
    Serene Highness; all wish only to enrich themselves, they reason about everything, know nothing at
    bottom, and do absolutely nothing at all. The lazy [uncertain: Amel] here writes not a syllable, often
    leads me astray by his lies, and in the end he is the very first to stretch out his hand. Gratsenauer
    is truly out of his senses; I can use him for nothing more — now he cries out for money, now he wants
    a title, now a certificate that he really is a Hohenlohe-Ohringen official and does not belong here
    at all. If he is to work, then he is sick; if he is to travel and conduct a lawsuit here or there,
    then he raves. In short, the fellow is not to be used. Money I have given him, for he has his salary
    drawn a year and a half in advance — but titles and false certificates I shall never grant him. I
    have referred him, being somewhat nervous, to rest.'
- page: 4
  en: 'Now I hear he means to petition Your Serene Highness — to appoint him Justice Councillor; whereupon
    he will form a Justice Collegium and at Breslau make himself the Princely Hohenlohe Justice President,
    and he also wishes to be assigned upon the Silesian estates for his salary. Should he really come
    before Your Serene Highness with such proposals, may You deign only to tell him briefly that in the
    matter of his salary, if he believes he has anything to demand, he should apply to the Councillor
    of War and Forests v. Triebenfeld, who would duly instruct the South Prussian treasury to pay everyone
    who has anything to demand. But titles You do not give [uncertain: any] of Your officials, unless
    it be that one or another had rendered himself particularly deserving toward You. For the rest, however,
    You [uncertain: vermischte — did/do not mix] the South Prussian affairs either with the Silesian ones,
    still less with the Hohenlohe ones; and whoever is not content with these arrangements and with the
    course of business once introduced, him You would have to leave to seek a situation more agreeable
    to his wishes. I will answer for it that, if Your Serene Highness will speak in such a tone, every
    man will do his duty. In deepest reverence I remain, until death, Your Serene Highness''s Berlin,
    the 16th of May, in the morning at [uncertain: 3] o''clock, 1806 most faithful and obedient servant
    v Triebenfeld'

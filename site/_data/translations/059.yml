status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Since my return from Königsberg I have not yet
    had one quiet hour; sleep and [uncertain: rest] have become quite strange to me, the most gnawing
    sorrow accompanies me everywhere and the greatest distress drives me to the point of despair. Kontopp
    remains [uncertain: continually] sequestrated; I am short here of some 2000 Rthl, I cannot raise them
    and must suffer that strangers set themselves in my estates, draw my revenues, dispose of them at
    their arbitrary pleasure, and ruin them. In the Schweinersche estates there is continual execution
    on account of 2560 Rthl of interest, and on account of the von der Lahr debt. If I could raise the
    2560 Rthl, then I should be free and my credit restored. To v. d. Lahr I have sent 300 [uncertain:
    Cantz] of iron and 14 Schock of boards, where the Schock must hold 1440 feet [uncertain: Rhenish]
    and each board must be 1 1/2 inches thick and 15 inches broad, at 60 Rthl. This makes together 2570
    Rthl. This leech has therefore still 430 Rthl and the interest and costs, which may amount to 300,
    to receive; then this fellow is entirely satisfied. For this purpose I shall probably have to give
    a further 10 Schock of boards and send them to Berlin, in order to see myself rescued from the claws
    of this usurer. The boards are already lying at the water for this purpose, and this notorious business
    will be settled in a few days; meanwhile through the boards I again lose 1800 Rthl in ready money,
    with which I could have paid my interest, [have] had the accursed sequestration here lifted, and could
    have become master of my estates again. I must still endure a while yet and find other counsel; only
    God knows'
- page: 2
  en: 'how this is to be brought about quickly, for to sell produce by private contract is impossible;
    the shortage of money has reached its highest [uncertain: pitch] and increases daily through the exceedingly
    stupid conduct of the Königsberg people. I have 1000 Scheffel of grain to dispose of; in the vault
    there lie 105 stone of wool. In the forest there stand 2000 Klafter of wood. This would, at middling
    rates, amount to some 7000 Rthl. But not a soul will buy, because in Königsberg they are so [uncertain:
    Scheffel] stupid as to permit the Poles to bring all these products in among us. It is not reckoned
    that thereby our own money goes out of the country, that one thereby puts into the hands of the Poles
    the means to arm themselves continually and at last to become dangerous to us again. It is not perceived
    that thereby our estate-owners are wholly overthrown and ruined. I have described the danger which
    is nevertheless ours and all these evils in my reports to Königsberg, still from here, and have sought
    to lay this to the King''s heart; but no heed is paid to it; the brood of vipers about the King even
    takes it ill that one speaks the truth, and therefore every honest man must fall silent and look upon
    his fate buried in dull pain. My only endeavour now is to obtain the 4560 Rthl, in order to make my
    estates free and to be rid of the executions that press upon me. I would gladly give up the above-mentioned
    produce for 2/3 of its value, but the sequestration does not permit me to dispose of it before I have
    paid the 4560 Rthl; also the want of money is so great that nobody can take and pay so large a lot
    at once. I must therefore bear this gnawing sorrow a while longer and wait upon God''s help. These,
    however, Most Serene Prince and Lord, are the grounds which prevent me from being able to lay myself
    at your most exalted feet. That I should long since have hastened to Your Serene Highness, if I could
    have saved myself, Your most exalted self will surely'
- page: 3
  en: 'believe of me without great protestations. Heaven is my witness that this alone is why I cannot
    leave the [uncertain: spot]; for if I go away, then it is believed that I seek to [illegible] and
    abscond, and the subhastation of all my estates is at once decreed without any mercy. Whither then
    should I turn in my old age with my children? To return to Russia — for that I am too old, and my
    children too stand in my way. Believe me, most gracious Lord, I live here more wretchedly than a day-labourer,
    for my credit is destroyed and, said to you all, many a day I have not a single Groschen, and have
    several times, so as not to give myself the lie, gone to bed [uncertain: hungry] — Were one not to
    allow me air and some forbearance, were one to permit me to dispose of my produce, then I should find
    counsel, pay everything, and remain a man worth at least 400000 Rthl. But they mean to destroy us;
    they mean by mad sequestrations to bring on the subhastation of the estates and so to overthrow every
    honest, straightforward fellow. Enough of that — the Lord — I fear I have already wearied Your Serene
    Highness with this. To no one else do I speak in this tone or let my complaints be heard aloud; I
    suffer here alone, in silence. In the matter of the inheritance we must take quite other paths; more
    of that by word of mouth. [text lost] In Your Serene Highness''s own affairs there is and remains
    no other way than that Your most exalted self write directly to the King — For the rest, I believe
    it is well that Your Serene Highness has not yet done so, for if the honest Major v Pirch is not in
    Königsberg, then they will seek to turn your business as ill as possible. You have in this commission
    only 2 true friends, namely H. M. v. Pirch and p v Hache. Greischau I do not trust; he behaves very
    coldly and is said to have declared that Your Serene Highness had never been his friend, and that
    he now wished to have nothing to do with your affair. That the O L v Knesebeck is to be taken back
    into the ranks I do not find altogether becoming. This man is too great a hypochondriac; he demanded
    his discharge at that time with vehemence, and went off sulking. Whoever once goes off in that fashion
    ought never to come back to me; such capers should [illegible].'
- page: 4
  en: 'Scharnhoritz I do not [uncertain: trust] at all; but his goal may be set near him. Of the Friends
    of Virtue all is now quiet — thinking, upright men, however, fear from that quarter a wicked explosion.
    Concerning Russia''s conduct opinions are much divided; it is feared that Russia too is making a mark
    against us. God only grant the E. H. Carl good fortune. If this prince yet now strikes down the monster
    of the world, then all goes well and we come well out of the [text lost]; then it is to be feared
    that Austria [text lost] the peace [text lost] affair, but if [text lost] accepts, and appropriates
    Silesia and Saxony to itself. Constantine on the other hand receives the whole of Poland, Prussia,
    Pomerania and Silesia as far as the Oder, as Emperor of the Sarmatians, in return for which Alexander
    is to be guaranteed the European Turkey. The Poles will not yet lay themselves down to the mark —
    here they recruit and arm, still ever on. Honrichs was here yesterday with Cabanic; if he could export
    the money, then Your Serene Highness would be helped, and I too could quickly save myself — But they
    by no means give way, notwithstanding that I have handed over the orders of the French General Gniesenau[?]
    — He is threatened with being [uncertain: made insecure], and he must deliver all the money to Kalisz,
    to the [text lost] at the [uncertain: sub-]prefect Briechia, of which he himself has only produced
    the receipts. I have written to [uncertain: Brsechwa / Briechia] and enquired of him whether cattle
    and grain might not be exported for the money — if that be accepted, then Honrichs will find counsel
    enough, bring money instead of it, and know how to produce documents for cattle, grain and spirits
    purchased. As soon as it is at all possible in the world, and I only see myself somewhat rescued,
    I shall hasten to Your Serene Highness, to remain there some 4 weeks, to put much in order and, in
    case of need, then to go back to Prussia. The hundred [text lost] and I have accepted with a contrite
    heart from Lombardini, since I am still to pay the toll for iron and boards to my collector here,
    and thus I can carry off nearly the half of it today. In deepest reverence I remain, until death,
    Your Most Serene Highness''s Kontop, the 11th July 1809. most faithfully obedient servant v Triebenfeld'

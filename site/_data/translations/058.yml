status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness's letter, together
    with the 50 Fr[ancs], I have received through the Referendarius Herr Bally. For this I offer my most
    heartfelt thanks, all the more since I have this day thereby bought myself free of the burdensome
    Execution for at least 4 weeks, wherein God will doubtless help further. I go this very night to Kontop
    and from there to Kosten, whither I must dispatch Honrichs there with some 80 men fully armed and
    provided with 2 months' pay; I have also summoned Cabani and Hecker. And when I return from there
    I shall come at once to Schlawentzig. For the rest, I see that Your Most Serene Highness must have
    as little knowledge as our King of Poland. Gallows and wheel are the penalty if anyone exports money,
    horses, hay or straw – but wool, rye, wheat, oxen the Poles permit to go out at any price, and thereby
    to bring the money into the country in order to arm themselves. Since I have the commission to send
    in intelligence together with my opinion, I write this day to the King, that the latter too be forbidden
    as swiftly as possible, so that the remainder of our money may not go further out of the country and
    the Poles be deprived of the poison and of the means to arm men further. Since it mattered so much
    to the King to have full intelligence out of Poland, I went myself directly to Vater, whence I returned
    yesterday; I have informed myself of everything, and even of the most secret plans of the Poles, which
    I am sending this day by express courier to Königsberg. I know, and have convinced
- page: 2
  en: 'myself, that therefore nothing is now to be had there either, because the rebellious noblemen now
    take everything away by force. Were anything at all to be done, I should surely have brought it about
    in the Kahrs – for there Garczynski is Chief Prefect, and the former Landrath Zychlinski, who has
    only His Excellency to thank, is sub-prefect. Both are my men, who with their absolute power – for
    they are lords over life and death – would do anything for me; only against the laws laid down among
    themselves they cannot act, because their secretly established Vehm and their court, under which they
    in turn stand, threatens them too with death and ruin. I have, however, the word of both, that as
    soon as a little room to act is given, the one as well as the other will help. Only at present neither
    I nor any Nerlich can do anything; indeed one may easily bring on the confiscation of the estates,
    if one acts now prematurely and too hastily – If God help to beat the Austrians, and Russia makes
    no [uncertain: Bestreich], then all will settle of itself and South Prussia is ours again, and then
    such men as Your Serene Highness may ever wish could be sent thither. But at present it is a ticklish
    business. I had to go; yet I had employed every precaution, and directed that if I were not back by
    such and such a time – all the Polish [uncertain: Wollsteine] and noblemen who were in Breslau should
    at once be arrested. It was not necessary, however, since I found my acquaintances at the helm. For
    the rest, the Poles are so cautious, and have an army of spies who watch everything – no one may pass
    out or in without being observed from every side – goods such as wool, grain or cattle that are exported
    are exactly registered, and everyone must bring in the money'
- page: 3
  en: 'for it and present it – All letters, even all Royal official matters that pass from Prussia through
    this hellish country, are opened, and therefore everyone must go warily to work, if he does not wish
    to [uncertain: leben] and risk everything. Since the battles lost by the French they do indeed put
    their heads together, but their resolve stands firm – Poland is to be wholly restored, and Constantin,
    whom an army of 60 men, which they are hastily to call up and organise, is to make their King. Meanwhile
    I count upon a discord [text lost] and up as far as Wieluń all the towns have already declared that
    they would give neither arms nor men any longer, that it was all one to them who ruled them, they
    must give their dues to the one as to the other, and more they could not and would not do. With us
    all slumbers; only the Friends of Virtue and the Black Brethren are awake – it is dreadful how that
    goes on. If only Your Serene Highness had written something of Bohemia, that I might have sent it
    in with the rest. Within some 10 days I shall lay myself personally at the feet of the Same, and then
    more – May Your Serene Highness deign to take to heart my earlier letters in the matter of your Military
    affair; answers on everything true and open [illegible], then Silesia will swiftly honour in him the
    Governor-General and everything takes on another shape. Reverently I remain, until death, Your Most
    Serene Highness''s In South Prussia nothing shall escape Your Serene Highness, when toil and fortune
    return, and here one must now leave you, Most gracious Prince, unmolested. Deym was minded to run
    mad again, but the King pays Breslau, the 3rd of June 1809. faithful and most obedient servant v Triebenfeld'

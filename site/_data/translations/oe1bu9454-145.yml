segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    After I had broken the carriage and very nearly my neck along with it, I have nevertheless arrived
    here in Kalisz safe and sound, though somewhat battered. The greatest loss is the time I require for
    the repair of my carriage, so as to be able to travel onward with it. Court Councillor Grimm is lying
    miserably ill; every [thing] he will work up for von Radzinski, for which, however, the contracts
    would be required.


    With Honrichs matters look bad — the man does not pay the 4000 Rthl, notwithstanding that everything
    has been receipted, cancelled and set in order with the consent of the [uncertain: kopillen] College.


    Grimm means to hold him to payment by legal process at once — but he lacks the contract and a power
    of attorney — the contract is with Nochlitz, and the same man has also had a power of attorney for
    the prosecution of this affair.'

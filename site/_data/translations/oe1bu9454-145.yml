- page: 2
  en: 'May it please Your Most Serene Highness to issue the command that the contract be demanded back
    from Köckritz with the utmost haste and sent off to Mr. Grimm together with a power of attorney. In
    Trąbczyn, I hear, other orders are being given which run directly counter to my plan. Thus one of
    the persons in command has lent out 100 bushels of grain to someone from whom Your Serene Highness
    will never receive any of it back, and a great part of the fields has also been sown. As soon as my
    carriage is mobile I shall [uncertain: set out] thither, in order to report the further particulars
    to Your Serene Highness. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Kalisz, the 14th of November


    1804.


    humble and obedient servant


    v. Triebenfeld'

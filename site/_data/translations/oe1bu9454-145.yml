- page: 2
  en: 'May Your Most Serene Highness be pleased to issue the order that the contract be demanded back
    from Rochlitz with the utmost haste and sent off, together with a power of attorney, to Mr Grimm.
    In Trąbczyn, I hear, orders are being given which run directly counter to my plan. Thus one of those
    in command has lent out 100 bushels of grain to somebody, whereof Your Serene Highness will never
    receive one of them [uncertain: einen denen], and a great part of the fields has likewise been sown.
    As soon as my carriage is mobile I shall hasten thither, in order then to report the rest to Your
    Serene Highness. In reverence I remain, until death,


    Your Most Serene Highness''s


    Kalisz, the 14th of November


    1804.


    humble and obedient servant


    v Triebenfeld'

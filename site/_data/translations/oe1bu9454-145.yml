- page: 1
  en: '145


    Most Serene Prince,


    Most gracious Lord!


    Having broken my carriage and very nearly my neck along with it, I have nevertheless arrived here
    in Kalisz safe and sound, though somewhat shaken about. The greatest loss is the time I require for
    the repairing of my carriage, in order to be able to travel further with it. Court Councillor Grimm
    lies miserably ill; meanwhile he will work up [uncertain: verarbeiten] the matter for von Radzinski,
    for which, however, the contracts would be required.


    With Honrichs things look bad — the man does not pay the 4,000 Rthl, notwithstanding that everything
    has been receipted, cancelled, and put in order with the consent of the Board of Wards.


    Grimm wishes to compel him to payment at once by process of law — but he lacks the contract and a
    power of attorney — Rochlitz has the contract, and he has also had a power of attorney for the pursuit
    of this matter.'

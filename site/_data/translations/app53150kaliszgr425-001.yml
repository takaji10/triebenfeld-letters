status: draft
segments:
- page: 1
  en: 'Commissioners from the Estates of the Republic for the adjudication of the Case between the Honourable
    Prusimski, Starost of Niszczewice, Heir of the estates of Trąbczyn with their appurtenances, on the
    one part, and the Honourable Stanisław Ścibór Chełmski, Heir of the estates of Łukomia likewise with
    their appurtenances, on the other part, designated and expressed below in the signatures:


    Since, both on account of the currently sitting Ordinary General Sejm in Warsaw and likewise on account
    of the sitting Crown Tribunal in Piotrków, some of us having obligations in Warsaw and others finding
    themselves at the said Tribunal with obligations, we cannot bring to a conclusion by final judicial
    resolution the Action between the aforementioned Parties, commenced at the present term falling from
    the adjournment made, for the reasons expressed therein, by the Decree issued between those same Parties
    on the Thirteenth Day of the Month of September of the preceding year — for such reason therefore,
    the term of the session adjourned to the present day by the above-mentioned Decree [we adjourn] to
    the First'
- page: 2
  en: 'Monday after the Feast of the Holy Three Kings in the coming year One Thousand Seven Hundred and
    Seventy-Seven, and we place, adjourn, and postpone it; and we preserve for the parties the peremptory
    term of appearing before the Commissarial Court, which was to hold its session at that time on the
    ground of the Łukom estates. By force of the present act. Done at our Residences, on the Twenty-Eighth
    Day of the Month of September in the Year of the Lord 1776.


    Stefan Leszczyc Zielonacki, Deputy Judge of the Kalisz Land Court, Commissioner, by his own hand


    Maciej Leszczyc Mierzewski, Commissioner, by his own hand


    Tomasz Radoński, Boundary Surveyor of Kalisz, Commissioner, by his own hand


    Stanisław Jabłkowski, Commissioner, by his own hand


    Stanisław Otto-Trąbczyński, Commissioner, by his own hand'
- page: 3
  en: 'In the Kalisz Municipal Court, on the Monday after the Feast of Saint Michael the Archangel, namely
    on the 30th Day of the Month of September in the Year of the Lord 1776.


    To the office and present records of the Kalisz Municipal Court, appearing in person, the Honourable
    Antoni Czyżewski, in the name of whoever has an interest therein, presented to the present office
    for enrollment and for entering into these records the Adjournment of the Boundary Commission between
    the hereditary estates of Trąbczyn and Łukom, in accordance with the intent of the Commissarial Decree
    between the Right Honourable Stanisław Chełmski, Heir of the estates of the village of Łukom, on the
    one part, and Prusimski, Starost of Niszczewice, on the other part, and others entering an appearance,
    to be conducted on the ground of those same estates of the village of Łukom — subscribed jointly below
    in the proper hands of the Illustrious Commissioners and secured with the seals of their arms, of
    the following tenor: /: Let it be inserted :/. The true original of this same Adjournment, enrolled
    in the manner written above, has been left here with the present records and sewn into the protocol.'

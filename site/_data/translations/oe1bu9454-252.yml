segments:
- page: 1
  en: '252 I inform Your Right Honourable, in reply to your request of the 25th of last month, that the
    affair of the Prince of Hohenlohe in respect of the claims upon Trąbczyn and Kamionna will settle
    itself as soon as the general settlement and agreement concerning the Duchy of Warsaw, now in progress,
    comes to be carried out. Vienna, the 25th of November 1814.


    C f v Hardenberg


    To the Right Honourable the Councillor of War von Triebenfeld



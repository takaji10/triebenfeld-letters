- page: 1
  en: 'In response to Your Right Honourable''s petition of the 25th of last month, I [uncertain: berechrichtige
    — inform] you that the affair of the Prince of Hohenlohe with respect to the claims upon Trąbczyn
    and Kaemen will settle itself of its own accord as soon as the general settlement and agreement now
    in progress concerning the Duchy of Warsaw comes to be carried into execution. Vienna, the 25th of
    November 1814.


    C f v Hardenberg


    To the Right Honourable Councillor of War von Triebenfeld


    Sir'

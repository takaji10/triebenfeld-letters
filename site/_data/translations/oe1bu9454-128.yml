- page: 2
  en: 'and 1,000 Rthl for additional seed-corn and housing costs, which latter two items will be recovered
    again.


    3. With Flörken and Ribbeck I have got so far that they are willing to settle. The people show that
    they have paid 12,600 in cash; next to that they liquidate for buildings etc. some 8,000 Rthl. Now
    even though the liquidated sum of 6,905 Rthl has been accepted for the present, still in a lawsuit,
    which might run some 3 years, the sum of 8,000 Rthl will certainly be awarded to him. By this calculation
    Your Serene Highness would already have 2,000 Rthl to pay; the sum for quitting stipulated in the
    contract is 500 Rthl a year, which likewise amounts to 7,000 Rthl; the surplus inventory may come
    to 2,000 Rthl, after which then the people must absolutely have 11,600 Rthl, if judgment is given
    according to the letter. The contract is badly drawn, serves only the tenants, and is in every point
    disadvantageous to Your Serene Highness. Bad as this matter looks, I still hope to settle it in the
    best way, namely that the people vacate and renounce all claims. To attain this end I have petitioned
    for execution, and have caused the sequestration to be undertaken for the tenants'' account. Under
    this pressure I think they will vacate.


    4. I shall conclude with von Rudnicki, or else set the matter on the footing that he is to depart
    at Midsummer. The contract with him too has been concluded in a peculiar manner.


    5. As soon as I have finished with these people I shall proceed to the leasing'

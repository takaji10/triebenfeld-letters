- page: 3
  en: 'of them. Jetzinger [uncertain: and] consorts are [uncertain: here now], Ca[banis]: with the help
    of the district councillor, who is more than active, I think I shall soon be done with these too.
    The old subjects give throughout 1 Rthl per Hufe in ground-rent — the district councillor himself
    concludes with them, so that the Chamber must be silenced. An astonishing deal has thereby been gained,
    and it makes the newer colonists take pause. Just now the 3 B. offered to annul the Oleśnica contract
    and to see to the general dismemberment. There are 6 persons for it. They demand 3 Rthl per Hufe as
    brokerage and 9 Hufen free altogether — This I shall in the end concede, for now everything can be
    brought to a happy conclusion. The district councillor is entirely my man and helps to overcome the
    most difficult matters. He deserves a great reward. Through his help I shall be done with the tenants
    here — through his efforts I have today obtained purchasers for 87 Hufen, and were Midsummer not at
    the door, or were there not some want of money, he would get me Mennonites who would at once buy everything
    up dear and pay in cash — he has even obtained the Chamber''s permission for it — Glenck has written
    to the district councillor and mocks me, saying in particular that no more stupid stroke could have
    been made than the Oleśnica contract. He goes on to say that it is true, he did indeed make a preliminary
    agreement with the people, but this was'

- page: 2
  en: 'and 1000 Rthl for additional seed-corn and housing costs, which last two items will be recovered
    again.


    3. With Flörten and Rybbel I have got so far that they are willing to compound. The people show that
    they have paid 12600 in cash; next to this they liquidate for buildings etc. some 8000 Rthl. Now even
    though the liquid sum of 6901 sl. has for the present been accepted, in a lawsuit which may run some
    3 years he will certainly be awarded the sum of 8000 Rthl. By this calculation Your Serene Highness
    would already have 2000 Rthl to pay; the withdrawal sum stipulated in the contract is 500 Rthl for
    the year, and this too amounts to 7000 Rthl; the surplus inventory may make up 2000 Rthl, after which
    then the people, if judgment is given according to the letter, must have 11600 Rthl [uncertain: apportioned].
    The contract is badly drawn, serves only the tenants, and is in all points disadvantageous to Your
    Serene Highness. Ill as this matter looks, I yet hope to settle it as best may be, in such a way that
    the people quit and renounce all claims. To attain this end I have petitioned for execution, and have
    caused a sequestration to be laid on for the tenants'' account. Under this pressure I think they must
    quit. 4. I shall conclude with von Rudnicki, and shall so direct the matter beforehand that he is
    to depart at Midsummer. The contract with him too has been strangely concluded.


    5. As soon as I have finished with these people I shall proceed to the leasing out'

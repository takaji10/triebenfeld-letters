- page: 3
  en: 'of them. Jetzinger and consorts are here [uncertain: first], and by the help of the district administrator,
    who is more than active, I think to be quickly done with these too. The old subjects are throughout
    giving 1 Rthl ground-rent per Hufe — the district administrator himself concludes with them, so that
    the Chamber must fall silent. By this an astonishing deal has been gained, and it makes the newer
    colonists [uncertain: stop short]. Just now the three B. offered to annul the Olesnices contract and
    to see to the general dismemberment. There are 6 men for it. They demand 3 Rthl per Hufe as brokerage,
    and 9 Hufen free altogether. This I shall in the end grant, for now everything may be happily brought
    to a close. The district administrator is wholly my man and helps to overcome the most difficult matters.
    He deserves a great reward. Through his help I shall get through with the tenants here; through his
    exertions I have today obtained purchasers for 87 Hufen; and were Midsummer not at the door, or were
    there not some want of money, he would procure me Mennonites who would at once buy everything up dear
    and pay in cash — he has even obtained the Chamber''s permission for it. Glenck has written to the
    district administrator and mocks me, and says in particular that one could never have made a stupider
    stroke than the Olesnices contract. He says further that it is true he did make a preliminary agreement
    with the people, but that this was'

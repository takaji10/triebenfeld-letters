- page: 4
  en: 'only a jest; he had at the time just then needed 1000 Rthl, and the fellows were to have sacrificed
    these; but how could he have meant to give away the estates in hereditary lease? — He calls upon the
    district administrator now to see only to this, that Kunckel be got rid of; he has another man whom
    he would send here, who should comply with all the district administrator''s orders. In general he
    requests the district administrator to come to an understanding with him, so as to do business with
    him. He is now at the gold spring, where gold is to be had and gold to be [uncertain: put out]. He
    begs the district administrator to enquire in his own and the adjoining districts whether the nobles
    are in need of money — he can obtain as much as he pleases — the district administrator need only
    have stout brokerage fees stipulated, and he will then, after deduction of costs, faithfully share
    with him. It is sad to hear so much [uncertain: cunning] testimony, whereby Your Serene Highness is
    in the end compromised. I shall redress what I can; thus I should certainly compound several lawsuits
    at once and obtain for Your Serene Highness that which is already lost. As to money, I hope a strong
    sum shall come together by Midsummer; but how much, I cannot yet determine. In deepest reverence I
    remain, until death,


    Your Most Serene Highness''s


    Trąbczyn, the 8th of May


    1804


    most faithful servant


    v. Triebenfeld'

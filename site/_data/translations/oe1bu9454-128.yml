- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Even though my faithful attachment to Your Most Serene Highness and my zeal were exemplary, I am nevertheless
    not able to remedy all the confusions here brought in, as I at first believed. 1. There are lawsuits,
    11 in number, where hearings have just now been [uncertain: adjourned] by some parties — I have requested
    a prorogation, have obtained it, and hope to bring several of them, which in part amount to 6 and
    15 Rthl yearly, to the best possible end by composition.


    2. The tenants are stirred up to the utmost, and none will yield without an enormous sum for withdrawal.
    To arrange this and to bring it into order according to Your Serene Highness''s wishes, I must exercise
    every possible patience, so as to press the people toward the goal by forbearance and kindness; but
    it will not be done without sacrifices. With Otcibi I have just now come to terms; he receives 3000
    Rthl for withdrawal, 2000 Rthl as security,'

- page: 4
  en: 'only in jest; at that time he had just then needed 1,000 Rthl, and the fellows ought to have sacrificed
    these, but how could he ever have meant to give away the estates in hereditary lease like that — He
    calls upon the district councillor now only to see to it that Kunkel be got rid of; he has another
    man whom he would send here, who would comply with all the district councillor''s orders. In general
    he requests the district councillor to come to an understanding with him so as to do business with
    him. He [uncertain: sits] now at the gold-spring, where gold is to be had and gold to be [illegible].
    He asks that the district councillor should enquire in his own and the neighbouring districts whether
    the nobility have need of money — he could obtain as much as he wished — the district councillor need
    only have strong brokerage stipulated, and he would then faithfully share with him after deduction
    of costs. It is a sad thing to hear so much [uncertain: argus Zeugt], whereby Your Serene Highness
    is in the end compromised. I shall redress what I can, and so I should certainly settle several lawsuits
    at once and preserve for Your Serene Highness that which is already lost — As for money, I hope a
    strong sum should come together by Midsummer. How much, however, I cannot yet determine. In deepest
    reverence I remain, until death,


    Your Most Serene Highness''s


    Trąbczyn, the 8th of May


    1804


    faithful servant


    v Triebenfeld'

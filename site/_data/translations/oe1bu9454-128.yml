  en: '128


    Most Serene Prince


    Most gracious Prince and Lord!


    Even were my loyal attachment to Your Most Serene Highness and my zeal exemplary, I am nevertheless
    not able to remedy all the confusions that have [uncertain: crept in / been bargained in] here, as
    I at first believed I might —


    1. There are lawsuits, 11 in number, in which hearings have just now [text lost: been adjourned by
    some parties] — I have petitioned for prorogation, have obtained it, and hope to bring several of
    them, which in part amount to 6 and 15 Rthl annually, to the best possible end by settlement.


    2. The tenants have been stirred up to the point of madness, and none will yield without an enormous
    sum for quitting — to arrange this and to bring it into good order according to Your Serene Highness''s
    wishes, I must [uncertain: exercise] every possible patience, so as to press the people toward the
    goal by forbearance and kindness, but it will not be got through without sacrifices. With Otcibi I
    have just now come to terms; he receives 3,000 Rthl for quitting, 2,000 Rthl security,'

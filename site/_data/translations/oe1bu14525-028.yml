- page: 6
  en: 'the signature ordained for the Royal South Prussian Government and the greater seal. Given at Poznań,
    26 August 1802. Götze


    Dieterichs.


    Fest. John.


    (L. S.)


    Mortgage certificate for the reigning Prince of Hohenlohe-Ingelfingen concerning the estate of Batkowo
    situated in the Radziejewo district.'

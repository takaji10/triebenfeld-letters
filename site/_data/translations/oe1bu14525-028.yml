- page: 2
  en: 'the deed of grant dated Berlin, 1 December 1797, by heritable and proprietary grant; and title
    of possession has been entered for him on the ground of this deed of grant and of the letter of resignation
    made out on 10 June 1802, by decree of 19 July 1802.


    Thereupon are entered


    I. Perpetual burdens and restrictions upon the ownership or the disposition


    1., the annual allowance due to the cathedral chapter at Włocławek out of these estates'
  names:
  - de: Berlin
    en: Berlin
    kind: place
  - de: Wrocławek

segments:
- page: 1
  en: 'The noble estate of Batkowo, situated under the jurisdiction of the Royal South Prussian Government
    at Poznań in the Radziejewo district.


    Together with the estate of Siedlemin situated in the Brześć district, the reigning Prince Friedrich
    Ludewig of Hohenlohe-Ingelfingen has received these, as formerly ecclesiastical estates which had
    belonged to the cathedral chapter at Włocławek, following the confiscation of all ecclesiastical estates
    in South Prussia, from His Majesty King Friedrich Wilhelm the Third, according to'

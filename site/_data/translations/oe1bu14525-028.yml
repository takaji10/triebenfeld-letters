- page: 4
  en: the estates which, having been confiscated from the ecclesiastical estates in South Prussia, have
    again been granted with noble rights may not be alienated to native-born inhabitants of the former
    Poland without express supreme royal consent; which prohibition has been entered against these formerly
    ecclesiastical estates upon the entry of the title of possession in the name of the reigning Prince
    Friedrich Ludwig of Hohenlohe-Ingelfingen, ex officio by force of the decree of 19 July 1802,
  names:

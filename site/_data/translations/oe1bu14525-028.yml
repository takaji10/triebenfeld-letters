- page: 3
  en: 'annual allowance, which, because the fixed quantum has not been stated and certified, has been
    entered as an indeterminate sum on the ground of the deed of grant of His Majesty King Friedrich Wilhelm
    the Third of 1 December 1797 for the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, upon
    the entry of the title of possession in his name, ex officio by force of the decree of 19 July 1802.


    2.) The sovereign prohibition, that'
  names:

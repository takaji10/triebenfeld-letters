- page: 5
  en: 'and so has been done.


    II. Judicially secured debts and other real obligations: none are entered. Apart from the foregoing
    items, nothing is entered against the estate of Batkowo in the mortgage book, and for the rest the
    present mortgage certificate is hereby issued to the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen
    in the force of a recognition, on account of the title of possession entered for him. In witness whereof,
    under'
  names:
  - de: Batkowo

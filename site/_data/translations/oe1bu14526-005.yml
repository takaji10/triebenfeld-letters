- page: 3
  en: 'von Broniewsky agreed at Posen on the 6th of this month that the payment of the 53139 Rthl. 13
    Groschen 8 4/5 Pfennig shall be made on 8 September at Posen, but the delivery of actual possession
    of the estates on 10 September at Kollno and Kamionne, His Serene Highness accordingly promises to
    send an authorised representative to Posen and to Kollno and Kamionne at the said time, in order to
    be present at these acts; and since a government commissioner from Posen will carry out the delivery
    of actual possession, His Serene Highness stipulates that the estates Kollno and Kamionne shall be
    delivered over to the purchaser directly on the 10th of September.


    § 4. Both in the settlement of 3 July and in a later declaration Mr. von Broniewsky has bound himself
    to redeem entirely all his intabulations upon Kollno and Kamionne, and thereby to have these estates
    purged of all encumbrances (Nexus) charged thereon on his account. The purchaser therefore receives
    these estates wholly free of debt.


    § 5. Mr. von Broniewsky retains all the profits of the estates up to 24 June of this year. From that
    day forward all profits and burdens pass to the purchaser, and Mr. von Broniewsky will render the
    account thereof at the delivery of actual possession, as he will at the same time also restore the
    stock of field, cattle and farm inventory which von Broniewsky received on taking over the estates
    in the year 1786 as the lordship''s'

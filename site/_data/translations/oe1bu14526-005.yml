- page: 6
  en: 'The purchaser takes over the following standing onera perpetua:


    a. an annual rent of Four Polish Marks from the estate Kamionne to the church there, from a capital
    of One Hundred Polish Gulden;


    b. a capital of 250 Rthl, or One Thousand Five Hundred Polish Gulden, which is radicated as a capital
    intabulated at 3 1/2 per cent interest and charged for the church at Kamionne upon the market town
    of Kollno; the latter, however, with the addition that if the arrears of interest, claimed ad alterum
    tantum, should be established by judgment and law, the vendor, His Serene Highness, shall settle this
    interest together with costs up to Midsummer of this year;


    c. in public taxes for Kamionne annually


    153 Rthl. 22 Groschen 8 Pfennig


    likewise for Kollno annually


    125 Rthl. 21 Groschen 2 Pfennig; further, in ecclesiastical dues at


    Kamionne


    16 Rthl. 16 Groschen, which the purchaser promises to pay and settle annually.


    Further, the purchaser has paid on account of the stipulated purchase price of the 142000 Rthl:


    d. at the term of Midsummer of this year a sum of Seventy-Six Thousand Reichsthaler Courant into the
    hands of the mining councillor Herr Bernhardi, to whom His Serene Highness has been pleased to make
    the order of payment. His Serene Highness acknowledges the receipt of this sum, and is content that
    this receipt may be produced for the purpose of cancelling the capital of One Hundred Thousand'

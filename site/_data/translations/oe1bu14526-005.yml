- page: 5
  en: 'Metzig at Schwerin as justiciary in Betsche, Kollno and Kamionne. He will give information on everything
    that concerns the justice administration and its records, as he also has the deposit business under
    him. It depends upon the purchaser whether to retain him or to engage another. His Serene Highness
    pays the said Metzig his salary up to Michaelmas of this year, with which the purchaser is likewise
    content.


    § 9. His Majesty the King has already in the month of July of this year granted the purchaser the
    All-Highest concession for the purchase of these estates, so that nothing is to be objected against
    his capacity to possess; and since this point goes at the purchaser''s cost, the matter rests there.


    § 10. The purchaser''s intention is to dismember the estates Kollno and Kamionne. His Serene Highness
    will lay no obstacles in the way of this business, but approves it and will also further it, that
    it be carried out at the purchaser''s cost; as His Highness has also already caused the consent thereto
    to be sought from the Cameral Department. To do anything further lies beyond His Serene Highness''s
    powers, and it is therefore solely the purchaser''s affair to pursue this matter and to bring it to
    an end.


    § 11. As concerns now the payment of the stipulated purchase moneys, the following has been determined
    and settled among the contracting parties.'

- page: 3
  en: 'von Broniewsky at Posen on the 6th of this month, that the payment of the 53139 Rthl. 13 Groschen
    8 4/5 Pfennig shall be made on 8 September at Posen, but the delivery of possession in kind of the
    estates on 10 September at Kollno and Kamionne, His Serene Highness promises to send an authorised
    representative to Posen and to Kollno and Kamionne at the said time, in order to be present at these
    acts; and since a Government Commissioner from Posen will carry out the handing over in kind, His
    Serene Highness stipulates that the estates Kollno and Kamionne shall be delivered over to the purchaser
    immediately on the 10th of September.


    § 4. Both in the settlement of 3 July and also in a later declaration, Herr von Broniewsky has bound
    himself to redeem all his intabulations upon Kollno and Kamionne completely, and thereby to have these
    estates cleared of all obligations charged upon them on his account. The purchaser accordingly receives
    these estates entirely free of debt.


    § 5. Herr von Broniewsky retains all the usufructs of the estates up to 24 June of this year. From
    that day onward all usufructs and burdens pass over to the purchaser, and Herr von Broniewsky will,
    at the handing over in kind, render the account thereof, just as he will at the same time restore
    the stock of field, cattle and farming inventory which von Broniewsky received on taking over the
    estates in the year 1786 as the lordship''s'

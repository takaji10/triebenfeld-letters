- page: 2
  en: 'inhabitants and subjects of these estates, which they have arrogated to themselves and believe
    they may claim, to His Honour the Royal bank cashier Herr George Conrad Leixner at Frankfurt an der
    Oder, for a fixed purchase sum of One Hundred and Forty-Two Thousand Reichsthaler Royal Prussian 64-piece
    Courant, as his complete property.


    § 2. Today''s purchase of the estates Kollno and Kamionne is made without valuation, in Pausch und
    Bogen; therefore His Most Serene Highness furnishes eviction only with regard to the survey register
    taken up by the Royal Commission and the real properties listed in the [uncertain: Tan], which are
    to be handed over at the delivery of possession. All revenues and farming yields the purchaser must
    take over as they exist, and according as they may hereafter increase or diminish, with which the
    purchaser likewise declares himself content.


    His Most Serene Highness has caused a settlement to be concluded with the cavalry captain von Broniewsky
    on 3 July of this year, according to the contents of which the same wishes, upon receipt of a sum
    of 53139 Rthl.


    13 Groschen 8 4/5 Pfennig, to give back the estates Kollno and Kamionne forthwith and to restore the
    [text lost] to His Highness. Now since the merchant Herr Simon, as authorised representative of Herr
    Leixner, has agreed with Herr'

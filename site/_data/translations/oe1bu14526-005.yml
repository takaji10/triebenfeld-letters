- page: 6
  en: 'The purchaser takes over the following standing perpetual charges (onera perpetua):


    a. an annual rent of four Polish marks from the estate Kamionne to the church there, upon a capital
    of one hundred Polish gulden;


    b. a capital of 250 Rthl, or one thousand five hundred Polish gulden, which as a capital intabulated
    at 3 1/2 per cent interest and charged for the church at Kamionne upon the market-town of Kollno is
    thereby grounded - the latter, however, with the addition that if the arrears of interest, claimed
    ad alterum tantum, should be established by judgment and law, His Serene Highness the vendor shall
    settle this interest together with costs up to St. John''s Day of this year;


    c. in public dues for Kamionne annually


    153 Rth. 22 Groschen 8 Pfennig


    likewise for Kollno annually


    125 Rthl. 21 Groschen 2 Pfennig, further in ecclesiastical dues at


    Kamionne


    16 Rthl. 16 Groschen, which the purchaser promises to pay and discharge annually.


    Further the purchaser has paid upon the stipulated purchase price of the 142000 Rthl:


    d. at the term of St. John''s Day of this year a sum of seventy-six thousand Reichsthaler Courant
    into the hands of the mining councillor Bernhardi, to whom His Serene Highness has been pleased to
    direct it by order to pay. His Serene Highness acknowledges receipt of this sum, and is content that
    this receipt may be produced for the purpose of cancelling the capital of one hundred thousand'

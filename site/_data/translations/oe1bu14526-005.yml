status: draft
segments:
- page: 1
  en: 'Be it known and understood that between His Serene Highness the reigning Prince zu Hohenlohe-Ingelfingen,
    Governor of Breslau etc., on the one part, and the Building-Bank Rendant Herr Leixner of Frankfurth
    an der Oder, the following contract of sale and purchase has been, after due deliberation, freely
    and irrevocably agreed, concluded and executed.


    §. 1. Namely, His Most Serene Highness the reigning Prince zu Hohenlohe-Ingelfingen, Governor of Breslau
    etc., sells His own estates situated under the Department of the Government at Posen in the [text
    lost] District,


    Kollno and Kamionne, with all appurtenances and mills belonging thereto, rights and privileges, with
    all inhabitants, fields, forests, lakes and waters, with the rents and the propination rights, the
    services, the hunt and the jurisdiction, also all remaining rights and appurtenances, just as His
    Serene Highness received the said estates and their appurtenances delivered over from the Royal Commission
    by virtue of the instrument of donation, of which a vidimated Copy is to be handed to the Herr Purchaser,
    and for whose correctness and truth His Serene Highness furnishes eviction-warranty in respect of
    the estates Kollno and Kamionne, and has possessed and enjoyed them, and can also use and enjoy them,
    with everything as it stands and lies, and finally also with all rights and privileges that may pertain
    to His Serene Highness against the'
- page: 2
  en: 'residents and subjects of these estates, which [rights] they have arrogated to themselves and believe
    themselves entitled to claim, — to His Honour the Royal Banco-Rendant Herr George Conrad Leixner in
    Frankfurth an der Oder, for a fixed purchase sum of One Hundred and Forty-Two Thousand Reichsthaler
    Royal Prussian 64-piece Courant, as his complete property.


    §. 2. This day''s purchase of the estates Kollno and Kamionne is made without valuation, in Pausch
    und Bogen; for that reason His Most Serene Highness furnishes eviction-warranty solely in respect
    of the survey register taken up by the Royal Commission and of the real assets listed in the [uncertain:
    Tan], which are to be handed over at the delivery. All revenues and farming yields the Herr Purchaser
    must take over as they exist, and according as they may hereafter increase or diminish, with which
    the Herr Purchaser likewise declares himself content.


    His Most Serene Highness has caused a settlement to be concluded with Herr Rittmeister von Broniewsky
    on the 3rd of July of the current year, according to the content of which the same is willing, upon
    receipt of a sum of 53139 Rthl. 13 Ggl. 8 4/5 Pfl., to give back the estates Kollno and Kamionne forthwith
    and to restore the [estates] to His Highness. Now since the merchant Herr Simon, as authorised representative
    of Herr Leixner, has with Herr'
- page: 3
  en: 'von Broniewsky agreed at Posen on the 6th of this month that payment of the 53139 Rthl. 13 Gg.
    8 4/5 Pf. shall be made on the 8th of September at Posen, but the natural delivery of the estates
    shall take place on the 10th of September at Kollno and Kamionne, His Serene Highness accordingly
    promises to send an authorised representative to Posen and to Kollno and Kamionne at the said time,
    in order to be present at these Actibus; and since a Government Commissary from Posen will carry out
    the natural handing-over, His Serene Highness stipulates that the estates Kollno and Kamionne be delivered
    directly to the Herr Purchaser on the 10th of September.


    §. 4. Both in the settlement of the 3rd of July and also in a later declaration Herr von Broniewsky
    has bound himself to redeem entirely all his Intabulata upon Kollno and Kamionne, and thereby to have
    these estates cleared of all Nexibus charged upon them on his account. The Herr Purchaser therefore
    receives these estates wholly free of debt.


    §. 5. Herr von Broniewsky retains all usufructs of the estates until the 24th of June of the current
    year. From that day onward all usufructs and burdens pass over to the Herr Purchaser, and Herr von
    Broniewsky will render the account thereof at the natural handing-over, just as he will at the same
    time restore the Beilass in field, cattle and farming inventory which the said von Broniewsky received
    in the year 1786 upon taking over the estates as manorial'
- page: 4
  en: 'Beilass, as the deed of delivery of that time states. The Herr Purchaser has all the less to receive
    anything further, inasmuch as His Most Serene Highness has hitherto not yet been in natural possession
    of the estates, and therefore also cannot hand over more than what is only now being delivered to
    His Highness.


    §. 6. To the Herr Seller''s Serene Highness no servitudes are known which burden the estates Kollno
    and Kamionne passively. On the other hand, there belongs to these estates the free right of felling,
    as a right due to the same, in the forests at Gory and Krobilaw, which right of felling has also been
    established by a recent judgment in Possessorium. The


    5) Herr Purchaser is therefore likewise entitled to this right, and he is to carry on the further
    process concerning it, in so far as von Kwilecki should pursue the same further. The judgment in Possessorium
    has also already been handed to the Herr [uncertain: Schufer], and he declares himself content with
    the declaration of His Serene Highness.


    §. 7. All documents and writings which concern these estates, and which the Herr Seller''s Serene
    Highness or His authorised representatives may still have in hand, shall be faithfully extradited
    to the Herr Purchaser.


    §. 8. His Serene Highness has engaged the justice-burgomaster'
- page: 5
  en: 'Metzig at Schwerin as Justitiarius in Betsch, Kollno and Kamionne. He will give information on
    all that concerns the administration of justice and its records, just as he also has the deposit business
    under his charge. It rests with the Herr Purchaser to retain him or to engage another. His Serene
    Highness pays the said Metzig his salary until Michaelmas of the current year, with which the Herr
    Purchaser is likewise content.


    §. 9. His Majesty the King has already in the month of July of the current year granted the Herr Purchaser
    the All-Highest concession to purchase these estates, so that there is nothing to be objected against
    his capacity to possess; and since this point goes at the Herr Purchaser''s expense, the matter rests
    thereupon.


    §. 10. The Herr Purchaser''s intention is to dismember the estates Kollno and Kamionne. His Serene
    Highness will lay no obstacles in the way of this business, but rather approves it and will also further
    it, that it be carried out on the Herr Purchaser''s account; as His Highness has also already caused
    the consent thereto to be applied for at the Cameral Department. To do anything further lies beyond
    the powers of His Serene Highness, and it is therefore solely the Herr Purchaser''s affair to pursue
    this matter and bring it to a conclusion.


    §. 11. As regards now the payment of the stipulated purchase moneys, the following has been determined
    and settled among the contracting parties.'
- page: 6
  en: 'The Herr Purchaser takes over the following standing Onera perpetua:


    a., an annual rent of Four Polish Marks from the estate Kamionne to the church there, from a capital
    of One Hundred Polish Gulden;


    b., a capital of 250 Rthl, or One Thousand Five Hundred Polish Gulden, which is radicated as a capital
    intabulated at 3 1/2 per cent interest and charged upon the market-town of Kollno for the benefit
    of the church at Kamionne; the latter, however, with the addition that if the arrears of interest,
    demanded ad ulterum tantum, should be established by judgment and law, the Herr Seller''s Serene Highness
    will settle this interest together with costs up to St. John''s Day of the current year.


    c., in public taxes for Kamionne annually


    153 Rth. 22 ggl. 8 Pf.


    likewise for Kollno annually


    125 Rthl. 21 ggl. 2 Pf.; further, in ecclesiastical dues in


    Kamionne


    16 Rthl. 16 ggl., which the Herr Purchaser promises to pay and discharge annually.


    Further, the Herr Purchaser has paid upon the stipulated purchase price of the 142000 Rthl:


    d., at the term of St. John''s Day of the current year, a sum of Seventy-Six Thousand Reichsthaler
    Courant into the hands of Herr Berg-Rath Bernhardi, to whom His Serene Highness was pleased to make
    the order to pay. His Serene Highness acknowledges receipt of this sum, and is content that this receipt
    may be produced for the purpose of cancelling the capital of One Hundred Thousand'
- page: 7
  en: 'Reichsthaler which Herr Councillor of War and Forests von Triebenfeld ceded to the Herr Purchaser
    coram notario on the 15th of June; with which declaration the Herr Purchaser is content.


    e., upon the remainder of the purchase money, per 66000 Rthl, the Herr Purchaser pays, as noted above
    ad §. 3, on the 8th of September of the current year, into the hands of Herr Rittmeister von Broniewski
    the settlement sum of 53139 Rthl. 13 Gg. 8 4/5 Pf. at Posen, against his receipt.


    f., the last remainder of the 12860 Rthl. 10 Ggl. 3 1/5 Pf. the Herr Purchaser [pays] on the 10th
    of September of the current year at the handing-over of Kollno and Kamionna into the hands of the
    Most Princely authorised representative; and as soon as payment of the whole 66000 Rthl has been made,
    His Serene Highness will give the Herr Purchaser a receipt for the entire purchase money of the 142000
    Rthl, with which declaration the Herr Purchaser is content.


    §. 12. All costs concerning the drawing-up and execution of this contract of purchase, likewise the
    natural and civil delivery costs, as also the cancellation fees for the intabulated hundred thousand
    Thaler, both contracting parties bear in equal shares.


    §. 13. The Herr Seller''s Serene Highness as well as the Herr Purchaser renounce each and every legal
    objection and evasion standing against this agreement, in particular the objection of injury below
    or above the half; that no general renunciation is valid unless a particular one has preceded it;
    and that this agreement was set down in writing otherwise than it was agreed.'
- page: 8
  en: In witness whereof the foregoing instrument of sale and purchase has been executed by His Most Serene
    Highness in His own most high hand and by the Herr Purchaser in his own hand. Done at Breslau, the
    30th of August 1804. Friedrich Ludwig, Fürst zu Hohenlohe. Read and approved by myself.

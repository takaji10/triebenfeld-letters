- page: 2
  en: 'inhabitants and subjects of these estates, which they have arrogated to themselves and believe
    they may claim, to His Honour the Royal bank cashier Mr. George Conrad Leixner at Frankfurt an der
    Oder, for a fixed purchase sum of one hundred and forty-two thousand Reichsthaler Royal Prussian 64-piece
    Courant, as his full property.


    § 2. The present purchase of the estates Kollno and Kamionne takes place without valuation, in Pausch
    und Bogen; for that reason His Most Serene Highness gives warranty of title (Eviction) solely in respect
    of the survey register drawn up by the Royal Commission and of the real assets listed in the [uncertain:
    Tan], which are to be handed over at the delivery of possession. All revenues and economic yields
    the purchaser must take over as they exist, and according as they may hereafter increase or diminish,
    with which the purchaser likewise declares himself content.


    His Most Serene Highness has caused a settlement to be concluded with the cavalry captain von Broniewsky
    on 3 July of this year, according to the content of which the same will forthwith give back the estates
    Kollno and Kamionne upon receipt of a sum of 53139 Rthl. 13 Groschen 8 4/5 Pfennig, and will restore
    the [text lost] to His Highness. Now since the merchant Mr. Simon, as authorised representative of
    Mr. Leixner, has with Mr.'

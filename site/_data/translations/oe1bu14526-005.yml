- page: 4
  en: 'stock, as the delivery-of-possession instrument of that time states. The purchaser has the less
    to receive beyond this, inasmuch as His Most Serene Highness has not until now been in possession
    in kind of the estates, and the same can therefore deliver over no more than what is only now being
    delivered over to His Highness.


    § 6. To the vendor, His Serene Highness, no servitudes are known which burden the estates Kollno and
    Kamionne passively. On the other hand, these estates are entitled to free felling as a right due to
    them in the forests at Gory and Krobilaw, which felling has also been established by a recent possessory
    judgment. The


    5) purchaser is accordingly likewise entitled to this right, and has to continue the further suit
    over it in so far as von Kwilecki should pursue it further. The possessory judgment has also already
    been handed over to the purchaser, and the same declares himself content with the declaration of His
    Serene Highness.


    § 7. All documents and writings which concern these estates, and which the vendor, His Serene Highness,
    or His Highness''s authorised representatives still have in hand, shall be faithfully delivered over
    to the purchaser.


    § 8. His Serene Highness has engaged the justice-burgomaster'

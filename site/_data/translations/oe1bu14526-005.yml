- page: 5
  en: 'Metzig at Schwerin as justiciary in Betsche, Kollno and Kamionne. He will give information on everything
    concerning the administration of justice and its records, as he also has the deposit business under
    him. It rests with the purchaser to retain him or to engage another. His Serene Highness pays the
    said Metzig his salary up to Michaelmas of this year, with which the purchaser is likewise satisfied.


    § 9. His Majesty the King has already in the month of July of this year granted the purchaser the
    All-Highest concession to purchase these estates, so that nothing is to be objected against his capacity
    to possess; and since this point goes at the purchaser''s cost, it shall rest thereby.


    § 10. The purchaser''s intention is to dismember the estates Kollno and Kamionne. His Serene Highness
    will place no obstacles in the way of this business, but rather approves it and will also further
    it, so that it may be carried out at the purchaser''s cost; as His Highness has likewise already caused
    the consent thereto to be applied for at the Chamber Department. To do anything beyond this lies outside
    His Serene Highness''s powers, and it is therefore solely the purchaser''s affair to pursue this matter
    and bring it to a conclusion.


    § 11. As concerns now the payment of the stipulated purchase moneys, the following has been determined
    and settled between the contracting parties.'

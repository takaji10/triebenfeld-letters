- page: 7
  en: 'Reichsthaler, which the councillor of war and forests von Triebenfeld ceded to the purchaser on
    15 June coram notario; with which declaration the purchaser is content.


    e. on the remainder of the purchase money, of 66000 Rthl, the purchaser pays, as noted above at §
    3, on 8 September


    of this year, into the hands of the cavalry captain von Broniewski, the settlement sum of 53139 Rthl.
    13 Groschen 8 4/5 Pfennig at Posen against his receipt.


    f. the last remainder of the 12860 Rthl. 10 Groschen 3 1/5 Pfennig the purchaser [pays] on 10 September
    of this year at the handing over of Kollno and Kamionna into the hands of the Most Princely authorised
    representative; and as soon as the payment of the whole 66000 Rthl has been made, His Serene Highness
    will grant the purchaser a receipt for the whole purchase money of the 142000 Rthl, with which declaration
    the purchaser is content.


    § 12. All costs concerning the drawing up and execution of this contract of purchase, likewise the
    costs of the delivery of possession in kind and in civil form, as also the cancellation fees of the
    intabulated one hundred thousand Thaler, both contracting parties bear in equal shares.


    § 13. The vendor, His Serene Highness, as well as the purchaser renounce each and every legal objection
    and evasion opposing this agreement, in particular the objection of injury below or above the half,
    that no general renunciation is valid where no special one has preceded it, and that this agreement
    was written down otherwise than it was agreed.'

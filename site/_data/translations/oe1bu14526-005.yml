- page: 4
  en: 'stock, as the delivery deed of that time states. The purchaser has the less to receive anything
    further, inasmuch as His Most Serene Highness has to this day not yet been in actual possession of
    the estates, and therefore cannot deliver over more than what is only now being delivered over to
    His Highness.


    § 6. His Serene Highness the vendor knows of no servitudes burdening the estates Kollno and Kamionne.
    On the other hand these estates are entitled to free timber-cutting, as a right due to them, in the
    forests at Gory and Krobilaw, which right of cutting has also been established by a recent judgment
    in possessorium. The


    5) purchaser is therefore likewise entitled to this right, and has to carry on the further litigation
    over it insofar as von Kwilecki should pursue the same further. The possessorium judgment has also
    already been handed to the purchaser, and he declares himself content with His Serene Highness''s
    declaration.


    § 7. All documents and writings concerning these estates, and which His Serene Highness the vendor
    or his authorised representatives may still have in hand, shall be faithfully delivered over to the
    purchaser.


    § 8. His Serene Highness has engaged the justice-burgomaster'

- page: 1
  en: 'Be it known and understood that between His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen,
    Governor of Breslau etc., on the one part, and the building-bank cashier Herr Leixner at Frankfurt
    an der Oder, the following contract of sale and purchase has been deliberately, freely and irrevocably
    agreed, concluded and executed.


    § 1. His Most Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, Governor of Breslau etc.,
    namely sells His Highness''s estates lying under the Department of the Government at Posen in the


    district of


    Kollno and Kamionne, together with all the appurtenances and mills belonging thereto, rights and privileges,
    with all residents, fields, forests, lakes and waters, with the rents and the propination rights,
    the labour services, the hunt and the jurisdiction, also all remaining rights and appurtenances, just
    as His Most Serene Highness received the said estates and their appurtenances delivered over from
    the Royal Commission by virtue of the deed of donation, of which a certified copy is to be handed
    over to the purchaser, and for the correctness and truth of which His Serene Highness furnishes eviction
    with regard to the estates Kollno and Kamionne, and has possessed and enjoyed them, and can use and
    enjoy them, with everything as it stands and lies, and finally also with all the rights which His
    Serene Highness may have against the'

status: draft
segments:
- page: 1
  en: 'Be it known and made public that between His Serene Highness the reigning Prince of Hohenlohe Ingelfingen,
    Governor of Breslau etc., on the one part, and the Bau Banco Pendant [uncertain: Bau Banco Pendant]
    Herr Leixner of Frankfurth an der Oder, the following contract of sale and purchase has been well-considered,
    freely and irrevocably agreed, concluded and executed.


    §. 1. Namely, His Most Serene Highness the reigning Prince of Hohenlohe Ingelfingen, Governor of Breslau
    etc., sells His Highness''s estates situated under the Department of the Government at Posen in the
    [text lost] District,


    Kollno and Kamionne, with all appurtenances and mills belonging thereto, rights and privileges, with
    all resident holdings, fields, forests, lakes and waters, with the rents and the propination rights,
    the services, the hunt and the jurisdiction, also all remaining rights and appurtenances, just as
    His Most Serene Highness received the said estates and their appurtenances by delivery from the Royal
    Commission pursuant to the deed of donation - of which a vidimated copy is to be handed over to the
    Herr Purchaser, and for the correctness and truth of which His Serene Highness gives eviction-warranty
    in respect of the estates Kollno and Kamionne - and has possessed and enjoyed them, and can still
    use and enjoy them, with everything as it stands and lies, and finally also with all rights and privileges
    which may belong to His Serene Highness against the'
- page: 2
  en: 'resident holders and subjects of these estates, which they have arrogated to themselves and believe
    they may claim - to His Honour the Royal Banco Rendant Herr George Conrad Leixner in Frankfurth an
    der Oder, for a fixed purchase sum of One Hundred and Forty-Two Thousand Reichsthaler Royal Prussian
    64-piece Courant, as his full and absolute property.


    §. 2. Today''s purchase of the estates Kollno and Kamionne is made without valuation, in Pausch und
    Bogen; for that reason His Most Serene Highness gives eviction-warranty solely in respect of the survey
    register drawn up by the Royal Commission and of the real assets listed in the [uncertain: Tan] which
    are to be handed over at the delivery. All revenues and farming yields the Herr Purchaser must take
    over as they exist, and according as they may hereafter increase or diminish, with which the Herr
    Purchaser likewise declares himself content.


    His Most Serene Highness has had a composition concluded with Herr Rittmeister von Broniewsky on the
    3rd of July of this year, according to the content of which the same will forthwith give back the
    estates Kollno and Kamionne upon receipt of a sum of 53139. Rthl. 13. Ggl. 8 4/5 Pfl., and will restore
    the [text lost: estates] to His said Highness. Now since the merchant Herr Simon, as authorised representative
    of Herr Leixner, has agreed with Herr'
- page: 3
  en: 'von Broniewsky at Posen on the 6th of this month, that the payment of the 53139. Rthl. 13. Gg.
    8 4/5. Pf. shall be made on the 8th of September at Posen, but the natural delivery of the estates
    shall take place on the 10th of September at Kollno and Kamionne, His Serene Highness promises to
    send an authorised representative to Posen and to Kollno and Kamionne at the said time, in order to
    be present at these acts; and since a Government Commissioner from Posen will carry out the natural
    handing-over, His Serene Highness stipulates that the estates Kollno and Kamionne shall be delivered
    immediately on the 10th of September to the Herr Purchaser.


    §. 4. Both in the composition of the 3rd of July and also in a later declaration of Herr von Broniewsky,
    the same has bound himself to redeem entirely all his intabulata upon Kollno and Kamionne, and thereby
    to have these estates purged of all obligations attaching thereto on his account. The Herr Purchaser
    therefore receives these estates wholly free of debt.


    §. 5. Herr von Broniewsky retains all uses of the estates up to the 24th of June of this year. From
    that day onward all uses and burdens pass over to the Herr Purchaser, and Herr von Broniewsky will,
    at the natural handing-over, render the account thereof, just as he will at the same time restore
    the Beilass in field, cattle and farming inventory which the said von Broniewsky received upon taking
    over the estates in the year 1786. as manorial'
- page: 4
  en: 'Beilass, as the delivery instrument of that time states. The Herr Purchaser has the less to receive
    beyond this, inasmuch as His Most Serene Highness has not until now been in the natural possession
    of the estates, and His Highness can therefore deliver no more than what is only now being delivered
    to His Highness. [uncertain: Höchst Pries]


    §. 6. To the Herr Seller''s Serene Highness no servitudes are known which burden the estates Kollno
    and Kamionne passively. On the other hand, these estates are entitled to free cutting, as a right
    due to them, in the forests at Gory and Krobilaw, which cutting has also been established by a recent
    [uncertain: possessorium] judgment. The


    5) [sic] Herr Purchaser is therefore likewise entitled to this right, and he is to carry on the further
    process concerning it, in so far as the von Kwilecki should pursue the same further. The possessorium
    judgment has also already been handed to the Herr Purchaser, and the same declares himself content
    with the declaration of His Serene Highness.


    §. 7. All documents and writings which concern these estates, and which the Herr Seller''s Serene
    Highness or His Highness''s authorised representatives may still have in hand, shall be faithfully
    extradited to the Herr Purchaser.


    §. 8. His Serene Highness has engaged the justice-burgomaster'
- page: 5
  en: 'Metzig in Schwerin as Justitiarius in Betsch, Kollno and Kamionne. He will give information on
    everything touching the administration of justice and its records, as he also has the deposit-business
    under him. It rests with the Herr Purchaser to keep him on or to engage another. His Serene Highness
    pays the said Metzig his salary up to Michaelmas of this year, with which the Herr Purchaser is also
    satisfied.


    §. 9. His Majesty the King has already, in the month of July of this year, granted the Herr Purchaser
    the All-Highest concession to purchase these estates, so that nothing is to be objected against his
    capacity to hold them; and since this point goes at the Herr Purchaser''s expense, it shall so remain.


    §. 10. The Herr Purchaser''s intention is to dismember the estates Kollno and Kamionne. His Serene
    Highness will lay no hindrance in the way of this business, but rather approves it and will also further
    it, so that it may be carried out on the Herr Purchaser''s account; as His Highness has already had
    the consent thereto solicited from the Cameral Department. To do anything further lies beyond the
    powers of His Serene Highness, and it is therefore solely the Herr Purchaser''s affair to pursue this
    matter and bring it to an end.


    §. 11. As concerns now the payment of the stipulated purchase moneys, the following has been determined
    and settled among the contracting parties.'
- page: 6
  en: 'The Herr Purchaser takes over the still-standing onera perpetua:


    a., an annual rent of Four Marks Polish from the estate Kamionne to the church there, from a capital
    of One Hundred Gulden Polish;


    b., a capital of 250 Rthl or One Thousand Five Hundred Gulden Polish, which is rooted as a capital
    intabulated at 3 1/2 per cent interest, charged on behalf of the [uncertain: Birge] at Kamionne upon
    the market-town of Kollno; the latter, however, with the addition that if the arrears of interest,
    demanded ad ulterum tantum, should be established by judgment and law, the Herr Seller''s Serene Highness
    will settle these interests together with costs up to St. John''s Day of this year;


    c., in public taxes for Kamionne annually


    153 Rth. 22 ggl. 8 Pf.


    likewise for Kollno annually


    125. Rthl. 21. ggl. 2 Pf., further in ecclesiastical dues in


    Kamionne


    16. Rthl. 16 ggl., which the Herr Purchaser promises to pay and discharge annually.


    Further, the Herr Purchaser has paid upon the stipulated purchase price of the 142000 Rthl:


    d., at the term of St. John''s Day of this year, a sum of Seventy-Six Thousand Reichsthaler Courant
    into the hands of Herr Berg-Rath Bernhardi, to whom His Serene Highness has [uncertain: seen fit]
    to make it payable by order. [flagged: anweisen] His Serene Highness acknowledges receipt of this
    sum, and is content that this receipt may be entered for the purpose of the cancellation of the capital
    of One Hundred Thousand'
- page: 7
  en: 'Reichsthaler which Herr Councillor of War and Forests von Triebenfeld ceded to the Herr Purchaser
    coram notario on the 15th of June; with which declaration the Herr Purchaser is content.


    e., upon the remainder of the purchase money of 66000 Rthl the Herr Purchaser pays, as noted above
    ad §. 3., on the 8th of September of this year, into the hands of Herr Rittmeister von Broniewski,
    the composition sum of 53139. Rthl. 13. Gg. 8 4/5 Pf. at Posen, against his receipt.


    f., the last remainder of the 12860. Rthl. 10. Ggl. 3 1/5 Pf. the Herr Purchaser [uncertain: gives]
    on the 10th of September of this year, at the handing-over of Kollno and Kamionna, into the hands
    of the Most Princely authorised representative; and as soon as payment of the whole 66000. Rthl has
    been made, His Serene Highness will give the Herr Purchaser a receipt for the entire purchase money
    of the 142000 Rthl., with which declaration the Herr Purchaser is content.


    §. 12. All costs concerning the drawing-up and execution of this contract of purchase, likewise the
    natural and civil delivery costs, as also the cancellation fees for the intabulated hundred thousand
    Thaler, both contracting parties bear in equal shares.


    §. 13. The Herr Seller''s Serene Highness as well as the Herr Purchaser renounce all and every legal
    objection and evasion standing against this agreement, in particular the objection of injury below
    or above the half; that no general renunciation is valid unless a particular one has preceded it;
    and that this agreement has been written down otherwise than it was agreed.'
- page: 8
  en: In witness whereof the foregoing instrument of sale and purchase has been executed by His Most Serene
    Highness and by the Herr Purchaser in their own most high hands. Thus done at Breslau, the 30th of
    August 1804. Friedrich Ludwig Fürst zu Hohenlohe. Read and approved by myself.

segments:
- page: 1
  en: 'Be it known and made manifest that between His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen,
    Governor at Breslau etc., of the one part, and the building bank cashier Mr. Leixner at Frankfurt
    an der Oder, the following contract of sale and purchase has been deliberately, freely and irrevocably
    agreed, concluded and executed.


    § 1. Namely, His Most Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, Governor at Breslau
    etc., sells his estates situated under the Department of the Government at Posen in the


    district of


    Kollno and Kamionne, with all appurtenances and mills belonging thereto, rights and privileges, with
    all residents, fields, forests, lakes and waters, with the rents and the propination rights, the services,
    the hunt and the jurisdiction, and likewise all other rights and appurtenances, just as His Serene
    Highness received the said estates and their appurtenances delivered over by the Royal Commission
    pursuant to the deed of donation, of which a vidimated copy is to be handed to the purchaser, and
    for whose correctness and truth His Serene Highness gives warranty of title (Eviction) in respect
    of the estates Kollno and Kamionne, and has possessed and enjoyed them, and can also use and enjoy
    them, with everything as it stands and lies, and finally also with all rights and privileges which
    His Serene Highness may have against the'

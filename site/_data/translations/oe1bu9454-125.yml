- page: 1
  en: 125 To His Most Serene Highness. The people from Oleśnica have arrived with the monies — they wish
    to be with Your Most Serene Highness at 4 o'clock. I have negotiated something with them here, upon
    which I shall make my report to Your Serene Highness this afternoon — I believe it will not be displeasing
    to Your Serene Highness. Wrocław, the 28th of April 1804. v. Triebenfeld

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! That everything is going according to wish, Your Most Serene
    Highness will [uncertain: Fuh] deign to be convinced from the letter which you receive today from
    His Majesty in the Privy Councillor Beyhm. The matter goes off today to Minister v. Voss, that he
    is to report with the utmost dispatch – In this matter provision has now also been made that the business
    shall not be dragged along the long road. In the meantime it would now be very well if [uncertain:
    Glen] were to draw up the valuations quite thoroughly, so that they conform with the submitted Designation
    and with the contracts mentioned therein. The contracts I have all here; only those of Tieten must
    [illegible] I have there and keep in the best condition. Until everything is in the clear (that is
    to say, what is to be done here), I shall not depart from here. A man in Potsdam – I have engaged,
    who'
- page: 2
  en: will be and remain active not only for now but also hereafter – but I must expend something upon
    it. Herr v. Michaelis will write today for a power of attorney; this Your Most Serene Highness may
    send through him, only so that various things may be settled here in loco without needing to become
    long-drawn-out. I hope to God that the matter will now be settled quite according to wish, and even
    better than I at first believed – I shall certainly attend to everything in the best manner with the
    most glowing zeal. — I am at the same time providing for a loan suited to the matter, so that one
    may not fall into embarrassment and may keep one's word to the good King. Only upon this shall I always
    be thinking, that the estates remain what they are, indeed that they shall become and remain always
    the first jewel of all the property belonging to Your Serene Highness — and in this regard I shall
    first show myself truly effective at the finalisation of the business. Only for now I still wish to
    remain in
- page: 3
  en: 'the background, so that envy may not perhaps, on account of my humble self, play Your Serene Highness
    a trick – The Minister, who here is truly in every respect quite well, commends himself most cordially
    to Your Serene Highness. One further matter I find necessary: let Your Serene Highness send me a couple
    of blanks for letters, such as I might have to write to someone in haste; that is, on the other side
    with a signature and beneath it "most devoted servant H." I shall use such only in the most urgent
    cases, and in such a manner [uncertain: mippen] that Your Serene Highness can never withhold from
    me your satisfaction, for one is already necessary for the man in Potsdam. Tomorrow I go to His Serene
    Highness the Prince Sacken, to bring him the glad news how far the matter has already advanced. In
    deepest reverence I remain, until death, Your Most Serene Highness''s — Herr v. Burensprung, however,
    has become Land Forest Master, and Wedel remains for the present what he is – In general, however,
    one meets with various changes. Lindenau has received the title of Excellency. Berlin, the 6th of
    October 1798, most humble and faithful servant v Triebenfeld'

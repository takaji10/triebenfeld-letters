- page: 4
  en: 'after reading and approving it, as — I have read and approved this. signed: Peter Friedrich August
    von Triebenfeld. — stands above, in his own hand.


    In witness whereof the same has been taken down under the impression of the court seal, and the applicant
    has dispensed with the keeper of the protocol. a. u. s. Royal Prussian first Kurmark Justice Office
    here.


    signed Wilmanns.


    (L. S.)'

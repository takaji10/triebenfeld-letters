segments:
- page: 1
  en: 'Copy.


    (6 Groschen stamp)


    Whereas the third department of the Royal Supreme War College has granted to me, the undersigned,
    out of the General Invalids'' Fund a loan of 50,000. Rthl, in words Fifty Thousand Thaler in Courant
    according to the coinage standard of 1764, and has paid out this amount to me this day in Seehandlung
    bonds, I do hereby not only give receipt in the best form of law for the due reception of the said
    sum, but also promise to repay the same promptly after six months'' notice, which either party is
    free to give, and until then to pay interest on it yearly at 5 per cent in half-yearly instalments,
    and to make this payment of interest here in Berlin, or to send it hither free of charge. For the
    greater security of this loan I pledge to the Most Praiseworthy General Invalids'' Fund not only my
    whole property under a general mortgage, but I also pledge to the same besides, under a special mortgage,
    the bond annexed hereto dated Wrocław, the 1st of June 1804, which was made out to me by'

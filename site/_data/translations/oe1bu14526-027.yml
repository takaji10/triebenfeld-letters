- page: 2
  en: 'possession, but until then they would have to be patient a while longer. Concerning the withdrawal-payment
    of Mr. von Szucki, may Your Honour have the kindness to report this to the Royal Government, and also,
    if something over and above the 1000 Rthl which the community is willing to give might be contributed
    toward it by His Serene Highness, inasmuch as the same would be made good again within 10 days, and
    thereafter there would be quiet and peace within the community. Your Honour can yourself perceive
    how the pointed provocation of von Szucki upon the subjects is now increasing ever more through the
    offer of the 1000 Rthl withdrawal-payment; so that the poor people will have to suffer for it.


    For the rest we beg most obediently that Your Honour be graciously pleased to let us have, through
    the said Luke, closer instructions as to our conduct: what we are to do and to leave undone, both
    with regard to such further men as may yet come, who might come into possession of land with money,
    and also with regard to von Szucki''s mind as to'
  names:

status: draft
segments:
- page: 1
  en: 'Your Honour, especially most highly to be revered Sir, Councillor of Building and Economy. The
    miller Luka has disclosed to me his renunciation of the keeping of the contract, and accordingly wishes
    to settle the particulars to that end with Your Honour at Kalisch. He has also duly received the 25
    Rthl in question.


    On this occasion he further brought along with him 2 men to take up some land; these have now been
    put off with promises until further on, and assured: that as soon as an end should have been made
    with Tromczin and Herr v. Szucki, they too should be put in possession of all the land in'
- page: 2
  en: 'possession, but until then they would have to be patient. Concerning the withdrawal-payment of
    the said v. Szucki, may Your Honour have the goodness to report this to the Royal Government, and
    if perhaps, in addition to the 1000 Rthl which the commune is willing to give, His Serene Highness
    might contribute something further thereto, inasmuch as such would be made good again within 10 days,
    and thereafter there would be quiet and peace within the commune. Your Honour can yourself perceive
    how by now the piquancy of v. Szucki towards the subjects increases the more through the offer of
    the 1000 Rthl of withdrawal-payment; how the poor people will have to suffer.


    For the rest we beg most obediently that Your Honour be most graciously pleased to let us have, through
    the said Luke, closer instructions as to conduct; as to what we have to do and to leave undone both
    in respect of any further people who may yet come who might come into possession of land with money,
    and also in the matter of v. Szucki''s mind as to'
- page: 3
  en: 'his withdrawal. We shall for our part do our best in the matter.


    Wherewith we for the rest have the honour, with high respect, to persist,


    Your Honour''s


    P. S.


    The joiner, who likewise wished to live in Szetlewek, out of desperation — being wholly consternated
    — has straightway bought a house in Zagorowo and means also to remain living here. Zagorowo,


    the 16th April 1799. wholly most obedient servants Titz


    Bancke'

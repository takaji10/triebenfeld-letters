- page: 3
  en: 'his withdrawal. We shall assuredly do our best in the matter.


    We who otherwise have the honour to remain, with high respect,


    Your Honour''s


    P. S.


    The joiner who likewise wished to dwell in Szetlewek has, out of desperation, being wholly consternated,
    at once bought a house in Zagorowo and intends also to remain living here. Zagorowo,


    the 16th of April 1799. Most obedient servants Titz


    Bancke'

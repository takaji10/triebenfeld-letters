status: draft
segments:
- page: 1
  en: 'Your Honour, most particularly highly to be revered Sir, Councillor of Building and Economy,


    The miller Luka has disclosed to me his renunciation of keeping to the contract, and accordingly wishes,
    to this end, to settle the particulars with Your Honour at Kalisch. He has also duly received the
    aforesaid 25. Rthl.


    On this occasion he further brought along with him to the spot 2 men for the taking-up of some land;
    these were for now put off until further on, and assured that as soon as an end should have been made
    with Trąbczyn and with Herr v. Szucki they too should be put in possession of all the land [text lost]'
- page: 2
  en: 'possession; but until then they must yet have patience. Concerning the withdrawal-payment of the
    said v. Szucki, may Your Honour have the goodness to report this to the Royal Government, and, if
    in addition to the 1000. Rthl which the community is willing to give, something might be furnished
    thereto by His Serene Highness, inasmuch as the same would be made good again within 10. days, and
    thereafter there would be quiet and peace within the community. Your Honour can yourself perceive
    how by now the piquancy of v. Szucki towards the subjects is ever increasing through the offer of
    the 1000. Rthl withdrawal-payment; for which the poor people will have to suffer.


    For the rest we most obediently beg that Your Honour be most graciously pleased to let further orders
    of conduct come to us by the said Luke: as to what we are to do and to leave undone, both in respect
    of such further people as may yet come who might come to possession of land with money, and also concerning
    v. Szucki''s mind as to'
- page: 3
  en: 'his withdrawal-payment. We shall assuredly do our best therein.


    We who for the rest have the honour to remain, with high esteem,


    Your Honour''s


    P. S.


    The joiner, who likewise wished to dwell in Szetlewek, out of desperation — finding himself wholly
    consternated — has straightway bought a house in Zagorowo and means to remain living here also.


    Zagorowo, the 16th April 1799.


    most obedient servants

    Titz


    Bancke'

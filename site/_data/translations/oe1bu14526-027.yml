- page: 1
  en: 'Your Honour, most particularly highly honoured Sir, Councillor of Building and Economy. The miller
    Luka has disclosed to me his renunciation of keeping to the contract, and accordingly wishes, to this
    end, to settle the particulars with Your Honour in Kalisz. He has also duly received the aforesaid
    25 Rthl.


    On this occasion he also brought along with him 2 more men to take up some land; these have now been
    put off with hopes until a later time, and assured that as soon as an end should have been made with
    Trąbczyn and Mr. von Szucki, they too would obtain possession of all the land in'

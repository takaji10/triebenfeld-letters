- page: 3
  en: 'For the rest, Wartensleben [uncertain: knows] not a word as yet of what sort of estates those are
    which I offered him in the exchange dealing. — He guessed at the Bavarian ones after Prince George.
    — I [uncertain: begged] him to leave off the game of questions, since he could learn nothing at present
    until I myself were first informed. At bottom the old greybeard grieves me. His fate is a sad one.
    In deepest reverence I remain, until death, Your Most Serene Highness''s Brzeg


    the 31st of October


    1811.


    faithful, humble and obedient servant v Triebenfeld'

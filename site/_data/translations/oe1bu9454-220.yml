- page: 2
  en: 'The matter would then stand as follows. — With the Zagórów estates there would remain, according
    to the valuation, apart from the arrears, some 35000 Rthl; with Wołczyn there would remain 80000 Rthl.


    Consequently there would remain upon the Zagórów estates a mortgage of 270000 Rthl. This Weigel and
    Stössel would have to take over along with Wołczyn, and give Your Serene Highness a receipt for 350000
    Rthl. If, however, Weigel and Stössel were willing, without Wołczyn, to take over the Zagórów estates
    at once for 350000 Rthl and to give Your Serene Highness a receipt, so that you might obtain Koszęcin
    [uncertain: free], then it would be according to the said statement. — Koszęcin could then be taken
    as an entailed estate for Prinz Alexander. Prince August cannot go against his father and are [illegible:
    ausbar]. — He would have to press for it that Your Serene Highness should be given out this sum together
    with the 200000 Rthl already paid upon Koszęcin, which amounts to some 550000 Rthl without those arrears,
    and thus Your Serene Highness could defy hell itself. — Let Your Serene Highness consider this and
    write your opinion to Blizanow by a swift messenger only. — I should very gladly have come to Sławięcice
    at once now, but I must absolutely go to Kalisz, for too much, and the most important court dates
    too, are waiting. — The valuation together with the schedule of arrears I beg to have returned in
    the original only; it will be required at Kalisz at the court date. Of the arrears I should still
    gladly [uncertain: Baurrretten] somewhat — then [uncertain: beyte] [uncertain: Ret] gives, when by
    way of encouragement in the exchange dealing, along with on the'

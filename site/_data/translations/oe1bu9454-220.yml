segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most carefully secured letter was sent to Schweinere, so that it might
    be forwarded to me as occasion offered. There the tenant let it lie for some considerable time, and
    for this reason I received it 3 weeks after it had been dispatched. Immediately upon receiving it
    I went to Oxtrow, sold my wool in order to have travelling money, and then hurried to Count Wasserleben
    at Neisse. Unhappily, however, I came too late, for Wartenleben had already concluded with a bankrupt
    merchant from Kulins, whereby for Schurguet he accepts estates at 135000 Rthl for which I would not
    give 40000 Rthl; only, the matter is past. — Meanwhile the younger Wartensleben, who is now in Austrian
    service, holds the Constadt estates. — He gave for them about 150000 Rthl. He has sunk into them his
    wife''s fortune, she being a born Reuhenbauernst, and has made very many improvements. He now demands
    200000 Rthl for these estates. On the estates there stand 120000 Rthl of debts. There would thus remain
    a further 80000 Rthl. On this sum one is willing to bargain. Should Your Serene Highness wish to treat
    here, then write to me in all haste by an express courier to Blizanow, and come as well, then at once
    to Schlawenseins to arrange everything, and from there on to Wartensleben at Neisse in order to conclude.
    Everything, however, depends upon Weigel and Stössel taking over the Constadt estates again, as also
    the mortgage upon the Zagorowo estates, and giving Your Serene Highness a receipt in return. Am I
    to negotiate with Weigel on this account, or has Your Serene Highness someone for it who understands
    it better than I?'

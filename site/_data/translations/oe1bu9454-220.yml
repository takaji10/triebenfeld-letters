- page: 1
  en: '220


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most highly honoured letter was sent to Świniary so that it might be
    forwarded to me as occasion offered. There the tenant let it lie for a considerable time, and for
    that reason I received it 3 weeks after it had been despatched. Immediately upon receiving it I went
    to Ostrów, sold my wool in order to have travelling money, and then hastened to Count Wartensleben
    at Nysa. Unhappily, however, I came too late, for Wartensleben had already concluded with a bankrupt
    merchant from Kalisz, in which he accepts for Skorogoszcz estates worth 135000 Rthl, for which I would
    not give 40000 Rthl; only the matter is now past. — Meanwhile the young Wartensleben, who is today
    in Austrian service, has the Wołczyn estates. — He gave about 150000 Rthl for them. He has put his
    wife''s fortune — she being a born Reuhonbasch[uncertain: ] — into them and has made very many improvements.
    He now demands 200000 Rthl for these estates. There stand upon the estates 120000 Rthl of debts. There
    would thus remain 80000 Rthl. On this sum one is willing to bargain. Should Your Serene Highness wish
    to pursue the matter here, then write to me by the most urgent means by an express to Blizanow, and
    also come, then at once to Sławięcice to arrange everything, and thereafter to Wartensleben at Nysa
    to conclude. Everything, however, depends upon Weigel and Stössel taking over the Wołczyn estates
    again, as also the mortgage upon the Zagórów estates, and giving Your Serene Highness a receipt in
    return. Am I to negotiate with Weigel to that end, or have Your Serene Highness someone for it who
    understands it better than I?'

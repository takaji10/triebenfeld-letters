status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness''s most safely-kept
    letter was sent to Schweinere, so that it might be forwarded to me as occasion offered. There the
    tenant let it lie for a considerable time, and for this reason I received it 3 weeks [uncertain: still/after]
    its dispatch. Immediately upon receiving it I went to Oxtrow, sold my wool in order to have travelling
    money, and then hastened to Count Wartensleben at Neisse. Unhappily, however, I came too late, for
    Wartenleben had already concluded with a bankrupt merchant from Kulins, wherein he takes on estates
    for Schurguet for 135000 Rthl, for which I would not give 40000 Rthl; only, the matter is past. Meanwhile
    the young Wartensleben, who is now in Austrian service, has the Constadt estates — He has given circa
    150000 Rthl for them. He has sunk into them his wife''s fortune — she being a born Reuhenbauernst
    — and has made very many improvements. He now demands 200000 Rthl for these estates. Upon the estates
    there stand 120000 Rthl of debts. There would thus remain a further 80000 Rthl. Upon these one is
    willing to bargain. Should Your Serene Highness wish to negotiate here, then write to me in all haste
    by an express to Blizanow, and also come, then at once to Schlawenseins to arrange everything, and
    thereafter to Wartensleben at Neisse to conclude. Everything, however, depends upon Weigel and Stössel
    taking back the Constadt estates, as also the mortgage upon the Zagorow estates, and granting Your
    Serene Highness a receipt against them. Am I to negotiate with Weigel to that end, or has Your Serene
    Highness someone for it who understands it better than I?'
- page: 2
  en: 'The matter would then stand as follows — at Zagorow there would remain, according to the valuation,
    apart from the arrears, 35000 Rthl; at Konstad there would remain 80000. Consequently there would
    remain upon the Zagorow estates a mortgage of 270000 Rthl; this Weigel and Stössel would have to take
    on together with Constadt, and grant Your Serene Highness a receipt for 350000 Rthl. So also, if meanwhile
    Weigel and Stössel were willing, without Constadt, to take on the Zagorow estates outright for 350000
    Rthl and to grant Your Serene Highness a receipt, so that you might get Koschentin back, then it would
    be, according to the said [text lost] Koschenten could then be taken as an entailed estate for Prince
    Alexander. Prince August cannot act against his father and [illegible] — He would have to press for
    this, that Your Serene Highness be given out this sum together with the 200000 Rthl already paid upon
    Koschentin, which amounts to 550000 Rthl without those arrears, and so Your Serene Highness could
    defy hell itself. — Let Your Serene Highness consider this, and only write your opinion by a swift
    messenger to Blizanow. — I should very gladly have come at once now to Schlawenschütz, but I must
    absolutely go [uncertain: to] — too much besides, since the most important court terms are also waiting.
    The valuation, together with the schedule of arrears, I beg to have back only in the original; it
    will be required in aplicii at the term. Of the arrears I should still gladly [text lost] something
    [uncertain: Baurrretten] neediness gives when by way of encouragement in the [uncertain: t]exchange
    dealing along with on the'
- page: 3
  en: For the rest, my Wartensleben as yet knows not a word as to what sort of estates those are which
    I offered him in the exchange dealing — he guessed at the Bavarian ones, after Prince George — I bade
    him leave off the game of questions, since he could learn nothing now until I myself am first instructed.
    At bottom the old greybeard moves me to pity — His fate is a sad one. In deepest reverence I remain,
    until death, Your Most Serene Highness's faithful, humble and obedient servant v Triebenfeld Brieg,
    the 31st of 8br 1811.

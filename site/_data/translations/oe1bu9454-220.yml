- page: 2
  en: 'The matter would then stand as follows: — with Zagorowo there would remain, according to the valuation,
    apart from the arrears, 35000 Rthl


    with Konstad there would remain


    80000. Consequently there would remain upon the Zagorowo estates a mortgage of 270000 Rthl; this Weigel
    and Stössel would have to take over together with Constadt, and give Your Serene Highness a receipt
    for 350000 Rthl; so also, if Weigel and Stössel would meanwhile, without Constad, take over the Zagorowo
    estates outright for 350000 Rthl and give Your Serene Highness a receipt, so that you get Koschentin
    back, then it would be according to the said Koschentin could then be taken as an entailed estate
    for Prince Alexander. Prince August cannot act against his father and are payable — He would have
    to press upon it that this sum, together with the 200000 Rthl already paid upon Koschentin, be handed
    over to Your Serene Highness, which comes to some 550000 Rthl without those arrears, and so Your Serene
    Highness could defy hell itself. — Let Your Serene Highness weigh this and write your opinion to Blizanow,
    only by a swift messenger. — I would very gladly have come to Schlawenschitz at once, just now, but
    I must absolutely go [uncertain: elsewhere], there being too much besides, and the most important
    court terms are waiting. The valuation, together with the designation of the arrears, I request back
    only in the original. It will be required in copy at the term. Out of the arrears I should still gladly
    [illegible] something for the peasants, necessity being what it is, by way of encouragement in


    [uncertain: t]ausch exchange-dealing with upon the'

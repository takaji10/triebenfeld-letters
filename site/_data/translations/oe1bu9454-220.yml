- page: 3
  en: 'For the rest, my Wartensleben [says] not a word as yet as to what sort of estates those are which
    I offered him in the exchange-dealing — he guessed at the Bavarian ones, after Prince George — I bade
    him leave off the game of questioning, since he could now learn nothing until I myself had first been
    informed. At bottom the old greybeard moves me to pity — his fate is a sad one. In deepest reverence
    I remain, until death, Your Most Serene Highness''s faithful, humble and obedient servant, v. Triebenfeld


    Brieg


    the 31st of 8br


    1811.'

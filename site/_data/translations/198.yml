status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! Your Serene Highness's affairs in Poland, whence
    I returned the day before yesterday, are ordered in the best way. 1. Trąbczyn Your Serene Highness
    will have back by Michaelmas at the latest. 2. The sequestration is entirely lifted. 3. The accounts
    of Honrichs and of Frankiewitz, for both of whom the pod prefect Brzechsta has stood guarantor, are
    now being audited by the Calculator Schneider appointed by the Prefecture. Hecker must prove his statements
    together with Hawich concerning the 11700 Rthl embezzled, and when Honrichs, Frankiewicz / this is
    an official of Brzechsta whom I have never seen / together with Badinski are convicted, then Brzechsta
    must pay, if the property of those men does not suffice. — Meanwhile I have 4. conceded that Hecker
    may be appointed as administrator. — He is liable for everything — and will also furnish that guarantee
    to Weigel. The commission of inquiry takes its beginning on the 12th of this month and will likely
    last several days, so that Hecker, when he is required for the Weigel matter, can appear at once.
    Trąbczyn offers glad prospects, for the tenant Smidkowski is paying several thousand at once, merely
    in order to remain in the estates.
- page: 2
  en: 'Smidkowski was in Warsaw with Kramplitz — the Dąbska threw herself at the feet of the King, who
    was there at the time, on account of Tropiren; but she was refused in her petition. The arrow, then,
    has likewise been shot without reaching its mark. Kramplitz, who returned 4 days ago, goes about very
    sorrowfully with this tenant Smid. — The King''s resolution is in a threatening style. I hope my two
    spirits Lubinski and Woyda have brought this about. 6. My own affairs are arranged — Richter arrived
    here from Berlin only the day before yesterday. Kösteritz has conducted himself exceedingly worthily
    and obligingly, likewise Tismar and everyone — I am wholly content. — Köckritz writes that he would
    himself forward all the Colonna papers to Your Serene Highness — he wishes heartily that something
    at least might be effected. Concerning Your Serene Highness''s own affairs he is entirely silent.
    Only to Richter, with whom he chatted a full 2 hours, notwithstanding that some 20 officers and other
    persons were waiting upon him — to him he said: if only the devil would carry off the old business
    — then things would go doubly well with the Prince. To the [uncertain: Guhl] Rath Sanen[?] he wrote
    at once that he should be easy concerning the Invalids'' interest — he promises to report the effect
    to me at the earliest. He said to Richter in these words: Your master has many an honest joy and much
    envy, but the King knows that he is a man. — Tismar writes / a certain man also wished to have something
    in hand [uncertain], the King answered nothing — I suspect Reibnitz'
- page: 3
  en: 'or Nüchel, Reibnitz''s protector. — Thereupon the King said: people are always pecking at Triebenfeld,
    he is surely an honest fellow. Köckritz answered: of that I am convinced; I believe that if the man
    were satisfied and set in the right place, he would fetch us the devil out of hell. — This the Baron
    v. Rhaden writes to me also — likewise a man of the old stamp and grain. — In the so-called wind-butchery
    there must after all be not so much truth [uncertain: sentence lacks a verb]. Be it, however, as it
    may, and let each man permit himself to say, for his amusement, what he will; I am content, and wish
    nothing further than once to make the acquaintance of such a wind-hound, whom my pistols shall rouse
    most terribly indeed. — For on account of the Colonna business I must pass through hellish stirrup-leathers.
    Köckritz himself writes to Tismar: I pity the honest soul and wish heartily that something at least
    may come of it, for the daredevil has poked into a hornets'' nest and provoked the B. against himself
    — God grant him fortune. Hardenberg is coming, as Köckritz writes, into full activity, and will arrange
    the business of the debts. Tismar writes this likewise and names him as Prime Minister in the same
    quality as he was in Bartenstein; this is said to be with Bonaparte''s approval / O God /. Of Zastrow
    nothing will now come; to Hardenberg his death is peace. Friedr. Massow would already be called Minister,
    only Dohna [Dąmbska?] has hitherto prevented it. From von Rhoden Your Serene Highness will doubtless
    already have full news concerning the 35000 Rthl, and be reassured. Grevenitz must have written to
    Your Serene Highness also. He will surely be vigilant and mindful of Your Highness''s advantage. The
    old lady was, as Kochry writes to me, very ill, but has recovered again; yet her length of life is
    doubted. — In deepest reverence I remain, until death, Your Most Serene Highness''s Kantwicz[?] 8th
    June 1810. Two divisions are marching from us against the Turks — who will command them? Tomorrow
    I hasten to Kontop; on the 12th I go on to Streiten and from there to Pohl[?] — most faithful servant
    v. Triebenfeld'

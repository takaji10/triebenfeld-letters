  html: '<div class="ledger-wrap"><table class="ledger">

    <caption>List<br>of those South Prussian rebels against whom sentence of death, of lifelong or of
    long imprisonment in a fortress has been pronounced.</caption>

    <thead><tr><th rowspan="1" class="no">Number</th><th rowspan="1" class="name">Names</th><th class="text">Nature
    of the crime</th><th class="text">Length of the sentence</th><th class="text">Its beginning</th></tr></thead>

    </table></div>'
- page: 2
  en: 'Number,Names,Nature of the crime,Length of the sentence,Its beginning

    ,A. Death sentence.,,,

    "1,","Franz von Wittwicki,","Because at the attack on the town of Włocławek they led the canons''
    servants against the military, and also murdered an officer and an excise official.",,

    "2,","Andreas Retznowski,",,,

    ,B. Lifelong fortress imprisonment.,,,

    "1,","Joseph von Stockowski,","Because he was general of the insurgents of Wieluń, led them against
    the royal troops, robbed magazines and plundered treasuries.",,

    "2,","Joseph Nowicki,","Was sentenced to the gallows, because he was especially active in the seizure
    of the artillery transport at Włocławek and mortally injured several people in it; but has been pardoned
    by His Royal Majesty.",,

    "3,","Joseph Sobolewski,",Because after the dissolution of the insurrection he joined a band of robbers
    and helped in murders of soldiers and travellers.,,

    ,C. Long fortress imprisonment,,,

    "1,",Johann Thiele,Because he showed himself especially active as secretary at the insurgents'' Commission
    of Order and War,4 years,February 1795

    "2,",Nicolaus von Psarski,For especially active participation in the insurrection,8 years,March 1795

    "3,",Johann von Pistrzkowski,The same,8 years,March 1795

    "4,",Johann von Dobski,The same,10 years,March 1795

    "5,",Provost von Chicomski,For abuse of his spiritual office to promote the insurrection,10 years,July
    1795

    "6,",Vincent von Magnuski,Because he probably finished off a dragoon who was already wounded.,4 years,August
    1795

    "7,",Casimir von Pratzmowski,For especially active participation in the insurrection and highway robbery
    committed,15 years,August 1795

    "8,",Johann von Dobrski,"Because, during his flight from the insurgents, he mortally wounded a hussar
    who wanted to examine him",10 years,August 1795

    "9,",Joseph von Psarski,For especially active participation in the insurrection,6 years,September
    1795'

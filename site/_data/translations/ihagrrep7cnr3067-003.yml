- page: 1
  en: 'List

    of those South Prussian rebels

    against whom sentence of death, of lifelong

    or of long imprisonment in a fortress

    has been pronounced.'
- page: 2
  en: 'Number

    Names

    Nature of the crime

    Length

    of the sentence

    Its beginning

    A. Death sentence.

    1, Franz von Wittwicki,

    2, Andreas Retznowski,

    Because at the attack on the town of Włocławek they led the canons''

    servants against the military, and also murdered an officer

    and an excise official.

    B. Lifelong fortress imprisonment.

    1, Joseph von Stockowski,

    Because he was general of the insurgents of Wieluń, led them

    against the royal troops, robbed magazines and

    plundered treasuries.

    2, Joseph Nowicki,

    Was sentenced to the gallows, because he was especially active in the seizure of the artillery transport
    at

    Włocławek and mortally injured several people in it;

    but has been pardoned by His Royal

    Majesty.

    3, Joseph Sobolewski,

    Because after the dissolution of the insurrection he joined a band of robbers

    and helped in murders of soldiers and travellers.

    C. Long fortress imprisonment

    1,

    Johann Thiele

    Because he showed himself especially active as secretary at the

    insurgents'' Commission of Order and War

    4 years

    February 1795

    2,

    Nicolaus von Psarski


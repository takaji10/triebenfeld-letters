- page: 1
  en: 'For the part of the Illustrious Prusimski, Starost of Niszczewice — Delivery of the Olęder


    Let there be seen at this place, for the part of the Illustrious Magnificent Antoni Prusimski, Starost
    of Niszczewice — the Delivery of the Honest Martin Hunt, Olęder of Trąbczyn, carried out by the Illustrious
    Józef Łukaszewicz, Commissioner of the Greater Poland Palatinate — as stands in the submitted documents.'

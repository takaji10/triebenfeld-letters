segments:
- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our Royal Grace, Friendship and good Will
    beforehand! Most Serene Prince, dearest Friend and dear Faithful One. Your Liebden receives herewith
    enclosed an engrossed copy of the purchase contract concluded with the Banco-Rendant Leixner over
    the estates Kolno and Kaemen, confirmed under this date. We remain well disposed toward you with Royal
    Grace, Friendship and favourable Will. Given at Posen, the 18th of March 1805. Royal South Prussian
    Government [illegible]raudchreig[illegible]


    To


    the reigning Lord


    Fürst zu Hohenlohe


    Ingelfingen, Liebden.


    Fee 1 rt 2 g


    Stamp 6 g


    Mund[ierung, fair-copying]: 2 g


    Ins[inuation, service]: 3 g'

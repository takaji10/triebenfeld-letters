segments:
- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our Royal grace, friendship and good will
    be with you first! Most Serene Prince, dearest friend and dear faithful subject. Your Lordship receives
    herewith enclosed an engrossed copy of the purchase contract concluded with the bank cashier Leixner
    concerning the estates of Kolno and Kaemen, confirmed this day. We are well disposed towards you with
    Royal grace, friendship and favourable will. Given at Posen, the 18th of March 1805. Royal South Prussian
    Government [illegible]raudchreig[illegible]


    To


    the reigning Lord


    Prince of Hohenlohe-


    Ingelfingen, Your Lordship.


    Fee 1 rt 2 g


    Stamp 6 g


    Engrossing: 2 g


    Registration: 3 g'

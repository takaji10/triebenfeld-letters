status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! In the v. Broniewski matter the renewed first
    attempt at the deposition has run out fruitlessly, as Your Most Serene Highness will deign to see
    from the enclosed resolution of 25 June. I did not delay in [uncertain: raising once again all the
    outcry] in order to [uncertain: recession / to obtain a rescission]. Herr v. Triebenfeld had told
    me that Your Most Serene Highness would, if need be, deposit a security along with it, merely in order
    to obtain possession of the estates. This I therefore offered; it stands at 10000 Rthl [uncertain:
    detes Mieciat], and thereupon, in accordance with the appointed [uncertain: disposition], consideration
    has been given, and the deposition, as also the clearing of Kolno and Kaemen, has been ordered to
    the Government'
- page: 2
  en: at Posen. I do not doubt that this disposition will be agreeable to Your Most Serene Highness, and
    in this presumption, [text lost] I [remain] with reverence and devotion, Your Most Serene Highness's
    — Ber[lin?] the 3rd of July 1804 — humble and obedient servant, Amelang

segments:
- page: 1
  en: 'Done in Konin, on 9 June in the Year of the Lord 1788.


    On behalf of the Most Honourable Prusimski — Presentation of Livestock and a Horse with a Cart joined
    to the same.


    Coming in person to the present Municipal Court Office and Records of Konin, the Honourable Ludovicus
    Żurawski, serving the Most Honourable Antoni in Kolno Prusimski, Starost [district administrator]
    of Niszczewice, hereditary owner of the estate of Trąbczyn, and adhering to the common law, presented
    to the said Office a cart — with two front wheels, bare, that is without an iron plate placed on top,
    that is with bare front wheels; but with the rear wheels having an iron plate placed on top, that
    is with rear wheels shod with iron — together with two rear oxen: one of yellowish coat, that is of
    pale coat; and the other of mixed colour, that is of mottled, overly-white coat; and also a cow of
    striped coat, that is of dun mottled coat; and a chestnut mare harnessed to the above-mentioned cart
    with its cart stanchions — the oxen and cow in a yoke, that is in yokes, the mare in reins, that is
    in traces, all pulling the same cart — [all found on] the Peasant Martin Gryndel from the estate of
    Łomowo of the Right Honourable Scibor Chełmski, Treasurer of Wschowa, hereditary owner of the said
    estate, belonging to the more principal hereditary estates of Łukom of this Right Honourable Scibor
    Chełmski, Treasurer of Wschowa; the serf [found in] the pine forest belonging to the estate of Trąbczyn
    of the above-mentioned Most Honourable'
- page: 2
  en: Antoni in Kolno Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanislaus, and
    belonging and pertaining to his hereditary estates, and not subject to any dispute regarding the hereditary
    estate at any time; while [the serf] was riding into the said pine forest and already transporting
    from it a cut tree — suitable and fit for buildings — to the aforementioned estate of Łomowo, to his
    own home; [all of the foregoing] intercepted in this very pine forest by the Guardian of the Forests
    of Trąbczyn, and by reason of the presentation that followed in the manner set forth above, driven
    and brought to the present Municipal Chancellery of Konin. Which oxen, cow, and mare, with the cart
    harnessed to the same, standing before the Chancellery, [he] presented. The same presenter, the Honourable
    Ludovicus Żurawski, left the said [animals] at the present Municipal Chancellery of Konin for the
    purpose of the extradition of the same to the above-mentioned Peasant Gryndel, requesting the immediate
    extradition of these following the aforementioned Presentation — (as the aforesaid Quietance of Extradition
    pertaining to the matter of his Chancellery Office, drawn up in the Act on this day, having followed,
    sets forth more fully) — and left, and leaves [them], by these presents.

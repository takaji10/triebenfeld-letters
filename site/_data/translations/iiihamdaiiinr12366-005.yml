- page: 1
  en: 'Copy


    It is with great regret that the undersigned, Envoy Extraordinary, finds himself under the necessity
    of troubling His Excellency Count Nesselrode with an affair which already in 1818 and 1819 was the
    subject of an official correspondence between the two Governments, and which — at this moment — has
    reached such a point that the Prussian Government could not acquiesce in it without compromising its
    dignity and sacrificing the most evident rights of its subjects.


    Referring to the Notes which the King''s Mission had the honour of addressing to the Imperial Ministry
    under date of 10 September/29 August 1819 and of 24/12 May 1820, the undersigned confines himself
    to recapitulating quite briefly the following facts:


    The Starost Prusimski having taken part in the insurrection of 1794, his lands situated in the district
    of Konin, Palatinate of Kalisz, and namely the lordship of Trąbczyn with its appurtenances, were confiscated
    in conformity with the laws in force on the crime of high treason.


    The ownership of this lordship having been conferred by His Majesty King Frédéric Guillaume II, by
    means of a donation dated 9 August 1796, on the Prince of Hohenlohe-Ingelfingen, the latter''s title
    of possession was rectified and registered before the Government of former South Prussia.


    Some time afterwards the new owner'

- page: 7
  en: 'Kalisz be annulled, and that the courts of justice of the Kingdom of Poland be enjoined henceforth
    to respect the mortgage claims legitimately acquired both by the merchant Weigel and by other Prussian
    subjects, claims which have been solemnly and reciprocally guaranteed by the two Governments.


    In the firm conviction that the Imperial Government will not delay in acceding to so just a representation,
    the undersigned permits himself to add the observation that it matters to his Government that, before
    all else, the execution of the said judgment be suspended, so that Mr Weigel''s claim may not meanwhile
    be struck out of the mortgage books and replaced by some other claim, which appears to be the design
    of Countess de Miączyńska, and which could only multiply the difficulties it finds in the recovery
    of this claim.


    The undersigned, charged by his Court to hasten his report on the outcome of this step, likes to believe
    that His Excellency will be good enough, in consideration of the grave and major interests which are
    its object, to honour him as soon as possible with an answer, and takes this occasion.


    St Petersburg, 10 February/29 January 1827


    signed General de Schöler


    To His Excellency Count (Karl) Nesselrode'

- page: 2
  en: 'contracted a debt of 30,000 Reichsthaler to Mr François de Grottowsky, which was registered on
    the mortgage and afterwards assigned by a judicial act to the merchant Weigel, domiciled at Wrocław.


    When in 1807 — in consequence of the political events — Prussia had lost this province, the Governing
    Commission of the former Duchy of Warsaw gave back the lands of Trąbczyn to the daughter of the late
    Starost Prusimski, Michalina, then widow of her first husband Mr Dąbski, now married to Count Miączyński;
    and in conformity with this act of grace the title of possession was changed anew and transferred
    to this lady. The intabulated claims, however, remained not only intact, but, what is more, it was
    only then (22 March 1808) that the aforementioned assignment of the 30,000 Reichsthaler was registered.


    The interest on this mortgage claim not having been paid since, the merchant Weigel was at last obliged
    to bring his debtor before the civil tribunal of Kalisz; but, contrary to all expectation, this tribunal,
    dismissing him entirely, decided at first instance, by a judgment given on 6 March 1819, that Mr Weigel''s
    claim should be extinguished and struck out of the registers.


    To justify this decision, the civil tribunal of Kalisz had put forward the following arguments:'

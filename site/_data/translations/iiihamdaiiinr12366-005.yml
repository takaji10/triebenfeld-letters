- page: 4
  en: 'Nine months having passed without the Mission''s having received any answer whatever, it had the
    honour of reminding His Excellency Count Nesselrode of this affair by a note dispatched under date
    of 24/12 May 1820; but this communication likewise remained without an answer.


    Although the undersigned is glad to seek the reason for this as much in the almost inevitable delays
    in the course of business touching the Kingdom of Poland, in view of the distance between the capitals,
    as in the Congresses which then required His Excellency''s particular attention, it is nevertheless
    a fact that, without regard to the protests of the Prussian Government, Mr Weigel''s suit has meanwhile
    been judged at 2nd and 3rd instance, and that, although the court of appeal set aside the first sentence,
    the Supreme Tribunal of Warsaw has just confirmed it in every point.


    It would lead too far to enter here into the details of this affair by repeating the arguments put
    forward on either side; but, after examining them more closely, no one will wish to deny that, judging
    by the laws in force on the inviolability of mortgage claims in Poland as in Prussia, the merchant
    Weigel could never have been dismissed from his claim.


    Yet the civil tribunal of Kalisz and that of Warsaw saw fit not to keep'

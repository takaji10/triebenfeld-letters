- page: 5
  en: 'to the laws; they admitted as the basis of their judgments only the act of grace of the Regency
    Commission of the former Duchy of Warsaw, calling this act a privilege belonging to the category of
    the "constitutiones principum spéciales", and they did not even judge by the terms of this order,
    but by the sense which it pleased them to find in it, thereby themselves violating the theory of Roman
    law, to which they appear to refer in order to justify this strange departure from the common law,
    and which positively prescribes that privileges require a restrictive interpretation where the contrary
    might prejudice a third party.


    In attributing a retroactive effect to the order of the Governing Commission, they have attacked the
    rights which a Prussian subject had legitimately acquired on an estate whose ownership derived from
    his Sovereign, and consequently they have taken it upon themselves to contest the validity of a donation
    made in good and due form by His Majesty the King of Prussia.


    Not only have these tribunals exceeded the bounds of their power in seeking to judge a question which
    belongs to the law of nations, and which, supposing it were in fact doubtful, ought necessarily to
    have been reserved for political discussion, as Prussia had already asked in 1819 — but, what is more,
    their judgment is contrary to the clearest stipulations of the'
  names:
  - de: Duché de Varsvoie
    en: Duchy of Warsaw
    kind: place
  numbers:
  - '1819'
- page: 6
  en: 'existing treaties, which had long since decided this question in favour of the merchant Weigel
    and of all those who are in the same category.


    The Peace of Tilsit (art. 25) and the convention signed at Vienna on 20 March 1815 furnish evident
    proof of it, and in particular art. 13 of the convention of 22 May 1819 expressly states the following:


    "likewise maintained are every claim and every charge mortgaged on landed property situated in the
    States of His Majesty the King of Prussia, as also every charge and every claim mortgaged on landed
    property situated in the Kingdom of Poland, etc. etc."


    The undersigned flatters himself with the hope that these observations, which a more detailed examination
    of the affair cannot but confirm, will suffice to convince His Excellency Count Nesselrode that Prussia
    has not only the most incontestable right, but even the most sacred duty, to oppose the execution
    of the said judgment; and it is by express order of his Court that he appeals to the obliging intercession
    of His Excellency, begging Him kindly to take the necessary steps with the Imperial Government so
    that the judgment given by the Supreme Tribunal of Warsaw, dated 17 July 1826 and confirming that
    of the civil tribunal of'

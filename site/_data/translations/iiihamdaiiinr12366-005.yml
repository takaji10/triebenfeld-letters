- page: 3
  en: '1. That the order of the Governing Commission of 1 July 1807, by which the lands in question were
    given back to Madame de Miączyńska, was alone to serve as the basis of a decision in this affair,
    without regard to the laws in force on the inviolability of mortgage claims.


    2. That, even though it is not said in this order that the mortgage debts contracted on these lands
    after the confiscation were to be extinguished, this condition must nevertheless be understood, because
    without it the act of grace of the Governing Commission would have no effect;


    3. That the acts of donation made by His Majesty the King of Prussia had been valid only for as long
    as His dominion had lasted, and that consequently the succeeding Government had been master to annul
    them just as it pleased.


    The merchant Weigel, having lodged an appeal, brought this affair to the knowledge of the Prussian
    Government, and it was then that the King''s Mission had the honour of addressing itself to the Imperial
    Ministry to ask for its intervention, in order that the judicial decision on the question:


    Whether the claim registered on the mortgage of the lands of Trąbczyn was to be extinguished without
    repayment?


    should be discontinued, and that this question should be reserved for diplomatic discussion.'

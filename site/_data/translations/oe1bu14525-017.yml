- page: 3
  en: 'terable canon, and


    2.) of the competence due therefrom to the ecclesiastical corporations or foundations.


    We also do so hereby and by force of this present instrument, out of Royal power and plenitude, for
    Ourselves and Our descendants and successors to the Crown, the Electorate and Our remaining lands,
    in such manner and wise that Our abovementioned friendly dear uncle, the reigning Prince of Hohenlohe-Ingelfingen,
    shall have the abovenamed estates with all rights and jurisdictions attaching thereto, as the same
    have hitherto been exercised'
  names:
  - de: Fürst von Hohenlohe Ingelfingen
    en: Prince of Hohenlohe-Ingelfingen
    kind: person
  numbers:
  - 2.)
- page: 4
  en: or may lawfully be exercised, and no less with all their pertinences and other appurtenances, by
    whatever names they may be called, as the same have hitherto been enjoyed or may lawfully be enjoyed,
    and with all the lands belonging thereto, in fields, woods and meadows, likewise in ponds and waters,
    from now on for all eternity, for himself and his descendants and heirs, as a true, well-acquired
    and unrestricted property, irrevocably from Us and Our descendants and successors, to have,
- page: 5
  en: to possess and to enjoy; and that there shall also be annexed to the same the power and authority
    to dispose thereof at pleasure under the conditions mentioned above, unhindered by anyone. We therefore
    command and enjoin all Our Supreme Provincial Collegia, as also all other authorities whom this concerns,
    hereby as graciously as earnestly, that they in no wise hinder nor obstruct the Lordship of the oft-mentioned
    Lord Prince of Hohenlohe-Ingelfingen in the heritable and proprietary possession, granted to the same,
    of the abovenamed estates together with their pertinences and appurtenances,
  names:
  - de: Herrn Fürsten von Hohenlohe Ingelfingen
    en: Lord Prince of Hohenlohe-Ingelfingen
    kind: person
- page: 6
  en: 'nor him or those to whom he may one day bequeath the same, or otherwise lawfully transfer them
    by other acts inter vivos aut mortis causa; but rather that they let His Lordship, and eventually
    them also, enjoy the same freely and quietly, themselves doing nothing against it, nor occasioning
    or permitting that such be done by others, on pain of Our most high displeasure and of unfailing severe
    punishment.


    In witness whereof We have subscribed the present grant'
- page: 7
  en: 'instrument most highly with Our own hand and have caused Our greater Royal seal to be appended
    thereto. Thus done and given in Our Royal residence city of Berlin, the nineteenth day of the month
    of June after the birth of Christ Our Lord, in the one thousand seven hundred and ninety-seventh,
    and in the eleventh year of Our Royal reign.


    (L. S.) F. Wilhelm. Hoym. Reck.


    Grant instrument for the reigning Prince of Hohenlohe-Ingelfingen for the heritable and proprietary
    [uncertain: possession] of the villages of Pszczew, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów,
    Skokum'

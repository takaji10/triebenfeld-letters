- page: 10
  en: 'dated Berlin the 19th of June 1797 and the 1st of December of the same year, and of the letter
    of resignation of the 29th of March 1802, the titulus possessionis for the reigning Prince, Lord Friedrich
    Ludwig of Hohenlohe-Ingelfingen, over the lordship of Pszczew or Pszczew has been entered in the mortgage
    book Vol. VII fol. 1, according to the annexed mortgage certificate, by force of the decree of the
    29th of March 1802. Poznań, the 1st of May 1802. Fest, Archivist


    John, Engrosser'

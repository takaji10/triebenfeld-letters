segments:
- page: 1
  en: We Friedrich Wilhelm, by God's grace King of Prussia etc., do by this Our open letter attest and
    declare, for Ourselves and Our descendants and successors to the Crown, the Electorate and Our remaining
    lands, that, whereas it has been laid before Us in all humility in what manner Our intention — to
    give the High-born Prince, Our friendly dear uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen,
    by the grant of the estates formerly belonging to the absconded former starosta von Prusimski, a token
    of the friendship and goodwill We bear towards him,

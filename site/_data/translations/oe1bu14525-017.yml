- page: 2
  en: 'as also of Our Royal gratitude for the distinguished and beneficial services rendered to Us and
    to Our Royal house, has not been attained altogether as We had willed it, because the said estates
    were burdened with many debts, We have most highly resolved to leave over, to grant and to convey
    to His Lordship, heritably and in full property, the hereinafter named formerly ecclesiastical estates,
    namely the villages of Pszczew, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Swiątniki,
    Kopojno, Olesnica, Drzewce, Grądzyn, Wrąbczyn, Wieniec and Wolica together with all their appurtenances,
    by whatever names they may be called, against payment:


    1.) of the sovereign dues hitherto discharged therefrom, as a fixed and unal-'

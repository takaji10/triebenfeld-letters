status: draft
segments:
- page: 1
  en: 'received 21 May 1803


    Our joint report on the return of Anton von Prusimski and Xaver von Jezierski to their fatherland
    having been answered by the cabinet order of yesterday''s date, enclosed in the original and to be
    returned, I do not fail to send it most obediently to Your Excellency for your information, and with
    it, for your kind countersignature, the resolution to be given to the two petitioners and the order
    required to the Government at Poznań, in draft and fair copy; also a copy of the joint report, probably
    meant for Your Excellency''s files, which the chancery had attached, no doubt by mistake, to your
    most esteemed letter; with the request that you be so good as to return the draft and the fair copies
    to me once you have co-signed them.


    Berlin, 11 May 1803


    Goldbeck


    To His Royal Actual Privy State, War and Cabinet Minister and directing Minister of Finance, Count
    von Haugwitz, Excellency'
- page: 2
  en: 'Urgent

    1261


    1, The fair copies are to be laid before His [?] for signature[?], as is the draft. That done, they
    are to be delivered to His Excellency von Goldbeck''s department with the cabinet order, act. copy
    of the cab. order and the expeditions,


    and that with


    2, Exp. 2., namely a [?] to His Excellency von Goldbeck aus dieses[?], and Exp. 3. 4. notified.


    3, Exp. notificatorium to the Chamber cum mand.


    [?]'
- page: 3
  en: 'to have these subjects take the oath of allegiance, and to report here how it has been done


    4, Chamb. Exp. 3. [?]


    v. Voss for co- Count Haug[witz]


    27 May [?]'

status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! Now that, by a middling lease and by real assistance
    from General Köckritz, I may hope to set aside my sufferings — the gout seizes me again. For some
    days already I have been lying gravely down; yet I hope soon to be restored. However painful my illness
    may meanwhile be, I will nonetheless, in accordance with Your Serene Highness's commands, not delay
    the answer demanded of me. Your Serene Highness deigns to say that I would be summoned in Your affairs.
    Most gracious Prince and Lord! I have already, in Your affair, had 4 lawsuits about my neck this long
    while, which still cost much money — the one on account of the Invalids' Fund, the one with the Jew
    Oppenheimer, and now the one with the Colonel's lady Schliefen, are considerable — and they vex me
    frightfully, because I alone must suffer for it that I made myself surety for Your Serene Highness.
    Out of faithful attachment I did not wish to tell You the crediosa; I pressed the matter on quietly
    and beg thereby much — Believe that these lawsuits already cost me a very great deal of money — only
    7 days ago I had to pay the executor Alexius 132 Rthl, and the Chamber Court still demands 85 and
    42 Rthl for 127, which makes
- page: 2
  en: 'makes together 259 Rthl Courant. Empich conducts the Oppenheim suit; he has already received much,
    and he demands, if he succeeds, still much more. The Schliefen suit is being conducted against me
    in Breslau, and in Poland I am pursuing him against Meierowitz. This fellow still owes the Schliefen
    lady 6000 Rthl of purchase money for Wittow — I gave the Schliefen lady a written undertaking whereby
    I stood good to her for the sum; I did that in order to obtain for Your Serene Highness the 500 Rthl
    yearly hereditary quit-rent from Wittow, which Meierowitz has now for 4 years and longer left in arrears.
    — Out of gratitude that I helped the lady to all that she now has away, she has brought suit against
    me. I have now been compelled of necessity to sue Meierowitz, in order to help the old crone to the
    6000 Rthl and Your Serene Highness to the 2500 Rthl of hereditary quit-rents in arrears. The suit
    already costs, in Breslau and Poland, about 500 Rthl. I have borne it, endured it, paid, and said
    nothing to Your Serene Highness, for I spare You too gladly, since You have sufferings enough already.
    The affair with the [uncertain: zuvatirten — probably the Invalids''] Fund makes me quite without
    sleep; it already costs me many thousand thalers, honour, and health — it is the raw material of all
    the sufferings I have hitherto endured, and of grief beyond naming. I hoped God would once help, and
    that the matter would end through a death — it does not happen, and I can do nothing but seek to drag
    the affair out. Against going to Poland, my sense of honour rebels — this is not strange to You, and
    therefore You will no doubt also wait until matters change. I work on and hope to succeed; I have
    engaged a certain Stieger who now presses the matter with'
- page: 3
  en: 'force. — He costs me much, but will certainly bring everything into the clear. — Dunderheads can
    absolutely not be used now; one is laughed at there and the affair straightway grows worse. — Men
    must absolutely come forward who understand the language, since everything is transacted in the language
    of the country — but these men have themselves dearly paid. I raise it and give it, without always
    being burdensome to Your Serene Highness. For Your complaints tear my heart quite enough as it is;
    I love [uncertain: the] too much. The money that Lombardini has given and is now to give is not the
    [uncertain: 10 Rthl] part of what I have already given. — Daubing and begging I cannot do; I endure
    and bear, for the sake of my most gracious Prince, what no one else in the world would do. Here are
    3 decrees again; I do what is possible — but by force I can now compel nothing. Had I 50 men to command,
    then I would lay all the treasures of Poland at Your feet — as it is, however, I must endure and wait.
    Honrichs''s and Honrichs''s arrival I look for here daily. Stenger is investigating everything, and
    until then I suspend my judgement. — This much is certain, that Hawich is the greatest rogue. — If
    it is Honrichs too, then woe to him. — Only he has not received money; rather, a certain Radenski,
    who is appointed by the government, draws everything. I have therefore not seen a Groschen from thence.
    Nor, upon my honour, do I take anything from thence, so as not to fall into confusion. Lombardini
    has not given the 150 Rthl — I had made an order for them upon my son, who was here and wanted money,
    because he was applying'
- page: 4
  en: 'to be dismissed from the regiment; for I could give him nothing, because the executor had just
    taken away the last Groschen, and 100 Rthl had to be sent to Berlin. — Lombardini has given nothing,
    and my son lives, as do I and my daughters, in the greatest want. — My grief, through these tangled
    affairs, is before God without bounds. — Consider then, my Prince, the disgrace: my daughters work
    for money at finery and embroidery. They have judicially renounced me, merely to save the furniture
    and to bring what they have from their mother in salvo — I can give them nothing until I have my estates
    free again. I made an order for 100 Rthl to my son and 50 Rthl to the daughters — but Lombardini was
    not so obliging, as I hear within this hour, as to pay the money. — It revolts one''s inmost being
    — for this I have not deserved. Could I in haste raise 500 Rthl in coin, to send them, the children,
    in haste, I would gladly give upon Johann, when the lease monies come in, 1000 Rthl for it again.
    — This news makes me well nigh furious. — I have given up everything gladly and willingly — I have
    never drawn a heller from Your Serene Highness''s estates, and I am made to endure this language.
    — As soon as I am well I shall lay the account before Your Serene Highness. — I also beg You to make
    enquiry [uncertain: aufhohlen] — whether I have drawn a Groschen from thence. O most gracious Prince,
    that does hurt too much. O had I but soon 500 Rthl for my poor children. No, that exceeds all bounds.
    God preserve Your Serene Highness and let it go better with You than with me; this blow strikes me
    too hard. M[illegible] I remain, until death, Your Serene Highness''s Kontop, 27th January 1810 humble
    and obedient servant v Triebenfeld'

  en: 'Warsaw, 22 Sept. 1830


    The Minister Presiding in the Government Commission of Revenue and Treasury


    I have received Your Honour''s letter of 10 Aug. of this year, and its renewal of 14 Sept. of this
    year, on the subject of compensation to you for the losses you suffered in consequence of the striking-out
    of your claim of 30.000 thalers from the estates of Trąbczyn, ordered by the courts of this country.


    The first of these letters was accompanied by a Liquidation of the compensation Your Honour demands,
    namely:


    in capital 30.000 thalers


    in interest 31.800 thalers


    in costs 1,300 thalers


    Total 63.100 thalers


    I found this demand excessive, since under the laws in force with us Your Honour could never have
    attained such results even in the event of the most favourable conduct of the case. Wishing, on the
    other hand, to preserve strict justice, with the aim of compensating Your Honour for losses really
    suffered, and not nominal ones, I was obliged to order that the valuation of the estates formerly
    burdened with the above claim be ascertained on the spot, and in this way the degree of real value
    of the capital Your Honour lost be assessed. — This, then, is the reason why I have not been able
    until now to give Your Honour a detailed answer to your application.


    sig. X. X. Lubecki'

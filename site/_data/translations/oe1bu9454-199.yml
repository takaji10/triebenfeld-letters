segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    About an hour ago I arrived here. The interest of my exalted Serene patron bids me for now still to
    put off the conclusion from myself and to report to you, my most gracious Prince, that which I have
    here in hand — The first is the enclosed letter from T. — According to these [uncertain: Brück] the
    King with K2 now quite certainly; in this regard I shall not go to Berlin – but instead I shall work
    here, and tomorrow yet send wine and wildfowl to B to T, so that a good deal may be discussed and
    set in train at the farewell banquet – According to a note of Mr. von M. lying here, it is believed
    that Hardenberg too will come with the King, but this I think I must call into doubt, because T makes
    no mention of it. So be it — Were both to come, it would be doubly welcome to me – From the mouths
    of 2 and 3 witnesses the truth is, by the general laws, to be established. Meanwhile I seek to play
    the part of forestalling; for I am just now asking T that he absolutely take Hard: along as a party
    to the farewell banquet, and lead all the water onto our wheels.


    Since I am now not going to Berlin, I shall, if I am in any way in the world able to bring it about,
    ride post-haste again to Zagorowe, in order there in all haste to give the matter such a form that
    neither evil nor good beings shall be in a position to raise anything against the main matter. The
    strength for good will shall be granted me by God''s assistance for this reason, because I really
    hope to sell my mill in [uncertain: Schweinere] the day after tomorrow for 6000 Rthl in cash money,
    and also still to obtain a couple of thousand of arrears of the time from my subjects – for with a
    common soul, after all, nothing counts today but jingle-jangle – or the money-bag; whatever I shall
    find in [uncertain: Schweunen] out of Poland, I shall lay at Your Serene Highness''s feet by the next
    post.


    I commend myself to Your Serene Highness''s benevolence; to the fairest of Princesses now living,
    Emilie, [uncertain: auf dem Bütern] to the Illustrious Eldest Heir Albert I commend myself most deferentially
    and I remain, until death, in deepest reverence Your Serene Highness''s


    Breslau, the 19th of August, at 12 o''clock at night


    1810.


    faithful most humble and obedient servant


    v. Triebenfeld'

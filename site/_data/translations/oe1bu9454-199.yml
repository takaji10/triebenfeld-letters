  en: '199


    Most Serene Prince,


    Most gracious Prince and Lord!


    About an hour ago I arrived here. The interest of my exalted Serene Highness, my patron[uncertain:
    ], bids me for the present still to defer the conclusion from myself and to report to Your Highness,
    my most gracious Prince, what I found here — The first is the enclosed letter from T. — After this
    letter [uncertain: Brück] the King with K[öckritz] now quite certainly — in this regard I am not going
    to Berlin — but in return I shall work here, and tomorrow still send wine and game fowl to B to T,
    so that a good deal may be discussed and set in train at the farewell feast — [uncertain: Nacht] a
    note of Mr von M lying here — it is believed that Hardenberg too will come with the King, but this
    I think I must call into doubt, since T makes no mention of it. So be it — Were both to come it would
    please me doubly — By general laws the truth is to be established out of the mouth of 2 and 3 witnesses.
    In the meantime I seek to play the part of forestalling; for I beg T above all that he absolutely
    take Hard: along to the party at the farewell feast, and that he direct all the water onto our wheels.


    Since I am now not going to Berlin, I shall, if I am in any way in the world able to bring it about,
    gallop [uncertain: der] again to Zagórów, in order there in haste to give the matter such a form that
    neither evil nor good beings shall be in a position to raise anything against the principal matter.
    The strength for the good will shall be granted me by God''s assistance for this reason, because I
    really hope to sell my mill in Świniary day after tomorrow for 6000 Rthl in cash, and also to obtain
    a couple of thousand rt more in arrears of time from my subjects — for with a common soul nothing
    counts today but the chink of coin — or the money [uncertain: b]ack which I shall find at [uncertain:
    Schweunen] out of Poland, I shall lay at Your Serene Highness''s feet by the next post.


    To Your Serene Highness''s good will I commend myself; to the fairest of Princes now living, Emilie,
    on the [uncertain: Bütern] to the Illustrious Hereditary Grand Albert I commend myself in the most
    [uncertain: ihrerbietagste] manner, and he [uncertain: starbe] in deepest respect Your Serene Highness''s


    Wrocław, the 19th of August, at 12 o''clock at night


    1810.


    faithful and most humble and obedient servant


    v Triebenfeld'

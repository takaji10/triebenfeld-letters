- page: 2
  en: 'to Poznań and Pszczew, in order to set the great work in order there also — In the compensation
    matter I now hope for the happiest outcome, the more so as I have entirely won over the Chief Prefect
    v Smiedecki in Kalisz, upon whose opinion everything in the end depends — Some game would also have
    a very good effect here — as likewise in Poznań with Z[erboni]: what was received was almost entirely
    spoiled in the mild weather. In deepest reverence I remain, until death, Your Most Serene Highness''s.
    To the good [uncertain: Bider] Prince Adolph I commend myself for his favour. Blizanów


    the 31st of January


    1816.


    most obedient servant v Triebenfeld'

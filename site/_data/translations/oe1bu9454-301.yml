- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    301 Your Serene Highness''s most highly revered letter of the 26th of this month I received through
    the house steward Lombardini, whose arrival here was indeed most surprising, yet also most [uncertain:
    gratifying]. For I had already been in some distress on account of the long absence of the messenger
    sent thither, and believed the man had met with a mishap.


    It is doubly agreeable to me now, through the other Lombardini, to be able to lay at Your Most Serene
    Highness''s feet my deepest reverence and my most heartfelt congratulations on this day of such importance.
    May you, most gracious Prince and Lord, yet live to see a long succession of like days, but free from
    gout and other mishaps, in the most lasting health, good fortune, [uncertain: Mühn] and true contentment
    — As concerns hereafter Your Serene Highness''s affairs in these parts, I have no other intelligence
    to give to Your Most High Self than what my letters, now sent one after another in all obedience to
    Your Serene Highness, set forth, to which I refer. May you now most highly deign to let me know your
    further wise resolutions and the conduct to be observed — the honest Lombardini will truly render
    to Your Serene Highness the most faithful report on everything, grounded upon proofs — For the rest
    I observe that in all matters I act with caution, grounded upon experience, and endeavour to imitate
    the bee, which gathers its honey even from the poison-flower — At present I await, full of longing,
    my son and a tenant for Świniary; as soon as I have arranged this matter I shall go'

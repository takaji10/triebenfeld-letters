- page: 2
  en: 'to Posen and Betsche, in order to set the great work in order there as well. In the compensation
    matter I now hope for the happiest outcome, all the more since I have wholly won over the [uncertain:
    Ober-Verdeckt] von Smiedecki in Kalisz, upon whose opinion everything in the end depends. — Some game
    would also produce a very good effect here — as likewise in Posen with E:; what was received there
    was almost entirely spoilt in the mild weather. In deepest reverence I remain, until death,


    Your Most Serene Highness''s —


    To the good, upright Prince Adolph I commend myself for his favour.


    Blizanow,


    the 31st of January


    1816.


    most obedient servant

    von Triebenfeld'

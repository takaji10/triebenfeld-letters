status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your [uncertain: One] Serene Highness''s most
    highly esteemed letter of the 26th of this month I received through the [uncertain: Master of the
    Household] Lombardini, whose arrival here was also most surprising yet very much [uncertain: gladdened]
    at first. For already I had had some anxiety on account of the long absence of the messenger sent
    thither, and believed the man had met with misfortune. It is doubly agreeable to me now, through the
    other Lombardini, to be able to lay at Your Most Serene Highness''s feet my deepest reverence and
    my most heartfelt congratulations upon this day so important. May you, Most gracious Prince and Lord,
    live to see yet a long series of like days, but free of gout and other mishaps, in the most lasting
    health, fortune, [uncertain: labours] and true contentment. — As concerns hereafter Your Serene Highness''s
    affairs here, I have no other tidings to give the Same Most High than what my letters, now sent one
    after another most obediently to Your Serene Highness, declare, to which I refer. May it please the
    Most High to let me know your further wise resolutions and conduct. The honest Lombardini will truly
    [uncertain: render] to Your Serene Highness the most faithful report upon everything, one founded
    upon proofs. For the rest, I observe that in all matters I act with caution, founded upon experience,
    and endeavour to imitate the bee, which gathers its honey even from the poison-flower. — At present
    I await with longing my son and a tenant for Schweinern; as soon as I have arranged this matter I
    shall go'
- page: 2
  en: 'to Posen and Betsche, in order to set in order the great work there also. In the indemnification
    matter I now hope for the happiest outcome, the more so as I have entirely won over the [uncertain:
    Chief Concealed] von Smiedecki in Kalisz, upon whose opinion everything at last depends. — A little
    game would also produce a very good effect here — as likewise in Posen with E:; what was received
    had, in the soft weather, spoiled almost entirely. In deepest reverence I remain, until death, Your
    Most Serene Highness''s. To the good, upright Prince Adolph I commend myself for his favour. Blizanow,
    the 31st of January 1816. most obedient servant v Triebenfeld'

- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Your Serene Highness''s most highly esteemed letter of the 26th of this month I received through the
    house-steward Lombardini, whose arrival here was likewise most surprising, yet also very much [uncertain:
    gladdened]. For I had already been in some distress on account of the long absence of the messenger
    sent thither, and believed the man had come to harm.


    It is doubly agreeable to me now to be able, through the other Lombardini, to lay at Your Most Serene
    Highness''s feet my deepest veneration and my most heartfelt congratulations upon this important day.
    May you live to see, Most gracious Prince and Lord, yet a long succession of such days, free however
    of gout and other mishaps, in the most lasting health, good fortune, [uncertain: ease] and true contentment.
    — As concerns further Your Serene Highness''s affairs here, I have no other intelligence to give to
    Your Most High Self than what my letters, most obediently sent to Your Serene Highness one after another,
    set forth, to which I here refer. May you now most graciously deign to let me know your further wise
    resolutions and conduct.


    The honest Lombardini will truly render Your Serene Highness the most faithful report upon everything,
    grounded upon proofs. For the rest, I remark that in all matters I act with caution, grounded upon
    experience, and endeavour to imitate the bee, which gathers its honey even from the poison-flower.
    — At present I await with longing my son and a tenant for Schweinern; as soon as I have arranged this
    business I shall go'

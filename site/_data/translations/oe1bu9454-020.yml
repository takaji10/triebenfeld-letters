  en: '20


    Most humble Pro Memoria. From the enclosed letter of Privy Councillor Amelang Your Most Serene Highness
    will deign to see that yet again a new Cabinet Order has been issued, that entirely contrary to the
    Provincial Law and the old statutes one must now absolutely pay in Courant, even though the value
    was given only in paper.


    This blow strikes hard and occasions a loss of 1,500 Rthl in the van der Lahr matter. Payment must
    now, under the [uncertain: aforesaid] Cabinet Order — which was issued solely in favour of the Jews
    and usurers — absolutely be made in cash Courant. But whence to take it? I am brought low and cannot
    help myself; for even now a sequestrator sits upon my Konotop estates — I must stand at a distance,
    and may not approach my own hearth; indeed, I risk every day being taken up on account of the 3,000
    Rthl and arrested anew by van der Lahr, which disgrace I fear more than death. In order to forestall
    misfortune in this distress I have written today to Amelang [uncertain: in the name] of Your Serene
    Highness, "that he should come to terms with van der Lahr in this matter, that he should offer van
    der Lahr one thousand rt in cash money, and 350 Centner of iron at 6 Rthl delivered by the end of
    April." I hope the [uncertain: latter] will accept the offer; I am writing on that account in the
    name of Your Serene Highness to van der Lahr himself as well.


    The 1,000 Rthl I will raise and remit, so that it does not fall too heavily upon Your Serene Highness.
    But may Your Highness then have the grace to send me 950 Centner, and if it can be, 1,000 Centner
    in full, by about the 20th of April hither to Konotop; I shall at once see to everything from here
    to Berlin, send the 600 Centner to Michaelis and to van der Lahr as much as falls to him. For the
    costs amount to much still, and I have grounds for them, not few, such as now the Zagórów ones, which
    for the issuing of all the powers of attorney, the travel costs of Hawich, Hecker and of the justice-burgomaster
    Schenck of [uncertain: Neufeln] with his actuary, have amounted to 163 Rthl in cash Courant. If Your
    Serene Highness meanwhile sends me the 1,000 Centner of iron, then I shall bring everything into the
    clear and one can, as the enclosed report shows, begin a new life and course with courage; in the
    contrary case, however, if Your Highness does not effect this, I must, like a bird upon the roof,
    and now constant imprisonment from'

- page: 3
  en: 'Copy of the letter to


    the banker Mr


    van der Lahr,


    Right Honourable, in Berlin.


    Right Honourable Sir,


    Highly Honoured Banker, Your Right Honourable has had the goodness, in my affairs, to advance to the
    Councillor of War von Triebenfeld, against a bill of exchange made out to you by him and by the General
    and Major von Zastrow, 5,260 Rthl in paper, which are promised to be repaid in Courant. Mr von Triebenfeld
    has thereupon already repaid you 2,260 Rthl [illegible] of capital and 153 Rthl of interest, and there
    should still remain outstanding 3,000 Rthl and the interest thereon from July. It would run entirely
    counter to my way of thinking were I to permit [illegible] that Mr von Triebenfeld should suffer or
    have any unpleasantness on account of this matter. I therefore request you in friendship to release
    Mr von Triebenfeld from the obligation (ex nexu), to lift the suit against him soon, and to accept
    payment of the debt from me. I offer to pay you 1,000 Rthl at once and the remainder by the end of
    April; and if you will let my request take full effect, then take from me — since cash Courant is
    very hard to come by — 350 Centner of good bar and [uncertain: hoop] iron at 6 rtlr, which I most
    solemnly assure you I shall send you at once from my ironworks. Privy Councillor Amelang is authorised
    by me to [uncertain: negotiate] this matter with you and to conclude it with you, and to give me the
    speediest news of it, so that I may at once send in the 1,000 Rthl and also have the iron packed and
    forwarded by water. I shall regard your consent to this my request as a proof of your friendship,
    and for it shall ever remain, with true high esteem,


    Your


    Sławięcice, the 7th of March


    1809


    as in the blank form, to Ho.'

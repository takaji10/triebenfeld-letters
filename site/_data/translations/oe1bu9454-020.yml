status: draft
segments:
- page: 1
  en: 'Most humble Pro Memoria. From the enclosed letter of Privy Councillor Amelang Your Most Serene
    Highness will deign to see that yet again a new Cabinet order has been given, that now, entirely contrary
    to the provincial law and the old statutes, one must absolutely pay in Courant even where the value
    was given only in paper.


    This blow falls hard and occasions a loss of 1500 Rthl in the van der Lahr matter. Payment must now,
    under the aforesaid Cabinet order | which was given solely in favour of the Jews and usurers, absolutely
    be made in cash Courant. But where is it to be got from? I am brought low and cannot help myself;
    for even now a sequestrator sits in my Kontop estates - I must stand at a distance, and may not approach
    my own hearth; indeed, I risk every day being taken up on account of the 3000 Rthl and arrested anew
    by van der Lahr, which disgrace I fear more than death. To forestall misfortune in this distress I
    have today written to Amelang in the name [uncertain: Nachmäus] of Your Serene Highness, that he should
    come to terms with van der Lahr in this matter, that he should offer van der Lahr one thousand [uncertain:
    4t] in cash and 350 hundredweight of iron at 6 Rthl to be delivered by the end of April.


    I hope the usurer will accept the offer; I am writing on that account in the name of Your Serene Highness
    to van der Lahr himself.


    The 1000 Rthl I will raise and remit, so that it does not fall too heavily upon Your Serene Highness.
    But may the same Most High then have the grace to send me 950 hundredweight, and if it can be, 1000
    hundredweight in full, to arrive here at Kontop by about the 20th of April; I will see to everything
    at once from here to Berlin, send Michaelis the 600 hundredweight and van der Lahr as much as falls
    due to him. For the costs still amount to a great deal, and I have no small grounds for saying so,
    as now the Zagorowo people, who for the drawing up of all the powers of attorney, white [illegible]
    costs of Hawich, Hecker and of the justice-burgomaster Schnee of Neufeln with his actuary, have amounted
    to 163 Rthl in cash Courant. Let Your Serene Highness meanwhile send me the 1000 hundredweight of
    iron, and I shall bring everything into order, and one can with courage, as the enclosed report shows,
    begin a new life and course of conduct; but on the contrary, if Your [Serene Highness] cannot accomplish
    this, I must live like a bird on the roof and now fear constant imprisonment from'
- page: 2
  en: 'van der Lahr, and thereafter from the 1st of May onward also from Michaelis. I hope meanwhile to
    God that Your Serene Highness will grant my request and also approve this resolution taken in utmost
    distress, and likewise that van der Lahr will accept the offer made in the name of Your Serene Highness.
    I therefore send this letter, since in respect of your Polish possessions it will afford some peace
    of mind, and at the same time contains the urgent request for the relief of my sufferings, by express;
    may the same Most High have the singular grace to send me by the messenger your consent, but above
    all the reassuring news whether the 950 or 1000 hundredweight of bar and hoop iron can be here at
    my Royadler loading-place by the 20th of April, so that I need not creep away into the woods, but
    may act freely and with courage. Your Serene Highness loses little thereby, for you will indeed receive
    back the sum assigned to me by the French Government-General out of the Zagorowo estates, and then
    the 1000 hundredweight of iron is paid for again - whereas I have already lost much, have had to endure
    arrest and a million vexations over the business, and in my then career am so far set back that I
    can never make it good again.


    General von Zastrow, who is at present staying here on his estates, commends himself to the favour
    of Your Serene Highness. He is assuredly a most faithful admirer of Your Serene Highness. He maintains
    in your cause, as an honest man, that you really did beat N. at Jena, only that by high command you
    were forbidden to let General B. advance with the cavalry, and that by all this everything was lost.


    It is only a pity that this honest man will have to lie in perpetual [uncertain: Scat] for this truth.


    When I receive news from Your Serene Highness so as to be able to order everything here accordingly,
    I shall go at once to Vienna, and naturally I lay myself personally at the feet of the same Most High
    at Schlawenschitz.


    Kontop


    the 7th of March 1809 von Triebenfeld'
- page: 3
  en: '[uncertain: Copy] of the letter to


    the banker Mr


    van der Lahr


    Your Right Honourable in Berlin


    Right Honourable Sir,


    Highly esteemed Mr Banker, Your Right Honourable has had the kindness, in my affairs, to lend the
    Councillor von Triebenfeld, against a bill of exchange made out to you by him and by General and M.
    von Zastrow, 5260 Rthl at par, which are promised to be repaid in Courant. Mr von Triebenfeld has
    already repaid you thereon 2260 Rthl on the capital and 153 Rthl in interest, and there are still
    3000 Rthl and the interest thereon from July to be settled. It would run quite contrary to my manner
    of gratitude if I were to allow that Mr [uncertain: et Freib.] should suffer or have any unpleasantness
    on account of this matter. I therefore request you in friendship to release Mr von Triebenfeld from
    the obligation (ex nexu), soon to quash the suit against him, and to accept payment of the debt from
    me. I offer to pay you at once 1000 Rthl and the remainder by the end of April; and if you will let
    my request take full effect, then take from me (since cash Courant is very hard to come by) 350 hundredweight
    of good bar and white iron at 6 Rthl, which I most solemnly assure you I will send you at once from
    my ironworks. Privy Councillor Amelang is authorised by me to [uncertain: forward] this matter with
    you and to conclude it with you, and to give me the speediest news of it, so that I may then at once
    send in the 1000 Rthl and have the iron packed and forwarded by water. I shall regard your consent
    to this my request as a proof of your friendship, and for it shall always be, with true high esteem,


    as in the blank form to His Your


    Schlawenschitz, the 7th of March


    1809'

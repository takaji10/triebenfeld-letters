- page: 2
  en: 'van der Lahr, and thereafter from the 1st of May on also from Michaelis, apprehend. I hope meanwhile
    to God that Your Serene Highness will grant my request and also approve this resolution taken in the
    utmost distress, and likewise that van der Lahr will accept the offer made in the name of Your Serene
    Highness. I therefore send this letter by express, since it will afford Your Highness some repose
    with regard to your Polish possessions, and at the same time contains the urgent request for the relief
    of my sufferings; may Your Highness have the singular grace to send me your consent by the messenger,
    but above all the reassuring news whether the 950 or 1,000 Centner of bar and hoop iron can be here
    at my Bojadła loading-place by the 20th of April, so that I need not creep away into the forests but
    may act freely and with courage. Your Serene Highness loses little thereby, for you do receive back,
    out of the Zagórów estates, the sum assigned to me by the French General Government, and then the
    1,000 [uncertain: Leute] of iron are paid for again — whereas I have already lost much, have had to
    endure arrest and a million vexations over the business, and am so far set back in my then career
    that I can never more redress it.


    Lieutenant General von Zastrow, who is at present staying here on his estates, commends himself to
    the grace of Your Serene Highness. He is assuredly a most faithful admirer of Your Serene Highness.
    He [illegible] maintains in your cause, as an honest man, that you did in truth beat N. at Jena, only
    that by high command you forbade General B. to advance with the cavalry, and that thereby all was
    lost.


    It is only a pity that this honest man must for this truth lie in perpetual [uncertain: Scat].


    When I receive news from Your Serene Highness, so as to be able to order everything here accordingly,
    I shall go at once to Vienna, and naturally I lay myself in person at Your Highness''s feet at Sławięcice.


    Konotop


    the 7th of March 1809


    von Triebenfeld'

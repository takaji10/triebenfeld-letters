segments:
- page: 1
  en: 'Copy. Received 16 June 1800. His Royal Majesty of Prussia is moved by the enclosed complaint of
    von Prusimska to call in the files, as they stand, of the case conducted before the Government at
    Poznań in her suit against His Lordship the Prince of Hohenlohe-Ingelfingen concerning the petitioner''s
    maternal property, and therefore commands the said Government to send them in immediately upon sight
    of this. Charlottenburg, 14 June 1800. Friedrich Wilhelm


    To


    The Government at Poznań'

- page: 3
  en: 'everything be [uncertain: smoothed over]. To be sure, I shall have many a sleepless night yet and
    many an hour full of care before I can reach the goal; meanwhile, if my health in any way permits
    it, I shall labour on untiringly until I have attained the goal.


    As to Szetlewek, I would conclude everything this very week, and thereby clear a great stone of stumbling
    out of the way. With Oleśnica everything is set in train, and I hope to be finished with the matter
    very quickly and to be able to secure for Your Serene Highness the profit last reported to him.


    For the propination rights I have many tenants; I shall choose the one who offers most, and press
    for the greatest possible security. According to the dismemberment plan submitted by the district
    councillor, 8 new villages are to be established — May Your Serene Highness deign to send me the names
    for them by this messenger, for I must submit this to the Chamber. I had at first a mind to offer
    the enclosed designations; but since there was still some time, I leave this to Your Serene Highness''s
    discretion. For the rest, the contract with Schenck follows herewith. I need him much and must grease
    the man''s mouth; I have therefore drawn up what he absolutely demanded — Two points, however, are
    burdensome to me.


    1. 5 Hufen of land is too much.


    2. that he wishes to appoint the actuary or keeper of the minutes. May Your Serene Highness deign
    to send me the contract back,'

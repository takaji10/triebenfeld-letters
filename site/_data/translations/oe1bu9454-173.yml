- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    The building councillor Gleich has assured the criminal-court councillor Grimm that the memorandum
    of heads of agreement concluded between Rochlitz and Honrichs concerning Witów, together with its
    opening portion, on account of the power of attorney given to Nochli, lay in the Trąbczyn archive,
    of which I had taken the key into my own keeping.


    I at once charged old Tiel and the justice-burgomaster Schenck to go through all the papers held there,
    to see whether the said memorandum of heads of agreement and power of attorney were really present
    in that archive. Unhappily, however, not a syllable of these papers has been found, and for that reason
    I cannot budge from the spot with this business, which had been set in train so well. Will Your Serene
    Highness yet do me the one grace of commanding Glenck that he, with his Rochlitz, absolutely and without
    the least delay procure these documents — for otherwise, most gracious Lord, you risk losing for ever
    the advantage gained of 14000 Rthl, and moreover, since Honrichs pays neither capital nor interest,
    Your Highness might well have much vexation with Weigel and the Schleifen.


    From Amelang I have letters today — he writes that I need only have the proper justification given
    for the valuations, and then everything would sort itself out'

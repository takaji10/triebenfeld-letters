- page: 4
  en: 'and write in your own hand that you must take exception to ratifying the contract (NB my power
    of attorney is not sufficient) — that 5 Hufen of land, with so considerable a salary, would be too
    much — More than 60 Morgen you could by no means concede.


    Further, that you reserve to yourself in future to appoint the keepers of the minutes, or the actuaries,
    yourself; the present man commended to you, by the name of Brauer, you would gladly approve — but
    you could not concede the point in it, because otherwise all opportunity would be taken from you of
    providing for the men who have served you.


    I shall then so direct everything that Monsieur Schein is set at ease about it. As soon as I am done
    with Schenck, Grimm will be dismissed, for the man is sinfully idle and always ailing. At present
    Schenck has 200 Rthl.


    Grimm 400 Rthl.


    the fees which Your Serene Highness may receive amount to at least 400 Rthl., making 1,000 Rthl.


    NB up to now Schenck has taken all the fees. According to the contract Schenck receives in salary
    800 Rthl, for 2 horses 120 Rthl.


    For 2 Hufen of land, the rent, 30 Rthl.


    making 950 Rthl.


    there follow [illegible] 50 Rthl.


    The writing materials must be paid for at a higher rate, and likewise must'

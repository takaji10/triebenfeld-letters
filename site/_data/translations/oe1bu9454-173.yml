- page: 2
  en: 'A good general, after all, always gives thought to a fortunate retreat, and more of the same kind.
    Although the windbag says nothing more substantial, I nevertheless believe that people will be content
    with the district administrator''s review, his certificate and his guarantee; for this was my proposal,
    in order to lay it upon those people''s hearts — So now I must drain the cup of suffering and do the
    business with the wretched Blomberg. But the base fellow will not put pen to paper unless I pay him
    1000 Rthl in advance as well — for the reports he submitted, and for his minutes on the dismemberment
    plan, I have already had to pay him 900 rtum in cash, and if everything is to come to nothing, then
    I must find some expedient and stop the fellow''s maw. The cashier Peter here is good enough to advance
    me the money. Next Monday I go with a councillor from the Chamber to Trąbczyn; he reviews the locality
    according to the dismemberment plans submitted by the district administrator, and on the strength
    of these I obtain the concession without having to apply to the King.


    If only everything succeeds as it now has the appearance of doing, we gain: 1. the surplus last reported
    of Olesnica, Szetlewek, Witów etc. 50000 Rthl


    2. through the dismemberment, in cash 200000 Rthl


    3. the loan still to be hoped for, some 100000 Rthl


    makes 350000 Rthl. With this sum many a burden can indeed be discharged and, as I reckon,'

- page: 2
  en: 'A good general, he says, always thinks of a fortunate retreat, and more of the like. Although the
    windbag says nothing more substantial, I nevertheless believe that people will be content with the
    district councillor''s review, his attestation and his guarantee; for this was my own proposal, in
    order to lay it upon those men''s hearts — So I must now drain the cup of suffering and do the business
    with the wretched Blomberg. But the base fellow will not touch a pen unless I pay him 1,000 Rthl in
    advance — for the reports he has submitted, and for his minutes at the dismemberment plan, I have
    already had to pay him 900 Rthl in cash, and if everything is to come out clean, then I must find
    means and fill the fellow''s [uncertain: gullet]. The cashier Deter here is so good as to advance
    me the money. Next Monday I go with a councillor from the Chamber to Trąbczyn; he reviews the locality
    according to the dismemberment plans submitted by the district councillor, and on the strength of
    these I obtain the concession without having to approach the King.


    If only everything succeeds, as it now has the appearance of doing, then we gain


    1. the surplus last reported from Oleśnica, Szetlewek, Witów etc. of 50,000 Rthl.


    2. through the dismemberment, in cash, 200,000 Rthl.


    3. the loan still to be hoped for, some 100,000 Rthl, making 350,000 Rthl.


    With this modest little sum many a bear may yet be redeemed, and, as I reckon,'

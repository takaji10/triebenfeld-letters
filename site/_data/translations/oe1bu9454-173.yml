- page: 4
  en: 'and write in your own hand that you would have to hesitate to ratify the contract (N.B. My power
    of attorney is not sufficient) — that 5 Hufe of land, with so considerable a salary, would be too
    much — more than 60 Morgen you could by no means concede. Furthermore, you reserve to yourself in
    future to appoint the keepers of the minutes or the actuaries yourself; the present man commended
    to you, by the name of Brauer, you would gladly approve — but you could not concede the point in that
    form, because otherwise all opportunity would be taken from you of providing for the people who have
    served you.


    I shall then manage everything so that Mono: Schein is set at ease about it. As soon as I am finished
    with Schenck, Grimm will be dismissed, for the man is sinfully lazy and always sickly. At present
    Schenck has 200 Rthl


    Grimm


    400 Rthl. The fees that Your Serene Highness can obtain amount to at least 400 Rthl. N.B. up to now
    Schenck has taken all the fees, making


    1000 Rthl. According to the contract, Schenck receives in salary 800 Rthl


    for 2 horses


    120. For 2 Hufe of land the rent 30


    making


    950 Rthl


    there follow further


    50 Rthl. The writing materials must be paid for at a higher rate, and moreover there had to be'

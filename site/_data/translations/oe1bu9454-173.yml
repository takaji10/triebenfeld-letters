- page: 3
  en: 'everything be put right. To be sure, I shall have many a sleepless night yet and many an hour full
    of care before I can reach the goal; meanwhile, if my health at all permits it, I shall labour on
    untiringly until I have attained the goal.


    As regards Szetlewek I should finish everything this very week, and thereby clear a great stumbling-block
    out of the way. With Olesnica everything is set in train, and I hope to be done with the business
    very soon and to be able to procure for Your Serene Highness the profit last reported to him.


    For the propination rights I have many tenants; I shall choose the one who offers the most and press
    for the greatest possible security. According to the dismemberment plan submitted by the district
    administrator, S. new villages are to be established — May Your Serene Highness deign to send me the
    names for them by this messenger, for I must submit this to the Chamber. I had at first a mind to
    offer the accompanying designations; since, however, there was still some time, I leave this to Your
    Serene Highness''s discretion. For the rest, there follows herewith the contract with Schenck. I have
    much need of him and must stop the man''s mouth; I have therefore drawn up what he absolutely demanded
    — Meanwhile 2 points are burdensome to me.


    1. 5 Hufe of land is too much.


    2. that he wishes to appoint the actuary or keeper of the minutes. May Your Serene Highness deign
    to send me the contract back,'

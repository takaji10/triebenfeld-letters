- page: 1
  en: '173


    Most Serene Prince,


    Most gracious Lord!


    The building councillor Glenck has assured the criminal-court councillor Grimm that the punctation
    concluded between Rochlitz and Honrichs concerning Witów, together with the beginning, around the
    power of attorney given to Rochlitz, lies in the Trąbczyn archive, of which I am said to have taken
    the key into my keeping.


    I at once gave the old Tietz and the justice-burgomaster Schenck the commission to look through all
    the papers present there, to see whether the mentioned punctation and power of attorney were really
    to be found in that archive. Unhappily, however, not a syllable of these papers has been discovered,
    and for that reason I cannot move a step forward with this affair, so finely set in train — Let Your
    Serene Highness have but the one grace of commanding Glenck that he absolutely and with the utmost
    dispatch procure these pieces from his Rochlitz — for otherwise you, most gracious Lord, risk losing
    for ever the advantage gained of 14,000 Rthl, and moreover, since Honrichs pays neither capital nor
    interest, you might have much vexation with Weigel and the Schleifen.


    From Amelang I have letters today — he writes that I should only have the proper justification given
    to the valuations, and then everything would fall into place'

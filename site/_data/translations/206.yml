status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Lombardini has now been there, and Your Most
    Serene Highness already knows everything – I had to tear away the veil in order to look into what
    lies hidden. I believed that, as Your Most Serene Highness''s sole admirer and adherent, I might not
    withhold anything, and therefore I reported to you that which lurks in ambush, and what dangers threaten
    you, noblest of men – But do not lose heart – it will [uncertain: willenen] time turn out better than
    you suspect — With this government, however, count upon nothing for yourself; I now know the whole
    of it – From the North, as surely as there is a God, satisfaction shall come to you – Only now, patience
    and calm. Knobelsdorff exchanges, as the enclosure shows, most certainly – the further steps I have
    set in train – Tatz is coming to me for the wool market, then by way of Trąbczyn what is needful –
    I wish first only to give you air in the matter of your domestic affairs; then I shall if need be
    go myself to Petersburg; you shall, noble upright Prince, yet be avenged with the greatest éclat.
    With regard to the 35000 Rthl there must be writing done; the windy Eberhard has not yet sent me a
    syllable – Scharnhorst has spoken much on Your Serene Highness''s account in Cosel – It has been declared
    that they are willing, if it comes to that, to give you a sum of money – but do not accept that, upright
    Prince – Just vengeance shall be yours,'
- page: 2
  en: 'for that I stand surety — With the 35000 Rthl one must wait — if I only had the schedule from Eberhardt
    – If the exchange succeeds and the quick sale of the estates, then you may laugh in advance – Everything
    will go well – Even friend K. prophesies, with our government, a blessed end. The most vexatious thing
    is that the journeys require just so much money; I must sell from [illegible] to [illegible] 3 free
    holdings at Petersdorff for 1800 Rthl merely to obtain money; I lose 3200 Rthl thereby – but that
    must come out again through the transaction – On the 2nd I go to Poland in order to level everything
    and to be able to prepare everything for Knobelsdorff''s plan. According to my plan, Cabanis shall
    prove on oath how many plots belong to Zagorowo; 2ndly, all contracts are to be laid out, showing
    what of them has been [uncertain: verurbeachtet] and disposed of, and also what still remains for
    the establishment of new demesne farms, upon which Knobelsdorff sets such store. 3. What has anywhere
    been paid and what is still outstanding – this every hereditary-lease holder and colonist shall acknowledge.
    4. To come to terms with Honrichs, so that Knobelsdorff may find accommodation. If this is achieved,
    then no devil can raise any objection against the matter. I shall for this purpose [uncertain: take
    along] the Referendarius Sommer from Breslau and there request a Polish friend of the law from the
    Prefecture'
- page: 3
  en: 'and also to draw in the Chief Bailiff Hegener, and to have all this verified by them; then, I believe,
    even envy itself must be turned to stone in this matter. Once again, most treasured, most exalted
    Prince, be at ease, let God rule; all will come right. I remain forever, with the most unbounded [uncertain:
    devotion] and the deepest reverence, Your Most Serene Highness''s Breslau, the 16th of Sept. 1810
    faithful, most humble and obedient servant v Triebenfeld'

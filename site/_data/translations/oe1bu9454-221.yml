segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Your Serene Highness [uncertain: bestohlen] that 18000 Rthl are to be sent to you from the Zagorowo
    estates. It pains me more than grievously to have to tell Your Serene Highness that for the present
    this cannot be done. There is a prospect that 2 lawsuits will shortly be won, but until that happens
    nothing can be got out of the estates. On my knees I shall thank God if only the Christmas interest
    is paid, so that the moratorium remains in force. For the rest, I have by the most direct route set
    in train the matter of the alienation of the Zagorowo estates to Stossel.


    Count Leopold von Wartensleben has been with me together with young Stössel. They have viewed the
    estates, and Wartensleben, who has every influence over Stössel (for he is Stössel''s son-in-law),
    has gone to Breslau to bring the business onto its tracks.


    My plan is the one under Letter A, and Wartensleben''s the one under B. I await at every hour the
    declaration of the two old fellows. A certain Chief District Administrator König I have sent to Breslau
    on this account, to put [uncertain: Heymen] in the right frame of mind.


    König has at the same time travelled to Count Sendralzki, who may perhaps exchange with me, Blizanow
    against the Pila estates — the business goes better, for Weigel will not take Blizanow so willingly
    as the estates there, and Weigel must in my opinion be [uncertain: abholen] settled with at the same
    time as Stössel. Then Koschentin is saved – you then have 60000 Rthl in Koschentin; these must be
    given to you out of the monies designated for the entailed estate, and with them you pay all your
    debts and still have a large sum left over. From another matter you will perhaps get so much that
    you can pay the Courland sum — the how and the where, by word of mouth. If all succeeds, you will
    yet live quietly and happily. With Constadt there is nothing to be done — I have viewed the nest,
    and I will have nothing further to do with it – even Schurgast is a waterlogged hovel and too dear
    — with Pila it would be best. I hold my Blizanow at 127000 Rthl; 27000 Rthl stand upon it, and consequently
    100000 remain.'

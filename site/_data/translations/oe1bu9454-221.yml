  en: '221


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness has commanded that 18,000 Rthl be sent to you from the Zagórów estates. It pains
    me more than grievously to have to tell Your Serene Highness that for the present this cannot be done.
    There is a prospect that 2 lawsuits will shortly be won, but until that happens nothing is to be had
    out of the estates. On my knees I shall thank God if only the Christmas interest is paid, so that
    the moratorium remains in force. For the rest, I have by the most direct route set in train the matter
    of the alienation of the Zagórów estates to Stössel.


    Count Leopold v Wartensleben has been with me together with young Stössel. They have viewed the estates,
    and Wartensleben, who can do anything he pleases with Stössel (for he is Stössel''s son-in-law), has
    gone to Wrocław to get the business onto its rails.


    My plan is the one under Letter A and Wartensleben''s the one under B. I await hourly the declaration
    of the two old fellows — I have sent a certain chief district administrator König to Wrocław on that
    account, to bring Heymen round.


    König has at the same time travelled to Sendralzki, who may perhaps exchange with me, Blizanów against
    the Piła estates — the business goes better that way, for Weigel will not take Blizanów so willingly
    as the estates over there, and in my opinion Weigel must be fetched away and settled with at the same
    time as Stössel. Then Koszęcin is saved — you will then have 60,000 Rthl on Koszęcin; these must be
    given to you out of the moneys designated for the entailed estate, and with them you will pay all
    your debts and still have a great sum left over. Out of another matter there may perhaps accrue to
    you so much that you can pay the Courland sum — the how, and the where, by word of mouth. If all succeeds,
    you will yet live in peace and happiness. With Wołczyn there is nothing to be done — I have looked
    the nest over and I shall have nothing further to do with it — even Skorogoszcz is a watery hovel
    and too dear — With Piła it would be best of all. I reckon my Blizanów at 127,000 Rthl; 27,000 Rthl
    stand upon it, and consequently there remain 100,000'
- page: 2
  en: 'Sandrelzki reckons the Piła estates at 250,000 Rthl; 125,000 Rthl stand upon them, so there remain
    clear 125,000 in debts; consequently Sandrelzki receives / if the matter goes so / a further 25,000
    Rthl. He wants these at once in cash, and Weigel would have to provide them; something towards it
    could also be taken from the Zagórów arrears, if the lawsuits are won. In any case Weigel receives
    by this route 100,000 Rthl. On Zagórów he has 52,500 Rthl standing. Stössel remains owing by way of
    compensation 20,000 Rthl. Weigel would still have to receive 17,500 Rthl. That is 190,000 Rthl.


    Stössel must, as the plan under A shows, take the Zagórów estates. But he demands, as Leopold Wartensleben
    says, that Rusinowice be taken along with them, because both families wish to move out of Sławięcice
    and into Poland. In this way Stössel receives, if he really has so much to claim, 280,000 Rthl; that
    amounts to 470,000 Rthl.


    These are covered.


    1. For Zagórów 300,000 Rthl.


    2. For Weigel, registered there, 52,500 Rthl.


    3. through Blizanów or Piła 100,000 Rthl.


    4. by an additional payment of the 17,500 Rthl. That is 470,000 Rthl.


    When all this goes happily and is concluded, then after these days'' work, best of Princes, I shall
    come to him, and live and die with you — the 100,000 Rthl, as well as what I have already given on
    and for the [text lost], you will repay me afterwards in instalments, so that it [uncertain: falls]
    burdensome to me for you [uncertain: as also] to Prince August — With most faithful attachment and
    the deepest reverence I remain, until death,


    Your Serene Highness''s — May Your Serene Highness deign to send the papers back to me; I have [uncertain:
    been able to] write, at this moment I receive


    while writing, I must


    go again to Nysa


    Blizanów


    the 20th of November 1811.


    faithful and most humble servant


    v Triebenfeld'

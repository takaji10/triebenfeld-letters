- page: 2
  en: 'Sandrelzki holds the Pila estates at 250000 Rthl; 125000 Rthl of debts stand upon them, leaving
    125000 clear; consequently Sandrelzki receives (if the matter goes thus) a further 25000 Rthl, which
    he wants at once in cash, and this Weigel would have to provide; something towards it could also be
    taken from the Zagorowo arrears once the lawsuits are [uncertain: taken]. In any event Weigel receives
    by this route 100000 Rthl. On Zagorowo he has 52500 standing. Stossel remains owing to be compensated.
    20000. Weigel would still have to receive 17500 Rthl.


    Makes 190000 Rthl. Stössel must, as the plan under A shows, take the Zagorowo estates. But he demands,
    as Leopold Wartensleben says, that Russinowitz be taken along with them, because both families wish
    to move out of [uncertain: Schlimmeraus] and into Poland. In this way Stössel receives, if he really
    has so much to claim, 280000


    which amounts to


    470000 Rthl. These are covered: 1. For Zagorowo


    30000


    2. For Weigel, entered there, 12500. 3. Through Blizanow or Pila 10000. 4. By the additional payment
    of the 17500.


    Makes


    470000 Rthl. If all this goes happily and is brought to an end, then after these days'' work I shall
    come to you, best of Princes, and live and die with you — the 100000 Rthl, as well as what I have
    already given on account and for [text lost] you will repay me thereafter in instalments, so that
    it falls burdensome to me, to you, and to Prince August. With most faithful attachment and the deepest
    reverence I remain, until death,


    Your Serene Highness''s — May Your Serene Highness be pleased to send the papers back to me; I have
    [uncertain: kannen] letter. This moment I am at my writing; I must go to Neisse again.


    Blizanow


    the 20th of November 1811.


    most faithful and humble bondsman v Triebenfeld'

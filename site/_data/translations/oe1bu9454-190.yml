- page: 2
  en: His Serene Highness is ready for this, and hereby calls upon you to act in the same manner; and
    I should not know your magnanimous, freely giving heart if you were not willing to meet the Prince's
    wish in this respect, if it is at all possible. In order to bring this about, it is left to Your Right
    Honourable, by the transmission of the draft form of the consent to His Serene Highness, to bring
    the said Glenck at last to silence. His Serene Highness wishes it also for the sake of this man's
    never-ceasing songs of lamentation, which arrive with every post-day. Should Glenck once again decline
    the conditions which may be necessary
  names:

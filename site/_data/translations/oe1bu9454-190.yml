- page: 5
  en: 'for an arrangement, as has already happened, then of course nothing remains but to let him fall
    into the ruin which his swindling spirit has prepared for him. My boundless confidence in Your Right
    Honourable, and, I may say, the kindness which you have always shown me, and which has always inspired
    me with true pride and assurance in myself, brought forth these expressions, and I may hope of you
    that you will not take them ill. With boundless veneration


    Öhringen


    the 10th of April


    1806.


    A Hahn'

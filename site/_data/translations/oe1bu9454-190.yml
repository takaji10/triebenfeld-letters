- page: 4
  en: value, since I foresee a piece of good fortune here if I can hold it for a while longer; and to
    that end it belongs that, by producing the consent, I get Ribbek out of the purchase of Wrąbczyn and
    can leave this estate to a better man. My family needs this protection
  names:

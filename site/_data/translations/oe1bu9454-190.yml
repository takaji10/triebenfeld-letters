status: draft
segments:
- page: 1
  en: Subsequently I am, by command of His Serene Highness the Prince, to send Your Right Honourable the
    enclosed carte blanche for a reply to Mr. von Rewek[illegible]; may you have the kindness to have
    it drawn up according to your own view. I also enclose herewith the extract from a letter of the mining
    councillor Glenck, as His Serene Highness has commanded me. The folly of this man, his ever-active
    but all the more senseless spirit of speculation, his frivolity and his lady wife have brought him
    to the edge of the abyss, on which he in truth stands. It remains reserved both to the magnanimity
    of the Prince and to that of Your Right Honourable whether you will once more extend to him the hand
    of rescue.
  names:

segments:
- page: 1
  en: '190 By way of supplement I am, on the command of His Serene Highness the Prince, to send Your Right
    Honourable the enclosed charta blanche for the reply to Mr von Rewen[uncertain: Rewen], which you
    may be pleased to have made out according to your own view of the matter. I also enclose herewith
    the extract from a letter of the mining councillor Glenck, as His Serene Highness has commanded me.
    The folly of this man, his ever-active but all the more senseless spirit of speculation, his frivolity
    and his lady wife have led him to the brink of the abyss, on which he truly stands. It now rests with
    the magnanimity both of the Prince and of Your Right Honourable whether you will once more extend
    to him the hand of rescue.'
  names:
  - de: Rewen[?]
    en: Rewen

- page: 3
  en: 'Extract from the letter of Glenck


    dated the 22nd of March[illegible] 1806.


    In the straits into which the little Wrąbczyn estate and the evasion of payment have put me, I have
    had to take refuge in pawning my belongings, in selling clothes, and in borrowing a few thalers at
    a time. My dismissed servants have cried the noise about still further, and since the public too was
    brought to the opinion that I stood without consequence with Your Serene Highness, there followed
    a total [uncertain: Wlisd] credit upon me; my numerous creditors grew loud, and day by day I had to
    do nothing but scrape about to borrow, to avert the suits at law, and to seek to borrow the most necessary
    household requirements, since I had to give up my salary for payment of debts, properly speaking as
    brokerage. Thus I have saved Wilhelmsruhe from the attestation and from a low sale, so that out of
    duty toward [uncertain: the Menngen] I must delay the sale until such time as it will fetch a higher'

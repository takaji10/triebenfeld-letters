- page: 2
  en: His Serene Highness is ready for this, and hereby calls upon you to act in the same manner; and
    I should have to be ignorant of your magnanimous and readily giving heart if you were not willing
    to comply with the Prince's wish in this respect, should it be in any way possible. In order to bring
    this about, it is left to Your Right Honourable to bring Glenck at last to silence by sending the
    draft of the consent to His Serene Highness. His Serene Highness desires it, also for the sake of
    this man's never-ceasing lamentations, which arrive with every post day. Should Glenck refuse the
    conditions that may be necessary
  names:
  - de: Glenck
    en: Glenck
    kind: person
- page: 3
  en: 'Extract from Glenck''s letter


    dated 22nd March 1806. In the straits in which the Wrąbczyn estates and the evasion of payment place
    me, I have had to take refuge in pawning my belongings, in selling clothes, and in borrowing small
    sums of a few thalers. My dismissed servants have cried the uproar abroad still further, and since
    the public too was brought to the opinion that I stood of no account with Your Serene Highness, there
    followed a complete [uncertain: Wlisd] of credit for me; my numerous creditors grew loud, and day
    after day I had only to go about [uncertain: räumen nun] to borrow and to avert the actions at law,
    and to seek to borrow the most necessary household requisites, since I had to give up my salary for
    the payment of debts, properly speaking as brokerage. Thus I have saved Wilhelmsruhe from the [uncertain:
    Subtestation] and from a low sale, so that out of duty towards my own people I must delay the sale
    until such time as it will fetch a higher'

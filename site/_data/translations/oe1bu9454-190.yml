- page: 5
  en: 'for an arrangement once again, as has already happened, then nothing will of course remain but
    to let him [uncertain: vollen] into the ruin which his giddy spirit has prepared for him. My boundless
    confidence in Your Right Honourable, and, I may say, the favour which you have always shown me, and
    which has always animated me with true pride and assurance in myself, have brought forth these utterances,
    and I may hope of you that you will not take them ill. With boundless veneration


    Öhringen


    the 10th of April


    1806.


    A Hahn'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord, I have had the honour to receive here, together
    with the enclosures, Your Most Serene Highness''s gracious letters of the 8th and 18th of April. Since
    the content of the former concerns chiefly the complaint of the Jew Nathan Luipmann, I reply thereto
    most obediently that his item is already entered in the Designation of all the liabilities known to
    us which was transmitted to Your Most Serene Highness; and that this Jew, as well as all the creditors,
    shall be satisfied if Providence advances my endeavours. At present nothing can be done but to hold
    all these matters off in this way. Upon the dismemberment monies, which amount to some 60000 Rthl,
    I cannot reckon so quickly, because these are likely to come in very slowly. Thus, to meet the costs
    and to pay the interest, I must still continually borrow other counsel [uncertain: Rathschaft] and
    monies for a short term. Since, however, the Betschen affair is now entirely concluded, the people
    must accordingly now pay, after deduction of the 6000 Rthl for Eichaust, 2000 Rthl; likewise Raven
    must render 1200 Rthl of laudemium dues - these come to only 3200 Rthl. To this I shall see what can
    be gathered in against Johann out of the estates in rent, interest and entry-monies, so as to bring
    together the 30000 Rthl in full, for from the other monies, which are to be procured for the discharge
    of the debts in treasury notes, nothing is to be taken. As regards the matter with the Michaelis censured
    in the 2nd letter, this no longer concerns Your Serene Highness at all, and besides, this is now paid
    by the Betscher'
- page: 2
  en: 'subjects pay. The business of the miller in Posen, for which 1 Rthl. 7 Rthl must be paid, is entirely
    unknown to me, and it is a proof of how ill Your Serene Highness''s mandataries serve you - could
    I be everywhere at once, no absurdities of this kind would occur. Herr von Raven''s letter is much
    like a piece of knavery - the consent he shall have, if the communes have nothing against it, only
    the fellow refuses to pay the Laudemien, and if he does not do so, then the communes, which must now
    be responsible for everything, will demand the estate back and pay the value themselves. The Glenck
    affair I have already most obediently reported to Your Serene Highness in my last, and given my opinion
    upon it. Next Sunday, that is the 11th inst., Pochammer is invited to Steglitz to the [uncertain:
    Herr G. Gab: Rath Beym], and the matter of the loan is to be discussed. It is a sad thing that everything
    drags on so long; thus one has the valuation only once more to Kalisz, where the Chamber is to draw
    up the attestation and the declaration tables after the approbation, and to deliver them into my hands.
    Meanwhile I must sit here to no purpose and wait. God grant that the matter be once brought to an
    end, for I set aside all my [illegible] and yet live to see the most unthinkable misfortune. In deepest
    reverence I remain, until death, Your Serene Highness''s Berlin, the 8th of May 1806 most faithful
    servant [signed] v Triebenfeld'

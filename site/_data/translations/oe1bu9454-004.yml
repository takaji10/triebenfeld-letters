- page: 1
  en: 'Most Serene Prince


    Gracious Lord The Napoleonic business is making a dreadful sensation here, and the heavens threaten
    daily with clouds more heavy with storm — Meanwhile one has [uncertain: one] will France all the [uncertain:
    basilisk] that has broken forth trodden on the head — Others again maintain that Bonap[arte] finds
    much of a following and daily further [uncertain: forward] Grenoble and Lyon are already in the power
    of the wicked disturber of the peace, now he is said to be already some 30000 men strong and to have
    taken to himself the whole of the ordnance that stood in Grenoble. Soult le terre and Bertherand are
    his greatest adherents — Upon the heads of these rebels great sums have been Upon Napoleon''s they
    have set 10 million francs, on the part of the set.


    Government set, and Massena has promised to pay 3 million francs out of his own fortune towards it
    — It is believed that this will avail the most.


    Court Councillor Barbe, who most respectfully commends himself to Your Serene Highness, will shortly
    send his servant thither to Schlawenschitz, who is to go from there with my horses to Switzerland
    and fetch his sister, whose husband is being appointed in Berlin in the bureau of E. H.; He and I
    beg that Your Serene Highness might have a really good wicker waggon given out there, over which,
    however, a [uncertain: dritchene] tarpaulin must be made, with which the servant can go thither and
    fetch his sister. — Do let this happen — for it will certainly make it up to you — also the 3 Court
    Councillors from the H[ohenlohe] bureau, Kraibe, Heym and Philipsborn, have several small crates of
    glass lying at Prague, which is to be conveyed to Schlawen-'

- page: 3
  en: 'here from now on there is ebb and flood in news at one moment [uncertain: bäut] word that Napoleon
    has been captured — in the following hour he has already marched into Paris with 100000 men, and so
    the reports shape themselves, according as the Jews and stock-jobbers find it suited to their convenience.
    What meanwhile excites the apprehension of the Most High Lords here are Bonaparte''s appeals to the
    commonest class of men — properly to the rabble; to these he makes great promises and pledges them
    all the riches and possessions of the world — It is indeed feared that this may procure him some beginning
    and From Poland one would gladly have very certain news how that nation there is thinking. An innocent
    Pole said here yesterday / Ah God be thanked our redeemer is not [illegible] / She is said to be quite
    mad with joy. What will the Grand Duke now be doing with his 40000 men.'

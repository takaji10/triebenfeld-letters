- page: 2
  en: 'schl. [Schlawenschitz], they have a free pass for it — so may Your Serene Highness deign to give
    a [illegible] with 2 horses to fetch the glass to Schlawenschitz. To my two fellows, the drummer and
    the coachman, give a pass, that they may return to Blizanow — It might be that Your Serene Highness
    could make use of the coachman out there.


    That these men Barbe, Philipshorn and Heym will again bring about something good, that, gracious Lord,
    you may believe — for otherwise they would be ashamed to ask all this; within a few days I am to learn
    something very good in a couple of matters — There will then be time 3) enough to tell it to Your
    Serene Highness.


    Were it possible in the world, send Eberhard here — for it is possible that he may settle the matter
    as he says — the [uncertain: Damm] need and seek monies Eberhardt writes just now that I should procure
    that the Chancellor have him summoned, give him a pass for relay horses and pay his travelling costs.
    — O heaven, what do people imagine — I have many a friend, but I could [uncertain: alsiren] and yet
    should see no [uncertain: Dicelten] or costs — To give is here called more blessed than to take Full
    of longing I await the news whether Eberhard will come or not Just so I heartily wish to learn what
    J Augeit has done in respect of the power of attorney — for now the gauntlet is thrown down and the
    fight must be fought out honestly.


    For the rest, Your Serene Highness has not answered us, whether you, should that case arise / would
    indeed wish [uncertain: yourself] thither as administrator — Certainly one will call to mind a man
    who is to direct everything there Your Serene Highness still owes me some blank forms — they are all
    gone save the one at the Emperor''s — and I could now use some with the highest advantage. This would,
    however, have to be done very fully I hope my thousandfold thereto, and trouble shall nevertheless
    be rewarded. In deepest respect I remain, until death,


    Your Serene Highness''s


    faithful and obedient servant


    Vienna, the 19th of March 1815 – Now come after Eberhard


    v. Triebenfeld'

- page: 2
  en: '-ice. They have a free pass for it — so may Your Serene Highness be pleased to give a [uncertain:
    cart] with 2 horses to fetch the glass to Sławięcice. To my two fellows, the drummer and the coachman,
    give a pass that they may return to Blizanow — It might be that Your Serene Highness could make use
    of the coachman there.


    That these men, and Barbe, Philipshorn and Heym, will again do some good turn, you may believe, most
    gracious Lord — for otherwise they would be ashamed to ask all this. Within a few days I am to learn
    something very good in a couple of matters — There will then be time 3) enough to tell it to Your
    Serene Highness.


    If it were possible in the world, [uncertain: send] Eberhard here — for it is possible that he may
    settle the matter as he says — the ladies need and seek monies. Eberhard writes just now that I should
    procure that the Chancellor should have him summoned, give him a relay pass and pay his travelling
    costs. — O heavens, what do people imagine — I have many a friend, but I could [illegible] and would
    still see no [illegible] or costs — To give here means, be more blessed than to take. Full of longing
    I await the news whether Eberhard will come or not. Just so I heartily wish to learn what Prince August
    has done in respect of the power of attorney — for now the gauntlet is thrown down and the fight must
    be fought out honestly.


    For the rest, Your Serene Highness has not answered us, whether you, should that case arise, would
    wish yourself there as administrator — Assuredly one will call to mind a man who is to direct everything
    there. Your Serene Highness should send a few blank forms along as well — they are all gone but the
    one at the Emperor''s — and I could now use some to the highest advantage. But this would have to
    be done quite entirely. I hope my thousandfold thereto, and the trouble shall nevertheless be rewarded.
    In deepest respect I remain, until death,


    Your Serene Highness''s


    faithful and obedient servant


    19th March 1815


    Now come after Eberhard


    v Triebenfeld'

- page: 3
  en: 'Here there is henceforth an ebb and flood of news: at one moment [illegible] the report that Napoleon
    has been taken — in the following hour he has already marched into Paris with 100000 men, and so the
    reports shape themselves, according as the Jews and stock-jobbers find it agreeable to their convenience.
    What meanwhile excites the apprehension of the Most High Lords here are the Bonapartist appeals to
    the commonest class of men — properly speaking to the rabble; to these he makes great promises and
    pledges them all the riches and goods of the world — It is feared indeed that this has won him some
    following, and one would gladly have very sure news out of Poland, how this [uncertain: Na[v?]e] thought
    there. An innocent Pole said here yesterday, Ah God be thanked, our redeemer [uncertain: draws near]
    / She is said to be quite mad for joy. What will the Grand Duke now do with his 40000 men?'

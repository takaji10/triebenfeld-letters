  en: '4


    Most Serene Prince


    Most gracious Lord. The Napoleon affair is causing a grievous sensation here, and the heavens threaten
    daily with clouds more heavy with storm — Meanwhile one [uncertain: hopes] France will crush the head
    of this basilisk that has broken forth — Others again maintain that Bonap[arte] finds much of a following
    and daily advances further. Grenoble and Lyon are already in the power of the wicked disturber of
    the peace; by now he is said to be some 30/m men strong and to have taken to himself the whole of
    the artillery that stood at Grenoble. Soult, Lefebvre and Bertrand are his greatest adherents — Great
    sums have been set upon the heads of these rebels. Upon Napoleon''s head 10 millions of francs have
    been set on the part of the government, and Massena has promised to pay 3 millions of francs out of
    his own fortune in addition — It is believed that this will bear the most fruit.


    Court Councillor Barbe, who most respectfully commends himself to Your Serene Highness, will shortly
    send his servant thither to Sławięcice, who from there is to travel with my horses to Switzerland
    and fetch his sister, whose husband is being appointed in Berlin in the Bureau of H. E.; He and I
    beg that Your Serene Highness might be pleased to have a really good basket-wagon given there, over
    which, however, a ticken awning must be made, with which the servant may travel thither and fetch
    his sister. — Do let this be done — B[arbe] will assuredly make it good to you — also the 3 Court
    Councillors from the H. Bureau, Barbe, Heym and Philipsborn, have several little cases of glass lying
    at Prague, which is to be conveyed to Sławięc-'

- page: 2
  en: 'be sent to it." I have the honour to remain, with sentiments of the most deeply founded reverence,
    Your Excellency''s most obedient servant, F[riedrich] L[udwig] P[rince] of Hohenlohe.


    Wrocław, 30 Nov. 1800


    Right Honourable Sir; Most Highly Honoured Lord Grand Chancellor! Your Excellency will forgive me
    if I take the liberty of accompanying my petition with these few words.


    My trust in Your Excellency''s goodwill towards me is far too great for me not to look forward with
    complete confidence to the granting of my most urgent request: "that Your Excellency might deign kindly
    to give orders in accordance with the contents of the petition".


    The following reasons have moved me to my request,'

status: draft
segments:
- page: 1
  en: 'The South Prussian Government at Poznań most humbly submits a copy of the cabinet order of the
    11th of this month in the case of Michalina von Prusimska against the Prince of Hohenlohe-Ingelfingen.
    In the case of Michalina von Prusimska against the Prince of Hohenlohe-Ingelfingen we do not fail
    most humbly to send Your Royal Majesty, enclosed, a copy of the cabinet order of the 1st, received
    the 7th of this month, with reference to our most humble report of the 18th of last month, for Your
    Majesty''s most exalted inspection, with the observation that the hearing for taking the evidence
    and for the closing proceedings in this case is set for the 22nd of this month. Poznań, 10 July 1800.
    The Government Danckelman


    v Götz


    Dühring


    Hering


    Fromme


    Diederichs


    Dannenberg


    Bormann


    v Fischer


    Leuchert


    Richter


    Herford


    [Written by the receiving office:]


    27 July 1800. To the files. Berlin, 1 Aug. 1800 G[oldbeck]


    h qu[illegible] B


    B. 3,681. 6,027.'

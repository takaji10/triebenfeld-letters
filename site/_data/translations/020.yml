status: draft
segments:
- page: 1
  en: 'Most humble Pro Memoria. From the enclosed letter of the Privy Councillor Amelang Your Most Serene
    Highness will deign to see that yet again a new Cabinet Order has been issued, that one must now,
    entirely contrary to the Land Law and the old statutes, absolutely pay in Courant, even though the
    valuta was given only in paper. This blow falls hard and occasions a loss of 1500 Rthl in the von
    Lahr affair. Payment must now, according to the aforesaid Cabinet Order | which was given solely in
    favour of the Jews and usurers, be made absolutely in cash Courant. But where is it to be got from?
    I am brought low and cannot help myself; for even now a sequestrator sits in my Kontopp estates -
    I must stand at a distance, and may not approach my own hearth; indeed I risk every day being taken
    up on account of the 3000 Rthl and arrested anew by the van der Lahr, which disgrace, however, I fear
    more than death. In this distress, to forestall misfortune, I have today written to Amelang in the
    name of Your Serene Highness, that he should come to an agreement in this matter with the van der
    Lahr, that he should offer the von der Lahr one thousand 4t in cash money, and 350 Zentner of iron
    at 6 Rthl delivered by the end of April. I hope the usurer will accept the offer; I am writing on
    that account in the name of Your Serene Highness to the von der Lahr himself. The 1000 Rthl I will
    raise and remit, so that it may not fall too heavily upon Your Serene Highness. But may the Same then
    have the grace and send me 950 Zentner, and if it can be, 1000 Zentner in full, by about the 20th
    of April here to Kontopp; I shall at once convey everything from here to Berlin, send Michaelis the
    600 Zentner and to von der Lahn as much as falls to him. For the costs amount to a great deal still,
    and grounds I have of them not a few, as now the Zagorow ones, which for the drawing up of all powers
    of attorney [uncertain: Weise] costs of the Hawich, Hecker and of the justice-burgomaster Schnee of
    Neufeln with his actuarius have amounted to the 163 Rthl in cash Courant. Should Your Serene Highness
    send me meanwhile the 1000 Zentner of iron, then I shall bring everything into the clear, and one
    may with courage, as the enclosed report shows, begin a new life and course; in the contrary case,
    however, if Your do not effect this, I must, like a bird upon the roof, and now constant incarceration
    from the'
- page: 2
  en: 'van der Lahr, and thereafter from the 1st of May onward also from Michaelis, fear. Meanwhile I
    hope in God that Your Serene Highness will grant my request and also approve this resolution taken
    in the utmost distress, and likewise that the van der Lahr will accept the offer made in the name
    of Your Serene Highness. I therefore send this letter, since it will afford Serene Highness some peace
    in respect of Your Polish possessions, and at the same time comprises the urgent request for the relief
    of my sufferings, by express; may the Same have the singular grace to send me by the messenger Your
    consent, but above all the reassuring news whether the 950 or 1000 Zentner of bar and hoop iron can
    be here at my [uncertain: Royadler] landing-place by the 20th of April, so that I need not creep away
    into the woods, but may act freely and with courage. Your Serene Highness loses little thereby, for
    You do after all receive back the sum assigned to me by the French General Government out of the Zagorow
    estates, and then the 1000 [uncertain: Centner] of iron are paid for again - whereas I have already
    lost much, have had to endure arrest and a million vexations over the business, and am in my former
    career so far set back that I can never more redress myself. The General v. Zastrow, who is at present
    staying here on his estates, commends himself to Your Serene Highness''s grace. He is assuredly a
    most loyal admirer of Your Serene Highness. He, as an upright man, maintains in Your cause that You
    did really beat the N. at Jena, only that You were forbidden by high command to let the Gen. B. advance
    with the cavalry, and that thereby all was lost. It is only a pity that this honest man will have
    to lie in perpetual shade for this truth. When I receive news from Your Serene Highness, so as to
    be able to order everything here accordingly, I shall go at once to [uncertain: Wun] and shall naturally
    lay myself personally at the feet of the Same at Schlawenschitz. Kontop, the 7th of March 1809. v
    Triebenfeld'
- page: 3
  en: 'Copy of the letter to the banker Herr van der Lahr, Your Right Honourable, in Berlin.


    Right Honourable Sir, Highly Honoured Herr Banker,


    Your Right Honourable has had the goodness, in my affairs, to advance to the Herr Councillor v. Triebenfeld,
    against a bill of exchange made out by him and by the Herr General and M. v. Zastrow to You, 5260
    Rthl at par, which are promised to be repaid in Courant. Herr v. Triebenfeld has already repaid You
    thereon 2260 Rthl of the capital and 153 Rthl of interest, and there remain still 3000 Rthl and upon
    this the interest from July onward outstanding. It would run quite contrary to my manner of gratitude
    were I to allow that the Herr v. Triebenfeld should suffer or have any unpleasantness for the sake
    of this matter. I therefore request You in friendship to release the Herr von Triebenfeld ex nexu,
    to lift the suit against him soon, and to accept the payment of the debt from me. I offer to pay You
    at once 1000 Rthl and the remainder by the end of April; and if You will let my request be wholly
    granted, then take from me (since it is very hard to obtain cash Courant) 350 Zentner of good bar
    and hoop iron at 6 Rthl, which I most solemnly assure You I shall send You at once from my ironworks.
    The Herr Privy Councillor Amelang is empowered by me to negotiate this matter with You and to conclude
    it with You, and to give me the speediest news thereof, so that I may then immediately remit the 1000
    Rthl, and also have the iron packed and forwarded by water. I shall regard Your consent to this my
    request as a proof of Your friendship, and for it shall ever remain with true high esteem, as in blank
    to Ho. Your


    Schlawenschitz, the 7th of March 1809'

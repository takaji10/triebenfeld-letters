- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! About an hour ago I arrived here. The interest
    of my exalted Serene patron bids me for the present still to keep the conclusion from myself [uncertain
    reading: "den Schluß von mich zu weisen"] and to report to Your Most High self, my most gracious Prince,
    that which I have here to hand — The first is the enclosed letter from T. — According to this letter
    the King comes with K2 now quite certainly; in this regard I am not going to Berlin — but instead
    I shall work here, and tomorrow still send wine and fowl-game to B to T, so that a good deal may be
    discussed and set in train at the farewell banquet — According to a note of Herr v. M lying here,
    it is believed that Hardenberg too will come with the King; this, however, I think I must call into
    doubt, since T makes no mention of it. Be that as it may — Were both of them to come, it would please
    me doubly — From the mouth of 2 and 3 witnesses, according to the general laws, the truth is to be
    confirmed. Meanwhile I seek to play the part of forestalling; for I beg T so above [uncertain reading]
    that he absolutely take Hardenberg along as one of the party to the farewell banquet, and lead all
    the water onto our wheels. Since I am now not going to Berlin, I shall, if I am in any way in the
    world able to bring it about, ride off again to Zagorowe, in order there in haste to give the matter
    such a form that neither evil nor good beings shall be in a position to raise anything against the
    principal matter. The strength for the good will shall be granted me by God''s assistance for this
    reason, because I truly hope to sell my mill in [uncertain reading: "Schweinere"] the day after tomorrow
    for 6000 Rthl in cash money, and also still to obtain a couple of thousand of the arrears of the time
    from my subjects — for with a common soul nothing counts nowadays but jingle-jangle — or the money-bag;
    whatever I shall find in the rush from Poland, that I shall lay at Your Serene Highness''s feet by
    the next post. To Your Serene Highness''s benevolence I commend myself; to the fairest of Princesses
    now living, Emilie, at [uncertain reading: "Bütern"], and to the Illustrious Hereditary Grand [uncertain
    reading: "Erbgroßen"] Albert I commend myself in the most respectful manner, and I remain, until death,
    in deepest esteem Your Serene Highness''s — Breslau, the 19th of August, at 12 o''clock at night,
    1810. Faithful most humble and obedient servant v Triebenfeld'

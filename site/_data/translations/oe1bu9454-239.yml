- page: 2
  en: 'would not recognise it at all; however, they have had to submit, and he now stands in Berlin —
    the corps which went to Hanover, in order to disembark at Emden, will now also remain without effect,
    or even be cut to pieces, for Napoleon has hastened to Paris — the good old men, and in part the clever
    ones, prophesy nothing much that is good.


    From here [uncertain: unß] everything away and to its post; tomorrow the Government also departs for
    Ząbkowice Śląskie — Merckel was here — and sets out thither some [morning] early — the post, or the
    courier service, was re-established 8 days ago already — I therefore send this letter by the post.
    General Gneisenau is at headquarters, and Mr Valentini too — I must go today to Neustad, to General
    Ortel / whose plan has my approval / and as soon as I return from there I go to Ząbkowice Śląskie
    etc. Minister Hardenberg [uncertain: sucht] very much in the opinion of all goodness — may Your Serene
    Highness deign to tell Mrs von Hahn that her letter has been forwarded to Wrocław — likewise I have
    delivered the one to the Chief Forest Master von Kleist, who however was travelling, to his wounded
    son — It is in deepest reverence that I remain, until death, Your Serene Highness''s


    Nysa


    19 June 1813


    humble and obedient servant


    v Triebenfeld'

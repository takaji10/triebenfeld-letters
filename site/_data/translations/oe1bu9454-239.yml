- page: 1
  en: '239


    Most Serene Prince


    Most gracious Prince and Lord, my podagra hindered me from reaching Nysa until the day before yesterday;
    in the night, because the road was bottomless, I had to bivouac under the open sky behind some stones,
    and as it rained so frightfully I exposed my foot entirely to the dripping water — the pain grew less
    by degrees, so that today I have already forced the boot on — the King was here 3 days, and drove
    off just as I arrived here [uncertain: mich Holz ab] in order to go in that neighbourhood to Teplitz,
    where the Russian Emperor is with his sister; it is said that Emperor Franz would also arrive there,
    but thinking men doubt it — so far as one knows here, and is ill assured to the highest [uncertain:
    eodem], Austria does [uncertain: bitt] not [accede] — everything is beginning to grow lukewarm, yet
    it promises to remain entirely neutral, wherefore also in the Austrian state the signs of neutrality
    have everywhere been publicly posted and made known — the combined Powers have been frightfully [uncertain:
    duplirt] by the armistice — Bülow and Czerniszeff'

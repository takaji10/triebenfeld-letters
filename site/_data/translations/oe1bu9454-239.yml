- page: 2
  en: 'would not acknowledge at all; meanwhile they have had to submit, and he now stands in Berlin -
    the corps that went to Hanover, to disembark itself at Emden, will now likewise remain ineffective,
    or even be worn down entirely, for Napoleon has hastened to Paris; the good old men, and in part clever
    men, prophesy little good. From here everything goes off and to its post; tomorrow the government
    too departs for Franckenstein - Merkel was here - and sets out thither early in a few [days] – the
    post, or the courier service, was re-established 8 days ago already - I therefore send this letter
    by the post. General Gneizenau is at headquarters, and R. Valentini also - today I must go to Neustad
    to General Ortel / for my plan has met with approval / and as soon as I return from there I go on
    to Franckenstein etc. Min Hard: seeks, in the opinion of all, much good. May Your Serene Highness
    deign to tell Madame von Hahn that her letter has been forwarded to Breslau - likewise I handed over
    the one to Chief Forest Master von Kleist, who however was away travelling, to his wounded son - It
    is in deepest reverence that I remain, until death, Your Serene Highness''s


    Neisse


    19 June 1813


    humble and obedient servant


    v. Triebenfeld'

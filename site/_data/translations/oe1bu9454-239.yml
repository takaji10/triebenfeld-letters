segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    My gout hindered me the day before yesterday from getting as far as Neisse; in the night I had to
    bivouac under the open sky behind stones, because the road-bed was bottomless, and as it was raining
    so frightfully I exposed my foot entirely to the drip — the pain grew gradually less, so that today
    I have already pressed on the boot — the King was here 3 days; just as I arrived here he drove [uncertain:
    wood] off, to go into the district towards Topliz, where the Russian Emperor is with his sister; it
    is said King Franz would also arrive there, but thinking men doubt it – so far as one knows here,
    and it is ill assured to the highest eodem, Austria is not acceding – Everything is beginning to grow
    lukewarm, yet it promises to remain entirely neutral, and therefore in the Austrian states the signs
    of neutrality have everywhere been publicly posted up and made known - the Combined Powers are frightfully
    duplicated by the armistice - Bülow and Czerniczeff'

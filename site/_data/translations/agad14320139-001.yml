- page: 1
  en: '[To His] Reverence the General Superintendent

    of the Warsaw Evangelical-Augsburg

    Consistorial District.


    The Pastor-Administrator [of the]

    Evangelical-Augsburg [congregation of]

    Zagórow.


    In consequence of [Your Reverence''s] order

    of the 30th of October [text lost],

    No. 267, I have the honour to submit the following annual report

    concerning the parish of Zagórow.


    I. Church affairs.


    a.) External church affairs.– The congregation of Zagórow possesses a brick-built church; for its
    complete furnishing it still lacks a baptismal font, an organ and bells.– Both the parsonage and the
    cantor''s house are very small and low, and in very poor condition.– The schoolroom is adequately
    spacious for the number of children.– Besides the religious school in Zagórow there are 7 more schools
    combined with prayer houses in the congregation, among them only one elementary school, at Michalinowo.–
    The number of children in the 8 schools of the congregation may come to about 240.– There is no separate
    dwelling for the sexton[?].– As for the cemeteries, of which there are 8 in the congregation, they
    are [text lost] in good condition and provided with crosses.–


    b.) Inner church affairs.– Church spirit and church attendance satisfactory.– Baptisms are mostly
    performed by the pastor.– Open despisers of the Lord''s Supper: none known.– The number of communicants:
    men 726, women 871, total 1597, [text lost]'
- page: 2
  en: '[text lost] 45 more.– [uncertain: A demand] for still more schools [text lost] is not present,
    since almost every larger colony has a [text lost].– For the mission to the heathen, 10 roubles 71
    kopecks were [collected] in the course of the year at the mission services, which the Pastor-Administrator
    sent on to Superintendent Pastor Manitius at Warsaw.– Morality and domestic life are in general very
    satisfactory.– Baptists, Irvingians or other sects there are none.– Particular vices[?] in the congregation
    are [not] present. Conversions to other confessions do [not] take place.–


    Remarkable events.– None have taken place.–


    Number of confirmed.– Boys 36, girls 31, together 67.–


    Candidates living in the congregation.– None.–


    Collections.– For the benefit of the congregation itself nothing was collected, but for other purposes
    the following: 1.) For the support of grammar-school pupils who intend to study theology, [text lost]
    4 roubles 61 kopecks, which the Pastor-Administrator sent to his High Consistory at Warsaw.– 2.) For
    the widows'' and orphans'' fund 2 roubles 36 kopecks were collected, and the same sent [text lost]
    to Superintendent von Boerner.–


    E. Erdmann

    Pastor'

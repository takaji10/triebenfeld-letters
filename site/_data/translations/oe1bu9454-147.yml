- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    I have completed the most toilsome journey I have ever made in my life, into West and East Prussia.
    The Mennonites are willing to build and have assured me, in their fashion, that with some money they
    will arrive in Breslau on the 19th of December and there conclude the contract. I could have drawn
    up heads of agreement with several of them on the spot, only it would have been too little for me,
    in one spot, since these people dwell singly, scattered about, and I could not bring them together,
    because the weather was too bad and the roads bottomless. Besides, they expressly wished to have the
    propination rights included in the present valuation, and this moved me to depart and to summon them
    to Breslau.


    Since in the meantime the biblical lawgivers taught — to test all things and keep what is good — I
    have today sent after the Landsberg and Oderbruch people, am having these come, and shall hear their
    proposals [uncertain: effecten] — if these are better I shall conclude at once and commend the [uncertain:
    Mannamsten] to the [illegible]: I am no weakling — but the way to the [illegible] — sons has after
    all become too much for him; I have wrestled with life and death, and in the end the [illegible] made
    new strangling-bands for me — So if these people show themselves willing, I shall conclude and let
    the hypocrites go. There are men beyond number who wish to buy; but I cannot possibly'

- page: 2
  en: 'let myself in for a parcelling-up of the plots, since otherwise the poorer land would in the end
    be left on my hands. The best of it the Olesnica lads and the Swierer have taken away at such low
    prices that it turns many heads; they try this way and that, whether some little gap cannot be found
    through which to press in — I must therefore hold strictly to the plans once drawn up and stay true
    to my principle.


    With the assessment of the estates here, matters go very slowly, for all the good will of the clerk,
    because everywhere the data are wanting — God knows where one is to look for anything — everything
    must therefore be ascertained anew, and a cruel amount of time squandered. In this regard I must remain
    here another 14 days, for if I depart everything will again lie idle.


    In deepest reverence I remain, until death,


    Your Serene Highness''s


    Trąbczyn, the 25th of November


    1804.


    most humble and obedient servant


    v. Triebenfeld'

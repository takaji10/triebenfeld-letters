- page: 3
  en: 'This very moment Glenck was here. He reproaches me grossly for wishing to bring him to ruin in
    his fortune. Your Serene Highness is said to have told him himself. That I had made the highest reproaches
    to Him, that Your Highness had given Glenck too much. Your Serene Highness will most graciously forgive
    me if I, so as not to make my poor children fatherless orphans besides — since I must fairly vex myself
    to death — lay down the pen in all these affairs. Gladly would I win for Your Serene Highness all
    the happiness on earth, and would give up goods and blood for Your Serene Highness — but I will not
    let myself be branded by Glenck and Kochlitz. The people here are all becoming confused — for now
    Glenck has given dispositions here, in part contrary to my own orders — I will not speak out loudly
    about it, for otherwise it might be thought I was pressing myself into his place — meanwhile my honour
    and Your Serene Highness''s interest suffer thereby. The justice-burgomaster Schema begs for early
    instructions as to how to proceed concerning the Trąbczyn lands, because otherwise he cannot go further
    with the assessment; to the manorial lordship (Dominium) there now remain, at [uncertain: Wegberin],
    53 Morgen — so the assessment cannot turn out very high. The bailiwick, however, might now be assessed
    at about 11000 Rthl, for Glenck has applied for an assessment'

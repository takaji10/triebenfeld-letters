- page: 2
  en: 'let myself into a parcelling-up of the plots, for otherwise the poorer land would in the end be
    left on my hands. The Oleśnica [uncertain: Bube] and the Swięcia men have taken the best away at prices
    so low that it turns many heads; they try this way and that whether some little gap cannot be found
    to press in through — I must therefore hold strictly to the plans once drawn up and remain faithful
    to my principle.


    With the assessment of the estates here, matters go very slowly, for all Schenck''s best will, because
    the data are lacking at every turn — God [uncertain: knows] where one is to look for anything — everything
    must therefore be ascertained anew, and a cruel deal of time squandered. In this regard I must remain
    here another 14 days, for if I depart, then everything is left lying again.


    In deepest reverence I remain, until death,


    Your Serene Highness''s


    Trąbczyn, the 25th of November


    1804.


    most humble and obedient servant


    v Triebenfeld'

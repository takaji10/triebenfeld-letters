- page: 3
  en: 'Glenck was here this very moment. He reproaches me grossly, that I meant to deprive him of his
    property. Your Serene Highness is said to have told him yourself that I had most highly reproached
    him, that Your Highness had made Glenck too large a gift. Your Serene Highness will most graciously
    pardon me if I, so as not to make my poor children fatherless orphans besides, since I must vex myself
    almost to death — lay down the pen in all these affairs. Gladly would I win for Your Serene Highness
    every happiness on earth, and one would give up goods and blood for Your Serene Highness — but I shall
    not let myself be branded [uncertain: Laich] by Glenck and Rochlitz. The people here are all becoming
    confused — for now Glenck has given dispositions here, in part contrary to my own ordinances — I will
    not speak out loud about it, for otherwise it might be thought that I was pressing into his place
    — yet my honour and Your Serene Highness''s interest suffer by it. The justice-burgomaster Schenck
    begs for early instructions concerning the Wrąbczyn lands, because otherwise he cannot proceed further
    with the assessment; the manorial lordship (Dominium) is now left with 53 Morgen at Wrąbczyn — so
    the assessment cannot turn out very high. The bailiwick, however, might now be assessed at about 11000
    Rthl, for Glenck has applied for an assessment —'

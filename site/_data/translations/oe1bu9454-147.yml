  en: '147


    Most Serene Prince,


    Most gracious Lord!


    I have completed the most toilsome journey I have ever made in my life, to West and East Prussia.
    The Mennonites wish to [uncertain: purchase] and have assured me in their fashion that, with some
    money, they will arrive in Wrocław on the 19th of December and there conclude the contract. I could
    have drawn up a memorandum of heads of agreement with several of them on the spot, only it would have
    been too little for me, in a single place, since these people dwell singly, scattered about, and I
    could not bring them together, because the weather was too bad and the roads bottomless. Besides which,
    they expressly wished to have the propination rights included in the present valuation, and this moved
    me to depart and to summon them to Wrocław.


    Since, however, the Biblical lawgivers taught — to prove all things and to hold fast that which is
    good — I have today sent for the Landsberg and Oder-Bruch men, am letting them come, and shall hear
    what they can effect — if these are better, I shall conclude at once and commend the Mennonites to
    the H[?]. I am no weakling — but the road to the H. — sons has nevertheless become too [uncertain:
    seinen], I have wrestled with life and death, and in the end the H. made me new strangling-bands —
    So if these people show themselves willing, I shall conclude and let the [uncertain: hypocrites] go
    their way. Of men who wish to buy there are numbers without end; but I cannot possibly'

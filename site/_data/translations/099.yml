status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! My most fervent wishes are still ever only these,
    that Your Most Serene Highness may have arrived at Öhringen right happily and content; the affairs
    which otherwise lie near my heart will certainly be [uncertain: brought to the best conclusion] and
    everything brought to the wished-for goal. Upon the writing submitted at last also [illegible] Zastrow,
    only the enclosed reply has indeed followed; yet I departed with the first assurance from everyone
    that Your Most Serene Highness shall obtain the Krotoszyn estates. Even Herr v. Voss is said to have
    pitched his tone very much lower, and the notorious Nöldichen is hard pressed. [uncertain: Colonel]
    v. Köckritz, who now conducts himself quite tolerably in this matter, says that the conclusion of
    the affair will be entrusted to the 9. f. v. Knobloch and Prittwitz. Here Wildegans can do everything;
    he is the intimate friend of both, and he sees more clearly than many — I have therefore'
- page: 2
  en: 'already so prepared the matter in the writing to Herr Prittwitz that he will take Wildeganster
    as his assistant. On my departure from Berlin everything seemed full of anxious expectation on account
    of the war. Almost everyone held it to be unavoidable, and even the King is said to have shown an
    inclination to strike out with the whole army. The Cabinet Councillor Mencke would not permit Brand:
    to travel away for 10 days, because he believed that important things would shortly come to pass,
    and that even changes in the Ministry might occur. It was also said quite certainly that one or two
    more Cabinet Councillors were to be appointed, for which a couple had already been proposed — this
    is now indeed to be wished for, since then a Cabinet Secretary will no longer be allowed to instruct
    a reigning Prince and first commander-in-chief, nor Ministers and whole Dicasteria either,'
- page: 3
  en: 'when they write to the Sovereign. The draft which the Councillor of War v. Cöln made concerning
    Krotoszyn, and which the King gave to the Cabinet [uncertain: Bey:] all, was handed over by the latter
    to Herr v. Voss — who, however, wrote too [uncertain: haughtily] to the King and moved for the dismissal
    of this man — the O. v. Ko. is greatly incensed at this and holds 13 to be false — He has at once
    so turned the matter that the [uncertain: Löte], as the most honest man, is to be [uncertain: refused]
    to Breslau — this has now turned out better already than anyone could have [text lost] it. For Carl
    Theodor Fischbach at Betschen may it please Your Serene Highness to have the patent as Commission
    Councillor made out. In deepest reverence I remain, until death, Your Most Serene Highness''s — Broniewski
    will surely not be permitted to receive a heller, for now there are witnesses to hand that the fellow
    has already taken more out of the estates than is due to him — I shall now pursue the matter with
    zeal — also well if one here [uncertain: recovers a sum]. Breslau, the 1st of February 1799. faithful
    most humble and obedient servant v. Triebenfeld'

- page: 1
  en: 'On behalf of the Illustrious Chełmski, Treasurer of Wschowa, against the Illustrious Prusimski,
    Starost of Niszczewice — Report to the Tribunal


    Let there be seen at this place, on behalf of the Illustrious Stanisław Chełmski, Treasurer of Wschowa,
    against the Illustrious Magnificent Antoni Prusimski, Starost of Niszczewice, and the Honourable Jakub
    Górski, Boundary Surveyor of Inowrocław — for the Ordinary General Sessions of the Crown Tribunal
    of the Kingdom at Piotrków — the issued Citation Report in the submitted documents.'

- page: 9
  en: 'lead also to [uncertain: decisive] ends, just as to leave me in [uncertain: suspense] is a cruelty.
    God keep you in health; I was ailing some days, but since yesterday it goes better; only my eyes still
    plague me greatly through their inflammation. Hence I make use of a strange hand and dictate this.
    I believe I have overlooked nothing, nor sinned in the matter by any want of fullness. The wish to
    make it also quite [uncertain: intelligible] has led me to an abuse of your patience, and I therefore
    beg you, my esteemed friend, to pardon the length of this epistle. It is with the most excellent esteem
    that I remain Your Right Honourable''s


    Sławięcice, the 4th of December 1811.'

- page: 8
  en: 'has wrung from August the wish to postpone his so necessary coming to a better season of the year.
    I have already written provisionally to him and to Emilie at my sister''s of the reasons why his early
    presence here becomes necessary, and now repeat it urgently by an express courier. Since you take
    such friendly part in everything that concerns me and my little family, I do not fail to report to
    Your Right Honourable that the [uncertain: Hereditary Prince] of Hohenlohe-Kirchberg, who is 1 year
    older than my daughter Adele, sued to me these days for her hand. Since mutual inclination, the necessary
    provision and propriety in every respect are found together in this match, I have given my consent,
    and may hope that the contentment of my three eldest children is now founded as regards their honourable
    connexions. God grant that I may soon obtain peace, [uncertain: as one leaves off] being unjust towards
    me, and then my limited wishes are [uncertain: fully] attained; one of the foremost means to this
    is the achievement of the business here set forth, or some [illegible] early alienation of the Zagórów
    estates suited to my circumstances. You have the liberty to employ Trąbczyn in the bargain, on this
    or another side, if it can be done with advantage, just as I will refuse no useful way of attaining
    the end; everything else being left to your prudence and experience. Do not let me wait long for news,
    for every definite intelligence can'

- page: 7
  en: '- which I expect this very day, and for which reason I am still detaining your messenger - let
    the said gentleman depart thither, who has only to act there with all caution, and to secure that.
    He is then, since he means to make the journey on horseback, to hasten somewhat ahead, in order by
    his report to Your Right Honourable to bring it about that whatever may still be requisite for this
    interview is prepared, wherein much circumspection will need to be employed, since the old general
    is known as sly, mistrustful and avaricious. He is eager to gain, and this [uncertain: covetousness]
    makes him particularly greedy after the largest estates. Withal he is eager to withdraw the ready
    monies from his children, since he does not believe them safe hereafter in their hands, and is of
    the opinion that they would sooner conserve the estates than ready money. Within these last days he
    has further the will to draw in his two sons-in-law as well there, and therefore wishes to bring into
    the bargain the little estate Gollawia, which he recently purchased from the von der Lahr heirs for
    his son-in-law Johnston; since he has paid in only 5000 Rthl, it is not exactly to be regarded as
    a great object. You now know everything I know upon this subject, and Sommer is to communicate to
    you, further, everything he has heard from me and will learn in [illegible], by way of his elucidation.
    Think the matter over ripely and prepare yourself for it in the best manner. I set [uncertain: many]
    hopes upon your savoir faire, and have more confidence in this business than I ever yet had in any
    other. Unfortunately my children are not yet upon the road, and an illness which befell my daughter-in-law'

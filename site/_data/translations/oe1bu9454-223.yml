- page: 9
  en: 'also lead to [uncertain: decisive] purposes, just as to leave me in [uncertain: ignorance] is a
    cruelty. God keep you in health; I was ailing for some days, but since yesterday it goes better; only
    my eyes still plague me greatly through their inflammation. Hence I make use of a stranger''s pen
    and dictate this. I believe I have overlooked nothing, nor sinned in the matter through any want of
    circumstantiality. The wish to make it also quite [uncertain: clear] has led me to abuse your patience,
    and I therefore beg you, my esteemed friend, to forgive the length of this epistle. It is with the
    most particular esteem that I remain Your Right Honourable''s


    Schlawenschitz, the 4th of December 1811.'

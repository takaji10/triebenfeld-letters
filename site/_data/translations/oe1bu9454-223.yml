- page: 1
  en: '223


    Right Honourable Sir, Highly Honoured Councillor of War and Forests! Your Right Honourable''s letter
    of 20 November I received on the 26th, but until today I have had to detain the messenger, who has
    been paid and whom I have also compensated for his stay, in order to acquaint Your Right Honourable
    exactly with certain occurrences which do indeed seem to me worth being turned to account and which
    probably, in your judgement too, deserve preference over other plans. Once I have first answered your
    letter, I shall go into detail upon them so far as appears necessary, partly to portray to you the
    advantageous side of the newer prospect, partly also to set forth the necessity which alone makes
    it a law to seize the opportunity, in order to procure for myself partly ready ringing means and partly
    such objects as are free of debt, and thereby, if only for the moment, to extricate myself from a
    press which almost crushes me, to gain time, and, upon increasing consultation with my children, to
    create air for myself by further reasonable plans to be adopted, so as to be able to subsist in some
    tolerable fashion. That Your Right Honourable will faithfully work to this end as a proven friend
    I perceive with gratitude from your esteemed letter; and were I only quite secure, in the guardianship
    of my son Adolph, of the Koszęcin estates [text lost]'
  names:

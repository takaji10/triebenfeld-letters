- page: 4
  en: 'or abandoned; as for the one concerning Trąbczyn I do not care to ask any more, and I confess that
    my skin shudders when I have only to say that I lack the means for the continuation of these lawsuits.
    All the disappointed hopes have made me as unhappy through the misleading as you cannot imagine. Help
    me therefore, and save what still remains to me in the Polish estates, and thereby preserve our honour
    and our mutual advantage, for which, under your [uncertain: guidance], I am ready to make considerable
    sacrifices. I must confess to you that the situation is such that even any short delay which postpones
    this means of rescue inflicts mortal wounds upon me. I hope that a proposal which has been made to
    me on the part of the von Schimmelpfennig family, and which persons well disposed towards me have
    fostered, may lead to this. The old general and his sons, who were themselves with me, have an inclination
    for the Zagórów estates; he is willing in exchange to give over to me his entirely debt-free estates
    Szelce and Maderzewo, which are not far from Mysłowic on the Przemsa, and gives their yield as 8000
    Rthl Courant. Others who know these estates exactly put it at 6000 Rthl. He purchased them several
    years ago for 26000 # # in Gold, several thousand more Rthl which he is said to have expended upon
    their improvement, and now wishes to bring them above 100000 Rthl. Not long ago he was offered 85000
    Rthl Courant for them, which however he refused. The general''s lady possesses a capital of about
    60000 Rthl in [uncertain: East Prussian] mortgage bonds, and, as the eldest son the'

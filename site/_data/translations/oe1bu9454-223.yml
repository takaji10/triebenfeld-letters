- page: 6
  en: 'but is withal much devoted to you, and looks forward to the early reunion. He will excuse his swift
    departure, to which the pressure of circumstances compelled him. I believe he will be, and is willing
    and able to be, of excellent use in this business; I may believe that by my conduct I have earned
    his attachment, and therefore I beg Your Right Honourable in the most friendly manner to make use
    of him with confidence as a good instrument. I promised him not to leave his faithfully rendered assistance
    unrewarded, and in every event I beg you, good friend, to bring about there as soon as possible, so
    far as can be done, a payment to be ordered to him for his interim reassurance. The manner and way
    I leave to Your Right Honourable, and [uncertain: think] that Lieutenant Sommer, having taken counsel
    with Cabanis upon this, would be able to make you a proposal not injurious to me. I wish it, since
    we thereby bind to ourselves a faithful and highly knowledgeable assistant. Since General von Schimmelpfennig
    [uncertain: intimated] to me that he intends in these days to send his elder son, the cavalry captain,
    to Berlin on account of procuring the monies needed for the purpose, but with his youngest son, who
    is a pupil of Thaer, to undertake the journey to Zagórów soon, in order to view these estates before
    the ground is covered with snow, yet wishes beforehand to speak with the Lieutenant for his own [uncertain:
    instruction], I shall, as soon as the day for his despatch is only fixed'

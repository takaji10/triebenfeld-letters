- page: 3
  en: 'I thank Your Right Honourable meanwhile for your generous intention; I shall certainly be glad
    to hear your grounds upon this matter too, and shall let every reasonable representation find a place
    with me. You find here enclosed both the plans laid with your letter, your own and that of Count Wortens
    [illegible]. I leave it further to you, with regard to my situation and the momentary absolute necessity
    of its relief, to take further cautious steps. I flattered myself until today that I should see my
    esteemed friend here with me, since I cannot think that, if you had occasion to go again to Nüsse,
    you should not have found yourself moved to come to me. Upon all this, exact and circumstantial news
    is needed by me soon for my [uncertain: peace]; that you will work for my welfare according to your
    powers I am gratefully convinced of by you; meanwhile the who? when? where? – and especially how soon?
    – is the greatest need for me to know, and I must tell you that my subsistence depends in great part
    upon it. How grateful I will be to you if I speedily receive reassuring news, upon which I can reckon,
    through this [messenger]; a fairly large sum of ready money is as great a need at Christmas as food
    is for the preservation of life. Your Right Honourable has therefore mortally alarmed me, since you
    report to me the absolute impossibility of soon supporting me with moneys from there as well, and
    the referring me to lawsuits yet to be won can reassure me all the less, since unhappily I have to
    this day seen all of those conducted for me in Poland either [text lost]'

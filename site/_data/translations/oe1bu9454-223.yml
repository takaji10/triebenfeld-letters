- page: 7
  en: 'which I expect this very day, and on which account I am holding back your messenger, let the said
    gentleman depart thither, who has only to conduct himself there with all circumspection, that being
    assured. He shall then, since he means to make the journey on horseback, hasten somewhat ahead, in
    order by his report to Your Right Honourable to bring it about that whatever else may be requisite
    for this interview be prepared, in which much caution will have to be employed, since the old General
    is known as sly, distrustful and avaricious. He is eager to gain, and this [uncertain: fruit] makes
    him particularly covetous of the largest estates. At the same time he is eager to withdraw the ready
    moneys from his children, since he does not believe them safe in their hands in the sequel, and is
    of the opinion that they would sooner conserve the estates than ready money. Since these last days
    he has further the will to draw both his sons-in-law in there as well, and therefore intends to employ
    in the bargain the small estate Gollawia, which he lately purchased from the Lahr heirs for his son-in-law
    [uncertain: Johnston]; since he has paid in only 5000 Rthl, it is not exactly to be regarded as a
    great object. You now know everything that I know upon this subject, and Sommer shall communicate
    to you by way of his explanation everything he has heard from me and will learn in [uncertain: selige].
    Consider the matter maturely and prepare yourself for it in the best way. I place great hopes in your
    savoir faire, and have more confidence in this business than I ever yet had in any other. Unhappily
    my children are not yet on the journey, and an illness which befell my daughter-in-law has itself'

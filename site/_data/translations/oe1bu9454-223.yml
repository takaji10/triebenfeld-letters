- page: 3
  en: 'I meanwhile thank Your Right Honourable for your generous intention; I shall certainly be glad
    to hear your reasons upon this too, and to let every reasonable representation find a place with me.
    You find here enclosed both the plans annexed to your letter, your own and that of Count Wartensleben.
    I leave it further to you, having regard to my situation and to the momentary absolute necessity of
    its relief, to take further cautious steps. Until today I flattered myself that I should see my esteemed
    friend here with me, since I cannot conceive that, if you had occasion to go to Nysa again, you should
    not have found yourself moved to come to me. Concerning all of this I require, for my [uncertain:
    peace of mind], speedy, exact and circumstantial news. That you will work for my welfare to the utmost
    of your powers I am gratefully convinced by you; yet the What? When? Where? - and especially How soon?
    - is for me the greatest need to know, and I must tell you that my subsistence depends in great part
    upon it. How grateful shall I be to you if I speedily receive reassuring news through you upon which
    I can reckon; a fairly large sum of ready money is at Christmas as great a need as food is for the
    preservation of life. Your Right Honourable has therefore mortally alarmed me, since you plainly report
    to me the impossibility of supporting me soon with monies from there as well, and the referral to
    lawsuits yet to be won can reassure me all the less, since unfortunately up to now I have seen all
    those conducted in Poland on my behalf either lost'

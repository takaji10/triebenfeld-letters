- page: 8
  en: 'wrung from August the wish to postpone his so necessary coming to a better season of the year.
    I have already provisionally written to him and Emilie at my sister''s the reasons why his early presence
    here becomes necessary, and I now repeat it urgently by an express courier. Since you take such friendly
    part in everything that concerns me and my little family, I do not omit to report to Your Right Honourable
    that the hereditary prince of Hohenloh Kirchberg, who is 1 year older than my daughter Adele, has
    in these days sued to me for her hand. Since the mutual inclination, the necessary provision and the
    propriety in every respect are found together in this match, I have given my consent, and may hope
    that now the contentment of my three eldest children in respect of their marital relations is established.
    God grant that I soon obtain rest, [uncertain: since] men begin to be unjust toward me; then my limited
    wishes are far attained; one of the foremost means to this is the attainment of the business here
    set forth, or some amicable and early alienation of the Zagorowo estates suited to my circumstances.
    You have liberty to employ Trąbczyn in the bargain, if it can be done with advantage, on this or the
    other side, just as I will not exclude any useful way of attaining the purpose, everything else being
    committed to your prudence and experience. Do not let me wait long for news, for every definite information
    can'

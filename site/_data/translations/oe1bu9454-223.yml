- page: 2
  en: 'then your plan would be excellent; I beg you also not to let it [uncertain: fall], since the welfare
    of the mortgage creditors, who have their funds standing there, lies very earnestly at my heart. I
    shall also apply myself most zealously to further this, and I hope my eldest son and my son-in-law
    will press with zeal toward the attainment of this object. But since this wish can be attained if
    we do not come to terms with Weigel and Stössel even according to Your Right Honourable''s wisely
    laid plan, I must seek my welfare particularly in this, that through the alienation of the Zagorowo
    estates alone I procure means to rid myself of my private debts, which press me most, which then,
    through the arrangement I have now made, shall, as I may hope, soon and desirably be achieved, especially
    if you will in friendly fashion make it your concern to unite your whole strength and negotiating
    talent with mine and to treat upon it with the same intent. I have carefully weighed the plan you
    have just laid before me for the negotiation with Weigel and Stössel, and by no means contradict it.
    But I do not believe that there will be any getting on with Weigel, and if the bargain is not made
    with both gentlemen at once, then it can in no way serve us. The taking on of Ruszynowią would only
    further increase the already too great objects of estates; not gladly would I enlarge the obligations
    I have toward you by the taking in of Blizanow, since I constantly harbour above all the intention
    never to be ungrateful toward you, nor to increase your embarrassments.'

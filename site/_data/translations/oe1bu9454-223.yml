- page: 5
  en: 'cavalry captain, expressed to me, this sum could well be brought together to 100000 Rthl in money
    and at need something more, if one would accept documents or allow him time to call in some capitals.
    He requested of me the maps and valuations of the Zagorowo estates, which I sent over to him, and
    which I have already received back with the expressed wish to bring this business to a conclusion.
    Thus I had also sent him at the same time the rent register, the statement of arrears and remainders,
    as well as the general statement of buildings handed over only in the year b; all this seemed to the
    old gentleman still not clear enough, and it was wished, since various things had already been heard
    about the estates, relying upon my fairness, to have a reasoned and instructive statement which would
    be confirmed upon ocular inspection, upon which alone one would enter, and would then soon conclude
    the matter. [uncertain: Deschent''s] clerk, who came hither to visit a [uncertain: Bally] and presumed
    to find me in better circumstances, and therefore hoped to obtain from me the remuneration due to
    him as having been for a year Your Right Honourable''s co-worker in the business there, was present,
    and I made use of him at a conference with cavalry captain von Schimmelpfennig, in order to set everything
    forth to him exactly and thoroughly. He undertook this commission willingly and skilfully, and drew
    up for my use and my own instruction a reasoned and informative valuation, which I also communicated
    confidentially to Schimmelpfennig. I must do Lieutenant Sommer the justice to say that, while he takes
    our mutual distress and pressing situation nobly to heart, he expresses himself only cautiously, pities
    Your Right Honourable'

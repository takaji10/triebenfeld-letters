- page: 5
  en: 'cavalry captain intimated to me, this sum, indeed a good 100000 Rthl in money and if need be somewhat
    more, could be brought together if one would accept bonds or allow him time to call in certain capitals.
    He asked of me the maps and valuations of the Zagórów estates, which I sent him, and received back
    together with the expressed wish to bring this business to a conclusion. Thus I also had the interest
    register and the statement of arrears and remainders sent along with them, as well as the general
    tableau handed over in the year 6[illegible]; all of this seemed to the old gentleman still not clear
    enough, and, since one had already heard various things about the estates, it was wished - relying
    on my fairness - to have a reasoned and informative statement which would be confirmed at the ocular
    inspection, upon which alone one would enter into the matter and then soon bring the business to an
    end. [uncertain: The former] clerk, who came hither to visit a [illegible] and supposed he would find
    me in better circumstances, and therefore hoped to receive from me the remuneration due to him as
    Your Right Honourable''s fellow labourer for a year in the business there, was present, and I made
    use of him in a conference with the cavalry captain von Schimmelpfennig in order to set everything
    out to him exactly and thoroughly. He undertook this commission willingly and skilfully, drew up for
    my use and my own instruction a reasoned and informative valuation, which I also communicated to Schimmelpfennig
    in confidence. I must do Lieutenant Sommer the justice to say that, while he takes our mutual sorrow
    and oppressive situation nobly to heart, and utters himself only with caution, he pities Your Right
    Honourable,'

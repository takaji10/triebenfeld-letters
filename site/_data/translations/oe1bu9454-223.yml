- page: 6
  en: 'but is at the same time much devoted to you, and looks forward to the early reunion. He will excuse
    his rapid departure, to which the press of circumstances compelled him. I believe he will, wishes
    to, and can be of excellent use in this business; I may believe that by my conduct I have earned his
    attachment, and therefore I beg Your Right Honourable in the most friendly manner to make use of him
    with confidence as a good instrument. I promised him not to leave his faithfully rendered assistance
    unrewarded, and in any case I beg you, best of friends, to bring about there, as soon as may be, whatever
    can be made possible for his provisional reassurance, by a payment to be ordered to him. The manner
    and way I leave to Your Right Honourable, and with it to Lieutenant Sommer, that upon this he, having
    taken counsel with [uncertain: Lebanis], might well be able to make you a proposal not harmful to
    me. I wish it, since we thereby bind to ourselves a faithful and highly knowledgeable assistant. Since
    General von Schimmelpfennig let fall to me that he intends in these days to send his elder son, the
    cavalry captain, to Berlin on account of procuring the moneys needed for the purpose, but with his
    youngest son, who is a pupil of Thaer, intends soon to undertake the journey to Zagorowo, in order
    to view these estates before the ground is covered with snow, and beforehand wishes to speak with
    the Lieutenant to obtain instruction from him, I shall, as soon as the day for his dispatch is determined'

- page: 2
  en: '[text lost] then your plan would be excellent; I beg you also not to let it [uncertain: fall],
    since the welfare of the mortgage creditors who have their [uncertain: funds] standing there lies
    very earnestly at my heart. I shall also most zealously exert myself to further this, and hope that
    my eldest son and my son-in-law will [uncertain: concur] with zeal in the attainment of this intention.
    But since this wish can be attained even if we do not come to terms with Weigel and Stössel according
    to Your Right Honourable''s wisely laid plan, I must seek my welfare particularly in this, to procure
    means solely through the alienation of the Zagórów estates to rid myself of my private debts, which
    press me hardest - which, by the arrangement I have now made, I may hope shall soon and desirably
    come about, especially if you will in friendly fashion make it your concern to unite your whole strength
    and negotiating talent with mine and to treat upon it with the same intention. I have carefully taken
    to heart the plan you have just laid before me for the negotiation with Weigel and Stössel, and by
    no means contradict it. I do not believe, however, that anything is to be got forward with Weigel,
    and if the bargain is not struck with both gentlemen at once, it can in no way profit us. The taking
    on of Ruszynowig [would] only further increase the already too large stock of estates; I should not
    willingly enlarge the obligations I have towards you by the addition of Blizanow. Since I always chiefly
    cherish the intention never to be ungrateful towards you, nor to multiply your embarrassments,'

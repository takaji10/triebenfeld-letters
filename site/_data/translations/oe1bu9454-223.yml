- page: 4
  en: 'or given up; as for the one concerning Trąbczyn I do not care to ask any more, and I confess that
    it only [uncertain: shames the house] when I must merely say that the means for the continuation of
    these suits are lacking; all the disappointed hopes have made me as unhappy through the misleading
    as you cannot imagine. Help me therefore to save what still remains to me in the Polish estates, and
    thereby preserve our honour and our mutual advantage, for which, under your guidance, I am ready to
    make considerable sacrifices. I must confess to you that the situation is such that even any short
    postponement which defers this means of rescue inflicts mortal wounds upon me. I hope that a proposal
    which has been made to me on the part of the Schimmelpfennig family, and which persons well disposed
    toward me have fostered, will lead to this end. The old General and his sons, who were themselves
    with me, have a liking for the Zagorowo estates; he would gladly in exchange sell to me his wholly
    debt-free estates Szelce and Maderzewo, which lie [uncertain: not] near Mysłowic on the Przemsa, and
    puts their yield at 8000 Rthl Courant.


    Others who know these estates exactly put it definitely at 6000 Rthl. He purchased them several years
    ago for 26000 ducats in Gold; several thousand more he is said to have laid out upon their improvement,
    and now he means to bring them above 100000 Rthl. A short while ago 85000 Rthl Courant were offered
    him for them, which he however refused. The General''s wife possesses a capital of about 60000 Rthl
    in [uncertain: Opfernstisch] mortgage bonds, and as the eldest son, the'

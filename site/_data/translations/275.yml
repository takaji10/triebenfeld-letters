- page: 1
  en: 'Most Serene Prince, Most gracious Lord! Still the learned Councillor of State Stägemann has not
    been able to draw up any contract for the Prince State Chancellor. God knows whether the fault lies
    with the former or the latter. There is no lack of reminders — but always one pleads the frightfully
    numerous labours that hindered it. — By now I take it for ill will — and one would decide in Cosmar''s
    favour, were the Brieg report not all too favourable for Your Serene Highness — one also fears Bar:
    and Beng: — I must still keep to my room and bed — and therefore I can only work through my friends;
    that meanwhile the Prince means well by Your Serene Highness, as by all the Hohenlohe houses, I was
    assured again yesterday, and this very day something further goes off in favour of the said houses
    to the King of Würtemberg — the enclosure will also show Your Serene Highness what has been done.
    [uncertain: Hunting] is my greatest care, to submit the files and documents to the Commission on account
    of Trąbczyn, Kulm and Kaemen — I cannot get the files back from the translator together with the translation.
    He wants to be paid and I have no money. It is necessary that this, as also the offered blank forms,
    be sent here quickly. My illness is persistently bad. — Shame and vexation, however, consume me and
    in the end wear me quite away. Of general news there is much of various kinds that does not admit
    of being written; the weather is clouding over again, and the barometer points to storm; the [uncertain:
    Saxon] wants all at once to become an 8-Groschen piece again. How Russia and England mean it — O woe,
    I can write no more today than that in deep respect I remain Your Serene Highness''s — send, Your
    Serene Highness, even if only a little money in advance, for otherwise everything comes to a standstill
    — most obedient servant. Vienna, the 28th of February 1815. v Triebenfeld'

segments:
- page: 1
  en: 'The Most Illustrious Right Honourable Field Commissioners between Trąbczyn and Łukom protest against
    the Boundary Act


    Let there be seen here the Formal Protest made in fact and upon the personal appearance of the Most
    Illustrious Right Honourables: Dąmbski, Palatine of Brest-Kuyavia; Brzeziński, Starost of [Inowrocław];
    Dąmbski, Standard-Bearer of Brest-Kuyavia; Kwilecki, Pantler of Wschowa; and Umiński, Pantler of Kowal
    — against the Right Honourable Chełmski and also the Most Illustrious Commissioners engaged on his
    behalf — and that by reason of the Act performed unilaterally by them on the contested estate of the
    goods of Łukom and Trąbczyn — made, among the Produced Documents.


    Ludwik Dąmbski, Voivode of Brest-Kuyavia, as commissioner and president, by his own hand


    Jo. Brzeziński, Starost of [illegible], as commissioner, by his own hand


    Stanisław Dąmbski, [illegible], commissioner, by his own hand


    Jan Kwilecki of Kwilcz, Cup-bearer of Wschowa, as commissioner, by his own hand


    Kajetan Umiński, Cup-bearer of Kowal, deputy voivode [illegible], commissioner'

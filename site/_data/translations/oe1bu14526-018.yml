    § 17. Finally the contracting parties renounce each and every objection, by whatever name they may
    be called; in particular the town and village communities renounce the plea of injury beyond the half,
    which was explained to them as meaning that, if the agreed purchase and hereditary-tenure sum should
    exceed the true value of the plots of ground and rights made over by double, it would be open to them
    to withdraw from the contract.



- page: 12
  en: 'communities do not indeed insist that possession of the demesne farm be given over to them at once,
    but are rather content that, until the judgment of ejection has become legally binding, he shall remain
    therein, and shall only be evicted when the judgment of ejection is legally binding; but for this
    a fair and suitable compensation proportionate to the matter shall be given to the communities by
    His Serene Highness the Prince. As regards the forests, on the other hand, these shall be closed at
    once, as indeed they already are, and the timber felled therein, in so far as it has not been felled
    for the husbandry, remains the property of His Serene Highness the Prince of Hohenlohe-Ingelfingen.



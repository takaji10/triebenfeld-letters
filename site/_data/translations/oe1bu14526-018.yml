status: draft
segments:
- page: 1
  en: 'Copia


    No. 92.


    We, the Princely Hohenloh-Ingelfingen Court-Office of the lordship of Betsche, hereby make known and
    declare to all and sundry, but especially where it is needful, to wit, that there appeared before
    Us:


    1, the Princely Hohenlohe-Ingelfingen Director of Estates and General Plenipotentiary, Building Councillor
    Johann Wilhelm Glenk, on the one part,


    2, likewise the plenipotentiaries of the town and rural communes, namely of the town of Betsche, the
    villages Staluhn, Schartzig, Schwichodizyn, Stocki, Lowin and Kulligowo,


    a, the burgher and town representative Matheus Młynkiewicz


    b) the Freyschulze Johann Chmara, and have concluded a hereditary-lease contract over the properties
    of the lordship of Betsche, as'
- page: 2
  en: 'the proceedings of the 28th of July of the current year, as also the supplement of the 29th of
    July of the current year, more fully set forth, reading thus: Actum Betsche, the 28th of July 1804.
    There appeared


    1, the Princely Hohenlohe-Ingelfingen General Plenipotentiary, Building Councillor Glenk, to whom
    His Most Serene Highness has assigned the Councillor of War and Forests von Triebenfeld, hereditary
    lord of Schweinerne and Kontopp, as His Most High friend and assistant.


    2, the burgher and town representative Matheus Młynkiewicz as plenipotentiary of the burghership of
    Betsche,


    3, the Freyschulze Johann Chmara of Stalluhn as plenipotentiary of the village communes Stalluhn,
    Kulligowo, Schartzig, Stocki, Schwiechodzyn, Lowin'
- page: 3
  en: 'with the motion to draw up a contract between His Most Serene Highness the reigning Prince Friedrich
    Ludwig zu Hohenlohe-Ingelfingen, the burghership of Betsche and the village communes named above,
    on the basis of the Punctation dated Alt Schartzig, the 16th of July 1804. The Princely Hohenlohe
    plenipotentiary, Building Councillor Johann Wilhelm Glenk, produces the general power of attorney
    of the Prince of Hohenlohe of the 26th of April 1803, according to which he is authorised to conclude
    agreements validly, of which power of attorney an authenticated copy was taken to these acts.


    In like manner Młynkiewicz also presents a judicial power of attorney of the 5th of April 1804, according
    to which he is authorised to conclude, in the name of the town, with the reigning Prince of'
- page: 4
  en: 'to Hohenlohe, Serene Highness, a contract over all the parcels of land and profitable rights belonging
    to the lordship of Betsche.


    Likewise Chmara presents a judicial power of attorney of the 5th of April 1804, according to which
    he is authorised by the communes Stalluhn, Kulligowo, Schartzig, Stoki, Schwiechoczyn, Lowin, in the
    same manner as Młynkiewicz, to conclude a contract. After negotiations conducted on both sides, and
    after the Punctation of the 16th of July 1804 had been produced, and the personal competence of the
    appearing parties to conclude contracts was subject to no doubt, the contract was drawn up as follows.


    § 1.'
- page: 5
  en: § 1. His Most Serene Highness the reigning Prince Friedrich Ludwig zu Hohenlohe-Ingelfingen, Governor
    at Breslau, Inspector General of Infantry and Knight of the great Royal Prussian Orders, as hereditary
    lord of the lordship of Betsche situated in the Meseritz district, makes over to the burghership of
    the town of Betsche and the inhabitants of the villages Kulligowo, Stalluhn, Schärtzig, Stoki, Schwichodczyn,
    Lowin, all the demesne farms belonging to them, fields, gardens, meadows, marshes, lakes, ponds, pond-sites,
    rivers, pasturage, heaths, shops, forests, woods, thickets, brushwood, money and payments in kind,
    the propination rights, the brewing and distilling right, brick and lime kilns, the Obrn demesne farm,
    in short all and every profitable right and privilege which the Prince of Hohenlohe's
- page: 6
  en: 'Serene Highness has hitherto as owner used and enjoyed, and can, may and shall enjoy, in Pausch
    und Bogen, by whatever names they may be called, in particular also the right of pre-emption over
    the Scholtiseys and demesne farms granted out on hereditary-rent tenure, excepting the jurisdiction
    and the Laudemium, the hunt, which His Most Serene Highness reserves to Himself and His Most High
    successors as supreme owner and perpetual territorial lord of Betsche, as their true hereditary property
    and possession, in such wise and manner that the said town commune of Betsche and the aforementioned
    localities may deal with the same as with their own property, may sell, exchange, give it away, can,
    may and shall, for a


    § 2.'
- page: 7
  en: '§ 2. well-agreed purchase and hereditary-tenure sum of One hundred and eighty thousand Reichsthaler
    in Royal Prussian Courant according to the coinage standard of 1764, and an annual ground-rent of
    One thousand Reichsthaler in Courant according to the same coinage standard.


    § 3. With the payment of the purchase and hereditary-tenure sum it is to be held in this manner:


    The town and the other village communes take over ad rationes pretii the following named mortgage
    debts intabulated upon the lordship of Betsche in the mortgage book of the Royal Government at Posen,
    namely


    1, 48,000 rt entered for Building Councillor Glenk, of which sum


    36,000 rtt has been ceded to the banker Salomon Natan'
- page: 8
  en: 'Nathan junior at Berlin, and 12000 rtl. to the banker Meyer Bernhard at Frankfurth a/o


    2, 2000 rt. which are entered for the merchant Abraham Moses Hirchel at Breslau


    3, 5000 rt. which are intabulated for the Freyherr von der Marwitz auf Rudnik and ceded to the banker
    Meyer Bernhard at Frankfurth a/o


    4, 5000 rthl. which are intabulated for the widowed Ober-Amts-Räthin Christiane Dorothea Michaelis
    née Eichborn


    5, 5000 rt. which are intabulated for the Building Councillor Johann Wil-'
- page: 9
  en: 'helm Glenk, and have been ceded by him to the banker Meyer Bernhard at Frankfurth, all which items
    from 2 to 5 have already been called in by the creditors and are payable at Christmas of the current
    year. Whereby it is noted that the interest on the 48,000 rtl. is settled up to the 2nd of July, but
    on the remaining capitals up to the 26th of July of the current year.


    6, 72,000 Rthl. which are already intabulated for the banker Meyer Bernhard at Frankfurth a/o, and
    the interest at 5 per cent settled up to the 26th of July of this year, as with the other capitals;
    and they promise to settle this sum with the creditors and to come to agreement with them thereon'
- page: 10
  en: '137,000 Rthl


    7, the deputies stipulate to settle out of the remainder of the purchase and hereditary-tenure sum
    thirty-five thousand Reichsthaler forthwith to His Most Serene Highness at Breslau, carriage free,
    but the remainder of 8000 rttl. at the term of St. John''s next year, together with 5 per cent interest,
    without fail, if notice is given in due time. The aforementioned 35000 rtlr. are to be paid in this
    manner: tomorrow, the 29th of July, 1000 rtl.; from tomorrow in 8 days'' time the remaining 28000
    rt. are to be paid, and indeed the 7000 rtl. are to be sent carriage free to Breslau at the cost of
    the payers. If'
- page: 11
  en: '137000 rt If among the monies to be paid there are heavy Dutch milled ducats, these will be accepted
    at 4 gg. agio per #. Should the communes fail to pay the 28000 rthl. tomorrow in 8 days, that is on
    the 5th of August, then the whole contract concluded today ceases, and the communes are bound to pay
    the costs incurred, but shall receive the 7000 rtl. back again, though without interest.


    § 4. The handing over follows as soon as the 28000 rtl., which are to be paid on the 5th of August,
    have been paid. Since however the former tenant Bornstaedt is still in possession of the demesne farm
    here, and a lawsuit is pending over his eviction, the'
- page: 12
  en: 'communes do not indeed insist that possession of the demesne farm be conceded to them at once,
    but are rather willing to allow that until the judgment of eviction is legally binding he shall remain
    therein, and only when the judgment of eviction is legally binding shall he be evicted; yet for this
    the communes shall be given by the Prince, Serene Highness, a fair and appropriate compensation suited
    to the matter. As regards the forests, on the other hand, these shall be closed at once, as indeed
    they already are now, and the timber felled therein, in so far as it has not been felled for the estate
    economy, remains the property of His Serene Highness the Prince of Hohenlohe-Ingelfingen.


    § 5. All manorial dwelling, farm, forest'
- page: 13
  en: '[forest] and other buildings are made over to the communes likewise as hereditary property; the
    communes are however bound to leave the foresters their dwelling in one room in the foresters'' houses
    until Michaelmas of the current year, as also the use of their gardens. His Serene Highness also reserves
    the castle as the seat of the court, the dwelling of the court servant, and a dwelling for His Highness
    Himself or His commissioners, also stabling for 2 horses, which they shall themselves maintain in
    good structural repair. In the case of building works on this edifice, the communes are bound to let
    the Prince of Hohenlohe-Ingelfingen, Serene Highness, and his successors have the bricks at cost price
    and to furnish the timber for the construction from the heath free of charge. Also are'
- page: 14
  en: 'the communes bound to furnish free of charge from the forest, and to cart in, the timber needed
    for heating the courtroom and the court servant''s quarters. In like manner the communes are also
    bound, when His Most Serene Highness or His commissioners are present here, to furnish and cart in
    the necessary firewood free of charge.


    § 6. As regards the timber-purchase contracts concluded between His Most Serene Highness and certain
    merchants, His Highness promises to satisfy the timber purchasers without the communes making any
    contribution thereto.


    § 7. The town and village communes mentioned at the outset undertake, upon alienations of their'
- page: 15
  en: 'parcels of land, to render 10 per cent Laudemium of the purchase sum to His Most Serene Highness
    and his successors in possession. From these Laudemia are however excepted those holdings which the
    communes now intend to lay out; but if these are sold in future, the Laudemium of 10 per cent shall
    likewise be rendered thereon.


    § 8. Further His Most Serene Highness reserves that, if He Himself or his successors in possession
    should come hither, or should send their commissioners hither, the communes are bound to render the
    Vorspann conveyance over a distance of 4 miles thither and back.


    § 9. Further His Serene Highness reserves, should he'
- page: 16
  en: 'obtain the right of patronage over the Betsche church, that right of patronage; yet the town and
    village communes shall have the right to elect the clergyman and to propose him, which proposed clergyman
    His Most Serene Highness shall present to the episcopal Consistory.


    § 10. they promise.


    The lawsuits between the commune of Stocki and the Prince of Hohenlohe over the ownership of the Stocki
    marsh; between the Prince of Hohenlohe and the possessor of Zilomyśl[?] over the right of admission;
    and between the Landrath v Schmaeling as possessor of the demesne farm in Glożewo and the Prince of
    Hohenlohe, Serene Highness, over confirmation of the privilege; as also the'
- page: 17
  en: 'lawsuit between the Prince of Hohenlohe and Hertzig in Lowino over the restitution of the Szalestwo
    — these the communes take over at their own risk and cost, and whatever they may litigate out or obtain
    by way of settlement falls to the communes, without His Serene Highness having the least claim thereto.


    § 11. The competence taxes hitherto paid by His Serene Highness as Dominium of Betsche, and other
    public and further dues, whenever(5) they(6) names(7) have(8) and(2) (3) costs(4), among which also
    belong the sick-transport carriages into the Schiller and Puncten Hauländer, as also the carriages
    for the fetching and conveying away of the court, and by whatever other names they may be called,
    the said town and village communes take over, and the latter cannot, if these dues should be'
- page: 18
  en: 'raised in future, demand any compensation from the Prince of Hohenlohe, Serene Highness; the communes
    also take over the contribution of 50 rthl. which His Most Serene Highness had promised to render
    to the town school here for 1 year.


    § 12. Both contracting parties undertake to have this contract published before the competent authorities
    and to seek confirmation, and His Most Serene Highness herewith binds Himself to exert Himself as
    far as possible that this contract be confirmed by the competent authorities, and also that the consent
    to the further dismemberment of what has been made over to them be granted to the communes.


    § 13. As soon as the tradition of the Obra demesne farm here'
- page: 19
  en: 'takes place, there shall at the same time be handed over to the town and village communes that
    livestock and farming inventory which is sold along under the purchase and entry sum, in the same
    number as the tenant v Bornstaedt received the same in the year 1800 at the handing over.


    § 14. This contract shall be binding for His Most Serene Highness the Prince zu Hohenlohe-Ingelfingen
    for Himself and His Most High heirs and successors, as also on the part of the town and village communes,
    for all time. And the annual canon or ground-rent of 1000 rtl. to be paid shall be rendered in half-yearly
    instalments of 500 rtl., namely each time at the term of Christmas and the term of St. John the Baptist,
    yearly, sub paena Executionis, and sent carriage free to Bres-'
- page: 20
  en: '-lau.


    § 15. So long as the communes do not alienate or dismember the parcels of land and rights made over
    to them, the status possessivus remains in its present condition. But as soon as the demesne farm
    is dismembered, the hereditary purchasers are bound to have the intabulated items transferred onto
    the parcels of land and struck off in the name of His Most Serene Highness.


    § 16. For the stipulated canon of 1000 rtl. yearly all the communes are liable in solidum, and they
    allow the entry thereof in the mortgage book upon their parcels of land, just as on the other hand
    His Most Serene Highness allows that this present contract'
- page: 21
  en: 'be entered in the mortgage book of the Dominium Betsche and its appurtenances.


    § 17. Finally the contrahentes renounce each and every objection, by whatever names they may be called;
    in particular the town and village communes renounce the plea of injury beyond the half, which was
    explained to them as meaning that if the agreed purchase and entry sum exceeded the true value of
    the parcels of land and rights made over by double, they would be free to withdraw from the contract.


    § 18. His Most Serene Highness reserves the supreme oversight over the costs, which He will entrust
    to the Royal Chief Forester Feller, and the communes undertake to indemnify him for'
- page: 22
  en: 'his exertions and to come to agreement with him thereon.


    Thus, as nothing further was to be adduced, the proceedings were closed, the protocol read aloud,
    interpreted by the sworn interpreter Eichaust for the deputies of the town and village communes not
    fully conversant with the German language, who had requested the keeping of a separate side-protocol
    in the Polish language, approved and signed; whereby it was further noted by the contrahentes that
    the costs of the drawing up, the engrossment, the publication and the confirmation shall be borne
    in halves by both parties. Read aloud, approved and'
- page: 23
  en: 'signed. Read by myself and approved. Johann Wilhelm Glenk, Most Princely Hohenlohe-Ingelfingen
    General Plenipotentiary. Peter Friedrich August v Triebenfeld. Jan Chmara, as authorised representative.
    Mateusz Myłnkiewicz, authorised representative, plenipotentiary. Josef Echaust as interpreter. Metzig


    Justitiarius


    Neumann, Actuarius. Actum Betsche, the 29th of July 1804. Today there appeared


    1, the Princely Hohenlohe-Ingelfingen General Plenipotentiary, Building Councillor Johann Wilhelm
    Glenk; likewise the special plenipotentiary of the burghership, Matheus Myłnkie-'
- page: 24
  en: '-wicz; 3, the plenipotentiary of the communes Kuligow, Stalluhn, Szartzig, Stoki, Schwichodzin,
    Lowin, Chmara; and they bring to the contract drawn up yesterday the following additions:


    § 1. The Prince of Hohenlohe, Serene Highness, assures the communes that, apart from the mortgage
    capitals already called in, none shall be called in within half a year.


    § 2. The town and village communes undertake, in the event of criminal investigations arising, to
    bear for ever the costs of investigation, in so far as the other communes belonging to the Betsche
    key are not themselves bound to bear the same. Therewith the proceedings were closed, the protocol
    read aloud, and, for the deputies of the commune who'
- page: 25
  en: 'are not fully conversant with the German language and had requested the keeping of a protocol in
    the Polish language, interpreted by the sworn interpreter Echaust, approved and signed. Johann Wilhelm
    Glenk.


    J. Chmara mpp


    M. Młynkiewicz


    Metzig


    Neumann. Since now an authenticated engrossment was needful and was requested, the present engrossment
    is issued in witness thereof under Our seal and signature.


    So done at Betrche, the 7th of December 1804. Princely Hohenlohe-Ingelfingen Court-Office.


    Metzig


    Neumann (Copy) Friedrich Wilhelm, King of Prussia, p. p. Our gracious greeting first. Whereas the
    investigation occasioned by the dismemberment and alienation of the lordship of Betsch to the burghers
    and inhabitants there, initiated by the Prince zu Hohenlohe-Ingelfin-'
- page: 26
  en: '-gen, has shown that the hereditary-lease acquirers will be able to subsist under the contract
    concluded with them and to remain in a lasting and prestation-capable condition, and that the public
    dues resting upon the lordship are secured, We have Ourselves Most Highly, upon the enquiry made to
    Us on this account, now, by the tenor of the Cabinet Resolution of the 29th of last month, been pleased
    to grant Our approval to the said alienation and dismemberment in the manner initiated; and since
    We have found nothing to object to in the applications made by the hereditary acquirers, that


    1, their society be always regarded as a district estate, which through'
- page: 27
  en: 'the Prince of Hohenlohe-Ingelfingen is represented, and whose rights have been exercised in his
    name by them;


    2, that the supervision of the forests there be left to the Prince exclusively and under the lawful
    concurrence of the territorial police;


    3, that in their relation to the flat country, in so far as this requires it, and as a district estate
    of the Meseritz district, the Landrath''s office be given to them as the authority of dependence —
    We have most graciously conceded the granting thereof, and hereby make the same known to you for your
    information, with the injunction to notify the interested parties hereof, and further to collect the
    amount of the liquidation annexed in copy'
- page: 28
  en: 'of the daily allowances and travelling expenses of the Chief Bailiff Jahr and Chief Forester Feller,
    and to pay 20 rtl. 8 ggr. to the said Jahr and just as much to Feller. We remain graciously well disposed
    towards you. Posen, the 10th of May 1806. Royal South Prussian War and Domains Chamber. G. O. Köller.
    Concordat cum originali. Mielęcki


    Hedel[?]


    To


    the Landrath


    v Mielęcki. The agreement of the foregoing copy with the judicial acts is attested


    Frost, Tribunal Archives'

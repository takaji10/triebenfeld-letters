- page: 5
  en: § 1. His Most Serene Highness the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, governor
    at Breslau, inspector general of infantry and knight of the great Royal Prussian orders, as hereditary
    lord of the lordship of Betsche situated in the district of Meseritz, makes over to the burgesses
    of the town of Betsche and the inhabitants of the villages of Kulligowo, Stalluhn, Schärtzig, Stoki,
    Schwichodczyn, Lowin, all the demesne farms belonging to them, fields, gardens, meadows, marshes,
    lakes, ponds, pond-sites, rivers, pasturage, heaths, shops, forests, woods, thickets, scrub, money
    and rents in kind, the propination rights, the right of brewing and distilling, brick and lime kilns,
    the Obrn demesne farm, in short all and every profitable right and privilege which the Prince of Hohenlohe,

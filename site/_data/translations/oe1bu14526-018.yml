  en: 'with the motion to record a contract between His Most Serene Highness the reigning Prince Friedrich
    Ludwig of Hohenlohe-Ingelfingen, the burgesses of Betsche and the village communities named above,
    on the basis of the heads of agreement dated Alt Schartzig, the 16th of July 1804. The Princely Hohenlohe
    attorney, the building councillor Johann Wilhelm Glenck, produces the general power of attorney of
    the Prince of Hohenlohe of the 26th of April 1803, according to which he is authorised to conclude
    agreements in valid form, of which power of attorney an attested copy was taken to these acts.


    In like manner Młynkiewicz also submits a judicial power of attorney of the 5th of April 1804, according
    to which he is authorised, in the name of the town, to conclude with the reigning Prince of'

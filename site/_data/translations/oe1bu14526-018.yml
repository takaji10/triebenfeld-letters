  en: 'His Serene Highness, has hitherto as proprietor used and enjoyed, and can, may and shall enjoy,
    in Pausch und Bogen, by whatever name they may be called, in particular also the right of pre-emption
    over the village mayor''s holdings and demesne farms granted under hereditary quit-rent tenure, excepting
    the jurisdiction and the transfer fee (Laudemium), and the hunt, which His Most Serene Highness reserves
    to Himself and His Most High successors as supreme proprietor and perpetual ground-lord of Betsche,
    as their true hereditary property and possession, in such form and manner that the said town commune
    of Betsche and the mentioned localities may deal with it as with their own property, may sell, exchange
    and give it away, can, may and shall, for a



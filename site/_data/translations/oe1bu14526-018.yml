  en: 'gen, has shown that the acquirers under hereditary lease will be able to subsist under the contract
    concluded with them and to remain in a durable and performance-capable condition, and that the public
    dues resting upon the lordship are secured, We have Most Highly Ourself, upon the enquiry made to
    Us in this matter, now, by the terms of the cabinet resolution of the 29th of last month, been pleased
    to grant Our approval to the said alienation and dismemberment in the manner set on foot; and since
    further, in respect of the applications made by the hereditary acquirers, that


    1, their society be always regarded as a district estate, which is represented through'

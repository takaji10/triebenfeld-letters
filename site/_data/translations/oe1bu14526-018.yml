status: draft
segments:
- page: 1
  en: 'Copia


    No. 92.


    We, the Princely Hohenloh-Ingelfingen Court-Office of the Lordship of Betsche, hereby make known and
    declare to all and sundry, but especially where it is needful, to be known, that there appeared before
    Us:


    1, the Princely Hohenlohe-Ingelfingen Director of Estates and General Plenipotentiary, Building Councillor
    Johann Wilhelm Glenk, on the one part,


    2, likewise the plenipotentiaries of the town and rural communities, namely of the town of Betsche,
    the villages of Staluhn, Schartzig, Schwichodizyn, Stocki, Lowin and Kulligowo,


    a, the burgher and town representative Matheus Młynkiewicz


    b) the free village headman Johann Chmara, and have concluded a hereditary-lease contract over the
    estates of the Lordship of Betsche, as'
- page: 2
  en: 'the negotiation of the 28th of July of this year, as also the supplement of the 29th of July of
    this year, sets forth more fully, reading thus: Actum Betsche, the 28th of July 1804. There appeared


    1, the Princely Hohenlohe-Ingelfingen General Plenipotentiary, Building Councillor Glenk, to whom
    His Most Serene Highness has assigned the Councillor of War and Forests von Triebenfeld, hereditary
    lord of Schweinerne and Kontopp, as His Most High friend and assistant.


    2, the burgher and town representative Matheus Młynkiewicz as plenipotentiary of the burghership of
    Betsche,


    3, the free village headman Johann Chmara of Stalluhn as plenipotentiary of the village communities
    of Stalluhn, Kulligowo, Schartzig, Stocki, Schwiechodzyn, Lowin'
- page: 3
  en: 'with the motion to record a contract between His Most Serene Highness the reigning Prince Friedrich
    Ludwig zu Hohenlohe-Ingelfingen, the burghership of Betsche and the village communities named above,
    on the basis of the punctation dated Alt Schartzig, the 16th of July 1804. The Princely Hohenlohe
    plenipotentiary, the Building Councillor Johann Wilhelm Glenk, produces the general power of attorney
    of the Prince zu Hohenlohe of the 26th of April 1803, according to which he is authorised to conclude
    agreements in valid form; of which power of attorney a vidimated copy was taken to these records.


    In like manner the said Młynkiewicz also presents a judicially executed power of attorney of the 5th
    of April 1804, according to which he is authorised, in the name of the town, to conclude with the
    reigning Prince'
- page: 4
  en: 'zu Hohenlohe, Serene Highness, a contract over all the parcels of land and profitable rights belonging
    to the Lordship of Betsche.


    Likewise the said Chmara presents a judicially executed power of attorney of the 5th of April 1804,
    according to which he is authorised by the communities of Stalluhn, Kulligowo, Schartzig, Stoki, Schwiechoczyn,
    Lowin, on the same footing as the said Młynkiewicz, to conclude a contract. After negotiations conducted
    on both sides, and after the punctation of the 16th of July 1804 had been produced, and the personal
    capacity of the parties appearing to conclude contracts was subject to no doubt, the contract was
    recorded as follows.


    § 1.'
- page: 5
  en: '§ 1. His Most Serene Highness the reigning Prince Friedrich Ludwig zu Hohenlohe-Ingelfingen, Governor
    of Breslau, General Inspector of the Infantry and Knight of the Royal Prussian great Orders, as hereditary
    lord of the Lordship of Betsche situated in the Meseritz district, makes over to the burghership of
    the town of Betsche and the inhabitants of the villages of Kulligowo, Stalluhn, Schärtzig, Stoki,
    Schwichodczyn, Lowin, all the demesne farms belonging to them, fields, gardens, meadows, marshes,
    lakes, ponds, pond-sites, rivers, pasturage, heaths, [uncertain: shops], forests, woods, thickets,
    scrub, money and natural rents, the propination rights, the brewing and distilling rights, brick-
    and lime-kilns, the Obra demesne farm, in short each and every profitable right and prerogative which
    the Prince von Hohenlohe,'
- page: 6
  en: 'Serene Highness, has hitherto as proprietor used and enjoyed and also can, may and shall enjoy,
    in Pausch und Bogen, by whatever names they may be called, and in particular also the right of pre-emption
    over the Scholtiseys and demesne farms granted out at hereditary quit-rent tenure - excepting the
    jurisdiction and the Laudemium, and the hunt, which His Most Serene Highness reserves to Himself and
    His Most High successors as supreme proprietor and perpetual ground-lord of Betsche - as their true
    hereditary property and possession, in such form and manner that the said town commune of Betsche
    and the aforementioned villages may deal therewith as with their own property, may sell, exchange,
    give it away, can, may and shall, for a


    § 2.'
- page: 7
  en: '§ 2. duly agreed purchase and hereditary-tenure sum of one hundred and eighty thousand Reichsthaler
    in Royal Prussian Courant according to the coinage standard of 1764, and an annual ground-rent of
    one thousand Reichsthaler in Courant according to the same coinage standard.


    § 3. With regard to the payment of the purchase and hereditary-tenure sum, the matter is arranged
    in this manner:


    The town and the remaining village communities take over, ad rationes protii, the following-named
    mortgage debts intabulated against the Lordship of Betsche in the mortgage book of the Royal Government
    at Posen, namely


    1, 48,000 rt entered for the Building Councillor Glenk, of which sum


    36,000 rtt have been ceded to the banker Salomon Natan'
- page: 8
  en: 'Nathan junior at Berlin, and 12000 rtl. to the banker Meyer Bernhard at Frankfurth a/O


    2, 2000 rt. which are entered for the merchant Abraham Moses Hirchel at Breslau


    3, 5000 rt. which are intabulated for the Baron von der Marwitz of Rudnik and have been ceded to the
    banker Meyer Bernhard at Frankfurth a/O


    4, 5000 rthl. which are intabulated for the widowed Chief Bailiff''s Lady Christiane Dorothea Michaelis,
    née Eichborn


    5, 5000 rt. which are intabulated for the Building Councillor Johann Wil-'
- page: 9
  en: 'helm Glenk, and have been ceded by him to the banker Meyer Bernhard at Frankfurth, all which items
    from 2 to 5 have already been called in by the creditors and are payable at Christmas of this year.
    Whereby it is noted that the interest on the 48,000 rtl. has been settled up to the 2nd of July, but
    on the remaining capitals up to the 26th of July of this year.


    6, 72,000 Rthl. which are already intabulated for the banker Meyer Bernhard at Frankfurth a/O, and
    the interest at 5 per cent settled up to the 26th of July of this year, as with the remaining capitals;
    and they promise to settle this sum with the creditors and to come to an agreement with them concerning
    it'
- page: 10
  en: '137,000 Rthl


    7, the deputies stipulate to settle immediately, out of the remainder of the purchase and hereditary-tenure
    sum, thirty-five thousand Reichsthaler to His Most Serene Highness at Breslau, carriage free, but
    the remainder of 8000 rttl. at the term of St John''s next year, together with 5 per cent interest,
    without fail, if notice is given in due time. The above-mentioned 35000 rtlr. are to be paid in this
    manner: tomorrow, the 29th of July, 1000 rtl.; a week from tomorrow [uncertain: the remaining 28000
    rt. are to be paid]; and namely the 7000 rtl. are to be sent carriage free to Breslau at the cost
    of the payers. If'
- page: 11
  en: '137000 rt. If among the moneys to be paid there are heavy Dutch rim-ducats, these shall be accepted
    at 4 gg. agio per #. Should the communities not pay the 28000 rthl. a week from tomorrow, that is
    on the 5th of August, then the whole contract concluded this day lapses, and the communities are bound
    to pay the costs occasioned, but shall receive the 7000 rtl. back again, however without interest.


    § 4. The handing over follows as soon as the 28000 rtl., which are to be paid on the 5th of August,
    have been paid. Since, however, the former lessee Bornstaedt is still in possession of the demesne
    farm here, and a lawsuit is pending over his eviction, the'
- page: 12
  en: 'communities do not indeed insist that possession of the demesne farm be at once made over to them,
    but will rather be content that, so long as the eviction judgment is not final in law, he remain therein,
    and only when the eviction judgment is final in law shall he be evicted; however, for this the communities
    shall be given by the Prince, Serene Highness, a fair and appropriate compensation suited to the matter.
    As regards the forests, on the other hand, these shall be closed at once, as they already are now,
    and the timber felled therein, insofar as it has not been felled for the needs of the husbandry, remains
    the property of His Serene Highness the Prince von Hohenlohe-Ingelfingen.


    § 5. All the manorial dwelling-, farm-,'
- page: 13
  en: forest and other buildings are made over to the communities likewise as hereditary property; the
    communities are, however, bound to leave the foresters their dwelling in one room in the foresters'
    houses until Michaelmas of this year, as also the use of their gardens. His Serene Highness likewise
    reserves to himself the castle as the seat of the court, the dwelling of the court beadle, and a dwelling
    for His Most High Self or His commissaries, also a stabling for 2 horses, which they themselves maintain
    in good structural repair. In the case of building works on this edifice, the communities are bound
    to let the Prince von Hohenlohe-Ingelfingen, Serene Highness, and his successors have the bricks at
    cost price, and to deliver the timber for the construction free of charge from the heath. Also
- page: 14
  en: 'the communities are bound to furnish and cart in, free of charge from the forest, the wood needed
    for heating the court room and the court beadle''s [room]. In like manner the communities are also
    bound, when His Most Serene Highness or His commissaries are present here, to furnish and cart in
    the necessary firewood free of charge.


    § 6. As regards the timber purchase contracts concluded between His Most Serene Highness and certain
    merchants, His Most High Self promises to satisfy the timber purchasers without the communities making
    any contribution thereto.


    § 7. The town and village communities mentioned at the outset undertake, upon alienations of their'
- page: 15
  en: 'parcels of land, to render 10 per cent Laudemium on the purchase sum to His Most Serene Highness
    and his successors in possession. From these laudemia, however, those holdings are excepted which
    the communities now intend to lay out; but if these are sold in future, the Laudemium of 10 per cent
    is likewise to be rendered thereon.


    § 8. Further, His Most Serene Highness reserves that, when he himself or his successors in possession
    come hither, or should send their commissaries hither, the communities are bound to provide the relay
    teams for a distance of 4 miles, there and back.


    § 9. Further, His Serene Highness reserves, should he'
- page: 16
  en: 'obtain the right of patronage over the church at Betsche, the right of patronage; however, the
    town and village communities shall have the right to elect the clergyman and to put him forward in
    nomination, which nominated clergyman His Most Serene Highness [is] to present to the episcopal Consistory.


    § 10. promise.


    The lawsuits between the community of Stocki and the Prince von Hohenlohe concerning ownership of
    the Stocki marsh; between the Prince von Hohenlohe and the possessor of Zilomyśl[?] concerning the
    right of admission [of cattle]; and between the Landrath von Schmaeling as possessor of the demesne
    farm in Glożewo and the Prince von Hohenlohe, Serene Highness, concerning confirmation of the privilege;
    as also the'
- page: 17
  en: 'lawsuit between the Prince von Hohenlohe and Hertzig in Lowino concerning the restitution of the
    Szalestwo, the communities take over at their own risk and cost, and whatever they may win in litigation,
    or obtain by way of settlement, falls to the communities, without His Serene Highness having the least
    claim thereto.


    § 11. The competence-taxes and other public and further dues hitherto paid by His Serene Highness
    as Dominium of Betsche, whatever(5) they(6) names(7) have(8) and(2) (3) costs(4), among which also
    belong the sick-transports into the Schiller and Puncten Hauländer, as also the carting for the fetching
    in and conveying away of the court, and by whatever other names they may be called, the said town
    and village communities take over; and the latter, should these dues in'
- page: 18
  en: 'future be increased, can demand no compensation from the Prince von Hohenlohe, Serene Highness;
    the communities also take over the contribution of 50 rthl. which His Most Serene Highness promised
    to render to the town school here for 1 year.


    § 12. Both contracting parties undertake to have this contract published before the competent authorities
    and to seek the confirmation, and His Most Serene Highness hereby binds himself to exert himself in
    the best way possible that this contract be confirmed by the competent authorities, and that the consent
    be granted to the communities for the further dismemberment of what has been made over to them and
    [text lost].


    § 13. As soon as the tradition of the Obra demesne farm here'
- page: 19
  en: 'takes place, there shall at the same time be handed over to the town and village communities the
    livestock and farm inventory - as being included in the sale under the purchase and entry sum - in
    the same number as the lessee von Bornstaedt received the same in the year 1800 upon the handing over.


    § 14. This contract shall be binding for His Most Serene Highness the Prince zu Hohenlohe-Ingelfingen
    for himself and His Most High heirs and successors, as also on the part of the town and village communities,
    for all time. And the annual canon or ground-rent of 1000 rtl. to be paid shall be rendered in half-yearly
    instalments of 500 rtl., namely each time at the term of Christmas and the term of St John the Baptist,
    yearly, sub paena Executioni, and sent carriage'
- page: 20
  en: 'free.


    § 15. So long as the communities do not alienate or dismember the parcels of land and rights made
    over to them, the status possivus remains in its present condition. But as soon as the demesne farm
    is dismembered, the hereditary purchasers are bound to have the intabulated items transferred onto
    the [several] parcels and cancelled as against the name of His Most Serene Highness.


    § 16. For the stipulated canon of 1000 rtl. yearly all the communities are liable in solidum, and
    consent to the entry thereof in the mortgage book against their parcels of land; just as, conversely,
    His Most Serene Highness consents that this present contract'
- page: 21
  en: 'be entered in the mortgage book of the Dominium of Betsche and its appurtenances.


    § 17. Finally, the Contrahentes renounce each and every objection, by whatever names they may be called;
    in particular the town and village communities renounce the objection of injury beyond the half, which
    was explained to them to this effect, that if the agreed purchase and entry sum exceeded the true
    value of the parcels of land and rights made over by double, they would be free to withdraw from the
    contract.


    § 18. His Most Serene Highness reserves to himself the superintendence over the costs, which he will
    entrust to the Royal Chief Forester Feller, and the communities undertake to indemnify him'
- page: 22
  en: 'for his pains and to come to an agreement with him thereon.


    Thereupon, since nothing further was to be brought forward, the negotiation was closed, the protocol
    read out, interpreted by the sworn interpreter Eichaust to the deputies of the town and village communities
    who are not fully conversant with the German language and who had requested the keeping of a separate
    side-protocol in the Polish language, approved and signed; whereby it was further noted by the [uncertain:
    Contrahenten] that the costs of the recording, expedition, publication and confirmation are to be
    borne in halves by both parties. Read out, approved and'
- page: 23
  en: 'signed. Read myself and approved. Johann Wilhelm Glenk, Most Princely Hohenlohe-Ingelfingen General
    Plenipotentiary. Peter Friedrich August v Triebenfeld. Jan Chmara, as authorised representative. Mateusz
    Myłnkiewicz, authorised representative, plenipotentiary. Josef Echaust as interpreter. Metzig,


    Justitiarius.


    Neumann, Actuarius. Actum Betsche, the 29th of July 1804. To-day there appeared


    1, the Princely Hohenlohe-Ingelfingen General Plenipotentiary, Building Councillor Johann Wilhelm
    Glenk; likewise the special plenipotentiary of the burghership, the said Matheus Myłnkie-'
- page: 24
  en: 'wicz; 3, the plenipotentiary of the communities of Kuligow, Stalluhn, Szartzig, Stoki, Schwichodzin,
    Lowin, [namely] Chmara, and bring forward the following in addition to the contract recorded yesterday:


    § 1. The Prince von Hohenlohe, Serene Highness, assures the communities that apart from the mortgage
    capitals already called in, none shall be called in within half a year.


    § 2. The town and village communities undertake to bear for ever, in the event of criminal investigations
    arising, the costs of investigation, insofar as the remaining communities belonging to the Betsche
    Schlüssel are not themselves bound to bear the same. Therewith the negotiation was closed, the protocol
    read out, [and] to the deputies of the community, who'
- page: 25
  en: 'are not entirely conversant with the German language [and] had requested the keeping of a protocol
    in the Polish language, interpreted by the sworn interpreter Echaust, approved and signed. Johann
    Wilhelm Glenk.


    J. Chmara mpp


    M. Młynkiewicz


    Metzig


    Neumann. Since now an authenticated engrossment is needful, and has been requested on that account,
    the present engrossment is issued in witness thereof under Our seal and signature.


    Done at Betrche, the 7th of December 1804. Princely Hohenlohe-Ingelfingen Court-Office.


    Metzig


    Neumann (Copy) Friedrich Wilhelm, King of Prussia p. p. Our gracious greeting first. Whereas the investigation
    occasioned by the dismemberment and alienation of the Lordship of Betsch to the burghers and residents
    there, initiated by the Prince zu Hohenlohe-Ingelfin-'
- page: 26
  en: 'gen, has shown that the acquirers under the hereditary lease will be able to subsist under the
    contract concluded with them and to remain in a lasting condition fit for performance, and that the
    public dues resting upon the Lordship are secured, We have Ourselves, in the highest instance, upon
    the enquiry made to Us in this matter, now, by the tenor of the Cabinet Resolution of the 29th of
    last month, been pleased to grant Our approval to the said alienation and dismemberment in the manner
    initiated; and since We, with regard to the proposals made by the hereditary acquirers, that


    1, their society be always regarded as a district estate which is represented by'
- page: 27
  en: 'the Prince Hohenlohe-Ingelfingen, and whose rights have been exercised in his name through them;


    2, that the supervision of the forests there be left to the Prince exclusively and under the lawful
    concurrence of the provincial police;


    3, that in their relation to the flat country, insofar as the matter requires it, and as a district
    estate of the Meseritz district, the Landrath''s office be given them as the authority of dependence
    - have found nothing to object to, and have most graciously acceded to the granting thereof; and We
    hereby make the same known to you for your information, with the injunction to inform the interested
    parties hereof, and also [text lost] to collect the amount of the liquidation of'
- page: 28
  en: 'the per diems and travel expenses of the Chief Bailiff Jahr and the Chief Forester Feller, as annexed
    in copy, and to pay 20 rtl. 8 ggr. to the said Jahr and just as much to the said Feller. We remain
    graciously disposed towards you. Posen, the 10th of May 1806. Royal South Prussian War and Domains
    Chamber. G. O. Köller. Concordat cum originali. Mielęcki


    Hedel[?]


    To


    the Landrath


    v Mielęcki. The agreement of the foregoing copy with the judicial records is attested


    Frost, Tribunal Archives'

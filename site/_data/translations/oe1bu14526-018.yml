  en: 'wicz; 3, the authorised representative of the communities of Kuligow, Stalluhn, Szartzig, Stoki,
    Schwichodzin, Lowin, Chmara, and they bring forward the following to the contract recorded yesterday:


    § 1. His Serene Highness the Prince of Hohenlohe assures the communities that, apart from the mortgage
    capitals already called in, none shall be called in within half a year.


    § 2. The town and village communities undertake to bear for ever, in the case of criminal investigations
    arising, the costs of the investigation, insofar as the remaining communities belonging to the Betsche
    key are not themselves bound to bear them. Therewith the proceedings were closed, the protocol read
    out, to the deputies of the community, who'

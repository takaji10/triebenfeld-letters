    heating the court room and the court servant''s quarters. In like manner the communities are also
    bound, when His Most Serene Highness or His commissioners are present here, to furnish and cart the
    necessary firewood free of charge.


    § 6. As regards the timber-purchase contracts concluded between His Most Serene Highness and certain
    merchants, His Highness promises to satisfy the timber purchasers, without the communities making
    any contribution thereto.


    § 7. The town and village communities named at the outset bind themselves, on alienations of their'

  en: 'Hohenlohe, His Serene Highness, a contract over all the plots of ground and profitable rights belonging
    to the lordship of Betsche.


    Likewise Chmara submits a judicial power of attorney of the 5th of April 1804, according to which
    he is authorised by the communities of Stalluhn, Kulligowo, Schartzig, Stoki, Schwiechoczyn, Lowin,
    on the same footing as Młynkiewicz, to conclude a contract. After negotiations carried on between
    the parties, and after the heads of agreement of the 16th of July 1804 had been produced, and the
    personal capacity of the appearing parties to conclude contracts was subject to no doubt, the contract
    was recorded as follows.



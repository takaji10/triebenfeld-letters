    to pay the costs occasioned, but receive the 7000 rtl. back again, however without interest.


    § 4. The handing over follows as soon as the 28000 rtl. which are to be paid on the 5th of August
    have been paid. Since however the former tenant Bornstädt is still in possession of the demesne farm
    here, and a lawsuit over his ejection is pending, the'

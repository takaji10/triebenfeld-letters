  en: 'lands, to pay 10 per cent transfer fee to His Most Serene Highness and his successors in possession,
    from the purchase sum. From these transfer fees are however excepted those holdings which the communities
    now intend to lay out; but if these are sold in future, the transfer fee of 10 per cent shall likewise
    be paid on them.


    § 8. Further, His Most Serene Highness reserves that, when He himself or His successors in possession
    come hither, or should send their commissioners hither, the communities are bound to provide relay
    teams for a distance of 4 miles there and back.



- page: 15
  en: 'plots of ground, to render 10 per cent transfer fee (Laudemium) on the purchase sum to His Most
    Serene Highness and his successors in possession. From these transfer fees, however, are excepted
    those holdings which the communities now intend to lay out; but if these are sold in future, then
    the transfer fee of 10 per cent is likewise to be rendered thereon.


    § 8. Further, His Most Serene Highness reserves that, when His Most High self or his successors in
    possession come hither, or send their commissioners hither, the communities are bound to provide the
    relay teams over a distance of 4 miles out and back.



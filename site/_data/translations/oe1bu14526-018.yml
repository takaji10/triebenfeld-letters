  en: 'the proceedings of the 28th of July of this year, as also the supplement of the 29th of July of
    this year, set out more fully, reading thus: Actum Betsche, the 28th of July 1804. There appeared


    1, the Princely Hohenlohe-Ingelfingen general attorney, building councillor Glenck, to whom His Most
    Serene Highness has assigned the Councillor of War and Forests von Triebenfeld, hereditary lord of
    Schweinerne and Kontop, as His Most High friend and assistant.


    2, the burgher and town representative Matheus Młynkiewicz as authorised representative of the burgesses
    of Betsche,


    3, the free village mayor Johann Chmara of Stalluhn as authorised representative of the village communities
    of Stalluhn, Kulligowo, Schartzig, Stocki, Schwiechodzyn, Lowin'

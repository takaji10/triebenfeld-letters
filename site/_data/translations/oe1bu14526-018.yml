  en: '§ 2. duly agreed purchase and hereditary-tenure sum of one hundred and eighty thousand Reichsthaler
    in Royal Prussian Courant according to the coinage standard of 1764, and an annual ground-rent of
    one thousand Reichsthaler in Courant according to the same coinage standard.


    § 3. With regard to the payment of the purchase and hereditary-tenure sum, it is held in this manner:


    The town and the remaining village communities take over ad rationes pretii the following named mortgage
    debts intabulated against the lordship of Betsche in the mortgage book of the Royal Government at
    Posen, namely



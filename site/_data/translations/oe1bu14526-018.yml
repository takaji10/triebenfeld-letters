  en: forest and other buildings are made over to the communities likewise as hereditary property, yet
    the communities are bound to leave the foresters the dwelling of one room in the foresters' houses
    until Michaelmas of this year, as also the use of their gardens. His Serene Highness also reserves
    the castle as the seat of the court, the dwelling of the court servant, and a dwelling for His Most
    High self or His commissioners, also stabling for 2 horses, which they themselves maintain in repair.
    In the case of building works on this edifice, the communities are bound to let His Serene Highness
    the Prince of Hohenlohe-Ingelfingen and his successors have the bricks at cost price, and to deliver
    the timber for the construction from the heath free of charge. Also
  names:
  - de: Hohenlohe Ingelfingen

    Friedrich Ludwig of Hohenlohe-Ingelfingen, the burgesses of Betsche and the village communities named
    above, on the basis of the heads of agreement dated Alt Schartzig, the 16th of July 1804. The Princely
    Hohenlohe attorney, the building councillor Johann Wilhelm Glenck, produces the general power of attorney
    of the Prince of Hohenlohe of the 26th of April 1803, by which he is authorised to conclude agreements
    validly, of which power of attorney a certified copy was taken to these records.



  en: 'Hohenlohe, His Serene Highness, a contract over all the plots of land and profitable rights belonging
    to the lordship of Betsche.


    Likewise Chmara presents a judicial power of attorney of the 5th of April 1804, by which he is authorised
    by the communities of Stalluhn, Kulligowo, Schartzig, Stoki, Schwiechoczyn, Lowin, on the same footing
    as Młynkiewicz, to conclude a contract. After negotiations had been conducted on both sides, and after
    the heads of agreement of the 16th of July 1804 had been produced, and the personal competence of
    the parties appearing to conclude contracts was subject to no doubt, the contract was recorded as
    follows.



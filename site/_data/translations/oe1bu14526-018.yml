- page: 12
  en: 'communities do not indeed insist that possession of the demesne farm be granted to them at once,
    but will rather be content that, so long as the judgment of ejection is not legally final, he remain
    therein and be evicted only when the judgment of ejection is legally final; yet for this there shall
    be given to the communities by His Serene Highness the Prince a fair and suitable compensation proportionate
    to the matter. As regards on the other hand the forests, these shall at once be closed, as indeed
    they already are now, and the timber felled therein, insofar as it has not been felled for the husbandry,
    remains the property of His Serene Highness the Prince of Hohenlohe-Ingelfingen.


    § 5. All the manorial dwelling, husbandry,'

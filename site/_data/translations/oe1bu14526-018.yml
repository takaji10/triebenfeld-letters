  en: 'Copy


    No. 92.


    We, the Princely Hohenloh-Ingelfingen Court Office of the lordship of Betsche, hereby make known and
    declare to all and sundry, but particularly wherever it may be needful to know, that there appeared
    before Us:


    1, the Princely Hohenlohe-Ingelfingen estates director and general attorney, building councillor Johann
    Wilhelm Glenck, of the one part,


    2, likewise the authorised representatives of the town and rural communities, namely of the town of
    Betsche, the village of Staluhn, Schartzig, Schwichodizyn, Stocki, Lowin and Kulligowo,


    a, the burgher and town representative Matheus Młynkiewicz


    b) the free village mayor Johann Chmara, and that they have concluded a hereditary lease contract
    over the estates of the lordship of Betsche, as'

- page: 27
  en: 'the Prince of Hohenlohe-Ingelfingen, and whose rights have been exercised in his name through them;


    2, the supervision over the forests there be left to the Prince exclusively and under the lawful concurrence
    of the provincial police;


    3, in their relation to the flat country, insofar as it requires it, and as a district estate of the
    district of Meseritz, the office of the district administrator be given them as the authority of resort
    to which they are subordinate


    — We have found nothing to object, and have most graciously conceded the granting thereof, and make
    the same known to you herewith for your information, with the charge to inform the interested parties
    of it, and also from [text lost] to collect the amount of the liquidation annexed in copy'

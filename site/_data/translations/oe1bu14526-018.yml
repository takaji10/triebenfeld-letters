  en: forest and other buildings are made over to the communities likewise as hereditary property; the
    communities are however bound to leave the foresters their dwelling in one room in the foresters'
    houses until Michaelmas of the current year, as also the use of their gardens. His Serene Highness
    also reserves the castle for the seat of the court, the dwelling of the court servant, and a dwelling
    for Himself or His commissioners, also a stable for 2 horses, which they shall themselves maintain
    in good repair. In the case of building work on this edifice, the communities are bound to let His
    Serene Highness the Prince of Hohenlohe-Ingelfingen and his successors have the bricks at cost price,
    and to deliver the timber for the building free of charge from the heath. Also

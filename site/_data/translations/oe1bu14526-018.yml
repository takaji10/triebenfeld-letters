- page: 14
  en: 'the communities are bound to furnish and cart in, free of charge from the forest, the wood needful
    for heating the courtroom and the court servant''s quarters. In like manner the communities are also
    bound, when His Most Serene Highness or his commissioners are present here, to furnish and cart in
    the needful firewood free of charge.


    § 6. As regards the timber purchase contracts concluded between His Most Serene Highness and certain
    merchants, His Most High self promises to satisfy the timber purchasers, without the communities making
    any contribution thereto.


    § 7. The town and village communities mentioned at the outset undertake, upon alienations of their'
  numbers:

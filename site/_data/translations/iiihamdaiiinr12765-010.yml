- page: 2
  en: 'As regards Kamionna, these are beyond dispute the same estates which the Prince sold to the bank
    cashier Leixner of Frankfurt an der Oder; the [uncertain: Magistel] of the 55000 rt. and the interest
    are therefore the Bank''s to demand, and the Prince has long since been satisfied. Meanwhile I await
    on this point Your Right Honourable''s closer investigation and your report as soon as possible.


    Vienna, the 6th of June 1815


    In His Serene Highness''s name.


    Executed by His Serene Highness in the fair copy.'

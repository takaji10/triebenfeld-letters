status: draft
segments:
- page: 1
  en: 'To the urgent[?] Mr von Zerboni Sposetti, [uncertain: Zahlrungen] at Poznań.


    I send Your Right Honourable, in the original, two letters of the Royal Prince of Hohenlohe, to me
    of 12 rt. and to the Minister of State Baron von [uncertain: Stein] of 12 April, concerning the claims
    which the Prince seeks to assert on account of the estates Kamionna and Trąbczyn


    taken from him.


    Since Your Honour is fully acquainted with the position of these matters, I most respectfully request
    you to inform me of the steps that may yet be taken in the Prince''s favour.'

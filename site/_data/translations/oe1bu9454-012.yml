- page: 1
  en: 'Send Your Serene Highness the 200 ducats with all haste, or I must shoot myself dead; I could not
    bear the disgrace that the Prince himself should think ill [uncertain: wähnte — "imagine"], and in
    the end grow angry, for then, as well as matters now stand, all would nevertheless be lost. It is
    hard here to get through and to get at people, and now to have any effect. But the devil may do that
    — only, one can accomplish nothing here when one has no money. For the rest, do take care that Prince
    August demands the power of attorney back from Cosmar quickly. People here have no very good opinion
    of the young gentleman — although he now wears a moustache — as regards the written undertaking given
    by him, be well on your guard — As I hear, you have indeed left the written undertaking behind in
    Öhringen. It could be that you might have great need of it — the King of Würtemberg has, it is true,
    already recognised the mediatised princes as Estates and has sent here a project for a constitution
    drafted by himself — but has paid no heed to it. Besides, the Estates have already protested against
    it. As to the 200 Th. I now beg urgently — otherwise things go badly. This 4th of March 1815'

- page: 1
  en: '12 Your Serene Highness, send the 200 # with the greatest haste, or I must shoot myself dead; I
    could not bear the disgrace that the Prince himself should also [uncertain: have imagined it] and
    in the end grow angry, for then, as good as matters now stand, everything would nonetheless be lost.
    It is hard here to get through to people and to reach them, now, in order to have any effect. But
    the devil alone may [uncertain: do all that] when one has no money. Here one can accomplish nothing.
    For the rest, do see to it that Prince August promptly demands the power of attorney back from Cosmar.
    People here have no very good opinion of the young gentleman — although he now wears a moustache —
    as regards the written undertaking given by him, do be well on your guard — As I hear, you have indeed
    left the written undertaking in Öhringen. It could be that you would stand in great need of it — the
    King of Württemberg has, it is true, already recognised the mediatised as Estates and has sent here
    a draft constitution of his own drawing up — but paid no heed to it [uncertain: Moreover the Estates
    have] already protested against it. I now urgently beg for the 200 # — Otherwise things go badly,
    the


    4 March 1815 [v. Triebenfeld]'

status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests! I have the honour of communicating
    to Your Right Honourable a few further matters which have come in with today''s mounted post from
    the [uncertain: e. H.] Glenck. I had already put the princely letter into the post when I received
    the command of His Serene Highness the Prince to add by way of postscript that which I here append
    in an extract, in copy. His Serene Highness believes that it might be of use to the same. His Highest
    Self finds himself better today than yesterday, in that the attack had drawn from the right hand into
    the left foot, and yesterday pained him severely there; yet this pain ceased during the night and
    was not even, upon the stretching of the tendons,'
- page: 2
  en: any longer perceptible. We all hope for the best. Herr Bergrath Bernhardi has arrived here; yet,
    as I myself saw yesterday, not quite in health. His Serene Highness sent me to set him at ease on
    that account, since on account of his continuing indisposition he was not yet able to pay his respects.
    Your Right Honourable will permit me, finally, to append the most heartfelt wish for your recovery
    and for the most perfect and continuing health, and at the same time to commend myself to your further
    and inestimable favour. Ever in the most perfect veneration, Your Right Honourable's, Breslau, the
    8th of March 1805, humble and obedient servant A. Hahn

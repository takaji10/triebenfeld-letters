  en: '165


    Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests!


    I have the honour to communicate to Your Right Honourable a few further items which have come in by
    today''s riding post from Mr Glenck. I had already put the princely letter in the post when I received
    from His Serene Highness the Prince the order to say, by way of a postscript, what I here enclose
    in an extract copy. His Serene Highness believes that it may be of use to you. His Highness finds
    himself better today than yesterday, in that the attack had drawn out of the right hand into the left
    foot, and yesterday pained him severely there; this pain, however, ceased during the night, and was
    even, upon the stretching of the tendons,'
  names:
  - de: Glenck
    en: Glenck
    kind: person
  numbers:

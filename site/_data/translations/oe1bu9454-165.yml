- page: 2
  en: 'no longer perceptible. We all hope for the best. Mining Councillor Bernhardi has arrived here,
    though, as I myself saw yesterday — not altogether in health — His Serene Highness sent me to reassure
    him on that account, since on account of his continuing indisposition he has not yet been able to
    pay his respects. Your Right Honourable will permit me finally to append the most heartfelt wish for
    your recovery and for your most perfect and continuing health, and at the same time to commend myself
    to your further inestimable favour, ever in the most perfect veneration. Your Right Honourable''s,


    Wrocław, the 8th of March


    1805.


    humble and obedient servant


    A. Hahn'

segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests!


    I have the honour of communicating to Your Right Honourable some further matters which came in with
    today''s riding post from Mr. Glenck. I had already given the princely letter to the post when I received
    from His Serene Highness the Prince the command to add in a postscript what I here enclose in copy
    by way of extract. His Serene Highness believes that it may be of use to the same. His Most Serene
    Self finds himself better today than yesterday, inasmuch as the attack had withdrawn from the right
    hand into the left foot, and yesterday gave severe pain there; however this pain ceased during the
    night and was indeed, upon the stretching of the tendons,'
  names:
  - de: Glenck
    en: Glenck
    kind: person
- page: 2
  en: 'no longer perceptible; we all hope for the best. Mr. Bernhardi, mining councillor, has arrived
    here, though as I myself saw yesterday — not altogether well — His Serene Highness sent me to set
    him at ease on that account, since He, on account of his continuing indisposition, had not yet been
    able to pay his respects. Your Right Honourable will permit me finally to append the most heartfelt
    wish for your recovery and for the most perfect and lasting health, and at the same time to be permitted
    to commend myself to your further and invaluable favour, ever in the most perfect veneration. Your
    Right Honourable''s,


    Breslau, the 8th of March


    1805.


    humble and obedient servant


    A. Hahn'

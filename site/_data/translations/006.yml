status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord, I received yesterday Your Most Serene Highness''s most
    highly honoured letter of April, and as Prince Adolph departs today, I report thereupon what I know.
    In the Würtemberg matter [uncertain: In Würdembergsehen] there is for the present nothing to be done;
    this depends upon the conjunctures, 7 — I have at this time only two matters in view, that is the
    indemnification in the [uncertain: Außischen] share, and the Curish affair. In respect of the first
    I must [say] only that the Emperor and King must, and will, indemnify, but to which end again neither
    Zerboni nor any other vermin of the act[ion] can help — rather I hear that these Italians may be most
    obstructive. I have demanded the starosties Sokolnik together with Wieruszew; this yields rth by night
    and is set off against Your Serene Highness''s claim. — Minister Stein will in this matter be alone
    with Nesselrode, and Your Highness will [find that] what they will, they confirm; insects belong under
    their feet. — The 85/[uncertain: m] d. from Kaemen is money given in cash by Your Serene Highness,
    and therefore [I] may give the word for it in his time. The Curish affair now stands somewhat droll
    — the Cabinet Councillor Allbrecht ordered me / after a fortunate return / to give him the accompanying
    copy of the letter — this was done, and now the King knows everything. — Now I received through Stägemann
    the urgent and honest commission to come to terms with the Carish [heirs?] — this matter is now in
    hand — An old friend is handling the [uncertain: Donner] and shortly I hope to be at the margin. For
    the rest, most gracious Prince and Lord, you give [uncertain: ſehr ſchrift] one believes you, that
    Prince Hardenberg has done anything in your affair, or ever will do anything'
- page: 2
  en: 'This great man promises eternally and keeps nothing — Nor would he at that time, with his Stägemann,
    have called for the report from Brieg, had the latter only been able to suspect that Cosmar stood
    so near the pit. — There then remained nothing but sheer [uncertain: schur lische] delay, since one
    obtained the confirmation from a provincial collegium. — Corpse-like stood Stägemann when he heard
    of Cosmar''s mishap from my own mouth — one combined the circumstances — but could not discover the
    cloud from which the lightning-bolt had come. Even Prince H. (the testing man) started up from his
    chair when Barbe told it to him in a [uncertain: Sarhörsiſchen] tone. The bacchanalia at Syten were
    in too fresh remembrance with everyone / Aphrodite had pitched her seat there and created only — pleasure
    — every voluptuary and glutton visited this temple of the aforesaid H. v. Meanwhile envy stirred all
    too much — even great persons [uncertain: ſahren dazu ſchmel] and gladly; malcontents crept about
    this temple of pleasure so long until they found occasion to peer into [uncertain: Jannen] and to
    illuminate the whitewashed image more closely. Two [uncertain: kopillen] Councillors now came forward
    and demanded a speedy accounting — which however to this day has not been rendered. — A still speedier
    [uncertain: Annahmung] of the Curish heirs, in the form of a denunciation, followed, in which these
    declared that Cosmar had offered them the Syten estates for their claim, whereby one [saw] that the
    thief wished to save himself. — [uncertain: Gericht], but you, most gracious Prince, [are] not to
    speak of it — for it is enough that my two friends in Berlin and I here [are] awake. My plan and that
    of Cabinet Councillor Albrecht you will see from the enclosure; in 2 days I shall have the King''s
    declaration. If he pays, à la bonheur — if he disclaims, then the settlement is concluded within 2
    times 24 hours, and the advance must be furnished. — The game stands well; in any case I beg [uncertain:
    defach]'
- page: 3
  en: Only count nothing on St.'s account; he has, by God, done nothing. — It could be that now many a
    one will wish to become a knight in the affair; I too shall bar no one's path — only in the end you
    and everyone will be astonished at how the marionettes were guided. From Pourtales there is still
    no answer — we therefore believe that [he is] bought. He seeks only to withdraw his capital out of
    France. Adolph's affair has thus far gone quite well, yet of that more in its time. — For the rest,
    he has himself seen how everything stands here and how one must knock about here — Without money it
    is a frightful life here — and I have, as God is true, nothing, [and] most of all Adolph himself —
    He takes much with him — but I had not the heart to ask him for anything. — Only send 100 ducats,
    and indeed by express courier, or the devil take me, that shall win you hundreds of thousands; so
    do not let me perish in want and disgrace. — August is a wretched, miserable man; the accompanying
    letter from Langenburg proves this to you, and one of identical wording lies with Wintzingerode. But
    he shall rue it — He cannot by right be called lord of the entailed estate and Prince of Öhringen.
    If only I knew first what sort of man Adolph will become. My head pains me frightfully, so that it
    is impossible for me to write further. In deepest reverence I remain, as Your Serene Highness's —
    Beugelin commends himself to your grace, and so too Barbe. The piece to Albrecht I beg to have back
    again, as I have no copy. pr. C. Hoffett and money — faithful and most obedient servant v Triebenfeld
    Vienna, the 6th of May 1815.

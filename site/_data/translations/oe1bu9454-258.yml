- page: 1
  en: 'To Your Most Serene Highness I have had the honour of writing in the matter of the Prince of Hohenlohe
    under the 23rd of October and the 28th of November, and to owe the granzstatoth [uncertain: granzstatoth].
    Your Serene Highness caused it to be disclosed only today through the Privy Councillor of State Stägemann
    that this matter was to be laid before a commission in Berlin for decision. This is in general the
    E. a hohenlose Weißl. Yet it seems herein to have been left entirely out of consideration that the
    interest of the State is bound up in the matter of the discharge of the Carz debt.


    In the representations mentioned above I had the honour to submit that the Courland heirs would regard
    the whole debt as satisfied with 112000 Rthl, in such wise that they would be willing to hand back
    the documents; that the Prince of Hohenlohe makes himself liable to discharge this State debt of 112000
    Rthl by means of instalment payments of 25000 Rthl annually, but that besides this he is minded to
    discharge as well the 35000 Rthl drawn in the year 1790 from the Royal Kr[?] Treasury at Breslau.


    For the whole of the aforesaid there accrues to the State an advantage of 46000 Rthl; but all this
    is lost to the State if, instead of Rflatiren [uncertain: Rflatiren] upon my proposal, enquiries are
    made of Count Wratislaw, who as former guardian must constantly have the best interest of his ward
    in view.


    The Kurz heirs / the Duchess of Sagan etc. / are now in need of money. The debt of 426000 Rthl is
    discharged with 112000 Rthl. For this I furnish, if the advance is given to the Prince — since only
    he, and not the King, who has already once renounced it and cannot break his word, must pay — a security
    of 60000 Rthl, and I await nothing further from Your Most Serene Highness than that You might appoint
    an hour in which I may set this out to You more fully.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    to send this back again at once


    no copy, and the post is going out


    Vienna, the 7th of December 1814


    most humble and obedient servant


    v. Triebenfeld'

  en: '258 To Your Most Serene Highness I have had the honour of writing in the matter of the Prince of
    Hohenlohe under the 23rd of October and the 28th of November, and to owe the [text lost]tegranzstatoth[uncertain:
    ], Your Serene Highness only today caused it to be made known through the Privy Councillor of State
    Stägemann that this matter was to be laid before a commission in Berlin for decision. This is in general
    the F. a Hohenlohe Weißl. Yet it appears herein to have been left quite out of consideration that
    the interest of the state is involved in the matter of the discharge of the Chancery debt.


    In the submissions mentioned above I had the honour to set forth, "that the Cour[land] heirs would
    regard the whole debt as followed with 112000 Rthl in such manner that they would hand back the documents
    — that the Prince of Hohenlohe makes himself contestable to discharge this state debt of 112000 Rthl
    by means of instalment payments of 25000 Rthl yearly, but besides this is minded to discharge as well
    the 35/m. rt drawn in the year 1790 from the Royal Treasury at Wrocław." For the whole of the aforesaid
    there accrues to the state an advantage of 461/m Rthl, but all this is lost to the state if, instead
    of Rflatiren upon my proposal, inquiries take place with Count Wratislaw, who as former guardian must
    constantly have the best interest of his ward in view.


    The Kurz heirs / the Duchess of Żagań etc. / are now in need of money. The debt of 426/m. rt is discharged
    with 112/m. rt. For this, if the advance is given to the Prince — inasmuch as only he, and not the
    King, who has once already disavowed it and cannot break his word, must pay — I furnish a security
    of 60000 Rthl, and I merely await from Your Most Serene Highness that you might appoint an hour at
    which I may lay this out to you further.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    to send this back again at once


    [text lost] no copy, and the post is just going.


    Vienna, the 7th of December 1814


    most humble and obedient servant


    v Triebenfeld'

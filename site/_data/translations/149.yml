status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! I still await the arrival of the Oder and Nezzbruch people.
    From Wednesday onward they will probably present themselves in droves, and then I hope to be swiftly
    at the goal of my wishes. Several parcels which I would have struck out from the Swięce ones, and
    which lay about the boundary as waste corners, I have sold very advantageously; I not only place the
    soil, which was not esteemed at all, well with a buyer, but likewise [uncertain: the figure] now,
    so as to be able to conclude better with the large purchasers upon regular plots. From the plan I
    once drew up I shall not depart, and I stand surety that no Hufe is to be given away under 600 Rthl
    (that is to say, ground-money and interest taken together). If it has succeeded even with the very
    worst parcels, then it will not fail me with the better ones. The assessment will probably be completed
    this week and, as I hope, will come out at over 400000 Rthl for the Zagorow estates. By this means
    all ill-will is defied; I take in'
- page: 2
  en: Berlin as much money as is needful for the payment of the Schlabrendorff, Legnowelii and other pressing
    creditors, and pay them. Gradually the money for these parcels comes in; one pays off that debt again,
    and in this way nothing is lost through precipitancy and the great object is attained. It goes hard,
    very hard, for much has been spoiled by the easy earlier sales; nevertheless my perseverance will
    prevail, for that I answer. The recent vexation with Glenck, where the man tells me to my face that
    I wish to wrest from him his property, and the annoyance with the Olesnice hereditary lessees who
    have been stirred up, have brought upon me a frightful colic which compelled me to keep my bed for
    3 days; I am still very much out of sorts. For the rest, the Wrgbin subjects have protested against
    their contract and refuse to render the interest. Their complaint is that Glenck has threatened them
    to take away their parcels and to give them others in their place; besides this they complain that
    Glenck's clerk has compelled them to serve throughout the whole year still, and that he, since he
    could not use all the services on the Vogtey, has sent the subjects to Zagorowo, where they must work
    for the townsmen, and for which
- page: 3
  en: 'the Meyer has himself paid 4 gg. daily per person / of whom there are 18 /. The subjects find this
    too hard, that they should be sold like slaves into service to other, foreign persons. The Meyer has
    moreover made it known to the people that he intends to draw all 18 farmers wholly to the Voigtey,
    and that Glenck wishes to sell them along with it to the von Marowecke, who in that manner gives 15000
    Rthl for the Voigtey. The subjects implore that Your Serene Highness might not permit this; they will
    gladly give a [uncertain: Rund] per Morgen of their fields and perform everything else that lies within
    their powers. I have referred the people with their petitions and lamentations to the justice-burgomaster
    Schenck, and requested him to quiet them and to bring the matter into order, so that Glenck may not
    cry out again that I wish to wrest from him his well-acquired property. In deepest reverence I remain,
    until death, Your Most Serene Highness''s Trąbczin, the 2nd of December 1804 most humble and obedient
    servant v Triebenfeld'

status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! The affair with Prince George grows ever more
    precarious, and the distress on my side ever greater. President v. Schuckman writes to me that he
    has duly delivered my letters to the Prince; the Prince notwithstanding answers not a syllable, and
    sends no remittances either. The Jew Kuh has brought suit against me over the 5800 Rthl; he has already
    an execution decree, and on Friday I am to pay or be arrested — on that account I was yesterday at
    Dyhrenfurth; the Minister assured me that he would be in Breslau today and would wish to pacify the
    Jew. Just now I was at his lodging, where it is said that he would not come until Thursday. It is
    truly frightful how the Prince treats me. In Berlin he has 120000 house the estates lodged — thereafter
    he has drawn through Schuz 55000 Rthl — here he has drawn, according to the cursed bills of exchange,
    about 23000 Rthl. The costs p.p. 8000 of these are Sum. 206000 Rthl. Now there stand yet upon the
    estates 64000 Rthl of debt.
- page: 2
  en: 'In this manner the dear Prince has already encumbered the estates with 270000 Rthl — I sold them
    to him for 280000 Rthl, and the remainder is 10000 Rthl. This is truly the grossest fraud, to cheat
    an honest fellow out of his fortune in so short a time, and afterwards to plunge him into disgrace
    and mockery besides, so that I am threatened with arrest. How this is to turn out I do not know; I
    cannot let myself be arrested. If the Minister does not pacify the Jews Kuh and the 5800 Rthl, then
    the [uncertain: uproar] breaks loose + on the first Lupman Meyr wants to have the 20000 Rthl — and
    on the 7th of August the 12000 Rthl are to be paid. This is a sum of 37800. I have nothing, for my
    whole credit is gone — Frankly confessed, I cannot await the ignominy nor let myself be arrested;
    I am going away, shall seek out the Prince, and where I find him, I [uncertain: church] myself — let
    follow then what will — the [uncertain: world] will then learn how shamefully this Prince has deceived
    me. Did Your Most Serene Highness know a way out for my rescue, [text lost] would be eternally grateful.
    I [uncertain: remain] Your Most Serene Highness''s most faithful servant v Triebenfeld Breslau, the
    22nd July 1800'

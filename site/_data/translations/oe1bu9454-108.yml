segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The affair with Prince George grows ever more worrying, and the distress on my side ever greater.
    President von Schuckman writes to me that he has duly delivered my letters to the Prince; the Prince
    notwithstanding answers not a syllable, and sends no remittances either. The Jew Kuh has sued me over
    the 5800 Rthl; he already has a writ of execution, and on Friday I am to pay or be arrested — on that
    account I was yesterday at Dyhrenfurth, where Münster assured me that he would be in Breslau today
    and would wish to pacify the Jew. Just now I was at his lodging, and there it is said that he will
    not come until Thursday. It is truly dreadful how the Prince treats me. In Berlin he has secured the
    estates with 120000 [uncertain: house] — then through Schuz he has drawn 55000 Rthl — here he has
    drawn, according to the damned bills of exchange, about 23000 Rthl


    The costs etc.


    8000 of these are, in sum, 206000 Rthl. Now there still stand upon the estates 64000 Rthl of debt'

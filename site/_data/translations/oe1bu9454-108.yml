- page: 2
  en: 'In this way the dear Prince has already encumbered the estates with 270000 Rthl of debt — I sold
    them to him for 280000 Rthl, and the remainder is 10000 Rthl.


    This is truly the grossest fraud: to cheat an honest fellow out of his fortune in so short a time,
    and afterwards to plunge him into disgrace and mockery besides, so that I am threatened with arrest
    — how this is to end I do not know; I cannot let myself be arrested. If the minister does not pacify
    the Jew Kuh [uncertain: Kuh] and the 5800 rt, then the uproar breaks loose + on the first Liepman
    Meyer wants his 20000 rt — and on the 7th of August the 12000 rt are to be paid. This is an item of
    37800 rt.


    I have nothing, for my whole credit is gone — frankly confessed, I cannot wait out the shame nor let
    myself be arrested; I am going away, I shall seek the Prince out, and where I find him, I [uncertain:
    church] myself — let follow then what will — the world shall then learn how shamefully this Prince
    has taken me in. If Your Most Serene Highness knew a way out for the saving of my [uncertain: honour],
    I should be eternally grateful. I remain, until death,


    Your Most Serene Highness''s


    Wrocław


    d 22 July 1800


    most faithful servant


    v Triebenfeld'

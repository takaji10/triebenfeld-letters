- page: 2
  en: 'In this way the dear Prince has already encumbered the estates with 270000 Rthl — I sold them to
    him for 280000 Rthl, and the remainder is 10000 Rthl. This is truly the grossest fraud: to cheat an
    honest fellow out of his fortune in so short a time, and afterwards to cast him into shame and mockery
    besides, so that I am threatened with arrest. How this is to turn out I do not know; I cannot let
    myself be arrested. If the Minister does not pacify the Jew Kuh and the 5800 Rthl, then the racket
    begins + on the first Lupman Meyr wants his 20000 Rthl — and on the 7th of August the


    12000 Rthl are to be paid


    This is an item of


    37800. I have nothing, for my whole credit is gone — Frankly confessed, I cannot wait upon the disgrace
    nor let myself be arrested; I am going away, I shall seek out the Prince, and where I find him, I
    [uncertain: church] myself — let follow then what will — the world will then learn how shamefully
    this Prince has deceived me. Did Your Most Serene Highness know of a way out for my rescue, I should
    be eternally grateful. I [uncertain: remain] Your Most Serene Highness''s most faithful servant


    von Triebenfeld


    Breslau, 22 July 1800'

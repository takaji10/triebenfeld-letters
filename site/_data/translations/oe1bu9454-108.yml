- page: 1
  en: '108


    Most Serene Prince


    Most gracious Prince and Lord!


    The affair with Prince George grows ever more alarming, and the distress on my side ever greater.
    President v. Schuckman writes me that he duly delivered my letters to the Prince; notwithstanding
    this the Prince answers not a syllable, and sends no remittances either. The Jew Kuh has sued me over
    the 5800 Rthl; he already has a decree of execution, and on Friday I am to pay or be arrested — on
    that account I was yesterday at Dyhrenfurth, where the minister assured me that he would be in Wrocław
    today and would calm the Jew. Just now I was at his residence, and there it is said that he will not
    come until Thursday. It is truly dreadful how the Prince treats me. In Berlin he borrowed 120000 rt
    upon the estates — then he drew through Schuz 55000 rt — here he has drawn, according to the accursed
    bills of exchange, about 23000 rt.


    The costs etc. 8000; these are in sum 206000 rt. Now there stand upon the estates a further 64000
    rt of debt.'

  en: '207


    Copy


    Kalisz, the 30th September 1810.


    Pro Memoria. To Your etc. we have the honour most humbly to report that we have now fully seen to
    the institution of the Trąbczyn lawsuit here in Kalisz, and that the hearing appointed for it is now
    set for the 24th October; the reason why this matter has been delayed so long lies in this, that the
    gentlemen at the Tribunal have had vacation these 8 weeks, which only ended with the present day.
    Mr Falz[?], Councillor of Justice, has now taken over this lawsuit and has applied his utmost diligence
    and zeal to it; he has also already given us the sure assurance that the most favourable outcome of
    this lawsuit would follow on our side at the hearing, where the judgment is always published at once
    at the hearing. As concerns the honorarium for Mr Falz, he will not demand anything, but leaves this
    to His Serene Highness''s own disposition. The 200 Rthl advance we have handed over to him, with which
    he was much a stranger [uncertain: contented]. With the administration / it should doubtless read
    sequestration / upon our estates there is now an entire end, and the rumour goes very strongly here
    that the King of Prussia will take back to himself all the moneys outstanding here. God grant only
    that this report may be well founded. With the hereditary leaseholders of Oleśnica it would be best
    if we were permitted to come to terms; they ask for 12 Hufen of land in hereditary lease at a moderate
    canon, and you are then again in full possession of Oleśnica. The complaining and lamenting of the
    Polish peasants and Hollanders is as before, since the grain prices still remain the same and will
    not rise — with the former we have a hearing on the 12th October on the spot, and the latter are still
    not content with 3 gulden per Morgen, and suppose they can subsist only at 2 gulden per Morgen. We
    remain, Your etc., Hecker, Honrichs. NB Mr Friedrich Count Kwilecki asks very much for the promised
    live stag — My remark — to the peasants and Hollanders something might be remitted of the arrears
    — for the future nothing — One lets them travel, which now in Poland can easily happen, all the more
    as Mr von Knobelsdorff would rather have land than interest and reckons it at equal prices. von Triebenfeld'

- page: 2
  en: 'Mr. von Bukowiecki writes to me and will give no more than 2400 Rthl yearly rent for Betsche; the
    man must be mad. A pity about the postage I had to pay for his scribble. Here I also hear that the
    Jew Asch, and Gad, by name a bearer for Schlabrendorff, will nevertheless proceed to sue me over the
    bill of exchange of 11000 given to Schlabrendorff for the [uncertain: Pärzten] by His Serene Highness,
    and take out a decree of execution against me – I beg you for God''s sake, do tell His Serene Highness
    that the Lord should have a care to this, and that the coward who so lied to the Lord should be counteracted
    in the matter – It would be an everlasting disgrace if the official distrainer were sent into the
    house to my wife in my absence – O God, what must one not suffer in this world.'

- page: 2
  en: 'Mr von Bukowiecki writes to me and will give no more than 2,400 Rthl a year in rent for Pszczew;
    the man must be mad? A pity about the postage I had to pay for his scrawl. Here I also hear that the
    Jew Asch and [uncertain: Gad], bearer of Schlabrendorff''s name, are nevertheless going to sue me
    henceforth over the bill of exchange of 11/m given to Schlabrendorff for the [uncertain: Pärzten]
    Serene Highness, and to obtain an execution decree against me — I beg you, for God''s sake, do tell
    His Serene Highness to have the Lord keep watch on this, and that the [uncertain: coward] who has
    so lied to the Lord should be counteracted in the matter — It would be an everlasting shame if in
    my absence the official distrainer were sent into the house to my wife — O God, what does one not
    have to suffer in this world.'

- page: 1
  en: 'Dear Friend!


    In my opinion, let the fellow be called what he will and be what he will, one must seek him out and
    [uncertain: flatter] him wherever one thinks that he can give some disclosure of those [uncertain:
    particular] knaveries. It is after all the way I always proposed - and just so there is still a second
    one which will probably in the end be the best. Only this one must indeed not be left [uncertain:
    unmoved] – Dreadful it is, what all the good, worthy Prince must endure; will one not, if one thinks
    so, tread far too near upon the Lord?


    The world is so full of villains and ungrateful people that at every step one takes [uncertain: forwards]
    one always knocks against some malicious rogue – who makes it his particular duty to push every honest
    man aside. The vicious fellow Wildegansch is here - He tells everyone that the Prince sent him here
    — Several good men have on that account been [uncertain: assigned] - the scoundrel has merely led
    the Prince by the nose; for the rogue with his following merely invented this project concerning a
    money negotiation, which he then set on foot so [uncertain: clumsily] with An and Schlabrendorff,
    and meant to cheat the good Prince over the costs. But as I hear, nothing will be decided in this
    matter within 2 months, after which it will still always be, God knows how? / and for so long the
    Prince will be and is - deceived.


    the gang here [uncertain: sip].


    Until the end I am


    Your


    [uncertain: Undrehnen]


    Berlin, the 31st of January 1805.


    Friend for thy


    v. Triebenfeld'

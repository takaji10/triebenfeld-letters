- page: 1
  en: '109


    Dear Friend!


    In my opinion, let the fellow be called what he will and be what he will, one must seek him out and
    [uncertain: flater], wherever one thinks that he can give some disclosure of those particular knaveries.
    It is indeed the way I always proposed — and just so there is still a second one which will probably
    be the best in the end. Only this one must not be left [uncertain: unbewezt] — It is dreadful, though,
    what all the good, worthy Prince must endure; I [uncertain: wird] not what one thinks, that one presses
    so very close upon the Lord?


    The world is so full of villains and [uncertain: ankbare] people that at every step one takes forward
    one always runs up against some malicious rogue — who makes it his especial duty to shove every honest
    man aside. That vicious fellow Wildegansch is here — He tells everybody that the Prince sent him here
    — Several good people are on that account [uncertain: Aignirt] — the scoundrel has merely led the
    Prince by the nose; for the rogue with his following merely invented this project concerning a money
    transaction, which he then set in train with Asch and Schlabrendorff so [uncertain: hannsch], and
    meant to cheat the good Prince over the costs. But as I hear, nothing in this matter will be decided
    within 2 months, after which it will still be God knows how? / and all that while the gang will sit
    here — and the Prince is — deceived. To the very end I am


    Your


    [uncertain: Undrehnen]


    Berlin, the 31st of January 1801.


    friend and servant


    v Triebenfeld


    I am not writing to His Serene Highness, because I should suppose him to be at Sławięcice; but should
    the Prince''s Serene Highness be there, then lay me at his feet.'

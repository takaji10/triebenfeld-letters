status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! In Berlin it has in the end succeeded better for me than
    I had believed, through the help of friends G. v. K. CV B. the Lord Grand Chancellor gives out of
    the Justice Fund some 176000 Rthl; with this all the burdensome creditors upon the estates, and especially
    H. Weigel here, will be paid. Above all it lies close to my heart to set afloat again the mortgage
    of 200000 Rthl pledged with Oppenheimer. The [uncertain: Ge] Schlabrendorff I shall pay in such manner
    that I take 20000 Rthl upon a Schweiner mortgage from the Councillor of War von Hellen, which I had
    meant to pay over to Madame v Wulffen of Kontop, but which can now still stand over. If all this is
    provided for, then Your Serene Highness will soon be in the clear, particularly since regarding the
    300000 Rthl Gu[?]l debt they are willing to wait, so as to go on receiving the interest. The cursed
    small items of debt press hardest of all, for it is these petty-cash creditors who make the greatest
    outcry over their trifles. Altogether I have this time been in such straits that I must thank God
    a hundredfold if all of it is smoothed out,'
- page: 2
  en: 'Yesterday I arrived here, and this very hour I hasten on to Kalisz and Trąbczyn, in order to drive
    together there whatever is possible, so that I may issue to Your Serene Highness an order to pay a
    sum to Türth. At Betsche I have set everything in order so far that Your Serene Highness need no longer
    be troubled by the creditors there. Eichaust is entirely satisfied and has given a judicial receipt,
    and there remains for Your Serene Highness 4000 Rthl which the Deputies must pay on the 6th of July.
    These I already think to apply towards the 30000 Rthl. Now it depends upon what I shall find at Trąbczyn.
    There the tenants had still 6000 Rthl to pay. 60000 Rthl were to come in as entry-money gulden; the
    Midsummer rent amounts, from the tenants alone, to 10000 Rthl; the peasants'' and hereditary purchasers''
    Midsummer interest comes to some 4000 Rthl; the Wrąbczyn and Swięcie [text lost] pay some 1800 Rthl;
    the Olesnica people are already in arrears to some 16000 Rthl; this amounts to some 102000 Rthl of
    outstanding arrears. It now depends upon whether Schenck has been a Can: or an honest, diligent fellow.
    For he has the commission to collect in whatever is possible, so that Your Serene Highness may receive
    a substantial sum at Midsummer. Grattenauer is a lazy, false beast — he does nothing,'
- page: 3
  en: and now sits continually with the Minister, who, as I hear just this moment, has given him a post-horse
    pass for a journey into the mountains and Upper Silesia. How can the wretched fellow take Your Serene
    Highness's salary, when he serves the Minister as agent? The rogue ought to be arrested for debt;
    I have advanced him his salary for 1 1/2 years, and now that he has it he does nothing more. By degrees
    I give up the hope of finding one honest man more. God grant me that at Trąbczyn all goes happily
    and well. In deepest reverence I remain, until death, as One Serene Highness's Breslau, the 25th of
    June 1806. faithful and most obedient servant v Triebenfeld

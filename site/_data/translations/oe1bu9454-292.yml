- page: 2
  en: 'together with those about him, so both the Prince and I claimed only, and that with the greatest
    right, that Cosmar should deposit the sums determined in the instrument of 1799 and in the settlement
    of 1811 with the Brieg Higher Provincial Court, wherein this court of justice had admonished him so
    many times; on Cosmar''s side that never happens. He always turned himself out defiantly, and the
    creditors with whom the Prince [illegible construction] and pleaded with the Prince for what was theirs
    – the sums heaped up from year to year, Cosmar would not be solvent for them, and the question arose
    who was one day to make good these sums.


    The Prince Chancellor was moved and said, the old Prince must indeed live, and where then do the revenues
    go?


    Stägemann [uncertain: wept] that this would come out well enough if the matter were examined closely.
    Certainly the Prince would have received everything, and Cosmar too would surely have had to pay much
    to the creditors. After several further turns of phrase the matter was broken off — and I am still
    awaiting the first line of an answer. From more recent letters I hear that Cosmar is really said to
    have been denounced, on account of embezzled family monies, from Courland, by a man from abroad –
    and that this matter is now to be investigated first in Berlin. Upon Prince Adolph''s affair the matter
    is said to have great influence. Stägemann lately wished to defend him here too.


    Prince August''s matter is now so firmly settled by Cabinet Order that the 100000 thaler are to be
    paid to him absolutely and at once. Cosmar wished at the last to save himself with the evasion that
    the old Prince owed the Landgrave of Hesse a sum of 300000 Rthl and that the Schlawenschitz estates
    stood liable for it in subsidium; but the Privy Councillor Philippsborn reported to the King and moved
    that the King ought surely to value his own subjects rather than


    <PAGE BREAK>'

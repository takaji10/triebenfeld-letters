- page: 2
  en: 'death, together with those about him; both the Prince and I have only pleaded, and that with the
    greatest right, that Cosmar should deposit at the Brzeg High Court of the Province the sums fixed
    in the deed of 1799 and in the settlement of 1811, in which matter that court has admonished him so
    many times; this is never done on Cosmar''s part. He always came out defiantly, and the creditors
    with whom the Prince had come to agreement [uncertain: theirs] and implored the Prince for what was
    theirs — the sums mounted up from year to year, Cosmar was not solvent for them, and the question
    arose who was one day to make good these sums.


    The Prince Chancellor was moved and said, the old Prince must after all live, and where then do the
    revenues go?


    Stägemann wept that this would come to light readily enough, if the matter were closely investigated.
    Certainly the Prince would have received everything, and Cosmar too would doubtless have had to pay
    much to the creditors — after several turns of phrase the matter was broken off — and I still await
    the first line of an answer.


    By more recent letters I hear that Cosmar is really said to have been denounced by a man from abroad
    for embezzling family monies, still from Courland — and that this matter is now to be investigated
    first in Berlin. On Prince Adolph''s affair the matter is said to have great influence — Stägemann
    lately wished to defend him here too.


    Prince August''s matter is now so firmly concluded by Cabinet Order that the 100/m thaler are to be
    paid him absolutely and at once — Cosmar wished at the last to save himself with the excuse that the
    old Prince owed the Landgrave of Hesse a sum of 300/m Rthl. and that the Sławięcice estates stood
    liable in subsidium; but the privy councillor Philippsborn reported to the King and moved that the
    King must surely value his subjects sooner than'

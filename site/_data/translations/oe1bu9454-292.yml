status: draft
segments:
- page: 1
  en: 'Most Serene Prince! etc. etc. The indemnification matter is acknowledged and lies before the Emperor.
    From the Russian side, His Excellency the Minister von Stein has promised to do everything possible.
    From His Highness Prince Hardenberg I shall also obtain the assurance in writing. In the Churian matter
    little more will happen; the result is, the King and the Prince Chancellor have promised the S. ladies
    to pay, and there one will see soon enough what the gentlemen will do — every thanking man says that
    Your Serene Highness must now come ex nexu. Herr p. Stägemann plays the man of business for the 7th
    Pingatilli — it is enough to drive one mad. The order concerning the deposit of the moneys on Cosmar''s
    part has been sent to the Minister of Justice with the reminder to hold him to order. Since in the
    meantime, however, complaints have come in from von Kuh, from Sobottendorff, from Hahn, Herr Stägemann
    has proposed to the Chancellor not to plunge into the [uncertain: Wesben] besides, but to put it all
    away from himself and refer it to the Minister of State for Justice. Herr p. Stägemann now further
    plays the defender of Cosmar, and [illegible] screws up fury and vengeance that one should wish to
    blacken so honest a man. In a short conference held 3 days ago he flew up in a rage. Your Serene Highness
    cannot occupy yourself further with the matter, it all belongs before His Excellency the Minister
    — the querulousness of the old Prince bears the stamp of untruth — the old Prince is a nullity in
    the matter, he has nothing to look for in the estates, he is compensated — Prince August is here and
    he knows Cosmar as an honourable man, he has himself named him his 9th plenipotentiary. Herr v Triebenfeld
    acts very indiscreetly in that he so [uncertain: quaett] overruns His Serene Highness. I answered
    that I was far from being burdensome to His Serene Highness; I only ask that my princely principal
    be protected, together with those about him, from death by starvation'
- page: 2
  en: 'by starvation, together with those about him; both the Prince and I claimed only this, and that
    with the greatest right, that Cosmar should deposit with the Oberlandesgericht at Brieg the sums fixed
    in the deed of 1799 and in the settlement of 1811, in which that court had admonished him so many
    times; on Cosmar''s part this never happens. He always drew himself out defiantly, and the creditors
    with whom the Prince [uncertain: greiniget] theirs and implored the Prince for what was their own
    — the sums heaped up from year to year, Cosmar would not be solvent for them, and the question arose
    who should one day make these sums good. The Prince Chancellor was moved and said, the old Prince
    must after all live, and where then do the revenues remain? Stägemann wept that that would surely
    be found out if the matter were closely investigated. Certainly the Prince would have received everything,
    and Cosmar too would surely have had to pay much to the creditors. After several more turns of phrase
    the matter was broken off — and I still await the first line of an answer. From more recent letters
    I hear that Cosmar is really said to have been denounced, on account of embezzled family moneys still
    from Curland, by a foreign man — and that this matter is first to be investigated in Berlin. Upon
    Prince Adolph''s affair the matter is said to have great influence. Stägemann lately wished to defend
    him here too. Prince August''s affair is now so firmly settled by Cabinet Order that the 100000 thaler
    are to be paid to him absolutely and at once. Cosmar wished at the last to save himself with the evasion
    that the old Prince owed the Landgrave of Hesse a sum of 300000 Rthl and that the [uncertain: Schlovenzitzer]
    estates were liable for it in subsidium; but the Privy Councillor Philippsborn reported to the King
    and moved that the King must surely have regard to his subjects sooner than to'
- page: 3
  en: 'foreigners. I proved that the debt is charged upon the principalities of Öhringen, Neuenstein and
    Ingelfingen alone, and thereupon the King commanded the Chancellor that the moneys should be paid;
    the matter nevertheless lay again for 14 days, and about 6 days ago a fulminating letter went out
    to M. Kircheisen — that these 100000 Rthl are to be paid at once and without any contradiction. Ernst
    August has thanked Prince Hardenberg politely and at the same time expressed the wish that Your Serene
    Highness might no longer be so continually pressed by Cosmar. I believe he will now, since Hahn is
    coming there, quickly withdraw the power of attorney — make common cause with Your Serene Highness,
    and only then is Cosmar''s grave prepared. The Prince Chancellor will probably not depart from here
    before the 5th of June — he goes by way of Neisse: how would it be if Your Serene Highness were to
    approach him there in person? It is necessary to speak with him about your military affair — I would
    hasten ahead with courier horses. The cook Murat has received his wages — vengeance has swiftly overtaken
    this gentleman. I remain most reverentially, Your Serene Highness''s. The King departed last night
    from the Countess Zichy. Vienna, the 27th of May 1815. Most faithful and obedient servant v Triebenfeld'

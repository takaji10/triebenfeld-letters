- page: 1
  en: 'Serene Highness, Prince!


    etc. etc.


    The compensation matter is acknowledged and lies before the Emperor; from the Russian side, His Excellency
    the Minister von Stein has promised to do everything possible. From the Prince Hardenberg I shall
    also obtain the assurance in writing. In the Courlandish matter little more will happen; the result
    is, the King and the Prince Chancellor have promised the ladies of S. to pay, and there one shall
    indeed see what the gentlemen will do — every thinking man says that Your Serene Highness must now
    come out of the bond (ex nexu). Mr. p. Stägemann plays the man of business for the 7th Pingatilli
    — it is enough to drive one mad. The order concerning the depositing of the monies on Cosmar''s side
    has been sent to the Minister of Justice with the reminder to hold the same to good order. Since in
    the meantime, however, complaints have come in from von Kuh, from Sobottendorff, from Hahn, Mr. Stägemann
    has


    proposed to the Chancellor not to plunge into the [uncertain: Wesben] besides, but to put everything
    away from himself and refer it to the Minister of State for Justice. Mr. p. Stägemann now plays the
    defender of Cosmar besides, and screws up rage and vengeance that one should wish to blacken so honest
    a man.


    In a short conference held 3 days ago he flew up in a fury. Your Serene Highness cannot occupy yourself
    further with the matter, it all belongs before the Minister — the querulousness of the old Prince
    bears the stamp of untruth — the old Prince is a nullity in the matter, he has nothing to seek in
    the estates, he has been settled with – Prince August is here and he knows Cosmar as an honourable
    man, he has himself named him his 9th plenipotentiary. Mr. von Triebenfeld acts most indiscreetly
    in running to His Serene Highness so [uncertain: quaett]. I answered that I was far from wishing to
    be burdensome to His Serene Highness. I demand only that my princely client be protected from death
    by hunger


    <PAGE BREAK>'

- page: 3
  en: 'foreigners. I proved that the debt lies solely upon the principalities of Öhringen, Neuenstein
    and [uncertain: Ingelfingen], and thereupon the King ordered the Chancellor that the monies should
    be paid; the matter nevertheless lay another 14 days, and about 6 days ago a fulminant letter went
    out to M. Kircheisen – that these 100000 Rthl should be paid at once and without any contradiction.


    Ernst August has thanked the Prince Hardenberg handsomely and at the same time expressed the wish
    that Your Serene Highness should no longer be so pressed by Cosmar. I believe he will now, since Hahn
    is coming thither, soon withdraw the power of attorney – make common cause with Your Serene Highness,
    and only then will Cosmar''s grave be dug.


    The Prince Chancellor will probably not depart from here until the 5th of June – he goes by way of
    Neisse: how would it be if Your Serene Highness were to approach him there in person? It is necessary
    to speak with him about your military matter – I would hasten ahead with courier horses – The cook
    Murat has received his wages – vengeance has swiftly overtaken this gentleman.


    Reverently I remain,


    Your Serene Highness''s


    The King departed last night


    from the Countess Zichy.


    Vienna, the 27th of May.


    1815


    most faithful and obedient servant


    von Triebenfeld'

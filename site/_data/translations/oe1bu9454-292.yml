- page: 1
  en: '292


    Most Serene Prince!


    etc.


    The compensation matter is recognised and lies before the Emperor. From the Russian side His Excellency
    the Minister von Stein has promised to do everything possible. From the Prince of Hardenberg I shall
    also receive the assurance in writing. In the Courland matter little more will happen; the result
    is that the King and the Prince Chancellor have promised to pay the S. ladies, and then one shall
    indeed see what the gentlemen will do — every thinking man says that Your Serene Highness must now
    come out of the obligation (ex nexu) — Mr Stägemann acts as man of business for the Prince Pingatilli
    — It is enough to drive one mad — The order concerning the deposit of the monies on Cosmar''s part
    has been sent to the Minister of Justice with the reminder to hold him to order — Since in the meantime,
    however, complaints have come in from Kuh, from Sobottendorff, from Hahn, Mr Stägemann has


    proposed to the Chancellor not [uncertain: Wesben nebst zu stürben], but to refer everything away
    from himself and to the Minister of Justice. Mr Stägemann now further plays the defender of Cosmar
    and snorts fury and vengeance that anyone should wish to make so ill of the upright man.


    In a short conference held 3 days ago he flew up in a rage. Your Serene Highness can concern yourself
    no further with the matter, it all belongs before the Minister of Justice — the querulous complaining
    of the old Prince bears the stamp of untruth — the old Prince is a nullity in the matter, he has nothing
    to seek in the estates, he has been settled with — Prince August is here and he knows Cosmar as an
    honourable man, he has himself named him as his 9th authorised representative. Mr von Triebenfeld
    acts most indiscreetly in [illegible] running to His Serene Highness in this way. I replied that I
    was far from wishing to be burdensome to His Serene Highness. I demand for myself that my princely
    client be protected from starvation


    [continues]'

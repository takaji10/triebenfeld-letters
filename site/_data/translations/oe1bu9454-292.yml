- page: 3
  en: 'foreigners, and I proved that the debt attaches solely to the principalities of Öhringen, Neuenstein
    and Ingelfingen, and thereupon the King commanded the Chancellor that the monies should be paid; the
    matter nevertheless lay another 14 days, and about 6 days ago a fulminating letter went out to Minister
    Kircheisen — that these 100,000 Rthl. should be paid at once and without any contradiction.


    Ernst August has thanked the Prince of Hardenberg handsomely and at the same time expressed the wish
    that Your Serene Highness might no longer be so continually pressed by Cosmar. I believe he will now,
    since Hahn is coming there, quickly withdraw the power of attorney — make common cause with Your Serene
    Highness, and then and only then is Cosmar''s grave prepared.


    The Prince Chancellor will probably not depart from here before the 5th of June — He goes by way of
    Nysa? How would it be if Your Serene Highness were to approach him there in person? It is necessary
    to speak with him about your military matter — I would hasten ahead with courier horses — The cook
    Murat has received his wages — vengeance has swiftly overtaken this gentleman.


    I remain, in deepest reverence,


    Your Serene Highness''s


    The King departed last night from the Countess Zichy.


    Vienna, the 27th of May.


    1815


    most faithful and obedient servant


    von Triebenfeld'

- page: 2
  en: 'this great man promises for ever and keeps nothing — Neither would he at that time, with his Stägemann,
    have called for the report from Brzeg, if the latter could only have suspected that Cosmar stood so
    near the pit — Nothing then remained but knavish delay, since the confirmation was obtained from a
    provincial board — Stägemann stood there like a corpse when he heard of Cosmar''s downfall from my
    own mouth. One [uncertain: conferred] — but could not discover the cloud out of which the lightning
    bolt had come. Prince H. himself /that probing man/ started up from his chair when Barbe told it to
    him in a sarcastic tone. The bacchanals at Syten were in too fresh a memory with everyone /Aphrodite/
    had set up her seat there and created nothing but — pleasure — every voluptuary and glutton visited
    this temple of the corrected H. v. Meanwhile envy stirred all too much — even the great [text lost:
    garbled] thereto [illegible] and gladly, and the malcontents crept about this temple of pleasure so
    long until they found occasion to look inside and to examine the whitewashed image more closely. Two
    [uncertain: kopillen] councillors now appeared and demanded a speedy accounting — which however has
    not been rendered to this day — A still speedier demand from the Curian heirs followed, in the form
    of a denunciation, in which they stated that Cosmar had offered them the Syten estates for their claim,
    by which one [saw] that the thief wished to save himself — [uncertain: Court], but you, most gracious
    Prince, are not to speak of this — for it is enough that my two friends in Berlin and I here are on
    the watch — My plan, and the Cabinet Councillor Albrecht''s, you will see from the enclosure; in 2
    days I shall have the King''s declaration — If he pays, so much the better — if he disclaims, then
    the settlement will be concluded within 2 times 24 hours, and the advance must be furnished — The
    game stands well; in any case I beg [uncertain: defach] —'

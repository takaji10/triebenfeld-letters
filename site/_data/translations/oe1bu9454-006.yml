- page: 3
  en: 'Only reckon nothing on St.''s account; he has, by God, done nothing — It could be that many a man
    will now wish to become a knight on the strength of the affair, and I shall not bar the course to
    any of them — only in the end you and everyone will be astonished at how the [uncertain: marionettes]
    were directed. From Pourtalès there is still no answer — we therefore believe that [uncertain: he
    has been bought]. He seeks only to withdraw his capital out of France. Adolph''s business has so far
    gone quite well, but more of that in due time — For the rest he has seen for himself how everything
    stands here and how one must idle about here — Without money it is a frightful life here — and, as
    God is true, I have nothing; Prince Adolph mostly [knows] this himself — He is taking much with him
    — but I had not the heart to ask him for anything — Only send 100 ducats, and indeed by express courier,
    or the devil take me; it shall win you hundreds of thousands, so do not let me perish in want and
    disgrace — Prince August is a wretched, miserable creature, as the accompanying letter from Langenburg
    proves to you; one of the same wording lies with Winzingeroden. But he shall repent it — He cannot
    by right be lord of the entailed estate and be called Prince of Öhringen. If only I knew first what
    sort of man Adolph will turn out to be.


    My head aches frightfully, so that it is impossible for me to write further. In deep reverence I remain,
    as


    Your Serene Highness''s


    Beguelin commends himself to your grace,


    as does Barbe


    The piece to Albrecht I beg


    to have back again, as I have


    no copy — by express courier, and money


    Vienna, the 6th of May


    1815.


    faithful and obedient servant


    v Triebenfeld


    It would be very shrewd if Prince Adolph were to travel by way of Berlin and there extort money from
    Cosmar and seek to learn everything; I would gladly have given him a letter to Grevenitz, but he is
    too obstinate for me'

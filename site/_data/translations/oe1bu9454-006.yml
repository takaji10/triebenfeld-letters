status: draft
segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord, I received yesterday Your Most Serene Highness''s most highly honoured letter
    of April, and as Prince Adolph departs today, I report herewith what I know. In the Württemberg matter
    there is nothing to be done for the present; this depends on the conjunctures, 7 — I have at this
    time only two matters in view, namely the indemnification in the [uncertain: Außischen] share, and
    the Courland affair. As regards the first, I must only [say] that the Emperor and King must, and will,
    indemnify, in which however neither Zerboni nor any other vermin of the act can help — rather I hear
    that these Italians may well be the greatest hindrance. I have demanded the district governorships
    of Sokolnik together with Wieruszew; this yields Rthl by night and compensates itself against Your
    Serene Highness''s claim — Minister Stein will in this be alone with Nesselrode, and Your Highness
    will [see] that what they will, the insects [that] damage belong beneath their feet — [Uncertain:
    W.] the 85/[uncertain: m] of von Kaemen is cash money given by Your Serene Highness, wherefore for
    that reason to give the word in his newspaper in due time. The Courland affair now stands somewhat
    comically — the Cabinet Councillor Allbrecht ordered me / after a happy return / to give him the accompanying
    copy of a letter — this was done, and the King now knows everything. Now I have received through Stägemann
    the urgent, honest commission to come to terms with the Courland [uncertain: Erkennen] — this matter
    is now in hand — An old friend handles the [uncertain: Donner] and shortly I hope to be at the edge
    of it.


    For the rest, most gracious Prince and Lord, you give [uncertain: very much in writing] if you believe
    that Prince Hardenberg has done anything in your affair, or ever will do anything'
- page: 2
  en: 'this great man promises eternally and keeps nothing — Nor would he at that time, with his Stägemann,
    have called for the report from Brieg, if the latter could only have suspected that Cosmar stood so
    near the pit — Nothing then remained but [uncertain: schur lische] delay, since one obtained the confirmation
    from a provincial college — Corpse-like stood Stägemann when he heard of Cosmar''s misfortune from
    my own mouth — One [uncertain: combenirte] — but could not discover the cloud out of which the lightning-bolt
    had come. Even Prince H. (the probing man) started up from his chair when Barbe told it to him in
    a [uncertain: Sarhörsischen] tone. The bacchanalia at Syten were in too fresh a remembrance with everyone
    / Aphrodite had set up her seat there and created nothing but — pleasure — every voluptuary and glutton
    visited this temple of the corrected [uncertain: H. v.] Meanwhile envy nevertheless stirred too strongly
    — even great [ones] came to it [uncertain: schmel] and gladly; malcontents crept about this temple
    of pleasure so long until they found opportunity to look into the [uncertain: Jannen] and to illuminate
    the whitewashed image more closely. Two [uncertain: kopillen] councillors now came forward and demanded
    a swift accounting — which however to this day has not been rendered — A still swifter [uncertain:
    Annahmung] of the Courland heirs, in the form of a denunciation, followed, wherein these declared
    that Cosmar had offered them the Syten estates for their claim, whereby one [saw] that the thief wished
    to save himself — [uncertain: Gericht], but you, most gracious Prince, are not to speak of it — for
    it is enough that my two friends in Berlin and I here [are] awake. My plan and that of the Cabinet
    Councillor Albrecht you will see from the enclosure; in 2 days I shall have the King''s declaration
    — If he pays, à la bonheur — if he declares himself free of it, then the settlement is concluded within
    2 times 24 hours, and the advance must be furnished — The game stands well; in any case I ask [uncertain:
    defach]'
- page: 3
  en: 'Only reckon nothing to St.''s account; he has, by God, done nothing — It may be that many a man
    will now wish to become the knight of the affair; I shall bar the way to none of them — only at the
    last you and everyone will be astonished at how the marionettes were guided. From Pourtales there
    is still no answer — we therefore believe that [he is] bought — He is only seeking to draw his capital
    out of France. Adolph''s affair has so far gone quite well, yet more of that in its due time — For
    the rest, he has himself seen how everything stands here and how one must loaf about here — Without
    money it is a dreadful life here — and I have, as God is true, nothing, [I mean] most of all Adolph
    himself — He takes much with him — but I had not the heart to apply to him for anything — Only send
    100 ducats, and that by express courier, or the devil take me, it shall win you hundreds of thousands;
    so do not let me perish in want and disgrace — August is a wretched, miserable man; the accompanying
    letter from Langenburg proves this to you, an identical one lies with Winzingeroden. But he shall
    repent of it — He cannot by right be called lord of the entailed estate and Prince of Öhringen.


    If only I knew what sort of man Adolph will become.


    My head pains me frightfully, so that it is impossible for me to write further. In deepest reverence
    I remain, as Your Serene Highness''s


    Beugelin commends himself to your favour


    so too Barbe


    the piece to Albrecht I ask


    for back again, as I have no copy. Per C. Hoffett and money, faithful obedient servant


    v. Triebenfeld


    Vienna, the 6th of May


    1815.'

- page: 1
  en: '6


    Most Serene Prince,


    Most gracious Lord!


    Your Most Serene Highness''s most highly revered letter of April I received yesterday, and since Prince
    Adolph departs today, I report in reply what I know. In the Württemberg matter there is nothing to
    be done for the present; this depends on the [uncertain: conjunctures] etc. — I have at present only
    two matters in view, namely the compensation in the Russian share, and the Curian affair. With regard
    to the first I must only [say] that the Emperor and King must, and will, make compensation, wherein
    however neither Zerboni nor any other vermin of the Act can be of help — rather I hear that these
    [uncertain: Itali] might best be an obstruction. I have demanded the starosty of Sokolnik together
    with Wieruszew; this yields rent in Rthl and is set off against Your Serene Highness''s claim — Minister
    Stein will [uncertain: act] in this alone with Nesselrode, and His Highness will confirm whatever
    they wish. Insects belong beneath their feet — [uncertain: M.] the 85/m Rthl from Kamionna is money
    given in cash by Your Serene Highness, and therefore for that, in due [uncertain: report/time], give
    the word. The Curian affair now stands somewhat comically — the Cabinet Councillor Albrecht ordered
    me / after a fortunate return / to give him the accompanying copy of a letter — this was done, and
    the King now knows everything — Now I have received through Stägemann the urgent and honest commission
    to come to a settlement with the Curian heirs — this matter is now in hand — An old friend is handling
    the thunder, and shortly I hope to be at the edge of it.


    For the rest, most gracious Prince and Lord, you give [uncertain: very much in writing] that you believe
    that Prince Hardenberg has done anything in your affair, or ever will do anything'

segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    It is quite certain, and proved to the highest evidence, that Austria is not joining in the fighting;
    she wishes to remain neutral and to act as mediator, that is to say, to fish in troubled waters and
    to do nothing further beyond that – the advantages of this are painted for the people in such glowing
    colours that they are already so wearied in their zeal for it. The saddest thing, and for us the most
    full of danger, is that the Russian troops are grumbling greatly and even the generals curse the armistice;
    one would rather go back as far as the Vistula. Our situation is now very critical. Lieutenant General
    von Koch: has fallen out very badly with Minister Hard:; the Minister asked Lieutenant General von
    K in the presence of the monarch. – Well, are you not glad that everything is going so well?


    K: About what!


    With that, now, everything stands very well, the proud Nap: has begged for the armistice, we must
    – K: Sir! I should have had to escape from the madhouse if I rejoiced over that – So much innocent
    blood has been shed in vain – we run as far as the Oder, we abandon Saxony and our own lands in part,
    [uncertain: Brönen] then the matter, we conclude an armistice for 6 weeks, we withdraw our troops,
    which had the most advantageous position, we give N time to procure [uncertain: Sontien] for himself,
    and now let ourselves be driven back behind the Vistula, and our lands totally ruined. No, he must
    have escaped from the madhouse who rejoices over all these events – H: Well then, do it better –


    K: I cannot shout down the clever gentlemen.


    H: Ah, Your Excellency sees everything black – Nevertheless everything stands very well and we shall
    certainly obtain a very advantageous peace.'

- page: 2
  en: 'I have indeed heard the first said here again. Would to God the Prince of Hohenlohe stood at the
    head — then things would surely go better — How matters will stand henceforth with the provisioning
    is a problem — the Russians will have nothing to do with it, and demand impetuously to be provisioned.
    Now there is not much grain left in the country — the roads are bottomless and already lie covered
    with dead horses, the green fodder brings the plague among them, God alone knows how this is to end
    — General Zastrow is again very well liked; he will command the Landwehr which is now being gathered
    at Nysa, and which consists of 55000 men — Lieutenant General Ortell lies here in Neustadt very ill
    of a nasty fever and now meddles in nothing; I therefore go tomorrow from here by way of Nysa to Ząbkowice
    Śląskie, from there to the headquarters, then to Świniary to see whether I can bring in the produce
    and procure myself money — from that side I shall write only later again. Reverently I remain as


    Your Most Serene Highness''s


    Neustadt


    the 20th of June


    1813.


    most humble and obedient servant


    v Triebenfeld'

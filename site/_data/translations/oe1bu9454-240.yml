- page: 1
  en: '240


    Most Serene Prince


    Most gracious Prince and Lord!


    It is quite certain, and proved to the highest degree of evidence, that Austria will not join in the
    fighting; it means to remain neutral and to act as mediator, which is to say, to fish in troubled
    waters and otherwise do nothing — to the people the advantages of this are painted so brilliantly
    that they are already so wearied in their zeal — the saddest thing, and for us the most perilous,
    is that the Russian troops murmur greatly and even the generals curse the armistice; one would rather
    withdraw as far as the Vistula. Our situation is now very critical. Lieutenant General von Köck[ritz]
    has fallen out badly with Minister Hard[enberg]; the Minister asks Mr von Köckritz in the presence
    of the monarch: — Of, are you not glad that everything is going so well?


    K[öckritz]: About what?


    Mitt: well, everything stands very well, the proud Nap[oleon] has begged for the armistice, must —
    K[öckritz]: Sir! I should have to have run out of the madhouse, if I rejoiced at that — so much innocent
    blood has been shed for nothing — we run as far as the Oder, give up Saxony and our lands piecemeal,
    Brönen then the matter, conclude an armistice for 6 weeks, withdraw our troops, which had the most
    advantageous position, give N. time to procure himself support, and now let ourselves be driven back
    beyond the Vistula, and our lands totally ruined. No, the man must have escaped from the madhouse
    who rejoices at all these events — H[ardenberg]: Now do it better — K[öckritz]: I cannot out-shout
    the clever gentlemen. H[ardenberg]: Ah, Your Excellency sees everything black — everything nevertheless
    stands very well, and we shall certainly obtain a very advantageous peace —'

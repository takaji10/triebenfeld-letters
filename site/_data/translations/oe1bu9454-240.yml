- page: 2
  en: 'Here I have indeed heard the first said again. Would to God the Prince of Hohenlohe stood at the
    head; then things would surely go better – How matters will stand with provisioning hereafter is a
    problem – the [uncertain: Hußen] will have nothing to do with it, and demand vehemently to be provisioned.
    Now there is not much grain left in the country – the roads are bottomless and already lie covered
    with dead horses, the green fodder brings the plague among them; God alone knows how this is to end.
    General Zastrow is again very well thought of; he will command the militia which is now being assembled
    at Neisse, and which consists of 55000 men. Lieutenant General Ortell lies here in Neustadt very ill
    with a foul fever and now meddles in nothing; I therefore leave here tomorrow by way of Neisse for
    Frankenstein, from there to the headquarters, then to Schwierin, to see whether I can bring the produce
    forward and procure money for myself — from that side I shall write again only later. Reverently I
    remain, as


    Your Most Serene Highness''s


    Neustadt


    the 20th of June


    1813.


    most humble and obedient servant


    v Triebenfeld'

status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord, Since His Majesty the King has commanded His Excellency
    Herr von Voss to arrange the Krotoszyn affair, the same has asked for 4 weeks, as being the time within
    which the final report is to be submitted. The Chambers are to investigate everything, in what manner
    the revenues come out equal. My plans are now already drafted, and in this very hour I am going from
    here to Betschen; I shall also see what is to be done with Bronzewski — for absolutely our revenues
    must remain as high, and since so much fuss is made on account of Polajewo, one ought to give Your
    Serene Highness, out of the Starosty of Adelnau, which borders hard upon Krotoszyn, as many estates
    as the higher value of our revenues amounts to — and hereby
- page: 2
  en: more will be gained than with Polagewo — for there too one must indeed reckon the matter at 4 per
    cent. — God grant that all goes well, indeed very well. Prince George will be in Breslau next week
    — Both his affair and the investigations concerning Your Serene Highness's estates I mean to settle
    during that time, so as to be here again at the end of the 4 weeks in question. A letter will surely
    just have come in from Colonel von Köckritz — all mean it well, and apart from Herr von Voss everyone
    is ready to anticipate Your Serene Highness's wishes — Herr von Voss is governed by the Councillor
    of War Nöldichen. Strange news has come in here from Russia. — Everything there is in confusion, because
    the new mistress rules the Emperor quite without restraint — Reppnin is said to have been placed under
    arrest; the Kurakins are all gone; Zubow has had to come to Petersburg in haste, and Panin too is
    said to have asked for his dismissal — the Empress has been ill-used by Paul and shut up for 3 days,
    the
- page: 3
  en: 'Grand Duke has lamented greatly and wept like a child — [uncertain: Sieyès], it is said, will depart,
    so that only the secretary remains here — It looks strange — yet one believes all will remain in statu
    quo. In 5 days I shall have the good fortune to lay myself personally at Your Serene Highness''s feet.
    In deepest reverence I remain, until death, Your Most Serene Highness''s [uncertain: at command],
    the 20th of October 1798. faithful most humble and obedient servant v Triebenfeld'

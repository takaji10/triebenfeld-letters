segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The procuring of the 2[uncertain: 5]000 Rthl causes me much distress, since Herr von Stein, who is
    now President of the Bank, has once again forbidden all discounting. The capital will be given either
    by the Invalids'' Fund or by the Potsdam Orphanage in the amount of 140000 Rthl, but to payment by
    instalments none of them will commit itself; and before all the formalities have been cleared away,
    no fund will give the capital — I am therefore working on it with Amelang, only so as to obtain the
    25000 Rthl provisionally somewhere, which can then be repaid again from the quarter where the 140000
    d. are given. Things look sad here altogether – all business is at a standstill on account of the
    above ordinance, and the dear Widows'' Fund, together with the Orphans'' Board, is cruelly hard pressed
    on account of the threatened bankruptcies in South Prussia - these too will no longer venture anything.
    Moreover the King is very much after it, where all the millions have gone that were given to South
    Prussia, since despite the great sums given thither the greatest want of money nevertheless prevails,
    and it has the appearance as though all these moneys, together with the estate owners, had emigrated
    to Russia. It is therefore to be the case that whoever in any way falls behind with the interest,
    or otherwise


    12 Jan 1805'

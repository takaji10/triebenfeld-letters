  en: '153


    Most Serene Prince


    Most gracious Prince and Lord!


    The procuring of the 25000 Rthl gives me much trouble, since Mr von Stein, who is now President of
    the Bank, has afresh forbidden all discounting. The capital will be given either by the Invalids''
    Fund or by the Potsdam Orphanage in the sum of 140000 Rthl, but to payment by instalments no one will
    commit himself; and until all the formalities are settled, no fund will hand over the capital — I
    am therefore working with Amelang to obtain the 25000 Rthl at least provisionally where they may be
    had, which can then be repaid out of the place where the 140000 Rthl are granted. Things look altogether
    sad here — all business is at a standstill on account of the above order, and the dear Widows'' Fund,
    together with the Wards'' Board, is cruelly hard pressed on account of the threatened bankruptcies
    in South Prussia — these too will no longer venture [uncertain: weigh] anything. Moreover the King
    is pressing hard after where all the millions have gone that were given to South Prussia, since notwithstanding
    the great sums given thither the greatest want of money nevertheless prevails, and it has the appearance
    as though all these moneys had emigrated to Russia together with the estate owners. Accordingly, whoever
    falls behind at all with the interest, or otherwise


    12 Jan 1805'

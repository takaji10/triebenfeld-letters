status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The Court Fiscal Michaelis has communicated to me Your
    Most Serene Highness''s letter concerning the purchase of estates proposed by the Jew Dann. Since,
    however, the Jew had already been with me before the arrival of this gracious letter, I am in a position
    to reply to Your Most Serene Highness upon it at once, most deeply obediently: that Dann believes
    he can persuade Herr v. Eckart, who has bought the Lichtenau houses here, to enter into an Empletu
    of this kind. This, then, is an ordinary brokering scheme trimmed out with Jewish swindling — for
    the same Jew has laid this and other such plans before Prince George no less.'
- page: 2
  en: For the rest, matters look ill. Following a contumacial decree issued by the Posen government, it
    is absolutely intended to take the Brzyzer estates back from Your Most Serene Highness — and when
    there is added to this that the Chambers, together with the forest officials there, do nothing but
    intrigue over the forests and mean to wrest the same from Your Serene Highness, then on that side
    all is lost. For my part I cannot see what is to become of the business. On every road the Chambers
    make chicanery; moreover, proceedings are being framed from several sides, frightful costs and squanderings
    of money are incurred, and notwithstanding this the end of them cannot be foreseen, and in this respect
    there is no thinking of any peaceable possession of these estates. The exchange affair too lies stalled
    on an endless road, and no one gives a thought either to the inspection or to the valuation of the
    estates; and speaking without circumlocution
- page: 3
  en: 'I believe that the Ministers here are acting en souverain and would never let the exchange come
    to pass, unless the Monarch commands it. By a trustworthy man I would report all further matters to
    Your Serene Highness most humbly. In deepest reverence I remain, until death, Your Most Serene Highness''s
    —


    This very moment I receive Your Most Serene Highness''s two gracious letters with the enclosures.
    — 6 The ill will, of which I shall inform Your Serene Highness by another and safer route, shews itself
    here only too plainly. This very day he receives an exceedingly polite letter which is said to have
    been enclosed to Wildeganchen — meanwhile nothing is to be gained by this hero, unless Your Most Serene
    Highness now concur in everything there with the man who recommended him to the P. — the times are
    now singular, and in this respect one may speak freely from the heart. Your Serene Highness has, as
    Eysenhardt tells me, fallen with the horse — for God''s sake I beg, Most gracious Prince and Lord,
    do take some care of yourself.


    Berlin, the 25th of May 1799.


    Faithful most humble and obedient servant

    v. Triebenfeld.'

- page: 2
  en: 'From the help of His Serene Highness the State Chancellor I confidently hope very much good for
    Your Serene Highness — the accompanying piece with all its enclosures I had to submit after altering
    it twice. The first time I had not adduced Your Serene Highness''s letter, which must properly be
    regarded as a power of attorney.


    In the Koszęcin matter nothing essential has yet been done, because B[arbe] and A. do not think it
    advisable to lay so much before them at once.


    In the business of the Polish estates I am to keep quiet until Poland''s lot has been cast; for if
    the district in which the Trąbczyn estates lie should indeed fall to Russia, the Prince Chancellor
    will certainly at once procure everything with His Majesty the [uncertain: Westen] Emperor for the
    best of Your Serene Highness.


    Zerboni has today received the Order of the Red Eagle, third class, and goes to Warsaw. Heaven dispenses
    its gifts still as oddly as in 1793. Neuwied, Erbach, Leiningen and several others have gone as deputies
    to the Emperor Franz on behalf of the [uncertain: aufsstände], and the Emperor most graciously led
    them forward [uncertain: angeführt] and promised to do what was possible — whereupon these gentlemen
    also begged an audience with our King; this the King refused, and merely had them told that they might
    submit their request in writing. These matters seem to be drawing out very far, and in the end the
    mountain may bring forth a mouse. — For the rest, Mr Privy Councillor von Gärtner / truly one of the
    foremost heads and a much respected man / bombards [uncertain: Bombardindt] frightfully, and, as I
    believe, not without effect. — The accompanying writing or little volume I see in many places; he
    is the author of it. Four more of the like exist, and each of equal force. The King of Würt[temberg]
    is furious about it. — I send Your Serene Highness this brochure so that they may see that everything
    which can be said has already been said, in order to bring the matter back into the old track. — I
    await from


    Mr W. instruction as to what is still to be said in Your Serene Highness''s name. — I do not for once
    shoot into the blue [illegible: Spannen und vom] excites a great sensation. — God knows what will
    come of it? It is in unbounded reverence that I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 25th of October


    1814


    faithful and most obedient servant


    v Triebenfeld'

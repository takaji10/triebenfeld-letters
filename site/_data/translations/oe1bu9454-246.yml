status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Serene Highness''s most highly esteemed
    letter of the 9th of this month I received only on the 23rd; if the letters which I send to Your Serene
    Highness take a like snail-shaped course, then things look sad indeed. — Here it is now somewhat quiet;
    the monarchical bears [uncertain: uf], as they have nevertheless resolved to go to Hungary, and have
    in fact departed thither today. After their return the Congress will be opened. The ministers have
    meanwhile remained here and continue working with the greatest activity. Saxony''s fate is now already
    decided for ever: Prussia obtains the whole of it — Weimar receives a small increment; opinions, Gotha
    etc. remain as they are, yet all of them are subordinated to the [uncertain: Laug]. Concerning Poland
    nothing has yet been decided. Austria will by no means lay itself down to the mark, and Talleyrand
    too seems to be stirring things up underhand, hence the favourable delay. However, from the continuing
    friendship between the Russian Emperor and our King one hopes the best — for the line from Thoren
    close past Kalisz towards Kempen would be too slight an equivalent for Prussia''s exertions, and this
    line could never be regarded as a military frontier. Silesia and Prussia would always remain without
    connexion, and in the face of Russia''s great power would have to be regarded as lost provinces, because
    there are no fortresses or rivers of consequence there. Of the affairs of the Empire I can say little
    today, for Herr v. Gärtner lay very ill for several days, and I too have had to keep to my room for
    4 days on account of gouty attacks and a swollen head. But by the next post I shall be able to write
    much.'
- page: 2
  en: 'From the assistance of His Serene Highness the State Chancellor I confidently hope a very great
    deal of good for Your Serene Highness. — The accompanying piece, with all its enclosures, I have had
    to submit after altering it twice. The first time I had not adduced Your Serene Highness''s letter,
    which must properly be regarded as a power of attorney. In the Koschentiner affair nothing essential
    has yet been done, because B. and A. do not find it advisable to lay so much before them at once.
    In the matter of the Polish estates I am to keep quiet until Poland''s lot has fallen; for if indeed
    the district in which the Trąbczyner estates lie should fall to Russia, the Prince Chancellor will
    certainly at once procure everything with His Majesty the [uncertain: Westen] Emperor for the best
    advantage of Your Serene Highness. Zerboni received the Order of the Red Eagle, 3rd class, today,
    and goes to Warsaw. Heaven still bestows its gifts as strangely as in 1793. Neuwied, Erbach, Leiningen
    and several others have gone as deputies to the Emperor Franz on behalf of the imperial estates. The
    Emperor has most graciously given them a hearing and promised to do what is possible — whereupon these
    gentlemen also requested an audience with our King; this the King refused, and merely had them told
    that they might submit their request in writing. These matters seem to be drawing out very far, and
    in the end the mountain might bring forth a mouse. For the rest, Herr Privy Councillor v. Gärtner
    (truly one of the foremost heads and a much esteemed man) bombards them frightfully, and, as I believe,
    not without effect. — The accompanying writing or little volume I see in many places, of which he
    is the author. Four more of the like exist, and each of equal force. The K[ing] of Würz[burg] is furious
    about it. I send Your Serene Highness this brochure for this reason, that they may see that everything
    which can be said has already been said, in order to bring the matter back into the old track. — I
    await the command of Herr W. as to what is still to be said in Your Serene Highness''s name. — I do
    not shoot into the blue, [uncertain: Spannen] and [illegible] excites a great sensation — God knows
    what will come of it? It is in unbounded veneration that I remain, until death, Your Most Serene Highness''s
    — Vienna, the 25th of October 1814 — faithful and most obedient servant v Triebenfeld'

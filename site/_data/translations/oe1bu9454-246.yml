- page: 1
  en: '246


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness''s most highly esteemed letter of the 9th of this month I received only on the
    23rd; if the letters which I send to Your Serene Highness go at a like snail''s pace, then it looks
    sad indeed. — Here things are somewhat quiet at present; the monarchs have after all resolved to go
    to Hungary, and in fact departed thither today. After their return the Congress will be opened. The
    ministers have meanwhile remained here and continue to work with the greatest activity. Saxony''s
    [uncertain: Sachſtens] fate is now already decided for ever, Prussia obtains it entirely — Weimar
    receives [uncertain: erhölt] a small increment, Meiningen [uncertain: Meinungen], Gotha etc. remain
    as they are, yet all are subordinated to the [illegible: Laug]. Concerning Poland nothing is yet decided.
    Austria will by no means lay itself to the mark, and Talleyrand too seems to be stirring things up
    under hand, whence the favourable delay. Yet one hopes [uncertain: haft] the best from the continuing
    friendship between the Russian Emperor and our King — for the strip from Thorn close past Kalisz towards
    Kępno would be too slight an equivalent for Prussia''s exertions, and this line could never be regarded
    as a military frontier. Silesia and Prussia would always remain without connection, and in the case
    of Russia''s [uncertain: Huß landt] great power they would have to be regarded as lost provinces,
    because there are no strongholds or rivers of consequence there.


    On the affairs of the Empire I can say little today, for Mr von Gärtner lay very ill for several days,
    and I too have had to keep to my room for 4 days on account of gouty attacks and a swollen head. But
    with the first post I shall be able to write much.'

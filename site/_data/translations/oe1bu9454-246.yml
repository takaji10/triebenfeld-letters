- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Your Serene Highness''s most highly honoured letter of the 9th of this month I received only on the
    23rd; if the letters which I send to Your Serene Highness travel at an equally snail-like pace, then
    things look sad indeed. – Here it is somewhat quiet just now; the monarchical bears [uncertain: uf],
    how they have nevertheless resolved to go to Hungary, and in fact departed thither today. After their
    return the Congress will be opened. The ministers have meanwhile remained here and are working on
    with the greatest activity. Saxony''s fate is now already decided for good: Prussia gets the whole
    of it – Weimar receives a small increment; Meiningen, Gotha etc. remain as they are, yet all of them
    are subordinated to the [uncertain: Laug]. As regards Poland nothing is yet decided. Austria absolutely
    will not lay itself down to the mark, and Talleyrand too seems to be stirring things up under the
    hand, whence the favourable delay. However, one hopes the best from the continuing friendship between
    the [uncertain: Wüßen] Emperor and our King – for the strip from Thorn close past Kalisz towards Kempen
    would be too slight an equivalent for Prussia''s exertions, and this line could never be regarded
    as a military frontier. Silesia and Prussia would always remain without connexion, and given Russia''s
    great power would have to be considered lost provinces, because there are no fortresses or rivers
    of consequence there.


    Of the affairs of the Empire I can say little today, for Herr von Gärtner lay very ill for several
    days, and I too have had to keep to my room for 4 days on account of gouty attacks and a swollen head.
    But with the next post I shall be able to write a great deal.'

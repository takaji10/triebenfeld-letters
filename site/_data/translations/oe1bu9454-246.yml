- page: 2
  en: 'From the aid of His Serene Highness the State Chancellor I hope with confidence for very much good
    for Your Serene Highness — the accompanying piece with all its enclosures I have had to submit after
    altering it twice. The first time I had not adduced Your Serene Highness''s letter, which really must
    be regarded as a power of attorney.


    In the Koschentin matter nothing essential has yet happened, because B. and A. do not find it advisable
    to bring forward so much at one time.


    In the business of the Polish estates I am to keep quiet until Poland''s lot has fallen; for if the
    district in which the Trąbczyn estates lie should indeed fall to Russia, the Prince Chancellor will
    certainly at once procure everything with His Majesty the [uncertain: Western] Emperor for the best
    advantage of Your Serene Highness.


    Zerboni has today received the Order of the Red Eagle, 3rd class, and is going to Warsaw. Heaven still
    dispenses its gifts just as strangely as in 1793. Neuwied, Erbach, Leiningen and several others have
    gone as deputies to the Emperor Franz on behalf of the [uncertain: aufsstände]. The Emperor has most
    graciously [uncertain: received] them and promised to do what is possible — whereupon these gentlemen
    also begged an audience with our King; this the King refused them, and had them merely told that they
    might submit their request in writing. These matters seem to be drawing out very far, and in the


    end the mountain may well bring forth a mouse. For the rest, Herr Privy Councillor von Gärtner (truly
    one of the foremost heads and a much respected man) bombards frightfully, and, as I believe, not without
    effect — the accompanying writing or little volume I see in many places, of which he is the author.
    Four more of the same exist, and each of equal force. The [uncertain: K.] of Würz: is furious about
    it. I send Your Serene Highness this pamphlet so that they may see that everything that can be said
    has already been said, in order to bring the matter back into the old track – I await from


    H. W. the command as to what is still to be said in Your Serene Highness''s name – I do not shoot
    into the blue [illegible] and [illegible] excites a great sensation – God knows what will come of
    it? It is in boundless veneration that I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 25th of October

    1814


    most faithful and obedient servant


    v. Triebenfeld'

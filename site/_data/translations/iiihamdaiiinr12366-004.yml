- page: 1
  en: 'Warsaw, 16 Nov. 1819


    I have the honour to inform you that Mr Mitschke of Kalisz has sent me the documents of your suit
    against Madame Miączyńska. The documents are in order; only the instruments of obligation are missing
    from them, viz. the certificates of the mortgage of the sum which you claim by your action. These
    instruments must be produced in the original or in a duly attested copy.


    The opposing party is pressing for the case to be brought before the court of appeal; for my part
    I am prolonging the preliminary proceedings, but in the end, when all the time limits are exhausted,
    they will have to be concluded, viz. the case submitted for decision.


    For the preliminary proceedings I am using the simple copies which you sent me, but when it comes
    to pleading it is indispensable to produce the originals, or legally attested copies.


    M. Tarczewski'

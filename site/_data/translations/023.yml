status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Serene Highness, I begged [uncertain: recently]
    so imploringly to send some few hundred and coin to my poor daughter? You have not done it. She [it]
    must indeed not have been possible, to be able to bring about. Your Serene Highness will excuse me
    that, like a beggar, I made myself burdensome to you; want drove me to the point of despair – My children,
    and that because they work for money, suffer want, and I go hungry, having sacrificed everything.
    Your Serene Highness at that time, when I was under arrest in Berlin, gave 3000 Rthl, likewise 1000
    Rthl and 300 Rthl, which makes 4300 Rthl. Through the taking up of the 3125 time and 813 charges and
    interest upon interest, I had to take from v. d. Lahr 5140 Rthl and from Cote 9000 Rthl in paper;
    adding to this the costs at 3400, together they are 17500 Rthl. To the above 4300 Rthl comes the iron
    with Curia 4000 Rthl, which is 8300 Rthl, so that there remain 9200 Rthl. I have satisfied costs entirely;
    I have paid Lehr all but 1600 Rthl; I have settled all Praxenstura, expenses and court fees — Yet
    I am still to satisfy the 1600 Rthl to v. d. Lahr, and about 3500 ₰ to Blochsräff and Holzapfeln,
    who [uncertain: lent] me the papers for the payment of the costs – since the French Gen[eral] Gouv[ernement]
    has awarded me 4800 Rthl, these people, who have already sued me and had execution levied, could well
    be paid out of the latter sum when it comes in. So that 1/ Your Serene Highness need never again be
    burdened, there remain in the meantime, once these 5100 Rthl are paid, 4100 Rthl which'
- page: 2
  en: 'I have settled, and which I should only demand one day, when Your Serene Highness has abundance,
    doubly. It grieves me meanwhile when I must hear that Your Serene Highness''s people say behind my
    back that you gave me so very much, that I plunder you — God in heaven — that I prattle to you [uncertain:
    plunder you] or make myself burdensome — I endure execution, am distrained upon for the sake of your
    affairs, my children work for money — must, like common wenches, carry and haul water, my estates
    are sequestrated – I [lose] soon everything — I asked only for a few hundred in coin for my poor children,
    and for that this too is thrown up at me – Most gracious Lord, that tears my heart, and [uncertain:
    Jagst] I swear to God, if He helps me, then no one shall ever see me here again. Köckritz has done
    something for me; I have also been called upon to come to Berlin, but in this sorry situation I shall
    merely thank him and stay away, for I have nothing and go hungry with my children. I have indeed leased
    out my estates, but until St. John''s Day nothing remains over; the arrears of interest eat up everything.
    I must see how I hunger my way through until then, and in order not to suffer a relapse I shall live
    on alone and not appear upon the stage again, where for my good will I am so foully hissed off. Just
    now I am moreover very ill, am paralysed in my hands by the gout, so that I write this with the greatest
    labour. And therefore I beg a gracious excuse for my wretched scribbling. For the rest, the Criminal
    Councillor Stenger will here from Karge, in Zagorowo and Trąbczin, Betsche and Wittow, put everything
    in order and render Your Serene Highness a humble report. He promises to [uncertain: vindicate] Trąbczin
    quickly'
- page: 3
  en: 'and also to recover Kaemen, so that Leixner may not raise an outcry. Hitherto I have raised all
    these costs, paid the people, [uncertain: provisioned] execution and paid fees; there are still 185
    Rthl of fees to be paid, on which account the Glogau Superior Provincial Court executor Allexius was
    to distrain upon me yesterday – but as he found nothing, he had to [text lost] with his charges, which
    with mileage money amount to 25 Rthl Courant. I have hitherto borne everything in silence, and did
    not wish to write Your Serene Highness disagreeable [uncertain: things]. But now I am wholly [uncertain:
    brought to a stand], and have nothing more, but hunger together with my children. I am to conduct
    the lawsuit with Opernheimer, which is pending in Berlin and Poland. 2. that with the ungrateful woman,
    the Schliefen, in Breslau; 3. with the [uncertain: certain] Fund in Breslau concerning the 800 Rthl
    which Hoym advanced to Gratsnauw; 4. with v. d. Lahr, who at that time gave the 5140 Rthl in paper,
    and received iron money in boards, which he afterwards reckoned at only half the value, the iron at
    3 Rthl, so as thereby still to obtain 1600 Rthl; 5. with Blockwerff and Holzapfer, who gave 3500 Rthl
    in paper money in the utmost need in order to satisfy costs; 6. Now [uncertain: Träparin] to vindicate
    [uncertain: Riemen]; 7. To free all the estates from the Polish overseers and to restore Your Serene
    Highness once more to the revenues and the unspeakably great arrears. All this costs a shocking deal
    of money. No one will serve without payment. Up to this point I have given what I could raise. Now
    I have nothing more, but hunger myself along with my children – If the matter now lies still, it is
    not my fault – I lie wretched with the gout and cannot travel either. 591 Rthl 18 g. Courant I have
    borrowed some time since and paid out thus. God knows how this is to be [uncertain: managed]; God
    grant it. It is said the Russians would occupy [uncertain: everything]. In deepest respect I remain,
    until death, Your Most Serene Highness''s Kontop, the 16th of February 1810 faithful humble and obedient
    servant Your Councillor of War and Forests Stenger v. Triebenfeld'
- page: 4
  en: 'because [uncertain: Hähern] do not know there; he has done nothing but denounce and cause damage.
    I shall deliver to Stenger the Heiter paper security; he may deal with him as he deserves and let
    him travel. He wants, however, to have an Actuarius there, and for this he proposes a certain Seifert
    – [uncertain: Still] I do not know the man – He says Seifert would serve for less than half, and would
    be well content with 250 to 300 Rthl. He would seek to save Your Serene Highness, once he has the
    estates free and returned, tenfold in Laudemien and fees what the Seifert would cost, for he must
    have a man there who would keep the archive in order and to whom he could send with security. May
    Your Serene Highness deign to tell me whether you approve of this. Honrichs is to give account of
    himself at once; if not, Stenger will have him arrested and will immediately take in the three demesne
    farms he has appropriated to himself, with cattle and everything. Honrichs has not written for several
    weeks, notwithstanding that I have sent messenger upon messenger to him. Even about the sale of the
    estates he has not said another word. It is a pity about my 6 [uncertain: Ruhe] swine and other game
    which I sent thither – I stinted myself and mine of it and gave it to the man at his own proposal
    in order to gain the coals. Stenger stands in great esteem. He is much in demand – He promises to
    vindicate everything quickly, but he will be well paid. And I have no money now – 591 Rthl [uncertain:
    1/2] I have paid, and 185 ⁒ are still to be paid quickly – the former I borrowed here from the dyer
    when the execution came. The latter I do not know how to raise; it is urgently necessary that both
    sums be paid – I should then he will find means and be able to give Stenger at least 2 to 300 Rthl
    for the journeys – otherwise the man will not stir from the spot any more, and all is lost. Unless
    it be that the Russians take Poland. Lombardini has not given the 150 Rthl to my poor children. 1
    Your Serene Highness would have been thanked if you had sent 500 Rthl in coin to my [illegible] daughter;
    I should have escaped a great disgrace –'

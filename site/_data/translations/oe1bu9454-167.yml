- page: 2
  en: 'Right Honourable may find yourself in the best of health; I commend myself to your continued favour
    and have the honour to remain, in most perfect reverence, Your Right Honourable''s. Öhringen, the
    7th of July 1805.


    humble and obedient servant A: Hahn. The return to Wrocław is fixed without fail for the 25th!'

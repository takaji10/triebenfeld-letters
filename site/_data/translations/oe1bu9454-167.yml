  en: '167


    Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests: At the very moment when
    His Serene Highness the Prince is about to drive to church with the old gentleman, he commands me
    to send the enclosed letter to Your Right Honourable, with His most gracious regards. He would gladly
    have written himself, had the courier not been departing within the hour already.


    The old Prince is very well for his age, and shows exceedingly great attachment to my most gracious
    Lord. I wish from my heart that Your'

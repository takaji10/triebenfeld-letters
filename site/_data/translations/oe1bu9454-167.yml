- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests! At the very moment when
    His Serene Highness the Prince is driving to church with the old gentleman, he commands me to send
    to Your Right Honourable, with his most high compliments, the enclosed letter. He would gladly have
    written himself, had not the ordonnance been departing within the hour.


    The old Prince finds himself, for his age, very well, and shows exceedingly much [uncertain: attachment]
    for my most gracious Lord. I wish from the heart that Your'
  names:

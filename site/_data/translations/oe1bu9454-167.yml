    en: Hahn
    kind: person
- page: 2
  en: 'Right Honourable may find yourself in right good health; I commend myself to your continued favour
    and have the honour to persist in most perfect veneration: Your Right Honourable''s, Öhringen, the
    7th of July 1805.


    humble and obedient servant A: Hahn — the return to Breslau is fixed, without fail, for the 25th!'

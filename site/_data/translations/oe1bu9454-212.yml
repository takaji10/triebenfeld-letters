- page: 2
  en: 'Easter, if the estates are not to be lost.


    I have promised the colonists that if for 3 years they [uncertain: prangt] pay the half, I would obtain
    a remission of the interest; but still the villains refuse. Your Serene Highness would have gained
    after 1 1/2 years and money would nevertheless have come in. Everything was already well disposed,
    but the more recent declaration of Mr Napoleon, that the people are to have so many free years that
    they shall pay the sums owing to Prussia over 40 years in such a manner that on the capital only 3½
    per cent interest and 2½ per cent toward amortisation of the capital must be paid, has anew confused
    all heads, so that nothing good is to be hoped for the present — even the Trąbczyn affair lies still.
    The Prince Poniatowski has written in secret to the tribunal not to give judgment in the matter at
    all, but that if the tribunal may not award the estates to the Dąbska woman, it should refer the matter
    to the higher magistracy — this latter the tribunal has done, after the bitterest debates — the higher
    magistracy is now the King of and Napoleon — the estates were, according to the Peace of Tilsit,'

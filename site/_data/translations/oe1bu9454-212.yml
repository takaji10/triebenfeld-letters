- page: 2
  en: 'be settled by Easter, if the estates are not to be lost. I have promised the colonists that if
    for 3 years [uncertain: prangt] they pay the half, I would procure them a remission of the interest;
    but the [uncertain: Böserichter] still refuse. Your Serene Highness gained after 1 1/2 years, and
    yet money would come in. Everything was already well disposed, but the more recent declaration of
    King Napoleon, that the people are to have so many free years that they shall pay the sums owed to
    Prussia over 40 years in such manner that of the capital only 3½ [uncertain: lerle] interest and 2½
    [uncertain: post] towards amortisation of the capital need be paid, has confounded all heads afresh,
    so that for the present nothing good is to be hoped for — even the Trąbczyn affair lies still. The
    Prince Poniatowski has written in secret to the Tribunal not to adjudicate in the matter at all, but
    rather, if the Tribunal may not award the estates to the Dąbska woman, to refer the matter to the
    higher magistracy — this last the Tribunal has done, after the most bitter debates. The higher magistracy
    is now the King of and Napoleon - the estates are, by the Peace of Tilsit,'

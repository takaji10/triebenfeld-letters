- page: 3
  en: 'torn from Your Serene Highness, and must absolutely be restored to you. Salz is now working the
    matter out. The subjects all wish to have Your Serene Highness as their lord; the old Hollanders offer
    at once to lay down 40000 Rthl. upon the contract concluded with them, and therefore I above all seek
    every means to get the estates back. The valuation of the Zagórów estates I would transmit to Your
    Serene Highness as soon as I can work again. It comes out at 22140 Rthl. annual yield — but that can
    only be reckoned from Midsummer, and when all arrears are paid and all interference of the Government
    is lifted.


    The shortfall arises from the reduced interest, for there I reckon back 1/3 in the first 6 years;
    by my calculation the interest according to the amortisation quantum amounts to 11000 Rthl. yearly.


    Taxes etc. and salaries about 4000 Rthl. = 15000


    Revenues 22140


    There remain to Your Serene Highness 7140 Rthl.


    Meanwhile, after some years, through the absorption of the capital a further 5000 Rthl. accrue again
    — and likewise the 1/3 of interest with 4250 Rthl.


    Then the yield will be 16390 Rthl. The 7140 Rthl can, however, as said, only be reckoned from Midsummer
    —'

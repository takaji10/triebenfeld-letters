- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    A severe illness, such as I have never yet had, has hindered me from writing to Your Serene Highness
    sooner – now I am so far recovered that I can think and act again. The dreadfully great vexation which
    I must swallow here daily might well hinder me from ever growing well again. Still no one here pays;
    31 lawsuits are now pending on that account, and now I hope that some will be compelled to pay by
    execution and distraint, and also that the Olesnicer people will be thrown out. Likewise Niedzwiedzki
    from Kopojno and Hawich from Drzewce are to be cast out, and then 3 demesne farms are to be established
    again, because the Germans not only pay nothing at all but are going to the devil. — There remain
    to be paid some 8657 Rthl 20 [uncertain: dathen] or taxes and dues, 7500 Rthl interest to the Invalids''
    Fund, and on 27000 Rthl other interest and costs — [uncertain: kann] shall I take in enough to [uncertain:
    seinen] this.


    According to the new edicts every colonist brought into the country is to receive 6 free years; upon
    this the people now rest themselves — Meanwhile all this must be between now and NB the land-taxes
    were otherwise discharged in order to preserve the estates, but for the interest which I have guaranteed
    to pay they sequestrate all my estates - how am I to live on that, and where are 34000 M


    to be paid over'

- page: 3
  en: '[uncertain: fardurchlaucht] [text lost: antrißen], and must absolutely be restored to you. [uncertain:
    Salz] is now working the matter out. The subjects all wish to have Your Serene Highness as their lord;
    the old Hollanders offer at once to lay down 40000 Rthl upon the contract concluded with them; therefore
    I am chiefly seeking every means to get the estates back. The valuation of the Zagorowo estates I
    shall transmit to Your Serene Highness as soon as I can work again. It comes out at 22140 Rthl annual
    yield; but that can only be reckoned from Midsummer, and when all arrears are paid and all interference
    of the government is lifted.


    The deficit arises from the lesser interest, for there I reckon back 1/3 in the first 6 years. By
    my calculation the interest, after the amortisation quantum, amounts yearly to


    1000 Rthl


    Taxes, and salaries about


    4000 Rthl


    15000


    Income


    22140


    there remain to Your Serene Highness


    7140.


    Meanwhile, after some years, through absorption of the capital, a further 5000 Rthl come in, and likewise
    the 1/3 of interest with


    4250 Rthl. Then the yield will be 16390 Rthl. The 7140 Rthl can, however, as said, only be reckoned
    from Midsummer.'

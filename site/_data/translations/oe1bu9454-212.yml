- page: 4
  en: 'What may be saved out of the arrears of interest and the entry moneys I cannot yet determine —
    that will first be ascertained by a district commission. I shall do whatever is at all possible. For
    the rest it goes sadly with me: I am ill, lie here in a peasant''s hut and freeze, and in Silesia
    they have sequestrated my [uncertain: Świniary] because I am here at [text lost]. The vexation will
    yet bring me my death, and the Princes'' [uncertain: Sacken] will live; may no year be better for
    Your Serene Highness than the old one —


    In deepest respect I remain, until death,


    Your Most Serene Highness''s


    Swiątniki


    the 1st of January


    1811


    faithful, humble and obedient servant


    v Triebenfeld'

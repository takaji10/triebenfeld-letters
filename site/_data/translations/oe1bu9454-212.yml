- page: 1
  en: '212


    Most Serene Prince,


    Most gracious Lord!


    A severe illness, the like of which I have not yet had, has hindered me from writing to Your Serene
    Highness sooner — now I am so far restored that I can think and act again. The frightful amount of
    vexation which I must [uncertain: swallow] here daily would surely hinder me from ever becoming well
    again. Still nobody here pays; 31 lawsuits are at present pending on that account, and now I hope
    that some will be compelled to pay by execution and distraint, and also that the Olesnicer will be
    thrown out. Likewise Niedźwiecki is to be thrown out of Kopojno and Hawich out of Drzewce, and then
    3 demesne farms are to be established again, because the Germans not only pay nothing at all but go
    to the devil. — There are still to be paid some 8657 Rthl. of soldiers'' money or taxes and dues,
    7500 Rthl. of interest to the Invalids'' Fund, and out of 27000 Rthl. other interest and costs — [uncertain:
    hardly] shall I take in enough to [uncertain: cover] this.


    According to the new edicts every colonist drawn into the country is to receive 6 free years, and
    upon this the people now rest themselves — Meanwhile all this must be [settled] between now and (NB
    the [uncertain: Podacken] were otherwise remitted in order to preserve the estates, but on account
    of the interest which I have guaranteed to pay, all my estates are being sequestrated — how am I to
    live thereby —? and where are 34000 Rthl. to be [illegible] at once_'

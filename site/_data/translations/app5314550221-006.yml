- page: 1
  en: 'the eighth by an oak not far from the same road, at thirty-four rods; the ninth at fifty rods;
    the tenth by the road that runs from Huta to Grądzyń, at forty rods. Going on further by the forest
    of Lomy, crossing the same road, the eleventh at fifty rods; the twelfth likewise at fifty rods, opposite
    the tilled land; the road running from Huta to Rosiszewo having been crossed, the thirteenth at seventy
    rods; the fourteenth likewise at seventy rods, near the road stretching on the left-hand side from
    Huta to Lomowo. And so, crossing the road that runs from Drzewce and Lomowo to Grądzyń, the parties
    came to the road that runs from Łukom to Lomowo, called the Rosiszewo road, and by that same road,
    at eighty rods, the fifteenth was raised. And from that mound, turning to the west and south by that
    same road, and crossing the other road, going from Grądzyń to Drzewce, in a raised place, at forty-five
    rods, the sixteenth mound was heaped up. Then the parties came to the road that runs from Tomice to
    Zagórów and Łukom: at thirty rods the seventeenth; going along that same road between the south and
    the west, at eighty rods the eighteenth; and at twenty rods, by the same road, the nineteenth mound
    was raised. Further, then, taking the course of the road that runs to the corner mounds of the estates
    of Tomice and of the town of Pyzdry, the boundary is to be marked. The boundary wall of the estate
    of Łukomia with Grądzyń being thus dispatched, the compromissory court, at the parties'' wish, went
    down to open two small hills towards Huta belonging to the estate of Łukom, near a muddy place, five
    paces apart from each other, in the earlier boundary marks, which the venerable convent of Ląd had
    taken for wall mounds; when they were opened nothing was found. At last, on the next day, namely the
    Friday next after the same Sunday Misericordia, the present compromissory court, pressing on at the
    parties'' wish, betook itself to the renewal of the mounds between the estate of Łukom on the one
    part, the town of Zagórów on the other, and Drzewce on the third, and, its jurisdiction resumed through
    the court summoner written above, in the presence of those set down above [uncertain: attendentique],
    by virtue of the privileges graciously given to it by the Most Serene Kings of Poland, of the respectable
    and renowned Maciej Kwiecinski, burgomaster, Albert Rozewicz, wójt, Antoni Zalewski, notary, Jan Ogorkiewicz,
    Antoni Nowicki, Kazimierz [uncertain: Bylczynski], Antoni Jankowski, Filip Rudkowski, Kazimierz Bekanowski,
    Tomasz'

- page: 3
  en: 'already submitted the matters there — but I have been advised against it. Thus much was intimated,
    that the records and means of proof are to be held in readiness. I have therefore had the deeds copied
    and authenticated. Likewise the process records are already translated into German and signed by the
    sworn interpreter — they may be [uncertain: bought out] from me and submitted wherever it shall be
    ordered.


    With respect to Your Serene Highness''s military affairs, the Prince Chancellor will doubtless take
    the opportunity to speak with His Majesty when he lays before the King the report concerning the advance
    of 112000 dl.


    The Congress will, as they say, last another 6 weeks — all the settlements of accounts are to be entirely
    concluded here.


    Your Finance Minister von Bülow lies gravely ill with a burning fever; there prevails here a sickness
    from which few remain spared. This is what I have been able to write to Your Serene Highness today
    from my sick-bed. Respectfully I remain as


    Your Serene Highness''s


    Vienna


    the 25th of February 1815


    entirely obedient servant


    v Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The King of Württemberg, seeing limits set to his power, has restored the Estates, which is known
    to Your Serene Highness, and soon thereafter he has proclaimed a kind of diet, at which he has summoned
    all the Estates to appear on the 15th of March. Here he means to come to an agreement with his vassals,
    Estates and subjects — but in advance he commands and lays down as law that there may be no talk whatever
    of any reduction of the taxes, which have been raised by 50 per cent, but rather that both the new
    and the old dues must remain for everlasting time as they stand today and be paid under the strictest
    execution.


    His [uncertain: Royal] Majesty has himself ordered this made known to the venerable old [uncertain:
    five] noble houses with the All-Highest wording "We Friedrich King of [uncertain: Württemberg]" command
    you etc.


    made known and had it so served upon them. Notice of these sentiments, raised by this act of grace,
    has however been given to the Congress here — but nothing has been answered thereupon. The multitude
    of the Estates, among whom is particularly the old Metternich, have at once protested against it here
    before the Congress, and at the same time enquired whether they were bound to present themselves before
    the King of Württemberg on the 15th of March. As yet no answer has been given to this, and particularly
    to the latter question. Yet I have had a hint from high quarters that it does no harm if the Estates
    appear. — Only none of them should let himself be bound to us and outwitted. — A general constitution
    is being drafted, and in it all the rules between lords, vassals and subjects will be determined and
    fixed, in respect of the dues, and even of tolls etc., and with this everyone will be able to be content.
    B: and Göschel now wish that I should give Your Serene Highness the speediest news of it, so that
    you may most urgently warn Prince August that he, out of deep devotion for the uncle, concede nothing
    there to his own detriment and to the damage of the whole, or let himself be outwitted — of this last
    request I hereby acquit myself, whereby I also remark that Mr Goschel takes much pains, yet in five
    months has not once so much as spoken to the Prince Chancellor himself; a Mr von Gärtner who pressed
    himself forward has lost much and lies'

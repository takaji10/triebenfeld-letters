- page: 3
  en: 'already submitted the matters there — but I have been advised against it; so much was intimated,
    to hold the records and the means of proof in readiness. I have therefore had the deeds copied and
    certified. Likewise the process records have already been translated into German and signed by the
    sworn interpreter — they may be [uncertain: made out] for me and submitted wherever it shall be ordered.


    In respect of Your Serene Highness''s military affairs, the Prince Chancellor will doubtless take
    occasion to speak with His Majesty, when he makes his report to the King concerning the advance of
    112000 dl.


    The Congress will still last, so it is said, 6 weeks. All the settlements of accounts are to be entirely
    concluded here.


    The Finance Minister von Bülow lies gravely ill of a burning fever; there reigns here a sickness from
    which few remain spared. This is what I have been able to write to Your Serene Highness today from
    my sickbed. Respectfully I remain as


    Your Serene Highness''s


    Vienna


    the 25th of February 1815


    most obedient servant


    v Triebenfeld'

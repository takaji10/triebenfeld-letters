- page: 1
  en: '274


    Most Serene Prince


    Most gracious Prince and Lord!


    The King of Württemberg, seeing limits set to his [uncertain: power], has (re-established the Estates,
    as is known to Your Serene Highness, and soon thereafter he has proclaimed a sort of Landtag, where
    he has summoned all the Estates to appear on the 15th of March — Here he wishes to come to an agreement
    with his vassals, Estates and subjects — But in advance he commands and lays down as law that there
    can be no question of a reduction of the taxes, which have been raised by 50 per cent, since both
    the new and the old dues must remain in perpetuity as they stand today and be paid under the strictest
    enforcement — His Württemberg Majesty has himself ordered this to the venerable old princely houses
    with the Most High formula "We Friedrich, King of W., etc., to you, etc."


    made known and had it so served upon them. Of these sentiments raised [uncertain: Huldwaller] notice
    was however given to the Congress here — but nothing has been answered thereto — The majority of the
    Estates, among whom in particular is old Metternich, have at once protested against it here at the
    Congress, and at the same time enquired whether they were bound to present themselves on the 15th
    of March before the King of Württemberg. As yet no answer has been given thereto / and particularly
    as to the latter question / — [uncertain: Jedest] I have had the hint from a high hand that it does
    no harm if the Estates appear. — Only none is to let himself be bound and outwitted with us — A general
    constitution is being drafted, and therein all the norms between [illegible], vassals and subjects
    will be determined and fixed with regard to the dues, even the tolls and so on and so forth — and
    with this every man will be able to be content — Barbe and Göschel now wish that I should give Your
    Serene Highness the speediest news of it, so that you may [uncertain: muß das eiligsten] warn Fürst
    August, that he there out of deep devotion for the uncle concede nothing to his own detriment and
    to the damage of the whole, nor let himself be outwitted — of this last request I hereby discharge
    myself, whereby I also remark that Mr von Göschel gives himself much trouble, yet through 5 months
    has not once even spoken to the Prince Chancellor himself; a Mr von Gärtner [uncertain: dar sich zudrung]
    has lost much and lies'

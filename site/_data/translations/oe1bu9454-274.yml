- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The King of Würtemberg, seeing limits set to his power, has [uncertain: reinstated] the Estates, which
    is known to Your Serene Highness, and soon thereafter he has proclaimed a kind of diet, in which he
    summoned all the Estates to appear on the 15th of March. Here he means to come to terms with his vassals,
    Estates and subjects — beforehand, however, he commands and lays down as law that there can be no
    question of any reduction of the taxes, which have been raised by 50 per cent., and that both the
    new and the old dues must remain for all perpetuity as they now stand, and be paid under the strictest
    execution.


    His Würtemberg Majesty has himself made this known to the venerable old [uncertain: five] princely
    houses with the most exalted expression "We Friedrich, King of Wp, command you etc."


    made known and had it thus served upon them. Of these sentiments raised in such homage, however, notice
    has been given to the Congress here — but nothing has been answered thereto. The great number of the
    Estates, among whom is in particular the elder Metternich, have at once protested against it here
    before the Congress, and at the same time enquired whether they were bound to present themselves before
    the King of Würtemberg on the 15th of March. As yet no answer has been given thereto, and particularly
    to the latter question. — Nevertheless I have had the hint from a high hand that it does no harm if
    the Estates appear. — Only none of them should let himself be bound to us and outwitted. — A general
    constitution is being drafted, and in it all the norms between lords, vassals and subjects with respect
    to the dues, even the tolls etc., will be determined and fixed, and with this everyone will be able
    to be content. B: and Göschel now wish that I should give Your Serene Highness the speediest news
    of it, so that You may warn Prince August with the utmost haste, that he there, out of deep devotion
    to the uncle, concede nothing to his own detriment and to the harm of the whole, nor let himself be
    outwitted — of this latter request I hereby discharge myself, whereby I also observe that Mr. Goschel
    gives himself much trouble, yet in five months has not spoken even once with the Prince Chancellor
    himself; a certain Mr. von Gärtner who pressed himself forward has lost much and lies'

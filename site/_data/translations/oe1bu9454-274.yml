- page: 2
  en: 'in fact very ill these past couple of weeks. For the rest, the King of Saxony may now in fact go
    to Brünn, whither he has been summoned; he may not take his journey by way of Dresden, but must go
    through Silesia. There at Brünn he is to declare that he is content and accepts with the highest gratitude
    the patch assigned to him, and will thereby set himself at rest for ever — provisionally this has
    already taken place. — Only the matter is to become more valid, when he is no longer called a prisoner
    in the best case, if he repeats the declaration in freedom. The Grand Duke of Hessen-Darmstadt, who
    made a frightful noise on account of Westphalia and even took it upon himself to threaten, is being
    quite honourably and most vigorously served. He now observes a humanly decent silence and now assents
    willingly to everything. And so this matter too is settled. East Friesland the English have obtained,
    as was secretly promised them before the war for their accession, and our Lord has all Swedish Pomerania
    for it, and thus these matters too are disposed of to satisfaction.


    Switzerland, Italy and Spain still now excite the attention of the combined powers, but this probably
    does not so much interest our Court, and a lasting peace may be reckoned upon with the highest confidence.


    Since I now know for certain, though only these 3 days past, that Your Serene Highness''s affairs,
    particularly the granting of the advance of 112000 Rthl, have been delayed so long purely on that
    account, I now hope for the soonest and best end of it; for the Prince Chancellor, who must obtain
    the King''s approval for the advance, could not come forward with it any sooner than when all fear
    of a new war was removed — this is now said to be the case, and now I hope for the end.


    The Trąbczyn vindication will cause me much anxiety — from the Prince Chancellor I have as yet no
    resolution upon it; I do not know what I am to begin, for without his orders I may nowhere make a
    start. — A commission has been appointed in which General Amstetten presides; gladly would I have'

- page: 3
  en: 'already submitted the matters there — but I have been advised against it — so much was [uncertain:
    indicated], that the files and means of proof be held in readiness. I have therefore had the deeds
    copied and certified — likewise the process files have already been translated into German and signed
    by the sworn interpreter — they may be [uncertain: bought out] from me and submitted wherever it is
    ordered — With regard to Your Serene Highness''s military affairs, the Prince Chancellor will doubtless
    take occasion to speak with His Majesty, when he makes his report to the King concerning the advance
    of 112/m Rthl.


    The Congress will, as they say, last 6 weeks more — all the settlements of accounts are to be entirely
    concluded here — The Finance Minister von Bülow lies very ill of a burning fever; there reigns here
    a sickness from which few remain spared — This is what I have been able to write to Your Serene Highness
    today from my sick-bed. Respectfully I remain as


    Your Serene Highness''s


    Vienna


    the 25th of February 1815


    most obedient servant


    v Triebenfeld'

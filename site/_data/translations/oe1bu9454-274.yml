- page: 2
  en: 'in fact very ill these couple of weeks. For the rest, the King of Saxony could now in fact go to
    Brünn, whither he has been summoned; he may not take his journey by way of Dresden, but must go through
    Silesia. There at Brünn he is to declare that he is content and accepts with the highest gratitude
    the patch assigned to him, and will thereby be set at rest for ever — provisionally this has already
    happened — Only the matter is to become more valid, when he is no longer called a prisoner as in Berlin,
    if he repeats the declaration in freedom — The Grand Duke of Hesse-Darmstadt, who made a frightful
    noise on account of Westphalia and even took it into his head to threaten — has been quite honestly,
    civilly and exceedingly vigorously attended to. He now observes a humanly civil silence and now says
    willingly yes to everything. [illegible]. A. so this matter too is settled — East Frisia the English
    have obtained, just as it was secretly promised them before the war for their accession, and our Lord
    has for that the whole of Swedish Pomerania, and thus these matters too are disposed of to satisfaction
    — Switzerland, Italy and Spain still now excite the attention of the combined powers, but this does
    not so much interest our court, and a lasting peace is to be reckoned upon with the highest confidence
    — Since I now know for certain / though only these 3 days / that Your Serene Highness''s affairs,
    particularly the granting of the advance of 112000 Rthl., have been delayed so long purely for this
    reason, I now hope for the soonest and best end to it, in that the Prince Chancellor, who must obtain
    the King''s [uncertain: approval] regarding the advance, would not come forward with it before every
    fear of a new war had been removed — this is now said to be the case, and now I hope for the end —
    The Trąbczyn Vindication will give me much anxiety — from the Prince Chancellor I still have no resolution
    upon it, I do not know what I am to begin, for without his orders I must nowhere begin — A commission
    has been [uncertain: laid down], in which General Amstetten presides; gladly would I have'

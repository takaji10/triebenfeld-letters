- page: 2
  en: 'in fact very ill these past couple of weeks. For the rest, the King of Saxony may now in fact go
    to Brünn, whither he has been summoned; he may not take his journey by way of Dresden, but must go
    through Silesia. At Brünn he is to declare that he is content and accepts the patch of ground assigned
    to him with the highest gratitude, and will rest satisfied therewith for evermore — provisionally
    this has already been done. Only the matter is to become valid, when he is no longer called a prisoner
    as at best, if he repeats the declaration in freedom. The Grand Duke of Hesse-Darmstadt, who made
    a frightful noise on account of Westphalia and even took it into his head to threaten, has been served
    quite honourably and civilly, and exceedingly vigorously. He now observes a humanly decent silence
    and now says yes willingly to everything. Thus this matter too is settled. East Friesland the English
    have obtained, just as it was secretly promised them before the war for their accession, and our Lord
    has all Swedish Pomerania for it, and thus these matters too have been disposed of to satisfaction.


    Switzerland, Italy and Spain still at present excite the attention of the combined powers, but this
    does not so much interest our court, and a lasting peace may be reckoned on with the highest confidence.


    Since I now know for certain, though only these 3 days past, that Your Serene Highness''s affairs,
    and particularly the granting of the advance of 112000 Rthl, have been delayed so long purely on that
    account, I now hope for the speediest and best conclusion; for the Prince Chancellor, who must obtain
    the King''s approval for the advance, could not come forward with it before all fear of a new war
    had been removed — this is now said to be the case, and now I hope for the end.


    The Trąbczyn vindication will cause me much care — from the Prince Chancellor I have as yet no resolution
    upon it; I do not know what I should begin, for without his orders I may nowhere make a start. — A
    commission has been appointed in which General Amstetten presides; gladly would I have'

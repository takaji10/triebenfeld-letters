status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests! I have just now found
    among my papers some chartes blanches signed by His Serene Highness, which I had packed up in the
    [uncertain: Eilrigbreslau] and which were intended for Your Right Honourable. The same will forgive
    me this oversight when I tell him that in the last nights before the departure I had no rest, since
    the Chamber Director Count from Behringen arrived there, and now everything that concerned the Hoheelohisch
    matters was to be [continued overleaf]'
- page: 2
  en: 'done before the journey should be undertaken. The remaining Chartes blanches I have sent to the
    gracious young ladies von Triebenfeld. I have the honour to remain, with the most perfect veneration,
    Your Right Honourable''s Dresden, the 8th of Nov: 1805. N.S. His Serene Highness appointed me, still
    before the departure, Expeditions-[uncertain: Kathern]!! humble and obedient servant A: Hahn'

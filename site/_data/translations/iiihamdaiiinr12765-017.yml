  en: 'have.


    Since in the meantime some donees in the Kingdom of Poland have been compensated [uncertain: geworden
    werden ist], the Prince of Hohenlohe now likewise makes claim to such.


    In that I then [uncertain: Indem ich dann] communicate to Your Right Honourable his wish, I therefore
    request [illegible] you at the same time to bring the Prince''s request, [uncertain: gefall ist],
    to the knowledge and decision of His Russian Imperial Majesty, yet only quite in general terms and
    without pressing the petition urgently, since this matter must be regarded purely as a matter of grace.'

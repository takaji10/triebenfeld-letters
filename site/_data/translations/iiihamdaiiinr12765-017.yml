- page: 1
  en: 'Berlin, 29 April 1816, ad no. c. 2278. To the Royal Prussian Major General and Envoy at the Russian
    Imperial Court, Mr von Schöler, Your Right Honourable, at St Petersburg.


    (Claim for compensation of the Prince of Hohenlohe on account of the Trąbczyn estates.) the 30th,
    to the post.


    2960.


    His Serene Highness the Prince Friedrich Ludwig of Hohenlohe received from His Majesty the late King,
    of most blessed memory, as a gift the Trąbczyn estates in the Kalisz department, in the district of
    Konin, which were formerly the property of the Starost Prusimski, who had been implicated in the insurrection
    of the year 1794, and had fallen to the State by confiscation. These estates, through the political
    events of the years 1806 and 1807, passed back to the daughter (of the former owner, Frau von Miączyńska,
    and the attempts of the Prince of Hohenlohe to be reinstated in possession of the same have been in
    vain, since His Majesty the Emperor of Russia also confirmed the said Miączyńska in this possession.'

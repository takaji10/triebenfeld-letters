  en: 'Extract from the Princely Hohenlohe Liquidation Registers

    1. The former master of the kitchen Kuch — Gold 100 Rthl; Courant 5050 Rthl

    2. Privy Councillor Strahlen at Wallerstein — Courant 2666 Rthl 16 g

    3. the heirs of von Sobottendorff. — Courant 44200 Rthl

    4. the Countess Höym née von Tauenzien — Courant 5000 Rthl


status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord!


    With a bleeding heart I must now nevertheless report to Your Most Serene Highness my exceedingly great
    misfortune. At Schweiner everything has been sealed up and taken under attachment, in order to sequestrate
    the estates. The usurious von der Lahr had applied for this because the products sent to him, such
    as iron and boards, were some 6 weeks on the way owing to the [uncertain: low] water. Now the dog
    has his payment, but I am ruined, because the other creditors will not withdraw any sooner than until
    they have their interest. Since everything there and here has been taken under attachment, I now have
    small [uncertain: Jord] and know absolutely no way to save myself. My misfortune is now boundless,
    and my children will [be] beggars with me; for out of the sequestration nothing comes, everything
    is eaten up, the interest accumulates and the subhastation follows: estates that are worth 200000
    Rthl will in these times be squandered for a mere 1/3 part. Never should I have believed that things
    could come to this pass with me — I could once count myself among the most well-to-do men of the state;
    now already I must regard myself as a beggar, and why? Merely because I was too good, wished only
    to help the King and other men, because I never looked to my own but to others'' interest. I seem
    to [uncertain: go] among men; I live like a savage in solitary corners and bewail my own and my children''s
    fate, which before God I do not deserve. [uncertain: Sleep] is a stranger to me, and men who only
    mock me I must flee — what wounds me most is'
- page: 2
  en: 'the lamenting and whimpering of my children, from whom I indeed hide myself, but who nevertheless
    pursue me by letter with the most grievous songs of complaint. I can give them nothing, for — as God
    is true — I myself have nothing, and my daughters work for money and let it be sold in secret, so
    as not to grieve me. This alone tears my heart the most. I myself endure hunger, thirst, and every
    peril of life; I have few needs, being neither gambler nor wencher; I should think nothing of all
    these calamities but rather (if I had them to bear alone) suffer them without [uncertain: confusion];
    but the reproach that I must see my children working for money, this deranges my senses and blunts
    my feelings altogether.


    With 1860 Rthl I could be saved, but where am I to take them from, since here and at Schweinern the
    sequestration hangs over us? My credit is now quite gone; I cannot get 100 Rthl, and must [text lost]
    I wanted to raise money out of Zagorow upon the decrees of the French General Government, to take
    1800 Rthl of it for myself and to send Your Serene Highness whatever more came in. I offered — since
    ready money is not let out of the country — to accept horses, sheep and spirits; the poor Honrichs
    entered into it, and wished to see to this. But they have not only forbidden it, they have arrested
    Honrichs at once and threaten to arquebus him — I now have my hands full to save the man, who is the
    father of 1 children. So here too, instead of help, I have costs, sorrow and [uncertain: care]. I
    should have timber, boards and produce to raise money with, but they let me touch nothing and have
    laid an arrest upon everything — I am absolutely first to pay the Lehr affair, out of which the 1860
    Rthl [arise]; then they will lift the sequestration and release to me my property together with all
    the produce again. From that blood-'
- page: 3
  en: 'leech von der Lahr, Grävenitz sends us at this very moment a receipt and a [uncertain: letter]
    to Mr. J. W. v. Loen, to the effect that he is satisfied save for a few hundred d of costs and interest,
    but that he consents to the lifting of the sequestration and execution. This I am sending in this
    very hour to Strelan, to Loen; but through the noise the sequestration has now also been occasioned
    on account of the old and new interest of 1860 Rthl, and until I pay these they will not lift the
    sequestration after all. My fine [uncertain: harvests/hangings], which between brothers were worth
    1000 Rthl, Loen has already had sold for 460 Rthl, and has set off one item of interest against it
    — O, I could go mad. I ought to have murdered, rather than have sacrificed myself for King, country
    and all, and given away such sums — I might then perhaps, as now, [uncertain: have ended tragically],
    but my children would not have had to work for money. Had [uncertain: Vierchitz] [lived], I should
    have had a friend who would not have let me [uncertain: sink]; but he is no more. — I wrote to Mutius
    — but he is himself like to starve. Your Serene Highness is now the only one I have on this round
    earth to whom I can pour out my heart. But whether you can help, God knows. — It is 1800 Rthl by which
    I can be saved; then I am indeed still in debt to the Kockeitzsch family, but that I can take at once
    out of produce which lies here under arrest, and satisfy everybody. Were it possible for Your Serene
    Highness to raise the 1800 Rthl there, I would beg that this sum be sent at once to Professor Schade,
    so that he might immediately pay the interest and press for the lifting of the sequestration — eternally
    would I thank Your Serene Highness for it.


    In this very hour I receive a letter from Lombardini — it is of the 29th of July and already 7 days
    old — that I am to come to Your Serene Highness.'
- page: 4
  en: 'Gladly as I would obey Your Serene Highness''s commands, I cannot do it now. I cannot stir from
    the spot until I am saved and have the estates and the produce free. Then I can travel day and night;
    gladly will I do it, even if I had to go down into hell itself; only just now I am altogether unable
    to travel 3 miles. My horses are gone to the devil, and money I have none.


    If Your Serene Highness can procure counsel, may you deign to do it soon. But command most graciously
    that everything be sent by an express, for the posts go too slowly, as the letters which I receive
    from there prove.


    In deepest reverence I remain, until death, Your Serene Highness''s humble and obedient servant


    v Triebenfeld


    Kontop, the 4th of August 1809.'

- page: 3
  en: 'P.S. I have further prevailed upon Weigel – that he must approach Grotowski, so that Grotowski
    shall at once send along with it a letter to his mandatary at Kalisz – wherein he informs him that
    he is satisfied, and that the latter is to report this immediately to the Government and to tell it
    that there is now no further question of any [uncertain: compulsory auction]. If Grotowski sends this
    letter along, I shall send it on at once by express to Kalisz, so that before the 22nd of this month
    everything is settled.


    In order to convince Your Most Serene Highness that everything has been arranged in the best way,
    Weigel''s letter follows under flying seal – may Your Highness be pleased to close it and send it
    with all haste to Grotowski, so that he may swiftly execute the cession and send the instrument here.
    Until Weigel gave this letter and engaged himself therein that the monies already lie ready with him,
    I did not hand over the money – only now am I letting it be conveyed to him.'

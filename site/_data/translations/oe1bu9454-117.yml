- page: 2
  en: 'He was truly a good man and a genuinely faithful adherent of Your Most Serene Highness.


    But may Your Serene Highness be pleased to take this sudden death to heart — think, in these critical
    times, of Your own preservation, and do not press so hard upon Your health — such rapid marches make
    even the most iron-firm man falter — Morgenbeßer too died yesterday evening at 7 o''clock — Now, most
    gracious Prince and Lord, I appeal to Your heart. That, for the rest, the gallant Nelson caught the
    French as they meant to slip away from Toulon and unite with the Brest fleet, took 2 ships of the
    line of 74 guns together with many boats, and sank several more, Your Most Serene Highness will doubtless
    already know. In Vienna this news has caused a quite extraordinary sensation; the people cheered aloud,
    and it has everywhere been let to be marked all too plainly that the Court and the nation take England''s
    part. That [uncertain: Siderung] Smith is burning Flushing and also the small fleet that was there
    is indeed reported from Vienna, though it is said therewith that the official notices on this are
    still wanting. With Bernhardi I have arranged everything according to Your Most Serene Highness''s
    [uncertain: Willens Mann] — he wrote by yesterday''s post to Mr Stössel and is from now on honestly
    endeavouring to lead the water onto the wheel, which sets the departments in motion, whereby the good
    cause will be quickly brought to its goal.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Wrocław


    29 Feb. 1804. most faithful and obedient servant


    von Triebenfeld'

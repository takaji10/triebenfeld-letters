  en: '117


    Most Serene Prince


    Most gracious Prince and Lord!


    Mr Weigel, now that I have first of all furnished him with a guarantee, is zealously endeavouring
    to smooth the matter over entirely. But until the rights have been ceded (jura cessa) by von Grotowski,
    the Bank will not discount.


    I have therefore persuaded Mr Weigel to write at once to Mr von Grotowski and to give him the assurance
    that the 30/m rt as well as the interest are lying ready with him; but that, before the monies can
    be paid, Mr von Grotowski must execute the instrument of cession for the 30/m rt there with all speed
    before the court, whereupon the monies shall immediately be remitted to him. So as to fail in nothing
    here that may serve to bring the matter about most swiftly, I drove to Court Councillor Ebersbach
    and had him draft the instrument as von Grotowski must execute it, which Mr Weigel sends off in the
    accompanying letter to von Grotowski for prompt execution before the court.


    I hasten to convey this letter, enclosed, to Your Most Serene Highness [uncertain: derstest] by the
    orderly now departing. May Your Highness be pleased only to send it on at once to Mr von Grotowski
    by express, so that he may execute the instrument of cession, whereafter I shall immediately finalise
    the matter. The sudden death of the honest Captain von Müllern has deeply shaken me'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Herr Weigel, after I had first of all furnished him with a guarantee, is zealously endeavouring to
    smooth the matter over entirely. But until the rights have been ceded (jura cessa) by von Grotowski,
    the bank will not discount[.] I have therefore urged upon Herr Weigel that he should write at once
    to Herr von Grotowski and give him the assurance that the 30000 Rthl and the interest as well are
    lying with him. But that, before the monies could be paid, Herr von Grotowski must most speedily execute
    the instrument of cession for the 30000 in court there, after which the monies shall at once be remitted
    to him. In order now to fail in nothing here that may serve to bring the affair about most swiftly,
    I drove to the Court Councillor Ebersbach and had him draft the instrument as Grotowski must execute
    it, which Herr Weigel is despatching in the enclosed letter to von Grotowski for speedy judicial execution.


    I hasten to convey this letter enclosed to Your Most Serene Highness [uncertain: derstest] by the
    orderly just now departing. May Your Highness be pleased to send it on directly to Herr von Grotowski
    by express, so that he may execute the instrument of cession, whereupon I shall then finalise the
    matter at once. The sudden death of the honest Captain von Müllern has shaken me deeply'

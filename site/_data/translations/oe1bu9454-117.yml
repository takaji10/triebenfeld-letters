- page: 2
  en: 'He was truly a good man and a genuinely faithful adherent of Your Most Serene Highness.


    But may Your Serene Highness be pleased to take this sudden death to heart – in these critical times
    think of Your own preservation, and do not storm too hard upon your health – such rapid marches make
    even the most iron-firm man falter — Morgenbeßer likewise died yesterday evening at 7 o''clock – Now,
    Most gracious Prince and Lord, I appeal to your heart[.] That for the rest the gallant Nelson caught
    the French as they were trying to slip away from Toulon and unite with the Brest fleet, took ships
    of 74 cannon together with many boats, and sank several, Your Most Serene Highness will doubtless
    already know. In Vienna this news has made a quite extraordinary sensation, the people rejoiced aloud,
    and it has been let to be noticed everywhere all too plainly that the Court and the nation take England''s
    part. That [uncertain: Sidney] Smith burned Flushing and also the little fleet that was there is indeed
    reported from Vienna, yet it is said withal that the official notices on this are still wanting. With
    Bernhardi I have arranged everything according to Your Most Serene Highness''s will – he wrote by
    yesterday''s post to Herr Stösseln and is from now on honestly endeavouring to lead the water onto
    the wheel, so as to set the springs in motion whereby the good cause will swiftly be brought to its
    goal.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Breslau


    29. Febr. 1804. faithful and most obedient servant


    v Triebenfeld'

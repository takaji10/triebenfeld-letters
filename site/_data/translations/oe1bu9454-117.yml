status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Herr Weigel, after I had first of all furnished
    him with a guarantee, is zealously endeavouring to smooth the matter over entirely. But until the
    jura cessa have been given by v. Grotowski, the bank will not discount — I have therefore [uncertain:
    urged] Herr Weigel that he should write at once to H. v. Grotowski and give him the assurance that
    the 30000 Rthl and likewise the interest are lying ready with him; but that, before the monies can
    be paid, H. v. Grotowski must most speedily execute in court the instrument of cession for the 30000
    and there, after which the monies shall be remitted to him at once. Now, in order that nothing be
    neglected here which may serve to bring the matter about most swiftly, I have driven to Court Councillor
    Ebersbach and have had him draft the instrument as v. Grotowski must execute it, which Herr Weigel
    dispatches in the accompanying letter from v. Grotowski, for speedy execution in court. I hasten to
    convey this letter, enclosed [uncertain: herewith], to Your Most Serene Highness by the orderly just
    now departing. May Your Most Serene Highness be pleased only to send it on at once to Herr v. Grotowski
    by express, so that he may execute the instrument of cession, whereupon I shall then finalise the
    matter forthwith. The sudden death of the honest Captain v. Müllern has shaken me deeply.'
- page: 2
  en: 'He was truly a good man and a genuinely faithful adherent of Your Most Serene Highness. But may
    Your Serene Highness be pleased to take this sudden death to heart — think, in these critical times,
    upon Your own most high preservation, and do not press so hard upon Your health [text lost] — such
    rapid marches make even the most iron-firm man falter. — Morgenbeßer too died yesterday evening at
    7 o''clock. — Now, Most gracious Prince and Lord, I appeal to Your heart. That, for the rest, the
    gallant Nelson caught the French as they meant to slip away from Toulon and unite with the Brest fleet,
    took ships of the line of 74 cannon along with many boats, and sank several, Your Most Serene Highness
    will surely know already. In Vienna this news has made a quite extraordinary sensation; the people
    cheered aloud, and it has everywhere been let to be seen all too plainly that the Court and the nation
    take England''s part. That Sidney Smith burns Vliesingen and also the small fleet that was there is
    indeed reported from Vienna; meanwhile it is said withal that the official notices on this are still
    lacking. With Bernhardi I have arranged everything according to Your Most Serene Highness''s will
    — he wrote by yesterday''s post to M. Stösseln, and is honestly endeavouring from now on to lead the
    water onto the [uncertain: mill-race], so that the departments are set in motion, whereby the good
    cause will be quickly brought to its goal. In deepest reverence I remain, until death, Your Most Serene
    Highness''s Breslau, 29. Febr. 1804. faithful and most obedient servant v Triebenfeld'
- page: 3
  en: 'P. S. I have further [uncertain: prevailed upon] Weigel — that he must approach Grotowski, so that
    Grotowski at once sends along a letter to his mandatary at Kalisz — in which he informs him that he
    is satisfied, and that the latter is to notify this immediately to the Government and to tell it that
    there is now no further question of any subhastation. If Grotowski sends this letter along with the
    other, I shall dispatch it at once by express to Kalisz, so that everything is [uncertain: settled]
    before the 22nd of this month. In order to convince Your Most Serene Highness that everything has
    been arranged in the best way, Weigel''s letter follows under flying seal. May Your Most High Self
    be pleased to [uncertain: close] it and to send it in haste to Grotowski, so that he may quickly execute
    the cession and send the instrument here. Until Weigel gave this letter and engaged himself therein
    that the monies already lay ready with him, I did not hand over the money — only now do I let it be
    conveyed to him.'

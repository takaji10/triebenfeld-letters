- page: 3
  en: 'P.S. I have further prevailed upon Weigel — that he must press Grotowski that Grotowski send along
    at once a letter to his mandatary at Kalisz — in which he informs him that he is satisfied, and that
    he is immediately to report this to the Government and to tell it that there is now no further question
    of a forced sale. If Grotowski sends this letter along with the other, I shall dispatch it at once
    by express to Kalisz, so that before the 22nd of this month everything is smoothed over.


    In order to convince Your Most Serene Highness that everything has been settled in the best way, Mr
    Weigel''s letter follows under flying seal — may Your Highness be pleased to [uncertain: ziemachen]
    it and send it with all speed to Grotowski, so that he may quickly execute the cession and send the
    instrument here.


    Until Weigel gave this letter and engaged himself therein that the monies were already lying ready
    with him, I did not hand over the money — only now do I let it be driven over to him'

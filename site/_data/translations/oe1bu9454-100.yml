segments:
- page: 1
  en: Copy. Most Serene Prince! Most gracious Prince and Lord! I do not fail to report most humbly to
    Your Most Serene Highness that His Majesty, upon the presentation of Your Most Serene Highness's letter
    of the 21st of this month, has been graciously pleased to command that the answering of the same,
    as Your Most Serene Highness yourself appeared to expect, shall remain deferred until the arrival
    of the report required from the Minister of State von Voss. I persist with the deepest reverence Your
    Most Serene Highness's Berlin, the 25th of January 1799. (ad 1 February 1799) most humble and obedient
    servant Beyme

- page: 1
  en: Copy. Most Serene Prince! Most gracious Prince and Lord! I do not fail most humbly to report to
    Your Most Serene Highness that His Majesty, upon the presentation of Your Highness's letter of the
    21st of this month, has been pleased to command that the answer to the same, as Your Most Serene Highness
    yourself seemed to expect, should be deferred until the arrival of the report required from the Minister
    of State v. Voss. I remain, with the deepest reverence, Your Most Serene Highness's Berlin, the 25th
    of January 1799. (ad 1. Febr 1799) most humble and obedient servant Beyme

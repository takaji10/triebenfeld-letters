  en: '100


    Copy. Most Serene Prince! Most gracious Prince and Lord! I do not fail most humbly to inform Your
    Most Serene Highness that His Majesty, upon the presentation of Your Highness''s letter of the 21st
    of this month, has been pleased to command that the answer thereto shall, as Your Most Serene Highness
    yourself seemed to expect, remain deferred until the arrival of the report required from the Minister
    of State v. Voss. I remain with the deepest reverence Your Most Serene Highness''s Berlin


    the 25th of January 1799.


    most humble and obedient servant


    Beyme'

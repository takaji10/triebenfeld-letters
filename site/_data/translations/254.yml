status: draft
segments:
- page: 1
  en: 'It is very sad that I must always wait so long for an answer and for support. Since everything
    goes so exceedingly happily through the honest en endeavour, I have no wish to break off, but rather
    to bring everything to the desired goal – that this cannot be done here in these times with empty
    hands is surely easy enough to estimate; daily I must be together with the men who actually take effect,
    for the Prince Chancellor is too seldom to be seen and in truth has no time to occupy himself with
    matters of this kind. Only these good men who are always about him alone must take effect and direct
    everything — no evening passes on which they do not visit me – 20-30 Rthl go the way, I do not know
    where they get to – One says that upon good news a good draught tastes well, and truly I give it to
    him gladly; men of that sort deserve it of him – I believed I should be here 4 - 5 weeks, and for
    that I demanded 1400 Rthl. Now I have already been sitting here going on 12 [uncertain: weeks] and
    in that long time I have received 640 Rthl – today I am already 94 ducats in debt to Barbe. Now if
    you also send 100 ducats, what remains to me, for I must hand over his money to Barbe – What I have
    received then amounts to 940 Rthl, and that certainly and truly does not suffice for so raging a length
    of time. My affairs stand badly there; I am abandoning my children and my own, for since everything
    is once going happily, I now wish also to bring your affairs quite to the desired goal – and to rescue
    you entirely, as has always been my wish – whereafter I may with every right hope in turn for rescue
    from you, most gracious Prince – It is no small matter what I have already done here and still'
- page: 2
  en: 'am to bring about. Your Polish estates you must recover; thereby you gain air and throw off Leixner
    and the S. Jew Meyer Bernhard. 2. If the Curish debt is discharged, you will be rid of 461000 Rthl
    of debts and the King sees you justified. 3. You will [uncertain: become] Cosmar and stand again as
    lord in all your estates, covered with fame and honour. 4. The Monarch will have to do you justice,
    and compensate you for all sufferings and himself remove every blemish from your honour. 5. You need
    no longer be the mockery of men, still less live on your children''s charity. 6. You come out of the
    Koschentin bonds, and that in the most advantageous and most honourable manner. All this I bring about
    here this time; and so it would be more than cruel if you were to let me suffer want for it, [uncertain:
    dissemble], and become the mockery of men – This would already have happened, I should have had to
    withdraw like a scoundrel, had not the upright Barbe helped me out so brotherly. Six hundred thaler,
    or 200 Rthl, I must par force have here within a fortnight at most, apart from the 100 Rthl that are
    said to be on the way, for otherwise the whole [uncertain: mesh] stands still – Your want there may
    not now be so pressing – Tread now upon your leeches there, they will yield something up, for they,
    B–, will after the appointed investigation see well enough that it is no longer a mere [uncertain:
    sheep] and empty sound, and also that their idol''s reign will henceforth have an end. Believe, most
    gracious Lord, that I would sooner and far rather take an emetic than torment you for money — But
    I cannot do otherwise if I am to go on working with these men. What I demand is only for subsistence.
    In clothing I remain always a [uncertain: Langenhund], and therefore I have as yet seen very few people.'
- page: 3
  en: '254 a) Sixty pieces [uncertain: Fr] I have received from the Carl [text lost], which I hereby certify.
    v Triebenfeld'
- page: 4
  en: '254 b) that I have received from the Herr Referendarius Bally a sealed little purse with fifty
    [uncertain: Er] handed over, which together with a letter from the Most Serene [text lost] was [uncertain:
    overwritten]; this I certify. I shall also render to His Most Serene Highness a most humble report
    on all that is needful, as also on this, tomorrow. Breslau, the 2nd of May 1809. v Triebenfeld'
- page: 5
  en: '254 c) May Your Serene Highness deign to send my daughter some two hundred, that she may not perish
    of hunger. — I beg for it most earnestly, for out of Poland nothing comes forth, everything there
    is blocked – and from here I can send nothing, for I myself live here on credit. Should you not be
    willing to effect it quickly, then have, most gracious Lord, the one kindness of letting me know it
    in the most [uncertain: courageous] manner, so that I may hasten home and find counsel – the reproaches
    of my children (whom I am indeed totally neglecting for the sake of your affairs) [uncertain: cut
    through] my heart — — Unwillingly do I live without calculation – I reckoned at once that I could
    not [uncertain: manage] under 1400 Rthl. The money that I was to send my children per September and
    October, the devil carried off on the journey from Miedzeritz and Schlawenschitz etc.; I firmly believed
    I should find with Your Serene Highness what I had written for; unhappily it was 1000 Rthl less. With
    400 Rthl I went there; 240 Rthl you have sent after me – on that I am to live – here, where the meanest
    secretary receives 100 ducats a week as an allowance – 2 months I have been here – 100 ducats I have
    already borrowed, while there my children go hungry — How is this to end, and how am I to get away
    from here? I do everything for you – I make many enemies for your sake and shrink from nothing in
    order to tear you, my Prince, out of every labyrinth, and for that you let me too and my children
    suffer the most [uncertain: thankworthy] want. Have mercy and [uncertain: send] my children 200 Rthl,
    that I may only be freed from the anxiety – thereafter see to it that I get at least 100 ducats here,
    since we shall certainly remain here another 4 weeks, so that I may pay the most pressing debt and
    travel back unencumbered – Your wishes are all now succeeding through my restless endeavour – do not
    for that let me and my children perish of hunger. v Triebenfeld'
- page: 6
  en: 'all amusements and all mighty processions I know only by the day''s report; I cannot therefore
    make myself any reproach that I have squandered the monies demanded, or applied them otherwise than
    in your interest. For the rest, I beg Your Serene Highness to let the letters to be sent to me go
    entirely under the address of the Royal Prussian Chief Post Director Herr Mann in Vienna; that is
    to say, the letter to me is duly sealed and provided with the address, and then an outer cover is
    made and the full address made out to the Chief Post Director Marne — This is after all an easy trouble,
    and the letters go more surely and more swiftly, especially if you send the same to Neisse to the
    post twice every week. For from here the Prussian post goes twice weekly to Breslau and arrives twice.
    You can indeed have my horses used for it – Now alone is the moment, most gracious Prince, now one
    must stir oneself and spare nothing — where the blank forms are, where the letter to the Prince is,
    where the 100 tt lie, by God, I sit here and could despair, because I am without any news from Your
    Serene Highness – this need not be, if you always gave the letters to Neisse on the Prussian post
    and under the above address — Meanwhile I will endure all sufferings, if only a good report comes
    in from the Brieg Superior Court – see to that there in the best way. Of the Koschentin sale Your
    Serene Highness must not say anything to anybody too soon, for if the creditors scent a rich purchaser
    they will be little willing to remit anything of the capital; this must be settled just as we [uncertain:
    swiftly] arranged the closing note from Count Pourtales beforehand. You can therefore write and seal
    beneath the written undertaking for B alone in [uncertain: my stead] — This is security enough for
    an honest man. v Triebenfeld'

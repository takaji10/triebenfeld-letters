- page: 1
  en: 'Document no. 460


    Bolesław, Duke of Poland, 27 March 1276, at Dłusk; gives Count Mikołaj, treasurer of Ląd, the village
    of Trąbczyn.


    Original on parchment. On thick cords of faded silk thread three seals are hung. The first is Duke
    Bolesław''s (seal XVI); the second is lost, only the strand of silk thread remains; the third is Duke
    Przemysł''s (seal XXI).


    Library of the Princes Czartoryski. Diplomata.


    In the name of the Lord, amen. While the letter lives, the deed committed to it lives, whose assertion
    nourishes memory and, strengthened, takes increase. Therefore we Bolesław, by the grace of God Duke
    of Poland, together with our beloved little son Duke Przemysł and with our beloved wife Lady Jolenta,
    having regard to the faithful services of Count Mikołaj, our treasurer of Ląd, have finally and with
    pure intent given him our village which is called Trupcino, to be possessed by him and his descendants
    by hereditary right for ever .. (sic) although we had once given the said village to Count Janko son
    of Szymon, who died having no offspring, and so the said village came back to us .. (sic) and we had
    given the named village to Lord Mikołaj, who has gone the way of all flesh and had no lawful successors
    .. and so of right we have given the village named before to the said Count and his successors. And
    we free the said village altogether from these payments: from the ox, from the cow, from the opole,
    from the castle, from the poradlne, from the watch, from the podworowe, from carting, from conveyance,
    from the naraz. The privilege of Janko of blessed memory shall be of no force, as also that of the
    said Mikołaj, formerly parish priest of Środa .. And so that this our gift, which has come forth so
    duly from us all, may not be undone by anyone in the course of time, we have had the present writing
    strengthened by the protection of our seals, in the presence of these witnesses: Count Jarkelbold,
    palatine of Gniezno; Count Sykstus, castellan of Ruda .. Count Żegota, huntsman of Kalisz; Count Berwold,
    cupbearer of Ląd .. Count Sędziwój, under-chamberlain of Gniezno; Świętosław our scribe. Given in
    the year of the Lord 1276, written at Dłusk on the sixth day before the Kalends of April, on the eve
    of St Priscus the martyr and of Malchus.


    Lenda, Ląd. Trupcino, Trąbczyn. Sroda, Środa. Rudensis, of Ruda. Dluscho, Dłusk.'

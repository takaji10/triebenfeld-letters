- page: 3
  en: 'namely to enjoy free windfall and gathered wood, and yearly 4 days of free digging of pine-stumps
    in the Zagórów forests; also that, should the lordship find it necessary to assign a certain district
    in addition, this district may not be under 330 Morgen, and that those hereditary lessees shall be
    entitled to pasture their sheep in this district: this has been provisionally noted upon the application
    of those named at the outset, by virtue of the decree of 18 December 1804.


    II. Judicially secured debts and other real obligations


    1., is cancelled. is


    2., 250000 Rthl, two hundred and fifty thousand Reichsthaler in Prussian Courant, at 5 per cent annual
    interest, and after the lapse of one year subject to a 6 months'' notice of termination open to both
    parties, have, as a loan under the bond of the proprietor dated Wrocław, 1 June 1814, been for'

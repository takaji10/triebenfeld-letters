- page: 8
  en: '22 Feb. [uncertain: gr.] has been registered.


    3., A protestation concerning a capital of 8000 Rthl, that is, eight thousand Reichsthaler, together
    with interest at 5 per cent from Christmas 1803, on behalf of the heirs of the Count von Seher-Thoss,
    [uncertain: Oberhof mundschmuck (possibly Oberhofmundschenk, Chief Cupbearer of the Court)], has been
    registered, upon the application of the Royal Wrocław Board of Wards of 14 Feb. 1806, with reference
    to the settlement dated Wrocław, 25 January 1804, between the proprietor, the reigning Prince of Hohenlohe-Ingelfingen,
    Friedrich Ludwig, Serene Highness, and the special authorised representative of the said Count Seher-Thoss,
    by virtue of the decree of 4 March 1806, against the estates of Trąbczyn, Szetlewek, Zagórów, Kopojno
    and Drzewce, also Swięcia with their appurtenances. I hereby certify the agreement of this extract
    with the mortgage book remaining from the former government, with the addition that the above state
    of the mortgage of the estate of Zagórów has in no respect been altered down to the present day. Given
    at Kalisz, on the eighteenth day of September in the year one thousand eight hundred and eleven. Conservator
    of Mortgages of the Department of Kalisz


    Dierschlag'

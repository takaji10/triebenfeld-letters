- page: 2
  en: 'which has been registered ex officio on the strength of the application of the War and Domains
    Chamber at Kalisz, dated Kalisz, 18 November 1802, by virtue of the decree of 14 December 1802.


    3., A protestation on behalf of the Chamber''s treasury (pro fisco Camerae) concerning the entitlement
    already vested in it, on the strength of the confiscation of the ecclesiastical estates which has
    taken place, to demand the right to building and firewood from the forests belonging to this estate
    and the payment of the surplus cash forest allowance, has been registered upon the application of
    the treasury''s mandatary by virtue of the decree of 25 January 1803.


    4., A protestation on behalf of Johann Giese, Johann Bagans and Friedrich Gietzinger concerning the
    right stipulated to them in the hereditary-lease contract concluded with the proprietor on 22 February
    1804 over the estate of Olesnica,'

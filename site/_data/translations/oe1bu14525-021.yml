- page: 4
  en: 'the Councillor of War and Forests Peter Friedrich August von Triebenfeld, by virtue of the decree
    of 5 June 1804, in consequence of the debtor''s petition to that effect, registered against the estates
    of the town of Zagórów, Kopojno, Swiątniki, Skokum, Drzewce, Olesnica, Wrąbczyn, Grądzyń, which are
    at the same time liable for costs and damages.


    To No. 2. 50,000 Rthl, fifty thousand Reichsthaler out of the sum of 250,000 Rthl registered above
    under No. 2, the holder thereof, the royal Councillor of War and Forests von Triebenfeld, has pledged
    to the Royal General Invalids'' Fund, and eventually ceded in full property, on account of a loan
    of like amount received from the same at 5 per cent annual interest payable in half-yearly instalments
    at Berlin free of postage, subject to a mutual 6 months'' notice of termination, to the said General
    Invalids'' Fund, in accordance with the instrument issued thereon under date Berlin, 28 January'

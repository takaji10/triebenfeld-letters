- page: 1
  en: 'Official Extract


    [The?] town of Zagórów, situated in the province of South Prussia (now, however, in the Duchy of Warsaw)
    and in the district of Konin thereof, was conveyed to the reigning Prince of Hohenlohe-Ingelfingen,
    Friedrich Ludwig, Serene Highness, by His Majesty King Friedrich Wilhelm II, by the instrument of
    grant of Berlin, 19 June 1797, in hereditary and proprietary right, and the title of possession was
    registered for him pursuant to the decree of 31 July 1801. Thereupon there are registered:


    I. Perpetual charges and restrictions upon the property or upon the disposition thereof.


    1., is cancelled.


    2., 88 Rthl 5 Groschen 9 d, eighty-eight Rthl 5 Groschen 9 d Prussian Courant, are paid annually out
    of this estate as an allowance to the Kalisz War and Domains Treasury,'

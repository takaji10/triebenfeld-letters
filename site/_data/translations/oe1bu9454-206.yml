  en: '206


    Most Serene Prince


    Most gracious Prince and Lord!


    Lombardini has now been there, and Your Most Serene Highness already knows everything — I had to tear
    away the veil in order to look into what is hidden. As Your Most Serene Highness''s sole admirer and
    adherent I believed I might withhold nothing, and therefore I reported to you that which lies in ambush,
    and what dangers threaten you, noblest of men — But do not quail — it will [uncertain: perhaps one
    day] turn out better than you suspect — With this government, however, count on nothing for yourself;
    I now know it all — From the North, as surely as there is a God, satisfaction shall come to you —
    Only for now, patience and calm — Knobelsdorff is certainly making the exchange, as the enclosure
    shows — the rest I have set in train — Tatz is coming to me for the wool market, then the necessary
    concerning Trąbczyn — I only wish first to clear the air for you as regards your domestic affairs;
    then I shall, if need be, go to Petersburg myself; you shall yet be avenged, noble and upright Prince,
    with the greatest éclat — With regard to the 35/m rt, writing must be done; the flighty Eberhard has
    not yet sent me a syllable — Scharnhorst has spoken much on Your Serene Highness''s account in Koźle
    — It has been declared that they are willing, if need be, to give you a sum of money — but do not
    accept that, upright Prince — Just vengeance shall be'
- page: 2
  en: 'yours, for that I stand surety — With the 35/m rt one must wait — if only I had the schema from
    Eberhard — If the exchange succeeds, and the quick sale of the estates, then you may laugh in advance
    — Everything will go well — Even friend K[öckritz] prophesies a blessed end for our government; the
    most fatal thing is that the journeys require so much money; I must [uncertain: von gei mal gei 3
    frey stellen] at Petersdorff sell for 1800 rt merely to obtain money; I lose 3200 rthl thereby — but
    that must come out through the transaction — On the 2nd I go to Poland to smooth everything out and
    to be able to make everything ready for Knobelsdorff''s plans. According to my plan, Cabanis is to
    prove on oath how many grounds belong to Zagórów — 2ndly, all the contracts are to be laid out, showing
    what of them has been [uncertain: put out on hereditary lease] and disposed of, and also what remains
    for the establishment of new demesne farms, on which Knobelsdorff sets such store.


    3. What has been paid anywhere and what is still outstanding — this every hereditary leaseholder and
    colonist is to acknowledge.


    4. To come to a settlement with Honrichs so that Knobelsdorff may find accommodation — If this is
    [uncertain: obtained], then no devil can raise any objection against the matter. I shall for that
    purpose [uncertain: unterſam] the referendary Sommer of Wrocław, and there request a Polish friend
    at law from the prefecture'
- page: 3
  en: 'and also to bring in the chief district administrator Hegener, and have all this [uncertain: verified];
    then, I believe, even envy itself must be petrified by this affair — Once again, dearest and most
    exalted Prince, be calm, let God govern, all will come right. I remain eternally, with the most unbounded
    attachment and the deepest reverence, Your Most Serene Highness''s Wrocław


    the 16th of September


    1810 faithful most humble and obedient servant v Triebenfeld'

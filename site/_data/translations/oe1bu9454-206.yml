- page: 2
  en: 'come to you; for that I stand surety — With the 35000 Rthl one must wait — if only I had the schedule
    from Eberhardt – If the exchange succeeds and the swift disposal of the estates, then laugh in advance
    – Everything will go forward – Even friend K., prophet, with our government: a blessed end. The most
    tiresome thing is that so much money is required for the journeys; I must sell 3 free holdings at
    Petersdorff for 1800 Rthl, from [uncertain: gei] to [uncertain: gei], merely to obtain money; I lose
    3200 Rthl thereby – but that must come out again through the transaction – On the 2nd I go to Poland
    to smooth everything and to be able to prepare everything for Knobelsdorff''s plans. According to
    my plan Cabanis is to prove on oath how many parcels of ground belong to Zagorowo.


    2ndly, all contracts are to be laid out, showing what of them has been brought under cultivation and
    disposed of, and also what remains for the establishing of new demesne farms, upon which Knobelsdorff
    sets so much store.


    3. What has been paid anywhere and what is still outstanding – this every hereditary lessee and colonist
    is to acknowledge.


    4. To come to terms with Honrichs, so that Knobelsdorff finds an accommodation. If this is achieved,
    then no devil can raise any objection against the matter. For this I shall [uncertain: engage] the
    referendary Sommer from Breslau and there request a Polish legal friend from the prefecture'

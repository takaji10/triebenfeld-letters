- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Lombardini has now been there, and Your Most Serene Highness already knows everything – I had to tear
    away the veil in order to look into what lay hidden. As Your Most Serene Highness''s sole admirer
    and adherent I believed I might conceal nothing, and therefore I reported to you what lies lurking
    in ambush, and what dangers threaten you, noblest of men – But do not falter – it will yet one day
    turn out better than you suppose — With this government, however, count on nothing for yourself; I
    now know the whole of it – From the north, as surely as there is a God, satisfaction shall come to
    you – Only now patience and calm; Knobelsdorff exchanges, as the enclosure shows, assuredly – the
    rest I have set in train – Tatz is coming to me at the wool market, then the necessary concerning
    Trąbczyn – I only want first to give you relief in respect of your domestic affairs; then I will if
    need be go myself to Petersburg; you shall, noble upright Prince, yet be avenged with the greatest
    éclat. With regard to the 35000 Rthl there must be writing done; the flighty Eberhard has not yet
    sent me a syllable – Scharnhorst has spoken much on Your Serene Highness''s account at Cosel – It
    has been declared that they would at need give you a sum of money – but do not accept that, upright
    Prince – Just vengeance shall be'

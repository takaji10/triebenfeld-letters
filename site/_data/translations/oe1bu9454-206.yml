- page: 3
  en: 'and also to draw in the chief district administrator Hegener, and have all of this verified; then
    I believe that even envy itself must be turned to stone in this matter. Once again, dearest, most
    exalted Prince, be at peace, let God rule; all will come right. Eternally I remain, with the most
    unbounded attachment and the deepest reverence, Your Most Serene Highness''s Breslau


    the 16th of September


    1810 faithful most humble and obedient servant v. Triebenfeld'

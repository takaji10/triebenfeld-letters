segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Weigel is now firmly resolved to accept the estates to be negotiated for the Zagorowo lordship, be
    they the Knobelsdorff or the Pommahisch ones, and to set off against them his own and Stossel''s claims.
    Tomorrow, being the 30th, he intends to spend the day with me at Schweinerin, in order to confer upon
    everything bearing on this matter.


    I report this happy event to Your Serene Highness so that you may for once sleep in peace. I shall
    strive with glowing zeal to bring this affair to the most desirable conclusion, and were Heaven to
    crown a second work, then I shall order Your Serene Highness''s domestic affairs in such a manner
    that within a short time all care on that account shall become foreign to you. The plan is this –
    the merchants here, N.B. the rich ones, have fallen into a mania for possessing great estates. There
    is a wish to buy Schweinern from me; one man has already offered me 220000 Rthl Courant, good money;
    I ask 250000 [illegible]. If I obtain that, then I get 160000 ₰ in cash, since only 40000 ℔ are intabulated
    upon the estates – once Weigel and Stössel are satisfied. Grotowski, Lichnowski, Zerboni and others
    belong upon Trąbczyn, so I believe that with 150000 [uncertain: Rolle] I can wholly extinguish your
    other debts.


    May God grant thereto His blessing and prospering; after the success I mean to thank Him quietly in
    my own lines. Everything is now well set in train, and perhaps I shall bring you the most desirable
    news sooner than you think.


    But let the Most gracious Prince also work to the end that the plan with H[err] August succeeds –
    then you can not only enjoy your days happily still within the circle of your children and count with
    certainty upon the good fortune that from every side people will make you a thousand crooked Lorenzes
    with a hundred thousand [uncertain: Lequenz] – but also be assured that people will offer you God
    knows what — I assure your children of my deepest reverence – and I remain, until death, with the
    most unbounded esteem, as


    Your Most Serene Highness''s


    Breslau, the 29th of August


    1810.


    Humble and faithful servant


    v. Triebenfeld'

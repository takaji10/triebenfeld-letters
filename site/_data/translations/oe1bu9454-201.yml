- page: 1
  en: '201


    Most Serene Prince


    Most gracious Prince and Lord!


    Weigel is now firmly resolved to accept the estates that are to be bargained for in exchange for the
    lordship of Zagórów, be they the Knobelsdorff or the Poninski ones, and to offset his own and Stössel''s
    claims against them. Tomorrow, the 30th, he intends to spend the day with me at Świniary, in order
    to confer upon everything bearing on this matter.


    I report this happy event to Your Serene Highness so that you may for once sleep in peace — I shall
    strive with burning zeal to bring this matter to the most desired conclusion, and should Heaven crown
    a second work as well, I shall so arrange Your Serene Highness''s domestic affairs that in a short
    time all care on that account shall become strange to you — the plan is this — the merchants here,
    note well the rich ones, have fallen into a mania for possessing great estates. There is a wish to
    buy Świniary from me; one man has already offered me 220,000 Rthl. Courant in cash, and I am asking
    250,000 Rthl. If I obtain that, then I shall come out with 160,000 Rthl. in cash, since only 90,000
    Rthl. are intabulated upon the estates — Once Weigelt and Stössel are satisfied, and Grotowski, Lichnowski,
    Zerboni and others are charged to Trąbczyn, I believe that with 150,000 Rthl. all your other debts
    may be entirely discharged.


    May God grant his blessing and prospering to it; when it has succeeded I shall thank him for it quietly
    upon my [uncertain: lines]. Everything is now well set in train, and [uncertain: perhaps] I shall
    bring you the [uncertain: most desired] tidings sooner than you think.


    But do you also work, most gracious Prince, that the plan with Prince August may succeed — for then
    you will not only still be able to enjoy your days happily in the circle of your children and count
    with certainty upon the good fortune that on all sides a thousand [uncertain: crooked Lorenzes] with
    a hundred thousand [uncertain: Sequenz] will be made to you — but also be assured that God knows what
    will be offered you — To your children I commend my deepest reverence — and I remain, until death,
    with the most unbounded respect,


    Your Most Serene Highness''s


    Wrocław, the 29th of August


    1810.


    humble and faithful servant


    v. Triebenfeld'

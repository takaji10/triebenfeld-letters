- page: 2
  en: 'place by virtue of that same Treaty, and in particular the benefits stipulated by article 18 can
    be applied only to possessions cut through by the frontier line which separates the Kingdom of Poland
    from the Grand Duchy of Posen.


    It follows in consequence that the stipulations of the said Treaty could in no manner be interpreted
    in favour of the petitioner.


    Besides, in claiming the advantages granted to mixed proprietors, Count Bethusy appears to have in
    view only the liberty of making from time to time transports of the iron ore which he possesses in
    the Kingdom, for the needs of his forges in Silesia — a liberty which he enjoyed without restriction
    under the Prussian Government, but which he could not recover in the present state of things, seeing
    that the exportation of the said materials, as harmful to the interest of the country''s manufactories,
    is absolutely prohibited by our customs regulations.'

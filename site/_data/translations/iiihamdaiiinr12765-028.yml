- page: 1
  en: 'Copy of a report of Prince Zajączek to His Majesty the Emperor.


    Sup. No. 2432. Warsaw, 23 May / 4 June 1819.


    Sire, The Minister Secretary of State having, by his official letter of 1/13 April last, transmitted
    to me the petition of Count Ernest Bethusy, by which the latter asks to be admitted, together with
    his three sons, to the enjoyment of the benefits stipulated with regard to mixed proprietors by article
    18 of the Treaty of Vienna, concluded with Prussia on 21 April / 3 May 1815, I hasten to lay at the
    foot of Your Imperial and Royal Majesty''s throne the explanations which the Commission of the Interior
    and of Police has just presented to me on this subject.


    Count Bethusy possesses lands in the Kingdom of Poland and in Prussian Silesia; now the provisions
    of the Treaty of Vienna concern only the inhabitants and proprietors of those countries whose separation
    took'

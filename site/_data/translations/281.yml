status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The bearer of this letter is the servant of Herr Court
    Councillor Barbi, who is to go out into the Reich and fetch the Court Councillor''s sister — whose
    husband is employed in the bureau of the Prince State Chancellor — and bring her to Berlin. I have
    given him my 3 horses for the purpose; may Your Serene Highness now be pleased to command there that
    Stock, for so the servant is called, be given a wicker wagon — over which a half-cover of ticking
    can be made in short order — so that the journey may be set out upon quickly. The Court Councillor
    will know how to deserve this favour and to make it good — then the 3 Hardenberg Privy Court Councillors
    Barbe, Heym, and Philippsborn have several crates of glass lying at Prague — these they wish to have
    fetched from there and brought to Schlawenschitz. Now it is requested that Your Serene Highness might
    have the grace and give Stock a two-horse conveyance along with him, so that, since he goes by way
    of Prague, he may load the glass there and [uncertain: convey] it with the free pass to Schlawenschitz
    — This cannot be refused — Your Serene Highness will have the more friends in this house. For the
    fetching of the glass the drummer will no doubt have to be sent, since the pass is made out for the
    fellow; the servant [text/sense uncertain: waarzug] whom Your Serene Highness cannot make use of,
    may you be pleased to send back to [uncertain: Alizancio] provided with a pass, and the same can also
    be done with the drummer when he returns from there with the glass-conveyance. I beg that these matters
    be effected. For the rest, Herr von Stägemann has still made no report — It seems'
- page: 2
  en: 'to every friend only too probable that the most infamous intrigue lies at the bottom of this, and
    other démarches are now being made to bring us nearer the goal — Something will be done to Your Serene
    Highness''s advantage, and something must be done — The one misfortune is that Eberhard cannot come
    here and conclude the settlement with the Curish heiresses — upon the assurances given me I had built
    on that first of all. — Now I must [uncertain: let the matter go to ruin] with it — In the meantime
    I shall see with my friends what we can [uncertain: now] do. — But if the settlement could take place,
    then nothing more fortunate could happen, even though 50 or 100000 Rthl more would now have to be
    given, than — as I have often said already — that the administration should last somewhat longer.
    The chief purpose would meanwhile be attained — Your Serene Highness would be able to [uncertain:
    keep clear of] the debts, and would be relieved of all cares — Pourtales has not yet written, and
    the Köhl affair too still lies in the [uncertain: worse], and one now does not know at all what will
    become of it. — So far nothing is settled, save that if the [uncertain: Satia] Trąbczyner [illegible]
    Your Serene Highness is to have other estates, and that perhaps in Silesia. However it may be, I hope
    with the next post to be able to report something very good to Your Serene Highness, and could I conjure
    Eberhard hither, all would be attained that one could wish. Money, to be sure, the King will not at
    present permit much of to be given, but yet by an order to pay everything could be arranged — The
    King of Würtemberg has nevertheless given his so-called constitution to the Estates, but the Congress
    has protested against everything. The Napoleonic business continues to make great sensation here —
    A few days ago letters were also intercepted from the former King of Italy to Bonap[arte]: — It is
    singular that in such cases one does not proceed more rigorously — In deepest reverence I remain.
    Your Serene Highness''s. Wien, the 24th of March 1815. wholly most obedient servant v Triebenfeld'

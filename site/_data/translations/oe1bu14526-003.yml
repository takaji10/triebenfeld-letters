status: draft
segments:
- page: 1
  en: 'The copy of the purchase contract found among the Acta is written on a [blessed/late] 8 rt. stamp
    [uncertain: S. Melich]. We, the Princely Hohenlohe-Ingelfingen Court Office at Betsche, do hereby
    certify and attest that between Mr. Joseph von Jankowski as vendor on the one part, and Mr. Captain
    and District Tax Receiver Andreas Ernst Gneust as purchaser on the other part, the following purchase
    contract, recognised before the Magistrate at Birnbaum under the 24th of June 1797, was solemnly published
    before Us under the 6th of May of last year, and the whole of the proceedings run word for word thus:


    Between the Right Honourable Mr. Joseph von Jankowski at [illegible]inino, vendor,


    and the Honourable Mr. Captain and District Tax Receiver Andreas Erenst Greust, purchaser, there has
    been agreed and concluded, subject to higher confirmation, the following house contract concerning
    the free village-headman''s estate belonging to the former and situated in Dormowe not far from Birnbaum,
    together with its appurtenances, after negotiations previously conducted thereon; the nearer determinations
    whereof are confirmed by the deed of purchase presently drawn up thereon and executed by both


    participating gentlemen by their own-hand signatures and seals'
- page: 2
  en: 'seals, the deed of purchase executed thereby confirms. Namely, there sells, for himself and his
    heirs and successors in inheritance,


    I. the Mr. Joseph von Jankowski mentioned at the outset, his free village-headman''s estate situated
    in Dormowe and hitherto held by him in property, together with all dwelling and [uncertain: work/value]
    buildings belonging thereto, fields, [uncertain: Furen] meadows, [uncertain: Reichen] and [uncertain:
    Reich] sites, fisheries, cattle pastures, pleasure and fruit gardens, waters, watercourses, marshes,
    all as the same lie within their bounds and boundary-stones, together with the farming and ploughing
    implements belonging to the estate, all according to the further content of the house valuation appended
    to these house grounds, together with everything therein which is [text unclear] Brd. Brand, Brand,
    wall-fast, church-maid and root-fast, no less all rights and privileges, also usufructs, burdens and
    encumbrances everywhere, nothing thereof excluded, and entirely in the measure in which Mr. Vendor
    purchased the said free village-headman''s estate, according to the privilege of the 19th of June
    1787, from Mr. Florian Gelanski and his sister Jadwiga Galanska, heritably and in property,


    II. to the last-mentioned Mr. Captain and [uncertain: Preis] Tax'
- page: 3
  en: 'Receiver Andreas Ernst Greust, heritably and in property, for 2000 rt., in words two thousand Reichsthaler
    Prussian Courant, as a whole, fixed purchase sum paid in cash this day, for the due receipt whereof
    Mr. Vendor also gives Mr. Purchaser the best and most fully valid receipt in law.


    III. All costs on account of this transaction of purchase, among which belong also the 10 per cent,
    or drawing-off monies, which were customary in earlier times, Mr. Purchaser bears alone, and on this
    account he shall raise no accounts against Mr. Vendor.


    IV. The annual onera consist, according to the aforementioned privilege,


    a., in 25 Tynphe travelling-money to the Betsche manor


    b., in 5 Szostawa ground-rent


    c., in 5 quarters of oats


    d., in 1 Tynph fox-money


    e., in 2 [uncertain: Rappamten] and


    f., the customary church dues, which Mr. Purchaser takes over just as his predecessor in the farm
    did, and has promised to render.


    In return there is granted to the same'
- page: 4
  en: 'V. in these same privileges, permission to keep 250 head of manorial sheep, and as wages for the
    shepherd''s rights


    50 head with free pasturage on the Dormowe ground. Should he, however, wish to keep more, then for
    every head kept over and above this number a [uncertain: Büttchen], or after Silesian [uncertain:
    Heinige] one Silbergroschen, is to be paid at the Betsche manor.


    VI. He may brew freely here for his household use, but sell or give away nothing thereof. Otherwise
    he will have to pay the penalty imposed upon him by the Betsche manor.


    VII. The Mr. Purchaser has firewood free from the Betsche forest for his whole household, servants
    and livestock, also for brewing; likewise the needful building timber, yet not otherwise than according
    to the instruction of the Commissarius or forester appointed thereover. Just as the oaks, apart from
    his tree gardens, which stand upon the fields or grounds of this free estate, are to be used by Mr.
    Purchaser in the same manner as by the other free village-headmen of the Betsche key-district.'
- page: 5
  en: 'VIII. The estate cannot yet be stated quite definitely as regards the [uncertain: Anker] or the
    number of Hufen. It is, however, sold as it lies within its [text unclear] and boundaries, in buildings,
    fields, gardens and meadows etc., also with everything which the present tenant Mr. Hertzog received
    pro Inventario in livestock and ploughing implements — which is moreover to be specially appended
    — also with complete winter and summer sowing.


    IX. The delivery of the sold free village-headman''s estate and its appurtenances takes place to Mr.
    Purchaser and [uncertain: mehro gestort]; and Mr. Vendor submits himself to the handing over of all
    documents concerning the estate and of all records bearing thereupon, likewise renders to Mr. Purchaser
    the customary warranty of the country against any man''s claims and demands, and assures the same
    that upon this sold free village-headman''s estate there attach neither real nor other debts, by whatsoever
    name they may be called,'
- page: 6
  en: 'X. Mr. Vendor now consents to the corresponding rectification of the Titulus possessionis in the
    name of Mr. Purchaser in the mortgage book to be adjoined there;


    finally and


    XI. the participating gentlemen mentioned at the outset mutually assure one another of the maintenance
    of the concluded agreement according to all the conditions and reservations therein agreed and almost
    laid down, and at the same time renounce, deliberately and expressly, any and every evasion and legal
    remedy to be made against this contract of purchase, in particular the evasion of error, of misunderstanding
    and non-understanding, of over-hastiness, of being outwitted, of a sham transaction, of a matter agreed
    otherwise than written down, of injury above or below the half, and by whatsoever other name they
    may be called.


    In witness whereof the present purchase [uncertain: pricht] has been drawn up in two identically worded
    copies and, upon prior reading aloud, by the participating gentlemen'
- page: 7
  en: 'participating gentlemen approved throughout, likewise confirmed by their own-hand signatures and
    seals on both sides, and exchanged one against the other. Thus done at Birnbaum, the 24th of June
    1797. (L. S.) Joseph von Jankowski


    (L. S.) Andreas Ernst Gneust.


    That Mr. Joseph von Jankowski, Right Honourable, at Ninino, well known in person to the undersigned
    court personnel, and the Captain and District Tax Receiver Mr. Andreas Gneust, Honourable, appeared
    personally coram judicio and not only acknowledged throughout, after the reading aloud had taken place,
    the content of the above contract of purchase concluded for 2000 Rthr. over the free village-headman''s
    estate situated in Dormowe, but also recognised the signatures and seals appearing thereunder as their
    own — this is credibly attested on the ground of a protocol held thereon this day, under the customary
    signature and impression of the [uncertain: geirthelichen] court seal. Thus done'
- page: 8
  en: 'Birnbaum, the 24th of June 1797.


    Goeker


    Justice-Burgomaster


    and Justitiarius here


    (L. S.)


    Bauer


    Town and Justice [uncertain: Seon]


    here


    Actum Betsche, the 6th of May 1799. At today''s term for the publication of the contract of purchase
    concluded extrajudicially under the 24th of June 1797 between Joseph von Jankowski, tenant at Ninino[uncertain],
    and the District Tax Receiver Andreas Ernst Gneust at Birnbaum, over the free village-headman''s estate
    situated sub Nr. 1 at Dormowe, and recognised sub eodem dato before the Justice Magistrate at Birnbaum,
    there appeared:


    1, the vendor Joseph von Jankowski


    2. the purchaser, District Tax Receiver Gneust; and since the former was not known to the court, he
    was identified by the lessee Eichaust as the person for whom he gave himself out. To the vendor von
    Jankowski, not being master of the German language, the aforesaid purchase contract of the 24th of
    June 1797 was thereupon read by the sworn interpreting Senator'
- page: 9
  en: 'Hintsch, slowly and distinctly in the Polish language, but to the purchaser in the German language,
    and both declared once more, deliberately, before the court,


    how they hereby once again approve this contract of purchase in all its points and will faithfully
    hold to it for ever. In particular the vendor von Jankowski declared how he hereby, for himself and
    his heirs, resigns the sold property to the purchaser, District Tax Receiver Gneust, and renounces
    all further claims for ever; as he also acknowledges himself to be fully satisfied in respect of the
    purchase price, and therefore approves that the Titulus possessionis be rectified for the purchaser
    at the mortgage building on the ground of the contract of purchase.


    Wherewith this protocol of publication was [text lost]'
- page: 10
  en: 'closed, and after the reading aloud and interpretation had taken place, was approved in every part
    by the appearers and, in evidence thereof, signed by their own hand in Actis. Joseph Jankowski


    Andreas Ernst Gneust


    Eichaust


    Schleich


    Hintsch


    We are now pleased, at the request of the contracting parties, hereby to confirm this contract of
    purchase by virtue of Our office as court, and to protect the possessor in his acquired right, yet
    without prejudice to Ourselves and to any man in his right; We have also, for the greater credit hereof,
    caused this contract of purchase to be drawn up in documentary form under Our seal and signature.
    Thus done at Betsche, the 6th of May 1799. Princely Hohenloh-Ingelfingen Court Office here. Schenck


    p.t. Justitiarius


    Purchase contract issued


    between Mr. von


    Jankowski and District Tax


    Receiver Gneust'
- page: 11
  en: The foregoing contract I confirm, yet without prejudice to all my rights, and in particular with
    the reservation of having my rightful claims examined more closely according to the old land registers.
    Friedrich Ludwig Fürst zu Hohenlohe

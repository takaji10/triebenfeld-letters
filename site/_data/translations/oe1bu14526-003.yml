- page: 3
  en: 'collector Andreas Ernst Gneust, in heritable property, for 2000 rt., written out two thousand Reichsthaler
    Prussian Courant, an entire, settled purchase sum paid in cash this day, for the due receipt whereof
    Mr. Seller does also give Mr. [uncertain: Purchaser] the fullest and most legally binding receipt.


    III. All costs on account of this transaction of sale, among which belong also the 10 per cent, or
    deduction monies, such as were customary in earlier times, Mr. Purchaser bears alone, and on this
    account he will [uncertain: not] have to render any accountings to Mr. Seller.


    IV. The annual charges (onera) consist, according to the aforementioned privilege,


    a., in 25 Tynphe, travel money to the Betsche manor;


    b., in 5 Szostaki of ground rent;


    c., in 5 quarters of oats;


    d., in 1 Tynph of fox money;


    e., in 2 [uncertain: Rappamten]; and


    f., the customary church dues, which Mr. Purchaser takes over like his predecessor in the holding
    and has undertaken to render.


    In return there is granted to him'

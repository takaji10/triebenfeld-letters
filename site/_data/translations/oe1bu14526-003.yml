- page: 4
  en: 'V. In this same privilege he is permitted to keep 250 head of the lordship''s sheep, and as wages
    for the shepherd''s rights


    50 head with free pasturage on the Dormowe ground. Should he, however, wish to keep more, then for
    every head kept over and above this number a [uncertain: Büttchen], which according to Silesian [uncertain:
    Heinige] is one silver Groschen, is to be paid to the Betsche manor.


    VI. He may brew beer freely for his household use, but sell or give away nothing thereof. Failing
    which, he will have to pay the penalty imposed upon him by the Betsche manor.


    VII. The purchaser has firewood free from the Betsche forest for his whole household, servants and
    livestock, also for brewing; likewise the timber needed for building, yet not otherwise than upon
    the instruction of the commissary or of the Prince set over the same. Just as those oaks outside his
    tree gardens which stand upon the fields or grounds of this free holding are to be used by Mr. Purchaser
    in the same manner as by the other free village mayors of the Betsche district (Schlüssel).'

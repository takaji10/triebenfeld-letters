status: draft
segments:
- page: 1
  en: 'The copy of the deed of sale found among the Acta is written upon a stamp of 8 rt. [uncertain:
    S. Melich] We, the Princely Hohenlohe-Ingelfingen Court Office at Betsche, do hereby attest and testify
    that between Mr Joseph von Jankowski as seller of the one part and Mr Captain and District Tax Receiver
    Andreas Ernst Gneust as purchaser of the other part, the following deed of sale, recognised before
    the Magistracy at Birnbaum on the 24th of June 1797, was solemnly published before Us on the 6th of
    May last, and the whole of the proceedings run word for word thus:


    Between the Right Honourable Mr Joseph von Jankowski of [illegible]inino, seller,


    and the Honourable Mr Captain and District Tax Receiver Andreas Erenst Gneust, purchaser, there has
    been, subject to higher confirmation, agreed and concluded the following house contract concerning
    the free schulz-holding belonging to the former and situated in Dormowe not far from Birnbaum, together
    with appurtenances, after negotiations previously conducted thereupon; the nearer determinations whereof
    are confirmed by the present deed of sale drawn up thereon and executed by both


    of the participating Gentlemen by their own-hand signatures and seals'
- page: 2
  en: 'seals, executed. Namely, there sells, for himself and his heirs and heirs-at-law,


    I. the Mr Joseph von Jankowski named at the outset, his free schulz-holding situated in Dormowe and
    hitherto possessed by him in property, together with all dwelling and [uncertain: work] buildings
    belonging thereto, fields, [uncertain: furrows] meadows, [uncertain: ponds] and pond-sites, fisheries,
    cattle pastures, pleasure and fruit gardens, waters, watercourses, marshes, all as the same lie within
    their bounds and boundary-stones, together with the farming and ploughing implements belonging to
    the holding, all according to the fuller content of the house-valuation appended to these house-grounds,
    together with all that is therein and [unparseable] fixed by nail, wall, [uncertain: church] and root,
    no less all rights and privileges, also usages, burdens and encumbrances, nothing whatsoever excepted
    therefrom, and entirely in the measure in which the Mr Seller purchased the said free schulz-holding,
    by privilege of the 19th of June 1787, from Mr Florian Gelanski and his sister Jadwiga Galanska, in
    heritable property,


    II. to the last-mentioned Mr Captain and District Tax'
- page: 3
  en: 'Receiver Andreas Ernst Gneust, in heritable property, for 2000 rt., in words two thousand Reichsthaler
    Prussian Courant, as a whole, fixed and this day cash-paid purchase sum, for the due receipt whereof
    the Mr Seller does also acquit the Mr Purchaser in the best and most legally binding form.


    III. All costs of this transaction of sale, among which belong also the 10 per cent, or withdrawal-monies,
    customary in former times, the Mr Purchaser bears alone, and on this account he shall render the Mr
    Seller no accounting.


    IV. The yearly onera consist, according to the aforementioned privilege,


    a., in 25 Tynphe travelling-money to the Betsche manor


    b., in 5 Szostaki ground-rent


    c., in 5 quarters of oats


    d., in 1 Tynph fox-money


    e., in 2 [uncertain: Rappamten] and


    f., the customary church dues, which the Mr Purchaser assumes like his predecessor and has vowed to
    render.


    In return there is granted to him.'
- page: 4
  en: 'V. in this same privilege he is permitted to keep 250 head of the manorial sheep, and as wages
    for the shepherd''s rights


    50 head with free pasturage upon the Dormowe ground. Should he however wish to keep more, then for
    each head kept above this number a [uncertain: Büttchen] of the Silesian [uncertain: Heinige], one
    Silbergroschen, shall be paid to the Betsche manor.


    VI. He may brew beer freely for his household use, but sell or give away nothing thereof. Failing
    which he will have to pay the penalty imposed upon him by the Betsche manor.


    VII. The Mr Purchaser has firewood free from the Betsche forest for his whole household, servants
    and livestock, also for brewing; likewise the needful building timber, yet not otherwise than upon
    the instruction of the Commissarius or forester appointed thereover. Just as those oaks outside his
    tree-gardens which stand upon the fields or grounds of this free holding are to be used by the Mr
    Purchaser in the same manner as by the other free schulzen of the Betsche key-district.'
- page: 5
  en: 'VIII. The holding cannot as yet be given quite definitely as to the fields, in respect of the number
    of Hufen. It is however sold as it lies within its [uncertain: bounds] and borders, in buildings,
    fields, gardens and meadows etc., also with everything that the present lessee Mr Hertzog received
    pro Inventario in cattle and ploughing implements, and which is moreover to be separately [uncertain:
    appended], also with complete winter and summer sowing.


    IX. The handing over of the sold free schulz-holding and its appurtenances is made to the Mr Purchaser
    and [uncertain: is henceforth undisturbed], and the Mr Seller submits himself to the delivery of all
    documents concerning the holding and of all information bearing thereupon; he also affords the Mr
    Purchaser the customary warranty of the land against every man''s claims and pretensions, and assures
    him that upon this sold free schulz-holding there attach neither real nor other debts, by whatever
    name they may be called,'
- page: 6
  en: 'X. The Mr Seller now consents to the corresponding rectification of the Titulus possessionis in
    the name of the Mr Purchaser in the mortgage book to be there kept for the purpose. Finally, and


    XI. the participating Gentlemen named at the outset mutually assure one another of the maintenance
    of the concluded contract, according to all the conditions and reservations therein agreed and fixed,
    and at the same time renounce, deliberately and expressly, any and every evasion and legal remedy
    to be raised against this contract of sale, in particular the plea of error, of misunderstanding and
    non-understanding, of overhaste, of circumvention, of collusive dealing, of a matter agreed otherwise
    than as written down, of injury above or below the half, and by whatever other name they may be called.


    In witness whereof the present [uncertain: instrument of sale] has been drawn up in two identically
    worded exemplars and, upon prior reading aloud, by the participating Gentlemen'
- page: 7
  en: 'by the participating Gentlemen approved in every part, also confirmed by their respective own-hand
    signatures and seals and exchanged one against the other. Thus done, Birnbaum, the 24th of June 1797.
    (L. S.) Joseph von Jankowski


    (L. S.) Andreas Ernst Gneust.


    That Mr Joseph von Jankowski, Right Honourable, of Ninino, and the Captain and District Tax Receiver
    Mr Andreas Gneust, Honourable, both well known in person to the undersigned court personnel, appeared
    coram judicio in person and not only, after the reading had taken place, acknowledged throughout the
    content of the above contract of sale concluded for 2000 Rthr. over the free schulz-holding situated
    in Dormowe, but also recognised the signatures and seals thereunder as their own: this is credibly
    attested, upon the ground of a protocol taken thereupon this day, under the customary signature and
    impression of the [uncertain: judicial] court seal. Thus done,'
- page: 8
  en: 'Birnbaum, the 24th of June 1797.


    Goeker


    Justice-Burgomaster


    and Justitiarius here


    (L. S.)


    Bauer


    Town and Court [uncertain: Seon]


    here. Actum Betsche, the 6th of May 1799. At today''s term for the publication of the deed of sale
    concluded extrajudicially on the 24th of June 1797 between Joseph von Jankowski, lessee at Ninino[uncertain],
    and the District Tax Receiver Andreas Ernst Gneust at Birnbaum, concerning the free schulz-holding
    situated under No. 1 at Dormowe, and recognised sub eodem dato before the Justice Magistracy at Birnbaum,
    there appeared:


    1, the seller Joseph von Jankowski


    2. the purchaser District Tax Receiver Gneust; and since the former was not known to the court, he
    was identified by the leaseholder Eichaust as the person for whom he gave himself out. To the seller
    von Jankowski, not being master of the German tongue, the aforesaid deed of sale of the 24th of June
    1797 was thereupon read by the sworn interpreter Senator'
- page: 9
  en: 'Hintsch, slowly and distinctly in the Polish tongue, but to the purchaser in the German tongue,
    and both declared once more deliberately before the court


    how they hereby once again approve this deed of sale in all its points and will faithfully hold to
    it for ever. In particular the seller von Jankowski declared that he hereby resigns the sold parcel
    to the purchaser District Tax Receiver Gneust for himself and his heirs, and renounces all further
    claims for ever; likewise that he acknowledges himself fully satisfied in respect of the purchase
    price, and therefore approves that the Titulus possessionis be rectified for the purchaser at the
    mortgage book upon the ground of the deed of sale.


    Wherewith this protocol of publication was'
- page: 10
  en: 'closed, and after the reading aloud and the interpretation had taken place was approved throughout
    by the comparents and, in evidence thereof, signed by their own hand in Actis: Joseph Jankowski


    Andreas Ernst Gneust


    Eichaust


    Schleich


    Hintsch. We are now pleased, upon the request of the contracting parties, hereby to confirm this deed
    of sale by virtue of Our office, and to protect the possessor in his acquired right, yet without prejudice
    to Our own and every man''s right; and We have also, for the greater credit thereof, caused this deed
    of sale to be issued in due form under Our seal and signature. Thus done, Betsche, the 6th of May
    1799. Princely Hohenlohe-Ingelfingen Court Office here. Schenck


    p.t. Justitiarius


    Deed of sale, issued,


    between Mr von


    Jankowski and District Tax


    Receiver Gneust'
- page: 11
  en: The foregoing contract I confirm, yet without prejudice to all my rights, and in particular with
    the reservation of having my entitlements more closely examined according to the old land registers.
    Friedrich Ludwig Fürst zu Hohenlohe

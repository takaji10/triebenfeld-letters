segments:
- page: 1
  en: 'The copy of the deed of sale found among the records is written on a [uncertain: S. Melich] of
    8 rt. St. [illegible]. We, the Princely Hohenlohe-Ingelfingen Court Office at Betsche, do hereby record
    and attest that between Mr. Joseph von Jankowski as seller on the one part and the Captain and district
    tax collector Andreas Ernst Gneust as purchaser on the other part, the following deed of sale, acknowledged
    before the Magistrate at Birnbaum on the 24th of June 1797, was solemnly published before Us on the
    6th of May last, and that the whole of the proceedings run word for word as follows:


    Between the Right Honourable Mr. Joseph von Jankowski of [illegible]inino, seller,


    and the Honourable Captain and district tax collector Andreas Erenst Gneust, purchaser, there has
    been, subject to higher confirmation, negotiated and concluded the following deed of sale concerning
    the free village mayor''s holding belonging to the former and situated in Dormowe not far from Birnbaum,
    together with its appurtenances, after negotiations previously conducted thereupon, the closer particulars
    whereof are confirmed by the present deed of sale drawn up thereupon and executed by both


    participating gentlemen by their own hands'' signatures and seals'

    appearing, and in evidence thereof signed by their own hands in the records. Joseph Jankowski


    Andreas Ernst Gneust


    Echaust


    Schleich


    Hintsch. We now, upon the request of the contracting parties, will hereby confirm this deed of sale
    on the part of the court and protect the possessor in the right he has acquired, yet without prejudice
    to Us and to any man in his right; and for the greater credibility we have also caused this deed of
    sale to be issued in documentary form under Our seal and signature. Done at Betsche, the 6th of May
    1799. Princely Hohenlohe-Ingelfingen Court Office here. Schenck


    p.t. justiciary


    Deed of sale issued


    between Mr. von


    Jankowski and the district tax


    collector Gneust'

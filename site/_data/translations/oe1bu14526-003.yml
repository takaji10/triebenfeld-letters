- page: 5
  en: 'VIII. As regards the arable, the holding cannot yet be stated quite definitely in the number of
    Hufen. It is, however, sold as it lies within its balks and boundaries, in buildings, fields, gardens
    and meadows etc., also with everything which the present lessee Mr. Hertzog has received by inventory
    in livestock and ploughing implements, and which is furthermore to be specially appended, also with
    the complete winter and summer sowing.


    IX. The delivery of the sold free village mayor''s holding and its appurtenances to Mr. Purchaser
    takes place [uncertain: forthwith], and Mr. Seller submits himself to the handing over of all documents
    concerning the holding and of all information bearing thereupon, also gives Mr. Purchaser warranty
    according to the custom of the country against any man''s claims and demands, and assures him that
    upon this sold free village mayor''s holding there rest neither real nor other debts, by whatsoever
    name they may be called,'
  names:
  - de: Hertzog
    en: Hertzog
    kind: person
- page: 6
  en: 'X. Mr. Seller now consents to the corresponding entry of the titulus possessionis in the name of
    Mr. Purchaser in the mortgage book to be kept there for that purpose. Finally, and


    XI. The participating gentlemen named at the outset mutually assure one another of the maintenance
    of the concluded contract according to all the conditions and reservations agreed and settled therein,
    and at the same time renounce, deliberately and expressly, any and every subterfuge and legal remedy
    to be raised against this contract of sale, in particular the plea of error, of misunderstanding and
    of failure to understand, of overhastiness, of being outwitted, of a sham transaction, of the matter
    having been agreed otherwise than as written down, of injury above or below the half, and by whatsoever
    other name they may be called.


    In witness whereof the present deed of sale has been drawn up in two copies of identical wording,
    and upon prior reading aloud by the participating gentlemen'
- page: 7
  en: 'approved in every part by the participating gentlemen, also confirmed by their signatures in their
    own hands on both sides and their seals, and exchanged one against the other. Done at Birnbaum, the
    24th of June 1797. (L. S.) Joseph von Jankowski


    (L. S.) Andreas Ernst Gneust.


    That Mr. Joseph von Jankowski, Right Honourable, of Ninino, and the Captain and district tax collector
    Mr. Andreas Gneust, Your Honour, both well known in person to the court personnel signing at the end,
    appeared in person coram judicio and not only acknowledged throughout, after it had been read aloud,
    the content of the above contract of sale concluded for 2000 Rthr. over the free village mayor''s
    holding situated in Dormowe, but also recognised the signatures and seals appearing thereunder as
    their own: this is credibly attested on the basis of a protocol taken thereupon this day, under the
    customary signature and the impression of the judicial court seal. Done at'

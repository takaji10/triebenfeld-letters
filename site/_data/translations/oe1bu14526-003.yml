    and justiciary here


    (L. S.)


    Bauer


    town and judicial [uncertain: Seon]


    here Actum Betsche, the 6th of May 1799. At today''s appointed hearing for the publication of the
    deed of sale concluded out of court on the 24th of June 1797 between Joseph von Jankowski, lessee
    at [uncertain: Ninino], and the district tax collector Andreas Ernst Gneust of Birnbaum, over the
    free village mayor''s holding situated under No. 1 at Dormowe, and acknowledged sub eodem dato before
    the judicial Magistrate at Birnbaum, there appeared


    1, the seller Joseph von Jankowski


    2. the purchaser, the district tax collector Gneust; and since the former was not known to the court,
    he was identified by the leaseholder Echaust as the person for whom he gave himself out. Thereupon
    the aforesaid deed of sale of the 24th of June 1797 was, for the seller von Jankowski, who has no
    command of the German language, read out by the sworn interpreter, Senator'

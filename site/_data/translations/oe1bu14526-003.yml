- page: 2
  en: 'seals executed, the deed of sale confirms. Namely, there sells, for himself and his heirs and successors
    in inheritance,


    I. the aforementioned Mr. Joseph von Jankowski his free village mayor''s holding situated in Dormowe
    and hitherto held by him in property, together with all dwelling and farm buildings belonging thereto,
    fields, [uncertain: furrow] meadows, ponds and pond sites, fisheries, cattle pastures, pleasure and
    fruit gardens, waters, watercourses, marshes, all as the same lies within its bounds and boundary
    stones, together with the farming and ploughing implements belonging to the holding, all according
    to the fuller content of the house valuation appended to these house grounds, together with all that
    is therein and [illegible] Brd. fire, fire, wall, church maid and root-fast, no less all rights and
    privileges, also uses, burdens and encumbrances everywhere, nothing thereof excepted, and entirely
    in the measure in which Mr. Seller purchased the said free village mayor''s holding in heritable property,
    according to the privilege of the 19th of June 1787, from Mr. Florian Gelanski and his sister Jadwiga
    Galanska


    II. to the last-named Captain and district tax'

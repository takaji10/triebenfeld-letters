- page: 9
  en: 'Hintsch, slowly and distinctly in the Polish language, but to the purchaser in the German language,
    and both declared once more, deliberately, before the court,


    how they hereby once again approve this deed of sale in all its points and will faithfully abide by
    it for ever. In particular the seller von Jankowski declared how he wished hereby, for himself and
    his heirs, to resign the sold parcel of land to the purchaser, the district tax collector Gneust,
    and to renounce all further claims for ever; just as he also acknowledged that he was fully satisfied
    with respect to the purchase price, and therefore approved that the titulus possessionis be entered
    for the purchaser at the mortgage book on the basis of the deed of sale.


    Wherewith this protocol of publication was [text lost]'

segments:
- page: 1
  en: 'Whereas I have this day made over by way of hereditary lease the demesne-farm and husbandry buildings
    at Swięcia, together with the arable, meadows, woodlands etc. belonging thereto, to Johann Christian
    Birlack of Zilenzig, Johan Götzinger of Brennenhofs Fleis, Joh. Siebert of Zamaika near Sonnenburg,
    and to Friedrich Götzinger, innkeeper at Posen, but have thereby excepted from it the proper manorial
    dwelling-house at Swięcia: I therefore herewith make over and give this manorial dwelling-house at
    Swięcia to Friedrich Götzinger, innkeeper at Posen, as a mark of acknowledgement for the trouble taken
    and the journeys made by him in this hereditary-lease business, to him and his heirs as his own property,
    so that he may deal, dispose and do therewith at his pleasure, and because he can make particularly
    good use of this house for the tap in connexion with the brewery hereditary lease he has taken over.


    Breslau, the 8th of April 1803.


    Friedrich Ludwig Fürst zu Hohenlohe'

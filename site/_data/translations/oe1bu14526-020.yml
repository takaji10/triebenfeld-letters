segments:
- page: 1
  en: 'Whereas I have this day made over by way of hereditary lease the Vorwegs [uncertain: Vorwegs] farm
    buildings at Swięcia together with the appurtenant fields, meadows, woodlands etc. to Johann Christian
    Birlack of Zilenzig, Johan Götzinger of Brennenhofs Fleis, Joh. Siebert of Zamaika near Sonnenburg,
    and to Friedrich Götzinger, innkeeper at Posen, but have excepted therefrom the actual manorial dwelling-house
    at Swięcia: I therefore herewith make over and bestow this manorial dwelling-house at Swięcia upon
    Friedrich Götzinger, innkeeper at Posen, as a token of recognition for the pains and journeys he has
    had in the matter of this hereditary-lease business, as heritable and absolute property, so that he
    may deal and dispose with it and [uncertain: gebohren — "bear/be born"; sense unclear, perhaps for
    "gebahren" (to conduct oneself) or "gebieten" (to command)] according to his pleasure, and because
    he can put this house to particularly good use for the tap in connexion with the brewery hereditary
    lease he has taken over.


    Breslau, the 8th of April 1803.


    Friedrich Ludwig Fürst zu Hohenlohe'

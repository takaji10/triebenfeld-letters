status: draft
segments:
- page: 1
  en: 'Whereas I have this day made over by way of hereditary lease the demesne-farm working buildings
    at Swięcia, together with the fields, meadows, woodlands etc. belonging thereto, to Johann Christian
    Birlack of Zilenzig, Johan Götzinger of Brennenhofs Fleis, Joh. Siebert of Zamaika near Sonnenburg,
    and to Friedrich Götzinger, innkeeper at Posen, but have excepted therefrom the actual manorial dwelling
    house at Swięcia: I hereby make over and give this manorial dwelling house at Swięcia to Friedrich
    Götzinger, innkeeper at Posen, as a token of acknowledgement for the pains and journeys he has had
    in this hereditary-lease business, heritably and in full ownership, so that he may deal, dispose and
    act with it at his pleasure, and because he can put this house to particularly good use as a tap-house
    under the brewery hereditary lease he has taken over.


    Breslau, the 8th of April 1803.


    Friedrich Ludwig, Prince of Hohenlohe'

segments:
- page: 1
  en: '171


    Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests. Since I know that Your Right
    Honourable takes an interest in news of my most gracious Lord, I take the liberty of conveying to
    you the assurance that His Serene Highness is almost entirely healed of the Bible in his foot, and
    is in other respects perfectly well; the foot is only a little swollen still, and causes no pain.
    His Serene Highness wishes to be most kindly commended to you. The Order of St Andrew has given pleasure,
    yet the courteous conduct of His Majesty the Emperor has given rise to still greater satisfaction.'

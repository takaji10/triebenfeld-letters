- page: 2
  en: 'The Prince is quite enchanted by this young and courteous monarch. In Wrocław too the Emperor is
    said to have spoken of His Serene Highness in the most flattering terms.


    Today the Hohenlohe regiment marched through here; the Prince had ridden out to meet it. Tomorrow
    the Duke of Weimar is expected here. I commend myself to Your Right Honourable''s favour, and have
    the honour to remain in the most boundless esteem,


    Your Right Honourable''s


    Erfurt, 24 November


    1805


    humble and obedient servant


    A. Hahn'

status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests. Since I know that news
    of my most gracious Lord is of interest to Your Right Honourable, I take the liberty of conveying
    to you the assurance that His Serene Highness is almost entirely healed of the [uncertain: Bibel]
    on his foot, and in all else perfectly well; the foot is only a little more swollen, and causes no
    pain. His Serene Highness wishes to be most kindly commended to you; the Order of St Andrew has given
    pleasure, yet the gracious conduct of His Majesty the Emperor has afforded still more gratification.'
  names:
  - de: Kriegs und Forst Rath
    en: Councillor of War and Forests
    kind: other
  - de: Andreas Orden
    en: Order of St Andrew
    kind: other
- page: 2
  en: The Prince is quite enchanted by this young and gracious monarch. In Breslau too the Emperor is
    said to have spoken of His Serene Highness in the most flattering terms.

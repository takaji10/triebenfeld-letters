- page: 2
  en: 'and of the profitable services rendered and still to be rendered to us in our Royal House by His
    Lordship the reigning Prince of Hohenlohe-Ingelfingen, our General of Infantry and Governor of Wrocław,
    resolved by Cabinet Orders of the 22nd of October and 7th of December of last year to grant this his
    petition in such manner and to approve the same, only that the following conditions shall obtain therein,
    namely


    1. that the compensation to be granted to the subjects for their hitherto existing rights of pasturage
    and of taking wood be more nearly determined, and that in the hereditary-rent deeds of each individual
    the area assigned to him rent-free be exactly noted, as also that herein generally the provisions
    contained in § 12 of the Edict issued for the province of Silesia on the 1st of March 1804 must be
    duly observed, on the basis of a special and corrected survey.


    2. that none of the present peasant holdings may be allowed to lapse, but that if, upon a fire damage
    or other misfortune, no one is found who will restore such a holding out of his own means, the manorial
    lordship (Dominium) must re-erect the building at its own cost.


    3. that all the dues and charges of the state at present resting upon the said estates, or hereafter
    still to be laid upon them,'

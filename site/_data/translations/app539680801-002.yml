- page: 3
  en: 'shall as before be paid over to our treasuries appointed for the purpose at the prescribed terms,
    and that for their security the necessary entry be made in the mortgage book of the lands and forests
    reserved by the manorial lordship.


    4. that the rights of taking wood belonging to the monastery and provostry of Lond be entered in the
    land and mortgage book upon the totality of the forests reserved from the dismemberment, and be secured
    in that manner; in return for which we approve that if hereafter the forests excepted from the dismemberment
    should be found insufficient for the rights of taking wood belonging to our Treasury in respect of
    the domain office of Ratyń, a compensation for them shall be ascertained by an annual canon and secured.


    In witness whereof we have caused the present consent to be made out under the customary signature
    and the greater seal of our Chamber of War and Domains, and have executed it.


    Thus done and given at Kalisz, the 28th of January 1806.


    L. S.


    Royal South Prussian Chamber of War and Domains.


    Schmiedecke, Korn, Koch, Woyde (—) Nenickel'

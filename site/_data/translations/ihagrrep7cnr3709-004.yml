- page: 1
  en: 'Copy. His Royal Majesty of Prussia, etc., commands the Government, on the return of the files sent
    in with its report of the 18th of last month in the case of Michalina von Prusimska against His Lordship
    the Prince of Hohenlohe-Ingelfingen, to apply all diligence to completing the preparation of this
    case, which has been much delayed by too great indulgence towards the defendant''s authorised agent;
    next, to have proposals for a settlement suited to the case put forward; but if the settlement, for
    which the case nevertheless appears to be very well suited, should not come about, to take dutiful
    care that judgment is hastened, especially in the event that, on mature consideration of all the circumstances,
    the laws should require that judgment be given once more in the first instance. Charlottenburg, 1
    July 1800. Friedrich Willhelm


    To the Government


    at Poznań'

status: draft
segments:
- page: 1
  en: 'The Honourable Nosalski — manifests by way of diligence


    To the office and present records of the Konin Municipal Court, appearing in person, the Honourable
    Marcin Nosalski, son of the Treasurer of Czernihów, hereditary owner and possessor of the estates
    of Rzgów with appurtenances — looking to the indemnity of his estate, lest any prejudice be brought
    against him in any way by means of testimony to be given by the labouring men Bartłomiej Szepczyński
    and Mateusz Wąchnicki in the cause promoted in the land court proceedings of the Kalisz Palatinate
    at Konin against the Most Honourable Prusimski, Starost of Niszczewice — lodges against the present
    records, by way of diligence, the following complaint and protests in the following manner:


    That the aforesaid labouring men Bartłomiej Szepczyński and Mateusz Wąchnicki, executing the orders
    of the Honourable Tomasz Joachimowicz, dared and presumed [to act] against the people of his'
- page: 2
  en: 'estate —


    obstructing [them] on the public road as they were carting trees on sledges from the hereditary woodland
    of the Honourable Chełmski; striking and beating those same [people]; bringing them to the estates
    of Trąbczyn together with the sledges; confiscating their axes by force; charging them with the felling
    of trees in the Trąbczyn manor forest; and drawing them into complicity in the deed thus constructed
    — and having committed all these acts of violence, they did not blush to draw the penalties wholly
    upon themselves.


    Wherefore the manifestant, manifesting most solemnly against those same perpetrators of violence,
    offers to establish the aforesaid acts of violence committed by them in person through a full sworn
    inquiry, to have them shut out from giving testimony in this cause, and to prove their complicity
    in the offence in separate points; with all things preserved that ought to be preserved.


    Martinus Nosalski'

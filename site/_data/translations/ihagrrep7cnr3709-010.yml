segments:
- page: 1
  en: 'To the Superior Appeal Senate of the Kammergericht.


    Friedrich Wilhelm, King, etc.


    Our, etc. A lawsuit is pending before the Poznań Government between the minor Michaelina von Prusimska
    and the Prince of Hohenlohe-Ingelfingen, directed to the recovery of the Brzyce estates. Since the
    suit of the minor''s guardian was brought at the instance of the Poznań guardianship board, and the
    lawsuit itself has been conducted, and will continue to be conducted, under its direction, but most
    of the councillors of the Poznań Government are members of this board, We have resolved that the said
    case shall be decided in the first instance by the full bench of the Government at Warsaw, and in
    the second instance by you; which We hereby make known to you for your information and observance,
    together with the fact that the necessary orders have accordingly been sent to the Governments at
    Poznań and Warsaw.


    And are, etc. Berlin, 7 December 1800. By command


    G[oldbeck]


    acc. the 3rd.


    ad red. the 8th.'

  en: '37


    Most Serene Prince


    Most gracious Prince and Lord, I have just this moment received Your Serene Highness''s gracious letter
    of the 23rd of April, and reply thereto most obediently that I shall not hand over the present and
    the earlier enclosures to Mr Koppe, who has just returned from Paris, because it is always stated
    therein that Justus Eysenhardt is to draw a part of the moneys from the order to pay — This I cannot
    permit, for I should have at once to repay to the bank whatever is drawn upon it, since the bill of
    exchange which was given along with it has already been expired these 7/4 years — I should be going
    out of the rain and under the eaves — I must have this order to pay back, so as to be able to return
    it to the bank without a single Groschen having been drawn upon it.


    The order to pay lies with Privy Councillor Amelang; Your Serene Highness need only write to him that
    he retrocede one and the same at once, and that you would satisfy Eysenhardt by other means.


    Should this not happen, I must have it annulled in all the public papers with a [uncertain: breit]
    suited to the matter. I am here as good as under arrest, and cannot depart without the complete removal
    of this affair, and likewise on account of the Invalids'' interest, notwithstanding that my orders
    direct me elsewhere — May Your Serene Highness therefore be pleased to write to Mr Amelang with all
    possible speed, that he give me back the whole order to pay immediately, and provide, counsel, that
    for the payment of the Invalids'' interest only 2,000 Rthl be ordered to be paid to me here, — for
    the 2,000 r. I shall obtain against the Hecker security ordered in papers; if you order 2,000 Rthl
    for that purpose, then I shall provide counsel for the rest'

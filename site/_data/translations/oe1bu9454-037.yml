- page: 2
  en: 'and Laar must have the 5000 Rthl Courant, otherwise Major von Zastrow is in embarrassment, I am
    under arrest anew, and Your Serene Highness truly has no honour from it. Moneys I can have enough
    of in Holland, but not a single farthing upon estates in Poland - Consequently I advise Your Serene
    Highness most obediently by all means to see to it there alone, and to have the moneys negotiated.
    With unbounded reverence I am Your Serene Highness''s


    Beneten 30 Stadt


    [uncertain: Schenck]


    Berlin, the 2nd of May 1808. My recovery goes very much at a snail''s pace. The constant vexation
    prevents my restoration. Humble and obedient servant v. Triebenfeld'

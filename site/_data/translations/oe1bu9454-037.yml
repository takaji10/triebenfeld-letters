- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, I have just this moment received Your Serene Highness''s gracious letter
    of the 23rd of April, and reply thereto most obediently that I shall not hand over the present and
    the earlier enclosures to Mr. p. Koppen, who has just now returned from Paris, because it is always
    therein a question of Justus Eysenhardt drawing a part of the moneys from the assignation - This I
    cannot allow, for I should at once have to repay to the bank whatever is drawn upon it, since the
    bill of exchange which was given therewith has already been overdue these 7/4 years - I should be
    coming out of the rain into the downpour - I must have this assignation back, so as to be able to
    return it to the bank without a single Groschen being drawn upon it.


    The assignation lies with the privy councillor Amelang; Your Serene Highness need only write to him
    that he is to retrocede the same at once, and that You would satisfy Eysenhardt otherwise.


    Should this not happen, then I must have it annulled in all the public papers, at a breadth [uncertain:
    breit] befitting the matter. I am here as good as under arrest, and cannot depart without the complete
    removal of this affair, and likewise on account of the Invalids'' interest, notwithstanding that my
    orders direct me elsewhere - May Your Serene Highness therefore deign to write to Mr. Amelang with
    all possible speed that he give me back the whole assignation immediately, and provide, Councillor,
    that for the payment of the Moaliden interest only 2000 Rthl be assigned to me here, — for the 2000
    Rthl I shall obtain for the security deposited in papers for the Heihertsche; if You assign 2000 Rthl
    to that end, then I shall provide for the rest, Councillor'

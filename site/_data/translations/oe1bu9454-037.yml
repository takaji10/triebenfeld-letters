- page: 2
  en: 'and Laar must have the 5,000 t. Courant, otherwise Minister von Zastrow is in embarrassment, I
    am under arrest anew, and Your Serene Highness truly has no honour from it. Moneys I can have enough
    of in Holland, but not a [uncertain: Stürer] upon estates in Poland — Consequently I counsel Your
    Serene Highness most obediently to take care there alone to have the moneys negotiated. With boundless
    veneration I am Your Serene Highness''s. With my recovery it goes very much at a snail''s pace. The
    constant vexation hinders my restoration. Berlin, the 2nd of May


    1808


    Humble and obedient servant


    v Triebenfeld'

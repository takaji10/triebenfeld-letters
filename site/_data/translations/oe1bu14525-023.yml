    The estate of Szetlewek is therefore worth 34803 15


    4. From this, however, there must for the time being be deducted, on account of the missing inventory
    which belongs to the lessee:


    1. In livestock inventory


    a. 30 cows at 10 Rthl. = 300 Rthl


    b. 30 head of young cattle at 6 Rthl. = 180 Rthl


    c. 500 head of sheep at 1 1/3 rc. = 666 Rthl 16 Groschen


    d. for swine and poultry 25 Rthl = 1171 Rthl 16 Groschen


    2. for propination implements = 1500 Rthl


    3. 40 hives of bees at 4 rc. = 160 Rthl


    4. for implements = 800 Rthl 3631.


    16


    The present value of the estate of Szetlewek is therefore 31171 Rthl 23 Groschen 4 Pfennig, write:
    thirty-one thousand one hundred and seventy-one Reichsthaler 23 Groschen 4 Pfennig, or = 187,031 gulden
    25 Groschen. Polish. Kalisz, the 28th of January 1803. Tittel. Ottow.'

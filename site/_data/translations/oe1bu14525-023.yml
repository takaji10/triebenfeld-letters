- page: 2
  en: The estate of Szetlewek, situate in the Province of South Prussia in the Department of the Royal
    Government at Kalisz, in its Konin district and the parish of Rzgow, lies 1 1/4 miles from Zagórów,
    3 miles from Konin, 2 miles from Pyzdry, 2 miles from Slupce, 5 miles from Kalisz, and 1 mile from
    the river Wartha. It borders towards the east upon Podbiele and Grabienice, has a corner[illegible]boundary
    with Grabienice, Swiątniki and Kurow; towards the south upon Kurow and Biskupice; towards the west
    upon Łukom; and towards the north upon Trąbczyn. At present there are no boundary suits; however,
    when in the year 1799 a judicial re-delivery of possession was undertaken, several witnesses pointed
    out patches of arable which had successively been torn away by the neighbours, which the manorial
    lordship (Dominium) intends to vindicate, but which have not here been brought further into the account.
    In the year 1798 this estate was surveyed by the surveyor Sprengel

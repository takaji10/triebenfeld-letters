- page: 3
  en: 'and the surface content thereof ascertained at 1724 M. 2 R. For the purposes of this valuation
    the parcels have been graded for quality, with the assistance of the surveyor Chwalowski and two sworn
    [uncertain: Bautners], and according to the grading register they comprise


    I. the manorial parcels


    1. In arable: a. of the 1st [uncertain: Ex.] soil, whose constituent parts consist in loam and good
    earth, where in the 1st crop-course wheat, in the 2nd crop-course barley, in the 3rd crop-course rye
    and in the 4th crop-course oats may be sown: 239 M 39 R


    b. of the 2nd class: soil which has less loam, good earth, and few sandy parts, where in the 1st and
    3rd crop-course rye, in the 2nd crop-course barley and in the 4th crop-course oats may be sown: 277
    M 140 R


    c. of the 3rd class: soil which consists of earth and sand, where in the 1st and 3rd crop-course rye
    and in the 2nd and 4th crop-course oats can be sown: 40 M 78 R = 557 M 77 R'

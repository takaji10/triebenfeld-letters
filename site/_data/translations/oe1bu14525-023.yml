- page: 6
  en: 'lordship and the subjects, separated; the pasture, however, is held in common. With pasture and
    timber rights, or with other servitudes, this estate is not burdened. At present Szetlewek is leased
    to Ignatz von Radzinski from the year 1799 to 1805 for an annual rent of 7800 gulden.


    This rent is paid


    a. two thirds at Midsummer, in advance, f. 5200 gulden at 5 per cent = 260 gulden.


    b. one third at Christmas, in advance, f. 2600 gulden at 5 per cent = 65 gulden = 325


    Besides this, 50,000 gulden. Polish stand free of interest, f. a. 5 per cent = 2500 (as lease security)


    Further the lessee pays in addition for the mill = 240. Altogether, therefore, the actual rent amounts
    to = 10,865 gulden, or 1810 Rthl 20 Groschen.


    Upon the ground of the intelligence gathered on the spot, the value of this estate has been established,
    according to the principles contained in the Instruction issued for the valuation of the South Prussian
    domain estates of the 1st of September 1797, in the following manner.'

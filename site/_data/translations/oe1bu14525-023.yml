- page: 5
  en: '1. the manorial demesne farm


    2. 3 Kmieci (full Hufe holders)


    3. 5 Chalupnici, half-Hufe holders


    4. 9 Komornice (cottage lodgers)


    5. 1 tavern


    6. 1 smithy


    7. 1 shepherd


    8. 1 herdsman


    9. 1 settler


    10. 1 water grist-mill. The holdings, the farm buildings, the livestock of their own, the number of
    souls, and the dues and services of the subjects appear from the table taken up in the year 1799 and
    annexed to this instrument of valuation. The holdings belong to the manorial lordship and are left
    to the residents merely for cultivation. The lordship must build the subjects their houses; they,
    on the other hand, keep them in repair, just as they also build their barns and stables out of their
    own means, though they receive timber for the purpose from the lordship free of charge. They have
    also received firewood from the adjoining wood of the estate of Trąbczyn, since the latter estate
    and Szetlewek have all along had one and the same hereditary lord, although these estates have different
    folios in the mortgage book. The fields are, between the'

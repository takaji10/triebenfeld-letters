status: draft
segments:
- page: 1
  en: 'We Friedrich Wilhelm, by the Grace of God King of Prussia etc., do hereby make known and give to
    be understood that of the noble estate of Szetlewek in the Konin district a judicial valuation has
    been taken up, which reads as follows:


    Instrumentum taxationis of the estate of Szetlewek, belonging to the reigning Prince of Hohenlohe-Ingelfingen,
    Friederich Ludewig, Serene Highness, situate in the Province of South Prussia, in the Department of
    the Royal Government at Kalisz, in its Konin district and the parish of Rzgow.


    Is, in the rectified capital value, in the sum of 31,171 Rthl. 23 Groschen 4 Pfennig, or 187,031 gulden
    25 Groschen. Polish, correct in the calculation.


    Cretius, Calculator to the Government.'

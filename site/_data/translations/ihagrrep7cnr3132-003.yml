segments:
- page: 1
  en: 'An d 29 Apr. 1803


    To His [sub?] lit. Lord von Goldbeck, Excellency


    An v Prusimski & Jezierski


    In full agreement with Your Excellency''s enlightened opinion on Prusimski and Jezierski, I have signed
    the report Your Excellency kindly communicated to me, and had the fair copy made; and I have the honour
    to send you most obediently the fair copy, for your kind countersignature and dispatch, together with
    the draft. At the one place where it says that the confiscation of property must remain unalterable,
    I have believed, since this point belongs solely to your department, that I had to add that I


    d. 3rd May. ins: cum 2 vol: Actor: pLch:'
- page: 2
  en: 'refrain from expressing an opinion, since this matter lies outside my sphere of business.


    The files kindly communicated to me I return herewith with thanks.


    Berlin, 29 Apr. 1803.


    Haug[witz]'

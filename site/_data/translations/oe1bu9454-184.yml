- page: 2
  en: 'while others feast on the fat of the Hohenlohe land. But if fortune is not altogether unkind to
    me, I shall extricate myself by my own strength, since all faithful and disinterested services seem
    to have been forgotten. I have too boundless a confidence in you to be able to believe that Your Right
    Honourable would make any use whatever of this outburst of my heart; but I had to let you feel something
    of how I am being dealt with. The most faithful veneration remains dedicated to you for ever.


    Ingelfingen, 15th May 1806. A: Hahn'

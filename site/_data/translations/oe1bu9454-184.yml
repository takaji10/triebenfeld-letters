status: draft
segments:
- page: 1
  en: In the haste, the enclosed blank forms were lately forgotten upon the departure of the express courier;
    Your Right Honourable will graciously pardon this oversight. I commend myself to your good graces,
    and wish that you may live more contentedly than I; for in a short time I have had all manner of sad
    experiences in the service of great lords. We old Ingelfingen servants are forgotten for the sake
    of the newer ones, and these latter, be they ever so undeserving, are nevertheless made fortunate.
    Me, an honest devil, they mean to let dangle to death on the lean hook,
- page: 2
  en: 'while others feast on the fat of the Hohenlohe lands. But if fortune is not wholly [uncertain:
    unfavourable] to me, I shall extricate myself by my own strength, since all faithful and disinterested
    services seem to have been forgotten. I have too boundless a confidence in you to be able to believe
    that Your Right Honourable would make any use whatever of this outpouring of my heart; but something
    of it I had nonetheless to let you feel, of how I am being dealt with. The most faithful reverence
    remains dedicated to you for ever. Ingelfingen, the 15th of May 1806. A: Hahn'

status: draft
segments:
- page: 1
  en: In the haste, the enclosed blank forms were lately forgotten at the departure of the express courier;
    Your Right Honourable will graciously pardon this oversight. I commend myself to your favour, and
    wish that you may live more contentedly than I; for in a short time I have had all manner of sad experiences
    in the service of my masters. We old Ingelfingen servants are forgotten in favour of the newer ones,
    who — however devoid of merit they may be — are nevertheless made fortunate. Me, honest devil that
    I am, they mean to let dangle to death on the lean hook,
  names:
  - de: Ingelfingen
    en: Ingelfingen
    kind: place
- page: 2
  en: 'while others feast on the [uncertain: Jette] of the Hohenlohe lands. But if fortune is not wholly
    ill-disposed towards me, I shall extricate myself by my own strength, since all my faithful and disinterested
    services seem to have been forgotten. I have too boundless a confidence in you to be able to believe
    that Your Right Honourable would make any use whatever of this outpouring of my heart; but I had to
    let you feel something of how I am being dealt with. The most faithful veneration remains devoted
    to you for ever. Ingelfingen, the 15th of May 1806. A: Hahn'
  names:
  - de: Hohenlohischen Landes
    en: Hohenlohe lands
    kind: place

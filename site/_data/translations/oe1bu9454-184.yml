- page: 1
  en: 184 In the haste, the enclosed blanquets were lately forgotten when the express courier was dispatched;
    Your Right Honourable will graciously pardon this oversight. I commend myself to your favour, and
    wish that you may live more contentedly than I; for in a short time I have had all manner of sad experiences
    in the service of lords. We old Ingelfingen servants are forgotten in favour of the newer ones, who,
    however devoid of merit they may be, are nonetheless made happy. Me, an honest devil, they mean to
    leave dangling to death on the meagre hook,
  names:

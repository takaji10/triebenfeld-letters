segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord, Your Most Serene Highness has had the grace to assure me only that everything
    with Asch and Gad concerning the 11000 Rthl has been settled, and that I should have no vexation from
    it.


    Your Most Serene Highness, then, I [do] most humbly for this gracious assurance.


    Meanwhile I observe only that the arrest in this matter still lies against me here, and that people
    here have given out the [uncertain: places] to the effect that, should Your Most Serene Highness not
    pay the promised 4000 Rthl, I am to be arrested at once.


    For fear I do not know what I am to do. In wretchedness I still drag on – Prince George declares himself
    on nothing and drags my affair out along the long road. I here still risk honour, liberty, and the
    losing of my life.


    Your Most Serene Highness, grant but this one grace and direct the matter there, so that'

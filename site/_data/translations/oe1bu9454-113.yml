- page: 2
  en: 'that Gad[uncertain] does not lay hold of me for having me arrested here. I would rather have had
    death on the spot. Wildeganst sends me word that Asch and Gad would wait until Midsummer — but that
    would be no deliverance for me — I beg Your Serene Highness, by all that is holy, do let the matter
    be brought to a clear settlement by means of the 4000 rthl. If only God helps and I have creditors
    again, then I will gladly give fortune and salvation. In deepest esteem I remain, until death, Your
    Most Serene Highness''s. Berlin, the 23rd of May


    1801


    faithful most humble and obedient servant.


    v Triebenfeld'

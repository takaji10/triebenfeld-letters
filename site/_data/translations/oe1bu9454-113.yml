- page: 2
  en: 'that the [uncertain: building] does not lay hold of me and have me arrested here. I should have
    had death on the spot. Wildegensch sends word to me that Asch and the money would wait until John''s
    day – but that would be no rescue for me. – I beg Your Serene Highness, by all that is holy, do let
    the matter be brought clear by means of the 4000 Rthl. If only God helps, and if I have creditors
    again, then I will gladly give fortune and salvation. In deepest reverence I remain, until death,
    Your Most Serene Highness''s. Berlin, the 23rd of May


    1801


    faithful, most humble and obedient servant.


    v Triebenfeld'

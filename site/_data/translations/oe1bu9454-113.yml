- page: 1
  en: '113


    Most Serene Prince,


    Most gracious Lord!


    Your Most Serene Highness has had the grace to assure only, that with Asch and Gad, in respect of
    the 11000 rt, all is settled, and that I should have no vexation from it.


    For this gracious assurance I most humbly thank Your Most Serene Highness.


    Meanwhile I observe only that the arrest in this matter stands here against me, and that they have
    here given out the places, that if Your Most Serene Highness should not pay the promised 4000 rt,
    I am to be arrested at once.


    For fear I do not know what I am to do. Wretchedly I still [illegible] — Prince George declares himself
    upon nothing and drags my affair along the long road. I risk here still losing honour, liberty for
    life.


    Grant Your Most Serene Highness but this single grace and direct the matter there, so that one'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Should Your Serene Highness be pleased to approve the plan I have sent in, I most obediently beg to
    be instructed thereupon with all possible speed, the more so as a certain [uncertain: Midirinal] Councillor
    from Kalisz is already in negotiation with the old Count Wartensleben – The advantage is evident,
    if in particular Weigel and Stössel could thereby be entirely satisfied. As soon as I know Your Serene
    Highness''s decision, I shall, if you should most highly enter into the plan, go to Münse, and shall
    likewise at once make arrangements to exchange my Blizanow for that of the elder son of Count von
    Wartensleben, and then give you every assistance, so that you may satisfy your creditors for the greatest
    part and thereafter set yourself in the quiet possession of the entailed estates.


    I should thank God in heaven if one could be rid of the estates here in so honourable a fashion -
    The dues increase with every day and the distress grows greater; in the end murder and insurrection
    will arise, and everything either is lost or will be lost at the last - Hasten therefore, most gracious
    Lord, to let me know your decision soon; gladly will I work to bring the matter to the most desired
    end.


    The [uncertain: brint] from the Embassy has died away - Most of all the enquiry had been noticed with
    the mortgage conservator, President Dierschlag - whether I had perhaps had monies registered and had
    bought estates for myself therewith. My hitherto philosophy of life has this time served me very well:
    everything must be put out of tune, and because I was willing to listen to your prattle, one [uncertain:
    schiedig] and let that justice be done me which is my due — I beg once more for an early answer, and
    in deepest reverence I remain, until death, Your Serene Highness''s


    Blizanow, the 30th of September 1811


    most faithfully obedient servant


    v. Triebenfeld'

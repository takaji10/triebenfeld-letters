- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Should Your Serene Highness approve the plan
    I have submitted, I beg most obediently to be informed thereof with the utmost speed, the more so
    as a certain Medizinal Rath from Kalisz is already in negotiation with the old Count Wartensleben.
    — The advantage is evident, if by this means Weigel and Stössel in particular could be entirely satisfied.
    As soon as I know Your Serene Highness''s decision, I shall, if you enter into the plan, go to Münse,
    and shall likewise at once make arrangements to exchange my Blizanow to the elder son of Count v Wartensleben,
    and then give you every assistance, so that you may satisfy your creditors for the greatest part and
    thereafter place yourself in quiet possession of the entailed estates. I should thank God in Heaven
    if one could be rid of the estates here in so honourable a manner. — The dues increase with every
    day and the distress grows greater; in the end murder and revolt will arise, and everything is, or
    in the last will be, lost. — Hasten therefore, most gracious Lord, to let me know your decision soon;
    gladly will I work to the end that the matter be brought to the most desired goal. The [uncertain:
    brint] from the Embassy has died away. — Most of all the enquiry had drawn notice with the Conservator
    of Mortgages, President Dierschlag — whether I had perhaps had monies registered and bought estates
    for myself therewith. My hitherto [uncertain: your] philosophy of life has this time served me very
    well: everything must put out of tune, and because I wished to listen to Thy prattle, one [uncertain:
    schiedig] and let that justice be done me which is my due — I beg once more for a speedy answer and
    I remain, until death, reverently Your Serene Highness''s Blizanow, the 30th 7br 1811, faithful and
    most obedient servant v Triebenfeld'

- page: 1
  en: '219


    Most Serene Prince,


    Most gracious Prince and Lord!


    Should Your Serene Highness be pleased to approve the plan sent in, I most obediently beg to be instructed
    thereupon with the utmost speed, the more so as a certain medical councillor from Kalisz already stands
    in negotiation with the old Count Wartensleben — The advantage is evident, if in particular Weigel
    and Stössel could thereby be wholly satisfied. As soon as I know Your Serene Highness''s resolution,
    I shall, if you enter into the plan, go to Nysa, and shall at once likewise take measures to exchange
    my Blizanow for that of the elder son of Count von Wartensleben, and shall then give them every assistance,
    so that they may satisfy their creditors for the greatest part and thereafter set themselves in quiet
    possession of the entailed estates.


    I should thank God in Heaven if the estates here could be got rid of in so honourable a fashion —
    The dues increase with every day and the distress grows greater; in the end murder and riot will arise,
    and all is lost or goes at last to ruin — Hasten therefore, most gracious Lord, to let me know your
    resolution soon; gladly will I work to bring the matter to the most desired goal.


    The [uncertain: brint] from the embassy has died away — The inquiry had drawn most notice with the
    mortgage conservator, President Dierschlag — whether I had perhaps had moneys entered [in the mortgage
    book] and bought estates for myself therewith. My [text lost: "Mein bis ihrem"] philosophy of life
    has this time served me very well; all must be put out of tune, and because I would listen to Your
    [uncertain: Dein] chatter, thus one [uncertain: schiedig] and let that justice be done me which is
    my due — I beg once more for an early answer and, in deepest reverence, I remain, until death, Your
    Serene Highness''s


    Blizanow, the 30th September


    1811


    faithful and most obedient servant


    v Triebenfeld'

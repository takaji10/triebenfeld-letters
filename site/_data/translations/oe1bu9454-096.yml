  en: '96


    Most Serene Prince


    Most gracious Lord!


    The truly venerable Colonel von Köckritz has repeatedly charged me to convey to Your Most Serene Highness
    his most obedient respects, and likewise to give the assurance that the exchange is now to be regarded
    as as good as approved and concluded. Also that the Monarch truly holds Your Serene Highness in very
    high esteem, and that He is your most faithful admirer; and further, that the matter would already
    have been brought to a close here had the indisposition of our good King not placed an obstacle in
    the way, on which account there is at present no audience for reports.


    That I report this news to Your Most Serene Highness with the most thankfully joyful of hearts, I
    need surely not first protest at length to Your Highness. May the Giver of all good things now grant
    you, most exalted great friend of mankind, the most lasting health, that Your Highness may long enjoy
    this good fortune, and above all that this may be the first spring of blessing'

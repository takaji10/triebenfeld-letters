- page: 2
  en: 'from which Your Serene Highness may [uncertain: draw] so much good [uncertain: spring] which washes
    away every affliction and suffering into total oblivion; and then, if Providence grants this my truly
    honest wish, then, most gracious Lord, preserve me in your grace and goodwill, which I shall always
    strive with the most ardent zeal to deserve.


    Concerning the journey to Öhringen I have also spoken with the Colonel this morning. — The Colonel
    wishes that Your Most Serene Highness would write to His Majesty with the greatest haste and petition
    for the leave of absence.


    My counsel therefore is that Your Highness, immediately upon receipt of this, write to the King and
    transmit the letter to me by express courier; I shall attend to this and then hasten it back, so that
    Your Serene Highness may then take your route here by way of Berlin and be able at once to thank the
    King besides. This is, beyond myself, the counsel of the worthy Colonel von Köckritz, and particularly
    that Your Serene Highness should not take your tour by way of Bohemia but over Berlin.


    I reckon now that my letter will be in Your Serene Highness''s hands early on Friday. May Your Highness
    deign within the hour to write to the King for the leave of absence, and send me the letter by express
    courier; I shall receive it on Sunday towards midday, give it the same day to the Colonel, on Monday
    I receive the answer, and with this I arrive in Wrocław on Wednesday.'

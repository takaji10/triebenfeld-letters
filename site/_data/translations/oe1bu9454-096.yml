- page: 3
  en: 'With regard to the secularisation business I shall then lay before Your Serene Highness my unpresumptuous
    opinions. At present there is nothing to be done in the matter here, and I am of opinion that here
    too [this] may be the place for pressing forward this business. — German. The Prince of Hesse-Darmstadt,
    Serene Highness, commends himself to your favour. At bottom Your Serene Highness has only three true
    friends here: these are the King, Colonel von Köckritz, and the Prince of H. Dams[?]; all the others
    think much as the man of Breslau does. But among all the knaves, Wedel in Breslau still remains the
    greatest, for this wretched fellow has, with respect to the Krotoszyn affair, delivered a report or
    opinion such as can only have been hatched in the brain of an arch-liar and villain. Upon this opinion
    the other gentleman, who would have it that he has done so much, has then likewise given his opinion
    in writing to the effect that Prot. could readily bear 50000 Rthl — and these infamies alone have
    cost me so frightfully much trouble to overcome. The honest Cabinet Councillor Beyhm let me read the
    papers in the Cabinet myself.


    retain, and [they have] all the brains of Your Serene Highness, and believe everyone out of policy
    whatever he finds it good to lie.


    in deepest respect I remain, until death,


    Your Most Serene Highness''s


    Should the application for leave perhaps


    be written by G, so that it


    remains in my hand?


    Berlin, 1st January 1799


    most humble and faithful servant v Triebenfeld'

- page: 2
  en: 'from which Your Serene Highness may draw so many good pure springs as wash away every affliction
    and suffering into complete oblivion; and then, when Providence grants this my truly sincere wish,
    then, most gracious Lord, preserve for me your favour and goodwill, which I shall always strive with
    the most ardent zeal to deserve.


    Concerning the journey to Öhringen I have likewise spoken this morning with the Colonel. The Colonel
    wishes that Your Most Serene Highness might write with the utmost haste to His Majesty and apply for
    the leave of absence.


    My counsel, then, is that Your Highness should write to the King immediately upon receipt of this,
    and convey the letter to me by express courier; I shall attend to it and hasten it back again, so
    that Your Serene Highness may then take your road here by way of Berlin and at once render thanks
    to the King as well. This is, apart from myself, the counsel of the worthy Colonel von Köckritz, and
    especially that Your Serene Highness should not take your tour, say, through Bohemia, but by way of
    Berlin.


    I reckon now that my letter will be in Your Serene Highness''s hands on Friday morning. May Your Highness
    deign in that very hour to write to the King for the leave of absence, and send me the letter by express
    courier; I shall receive it on Sunday towards noon, give it the same day to the Colonel, on Monday
    I receive the answer, and with it I shall arrive in Breslau on Wednesday.'

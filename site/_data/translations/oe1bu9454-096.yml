- page: 3
  en: 'With regard to the secularisation business I shall then lay before Your Serene Highness my opinions,
    submitted without prejudice. At present there is nothing to be done here in that respect, and I think
    that here too [uncertain: it can hardly be] the place for pressing this business forward. — His Serene
    Highness the Prince of Hesse-Darmstadt commends himself to your favour. At bottom Your Serene Highness
    has only three true friends here, and these are the King, Colonel von Köckritz and the Prince of Hesse-Darms[tadt];
    all the others think very nearly like the man in Wrocław. But among all the rogues Wedel in Wrocław
    still remains the greatest, for this wretched man has given, concerning the Krotoszyn affair, a report
    or opinion such as can only have been hatched in the brain of an arch-liar and villain. — Upon this
    opinion the other gentleman, who will have it that he has done so much, then likewise delivered his
    opinion in writing, namely that Krot[oszyn] could readily bear 50/m Rthl — and it is precisely these
    infamies alone that have cost me so frightfully much trouble to overcome. The honest Cab[inet] Councillor
    Beyme let me read the papers in the Cab[inet] itself.


    retain, and to Your Serene Highness all brain, and believe every man out of policy what he finds it
    good to lie.


    In deepest respect I remain, until death,


    Your Most Serene Highness''s


    Should the petition for leave perhaps


    be written by G, so that it


    remains my hand?


    Berlin, 1 January 1799


    most humble and faithful servant


    v Triebenfeld'

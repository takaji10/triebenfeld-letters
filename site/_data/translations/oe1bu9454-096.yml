status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord! The truly venerable Colonel v Köckritz has repeatedly charged
    me to convey to Your Most Serene Highness his most obedient respects, and likewise to assure you of
    this, that the exchange is now to be regarded as as good as approved and concluded. Also that the
    Monarch truly esteems Your Serene Highness very highly, and that He is your most faithful admirer,
    and likewise that the matter would already have been concluded here, had the indisposition of our
    good King not laid an obstacle in the way, on which account there is at present no audience-report.
    That I report this news to Your Most Serene Highness with the most thankfully joyful heart, I need
    surely not first protest at length to the same. May the Giver of all good things now grant You, most
    exalted great friend of mankind, the most lasting health, that Your Highness may long enjoy this good
    fortune, and especially that this may be the first source of blessing
- page: 2
  en: from which Your Serene Highness may draw so much good spring-water, pure, which washes away every
    affliction and suffering to the point of complete forgetfulness; and then, when Providence grants
    this truly sincere wish of mine, then, most gracious Lord, preserve for me your favour and goodwill,
    which I shall strive with the most glowing zeal always to deserve. Concerning the journey to Öhringen
    I have also spoken this morning with the Colonel — The Colonel wishes that Your Most Serene Highness
    might write with the utmost haste to His Majesty and apply for the leave. My counsel therefore is
    that the same, immediately upon receipt of this, write to the King and transmit the letter to me by
    express courier; I shall see to it and then hasten it back, so that Your Serene Highness may then
    take your route here by way of Berlin, and be able at once to thank the King besides. This is, apart
    from myself, the counsel of the worthy Colonel von Köckritz, and especially that Your Serene Highness
    should not take your tour perhaps through Bohemia, but by way of Berlin. I reckon now that my letter
    will be in Your Serene Highness's hands on Friday morning. May the same deign in that same hour to
    write to the King for the leave, and send me the letter by express courier; that I receive on Sunday
    towards midday, give it that same day to the Colonel, on Monday I receive the answer, and with this
    I arrive in Breslau on Wednesday.
- page: 3
  en: 'With regard to the secularisation business I shall then lay before Your Serene Highness my unpresumptuous
    opinions. At present there is nothing to be done here in that matter, and I think that here too, on
    account of the place, it should be pressed forward — [uncertain: Dtsch.] the Prince of Hessen Darmstadt,
    Serene Highness, commends himself to your favour. At bottom Your Serene Highness has only three true
    friends here; these are the King, the Colonel von Köckritz, and the Prince of H[essen] Darmstadt;
    all the others think very nearly as the man from Breslau does. But among all the rogues, Wedel in
    Breslau still always remains the greatest, for this wretched man has, with regard to the Krotoszyn
    affair, given a report or opinion such as could only have been hatched in the brain of an arch-liar
    and villain — Upon this opinion the other gentleman, who will have it that he has done so much, has
    then likewise given his opinion in writing to the effect that Prot. could properly bear 50000 Rthl
    — and these infamies alone have cost me such frightfully much trouble to overcome. The honest Cabinet
    Councillor Beyme let me read the papers in the Cabinet myself. keep, and it, Your Serene Highness,
    all brain, and believe everyone out of policy whatever he finds it good to lie. In deepest reverence
    I remain, until death, Your Most Serene Highness''s — Should the application for leave perhaps be
    written by G, so that it remains in my hand? Berlin, 1st January 1799 most humble and faithful servant
    v Triebenfeld'

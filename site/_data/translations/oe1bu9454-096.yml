segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    The truly venerable Colonel von Köckritz has repeatedly charged me to convey to Your Most Serene Highness
    his most obedient respects, and also to give this assurance, that the exchange is now to be regarded
    as good as approved and concluded. Also that the Monarch holds Your Serene Highness truly in very
    high esteem, and that He is Your most faithful admirer, and likewise that the matter would already
    have been concluded here by Bernhardi, had the indisposition of our good King not placed an obstacle
    in the way, on which account there is at present no audience for presenting it.


    That I report this news to Your Most Serene Highness with the most thankfully joyful heart, I surely
    need not first protest at length to the same. May the Giver of all good things now grant You, most
    exalted great friend of mankind, the most lasting health, that Your Highness may long enjoy this good
    fortune, and especially that this may be the first source of blessing'
  names:

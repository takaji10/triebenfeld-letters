segments:
- page: 1
  en: 'Judicial site inspection of the felled pine tree from the boundary mound — in the matter of the
    Honourable Prusimski


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Bartłomiej
    Szepczyński of the village of Trąbczyn, Royal Court Summoner, General, sound of health, acknowledged
    that he himself — having with him two nobles, namely the Honourables Piotr Gostarski and Tomasz Jachimowicz,
    although absent here [from court] but present at the location of the matter described below — at the
    formal request of the Honourable Antoni of Kolno Prusimski, Starost of Niszczewice, hereditary owner
    of the estates of Trąbczyn and others, on the Saturday next after Septuagesima Sunday, namely 21 February
    of the current year, descended with the above-mentioned nobles to the boundary location of the estates
    of Trąbczyn; and being there in such manner, declared in these words:


    That, being on the boundary of the estates of Trąbczyn, he saw a pine tree — grown over several decades
    on the boundary mound called [uncertain: T]urnata, dividing Trąbczyn from Biskupia — marked with three
    crosses or boundary marks — cut down and taken away in the night-time by His Worship Lord Bogusławski,
    hereditary owner of the part-estates of Kurów —


    he duly saw and observed; of which the present relatio of the same Court Summoner has been made.'

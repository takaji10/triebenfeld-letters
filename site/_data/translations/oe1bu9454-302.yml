- page: 2
  en: 'Eighthly, I have given a power of attorney for the collection of all arrears of purchase-money,
    which are very considerable.


    Ninthly, a power of attorney has been issued to compel the Oleśnica hereditary lessees to pay the
    arrears of entry-money, inclusive of the canon, amounting to 32,000 Rthl., or else, with all their
    following, to be evicted, so that the grounds and buildings may be let out afresh to others. Also,
    tenthly, a power of attorney has been given to Mr Hawich for the prosecution of all boundary suits,
    and the instructions necessary thereto have been imparted to him. Eleventhly, a power of attorney
    has been given to Hawich that he may appear in Your Serene Highness''s name at the Diet at Warsaw
    and in all places, in order to maintain Your Highness''s rights of possession and property in their
    due force, the more so as every landowner is now to appear in person, to reside upon his estates,
    or else to forfeit his possessions. Twelfthly, besides this I have on my own part given Mr Hawich
    a power of attorney, together with the original decrees of the French General Government, in order
    to collect the interest advanced by me to the Invalids'' Fund, together with costs, and to remit the
    same to Your Serene Highness in covering of the Larisch sum.


    Thirteenthly, and lastly, a further power of attorney has been made out to Hawich, also, for the Niedźwiecki
    heirs, to collect the still outstanding hereditary purchase-monies for several years'' canon, which
    amount to over 10,000 Rthl., and to refute the unjust claims formerly framed by the deceased. I have
    had all this taken down judicially by the justice-burgomaster Schenck from Neusatz, in order to begin
    this new career right brilliantly; and since, by virtue of the bonds of 250,000 Rthl., I have a right
    before all the creditors to have a word to say, I think this must surely make an impression and bring
    about the desired outcome. In the meantime, however, Your Serene Highness shall, by my arrangement,
    faithfully receive the reports on the progress of the matter from time to time.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    faithful and most obedient servant


    v Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I have had here the justice-burgomaster Hawich from Zagorowo, who is appointed as actual Ducal Warsaw
    notary public, together with the Chief Inspector Hecker, and have transacted with these men everything
    that tends to Your Serene Highness''s advantage, and have issued the judicial special powers of attorney
    for that purpose. I have furthermore, firstly, pressed for the instruction of the Döbske concerning
    the Trąbczyn estates, and have given power of attorney and instruction thereto.


    Secondly, I have given the power of attorney for the entire lifting of the sequestration, and drafted
    the opening step [uncertain: entworsten], the more so since a three-year general indult has been granted
    by the King of Saxony, and since in this matter everything turns upon absolute payment of the interest;
    accordingly I have, thirdly, given Hawich the power of attorney to collect the interest and to pay
    it, against receipt, to those creditors who already have judgments in force in their favour, but to
    deliver the remainder to Your Serene Highness. Also I have, fourthly [uncertain: mertens], given a
    power of attorney to bring suit against the [uncertain: Süden] Oppenheimer et Wolf in Kalisz, and
    at once to press for the deletion of the several sums entered to more than 72000 Rthl, in which matter
    a suit is already pending [uncertain: schiebt] in Berlin; fifthly, I have issued a power of attorney
    that the fraudulent Honrichs, who has had himself installed as sequestrator, be immediately removed
    and compelled to lay accounts ad Acta [uncertain: ad Assam], that Hawich on the other side draw up
    the strictures against him, and press him both for restitution of the same and likewise for payment
    of the sums still outstanding from him. Likewise I have, sixthly, given a power of attorney to collect
    from Niedzwiedzki the remaining [uncertain: Hochta] sums and to apply for execution against him. Seventhly,
    I have issued a power of attorney that all arbitrary transactions and sales of the grounds by Honrichs
    be at once annulled, and that the purchasers, if they will not submit to payment into the treasury,
    be evicted with recourse against Honrichs, because he gave away the grounds in part for nothing, without
    being authorised to do so, and in this manner appropriated to himself a little estate of several Hufe,
    and erected the buildings from the lordship''s timber and brick,'

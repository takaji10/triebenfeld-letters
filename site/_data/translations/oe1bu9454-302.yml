- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I have had here with me the justice-burgomaster Hawich from Zagórów, who has been appointed as actual
    Duca[l?] [illegible] Warsaw notary public, together with the Chief Inspector Hecker, and with these
    men I have transacted everything that tends to Your Serene Highness''s advantage, and have issued
    the judicial special powers of attorney for it. Beyond this I have, firstly, pressed for the instruction
    of the Dąbska concerning the Trąbczyn estates, and have given a power of attorney and instruction
    to that end.


    Secondly, I have given the power of attorney for the complete lifting of the sequestration, and have
    drafted the opening step, the more so since a three-year general indult has been granted by the King
    of Saxony, and since everything here turns upon absolute payment of the interest; so I have, thirdly,
    given Hawich the power of attorney to collect the interest, and to pay it, against receipt, to those
    creditors who already have judgments in force in their favour, but to deliver the remainder to Your
    Serene Highness, b given. Also I have, fourthly, given a power of attorney to bring suit against the
    Jew Oppenheimer et Wolf in Kalisz, and at once to press for the cancellation of the several sums entered,
    amounting to over 72,000 Rthl., in which matter a suit is already pending in Berlin; fifthly, I have
    issued a power of attorney that the fraudulent Honrichs, who had himself installed as sequester, be
    forthwith removed and compelled to lay his accounts ad Assam, that Hawich on the other hand draw up
    the objections against him and compel him to make good the same, as also to pay the sums still outstanding
    from him. Likewise I have, sixthly, given a power of attorney to collect from Niedźwiecki the outstanding
    lease sums and to apply for execution against him. Seventhly, I have issued a power of attorney that
    all high-handed dealings and sales of the grounds by Honrichs be forthwith annulled, and that the
    purchasers, if they will not submit to paying into the treasury, be evicted with recourse against
    Honrichs, because he, without being authorised, gave away part of the grounds for nothing, and in
    this manner appropriated to himself a little estate of several Hufe, and put up the buildings from
    the lordship''s timber and brick,'

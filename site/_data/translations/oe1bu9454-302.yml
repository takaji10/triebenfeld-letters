- page: 2
  en: 'Eighthly, I have given power of attorney for the collection of all arrears of purchase money, which
    are very considerable.


    Ninthly, a power of attorney has been issued to compel the hereditary leaseholders of Olesnica to
    pay the arrears of [uncertain: Linstands] money, inclusive of the canon, amounting to 32000 Rthl,
    or else to be committed together with their following, so that the grounds and buildings may be let
    out to others, and far better. Also, tenthly, a power of attorney has been given to Mr. Hawich for
    the prosecution of all boundary suits, and the instructions necessary thereto have been imparted to
    him. Eleventhly, a power of attorney has been given to Hawich enabling him to appear in Your Serene
    Highness''s name at the Diet at Warsaw and in all places, in order to maintain Your possessory and
    proprietary rights in their due force, the more so since every landed proprietor must now appear in
    person, reside upon his estates, or else forfeit his possessions. Twelfthly, I have besides this given
    Mr. Hawich, on my own part, a power of attorney together with the original decrees of the French General
    Government, in order to collect the interest advanced by me to the Invalids'' Fund, together with
    costs, and to remit the same to Your Serene Highness towards covering the Larisch sum.


    Thirteenthly, and finally, a further power of attorney has been drawn up for Hawich, also to collect
    from the heirs of Niedzwiedzki the still outstanding [uncertain: Tobkansts] moneys for several years''
    canon, which amount to more than 10000 Rthl, and to refute the unjust claims formerly framed by the
    deceased. I have had all this taken down in due form [uncertain: geruht lich] by the justice-burgomaster
    Schenk of Neusatz, so as to begin this new career right brilliantly; and since, by virtue of the bonds
    for 250000 Rthl, I have a right before all creditors to have a word to say, I think this must surely
    make an impression and bring about the desired outcome. In the meantime, however, Your Serene Highness
    shall, by my arrangement, faithfully receive reports from time to time on the progress of the matter.


    In deepest reverence [uncertain: Gefurchtsvoll] I remain, until death,


    Your Most Serene Highness''s


    most faithful and obedient servant


    v Triebenfeld'

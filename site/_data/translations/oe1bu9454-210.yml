- page: 2
  en: 'Meanwhile matters stand very well; Trąbczyn I hope quite certainly to vindicate. Falz is a cold
    man — He is held here to be the cleverest, and the judge listens to his word — He has now received
    300 rt, and I have promised him much more if we prevail — The President of the Tribunal, a certain
    Smagorzewski, is an old acquaintance of mine — He has accepted 100 #.


    Two assessors who are old friends of the referendary Sommer have each received thirty; there are two
    more whom I am working upon in another manner, and the wine already costs me some 160 rt. By Trąbczyn
    a very great deal is to be won — for besides the estates we save at once the 22000 rt of dower money
    registered, and the remaining costs which Dąbska must make good are then indeed twice as high again
    — this is the judges'' own sentiment — She also gives and means to force it through intercession and
    great [uncertain: fehlen] — But God will help me — The 2nd matter is with the Oleśnica lads.


    I must have the fellows out, for they already owe — 16000 rt canon; further, in dues laid out for
    them, 8270 rt; the remainder of the entry money, 10000 rt; to this the interest and costs with at
    least 5000 rt; total 39270 rt. They sat in the enjoyment; everything they drew out of the village
    they gave to the lawyers; the Prefecture has now forbidden that any further rents be given to the
    [illegible], and now they are checkmated — Unfortunately, however, the fellows have nothing'

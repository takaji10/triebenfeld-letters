- page: 3
  en: 'and the money is lost — now it has been managed that several Polish peasants from Oleśnica have
    declared themselves willing to enter into the contract and to pay the 10000 rt of entry money, and
    also to pay the 2000 rt of rent yearly in advance, and perhaps it may succeed that they also undertake
    to settle a part of the dues in arrears — the matter is in hand and, since I have given 30 ducats
    to the lower judge before whom it lies, is being briskly pursued; I also hope to obtain the eviction
    decree here quickly. The 3rd matter is with Niedźwiecki — he owes 6000 rt; he is to pay and to quit,
    but will have nothing more than 2000 cords of alder wood, which already lies at the water, likewise
    60 head of cattle and a few horses, all of which I have had placed under arrest with the utmost haste.
    Hawich is the only scoundrel who stirs everything up, especially all the rent peasants, for they have
    paid nothing yet and will not pay either. Now the Prefecture has granted me military execution, but
    that avails nothing; they thrash the soldiers out, and so I stand bare and forsaken. Hawich must go
    now — then I think it will get better. Besides, I have the liberty to throw all the fellows out, provided
    only that I put other farmers in their place, so that the conscription lists are not [uncertain: Adict].
    Now the Oleśnica Pol[ish] peasants offer to bring up as many [uncertain: Poladen] that all the holdings
    can be occupied and that will gladly pay the rent. This last motive, I think, ought to work. For the
    German oxen have not believed it — the Poles find themselves honoured that'

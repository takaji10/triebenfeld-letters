- page: 4
  en: 'one has shown them the confidence, and will bid everything to come into possession of the holdings.
    The Olesnica men offer to lay down 4 to 5000 Rthl in cash at once. The 5th cause is with the propination-rights
    tenant; the fellow owes 3000 Rthl — he has to pay, but refuses and will have a remission, or else
    give up the lease, because that is free to him under the Code Napoleon. I have another in petto already,
    who pays in advance, and therefore I laid a complaint against the scoundrel the day before yesterday
    and applied for harsh execution, which will follow within a few days. Now the want only stands great,
    for I am to effect too much with empty hands. But if only it first succeeds to vindicate Trąbczyn,
    then the tenant pays at once


    7000 Rthl the old Hollanders upon the contract entered into with them, which they have solemnly assured
    me of. 12000 Rthl


    The Olesnica Poles can


    5000 For Niedzwiedzki''s wood and cattle there may come in. 3000 the propination lease from Nassalski
    3000 the new tenant pays in advance. 3000 From the present Radzinski of Szetlewek 6000.


    From the outstanding rents at most 5000


    Sum 44000 Rthl. This could, if all went happily, come in by New Year. By the next post I can write
    more about this; the referendary Sommer renders me very good service. May Your Serene Highness yet
    deign to write with all haste to the President Count [uncertain: B]anckelmann at Breslau, that he
    grant Sommer a further leave of 4 weeks; for had I not the man, I should have to succumb and return
    with the business unaccomplished — so let Your Serene Highness procure him the leave with the greatest
    haste. In deepest reverence I remain, until death, Lord Serene Highness


    Kalisz, the 13th of November


    1810


    humble and obedient servant


    v. Triebenfeld'

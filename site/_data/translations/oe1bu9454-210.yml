- page: 2
  en: 'Meanwhile matters stand very well. Trąbczyn I hope quite certainly to vindicate. Falz is a cold
    man — he is held here to be the shrewdest, and the judge listens to his word. He has now received
    300 Rthl, and I have promised him a great deal more if we obtain judgment. The President of the Tribunal,
    a certain Smagorzewski, is an old acquaintance of mine — he has accepted 100 [uncertain: rt].


    Two assessors who are old friends of the referendary Sommer have each received thirty; and there are
    still 2 whom I am working upon in another manner, and the wine already costs me some 160 Rthl. By
    Trąbczyn a very great deal is to be gained — for besides the estates we at once rescue the registered
    22000 Rthl marriage portion, and the remaining costs which the Dąbska must make good are then indeed
    twice as high again — this is the sentiment of the judges themselves. She too gives way, and would
    compel it through intercession and great failings — but God will help me. The 2nd cause is with the
    Olesnica lads.


    I must have the fellows out, for they already owe — 16000 Rthl canon, further in dues which have been
    laid out for them


    8270


    The remainder of the entry money


    10000


    To this the interest and costs with at least


    5000 Rthl


    Sum 39270 Rthl. They sat in the enjoyment; all that they drew from the village they gave to the jurists.
    The prefecture has now forbidden that any further interest be given to the H., and now they are checkmated
    — but unluckily the fellows have nothing'

  en: '210


    Most Serene Prince


    Most gracious Prince and Lord, I have this moment received three letters from Your Serene Highness,
    against which You must also have received three from me.


    The business here is of such consequence that it almost robs me of all my senses; I do not know where
    to turn first. The newer courses of business in the local Zürich and other bureaux were as strange
    to me when I came here as optics are to a man born blind — Now I know them and it goes better.


    Here one sets a term in a case, but then the case is not taken up; rather, the Ups, or the so-called
    entry in the registers, must first be made. Then, as it pleases the President, he takes up the register,
    and one must wait from nine in the morning until noon to see whether the matters one has in hand come
    up. So I still stand with the Trąbczyn one — today it is still the 11th case on the register; it may
    now come up at any hour, for many times a lawsuit lasts only half an hour, and often too they go per
    non sunt? and then a new term must again be petitioned for and a new term set, which then always,
    according to the value of the object, costs, as with Trąbczyn, 237 rt. — Now since there are 3 such
    lawsuits pending here, I must guard the nest'

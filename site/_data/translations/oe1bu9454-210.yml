status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! I have this moment received three letters from
    Your Serene Highness, against which Your Highness must likewise have received three from me. The business
    here is of such magnitude that it almost robs me of all my senses; I do not know where to turn first.
    The newer forms of procedure in the local Zürich and other bureaux were as strange to me when I came
    here as optics to a man born blind — now I know them and it goes better. Here one sets a hearing date
    in a matter, but then the matter is not taken up; rather the Ups, or the so-called entry in the registers,
    must first be made. Then, as it pleases the President, he takes up the register, and there one must
    wait from nine in the morning until midday to see whether the matters one has in hand come up. So
    I am still standing with the Trąbczyner matter — today it is still the 11th matter in the register;
    it may now come up at any hour, for many times a proceeding lasts only half an hour, and often too
    they go per non sunt? and then a new date must again be applied for and a new date appointed, which
    then, always according to the object at issue, as with Trąbczyn, costs 237 Rthl. Now since three such
    lawsuits are pending here, I must guard the nest.
- page: 2
  en: 'Meanwhile matters stand very well. Trąbczyn I hope quite certainly to vindicate. Falz is a cold
    man — he is here held to be the cleverest, and the judge attends to his word. He has now received
    300 Rthl, and I have promised him a good deal more if we obtain judgment. The President of the Tribunal,
    a certain Smagorzewski, is an old acquaintance of mine — he has accepted 100 [uncertain: rt]. Two
    assessors who are old friends of the Referendarius Sommer have each received thirty; there are still
    two more, whom I am working upon in another manner, and the wine has already cost me some 160 Rthl.
    Very much is to be won through Trąbczyn — for besides the estates we at once save the 22000 Rthl of
    dower registered thereon, and the remaining costs which the Dąbska must make good are then indeed
    twice as high again — this is even the sentiment of the judges. She too gives out that she will force
    it through intercession and great failings — but God will help me. The 2nd matter is with the Olesnica
    lads. I must have the fellows out, for they already owe: 16000 Rthl canon; further, in dues laid out
    on their behalf, 8270; the remainder of the entry-money, 10000; to this the interest and costs at
    at least 5000 Rthl; Summa 39270 Rthl. They sat in enjoyment of it all; whatever they drew out of the
    village they gave to the jurists. The Prefect has now forbidden that any further interest be paid
    to the H., and now they are checkmated — but unhappily the fellows have nothing'
- page: 3
  en: 'and the money is lost. — Now it has been achieved that several Polish peasants from Olesnica have
    declared themselves willing to enter into the contract and to pay the 10000 Rthl of entry-money, and
    also to pay the 2000 Rthl of interest yearly in advance, and perhaps it will succeed that they also
    undertake to settle a part of the dues in arrear. The matter is in hand and, now that I have given
    the lower judge before whom it lies 30 ducats, is being briskly pressed; I also hope to obtain the
    decree of eviction here quickly. The 3rd matter is with the Niedzewiecki — he owes 6000 Rthl; he is
    to pay and to quit, but will likewise have nothing beyond 2000 Klafter of alder wood, which already
    stands at the water, and likewise 60 head of cattle and several horses, all of which I have had laid
    under arrest with the greatest haste. Hawich is the only rogue who stirs everything up, especially
    all the rent-paying peasants, for they have as yet paid nothing and will not pay either. Now the Prefect
    has granted me military execution, but that helps nothing: they cudgel the soldiers out, and so I
    stand bare and forsaken. Hawich must now be gone — then, I think, things will improve. Besides this
    I have the liberty to throw all the fellows out, provided only that I appoint other husbandmen, so
    that the conscription lists are not Adict. Now the Olesnica Polish peasants offer to bring forward
    as many Poles as will fill all the holdings, and who will gladly pay the rent. This last motive, I
    think, ought to work. For the German oxen have not believed this — the Poles find themselves honoured
    that'
- page: 4
  en: one has shown them this confidence, and they will do their utmost to come into possession of the
    holdings. The Olesnica men offer to lay down 4 to 5000 Rthl in cash forthwith. — The 5th matter is
    with the propination-rights lessee; the fellow owes 3000 Rthl. He is bound to pay, but refuses, and
    wants an abatement, or else to give up the lease, because that is free to him under the Code Napoleon.
    I have another already in petto, who pays in advance, and therefore I brought suit against the scoundrel
    the day before yesterday and applied for harsh execution, which will follow within a few days. At
    present the distress is only so great because I am to effect too much with empty hands. But if only
    it first succeeds to vindicate Trąbczyn, then the lessee pays at once 7000 Rthl; the old Hauländer,
    on the contract into which they have entered with me, as they have solemnly assured me, 12000 Rthl;
    the Olesnica Poles can do 5000; for Niedzewiecki's wood and cattle there may come in 3000; the propination
    lease from Nassalski 3000; the new lessee pays in advance 3000; from the present Radzinski of Szetlewek
    6000; from the outstanding rents at most 5000; Summa 44000 Rthl. This could, if everything went happily,
    come in by New Year. By the next post I can write more fully on this. The Referendarius Sommer renders
    me very good service; may Your Serene Highness deign to write with all haste to the President Count
    Danckelmann at Breslau, that he grant Sommer a further leave of four weeks; for had I not the man,
    I should have to succumb and return with the business unaccomplished — therefore let Your Serene Highness
    procure him the leave with the utmost haste. In deepest reverence I remain, until death, Lord Serene
    Highness, Kalisz, the 13th of November 1810, humble and obedient servant v Triebenfeld

- page: 4
  en: 'one has shown them this confidence, and will do their utmost to come into possession of the holdings.
    The Oleśnica people offer to lay down 4 to 5000 Rt. in cash at once — the 5th matter is with the propination
    tenant — the fellow owes 3000 rt. — he has to pay, but refuses, and wants to have a remission, or
    to give up the lease, because that is open to him under the Code Napoléon.


    I have another already in reserve, who pays in advance, and therefore I sued the rogue the day before
    yesterday and applied for harsh execution, which will follow within a few days. At present the need
    is only so great because I am to effect too much with empty hands. But if only Trąbczyn is first vindicated,
    the tenant will pay 7000 rt at once.


    The old Hollanders, upon the contract they entered into with me, which they have solemnly assured
    me of, 12000 rt. The Oleśnica Pol[es] can do 5000 rt.


    For Niedźwiecki''s wood and cattle there may come in 3000 rt. The propination lease from Nassalski
    3000 rt. The new tenant pays in advance 3000 rt.


    From the present Radzinski of Szetlewek 6000 rt. From the outstanding rents at most 5000 rt. Total
    44000 rt.


    This could come in by New Year if all went happily. By the next post I can, on looking into it, write
    more on this; the referendary Sommer renders me very good services. May Your Serene Highness be pleased
    to write with all haste to the President Count Danckelmann at Wrocław, that he grant Sommer a further
    leave of 4 weeks, for did I not have the man, I should have to go under and return with the business
    unaccomplished — May Your Serene Highness therefore procure him the leave with the utmost haste. In
    deep submission I remain, until death,


    Serene Highness''s


    Kalisz, the 13th of November


    1810


    humble and obedient servant


    v Triebenfeld


    Meierowitz also owes the Schlieben 7800 rt and Your Serene Highness 3000 rt of canon; he will pay
    the first sum at once as the remainder of the purchase money, but as to the 3000 rt he [uncertain:
    renigirt] himself — that gives rise to another lawsuit, and I am always in a fix — but the first money
    I can raise goes to the Invalids'' Fund, and Meierowitz must [uncertain: fehnden] the Schlieben at
    least a few thousand rt so that I get air.'

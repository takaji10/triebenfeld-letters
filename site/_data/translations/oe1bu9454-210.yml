- page: 3
  en: 'and the money is lost — now it has been managed that several Polish peasants from Olesnica have
    declared themselves ready to enter into the contract and to pay the 10000 Rthl entry money, and also
    to pay the 2000 Rthl interest yearly in advance; and perhaps it will succeed that they also undertake
    to settle a part of the arrears of dues. The matter is in hand and, since I have given the lower judge
    before whom it lies 30 ducats, is being pressed briskly; and I hope here soon to obtain the decree
    of eviction. The 3rd cause is with Niedzwiedzki — he owes 6000 Rthl; he is to pay and to quit, but
    will have nothing further either than 2000 fathoms of alder wood, which already stands at the water,
    likewise 60 head of cattle and several horses, all of which I have had placed under arrest with all
    haste. Hawich is the one rogue who stirs up everything, and above all the rent-paying peasants, for
    these have as yet paid nothing and will not pay either. Now the prefecture has granted me military
    execution, but that helps nothing: they thrash the soldiers out, and so I stand bare and forsaken.
    Hawich must now go — then I think it will grow better. Besides this I have the liberty to throw out
    all the fellows, provided only that I install other farmers, so that the conscription lists be not
    [uncertain: Adict]. Now the Olesnica Polish peasants offer to bring up so many Poles that all the
    holdings may be occupied, and who will gladly pay the rent. This last motive, I think, must work.
    For that the German oxen have not believed — the Poles find themselves honoured that'

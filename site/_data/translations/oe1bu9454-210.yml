- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Just this moment I receive three letters from Your Serene Highness, against which you must also most
    highly have received three from me.


    The business here is of such importance that it almost robs me of all my senses; I do not know where
    to turn first. The newer courses of business in the Zürich and other bureaux here were as strange
    to me when I came here as optics to a man born blind — now I know them and it goes better.


    Here one appoints a term-day in a cause, but then the cause is not taken up; rather the Ups, or the
    so-called entry in the registers, must first be made. Then, as it pleases the President, he takes
    up the register, and so one must wait from 9 o''clock in the morning until midday to see whether the
    causes one has in hand come up. So I still stand with the Trąbczyn one — today it is still the 11th
    cause in the register; it may now come up at any hour, for often a suit lasts only half an hour, and
    often too they go per non sunt? and then a new term-day must again be petitioned for and a new term-day
    made, which each time, according to the object, as with Trąbczyn, costs 237 Rthl. Now, since three
    such suits lie here, I must guard the nest.'

- page: 3
  en: 'just now I read a letter of the Privy Councillor Tesmar, who is at present the bosom friend of
    Köckritz — he says: What a hullabaloo you are making — Lahr swears high and dear that he knows nothing
    of it. He knows only too well that you are a well-to-do man — He has indeed satisfied himself of it
    personally on your estates, at a demesne farm, [uncertain: from a] timber sale [illegible] — It must
    be his attorney or some other hostile creature that has misused his name — He is very angry at the
    rebuke he received from the General — [uncertain: See you] to calming him etc.


    I am now convinced to the highest certainty that this was a knavish trick of Flesch and his associates,
    in order to frighten away from Wrocław as well. But I shall learn it for certain, and then woe to
    the knaves — It is only good that Köckritz speaks with Sack, and that I shall thereby gain peace —
    The world sees after all that I still have good friends —'

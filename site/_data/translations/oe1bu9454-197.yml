status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! My judge is this very moment returned from Berlin
    with the glad news that the two General Köckritz have had von d. Lahr roundly ordered to be silent
    and has most humbly declared himself willing to wait that year. He will also speak with the Gl. Etats
    people, so that patience shall be exercised in the matter of the interest payments to the Invalids'
    Fund. Now, since I am once in Poland, I shall set the affairs at Kalisz in the best possible train
    and then return to Breslau. To Goldstuckes and Flesch I am writing this very moment to bring the barter
    transaction as far as possible into its track — For the rest, the want of money is greater here than
    with us, and I can promise nothing — Would to God the transaction came about. I have found here an
    old friend who knows how to paint hell to Strachwitz as the fairest paradise; he shall talk Strachwitz
    into everything — It is the Chief Bailiff Hegener from Ollaboch — He is also to revise everything
    at Zagorowo — He will do this without interest, for he is a noble Prussian and an admirer of Your
    Serene Highness. I would now press forward with the Trąbczyn affair furiore and likewise set the Konojader[?]
    business in train, so that the whole forms one piece and
- page: 2
  en: 'gains a good appearance — Only let Your Serene Highness press the Goldstücher, that he bring the
    barter transaction about. In deepest reverence I remain, until death, Your Serene Highness''s

    Ollaboch, the 31st of May 1810.

    faithful humble and obedient servant

    v Triebenfeld'
- page: 3
  en: 'just now I read a letter of the Privy Councillor Tismar, who is at present the bosom friend of
    Köckritz — he says: What sort of hullabaloo are you making — Lahr swears high and dear that he knows
    nothing of it. He knows only too well that you are a well-to-do man — he has indeed satisfied himself
    of it in person on your estates, at a timber sale transacted on the demesne farm. It must be that
    his attorney, or some other hostile creature, has misused his name — He is very angry at the dressing-down
    received from the General — Do you [uncertain: Auf du ihm] set him at ease, etc. I am now convinced
    to the highest certainty that this was a piece of knavery by Flesch and consorts, in order to frighten
    [me] away from Breslau too. But I shall learn it for certain, and then woe to the knaves — It is only
    good that Köckritz speaks with Sack, and that I thereby gain quiet — The world sees after all that
    I still have good friends —'

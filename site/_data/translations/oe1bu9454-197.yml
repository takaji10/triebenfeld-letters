  en: '197


    Most Serene Prince


    Most gracious Prince and Lord!


    My Richter has just returned from Berlin with the glad news that the two [uncertain: beiden] General
    Köckritz has had van der Lahr sharply called to order, and that Lahr has most humbly declared himself
    willing to wait. He will also speak with the [illegible] Estates officials, so that there shall be
    patience as regards the interest payments to the Invalids'' Fund. Since I am now once in Poland, I
    shall set the affairs in Kalisz in the best train and then return to Wrocław. I am writing this very
    moment to Goldstucker and Flesch to bring the exchange deal into the best possible course — For the
    rest, the shortage of money is greater here than with us, and I can promise nothing — Would to God
    the deal came about. I have found here an old friend who knows how to paint hell to Strachwitz as
    the fairest paradise; he shall prepare everything for Strachwitz — It is the chief district steward
    Hegener of Ollabock — He is also to audit everything in Zagórów — He will do it without self-interest,
    for he is a noble Prussian and an admirer of Your Serene Highness. I would now proceed with furore
    in the Trąbczyn matter, and also set the [uncertain: Konojader] business in train, so that the whole
    forms one piece and'

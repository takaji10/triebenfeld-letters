- page: 3
  en: 'just now I am reading a letter from the privy councillor Tismar, who is now the bosom friend of
    Köckritz - he says: What sort of hullabaloo are you making - Lahr swears high and dear that he knows
    nothing of it. He knows only too well that you are a well-to-do man - He has indeed convinced himself
    of it personally on your estates, in the case of a timber sale [uncertain: transacted] at a demesne
    farm. It must be that his attorney or some other hostile creature has misused his name - He is very
    angry at the dressing-down received from the General - So calm him down, etc.


    I am now convinced to the highest degree of certainty that this was a piece of knavery by Flesch and
    his confederates, in order also to frighten [me] away from Breslau. But I shall find it out for certain,
    and then woe to the rogues- It is only good that Köckritz speaks with Sack, and that I thereby gain
    peace - The world sees after all that I still have good friends -'

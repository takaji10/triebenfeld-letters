- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    My judge has just returned from Berlin with the glad news that the two [of them], General Köckritz,
    has had von d. Lahr referred to rest [uncertain reading] and has most humbly declared himself willing
    to wait that year. He will also speak with the general treasury officials, so that patience shall
    be exercised regarding the interest payments to the Invalids'' Fund. Now, since I am once in Poland,
    I shall set the affairs in Kalisz in the best train and then return to Breslau. To Goldstuckes and
    Flesch I am writing this very moment to bring the exchange transaction into the right track as far
    as possible — For the rest, the want of money is greater here than with us and I can promise nothing
    - Would to God the transaction came about. I have found an old friend here who knows how to paint
    hell to Strachwitz as the fairest paradise; he shall get everything ready for Strachwitz in advance
    — It is the senior district administrator Hegener from Olla bock - He is also to inspect everything
    in Zagorowo - He will do this without self-interest, for he is a noble Prussian and an admirer of
    Your Serene Highness. I would now proceed with the Trąbczyn matter with fury, and also set in train
    the Konojader[?] business, so that the whole forms one piece and'

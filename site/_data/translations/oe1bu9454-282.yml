- page: 1
  en: 'Most gracious Prince and Lord!


    This very moment, and indeed some 2 hours before the post goes out, I receive Your Serene Highness''s
    two letters of the 18th with the enclosure from Eberhardt. I can do nothing further in the matter
    than to lament Your Serene Highness''s fate — you will surely deign, most gracious Prince and Lord,
    to see for yourself that without a compromise with the [uncertain: short] princesses nothing further
    can be said here, the more so as the Prince Chancellor has already been lied to in this, in that it
    was asserted with confidence that the Weiler and 17 wished to come to a settlement — and if the matter
    cannot be done now, while the ladies are in want of money, then, best of Princes, they are thereby
    300000 Rthl the poorer. Councillor von Eberhard is right that his coming here would be most necessary.
    Only we can beg neither a passport for him here, still less money — but if he does come here, then
    everything shall be arranged for him and he shall be placed beyond all responsibility. He needs only
    a passport from Your Serene Highness and from the magistrate there of some border town, and if he
    travelled with his own horses, then the devil may ask after him — the matter must now be settled in
    one way or another, and I neither can nor will take that upon myself alone. — For the rest, it may
    yet come to pass that I, with my friends, shall before long have Court Councillor Cosmar''s swan-song
    and the panegyric of those obliging spirits made public — — if it is possible in the world and I am
    not led astray from other quarters, then by God I keep my word and go on toward the goal so long as
    it takes until I reach it, and if this which I already see in outline is only in some measure attained,
    then assuredly every scoundrel will want to become a [uncertain: knight] in the business and will
    boast of having done Your Serene Highness God knows what favours in the world. But I stake my honour
    upon it that not one of them troubled himself the least about Your Serene Highness, still less ever
    went to bed [uncertain: hungry] or watched through sleepless nights on your account, good Prince.
    Meanwhile I beg that to those [uncertain: I would] not count a Hahn, Paulle, or Lombardini, for these
    may indeed sometimes have had the sun in the house rather than the morrow''s bread — for themselves
    and their children. Do think, noble and exalted Prince, upon these faithful people. I know they suffer
    no tutoring, but hear the counsel of an honest fellow who hates flattery and not, as'

status: draft
segments:
- page: 1
  en: 'Most gracious Prince and Lord! This very moment, and indeed some 2 hours before the departure of
    the post, I receive Your Serene Highness''s two letters of the 18th with the enclosure from Eberhardt.
    I can do nothing further in the matter than to lament Your Serene Highness''s fate — this Your Serene
    Highness will surely deign to perceive yourself, most gracious Prince and Lord, that without a compromise
    with the short princesses nothing more can be said here, all the more since the Prince Chancellor
    has already been lied to in this, that it was asserted with confidence that the Weilers and 17 wished
    to come to terms — and if the affair cannot be settled now, while the ladies are in want of money,
    then, best of Princes, they are thereby [uncertain: reduced] 300000 Rthl the poorer. Herr p. Eberhard
    is right that his coming here would be most necessary. Only we can beg for him here neither a passport
    nor, still less, money — but if he comes here, then everything shall be arranged for him and he shall
    be placed beyond all responsibility. He needs only a passport from Your Serene Highness and from the
    magistrate there of some border town, and if he travelled with his own horses, then the devil would
    ask after him — the affair must now be compromised in one way or another, and I neither can nor will
    take that upon myself alone. — For the rest, it may yet be that I, together with my friends, shall
    before long have Herr Cosmar''s swan-song and the panegyric of the obliging spirits made public —
    — if it is possible in the world, and if I am not misled from other quarters, then before God I keep
    my word, and I go on toward the goal so long as it takes until I reach it; and if this, which I already
    see in the [uncertain: Güste], is even in some measure attained, then assuredly every scoundrel will
    want to become a [uncertain: knight] in the business and will boast of having done Your Serene Highness
    God knows what favours in the world. But I stand with my honour for it that not one of them has troubled
    the wheels about Your Serene Highness, still less ever gone to bed [uncertain: this year] or watched
    through sleepless nights on your account, good Prince. Meanwhile I beg that among those people there
    be not counted a Hahn, Paulle, or Lombardini, for these may well often have had the sun rather than
    the morning''s bread — for themselves and their children in the house. Think, noble and exalted Prince,
    indeed [uncertain: therein] of these faithful men — I know they suffer no tutoring, but hear the counsel
    of an honest fellow who hates flattery and not, as'
- page: 2
  en: 'my old judge would have you believe — enough of this, God will and can help. That Prince August
    has accepted the post of president, which all men of honour have declined, is heart-shattering — for
    now they will hold him here no longer for weak but for — mad. The Congress has forbidden the King
    of Würtemberg everything and referred them to a general constitution. Even every power of attorney
    of all the Estates and persons assembled there has comprehended the protestation within itself. How
    does the man come (when I myself have warned Your Serene Highness against him) to blow now in the
    King''s horn, and to assume the character which everyone else pushed away from himself — what will
    Langenburg, what will Prince Kirchberg and others say of this young man, that he accepts the painted
    charge which everyone else declined from himself with steadfastness and magnanimity — O, that is a
    wise father of his country! The day before yesterday a letter went off to Prince August, and one to
    Berlin, that the 100000 Rthl are to be handed over to him, but absolutely in cash (for perhaps Cosmar
    will want to give paper) — you did indeed will it, and I still doubt that he will withdraw the power
    of attorney. To all else I say nothing further than that I refer to the letters sent off these 4 days
    past. Barbe''s servant Your Serene Highness will indeed have dispatched, as I have begged — he takes
    my horses, and you will have a firm basket-carriage given him there, with a tarpaulin. Then send also
    the two-horse wagon to Prag to fetch the glass — lastly deign to send the drummer and Waurzyn back
    to Blizanow with a post and a little [uncertain: white] money. According to today''s news Napoleon
    presses ever more toward Paris — the King [uncertain: is placing] an army at Mevin, which happened
    at Grenoble and Lion also — but [uncertain: Kapon] is so cunning that where danger threatens him he
    goes around it — and since one might not be minded to earn the premium of 12 millions of francs set
    upon his head, he might well succeed in paying his visit in Paris. Judgments upon it are very various
    — and the confusion is great. No one finds himself better off here in this than the stock-jobbers.
    God, were it only possible to send Eberhard here. Most respectfully I remain, until death, Your Serene
    Highness''s — Wien, the 26th of March 1815. Glenck I found out today; he commends himself to your
    grace, and wishes Your Serene Highness in the Op[text lost] at once[text lost] most faithful servant
    v Triebenfeld'

- page: 2
  en: 'my old judge would have you believe — enough of this; God will and can help — That Prince August
    has accepted the presidency which all men of honour have declined is heart-shattering — for now they
    will hold him here no longer for weak but for — mad — The Congress has forbidden the King of Württemberg
    everything and has referred them to a general constitution — even every power of attorney of all the
    estates and persons assembled there was comprehended in the protestation — How does the man come /
    when I myself warned Your Serene Highness against it / to blow now in the King''s horn, and to assume
    the character which everyone else thrust away from himself — what will Prince Langenburg, what will
    Prince Kirchberg and others say of this young man, that he accepts the painted office which every
    one of them declined with steadfastness and magnanimity — O, that is a wise father of the land — Since
    yesterday a letter has gone off to Prince August, and one to Berlin, to the effect that the 100/m
    Rthl. are to be paid over to him, but absolutely in cash / for perhaps Cosmar means to give paper
    / — You did indeed will it so, and I still doubt that he will withdraw the power of attorney — To
    all the rest I say nothing further than that I refer to the letters sent off these 4 days past — Barbe''s
    servant Your Serene Highness will indeed have dispatched, as I have asked — he takes my horses, and
    you will have a firm wicker travelling-body given him there, with a tilt. Then send also the two-horse
    cart to Prague to fetch the glass — lastly may you be pleased to send the Tambour and Wawrzyn back
    to Blizanów by post and with a little white money — According to today''s news Napoleon presses ever
    more toward Paris — the King is posting an army near Melun, which was done at Grenoble and Lyon too
    — but Napoleon is so cunning that where danger threatens him he goes round it — and since no one may
    be inclined to earn the premium of 12 millions of francs set upon his head, he might well succeed
    in paying his visit to Paris — Judgements on this differ very widely — and the confusion is great.
    Meinand is better off here in the matter than the stock-jobbers — O God, were it only possible to
    send Eberhard here — Respectfully I remain, until death,


    Your Serene Highness''s


    Glenck I have found today; he commends himself to your favour, and will at once [uncertain: schasten]
    Your Serene Highness 200,000 Rthl. in cash in [uncertain: scheer] money at Op[text lost]urg —


    Vienna, the 26th of March


    1815.


    most faithful servant


    v Triebenfeld


    P.S. Tomorrow I shall make one further attempt, whether Mr Humboldt will not conclude the Courland
    settlement and earn what[?] the advocates want to have — I think Eberhard will not be able to do the
    whole of it — since the first declaration was not true, I do not trust the second at all, and as it
    seems to me, quite other levers belong to this business afterwards; should it succeed, I shall send
    an express courier on that account, and then Mr C. will not be needed — should no express courier
    come within 4 days, then Eberhard must absolutely come here —'

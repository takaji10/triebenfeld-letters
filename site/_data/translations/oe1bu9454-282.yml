- page: 2
  en: 'my old judge would have you believe — enough of this.


    God will and can help.


    That Prince August has accepted the post of president, which all men of honour have declined, is heart-shattering
    — for now they will no longer hold him here to be weak but rather — mad. The Congress has forbidden
    the King of Württemberg everything and referred him to a general constitution. Even every power of
    attorney of all the Estates and persons assembled there comprehended the protest within it. How comes
    the man (against which I myself warned Your Serene Highness) to blow now upon the King''s horn, and
    to assume the character which everyone else thrust from himself — what will Langenburg, what will
    Prince Kirchberg and others say of this young man, that he accepts the [uncertain: painted] office
    which everyone else declined with steadfastness and magnanimity — O, that is a wise father of the
    country. Since yesterday a letter has gone off to Prince August, and one to Berlin, that the 100000
    Rthl are to be handed over to him, but absolutely in cash (for perhaps Cosmar will want to give paper)
    — you did indeed wish it, and I still doubt that he will withdraw the power of attorney. To everything
    else I say nothing further than that I refer to the letters sent off these 4 days past. The servant
    of Barbe let Your Serene Highness by all means forward on, as I have begged — he takes my horses,
    and you will have a stout wicker conveyance given there, with a [uncertain: tarpaulin]. Then also
    send the two-horse waggon to Prague to fetch the glass — lastly deign to send the drummer and Waurzyn
    back to Blizanow with a post and a little travelling money. According to today''s news Napoleon presses
    ever further toward Paris — the King [uncertain: is stationing] an army near Mevin, which happened
    at Grenoble and Lyon also — but Napoleon is so cunning that where danger threatens him he goes around
    it — and as no one may be much minded to earn the premium of 12 millions of francs set upon his head,
    he might well succeed in paying his visit in Paris.


    The judgements upon it are very various — and the confusion is great. No one here fares better in
    it than the stock-jobbers. God, were it only possible to send Eberhard here. Most respectfully I remain,
    until death, Your Serene Highness''s


    Vienna, the 26th of March


    1815.


    Glenck I found out today; he commends himself to your grace, and wishes Your Serene Highness in the
    Op[text lost] at once [text lost] most faithful servant


    v. Triebenfeld'

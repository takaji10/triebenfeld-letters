- page: 1
  en: '282


    Most gracious Prince and Lord!


    This very moment, and indeed some 2 hours before the post goes out, I receive Your Serene Highness''s
    two letters of the 18th with the enclosure from Eberhard. I can do nothing further in the matter than
    to lament Your Serene Highness''s fate — Your Highness, most gracious Prince and Lord, will surely
    see for yourself that without a settlement with the kurz princesses nothing more can be said here,
    the more so as the Prince Chancellor has already been lied to in this, in that it was asserted with
    confidence that the Weiler and 162/m Rthl. were willing to settle — and if the matter cannot now be
    brought about, at a time when the ladies are in want of money, then, best of Princes, they are deraugt
    300/m Rthl. the poorer — Mr Eberhard is right that his coming here would be most necessary — only
    we can beg neither a pass for him here, still less money — But if he does come here, then everything
    shall be settled for him thus and he shall be placed beyond all responsibility. He needs only a pass
    from Your Serene Highness and from the magistrate there of some border town, and if he travelled with
    his own horses then the [text lost] devil would ask him anything — The matter must now be settled
    in one way or another, and I cannot and will not take that upon myself alone — For the rest, it may
    yet be that I, with my friends, shall before long have Cosmar''s swan-song and the panegyric of the
    obliging spirits made public — if it be possible in the world, and if I am not led astray from other
    quarters, then by God I keep my word and press on toward the goal until I reach it — and if this,
    which I already see in the Güste, is even in some measure attained, then surely every scoundrel will
    want to become a knight in the cause and will boast of having done Your Serene Highness God knows
    what services in the world — But I stake my honour upon it that not one of them has troubled himself
    over the wheels on Your Serene Highness''s account, still less once gone to bed this year or watched
    through sleepless nights for you, good Prince — Meanwhile I beg that a Hahn, a Paille, or a Lombardini
    not be counted among those [uncertain: Wolte], for they too may well sometimes have had the sun rather
    than tomorrow''s bread in the house for themselves and their children — Do, noble and exalted Prince,
    think therein of these faithful people — I know they suffer no tutoring, but hear the counsel of an
    honest fellow who hates flattery and not, as'

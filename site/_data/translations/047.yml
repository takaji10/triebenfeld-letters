status: draft
segments:
- page: 1
  en: 'Your Honour, most particularly highly honoured Court Councillor! I have had here these last days
    the justice-burgomaster Hawich and the Inspector Hecker of Zagorowo, and have rendered report to His
    Most Serene Highness upon everything by way of an express. As concerns the 4 matters kindly communicated
    to me in the meantime, I reply thereto most devotedly, that 1. the General Moratorium granted by the
    King of Saxony protects those estates for 3 years from all pressure, provided only that the interest
    be duly paid — and to settle this I have bound the people there upon their souls. I am also certain
    that the same are already settled by this time, for as Herr Hawich reported to me, Hönnricht, who
    has had himself created sequestrator, had already some weeks ago delivered over the monies to the
    authority for further forwarding. The 50000 Rthl which at that time the Invalids'' Fund [uncertain:
    to] His Most Serene Highness are entered upon the estates as appurtenant, and requires, as said before,
    nothing further than that the interest be paid. So far as this is concerned, these monies are disputed
    to the Invalids'' Fund neither from the one side nor from the other, for even the French General Government
    ordered me to repay the advanced interest which had been exacted from me in error, by military execution
    and arrest, as the mandatary of His Serene Highness, because this item of debt belongs to the Invalids''
    Fund. Nor do I believe that the Invalids'' Fund has been threatened that this capital would ever be
    disputed to it on the part of the King of Saxony, still less of the French.'
- page: 2
  en: 'it seems rather to be a measure of precaution on the part of the curators. In the meantime the
    men are not to be blamed [uncertain: when] they do their duty, and they might well be assured on the
    part of His Most Serene Highness that the same will himself intercede in the matter and will see to
    it that the Invalids'' Fund shall always receive its interest promptly, and also that in case it should
    be sought to call it in, in error, on the part of the King of Saxony, His Most Serene Highness would
    to the utmost of possibility intercede for it as well. For the rest, the Invalids'' Fund has the first
    mortgage upon the estates in question, must take precedence over all other creditors, and may not
    and cannot be endangered; nor would His Serene Highness pay interest, still less capital, willingly
    to anyone rather than to the Invalids'' Fund, the more so since the Indian banker Oppenheimer has
    not kept his word given before the court concerning the complete satisfaction of the Invalids'' Fund,
    and on which account a suit has now for several months been [uncertain: entarmirt] in Berlin and just
    now in Kalisz. As concerns 2. the claim of the Meyer on account of buildings, this is as strange to
    me as optics to a man born blind; I would indeed swear upon it that the Meyer is sooner in debt to
    His Serene Highness than His Serene Highness to him, for so far as I know this man was never in the
    service of His Serene Highness, but merely resided upon the estate of the Herr Building Councillor
    Glenck. As to what the Meyer says of Giese and consorts, the necessary has been set in motion against
    those fellows, and it is pending on account of 25000 M.; but it is a gross state of affairs that the
    rascals are in arrears — the suit.'
- page: 3
  en: 'that the fellows had not received all the plots which were promised them in the contract — the
    matter stands, as said before, already these 4 years in suit. [uncertain: Royal] the deceivers wished
    to hide themselves behind the shelter of the war, and the plots have been [uncertain: measured out]
    by 2 sworn surveyors, and the matter [uncertain: brought] into train. — As to the wood in which the
    [uncertain: decanirer] are to cut timber, it has been measured out to these devils; if in the course
    of the war acts of violence were committed thereupon through the sequestration, then the [uncertain:
    Olerwiger] may hold to the sequestrator, according to their contract, and thus His Serene Highness
    is not bound in any case to grant a remission. As concerns v. Viedrenricht''s affair, a suit is pending
    on that account, and assuredly everything has been set afoot by the judicial officer that is required
    for the utmost possible covering of His Serene Highness. That, for the rest, this wretched man wishes
    to raise revenues out of the estates is a piece of braggadocio, for so long as the sequestration lasts
    no one can take a heller from thence without its consent. As yet not all the arrears of interest are
    deposited; so much has been exacted / upon which Hawich will now certainly insist / then the sequestration
    ceases forthwith and the matter comes again into its track. The saddest thing is that everyone complains
    of the war and the bad times and pays nothing — the nobleman and the burgher, on the other hand, now
    hide themselves behind the moratorium granted for 3 years (which admittedly also comes very much to
    His Serene Highness''s advantage), but the treasuries remain empty thereby. The Meyer, however, would
    have to be told that according to the answer of the said von Triebenfeld the Meyer never stood in
    the service of His Serene Highness, that His Serene Highness owed him nothing, and that no use could
    be made of his offer to raise monies out of the estates, because according to the laws no one may
    draw monies out of estates which are under sequestration'
- page: 4
  en: 'were placed, without the foreknowledge of the curator or sequestrator. As concerns finally the
    petition of the Augustinower and other colonists, nothing further is to be entered into thereupon
    than to refuse these people''s request in such manner: that they are bound by their hereditary lease
    contracts to pay the interest without regard to any remission whatever. For as yet there prevails
    no judgment that either the said Dombcha or any man had a right to drive them from their plots; that
    the times are bad and the war has brought great distress cannot be denied, but since their contracts
    all comprehend every casus fortuitus, and it is expressly said therein that this does not protect
    them from their dues and burdens, His Serene Highness could, near as it went to his heart, give them
    a compliant answer to their request, inasmuch as His Serene Highness was himself pressed by his creditors
    and compelled to pay the interest. It is very necessary to keep these people as far as possible off
    one''s body, for if one grants it to one of them they all come; I am beset enough by these people
    — indeed no post day passes on which I must not pay several thaler for packets of letters full of
    [uncertain: our/nonsense]. And since these colonies at Drevic have over 6000 Rthl to pay to all these
    [uncertain: Johannischen], the debt would in consequence'
- page: 5
  en: 'grow too high, the more so as all others would follow this example, and His Most Serene Highness
    would never receive interest. As concerns for the rest my journey to Schlawenschitz, I burn with eagerness
    to lay myself personally at the feet of His Serene Highness; but impediments which I cannot possibly
    remove at once do not permit me to depart from here any sooner than until I am somewhat clear with
    my affairs. A misfortune undeservedly incurred at Berlin had the consequence that I had to sit there
    a whole year and even endure arrest. The devastating war consumed all my revenues, I could draw nothing
    from here and had to incur debts; my creditors awoke and my Kontop estates were [uncertain: sequestrated];
    even now I must endure the sequestration on that account and look upon my own property with my back
    turned. I am most [uncertain: unhappy] and cannot get away any sooner than until I am clear with my
    creditors. With the most perfect esteem I am Your Honour''s wholly most devoted friend and servant
    v Triebenfeld'

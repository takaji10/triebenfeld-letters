status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord!


    My illness is so obstinate that henceforward I must keep to the bed or the sofa; on that account I
    cannot lay myself at Your Serene Highness''s feet and speak with the same most highly concerning the
    business; even writing comes very hard to me. In the enclosed letter Bornstadt says that he means
    to depart; presumably his wise money is all gone. I therefore had Glenck asked whether he might not
    come to me and bring out the papers, or rather the various lease and settlement contracts which have
    been concluded with Bornstädt. Upon my courteous request I received the accompanying Scopptian note.
    To let the man travel without settling the matters is not good; the matter must be settled, for by
    this means one strikes the enemy on 3 sides. My humble petition is that Your Serene Highness command
    Herr Glenck to send me the contracts, settlements and accounts which have been negotiated with Bornstädt.
    And then, that Your Serene Highness say, if only in a couple of lines, that the same most highly,
    out of particular grace and in order to make an end of everything, will give Bornstadt 5000 Rthl.'
- page: 2
  en: 'According to Braun''s opinion he must have 7500 Rthl, without the honorarium promised him in the
    Betscher purchase business. If then one could get away with 5000 Rthl in all, one would be making
    non solides fude. When Your Most Serene Highness comes to me, I shall lay the pieces before the same
    most highly. In deepest reverence I remain, until death, Your Most Serene Highness''s


    Breslau, the 12th of 7br. 1804.


    most faithful and most humble and obedient servant

    v Triebenfeld'

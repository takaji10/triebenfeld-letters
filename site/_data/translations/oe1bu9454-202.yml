- page: 1
  en: '202


    Dear friend, Father Weigel has gone from me very well satisfied. He has placed the whole affair in
    my hands. He is willing to accept the estates which the Prince is acquiring here; I am only to acquaint
    him soon of every [uncertain: arrangement] so as to push the business forward quickly. I have explained
    everything to him thoroughly. He is perfectly satisfied with it, only I am still to work it out for
    him in detail, so as to be able to make it intelligible to his son as well. I thank God that the matter
    has come this far — Heaven will now grant it further prosperity and [uncertain: crown] my endeavours.
    He was very well pleased here — he said: "Ah, Mr von T[riebenfeld], you are misjudged by many, and
    it remains a riddle to everyone why you live so much to yourself, and notwithstanding that serve many
    people and take nothing from any of them. — I often hear various judgements, but every one of them
    founders on the fact that no self-[uncertain: interest] can be laid to your charge — I have [seen]
    you deal for many years; I observed you particularly in Berlin, where you might have gained hundreds
    of thousands. You always refuse everything, which excited the astonishment even of the King and of
    Bischoffswerder, and which often put old Eysenhardt quite out of countenance. I should gladly offer
    you something now, but I know you, and fear I should get a sour face for it. Meanwhile I give myself
    over to you entirely in this affair, and when the business is accomplished be content with the thanks
    of an old honest man — but God will bless you for it too.


    Had my good wife lived, she would have thanked you indeed — In the meantime I shall, [uncertain: if]
    you permit it, be here with him often now — You are an upright man, and the place is wonderfully beautiful."
    I know that you, dear friend, will rejoice if the matter goes happily, and therefore I hasten to communicate
    to you the result of this day — Give my greetings to your dear wife, and sleep tonight as quietly
    and contentedly as this [illegible] will yet be done.


    Yours


    Only may God grant that I quickly sell the 2 free holdings, for then it goes at once to [uncertain:
    kohlen], and that he sell himself — the 20th of Aug. 10, from Świniary


    sincere friend and the


    v Triebenfeld'

- page: 1
  en: 'Dear friend, Father Weigel has gone from me very well satisfied. He has placed the whole affair
    in my hands. He is willing to take on the estates which the Prince is here acquiring by exchange;
    I need only shortly set him [uncertain: Anfalt / put him in a position] concerning everything, so
    as to press the business forward quickly. I have explained everything to him thoroughly. He is entirely
    content with it; only I am still to work it out for him precisely, so as to be able to make it intelligible
    to his son as well. I thank God that the affair has come this far — heaven will surely now grant its
    further prospering, and [text lost: my endeavour "freyung"]. He was very pleased here — He said: Ah,
    Herr v. T., you are misjudged by many, and it remains a riddle to everyone why you live so much to
    yourself, and notwithstanding serve many people and take nothing from any of them. — I often hear
    various judgements, but every one of them founders on this, that one cannot lay any self-interest
    to your charge — I have seen you deal for many years; in particular I observed you in Berlin, where
    you might have gained hundreds of thousands. You always refused everything, which roused even the
    astonishment of the King and of Bischoffswerder, and which often put old Eysenhardt quite out of countenance.
    I should gladly offer you something now, but I know you, and fear to be met with a sour face. Meanwhile
    I give myself over to you entirely in this matter, and pray you, when the business is accomplished,
    to be content with the thanks of an old honest man — but God will bless you for it also. Were my good
    wife living, she would thank you indeed — In the meantime I shall, if you will permit it, now be often
    here with him — You are an upright man and the place is wondrous fine. I know that you, dear friend,
    will rejoice when the affair goes happily, and therefore I hasten to communicate to you the result
    of this day''s doings — Greet your dear wife and sleep tonight as quietly and contentedly as [uncertain:
    diesen Tauwerd] will yet be done. Only God grant that I may speedily sell the 2 free holdings, for
    then it goes at once to [uncertain: kohlen], and that he is to sell. The 20th Aug. 10, from Schweinern.
    Your sincere friend and the v Triebenfeld'

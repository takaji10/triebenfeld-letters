- page: 1
  en: 'Dear friend, Father Weigel has gone away from me very well satisfied. He has placed the whole matter
    in my hands. He is willing to take on the estates which the Prince is acquiring here; I need only
    [uncertain: set him in motion on everything] soon, so as to push the thing forward quickly. I have
    explained everything to him thoroughly. He is perfectly content with it; only I am to work it out
    for him precisely once more, so as to be able to make it intelligible to his son as well. I thank
    God that the matter has come this far – Heaven will now grant it its further prospering and [uncertain:
    my endeavour] freedom. He was very much pleased here — He said: Ah, Mr. von T., you are misjudged
    by many, and it remains a riddle to everyone why you live so much to yourself, and notwithstanding
    that serve so many people and take nothing from any of them. – I often hear various judgements passed,
    but every one of them founders on this, that no one can lay any [uncertain: self-interest] to your
    charge — I have watched you act for many years, and I have observed you especially in Berlin, where
    you might have gained hundreds of thousands. You always refuse everything, which excited even the
    astonishment of the King and of Bischoffswerder, and which often put old Eysenhardt quite out of countenance.
    I should gladly offer you something now, but I know you, and I fear I should get a sour face for it.
    Meanwhile I give myself over to you entirely in this matter, and when the business is accomplished
    you must be content with the thanks of an old honest man - but God will bless you for it too.


    Were my good wife still living, she would thank you first of all — In the meantime I shall, if you
    permit it, now often be here with him — You are an upright man and the place is wondrous fine.


    I know that you, dear [uncertain: friend], will rejoice if the matter goes happily, and therefore
    I hasten to communicate to you the result of this day''s work — Greet your dear [uncertain: wife]
    and sleep tonight as peacefully and contentedly as this [uncertain: thaw-weather] will still allow.


    God grant only that I may quickly sell the 2 free holdings; then it goes straight to the coals, and
    that he [uncertain: sell himself]. The 20th of August 10, from Schweinern


    Your sincere friend and


    von Triebenfeld'

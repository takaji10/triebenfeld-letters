  en: '193


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s gracious letter I have but this moment received / it is the 10th, 5 o''clock
    in the afternoon /, so it has been ten days on the road. The plan concerning the journey is thereby
    frustrated; besides, I would also most humbly beg Your Serene Highness not to make the journey as
    far as Parchwitz. It attracts notice, and there one can neither act nor even speak so undisturbedly.
    I shall come this very month, and before I go to Berlin, [uncertain: as truly as there is a God above]
    I shall come to Sławięcice myself. For cases are now arising upon which I must know Your Serene Highness''s
    high pleasure, in order to be able to speak in Berlin. In all likelihood the whole theatre is changing
    — According to Colonel Scharffenberg''s assurance, matters in Petersburg are fermenting to the point
    of [uncertain: uproar]. I am directing my attention very much thither — The affairs of the Polish
    estates will end well; the Dąbska has already twice [uncertain: evaded] the appointed term and pays
    all the costs, in order to [uncertain: gain] me time; the prefect Garczynski is now having Honrichs
    arrested [illegible]. I myself begged him to have everything strictly investigated. Honrichs is, [uncertain:
    in spite of] the certificates of the sub-prefect Brzechffa, nonetheless a rogue, as the prefect has
    decreed — He owes over 10,000 Rthl. — He has always been let go on, because by hints he misled people,
    as though he were bringing the money to Your'

- page: 2
  en: 'Serene Highness, or merely — since the prefecture [uncertain: now] satisfies itself of the contrary,
    that he has not given a single Groschen hither, they are [uncertain: now] taking hold of him — the
    sub-prefect has given surety for the patron — It is believed that he too drew the greater part out
    of the estates through Honrichs. A piece of good fortune, that I got the 600 Rthl. back from the fellow,
    [uncertain: because] I let him know nothing of the connexion with Count Garczynski — Garczynski [uncertain:
    is having] Hecker, with the assistance of the administrator Badęski[uncertain] appointed by the court,
    search everything out, so that the arrears may be quickly paid and the estates handed back free to
    Your Serene Highness


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Konotop, the 10th of April


    1810.


    faithful and most obedient servant


    v Triebenfeld'

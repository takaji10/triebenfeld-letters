- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    This morning at 5 o''clock Köchlich departed; I accompanied him as far as his carriage; the King meant
    to follow an hour thereafter — Köckritz commends himself once more to Your Serene Highness''s favour.
    As concerns the exchange transaction, I am pursuing it with head and heart — I hope it shall succeed
    — Knobelsdorff wrote some days ago to Fischbach – He said he had a commission from the General Director
    of the Landschaft, that the holding of this commission would last until the 10th; from the 11th onward
    he would stand at command to set out for Zagorowo any day. In the meantime I wrote yesterday to him
    myself by express, which Lombardini has dispatched, and asked him when he intended to travel and where
    we should meet. I await his answer, in order to proceed further accordingly. Weigel is again very
    well disposed – He says: if Stössel too would gladly have the Bischdorff estates, then I am content
    with it, provided I am entered [in the register] there; gladly will I then give the Prince a receipt
    and have everything struck out upon Koschentin. We are thick friends; he visits me often with his
    children at the swimming, for the Korn, that is his daughter, attaches herself very much to my two
    daughters. In short, on that side I hope for every possible kindness, the more so as it is now settled
    that all monies outstanding in Poland must be paid and may be drawn out of the country.


    The widows'' funds, [uncertain: bank], the sea-trading house, the wards'' deposit offices and all
    private persons receive their monies; the Poles are all at once beggars, and it now stands close to
    this, that they cannot manage and all go over to the [uncertain: Küssen]. [uncertain: Nochrich] now
    fears everything and holds the war between France'

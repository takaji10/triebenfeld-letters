- page: 2
  en: 'and Russia to be unavoidable; likewise he believes that the Poles will make the turn; and if that
    happens, then [uncertain: schließes] West Prussia too joins on to Galicia, and the Poles will throw
    themselves straight into Russia''s arms in order to save themselves — for whence should the poor inhabitants
    of the small province of Warsaw, which after all makes up only the 10th part of the former Kingdom
    of Poland, take 27 million rt. There smoulders here a fire beneath the [uncertain: Hegel], which might
    bring forth a frightful explosion. — Meanwhile a ray of hope dawns here which builds up prospects
    for Your Most Serene Highness''s very self, which I await with a high-beating heart. Private letters
    from Vienna assure that the peace between Russia and Turkey is at this moment already concluded —
    God grant that this be confirmed, for then a couple of gloomy clouds which still darken the brightness
    of our star of fortune would be [uncertain: verwähnt], and we should already see a brighter dawn —
    Since — as God gives, we [uncertain: Erden Wallen] take it from His hand — the upright man suffers
    but a short time, then the matter goes better — This very moment the honest Lombardini was with me;
    he will send [uncertain: einzusetzen]; now I can write more freely — For the present still this —
    Labage has been sent to Paris, and is to offer linen and iron for the contributions to be paid — half
    and half this mode of payment has been accepted — should it succeed, then iron would be a new commodity
    of worth — I learn of it first and tell Your Serene Highness faithfully what profit is to be drawn
    from it; the Swedish war offers glad prospects, for the iron will be sold at ever higher prices.


    Now, heartily, and to you, noblest of men, and among all princes'' children the only man [uncertain:
    geäbt] to you, upright Prince, dreadful [uncertain: Grüben] — believe and trust nothing, whatever
    anyone may tell you. — Your goodness of heart is dreadfully abused by your enemies, and even those
    who so often enjoy your highest confidence are pure seeming friends — so let them look to themselves
    — I beg you better'

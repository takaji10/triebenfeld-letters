- page: 3
  en: 'Prince, most heartily for it — For me it is more than poison, dagger and hell itself, to tell you,
    noblest of men, what is going on and what lurks in ambush. I have therefore struck out upon a course
    by which you will learn everything; order all things accordingly, and show yourself a great man with
    the dignity that has always been your own. Count upon it that within a short time events will occur
    in which you will play the most brilliant part and will see your enemies humbled. I am a poor miller
    of the earth, you know something of my unhappy fate, but perhaps I do more for your advantage than
    all the great ones of the earth — With boundless veneration I remain, until death,


    Your Most Serene Highness''s


    Breslau, the 11th of Sept.


    1810.


    faithful humble and obedient servant

    v. Triebenfeld'

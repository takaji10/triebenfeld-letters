  en: '205


    Most Serene Prince


    Most gracious Prince and Lord!


    This morning at 5 o''clock Köckritz departed; I accompanied him as far as his carriage, and the King
    intended to follow an hour after him — Köckritz commends himself once more to Your Serene Highness''s
    favour. As concerns the exchange transaction, I pursue it with head and heart — I hope it shall succeed
    — Knobelsdorff wrote some days ago to Fischbach — He said he had a commission from the General Director
    of the Landschaft; the holding of this commission would last until the 10th, and from the 11th onward
    he would be at command to set out for Zagórów any day. I have meanwhile written to him yesterday by
    the express which Lombardini dispatched, and asked him when he means to travel and where we should
    meet. I await his answer, in order to proceed further accordingly. Weigel is again very well disposed
    — He says: "If Stössel too would gladly have the Biskupice estates, then I am content, provided I
    am registered there; gladly will I then give the Prince a receipt and have everything struck out upon
    Koszęcin." We are thick friends; he visits me often with his children at Świniary, for the Korn —
    that is his daughter — attaches herself very much to my two daughters — In short, on that side I hope
    for every possible good, all the more as it is now settled that all monies outstanding in Poland must
    be paid and may be drawn out of the country.


    The widows'' fund, the bank, the Maritime Trading Company, the wards'' deposit offices and all private
    persons receive their monies; the Poles are all at one stroke beggars, and it now stands near to this,
    that they cannot manage and will all go over to the Russians. Nochrich now fears everything and holds
    the war between France'

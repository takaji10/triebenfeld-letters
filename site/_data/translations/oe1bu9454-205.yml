- page: 3
  en: 'Prince, most heartily for it — For me it is worse than poison, dagger and [uncertain: Hollen fein]
    to tell you, noblest of men, what is going forward and what lurks in ambush. I have therefore struck
    out upon a course whereby you shall learn everything; order all things accordingly, and show yourself
    a great man with the dignity that has always been your own. Count upon it that within a short time
    events will come about in which you will play the most brilliant of parts and will see your enemies
    humbled. I am a poor [uncertain: Erden Müller]; you know something of my unhappy fate, but perhaps
    I do more for your profit than all the great ones of the earth — With unbounded veneration I remain,
    until death,


    Your Most Serene Highness''s


    Wrocław, the 11th of September


    1810.


    faithful, humble and obedient servant


    v. Triebenfeld'

- page: 2
  en: 'and Russia to be unavoidable; likewise he believes that the Poles will make the turn-about; and
    if that happens, then at Galicia West Prussia too will join in, and the Poles will throw themselves
    directly into Russia''s arms, in order to save themselves – for from where should the poor inhabitants
    of the little province of Warsaw, which after all makes up only the tenth part of the former Kingdom
    of Poland, take 27 millions. There smoulders here a fire beneath the [uncertain: Hegel], which could
    bring forth a frightful explosion. – Meanwhile a ray of hope dawns here which of itself builds up
    prospects for Your Most Serene Highness, prospects which I await with a high-beating heart. Private
    [reports] from Vienna assure us that the peace between Russia and Turkey is at this moment already
    concluded – God grant that this be confirmed, for then a couple of gloomy clouds, which now still
    darken the brightness of our star of fortune, would be [uncertain: dispelled] and we should already
    see a brighter dawn. Since – as God gives it, we who wander the earth take it from His hand – the
    upright man suffers but a short time, and then the matter goes better. This very moment the honest
    Lombardini was with me; he will send to put in, so now I can write more freely — For the present this
    further matter: Labage has been sent to Paris and is to offer linen and iron for the contributions
    to be paid – half and half, this mode of payment has been accepted – should it succeed, iron would
    be a commodity of new value – I learn of it first and shall tell Your Serene Highness faithfully what
    profit is to be drawn from it; the Swedish war offers glad prospects, for the iron will be sold at
    ever higher prices.


    Now, from the heart, and to you, noblest of men and, alone among all princes'' children, a man practised
    — to you, upright Prince, frightful [uncertain: Grüben] — believe and trust nothing of whatever anyone
    may tell you. – Your goodness of heart is frightfully abused by your enemies, and even those who so
    often enjoy your highest confidence are pure sham-friends – so let them look to themselves – I beg
    you better'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, since the Minister von Voss is [uncertain: to] Havelberg, the cabinet
    letter issued to him by His Majesty the King in Your Serene Highness''s matter has been forwarded
    thither; this cabinet letter could not already have been sent in to the department here by the Minister.
    I have on that account made precise enquiry in the chancery through my friend, but up to this midday
    nothing whatever has come in; yet it may well be that His Excellency has omitted the transmission
    of it in order to bring the same along here himself, since he is returning 14 days earlier than his
    leave properly runs out and thus already arrives here next Thursday. Should the Royal cabinet letter
    to the Minister be worded as decidedly as Mr. von Triebenfeld would have it appear to me, then I am
    wholly convinced that everything will turn out as desired, concerning which [illegible] and my patrons
    here I have already received the most sacred assurance. At the same time I most humbly report how
    Mr. Triebenfeld'
- page: 2
  en: 'has demanded of me 300 Prussian Courant for Your Serene Highness''s use and on your high account,
    which I also at once paid over to him against his written note. For the rest, I remain, until death,
    in deepest [uncertain: reverence], [illegible] Serene Highness


    Berlin, the 13th of October


    1798


    humble and obedient servant


    C. F.[illegible] G. Eysenhardt his'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord,


    since the Herr Minister v. Voss is [uncertain: nach — reading "nach zu Havelberg", i.e. gone/away
    to Havelberg] at Havelberg, the Cabinet order sent to him by His Majesty the King in Your Serene Highness''s
    affair has been forwarded thither after him; this Cabinet order could not already have been transmitted
    by the Herr Minister to the Department here. I have on that account had careful enquiry made in the
    chancery through my friend, but up to this midday nothing whatever has come in; it may however well
    be that His Excellency has forborne to transmit it in order to bring the same hither himself, because
    [the case?] returns 14 days earlier than his leave properly ran out, and so will arrive here as soon
    as next Thursday. Should the Royal Cabinet order to the Herr Minister be worded as decidedly as Herr
    von Triebenfeld would have me [uncertain: verführen — "lead me to believe / mislead me"], then I am
    wholly convinced that everything will fall out according to [Your] wish, of which, moreover, and from
    my patrons here, I have already received the most sacred assurance. At the same time I most humbly
    report how Herr Triebenfeld'
- page: 2
  en: 'has demanded of me, for Your Serene Highness''s use and on High Account, 300 Pr[ussian] Cour[ant],
    which against his written acknowledgement I likewise paid over to him at once. I who for the rest,
    in deepest reverence, I remain, until death, Your Serene Highness''s


    Berlin, the 13 Octo[ber] 1798


    humble and obedient servant

    C. F.[illegible] G. Eysenhardt

    his own [uncertain: seinen]'

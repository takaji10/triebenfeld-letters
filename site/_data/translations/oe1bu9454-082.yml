  en: '82


    Most Serene Prince


    Most gracious Prince and Lord, as the Minister von Voss is still at Havelberg, the cabinet letter
    issued to him by His Majesty the King in Your Serene Highness''s matter has been forwarded thither;
    this cabinet letter could not ready [uncertain: bereit] already have been sent in to the Department
    here by the Minister. I have on that account made careful enquiry in the chancery through my friend,
    but up to this midday nothing has yet come in; it may however well be that His Excellency has for
    that reason refrained from sending it in, so as to bring it along with him himself, since the case
    [uncertain: falle] is coming back 14 days earlier than his leave actually ran out, and thus already
    arrives here next Thursday. Should the Royal cabinet letter to the Minister be worded as decidedly
    as Mr von Triebenfeld would lead [uncertain: verführen] me [to believe], then I am entirely convinced
    that everything will turn out as desired, on which account and [from] my favours [uncertain: Gunnen]
    here I have already received the most sacred assurance. At the same time I humbly report how Mr von
    Triebenfeld'

- page: 2
  en: 'more is gained than with Polagewo - for there too the matter must indeed be reckoned at 4 per cent.
    — God grant that all goes well, indeed very well. Prince George will be in Breslau next week — Both
    his affair and the investigations concerning Your Serene Highness''s estates I intend to settle during
    that time, so as to be back here at the end of the 4 weeks in question.


    To Colonel von Köckritz a letter will just now have come in - all mean it well, and apart from


    Mr. von Voss everyone is ready to anticipate Your Serene Highness''s wishes — Mr. von Voss is governed
    by the councillor of war Nöldichen. From Russia strange news has come in here. – Everything there
    is in confusion, because the new mistress rules the Emperor entirely without restraint - at Reppnin
    she is said to be arrested, the Kurra[uncertain: n]ins are all gone, Zubow has had to come in haste
    to Petersburg, and Panin is said also to have requested his discharge - the Empress has been ill-used
    by Paul and shut up for 3 days, the'

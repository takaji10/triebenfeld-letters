- page: 3
  en: 'Grand Duke has lamented greatly and wept like a child — Siege, it is said, will depart, and only
    the secretary remain here — It looks strange — yet people believe everything will remain in statu
    quo. In 5 days I shall have the good fortune to lay myself personally at Your Serene Highness''s feet.
    In deepest reverence I remain, until death, Your Most Serene Highness''s. Berlin


    the 20th of October.


    1798.


    faithful most humble and obedient servant von Triebenfeld'

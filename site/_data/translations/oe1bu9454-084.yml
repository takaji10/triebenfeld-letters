- page: 1
  en: 'Most Serene Prince


    Most gracious Lord, Since His Majesty the King has commanded His Excellency Mr. von Voss to arrange
    the Krotoszyn affair, the latter has asked for 4 weeks, as being the time within which the final report
    should be submitted. The Chambers are to investigate everything, in what manner the revenues come
    out equal. My plans are now already drafted, and at this very hour I go from here to Betsche, and
    I shall also see what is to be done with Bronzewski - for absolutely our revenues must remain as high,
    and since people are being so [uncertain: awkward] about Polajewo, one ought to give Your Serene Highness,
    out of the district governorship of Add nau, which borders hard upon Krotoszyn, as many estates as
    the higher value of our revenues amounts to - and in this way'

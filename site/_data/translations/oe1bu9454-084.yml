- page: 2
  en: 'more is gained than with Polajewo — for there too one must indeed reckon the matter at 4 per cent.
    — God grant that all goes well, indeed very well. Prince George will be in Wrocław next week — I mean
    to settle both his affair and the investigations concerning Your Serene Highness''s estates during
    that time, so as to be back here at the end of the 4 weeks in question.


    From Colonel von Köckritz a letter will just have come in — all mean it well, and apart from


    Mr von Voss everyone is ready to anticipate Your Serene Highness''s wishes — Mr Voss is governed by
    the councillor of war Nöldichen. From Russia strange news has come in here. — Everything there is
    in confusion because the new mistress rules the Emperor quite unrestrictedly — Repnin is said to be
    arrested; the Kurra[uncertain: h/k]ins are all gone; Zubow has had to come to Petersburg in haste,
    and Panie is said also to have asked for his discharge — the Empress, ill-used by Mr Paul, is shut
    up for 3 days; the'

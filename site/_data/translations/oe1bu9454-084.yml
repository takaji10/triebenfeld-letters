- page: 3
  en: 'Grand Duke has lamented greatly and wept like a child – Siege, it is said, will depart, only the
    secretary is to remain here — It looks strange – nevertheless it is believed that everything will
    remain in statu quo. In 5 days I shall have the happiness of laying myself personally at Your Serene
    Highness''s feet. In deepest reverence I remain, until death, at Your Most Serene Highness''s command


    the 20th of October.


    1798.


    faithful and most humble servant

    von Triebenfeld'

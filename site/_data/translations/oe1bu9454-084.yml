  en: '84


    Most Serene Prince


    Most gracious Lord. Since His Majesty the King has ordered His Excellency Mr von Voss to arrange the
    Krotoszyn affair, the same has asked for 4 weeks, as the time within which the final report is to
    be submitted. The chambers are to investigate everything, in what manner the revenues come out equal.
    My plans are now already drafted, and at this very hour I am going from here to Pszczew; I shall also
    see what is to be done with Broniewski — for our revenues must absolutely remain as high, and since
    people are being so [uncertain: vare] about Polajewo, Your Serene Highness ought to be given from
    the Starostey of Adelnau, which borders hard upon Krotoszyn, as many estates as the higher value of
    our revenues amounts to — and hereby'

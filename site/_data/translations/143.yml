status: draft
segments:
- page: 1
  en: Most Serene Prince! Most gracious Prince and Lord! Your Most Serene Highness has had the graciousness
    to inform me of the outcome of the compensation matter concerning Your Highness. Since Your Most Serene
    Highness most highly declares yourself satisfied with the manner in which this business has been concluded,
    there remains for me no further wish
- page: 2
  en: but this, that the continuing grace of His Majesty the King toward Your Most Serene Highness be
    as boundless as Your Highness's merits toward the State may perhaps be. It is with the most distinguished
    reverence and devotion that I have the honour to name myself, Your Most Serene Highness's most humble
    and obedient servant. Berlin, the 20th of October 1804. Amelang

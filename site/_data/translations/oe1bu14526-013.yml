- page: 2
  en: '§ IV. The hereditary taker and his successors in possession shall pay yearly from each Magdeburg
    Hufe a clear money rent of 15 Rthl, say fifteen Reichsthaler in Courant, into the lordship''s treasury,
    and that in half-yearly instalments at Midsummer and Christmas, each time seven Rthl twelve good Groschen.


    § V. For the further establishment of this contract the hereditary lessee has this day duly paid 200
    Rthl, say two hundred Reichsthaler, for which he is hereby given receipt, and he promises to lay down
    the remainder of the whole sum, 5800 Rthl, say five thousand eight hundred Reichsthaler, in cash here
    in Trąbczyn on the 22nd of June of this year.


    § VI. These twenty Hufen taken in hereditary lease are to be measured out to the hereditary taker
    as soon as possible and delivered into his possession.


    § VII. The twenty Hufen of land shall consist of five hundred and sixty Morgen of arable and of forty
    Morgen of meadow growth.


    § VIII. The hereditary lessee and his subsequent purchasers shall pay for all the seed-corn upon the
    Hufen which they take over, in such manner that they compensate the lordship, at market prices, for
    as many bushels as have been sown upon their lands, and this is to be faithfully accounted for.


    § IX.'

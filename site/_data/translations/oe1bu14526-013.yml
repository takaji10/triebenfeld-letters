- page: 3
  en: '§ IX. The hereditary lessee is granted free habitation in the house where the cooper in Trąbczyn
    dwells, for one year from Midsummer; but from Midsummer 1806 he must either have his own house finished
    or procure himself another dwelling.


    § X. Besides the yearly hereditary rents, the hereditary lessee undertakes, for himself and his descendants,
    to render all royal and other dues charged upon these estates, by whatever name they may be called,
    and such shall be laid upon the Hufen and duly apportioned.


    § XI. Since all the lands are dismembered and let out against rents, the hereditary lessees may make
    no claim to any right of pasture or of timber, but each must graze his cattle upon his own lands alone,
    and either grow his timber himself or buy it.


    § XII. The present hereditary lessee, as also the other takers, are at liberty to alienate their holdings
    to others in any manner they please; but upon every change of possession, whether by sale or by exchange,
    the tenth Groschen of the purchase money, or of the exchange value, must be laid down to the ground
    lordship as a transfer fee (Laudemium), and the said lordship holds always to'
  names:
  - de: Trąbczyn
    en: Trąbczyn
    kind: place
  numbers:
  - IX
  - '1806'
  - X
  - XI
  - XII
- page: 4
  en: 'to the new takers, whose business it remains not to pay out the purchase money to the seller until
    the transfer fee has been discharged.


    § XIII. No redemption of the hereditary rent shall take place; the fifteen Reichsthaler per Hufe once
    fixed remain irredeemable for everlasting times.


    § XIV. The hereditary lessee, as also his subsequent purchasers, remain for ever entirely free of
    all hereditary subjection, and they shall not be obliged to render the least manorial service to the
    ground lordship, nor to deliver any payment in kind. They are, however, without exception subject
    to the jurisdiction of the manorial lordship (Dominium) for ever and all time.


    § XV. The hereditary lessees are bound to lay out and build up the new villages as prescribed, in
    two lines or in one even line, wherefore Mr Tschachmann together with his subsequent purchasers must
    likewise submit himself to this.


    § XVI. The hereditary lessee, as also his successors in possession, must always take their drink from
    the lordship''s brewhouse and distillery or tavern; and for every quart of brandy brought in from
    other estates'
  names:
  - de: Tschachmann
    en: Tschachmann
    kind: person
  numbers:
  - XIII
  - XIV
  - XV
  - XVI
- page: 5
  en: 'they shall lay down to the ground lordship one thaler, and for every tun of beer five Reichsthaler.


    § XVII. The hereditary lessee, for himself and his successors, renounces each and every remission
    in cases of misfortune, by whatever name they may be called, and no allowance or abatement of the
    hereditary rent can ever accrue to them.


    § XVIII. The costs of this contract, of its confirmation and of its execution, the hereditary lessee
    and his subsequent purchasers undertake to discharge.


    § XIX. So long as the hereditary lessee and his successors in possession shall fulfil the obligations
    described above, they shall be protected by the ground lordship in their rights in every respect,
    and be defended and held harmless against any man''s real claims. Should they, however, remain in
    arrears with the yearly hereditary canon for longer than two years, they then forfeit this hereditary
    lease, and the ground lordship is entitled to take the same back without contradiction and to let
    it out otherwise. Both parties promised to keep the foregoing hereditary-rent contract firmly and
    inviolably, and they renounce'
  numbers:
  - XVII
  - XVIII
  - XIX
- page: 6
  en: 'all legal subterfuges available against it, in particular the objection of cunning persuasion,
    of over-hastiness, of an occurring injury above or below the half, and of matters agreed otherwise
    than as written down; and they have signed with their own hands together with the witnesses as follows.
    Trąbczyn, the 7th of May 1805. Peter Friedrich August von Triebenfeld, royal councillor of war and
    forests, also general attorney of His Serene Highness the Prince of Hohenlohe-Ingelfingen.


    read and approved


    Johann Gottlieb Tschachmann. Johan Fried. Cabanis, as witness. Carl Willhelm Richter


    as witness'

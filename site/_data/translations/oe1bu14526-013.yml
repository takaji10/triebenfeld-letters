segments:
- page: 1
  en: 'Between the councillor of war and forests von Triebenfeld, general attorney of His Serene Highness
    the Reigning Prince of Hohenlohe-Ingelfingen, hereditary and judicial lord of the estates here, on
    the one part, and the district administrator Mr Johann Gottlieb Tschachmann on the other part, the
    following contract was this day agreed and concluded.


    § I. The councillor of war von Triebenfeld makes over to Mr Tschachmann, out of the lands belonging
    to Trąbczyn, consisting of fields and meadows, the surface area of 20 Hufen, say twenty Hufen of Magdeburg
    measure, the Hufe reckoned at 30 Morgen and the Morgen at 180 rods, for all time, and namely on the
    Kopojno side, next to the lands chosen by the princely inspector Titz.


    § II. Mr Tschachmann is at liberty to make over these Hufen so acquired to others in several separate
    parcels, and to come to such terms with the new hereditary acquirers as he best can to his own advantage.


    § III. By way of purchase money the hereditary taker pays for each Magdeburg Hufe 300 Rthl, say three
    hundred Reichsthaler Royal Prussian Courant, hence for 20 Magdeburg Hufen six thousand Reichsthaler.


    § IV.'

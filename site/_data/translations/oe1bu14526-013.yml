status: draft
segments:
- page: 1
  en: 'Between the Councillor of War and Forests von Triebenfeld, General Plenipotentiary of His Serene
    Highness the Reigning Fürst zu Hohenlohe Ingelfingen, hereditary lord and lord of jurisdiction of
    the estates here, on the one part, and the Amtmann Herr Johann Gottlieb Tschachmann on the other part,
    the following contract was this day agreed and concluded.


    § I. The Councillor of War von TriebenFeld cedes to Herr Tschachmann, out of the lands belonging to
    Trąbczyn, consisting of fields and meadows, the surface area of 20 Hufen, say Twenty Hufen Magdeburg
    measure, the Hufe reckoned at 30 Morgen and the Morgen at 180 rods, for perpetual times, and this
    on the Kopoyner side, next to the lands chosen by the Princely Inspector Titz.


    § II. Herr Tschachmann is at liberty to cede these acquired Hufen in several separate portions to
    others, and to come to such agreement with the new hereditary acquirers as he can to his own advantage.


    § III. As purchase money the Herr hereditary taker pays for each Magdeburg Hufe 300 rttl., say Three
    hundred Rthaler Royal Prussian Courant, hence for 20 Magdeburg Hufen six Thousand Reichsthaler.


    § IV.'
- page: 2
  en: '§ IV. The Herr hereditary taker and his successors in possession shall pay from each Magdeburg
    Hufe yearly a clear money rent of 15 rttl., say Fifteen Rthaler in Courant, to the manorial treasury,
    and this in half-yearly instalments at Midsummer (Johanni) and Christmas, each time Seven rttlr Twelve
    good Groschen.


    § V. For the further establishment of this contract the Herr hereditary lessee has this day duly paid
    200 rt., say two hundred Reichsthaler, for which he is hereby given receipt, and he promises to lay
    down the remainder of the whole sum, being 5800 rt., say five Thousand Eight hundred Reichsthaler,
    on the 22nd of June of this year here in Trąbczyn in cash.


    § VI. These Twenty Hufen taken in hereditary lease shall be measured out to the Herr hereditary taker
    as soon as possible and delivered into his possession.


    § VII. The Twenty Hufen of land shall consist of Five hundred and sixty Morgen of arable and of Forty
    Morgen of meadow growth.


    § VIII. The Herr hereditary lessee and his subsequent purchasers shall pay for all the sowings upon
    those Hufen which they take over, in such manner that they compensate the manorial lordship at market
    prices for as many bushels (Scheffel) as have been sown upon their lands, and this shall be faithfully
    demonstrated.


    § IX.'
- page: 3
  en: '§ IX. To the Herr hereditary lessee there is granted the house in which the cooper in Trąbczyn
    dwells, as free lodging for one year from Midsummer (Johanni); but from Midsummer 1806 he must either
    have his own house finished or procure himself another dwelling.


    § X. Besides the yearly hereditary rents, the hereditary lessee undertakes, for himself and his descendants,
    to render all Royal and other dues charged upon these estates, by whatever name they may be called,
    and such shall be laid upon the Hufen and duly apportioned.


    § XI. That all the lands are dismembered and let out against rents; therefore hereditary lessees may
    in no wise lay claim to any right of pasture or of timber, but each must graze his cattle upon his
    own lands alone, and either grow his timber himself or buy it.


    § XII. To the present hereditary lessee, as to the other takers, it is free to alienate their holdings
    to others in any manner they please; but upon every change of possession, whether by sale or by exchange,
    the tenth Groschen of the purchase money, or of the amount of the exchange, must be laid down to the
    ground lordship as a Laudemium, and the same shall always hold itself to'
- page: 4
  en: 'to the new takers, whose business it remains not to pay out the purchase money to the seller until
    the Laudemium has been settled.


    § XIII. No redemption of the hereditary rent shall take place; the fifteen Rthaler per Hufe once fixed
    remain unredeemable for everlasting times.


    § XIV. The hereditary lessee, as also his subsequent purchasers, remain for ever entirely free of
    all hereditary subjection, and are also not to render the ground lordship the least manorial service,
    nor to deliver any payments in kind. They are, however, without exception subject to the jurisdiction
    of the Dominium for ever and perpetual times.


    § XV. The hereditary lessees are bound to lay out and build up the new villages according to prescription
    in two, or in one even line; wherefore Herr Tschachmann with his subsequent purchasers must likewise
    submit himself to this.


    § XVI. The Herr hereditary lessee as well as his successors in possession must always take their drink
    from the manorial brew- and brandy-house or tavern; and for every quart of brandy brought in from
    foreign estates'
- page: 5
  en: 'shall lay down One Thaler to the ground lordship, and for every barrel of beer five Rthaler.


    § XVII. The Herr hereditary lessee renounces, for himself and his successors, each and every remission
    in cases of misfortune, by whatever name they may ever be called, and no bonification or abatement
    of the hereditary rent can ever accrue to them.


    § XVIII. The costs of the contract, of its confirmation and of its engrossment, the hereditary lessee
    and his subsequent purchasers undertake to settle.


    § XIX. So long as the hereditary lessee and his successors in possession shall fulfil these obligations
    described above, they shall be protected by the ground lordship in their rights in every respect,
    and be defended and held harmless against every man''s real claims. Should they, however, remain in
    arrears with the yearly hereditary canon for longer than two years, they shall thereupon forfeit this
    hereditary lease, and the ground lordship is entitled to resume the same without contradiction and
    to let it out otherwise. Both parties promised to keep the foregoing hereditary-rent contract firmly
    and inviolably, and renounce'
- page: 6
  en: 'all legal evasions available against it, in particular the objection of cunning persuasion, of
    over-haste, of an injury suffered above or below half the value, and of matters otherwise agreed than
    as set down in writing; and they have signed with their own hands, together with the witnesses, as
    follows. Trąbczyn, the 7th of May 1805. Peter Friedrich August v Triebenfeld, Royal Councillor of
    War and Forests, also General Plenipotentiary of His Serene Highness the Fürst zu Hohenlohe Ingelfingen.


    Read and approved


    Johann Gottlieb Tschachmann. Johan Fried. Cabanis as witness. Carl. Willhelm Richter


    as witness.'

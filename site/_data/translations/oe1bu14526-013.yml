status: draft
segments:
- page: 1
  en: 'Between the Councillor of War and Forests von Triebenfeld, General Plenipotentiary of His Serene
    Highness the Reigning Fürst zu Hohenlohe-Ingelfingen, hereditary and jurisdictional lord of the local
    estates, on the one part, and the Amtmann Herr Johann Gottlieb Tschachmann on the other part, the
    following contract was this day agreed and concluded.


    § I. The Councillor of War von TriebenFeld makes over to Herr Tschachmann, out of the grounds belonging
    to Trąbczyn consisting of fields and meadows, the surface content of 20 Hufen, say twenty Hufen Magdeburg
    measure, the Hufe reckoned at 30 Morgen and the Morgen at 180 rods, for eternal times, namely on the
    Kopoyn side, next to the grounds chosen by the Princely Inspector Titz.


    § II. Herr Tschachmann is at liberty to make over these Hufen he has acquired, in several separate
    parts, to others, and to come to such agreement with the new hereditary acquirers, to his own advantage,
    as best he can.


    § III. As purchase money the Herr hereditary taker pays for each Magdeburg Hufe 300 rttl., say three
    hundred Reichsthaler Royal Prussian Courant, hence for 20 Magdeburg Hufen six thousand Reichsthaler.


    § IV.'
- page: 2
  en: '§ IV. The Herr hereditary taker and his successors in possession shall render annually, from each
    Magdeburg Hufe, a clear money rent of 15 rttl., say fifteen Reichsthaler in Courant, to the manorial
    treasury, and that in half-yearly instalments at Midsummer and Christmas, each time seven rttlr twelve
    good Groschen.


    § V. For the further establishment of this contract the Herr hereditary lessee has this day duly paid
    200 rt., say two hundred Reichsthaler, for which he is hereby given receipt, and he promises to lay
    down the remainder of the whole sum, with 5800 rt., say five thousand eight hundred Reichsthaler,
    on the 22nd of June of this year here in Trąbczyn in cash.


    § VI. These twenty Hufen taken in hereditary lease shall be measured out to the Herr hereditary taker
    as soon as possible and delivered into his possession.


    § VII. The twenty Hufen of grounds shall consist of five hundred and sixty Morgen [uncertain: of arable]
    and of forty Morgen of meadow growth.


    § VIII. The Herr hereditary lessee and his subsequent purchasers shall pay for all the seed-corn on
    the Hufen which they take over, in such manner that they compensate the manorial lordship, according
    to market prices, for as many bushels as have been sown upon their grounds, and this shall be faithfully
    demonstrated.


    § IX.'
- page: 3
  en: '§ IX. The Herr hereditary lessee is granted free dwelling in the house in which the cooper in Trąbczyn
    lives, for one year from Midsummer; but from Midsummer 1806 he must either have his own house finished
    or procure himself another dwelling.


    § X. Besides the annual hereditary rents, the hereditary lessee takes upon himself, for himself and
    his descendants, to render all Royal and other dues charged upon these estates, by whatever name they
    may be called, and such shall be laid upon the Hufen and duly apportioned.


    § XI. Since all the grounds are dismembered and let out against rents, the hereditary lessees may
    make no claim to any right of pasture or of timber, but each must graze his cattle upon his own grounds
    alone, and either grow his timber himself or buy it.


    § XII. The present hereditary lessee, as well as the other takers, is at liberty to alienate his holding
    to others in any manner he pleases; but upon every change of possession, whether by sale or by exchange,
    the tenth Groschen of the purchase money, or of the exchange quantum, must be laid down to the ground
    lordship as a Laudemium, and the same holds itself always to'
- page: 4
  en: 'to the new takers, whose business it remains not to pay out the purchase money to the seller until
    the Laudemium has been settled.


    § XIII. No redemption of the hereditary rent shall take place; the fifteen Reichsthaler per Hufe once
    fixed remain irredeemable for everlasting times.


    § XIV. The hereditary lessee, as well as his subsequent purchasers, remain for ever wholly free of
    all hereditary subjection, and are not obliged to render the ground lordship the least manorial service,
    or to deliver any payment in kind. They are, however, without exception subject to the jurisdiction
    of the Dominium for ever and eternal times.


    § XV. The hereditary lessees are bound to lay out and build up the new villages, as prescribed, in
    two lines or in one even line, wherefore Herr Tschachmann together with his subsequent purchasers
    must likewise submit to this.


    § XVI. The Herr hereditary lessee as well as his successors in possession must always take their drink
    from the manorial brew- and brandy-house or tavern; and for every quart of brandy brought in from
    foreign estates'
- page: 5
  en: 'one thaler each, and for every barrel of beer five Reichsthaler, are to be laid down to the ground
    lordship.


    § XVII. The Herr hereditary lessee renounces, for himself and his successors, each and every remission
    in cases of misfortune, by whatever name they may be called, and no bonification or abatement of the
    hereditary rent can ever accrue to them.


    § XVIII. The costs of the contract, of its confirmation and engrossment, the hereditary lessee and
    his subsequent purchasers undertake to settle.


    § XIX. So long as the hereditary lessee and his successors in possession fulfil the obligations described
    above, they shall be protected in their rights by the ground lordship in every respect, and shall
    be defended and held harmless against any man''s real claims. Should they, however, remain in arrears
    with the annual hereditary canon for longer than two years, they shall thereupon forfeit this hereditary
    lease, and the ground lordship shall be entitled to call it in without contradiction and to let it
    out otherwise. Both parties have promised to keep the foregoing hereditary-rent contract firmly and
    inviolably, and renounce'
- page: 6
  en: 'all legal evasions available against it, in particular the objection of cunning persuasion, of
    over-hastiness, of an injury suffered above or below the half, and of matters agreed otherwise than
    as set down in writing; and they have signed with their own hands, together with the witnesses, as
    follows. Trąbczyn, the 7th of May 1805. Peter Friedrich August v Triebenfeld, Royal Councillor of
    War and Forests, also General Plenipotentiary of His Serene Highness the Fürst zu Hohenlohe-Ingelfingen.


    read and approved


    Johann Gottlieb Tschachmann. Johan Fried. Cabanis, as witness. Carl Willhelm Richter,


    as witness'

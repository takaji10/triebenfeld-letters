segments:
- page: 1
  en: 'We Friedrich Wilhelm, by the Grace of God King of Prussia etc.


    Do hereby make known and give all and everyone, especially where it is needful, to know, that before
    Our South Prussian Government here the Chamber fiscal officer Beyer, in the name of the Treasury,
    appeared on the 22nd of March 1802, and to the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen,
    upon the ground of the letter of grant of His Majesty Our Lord Father resting in God, King Friedrich
    Wilhelm the Second, of the 19th of June 1797, and of Our Declaration of the same of the 1st of December
    of the same year, did surrender, cede and yield up, to hereditary and proprietary right, the lordship
    of Pszczew or Pszczew situate in the district of Poznań, with its appurtenances Świechocin, Stoki,
    Łowyń, Głażewo, Dormowo, Stołuń, Kuligowo, Szarcz, the bailiwick of Zielomyśl and Silna, together
    with the Hollander settlements, the Pomcher Hollander settlement and Heyde Mühlen, nothing at all
    excepted therefrom, as they have lain and still lie within their bounds and borders from of old, as
    all previous possessors have held, enjoyed and used this lordship, or have been entitled to possess,
    to enjoy and to use it. Now whereas the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen,
    through his likewise specially instructed mandatary, legitimated to the acts, Our district councillor
    of justice Melzer, has solemnly accepted the foregoing surrender of the lordship of Pszczew or Pszczew,
    and has made most humble [continued]'

  en: 'without prejudice. In witness whereof, under the customary signature of Our South Prussian Government
    and its greater seal. Given at Poznań, the 29th of March 1802.


    Götz


    (L. S.)


    Schirmer


    Deed of resignation concerning the lordship of Pszczew or Pszczew with appurtenances, situate in the
    district of Poznań, for the Prince Friedrich Ludwig of Hohenlohe-Ingelfingen. Upon the ground of the
    letters of grant dated Berlin, the 19th of June 1797 and the 1st of December of the same year, and
    of the foregoing deed of re-'

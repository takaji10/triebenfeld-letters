- page: 4
  en: 'signation of the 29th of March 1802, the title of possession for the reigning Prince Friedrich
    Ludwig of Hohenlohe-Ingelfingen upon the lordship of Pszczew or Pszczew has been entered in the mortgage
    book Vol. VII, Fol. 1, according to the mortgage certificate annexed hereto, by virtue of the decree
    of the 29th of March 1802. Poznań, the 1st of May 1802. Fest, Archivist.


    John.


    Ingrosser.'

- page: 2
  en: 'petition for the civil delivery of possession thereof; therefore the same, with all its appurtenances,
    rights, seigneurial, usufructuary and other entitlements, as these stand described word for word above,
    nothing at all excepted therefrom, to all such rights, in every measure and intent as Our Treasury
    and all previous possessors ever had, enjoyed and used the same, or were entitled to possess, to enjoy
    and to use it, has been conveyed and delivered over to the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen
    and to his bodily heirs and successors, and has by Us, out of Our most high Royal sovereign supreme
    princely power and authority over the land, by virtue of this letter been confirmed in such manner:
    that he and all his future lawful heirs and successors shall have full right and power henceforth
    to possess, to enjoy and to use the said lordship of Pszczew or Pszczew in the aforesaid manner, and
    also in turn to sell, to give away, to exchange and to pledge it, and to deal, do and dispose with
    it as with his well-acquired property; unhindered by all and everyone. Yet this without prejudice
    to Our Royal sovereign supreme princely rights over the land, entitlements, services and duties, nor
    otherwise to anyone'

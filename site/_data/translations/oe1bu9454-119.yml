status: draft
segments:
- page: 1
  en: 'Prince Biron sent word yesterday — Uminski finds the price very high; nevertheless he wishes that
    I might give him a letter to the present administrator of the Kaemen estates, by which Uminski would
    be accredited to be able to view the estates. From this request it appears that Uminski means only
    to make sport of the whole business — he knows all too well that Broniszewski is still sitting on
    the estates, and that he will permit no dispositions on the part of Your Serene Highness — on the
    other hand, Uminski knows these estates better than anyone from hereabouts. I shall accordingly disclose
    my opinion to the Prince. The messenger from Zagorow is back and has brought the enclosed pieces.
    If this is not some imaginary work of art of our good Glenck''s, then it surpasses the boldest wishes
    I had cherished for Your Serene Highness''s good fortune. For according to this table we should have
    some 31000 Morgen of actual demesne lands to dismember, and the rustical lands would remain for further
    disposition; indeed, even a piece of woodland for town and country is left over. Now, in order to
    make this great work truly brilliant and worth the trouble, I have a plan of my own, which Your Serene
    Highness may be pleased to examine. The surveyor Cabanis, three years ago, divided up the little estate
    of Petsche near Strehlen and handed it over to a number of [uncertain: Hussites]; the people paid
    for 23 Hufen a full 25000 z. in ready money and'
- page: 2
  en: 'took over all burdens — they begged Cabanis that he might point out to them districts in South
    Prussia where they could purchase and settle themselves in large bodies. If Your Serene Highness permits
    it, I shall at once [uncertain: send] Cabanis to the Hussites and have some 500 husbandmen recruited
    — these are people of means and industrious, with whom anything can be done. Beyond that, the affair
    is a very good one and will make a stir with the King, inasmuch as people are being drawn out of Bohemia
    into the country. The Rapacki would-be purchasers are not worth much; the fellows want far-extended
    terms of payment, and it is not fitting to engage upon that — the messenger has come back with that.
    The Hussites are more to my liking, for I shall hereafter beg Your Serene Highness for the patent
    as bishop of this flock, as soon as some 500 m more husbandmen shall have been engaged. Schöneich
    makes out, from a plan of just the same kind, his sole deliverance — he wishes to make over his whole
    Mstow estates to people of this sort. v Triebenfeld, Breslau, the 29th of March 1804'

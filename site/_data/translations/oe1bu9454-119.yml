segments:
- page: 1
  en: 'Prince Biron sent word yesterday - Uminski found the price very high; nevertheless he wished that
    I might give him a letter to the present administrator of the Kaemen estates, by which Uminski would
    be accredited to be able to view the estates. From this request it emerges that Uminski means only
    to make a mockery of the business - he knows all too well that Broniszewski is still sitting in the
    estates, and that he will permit no dispositions on the part of Your Serene Highness - on the other
    hand Uminski knows these estates better than anyone from here. I shall accordingly open my opinion
    to the Prince. The messenger from Zagorow is back and has brought the enclosed pieces. If this is
    not an imaginary artefact of our good Glenck''s, then it surpasses the boldest wishes I have cherished
    for Your Serene Highness''s fortune. For according to this table we should have some 31000 Morgen
    of actual manorial lands to dismember, and the peasant lands would remain for further disposition;
    indeed even a piece of forest for town and country remains over. Now in order to make this great work
    really brilliant and worth the trouble, I have a plan of my own, which Your Serene Highness may be
    pleased to examine.


    The surveyor Cabanis three years ago divided up the little estate of Petsche below Strehlen and handed
    it over to a number of Hussites; the people paid for 23 Hufen a full 25000 z. in ready money and'

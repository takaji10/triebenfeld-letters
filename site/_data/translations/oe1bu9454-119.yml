- page: 1
  en: '119 Prince Biron sent word yesterday — Uminski found the price very high — but he wished that I
    might give him a letter to the present administrator of the Kamionna estates, by which Uminski would
    be accredited to be able to view the estates. From this request it appears that Uminski only means
    to make sport of the matter — he knows all too well that Broniewski is still sitting in the estates,
    and that he will permit no dispositions on Your Serene Highness''s part — On the other hand, Uminski
    knows these estates better than any one from here. I shall accordingly disclose my opinion to the
    Prince. The messenger from Zagórów is back and has brought the enclosed pieces. If this is not some
    imaginary artefact of our good Glenck''s, then it surpasses the boldest wishes I have cherished for
    Your Serene Highness''s good fortune. For according to this table we should indeed have some 31,000
    Morgen of true manorial lands to dismember, and the peasant lands would remain for further disposal
    — indeed even a piece of forest for town and country remains over. Now, in order to make this great
    work properly brilliant and worthy of the labour, I have a plan of my own, which Your Serene Highness
    may be pleased to examine.


    The surveyor Cabanis, three years ago, divided up the little estate of Betsche below Strehlen and
    handed it over to a number of Hussites; the people paid for 23 Hufen a full 25/m. rt. in cash and'

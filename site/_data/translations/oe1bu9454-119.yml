- page: 2
  en: 'took over all the burdens — They begged Cabanis that he might point out to them districts in South
    Prussia where they could buy themselves in and settle in strong bodies. If Your Serene Highness permits,
    I shall at once send Cabanis to the Hussites and have some 500 farmers recruited — These are people
    of means and industrious, with whom anything can be done. Beyond that the affair is a very good one
    and will cause a stir with the King, inasmuch as the people are drawn out of Bohemia into the country.


    Rapacki''s would-be purchasers are not worth much; the fellows want far-extended terms of payment,
    and it is not proper to enter into that - the messenger has come back with the matter unsettled.


    I prefer the Hussites, for I shall hereafter beg Your Serene Highness for the patent as bishop of
    this flock, as soon as some 500 or more farmers shall have been engaged. Schöneich makes out from
    a plan of just the same kind his only salvation – he wants to hand over his whole Mstow estates to
    people of this sort.


    v Triebenfeld, Breslau, the 29th of March 1804'

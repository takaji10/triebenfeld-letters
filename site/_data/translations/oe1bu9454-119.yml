- page: 2
  en: 'took over all burdens — They begged Cabanis that he might point out to them districts in South
    Prussia where they could buy themselves in and settle in large bodies. If Your Serene Highness permits
    it, I shall at once send Cabanis to the Hussites and have some 500 husbandmen recruited — These are
    people of means and industrious, with whom anything can be done. Moreover the affair is a very good
    one and will make a stir with the King, inasmuch as people would be drawn out of Bohemia into the
    country.


    The Rapacki prospective purchasers are not worth much; the fellows want far-reaching terms of payment,
    and it is not proper to enter into that — the messenger has come back with the matter unsettled.


    The Hussites are more to my liking, for I shall afterwards beg Your Serene Highness for the patent
    as bishop of this flock, as soon as some 500 and more husbandmen shall have been engaged. Schöneich
    deciphers out of a plan of just the same kind his only salvation — he means to give over his whole
    M[uncertain: s]tower estates to people of this sort.


    Wrocław, the 29th of March 1804


    v Triebenfeld'

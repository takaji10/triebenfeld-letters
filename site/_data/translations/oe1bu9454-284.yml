- page: 4
  en: 'According to the courier just come in, Bonaparte is in Paris and has already been proclaimed Emperor
    again — Davoust is Minister of War and Seige Minister of the Interior — the thick fat King now sits
    with his kindred at Lille — Who is now to call the foreign troops into France, which the other gentlemen
    appear to be waiting for — Oh, that is a wretchedness without equal — At this moment news comes in
    that a great brawl has broken out in Paris between the Bonapartist rebels and the Royalists — the
    end of it is not yet known — This would be a piece of good fortune, for then the [uncertain: godparents]
    would soon have to be called in — In Berlin everything that is happening and everything that is [illegible]
    is said to be becoming very [illegible] — Prince Hardenberg has lost all his cheerfulness —'

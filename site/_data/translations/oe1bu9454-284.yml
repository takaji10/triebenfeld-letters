- page: 2
  en: 'The Emperor or the King must therefore give Your Serene Highness estates free of debt to the value
    of 366000 Rthl, and those 93000 Rthl you must receive in cash. Upon [uncertain: Trotzige] there stand
    a further 4000 Rthl for Lichnowski; these, however, are paid, and meanwhile one cannot demand them,
    because they were debts which Your Serene Highness had made. Weigel''s 30000 Rthl are transferred
    onto Zagoran. The [uncertain: Genorengen] gentlemen are to [illegible] already and


    First I only wish to know who is to indemnify Your Serene Highness - then I shall pick out what is
    of use and good -


    Herr P. Alegemann does nothing, one may beg as one will - now, on account of the outbreak of the war,
    he has the more excuses - with God''s assistance something will after all succeed in each case.


    Say anything I still cannot. Pourtales has not yet answered - he too must be watching the outbreak
    of the war -- Meanwhile it is said that he will certainly come, for otherwise he would have written
    off. He was in Paris to call in his monies.


    That is, Napoleon is now said really to be in Paris already; on the 18th, according to yesterday''s
    courier reports, he was already at Fontainebleau. Marshal Ney has now likewise turned rogue - Napoleon
    has written here that his wife and his son are to be handed over to him -- and sent to him at Paris
    with his escort. Oh, what is going on now! The rabble now rules in France, for the adventurer has
    called them up and promised freedom and equality to the sansculottes -- It is a nation which at bottom
    one must abhor - the mob is said to be housing there worse than a herd of devils, and to mark their
    march, wherever they go, with cruelty and


    atrocities which no man is able to describe - the King of France is said to be in Lille, and what
    is most lamentable is that not a shot has yet been fired by the King''s troops -- the villain marches
    on thither with his rabble unhindered; everyone gets out of his way as from a mad dog. In the newspapers
    there are declamations of boundless loyalty and devotion to the King'

- page: 1
  en: '284


    Most Serene Prince,


    Most gracious Lord, I quite certainly believed I should be able to report something definite — something
    good — to Your Serene Highness by today''s post, but the outbreak of the war impedes everything —
    yet something will come of it — Trąbczyn, and even Kamionna and Kulm, Your Serene Highness will never
    again recover — Mr Alexander has even induced our Most Gracious Lord to set his signature to the matter,
    namely that the Poles are to keep the estates which the commission restored to them — consequently
    no further reckoning is to be made upon that. Now I am submitting to the Emperor and the [uncertain:
    King] the just petition that Your Serene Highness be indemnified — my calculation shall not be an
    insignificant one —


    1. Your Serene Highness had to pay von Broniewski his pledge-money of circa 60000 rt. 180 3/5. To
    this the interest of 15 years, 33000 rt. Total [illegible] — 93000 rt.


    Here it is to be observed that although Meyer Bernhard gave the money at that time, this capital nevertheless
    stands, like all the others, registered out of Pszczew and the Kujavian estates, the latter of which
    the Jew M. Bernhard still now holds in pledge for it, wherefore this claim belongs wholly to Your
    Serene Highness —


    2. the Kamionna estates were at that time assessed by Otto''s courts at 180000 rt. Deduct therefrom
    the above 60000 rt.


    there remain 120000 rt.


    Accordingly Your Serene Highness must receive for Kamionna 213000 rt, namely 93000 rt in cash and
    120000 rt in estates


    3. of Trąbczyn: these estates would be, as [assessed] by me, valued at 316000 rt; upon them there
    still stand the debts contracted by Your Serene Highness.


    1. for Lichnowski 40000 rt.


    2. Grotowski 20000 rt.


    3. Seher Thos 8000 rt. there remains in value, and should they come through to the good, 246000 rt,
    together 459000 rt.'

- page: 3
  en: 'adduced; Bonaparte''s force is put down as low as 8 to 10 men, and yet the Emperor is in Paris
    and drives out the adored King. Here the gentlemen are listening to hear whether they will not be
    called upon from France''s side for assistance - they [uncertain: arm themselves] and leave it; would
    that Heaven willed. Meanwhile the robber and the [uncertain: Cancellie] get so far that hundreds of
    thousands will have to be led to the shambles. O tempora, o mores - King Murat too is now said already
    to be raising his head, and before anyone is aware of it he will be housing in Italy and pressing
    on right up to the gates - The distress, or rather the dearness, here now exceeds all bounds - for
    what are the poor to be [uncertain: mobilised] and war to be waged? One looks forward to nothing but
    the most dreadful suns of terror. The Württemberg affair has, according to the reports come in this
    night, [uncertain: scandalously graced itself] before the fat Majesty. Let Your Serene Highness read
    the enclosures and be amazed. The Prince [uncertain: Stadt] and Herr Metternich also set this gross
    creature very sorely in [uncertain: a corner], and now the more than boundless disgrace - that his
    own brothers set him so [uncertain: early] in the pillory - the poor Duke Wilhelm, who after all played
    the part of Minister of War with him, was at once driven off by the tenderly thankful Majesty; and
    Eugen''s son too he has, out of Most Gracious clemency, commanded to go straightway to the devil;
    Honrichs and Loar he has threatened to have imprisoned for ever - the business causes much amusement
    here. What vexes me is that the wisdom of his Diet''s president is so odiously [uncertain: persiflaged].
    This Illustrious Lord is now being cruelly dragged through the mire, both here and by the mediatised.
    Perhaps I shall be in a position to send in more consoling news than hitherto with the next post.
    In deepest reverence I remain, until death,


    turn over


    Your Serene Highness''s


    Vienna, the 27th of March 1815


    I beg very much for German and French [uncertain: blank forms] - ah, and were it possible to see Eberhard
    here, for hardly anyone will concern himself[?] with the compromise - meanwhile most obedient servant
    v. Triebenfeld'

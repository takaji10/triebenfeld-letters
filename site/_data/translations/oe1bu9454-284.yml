- page: 4
  en: 'According to the courier just arrived, Bonaparte is in Paris and has already been proclaimed Emperor
    again - Davout is Minister of War and [uncertain: Seige] Minister of the Interior - the thick fat
    King sits with his kindred now in Lille -- Who is now to call the foreign troops into France, upon
    which the other gentlemen appear to be waiting. Oh, that is indeed a wretchedness without equal. This
    very moment the news comes in that in Paris it has come to a great brawl between the Bonapartist rebels
    and the Royalists - the outcome of this is not yet known -- This would be a piece of luck, for then
    the [uncertain: godfathers] would surely soon have to be called in.


    As for Berlin, everything that happens and everything that is heard is said to become very [uncertain:
    persiflaged] - Prince Hardenberg has lost all his cheerfulness -'

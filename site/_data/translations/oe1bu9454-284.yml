- page: 1
  en: 'Most Serene Prince


    Most gracious Lord, I quite certainly believed I should be able this very post to report something
    definite and good to Your Serene Highness, but the outbreak of the war hinders everything - yet something
    will come to pass - Trąbczyn, and even Kaemen and Kulm, Your Serene Highness will receive back the
    more [uncertain: the] Herr Alexander has even prevailed upon our Most Gracious Lord to sign the matter
    along with him, namely that the Kohlen are to keep the estates which the S[equestration] Commission
    has returned to them - consequently no reckoning is to be made upon that any longer. Now I am submitting
    to the Emperor and King the just petition that Your Serene Highness be indemnified. My computation
    shall be no trifling one. 1. Your Serene Highness had to pay von Broniewski his pledge-money at about
    60000 Rthl 180 3/5. To this the 15 years'' interest 33000 Rthl


    South - 93000 Rthl Here it is to be remarked that although Meyer Bernhard gave the money at that time,
    this capital stands entered, like all the others, upon Betsche and the Cajowische estates, the latter
    of which the Jew M. Bernhard still holds in pledge for it to this day, wherefore this claim belongs
    to Your Serene Highness in all respects - 2. The Kaemen estates were at that time assessed by the
    Otto courts at 180000 Rthl


    Deduct therefrom the above


    60000


    there remain


    120000 Your Serene Highness must accordingly receive from Kaemen 213000 Rthl, namely 93000 Rthl in
    cash and 120000 Rthl in estates. 3. As to Trąbczyn, these estates were, as [reported] to me, assessed
    at 316000 Rthl; upon them there still stand the debts contracted by Your Serene Highness. 1. for Lichnowski


    40000


    2. Grotowski


    20000


    3. Seher Thos


    8000 there remains in value, and should they come through favourably, 246000


    together


    459000'

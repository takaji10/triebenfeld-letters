- page: 3
  en: 'set out; Bonaparte''s force is reduced to 8 to 10 thousand men, and nevertheless the Emperor is
    in Paris and drives out the adored King — Here the gentlemen are listening to hear whether they will
    not be called upon from the French side for assistance — they [uncertain: are gratifying themselves]
    and let it be; would to Heaven — Meanwhile the robber and the rabble get so far that hundreds of thousands
    will have to be led to the shambles — O tempora, o mores — King Murat too is said already to be raising
    his head, and before anyone is aware of it he will be housing in Italy and pressing perhaps as far
    as the gates of V[ienna] — The distress, or rather the dearness, here now passes all bounds — for
    what is the poor militia to be furnished and the war waged? One sees nothing but the most conceivable
    suns of terror before one — the Württemberg affair has, according to the reports come in this night,
    [uncertain: turned out] scandalously for the fat Majesty — Let Your Serene Highness read the enclosures
    and be astonished — Prince Hardenberg and Prince Metternich too set this corpulent creature very sorely
    in [uncertain: a corner], and now the more than boundless disgrace — that his own brothers put him
    so early in the pillory — the poor Duke Wilhelm, who after all played the part of Minister of War
    with him, him the tenderly thanking Majesty at once drove off; the son of Eugen too he has, out of
    his Most Gracious clemency, ordered to go straightway to the devil; Heinrich and Loar he has threatened
    to have imprisoned for ever — the affair affords much amusement here — What vexes me is that the wisdom
    of his Diet''s president is so odiously [uncertain: ridiculed]. This Illustrious Lord is now being
    cruelly pulled to pieces, both here and by the mediatised princes. Perhaps I shall be in a position
    to send in more consoling news by the next post than hitherto. In deepest reverence I remain, until
    death,


    turn over


    Your Serene Highness''s


    Of German and French blank forms I beg most earnestly — ah, and were it possible to see Eberhard here
    — for hardly will anyone take the settlement in hand


    Vienna, the 27th of March

    1815


    your most obedient servant


    v Triebenfeld'

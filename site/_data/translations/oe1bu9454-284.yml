- page: 2
  en: 'The Emperor or the King must therefore give Your Serene Highness debt-free estates to the value
    of 366000 rt, and those 93000 rt you must receive in cash — upon Trąbczyn there stood a further 34000
    rt for Lichnowski, but these are paid; still, one cannot demand them, because they were debts which
    Your Serene Highness had contracted — Weigel''s 30000 rt have been transferred onto Zagórów — The
    [illegible] gentlemen shall grow pale enough — and first I only wish to know who is to indemnify Your
    Serene Highness; then I shall duly pick out what is of use and good — Mr Stägemann does nothing, beg
    as one may — now, with the outbreak of the war, he has more excuses — with God''s help something will
    yet succeed. I can say nothing yet — Pourtalès has still not answered — he too must be waiting to
    see the outbreak of the war. Meanwhile D. says he will certainly come, since otherwise he would have
    written off. He was in Paris to call in his monies — Napoleon is now said really to be already in
    Paris; on the 18th, according to yesterday''s courier reports, he was already at Fontainebleau. Monsieur
    Rey has now also turned rogue — Napoleon has written here that his wife and his son are to be handed
    over to him, and sent to him at Paris under his escort — Oh, what is now afoot! The mob now rules
    in France, for it is the mob this adventurer has called up, promising freedom and equality to the
    sans-culottes — It is a nation one must at bottom abhor — the rabble there is said to be housing worse
    than a herd of devils, and to mark their march, wherever they go, with cruelties and atrocities which
    no man is able to describe — the King of France is said to be at Lille, and what is most [uncertain:
    lamentable] is that not a shot has yet been fired by the King''s troops — the Evil One moves on with
    his horde unchecked; everyone gets out of his way as out of a mad dog''s — In the newspapers there
    are reasonings [text lost] of boundless loyalty and devotion to the King'

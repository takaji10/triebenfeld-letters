status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Serene Highness [uncertain: commanded]
    that 18000 Rthl are to be sent to you from the Zagorow estates. It pains me more than sorely to have
    to tell Your Serene Highness that for the present this cannot be done. The prospect is there that
    2 lawsuits will shortly be won, but until that happens nothing is to be got out of the estates. On
    my knees I shall thank God if only the Christmas interest is paid, so that the moratorium remains
    in force. For the rest, I have by the most direct route set in train the matter of the alienation
    of the Zagorow estates to Stossel. Count Leopold v Wartensleben has been with me together with young
    Stössel. They have viewed the estates, and Wartensleben, who has every influence over Stossel (for
    he is Stössel''s son-in-law), has gone to Breslau to get the business onto the rails. My plan is the
    one Sub Litt A, and Wartensleben''s the one Sub B. I await hourly the declaration of the two old fellows.
    A certain Chief Bailiff König I have sent to Breslau on that account, to bring Heymen round. König
    has at the same time travelled to [uncertain: Ge Sendralzki], who may perhaps exchange with me, Blizanow
    against the Pila estates - the business goes better, for Weigel will not take Blizanow so willingly
    as the estates over there, and Weigel must in my opinion be fetched away and at the same time be settled
    with along with Stossel. Then Koschentin is saved – you will then have 60000 Rthl on Koschentin; these
    must be given to you out of the monies designated for the entailed estate, and with them you pay all
    your debts and still keep a large sum over. Out of another matter perhaps so much will come to you
    that you can pay the Curische sum - the how, and the where, by word of mouth. If all succeeds, you
    will yet live quietly and happily. With Constadt it is nothing - I have viewed the nest, I shall have
    nothing further to do with it – even Schurgast is a watery hovel and too dear - With Pila it would
    be best. I hold my Blizanow at 127000 Rthl; 27000 Rthl stand upon it and consequently there remain
    100000'
- page: 2
  en: 'The Pila estates Sandrelzki holds at 250000 Rthl; upon them stand 125000 Rthl of debt, there remain
    clear 125000; consequently Sandrelzki receives (if the matter goes so) a further 25000 Rthl, and these
    he wants at once in cash, and these Weigel would have to give; also something could be added to it
    out of the Zagorow arrears, if the lawsuits are [uncertain: taken], to be taken. In any event Weigel
    receives by this route 100000 Rthl. Upon Zagorowo he has 52500 standing. Stossel remains owing, to
    be made good. 20000. Weigel would have still to receive 17500 Rthl. That is 190000 Rthl. Stössel must,
    as the plan sub A shows, take the Zagorow estates. But he demands, as Leopold Wartensleben says, that
    Russinowitz be taken along with them, because both families want to move out of [uncertain: Schlimmeraus]
    and into Poland. In this manner Stössel receives, if he really has so much to claim, 280000; that
    amounts to 470000 Rthl. These will be covered: 1. For Zagorowo 30000. 2. For Weigel entered there,
    12500. 3. through Blizanow or [uncertain: Pielen] 10000. 4. through payment in addition of the 17500.
    That is 470000 Rthl. If all this goes happily and is brought to an end, then after this day''s work
    I shall come to you, best of Princes, and live and die with you - the 100000 Rthl, as well as what
    I have already given on and for the [text lost], you will repay me afterwards in instalments, so that
    it [uncertain: falls burdensome] to you and to Prince August. With most faithful attachment and the
    deepest reverence I remain, until death, Your Serene Highness''s — May Your Serene Highness deign
    to send the papers back to me; I have [uncertain: no] writing. This moment I am at the writing; I
    must again to Neisse. Blizanow, the 20th of 9br 1811. faithful most humble and obedient servant v
    Triebenfeld'

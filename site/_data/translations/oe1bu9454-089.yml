- page: 2
  en: 'difficult for Your Most Serene Highness to draw the conclusion - I only wish that the thread of
    argument I have taken up in this matter may meet with Your Most Serene Highness''s approval - My chief
    plan was to make the attack at once from the side of honour, so that the quill-pen heroes, who have
    no proper conception of it, should be thrown into all the greater disorder – Men of head and heart
    approve it; Heaven grant that Your Serene Highness may approve it also. The error on the part of Mr.
    p von Voss is very great, and it should not be difficult, given the batteries laid in place, to shoot
    his follies full of holes, so that one may press into them and bring the ravings of his Nöldichen
    to light.


    In general my plan is that the King shall absolutely appoint a commissary, or else determine the matter
    decisively at once and grant Your Serene Highness the estates in such manner that the affair be settled
    according to equal yield and value.'

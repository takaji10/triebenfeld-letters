- page: 8
  en: 'only Your Highness would have to pay as much as should be brought out upon the investigation of
    the Krotoszyn and Polajewo estates and of Your Serene Highness''s estates – against this nothing can
    be said, and everything depends merely upon an orderly conduct.


    Regarding the money negotiation, the Princess, Her Serene Highness, writes today to Mr. Nising - the
    Princess neither can nor will by any means give more than 30000 Rthl - Nising is to draw up the instruments
    and to alter in them only a very little according to the formulary sent in here, and then the money
    shall lie ready here at once – Now it still stands at about 7000 Rthl – I do not know where these
    are to be got - I am taking every possible pains - God knows where I shall have luck with it. From
    the Prince I receive nothing more at all; Her Serene Highness assures me she would gladly do it, only
    she could not now, in the shortness of the time, find further means. If I sell my Schwiner oaks tomorrow,
    then I shall give; but if this does not go forward, it will be hard to find means here – I shall indeed
    bid everything up; perhaps it will yet go – meanwhile let Your Most Serene Highness also make provision
    there.


    In deepest respect I remain, until death,


    Your Most Serene Highness''s


    Berlin[illegible] the 12th of December 1798.


    faithful, humble and obedient servant


    von Triebenfeld'

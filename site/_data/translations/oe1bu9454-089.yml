- page: 5
  en: 'Then Your Serene Highness''s authorised representative demands that T. might also be questioned.


    T. appears and asks [uncertain: wirt Zwonie] what is desired. The talk is then of the revenues received
    from Krotoszyn - It is said that these amounted to 40 or 50 Rthl - He answers that it might well be
    so. He had applied himself with a glowing zeal to arrange large and great receipts at his rent-office
    - he had thereby always expressed the ardent wish that such might be trumpeted abroad as far as possible,
    in order to find someone who should thereafter have an appetite for the lease of Krotoszyn and might
    take it off his hands - many and great expenditures he had, on the other hand, met in silence, letting
    his [uncertain: Cassini] know nothing of them, so that this man, without coming too near to his already
    troubled conscience, might be able to assure every curious enquirer of a great receipt – for at bottom
    he had, as lessee, never had cause to give anyone information, or to answer, concerning gain or loss
    - [uncertain: Jedes] his plan had succeeded for him;'

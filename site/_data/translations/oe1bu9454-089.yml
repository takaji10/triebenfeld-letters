- page: 5
  en: 'Then Your Serene Highness''s authorised representative demands that T. too might be asked.


    T. appears and asks, with irony, what is desired. The talk is then of the revenues received from Krotoszyn
    — It is said that these amounted to 40 or 50/m Rthl. — He answers that it may well be so; he had applied
    himself to it with a glowing zeal, to arrange large and considerable receipts at his rent-office —
    in doing so he had always cherished the ardent wish that this might be trumpeted abroad as much as
    possible, in order to find somebody who should thereafter hanker after the lease of Krotoszyn and
    take it off his hands — many and large outgoings, on the other hand, he had defrayed in silence, letting
    his [uncertain: Cassini] know nothing of them, so that the latter, without coming too near his already
    troubled conscience, might be able to assure every inquisitive person of a large revenue — for at
    bottom he had never, as lessee, had cause to give anybody information or to answer for profit or loss
    — Meanwhile his plan had succeeded:'

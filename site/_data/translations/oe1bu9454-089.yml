- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    The exchange transaction will, as I hold myself firmly convinced, certainly be brought to a conclusion
    to Your Most Serene Highness''s satisfaction. The enclosed letter of the honest Glenck contains the
    Copy of the letter to the King, and one to Noch: To B and Z like letters have been delivered which
    comprise this whole matter, but for the sake of form and order are always put in other words. According
    to the utterance of Mr. p B, the Minister von Struensee might well now be called upon to give his
    candid judgement upon the whole affair, and this turns out thus: That Krotoszyn and Polajewo can never
    bring more than 50 Rthl, that Mr. von Voss wished to grant this, and that the present tenants cannot
    render such either, but are in arrears by many thousands. From this declaration it will not be'

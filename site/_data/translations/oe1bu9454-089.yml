- page: 1
  en: '89


    Most Serene Prince,


    Most gracious Lord!


    The exchange transaction will, as I hold myself firmly convinced, certainly be concluded to Your Most
    Serene Highness''s satisfaction. The enclosed letter of the honest Glenck contains the copy of the
    letter to the King, and one further, as follows: To B[eyme] and Z[astrow] the like letters have been
    handed in, which comprise this whole matter, but which for the sake of the manner and the order are
    always put in other words. According to the utterance of Mr B, the Minister von Struensee ought now
    to be called upon to give his candid judgement upon the whole affair, and this comes out thus: "That
    Krotoszyn and Polajewo can never bring more than 50/m Rthl, that Mr von Voss should have conceded
    this, and that the present tenants cannot give so much either, but are in arrears by many thousands."
    From this declaration it will not be difficult for Your Most Serene Highness'

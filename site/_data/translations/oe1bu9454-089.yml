status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The exchange transaction will, as I hold myself firmly
    convinced, certainly be brought to a conclusion to Your Most Serene Highness''s satisfaction. The
    enclosed letter of the honest Glenck contains the Copy of the writing to the King, and one to Noch:
    To B and Z the same writings have been delivered, which comprise this whole matter in themselves,
    but which, for the sake of the modality and of good order, are always put in other words. According
    to the utterance of Mr. p B, the Minister v. Struensee might well now be called upon to give his candid
    judgement upon the whole affair, and this comes out as follows: That Krotoszyn and Polajewo can never
    yield more than 50 Rthl, that Mr. v Voss would be willing to grant this, and that the present tenants
    cannot furnish so much either, but are in arrears by many thousands. From this declaration it will
    not be [text continues]'
- page: 2
  en: not be difficult for Your Most Serene Highness to draw the conclusion. — I wish for myself that
    the thread of guidance I have taken up in this affair may receive Your Most Serene Highness's approbation.
    — My chief plan was to make the assault at once from the side of honour, so that the quill-heroes,
    who have no proper conception of it, should fall into all the greater disorder. — Men of head and
    heart approve it; Heaven grant that Your Serene Highness may also approve it. The error on the side
    of Mr. p v. Voss is very great, and it should not be difficult, with the batteries laid, to shoot
    his follies full of holes, so that one may press in upon him and set the ravings of his Nöldichen
    in the light of day. In general my plan is that the King should absolutely appoint a Commissarius,
    or else determine the matter decisively at once and assure Your Serene Highness of the estates in
    such a manner that the affair be settled according to equal yield and value.
- page: 3
  en: 'The manner of handling and the execution of my idea is then, firstly, in respect of Your Serene
    Highness''s estates. Of these Glenck is general tenant (for he must for the present remain in play
    there, so that he may carry the matters through at the estates, since otherwise other spirits would
    make botchery of it and could cause Your Serene Highness cost and vexation). Glenck has a 9-year lease
    contract and pays annually, inclusive of the ascertained forest revenue, 44500 Rthl; all sub-tenancies
    depend upon him, he has the liberty to speak, to dismember, and, as concerns the [uncertain: profit]
    of the estates, to do and to leave undone freely as he will. To this end he has, with his associates,
    made a security of 10000 Rthl. — Next to this, Your Serene Highness has paid him the first sums, for
    the putting of the estates into condition and other things etc., with 64000 successively, and has
    also assigned him funds for the settlement of what still lies upon the proprietors Broniewski and
    Trąpczynski — of which Your Highness has his receipts, and need trouble Yourself no further as to
    how'
- page: 4
  en: 'he has applied and employed this or that. With this contract, with the receipts, Your Serene Highness
    comes forward, hands these over, gives warranty of title for them, and has nothing further to do than
    to look with pity upon the quill-heroes when they gnaw their nails for fear. As regards the Krotoszyn
    estates: here Mr. v. Voss''s favourite says — for he himself does not appear at the end — Krotoszyn
    is to yield 49000 Rthl; the lease contract indeed states only 30000 Rthl, and the valuations only
    23–25 and 27000 Rthl; nevertheless one knows that it did yield 49000 Rthl. To this it is answered:
    whereby is this to be proved? For the declaration of Minister v Struensee states only the highest
    figure, which would be founded upon Mr. v. Voss''s manifold results, at 27 or 30 Rthl. Then the Nöldichen
    answers: here I have the accounts of the rent-master Schmudels, who kept them in the time of the Triebenfeld
    administration; these state so much or less, and the remainder one thinks to make up by way of improvements.'
- page: 5
  en: 'Then Your Serene Highness''s plenipotentiary demands that T. too might be questioned. T. appears
    and asks [uncertain: Zwonie] what is wished. The talk is then of the revenues received from Krotoszyn.
    — They say these amounted to 40 or 50 Rthl. — He answers that it was quite possible; he had applied
    himself to it with a glowing zeal, to contrive large and great receipts at his rent-treasury; in this
    he had constantly expressed the ardent wish that such should be trumpeted abroad as far as possible,
    in order to find someone who might thereafter covet the lease of Krotoszyn and take it off his hands.
    — Many and great expenditures, on the other hand, he had defrayed in silence, letting his cashier
    know nothing of it, so that the latter, without coming too near his already troubled conscience, might
    be able to assure every curious person of a great revenue. — For at bottom he had never, as tenant,
    had cause to give account or to answer to anyone concerning gain or loss. — In every respect his plan
    had succeeded for him:'
- page: 6
  en: 'he had got someone who not only wished himself into his [uncertain: place], but who moreover gave
    him a sum for withdrawal, and who, if the contract were prolonged for him, would in the last years
    pay the King some 5000 and more annually. — This the King himself approved by cabinet order, likewise
    accepted estates from the new tenant in lieu of payment, had the sum for withdrawal paid to T. in
    advance and afterwards recovered from the estates. For the rest, however, he, T., if one called upon
    him to speak upon his duty and honour, must assure them that it would be hard for anyone to render
    up the lease raised by him to 35 m. This is proved too by the condition of the present tenant, for
    he gives only 30000 in cash and yet remains constantly in arrear by large sums. The sub-tenants set
    up by him could not maintain themselves either — for he, T., when he engaged them at the high rents,
    had thereby constantly sought to lighten the discharge of the'
- page: 7
  en: 'lease, in that he took all their produce off their hands again in return for the rent they delivered
    to the treasury, paying for grain, cattle etc. at prices twice as high as they really stood, without
    letting it become known; and purely on that ground everyone had been content, and his business had
    thereby received the most brilliant varnish. For the rest, the result remained: Nöldichen is a wretched
    official who, upon the hearsay of wretched men, so conducted his [uncertain: cause] that he had to
    tell the King lies. The result of the whole then follows of itself. I have wished to set this down
    for Your Most Serene Highness''s high perusal and for Your Highness''s own reassurance, so that Your
    Serene Highness may see quite through the matter; for as it seems to me Your Highness believes that
    I might be got at on account of Krotoszyn, and that I had perhaps even laid that plan before Your
    Highness with the intention of slipping through by it. Before God, this is never the case, and never
    can be. — I have always dealt honestly toward every good man; consequently I could least of all do
    otherwise toward my Princely patron. — It was the purest and most upright intention, and Heaven will
    crown the end. Minister Ge Schulenburg has assured the Princess [uncertain: Sacken] that Your Serene
    Highness could obtain the estates of both kinds,'
- page: 8
  en: 'only Your Highness would have to pay as much as should be brought out at the investigation of the
    Krotoszyn and Polajewo estates and of Your Serene Highness''s estates. — Against that nothing can
    be said, and it comes only to a proper conduct. Concerning the money negotiation, the Princess Durchl.
    writes today to Mr. p Nising. — The Princess neither can nor will by any means give more than 30000
    Rthl. — Nising is to draw up the instruments and to alter therein only some trifle according to the
    form sent hither, and then the money is to lie ready here at once. — Now it turns still upon about
    7000 Rthl. — I do not know whence these are to be taken. — I give myself every possible trouble. —
    God knows whether I shall succeed in it. From the Princes I obtain nothing more at all; Her Serene
    Highness assures me she would gladly do it, only she could not now, for shortness of time, find further
    means. If tomorrow I sell my Schwinersche oaks, then I give [text lost]; but if this does not go forward,
    it will be hard to find means here. — I shall indeed put forth everything; perhaps it will yet go.
    — Meanwhile let Your Most Serene Highness also make provision there. In deepest reverence I remain,
    until death, Your Most Serene Highness''s

    Berlin[?] the 12th of Xbr 1798.

    faithful, humble and obedient servant

    v Triebenfeld'

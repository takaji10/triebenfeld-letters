- page: 6
  en: 'he had obtained someone who not only wished himself into his [uncertain: Plappe], but moreover
    gave him a sum for standing aside, and who, if the contract were prolonged, would in the latter years
    pay the King some 5000


    etc. more - this the King himself had approved by cabinet order, had likewise accepted estates in
    place of payment from the new lessee, had the sum for standing aside paid out to T. in advance, and
    afterwards had it drawn in again from the estates.


    For the rest, however, he, T., must - if he were called upon to speak upon his duty and honour - assure
    them that it must come hard to anyone to render the lease raised by him to as much as 35 thousand.
    This was proved also by the condition of the present lessee, for he gave only 30000 etc. in cash,
    yet he always remained behind by large sums.


    The sub-lessees engaged by him, moreover, could not maintain themselves either - for he, T., when
    he engaged them at the high rents, had thereby always sought to ease for them the discharge of the'
  names:

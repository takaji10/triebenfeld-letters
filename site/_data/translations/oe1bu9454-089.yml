- page: 4
  en: 'he has applied and employed this or that. With this contract, with the receipts, Your Serene Highness
    comes forward, hands these over, furnishes the warranty of title thereupon, and has nothing further
    to do than to look with pity upon the quill-pen heroes when for fear they gnaw at their nails. As
    regards the Krotoszyn estates. Here Mr. von Voss''s favourite says / for he himself does not appear
    at the end / Krotoszyn is to bring 49000 Rthl; the lease contract indeed states only 30000 Rthl, and
    the valuations only 23–25 and 27000 Rthl, yet it is known that it did bring 49000 Rthl. To this it
    is answered, whereby is this to be proved? For the declaration of Minister von Struensee states only
    the highest figure, which would be founded upon Mr. von Voss''s manifold results, at 27 or 30 Rthl;
    then the Nöldichen answers: Here I have the accounts of the rent-master Schmudel, who kept them at
    the time of the Triebenfeld administration; these state so much or less, the remainder one thinks
    to make up by improvements.'

- page: 3
  en: 'The manner of handling and the execution of my idea is then, firstly, with respect to Your Serene
    Highness''s estates. Of these Glenck is general lessee (for he must for the present remain in play
    there, so that he may carry the business through at the estates, since otherwise other spirits would
    make [uncertain: Bäbe bereien] and could cause Your Serene Highness cost and vexation.


    Glenck has a 9-year lease contract and pays annually, inclusive of the forest revenue ascertained,
    44500 Rthl; all sub-leases depend upon him, he has the liberty to [uncertain: reden] to dismember,
    and as regards the [uncertain: Nuppen] of the estates, to do and to leave undone freely what he will.
    To this end he has, with his associates, furnished a security of 10000 Rthl — next to this, Your Serene
    Highness has paid him the former sums for the putting of the estates in order and other things etc.,
    64000 successively, and has also assigned him funds for the settlement of what still lies upon the
    possessors Broniewski and Trąpczynski - concerning which Your Highness holds his receipts, and need
    trouble yourself no further as to how'

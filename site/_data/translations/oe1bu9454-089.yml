- page: 3
  en: 'The manner of handling and the carrying out of my idea is then, firstly, with respect to Your Serene
    Highness''s estates. Of these Glenck is general lessee / for he must for the present remain in play
    there, so that he may carry through the business at the estates, since otherwise other spirits may
    work knaveries and cause Your Serene Highness cost and vexation.


    Glenck has a 9-year lease contract and pays annually, inclusive of the ascertained forest revenue,
    44,500 Rthl. All sub-leases depend upon him; he has the liberty to clear land, to dismember, and,
    as concerns the profit of the estates, to do and to leave undone freely what he will. To this end
    he has, with his associates, given a caution of 10/m Rthl — next to this, Your Serene Highness has
    paid him the first sums for putting the estates in condition and for other matters etc. to the amount
    of 67/m Rthl., successively, and has also assigned him funds for the settlement of what still rests
    upon the possessors Broniewski and Trąpczynski — for which Your Highness holds his receipts, and need
    trouble Yourself no further as to how'

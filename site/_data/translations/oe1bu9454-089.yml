- page: 6
  en: 'he had got somebody who not only wished himself into his place, but moreover gave him a sum for
    standing down, and who, if the contract were prolonged, would in the latter years pay the King annually
    some 5,000 Rthl. more — this the King himself approved by cabinet order, at once accepting estates
    from the new lessee in place of payment, having the sum for standing down paid to T. in advance, and
    afterwards recovered out of the estates.


    For the rest, however, he, T., must — if one called upon him to speak upon duty and honour — assure
    them that it must fall hard upon anyone to render up the lease raised by him to as much as 35/m Rthl.
    This is proved too by the condition of the present lessee, for he gives only 30/m in cash, yet he
    always remains in arrears with large sums.


    The under-lessees appointed by him, meanwhile, could not maintain themselves either — for he, T.,
    when he engaged them at the high rents, had constantly sought thereby to make the discharge of the'

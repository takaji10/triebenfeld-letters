- page: 4
  en: 'he has applied and employed this or that — With this contract and with the receipts Your Serene
    Highness comes forward, hands these over, gives warranty of title for them, and has nothing further
    to do than to look upon the pen-heroes with pity when in their anguish they gnaw their nails.


    2. With regard to the Krotoszyn estates. Here Mr von Voss''s favourite says / for he himself does
    not appear in the end at all / that Krotoszyn is to bring 49,000 Rthl — the lease contract, to be
    sure, states only 30,000 Rthl, and the valuations no more than 23–25 and 27/m Rthl; nevertheless it
    is known that it had brought 49,000 Rthl — to which the answer is: whereby is this to be proved? For
    the declaration of Minister von Struensee states only the highest figure, which was established by
    Mr von Voss''s manifold results, at 27 or 30/m Rthl. Then the Nöldich answers: Here I have the accounts
    of the rent-master Schmiedel, who kept them at the time of the Triebenfeld administration; these state
    so much or less, and the remainder one thinks to make up by improvements —'

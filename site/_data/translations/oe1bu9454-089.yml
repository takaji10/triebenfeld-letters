- page: 8
  en: 'only Your Highness would have to pay as much as should be brought out upon the investigation of
    the Krotoszyn, Polajewo and Your Serene Highness''s estates — against that nothing can be said, and
    it comes only to a proper conduct of the business.


    Concerning the money negotiation, the Princess writes today to Nising — the Princess cannot and absolutely
    will not give more than 30/m Rthl. — Nising is to make out the instruments and to alter in them only
    a very little, after the form sent in here; whereupon the money is at once to lie ready here — Now
    it still turns upon about 7,000 Rthl — I do not know where these are to be got — I give myself all
    possible pains — God knows where I shall succeed. From the Princess I obtain absolutely nothing more;
    Her Serene Highness assures me she would gladly do it, only she could now, for shortness of time,
    find no further means — If I sell my Świniary oaks tomorrow, then I shall give; but if this does not
    come off, it will be hard to find means here — I shall indeed put forth everything; perhaps it may
    yet succeed — meanwhile let Your Most Serene Highness provide there also.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin[?], the 12th of December 1798.


    true, humble and obedient servant


    von Triebenfeld'

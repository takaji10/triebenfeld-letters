- page: 7
  en: 'lease, in that he took back from them all their produce in return for the lease they rendered at
    the [uncertain: Caesen], paying for grain, cattle etc. at prices once again as high as those they
    actually stood at, without letting it be noised abroad; and merely on this ground had every one of
    them been satisfied, and his business had thereby acquired the most brilliant gloss. For the rest
    the result would remain - that Nöldichen is a wretched official who, upon the hearsay of wretched
    men, has so conducted his [uncertain: Chase] that he has had to tell the King lies. The result of
    the whole then follows of itself. This I have wished to set down for Your Most Serene Highness''s
    high insight and for Your Highness''s reassurance, so that Your Serene Highness may see quite through
    the matter. For as it seems to me, Your Highness believes that I might be got at on account of Krotoszyn,
    and that I had perhaps even laid that plan before Your Highness with the thought of slipping through
    by means of it - By God, this is never the case, and can never be – I have always acted uprightly
    toward every good man, consequently I could least of all do otherwise toward my princely patron –
    It was the purest and most sincere intention, and Heaven will crown the end. The Minister Count Schulenburg
    has assured the Princess, Her Serene Highness, that Your Serene Highness could obtain the estates
    of both kinds,'

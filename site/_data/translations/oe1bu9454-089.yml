- page: 2
  en: 'to draw the conclusion — Now I wish for myself that the guiding line I have taken up in this matter
    may find Your Most Serene Highness''s approval — My chief plan was to make the attack at once from
    the side of honour, so that the pen-heroes, who have no proper conception of it, should fall into
    all the greater disorder — Men of head and heart approve it; heaven grant that Your Serene Highness
    may approve it too. The error on the part of Mr von Voss is very great, and it ought not to be difficult,
    with the batteries now laid, to shoot his follies full of holes, so that one may press in upon him
    and bring the ravings of his Nöldich to light.


    In general my plan is that the King should absolutely appoint a Commissarius, or else determine the
    matter at once decisively and promise Your Serene Highness the estates in such a way that the business
    should be settled according to equal yield and value.'

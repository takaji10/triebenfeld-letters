- page: 7
  en: rent easier for them, in that he took all their produce off their hands again in return for the
    rent they had delivered to the office, paying for grain, cattle etc. at prices twice as high as they
    actually stood, without letting it become known; and merely on this ground each of them had been content,
    and his business had thereby acquired the most brilliant colouring. For the rest the result would
    remain — the Nöldich is a wretched official who, upon the hearsay of wretched men, has so conducted
    his [illegible] that he has had to tell the King lies. The result of the whole then follows of itself.
    I have wished to set this down for Your Most Serene Highness's high insight and for Your utmost reassurance,
    so that Your Serene Highness may see quite through the business. For as it seems to me, Your Highness
    believes that on account of Krotoszyn something can be laid to my charge, and that I had perhaps even
    laid that plan before You in order that I might thereby slip through myself — By God, this is never
    the case, and never can be — I have always dealt uprightly toward every good man, consequently I could
    least of all do otherwise toward my princely patron — It was the purest and most sincere intention,
    and heaven will crown the end. The Minister Count Schulenburg has assured the Princess Sa[cken] that
    Your Highness might obtain the estates of both kinds,

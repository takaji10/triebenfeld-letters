status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Gracious Lord! Your Serene Highness''s dispositions, which you were most highly
    pleased to issue through Court Councillor Meyer to Privy Councillor [uncertain: Amelang], have shaken
    my [uncertain: innermost] and have so aggravated my bodily sufferings that I may well hope for my
    complete recovery only some 4 weeks later. How was it possible for you, gracious Prince and Lord,
    to take such resolutions as might have plunged me, in these times and given the disposition of Herr
    Bau von Stein, into the deepest misery — You order [uncertain: still] today sums upon that [uncertain:
    bank] instruction, which I already three quarters of a year ago [text unclear: declared] null and
    void, and Herr Meyer says that you do this out of mercy toward me, in that you were drawing upon your
    last penny of need. How painfully these expressions [uncertain: touch] my heart I am not able to depict
    — You wish, Most Serene Lord, out of mercy toward me, to assign 2600 Rthl of my own property — What
    is the meaning of this? I have suffered here for you unjustly and dreadfully, indeed I have even had
    to endure arrest (which I have never in my life undergone) — I had to procure and pay the money, unless
    I wished to have 2 gendarmes continually in my chamber, who cost me here some 20 Rthl daily — the
    worthy Minister von Zastrow helped in this, but I had to bind myself to him not to depart from here
    any sooner than until the 6000 Rthl were paid and he had his bill of exchange back. I reported this
    unheard-of occurrence to Your Serene Highness, and beg you to contribute so that the 6000 Rthl, which
    I have had to pay here for you, may be settled. I begged at the same time that that bank instruction,
    likewise for [illegible]000 Rthl, be sent back to me, inasmuch as it was declared invalid, and I have
    already several times been admonished by the [uncertain: bank] to return the same, so that my Kontopper
    mortgage together with my bill of exchange — which was drawn only for 3 months and had long since
    expired — might be restored to me.'
- page: 2
  en: 'Your Serene Highness''s replies to my letter [uncertain: express] the deepest sympathy for me,
    but mentioned nothing of the [uncertain: bank] instruction — on the contrary, Herr Meyer writes to
    Privy Councillor Amelang in a threatening style and, out of mercy toward me, assigns 1600 Rthl to
    the [text unclear] Privy Councillor, which he is to have paid out of my money through the Royal [uncertain:
    bank], for which I have pledged my property and given my bill of exchange. That is truly more than
    unheard-of — I am sent hither by Marcul on the most important affairs — I am, when I have concluded
    the business here, to go on to Vienna; here I am attacked, in a manner not to have been imagined,
    for 5000 Rthl of interest which Your Serene Highness is to pay, as your plenipotentiary; I prove that
    I am not bound to render this payment — all this avails nothing — they arrest me, place 2 gendarmes
    upon me who must guard me, and whom I must feed here at the inn daily — I am to pay [text unclear]
    — the business entrusted to me I neither might nor could pursue under such surveillance — the consequences
    thereof will yet have great influence upon the fate of many a man. Yes, in this [uncertain: extremity]
    the honest Minister von Zastrow advised that the money be raised and paid. The interest for 2 years
    amounted to 5000 Rthl and the costs 125. I had 2000 Rthl of travelling money by me; for 5000 Rthl
    the Minister v. Z. borrowed from a certain banker von der Laar in state paper, repayable in Courant
    on the 14th of May of this year — the 5000 Rthl were converted into Courant, and we scarcely brought
    the sum together to be able to settle the interest. The term is now again at the door for paying von
    der Laar the 5000 Rthl — I have already moved heaven and hell to raise the money. But in these hard
    times it is in vain. I have fallen ill over it and lie here wretched — I have run out of time, have
    no travelling money, and, what is worst of all, I cannot act in the business entrusted to me — To
    this is now further added that Minister Stein is not my patron, and that I am to give back the instruction
    on the bank for those 6000 Rthl lent 2 years ago, and in this way I am, for Your Serene Highness''s
    cause''s sake, in continual'
- page: 3
  en: 'arrest — To Königsberg I cannot write the cause, for Your Serene Highness''s honour''s sake — I
    have had just cause hitherto to excuse myself on the ground of illness, but in the end the matter
    will nonetheless come to light, and it might prove prejudicial to Your Serene Highness yourself. With
    an honest heart I have striven to find a remedy, I hoped to obtain something through your help, and
    I have already 2000 Rthl; there are wanting only a further 3125 Rthl. Now I learn through Amelang,
    to my very greatest horror, that the 2000 r. which Herr Meyer, out of compassion for me, assigns —
    are to be taken from those 6000 Rthl which I two years ago instructed for Your Serene Highness. Had
    this not been disclosed to me by Amelang — the monies with 1600 Rthl to me and with 3400 Rthl paid
    to Eysenhardt — then the bank, or Minister Stein, since the bill of exchange given by me for the 6000
    Rthl has long since expired, [text unclear] and would forthwith have proceeded according to bill-of-exchange
    law and formally arrested me anew. I now beg Your Serene Highness most urgently to have a remedy provided,
    so that at least the 3125 Rthl may be paid here. For with my 2000 Rthl and with the costs I have laid
    out I am willing to wait, and to procure myself money for the journey to Vienna. Thereupon I beg just
    as urgently that an order be sent at once to Privy Councillor Amelang, that he restore to me the bank
    instruction for 6000 Rthl, since Eysenhardt has deposited it with him in the original — This is the
    only means whereby these notorious matters may be set aside, Your Serene Highness''s honour and my
    own saved, and I be made free again, so as to pursue the business most graciously entrusted to me
    — once my health, which has been quite [uncertain: shattered] by these accursed events, has been restored
    — and, if possible, to re-establish much. In all other matters I refer to my preceding letters, and
    leave it to Your Serene Highness''s judgement what you may be pleased to do. Only for the payment
    of the 3125 Rthl provide the most speedy remedy, and write to Herr Amelang that he restore to me at
    once the bank instruction for the 6000 Rthl, to which he is willing and ready — for all too unwillingly
    would I let the matter become noised abroad in Königsberg, and make known the true cause of the delay
    of my journey. In the hope of the most speedy compliance with my request I remain Your Serene Highness''s
    faithful and most obedient servant. Berlin, the 25th of April 1808. I observe that the term of payment
    to von der Laar falls due on the 14th of May, and that there are only 22 days net remaining — these
    I will yet await here; then let it go as God wills. v Triebenfeld'

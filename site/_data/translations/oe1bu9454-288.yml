- page: 2
  en: '[uncertain: wilunver] Szetlewek at at most 160000 Rthl - what could be demanded as compensation,
    once my 760000 Rthl of debts have been deducted? Moreover this is no instrument that carries credit
    (fidem) - who was Otto? I take the estimate which the district administrator von Blomberg and the
    councillor of war zur Höllen drew up, by order of the Chamber and indeed of the King himself, in framing
    the dismemberment; as the [illegible] and this must amount to 316000 Rthl. For that, indemnification
    is to be demanded. The cash outlay at or from the [uncertain: Kaemen] can never be contested — and
    this must in the sequel either be reimbursed in cash, or else the estates be taken away from me by
    the [uncertain: Donna] - Monsieur Zerboni is of just this opinion - Your Serene Highness''s military
    talents I now often hear highly praised. It is said the King himself [text lost] Your Serene Highness,
    but nothing is done for you – the honest B. says you must have a secret enemy - It is needful to look
    into this - The warlike rumours are so manifold that one does not know what to make of them; now in
    Italy they are fighting with alternating fortune – the remaining preparations proceed very tediously
    and sluggishly - Lucian Bonaparte, who thinks very Jacobinically, has now also slipped away to Paris
    and through - It is believed that the Viceroy will swiftly follow him - then the whole clan together
    - In deepest reverence I remain


    Your Serene Highness''s. Of Eberhard I neither see nor hear anything — It is a damnable misfortune
    that the matter could not be settled by composition - the fund for the [uncertain: satisfaction] would
    have been found.


    Baron von Thieler said to me lately — the Prince is a worthy man, but his accursed debts; I believe
    people are therefore afraid to enter upon anything with the Prince.


    Vienna, the 19th of April 1815


    faithful and most obedient servant


    v. Triebenfeld'

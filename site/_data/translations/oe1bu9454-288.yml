- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    I look forward with longing to the arrival of Prince Adolph, all the more since enquiries have already
    been made after him. The Prince Chancellor has likewise promised to recommend the Prince to His Majesty
    in the best terms and to care for him


    in a fatherly way. My ardent wish is that the good Adolph should arrive here by the 22nd of this month
    at the very latest, for otherwise he risks having to travel after the King for 5 M God knows whither,
    and the question arises whether the reception would then be as good - and the fine opportunity would
    also be lost of being able to say a further word here into the Prince Chancellor''s ear about Cosmar''s
    knavery. It is, by God, enough to drive one to despair that the matter is being so drawn out - and
    that Stägemann simply will not make a report upon it. The promises are always most beautiful, but
    nothing further follows. All I want is that Cosmar be ordered to deposit all monies with the Brüger
    High Court of Appeal, and be compelled to render account. Then, that the powers of execution be taken
    from him and a chief supervisor be appointed - This is constantly promised and yet never done - Every
    one of these good people shakes his head and begins to doubt the much-praised benevolence of the E.
    Kan, for with a grain of good disposition it is impossible to set aside a just cause for 5 months
    and let the honest man be plundered onward by a rogue and a family be ruined. In the Polish, or properly
    in the Trąbczyn estates affair, I have applied directly to His Excellency Minister von Stein; a French
    letter from Your Serene Highness to the said Stein (which can be shown to the Emperor) will presumably
    have more effect than [uncertain: unternen] promises — I hope for a swift result.


    It is fateful that I have no tables of the Polish offices here - I shall therefore propose at a venture
    the office of Sokolnick and Klunowo beyond Wieruszow - only may God grant it succeed.


    Just now I receive Your Serene Highness''s most honoured letter together with the enclosures. The
    tableau by Otto I can put to no use whatever. It is a pity about the postage. Otto wished at that
    time to fish in troubled waters. He reckoned the value of Trąbczyn at only'

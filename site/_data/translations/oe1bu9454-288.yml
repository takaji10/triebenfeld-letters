status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! I await the arrival of Prince Adolph with longing, the
    more so as enquiry has already been made after him. The Prince Chancellor has likewise promised to
    recommend the Prince to H[is] M[ajesty] in the best terms and to care for him as a father. My fervent
    wish is that the good Adolph arrive here at the latest by the 22nd inst., for otherwise he risks having
    to travel after the King, 5 M[?], God knows whither, and the question arises whether the reception
    would then be so good — also the fine opportunity would be lost of being able to say something more
    into the Prince Chancellor''s ear here about Cosmar''s knavery. It is, by God, enough to drive one
    to despair that the matter is so put off — and that Stägemann will by no means make a report upon
    it. The promises are always most beautiful, but nothing further follows. All I want is that Cosmar
    be ordered to deposit all monies with the Bromberg Superior Provincial Court, and be held to render
    account. Then, that the Executoria be taken from him and a Chief Overseer be appointed — This is constantly
    promised and yet never done — Every one of the good people shakes his head and begins to doubt the
    vaunted benevolence of the E. Kan., for with a scruple of good disposition it is impossible to set
    aside a just cause for 5 months and to let the honest man be plundered by a rogue — henceforth — and
    a family be ruined. In the Pol[ish] matter, or properly in the affair of the Trąbczyn estates, I have
    addressed myself directly to His Exc[ellency] the M[inister] v[on] Stein; a French letter from Your
    Serene Highness to the said Stein (which can be shown to the Emperor) will presumably work more than
    [uncertain: unternen] promises — I hope for a swift result. It is fatal that I have no tables of the
    Pol[ish] offices here — I shall therefore propose, at hazard, the office of Sokolnick and Klunowo
    beyond Wieruszow — May God only let it succeed. This very moment I receive Your Serene Highness''s
    most honoured letter together with the enclosures; the tableau by Otto I can put to no use. It is
    a pity about the postage; Otto wished at that time to fish in troubled waters. He reckoned the value
    of Trąbczyn indeed only'
- page: 2
  en: '[uncertain: wilunver] Szetlewek at 160000 Rthl at most; what could then be demanded as compensation,
    once my 760000 Rthl of debts had been deducted? Moreover this is no instrument which has fidem — who
    was Otto? I take as the [illegible] the estimate which the Landrath v. Blomberg and the Councillor
    of War zur Höllen drew up by order of the Chamber and even of the King upon the framing of the dismemberment;
    and this must amount to 316000 Rthl. For that compensation is to be demanded. The cash outlay at,
    or from, the Kaemen could never be contested — and this must in the sequel either be reimbursed in
    cash, or the estates be taken from me [uncertain: der Donna] — Mons[ieur] Zerboni is precisely of
    that opinion — I now hear Your Serene Highness''s military talents frequently highly praised. It is
    said the King himself [uncertain: sich] Your Serene Highness, but nothing is done for [text lost]
    — the honest B. says you must have a secret enemy — It is needful to find this out — The warlike rumours
    are so manifold that one does not know what to think of them; in Italy they are fighting with alternating
    fortune — the remaining preparations go very tediously and draggingly — Lucian Bonaparte, who thinks
    very Jacobinically, has now likewise made his way to Paris and slipped through — It is believed that
    the Viceroy will swiftly follow him — for [uncertain: Brück] the whole clan together — In deepest
    reverence I remain Your Serene Highness''s. Of Eberhard I neither see nor hear anything — It is a
    damned misfortune that the matter could not be composed — the fund for the redemption would have been
    found. Herr B. v. Thieler said to me lately — the Prince is a worthy man, but his cursed debts; I
    believe that people are therefore afraid to enter upon anything with the Prince. Vienna, the 19th
    April 1815, most faithfully obedient servant v Triebenfeld'

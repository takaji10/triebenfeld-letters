- page: 1
  en: '288


    Most Serene Prince,


    Most gracious Lord!


    I look forward with longing to the arrival of Prince Adolph, the more so as enquiries have already
    been made after him. The Prince Chancellor has also promised to recommend the Prince to His Majesty
    in the best terms and to care for him as a father. My ardent wish is that the good Adolph should arrive
    here by the 22nd of this month at the very latest, for otherwise he risks having to travel after His
    Majesty the King God will where, and the question arises whether the reception would then be so good
    — the fine opportunity would also be lost of being able to say a further word here in the Prince Chancellor''s
    ear about Cosmar''s knavery — It is, by God, enough to drive one to despair that the matter is being
    put off in this way — and that Stägemann makes absolutely no report upon it — The promises are always
    most beautiful, but nothing further follows — All I want is that Cosmar be ordered to deposit all
    the moneys with the High Court of Appeal at Brzeg, and be held to render account. Then, that the writ
    of execution be taken from him and a chief supervisor appointed — This is constantly promised and
    yet nothing is done — Every one of these good people shakes his head and begins to doubt the much-praised
    benevolence of the Prince Chancellor, for with a scruple of good intention it is impossible to lay
    a just cause aside for 5 months and to let the honest man be plundered further by a rogue and a family
    be ruined. In the Polish, or properly in the Trąbczyn estates affair, I have applied directly to His
    Excellency the Minister von Stein; a French letter from Your Serene Highness to Mr von Stein / which
    could be shown to the Russian Emperor / will presumably work more than [uncertain: our] promises —
    I hope for a swift result.


    It is unfortunate that I have no tables of the Polish offices here — I shall therefore propose at
    hazard the office of Sokolnik and Klunowo beyond Wieruszów — Only let God grant success in that —
    I have just this moment received Your Serene Highness''s most honoured letter together with the enclosures;
    the tableau from Otto I can put to no use — It is a pity about the [uncertain: postage] — Otto wished
    at that time to fish in troubled waters. He reckoned the value of Trąbczyn indeed only'

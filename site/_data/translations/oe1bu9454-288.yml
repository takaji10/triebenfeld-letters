- page: 2
  en: '[uncertain: with and without] Szetlewek at 160000 Rthl at the most; what, my 760000 Rthl of debts
    having been brought into deduction, could then be demanded by way of compensation? Moreover this is
    no instrument that carries credit — who was Otto? I take the estimate which the district administrator
    von Blomberg and the councillor of war [uncertain: Busttollen], by order of the Chamber and indeed
    of the King himself, drew up when the dismemberment was being framed; for the [illegible], and this
    must amount to 316000 Rthl. It is for that sum that indemnification is to be demanded — The cash outlay
    at or from Kamionna can never be contested — and in due course this must either be reimbursed in cash,
    or [uncertain: they take from me] the estates — Monsieur Zerboni is of just the same opinion — I now
    often hear Your Serene Highness''s military talents highly praised. They say the King [uncertain:
    esteems] Your Serene Highness, but nothing is done for you — the honest B. says you must have a secret
    enemy — It is necessary to find this out — The warlike rumours are so manifold that one does not know
    what to think of them; in Italy they are now fighting with varying fortune — the remaining preparations
    go on very tediously and draggingly — Lucian Bonaparte, whose thinking is very Jacobin, has now also
    slipped away to Paris and through — It is believed that the Viceroy will quickly follow him — the
    [uncertain: bridge] the whole clan together — In deepest reverence I remain


    Your Serene Highness''s — of Eberhard I neither see nor hear anything — It is a damned misfortune
    that the matter could not be compounded — the fund for the discharge would have been found — Lieutenant
    Colonel von Thielen said to me lately: the Prince is a fine man, but those accursed debts of his —
    I believe people are therefore afraid to enter upon anything with the Prince —


    Vienna, the 19th of April


    1815


    faithful and most obedient servant


    v Triebenfeld'

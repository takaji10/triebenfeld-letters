- page: 2
  en: 'King Murat is making himself very loud in Italy, and has already pushed forward as far as Mantua
    — the Austrians are still holding up very well, and many troops are hastening thither to fight this
    monster – the [uncertain: Russians] seem to be stirring as well; they are obliged to march without
    a rest day, that is to say, they march for 3 days and on the 4th they are carried by waggon, which
    takes the place of the rest day - in short, from every side lords come hastening up. Bonaparte, for
    his part, is likewise forming a fearsome army – he draws all his troops together in and about Paris,
    heaps up great stores and magazines, and draws [uncertain: a chain] of entrenchments that would be
    hard to break through. - Meanwhile considerable scenes are said already to have occurred between the
    soldiers and the townspeople (the latter being much oppressed by the military), and this may yet become
    a motive by which the bloodiest war may be much softened.


    The business of the Kosten estates likewise causes much anxiety; one does not know at all where the
    matter is now to be taken hold of. - An equivalent proportionate to the matter must be given to Your
    Serene Highness — but who is to do it, and where is one to seek it? Everyone writes complaining of
    frightfully great labours, and calls this a bagatelle — [uncertain: I could go mad] that no creditor
    shall sink his claws into it; for that I vouch to you. You may in any case issue a mortgage upon me
    at Zagorowo; there everything stays with him, yes indeed.


    In deepest reverence I remain, until death,


    Your Serene Highness''s


    faithful and obedient servant


    Vienna, the 15th of April


    1815.


    v. Triebenfeld'

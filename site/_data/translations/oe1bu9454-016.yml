- page: 2
  en: 'The King — Murat is making a great noise in Italy, and has already pushed forward as far as Mantua
    — The Austrians are still holding up very well, and many troops are hastening thither to fight this
    monster — The Russians too appear to be bestirring themselves; they must march without a [uncertain:
    rest day], that is, they run for 3 days and on the 4th they are carried, which takes the place of
    the rest day — In short, from every side gentlemen are hurrying up — Bonaparte, on the other hand,
    is likewise forming a frightful army — he is drawing all his troops together into and about Paris,
    heaping up great stores and magazines, and drawing small [uncertain: lines] of entrenchments that
    are hard to break through. — Meanwhile, between the soldiers and the townspeople, the latter being
    much oppressed by the military, / considerable scenes are said already to have occurred, and this
    may yet become a motive whereby the bloodiest war can be much softened.


    The Kosten estates affair also causes much anxiety; one does not know at all where the matter is now
    to be taken hold of. — An equivalent suited to the matter must be given to Your Serene Highness —
    but who is to do it, and where is one to seek it? everything writes [illegible] about terribly great
    labours, and calls this a bagatelle — [uncertain: Unfäng] I should wish to become, that no creditor
    shall then strike his claws in; for that I stand surety to you — You may indeed now make out a mortgage
    upon Zagórów in my favour, and there everything remains to him. In deepest esteem I remain, until
    death,


    Your Serene Highness''s


    Vienna, the 15th of April


    1815.


    faithful and obedient servant


    von Triebenfeld'

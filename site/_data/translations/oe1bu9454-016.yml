- page: 1
  en: '16


    Most Serene Prince


    Most gracious Lord!


    The news, or the talk, about the monarchs'' departures from here changes like ebb and flood. One hour
    it is said that in 3 or 4 days everyone will be off — in the second, the departure is put off for
    weeks; thus for example it was said the day before yesterday — next Saturday the King of Prussia and
    the Russian Emperor go from here by way of Berlin to the army — today it is asserted that their departure
    is not to take place until the beginning of May, since Germany''s affairs have still first to be absolutely
    arranged. The enclosed Nota is a standard of what will happen. Not everyone is content with it; Harum
    in particular is an object of contention. I was meanwhile [uncertain: at pains] only to learn precisely
    whether the King too would still be here on the 20th, and consequently until Prince Adolph''s arrival,
    and so I went to Lieutenant-Colonel von Thiel. I made him acquainted with Your Serene Highness''s
    and the Prince''s resolution, and begged him to tell the Lang that Prince Adolph would be here on
    the 20th and would wish to be presented to His Majesty, where he would ask to be placed in the army.
    I described the Prince and his circumstances exactly, and wished to know whether he would still find
    the King here. Lieutenant-Colonel von Thiel charged me to commend him most respectfully to Your Serene
    Highness, and assured me that the King would certainly have great joy of it — He added: He is of good
    race, and if his brave father''s spirit is not upon him, then the King is now making an important
    acquisition — for the rest I can assure you that we shall not depart from here before the 22nd — With
    Prince Hardenberg I have not yet spoken, nor been able to lay this before him; but then this is not
    his business either — the military department and the civil are 2 heterogeneous things — I held it
    my duty to report this to Your Serene Highness. Your affairs, despite a thousand fine assurances,
    still lie in the mire, and share their fate with many'

- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    The reports, or rather the rumours, about the departures of the monarchs from here change like ebb
    and flood. One hour it is said that on ☽ [Monday] - in 4 days everything will depart - in the next
    one speaks of the departure as weeks away; thus it was said, for example, day before yesterday - next
    Saturday the King of Prussia and the [uncertain: Russian] Emperor go from here by way of Berlin to
    the army - today one is assured that [uncertain: this] is only to take place at the beginning of May,
    since the affairs of Germany must first be absolutely arranged. The enclosed note is a standard of
    what will happen. Not everyone is content with it; Harum in particular is an object of dispute. I
    was meanwhile [text uncertain] only to learn precisely whether the King too would still be here on
    the 20th, that is, until the arrival of Prince Adolph; therefore I went to the Lieutenant Colonel
    von Thiel. I made Your Serene Highness''s and the Prince''s resolution known to him, and begged him
    to tell the King that Prince Adolph would be here on the 20th, and would wish to be presented to His
    Majesty, whereupon he would ask to be placed in the army. I described the Prince and his circumstances
    precisely, and wished to know whether he would still find the King here. Baron von Thule charged me
    to commend him most reverentially to Your Serene Highness, and assured me that the King would certainly
    take great pleasure in it. He added: He is of good race, and if his brave father''s spirit is not
    upon him, then the King is now making an important purchase — for the rest I can assure you that we
    shall not depart from here before the 22nd. With Prince Hardenberg I have not yet spoken, and could
    not lay this before him; but then this is not his business either - the military department and the
    civil are 2 heterogeneous things. I held it my duty to report this to Your Serene Highness. Your affairs,
    for all the thousand fine assurances, still lie in the mire, and share their fate with many'

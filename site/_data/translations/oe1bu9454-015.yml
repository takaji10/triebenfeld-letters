- page: 2
  en: 'At bottom I now do not know how this is to end with me — up to the 24th of February I have paid
    lodging, [uncertain: board] and [uncertain: heating], which here is always done in advance, only [uncertain:
    still] 5 days and I run the risk of being thrown into the street. From Barbe I can borrow nothing
    more, he himself has nothing left, he looks upon my distress with a sorrowful countenance but cannot
    help — for 6 days I have [uncertain: kept to] my room and for 4 days I have been pressing if a sickbed,
    for I am truly ill — Dry bread and water are my nourishment. It has truly come very far with me —
    hitherto I have begged not to be left to sink into disgrace and mockery — now I beg no longer — Also
    God will preserve [uncertain: me], that I may not have to perform a sequel to Stössel. Since the letter
    of the 7th of February nothing has come in here from Your Serene Highness. Respectfully I remain as


    Your Serene Highness''s


    I lie very ill today,


    if you do not save me then I must go under.


    and do support my


    daughter —


    Vienna, the 19th of February


    1815


    most obedient servant


    v Triebenfeld'

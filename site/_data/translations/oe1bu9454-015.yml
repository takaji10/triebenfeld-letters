- page: 3
  en: 'Since the 7th of February I have received no letter from Your Serene Highness, and for 8 days I
    have lain very ill with [uncertain: creeping] fever and a bad throat — I am without any help whatever,
    I have neither money nor credit; may almighty God help me only this once. Barbe is the only one who
    visits me daily, but support me further he cannot — next to him I have yet one true friend, that is
    the Privy Councillor of State v. Beguelin, who again today promised the Prince Chancellor to press
    him until, in accordance with his promise / which he, Mr v Beguelin, only lately assured, to help
    Your Serene Highness entirely / he fulfils his word — and this very day too he will approach the Privy
    Councillor of State Stägemann to lay Your Serene Highness''s affairs before the Prince State Chancellor
    and to make an end of the matter. For the redemption of the papers I do not know where I am to get
    the money. In the end I shall yet die here of shame — To Barbe I have long owed 70 # — could he help
    me he certainly would; what I now need in medicine / for eat I cannot at all / he buys, and it comes
    hard to him; when he sees me lamenting over my situation, he is ashamed for fury, and then I must
    dissemble, so that this honest man may not become wholly mistrustful. In short, I suffer unspeakably,
    and if you do not save me, my Prince, for whom I suffer all this, quickly, your loss will be boundless
    — for Barbe avenges me — and should heaven dispose over me, he will also defend me afterwards — Provide
    therefore as speedily as possible for counsel — I beg it for the sake of God.


    to 19 February 1815'

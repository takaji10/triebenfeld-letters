- page: 1
  en: '15


    Most Serene Prince


    Most gracious Lord!


    The day before yesterday I was asked what the circumstances were regarding the 100,000 Rthl which
    Prince August demands; I answered that this is solely a legacy of the late Princess Sakkin, with which
    Prince August is to pay whatever debts there may be in the Hohenlohe lands. Today a letter goes off
    from the Prince State Chancellor to Öhringen, in which Prince August is informed that His Majesty
    has no objection to the delivery of the 100,000 Rthl, and that the Ministry of Justice, Kircheisen,
    has been directed to let this be done, provided no lawful objections stand against the matter, and
    to effect it as soon as possible. Your Serene Highness''s case still lies with the Privy Councillor
    of State Stägemann. He has as yet had no occasion to be able to lay a report upon it before His Serene
    Highness. Everything has been set in train in the most impeccable manner — According to the assurances
    of Barbe and others, the matter of the advance of 112,000 Rthl is to be regarded as entirely successful.
    Next to these, Cosmar''s removal is a principal object, and it has been resolved upon here; meanwhile
    this must be made known from Berlin.


    As concerns the Polish affairs, I am now to submit the instruments and the records transacted at Kalisz
    — that which falls or lies within the Grand Duchy of Poznań will not be difficult to obtain, whereas
    the Trąbczyn matter / which estates lie the Prosna / will be subject to great adversities. Fortunately
    I have the whole of the records here — but everything was transacted in Polish, and so everything
    must be translated and [uncertain: attested] by the sworn translator. The man demands 260 gulden for
    it — this I do not have and cannot redeem them — and so the matter will be delayed — It is in general
    very hard to act here without a Groschen; but with the Russians it is a work of impossibility.'

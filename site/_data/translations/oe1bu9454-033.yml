- page: 2
  en: 'back; through me or with my knowledge the matter there has in nothing changed, unless it be that
    your newly created and multiple general attorneys'' chancery has done so. – O God, most gracious Lord,
    do be cautious in issuing general powers of attorney and blank forms. Do not [uncertain: chide] me
    over this and do not imagine that I wished here to play the guardian; that thought will remain forever
    foreign to my heart. Only let this be permitted, that I advise you as a friend and faithful adherent.
    But the Chief Inspector Hecker writes to me that Honrichs, on the ground of the power of attorney
    given him, has reduced the price for the Hufen to be sold from 600 to 300 Rthl. Is that not enough
    to drive one mad and frantic? Do you then mean by force to put your fortune into rogues'' hands? O
    my most gracious Prince, that is not good – I too have let it become bitter as blood to bring matters
    so far; I have staked rest, health and everything on it, without in the rogues'' thought having had
    thereby a penny to gain. It was merely the pride of having rescued you out of all [uncertain: distressed]
    positions and especially out of the [uncertain: three] claws of the [uncertain: Weihnrer]. O, and
    now that is shattered again. I repeat it once more, that in silence I effect ten times more than the
    whole [uncertain: crowd] of your general attorneys. – Already I have obtained from the French authorities
    the order that in South Prussia, by military assistance, the arrears are to be [uncertain: collected]
    for Your Serene Highness. – A greater and far larger thing I hope to effect from another side (for
    which God will soon give fortune and opportunity). My wish is soon to be well, so as to be able to
    get away from here. I wish this the more ardently since the Minister von Stein does not appear to
    be my great patron, and since they are [uncertain: bent] on chicaning me here in your affair (for
    otherwise they cannot get at me).'

- page: 2
  en: 'back; through me, or with my knowledge, the matter there has not altered in anything, unless it
    be that your newly created and manifold general attorneys have made a chancellery of it — Ah, God,
    most gracious Lord, do be cautious with the granting of general powers of attorney and blank forms
    — Do not scold me over this, and do not imagine that I wished here to play the guardian; the thought
    will remain forever foreign to my heart. Only let this be permitted, that I advise you as a friend
    and faithful adherent. But the Chief Inspector Hecker writes to me that Honrichs, on the ground of
    the power of attorney given him, has reduced the price for the Hufen to be sold from 600 to 300 Rthl.
    Is that not enough to drive one mad and frantic on the spot? Will you then by force give your property
    into the hands of scoundrels? O my most gracious Prince, that is not good — I have let it cost me
    blood and sweat to bring matters so far; I have staked rest, health and everything upon it, having
    had in the scoundrels'' thoughts not a penny to gain thereby. It was merely the pride of having rescued
    you out of all your [uncertain: wretched] situations, and especially out of the claws of the Weihnrer.
    O, and now that is shattered again. I repeat it once more, that in quiet I accomplish 10 times more
    than the whole host of your general attorneys — already I have obtained from the French authorities
    the order that in South Prussia the arrears are to be collected for Your Serene Highness with military
    assistance — Something more, and far greater, I hope to effect from another quarter (for which God
    will soon give fortune and occasion). My wish is to be well again soon, so as to be able to get away
    from here. I wish this the more ardently as the Minister von Stein does not seem to be my great patron,
    and that [uncertain: persons] here are minded to vex me in your business (for otherwise they cannot
    get at me).'

- page: 3
  en: 'That peace of mind is wanting to you, my most gracious Prince and Lord, I readily believe. But
    this lot now befalls every honest man. Only S. rejoice — everything here on earth has indeed its beginning
    and its end. I know religion is not strange to you. Things have too often dazzling outsides; the ignorant
    man will throw out the brilliant among the heap [uncertain: which] nature makes only for a short time,
    thus casting it away; but one warming sunbeam annihilates their existence, and the brilliant remains.
    — Our misfortune is the want of unity, and the all-great goodness of heart of the King; the M. and
    the other hangers-on do what they please, they hate one another; in this alone are they united: to
    harm the honest man, to push him back, to make him suspect in the eyes of the world, to drive him
    out into the last corner of existence, and even though the state should go to ruin over it.


    To speak with Your Serene Highness I too wish most ardently — much would soon become clear to you.
    If you could really obtain there at least 150/m Rthl only, I would come in haste with the original
    mortgage and the original mortgage certificates — would cede the mortgage, and the business would
    be settled quick as lightning without any dispute. But upon a mere chance I cannot travel, for the
    misfortune that has struck me here has consumed my hitherto [uncertain: peasant] store, and I am blood-poor
    — from my estates I have nothing — there my poor little worms have scarcely enough to live on, and
    I remain faithful to my resolve: in this cursed [uncertain: council] to take nothing from the King
    nor from anybody whatever, nor to beg for it. Be pleased also to write very soon on this account;
    the answer I will still await. If you can obtain the money there in that manner, then I am there quickly
    — and cede, as aforesaid, the mortgage of 250/m Rthl. The money will then be assigned here or procured
    hither; every [illegible] paid must give a receipt at once, and the new credit has a clean, secure
    and all[illegible] mortgage, and so much must remain over that the [uncertain: legal] costs are paid.
    — perhaps more too, if you receive more than 150/m Rthl, so that your treasury may also be propped
    up. Now for weakness I can go no further — but eternally at Your Serene Highness''s the old Prince
    S — is to be as well as [illegible] wished to live the [illegible].


    Berlin, the 7th of April 1808.


    most faithful [uncertain: sustenance] [illegible]


    and humble and obedient servant


    v. Triebenfeld'

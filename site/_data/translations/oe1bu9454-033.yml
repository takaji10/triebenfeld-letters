- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, Your Serene Highness''s honoured letter of the 28th of last month I
    have just received, and I do not fail (although very [uncertain: ill] and weak) to effect it.


    The [uncertain: eight-writer] copy is not yet back, and for this reason I should also have laid aside
    the letter enclosed to Amelang; only thus have I never [illegible] it, for which I have to [uncertain:
    trouble] Your Serene Highness. There is a second brother which most highly wounds your credit and
    mine to the wall. I hope to obtain the money upon my plain countenance. Only I beg Your Serene Highness
    to demand back the bank order (Banko Acarnisung) from Eysenhardt at once; otherwise I should again
    be called upon by the bank, and then I should be totally ruined.


    [illegible] Serene Highness and my [uncertain: need] must now be to get the Gold together and to pay
    all the people – for that I had a prospect, that I should pledge the mortgage of 250 Rthl against
    it; but if Your Serene Highness has it there, so much the better. – As soon as a capital of 150 Rthl
    is procured, Your Serene Highness can buy 250/M and treasury notes for it, and then at once pay Oppenheimer,
    the principal [uncertain: Epratum], Eysenhardt, and God knows whom, and the Invalids'' Fund nevertheless
    receives the 50000 mk in Courant, for this must be satisfied in ringing gulden; it has not deceived
    you. But the other rogues, it does them no harm, and supposing that Madame Schlabrendorff too [uncertain:
    doubts] it, in this way you will be rid of your whole debts for the half, and no one can on that account
    make you a reproach for it; it is [uncertain: sayable]. I refer in everything to my letter sent off
    three days ago; there you will find the yield and the debts to be paid, so far as I know them. I [uncertain:
    refer] Your Serene Highness once more to the table which I gave you two years ago,'

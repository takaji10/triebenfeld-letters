- page: 1
  en: '33


    Most Serene Prince


    Most gracious Prince and Lord, Your Serene Highness''s glorious letter of the 28th of last month I
    have just received, and I do not fail (although very [uncertain: ailing] and weak) to effect it.


    The [uncertain: clerk] Kopey has not yet returned, and for this reason I had also laid aside the letter
    enclosed for Amelang — only thus have I never dispatched the same; for that I have Your Serene Highness
    to thank. There is a second brother which most highly wounds your credit and mine to the wall. I hope
    to obtain the money on my own plain face. Only I beg Your Serene Highness to demand the bank Acarnisung
    back from Eysenhardt at once; otherwise I should again be held to account by the bank, and then I
    should be totally ruined.


    cash Serene Highness, and my business must now be to get the money together and to pay all these people
    — I had prospects for that, that I should pledge the mortgage of 250/m Rthl against it; but have Your
    Serene Highness it there, so much the better. — As soon as a capital of 150/m Rthl is procured, Your
    Serene Highness can buy 250/m in treasury notes for it, and if at once pay Oppenheimer, Haugt, Ephraim,
    Eysenhardt and God knows whom, and the Invalids'' Fund still receives the 50000 Rthl in Courant, for
    this one must be satisfied in ringing coin; she has not deceived you. The other rogues, however, it
    does them no harm, and supposing it so, Madame Schlabrendorff doubts it too; in this manner you would
    be rid of your whole debts for half the sum, and nobody can reproach you over it — it is dangerous.
    In everything I refer to my letter dispatched 3 days ago; there you will find the yield and the debts
    to be paid, so far as I know them. I refer Your Serene Highness once more to the table which I gave
    you 2 years ago'

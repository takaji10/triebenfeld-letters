- page: 3
  en: 'That you, my most gracious Prince and Lord, lack peace of mind I readily believe. But this lot
    now falls upon every man of worth. Only [uncertain: S.] rejoice – everything here on earth has after
    all its beginning and its end. I know religion is not foreign to you. Things too often have dazzling
    exteriors; the ignorant man will cast the brilliant among the heap, throw out with the rest what nature
    makes only for short times; but one warming ray of sun annihilates their existence, and the [uncertain:
    brilliant] remains. – Our misfortune is the want of unity, and the all too great goodness of heart
    of the King; the [illegible] and the other allies do what they please, they hate one another; only
    in this are they agreed, to injure the man of worth, to push him back, to make him suspect in the
    eyes of the world, to [uncertain: drive] him into the last corner of existence, and though the State
    should go to ruin over it.


    To speak with Your Serene Highness I too very ardently wish. – Much would soon become clear to you.
    If you could really obtain there at least 150/0 of it, I should come in haste with the original mortgage
    and the original mortgage certificates – would cede the mortgage, and the business would be settled
    lightning-quick without any dispute. But I cannot travel on chance, for the misfortune that befell
    me here has consumed my hitherto [uncertain: peasant] store, and I am poor as blood – from my estates
    I have nothing – there my poor worms have scarcely enough to live on, and I remain true to my former
    resolve, in this cursed [uncertain: council] to take or to beg nothing from the King nor from anyone
    whatever. Be pleased to write very soon on this matter also; I will still await the answer. If you
    can obtain the Gold there in that way, then I am there quickly – cede, as aforesaid, the mortgage
    of 250 Rthl. The money will then be ordered here or paid, must be receipted at once and the new credit
    procured; every [uncertain: Weisern] has a clean secure mortgage, and so much must remain over that
    the [uncertain: Weise] costs are paid. – perhaps also more if you obtain more than 150/3 Rthl, so
    that your treasury too may be [uncertain: supported]. Now I cannot go on for weakness – but forever
    Your Serene Highness''s


    Berlin, the 7th of April 1808.


    most faithful [uncertain: Nahrungen veranfrau]


    and most humble and obedient servant


    v. Triebenfeld — the old [uncertain: Fenig] – should be as healthy as she would wish to live [uncertain:
    alone].'

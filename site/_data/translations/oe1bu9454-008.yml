- page: 1
  en: 'The very moment I sat down to write to Your Serene Highness, I received three letters all at once
    — one of the 8th, one of the 25th and the 27th of November. — The enclosed [uncertain: to be reported]
    of my poor children brought me almost to madness, and it is with a trembling hand that I write — Have
    mercy, then, and send the children 120 Rthl, and if I am to remain here much longer, a further 60
    Rthl per month. — The poor little worms must starve — I sacrifice myself here for you, I live on nothing
    but borrowed money, I lose sight of my own welfare and that of my children for your sake, and you
    are so merciless as to let the children suffer the direst want in spite of all my entreaties — Your
    affair now stands splendidly, even the [uncertain: Können] can already have credit, so do not let
    my children go hungry there — Like daggers are the lamentations of the abandoned children in my heart
    — My legs and limbs would fail me if I must [uncertain: leave] the cries of misery, and yet I am to
    labour for you, my Prince. Now one thing more — would it not be possible to obtain from the Courland
    representative a small written assurance that the matter is to be settled for 112/m Rthl. The Prince
    believes me, but we have powerful enemies — One [uncertain: Spreizt] force the weeks, over what has
    been done against the said, and had I not, through the aforesaid B., let it be known in the proper
    quarter that Mr [uncertain: z. M. v. Kirche] himself is to be regarded as the party, since he parades
    as chief guardian in the matter, then everything would have been sent to Berlin — Hahn will be greatly
    pleased; I shall write to him myself. Only take care, most gracious Lord, for my children there, —
    I shall take care of things here. [uncertain: Papinse] I do not need here now, for those are needed
    only there. Except a few words from the Courland representative —


    And so I receive the second letter from


    my poor daughter — Prince, help


    me, or the devil will take me.


    My children and I are going under in


    misery, and that for your sake.'

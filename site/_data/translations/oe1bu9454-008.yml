- page: 1
  en: 'The moment I sat down to write to Your Serene Highness I received all at once 3 letters – one of
    the 8th, one of the 25th and the 27th of November. – The enclosed, which brought [uncertain: to be
    placed under guardianship] my poor children, nearly drove me to madness, and it is with a trembling
    hand that I write – Have mercy and send the Lüder 120 Rthl, and if I remain here yet a long while,
    again 60 Rthl per month – the [uncertain: keepers] must [uncertain: to hang] – I sacrifice myself
    here for you, I live solely on borrowed money, I put my own welfare and my children''s out of sight
    for your sake, and you are so unmerciful as to let the children suffer the utmost want in spite of
    all my entreaties – Your affair now stands heavenly well, even those can now already have credit,
    so do not let my children go hungry there – Such [illegible] are only the laments of the abandoned
    children in my heart – Sinews and limbs would fail me if I must leave the cry of misery, and yet I
    am to work for you, my Prince, to work. Now one thing more — would it then not be possible to obtain
    from the Curz attorney a small written assurance that the matter is to be settled with 112000 dH.
    The Prince believes me, but we have powerful enemies – One sweats mightily these weeks over what has
    been done against the aforesaid opinion, and had I not, through the aforesaid B. – let it be known
    in the proper quarter that the said [uncertain: z. M.] von Kirchen is himself to be regarded as a
    party, because he parades in the matter as chief guardian, then everything would have been sent to
    Becke. Hahn will be very glad; I shall write to him myself. Only do you provide, most gracious Lord,
    for my children there – I shall provide well enough here. Papers I do not need here at present, for
    they are only needed there. Apart from a few words from the Courlandish attorney


    Thus I receive the 2nd letter from


    my poor daughter — Prince, help


    me, or the devil will take me


    My children and I are going under in


    misery, and that for your sake.'

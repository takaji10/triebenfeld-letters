status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! I have had here the justice-burgomaster Hawich
    from Zagorowo, who is appointed as actual Ducal Warsaw notarius publ:, together with the Chief Inspector
    Hecker, and with these men I have negotiated everything that tends to Your Serene Highness''s advantage,
    and have for that purpose issued the judicial special powers of attorney. I have furthermore, firstly,
    pressed for the instruction [Anweisung] of the Döbske concerning the Trąbczyn estates, and have given
    power of attorney and instruction for it. Secondly, I have given the power of attorney for the entire
    lifting of the sequestration, and drafted the introductory step, the more so since a 3-year general
    indult has been granted by the King of Saxony, and since in this matter everything turns upon the
    absolute payment of the interest; so I have, thirdly, given Hawich the power of attorney to collect
    the interest, and to pay the same, against receipt, to those creditors who already have judgments
    in force in their favour, but to deliver the remainder to Your Serene Highness. Also I have, [uncertain:
    fourthly], given a power of attorney to bring suit against the Jews Oppenheimer et Wolf in Kalisz,
    and at once to press for the cancellation of the several sums entered, amounting to over 72000 Rthl,
    in which regard a suit is also already [uncertain: pending] in Berlin; [uncertain: fifthly] I have
    issued a power of attorney that the fraudulent Honrichs, who had himself installed as sequestrator,
    be at once removed and compelled to lay his accounts ad Acta, that Hawich on the other side draw up
    the objections against him, and [text unclear: that he be pressed] for the restitution of the same
    as well as for the payment of the sums still outstanding from him. Likewise I have, [uncertain: sixthly],
    given a power of attorney to collect from Niedzewiecki the outstanding [uncertain: Hochta] sums and
    to apply for execution against the same. [uncertain: Seventhly] I have issued a power of attorney
    that all high-handed transactions and sales of the lands by Honrichs be forthwith annulled, and that
    the purchasers, if they do not submit to payment into the treasury, be evicted [exmittirt] with recourse
    against Honrichs, because he, without being authorised, has in part given the lands away for nothing,
    and has appropriated to himself in this manner a little estate of several Hufe, and has erected the
    buildings from the lordship''s timber and brick,'
- page: 2
  en: 'Eighthly, I have given power of attorney for the collection of all arrears of purchase-monies,
    which are very considerable. Ninthly, a power of attorney has been issued to compel the Olesnica hereditary
    leaseholders to pay the arrears of [uncertain: Linstands-] monies, inclusive of the canon, amounting
    to 32000 Rthl, or else to be [uncertain: evicted (German reads "committirt", i.e. committed; context
    requires "exmittirt", evicted)] with their following, so that the lands and buildings may be let out
    to others, far [text unclear]. Also, tenthly, a power of attorney has been given to Herr Hawich for
    the prosecution of all boundary suits, and the necessary instructions for it have been imparted to
    him. Eleventhly, Hawich has been given a power of attorney that he may appear in Your Serene Highness''s
    name at the Diet at Warsaw and in all places, in order to maintain the same''s rights of possession
    and property in their due force, the more so as every landed proprietor is now to appear in person,
    to reside upon his estates, or else to forfeit his possessions. Twelfthly, I have besides this given
    Herr Hawich, on my own part, a power of attorney together with the original decrees of the French
    General Government, in order to recover the interest advanced by me to the Invalids'' Fund together
    with costs, and to deliver the same to Your Serene Highness towards the covering of the Larisch sum.
    Thirteenthly, and finally, yet another power of attorney has been drawn up for Hawich, to recover
    from the Niedzewiecki heirs the still outstanding [uncertain: Tobkanſts-] monies for several years''
    canon, which amount to more than 10000 Rthl, and to refute the unjust claims formerly framed by the
    deceased. I have had all this taken down judicially by the justice-burgomaster Schenk of Neusatz,
    in order to begin this new career right brilliantly; and since, by virtue of the bonds of 250000 Rtℓ.,
    I have a right before all creditors to have a word to say, I think this must surely make an impression
    and bring about the wished-for outcome. In the meantime, however, Your Serene Highness shall, according
    to my arrangement, faithfully receive from time to time the reports upon the progress of the affair.
    In deepest reverence I remain, until death, Your Most Serene Highness''s faithful and most obedient
    servant v Triebenfeld'

- page: 2
  en: 'remaining half of 25000 Rthl – of a bond for the latter payment he would hear absolutely nothing,
    nor did he venture to make any proposal to that end, inasmuch as he professes to be positively convinced
    that the Countess would never enter into such a thing. Your Right Honourable will see from these utterances
    the pressure of circumstances, and it therefore remains very good that you should be informed of them.
    Nurlich departed early today with the wild boar for the government councillor von Kreczinski, by way
    of Kalisz to Trąbczyn. I commend myself humbly to your further favour, and have the honour to be,
    with the most perfect veneration,


    Your Right Honourable''s


    Breslau, the 16th of January


    1805.


    humble and obedient servant


    A: Hahn'

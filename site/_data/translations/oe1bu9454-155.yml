- page: 2
  en: 'remaining half of 25/m Rthl — of an obligation for the latter payment he would hear nothing whatever,
    nor did he venture to make any proposal to that effect, inasmuch as he will have it that he is positively
    convinced the countess would never enter into such a thing. Your Right Honourable will see from these
    utterances the pressure of circumstances, and it is therefore very well that you should be informed
    of it. Nurlich set out early today with the wild boar for the government councillor von Hussaczinski[uncertain:
    Hussaczinski] by way of Kalisz to Trąbczyn. I commend myself most humbly to your continued favour,
    and have the honour to be, with the most perfect veneration,


    Your Right Honourable''s


    Wrocław, the 16th of January


    1805.


    humble and obedient servant


    A: Hahn'

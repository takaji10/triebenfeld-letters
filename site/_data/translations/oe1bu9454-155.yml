- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! To Your Right Honourable
    I report, by command of His Serene Highness the Prince: that I was today in person with the Chancellor
    Hohmuth concerning the Schlaberndorff payment, and spoke with him about a longer term. The result
    of this conversation was not very consoling. He told me that the Countess could be held back from
    taking up the suit again only by a speedy payment, made before the next Berlin post-day, since she
    has been not a little provoked by the delay hitherto. Should this be done soon, with 25000


    Thl., then he would prevail upon the Countess to wait some further time for the'

  en: '155


    Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! To Your Right Honourable
    I report, by command of His Serene Highness the Prince: that I was today in person with the Chancellor
    Hohmuth concerning the Schlabrendorff payment, and spoke with you regarding a longer deadline. The
    result of this conversation was not very comforting. He told me that the countess could be held back
    from taking up the suit again only by a speedy payment, made before the next Berlin post day, since
    she is not a little provoked by the delay hitherto. Should this be done soon, with 25/m Rthl, then
    he would prevail upon the countess to wait yet some time for the'

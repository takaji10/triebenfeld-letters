- page: 1
  en: '90


    Most Serene Prince,


    Most gracious Lord!


    Now the matter is at stake — now the fight is great — I hope to God that we shall win — But I have
    come to know men — What Your Most Serene Highness says in a most [uncertain: a most Your] letter to
    Glenck — that if the certain person does not now act indirectly, then he will be the one to have the
    joy of it, should the matter be counteracted. It may well be so; only, as I have said, God will help
    — It is truly dreadful how things go here.


    The Monarch is good — only the Mini— o God, the poor country! — But it will grow better. Only now
    one must take care — or — it is all over. The 7,000 Rthl which the Princess Sacken will by no means
    [uncertain: through none-wise] put up, I would negotiate in my own name, and pledge all my goods,
    so that so good a cause should not be seen to slip away — I remain, until death, Your Most Serene
    Highness''s. I give everything, [uncertain: because/if] it be required, and if I have nothing more,
    the good Your Serene mine bread in Ingelfingen, — O what villains there are here — and in Wrocław.
    Berlin, the 14th of December 1798.


    faithful and most humble bondsman


    v Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Now the matter is in earnest — now the struggle is great — I hope to God that we shall be victorious
    — But I have come to know men — What Your Most Serene Highness say most highly in your letter to Glenck
    — that if the certain person is not now acting indirectly, then he is the one who would take pleasure
    in it were the matter to be thwarted.


    It may well be so; all the same, as I said, God will help — It is truly dreadful how things go here.


    The monarch is good — only the mini— O God, the poor country! — But it will become better; only now
    one must take care — or — it is all over. The 7000 Rthl which the Princess Sacken by no means wishes
    to advance here, I would negotiate in my own name, and pledge all my goods thereto, so that so good
    a matter may not be seen to slip away — I remain, until death, Your Most Serene Highness''s. I give
    everything, in so far as it be required, and then I have nothing more than the good bread [uncertain:
    from Your Serene Highness] in Ingelfingen — O what wicked judges there are here.


    to Breslau


    Berlin, the 14th of December 1798.


    faithful and most humble bondsman v. Triebenfeld'

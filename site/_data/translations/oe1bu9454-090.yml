- page: 1
  en: Most Serene Prince, Most gracious Lord! Now the matter is in earnest — now the struggle is great
    — I hope to God that we shall prevail — But I have come to know men — What Your Most Serene Highness
    a most Your letter to Glenck says — that if the certain person do not now act indirectly, then he
    is the one who would have joy of it, from which the matter would be thwarted. It may well be so; all
    the same, as I have said, God will help — It is truly dreadful how things go here. The Monarch is
    good — only the Mini— O God, the poor country! — But it will grow better; only now one must take care
    — or — it is all over. The 7000 Rthl which the Princess Sacken will by no means advance here, I would
    negotiate in my own name, and pawn all my goods thereto, so that so good a cause be not let slip —
    I remain, until death, Your Most Serene Highness's; I give up everything, however it be required,
    and then I have nothing more than the good Your Sere[ne] my bread in Ingelfingen, — O what wicked
    judges there are here. ad in Breslau. Berlin, the 14th of Xbr 1798. faithful and most humble servant
    v Triebenfeld

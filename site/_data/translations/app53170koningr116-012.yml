- page: 1
  en: 'The Right Honourable Chełmski Requisitioned the Field Commissorial Decree


    Coming in person before the present Municipal Court and Records of Konin, the Right Honourable Stanisław
    Ścibor Chełmski, heir of the goods of Łukom with its appurtenances, requisitioned and requested from
    the present Office that there be issued to him a certain Field Commissorial Decree — issued between
    the heirs of the villages of Nowawieś, Łazy, Osiny, Trąbczyn, Łukom, and others named in the same
    Decree, by virtue of the Commission issued by the Estates of the Republic of Poland by the Constitution
    of the Year 1775, and subscribed by the Most Illustrious Right Honourable Commissioners on behalf
    of the Right Honourable Prusimski, Starost of Niszczewice — as if submitted in the manner of an Oblata,
    findable among the records of the Office. The same Office, consenting to this Requisition, was willing
    to issue the said claimed Decree; but since within the required period it is not found in the Records,
    it therefore cannot issue it as irretrievable, and makes public attestation [...] regarding the Requisition.


    Stanisław Ścibor Chełmski, by his own hand'

- page: 1
  en: (To His Most Serene Highness) The Countess Schlabrendorff will wait for the 50000 Rthl until Christmas,
    or properly speaking until the 1st of January 1805; Homuth has not been able to move her to a longer
    term. She made a very piteous business of it, that she must lose so much, in order to Since she would
    receive no interest on this capital, the loss would be still greater were she to wait longer than
    to the 1st of January 1805 — If it be so that Your Serene Highness need pay no interest until then,
    I believe it will be easy to rest content with this term. There are, after all, 2500 Rthl gained thereby,
    and by that time money enough will come in – Homuth begs for the agreement, so that he may draw up
    what is needful and send it to the Countess for execution. He will try whether he can on this occasion
    get the old bills of exchange out. The Conducteur Cabanis has departed. He will hire himself a peasant's
    conveyance out in the country, which he believes he can obtain for 4 or 5 Rthl. Here the hired coachmen
    would have 20 Rthl and demanded besides for fodder and God will be something of an assistance v Triebenfeld
    Breslau[illegible] the 29th of March 180

segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I have been here in Berlin since yesterday and have already ferreted through everywhere that sources
    of comfort were to [uncertain: flow]. Unhappily, however, I find nothing but puddles from which nothing
    but swindling and malice wells up - All the prospects and views painted here are [uncertain: plain]
    lies - Your Most Serene Highness would, had I not come here, have been taken in for good and all.
    - For from here there was not a heller to be counted upon.


    Matters now stand thus - Tomorrow evening, that is on the 20th, I go back to Frankfurt an der Oder
    and, if everything else remains as it is, shall conclude with Leixner regarding Kaemen and secure
    the moneys that are needed on account of Koschentin, and were I to have to pledge my very salvation
    along with it. Here I shall arrange everything in such a way that Your Serene Highness obtains Koltzig
    or the loan. But more hope is given as to the estates, because the King has no inclination to give
    money away / for Russia absolutely wants war / Matters stand here so strangely that every honest man
    shakes his head. Meanwhile more than everything can be managed'

- page: 1
  en: '131


    Most Serene Prince


    Most gracious Prince and Lord!


    I have been here in Berlin since yesterday and have already searched out everything where springs
    of comfort were supposed to flow. Unhappily, however, I find nothing but puddles, out of which swindling
    and malice well up — All the prospects and views painted here are devilish lies — Your Most Serene
    Highness would, had I not come here, have been taken in for ever. — For from here there was not a
    heller to be counted upon.


    Things now stand thus — Tomorrow evening / that is, the 20th / I go back to Frankfurt an der Oder
    and conclude, if everything else remains as it is, with Leixner concerning Kamionna, and secure the
    monies needful on account of Koszęcin, though I should have to pledge my salvation along with it.
    Here I shall set everything in train so that Your Serene Highness obtains Koltzig or the loan. More
    hope, however, is given for the estates, since the King has no inclination to give money away / for
    Russia absolutely wants war /. Matters stand here so strangely that every honest man shakes his head.
    Meanwhile more than everything can be contrived'

- page: 2
  en: 'As to the Broniewski affair, matters have come so far that, if the causae arresti are proven, the
    arrest is to be accepted — In this matter too as good as nothing has been done, notwithstanding how
    highly the thing is cried up — Upon the causae arresti it cannot [be done] without 2000 Rthl in Friedrich
    d''or — had Mell[uncertain: itz] and Glenck long since called this by its right name, then this would
    long since have been decided and known without all the business. The post is about to go; I shall
    faithfully settle everything for the best, which is averred by


    Your Most Serene Highness''s


    Berlin, the 19th of May


    1804.


    most faithful servant


    v Triebenfeld'

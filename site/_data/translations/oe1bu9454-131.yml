- page: 2
  en: 'As regards the Broniewski affair, matters have advanced so far that, if the grounds of arrest (causae
    arresti) are demonstrated, the levying of the arrest is to be granted - In this matter too as good
    as nothing has been done, notwithstanding that the business is so highly praised. As to the grounds
    of arrest, it cannot be had without 2000 Rthl in friedrichs d''or - had Mell: and Glenck long since
    called this thing by its right name, the whole affair would long since have been settled and done
    with, without all this history. The post is about to leave; I shall faithfully and to the best advantage
    carry everything through - this is affirmed by


    Your Most Serene Highness''s


    Berlin, the 19th of May


    1804.


    faithful servant


    v. Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! His Serene Highness the Prince State Chancellor
    has today already for the 5th day been keeping to his room and bed. If anyone prays to God in silence
    for the preservation of this man, then truly I [uncertain: am] he. Not only that the whole machine
    would come to a standstill, but Your Serene Highness''s affairs would be left lying half-way. At present
    everything still stands very well – the Prince H. wishes Your Serene Highness to be helped; may God
    indeed preserve him – the labours of the gentleman are exorbitant, and notwithstanding this he has
    written up Your Serene Highness''s matters, so far as I submitted them, entirely by himself. A true
    proof that he means to help. The Prince has further required a report, but from whence I do not know;
    only Minister Humboldt seems to know more, yet says nothing further than that we had already [uncertain:
    won our] game – Court Councillor Hahn''s opinion has also had effect, because everything I have said
    is confirmed thereby. I hope with [uncertain: firmest] trust in God that Your Serene Highness, through
    the help of the exalted Prince Hardenberg, will yet enjoy a very tranquil and happy old age. Concerning
    Your Serene Highness''s military affairs, one is now entirely silent; B. however says this is reserved
    and laid aside until Berlin – well and good, for there the helpers are more numerous. For the present
    everything depends solely upon this, that the Curian matter be brought to an end, that Your Serene
    Highness be rid of this hideous business, that Cosmar be overthrown, and that you attain as actual
    lord of the entailed estate to the possession of the properties, and need no longer live there upon
    the mercy of your servants. Everything else will then follow of itself. Just now B. could [text lost]
    and brings me the news that His Majesty the King'
- page: 2
  en: 'and everything that is Prussian, but the [uncertain: Dt.] departs from here to Berlin – the Emperor.
    All the rest follows with everything belonging to his court thither on the 10th, and at the same time
    all the other sovereigns and other high personages; then the worthy Emperor Franz too sets out on
    his way thither, and presumably this will last through the Carnival. To Your Serene Highness I shall
    now write no further. May you also be pleased to send no further letters to me, for on the 11th of
    M[arch?] I think to lay myself personally at your most exalted feet. In deepest reverence I remain
    Your Serene Highness''s Vienna, the 30th of November 1814. most faithfully obedient servant v Triebenfeld'

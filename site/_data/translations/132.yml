status: draft
segments:
- page: 1
  en: 'My dearest Friend, I am at this very moment about to step into the carriage and return to Breslau.
    It was enough to drive me mad, to sit here so long [uncertain: sezziauf] waiting upon Mr. Glenck,
    and in the end to accomplish nothing. The result is always that people fish in troubled waters and
    mean to make barbarous gains at the Prince''s expense. At Betsche the people have, in so short a time,
    gained thirty thousand [uncertain: rung] without having needed to trouble themselves in the least.
    The subjects merely buy their freedom and give 30000 mk more than the purchasers gave. Meanwhile the
    latter profit by this sum. Spoiled by this business, at Kaemen there was to be gained still more than
    the like of this, and yet God knows what screws are then to be applied to the Prince — this I cannot
    intervene in, and I therefore depart with my errand unaccomplished. — Now, my dear Friend, do you
    only see to it that Mr. Director Stubenrauch buys the estates and provides the money. — I will stand
    surety to the man for a clear and perpetual revenue of 10000 Rthl yearly, if I may dismember the estates
    — this would amount, reckoned at 5 per cent, to a capital of 200000 Rthl. But since Mr. G. has been
    assured that the Order''s capital is content if'
- page: 2
  en: 'it has 4 per cent clear interest from its capitals, then one might set the value of the estates
    at 250000 Rthl. But now the Prince, since he has need of money, would be very well content with 180000
    Rthl, consequently the Chapter would gain 70000 Rthl in cash upon this purchase. You might further
    urge this, that the Chapter, or the Order''s Chamber, should, if still more were to be brought out,
    give a tantième proportionate to the matter. In case Mr. Director Stubenrauch will enter into this,
    have the kindness to send me an express courier; I shall then hasten back at once to Berlin, conclude,
    and furnish the [uncertain: Evection — probably Execution, i.e. carry out the execution of the contract].
    Had I known the business sooner as it stands, all would already have been in order, and much might
    have been gained thereby. But as it is, one always learns everything too late. Mr. Gleich has all
    along reckoned upon a purchase money of 500 Rthl per Hube, which the people were to pay — In this
    regard [text lost] he to assume a light hereditary quit-rent of 10 to 12 st per Hufe, and the value
    of the estates was diminished; but if I now take no entry money, then the subject willingly pays 50
    Rthl per Hufe yearly. By this means there now comes out an enormously high value, so that I, besides
    the old interest and for beer and brandy excise, [have] a perpetual'
- page: 3
  en: '[uncertain: standing] [uncertain: association] of 12000 Rthl, and consequently a value at 4 pl.
    of 300000 Rthl, am in a position to bring out; according to which the Order''s Chamber would profit
    by 120000. Take this to heart, and seek to move the worthy good man, the Chamber Director Stubenrauch,
    to make the purchase and to provide the moneys for it by Midsummer of this year. In the matter of
    the Koltzig estates, or in the indemnification business, seek to effect the best that may be; but
    do go warily with the Herr Cabinets-Rath, for at present I fear this man extraordinarily. With the
    most faithful heart and the greatest attachment I am unceasingly your Franckfurth a d h., the 23 May
    1804. most faithfully devoted servant v Triebenfeld'

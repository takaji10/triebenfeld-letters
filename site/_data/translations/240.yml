status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! It is quite certain, and proved to the highest
    degree of evidence, that Austria will not join in the fighting; she means to remain neutral and to
    act as mediator, that is to say, to fish in troubled waters and to do nothing further beyond that
    – to the people the advantages of this are painted in such glowing colours that they are already so
    wearied in their zeal by it. The saddest thing, and for us the most fraught with danger, is that the
    Russian troops are grumbling very much, and even the generals curse the armistice; one would rather
    fall back as far as the Vistula. Our situation is now very critical. The Lieutenant-General von [uncertain:
    Koch / Köckritz] has fallen out very severely with the Minister Hardenberg; the Minister asks His
    Excellency von K. in the presence of the Monarch. – Are you not glad that everything is going so well?
    K.: About what! Min.: Well now, everything stands very well, the proud Nap: has begged for the armistice,
    must – K.: Sir! I should have to have run out of the madhouse, if I were to rejoice at that – So much
    innocent blood has been shed in vain – we run as far as the Oder, we give up Saxony and our own lands
    piecemeal, [uncertain: Brönen] then the matter, we conclude an armistice for 6 weeks, we withdraw
    our troops, which held the most advantageous position, we give N. time to procure [uncertain: Sontien]
    for himself, and now we let ourselves [uncertain: be driven / hesitate] to behind the Vistula, and
    our lands be totally ruined. No, it is out of the madhouse that the man must have escaped who rejoices
    over all these events. – H.: Now then, do it better – K.: I cannot out-shout the clever gentlemen.
    H.: Ah, Your Excellency sees everything black – Everything stands very well nonetheless, and we shall
    certainly obtain a very advantageous peace.'
- page: 2
  en: I have indeed heard the former said again here. Would to God that Prince Hohenlohe stood at the
    head; then things would surely go better. – How matters will stand with the provisioning hereafter
    is a problem – the Russians will have nothing to do with it, and demand impetuously to be provisioned.
    Now there is not much grain left in the land – the roads are bottomless and already lie covered with
    dead horses, the green fodder brings the pestilence among them; God alone knows how this is to end.
    General Zastrow is again very well liked; he is to command the Landwehr, which is now being assembled
    at Neiss, and consists of 55000 men. Lieutenant-General Ortell lies here in Neustadt very ill of a
    nasty fever and meddles now in nothing; I therefore go from here tomorrow by way of Neisse to Frankenstein,
    from there to the head quarters, then to Schwierin, to see whether I can bring in the produce and
    procure money for myself — from that side I shall not write again until later. Reverently I remain,
    as Your Most Serene Highness's Neustadt, the 20th of June 1813. most humble and obedient servant v
    Triebenfeld

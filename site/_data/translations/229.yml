status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! On this important day, which is a brother of
    that one on which You beheld the light of the world, and which will remain the jewel among the lesser
    of its successors, I cannot lay myself personally at Your Most Serene Highness's feet and present
    my faithful and sincere wishes. I can do it only still in writing, but let it be just as heartfelt
    — God grant Your Most Serene Highness to live to see at least 50 more days of this kind; may He bestow
    upon Your Highness the most enduring health, true fortune, contentment, may He shower Your Highness
    with every blessing, and may He, just as Your Serene Highness truly deserves, cause all grief and
    cares from now on to become strangers to You, most gracious Prince. These are the substance of my
    most faithful wish upon this important day. — For the rest, the Attorney General Count Lipski, the
    Tribunal President Smogorzewski, the Tribunal Councillor Rembowski, the Tribunal Councillor Michalski,
    and the Tribunal Councillor Sobocki most humbly thank Your Most Serene Highness for the fine game.
    The effect will show itself shortly upon the decision of the Olesnice and Wrąbczyn matter. With the
    sub-prefect Brzechsta I have concluded, sub spe rati, the lease contract for the Zagorow estates alone,
    at 20000 Rthl. On the 8th of February I intend to arrive with him at Schlawenschitz, where the contract
    can then be concluded by Your Serene Highness
- page: 2
  en: itself in forma probante. Whatever Herr von Brzechsta may be able to gather together in ready money
    in haste will be brought along. At present the daily new taxes still carry off far too much. All interest
    payments are secured, and there still remain to Your Serene Highness several thousand d annually over
    and above; the Bayonne capital will also be entirely amortised. In the meantime, as concerns the ready
    money, only the gain from the two lawsuits named overleaf will first bring true [text lost] . The
    documents sent to me were submitted to the authority the day before yesterday — every dispute is not
    only removed, but there might perhaps accrue to Your Serene Highness the benefit that the taxes pro
    futuro would be mitigated. It might come to a sacrifice, which Herr von Brzechsta will advance should
    it be required. For the rest, Your Serene Highness will receive the original documents back after
    the use made of them. The Parobeck follows, and if it succeeds, we shall bring an even bigger dog
    along. In deepest reverence I remain, until death, Your Most Serene Highness's Blizanow, the 27th
    of January 1812 faithful, most humble and obedient servant v Triebenfeld

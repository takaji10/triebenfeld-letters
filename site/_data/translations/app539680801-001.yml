- page: 3
  en: 'of Infantry, chief of a regiment, Governor of the town and fortress of Wrocław and Knight of the
    Great Black and Red Eagle Orders etc., Mr Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, drew
    up before us and with our assistance the foregoing general power of attorney directed to the Royal
    Councillor of War and Forests Mr von Triebenfeld, acknowledged its literal content throughout, and
    then, after His Highness had once more perused and approved the same beforehand, subscribed and sealed
    it in his own hand in our presence: this is hereby attested testante Protocollo de hodierno in fidem
    publicam. Thus done in the Górzyce justice office near Wrocław, the 19th of February 1805.


    Baronial von Stillfried Justice Office of Górzyce.


    L. S.


    Koeppen, Justiciary


    Koleschke, Actuary


    That the foregoing copy agrees word for word with the original power of attorney is hereby credibly
    attested.


    Mariantów, the 21st of March 1806.


    Princely Hohenlohe Patrimonial Court at Trąbczyn.


    L. S. Schenck.'

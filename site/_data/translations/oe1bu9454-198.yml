- page: 2
  en: 'Smidkowski was in Warsaw with Kramplitz — the Dąbska threw herself at the feet of the King, who
    was there at the time, on account of Tropiren, but she was dismissed with her petition. So that arrow
    too has been loosed without reaching its mark. Kramplitz, who came back 4 days ago, goes about very
    sorrowfully with this tenant Smid — The King''s resolution is in a threatening style. I hope my two
    spirits Lubinski and Woyda have brought this about.


    6. My own affairs are arranged — Richter arrived here from Berlin only the day before yesterday. Kösteritz
    has conducted himself exceedingly well and courteously, so too Tismar and everyone — I am entirely
    satisfied — Köckritz writes that he would himself forward all the Colonna papers to Your Serene Highness
    — He heartily wishes that something at least might be effected.


    Concerning Your Serene Highness''s own affairs he keeps entirely silent. Only to Richter, with whom
    he chatted a full 2 hours, notwithstanding that some 20 officers and other people were waiting on
    him — to him he said: if only the devil would carry off the old business — with the Prince it would
    then be doubly well. He wrote at once to the councillor Sanen[?] that he should be easy concerning
    the Invalids'' interest — he promises to report the effect to me shortly. He said to Richter in these
    words — Your master has much honest joy and many enviers on good ground, but the King knows what a
    man he is — Tismar writes / that a certain man also wanted one for himself alone, the King answered
    nothing — I suspect Reibnitz'

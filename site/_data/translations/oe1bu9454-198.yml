- page: 3
  en: 'or Rückel, Reibnitz''s protector — Whereupon the King said: people are always pecking at Triebenfeld,
    he is certainly an honest fellow. Köckritz answered: of that I am convinced; I believe that if a man
    were satisfied and set in the right place, he would fetch us the devil out of hell — so Baron von
    Rhaden also writes to me — likewise a man of the old stamp and fibre — In the so-called wind-blustering
    there must, then, be not quite so much truth after all.


    Be it as it may, however, and let each man permit himself to say whatever he pleases for his amusement,
    I am content and wish nothing further than to make the acquaintance, for once, of such a windhound;
    him my pistols shall waken truly frightfully — for on account of the Colonna matter I must pass through
    hellish stirrup-leathers. Köckritz himself writes to Tesmar: I pity the honest soul, and wish most
    heartily that something at least may come of it, for the daredevil has poked into a hornets'' nest
    and provoked the B against himself — God grant him fortune — Hardenberg is coming, as Köckritz writes,
    into full activity, and will arrange the matter of the debts — Tesmar writes this too, and names him
    as Prime Minister in the same quality as he was at Bartenstein; this is said to be with Bonaparte''s
    approval /O God/. Of Zastrow nothing will now come; to Hardenberg his death is peace — Massow would
    already be styled minister, only Dohna has hitherto prevented it — from Rhoden Your Serene Highness
    will doubtless already have full intelligence concerning the 35000 Rthl., and be reassured.


    Grevenitz must have written to Your Serene Highness as well. He will certainly be vigilant and mindful
    of Your Highness''s advantage. The old lady was, as Köckritz writes to me, very ill, but has recovered
    again; yet her length of life is doubted — In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Two divisions are marching from us against the


    Turks — who will command them?


    Tomorrow I hasten to Konotop; on the 12th I go on to Streiten and from there to Poland. Kąntwicz[?]


    8th June 1810.


    most faithful servant


    v Triebenfeld'

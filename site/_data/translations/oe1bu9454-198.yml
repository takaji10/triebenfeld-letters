- page: 2
  en: 'Smidkowski has been in Warsaw with Kramplitz — Dąbska threw herself at the feet of the King, who
    was there at the time, on account of Trąbczyn, but she has been refused in her petition. So that arrow
    too has been loosed without reaching its mark. Kramplitz, who came back 4 days ago, goes about very
    sorrowfully with this tenant Smid[kowski] — The King''s resolution is in a threatening style — I hope
    that my two spirits, Lubinski and Woyda, brought this about —


    6. My own affairs are arranged — Richter arrived here from Berlin only the day before yesterday —
    Köckritz has conducted himself exceedingly handsomely and obligingly, and so has Tesmar, and everyone
    — I am perfectly satisfied — Köckritz writes that he would send all the Colonna papers himself to
    Your Serene Highness — He wishes most heartily that something at least might be effected.


    Upon Your Serene Highness''s own affairs he is wholly silent. Only to Richter, with whom he chatted
    a full 2 hours, notwithstanding that some 20 officers and other persons were waiting upon him — to
    him he said: if only the devil would carry off the old business; with the Prince things would then
    be doubly well. To the Privy Councillor Sa[illegible] he wrote at once that he should be easy concerning
    the Invalids'' interest — he promises to report the effect to me very shortly. He said to Richter
    in these words: Your master has much joy and many enviers, but the King knows that he is a thoroughly
    honest man — Tesmar writes / that a certain man also wanted to [uncertain: hook something in], but
    that the King answered nothing — I suspect Reibnitz'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness''s affairs in Poland, whence I returned the day before yesterday, are ordered
    in the best way.


    1. Your Serene Highness will get Trąbczyn back by Michaelmas at the latest


    2. The sequestration is entirely lifted


    3. The accounts of Honrichs and of Frankiewitz, for both of whom the sub-prefect Brzechsta has stood
    guarantor, are now being audited by the calculator Schneider appointed by the Prefecture. Hecker must
    prove his statements together with Hawich regarding the 11700 Rthl defrauded, and if Honrichs, Frankiewicz
    / this is an official of Brzechsta whom I have never seen / together with Badinski are convicted,
    then Brzechsta must pay, should the property of those men not suffice — Meanwhile I have


    4. Conceded that Hecker may be appointed as administrator — He is liable for everything — will also
    furnish that guarantee to Weigel — the commission of inquiry takes its beginning on the 12th of this
    month and will probably last several days, for Hecker can appear at once when he is required for the
    Weigel matter.


    Trąbczyn offers glad prospects, for the tenant Smidkowski is paying several thousand at once merely
    in order to remain in the estates.'

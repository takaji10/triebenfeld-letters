- page: 1
  en: '198


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness''s affairs in Poland, whence I returned the day before yesterday, are arranged
    in the best manner.


    1. Trąbczyn Your Serene Highness will have back by Michaelmas at the latest —


    2. The sequestration is entirely lifted


    3. The accounts of Honrichs and of Frankiewitz, for both of which the sub-prefect Brzechffa has given
    his guarantee, are now being reviewed by the calculator Schneider appointed by the Prefecture. Hecker
    must, together with Hawich, prove his statements concerning the 11700 Rthl embezzled; and when Honrichs,
    Frankiewicz / this is an official of Brzechffa whom I have never seen / together with Badinski are
    convicted, then Brzechffa must pay, if their own means are not sufficient — In the meantime I have


    4. Conceded that Hecker may be appointed as administrator — He is answerable for everything — will
    also furnish that guarantee to Weigel — the commission of investigation takes its beginning on the
    12th of this month and will probably last several days, and then Hecker can appear at once when he
    is required for the Weigel matter.


    Trąbczyn offers cheerful prospects, for the tenant Smidkowski is paying several thousand straightaway,
    merely in order to remain on the estates.'

- page: 3
  en: 'or Rüchel, Reibnitz''s protector — Upon this the King said: people are forever pecking at Triebenfeld,
    he is surely an honest fellow. Köckritz answered — of that I am convinced; I believe that if a man
    were satisfied and set in the right place, he would carry the devil out of hell for us — this the
    Baron von Rhaden writes to me also — likewise a man of the old stamp and grain — So in the so-called
    wind-butchery there must after all not be anything true. Be it however as it may, and let each man
    allow himself to say whatever he pleases in the way of amusement, I am content and wish nothing further
    than to make the acquaintance of such a windbag one day; my pistols shall wake him truly frightfully
    — for on account of the Colonna matter I must pass through hellish stirrup-leathers. Köckritz himself
    writes to Tismar: I pity the honest soul and heartily wish that something at least may come of it,
    for the daredevil has poked into a hornets'' nest and provoked the B against himself — God grant him
    good fortune. Hardenberg is coming, as Köckritz writes, into full activity and will arrange the business
    of the debts. Tismar writes this too and names him as prime minister in the same quality as he was
    at Bartenstein; this is said to be with Bonaparte''s approval /O God/. Of Zastrow nothing will now
    come, for Hardenberg is his death. Fried Massow would already be called minister, only Dohna [Dąmbska?]
    has hitherto prevented it. From Rhoden Your Serene Highness will doubtless already have full news
    regarding the 35000 Rthl, and be set at ease.


    Grevenitz must have written to Your Serene Highness as well. He will surely be vigilant and mindful
    of Your Most High advantage. The old lady was, as Köckritz writes to me, very ill, but has recovered
    again; yet her length of life is doubted — In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Kantwicz[?]


    8th June 1810.


    Two divisions are marching from us against the


    Turks — who will command them?


    Tomorrow I hasten to Kontop; on the 12th I go on to Streiten and from there to Pohl[?] — most faithful
    servant v Triebenfeld'

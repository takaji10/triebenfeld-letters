- page: 1
  en: 'Warsaw, 8/20 February 1830


    Kingdom of Poland


    Foreign Affairs


    No. 85


    Sir,


    I have not failed to lay before His Highness the Grand Duke Cesarevich the communication which you
    addressed to me, Sir, dated the 6/18 of this month, under No. 352, and I have accordingly the honour
    to inform you that the Administrative Council reported to His Imperial Highness in the month of August
    last that it had been recognised that the competence of the Tribunals which gave judgment in the affair
    of the bankers Weigel and Eisenhardt could be called in question, since the case concerned could by
    its nature be resolved only by the diplomatic path; that the Council had consequently authorised the
    Commission of Finances and the Treasury to declare a conflict of jurisdiction and to bring it'

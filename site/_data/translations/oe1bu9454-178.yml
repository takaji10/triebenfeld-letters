  en: 'settled before the journey was undertaken. The remaining chartes blanches I have sent to the gracious
    Fräulein von Triebenfeld.


    I have the honour to remain, with the most perfect veneration,


    Your Right Honourable''s — P.S. His Serene Highness, before the departure, has appointed me Councillor
    of Dispatches!! Dresden, the 8th of November 1805.


    humble and obedient servant A: Hahn'

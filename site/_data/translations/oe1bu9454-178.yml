  en: '178


    Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! I have just now found among
    my papers some further chartes blanches signed by His Serene Highness, which I packed up in the [uncertain:
    Eilrigbreslau] and which were intended for Your Right Honourable. You will forgive me this oversight
    when I tell you that in the last nights before the departure I had no rest, since the Chamber Director
    Graf arrived there from Behringen, and now everything that [uncertain: concerned] the Hohenlohe affairs
    was to be'

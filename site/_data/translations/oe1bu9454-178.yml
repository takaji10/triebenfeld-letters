status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! I have just now found
    a few blank signed sheets (chartes blanches), signed by His Serene Highness, among my papers, which
    I packed up in the haste [uncertain: at Breslau], and which were intended for Your Right Honourable.
    You will forgive me this oversight when I tell you that in the last nights before my departure I had
    no rest, inasmuch as the Chamber Director Count arrived there from Behringen, and now everything that
    concerned the Hohenlohe affairs was to be'
  names:

- page: 2
  en: 'attended to before the journey was undertaken. The remaining blank signed sheets (chartes blanches)
    I have sent to the gracious young ladies von Triebenfeld.


    I have the honour to remain, with the most perfect veneration,


    Your Right Honourable''s. Dresden, 8th Nov: 1805.


    P.S. His Serene Highness, before the departure, further appointed me Councillor of Expeditions. Humble
    and obedient servant A: Hahn'

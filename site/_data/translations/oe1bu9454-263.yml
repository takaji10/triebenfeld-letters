- page: 2
  en: 'or that a commissioner should be deputed to Your Serene Highness at Schlawenschitz, who should
    hear everything from you, take everything down for the record, investigate, and forward all the evidence
    to the Prince Chancellor by way of a report. In the meantime I hope that the [uncertain: Barieges]
    O.C. court will not [text lost] the error but will otherwise handle the matter in accordance with
    the Prince''s prescription and will — If the report turns out even halfway favourable, then all your
    affairs are arranged in the most desirable manner — As regards Poland everything still rests, and
    this business will only be made known at the close of the Congress and upon the publication of the
    whole. Otherwise, as the enclosure also shows, all goes well, and it has the appearance as though
    Your Serene Highness, freed of all cares, shall live happily and at ease in your old age — God grant,
    most gracious Prince and Lord, that this coming New Year may begin for you thus, and that you may
    then live on contented for a long series of years besides; this is the sum of my wishes, which however
    [uncertain: could] come from the most faithful heart.


    To Your Serene Highness''s good favour I commend myself, in the old manner as befits my years, and
    I remain, until death, most reverentially Your Serene Highness''s


    Vienna, the 28th of December 1814.


    faithful, humble and obedient servant


    v. Triebenfeld'

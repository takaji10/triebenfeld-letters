- page: 2
  en: 'or that a commissioner should be deputed to Your Serene Highness at Sławięcice, who is to hear
    everything from you, take everything down to the protocol, investigate, and send in all the evidence
    by way of a report to the Prince Chancellor — Meanwhile I hope that the Higher Provincial Court at
    Brzeg will not [uncertain: einsetzlichen] the error, but will treat the matter in accordance with
    the Prince''s prescription and will — Should the report turn out even halfway favourable, then all
    your affairs are ordered in the most desirable manner imaginable — As regards Poland everything still
    rests, and this business will only be made public at the close of the Congress and upon the publication
    of the whole — otherwise, as the enclosure also shows, all goes well, and it has the appearance as
    though Your Serene Highness, freed of every care, shall live happily and peacefully in your old age
    — God grant you, most gracious Prince and Lord, that this coming New Year may so begin, and that you
    may then live on contented for a long succession of years yet; this is the sum of my wishes, which
    however [uncertain: könte] from the most faithful heart — To Your Serene Highness''s good favour I
    commend myself, in the old manner as befits my years, and I remain, until death, reverentially Your
    Serene Highness''s


    Vienna, the 28th of December


    1814.


    faithful, humble and obedient servant


    v Triebenfeld'

- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Austria''s capital mourns the swift departure of the Württemberg monarch. Under the name of a Count
    of Teck he left Vienna yesterday morning in the [uncertain: strictest] incognito — Generous and with
    truly royal pride, this man-loving King, some days before his departure, distributed with his own
    hand 4000 ducats among the Imperial household staff — Theatre princesses at the Casperle, whom nature
    had endowed with plump parts of the hinder body, enjoyed distinguished benefactions from this Majesty
    behind the scenes — and accompanied by many thousand blessings and good wishes from this class of
    people he set out yesterday on the journey into his own states; the Crown Prince, Winzingerode, and
    Linden, the latter two furnished with powers of attorney from him, are here and will remain here until
    the end of the Congress. The Privy Councillor Göschel is today submitting yet another note to the
    Congress in Your Serene Highness''s name.


    Now to the principal matter. — From Your Serene Highness''s letter of the 17th, which I received yesterday
    evening, I see that you have furnished the Court Councillor Hahn and Lombardini with powers of attorney
    and sent them to Brieg — This has given me joy, for both are honest men, and something good may [uncertain:
    One] particularly, together with Eberhardt, be effected regarding the satisfaction of the Courland
    heirs in accordance with my most recent proposal. In the meantime I fear that no error may prevail
    here — the Prince Chancellor wishes that Your Serene Highness should be examined in person yourself,
    and that you should confirm and substantiate all that Hahn and I have said in the submissions; to
    this end the Prince ordered that Your Serene Highness be summoned to Brieg,'

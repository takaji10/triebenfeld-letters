- page: 1
  en: '263


    Most Serene Prince


    Most gracious Prince and Lord!


    Austria''s capital mourns the swift departure of the Württemberg monarch. Under the name of a Count
    von Teck he left Vienna yesterday morning in the deepest incognito — generous, and with truly royal
    pride, this man-loving King distributed 4000 ducats with his own hand among the Imperial household
    some days before his departure — theatrical princesses at the Casperl, whom nature had endowed with
    plump parts of the hinder body, enjoyed distinguished benefactions from this Majesty behind the scenes
    — and accompanied by many thousand wishes of blessing from this class of persons he set out yesterday
    on the journey into his own states — the Crown Prince, Winzingerode, and Linden, the two latter furnished
    with powers of attorney from him, are here, and will remain here until the end of the Congress — the
    Privy Councillor Göschel is today handing in yet another note at the Congress in Your Serene Highness''s
    name — Now to the main matter. — From Your Serene Highness''s letter of the 17th, which I received
    yesterday evening, I see that you have furnished the Court Councillor Hahn and Lombardini with powers
    of attorney and sent them to Brzeg — This has given me joy, for both are honest men, and one [uncertain:
    Ein] in particular, together with Eberhard, something good may be effected as regards the satisfaction
    of the Curische heirs in accordance with my latest proposal — Meanwhile I fear that no error may prevail
    here — the Prince Chancellor wishes that Your Serene Highness be heard in person, and that you should
    confirm and make good all that I and Hahn have stated in the submissions; [uncertain: Hn] that end
    the Prince ordered that Your Serene Highness be summoned to Brzeg,'

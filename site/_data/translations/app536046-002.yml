- page: 1
  en: 'No. 17: Between the same Plaintiff, through the same, and the same Cited, in person — the Court,
    etc., deciding the term of the Plaintiff party brought before it, the controversies having been heard:


    Although the Right Honourable Stanisław Chełmski — by virtue of a transfer, acknowledged before the
    records of the Pyzdry Municipal Court on Wednesday, the Eve of the Feast of the Nativity of the Most
    Blessed Virgin Mary, in the year 1768 by the Excellent Jan Tracholz, merchant and inhabitant of [a
    town: the name is not surely read], of various sums claimed from the late Right Honourable Paweł Prusimski,
    into the person of the same Right Honourable Chełmski — instituting a suit against the Right Honourable
    Prusimski, Starost of Niszczewice, claims the production of the contract concerning the sale of the
    Trąbczyn pine forest entered into with the Honest Tracholz and the late Right Honourable Paweł Prusimski;


    since, however, it is shown to the Court that in its earlier sessions, on Monday after Septuagesima
    Sunday in the year 1766, a decree of remission of the cause to a condescension term had intervened
    between the Honest Jan Tracholz and the Right Honourable Antoni Prusimski, the present Cited, and
    has not been carried out: the Court therefore, the whole matter being suspended, finds a condescension
    of its court to the ground of the estates of Trąbczyn to be necessary, the parties requesting it,
    on and for the Monday after Laetare Sunday in Lent next coming in the coming year — decreeing that
    the parties shall bring this same court, the absence of two or of one notwithstanding; which court,
    or he who is to be brought, shall order the production of the contract specified above by the Right
    Honourable Prusimski, Starost of Niszczewice, and shall finally decide and adjudge the present cause
    as law, justice, the tenor of the documents and the contents of the Plaintiff party''s terms require,
    all doubts and interventions being resolved; shall decree satisfaction, to whom, how much and from
    whom it shall be due; shall conduct inquisitions as the matter requires; shall receive oaths where
    necessary and from whom it shall be due; and shall attach rigours.


    The parties shall be bound and obliged to obey and to acquiesce in that court of the condescension,
    under penalty of outlawry, to be published before the same judge who is to be brought, upon the contravening
    party in case of contravention. The penalty of fourteen Polish marks having been paid — to be set
    off party against party, and paid to the Court forthwith, under the usual rigour, by halves. For which
    condescension term the parties shall cite those whom the matter requires; those cited shall appear
    under the rigour written above.'

  en: 'Document no. 1532


    Buda, 22 November 1440


    King Władysław III charges 200 marks on the villages of Adamierz, Borzykowo and Wrąbczynek in favour
    of Stanisław Czarny.


    Copy: Warsaw, AGAD, Metryka koronna, vol. 109, pp. 8–9. Entered on 27 April 1570 (from the original).


    Mention: MRPS V, no. 4154 (from the copy).


    We, Władysław, by the grace of God King of Hungary, Poland, Dalmatia, Croatia, etc., supreme prince
    of Lithuania and heir of Ruthenia, etc., make known by the tenor of these presents to all whom it
    concerns that, having regard to the faithful services of the noble Stanisław Czarny of Pietrzyków¹,
    beloved by us, shown to us faithfully and constantly for a long time and especially in the preparation
    of the happy coronation of this our Kingdom of Hungary, and to be shown by him still more diligently
    in future, we give him for their sake two hundred marks of Polish reckoning and money [p. 9], reckoning
    48 g(roschen) to each mark, in and upon our villages of Adamierz², Borzykowo³ and Wrąbczynek, of the
    district of Pyzdry⁴, which we have allowed him to free from the hands of the noble Bartosz Płomikowskiᵃ
    ⁵, ᵇ⁻ᶜwe give, donate


    and inscribe by these presents, we bestow them on him with all the uses, fruits, rents, revenues,
    incomes, fields, meadows, plains, woods, heaths, all ponds, fisheries, waters, mills, emoluments,
    beehives, emolumentsᵈ, fowling, appurtenances and incomes whatsoever, to be had, held, used and peacefully
    possessed for so long until the said two hundred marks are paid to him or his descendants in full
    by us or our successors. When they are paid, the possession of the said villages shall return to us
    and our successors with full right. Our royal rights and hospitality dues always saved. In witness
    of these letters, to which our seal is hung below. Given at Buda on the Tuesday after the feast of
    St Elizabeth, in the year of the Lord 1440⁶.


    The report of the generous Andrzej of Tęczyn⁷.


    ᵃSo the copy.


    ᵇ⁻ᶜSo the copy (praesens).


    ᵈSo the copy (word repeated).


    ¹See above, no. 1520.


    ²See above, no. 1520.


    ³See above, no. 1520.


    ⁴See above, no. 1520.


    ⁵Bartosz of Płomykowo (today Płonkowo in Kujawy), not more closely known.


    ⁶The date agrees with the king''s itinerary.


    ⁷Andrzej Tęczyński, son of Andrzej, castellan of Wojnicz, captain of Rabsztyn 1441, of Chełm 1455,
    d. 1461.'

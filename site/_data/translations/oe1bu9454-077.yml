- page: 2
  en: will be and remain active not only for now but also hereafter – but I must expend something upon
    it. Herr von Michaelis will write today for a power of attorney; this Your Most Serene [Highness]
    should send through him, only so that various things may be settled here on the spot without having
    to become long-drawn-out. I hope to God that the matter will now be settled quite according to wish,
    and even better than I at first believed – I shall assuredly attend to everything in the best manner
    with the most glowing zeal — I am at the same time also providing for a loan suited to the matter,
    so that one does not come into embarrassment and can keep one's word to the good King. Only this shall
    I always bear in mind, that the estates remain what they are, indeed that they shall ever become and
    remain the first jewel of all the property belonging to Your Serene Highness — and in this regard
    I shall only truly show myself effective at the finalisation of the business. Only for now I still
    wish to remain in

segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    That everything is going according to wish, Your Most Serene Highness will deign to be convinced [uncertain:
    Fuh] from the letter which you receive today from His Majesty in the Privy Councillor Beyhm. To Minister
    von Voss the matter goes off today, that he is to report with the utmost dispatch – In this matter
    provision has now also been made that the business shall not be dragged along the long road. In the
    meantime it would now be very good if Glen were to draw up the valuations quite thoroughly, so that
    they conform to the schedule submitted and to the contracts mentioned therein. The contracts I have
    all here, only those of Tieten must [uncertain: ölzte] have there and keep in the best condition.
    Not before everything is in the clear (that is to say, what is to be done here) do I depart from here.
    A man in Potsdam – I have engaged, who'

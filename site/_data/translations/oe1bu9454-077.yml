  en: '77


    Most Serene Prince,


    Most gracious Lord!


    That everything is going according to wish, Your Most Serene Highness will be graciously pleased to
    be convinced [uncertain: Fuh aus] by the letter which you received today from His Majesty through
    the Privy Councillor Beyme. The matter goes off today to Minister von Voss, that he is to render his
    report with the utmost dispatch — In this matter provision has now also been made that the business
    shall not be dragged along the long road. In the meantime it would now be very good if Glenck were
    to draw up the valuations quite thoroughly, so that they agree with the designation submitted and
    with the contracts mentioned therein. I have all the contracts here; only those from Titz must Glenck
    have there, and keep in the best order. Before everything is in the clear (that is to say, what is
    to be done here), I shall not depart from here. A man in Potsdam — I have engaged, who'

    kind: person
- page: 3
  en: 'the background, so that envy may not, in consideration of my humble self, play Your Serene Highness
    a trick – The Minister, who here is truly in every respect quite well, commends himself most cordially
    to Your Serene Highness. One further matter I find necessary: let Your Serene Highness send me a couple
    of blank sheets for letters, such as I might have to write in haste to someone, that is, on the other
    side with a signature and above it


    most devoted servant


    H. I shall use such only in the most urgent cases, and so [uncertain: mippen] that Your Serene Highness
    will never be able to deny me your satisfaction, for one such is already necessary for the man in
    Potsdam. Tomorrow I go to His Serene Highness the Prince Sacken, to bring to the same the glad news
    of how far the matter has already advanced.


    In deepest reverence I remain, until death, Your Most Serene Highness''s


    Herr von Burensprung, however, has become Land Master of Forests, and Wedel remains for the present
    what he is – In general, however, various changes are to be looked for. Lindenau has received the
    title of Excellency. Berlin, the 6th of October 1798


    most humble and faithful servant


    von Triebenfeld'

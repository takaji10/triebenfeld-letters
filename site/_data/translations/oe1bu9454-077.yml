- page: 2
  en: will be and remain active not only for now but hereafter too — but I must expend something upon
    it — Mr Michaelis will write today for a power of attorney; let Your Most Serene Highness send this
    through him, only so that various things may be settled here on the spot without having to become
    long-drawn-out — I hope to God that the matter will now be settled so entirely according to wish,
    and even better than I at first believed — I shall assuredly attend to everything in the best way
    with the most glowing zeal — I am at the same time providing for a loan suited to the matter, so that
    one does not fall into embarrassment and can keep one's word to the good King. Only this shall I always
    keep in mind, that the estates remain what they are, indeed that they shall ever become and remain
    the first jewel of all the property belonging to Your Serene Highness — and in this regard I shall
    appear truly effective only upon the finalisation of the business. Only for now I still wish to stand
    in

- page: 3
  en: 'the background, so that envy may not play Your Serene Highness some trick on account of my insignificant
    person — The Minister, who here is in truth in every respect quite well disposed — commends himself
    most cordially to Your Serene Highness — One thing more I find necessary: let Your Serene Highness
    send me a couple of blank sheets for letters which I might have to write to someone in haste, that
    is, on the other side with a signature and thereupon [uncertain: dreiber ergebenster dier] most devoted
    servant


    — H.


    I shall use them only in the most pressing cases, and so [uncertain: mippen] that Your Serene Highness
    will never be able to refuse me your satisfaction, for one of them is already necessary for the man
    in Potsdam. Tomorrow I go to Her Serene Highness the Princess Sacken, to bring her the glad news of
    how far the matter has already prospered.


    In deepest reverence I remain, until death, Your Most Serene Highness''s


    Mr von Buerensprung has however been made Land Master of Forests, and Wedel remains for the present
    what he is — But in general one [uncertain: sich] sees several changes ahead. Lindenau has received
    the title of Excellency. Berlin, the 6th of October 1798


    most humble and faithful servant


    von Triebenfeld'

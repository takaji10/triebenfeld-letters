segments:
- page: 1
  en: 'We hereby most humbly request a Royal and Most Laudable Supreme Government Board to have the reigning
    Prince of Hohenlohe-Ingelfingen, Friedrich Ludwig, ad requisitionem of the 24th of September of last
    year, now perform the homage (Homagium) as soon as may be agreeable, and to be so good as to transmit
    to us the record taken thereof. Kalisz, the 18th of March 1800. Schultz


    To a Royal and Most Laudable Supreme Government Board at Wrocław.'

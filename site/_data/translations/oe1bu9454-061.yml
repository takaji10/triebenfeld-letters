- page: 1
  en: 'Your Honour,


    Highly Honoured Sir, Court Councillor.


    Your Honour''s most highly esteemed letter I received today by express, my joy was at first without
    bounds to know you as my [uncertain: cousin/weather] in [uncertain: Breiten], but on reading your
    friendly letter further, fresh sorrow stunned my heart, so that I could scarcely compose myself. I
    have a plan by which I may be rescued out of all embarrassments, only 1800 Rthl of interest must be
    paid, before that I cannot come to Breslau or into those parts. Honour and fortune are not yet at
    stake there; I am at present dreadfully disgraced by the eternally accursed von der Lahr affair and
    cannot show myself there before the 1800 Rthl of interest are paid. Then I can appear there and carry
    out my plan. If the Most Serene Lord does not help me with this trifle, then may God stand by my forsaken
    children; I shall then go to another place, where I shall not require His Serene Highness''s help.
    I have sent His Serene Highness the letter which my daughter, in despair after the distraint over
    the von der Lahr debt, wrote to my youngest son; and if such a cry of lamentation does not move the
    Lord, if he does not help me with this trifle, then all gentle feelings have ever been strangers to
    him. Dear friend — it is 1800 Rthl that can save me from shame and mockery, indeed from ruin; these
    determine my [uncertain: choice] or my woe — I must have them, for before that I shall not come there
    — If the Prince rescues'

- page: 1
  en: '61


    Your Honour,


    Highly Honoured Sir, Court Councillor!


    Your Honour''s most esteemed letter I received today by express, my joy was at first without bounds
    to know you as my weather in Wrocław, but on reading your friendly letter further, fresh sorrow stunned
    my heart, so that I could scarcely compose myself. I have a plan by which I may be rescued from all
    my embarrassments, only 1,800 Rthl of interest must be paid; before that I cannot come to Wrocław
    or into those parts. Honour and fortune are still not at stake there; I am for the present dreadfully
    disgraced by the one accursed v. d. Lahr affair, and cannot show myself there any sooner than when
    the 1,800 Rthl of interest are paid. Then I can appear there and carry out my plan. If the Most Serene
    Lord does not help me with this trifle, then may God stand by my forsaken children; I shall then go
    to another place, where I shall not require His Serene Highness''s help. I have sent His Serene Highness
    the [uncertain: Bruß] of my daughter, which she wrote in despair, after the distraint over the v.
    d. Lahr debt, to my youngest son; and if such a cry of lamentation does not move the Lord, if he does
    not help me with the trifle, then all gentle feelings have ever been strangers to him. Dear friend
    — it is 1,800 Rthl that can save me from shame and mockery, indeed from ruin; these decide my choice
    or dwelling — I must have them, for before that I shall not come thither — If the Prince rescues'

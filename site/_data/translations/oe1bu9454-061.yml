- page: 2
  en: 'me therewith, then I appear there justified, but also not without citation. I then carry out my
    cause with honour — dismember a part of my estates, assign to my children the interest for their maintenance,
    and then go to the King, where I remain until much has been done. This is my plan, and these are the
    consequences, if the Prince provides counsel concerning the 1,800 Rthl — If this last does not happen,
    then I can no longer present myself there, but shall go to Königsberg and from there perhaps into
    hell — My heart would burst within me when I consider my misfortune, which I suffer so undeservedly.


    Here the estates are sequestered, through the noise (bruit) which I endured in Berlin eternally of
    the Lahr affair; there, however, [uncertain: swum] — but where am I to turn? Świniary can be saved
    with 1,800 Rthl, and I be put in a position to carry out all my plans — Here too it would prepare
    rain-rich consequences. People would deal more sparingly with me if I had Świniary free again; thus
    everything there depends on the speedy help of His Serene Highness. I would gladly sacrifice for it
    in return [uncertain: Lebeseeligkeit] and all else, if only the Lord does this for me. Take care of
    it, Your Honour, then, if it is in any way in the world possible for you, and procure counsel soon,
    for then I can set out from here on the 12th of September so as to be in Sławięcice by the 16th —
    but without this help I abandon everything. With a thankful heart, and true high esteem, I shall ever
    be


    Your Honour''s


    Konotop, the 31st of August


    1809.


    faithfully devoted friend and servant


    v Triebenfeld'

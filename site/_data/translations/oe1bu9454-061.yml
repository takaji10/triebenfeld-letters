- page: 2
  en: 'me thereby, then I shall appear there vindicated, though not without a summons. I shall then carry
    out my cause with honour — dismember a part of my estates, assign my children the interest for their
    maintenance, and then go to the King, where I shall remain until much has been accomplished. This
    is my plan and these are the consequences, if the Prince finds counsel in the matter of the 1800 Rthl
    — If this last does not happen, then I can no longer appear there but shall go to Königsberg and from
    there perhaps to hell. My heart could burst when I consider my misfortune, which I suffer so undeservedly.


    Here the estates are sequestrated through the rumour which I endured in Berlin on account of the eternal
    von der Lahr affair; there now [uncertain: geschwemmen] — but where am I to turn? [uncertain: Schweineren]
    can be saved with 1800 Rthl and I be put in a position to carry out all my plans — Here too it would
    prepare blessed consequences. People would deal more sparingly with me, once I had [uncertain: Schweine]
    free again; and so everything there depends upon the speedy help of His Serene Highness. I would gladly
    sacrifice to him in return all life''s happiness and everything, if only the Lord will do this for
    me. Take care, then, Your Honour, if it is in any way possible for you in this world, and procure
    counsel soon, for then I can depart from here on the 12th of September and be at Schlawenschitz about
    the 16th — but without this help I abandon everything. With a grateful heart and true esteem I shall
    ever be


    Your Honour''s


    Kontop, the 31st of August


    1809.


    faithfully devoted friend and servant


    v. Triebenfeld'

- page: 3
  en: '2,000 Rthl, which he promises to pay out at once in cash — with that, to be sure, only a clear
    4,000 Rthl would be saved against the present wretched sale — I therefore refuse Grimm nothing as
    yet, so that he may help me quickly to get Honrichs out — afterwards I shall examine and keep what
    is best. May Your Serene Highness be pleased only to command Glenck that he absolutely procure without
    delay the points of agreement concluded by von Rochlitz, together with the Grimm supplement and the
    power of attorney given to Rochlitz for that purpose, so that action may quickly be taken against
    Honrichs. Szczucki and Czizewski must [uncertain: Gemein] today sue as the warrantors in the Przespolewski
    matter, for these fellows have taken the money to themselves under the Polish Tribunal''s decree and
    by receipt — they have had the use of it these 18 years; they must either hand it out at once, or
    else set Your Serene Highness ex nexu. It is infamous of such a scoundrel that he lets the matter
    lie so long until one has the mounted constable on one''s neck. It would be necessary that one sat
    here always and thrust such [uncertain: Massette] into his ribs, so that he does not lie idle and
    in the end let himself be quite outflanked — With the old and the young Lichnowski I have everything
    in the clear; the latter has much respect for me and runs after me like the billy-goat after the lump
    of salt. The old one begs imploringly for 1,390 Rthl — he writes that he is in the greatest distress
    — then he will wait as long as may be until he can be paid further. For that, counsel must now be
    found.'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! Your Most Serene Highness''s gracious letter I have received
    by express courier, and yesterday had the answer delivered to the Olesnicers. Tomorrow the hearing
    in this matter is set at Trąbczin, and I hoped to see the affair finalised shortly. The lads say that
    they are reluctant to litigate against Your Serene Highness, and yet the fellows, in league with the
    Landrath, already nine months ago lodged protestations here and wished to steer the matter in such
    a way that they should never have to give up the 10000 Rthl at all – Now, seeing that their case stands
    badly, they come creeping and try their luck another way. From Berlin I now await the answer at every
    hour – God grant that it turn out as we wish. Szetlewek the von Otocki wishes to take on hereditary
    lease – He offers already 10000 Rthl in [uncertain: standing] money and 1500 Rthl annual canon. Glenck
    valued the estate at 40000 Rthl, but he counted in 800 Morgen of woodland from Trąbczin – if I can
    get 40000 Rthl without these, then I close the bargain, for in that case Your Serene Highness profits
    16000 Rthl over against the valuation. Further, Otocki wishes to take the propination rights of both
    estates on lease. He offers 3000 Rthl yearly, but under 4000 Rthl I shall not let them go, and that
    for three years only. The proposition is valued together with the estates at 2700 Rthl, so that here
    too 1300 Rthl yearly are gained; the rent he pays half-yearly in advance, and indeed'
- page: 2
  en: 'very soon now, which would then amount to a capital of 12000 Rthl and come in by Easter. If it
    succeeds with the Olesnicers, then a further 11000 Rthl come in soon. I have charged the Titl with
    buying out the old peasants in Swincin. There are thirteen of them, each holding 2 1/3 Hufe; if he
    can dispose of the fellows for 2000 Rthl, then I shall take up money here, pay them out at once, and
    sell the already built-up holdings for about 1600 Rthl; in this way again some 9000 Rthl in cash would
    be gained here, and ready money is sooner to be hoped for here than from the old subjects. With Honrichs
    matters look bad – the fellow does not pay — He says it stands in the contract that Your Serene Highness
    must apply for the concession on his behalf. But it does not stand there that Your Highness guaranteed
    to procure it for him. I shall write to the Department on this account and see to it that it is refused
    – and then the contract must be quickly annulled. As soon as this is done, that same Meierowitz will
    buy it who at first was so eager to [uncertain: buy] it, but was turned away by Glenck. Maierowitz
    gives 13000 in ready money, and a canon of a thousand-odd yearly. In this way Your Serene Highness
    would profit 10000 Rthl on the estate. A wretched 100 ducats have deprived Your Serene Highness of
    this [uncertain: profit] and plunged you into vexation. Perhaps God will grant that I redress it.
    Grimm too wishes to buy the estate of Wittow in the name of his son-in-law; but he offers no more
    than'
- page: 3
  en: '2000 Rthl, which he promises to pay out at once in cash – whereby, to be sure, only a bare 4000
    Rthl would be saved as against the present wretched sale – I therefore refuse Grimm nothing as yet,
    so that he may quickly help me to get Honrichs out of the way – afterwards I shall examine and keep
    the best. May Your Serene Highness be pleased only to command Glenck that he absolutely produce, without
    delay, the punctation concluded by von Köckritz together with the Grimm supplement, along with the
    power of attorney given [uncertain: for that purpose] to [illegible], so that action may quickly be
    taken against Honrichs. Szczucki and Ceizewski must be sued jointly today as the evictores in the
    Przespolewski matter, for these fellows took the money to themselves according to the decree of the
    Polish Tribunal and by receipt — they have had the use of it for eighteen years already; they must
    either give it out again at once, or set Your Serene Highness ex nexu. It is infamous of such a scoundrel
    that he lets the matter rest so long until one has the Landreuter sitting on one''s neck. It would
    be necessary that one were always sitting here and driving such Massette into his ribs, so that he
    does not lie idle and in the end let himself be quite outflanked – With the old and the young Lichnowski
    I have everything settled; the latter has much respect for me and runs after me like a he-goat after
    a lump of salt. The old one begs imploringly for 1390 Rthl — he writes that he is in the greatest
    distress – then he will wait as long as until he can be further paid. For this some means must now
    be found.'
- page: 4
  en: 'If Your Serene Highness has so much there, then send it to the old fellow soon; I shall procure
    it again at once – on my honour let it be assured. The Chamber President here is a spiteful [uncertain:
    beast] and mightily hungry – His only society is with the Chamber [uncertain: Honrichs] Peter, that
    man''s wife, and the Councillor of War Zerboni – the latter is his shadow and steers him as he pleases.
    These are again bad prospects – if only I could soon send into the house for the fellow the lavoir
    and the three boxes from Rigs[illegible], which however must be so coated as though they were of Branzenis[illegible],
    then he would at once be very pliable. Let Your Serene Highness see to it only that I get these pieces
    here soon. In deepest reverence I remain, until death, Your Most Serene Highness''s — Otocki also
    wishes to take a further 20 to 30 Hufen of woodland, arable and meadow on hereditary lease, and to
    pay as the colonists do — many are already applying again for land, and if I [uncertain: press on]
    with it, the same will soon be disposed of. The bilious fever has seized me again; I can already scarcely
    drag my legs after me — the vexations are too manifold. Kalisz, the 1st of March 1805, most humble
    and faithful servant v Triebenfeld'

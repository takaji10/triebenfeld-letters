- page: 4
  en: 'If Your Serene Highness has so much there, then send it to the old fellow soon; I shall procure
    it again at once, be it assured upon my honour. The Chamber President here is a spiteful beast, and
    moreover ravenously hungry – His only company is with the chamber [official] Honrichs Peter, his wife,
    and the councillor of war Zerboni – the latter is his shadow and steers him as he pleases. These are
    again bad prospects – if only I could soon send into the fellow''s house the washbasin and the three
    boxes from [uncertain: Rigs], which must however be so plated as though they were from [uncertain:
    Branzenis], then he would at once be very pliable. May Your Serene Highness only see to it that I
    get these pieces here soon. In deepest reverence I remain, until death, Your Most Serene Highness''s
    Otocki also wishes to take a further 20 to 30 Hufe of woodland, arable and meadow in hereditary lease,
    and to pay as the colonists do — many are already applying again for plots, and when I [illegible]
    with it, the same will be quickly disposed of. The bilious fever has seized me again; I can hardly
    drag my legs after me again — the vexation is too manifold. Kalisz, the 1st of March


    1805 most humble and faithful servant v Triebenfeld'

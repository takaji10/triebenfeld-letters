- page: 1
  en: '163


    Most Serene Prince,


    Most gracious Lord!


    Your Most Serene Highness''s gracious letter I have received by express courier, and yesterday I had
    the answer delivered to the Oleśnica people.


    Tomorrow the term of hearing in this matter falls at Trąbczyn, and I hoped to see the business finalised
    shortly.


    The lads say that they have no wish to litigate against Your Serene Highness, and yet these fellows,
    in league with the district councillor, already nine months ago lodged protests here and sought to
    set the matter up so that they should never have to hand over the 10,000 Rthl. — Now that they see
    their cause stands badly, they come crawling and try their luck another way — From Berlin I look for
    the answer at any hour — God grant that it turns out as we wish.


    Szetlewek is what the von Otocki wishes to take in hereditary lease — He offers already 10,000 Rthl
    of [uncertain: bustands] money and 1,500 Rthl annual canon. Glenck valued the estate at 40,000 Rthl,
    but he had promised 800 Morgen of woodland from Trąbczyn — if I can get these 40,000 Rthl without
    it, I shall close, for then Your Serene Highness profits 16,000 Rthl against the valuation. Further,
    Otocki wishes to take on lease the propination rights of both estates. He offers 3,000 Rthl annually;
    but under 4,000 Rthl I will not let them go, and then only for 3 years. The propination rights together
    with the estates are valued at 2,700 Rthl, so here likewise 1,300 Rthl annually are gained; the rent
    he pays half-yearly in advance, and indeed'

- page: 3
  en: '2000 Rthl, which he promises to pay out at once in cash – in which case admittedly only a bare
    4000 Rthl would be saved as against the present wretched sale – I therefore refuse Grimm nothing as
    yet, so that he will help me swiftly to get Honrichs out of the way – afterwards I shall examine the
    matter and keep the best. May Your Serene Highness only be pleased to command Glenck that he absolutely
    bring in without delay the points of agreement concluded by von Köckritz, together with the Grimm
    supplement and the power of attorney given in the matter at [uncertain: Wohlch], so that action can
    quickly be taken against Honrichs. Szczucki and Ceizewski must be sued jointly today as the warrantors
    in the Przespolewski matter, for these fellows took the money to themselves under the decree of the
    Polish Tribunal and by receipt — they have had the use of it for 18 years already; they must either
    surrender it at once, or set Your Serene Highness free of the obligation. It is infamous of such a
    scoundrel that he lets the matter lie so long until one of the mounted enforcement officers is upon
    his neck. It would be necessary that one were always sitting here and driving such fellows in the
    ribs, so that he does not lie idle and in the end let himself be quite outflanked – With the old and
    the young Lichnowski I have everything settled; the latter has much respect for me and runs after
    me like the billy-goat after the lump of salt. The old one begs imploringly for 1390 Rthl — he writes
    that he is in the greatest distress – then he will wait as long as it takes until he can be paid further.
    For this, counsel must now be found.'

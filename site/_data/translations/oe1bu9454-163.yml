- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Your Most Serene Highness''s gracious letter I have received by express courier, and yesterday had
    the answer delivered to the Olesnicers.


    Tomorrow a hearing in this matter is set at Trąbczyn, and I hoped to see the business finalised shortly.


    The rogues say that they are reluctant to litigate against Your Serene Highness, and yet the fellows,
    in league with the district councillor, lodged protestations here nine months ago already and wished
    to set the matter up in such a way that they would never have to pay over the 10000 Rthl – now, when
    they see that their case stands poorly, now they come crawling and try their luck by another route.
    From Berlin I look for the answer at any hour now – God grant that it turn out as wished.


    Szetlewek the von Otocki wishes to take in hereditary lease – He offers already 10000 Rthl of entry
    money and 1500 Rthl of annual canon. Glenck valued the estate at 40000 Rthl, but he promised 800 Morgen
    of woodland from Trąbczyn – if I can get it without these 40000 Rthl, then I close with him, for in
    that case Your Serene Highness profits 16000 Rthl against the valuation. Further, Otocki wishes to
    lease the propination rights of both estates. He offers 3000 Rthl annually, but below 4000 Rthl I
    shall not let them go, and then only for 3 years. The proposition is valued, together with the estates,
    at 2700 Rthl; so here too an annual 1300 Rthl are gained. The rent he pays half-yearly in advance,
    and that'

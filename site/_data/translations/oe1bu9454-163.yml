- page: 4
  en: 'If Your Serene Highness has that much there, then send it to the old fellow soon; I will procure
    it — on my honour let it be assured — straight back again. The Chamber President here is a spiteful
    [uncertain: beast] and monstrously hungry — His only society is with the chamber cashier Deter, the
    latter''s wife, and the councillor of war Zerboni — the last is his shadow and steers him as he pleases.
    These are bad prospects again — if only I could soon send into the fellow''s house the wash-basin
    and the three busts by Kips, which however must be coated so as to look as though they were of bronze,
    then he would at once become very pliant. Let Your Serene Highness only see to it that I get these
    pieces here soon. In deepest reverence I remain, until death, Your Most Serene Highness''s. Otocki
    also wishes further to take 20 to 30 Hufen of woodland, arable and meadow in hereditary lease, and
    to pay as the colonists do — many are applying again for plots, and when I [uncertain: weme bei] here
    with it, the same will be quickly disposed of. The bilious fever has seized me again; already I can
    scarcely drag my legs after me — the vexations are too many and various. Kalisz, the 1st of March


    1805, most humble and faithful servant, v Triebenfeld'

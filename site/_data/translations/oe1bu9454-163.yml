- page: 2
  en: 'now shortly, which would then amount to a capital of 12000 Rthl and come in by Easter. If matters
    succeed with the Olesnicers, then a further 11000 Rthl come in shortly. I have charged the aforesaid
    with buying out the old peasants in Swincin. There are 13 of them, each of whom holds 2 1/3 Hufe;
    if he can dispose of the fellows with 2000 Rthl, then I shall raise money here, pay them out at once,
    and sell the already built-up holdings for about 1600 Rthl; in this way a further 9000 Rthl in cash
    would be gained here, and ready money might also be looked for here sooner than from the old subjects.


    With Honrichs things look bad – the fellow does not pay — He says it stands in the contract that Your
    Serene Highness would have to apply for the concession on his behalf. But it does not stand there
    that Your Highness guaranteed to procure it for him. I shall write to the department on this account
    and see to it that it is refused – and then the contract must be quickly annulled. As soon as this
    is done, the same Meierowitz will buy it, who at the outset was so eager to take it, but was turned
    away by Glenck. Meierowitz gives 13000 in cash, and a canon of a thousand-odd annually. In this way
    Your Serene Highness would have profited 10000 Rthl on the estate. A wretched 100 ducats have deprived
    Your Serene Highness of this profit and plunged you into vexation. Perhaps God will grant that I redress
    it. Grimm too wishes to buy the estate of Witów in the name of his son-in-law; but he offers no more
    than'

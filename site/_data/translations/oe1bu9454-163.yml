- page: 2
  en: 'soon now, which would then amount to a capital of 12,000 Rthl and would come in by Easter. If matters
    succeed with the Oleśnica people, 11,000 Rthl more will be added shortly. I have instructed Titz to
    buy out the old peasants in Swincin. There are 13 of them, each holding 2 1/3 Hufe; if he can dispose
    of the fellows with 2,000 Rthl, then I shall take up money here, pay them out at once, and sell the
    already built-up holdings for about 1,600 Rthl; in this way again some 9,000 Rthl in cash would be
    gained, and here too ready money may sooner be hoped for than from the old subjects.


    With Honrichs things look bad — the fellow does not pay — He says the contract states that Your Serene
    Highness must apply for the concession on his behalf. But it does not state that Your Highness guaranteed
    to procure it for him. I shall write to the Department on that account and see to it that it is refused
    — then the contract must be rescinded quickly. As soon as this is done, it will be bought by that
    same Meierowitz who at first was so eager to buy it but was turned away by Glenck. Meierowitz gives
    13,000 in ready money and a thousand rthl canon annually. In this way Your Serene Highness would profit
    10,000 Rthl on the estate. A wretched 100 ducats have deprived Your Serene Highness of this profit
    and cast you into vexation. Perhaps God will grant that I may redress it. Grimm too wishes to buy
    the estate of Witów in the name of his son-in-law; but he offers no more than'

- page: 2
  en: 'himself in due form. Whatever the said Mr. von Brzechsta may be able to gather together in ready
    money at short notice will be brought along. At present the daily new levies still carry off too much.
    All the interest is secured, and there still remain over to Your Serene Highness several thousand
    d annually; the Bayonne capital will likewise be completely amortised. In the meantime, as regards
    the ready money, it is only the gain from the two proceedings named on the preceding page that will
    first bring in anything real. The documents sent to me were submitted to the authority the day before
    yesterday. Not only is every dispute removed, but the benefit may perhaps accrue to Your Serene Highness
    that the levies pro futuro would be reduced. It would depend upon a sacrifice, which


    Mr. von Brzechsta will advance, should it be required. For the rest, Your Serene Highness receives
    back the original documents, the use of them having been made.


    the Parobeck follows, and if it succeeds we shall bring along a still bigger dog.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Blizanow


    the 27th of January 1812


    faithful and most humble and obedient servant


    v Triebenfeld'

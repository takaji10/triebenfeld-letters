- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    On this important day, which is a brother to that on which You first beheld the light of the world,
    and which will remain the jewel among the lesser ones that follow it, I cannot lay myself personally
    at Your Most Serene Highness''s feet and bring forward my faithful and sincere wishes. I can do it
    [uncertain: only] in writing, but let it be just as heartfelt all the same. God grant Your Most Serene
    Highness to live to see at least 50 more days of this kind; may He bestow upon You the most lasting
    health, [uncertain: true] good fortune and contentment, may He pour out upon You every blessing, and
    may He let all grief and care become strangers to you, most gracious Prince, from now on, as Your
    Serene Highness truly deserves.


    These are the substance of my most faithful wish on this important day. For the rest, the Attorney-General
    Count Lipski, the Tribunal President Smogorzewski, the Tribunal Councillor Rembowski, the Tribunal
    Councillor Michalski, and the Tribunal Councillor Sobocki render Your Most Serene Highness their most
    humble thanks for the fine game. The effect will shortly show itself in the decision of the Olesnica
    and Wrąbczyn matter. With the sub-prefect Brzechsta I have concluded, sub spe rati, the lease contract
    for the Zagorowo estates alone, at 20000 Rthl. On the 8th of February I intend to arrive with him
    at Schlawenschitz, where the contract may then be concluded by Your Serene Highness'

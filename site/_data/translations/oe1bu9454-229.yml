- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    On this important day, which is a brother of that day on which You beheld the light of the world,
    and which will remain the jewel among the lesser of its successors, I cannot lay myself personally
    at Your Most Serene Highness''s feet and present my faithful and sincere wishes. I can do it only
    in writing, but let it be just as heartfelt — may God let Your Most Serene Highness live to see at
    least 50 more days of this kind; may He grant You the most enduring health, [uncertain: Wuhr] fortune,
    contentment, may He shower You with every blessing, and may He, just as Your Serene Highness truly
    deserves, let all grief and cares become strangers to You, most gracious Prince, from now on.


    These are the substance of my most faithful wish on this important day. — For the rest, the Attorney
    General Count Lipski, the President of the Tribunal Smogorzewski, the Councillor of the Tribunal Rembowski,
    the Councillor of the Tribunal Michalski, and the Councillor of the Tribunal Sobocki most humbly thank
    Your Most Serene Highness for the fine game. The effect will shortly show itself in the decision of
    the Olesnice and Wrąbczyn matter. With the sub-prefect Brzechsta I have, sub spe rati, concluded the
    lease contract for the Zagorowo estates alone, at 20000 Rthl. On the 8th of February I intend to arrive
    with him in Schlawenschitz, where the contract can then be concluded by Your Serene Highness'

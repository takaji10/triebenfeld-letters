- page: 2
  en: 'itself in due binding form (in forma probante). Whatever Mr von Brzechffa will be able to gather
    together in ready money in the haste will be brought along. At present the daily new taxes still eat
    away too much. All the interest is secured, and there still remain over to Your Serene Highness several
    thousand d yearly; also the Bayonne capital will be completely amortised. In the meantime, so far
    as the ready money is concerned, only the gain in both the lawsuits named overleaf will first bring
    true wegen. The documents sent to me were handed in to the authority the day before yesterday — Not
    only is every dispute removed, but the benefit may perhaps accrue to Your Serene Highness that the
    taxes would be reduced pro Inturo. It comes down to a sacrifice, which Mr von Brzechffa will advance
    if it should be required. For the rest, Your Serene Highness will receive the original documents back
    after imitated use.


    The Parobeck follows, and if it succeeds we shall bring along an even bigger dog.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Blizanow


    the 27th of January 1812


    faithful, most humble and obedient servant


    v Triebenfeld'

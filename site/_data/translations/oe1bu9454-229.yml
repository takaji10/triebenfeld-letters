- page: 2
  en: 'itself in due form. Whatever Mr. von Brzechsta will be able to bring together in ready money in
    the haste will be brought along. At present the daily new levies still eat away too much. All the
    interest is secured, and there still remain several thousand d annually to Your Serene Highness; the
    Bayonne capital will also be fully amortised. In the meantime, as regards the ready money, only the
    gain in both of the suits named overleaf will first bring true [uncertain: wegen]. The documents sent
    to me were submitted to the authority the day before yesterday. – Not only is every dispute removed,
    but the benefit may perhaps accrue to Your Serene Highness that the levies would be mitigated pro
    futuro. It would depend on a sacrifice, which


    Mr. von Brzechsta will advance should it prove necessary. For the rest, Your Serene Highness will
    receive the original documents back after the use made of them.


    The Parobeck follows, and if it succeeds, we shall bring along a still larger dog.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Blizanow


    the 27th of January 1812


    faithful and most humble and obedient servant


    v. Triebenfeld'

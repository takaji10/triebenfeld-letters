  en: '229


    Most Serene Prince


    Most gracious Prince and Lord!


    Upon this important day, which is a brother of that one on which You first beheld the light of the
    world, and which will remain the jewel among the lesser of its successors, I cannot lay myself personally
    at the feet of Your Most Serene Highness and offer my faithful and sincere wishes. I can do it we
    still in writing, but let it be just as heartfelt — May God let Your Most Serene Highness live to
    see at least 50 more days of this kind; may He grant You the most lasting health, [uncertain: Wuhr]
    good fortune, contentment, may He pour out upon You every blessing, and may He let all grief and care
    become strangers to You, most gracious Prince, from now on, as Your Serene Highness truly deserves.


    These are the substance of my most faithful wish upon this important day — For the rest, the general
    procurator Count Lipski, the president of the tribunal Smogorzewski, the councillor of the tribunal
    Rembowski, the councillor of the tribunal Michalski, and the councillor of the tribunal Sobocki most
    humbly thank Your Most Serene Highness for the fine game. The effect will shortly show itself in the
    decision of the Oleśnica and Wrąbczyn case. With the sub-prefect Brzechffa I have concluded, subject
    to ratification (sub spe rati), the lease contract for the Zagórów estates alone, at 20000 rt. On
    the 8th of February I intend to arrive with him at Sławięcice, where the contract may then be concluded
    by Your Serene Highness'

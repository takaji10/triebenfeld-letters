status: draft
segments:
- page: 1
  en: 'Your Right Honourable, Most gracious Lord Councillor of War! — he is indeed a rhymeless [uncertain:
    rascal]! — He has made His Serene Highness a great deal of difficulty in order now to arrive at the
    desired end, and now that he [unparseable: rihm mag] that there is nothing more to be squeezed out,
    now he wants to conclude the whole matter. — Would that Heaven granted but once a favourable moment,
    such as the present one is; the fellows should get the snow-distress, who now [unparseable: den geüdigete
    würde], so press. But if it were now soon settled, so that Your Right Honourable should not be aggrieved
    any longer, and then came into the [uncertain: Jusend], on account of the greeting of v. Schlabrendorff
    too the strings would be strung in the manner which Your Right Honourable has already often had the
    graciousness to express. With my own affair matters do not stand well, but neither do they stand ill.
    — The L. Asch [uncertain: jen] means to [unparseable: zullen],'
- page: 2
  en: 'but it shall not succeed for him, and therefore I have given notice in [unparseable: bring], whence
    I still expect back this day the [uncertain: Bethe], together with the declaration. Within a few days
    it must be [unparseable: alleinl.] done, — upon that Your Right Honourable may certainly rely, and
    likewise that which you [uncertain: in großen Wechseln — in large bills of exchange], and that you
    will soon get the [uncertain: Jaunken] back; the [uncertain: Schöpfe] fetched again on Tuesday, at
    the latest Wednesday; — until then I most humbly beg that they may still be left standing. With my
    health it grows better hourly, — tomorrow I shall go out. For the gracious sympathy I give most humble
    thanks; I commend myself to your continuing grace, and have the honour to sign myself, with high esteem,
    as Your Right Honourable''s Berlin[?], the 2nd of May 1802. humble and obedient servant Frig[?]'

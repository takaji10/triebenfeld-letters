- page: 2
  en: 'basis of these instruments of grant and of the deed of resignation made out on the 29th of March
    1802, by virtue of the decree of the 29th of March 1802.


    Thereupon are entered:


    I. Perpetual burdens and restrictions upon the property, or upon the disposition thereof.


    1. is cancelled


    2. is cancelled.


    3. 2470 Rthl 16 Groschen 3 Pfennig, written out two thousand four hundred and seventy Reichsthaler,
    sixteen Groschen three Pfennig, being the annual maintenance allowance accruing therefrom to the former
    ecclesiastical possessors of these estates, payable to the War and Domains Treasury at Poznań in quarterly
    instalments in advance; which allowance, together with those 100 Rthl, 11 1/10 d, written out one
    hundred Thaler four Groschen, eleven and one tenth Pfennig, which were provisionally noted above the
    line as an allowance out of the forest revenues pending the closer ascertainment of the latter, and
    the demanding of which has been further deferred, have been entered upon the basis of the produced
    attestation of the War and Domains Chamber at Poznań of the 4th of January 1803, at the application
    of the Lord proprietor, in the place of the indeterminate allowance intabulated under No. 1 at the
    entry of his title of possession by the decree of the 29th of March 1802 and now cancelled, by virtue
    of the decree of the 17th of January 1803.


    II. Judicially secured debts and other real obligations.


    1. is cancelled


    2. 48000 Rthl, written out forty-eight thousand Thaler Courant, which the Lord'

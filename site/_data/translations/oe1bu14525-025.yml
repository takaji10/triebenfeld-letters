- page: 5
  en: 'interest, damages and costs. Entered upon the basis of the judicial bond of debt dated Wrocław
    the 26th of March 1803, at the application of the special authorised representative of the Lord proprietor,
    presented the 2nd of July 1803, by virtue of the decree of the 11th of the same month and year. Apart
    from the foregoing items, nothing is entered in the mortgage book against the lordship of Pszczew
    or Pszczew; and for the rest, the present mortgage certificate is hereby granted to the Building and
    Economy Councillor Johann Wilhelm Glenck by way of acknowledgment, on account of the 5000 Rthl Courant
    entered for him under No. 6 of the judicially secured debts upon the basis of the judicial bond of
    debt dated Wrocław the 26th of March 1803. In witness whereof, under the signature appointed by the
    Royal South Prussian Government and the greater seal. Given at Poznań the 29th of August 1803. von
    Braunschweig


    Bormann


    Fest.


    Mortgage certificate for the Building and Economy Councillor Johann Wilhelm Glenck concerning the
    lordship of Pszczew or Pszczew situated in the Poznań District.


    That the foregoing copy has been found entirely to agree with the original mortgage certificate communicated
    to me by the princely building councillor, the Lord Glenck, I have hereby been bound to attest in
    good faith.


    So done at Wrocław the 8th of December 1803. Johann Jacob Wünster, Royal Court and Criminal, also
    Judicial Commission Councillor, and notary public of the [uncertain: Boes] Obligations Department'

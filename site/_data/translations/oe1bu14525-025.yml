- page: 4
  en: 'the Łowyń oak wood. Entered upon the basis of the judicial bond of debt given at Wrocław the 26th
    of April 1803, at the application of the special authorised representative of the Lord proprietor,
    presented the 2nd of July 1803, by virtue of the decree of the 11th of the same month and [illegible].


    5. 5000 Rthl, written out five thousand Reichsthaler Courant, according to the coinage standard of
    176, which the Lord proprietor has become owing to the widowed chief district councillor''s wife Christiane
    Dorothea Michaelis, born Eichborn, at Wrocław, at five per cent in half-yearly instalments, namely
    payable at Midsummer and Christmas, against repayment within six years reckoned from the 26th of March
    1803, and against a right of half-yearly notice of termination standing open to the Lord debtor at
    all times but to the lady creditor within the six years only [uncertain: if] either the interest remains
    in arrears longer than a year, or if a change of possession of these estates occurs; and has, for
    security on account of the capital, the interest, damages and [uncertain: otherwise], pledged this
    lordship. Entered upon the basis of the judicial bond of debt dated Wrocław the 26th of March 1803,
    at the application of the special authorised representative of the Lord proprietor, presented the
    2nd of July 1803, by virtue of the decree of the 11th of the same month and year.


    6. 5000 Rthl, written out five thousand Reichsthaler Courant according to the coinage standard of
    1764, which the Lord proprietor has become owing to the Building and Economy Councillor Johann Wilhelm
    Glenck, who stands in his service, at five per cent interest to be paid yearly at St George''s Day,
    against repayment after six years reckoned from the 26th of March 1803, and after half-yearly notice
    of termination given thereupon; the right of half-yearly notice, however, stands open within those
    six years also, to the Lord debtor at any time, but to the creditor only upon a change of possession
    of these estates occurring; and this lordship is pledged for capital, interest,'

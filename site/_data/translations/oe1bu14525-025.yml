- page: 3
  en: 'proprietor has become owing to the Building and Economy Councillor Johann Wilhelm Glenck, who stands
    in his service, according to the judicial instrument of debt given at Wrocław the 2nd of January 1803,
    at interest of 5 per cent and with six months'' notice of termination free to both parties, likewise
    against the pledging of this lordship, save however for the Łowyń heath, for capital, interest and
    costs; and which have been entered at the Lord proprietor''s own application, presented the 15th of
    January 1803, by the decree of the 17th of January 1803.


    3. 2000 Rthl, that is two thousand Thaler in Courant, according to the coinage standard of the year
    1764, which the Lord proprietor, according to the judicially acknowledged instrument of debt of the
    26th of April 1803, has borrowed from the merchant Abraham Moses Hirschel at Wrocław, at interest
    of five per cent in half-yearly instalments, with reservation of half a year''s notice of termination
    and the pledging of this lordship, on account of capital, interest, damages and costs; and which have
    been entered at the creditor''s request, presented the 14th of May 1803, by the decree of the 16th
    of the same month and year.


    4. 5000 Rthl, written out five thousand Thaler Prussian Courant according to the coinage standard
    of 1764, which the Lord proprietor has become owing to the Baron von der Marwitz of Rudnik, at five
    per cent interest payable yearly at St George''s Day, against repayment within six years reckoned
    from St George''s Day 1803, further against the right of half-yearly notice of termination, which
    stands open to the Lord debtor at all times but to the creditor within the six years only if either
    the interest remains in arrears for more than a year after the expiry of an interest term, or if a
    change of possession occurs with these estates; and has, for security on account of the capital, the
    interest, damages and costs, pledged this lordship, save however with the exclusion of'

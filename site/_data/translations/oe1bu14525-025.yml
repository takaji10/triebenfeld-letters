- page: 1
  en: 'The noble lordship of Pszczew or Pszczew, lying under the jurisdiction of the Royal South Prussian
    Government at Poznań in the Poznań District, with the following appurtenances: the village of Świechocin,
    the village of Stoki, the village of Łowyń, the village of Głażewo, the village of Dormowo, the village
    of Stołuń, the village of Kuligowo, the village of Szarcz, the bailiwick of Zielomyśl and Silna, the
    Hollander settlements, the Pomcher Hollander settlement, and the Heidemühle: these the reigning Prince,
    the Lord Friedrich Ludwig of Hohenlohe-Ingelfingen, has received in hereditary and proprietary grant
    as formerly ecclesiastical estates, having once belonged to the Cathedral Chapter at Poznań, following
    the confiscation of all ecclesiastical estates in South Prussia, by virtue of the instruments of grant
    of His Majesty Friedrich Wilhelm the Second, dated Berlin the 19th of June 1797, and of His Majesty
    King Friedrich Wilhelm the Third, Berlin the 1st of December of the same year; and the title of possession
    for the same has been entered on the'

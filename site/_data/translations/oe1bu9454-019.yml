- page: 4
  en: 'devil — I mean it toward you heartily, honestly and well; I [uncertain: suffer] both morally and
    physically; my children often go hungry with me, and that because I am too grievously entangled in
    your affairs; I suffer and endure with mine, but everything possible — it must after all one day become
    better; we are once for all woven together and, so to speak, married; we must now [uncertain: after
    all] hold out and pull at the same rope with one another. We shall yet have many a struggle to sustain,
    but with God''s assistance I hope still to prevail in every way for us both. That [uncertain: Sommer]
    thus shot past beside the mark, and that you say the [uncertain: pressure] will not last long, gives
    me great joy — Mr. S. is a wicked man; he said he had not a Groschen for the return journey and that
    his horse was galled; I had 4 Rthl., which I gave him, and afterwards, one after another, he had much
    Gold about him. Horse'

- page: 1
  en: 'Appendix.


    2) 6 July 1812 The business with the gentlemen before Sobottendorff is of the greatest importance
    to Your Serene Highness; you are putting off a man to whom you owe 40000 Rthl, and you lose nothing
    of your present revenues, still less do you diminish the substance of your estates — 18 years [uncertain:
    runs] the lease — the interest you keep free and no creditor may [text lost] It is a great lease,
    but from whence is the man to be satisfied?


    Meanwhile this too can only succeed now because I have come to an agreement with Tschachmann or Cybalski
    and with Hainrich — to whom, however, on account of 1300 Rthl of relinquishment I must give a mortgage
    upon my Blizanow. All these grounds, together with the buildings and some meadows still remaining,
    I lease to Mr. von Sobottendorff for 18 years for 36000 Rthl; if he is a good husbandman he can bring
    it out, the soil is very good. — I note to myself'

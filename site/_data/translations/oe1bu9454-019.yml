- page: 3
  en: 'death and the devil fetch him away again. For the lawsuit at Warsaw 300 Rthl will now quickly be
    required; almighty God knows where I am to take them from — but win the suit I must, for through it
    we obtain not only air on every side but also hard money to [uncertain: offer for baiting].


    Concerning the Wytwiver suit I shall probably receive news today or tomorrow — that one must be won,
    and then you will get 4000 Rthl in cash interest; the matter has nothing whatever to do with the one
    here; I am having it pursued through Salz so that the creditors [text lost] nothing further. Then
    the coarse [uncertain: Schliefen] will also have his mouth stopped, and a disgrace will be taken from
    me and from my [uncertain: Schweiner].


    But do not, my Prince, let yourself be advised again by shifty people, and [uncertain: issue] an instrument
    other than the one I have prescribed — for otherwise the whole goes to the'

  en: '19


    Appendix.


    6 July 1812 The business with Mr [uncertain: for] Sobottendorff is of the greatest importance for
    Your Serene Highness; you dispose of a man to whom you owe 40,000 Rthl, and you lose nothing of your
    present revenues, still less do you diminish the substance of your estates, 18 years [illegible] it
    lease — you keep the interest free and no creditor may not grant It is a large lease, but from where
    is the man to be satisfied?


    Meanwhile this too can only succeed now, because I have come to terms with Tschachmann or Cybalski
    and with Hawich, to whom, however, I must give a mortgage on my Blizanow on account of 1,300 Rthl
    surrender money; all these lands, together with the buildings and some meadows still remaining, I
    lease to Mr von Sobottendorff for 18 years for 36,000 Rthl. [uncertain: rt er um guter Wirth] so he
    can bring it out of it, the soil is very good. — [uncertain: To me] observe'

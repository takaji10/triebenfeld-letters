- page: 4
  en: 'devil — I mean it towards you heartily, honestly and well, I both morally and physically, my children
    often go hungry with me, and that because I am too badly entangled in your affairs; I suffer and endure
    with my own, but everything possible — it must after all get better once; we are once and for all
    woven together and, so to speak, married; we must [uncertain: abhobet] now hold out and pull on the
    same rope with one another. We shall yet have many a struggle to sustain, but with God''s assistance
    I hope still to prevail in every way for us both. That [uncertain: Sommes] shot so wide past the mark,
    and that you say the [uncertain: pressure] will not last long, greatly pleases me — Mr S. is a wicked
    man; he said he had not a Groschen for the return journey and that his horse was galled as well; I
    had 4 Rthl, I gave them to him, and afterwards, one thing and another, he had a great deal of gold
    about him, horse'
  names:

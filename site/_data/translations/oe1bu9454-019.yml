- page: 2
  en: 'that all this must happen very quickly. I await most longingly the arrival of the gentlemen von
    Sobottendorff. Let Your Serene Highness see to it that the people come here quickly, and [uncertain:
    send] me as speedily as possible the instrument as I have prescribed it to you, for Your Serene Highness
    can only authorise me to collect monies which are free — but here everything is at present laid under
    arrest, and I can only seek to obtain monies as a creditor — the French G. decree entitles me before
    all others — by the instrument you are to issue I wish only to choose the shortest road to getting
    money and to keeping the machinery in motion until I prevail. From nowhere can I take anything; daily
    there are outlays, the messengers cost, without the carriage-hire, [uncertain: an overrunning sum];
    today already 2 [uncertain: places] have again been sent to Kalisz and to Kopojer and Ko; the cursed
    Lorenz devours, makes away with everything along with the judges, and when one has won one over, then'

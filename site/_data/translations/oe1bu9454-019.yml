- page: 3
  en: 'death and the devil fetch him away again. For the lawsuit at Warsaw 300 Rthl will now quickly be
    required; Almighty God knows where I am to take them from — but win the lawsuit I must, for by it
    we obtain not only breathing space in every direction but also hard money to [uncertain: hätze] offer.
    Concerning the Witów lawsuit I shall probably receive news today or tomorrow — that one must be won,
    and then you will receive 4,000 Rthl in cash interest; the matter has nothing whatever to do with
    the one here, I am having it pursued through Salz so that the creditors get no scent of it. Thereby
    the coarse Schliefen will have his mouth stopped too, and a disgrace will be taken from me and from
    my Schweiner.


    But do not, my Prince, let yourself be advised again by shifty people and send a different instrument
    from the one I have drafted — for otherwise everything goes to the'

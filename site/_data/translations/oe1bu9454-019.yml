- page: 2
  en: 'that all this must be done very quickly. I most ardently await the arrival of Mr von Sobottendorff.
    Let Your Serene Highness take care indeed that the people come here quickly, and send me as speedily
    as possible the instrument as I have drafted it for you, for Your Serene Highness can only collect
    monies, [uncertain: to me] authorise those that are free — but here at present everything is laid
    under arrest and I can only seek to procure monies as a creditor — the French G. decree entitles me
    before all others — by the instrument you are to issue I wish only to choose the shortest way to obtain
    money and to keep the machine running until I prevail. From nowhere can I take anything; daily there
    are expenses, the messengers'' costs, without the carting, [illegible] running over, so that today
    already 2 [uncertain: Ortl.] have again been sent to Kalisz and to Kopojno and Konin, the cursed Lorenz
    devours, and altogether everything goes off with the judges, and when one has won one over, then'

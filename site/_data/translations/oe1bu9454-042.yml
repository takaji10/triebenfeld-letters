- page: 6
  en: 'ceded his claim, I have here framed a suit in which I am having him proceeded against by the public
    prosecutor — for he reckons up to himself [uncertain: prore]netica and God knows what else — He pretends
    to have 105/m rt to claim, which is at bottom a lie — He has 72/m rthl to claim of me, and this, once
    the suit is decided, will be deposited here in Berlin in papers, and then all will be in order there.


    With the Invalids'' Fund and all the debts, 122000 rt would come out.


    I have here a merchant who will take iron and other products too, and will give money. If one were
    in a position to raise 60000 rt, one would have 120000 rt, as the papers now stand, and could face
    everything down — Were the papers to fall again to 30 per cent, one could settle everything for 40000
    rt at the most — the plan has long been drawn up by me; were I only out of here first, then all would
    soon come into the clear.


    Lay my petition to heart, Your Serene Highness, and see to it that I am rescued and set at liberty.
    I will willingly endure every hardship, travel day and night; only of my'

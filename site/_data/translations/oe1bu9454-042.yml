- page: 3
  en: 'bankers do, and to get out of the affair, I bought and sold papers to advantage, so that I now
    have the whole 9000 rt for Coste together again, and nothing further is wanting but the cash interest,
    amounting to 340 rt. Once I have this, this entire sum is discharged and fully settled. Meanwhile
    Lahr has sued me for the 3000 rt still coming to him, and is impeding my departure.


    I have deposited papers for it, but I may not leave until the matter is smoothed out.


    By the common law he must now be content with papers. Meanwhile I must pay the difference, and this
    amounts, first, upon the Coete papers, as said above, to 340 rt; second, interest, court and other
    costs, 568 rt.


    3. For two bonds on which I still owe the whole bill of exchange, 360 rt.


    4. For 2 bonds lying in deposit, 800 rt; sum total 2068 rt. These 2068 rthl must be procured and paid;
    thereupon this exceedingly fatal business is lifted and settled, and I can travel where I will.


    If it is in any way possible for Your Serene Highness in the world, do drive'

- page: 5
  en: 'away from here, and must sit here until help comes. From my estates I now have nothing; the taxes
    are too oppressive — I still do not know how I am to be rid of the sequestrator in Kontop, and the
    longer I sit here the greater is my loss!


    The damage I suffer is dreadful. Your Serene Highness knows that I never complain, but now the water
    is at my throat. I beg you, most gracious Lord, have mercy and see to it that I now soon receive the
    2068 Rthl, so that I may come into freedom. From the French General Government the order has been
    sent to the Ministry of Justice at Warsaw that the sequestration on account of the Invalids'' Fund
    is to be lifted, and also that the interest extorted from [uncertain: one] is to be repaid out of
    the estates — these Your Serene Highness can collect yourself against the original dispositions, and
    in that way you lose nothing, and I may well be indemnified for the cover of the costs I have had
    here. As regards the sequestration otherwise imposed at Zagorowo, I have had the proper protestations
    entered, and against the Jew Oppenheimer, who to the'

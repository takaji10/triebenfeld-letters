- page: 6
  en: '[uncertain: Bau] has ceded his claim, I have here framed a suit in which I am having him prosecuted
    by the fiscal authority — for he reckons up to himself [uncertain: prorenetica] and God knows what
    besides. He pretends to have 105000 to demand, which at bottom is a lie — He has 72000 Rthl to demand
    of me, and this, once the suit is decided, will be deposited here in Berlin in paper, and then everything
    there is in order.


    With the Invalids'' Fund and all the debts, 122000 Rthl would come out.


    I have here a merchant who will take iron and other produce too, and will give money; if one were
    in a position to raise 60000 Rthl, one would have 120000 Rthl, as the paper now stands, and could
    offer everything [uncertain: head for head] — Were the paper to fall again to 30 per cent, then one
    could settle everything for at most 40000 Rthl — the plan has long since been drawn up by me; were
    I only first out of here, then everything should soon be brought clear.


    Lay my petition to heart, Your Serene Highness, and see to it that I am rescued and set at liberty.
    I will willingly endure every hardship, travel day and night, only of my'

- page: 3
  en: 'bankers, to profit from the speculation in paper and to get out of the affair, I bought and sold
    paper to advantage, so that at present I have the whole 9000 Rthl for Coste together again, and nothing
    further is wanting but the cash interest of 340 Rthl. Once I have that, this entire sum is discharged
    and wholly settled. Meanwhile Lahr has sued me over the 3000 Rthl still coming to him, and is hindering
    my departure. I have deposited paper for it, but I may not leave until the matter is [uncertain: cleared].
    Under the provincial law he must now be content with paper. Meanwhile I must pay the supplement, and
    this amounts, first, on the Coste paper, as said above, to 340 Rthl


    2. further interest, court and other costs 568


    3. For two bonds on which I still owe the whole bill of exchange.


    360


    4. For 2 bonds lying in deposit 800


    coming to 2068. These 2068 Rthl must be procured and paid; then this exceedingly vexatious business
    is lifted and settled, and I can travel where I will.


    If it is in any way in the world possible for Your Serene Highness, then drive'

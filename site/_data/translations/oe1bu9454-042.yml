- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    If ever a human creature has been pressed down by want and tribulation and scourged through every
    class of suffering, then I am he now. It is now over a year since I was sent hither to effect this
    and that here, and then to return from here by way of Vienna to Königsberg.


    Just as I was on the point of departing from here, I was seized by French gendarmerie on the order
    of the General Government and for that reason placed under strict arrest, namely that I, as Your Serene
    Highness''s authorised representative, should at once pay to the Invalids'' Fund the arrears of interest
    amounting to 3521 Rthl. The affair excited a terror by which my honour and credit suffered. Against
    surety given by the Chamber Court Councillor von Trevinitz and the innkeeper Mathien I was released
    from my arrest for 4 weeks, with the observation that within that time I should procure the 352) and
    pay the same together with costs to the French intendant Maluce in cash, in hard Courant, failing
    which I, together with my [uncertain: Coventin], should be taken into arrest anew.


    During these 4 weeks, then, the money had to be procured'

- page: 7
  en: 'liberty I will not and cannot be deprived. I am paralysed in everything; the very thought strikes
    down all my courage and makes me incapable of anything.


    From Königsberg I have had letters of the 8th of this month; something consoling is written with regard
    to Your Serene Highness, and in particular Mr. G. von K. is said to have taken up Your Serene Highness''s
    affairs with great [uncertain: earnestness]. After the return of the post from Petersburg a good outcome
    is looked for — Whether Const. will indeed effect anything good remains to be seen. He promised much
    — Only I no longer put much trust nowadays in such gentlemen''s promises. I have been deceived too
    much and too often; I have also suffered too greatly, physically and morally, so that I still fear
    I shall become the worst of misanthropes. The Princess Sacken is said to be quite well. They have
    quartered General Decke upon her, with which she is very dissatisfied. Help speedily, Your Serene
    Highness, that I may get free from here, for then I shall fly to lay myself at your feet. In deepest
    reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 16th of January


    1809.


    faithful and most obedient servant


    v Triebenfeld'

- page: 4
  en: 'such together over there and send it with all haste to Kontop; otherwise I cannot stir from the
    spot — and yet it would be very good if I might wait upon Your Serene Highness in person, for I myself
    do not know how to help myself. Through this business of my having been arrested here I lost credit
    and health; my creditors awoke on every side and to this day are sequestrating Kontop upon me. I cannot
    go there myself, for I am under arrest here on Your Serene Highness''s account. What pains me most
    is that Mathieu means in the end still to hold back the remainder, since I still owe him 1500 Rthl
    in coin. 2083 Rthl I have already paid him, and 1500 Rthl are still coming to him; on that account
    the man will not let me travel.


    For nearly 6 months, on top of all this vexation, I lay very wretchedly ill, and this business too
    costs me some 300 Rthl here, since I have had to pay 170 Rthl to the doctor and to the apothecary.
    Never has misfortune pursued me as it has this year here. Yet this too will be got over, if only I
    receive the 2068 Rthl so that I can bring the Lahr matter entirely clear.


    Find counsel for this, Your Serene Highness, I beg you heartily and urgently; otherwise I cannot get'

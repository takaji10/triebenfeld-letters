- page: 7
  en: 'liberty I will not and cannot be deprived. I am paralysed in everything; the very thought beats
    down all my courage again and makes me incapable of anything.


    From Königsberg I have had letters of the 8th of this month; they write something consoling with regard
    to Your Serene Highness, and in particular General von Köckritz is said to have taken up Your Serene
    Highness''s affairs very zealously. After the return of the post from Petersburg a good issue is promised
    — Whether Constantine will indeed effect any good remains to be seen. He promised much — Only I no
    longer put much trust nowadays in such gentlemen''s promises. I have been too greatly and too often
    deceived; I have also suffered too much physically and morally, so that I still fear I shall become
    the worst of misanthropes. The Princess Sacken is said to be quite well; they have quartered General
    Dercke upon her, with which she is very discontented. Help speedily, Your Serene Highness, that I
    may get free from here, for then I shall fly to lay myself at the same''s feet. In deepest reverence
    I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 16th of January


    1809.


    faithful and most obedient servant


    v Triebenfeld'

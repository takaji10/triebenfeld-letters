- page: 5
  en: 'away from here, and must sit here until help comes. From my estates I now have nothing; the taxes
    are too oppressive — I do not yet know how I am to be rid of the sequestrator in Konotop, and the
    longer I sit here the greater is my loss!


    The damage I suffer is appalling. Your Serene Highness knows that I never complain, but now the water
    is up to my throat. I beg you, most gracious Lord, have mercy and see to it that I receive the 2068
    rt soon now, so that I may come into freedom. From the French General Government the order has been
    sent to the Ministry of Justice at Warsaw that the sequestration on account of the Invalids'' Fund
    is to be lifted, and also that the interest extorted from one is to be repaid out of the estates —
    these Your [uncertain: Serene Highness] can then recover yourself against the original dispositions,
    and in that way you lose nothing, and may well indemnify me for the covering of the costs I have had
    here. As to the sequestration otherwise imposed in Zagórów, I have had the proper protestations lodged,
    and against the Jew Oppenheimer, who [text lost] the Bau'

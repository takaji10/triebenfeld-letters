status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! If ever a human creature was pressed by need
    and tribulation and driven through every class of suffering, it is I now. It is now over a year since
    I was sent hither in order to effect one thing and another here, and thence to return by way of Vienna
    to Königsberg. Just as I was on the point of departing from here, I was seized by French gendarmerie
    on the order of the [uncertain: Er] General Government and placed under strict arrest for this cause:
    that I, as Your Serene Highness''s plenipotentiary, was at once to pay to the Invalids'' Fund the
    arrears of interest amounting to 3521 Rthl. The affair excited a terror by which my honour and credit
    suffered. Upon security given by the Councillor of the Kammergericht von Trevinitz and the innkeeper
    Mathien, I was released from my arrest for 4 weeks, with the observation that I should procure the
    [uncertain: 352] under [uncertain: das] and pay the same, together with costs, in cash in hard Courant
    to the French intendant Maluce, failing which I, together with my sureties, should be drawn into arrest
    anew. During these 4 weeks the money now had to be procured.'
- page: 2
  en: 'To obtain this sum in cash was a work of impossibility; I had to take paper at its nominal value,
    and to promise in return to repay cash Courant after 3 months. The honest Minister v Zastrow gave
    a pledge and not a joint bill of exchange, which [uncertain: Erwunden] and I signed jointly. The time
    passed quickly and the merchant von der Lahr demanded 5000 Rthl together with interest. For the sake
    of Herr p v Zastrow and Grevenister I had to find counsel quickly – I therefore took from the dyer
    Coste 9000 Rthl in state paper at 6 pft interest, which was lodged as cover, and with it the Zactrow
    pledge and the bill of exchange were redeemed. Cote had given me the state paper on the condition
    that I should return the same to him in just such paper. The paper stood very low at that time; I
    could not sell it, but pledged it, and that again cost heavy per cents and commission. In the meantime
    the 3000 Rthl from Your Most Serene Highness came in; out of these I at once paid 2153 Rthl in cash
    to Lahn and bought paper with the remainder. Hecker gave 4000 Rthl in paper as security; this I pledged
    again for 1000 Rthl and paid interest and costs. In order meanwhile to profit from the agiotage like
    all bank'
- page: 3
  en: 'bankers do, and to get out of the affair, I bought and sold paper to advantage, so that I now have
    the whole 9000 Rthl for Coste together again, and nothing further is wanting but the cash interest
    of 340 Rthl. Have I this, then this whole sum is [uncertain: settled] and entirely discharged. In
    the meantime Lahr has sued me on account of the 3000 Rthl still owing to him, and hinders my departure.
    I have deposited paper for it, but I may not go away until the matter is [uncertain: applauirt]. According
    to the Landrecht he must now be content with paper. Meanwhile I must pay the additional contribution,
    and this amounts, firstly, upon the Coeten paper, as said above, to 340 Rthl; 2ndly, [uncertain: taus]
    interest, court and other costs 568; 3rdly, for two bonds which I still owe entirely as bills of exchange
    360; 4thly, for 2 bonds lying in deposit 800; making 2068. These 2068 Rthl must be procured and paid;
    then this exceedingly fatal business is lifted and settled, and I can travel where I will. If it is
    in the world possible for Your Serene Highness, then drive'
- page: 4
  en: 'such together there and send the same with all haste to Kontop; otherwise I cannot stir from the
    spot – and it would nevertheless be very good were I permitted to wait upon Your Serene Highness in
    person – for I myself do not know how to help myself – through this business of my having been arrested
    here I lost credit and health – my creditors awoke on every side and are sequestrating Kontop from
    me to this very day. I cannot go there myself, for I am here in arrest on Your Serene Highness''s
    account – what pains me most is that Mathieu means in the end still to hold me to the remainder, because
    I still owe him 1500 Rthl in coin; 2083 Rthl I have already paid the [uncertain: B], and 1500 Rthl
    still come to him, and on that account the 2 will not let me travel. For nearly 6 months I lay, on
    top of all this vexation, very wretchedly ill, and this business too costs me here some 300 Rthl,
    in that I have had to pay the doctor 170 Rthl and the apothecary. Never has misfortune pursued me
    so as in this year here. Meanwhile this too will have been got over, if only I receive the 2068 Rthl
    so as to be able to bring the Lahr matter entirely clear. To this end let Your Serene Highness find
    counsel; I beg you heartily and urgently for it; otherwise I cannot'
- page: 5
  en: 'get away from here, and must sit here until help is given. From my estates I now have nothing;
    the taxes are too oppressive — I do not yet know how I am to be rid of the sequestrator at Kontip,
    and the longer I sit here the greater is my loss! The damage I suffer is dreadful. Your Serene Highness
    knows that I never complain, but now the water is at my throat. I beg you, most gracious Lord, have
    mercy and see to it that I receive the 2068 Rthl soon, that I may come into liberty. From the French
    General Government the order has been sent to the Ministry of Justice at Warsaw that the sequestration
    on account of the Invalids'' Fund shall be lifted, and also that the interest extorted from [uncertain:
    one] shall be repaid out of the estates – these Your Serene Highness can [uncertain: den] draw yourself
    against the original dispositions, and in that manner you lose nothing, and can well indemnify me
    in cover of the costs I have incurred here. As regards the sequestration otherwise imposed at Zagorowo,
    I have had the proper protestations lodged, and against the Jew Oppenheimer, who at the [text lost]'
- page: 6
  en: 'has ceded his claim, I have here framed a lawsuit in which I am having him proceeded against fiscally
    – for he reckons up to himself prorenetica and God knows what besides – He gives out that he has 105000
    [uncertain: rind] to demand, which at bottom is a lie — He has 72000 Rthl to demand of me, and these
    will be deposited here in Berlin in paper once the lawsuit is decided, and then all is in order there.
    With the Invalids'' Fund and all the debts, 122000 Rthl would come out. I have here a merchant who
    will take iron and other produce also, and will give money; if one were in a position to raise 60000
    Rthl, then one would have 120000 Rthl, as the paper now stands, and could offer everything [uncertain:
    Tete] – Were the paper to fall again to 30 per cent, then one could settle everything for at most
    40000 Rthl – the plan was long since drawn up by me; were I but once out of here, then all should
    soon be brought clear. Let Your Serene Highness take my petition to heart and see to it that [uncertain:
    I] be rescued and set at liberty. I will willingly endure every hardship, travel day and night, only
    of my'
- page: 7
  en: 'liberty I will not and cannot be deprived. I am crippled in everything; the very thought beats
    down all my courage and makes me incapable of anything. From Konigsberg I have had letters of the
    8th of this month; they write something consoling with regard to Your Serene Highness, in particular
    the Herr G. v. K. is said to have taken up Serene Highness''s affairs with much [uncertain: Erschrifung].
    Upon the return of the courier from Petersburg a good issue is looked for – Whether Const. will indeed
    effect good remains to be seen. He promised much – Only I no longer put much trust nowadays in such
    gentlemen''s promises. I have been too much and too often deceived; I have also suffered too greatly,
    physically and morally, so that I still fear to become the worst of misanthropes. The Princess Sacken
    is said to be quite well. They have quartered General Decke upon her, with which she is very dissatisfied.
    Let Your Serene Highness help speedily, that I may get free from here, for then I shall hasten to
    lay myself at the same''s feet. In deepest reverence I remain, until death, as Your Most Serene Highness''s
    Berlin, the 16th of January 1809. faithful and most obedient servant v Triebenfeld'

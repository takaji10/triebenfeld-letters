- page: 2
  en: To obtain this sum in cash was a work of impossibility; I had to take paper at its nominal value,
    and in return promise to repay cash Courant after 3 months. The honest Minister von Zastrow gave a
    pledge and no joint bill of exchange, which [illegible] and I signed with him. The time ran out quickly
    and the merchant von der Lahr demanded 5000 Rthl together with interest. For the sake of Mr. von Zastrow
    and Grevenister I had to find counsel quickly — I therefore took from the dyer Coste 9000 Rthl in
    state paper at 6 per cent interest, which was deposited as cover, and with it the Zastrow pledge and
    the bill of exchange were redeemed. Coste had given me the state paper on the condition that I should
    return the same to him in precisely such paper. The paper stood very low at that time; I could not
    sell it, but pawned it, and that again cost heavy percentages and percentage charges. Meanwhile the
    3000 Rthl from Your Most Serene Highness came in; of this I at once paid 2153 Rthl in cash to Lahn
    and bought paper for the remainder. Hecker gave 4000 Rthl in paper as surety; this I pawned again
    for 1000 Rthl and paid interest and costs. In order meanwhile, like all bank

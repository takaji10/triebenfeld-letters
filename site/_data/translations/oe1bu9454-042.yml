- page: 1
  en: '42


    Most Serene Prince,


    Most gracious Prince and Lord!


    If ever a human creature has been pressed down by need and tribulation and whipped through every class
    of suffering, I am he now. It is now over a year since I was sent hither, in order to effect one thing
    and another here, and then to return from here by way of Vienna to Königsberg.


    Just as I was on the point of departing hence, I was seized by French gendarmerie on the order of
    the General Government and for that reason placed under strict arrest, namely that I, as Your Serene
    Highness''s authorised representative, was to pay at once to the Invalids'' Fund the arrears of interest
    amounting to 3521 rt. The affair excited a terror by which my honour and credit suffered — Against
    surety of the councillor of the Chamber Court von Grevenitz and the innkeeper Mathieu I was released
    from my arrest for 4 weeks, with the observation that within that time I should procure the 3521 and
    pay the same, together with costs, in cash in hard Courant to the French Intendant Maluce[uncertain
    reading], failing which I, together with my sureties, should be taken into arrest anew.


    During these 4 weeks, then, the money had to be procured'

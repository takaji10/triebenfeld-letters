- page: 2
  en: 'To obtain this sum in cash was a work of impossibility; I had to take papers at their nominal value,
    and in exchange promise to pay cash Courant again after 3 months. The honest Minister von Zastrow
    gave a pledge and no joint bill of exchange, which Grevenitz and I co-signed. The time ran out quickly
    and the merchant van der Lahr demanded 5000 rt together with interest. For the sake of Mr von Zastrow
    and Grevenitz I had to find counsel quickly — I therefore took from the dyer Coste 9000 rt in state
    papers at 6 per cent interest, which were deposited as cover, and with them the Zastrow pledge and
    the bill of exchange were redeemed — Coste had given me the state papers on the condition that I should
    return the same to him in precisely such papers. The papers stood very low at that time; I could not
    sell them, but pledged them, and that again cost heavy percentages and [uncertain: charges].


    Meanwhile the 3000 rt from Your Most Serene Highness came in; of this I paid 2153 rt at once in cash
    to Lahr and bought papers with the remainder. Hecker gave 4000 rt in paper as security; this I pledged
    again for 1000 rt and paid interest and costs. In order, however, to profit from the speculation as
    all bank'

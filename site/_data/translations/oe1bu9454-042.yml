- page: 4
  en: 'the same together there and send them in all haste to Konotop; otherwise I cannot stir from the
    spot — and yet it would be very good if I were permitted to wait upon Your Serene Highness in person
    — for I myself do not know how to help myself — through this business of my being arrested here I
    lost credit and health — my creditors awoke on all sides, and to this very day are sequestrating Konotop
    upon me. I cannot go there myself, for I am under arrest here on Your Serene Highness''s account —
    what pains me most is that Mathieu will in the end still hold back the remainder, since I still owe
    him 1500 rt Münzer; 2083 rt I have already paid the B —, and 1500 rt still come to him, and on that
    account the [T?] will not let me travel.


    For nearly 6 months I lay, over and above all the vexation, most wretchedly ill, and this business
    too costs me here some 300 rt, which I had to pay the doctor for all of it, and 170 rt which I had
    to pay at the apothecary''s. Never has misfortune pursued me as it has this year here. Meanwhile this
    too will have been got through, if only I receive the 2068 rt so as to be able to bring the Lahr matter
    entirely into the clear.


    For this do find counsel, Your Serene Highness; I beg you heartily and urgently for it, otherwise
    I cannot get'

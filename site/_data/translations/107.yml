status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord! From the Colonel von Zastrow the enclosed letter has been
    sent to me by a huntsman, so that I should most humbly transmit the same to Your Most Serene Highness.
    The Royal Cabinet letter I shall not receive until today or tomorrow. Since Your Most Serene Highness
    will no doubt be arriving here presently, I shall keep it by me until Your Highness's arrival. Upon
    the Princess Sacken I did indeed wish to wait, but I was not received, and in this regard I have only
    had Your Most Serene Highness's letter delivered into the Princess's hands
- page: 2
  en: 'Just now I am sending her a further letter received from Colonel von Zastrow to von K., from which
    the Princess is to satisfy herself that Your Serene Highness may soon arrive. The good Monarch and
    the whole court take the liveliest interest in the affair, and everything is on Your Serene Highness''s
    side. The Princess [uncertain: Sa: — Sacken?] has probably had Professor Selle lay the matter out
    in several quarters in such a way that she is only to be pitied by everyone. To the Princess there
    come, so far as I can tell, the [uncertain: E] von Rietesel, the advocate Cosmar, the Minister [uncertain:
    Heinel — Heinitz?], a certain Hoym, and Professor Selle.'
- page: 3
  en: 'For the rest, in public almost everything is [uncertain: split into hairs / picked to pieces],
    and here then the notes are appended. [text lost] what through Hein the Princess has declared: she
    will never return to Your Serene Highness. She wishes to live free where it pleases her. She would
    be content with 2000 Rthl of appanage. She, the Princess, was pure as an angel, had no connexion with
    another, and had gone away from me on two accounts: 1. because her personal aversion to Your Serene
    Highness was too great, and 2. because she would not help squander everything belonging to her children,
    for she has already countersigned unspeakably many debts, but more she could not subscribe to; and
    therefore she had chosen this step out of love for her children, preferring to be civilly dead than
    to be party to squandering the whole estate. Such then is the prattle of other souls.'
- page: 4
  en: 'Your Most Serene Highness''s friends now wish that Your Highness show yourself with firmness toward
    the Princess Sacken, and in short determine everything; everything will readily be approved on all[illegible]
    sides. Since the day before yesterday the news is current here, even at court, that Suvarow has now
    likewise been beaten, and he himself taken prisoner; one is therefore full of expectation on account
    of the various reports — but the worthy Colonel v. K. rejoices that he judged rightly, and even the
    warlike parties now say: God, how good it is that our Monarch has meddled in nothing. In deepest submission
    I remain, until death, Your Most Serene Highness''s

    Berlin, the 21st October 1799

    most faithful servant

    v Triebenfeld'

segments:
- page: 1
  en: 'By the Grace of God, Fredrich Wilhelm, King of Prussia. Our gracious greeting first. Highly learned
    Councillor, dear and faithful subject. In the land and mortgage records of the lordship of Betsche
    We remind and command you, without fail and within a final fourteen days, to comply with the ordinance
    of the 30th of October of the past year concerning the rectification of the title of possession of
    the lordship of Betsche in favour of the reigning Prince of Hohenlohe-Ingelfingen, Your Lordship.
    Whereby you are to govern yourself. We remain graciously inclined toward you. Given at Posen, the
    9th of February 1801.


    Royal South Prussian Government. Götz


    To the Princely Hohenlohe-Ingelfingen Building and Economy Councillor Glenck John.


    Fees etc., page 1: 1 rt 2 gg.


    Stamp 6 gg


    Mandate 2 gg


    Insertion 3 gg'

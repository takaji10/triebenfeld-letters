status: draft
segments:
- page: 1
  en: 'Privilege, or exchange, of the village of Little Wronczyn and of the mill in the suburb of Pyzdry
    with Kazimierz, King of Poland, for the forest Czernietz, in which the village of Drzewce [uncertain:
    est] was afterwards founded. 25.


    In the name of the Lord. Amen. Lest the affairs or deeds of mortals that are done and ordained in
    time pass away and waver with the course of time, it is necessary that they be brought to perpetual
    memory by the safeguard of letters and the noting of witnesses. Therefore let the present age, as
    well as the future, know: that we, Kazimierz, by the grace of God King of Poland, and also lord and
    heir of the lands of Kraków, Sandomierz, Sieradz, Łęczyca, Kuyavia, Pomerania and Ruthenia, after
    mature deliberation, and with the common counsel of our barons joining in it, have made an exchange
    of our royal goods, namely of the deserted forests described expressly below, with the venerable and
    religious man Brother Jan, abbot, and the convent of the brothers of the monastery of Ląd, of the
    Cistercian Order, of the Gniezno district, in this manner. The heritage of that monastery, namely
    Little Wronczyn near the town of Pyzdry, and the mill below the castle of Pyzdry, also of the said
    monastery of Ląd, with all and singular rents, fruits, profits and appurtenances belonging in any
    way of old to the said heritage of Wronczyn and the said mill, as they are marked off all round in
    their boundaries, being received, appropriated and incorporated in perpetuity for us and our kingdom
    by way and in the name of exchange: which heritage of Wronczyn with the mill above-said the lord abbot
    aforesaid, in his own name and that of his convent, by way of exchange, freely and willingly resigned
    from himself and his said monastery of Ląd to us and our kingdom, to hold and have in perpetuity,
    as he is permitted, with all right and dominion. In recompense for the said heritage and mill, we
    give, donate, ascribe and appropriate to the same lord abbot and his monastery and convent aforesaid,
    in the manner and by way of exchange, our forest in the part commonly called Czirnetz, situated in
    the district of Konin, fit for the cultivation of fields, containing sixty Franconian mansi in their
    due measure, measured by our authority and by our special messengers, and duly bounded and surrounded
    all round on every side, from all heritages, our royal ones as well as those of any nobles lying around,
    by its certain boundaries, which are commonly called kopce, with all profits and fruits whatever that
    are in that forest or may in any way be in it in future; and by the tenor of these presents, for all
    time, with all right and dominion, as it'
- page: 2
  en: 'belonged to us, we incorporate it under our protection, to be possessed for their benefit. We give
    the abbot and convent aforesaid full and complete power to found in the forest of the said sixty mansi
    as many villages as they can, under Polish or German law, as shall seem to them more useful and expedient.
    And we will that the villages founded in the said forest shall fully enjoy and possess, by our special
    grace, every freedom from our royal payments whatever which the other possessions of the said monastery
    of Ląd enjoy, as is more fully contained in the ancient privileges made on the freedom of the possessions
    of that monastery. But if the same abbot and convent should be unwilling or unable to settle these
    sixty mansi to the full, then in whatever part of them they leave as a grove or forest, the hunting
    of deer and boar being reserved in it for our royal pleasure, all other profits, fruits and revenues,
    namely in pastures, spaces, and the hunting of any wild beasts or birds, and also by name all and
    singular profits customarily had by us in the said forests, as they belonged to us and as we alone
    held them under our royal power: all the foregoing the abbot and convent of the above-said monastery
    of Ląd shall hold for all time, as from now ascribed and incorporated to them by us, and shall possess
    peacefully and quietly, with our special requisition made beforehand, to sell, give, exchange and
    turn them in any way to the use of themselves and their oft-said monastery of Ląd. In witness of which
    our seal is hung on these presents. Done at Pyzdry on the Tuesday after the octave of the Epiphany
    of the Lord, in the year of the same 1,362. Present these witnesses: Albert, voivode of Brześć; Wyrzbięta,
    castellan of Poznań and captain of Poland; Janusz of [uncertain: Bechovien.] and Dobiesław of Kruszwica,
    castellans; Adam of Kalisz and Trojan of Brześć, sub-chamberlains; and Florian, chancellor of Łęczyca,
    by whose mandate the present privilege [uncertain: transmitti]; and very many other witnesses worthy
    of trust.'

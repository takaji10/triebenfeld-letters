- page: 1
  en: 'Document no. 1519


    Wyrzbenta, castellan of Poznań and the same general captain of Poland, 27 April 1364, at Ląd; attests
    that Dobrocha, heiress of Wrąbczyn, acknowledged that all the substance she possessed was the abbot
    of Ląd''s.


    Original on parchment. A scrap of parchment from the hanging of the seal. Warsaw. The Rusiecki collection.
    Diplomata.


    We, Wyrzbenta, castellan of Poznań and also general captain of Poland, acknowledge openly and plainly
    to all and singular to whom it shall have been needful to know, that there came before us and the
    other knights of the land of Poland the noble lady named Dobrocha, heiress of great Wronczino, being
    sound and unharmed by the grace of Jesus Christ, and she acknowledged, protesting publicly, that all
    the substance she has, both the untamed beasts of burden and the cattle, with the flocks and all the
    rest that she has and possesses — these are not hers, but the religious man Lord Jan''s, by divine
    mercy abbot in Ląd, and his monastery''s in Ląd; yet so, that after the death of the said lady Dobroslawa,
    neither the children nor any of her friends shall have right or regard in all the substance aforesaid,
    but the Lord Jan, abbot of Ląd, with his monastery aforesaid. In testimony of this matter the seal
    of our title is hung upon these presents. Done and given at Ląd on the Saturday after the day of St
    Mark the evangelist, in the year of the Lord''s birth 1364, in the presence of these witnesses and
    lords: Laurentius, castellan of Ląd, Przesprawo, banner-bearer of Kalisz, Jan of Bieganowo, Henryk
    of Wola, heirs, and many others worthy of trust.


    Magna Wronczino, Wrąbczyn. Land, Ląd. Bieganowo, Wola, today the same; of villages of the last name
    there are 5 in the neighbourhood of the town of Konin.'

status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests! Your Right Honourable''s
    letter of the 20th of Novb. I received on the 26th, but until today I have had to detain the messenger,
    who has been paid and whom I have also compensated for his stay, in order to acquaint Your Right Honourable
    exactly with certain occurrences which do indeed appear to me worth being turned to account, and which
    probably also, in your judgement, deserve preference over other plans. Once I have first answered
    your letter, I shall go into detail upon them as far as seems necessary, partly to depict for you
    the advantage of the newer prospect, partly also to set forth the necessity which alone makes it a
    law to lay hold, in order to procure for myself partly ready ringing means, partly such objects as
    are free of debt, and thereby, if only for the moment, to [uncertain: extricate] myself from a press
    that almost crushes me, so as to gain time and, following increasing consultation with my children,
    to make myself air by means of further reasonable plans to be adopted, so as to be able to subsist
    somewhat tolerably. That Your Right Honourable will faithfully act to this end as a proven friend
    I perceive with gratitude from your worthy communication, and were I only wholly secure, under the
    guardianship of my son Adolph, of the Koschentin estates being [text lost]'
- page: 2
  en: 'then your plan would be excellent; I beg you also not to let it [uncertain: drop], since the welfare
    of the mortgage creditors who have their [uncertain: funds] standing there lies very zealously at
    my heart. I shall also exert myself most zealously to promote this, and hope my eldest son and my
    son-in-law will [uncertain: press forward] with zeal to the attainment of this intention. But since
    this wish can be attained even if we do not bring matters to a conclusion with Weigel and Stössel
    according to Your Right Honourable''s wisely laid plan, I must seek my welfare particularly in this,
    namely to procure means by the alienation of the Zagorow estates to rid myself of my private debts,
    which press me most, which then, by the arrangement I have now made, may, as I dare hope, be soon
    and desirably accomplished, especially if you will in friendly wise make it your concern to unite
    your whole [uncertain: strength] and talent for negotiation with mine and to treat upon it with the
    same intention. I have carefully taken to heart the plan you have just laid before me for negotiation
    with Weigel and Stössel, and by no means contradict it. I do not, however, believe that there will
    be any getting on with Weigel, and if the bargain is not made with both gentlemen at once, then it
    can by no means be of use to us. The acceptance of Ruszynowią would only further increase the already
    too large objects of estates; I would not gladly enlarge the obligations which I have towards you
    by the taking on of Blizanow. Since I always cherish the intention above all not to be ungrateful
    towards you, nor to increase your embarrassments.'
- page: 3
  en: 'I meanwhile thank Your Right Honourable for your generous intention; I shall certainly hear your
    grounds upon this too with pleasure, and let every reasonable representation find its place with me.
    You will find here both the plans enclosed with your letter, your own and that of Count Wortensleben,
    [uncertain: appended]. I leave it further to you, with regard to my situation and the momentary absolute
    necessity of its relief, to take further cautious steps. I flattered myself until today that I should
    see my esteemed friend here with me, since I cannot conceive that, if you had had occasion to go to
    Nüsse again, you should not have found yourself moved to come to me. Upon all this I need, for my
    own [uncertain: guidance], speedy, exact and circumstantial news. That you will work for my welfare
    with all your power I am gratefully convinced by you; nevertheless the [uncertain: what?] When? Where?
    — and especially How soon? — is the greatest need for me to know, and I must tell you that my subsistence
    depends in great part upon it. How grateful will I be to you if I speedily obtain, through [illegible],
    reassuring news upon which I can reckon. A fair amount of ready money is as great a need at Christmas
    as food is for the preservation of life. Your Right Honourable has therefore mortally terrified me,
    since you report to me the sheer impossibility of supporting me soon with monies from there also;
    and the referring me to lawsuits still to be won can reassure me all the less, since unhappily up
    to now I have seen all those that were conducted in Poland on my behalf either [text lost]'
- page: 4
  en: 'or abandoned; as to the one concerning Trąbczyn I have no wish to ask any further, and I confess
    that [uncertain: it shames the house] when I must merely say that the means for the continuation of
    these suits are lacking. All the disappointed hopes have made me as unhappy through the [uncertain:
    misleading] as you cannot conceive. Therefore [uncertain: help] to save me and what still remains
    to me in the Polish estates, and thereby preserve our honour and our mutual advantage, to which end
    I am ready, under your [uncertain: counsel], to make considerable sacrifices. I must confess to you
    that my situation is such that even any short postponement which defers this means of rescue inflicts
    mortal wounds upon me. I hope that an offer which has been made to me on the part of the Schimmelpfennig
    family, and which persons well disposed towards me have fostered, will lead to this. The old General
    and his sons, who were themselves with me, have an inclination towards the Zagorow estates; he would
    gladly in exchange sell to me his wholly debt-free estates Szelce and Maderzewo, which lie not [text
    lost] near Mysłowic on the Przemsa, and puts their yield at 8000 Rthl Courant. Others who know these
    estates exactly put it definitely at 6000 Rthl. He purchased them several years ago for 26000 ducats
    in Gold, and several thousand more is said to have been expended by him upon their improvement, and
    he now wishes to bring them above 100000 Rthl. Not long ago 85000 Rthl Courant were offered him for
    them, which however he refused. The General''s lady possesses a capital of about 60000 Rthl in [uncertain:
    Opfernstisch] mortgage bonds, and as the eldest son, the'
- page: 5
  en: 'cavalry captain, expressed to me, [uncertain: this sum, indeed some 100000 Rthl] in money and if
    need be somewhat more, could be brought together, if one would accept documents or allow him time
    to call in some capitals. He requested of me the maps and valuations of the Zagorow estates, which
    I sent over to him, and received them back already with the expressed wish to bring this business
    to a conclusion. Thus I had also sent him the rent-register, the statement of arrears and remainders,
    as well as the General Land-Register handed over to you only in Anno b; all this seemed to the old
    gentleman not yet clear enough, and, since one had already heard various things about the estates
    and relied upon my fairness, a reasoned and instructive statement was desired, such as would be confirmed
    on ocular inspection, upon which alone one would engage, and then would soon bring the matter to an
    end. [uncertain: Deschent''s] clerk, who came hither to visit a [uncertain: Bally] and supposed he
    would find me in better circumstances, and therefore hoped to obtain from me the remuneration due
    to him as having been for a year Your Right Honourable''s fellow-worker in the business there, was
    present, and I made use of him in a conference with the cavalry captain v Schimmelpfennig, in order
    to set forth everything to him exactly and thoroughly. He undertook this commission willingly and
    skilfully, and drew up for my use and my own instruction a reasoned and instructive valuation, which
    I also communicated confidentially to Schimmelpfennig. I must do Herr Lieut. Sommer the justice to
    say that, while he takes no [uncertain: notice] of our mutual grief and oppressive situation, but
    expresses himself only cautiously, he pities Your Right Honourable,'
- page: 6
  en: 'but is withal much devoted to you, and looks forward to seeing you again soon. He will excuse his
    rapid departure, to which the pressure of circumstances compelled him. I believe he will be, and wishes
    to be, and can be, of especial use in this business; I may believe that by my conduct I have earned
    his attachment, and therefore I beg Your Right Honourable in the most friendly way to make use of
    him with confidence as a good instrument. I promised him that his faithfully rendered co-operation
    should not go unrewarded, and in any case I beg you, dear friend, to bring it about there soon, so
    far as is possible, that a payment be ordered to him for his provisional reassurance. The manner and
    way I leave to Your Right Honourable, and [uncertain: I think] Herr Lieutenant Sommer will, upon this,
    having taken counsel with [uncertain: Lebanis], be able to make you a proposal not injurious to me.
    I wish it, since by this we bind to ourselves a faithful and highly knowledgeable assistant. Since
    Herr General v Schimmelpfennig [uncertain: let fall to me] that he intends within these days to send
    his elder son the cavalry captain to Berlin on account of the raising of the monies needful thereto,
    but with his youngest son, who is a pupil of Thaer, intends to undertake the journey to Zagorowo soon,
    in order to view these estates before the ground is covered with snow, and beforehand however wishes
    to speak with Herr Lieut. for his own instruction, I shall, as soon as the day of his dispatch is
    only fixed —'
- page: 7
  en: 'which I expect this very day, and on that account hold back your messenger — let the said gentleman
    depart thither, who has only to act there with all caution, and to secure that. He shall then, since
    he means to make the journey on horseback, hasten somewhat ahead, in order by his report to Your Right
    Honourable to bring it about that whatever may further be required for this interview is prepared,
    wherein much circumspection will have to be used, since the old General is known as cunning, mistrustful
    and avaricious. He is glad to gain, and this [uncertain: greed] makes him particularly covetous of
    the largest estates. Withal he is glad to withdraw the ready monies from his children, since he does
    not believe them safe in their hands hereafter, and is of the opinion that they would sooner preserve
    the estates than ready money. Since these last days he has further the will to draw his two sons-in-law
    also into the affair, and intends therefore to bring in the small estate Gollawia, which he recently
    purchased from the Lahr heirs for his son-in-law [uncertain: Johnston], into the bargain as well;
    since he paid in only 5000 Rthl for it, it is not to be regarded as any great object. You now know
    everything that I know upon this subject, and Sommer shall communicate to you, further, as his own
    elucidation, all that he has heard from me and shall learn in [uncertain: Selige]. Think the matter
    over ripely and prepare yourself for it as well as may be. I set [uncertain: great] hopes in your
    savoir faire and have more confidence in this business than I ever yet had in any other. Unhappily
    my children are not yet on the road, and an illness which befell my daughter-in-law'
- page: 8
  en: 'has wrung from August the wish to postpone his so necessary coming to a better season of the year.
    I have already written provisionally to Emilie [uncertain: at/through] my sister of the grounds why
    his early presence here is needful, and now repeat it urgently by an express courier. Since you take
    so friendly a part in everything that concerns me and my little family, I do not omit to report to
    Your Right Honourable that the Hereditary Prince of Hohenloh Kirchberg, who is 1 year older than my
    daughter Adele, sued for her hand with me these days. Since the mutual inclination, the necessary
    provision, and propriety in every respect are found together in this match, I have given my consent,
    and may hope that the contentment of my three eldest children in respect of their [uncertain: matrimonial]
    relations is now established. God grant that I may soon obtain rest; as soon as [uncertain: one ceases]
    to be unjust towards me, my limited wishes are [uncertain: quite] attained; one of the chief means
    to this is the attainment of the business here set out, or some other [uncertain: convenient] alienation
    of the Zagorow estates suited to my circumstances, soon. You have liberty to employ Trąbczyn in the
    bargain, on this or the other side, if it can be done with advantage, just as I will [uncertain: exclude]
    no useful way of attaining the end; everything else being left to your prudence and experience. Do
    not let me wait long for news, for every definite information may'
- page: 9
  en: 'also lead to [uncertain: decisive] ends, just as to leave me in [uncertain: ignorance] is a cruelty.
    God keep you in health; I was ailing some days, but since yesterday it goes better, only my eyes still
    much torment me through their inflammation. Hence I make use of a foreign pen and dictate this. I
    believe I have overlooked nothing, nor sinned in the matter by any want of circumstantiality. The
    wish to make it also quite [uncertain: intelligible] has led me to abuse your patience, and I therefore
    beg you, my esteemed friend, to forgive the length of this epistle. It is with the most particular
    esteem that I remain Your Right Honourable''s Schlawenschitz the 4th of Xbr 1811.'

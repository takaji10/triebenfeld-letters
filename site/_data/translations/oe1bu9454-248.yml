status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! If Your Most Serene Highness''s wishes do not
    succeed now, then it may never come to pass. The upright Prince Chancellor has the best will, and
    His Excellency the Herr Minister Baron v Humboldt is exceedingly active. The day before yesterday
    the latter told me that the Curish heirs have approached the King and petitioned for their satisfaction.
    His Excellency has required of me copies of everything which I have submitted to His Serene Highness
    the Prince State Chancellor, so that the reply might be suited to Your Serene Highness''s wishes.
    — The King has now caused it to be answered that he would not settle the matter after any retour [uncertain:
    nach keiner retour]. His Excellency is very glad of this and holds the whole game to be won. The Monarch
    perceives that he must pay — and gladly will one also annul the settlement, gain 314000 Rthl and advance
    the 112000 Rthl. The Prince will, as I know for certain, also bring into discussion the salary due
    to Your Serene Highness from 9 years, and in this too God will help. Just now I come from Count Winzingerode;
    he showed me a letter to His Majesty just begun, in which he petitions in the name of Prince August
    that His Majesty might be pleased to command that there be paid to him with the utmost speed 10000
    Rthl, in accordance with a testament of his deceased grandmother the Princess Sacken, out of the revenues
    of the entailed estates Schlawenschitz and Lasswitz. I did not dissuade the Count from submitting
    the matter; meanwhile I told him that His Majesty had firmly resolved to have Your Serene Highness''s
    affairs brought to a conclusion first of all, and that the King would perhaps himself have the estates
    Quldt taken into sequestration for years. — For the rest, it would be striking that the Princess Sacken
    should wish to dispose of the entailed estates even after her'
- page: 2
  en: 'death, of which she was only the possessor by advitalitium. — Here the greeting faltered greatly,
    and said, is that possible —? Oh, what things people do say! I hope that the decision given through
    Minister Humboldt will also be favourable to Your Serene Highness, and will fall out to this effect,
    that Your affairs are to be put in order first. Concerning the P. Warschau nothing has yet come to
    publicity, although the [uncertain: Pohlenlaas] has fallen; in the meantime the Trzwismer and Remeure
    matter rests on that account — the affair will not be so easily settled as was believed at Schlawenschitz
    — from that side everything is being brought to bear and much is being sacrificed — added to which
    is that our King is all too good. — The F. H. is very full of care on that account. The affairs of
    the Empire will end very well; I have heard various things about it in confidence, and have communicated
    what was necessary to the persons concerned. Yesterday there was a great Brink here. It was said that
    France had declared that as soon as Prussia occupied Saxony, France would let 200000 men march across
    the Rhine. Today, however, I heard from one of my patrons that this is a rumour without any foundation.
    In the Baden and Württemberg lands it is beginning to grow very restless; by the next post I shall
    write more about it. The departure of the Monarchs takes place 18 days from today. Most reverently
    I remain Your Most Serene Highness''s Vienna, the 5th of November 1814. v Triebenfeld most faithful
    and obedient servant'
- page: 3
  en: 'It has constantly been said that all the estates had belonged to the old Princess Sacken, and that
    she had made her testament only in favour of Prince August and had excluded the old Prince entirely
    from everything, with a slender appanage. — I answered briefly: the deed of 1799, sanctioned by His
    Majesty, proves the contrary of all this. — According to it the Old Prince is the actual lord; he
    will now re-enter into all his rights and remain lord of all his goods until his end. —'

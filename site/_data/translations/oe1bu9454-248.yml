- page: 2
  en: 'death, of which she was only the life-tenant possessor. — Here the [uncertain: greeting] faltered
    greatly, and said, is that possible —? Oh, what things people do say. I hope that the decision given
    through Minister Humboldt will likewise be favourable to Your Serene Highness, and will turn out to
    the effect that Your affairs are to be set right first.


    Concerning the P. Warsaw nothing has yet come to publicity, although the Polish [uncertain: Pohlenlaas]
    has fallen; in the meantime the Trzwismer and Remeure matter rests on that account. — The business
    will not be so easily brought to an end as has been believed in Schlawenschitz. — From that side everything
    is being mustered and much sacrificed — and to this is added that our King is all too good. — The
    F. H. is on that account much troubled. The affairs of the Empire will end very well; I have heard
    various things about it in confidence, and have communicated what was necessary to the men concerned.
    Yesterday there was a great [uncertain: Brink] here. It was said that France had declared that as
    soon as Prussia occupied Saxony, France would let 200000 men march across the Rhine. Today, however,
    I heard from one of my patrons that this is a report without any foundation. In the Baden and Württemberg
    territories things are beginning to grow very restless; by the next post I shall write more about
    it. The departure of the monarchs takes place 18 days from today. Full of reverence I remain


    Your Most Serene Highness''s


    Vienna,


    the 5th of November


    1814.


    von Triebenfeld


    faithful and most obedient servant'

- page: 1
  en: '248


    Most Serene Prince


    Most gracious Prince and Lord!


    If Your Most Serene Highness''s wishes do not now succeed, then they never will. The upright Prince
    Chancellor has the best will, and His Excellency the Minister Baron von Humboldt is exceedingly active
    — The day before yesterday the latter told me that the Curische heirs have applied to the King and
    have petitioned for their satisfaction.


    His Excellency has demanded of me copies of everything I have submitted to His Serene Highness the
    Prince State Chancellor, so that the answer might be suited to Your Serene Highness''s wishes — The
    King has now had it answered that he would settle the matter after his return. His Excellency is very
    glad of this and holds the whole game to be won. The monarch perceives that he must pay — and gladly
    will one gain 314,000 Rthl and advance the 112,000 Rthl — and also annul the settlement — The Prince
    will, as I know for certain, also bring up the salary due to Your Serene Highness for 9 years, and
    here too God will help. I have just now come from Count Winzingerode, who showed me a [uncertain:
    justi-] begun letter to His Majesty, in which he petitions in the name of Prince August that His Majesty
    might be pleased to command that with the utmost speed 100,000 Rthl be paid to him, pursuant to a
    testament of his late grandmother the Princess Sacken, out of the revenues of the entailed estates
    Sławięcice and Lasowice. I have not advised the Count against submitting the matter; meanwhile I told
    him that His Majesty had firmly determined to have Your Serene Highness''s affairs brought to a conclusion
    first of all, and that the King would perhaps himself have the estates Quest placed under sequestration
    for years — For the rest, it was striking that the Princess Sakkin should wish to dispose of the entailed
    estates even after her'

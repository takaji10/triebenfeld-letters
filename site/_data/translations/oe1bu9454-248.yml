- page: 2
  en: 'death, of which she had been only a life-tenant holder — Here the Count was much taken aback, and
    said, is that possible —? Oh, what things people do say. I hope that the decision, given through Minister
    Humboldt, will also be favourable to Your Serene Highness, and will fall out to this effect, that
    your affairs are to be set right first.


    Regarding the Warsaw question nothing has yet come to publicity, although the lot of the Poles has
    been decided; meanwhile the Trąbczyn and Kamionna matter rests on that account — the affair will not
    be so easily ended as was believed at Sławięcice — from that quarter everything is being exerted and
    much sacrificed — added to which our King is all too good — Prince Hardenberg is on that account full
    of care — The Imperial affairs will end very well; I have heard various things about it in confidence,
    and communicated what was necessary to the men concerned. Yesterday there was a great Brink here.
    It was said that France had declared that as soon as Prussia occupied Saxony, France would let 200/m
    men march over the Rhine. Today, however, I heard from one of my patrons that this is a rumour without
    any foundation whatever — In the Baden and Württemberg lands things are beginning to grow very unquiet;
    by the next post I shall write more about it. The departure of the monarchs takes place 18 days from
    today — In reverence I remain


    Your Most Serene Highness''s


    Vienna


    the 5th of November


    1814.


    most faithful and obedient servant


    v Triebenfeld'

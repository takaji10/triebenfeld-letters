- page: 3
  en: 'It has always been said that all these estates had belonged to the old Princess Sacken, and that
    she had made her testament solely in favour of Prince August and had shut out the old Prince entirely
    from everything, with a slender appanage. — I answered briefly: the deed of 1799 sanctioned by His
    Majesty proves the contrary of all this. — According to it the old Prince is the actual lord; he will
    now re-enter into all his rights and remain lord of all his property until his end. —'

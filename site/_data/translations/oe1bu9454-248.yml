- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    If Your Most Serene Highness''s wishes do not succeed now, then it can never happen. The honest Prince
    Chancellor has the best will, and His Excellency the Minister Baron von Humboldt is extremely active.
    The day before yesterday the latter told me that the Courland heirs have applied to the King and have
    petitioned for their satisfaction.


    His Excellency has required of me copies of everything which I have submitted to His Serene Highness
    the Prince State Chancellor, so that the reply might be conformable to the wishes of Your Serene Highness.
    — The King has now had it answered that he would settle the matter after no return. His Excellency
    is very glad of it and holds the whole game to be won. The Monarch perceives that he must pay — and
    the settlement too will gladly be annulled


    to gain 314000 Rthl and to advance the 112000 Rthl. The Prince will, as I know for certain, also bring
    into discussion the salary due to Your Serene Highness from 9 years, and in this too God will help.
    I have just this moment come from Count Winzingerode; he showed me a [uncertain: justi-] begun letter
    to His Majesty, in which he asks in the name of Prince August that His Majesty might be pleased to
    command that there be paid to him with the greatest speed 10000 Rthl, in accordance with a testament
    of his deceased grandmother the Princess Sacken, out of the revenues of the entailed estates of Schlawenschitz
    and Lasswitz. I did not advise the Count against submitting the matter; meanwhile I told him that
    His Majesty had firmly determined to have Your Serene Highness''s affairs brought to a conclusion
    first of all, and that the King would perhaps himself have the estates of Quldt placed under sequestration
    for years. — For the rest, it was striking that the Princess Sacken should wish to dispose of the
    entailed estates even after her'

- page: 3
  en: it has always been said that all the estates had belonged to the old Princess Sacken, and that she
    had made her testament only in favour of Prince August and had wholly excluded the old Prince from
    everything with a paltry appanage — I answered briefly — the act of 1799 sanctioned by His Majesty
    proves the contrary of all this — According to it the old Prince is the actual lord; he will now re-enter
    into all his rights and remain lord of all his possessions to his end —

  en: '243


    P[ro]. M[emoria].


    Most gracious Prince and Lord!


    The dearness of everything here is so dreadful that, if Your Serene Highness does not send me a further
    300 rt between now and eight days hence, I shall have to depart — I have had to exchange 400 rt. Bob[uncertain:
    chilz]  , because no one will accept Prussian Courant — for which I have received 1200 fl. Vienna
    redemption notes — of these I have already, on the journey and up to now, spent 392 fl. — I therefore
    still have about 800 fl. in paper money. Daily I require for a wretched room 24 fl. In the morning
    for coffee: 1 fl. 30 x


    for midday dinner: 6 fl.


    for 1 cup of coffee: 1 fl.


    for 1 Seidel of wine, which one must take for decency''s sake: 1 fl. for the hired footman: 5 fl.


    for my fellow: 1 fl.


    for the cattle field cannot yet be gone to first, on an average day 3 barrels at 2 fl.: 6 fl. part
    daily 45 fl. 30 x.


    I may therefore properly reckon, with extra outlays, 50 fl. W. W. daily, or 15 rt.


    260 fl. I must reckon for the return journey, so that only 540 fl. remain, the carriage must be repaired,
    the laundry costs much, the good ones also still the 40 fl. up, and there remain at the very most
    500 fl.; and if I give no man another Groschen, I should have enough to live on for 10 days. But now
    the affair is supposed to last at least another 5 weeks here — reckon it up, Your Serene Highness,
    and you will find my request most reasonable. May it please Your Serene Highness most graciously,
    but also with the very greatest speed, to let me know whether you can send me the 300 rt in Gold here.
    In case it is not possible, then I shall go from here ten days from today, that is on the 23rd — I
    lodge here at the Golden Duck in the Schulerstraße No. 8 1/2, and in fact No. 15. [Vienna] the 13th
    of October 1814.


    v Triebenfeld'

- page: 1
  en: '243


    P[ro]. M[emoria].


    Most gracious Prince and Lord!


    The dearness of everything here is so dreadful that, if Your Serene Highness does not send me a further
    300 Rthl between now and eight days hence, I shall have to depart — I have had to exchange 400 Rthl.
    Bob[uncertain: chilz]  , because no one will accept Prussian Courant — for which I have received 1200
    gulden. Vienna redemption notes — of these I have already, on the journey and up to now, spent 392
    gulden — I therefore still have about 800 gulden in paper money. Daily I require for a wretched room
    24 gulden. In the morning for coffee: 1 gulden 30 kreuzer


    for midday dinner: 6 gulden.


    for 1 cup of coffee: 1 gulden.


    for 1 Seidel of wine, which one must take for decency''s sake: 1 gulden for the hired footman: 5 gulden.


    for my fellow: 1 gulden.


    for the cattle field cannot yet be gone to first, on an average day 3 barrels at 2 gulden: 6 gulden
    part daily 45 gulden 30 kreuzer.


    I may therefore properly reckon, with extra outlays, 50 gulden. W. W. daily, or 15 Rthl.


    260 gulden. I must reckon for the return journey, so that only 540 gulden remain, the carriage must
    be repaired, the laundry costs much, the good ones also still the 40 gulden up, and there remain at
    the very most 500 gulden; and if I give no man another Groschen, I should have enough to live on for
    10 days. But now the affair is supposed to last at least another 5 weeks here — reckon it up, Your
    Serene Highness, and you will find my request most reasonable. May it please Your Serene Highness
    most graciously, but also with the very greatest speed, to let me know whether you can send me the
    300 Rthl in Gold here. In case it is not possible, then I shall go from here ten days from today,
    that is on the 23rd — I lodge here at the Golden Duck in the Schulerstraße No. 8 1/2, and in fact
    No. 15. [Vienna] the 13th of October 1814.


    v Triebenfeld'

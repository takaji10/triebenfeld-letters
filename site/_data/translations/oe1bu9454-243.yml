  en: 'P[ro]. M[emoria].


    Most gracious Prince and Lord!


    The dearth here is so frightful that, if Your Serene Highness does not send me a further 300 Rthl
    between now and 8 days hence, I must depart — I have had to convert 400 Rthl of Keob[illegible]chi[uncertain:
    tz] , because no Prussian Courant is admitted here — for it I received 1200 fl. in Vienna redemption
    notes — of these I have already, on the journey and up to now, spent 392 fl — so I still have about
    800 fl. in paper money. Daily I need 24 fl. for one wretched room.


    In the morning for coffee:


    1 - 30 x


    for the midday meal: 6


    for 1 cup of coffee: 1; for 1 Seidel of wine, which one must take for honour''s sake: 1; for the hired
    lackey: 5


    for my fellow: 1; for the cattle-field, since one cannot yet go first, on average per day 3 barrels
    at 2 fl.: 6; part daily 45 fl. 30 x.


    I may therefore reasonably reckon on 50 fl. Vienna currency daily in extra expenses, or 15 Rthl.


    260 fl. I must reckon for the return journey; there remain only 540 Rthl; the carriage must be repaired.
    The laundry costs much, and the good one also the 40 fl. on top, and there remain at most 500 Rthl;
    and if I give no man a Groschen more, I should have enough to live on for 10 days. But now the business
    is supposed to last here at least another 5 weeks — reckon it up, Serene Highness, and you will find
    my request entirely fair. May Your Serene Highness deign most graciously, and also with the very greatest
    speed, to let me know whether you can send me the 300 Rthl in Gold here. In case it is not possible,
    I shall depart from here 10 days from today, that is on the 23rd. I lodge here at the Golden Duck
    in the Schulerstraße No. 8 1/2, and indeed No. 15. [Vienna] the 13th of October 1814.


    v. Triebenfeld'

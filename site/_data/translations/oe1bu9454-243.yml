- page: 1
  en: 'P[ro]. M[emoria]. Most gracious Prince and Lord! The dearness of everything here is so frightful
    that, if Your Serene Highness does not send me another 300 Rthl within eight days from now, I must
    depart — I have had to convert 400 Rthl of Keob[illegible]chi[uncertain: tz], because no Prussian
    Courant is admitted here — for it I have received 1200 fl. in Vienna redemption notes — of these I
    have already spent 392 fl. on the journey and up to now — so I have still about 800 fl. in paper money.
    Daily I need, for a wretched room, 24 fl.; in the morning for coffee: 1 – 30 x; for the midday meal:
    6; for 1 cup of coffee: 1; for 1 Seidel of wine, which one must take for honour''s sake: 1; for the
    hired lackey: 5; for my fellow: 1; for the cattle-field, which cannot yet be gone to first, on an
    average day 3 barrels at 2 fl.: 6 — in part daily 45 fl. 30 x. I may therefore fairly reckon 50 fl.
    Vienna currency daily in extra expenses, or 15 Rthl. 260 fl. I must reckon for the return journey,
    so that only 540 Rthl remain; the carriage must be repaired. The laundry costs much, the good ones
    also still the 40 fl. on top, and there remain at most 500 Rthl, and if I give no man a Groschen further
    I should have enough to live on for 10 days. Now the business is to last here at least another 5 weeks
    — reckon, One Serene Highness, and you will find my request most equitable. May Your Serene Highness
    most graciously deign, but also with all possible speed, to let me know whether you can send me the
    300 Rthl in Gold here. In case it is not possible, then I shall depart from here ten days from today,
    that is on the 23rd. I lodge here at the Golden Duck in the Schulerstraße No. 8 1/2, and indeed No.
    15. [Wien], the 13th of 8br 1814. v Triebenfeld'

- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness''s letter, together
    with the enclosures, I have presented to Her Majesty the Queen, which the same, most highly, has received
    with pleasure. For the rest, the matter was at once handed over by Her Majesty the Queen to His Excellency
    the Grand Chancellor, who immediately transferred it in turn to the Cabinet and Kammergericht Councillor
    Herr Allbrecht, with whom I am now working upon the business; His Excellency Herr J M v. Beym appears
    also to look very much to the form of it, and therefore I believe the matter will grow tedious. The
    Cabinet Councillor Herr Allbrecht is meanwhile the most upright and noblest man that I have known,
    and who will certainly [uncertain: undertake] everything, and to attain the goal. Of political news
    nothing whatever may be spoken here; the reports are so various that even the most clear-sighted head
    must fall silent as to the possible events in the future. It is a true ebb and flood. Every 24 hours
    the barometer sings differently: one day the French, the next day the Austrians have beaten everything;
    these so contradictory reports have moved His Majesty, at the giving out of the watchword, to issue
    the order along with it that in no manner shall there be any reasoning upon political subjects, particularly
    such as concern the war between France and Austria. The June- My stay here I cannot yet determine;
    the purposes are various, I must go daily to several places, many lack the time on account of their
    overburdened business, and therefore I often go in vain. — His Excellency the Lieutenant General v.
    Köchn. commends himself to Your Serene Highness''s grace — I however remain, until death, reverently
    Your Most Serene Highness''s Königsberg, the 3rd of May 1809. faithful and most obedient servant v
    Triebenfeld'

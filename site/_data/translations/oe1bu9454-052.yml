- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s letter I have, together with the enclosures, presented to Her Majesty
    the Queen, which the same, in the Highest degree, received with satisfaction. For the rest, the matter
    was at once handed over by the Queen''s Majesty to His Excellency the Grand Chancellor, who forthwith
    passed it on again to the Cabinet and Supreme Court Councillor Allbrecht, with whom I am now working
    on the affair; His Excellency J. M. von Beym appears [uncertain: and] to look very much to the form
    of things, and therefore I believe the matter will become tedious. The Cabinet Councillor Allbrecht
    is meanwhile the most upright and noblest man whom I have ever known, and who will certainly [uncertain:
    employ] everything, and to reach the goal.


    Of political news nothing whatever may be spoken here; the reports are so various that even the most
    clear-sighted head must fall silent as to the possible events of the future. It is a veritable ebb
    and flood; every 24 hours the barometer sings differently: one day the French have beaten everything,
    the next day the Austrians; these so contradictory reports have moved His Majesty to issue along with
    the watchword the command that in no manner shall there be any reasoning upon political subjects,
    particularly such as concern the war between France and Austria. The June- I cannot yet determine
    my stay here; the purposes are various, I must go daily to several places, many lack the time on account
    of the overburdened business, and therefore I often go in vain – His Excellency the Lieutenant-General
    von Köchn. commends himself to Your Serene Highness''s grace – but I, in deepest reverence, remain,
    until death, Your Most Serene Highness''s


    Königsberg


    the 3rd of May 1809.


    faithful and most obedient servant


    von Triebenfeld'

    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s letter I have presented, together with the enclosures, to Her Majesty
    the Queen, which the same, Most High, received with pleasure. For the rest, the matter was at once
    handed over by Her Majesty the Queen to His Excellency the Lord Grand Chancellor, who forthwith transferred
    it again to the Lord Cabinet and Superior Court Councillor Albrecht, with whom I am now working on
    the matter. His Excellency Mr J M von Beyme appear[s] and it [is] to look very much to the form, and
    therefore I believe the matter will become tedious. The Lord Cabinet Councillor Albrecht is meanwhile
    the most upright and noble man with whom I have [uncertain: been acquainted], and who will certainly
    employ every means and to attain the goal.


    Of political news nothing whatever may be spoken here; the reports are so various that even the most
    clear-sighted head must fall silent as to the possible events in the future. It is a true ebb and
    flow. Every 24 hours the barometer shows differently: the one day the French have beaten everything,
    the next day the Austrians; these so contradictory reports have moved His Majesty to issue, at the
    parole, the order along with it, that in no manner shall there be any discoursing upon political subjects,
    particularly such as concern the war between France and Austria. The Juni- My stay here I cannot yet
    determine; the purposes are various, I must go to several places daily, many lack the time on account
    of their overburdened business, and therefore I often go in vain — His Excellency Lieutenant General
    von Köckritz commends himself to Your Serene Highness''s favour — but I, in deepest reverence, I remain,
    until death, Your Most Serene Highness''s


    Königsberg


    the 3rd of May 1809.


    faithful and most obedient servant


    v Triebenfeld'

status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! The 100 Fr. most graciously sent to me by Your
    Most Serene Highness have for the greater part likewise been made water of, inasmuch as the Chief
    Post Office had these monies withheld so long until I had paid off a small sum of accrued postal Gülcher
    and 480 Rthl of Concur. monies which I had incurred in the King's service. This has brought on a long
    delay, so that it was only yesterday evening that I received Your Most Serene Highness's gracious
    letter of the 3rd of February. Its content, that the 600 Centner of iron are not to be delivered as
    far as Oppeln until the end of May, has utterly crushed me. I have promised to deliver the iron in
    Berlin at the Ober Baum as early as the 1st of May. I have given a bill of exchange upon the 2400
    Rthl paid by Michaelis, payable the 1st of May, and there is a contract, if the iron does not come
    in punctually, a penalty of 500 Rthl was moreover fixed over and above it — I had to enter into these
    facta conditions merely in order to be released the sooner from the Berlin arrest, before the 2nd
    judgment concerning Lahr came out. Your Most Serene Highness I beg for God's sake to make it possible
    just this once that I have the 600 Centl. of iron (namely 300 Rthl of bar and hoop iron and 300 Leute
    of rail iron) at Boyadell by the 23rd of April, so that I may load it at once and dispatch it to Berlin.
    Were Your Most Serene Highness not to be pleased to grant this my heartfelt and pressing request,
    I should be
- page: 2
  en: exceedingly unfortunate; indeed I should have to flee like a scoundrel, abandon everything and lose
    my whole credit, which I now think to re-establish in such a manner that I may in every way be of
    effect again for Your Serene Highness. Have mercy, Most gracious Prince, and do not let me be made
    a liar this time. The contract, as well as the bill of exchange, was concluded before the court with
    Michaelis; I should be very wretched and worse than ill off were I not to keep my word; I have resources
    afterwards and can effect much. — Only this once, chief honour and everything depends upon the fulfilment
    of the contract — Thereupon I outrun the execution and sequestration, make, once I have my estates
    again, a timber contract upon the Kontopper woods, go, when this is settled, to Vienna and fetch the
    contracted arms, which is the King's own hobby-horse, bring these to Cosel and go then again to Königsberg
    or wherever the King is; I can then effect very much good. — Concerning the Lahn I have just now also
    received these enclosures; he offers as much as 5 1/2 Rthl per Centner of iron — but he must absolutely
    accept the iron at 6 Rthl. I shall write to Amelang; may Your Most Serene Highness also be pleased
    to approach Amelang once again in the matter, and to have this assured to von der Lahr. I think meanwhile
    to procure for Your Serene Highness the 4000 Rthl in Zagorowo which are assigned, and then you will
    have your whole iron paid for again — May you only be pleased to send the 400 Leut. of iron soon,
    after the 600 Leute which Michaelis must have first, also to Bogadie; I shall then already direct
    all the matters. Court Councillor Hahn writes that Weigel is threatening — Who can now compel Your
    Serene Highness to pay old debts.
- page: 3
  en: the general moratorium protects you indeed until Midsummer 1810. Of old debts one need only settle
    the interest; newly contracted ones, taken up after the granting of the Gen. Morat., must, under the
    more recent edicts which have been issued in favour of the Jews and usurers, be paid par force, and
    this is precisely what strikes me now. Once more I beg Your Serene Highness beseechingly, do send
    me the 600 Centner of iron by the 23rd of April at the very latest, that I may this once be saved
    — if you do not do this, then my whole civil existence is destroyed and they will sell my estates
    over my head. The 600 Centner of iron are a trifle for Your Serene Highness, and you lose nothing
    by it, but rather receive the money back at latest by Midsummer, when all the interest comes in; just
    the same is the case with the 400 Leute for von der Lahr — the debt is thereby now extinguished, and
    you receive the 4000 Rthl assigned to me by the French General Government; then you have the money
    for 1000 Lentl of iron again. May you only be pleased to have it shipped as far as Bogadel near Grüneberg,
    to be sent on by water to Oppeln. There I shall have it loaded and send it to Berlin; this costs a
    further 400 Rthl again, yet I will indeed bear these costs myself; only show me this single grace
    and send the iron only as far as Boyadel. In deepest reverence I remain, until death, Your Most Serene
    Highness's — The answer from v. d. Lahr has been left behind with Amelang's Bruch in Kontop; I shall
    most humbly forward the same by the first post. Glogau, the 21st of March 1809. faithful and most
    obedient servant v Triebenfeld

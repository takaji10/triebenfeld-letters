- page: 1
  en: '54


    Most Serene Prince


    Most gracious Prince and Lord!


    The 100 Friedrich d''or most graciously sent me by Your Most Serene Highness have for the greater
    part likewise come to nothing for me, inasmuch as the Chief Post Office had these monies withheld
    so long until I had paid off a small sum of accumulated postal charges and 480 Rthl Courant monies
    which I had incurred in the King''s service. This has brought about a long delay, so that only yesterday
    evening did I receive Your Most Serene Highness''s [uncertain: Highness] gracious letter of the 3rd
    of February. Its content, that the 600 Centner of iron are to be delivered as far as Opole only at
    the end of May, has utterly crushed me. I have promised to deliver the iron in Berlin at the Oberbaum
    already on the 1st of May. I have given a bill of exchange upon the 2400 Rthl paid by Michaelis, payable
    on the 1st of May, and there is a contract, in the event the iron does not come in punctually, with
    a penalty of 500 Rthl Cour[ant] besides, fixed over and above it — I had to enter into these terms
    of fact merely in order to be released from the Berlin arrest sooner, before the 2nd judgment in the
    matter of Lahr came out.


    Your Most Serene Highness I beg, for God''s sake, to make it possible just this once that I have the
    600 Centner of iron / namely 300 Rthl of bar and hoop iron and 300 Centner of rail iron / at Bojadła
    by the 23rd of April, so that I may load it at once and dispatch it to Berlin. I should be, if Your
    Most Serene Highness should not be pleased to grant this my heartfelt and urgent request,'

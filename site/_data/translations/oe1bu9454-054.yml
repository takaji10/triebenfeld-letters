status: draft
segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The 100 Fr. which Your Most Serene Highness most graciously sent me have for the greater part likewise
    been made water of, inasmuch as the Chief Post Office had these monies held back until I had paid
    off a small sum of accumulated postal [uncertain: Gülcher] and 480 rthun of Concur. monies which I
    had incurred in the King''s service. This has brought about a long delay, so that it was only yesterday
    evening that I received Your Most Serene Highness''s gracious letter of the 3rd of February. Its content,
    that the 600 hundredweight of iron are not to be delivered as far as Oppeln until the end of May,
    has utterly crushed me. I have promised to deliver the iron in Berlin at the Oberbaum as early as
    the 1st of May. I have given a bill of exchange upon the 2400 Rthl paid by Michaelis, payable on the
    1st of May, and there is a contract whereby, if the iron does not arrive punctually, a penalty of
    500 Rthl was moreover fixed over and above it — I was obliged to enter into these factual conditions
    merely in order to be released the sooner from the Berlin arrest, before the 2nd judgment concerning
    Lahr came out.


    Your Most Serene Highness I beg for God''s sake to make it possible just this once that I may have
    the 600 hundredweight of iron (namely 300 Rthl of bar and hoop iron and 300 [uncertain: Leute] of
    rail iron) at Boyadell by the 23rd of April, so that I may load it at once and dispatch it to Berlin.
    Were Your Most Serene Highness not to be pleased to grant this my heartfelt and pressing request,
    I should be'
- page: 2
  en: 'exceedingly unhappy; indeed I should have to flee like a knave, abandon everything and lose my
    whole credit, which I now intend to re-establish in such a manner that I may again be effective in
    every way for Your Serene Highness. Have mercy, Most gracious Prince, and do not let me be made a
    liar this time. The contract, as well as the bill of exchange, was concluded judicially with Michaelis;
    I should be most wretched and worse than ill placed were I not to keep to it; I have resources afterwards
    and can effect much. — Only this once my chief honour and everything depends upon the fulfilment of
    the contract — Thereafter I will [uncertain: undergo] the execution and sequestration, make, when
    I have my estates again, a timber contract upon the Kontop timbers, go, once this is settled, to Vienna
    and fetch the contracted-for arms, which is the King''s own hobby-horse, bring these to Cosel and
    then go again to Königsberg or wherever the King may be; I can then effect a great deal of good —
    As regards von der Lahr, I have just now also received these enclosures; he is already offering 5
    1/2 Rthl per hundredweight of iron — but he must absolutely take the iron at 6 Rthl. I shall write
    to Amelang, and may Your Most Serene Highness also be pleased to approach Amelang once more in the
    matter, and to have this assured to von der Lahr. Meanwhile I intend to procure for Your Serene Highness
    the 4000 Rthl in Zagorowo which [uncertain: Assignit], and then you will have your whole iron paid
    for again — may you only be pleased to send the 400 [uncertain: Leut.] of iron, soon after the 600
    [uncertain: Leute] which Michaelis must have first, to Bogadie as well; I shall then direct all the
    matters. Court Councillor Hahn writes that Weigel is threatening — Who can now compel Your Serene
    Highness to pay old debts.'
- page: 3
  en: 'the General Moratorium protects you indeed until Midsummer 1810. Of old debts one need only settle
    the interest; newly contracted ones, taken up after the granting of the General Moratorium, must,
    according to the newer edicts which have been issued in favour of the [uncertain: Zuwen] and usurers,
    be paid par force, and this is precisely what strikes me just now.


    Once more I beseech Your Serene Highness imploringly: do send me the 600 hundredweight of iron by
    the 23rd of April at the latest, so that I may be saved just this once — if you do not do this, then
    my whole civil existence is destroyed and my estates will be put up for forced sale against me. The
    600 hundredweight of iron are a trifle for Your Serene Highness, and you lose nothing thereby, but
    rather receive the money back at the latest by Midsummer, when all the interest comes in; the case
    is just the same with the 400 [uncertain: Leute] for von der Lahr, the debt is thereby now extinguished,
    and you will receive the 4000 Rthl assigned to me by the French General Government, so that then you
    have the money for 1000 [uncertain: Lentl] of iron again. Only be pleased to send it as far as Bogadel
    near Grüneberg, to be shipped to Oppeln. There I shall have it loaded and send it to Berlin; this
    too will cost a further 400 Rthl or so, yet I will defray these costs myself; only grant me this single
    act of grace and send the iron only as far as Boyadel.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    The reply from von der Lahr has


    remained with Amelang''s brother [uncertain: Bruch] in Kontop;


    I shall most humbly [uncertain: forward] the same


    by the next post


    Glogau


    the 21st of March


    1809.


    faithful and most obedient servant


    v. Triebenfeld'

- page: 3
  en: 'the general moratorium protects you indeed until Midsummer 1810. Of old debts one need only settle
    the interest; newly contracted ones, taken up after the granting of the general moratorium, must under
    the newer edicts issued in favour of the Jews and usurers be paid by force, and this is precisely
    what touches me now.


    Once more I beseech Your Serene Highness, do send me the 600 Centner of iron by the 23rd of April
    at the latest, that I may this once be saved — if you do not do this, then my whole civil existence
    is annihilated and my estates are put up for compulsory auction. The 600 Centner of iron are a trifle
    for Your Serene Highness, and you lose nothing thereby but at the most receive the money again by
    Midsummer, when all the interest comes in; the same is the case with the 400 Centner for van der Lahr:
    the debt is thereby now extinguished, and you receive the 4000 Rthl assigned to me by the French General
    Government, for then you have the money for 1000 Centner of iron again. Only be pleased to have it
    shipped as far as Bojadła near Zielona Góra [uncertain: instead of] to Opole. There I will have it
    loaded and send it to Berlin; this too costs another 400 Rthl or so; meanwhile I will indeed defray
    these costs, only show me this one grace and send the iron only as far as Bojadła.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    The answer from van der Lahr has remained with Amelang''s letter in Konotop; I shall most humbly transmit
    the same by the first post.


    Głogów, the 21st of March 1809.


    most faithful and obedient servant


    v Triebenfeld


    Let not Your Serene Highness keep me long waiting for an answer, for I cannot get away this evening
    until I have the assurance that the iron will certainly be at Konotop or Bojadła on the 23rd of April.
    As soon as I can show that, I can travel, and I shall then also have credit to [uncertain: discharge]
    the execution —'

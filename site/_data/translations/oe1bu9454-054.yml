- page: 2
  en: 'utterly unhappy; indeed I should have to flee like a rogue, leave everything in the lurch, and
    should lose my entire credit, which I now think to re-establish in such a fashion that I may again
    be effective for Your Serene Highness in every way. Have mercy, Most gracious Prince, and do not let
    me become a liar this time. The contract, as well as the bill of exchange, has been concluded judicially
    with Michaelis; I should be very wretched and worse than badly placed if I did not keep my word; I
    have resources [uncertain: resources] afterwards and can bring much about — Only this time honour
    and all hangs upon the fulfilment of the contract — Thereupon I [uncertain: lift] the execution and
    sequestration, make, once I have my estates again, a timber contract upon the Konotop timber, go,
    when this is settled, to Vienna and fetch the contracted arms, which is the King''s own hobby-horse,
    bring these to Koźle and then go again to Königsberg or wherever the King is; I can then bring about
    very much good — Concerning van der Lahr I have just now also received these enclosures; he offers
    already 5 1/2 Rthl per Centner of iron — but he must absolutely take the iron at 6 Rthl. I shall write
    to Amelang; may Your Most Serene Highness also be pleased to approach Amelang on that account once
    more, and have van der Lahr assured of this. I mean meanwhile to procure Your Serene Highness the
    4000 Rthl in Zagórów which are assigned, and then you will have your whole iron paid for again — Only
    be pleased to send the 400 Centner of iron, soon after the 600 Centner which Michaelis must have first,
    likewise to Bojadła; I shall then already direct all the matters. Court Councillor Hahn writes that
    Weigel is threatening — Who then can now compel Your Serene Highness to pay old debts.'

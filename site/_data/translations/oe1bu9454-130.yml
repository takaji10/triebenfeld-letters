- page: 2
  en: 'he is content that I lend him my name. I have therefore sent an express courier after Gleich, so
    that he may be back here by Saturday; I go today to Berlin, to sound out everything there - and when
    I come back on Saturday I shall settle everything here, go from here to Bersch, and with Heaven''s
    help conclude everything there too, and then hasten to Your Serene Highness; for to live longer in
    uncertainty would be the torment of hell - I do not know what Glenck thinks. Johann is indeed far
    too near. The post is about to depart; more from Berlin. In deepest reverence I remain, until death,
    Your Most Serene Highness''s Frankfurt an der Oder


    the 17th of May


    1804.


    faithful and most obedient servant


    v. Triebenfeld'

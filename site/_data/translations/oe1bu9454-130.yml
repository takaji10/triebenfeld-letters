status: draft
segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, some 2 hours ago I arrived here and heard to my vexation that Glenck
    had travelled after many, also that Leixner was absent and is not expected until today. In all things,
    however, unfortunately nothing has yet been done, and as I see, the one does not trust the other.
    Each thing I have arranged with M[r] Bernhard by the agreement "that I am to bring the [uncertain:
    reckoned] matter to a conclusion, that the estates shall remain in Your Serene Highness''s name -
    that thereupon Leixner will take [uncertain: Kaemen], and that this shall stand either in Your Serene
    Highness''s name or in mine; for as I have said, so has it been done. - Leixner is hard pressed. He
    is thereupon not to apply any further for the right of residence (Incolat). Count Schulemburg has
    got upon his roof - Meanwhile'

  en: '130


    Most Serene Prince


    Most gracious Prince and Lord, some 2 hours ago I [uncertain: am] arrived here and heard, to one''s
    vexation, that Glenck had travelled to many, and also that Leixner was absent and is not expected
    until today. In all of it, however, nothing has unfortunately been done yet, and as I see, the one
    does not trust the other. Meanwhile I have made the agreement with M. Bernhard "that I am to bring
    the Pszczew matter to a conclusion, that the estates are to remain in Your Serene [uncertain: Highness''s]
    name — that Leixner will then take Kamionna, and that this shall stand either in Your Serene Highness''s
    or in my name, for as I have said, so it has been done. — Leixner is hard pressed. He [uncertain:
    thereupon] will not apply further for the Incolat. Count Schulenburg has got onto his roof — Meanwhile'

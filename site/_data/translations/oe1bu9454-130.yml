- page: 2
  en: 'he is content if I lend him my name. I have therefore sent an express courier after Glenck so that
    he may be here again on Saturday; I go to Berlin today to sound everything out there, and when I return
    on Saturday I shall settle everything here, go from here to Pszczew, and with Heaven''s help finish
    everything there too, and then hasten to Your Serene Highness, for to live longer in uncertainty would
    be the torment of hell — I do not know what Glenck is thinking; Midsummer is indeed far too near —
    The post is about to go; more from Berlin. In deepest reverence I remain, until death, Your Most Serene
    Highness''s


    Frankfurt an der Oder, the 17th of May 1804.


    faithful and most obedient [uncertain: servant]


    v. Triebenfeld'

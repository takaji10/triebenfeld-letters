  en: 'South Prussia

    No. 5.

    received 23 February 1803

    19 Feb. 1803.


    His Majesty the King has been pleased to remit to Your Excellency and to me, for a report, the enclosed
    original petition of a former Starost von Prusimski and of one Xaver Jezierski for leave to return
    to their fatherland. As I consider it necessary for our full information to see the files of the proceedings
    on their offences and their property, I have had the rescript to the Government at Poznań, enclosed
    in draft and fair copy, dispatched, and most obediently ask Your Excellency (factum) kindly to countersign
    it, to forward the fair copy for dispatch, and to be so good as to have the draft returned to the
    Privy State Chancery.


    Berlin, 19 February 1803.


    Goldbeck


    To His Royal Actual Privy State, War and Cabinet Minister and directing Minister of Finance, Count
    von Haugwitz, Excellency'

segments:
- page: 1
  en: 'Copy


    For the Treasury.


    The utmost danger lies in delay. The Councillor of War and Forests von Triebenfeld at Kontop near
    Gruneberg in Silesia received, upon his own standing, on the 1st of February 1805 from the General
    Invalids'' Fund here a loan of 50000 Rthl Courant according to the coinage standard of 1764, in treatment-obligations
    then convertible at once into ready money without loss, against 5 per cent interest payable in half-yearly
    portions, and repayment of the annual loan upon a six months'' notice free to either party. Concerning
    this loan the same person executed on the 28th of January 1805 a judicial bond in favour of the General
    Invalids'' Fund, and therein, for the security of this loan, not only pledged his entire property
    to the said Fund as surety, but also besides that mortgaged and conditionally ceded to it an obligation
    which His Serene Highness the Prince of Hohenlohe-Ingelfingen had issued to him, von Triebenfeld,
    dated Breslau the 1st of June 1804, for the sum of 250000 and entered upon His Serene Highness''s
    Zagorowo estates, and further granted to it, in respect of its loan, priority before the 200000 Rthl
    still remaining to him under the latter obligation. Of the mentioned amount of the 50000 Rthl, the
    aforesaid von Triebenfeld has remained owing the interest at 5 per cent from the 1st of November 1807
    to the end of July 1871, that is for 3 3/4 years, amounting to 9375 s. Courant. All means of obtaining
    payment of this arrear of interest from him have been fruitless, and the General Invalids'' Fund has
    therefore seen itself compelled to avail itself of the rights belonging to it, both against von Triebenfeld
    and against the Zagorowo estates of His Serene Highness the Prince of Hohenlohe pledged to it, under
    the above-mentioned instrument of debt and pledge, in respect of this loan and of the interest remaining
    due thereon; and to this end it has judicially empowered the Royal Saxon and Ducal Warsaw Tribunal
    Advocate Mitschke at Kalisz, transmitting to him the original documents concerning that loan, to sue
    in its name before the competent Ducal Warsaw Tribunal, for the present against the possessor of the
    Zagorowo estates, for the interest outstanding on the capital of the 50000 Rthl, and if necessary
    to apply for the sequestration of these estates. Apart from the fact that, according to the intelligence
    obtained, the Zagorowo estates are very heavily encumbered with debt, there also arises here the ill
    circumstance that, as appears from the enclosed letter of von Triebenfeld of the 5th of this month
    to the General Invalids'' Fund, returned herewith under request for its restitution, and from the
    resolution of the Kalisz Prefecture appended to that letter in an attested copy, the capitals belonging
    to the General Invalids'' Fund in the Duchy of Warsaw, and mortgaged upon estates there, have together
    with the interest falling due been reckoned to the Bayonne sums. In these circumstances, and since,
    as appears from the mortgage certificate communicated to the Invalids'' Fund by the Głogau Superior
    Provincial Court by letter of the 21st of September 1810, likewise enclosed here sub petito retraditionis,
    the estate Kontop near Grüneburg in Silesia belonging to von Triebenfeld is encumbered with debt almost
    to the amount of its purchase price in the year 1800; further, since according to the statement of
    this letter of the Głogau Superior Provincial Court the estate Schwammern, still belonging to the
    aforesaid von Triebenfeld and situated in the department of the Brech Superior Provincial Court, is
    likewise burdened with considerable debts: the General Invalids'' Fund is without any security whatever
    in respect of the capital of 50000 Rthl due to it and of the interest outstanding thereon, which,
    as already mentioned, amounts by the last day of July of this year to 9375 Rthl Courant. This Fund
    has meanwhile learned that His Serene Highness the Prince of Hohenlohe-Ingelfingen has received from
    the estate of the Princess Selchen, deceased here, the sum of 80000 Rthl as a legacy, and will pay
    the same over again to the aforesaid von Triebenfeld in satisfaction of the sums of money owing to
    him; and I have been charged by this Fund, by its letter of the 29th instant enclosed in the original
    and founded upon the order of the Royal Privy Councillor of State and Chief of the General Police
    Department in the Ministry of the Interior [uncertain: Zimmerz] of the 28th of this month, enclosed
    in copy, to lay an arrest with all speed upon the aforesaid 8000 Rthl before a Most Laudable Supreme
    Court, to cover the loan of the 50000 Rthl Courant and the interest outstanding thereon from the 1st
    of November 1807 to the end of [uncertain: Ehrt.] 1811 amounting to 9375 Rthl Courant, and likewise
    the interest running from that date


    onward.


    This attachment is also in every respect well founded. For the grounding of an arrest in urgent and
    pressing cases, of which there is here question, since there is danger in delay,


    nothing further is required than


    1. that the petitioner or party seeking arrest state his claim with certainty, and wherein it consists.


    2. that he prove, or definitely state, the circumstances from which a present danger admitting of
    no delay may be gathered, and indicate the means of proof thereof.


    3. that he at once furnish an acceptable security, both to cover the judge and on account of the party
    arrested, for the disadvantage that may arise to him from the impairment.'

- page: 2
  en: 'From the third requisite, concerning the furnishing of security, the treasury, and therefore also
    the General Invalids'' Fund, which enjoys the rights of the treasury, is exempt, pursuant to § 33,
    Part 1, Title 29 of the Judicial Ordinance. It therefore turns only upon the presence of the other
    requirements of an application for arrest. The claim of the General Invalids'' Fund against von Triebenfeld
    for 50000 thalers of capital and the interest outstanding thereon at 5 per cent is, even though the
    original bond concerning it is not at present at hand, nevertheless attested by the files of the Military
    Department which concern this business of the loan and which are enclosed sub petito retraditionis,
    whereby the requisite under 1 is satisfied. It is further shown, by von Triebenfeld''s own letter
    of the 3rd of July and likewise by the decree of the Kalisz prefecture transmitted with that letter
    in authenticated copy, that the mortgage upon the Zagórów estates which he pledged and conditionally
    ceded to the General Invalids'' Fund as security for the said 50000 Rthl and interest has been added
    to the Bayonne sums, and that the possessor is to be compelled by execution to have the sum owed,
    together with the outstanding interest, registered anew in court. In this manner the General Invalids''
    Fund is deprived of the entire security for its claim, and since the state of von Triebenfeld''s property
    is notoriously much entangled and precarious, it is exposed to the danger of losing its capital of
    the 50000 Rthl and the interest outstanding thereon, and of being left empty-handed in that regard,
    unless the aforesaid 80000 Rthl be laid under arrest; in this way the second requirement of a laying
    of arrest is also present here. The circumstance that von Triebenfeld is the original debtor of the
    50000 and of the said interest, and that the 80000 Rthl in question are bequeathed to the Prince of
    Hohenlohe-Ingelfingen, cannot be prejudicial here. For the Prince, in respect of the 250000 Rthl against
    the pledging and conditional cession of which 50000 Rthl were lent to von Triebenfeld by the General
    Invalids'' Fund, is a debtor of von Triebenfeld, and the General Invalids'' Fund is entitled, by virtue
    of the cession granted to it, to exercise all rights against the Prince which belong to its cedent,
    the said von Triebenfeld, for by virtue of its cession it has stepped into the place of the latter.
    The arrest upon these 50000 Rthl is founded in every respect, whether the Prince be still the owner
    of them or have already made them over to von Triebenfeld for his satisfaction. Both the Prince and
    von Triebenfeld are held liable to the General Invalids'' Fund, and both are no longer secure for
    it now. Von Triebenfeld does indeed possess estates in these lands, but they are so heavily indebted
    that they afford no security, and therefore, pursuant to § 10, Part 1, Title 29 of the Judicial Ordinance,
    the arrest takes place nonetheless, although he is resident in the Royal lands. I most obediently
    beg a Most Laudable Chamber Court "most graciously to grant this application for arrest, and, since
    the General Invalids'' Fund has learnt that His Excellency the Minister of Justice von Kircheisen
    is said to be the executor of the testament of the late Princess von Sacken, not only to cause the
    requisite order of arrest to issue to him with the utmost speed, but at the same time also to declare
    the said Fund, by decree, put in possession of these 80000 Rthl in respect of the capital of the 50000
    Rthl which it has to claim, together with the interest thereon,


    as aforesaid."


    Berlin, the 30th of July 1811


    Seelmann'

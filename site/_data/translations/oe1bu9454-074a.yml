status: draft
segments:
- page: 1
  en: 'Copia. Pro Fisco. Summum periculum in mora. The Councillor of War and Forests von Triebenfeld at
    Kontop near Gruneberg in Silesia received, upon his own standing, on the 1st of February 1805, from
    the General Invalids'' Fund here, a loan of 50000 Rthl Courant according to the coinage standard of
    1764, in Behandlungs-Obligationen [treatment obligations] then convertible into ready money at once
    without loss, against 5 per cent interest payable in half-yearly instalments, and repayment of the
    annual loan upon a six months'' notice open to either party. Concerning this loan he issued, under
    the 28th of January 1805, a judicial bond to the General Invalids'' Fund, and therein, for the security
    of this loan, not only pledged to the said Fund his entire property as surety, but besides that also
    pledged and conditionally ceded to it an obligation of His Serene Highness the Prince of Hohenlohe
    Ingelfingen, of date Brulau the 1st of June 1804, made out to him, von Triebenfeld, for the sum of
    250000 [uncertain: made out] and entered upon His Serene Highness''s Zagorow estates, and likewise
    granted to it, in respect of its loan, priority before the 200000 Rthl still remaining to him under
    the latter obligation. Of the said sum of the 50000 Rthl, the said von Triebenfeld has remained owing
    the interest at 5 per cent from the 1st of November 1807 until the end of July 1811, that is for 3
    3/4 years, amounting to 9375 [illegible] Courant. All means of obtaining payment of this arrear of
    interest from him have been fruitless, and the General Invalids'' Fund has therefore found itself
    compelled to make use of the rights belonging to it, both against von Triebenfeld and against the
    Zagorow estates of His Serene Highness the Prince of Hohenlohe pledged to it, arising out of the abovementioned
    instrument of debt and pledge, in respect of this loan and of the interest remaining due thereon;
    and to this end it has judicially empowered the Royal Saxon and Ducal Warsaw Tribunal Advocate Mitschke
    at Kalisz, transmitting to him the original documents concerning that loan, to sue in its name before
    the competent Ducal Warsaw Tribunal, for the present against the possessor of the Zagorow estates,
    for the interest outstanding on the capital of the 50000 Rthl, and if necessary to seek the sequestration
    of these estates. Apart from the fact that, according to information gathered, the Zagorow estates
    are very heavily encumbered, there arises here also the inconvenience that, according to the enclosed
    letter of von Triebenfeld of the 5th of this month to the General Invalids'' Fund, submitted with
    the request for its return, and the resolution of the Kalisz Prefecture attached to that letter in
    an authenticated copy, the capitals belonging to the General Invalids'' Fund in the Duchy of Warsaw
    and mortgaged upon estates there have, together with the interest outstanding, likewise been reckoned
    to the [uncertain: Bayonne sums]. In these circumstances, and since, as appears from the mortgage
    certificate communicated to the Invalids'' Fund by the Plogan Superior Provincial Court by letter
    of the 21st of September 1810, and here likewise enclosed sub petito retraditionis, the estate Kontop
    near Grüneburg in Silesia belonging to von Triebenfeld is encumbered almost to the height of its purchase
    price in the year 1800; further, since according to the tenor of this letter of the Glogan Superior
    Provincial Court the estate Schwammern, still belonging to the said von Triebenfeld and situated in
    the department of the Brech Superior Provincial Court, is likewise burdened with considerable debts:
    the General Invalids'' Fund is without any security whatever for the capital of 50000 Rthl which it
    has to demand and for the interest outstanding thereon, which, as already mentioned, already amounts
    by the last day of July of this year to 9375 Rthl Courant. This Fund has meanwhile learnt that His
    Serene Highness the Prince of Hohenlohe Ingelfingen has received from the estate of the Princess von
    Sacken, deceased here, the sum of 80000 Rthl as a bequest, and will pay the same over again to the
    said von Triebenfeld in satisfaction of the sums of money owing to him; and I have been charged by
    this Fund, by the letter of the 29th hujus enclosed in the original, which rests upon the order of
    the Royal Privy Councillor of State and Chief of the General Police Department in the Ministry of
    the Interior of the 28th of this month, enclosed in copy, to lay an arrest with all speed upon the
    aforesaid [uncertain: 8000] Rthl before a Most Laudable Superior Court of Appeal [Kammergericht],
    for the covering of the loan of the 50000 Rthl Courant and of the interest outstanding thereon from
    the 1st of November 1807 to the end of [uncertain: Ehrt.] 1811 amounting to 9375 Rthl Courant, and
    likewise of the interest running from then onward. This arrest is well founded in every respect. For
    the grounding of an arrest in urgent and pressing cases, of which there is [illegible] here, since
    there is danger in delay, nothing further is required than: 1. that the implorant or party seeking
    arrest state his claim with certainty, and in what it consists. 2. that he prove, or definitely state,
    the circumstances from which a present danger admitting of no delay may be gathered, and indicate
    the means of proof thereof. 3. that he at once furnish an acceptable security both for the covering
    of the judge and of the arrestandus, on account of the disadvantage that may arise to the latter from
    the impounding.'
- page: 2
  en: 'From the third requisite, concerning the furnishing of security, the fiscus, and therefore also
    the General Invalids'' Fund, which has the Jura Fisci, is exempt according to the measure of § 33
    Part 1 Title 29 of the Judicial Ordinance. It therefore depends only upon the presence of the other
    requirements of a petition for arrest. The claim of the General Invalids'' Fund against von Triebenfeld
    for 50000 Rthl of capital and the interest outstanding thereon is, even though the original bond concerning
    it is not at present at hand, nevertheless certified by the files of the Military Department which
    concern this loan transaction and which are enclosed sub petito retraditionis, whereby the requisite
    under 1 is satisfied. It is further shown by the autograph letter of von Triebenfeld of the 3rd of
    July, and likewise by the decree of the Kalisz Prefecture transmitted in authenticated copy with that
    letter, that the mortgage upon the Zagorow estates, pledged and conditionally ceded by him to the
    General Invalids'' Fund as security for the said 50000 Rthl and interest, has been reckoned to the
    Bayonne sums, and that the possessor is to be compelled by execution to have the sum owing, together
    with the interest in arrear, entered anew judicially. In this way the General Invalids'' Fund is deprived
    of the whole security of its claim, and since the property circumstances of von Triebenfeld are notoriously
    very entangled and precarious, it is exposed to the danger of coming short of its capital of the 50000
    Rthl and the interest outstanding thereon, and of being left with nothing but the empty looking-on,
    if the aforesaid [uncertain: 8]0000 Rthl are not laid under arrest; in such wise the 2nd requirement
    of an arrest is likewise present here. The circumstance that von Triebenfeld is the original debtor
    of the 50000 and of the said interest, and that the 80000 Rthl in question are bequeathed to the Prince
    of Hohenlohe Ingelfingen, cannot be prejudicial here. For the Prince is, in respect of the 250000
    Rthl, against the pledging and conditional cession of which the 50000 Rthl were lent to von Triebenfeld
    by the General Invalids'' Fund, a debtor of von Triebenfeld; and the General Invalids'' Fund is, by
    virtue of the cession granted to it, entitled to exercise all rights against the Prince which belong
    to its cedent, the said von Triebenfeld, for by virtue of its cession it has stepped into the place
    of the latter. The arrest upon these 50000 Rthl is founded in every respect, whether the Prince be
    still owner of them, or have already made them over to von Triebenfeld for his satisfaction. Both
    the Prince and von Triebenfeld are bound to the General Invalids'' Fund, and both are now no longer
    safe for it. Von Triebenfeld does indeed possess estates in these lands, but they are so encumbered
    that they afford no security, and therefore, according to § 10 Part 1 Title 29 of the Judicial Ordinance,
    the arrest nonetheless takes place, although he is resident in the Royal lands. I most obediently
    beg a Most Laudable Superior Court of Appeal to grant this petition for arrest most graciously, and,
    since the General Invalids'' Fund has learnt that the Minister of Justice von Kircheisen, His Excellency,
    is said to be executor of the will of the late blessed Lady Princess von Sacken, not only to cause
    the requisite order of arrest to be issued to him citissime, but at the same time to declare the said
    Fund, per decretum, put into possession of these 80000 Rthl in respect of the capital of the 50000
    Rthl which it has to demand together with the interest thereon. Berlin, the 30th of July 1811. Seelmann'

- page: 1
  en: '74


    Copy


    Pro Fisco.


    There is the utmost danger in delay. The Councillor of War and Forests von Triebenfeld at Konotop
    near Zielona Góra in Silesia received, upon his own credit, on the 1st of February 1805, from the
    General Invalids'' Fund here, a loan of 50000 Rthl Courant according to the coinage standard of 1764,
    in Maritime Trading Company obligations which at that time could be converted at once into ready money
    without loss, against 5 per cent interest payable in half-yearly instalments, and repayment of the
    loan upon six months'' notice, free to either party. For this loan he issued to the General Invalids''
    Fund, under the 28th of January 1805, a judicial bond, and therein, for the security of this loan,
    not only pledged the whole of his property to the said Fund as surety, but in addition also mortgaged
    and conditionally ceded to it an obligation which His Serene Highness the Prince of Hohenlohe-Ingelfingen,
    dated Wrocław the 1st of June 1804, had [uncertain: made out] to him, von Triebenfeld, for the sum
    of 250000 Rthl and which was registered against His Serene Highness''s Zagórów estates, and likewise
    granted the said Fund, in respect of its loan, priority over the 200000 Rthl still remaining to him
    under the latter obligation. Of the mentioned [uncertain: loan] of the 50000 Rthl, von Triebenfeld
    has remained in arrears with the interest at 5 per cent from the 1st of November 1807 to the end of
    July 1811, that is for 3 3/4 years, amounting to 9375 Rthl Courant. All means of obtaining payment
    of this remainder of interest from him have been fruitless, and the General Invalids'' Fund has therefore
    found itself obliged to avail itself of the rights belonging to it, both against von Triebenfeld and
    against the Zagórów estates of His Serene Highness the Prince of Hohenlohe mortgaged to it, arising
    out of the above-mentioned instrument of debt and pledge, in respect of this loan and of the interest
    outstanding thereon; and to this end it has judicially empowered the Royal Saxon and Ducal Warsaw
    tribunal advocate Mitschke at Kalisz, transmitting to him the original documents concerning that loan,
    to sue judicially in its name before the competent Ducal Warsaw tribunal, for the present against
    the possessor of the Zagórów estates, for the interest outstanding on the capital of the 50000 Rthl,
    and if necessary to apply for the sequestration of these estates. Apart from the fact that, according
    to information obtained, the Zagórów estates are very heavily indebted, there arises here the further
    inconvenience that, according to the letter of von Triebenfeld of the 5th of this month to the General
    Invalids'' Fund, enclosed with the request that it be returned, and according to the resolution of
    the Kalisz prefecture attached to that letter in certified copy, the capitals owing to the General
    Invalids'' Fund in the Duchy of Warsaw and mortgaged upon estates there have likewise, together with
    the outstanding interest, been added to the Bayonne sums. In these circumstances, and since, as appears
    from the mortgage certificate communicated to the General Invalids'' Fund by the Głogów Higher Provincial
    Court by letter of the 21st of September 1810, and likewise enclosed here sub petito retraditionis,
    the estate of Konotop near Zielona Góra belonging to von Triebenfeld is indebted almost to the amount
    of its purchase [uncertain: price] in the year 1800, and further, as that letter of the Głogów Higher
    Provincial Court shows, the estate of Świniary still belonging to the said von Triebenfeld, situated
    in the department of the Wrocław Higher Provincial Court, is likewise burdened with considerable debts,
    the General Invalids'' Fund is without any security whatever for the capital of 50000 Rthl which it
    has to claim and for the interest outstanding thereon, which, as already noted, already amounts to
    9375 Rthl Courant up to the last day of July of this year. This Fund has meanwhile learnt that His
    Serene Highness the Prince of Hohenlohe-Ingelfingen has received, out of the estate of the Prince
    [uncertain: Selchen] deceased here, the sum of 80000 Rthl as a legacy, and that he will pay the same
    over again to the said von Triebenfeld in satisfaction of the sums of money owed to him; and I have
    been charged by this Fund, by its letter of the 29th of this month, enclosed in the original, which
    is founded upon the order of the Royal Privy Councillor of State and Chief of the General Police Department
    in the Ministry of the [uncertain: Interior] of the 28th of this month, enclosed in copy, to lay arrest
    with all speed upon the aforesaid 80000 Rthl before a Most Laudable Chamber Court, to cover the loan
    of the 50000 Rthl Courant and the interest outstanding thereon from the 1st of November 1807 to the
    end of July 1811 amounting to 9375 Rthl Courant, as well as the interest running from that date. This
    laying of arrest is also well founded in every respect. For the grounding of an arrest in speedy and
    urgent cases, which is what is in question here, since there is danger in delay, nothing further is
    required than


    1. that the applicant, or party seeking arrest, state his claim and wherein it consists.


    2. that he prove, or definitely state, the circumstances from which a present danger admitting of
    no delay may be gathered, and indicate the means of proof thereof.


    3. that he immediately furnish an acceptable security, both to cover the judge and the party arrested,
    on account of the detriment that may arise to the latter from the attachment.'

- page: 2
  en: 'From the third requisite, namely the furnishing of security, the Treasury is exempt, and therefore
    also the General Invalids'' Fund, which holds the rights of the Treasury (Jura Fisci), pursuant to
    § 33 Part 1, Title 29 of the Court Rules. It therefore depends only upon the presence of the other
    requirements of a petition for arrest. The claim of the General Invalids'' Fund against von Triebenfeld
    for 50000 thl. of capital and the interest outstanding thereon is attested, even though the original
    bond concerning it is not presently at hand, by the files of the Military Department which concern
    this loan transaction and are enclosed sub petito retraditionis, whereby the requisite under 1 is
    satisfied. It is further shown, by the letter of von Triebenfeld in his own hand of the 3rd of July,
    and likewise by the decree of the Kalisz Prefecture transmitted with that letter in an authenticated
    copy, that the mortgage upon the Zagorowo estates pledged and conditionally ceded by him to the General
    Invalids'' Fund as security for the said 50000 Rthl and interest has been reckoned to the Bayonne
    sums, and that the possessor is to be held to it by execution, to have the sum owing together with
    the outstanding interest newly entered in court. In this manner the General Invalids'' Fund is deprived
    of the whole security of its claim, and since the property circumstances of von Triebenfeld are notoriously
    very entangled and precarious, it is exposed to the danger of losing its capital of 50000 Rthl and
    the interest outstanding thereon, and of being left with nothing but the empty looking-on in that
    regard, unless the aforesaid [uncertain: 8]0000 Rthl are laid under arrest; in this manner the second
    requirement of an attachment is here likewise present. The circumstance that von Triebenfeld is the
    original debtor of the 50000 and of the said interest, and that the 80000 Rthl in question are bequeathed
    to the Prince of Hohenlohe-Ingelfingen, cannot be prejudicial here. For the Prince is, in respect
    of the 250000 Rthl against the pledging and conditional cession of which 50000 were lent to von Triebenfeld
    by the General Invalids'' Fund, a debtor of von Triebenfeld, and the General Invalids'' Fund is entitled
    by virtue of the cession granted to it to exercise all rights against the Prince which belong to its
    cedent, the aforesaid von Triebenfeld, for by virtue of its cession it has stepped into the place
    of the latter. The arrest upon these 50000 M. is founded in every respect, whether the Prince be still
    the owner of them or have already made them over to von Triebenfeld for his satisfaction. Both the
    Prince and von Triebenfeld are bound to the General Invalids'' Fund, and both are now no longer secure
    for it. Von Triebenfeld does indeed possess estates in these lands, but they are so encumbered with
    debt that they afford no security, and therefore, pursuant to § 10 Part 1, Title 29 of the Court Rules,
    the arrest nevertheless takes place, although he is resident in the Royal lands. I most obediently
    beg a Most Laudable Supreme Court most graciously to grant this petition for arrest, and, since the
    General Invalids'' Fund has learned that His Excellency the Minister of Justice von Kircheisen is
    said to be executor of the will of the late blessed Princess von Sacken, to cause not only the requisite
    order of arrest to issue to him with the utmost speed, but also at the same time to declare the said
    Fund, by decree, put in possession of these 80000 Rthl in respect of the capital of 50000 Rthl due
    to it together with the interest thereon.


    Berlin, the 30th of July 1811


    Seelmann'

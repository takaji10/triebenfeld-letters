  en: 'Document no. 280


    1418, 3 June, at Ląd.


    Zygfryd, abbot of the monastery of Ląd, exchanges with the peasant Wawrzyniec Jeleniowicz the farm
    in Wronczyno Wielkie for the farm in Drzewce.


    In the name of the Lord, amen. For the perpetual memory of the matter. Since among the goods of human
    nature nothing is held worthier than memory, it is fitting that the acts of men be made lasting by
    the points of letters and the noting of witnesses, lest they vanish with the passing of time. Therefore
    we, Zygfryd, abbot, and the whole convent of the monastery of Ląd, of the Cistercian Order, make known
    by the tenor of these presents to all whom it concerns, present and to come, who will have knowledge
    of these presents, how, wishing to increase the goods of our monastery with the gain of profits, and
    to bring its fruits and revenues to betterment in the time of our rule, and because (between) us,
    the convent, on the one part, and the provident Wawrzyniec Jeleniowicz, peasant of Great Wronczyn¹⁾,
    we have made and agreed such a perpetual and irrevocable exchange: that to the same Wawrzyniec Jeleniowicz
    and his descendants and lawful successors we have given, granted, inscribed and exchanged for ever
    our farm in Great Wronczyn, with the fields belonging to it of old and with the meadows there called
    Obroczna and Dokolowka, for our other farm in Drzewce,²⁾ which he had formerly bought from Brother
    Henryk of good memory, abbot, our predecessor, for a certain sum of money, namely for fifteen marks
    of current money, reckoning forty-eight groschen to each mark, by a true exchange duly and reasonably
    made by us with him, and we give, grant, inscribe and exchange it for ever. To this Wawrzyniec and
    his descendants we have also assigned and exchanged by these presents, by reason of his beehives,
    which are called barcz, standing between our estates of Great Wronczyn and Zagórów, which he had and
    held in our forest, four gardeners there in Great Wronczyn, who formerly belonged to our court. And
    this Wawrzyniec and his successors shall be bound and obliged to pay us, the convent, and our successors
    as rent one mark and a half in such money as his other neighbours and our people of the said farm
    in Great Wronczyn pay on the feast of St Martin: adding also to him and his descendants one weir called
    yaz, for fishing freely in the stream, otherwise strumyen, flowing and standing between the estates
    of Skrzynica and Kościół. Moreover the same Wawrzyniec and his descendants are to give the sheaf tithe
    from all the fields and ploughlands of the said farm to no one else but us and the convent: this being
    added and specially expressed, that the said Wawrzyniec and his descendants shall be bound and obliged
    to perform and do any services for us and the convent at our command, and to defend, guard and look
    after our forest and woods from damages and dangers with our help. In witness of these letters, to
    which our seal and that of the convent are hung. Done and given in our monastery of Ląd on the Friday
    after the octave of Corpus Christi, in the year of the Lord 1418. In the presence of these lords:
    the venerable Donin, protonotary of the Apostolic See, dean of Kraków, vice-chancellor of the Kingdom
    of Poland, Dobek Kobyła, etc.


    From the Cologne copy-book of the privileges of Ląd, fol. 35.


    ¹⁾Wronczyn, a village in the district of Poznań.


    ²⁾Drzewce: which of the many villages of this name it was, I cannot judge. In the district of Poznań
    there is no village of this name.'

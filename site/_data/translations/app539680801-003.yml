- page: 3
  en: 'parts, to others, and to come to terms with these new takers as best they can to their own advantage.


    § IV


    Their establishments both the present hereditary lessees and the other future takers must effect at
    their own cost, now and in future, and they receive for this neither remission of the hereditary rent
    nor other building assistance; they may, however, use for this the timber standing on the Hufen received
    in hereditary lease, which belongs to them all in property without any exception.


    § V


    These Hufen taken in hereditary lease shall be duly measured out to the hereditary lessees in the
    Drzewiec forest district as soon as the weather allows, and delivered into their possession.


    § VI


    Since, as aforesaid, the hereditary lessees must make the land arable for themselves by clearing,
    they receive for this, one like another, four free years, which begin at Christmas of this year and
    end at Christmas One Thousand Eight hundred and Eight; during these four years the hereditary lessees
    need pay not a farthing of hereditary rent, but they pay the first half-yearly hereditary rent of'
  names:
  - de: Drzewiecer Revier
    en: Drzewiec forest district
    kind: place
- page: 4
  en: 'One Thousand five hundred Reichsthaler only at Midsummer One Thousand Eight Hundred and Nine, from
    which time this payment of rent is continued half-yearly.


    § VII


    Besides this annual hereditary rent the hereditary lessees undertake, for themselves and their descendants,
    to render the royal and other public dues that shall hereafter be fixed upon the One hundred Hufen,
    by whatever name they may go.


    § VIII


    The hereditary lessees have not the least claim to any firewood or pasture in the other manorial woods;
    they and the other takers are, however, permitted to graze their cattle free of charge in that part
    of the woods near Drzewiec which the ground lordship does not sell but keeps for itself, and where
    there are no young plantations or plantings of timber; the right of the ground lordship to let out
    these remaining parts of the wood as well shall, however, not be restricted by this in the least,
    but the hereditary lessees'' right of pasturage ceases entirely as soon as such a case of sale occurs.


    § IX


    The hereditary lessees are granted the liberty to set up on their ground a brick kiln'
  names:
  - de: Drzewiec
    en: Drzewiec
    kind: place
- page: 5
  en: 'and to burn for themselves the bricks and roofing tiles they need, without anything having to be
    paid for this to the ground lordship.


    § X


    The hereditary lessees must divide the Hufen they have taken among themselves in the best possible
    manner, without the ground lordship concurring in this in the least, since it is bound only to allot
    to them the total of the 100 Hufen; the ground lordship undertakes, however, to bear the whole costs
    of this allotment in the manner determined in § I.


    § XI


    The present hereditary lessees, as also the other takers, are free to alienate their holding to others
    in any manner they please; but at every change of possession, be it by sale or exchange, the tenth
    Groschen of the purchase money or of the amount of the exchange must be paid to the ground lordship
    as a transfer fee (Laudemium), and the ground lordship always holds to the new taker, whose affair
    it remains not to pay out the purchase money to the seller until the transfer fee is settled.


    On inheritance, or where the holding is given up to children and collateral relations, on the other
    hand, no transfer fee is paid, and in the same way the first takers from the present'
  numbers:
  - '100'
- page: 6
  en: 'hereditary lessees are wholly exempt from it.


    § XII


    At the end of the four free years, and at the latest at Midsummer One Thousand Eight hundred and Nine,
    the hereditary lessees and the other takers are free to redeem the stipulated hereditary rent of thirty
    Reichsthaler per Hufe up to one half, by payment of the capital sum at Five per cent; that is to say,
    each of them may pay off to the ground lordship in cash One, two, up to three hundred Reichsthaler
    per Hufe, which capital then remains the property of the ground lordship, and for every One hundred
    Reichsthaler paid, Five Reichsthaler of annual rent are written off for the hereditary lessees. The
    second half of the hereditary rent, of Fifteen Reichsthaler per Hufe, remains however irredeemable
    for everlasting time.


    § XIII


    The hereditary lessees and their descendants remain for ever wholly free of all hereditary subjection,
    and need render the ground lordship not the least manorial service nor deliver anything in kind. They
    are, however, without exception subject for ever to the jurisdiction of the manorial lordship (Dominium).


    § XIV


    Besides the One hundred Hufen on which they pay rent, there is allotted to the whole community'
- page: 7
  en: 'once and for all, namely 1. for the schoolmaster Fifteen Morgen — 15 Morgen


    2. For the village mayor — 5 Morgen


    and 3. for the churchyard, say one Morgen — 1 Morgen


    in all 21 Morgen, say one and twenty Morgen Magdeburg measure, free of charge and free of rent.


    § XV


    Their drink, of beer and brandy, the hereditary lessees and their successors in possession must always
    take from the manorial brewery and distillery or from the tavern, and for every quart of brandy brought
    in from other estates pay One Reichsthaler, and for every barrel of beer five Reichsthaler, as a penalty
    to the ground lordship.


    § XVI


    The hereditary lessees, for themselves and their descendants, hereby expressly renounce all and every
    remission in cases of misfortune, whether they arise through fire from heaven, the incendiarism of
    evil persons, crop failure, hailstorm, inundation, cattle plague, war and pestilence, or in whatever
    manner it may be, and on that account neither a compensation nor a remission of the hereditary rent
    shall ever avail them.


    § XVII


    The costs of this contract, of its'

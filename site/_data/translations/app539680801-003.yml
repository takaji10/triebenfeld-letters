  - '21'
- page: 8
  en: 'confirmation and official copy, the hereditary lessees undertake to settle.


    § XVIII


    So long as the hereditary lessees and their successors in possession fulfil these obligations here
    written down, they shall be protected by the ground lordship in their rights in every respect, and
    defended and held harmless against every man''s claims in rem.


    Should they, however, remain in arrears with the annual hereditary canon for longer than two years,
    they then forfeit this hereditary lease and the ground lordship is entitled to let it out otherwise,
    in which case only their improvements may be made good to the hereditary lessees.


    § XIX


    For the due and prompt payment of the hereditary rent fixed, the hereditary lessees and the future
    takers, as also their successors in possession, are liable for ever One for All and All for One, and
    thus jointly and severally, in such manner that the ground lordship shall be entitled on this account
    to hold either to the One or the Other, or else to the whole community.


    Both parties promise to hold to the foregoing hereditary-lease contract firmly and inviolably, and
    renounce all legal pleas'
- page: 9
  en: 'that might be raised against it, in particular the objection of an injury suffered above and below
    the half, of crafty persuasion, of overhaste, or of the impossibility of getting the rent out of the
    thing, of matters agreed otherwise than written down or not rightly understood; and His Princely Serene
    Highness expressly consents that the hereditary lessees, each one of them, may on the ground of this
    contract have his title of possession (titulum possessionis) of his holding settled in his own name.
    The contracting parties had nothing more to state; they asked for the confirmation and the official
    copy of this contract, and after this protocol had been read out to them word for word, and they had
    also been instructed that the renunciation of the legal pleas and objections carries with it the entire
    loss of the same, they once more renounced them after due deliberation, and in token of their approval
    have subscribed and signed below in their own hand.


    von Triebenfeld


    read and approved


    Friedrich Ludwig, Prince of Hohenlohe


    Johann Friedrich Tiernow



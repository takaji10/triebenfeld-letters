  en: '12. Ephraim Fuchs — 5 Hufen


    13. Johann Halbott — 5 Hufen


    14. Dr. Johann Wendel Heilmann — 5 Hufen


    15. Martin Dikhoff — 5 Hufen


    16. Michael Just — 5 Hufen


    17. Johann Luckow — 5 Hufen


    18. Johann Liewert — 5 Hufen


    Total as above 100 Hufen, for everlasting and perpetual time in hereditary lease, under the following
    conditions.


    § II.


    Of entry money not a farthing is paid, since these One hundred Hufen are waste land overgrown with
    wood, which must first be cleared. On the other hand a perpetual hereditary canon of 30 Rthl, say
    thirty Reichsthaler, per Hufe Magdeburg measure, and thus for 100 Hufen in all 3,000 Rthl, say three
    Thousand Reichsthaler, is paid from it yearly to the ground lordship in two instalments, namely with
    the one half of 1,500 Rthl, say One Thousand Five hundred Reichsthaler, at Midsummer and with the
    other half of 1,500 Rthl, say one Thousand Five hundred Reichsthaler, at Christmas, in good Courant
    such as the treasuries accept.


    § III.


    The hereditary lessees are free to make over these Hufen which they have acquired, in several separate'

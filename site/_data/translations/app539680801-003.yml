  en: 'estate of Olesnica.


    17. Johann Luckow and 18. Johann Liewert from the Princely estate of Swięcia, on the other part.


    The parties appearing are personally known to the undersigned (Subscriptis), and there is no doubt
    as to their capacity to execute judicial acts validly.


    The same declare, of their own free will and after due deliberation, the following hereditary-lease
    contract to the protocol.


    § I.


    Namely, His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, through his general attorney
    the Councillor of War and Councillor Mr von Triebenfeld, who is legitimated by the annexed power of
    attorney, makes over, from the forest belonging to his estate of Drzewiec, the area of 100 Hufen,
    in words One hundred Hufen Magdeburg measure, reckoned at thirty Morgen to the Hufe and each Morgen
    at one hundred and Eighty square rods, to the aforesaid residents, namely:


    1. Johann Friedrich Turno — 5 Hufen


    2. Martin Dikhoff — 5 Hufen


    3. Johann Martin Sydow — 5 Hufen


    4. Johann Gottlieb Haberland — 10 Hufen


    5. Samuel Schubert — 5 Hufen


    6. Michael Dikhoff — 10 Hufen


    7. Gottfried Dikhoff — 5 Hufen


    8. Friedrich Siering — 5 Hufen


    9. Christ. Friedr. Vagel — 5 Hufen


    10. Johann Wilh. Böttcher — 5 Hufen


    11. Johann Büchner — 5 Hufen'

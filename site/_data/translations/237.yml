status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord,


    Your Most Serene Highness, I wrote of late by a messenger and sent the letter to the Amtman König,
    and they could and he may and he can also forward the same to him by an express to Schlawenschi —
    but the fellow did not do this, and instead put the letter into the post at Pol Wartemberg. For some
    days now I have been hoping for a gracious reply from Your Serene Highness. Now I can wait no longer;
    I must set out this night for Dresden, for my eldest son lies wounded at Naumburg on the Saale and
    has been shot through both thighs. I therefore go, as said above, this day by way of Dresden thither,
    and shall return to Dresden in twelve days at the most. May Your Most Serene Highness only deign to
    send the letter now to Dresden, and most graciously have it noted upon the address that the [uncertain:
    calling / office] should remain lying at the post until called for by myself in person. — As soon
    as I have the letter from Your Serene Highness to His Majesty the Emperor, drawn up in the manner
    of Fieder, I shall certainly get Trąbczyn and Kaemen back again. Neither Trzcinski nor König nor Zerboni
    nor Meierowitz have I to this day set eyes upon with'
- page: 2
  en: 'a single eye; even to all my letters I receive nothing but dizzying evasions. — With [uncertain:
    Mecerowitz / Meierowitz] alone the execution has been laid on. — Radke cannot get away at present,
    for in his neighbourhood there stand some 80000 Russians. Perhaps it will go better when I return
    from Dresden.


    In deepest respect I remain, until death, Your Most Serene Highness''s


    Kalisz, the 29th of April 1813


    most humble and obedient servant

    v Triebenfeld'

segments:
- page: 1
  en: 'Right Honourable Sir, Most Highly Revered General,


    The late King conferred upon me in the year 1796, in the province of South Prussia, the Kaemener and
    Trąbczyner estates confiscated from a certain Prussiemski. The former lie below Miedzeritz in the
    Posen Department, the latter however in the Kalisch [Department], on this side of the Warthe in the
    Konin district. The administrative Commission which assembled in the year 1806 in the province of
    Warsaw took the estates from me by force in 1807, and that fourteen weeks after the Peace of Tilsit,
    and gave them back to the daughter of Prussiemski, now married as Miączyńska. I brought suit over
    this before the Kalisch Tribunal; after a year and a day I received from the said Tribunal the resolution
    that it did not hold itself empowered to set aside the disposition of the Commission of that time,
    and that I should turn in this matter to the Emperor Napoleon — this was against my feeling, and the
    v. Moscinska possesses the estates still to this day. Last year my general plenipotentiary, the Councillor
    of War and Forests v. Triebenfeld, applied in this matter to His Highness the Prince v. Hardenberg.
    The Prince directed him to let this business rest so long, until Pahlen''s affairs should have been
    decided. As the [uncertain: Wust] now says, this has come about, and as I hear, the Prosna is to form
    the boundary. In this manner the district in which the Trąbczyner estates lie falls to His Majesty
    the Russian Emperor. Being unacquainted with the [uncertain: Vnstl.] course of business, I now do
    not know to whom I should turn for the [uncertain: rectomirung] of the estates; indeed still more,
    I fear the influence which the Moscinska is said to have upon the Governor-General [uncertain: Landskog].
    In this straitened situation I turn with the most heartfelt entreaty to Your Right Honourable, that
    you may let me have the benefit of your good word with His Imperial Majesty, and so direct the matter
    that the Emperor himself shall command that the Trąbczyner estates, together with the revenues of
    eight years, be restored to me. May Your Right Honourable deign to grant the Councillor of War v.
    Triebenfeld a favourable hearing, and most kindly impart to him the necessary instructions. With unbounded
    gratitude, and the most especial high regard, I shall ever be


    Your Right Honourable''s [text lost]


    Schlawenschitz, the 15th of January 1815.'

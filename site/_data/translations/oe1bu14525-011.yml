- page: 1
  en: 'We Friedrich Wilhelm, by the Grace of God King of Prussia etc., do hereby certify and declare,
    and by force of this Our open letter, for Ourselves and Our descendants and successors in the Crown,
    the Electorate and Our remaining lands, that We, out of the particular friendship and affection We
    bear toward the High-Born Prince, Our kindly beloved Uncle Friedrich Ludewig, reigning Prince of Hohenlohe-Ingelfingen,
    as also in order to give him a fresh proof of Our Royal gratitude for the distinguished and beneficial
    services rendered to Us and to Our Royal House, have found Ourselves moved to make over, grant and
    convey to His Lordship, in heritable and proprietary form, the appurtenances belonging to those estates
    already conferred upon him by the instrument of the 19th of June of this year, namely Betsche, Zagórów
    and Wienietz, to wit:


    1. at Betsche, the villages of Stołuń, Kuligowo, Szarcz, the bailiwick of Zielomyśl and Silna, together
    with the Hollander holdings, the Pomherr Hollander holding and Heidemühle;


    2. at Zagórów, the little village of Swięcin; and finally


    3. near Wienietz, Konty, Szedlemin, Botkowo and Karczin — against payment:


    1. of the sovereign dues hitherto discharged by the said villages, Hollander holdings and parcels
    of land, as a fixed'

- page: 3
  en: 'power and authority to dispose thereof at his pleasure under the above-mentioned conditions, unhindered
    by any man. We therefore command and enjoin all Our Supreme Provincial Colleges, as also all other
    authorities whom this concerns, herewith as graciously as earnestly, that they in no wise hinder or
    impede either the Lordship of the oft-mentioned Prince of Hohenlohe-Ingelfingen in the heritable and
    proprietary possession thus conferred upon him of the above-named appurtenances belonging to the estates
    of Betsche, Zagórów and Wienietz, nor him or those upon whom he may one day pass the same by inheritance,
    by force of this Our letter of grant, or may otherwise lawfully transfer them by other acts inter
    vivos aut mortis causa; but rather that they let His Lordship, and eventually also them, enjoy the
    same freely and quietly, doing nothing against it themselves, nor causing or permitting such to be
    done by others, on pain of Our supreme displeasure and of unfailing severe punishment. In witness
    whereof etc. Berlin, the 1st of December 1797.


    Friedrich Wilhelm


    Letter of grant for the reigning Prince of Hohenlohe-Ingelfingen, for the heritable and proprietary
    possession of the appurtenances belonging to the estates of Betsche, Zagórów and Wienietz.


    That the foregoing copy agrees perfectly with the supremely executed original is hereby attested.
    Breslau, the 28th of January 1798. Secret South Prussian Archive.


    Beugnitz'

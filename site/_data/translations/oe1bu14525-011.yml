- page: 2
  en: 'and unalterable canon; and


    2. of the competence due therefrom to the ecclesiastical corporations and foundations.


    This We also do hereby and by force of these presents, out of Royal power and plenitude, for Ourselves
    and Our descendants and successors in the Crown, the Electorate and Our remaining lands, in such manner
    and wise that Our above-mentioned kindly beloved Uncle, the reigning Prince of Hohenlohe-Ingelfingen,
    shall irrevocably have, possess and enjoy the above-named appurtenances belonging to the estates of
    Betsche, Zagórów and Wienietz, with all rights and prerogatives attaching thereto, as the same have
    hitherto been exercised or may lawfully be exercised, with all lands pertaining thereto, in fields,
    woodlands and meadows, likewise in ponds and waters, according to the lawful boundaries and bounds,
    just as all has hitherto been used or may by right be used, from now on for everlasting time, for
    himself and his descendants and heirs, as a true, well-acquired and unrestricted property, from Us
    and Our descendants and successors; and that there shall likewise be conferred upon him the'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord,


    Here there is at present little to be settled, for everything is now in confusion on account of the
    mobilisation of the army. Klewiz had to hurry off to South Prussia yesterday, and to drive together
    the grain of the [uncertain: reading unclear]; Minister Voss sits in Havelberg and sings psalms, and
    therefore there is, in this [uncertain: Eachschlagt], nothing to be done for the moment. The approbation
    is being pressed forward by Privy Councillor Reinbeck, who intends to see to it at once, as soon as
    Voss returns, and to have it executed. Upon the approbation of the dismemberment the money business
    depends; as soon as I have this, the revenues stand free, and then I hope to obtain from the Invalids''
    Fund and from the Wards'' Collegium the sum of the money needed for the payment of all debts. All
    this is set in train; meanwhile I cannot wait upon the thing, but must hurry back to Tropizin to work
    there. With Betsche the matter will and must likewise go forward. Reinbeck is Amelang''s bosom and
    boyhood friend; through him everything will be capable of being pressed on. Should anyone be in any
    degree refractory, I have the promise of the most powerful protection from the Court. To Herr M[inister]
    v. Voss there went out yesterday from Potsdam an order that he should suspend the psalm-singing until
    another time and come home, inasmuch as there were more important affairs to be despatched here. He
    is to arrive this evening. Reinbeck has just now given Amelang the assurance'
- page: 2
  en: 'to the effect that tomorrow the dismemberment matter will be laid before the Minister, and the
    day after tomorrow the report will go off to the King and the highest approbation be procured. According
    to the state of the files he would vouch for it that the same cannot be delayed but must absolutely
    be granted. As regards Betsche, on Reinb[eck]''s advice I am to submit nothing before I have that
    approbation — and then I am to submit the matter to the Minister myself, so that he may turn the same
    to the best advantage for all.


    With respect to the war business, it remains settled that the whole army is to be mobilised. The Emperor
    has now proposed an entrevue with our King. The King has answered him par Concir that he would be
    content with that; but from his resolve to mobilise his whole army he would not depart — for through
    his own land he would not let the Russians pass; that would be worse than if he lost a whole campaign.
    In general he wishes now to meddle no further in anything; whoever, however, means to compel him to
    anything, him he will meet with his whole force, and he would sooner be buried with his last man beneath
    the ruins than depart from this resolve. General Ruchel goes off tomorrow to East Prussia; likewise
    General Relitirente (who is very discontented and means to demand his discharge) is to go off these
    next days to Pomerania. As General Köckritz says, it is wished that Your Serene Highness might also
    soon be in South Prussia. Seven generals are being placed on the retired list, among whom General
    Dolfs was [uncertain: auf war] when I heard them named. Field Marshal Mollendorf is said to [uncertain:
    Haus]'
- page: 3
  en: 'Naming of the new villages which arise through the dismemberment at Zagorowo and Trąbzyn.


    Grądzyn. Friedrichsfeld, Ludwigslust. Drzewce. Sophienberg Adelow. Old Hut [alte hütte]. Augustinow.
    Emilienhein. behind Kopojno. Wildenbruch: Schönau, or Klein Ingelfingen.'
- page: 4
  en: 'B. Register of the established new villages and of the lands remaining to the Dominium.


    1. In the Zagorowe lordship there have been dismembered:

    a) at Grądzyn 1 colony of 1650 Morgen, settled with 39 householders, called Klein Ingelfingen

    b) upon Drzewce Alexandrow

    2. Col[ony]: ... 960 ... 18 ... Alexandrow

    3. 1200 ... 40 ... Augustinow

    4. 1221 ... 40 ... Emilienhain

    5. 600 ... 20 ... Adolphsberg

    c) at Kopojno

    6. 1830 ... 31 ... Friedrichsfelde

    7. 1590 ... 40 ... Ludwigslust

    8. 720 ... 24 ... Sophienthal

    9. 1530 ... 35 ... Adelowo

    To old Poles singly 1230 ... 20 ... at Kopojno village and Skokum

    at Trąbczyn

    10. 1524 ... 40 ... Justinsau

    11. 1274 ... 34 ... Kaschubowe

    12. 1866 ... 60 ... Furstenfelde

    538 ... 8 ... the former Przybysław

    13. 1266 ... 42 ... Klein Schrotzberg

    300 ... 8 ... the Old Hut [die alte Hütte]

    14. 1632 ... 54 ... Hellendorff

    15. 476 ... 25 ... Stetten[uncertain: i]feld.

    Sum total Mm. 21407, 578 householders.


    At Trąbczyn there remains: 1. a demesne farm of 724 Morgen; 2. at Marianton 60 Morgen (=784).

    Woodland: there remains at Trąbczyn 1500, at Kopojno 832, at Grądzyn 1126, at Trąbczyn 333 = 3791
    = 4575 Morgen.

    Besides this, the old subjects have had their pasture and timber-cuts determined according to contract.
    Monies'
- page: 5
  en: 'Monies have so far come in only to the amount of 7130 Rthl; of this the interest has been paid
    and the remainder sent to [uncertain: Breiten]! Radzinski is to and must pay in 6000 Rthl these next
    days, otherwise he will have execution levied upon him — he is truly the [uncertain: böfeste — worst?]
    man I have ever come across. On Thursday some of the colonists who were driven asunder mean to present
    themselves again. God knows whether they will keep their word; they promised to pay in several thousand
    rt in cash. On Monday a man who wishes to lease the little demesne farm and buy lands has likewise
    promised to bring 5000 Rthl. Had Herr v. Voss begun the racket after the harvest, I should have laughed
    at his follies; as it is, however, he scared the people away from me at an unseasonable time — now
    the people will hardly come together again before after the harvest. Here too it is again ordered
    that the Prusimska be paid her 20000 Rthl; H[err] Weigel is to and must have the 23000 Rthl still
    coming to him; then the Schlabrendorff woman is to be satisfied with 25000 Rthl. That is yet a sum
    of 68000 Rthl. These and more than a hundred thousand [uncertain: uf] more are supposed to come in;
    only God knows when this will happen — If I only had back very soon the approved contracts (for I
    have had to submit them all as evidence) together with the concession of all revenues, then I believe
    it will surely be'
- page: 6
  en: 'the best course, that one should take a further 150000 Rthl, together 30000 Rthl, from the Invalids''
    Fund, pay off Appenhumer and everything here, clear everything, and discharge this item of debt little
    by little out of the revenues of the estates. As soon as I have leased out the demesne farm here and
    have a [uncertain: Klampz — a lump?] of money together, I shall hasten at once to Kalisz, to direct
    everything there, and shall come to Breslau to learn Your Serene Highness''s further high opinion.


    v Triebenfeld'
- page: 7
  en: '[text lost] and is to command this army, if it comes to anything. The Duke of Brunswick, however,
    the whole direction.


    The reports which I wrote already 8 weeks ago, and which at that time were held to be of very little
    consequence, are now found confirmed; and only 3 days ago Chlebowski and Vöhler wrote the same as
    important news — the King has [uncertain: gewißert] a good deal about many things. I am, as I wrote
    last time, to go along — but I shall take care of myself. Your Serene Highness can [uncertain: soll]
    go by way of Vielen to Lenschitz; there you are not far from your estates.


    In deepest reverence I remain, until death, Your Most Serene Highness''s


    To Colonel v. Schlieben I gave 2000 Rthl yesterday, for [uncertain: Mucrowis] had sent no money, and
    one must quash the suit — also I have here paid a further 100 fr. d''or to the helpers — Everything
    truly goes well. Herr v. Hardenberg has hitherto been too rare a bird; I have not yet been able to
    speak with him. Today he has gone for a few days to his estates, and the King is at Paretz, where
    he means to remain until the torch dance of the Ferdinandian jubilee wedding, which is on the 27th.


    Berlin, the 24th September 1805


    most humble and obedient servant

    v Triebenfeld'

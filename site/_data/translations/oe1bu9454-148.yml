- page: 1
  en: '148


    P[ro]. M[emoria].


    In the table which Glenck has just given Your Most Serene Highness of all the revenues of the South
    Prussian estates, Swięcia stands at 1800 Rthl in annual interest and 10000 Rthl capital. Upon the
    appraisers'' revision concluded today, Swięcia yields only 918 Rthl interest yearly — the error is
    [uncertain: zu künfig] and the fine estate has, by Heaven, been squandered away. It has 3792 Morgen
    and ought to have fetched just as many thousand rt. [uncertain: Mannen]. It has, however, been given
    away for 10000 Rthl capital and 918 Rthl interest, and consequently for 28360 Rthl, whereby a manifest
    loss of 47340 Rthl accrues to Your Serene Highness.


    If to this the Oleśnica loss of 48000 Rthl be reckoned against the present sale, then Your Serene
    Highness loses on these two estates a net 95340 Rthl — and just such a shortfall now arises with the
    assessment. Trąbczyn


    the 2nd of December 1804.


    v Triebenfeld'

segments:
- page: 1
  en: 'P. M. In the tableaux which Glenck has just given Your Most Serene Highness of all the revenues
    of the S. P. estates, Swięcia stands at 1800 Rthl annual interest and 10000 Rthl capital. Upon the
    revision of the assessors concluded today, Swięcia yields only 918 Rthl interest yearly – the error
    is [uncertain: to be reckoned for the future] and the fine estate has, by heaven, been squandered
    away. It has 3792 Morgen and must have brought in just as many thousand rt. [uncertain: Mannen]. But
    it has been given away for 10000 Rthl capital and 918 Rthl interest, and consequently for 28360 Rthl,
    whereby a manifest loss of 47340 Rthl accrues to Your Serene Highness. If to this the Olesnicer loss
    of 48000 Rthl be taken against the present sale, then Your Serene Highness loses on these 95340 Rthl
    — and precisely both, estates net such a shortfall arises now upon the assessment. Trąbczyn, the 2nd
    of December 1804. v Triebenfeld'

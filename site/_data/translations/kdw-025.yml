  en: 'Document no. 795


    Władysław, Duke of the kingdom of Poland etc., 9 September 1298, at Pyzdry; allows Count Wojsław to
    locate the village of Wrąbczyn under German law.


    Original on parchment, whose seal, hung on threads of red silk, shows the arms of the land of Kujawy.
    Warsaw. The Rusiecki collection. Diplomata. — Rzyszczew. Muczkowski, Codex diplomaticus Poloniae I,
    no. 90.


    In the name of the Lord, amen. We prudently provide against many inconveniences when we confirm for
    ever with letters and witnesses the things done in the time of our own age. Therefore we, Władysław,
    by the grace of God duke of the kingdom of Poland, of Pomerania, of Kujawy, of Łęczyca and of Sieradz,
    commend to the memory of all present and to come, that we give to Wojsław, our faithful servant, and
    to his lawful posterity the power to locate his village, which is named Vronztino in Polish, under
    German law, freeing the said village and its inhabitants from the naraz, the povos, the prevod, the
    podvorove, the stroza, the ox, the cow, the pig, the ham, the poramb, the stan, the falcons, the huntsmen,
    the urn of provincial honey, the cart of hay, the head of rye, the opole, the poradlne, and the castle''s
    summons — so that, cited, they need not appear or answer before any official, but before us alone,
    appeal being made to us through our ring or our seal by letter. We also will that the said Count Wojsław
    and his successors shall judge all the causes, greater, middling and lesser, which shall arise within
    the bounds of the same estate of Vronczino, and receive the penalties judged entirely and completely
    for themselves. For the evident firmness of this matter we have had these presents written, strengthening
    them for ever with our seal. This was done at Pyzdry in the presence of these counts: Roscone, huntsman
    of Kalisz, Świętomir, castellan of Biechowo, Świętosław, huntsman, and many others worthy of trust.
    Given there on the morrow of the Nativity of the blessed Virgin Mary, by the hand of the Lord Dominik,
    notary of our court, in the year of the Lord 1298.


    Vronztino, Wrąbczyn. Piysdir, Pyzdry. Bechovia, Biechowo.'

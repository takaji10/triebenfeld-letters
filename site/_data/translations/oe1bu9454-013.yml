- page: 1
  en: '13


    For Your Serene Highness alone.


    The matter has not been put into the protocol in the best way; important things have been passed over
    and others, which do not belong in the account, have been dragged in with particular thoroughness
    — such is the Adolph affair — Mr Cosmar shortened it, and one subject and another, so that he is everywhere
    lost of his own accord. It was not necessary to make the business so long-winded on that account —
    Only, as I observe, the good Hahn wants Adolph to be wrested from the hands of the villain, that the
    King should thereafter declare Adolph of age [uncertain: Majoram], and then Adolph is to buy Koszęcin
    — Koszęcin lies very much at H''s heart — he writes that it yields 55/m Rthl annually — [uncertain:
    gefaß] let everyone play with his own doll, I shall act — But the question does arise here all the
    same — is Koszęcin larger, better, and now so much to be preferred to Sławięcice, which with Oppurg
    is said to yield barely 40,000 Rthl? It is very [uncertain: schleun] that people change their opinions
    too often — Grant, and God, that Pourtalès writes soon, for then another side will be taken up again.
    Now to my own affair.


    Much has been lost on the papers; they stand frightfully low here and fall daily, one gets almost
    nothing more for them; the ducat is already worth over 15 gulden and our thaler five fl less 20 kreuzer
    — Nearly 400 Rthl of the 300 Rthl are lost. To Barbe I owe 145 # in cash — I absolutely must have
    a coat and an overcoat made for me, since my elbows are already [uncertain: Bubken] out; the ell of
    good middling cloth costs over 60 gulden, the tailor asks some 38 #, which is already 183 #. If you
    now send a further 200 #, there remain to me 17 # travelling money — for the lungs, or properly the
    1,100 gulden in paper money, will soon be eaten up. Tomorrow the Prince is having 100 # given me as
    an advance, with which I shall bring Barbe to some degree of quiet. But I must give a written undertaking
    that I shall hand the 100 # advance over here at the treasury — and here one''s word must be kept.
    I therefore beg Your Serene Highness, for God''s sake, do send me the 200 # as soon as possible, for
    otherwise I lose all credit with the men who alone can help and ought to help. Have mercy, Your Serene
    Highness, and do send the 200 #, and also, as soon as possible, 2 blank sheets signed in French —
    I shall [uncertain: dritte] well need the same.


    21 February 1815 [von Triebenfeld]'

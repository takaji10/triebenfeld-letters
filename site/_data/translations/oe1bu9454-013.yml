- page: 2
  en: 'Most gracious Lord, it is now 3 1/2 weeks that I have not seen a syllable from you, and for over
    3 weeks I have been living like the harshest prisoner on water and bread and daily 2 pieces of toast,
    a black draught without sugar or milk. May I never behold God''s countenance if this is not true.
    I already go about like a [uncertain: Gerize] — of my illness I am for the most part [text lost] but
    very weak, and now I am starving — May God only preserve me from a relapse. Help me soon, else I shall
    succumb to the two of them. Barbe presents himself to you most respectfully — He has promised me to
    procure the money for the redemption of the papers - on which account I have great worry; if the Chancellor
    requires it so, the papers must be submitted with all speed, and that will happen within a couple
    of days - as for what Eberhard thinks, that the King should take the debt wholly upon himself, that
    will not happen - But what will be necessary will be given up, and against that go the 114000 Rthl
    which you have lost since 1800 - that [illegible] spoke of it with the E H very nervously - the Prince
    has undertaken on this account to procure you an annual 6000, indeed perhaps 7 - and of that to save
    the half - that would be a pretty little capital - This is to remain secret, so that no evil spirit
    sinks in its claws - People talk wondrous stuff, and still more [uncertain: Vollerns] goes on here
    - had I the opportunity I could write much.


    The good Barbe has found another translator, who will translate the whole files for 15 ducats, and
    these he means to give tomorrow. But let Your Serene Highness see to it that the man is satisfied.
    He certainly helps much, is again and good - from Pourtales there is as yet no further answer here;
    this is looked for in the course of next week.'

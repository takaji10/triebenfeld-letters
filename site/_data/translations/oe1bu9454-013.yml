- page: 2
  en: 'Most gracious Lord, it is now 3 1/2 weeks that I have not seen a syllable from you, and for over
    3 weeks I have been living like the hardest-used prisoner on water and bread, and daily 2 cups of
    a black [uncertain: hafft] without sugar or milk. May I never behold God''s countenance if this is
    not true. I already go about like a [uncertain: Gerize] — of my illness I am for the most part recovered,
    but very weak, and now I am starving — God only preserve me from a relapse. Help me soon, or I shall
    succumb to the two of them. Barbe commends himself to you most respectfully — He has promised me to
    procure the money for the redemption of the papers — [text lost] have great distress on that account;
    if the Chancellor requires it, then the papers must be submitted quickly, and that will be seen to
    in a couple of days — as for what Eberhard thinks, that the King should take the debt upon himself
    alone, that will not happen — But what will be necessary will be given up, and from that go off the
    114,000 Rthl which you have lost since 1800 — B has spoken very nervously about it with the Prince
    H — the Prince [uncertain: haft] to procure you on [uncertain: dieſon] an annual 6/m, indeed perhaps
    7 — and of that to save the half — that would be a fine little capital — This is to remain secret,
    so that no evil spirit sinks its claws in — People talk wondrous stuff, and still [uncertain: Vollerns]
    goes on here — had I the opportunity, I could write much.


    The good Barbe has found another translator, who will translate the whole records for 15 ducats, and
    he means to give them to him tomorrow. But let Your Serene Highness see to it that the man is satisfied.
    He certainly helps much, is [illegible] and good — from Pourtalès there is still no further answer
    here; B expects such next week.'

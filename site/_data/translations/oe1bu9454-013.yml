- page: 1
  en: 'For Your Serene Highness quite alone.


    The matter has not been given into the record in the best way; important things have been passed over
    and others have been dragged in at length which do not belong in the account - such is the Adolph
    affair - shortly Chamber and one department and another, there he is everywhere lost of himself. It
    was not necessary to make the business long-winded on that account - only, as I perceive, the good
    Hahn wishes that Adolph be wrested from the hands of the villain, that the King should thereafter
    declare Adolph for [uncertain: Majoram], and then Adolph is to buy Koachenten - Korchentin lies very
    much at H''s heart - he writes that it yields 55000 Rthl annually - very well, let each play with
    his own doll, I shall act. — But the question does arise here: is Koschentin larger, better, and by
    so much now ahead of Schlawenschitz, which together with Oppurg is said scarcely to yield 40000 Rthl?
    It is very [uncertain: schleun] that people change their opinions too often — If God grant that Pourtales
    writes soon, then another side will be put up again. Now to my own affair. On the papers much has
    been lost; they stand dreadfully low here and fall daily, one gets almost nothing for them any more,
    the ducat already stands at over 15 and our Thaler five fl. less 20 kreuzer - Nearly 400 fl., some
    300 Rthl, are lost. To Bürben I owe 145 x in cash — I must absolutely have a coat and overcoat made
    for me, since already the elbows are coming through [uncertain: Bubken]; the ell of good middling
    cloth costs over 60 Rthl, the tailor demands some 38 x, that is already 183 Rthl; if you now send
    a further 200 M, then 17 Rthl of white money remain to me - for the lungs, or properly the 1100 fl.
    of paper money, will soon be eaten up. Tomorrow the Prince is having 100 tt. advanced to me, with
    which I shall set Barben somewhat at ease. But I must give a written undertaking that I shall hand
    over the 100 Rthl advance here at the treasury - and here one''s word must be kept. I therefore beg
    Your Serene Highness for God''s sake, [uncertain: schaden] me the 200 Rthl as soon as possible, for
    otherwise I lose all credit with the men who alone can help and ought to help. Have mercy, Your Serene
    Highness, and do send the 200 tℓ. also as soon as possible, and blank forms signed in French - I could
    well use the same.


    21 February 1815'

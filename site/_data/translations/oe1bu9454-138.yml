  en: '138


    Most Serene Prince


    Most gracious Prince and Lord!


    In the Broniewski matter the renewed first attempt at the deposition has [uncertain: come to nothing],
    as Your Most Serene Highness will be pleased to see from the [uncertain: enclosed] resolution of 25
    June.


    I did not [uncertain: delay] to apply once more every [uncertain: exertion] in order to [uncertain:
    succeed]. Mr von Triebenfeld had [uncertain: told] me that Your Most Serene Highness would, if need
    be, also deposit a caution, merely in order to come into possession of the estates. This I have [uncertain:
    offered]; it is fixed[?] at 10,000 Rthl., and upon this the order as drawn up has been taken into
    account, and the deposition as well as the [uncertain: clearing] of Kolno and Kamionna has been enjoined
    upon the Government'

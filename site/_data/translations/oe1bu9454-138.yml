- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    In the v. Broniewski matter the renewed first attempt at the deposition has run out [uncertain: fruitlessly],
    as Your Most Serene Highness will graciously be pleased to see from the enclosed resolution of the
    25th of June.


    I did not [uncertain: hesitate] to [illegible] once more all that was clamoured for, in order to obtain
    a reconsideration. Mr. v. Triebenfeld had [uncertain: told] me that Your Most Serene Highness would,
    if need be, deposit a security along with it, merely in order to come into possession of the estates.
    This I have accordingly offered; it is [set] at 10000 Rthl [uncertain: of the said sum], and upon
    that the appointed disposition has been taken into account, and the deposition as well as the vacating
    of Kolno and Kaemen has been enjoined upon the Government'

- page: 1
  en: 'Most Serene and Most Mighty King, Most gracious King and Lord! Poznań, 18 June 1800. The Government
    most humbly submits a copy of a cabinet order. The cabinet order issued to us in the case of Prusimska
    against the Prince of Hohenlohe we most humbly submit to Your Royal Majesty in a copy enclosed, and
    remain, until death, in most devoted loyalty, Your Royal Majesty''s most humble and faithfully obedient
    President, Vice-President and Councillors [uncertain: appointed] to Your Majesty''s South Prussian
    Government. Hering Danckelman v Götz Diederichs Dannenberg Schwarz


    Bormann


    Fromme


    Hoening Leuchert Richter v Fischer


    [Written by the receiving office:]


    18 June, to the files. 23 June 1800. G[oldbeck] H[illegible] B[illegible]'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! At this very moment, as I return from Platz,
    I find before me Your Most Serene Highness''s two letters of the 7th and 9th inst., together with
    enclosures, [showing] that von der Lahr has now attacked me here also, as Your Most Serene Highness
    will have seen from Rhoven''s letter — what I suffer thereby only Your Highness can feel, with those
    most gentle sentiments proper to you. — Meanwhile this pond too will be drained — if only the 1000
    Centl. of [uncertain: Zesen] were soon at Kontop. The papers are falling very much at present, and
    this aggravates my distress; in the meantime this [illegible: "sniken"] shows Your Serene Highness,
    as it does me also, a glad future, if only I have got these [uncertain: Jörgen] out of the way; then
    what now seems small to us will afterwards yield us threefold gain. [uncertain: Gratst Tötzen] commends
    himself to your grace, was delighted at the Colonna affair, and can himself give evidence — that Colonna
    told him he had taken the Queen as a daughter, and had bequeathed to her his whole property save for
    a few legacies. For the rest, Court Councillor Hahn is right when he says that the testament is not
    legal enough for the Queen to take up the inheritance — but in the judgment of a friend learned in
    the law of pleading, the knot can easily be cut through, and this shall be my business. Should meanwhile
    the [uncertain: Teichulman] confess the suppression of the original testament, then all feuds would
    be settled — that a testament in the Queen''s favour has existed is known to many persons; even [uncertain:
    Gratschreiber] related publicly here some three weeks ago — that Reibnitz and the Councillors of Government
    at Brieg must all be hanged, for having delivered up the inheritance to unlawful heirs. He alone would
    lay an egg in Gantheim''s nest which should bring forth a birth that would gnaw everything away from
    him — There exists a testament of which he alone knew where it was.'
- page: 2
  en: 'Meanwhile Your Serene Highness has the 100000 Rthl bequeathed or lodged to you as good as secured,
    for according to the Landrecht, § 165, Tit. XII, Part I, stands: legacies which probably do not exceed
    the twentieth part of the estate, or, according to the testator''s assurance, do not exceed it, may
    be ordered by codicils written and signed in the testator''s own hand, without judicial delivery.
    Now since your 10000 Rthl, like the other legacies also, do not exceed the 20th, indeed scarcely the
    30th part, nothing further stands in your way, Most gracious Prince and Lord, because 20 witnesses
    acknowledge and will swear to Colorma''s signature. One might, had the stupid Bardthe not let himself
    be frightened out of his wits and renounced his 50000 Rthl, have made a fine [uncertain: Revack] of
    it. I do not yet give up the thought — Should you guess it, Most gracious Prince and Lord, then keep
    it as the dearest secret until I come back. I beg it earnestly. As concerns the Postmaster Schulz
    at Streliz, I hold the fellow to be a windbag. The [illegible] maintained that the anonymous letter
    was from Bardthe and that the letter was in his hand — That is not true; the Countess Henckel at Schimanowicz
    wrote the letter and sent everything to the Princess''s affairs. It is the Henckel arms and the Countess''s
    own hand — She had the papers from young Harraszowski, who is much in her house and gladly seen by
    her. As a relative she had reckoned very much on a share of the Colonna estate — Now she means to
    have her revenge — Many further pieces of intelligence are said to be drawable from this source. May
    it please you, Most gracious Prince and Lord, to be assured that I am luckier in the [uncertain: Aufkinder]
    than you — I am also certain that I shall bring everything to the wished-for goal. Only one thing
    disquiets me. Count Götzen wishes very much that this matter of the inheritance should not just now
    be pressed with too great vehemence, because thereby Count Wrätislaw, who with the Archbishop of,
    I think, Strüne, (prevails in everything with the Emperor and guides him entirely according to our
    will, might be aigri, and become injurious to the great cause. Count Pohne begs that the inheritance
    affair be held off a few weeks longer, until it be first known what party Our Highest will take. He
    finds it right that the Queen must be informed of it soon, but he advises all circumspection, so long
    as the matter cannot be brought to publicity with éclat. I have now made the proposal — the Queen
    takes the estates, which reckoned at A 4 sl are worth some 3 millions — and which Gasthum was to have
    had — If Wratislaw can effect so much'
- page: 3
  en: 'then the money is left to him, out of which the legacies must still be settled. In this way everything
    would be disposed of, Wratssaw not only pacified, but he would have to regard it as a grace of the
    Queen that she left him some 60000 in cash. Estates and stores Gasthum would have to restore, and
    Reibnitz, Gartner and [uncertain: Gebühter] to give up the 150000 Rthl again. I have drawn up for
    Count Poten a letter to the Queen, in which he congratulates her upon the inheritance, and for the
    rest communicates to her his apprehensions concerning Wradislaw and makes the aforesaid proposal.
    He proposes therewith that the Queen might submit his proposal to Your Serene Highness''s examination,
    because Your Highness could there, through your Lord Brother and other acquaintances, have the sentiments
    of the great men sitting at the Austrian helm exactly explored upon this matter. Count Götzen has
    promised me to send this letter tomorrow by orderly; I met him yesterday morning already below Glaz,
    where he was hastening to Lügnitz to examine an [uncertain: Excell] and to dispose of a matter that
    may be of favourable consequence. As soon as I have the letter from the Count I shall set off, furnished
    with all weapons, for Königsberg — Heaven grant only that the iron arrive at Kontop at the right time,
    otherwise I should have to lie idle like a dismantled [uncertain: Lauvun], and let von der Lahr''s
    hirelings keep watch on me. Political news here is of various kinds — the war between France and Austria
    is declared; on our side, so far as I have it from sure sources, they mean to look on at the game
    so long until the Austrian troops stand on the Elbe; then the further payment of the contribution
    will first be refused, and further declarations made. Without exciting [uncertain: Brint], the organisation
    of the [uncertain: Armen] is being advanced with us; until, however, a party has been taken, one is
    to go to work very circumspectly. Today it is generally said here that Rüchel, if the King takes part
    in the war, is to have the command in Silesia — He has arrived at his sister-in-law''s at Cosmar below
    Crossen, where he will remain in secret so long until he receives the orders from the King, upon which
    he will at once travel round all the fortresses in Silesia and the frontiers. An officer who served
    under his regiment is with him at Cosmar, and has now arrived here, who has trumpeted out this news
    — for the honour of humanity I am unwilling to believe these [uncertain: Pradotiere].'
- page: 4
  en: 'v Massow has, four weeks ago, written once again for his discharge, because he has been so restricted
    and subordinated to Count Dohna [uncertain: Dąmbska] that he cannot even issue a pass for relay-horses
    — Now, as the Councillor of War Merckel, who returned from Königsberg the day before yesterday, assures,
    Massow will receive his discharge with the observation — that he must meanwhile serve so long until
    another subject qualifying for this post has been found. If Geil and Jgn. do not draw too strong a
    dam, the hope of seeing Hard. here might be revived anew. In deepest reverence I remain, until death,
    Your Most Serene Highness''s — Bethusy lies very ill at Magdorff; I have meanwhile sent to him and
    asked him whether he will follow me on to Kontop — I await his answer — Upon all his estates there
    lie some 500000 Rthl of debts — but they are said to be worth, among brothers, 1 million — that, however,
    requires a sensible investigation. Breslau, the 12th April 1809. [uncertain: Frau] most obedient servant
    v Triebenfeld'

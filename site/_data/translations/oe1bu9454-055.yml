- page: 2
  en: 'Meanwhile, Your Serene Highness has the 100000 Rthl bequeathed or lodged to You as good as in [uncertain:
    hand], for according to the Landrecht


    there stands § 165, Tit. XII, Pt. I, almost: "Legacies which probably, or according to the testator''s
    assurance, do not exceed the twentieth part of the estate may be ordered by codicils written and signed
    in the testator''s own hand, without judicial delivery." Now since Your 10000 Rthl, as well as the
    other legacies, exceed hardly the 20th, indeed hardly the 30th part, nothing at all any longer stands
    in Your way, Most gracious Prince and Lord, because 20 witnesses acknowledge and will swear to Colonna''s
    signature. One might, had the stupid Bardthe not let himself be frightened out of his wits and renounced
    his 50000 Rthl, have made a handsome profit. I do not even now give up the notion — If You, Most gracious
    Prince and Lord, guess it, keep it as the deepest secret until I come back. I beg this most earnestly
    — As for the postmaster Schulz in Strelitz, I hold the fellow to be a windbag. E. maintained that
    the anonymous letter was from Bardtke and that the letter was in his hand — That is not true; Countess
    Henckel of Schimanowitz wrote the letter and sent everything to the Princess Sacken. It is the Henckel
    arms and the Countess''s own hand — She had the papers from young Harraszowski, who is much in her
    house and gladly seen by her. As a kinswoman she had very much counted on a share of the Colonna estate
    — Now she means to avenge herself — Many further items of intelligence are said to be drawn from this
    source. May You, Most gracious Prince and Lord, be pleased to satisfy Yourself that I am more fortunate
    in discovery than You — I am also certain that I shall bring everything to the desired end. Only one
    matter disquiets me. Count Götzen wishes very much that this inheritance business should not be pursued
    just now with too great vehemence, because thereby Count Wratislaw — who with the Archbishop of /
    I believe Bruna / can do anything with the Emperor, and leads him quite according to our will — might
    be embittered, and could become harmful to the great cause. Count Götzen begs that the inheritance
    affair be held back a few weeks more, until it is first known what party our [uncertain: Höst] will
    take. He finds it right that it must soon be reported to the Queen, but he counsels all caution, until
    the matter can be brought before the public with éclat.


    I have now made the proposal — the Queen takes the estates, which reckoned at 4 per cent are worth
    some 3 millions — and which the Gastheim were to have — If Wratislaw can accomplish so much'

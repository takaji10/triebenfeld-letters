status: draft
segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    At this very moment, as I return from Platz, I find before me Your Most Serene Highness''s two letters
    of the 7th and 9th inst. together with enclosures, [showing] that von der Lahr has now attacked me
    here as well, as Your Most Serene Highness will see from Rhovens''s letter – what I suffer thereby
    only Your Highness can feel, with those gentlest sentiments that are Your own. — Meanwhile this pond
    too will be emptied — if only the 1000 hundredweight of [uncertain: Zeſen] were soon in Kontop. The
    papers are falling very much at present, and this aggravates my distress; yet in the meantime this
    [uncertain: ſniken] shows Your Serene Highness, as it does me too, a glad future, if only I have got
    these [uncertain: Jörgen] out of the way; then what now seems little to us will afterwards yield us
    threefold gain.


    [uncertain: Gratſt] Götzen commends himself to your grace, is delighted about the Colonna affair and
    can himself give evidence – that Colonna told him he had adopted the Queen as his daughter and bequeathed
    to her his whole estate, save for a few legacies. For the rest, Court Councillor Hahn is right when
    he says the testament is not legal enough for the Queen to take up the inheritance – but in the judgement
    of a friend learned in the law of pleading, the knot can easily be cut through, and that shall be
    my business. If, however, the [uncertain: Teichulman] should confess to the suppression of the original
    testament, then all the feuds would be laid to rest – that a testament existed in the Queen''s favour
    is known to many people; even [uncertain: Gratschreiber] recounted publicly here some 3 weeks ago
    – that Reibnitz and the councillors of the government at Brieg all ought to be hanged, for having
    delivered up the inheritance to unlawful heirs. He alone would lay an egg in Gantheim''s nest that
    should bring forth a birth which would gnaw everything away from him – there exists a testament of
    which he alone knows where it is.'
- page: 2
  en: 'Meanwhile Your Serene Highness has the 100000 Rthl bequeathed or lodged to you as good as in hand,
    for according to the territorial law


    § 165, Tit. XII, Pt. I, provides that legacies which probably do not exceed the twentieth part of
    the estate, or which do not exceed it according to the testator''s assurance, may be ordered by codicils
    written and signed in the testator''s own hand, without judicial delivery. Now since your 10000 Rthl,
    like the other legacies, hardly exceed the 20th, indeed hardly the 30th part, nothing any longer stands
    in your way, Most gracious Prince and Lord, because 20 witnesses acknowledge and will swear to Colonna''s
    signature. One might, if the foolish Bardthe had not let himself be put in a fright and renounced
    his 50000 Rthl, have made a fine [uncertain: Revack] of it. I do not even now give up the thought
    — if you divine it, Most gracious Prince and Lord, then keep it as the dearest secret until I return.
    I beg this most earnestly. As concerns the postmaster Schulz at Strelitz, I hold the fellow to be
    a windbag. The said E. maintained that the anonymous writing came from Bardthe and that the letter
    was in his hand –


    That is not true; the Countess Henckel at Schimanowicz wrote the letter and sent everything to the
    Princess''s affairs. It is the Henckel arms and the Countess''s own hand — She had the papers from
    young Harraszowski, who is much in her house and gladly seen by her. As a relative she too had counted
    very much on a share of the Colonna estate – now she means to revenge herself — Much further intelligence
    is to be drawn from this source. Be pleased, Most gracious Prince and Lord, to convince yourself that
    I am more fortunate in [uncertain: Aufkinder] than you – I am also certain that I shall bring everything
    to the desired end. Only one matter disquiets me. Count Götzen greatly wishes that this inheritance
    business should not be pressed just now with too great vehemence, because thereby Count Wrätislaw,
    who with the Archbishop of, as I believe, Strüne (has all power over the Emperor and guides him entirely
    according to our will), might be irritated and become harmful to the great cause. Count Pohne asks
    that the inheritance matter be held off a few weeks more, until it is first known what party our Highest
    will take. He thinks it right that it must soon be reported to the Queen, but he counsels all caution,
    until the matter can be brought to publicity with éclat.


    I have now made the proposal – the Queen takes the estates, which reckoned at A 4 sl are worth some
    3 millions - and which Gasthum was to have had - If Wratislaw can effect so much'
- page: 3
  en: 'then one leaves him the money, out of which the legacies must still be satisfied. In that way everything
    would be disposed of; Wratssaw not only pacified, but he would have to regard it as a grace of the
    Queen that she left him some 60000 in cash. Gasthum would have to restore the estates and the stocks,
    and Reibnitz, Gartner and Gebühter likewise to give up the 150000 Rthl again.


    I have drawn up for Count Poten a letter to the Queen, in which he congratulates her on the inheritance,
    and for the rest communicates to her his apprehensions on account of Wradislaw, and makes the aforesaid
    proposal. He proposes therein that the Queen might submit his proposal to Your Serene Highness''s
    examination, because Your Highness could there, through your lord brother and other acquaintances,
    have the sentiments of the great men who sit at the Austrian helm exactly explored upon this matter.
    Count Götzen has promised me to send off this letter tomorrow by orderly; I met him yesterday morning
    already below Glatz, where he was hastening to Liegnitz to investigate an [uncertain: Excell] and
    to dispose of a matter which might be of favourable consequence. As soon as I have the letter from
    the Count I shall set off, furnished with every weapon, for Königsberg - Heaven grant only that the
    iron arrive at Kontop at the right time; otherwise I should have to lie idle like a dismounted [uncertain:
    Lauvunun] and let von der Lahr''s hirelings keep watch over me. Political news here is of many kinds
    – the war between France and Austria is declared; on our side it is intended / as I have from sure
    sources / to watch the game until the Austrian troops stand on the Elbe, and then the further payment
    of the contribution will first be refused, and further declarations made. Without arousing [uncertain:
    Brint], the organising of the [uncertain: Armen] is being pushed forward with us; but until a party
    is taken, matters are to be gone about very cautiously. Today it is said here generally that Rüchel,
    if the King takes part in the war, is to have the command in Silesia - He has arrived at his sister-in-law''s
    at Cosmar below Crossen, where he will remain in secret until he receives the orders from the King,
    after which he will at once travel round all the fortresses in Silesia and the frontiers.


    An officer who served under his regiment is with him at Cosmar, and has now arrived here, who has
    trumpeted out these novelties - for the honour of mankind I am unwilling to believe these [uncertain:
    Pradotiere]'
- page: 4
  en: 'von Massow has written again 4 weeks ago for his discharge, because he has been so restricted and
    subordinated to Count Dohna [uncertain: Dąmbska] that he cannot even issue a pass for post-horses
    – As the councillor of war Merckel, who returned the day before yesterday from Königsberg, now assures,
    Massow will receive his discharge with the observation – that he must meanwhile serve so long until
    another subject qualifying for this post has been found. If Geil and Jgn. do not draw too strong a
    dam, the hope of seeing Hard. here might be revived anew. In deepest reverence I remain, until death,
    Your Most Serene Highness''s — Bethusy lies very ill at Magdorff; I have meanwhile sent to him and
    asked him whether he will come after me to Kontop – I await his answer - Upon all his estates there
    rest some 500000 Rthl of debts - but they are said to be worth, among brothers, 1 million - that however
    requires a reasonable inquiry.


    Breslau


    the 12th April


    1809.


    [uncertain: Frau] most obedient servant


    v Triebenfeld'

- page: 1
  en: '55


    Most Serene Prince,


    Most gracious Prince and Lord!


    At this very moment, as I return from Kłodzko, I find before me Your Most Serene Highness''s two letters
    of the 7th and 9th of this month together with their enclosures — that van der Lahr is now attacking
    me here as well, Your Most Serene Highness will have seen from Rho[uncertain: ]ens''s letter — what
    I suffer thereby only You Yourself, with the most [uncertain: gentle] feelings peculiar to You, can
    feel. — Meanwhile this pond too will be drained — if only the 1000 Centner of iron were soon at Konotop.
    The securities are falling greatly now and this adds to my distress; in the meantime this [uncertain:
    ſniken] shows Your Serene Highness, as well as myself, a happy future, if only I have got these cares
    out of the way, for then what now seems little to us will afterwards yield us threefold gain.


    Count Götzen commends himself to Your favour, rejoices over the Colonna affair and can himself give
    evidence — that Colonna told him he had adopted the Queen as his daughter and bequeathed to her his
    whole property save for a few legacies — For the rest, Court Councillor Hahn is right when he says
    the will is not legal enough for the Queen to take up the inheritance — But in the judgement of a
    [uncertain: Klagen] friend at law the [uncertain: Karten] can easily be cut through, and this shall
    be my business. Should meanwhile the [uncertain: Teichulman] confess the suppression of the original
    will, then all quarrels would be settled — that a will in the Queen''s favour has existed is known
    to many people; even [uncertain: Gratschreiber] recounted publicly here some three weeks ago — that
    Reibnitz and the councillors of government in Brzeg ought all to be hanged, for having delivered the
    inheritance over to unlawful heirs. He alone would lay an egg in the Gastheim''s nest which should
    bring forth a birth that would gnaw everything away from him — There exists a will of which he alone
    knew where it was.'

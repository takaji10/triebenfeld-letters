- page: 3
  en: 'then one leaves him the money, out of which the legacies must still be settled. In that way everything
    would be disposed of, Wratislaw not only pacified, but he would have to regard it as a favour of the
    Queen that she left him some 600000 in cash. Estates and stocks the Gastheim would have to restore,
    and Reibnitz, Gärtner and Gebühter likewise to give back the 150000 Rthl.


    I have drawn up for Count Götzen a letter to the Queen, in which he congratulates her on the inheritance,
    and for the rest communicates to her his apprehensions concerning Wratislaw, and makes the aforesaid
    proposal. He therein proposes that the Queen might submit his proposal to Your Serene Highness''s
    examination, because Your Highness, there, through Your Lord Brother and other acquaintances, could
    have the sentiments of the great men sitting at the Austrian helm precisely explored in this matter.
    Count Götzen has promised me to send this letter tomorrow by orderly; I met him yesterday morning
    already below Kłodzko, where he was hastening to Legnica to investigate an Excellency and to dispose
    of a matter which might be of favourable consequence. As soon as I have the letter from the Count
    I shall set off, provided with all weapons, for Königsberg — Heaven grant only that the iron arrives
    at Konotop at the right time, otherwise I should have to lie idle like a dismounted [uncertain: Lauvun]
    and let van der Lahr''s hirelings keep watch on me; political news here is of many kinds — the war
    between France and Austria is declared; on our side the intention is / as I have from sure sources
    / to watch the game until the Austrian troops stand on the Elbe, and then the further payment of the
    contribution will first be refused, and further declarations made. Without exciting [uncertain: Brint],
    the organising of the [uncertain: Armen] is going forward with us; until a side has been taken, however,
    one is to proceed very cautiously. Today it is said here generally that Rüchel, if the King takes
    part in the war, is to have the command in Silesia — He has arrived at his sister-in-law''s at Cossar
    below Krosno Odrzańskie, where he will remain in secret until he receives the orders from the King,
    upon which he will at once travel round all the fortresses in Silesia and the frontiers.


    An officer who served under his regiment is with him at Cossar, and has now arrived here, who has
    trumpeted out this news — for the honour of humanity I am unwilling to believe these ravings'

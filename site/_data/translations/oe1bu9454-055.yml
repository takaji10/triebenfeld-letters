- page: 4
  en: 'Mr von Massow has, four weeks ago, again written asking for his discharge, because he has been
    so restricted and subordinated to Count Dohna that he cannot even issue a pass for relay horses —
    And as the councillor of war Merckel, who returned from Königsberg the day before yesterday, assures
    me, Massow will receive his discharge with the remark — that he must meanwhile continue to serve until
    another subject qualified for this post has been found. If Geil and Ign. do not raise too strong a
    dam, the hope of seeing Hard: here may be revived afresh. In deepest reverence I remain, until death,
    Your Most Serene Highness''s. Bethusy lies very ill at Matzdorff; I have meanwhile sent to him and
    asked him whether he will follow after me to Konotop — I await his answer — Upon all his estates there
    lie some 500000 Rthl of debts — But they are said to be worth, as between brothers, 1 million Rthl
    — that, however, requires a sensible inquiry.


    Wrocław


    the 12th of April


    1809.


    most faithful and obedient servant


    v Triebenfeld'

    Right Honourable Sir, Most gracious Lord Councillor of War! is indeed a thoroughgoing scoundrel! —
    He has made Serene Highness a great deal of difficulty in order now to reach the desired goal, and
    now that he [uncertain: sees] that nothing more is to be squeezed out, now he wants to conclude the
    whole business. — Would heaven but grant for once a favourable moment such as the present one is,
    the fellows should get the [uncertain: snow distress], which would now be [illegible], so presses.

- page: 2
  en: 'but that shall not succeed for him, and therefore I have given notice in [uncertain: bring], whence
    I still today await the [uncertain: Bethe] back, together with the declaration.


    Within a few days it must be [uncertain: alleinl.] done, — upon that Your Right Honourable may certainly
    rely, and so also that which you [have] in the great bill of exchange, and that you will soon get
    the [uncertain: Jaunken] back; the [uncertain: Schöpfe] again fetched on Tuesday, at the latest Wednesday;
    - until then I most humbly beg that they be let stand yet. With my health it grows better by the hour,
    — tomorrow I go out. For the gracious sympathy I give most humble thanks; I commend myself to your
    continuing grace, and have the honour to subscribe myself, with high esteem, as Your Right Honourable''s


    Berlin[illegible]


    the 2nd of May 1802.


    humble and obedient bondsman


    [uncertain: Frig]'

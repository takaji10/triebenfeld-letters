- page: 1
  en: 'Your Right Honourable, Most gracious Lord Councillor of War! but he is a [uncertain: abgereimter]
    rascal! - To His Serene Highness he has made many difficulties, in order now to attain the desired
    end, and since he now [uncertain: rihm: may reckon] that there is nothing more to be squeezed out,
    he now wishes to close the whole matter. - [uncertain: Gute] heaven but once a favourable moment,
    such as the present one is, the fellows ought to get the snow-distress, which now would be [uncertain:
    geüdigete], thus press. But may it now soon be settled, so that Your Right Honourable be no longer
    aggrieved, and then in the [uncertain: Jusend] there might also come, on account of the greeting from
    von Schlabrendorff, the strings to be strung in the manner in which Your Right Honourable has already
    often had the graciousness to express.


    With my affair, matters do not stand well, but neither ill. – The [uncertain: L.] Asch the elder means
    to [uncertain: zullen],'

status: draft
segments:
- page: 1
  en: 'This very moment I receive from Friend F in Berlin the news that the Queen died at Strelitz on
    the 19th, early, at 9 o''clock; also that the King is very ill, and that the very saddest consequences
    are feared. Although I begged that these matters be sent to Exp with all haste, Your Serene Highness
    will no doubt have the news sooner. The Collorina affair is now an absurdity; now, gracious Lord,
    you must only see to it that you receive your 100000 Rthl. Have you already got the papers back through
    Köckritz - write me this most urgently, for I go soon to Berlin. - I shall try only to raise the travelling
    money and hasten thither. - Friend F is tracking his own trail [uncertain: Dage]. The visit from Pastor
    Willhelm you perhaps do not reckon high enough in the valuation; on the other hand it will presumably
    bring you [uncertain: seigen], that is to say, the cases must occur one after another in their sequence
    - previously the contrary was the case - the certain answer, most gracious Lord, you will now receive
    in the hereafter - but may God grant it only after some 35 years. I must, if only I can scrape up
    the travelling money, absolutely hasten to Berlin. - I am being frightfully harried over the interest
    on account of the Invalids'' capital. - Roßem I should like to become [?]; the clumsy sack means to
    sequestrate my estates and to have [uncertain: Leibhartin] - see, I suffer all this for your sake
    - if only one of the V[ienna]: friends could help. Had I money - had I at least horses, I would fly
    from one place to another; but the accursed post-money taxes the purse too much, and I am still too
    much in arrears. Ever, however, Your Serene Highness''s most faithful servant, v. Triebenfeld, 6 Xbr
    1809'
- page: 2
  en: 'Copy


    Dear upright Friend,


    Enclosed I convey to you the valuations, and a Copy of the Landschaft assessment of the Biocdorff
    and Molna estates. The latter are, as the figure shows me, sound, so that everyone must find Herr
    v. Knobelsdorff''s demand fair. The debts intabulated upon the estates consist in mortgage bonds and
    small mortgages. They amount together to 330000 Rthl, and, since only 75000 Rthl are callable after
    the expiry of the moratorium, they can hardly become burdensome to you, my honest friend, given your
    means. Everything depends on how you are in a position to handle Herr v. Stössel. He is hard pressed
    and, as I know, is offering his papers at 50 per cent; I believe you may buy the whole 180000 Rthl
    from him for 90000 Rthl, whereby he must moreover concede sound terms of payment. - To press this
    gentleman is no sin, for he treated the good Prince frightfully in the Köschent [uncertain: mir Handel]
    dealings. Meanwhile I leave that to your wisdom.


    For the rest the matter now stands thus: - Bischdorff yields, according to the Landschaft assessment,
    annually 20462 Rthl 12 s; Mollna 10955 Rthl 18 s. The royal yield is small - the [uncertain: Schauß]
    taken only at 12; the 60000 Rthl can therefore very properly be conceded. Hence more by 3000 Rthl.
    Consequently annual revenue 34414 Rthl. The interest amounts: to the Landschaft, at 4 1/4 per cent,
    10264 Rthl; to the mortgage creditors 3750; to [uncertain: Stothet], for whom I still allow 100000
    capital, 5000; for Herr R. R. N. Weigel''s capital of 190000 Rthl, 9500 = 28514 Rthl. And accordingly
    there remains to you, dear friend, already a surplus of 5900 Rthl. With your interest - which after
    all derives from interest upon interest and God knows what - you will, dear old friend, if you are
    called proprietor and lord of jurisdiction of the above-named lordships, have an annual net revenue
    of 16000 Rthl; and what will you, as a rich man, not further make of the ironworks? I wish you all
    fortune therein, victory, and yet another 20 years'' span of life, in which I shall often rejoice
    to have been the intermediary who served you and the good Prince in so sound a manner.


    With particular esteem, etc.


    v. Triebenfeld


    overleaf, the remainder'
- page: 3
  en: 'The estates of Herr v. Knobel[sdorff] are, according to the valuations sub lit. A, assessed at
    976865 Rthl; but these assessments can never be taken as the standard, rather the Landschaft [assessments]
    sub B must hold good for me. According to these the value is given as 630279 Rthl. Since, however,
    the Lubell valuation is far too high and the assessment sub B likewise too low, Herr v. Knobelsdorff
    demands 70000 Rthl; I believe that this demand can be accepted without [uncertain: Pusico]. If now
    the value for the Knobelsdorff estates is actually taken at 700000 Rthl, and there still attach upon
    the same the wife''s property of 39000 Rthl in debts, then there remains net capital 310000 Rthl.
    But the claim of Herr Weigel against you amounts to 190000 Rthl, the Stössel claim 180000 Rthl = 370000
    Rthl; consequently more by 60000 Rthl. These 60000 Rthl Herr v. Knobelsdorff must further discharge
    out of his consort''s property, so that the two items of 370000 Rthl may be fully receipted to the
    Prince. - His Serene Highness the Prince gives for this the Zagoraa estates in Poland; these have
    a value of 550000 Rthl. Debts attach fully upon them - 20000 f on Surzira for the principal 18000
    = 218000 Rthl; there remains net capital 332000 Rthl. To this comes the canon from Wittow at 500 M,
    making 10000 Rthl. In arrears, such as will be outstanding in the estates, assigned in cash 28000
    Rthl. These are the aforenamed 370000. The old debts attaching upon the estates are mortgage bonds
    255000 Rthl; mortgage debts, so that after the 60000 Rthl there remain 75000 Rthl. That amounts together,
    the purchase price [uncertain: Preetinen] at 700000 Rthl. Against these estates worth 700000 Rthl
    there would then stand Herr v. Weigel with 190000 Rthl and Herr v. Stössel with 180000, which together
    amounts to 370000 Rthl, for which the Prince is to be receipted and the debts on [uncertain: Kirchen
    tin] and wherever else they stand registered are to be cancelled or ceded back to the Prince. For
    the rest it remains Herr Weigel''s business to negotiate soon with Herr v. Stössel and to buy the
    180000 Rthl off him before the purchase becomes public knowledge.


    v. Triebenfeld'
- page: 4
  en: 'Postscript of the 30th October.


    Because Your Serene Highness''s letter of the 9th had been 11 days on the road before I received it,
    I supposed the course of the post to be at fault that I received no answer from Your Serene Highness
    to 5 letters - but now I hear from His Highness the Prince Chancellor that Your Serene Highness has
    written to him; consequently I must believe that my exertions here are not received with approval,
    and that Your Serene Highness does not wish to deem me worthy of an answer. - Were this really the
    case, then deign, Most Serene Prince, at least to let me know it. -


    As for what otherwise concerns Your Serene Highness''s affair, the Prince State Chancellor takes it
    up with true earnestness; his words today were: - I will help the old man. I mean the King to pay
    the Ler[?] debt. The King has guaranteed the debt and paid the interest up to 1806. Also, the Prince
    has indeed been [uncertain: cassirt]; his salary ought to be given him. - [illegible] how much has
    the Prince had this year in [uncertain: Ant:] 14000 Rthl, and it is just 112000 Rthl. O fine! he shall
    be helped. The King comes out of the affair as the best of men, and on the debt item some 300000 Rthl
    are indeed gained. A pity that the Prince let his military affairs lie so, and that he did not press
    for a formal judgment. - The money, or the 112000 Rthl, will most certainly be given, and the [uncertain:
    Transactoren] of 1811 abandoned. Perhaps something great will yet be effected touching Your Serene
    Highness''s honour. - Tomorrow, on All Saints'' Day, the Prince State Chancellor lays the matter before
    the King. Proud shall I be if my submission brings forth so many good effects. Herewith follows the
    last Pro Memoria, which I have [uncertain: eine] achieved - it is a misfortune that I have no Copy,
    for my hands are failing me from all the writing. I have resolved to avoid the antechambers and to
    treat everything in writing, and'
- page: 5
  en: 'I see I fare better. Now, Most gracious Lord, I beg you once again: send only 300 Rthl, converted
    into Gold, so that I may be in a position here to continue negotiating. - You may, Most gracious Prince,
    now [uncertain: dienst] count upon what I have said, for that upright great man Prince Hardenberg
    does not forsake you. It is the Chief Post Director Mann who sends these letters. - May Your Serene
    Highness deign to address your letters, with his enclosure [uncertain: Ausschlag], to the Royal Prussian
    Chief Post Director Herr Mann, Your Honour, in Vienna; then I receive everything. Only, for God''s
    sake, money.


    A letter from the Princess of Heßen Rothenburg follows herewith.'
- page: 6
  en: 'Have mercy, Your Serene Highness, and send only money - 300 Rthl in Gold I must have if I am to
    go on working here, and if I am not to sink in disgrace and [uncertain: O''Pott]. - It is already
    shabby enough when among people whom I need daily I must also drift about like a beggar''s dog. -
    Today I have moved out and live at Große Schuller Straße 872, where I live on credit, for in the inns
    every foreigner here must pay everything at once - and my [uncertain: Zaabe] is still 57 gulden. -
    If Your Serene Highness does not send money speedily, everything collapses; without money no servant
    here gladly opens the door. - Everything is too dreadfully expensive. For God''s mercy''s sake, Your
    Serene Highness, send money, etc.; already yesterday I endured the greatest public humiliation. -
    Would that I had not come here this time. Like a beggar boy I drift about here. Who will hear me and
    look at me in such a figure? I sacrifice everything, wish the great villain [uncertain: für] Your
    Serene Highness, to save you at one stroke, the [uncertain: Händsche]; alone, and without the help
    of a few friends, I cannot get on - but what is to be done with a [uncertain: Leuphalten].'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! My presentiment that here all endeavours to undo the notorious
    settlement would be in vain is, alas, confirmed. The villains have hedged everything about with such
    clauses that, even with the greatest sacrifices, one may not hope to gain the least advantage. It
    is a piece of knavery without equal — the court rescript concerning the deposition was here — and
    notwithstanding this the base settlement was concluded. Glenck submitted the same on the 6th for approbation
    and begged for the utmost dispatch in executing it and having it drawn up for both parties. Your Most
    Serene Highness''s letter, in which You protested against the settlement, was here on the 8th. This
    was quickly laid aside; they approved and expedited the accursed settlement with the plaintiff''s
    own speed, and sent it in at court. What am I now to do? To complain against it, go to Berlin and
    make an outcry — none of that helps at all, one only makes oneself ridiculous. Good people, of whom
    there are scarcely 2 here, pity Your Serene Highness, but the great crowd [uncertain: to bed] and
    [uncertain: runs down/sells off] everyone who takes part in this affair. Oh, I could go mad.'
- page: 2
  en: 'The basest thing of all is now that Glenck does not come. Although he received my letters here,
    he would not wait, but has gone to Betsch. I have sent express couriers and a female messenger after
    him — he does not come, nor does he answer a syllable. Here I [uncertain: gnaw] sit here in vain —
    God, it is dreadful what these people permit themselves. The [uncertain: fullest] thing is that nobody
    will own to any share in this rascals'' business. Metzer rails that Wünster did not make the settlement
    better, and damns Glenck to all eternity for not having concluded it sub sp[e] [illegible] — He says
    he had meant to make the settlement and to say: I have indeed no power of attorney, but shall supply
    it afterwards / by which one would have had room enough to manoeuvre; but this Glenck did not accept.
    Hence Glenck concluded quite alone, without his foreknowledge. He could not deny that, if the deposition
    had taken place, the outcome would have been very good for the Prince, since Broniewski himself had
    already declared that he would drown himself or shoot himself in the head, and leave his wife and
    children behind to the Prince. For the rest, Metzer says Wunster made the settlement and arranged
    everything so — in short, each puts it off upon the'
- page: 3
  en: 'other — but as I see it, they are all equally [uncertain: culpable]. Here I care to stay no longer;
    rather, if Glenck does not come, I shall set off towards evening for Betsch, so as to let nothing
    be neglected there — for with Bornstädt there will be a great deal of noise; they have proceeded with
    these just as perversely as with the Trąbcziners, that is to say, they sued for eviction but neither
    had a liquid sum established, still less applied for execution — everything here lies in the dark,
    and it will cost untold trouble to bring this quickly to [uncertain: the clear]. From Betsch I must
    go back here once more, in order to dislodge Bornstädt and to see what security Braniewehr puts up.
    This very moment Glenck has arrived — He knows neither what to say in his own excuse, still less anything
    to propose for the redress of the matter. In short, the man feels nothing, though I could vex myself
    to death. He has begged Metzer to [uncertain: throw everything over] and to uphold the settlement.
    — This I know for certain. Glenck also let slip that he had seen the court decree before he submitted
    the settlement for approbation.'
- page: 4
  en: '— But Metzer, he said, had declared that — although it was not stated therein that the causae of
    the arrest were to be produced, it nevertheless went without saying that they would have to be supplied
    afterwards; with that, however, he would never concern himself. One might well [uncertain: become]
    at this [uncertain: washing/chatter] — for [uncertain: yesterday/lately] [uncertain: Weltzer/Metzer]
    did admit that had one been able to make the deposit even for only 6 days, Broniewski was lost, and
    would have taken whatever one gave him out of grace. In short, it is enough to vex one to death, when
    one has long to do with this low, rapacious rabble. To the question how long the liquidation suit
    would last, Metzer opines very cold-bloodedly: 6 to 8 years. This is precisely the reason why the
    rascals have twisted the affair so, in order to keep Your Serene Highness always in their hands and
    be able to empty Your pockets. I remain, until death, Your Most Serene Highness''s Posen, the 22nd
    of July 1804, faithful humble and obedient servant v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'The Chapter of the Cathedral Church of Poznań. We make known by these presents, to all and singular
    whom it concerns, that We, at the petition of the party whom it concerns, have caused the Privilege
    set out below, of the date and year contained in it, and approved in the General Chapter of Saint
    Martin in the Year of Our Lord One Thousand Seven Hundred and Sixty-Seven, found in the Book of Privileges
    of the Cathedral Church of Poznań preserved in our archive, to be transumed and issued in probative
    form; the tenor whereof follows in this manner:


    Teodor, Prince Czartorski of Klewań and Żuków, by the grace of God and of the Holy Apostolic See Bishop
    of Poznań and of Warsaw. To all in general and to each in particular, to whom it now or hereafter
    shall pertain to know, We make known that the noble Simeon and Apollonia Rządkowcy, spouses, have
    petitioned Us that we might be pleased to release and sell to them a vacant [uncertain: Slad] of arable
    land in the village of Głazewo, belonging to our key [estate] of Pszczew, together with a dwelling-house
    and a barn erected at manorial cost, out of the various rent, with exemption from [the burdens of]
    the other inhabitants of that same village. We, inclining to such a request, inasmuch as it tends
    to the increase of a certain revenue of ours, have resolved to release and sell that same [uncertain:
    Slad] of arable land together with the dwelling and barn to them and to their successors; as by the
    present Privilege, in respect of the aforesaid cost for the said buildings, we do release and sell
    it for thirty Red Zlotys in specie, Dies # 30, for which [uncertain: Stad] of arable land these noble
    Rządkowscy and their successors shall be obliged to pay one hundred and thirty Polish Zloty, and that
    in two instalments, namely at the Feast of St. John the Baptist sixty-five Zloty, and at the Feast
    of the Three Kings likewise sixty-five; and to render the poll-tax and the hiberna punctually to the
    commune according to custom. They shall be bound to send [labourers] for the corvée-services to the
    demesne farm of Głazewo four times a year, and likewise for the clearing of the meadow called Obska,
    joined to that same demesne farm by right, together with the commune. And for every two quar-'
- page: 2
  en: '-ters of barley by the old Zwowecki [uncertain: Zwowecki] measure, a barrel of beer from the Pszczew
    brewery is to be allowed [them]. We promise, in our own name and in the name of Their Most Illustrious
    and Excellent Lordships our successors, the Bishops of Poznań, that we shall not remove the said noble
    Rządkowscy and their successors from the use and peaceful possession of that same [uncertain: Slad]
    of arable land, nor shall we grant to anyone whomsoever the power of removing them; but rather shall
    we preserve them inviolate under the present Privilege, and Their Most Illustrious and Excellent Lordships
    our successors shall preserve them likewise. Saving the rights of the Church and of the Commonwealth
    in their entirety. Whereof, for the greater weight, having subscribed with our own hand, we have ordered
    it to be confirmed with our seal. Given at Dolsk on the Twenty-Sixth Day of September in the Year
    of Our Lord One Thousand Seven Hundred and Sixty-Six.


    Teodor, Prince Czartonski, Bishop of Poznań (L. S.) Gentilitio

    Andreas Myskowski, D. C. P., President of the Chapter (L. + S.) Capitularis.


    Extracted from the Book of Privileges of the Cathedral Church of Poznań, under the seal of the Most
    Reverend Chapter of the same Cathedral of Poznań. Melchior Janowski, Apostolic Notary, Secretary of
    the same Most Reverend Cathedral Chapter of Poznań.'

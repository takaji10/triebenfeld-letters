status: draft
segments:
- page: 1
  en: 'The Chapter of the Cathedral Church of Poznań. We make known by the tenor of these presents, to
    all and singular whom it concerns, that We, at the petition of the party whose interest it is, have
    ordered the Privilege set out below — of the day and year contained within it, and approved in the
    General Chapter of St Martin in the Year of the Lord One Thousand Seven Hundred and Sixty-Seven —
    found in the Book of Privileges of the Cathedral Church of Poznań preserved in our Archive, to be
    transumed and issued in probative form; the tenor whereof follows in this manner:


    Teodor of Klewań and Żuków, Prince Czartorski, by the Grace of God and of the Holy Apostolic See Bishop
    of Poznań and Warsaw. To all in general and to each in particular, to whom it now or hereafter shall
    pertain to know, We make known that the Noble Simeon and Apollonia Rządkowcy, spouses, have petitioned
    Us that We might be pleased to release and sell to them a vacant Ślad of arable in the village of
    Głazewo belonging to our Pszczew key [estate-complex], together with a dwelling-house and a barn erected
    at manorial cost, out of the various rent, with the exclusion [uncertain: wyaniem] of the other inhabitants
    of that same village. We, inclining to such a request, inasmuch as it tends to the increase of a certain
    revenue of ours, have resolved to release and sell that same Ślad of arable together with the dwelling
    and the barn to them and to their successors, as by the present Privilege, in consideration of the
    aforesaid cost of the said buildings, for Thirty red złoty in specie, Dies # 30, we release and sell
    it; from which Ślad of arable these Noble Rządkowscy and their successors shall be obliged to pay
    One Hundred and Thirty Polish złoty in two instalments, that is, at the Feast of St John the Baptist
    Sixty-five złoty, and at the Feast of the Three Holy Kings likewise Sixty-five; and to render the
    poll-tax and the hiberna punctually to the commune according to custom. They shall be bound to go
    to the tłuki [compulsory labour-days] at the Głazewo demesne farm four times a year, and likewise
    to send, together with the commune, to the clearing of the meadow called Obska which is attached by
    law to that same demesne farm. And for every two quar-'
- page: 2
  en: '-ter-measures of barley, of the old Zwowecki measure, a barrel of beer from the Pszczew brewery
    is to be permitted [them]. We promise thereto, in our own name and in the name of the Most Illustrious
    and Most Reverend Successors of Ours, Bishops of Poznań, that we shall not remove the aforesaid Noble
    Rządkowscy and their successors from the use and peaceable possession of that same Ślad of arable,
    nor shall we grant to anyone whomsoever the power of removing them; but rather we shall preserve them
    inviolate in the present Privilege, and Our Most Illustrious and Most Reverend Successors shall preserve
    them, the rights of the Church and of the Commonwealth being kept whole. In witness whereof, for the
    greater weight, having subscribed with our own hand, we have commanded it to be confirmed with our
    Seal. Given at Dolsk on the Twenty-Sixth Day of September in the Year of the Lord One Thousand Seven
    Hundred and Sixty-Six. Teodor, Prince Czartonski, Bishop of Pozn[ań] (L. S.) Gentilitio. Andreas Myskowski,
    D. C. P., President of the Chapter (L. + S.) Capitularis.


    Extracted from the Book of Privileges of the Cathedral Church of Poznań, under the seal of the Most
    Reverend Chapter of the same Cathedral of Poznań. Melchior Janowski, Apostolic Notary, Secretary of
    the same Most Reverend Cathedral Chapter of Poznań.'

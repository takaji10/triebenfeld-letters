- page: 2
  en: 'I was on the road to Königsberg but had to turn back hither again. Now I am seeking to borrow some
    thousands in money, and with these I shall watch for the return of the 2 Emperors and the Grand Duke.
    To these I shall attach myself and go with them wherever it may be, cost what it will. Through the
    Grand Duke above all I shall work on Your Serene Highness''s behalf — I have gained experience, and
    this I shall put to use, and when the principal affairs of the monarchs have been transacted, to beg
    the Grand Duke so long until he advances your cause; I have too often made the observation that with
    great lords it is he who speaks last who carries the day — Hjostein has now sunk low, and I believe
    that Your Serene Highness''s affairs will now shortly take the happiest turn. Before this man came
    forward and took the helm in hand, the King and the Queen were very well disposed towards Your Serene
    Highness, and at that time I hoped for the best. But as soon as Mr von Stein spoke ambiguously of
    the command you had conducted, the tone of the court changed also. Meanwhile I believe there will
    now soon be a complete want of men who can steer the helm sensibly. Therefore they will surely look
    about again for the one man whom nature herself has [uncertain: pult] to homage, and will have to
    endeavour to fetch him hither. The hypocritical Kalckreuth will to the old W. and was to step forward.
    There is no one in the State who has meant so honestly by the King as Your Serene Highness. Everyone
    joins to his actions only his own interest and seeks to line his pockets'

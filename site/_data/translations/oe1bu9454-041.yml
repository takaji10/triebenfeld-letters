- page: 3
  en: 'to line. All tread softly so as to keep themselves in their places and to feed themselves well.
    There is none who tells the monarch the truth and goes straight at it. Count Lottom[?] and Count Palzen
    are a pair of upright men, but both must proceed with the utmost caution, because otherwise they might
    easily be laid aside in the skat — My unpresumptuous counsel is that Your Serene Highness now do nothing
    at Erfurt but wait to see what will happen in the great matters, for things will not remain as they
    are, as surely as there is a God, and everything may change in a flash — the sole endeavour of Your
    Serene Highness and of your adherents must now be that you first come back into your place. Why will
    you not go to Silesia? I should do it, and should notify the King that I was there and that I would
    come to him. I stake my life upon it — if the King seeks Your Serene Highness again, then everything
    is at once back in its track — all the more if Constantin or the Emperor shall have prepared something
    beforehand. You know the King: he has not the heart to propose anything to you, most gracious Lord.
    Besides, he now holds himself to be poor and stripped of everything; but if you can come to meet him
    and tell him that you will now help and advise, yet will not for a while be burdensome to him, then
    he will idolise Your Serene Highness — What a piece of good fortune it would be if you were at present
    in Königsberg when the Emperor returns. Everything would go better and would be negotiated with more
    courage.


    The present entourage of the K. would be mightily alarmed at your appearance, but soon everyone would
    bow deeply before you and Triebenfeld'

- page: 1
  en: '41


    Most Serene Prince


    Most gracious Prince and Lord!


    I have had the honour to receive Your Most Serene Highness''s most gracious letter. I regret nothing
    more than that this could not have happened 4 days earlier, since the Count was just then passing
    through here on his way to Erfurt, and it would have been an easy matter for me to attach myself to
    him and to make that tour with him. Today it is useful to set out upon the road to Erfurt, because
    it is quite uncertain how long the two Emperors will tarry there; besides, I also lack the ready money
    to make the journey thither, and with empty hands nothing can be done there. Moreover I believe that
    at Erfurt not everything will yet be decided; I mean that there they will only first draft everything
    and then deal out the cards for play — It depends upon who plays along, and whether the greatest player
    does not, quite as much as our Lord, lose his game codille. The alliance between England, Sweden,
    Austria and Turkey is considerable, and may perhaps compel Russia to steps which it does not now suspect
    it will take. My striving and endeavour is only that Your Most Serene Highness might be set again
    in the right place, and to that end I shall in quiet contribute everything possible'

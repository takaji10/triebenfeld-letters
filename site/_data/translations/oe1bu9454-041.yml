- page: 2
  en: 'I was on the road to Königsberg but had to turn back here again. Now I am seeking to borrow some
    few thousand in money, and with these I shall watch for the return of the 2 Emperors and the Grand
    Duke. To these I shall attach myself and go with them wherever it may be, cost what it will. Through
    the Grand Duke above all I shall work on Your Serene Highness''s behalf - I have gained [uncertain:
    one man''s] experience, and this I shall put to use, and when the chief matters of the monarchs have
    been dealt with, to petition the Grand Duke so long until he advances your affair; I have too often
    made the observation that he who speaks last keeps the right with great lords - [uncertain: Hjostein]
    has now sunk low, and I believe that Your Serene Highness''s affairs will now shortly take the happiest
    issue. Before this man came forward and took the [uncertain: Muder] in hand, the King and the Queen
    were very well disposed toward Your Serene Highness, and at that time I hoped for the best. But as
    soon as Mr. von Stein spoke ambiguously about the command you had conducted, the tone of the court
    changed as well. Meanwhile I believe there will now soon be a complete want of men who can conduct
    the [uncertain: Nider] rationally. Therefore people will doubtless look about again for the one man
    whom nature herself has [uncertain: pelt] for [uncertain: homage], and will have to strive to fetch
    him in. The hypocritical Kalckreuth is becoming the old W. and was to step forward. There is no one
    in the state who has meant so honestly by the King as Your Serene Highness. Everyone combines with
    his actions only his own interest and seeks his pockets'

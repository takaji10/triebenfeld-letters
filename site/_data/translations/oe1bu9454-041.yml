- page: 3
  en: 'to fill. All tread softly so as to keep themselves in their places and feed themselves well. There
    is no one who tells the monarch the truth and goes straight at it. Count [uncertain: Lottore] and
    Count [uncertain: Lohen] are a pair of upright men, but both must proceed with the utmost caution,
    since otherwise they might easily be laid out in skat - My unpresumptuous advice is that Your Serene
    Highness should now do nothing at Erfurth but wait and see what happens in the great matters, for
    as sure as there is a God things will not stay as they are, and in a flash everything may change -
    the sole endeavour of Your Serene Highness and of your adherents must now be that you first come back
    into place. Why will you not go to Silesia? I would do it, and report to the King that I was there
    and that I would come to him. I stake my life upon it - if the King seeks Your Serene Highness again,
    then everything is at once in its track - all the more if [uncertain: Konckerten] or the Emperor shall
    have done some preparatory work. You know the King: he has not the heart to propose anything to you,
    most gracious Lord. Besides, he now holds himself to be poor and stripped of everything; but if you
    go to meet him and tell him that you wish now to help and advise him, yet by no means to be burdensome
    to him, then he will idolize Your Serene Highness. What a piece of good fortune it would be if you
    were at present in Königsberg when the Emperor returns. Everything would go better and be negotiated
    with more courage.


    The present [uncertain: Alantones] of the K. would be mightily terrified at your appearance, but soon
    every one of them would bow'

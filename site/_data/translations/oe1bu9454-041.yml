- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, I have had the honour of receiving Your Most Serene Highness''s most
    gracious letter. I regret nothing more than that this could not happen 4 days sooner, since just then
    the Count was passing through here and on to Erfurth, and it would have been an easy matter for me
    to attach myself to him and make that journey with him. Today it is [uncertain: useful] to set out
    on the road to Erfurth, because it is entirely uncertain how long the two Emperors will remain there;
    besides, I also lack the [uncertain: Canzes] money to make the journey there, and with empty hands
    nothing can be done in that place. Moreover I believe that in Erfurth not everything will yet be decided;
    I mean that there they will only first draw everything up and then deal out the cards for play - It
    depends who plays along, and whether the greatest player does not, just as well as our master, lose
    his game codille. The alliance between England, Sweden, Austria and Turkey is considerable, and may
    perhaps compel Russia to steps which at present it does not suspect it will take. My every thought
    and endeavour is only that Your Most Serene Highness might be set again in the right place, and to
    that end I shall in silence contribute everything possible'

- page: 4
  en: 'deeply — let Your Serene Highness take this well to heart, procure where it is possible some thousands
    together and then go this road courageously — You will not fail, as surely as there is a God — the
    South Prussian affairs are, as I have written to Your Serene Highness before, set in the best train;
    the French government has lifted a part of the sequestration and has ordered the revenues to be released.
    The matter has been sent to Warsaw to the French chargé d''affaires, so that he may make it known
    to the Ministry of Justice with the intimation that the moneys are to be let pass unhindered. As soon
    as this has been made public from Warsaw at Kalisz, I shall see to it that you receive moneys from
    there.


    The letters to Lichnowski and Metzig are good and entirely suited to the business. Lichnowski belongs
    at Trąbczyn and there he must wait until the times change. To Mr Melzig I should write separately
    besides, and set him to rights in such a manner that he shall long remember it. The burgesses there
    owe inq various transfer fee (Laudemium) moneys and, of the 4,000 Rthl of remaining purchase sum,
    over 8 to 9,000 Rthl; why does the villain not drive it in together and report that the money is there
    — then it would soon be seen how it was to be got out. The rascal did, from my own hands, at that
    time when he helped to conduct the business with the burgesses, receive 200 Rthl[?] d''or in cash,
    which I gave the fellow out of my own pocket. Now he must do something for it, or he shall feel it.
    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 20th September 1808


    humble and faithful servant


    Peter


    Today a courier comes from Prince Wilhelm, from whom I shall learn whether the stay at Erfurt is to
    be of any duration; were that so, then I should go there after all — but if the Emperor Alexander
    returns next week, then I shall await him at Storkow — where I shall soon be set upon by every solicitation
    — for the Storkow journey I have kept thirty Friedrich d''or here. — For the great journey I must
    have at least 400 Friedrich d''or in the cash-box, and these I shall borrow[?] here'

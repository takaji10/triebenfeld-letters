- page: 4
  en: 'deeply before you - let Your Serene Highness take this well to heart, procure where it is possible
    some few thousand together and then take this road courageously - You will not fail, as sure as God
    is. The South Prussian affairs are, as I have written to Your Serene Highness before, set in train
    in the best way; the French Government has lifted a part of the sequestration and ordered the revenues
    to be paid over. The matter has been sent to Warsaw to the French Chargé d''Affaires, so that he should
    make this known to the Ministry of Justice with the intimation that the moneys are to be allowed to
    pass unhindered. As soon as this has been made public from Warsaw in Kalisz, I shall see to it that
    you receive moneys from there.


    The letters to Lichnowski and Metzig are good and entirely suited to the matter. [uncertain: Schnomchi]
    belongs at [uncertain: Traben] and there he must wait until the times change. To Mr. Metzig I would
    write separately and set him right in such a way that he should long remember it. The burgesses there
    owe, in various transfer fees (Laudemium) and of the 4000 Rthl remaining purchase sum, upward of 8
    to 9000 Rthl; why does the good-for-nothing not drive it in together and report that the money is
    there? Then we should soon see how it might be got out. The rogue did, after all, receive from my
    hands at the time, when he helped conduct the business with the burgesses, 200 in cash, which I gave
    the fellow out of my own pocket. Now he must do something for it, or he shall feel it. In deepest
    reverence I remain, until death,


    Ber[lin?] the 20th of September 1808


    Your Most Serene Highness''s


    humble and faithful servant


    Peter'

status: draft
segments:
- page: 1
  en: 'Dear Friend! In my opinion, let the fellow be called what and as he will, and be what he will —
    one must hunt him out and [uncertain: flatter] him wherever one thinks he can give any disclosure
    about those [uncertain: Spez] villainies. That is indeed the course I always proposed — and just so
    there is still a second one, which will probably in the end be the best. Yet this one must by no means
    be left [uncertain: unattended] — Terrible it is, all that the good, worthy Prince must endure; will
    it not be [taken as] what one thinks, that one comes too close upon the gentleman? The world is so
    full of villains and [uncertain: ungrateful] people that at every step one takes [uncertain: unawares]
    one always knocks against some malicious rogue — who makes it his especial duty to shove every man
    of honour aside. The vicious fellow, the Wildegansch, is here — He tells everybody that the Prince
    sent him hither — Several good men have on that account been [uncertain: taken in] — the scoundrel
    has merely led the Prince by the nose; for the rogue with his following merely invented this project
    concerning a money-negotiation, which he then set on foot with An and Schlabrendorff so [uncertain:
    cunningly], and meant to cheat the good Prince out of the costs. But as I hear, nothing will be decided
    in this matter within 2 months, and after that it will still be God knows how? / and so long will
    the Prince be — deceived, [while] the gang here [uncertain: sip]. To the very end I am your [uncertain:
    Undrehnen]


    Berlin, the 31st January 1805.


    Friend and yours

    v Triebenfeld'
- page: 2
  en: 'Herr v Bukowiecki writes to me and will give no more than 2400 Rthl yearly rent for Betsche; the
    man must be mad. A pity about the postage I have had to pay for his scrawl. Here too I hear that the
    Jew Asch and Gad, name-bearer of Schlabrendorff, are nevertheless going to sue me henceforth on account
    of the bill of exchange of 11000 v. given to Schlabrendorff for [uncertain: the Pärzten] by His Serene
    Highness, and to obtain an execution decree against me — I beg you for God''s sake, do tell His Serene
    Highness that the gentleman should have a care to this, and that the coward who has so lied to the
    gentleman may have the affair thwarted — It would indeed be an everlasting disgrace if the court distrainer
    were sent into the house to my wife in my absence — O God, what must one not suffer in this world.'

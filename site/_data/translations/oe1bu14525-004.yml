- page: 2
  en: 'to convey.


    We also do so herewith, and by virtue of this, out of Royal power and plenitude, for Ourselves and
    Our successors and heirs to the Crown of the Electorate and Our remaining lands, in such manner and
    to this effect, that Our aforesaid friendly dear uncle, the Prince of Hohenlohe-Ingelfingen, shall
    have, possess and enjoy the above-named estates, with all rights and privileges attaching thereto,
    as these have hitherto been exercised or may lawfully be exercised, and no less with all their appurtenances
    and other belongings, by whatsoever name they may be called, as the same have hitherto been used or
    may lawfully be used, as a well-acquired and unrestricted property — yet under the reservation of
    the sovereign taxes and other public dues to be laid upon them, as upon the other estates of Our South
    Prussian vassals — for himself and his successors and heirs, from now on for all eternity, irrevocably
    from Us and Our successors; and that the power shall also be accorded to the same to dispose thereof
    at his pleasure, unhindered by any man. We therefore command and enjoin all Our South Prussian governments
    and Chambers of War and Domains, as also all other authorities whom this concerns, herewith'
  names:
  - de: Hohenlohe Ingelfingen
    en: Hohenlohe-Ingelfingen
    kind: place
  - de: Süd-Preussischen
    en: South Prussian
    kind: place
- page: 3
  en: 'as graciously as earnestly, that they shall in no wise hinder or impede the oft-mentioned Prince
    of Hohenlohe-Ingelfingen in the hereditary and proprietary possession, conferred upon him, of the
    above-named possessions and estates together with their appurtenances and belongings, nor him or those
    to whom he may one day, by virtue and in force of this Our letter of donation, bequeath the same or
    otherwise lawfully transfer it by other acts among the living or by reason of death; but rather shall
    let him, and eventually also them, enjoy the same freely and undisturbed, shall themselves do nothing
    against it, nor occasion or permit such to be done by others, on pain of Our All-Highest displeasure
    and of unfailing severe punishment.


    In witness whereof We have signed the present letter of donation with Our own All-Highest hand. Friedrich
    Willhelm


    Deed of donation, for the reigning Prince of Hohenlohe-Ingelfingen, to the hereditary and proprietary
    possession of the town of Kamionna, or Kamionna, and of the market town of Kulm in the Posen district,
    of the villages of Trąbczyn, Szetlewek, Nowa wies, Łazy, Old and New Laske, Osiny, Hauland Trąbczyński,
    in the Konin district, and of the village of Brzyce together with appurtenances in Cujavia. That the
    foregoing copy is in complete agreement with the All-Highest executed'

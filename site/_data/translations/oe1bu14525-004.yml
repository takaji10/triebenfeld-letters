segments:
- page: 1
  en: 'We Friedrich Willhelm, by the Grace of God King of Prussia, etc.


    Do hereby make known and declare, by means of this Our open letter, for Ourselves and Our successors
    to the Crown of the Electorate and Our remaining lands, and herewith graciously give every man whom
    it may concern to know, that, as We are, out of Our inborn favour and clemency, most inclined to acknowledge
    and to requite the good and fruitful services rendered to Us and to Our Royal House by particular
    marks of Our Royal benevolence, We have weighed in Our Royal mind the important, distinguished and
    useful services rendered to Us and to Our Royal House for a considerable number of years by the high-born
    Prince, Our friendly dear uncle, Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, Our Lieutenant
    General of Infantry, chief of a regiment of foot, Governor of the capital city of Breslau, Knight
    of Our Orders, etc., and have resolved, in order to give the said Prince a mark of the recognition
    of his excellent merits and of Our Royal gratitude, to confer and convey upon the same the hereinafter
    named estates, namely the town of Kamionna, or Kamionna, and the market town of Kulm, in the Posen
    district, and the village of Brzyce together with its appurtenances in Cujavia, with all their belongings,
    by whatsoever name they may be called, hereditarily and in full ownership, and'

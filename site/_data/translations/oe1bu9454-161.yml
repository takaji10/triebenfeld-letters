- page: 2
  en: 'What I can [uncertain: contribute] toward fulfilling Your Most Serene Highness''s wishes is my
    sacred duty, and I am most thankful to the same for any gracious expressions. Mr von Triebenfeld will,
    I hope, not refuse me the testimony that I have not been [uncertain: wanting] in industry and diligence
    [illegible: destr.]. Since, however, this is a duty for me, I set a particular value upon it, although
    I equally wish that the faithful fulfilment thereof may preserve for me the gracious sentiments of
    Your Most Serene Highness.


    I remain, until death, with reverence


    Your Most Serene Highness''s                    Berlin, 9 February 1805


    most humble and obedient servant


    Amelang'

- page: 1
  en: '161


    Most Serene Prince!


    Most gracious Prince and Lord!


    Your Most Serene Highness''s gracious letter of the 3rd of this month arrived here at the very moment
    when the Councillor von Triebenfeld was about to depart. I was still able to lay it before him, and
    he was greatly delighted that


    Your Most Serene Highness had deigned to express gracious satisfaction with his endeavours. The payment
    of the assignation has, according to the report received, already been made to the [uncertain: ledighe
    Courtoir]. Everything will depend henceforth upon the review of the [uncertain: Lage] and upon its
    being expedited. The [uncertain: Principie] at the public authorities are moreover so [uncertain:
    Passagair] that everyone [illegible: ringt] the same and lets 4 weeks stand over. Three to four months
    ago [text corrupt: rum] the whole business [would have been] settled more shortly and with fewer scruples.
    Now it is otherwise.'

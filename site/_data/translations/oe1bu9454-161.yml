- page: 2
  en: 'What I can [uncertain: exert] towards fulfilling Your Most Serene Highness''s wishes I hold [text
    lost] no sacred duty, and I am most grateful to the same for such gracious expressions. Mr. von Truberger
    will, I trust, not withhold from me the testimony that I have not been wanting in diligence and industry.
    Since this is however a duty for me, I set a particular value upon it, although I equally wish that
    the faithful fulfilment of the same, like the gracious sentiments of Your Most Serene Highness, may
    long be preserved.


    In deepest reverence I remain


    Your Most Serene Highness''s Berlin, the 9th of February 1805


    most humble and obedient servant


    AMuntte[illegible]'

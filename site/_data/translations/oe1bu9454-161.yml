segments:
- page: 1
  en: 'Most Serene Prince!


    Most gracious Prince and Lord!


    Your Most Serene Highness''s gracious letter of the 3rd of this month arrived here at the very moment
    when Kl. von Triebenfeld was about to depart. I was still able to lay it before him, and he was greatly
    delighted that


    Your Most Serene Highness has been graciously pleased to express gracious satisfaction with his efforts.
    The payment of the assignation has, according to the report received, already been made at the [uncertain:
    ledighe] counting-house. Everything further will depend upon the review of the situation and its expedition.
    The principles at the public authorities are, moreover, so transitory that everyone wrestles with
    the same and lets 4 weeks elapse. Three to four months ago the whole business was settled more briefly
    and with fewer scruples. Now it is otherwise.'

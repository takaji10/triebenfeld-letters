- page: 2
  en: 'half-yearly propination rent in advance. If I am rid of Honrichs, as I firmly hope, then Meierowitz
    will pay 20000 Rthl in cash 8 days before Midsummer, and will lay down an annual canon of 500 Rthl
    in perpetuity.


    What has happened with Swięcia, and whether my plan will succeed, I shall learn today from Nerlich.


    For the purchase of the grounds which are [uncertain: me]hhn to be dismembered altogether, many persons
    have already come forward, and among them several noblemen, who wish to buy many Hufen and to pay
    in cash at once. Meanwhile I press only for the issuing of the consent, so that no impediment of any
    kind can be put in my way.


    The Chamber had entrusted the investigation to the district administrator and prescribed the norm
    according to which Your Serene Highness may dismember; [illegible] this has been strictly complied
    with, everything set aside, and everything submitted to the Chamber, so that all chicaneries have
    been met and the ways to the throne made smooth, [uncertain: war] one wished to draw a new barrier
    across our nose, for I should lay before the King those dispositions which had been given, as well
    as all the contracts concluded in accordance with them, and the minutes, and should then there demand
    the concession with full right, without having to beg. The President v. G. is entirely of one mind
    with me in this. By the next post I shall send Your Serene Highness a copy of all these proceedings.
    With the Oleśnica fellows everything will be remedied very gradually.'

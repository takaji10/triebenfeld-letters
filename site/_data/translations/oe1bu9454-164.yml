- page: 4
  en: 'Now I must hold firmly and purely to the performance of the contract not now kept by the Oleśnica
    people, so that these scoundrels do not get through with any counter-claim, for otherwise we should
    have to fear a lawsuit of years'' duration. More than devilish it is that Glenck said not a word of
    the two Chamber dispositions or resolutions of the 23rd of December 1803 and the 24th of January 1804,
    and allowed a contract of the 22nd of February 1804 to be concluded out of them, which runs bolt straight
    against the edicts and rescripts of the Chamber that had been made known to Glenck. I now count upon
    Schenck''s good will and adroitness, which I had already called upon beforehand.


    From Dombrowski I learn just now that the Prusimski compromise stands in the Kowal archive, and that
    the receipts are also inquired into there, that Prusimski has paid. The proceedings run to some seventy
    sheets; I have asked Dombrowski to have them extracted with haste, then one will indeed get on the
    track of the matter, for [if] the recesses and actual resignations of Brzyce had also been stolen
    out of the archives, those persons would yet be able to demand nothing, but would rather have to pay
    out, since we do not have Brzyce. [uncertain: im] Ribbeck and Floricke Your Serene Highness need not
    trouble yourself, for these dogs I shall chastise jointly with Lichnowski. If only my health were
    not so shattered that I could [uncertain: gagen] about in all places, then everything should go more
    briskly; as it is, I must too often keep to my room in bed, there I lack all care, and the constant
    vexation wears me quite away — Meanwhile I remain, until death,


    Your Serene Highness''s


    Kalisz, the 4th of March 1805.


    most faithful servant


    v. Triebenfeld


    The wash-stand has given very much pleasure — the bust of bronze, however, I am bringing back — the
    friend wishes only three to 4 large ones of plaster, and those coated so as though it were bronze.
    Echtler has perhaps such in stock. Might I have them here by the next post?'

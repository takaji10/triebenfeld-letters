- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    From Berlin no resolution has yet come; I do not know what I am to think of Amelang''s diligence;
    men are all cut on one last — only do not stand always behind them, or clear the way oneself, or so
    fill the rapacious claws, and they let everything go at its snail''s pace. If the revision is made
    difficult for me by the Finance Department, then I shall have the district administrator revise, attest
    and guarantee the assessments; that is then more than is required. So it comes only to this, that
    word be sent me from Berlin.


    The chicaneries over the revision of the assessments are quite new and arise solely from Prince George
    and General Kalckreuth''s wife''s [uncertain: General Kalckreuth''s] impetuous conduct — neither Amelang
    nor still less I knew anything of it in Berlin; the wrangling was solely with Minister von Voss, by
    whom all the orders were swiftly given, and since the matter was not transacted in collegial form,
    no one could know of it either. This fine ordinance first came out [uncertain: was carried] in Breslau
    by the young Count Kalckreuth. Meanwhile, since so much has already been set aside, a way out must
    be found here too.


    Here everything goes so far according to wish, and I hope to bring together a heavy lump of money.
    With Otochten I think to be finished today. The like, 10000 Rthl in a short time, as also 2000 Rthl
    as the'

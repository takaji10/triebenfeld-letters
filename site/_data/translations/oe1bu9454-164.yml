- page: 4
  en: 'Now I must hold firm and purely to the performance of the contract not kept by the Oleśnicki people,
    so that these rascals may not get through with a possible counter-claim; otherwise we should have
    a suit of years to fear. More than devilish is it that Glenck said not a word of the two Chamber dispositions
    or resolutions of 23rd December 1803 and 24th January 1804, and allowed a contract to be concluded
    under 22 February 1804 which runs point-blank against the edicts and rescripts of the Chamber made
    known to Glenck. I now count upon Schenck''s good will and adroitness, which I had already called
    upon beforehand.


    From Dąbrowski I learn just now that the Prussiemski compromise lies [uncertain: stands] in the Kowal
    archive, and that the receipts are also inquired into there, that Prussiemski has paid. The transaction
    runs to some seventy sheets; I have asked Dąbrowski to have it extracted with haste; there indeed
    one will get on the track of the matter, for if the recesses and actual resignations of Brzyze had
    also been stolen from the archives, that party would still be able to demand nothing more, but would
    have to pay out further, since we do not have Brzyze. About Ritlach and Floriche let Your Serene Highness
    not trouble yourself, for these dogs I shall chastise in concert with Lichnowski. If only my health
    were not so shattered that I could go about in all places, then everything should go more briskly;
    as it is, I must too often keep the room, keep to my bed, where all nursing is wanting to me, and
    the constant vexation quite wears me out — Meanwhile I remain, until death,


    Your Serene Highness''s


    Kalisz, 4th March 1805.


    faithful servant


    v. Triebenfeld'

- page: 3
  en: 'For a long time already there has existed at the Chamber here (of which, however, as God lives,
    I knew not one jot) an edict, according to which


    1. no peasant or non-noble may be granted a noble estate in hereditary lease without special Royal
    consent


    2. even to noble hereditary lessees there may not be handed over or made over


    a. not the jurisdiction


    b. not the [uncertain: Zad]


    c. not the beer and brandy dues, and


    d. not the power to drive out the old subjects, or to displace them in their livelihoods. Already
    under 23rd December 1803 the Chamber here made this known to the building councillor Glenck and to
    the district administrator von Blomberg. More than punishable is it of the former, that he concealed
    such from Your Serene Highness and allowed that a contract should nevertheless be concluded with the
    Oleśnicki fellows. But base is it of the latter, that he nevertheless wished to conclude a settlement
    between the 3 Oleśnicki rogues and the old subjects, and to have Your Serene Highness guarantee the
    same. God, what manner of men are these, and in whose hands has Your Serene Highness been hitherto!
    — The whole Chamber files have been given me on high disposition; I am having all the fine pieces
    extracted, so that Your Serene Highness may at last be convinced'

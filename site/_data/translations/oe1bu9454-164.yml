- page: 1
  en: '164


    Most Serene Prince,


    Most gracious Lord!


    From Berlin no resolution has yet been forthcoming; I do not know what I am to think of Amelang''s
    diligence. Men are all cut from one last — only do not always stand behind them, or clear the way
    oneself, or [uncertain: ober füllt] the rapacious claws so, and they let everything go at their snail''s
    pace. If the review is made difficult for me by the Finance Department, then I shall have the district
    administrator review, attest and guarantee the valuations; that is indeed more than is demanded. It
    therefore comes down solely to this, that I be given a decision from Berlin.


    The chicaneries over the review of the valuations are entirely new and arise solely from Prince George''s
    and General Kalckreuth''s impetuous conduct — neither Amelang nor still less I knew anything of it
    in Berlin; the [uncertain: Zand] was solely with Minister von Voss, by whom all the orders were swiftly
    given, and since the matter was not dealt with in collegial session, no one could know anything of
    it. [uncertain: Unfuhr] this pretty ordinance first in Wrocław from young Count Kalckreuth. Meanwhile
    so much [uncertain: Ehe] has been set aside that here too a way out must be found.


    NB Amelang has himself given notice to the Jew [uncertain: Itzig] on the 18000 Rthl which he has secured
    elsewhere. The Jew has believed that this was done only for appearance''s sake, and thought to write
    to Your Serene Highness with a judicial notice — but it remains with my plan[s?] — the interest I
    have duly paid, and hold a receipt for it, so that Your Serene Highness''s honour could not be [uncertain:
    compromised] —


    Here everything so far goes as one would wish, and I hope to bring together a heavy lump of money.
    With Otocki I think to conclude today. He promises 10000 Rthl within a short time, as well as 2000
    Rthl as the'

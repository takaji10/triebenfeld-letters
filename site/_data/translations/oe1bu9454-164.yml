- page: 2
  en: 'half-yearly propination-rights rent, promises to pay in anticipation. If I am rid of Honrichs,
    as I firmly hope, then Meierowitz pays 20000 Rthl in cash 8 days before Midsummer, and lays down an
    annual canon of 500 Rthl in perpetuity.


    What has happened with Swięcia, and whether my plan will succeed, I shall learn today from Nerlich.


    For the purchase of the lands which are to be dismembered generally, many persons have already come
    forward, and among them several noblemen, who wish to buy many Hufen and to pay at once in cash. Meanwhile
    I press only for the issue of the consent, so that no obstacle of any kind can be laid in my way.


    The Chamber had entrusted the investigation to the district administrator and prescribed the norm
    according to which Your Serene Highness may dismember; this has been strictly complied with, everything
    set aside, and everything submitted to the Chamber, so that all chicaneries have been met and the
    ways to the throne levelled, were one to try to draw a new barrier before our nose; for I should lay
    before the King those dispositions given, as also all contracts concluded thereafter, together with
    the protocols, and then demand there the concession with full right, without needing to beg. President
    v. G. is entirely of one mind with me on this. By the next post I shall send Your Serene Highness
    a copy of all these transactions. With the Oleśnicki fellows everything will be remedied very gradually.'

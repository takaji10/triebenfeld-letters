- page: 3
  en: 'There has long existed with the Chambers here (of which, however, as God lives, I have not known
    one jot) an edict, according to which


    1. no peasant or non-noble may be granted a noble estate in hereditary lease without special royal
    consent


    2. even to noble hereditary lessees there may not be handed over, or left to the hereditary lessees,


    a. not the jurisdiction


    b. not the [uncertain: Zad]


    c. not the beer and brandy revenue, and


    d. not the power to drive out the old subjects, or to disturb them in their livelihoods


    Already under the 23rd of December 1803 the Chamber here made this known to the building councillor
    Glenck and to the district administrator v. Blomberg. More than punishable is it of the former, that
    he failed Your Serene Highness in this and permitted that a contract was nevertheless concluded with
    the Oleśnica fellows. But base is it of the latter, that he nevertheless wished to conclude a settlement
    between the 3 Oleśnica rogues and the old subjects, and to have Your Serene Highness guarantee the
    same. God, what sort of men are these, and in whose hands has Your Serene Highness been until now
    — By high disposition the whole of the Chamber files have been given to me; I am having all the fine
    pieces extracted, so that Your Serene Highness may for once be convinced'

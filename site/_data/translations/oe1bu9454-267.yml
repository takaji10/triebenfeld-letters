- page: 2
  en: 'and negotiate directly with the King of Fr[ance]; I believe the outcome would answer to your wishes
    — The upright Prince Hardenberg is fairly well recovered from his somewhat severe indisposition —
    God preserve the noble man — for otherwise the whole machine stands still — Once again I beg for the
    speediest news of what has been accomplished at Brzeg, for the written undertaking, and for money
    — In deepest reverence I remain, until death, Your Serene Highness''s


    Vienna, 13 January


    1815.


    faithful and obedient servant


    v Triebenfeld'

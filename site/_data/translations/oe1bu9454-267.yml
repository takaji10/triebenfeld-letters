- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Today is the 27th day since Your Serene Highness sent me the latter letter, of the 17th of December,
    by the Neisse messenger, which I received on the 21st. Since that time I have not seen a single letter
    of the alphabet from Your Serene Highness. In vain do I hope for the letter to the Prince Chancellor,
    for the blank forms, also the power of attorney for the privy councillor von Goeschel — further for
    the written undertaking for ß concerning Koschentin, and for money — B can give nothing further and
    I must, as sure as there is a God, [uncertain: go hungry]. What troubles me most of all is that I
    see and hear nothing from Brieg — if only the report came in according to our wishes, then all would
    already be won — as though forged in fetters I must sit here to no purpose and wait, with fear and
    trembling, solely for news from that quarter — had I in the meantime received the papers mentioned
    above, I could to some degree have gone on working in this matter and that, but as it is I must lie
    at anchor in the bay without money and without news, and Hungern himself is already beginning to falter
    and to hold the matter laid before him as half untrue, or as an unpardonable negligence — He says,
    why does the Prince not send the things by express courier — I still do not know how I am to cloak
    the business.


    If, however, Your Serene Highness did indeed dispatch the above letter to me on the 18th of December
    and the money on the 25th, and also sent further letters hither, then do have the waybills follow
    after them at the very earliest, and order that these be delivered here to me — For the rest, everything
    here is still as it was — nothing can yet be determined with certainty — England''s over-hastily concluded
    peace with America excites a sensation — It seems that only now does she mean to lead the word here
    at the Congress. Meanwhile the East Indian and Persian affair seems to be becoming dangerous for the
    English, and, and so they may well have to adopt a somewhat more subdued tone[?] — Russia, meanwhile,
    means absolutely to press our Lord hard over Poland. God knows how this will yet end. Prince Bertenstein
    Stetten has returned from Paris — He had a considerable claim against France. He went there himself
    and [uncertain: renehirte] with the King, who is having 400000 francs paid out to him — If everything
    here still went according to our wishes, then might Your Serene Highness also yourself go thither'

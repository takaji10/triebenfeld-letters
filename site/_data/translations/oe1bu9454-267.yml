- page: 1
  en: '267


    Most Serene Prince


    Most gracious Prince and Lord!


    Today is the 27th day since Your Serene Highness sent me the latest letter, of 17 December, by the
    Nysa messenger, which I received on the 21st. Since that time I have not seen a single letter of the
    alphabet from Your Serene Highness. In vain do I hope for the letter to the Prince Chancellor, for
    the blank forms, and also for the power of attorney for the privy councillor von Göschel — further,
    for the written undertaking for B. concerning Koszęcin, and for money — B[arbe] can give nothing further,
    and I must, as surely as there is a God, go hungry — What troubles me most of all is that I neither
    see nor hear anything from Brzeg — If only the report came in as desired, then everything would already
    be won — as though forged in fetters I must sit here to no purpose and wait, with fear and trembling,
    for news from that quarter alone — had I in the meantime received the papers mentioned above, I should
    to some degree have been able to work on in this and that matter, but as it is I must lie at anchor
    in the bay without money and without news, and starve — B[arbe] himself is already beginning to falter,
    and to hold the matter as reported to be half untrue, or to be an unpardonable negligence — He says,
    why does the Prince not send the papers by express courier — I truly no longer know how to gloss the
    thing over.


    If, however, Your Serene Highness did indeed dispatch the above letter on 18 December and the money
    to me on the 25th, and also sent further letters here, then do let the tracking-notes follow after
    them with all possible speed, and order that these be delivered here to me — For the rest, everything
    here is still as it was — nothing can yet be determined with certainty — England''s too hastily concluded
    peace with America is causing a sensation — It seems that only now does she mean to have the say here
    at the Congress. Meanwhile the East Indian and Persian affair appears to be becoming dangerous for
    the English, and they may well have to adopt a somewhat purer[?] tone — Russia, meanwhile, means absolutely
    to press our Lord hard concerning Poland. God knows how this will yet end — Prince Bartenstein Stetten
    has returned from Paris — He had a considerable claim against France. He went there himself and [uncertain:
    negotiated] with the King, who is having 400,000 Franken paid out to him — If everything here should
    still go as desired, then Your Serene Highness might also go there yourself'

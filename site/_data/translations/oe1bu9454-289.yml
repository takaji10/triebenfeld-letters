- page: 1
  en: 'Right Honourable Sir,


    Highly honoured Privy Cabinet Councillor, it will certainly not be unknown to Your Right Honourable
    that the Churish heirs have a claim against the E. v. Hohenlohe of 300000 Rthl; the acknowledgement
    of debt concerning it was issued by the Prince and his divorced consort and signed by the Majesty
    of the late King as debtor in his own person, and the interest upon it was also paid out of the Royal
    [uncertain: lots] up to 1806. Upon this the Churish heirs believed they might ground their right to
    demand this sum, which today with the interest amounts to 426000 Rthl, from the treasury, and they
    commenced the suit against it. His Majesty thereupon, a year and a day ago, declared that he would
    have nothing to do with the matter, but rather renounced it entirely.


    This moved the Prince (although the sum had first been negotiated for the Majesty of the late King)
    to enter upon a compromise with the Electoral heirs, according to which the latter would be content
    with circa 112000 Rthl and would give a receipt for the whole item of debt. During His Majesty''s
    presence here, however, the same most highly gave the heiresses, quite contrary to the former declaration,
    the assurance that most highly he would have the matter laid before him upon his most high return
    to Berlin, and would then declare himself further.


    On the ground of this most high decision, the councillor of justice Inten[text lost] in Berlin has
    intimated to the Cährish attorney Eberhard [uncertain: to bring][text lost] to break off at once all
    compromise negotiations, because the treasury would now[text lost] render payment in full and must
    render it. The princely[text lost] had sent me hither in order to conclude the matter and to request
    an advance[text lost] of 112 Rthl in accordance with the compromise, which was to be reimbursed again
    out of the estates in[text lost] 4 years. But now, since the[text lost] Tuhrish heirs have withdrawn
    their word upon the hope held out to them[text lost], I am declared unable to bring the matter to
    the desired[text lost] goal and to procure for His Majesty a capital of 426000 Rthl[text lost]. I
    would also fall silent in reverence, were it not that my princely client entreats me so dreadfully,
    for upon the [text lost] of this debt the medical councillor Cosmar administers all the entailed estates
    and gives no man any account of it, and already since ex little or nothing, renders no accounting,
    and nobody knows where the revenues of these considerable estates remain. I must therefore, in the
    name of my client, beg for a most high, most gracious categorical decision.


    +whether His Majesty really intends to pay the debt of 426000 Rthl to the Gewish heirs, or whether
    the Prince is to settle the matter and be empowered to compound, as may still now be possible.


    which amount to some 80000 Rthl yearly


    all the more as the Prince has for


    years received, instead of 96000, only 2500 Rthl


    in all, and


    [illegible] not his own.


    In the first case I would most humbly beg that, if His Majesty will pay the debt and acknowledges
    himself as debtor in his own person thereto, a most high order be given that the Cosmarian administration
    be at once dissolved and that all monies be deposited by him.'

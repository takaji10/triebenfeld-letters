- page: 1
  en: '289


    Right Honourable Sir,


    Most highly esteemed Privy Cabinet Councillor!


    It will assuredly not be unknown to Your Right Honourable that the Courland heirs have a claim against
    the Prince of Hohenlohe of 300/m Rthl; the instrument of debt for it was made out by the Prince and
    his divorced consort and was signed by His Majesty the late King as principal debtor himself, and
    the interest on it was also paid out of the Royal treasuries down to 1806. Upon this the Courland
    heirs believed they might found their right to demand this sum, which today with the interest amounts
    to 426/m Rthl, from the treasury, and they commenced proceedings against it. His Majesty had thereupon,
    a year and a day since, declared "that He wished to have nothing to do with the matter, but rather
    disclaimed it entirely." This moved the Prince / although the sum had in the first instance been negotiated
    for His Majesty the late King / to enter into a settlement with the Courland heirs, under which the
    latter would be content with about 112/m Rthl and would give a receipt for the whole item of debt.
    During His Majesty''s presence here, however, He gave, entirely contrary to that first declaration,
    the assurance to the heiresses that He would have the matter laid before Him on His most high return
    to Berlin, and would then declare Himself further. On the ground of this most high decision, the councillor
    of justice Heneberg in Berlin has intimated to the Courland mandatary Eberhard at Brzeg at once to
    break off all settlement negotiations, because the treasury would now make the whole payment and must
    make it. The Prince had sent me here to bring the matter to an end and to request an advance of 112/m
    Rthl in accordance with the settlement, which was to be reimbursed again out of the estates in 4 years.
    But since now the Courland heirs have withdrawn their word upon the hope given them, I have been put
    out of a position to bring the matter to the desired goal and to preserve for His Majesty a capital
    of 426/m Rthl. I should also fall reverently silent, were my princely client not entreating so dreadfully,
    for on the ground of this debt the medical councillor Cosmar administers all the entailed estates
    and for 4 years now gives no man little or nothing of it, renders no account, and nobody knows where
    the revenues of these considerable estates remain. I must therefore, in the name of my client, beg
    a most high and most gracious categorical decision.


    which are said to amount to some 80/m Rthl yearly


    for the Prince has for


    4 years received, instead of 96/m Rthl, only 2,500 Rthl


    in all, and


    goes hungry with those about him + whether His Majesty is really minded to pay the debt of 426/m Rthl
    to the Courland heirs, or whether the Prince is to settle the matter and to endeavour to compound,
    as may still now be done!


    In the first case I should most humbly beg that, if His Majesty will pay the debt and acknowledge
    Himself as principal debtor thereto, a most high command be given "that the Cosmar administration
    be at once lifted, and that all moneys be deposited by him"


    5 May 1815.'
- page: 2
  en: 'In the second case, however, I should most obediently beg that His Majesty would at once disclaim
    the whole matter in accordance with His word first given, which must surely ever remain sacred, whereupon
    I might then hope with confidence to conclude the settlement. My client does indeed lose in the latter
    case. But he does not wish to know his monarch angered, for 426/m Rthl is a considerable sum which
    His Majesty will preserve, and therefore the Prince counts upon it that His Majesty may be pleased
    most graciously to command that the sum for which the composition with the Courland heirs shall be
    made be advanced, which however according to the appended plan can within a few years certainly, especially
    if the


    estates are at once taken


    into administration


    for the Royal


    account,


    and really be repaid, after which His Majesty the King will not lose so much as a Groschen, but rather,
    by my plan, will even save an old debt of 35,000 Rthl and will preserve in all 461,000 Rthl. "May
    Your Right Honourable deign to take this matter to heart, lay it before His Majesty, and obtain for
    me the categorical declaration of the monarch, so that each may receive what is his and the Prince
    be saved from the ruin which Cosmar would prepare for him." I must further note here most obediently
    that the Higher Provincial Court at Brzeg has already confirmed everything I have said in a report
    required of it by the Prince State Chancellor, concerning which all the files lie before His Serene
    Highness.


    It is with the greatest veneration that I remain Your Right Honourable''s


    Vienna, the 5th of May 1815


    most entirely obedient


    v Triebenfeld


    to the Cabinet Councillor Albrecht'

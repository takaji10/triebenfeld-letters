- page: 2
  en: 'In the second case, however, I should most obediently beg that His Majesty would at once disclaim
    the whole matter in accordance with His word first given, which must surely ever remain sacred, whereupon
    I might then hope with confidence to conclude the settlement. My client does indeed lose in the latter
    case. But he does not wish to know his monarch angered, for 426/m Rthl is a considerable sum which
    His Majesty will preserve, and therefore the Prince counts upon it that His Majesty may be pleased
    most graciously to command that the sum, for which the composition with the Curian heirs shall be
    made, be advanced, which however according to the appended plan can certainly and really be repaid
    within a few years, after which His Majesty the King will not lose so much as a Groschen, but rather,
    by my plan, will even save an old debt of 35000 Rthl and will preserve in all 461000 Rthl; especially
    if the


    estates are at once taken


    into administration


    for the Royal


    account.


    "May Your Right Honourable deign to take this matter to heart, lay it before His Majesty, and obtain
    for me the categorical declaration of the monarch, so that each may receive what is his and the Prince
    be saved from the ruin which Cosmar would prepare for him." I must further note here most obediently
    that the Brzeg High Provincial Court has already confirmed everything I have said in a report required
    of it by the Prince State Chancellor, concerning which all the files lie before His Serene Highness.


    It is with the greatest veneration that I remain Your Right Honourable''s


    Vienna, the 5th of May 1815


    most entirely obedient


    v Triebenfeld


    to the Cabinet Councillor Albrecht'

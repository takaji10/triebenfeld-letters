- page: 2
  en: 'In the second case, however, I would most obediently beg that His Majesty at once renounce the
    whole matter in accordance with the word first given by him, which must indeed always remain sacred,
    whereupon I might then hope with confidence to conclude the compromise. My client does indeed lose
    in the latter case. But he does not wish to know his [uncertain: months] angered, for 426000 Rthl
    is a considerable sum which His Majesty will receive, and therefore the Prince counts upon it that
    His Majesty may most graciously be pleased to order that the sum, upon which a compromise shall be
    made with the Churish heirs, be advanced; which sum, however, according to the plan appended herewith,
    can certainly and really be repaid within a few years, according to which the King''s Majesty will
    also not lose a single Groschen, but rather, by my plan, even rescue an old debt of 35000 Rthl and
    preserve in all 461000 Rthl for himself. especially if the


    estates are at once taken


    into administration


    for Royal


    account. May Your Right Honourable deign to take this matter to heart, lay it before His Majesty and
    obtain for me the categorical declaration of the Monarch, so that each may receive what is his, and
    the Prince be rescued from the ruin which Cosmar would prepare for him.


    I must further observe here, most obediently, that the Brieg Superior Provincial Court has already
    confirmed everything I have said, in a report required of it by the Prince State Chancellor, concerning
    which all the files lie before His Serene Highness. It is in the greatest veneration that I remain
    Your Right Honourable''s


    Vienna, the 5th of May 1815


    wholly most obedient


    v Triebenfeld


    to the Cabinet Councillor Albrecht'

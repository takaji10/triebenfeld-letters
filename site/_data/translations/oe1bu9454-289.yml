status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Most highly revered Privy Cabinet Councillor,


    It will assuredly not be unknown to Your Right Honourable that the Churisch heirs have against the
    E. v. Hohenlohe a claim of 300000 Rthl; the debt [uncertain: "Schuld zustrauen" — apparently the acknowledgement
    of debt] concerning it was issued by the Prince and his divorced consort, and signed by the Majesty
    of the most blessed King as debtor in his own person; and out of the Royal [uncertain: Lössen — lots/funds]
    the interest upon it was paid up to 1806. Upon this the Churisch heirs believed they might found their
    right to be permitted to demand this sum, which today with the interest amounts to 426000 Rthl, from
    the fiscus, and they commenced proceedings against the same. His Majesty had thereupon, a year and
    a day ago, declared that He would have nothing to do with the matter, but disclaimed it entirely.
    This moved the Prince — although the sum had first been negotiated for the Majesty of the most blessed
    King — to enter into a compromise with the Churisch heirs, according to which the latter would be
    content with circa 112000 Rthl and would give a receipt in discharge of the whole debt item. During
    His Majesty''s presence here, however, the same, quite contrary to the first declaration, gave the
    heiresses the assurance that He would have the matter laid before Him on His most high return to Berlin,
    and would then declare Himself further. Upon the ground of this most high decision, the Justice Councillor
    Inten[text lost] in Berlin has intimated to the Churisch mandatary Eberhard to bring [text lost] at
    once to break off all compromise negotiations, because the fiscus would now [text lost] render payment
    in full and must render it. The princely [text lost] had sent me hither to conclude the matter and
    to solicit an advance [text lost] of 112 Rthl in accordance with the compromise, which was to be reimbursed
    again out of the estates within [text lost] 4 years. But since now the [text lost] Churisch heirs
    have withdrawn their word upon the hope held out to them [text lost], I am, as stated, in no position
    to bring the matter to the desired [text lost] goal and to secure for His Majesty a capital of 426000
    Rthl [text lost]. I would also fall reverently silent, were it not that my princely mandant so terribly
    entreats; for upon the [text lost] of this debt the Medical Councillor Cosmar administers all the
    entailed estates and gives no man anything of it, and already since ex little or nothing, renders
    no account, and nobody knows where the revenues of these considerable estates remain. I must therefore,
    in the name of my honoured mandant, beg for a most high and most gracious categorical decision: whether
    His Majesty is really minded to pay the debt of 426000 Rthl to the Churisch heirs, or whether the
    Prince is to settle the matter and to be [uncertain: bemützt — perhaps "empowered/at liberty"] to
    compromise as may still be possible now; which amounts to some 80000 Rthl yearly, concerning all that
    the Prince has for years received, instead of 96000, only 2500 Rthl in all, and [uncertain: gert nit
    seinen einge gen — does not ... his ...]. In the first case I would most humbly beg that, if His Majesty
    will pay the debt and acknowledge Himself thereto as debtor in his own person, a most high command
    be given that the Cosmarian administration be at once lifted and that all monies be deposited by him.'
- page: 2
  en: 'In the second case, however, I would most obediently beg that His Majesty would at once disclaim
    the whole matter in accordance with His first given word, which must indeed ever remain sacred, whereafter
    I might then hope to conclude the compromise with confidence. My honoured mandant does indeed lose
    in the latter case. But he does not wish to know his Monarch angered, for 426000 Rthl is a considerable
    sum which His Majesty will receive, and therefore the Prince reckons upon it that His Majesty may
    most graciously be pleased to command the advance of the sum for which a compromise shall be made
    with the Churisch heirs — which sum, however, according to the plan appended herewith, can certainly
    and really be repaid within few years — according to which the King''s Majesty also will not lose
    a single Groschen, but, according to my plan, will even save an old debt of 35000 Rthl and secure
    in all 461000 Rthl; especially if the estates are at once taken into administration for the Royal
    account.


    May Your Right Honourable be pleased to take this matter to heart, lay the same before His Majesty,
    and procure for me the categorical declaration of the Monarch, so that each may receive what is his,
    and that the Prince may be saved from the ruin which Cosmar would prepare for him. I must here further
    note, quite obediently, that the Brieg Superior Provincial Court has already confirmed all that I
    have said, in a report required by the Prince State Chancellor, concerning which all the files lie
    before His Serene Highness.


    It is in the greatest veneration that I remain, Your Right Honourable''s


    Wien, the 5th May 1815


    most obedient

    v Triebenfeld


    to the honoured Cabinet Councillor Albrecht'

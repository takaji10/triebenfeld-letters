- page: 1
  en: '289


    Right Honourable Sir,


    Most highly esteemed Privy Cabinet Councillor!


    It will assuredly not be unknown to Your Right Honourable that the Curian heirs have a claim against
    the E. of Hohenlohe of 300/m Rthl; the instrument of debt for it was made out by the Prince and his
    divorced consort and was signed by His Majesty the late King as principal debtor himself, and the
    interest on it was also paid out of the Royal treasuries down to 1806. Upon this the Curian heirs
    believed they might found their right to demand this sum, which today with the interest amounts to
    426/m Rthl, from the treasury, and they commenced proceedings against it. His Majesty had thereupon,
    a year and a day since, declared "that He wished to have nothing to do with the matter, but rather
    disclaimed it entirely." This moved the Prince / although the sum had in the first instance been negotiated
    for His Majesty the late King / to enter into a settlement with the Curian heirs, under which the
    latter would be content with about 112/m Rthl and would give a receipt for the whole item of debt.
    During His Majesty''s presence here, however, they gave, entirely contrary to that first declaration,
    the assurance to the heiresses that He would have the matter laid before Him on His most high return
    to Berlin, and would then declare Himself further. On the ground of this most high decision, the councillor
    of justice Inten[text lost] in Berlin has intimated to the Curian mandatary Eberhard to bring [text
    lost] at once to break off all settlement negotiations, because the treasury would now [text lost]
    make full payment and must make it. The princely [text lost] had sent me here to bring the matter
    to an end and to request an advance [text lost] of 112/m Rthl in accordance with the settlement, which
    was to be reimbursed again out of the estates in [text lost] 4 years. But since now the [text lost]
    Curian heirs have withdrawn their word upon the hope given them [text lost], I am, as stated, not
    in a position to bring the matter to the desired [text lost] goal and to preserve for His Majesty
    a capital of 426/m Rthl [text lost]. I should also fall reverently silent, were my princely mandant
    not so dreadfully entreating [uncertain: suffering], for on the [text lost] of this debt the medical
    councillor Cosmar administers all the entailed estates and for 4 years now gives no man little or
    nothing of it, renders no account, and nobody knows where the revenues of these considerable estates
    remain. I must therefore, in the name of my client, beg a most high and most gracious categorical
    decision.


    +whether His Majesty is really minded to pay the debt of 426/m Rthl to the Curian heirs, or whether
    the Prince is to be permitted to settle the matter and to compound, as may still now be done.


    which concerns some 80/m Rthl yearly


    all that the Prince has for


    years received in all only 2500 Rthl instead of 96/m Rthl, and


    [text lost]gert not his incom[text lost].


    In the first case I should most humbly beg that, if His Majesty will pay the debt and acknowledge
    Himself as principal debtor thereto, a most high command be given "that the Cosmar administration
    be at once lifted, and that all moneys be deposited by him"'

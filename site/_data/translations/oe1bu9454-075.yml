segments:
- page: 1
  en: 'To Your Most Serene Highness I most humbly return, with a kiss, the letters of the Count of S.
    most graciously communicated to me. It pleases me that the Count conducts himself so straightforwardly
    in the whole affair, and in the end perceives his own advantage. Only, on the other hand, I grieve
    all too much that in this matter I have once again had to experience a trait dishonouring to humanity,
    and further that the opportunity is taken from me of rendering Your Most Serene Highness a truly [uncertain:
    substantial] service and of gaining for Your Highness some 40 to 50000 Rthl. From Bonn, Reinhardt
    writes that'

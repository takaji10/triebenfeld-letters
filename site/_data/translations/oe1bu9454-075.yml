- page: 3
  en: 'Councillor Krüger that Minister Haugwitz was to be South Prussian Minister. Chełmski has not yet
    appealed, and perhaps the estates may also be leased out along with the rest at Midsummer without
    obstacle. Metzer, as the returning express brings the news from Grävenitz, was not at home, but is
    coming back in 2 days; then the form for the power of attorney, as also the other reports, will follow.
    In deepest reverence I remain, Your Most Serene Highness''s, Breslau, the 1st of April


    1798.


    faithful and most humble servant

    von Triebenfeld'

- page: 2
  en: 'nothing has yet followed concerning the assistance of the fiscal authority — God! how pitiable
    are the [uncertain: Menschl] whose words one may set any belief in. From Mr von Goldbeck in Berlin
    I received a letter yesterday, in which he says: "Up to now many rumours have been current in the
    Residence concerning the South Prussian Department. A few days ago, however, I heard from a reliable
    man that Count von Hoym is keeping it." He writes that His Majesty had been pleased to add to his
    otherwise already very extensive Justice Department the [uncertain: Anabach in Baerautschen] provinces
    as well, and had commanded — that some newer laws be drafted. Heaven knows what there is in all this;
    for about 3 days ago a confidant of Minister Haugwitz, a certain Priebich, passed through here, and
    he firmly assured'

- page: 3
  en: 'the councillor Kruger that Minister Haugwitz was to be South Prussian minister — Chełmski has not
    yet appealed, and perhaps the estates may also be leased out along with the rest at Midsummer without
    obstruction. Melzer, when the returning express brought the news from Gravenitz, was not at home,
    but comes back in 2 days, [uncertain: um] and then the form for the power of attorney will follow,
    as will the other reports. In deepest reverence I remain, Your Most Serene Highness''s Wrocław, the
    1st of April 1798.


    most faithful and humble servant v Triebenfeld'

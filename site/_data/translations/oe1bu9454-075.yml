- page: 1
  en: '75 Your Most Serene Highness, I [uncertain: Tage] most humbly lay again at your feet the letters
    of the Count von S. most graciously communicated to me — It gladdens me that the Count conducts himself
    so straightforwardly in the whole affair, and in the end perceives his own advantage — Only, on the
    other hand, I grieve all too much that in this matter I have once again had to experience a trait
    dishonouring to humanity, and then that the opportunity is taken from me of rendering Your Most Serene
    Highness a truly substantial service and of gaining for you, Most High, some 40 to 50/m Rthl — From
    Bonn Reinhardt writes that'

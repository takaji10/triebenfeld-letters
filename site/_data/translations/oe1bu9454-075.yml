- page: 2
  en: 'nothing has yet come about concerning the assistance of the treasury. God! how pitiable are the
    men [uncertain: people] whose words one may give credence to. From Minister von Goldbeck in Berlin
    I received a letter yesterday, in which he says: Up to now many rumours have been in circulation in
    the Residence concerning the South Prussian Department. A few days ago, however, I heard from a reliable
    man that His Excellency Count von Hoym retains it.


    He writes that His Majesty had, in addition to his otherwise very extensive Justice Department, been
    pleased also to give him the Ansbach and Bayreuth provinces, and had ordered him to draft some new
    laws. Heaven knows what there is in all this. For about 3 days ago a confidant of Minister Haugwitz,
    a certain Priebich, passed through here; he firmly assured'

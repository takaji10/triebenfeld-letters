- page: 1
  en: '43


    Most Serene Prince


    Most gracious Prince and Lord!


    According to a judgment just now received from the Privy Councillor Amelang in Berlin, Lahr has been
    awarded, entirely contrary to the Common Law, cash money instead of papers such as he himself gave,
    and the 3000 Rthl still coming to him are to be paid in [uncertain: Klag]: Courant. In the event that
    I cannot pay or deposit the same, I am to be arrested, since it is a bill-of-exchange suit. Amelang
    has indeed appealed, but how am I to save myself in the meantime? I am truly most unfortunate through
    this affair, and if bounds are not soon set to this distress I must go altogether to ruin. I have
    laboured through a whole year, and have lost health, means and credit thereby. I have also already
    won several advantages for Your Serene Highness thereby. But what is my reward? Hatred, persecution,
    and in the end prison. My inmost being rebels and my heart bursts within me when I do but think this
    thought. I beg and implore Your Serene Highness, pay, as is sacred, to take the matter to heart and
    to provide counsel swiftly, so that the monies may be deposited in cash or in state papers. According
    to the assurance of Grevenitz and Amelang the suit will certainly be won in the Senate of Appeals.
    Lahr must take papers, whereby about 1500 Rthl., approximately, will be saved.


    In this matter Your Serene Highness in the end loses nothing but the costs, which in the course of
    this year have indeed been very much bought up, but have meanwhile paved the way by which everything
    may be brought to the desired end.


    The money for Lahr you will receive back, by order of the French General Government, and the sequestration
    will be lifted at once when [uncertain: inch] this sum, about 10000 Rthl of interest, has been paid.
    To that end I have summoned the justiciary Hawich to come to me here, and shall arrange what is needful
    with him'

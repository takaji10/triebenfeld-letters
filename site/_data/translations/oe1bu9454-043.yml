- page: 2
  en: 'The suit with Oppenheimer is proceeding in the best way, and there one may get off with papers
    and certainly save the half. Let Your Serene Highness only now have pity on me too and provide swift
    counsel for the deposit of the 3000 rtlr., either in cash money or in as much state paper according
    to the exchange rate.


    It is only a great good fortune that I am away from Berlin; and had I not concluded a contract with
    the merchant Michaelis for 600 hundredweight of iron and received 2000 Rthl from him, in order to
    buy myself off to some extent, I should by now be sitting in Berlin in the Hausvogtey gaol. In this
    regard I beseech Your Serene Highness most imploringly by all means to give the 600 hundredweight
    of iron, so that I may keep my word to this man and not be brought to disgrace here as well. If Michaelis
    receives the iron, 300 hundredweight by the end of April and 300 hundredweight by about Midsummer,
    then this man may thereafter be very much relied upon. The distress and the fear that I may be sought
    out here too by Lahr — presses me to the ground; I can say nothing further now than: save me swiftly,
    Your Serene Highness, and do not let me be utterly ruined for my faithful devotion, for the sake of
    your cause, and branded before the world. I remain, until death,


    Your Most Serene Highness''s — Let Your Serene Highness by all means send your letters by express
    messenger to Professor Rhode at Wrocław; he sends such on again from there by express — Only save
    me.


    Konotop


    the 30th of January


    1809


    most faithful servant


    v Triebenfeld'

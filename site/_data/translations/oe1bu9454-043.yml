- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    According to a judgment just now received from Privy Councillor Amelang in Berlin, Lahr has been awarded,
    quite contrary to the territorial law, cash money instead of the papers as he gave them, and the 3000
    Rthl still coming to him are to be paid in hard coin. In the event that I cannot pay or deposit the
    same, I am to be arrested, since it is a bill-of-exchange suit. Amelang has indeed appealed, but where
    do I find rescue in the meantime? I am truly most unhappy through this affair, and if bounds are not
    soon set to this distress I must go utterly to ruin. I have laboured a whole year through, and lost
    health, means and credit in it. I have also already won several advantages for Your Serene Highness
    thereby. But what is my reward? Hatred, persecution, and prison at the end. My inward parts revolt
    and my heart bursts in me when I do but think this thought. I beg and implore Your Serene Highness
    to pay, as is sacred, to take the matter to heart and to provide counsel swiftly, so that the monies
    may be deposited in cash or in state papers. According to Grevenitz''s and Amelang''s assurance, the


    be deposited.


    suit will certainly be won in the Senate of Appeals. Lahr must take papers, whereby some 1500 Rthl
    circa will be saved.


    Your Serene Highness in the end loses nothing in this matter but the costs, which have indeed mounted
    up very much through this year, but have meanwhile paved the way by which everything can be brought
    to the desired end.


    The money for Lahr you will receive back by order of the French General Government, and the sequestration
    will be lifted forthwith once the interest on this sum, circa 10000 Rthl, has been paid. To that end
    I have summoned the justiciary Honrichs to come to me, and shall arrange the necessary with him'

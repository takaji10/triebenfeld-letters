- page: 2
  en: 'The suit with Oppenheimer is going in the best train, and there one can get off with papers and
    certainly save the half. Have mercy now also on me, Your Serene Highness, and provide swift counsel
    for the depositing of the 3000 Rthl, either in cash money or in so much state paper at the rate of
    exchange.


    It is only a great good fortune that I am away from Berlin, and had I not concluded a contract with
    the merchant Michaelis for 600 hundredweight of iron and received 2000 Rthl from him, so as to buy
    myself free to some degree, I should now already be sitting in the Hausvogtey in Berlin. In this regard
    I beseech Your Serene Highness most imploringly to give the 600 hundredweight of iron without fail,
    so that I may keep my word to this man and not come to harm here as well. If Michaelis receives 300
    hundredweight of the iron by the end of April and 300 hundredweight by about Midsummer Day, then great
    reliance may thereafter be placed on this man. The distress and the dread that I may be sought out
    here too by Lahr — presses me to the ground; I can say nothing further now than: rescue me speedily,
    Your Serene Highness, and do not let me be utterly ruined and branded before the world for my faithful
    devotion, for the sake of Your cause. I remain, until death,


    Your Most Serene Highness — Do send Your letters, Your Serene Highness, by all means by express messenger
    to Professor Rhode at Breslau; he then sends them on here again by express — Only rescue me.


    Kontop


    30th January


    1809


    most faithful servant


    v. Triebenfeld'

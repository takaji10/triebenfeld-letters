status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! According to a judgment just now received from
    Privy Councillor Amelang in Berlin, Lahr has been awarded, entirely contrary to the Landrecht, cash
    money instead of papers such as he had given, and the 3000 Rthl still owing to him are to be paid
    in hard coin. In the event that I cannot pay or deposit the same, I am to be arrested, since it is
    a bill-of-exchange suit. Amelang has indeed appealed, but where do I save myself in the meantime?
    I am truly most wretched through this affair, and if bounds are not soon set to this trouble I must
    yet be utterly ruined. I have laboured through a whole year, and lost health, means and credit in
    it. Several advantages have I also already won thereby for Your Serene Highness. But what is my reward?
    Hatred, persecution, and at the end imprisonment. My inmost being revolts and my heart bursts in me
    when I only think this thought. I beg and implore Your Serene Highness pay, what is holy, to take
    the matter to heart and to procure counsel quickly, so that the monies be deposited in cash or in
    state papers. According to Grevenitz's and Amelang's assurance, the suit will certainly be won in
    the Senate of Appeals. Lahr must take papers, whereby some 1500 Rthl circa will be saved. Your Serene
    Highness will in the end lose nothing in this matter but the costs, which through this year have indeed
    been much bought, but have in the meanwhile paved the way whereby everything can be brought to the
    desired goal. The money for Lahr you will receive back by order of the French General Government,
    and the sequestration will be lifted at once as soon as of this sum, circa 10000 Rthl, the interest
    is paid. To that end I have summoned the Justitiarius Honrichs hither to me, and shall arrange the
    necessary with him.
- page: 2
  en: 'The suit with Oppenheimer is on the best course, and there one can get off with papers and certainly
    save half. Let Your Serene Highness only now have mercy on me too, and procure speedy counsel for
    the deposit of the 3000 Rthl, either in cash money or in as much state paper at the current rate.
    It is only a great good fortune that I am away from Berlin; and had I not concluded a contract with
    the merchant Michaelis for 600 hundredweight of iron and received 2000 Rthl from him, so as to buy
    myself off to some degree, I should now already be sitting in Berlin in the Hausvogtey. In this regard
    I most fervently beg Your Serene Highness only to give the 600 hundredweight of iron, so that I may
    keep my word to this man and not come to harm here as well. If Michaelis receives the iron, 300 hundredweight
    by the end of April and 300 hundredweight by about St. John''s Day, then thereafter this man may be
    greatly relied upon [uncertain: paid]. The grief and the anxiety that I may be sought out by Lahr
    here too — press me to the ground; I can now say nothing further than: save me speedily, Your Serene
    Highness, and do not let me, for my faithful attachment, be utterly ruined for the sake of Your cause
    and branded before the world. I remain, until death, as Your Most Serene Highness''s — Do send Your
    Serene Highness''s letters, pray, by express messenger to Professor Rhode at Breslau; he alone forwards
    such again by express hither. — Only save me. Kontop, 30th January 1809, most faithful servant v Triebenfeld'

segments:
- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our gracious greeting first: Honourable,
    dear and faithful subject. In the mortgage matter of the estate Swięcia, it is hereby made known to
    you that if within 14 days the mortgage affairs of this estate and of the remaining estates belonging
    thereto, Kopojno, Drzewce and Zagórów, are not [uncertain: unv] put in order, then the Treasury must
    without fail be moved to proceed against your principal, the Prince of Hohenlohe-Ingelfingen, Your
    Lordship; whereby you are to govern yourself accordingly. We remain graciously disposed towards you.
    Given Kalisz, the 18th of November 1800. Royal South Prussian Government. Meuser [uncertain: Meuser]


    To the Princely Hohenlohe Building and Economy Councillor Glenck at Breslau


    Fee 1 Rthl 2 Groschen, stamp 6 Groschen


    Copy 8 Groschen


    [uncertain: Bol] 3 Groschen


    Schleyer


    No. 2092'

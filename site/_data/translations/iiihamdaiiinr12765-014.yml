- page: 1
  en: 'Poznań, 2 November 1815.


    By the order of 6 June of this year Your Serene Highness transmitted to me two letters of the Prince
    of Hohenlohe, to Your Serene Highness and to His Excellency the Minister Baron vom Stein, of 12 May


    of this year, with the command that I express myself upon the steps which would have to be taken in
    favour of this Prince with the Imperial Russian cabinet.


    The Prince of Hohenlohe received from His Majesty the late King, as a gift, the estates of Kolno and
    Kamionna in the Poznań country, and the estates of Trąbczyn in the Kalisz department. Both estates
    were formerly the property of the Starost Prusimski, who had been implicated in the insurrection in
    the year 1794, and had fallen to the State by confiscation.


    The estates of Kolno and Kamionna the Prince sold to the bank cashier Leixner before the year 1806.
    The Trąbczyn ones, however, he did not. All the estates have, through the political events of the
    years 1806/7, passed back to the heirs of the former owner, with whom, in these circumstances, they
    remain under the Vienna treaty of 3 May of this year; against which His Majesty is inclined to compensate
    the donees for their loss.


    After the Prince of Hohenlohe had communicated with me variously concerning this compensation, partly
    by word of mouth through


    [Written by the receiving office:]


    c. 3,278 fr: Paris 18 Nov 1815. To Councillor of Legation Balan. The estates of Kolno and Kamionna,
    which lie in the Grand Duchy of Posen, no longer belong at all to the Prince of Hohenlohe, since he
    already sold them in the year 1805 for 142,000 Rthl to the bank cashier Leixner, for whom the state
    of possession has also long since been put in order. There is no ground whatever on which the Prince
    can be mixed into this affair; his Mandatoris, the deceased von Triebenfeld, also appears to have
    interested himself in it out of pity for Leixner, who has in the meantime likewise died. This matter
    will now be brought up particularly through the HauptAmt, as Inselung of the intabulated capitals,
    and it just comes down for me to this:


    that the Royal Ministry of Foreign Affairs for many Princes of Hohenlohe on account of the Trąbczyn
    estates no [illegible]. Most [uncertain: Meisten]. court; this matter is therefore to issue again
    to Mr Gericht Jordan, on 13 April St[ä]g[emann].'

- page: 2
  en: 'the councillor of war von Triebenfeld, partly in writing by letters devoid of content, a certain
    Schenck has at last come forward as his authorised representative, and has deduced to me from a volume
    of accounts that a compensation of 318,500 Rthl. is due to the Prince for the loss of the Trąbczyn
    estates, and that this could best be made good by the domain office of Sokolnik, lying in Poland close
    against the frontier, which pays 15,000 Rthl. a year in rent. The Prince moves that it be procured
    with the Russian cabinet that this domain office be conferred upon him heritably by His Majesty the
    Emperor.


    In respect of the estates of Kolno and Kamionna the authorised representative acknowledges that the
    compensation would doubtless have to be demanded in the first place by Leixner as owner.


    The calculations laid before me are full of nonsense and loathsome to read. The Trąbczyn estates can
    originally hardly have had a third of the value of the domain office of Sokolnik; they have been run
    down by the Prince and loaded with debts. I scarcely believe that he has any compensation left to
    demand.


    This being the posture of the affair, what can be done on the part of our cabinet, without compromising
    itself, to set the Prince of Hohenlohe''s mind at rest would reduce itself to this:'

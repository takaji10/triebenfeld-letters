- page: 3
  en: '"to move the Imperial Russian cabinet to the resolution of compensating the Prince for the loss
    of Trąbczyn," and thereafter to leave it to His Serene Highness himself


    to settle with the Russian authorities themselves: for what they are to be compensated, and in what
    manner they are to be compensated? The original letters transmitted to me and mentioned at the opening
    of this report I return most humbly. Poznań, 2 November 1815. Zerboni di Sposetti


    To His Serene Highness the Royal Prussian State Chancellor the Prince of Hardenberg at


    Paris'

- page: 1
  en: 'Berlin, 30 May 1803


    To the Chamber at Poznań.


    [H.?]


    for the kind countersignature of His Royal Minister of State etc. von Voss, Excellency, in draft and
    fair copy


    8 June of this year, sent by post.


    Friedrich Wilhelm


    In the copy enclosed We send you the cabinet order issued on the 10th of this month, by which the
    former Starost Anton von Prusimski and the former canon Xaver von Jezierski are granted leave to return
    to their fatherland, and command you now to have both take the oath of allegiance, and to report here
    how it has been done.


    Sind etc.


    Berlin, 30 May 1803.


    By command:


    [M?] Haugwitz'

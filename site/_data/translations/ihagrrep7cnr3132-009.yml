segments:
- page: 1
  en: 'Berlin, 30 May 1803


    To His Royal Minister of State etc. von Voss, Excellency.


    [H?]


    His Royal Majesty having been pleased, by cabinet order of the 10th of this month, most graciously
    to grant the former Starost von Prusimski and Xaver von Jezierski the leave they asked for to return
    to their fatherland, I do not fail to bring this to Your Excellency''s closer knowledge through the
    copy enclosed, and leave it most obediently to you whether you will be pleased to countersign the
    notificatorium on this matter to the Chamber at Poznań, enclosed in draft and fair copy.


    Berlin, 30 May 1803'

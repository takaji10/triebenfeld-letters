  en: '186


    Dear Friend!


    The business with Mr Weigelt is as good as settled — he sent me his consent yesterday evening — and
    asked me to come in here today, or, in case I should permit it, he would spend the Thursday with me
    at Świniary — I have accepted the latter and have asked him out to me tomorrow for a [uncertain: Seyen].
    I now lack the means [uncertain: manche] to entertain the old gentleman properly and to warm the [uncertain:
    Herrn]. It is solely for the good of our upright Prince, and therefore I put you, [uncertain: Herzer]
    friend, under requisition — and beg for a bottle of old [uncertain: Mihn] wine and for a bottle of
    really good old sweet Hungarian Ausbruch, as also for 6 peaches and 2 bunches of grapes — Everything
    else I have I have I came in here expressly for this purpose — Should my note not find you today,
    do be sure to send the wine and the fruit out to me. Ever I remain, Wrocław


    the 29th of Aug.


    1810.


    Your true friend and servant


    v Triebenfeld'

segments:
- page: 1
  en: 'Dear Friend!


    The matter with Mr. Weigel is as good as settled — he sent me his agreement yesterday evening — and
    asked me to come in here today, or, in case I permitted it, he would spend Thursday with me at the
    [uncertain: Schweineren] — I have accepted the latter and have asked him out to me tomorrow [uncertain:
    for a Seyen]. I now lack various things for entertaining the old gentleman properly and warming up
    the [uncertain: gentleman]. It is for the sole good of our worthy Prince, and therefore I put you,
    dearest friend, under requisition — and beg for a bottle of old [uncertain: Mihn] wine and for a bottle
    of really good old sweet Hungarian Ausbruch, likewise for 6 peaches and 2 bunches of grapes — everything
    else I have; I have come in here expressly on that account. — Should you not meet with my note today,
    do be sure to send me the wine and the fruit out. Ever I remain


    Breslau


    the 29th of August


    1810.


    Your true friend and servant


    v. Triebenfeld'

- page: 1
  en: 'The Illustrious Górski, Boundary Surveyor of Inowrocław, against the Illustrious Chełmski, Treasurer
    of Wschowa — a Manifest is lodged


    Having come in person to the present Office and Records of the Konin Municipal Court, the Illustrious
    Jakub Górski, Boundary Surveyor of the Inowrocław Palatinate, adhering to the new law concerning the
    effectuation of decrees in settled matters, and also insisting upon the other laws enacted concerning
    judicial security and authority, and looking to judicial security — solemnly, before the same Office
    and its Records, in and against the Illustrious Stanisław Ścibor Chełmski, Treasurer of Wschowa, Heir
    of the estates of Łukom with appurtenances — a Manifest is lodged, for this reason: Because the Manifesting
    [party], for the Term of the Field Condescension between the estates of Trąbczyn minor or Nowa Wieś,
    of the Illustrious Magnificent Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanislaus,
    and [the estates of] Łukom, the hereditary [property] of the above-mentioned Illustrious Chełmski
    — [said Term] assigned by the Crown Tribunal Post-Commissorial Decree at Piotrków, on Wednesday after
    the Feast of Saint Agnes, Virgin and Martyr, namely the 23rd day of the month of January in the present
    year, between the above-mentioned Parties, after the boundary cause was decided from the map and two
    Commissorial Decrees issued discrepantly and contrary to each other were resolved, in the matter of
    the erection of boundary mounds — having been obtained [at the instance of] the Illustrious Magnificent
    Prusimski: when he descended to the site for the Term of that Condescension, wishing to bring to effect
    [the decree] according to the prescription of that same Tribunal Decree and the line placed on the
    map by the Tribunal — that Tribunal Decree, being a Post-Commissorial [decree], not subject to any
    interpretation or relief pursuant to the new law of the Year 1776, enacted concerning Post-Commissorial
    Causes and Decrees — and intending to complete and effectuate the other contents according to the
    rule of the same Tribunal Decree and the line placed and subscribed on the map by the Tribunal:


    the Illustrious Chełmski, Heir of the estates of Łukomia, personally himself with his retinue, rebelliously
    obstructed the further effectuation of the Post-Commissorial Tribunal Decree of the last instance
    and also the judicial [process] hedged about by so many laws — and pushed away the man drawing the
    geometric chain, and kicked it out of the line with his foot — and began to threaten — and also, responding
    to the judicial interrogation of his Office, declared himself judicially as not admitting the further
    laying of the Line to be carried out by the Geometer and his Office.


    For which reason his Office, avoiding any danger, this rebellious obstruction notwithstanding, was
    obliged to suspend itself from any further act and from the execution and effectuation of the above-mentioned
    Tribunal Decree — and suspended [proceedings] for the purpose of obtaining military [assistance] from
    the Illustrious War Department.


    Therefore his Manifesting [party], having recourse to the Laws of the Kingdom with respect to all
    the above-mentioned matters and notably this kind of rebellious obstruction and denial, manifests
    again and again — saving all that is to be saved by law.


    Jakub Pomian Górski, Boundary Surveyor of the Inowrocław Palatinate'

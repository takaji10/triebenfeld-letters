- page: 2
  en: 'let much be heard of himself — One of his most important declarations is that he means to reinstate
    the estates, to give them back their prerogatives, and to yield nothing to the King of Bavaria — Gärtzer
    thinks he is afraid of insurrection, or that it is not far before his end. General von Köckritz has
    asked for his discharge, and has received the same. The King leaves him his whole salary until his
    end; he also remains [uncertain: chief] of the Jäger Corps. At this moment I receive a letter from
    your Court Councillor Hahn which has truly cast me into the deepest sorrow.


    Mr Court Councillor says that the officials are to give a statement of the revenues of the entailed
    estates, and that in this there come out [uncertain: Baum] half as much in revenues as Your Serene
    Highness has indicated to me — If this is not a well-considered trick of the officials, then that
    would be dreadful, for how and whence should the advance of 112 Rthl then be met? I am truly quite
    disheartened — It will admittedly not now be conceded that Prince August of Wartemberg should receive
    the 100000 Rthl, still less the 18000 Rthl yearly, and that already affords a secure fund — but the
    [uncertain: mortal] man has no contract as to the length of his life. Meanwhile I will only see what
    the report from Brieg contains and what impression it will make here — if only Cosmar''s poison-fangs
    are broken out, if he loses the writ of execution and his influence over the entailed estates, then
    the settlement of 1811 collapses of itself — and if he must hand over the Adolphine revenues to the
    [uncertain: Papellen] Colleges, then Monsieur Satanus will fetch him forthwith — and the gentlemen
    officials too will afterwards be well questioned as to their arts — In deepest reverence I remain,
    until death, Your Serene Highness''s


    Vienna, the 20th of January


    1815


    faithful, humble and obedient servant


    v Triebenfeld'

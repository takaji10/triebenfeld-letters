- page: 3
  en: '268 a) Tomorrow I shall be metamorphosed — I shall have a [uncertain: dress coat], a greatcoat,
    boots and linen, and may at least show myself again. The business costs 926 gulden — 1,100 I received,
    so consequently all is gone — and no evening passes without a couple of friends from the bureau coming
    to me. I therefore beg, for all mercy''s sake, to send me the 200 ducats as speedily as it is in the
    world possible, for otherwise I am given over to every shame and mockery — I want for everything;
    nor have I seen anyone here of other people, let alone one of the reigning gentlemen, except the King
    of Württemberg — the friends from the princely house, without whom I could not lure a dog from the
    stove, I must always receive well, and that nevertheless costs much — the 100 # advanced to me by
    Prince Hardenberg I must absolutely pay back quickly and soon, for the Privy Councillor of Legation
    Jordan has already dunned me for it quite mockingly — I beg Your Serene Highness therefore, for God''s
    mercy''s sake, send, and if it could be by express courier, the 200 #; the affair is now in full train
    and goes well — but I should have to grow weary if I do not, as I write, receive the 200 # to pay
    off the debts — On this the old gentleman looks very hard v Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I received yesterday a most highly honoured letter of Your Serene Highness together with the enclosures
    and 1125 fl in paper money — the two letters to His Majesty and to the Prince State Chancellor I delivered
    at once — also had written, upon 2 [uncertain: Menquets], the 2 letters herewith enclosed, namely
    one to the Gentleman General von Schöler and the 2nd to the Privy Councillor of State Stägemann. Likewise
    I have handed over the written undertaking to B:. Now I await longingly the report from Brieg, and
    likewise the answer of Count von Pourtales. Were the report drawn up as Eberhardt writes, then it
    is already favourable enough. The Prince Chancellor will surely not spare the favourite of Mr von
    Kirch: Es — If Cosmar is removed from office, and the 112000 Rthl are given up for the satisfaction
    of the Kur: heirs, then everything further will resolve itself without difficulty — what now gives
    me sorrow is the Trąbczyn affair; most probably this corner of the earth will after all fall to Russia,
    and there the [uncertain: aprons] are everything — I am therefore beginning to have the Emperor worked
    upon through the Gentleman General von Schöler. The General stands in high favour with His Majesty.
    In general, whatever is to be done must all be done quickly, for there is very strong talk here of
    war — In the cabinets an unbelievable activity prevails, but everything is kept exceedingly secret
    — the Congress, it is said, may well last a couple of months more, but if the thing degenerates into
    discord it can just as well be broken off as quick as lightning; at court one is said no longer to
    see such cheerful faces as at the beginning. Our Most Gracious King and Lord dines almost always alone,
    and likewise he always goes walking alone and solitary. Why the King of Würtemberg has left Vienna
    and the Congress one cannot make out with certainty. He has meanwhile already'

- page: 2
  en: 'let a good deal be heard from him — One of his most important declarations is that he means to
    reinstate the Estates, to give them back their prerogatives, and to yield nothing to the King of Bavaria
    — Gärtner thinks he is afraid of insurrection, or else that his end is not far off — General von Köckritz
    has asked for his discharge, and has received it. The King leaves him his entire salary until his
    end, and he also remains Chief of the Jäger Corps — At this very moment I receive a letter from your
    Court Councillor Hahn — which has truly plunged me into the deepest sorrow —


    Mr Court Councillor says that the officials are to furnish a statement of the revenues of the entailed
    estates, and that in this barely half as much revenue comes out as Your Serene Highness has indicated
    to me — If this is not a well-considered trick of the officials, then it would be dreadful, for [uncertain:
    from what] and when should the advance of 112/m Rthl. then be discharged? I am truly quite disheartened
    — It will of course not now be conceded that Prince August receives, after Syców, the 100,000 Rthl,
    still less the 18,000 Rthl yearly, and that already affords a secure fund — but [uncertain: mortal]
    man has no contract for the length of his life — Meanwhile I only wish to see what the report from
    Brzeg contains and what impression it will make here — if only Cosmar''s [uncertain: poison-fangs]
    are broken out, if he loses the executory power and his influence over the entailed estates, then
    the settlement of 1811 falls apart of itself — and if he must hand over the Adolph revenues to the
    Board of Wards, then Monsieur Satanus will carry him off forthwith — and the gentlemen officials too
    will afterwards be questioned closely about their arts — It is in deepest reverence that I remain,
    until death, Your Serene Highness''s


    Vienna, the 20th of January


    1815


    faithful, humble and obedient servant


    v Triebenfeld'

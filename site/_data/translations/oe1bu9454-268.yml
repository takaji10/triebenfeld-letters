  en: '268


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness''s most highly [uncertain: esteemed] letter I received yesterday, together with
    the enclosures and 1,125 gulden in paper money — the two letters to His Majesty and to the Prince
    State Chancellor I delivered at once — and on 2 blank sheets I had the 2 accompanying letters written,
    one to General von Schöler and the 2nd to the Privy Councillor of State Stägemann. Likewise I have
    handed over the written undertaking to B[arbe]. Now I await most longingly the report from Brzeg,
    and also the reply of Count von Pourtalès. If the report has been drawn up as Eberhard writes, then
    it is already favourable enough. The Prince Chancellor will assuredly not spare the favourite of His
    Excellency von Kirch: — If Cosmar is removed from office, and the 112/m Rthl are given up for the
    satisfaction of the Cur[ische] heirs, then everything further will settle itself without difficulty
    — what now causes me grief is the Trąbczyn affair; most probably this corner of the earth will after
    all fall to Russia, and there the aprons count for everything — I am therefore beginning to have the
    Emperor worked upon through General von Schöler. The General stands in high favour with His Majesty
    — In general, whatever is to be done must all be done quickly, for here there is very strong talk
    of war — In the cabinets an unbelievable activity prevails, but everything is kept in the utmost secrecy
    — the Congress, it is said, may well last another couple of months, but if the thing degenerates into
    discord it can also be broken off just as quick as lightning — at court, they say, one no longer sees
    the cheerful faces one saw at first. Our Most Gracious King and Lord dines almost always alone, and
    likewise he always goes walking alone and solitary. Why the King of Württemberg has left Vienna and
    the Congress is not to be [uncertain: deciphered] with any certainty. He has, however, already'

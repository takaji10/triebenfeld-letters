- page: 3
  en: '268 a) Metamorphosed I shall be tomorrow — A [uncertain: Frade], a greatcoat, boots together with
    linen I shall have, and shall at least be allowed to show myself again. The business costs 926 fl.
    — 1100 I received, consequently all is spent, and no evening passes without a couple of friends from
    the Bureau coming to me. I therefore beg, for all mercy''s sake, that you send me the 200 ducats as
    speedily as it is in the world possible, for otherwise I am given up to every shame and mockery —
    I lack everything; nor have I here seen anyone of other men, let alone one of the reigning lords,
    except the King of Wartemberg — the friends from the princely House, without whom I could not lure
    a dog from the stove, I must always receive well, and that nevertheless costs much. The 100 ducats
    advanced to me by Prince Hardenberg I must absolutely pay back quickly and soon, for the Privy Legation
    Councillor Jordan has already dunned me for it quite mockingly. I therefore beg Your Serene Highness,
    for God''s mercy''s sake, send, and if it could be by express courier, the 200 ducats; the matter
    is now in full work and goes well — but I should have to tire if I do not [uncertain: write] receive
    the 200 ducats in order to pay off the debts — On this the old gentleman is looking very strongly.
    v Triebenfeld'

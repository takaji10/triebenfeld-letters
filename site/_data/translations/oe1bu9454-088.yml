- page: 2
  en: 'I am, in the purity of my intention and in the unfalsified presentation of my documentary proofs,
    all but resolved to convince His Majesty that the exchange I have proposed did not rest upon those
    self-interested designs which would indeed be the case were one to judge the matter according to the
    report submitted by Your Excellency and communicated to me by His Majesty the King. Of Your Excellency''s
    magnanimous sentiments I therefore hold myself assured, that Your Excellency will as fully approve,
    and, so far as it depends upon your own conviction, support, those further steps which I am obliged
    to undertake for the sake of my [uncertain: aggrieved] sense of honour and of my Monarch''s love of
    justice; whereby I sincerely assure you that I am, with sentiments of the most perfect esteem, Your


    Breslau, the 8th December 1798'

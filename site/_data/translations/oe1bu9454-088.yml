    Copy


    To the Minister von Voss


    Right Honourable Sir, From Your Excellency''s obliging letter of the 1st of this month I have perceived
    the grounds which have moved you not to concur in the manner desired with the exchange of my South
    Prussian estates for the district of Krotoszyn, which I laid before His Majesty the King, and in which,
    according to the declaration I have already submitted, I have by no means reckoned Polajewo.


    Were I not convinced that those grounds rested solely upon the reports and findings submitted to Your
    Excellency in this matter by the commissioners, and not upon your own conviction as to the true condition
    of the district of Krotoszyn, then I should not so greatly revere, as in truth I do, the patriotic
    zeal with which Your Excellency has so conscientiously attended here to the royal interest; for according
    to the intelligence I have obtained, and according to Your Excellency''s own utterances in former
    times, I am assured that the commissioners have in the present case assumed and reckoned more for
    Krotoszyn than will come to light upon an impartial investigation by men expert in the matter. In
    view of the manifold assurances which His Majesty the King has deigned to give me of his most gracious
    benevolence, and for the proving of which he has only awaited an occasion, I should therefore not
    hold it consonant with my duty were I to acquiesce in the grounds set up against my petition; rather'
- page: 2
  en: 'I am, in the purity of my intention, and in the unfalsified presentation of my proofs drawn from
    the records, almost resolved to convince His Majesty that the exchange I have proposed had not at
    its foundation those self-interested designs which would indeed be the case if one were to judge the
    matter according to the report submitted by Your Excellency and communicated to me by His Majesty
    the King. Of Your Excellency''s magnanimous sentiments I hold myself therefore assured, that you will
    as fully approve, and, so far as it depends upon your own conviction, support those further steps
    which I am obliged to undertake for the sake of my [uncertain: wounded] sense of honour and of my
    monarch''s love of justice, as I sincerely assure you that I am, with sentiments of the most perfect
    esteem, Your


    Wrocław, the 8th of December 1798'

  en: 'Copy


    To Minister von Voss


    Right Honourable Sir, From Your Excellency''s obliging letter of the 1st of this month I have perceived
    the grounds which have moved Your Excellency not to assent in the desired manner to the exchange of
    my South Prussian estates against the district of Krotoszyn which I laid before His Majesty the King
    in my application, and in which, according to the declaration I have already submitted, I have by
    no means included Polajewo.


    Were I not convinced that those grounds rest solely upon the reports and findings submitted to Your
    Excellency in this matter by the commissioners, and not upon Your Excellency''s own conviction of
    the true condition of the district of Krotoszyn: then I should not so greatly revere, as in truth
    I do, the patriotic zeal with which Your Excellency has so conscientiously attended to the Royal interest
    herein; for according to the intelligence I have obtained, and according to Your Excellency''s own
    utterances in former times, I am assured that the commissioners have in the present case assumed and
    reckoned more for Krotoszyn than will come to light upon an impartial investigation by expert men.
    Given the manifold assurances which His Majesty the King has deigned to give me of His Most High gracious
    benevolence, and to make good which He has only awaited an opportunity, I should therefore not hold
    it consonant with my duty were I to rest content with the grounds set against my petition; rather'

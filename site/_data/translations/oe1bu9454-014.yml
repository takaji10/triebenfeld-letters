- page: 1
  en: 'Solve me this riddle, dearest friend: why has the [uncertain: State] not yet, all this long while,
    given any decision upon the complaint of the Prince zu Hohenlohe? and if it has been done, why has
    the Prince received no notice of what has been done? By the last post private intelligence has come
    in from Berlin that, in consequence of this complaint, an investigation has already been set on foot
    before the Kurmärkisches Board of Wards against [uncertain: Cremne]; to us this is incredible – this
    measure would not lead to the purpose, but would enlarge the evil under which the Prince is sinking,
    and not lift it, inasmuch as Cosmar would only then all the more properly [uncertain: inquire] set
    himself to rob the Prince not only of all Sententation, but also to retain the rent in arrears since
    the year 1812 for the purpose of satisfying the creditors. With regard to the ducal Karl debt, my
    endeavour to compose this matter has failed; the General Mandataries have for the present rejected
    any and every composition, and that upon the ground that the Justice-Councillor Bennebirg in Berlin,
    who now prosecutes this affair cst Fucum, was informed shortly before the departure of the King''s
    Majesty that the settlement of this affair should remain suspended until also the [uncertain: Völlehr]
    from Vienna. Had I myself been in Vienna, I should certainly have regulated this matter, since the
    Princesses are precisely there; only there could the matter have been composed, since the 3 heirs
    were just then [uncertain: absent/present]. Contribute what lies in your power, that the King''s Majesty
    may not merely advance this debt, but take it over entirely, and thereby indemnify the Prince for
    the privations suffered since the years 1806; wherein however it is not to be forgotten that the Prince
    is besides that also also indebted to the King in 35000 Rthl, which might well likewise be remitted
    to him. Should, however, a composition concerning the Curian debt still be possible in the future,
    then I beg you, friend, to let me have a hand in it. Infinitely shall I rejoice to know myself soon
    again honoured with a letter from you, but still more agreeable will it be to me to speak with you
    upon your return from Vienna, and to be able to repeat to you by word of mouth the unalterable veneration
    with which I am your most faithfully devoted

    Brzeg, the 21st of February 1815

    Eberhard

    N.B. I hold this to be a mere alarm-shot – for here nothing has been decided. They must be lies. If
    only it were possible that Eberhard could come here quickly, I myself believe with confidence that
    he would compose the matter here, for the 3 weeks are in the utmost extremity.'

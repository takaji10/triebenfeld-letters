  en: '14 Solve me this riddle, dearest [uncertain: Theuerstag] friend: why has the State [text lost:
    Staats lang durch] still not made any disposition upon the complaint of the Prince of Hohenlohe? And
    if it has been done, why has the Prince received no notice of what has been done? By the last post
    a private report came in from Berlin, that in consequence of this complaint an investigation has already
    been set in train against Cosmar before the [uncertain: Thurmard] Wards'' Board; to me this is incredible
    — such a measure would not answer the purpose, but would enlarge the evil under which the Prince is
    sinking, and not remove it, inasmuch as Cosmar would only then properly [uncertain: inquiri] to rob
    the Prince not merely of all maintenance, but also to withhold the rent outstanding since Midsummer
    1812 for the satisfaction of the creditors. With regard to the ducal Karl debt my endeavour to compose
    this matter has failed; the general mandataries have rejected any and every composition for the present,
    and that on the ground that the councillor of justice Henneberg in Berlin, who is now prosecuting
    this business [uncertain: cst] the Treasury, was informed shortly before the departure of His Majesty
    the King that the settling of this business should be held over until also the [uncertain: Völlehr]
    from Vienna. Had I myself been in Vienna, I should certainly have regulated this matter, since the
    Princesses are there just now; only there could the matter be composed, the 3 heiresses being just
    then present. Contribute what lies in your power, so that His Majesty the King may not merely advance
    this debt but take it over entirely, and thereby indemnify the Prince for the privations suffered
    since the year 1806 — wherein, however, it is not to be forgotten that the Prince also, besides this,
    owes the King 35,000 Rthl, which might well likewise be remitted to him. Should, however, a composition
    regarding the Courland debt still be possible in future, then I beg you, friend, to let me have a
    hand in it. Infinitely shall I rejoice to know myself soon again honoured by you with a letter, but
    it will be still more agreeable to me to speak with you on your return from Vienna, and to be able
    to repeat to you by word of mouth the unalterable veneration with which I am your


    most faithfully devoted


    Eberhard


    Brzeg, the 21st of February 1815


    NB I hold this to be a shot fired to frighten us — for here nothing has been


    disposed. They must be lies. If it were only possible that Eberhard could come here quickly, I even
    believe for certain that he would compose the matter here, for the 3 weeks are in the utmost extremity'

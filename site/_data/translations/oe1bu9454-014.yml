segments:
- page: 1
  en: 'Solve me the riddle, dearest friend: why has the [uncertain: State] for so long still not issued
    a ruling on the complaint of the Prince of Hohenlohe? and if it has been done, why has the Prince
    received no notice of what has been done? By the last post private intelligence has come in from Berlin
    that, in consequence of this complaint, an investigation has already been set in train before the
    Thurmard Wards'' Board against the Cremne; to us this is incredible – this measure would not serve
    the purpose, but would enlarge the evil under which the Prince is sinking, and not remove it, inasmuch
    as Cosmar would only then truly [uncertain: inquire], not merely to rob the Prince of all [uncertain:
    Sententation], but also to hold back the rent in arrears since the year 1812 for the purpose of satisfying
    the creditors. With regard to the ducal Karl debt, my endeavour to compose this matter has failed;
    the general mandataries have for the present rejected each and every composition, and that for the
    reason that the councillor of justice Bennebirg in Berlin, who is now prosecuting this business [uncertain:
    cst Fucum], was informed shortly before the departure of His Royal Majesty that the settling of this
    business should be left in suspense until also the [uncertain: Völlehr] from Vienna. Had I been in
    Vienna myself, I should certainly have regulated this matter, since the Princesses are precisely there;
    only there could the matter have been composed, as the 3 heirs were just then [uncertain: absent].
    Contribute what lies in your power, that His Royal Majesty may not merely advance this debt but take
    it over entirely, and thereby indemnify the Prince for the privations suffered since the years 1806,
    wherein however it is not to be forgotten that the Prince also besides that owes the King 35000 Rthl,
    which might well also be remitted to him. Should, however, in future a composition on account of the
    Courland debt still be possible, then I beg you, friend, to let me have a part in it. Infinitely shall
    I rejoice to know myself soon again honoured by you with a letter, yet more agreeable to me will it
    be to speak with you on your [uncertain: return] from Vienna, and to be able to repeat to you by word
    of mouth the unalterable veneration with which I am your most faithfully devoted


    Brieg, the 21st of February 1815


    Eberhard


    NB I hold this to be a warning shot – for here nothing has been


    ordered. They must be lies. If it were only possible that Eberhard could come here quickly, I even
    believe with confidence that he would compose the matter here, for the 3 weeks are in the utmost extremity.'

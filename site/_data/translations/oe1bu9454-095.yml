  en: 'villains, foremost among whom stands the one above — whatever has been told to Your Serene Highness
    about the division of the department and about other knowledge of your affair, these are the coarsest
    lies — Rather, in the last moment before the departure was made, the plan was laid with B that a hard
    refusal should follow — but of this the explanation by word of mouth — now may Your Serene Highness
    be pleased indeed to follow my counsel — for I think always — though many a wretched creature can
    be of no help to me at all, yet he can do me harm; the truly good Monarch is indisposed, and therefore
    there is at present no audience for the presentation of business, otherwise I should be at the very
    edge of it directly, but for this I must still wait — [uncertain: in the meantime it grieves me greatly]
    because I tremble constantly whether Mr von Voss may not turn the matter about anew, and see to it
    that other'

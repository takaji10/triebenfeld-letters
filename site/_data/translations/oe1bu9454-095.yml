- page: 3
  en: 'false representations are put forward — the King means well by all; if so much erroneous stuff
    is laid before him, then the gentleman must in the end act against his own interest. The secularisation
    business is in a wide field, and seems to me to be a [uncertain: morsel] thrown out by the French,
    at which one is to snap and [uncertain: glut oneself] — People believe in a peace with the Emperor
    and the French — These are, however, only ideas. In deepest reverence I remain, until death, Your
    Most Serene Highness''s — Before I come, Your Serene Highness will receive an express courier, and
    then the same may write at once concerning the leave — Berlin, the 29th of December 1798


    faithful and most humble and obedient servant


    von Triebenfeld'

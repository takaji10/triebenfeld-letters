segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    The worthy Colonel von Köckritz has charged me to commend him most cordially to Your Most Serene Highness
    and to assure the same, in all humility, that the estate-exchange business stood exceedingly well,
    so that it might be regarded as concluded in the best manner — Joy shone in the noble man''s eyes
    as he gave me this commission; he himself will not write until everything has been done — the Privy
    Councillor of the Cabinet assures me outright that here he must act against his heart (contre coeur)
    – but the sovereign would have it so — Each of these is nonetheless an upright man, for through him
    I have come to know the Breslau way of thinking – By God, there are such'
  names:
  - de: Köckritz
    en: Köckritz
    kind: person
  - de: Breslauschen
    en: Breslau
    kind: place
- page: 2
  en: 'villains, among whom the one stands at the very top — whatever has been said to Your Serene Highness
    about the division of the department and about other knowledge of your affair is the grossest of lies.
    Rather, at the last moment before the departure the plan was laid with 6, that a hard refusal should
    follow — everything by word of mouth about it, the resolution now; may Your Serene Highness be pleased
    indeed to follow my counsel – for I think always thus: though many a wretched creature may be of no
    help to me, still the truly good monarch can [text lost]


    harm is indisposed, therefore there is no audience-report at present, otherwise I should be at the
    very edge at once, but for this I must yet wait — meanwhile it troubles me greatly, because I am forever
    trembling whether Mr. von V. does not set the matter spinning anew and see to it that other'
  names:
  - de: H. v V.
    en: Mr. von V.
    kind: person
  numbers:
  - '6'
- page: 3
  en: 'incorrect representations are laid before him – the King means well by all; if so much erroneous
    stuff is brought before him, then the gentleman must in the end act against his own interest. The
    secularisation business is in the wide open field, and seems to me to be a loaf that the French throw
    out, after which one is to snap and pasture oneself. It is believed there will be a peace with the
    Emperor and the French.


    These, however, are but notions.


    In deepest reverence I remain, until death, Your Most Serene Highness''s. Before it comes, Your Serene
    Highness will receive an express courier, and then the Most High may write at once concerning the
    leave of absence - Berlin, the 29th of December 1798


    faithful, most humble and obedient servant


    von Triebenfeld'

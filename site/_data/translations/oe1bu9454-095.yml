status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The worthy Colonel v. Köckritz has charged me to commend
    him most cordially to Your Most Serene Highness, and to assure the same, most [uncertain: submissively],
    that the Quiet exchange business stood exceedingly well, indeed might be regarded as concluded in
    the best manner — Joy shone from the noble man''s eyes as he gave me this commission; he himself will
    not write until everything has been done — the G. C. R. assures me outright that he must act here
    contre Coeur — but the Sovereign would have it so — Each of them is nonetheless an honest man, for
    through him I have come to know the Breslau cast of mind — By God, there are'
- page: 2
  en: 'villains, among whom the one stands foremost from the top down. When Your Serene Highness has been
    told of a division of the Department and of other knowledge of your affair, these are the grossest
    lies — Rather, at the last moment, before the departure was made, the plan was laid with 6 that a
    hard refusal should follow — each of it orally, the disclosure thereof; now may Your Serene Highness
    be pleased to follow my counsel — for I think always: though many a wretched creature can do me no
    good at once, yet he can [do me] harm; the truly good Monarch is indisposed, and therefore there is
    no audience at present; otherwise I should be at the edge at once, but for this I must still wait
    — meanwhile it [uncertain: troubles] me greatly, because I tremble constantly whether H. v V. does
    not once again twist the matter and see to it that other'
- page: 3
  en: false representations occur — the King means well by all; if one lays before him so much erroneous
    stuff, then the gentleman must in the end act against his own interest. The Secular business is in
    the wide field, and seems to me to be a piece of bread which the French throw out, after which one
    is to snap and be pastured. People believe in a peace with the Emperor and the French. These are,
    however, only ideas. In deepest reverence I remain, until death, Your Most Serene Highness's — Before
    this comes, Your Serene Highness will receive an express courier, and then may the same write at once
    concerning the leave of absence — Berlin, the 29th of Xbr 1798, faithful most humble and obedient
    servant v Triebenfeld

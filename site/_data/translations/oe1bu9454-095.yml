    Most Serene Prince


    Most gracious Lord!


    The worthy Colonel von Köckritz has charged me to commend him most cordially to Your Most Serene Highness
    and to assure the same most humbly that the [uncertain: Quest] exchange business stood exceedingly
    well, so that it might be regarded as concluded in the best manner — The joy shone from the noble
    man''s eyes as he gave me this commission — He himself will not write until everything has been done
    — the Privy Cabinet Councillor assures me outright that here he must act against his heart — but the
    sovereign would have it so — Still, this is an honest man, for through him I have come to know the
    Wrocław way of thinking — By God, there are'

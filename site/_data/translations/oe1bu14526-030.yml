- page: 2
  en: 'von Rząkowski married couple and their Successores bind themselves to pay 130 fl. Polish in two
    instalments, namely on the feast of St John the Baptist 65 fl. and on the feast of the Holy Three
    Kings the poll-tax, and to deliver the Hibern (money for the soldiers in winter) punctually to the
    commune according to custom; they shall be likewise bound to be sent, together with the commune, to
    the compulsory labour on the Głazewo demesne farm four times in the year, and likewise to the clearing
    of the meadow called Obsko, which has been added to this demesne farm by right. For every two quarters
    of barley, old Neustceter measure, one tun of beer from the Betsche brewhouse shall be allowed. We
    promise hereupon, in Our name and in the name of Our most laudable Successores the Bishops of Posen,
    that We shall not remove the aforementioned noble von Rządkowski married couple from the use and quiet
    possession, nor their Successores either, of this Hufe of arable, nor shall We permit anyone whatsoever
    the power to remove them, but rather shall maintain them unshaken under the present privilege, and
    Our aforesaid Successores shall likewise maintain them. Reserving the rights of the Church and of
    the Republic. Whereupon We have signed with Our own hand for greater validity, and have ordered it
    to be confirmed with the seal. Given at Dolsk the 26th of September Anno Domini 1766. Theodor, Prince
    von Czartoryski, Bishop in Posen (L. S.) Ginlily ./. Andreas Miskowski D. C. P. President Capituli
    (L. S. Capitularis.)


    (L. S.)


    From the book of privileges


    of the Posen cathedral church,


    under the seal of the Most Reverend Chapter of that same cathedral church at Posen'

segments:
- page: 1
  en: 'Capitulum Ecclesiae Cathedralis


    Posnaniensis.


    We make known by these presents to all and each whom it concerns: that We, upon the petition of the
    party whom it concerns, have commanded the privilege written below, in which the Actus and the year
    are contained, and which was approved in the General Capitulum of St. Martin in the year 1767, to
    be taken out, having been found in the Book of the Privilegia preserved in Our archive, and to be
    issued in Forma probanti. The content whereof is as follows: Theodor of Klewan and Zukow, Prince of
    Czartorinski, by the grace of God and of the Holy Apostolic See Bishop of Posen and Warsaw, make known
    to all together and to each one to whose knowledge this shall come now and in the future, that the
    noble Simeon and Apollonia Rząkowski, the married couple, have come before Us supplicando (have applied),
    that We might be pleased to make over and to sell to them one Hufe of waste arable lying in the village
    of Głazewo belonging to Our Betsche key, together with the dwelling-house and barn built at the cost
    of the manor, against an annual rent according to the custom of the other inhabitants of this village.
    Since We defer to this their petition, which is directed to the increase of Our certain revenue, We
    have resolved to make over and to sell this same Hufe of arable together with the dwelling and the
    barn to the same persons and to their Successores, as We do, by the present privilege, in consideration
    of the costs expended upon the aforesaid buildings, make over and sell for thirty ducats in specie,
    say 30 ducats. Of which manly Hufe of arable these same other'
- page: 2
  en: 'v. Rząkowski married couple and their Successores oblige themselves to pay 130 fl. po. in two instalments,
    namely 65 fl. at the Feast of John the Baptist and at the Feast of the Holy Three Kings the head-money
    and the Hibernen (money for the soldiers in winter), and to render these punctually to the commune
    according to custom: they shall likewise be bound to send [labourers] to the demesne farm of Głazewo
    four times in the year for the requisitioned labour, and likewise, together with the commune, to the
    clearing of the meadow called Obsko, which has by right been added to this demesne farm. For every
    two quarters of barley, old Neustadt measure, one tun of beer from the Betsche brewhouse shall be
    allowed. We promise hereafter, in Our own name and in the name of Our most honourable Successores
    the Bishops of Posen, that We shall not remove the aforesaid von Rząkowski married couple, nor likewise
    their Successores, from the use and the quiet possession of this Hufe of arable, nor yet permit to
    anyone the power to remove the same — We do not [permit it] — but rather shall maintain them undisturbed
    in the present privilege, and that Our most honoured Successores shall so maintain them also. Reserving
    the rights of the Church and of the Republic. Whereupon We have subscribed with Our own hand and,
    for the greater validity, have commanded it to be confirmed with the seal. Given at Dolsk, the 26th
    of September, Anno Domini 1766. Theodor Prince v. Czartoryski, Bishop in Posen (L. S.) Ginlily ./.
    Andreas Miskowski D. C. P., President Capituli (L. S. Capitularis.)


    (L. S.)


    From the Book of the Privileges


    of the Posen Cathedral Church,


    under the seal of the Most Reverend Chapter of the same Cathedral Church at Posen'

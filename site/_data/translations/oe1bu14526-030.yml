- page: 3
  en: 'Capitulum Ecclesie Cathedralis Posnaniensis. We signify by the tenor of these presents to all and
    each whom it concerns, that We, at the petition of the party whom it concerns, have ordered the privilege
    written out below, concerning the act and year contained therein and approved in the General Chapter
    of St Martin in the year of Our Lord one thousand seven hundred and sixty-seven, found in the book
    of Privileges of the Cathedral Church of Posen preserved in our Archive, to be transumed and to be
    issued in probative form; the tenor whereof follows, of this kind: Theodor of Klewań and Żuków, Prince
    Czartorski, by the grace of God and of the Holy Apostolic See Bishop of Posen and Warsaw. To all in
    common and to each severally, to whom it shall belong to know of this now and hereafter, We make known
    that the noble Simeon and Apollonia Rządkowcy, married couple, have supplicated Us that We might be
    pleased to let out and sell to them a waste holding of arable in the village of Głazewo, belonging
    to our key of Pszczew, together with the dwelling building and barn erected at manorial cost, at a
    rent differing [uncertain: in accordance with] the other inhabitants of that same village. We, inclining
    to such a petition inasmuch as it tends to the increase of our certain revenue, have resolved to let
    out and sell that same holding of arable together with the dwelling and the barn to them and to their
    successors, as by the present privilege, in respect of the said cost of the said buildings, We do
    let out and sell for red gulden in specie, thirty, say # 30; from which holding of arable those noble
    Rządkowski and their successors shall be obliged to pay one hundred and thirty Polish gulden in two
    instalments, that is, on the feast of St John the Baptist sixty-five gulden, on the feast of the Holy
    Three Kings likewise sixty-five, and to render the poll-tax and the Hiberna punctually to the commune
    according to custom. They shall be bound to send, together with the commune, to the compulsory labour
    on the Głazewo demesne farm four times in the year, and likewise to the clearing of the meadow called
    Obska, joined by right to that same demesne farm. For every two quar-'

segments:
- page: 1
  en: 'Capitulum Ecclesiae Cathedralis


    Posnaniensis.


    We make known by these presents to all and each whom it concerns: that We, upon the petition of the
    party whom it concerns, have ordered the privilege written below, in which the Actus and the year
    are contained, and which was approved in the General Capitulum of St. Martin in the year 1767, to
    be sought out and taken from the Book of the Privilegia preserved in Our Archivum, and to be extradited
    in Forma probanti. The content whereof is the following: Theodor of Klewan and Zukow, Prince of Czartorinski,
    by the grace of God and of the Holy Apostolic See Bishop of Posen and Warsaw, We make known to all
    together and to each single one to whose knowledge this shall come now and in the future, that the
    noble Simeon and Apollonia Rząkowski, the married couple, have come in before Us supplicando (have
    applied), that We might be pleased to make over and to sell to them one Hufe of waste arable land
    situate in the village of Głazewo belonging to Our Betsche key, together with the dwelling-house and
    barn built at the cost of the manor, against an annual rent according to the custom of the other inhabitants
    of this village. Since We defer to this their request, which tends to the increase of Our certain
    revenue, We have therefore resolved to make over and to sell this very Hufe of arable land together
    with the dwelling and the barn to the same persons and to their Sucessores, as We do by the present
    privilege make over and sell it, in respect of the costs expended upon the aforesaid buildings, for
    thirty ducats in specie, say 30 ducats. Of which manly Hufe of arable land these same other'
- page: 2
  en: 'v. Rząkowski married couple and their Successores bind themselves to pay 130 fl. po. in two instalments,
    namely 65 fl. on the Feast of John the Baptist, and on the Feast of the Holy Three Kings to render
    punctually to the community the head-money and the Hibernen (money for the soldiers in winter) according
    to custom: they shall likewise be bound to be sent, together with the community, to the labour-service
    on the Głazewo demesne farm four times in the year, and likewise to the clearing of the meadow called
    Obsko, which has by right been added to this demesne farm. For every two quarters of barley, old Neustcet
    measure, one tun of beer from the Betsche brewhouse shall be allowed. We promise hereafter, in Our
    name and in the name of Our most laudable Successores the Bishops of Posen, that We shall not remove
    the aforesaid all the von Rząkowski married couple from the use and quiet possession, nor likewise
    their Successores, of this Hufe of arable land, nor shall We permit anyone whomsoever the power to
    remove the same, but shall rather maintain them unmoved in the present privilege, and Our aforesaid
    Successores shall likewise maintain them. Reserving the rights of the Church and of the Republic.
    Whereupon We have signed with Our own hand, and for greater validity have ordered it to be confirmed
    with the seal. Given at Dolsk, the 26th of September, Anno Domini 1766. Theodor Prince v. Czartoryski,
    Bishop in Posen (L. S.) Ginlily ./. Andreas Miskowski D. C. P., President Capituli (L. S. Capitularis.)


    (L. S.)


    From the Book of the Privileges


    of the Cathedral Church of Posen,


    under the seal of the Most Reverend Chapter of that same Cathedral Church at Posen'

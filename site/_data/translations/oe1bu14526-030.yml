- page: 1
  en: 'Capitulum Ecclesiae Cathedralis


    Posnaniensis.


    We make known by these presents to all and each whom it concerns: that We, upon the petition of the
    party whom it concerns, have ordered the privilege written out below, in which the Actus and the year
    are contained, and which was approved in the General Chapter of St Martin in the year 1767, to be
    taken out from the book of the Privilegia preserved in our Archive, where it was found, and to be
    issued in Forma probanti. The content whereof is as follows: Theodor of Klewan and Zukow, Prince of
    Czartorinski, by the grace of God and of the Holy Apostolic See Bishop of Posen and Warsaw, make known
    to all together and to each one to whose knowledge this shall come now and in future, that the noble
    Simeon and Apollonia Rząkowski, the married couple, have come before Us supplicando (have applied),
    that We might be pleased to grant over and to sell to them one Hufe of waste arable land lying in
    the village of Głazewo belonging to Our Betsche key, together with the dwelling house and barn built
    at the cost of the manor, against an annual rent according to the custom of the other inhabitants
    of this village. Since We defer to this their petition, which is directed to the increase of our certain
    income, We have resolved to grant over and to sell this same Hufe of arable together with the dwelling
    and the barn to those same persons and to their Successores, as by the present privilege, in consideration
    of the costs expended upon the aforementioned buildings, We do grant over and sell for thirty ducats
    in specie, say 30 ducats. From which manly Hufe of arable these same other'

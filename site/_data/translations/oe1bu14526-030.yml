- page: 4
  en: '-ters of barley of the old Zwowecki measure, one barrel of beer from the Pszczew brewery is to
    be permitted. We promise by this Our present, and in the name of Our Most Illustrious successors the
    Bishops of Posen, that We shall not remove the said noble Rządkowski and their successors from the
    use and quiet possession of that same holding of arable, nor shall We permit to anyone whomsoever
    the power of removing them; on the contrary, We shall preserve them inviolate under the present privilege,
    and Our Most Illustrious successors shall preserve them. Preserving entire the rights of the Church
    and of the Republic. Whereupon, for the greater weight, having subscribed with Our own hand, We have
    ordered it to be confirmed with Our seal. Given at Dolsk on the twenty-sixth day of September in the
    Year of Our Lord one thousand seven hundred and sixty-six. Theodor, Prince Czartonski, Bishop of Posen
    (L. S.) Gentilitio. Andreas Myskowski D. C. P. Presidens Capituli (L. + S.) Capitularis.


    Extracted from the book of the Privileges of the Cathedral Church of Posen, under the seal of the
    Most Reverend Chapter of that same Cathedral Church of Posen. Melchior Janowski, Apostolic Notary,
    Secretary of that same Most Reverend Cathedral Chapter of Posen'

- page: 2
  en: 'to the successors of the former proprietor.


    Today the heirs of the Prince of Hohenlohe claim on that ground an indemnity from the Kingdom of Poland;
    in support of their pretensions they allege the example of certain other donees, and in particular
    of the Generals von Zastrow and von Sanitz, who, being in the same category with respect to Prussia,
    were compensated for their losses at the expense of the Prussian Government.


    This affair was already, in the course of the year 1816, the object of discussions between the Imperial
    Ministry and General von Schöler, who was charged with upholding the Prince''s interests. The Emperor''s
    decision was not favourable to them at that time, as the King''s Ministry will have satisfied itself
    from the Note delivered to Mr von Schöler, dated 10 November 1816.


    To the grounds there set out, it must be added that the fact alleged by the petitioners, of indemnities
    granted to the Generals von Zastrow and von Sanitz in exchange for the endowments they had lost in
    the Duchy of Warsaw, is amply elucidated by a report of Prince Zajączek communicated to the Ministry'

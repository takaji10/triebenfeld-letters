segments:
- page: 1
  en: 'To Mr Ancillon etc.


    His Royal Highness Duke Eugen of Württemberg has caused to be recommended to the Imperial Ministry
    the claims which the heirs of Prince Friedrich Ludwig of Hohenlohe-Ingelfingen Öhringen, as well as
    Count Bethusy, bring against the Kingdom of Poland. The Emperor, having taken cognizance of the report
    made on this subject, has ordered that the two causes which Duke Eugen had honoured with His interest
    be submitted to a thorough examination, and the Undersigned, Envoy Extraordinary and Minister Plenipotentiary
    of His Majesty the Emperor of All the Russias, King of Poland, has been charged with communicating
    the result thereof to the petitioners.


    The Prince of Hohenlohe received in 1796, by way of donation, a part of the lands which the Prussian
    Government had confiscated from the Starost Prusiensky in the former South Prussia. The events of
    1807 having deprived the Prince of this possession, it was, upon the formation of the Duchy of Warsaw,
    restored by a decree of the Government


    [Written by the receiving office:]


    Balan


    No. 716, 5 February 1820.'

- page: 4
  en: 'of article 18 of the Treaty of Vienna concern only the proprietors of possessions cut through by
    the frontier line which separates the Kingdom of Poland from the Grand Duchy of Posen, and that moreover
    Count Bethusy''s request appears to have no other object than that of facilitating an export prejudicial
    to the interests of the Kingdom.


    Such are the results which a scrupulous examination of the claims presented has furnished to the Imperial
    Ministry.


    The Emperor has regretted that He does not find Himself in a position, in view of the considerations
    which have just been developed, to give effect to the recommendation of Duke Eugen.


    The Undersigned solicits the good offices of the King''s Ministry in making known to the above-mentioned
    petitioners the decisions of His Imperial Majesty and the motives which have dictated them.


    He seizes this occasion to renew to Mr Ancillon, Privy and Actual Councillor of Embassy, the assurance
    of his most distinguished consideration.


    Berlin, 31 January 1820.


    Alopeus'

- page: 3
  en: 'of the King in support of the claims of the Countess Miączyńska.


    Although this question was thus long since decided, the Imperial Ministry has nonetheless made known
    to the Minister Secretary of State of the Kingdom of Poland the new steps which the heirs of the Prince
    of Hohenlohe have just attempted under the auspices of Duke Eugen. But the reply of Count Sobolewski
    has done no more than establish the soundness of the arguments which have just been set out.


    Count Ernest d''Hue de Bethusy, possessing properties in the Kingdom of Poland and in Prussian Silesia,
    has claimed on that ground the enjoyment of the benefits stipulated in favour of mixed proprietors
    by article 18 of the Treaty of Vienna of 21 April/3 May 1815.


    This request was submitted by order of the Emperor to the examination of the Government of Poland,
    but the decision was not favourable to Count Bethusy''s wishes. The enclosed report of the Lieutenant,
    honoured with the approbation of His Imperial Majesty, contains the arguments upon which this refusal
    is founded. It proves that the stipulations'

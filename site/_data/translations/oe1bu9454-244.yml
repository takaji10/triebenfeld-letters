- page: 1
  en: '244


    Most Serene Prince


    Most gracious Prince and Lord!


    The monarchs have remained here and the great manoeuvre has taken place here in Vienna; I was unable
    to take any part in it or to see it, yet it is said to have surpassed everything in elegance — the
    Emperor as our King. Grand Duke Constantine etc. have received regiments in the Austrian army — which
    each of them also led forward at the manoeuvre. Only the King of Württemberg was not on horseback
    and drove / as I myself saw en passant in a carriage drawn by 8 horses, and indeed in an Oriental
    equipage, after the truly allied sovereigns — In [uncertain: horse] the manoeuvre too was eliminated;
    the cordiality between the two Emperors and our King, which was shown on every occasion, has surpassed
    all belief. Our King, after the various [uncertain: toasts], stepped out onto the balcony, had a filled
    glass of champagne handed to him and drank aloud the health of all brave soldiers — A many-thousandfold
    thanks, accompanied by many thousands of strangers'' tears, was rendered to the King for this even
    by the oldest bearded warriors, and it seemed that all hatred between Austria and Prussia, which formerly
    one imbibed with one''s mother''s milk, was for ever remitted and vanished for good — In unison the
    4 [powers] labour for the welfare of mankind, and only the ill-disposed man will gnash his teeth and
    [text lost] look to the future, which the well-disposed man now regards so hopefully and gladly. The
    King of Württ[emberg] is said still not to be coming forward into the light with the constitution
    which he means to lay before the allied powers for examination; it has [illegible]'

- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    The monarchs have remained here and the great manoeuvre has taken place here in Vienna; I was not
    able to take part in it or to see it, yet it is said to have surpassed everything in elegance, the
    Emperor as our King. Grand Duke Constantin etc. have received regiments in the Austrian [uncertain:
    Armina] — each of whom also led them past at the manoeuvre. Only the King of Württemberg was not on
    horseback and drove (as I myself saw en passant) in a carriage drawn by 8 horses, and indeed in an
    Oriental turn-out; the truly allied Sovereigns being on horseback, he was likewise eliminated from
    the manoeuvre. The cordiality between the two Emperors and our King, which was shown at every turn,
    has surpassed all belief. Our King, after the various toasts, stepped out onto the balcony, had a
    filled glass of champagne handed to him, and drank aloud to the whole body of all brave soldiers —
    a many-thousandfold thanks, accompanied by many millions of foreign tears, was rendered to the King
    for this even by the oldest bearded warriors, and it seemed [uncertain: on some] all haste between
    Austria and Prussia, which formerly was imbibed with the mother''s milk, to have been released in
    one day and vanished forever; in unison they [illegible] the 4 might to the welfare of mankind, and
    only the ill-thinking man will [illegible] youths and many a child [uncertain: restored] look toward
    the future, which the well-thinking man today faces so hopefully and gladly. The King of Württemberg
    is said still not to come forth with the constitution which he means to lay before the allied powers
    for examination; it has [text lost]'

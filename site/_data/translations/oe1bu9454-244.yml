- page: 2
  en: 'the appearance as though he would miss the crossing — Several Princes of the Empire and all 4 estates
    have agreed among themselves to send a deputation to Prince Metternich and to beg of him that the
    Emperor of Austria should come forward again as their head, to whom they would willingly and gladly
    submit themselves if their old rights were restored; they would then form a combined power which would
    scarcely have an equal in [uncertain: the world] — Prince Metternich has referred the estates to patience
    in the matter and has informed them that for the time being it is not yet advisable to come forward
    with it.


    Much is spoken concerning Saxony — But it will probably remain with the resolutions long since taken.


    Concerning Poland nothing is yet determined; meanwhile the [uncertain: surest] man assures me that,
    in so far as the matter concerns Your Serene Highness, [text lost] the best; the minister Baron von
    Humboldt is working here to the best effect, because the matter interests him personally. That, for
    the rest, Your Serene Highness will yet be able to lead a quiet and happy life in Sławięcice, and
    that you will shortly see your chief enemy there trodden in the dust — for that, most gracious Prince,
    I can vouch to you. Only the greatest secrecy is enjoined upon me, because many a stone of offence
    is still to be cleared out of the way — but the fairest morning is already dawning. The good Privy
    Councillor von Gärtner, who lays himself most respectfully at Your Serene Highness''s feet, has for
    several days been very ill; as soon as he is [uncertain: better], I shall obtain much essential news
    from him — [illegible] is everything; on account of the many affairs I must be very watchful. With
    impatience I await a letter from Your Serene Highness, so that I may take my measures accordingly
    — unwillingly would I let the work, now brought into the best course, lie idle, and only the greatest
    necessity can bring me to it — now this further point: if the State Chancellor, Prince Hardenberg,
    [submits] a report concerning Cosmar'

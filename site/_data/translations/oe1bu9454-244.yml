- page: 3
  en: 'one [may reckon] on the Brieg High Provincial Court, particularly on account of the settlement
    of 1811 which is to be annulled, with especial confidence, and would it not be advisable, in due time,
    to send someone thither who might guide and press the matter quietly? I shall be most necessary, as
    I am instructed what ought first to happen, [and shall] give Your Serene Highness notice of every
    outcome, so that one may also [act] there. In deepest reverence I remain, until death,


    Your Most Serene Highness''s — The Sovereign Prince of Holland is assuming the title of King — Vienna,
    the 18th of October


    1814.


    [uncertain: most faithful] most humble and obedient servant


    v. Triebenfeld'

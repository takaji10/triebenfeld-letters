- page: 2
  en: 'the appearance as though he would miss the crossing. Several Princes of the Empire and all 4 Estates
    have agreed among themselves to send a deputation to Prince Metternich and to petition him that the
    Emperor of Austria should again come forward as their head, to whom they would willingly and gladly
    submit themselves if their ancient rights were restored; they would then form a combined power which
    could scarcely have an equal [uncertain: in the world] — Prince Metternich has referred the Estates
    to patience in this matter and has informed them that for the present it is not yet advisable to come
    forward with it.


    Concerning Saxony much is spoken — but it will probably remain with the resolutions long since taken.


    Concerning Poland nothing is yet determined; meanwhile the [uncertain: most upright] man assures me
    that, in so far as the matter concerns Your Serene Highness, they [illegible] you the best. The minister
    Baron von Hum. is working here to best effect, because the matter interests him himself. That moreover
    Your Serene Highness will yet be able to lead a quiet, happy life at Schlawenschitz, and that you
    will shortly see your chief enemy there trodden into the dust — for that, most gracious Prince, I
    can vouch to you. Only the greatest discretion has been enjoined upon me, because there is yet many
    a stone of offence to be cleared from the way — but the fairest morning is already dawning. The good
    Privy Councillor von Gärtner, who lays himself most respectfully at Your Serene Highness''s feet,
    has been very ill for several days; as soon as he is [uncertain: recovered], I shall [uncertain: obtain]
    from him much essential news. With [illegible] everything is [illegible]; on account of the many affairs
    I must be very [uncertain: watchful]. With impatience I await a letter from Your Serene Highness,
    so that I may take my measures accordingly — unwillingly would I leave lying the work now brought
    into the best train, and only the greatest necessity could bring me to it; now still this, which,
    when the Chancellor of State, Mr. Hardenberg, [makes] a report concerning Cosmar'

- page: 3
  en: 'one [uncertain: may] reckon with confidence upon the Brzeg High Provincial Court, particularly
    in the matter of the settlement of 1811 which is to be set aside, and would it not be advisable, in
    due time, to send someone thither who might guide and pursue the matter quietly? I shall, as soon
    as I am instructed what should first be done, most necessarily give Your Serene Highness notice of
    every outcome, so that action may be taken there also. In deepest reverence I remain, until death,


    Your Most Serene Highness''s — The Sovereign Prince of Holland is assuming the title of King — Vienna,
    the 18th of October


    1814.


    faithful and most humble and obedient servant


    v Triebenfeld'

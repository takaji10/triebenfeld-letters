- page: 3
  en: 'The very great distance from Your Serene Highness makes the course of business difficult, and when
    on top of that the power of attorney and other papers are lacking, then everything comes to a standstill.
    It is more than sad for me that I have not a single man who means faithfully and honestly by Your
    [uncertain: Highness]; all of them wish only to enrich themselves, they hold forth about everything,
    know at bottom nothing, and do absolutely nothing at all. The lazy [uncertain: Amel] here writes not
    a syllable, often leads me astray by his lies, and in the end he is the first to stretch out his hand.


    Gratsenauer is truly mad; I can use him for nothing more - now he cries out for money - now he wants
    a title, now a certificate that he really is an official of Hohenlohe-Öhringen and does not belong
    here at all. If he is to work, then he is ill; if he is to travel and conduct a lawsuit here or there,
    then he raves - in short, the fellow is not to be used. Money I have given him, for he has his salary
    drawn a year and a half in advance - but titles and false certificates I shall never grant him. I
    have referred him, somewhat nervous, to keep quiet.'
  names:

- page: 4
  en: 'Now I hear he intends to petition Your Serene Highness - to appoint him councillor of justice;
    whereupon he means to form a court of justice and in Breslau to play the princely Hohenlohe President
    of Justice; he also wishes, as regards his salary, to be assigned upon the Silesian estates. Should
    he really come to Your Serene Highness with such proposals, may You deign only to tell him shortly,


    that as regards his salary, if he believes he has anything to demand, he should apply to the councillor
    of war von Triebenfeld, who would duly instruct the South Prussian treasury to pay everyone who has
    anything to demand. But titles You give to none of Your officials, unless it be that one or another
    had made himself especially deserving towards You - For the rest, however, You do not mix the South
    Prussian affairs either with the Silesian, still less with the Hohenlohe ones, and whoever is not
    content with these arrangements and with the course of business once introduced, him You would have
    to leave to seek a situation suited to his wishes.


    I vouch for it that, if Your Serene Highness will speak in such a tone, everyone will do his duty.
    In deepest reverence I remain, until death,


    Your Serene Highness''s           Berlin, the 16th of May, in the morning at [uncertain: 3] o''clock
    1806


    most faithful and obedient servant


    v. Triebenfeld'

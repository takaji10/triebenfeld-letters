- page: 2
  en: 'effective. Both copies I shall send with the next post, so that Your Serene Highness may gather
    from them the steps which I am taking in every direction and how the matter is being conducted.


    Tomorrow morning, or today, for it is a full hour into the night as I receive the express courier,
    I hasten to Mr. von Tandel, and shall also see the Count von Haugwitz, and speak afterwards with the
    Count von Keller, who is lodging here at the Golden Eagle and who is now to take over the portfolio
    when Mr. von Haugwitz, as Mr. von Hardenberg has already done, goes on leave for several months. What
    I hear here and there I shall report by the first post. Only may Your Serene Highness deign to send
    me speedily the blank forms, the power of attorney for Mr. Pochammer, and especially a couple of judicially
    attested powers of attorney in blank, so that in the latter case I may fill out another power of attorney
    for Mr. Pochammer.


    for the [uncertain: sum stated] was not to stand thus - I had forgotten in my haste to strike it out
    - also it could easily be that they would not wish to give so much money, in which case a lesser sum
    would have to be inserted'

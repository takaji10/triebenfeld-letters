- page: 3
  en: 'The very great distance from Your Serene Highness makes the course of business more difficult,
    and when the power of attorney and other papers are wanting besides, then everything comes to a standstill.
    It is more than sad for me that I have not a single man who means truly and honestly by [uncertain:
    Your Serene Highness]; all of them wish only to enrich themselves, they argue about everything, know
    nothing at bottom, and do absolutely nothing either. The idle Amel[ang] here writes not a syllable,
    often leads me astray by his lies, and in the end he is always the first to stretch out his hand.


    Grattenauer is truly mad; I can use him for nothing any longer — now he cries out for money — now
    he wants a title, now a certificate that he is really a Hohenlohe-Öhringen officer and does not belong
    here at all. If he is to work, he is [uncertain: ill]; if he is to travel and conduct a lawsuit here
    or there, he raves — in short, the fellow is not to be used. Money I have given him, for he has his
    salary a year and a half in advance — but titles and false certificates I shall never grant him. I
    have sent him off, somewhat nervous, to rest —'

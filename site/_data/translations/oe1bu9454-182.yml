- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    This very moment I receive Your Most Serene Highness''s most honoured letter of the 11th of this month.


    It contains the dispatches to the Mr. von Haugwitz, to Herr Faudel, together with [uncertain: Glagte]
    and [uncertain: Beclage] a letter to Mr. Glenck, a letter to myself of 1½ sheets, and a postscript
    in Your Most Serene Highness''s own hand. The power of attorney for the court fiscal Pochammer and
    the blank forms, both of which things I need above all else, have been forgotten and not enclosed
    - I have already been here several weeks and can do nothing, because only these pieces are wanting.
    I am not to write to the King under Your Serene Highness''s name; these blank forms all still lie
    there, but smaller ones, to write to men who absolutely must have effect, I have no more of - May
    Your Serene Highness therefore deign to let me have at the very soonest the power of attorney for
    Herr Doctor Pochammer and the necessary blank forms, also a few judicially attested powers of attorney
    in blank, so that I may have them filled out as they are required. To the Privy Cabinet Councillor
    Beyme and to the Minister


    von Voss I have written in Your Serene Highness''s name on the last two blank forms, and recommended
    the court fiscal Pochammer as authorised representative, so that he may to some degree be'

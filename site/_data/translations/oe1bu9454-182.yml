- page: 4
  en: 'Now I hear he means to petition Your Serene Highness — to appoint him councillor of justice, whereupon
    he means to form a college of justice — and in Wrocław to make himself the Princely Hohenlohe President
    of Justice; he also wishes to be assigned to the Silesian estates for his salary — Should he really
    come to Your Serene Highness with such proposals, [uncertain: may you be pleased] to tell him only,
    in short,


    that as regards his salary, if he believes he has anything to demand, he should apply to Mr Councillor
    von Triebenfeld, who would duly instruct the South Prussian treasury to pay everyone who has anything
    to demand. But titles they [uncertain: do not give] to their officials, unless it be that one or another
    had made himself particularly deserving towards them — For the rest, however, they did not mix the
    South Prussian affairs either with the Silesian ones or still less with the Hohenlohe ones; and whoever
    was not content with these arrangements and with the course of business once introduced, him they
    would have to leave to seek a situation suited to his wishes.


    I stand surety that, if Your Serene Highness speaks in such a tone, everyone will do his duty. In
    deepest reverence I remain, until death,


    Your Serene Highness''s                Berlin, the 16th of May, in the morning at [uncertain: 3] o''clock,
    1806


    most faithful and obedient servant


    von Triebenfeld'

- page: 2
  en: 'effective. Both copies I shall send by the next post, so that Your Serene Highness may gather from
    them the steps I am taking throughout and how the matter is being conducted.


    Tomorrow morning, or today, for it is [illegible] o''clock in the night as I receive the express courier,
    I shall hasten to Mr von Faudel, shall also present myself to Mr Count von Haugwitz, and shall afterwards
    speak with Mr Count von Keller, who is lodging here at the Golden Eagle and who is now to take over
    the portfolio when Mr von Haugwitz, as Mr von Hardenberg has already done, goes on leave for several
    months. What I hear here and there I shall report by the first post. Only may Your Serene Highness
    be pleased to send me speedily the blank sheets, the power of attorney for Mr Pochammer, and especially
    a couple of court-attested powers of attorney in blank, so that in the latter case I may fill out
    another power of attorney for Mr Pochammer.


    for the sum stated ought not to stand so — I had forgotten in my haste to strike it out — it might
    also easily be that they would not wish to give so much money, in which case a lesser sum would have
    to be inserted'

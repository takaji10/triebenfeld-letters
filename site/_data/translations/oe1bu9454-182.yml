- page: 1
  en: '182


    Most Serene Prince


    Most gracious Prince and Lord!


    This very moment I receive Your Most Serene Highness''s most honoured letter of the 11th of this month.
    It contains the dispatches to Mr M[inister] von Haugwitz, to Mr Faudel, together with [uncertain:
    complaint] and [uncertain: enclosure] a letter to Mr Glenck, a letter to myself on 1½ sheets, and
    a postscript in Your Most Serene Highness''s own hand. The power of attorney for Mr Hof Fiscal Pochammer
    and the blank sheets, both of which things I need above all else, have been forgotten in the enclosing
    — I have already been here several weeks and can do nothing, because it is only these pieces that
    are wanting. I am not to write to the King under Your Serene Highness''s name; these blank sheets
    all still lie here, but smaller ones for writing to men who absolutely must be brought to act, I have
    no more of — May Your Serene Highness therefore be pleased to let me see, at the very soonest, the
    power of attorney for Mr Pochammer and the necessary blank sheets, and also a few court-attested powers
    of attorney in blank, so that I may have them filled out as they are required. To Mr Privy Cabinet
    Councillor Beyme and to Mr Minister


    von Voss I have written in Your Serene Highness''s name on the last two blank sheets, recommending
    the Hof Fiscal Pochammer as authorised representative, so that he may be at least to some degree'

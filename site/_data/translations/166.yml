status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! Soon I shall have to let the name [uncertain: go] the cabals
    of the Finance Department, yet I must submit to them; but that a minister such as Herr v. Voss should
    raise so many difficulties in the dismemberment business is unheard of. Several estate proprietors
    who dismembered as much as 2 years ago must restore everything in statu quo again, and are thereby
    brought to the beggar''s staff. He has had everything here inhibited on my account, and to that end
    has ordered the Chamber to send out a commission which is to examine whether everything has already
    been dismembered — whether it might not be possible to thwart this matter; in particular it is now
    to investigate exactly whether in any manner there has been action contrary to the principles; whether
    all the money has not been drawn off, and the onera publica therefore, as at Betsche, were no longer
    covered. On the presumption that this last would certainly be the case, everything was at once to
    be inhibited, and in that event the strictest measures taken. The commission set out today; I have
    indeed prevailed,'
- page: 2
  en: 'but money and health have been spent on it. I have meanwhile proved, that I have done nothing without
    the foreknowledge of the provincial authority; 2. that I have acted strictly in accordance with the
    prescription; 3. that everything has been sold, so that without a complete derangement of the whole
    no annulment or reversal of the dismemberment could take place; 4. that the truest revenues of the
    Dominium would now amount to 8 times as much as the revenues hitherto, whereby the onera publica would
    be covered 10 fold; 5. That His Serene Highness the Prince applied the entry-monies to nothing else
    than to the discharge of the debts which encumber the estates, in order to make the estates clear;
    and that 6. these estates were to remain an entailed estate of the Princely family, which last His
    Majesty had already most graciously himself [uncertain: sanctioned]. The commission has found all
    this borne out, and has withdrawn the inhibition, the more so since with the old peasant everything
    has likewise already been concluded judicially, and since here too it was not possible even for envy
    itself to find matter for the founding of new cabals. — The clear annual revenues acknowledged by
    the commission are 31000 Rthl. It was obliged to ascertain this exactly in order to cover the onera
    publica. This the Chamber will now confirm, and the'
- page: 3
  en: 'Finance Department will grant us the concession for it. — As soon as I receive this instrument,
    neither an assessment nor anything else is needed, but one can quickly obtain 3 to 400000 Rthl upon
    it at any bank, and then all distress is at an end. The 180850 Rthl still to come in can then be taken
    for the extinction of all household and other debts. The only fatal thing is the accursed procrastination,
    for at the first moment all the purchasers ran off upon the becoming-known of that cursed inhibition,
    and I must now strike very gentle notes so that I may lure the people back again. Enough: Your Serene
    Highness comes happily through with the dismemberment, [uncertain: and] will after years be free of
    debt here — for if for some years together you assign the revenues to the absorption of the debts
    of the estates here, then in 9 years the estates are entirely clear, afford you a revenue of 40000
    Rthl, and you moreover draw out of the estates, little by little, a capital of 220000 Rthl. — This
    I believe I may now firmly and sacredly assure Your Serene Highness of. But now, most gracious Lord,
    I am worn down — I have laboured with truly glowing zeal, and every man of expertise is astonished
    at this thing brought so far. Longer than this I cannot hold out here — both my health and my means
    are being consumed, and I leave beggars behind. Also for some time past one misfortune after another
    has struck'
- page: 4
  en: 'Thus in the last couple of months I have lost 2 lawsuits which cost me some 6000 Rthl. In another
    I have been declared in contumacy, and shall have trouble to redress the same and to save a further
    6000 Rthl. Today I receive the news that the hail has beaten down everything on my Schweinersche estates;
    there I shall again have [uncertain: truly] some 5000 Rthl of damage. At Kontop, as I hear just now,
    a tenant has become insolvent; there I again suffer 2500 Rthl of [uncertain: lost] burden. — In a
    short time these are 19500 Rthl. It is as though all blessing had departed from there and had followed
    me hither. Now I must go back in order to save what may be saved there, for otherwise I go to ruin.
    I tremble, to be sure, when I go away from here and let the guiding thread out of my hands, that everything
    will come to a standstill again — but necessity presses me; I must hasten for a time to Schweinen
    and Kontop, for otherwise I risk a new and still greater loss. I shall [text lost] everything here
    understands, instruct Schenck and a couple of other persons to receive in the monies. But I cannot
    answer for it whether these persons will hold to the execution of my orders with the same zeal, since
    every beast would far too gladly see the affairs continue in [uncertain: contention] through a whole
    man''s lifetime, as has otherwise happened. In deepest reverence I remain, until death, Your Serene
    Highness''s Trąbczin, the 29th of July 1805. humble and obedient servant v Triebenfeld'

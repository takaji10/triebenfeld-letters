status: draft
segments:
- page: 1
  en: 'Your Right Honourable. Unhappily I have had to keep Your [uncertain: Right Honourable]''s [uncertain:
    dead man] waiting until today, to whom I have paid the requisite daily allowance and his wages. I
    was put off from one day to the next before I obtained closer and somewhat definite information upon
    the object mentioned to the same in my last prolix letter. Through Mr. General Schimmelpfennig I received
    today the news that he could not himself, at his advanced age and in the present weather, [uncertain:
    view/prove] the Zagorow estates, but had resolved to charge his two sons-in-law, the Rittmeister von
    Kotzow and Mr. v. Johnston, therewith, and for that reason wishes to see Lieut. Sommer with him after
    the holidays, so that he might make this journey thither with them after closer information had first
    been given him upon several objects concerning the estates. What I have now provisionally learned
    today, with some reliance, of the General''s opinion, which I here [text lost] Your Right Honourable,
    whereupon much may yet turn or be led otherwise; meanwhile it may be necessary to enter into his ideas
    and to regulate the counter-accounts accordingly. He, the General, hopes to obtain my estates at 23000
    v/d, and his plan of payment for it, if matters were to go according to his wish, is to be the following:
    1. he would gladly bring his estates Seliz and Modkewo into the transaction for 110000; 2. then he
    would wish to include the small estate Goła wies, which Mr. v. Johnston now possesses, and in which
    he has 6000 Rthl; 3. thereupon he wishes a capital belonging to the General''s lady, which amounts
    to 66000 Rthl, but which consists in East Prussian mortgage bonds, to be accepted al pari; a further
    12000 Rthl he would also for the most part still [uncertain: wish] to [text lost] in the like papers'
- page: 2
  en: 'and the rest in cash or in Silesian mortgage bonds; if indeed more should be needed, he thought
    he might at a pinch add a further 20000 Rthl by the giving in of good secure mortgages upon Silesian
    possessions. Thereupon it was further intimated that if, contrary to old Schimmelpfennig''s expectation,
    more funds should be required for this [uncertain: requisition], he wishes that this sum might remain
    entered upon the estates, or that I retain for myself as property the arrears and the outstanding
    claims in the estates, in the collection of which he would then gladly co-operate. To Berlin he has
    already, on the Friday of a week ago, sent off his two sons to make the maternal capital of the [uncertain:
    Preußische] mortgage bonds liquid. These now stand in Berlin at the rate of 52 1/2 per cent; for the
    estates which he wishes to be given in, there would, according to [uncertain: sound] and reliable
    statement, probably be 95000 Rthl in ready money to be had upon a sale; hence, according to the plan
    he has devised for himself, he would probably receive in all — even if he gives 220000 and reckons
    it properly still in Courant — 170000 Rthl. If anything is to come of the transaction, one must be
    able to convince him with probability that he gains considerably by it; and since my situation absolutely
    requires that this prospect be made use of, I trust to Your Right Honourable''s prudence, that you
    will make use of these my [uncertain: wishes/hints], and will, to my thanks and satisfaction, bring
    this business in hand happily to a conclusion. Lieut. Somer I have likewise instructed to that effect,
    and he will with full vigour, upon'
- page: 3
  en: 'his presence in Seliz, strive to work to the end that the General Schimmelpfennig [illegible] and
    that [illegible] Your Right Honourable in the quickest possible manner [illegible]. This is what I
    am able to say upon this object, and I add only the request that you would apply everything, that
    this proposed arrangement may soon be realised. Truly my weal and woe rest upon it. My thanks toward
    you will match my friendly sentiments. Yet one further circumstance, which has arisen since yesterday,
    makes me the more wish for the use of this prospect, since I now know for certain that the project
    of sale of our estates to Weigel and Stössel has not [uncertain: succeeded]. The Rittmeister v. Stössel
    of Ruzynowice came here yesterday from Berlin by way of Breslau, where his father gave him commissions
    to me, and travelled back today to Ruzynowice. He had also spoken confidentially and at length with
    Weigel. He assures me that the latter would not enter into this transaction, that his father, as is
    quite true, could not do it alone, and that Ruzynowice was to be brought in as well seemed to astonish
    him. In short, for the realisation of this plan there remains not the least appearance. He made me
    some proposals from his father, which the latter will only repeat, for which purpose he has [uncertain:
    thought] to visit me about the 6th of January. Perhaps some way out may yet be found for his reassurance.
    It would be useless to say anything further about this plan, which I must regard as wholly foundered,
    than that it is on that account the more necessary to pursue the paths taken up with Schimmelpfennig.
    Since help is indispensably necessary to me, I conjure you to bestir yourselves there in every way
    to bring the lawsuits to an end,'
- page: 4
  en: 'whereby monies may soon come to hand. I have sent an express courier to Öhringen, in order to press
    the coming hither of my son. He must have arrived there today, and I hope soon to receive an answer
    thereupon after the [uncertain: present/new] year, or to see him here soon myself. In several respects
    I now find myself sorely plagued, and I have my hands full to avert several evils. [uncertain: Address
    yourself], my best friend, now indeed to everything that can further our intended business of the
    sale of estates and bring it quickly to a conclusion. Mr. Lieut. will report everything faithfully
    to you and will certainly not be wanting in his exertions. I hope, if all goes happily, to see you
    again in gladness, and rejoice in your [text lost]. Do not leave me without news, particularly when
    you have anything serviceable to report. Your intended journey to Neisse will probably not have taken
    place, since I heard nothing further about it. The other affair, upon which you wished to make disclosure
    to me by word of mouth, lies very much at my heart, and I could wish to receive only some hints upon
    it provisionally from the same. To Mr. Lieut. Sommer I further commit it to lay before you certain
    matters which it may perhaps be necessary to set in order before the arrival of the Johnston sons-in-law,
    and I most submissively beg that you would be pleased to take favourable regard thereof. Deign to
    be always [text lost] of my true [uncertain: sincerity] and the assurance of that esteem [text lost]'

- page: 3
  en: 'May Your Most Serene Highness most graciously pardon this postscript. At the very moment when I
    was about to send off this letter, my [uncertain: Hoh] steward brings the accompanying letters, in
    which it is reported how much iron has gone off from Opole. As much as this would have gladdened me,
    so much does it cast down my spirits that I am to pay the freight charge — I have as yet no travelling
    money — whence am I to take the freight costs?


    Michaelis receives 600 Rthl. of iron; this costs over 240 Rthl. in freight and duty from here to Berlin
    — Lahr would receive, for interest, costs and capital, 400 Centner at 5 Rthl 12 Groschen, which comes
    to 2200 Rthl; there I must again lay out some 200 Rthl. for freight, duty and dues from here, and
    even with that I shall not manage, if the costs should come to more.


    I have already exerted everything to raise travelling money; as yet I have not succeeded, though I
    have a promise of receiving 500 Rthl on Sunday. If that succeeds, then I shall set out at once for
    Königsberg — but the freight charge I cannot pay; may it please Your Most Serene Highness most graciously
    to [uncertain: sehen] have this defrayed, and to order that the 217 Centner of iron still wanting
    to make up the 1000 be sent here at the very soonest, so that the same may be dispatched from here
    at once to Berlin to van der Lahr — otherwise I travel full of care and cannot work on with a quiet
    heart and an open brow'

segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Even now I still wait in vain for the arrival of the iron, and on that account I delay my journey,
    for until it is here I cannot depart; I have neither travelling money, still less can I satisfy Michaelis,
    who has just now arrived here from Berlin. — The greatest misfortune is that I must sit here so long
    and cannot depart for Königsberg, where at present so much good might be established. Let Your Most
    Serene Highness show me the single grace of ordering that the 1000 hundredweight of iron be delivered
    here in Beyndel very soon indeed, so that I may make all arrangements and set off. Michaelis brings
    the news that our troops in Berlin have already received live cartridges, and that a declaration of
    war is looked for at any moment. One matter has caused a great sensation in Berlin; it is this: when
    the news arrived in Berlin that the Archduke Carl had his headquarters at Hoff, General Astog gave
    out as the watchword "Carl and Hoff"; the French envoy is said to have been greatly incensed at this
    and reported it at once by courier to Napoleon. Everything is full of expectation of the things that
    are to come. The Russian troops are beginning to set themselves in motion on the Polish frontiers
    — the Grand Duke Konstantin has departed from Petersburg in order to manoeuvre with the corps of 75000
    men which stands in and about Bržesc. The delivering-in of silver proceeds very well; in Berlin the
    press is so great that a larger staff has had to be engaged to expedite the stamping, because the
    people from the province must in part wait eight days and longer before they can be dispatched. At
    present many men and horses are being driven together here'

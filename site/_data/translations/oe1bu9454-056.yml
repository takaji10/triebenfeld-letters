status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Even until now I lie in wait in vain for the
    arrival of the iron, and on that account I delay my journey, for until that is here I cannot depart;
    I have neither travelling money, and still less can I satisfy Michaelis, who has just now arrived
    here from Berlin. — The greatest misfortune is that I must sit here so long and cannot set off for
    Königsberg, where at present so much good might be effected. Let Your Most Serene Highness have the
    singular grace to order that the 1000 Centner of iron be delivered here in Beyndel very soon indeed,
    so that I may make all arrangements and depart. Michaelis brings the news with him that our troops
    in Berlin have already received live cartridges, and that a declaration of war is looked for at any
    moment. One matter has caused great sensation in Berlin; it is this: when the news arrived in Berlin
    that the Archduke Carl had his headquarters at Hoff, the [uncertain: Gt. Astog] gave out as the watchword
    "Carl and Hoff"; the French envoy has been most exceedingly incensed at it and has reported the same
    at once by courier to Napoleon. Everything is full of expectation of the things that are to come.
    The Russian troops are beginning to put themselves in motion on the Polish frontiers — the Grand Duke
    Konstantin has departed from Petersburg in order to manoeuvre with the corps of 75000 men which stands
    in and near Brzesc. The delivering-in of silver proceeds very well; in Berlin the press is so great
    that a larger staff has had to be engaged to expedite the stamping, because the people from the province
    must in part wait eight days and longer before they can be dispatched. At present many men and horses
    are being driven together here'
- page: 2
  en: in order to bring together a strong corps and to mobilise quickly — It seems certain that our House
    will again have to take part in the business. To the Lord General von Zastrow the King has written
    a letter in his own hand, exceedingly obliging, and has referred him to patience for only a short
    time yet. I burn with eagerness to learn everything in detail in Königsberg soon, so as to be able
    to give Your Most Serene Highness definite information upon everything, or to bring the same to Him
    Most High in person. In deepest reverence I remain, until death, Your Most Serene Highness's Kontop,
    the 20th of April 1809. faithful and most obedient servant v Triebenfeld
- page: 3
  en: 'May Your Most Serene Highness most graciously pardon this postscript. The very moment I was about
    to send off this letter, my [uncertain: Hoh] steward brings the enclosed letters; in these it is reported
    how much iron has gone off from Oppeln. As much as this would have gladdened me, so much does it cast
    down my courage that I am to pay the carriage-charge — I have as yet no travelling money — whence
    am I to take the carriage costs. Michaelis receives 600 Rthl of iron; these costs come to over 240
    Rthl carriage and toll-duty from here to Berlin — Lahr would receive for interest, costs and capital
    400 [uncertain: Cantz] at 5 Rthl 12 ggl., which is 2200 Rthl; whereupon I must again lay out some
    200 Rthl carriage, toll and duty from here, and with that I still shall not manage, if the costs come
    to more. I have already made every effort to raise travelling money; as yet I have not succeeded,
    meanwhile I have a promise of receiving 500 Rthl on Sunday; if that succeeds, then I travel at once
    to König[sberg] — but the carriage-charge I cannot pay; may Your Most Serene Highness most graciously
    deign to have this defrayed and command that the 217 [uncertain: Leuth] of iron still lacking to the
    1000 be sent hither with all possible speed, so that the same may be dispatched from here at once
    to Berlin to von der Lahn — otherwise I travel full of care and cannot work on with a quiet heart
    and an open brow'

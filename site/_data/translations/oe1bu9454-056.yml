- page: 2
  en: 'in order to bring together a strong corps and to mobilise quickly. — It seems certain that our
    House will again have to take part in the business.


    To the Lord General von Zastrow the King has written a letter in his own hand, exceedingly obliging,
    and has referred him to patience for only a short time yet.


    I burn with [uncertain: eagerness] to learn everything in detail at Königsberg soon, so as to be able
    to give Your Most Serene Highness definite information upon everything, or to deliver the same to
    Your Highness in person. In deepest reverence I remain, until death, Your Most Serene Highness''s


    Kontop, the 20th of April


    1809.


    most faithful and obedient servant


    v. Triebenfeld'

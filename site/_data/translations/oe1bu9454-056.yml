- page: 1
  en: '56


    Most Serene Prince


    Most gracious Prince and Lord!


    Even now I am still watching in vain for the arrival of the iron, and on that account I am delaying
    my journey, for until it is here I cannot depart; I have neither travelling money, still less can
    I satisfy Michaelis, who has just arrived here from Berlin. — It is the greatest misfortune that I
    must sit here so long and cannot depart for Königsberg, where at present so much good might be effected.
    Let Your Most Serene Highness have the singular grace to order that the 1000 Centner of iron be delivered
    here in Bojadła very soon indeed, so that I may make all arrangements and travel away. Michaelis brings
    the news that our troops in Berlin have already received sharp cartridges, and that a declaration
    of war is looked for at any moment. One matter has caused a great sensation in Berlin; it is this:
    when the news arrived in Berlin that the Archduke Carl had his headquarters in Hoff, General Listog[uncertain:
    Listog] gave out the parole "Carl u Hoff"; the French envoy was [uncertain: gewust] highly incensed
    at this and reported the same at once by courier to Napoleon. Everything is full of expectation of
    the things that are to come. The Russian troops are beginning to set themselves in motion on the Polish
    borders — the Grand Duke Constantin has departed from Petersburg in order to manoeuvre with the corps
    of 75000 men which stands in and near Brześć — The delivering-in of silver proceeds very well; in
    Berlin the crowding is so great that a larger staff has had to be engaged to expedite the stamping,
    because the people from the province must in part wait eight days and longer before they can be dispatched.
    At this time many men and horses are being driven together here'

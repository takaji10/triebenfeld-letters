- page: 3
  en: 'May Your Most Serene Highness most graciously pardon this postscript. At the very moment when I
    was about to send off this letter, my [uncertain: high] steward brings the enclosed letters; in these
    it is reported how much iron has gone off from Oppeln. Much as this would have gladdened me, so much
    does it cast down my courage that I am to pay the freight charge — I have as yet no travelling money
    — whence am I to take the freight costs?


    Michaelis receives 600 Rthl of iron; these costs, over and above 240 Rthl freight and toll duty from
    here to Berlin — Lahr would receive for interest, costs and capital 400 [uncertain: Cantz] at 5 Rthl
    12 Groschen, which is 2200 Rthl; there again I must lay out some 200 Rthl freight, toll and duty from
    here, and even so I shall not manage, if the costs should amount to more.


    I have already tried everything to raise travelling money, and have not yet succeeded; meanwhile I
    have a promise of receiving 500 Rthl on Sunday; if that succeeds, then I shall set off at once for
    Königsberg — but the freight I cannot pay; may Your Most Serene Highness deign most graciously to
    have this defrayed, and command that the 217 [uncertain: Leuth] of iron still wanting to make up the
    1000 be sent hither with all possible speed, so that the same may be dispatched from here at once
    to Berlin to von der Lahn — otherwise I travel [uncertain: full of care] and cannot work on with a
    quiet heart and an open brow.'

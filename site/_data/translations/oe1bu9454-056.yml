- page: 2
  en: 'in order to bring together a strong corps and to mobilise quickly — It seems certain that our house
    will again have to take part in the business.


    To the Lord General von Zastrow the King has written a most obliging letter in his own hand, and has
    referred him to patience for only a short time longer.


    I burn with [uncertain: Begmode] to learn everything in full detail in Königsberg soon, so as to be
    able to give Your Most Serene Highness definite information upon everything, or to bring the same
    to you in your most high person. In deepest reverence I remain, until death, Your Most Serene Highness''s


    Konotop, the 20th of April


    1809.


    faithful and most obedient servant


    v Triebenfeld'

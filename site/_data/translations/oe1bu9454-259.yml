- page: 1
  en: '259


    Most Serene Prince


    Most gracious Prince and Lord!


    Now I can demonstrate to Your Most Serene Highness with the highest proofs that your sufferings will
    be at an end. Every minute I await the resolution, good beyond all things, of the exalted burgher
    Prince Hardenberg, that the Brzeg Higher Provincial Court is to investigate the whole affair with
    the greatest possible dispatch and submit its report in the shortest possible candles; had the business
    gone to Berlin, it might well have fallen into the long volume. Now this worry too is removed. But
    how gracious and forbearing — my submissions remain behind with the Prince — yet this Your Serene
    Highness will indeed [uncertain: see] from the resolution and the order to the Higher Provincial Court;
    if the answer of the Brzeg Higher Provincial Court agrees with my submissions, then the Prince Chancellor
    will have the 112/m rt. paid, and everything will proceed according to my proposal — Now it is Your
    Serene Highness''s affair to press matters there — You are now yourself to declare everything before
    the commissioner, whether at Brzeg or at Sławięcice — For God''s sake I beg you, most gracious Prince,
    speak now freely and without any salvation, say straight out that you were induced to it — Prove then
    in brief that the settlements were drawn up to the detriment of the creditors, and that the debts
    entered are fictitious. Prove by Beyme''s breach how you were enticed into believing Cosmar — Draw
    the commission''s attention to the fact that Cosmar forged everything with the old woman in Berlin,
    and that everything was sent to you at Öhringen / where you were under arrest / and that you were
    swept into acceding by a thousand false representations and by threats as well. The declaration that
    you are to pay and are willing to pay the 300000 rt — as also the codicil and all'

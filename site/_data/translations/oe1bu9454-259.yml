- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Now I can demonstrate to Your Most Serene Highness with the highest proofs that your sufferings will
    have an end. At every minute I await the altogether excellent resolution of the elevated burgher-prince
    Hardenberg, to the effect that the Brieg O[uncertain: S]G is to investigate the whole matter with
    the utmost dispatch and to submit its report in the shortest possible [illegible]; had the business
    gone to Berlin, it might well have landed in the long volume. Now this worry too has been removed.
    But how graciously and forbearingly my submissions remain behind with the Prince - yet this Your Serene
    Highness will indeed [uncertain: gather] from the resolution and the order to the Supreme Provincial
    Court


    2. The answer of the Brieg B. L. G. being conformable with one of the submissions, the Prince Chancellor
    thus has the 42000


    rt. paid and everything then proceeds according to my proposal; [uncertain: it is now a matter for
    a Serene Highness to press the thing there] - You are now yourself to declare everything before the
    commissary, whether in Brieg or in Schlawenschitz. For God''s sake I beg you, most gracious Prince,
    speak now freely and without any [illegible], say straight out to me how one had induced you - prove
    then in brief that the settlements were drawn up to the detriment of the creditors, and that the debts
    entered there are fictitious. Prove by [uncertain: Beymo Bruch] how you were enticed into believing
    Cosmar - Draw the commission''s attention to the fact that Cosmar forged everything together with
    the old [one] in Berlin, and that everything was sent to you at Öhringen) where you were under arrest,
    and that you were carried away into acceding by a thousand false representations and also by threats.
    The declaration that you are to pay and will pay the 300000 Rthl - as also the codicil and all'

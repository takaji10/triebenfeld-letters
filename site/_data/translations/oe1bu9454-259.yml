- page: 2
  en: 'devilish fabrications of Cosmar, lay these out [uncertain: rightly] and without any fear; in all
    cases do consult Court Councillor Hahn — He may perhaps be blunt, but he goes straight and is faithfully
    attached to you — Spare neither your son nor anyone else, speak the truth in every instance, and that
    without [illegible]; your children will afterwards be obliged to honour and love you. — At present
    I doubt both — the struggle has here been happily withstood, the most glorious path is opened, step
    forward there with head and heart, and crowns — honour, peace and contentment will then teach again,
    and will accompany you to the edge of the grave — But once more I beg you, do nothing without the
    honest Hahn — Towards the officials, or rather towards the worshipper of the false idol and the gentleman
    executor of the testament, you may [uncertain: come forward] with the dignity that is otherwise proper
    to you, and avoid all familiarity. Ah, far more heavily will the birds then whistle when the matter
    comes to be spoken of.


    There is no time to be lost; I therefore [uncertain: report] all this to you, better Prince, so that
    you may be forewarned, by a courier as far as Nysa — from Nysa an express courier is to be sent to
    you, so as to get the talisman quickly into your hands — Fruits you need no longer, the [uncertain:
    intended] upright Prince Chancellor will and shall help in earnest — and my noble friend B[arbe] —
    works on, as a thoroughly honest man whom you can never thank enough, with glowing zeal. This in the
    greatest haste today; the day after tomorrow, more — from Gärtner and Göschel I hear that the divine
    man, Prince Hard[enberg], takes up the Hohenlohe cause before all others — That too will turn out
    well — It is with the greatest veneration that I remain, until death,


    Your Most Serene Highness''s


    the end of the Congress is not yet


    to be foreseen, and is perhaps still far off


    Vienna, 8 December 1814.


    faithful and obedient servant


    v Triebenfeld'

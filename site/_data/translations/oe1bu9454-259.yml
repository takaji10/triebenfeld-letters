status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Now I can demonstrate to Your Most Serene Highness
    with the highest proofs that Your sufferings shall have an end. At every minute I await the resolution,
    good beyond all measure, of the elevated Burgher-Prince Hardenberg, to the effect that the Brieg O[uncertain:
    S]G is to investigate the whole matter with the utmost dispatch and submit the shortest possible report;
    had the affair gone to Berlin, it might well have fallen into the long volume. Now this worry too
    is removed. But how graciously and forbearingly my petitions remain behind with the Prince — yet this
    Your Serene Highness will indeed [uncertain: erhöhn — "exalt"/perhaps "see"] from the resolution and
    the disposition to the Superior Provincial Court, 2. The answer of the Brieg B. L. G. being conform
    with a petition, the Prince Chancellor thus has the 42000 rt. paid, and everything proceeds according
    to my proposal; [uncertain: Jagt — perhaps "jetzt", now] it is a matter for a Serene Highness to press
    there — You are now yourself to declare everything before the Commissarius, whether in Brieg or in
    Schlawenschitz. For God''s sake I beg You, most gracious Prince, speak now freely and without any
    [uncertain: heil], say straight out to me [text as transcribed: "mir man die induzirt hätt"] — Prove
    then in brief that the settlements were drawn up to the detriment of the creditors, and that the debts
    entered therein are fictitious. Prove by [uncertain: Beymo Bruch] how You were enticed into believing
    Cosmar — Make the Commission attentive to the fact that Cosmar forged everything together with the
    old [one] in Berlin, and that everything was sent to You at Öhringen), where You were under arrest,
    and that You were carried away into acceding by a thousand delusive representations and also by threats.
    The declaration that You are to and will pay the 300000 Rthl — as also the codicil and all'
- page: 2
  en: 'devilish fabrications of Cosmar, do lay these out [uncertain: reat] and without any fear; do in
    every case take the counsel of Court Councillor Hahn. He can perhaps be [uncertain: ausfallend — abrupt/offensive],
    but he goes straight and is faithfully attached to You. — Spare neither Your son nor anyone else;
    speak the truth in every instance, and that without [uncertain: Schmülle]. Your children will afterwards
    have to honour and love You for it. — At present I doubt both. The struggle has been happily withstood
    here, the most splendid path is opened; come forward there with head and heart, and crown the day
    — honour, repose and contentment then return again, and will accompany You to the very brink of the
    grave. But once more I beg You, do nothing without the honest Hahn. Towards the officials, or rather
    towards the worshipper of the false idol and the Herr Executor of the Testament, You could [text lost]
    with the dignity otherwise proper to You, and avoid all familiarity. Ah, far harder will the birds
    then pipe when the matter really comes to be spoken of. There is no time to be lost; I therefore [report]
    all this to You, better Prince, so that You may be forewarned, by a courier as far as Neisse — from
    Neisse they are to send You an express courier, in order to get the [uncertain: Ratismann] quickly
    into hand — You need now fear nothing more; the aforementioned [uncertain: Büdere] Prince Chancellor
    will and shall give real help — and my noble friend ß — works on as a thoroughly honest man, whom
    You can never thank enough, with glowing zeal. This in the greatest haste today; day after tomorrow
    more. From Gärtner and Göschel I hear that the divine man, Prince Hardenberg, takes up the Hohenlohe
    cause before all others — that too will turn out well. It is with the greatest reverence that I remain,
    until death, Your Most Serene Highness''s — the end of the Congress is not yet to be foreseen, and
    perhaps still far distant. Wien, the 8th of Xbr 1814. faithful and obedient servant v Triebenfeld'

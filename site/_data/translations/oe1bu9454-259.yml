- page: 2
  en: 'of Cosmar''s devilish fabrications, lay them out plainly and without any fear; in every case do
    consult Court Councillor Hahn. He may perhaps be [uncertain: abrasive], but he goes straight and is
    faithfully attached to you. - Spare neither your son nor anyone else; speak the truth in every particular,
    and that without [illegible]. Your children will afterwards have to honour and love you for it. --
    At present I doubt both. The struggle here has been happily sustained, the most splendid course is
    opened; step forward there with head and heart and crown the day - honour, peace and contentment will
    then return, and will attend you to the very edge of the grave. But once more I beg you, do nothing
    without the honest [uncertain: Hahn]. Towards the officials, or properly speaking towards the worshipper
    of the false idol and towards the executor of the testament, you could [illegible] with the dignity
    otherwise proper to you, and avoid all familiarity. Ah, far more heavily will the birds then whistle,
    when the matter truly comes to be spoken of.


    There is no time to be lost; so I now [report] all this to you, better Prince, so that you may be
    forewarned, by a courier as far as Neisse - from Neisse an express courier is to be sent to you, in
    order to get the [uncertain: Ratismann] quickly into your hands -- You need fear nothing more now;
    the aforementioned [uncertain: burgher]-Prince Kagler will and shall give real help - and my noble
    friend ß -- works on as a thoroughly honest man, whom you can never thank enough, with glowing zeal.
    This much today in the greatest haste; the day after tomorrow more. From Gärtner and Göschel I hear
    that the divine man, P[rince] Hard[enberg], takes up the Hohenlohe affair before all others - This
    too will turn out well. It is with the greatest veneration that I remain, until death,


    Your Most Serene Highness''s


    the end of the Congress is still


    not to be foreseen, and is perhaps still far distant


    Vienna, 8 December 1814.


    faithful and obedient servant


    v. Triebenfeld'

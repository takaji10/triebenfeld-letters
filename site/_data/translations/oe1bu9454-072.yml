  en: '72


    Right Honourable Sir, Most Highly Honoured Councillor of War and Forests! In consequence of the news
    Your Right Honourable was last so kind as to communicate to me, I have, ever since receiving it, been
    looking forward from week to week — I might almost say from day to day — to Your Right Honourable''s
    so ardently wished-for arrival with Mr von Brzechffa, and for a long time counted upon it with such
    certainty that on that account I gave up the whole exchange project with


    General von Schimmelpfennig, in accordance with Your Right Honourable''s expressed wish. I am convinced
    that the most compelling reasons may have kept me from Your Right Honourable''s intention, just as,
    in view of Your Right Honourable''s complete silence upon the matters, I cannot but believe that the
    leasing project with Mr von Brzechffa — which Your Right Honourable assured me had been concluded
    on condition of my subsequent approval — must have fallen through again through circumstances that
    have arisen. These conjectures, which force themselves upon me, joined with the need, ever more pressing
    with me, to come at last to a decisive resolution concerning my Polish possessions, are what have
    moved me to give a hearing to an exchange project only lately offered anew, and to grant my permission
    for an inspection of the Zagórów estates. I believe that by my manner of acting I have at all times
    given Your Right Honourable such unequivocal proofs of compliance and of unconditional confidence
    as Your Right Honourable could ever demand, according to the friendly relations subsisting between
    us; at the least I carry about with me the reassuring consciousness'

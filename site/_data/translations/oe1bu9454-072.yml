    my gratitude towards you. // And so I turn to Your Right Honourable with one [uncertain: last] urgent
    request, which consists in this, that you likewise send by the bearer of this the 300 rt in question
    for Lieutenant Sommer, who in a few weeks is resolved to depart from here'

  - de: Zagorower
    en: Zagorowo
    kind: place
- page: 2
  en: that for my part I have exhausted everything that could show you the [text lost] through the forbearance
    and esteem of a friend and in any way demonstrate it, and I therefore flatter myself all the more
    truly with an approval of this step of mine taken without Your Right Honourable's knowledge, since,
    as I shall have the honour to say presently, I have the most pressing occasions for it. With my son
    and sons-in-law, who could spend only a short time with me, I have made the necessary arrangements,
    so far as for the present it could be done, concerning my settlement of affairs, and this depends
    for the greater part upon the outcome of the more or less fortunate completion of my now intended
    exchange project. How greatly, moreover, I am pressed and stormed at from all sides to carry out this
    arrangement with my creditors, I am unable to depict to Your Right Honourable, nor do I wish to be
    burdensome to you therewith, but content myself with the repeated assurance that the pressure of my
    circumstances no longer permits me the least delay, but absolutely compels me to swift and decisive
    resolutions; the conviction of Your Right Honourable's friendly sentiments toward [text lost] instils
    in me the confidence that Your Right Honourable will, with the activity and knowledge of business
    peculiar to you, co-operate in the execution of my [illegible], and since, in order to be able to
    do justice to all, I must also summon up all my powers, I have had to take advantage of an opportunity
    of disposing of my claims upon the Trappyner estates as well. For this purpose the original deed of
    donation
  names:
  - de: Trappyner
    en: Trappyner
    kind: place
- page: 3
  en: '[text lost] two years ago by the [uncertain: Hallkleister Kädlin] notarial instrument, which I
    lately sent to Your Right Honourable, and of which the requisite use has already been made, is indispensably
    necessary, and this is the reason why I am at present sending you my [text lost] by an express messenger,
    to whom you will have the opportunity to convey the same. Your Right Honourable had the same goodness
    in your last letter to assure me that Mr. von Brzechsta, during his presence in Warsaw, would intercede
    on behalf of my [uncertain: Praes. cynes] suit; it would be exceedingly agreeable and gratifying to
    me if Your Right Honourable could now report to me the success of his kind endeavours, so that I might
    accordingly modify my measures. The conviction of Your Right Honourable''s friendly sentiments toward
    me instils in me the confidence that Your Right Honourable will not only approve my steps, but where
    possible most actively assist in the realisation of my plans, since it is of the utmost concern to
    me myself not to be further burdensome to Your Right Honourable through a longer conduct of my Zagorowo
    affairs, and thereby to heap up still further the measure of my gratitude toward the same. And so
    I turn then to Your Right Honourable with a last pressing request, which consists in this, that you
    likewise send by the bearer of this the 300 Rthl in question for Lieutenant Sommer, who in a few weeks
    is resolved to depart from here'
  names:

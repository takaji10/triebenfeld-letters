    [illegible], and of which the requisite use has already been made, [uncertain: impossible] necessary,
    and this is the reason why I am now sending you my [text lost] by an express courier, to whom you
    will have the [uncertain: opportunity] to convey the same. Your Right Honourable had the same kindness

- page: 4
  en: 'for another destination, and without this would be prevented therein to his greatest disadvantage.
    I would not press Your Right Honourable so urgently for it, were I in a condition to make this outlay;
    but as it is, this is at present utterly impossible for me, and I rely in this matter entirely upon
    Your [uncertain: Rahten]. May it please Your Right Honourable to receive the [uncertain: assurance]
    of the unchanging esteem and friendship with which I shall now [illegible] to be'

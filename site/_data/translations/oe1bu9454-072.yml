    towards me inspires in me the confidence that Your Right Honourable will not only approve my steps,
    but if possible most actively [uncertain: assist] in the realisation of my plans, // inasmuch as I
    myself am extremely anxious not to be [uncertain: burdensome] to Your Right Honourable any longer

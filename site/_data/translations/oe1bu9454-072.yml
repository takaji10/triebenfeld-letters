segments:
- page: 1
  en: 'Right Honourable Sir, Most Highly Honoured Councillor of War and Forests! In consequence of the
    reports which Your Right Honourable was last so kind as to communicate to me, I have, ever since receiving
    them, looked forward from week to week — I might almost say from day to day — to Your Right Honourable''s
    so ardently wished-for arrival together with Mr. von Brzechsta, and for a long time counted upon it
    with such certainty that on that account I have given up the whole exchange project with


    General von [uncertain: lohimmelfennig] in accordance with Your Right Honourable''s expressed will.
    I am persuaded that only the weightiest grounds can have held Your Right Honourable back from your
    intention, just as, in view of Your Right Honourable''s complete silence concerning the matter, I
    can believe nothing other than that the leasing project with Mr. von Brzechsta — which Your Right
    Honourable assured me had been concluded on condition of my subsequent approval — must through supervening
    circumstances have fallen through again. These conjectures, which force themselves upon me, together
    with the need, ever more pressing with me, of at last coming to a decisive resolution regarding my
    Polish possessions, are what have moved me to give a hearing to an exchange project only lately proposed
    anew, and to grant my permission for the inspection of the Zagorowo estates. I believe that by my
    manner of acting I have at all times given Your Right Honourable such unequivocal proofs of compliance
    and of unconditional confidence as Your Right Honourable could ever demand under the friendly relations
    subsisting between us; at the least I carry about with me the reassuring consciousness'
  names:
  - de: Brzechsta
    en: Brzechsta
    kind: person
  - de: lohimmelfennig[?]
    en: lohimmelfennig

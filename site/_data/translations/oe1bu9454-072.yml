- page: 2
  en: 'of having exhausted, on my side, everything that could in any way show you the patience, forbearance
    and respect of a friend, and I therefore flatter myself all the more truly with an approval of this
    step of mine, taken without Your Right Honourable''s knowledge, since, as I shall presently have the
    honour to say, I have the most urgent occasions for it. With my son and sons-in-law, who could spend
    only a short time with me, I have made the necessary arrangements, so far as they could be made for
    the present, concerning my settlement, and this depends in great part upon the outcome of the more
    or less fortunate completion of the exchange project I now intend. How greatly I am pressed and besieged
    on all sides to carry out this arrangement with my creditors, I cannot describe to Your Right Honourable,
    nor do I wish to be [uncertain: burdensome] to you with it; rather I [uncertain: content myself] with
    the repeated assurance that the pressure of my circumstances permits me not the slightest further
    respite, but compels me absolutely to swift and decisive resolutions. // The conviction of Your Right
    Honourable''s friendly sentiments towards me inspires in me the confidence that Your Right Honourable
    will, with the activity and knowledge of business proper to you, co-operate in the execution of my
    [illegible]. // And since, in order to be able to satisfy everyone, I must also summon all my powers,
    I have had to take advantage of an opportunity of being able to dispose of my claims upon the Trąbczyn
    estates as well. For this purpose the original deed of gift is'
  names:
  - de: Trąbczyner
    en: Trąbczyn

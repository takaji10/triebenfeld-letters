status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Most Highly Honoured Councillor of War and Forests! In consequence of the
    reports which Your Right Honourable last most kindly communicated to me, I have, since receiving them,
    from week to week — I might almost say from day to day — awaited Your Right Honourable''s so ardently
    wished-for arrival with Herr v. Brzechsta, and for a long time reckoned upon it with such certainty
    that on that account I have given up the whole exchange project with Herr General v. [uncertain: Schimmelpfennig],
    in accordance with Your Right Honourable''s expressed intention. I am convinced that the most cogent
    grounds can have withheld Your Right Honourable — me — from your undertaking; just as, in the face
    of Your Right Honourable''s complete silence upon the matter, I cannot believe otherwise than that
    the leasing project with Herr v. Brzechsta, which Your Right Honourable assured me had been concluded
    under the condition of my subsequent approval, must through supervening circumstances have fallen
    through again. These suppositions, which force themselves upon me, together with the need, ever more
    pressing with me, of coming at last to a decisive resolution regarding my Polish possessions, are
    what have moved me to give a hearing to an exchange project newly proposed to me once more, and to
    grant my permission for the inspection of the Zagorow estates. I believe that by my manner of acting
    I have at all times given Your Right Honourable such unequivocal proofs of compliance and unconditional
    confidence as Your Right Honourable could ever demand according to the friendly relations subsisting
    between us; at the least I carry about with me the reassuring consciousness'
- page: 2
  en: 'that on my side I have exhausted everything that could ever demonstrate to you the [text lost]
    through the forbearance and esteem of a friend, and I therefore flatter myself all the more truly
    with an approbation of this step of mine, taken without Your Right Honourable''s knowledge, since,
    as I shall have the honour to say presently, I have the most urgent occasions for it. With my son
    and sons-in-law, who could spend only a short time with me, I have made the necessary arrangements,
    so far as they could be made for the present, concerning my arrangement, and this depends for the
    most part upon the outcome of the more or less happy completion of my now intended exchange project.
    How greatly, moreover, I am pressed and beset on all sides to carry out this arrangement with my creditors,
    I am unable to depict to Your Right Honourable, nor do I wish to be burdensome to you therewith; but
    I content myself with the repeated assurance that the pressure of my circumstances allows me no further
    respite whatsoever, but compels me altogether to swift and decisive resolutions. The conviction of
    Your Right Honourable''s friendly sentiments towards me inspires in me the confidence that Your Right
    Honourable will, with the activity and knowledge of business peculiar to you, co-operate in the execution
    of my [uncertain: purposes]; and since, in order to be able to do justice to all, I must also summon
    up all my forces, I have had to take advantage of an opportunity of disposing likewise of my claims
    upon the Trappyner estates. To this end the original deed of donation is'
- page: 3
  en: '[text lost] two years ago by the [uncertain: Hallkleister Kädlin] not deed, which I lately transmitted
    to Your Right Honourable, and of which the requisite use has already been made, [uncertain: impossible]
    necessary, and this is the reason why I now send you mine by an express messenger, to whom you will
    have the opportunity to convey the same. Your Right Honourable had the like goodness to assure me
    in your last letter that Herr v. Brzechsta, during his stay in Warsaw, would intercede on behalf of
    my [uncertain: Praes. cynes] suit; it would be exceedingly agreeable and gratifying to me if Your
    Right Honourable could now report to me the success of his kind endeavours, so that [uncertain: darinkeiten]
    I might also modify my measures accordingly. The conviction of Your Right Honourable''s friendly sentiments
    towards me inspires in me the confidence that Your Right Honourable will not only approve my steps,
    but where possible most actively assist in the realisation of my plans, inasmuch as it is of the utmost
    concern to me myself not to be burdensome to Your Right Honourable any longer by a prolonged conduct
    of my Zagorow affairs, and thereby to heap up still further the measure of my gratitude towards you.
    And so I turn then to Your Right Honourable with one last urgent request, which consists in this,
    that you likewise send by the bearer of this the 300 Rthl in question for Lieutenant Sommer, who in
    a few weeks is resolved to depart from here'
- page: 4
  en: 'for another appointment, and without this would be prevented from doing so to his greatest detriment.
    I would not press Your Right Honourable so instantly for it, were I in a position to make this outlay;
    as it is, however, this is at present utterly impossible for me, and I rely in this wholly upon Your
    [uncertain: Rahten]. May it please Your Right Honourable to receive the assurance of the unchanging
    esteem and friendship with which I shall now [uncertain: anschönen] to be'

  en: 'compensation for the estates confiscated from him in the Kalisz department, I [uncertain: find
    myself moved] most respectfully to communicate to Your Right Honourable the information [illegible]
    received later, that, since the Prince of Hohenlohe has let the estates of Trąbczyn with appurtenances
    [uncertain: deteriorate] and has burdened them with debts, the mortgage creditors run the risk of
    losing their capital, leaving it to your discretion to bring this circumstance into the discussion,
    should you support the Prince''s claim for compensation. At the same time I also most respectfully
    request [uncertain: Your] Right Honourable, in case His Majesty the Emperor should deign to grant
    the Prince some compensation, to send word, so that the said creditors may be moved to pursue their
    rights further.


    Berlin, 22 June 1816.


    Ministry of Foreign Affairs, 3rd Section.


    Hoffm[ann].


    B[alan].


    1 Jul[illegible]'

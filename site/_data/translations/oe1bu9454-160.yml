- page: 1
  en: '160


    Most Serene Prince


    Most gracious Prince and Lord!


    It is boundlessly bad how every piece of business is now made difficult here. Only today does the
    Invalids'' Fund release the Seehandlung bonds, after I first had to pledge my poor soul into the bargain,
    and only then am I in a position to satisfy the bank Livi, who was so good as to give the order to
    pay [uncertain: instruction to pay] remitted to Your Serene Highness some days earlier than he had
    the papers from the Invalids'' Fund. The hundred thousand Studen are to follow as soon as the valuations
    have been reviewed by the Chamber. I have arranged with my friends that they are to keep watch on
    the monies, so that no one else snatches them away, and should anyone indeed procure a cabinet order,
    then one had rather risk the interest for a quarter of a year.


    The men of business take 6 per cent. It is much, yet in these hard-pressed times very little, all
    the more as the capital can stand at 5 per cent for half an eternity.


    With Girard I am agreed; to him I have paid 900 Rthl interest and given him a written undertaking
    that I stand surety to him for the due payment of the interest [uncertain: Zetressen]. In return he
    must give me back a written undertaking'

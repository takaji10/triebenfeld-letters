- page: 2
  en: 'that the capital may stand a few years longer without being called in. With Seebald nothing came
    of it, for there 1800 Rthl brokerage were to be paid out again at once; these are now saved. With
    Eysenhard I shall bring the matter into order tomorrow, and without the meddling of other people arrange
    everything for the best. On the 5th I then think certainly to depart from here; I take my route by
    way of Kontop and Glogau, where on account of my being pressed about hither and thither I shall find
    much lent out and vexation enough. For I have missed 2 court terms and shall no doubt be [uncertain:
    contumacious].


    The Olesnica fellows must be thrown out, for the fellows have had protests entered against the estate
    and protest against the dismemberment of the woods because they were to have free firewood. Although
    this is easy enough to attend to, since they are assigned only to a district of 330 Morgen, they are
    nevertheless a [uncertain: hateful] brood which one must get off one''s neck, because I had constantly
    to fear fresh quarrels – the rogues themselves have not given a farthing; rather the subsequent purchasers
    there have paid the 10000 Rthl, and these people undertake to pay the other 10000 Rthl forthwith,
    and to render the interest annually.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, 2 February


    1805


    faithful and obedient servant


    v. Triebenfeld'

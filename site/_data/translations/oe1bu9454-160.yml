status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! It is boundlessly bad how every piece of business
    is now made difficult here. Only today does the Invalids'' Fund release the Seehandlung obligations,
    after I first of all had to pawn my poor soul; and only then am I in a position to satisfy the Bang:
    Livi, who was so good as to give the instruction remitted to Your Serene Highness some days earlier
    than he had the papers from the Invalids'' Fund. The hundred thousand [uncertain: Studen] are to follow
    as soon as the assessments have been revised by the Chamber. I have arranged with my friends that
    they are to keep watch on the monies, so that no other person snatches them away, and if indeed anyone
    should procure a Cabinet order, then one had rather risk the interest for a quarter of a year. The
    men of business take 6 per cent. It is much, yet in these hard-pressed times very little, the more
    so as the capital at 5 pC. can stand for half an eternity. With Gerard I am agreed; to him I have
    paid 900 Rthl interest and given him a written undertaking that I stand surety to him for the punctual
    payment of the interest. In return he must give me a written undertaking again'
- page: 2
  en: 'that the capital may stand some years yet without being called in. With Seebald it came to nothing,
    for there 1800 Rthl Proxeneticum were at once to be given again; these are now saved. With Eysenhard
    I shall bring the matter to a clear footing tomorrow, and without the meddling of other people arrange
    everything in the best way. On the 5th I then think certainly to depart from here; I take my route
    by way of Kontop and Glogau, where, on account of my being pressed about hither and thither, I shall
    have lost much and find vexation enough. For I have missed 2 terms and shall doubtless be held in
    contumacy. The Olesnic fellows must be thrown out, for the fellows have had protestations entered
    against the estate and protest against the dismemberment of the woods, because they were to have free
    firewood. Although this is easily enough seen to, inasmuch as they are assigned only to a district
    of 330 Morgen, still they are a [uncertain: hätten] brood that one must get off one''s neck, because
    one always had to fear new quarrels — the rogues themselves have given not a Heller, but rather the
    after-purchasers there have paid the 10000 Rthl, and these people bind themselves to pay the other
    10000 Rthl forthwith, and to render the interest yearly. In deepest reverence I remain, until death,
    Your Most Serene Highness''s Berlin, 2nd February 1805 faithful and obedient servant v Triebenfeld'

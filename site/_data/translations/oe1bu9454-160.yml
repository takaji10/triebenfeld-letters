- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    It is boundlessly bad how all business is now being made difficult here. Only today does the Invalids''
    Fund release the Maritime Trading Company bonds, after I first had to pledge my poor soul besides,
    and only then am I in a position to satisfy the bank: Livi, who was so good as to give the order to
    pay remitted to Your Serene Highness some days earlier than he had the papers from the Invalids''
    Fund. The hundred thousand pieces are to follow as soon as the valuations


    have been revised by the Chamber. I have arranged with my friends that they are to keep watch on the
    monies so that no one else snatches them away, and if anyone should indeed procure a cabinet order,
    then one had better risk the interest for a quarter of a year.


    The men of business take 6 per cent. It is much, yet in these hard-pressed times very little, all
    the more as the capital at 5 per cent can stand for half an eternity.


    With Gerard I am agreed; I have paid him 900 Rthl in interest and given him a written undertaking
    that I am liable to him for the due payment of the interest. In return he must give me back a written
    undertaking'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    It is boundlessly bad how all business is now made difficult here. Only today does the Invalids''
    Fund release the Maritime Trading Company bonds, after I first had to pledge my poor soul besides,
    and only then am I in a position to satisfy the bank[uncertain: Livi], who was so good as to give
    the order to pay remitted to Your Serene Highness a few days earlier than he had the papers from the
    Invalids'' Fund. The hundred thousand [uncertain: Studen] are to follow as soon as the assessments
    had.


    have been reviewed by the Chamber. I have settled with my friends that they are to keep watch on the
    monies so that no one else snatches them away, and if indeed someone should procure a cabinet order,
    then one had better risk the interest for a quarter of a year.


    The men of business take 6 percent. It is much, yet in these hard-pressed times very little, the more
    so as the capital at 5 per cent can stand for half an eternity.


    With Gerard I am agreed; I have paid him 900 Rthl interest and given him a written undertaking that
    I stand surety for the due payment of the interest. In return he must give me a written undertaking
    back'

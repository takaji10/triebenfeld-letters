- page: 2
  en: 'that the capital may stand a few years more without notice of call. With Seebald it came to nothing,
    for there 1800 Rthl of brokerage were to be given straight away again; these are now saved. With Eysenhard
    I shall put the matter straight tomorrow and, without the meddling of other persons, arrange everything
    for the best. On the 5th I then think certainly to depart from here; I take my route by way of Kontop
    and Glogau, where on account of my being pushed about from place to place I shall find much lost and
    vexation enough. For I have missed 2 appointed terms and shall no doubt be held in default.


    The Olesnice fellows must be thrown out, for the fellows have had protests entered against the estate
    and protest against the dismemberment of the woods because they would have free firewood. Although
    this is easy enough to manage, inasmuch as they are assigned only to a district of 330 Morgen, they
    are nevertheless a [uncertain: hateful] brood that one must get off one''s neck, because one had constantly
    to fear fresh quarrels – the lads themselves have not given a farthing, but rather the subsequent
    purchasers have paid the 10000 Rthl, and these people undertake to pay the other 10000 Rthl forthwith,
    and to render the interest yearly.


    In deepest respect I remain, until death,


    Your Most Serene Highness''s


    Berlin, 2nd February


    1805


    faithful and obedient servant


    v. Triebenfeld'

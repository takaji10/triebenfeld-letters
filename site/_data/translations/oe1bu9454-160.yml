- page: 2
  en: 'that the capital may stand some years yet without being called in. With Seebald nothing came of
    it, for there 1,800 Rthl brokerage fee (Proxeneticum) would at once have had to be given again; this
    is now saved. With Eysenhardt I shall bring the matter to a clear footing tomorrow and, without the
    meddling of other people, arrange everything to the best advantage. On the 5th I then think to depart
    from here for certain; I take my route by way of Konotop and Głogów, where, on account of my being
    driven about, I shall find much lost [uncertain: verliehen] and vexation enough. For I have missed
    2 court dates and shall doubtless be Contenagirt.


    The Oleśnica fellows must be thrown out, for the fellows have had protests entered against the estate
    and protest against the dismemberment of the forests because they were to have free firewood. Although
    this is easily enough seen to, inasmuch as they are assigned only to a district of 330 Morgen, they
    are nevertheless a hätten brood of which one must rid oneself, because one had constantly to fear
    new quarrels — the lads themselves have not given a farthing; rather the later purchasers have paid
    the 10,000 Rthl, and these people undertake to pay the other 10,000 Rthl forthwith, and to discharge
    the interest yearly.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, 2 February


    1805


    faithful and obedient servant


    v Triebenfeld'

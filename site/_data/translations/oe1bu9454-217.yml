- page: 1
  en: 'Right Honourable Sir, Most particularly Highly Honoured Lieutenant! I must indeed be ashamed to
    have left Your Right Honourable''s kind letter so long unanswered with my thanks; did I not count
    upon your kind indulgence, I should not now venture anew to burden you with the present one.


    That I have had to leave [uncertain: Silesia] and [uncertain: Brau], wherein I lived near 49 years
    mostly happy and content, and chose [illegible] for my residence, in order the better to pursue here
    my most pressing affairs, the loss of my fortune, and if possible still to salvage something, will
    perhaps not be entirely unknown to you. Only, the prospects in this matter are not yet very clear,
    and even my old former counsel in [uncertain: Josen], Mr Weltzer, who is now likewise staying here,
    and who believes he knows the Polish justice, has little hope; the Foreign Department has [uncertain:
    pledged] itself on my behalf to the [uncertain: Dresden Huffe], but this one too would have it that

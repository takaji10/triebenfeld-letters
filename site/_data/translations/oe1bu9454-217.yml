status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, most especially Highly Honoured Sir Lieutenant! Handsomely must I indeed
    [uncertain: reading], Your Right Honourable''s kind letter to have left so long thankfully unanswered;
    did I not count upon your kind indulgence, it would not now be from anew of carriages to burden the
    same with my present ones. That I have had to leave Silesia and Brau, wherein I lived for nearly 49
    years, mostly happily and gladly, and chose [this place] for my residence, in order to press my most
    urgent affairs, the loss of my fortune, better here, and if possible still to salvage something, is
    perhaps not entirely unknown to you. Only the prospects in this are still not very clear, and even
    my old former legal agent in Josen, Herr Weltzer, who is now also staying here, and who believes he
    understands the Polish justice, has little hope. The Foreign Department has, on my behalf, [uncertain:
    entrusted itself] to the Dresden court; but this one too, though he holds that the debts previously
    paid'
- page: 2
  en: 'could be pursued, yet as concerns the estates themselves he seeks — apart from there being no official
    command of the Emperor for this — to excuse the Polish judges of that time, and to render the articles
    of the Peace of Tilsit, so far as they bear upon this matter, inapplicable to it. The French envoy
    here, with whom [there was] much [dealing] during my earlier stay here, holds out hope to me in this
    manner: that if no express Imperial command exists for this, and I could give him the official [documents],
    he would take up my [cause]. Finally I have [word] himself from the Saxon court, who says that the
    Dąbska woman petitioned the Emperor at Dresden for the restitution of the estates — that His Imperial
    Majesty merely forwarded her petition to the then Pluish government. Upon this the Pluish commissioners
    ordered that the estates be given back to the Dąbska woman. At present I am occupied [in having] this
    [passed over / overlooked], and shall see how far'
- page: 3
  en: 'the French envoy here will take up this matter, and I have also not failed to give Your Right Honourable
    notice of it at once, so that His Most Serene Highness — to whose graces I beg to be commended — might
    perhaps likewise make use of it. [How] shall I forget the benefactions which I received through this
    Prince; my attachment can and will never die. Has then no sentence yet come out of the first tribunal
    concerning the Prince''s Trombſchyner estates? Would Your Right Honourable have the goodness to let
    me know, 1) if possible in copy — what the Peace [uncertain: Ruhte] has adjudged, and 2ndly what the
    sentence with the tribunal has stated? News I would gladly [send] you in plenty, but what is given
    out here as certain on one day is doubted the next, and on the third a second, often contradictory
    [report] displaces'
- page: 4
  en: 'the first. So much, however, does seem to shine forth from it all, that an early outbreak of the
    war in the North is presumed. Were it clear in the evening, then it would be burning in the North
    — that, I believe, is the conductor. In expectation of a [uncertain: kindly] reply, and of pardon
    for my negligence, I remain, in the most perfect esteem, lifelong, Your Right Honourable''s Berlin,
    the 15th of August 1811 Stralauer Str: No 13 wholly obedient and faithful [uncertain: Euder] servant
    v Sanitz'

- page: 2
  en: 'debts might be recovered; but as concerns the estates themselves, he seeks — setting aside that
    no official command of the Emperor exists for this — to excuse the then Polish judges and to render
    the peace articles of Tilsit, so far as they are in favour of and herein, not applicable to the case.


    The French envoy here, with whom [uncertain: formerly] there was much during my stay here, gives me
    hope in this manner: that if no express Imperial command exists for it, and I could give him the official
    [document], he would take my [cause] upon himself. At length I have it from the Saxon court itself,
    which says that the lady Dąbska in Dresden petitioned the Emperor for the restitution of the estates
    — that His Imperial Majesty merely forwarded her petition to the then [uncertain: Prussian] government.
    Upon this the [uncertain: Prussian] commissioners ordered that the estates be given back to the lady
    Dąbska. At present I am occupied in having this [uncertain: transcribed], and shall see how far'

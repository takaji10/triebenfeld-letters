- page: 1
  en: '217


    Right Honourable Sir, most particularly Highly Honoured Sir Lieutenant! Fine [uncertain: Schönen]
    it must appear of me, to have left Your Right Honourable''s kind letter so long unanswered with due
    thanks; did I not count upon your kind indulgence, I should not now venture anew to burden you with
    my present one.


    That I have had to leave Silesia and Wrocław, wherein I lived nearly 49 years, mostly happy and glad,
    and have chosen [uncertain: bei in] for my residence, in order better to pursue here my most pressing
    affairs — the loss of my fortune — and if possible still to save something, will perhaps not be entirely
    unknown to you. But the prospects in this are as yet not very clear, and even my old former lawyer
    in Poznań, Mr Weltzer, who is now likewise staying here, and who believes he knows the Polish justice,
    has little hope. The foreign department has [uncertain: verraut] itself on my behalf to the Dresden
    [uncertain: Huffe], but this one too, though it will indeed have it that the previously paid'

- page: 4
  en: 'the first. So much, however, does seem to shine out of it all, that an early outbreak of the war
    in the North is presumed. Were it clear in the evening [uncertain: im Abend], then it would burn in
    the North; that, I believe, is the conductor. Awaiting a [uncertain: zütigen] reply and the pardon
    of my negligence, I remain in the most perfect esteem, lifelong, Your Right Honourable''s


    Berlin


    the 15th of August 1811


    Stalauer Str:



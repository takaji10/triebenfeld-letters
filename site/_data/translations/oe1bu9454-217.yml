- page: 2
  en: 'debts might be sought after, yet as concerns the estates themselves, he seeks — [text lost] no
    official order of the Emperor being at hand for this — to excuse the Polish judges of that time, and
    to make the Tilsit peace articles, however much they be in favour and herein, not applicable to it.


    The French envoy here, with whom formerly [uncertain: voriges] there was much during my being here,
    gives me hope in this manner: that if no express Imperial order exists for this, and I could give
    him the official one, he would take my part. Finally I have obtained the same from the Saxon court
    itself, which says that Dąbska in [uncertain: desden] petitioned the Emperor and begged for the restitution
    of the estates — that His Imperial Majesty merely forwarded her petition to the then Polish [uncertain:
    Pluischen] government. Thereupon the Polish commissioners ordered that the estates be given back to
    Dąbska. At present I am occupied in having this [uncertain: Übersehen] left aside, and shall see how
    far'

- page: 4
  en: 'the first. This much, however, does seem to shine forth from it all, that an early outbreak of
    war in the north is surmised. Were it clear in the evening, then it would be burning in the north
    — that, I believe, is the conductor. Awaiting a kindly answer and the pardon of my negligence, I remain
    in the most perfect esteem, lifelong, Your Right Honourable''s


    Berlin


    the 15th of August 1811



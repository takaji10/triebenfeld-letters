- page: 3
  en: 'the French envoy here will take up these matters; nor have I failed [uncertain: verfohlen] to give
    Your Right Honourable notice of it at once, so that His Most Serene Highness — to whose grace I beg
    to be commended — might perhaps likewise make use of it.


    How shall I forget the benefactions I received through this Prince; my attachment can and never will
    die.


    Has then still no sentence come out of the first Tribunal concerning the Prince''s Trąbczyn estates?
    Would Your Right Honourable have the goodness to let me know, 1) if possible in copy — what the justice
    of the peace [uncertain: Friedens Ruhte] adjudged, and 2nd what the sentence with the tribunal has
    stated?


    News I would gladly [uncertain: mit fielen] give you, but what is given out here for certain on one
    day is doubted the next, and on the third a second, often contradictory, one displaces'

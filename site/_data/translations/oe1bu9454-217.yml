- page: 3
  en: 'the French envoy here will take up these matters, and I have also not failed to give Your Right
    Honourable notice of it at once, so that His Most Serene Highness — to whose grace I beg to be commended
    — might perhaps likewise make use of it.


    I shall never forget the benefactions I received through this Prince; my attachment can and will never
    die.


    Is there then still no sentence out of the first tribunal concerning the Prince''s Trąbczyn estates?
    Would Your Right Honourable have the goodness to let me know, 1) if possible in copy — what the peace
    [uncertain: rod] adjudged, and 2nd, what the sentence with the tribunal has declared?


    News I would gladly [give] you in plenty, only what is here given out for certain on one day is doubted
    on the next, and on the third a second, often contradictory, one displaces'

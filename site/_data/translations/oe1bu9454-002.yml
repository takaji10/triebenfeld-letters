- page: 2
  en: 'In all the letters I set out my boundless distress, but above all [uncertain: more skilfully] and
    urgently begged that 200 ducats be sent, because I must hand over 100 Rthl to the Prince Chancellor
    and 70 Rthl to Barben — and this may well be the reason why no letters are said to have arrived there.
    — Hard, more than hard, indeed unjust it is that Your Serene Highness lets me suffer so dreadfully.
    — I go about here a beggar''s dog, and hunger again — Have you then no mercy at all upon me — do you
    then wish that I should become an utter laughing-stock? — I am to be effective and to act with deliberation
    — Only send someone here who will try the thing too with empty hands, indeed with an empty stomach.
    Long I went about like a [uncertain: Laupenhänd] — now I have clothing on my body, to be sure, but
    in exchange a hollow stomach — I am to live off one and another of the men who labour honestly — what
    am I to say to that? B. is beginning to look askance. Only yesterday evening he said to me, this does
    look curious — with those people words are apparently no gospel either — I am still dying of shame,
    and that from [uncertain: Schreitwillen]. And now first of all the Prince: already Jordan has mockingly
    dunned me for the 100 Thl; the thing may end tragically — And I swear before God that I shall not
    [uncertain: go under unblamed] — for here everything is at stake — [uncertain: Hunt] therefore upon
    your letter of today. — The papers all lie with the privy councillor of state Stägemann; had he not
    so frightfully much work, everything would already be settled. The Prince Chancellor wishes you well,
    as does Minister Humboldt, and so does the privy councillor of state Stägemann together with the whole
    bureau — There are two secret adversaries here who would gladly do harm. But they are not likely to
    succeed; the money will be paid and an administrator appointed.'

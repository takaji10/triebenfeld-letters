- page: 1
  en: '2


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness''s letter of the 28th of this month I received half an hour ago, together with
    the reply of Mr von Falkenhausen. Since I have known the contents of the report of the Brzeg Higher
    [uncertain: O. C.] Court these 3 weeks already, I pass over this in silence — Now the shock that Your
    Serene Highness claims to have received no letters from me since the 13th of last month paralyses
    my sense and understanding; since that time I have sent 7 letters from here, in which I reported many
    and important things.


    I have informed Your Serene Highness that I wrote to General Schöler on one of the blank forms concerning
    Trąbczyn, — I have reported that in the same manner I gave a letter of thanks to the privy councillor
    of state Stägemann. I have informed you that I submitted the correspondence of Minister Kircheisen
    etc., which had been sent to me, to the Prince, and sent my letter with it in copy. I have faithfully
    written to you what has happened in this time and what has been said here about Your Serene Highness''s
    affair. I have informed you that even Kálitz is lost to Prussia, and that those districts in which
    the estates lie fall to Russia — and that it will now cost much trouble to hold the same back, because
    there everything is done by money and petticoats.


    I have further informed Your Serene Highness that now Saxony too — at least the fairest part, that
    is from Weissenfeld onwards by way of Dresden and Leipzig as far as Lauban — is going to the devil.
    — I have written to you through whom the greatest intrigues are being forged. In my last letter I
    reported that Wellington has arrived, and that perhaps there is ground to hope'

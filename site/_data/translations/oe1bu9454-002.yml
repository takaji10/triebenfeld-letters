- page: 3
  en: 'The other matters touching Your Serene Highness will take care of themselves. In the Ko: business
    Count Pourt: has already replied — He wishes to buy — [uncertain: Narken] at the moment he can dispose
    of no more than 150/m Rthl in cash — But within a few weeks considerable sums are coming in to him
    from France and England — He has further demanded information about Eris and the other matter, which
    has been given him in the most conclusive terms, since I have the papers here. He does not wish to
    be taken in, for he says he is the father of 7 children.


    We have copied everything out, sent him the assessments, and [uncertain: weill Anfait] set him — for
    Barbe is a thoroughly honest fellow and goes very straight — He has asked you to inform him soon now
    when he is to come to Sławięcice, so that preparations may be made.


    Of the end of the Congress nothing is yet to be heard. And the reports given to Your Serene Highness
    concerning Saxony and Poland are not true — on the contrary, the opposite still stands firm at present
    — One will now see what Wellington will declare — The Russian Empress leaves here on the 18th or 20th
    for Carlsruhe to her mother; [uncertain: V] the Congress ends, the Emperor goes there too, and both
    then come to Berlin.


    For the rest, there is continual talk here of fearful new wars — And even men who otherwise contested
    these rumours eagerly now shrug their shoulders; two ladies and two ministers play [uncertain: verstatt].
    Only our upright Prince Hardenberg stands firm as a rock — Would to God that Wellington''s instructions
    were in accord with his own sentiments — We live in a dreadful period. — May God but direct everything
    for the best — The King of Württemberg grows ever more meek — He receives no other answer to his projected
    constitution than that he is for the present referred to the general constitution now in hand.'

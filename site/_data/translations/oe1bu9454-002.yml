- page: 2
  en: 'In all the letters I have set out my boundless distress, but above all I have asked, with all the
    skill and urgency I could, for 200 ducats to be sent, because I must hand over 100 # to the Prince
    Chancellor and 70 # to Barbe — and this may well be the motive why no letters are supposed to have
    arrived there — It is hard, more than hard, indeed it is unjust, that Your Serene Highness lets me
    suffer so dreadfully — I go about here like a beggar''s dog, and starve again — Have you then no pity
    at all for me — do you then wish that I should become an utter laughing-stock — I am to act, and to
    act with deliberation — Do send someone here who will try the thing too with empty hands, indeed with
    an empty stomach. For a long time I went about like a [uncertain: Laupenhänd] — now I do at least
    have clothes on my body, but in exchange a hollow stomach — I am to live off one man and another,
    off the men who work honestly — what am I to say to that? Barbe is beginning to look askance. Only
    yesterday evening he said to me, this does look odd — with those E: words are surely no gospel either
    — I could still die of shame, and that from [uncertain: Schreitwillen]. And now the Prince first of
    all: Jordan has already dunned me mockingly for the 100 # — the thing may end tragically — And so
    I swear before God that I shall not [uncertain: angerahmen] go under — for here everything is at stake
    — So now to your letter of today — The papers all lie with the privy councillor of state Stägemann;
    had he not so frightfully much work, everything would already be settled. The Prince Chancellor wishes
    you well, as does Minister Wilhelm von Humboldt, and so too the privy councillor of state Mr Stägemann
    along with the whole bureau — There are two secret adversaries here who would gladly do harm. But
    they should not succeed; the money will be paid and an administrator appointed'

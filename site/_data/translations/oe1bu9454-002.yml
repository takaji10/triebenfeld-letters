- page: 4
  en: 'That Prince August has sent the written undertaking is very good, if only he would now also, with
    the utmost speed, cancel the power of attorney for Cosmar and wholly [uncertain: lachirte] it — Cosmar
    will twist and turn before he gives it up, and may well yet do mad things. Here it is necessary that
    the [uncertain: J. Aequit] write at once to the Ministry of Justice, the Chamber Court, the Brzeg
    Higher Provincial Court, and, in Saxony, to the judicial authority under which Oppurg lies, and write
    quickly and without attracting notice to each place, that he has herewith wholly cancelled and annulled
    the power of attorney given to the said Cosmar under such and such a date, and that he therefore declares
    whatever Cosmar may wish or undertake to do in his name to be null and void — indeed the young Prince
    might also have this published in the Berlin and Silesian newspapers — If this is done, then the patron
    is at once flung out to the antipodes — Your Serene Highness, do press this with burning zeal — Grev:
    writes that Madame C. stands in still higher favour with the Minister of Justice than her husband
    — One must therefore arm oneself with her weapons and bar Cosmar every way out.


    Only for God''s sake send the 200 ducats as [uncertain: schenk] as possible; I am in the utmost distress
    and despair, and thereby unable to act with the requisite force.


    In deepest reverence I remain


    Your Serene Highness''s


    P.S. The correspondence subsequently brought in


    with the [illegible] has, with my petition,


    produced a very good effect


    Vienna, the 9th February


    1815


    most faithful and obedient servant


    v Triebenfeld'

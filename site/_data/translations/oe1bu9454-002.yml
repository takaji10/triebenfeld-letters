- page: 3
  en: 'The other matters concerning Your Serene Highness resolve themselves. In the [uncertain: Ko:] affair
    Count Pourt: has already replied — he wishes to buy — [uncertain: but] at the moment he can dispose
    of no more than 150 Rthl in cash — In a few weeks, however, considerable sums are coming in to him
    from France and England — He has further required information about [uncertain: Eris] and the other
    matter, which has been given him in the most conclusive terms, since I have the files here. He does
    not wish to be taken in, for he says he is the father of 7 children.


    We have copied out everything, sent him the assessments and set him [uncertain: weill Anfait] — for
    B. is a thoroughly honest fellow and goes very straight — He has asked you to inform him soon when
    he should come to Schlawenschitz, so that preparations can be made.


    Of the end of the Congress there is as yet nothing to be heard. And the reports given to Your Serene
    Highness concerning Saxony and Poland are not true — rather the contrary still stands firm at present
    — One will now see what Wellington. The [uncertain: Näße] Empress departs from here on the 18th or
    20th for Carlsruhe to her mother, will declare — Should the Congress be at an end, the Emperor goes
    there too, and both then come to [uncertain: Revhir]. For the rest, there is continual talk here of
    dreadful new wars — and even men who formerly contested these rumours zealously now shrug their shoulders.
    Two ladies and two ministers are playing [uncertain: verstatt]. Only our upright Prince Hardenberg
    alone stands firm as a rock — Would to God that Wellington''s instructions were in accord with his
    sentiments — We live in a dreadful period. — May God only turn everything to the best — The King of
    Württemberg grows ever more subdued — He receives no other answer upon his projected constitution
    than that he is referred, provisionally, to the general constitution now in progress.'

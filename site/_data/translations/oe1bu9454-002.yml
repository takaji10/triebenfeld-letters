- page: 4
  en: 'That Prince August has sent the written undertaking is very good, if only he would now also, with
    the utmost speed, revoke the power of attorney for Cosmar and cancel it entirely — Cosmar will twist
    and turn before he gives it up, and may very well yet play mad tricks. Here it is necessary that the
    [uncertain: J. Aequit] write at once to the Ministry of Justice, to the Chamber Court, to the Bruger
    Superior Provincial Court, and into Saxony to the judicial authority under which Oppurg lies, and
    write quickly in every place without attracting notice, that he has herewith wholly revoked and annulled
    the power of attorney given to the said Cosmar under such-and-such a date, wherefore he declares whatever
    Cosmar may wish or may do in his name to be null and void — indeed the young Prince could have this
    made public in the Berlin and Silesian newspapers besides — If this is done, then the fellow is at
    once flung to the antipodes — pray press this, Your Serene Highness, with burning zeal. Grev: writes
    that Madame C. stands in still higher favour with the Minister of Justice than [text lost] one must
    therefore arm oneself with their weapons


    her husband


    and bar to him, the said C., every way out.


    Only for God''s sake send also, as quickly as possible, the 200 [uncertain: ducats]; I am in the utmost
    distress and despair, and thereby unable to act with the requisite force.


    Most reverently I remain


    Your Serene Highness''s


    P.S. The subsequently submitted correspondence


    with the Ministers of Justice has, with my petition,


    produced a very good effect


    Vienna, the 9th of February 1815


    most faithful and obedient servant


    v. Triebenfeld'

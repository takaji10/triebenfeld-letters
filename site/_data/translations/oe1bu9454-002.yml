status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! Your Serene Highness's letter of the 28th of
    last month I received half an hour ago, together with the reply of Herr von Falkenhausen. Since I
    have long known the substance of the report of the Brieg Superior Provincial Court, these three weeks
    already, I pass over this in silence. — Now the shock, that Your Serene Highness claims to have received
    no letters from me since the 13th of last month, paralyses my senses and my understanding; I have
    since that time sent 7 letters from here, in which I reported many and important things. I have informed
    Your Serene Highness that I wrote to Gm. Schöler upon one of the Paranquetter concerning Trąbczin,
    — I have reported that I gave a letter of thanks in like manner to the Privy Councillor of State Stägemann.
    I have informed you that I submitted the correspondence of M. Kircheisen etc., which had been sent
    to me, to the Prince, and sent my own letter therewith in Copy. I have written to you faithfully what
    has happened in this time and what has been said here about Your Serene Highness's affair. I have
    informed you that even Kalisz is lost to Prussia, and that those districts in which the estates lie
    fall to Russia — and that it will now cost much trouble to hold the same back, because there everything
    is done by money and petticoats. I have further reported to Your [Serene Highness] that now Saxony
    too — at least the fairest part, that is, from Weissenfeld onward over Dresden, Leipzig, as far as
    Lauban — the devil takes. I have written to you by whom the greatest intrigues are being forged. In
    my last letter I reported that Wellington has arrived, and that perhaps one may hope thereby.
- page: 2
  en: 'In all the letters I have described my boundless distress, but above all urgently begged that 200
    ducats be sent, because I must hand over 100 Rthl to the Prince Chancellor and 70 Rthl to Barben —
    and this may well be the reason why no letters are said to have arrived there. — Hard, more than hard,
    indeed unjust it is that Your Serene Highness lets me suffer so dreadfully. — I go about here a beggar-dog,
    and hunger besides. — Have you then no compassion at all for me — do you then wish that I should become
    wholly a laughing-stock? — I am to be effective and to act with deliberation. — Send someone else
    here, then, who with empty hands, indeed with an empty stomach, may also try the thing. For a long
    time I went about like a ragamuffin — now, it is true, I have clothes on my body, but in exchange
    a hollow stomach. — I am to live off one and another of the men who work honourably — what am I to
    say to that? B. begins to look askance. Only yesterday evening he said to me, this does look curious
    — with those E: are words not gospel either? — I am still ashamed to death, and that from [uncertain:
    Schreitwillen]. And now first of all the Prince: already Jordan has mockingly dunned me for the 100
    Thl; the thing may end tragically. — And so I swear by God that I shall not go under unavenged — for
    here everything is at stake. — So I hunt upon your letter of today. — The papers all lie with the
    Privy Counsellor of State Stägemann; had he not so appallingly much work, everything would already
    be settled. The Prince Chancellor wishes you well, as does the Minister Humboldt, and so does the
    Privy Counsellor of State W. Stägemann with the whole bureau. — Two secret adversaries are here who
    would gladly do harm. But they will not succeed: the money will be paid and an administrator appointed.'
- page: 3
  en: 'The other matters concerning Your Serene Highness will settle themselves. In the Ko: affair Count
    Pourtalès has already answered — he wishes to buy — only at the moment he can dispose of no more than
    150 Rthl in cash — but within a few weeks considerable sums will come in to him from France and England.
    — He has further demanded information about Eris and the other matter, which has been given him in
    the most conclusive manner, since I have the records here. He does not wish to be taken in, for he
    says he is the father of 7 children. We have copied out everything, sent him the assessments, and
    set him [uncertain: weill Anfait] — for B. is a thoroughly honest fellow and goes very straight. —
    He has asked you to inform him soon when he is to come to Schlawentzitz, so that preparations may
    be made. As to the end of the Congress, nothing is yet to be heard. And the reports given to Your
    Serene Highness concerning Saxony and Poland are not true — rather, the contrary still stands firm
    at present. — One will now see what Wellington — the [uncertain: Näße] Empress departs from here on
    the 18th or 20th for Carlsruhe to her mother — will declare. — [If] the Congress is at an end, the
    Emperor goes thither also, and both then come to [uncertain: Revhir]. For the rest, there is continual
    talk here of fearful new wars — and even men who otherwise eagerly disputed these rumours now shrug
    their shoulders. Two ladies and two ministers are playing [uncertain: verstatt]. Only our upright
    Prince Hardenberg alone stands firm as a rock. — Would to God that Wellington''s instructions were
    in accord with his own sentiments. — We live in a dreadful period. — May God only turn all to the
    best. — The King of Würtemberg grows ever more subdued — he receives no other answer to his projected
    constitution than that he is referred provisionally to the General Constitution now in hand.'
- page: 4
  en: That Prince August has sent the written undertaking is very good, if only he would now also, with
    the utmost dispatch, revoke the power of attorney for Cosmar and wholly cancel it. — Cosmar will twist
    and turn before he gives it up, and may very well yet do mad things. Here it is necessary that the
    young Prince write at once to the Ministry of Justice, to the Kammergericht, to the Bruger Ober Landes
    Gericht, and to Saxony to the judicial authority under which Oppurg lies — and write quickly and without
    attracting notice in every place — that he has herewith entirely revoked and cancelled the power of
    attorney given to the said Cosmar on such and such a date, and therefore declares whatever Cosmar
    may wish or presume to do in his name to be null and void. — Indeed the young Prince might have this
    made known in the Berlin and Silesian newspapers as well. If this is done, then the patron is at once
    flung to the Antipodes. — Let Your Serene Highness pursue this with glowing zeal. Grävenitz writes
    that Mad. C. stands in still higher favour with the J. M. than before; one must therefore arm oneself
    with her own weapons, and bar every way out to her husband and to him, the E. Only, for God's sake,
    send also as quickly as possible the 200 ducats; I am in the utmost distress and despair, and thereby
    unable to work with proper force. Reverentially I remain Your Serene Highness's — N.S. The correspondence
    subsequently produced with the H. H. M. has, together with my submission, had a very good effect.
    Vienna, the 9th of February 1815, most faithful and most obedient servant v. Triebenfeld

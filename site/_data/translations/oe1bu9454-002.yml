- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness''s letter of the 28th of last month I received half an hour ago, together with
    the reply of Herr Falkenhausen. Since I have long known the content of the report of the Bruger [uncertain:
    OC] court — these three weeks past — I pass over this in silence. — But now the shock that Your Serene
    Highness is said to have received no letters from me since the 13th of last month paralyses my senses
    and my understanding; I have in that time sent 7 letters from here, in which I reported many and important
    things.


    I informed Your Serene Highness that I had written to Mr. Schöler on one of the [uncertain: Paranquetter]
    concerning Trąbczyn, — I reported that I had in like manner given a letter of thanks to the privy
    councillor of state Stägemann. I informed you that I had submitted the correspondence of Mr. Kircheisen
    etc., which had been sent to me, to the Prince, and had sent my own letter with it in copy. I have
    faithfully written to you what has happened in this time and what has been said here about Your Serene
    Highness''s affair. I informed you that even Kalisz is lost to Prussia, and that those districts in
    which the estates lie fall to [uncertain: Russia] — and that it will now cost much trouble to hold
    the same back, because there everything is done by money and petticoats.


    I further informed Your Serene Highness that now Saxony too — at least the finest part, that is from
    Weissenfeld onward over Dresden and Leipzig as far as Lauban — the devil is carrying off. I wrote
    to you by whom the greatest [uncertain: cabals] are being forged. In my last letter I reported that
    Wellington has arrived, and that perhaps one may hope from that.'

segments:
- page: 1
  en: 'Berlin, 31 December 1800. To the South Prussian Government at Warsaw.


    ex officio Friedrich Wilhelm, King, etc. Our, etc. By the rescript of the 7th of this month We instructed
    you to undertake the drawing up of the judgment of first instance in the lawsuit pending between the
    guardian of Michalina von Prusimska and the Prince of Hohenlohe-Ingelfingen concerning the recovery
    of the Brzyce estates. The Poznań Government has, however, reported that the judgment was already
    drawn up by it on the 9th, and so before the arrival of the order issued to it, and the rescript cited
    above can consequently have no application; of which We hereby give you notice for your information.
    And are, etc. Berlin, 31 December 1800. By command


    G[oldbeck]


    acc. the 2nd.


    ad rec. the 3rd.


    [uncertain: enclosures] lie with it.


    5 January 1801, to the post. Bamuzut[illegible]


    the 4th Schroener


    3 Jan.'

- page: 1
  en: '247


    Most Serene Prince


    Most gracious Prince and Lord!


    Poland''s fate too has been decided, and a more favourable lot has fallen to us than had been thought.
    For Your Serene Highness there is now nothing that need be begged for on the intervening side — Now
    the affairs of the Empire will doubtless soon come up; of what the Privy Councillor Goerch has submitted
    on behalf of the whole House of Hohenlohe a copy follows herewith — His Excellency the Minister Wilhelm
    von Humboldt has promised me to support Your Serene Highness''s cause particularly. Upon the piece
    submitted before me through the Prince State Chancellor, of which I sent the copy by the last post,
    His Serene Highness at the first presentation was graciously pleased to express himself in these words:
    "The money is a trifle, that shall be given, since so much can be effected thereby; but with the judiciary
    we shall doubtless get a great deal of noise over the annulment of the settlement, the more so as
    the old Prince himself approved it. Meanwhile it is remarkable that the late Princess disposed of
    the revenues of the entailed estates and appointed an executor of the testament — the estates never
    belonged to her at all." I have once again set everything out properly, in particular that Cosmar
    drove the old [uncertain: Kerrigen] Princess, on account of the Courland loan which the former Prince
    of Hohenlohe co-signed, to despair, and brought her to the point that, on the edge of the grave, she
    put her mark beneath the false settlement forged by Cosmar, and allowed so many debts to be entered
    in it, whereby all the other creditors were to be pushed back.


    I maintain that the old Princess could not after her death have the least share in'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Palen''s fate too is decided, and for us a more
    favourable lot has fallen than was believed. For Your Serene Highness there is now nothing that needs
    to be begged for on the intervening side — [uncertain: Hunt/soon] the affairs of the Empire will doubtless
    come up before long; what the Privy Councillor Goerch submitted on behalf of the whole House of Hohenlohe
    follows here in Copy. — His Excellency the Herr Minister von Stumbolt has promised me to support Your
    Serene Highness''s cause in particular. Upon the piece submitted before me through the Prince State
    Chancellor''s office, of which I sent the Copy by the last post, His Serene Highness was pleased,
    at the first report, to express himself most graciously in these words: The money is a trifle, that
    shall be given, since so much can be gained thereby; but with the Justice department we shall doubtless
    have much noise on account of the annulment of the Transact, all the more since the old Prince himself
    approved it. Meanwhile it is remarkable that the deceased Princess Sacken disposed of the revenues
    of the entailed estates and appointed an executor of the testament, whereas the estates never belonged
    to her. I have once more set everything out properly, in particular that Cosmar, on account of the
    old [uncertain: Kering] Princess, in the matter of the Courland loan which the former Princes of Hohenlohe
    co-signed, drove her to despair and brought her to the point that, on the brink of the grave, she
    set her cross beneath the false Transact forged by Cosmar, and allowed it to happen that so many debts
    were entered therein, whereby all the other creditors were to be pushed back. I maintain that the
    old Princess, after her death, could not have had the least share in'
- page: 2
  en: 'the revenues of the entailed estate, still less after her death [text lost] because with her death
    her Advitalität-right was to lapse, and [text lost] Cosmar pronounced as guardian of the minor female,
    so this ceases when [text lost] the Princes Adolph and Alexander should come of age; and since the
    former did not [text lost] receive estates, but was the sole heir of the estate left by the Prince
    Sacken [text lost] Cosmar has nothing whatever to do with the entailed estates and would have to be
    [text lost] dismissed here. — Meanwhile Prince Adolph would within a year and a day — all [text lost]
    be of age in 2 to 3 years, whereupon his whole interference also ceases; the [text lost] would receive
    merely, as [uncertain: höhe], an appanage of 1200 Rthl out of the entailed estates. All the apprehensions
    of E. Sackin, which had induced her and even the Prince to sign the notorious Transact swindled up
    by Cosmar in fraudem tertii, would cease the moment the Courland heirs had been satisfied. And that
    can now be done with 112000 Rthl. Not only on this account had a settlement already been reached with
    the mandatary of the [uncertain: Lage] heirs, as was said in the earlier submission, but also with
    the other creditors it had been so arranged and satisfied that they would be content with 12000 Rthl
    yearly for as long as the Prince lives. — Upon the question — but will the estates really yield so
    much that the 112000 Rthl and everything the deed of foundation specifies, and also the 12000 Rthl
    to the other creditors, can be paid? Answer: Certainly. — I have laid at His Serene Highness''s feet
    the proof of the yield and of the sums to be paid. — Well! my friend, it comes then to their [illegible]
    v. security. The two Emperors and the King, with [uncertain: Pfar] Wilhelm, returned to Hungary last
    night. The King of Bavaria of Deresemberg meanwhile remained here with their hereditary prince, as
    did the King of Denmark. Grand Duke Constantin had meanwhile been viewing places abroad. — Respectfully
    I remain, until death, Your Serene Highness''s, Vienna, the 28th of October 1814, humble and obedient
    servant v Triebenfeld'

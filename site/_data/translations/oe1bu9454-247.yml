- page: 2
  en: 'the revenues of the entailed estate, still less after her death[text lost] because with her death
    her right of life-tenure was to lapse, and[text lost] Cosmar as guardian of the minor pronounced,
    so this would cease [text lost] the Princes Adolph and Alexander were of age for the entailed estate,
    and since the former did not[text lost] received estates, but as the sole heir of the estate of the
    Princes Sacken[text lost] Cosmar has absolutely nothing to do with the entailed estates and must here[text
    lost] be dismissed — Meanwhile Prince Adolph would in a year and a day — all[text lost] in 2 to 3
    years be of age for the entailed estate, whereupon his whole interference would also cease; the [text
    lost] would receive merely, as higher, an appanage of 1200 Rthl out of the entailed estates. All the
    apprehensions of the P. Sackin, which had induced her and even the Prince to sign the notorious settlement
    wheedled in fraudem tertii by Cosmar, would cease the moment the Courland heirs had been satisfied.
    And this could now be done with 112000 Rthl. Not only on this account, as was said in the earlier
    submission, had a composition already been made with the agent of the heirs of the estate, but agreement
    had also been reached with the other creditors to the effect that they would be content with 12000
    Rthl yearly for as long as the Prince lives — To the question — but will the estates really yield
    so much that the 112000 Rthl and everything the deed of foundation specifies, and also the 12000 Rthl
    to the other creditors, can be paid? Answer: Certainly – I have laid at His Serene Highness''s feet
    the demonstration of the yield and of the sums to be paid -


    Well! my friend, it turns then upon their [uncertain: Oe] and security. The two Emperors and the King,
    with [uncertain: Pfar] Wilhelm, returned to Hungary last night. The King of Bavaria of Deresemberg
    remained here in the meantime with their hereditary prince, as did the King of Denmark. Grand Duke
    Constantine had meanwhile been viewing places outside the city - Respectfully I remain, until death,


    Your Serene Highness''s


    Vienna, the 28th of October


    1814.


    humble and obedient servant


    v. Triebenfeld'

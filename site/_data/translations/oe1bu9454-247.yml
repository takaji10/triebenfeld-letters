- page: 2
  en: 'the revenues of the entailed estate, still less after her death [text lost] because with her death
    her right of life-interest was to lapse, and [text lost] Cosmar having been declared guardian of the
    minor, this ceases when [text lost] Princes Adolph and Alexander were of age, and since the former
    did not [text lost] receive estates, but was the sole heir of the estate of the Princes Sacken [text
    lost] Cosmar has nothing whatever to do with the entailed estates and would have to be [text lost]
    dismissed here — Meanwhile Prince Adolph would be, within a year and a day — all [text lost] of age
    in 2 to 3 years, whereupon his whole interference likewise ceases, the [text lost] would receive merely,
    as a higher [uncertain: höhe], an appanage of 1200 Rthl out of the entailed estates. All the anxieties
    of Princess Sacken, which had induced her and even the Prince to sign the notorious settlement swindled
    through by Cosmar in fraudem tertii, would cease at once if the Courland heirs were satisfied. And
    that can now be done with 112000 Rthl. Not only on this account had, as was said in the earlier submission,
    an agreement already been reached with the attorney of the heirs of the estate, but the other creditors
    had also been so far brought round that they would be content with 12000 Rthl yearly for as long as
    the Prince lives — To the question — but will the estates really yield so much that the 112000 Rthl
    and everything that the deed of foundation states, and also the 12000 Rthl to the other creditors,
    can be paid? Answer: Certainly – I have laid at His Serene Highness''s feet the proof of the yield
    and of the sums to be paid —


    Well! my friend, it turns then upon your [uncertain: Oe] surety. The two Emperors and the King with
    [uncertain: Pfar] Wilhelm returned last night to Hungary. The King of Bavaria of [uncertain: Deresemberg]
    meanwhile remained here with their hereditary princes, as did the King of Denmark. Grand Duke Constantine
    had meanwhile been viewing places abroad — Respectfully I remain, until death,


    Your Serene Highness''s


    Vienna, the 28th of October


    1814.


    humble and obedient servant


    v. Triebenfeld'

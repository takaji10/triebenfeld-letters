- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Poland''s fate too has been decided, and a more favourable lot has fallen to us than had been believed.
    For Your Serene Highness there is now nothing that need be begged for on the intervening side — the
    affairs of the Empire will doubtless soon come up for hunting [uncertain: Jagt], of which what the
    Privy [uncertain: Ir] Goerch submitted on behalf of the whole House of Hohenlohe follows here in copy
    – His Excellency the Minister von Humboldt has promised me to support Your Serene Highness''s cause
    particularly. Upon the paper submitted before me through the Prince State Chancellor''s office, of
    which I sent the copy by the last post, His Serene Highness was pleased most graciously to express
    himself at the first report in these words: The money is a trifle, that shall be given, since so much
    can be gained thereby; but with the Justice department we shall doubtless get much noise over the
    annulment of the settlement, the more so as the old Prince himself approved it. Meanwhile it is remarkable
    that the deceased Prince''s Sacken affairs disposed of the revenues of the entailed estates and appointed
    an executor of the testament; the estates never belonged to her at all. I have once more set out everything
    properly, and in particular that Cosmar drove the old [uncertain: Kering] Princess, on account of
    the Courland loan which the former Princes of Hohenlohe co-signed, to despair, and brought her to
    the point that, on the edge of the grave, she subscribed the false settlement forged by Cosmar, and
    allowed it to happen that so many debts were entered therein, whereby all other creditors were to
    be pushed back.


    I maintain that the old Princess after her death could not have the least share in'

- page: 2
  en: 'the revenues of the entailed estate, still less after her death [text lost] because with her death
    her right of survivorship (advitalitium) was to lapse, and [text lost] Cosmar declared as guardian
    of the minor, so this ceases wh[text lost] the Princes Adolph and Alexander were of age, and since
    the former did not [text lost] receive estates, but was the sole heir to the estate of the Prince
    Sacken [text lost] Cosmar has nothing whatever to do with the entailed estates and would have to be
    [text lost] dismissed from here — Meanwhile Prince Adolph would within a year and a day — at all [text
    lost] in 2 to 3 years be of age, whereupon his whole interference also ceases; the [text lost] would
    receive merely, as a higher appanage, 1200 Rthl out of the entailed estates — All the apprehensions
    of the Princess Sacken, which had induced her and even the Prince to sign the notorious settlement
    forged by Cosmar in fraudem tertii, would cease the moment the Courland heirs had been satisfied.
    And this could now be done with 112/m Rthl. Not only on this account had, as stated in the earlier
    submission, a composition already been made with the mandate of the heirs of the [uncertain: Lage],
    but with the other creditors too it had been brought to the point that they would be content with
    12000 Rthl yearly for as long as the Prince lives — To the question — but will the estates really
    yield so much that the 112000 Rthl and everything the deed of foundation states, and also the 12000
    Rthl to the other creditors, can be paid? Answer: Certainly — I have laid at His Serene Highness''s
    feet the statement of the yield and of the sums to be paid — Well then, my friend, it concerns your
    60/m Rthl security — The two Emperors and the King, with Prinz Wilhelm von Preußen, returned to Hungary
    last night. The King of Bavaria and the King of Württemberg had meanwhile remained here with their
    hereditary princes, as had the King of Denmark. The Grand Duke Constantine had meanwhile been viewing
    places outside the city — Respectfully I remain, until death,


    Your Serene Highness''s


    Vienna, the 28th of October


    1814.


    humble and obedient servant


    v Triebenfeld'

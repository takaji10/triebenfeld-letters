- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Palen''s fate too has been decided, and for us a more favourable lot has fallen than had been believed.
    For Your Serene Highness there is now nothing that need be begged for on the intervening side — [uncertain:
    Jagt] the imperial affairs will doubtless soon come up; of what the Privy Councillor Goerch submitted
    on behalf of the whole House of Hohenlohe a Copy follows here – His Excellency the Minister von Stumbolt
    has promised me to support Your Serene Highness''s cause in particular. Upon the piece submitted before
    me through the Prince State Chancellor''s office, of which I sent the Copy by the last post, His Serene
    Highness at the first report was graciously pleased to express himself in these words: The money is
    a trifle, it should be given, since so much can be obtained thereby; but with the judiciary we shall
    no doubt get much noise on account of the annulment of the settlement, all the more since the old
    Prince himself approved it. Meanwhile it is remarkable that the deceased F. Sachen disposed of the
    revenues of the entailed estates, and appointed an executor of the testament — the estates never belonged
    to her at all. I have once more set the whole matter out properly, and in particular that Cosmar,
    on account of the old [illegible] Princess, over the Courland loan which the former Princes of Hohenlohe
    co-signed, drove her to despair and brought her to the point that, on the brink of the grave, she
    signed with a cross the false settlement forged by Cosmar, and allowed it to happen that so many debts
    were entered therein, whereby all the other creditors were to be pushed back.


    I maintain that the old Princess after her death could not have had the least share in'

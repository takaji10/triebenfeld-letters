- page: 3
  en: 'lease and had removed all difficulties in such a manner that Your Serene Highness was released
    from the obligation (ex nexu).


    From Pszczew I go to Kalisz and Trąbczyn, arrange everything there, see what money I can gather in
    at that place, and hasten back here with it in order to smooth out the principal business. Eighteen
    days from today I expect to be in Berlin again, and if all now goes as wished, I shall then perhaps
    myself bring to Öhringen the sum desired by Your Serene Highness.


    The constellations, moreover, are now very evil, and it is much wished here that Your Serene Highness
    might be quite soon entirely restored to health, and that you would take your return journey by way
    of Berlin. Through my long stay here I was lately very nearly placed in a favourable situation. The
    Głogów government had ordered that the 30000 rt of the von Wulffen lady which stand upon Konotop be
    paid. The mandates had been left lying in Wrocław, so that I knew nothing of it until they fell upon
    my neck here. In the meantime the upright General at once helped here; he gave me in cash what I needed,
    and the Lord Grand Chancellor had 200000 rt paid upon the one mortgage, and so these two honest men
    provided me — Now I have full quiet and can attend to all Your Serene Highness''s affairs.


    With unbounded reverence I remain, as Your Serene Highness''s


    Berlin, the 17th of June


    1806.


    faithful, humble and obedient servant


    v Triebenfeld'

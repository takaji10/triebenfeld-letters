- page: 3
  en: 'lease and had removed all difficulties in such a manner that Your Serene Highness were, as it was
    said, ex nexu.


    From Betsche I go on to Kalisz and Trąbczyn, arrange everything there, see what money I can drive
    together in that quarter, and hasten with it back here in order to smooth out the principal business.
    Eighteen days from today I expect to be in Berlin again, and if all now goes as wished, then I shall
    perhaps myself bring to Öhringen the sum Your Serene Highness desires.


    The constellations, for the rest, are at present very evil, and it is much wished here that Your Serene
    Highness might only be quite fully restored to health very soon, and that you would take your return
    journey by way of Berlin. Through my long stay here I was lately very nearly placed in a favourable
    [uncertain: Lutuation]. The Glogau Government had ordered that the 30000 Rthl standing upon Kontop
    be paid to the von Wulffen woman. The mandates had been left lying in Breslau, so that I knew nothing
    of it until it was brought down on my neck here. Meanwhile the upright General helped at once – he
    gave me in cash what I needed, and the Lord High Chancellor had 200000 Rthl paid upon one mortgage,
    and thus these two honest men furnished me – Now I have complete quiet and can attend to all Your
    Serene Highness''s affairs.


    With unbounded veneration I remain as


    Your Serene Highness''s


    Berlin, the 17th of June


    1806.


    faithful, humble and obedient servant


    v. Triebenfeld'

- page: 1
  en: '187


    Most Serene Prince


    Most gracious Prince and Lord!


    The powers of attorney and the blank forms have arrived; of the first I at once made the necessary
    use, and I am now assured of the best success — through the mediation of the worthy General and of
    the other gentleman — the Lord Grand Chancellor will give 90000 rt out of the Justice Fund — out of
    which I shall pay the 3 most restive creditors — that is, Weigel, the Schlabrendorff lady and Lichnowski.


    The last named must return to me 20000 rt against a Świniary mortgage which I pledge to him; 10000
    rt I must contrive to raise in like manner, and then Your Serene Highness will receive the desired
    30000 rt.


    It is a bad thing that the mortgage certificate of the Zagórów and Trąbczyn estates is so motley;
    nobody will lend any further upon it — what is given is against Jura Ca[uncertain: u]sa. In time,
    however, it will all be manageable.


    My single endeavour is to be rid, and soon, of Oppenheimer, who last year promised to give 160000
    rt and who worked upon Amelang'

- page: 2
  en: 'only, so that I may get back the mortgage of 250000 Rthl.


    The scoundrel had claims of his own upon Olesnica. 20000 fl. He undertook to pay the Invalids'' Fund
    50000 Rthl, Lichnowski


    36000


    Meyer Bernhard


    7600.


    Which is 113600 Rthl. Of all these he has paid only 32000 Rthl to Lignowchen, together with the money
    which Your Serene Highness received at Fürth, and notwithstanding this the fellow reckons the whole
    Pro[uncertain: x]enitirum[uncertain: Pro?enitirum] at 11000 Rthl. Once I am clear of Weigel and the
    others, I shall apply everything to paying this Gmür what he has actually given, and shall at once
    procure the return of the above-named mortgage, which is thereby annulled eo ipso, whereby the matter
    then takes on a quite different shape.


    Today I go to Beteche, and there to set everything in order, and above all to stop the mouth of that
    wretched Jew, Meyer Bernhard. The fellow has brought an action against Your Serene Highness, notwithstanding
    that I had made it known to the knave that His Majesty had approved the Betsche'

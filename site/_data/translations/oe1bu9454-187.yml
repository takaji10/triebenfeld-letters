- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The powers of attorney and the blank forms have arrived; of the first I have at once made the necessary
    use, and I am now assured of the best success – through the mediation of the worthy General and of
    the other gentleman – the Lord High Chancellor will give 90000 Rthl out of the Justice Fund – out
    of this I shall pay the 3 most restive creditors – that is, Weigel, the Schlabrendorff woman, and
    Lichnowski. The last-named must return to me 20000 Rthl against a Schweiner mortgage which I pledge
    to him; 10000 Rthl I must contrive to raise in this way, and then Your Serene Highness will receive
    the desired 30000 Rthl. It is a bad thing that the mortgage certificate of the Zagorowo and Trąbczyn
    estates is so motley; no one will lend further upon it – what is given is against Jura Caisa. In time,
    however, all of it will be made to work out.


    My sole endeavour is to be rid soon of Oppenheimer, who last year promised to give 160000 Rthl and
    who worked upon Amelang'

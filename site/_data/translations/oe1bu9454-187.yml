- page: 2
  en: 'only, so that I may get back the mortgage of 250000 rt.


    The scoundrel himself had a claim upon Oleśnica of 20000 rt; he undertook to pay the Invalids'' Fund
    50000 rtl, to Lichnowski 36000 rt.


    to Meyer Bernhard 7600.


    That is 113600 rt.


    Of all these he has paid only 32000 rt to Lichnowchen, together with the money which Your Serene Highness
    received at Fürth, and notwithstanding this the fellow reckons the whole brokerage to himself at 11000
    rt.


    Once I am clear of Weigel and the other, I shall apply everything to making this [illegible] pay what
    he has really given, and shall at once procure the above-named mortgage back, which is thereby annulled
    eo ipso, whereby the matter then takes on quite another shape.


    Today I go to Pszczew, and there to set everything in order, in particular to stop the mouth of that
    wretched Jew Meyer Bernhard. The fellow has brought suit against Your Serene Highness, notwithstanding
    that I had made it known to the knave that His Majesty had approved the Pszczew'

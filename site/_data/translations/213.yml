status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Of my illness I am cured; my first way was to
    Konin in order to set right what was owing to the State and at last to have the oppressive sequestration
    wholly [uncertain: done away with]. On the way, however, I had the misfortune to be overturned and
    to have my head so crushed that on one side I may pass for an African and on the other for a European.
    Meanwhile I hope to be restored within a couple of weeks. For the rest, I have brought matters, by
    the exertion of all human powers, so far that the State dues, on account of which chiefly the sequestration
    continues, are paid all but 900 Rthl; and since the suit with the propination-rights lessee lies before
    the Kalisch Tribunal in a form where Nassals must pay 3000 Rthl at once, I hope in the coming week
    to set right not only the [uncertain: remainder] of the dues but also the interest on the bank capital,
    and thereby to remove entirely the costly sequestration. With regard to the sums from the Invalids''
    Fund, Mendel Qquen humer, Weigel, Haugt, Seher Thor etc., I shall set myself upon my hind legs, to
    which end the dispositions of the Tribunal and of the Land Court, and also the attestations in the
    original, will be despatched to Berlin tomorrow by express courier — for if the Bielsh plan, that
    interest and capital are to be paid over 40 years at 6 per cent, has already, as is said, been accepted,
    on which account too the new'
- page: 2
  en: 'attachment has already been laid, then one need give no man a good word any longer. Indeed it were
    to be wished that in Silesia a like benefice were granted to the estate owners. Here all may become
    happy through this grace. Sad it is, for the rest, here, that I must bring everything before the judge
    and recover every Groschen by the path of law; [uncertain: Boldly] through the new dispositions of
    the Emperor of the French and of the King of Saxony, every man refuses to [uncertain: pay] a Groschen.
    Every [uncertain: cure] says: the Prince is a foreigner, to him we need pay nothing; I must therefore,
    of sheer necessity, have all the refractory held to their duty by the judge, and on that account there
    are already some 43 [uncertain: suits] pending. The most considerable are: 1. With Niedzewiecki concerning
    6000 Rthl; here I doubt that one obtains anything [text lost]. 2. With Nossalski concerning 3000 Rthl;
    this one will be won in [uncertain: a few] days, and he is rich. 3. With the 3 Olesnicer lads for
    about 33000 Rthl; these fellows can pay nothing; if only they can be got out, then the Polish peasants
    will step into the contract, pay 10000 Rthl entry-money and the yearly rent of 2000 Rthl. 4. With
    the Wrabczyner peasants for arrears of rent, 1200. These fellows say they were cheated at the conclusion
    of the contract in Breslau and will not keep the contract unless they get an abatement — I shall gladly
    consent to the annulment of the contract, take everything from the fellows, and, as the laws permit,
    chase them out to the [uncertain: fee], the more so as I have people enough already, namely Poles,
    who will give 2000 Rthl in cash for the holding and the same rent — this amounts, for 9 whole and
    2 half peasant holdings, to 20000 Rthl. 5. A suit has long been pending with the Kopojno, Skokumer
    and Swiątniker peasants concerning the lands; this has already been won in the Land Court and lies
    before the Tribunal for approbation — the people must reimburse 742 Rthl in costs, which will not
    fall hard upon them.'
- page: 3
  en: '6. With Berda, who has a [uncertain: spiritual] privilege according to which he is to have only
    23 Morgen of land, but who has secretly appropriated some 70 Morgen, and who is to pay some 1190 Rthl
    of rent in arrears. 1190 Rthl. The fellow refuses to pay; I therefore wish the contract annulled;
    for the holding I shall then at once receive 3000 Rthl in cash and a higher rent than at present.
    7. With 8 Hauländer who owe some 5000 Rthl of purchase-monies — 5000 Rthl. This suit will be won,
    the holdings taken in and let out afresh — whereupon the 5000 Rthl come in, but the fellows go away
    empty. 8. With Ribbeck at Drzewce concerning 225 Rthl of arrears of rent — this suit is compounded;
    Ribbeck pays the 225 Rthl on the 1st of April of this year on pain of losing his goods. 9. With the
    miller M[uncertain: e]x of Swięcia concerning 500 Rthl of purchase-money and interest. The suit has
    been somewhat held back because the [uncertain: miller] promises to pay within 4 weeks. 10. 29 suits
    with the colonists, who owe 39000 Rthl of interest and will pay nothing at all. 89115 Rthl. The judgments
    will probably fall out so that one may [uncertain: remove] the fellows and put others in their place;
    I [uncertain: reckon] that of these arrears more than 6000 Rthl will be obtained, for the people are
    too obstinate and go off in secret with their goods. There are still many purchase-monies and rents
    outstanding among good people, but to these I must for the present grant a term, so that they too
    do not join the wicked ones, and until I have first got the wicked ones wholly over[come]. By St.
    John''s day, meanwhile, all must be in order, and from then on up to 14000 Rthl of clear interest
    must flow into the treasury. For 3 demesne farms which I am restoring, 9000 Rthl yearly is offered
    after the propination rights; this amounts then to some 23000 Rthl of clear revenue; the interest,
    including the amortisation fund, would amount yearly to the 14000 Rthl, and therefore Your Highness
    would in the first period have 9000 Rthl flowing to the treasury, but from St. John''s day onward
    48467 Rthl would certainly come in by St. John — out of which a part of the arrears, [uncertain: Staunz],
    taxes (Podatek), the costs etc. must still be set right. The shortfall is 40648 Rthl.'
- page: 4
  en: 'The toils, care and sorrow which I meanwhile endure here are not to be described with any pen;
    I do not know when I am first to [uncertain: hear] or whither I am to turn. Napoleon''s newer dispositions
    turn all men''s heads; nobody gives a heller willingly. In the 3 months that I have been here, 2800
    Rthl have been recovered by execution — the suits already cost 1450 Rthl, of which the Traperius and
    Meierowitz matters alone, which I have failed to mention overleaf, have devoured 750 Rthl. Dues I
    have had paid, 1500 Rthl; this already makes 2950 Rthl. Now I am again to send some 600 Rthl in advances
    to Konin and to Kalisz — if I do not, all is lost; the sequestrator liquidates daily, his new account
    amounts to 2236 Rthl. He is the favourite of the Prefect Garczynski; I must flatter him as far as
    possible, so that he does not [uncertain: harass] and vex, otherwise all is lost; indeed they will
    chase me out of here like the cap from the dovecote. Gladly would I procure for Your Serene Highness
    only some 40000 Rthl, so that you might once again have a penny against need; I strive too to be able
    to demonstrate to you a wholly fixed revenue, so as to reckon upon it with confidence, and to determine
    the end of the debts, that your descendants may know what they will one day have from these estates.
    — Here one has new rumours every day, which however are seldom confirmed; so much, however, is known
    to me, that in Berlin they live as in a madhouse, think only of extortions, and for the rest not a
    word of what passes in the neighbouring cabinets. Thus Hard[enberg] himself does not know a jot of
    it, that attachment has been laid afresh upon all conceivable sums that have been given out of Prussia
    into Poland, and that the interest and amortisation fund has been fixed at 40 years. Zerboni has [uncertain:
    turned] them all a frightful nose and now laughs here into his sleeve; in [uncertain: your] negotiations
    he aims only at the good of Saxony in Poland. Hard[enberg] demands of me proofs concerning the new
    laying of attachment and the amortisation [uncertain: plan]; I send him the same tomorrow — I remain,
    until death, Your Most Serene Highness''s Swiątniki, the 27th of January 1811, most humble and obedient
    v Triebenfeld'

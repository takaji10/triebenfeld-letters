- page: 2
  en: 'contract at the Pszczew sale to be cancelled — for Glenck has had a third of the profit and a demesne
    farm secured to himself in the most permanent manner for the Baron von Brandenstein; this I simply
    cannot promise, and for that the people release nothing at all.


    5. With the Chamber of the Order nothing has happened, and therefore nothing is to be paid upon it.


    6. The Harlem purchase is likewise not to be thought of, for this plan appears to be wholly at home
    in the world of ideas.


    7. As for the loan of the 100/m Rthl from the Invalids'' Fund there is likewise no security, but everything
    rests upon [illegible] But now, in order to attempt the last, I am going back to Berlin, having sat
    here three days in vain at Frankfurt an der Oder and waited for Glenck.


    I shall see whether, with the assistance of Amelang, I can conclude something with old Stubenrauch
    — he is an honest man and I hope the matter should go forward, if I furnish him the warranty of title
    against eviction for the shortfall —'

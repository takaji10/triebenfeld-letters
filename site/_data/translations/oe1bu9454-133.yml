- page: 3
  en: 'Further, I will see for myself whether the loan from the Invalids'' Fund may be obtained in any
    manner whatever. — If I withdraw in Berlin, then G. and the Frankfurt partnership associates may break
    their necks — For the rest, things looked bare in Berlin — Mr Beyme had laid the compensation petition
    before [the King] — At the presentation his address was short: A part of the estates which had been
    conferred upon the Prince of Hohenlohe have been taken from him again. He asks for compensation. He
    wants estates; those Your Majesty cannot give him — In place of that he wants 100,000 Rthl as a gift,
    or he wants 200,000 Rthl lent for 20 years without interest — the request for money Your Majesty will
    not be able to grant in the present course of the times, since one does not know how everything will
    turn out. Cases might easily arise in which Your Majesty might need all the money more than most urgently.


    My counsel is that Your Majesty compensate him in this fashion: The Prince still owes His Majesty
    a large sum of more than 200,000 Rthl, which he borrowed for Dutch claims that were refused — Let
    Your Majesty make him a gift of this'

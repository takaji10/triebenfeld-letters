  en: '133


    Most Serene Prince


    Most gracious Prince and Lord!


    I could almost despair over all the wretched business that I find here at every turn, and God knows
    whether I shall be able to redress it all and steer it to the best.


    1. In all of it nothing has been done, and Glenck is not in a position to show me one Rthl''s worth
    securely.


    2. Leixner has been secretly at Pszczew, and on account of all the fraud and trickery prevailing there
    is so shy of the thing that he would gladly give up the contract and renounce everything at once —
    only with the greatest effort can he be made to stand by the remainder and now to keep to the payments
    engaged for.


    3. He will on no account enter into any connection concerning Kamionna; I am to furnish him the warranty
    of title against eviction for a profit of 30/m Rthl and also to procure the right of residence for
    him. This I cannot promise. I am willing to guarantee against all loss if he gives 160/m Rthl for
    Kamionna, but with that he is not content.


    4. He wishes the partnership contract entered into with Glenck'

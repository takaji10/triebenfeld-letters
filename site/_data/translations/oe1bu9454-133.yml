status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! I could almost despair over all the wretched
    affairs which I find here at every turn, and God knows whether I shall be able to redress everything
    and steer it to the best. 1. In the whole matter nothing has been done, and Glenck is not in a position
    to demonstrate to me one [uncertain: Vnd] worth with certainty. 2. Leixner has been secretly in Betsche,
    and on account of all the deceit and trickery prevailing there is so bewildered that he would gladly
    give up the contract and renounce everything forthwith – only with the greatest effort must he stand
    fast and now keep to the payments engaged for. He will on no account enter into any connexion regarding
    Kaemen; I am to furnish him the eviction-warranty for a profit of 30 Rthl and likewise procure him
    the Incolat. This I cannot promise. I will guarantee against all loss if he gives 160000 Rthl for
    Kaemen, but with that he is not content. He wishes the partnership contract entered into with Glenck'
- page: 2
  en: 'contract at the Betsch sale to be annulled — for Glenck has had himself secured, in the most thoroughly
    permanent manner, 1/3 of the profit and a demesne farm for the Baron von Brandenstein; this I precisely
    cannot promise, and for that the people [uncertain: entweren] in nothing. 5. With the Order''s Chamber
    nothing has happened, and therefore nothing is to be paid upon it. 6. Of the Harlem purchase there
    is likewise no thinking, for this plan appears to be quite at home in the world of ideas. 7. As to
    the loan of the 100000 Rthl from the Invalids'' Fund there is likewise no security, but everything
    rests upon becoming, after, however. Now, in order to attempt the last resort, I am going back to
    Berlin, after I have sat here in Frankfurt three days in vain and waited for Glenck. I shall see whether,
    with the assistance of Amelang, I can conclude something with old Stubenrauch – he is an honest man
    and I hope the matter shall go forward, if I furnish him the eviction-warranty for the shortfall.'
- page: 3
  en: 'Further, I will myself see whether the loan from the Invalids'' Fund is to be obtained in any manner
    whatever. — Remissiva at Berlin; then may G. and the Frankfurt partners'' relations break their necks.
    For the rest, things looked bare at Berlin – Herr Beyme had laid the petition for compensation before
    [him]. At the presentation his address was short: A part of the estates that were conferred upon him
    have been taken from His Serene Highness again. He begs for compensation. He wants estates – those
    Your Majesty cannot give him — he wants 100000 Rthl given him for it, or he wants 200000 Rthl lent
    him for 20 years without interest – the request for money Your Majesty will not be able to grant in
    the present course of the times, because one does not know how everything will turn out. Cases might
    easily arise in which Your Majesty might need the gold more than most urgently. My counsel is that
    Your Majesty compensate him in this way: The Prince still owes His Majesty a great sum of more than
    200000 Rthl, which he borrowed for [uncertain: versagte] Dutch claims – let Your Majesty remit him
    these,'
- page: 4
  en: 'for you will receive them, yet nothing back in your lifetime, and the important business of compensation
    is settled. Old worthy Köckritz, who greets Your [Serene Highness] most cordially, said this to me
    between four eyes; the answer was of that sort in preparation. I have, God be thanked, brought it
    round; and Köckritz votes for Koltzig-Rade – he will say everything about this himself. Amelang knew
    nothing of it all; he almost fell down in a faint, and will hardly boast any more of the friendship
    of his Herr Beym. Köckritz is and remains an honest man, if only he worked more for men of integrity.
    It is certain that if we have war Your Serene Highness will receive the command. Amelang admitted
    that Beym had said to him – Had I only not to spare the Prince on account of the [uncertain: Leitischen]
    positions, while we live, I would dismiss him in such a manner that he should never come again – as
    it is, however, one must handle him gently, for if we get war there is none but he to whom the armies
    can be entrusted – the Russian ministry sits upon our neck, and soon the alliance between Russia and
    Austria will be concluded. Then we must do [what] this would wish. Köckritz thinks the King would
    [text lost: stam]'
- page: 5
  en: refuse — Meanwhile, little more is to be built upon our steadfastness. Count Haugwitz will probably
    be held in check; it is certain that he will not return on the first of July either. I remain, until
    death, Your Serene Highness's Franckfurth, the 23rd of May 1804 most faithful servant v Triebenfeld

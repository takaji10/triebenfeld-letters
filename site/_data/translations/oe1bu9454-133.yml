- page: 4
  en: 'then you will receive nothing back in your lifetime, and the important business of compensation
    is settled.


    Old Köckritz, please, who greets Your [Serene Highness] most cordially, has told me this between four
    eyes — the answer was being worked up in that sense. I have, God be thanked, turned it about, and
    Köckritz votes for Koltzig-Rohde[?]; he will say everything about this [himself]. Amelang knew nothing
    of any of it — he almost [illegible], and will surely no longer boast of the friendship of his Mr
    Beyme — Köckritz is and remains an honest man, if only he would work more for men of integrity — It
    is certain that if we have war Your Serene Highness will receive the command.


    Amelang admitted that Beyme had said to him — If only I did not have to spare the Prince on account
    of the [uncertain: Leitischen Laagen], while we live — I would dismiss him in such a manner that he
    should never come again — but as it is one must handle him with care, for if we get war there is no
    one besides him to whom the army can be entrusted — the Russian ministry is sitting on our neck, and
    soon the alliance between Russia and Austria will be concluded. Then we shall have to do as these
    wish; Köckritz thinks the King would [text lost]'

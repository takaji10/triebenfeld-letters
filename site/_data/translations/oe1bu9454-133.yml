- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    I could almost despair over all the wretched affairs which I find here at every turn, and God knows
    whether I shall be able to redress everything and steer it to the best.


    1. In all of it nothing has been done, and Glenck is not in a position to demonstrate to me one [uncertain:
    And] worth with any certainty.


    2. Leixner has been secretly in Betsche, and on account of all the fraud and trickery prevailing there
    is so out of his wits that he would gladly give up the contract and renounce everything at once —
    with the greatest difficulty he must be held firm and now keep to the payments he has engaged for.
    He will on no account enter into any obligation regarding Kaemen; I am to provide him with the warranty
    of title for a profit of 30 Rthl and also to procure him the right of residence. This I cannot promise.
    I will guarantee against all loss if he gives 160000 Rthl for Kaemen, but with that he is not satisfied.


    he wishes the partnership'

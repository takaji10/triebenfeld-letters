- page: 4
  en: 'which you will receive, yet in his lifetime nothing back, and the important business of compensation
    is settled.


    The old Köckritz, who sends Your Highness his heartfelt greetings, said this to me between four eyes;
    the answer was being drafted in that sense. I have, God be thanked, turned it about. And Köckritz
    votes for Koltzig-Rade; he will tell Your Highness everything about this. Amelang knew nothing of
    any of it; he nearly fainted, and will hardly boast again of the friendship of his Mr. Beym. Köckritz
    is and remains an honest man, if only he would exert himself more for men of integrity. It is certain
    that if we have war Your Serene Highness will receive the command.


    Amelang admitted that Beym had said to him — Were I only not obliged to spare the Prince on account
    of the [uncertain: Leitische] situations, so long as we live, I would dismiss him in such a fashion
    that he should never come again — but as it is one must handle him with care, for should we get war
    there is no one besides him to whom the armies can be entrusted — the Russian ministry sits upon our
    neck, and soon the alliance between Russia and Austria will be concluded. Then we must do what these
    wish. Köckritz thinks the King would firmly'

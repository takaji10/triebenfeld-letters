- page: 2
  en: 'contract entered into with Glenck upon the Betsche sale to be annulled — for Glenck has had one
    third of the profit, and a demesne farm for the Baron von Brandenstein, secured to himself in the
    most utterly permanent manner; this I simply cannot promise, and for it these people forgo nothing.


    5. With the Chamber of the Order nothing has happened, and therefore there is nothing to be paid upon.


    6. As to the Harlem purchase, that too is not to be thought of, for this plan appears to be entirely
    at home in the world of ideas.


    7. As regards the loan of the 100000 Rthl from the Invalids'' Fund there is likewise no security,
    but everything rests upon prospects. But now, in order to attempt the last resort, having sat here
    in Frankfurt an der Oder three days in vain waiting for Glenck, I am going back to Berlin.


    I shall see whether, with the assistance of Amelang, I can conclude something with the elder Stubenrauch
    — he is an honest man and I hope the matter will go forward, if I furnish him the warranty of title
    against the shortfall.'

- page: 3
  en: 'Further, I will see for myself whether the loan from the Invalids'' Fund is to be obtained in any
    manner at all. — Remissiva in Berlin; then let G. and those connected with the Frankfurt partnership
    break their necks. For the rest, things looked bare in Berlin — Mr. Beym had laid the petition for
    compensation before him. At the presentation his address was brief: A portion of the estates conferred
    upon His Serene Highness have been taken from him again. He asks for compensation. He wants estates;
    those Your Majesty cannot give him. — In place of them he wants 100000 Rthl as a gift, or else he
    wants 200000 Rthl lent for 20 years without interest — the request for money Your Majesty will not
    be able to grant in the present course of the times, since one does not know how everything will turn
    out. Cases might easily arise in which Your Majesty would need the money more than most urgently.


    My advice is that Your Majesty compensate him in this way: The Prince still owes His Majesty a large
    sum of more than 200000 Rthl, which he borrowed for refused Dutch claims — [uncertain: remit] Your
    Majesty him these'

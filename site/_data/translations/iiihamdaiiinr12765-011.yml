- page: 2
  en: '-tunity to further the fulfilment of the wishes communicated to me by Your Highness in respect
    of compensation for the Trąbczyn estates taken from you. For the rest, I very gladly avail myself
    of the present occasion to renew to Your Highness etc. the assurance of that esteem with which I remain,
    etc. Vienna, etc.


    In His Serene Highness''s name


    H[arden]b[er]g 21/5'

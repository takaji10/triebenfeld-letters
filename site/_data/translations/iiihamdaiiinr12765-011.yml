  en: 'Vienna, the __th of May 1815. To His Serene Highness and Lordship the Prince of Hohenlohe, etc.


    at


    Sławięcice


    No. 3132


    R. 28/5 to Rthl 28/5.


    Cancelled, and see the further disposition of 6 June 1815. In most devoted reply to Your Highness''s
    very kind letter of the 12th of this month I have the honour to respond: that at this moment the territorial
    relations of the Duchy of Warsaw are indeed definitively settled as regards those of its provinces
    reverting to Prussia; whereas as concerns the compensation of the respective donees in the said Duchy,
    the regulation of this matter is reserved to a separate negotiation, upon which, however, entry has
    already been made at this time. Given the sincere part I take in every occurrence concerning Your
    Highness etc., it will certainly afford me quite particular pleasure to find, in the course of this
    negotiation, an oppor-'

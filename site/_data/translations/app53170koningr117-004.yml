segments:
- page: 1
  en: 'To the office and present records of the Konin Municipal Court, appearing in person, the Honourable
    Stanisław Scibor Chełmski, Thesaurarius [Treasurer] of Wschowa, hereditary owner of the estates of
    Łukomia, Łomów, Imielno, and Bukowo and others pertaining thereto — although he knows very well the
    field decree issued by the commissioners procured on behalf of the petitioning party in the year 1775
    between the estates of Łukom with appurtenances of the opposing party on one part, and the estates
    of Trąbczyn with appurtenances of the hereditary [estates] of the Honourable Antoni Prusimski, Starost
    of Niszczewice, on the other part — all solemnities having been duly fulfilled, following the appearance
    of the collateral parties, from the recognitions of the corner and axial [mounds] thereof, on the
    basis of documents and notably the judicial site inspection of the year 1592 conducted at the instance
    of the sole former heir of the estates of Trąbczyn, from sworn inquiries both previously and at that
    time expedited — having been made; authorised with jurisdiction completed at the final mound with
    neighbouring witnesses; and submitted for oblata to the records of the proper palatinate in due time
    — had truly and legitimately intervened —


    he now [manifests that] a certain field act drawn up by the commissioners engaged by the Honourable
    Prusimski, Starost of Niszczewice — privately and with the greatest favour, beyond the evidence of
    the matter and the documents — later, already after the extended demarcation, after the mounds were
    erected and jurisdiction had been rendered for the opposing party — drawn up for the cognate persons
    of the Honourable Starost of Niszczewice — is illegal; and that the Honourable Antoni Prusimski had
    neither caused it to be submitted to the records of his own palatinate, nor had observed the rigours
    prescribed by the same illegal act — and that thus Prusimski himself alone had acknowledged that same
    act, which followed in his favour, as inviolable;


    lest, however, by his silence he appear to accept the illegality of the aforesaid act that thus followed
    on behalf of the Honourable Prusimski — coming thereby to the aid of future contrary arguments among
    those advancing them, and standing firm around the decree properly and lawfully established in due
    time — he manifests the want of substance and invalidity for any judgment claimed in favour of the
    Honourable Prusimski from the procured field act and others of similar kind that had intervened —
    offering to seek the cassation of it;


    with the fuller improvement of the present manifest in form being entirely reserved to himself.


    Stanisław Ścibor Chełmski'

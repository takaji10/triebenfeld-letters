  en: '115


    Most Serene Prince


    Most gracious Prince and Lord, just now my tenant from Świniary has sent in and begs me urgently to
    come out for a moment and to bring the peasants into order, who will not obey him but mean to refuse
    their services. I must now hasten thither to prevent mischief. Your Most Serene Highness will most
    graciously forgive me that today, on account of this matter, I do not appear at the midday meal. With
    the Minister I have spoken today concerning Schlabrendorff. Frankly said, he seems to take it somewhat
    amiss that Your Most Serene Highness will tell him nothing, for I believe he expected that yesterday
    — [uncertain: rech] but I find it good that Your Highness tells him nothing; one can first see what
    he will do.


    He has written to Schlabrendorff that on the 15th of the [uncertain: daß]'

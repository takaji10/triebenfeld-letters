- page: 2
  en: 'month he is to be here; he has to speak with him in the matter in question — for the present he
    lays it on his heart to withdraw all complaint at once, for people are watching him so closely that
    not the least thing would remain undiscovered, and if one were to find a Groschen''s worth of blemish
    in the affair he could be assured that it might go badly for him.


    He, the Minister, could not afterwards save him, Sch:, even with the best will; indeed he would then
    have to deny outright that he is related to him by ties of blood, etc.


    Asch he had with him today and told him all this by word of mouth, so that it might be laid further
    upon the heart of the Count in Stolze, whither Asch goes the day after tomorrow; in particular he
    is by all means to prevail upon Schlabrendorff to be here on the 15th of this month.


    I go tomorrow to Lądek, but shall quite certainly be here again on the 15th too, and then I shall
    harness Hirsch in alongside — In deepest submission I remain, until death,


    Your Most Serene Highness''s


    Wrocław, the 3rd of August


    1802


    faithful humble and obedient servant


    v Triebenfeld'

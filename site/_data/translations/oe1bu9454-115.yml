- page: 2
  en: 'month he is to be here; he has to speak with him in the Quist matter - provisionally he lays it
    upon his heart to withdraw all complaint at once, for they are watching him so closely that not the
    least thing would remain undiscovered, and if a Groschen''s worth of blemish were to be found in the
    matter he might be assured that it would go sadly with him.


    He, the Minister, could afterwards not save him, the said Sch:, even with the best will; indeed he
    would then have to deny outright that he is related to him by ties of blood, etc. etc.


    He had Arch with him today and told him all this by word of mouth, so that it may be further laid
    to heart to the Count in Stolze, whither Asch goes the day after tomorrow; in particular he is by
    all means to prevail upon Schlabrendorff that he be here on the 15th of this month?


    I go tomorrow to Landen, but shall quite certainly be here again on the 15th as well, and then I shall
    harness Hirsch to the work too. In deepest submission I remain, until death,


    Your Most Serene Highness''s


    Breslau, the 3rd of August


    1802


    faithful, humble and obedient servant


    v. Triebenfeld'

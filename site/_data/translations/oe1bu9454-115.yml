- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    This very moment my tenant sends in from Schwammen and urgently begs me to come out for a moment and
    to put in order the peasants who will not obey him, but have refused their labour services. I must
    now hasten thither to prevent disorder.


    Your Most Serene Highness will most graciously forgive that today, on account of this matter, I do
    not appear at midday. With the Minister I spoke today concerning Schlabrendorff. To speak candidly,
    he seems to take it somewhat amiss that Your Most Serene Highness will say nothing to him, for I believe
    he expected that yesterday - but truly I find it well that Your Highness says nothing to him; one
    may first see what he will do.


    He has written to Schlabrendorff that on the 15th of the'

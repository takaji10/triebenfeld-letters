- page: 2
  en: 'irrevocable hereditary quit-rent contract, in no part to be altered, for the record:


    § I. His Most Serene Highness grants, namely, out of the local Trąbczyn demesne farm''s arable, to
    the forest inspector Carl Titz 5 Hufen, say five Hufen Magdeburg measure, and this beneath the demesne
    farm buildings, from the road which leads to Podbiele as far as the mill ditch, including the orchard
    lying beside the stables, from now on for perpetual time in hereditary quit-rent.


    § II. The forest inspector [uncertain: Seite]'

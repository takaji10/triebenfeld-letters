  en: 'annual hereditary quit-rent, which may neither be increased nor diminished, per Hufe Magdeburg
    measure of 15 rt, written fifteen Rthaler, thus for five Hufen 75 rt, written seventy-five Rthaler
    in Courant, and this yearly in two instalments, at Christmas and Midsummer, each time with 37 rt 12
    gg, written thirty-seven Rthaler 12 gg, to be paid in cash post numerando.


    § IV. On the second half of the purchase money, the 75 [illegible], five per cent is to be paid up
    to the day of payment.


    § V.'

- page: 5
  en: '§ V.


    Titz must bring about this establishment himself at his own cost, without receiving on that account,
    either now or in the future, timber or any other building assistance.


    § VI. Besides this quit-rent in cash, the hereditary lessee binds himself, for himself and his successors
    in possession of this acquired holding, to discharge from these five Hufen


    all and every royal tax, as well as the dues owing to the monastery of Ląd and the payments to the
    [uncertain: Gräßlichkeit] — chimney money, forage delivery and whatever else may arise — without any
    exception, without on that account'
  names:
  - de: Titz
    en: Titz
    kind: person
  - de: Kloster Ląd
    en: the monastery of Ląd
    kind: place
  numbers:
  - V.
  - VI.
- page: 6
  en: 'obtaining or making any remission of the hereditary quit-rent.


    § VII. The hereditary lessee must take the beer and brandy he drinks from the lordship [uncertain:
    frage] or brewery and [uncertain: Vormundthännte], and in case of contravention shall pay to the ground
    lordship as a penalty one Rthaler for every garniec of foreign brandy brought in, and five Rthaler
    for every cask of foreign beer.


    § VIII. The hereditary lessee and his successors in possession of this holding are subject to the
    jurisdiction of the local [uncertain: court], yet of all and'
  numbers:
  - VII.
  - VIII.
- page: 7
  en: 'every delivery in kind and Hufe services entirely and for perpetual time exempted.


    § IX. The hereditary lessee and his successors in possession are at liberty to alienate this acquired
    [illegible] [illegible] to others by sale or exchange; yet such must be done with the consent of the
    ground lordship, and upon each such [uncertain: diminution] the tenth Groschen of the purchase money
    or of the exchange amount is to be paid to the ground lordship as a transfer fee (Laudemium); whereas
    upon inheritance by children and collateral kin, on the other hand,'
  numbers:
  - IX.
- page: 8
  en: 'no transfer fee is paid.


    § X. The hereditary lessee renounces entirely, for himself and his successors in possession, all and
    every remission in cases of misfortune arising from fire from heaven, from arson by evil persons,
    hailstorm, crop failure, cattle plague, war and pestilence, or in any other manner whatsoever; and
    on that account no compensation from the ground lordship, nor any remission of the hereditary quit-rent,
    shall ever accrue to them.


    § XI. The dwelling and farm buildings must the hereditary lessee'
  numbers:
  - X.
  - XI.
- page: 9
  en: 'and his successors in possession build themselves at their own cost, and always keep them in good
    repair, and they receive for this from the ground lordship neither timber nor any other building assistance.


    § XII. The costs of this contract and of its official copy the hereditary lessee pays.


    § XIII. So long as the hereditary lessee and his successors in possession of this holding shall comply
    with all the above obligations,


    the ground lordship promises to protect them in their rights everywhere, and'
  numbers:
  - XII.
  - XIII.
- page: 10
  en: 'to defend them against any man''s real claims.


    Should, however, the hereditary lessee or his successors lay this holding waste, or remain in arrears
    with the annual hereditary quit-rent for longer than two years, then this hereditary purchase contract
    shall cease, and the ground lordship shall be entitled to dispose of this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal exceptions available therein,'
  numbers:
  - zwey
- page: 11
  en: 'particularly the objection of cunning persuasion, of precipitance, of an injury suffered above
    or below the half, of matters otherwise agreed than set down in writing; and they have now been duly
    instructed by the court as to the consequences of this renunciation. His Most Serene Highness expressly
    consents that the hereditary lessee may, on the ground of this contract, have the title of possession
    of this acquired holding entered in his own name. [uncertain: wen]'
- page: 12
  en: 'Further the contracting parties had nothing to adduce, and after this protocol had been actually
    read out to them, they approved the same throughout and signed below in their own hands.


    Peter Friedrich August von Triebenfeld

    Carl Titz'

status: draft
segments:
- page: 1
  en: 'Actum Trąbczyn, the 4th May 1805. Before the local Patrimonial Court there appeared in person,


    1st, the Councillor of War and Forests von Triebenfeld, as the known General Bevollmächtigter [general
    plenipotentiary] of His Serene Highness the reigning Prince zu Hohenlohe Ingelfingen, [uncertain:
    hereditary] court lord of the [uncertain: aforesaid] estates,


    on the one part;


    2nd, the local Princely Forest Inspector Carl Titz, on the other part.


    The comparents are [uncertain: personally known to the Subforestis] and are found to be in a condition
    to execute judicial transactions validly.


    The same do freely and after due deliberation declare to the protocol the following hereditary-quit-rent
    contract concluded between them, as an'
- page: 2
  en: 'irrevocable hereditary-quit-rent contract, in nothing to be altered.


    § I. Namely, His Most Serene Highness does confer upon the Forest Inspector Carl Titz, out of the
    local Trąbczyn demesne-farm arable, 5 Hufen, in words five Hufen Magdeburg [measure], and that [uncertain:
    below] the demesne-farm buildings, from the road which leads to Podbiele as far as the mill-ditch,
    including the orchard lying beside the stables, from now onward for everlasting times in hereditary
    quit-rent.


    § II. The Forest Inspector [text continues]'
- page: 3
  en: 'position pays as purchase-money for each Hufe 300 rt, in words three hundred Rthaler, hence for
    five Hufen Magdeburg 1500 rt, in words one thousand five hundred Rthaler, and that with the one half
    at 750 rt, in words seven hundred and fifty Rthaler, at Johanni of this year, and with the other half
    at 750 rt, in words seven hundred and fifty Rthaler, at Johanni of the coming year 1806, in cash and
    in good Prussian Courant.


    § III. The Forest Inspector Titz binds himself, for the [uncertain: acquired] holding, from Johannis
    of this year onward, to a perpetual'
- page: 4
  en: 'annual hereditary quit-rent, which may neither be raised nor diminished, per Hufe Magdeburg of
    15 rt, in words fifteen Rthaler, hence for five Hufen 75 rt, in words seventy-five Rthaler in Courant,
    and that yearly in two instalments, at Christmas and Johannis, each time with 37 rt 12 gg, in words
    thirty-seven Rthaler 12 gg, to be paid in cash post numerando.


    § IV. Of the second half of the purchase-money, [uncertain: the 75 ortum], five per [uncertain: hundred]
    shall be paid up to the day of payment.


    § IV.'
- page: 5
  en: '§ IV.


    The establishment [Etablissement] Titz must effect himself at his own cost, without receiving thereto,
    either from now or for the future, timber or any other building assistance.


    § VI. Besides this bare hereditary quit-rent, the hereditary lessee binds himself, for himself and
    his successors in possession of this acquired holding, out of these five Hufen


    to discharge [uncertain: the] and every royal tax, likewise the competency for the monastery of Ląd
    and the dues to the [uncertain: county/lordship], chimney-money, forage-delivery and whatever else
    may occur, without any exception, without [text continues] for this'
- page: 6
  en: 'any remission of his hereditary quit-rent, or to obtain one.


    § VII. The hereditary lessee must take his beer and brandy for drinking from the lordship''s [uncertain:
    brewery or distillery] and [uncertain: is bound thereto], and in the case of contravention must lay
    before the manorial lordship, for every Garniec of foreign brandy brought in, one Rthaler, and for
    every [uncertain: kanne] of foreign beer, five Rthaler penalty.


    § VIII. The hereditary lessee and his successors in possession of this holding are subject to the
    jurisdiction of the local [uncertain: court], yet are of all and'
- page: 7
  en: 'every delivery in kind and Hufen-service wholly and for everlasting times exempt.


    5. I [sic] The hereditary lessee and his successors [uncertain: hereto] are at liberty to alienate
    this acquired [illegible] [illegible] to another by sale or by exchange, yet such must take place
    with the consent of the manorial lordship, and upon every such [uncertain: transfer/diminution] the
    [uncertain: tenth] Groschen from the purchase-money or the exchange-quantum shall be paid to the manorial
    lordship as a [uncertain: laudemium]; whereas upon devolutions to children and collateral kindred'
- page: 8
  en: 'no laudemium is paid.


    § X. The hereditary lessee renounces, for himself and his successors in possession, entirely all and
    every remission in cases of misfortune, whether arising by fire from heaven, by the incendiarism of
    evil men, hailstorm, crop-failure, cattle-plague, war and pestilence, or in any other manner whatsoever;
    and on that account no compensation from the manorial lordship, nor any remission of the hereditary
    quit-rent, shall ever accrue to them.


    § XI. The dwelling and farm buildings the hereditary lessee'
- page: 9
  en: 'and his successors in possession must build themselves at their own [uncertain: cost], and must
    always keep the same in good repair, and shall receive thereto from the manorial lordship neither
    timber nor any other building assistance.


    § XII. [uncertain: The costs] of this contract and of its engrossment the hereditary lessee pays.


    § XIII. So long as the hereditary lessee and his successors in possession of this holding shall fulfil
    all the above obligations, the manorial lordship promises to protect them in their rights everywhere,
    and'
- page: 10
  en: 'to defend them against every man''s real claims.


    Should, however, the hereditary lessee or his successors lay this holding waste, or remain in arrears
    with the annual hereditary quit-rent for longer than two years, then this hereditary-purchase contract
    shall cease, and the manorial lordship shall be entitled to dispose of this holding otherwise.


    Both parts promise to keep the foregoing hereditary-quit-rent contract firmly and inviolably, and
    renounce all legal subterfuges to be found therein,'
- page: 11
  en: 'particularly the objection of cunning persuasion, of overhaste, of a laesio enormis above and below
    the half, and of matters agreed otherwise than as engrossed; and they have now been duly instructed
    by the court as to the consequences of this renunciation. His Most Serene Highness expressly consents
    thereto, that the hereditary lessee may, upon the ground of this contract, have the title of possession
    of this acquired holding rectified in his own name. [uncertain: wen]'
- page: 12
  en: 'Further the contracting parties had nothing to adduce, and after this protocol had been actually
    read out to them, they approved the same throughout and signed it below with their own hands.


    Peter Friedrich August v. Triebenfeld

    Carl Titz'

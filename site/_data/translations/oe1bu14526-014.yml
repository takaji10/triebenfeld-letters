- page: 3
  en: 'pays as purchase money for each Hufe 300 rt, written three hundred Rthaler, thus for five Hufen
    Magdeburg measure 1500 rt, written one thousand five hundred Rthaler, and this with the one half at
    750 rt, written seven hundred and fifty Rthaler, at Midsummer of this year, and with the other half
    at 750 rt, written seven hundred and fifty Rthaler, at Midsummer of the coming year 1806, in cash
    and in good Prussian Courant.


    § III. The forest inspector Titz binds himself, for the [uncertain: acquired] holding, from Midsummer
    of this year onward, to a perpetual'

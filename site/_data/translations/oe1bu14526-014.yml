- page: 1
  en: 'Actum Trąbczyn, the 4th of May 1805. Before the local patrimonial court there appeared in person,


    1st, the Councillor of War and Forests von Triebenfeld as the known general attorney of His Serene
    Highness the reigning Prince of Hohenlohe-Ingelfingen, [uncertain: Erkund] lord of the court of the
    local estates


    of the one part


    2nd, the local princely forest inspector Carl Titz of the other part.


    The appearing parties are personally known to the [uncertain: Subforestis] and are found to be in
    a condition to execute judicial transactions validly.


    The same declare, freely and after due deliberation, the following hereditary quit-rent contract concluded
    between them, in the'

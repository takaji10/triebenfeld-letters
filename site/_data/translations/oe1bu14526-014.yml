- page: 2
  en: 'irrevocable hereditary quit-rent contract, in nothing to be altered, into the protocol:


    § I. His Most Serene Highness namely grants in hereditary quit-rent to the forest inspector Carl Titz,
    out of the arable of the local Trąbczyn demesne farm, 5 Hufen — say five Hufen Magdeburg measure —
    namely below the demesne buildings, from the road which leads to Podbiele as far as the mill ditch,
    including the orchard lying beside the stables, from now on for perpetual times in hereditary quit-rent.


    § II. The forest inspector, for the'
  names:
  - de: Carl Titz
    en: Carl Titz
    kind: person
  - de: Trąbczyner
    en: Trąbczyn
    kind: place
  - de: Podbiele
    en: Podbiele
    kind: place
  numbers:
  - '5'
- page: 3
  en: 'holding, pays as purchase money for each Hufe 300 rt, written out three hundred Rthaler, hence
    for five Hufen Magdeburg measure 1500 rt, written out one thousand five hundred Rthaler, namely with
    the one half at 750 rt, written out seven hundred and fifty Rthaler, at Midsummer of this year, and
    with the other half at 750 rt, written out seven hundred and fifty Rthaler, at Midsummer of the coming
    year 1806, in cash and in good Prussian Courant.


    § III. The forest inspector Titz binds himself, for the [uncertain: staaquirirte] holding, from Midsummer
    of this year onward to a perpetual'
  names:
  - de: Titz
    en: Titz
    kind: person
  numbers:
  - '300'
  - '1500'
  - '750'
  - '750'
  - '1806'
- page: 4
  en: 'annual hereditary quit-rent, which may neither be increased nor diminished, per Hufe Magdeburg
    measure of 15 rt, written out fifteen Rthaler, hence for five Hufen 75 rt, written out seventy-five
    Rthaler, in Courant, and this yearly in two instalments at Christmas and Midsummer, each time 37 rt
    12 gg, written out thirty-seven Rthaler 12 gg, to be paid in cash post numerando.


    § IV. On the second half of the purchase money [illegible] 75 [uncertain: ortum], five per cent shall
    be paid up to the day of payment.


    § V.'
  numbers:
  - '15'
  - '75'
  - '37'
  - '12'
  - '12'
- page: 5
  en: '§ V.


    Titz must effect the establishment himself at his own cost, without receiving for this purpose, either
    now or in the future, timber or any other building assistance.


    § VI. Besides this quit-rent in cash, the hereditary lessee binds himself, for himself and his successors
    in possession of this acquired holding, to discharge from these five Hufen


    all and every royal tax, likewise the allowance for the monastery of Ląd and the dues to the [uncertain:
    Gräßlichkeit], chimney money, forage deliveries, and whatever else may arise, without any exception,
    without for this obtaining or being granted'
  names:
  - de: Titz
    en: Titz
    kind: person
  - de: Kloster Ląd
    en: monastery of Ląd
    kind: place
  numbers:
  - V
  - VI
  - fünf
- page: 6
  en: 'any remission of the hereditary quit-rent.


    § VII. The hereditary lessee must take the beer and brandy he drinks from the lordship''s [uncertain:
    frage] or brewing and [uncertain: Vormundthännte], and in case of contravention must pay to the manorial
    lordship, for every garniec of foreign brandy brought in, one Rthaler, and for every cask of foreign
    beer five Rthaler in penalty.


    § VIII. The hereditary lessee and his successors in possession of this holding are subject to the
    jurisdiction of the local [uncertain: konnen], yet entirely and'
  numbers:
  - VII
  - VIII
  - Einen
  - fünf
- page: 7
  en: 'every delivery in kind and Hufe-services, for perpetual times, free.


    § IX. The hereditary lessee and his successors in possession are at liberty to alienate this acquired
    [uncertain: word] [uncertain: word] to others by sale or exchange; yet such must be done with the
    consent of the manorial lordship, and on every such [uncertain: reduction] of possession the [uncertain:
    gehüte] Groschen shall be paid out of the purchase money or the exchange sum as a transfer fee (Laudemium)
    to the manorial lordship; whereas on inheritance to children and collateral relations'
  numbers:
  - IX
- page: 8
  en: 'no transfer fee is paid.


    § X. The hereditary lessee, for himself and his successors in possession, wholly renounces all and
    every remission in cases of misfortune arising from fire from heaven, from arson by evil people, hailstorm,
    crop failure, cattle plague, war and pestilence, or in any other manner whatsoever, and on this account
    no compensation from the manorial lordship or remission of the hereditary quit-rent shall ever accrue
    to them.


    § XI. The dwelling and farm buildings the hereditary lessee'
  numbers:
  - X
  - XI
- page: 9
  en: 'and his successors in possession must build themselves at their own cost and must always keep the
    same in good repair, and he receives for this from the manorial lordship neither timber nor any other
    assistance.


    § XII. The hereditary lessee pays [uncertain: the costs] of this contract and of its engrossment.


    § XIII. So long as the hereditary lessee and his successors in possession of this holding fulfil all
    the above obligations,


    the manorial lordship promises to protect them in their rights


    everywhere, and'
  numbers:
  - XII
  - XIII
- page: 10
  en: 'to defend them against any man''s real claims.


    Should, however, the hereditary lessee or his successors lay this holding waste, or remain in arrears
    with the annual hereditary quit-rent for longer than two years, then this hereditary purchase contract
    shall cease, and the manorial lordship shall be entitled to dispose of this holding otherwise.


    Both parts promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal evasions that might have place therein,'
  numbers:
  - zwey
- page: 11
  en: 'particularly the objection of cunning persuasion, of over-haste, of a supposed injury above or
    below the half, of matters agreed otherwise than as written down; and they have now been duly instructed
    by the court as to the consequences of this renunciation. His Most Serene Highness expressly consents
    thereto, that the hereditary lessee may, on the ground of this contract, have the title of possession
    of this acquired holding registered in his own name. [uncertain: wen]'
- page: 12
  en: Further the contracting parties had nothing to adduce, and after this protocol had been actually
    read out to them, they approved the same throughout and subscribed below in their own hands. Peter
    Friedrich August von Triebenfeld. Carl Titz.

- page: 1
  en: 'Actum Trąbczyn, the 4th of May 1805. Before the local patrimonial court there appeared in person,


    1st, the Councillor of War and Forests von Triebenfeld, as the known general attorney of His Serene
    Highness the reigning Prince of Hohenlohe-Ingelfingen, [uncertain: Erkund] court lord of the local
    estates,


    of the one part;


    2nd, the local princely forest inspector Carl Titz, of the other part.


    The parties appearing are personally known to the undersigned, and are found to be in a condition
    to execute judicial acts validly.


    The same declare, freely and after mature deliberation, the following, concluded between them, in
    the'

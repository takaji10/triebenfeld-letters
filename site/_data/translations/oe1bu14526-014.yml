status: draft
segments:
- page: 1
  en: 'Actum Trąbczyn, the 4th of May 1805. Before the Patrimonial Court here there appeared in person:


    1. the Herr Councillor of War and Forests v. Triebenfeld, as the known General Bevollmächtigter [general
    authorised representative] of His Serene Highness the reigning Prince zu Hohenlohe Ingelfingen, hereditary
    and judicial lord of the estates here,


    on the one part;


    2. the Princely Forest Inspector here, Carl Titz, on the other part.


    The comparents are personally known to the Subforestis and are found to be in a condition to execute
    judicial transactions validly.


    They declare, freely and after due deliberation, the following, concluded between themselves, in the'
- page: 2
  en: 'irrevocable hereditary quit-rent contract, in no point to be altered, to the protocol:


    § I. Namely, His Most Serene Highness grants in hereditary quit-rent to the Forest Inspector Carl
    Titz, out of the arable of the demesne farm here at Trąbczyn, 5 Hufen, in words five Hufen Magdeburg
    [measure], and that [uncertain: below] the demesne-farm buildings, from the road which leads to Podbiele
    as far as the mill-ditch, including the orchard lying beside the stables, from now on for perpetual
    times in hereditary quit-rent.


    § II. The Forest Inspector''s hold-'
- page: 3
  en: 'ing pays as purchase-money for each Hufe 300 rt, in words three hundred Rthaler, hence for five
    Hufen Magdeburg 1500 rt, in words one thousand five hundred Rthaler, and that with the one half at
    750 rt, in words seven hundred and fifty Rthaler, at Johanni of this year, and with the other half
    at 750 rt, in words seven hundred and fifty Rthaler, at Johanni of the coming year 1806, in cash and
    in good Prussian Courant.


    § III. The Forest Inspector Titz binds himself, for the acquired holding, from Johanni of this year
    onward, to a perpet-'
- page: 4
  en: 'ual annual hereditary quit-rent, which may neither be raised nor diminished, per Hufe Magdeburg
    of 15 rt, in words fifteen Rthaler, hence for five Hufen 75 rt, in words seventy-five Rthaler, in
    Courant, and that yearly in two instalments, at Christmas and at Johanni, each time of 37 rt 12 gg,
    in words thirty-seven Rthaler 12 gg, to be paid in cash post numerando.


    § IV. Of the second half of the purchase-money, [uncertain: the 75 ortum], five per cent shall be
    paid up to the day of payment.


    § V.'
- page: 5
  en: '§ V.


    He must effect the establishment himself at his own cost, without receiving for this purpose, either
    now or in future, timber or any other building assistance.


    § VI. Besides this bare hereditary quit-rent, the hereditary lessee binds himself, for himself and
    his successors in possession of this acquired holding, to discharge from these five Hufen each and
    every Royal tax, as well as the assessment for the Ląd monastery and the dues to the [uncertain: county
    / lordship], chimney-money, forage deliveries and whatever else may arise, without any exception,
    without on this account'
- page: 6
  en: 'to make or to obtain any remission of the hereditary quit-rent.


    § VII. The hereditary lessee must take the beer and brandy for his own consumption from the lordship''s
    [uncertain: brewery or distillery] and [illegible], and in the case of contravention must pay to the
    ground-lordship as penalty, for every Garniec of foreign brandy brought in, one Rthaler, and for every
    keg of foreign beer, five Rthaler.


    § VIII. The hereditary lessee and his successors in possession of this holding are subject to the
    jurisdiction of the court here, however [text lost] all and'
- page: 7
  en: 'every deliveries in kind and Hufe-services entirely and for perpetual times exempt.


    § IX. The hereditary lessee and his successors in possession are at liberty to alienate this acquired
    [uncertain: word] [uncertain: word] to others by sale or exchange; however, such must be done with
    the consent of the ground-lordship, and upon each such [uncertain: reduction of possession] the [uncertain:
    tenth] Groschen of the purchase-money or exchange sum shall be paid to the ground-lordship as a [uncertain:
    Laudemium]; whereas upon inheritances to children and collateral relatives, on the other hand,'
- page: 8
  en: 'no Laudemium is paid.


    § X. The hereditary lessee, for himself and his successors in possession, wholly renounces each and
    every remission in cases of misfortune arising through fire from heaven, through arson by evil persons,
    hail-storm, crop failure, cattle plague, war and pestilence, or in any other manner whatsoever; and
    on this account no compensation from the ground-lordship, nor any remission of the hereditary quit-rent,
    shall ever accrue to them.


    § XI. The dwelling and farm buildings must the hereditary lessee'
- page: 9
  en: 'and his successors in possession build themselves at their own [uncertain: cost], and keep the
    same always in good repair; and he shall receive for this purpose from the ground-lordship neither
    timber nor any other building assistance.


    § XII. [uncertain: The costs] of this contract and of its engrossment the hereditary lessee shall
    pay.


    § XIII. So long as the hereditary lessee and his successors in possession of this holding shall fulfil
    all the above obligations, the ground-lordship promises to protect them in their rights everywhere,
    and'
- page: 10
  en: 'to defend them against every man''s real claims.


    Should, however, the hereditary lessee [uncertain: or] his successors lay waste this holding, or remain
    in arrears with the annual hereditary quit-rent for longer than two years, then this hereditary-purchase
    contract shall cease, and the ground-lordship shall be entitled to dispose of this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal exceptions to be found therein,'
- page: 11
  en: 'in particular the objection of cunning persuasion, of over-hastiness, of an injury sustained above
    or below the half, of matters agreed otherwise than as set down in writing; and they have now been
    duly instructed by the court as to the consequences of this renunciation. His Most Serene Highness
    expressly consents that the hereditary lessee may, on the ground of this contract, have the title
    of possession of this acquired holding entered in his own name. [uncertain: Further]'
- page: 12
  en: 'Further the contracting parties had nothing to adduce, and after this protocol had been actually
    read out to them, they approved the same throughout and subscribed it below in their own hands.


    Peter Friedrich August v. Triebenfeld

    Carl Titz'

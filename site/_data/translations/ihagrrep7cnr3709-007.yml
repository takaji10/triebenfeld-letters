status: draft
segments:
- page: 1
  en: 'Ex officio


    1. Let a rescript be sent to the Government at Poznań: since most of the councillors of its court
    are members of the guardianship board there, and the suit of the guardian of the minor Michaelina
    von Prusimska against the Prince of Hohenlohe-Ingelfingen for the recovery of the Brzyce estates was
    brought at the instance of the latter, and the lawsuit itself has been conducted, and will continue
    to be conducted, under its direction, it has been found necessary hereby to order that the said case
    be decided in the first instance by the full bench of the Government at Warsaw and in the second instance
    by the Superior Appeal Senate of the Kammergericht; the necessary orders have accordingly been sent
    to these two courts today, and this is hereby made known to it for its information and observance.


    2. Let the rescript to the Government at Warsaw be dispatched accordingly, and


    3. to the Superior Appeal Senate of the Ca[illegible]. Richters. Berlin, 7 Dec. 1800.


    G[oldbeck]


    No. 5957.'

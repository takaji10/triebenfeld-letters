- page: 1
  en: 'Document no. 2014


    Dobrogost, Archbishop of the holy church of Gniezno, 13 October 1399, in the stone room of the monastery
    of Ląd; adjudges the sheaf tithe of the village of Trąbczyn to the monastery of Ląd against the claim
    of Jan, parish priest of Trąbczyn.


    Włocławek. Liber privilegiorum of the monastery of Ląd, p. 181.


    In the name of the Lord, amen. We, Dobrogost, by the grace of God and of the Apostolic See Archbishop
    of the holy church of Gniezno, make known to all whom it concerns who will have knowledge of these
    presents that, whereas a matter of dispute had arisen before us between the venerable man Lord Gerard,
    abbot, and the whole convent of the monastery of Ląd of the Cistercian Order, of our diocese of Gniezno,
    plaintiffs, on the one part, and the discreet man Jan, rector of the church in Trąbczyn, defendant,
    on the other, concerning the sheaf tithe of the fields there in Trąbczyn: we therefore, the said parties
    appearing in person before us, having heard the propositions of the parties and the proofs brought
    forward which the said parties were wont to use, having taken the counsel of men learned in the law
    and with the consent, will and assent of the parties themselves, simply and plainly, without the noise
    and form of a trial, all the windings of lawsuits cut off, having invoked the name of Christ and having
    Him alone before our eyes and fearing Him, sitting as a tribunal, by this our definitive sentence
    pronounce, decree and declare in writing: that the sheaf tithe of the fields in Trąbczyn has belonged
    and belongs, has pertained and pertains, to Lord Abbot Gerard and the said convent, imposing perpetual
    silence on Jan, the said parish priest of Trąbczyn, concerning that tithe. In testimony and fuller
    evidence of which we have ordered the present sentence of ours to be written and published by Jan,
    public notary, our own and the scribe of this cause, and to be strengthened by the hanging of our
    seal. Done and given in the year of the Lord 1399, in the seventh indiction, in the tenth year of
    the pontificate of the most holy father and lord in Christ, Lord Boniface the Ninth, Pope by the worthy
    providence of God, on Monday the thirteenth day of the month of October, in the stone room of the
    monastery of Ląd, in the presence of the honourable men, the lords Mikołaj Strozberg, provost, Jarosław,
    archdeacon of Gniezno, and Maciej, rector of the church of Błędów, witnesses to the foregoing.


    And I, Jan son of Wojciech of Wielatowo, cleric of the diocese of Gniezno, public notary by imperial
    authority and scribe of the most reverend father the Lord Archbishop and of this cause, since I was
    present together with the witnesses named above at all and each of the foregoing while they were (being
    done) as is set out above, and saw and heard all and each of them being done so, and, being busy with
    other arduous affairs, had them written by another faithful notary and brought into this public form,
    at the command of the said Lord Archbishop with the hanging of his seal I have subscribed here and
    signed it with my usual sign and name, in faith and testimony of the foregoing.


    Landensis, of Ląd. Trambczyno, Trąbczyn. Blandowo, Błędów. Wielathow, Wielatowo.'

segments:
- page: 1
  en: 'Right Honourable Sir


    Most highly revered Sir, the late King conferred upon me in the year 1796, in the province of South
    Prussia, the Kaemen and Trąbczyn estates confiscated from a certain Prussiemski. The former lie below
    Miedzeritz in the Posen department, the latter however in the Kalisz [department], on this side of
    the Warthe, in the Konin district. The administrative commission assembled in 1806 in the province
    of Warsaw took the estates from me by violent means in 1807, and that fourteen weeks after the Peace
    of Tilsit, and gave them back to the daughter of Prussiemski, now married as Miączyńska. I brought
    complaint of this before the Kalisz tribunal; after a year and a day I received from the said tribunal
    the resolution that it did not hold itself empowered to annul the disposition of the commission of
    that time, and that I should turn in this matter to the Emperor Napoleon — this was contrary to my
    feeling, and Madam von Moscinska possesses the estates still to this day. Last year my general attorney,
    the Councillor of War and Forests von Triebenfeld, applied in this business to His Excellency the
    Prince von Hardenberg. The Prince directed him to let this affair rest until Pahlen''s affairs should
    be decided. As rumour now has it, this has come about, and as I hear, the Prosna is to form the boundary.
    In that manner the district in which the Trąbczyn estates lie falls to [uncertain: the Russian] Imperial
    Majesty. Being unacquainted with the [illegible] course of business, I now do not know to whom I should
    turn concerning the recovery of the estates; indeed, still more, I fear the influence which Moscinska
    is said to have upon the Governor-General Landskog.


    In this straitened situation I turn with the most heartfelt entreaty to Your Right Honourable, that
    you may let your intercession be extended to me before His Imperial Majesty, and may so direct the
    matter that the Emperor himself shall command that the Trąbczyn estates, together with the eight years''
    revenues, be given back to me. May Your Right Honourable deign to grant a favourable hearing to the
    Councillor of War von Triebenfeld, and most kindly impart to him the necessary instructions.


    With unbounded gratitude, and with the most especial respect, I shall ever be


    Your Right Honourable''s


    Schlawenschitz


    the 15th of January 1815.'

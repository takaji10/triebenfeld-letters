segments:
- page: 1
  en: 'Right Honourable Sir,


    Most highly revered Sir General, the late King granted me in the year 1796, in the Province of South
    Prussia, the Kamionna and Trąbczyn estates confiscated from a certain Prusimski. The former lie below
    Międzyrzecz in the Department of Poznań, the latter however in that of Kalisz, on this side of the
    Warta, in the Konin district. The administrative commission which assembled in the Province of Warsaw
    in 1806 took the estates from me by force in 1807, and that fourteen weeks after the Peace of Tilsit,
    and gave them back to the daughter of Prusimski, now married as Miączyńska. I brought suit over this
    before the Kalisz tribunal; after a year and a day I received from the said tribunal the resolution
    that it did not hold itself empowered to set aside the disposition of the commission of that time,
    and that I should apply in the matter to the Emperor Napoleon — this was against my feeling, and Mrs
    von Miączyńska possesses the estates to this day. Last year my general attorney, the Councillor of
    War and Forests von Triebenfeld, applied in this matter to the Prince von Hardenberg. The Prince instructed
    him to let this business rest until Poland''s affairs should be decided. Now, as the [uncertain: rumour]
    says, this has come about, and as I hear, the Prosna is to hold as the boundary. In that case the
    district in which the Trąbczyn estates lie falls to His Majesty the [uncertain: Russian] Emperor —
    being unacquainted with the [illegible] course of business, I now do not know to whom I should apply
    for the reclaiming of the estates; indeed, still more, I fear the influence which Miączyński is said
    to have upon the Governor-General Landsko[uncertain: g/y].


    In this hard-pressed situation I turn with the most heartfelt request to Your Right Honourable, to
    let your good word on my behalf be extended to me before His Majesty the Emperor, and to direct the
    matter so that the Emperor himself shall command that the Trąbczyn estates, together with the eight
    years'' revenues, be given back to me. May Your Right Honourable deign to grant the Councillor of
    War von Triebenfeld a favourable hearing, and most kindly furnish him with the necessary instructions.


    With unbounded gratitude, and with the most especial high esteem, I shall ever remain


    Your Right Honourable''s


    Sławięcice,


    the 15th of January 1815.'

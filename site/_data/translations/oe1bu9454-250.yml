- page: 1
  en: '250 (Enclosure to the letter of 17 November.) I have had the honour of receiving Your Right Honourable''s
    obliging letter of the 3rd of this month, and through it have obtained knowledge of the memorial handed
    to His Serene Highness the Prince von Hardenberg. I have the honour to return a copy of it in the
    enclosure, and shall not fail to take an interest in its content so far as lies within my sphere of
    action. Receive for Right Honourable herewith the assurances of my most perfect esteem


    Vienna, 5 November 1814.


    Humbo[ldt].


    To the Sir


    Mr von Triebenfeld'

segments:
- page: 1
  en: 'Enclosure to the letter of the 17th of November. I have had the honour of receiving Your Right
    Honourable''s obliging letter of the 3rd of this month, and through it have obtained knowledge of
    the memorial submitted to His Serene Highness the Prince von Hardenberg. I have the honour of returning
    a copy of the same in the enclosure, and shall not fail [uncertain: not have failed] to take an interest
    in its contents so far as it lies within my sphere of action. Receive herewith, Your Right Honourable,
    the assurances of my most perfect esteem.


    Vienna, the 5th of November 1814.


    Humboldt.


    To the Sir


    Herr von Triebenfeld'

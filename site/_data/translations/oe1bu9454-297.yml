- page: 2
  en: 'scarcely stand, not walk; nevertheless I have had myself brought to Blizanów, risky and painful
    as this was for me, in order here, if possible, to recover sooner under better care.


    I now lie here and suffer in body and soul — I can do little at present, but let me by God''s help
    become well, and I shall begin the work anew. Schenck too has left me and has gone off to Warsaw with
    a Pole. He was already too costly a companion for me; the journey to Poznań and Pszczew, there and
    back, cost 247 Rthl, the physician and the medicine cost me roughly 70 Rthl. From Trzciński nothing
    is now to be hoped; one must wait to see how his wife will declare herself — In the Pszczew affair
    I have effected more at Poznań; I have had many papers extracted, which cost 22 # indeed — but which
    will be of such use that I shall wring out satisfaction for Bally and Lombardini, and perhaps still
    more than that — The residents have petitioned for the annulment of the contract — but the contract
    is so tightly drawn, and Zerboni holds it to be a masterpiece — if the residents pay the arrears,
    then they may be heard on the cancellation of the contract.


    Of Kolno and Kamionna, by Zerboni''s assurance, nothing is to be hoped, for the bank swallows that
    — When I am well, I shall make it my first business to come to terms with Leixner. May Heaven let
    this succeed — the devastation of the forest and the ruin of the farming, and other frauds of Echaust
    and of the sub-prefect Kurnatowski, Schenck was to look into more closely after I fell ill — But he
    has only warmed up again what I deciphered a year and a half ago at Międzyrzecz. This much has still
    happened before the onset of my severe illness: that the forest officials must give attestations that
    the forest has been [uncertain: revenirt] by Echaust to the amount of 170/m Rthl.


    Zerboni wants information to be procured for him on everything.'

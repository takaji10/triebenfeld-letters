status: draft
segments:
- page: 1
  en: 'Most Serene Prince, most gracious Prince and Lord! With a heart wholly given over to the bitterest
    grief and sorrow I write these few lines, so that Your Serene Highness may know that I am still alive
    and where I am. But with which [uncertain: zeremieden] I am to begin — each is the most raging pain,
    the loss — I do not yet know: that of my daughter, whom death carried off four days after her confinement,
    when from town, God preserve us, I still received word in [uncertain: Schläwenschick] — to each such
    heart-rending grief away from it. The second shock, for after which also [uncertain: Boidelang] announced
    the decease of the said Barbe. Boide does indeed write that he would compensate me for all that I
    have lost in Barbe — but is he already certain in [uncertain: Baibet]''s place? The third piece of
    news given me was that Trzcinski, having laid himself in bed very drunk, had suffocated in the night
    in an overheated room — how all this worked upon me, Your Serene Highness can hardly imagine. The
    infamous delayed decision of Zerboni, the swift departure of the Emperor, the failure of the fifth
    Chancellor to appear, all this struck me to the ground — the podagra seized me, I was in Betsche,
    a frightful haemorrhoidal colic overcame me, I saw myself compelled, in order to obtain help, to have
    myself brought also to Posen; I took a fresh chill and the podagra rose only into the body, and now
    I had little more upon the tally, all the more as the physician gave me up. Now I took my old method
    of cure to my aid, and continually dressed the body with Spanish-fly plaster, whereby the gout was
    made mobile and drew itself out of the [uncertain: Lüb], into the small of the back and into the hip
    — the greatest danger is indeed now lifted, but I can'
- page: 2
  en: 'as yet not walk; nevertheless I have had myself brought to Blizanow, risky and painful as this
    was for me, in order here, if possible, to recover the sooner under better care. I now lie here and
    suffer in body and soul — I can do little at present; but let me by God''s grace become well, and
    I shall begin the work anew. Schenck too has left me and has gone off with a [uncertain: Bohlen] to
    Warsaw. He was already too costly a companion to me; the journey to [uncertain: Böhle] and Betsche
    cost, there and back, 247 Rthl; the physician and the medicines cost me altogether some 70 Rthl. From
    Trzcinski nothing is now to be hoped; one must wait and see how his wife will declare herself. In
    the Betsche affair I have effected something further in Posen: I have had many papers extracted, which
    indeed cost 22 ducats, but which will be of such use that I shall wrangle out satisfaction for Pally
    and Lombardini, and perhaps even something more. The tenants have applied for the annulment of the
    contract — but the contract is so binding, and Zerboni holds it for a masterpiece; let the tenants
    pay the arrears, then they may be heard as to the [uncertain: hächlirung] of the contract. From Kulm
    and Kaemen nothing is to be hoped, according to Zerboni''s assurance, for the Bank swallows that.
    — When I am well, I shall make it my first business to come to terms with Leixner. May Heaven grant
    this. The forest devastation, and the ruin of the management, as well as other frauds of Eichaust
    and of the sub-prefect Kurnatowski, Schenck was to examine more closely after I fell ill — but he
    has only warmed up again what I deciphered a year and a half ago in Miedzeritz. So much has still
    happened before the onset of my severe illness: that the forest servants must give attestations that
    the forest has been ruined by Eichaust to the amount of 170000 Rthl. Zerboni wishes that full information
    on everything be procured for him.'
- page: 3
  en: 'Schenck has promised this, but he knows well how it must be effected, and excuses himself on the
    ground that he has no general power of attorney for the prosecution of the Betsche business. I told
    him I would write to Your Serene Highness on that account. He appears not to understand this matter,
    because it is more a [uncertain: freiegelt Güntel] affair — what does he mean to [uncertain: erairnen],
    what monita does he mean to draw up, when he does not have the accounts rendered by those rascals?
    These I shall demand with every right, and they must absolutely be given me by law. Should I then
    find more timber sales and other things than are entered in the account, the fraud is thereby proved,
    and Eichaust''s own known property must then serve me as compensation. — May Your Serene Highness
    therefore deign to answer me, and indeed in your own hand, and Your Right Honourable are too well
    convinced of my readiness in all the proposals you make me, without hesitation, to be able to regard
    it as a mark of mistrust if this time I do not approve the issuing of a general power of attorney
    in the Betsche matter for Assessor Schenck. The cause is not an aversion against any person — it is
    merely the upholding of my honour, and not to be mocked on account of the many powers of attorney
    to be given. Herr von Schenck already has a power of attorney from me, and Your Right Honourable have
    a general power of attorney cum facultate substituendi which points to my affairs; so, if a further
    power of attorney be necessary, let the same be granted, to which I herewith authorise you; such —
    you will surely, upon riper reflection, be of one'
- page: 4
  en: 'opinion with me, if you consider that I see everything I could obtain from Betsche has been ceded
    to Carl von Zerboni and by him again to himself. That the rendering of the report by Herr O. P. v.
    Zerboni has been so greatly delayed is for me an unspeakable injury; I regret nothing more than that
    I did not then give them more hearing, and let you travel to Paris. Now I willingly grant that they
    prosecute the matters by the diplomatic route etc. etc. I myself spoke with Zerboni twice, indeed,
    in Posen; he promises to do everything, but wishes first to be instructed. He seemed somewhat dissatisfied
    with Schenck''s presentation — He told me: Herr Schenck speaks much and in the end says nothing. —
    See to it that I am well [uncertain: anfält] set up in everything, then I shall gladly act. He promised
    solemnly to write to Your Serene Highness about everything. On the return journey I dictated the accompanying
    letter in Your Serene Highness''s name to Zerboni, for I could no longer walk or stand — but Schenck
    has done nothing further than submitted a separate petition to the Government Director Collores, upon
    which nothing has yet been resolved. In short, as soon as I am certain I shall go to Posen and Betsche.
    I request all the accounts rendered, take the calculator Käufer to assist, and draw up the monita,
    from which alone it will appear. Thereafter I shall negotiate with Leixner and see what is to be [uncertain:
    welten] of Betsche. According to Zerboni''s assurance, however, nothing is to be [uncertain: hoped]
    from Kehr and Verena; he says the moneys for the payment of the estates were taken out of the [uncertain:
    Brodgenomen], and that here nothing would be let slip — for more than was actually paid (as pledge-money)
    the daughter of Prussiemski would hardly be [uncertain: zu geringen], and the fiscus too would lay
    its hand upon whatever might remain over. [uncertain: Schend] to hold out through all these dealings
    — for that I have no funds, since the Gl. f. given me are almost all gone — he reckons that Posen
    journey high besides, for which he demands reimbursement. What Grevenitz writes concerning Cosmar,
    Your Serene Highness will see from the two letters of the 8th and 14th — it is well that the Minister
    has ordered this matter to be decided quickly, and does not let the formam fall. Reverently I remain,
    Your Serene Highness''s Blizanow, the 19th of December 1815. most humble and obedient servant v Triebenfeld'

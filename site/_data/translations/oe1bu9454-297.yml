- page: 3
  en: 'Schenck has promised this, but he well knows how this must be brought about, and excuses himself
    on the ground that he has no general power of attorney for the prosecution of the Betsche business.
    I told him that I would write to Your Serene Highness on that head. He appears not to understand this
    matter, because it is more a [uncertain: freehold Güntel] matter — what does he mean to [uncertain:
    obtain], what objections does he mean to raise, if he does not have the accounts rendered by those
    rogues? These I shall demand with full right, and they must absolutely be given to me by law. Should
    I then find more timber sales and other things than stand entered in the account, then the fraud is
    proven, and Echaust''s own known property must then serve me as compensation. — May Your Serene Highness
    therefore deign to answer me, but with your own hand, and Your Right Honourable is too well convinced
    of my readiness in all the proposals you make me, without hesitation and [uncertain: readily], to
    be able to regard it as a mistrust if this time I do not [uncertain: consent to] the issuing of a
    general power of attorney in the Betsche matter to Assessor Schenck. The cause is not aversion against
    any person — it is merely the upholding of my honour, and not to be mocked on account of the many
    powers of attorney to be given.


    Already Mr von Schenck has a power of attorney from me, and Your Right Honourable has a general power
    of attorney with the faculty of substitution which points to my affairs; so if it is still necessary
    to give a power of attorney, let the same be granted, for which I hereby forthwith authorise you;
    such as you will certainly, upon riper consideration, be with me'

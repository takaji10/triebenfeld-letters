- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    With a heart overcome by the bitterest grief and sorrow I write these few lines, that Your Serene
    Highness may know that I am still alive and where I am. But with which [uncertain: ceremony] I am
    to begin, each is the most raging pain, the loss


    I do not yet know — of my daughter; death carried her off four days after her lying-in, when — God
    preserve us from town — I still received news in Schlawenschitz, away from every such heart-cutting
    grief. The second shock for [uncertain: after] what, where also Boidelang announced the decease of
    the aforesaid Barbe. Boide indeed writes that he would [uncertain: make good to] me all that I have
    lost in Barbe — but is he already certainly in Baibet''s place?


    The third report brought me word that Trzciński in Warsaw, having gone to bed very drunk, suffocated
    in the night in an overheated room — how all this worked upon me Your Serene Highness can scarcely
    imagine.


    Zerboni''s infamous delayed decision, the Emperor''s swift departure, the failure of the fifth Chancellor
    to appear, all this cast me to the ground — the gout seized me; I was in Betsche, a dreadful haemorrhoidal
    colic came over me, I found myself obliged, in order to obtain help, also to have myself brought to
    Posen; I caught cold anew and the gout mounted only into the body, and now I had little more on the
    tally, all the more as the physician gave me up. Now I took my old method of cure to my aid and constantly
    applied [uncertain: Spanish] fly-plasters to the body, whereby the humour was made mobile and drew
    out of the body, into the small of the back and into the hip — the greatest danger is indeed now lifted,
    but I can'

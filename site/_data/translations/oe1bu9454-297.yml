- page: 4
  en: 'of one and the same opinion, if you consider that I have ceded everything I could obtain from Betsche
    to Carl von Zerboni, and he again to himself. That the rendering of the report by Chief President
    von Zerboni has been so greatly delayed is an unspeakable injury to me; I regret nothing more than
    that I did not then give you more hearing and let you travel to Paris. Now I gladly grant that you
    pursue matters by the diplomatic route, etc. etc.


    I myself spoke with Zerboni twice in Posen; he promises to do everything, but wishes first to be informed.
    He seemed somewhat dissatisfied with Schenck''s presentation — He said to me, Mr Schenck speaks much
    and, for all that, says nothing. — See to it that I am well [uncertain: instructed] in everything,
    then I shall gladly act. He [uncertain: promised] solemnly to write to Your Serene Highness about
    everything. On the return journey I dictated the accompanying letter to Zerboni in the name of Your
    Serene Highness, for I could no longer walk or stand — but Schenck has done nothing further than submitted
    a separate petition to the Director of Government Collores, upon which nothing has yet been resolved.


    In short, as soon as I am [uncertain: certain] I shall go to Posen and Betsche. I shall ask for all
    the accounts rendered, take the calculator Käufer to that work, and draw up the objections, from which
    alone it will appear. Thereafter I shall negotiate with Leixner and see what is to be [uncertain:
    gained] from Betsche. According to Zerboni''s assurance, however, nothing is to be hoped from Kehr
    and Verena; he says the monies for the payment of the estates were taken out of the [uncertain: bread],
    and that nothing here could escape him — for more than was actually paid (as pledge-money) the daughter
    of Prussiemski would hardly be [uncertain: content], and the treasury too would lay its hand upon
    it if anything were left over. To hold out through all these trains of business — for that I have
    no funds, for the [illegible] given me are almost all gone — he moreover reckons that Posen journey
    high, for which he demands reimbursement. What Grevenitz writes concerning Cosmar, Your Serene Highness
    will see from the two letters of the 8th and 14th — it is good that the Minister has ordered this
    matter to be decided quickly, and lets the form [uncertain: drop]. Most reverently I remain


    Your Serene Highness''s


    Blizanow, the 19th of December


    1815.


    most humble and obedient servant


    v. Triebenfeld'

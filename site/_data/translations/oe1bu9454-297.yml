- page: 2
  en: 'stand for the present, nor walk; nevertheless I have had myself brought to Blizanow, however risky
    and painful this was for me, in order here, if possible, under better care, to recover the sooner.


    I now lie here and suffer in body and soul — I can do little at present, but if God grants me health
    again, I shall begin the work anew. Schenck too has left me and has gone off to Warsaw with a [uncertain:
    Pole]. He was for me only too costly a companion; the journey to [uncertain: Böhle] and Betsche cost,
    there and back, 247 Rthl; the physician and the medicines cost me in all about 70 Rthl. From Trzciński
    nothing is now to be hoped; it must be awaited how his wife will declare herself. In the Betsche affair
    I have effected somewhat more in Posen; I have had many papers extracted, which indeed cost 22 ducats,
    but which will be of such use that I shall wring out satisfaction for Pally and Lombardini, and perhaps
    even something more. The residents have applied for the annulment of the contract — but the contract
    is drawn so bindingly, and Zerboni holds it for a masterpiece; let the residents pay the arrears,
    and then they may be heard on the [uncertain: rescission] of the contract.


    From Kulm and Kaemen nothing is to be hoped, according to Zerboni''s assurance, for the bank swallows
    that up. — When I am well, I shall make it my first business to come to terms with Leixner. May Heaven
    grant this. The devastation of the forest and the [uncertain: mismanagement] of the economy, and other
    frauds of Echaust and of the sub-prefect Kurnatowski, Schenck was to have examined more closely after
    I fell ill — but he has only warmed up again what I deciphered a year and a half ago in Miedzeritz.
    So much at least happened before the onset of my severe illness, that the forest servants must give
    attestations that the forest has been ruined by Echaust to the amount of 170000 Rthl.


    Zerboni wishes that full information on everything be procured for him.'

  en: '297


    Most Serene Prince


    Most gracious Prince and Lord!


    With a heart consumed by the bitterest grief and sorrow I write these few lines, so that Your Serene
    Highness may know that I am still alive and where I am. But with which [uncertain: Inremieden] I am
    to begin I do not yet know — Meanwhile the most raging pain is the loss of my daughter; death carried
    her off four days after her confinement, while I was still receiving news in Sławięcice — O God preserve
    everyone from such heart-rending grief, away from it. The second shock came after that, when Boidelang
    also announced the death of Barbe — Boidelang does indeed write that he would make good to me everything
    I have lost in Barbe — but is he already certain to take Barbe''s place?


    The third piece of news that reached me was that Trzciński, in Warsaw, having gone to bed very drunk,
    suffocated in the night in an overheated room — how all this worked upon me Your Serene Highness can
    hardly imagine.


    Zerboni''s infamous delayed decision, the Emperor''s swift departure, the failure of the Prince Chancellor
    to appear, all this threw me to the ground — the gout seized me, I was at Pszczew, a frightful haemorrhoidal
    colic came over me, I saw myself obliged, in order to obtain help, to have myself brought also to
    Poznań; I caught cold anew and the gout rose only into the body. Now I had little more on the tally,
    the more so as the physician gave me up. Then I took my old method of cure to my aid and wrapped my
    whole body constantly in Spanish-fly plaster, by which the humour became mobile and drew itself out
    of the [illegible], into the small of the back and into the hip — the greatest danger is indeed now
    past, but I can'

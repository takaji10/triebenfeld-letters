- page: 4
  en: 'one mind with me, if you consider that I have ceded everything I could get from Pszczew to Carl
    von Zerboni, and he again to himself; that the rendering of the report by the Chief President von
    Zerboni has been so long delayed is for me an unspeakable damage.


    I regret nothing more than that at that time I did not


    give you a further hearing, and let you travel to Paris.


    Now I gladly concede that you should pursue the matter by the diplomatic route etc." I have myself
    spoken with Zerboni twice at Poznań; he promises to do everything, but wishes first to be informed.
    He seemed somewhat dissatisfied with Schenck''s presentation — He said to me, Mr Schenck speaks much
    and says nothing with it all. — See to it that I am well [uncertain: anfält] set out in everything,
    then I shall gladly act. He swore solemnly to write to Your Serene Highness about everything.


    On the return journey I dictated the enclosed letter to Zerboni in the name of Your Serene Highness,
    for I could no longer walk or stand — But Schenck has done nothing further than submit a separate
    petition to the Government Director [uncertain: Collores], on which nothing has yet been resolved
    — In short, as soon as I am well I shall go to Poznań and Pszczew. I ask for all the accounts rendered,
    take the calculator Käufer to assist, and draw up the objections, from which alone it will appear.
    Thereafter I negotiate with Leixner and see what is to be [uncertain: welten] of Pszczew. But by Zerboni''s
    assurance, from Kolno and Kamionna nothing is to be hoped; he says the monies for the payment of the
    estates had been taken out of the [uncertain: Brod], and this would let nothing escape it here — beyond
    what has actually been paid (as purchase-money), Prusimski''s daughter will hardly be compellable,
    and the fiscal authority too, if anything were left over, will lay its hand upon it. To hold out through
    all these turns — for that I have no funds, for the Gr. F. given to me are almost all gone — he reckons
    that Poznań journey high besides, for which he demands reimbursement — What Grevenitz writes concerning
    Cosmar, Your Serene Highness will see from the two letters of the 8th and the 14th — it is good that
    the Minister Kircheisen has ordered this matter to be decided quickly, and now drops Cosmar. In deepest
    reverence I remain


    Your Serene Highness''s


    Blizanów, the 19th of December


    1815.


    most humble and obedient servant


    v Triebenfeld'

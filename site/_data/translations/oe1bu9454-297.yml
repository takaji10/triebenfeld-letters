- page: 3
  en: 'Schenck has promised this, but he knows quite well how it must be brought about, and excuses himself
    on the ground that he has no general power of attorney for the prosecution of the Pszczew business
    — I have told him I would write to Your Serene Highness on that account. He seems not to understand
    this matter, because it is more a [uncertain: freiegelt] Güntel affair — what does he mean to [uncertain:
    erairnen], what objections does he mean to raise, when he does not have the accounts rendered by those
    rascals? These I shall demand with every right, and they must absolutely be given to me by law — If
    I then find more timber sales and other matters than stand entered in the account, then the fraud
    is proved, and the property which Echaust has secured to himself must then serve me as compensation
    — May Your Serene Highness therefore be pleased to answer me, and indeed in your own hand: "and Your
    Right Honourable is too well convinced of my readiness ''to go into all the proposals you make to
    me without hesitation'' to be able to regard it as a mistrust of you if on this occasion I do not
    [uncertain: genüge] the issuing of a general power of attorney in the Pszczew matter for Mr Schenck,
    the assessor. The reason is not aversion to any person — it is merely the upholding of my honour and
    not being mocked on account of the many powers of attorney to be given.


    Mr Schenck already has a power of attorney from me, and Your Right Honourable has a general power
    of attorney with power to substitute, which points to my affairs — [text lost] if it is therefore
    still necessary to give a power of attorney, let the same be granted, for which I herewith authorise
    you directly; such you will certainly, on riper reflection, be of'

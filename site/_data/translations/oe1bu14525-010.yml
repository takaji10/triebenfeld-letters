- page: 2
  en: Ingelfingen shall from now on and for all eternity, for himself and his heirs and descendants, irrevocably
    have, possess and enjoy the abovenamed estates with all rights and entitlements attaching thereto,
    as these have hitherto been exercised or may in law still be exercised, and no less with all appurtenances
    belonging to him and other accessories, by whatsoever name they may be called, as the same have hitherto
    been used or may in law be used, and with all the lands appertaining thereto in fields, woods and
    meadows, in ponds and waters, as a true, well-acquired and unrestricted property from Us and Our descendants
    and successors; and that the power and authority shall likewise be vested in him to dispose thereof
    at his pleasure under the above-mentioned conditions, unhindered by any man. We do therefore command
    and enjoin all Our Superior Provincial Boards, as also all other authorities whom this concerns, hereby
    as graciously as earnestly, that they shall in no manner hinder nor obstruct the said Prince etc.
    in the hereditary and proprietary possession of the abovenamed estates, together with their appurtenances
    and accessories, granted to the same, nor those to whom he may one day bequeath the same or otherwise
    transfer them in lawful manner by other acts inter vivos aut mortis causa, but shall rather let His
    Lordship, and eventually them also, enjoy the same freely and peaceably; shall themselves do nothing
    against this, nor occasion or permit that such be done by others, on pain of Our Most High disfavour
    and unfailing severe reprimand.

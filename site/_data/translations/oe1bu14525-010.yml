- page: 3
  en: 'reprimand.


    In witness whereof etc. Given at Berlin, the 19th of June, 1797. Friedrich Wilhelm


    Instrument of grant for the Reigning Prince of Hohenlohe-Ingelfingen, for the hereditary and proprietary
    possession of the villages: Pszczew, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum,
    Swiątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wieniec and Wolica, together with appurtenances.


    That the foregoing and overleaf copy, upon comparison having been made, was found throughout conformable
    and identical with the original of the Most Highly executed instrument of grant, is hereby attested
    and certified in fidem publicam. Wrocław, the 22nd of December 1800.


    Richter, Government and Garrison Auditor'

- page: 1
  en: 'We Friedrich Wilhelm, by the Grace of God King of Prussia, do by this Our open letter attest and
    declare, for Ourselves and Our descendants and successors in the Crown, the Electorate and Our remaining
    lands, that, it having been submitted to Us in all humility in what manner Our intention — namely
    to give to the High-born Prince, Our friendly beloved uncle Friedrich Ludw., Reigning Prince of Hohenlohe-Ingelfingen,
    by the grant of the estates which had belonged to the absconded former Starost von Prusimski, a token
    of the friendship and goodwill We bear towards him, as also of Our Royal gratitude for the distinguished
    and beneficial services rendered to Us and to Our house — was not achieved entirely as We had willed
    it, because the said estates were burdened with many debts, We have most highly resolved to relinquish,
    to grant and to convey to His Lordship the hereinafter named formerly ecclesiastical estates, namely:
    the villages of Pszczew, Świechocin, Stoki, Łowyń, Głażewo, Tarnowo, Zagórów, Skokum, Swiątniki, Kopojno,
    Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wieniecz and Wolica, together with all their appurtenances,
    by whatsoever name they may be called, in hereditary and full ownership, against payment of


    1) the sovereign dues hitherto discharged therefrom, as a fixed and unalterable canon, and


    2) the maintenance allowance due therefrom to the ecclesiastical corporations or foundations.


    We also do so hereby and by virtue of this present instrument, out of Our Royal power and plenitude,
    for Ourselves and Our descendants and successors in the Crown, the Electorate, and Our remaining lands,
    in such manner and wise that Our aforementioned friendly beloved uncle, the Reigning Prince of Hohenlohe-'

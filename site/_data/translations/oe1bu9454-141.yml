- page: 2
  en: 'Bruniewski shall at once judicially concede the delivery of possession of the estates; then the
    Jew and consorts are satisfied in this matter. Thereafter Baragnieur takes his 53000 Rthl and Glenck
    the 13000 for Your Serene Highness. In Betsche the Jew wished to undertake a like distraint and to
    confuse the people''s heads — meanwhile he shall succeed there as little as here — My resolve is absolutely
    to carry through for Your Serene Highness the whole 30000 Rthl out of Betsche and the full 13000 Rthl
    from here. Thereafter the highest may pay off each according to his desert. That base fellow, the
    Wünster, I scarcely get to see at all. He has his woman here, has placed her at the theatre, and gives
    balls for the whole gang so that they may take the buck''s hide up among themselves — that costs much,
    and therefore the knave must strike out on every road to snatch something. Concerning Glenck Your
    Serene Highness does me great [uncertain: wrong] — I am no cringing sinner, but go gladly straight
    and open — What I write to Your Serene Highness, I say to him — indeed, he read everything that I
    write. This, I believe, justifies my conduct. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Posen, the 4th of August


    1804


    humble and obedient servant


    v. Triebenfeld'

  en: '141


    Most Serene Prince


    Most gracious Prince and Lord!


    From all the vexation I have contracted a severe gall fever and must keep to my bed here in Poznań.


    Matters are all so confused that at every turn one meets with so many obstacles as keep pushing one
    back from the goal. Such I found the situation here with regard to the Broniewski business — Not enough
    that they have concluded the accursed settlement. No! It is so defective that it afforded not a Groschen''s
    worth of security — all this is to be cleared away and altered, and for that Broniewski''s wife is
    required, and she is God knows where; now it is said she is in Kollo, now she is in Warsaw. In short,
    these people are out for nothing but to cheat Your Serene Highness.


    And, frankly confessed, I hold Wunster to be the worst rogue of all — He is forever in collusion with
    Broniewski and Guderian, assuredly gets a couple of thousand d from the former, and has therefore
    contrived the most disadvantageous settlement, slipped the same into Glenck''s hands so that he had
    to conclude it — but he himself has prudently taken himself off out of the dust, so as afterwards
    to be able to shift everything onto the simple-minded Glenck. The Jew M[eyer] Bernhard is here with
    Simon. These swindlers mean to pay Your Serene Highness only 6000 rt instead of 13000 rt — but that
    shall not succeed for these knaves — First Broniewski alone shall furnish sufficient security, which
    is promised for tomorrow — then Glenck shall press for the depositing of the full 66000 rt with Melzer,
    against which'

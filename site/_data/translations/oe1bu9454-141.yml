- page: 2
  en: 'Broniewski shall at once concede the delivery of possession of the estates before the court — then
    the Jew and consorts are satisfied in this matter. Thereafter Broniewski takes his 53000 rt and Glenck
    the 13000 for Your Serene Highness. In Pszczew the Jew wished to undertake a like seizure and to confuse
    the people''s heads — meanwhile he shall succeed there as little as here — My resolve is absolutely
    to bring Your Serene Highness the whole 30000 rt out of Pszczew and the full 13000 rt from here. Thereafter
    [uncertain: Your Highness] may pay out according to desert — The base fellow Wunster I scarcely get
    to see at all. He has his woman here, has placed her at the theatre, and gives balls for the whole
    gang, that they may take the buck''s hide among themselves — that costs much, and therefore the knave
    must strike out every road to snatch something. As regards Glenck, Your Serene Highness does me great
    [uncertain: wrong] — I am no cringing sinner, but go willingly straight and open — What I write to
    Your Serene Highness, I say to him — indeed he reads everything I write. This, I believe, justifies
    my conduct. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Poznań, the 4th of August


    1804


    humble and obedient servant


    v Triebenfeld'

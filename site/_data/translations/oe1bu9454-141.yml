- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Through all the vexation I have contracted a bad bilious fever and must keep to my bed here in Posen.
    The affairs are all so tangled that on every road one meets with so many matters as keep forcing one
    back from the goal. Thus I found the situation here in respect of the Bruniewski business — Not enough
    that the accursed compromise has been concluded. Nine! It is so defective that it afforded no security
    worth a Groschen; all this is to be cleared away and altered, and for that the wife of Bruniewski
    is required, and she is God knows where — now it is said she is in Kollo, now she is in Warsaw. In
    short, the people are out for nothing but to [uncertain: bear] Your Serene Highness.


    And frankly confessed, I hold Wanstern to be the worst rogue of all — He is forever thick with Bruniewski
    and Guderian, assuredly receives a couple of thousand d from the former, and has therefore forged
    the most disadvantageous compromise, slipped the same into Glenck''s hands so that he had to conclude
    it — but he himself has full prudently made off out of the dust, so as to be able afterwards to lay
    everything upon the simple Glenck. The Jew M. Bernhard is here with Simon. These sharpers would pay
    Your Serene Highness only 6000 Rthl instead of 13000 Rthl — but this shall not succeed for these knaves
    — First Bruniewski alone shall furnish sufficient security, which is promised for tomorrow — then
    one shall press at once with Metzer for the deposit of the full 66000 Rthl, against which'

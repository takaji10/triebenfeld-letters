status: draft
segments:
- page: 1
  en: The noble estate of Kolno, situate under the jurisdiction of the Royal South Prussian Government
    at Poznań and in the Poznań district, consisting of the town of Kamionna or Kamionna and of the market-town
    of Kolno or Kulm, has been granted hereditarily and in full property to the reigning Prince, Friedrich
    Ludwig of Hohenlohe-Ingelfingen, by virtue of the deed of grant of His Majesty King Friedrich Wilhelm
    the Second of 9 August 1796 - the whole property of the former owner, Anton von Prusimski, having
    been confiscated, on account of his participation in the insurrection which broke out in South Prussia
    in the year 1794, by the legally binding judgment of confiscation of 27 June 1796, whereby this estate
    fell to the Treasury; and the title of possession has, for the same, upon the ground of this deed
    of grant and of the deed of resignation made out on 20 October 1800, and likewise

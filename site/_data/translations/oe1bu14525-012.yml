- page: 4
  en: 'arising out of an antichretic pledge contract between the former owner Anton von Prusimski and
    Joseph von Bienkowski, of the Monday before the Nativity of Mary 1768, notified on 20 December 1796
    in a sum of 79,795 Rthl. 18 Groschen 8 4/5 Pfennig, or four hundred and seventy-eight thousand, seven
    hundred and seventy-four Polish gulden, twenty and a half Groschen, with reservation of the costs
    of improvements provisionally stated at 21,666 Rthl. 16 Groschen, or one hundred and thirty thousand
    Polish gulden, which claims, the proprietor objecting thereto, have been entered by decree of 11 May
    1801, with the remark that the alleged pledge-possession of this estate is specially noted by way
    of protest under No. 1 among the perpetual charges.


    Apart from the foregoing items nothing is entered against the estate of Kolno in the mortgage book,
    and the present mortgage certificate is moreover issued to the reigning Prince'

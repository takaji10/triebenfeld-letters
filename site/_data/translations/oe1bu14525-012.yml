- page: 2
  en: 'the title of possession of Anton von Prusimski, as sole male heir of his father Stephan von Prusimski,
    proved by the sworn depositions of two witnesses taken to the record on 15 October 1800, been accepted
    as duly established and entered by decree of 11 May 1801.


    Thereupon there are entered


    I. Perpetual charges and restrictions upon the property or upon the disposal thereof


    1.) A protest, which has been entered on behalf of Anton von Broniewski, on account of the antichretic
    pledge-possession of this estate notified on 19 December 1796 but not acknowledged by the proprietor,
    by decree of 11 May 1801, with the remark that the claims of Anton von Broniewski under No. 1 of the
    judicially secured debts are specially noted by way of protest.


    2.) 250 Rthl., or one thousand five hundred Polish gulden, which, as a perpetual charge resting upon
    the market-town of Kolno in favour of the parish church at Kamionna and bearing interest at 3 1/2
    per cent, by virtue of the inscription of Johann von Prusimski in the municipal courts of Poznań of
    the Monday after the feast of the Visitation of Mary 1673,'

- page: 3
  en: 'were notified on 28 December 1796 together with arrears of interest to an equal amount (ad alterum
    tantum), were however acknowledged by the proprietor to the record of 15 December 1800 only in respect
    of the capital and the running interest, and have therefore, with a note of this discrepancy, been
    entered by decree of 11 May 1801.


    3.) An annual interest of four Polish marks, which must be paid yearly out of the estate of Kamionna
    to the church there, arising from an original capital of one hundred Polish gulden, and which, upon
    the notification made on 28 December 1796, upon the ground of the instrument in the acts of the general
    consistory of Poznań of 26 June 1591, and in consequence of the acknowledgment of the proprietor to
    the record of 15 December 1800, has been entered by decree of 11 May 1801.


    II. Judicially secured debts and other real obligations


    1.) A protest, which has been entered on behalf of Anton von Broniewski, on account of various claims

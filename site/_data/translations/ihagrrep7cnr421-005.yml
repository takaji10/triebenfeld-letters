segments:
- page: 1
  en: 'Copy


    Kalisz, 1 December 1799.


    Most Serene etc. As early as 9 October this year my client, the landowner v Chełmski, submitted to
    Your Royal Majesty a complaint against the Government here over the improper dismissal of a suit brought
    against the Fiscus concerning a claim of 12,000 ducats, and most humbly asked for a hearing at law.
    As no preliminary ruling has followed yet, I make bold to petition Your Most High Majesty again on
    this matter. The decrees of the Government plainly rest on a misunderstanding, in that they confuse
    the suit that v. Chełmski first brought against the Prince of Hohenlohe, as present owner of the Trąbczyn
    estates confiscated from Prusimski, with the present one, which is directed against the Fiscus alone.


    That the claim of 12,000 ducats cannot be sued for against the Prince of Hohenlohe-Ingelfingen, my
    client understands of himself. On the other hand the Court Rescript of 17 September 1796 in no way
    prevents him from claiming the said capital from the Fiscus, under the clear provision of the Most
    High Cabinet Order of the 16th of the same month and year.


    If, moreover, the Government follows the letter of the Court Rescript, which is not binding in itself,
    it nonetheless cannot refuse v. Chełmski a hearing at law in this matter, since this very Rescript
    expressly lays down that if the party does not rest content with the dismissal by decree, the taking
    of evidence is to be opened and the matter formally adjudged. This, in my opinion, must happen in
    every legal matter where'
- page: 2
  en: 'the party cannot be convinced that the dismissal was lawful.


    I enclose a copy of the suit with the bond ex quo, which my client had already brought before the
    Government at Poznań, - only I must remark that he had first sued v Prusimski before the judgment
    of confiscation had been passed.


    On the resumption of the proceedings against the Fiscus nothing was changed but the person. So that
    the matter may not be delayed any longer, and the plaintiff may at last be satisfied, I most humbly
    ask Your Royal Majesty to have a preliminary ruling given him without delay. I who etc.


    Your Royal Majesty etc.


    Mondro


    criminal-court councillor.'

segments:
- page: 1
  en: 'Done in Konin on the Monday next after the Feast of Saint Andrew the Apostle in the year of the
    Lord 1771.


    On behalf of the Right Honourable Chełmski — Oblata of the Delivery of Possession of the Lusnia Pine
    Forest with the Olędry


    Let it be seen here: the Oblata of the delivery of possession of the Lusnia pine forest with the olędry,
    issued on behalf of the Right Honourable Stanisław Ścibor Chełmski, heir of the estates of Łukomia,
    [placed] among the produced documents.'

- page: 3
  en: 'God is my witness that I cannot sleep for grief. My most heartfelt wish is that Heaven might but
    govern Stubenrauch''s heart, for then it will indeed go well — gladly would I pledge him my goods
    and my poor afflicted soul.


    Beyen yesterday had Councillor Am[elang] called to him, and told him that His Majesty could give Your
    Serene Highness neither South Prussian estates nor money. Your Serene Highness, however, owed the
    King very considerable sums, besides a loan from the Duke of Courland, on which the King had hitherto
    paid the interest. Since His Majesty doubted of recovering a single Groschen of the sums lent and
    of the interest paid by way of advance, His Majesty was willing, out of especial grace, to make Your
    Serene Highness a gift of these sums, as also of the interest hitherto paid to the Courlanders, as
    a compensation for the lost Brzyzer estates. In return, however, Your Serene Highness should from
    now on satisfy the Courlanders both as to capital and as to interest. This was not His Majesty''s
    own notion. With the best heart, and with the love he bore Your Serene Highness, he had not been able
    to bring about more than this. He ought also to have given Your Serene Highness this resolution at
    once, but as he did not know whether it might be agreeable to Your Serene Highness, he had'

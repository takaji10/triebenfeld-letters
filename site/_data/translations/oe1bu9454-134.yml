- page: 2
  en: 'everything will now come to grief there too, for since Leixner must [have it] of Your Most Serene
    Highness for the sake of the loan, he must also see the [uncertain: documents], and in that way the
    lower valuation comes before his eyes, which, had the loan not been necessary, one need never have
    produced. Even if I now obtain 60000 Rthl lent from somewhere on the lower valuation, it will be extremely
    damaging to the sale and perhaps hinder it entirely. My sole hope is now cast upon Stubenrauch, to
    whom I have promised to furnish warranty of title and every conceivable guarantee. This evening he
    means to give his declaration — should this plan fail, then all is lost here, for all the other projects
    are not worth a single Groschen either and are merely the designs of a certain Dietz, Werner, the
    Jew Borchart,


    Captain Lange and such rabble, who have neither head nor credit, and who needed written undertakings
    from Glenck only so as to be able to borrow something upon them, that they might not perish of hunger.
    It is a sad thing that Glenck reckoned upon the swindles of this brood and frittered away the time
    in so highly culpable a manner.'

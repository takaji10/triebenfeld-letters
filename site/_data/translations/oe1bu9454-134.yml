- page: 5
  en: 'evident that it was through his mediation that the fine answer had been held back. All this raised
    Am[elang]''s courage, and, being prepared, he spoke more freely. A[melang] also now lives in the first
    hope that they will be civil and will offer no gross insolence, but will hold it back altogether —
    and also that they will make haste to execute the confiscation, or the judgment to that effect, so
    as to be able to confer the Kölziger estates upon Your Serene Highness.


    Braun will keep the General [uncertain: K.] in play and guide the matter along this road — Am[elang]
    will do the same with B[eyen] in his own manner — but neither knows anything of the other, and even
    on this plan both must in the end, without having known it, meet at one point.


    For the rest, A[melang] will draw up a letter to B[eyen] and perhaps to the King, which Your Serene
    Highness is to execute and send off. I have not yet spoken with Herr von Hard[enberg], but tomorrow
    it shall certainly be done. The King is by no means willing to enter into any war; meanwhile Russia
    is said not to be willing to let the matter rest this time with empty remonstrances. His Majesty set
    out for Pomerania for the review in a very ill humour and will be home again on the 5th of next month.'

- page: 7
  en: 'O had the unreasonable man only not, to my very greatest misfortune, allowed the Otto valuation
    to be so destroyed and mutilated, then, with Amelang — who shows himself active and who is now gaining
    credit through Beym[?] — I should have found much [uncertain: further] counsel, and should have been
    able to raise the moneys on my own name or bill of exchange (because I am held to be rich). But this
    prospect too has been robbed from me by the annihilation of the Otto valuation. I mean at any rate
    to try, and in an hour I ride to Potsdam to Pliehen; he told me some days ago that he had 300000 lying
    in Maritime Trading Company obligations, and that he wished to make a trial for once whether he could
    not gain something by a purchase of estates — Perhaps God gives fortune along this road — More therefore
    when I return. Money would now be to be had. Rietz has money — Prince Ferdinand too will give it through
    Stubenrauch''s mediation — but sure mortgage security is demanded. Where am I to get this from?


    The valuations of the Zagorowo estates are only 124 Rthl, and these are encumbered with 56000 Rthl,
    thus [uncertain: indebted] above half; for that the estates are worth four times as much I know —
    but the valuations argue against it, and consequently no reliance is to be placed on it. Kulm and
    Kaemen are botched, for the present valuation is 110000 Rthl and 66000 Rthl have been awarded to Bronicurln,
    so that here too no fund remains upon which money could be taken or demanded with security.'

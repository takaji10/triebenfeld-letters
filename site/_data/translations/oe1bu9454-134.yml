- page: 6
  en: 'God have mercy! What a perverse creature this Glenck is — now all is over. Stubenrauch has been
    provoked by the running-in of bad fellows and will have nothing to do with the matter. The Invalids''
    Fund will give no money — just so, everything is spoiled with the Wards'' Board — what am I now to
    set about?


    Sell Konotop? what not then Kolzig — O God, my [uncertain: fine] plan! O had Your Serene Highness
    but put the fool on a golden chain and had him fed with Strasbourg pies, then his keep would indeed
    have cost much, but at least he could neither have undermined your peace, still less brought you here
    to the loss of credit and good name. It is more than shameful that the man has here got himself involved
    with every low beast of a broker, and has given every knave written undertakings for sums and entered
    into partnership contracts with them. It will in the end become necessary to have all these slips
    declared null and void through the public papers, since otherwise Your Serene Highness may yet be
    burdened with 50 lawsuits.


    I grow dizzy when I think of the near term, and when at one stroke the last spark of hope too is extinguished.
    It is now 1 o''clock in the night — I can neither rest nor repose for anguish, and the beast in human
    shape sleeps without a care — O righteous God, what is a man without true sense of honour?'

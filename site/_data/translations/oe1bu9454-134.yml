- page: 8
  en: 'I shall now try this further — I shall make trial whether anyone will lend 120000 Rthl upon Kontop
    and Zagorowo, for which I shall offer a bill of exchange besides. If this succeeded, everything might
    yet be retrieved, for then one would have time to bring the Kaemen affair soundly to a close and to
    procure a good sale, and also to dismember the Zagorowo and Trąbczyn estates at leisure. If I accomplish
    nothing, then I hasten quickly to Frankfurt an der Oder and try there once more [illegible]. In deepest
    reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, 26th May 1804


    most faithful servant


    v. Triebenfeld'

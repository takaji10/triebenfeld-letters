- page: 7
  en: 'O had the unreasonable man but not, to the very greatest misfortune, let the Otto valuation be
    so destroyed and mutilated, then I, with Amelang — who shows himself active and who now gains credit
    through Beyme — should still have found much counsel, and could have procured the money on my name
    or on bills of exchange / since I am held to be rich /. But this prospect too is robbed from me by
    the destruction of the Otto valuation. I will at any rate try, and within an hour I ride to Potsdam
    to Pliehen; he told me some days ago that he had 300/m Rthl lying in Maritime Trading Company obligations,
    and that he wished to make a trial for once whether he might not gain something by a purchase of estates
    — perhaps God will give good fortune by this road — therefore when I return, more of this. Money would
    now be to be had. Rietz has money — Prince Ferdinand too is willing to give it through Stubenrauch''s
    mediation — but they demand secure mortgage. Where, though, am I to take this from?


    The valuations of the Zagórów estates are only 124/m Rthl, and these are burdened with 56000 Rthl,
    thus encumbered above the half — for that the estates are worth four times as much I know — but the
    valuations tell against it, and consequently it is not to be counted upon. Kulm and Kamionna are bungled,
    for the present valuation is 118000 Rthl, and 66/m Rthl have been awarded to Broniewski, so that there
    too no fund remains upon which money might be taken or demanded with security,'

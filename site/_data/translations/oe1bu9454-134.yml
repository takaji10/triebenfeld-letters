- page: 5
  en: 'too plain that through his mediation the fine answer had been held back. All this raised Amelang''s
    courage, and, being prepared, he spoke more freely. Amelang also now lives in the first hope that
    they will be civil and give no coarse resolution, but will hold it back altogether — and also that
    they will hasten to execute the confiscation, or the judgment to that effect, in order to be able
    to confer the Kolzig estates upon Your Serene Highness.


    Braun will keep the General Köckritz in play and guide the matter along that road — Amelang will do
    the like with Beyme in his own manner — but neither knows anything of the other, and according to
    this plan both must in the end, without having known it, meet at one and the same point.


    For the rest, Amelang will draft a letter to Beyme and perhaps to the King, which Your Serene Highness
    is to execute and send off. I have not yet spoken with the Minister von Hardenberg, but it shall certainly
    be done tomorrow. The Prince is by no means willing to engage in any war; meanwhile Russia is said
    not to be willing this time to let the matter rest with empty remonstrances. His Majesty has departed
    somewhat very ill-humoured to Pomerania for the review, and will be home again on the 5th of next
    month.'

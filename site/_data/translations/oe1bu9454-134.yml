- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The loan from the Invalids'' Fund, which building councillor Glenck assured so confidently, has likewise
    come to grief, and for the following reasons. The Invalids'' Department required that the Otto valuation
    be revised once more and recast according to the principles of the South-Prussian [uncertain: price]
    Chamber. Glenck, who believed he was taking the shortest way to this end, applied, on the advice of
    a certain Captain Lange, to Court Councillor Lengnich; the latter promised to have the valuation recast
    quickly for 25 Fr. Glenck believed this, departed, and merely requested Lengnich to have the new valuation
    delivered to Councillor of War Seelmann. The latter has been done, but to my horror I learned yesterday
    on my arrival that the newer valuation had been reduced to 78000 Rthl, and that it has been handed
    over in that form; Your Most Serene Highness may judge the consequence — the saddest thing of all,
    however, is now that the estates have been utterly degraded in worth by this mutilated valuation,
    and that the sale of them will be made very, very much harder. Even in Frankfurt an der Oder, since
    these people were counting on a loan of 80 to 100000 Rthl,'

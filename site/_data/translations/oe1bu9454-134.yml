- page: 4
  en: 'held it back for the present, and wished that Amelang might first sound out Your Serene Highness
    on the matter. Amelang then answered him: he knew that Your Serene Highness wished to have nothing
    given to you by the King, that you would faithfully pay His Majesty everything that you rightfully
    owed him, that Your Serene Highness demanded nothing but what you could rightfully claim, and that
    you believed you had the first right, when you pressed, directly and indirectly, for a compensation
    for the estates taken from you, for which Your Serene Highness had to pay many thousands in [garbled:
    Charger Stempel um andere Gebürz], and where in addition you had had much money standing. Amelang
    then proposed to him that the Kolzig estates confiscated from Count Schlabrendorff might be given
    to Your Serene Highness as a compensation — to this he replied that the estates had not yet been sequestered,
    that the King would probably rather keep these estates himself, since His Majesty had a distaste for
    the frightening away of estates, carried over from the previous government; yet in this matter the
    first possibility was still present, of obliging the Prince — Amelang knew all of it, however, for
    it [uncertain: träst] word for word with what the honest General had said. — It was particularly'

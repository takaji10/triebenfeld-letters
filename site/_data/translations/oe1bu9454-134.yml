- page: 8
  en: 'I shall now still attempt this — I shall try whether anyone will lend 120/m Rthl on Konotop and
    Zagórów, for which I shall further offer a bill of exchange. If this went through, then everything
    might still be [uncertain: redressed], for then one would have time to conclude the Kamionna business
    solidly and to see to a good sale, and also to dismember the Zagórów and Trąbczyn estates at leisure.
    If I accomplish nothing, then I hasten quickly to Frankfurt an der Oder and try there once more [garbled:
    man heil]. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 26th of May 1804


    most faithful servant


    v Triebenfeld'

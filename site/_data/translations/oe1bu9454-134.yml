- page: 4
  en: 'held it back for the present, and wished that Amelang might first sound out Your Serene Highness
    on the matter. Amelang thereupon answered him: he knew that Your Serene Highness wished for no gift
    from the King; that Your Highness would faithfully pay His Majesty everything that was lawfully owed
    to him; that Your Serene Highness demanded nothing but what you could claim by right, and that you
    believed you had the first right, when you pressed, directly and indirectly, for a compensation for
    the estates taken from you, for which Your Serene Highness had to pay the [uncertain: charter] stamp
    duty and other dues to the amount of many thousands, and where Your Highness had besides advanced
    much money.


    Amelang then proposed to him that Your Serene Highness be given, by way of compensation, the Kolziger
    estates confiscated from Count Schlabrendorff — whereupon he replied that the estates had not yet
    been taken in; that the King would probably prefer to keep these estates himself, because His Majesty
    had a [uncertain: deposit] from the former government for the [uncertain: seizure] of the estates;
    yet in the matter there was still the first possibility of obliging the Prince. — Amelang meanwhile
    knew everything, for it agreed word for word with what the honest General had said. — It was particularly'

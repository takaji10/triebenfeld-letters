- page: 2
  en: 'everything will now fail, for since Leixner must [garbled] Your Most Serene Highness for the sake
    of the loan, he must also see the instruments, and in that way he gets the lower valuation before
    his eyes, which, had the loan not been necessary, one [uncertain: um] have been permitted to show.
    If I now still obtain 60000 Rthl lent from somewhere on the lower valuation, it will be extremely
    damaging to the sale and perhaps hinder it altogether. My only hope is now cast upon Stubenrauch,
    to whom I have promised to furnish eviction and every conceivable guarantee. This evening he intends
    to give his declaration — if this plan fails, then all here is lost, for all the other projects are
    not worth a single Groschen either, and are merely drawn up by a certain Dietz, Werner, the Jew Borchart,


    Mr Lange and such rabble, who have neither head nor credit, and who only needed written undertakings
    from Glenck in order to be able to borrow something on them, so as not to perish of hunger. It is
    a sad thing that Glenck reckoned on the swindles of this brood and so very culpably frittered away
    the time'

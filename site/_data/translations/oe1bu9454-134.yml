- page: 3
  en: 'God is my witness that I cannot sleep for grief. [uncertain: My] most heartfelt wish is that Heaven
    might but govern Stubenrauch''s heart, for then things will go well — gladly would I pledge him my
    goods and my poor afflicted soul.


    Yesterday Beyme had the Privy Councillor Amelang called to him, and told him that His Majesty could
    give Your Serene Highness neither South Prussian estates nor money. Your Serene Highness, however,
    owed the King very considerable sums, apart from a loan from the Duke of Courland, for which the King
    had hitherto paid the interest. Since His Majesty doubted of recovering a single Groschen of the sums
    lent and of the interest paid by way of advance, His Majesty was willing, out of particular grace,
    to make Your Serene Highness a gift of these sums, as also of the interest hitherto paid to the Courlanders,
    as a compensation for the lost Brzyzer estates. In return for which, however, Your Serene Highness
    might from now on satisfy the Courlanders both as to capital and as to interest. This was not His
    Majesty''s [uncertain: ner] notion. With the best heart, and the love that he bears Your Serene Highness,
    he had not been able to bring about more than this. He was also to have given Your Serene Highness
    this resolution at once, but as he did not know whether such would be agreeable to Your Serene Highness,
    he had'

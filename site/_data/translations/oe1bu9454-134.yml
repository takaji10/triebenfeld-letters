  en: '134


    Most Serene Prince


    Most gracious Prince and Lord!


    The loan with the Invalids'' Fund, which the building councillor Glenck assured so positively, has
    likewise failed, and for the following reasons. The Invalids'' Department demanded that the Otto valuation
    be once again revised and recast according to the principles of the South Prussian Chamber. Glenck,
    who thought to take the shortest road to this, turned, on the advice of a certain Captain Lange, to
    the Court Councillor Leugnich; the latter promised to have the valuation quickly recast for 25 Fr.
    Glenck believed this, departed, and only requested Leugnich to have the new valuation delivered to
    Councillor Seelmann. The latter has been done, but to my horror I learned yesterday on my arrival
    that the newer valuation had been reduced to 78/m Rthl and that it had been handed over in that form.


    Your Most Serene Highness may gather the consequence — but the saddest thing of all is now that by
    this mutilated valuation the estates are wholly degraded in worth, and that the sale of them will
    be made very, very much harder. Even in Frankfurt an der Oder, since those people were counting on
    a loan of 80 to 100/m Rthl,'

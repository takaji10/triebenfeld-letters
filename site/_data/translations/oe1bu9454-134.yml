- page: 6
  en: 'God have mercy! What a perverse creature this Glenck is — now all is over. Stubenrauch has been
    put off by the running-about of bad fellows and will have nothing to do with the business. The Invalids''
    Fund will give no money — and just so everything is spoilt with the Wards'' Board; what am I now to
    set about?


    Sell Kontop? Why not Kolzig then — O God, my fine plan! O had Your Serene Highness but put the fool
    on a golden chain and had him fed with Strasbourg pies, then his keeping would indeed have cost much,
    but he could neither have undermined your peace nor, still less, have deprived you here of credit
    and good name. It is more than shameful that the man has here got himself involved with all the base
    brutes of M[uncertain: ü]ller and given every knave written undertakings for sums and entered into
    partnership contracts with them. It will in the end become necessary to have all these slips declared
    null and void through the public papers, since otherwise Your Serene Highness might yet be burdened
    with 50 lawsuits.


    My head swims when I think of the approaching term, and when all at once the last spark of hope too
    is extinguished. It is now 1 o''clock in the night — for anxiety I can neither rest nor be still,
    and the beast in human shape sleeps without a care — O righteous God, what is a man without true feeling
    of honour?'

- page: 2
  en: 'and in which the yield is fixed, after all possible examinations, at 40260 Rthl. – However, neither
    the forest nor the transfer fees (Laudemium) nor the jurisdictional incidents have been taken into
    account here, but have all been left to Your Serene Highness''s disposition.


    B) Great as the yield has turned out to be, yet the debts, according to the schedule appended under
    B, are not less great and weighty, and a series of years will be needed before all is cleanly paid
    off.


    It was a piece of good fortune that I arrived here at just this time, for the matter of the Courland
    post and of the interest payments was again pending, the more so as Minister von Stein is now clearing
    everything up and to that end has requested a commission to be set up, consisting of Minister von
    Voss, the Grand Chancellor and himself, over against Herr [uncertain: Münsterbge] von Schulenburg,
    which is to investigate everything and have everything secured, so that one may see clearly, especially
    with regard to the Bank and the Maritime Trading Company, where great deficits are suspected.


    I have conferred much on this matter with the Herr General von R., and in the end agreed with him
    to petition His Majesty the King for as many treasury notes as are required for the payment of Your
    Serene Highness''s debts altogether.


    The whole sum, as the schedule states, is however 698000 Rthl, exclusive of the items due to myself,
    with which I shall wait until happier events. I have accordingly wished to write under my own name,
    as the enclosure'

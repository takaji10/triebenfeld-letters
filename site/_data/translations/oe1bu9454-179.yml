- page: 3
  en: 'C) under Letter C shows, and the more so since the King is only now letting the justice due to
    me be done me. Yet the Privy [uncertain: Lab.] Councillor B. has not yet given his fiat, and the worthy
    General feared, with every right, that the matter might founder entirely. Therefore the honest friend
    proposed that the bosom friend of Herr B. – the Court Fiscal Pochammer – should push this matter forward.


    With him I have now come to an agreement. He will attend to everything and demands for his trouble
    an honorarium of the like measure as he has been promised by the [uncertain: questions] of von Hesse[?].


    D) In the meantime he must have a special power of attorney, and to that end he has just now sent
    me the form appended under Letter D, which I convey to Your Serene Highness with the most obedient
    request to have the same drawn up there in proving form / in so far as it all has Your Highness''s
    approbation / to execute it, and to send it hither with all speed, so that I may work quickly and
    bring everything to completion – the more so since Midsummer Day is at the door – and since in these
    most hard-pressed times not a Groschen is to be had from anywhere else, all the treasuries being closed
    in particular, wherewith to pay the most pressing debts.'

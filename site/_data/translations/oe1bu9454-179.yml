  en: '179


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most gracious letter of the 19th and 27th of March I received so late
    only because the same lay a very long while in Słupca. It is more than saddening for me that I must
    live so far removed from Your Serene Highness and have news so seldom; it is particularly hard for
    me to act when Your Serene Highness leaves me so long without any answer at all. Meanwhile I do myself
    the honour of reporting to Your Highness most obediently how all matters have prospered.


    Having put everything in order upon the estates, I betook myself here to Berlin again, in order to
    work here and, if possible, to finalise the business.


    The dismemberment has, as Your Serene Highness knows, been approved most honourably, and His Majesty
    the King Himself has been pleased to grant me His high approbation. The Pszczew matter too has been
    approved at the Chamber, laid before the King for approbation by the General Hinrich Department, and
    this very day the same, executed by the King, has come in here. This matter, which threatened Your
    Serene Highness with great danger, is now likewise entirely in the clear. The valuations of the Kalisz
    Chamber are likewise concluded; they have turned out as the copy under A shows, and lie at this moment
    before the General Finance Department, from which tomorrow I am to receive an authentic attestation
    concerning the permanently established revenues of the estates'

- page: 8
  en: 'perhaps some means may be found somewhere to obtain something further behind the great loan. Perhaps
    it will succeed, for everyone now wishes to help, since even the King has loudly praised my proceedings
    and let justice be done, so as to pacify the creditors. The saddest thing for me is that Your Serene
    Highness now lives so far from here and that I must bear all these burdens quite alone. Upon no man
    can I rely; I may order what I will upon my departure, and nothing is done – when I return I must
    only thank God if I find things as I left them. Grattenauer is now continually ill, cannot write,
    still less instruct anyone. Schenck has transformed himself into the idlest of hands. Grimm lets everything
    lie until he thinks I might climb onto his roof again. Malzern I need not even describe, for his brutality
    and idleness are fully enough known to Your Serene Highness.


    But if God now helps me to obtain the loan, to pay all the debts, and thereby to be rid of the great
    part of all the lawsuits, then I shall also lay before Your Serene Highness a plan by which the useless
    [uncertain: appointments] may be put in [uncertain: order]. For now I must still go cautiously, so
    that the rascals do not turn traitor and become harmful to the good cause. If it be in any way possible
    in this world, may Your Serene Highness deign to answer me with all speed and in any case by express
    courier, otherwise I must lie here too long in vain – in deepest respect I remain, until death,


    Your Serene Highness''s


    If I obtain the treasury notes, I


    shall endeavour to pay off this and that.


    Deign, Serene Highness,


    to let me have a few more [uncertain: blue covers] for letters, with / most devotedly the / wholly
    devoted The / Berlin, the 1st of May


    1806.


    faithful and most obedient servant


    von Triebenfeld'

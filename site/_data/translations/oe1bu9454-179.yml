- page: 4
  en: Everything will turn upon this, that Mr Pochammer so dispose the Cabinet Councillor that we obtain
    the monies, or treasury notes, at 3 per cent. The Prince of Orange must indeed give 4 per cent; meanwhile
    Mr Pochammer believes he shall entirely succeed and prise the capital loose at 3 per cent. Were this
    so, Your Serene Highness might count yourself exceedingly fortunate. You would be quit of all your
    debts at a single stroke, would have after some 30 years the cleanest of estates, and would meanwhile
    nevertheless draw yearly some 10000 Rthl from the two lordships, and would be free and quit of all
    cares and sorrow, and especially of the vexation of the dishonouring lawsuits. — The plans of amortisation
    I have drawn up to that end, and particularly for Your Serene Highness's survey; they are respectfully
    appended here under Letter E. Deign, most gracious Prince and Lord, to examine everything, and send
    me above all the power of attorney for the Court Fiscal Mr Pochammer — so that this work, so exceedingly
    important and tending to Your Serene Highness's welfare, peace and honour, may be pursued most zealously
    and at length happily concluded. Most rewarding for me is it that the Monarch alone could not withhold
    his approbation, and that this matter has excited the astonishment even of the Cabinet Councillor
    Beyme; but what has pleased me most of all is that the Minister von Voss has set up my conduct as
    a model to his Chambers.

- page: 7
  en: 'rights. That is altogether forbidden by a new cabinet order, and draws after it the loss of the
    right of residence. Even alienations out of these estates to persons not qualified to possess are
    altogether prohibited, and are in no wise to be tolerated. For the Oleśnica hereditary lessees this
    cabinet ordinance and the edicts published upon it are [uncertain: most] salutary to me, for by these
    alone must the [uncertain: sub-tenants] clear out. But above all, besides all this, I must further
    point out to Your Serene Highness that You Yourself / even if You really had the right to it / would
    lose frightfully, if for the sake of the wretched 6000 Rthl You approved this shameful plan. Zielomyśl
    will thereafter, when the present hereditary possessors parcel it up, be worth some 100/m Rthl. Every
    20 years the holdings round about are sold, and there Your Serene Highness and Your descendants have
    the estates paid for anew through the 10 per cent transfer fees. This is surely so essential a thing
    that no lord of the soil gives it away for eternity. As concerns the 30000 Rthl, I see as yet no possibility
    how[?] I am to procure these so quickly. If I obtain the capital from the King, Your Serene Highness
    does indeed obtain much — but all of it goes entirely upon this, that all debts are to be paid. The
    latter must be so, because the mortgage [uncertain: certificate] must be clean. Whence, then, to take
    it? The one case would be if I could get money upon one of my mortgages on Świniary and Konotop, or
    that the hereditary purchasers in Zagórów and Trąbczyn [uncertain: frequently scarcely] and should
    bring money to perform, but [it belongs to that] that I could be at home or in those parts; but that
    cannot be, for I must absolutely work here. If nevertheless there be a possibility, Your Serene Highness
    may count upon my zeal to realise Your wishes by every means.


    By the next post I shall write to Your Highness further upon this.'

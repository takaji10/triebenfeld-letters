- page: 4
  en: Everything will depend on Herr Pochammer's disposing the Cabinet Councillor so that we obtain the
    monies or treasury notes at 3 per cent. The Prince of Orange must indeed give 4 per cent; meanwhile
    Herr Pochammer believes he will fully succeed and prise the capital loose at 3 per cent. Were this
    so, then Your Serene Highness might esteem yourself exceedingly fortunate. You would be rid of all
    your debts at one stroke, would after some 30 years have the estates entirely clear, and would in
    the meantime nevertheless draw yearly some 10000 Rthl from the two lordships, and would be quit and
    free of all cares and sorrows and especially of the vexation of the dishonouring lawsuits. The amortisation
    plan I have drawn up to that end and especially for Your Serene Highness's survey, and append it E)
    under Letter E most obediently herewith. Deign, most gracious Prince and Lord, to examine everything,
    and send me above all the power of attorney for the Court Fiscal Herr Pochammer – so that this work,
    so exceedingly important and tending to Your Serene Highness's welfare, peace and honour, may be pursued
    most zealously and once happily brought to a close. It is most rewarding for me that the Monarch himself
    could not withhold his approbation, and that this matter has excited the astonishment even of the
    Cabinet Councillor Beyme; but what has pleased me above all is that Minister von Voss has held up
    my conduct to his Chambers as a model.

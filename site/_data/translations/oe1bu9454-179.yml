- page: 6
  en: 'but the consent to his sale Your Serene Highness cannot give him, unless you should prefer some
    20 new lawsuits – for every peasant and [uncertain: Chalypner] who has land within the 700 Morgen
    would refuse to give way and would protest against the dismemberment and against everything. Now it
    must be seen how to make it possible to raise a part of the monies and to pay Glenck. As concerns
    the consent respecting Santomist, I return the piece received thereof, for the middle sheets are wanting,
    with the humble request to cancel it at once. [uncertain: Scentonial] is an appurtenance of the lordship
    of Betsche which has been sold to the subjects – be it a demesne or a peasant holding – enough that
    everything has been sold to the people, and everything is now precisely what has been assigned to
    this or that matter. Your Serene Highness has reserved to yourself no right over the parcels, but
    only the right of superior ownership, in this manner: that you will approve whatever those people,
    who are now called proprietary possessors, lay before you, and will receive your 10 per cent transfer
    fee (Laudemium) for it. The so-called hereditary tenants have already taken the Landsberg heirs to
    task and demand the estate back, since the contract of Radte is false. If Your Serene Highness were
    now to approve matters contrary to this and to the contract, and were to consent to sales without
    the knowledge of the hereditary possessors, then these people would have a right to complain, and
    every single individual could raise against you a lawsuit so costly as to drive away all the advantages
    gained. Besides, it is once again [uncertain: amply] to grant to a commoner now manorial'

- page: 2
  en: 'and in which the yield is fixed, after every possible examination, at 40260 Rthl. — However, in
    this neither the forest nor the transfer fees (Laudemia) and jurisdictional incidents have been taken
    into account, but all has been left to Your Serene Highness''s disposition. Yet great as the yield
    has turned out to be, the debts, according to the schedule appended under B, are not less great and
    weighty, and a series of years will be required before everything is cleanly paid off.


    It was a piece of good fortune that I arrived here just at this time, for the matter of the Courland
    post and the interest payments was again pending, the more so since the Minister von Stein is now
    clearing everything up and has to that end requested the appointment of a commission, consisting of
    Minister von Voss, the Grand Chancellor, and himself, over against the Minister Count von Schulenburg,
    which is to investigate everything and have everything secured, so that light may be had especially
    in respect of the Bank and the Maritime Trading Company, where great deficiencies are suspected. I
    have conferred much on this matter with the Lord General von K[öckritz], and have in the end agreed
    with him thus far, to request of His Majesty the King as many treasury notes as are required for the
    payment of Your Serene Highness''s debts altogether.


    The whole sum is, as the schedule states, however 698000 Rthl, exclusive of the items due to myself,
    with which I shall wait until happier events. I have wished to write on that account under my own
    name, as the enclosure'

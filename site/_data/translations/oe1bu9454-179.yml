- page: 7
  en: 'rights. That is absolutely forbidden by a new cabinet order and entails the loss of the right of
    residence. Even alienations out of these estates to persons not qualified to possess are absolutely
    prohibited and are on no account to be tolerated. For the hereditary leaseholders of the husbandry
    this cabinet ordinance and the edicts published thereupon are very salutary, for by these alone must
    the [uncertain: Lüben] clear out. Above all, however, beyond all this, I must further make it apparent
    to Your Serene Highness that you yourself, even if you truly had the right to it, would lose frightfully
    if for the sake of the wretched 6000 Rthl you approved this shameful plan. Sartomiel will thereafter,
    when the present hereditary possessors parcel it out, be worth some 100000 Rthl. Every 20 years the
    holdings round about are sold, and then Your Serene Highness and your descendants have the property
    paid for anew through the 10 per cent transfer fees. This is surely so essential a thing that no landed
    lord gives it away for eternity. As concerns the 30000 Rthl, I see as yet no possibility how these
    are to be procured so quickly. If I obtain the capital from the King, then Your Serene Highness indeed
    obtains much – but that is all used up if all the debts are to be paid. The latter must be, because
    the mortgage certificate must be clear. Whence then to take it? The only case would be if I could
    obtain money on one of my mortgages on Schwimmern and Kontop, or that the hereditary purchasers in
    Zagorowo and Trąbczyn should come in numbers and bring money to pay, but [uncertain: it would be needful]
    that I could be at home or in those parts; that, however, will not do, for I must absolutely be at
    work here. If there is nevertheless a possibility, then may Your Serene Highness count upon my zeal
    to realise your wishes in every way.


    By the next post I shall write to Your Highness further upon this.'

- page: 3
  en: 'under Letter C shows, and the more so since the King is now according me the justice due to me.
    Meanwhile the Privy Cabinet Councillor B[eyme] has not yet given his fiat, and the worthy General
    feared, with every right, that the matter might founder altogether. Therefore that upright friend
    proposed that the bosom friend of Mr B. — the Court Fiscal Pochammer — should conduct this business.


    With him I have only now come to an agreement; he will see to everything and demands for his pains
    an honorarium of like measure to that which he has been promised by the Prince of Hesse. In the meantime
    he must have a special power of attorney, and to that end he has this very moment sent me the form
    appended under Letter D, which I transmit to Your Serene Highness with the most obedient request that
    the same may be made out there in probative form / insofar as everything has Your Highness''s approbation
    / and executed, and sent hither with the greatest speed, so that I may work quickly and bring everything
    to completion — the more so since Midsummer is at the door — and since in these most sorely pressed
    times not a Groschen is to be had from anywhere else, all the treasuries being especially [uncertain:
    barred], with which to pay the most urgent debts.'

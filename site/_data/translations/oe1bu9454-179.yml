- page: 8
  en: 'Perhaps some means may somewhere be found of obtaining something further behind the great loan.
    Perhaps it will succeed, for everyone now wishes to help, since the King Himself has loudly praised
    my proceedings and done me justice; it served to pacify the creditors. The saddest thing for me is
    that Your Serene Highness now lives so far from here, and that I must bear all these burdens so entirely
    alone. Upon no man can I rely; I may order what I will on my departure, and nothing whatever is done
    — when I come back again I must simply thank God that I find it as I had left it. — Grattenauer is
    now continually ill, can neither write nor yet less instruct. — Schenck has quite transformed himself
    into the idlest of hands. — Grimm lets everything lie until he thinks I might climb on his roof again.
    Melzern I had better not depict at all, for his brutality and idleness are well enough known to Your
    Serene Highness.


    But if God now helps me to obtain the loan, pay all the debts, and thereby to remove the great part
    of all the lawsuits, then I shall also lay before Your Serene Highness a plan by which the useless
    [uncertain: appointments] can be put into [uncertain: Steat]. For now I must still go warily, so that
    the rogues do not turn traitor and become harmful to the good cause. If it be in the world possible,
    may Your Serene Highness deign to answer me with the utmost speed, and in any case by express courier,
    for otherwise I must lie here too long in vain. — In deepest reverence I remain, until death,


    Your Serene Highness''s


    If I obtain the treasury notes, I


    shall endeavour to [uncertain: dispatch] this and that


    somewhat. — May Your Serene Highness deign


    to let me have some more [uncertain: blanks] for letters, with / the most devoted / wholly devoted
    The / Berlin, the 1st of May


    1806.


    faithful and most obedient servant


    von Triebenfeld


    Those with the signature to the King I still have all of them; the others are all — Today everything
    here is in [uncertain: alarm] and breaking out. — Things look very motley here. —'

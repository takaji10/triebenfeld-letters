- page: 5
  en: 'As concerns now the Glenck letter of the 28th of February, I reply thereto most obediently that
    the Prussiemck affair is as foreign to Glenck as colour is to a man born blind. Were it possible for
    me to be everywhere at once, I would pursue this business too with equal force. But since this cannot
    happen without appropriating to oneself divine attributes like a madman, I must keep to the principal
    matters and work upon these with honest zeal, in order to establish Your Serene Highness''s peace.
    For the rest, I console myself with this, that Herr Glenck has merely feigned this affair with his
    year in order to have material for writing to Your Serene Highness and to recall his beggarly importunities
    to Your Highness''s memory.


    He has attained his purpose, that I must now see and speak with him. My judgement was, however, correct,
    for of the Prusimski affair he knew nothing; only the consent respecting the sale of his lands was
    the subject upon which he reasoned. He boasted of his many years'' service and that he had made 42
    journeys in Your Serene Highness''s affairs – for which, in his opinion, he believed he had deserved
    a far greater remuneration than this trifle. To make an end of the thing, I asked him what he actually
    wanted if he were to sell the lands back to Your Serene Highness. His answer was that he could not
    let them go for less than 8000 Rthl. For he had already made a present to Your Serene Highness of
    330 Morgen of land which Your Highness had promised him over and above the bailiwick and the 300 Morgen
    of forest – this, surely, was already more than reasonable, and in case anyone should wish to refuse
    him the consent, he would bring suit and demand this too. In order to make an end of all this haggling
    of Glenck''s, I have promised him the 8000 Rthl under [uncertain: specrati], and submit myself herein
    to Your Serene Highness''s commands.


    the consent'

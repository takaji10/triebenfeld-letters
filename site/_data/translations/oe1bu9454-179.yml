- page: 6
  en: 'to his sale Your Serene Highness cannot give him, unless You should prefer some 20 new lawsuits
    — for every peasant and cottager who has land within the 700 Morgen would be unwilling to yield, and
    would protest against the dismemberment and against everything. I shall now see to make it possible
    to raise a part of the monies and to pay Glenck off. As concerns the consent regarding Zielomyśl,
    I return the piece received thereof / for the middle sheets are wanting / with the submissive request
    that it be at once annulled. — Zielomyśl is an appurtenance of the lordship of Pszczew which has been
    sold to the subjects — be it a demesne or a rustic parcel — enough that everything has been sold to
    the people, and everything is now exactly [uncertain: reckoned] which has been attached to this or
    that matter. — Your Serene Highness has reserved to Yourself no right over the parcels, but only the
    right of superior ownership, in such manner that You will approve everything which those people, who
    are now called proprietary possessors, lay before You, and will receive for it Your 10 per cent transfer
    fees (Laudemia). The so-called hereditary tenants have also already taken the Landeberg heirs to task,
    and demand the estate back, since the contract of the said [uncertain: Radki] is false. Were Your
    Serene Highness now to approve matters contrary to this and to the contract, and to consent to a sale
    without the knowledge of the hereditary possessors, then the people would have a right to complain,
    and every single individual could frame against You so costly a lawsuit as would [uncertain: drive
    out] all the advantages gained. Besides which, it is again amply [uncertain: doubtful] to grant a
    burgher now demesne'

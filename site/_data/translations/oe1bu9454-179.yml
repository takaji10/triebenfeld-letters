- page: 5
  en: 'Now as concerns the Glenck letter of the 28th of February, I answer thereto most deeply obediently
    that the Prusimska matter is as foreign to Glenck as colour is to one born blind. Were it possible
    for me to be everywhere at once, I should pursue this affair too with equal force. But since this
    cannot be done without arrogating to oneself divine attributes like a madman, I must keep to the chief
    matters, and work upon these with honest zeal, in order to establish Your Serene Highness''s peace.
    For the rest, I console myself with this, that Mr Glenck has merely feigned this matter with his year,
    in order now to have material for writing to Your Serene Highness and to recall his [uncertain: Pracheregen]
    to Your Highness''s memory.


    His purpose he has attained, in that I must now see and speak with him. — My judgement was nevertheless
    correct, for of the Prusimska matter he knew nothing; only the consent for the sale of his lands was
    the object upon which he discoursed. He vaunted his many years of service, and that he had made 42
    journeys in Your Serene Highness''s affairs — for which, in his opinion, he believed he had deserved
    a far greater remuneration than this trifle. To make an end of the thing, I asked him what he actually
    wanted, if he were to sell the lands back to Your Serene Highness. His answer was that he could not
    let them go for [illegible] under 8000 Rthl. For he had already made a gift to Your Serene Highness
    of 330 Morgen of land which Your Highness had promised him besides the bailiwick and the 300 Morgen
    of forest — this surely was already more than reasonable, and in case one should wish to refuse him
    the consent, he would bring suit and demand these as well. — In order to make an end of all these
    [uncertain: bachensee] of Glenck''s, I have promised him the 8000 Rthl sub spe rati, and I submit
    myself herein to Your Serene Highness''s commands — but the consent'

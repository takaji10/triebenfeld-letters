- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most gracious letters of the 19th and 27th of March I received so late
    only because they lay a very long while in Słupca. It is more than sorrowful for me that I must live
    so far removed from Your Serene Highness and have news so seldom. It falls particularly hard upon
    me to act when Your Serene Highness leaves me so long without any answer whatever. Meanwhile I give
    myself the honour of reporting to Your Most Serene Highness most obediently how all matters have prospered.


    After I had put everything in order on the estates, I betook myself hither again to Berlin, in order
    to work here and if possible to bring the matter to a conclusion.


    The dismemberment, as Your Serene Highness knows, has been approved most honourably, and His Majesty
    the King himself has vouchsafed me his high approbation. The Betsche affair too has been approved
    at the Chamber, laid before the King for approbation by General Honrichs''s department, and this very
    day it came in here executed by the King. This affair, which threatened Your Serene Highness with
    great danger, is now likewise quite cleared up. The assessments of the Kalisz Chamber are likewise
    completed; they have


    A) turned out as the copy under A shows, and lie at this moment before the General Finance Department,
    from which tomorrow I am to receive an authentic attestation concerning the permanently established
    revenues of the estates'

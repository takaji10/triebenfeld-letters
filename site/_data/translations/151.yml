status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord! I have the honour of having just this moment received Your
    Most Serene Highness's two letters of the 30th of November and the 2nd of Xbr [December]. It gladdens
    me most heartily that Your Most Serene Highness has in Herr v Nothardt so genuine a friend, through
    whom much good will be able to be effected. That he was to become Director I did indeed already know,
    but the particular manner of it was unknown to me. The affair with Herr v Harlem and Councillor of
    War Nöldichen is meanwhile causing much terreur — and Herr v. Nothardt has every reason to pray to
    Heaven that Herr v. Voss does not avenge his favourite upon him. Things go very badly for me here
    — It seems as though Heaven were setting itself against all business — the Mennonites are here in
    Trąbczin and wish to buy both estates together. I am having the people provided for and every kindness
    shown them, so that I may keep them in good humour — Meanwhile, on account of the great snow, which
    lies more than a foot deep, nothing can be undertaken. One hundred Hufen of the Grądzin and Drzewitz
    forest I am selling gladly for rent. This amounts to 3000 Rthl in interest and consequently 60000
    Rthl of capital. Which, in the event that I do not do the latter, then the poor grounds remain to
    me, and the assessment would turn out very low, especially
- page: 2
  en: especially since such frightful shortfalls are showing themselves. For the Suvigria yields, instead
    of 1800 Rthl in interest, only 918 Rthl in all; Wrąbczyn, instead of 1500 Rthl, only 1123. On the
    forest very little is to be reckoned, given the low timber prices; I must therefore think upon artificial
    funds, so that a value befitting the matter may be arrived at in the assessment, inasmuch as by means
    of the loan — so as to squander nothing here — all ill-will may be forestalled and the principal debts
    paid. The assessors had at first taken the matter according to the tableaux, but when it came to the
    examination of the people, by which the revenues were to be proved, everything differed so greatly
    that we must alter the whole assessment. Lichnowski has laid an arrest upon a part of the Ten Thousand
    Rthl which the Olesnic people are to pay at Christmas, so that from that source only some 6000 Rthl
    will be obtainable. With the Wrgberin people I must deal very warily, for as Nerlich tells me they
    are refusing to pay the Christmas instalment. Even if in truth no snow lay, it would still be very
    inexpedient to proceed now with the measuring-out of the lands. In the meantime nothing remains at
    Wrgberin for Your Serene Highness, and the fine village yields nothing further than the sum censured
    above, which according to the surface area, if the Morgen were reckoned at 1 Rthl, is said to amount
    to 2958 Rthl.
- page: 3
  en: These, however, are matters that can now no longer be altered — I, meanwhile, shall give away no
    Morgen at less than 1 Rthl rent, however poor the land may be, and in the case of lands and meadows,
    with the good marshes, nothing goes for less than 300 Rthl in ready money and 15 Rthl yearly interest;
    for that I stand surety. Were the weather not too much against me, I should perhaps already be finished;
    as it is, however, I must let God dispose, and hold myself to the drawing-up of the assessment. The
    interest to Lignowschen is being paid here — Your Serene Highness will nevertheless receive from here
    some 8000 Rthl at Christmas. For the Schlabrendorff woman and for Lichnowski I must fetch the capital
    sums from Berlin, which then, when the Mennonites pay, can be discharged again. Whatever good will
    and human powers can accomplish, I shall summon up, to guide everything, despite the hideous weather,
    to the best end. In deepest reverence I remain, until death, Your Most Serene Highness's most humble
    and obedient servant. Trąbczin, the 7th of December. v Triebenfeld 1804

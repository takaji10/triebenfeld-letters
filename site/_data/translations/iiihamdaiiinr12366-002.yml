- page: 10
  en: 'with the guardianship of Madame Miączyńska, it is just that the Prussian Government, which had
    appointed them, should, in redressing the wrongs that their negligence may have done to the interests
    of its ward, free the estates of Madame Miączyńska from the debts which she had not contracted, and
    which she is not bound to discharge, either by the principles of all justice or in conformity with
    the Prussian laws.


    Warsaw, 29 April 1818'

- page: 3
  en: 'illness and death of his wife, legalised by Count Cathane, Prussian Councillor of Legation to the
    Republic of Venice, and at the same time begged that the time fixed for his justification be extended;
    but before he could obtain this he succumbed to the illness from which he was suffering, and which
    had forced him to seek relief in foreign countries.


    Madame Miączyńska, then of tender age and an orphan, deprived of all the help of a legal guardianship,
    had been unable to pursue her rights to her father''s fortune. The Prussian Government meanwhile disposed
    of it in the following manner. It granted:


    To Prince Hohenlohe Ingelfingen the estates of Kolno, Kamionna and Trąbczyn, and others situated in
    the district of Konin.


    To General Sanitz:


    The domain of Pawłowo with its appurtenances.


    [Written by the receiving office:]


    [to the illness from which he was suffering:] 1803. Oct.


    [deprived of all the help of a legal guardianship:] untrue


    [The Prussian Government meanwhile disposed of it:] Why then has she kept silent since 1807, when
    she was put back in possession?


    At the time of the political changes which came about in 1807, the Emperor of the French, wishing
    to do justice to the claims of all the Poles whose estates had been confiscated by the Prussian Government,
    issued a decree by virtue of which all the confiscations were abolished and the lawful owners reinstated
    in possession of the estates'

  en: 'Copy


    The Commissioners Plenipotentiary for the liquidation of the assets and liabilities of the former
    Duchy of Warsaw have just made the following statement on the claims addressed to them by Countess
    Micheline Miączyńska, née Prusimska.


    The object of these claims is: that the hereditary estates of the said Countess, confiscated in 1796
    from her father, the Starost Prusimski, by the Prussian Government, and into the possession of which
    she was reinstated by an order of the Governing Commission of the former Duchy of Warsaw of 21 July
    1807, made by virtue of a decree of the Emperor of France of 5 July 1807, be relieved of the debts
    contracted by the donees who had held them temporarily; that the amount of these debts be counted
    among the liquidated liabilities chargeable to the Prussian Government; and that the said estates
    be thereby restored to the state in which they were at the time of their confiscation, and the owner
    protected against the proceedings of the creditors.


    In support of her request Madame Miączyńska alleges the following circumstances:


    That the Starost Prusimski, her father, possessed hereditary estates, namely:


    [Written by the receiving office:]


    [chargeable to the Prussian Government:] As if Prussia were answerable to anyone at all for acts of
    government in former South Prussia!'

- page: 2
  en: '1. Kamienno and Kolno, district of Międzyrzecz, in the Grand Duchy of Poznań.


    2. The estates of Pawłowo, Dzwonowo and Berenkusz, district of Wągrowice, in the same Duchy.


    3. Trąbczyn and Szetlowek with their appurtenances, in the district of Konin, Palatinate of Kalisz,
    in Poland.


    The poor state of the health of the said Starost and of that of his wife obliged him in 1794 to go
    to Italy.


    The Prussian Government summoned Mr Prusimski and his wife in October 1795 and in February 1796 to
    justify the reasons which had led them to leave the country, accusing the former at the same time
    of having taken part in the insurrection of 1794. Later, on 24 March 1796, that is to say a month
    after the second summons, without hearing Prusimski''s answer, the said Government had all the estates
    designated above confiscated.


    [Written by the receiving office:]


    [the health of the said Starost and of that of his wife:] So now he was ill too! She only fell ill
    at Venice


    The Starost Prusimski, who had just then lost his wife, was at Venice. Having had knowledge only very
    late of the aforesaid summonses, which reached him only some months afterwards, he thought it his
    duty, in order to justify as soon as possible the reasons for his departure from Poland, to send the
    Prussian Government a certificate of the'

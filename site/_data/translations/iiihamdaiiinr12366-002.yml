- page: 5
  en: 'be referred to the Prussian Government."


    It follows from this that the legitimacy of the rights of Madame Micheline Miączyńska cannot be called
    in question; and indeed she would have had no ground to make new claims if all her estates had been
    restored to her, as Pawłowo was, in the same state in which they were at the time of their confiscation.
    But the estates of Trąbczyn and Szeltowek were burdened by the donee Prince Hohenlohe with a sum of
    156,000 Reichsthaler. Those of Kolno and Kamienno, which the said Prince had sold to the Bank cashier
    Leyner for the sum of 142,000 Reichsthaler, are likewise mortgaged for the sum of 160,000 Reichsthaler.


    Madame Miączyńska, referring to the decree of the Government of the Duchy of Warsaw of 21 July 1807,
    requests that the aforementioned estates be put back in the same state in which her father had left
    them, that is to say free of every mortgage charge; in support of this request she represents:


    [Written by the receiving office:]


    [be put back in the same state:] Where is that written? Not even in the Napoleonic decree.


    [against all justice:] untrue


    1. That the Prussian Government had confiscated the estates of the petitioner against all justice
    and without regard to the incontestable right she had to them as a minor and an orphan. That although
    this Government'

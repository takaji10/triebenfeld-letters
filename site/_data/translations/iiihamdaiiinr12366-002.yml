- page: 6
  en: 'disposed of the aforesaid estates in favour of Prince Hohenlohe and General Sanitz to reward their
    services, such a donation could nevertheless only be temporary, as the political events which came
    about in 1807 proved: in changing the order of things then existing, they produced the same effect
    on the particular circumstances that arose from it; for in giving existence back to a part of Poland,
    the private owners were at the same time re-established in possession of the estates which had been
    unjustly confiscated from them. Now it follows from this that, the donations once annulled, all the
    transactions deriving from them necessarily had to be annulled in all their effects, so that the debts
    mortgaged on the aforementioned estates can fall only on the donees who contracted them. It is in
    consequence of this principle that the Minister of Justice, by his decision of 30 November 1817, referred
    to the Prussian Government the claims of Leyner, purchaser of the estates of Kolno and Kamienno.


    [Written by the receiving office:]


    [as the political events ... proved:] but for as long as he possessed it, he possessed it lawfully
    and with full right of ownership


    [unjustly confiscated:] Where is that written?


    2. That since the Emperor of the French and the Governing Commission had judged it equitable to give
    back to the owners the estates unjustly confiscated from them, the effect would not answer to the
    purpose for which this act of justice'

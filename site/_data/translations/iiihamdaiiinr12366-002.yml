- page: 9
  en: 'the creditors will settle their claims on the indemnity that will have been granted to him.


    That such an opinion could not be appreciated by the Prussian Government once this affair has been
    laid before it in its true light, the justice of the cause itself seems to be the guarantee, seeing:


    1. That the said Government, without waiting for the Starost Prusimski to justify the reasons that
    had prompted his departure (and which could be none other than those of health, as is proved by the
    death of his wife, whom he survived only a short time), at once had all his estates confiscated.


    2. Madame Miączyńska, of tender age and an orphan, had a right, in conformity with the Prussian laws,
    to the protection of the Government; as a minor she could not, by the same laws, be held responsible
    for the conduct of her parents, even had it been recognised as reprehensible. Nor could she be deprived
    of the fortune of her father, whose lawful heiress she was, all the more since it was the obligation
    of the said Government to watch over the integrity of the rights of its ward. If the fault lies with
    the persons charged'

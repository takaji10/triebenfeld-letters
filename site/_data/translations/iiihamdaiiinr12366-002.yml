- page: 8
  en: 'judged it proper to indemnify him by granting him another estate, called Hetzendorff.


    It acted likewise towards General Zastrof, granting him the estate called [uncertain: Lama] in place
    of that of Manieczki, restored to the Senator Palatine Wybicki.


    Now the said Government cannot refuse to indemnify Prince Hohenlohe by undertaking to pay for him
    the debts with which he burdened the estates now belonging to Madame Miączyńska.


    From this historical account of the affair it follows:


    That since the Government of the former Duchy of Warsaw had refused to satisfy the claims of the Prussian
    one as regards the indemnification of the donees for the loss of the estates taken back from them
    to be returned to their lawful owners, and since the latter recognised it as equitable to indemnify
    the same donees in its own country and from its own funds, it is consequently beyond doubt, although
    it has not acted in the same way towards Prince Hohenlohe, that the motives which had determined it
    to indemnify the former will lead it also to observe the same principle of equity towards the said
    Prince. In that case'

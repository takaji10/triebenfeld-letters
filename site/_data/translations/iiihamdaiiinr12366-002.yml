- page: 4
  en: 'of which they had been deprived. It is in consequence of this decree that the Senator Palatine
    (Woywod?) Wybicki recovered possession of his estate called Manieczki, and after him Countess Micheline
    Miączyńska, then widow of her first husband Dąbski.


    General Niemojewski and Wichrowsky were likewise reinstated in their respective properties in consequence
    of an order of the Government of the Duchy of Warsaw of 21 July 1807.


    When the Duchy of Warsaw passed under the sceptre of His Majesty the King of Saxony, the Prussian
    Government made representations on behalf of General Sanitz, aiming at the restitution to him of the
    estate of Pawłowo. The King of Saxony asked the opinion of the Council of Ministers of the said Duchy
    on this matter.


    The aforementioned Council, in the report which it addressed to the King under date of 5 December
    1810, had given its opinion as follows:


    [Written by the receiving office:]


    [of which they had been deprived:] Not even Napoleon granted them a claim on account of what had happened
    in the meantime.


    [Manieczki:] +) District of Kosten, government district of Poznań


    "That Madame Micheline Dąbska (at present Miączyńska), as lawful owner of the said estates, must be
    maintained in their possession, and that General Sanitz, who held them only by a precarious title,
    should, as to the claims he makes on that account,'

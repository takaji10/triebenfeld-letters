- page: 7
  en: 'had been done, if the said owners were to be bound to pay the debts with which their estates had
    been encumbered by the donees; seeing that in such a case they would have recovered only an onerous
    and purely illusory title of inheritance.


    3. The rights of Madame Miączyńska and those of General Niemojewski and of Wichrowski to the estates
    they claimed being of one and the same nature, the restitution of those estates took place in consequence
    of decrees issuing from one and the same principle.


    Wichrowski recovered possession of his estate of Beskyn free of debt. General Niemojewski took back
    his own in a like state. And Madame Miączyńska herself was reinstated in her estate of Pawłowo, held
    by General Sanitz, likewise free of debts; why then should she be bound to discharge those with which
    Prince Hohenlohe had encumbered the estates granted to him?


    [Written by the receiving office:]


    [they would have recovered only an onerous title of inheritance:] They got back what was there.


    [Prince Hohenlohe had encumbered the estates:] Because here there are debts.


    4. The Prussian Government, wishing to reward the services of General Sanitz, made him a gift of the
    estates confiscated from the parents of Madame Miączyńska; but when these estates were taken back
    from the donee, the said Government'

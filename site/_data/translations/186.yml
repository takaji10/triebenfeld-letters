- page: 1
  en: 'Dear Friend! The business with H[err] Weigel is as good as settled — he sent me his assent yesterday
    evening — and asked me to come in here today, or, if I would permit it, he would spend Thursday with
    me at the [uncertain: Schweineren] — I have accepted the latter and have asked him to come out to
    me tomorrow for a [uncertain: Seyen]. What I now lack is the means to entertain the old gentleman
    properly and to warm the [uncertain: gentleman/heart]. It is for the sole good of our upright Prince,
    and therefore I put you, dearest friend, under requisition — and beg for one bottle of old [uncertain:
    Rhine] wine and for one bottle of really good old sweet Hungarian Ausbruch, likewise for 6 peaches
    and 2 bunches of grapes — everything else I have; I came in expressly on that account. — Should my
    note not reach you today, then do by all means send me the wine and the fruit out to me. Ever I remain,
    Breslau, the 29th of August 1810. Your true friend and servant v Triebenfeld'

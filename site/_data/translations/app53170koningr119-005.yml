- page: 1
  en: 'Done in Konin on Thursday next after the Sunday Cantate, being 22 May 1783.


    On behalf of His Honour Prusimski, Captain of Niszczewice, against the Right Honourable Chełmski,
    Treasurer of Wschowa — Report


    Appearing in person, the Honest Bartłomiej Szepczyński of the village of Trąbczyn, General Royal Court
    Summoner, being sound, recognized that he had served authentic citation letters for the Kalisz Municipal
    Court sessions, of the underwritten tenor as follows:


    Casimir Nałęcz Raczyński of Raczyno and Matoszyn, Captain-General of Greater Poland — to you, the
    Right Honourable Stanisław Chełmski, Treasurer of Wschowa — from your estates and from all sums of
    money of every kind generally, had and to be had, we command: that you appear in person and peremptorily
    at our next Kalisz Municipal Court sessions, next to be held at the Kalisz Municipal Court, at the
    instance of the Illustrious Right Honourable Antoni of Kolno Prusimski, Captain of Niszczewice, as
    plaintiff — who cites you — and this for the following: that you lift from the plaintiff the penalty
    of fourteen Polish marks, paid for the plaintiff to the exchequer of the Instigator of the Court of
    the Crown Tribunal of Piotrków, and that the process obtained against the plaintiff on that account
    from the Register of Penalties be quashed, and the plaintiff declared free — you are to comply with
    the citation and respond judicially.


    Given in the Kalisz Municipal Court on 15 May 1783.


    At the manor house of the estates of the village of Łukom, at the chair in the entrance hall, with
    a household youth present, on this present day, preceding the present act, set down and left notified.'

- page: 5
  en: 'without hindrance from any man.


    Accordingly We command and enjoin all Our Supreme Provincial Colleges, as also all other authorities
    whom this concerns, hereby as graciously as earnestly, that they in no wise hinder or trouble either
    the aforementioned Lord Prince of Hohenlohe-Ingelfingen, Your Lordship, in the heritable and proprietary
    possession thus granted to him of the above-named appurtenant parcels belonging to the estates of
    Pszczew, Zagórów and Wieniec, nor him or those upon whom he shall in time bequeath the same by virtue
    of this Our letter of grant, or otherwise lawfully transfer them by other acts inter vivos aut mortis
    causa, but rather shall let His Lordship, and in the event also them, enjoy the same freely and quietly,
    themselves doing nothing'

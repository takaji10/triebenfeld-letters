  en: 'Certified copy.


    We Friedrich Wilhelm, by the Grace of God King of Prussia etc. etc., Margrave of Brandenburg, Arch-Chamberlain
    and Elector of the Holy Roman Empire; sovereign and supreme Duke of Silesia, Sovereign Prince of Orange,
    Neuchâtel and Valangin, as also of the County of Kłodzko, Duke in Geldern, at Magdeburg, Cleve, Jülich,
    Berg, Szczecin, Pomerania, of the Cassubians and Wends, at Mecklenburg and Krosno Odrzańskie, Burgrave
    of Nuremberg above and below the mountains, Prince of Halberstadt, Minden, Camin, Wenden, Schwerin,
    Ratzeburg, East Frisia and Mörs, Count of Hohenzollern, Ruppin, of the Mark Ravensberg, Hohenstein,
    Tecklenburg, Schwerin, Lingen, Bühren and Leerdam; Lord of Ravenstein, of the lands of Rostock, Stargard,
    Limburg, Lauenburg, Bütow, Arlaÿ and Breda etc. etc.


    Do hereby make known and declare, and by virtue of this Our open letter, for Ourselves and Our descendants
    and successors in the Crown, in the Electorate and in Our'

- page: 8
  en: 'in the Konin district thereof, to which the demesne farm Broniki belongs as an appurtenance, has
    been conveyed to the reigning Prince of Hohenlohe-Ingelfingen, Friedrich Ludwig, Serene Highness,
    by His Majesty King Friedrich Wilhelm the Third, with heritable and proprietary rights, by the letter
    of grant dated Berlin, the 1st of December 1797; and the Titulus Possessionis has been entered for
    him on the ground of that instrument ex Decreto of the 31st of July 1801. Thereupon are entered:


    I. Onera perpetua: restrictions upon the property or upon the disposition thereof.


    1. By virtue of the ordinance of the year 1796 and the Court Rescript of the 24th of February 1800,
    this estate may not be sold without special consent to a native of the land. Which has been noted
    here ex officio, ex Decrete of the 31st of July 1801.


    II. Judicially secured debts and other real obligations.


    Nothing.


    Apart from the foregoing restriction, nothing is entered against the estate Swięcia in the mortgage
    book; and for the rest this mortgage'

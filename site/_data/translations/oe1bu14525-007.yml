- page: 3
  en: '2.) at Zagórów the little village of Swięcia, and finally


    3.) near Wieniec, Konty, Siedlemyn, Batkowo and Karczyn, against payment


    1.) of the sovereign dues hitherto rendered from the said settlements, Hollander holdings and parcels
    of land, as a fixed and unalterable canon, and


    2.) of the stipends due therefrom to the ecclesiastical corporations and foundations.


    We also do this hereby and by virtue of this present instrument, out of Our royal power and plenitude,
    for Ourselves and Our descendants and successors in the Crown, in the Electorate and in Our other
    lands, in such manner and to the effect that Our aforesaid friendly dear Uncle, the reigning Prince
    of Hohenlohe-Ingelfingen,'

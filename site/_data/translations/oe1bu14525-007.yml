- page: 2
  en: 'other lands, that out of the particular friendship and affection We bear towards the High-Born
    Prince, Our friendly dear Uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, and also
    in order to give him a new proof of Our royal gratitude for the distinguished and beneficial services
    rendered to Us and to Our Royal House, We have found Ourselves moved to make over, grant and convey
    to Your Lordship, heritably and in full property, in addition to the estates already granted to him
    by the instrument of the 19th of June of this year, namely Pszczew, Zagórów and Wieniec, the appurtenant
    parcels belonging to those estates, namely


    1.) at Pszczew, the settlements of Stołuń, Kuligowo, Szarcz, Vogtey, Zielomyśl and Silna together
    with the Hollander holdings, the Pommser Hollander holding and Heÿdemühle'

- page: 4
  en: shall from now and for all time, for himself and his descendants and heirs, irrevocably have, hold,
    possess and enjoy from Us and Our descendants and successors, as a true, well-acquired and unrestricted
    property, the above-named appurtenant parcels belonging to the estates of Pszczew, Zagórów and Wieniec,
    with all rights and privileges attaching thereto as these have hitherto been exercised or may lawfully
    be exercised, with all the lands belonging thereto in fields, woodlands and meadows, likewise in ponds
    and waters, according to the lawful boundaries and bounds, just as everything has hitherto been used
    or may of right be used; and that the power and authority shall be vested in him to dispose thereof
    at his pleasure under the conditions mentioned above,

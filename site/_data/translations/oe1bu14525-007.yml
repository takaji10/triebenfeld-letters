  en: 'against it, nor occasion or permit such to be done by others, upon pain of Our most high displeasure
    and of unfailing severe punishment. In witness whereof under Our own most high signature and appended
    Royal seal. Thus done and given in Our residence city of Berlin, the first of December after the birth
    of Christ our Lord in the one thousand seven hundred and ninety-seventh year, and in the first year
    of Our royal reign. Friedrich Wilhelm


    Letter of grant for the reigning Prince of Hohenlohe-Ingelfingen. Hoym. Reck. for the heritable and
    proprietary possession of the appurtenant parcels belonging to the estates of Pszczew, Zagórów and
    Wieniec.



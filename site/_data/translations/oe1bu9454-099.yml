- page: 3
  en: 'when they write to the sovereign — the draft which the councillor of war von Cöln made concerning
    Krotoszyn, and which the King gave to the Cabinet Councillor Beyme of them all, has been handed over
    by the latter to Mr von Voss — who, however, has written to the King too impertinently and moved for
    the dismissal of this man — Colonel von Köckritz is greatly incensed at this and holds [uncertain:
    um 13] to be false — He has at once so turned the matter that [uncertain: Löte], as the most honest
    man, is to be transferred to Wrocław — this has now turned out better than anyone could [uncertain:
    den] it. For Carl Theodor Fischbach at Pszczew may Your Serene Highness be pleased to have the patent
    as commission councillor made out. In deepest reverence I remain, until death, Your Most Serene Highness''s.
    Broniewski will surely not be permitted to receive a heller, for now [uncertain: Mier] are witness
    that the fellow has already taken more out of the estates than is his due — I shall now pursue the
    matter with zeal — also well if one can save a sum here. Wrocław, the 1st of February 1799.


    most faithful and most humble servant


    von Triebenfeld'

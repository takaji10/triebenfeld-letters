- page: 3
  en: 'when they write to the Sovereign. The draft which the councillor of war von Cöln made concerning
    Krotoszyn, and which the King gave to the cabinet [uncertain: Bey:] for all, was handed over by the
    latter to Herr von Voss — who, however, wrote too haughtily to the King and moved for the dismissal
    of this man — the [uncertain: O v Ko.] is greatly incensed at this and holds 13 to be false — He at
    once turned the matter so that the [uncertain: Löte], as the most honest man, is to be denied to Breslau
    — this has now turned out better than anyone could have [expected]. For Carl Theodor Fischbach at
    Betsche may it please Your Serene Highness to have the patent as commission councillor made out. In
    deepest reverence I remain, until death, Your Most Serene Highness''s. Broniewski will surely not
    be permitted to receive a single heller, for now I have witnesses at hand that the fellow has taken
    more out of the estates than is due to him — I shall now pursue the matter with zeal — also well if
    one [uncertain: rescues a sum here]. Breslau, the 1st of February 1799.


    faithful most humble and obedient servant v. Triebenfeld'

- page: 2
  en: 'already so prepared the matter in the letter to Mr von Prittwitz that he will take Wildeganst as
    his assistant. At my departure from Berlin everything seemed to be full of anxious expectation on
    account of the war. Almost everyone held it to be unavoidable, and even the King is said to have shown
    an inclination to strike out with the whole army. The Cabinet Councillor Mencke would not permit [uncertain:
    Brand:] to travel away for 10 days, because he believed that important things would shortly come to
    pass, and that even changes among the ministers might occur — It was also said with complete certainty
    that one or two more Cabinet Councillors were to be appointed, for which a couple had already been
    proposed — this is indeed to be wished for, since then a Cabinet letter will no longer be permitted
    to instruct a reigning Prince and first commander, nor any longer ministers and whole boards of office,'

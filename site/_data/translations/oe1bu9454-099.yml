- page: 2
  en: 'already so framed the matter in the letter to Herr Prittwitz that he will take Wildeganster as
    his assistant. On my departure from Berlin everything seemed to be full of anxious expectation on
    account of the war. Almost everyone held it to be unavoidable, and even the King is said to have shown
    an inclination to strike out with the whole army. The cabinet [councillor] Mencke would not permit
    Brand: to travel away for 10 days, because he believed that important things would shortly come to
    pass, and that even in the Ministry changes might occur. It was also said quite certainly that one
    or two more cabinet councillors were to be appointed, for which a couple had already been proposed
    — this is indeed to be wished for, since then a cabinet secretary will no longer be at liberty to
    instruct a reigning Prince and first commander, nor Ministers and whole judicial boards either,'

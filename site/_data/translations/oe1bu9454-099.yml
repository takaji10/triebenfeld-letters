  en: '99


    Most Serene Prince


    Most gracious Prince and Lord!


    My warmest wishes are still only these, that Your Most Serene Highness may have arrived right happily
    and contented [uncertain: u] Öhringen; the affairs which otherwise lie upon my heart will surely be
    concluded in the best manner and everything brought [uncertain: ann] to the desired end. Upon the
    letter submitted last of all, also to Colonel von Zastrow, only the enclosed reply has followed; nevertheless
    I departed with the firmest assurance from every quarter that Your Most Serene Highness will obtain
    the Krotoszyn estates. Even Mr von Voss is said to have pitched his tone very much lower, and the
    notorious Nöldichen is hard pressed. Serene Highness von Köckritz, who now conducts himself quite
    tolerably in this matter, says that the conclusion of the affair will be entrusted to [uncertain:
    9. f.] von Knobloch and Prittwitz. Here Wildeganst can do everything; he is an intimate friend of
    them both, and he sees more clearly than many — I have therefore'

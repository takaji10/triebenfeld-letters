- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    My most fervent wishes are still only these, that Your Most Serene Highness may have arrived at Öhringen
    quite happily and content; the affairs which otherwise lie upon my heart will assuredly be brought
    to the best of conclusions and everything brought to the desired end. Upon the letter lastly also
    submitted to [uncertain: d. D. c.] Zastrow only the enclosed answer has indeed followed; each [time]
    I have departed from everyone with the first assurance that Your Most Serene Highness will obtain
    the Krotoszyn estates. Even Herr von Voss is said to have toned down his manner very much, and the
    notorious Nöldichen is in straits. His Serene Highness von Köckritz, who at present conducts himself
    quite tolerably in this matter, says that the conclusion of the affair will be entrusted to the 9th
    [uncertain: f. v.] Knobloch and Prittwyl. Here Wildeganst can do everything; he is the intimate friend
    of them both and he sees more clearly than many — I have therefore'

segments:
- page: 1
  en: 'P. M. It is necessary that at Zagorowo a Chief Forester be appointed – I had designated the old
    Richter''s son, and at the brew[text lost] my distillery the Nogeln''s nephew as propination official;
    but the Richter must now administer the latter, because the Nageln has recalled her nephew – So, as
    said above, a Chief Forester is necessary – if Your Serene Highness wishes to help the poor Radzowski,
    then deign to send him here quickly – With 300 Rthl yearly he must be content until Heaven helps further.
    If you approve this, most gracious Lord, then send Radzewski with all haste and send me at once your
    opinion concerning the baptism of the estates, with

    v Triebenfeld'

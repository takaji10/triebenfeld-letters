status: draft
segments:
- page: 1
  en: '4th of March.


    Done at the grounds of the estates of the village of Trąbczyn, and at

    the manor sitting there, on Monday after Judica Sunday of Lent, that

    is on the 29th day of the month of March, in the year of our Lord one

    thousand seven hundred and eighty-four. Present the Magnificent and

    Generous Eugeniusz de Gora Skarbek, castellan [written "Castellanida"]

    of Uniejów [Junivladislavia], Tomasz Zelisławski, burgrave of the

    castellany of Konin, Dominik Zboina [written "Zboinatis"], sub-

    deputy chamberlain [written "Subdapifinda"?] of Bydgoszcz, Ignacy

    Łaszkowski, Walenty Zeromski, and others; as also the Prudent

    Bartłomiej Szepczyński of the village of Trąbczyn, a general

    ministerial of the kingdom, who proclaimed the present act.


    The castellany and condescension offices, the burgraviate of Sieradz

    [written "Syradien"?] and the general commissionery office of the

    palatinate of Greater Poland, proceeding to the ultimate limitation,

    by the castellany offices of Gostynin, the judged and commissionery

    office subscribed below, at the grounds of the present estates, on

    Monday after the feast of St Andrew the Apostle, that is on the first

    day of the month of December of the year last past, 1783 — after the

    commanded completion of the bringing of the documents, which followed

    in the acts of Kalisz and Konin, on the Saturday after the feast of

    the Immaculate Conception of the Blessed Virgin Mary of the same year

    [written "sub~bo"] — upon the decree of the tribunal of the kingdom

    at Piotrków, given on Monday after the feast of St Francis the

    Confessor, that is on the 8th day of the 8th month of the year 1782

    [the day read "videlicet 8ua": the Monday after St Francis of that

    year was the 7th], between the parties named below, heard in

    comparition, being pronounced of its substance; upon the act of the

    primal limitation, in this present place, on Monday after the feast

    of the Most Holy and Undivided Trinity, that is on the sixteenth day

    [one word here the editor could not read, standing for the month] of

    June of the year past, 1783, by the castellany office of Gostynin,

    the judged, and the cameral and territorial office of Gniezno

    expeditory to the acts, on the same 20th day of the same month and

    year; upon the offered and presented [written "per oblatam

    porrecto"], circumscribed to the present day, determined in the acts

    of the present session: condescended in the grounds specified in the

    act, and there, founded on their judicial jurisdiction and by the

    proclamation of the ministerial of the court, the apparitor notified

    the parties [ending doubtful]; they bade those same parties proclaim

    to inscribe their comparition; to whom, indeed, to the Magnificent

    Kazimierz, judge territorial of Brześć in Kujawy, parent of Joanna

    Nepomucena, judge castellany of Radziejów, to Ignacy Ensifer

    Przedecz [the office title and the name both doubtful in part] and to

    Ludwik, judge [doubtful] territorial of Brześć in Kujawy, sons of

    Zakrzewski, the actors and cited ones [written "littis~"]: and indeed

    to the Magnificent Ignacy Ensifer Przedecz and Ludwik Zakrzewski

    [written "p~lr"]; then to the Magnificent Paweł and Józef, brothers

    german among themselves, of Tomicki, likewise actors and cited ones,

    through the same [Magnificent Jakub, parent of Józef, regent

    territorial of Wieluń]: Rafał, Wincenty and Mikołaj, sons [the word

    runs "provercatis"] of the late Magnificent Elżbieta de Tworowicz,

    brothers german among themselves of Taczanowski; and to Piotr and

    Kunegunda de Kowalski, spouses one to the other, of Kołaczkowski,

    actors and cited ones, through the Magnificent Józef Taczanowski,

    regent territorial of Wieluń, in his own and others'' name in person;

    to the Magnificent Franciszek Tworowicz, likewise actor and cited

    one, through the same; to the Most Illustrious Magnificent Antoni in

    Kolno Prusimski, captain of Nieśwież, knight of the Order of St

    Stanisław, cited one and actor in person; to the Most Religious

    [ending doubtful] Benedykt Lubstowski, abbot [written "Ablate"] of

    the convent of Ląd of the Sacred Order of the Cistercians, then the

    Religious [doubtful]'
- page: 2
  en: 'Paweł Wybieralski, prior of the same convent, and the whole convent

    of Ląd, to the cited ones, through the Most Honourable [written

    "Rlndm"] Tesselino Malichowski, general procurator of causes of the

    same convent, to compare; and the parties brought back the two

    original relations of the citation — namely against the Most

    Religious Abbot with his convent of Ląd, for the reproduction of the

    quietation, as much of the sum of three thousand five hundred

    Hungarian ducats as of the jewels and silver of the Prusimski house

    lodged in the same convent or its treasury, or for the judicial

    recognition of the one to whom they were restored; and now against

    the Most Illustrious Magnificent Prusimski, captain of Nieśwież, for

    the bringing of documents [written "documentorium"], general ones

    [written "g~lr"], elucidating the whole mass of the Prusimski and

    Golinski substances and others, before the acts of the castellany of

    Konin on the 6th day of the month of December of the year last past,

    1783, both recognised, to be reposed. Whereas the term of such a

    citation, in the manner of the resolution of the tribunal''s decree,

    by virtue of which act the present one lapsed [word doubtful] —

    therefore the said term declared last [written "lt~mo"], to be

    prosecuted [ending doubtful]. In prosecuting: whereas by the

    tribunal''s decree now executory the bringing of the documents of the

    masses of the substances, as much of the paternal Prusimski as of

    the maternal Golinski, left by the late Magnificences Paweł and

    Antoni Prusimski, sterile ones, as of the loads hanging on the same

    substances, elucidating them, is commanded to be done under oath by

    the petitions [written "p~tibus"] through the courts or offices of

    the condescension, as prescribed; and this bringing, begun in the

    term of the ultimate limitation by the reposition of the names of the

    summaries on either side [doubtful], and the sufficiency of the

    bringing alleged in turn on account of the prorogation that had

    intervened, was not determined — the court of the conditional offices

    binds the said parties to the completing of a more sufficient

    bringing, according to the prescription of the tribunal''s decree,

    and the communication [doubtful] in the nature of the documents,

    and that in this instant. The parties brought the documents

    comprehended both in the summaries, under their own hands and

    subscribed by the judges, and also beyond the summaries, existing in

    the archive of the Most Illustrious Magnificent Prusimski, captain

    of Nieśwież, and communicated them to one another; and the

    Magnificent Ignacy Zakrzewski, ensifer Przedecz, corroborates the

    summary subscribed by the Magnificent Kazimierz Zakrzewski, judge

    territorial of Brześć in Kujawy, parent, with his own subscription;

    and the Most Illustrious Magnificent Prusimski, captain of

    Nieśwież, attached some documents to his own summary and subscribed,

    and on account of the non-persistence offered the oaths again in

    this bringing; which oaths the court of the conditional offices,

    declaring them admissible, decrees that they avail to this effect:

    that all the documents generally, pertaining to the present cause,

    the masses of the substances, as much the paternal Prusimski as the

    maternal Golinski, left by the late Magnificences Paweł and Antoni

    Prusimski, sterile ones, as the loads hanging on the same substances,

    elucidating [them], they really brought; and that they conceal

    nothing of them to the damage and prejudice of party by party — so

    they swore, God and the passion of Jesus Christ aiding, to the

    down-treading of the oath. The oath was taken by the Magnificent

    Ignacy Zakrzewski, ensifer.'
- page: 3
  en: 'The said one only — and to the actors, and the Most Illustrious

    Magnificent Prusimski, captain of Nieśwież — after which the courts

    of the conditional offices pronounced those parties free of further

    bringing; to these parties he bids induce the business. In the

    induction, the resolution of the category against the Most

    Reverend Abbot and Venerable Convent of Ląd, introduced by the

    original actor party, being suspended, he commands the original

    agent parties to proceed further in the [word doubtful: read by its

    sense as "principal"] business. In proceeding: the controversies of

    the parties, namely of the Magnificences Zakrzewski, Tomicki,

    Taczanowski, Kołaczkowski and Tworowicz, in respect of the

    succession after the fates of the late podskarbi of His Royal

    Majesty Paweł and of Antoni, brothers german among themselves

    Prusimski, sterile decedents, out of the substance acquired — as

    acknowledged in the fourth share by the tribunal''s decree — the

    said acquisition burdened by the loads borne over by the same

    Magnificences Prusimski: indeed by the late podskarbi Paweł

    Prusimski, beyond the reparation of the estates ceded to him, in the

    general sum of one hundred seventy-two thousand six hundred

    florins Polish [doubtful]; and then by the late Magnificent Antoni

    Prusimski in the sum of seventy-two thousand eight hundred

    [doubtful] seventy-six florins [abbreviation doubtful] groschen of

    20 Polish reckoning; and they say these sums were exercised by

    court orders [word doubtful] out of the loads borne over — namely of

    the Generous Puchalski ten thousand florins Polish; of the Generous

    Raczycki seven thousand florins Polish; of the Generous Pomorski two

    thousand and one florins Polish of the successors of Radolin

    [doubtful]; forty thousand florins Polish; of the Generous Lady

    Nierzychowska [eighty? thirty?] thousand florins Polish; and of the

    Generous Dziembowski men twenty [doubtful] three thousand florins

    Polish; of the Generous [name cut at its start]kowski seven hundred

    florins Polish; of the Generous Obarzankowski [doubtful] thirty

    thousand and three florins Polish [read "Triginta Trium": elsewhere

    the entry gives this family 33,000]; of the Generous [name cut]

    bowski six hundred sixty-six florins groschen 20 Polish; of the

    Generous Zaleski one thousand florins Polish; and out of the

    [word doubtful] of Pawłowo twelve thousand florins Polish; and

    others reposed in the court by tables; saying they had exercised

    them as court orders [doubtful], the sum of the maternal fortune

    [making] four hundred four [doubtful] thousand five hundred florins

    Polish; narrating the paternal substance [they put] universally in

    the sum of three hundred thousand six hundred florins Polish; the

    loads, however, in the share of one hundred seventy-four thousand

    seven hundred eighty-five florins Polish deducted from the same;

    and that no more of the clean paternal substance than the sum of

    one hundred twenty-five thousand eight hundred [and] fifteen

    florins Polish entered into the fraternal division [the word

    garbled]; and accordingly there fell to each fraternal caput

    [doubtful] the sum of forty-one thousand nine hundred thirty

    [word doubtful: read by sense as "octo", completing 41,938]

    florins, groschen 10 Polish, they say; demanding the remainder.'
- page: 4
  en: '[The sum runs on from the previous page: of four hundred] four

    thousand five hundred florins Polish, reckoned for the maternal, the

    caput of the late Stefan Prusimski, of the Most Illustrious

    Magnificent Antoni Prusimski, captain of Nieśwież, the parent,

    respected [doubtful]; the sum of the rest, two hundred fifty-nine

    thousand four hundred sixty-six florins groschen 20 Polish, as if of

    the late Magnificences Paweł and Antoni Prusimski left and to be

    divided into two classes, the male and the female sex; and for the

    matter of the same female sex in the share of one hundred

    ninety-four thousand eight hundred florins Polish; but for the caput

    of the Most Illustrious Prusimski, captain of Nieśwież, in the sum

    of sixty-four thousand eight hundred sixty-six florins groschen 20

    Polish, to be divided [beginning doubtful]; calculating; wanting the

    adjudication of the same sums with the provisions; out of the sums

    also of the acquisition enumerated above, of the sum of sixty-one

    thousand three hundred sixty-nine florins groschen 6 Polish,

    likewise with the provisions, urging a separate solution to be

    demanded; and urging that to each female caput, out of the sums

    alleged before, the part having been liquidated, the sum of one

    hundred seventy thousand six hundred forty-four florins groschen 4

    Polish be enumerated by the Most Illustrious Prusimski, captain of

    Nieśwież. Separately, however, considering a certain transmutation

    of the paternal substance into a filial one, out of the reparations

    of the estates and the increased proceeds, of the fourth [part?],

    wanting it acknowledged to themselves. In the distinct category

    introduced against the Most Religious Abbot and the Venerable

    Convent of Ląd: whereas by the cited ones the quietation of the sum

    and of the silver produced out [of the treasury] was not brought

    back [ending doubtful], therefore the fourth share out of the sum of

    three thousand five hundred [doubtful] ducats of gold coin, and out

    of the quota to be found for the silvers, with the provisions, to be

    adjudged to the female capits, they conclude; and a distinct

    conclusion in writing they offer to the burgravial office of

    Sieradz. Now, however, the Most Illustrious Antoni in Kolno

    Prusimski, captain of Nieśwież, knight of the Order of St Stanisław,

    says of the late Magnificent Antoni and Paweł Prusimski, his

    paternal uncles [doubtful], that though they sought some substance

    beyond the divisions offered, yet by the resignations made back of

    the estates, as much the paternal as the maternal, and by the

    contracts the loads pre-assigned by the late Magnificent Antoni

    Prusimski even before the division, which all the brothers took on

    themselves to bear, they alienated both the paternal and the

    maternal fortune [doubtful]; he denies that in that quality and

    quantity they completed the division, and that the tribunal''s

    decree now lying under execution permitted the fortune of either

    kind to be adjudged for the matter of the same Most Illustrious

    Magnificent Prusimski, captain of Nieśwież, [saying] they left the

    quietations of the dowers assigned by the parents before and around

    the lapse of a space of sixty years, lifted more than thrice, the

    original sums over-passed in the provisions, subject to no fortuitous

    case [word doubtful]; and still by the tribunal''s decree of the year

    1760, by the adjudication, to each female caput the sum of nine

    thousand florins Polish bettered — that nothing, even out of the'
- page: 5
  en: 'maternal estates as alienated — nor in the remainder of the

    alienation of the paternal estates that followed by the Magnificent

    Antoni and Paweł Prusimski — suffices, the successors of the female

    sex being able to ask, they clarify; and commemorating that all the

    premises, and the other things reposed in the court among the

    documents, were deduced evidently [doubtful], and concluding the

    liberty of themselves from the demanding of the same successors

    [word doubtful]; the other things brought for and against having

    been heard, the replies heard: the tribunal''s decree, the act

    present constituting [itself], to the distinguishing of the

    substances, as much of the paternal Prusimski as of the maternal

    Golinski. A fraternal division among the late Magnificences Antoni,

    Paweł and Stefan, brothers german among themselves Prusimski,

    followed at Poznań on Monday before the feast of the Nativity of the

    Blessed Virgin Mary in the year 1740 [written "sebsecuta"], and was

    offered [written "oblatuata"] on the same day in the territorial

    acts of Poznań [doubtful]; not segregated; and approaching the

    liquidation of the loads stretching themselves over the same

    fortunes: whereas out of the documents reposed in his court it

    stands evident [doubtful] to his judgment that the estates Trąbczyn,

    Nowawieś, Łazy, Osiny with their appurtenances in the palatinate of

    Kalisz and the district of Konin, then Wierzbno and Brzezno, and

    also Ternilis [doubtful], Kanino [doubtful], Świątniki [doubtful],

    Jaryszki, and the towns of Kamionna and Kolno in the palatinate and

    district of Poznań, standing [written "consisten~"], and the other

    deserts pertaining to the said estates, were possessed by the late

    Magnificent Sebastian Prusimski, son of the late Magnificent Jan in

    Kolno Prusimski, begotten with the late Magnificent Teresa Gajewska,

    to the late Magnificent Krzysztof Prusimski — and that by the force

    of the fraternal divisions in pairs: the first indeed at Poznań on

    Monday after the feast of St Margaret, virgin and martyr, in the

    year one thousand seven hundred, between the said Magnificences

    Sebastian and Krzysztof and Ludwik, brothers Prusimski, initiated

    [doubtful] and corroborated, and wadioned to seven hundred thousand

    florins Polish [read "septies centum": the figure as written],

    formed [written "furimatae"] of the other [the editor''s

    alternative: "parte"], after the sterile death of the late

    Magnificent Ludwik Prusimski, brother german, at Kamionna on the

    23rd day of July in the year 1708, constituted; and corroborated by

    the act of the castellany of Poznań on Friday in the vigil of the

    feast of St Bartholomew the Apostle of the same year, wadioned to

    two hundred twenty-three thousand florins Polish, paid

    [written "soludatae"]; then in satisfaction of the same, the

    complanatio of Poznań initiated on the 3rd day of the month of

    August in the year 1720, authorised by the compromissory decree of

    the 4th day of the same month and year, and corroborated by a wadion

    of forty-seven thousand eight hundred forty-eight florins and

    eleven groschen and a half [word doubtful], for the sum of three

    hundred fifty thousand florins Polish, resigned before the acts of

    the castellany of Poznań on the 4th day after the feast of St

    Lawrence the martyr of the same year; but the estates Wierzbno and

    Brzezno, by a resignatory donation before the same acts on Monday

    after the feast of St Margaret, virgin and martyr, in the year

    1676, by the successors [doubtful] of the late Generous Kazimierz

    [read: Gaspard] Wierzbowski, for the matter of the late Magnificent

    Jan Prusimski, son of Krzysztof, recognised for the sum of

    forty-five thousand florins Polish, to be the paternal Prusimski;

    and by the late Magnificent Krzysztof Prusimski to the Magnificent

    Antoni, Paweł and Stefan, and Jan — dead before the division that

    followed in the year 1740, sterile fates — his sons begotten with

    the late'
- page: 6
  en: 'Teresa Golinska, daughter of the late Magnificent Jan Łoso Golinski,

    burgrave of Konin, begotten with the late Magnificent Konstancja

    Krusińska — her sons begotten, their fates following in the year

    1729 on the 12th day of the month of May; beyond [written

    "pneter~"] the estates Ternilis [doubtful], Kanino, Świątniki and

    Jaryszki, disposed into other hands, to have been left. Lastly the

    estates consortial, and respectively maternal, of the late

    Magnificent Teresa de Golinski: namely Oporowo and the shares

    Oporówka and Kałowo — the resignation attesting, before the

    castellany acts of Wschowa on the 4th day before the feast of the

    Nativity of the Blessed Virgin Mary in the year 1673, by the

    Generous Łukasz Koszutski, to the late Generous Jan Łoso Golinski,

    sold for the sum of forty-three thousand five hundred florins

    Polish [doubtful]; but the estate Prusinowo, by the said late

    Generous Jan Łoso Golinski, according to the resignation before the

    castellany acts of Kalisz in the time of the interregnum [doubtful],

    on Monday after Laetare Sunday [doubtful] of the year 1674

    recognised from the Generous Piotr Radecki, in the shares for the

    sum of seven thousand four hundred [doubtful] florins Polish; in

    the remaining shares sought by the Generous Jan Prusinowski, in the

    tenor of a resignation before the same acts on Monday after the

    feast of Saints Vitus and Modestus, martyrs, of the same year

    [doubtful], for the sum of two thousand florins Polish

    [doubtful]; lastly the estates Szetlewek, that is Szetlewo kątne,

    from the successors [doubtful] Strzałkowski [and another word,

    doubtful] to the late Generous Jan Łoso Golinski, first in the

    manner of an obligation, by the force of a contract at Szetlewek on

    the 9th day of the month of July in the year 1671; then by

    hereditary right, the complanations attesting: the first indeed on

    the 17th day of the month of June in the year one thousand seven

    hundred four, the other on the 20th day of the month of July in the

    year 1706, both [doubtful] between the Generous Marcin Kałowski and

    Konstancja Krusińska, spouses, on the one part, and the late

    Generous Krzysztof Prusimski and Teresa Golinska, likewise spouses,

    on the other part, in respect of the [doubtful] over the estates

    Szetlewek, that the Generous Kałowska extends herself over,

    initiated to the same Generous Teresa de Golinski Prusimska, of the

    maternal sale, having intervened on the 19th day of the month of

    March of the same year in which they remained [the word doubtful]

    by fates; but yet while the parents still stood in life [word

    doubtful], to their daughters, as to the Magnificent Konstancja,

    [wife] of the Magnificent Jan Kowalski; Wiktoria, first of the

    Magnificent Michał Wysocki, second of the Magnificent Michał

    Tworowicz, third [marriage] of Michał [the word doubtful: on page 8

    the same husband stands "Karol"] Odechowski — the quietations

    attesting, with abrenunciations of the paternal and maternal

    estates: the first daughter''s indeed before the castellany acts of

    Kalisz on Monday after the feast of St Giles the Abbot in the year

    1720, the other''s before the territorial acts of Kalisz on Monday

    after Exaudi Sunday in the year 1724, lifted, for whichever sum of

    twenty thousand florins Polish recognised; then of the third

    daughter, the Magnificent Mariana, first of the Magnificent Józef

    Tomicki, by the subordinate marriage of the Magnificent Kazimierz

    Zabriski [doubtful], judge territorial of Brześć in Kujawy

    [doubtful], by the testamentary parental disposition in the year

    1729 before [word doubtful] the fates of the parent constituted,

    assigned in the like quantity as dowry; and this last sister

    [word doubtful: proposed "sororem"] preceding, the complanatio

    [garbled] at Wierzbno on the 24th day of the month of May in the

    year 1737 between the Magnificent Antoni and Jan Prusimski on the

    one part and the same Magnificences Tomicki, spouses [written

    "con~ges~"], on the other'
- page: 7
  en: 'part, before the castellany acts of Poznań [doubtful], on Monday

    before the feast of the Assumption, in the act [doubtful] of

    [word doubtful] of the year 1737, to have lifted; moreover in the

    actorate [doubtful] by the Generous Kowalski men, for the bettering

    of the dowry and the succession after the sterile death of the late

    Jan and Teofil Prusimski, brothers [a gap in the transcription],

    to be adjudged, against the Magnificences Antoni, Paweł and Stefan

    Prusimski, a decree instituted in the tribunals of the kingdom at

    Piotrków on the 3rd day after the feast of All Saints in the year

    1738, in the compatible [doubtful] of the action, with a penalty

    irrogated over [the editor''s alternatives: "super"/"ra"] the

    Magnificences Kowalski, to have intervened. Now, however, the

    indiction of the Magnificent Mariana de Prusimski Tomicka removed;

    these things transacted: the said Magnificences Antoni, Paweł and

    Stefan, brothers german among themselves Prusimski, to have

    concurred in the divisorium of either fortune, whether in the

    distinction of the paternal or of the maternal [doubtful], in the

    act expressed above; and that the Magnificent Antoni Prusimski, the

    brother elder by birth, offered the three schedas [the word before

    doubtful], with the prices of the estates appended, to the younger

    brothers [doubtful] for choosing; and so the first scheda of the

    estates of Kolno and of the town of Kamionna, with the free

    cutting [of wood] in the borras of Goraj [doubtful] and Krobielewo,

    according to the disposition of the earlier divisions pertaining to

    the same estates, in the sum of two hundred fifty thousand florins

    Polish, with the loads appended: first six hundred florins Polish

    out of the annual census inscribed in Kolno; second twenty thousand

    florins Polish to the successors of the late Generous Kotarbski

    [written "Kołarbski"?]; third thirteen thousand florins Polish to

    the Generous Eustachy Kowalski; fourth the same [word doubtful:

    proposed "item"] thirteen thousand florins Polish to the Generous

    Urbanowski; fifth thirty thousand florins Polish to the widow and

    successions of the late Generous Nierzychowski, out of Oporowo

    [word doubtful]; sixth three thousand florins Polish to the

    Generous Zielonacki, proceeding from the late Magnificent Stefan

    Prusimski, the brother youngest by birth, to have chosen

    [doubtful]. The second scheda of the estates of Trąbczyn, Drzęczew

    [written "Drzezgow"], the mill, Osiny, Łazy, Nowawieś, Huta,

    Oporowa [with its] shares [word doubtful] Oporówka, Kałowo,

    Podbiele and Prusinowo, in the sum of ten [read "Decentorum":

    elsewhere the entry divides 250,000 and 201,000; the scheda''s total

    stands as written] fifty-four thousand florins Polish, with the

    debts applied: first twenty-one thousand five hundred florins

    Polish over the estates Oporowo, Trąbczyno and Prusinowo to

    various churches, out of the censuses inscribed [doubtful]; second

    forty-three thousand florins Polish to the successors of the late

    Magnificent Radoliński, subchamberlain of Wschowa, over the estate

    of Trąbczyn; third ten thousand florins Polish to the Generous

    Franciszek Puchalski; fourth seven [written "Septum"] thousand

    florins Polish to the Generous Raczycki; fifth two thousand florins

    Polish to the Generous Pomorski, likewise proceeding from the late

    Magnificent Paweł Prusimski, subchamberlain of His Royal Majesty

    [office doubtful]; the fraternal mean to have accepted. The third

    scheda of the estates of Wierzbno, Brzezno, the shares of

    Prusimscum [garbled], with the free cutting and the pastures

    [doubtful] conceded in the borras of Goraj and Krobielewo to the

    tenor of the earlier divisions; Szetlewko in contiguity with the

    estates of Trąbczyn, joined [written "consuita~"], in the sum of

    two hundred one thousand florins Polish, with the loads annexed:

    first four thousand out of the annual census over the estates

    Wierzbno and Szetlewko; second thirty-three thousand florins Polish

    to the Generous Obarzankowski, owed from the estates Wierzbno and

    Brzezno, to have remained around the Magnificent Antoni Prusimski,

    the brother elder by birth. An inscribed [written "Inscipis"] sum of

    eight thousand florins Polish sought over the estates Chyby by the

    Prusimski brothers younger by birth, the like load''s pacification

    preceding, ceded to the Magnificent Antoni Prusimski; no less, that

    the same Magnificent Antoni Prusimski assumed to himself the

    payment of the quota of six hundred sixty-six florins groschen 20

    Polish to each brother, per three hundred thirty-three florins'
- page: 8
  en: 'groschen 10 Polish [the lines run on]; lastly the sum of thirty

    thousand florins Polish, after the sterile fates of the late

    Generous Anna de Prusimski, rather of Mielecki [written "Belęcka"],

    lastly by marriage Brudzińska, over the estates Pawłowo, or over

    the heirship of Zernik, existing, devolved upon all the brothers;

    and to have been demised by the said Magnificent Antoni Prusimski,

    for the pacifying of the load, at once of the sum owed to the

    successors of the Kęszycki [family, doubtful] out of the said

    estates, and contracted for the Magnificent Antoni Prusimski,

    within whose eviction and to the brothers not to be referred back

    [written "irreferibilittem"]; the silver also left by the fates of

    the parents, and indeed [the word doubtful] of the late Magnificent

    Stefan Prusimski, of a various [doubtful] species, in marks

    [doubtful] forty-nine and half-marks five [the first letters

    doubtful: "semuniis"], then bedclothes of silk cloth of red colour

    [doubtful] for adorning one chamber; now for the part of the late

    Magnificent Paweł Prusimski silverware of a various [the editor''s

    alternatives: "n"/"r"] form, in marks the same [doubtful] and

    half-marks twelve, and sables of Żebułowo [the first letter

    doubtful], left by the fates of the parents, renewed by the

    Magnificent Antoni Prusimski for thirty gold coins (out of which,

    after the fates of the late Magnificent Jan Prusimski, the movable

    things only, the Magnificences Antoni and Stefan, by the absence of

    the then Magnificent Paweł Prusimski, disposed among themselves);

    then bedclothes of the like carbuncle colour; lastly for the share

    of the Magnificent Antoni Prusimski silverware in marks thirty

    eight and half-marks eleven, and the carriage left by the fates of

    the late Magnificent Jan Prusimski, to have ceased; the remaining

    movables in the grounds of the estates to be cut out [garbled] at a

    later time, they specified; and by the other method, that the

    estates divided [garbled], exchanged among themselves by the

    brothers in resignation, and in possessions taken over, in respect

    of the bettering of the dowry, a suit juridical, raised by the

    Magnificences sisters written above, arose; and from the lesser

    benches to the tribunal''s court, a condescension decree having gone

    before, at the grounds of the present estates on the 3rd day, the

    day after the feast of the Circumcision of our Lord Christ, in the

    year 1759, by the full territorial court of Poznań [doubtful], out

    of the tribunal''s remission, contumaciously given, in the acts of

    the castellany of Pyzdry on the 5th day after Sexagesima Sunday of

    the same year entered at length, the cause come thither; and there, under

    the act of Piotrków, on the 5th day on the eve of the feast of the

    Presentation of the Blessed Virgin Mary in the year 1760, to the

    comparition of the Magnificences Antoni, the paternal uncles, and

    of the same name''s step-son Prusimski, the actors and cited ones

    [doubtful]; of the Magnificent Katarzyna de Rozdrażewska Prusimska,

    relict widow, likewise actress and cited one [doubtful]; then of

    the Magnificences Kazimierz Zakrzewski, then tribune of Koło

    [written "Covalien~"] and judge castellany of Radziejów, and of

    Mariana de Prusimskie [word doubtful], the cited ones and actors;

    as also of the Magnificences Karol and Wiktoria, likewise de

    Prusimskie Odechowski, spouses, at once cited ones and actors

    [doubtful]; lastly of the Magnificences Marcin Kowalski and

    Kunegunda, consort of the Magnificence Kołaczkowski of the

    Kowalskis, cited ones and actors [written "actt~"], and of others

    cited out of the offices: the decree of the approbation of the

    transactions, by the force of the parental disposition having

    intervened, and of the substance of the parental acquisition

    [garbled] and of the status of the estates, and to the outermost

    [garbled] of the sisters'' capits, per'
- page: 9
  en: 'nine thousand florins Polish of adjudication, moreover to have

    over-hung [doubtful]; but of the adjudged things, by the decree of

    the year 1759, the restitutions of the sums condescended [garbled]

    to have issued; lastly, the premises determined: in respect of the

    succession after the fates of the late Magnificences Antoni and

    Paweł Prusimski, of sterile life deceased [garbled], from the

    female-sex capits an action to the territorial courts of Kalisz

    [doubtful], celebrated at Konin, to have been instituted; but by

    the motion of the Most Illustrious Magnificent Antoni Prusimski,

    captain of Nieśwież, knight of the Order of St Stanisław, after the

    benefits of the law conceded and the competency of the action

    [garbled], and the condescension enjoined to the grounds, to have

    come to the tribunal''s court, after the resolution also of the

    categories comprehended in the decree now executory. To the present:

    the substances, the paternal Prusimski and the maternal Golinski,

    standing in the capits of the late Magnificences Antoni and Paweł

    Prusimski, sterile ones, by the force of the division, under the

    distinction and the imposition of the prices on the estates,

    according to the prescription of the same tribunal''s decree;

    wherefore the conditional court, insisting, the documents higher

    drawn out [written "exa[r?]tis"], distinguishes the paternal estate

    Prusimski from the maternal Golinski ones. First the estate Oporowo

    with the shares Oporówka and Kałowa, Golinscian, attending to the

    contracts: first indeed in the year 1728, on the day of the feast

    of St Hedwig, the widow and elect, at Oporowo, between the

    Magnificences Krzysztof Prusimski and Teresa de Golinska, spouses,

    on the one part, and the Generous Ignacy Kowalski on the alternate

    part, a three-year [doubtful] arenda of the same estates for the

    sum of eleven thousand five hundred florins Polish; then by the

    corroboration [doubtful] of a like contract, by the Magnificent Jan

    Prusimski on the one part and the Generous Stanisław Kotarbski on

    the alternate part, though under a wadion of fifteen thousand

    florins Polish, before the act of the castellany of Poznań, in the

    vigil of the feast of the Visitation of the Blessed Virgin Mary in

    the year 1735, recognised; [word doubtful] by the conditional

    decree at the grounds of the estates of Oporowo on Monday after the

    feast of the Visitation of the Blessed Virgin Mary, by the force of

    the tribunal''s decree, given in the acts of the castellany of

    Gostynin [doubtful], on Monday after the feast of St Margaret,

    virgin and martyr, in the year 1740, offered [written "oblatuato"],

    the reversale script of the Generous Kotarbski in the matter of the

    Magnificent Prusimski, of the 4th day of August in the year 1735

    dated, and the summary acknowledging no more than thirteen thousand

    florins Polish of the three-year arendatorial [doubtful],

    considering also the fortuitous cases burdening the hereditary

    estates, and the loads to be suffered exposed in the price of the

    sum of eighty thousand florins Polish, to have valued [garbled].'
- page: 10
  en: 'Then the estate Prusinowo, the arendatorial contracts taken first:

    one in the year 1723 on the 10th day of the 7th month, between the

    Magnificences Prusimski, spouses [written "con~ges"], and the

    Generous Ignacy Kowalski, for the annual sum of seven hundred

    eighty-four florins Polish; the other in the year 1726 on the 10th

    day of the 8th month, between the same Magnificences Prusimski and

    the Generous Mikołaj Trąmpczyński, for a like sum, initiated to the

    tax of the sum of fifteen thousand florins Polish, it reduces. Lastly

    the estates Szetlewko, the contracts weighed, and indeed in the

    year 1721 on the 16th day of the 7th month, between the Magnificent

    Krzysztof Prusimski [written "Chrisophorum"] and the Generous Antoni

    Kiełczewski, for the annual arenda of the same estates, for the sum

    of one thousand six hundred florins Polish; then in the year 1727,

    on the 27th day of the month of August, at Trąbczyn, between the

    Magnificent Prusimski, spouses, and the Generous Kazimierz Bardski,

    begun before the castellany acts of Konin on Monday after the feast

    of the Conversion of St Paul the Apostle in the year 1728,

    corroborated, for the sum of four thousand five hundred forty-five

    florins Polish for a three-year arenda, constituting, it determines

    in the sum of thirty thousand florins Polish. Whereas, however, the

    conditional court deduced [written "deducidem"] the Magnificent

    Konstancja de Krusińska, first of the Magnificent Andrzej Golinski,

    by second marriage of the Magnificent Marcin Kałowski, spouse, or

    both spouses by marriage-portion right [doubtful] over the sum of

    twelve thousand florins Polish hanging on the estates Szetlewek,

    inscribed by the late Magnificent Jan Golinski to the Magnificent

    Andrzej Golinski, enjoying [it], and insistent in the possession of

    the same estates [doubtful]: to have initiated the complanatio at

    Trąbczyn on the 17th day of the month of June in the year 1704,

    dated, with the Magnificent Krzysztof Prusimski; and by this

    complanatio, the sum of four thousand florins Polish, the

    Magnificent Prusimski, by the force of the intercalated marriage of

    the Magnificent Teresa de Golinski, his consort, as if paid over

    [word doubtful] by the Magnificent Kałowski, to have assumed; the

    sum of ten [written "ven"] thousand florins [abbreviation doubtful]

    Polish out of the load of the Generous Marcin Kosewski, from the

    estates Szetlewek carried over [doubtful], to the Magnificent

    Kałowski, to have written out [written "exobatam"]; after the

    complanatio of this kind [doubtful] and the contract of betrothal

    [the editor''s alternatives: "b"/"l"], by the manor [written

    "m~fiam"], before the castellany acts of Konin on the 5th day before

    the feast of the Purification of the Blessed Virgin Mary in the year

    1705 made, the Magnificent Krzysztof Prusimski to have overgone

    [written "viciasse"]; but in the following year 1706, on the 20th of

    July at Trąbczyn, the subordinate complanatio [doubtful] with the

    same Magnificences Kałowski to have confided, and to be maintained

    [garbled]: the Magnificences Kałowski in the sum of six thousand

    florins Polish for the reformatory and marriage-portion right

    [doubtful] to have offered; the censuses paid, to pour [them] into

    the person of the Magnificent Prusimska, they promised; and so the

    Magnificent Kałowski the sum of four thousand florins Polish, taken

    from the hands of the Magnificent Krzysztof Prusimski, before the

    castellany acts of Radziejów [doubtful], on Monday in the vigil of

    the feast of the Nativity of St John the Baptist in the year 1710,

    to have inscribed in the matter of his consort [written "siae"];

    this too, the Magnificent Kałowski, in the [word doubtful]

    assumed [garbled], of the rights over Szetlewek serving [ending

    doubtful], in the person of the Magnificent Prusimski [garbled];

    following, lastly, of the late Magnificence de Krusińska Kałowska,

    by the fates of the Magnificent Teresa de Golinska, spouse of the

    Magnificent Krzysztof Prusimski [garbled], in the assistance of her

    husband, the sum of five thousand five hundred ninety-four

    florins, groschen Polish, to the quietation before the castellany

    acts of Kalisz on the 5th day after the feast of St Giles the Abbot

    in the year 1727, in the matter of the Generous Józef Kałowski

    recognised, to have lifted — though not reposed in the extract by

    the parties, yet specified in the conditional decree of the year

    1759 — out of the estates Jarantowice [written "Jarantowie"];

    [word doubtful] the conditional court: the sum of four thousand

    florins Polish of the intercalated marriage for the matter of the

    Magnificent Teresa Golinska assumed [doubtful], and in the

    subordinate complanatio [doubtful] ratified; another like sum to

    the Magnificent Kałowska by the Magnificent Prusimski paid,

    bonifies; the remaining sum of ten [written "ven"] thousand

    florins Polish to the completion of the sum of six thousand florins

    Polish for the marriage-portion right [doubtful], enumerated out of

    the proceeds by the Magnificent Prusimski'
- page: 11
  en: 'out of the estates of the wife received, to be compensated, he

    arbitrates [written "arbitradem"]. Nevertheless the sum of one

    thousand [doubtful] florins Polish, borne over out of the load of

    Kosewski [written "hoscie[l?]sciano"], judged for the debt,

    gravating the maternal Golinscian substance [written "subta~am"].

    Lastly the sum of five thousand five hundred ninety-four florins

    groschen 5 Polish, received out of the estates Jarantowice, he

    demonstrates to be maternal. And so the maternal Golinscian

    substance, out of the sums: the first, eighty thousand florins

    Polish for the price of the estate Oporowo with its appurtenances

    [ending doubtful]; the second, fifteen thousand florins Polish out

    of the tax of the estate Prusinowo; the third, thirty thousand

    florins Polish for the estates Szetlewko; the fourth, five thousand

    five hundred ninety-four florins groschen 5 Polish, lifted out of

    the estates Jarantowice, joined [written "co~alitam"] into one sum,

    of one hundred thirty thousand five hundred ninety-four florins

    groschen 5 Polish, he liquidates it to make. Out of it, however, the

    loads inscribed below, as: the sum of one thousand florins Polish

    paid out of the load of Kosewski; another joined to it at once, of

    twelve thousand two hundred fifteen florins Polish over the estate

    Oporowo, the shares Oporówka and Kałowa, by various inscriptions

    [written "Ins~iso~ibus"] and resignatory transactions, as far as

    the substance is only Golinscian, referable back [written

    "res[s?]ibilibus"] to various churches [written "Eulesias"],

    inscribed [doubtful]; also one thousand florins Polish, likewise

    ecclesiastical, over the estate Prusinowo, an inscription offered,

    before the castellany acts of Pyzdry on the 3rd day after Quinquagesima

    Sunday in the year 1654, assumed [doubtful]; a fourth, the like of

    one thousand florins Polish, out of the resignation of the shares

    of the estates, and of them by the Generous Jan Prusinowski, in the

    matter of the Magnificent Jan Łoso Golinski, of the act expressed

    above, for the prices standing over [doubtful] and applied to the

    parish church; a fifth, of two thousand florins Polish, in the

    castellany acts of Kalisz, on Monday after the feast of St Lawrence

    the martyr, in the year 1647, by the Generous Marcin Strzałkowski,

    over the estates Szetlewo minus, to the Most Honourable [written

    "Ad~r"] Reverend Andrzej Bienicki, parish priest of Zagórów

    [ending doubtful]; the same, however, inscribed below by the same

    Most Honourable Reverend Bienicki, separately, by an inscription

    before the castellany acts of Pyzdry on the 6th day, the day after

    the feast of the Ascension of our Lord Jesus Christ [doubtful], in

    the year 1661, to the parish church of Zagórów given and donated in

    perpetuum [ending doubtful]; a sixth, one thousand florins Polish,

    of the Generous Rzekicka [doubtful], widow relict of the late

    Generous Jakub Rzechicki [doubtful], for the price of the estates

    Szetlewek left, by the tribunal''s decree of the kingdom at

    Piotrków of the year 1616, to the same estates regulated

    [written "regulatuum"]; a seventh, six thousand florins Polish, out

    of the sum of seven thousand florins Polish, by the late Generous

    Paweł Golinski to the Generous Anna de Bojanowska, his mother

    [written "matis"], inscribed below; by the same Generous Golinska,

    however, into the person of the Generous Apollonia de Golinska,

    consort of the Generous Zygmunt Obiesierski [doubtful], her own

    daughter also, transfused, proceeding (since [doubtful] one thousand

    florins Polish for the burning of the borra of Oporowo [the

    editor''s alternatives: "sem"/"dem"] was compensated); which one

    thousand florins Polish to the Generous Białoskorski, by the late

    Generous Anna de Bojanowska Golinska, paid [doubtful]; one thousand

    five hundred florins Polish to the completion of the dowry of the

    Generous Trąmpczyńska wanted, adjudged by the tribunal''s decree of

    the year 1616 named before. A tenth [written "Decimam": the

    enumeration runs on], five thousand florins Polish, by the tribunal''s

    decree, then, on the 6th day after Laetare Sunday [doubtful] of the

    year 1727, from the Generous Obierunski [doubtful] men acknowledged;

    by the Magnificences Prusimski, spouses, however, by the way of

    eviction alone demanded, and attesting the quietation before the

    castellany acts of Poznań [written "Posnaniensen"], on the day

    after the feast of the Nativity of St John the Baptist, in this

    year, by the Generous Obierunski spouses, in the matter of the

    Magnificences Prusimski, of the sum produced out of the eviction,

    recognised,'
- page: 12
  en: 'pacified; which joined into one, thirty-two thousand two hundred

    fifteen florins Polish [written "Decentos" for ducentos], they make

    [ending doubtful]; out of the superior sum constituted for the

    maternal Golinscian estates, deducting [written "de cortando"], the

    remainder, ninety-eight thousand three hundred seventy-nine florins

    groschen 5 Polish, of the clean mass of the Golinscian fortune, to

    be divided, the court determines remains. And though the late

    Magnificences Jan and Teofil Prusimski, ceded by sterile fates

    before the division, had stood in the participation of either

    substance, as much the paternal as the maternal, by various

    transactions [written "nibus"] and even by the division mentioning

    the loads of the Magnificent Jan Prusimski, to be deducted

    [ending doubtful]; yet because to the tribunal''s decree stabilising

    this act only the fortunes left by the sterile fates of the

    Magnificences Antoni and Paweł Prusimski, according to the

    division, are permitted to the judgment [doubtful] of the present

    court: therefore the said clean Golinscian sum, the capits of the

    Magnificences Jan and Teofil Prusimski omitted, into three brothers,

    namely Stefan, Antoni and Paweł, and into as many capits of

    sisters, namely Konstancja, Wiktoria and Mariana, dividing, and to

    each capit sixteen thousand three hundred ninety-six florins

    groschen 15, two solidi and a half, to fall [the editor''s

    alternatives: "j"/"p"], the court judges. The maternal substance

    determined [word doubtful], the scheda also of the estates of the

    town of Kamionna and of Kolno, ceded to the late Magnificent Stefan

    Prusimski, parent of the late Magnificent Antoni Prusimski,

    captain of Nieśwież [ending doubtful], as of the paternal

    Prusimski ones, as to the fortune of either kind remaining

    [doubtful], and only the portion of the maternal sum, in the quota

    of sixteen thousand three hundred ninety-six florins groschen 15

    Polish, of the gift of two and a half only [garbled], mixed

    [doubtful], into the constituted price of the same class declared:

    clearly, by the tribunal''s executive decree, the paternal substance,

    left by the sterile fates of the late Magnificences Paweł and Antoni

    Prusimski, according to the fraternal exdivision, only to the Most

    Illustrious Magnificent Prusimski, captain of Nieśwież [ending

    doubtful], as step-son [doubtful] german [read: as the german

    step-son, or the nephew by the brother] out of law and custom are

    adjudicated; wherefore the same fortunes, according to the division

    expressed above, as of the late Magnificent Paweł Prusimski in the

    sum of two hundred fifty-four thousand florins Polish, with the

    loads higher drawn out [doubtful] enumerating, excepted nevertheless

    the debts appended to the scheda, and the quota of three hundred

    thirty-three florins groschen 10 Polish added, by the late

    Magnificent Antoni Prusimski to this class in the division

    included: the clean fortune''s sum of one hundred seventy thousand

    eight hundred thirty-three florins groschen 10 Polish, according to

    the division, putting; but the maternal portion deducted from it,

    of sixteen thousand three hundred ninety-six florins groschen 15,

    two solidi and a half Polish: the remaining sum of one hundred

    fifty-four thousand four hundred thirty-six florins groschen 24,

    and a half solidus Polish, of the clean paternal fortune, according

    to the division, to have been, the court liquidates. The scheda,

    however, of the Magnificent Antoni Prusimski, in the sum of two

    hundred one thousand, and in the sum of eight thousand florins

    Polish hanging over the estates Chyby, specified in this division,

    attending to; and the loads inscribed in the division, with the

    quota of six hundred sixty-six florins groschen 20 Polish, to the

    two schedas adnumerated [doubtful], deducting: the remaining one

    hundred seventy-one thousand three hundred thirty-three florins

    groschen 10 Polish, of the clean fortune around the division, the

    court notes; out of which, at once,'
- page: 13
  en: 'the maternal portion excepted [word doubtful], the remaining sum of

    one hundred fifty-four thousand nine hundred thirty-six florins

    groschen 24 and a half solidus Polish of the paternal substance,

    over and above [word doubtful], it demonstrates. And though, to his

    judgment comprehending [garbled], the Magnificent Paweł Prusimski

    paid the sum of thirty thousand florins Polish of the Generous

    [Lady] de Urbanowska Nierzychowska, widow relict, offered in the

    scheda of the Magnificent Stefan Prusimski to be borne over,

    attesting the quietation before the castellany acts of Poznań

    [written "Ponaniensis"], on Monday on the eve of the feast of St

    Francis the Confessor in the year 1740, out of the estate Oporowo

    ceded to him in the division; yet, in respect of the same sum, no

    contestation of the suit [doubtful] between the surviving brothers

    to be reposed [ending doubtful], and the later transactions do not

    carry the said sum [word doubtful]: therefore the same cannot be

    judged as borne over [doubtful], the court arbitrates [doubtful];

    though even the sum of ten thousand florins Polish of the Generous

    Franciszek Puchalski, written out in the division, the donation of

    the estates Podbiele, by the Magnificent Paweł Prusimski in the

    matter of the same, before the castellany acts of Konin on Monday

    after the feast of the [garbled: the Twelve Thousand Virgins, St

    Ursula''s feast] in the year 1742, recognised, is presumed pacified;

    but since this sum, according to the division of the year 1740, is

    believed borne over; the paternal substance, left by the sterile

    fates of the paternal uncles, by the tribunal''s decree, in whose

    execution the court [doubtful] exists, to the Most Illustrious

    Magnificent Prusimski, captain of Nieśwież, the step-son, according

    to the division, is given [garbled]: therefore, for the matter of

    the female sex, out of this sum nothing can come of it, the court

    judges. The sums also: the first, of seven thousand florins Polish

    of the Generous Raczycki; the other, of two thousand florins Polish

    of the Generous Pomorski, specified in the division, not existing

    even in the documents of quietation, whether they be pacified,

    cannot be judged as borne over, the court judges. As touches the

    sum of forty-three thousand florins Polish of the successors of the

    late Most Honourable Radoliński, subchamberlain of Wschowa,

    associated to the same scheda, out of the obligatory contract upon

    the late Magnificences Antoni, Jan, Paweł, Stefan and Deograt

    Prusimski on the one part, and the Most Honourable Józef and

    Stefan, both of the name of Radoliński, subchamberlain territorial

    of Wschowa, on the other part, in respect of the obligation of the

    estates of Trąbczyn with appurtenances [ending doubtful], for the

    sum of forty thousand florins Polish, at Podlesie [written "sab

    bo": the scribe''s abbreviation], on the day after the feast of St

    Francis the Confessor, in the year 1736, upright [doubtful]

    proceeds; by the complanatio also between the late Magnificent

    Józef Radoliński, then subchamberlain of Wschowa, his [own name

    garbled] and the Magnificent Teresa de Suinarska [doubtful], his

    mother, and the Magnificences Mikołaj, Andrzej, Albert and Jan, his

    sons and brothers Radoliński, of the same name, on the one part,

    and the Magnificent Paweł Prusimski, subchamberlain of His Royal

    Majesty [doubtful], on the other part, at Kalisz on the [one word

    doubtful: read by sense "tenth"] day of October in the year 1744,

    conscribed, out of the rogation [doubtful] of the sum of eighteen

    thousand florins Polish enumerated by the same Magnificent

    Prusimski to the Magnificent Radoliński, only in the like quota, of

    the original sum of eighteen thousand florins Polish, and of the

    provisional two hundred thirty ducats of gold coin, over-hanging

    [garbled]; and though, according to the manual quietation at

    Krethowo [doubtful] on the 20th of August in the year 1748, by the

    late Magnificent Andrzej Radoliński, in the matter of the

    Magnificent Paweł Prusimski, subchamberlain of His Royal Majesty,

    of the sum of twenty-two thousand six hundred florins Polish given,

    before the castellany acts of Konin, on the Saturday before the

    feast of St Michael the Archangel in the year 1749 inscribed, the

    said original sum, and the provisional one out of it, seem to be

    equalised [doubtful]; yet since to his court''s judgment it stands

    that the Most Illustrious Magnificent Prusimski,'
- page: 14
  en: 'captain of Nieśwież, for the terms of the condescension at the

    grounds of the estates of Skoki [doubtful], by the mind of the

    territorial decree of Gniezno [doubtful], agitated; the citation

    term, before the castellany acts of Kalisz, on Monday, the day after

    the feast of St Thomas the Apostle, that is on the 22nd day of the

    month of December of the year 1777, by the Most Honourable Prudent

    Piotr Florkiewicz of the village of Mokronosy [doubtful], related,

    the convent [that is, the counterpart] met; and in the conditional

    act, agitated on Monday after Exaudi Sunday in the year 1781, by his

    plenipotentiary comparing, to have reposed this ultimate script in

    the original; the successors of Radolin, however, and the

    Magnificent [the editor''s alternatives: "Fl"/"H"]ottowa, inferred

    that it was not written and subscribed by the hand of the late

    Magnificent Andrzej Radoliński; and not only to have offered the

    juridical proof [written "comprobationem"], and to have shown the


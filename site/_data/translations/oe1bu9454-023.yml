- page: 3
  en: 'and also to bring Kamionna back, so that Leixner may not raise an outcry. Up to now I have raised
    all these costs, paid and fed the people, paid execution and court dues; a further 185 Rthl in court
    dues remain to be paid, on account of which the executor of the High Provincial Court of Głogów, Allexius,
    was to distrain upon me yesterday — but since he found nothing, he had to be [text lost] with his
    fees, which with mileage money amount to 25 Rthl Courant. Until now I have borne everything in silence
    and have not wished to write unpleasant [uncertain: days] to Your Serene Highness. But now I am brought
    entirely to a stand, and have nothing more, but go hungry with my children.


    I am to conduct the lawsuit with Oppenheimer that is pending in Berlin and in Poland.


    2. with that ungrateful woman, the Schlieffen woman in Wrocław


    3. with the [uncertain: etwas] fund in Wrocław, over the 800 Rthl which Hagen advanced to [uncertain:
    Gratsnau].


    4. With v. d. Lahr, who at that time gave the 5140 Rthl in papers, received iron money in boards,
    which he afterwards reckoned at only half the value, the iron at 3 Rthl, and so still has 1600 Rthl
    to receive.


    5. With Blochsdorff and Holzapfel, who gave 3500 Rthl in paper money in the utmost distress, to satisfy
    costs.


    6. Now to vindicate Trąbczyn and Kamionna.


    7. To free all the estates from the Polish watchers and to restore Your Serene Highness to the revenues
    and the unspeakably great arrears.


    All this costs a furious deal of money. Nobody will serve without payment. Thus far I have given what
    I could raise. Now I have nothing more, but go hungry with my children myself — If the matter now
    lies still, it is not my fault — I lie wretched with the gout and cannot travel either. 591 Rthl.
    18 Groschen. Courant have I borrowed of late and so paid out. God knows how this is to be done.


    God grant it.


    It is said the Russians will occupy the whole of Poland. In deepest respect I remain, until death,


    Your Most Serene Highness''s


    Konotop, the 16th of February


    1810


    Your [uncertain: Krierenae] Councillor Stenger


    true humble and obedient servant


    v. Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness, did I not lately beg so imploringly to send my poor daughter a few hundred and
    coin? You have not done it. She [uncertain: it] probably could not make it possible. Your Serene Highness
    must excuse me that I, like a beggar, became burdensome to you; want pressed me to the point of despair
    – My children, and because they work for money on that account, suffer want, and I hunger, having
    sacrificed everything.


    Your Serene Highness gave, at the time when I was under arrest in Berlin, 3000 Rthl, likewise 1000
    Rthl and 300 Rthl, which makes


    4300 Rthl. Through the taking up of the 3125 time and 813 charges and interest upon interest I was
    obliged to take from


    v. d. Lahr 5140 Rthl and from Cote 9000 Rthl in paper; adding to this the costs at 3400, they are
    together


    17500 Rthl. To the above 4300 Rthl there comes the iron with Curia 4000 Rthl, which is 8300 Rthl


    there remain


    9200 Rthl. I have satisfied costs entirely; I have paid Lehr down to 1600 Rthl; I have settled all
    fees of practice, expenses and court dues — Each time I am still to satisfy the 1600 Rthl to v. d.
    Lahr and about 3500 ₰ to Blochsräff and Holzapfeln, who lent me the papers for the payment of the
    costs - since the French General Government has awarded me 4800 Rthl, these people, who have already
    brought suit against me and had execution levied, could well be paid out of the latter sum when it
    comes in. So that I need never again fall burdensome to Your Serene Highness, there still remain,
    when these


    5100 Rthl


    are paid,


    4100 Rthl which'

- page: 4
  en: 'since they do not know [uncertain: Hakern] there; he has done nothing but denounce and cause damage.
    I shall hand over to Stenger the Hecker paper security; he may deal with him as he deserves and let
    him travel. But he wants an actuary there, and for that he proposes a certain Seifert — I do not yet
    know the man — He says Seifert would serve for less than the half and would be very well content with
    250 to 300 Rthl. He would, once he has the estates free and back again, seek to save Your Serene Highness
    tenfold, in transfer fees (Laudemium) and court dues, what Seifert would cost; for he must have a
    man there who would keep the archive in order and whom he could send with confidence. May it please
    Your Serene Highness to tell me whether you approve of this. Honrichs is to give an account of himself
    at once; if not, Stenger will have him arrested and will immediately take in the three demesne farms
    he has appropriated to himself, with cattle and everything. Honrichs has not written for several weeks,
    notwithstanding that I have sent messenger after messenger to him. Even about the sale of the estates
    he has not said one word more. It is a pity about my 6 [uncertain: resting] swine and other game meat
    which I sent there — I stinted myself and mine of it and gave it to the man at his own proposal, in
    order to win the coals.


    Stenger stands in great repute. He is much employed — He promises quickly to vindicate everything,
    but he wants to be well paid, and I now have no money — 591 Rthl I have paid and 185 Rthl are still
    to be paid quickly — the former I borrowed here from the dyer when the execution came; the latter
    I do not know how to raise; it is urgently necessary that both sums be paid — I should then, and he
    will find counsel, be able to give Stenger at least 2 to 300 Rthl for the journeys — otherwise the
    man will not stir from the spot any more and everything is lost. Unless the [uncertain: Klüßen] take
    Poland.


    Lombardini has not given the 150 Rthl to my poor children. O how I should have thanked Your Serene
    Highness had you sent 500 Rthl [uncertain: perhaps] to my daughter; I should have escaped a great
    disgrace —'

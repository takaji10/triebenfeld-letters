- page: 3
  en: 'and also to recover Kaemen, so that Leixner may not be able to raise an outcry. I have hitherto
    raised all these costs, paid the people, fed them, paid execution and court dues; there are still
    185 Rthl of court dues to pay, on account of which the Glogau Superior Provincial Court executor Allexius
    was to have distrained me yesterday – but since he found nothing, he had to be paid off with his fees,
    which together with mileage money amount to 25 Rthl Courant. I have hitherto borne everything in silence
    and have not wished to write Your Serene Highness disagreeable things. But now I have been brought
    entirely to a standstill and have nothing more, but rather hunger with my children. I am to conduct
    the lawsuit with Opernheimer, which is pending in Berlin and Poland.


    2. with the ungrateful woman, the Schliefen woman in Breslau


    3. with the [uncertain: some] treasury in Breslau concerning the 800 Rthl which Hoym advanced to Gratsnauw.


    4. With v. d. Lahr, who at that time gave the 5140 Rthl in paper, received iron money against boards,
    which he afterwards reckoned at only half the value, the iron at 3 Rthl, and so has still to receive
    1600 Rthl.


    5. With Blockwerff and Holzapfer, who gave 3500 Rthl in paper money in the utmost need in order to
    satisfy costs


    6. Now Träparin, to vindicate straps


    7. To free all the estates from the Polish watchmen and to restore Your Serene Highness to the revenues
    and the unspeakably great arrears.


    All this costs a frightful amount of money. Nobody will serve without payment. Up to this point I
    have given what I could raise. Now I have nothing more, but hunger with my children myself - If the
    matter now lies still, it is not my fault - I lie wretched with the gout and cannot travel either.
    591 Rthl 18 g. Courant I have borrowed for some time past and thus paid out. God knows how this is
    to be managed.


    God grant it.


    It is said the Russians would occupy the whole of Poland. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Kontop, the 16th of February


    1810


    faithful, humble and obedient servant


    Your [illegible] councillor Stenger


    v. Triebenfeld'

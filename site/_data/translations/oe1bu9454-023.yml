- page: 1
  en: '23


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness, I begged [uncertain: last] time so imploringly to send my poor daughters a few
    hundred and coin. You have not done it. You must surely not have been able to make it possible. Your
    Serene Highness will excuse me that I, like a beggar, became burdensome to you; need drove me to the
    point of despair — My children work for money, suffer want — and I go hungry, and that because I sacrificed
    everything.


    Your Serene Highness at that time, when I was under arrest in Berlin, gave 3000 Rthl, likewise 1000
    Rthl and 300 Rthl. That makes = 4300 Rthl. By the taking up of the 3125 Rthl and 813 [illegible] and
    interest upon interest I had to take from


    v. d. Lahr 5140 Rthl and from Coste 9000 Rthl in papers; adding to this the costs at 3400, these together
    = 17500 Rthl. To the above 4300 Rthl comes the iron at circa 4000 Rthl, which is = 8300 Rthl; there
    remain = 9200 Rthl. I have satisfied Coste entirely; I have paid Lahr all but 1600 Rthl; I have settled
    all brokerage fees, expenses and court dues — Meanwhile I am still to satisfy the 1600 Rthl to v.
    d. Lahr and 3500 Rthl to Blochsdorff and Holzapfel, who gave me the papers for the payment of Coste
    — since the French General Government has awarded me 4800 Rthl, these people, who have already sued
    me and laid an execution upon me, [uncertain: fund], might well be paid out of the latter sum when
    it comes in. So that [uncertain: 1/Your] Serene Highness need never again be burdened, there still
    remain in the meantime, when these = 5100 Rthl


    are paid, = 4100 Rthl which'

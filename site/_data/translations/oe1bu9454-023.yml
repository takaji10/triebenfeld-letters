- page: 4
  en: 'because [they] do not know [uncertain: Hähern] there; he has done nothing but denounce and cause
    damage. I shall hand over to Stenger the Heiter paper security; he may deal with him as he deserves
    and let him travel. He wishes, however, to have a clerk of court there, and for that he proposes a
    certain Seifert - I still do not know the man - He says Reifert would serve for less than half and
    would gladly be well content with 250 to 300 Rthl. He would seek to save Your Serene Highness tenfold,
    when he has the estates free and back again, on the transfer fees (Laudemium) and court dues, what
    Seifert would cost, for he must have a man there who kept the archive in order and to whom he could
    send with security. May Your Serene Highness deign to tell me whether you approve of this. Honrichs
    is to give an account of himself at once; if not, Stenger will have him arrested and will immediately
    take in the three demesne farms he has appropriated to himself, with cattle and everything. Honrichs
    has not written for several weeks, notwithstanding that I have sent messenger upon messenger to him.
    Even about the sale of the estates he has not said a word more. It is a pity about my 6 [uncertain:
    Ruhe] swine and other game which I have given over there – I have stinted myself and mine of it and
    given it to the man on his own proposal in order to win the coals. Stenger stands in great repute.
    He is much employed - He promises to vindicate everything quickly, but he wants to be well paid. And
    I have no money now – 591 Rthl 1/2) I have paid and 185 ⁒ are still to be paid quickly – the former
    I borrowed here from the dyer when the execution came; the latter I do not know how to raise. It is
    urgently necessary that both sums be paid – I would then he will find means, and be able to give Stenger
    at least 2 to 300 Rthl for the journeys – otherwise the man will not budge from the spot any more
    and everything is lost. Unless the [uncertain: Klüßen] take Poland.


    Lombardini has not given the 150 Rthl to my poor children. 1 Your Serene Highness would have been
    thanked if you had sent 500 Rthl in coin to my, as it were, to [my] daughter; I should have escaped
    a great humiliation -'

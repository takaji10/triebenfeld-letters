- page: 2
  en: 'I have settled, and which I would only demand one day when Your Serene Highness has abundance.
    Doubly true it is to me, meanwhile, when I must [uncertain: hear] that Your Serene Highness''s people
    say behind my back that His Highness gave me so very much, that I plunder you. God in heaven — I plunder
    you or burden you — I suffer execution, am distrained for the sake of your affairs, my children work
    for money — must, like common folk, carry and haul water, my estates are sequestrated — I soon everything
    — I begged only for a few hundred in coin for my poor children, and for that this is still said of
    me — Gracious Lord, that tears my heart, and now I swear to God: if He helps me, then He shall never
    see me turn here again — Köckritz has done something for me; I have also been called upon to come
    to Berlin, but in this sad situation I shall merely thank him and stay away, for I have nothing and
    go hungry with my children — I have indeed leased out my estates, but until Midsummer nothing is left
    over; the arrears of interest consume everything. I must see how I hunger my way through until then,
    and in order not to suffer a relapse I shall live on alone and shall not step onto the stage again,
    where for my good will I am so vilely hissed off.


    Now I am moreover very ill, am crippled in my hands by the gout, so that I write this with the greatest
    difficulty. And for that reason I beg a gracious excuse for my wretched scrawl.


    For the rest, the criminal-court councillor Stenger, here from Kargowa, will set everything in order
    in Zagórów and Trąbczyn, Pszczew and Witów and render to Your Serene Highness a humble report. He
    promises quickly to [uncertain: vindicate] Trąbczyn'

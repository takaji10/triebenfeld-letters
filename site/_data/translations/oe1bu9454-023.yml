- page: 2
  en: 'I have settled, and which I would only one day demand when Your Serene Highness has it in abundance,
    doubly true — it grieves me meanwhile when I must hear that Your Serene Highness''s people talk behind
    my back, saying that Your Highness gave me so very much, that I am plundering you. God in Heaven –
    that I should prattle to you or fall burdensome to you — I suffer execution, am distrained for the
    sake of your affair, my children work for money, must carry and haul water like common people, my
    estates are put under sequestration – I [lose] soon everything — I asked only for a few hundred in
    coin for my poor children, and for that I am reproached with it besides – Gracious Lord, this tears
    my heart, and I swear to God that if He helps me, then He shall never see me turn here again. Köckritz
    has done something for me; I have also been called upon to come to Berlin, but in this sad situation
    I shall merely thank him and remain behind, for I have nothing and hunger with my children. I have
    indeed leased out my estates, but until Midsummer Day nothing is left over; the arrears of interest
    consume everything. I must see how I hunger my way through until then, and in order not to suffer
    a relapse I shall live on alone and not appear again upon the stage, where for my good will I am so
    odiously hissed off.


    Just now I am very ill with it, am crippled in my hands by the gout, so that I write this with the
    greatest difficulty. And that is why I beg a gracious excuse on account of my wretched scrawl.


    For the rest, the criminal-court councillor Stenger here from Karge will put everything in order in
    Zagorowo and Trąbczyn, Betsche and Witów, and will render a humble report to Your Serene Highness.
    He promises to vindicate Trąbczyn quickly'

  en: '97


    Most Serene Prince,


    Most gracious Lord!


    His Majesty the King wishes that Your Most Serene Highness should take your route by way of Berlin
    and tarry here a couple of days. Colonel von Zastrow asked the monarch outright whether Your Serene
    Highness might take your tour by way of Dresden, to which the King answered him: it would give him
    pleasure to see Your Serene Highness here for a couple of days.


    Concerning your most high sojourn in the Empire I have therefore, out of delicacy, made no further
    mention, since Your Serene Highness alone can now touch this chord here. Frankly said, I do not know
    whether it would be looked upon kindly if Your Serene Highness were absent from Silesia for 6 months.


    The King is now fairly well restored again, and I hear that they mean to settle the exchange matter
    even before Your Most Serene Highness''s arrival. Colonel von Zastrow told me only yesterday — the
    good monarch has declared'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! His Majesty the King desires that Your Most Serene Highness
    take your route by way of Berlin and tarry here a few days. Colonel v. Zastrow asked the Monarch outright
    whether Your Serene Highness might take Your Most High route by way of Dresden, whereupon the King
    answered him: it would give him pleasure to see Your Serene Highness here for a few days. Concerning
    Your Most High sojourn in the Reich I have therefore, out of delicacy, said nothing further, since
    Your Serene Highness can now touch this chord here in person alone. To speak candidly, I do not know
    whether it might be looked upon with favour if Your Serene Highness were absent from Silesia for 6
    months. The King is now tolerably restored again, and I hear that the exchange affair is to be settled
    even before Your Most Serene Highness''s arrival. Colonel von Zastrow told me only yesterday — the
    good Monarch had declared'
- page: 2
  en: 'that everything should be examined in respect of both estates concerned, so that neither the State
    nor Your Serene Highness should be the loser; then the exchange might take place — this is now only
    to be confirmed by a public Cabinet Order, and this is indeed the only thing to be wished for, for
    then all the rest will settle itself. Minister v. Voss has mustered everything against it and still
    seethes with fury and revenge. Heaven and hell have been mustered to move the good Monarchess — or
    rather B and K — to refuse the exchange outright. Only these two men stood firm as a rock, and insisted
    upon a decision consistent with honour. — Regarding the secularisation business, my faithful and humble
    opinions by word of mouth — for now my truly honest counsel is that not a word of it be mentioned
    for the present, for these are, said in confidence, mousetraps [uncertain: Glenck] which I could not
    make mobile as promptly as I had thought, in about 24 hours, so that Your Serene Highness may dispose
    of everything further — but I await Your Most High Self here, for I shall not depart hence any sooner
    than when the [uncertain: Prot.] affair is in order — In deepest submission I remain, until death,
    Your Most Serene Highness''s, Berlin, the [illegible]th of January 1799. most humble and faithful
    servant v Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    His Majesty the King wishes that Your Most Serene Highness would take your route by way of Berlin
    and tarry here a couple of days. Colonel von Zastrow has [text follows] the monarch


    asked outright whether Your Serene Highness might take Your Most High tour by way of Dresden, whereupon
    the King answered him: it would give Him pleasure to see Your Serene Highness here for a couple of
    days.


    Concerning Your Most High sojourn in the Empire I have therefore, out of delicacy, mentioned nothing
    further, since Your Serene Highness can now touch this chord here in person alone. To speak candidly,
    I do not know whether it might be looked upon kindly if Your Serene Highness were absent from Silesia
    for 6 months.


    The King is now tolerably restored again, and I hear that they wish to settle the exchange matter
    before Your Most Serene Highness''s arrival. Colonel von Zastrow told me only yesterday – the good
    monarch has declared'

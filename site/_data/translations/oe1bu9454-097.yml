- page: 2
  en: 'that in consideration of both estates everything should be examined, so that neither the State
    nor Your Serene Highness lose by it; then the exchange might take place - this is now only to be confirmed
    by a public cabinet order, and this is also the only thing to be wished for, for then all the rest
    will settle itself. Minister von Voss has done everything in his power against it and still seethes
    with fury and vengeance. They have summoned [uncertain: Zimme] and Hell to move the good monarch -
    or rather B and K - to refuse the exchange outright. Only these two men stood firm as rock, and insisted
    upon a decision consistent with honour — Concerning the secularisation affairs, my faithful and humble
    opinions by word of mouth — now my truly honest counsel, that for the present not a word of it be
    mentioned, for these are, said between us, mouse-traps. Glenck, whom I could not make mobile as promptly
    as I had thought, in about 24 hours, so that Your Serene Highness may dispose of all the rest - but
    I await Your Most High Self here – for I shall not depart hence before the Prot. matter is in order
    – in deepest submission I remain, until death,


    Your Most Serene Highness''s


    Berlin, the [illegible]th of January


    1799.


    most humble and faithful servant


    von Triebenfeld'

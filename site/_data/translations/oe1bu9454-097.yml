- page: 2
  en: 'that in consideration of both estates everything should be examined, so that neither the state
    nor Your Serene Highness should lose, and then the exchange might take place — this is now only to
    be confirmed by a public Cabinet Order, and this is also the only thing that is to be wished for,
    for then all the rest will settle itself. Minister von Voss has bent every effort against it and is
    still seething with fury and revenge. They have moved heaven and hell to bring the good monarch, or
    rather B[eyme] and K[öckritz], to refuse the exchange outright. Only these two men stood firm as a
    rock, and insisted upon a decision that stands with honour — Concerning the secularisation affairs,
    my faithful and humble opinions by word of mouth — for now my truly honest counsel — that for the
    present not a word of it be mentioned — for these are, [uncertain: Mutsch] said, mousetraps. Glenck,
    whom I cannot make mobile as promptly as I had thought — comes [uncertain: könt] in about 24 hours
    after, so that Your Serene Highness may dispose of all the rest — but I await your most high self
    here — for I shall not depart from here until the Krot[oszyn] matter is in order — In deepest submission
    I remain, until death,


    Your Most Serene Highness''s


    Berlin, the [illegible]th of January


    1799.


    most humble and faithful servant


    v Triebenfeld'

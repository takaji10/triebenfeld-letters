- page: 1
  en: 'Document no. 535


    Przemysł the Second, Duke of Poland, 18 February 1284, at Kalisz; allows Count Mikołaj, treasurer
    of Ląd, to locate his estate of Trąbczyn under German law.


    Original on parchment, in whose lower folded edge are two holes for the hanging of the seal. Warsaw.
    The Rusiecki collection. Diplomata. — Rzyszczew. Muczkowski, Codex diplomaticus Poloniae I, no. 64.


    In the name of the Lord, amen. While the letter lives, the deed committed to the letter lives, whose
    assertion nourishes memory and, strengthened, takes increase. Therefore we, Przemysł the Second, by
    the grace of God Duke of Poland, make known to all, both present and to come, who examine this page,
    that, having regard to the faithful service and the usefulness of our beloved knight Count Mikołaj,
    treasurer of Ląd, and wishing also to reform the state of our land for the better, we have given him
    free authority to locate his estate, which is commonly called Tropcssino, under German law, by the
    same right by which all the towns and villages through the district of our lordship are held. Namely
    so, that the same estate be for ever exempt from all the Polish payments by which our lordship is
    won: from the naraz, the povoz, the prevod, the stroza, the podvorove, the castle''s summons, the
    opole, the ox, the cow, the cifo of honey, and from all other payments under whatever names they are
    counted. And that the said estate may be shaped the better, the settlers of the same estate are not
    to pay the poradlne. And that this our gift may persevere inviolate for ever, we have had the present
    page confirmed with the protection of our seal, in the presence of these witnesses: Count Przecław,
    castellan of Gniezno, Count Andrzej, judge of Gniezno, Count Sędziwój, castellan of Ruda. Given at
    Kalisz in the year of the grace of the Lord 1284, in the twelfth indiction, on the Friday next before
    the Sunday Esto michi, by the hand of Thilo, notary of our court.


    Lendensis, of Ląd. Tropcssino, Trąbczyn. Rudensis, of Ruda.'

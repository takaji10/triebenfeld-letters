status: draft
segments:
- page: 1
  en: '112 Your Most Serene Highness will forgive this postscript. I had already sealed this letter when
    the Court Councillor Wunster came to the house and told me — "that Mr von Wildeganst and the Jew Heymann
    have done nothing whatever here in Your Serene Highness''s matter" — At the same time he disclosed
    to me that Wildegens had told him that, in the matter of the bill of exchange for 11/m Rthl signed
    by me for Your Most Serene Highness, judgment had already been given, so that I am to be arrested
    as soon as I return, or perhaps even while still here." That the matter is true I believe I see confirmed
    by the fact that the district bailiff Rudolph has already been several times at my house and has enquired
    after me.


    I beg Your Most Serene Highness, for God''s sake, to take this matter to heart and to have such arrangements
    made there with the utmost dispatch that I am not branded with disgrace and [uncertain: and] dragged
    off into arrest. For God knows, had I the money, or knew anywhere to raise it, I should procure it
    and pay everything at once — And if the [uncertain: hateful] Wildeganst had not ruined all my credit
    here, I should have obtained the money — this is a true conduct'
- page: 2
  en: 'and he hinders me, as Meyer himself knows, in all my plans, so that the fellow may make himself
    important and bring me to the point of having absolutely to take him on again as my man of business.
    — In my own affairs I do not need the [text lost] and have settled all my payment dates; now with
    Prince George I remain entangled throughout — he has sold my estates for 750000 Rthl and has let himself
    be fobbed off with other estates in which everything is entangled. Wildeganst and the Jew sit with
    him day [uncertain: and] night fleecing him, [milking] the Prince for money — But for me the Prince
    is never at home, and therefore I do not see him — this is indeed great ingratitude — For the rest,
    I would gladly bear it — if I did not have to see that these people were plunging the Lord into the
    deepest labyrinth and leading him astray, and making me wretched. I can therefore find no counsel,
    and therefore beg Your Serene Highness most urgently and imploringly to turn the matter so that I
    do not fall into disgrace and mockery and be arrested. In my anxiety I have wondered / whether it
    would not be well if Your Serene Highness were to [uncertain: prevail upon] Count Schlabrendorff to
    take the bill of exchange back out of the hands of the Jews — [uncertain: for it] is Schlabrendorff''s
    affair and his alone — the Jews only have to figure in the story, and therefore I believe that Schlabrendorff
    / if Your Most Serene Highness press him right earnestly, will also be willing enough to take the
    bill back from the Jews, and to wait if it is prolonged.


    ad 10 Febr. 1801.'

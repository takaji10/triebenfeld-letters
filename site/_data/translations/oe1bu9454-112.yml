- page: 2
  en: 'and he hinders me, as Meyer himself knows, in all my plans, so that the fellow may make himself
    important and bring me to the point of absolutely taking him on again as my man of business. – In
    my own affairs I have no need of the [illegible]; I am free of them and have settled all my payment
    dates; now it is with Prince George that I remain entangled — he has sold my estates for 750000 Rthl
    and has let other estates be foisted upon him in which everything is entangled. Wilde Ganß and the
    Jew sit with him day and night cheating, [uncertain: swindling] the Prince out of money – But for
    me the Prince is never at home, and so I do not see him – that is surely great ingratitude – For the
    rest I would gladly bear it – if I did not have to see that these people are plunging the master into
    the deepest labyrinth and leading him astray and making me wretched. I can therefore find no counsel,
    and therefore beg Your Serene Highness most urgently and imploringly to turn the matter so that I
    do not fall into disgrace and mockery and be arrested. In my anxiety I have thought / whether it would
    not be well if Your Serene Highness were to prevail upon Count Schlabrendorff to take the bill of
    exchange back out of the Jews'' hands – for it is after all Schlabrendorff''s business alone – the
    Jews are only meant to figure in the story, and therefore I believe that Schlabrendorff (if Your Most
    Serene Highness press him right earnestly) will also be willing enough to take the bill of exchange
    back from the Jews, and, if it is prolonged, to wait.'

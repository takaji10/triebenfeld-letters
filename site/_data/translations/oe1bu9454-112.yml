status: draft
segments:
- page: 1
  en: Your Most Serene Highness will forgive this postscript. I had already sealed this letter when the
    Court Councillor Wünster came home, in order to tell me that the K. v. Wildegansch and the Jew Heymann
    have done nothing whatever here in Your Serene Highness's affair. — At the same time he disclosed
    to me that Wildegens had told him that, since judgment has already been given concerning the bill
    of exchange for 11000 Rthl subscribed by me on behalf of Your Most Serene Highness, I am to be placed
    under arrest as soon as I return, or indeed even while still here. That the matter is true I believe
    I see confirmed by this, that the office-attacher Rudolph has already been at my house several times,
    and has still enquired after me. I beseech Your Most Serene Highness, for God's sake, to take this
    matter to heart and to have such measures taken there with the utmost dispatch that I be not branded
    with disgrace and dragged into arrest. For God knows, had I the money, or knew of anywhere to raise
    it, I would procure it and pay everything at once. — And had the malicious Wildegansch not here ruined
    all my credit, I should have obtained the money — this is a true conduct. on 10 Febr. 1801.
- page: 2
  en: 'and he hinders me, as Meyer himself knows, in all [uncertain: plans], so that the fellow may make
    himself important and bring me to the point of absolutely taking him on again as a man of business.
    — In my own affairs I do not need the [illegible] with which I am done, and I have settled all my
    instalments; only with Prince George do I remain entangled — he has sold my estates for 750000 Rthl
    and has let other estates, in which everything is entangled, be foisted upon him. Wilde Ganß and the
    Jew sit with him day and night, fleecing the Prince of his money. — For me, however, the Prince is
    never at home, and therefore I do not see myself with him — that is indeed great ingratitude. — For
    the rest, I would gladly bear it — if I did not have to see that these people plunged the master into
    the deepest labyrinth and led him astray and made me unhappy. I can therefore procure no counsel,
    and therefore beg Your Serene Highness most urgently and imploringly to turn the matter so that I
    do not fall into disgrace and mockery and be arrested. In my anguish I have wondered / whether it
    would not be well if Your Serene Highness were to [uncertain: prevail upon] Count Schlabrendorff to
    take the bill of exchange back out of the hands of the Jews — for after all it is Schlabrendorff''s
    affair alone — the Jews need only figure in the business; and therefore I believe that Schlabrendorff
    (if Your Most Serene Highness press him quite earnestly) will also be willing enough to take the bill
    back from the Jews, and to wait if it is prolonged.'

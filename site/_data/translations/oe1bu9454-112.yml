segments:
- page: 1
  en: 'Your Most Serene Highness will forgive this postscript; I had already sealed this letter when the
    Court Councillor Wünster came to the house just then, to tell me that the K. von Wildegansch and the
    Jew Heymann have done nothing whatever here in Your Serene Highness''s affair. – At the same time
    he disclosed to me that Wildegens had told him that, since judgment has already been given respecting
    the bill of exchange for 11000 Rthl signed by me on behalf of Your Most Serene Highness, I am to be
    taken into custody as soon as I return, or indeed while still here.


    That the matter is true I believe I see confirmed by this, that the office bailiff Rudolph has already
    been several times at my house and has [uncertain: still] made enquiries of me.


    I beg Your Most Serene Highness for God''s sake to take this matter to heart and to have such measures
    taken there with the utmost dispatch that I may not be branded with disgrace and dragged into arrest.
    For God knows, if I had the money, or knew anywhere to raise it, I would procure it and pay everything
    at once – And had the [uncertain: hitherto spiteful] Wildegansch not here ruined all my credit, I
    should have obtained the money – this is a true conduct


    ad 10 February 1801.'

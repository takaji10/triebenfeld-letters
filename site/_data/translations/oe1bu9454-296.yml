status: draft
segments:
- page: 1
  en: 'Berlin, the 8th Xbr. 1815. Most esteemed friend, with me. What has come in here I enclose herewith:
    the Court Councillor Bar. bey has died in Paris; I mean to enquire further of the widow as well. The
    Chancellor of State is expected this dwelling. Philippischen is said to have fallen very ill in Stachen,
    which touches me most inwardly. Be assured also of my sympathy on account of Thy illness. I yet await
    [it] very soon. Thy faithful servant Greven[uncertain: z]. Cosmar has in the first instance been held
    convicted of an honest [uncertain: dishonest] proceeding — but has appealed. If it stands, he [uncertain:
    forfeits / it lies before him] the guardianship.'
- page: 2
  en: 'Yesterday etc. the Chancellor of State did indeed arrive — this I report at once, with the enclosure
    of the 2 original enclosures. Philippischen is said now to be dangerously ill — my grief is as great
    as though it were my own [uncertain: Kohler]. Thy o. Int. Grewen[uncertain: z]. 8 Xbr. 1815.'

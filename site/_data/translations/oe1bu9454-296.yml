- page: 1
  en: '296 Berlin, the 8th of December 1815. Most esteemed Friend, What has come in here to me I enclose
    herewith: the Court Councillor Barby has died in Paris; I mean to enquire further of the widow as
    well. The State Chancellor is expected this week. Philippischen is said to have fallen very ill at
    Stache[?], which touches me most deeply. Be assured also of my sympathy on account of your illness.
    I do indeed expect [you/it] very soon.


    Cosmar


    has at first instance[?]


    been held convicted of a dishonest proceeding — but has appealed. If it stands so, he loses the guardianship.


    Your faithful and obedient servant, Grevenitz'

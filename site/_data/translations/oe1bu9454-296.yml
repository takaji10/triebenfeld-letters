- page: 1
  en: 'Berlin, the 8th of Xbr. 1815, most esteemed friend with me What has come in here I enclose herewith:
    the Court Councillor Bar. bey has died in Paris, I mean also to enquire further of the widow, the
    State Chancellor is expected [to] this dwelling.


    Philippischen is said to have fallen very ill in Stachen, which touches me most deeply. Be assured
    also of my sympathy on account of your illness. I do expect, indeed, very soon


    Your faithful servant Greven[uncertain: z]


    Cosmar


    has in the court of first instance


    been held convicted of a dishonest proceeding — but has appealed. If it stands so, he loses the guardianship'

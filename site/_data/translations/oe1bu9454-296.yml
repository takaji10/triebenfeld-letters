- page: 2
  en: 'Yesterday, etc., the State Chancellor really arrived — this I report at once, with the 2 original
    enclosures appended. Philippischen is said now to be dangerously ill — my grief is as great as if
    it were my own Kohler[?]. Your


    faithful and obedient,


    Grevenitz


    8 December 1815.'

- page: 2
  en: 'that he exerted all his powers for the interest of the lordship, and was not in a position to do
    more. I then rode back, and sought out the district steward here, whom I did indeed find, and who
    answered me roughly the same, only with the addition that he had the best testimonials from the most
    creditable men, and that his good name was worth much to him, which in his present situation he certainly
    did not deserve to lose. Of this he would give proofs, and could calmly face an investigation of his
    actions. Your Right Honourable, I report all this likewise by command of His Serene Highness, and
    permit myself only to add further that today the Wüsten depart by the carrying post. In most perfect
    reverence:


    Your Right Honourable''s


    Breslau, the 19th of March


    1805


    humble and obedient servant


    A. Hahn'

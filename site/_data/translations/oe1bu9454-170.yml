- page: 2
  en: 'that he exerted all his powers for the lordship''s interest, and was not in a position to do more.
    I then rode back, and sought out the district administrator here, whom I did indeed find, and who
    answered me to approximately the same effect, only with the addition that he had the best testimonials
    from the most trustworthy [illegible], and that his good name was worth much to him, which in his
    present situation he certainly did not deserve to lose. Of this he would give proofs, and he could
    look forward calmly to an investigation of his actions. Your Right Honourable, I report all this likewise
    upon His Serene Highness''s command, and permit myself only to add further that the Wüsten go off
    today by the carriage post. In the most perfect veneration:


    Your Right Honourable''s


    Wrocław, the 19th of March


    1805


    humble and obedient servant


    A. Hahn'

- page: 1
  en: '170


    Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! In accordance with the command
    of His Serene Highness the Prince, I rode last Saturday to Your Right Honourable''s hereditary estate
    Świniary, in order to speak there with the district administrator Käufer and the forester bezold.
    The former I did not find there, for he had ridden early to Wrocław, and had not yet returned from
    there. To the latter I set out the charge I had to lay upon him entirely in the manner in which it
    had been written to me by [text lost]; he did not appear taken aback by it, but rather enquired who
    might have placed him in an unfavourable light with His Serene Highness, whereupon I said to him that
    I did not know this myself, and that I could only admonish him to the strictest probity and attentiveness
    in his service, since he saw that with a contrary manner of proceeding one was never secure, and that
    such conduct would one day be severely punished. He assured [uncertain: me]'

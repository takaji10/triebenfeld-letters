segments:
- page: 1
  en: Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests! In accordance with the
    command of His Serene Highness the Prince, I rode last Saturday to Your Right Honourable's ErtheSchweiner,
    in order to speak there with the district steward Käufer and the forester bezold. The former I did
    not find, for he had ridden early to Breslau, and had not yet returned from there. To the latter I
    set forth the charge I had against him entirely in the manner in which it had been written to me;
    he did not appear dismayed at it, but rather enquired who might have placed him in an ill light with
    His Serene Highness, whereupon I told him that I did not know this myself, that I could only admonish
    him to the strictest uprightness and attentiveness in his service, since he saw that with a contrary
    manner of conduct one was never safe, and that such would one day be severely punished. He assured
    me

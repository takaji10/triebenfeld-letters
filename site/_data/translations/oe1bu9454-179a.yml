- page: 4
  en: 'whereby the capital will be entirely discharged in . . . . years, and there will remain to his
    descendants, as a perpetuation of the grace shown him by the bestowal of these estates, a clear entailed
    [uncertain: trust] property. To all measures directed to the strict execution of this condition, also
    in the event of his decease, the Prince submits himself without reserve; he will also 4. allow the
    delivery of the treasury notes to take place in successive instalments to be determined by the highest
    authority. Moreover this amount of treasury notes may yet be diminished, in so far as Your Royal Majesty
    may be pleased to let the registered charge of 50000 Rthl standing upon the estates for the Invalids''
    Fund continue to rest thereon. He desires the strict examination of this undertaking, which is as
    unimpeachable and in every respect entirely free of danger to the Most High interest as it is of the
    highest importance to the same; and thereafter he desires most earnestly that the execution may be
    hastened, since upon it, as has already been said, depends the entire regulation of the Prince''s
    affairs, inasmuch as he is thereby set wholly clear of all foreign credit obligations and entirely
    in the clear.


    I am ready to legitimate myself for this most humble representation by the judicial power of attorney
    of the Prince which I have in hand, and also to furnish personal surety with my own not inconsiderable
    fortune, both for the punctual payment of interest and for the yearly payment into the amortisation
    fund; which obligation I undertake the more gladly as it is known to me with the greatest certainty
    that, after the lapse of a few years, the revenues of the Prince from his principalities and entailed
    estates will guarantee a fixed income budget of 400000 Rthl.


    I remain, until death, in deepest submission,


    Your Royal Majesty''s most humble etc. etc.


    von Triebenfeld'

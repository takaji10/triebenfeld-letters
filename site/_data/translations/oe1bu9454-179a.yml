- page: 4
  en: 'whereby the capital will be wholly extinguished in .... years, and there will remain to his descendants,
    as a perpetuation of the grace shown him by the conferral of these estates, a clear entailed trust
    estate. To all measures which [uncertain: zweckken: tend] to the strict execution of this condition,
    also in the event of decease, the Prince submits himself without reserve; he also will


    4. allow the delivery of the treasury notes to take place in succession, in instalments to be determined
    in the highest quarter. Further, this amount of treasury notes may yet be reduced, in so far as Your
    Royal Majesty may be pleased to let the registered charge of 50000 Rthl standing upon the estates
    for the Invalids'' Fund continue to stand thereon. He desires the strict examination of this undertaking,
    which is as blameless and, in every respect, as wholly free of danger to the Most High interest as
    it is of the highest importance to the same, but thereafter most ardently that its execution may be
    hastened, since, as has already been said, the entire regulation of the Prince''s affairs depends
    thereon, inasmuch as he is by this means set free of all foreign credit ties and wholly put in the
    clear.


    I am ready to establish my authority for this most humble representation by means of the Prince''s
    judicial power of attorney which I have in hand, and also to give personal surety, with my own not
    inconsiderable fortune, both for the due payment of interest and for the annual payment into the amortisation
    fund; which obligation I undertake the more gladly in that it is known to me with the greatest certainty
    that, after the lapse of a few years, the Prince''s income from his principalities and entailed estates
    will guarantee a fixed revenue establishment of 400000 Rthl.


    I remain, until death, in deepest submission


    Your Royal Majesty''s most humble, etc.


    v Triebenfeld'

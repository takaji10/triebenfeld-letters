  en: 'to have [uncertain: greipllig] rendered to them, to negotiate all that is necessary with my creditors
    who are to be satisfied, whether judicially or extrajudicially; in any judicial proceedings, to represent
    me in the place of plaintiff or of defendant; to compromise upon an [uncertain: Sliedt] arbitral award,
    to conclude and execute settlements, to swear oaths upon my soul, also to remit oaths and to accept
    them as sworn, to grant releases of claim (jura cessa), to draw out again from deposit any monies
    [uncertain: er geechtlich: judicially] deposited, in general to do everything that shall be necessary
    and useful for the settlement of the loan [uncertain: Geflußs] and for the complete arrangement of
    my affairs of debt, and for which under the laws a special mandate might be required; with the power
    to substitute one or more persons, at his own choice, generally or specially.'

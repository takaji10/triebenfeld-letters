- page: 3
  en: 'C. Draft of the memorial to His Majesty.


    Most Serene of All, etc.


    Berlin, the 25th April 1806.


    If Your Royal Majesty might be pleased to grace with Your Most High attention and support a plan which,
    for a princely house whose head has consecrated his whole life to that same Most High Person, fulfils
    in a blameless manner several equally weighty purposes, and at the same time leaves no danger whatever
    to be apprehended for the Most High interest: then I may most humbly take comfort that the following
    representation will be deemed worthy of a Most Gracious consideration.


    It is known to that same Most High Person with what exertion the Prince of Hohenlohe has hitherto
    laboured to bring the affairs of his house into order; the just hope of doing so, entertained for
    many years and grounded in the decease of his uncle and the inheritance from him, has for the moment
    been frustrated anew by political events, for the damage he suffered in the [uncertain: Weich] amounts
    to 532/m Rthl. Only one way out remains to him still, founded upon the lordships of Zagórów and Trąbczyn
    situated in South Prussia, and to submit this to the Most High gracious decision is the purpose of
    this petition. There will namely be shown and proved specifically and in the fullest detail, by the
    mortgage and the Chamber''s detaxation records:


    1. that the two lordships afford a net yield of 40260 Rthl. It is to this yield that I have succeeded
    in raising the said estates, under the direction of the Most High [uncertain: der oder in] Domains
    Chamber at Kalisz. 16 new villages, and 500 families, should at the same time secure for the Prince,
    for this exertion, the Most High approbation and an honourable remembrance in the province.


    2. it will be specifically set forth that the whole of the Prince''s liabilities, without exception
    and including the intabulations upon these lordships, still amount to 698000 Rthl, and accordingly
    that the interest at ... per cent amounts to ......... NB at 4 pct. 27920 Rthl.


    ad, at 3 pct. 20940 Rthl. annually.


    On the presupposition of this proof, the Prince wishes to obtain upon these estates a capital of 698000
    Rthl in treasury notes, and stipulates,


    1. the encumbering of the estates therewith, in such a manner that the capital is secured as the first
    and sole mortgage,


    2. the payment of interest at .... per cent. NB it depends on what Rthl


    Mr [illegible]. R. B. will say, whether 4 or 3 pct.


    3. the establishment of an amortisation fund out of the revenues, namely for the payment of the interest
    and the amortisation of the capital, 34000 Rthl annually.'

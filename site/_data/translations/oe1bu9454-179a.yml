- page: 1
  en: '179 a)


    Copy.


    A. Summary survey of the annual revenues of the two lordships of Zagórów and Trąbczyn in South Prussia,
    [uncertain: expected] precisely by the Royal Kalisz Chamber of War and Domains and approved by the
    General Finance Department. Tit. I. On fixed dues.


    1. from the old subjects in both lordships, according to the table of performances = 5752 Rthl 14
    g. 11 d.


    2. On hereditary quit-rents from the dismembered parcels, according to the table of performances =
    16781 Rthl. Tit. II. On hereditary-lease canon.


    1. from Oleśnica = 2000 Rthl.


    2. from Ignaz Radzinski of Szetlewek = 1500 Rthl. Tit. III. From leased and rented parcels.


    1. From Martin Honrichs for the demesne farm of Trąbczyn = 3000 Rthl.


    2. From Tomas [uncertain: p] Glinicki for the demesne farm of Swiątniki = 1500 Rthl.


    3. for Mariantów = 150 Rthl.


    4. from Niedźwiecki for the demesne farm of Kopojno = 2125 Rthl.


    5. From the forest inspector Tietz for the demesne farm of Drzewce = 1800 Rthl.


    6. from Honrichs and Niedźwiecki for the propination rights = 4560 Rthl.


    7. For mill rents in Trąbczyn, Kopojno, Wrąbczyn and Swięcia = 222 Rthl. 8. for 2 brickworks = 870
    Rthl.


    Total 40260 Rthl 14 g. 11 d. All outlays, by whatever name they may go, have been taken over by the
    subjects and holders, do not appear at all, and there therefore remains an unalterable net revenue
    of 40260 Rthl 14 g 11 d. Besides these, there are reserved to the manorial lordship (Dominium) 4900
    Morgen of forest, and next to that all dues of jurisdiction and transfer fees, the amount of which
    can only be precisely ascertained after an average taken over 6 years, and which has therefore not
    been brought into the valuation at all for the present. Kalisz, 28th March 1806.


    Mencke


    v Hellen


    reviewed and correct in calculation


    Mündel.'

status: draft
segments:
- page: 1
  en: 'Copy. A. Summary survey of the annual revenues of the two lordships of Zagorowo and Trąbczyn in
    South Prussia, precisely [uncertain: expected] by the Royal Kalisch Chamber of War and Domains and
    approved by the General Finance Department.


    Tit. I. In fixed dues.

    1. From the old subjects in both lordships, according to the table of prestations: 5752 Rthl 14 g.
    11 d.

    2. In hereditary quit-rents from the dismembered parcels of land, according to the table of prestations:
    16781.


    Tit. II. In hereditary-lease canon.

    1. From Olesnica: 2000

    2. From Ignaz v. Radzinski at Szetlewek: 1500


    Tit. III. From leased and rented parcels.

    1. From Martin Honrichs for the demesne farm of Trąbczyn: 3000

    2. From Tomas v. Glinicki for the demesne farm of Swiątniki: 1500

    3. For Marianton: 150

    4. From v. Niedzewiecki for the demesne farm of Kopojno: 2125.

    5. From Forest Inspector Tiel[uncertain: tz] for the demesne farm of Drzewce: 1800

    6. From Honrichs and Niedzewiecki for the propination rights: 4560

    For mill-rents in Trąbczyn, Kopoyno, [uncertain: Wrąbczyn] and Swięcia: 222.

    8. For 2 brickworks: 870.

    Sum: 40260 Rthl 14 g. 11 d.


    All outgoings, by whatever name they may go, have been taken over by the subjects and the occupiers;
    they do not appear here at all, and there remains therefore an unalterable net revenue of 40260 Rthl
    14 g. 11 d.


    Besides these, there are reserved to the demesne 4900 Morgen of forest, and next to that all dues
    of jurisdiction and feudal fees, the amount of which can only be exactly ascertained after an average
    over 6 years, and which has therefore for the present not been brought into the valuation at all.


    Kalisz, the 28th of March 1806. Mencke v. Hellen. Revised and correct in the calculation. Mündel.'
- page: 2
  en: 'B. All the liabilities of His Serene Highness the Prince of Hohenlohe.

    1. To the Countess Schlabrendorff, payable at St. John''s: 25000

    2. To Weigel in Breslau, likewise: 27000

    3. To the Jew Meyer Bernhard on Drewes, for Glenck: 5600.

    4. To Gerard and Haupt on Swięcia: 18000.

    5. To Zerboni on Szetlewek: 10000.

    6. To Eysenhard on Szetlewek: 10000.

    7. To the Jew, now Glenck, standing on Olesnica: 20000

    8. To Glenck, to the very same Jew Meyer Bernhard, standing on Swięcia: 5000.

    9. To Lichnowski, standing on Trąbczyn: 42000

    10. For Grotowski, likewise: 20000

    11. For Seehausen, likewise: 5000.

    12. For Secher Tos[uncertain: t], the same: 8000.

    13. A protestation for the Prusimska, ditto: 8333.

    14. For the Invalids'' Fund, upon the Zagorow estates together: 50000.

    15. For Oppenheimer, ditto: 110000.

    Sum: 363933 Rthl.

    To this the Courland debt with 300000, at 5 per cent, the negotiation charges 34851 = 698784.'
- page: 3
  en: 'C. Draft of the memorial to His Majesty.


    Most Serene of All, etc. etc. Berlin, the 25th of April 1806.


    If Your Royal Majesty should deign to favour with Your Most High attention and support a plan which,
    for a Princely House whose head has dedicated his whole life to Your Most High self, fulfils in a
    blameless manner several equally important ends, and at the same time leaves no danger whatever to
    be apprehended for the Most High interest: then I may most humbly take comfort that the following
    representation will be deemed worthy of a Most Gracious consideration.


    It is known to Your Most High self with what exertion the Prince of Hohenlohe has for some time been
    at pains to bring the affairs of his House into order; the just hope of doing so, long entertained,
    arising from the decease and the inheritance of his uncle, has for the moment been frustrated anew
    by political events, for the loss which he suffered in [uncertain: Weich] amounts to 532 Rthl. [text
    lost] One way out remains to him yet, founded upon the lordships of Zagorowo and Trąbczyn situated
    in South Prussia, and to submit this to Your Most High gracious decision is the purpose of this petition.
    Namely, it will be specifically and in the fullest detail documented and demonstrated from the mortgage
    and Chamber assessment records:


    1. That the two lordships yield a net income of 40260 Rthl. It is to this yield that I have succeeded
    in raising the said estates, under the direction of Your Most High [illegible] in the Domain Chamber
    at Kalisz. 16 new villages, and 500 families, might well at the same time secure for the Prince, for
    this exertion, Your Most High approbation and an honourable remembrance in the province.


    2. It will be specifically shown that the whole of the Prince''s liabilities without exception, and
    including the intabulations upon these lordships, still amount to 698000 Rthl, and consequently the
    interest at ... per cent .......  NB: at 4 pct. 27920 Rthl; ad at 3 pct. 20940 Rthl yearly.


    On the presupposition of this demonstration, the Prince desires to obtain upon these estates a capital
    of 698000 Rthl in Treasury notes, and stipulates:

    1. The [uncertain: Depuration] of the estates therewith, in such wise that the capital shall stand
    as the first and sole mortgage;

    2. The payment of interest at . . . . per cent. NB: this depends on what r[t] G.C.V.B.[illegible]
    will say, whether 4 or 3 pct.

    3. The establishment of an amortisation fund out of the revenues, namely for the payment of the interest
    and the amortisation of the capital, 34000 Rthl yearly.'
- page: 4
  en: 'whereby the capital will be entirely discharged in . . . . years, and there will remain to his
    descendant, as a perpetuation of the grace shown him by the conferring of these estates, a clear entailed
    property. To all measures directed at the strict execution of this condition, even in the event of
    his decease, the Prince submits himself without reserve; he is also willing, 4., to let the delivery
    of the Treasury notes take place in successive instalments to be determined in the highest quarter.
    Further, this amount of Treasury notes may yet be reduced, in so far as Your Royal Majesty should
    be pleased to let the ingrossment of 50000 Rthl standing upon the estates for the Invalids'' Fund
    remain thereon.


    He desires the strict examination of this undertaking, which is as blameless and, in every respect,
    wholly free of danger for the Most High interest as it is of the highest importance to that same interest;
    but next to that he desires most ardently that the execution may be hastened, since upon it, as has
    already been said, the entire regulation of the Prince''s affairs depends, inasmuch as he will thereby
    be set free of all foreign credit-nexus and entirely put in the clear.


    I am ready to legitimate myself for this most humble representation by the judicial power of attorney
    of the Prince which I have in hand, and also to furnish personal surety, with my own not inconsiderable
    means, both for the punctual payment of interest and for the annual payment into the amortisation
    fund; which obligation I take upon myself the more gladly, as it is known to me with the greatest
    certainty that after the lapse of a few years the revenues of the Prince in his principalities and
    entailed estates will guarantee a fixed income establishment of 400000 Rthl.


    I remain, until death, in deepest [uncertain: submission], Your Royal Majesty''s most humble, etc.
    etc.


    v. Triebenfeld'
- page: 5
  en: 'D. Plan of amortisation of a capital of 690000 Rthl at 4 per interest, where 34000 Rthl yearly
    are [FLAG: angewiesen — assigned/ordered] for the payment of the interest and the amortisation of
    the capital. Accordingly all is discharged in 39 1/2 years. The table overleaf is reckoned at 3 pct.'
- page: 6
  en: to have [illegible] rendered to them, to negotiate all that is necessary with my creditors who are
    to be satisfied, whether judicially or extrajudicially; in any judicial proceedings to represent me
    in the place of plaintiff or of defendant; to compromise upon an arbitral award, to conclude and execute
    settlements, to swear oaths upon my soul, also to remit oaths and to accept them as sworn, to grant
    jura cela, to draw out again ex deposito any moneys judicially deposited, and in general to do everything
    which shall be necessary and useful for the settlement of the loan business and for the complete arrangement
    of my debt affairs, and for which by the laws a special mandate may be required, with the power to
    substitute one or more persons of his own choosing, generally or specially.

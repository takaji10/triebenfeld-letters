- page: 3
  en: 'C. Draft of the memorial to His Majesty. Most Serene etc. etc.


    Berlin, the 25th of April 1806.


    If Your Royal Majesty should deign to favour with Your Most High attention and support a plan which,
    for a princely house whose head has consecrated his whole life to that same Most High service, fulfils
    several equally important purposes in an unimpeachable manner, and at the same time leaves no danger
    whatever to be apprehended for the Most High interest: then I may most humbly take comfort that the
    following representation will be thought worthy of a Most Gracious consideration.


    It is known to Your Most High self with what exertion the Prince of Hohenlohe has been endeavouring
    for some time past to bring the affairs of his house into order; the just hope of doing so, entertained
    for many years and founded upon the decease of his uncle and the succession to him, has for the moment
    been frustrated anew by political events, for the damage he has suffered in the Empire amounts to
    532 Rthl. One way out still remains open to him, founded upon the lordships of Zagorowo and Trąbczyn
    situated in South Prussia, and to submit this to Your Most High gracious decision is the purpose of
    this petition. Namely, it will be shown and proved specifically and in the fullest detail, by the
    mortgage and Chamber assessment records:


    1. That the two lordships afford a net yield of 40260 Rthl. It is to this yield that I have succeeded
    in raising the said estates, under the direction of the Most High [uncertain: or] in the Domains Chamber
    at Kalisz. 16 new villages, and 500 families, might at the same time secure for the Prince, for this
    exertion, Your Most High approbation and an honourable remembrance in the province.


    2. It will be shown specifically that all the liabilities of the Prince, without exception and including
    the intabulations upon these lordships, still amount to 698000 Rthl, and consequently that the interest
    at ... per cent amounts to ......... N.B.: at 4 per cent, 27920 Rthl.


    At 3 per cent, 20940 Rthl yearly.


    On the presumption of this proof, the Prince desires to obtain upon these estates a capital of 698000
    Rthl in treasury notes, and stipulates:


    1. The [uncertain: depuration] of the estates therewith, in such wise that the capital is secured
    as the first and sole mortgage;


    2. The payment of interest at . . . . per cent.


    N.B. It depends upon what [illegible]


    G.C.V.B.[illegible] will say, whether 4 or 3 per cent.


    3. The establishment of an amortisation fund out of the revenues, namely 34000 Rthl yearly for the
    payment of the interest and the amortisation of the capital.'

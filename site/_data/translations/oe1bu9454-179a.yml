- page: 6
  en: 'to have [uncertain: performed] to them [uncertain: willingly]; to negotiate all things needful
    with my creditors who are to be satisfied, whether judicially or extrajudicially; in any judicial
    proceedings, to represent me in the place of plaintiff or of defendant; to compromise upon [uncertain:
    an arbitral] judicial award, to conclude and execute settlements, to swear oaths upon my soul, also
    to remit oaths and to accept them as sworn, to grant [uncertain: jura cela], to withdraw again out
    of deposit any moneys judicially deposited, in general to do everything that shall be needful and
    useful for the adjustment of the loan business and for the complete arrangement of my debt affairs,
    and for which by the laws a special mandate might be required, with the power to substitute one or
    more persons of his own choosing, generally or specially.'

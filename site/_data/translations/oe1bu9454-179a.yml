- page: 2
  en: 'B. All the liabilities of His Serene Highness the Prince of Hohenlohe.


    1. To the Countess Schlabrendorff there are to be paid at Midsummer 25000 Rthl.


    2. To Weigel in Wrocław likewise 27000 Rthl.


    3. To the Jew Meyer Bernhard on Drzewce, for Glenck 5600 Rthl.


    4. To Gerard and Haugt on Swięcia 18000 Rthl.


    5. To Zerboni on Szetlewek 10000 Rthl.


    6. To Eysenhardt, standing on Szetlewek 10000 Rthl.


    7. To the Jew, now Glenck, standing on Oleśnica 20000 Rthl.


    8. To Glenck, the same Jew Meyer Bernhard, standing on Swięcia 5000 Rthl.


    9. To Lichnowski, standing on Trąbczyn 42000 Rthl.


    10. For Grotowski likewise 20000 Rthl.


    11. For Seehausen likewise 5000 Rthl.


    12. For Secher Tost[?] the same 8000 Rthl.


    13. a protestation for the Prusimska woman, ditto 8333 Rthl.


    14. For the Invalids'' Fund, upon the Zagórów estates together 50000 Rthl.


    15. For Oppenheimer, ditto 110000 Rthl. Total 363933 Rthl.


    To this the Courland debt with 300000 Rthl., 5 per cent to the negotiators 34851 Rthl. = 698784 Rthl.'

- page: 2
  en: 'B. All liabilities of His Serene Highness the Prince of Hohenlohe.


    1. To the Countess Schlabrendorff, payable at Midsummer, 25000


    2. To Weigel in Breslau, the same, 27000


    3. To the Jew Meyer Bernhard on Drewes, for Glenck, 5600.


    4. To Gerard and Haupt on Swięcia, 18000.


    5. To Zerboni on Szetlewek, 10000.


    6. To Eysenhard, likewise Szetlewek, 10000.


    7. To the Jew, now Glenck, stands upon Olesnica, 20000


    8. To Glenck, the same Jew Meyer Bernhard, stands upon Swięcia, 5000.


    9. To Lichnowski, stands upon Trąbczyn, 42000


    10. For Grotowski, the same, 20000


    11. For Seehausen, the same, 5000.


    12. For Secher Tos[uncertain: t], likewise, 8000.


    13. A protestation for the Prusimska, ditto, 8333.


    14. For the Invalids'' Fund, upon all the Zagorowo estates, 50000.


    15. For Oppenheimer, the same, 110000. Total 363933 Rthl. To this the Courland debt at 300000, 5 per
    cent, the negotiation charges 34851 = 698784.'

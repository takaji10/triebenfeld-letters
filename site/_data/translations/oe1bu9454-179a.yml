- page: 1
  en: 'Copy.


    A. Summary overview of the annual revenues of the two lordships of Zagorowo and Trąbczyn in South
    Prussia, exactly [uncertain: expected] by the Royal Kalisz Chamber of War and Domains and approved
    by the General Finance Department. Title I. Of standing dues. 1. From the old subjects in both lordships,
    according to the table of prestations, 5752 Rthl 14 g. 11 d.


    2. Of hereditary quit-rents from the dismembered parcels, according to the table of prestations, 16781.


    Title II. Of hereditary-lease canon. 1. From Olesnica


    2000


    2. From Ignaz von Radzinski at Szetlewek 1500. Title III. Of leased and rented parcels.


    1. From Martin Honrichs for the demesne farm Trąbczyn 3000


    2. From Tomas von Glinicki for the demesne farm Swiątniki 1500


    3. For Marianton


    150. 4. From von Niedzewiecki for the demesne farm Kopojno 2125.


    5. From the Forest Inspector Tiel[uncertain: tz] for the demesne farm Drzewce 1800


    6. From Honrichs and Niedzewiecki for the propination rights 4560. For mill rents in Trąbczyn, Kopojno,
    Wrąbczyn and Swięcia


    222. 8. For 2 brickworks


    870. Total 40260 Rthl 14 g. 11 d. All outgoings, by whatever name they may be called, have been taken
    over by the subjects and holders; they do not appear at all, and there therefore remains an unalterable
    net revenue of 40260 Rthl 14 g. 11 d. Besides these there are reserved to the manorial lordship (Dominium)
    4900 Morgen of forest, and next to that all dues of jurisdiction and feudal goods, the amount of which
    can only be exactly ascertained after a six-year average, and which has therefore not been brought
    into the valuation at all for the present. Kalisz, the 28th of March 1806. Mencke


    von Hellen. Revised and correct in calculation. Mündel.'

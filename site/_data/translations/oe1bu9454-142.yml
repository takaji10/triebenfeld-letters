- page: 2
  en: 'According to Braun''s opinion he must have 7500 Rthl, without the honorarium promised to him in
    the Betsche purchase business. If therefore one could get clear of everything with 5000 Rthl, one
    would be making [uncertain: non solides fude].


    When Your Most Serene Highness comes to me I shall lay the pieces before the same most highly. In
    deepest reverence I remain, until death, Your Most Serene Highness''s Breslau, the 12th September
    1804. faithful most humble and obedient servant v. Triebenfeld'

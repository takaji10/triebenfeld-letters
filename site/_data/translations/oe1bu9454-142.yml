- page: 2
  en: 'According to Brauns''s opinion he must have 7500 rt., without the honorarium promised him in the
    Pszczew purchase business. So if one could get away with 5000 rt all round, one would be doing non
    solides fude.


    When Your Most Serene Highness comes to me I shall lay the pieces before Your Most Exalted Self. In
    deepest reverence I remain, until death, Your Most Serene Highness''s Wrocław, the 12th of September
    1804. faithful and most humble and obedient servant v Triebenfeld'

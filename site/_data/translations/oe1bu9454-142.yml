- page: 1
  en: '142


    Most Serene Prince


    Most gracious Prince and Lord, my illness is so obstinate that I must henceforth keep to the bed or
    the sofa; for that reason I cannot lay myself at Your Serene Highness''s feet and speak with Your
    Most Exalted Self about the business; even writing comes very hard to me.


    In the enclosed letter Bornstädt says that he means to depart; presumably his travelling money is
    all gone. I therefore had Glenck asked whether he would be so good as to come to me and bring out
    the papers, or rather the various lease and settlement contracts which have been concluded with Bornstädt.
    In answer to my courteous request I received the accompanying [uncertain: pert] note.


    To let the man travel off without the matters being settled is not good; the matter must be settled,
    for by this one strikes the enemy on 3 sides. My humble petition is that Your Serene Highness command
    Mr Glenck to send me the contracts, settlements and accounts which have been negotiated with Bornstädt.
    And then that Your Serene Highness say, if only in a couple of lines, that out of special grace, in
    order to make an end of the whole affair, Your Most Exalted Self will give Bornstädt 5000 rt.'

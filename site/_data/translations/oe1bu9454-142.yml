segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord, My illness is so obstinate that henceforth I must keep to my bed or
    to the sofa; because of that I cannot lay myself at Your Serene Highness''s feet and speak with the
    same most highly about the business; even writing comes very hard to me.


    In the enclosed letter Bornstädt says that he wishes to depart. Presumably his wise money is all [gone].
    I therefore had Glenck asked whether he might not come to me and bring out the papers, or properly
    speaking the various lease and settlement contracts which have been concluded with Bornstädt. In answer
    to my civil request I received the accompanying Scopptisch note.


    To let the man travel off without settling the matters is not good; the matter must be settled, for
    by this means one strikes the enemy on 3 sides. My humble petition is that Your Serene Highness command
    Mr. Glenck to send me the contracts, settlements and accounts which have been negotiated with Bornstädt.
    And then that Your Serene Highness should say, in but a couple of lines, that the same most highly,
    out of especial grace and in order to make an end of everything, is willing to give Bornstädt 5000
    Rthl.'

- page: 2
  en: 'to me, which has followed me hither through the post. This letter is of such a content – that Blomberg
    infamously incriminates himself and must sit at least 10 years in the fortress. No robber who throws
    to the ground the wanderer in the wilderness, stripped of all means of defence, could make such base
    demands so entirely without shame as this honour-forgetting man does. In plain words he says today
    besides — that if all this were not punctually given to him, then nothing should come of the dismemberment;
    but if he obtained what he demands, then he would himself carry the matter through — Moreover, he
    means to go on shooting about with me until one of the 7 [illegible] fetches. Here, however, he meets
    his master, for today he already receives the full [uncertain: Laage] – I have given him notice that
    if he should let himself presume to speak so much as one more word, or to meddle in the matter without
    my knowledge, I should know how to chastise him – for with a villain, which he has stamped himself
    to be, I would have no pity, and woe to him if he now stirred himself — He will assuredly be very
    meek.


    in the [uncertain: leuteten] submission I remain, until death,


    Your Serene Highness''s


    Berlin, the 15th of January


    1805


    most faithful servant


    v. Triebenfeld'

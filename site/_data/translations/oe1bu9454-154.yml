status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The matter of the loan is in the best train; God grant
    that no new impediments arise. It lies for examination with an otherwise good man. Everything that
    Your Serene Highness was pleased to charge me with under the 13th I shall faithfully attend to. What,
    for the rest, Wollenhaupt has prattled about a sequestration is a pure lie; on the contrary, Lichnowski
    has lifted the attachment against the interest for 6 weeks. The attachment on account of Magnuski
    has, according to Grimm''s assurance, likewise been lifted; with the next post I shall meanwhile write
    to him. In the meantime I do not rightly understand the whole business: Przespolewski has after all
    no 30000 Rthl to demand, and the attachment obtained by Magnuski is after all lifted. For the rest,
    the Dębinska has only laid on an attachment again, to the effect that nothing shall be paid out to
    Magnuske. – This will in any case not happen so. Blomberg has written a letter under the 25th of Decbr,
    consequently earlier than the one which was answered to him by express,'
- page: 2
  en: 'written to me, which has followed me hither by the post; this writing is of such a tenor — that
    Blomberg has acted infamously and must sit at least 10 years in the fortress. No robber who throws
    to the ground the wanderer in the desert, stripped of all defence, can make such base demands so wholly
    unabashed as this man void of honour does. In dry words he says outright — that if all this were not
    punctually granted him, then nothing should come of the dismemberment — but if he obtained what he
    demands, then he would himself carry the business through. With me, moreover, he means to go on shooting
    about until the [uncertain: 7] fetches one of us. But here he meets his master, for today he already
    receives the full [uncertain: Laage — "broadside/volley"?] — I have given him notice that if he should
    so much as presume to speak another word, or to meddle in the affair without my foreknowledge, I should
    know how to chastise him — for with a villain, as he has himself stamped himself, I should have no
    pity, and woe to him if he now stirred — He will assuredly be very meek. In deepest submission I remain,
    until death, Your Serene Highness''s Berlin, the 15th of January 1805 most faithful servant v Triebenfeld'

- page: 2
  en: 'to me, which has followed me hither by the post; this letter is of such a content — that Blomberg
    has behaved infamously and must sit at least 10 years in the fortress. No robber who throws to the
    ground the wanderer in the wilderness stripped of all defence can make such base demands so wholly
    unabashed as this dishonoured man does. In dry words he says today [uncertain: thereupon] — that if
    all this were not punctually given him, then nothing should come of the dismemberment — but if he
    received what he demands, he would himself manage the business — Moreover, he means to go on skirmishing
    with me until one of them [uncertain: the devil takes]. Here, however, he meets his master, for today
    he already receives the full [uncertain: broadside] — I have given him notice that if he should so
    much as presume to speak another word, or to meddle in the business without my knowledge, I should
    know how to chastise him — for with a villain, which he has stamped himself to be, I would have no
    pity, and woe to him if he now stirred himself — He will surely be very meek.


    In [uncertain: deepest] submission I remain, until death,


    Your Serene Highness''s


    Berlin, the 15th of January


    1805


    most faithful servant


    v Triebenfeld'

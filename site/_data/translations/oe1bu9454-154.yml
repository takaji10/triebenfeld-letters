- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    The matter of the loan is going forward in the best way; God grant that no new obstacles arise. It
    lies for examination with a man who is otherwise sound.


    Everything that Your Serene Highness may be pleased to charge me with under the 13th I shall faithfully
    attend to. As for what Wollenhaupt has prattled about a sequestration, that is pure [uncertain: Lage];
    on the contrary, Lichnowski has lifted the attachment on account of the interest for 6 weeks. The
    attachment on account of Magnuski has, according to Grimm''s assurance, likewise been lifted; with
    the next post I shall meanwhile write to him. In the meantime I do not properly understand the whole
    business: Przespolewski surely has no 30000 Rthl to demand, and the attachment obtained by Magnuski
    has surely been lifted. For the rest, the Dębinska woman has only laid an attachment again, to the
    effect that nothing is to be paid out to Magnuske. – This will not happen in any case. Blomberg has
    written a letter under the 25th of December, consequently earlier than the one which was answered
    to him by express,'

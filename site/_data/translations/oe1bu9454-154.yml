- page: 1
  en: '154


    Most Serene Prince


    Most gracious Lord, The matter concerning the loan is in the best train; God grant that no new impediments
    arise. It lies for examination with a man who is otherwise a good one.


    Everything that Your Serene Highness has been pleased to charge me with under the 13th I shall faithfully
    attend to.


    As for the rest, what Wollenhaupt has prattled about a sequestration is a pure [uncertain: position];
    on the contrary, Lichnowski has lifted the attachment [text lost]gainst the interest for 6 weeks.
    The attachment on account of Magnuski has, according to Grimm''s assurance, likewise been lifted;
    with the next post I shall in the meantime write to him. I do not, for my part, rightly understand
    the whole business: Przespolewski surely has no 30000 Rthl to claim, and the attachment procured by
    Magnuski is surely lifted. For the rest, the Dębinska woman has only laid an attachment again, to
    the effect that nothing is to be paid out to Magnuski. — Nor will that be done in any case. Blomberg
    has written a letter under the 25th of December, consequently earlier than the one that was answered
    to him by express,'

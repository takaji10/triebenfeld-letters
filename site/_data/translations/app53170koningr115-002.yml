- page: 1
  en: 'Done in Konin on the Tuesday next after the Sunday Exaudi in the year of the Lord 1768.


    On the part of the Right Honourable Prusimski against the heirs and possessors of Łukom, Drzewce,
    Biskupice, Tomice — Report of a Citation


    Let there be seen here, among the produced documents, the report of the citation issued on the part
    of the Right Honourable Antoni Prusimski of Kolno, Starost of Niszczewice, against the Right Honourables
    Chełmski, the Żychliński successors, Ignacy Gałecki, Starost of Bydgoszcz, … the Abbot and the venerable
    Convent of Ląd, for the courts of the Crown Tribunal at Bydgoszcz, for the fixing of the boundary.


    On the part of the Right Honourable Chełmski against the heirs and possessors of Tomice, Drzewce,
    Trąbczyn, Nowa Wieś — Report of a Citation


    Let there be seen here the report of the citation on the part of the Right Honourable Stanisław Chełmski
    against the Most Reverend Słowiecki, Abbot, and the Convent of Ląd, the Right Honourables Prusimski,
    Gałecki …'

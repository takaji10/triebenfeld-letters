  en: 'Document no. 191


    1411, 30 November, at Ląd.


    Gerhard, abbot of the monastery of Ląd, exchanges with Piotr, schultheiss of Nowe Zagórowo alias Drzewiec,
    the schultheiss''s office in Kownaty for the schultheiss''s office in Drzewiec.


    In the name of the Lord, amen. Lest things done in time vanish together with the passing of time,
    it is expedient that every transaction which is to be dealt with hereafter be firmly strengthened
    by the point of letters and the trustworthy subscription of witnesses. Hence it is that we, Brother
    Gerhard, abbot in Ląd, of the Cistercian Order, of the diocese of Gniezno, wish all who see or hear
    this, those to come as well as those of now, to know that, the common consent of our elders having
    first been had, we have made an exchange, and by the witness of these presents do exchange, by the
    right, manner and form in which it is the custom to exchange, with the provident man Piotr, schultheiss
    in Nowe Zagórowo,¹⁾ called alias Drzewiec, and his lawful successors: giving to the said Piotr the
    schultheiss and his lawful successors a mansus and a half in Kownaty,²⁾ our village, situated there,
    with the schultheiss''s office of that our village of Kownaty, for his other half mansus and all its
    appurtenances with the schultheiss''s office in Drzewiec, our said village, over which the same Piotr
    the said schultheiss and his lawful successors renounce plainly and wholly, reserving to themselves
    no right at all in that estate and schultheiss''s office, all deceit and fraud excluded; yet on these
    conditions written below. First, that we have sold and do now sell to the said Piotr the schultheiss
    a mansus and a half in Kownaty, our said village, for which he has given, paid in full and assigned
    to us twelve marks of broad groschen, reckoning 48 groschen to each mark, so however that the same
    schultheiss and his lawful successors shall have and possess three mansi there in Kownaty, our said
    village, freely and peacefully. Further, from the date of these presents the schultheiss shall have
    a freedom lasting twenty-four years, and likewise the peasants, reckoning from the time they come,
    shall know without doubt that they will have twenty years of freedom. We have also given and assigned,
    and by these presents give and assign, to our said schultheiss one arable iugerum beyond the three
    said mansi, on which we license him to settle a gardener or gardeners and an innkeeper as he pleases.
    Item the same schultheiss may build and set up a bakery, a smith, a shoemaker and a butcher''s stall
    on his estate wherever it seems good to him, with our leave, consent and will. The said schultheiss
    and his descendants are also bound to us to all the services to which our other schultheisses are
    bound to serve, for which services both he and his descendants shall have and keep one horse worth
    three marks of broad groschen; and he and his successors shall have the third penny of every matter
    judged, and enjoy the same freedom as the schultheisses set up in our other villages have been wont
    to enjoy until now. Moreover the peasants living in our said village shall, after their freedoms have
    run out, give, assign and pay in full every year on the feast of St Martin a mark of broad groschen
    from each mansus. Our said peasants are also bound to give us every year two chickens each at the
    feast of the Assumption of the Blessed Mary and half a threescore of eggs each at the feast of Easter;
    and at the great court, which is held every year according to the common custom of the land, the schultheiss
    is bound to pay, give and assign to us six scots, and the peasants half a mark. Likewise the peasants
    in our said village shall be bound to plough for us from each mansus three times a year, one iugerum
    each time. And so that all dispute hereafter over the service and freedom of the peasants may be utterly
    removed, the peasants of our said village are bound to us in the same way to all things to which the
    peasants of knights are bound. In testimony of all which and for the strength of lasting firmness,
    we have had the present letter fortified with our seal and that of our convent. Given in our monastery
    of Ląd, in the year of the Lord 1411, on the day of St Andrew the Apostle. In the presence of the
    discreet and religious men, the brothers: Feliks, prior; Filip, the old abbot; Jan, subprior; Goblin,
    bursar; Syfryd, cellarer; and many others worthy of trust, called and asked specially for this in
    testimony of all and each of the foregoing.


    From the Cologne copy-book of the privileges of Ląd, fol. 29, no. 64, and fol. 36, no. 77.


    ¹⁾Zagorów, once a small town, today a parish village in the district of Słupca.


    ²⁾Kownaty, a village in the district of Słupca, parish of Wilczyn.'

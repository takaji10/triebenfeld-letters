status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord!


    After I have lain here 5 weeks with the hot bilious fever and have with difficulty escaped death,
    my first duty is to inform Your Serene Highness of everything, how your affairs stand here. I must
    therefore, if with the weakness still oppressing me I shall be able to recall it all, begin from Berlin.
    There I departed some days before Midsummer with the assurance that I should receive so much out of
    the Justice Fund as to be able to pay Oppenheimer with 110000 Rthl, and to get the mortgage book clear.
    Then I wished to pay Lichnowski what was still coming to him against Jura cessa. 40000 Rthl. Further,
    to hand over to Grotowski the remainder against the surrender of his instruments. 20000 Rthl. Finally
    to Haugt on the very same terms on account of his demands 18000 Rthl, and the Secher Koss[illegible]
    with 8000 Rthl, and so likewise to satisfy the Prusimska. 8000 Rthl. To Zerboni, Eysenhardt and Seehausen
    the old Sr. Radzinski was to be paid as well, because the villain does not render his lease-money
    but only ever makes chicanery. 24000 Rthl. It was still my care to raise together with the Countess
    Schlabrendorff, for you, that creature the Prusimska 8000 Rthl, and especially to gather something
    for Your Serene Highness. 33000 Rthl. Also indeed to remit the interest at the Invalids'' Fund for
    the [uncertain: grauf], so that credit might be won 50000 Rthl. This must amount together to 311000,
    and more debts you have not here, for all the others are discharged and [uncertain: standing], among
    the 110000 Rthl. In the meanwhile Your Serene Highness has on the other hand, as the table states,
    184000 Rthl to receive by degrees, and there remain owing only upon the estates the 127000 Rthl, which
    would yield 40263 Rthl annually.'
- page: 2
  en: 'So then, as said overleaf, [uncertain: I swung off] before Midsummer from Berlin to Betsche, to
    the [uncertain: Rader] of the Jews; the Meyer Bernhard had brought 3 or 4 suits against Your Serene
    Highness, because nothing was yet known of the Royal approval in the Betsche matter. At Betsche I
    communicated the news to the people, settled accounts with them, paid Eichaust likewise old court
    costs, and after these the burghers and inhabitants still owed Your Serene Highness 4000 Rthl, which
    they must pay at Michaelmas. There, however, I learnt to my terror that an execution decree had been
    sent from Posen to Trąbczyn, by which (since Metzer had guarded nothing) the Prusimska''s 10000 tl.
    of dowry portion together with interest and costs, thus together some 22000 Rthl, were to be paid.
    I therefore hastened as fast as was possible to Kalisz and proved, by the documents procured for me
    by Rapacki, that Prussiemski had already paid part of that dowry; by this I did indeed gain time,
    meanwhile the matter hangs and a year and a day may again pass before I [uncertain: burn] it clear.
    Only this is certain, that even those 16000 [uncertain: gulden] entered in the [uncertain: tableau]
    may no longer be paid in full, let alone the 22000 Rthl.


    From Kalisz I went to Trąbczyn, where I now confidently believed I should find some 30000 Rthl. But
    O heaven, how I was startled when instead of money I found a thousand confusions, roguery, and consequently
    empty coffers – the earlier ones all declared themselves insolvent – made great reckonings on account
    of the exorbitant deliveries, cartage, and quartering under the Russians and Prussians, so that the
    leases of 2 years would have gone out on that account. The old peasants who had been set upon rents
    had ceased, and had, despite all judicial agreements, approvals from the Chamber and from the Royal
    Majesty himself, again abandoned the grounds allotted to them, certainly with the connivance of the
    lessees, so that these sharpers should think themselves entitled to make so much the greater reckoning,
    again'
- page: 3
  en: 'appropriated their former grounds to themselves and sown them, and thereby almost dissolved the
    demesne farms, indeed at the [uncertain: end] even drove off the German colonists already engaged,
    so that I could reckon neither upon the stipulated entry-monies from these nor still less upon rents.
    To all this Schenck had kept silent and gave himself out for dead [uncertain: Brand] when I wished
    to call him to account. I [uncertain: asked] this [uncertain: Massette] now for advice as to what
    ought to be done in this – his answer was to let the matter take its course, and to report it to the
    government, to throw a suit round the necks of the lessees and the subjects.


    Q. Have you dealt so in the Florich, Rybbeck and Burck matters? [uncertain: Act.] Yes, but it cannot
    be done otherwise.

    Q. How long do you believe the process can last before the matter comes clear?

    A. Well, some 2 to 3 years.

    Q. Does the gentleman understand Russian? [illegible] No!

    I: Well then, I will show it to him. With me one spits such lazy scribblers in the face, lets them
    run, and acts alone.


    Upon this I went to Trgberin and summoned the lessee Honrichs before me with his contract. To the
    question whether he could pay the lease-sum now due of 2000 Rthl and also at once render the rest
    of the 800 Rthl, this man answered – No. He believed, he added, that he owed nothing either, for he
    had over 5000 Rthl of claims'
- page: 4
  en: 'and I believe he is a scoundrel. He pays, or within an hour he lies with his belongings across
    the Warthe. By this first tone the fellow was put out of countenance and began to beg. Upon this I
    gave way, that if he at once gave up the lease contract, let his claims fall, and at Christmas paid
    the 2800 on pain of losing his whole goods, then he might still hold this year; only it must remain
    free to me to dismember as much and whenever I please from the demesne farm Trąbczyn. To this he agreed;
    the contract for 6 years was annulled and in its place a one-year one was drawn up with the condition
    that as soon as he has [uncertain: taken off the crop] I may come to dismember the demesne farm, whereupon
    Honrichs undertook to recruit purchasers himself who should give 600 Rthl per Hufe, consequently 2
    to 300 Rthl more than hitherto; against which I conceded to him that the grounds which should be dismembered
    need not be improved again, and also promised him to place him in Your Serene Highness''s service
    with 400 Rthl yearly salary, if he will faithfully bring this about and especially help to bring the
    peasants and the other lessees to reason.


    After this operation I at once had all the inhabitants belonging to Trąbczyn called together. When
    the peasants saw that the lessee stood on my side, already ready with the knout – then their courage
    too fell, and within an hour this work was so ordered to Your Serene Highness''s advantage that neither
    devil nor saint in all eternity can have anything against it. The peasants soon paid their half-yearly
    rent and vowed to lay down the other half at Christmas.


    Now I went with Honrichs to'
- page: 5
  en: 'Swiątniki. Here sat v. Zglinski with his two gaping fools of sons. There the peasants held a great
    part of the manorial fields sown, and in concert with the lessee had so confused everything that I
    myself shuddered to press into this labyrinth. According to the contract v. Zglinski was to pay 1500
    Rthl. The contract ran for 12 years, and contained among its clauses the clause that if the lessee
    does not pay on the term-day the contract is at once null and void, and the lessee bound to vacate
    immediately, but to pursue any claims he may have by way of law. Now I [uncertain: asked] this Sarmatian
    whether he would pay; his answer: I shall not only not pay, but shall sit here so long until I know
    my claims, which amount to 5700 Rthl, satisfied; and moreover I insist that the grounds which the
    peasants possess, but which were previously allotted to me, be handed over to me at once.


    At this [uncertain: summons] all the peasants also appeared and declared that they would not give
    up the grounds, and if the [uncertain: Fünf] and the King himself should come; they were born and
    reared upon those grounds and would never vacate them. I represented to the fellows that they had
    settled everything judicially, that the Prince had made them a gift of their freedom, had given them
    the inventory gratis besides, that their rent was trifling compared with that of the colonists, that
    even the houses and buildings had been given them into the bargain,'
- page: 6
  en: 'whereas the colonist has first had to [uncertain: break] all the ground laboriously and build every
    [building] at his own cost. – Meanwhile my speaking availed nothing; it was much more like oil for
    quenching. Since, however, I had marked the spokesmen and at the same time perceived which of them
    had approached v. Zglinski and his sons, I had one of these step forward, threw him down, and had
    50 knout-strokes counted out to him – the fellow did not hold out to the end, for Honrichs flogs like
    the best Cossack general – he begged for mercy; notwithstanding, I had it continued, but at the 43rd
    the beast fainted. I had him doused with water, and when he came to had him led aside and the next
    brought forward. I threw him down too; Honrichs again tore breeches and hide asunder with every stroke
    – this took effect and he cried for mercy and [uncertain: promised] to confess. I had them hold, [text
    lost] that all three communities had been given notice by Zglinski, Niedzewiecki – on the question
    what he had to say, he then declared – and by the Olesnicer. The [uncertain: Schatz] and several,
    especially the Kopojno people, who had also come along, pay this – they confessed themselves deserving
    of punishment, but begged imploringly for pardon and declared themselves content with the grounds
    allotted to them. But before that they had to complain of the Justitiarius: he had always turned them
    away when they wished to complain to him or to ask for directions; on the contrary he had always stood
    together with the noblemen and lived with them in merriment.


    After this coup, which had succeeded for me, I sent at once to [uncertain: Schanden] and had the [uncertain:
    aforesaid] come to me immediately, so that in his presence the peasant grounds might be properly bounded
    and separated for all eternity from the manorial and colonists'' grounds. He appeared in the shape
    of the most crushed wretch, and the work was begun and happily completed; only [uncertain: Schend]
    remained lying half-way'
- page: 7
  en: 'and substituted a certain Ogradenz. Perhaps the scoundrel will croak and death free us from this
    hypocrite.


    After this too had been happily settled, I went at the lessee''s throat again, who, [seeing] that
    he was unmasked, [uncertain: followed meekly for his own part], and the complete failure of his plans,
    he therefore [uncertain: asked] for pardon; this I could not give, so he gave up the contract and
    moved off [uncertain: apparently]. I had his corn threshed out and sold for 260 Rthl, and [uncertain:
    I am now offering] the demesne farm, which consists of 30 Hufen of land and meadow, at 600 Rthl entry-money
    and 15 Rthl yearly rent the Hufe. Now it depends on Honrichs soon getting purchasers for it; for by
    the lessee''s infamy nothing has been lost here either, but much gained.


    After this the lessee of Kopojno had to step forward; warned by that proceeding he soon [uncertain:
    asked] for fair weather; his reckonings likewise amounted to some 6000 Rthl. He [uncertain: brought]
    them down, however, to 1125, which, since the Landrath had almost flayed the people, I had to accept;
    but in return he too had to cancel the contract and take it only for 1 year, for which he must pay
    2500 Rthl at Christmas, and against which I may also have it dismembered at once. The Schokkomer peasants,
    incited thereto by the Olesnicer and Wrgbüner band of rogues, likewise had to come to terms, after
    Honrichs – because they had secretly moved the boundary marks apart, but had luckily been caught at
    it by them – had counted out 30 knout-strokes to each. Now on this side everything is in order, and
    the Germans are gradually coming back again.


    The old malicious Tietz too, who has leased Drzewce, promises to render the lease-money; only the
    fellow wants to deduct 600 Rthl as the 2 years'' pension which Your Serene Highness is said to have
    assured him at 300 Rthl for his lifetime. I did not know what there is in this; may Your Serene Highness
    deign to instruct me upon it. In the records here nothing is to be found but the enclosed authenticated
    Copies, which are taken from Tietz''s original pieces, and according to these the old man has nothing
    to demand [uncertain: Inachten].'
- page: 8
  en: 'All these transactions I had concluded within the space of 6 days, and I was about to have the
    Germans, who have some 40000 Rthl to pay, sought out together, in order to obtain money to pay the
    interest, to satisfy the [uncertain: Schluß Arendorffen], and to gather something for Your Serene
    Highness. But this did not succeed – many of the old ones did indeed show themselves, but always vanished
    again. New purchasers were to come, but always drew back again in fear.


    Over this failure of my plans I vexed and grieved myself in such a manner that a violent bilious fever
    forthwith fell upon me, which has compelled me to keep my bed these 5 weeks already. Only these 2
    days is it mending, and I can now think and work more again. Yet everything still looks very confused,
    and succeeds only so far as long lying in bed, violent headache and great weakness permit it.


    [uncertain: Weigel] I shall, as soon as I [uncertain: am certain] back, and if possible have quieted
    the Schläbrendorf, go again to Berlin – for here it might take too long before I bring together anything
    worth mentioning.


    The notorious Glenck, who has hatched a true conspiracy against me and Your Serene Highness, is, as
    I have just learned, and what came out during my illness, turning away all purchasers with his gang.
    He has been staying here already over 6 or 7 weeks – he has joined himself with the three Olesnicer
    rogues, with a certain Kramplich, with Flöriche, Rybbeck, with a certain Bergemann and more such trash,
    in order to frustrate all my plans. To attain his purpose he has made a lampoon upon me and given
    such to people who wished to buy, who have taken it with them as far as the Mark, and thereby at the
    same time frightened back others who wished to come hither'
- page: 9
  en: 'and settle themselves here. His clerk by the name of Meyer, who lives here on the Wrąbczyn bailiwick,
    has fallen out with him, and during my illness reported him to Schmid. This man, in order perhaps
    to clear himself again, sent me the lampoon yesterday evening. The content is as stupid and insipid
    as the fellow himself is; but the knave has attained his purpose of hindering my plans and harming
    the good cause. He thinks I shall grow weary and depart, and then he would have to come back again
    because there would be nobody there.


    The wretch is offering his estate for sale and wants to dismember it himself; he always draws the
    people who mean to buy here aside to himself, talks them away from here as aforesaid, and when in
    the end he cannot give judicial contracts, against which the Wrąbczyn peasants always protest, then
    the people go back and think they would be cheated in Your Serene Highness''s estates alone.


    I am urged to denounce the fellow to the fiscus, or at least to throw an action for injury round his
    neck – I shall not do it – the villain has harmed Your Serene Highness more than me. I therefore leave
    this to Your Serene Highness''s discretion.


    For the rest, may you deign to tell me, most gracious Lord, whether one should not demand the yearly
    interest from the fellow. He has not yet given a Kreuzer, but one assures that he settles on that
    head with Your Serene Highness alone. The outstanding interest is said to amount already to over 400
    Rthl, and even this is a motive for throwing the fellow out'
- page: 10
  en: 'and drawing the bailiwick in again, especially if his own clerk will prove that for several years
    he has constantly appropriated to himself all the grass from the Wrąbczyn meadows, which amount to
    several hundred Morgen, and has even taken rents from the komorniks dwelling there. The bailiwicks
    themselves are fully paid for with 4000 Rthl; the 300 Morgen would indeed be worth almost as much,
    only these cannot be assured to him, for peasant meadows lie throughout them, and there a costly process
    is unavoidable – the wretch has [uncertain: favourably] induced Your Serene Highness in the granting
    of the 300 Morgen – the [uncertain: Schult] has forgotten that within the Wrąbczyn boundary he sold
    some 10 Hufen to 4 Kashubians for a trifle and took the money; so nothing remains, if the accursed
    contract is to be kept with the peasants.


    I greatly fear that Your Serene Highness will yet get a costly process out of this Swedish stroke,
    for it was just said that Glenck has sold the bailiwicks to the [uncertain: Schulmischen] Giese in
    Olesnica. Now the fellow has so foully [uncertain: induced] you that you sell him the 300 Morgen for
    300 Rthl and permit him to dismember – if Giese buys, he will then at once go to law against Your
    Serene Highness – my advice at the time was good: give the fellow 4000 and let him run. It is with
    the Olesnica fellows that the man has brought Your Serene Highness into the great misfortune, and
    as is said he is supposed to have secretly given the [uncertain: Bessinn] testimonies whereby they
    will win the process. On this man''s account the matter here is most disagreeable to me.'
- page: 11
  en: 'As concerns the revenues and the sums which Your Serene Highness has to receive from the estates
    here now and in future, you will see these from the tableau annexed. I believe you can be very well
    content with them when all this shall be settled.


    Since, moreover, the lazy Schenk, as he says, means to croak, the Kriegsrath v. Hallen will be so
    good as to go once every 4 weeks from Kalisz hither to look over everything that happens here, without
    his demanding a Groschen for it. Also, as Schenck now wishes to have himself brought at once to an
    abbot at Posen, I shall at once hand over the cash to Honrichs and Cabanis; these two shall, neither
    be permitted to do anything without the other, and there is therefore nothing to be feared. I think
    also to be here again about Michaelmas, when many have now promised to pay.


    In deepest reverence I remain, until death, Your Serene Highness''s


    This moment I receive in advance from the Privy Councillor von Tesmar in Berlin the joyful news that
    360000 Rthl are to be had. O if only I could travel first! I am again very ill today: the 7th of Aug.


    Trąbczyn, the 6th of Aug 1806.


    most faithful and obedient servant

    v Triebenfeld'

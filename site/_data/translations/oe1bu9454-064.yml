- page: 5
  en: 'I see I [uncertain: fare] better. Now, most gracious Lord, I beg you once more, only send 300 rt
    converted into gold, so that I may be in a position here to go on negotiating. You may, most gracious
    Prince, now rely straightway upon what I have said, for that honest great man Prince Hardenberg will
    not forsake you. People [uncertain: Today] the Chief Post Director Mann sends these letters. May Your
    Serene Highness deign to address your letters, his dispatch, to the Royal Prussian Chief Post Director
    Mr Mann, Your Honour, in Vienna; then I receive everything. Only, for God''s sake, money. A letter
    from the Princess of Hesse-Rotenburg follows herewith.'

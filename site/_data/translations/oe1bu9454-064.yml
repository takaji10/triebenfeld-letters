- page: 6
  en: 'Have mercy, Your Serene Highness, and only send money - 300 Rthl in Gold I must have if I am to
    go on working here, and if I am not to sink in disgrace and [uncertain: O''Pott] - it is already shabby
    enough when, among people whom I need daily, I must also drive about like a beggar-dog - today I have
    moved out and am living at 872 große Schuller Straße, where I live on credit, for in the inns here
    every foreigner must pay everything at once - and my [uncertain: Zaabe] is still 57 gulden. If Your
    Serene Highness does not send money quickly, then everything collapses; without money no servant here
    gladly opens the door. Everything is too dreadfully dear. For the sake of God''s mercy let Your Serene
    Highness send money, for I endured the greatest [uncertain: Proclitation] only yesterday - would that
    I had not come here this time. Like a begging boy I drive myself about here. Who will hear me and
    look at me in such a shape?


    I sacrifice everything, I wish the great villain for Your Serene Highness, to rescue you at one stroke,
    [uncertain: den Händsche]; alone, and without the help of some friends, I cannot get on - but what
    is to be done with a [uncertain: Leuphalten].'

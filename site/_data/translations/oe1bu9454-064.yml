- page: 2
  en: 'Copy. Dear upright Friend, Herewith I convey to you the valuations and a Copy of the Landschaft
    assessment of the Biocdorff and Molna estates. The latter, as the figure shows me, are sound, so that
    anyone must find the demand of Mr. von Knobelsdorff fair. The debts intabulated upon the estates consist
    in mortgage bonds and small mortgages. Together they amount to 330000 Rthl, and since only 75000 Rthl
    are callable after the expiry of the moratorium, they can, my honest friend, become no burden to you
    with your means. Everything depends on how you are in a position to handle Mr. von Stössel. He is
    hard pressed and, as I know, is offering his papers at 50 per cent; I believe you may buy the whole
    180000 Rthl from him for 90 Rthl, whereby he must still concede sound terms of payment - to draw this
    gentleman in is no sin, for he has frightfully taken advantage of the good [uncertain: both] Princes
    in the [uncertain: Köschent] dealings with me. Meanwhile I leave that to your wisdom. For the rest,
    the matter now stands thus - Bischdorff yields, according to the Landschaft assessment, annually 20462
    Rthl 12 s


    Mollna


    10 955 Rthl 18 s. The King''s yield is small - the [uncertain: Schauß] taken at only 12 - the 60000
    Rthl can therefore very well be conceded. So that makes 3000 Rthl more. Consequently annual revenue
    34414 Rthl. The interest amounts, to the Landschaft, at 4 1/4 per cent, 10264 Rthl.


    To the mortgage creditors


    3750. To Stössel, whose 100000 capital I still assume after all, 5000. For the capital of Mr. R. R.
    N. Weigel, 190000 Rthl, 9500.


    28514 Rthl, and accordingly there remains to you, dear friend, already a surplus of 5900 Rthl. With
    your interest, which after all derives from interest and God knows what, you have, dear old friend,
    now, when you are called [uncertain: hereditary] and judicial lord of the above-named lordships, an
    annual clear revenue of 16000 Rthl - and will you not, as a rich man, also make use of the ironworks?
    I wish you every good fortune in it, [uncertain: Siegen], and yet another 20 years of life, in which
    I shall often rejoice to have been the middleman who served you and the good Prince in a sound manner.
    With particular esteem etc.


    v. Triebenfeld


    overleaf the remainder'

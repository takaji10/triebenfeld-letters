- page: 5
  en: 'I see I fare better so. Now, Most gracious Lord, I beg you once more: only send 300 Rthl converted
    into Gold, so that I may be in a position here to go on negotiating. You may, Most gracious Prince,
    now indeed rely upon what I have said, for that upright great man Prince Hardenberg will not abandon
    you. The Chief Post Director Mann sends these letters. Let Your Serene Highness deign to address your
    letters, under his cover, to the Royal Prussian Chief Post Director Mr. Mann, Your Honour, in Vienna,
    for so I receive everything. Only, for God''s sake, money. A letter from the Princess of Hessen-Rotenburg
    follows herewith.'

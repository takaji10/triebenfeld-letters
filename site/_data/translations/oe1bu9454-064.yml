- page: 4
  en: 'Postscript on the 30th of October.


    Because Your Serene Highness''s letter of the 9th had run 11 days before I received it, I suppose
    the course of the post is to blame that I got no answer from Your Serene Highness to 5 letters - but
    now I hear from His Serene Highness the Prince Chancellor that Your Serene Highness has written to
    him - consequently I must believe that my exertions here are not being received with favour, and that
    Your Serene Highness does not care to think me worthy of an answer - were this really the case, then
    deign, Most Serene Prince, at least to let me know it. As for the rest, so far as Your Serene Highness''s
    affair is concerned, the Prince State Chancellor takes it up with true earnestness - his words today
    were: I will help the old man. I mean that the King should pay the Lerian debt. The King guaranteed
    the debt and paid the interest until 1806. Moreover the Prince has indeed been [uncertain: cashiered]
    - the salary would have to be made over to him - [uncertain: Dräger] how much has the [uncertain:
    Forst] had this year in claim: 14000 Rthl, and that is just 112000 Rthl. Oh, splendid! he shall be
    helped.


    The King comes out of the affair as the best of men, and on the debt item some 300000 Rthl are gained.
    A pity that the Prince has let his military affairs lie so, and that he did not press for a formal
    judgement - the money, or the 112000 Rthl, will most certainly be given, and the settlement of 1811
    given up. Perhaps something great may yet be effected touching Your Serene Highness''s honour. Tomorrow,
    on All Saints'' Day, the Prince State Chancellor lays the matter before the King. Proud I shall be
    if my petition brings forth so many good effects. Here follows the last Pro Memoria, which I have
    obtained; it is a fatality that I have no Copy, for my hands are failing me from all the writing.
    I have resolved to avoid the antechambers and to treat everything in writing, and'

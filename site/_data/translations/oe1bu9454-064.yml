- page: 6
  en: 'Have mercy, Your Serene Highness, and only send money - 300 Rthl in Gold I must have if I am to
    go on working here, and if I am not to perish in shame and [uncertain: O''Pott]. It is already wretched
    enough when, among people whom I need daily, I must also go about like a beggar''s dog. Today I have
    moved out and lodge at 872 Große Schuller Straße, where I live on credit, for at the inns every foreigner
    here must pay everything at once - and my [uncertain: store] is still 57 gulden. If Your Serene Highness
    does not [uncertain: send] money quickly, everything collapses; without money no servant here gladly
    opens the door. Everything is too frightfully dear. For the sake of God''s mercy, Your Serene Highness,
    send money, [illegible]; already yesterday I endured the greatest [uncertain: proclamations] - would
    that I had not gone here this time. Like a beggar-boy I drive myself about here. Who will hear me
    and look upon me in such a figure?


    I sacrifice everything, wish the great scoundrel for Your Serene Highness, to save you at one stroke,
    the [uncertain: Händsche]; alone, and without the help of some friends, I cannot get on - but what
    is one to do with a [uncertain: Leuphalten].'

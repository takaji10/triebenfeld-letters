- page: 4
  en: 'Postscript on the 30th of October.


    Because Your Serene Highness''s letter of the 9th had been 11 days in transit before I received it,
    I [uncertain: supposed] the course of the post to be at fault that I received no answer from Your
    Serene Highness to 5 letters - but now I hear from His Serene Highness the Prince Chancellor that
    Your Serene Highness has written to him - consequently I must believe that my exertions here are not
    received with approval, and that Your Serene Highness will not deem me worthy of an answer — were
    this really the case, then be pleased, most [uncertain: Serene] Prince, at least to let me know it.
    — As for the rest, as concerns Your Serene Highness''s affair, the Prince State Chancellor takes it
    up with true earnestness - his words today were: I will help the old man. I mean that the King should
    pay the [uncertain: Lerische] debt. The King has guaranteed the debt and paid the interest up to 1806.
    Moreover the Prince has indeed been [uncertain: dismissed]; the salary ought to be given him — [uncertain:
    Dräger] how much has the [uncertain: forest] year had, the [uncertain: share]: 14000 Rthl, and that
    is just 112000 Rthl. O fine! he shall be helped.


    The King comes out of the affair the best of men, and on the debt item some 300000 Rthl are after
    all gained. A pity that the Prince has let his military affairs lie so, and that he did not press
    for a judgement — the money, or the 112000 Rthl, will most certainly be given, and the settlement
    of 1811 abandoned. Perhaps, too, something great will yet be brought about touching Your Serene Highness''s
    honour. Tomorrow, on All Saints'' Day, the Prince State Chancellor lays the matter before the King.
    Proud shall I be if my submission produces so many good effects. Here follows the latest Pro Memoria,
    which I have [uncertain: achieved] - it is a misfortune that I have no copy, for my hands [uncertain:
    fail] me from all the writing. I have resolved to avoid the antechambers and to treat everything in
    writing, and'

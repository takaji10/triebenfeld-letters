- page: 3
  en: 'The estates of Mr von Knobelsdorff are, according to the valuations under letter A, assessed at
    976365 rt; but these assessments can never be taken as the norm, rather the Landschaft''s, under B,
    must hold for me. According to these the value is given as = 630279 rt. Since, however, the valuation
    under A is far too high and the assessment under B likewise too low, Mr von Knobelsdorff demands =
    700000 Rthl; I believe this demand can be accepted without risk. If now the value for the Knobelsdorff
    estates is actually taken at 700000 rt, and there still attach to the same the wife''s fortune, 390000
    rt of debt, there remains clear capital = 310000 t. Mr Weigelt''s claim against you, however, amounts
    to 190000 rt; the Stössel one = 180000 Rthl


    makes = 370000 rt


    Consequently more = 60000 rt.


    These 60000 rt Mr von Knobelsdorff must still cancel out of his lady''s fortune, so that the said
    items of 370000 rt may be wholly quitted to the Prince. His Serene Highness the Prince gives in return
    the Zagórów estates in Poland; these have a value of = 550000 rt


    Debts attach upon them in full = 200000 rt


    upon Swięcia for [uncertain: Haugt] = 18000 rt


    = 218000 rt


    there remains clear capital = 332000 rt.


    To this comes the canon of Witów with 500 rt, makes = 10000 rt. Of arrears such as will be outstanding
    in the estates, assigned in cash = 28000 rt. The aforesaid 370000 rt are [such]; the old debts attaching
    to the estates are mortgage bonds = 255000 Rthl; mortgage debts, such that after the 60000 rt there
    remain = 75000 rt. Against these estates worth 700000 rt, Mr Weigelt would then have 190000 rt; that
    amounts together, the purchase [uncertain: Praeteren] in = 700000 rt; and Mr von Stössel = 180000
    rt


    which together amounts to = 370000 rt, for which the Prince is to be given a receipt, and the debts
    on Koszęcin and wherever else they stand registered must be cancelled or ceded back to the Prince.


    For the rest, it remains Mr Weigelt''s business now to negotiate soon with Mr von Stössel and to buy
    the 180000 rt off him before the purchase becomes public.


    v. Triebenfeld'

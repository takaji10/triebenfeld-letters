status: draft
segments:
- page: 1
  en: 'This very moment I receive from Friend F in Berlin the news that the Queen died at Strelitz on
    the 19th, early, at 9 o''clock; also that the King is very ill, and that the most mournful consequences
    are feared. Although I would offer to send these matters to Exp. with all recommended haste, Your
    Serene Highness will no doubt have the news sooner. The Collorina affair is now a non-thing; now,
    gracious Lord, you must only see to it that you receive your 100000 Rthl. Have you already got the
    papers back through Köckritz - write me that with the greatest haste, for I am going to Berlin soon.
    I shall only try to raise the travelling money and hasten thither. Friend F. is pursuing his own days.
    The visit from Pastor Willhelm you perhaps do not reckon high enough in the valuation; it will probably
    bring you something in turn, that is to say, the cases must come on in the order of their consequences
    - previously the opposite was the case - the certain answer you will now receive, most gracious Lord,
    on the other side - but God grant it only after some 35 years. I must, if only I can raise the travelling
    money, absolutely hasten to Berlin. I am being frightfully harried over the interest on account of
    the Invalids'' capital. I could go mad - the clumsy wretch means to sequestrate my estates and leave
    [uncertain: Leibhartin] - you see, I endure all this for your sake - if only one of the Ver: friends
    could help.


    Had I money - had I at least horses - then I would fly from one place to another, but the accursed
    postal charges tax the purse too much, and I am still too much in arrears.


    Ever, however,


    Your Serene Highness''s most faithful servant,


    v. Triebenfeld, 6 Xbr 1809'

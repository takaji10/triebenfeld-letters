- page: 5
  en: 'I see I fare better. Now, most gracious Lord, I beg you once again: only send 300 Rthl converted
    into Gold, so that I may be in a position here to go on negotiating. You may now, most gracious Prince,
    [uncertain: directly] rely on what I have said, for that upright great man Prince Hardenberg does
    not abandon you. [uncertain: People] - the Chief Post Director Mann sends these letters. May Your
    Serene Highness be pleased to address your letters, [uncertain: his enclosure], to the Royal Prussian
    Chief Post Director Mr. Mann, Your Honour, in Vienna; then I receive everything. Only, for God''s
    sake, money. A letter from the Princess of Hesse-Rotenburg follows herewith.'

- page: 3
  en: 'The estates of Mr. von Knobelu are, according to the valuations under letter A, assessed at 976865
    Rthl; but these assessments can never be taken as the standard, rather the Landschaft ones under B
    must hold good for me. According to these the value is given as 630279 Rthl. Since, however, the Lubell
    valuation is far too high and the assessment under B also too low, Mr. von Knobelsdorff demands 70000
    Rthl; I believe that this demand can be accepted without [uncertain: Pusico]. If now the value for
    the Knobelsdorff estates is really taken at 700000 Rthl, and there still burden the same the wife''s
    property and 39000 Rthl of debts, then there remains clear capital 310000 Rthl. But Mr. Weigel''s
    claim against you amounts, by consideration, to 190000 Rthl, the Stössel one 180000 Rthl, 370000 Rthl.
    Consequently more:


    60000 Rthl. These 60000 Rthl Mr. von Knobelsdorff must still discharge out of his lady''s property,
    so that the [uncertain: Beken] items of 370000 Rthl can be fully receipted to the Prince - His Serene
    Highness the Prince gives for this the Zagorowo estates in Poland; these have a value of 550000 Rthl.
    Debts burden them in full - 20000 f. on [uncertain: Surzira] for the principal 18000


    218000 Rthl. There remains clear capital 332000 Rthl. To this comes the canon of Witów with 500 M.,
    making 10000 Rthl. Of arrears outstanding in the estates, assigned in cash 28000 Rthl.


    Are the aforenamed


    370000. The old debts burdening the estates are mortgage bonds 255000 Rthl; mortgage debts, so that
    after the 60000 Rthl there remain 75000 Rthl; that amounts together to the purchase [uncertain: Preetinen]
    at 700000 Rthl. Against these estates worth 700000 Rthl, Mr. von Weigel would then have 190000 Rthl
    and Mr. von Stössel


    180000, which together amounts to 370000 Rthl, for which the Prince is to be receipted, and the debts
    must be struck out in the church registers and wherever else they stand entered, or ceded back to
    the Prince. For the rest, it remains Mr. Weigel''s business now to negotiate soon with Mr. von Stössel
    and to buy the 180000 Rthl off him before the purchase becomes public.


    v. Triebenfeld'

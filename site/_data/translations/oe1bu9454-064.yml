- page: 3
  en: 'The estates of Mr. von Knobelu are, according to the valuations under letter A, assessed at first
    at 976865 Rthl; these assessments can, however, never be taken as the standard, but rather the Landschaft
    ones under B must hold good for me. According to these the value is given as 630279 Rthl. Since, however,
    the valuation [uncertain: Lubell] is far too high and the assessment under B also too low, Mr. von
    Knobelsdorff demands 70000 Rthl; I believe that this demand can be accepted without [uncertain: Pusico].
    If then the value for the Knobelsdorff estates is actually taken at 700000 Rthl, and there still attach
    to the same the wife''s property of 39000 Rthl in debts, there remains clear capital 310000 Rthl.
    But the claim of Mr. Weigel upon you amounts, considered, to 190000 Rthl; the Stössel one 180000 Rthl;
    370000 Rthl. Consequently more


    60000 Rthl. These 60000 Rthl Mr. von Knobelsdorff must still discharge out of his wife''s property,
    so that the [uncertain: Beken] items of 370000 Rthl can be fully receipted to the Prince. His Serene
    Highness the Prince gives for this the Zagorowo estates in Poland; these have a value of 550000 Rthl.
    Debts attach fully thereto — 20000 f on [uncertain: Surzira] for principal 18000


    218000 Rthl; there remains clear capital 332000 Rthl. To this comes the canon of Witów at 500 M, making
    10000 Rthl. On arrears which will be outstanding in the estates, assigned in cash, 28000 Rthl.


    Are the aforenamed


    370000. The old debts attaching to the estates are: mortgage bonds 255000 Rthl; mortgage debts, so
    that after the 60000 Rthl there remain 75000 Rthl. That amounts together to the purchase [uncertain:
    Praetinen] at 700000 Rthl. Against these estates worth 700000 Rthl, Mr. von Weigel would then have
    190000 Rthl and Mr. von Stössel


    180000, which together amounts to 370000 Rthl, for which the Prince is to be receipted, and the debts
    on [uncertain: Kirchen tin] and wherever else they stand entered must be cancelled or ceded back to
    the Prince. For the rest, it remains Mr. Weigel''s business to negotiate soon now with Mr. von Stössel
    and to buy the 180000 Rthl off him before the purchase becomes public.


    v Triebenfeld'

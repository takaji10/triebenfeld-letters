- page: 3
  en: 'The estates of Mr von Knobelsdorff are, according to the valuations under letter A, assessed at
    976,365 Rthl; but these assessments can never be taken as the norm, rather the Landschaft''s, under
    B, must hold for me. According to these the value is given as = 630,279 Rthl. Since, however, the
    valuation under A is far too high and the assessment under B likewise too low, Mr von Knobelsdorff
    demands = 700,000 Rthl; I believe this demand can be accepted without risk. If now the value for the
    Knobelsdorff estates is actually taken at 700,000 Rthl, and there still attach to the same the wife''s
    fortune, 390,000 Rthl of debt, there remains clear capital = 310,000 t. Mr Weigelt''s claim against
    you, however, amounts to 190,000 Rthl; the Stössel one = 180,000 Rthl


    makes = 370,000 Rthl


    Consequently more = 60,000 Rthl.


    These 60,000 Rthl Mr von Knobelsdorff must still cancel out of his lady''s fortune, so that the said
    items of 370,000 Rthl may be wholly quitted to the Prince. His Serene Highness the Prince gives in
    return the Zagórów estates in Poland; these have a value of = 550,000 Rthl


    Debts attach upon them in full = 200,000 Rthl


    upon Swięcia for [uncertain: Haugt] = 18,000 Rthl


    = 218,000 Rthl


    there remains clear capital = 332,000 Rthl.


    To this comes the canon of Witów with 500 Rthl, makes = 10,000 Rthl. Of arrears such as will be outstanding
    in the estates, assigned in cash = 28,000 Rthl. The aforesaid 370,000 Rthl are [such]; the old debts
    attaching to the estates are mortgage bonds = 255,000 Rthl; mortgage debts, such that after the 60,000
    Rthl there remain = 75,000 Rthl. Against these estates worth 700,000 Rthl, Mr Weigelt would then have
    190,000 Rthl; that amounts together, the purchase [uncertain: Praeteren] in = 700,000 Rthl; and Mr
    von Stössel = 180,000 Rthl


    which together amounts to = 370,000 Rthl, for which the Prince is to be given a receipt, and the debts
    on Koszęcin and wherever else they stand registered must be cancelled or ceded back to the Prince.


    For the rest, it remains Mr Weigelt''s business now to negotiate soon with Mr von Stössel and to buy
    the 180,000 Rthl off him before the purchase becomes public.


    v. Triebenfeld'

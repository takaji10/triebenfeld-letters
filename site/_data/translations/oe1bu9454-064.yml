segments:
- page: 1
  en: 'This very moment I receive from friend F in Berlin the news that the Queen died at Strelitz on
    the 19th, early, at 9 o''clock; also that the King is very ill, and that the most sorrowful consequences
    of all are feared. Although I [uncertain: offered] to send these matters to Exp and commend all haste,
    Your Serene Highness will nevertheless surely have the news sooner. The Collorina affair is now a
    nullity; now, gracious Lord, you need only take care that you receive your 100000 Rthl. Have you already
    got the papers back through Köckritz - write me that most urgently, for I am going soon to Berlin.
    I shall merely try to raise the travelling money and hasten thither. Friend F is investigating on
    his own [uncertain: days]. The visit of Prince Willhelm you perhaps do not reckon high enough in the
    valuation; [uncertain: something] will presumably [uncertain: show] you, that is to say, the cases
    must occur one after another in their sequence - previously the contrary was the case - the certain
    answer you will now receive, most gracious Lord, in the next world - but God grant only some 35 years
    hence. I must, if only I can raise the travelling money, absolutely hasten to Berlin. I am being frightfully
    harried over the interest on the Invalids'' capital. I could turn [uncertain: Roßem] - the coarse
    fellow means to sequester my estates and [illegible] - see, I suffer all this for your sake - if only
    one of the [text lost] friends could help.


    Had I money - had I at least horses, I would fly from one place to another, but the accursed post-moneys
    press the purse too hard, and I am still too far behind.


    Ever, however,


    Your Serene Highness''s most faithful servant


    v. Triebenfeld, 6 Xbr 1809'

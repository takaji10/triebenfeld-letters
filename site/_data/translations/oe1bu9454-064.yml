- page: 4
  en: 'Postscript, the 30th of October.


    Because Your Serene Highness''s letter of the 9th had run 11 days before I received it, I [text lost]
    that the running of the post was at fault, that I received no answer from Your Serene Highness to
    [text lost] 5 letters. Now, however, I hear from His Serene Highness the Prince Chancellor that [text
    lost] Serene Highness has written to him; consequently I must believe that my [text lost] exertions
    here are not favourably received, and that Your Serene Highness will not [text lost] deem worth an
    answer. Were this really the case, then deign, most [text lost]est Prince, at least to let me know
    it. As for the rest, so far as Your Serene Highness''s cause is concerned, the Prince Chancellor of
    State takes it up with true earnestness. His words today were: I will help the old man. I mean [garbled]
    pay the [Lerische] debt. The King has guaranteed the debt and paid the interest up to 1806. Also the
    Prince is indeed [illegible] cashiered — the salary ought to be his. Were one to ask, how much has
    the [uncertain: Forst] had this year, the amount had 14000 Rthl and it is just 112000 rt. Oh fine!
    he shall be helped.


    The King comes out of the affair one of the best of men, and on the debt item some 300000 rt are gained.
    A pity that the Prince has let his military affairs lie so, and that he has not pressed for a judgment.
    The money, or the 112000 rt, will most certainly be given, and the settlement-parties of 1811 given
    up. Perhaps something great besides will be brought about touching Your Serene Highness''s honour.
    Tomorrow, on All Saints'' Day, the Prince Chancellor of State lays the matter before the King. Proud
    shall I be if my submission produces so many good effects. Here follows the latest Pro Memoria, which
    I have [uncertain: obtained]. It is a fatality that I have no copy, for my hands are failing me from
    all the writing. I have resolved to avoid the antechambers and to treat everything in writing, and'

- page: 1
  en: '64 This very moment I receive from friend F. in Berlin the news that the Queen died at Strelitz
    on the 19th, early, at 9 o''clock; also that the King is very ill, and that the most grievous consequences
    are feared. Although I offered to send these matters to Exp. [and] recommend all haste, Your Serene
    Highness will nevertheless probably have the news sooner. The Colonna matter is now a nullity; now,
    gracious Lord, you must only see to it that you obtain your 100,000 Rthl. Have you the papers back
    already through Köckritz? Write me of that with the utmost haste, for I am going to Berlin soon. I
    shall only try to raise the travelling money and then hasten thither. Friend seeks out his own days
    [unparseable]. The visit from Prince Wilhelm of Prussia you can perhaps not rate high enough in the
    reckoning, [it] will probably bring you in turn [unparseable], that is to say, the cases must occur
    in the order of their consequences; before, the opposite was the case. The certain answer, most gracious
    Lord, you will now receive on the other side; but God grant only some 35 years hence. I must, if only
    I can raise the travelling money, absolutely hasten to Berlin. I am being frightfully harried over
    the interest on account of the Invalids'' capital. [uncertain reading: Roßem] I should like to become;
    the clumsy oaf wants to have my estates sequestrated and put up for forced sale. See, I suffer all
    this for your sake. If only one of the [abbrev.] friends could help.


    Had I money — had I at least horses — I should fly from one place to another, but the accursed post-money
    taxes the purse too heavily, and I am still too far behind. Yet ever


    Your Serene Highness''s


    6 December 1809


    most faithful servant


    v. Triebenfeld'

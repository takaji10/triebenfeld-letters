- page: 6
  en: 'Have mercy, Your Serene Highness, and only send money. 300 Rthl in gold I must have if I am to
    work on here, and if I am not to go under in shame and derision. It is already shabby when, among
    people whom I need daily, I must also drive about like a beggar''s cur. Today I have moved out and
    live at Große Schuller Straße 872, where I live on credit, for in the inns every foreigner here must
    pay everything at once — and my possessions are still 57 gulden. If Your Serene Highness does not
    send money speedily, then everything collapses; without money no servant here gladly opens the door.
    Everything is too dreadfully dear. For God''s mercy''s sake, Your Serene Highness, send money, etc.;
    already yesterday I endured the greatest prostitutions. Would that I had not gone here this time.
    Like a beggar boy I drive myself about here. Who will hear me and look upon me in this guise?


    I sacrifice everything, wish the great villain for Your Serene Highness, to save you at one stroke,
    the [uncertain: Händsche]; but alone, and without the help of some friends, I make no progress — yet
    what is to be done with a single [uncertain: Leup]?'

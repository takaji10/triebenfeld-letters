- page: 2
  en: 'Copy


    Dear honest friend, herewith I convey to you the valuations, and a copy of the Landschaft assessment
    of the Biskupice and Molna estates. The latter are, as the figure shows me, sound, so that anyone
    must find the demand of Mr von Knobelsdorff fair. The debts intabulated upon the estates consist of
    mortgage bonds and small mortgages. Together they amount to 330,000 Rthl, and since only 75,000 Rthl
    are callable after the expiry of the moratorium, they can, with your means, my upright friend, [not]
    become burdensome to you. Everything depends on how you are able to handle Mr von Stössel. He is hard
    pressed and, as I know, is offering his papers at 50 per cent; I believe you should buy the whole
    180,000 Rthl from him for 90/m Rthl, whereby he must still concede sound terms of payment. To draw
    this gentleman in is no sin, for he treated the good Prince, both of them, abominably in the Koszęcin
    transaction. Meanwhile I leave that to your wisdom.


    For the rest, the matter now stands thus: Biskupice yields, according to the Landschaft assessment,
    annually 20,462 Rthl 12 Groschen; Molna 10,951 Rthl 18 Groschen. The royal yield is slight; the [uncertain:
    Schauß] taken at only 12; hence the 60,000 Rthl can very properly be pledged, which makes a further
    3,000 Rthl. Consequently annual revenue 34,414 Rthl.


    The interest amounts, to the Landschaft, at 4 1/4 per cent = 10,264 Rthl; to the mortgage creditors
    = 3,750 Rthl; to Stössel, whose 100,000 capital I still assume after all = 5,000 Rthl; for Mr Weigelt''s,
    Councillor [C. R. R. N.], capital of 190,000 Rthl = 9,500 Rthl; = 28,514 Rthl; and accordingly there
    already remains to you, dear friend, a surplus of 5,900 Rthl. With your interest, which after all
    derives from interest upon interest and God knows what, you have, dear old friend, when you are called
    hereditary lord and lord of the court of the above-named lordships, an annual clear revenue of 16,000
    Rthl — and what will you, as a rich man, not further make of the ironworks?


    I wish you all good fortune and success therein, and another twenty years of life besides, in which
    I shall often rejoice to have been the intermediary who served you and the good Prince in a sound
    manner. With particular respect, etc.


    v. Triebenfeld


    overleaf, the remainder'

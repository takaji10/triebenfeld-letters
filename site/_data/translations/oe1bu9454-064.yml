- page: 2
  en: 'Copy. Dear upright friend, Enclosed I convey to you the valuations, and a copy of the Landschaft
    assessment of the Biocdorff and Molna estates. The latter are, as the figure shows me, sound, so that
    anyone must find the demand of Mr. von Knobelsdorff fair. The debts intabulated upon the estates consist
    in mortgage bonds and small mortgages. They amount together to 330000 Rthl, and, since only 75000
    Rthl are callable after the expiry of the moratorium, they cannot become burdensome to you, my honest
    friend, given your means. Everything depends on how you are able to handle Mr. von Stössel. He is
    in straits and is offering his papers, as I know, at 50 per cent; I believe you might buy the whole
    180000 Rthl from him for 90 Rthl, whereby he must moreover concede sound terms of payment. To press
    this gentleman is no sin, for he has used the good [uncertain: two] Princes dreadfully in the [illegible]
    dealings with me. Meanwhile I leave that to your wisdom. For the rest, the matter now stands thus:
    Bischdorff yields, according to the Landschaft assessment, annually 20462 Rthl 12 s


    Mollna


    10 955 Rthl 18 s. The [uncertain: King''s] yield is small - the [uncertain: Schauß] taken at only
    12 - therefore the 60000 Rthl can very properly be conceded. So it did more: 3000 Rthl. Consequently
    annual revenue 34414 Rthl. The interest amounts, to the Landschaft, at 4 1/4 per cent, to 10264 Rthl.


    To the mortgage creditors


    3750. To Stössel, for whom I still allow 100000 capital: 5000. For the capital of Mr. R. R. N. Weigel,
    190000 Rthl: 9500


    28514 Rthl, and after this there remains to you, dear friend, already a surplus of 5900 Rthl. With
    your interest, which after all derives from interest and God knows what, you have, dear old friend,
    now that you are called proprietor and lord of jurisdiction of the above-named lordships, a clear
    annual revenue of 16000 Rthl - and what will you, as a rich man, not further make of the ironworks?
    I wish you every good fortune therein, [uncertain: Siegen], and yet another twenty years of life,
    in which I shall often rejoice to have been the intermediary who served you and the good Prince in
    so sound a fashion. With especial esteem etc.


    v Triebenfeld


    overleaf, the rest'

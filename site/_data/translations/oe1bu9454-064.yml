- page: 2
  en: 'Copy


    Dear honest friend, herewith I convey to you the valuations, and a copy of the Landschaft assessment
    of the Biskupice and Molna estates. The latter are, as the figure shows me, sound, so that anyone
    must find the demand of Mr von Knobelsdorff fair. The debts intabulated upon the estates consist of
    mortgage bonds and small mortgages. Together they amount to 330000 rt, and since only 75000 rt are
    callable after the expiry of the moratorium, they can, with your means, my upright friend, [not] become
    burdensome to you. Everything depends on how you are able to handle Mr von Stössel. He is hard pressed
    and, as I know, is offering his papers at 50 per cent; I believe you should buy the whole 180000 rt
    from him for 90/m rt, whereby he must still concede sound terms of payment. To draw this gentleman
    in is no sin, for he treated the good Prince, both of them, abominably in the Koszęcin transaction.
    Meanwhile I leave that to your wisdom.


    For the rest, the matter now stands thus: Biskupice yields, according to the Landschaft assessment,
    annually 20462 rt 12 gg; Molna 10951 rt 18 gg. The royal yield is slight; the [uncertain: Schauß]
    taken at only 12; hence the 60000 rt can very properly be pledged, which makes a further 3000 rt.
    Consequently annual revenue 34414 rt.


    The interest amounts, to the Landschaft, at 4 1/4 per cent = 10264 rt; to the mortgage creditors =
    3750 rt; to Stössel, whose 100000 capital I still assume after all = 5000 rt; for Mr Weigelt''s, Councillor
    [C. R. R. N.], capital of 190000 rt = 9500 rt; = 28514 rt; and accordingly there already remains to
    you, dear friend, a surplus of 5900 rt. With your interest, which after all derives from interest
    upon interest and God knows what, you have, dear old friend, when you are called hereditary lord and
    lord of the court of the above-named lordships, an annual clear revenue of 16000 rt — and what will
    you, as a rich man, not further make of the ironworks?


    I wish you all good fortune and success therein, and another twenty years of life besides, in which
    I shall often rejoice to have been the intermediary who served you and the good Prince in a sound
    manner. With particular respect, etc.


    v. Triebenfeld


    overleaf, the remainder'

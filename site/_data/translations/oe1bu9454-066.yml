- page: 2
  en: 'three [uncertain: roe] bucks shot here, of which Honrichs is to take one along for the Chief Prefect
    Garczynski, one for the President of the High Tribunal Zakrzewski, and one for the sub-prefect Brzechffa;
    that, I think, will work more than money, for the fellows have everything in their hands and still
    cut their pipes as they please — If things go as wished, then Honrichs gets the treasury back at New
    Year, the administration will be wholly lifted, and then we shall receive much money — One has now
    full power there over the subjects, and therefore this class of people all wish the Prussian government
    back, but meanwhile one can [uncertain: pain] them — So much for the Polish affairs — Whether the
    King will really come to Berlin is still doubted by many; if he really does come, then he will go
    to Paris too — for only a couple of days ago somebody wrote to me: if it goes back to Berlin, then
    it goes to Paris as well, for where should Louise find the strength to refuse the invitation, not
    to see the place where the finest fashions in the world beckon — In the meantime I believe nothing
    at all of the promises that are said to have been made to our good King. They will no doubt leave
    us lying in the [uncertain: Seat], and our wretched'

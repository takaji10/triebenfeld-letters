- page: 1
  en: 'The judgement will now, so I am told, come out to the effect that the false denouncers are to be
    sentenced to six years'' fortress imprisonment, while the agitators are to be [uncertain: flogged
    out] and banished from the country.


    As regards Heiler I shall nevertheless do everything possible for his father''s sake, who is Upper
    Consistorial Councillor in Berlin; but Honrichs is advancing a claim against him which exceeds his
    paper security threefold, and he is also being held answerable on Your Serene Highness''s side, for
    it was through him that the administration was brought in. If otherwise the colonists and old peasants
    there come begging on account of a remission of the interest for the future (for at present nobody
    pays anything, because Honrichs is not permitted to take anything, but neither does he allow anyone
    else to take anything par force), then one must not listen to it. If the fellows have nothing, then
    nothing can be taken from them for the time being. In the case of a sale, however, one has the advantage
    that all arrears can nevertheless be reckoned in. And a prefect in Poland has extensive power — if
    Briechfa buys, he would certainly torment the poor creatures — he can spare them again with respect
    to public taxes and burdens; consequently Your Most Serene Highness need pay no heed for the present
    to the [uncertain: trivialities], and should concede nothing to the fellows, for they pay nothing
    anyway. I am having


    nothing, and have long given nothing.'

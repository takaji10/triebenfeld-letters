- page: 3
  en: '[uncertain: Executent] overlooked as a mere point on the map of Europe, as at Tilsit and Schönbrunn.
    — It was said a few days ago that we should get Hanover back, a piece of Hesse, Brunswick, Magdeburg
    and the Halberstadt territory; but this requires a greater faith than that which Frederick the Only
    ascribed to the prelate of Scharnewand when he was to move the hill near Cont for him.


    Here people will absolutely have it that Napoleon suffers from dropsy of the chest and that his safe-conduct
    lies already on the little table at Pluto''s for signature. Were that so, then something might still
    be hoped for, especially if with us there were no more organising but action with energy. Something
    must indeed be afoot: the Poles were to be on the march back, to move on the 11th into their winter
    quarters and their garrisons; they were already as far as [uncertain: konen] Kalisz and those parts
    — but on the 8th a counter-order came that they must go back at once as far as Galicia, because the
    Russians were occupying Galicia and pressing back the Poles standing there. Honrichs says that since
    then everything is full, the [uncertain: Müßen] can, in order to appropriate the province of Warsaw
    to themselves. — As soon as I am finished here I shall come at once to Schlawenschitz, and then I
    shall stay there a long while. — I mean to lease everything out, if only [uncertain: Coste] holds
    and I first have a free hand again.


    That Princess Emilie may be right happy I wish from the bottom of my heart. — She is the crown of
    the female sex, if indeed what I am to see. Begging the continuance of your most high goodwill, I
    remain, until death, in deepest reverence, Your Most Serene Highness''s


    Kontop, the 16th of December


    most faithful servant


    There lie here, in v. Triebenfeld'

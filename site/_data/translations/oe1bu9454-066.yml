- page: 3
  en: '[uncertain: existence] overlooked as a point on the map of Europe, as at Tilsit and Schönbrunn
    — A couple of days ago it was said that we should get Hanover back, a piece of Hesse, Brunswick, Magdeburg
    and the Halberstadt territory. But for this a greater faith is required than that which Frederick
    the Only ascribed to the prelate of Scharnewand when he was to have the mountain near Cont cleared
    away for him.


    Here they will absolutely have it that Napoleon is suffering from dropsy of the chest and that his
    travel passport already lies with Pluto for signature on the [uncertain: Tischlinge]. Were that so,
    then something might yet be hoped for, especially if among us people no longer merely organised but
    acted with energy. Something must after all be afoot: the Poles were to be on the march back, to move
    into winter quarters and their garrisons on the 11th, they were already as far as below Konin, Kalisz
    and those parts — but on the 8th came a counter-order that they must go back at that instant as far
    as Galicia, because the Russians were occupying Galicia and pressing back the Poles stationed there.
    Honrichs says that since then everything is full; the [uncertain: Müßen] can, in order to appropriate
    the province of Warsaw to themselves — As soon as I have finished here I shall come at once to Sławięcice,
    and then I shall stay there a long while — I will lease out everything, provided only Coste [illegible]
    and I first have a free hand again.


    That Princess Emilie may be right happy I wish from the bottom of my heart — She is the crown of the
    female sex, if there is anything I have seen. I beg for the continuance of Your Highness''s most gracious
    goodwill and remain, until death, in deepest respect,


    Your Most Serene Highness''s


    There lie here at


    Konotop, the 16th of December


    1809.


    most faithful servant


    v Triebenfeld'

- page: 4
  en: 'Neuholz some 70 hundredweight of iron still under arrest, which the skippers Kulany and Neumann
    have had seized at Neusalz for freight charges. Kielung and Neumann have so far received only 173
    Rthl 6 s. g. in coin from the syndic Horne at Appeln. — The hundredweight is contracted as far as
    Stogadel at 10 g. in coin, which makes for 1000 hundredweight 416 Rthl 16 g. in coin; the men therefore
    have still to receive in freight charges 243 Rthl 14 s. in coin, together with any costs at Stralsund,
    which however they have incurred wrongfully, for Kulawn and Neumann [uncertain: pledged] the iron
    again to Schuster of Mensal, by name Macholy, Christ Liebs Vogel, and these are holding back the iron
    because they have not received their freight. Your Serene Highness promised to have the freight charges
    settled; be therefore so gracious as to send the receipts with all speed, that the skippers Kulawy
    and Neumann are entirely satisfied as regards the freight charges, for then I shall get the 74 hundredweight
    of iron back and can help myself with it. — Money is too scarce — I must weekly lay out postage, messengers''
    wages, advances for lawsuits, in Your Serene Highness''s affairs, and am myself in want. There one
    gets nothing of it, because everything is still under arrest. — I may leave nothing lying idle, and
    so I find means where I can. — The arrangements in Poland are now mad: for a lawsuit, for a power
    of attorney where the matter comes to 1000 Rthl, a stamped sheet of 10 Rthl must be taken; and likewise
    the advances must be paid in equal measure to the so-called [uncertain: Burggreßen]. The Trąbczyn
    suit, the Niedzwiedzki one, the Octaviowshi one etc. will still cost frightful money; the two latter
    already cost some 320 Rthl now. For the Trąbczyn one the heart merely trembles — but it must be done
    in order to save the estates. — The woman sits in Warsaw and whores; perhaps one may outflank the
    [uncertain: Curence] and rapid snow comes [illegible]. Do send the receipts, so that I may get the
    iron afloat and the costs fixed, from'

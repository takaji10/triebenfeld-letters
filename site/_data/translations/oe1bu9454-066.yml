- page: 5
  en: 'Should it not be possible that Your Most Serene Highness could have 2000 Centner of rail iron delivered
    here soon? For it 8000 rt in hard Courant would be paid at once.


    The general contractor Coste would remit the monies immediately. I should think that if you gave instruction
    for the iron from the Wrocław depot to be delivered here, and had as much brought from there to Wrocław
    again, then, if we still had 14 days of good weather, the thing could be settled — I expect Coste
    at any hour; he is to give an instruction to pay, which I will send off at once by express courier
    — If it is accepted, good — if not, then the instruction comes back — Coste in return for it cheap
    grain out of Poland


    16 Dec. 1809 v Triebenfeld'

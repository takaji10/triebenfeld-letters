- page: 2
  en: 'here have three roebucks shot, of which Honrichs is to take one along to the chief prefect Parczyneli,
    one for the president of the high tribunal Zahrzewshe, and one for the [uncertain: sind] prefect Arsechsa;
    that, I think, will have more effect than money, for the fellows have everything in their hands and
    cut their pipes at their own pleasure. If it goes as wished, then Honrichs gets the lease back at
    New Year, the administration will be wholly lifted, and then we shall receive much money. — One now
    has there complete power over the subjects, which is why this class of men all wish the Prussian government
    back; but in the meantime one can [uncertain: grieve] them. So much for the Polish affairs. Whether
    the King will really come to Berlin is still doubted by many; if he really comes, then he will also
    go to Paris — for someone wrote to me only a few days ago: if it goes back to Berlin, then it goes
    to Paris as well, for where should Louise find the strength to refuse the invitation and not see the
    place where the finest fashions in the world beckon. — Meanwhile I believe nothing at all of the promises
    which are said to have been made to our good King. They will probably leave us lying in the skat,
    and our wretched'

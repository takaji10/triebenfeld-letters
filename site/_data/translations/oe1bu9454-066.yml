- page: 5
  en: 'Might it not be possible for Your Most Serene Highness to have 2000 hundredweight of bar iron delivered
    here soon? For it 8000 Rthl would be paid at once in ringing Courant. The general contractor Cente
    would order the moneys paid out immediately. I should think that if you directed the iron from the
    Breslau depot to be delivered hither, and had as much again brought from there to Breslau, that might
    be settled, if we still had a fortnight of good weather. — I expect Corten at any hour; he is to give
    an instruction, which I mean to send off at once by express courier. — If it is accepted, well and
    good; if not, then the instruction comes back. Coste in return brings cheap grain out of Poland. v.
    Triebenfeld


    16 Xbr. 1809'

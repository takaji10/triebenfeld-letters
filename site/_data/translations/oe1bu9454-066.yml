- page: 1
  en: '66 The verdict will now, as I am written, turn out thus: that the false denunciators are to be
    sentenced to 6 years'' fortress imprisonment — the instigators, however, [uncertain: flogged out]
    and banished from the country.


    As for Hecker I shall nevertheless do everything possible for his father''s sake, who is Senior Consistorial
    Councillor in Berlin, but Honrichs is making a claim against him which exceeds his paper caution 3
    times over; on Your Serene Highness''s side too he is being held to account, for it was through him
    that the administration was introduced. If for the rest the colonists and old peasants there should
    beg for a remission of the interest for the future — for at present Niemann pays anything, because
    Honrichs is not permitted to take anything but also will not let anyone else take anything par force
    — then one must not listen to it. If the fellows have nothing, then for the time being nothing can
    be taken from them; but upon a sale one has the advantage that all the arrears can nevertheless be
    reckoned in. And a prefect in Poland has an extensive power — if Brzechffa buys, he would torment
    the poor creatures soon enough — he can in turn spare them in respect of public dues and burdens —
    consequently Your Most Serene Highness need for the present pay no heed to the whimperings, and must
    concede the fellows nothing; they pay nothing in any case and have long given nothing. I am having'

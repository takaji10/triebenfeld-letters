- page: 4
  en: 'Neuholz still some 70-odd Centner of iron, under arrest, which the boatmen Kulawy and Neumann have
    had arrested at Nowa Sól for freight money. Kulawy and Neumann have as yet received only 173 rt 6
    gg. in coin from the syndic Horne at Opole — the Centner is contracted at 10 gg. coin as far as Bojadła,
    which makes for 1000 Centner 416 rt. 16 g. coin; the men therefore still have to receive in freight
    money — 243 rt. 14 sg. coin, and in addition the possible costs at Wrocław, which however they have
    incurred wrongfully, for Kulawy and Neumann [uncertain: freighted] the iron again by way of Schuster
    of [uncertain: Neasal], by the names of Macholy, Christ Liebs, Vogel — and these are holding the iron
    back because they have not received their freight. Your Serene Highness promised to have the freight
    money settled; be so gracious, then, as to send the receipts with all haste, so that the boatmen Kulawy
    and Neumann are entirely satisfied as to the freight money, for then I get the 74 Centner of iron
    back and can help myself with it — Money is [uncertain: scarce] — I must weekly lay out money for
    postage, messengers'' wages, advances in lawsuits, in Your Serene Highness''s affairs, and am myself
    in want. There one receives nothing in it, because everything is still under arrest — I may let nothing
    lie idle, and therefore I contrive counsel where possible — the arrangement in Poland is now mad —
    for a lawsuit, for the power of attorney, where the matter amounts to 1000 rt., a stamped sheet of
    10 rt. must be [uncertain: taken] — so too must the advances be paid straight away, in like measure,
    to the so-called [uncertain: burgraves]. The Trąbczyn lawsuit, the Niedźwiecki one, the Ostarszewski
    one, etc., will still cost frightful money; the two last alone now cost about 320 rt. For the Trąbczyn
    one the heart only [uncertain: trembles] — but it must be done in order to save the estates — the
    woman sits in Warsaw and whores; perhaps one outstrips the [uncertain: Curence] and swift snow comes
    to its goal. Do send the receipts, so that I can get the iron afloat and can determine the costs —'

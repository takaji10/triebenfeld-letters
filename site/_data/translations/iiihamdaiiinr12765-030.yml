segments:
- page: 1
  en: 'By the esteemed letter of a Royal and Most Laudable Ministry of Foreign Affairs of the 13th of
    this month, and its enclosures, I have been informed of the applications which the heirs of the late
    Prince of Hohenlohe-Ingelfingen, and Count von Bethusy, have made to the Imperial Russian Government
    through the intercession of Prince Eugen of Württemberg, and of the refusing answer of that Government
    which has followed thereupon. As to what was to Count von Bethusy the claim, derived from the treaty
    between Prussia and Russia of 21 April and 3 May 1815, to free traffic between his properties in Silesia
    and the Kingdom of Poland: I am entirely in agreement with a Royal Ministry that the same is, even
    according to the provisions of the said treaty, wholly inadmissible. I have accordingly made this
    known to Count von Bethusy, with reference to the 18th article of the same, and with the remark that,
    even if the Imperial Russian Government had granted his request, objection would nevertheless have
    been raised against it on the part of the Government on this side.


    I do not fail most respectfully to acquaint a Royal and Most Laudable Ministry of Foreign Affairs
    with this disposition. Berlin, the 19th of May 1820


    Schuckmann


    To


    a Royal and Most Laudable Ministry of


    Foreign Affairs


    [Written by the receiving office:]


    [text lost] Balan


    C. A. No. 3053. 13. received 28 May 1820.


    Ad acta


    Hoffm[ann] 30/5


    B[erlin]. 29/5 [18]20'

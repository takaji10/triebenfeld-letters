status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! My podagra hindered me the day before yesterday
    from getting as far as Neisse; in the night I was obliged, because the road-bed was bottomless, to
    bivouac under the open sky behind stones, and as it rained so frightfully I exposed my foot entirely
    to the eaves-drip — the pain grew gradually less, so that today I have already forced the boot on
    — the King was here 3 days and drove off just as I arrived here, [uncertain: taking wood?] so as to
    go in that region towards Topliz, where the Russian Emperor is with His sister; it is said K. Franz
    would also arrive there, but thinking men doubt it – so far as one knows here, and [it] is ill assured
    to the highest eodem, Austria does not accede – Everything is beginning to grow lukewarm, yet it promises
    to remain entirely neutral, wherefore also in the Austrian [uncertain: states] the signs of neutrality
    have everywhere been publicly posted and made known - the Combined Powers have been frightfully duped
    by the armistice - Bülow and Czerniczeff'
- page: 2
  en: 'would not acknowledge [it] at all; meanwhile they have had to submit, and [he] now stands in Berlin
    - the corps which went to Hannover, in order to disembark at Embden, will now likewise remain ineffective,
    or even be worn down entirely, for Napoleon has hurried to Paris; the good old, and in part shrewd,
    men prophesy nothing much good. From here everything is off and to its post; tomorrow the government
    also departs for Franckenstein - Merkel was here - and sets out thither early on some [day] – the
    post, or the courier route, was re-established 8 days ago already - I therefore send this letter by
    the post. Gen. Gneizenau is at headquarters, likewise R. Valentini - I must go today to Neustad to
    Gen. Ortel / for my plan has met with approval / and as soon as I return from there I go to Franckenstein
    etc. Minister Hardenberg seeks, in the opinion of all, much good. May Your Serene Highness deign to
    tell Frau v. Hahn that her [uncertain: letter] to Breslau has been seen to - likewise I have delivered
    the one to the Chief Forest Master v Kleist, who however was away travelling, to his [uncertain: blockaded]
    son - It is in deepest reverence that I remain, until death, Your Serene Highness''s Neisse 19 Juny
    1813 humble and obedient servant v Triebenfeld'

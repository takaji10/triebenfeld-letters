- page: 1
  en: 'Two letters, of the 19th and the 28th of January, I have received, and no more. Against that I
    have sent 7 pieces from here since the 13th — in all of them I have begged for help; in the one of
    the 19th Your Serene Highness gives hope, in the one of the 28th you say not a word about it. On what,
    most gracious Lord, do you suppose I am to live here amid this frightful dearness? I reckoned at the
    outset on 1400 Rthl for 4 weeks — as yet I have received no more than 932 Rthl, and that over 5 months.
    It is a hell and a torment that I am 170 th in debt to the Prince and to Barben; I am almost dying
    of shame — life in Tobolcki''s wastes is truly not so full of torment as mine is — I would gladly
    work with all my soul, but with wholly empty hands — O, it is an accursed life. Tomorrow B. means
    to drive with me to Minister Nesselrode and, for consolation, to the Privy [uncertain: hoffen] Councillor
    Schröder, so as to neglect nothing in the Polish matter, but rather to prepare every avenue. But I
    truly do not know where I am to get the 12 fl. to pay the hired coach — In short, if I do not receive
    help soon and you do not very, very quickly find a remedy, then everything goes to the devil; I can
    help myself no further, but must remove myself from here in secret, laden with disgrace and mockery.


    I have solicited much here on your behalf, and wished just now to bring it about that the Prince should
    visit you on his return journey, for he does not return by way of Dresden. — But I cannot decently
    show myself before him — My plan was then to give your military affairs the happiest turn and to bring
    this to the desired goal. But how am I to come forward when I cannot for shame raise my eyes — I beg
    you therefore once again, for God''s sake, send the 200 ff with all haste, that I may get out of debt
    — Now this besides — When you wish that as administrator in the name of the King he should administer
    the entailed estates, here you must go to work very cautiously — such a man should be capable of giving
    security. König has indeed much money, but that is a [illegible] — I advise you to take none of all
    your old people, and how easily might not one or the other'

- page: 2
  en: 'other be called to account together with Cosmar — for naturally it will be desired to know why
    no more was drawn out of the estates, and there [uncertain: Bäte] a valuation would then take place
    — after which one would then ask where the arrears have gone. The most advisable course is [that they]
    send a separate Pro Memoria here — and propose outright someone who is to administer the whole of
    the entailed estates for the Royal account — but this must be a man who is truly attached and devoted
    to [uncertain: 1 taus] you, most gracious Prince, so that the last fraud does not turn out worse than
    the first — for such a person can make you a heaven or a hell.


    2. And he must be capable of giving security, the securities to be given in cash money, not [uncertain:
    aprin] or in landed property —


    3) Thirdly, he must possess economic knowledge as well as have learning otherwise. Fourthly, he must
    not be wholly without knowledge of the ironworks trade — provided, however, that he is faithfully
    attached to Your Serene Highness, he will be able to be instructed in it by you; and what is more,
    he must go to work without brutality, be naturally shrewd, so that the old blood-leeches do not make
    an X out of a U for him — If you propose, particularly with these qualities, the Prince Chancellor
    will certainly approve. But I must have these matters here very quickly, for I hope within a few days
    to receive the resolution of the Prince, both as to the advance and as to the Polish estates, and
    then I shall not remain here a moment longer once I am in particular put in a position to pay off
    the debts — also because I confidently hope to induce the Prince to go somewhat by way of Schlawen.
    I should think you would send someone here with my horses, either riding or driving — in 4 days the
    man can be here, so that the money is received securely and the papers quickly — Take it to heart
    that your Pro Memoria must absolutely, even if the money should already be on its way, nevertheless
    very quickly and certainly be here in the aforementioned matter.'

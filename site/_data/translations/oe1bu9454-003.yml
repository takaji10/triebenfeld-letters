status: draft
segments:
- page: 1
  en: 'Two letters, of the 19th and the 28th of January, I have received — no more. Against that I have
    sent 7 pieces from here since the 13th — in all of them I have begged for help; in the one of the
    19th Your Serene Highness gives hope, in the one of the 28th you say not a word about it. On what,
    most gracious Lord, do you suppose I am to live here amid this frightful dearness? I reckoned at the
    outset 1400 Rthl for 4 weeks — as yet I have received no more than 932 Rthl, and that over 5 months.
    It is a hell, a torment, that I owe the Prince and Barbe 170 th; I am almost ashamed to death — life
    in Tobolcki''s deserts is truly not so full of torment as mine — I would gladly work with all my soul,
    but with wholly empty hands — O it is an accursed life. — Tomorrow B means to drive with me to Minister
    Nesselrode and to the [uncertain: comforting] Privy [illegible] Councillor Schröder, so as to neglect
    nothing in the Pohl affair, but rather to prepare every avenue. But I truly do not know where I am
    to get the 12 fl. to pay the hired coach — In short, if I do not soon receive help, and if you do
    not very, very quickly find counsel, then everything goes to the devil; I can help myself no further,
    but must remove myself from here in secret, laden with shame and mockery. I have solicited much here
    on your behalf, and wished besides to bring it about that the Prince should visit you on his return
    journey, for he does not return by way of Dresden. — But I cannot decently show myself before him
    — My plan was then to give your military affairs the most fortunate turn and to bring this to the
    desired end. But how am I to come forward when I cannot for shame raise my eyes — I therefore beg
    you once more, for God''s sake, send the 200 ff with all haste, that I may come out of debt. — Now
    this further point. — When you wish that, as administrator in the King''s name, the entailed estates
    should be administered, here you must proceed very cautiously — such a man must be capable of giving
    security. König has, it is true, much money, but that is a [uncertain: Bectie] — I advise taking none
    of all your old people, and how easily may not one or the other'
- page: 2
  en: 'be called to account together with Cosmar — for naturally one will demand to know why no more was
    drawn from the estates, and there [uncertain: Bäte] a valuation might well take place — after which
    one would then ask where the revenues have gone. The most advisable thing is [text lost] a Pro Memoria
    of its own here — and to propose outright somebody who is to administer the whole entailed estates
    for the Royal account — but this must be a man who, 1st, is truly attached and devoted to you, most
    gracious Prince, so that the last fraud may not prove worse than the first — for such a man can prepare
    for you either heaven or hell. 2. And he must be capable of giving security, the security to be in
    cash money, not [uncertain: aprin] or in landed property — 3rdly he must possess economic knowledge
    as well as having learning otherwise. 4thly he must not be wholly without knowledge of the ironworks
    branch — but if he cleaves faithfully to Your Serene Highness, then he will be able to be instructed
    therein by you; and he must go to work without brutality, be prudent of course, so that the old bloodsuckers
    do not make an X out of a U for him — If you propose, particularly with these qualities, the Prince
    Chancellor will certainly approve. But these things I must have here very quickly, for I hope within
    a few days to obtain the Prince''s resolution, both as to the advance and as to the Polish estates,
    and then I shall not remain here a moment longer, especially if I am put in a position to pay off
    the debts — also because I confidently hope to move the Prince to go somewhat by way of Schlawe. I
    should think you might send somebody here with my horses, either riding or driving — in 4 days the
    man can be here; then the money is received securely and the papers quickly — Take it to heart that
    your Pro Memoria must absolutely, even if the money should already be on the way, nevertheless be
    had very quickly and certainly in the matter censured above.'

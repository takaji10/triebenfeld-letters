- page: 1
  en: '3 Two letters, of the 19th and 28th of January, I have received, and no more. Against that, since
    the 13th I have sent 7 pieces from here — in all of them I have begged for help; in the one of the
    19th Your Serene Highness gives hope, in the one of the 28th you say not a word about it. On what,
    gracious Lord, do you suppose I am to live here, with the frightful dearness of everything? I reckoned
    at the outset on 1,400 Rthl for 4 weeks — as yet I have received no more than 932 Rthl, and that over
    5 months — It is a hellish torment that I owe the Prince and Barbe 170 #; I am almost dying of shame
    — life in Tobolcki''s wastes is truly not so full of torment as mine — I would gladly be [uncertain:
    Seelen] active, but with wholly empty hands — Oh, it is an accursed life — Tomorrow B[arbe] means
    to drive with me to Minister Nesselrode and to the [uncertain: for comfort] privy hope-councillor
    Schröder, so as to neglect nothing in the Polish matter, but rather to [uncertain: forestall] all
    the routes. But I truly do not know where I am to get the 12 gulden to pay the hired coach — in short,
    if I do not soon receive help, and if you do not very, very quickly provide a remedy, everything will
    go to the devil; I cannot help myself further, but must take myself off from here secretly, burdened
    with disgrace and derision.


    I have brought much about here for you, and wished just now to bring this about too, that the Prince
    should visit you on his return journey, for he is not returning by way of Dresden. — But I cannot
    decently show myself before him — My plan was then to give your military affairs the happiest turn
    and to bring this to the desired end. But how am I to come forward, when for shame I cannot raise
    my eyes —


    Of the Prince State Chancellor''s journey Your Serene Highness must as yet say not a word to any living
    soul — It is only according to my and B[arbe]''s plan.


    I therefore beg you once again, for God''s sake, send the 200 # with all speed, that I may get clear
    of the debt — Now this besides — [uncertain: Wenn] do you wish, as administrator in the King''s name,
    to administer the entailed estates, here you must go to work very cautiously — such a man must be
    capable of giving security. König has money enough, to be sure, but he is a beast — I advise you to
    take none of all your old people, and how easily may not one or the'
- page: 2
  en: 'other be called to account together with Cosmar — for naturally they will want to know why no more
    was drawn from the estates, and there a valuation [uncertain: Bäte] well take place — after which
    one would then ask, where have the [uncertain: Recenzen] gone?


    The most advisable course is that they send a Pro Memoria of their own here — and propose someone
    outright who is to administer the [uncertain: Gäntz] entailed estates for the Royal account — but
    this must be a man who, first, is truly attached and devoted to you, most gracious Prince, so that
    the last deceit be not worse than the first — for such a person can make you a heaven or a hell; secondly,
    he must be capable of giving security, and the security may be in cash money, not [uncertain: aprin]
    or in landed grounds — thirdly, he must possess both economic knowledge and other learning as well;
    fourthly, he must not be wholly without knowledge of the ironworks business — [uncertain: haupt] he
    meanwhile cleaves faithfully to Your Serene Highness, he will be able to be instructed therein by
    you.


    5, he must go to work without brutality, and naturally be shrewd, so that the old blood-leeches do
    not pass off an X on him for a U — If you propose, particularly with these qualities, the Prince Chancellor
    will certainly approve him — But these things I must have here very quickly, for I hope within a few
    days to obtain the Prince''s resolution, both as regards the advance and as regards the Polish estates,
    and then I shall not stay here a moment longer, if I am in particular put in a position to pay off
    the debts — also because I certainly hope to move the Prince to go by way of Sławięcice. I should
    think you might send someone here with my horses, either riding or driving — in 4 days the man can
    be here; then the money will be got securely and the papers quickly — Persevere in this, that your
    Pro Memoria must absolutely, even if the money should already be on its way, nevertheless very quickly
    and certainly in the aforesaid matter have'

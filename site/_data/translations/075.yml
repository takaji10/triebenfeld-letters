status: draft
segments:
- page: 1
  en: 'A Most Serene Highness [I] days [?] the communications most graciously imparted to me, the letter
    of Count v. S., most humbly to kiss again. It gladdens me that the Count conducts himself so straightforwardly
    in the whole affair, and in the end perceives his own advantage. Only, on the other hand, I grieve
    all too much that in this matter I have once again had to experience a trait dishonouring to humanity,
    and then that the opportunity is taken from me of rendering Your Most Serene Highness a truly [uncertain:
    ample] service and of gaining for Your Highness some 40 to 50000 Rthl. From Bonn Reinhardt writes
    that'
- page: 2
  en: 'as regards the assistance of the Fiscus nothing has yet followed. God! how pitiable are the men
    whose words one may lend any credit to. From Minister v. Goldbeck in Berlin I received a letter yesterday,
    in which he says: Hitherto many rumours have been circulating in the Residence concerning the South
    Prussian Department. A couple of days ago, however, I heard from a reliable man that the Right Honourable
    Count v. Hoym retains it. He writes that His Majesty was pleased to add to his otherwise already very
    extensive Justice Department the Ansbach and Bayreuth provinces as well, and had commanded – that
    certain newer laws be drafted. Heaven knows what there is in all this. For about 3 days ago a confidant
    of Minister Haugwitz, a certain Priebich, passed through here; this man firmly assured'
- page: 3
  en: 'the Councillor Krüger that Minister Haugwitz was to be South Prussian Minister. Chełmski has not
    yet appealed, and perhaps the estates may even be leased out along with the rest from Johanni without
    hindrance. Metzer, as the returning express reports which brings the news from Grävenitz, was not
    at home, but returns in 2 days; whereupon the form for the power of attorney as well as the other
    reports will follow. In deepest reverence I persist, Your Most Serene Highness''s


    Breslau, the 1st of April 1798.


    most faithfully humble and obedient servant

    v Triebenfeld'

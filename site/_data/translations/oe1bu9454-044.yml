segments:
- page: 1
  en: 'My longing to be able to lay myself at Your Most Serene Highness''s feet in person as soon as possible
    is without bounds — I could rage with impatience.


    The Lahr lawsuit still holds me back, and I must see how the matter is to be managed.


    Lahr is still to receive 3000 Rthl according to the judgement just now made known to me by Amelang,
    together with the interest. He must take paper securities, and these would, at the present rate of
    exchange, amount with the interest to about 2000 Rthl. Now there lie pledged, belonging to me, 2 bonds
    of 1000 each against 800 Rthl


    2 of 300 for 360


    1 of 400 Rthl


    for 340; these are 3000 Rthl in paper for Lahr, but the costs now amount to 1500 Rthl, which I must
    have in order to be able to redeem them at once. As soon as I have this, I am at least free. With
    Coste I yesterday happily [dealt with] the 9000 Rthl which at that time had to be deposited to cover
    the 5000 Rthl which von der Lahr gave upon Zastrow, mine and the Grevenitz bill of exchange; these
    I repaid yesterday, and paid him 450 Rthl in interest. Also gave his bookkeeper and the [uncertain:
    Constier] Oldekopp 118 Rthl


    Is — 2068 Rthl. As soon as I receive this, this dreadful affair, which has robbed me of health, peace,
    honour and credit, is got out of the way. Your Serene Highness, however, loses little thereby, because
    the French Government has ordered these monies to be reimbursed out of the Zagorowo estates.


    also there will be


    1500 Rthl in Courant


    is saved. Most excellent Chamber, as I this [text breaks off]'

- page: 2
  en: '2068 rt quickly, and likewise how I may satisfy Mathieu — who in the end means to hold me fast
    for 1000 rt Courant or 1500 rt in coin — so as to be able to travel.


    The merchant Michaelis made me the offer yesterday that, if Your Serene Highness would let him have
    600 Centner of iron at 4 rt by the month of May, he would then at once settle the 2068 rt together
    with interest and costs. The iron would, however, have to be delivered to him free as far as Opole.


    Reckoning upon Your Serene Highness''s grace, I shall, if Michaelis keeps his word, conclude this
    contract — the 600 Centner of bar and hoop iron must surely be a trifle for you to give, and at no
    cost. The lawsuit with Oppenheimer and the many messengers and other costs to South Prussia, which
    I have laid out here in cash, amount to 521 rtl. These I beg to have repaid to me in cash as quickly
    as possible. Likewise I ask for the execution and other costs which the French gendarmerie, whom I
    have had to feed and pay here, have caused — these amount to 411 rth.


    These are 932 rt Courant, and until I receive them I am as good as under arrest and may not stir from
    the spot. For the very swiftest disposition of this matter, namely the 932 rt in cash and the promise
    of the 600 Centner of iron, I beg Your Serene Highness as urgently as most heartily, and I affirm
    that I shall thereupon continue with the most glowing zeal to help bring all Your Most High affairs
    into the best course.


    Answered, as desired.


    3rd February 1809, to Berlin. von Triebenfeld'

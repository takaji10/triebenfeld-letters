- page: 2
  en: '2068 Rthl quickly, and likewise how I am to satisfy Mathein, who in the end means to hold me fast
    for 1000 Rthl Courant or 1500 Rthl in coin, so as to be able to travel.


    The merchant Michaelis yesterday made me the offer that, if Your Serene Highness would let him have
    600 hundredweight of iron at 4 Rthl by the month of May, he would then at once settle the 2068 Rthl
    together with the interest and costs. The iron, however, would have to be delivered to him carriage-free
    as far as Oppeln.


    Counting upon Your Serene Highness''s grace, I shall, if Michaelis keeps his word, conclude this contract
    — for 600 [uncertain: Leute] of bar and hoop iron must surely be a trifle to give him, and with free
    [text lost] The lawsuit with Oppenheimer, and the many messengers and other costs to South Prussia,
    which I have here laid out in cash, amount to 52 Rthl. These I beg to have repaid to me in cash as
    [uncertain: swiftly] as possible. Likewise I beg for the costs of execution and the others which the
    French gendarmerie — whom I have had to feed and pay here — have caused; these amount to 411 Rthl.
    These are 932 Rthl Courant, and until I receive them I am as good as under arrest and may not stir
    from the spot. For the very swiftest disposition of this matter, and particularly for the 932 Rthl
    in cash, and for the assurance of the 600 hundredweight of iron, I beg Your Serene Highness as urgently
    as most heartily, and I protest that I shall continue with the most glowing zeal to help bring all
    Your Highness''s affairs into the best course.


    answered according to wish.


    The 3rd of February 1809. to Berlin. von Triebenfeld'

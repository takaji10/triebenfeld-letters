- page: 1
  en: '44 My longing to be able to lay myself personally at Your Most Serene Highness''s feet as soon
    as possible is without bounds — for impatience I could rave.


    The Lahr lawsuit still holds me back, and I must see how the matter is to be managed.


    Lahr still receives 3000 rt, according to the judgment just now made known to me by Amelang, together
    with the interest.


    He must take papers, and these would, at the present rate of exchange, come with the interest to about
    2000 rt. Now there lie pledged 2 obligations of mine at 1000 rt each, for 800 Rthl.


    2 at 300 rt for 360 rt, 1 at 400 Rthl for 340 rt; these are = 3000 Rthl in papers for Lahr, but the
    costs now 1500 rt, and this[?] I must have in order to be able to redeem them at once.


    As soon as I have these, I am at least free. To Coste I yesterday successfully returned the 9000 rt
    which at that time had to be deposited to cover the 5000 rt which von der Lahr gave upon Zastrow,
    my own, and the Grevenitz bill of exchange, and I paid him 450 rth in interest. I also gave his bookkeeper
    and the broker Oldekopp 118 rt. These are = 2068 rt.


    As soon as I receive these, this dreadful business, which has robbed me of health, peace, honour and
    credit, is got out of the way. Your Serene Highness, however, loses little thereby, because the French
    Government has ordered these moneys to be reimbursed out of the Zagórów estates. My foremost Chamber
    is how I [may] this (also 1500 rt in Courant will be saved)'

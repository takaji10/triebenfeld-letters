segments:
- page: 1
  en: '[To His] Reverence the General Superintendent

    of the Warsaw Evangelical-Augsburg

    Consistorial District.


    The Pastor-Administrator [of the]

    Evangelical-Augsburg [congregation of]

    Lissewo-Pyzdry.


    In consequence of [Your Reverence''s] order

    of the 30th of October [text lost],

    No. 267, I have the honour to submit the following annual report

    concerning the filial Lissewo-Pyzdry.


    I. Church affairs.


    a.) External church affairs.– The filial possesses neither a church [text lost] sexton''s house.–
    Divine service in Pyzdry is held in rented premises.– In the filial there are five religious schools
    combined with prayer houses, all of them in good condition.– The number of children in the five schools
    of the filial comes to about 120.– There are five cemeteries in the filial, all fenced and provided
    with crosses.–


    b.) Inner church affairs.– Church spirit and church attendance satisfactory.– Baptisms are performed
    by the cantors concerned in the prayer houses; the pastor, when he is present in the prayer houses,
    confirms the baptisms performed by the cantors, and holds the churching[?] with the women [text lost].–
    Open despisers of the Lord''s Supper: none known.– The number of communicants: men 326, women 408,
    total 734, [text lost] compared with the year 1881, 131 more.– The inhabitants of Pyzdry would gladly
    set up an Evangelical school among themselves, [but] are too poor for it, since the little town counts
    only 9 families[?], and [text lost]'
- page: 2
  en: '[text lost] lay people can be brought in for it, since the [text lost] colonies have their own
    teachers and prayer houses.–


    For the mission to the heathen, 3 roubles 40 kopecks were collected in the course of the year at the
    mission services, which the Pastor-Administrator sent on to Superintendent Pastor Manitius at Warsaw.–
    Morality and domestic life are in general satisfactory.– Particular vices in the congregation not
    present.– Baptists, Irvingians etc. there are none.– Conversions to other confessions do not take
    place.–


    Remarkable events.– None have taken place.–


    Number of confirmed.– Boys 13, girls 10, together 23.–


    Candidates living in the congregation.– None.–


    Collections.– For the benefit of the congregation itself nothing was collected, but for other purposes
    the following: 1.) For the support of grammar-school pupils who intend to study theology, 1 rouble
    76 kopecks, which the Pastor-Administrator sent to his High Evangelical-Augsburg Consistory at Warsaw.–
    2.) For the widows'' and orphans'' fund [text lost] roubles 36 kopecks were collected, and the same
    sent to Superintendent von Boerner at Plock.–


    E. Erdmann

    Pastor'

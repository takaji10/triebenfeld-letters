- page: 4
  en: '— Heuthausen is, as I have come to know him, a man of head and heart, possesses the knowledge of
    the language required here, has the proper savoir vivre to get on among the Poles; give him, most
    gracious Prince, travelling money for expenses and for living, and let him take charge of the matter,
    for as yet nothing is to be had here. Often I go hungry; what I suffer, I show you, [uncertain: Serene
    Highness], in figure — Świniary is, on account of the Invalids'' interest, laid under a tenfold arrest
    with 9700 rt on account of 27000 rt of bank interest, on account of 4000 rt of the Epstein claims,
    and 3500 of old costs which I have paid and stood surety for here — on account of 4000 rt which the
    Schlieffen still have to claim — nothing comes in here, I cannot save myself, my children [uncertain:
    suffer] with me; in short I suffer and [uncertain: endure] — For what does me the greatest [uncertain:
    hurt] is that my fine Konotop has gone to the devil — I have no one who [uncertain: helps out]; whoever
    I engage, who is supposed to work, turns rogue, because people do not believe that a Prince should
    not spend and live for the devil''s sake — Everyone wants at once to live along with it — Despite
    all this I remain, with the deepest reverence, the most faithful attachment and the deepest esteem,


    Your Most Serene Highness''s


    the star out of the north shines


    the rest by word of mouth


    Blizanow


    the 21st of September 1811


    faithful, humble and obedient servant


    v Triebenfeld'

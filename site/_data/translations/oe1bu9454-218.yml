- page: 2
  en: 'now Stössel and Mr Weigelt should take Skorogoszcz and the mortgage here, whereby Your Serene Highness
    would be freed of a burden of debt of 322625 rt. To dispose Stössel and Weigel to take Skorogoszcz
    and the mortgage is the principal matter. With Count Wartensleben I would settle the business. With
    Stössel, however, I will have nothing to do — should, however, the mass of debts from Stössel and
    Weigel be still much higher than 322625 Rthl, then I would undertake to treat with the eldest son
    of Count Wartensleben over my Blizanow, and would gladly and willingly give Your Serene Highness this
    estate, which I am acquiring there, together with a mortgage of 30000 rt upon Konotop, so that everything
    might be cleared away and Koszęcin made clear of the half. Your Serene Highness could then, from the
    estate of the Prince Sacken, that which is destined for the purchase of an entailed estate, demand
    back with every right [uncertain: Bewer], with these arrange your whole business of debts and still
    keep money in the [uncertain: Witwecke], and with every right also come forward as lord of an entailed
    estate. If the plan pleases Your Serene Highness, then be pleased, most gracious service, only to
    let your high opinion be known by a mounted messenger; I [text lost] then at once to Sławięcice, and
    go immediately to the old Wartensleben to conclude the business. Only this I remark, that at present
    no one learn a word of this plan, and also that the matter must be pursued very quickly, because Wartensleben
    has for some time now been in negotiation with the'

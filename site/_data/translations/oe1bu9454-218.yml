- page: 3
  en: 'medical councillor Gumperts.


    For the rest I would strive with burning zeal to win the two lawsuits with Oleśnica and Wrąbczyn before
    the handing over of the Zagórów estates, so that Your Serene Highness might yet draw some 20 to 30000
    rt from these [uncertain: förd]. What else will come out of the accounts of the various officials
    and sequestrators, time will teach; that in the meantime this business is being carried out irreproachably,
    Mr von Heuthausen can detail to Your Serene Highness more exactly. The sum of the arrears will, as
    I can assure with certainty, be more than considerable, but a great many items will have to be regarded
    as unrecoverable; so for example the story with Oleśnica: the three fellows, against whom I at the
    time so honestly warned Your Serene Highness, owe 35000 rt — from these 3 creatures you will, most
    gracious Lord, never receive a [uncertain: Groschen], for what can a smith, a journeyman linen-weaver
    and a village innkeeper have? With Wrąbczyn it is the same case; fortunately the contract has now
    already been quashed in one instance — Prince, that was a recollection of the conversation which nearly
    drove me to madness — O my poor children — I have counted the windows after your manner — now back
    to business. In Pszczew too there is much to do; there stand there some 20000 rt in arrears which
    are owing to Your Serene Highness — I cannot [uncertain: go there] any further, for I have been chiefly
    with the councillor of justice Künsel in Poznań, and have [uncertain: clarified] the matters. Now
    a man of head and heart must pursue the affair on the spot himself'

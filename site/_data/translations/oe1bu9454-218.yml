  en: '218


    Most Serene Prince


    Most gracious Prince and Lord!


    What has been done here on Your Serene Highness''s estates, and what is to be expected hereafter,
    of this Mr von Heuthausen will be able to lay the reports and results before Your Serene Highness.


    I have drawn up a valuation and had Cabanis make it out — the [uncertain: prospects] from it are brilliant
    and serve to conclude an advantageous exchange transaction, so that the 128000 rt might be regarded
    as a life annuity.


    In case Your Serene Highness should be pleased to approve a plan drawn up to that end with Mr von
    Heuthausen and the Master of the Horse Bally, it would depend upon Mr Weigel and Mr von Stöck entering
    into the matter according to our wishes.


    The plan is properly to make an exchange with General Count Wartensleben for Skorogoszcz. Skorogoszcz
    was bought for 207000 rt; there were 92000 rt of debts upon it, and 115000 rt remained clear.


    If on the other hand the Zagórów estates were taken at a value of 560000 rt / for something must be
    brought into deduction for the restocking of the demesne farms / then, after deducting the 237375
    rt of debt standing upon Zagórów, there would remain clear — 322,625 rt. From this the 115000 rt which
    remain upon Skorogoszcz would have to be brought into deduction, and Your Serene Highness would retain
    a clear mortgage of 207625 rt upon the Zagórów estates. According to our plan,'

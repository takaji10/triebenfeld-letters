- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    As to what has been done here on Your Serene Highness''s estates, and what is to be expected hereafter,
    Herr von Heuthausen will be able to lay the reports and results before Your Serene Highness.


    I have drafted a valuation and had it drawn up for him [uncertain: habnnis] — the externals of it
    are brilliant and serve to conclude an advantageous baptismal transaction, so that the 128000 Rthl
    might be regarded by me as a life-annuity-people.


    In the event that Your Serene Highness should deign to approve a plan drawn up to that end with Herr
    von Heuthausen and Herr Bally, the Master of the Horse, it would depend upon Herr Weigel and Herr
    von Stöck entering into the matter according to our wishes.


    The plan is properly to be made with General Count von Wartensleben regarding Schurgart; Schurgent
    was bought for 207000 Rthl; there were 92000 Rthl of debts upon it, and there remained clear 115000.
    If, on the other hand, the Zagorowo estates were to be taken at a value of 560000 Rthl / for something
    must be deducted on account of the setting-up expenses of the demesne farms / then, after deduction
    of the 237375 tℓ. owing that stood upon Zagorowo, there would remain none


    322,625 Rthl, from which the 115000 Rthl which remain on Schurgard would have to be deducted, and
    Your Serene Highness would retain a clear mortgage of 207625 Rthl upon the Zagorowo estates. According
    to our plan,'

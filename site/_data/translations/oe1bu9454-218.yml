- page: 4
  en: '— Heuthausen, as I have come to know him, is a man of head and heart, possesses the knowledge of
    the language required here, has the proper savoir-vivre [uncertain: Lavoir Vivri] to get through among
    the Poles; give him, most gracious Prince, travelling money for expenses and for his living, and let
    him attend to the business, for nothing is to be got here as yet. How often I suffer, I show you,
    Serene Highness, [uncertain: figura-] — Schwimmern is, on account of the Invalids'' interest, laid
    under tenfold arrest, with 9700 on account of 27000 Rthl bank interest, on account of 4000 Rthl Epstien
    claims, on account of 3500 old costs which I have paid and guaranteed here — on account of 4000 Rthl
    which the Schliefen still has to demand — nothing comes in here, I cannot save myself, my children
    suffer with me; in short, I suffer and [uncertain: Felde] — For what grieves me most is that my fine
    Kontop is gone to the devil — I have no one who takes any interest; whatever I engage, that is to
    do the work, turns rogue, because people do not believe that a prince should not spend and live at
    the devil''s own rate — everyone wants to live as well at once — In spite of all this I remain, with
    the deepest reverence, the most faithful attachment and the deepest esteem,


    Your Most Serene Highness''s


    the star out of the North is shining


    the rest by word of mouth


    Blizanow


    the 21st of September 1811


    faithful, humble and obedient servant


    von Triebenfeld'

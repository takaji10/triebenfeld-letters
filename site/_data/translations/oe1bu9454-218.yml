- page: 3
  en: 'Medical Councillor Gumperts.


    For the rest, I should strive with glowing zeal to win the two lawsuits with Olemia and Weyberin before
    the handing over of the Zagorowo estates, so that Your Serene Highness might yet draw some 20 to 30000
    Rthl from them. What will come out of the accounts of the various officials and sequestrators time
    will teach; that meanwhile this matter is being prepared irreproachably, Herr von Heuthausen can detail
    to Your Serene Highness more exactly. The sum of the arrears will, as I can assure with certainty,
    be more than considerable, but very many items will have to be regarded as uncollectable; such, for
    example, is the story with Olesnica — the three [uncertain: Keels], against whom I then so honestly
    warned Your Serene Highness, owe 35000 fl. — of these 3 creatures you, most gracious Lord, will never
    get a Groschen, for what can a smith, a journeyman linen-weaver and a village tavern-keeper have.
    With Wrąbczyn it is the same case; fortunately the contract has now already been quashed in one instance
    — Prince, that was a reminder of the conversation which nearly drove me to madness — O my poor children.
    I have counted the windows in the manner of your writing — now back to the matter. In Betsche too
    there is much to be done; there some 20000 Rthl stand in arrears which are due to Your Serene Highness
    — I cannot go there any further, for I have chiefly been with Councillor of Justice Künsel in Posen,
    and have enlightened the affairs. Now a man of head and heart must pursue the business himself on
    the spot'

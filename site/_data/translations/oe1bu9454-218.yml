- page: 2
  en: 'then Stössel and Herr Weigel should take over Schurgast and the mortgage here, whereby Your Serene
    Highness would be freed of a burden of debt to the amount of 322625 Rthl. To dispose Stöckel and Weigel
    so that they take Schurgart and the mortgage is the principal matter. With Count von Wartensleben
    I would settle the business. But with Stöchte I will have nothing to do — should, however, the mass
    of debts of Stöchel and Weigel be still very much higher than 322625 Rthl, then I should undertake
    to deal with the eldest son of Count von Wastenleben concerning my Blizanow, and gladly and willingly
    make over to Your Serene Highness this estate, which I acquired there, together with a mortgage of
    30000 upon Kontop, so that all might be set aside and Koschenten be cleared of the half. Your Serene
    Highness may then, with every right, demand back the Bewer from the estate of the Prince von Sacken,
    that portion destined for the purchase of an entailed estate, and with this arrange your whole affair
    of debts and keep money in hand [uncertain: Witwecke], and moreover come forward with every right
    as lord of an entailed estate. If the plan pleases Your Serene Highness, then deign, most gracious
    service, only to let me know your most high opinion by a returning messenger [uncertain: Schlaconein],
    and then at once to Schlawenschitz, and I shall go immediately to the old [uncertain: Wackung] to
    conclude the matter. Only this I remark, that for the present no one is to learn a word of this plan,
    and the matter must also be pressed forward very quickly, because Wartenleben has for some time already
    been in negotiation with the'

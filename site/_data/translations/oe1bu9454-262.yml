status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! That His Serene Highness the Lord Prince Hardenberg
    now truly means well by Your Serene Highness is proved by the Prince''s utterance to the Prince H.
    of Bartenstein. The discourse came round to the point that Your Serene Highness were named, whereupon
    the Prince at once replied: Yes, this honest man is the one who has suffered most, he has been frightfully
    treated, I am now taking up his cause in the most active manner — I wish above all to see him helped.
    — Everything now depends upon Your Serene Highness''s declaration and upon the confirmation of my
    Memoirs by His Serene Highness — here indeed no contradiction must occur, for otherwise I am compromised
    with Hahn and the affair [takes] a tragic turn — whereas if everything is carried into effect according
    to our two Memoirs, the Prince will at once have the money given out to satisfy the Curl heirs, the
    King will annul the settlements, and Cosmar will be cast out and called to the heaviest account —
    everything else then follows of itself. — Friend ß moreover wishes, united with me, that we might
    obtain the most expeditious knowledge, by good Copies, of the result of the Commission and of the
    report of the High Court of Appeal [Ober Landes Gericht], and indeed, wherever at all possible, one
    post-day earlier than the report comes in to His Serene Highness the Prince State Chancellor — so
    that here everything may be forestalled. The blank forms [Blanquits] I await longingly, but above
    all the autograph letter of thanks to the Prince State Chancellor. — Tell that noble man, quite briefly,
    that you render him the [uncertain: youngest/most recent] thanks already for what has been done, etc.,
    that thereby you may look with confidence and hope to the end of your sufferings, which the wicked
    Cosmar prepared for you; mention quite briefly / that Connus in the last 3 [text uncertain] gave you,
    instead of 72000 Rthl, only 2500 Rthl in all, that to cover this he made use even of your son''s weakness,
    and that in this time you live so wretchedly and must even struggle with hunger, that Triebenfeld
    has not yet laid the matter out as it is in and of itself, etc. You laid, however, both your domestic
    and your military affairs in his hands, etc. etc.'
- page: 2
  en: 'I wish this because the Prince reads Your Serene Highness''s letters — but whole files and protocols
    he has no time to read himself, and can only hear reports drawn from them. In the Hohenlohe affair
    work is going forward in the most active manner — a check has already been put upon the tyranny of
    the King, his power against the mediatised Princes is being greatly restricted, presumably Ols etc.
    will be taken as the norm. — The note concerning your expulsion, and the otherwise frightful treatment,
    and that concerning the [illegible] withdrawal of the 2000 mk. apanage of your Lord Brother, I cannot
    send today, because on account of the [uncertain: street mud / Gaßen Loth] I cannot go out of the
    house, and for driving I have no money; and Gärtner, since I can promise him nothing, has not been
    with me these 8 days. A time full of torment I pass here — I am to act in so odiously distorted a
    business — to fight a hydra of more than 9 heads, and I have nothing in my hands and nothing on my
    body. For shame I could often perish. Urgently I beg you, most gracious Lord, send but 100 ducats,
    otherwise I must go hungry — thus he has lent me 50 ducats, and these will be quite gone within a
    few days — if meanwhile this true friend is not to grow weary, and is to go on trusting, then I must
    hand him back the money, for he has his own people in Berlin to provide for, and therefore he himself
    has particular need of it toward the New Year. Let Your Serene Highness then by all means send the
    100 ducats, likewise the papers noted overleaf, and support my children according to my request in
    Breslau. From the accompanying book a great part is borrowed as to how it is to be kept for the future
    in [uncertain: Württemberg / Wüstemberge]. In truest attachment and highest reverence I remain, until
    death, Your Serene Highness''s


    Vienna, the 20th December 1814.


    faithful and most obedient servant

    v Triebenfeld'
- page: 3
  en: 'The K[ing] of Würt[temberg] departs in a couple of days; his appearance betokens the foulest humour.
    Only between the wings at the Casperl Theatre does the All-Highest countenance sometimes show itself
    in a transfigured radiance. — For the rest, it stands in today''s Vienna newspapers that the King
    of Bavaria calls upon his subjects to report themselves if any of them have claims in France, be it
    against the King or the State — whoever is too weak to do this before the French Commission is to
    bring it forward before a Commission to be appointed by him — the nation has undertaken to pay the
    King''s debts. — Would it not be advisable that Meyer, or Your Serene Highness yourself, should bring
    to Prince Hardenberg''s remembrance the 100000 [uncertain: Er dör] advanced to the King of France
    and sent to Coblenz by Meyer? — Meyer did in fact deliver the money there to the King and to Pr. Artois,
    and received 1000 Rthl for it. — Meyer''s written undertaking from Pr. Artois for 240000 Livres could
    be made good in that connexion. — His Excellency Herr Minister von Humboldt will certainly do everything,
    and help vigorously. — But the reminder would have to be made quickly, since through His Excellency
    H. v. Humboldt the matter could still be best set on foot. — In the 19th § of the Peace of Paris all
    claims are fixed to be paid, and the State has ex post bound itself to pay the Royal debts which it
    contracted in its period of misfortune, with about 22 millions.'

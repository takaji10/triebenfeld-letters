- page: 2
  en: 'I wish this because the Prince reads Your Serene Highness''s letters — but has no time to read
    whole files and records himself, and can only hear reports drawn from them. In the Hohenlohe affair
    work is going forward in the most active manner — a stop has already been put to the King''s tyranny,
    his power against the mediatised princes is being greatly restricted, presumably Oels etc. will be
    taken as the norm — the note concerning your expulsion, and the otherwise shocking treatment, that
    concerning


    the [illegible] withdrawal of the 2000 mk. appanage of your lord brother I cannot send today, because
    on account of the [uncertain: street mud] I cannot leave the house, but have no money to ride, while
    Gärtner, since I can promise him nothing, has not been with me for 8 days.


    A time full of torment I pass here — I am to act in so odiously twisted a business — to fight a hydra
    of more than 9 heads, and I have nothing in my hands and nothing on my body. I could often perish
    for shame; I beg urgently, most gracious Lord, send only 100 ducats, otherwise I must go hungry —
    thus he has lent me 50 ducats, and these will be quite gone within a few days — if meanwhile this
    true friend is not to grow weary, and is to go on trusting, then I must hand the money over to him,
    for he has his own people to provide for in Berlin, and therefore he himself is in need of it, especially
    at the New Year. So do send, Your Serene Highness, the 100 ducats without fail, likewise the papers
    noted overleaf, and support my children in accordance with my request in Breslau. From the accompanying
    book a great part is borrowed, as to how it is to be conducted in future in the Wüstemberge.


    In truest attachment and highest reverence I remain, until death, Your Serene Highness''s


    Vienna, the 20th of December


    1814.


    faithful and most obedient servant


    v. Triebenfeld'

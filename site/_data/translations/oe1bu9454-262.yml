segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    That His Serene Highness the Prince Hardenberg now truly means well by Your Serene Highness is proved
    by the Prince''s remark to Prince H. of Bartenstein. The discourse turned upon Your Serene Highness
    being named, whereupon the Prince at once replied: Yes, this honest man is the one who has suffered
    most, he has been shockingly treated, I am now taking up his cause in the most active manner — I want
    him helped before all others — Everything now depends upon Your Serene Highness''s declaration and
    upon the confirmation of my memorials by His Serene Highness — here there must be no contradiction
    whatever, for otherwise I am compromised with Hahn and the affair [takes] a tragic turn — whereas
    if everything is substantiated in accordance with both our memorials — the Prince will at once have
    the money paid out in order to satisfy the Curl heirs, the King will annul the settlement, and Cosmar
    will be cast out and called to the heaviest account — everything else will then follow of itself —
    Friend ß moreover wishes, together with me, that we might obtain the very speediest knowledge, by
    good copies, of the outcome of the Commission and of the report of the High Court of Appeal, and indeed,
    wherever possible, one post-day earlier than the report comes in to His Serene Highness the State
    Chancellor — so that one may forestall everything here.


    I look forward longingly to the blank forms, but above all to the thanksgiving letter in your own
    hand to the Prince State Chancellor — Tell this noble man, quite briefly, that you render him your
    [uncertain: youngest] thanks already for what has been done, etc., that you may thereby look with
    confidence to the end of your sufferings, which the wicked Cosmar has prepared for you; mention quite
    briefly / that Connus in the last 3 [years?] therefore gave you, instead of 72000 Rthl, only 2500
    Rthl altogether, that he made use of your own son''s weakness to cover this up, and that in this time
    you live so wretchedly and must even struggle with hunger, that Triebenfeld has not yet presented
    the matter as it is in and of itself, etc.; you have laid, however, both your domestic and your military
    affairs in his hands, etc. etc.'

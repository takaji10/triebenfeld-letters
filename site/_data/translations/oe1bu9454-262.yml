- page: 1
  en: '262


    Most Serene Prince


    Most gracious Prince and Lord!


    That His Serene Highness the Prince Hardenberg now truly means well by Your Serene Highness is proved
    by the Prince''s remark to Prince H. of Bartenstein. The discourse came round to Your Serene Highness
    being named, whereupon the Prince at once replied — "Yes, this honest man is the one who has suffered
    most; he has been frightfully treated; I am now taking up his cause in the most active manner — I
    want him helped before all others —" Everything now depends upon Your Serene Highness''s declaration
    and upon the confirmation of my memoirs by him [uncertain: Serene Highness] — here indeed no contradiction
    must occur, for otherwise I am compromised together with Hahn and the affair takes a tragic turn —
    whereas if everything is confirmed according to our two memoirs — the Prince will at once cause the
    money to be given in order to satisfy the Curische heirs, the King will set aside the settlement,
    and Cosmar will be cast out and called to the heaviest account — everything else will then follow
    of itself — My friend B[arbe], moreover, joins with me in wishing that we might obtain the very speediest
    knowledge, by good copies, of the results of the commission and of the report of the Higher Provincial
    Court, and indeed, wherever possible, one post-day earlier, before the report comes in to His Serene
    Highness the Prince State Chancellor — so that everything may here be forestalled.


    I look forward longingly to the blank forms, but above all to the thank-you letter in your own hand
    to the Prince State Chancellor — Tell [uncertain: this] noble man, quite briefly, "that you render
    him your [uncertain: most heartfelt] thanks already for what has been done, etc., that thereby you
    may look with confidence and hope to the end of your sufferings, which the wicked Cosmar has prepared
    for you" — mention quite briefly / that Cosmar has in the last 3 [uncertain: years], instead of 72000
    Rthl, given you only 2500 Rthl in all, that to cover this he has exploited even your son''s weakness,
    and that in this time you have to live so wretchedly and even to struggle with hunger, that Triebenfeld
    has not yet laid the matter out as it stands in and of itself, etc.; that you placed, however, both
    your domestic and your military affairs in his hands, and so on and so forth."'

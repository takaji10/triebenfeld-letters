- page: 2
  en: 'I wish this because the Prince reads Your Serene Highness''s letters — whole files and minutes,
    however, he has no time to read himself, but can only hear reports drawn from them. In the Hohenlohe
    affair work is going forward in the most active manner — a stop has already been put to the King''s
    tyranny; his power against the mediatised princes is being very much restricted; presumably Öls etc.
    will be taken as the norm — the note concerning your expulsion and other frightful treatment, and
    the one concerning the withdrawal of the 2000 fl. apanage of your lord brother, I cannot send today,
    because on account of the street mud I cannot go out of the house, but have no money to ride; and
    Gärtner, since I can promise him nothing, has not been to see me for 8 days now — A time full of torment
    I am passing here — I am to be effective in a story so odiously twisted — to fight a hydra of more
    than 9 heads, and I have nothing in my hands and nothing on my body. For shame I could often perish
    — urgently I beg you, most gracious Lord, send only 100 #, otherwise I must go hungry — B has lent
    me 50 #, and these will be quite gone in a few days — if meanwhile this true friend is not to grow
    weary and is to go on trusting me, I must hand him back the money, for he has his own people in Berlin
    to provide for, and therefore he himself has need of it, especially at the new year — So do send,
    Your Serene Highness, the 100 # without fail, and likewise the papers noted overleaf, and support
    my children in accordance with my request at Wrocław — From the accompanying book a great part is
    borrowed as to how matters are to be conducted in future in Württemberg.


    In truest devotion and highest reverence I remain, until death, Your Serene Highness''s


    Vienna, the 20th of December


    1814.


    faithful and most obedient servant


    v Triebenfeld'

- page: 3
  en: 'The King of Württemberg departs in a couple of days; his appearance betokens the worst of humours
    — Only between the wings at the Casperl Theatre is the All-Highest countenance said nevertheless sometimes
    to show itself in transfigured radiance. For the rest, it stands in today''s Vienna newspapers that
    the King of Bavaria calls upon his subjects to come forward if anyone has claims in France, whether
    against the King or against the State — Whoever is too weak to do this before the French commission
    is to bring it before a commission to be appointed by him — the nation is said to have undertaken
    to pay the King''s debts — would it not be advisable that Meyer, or Your Serene Highness yourself,
    should bring to the Prince Hardenberg''s remembrance the 100/m Fr. d''or advanced to the King of [uncertain:
    France] and sent to Koblenz by Meyer — Meyer did in fact actually convey the money there to the King
    and to the Prince of Artois, and received 1000 Rthl for it — Meyer''s own written undertaking from
    the Prince of Artois for 240/m Livres could be made good in that connexion — His Excellency the Minister
    von Wilhelm von Humboldt will certainly do everything and help vigorously — But the reminder would
    have to be made quickly, because the matter could then be best set on foot with His Excellency Mr
    von Wilhelm von Humboldt — in the 19th § of the Peace of Paris it is laid down that all claims are
    to be paid, and the State has bound itself ex post to pay the royal debts which it contracted in its
    period of misfortune, amounting to about 22 millions.'

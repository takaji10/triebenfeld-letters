- page: 3
  en: 'The King of Württemberg departs in a couple of days; his appearance betokens the foulest humour.
    Only between the wings at the Casperl Theatre does the All-Highest countenance sometimes show itself
    in transfigured radiance. For the rest, it stands in today''s Vienna newspapers that the King of Baum
    calls upon his subjects to report themselves if anyone has claims in France, be it against the King
    or the State — whoever is too weak to do this before the French Commission shall bring it before a
    commission to be appointed by him — the nation is said to have undertaken to pay the King''s debts
    — would it not be advisable that Meyer, or Your Serene Highness yourself, should bring to the Prince
    Hardenberg''s remembrance the 100000 [uncertain: Er dör] advanced to the King of [uncertain: Brandreich]
    and sent to Coblenz by Meyer — Meyer did in fact deliver the money there to the King and Prince Artois,
    and received 1000 Rthl for it — Meyer''s written undertaking from Prince Artois for 240000 livres
    could be made good in this connection — His Excellency [uncertain: Münst] von Humboldt will certainly
    do everything and help vigorously — but the reminder would have to be given quickly, because then
    the matter could still be set best afoot with His Excellency von Humboldt — in the 19th paragraph
    of the Peace of Paris all claims are fixed to be paid, and the State has bound itself ex post to pay
    the royal debts which it contracted in its period of misfortune, to about 22 millions.'

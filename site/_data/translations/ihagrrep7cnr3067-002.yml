  en: 'After exact investigation[?] of the crimes[?], I find none of the condemned[?] worthy of a reduction
    of the punishments; rather, those who have been condemned to money fines must be held to the payment[?]
    of them, or, where[?] they are not able to pay it, be brought to an arrest in proportion to it.


    Fr. Wilhelm


    16 February 1797'

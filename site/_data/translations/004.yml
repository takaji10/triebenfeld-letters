segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord!


    The Napoleonic business is making a wicked sensation here, and the heavens threaten daily with clouds
    more heavy with storm. — Meanwhile one has [uncertain: has one] trodden upon the head of all the [uncertain:
    basilisk] that has broken out in France. — Others again maintain that Bonap[arte] finds much following
    and daily advances further onward; Grenoble and Lyon are already in the power of the evil disturber
    of the peace; by now he is said to be already some 30000 men strong and to have taken to himself the
    whole of the artillery that stood at Grenoble. Soult, le terre and Bertherand are his greatest adherents.
    — Upon the heads of these rebels great sums have been set. Upon Napoleon''s there have been set 10
    million francs on the part of the lawful Government, and [uncertain: Massena] has promised to pay
    3 million francs out of his own fortune towards it. — It is believed that this will avail the most.


    Court Councillor Barbe, who most respectfully commends himself to Your Serene Highness, will very
    shortly send his servant thither to Schlawenschitz, who from there is to go with my horses to Switzerland
    and fetch his sister, whose husband is being appointed in Berlin in E. H.''s bureau; he and I beg
    that Your Serene Highness might be pleased to have a really good wicker waggon given him there, over
    which, however, a [uncertain: dritchene] tilt-cover must be made, with which the servant may go thither
    and fetch his sister. — Do let this happen, pray — it will surely make it up to you. — Also the 3
    Court Councillors from the H—sche bureau, Kraibe, Heym and [uncertain: Philippsborn], have several
    small chests of glass lying at Prague, which is to be conveyed to Schlawen-'
- page: 2
  en: '-schl. Of this they have a free pass. — Thereupon may Your Serene Highness be pleased to give a
    [uncertain: Eufrchn] with 2 horses to fetch the glass to Schlawenschitz. To my two fellows, the drummer
    and the coachman, give a pass that they may return to Blizanow. — It might be that Your Serene Highness
    could use the coachman there. That these men Barbe, Philipshorn and Heym will again procure something
    good, that, most gracious Lord, you may well believe — for otherwise they would be ashamed to ask
    all this. Within a few days I am to learn something very good in a couple of matters. — There will
    then be time enough 3) to tell it to Your Serene Highness.


    Were it possible in the world, then send Eberhard here — for it is possible that he may compose the
    matter as he says; the [uncertain: Damm] need and seek moneys. Eberhardt writes just now that I should
    bring it about that the Chancellor have him summoned, give him a pass for post-horses and pay his
    travelling costs. — O heaven, what do people imagine! — I have many a friend, but I could [uncertain:
    alsiren] and would yet see no [uncertain: Dicelten] or costs. — To give, here, means, be more blessed
    than to take.


    Full of longing I await the news whether Eberhard will come or not. Just so do I heartily wish to
    learn what J. Augeit has done in respect of the power of attorney — for now the gauntlet is thrown
    down and the fight must be fought out honestly. For the rest, Your Serene Highness has not answered
    us whether you, should the case arise, would wish yourself thither as administrator. — Assuredly one
    will remember a man who is to direct everything there.


    Some blank forms Your Serene Highness still [uncertain: owes] me — they are all used up but the one
    at the Emperor''s — and I could now use some with the highest advantage. But this would have to be
    done very fully. I hope my thousandfold [uncertain: thanks] therefor, and trouble shall nevertheless
    be rewarded.


    In deepest respect I remain, until death, Your Serene Highness''s faithful and obedient servant


    Vienna, the 19th of March 1815 — Now come, then, Eberhard


    v Triebenfeld'
- page: 3
  en: 'Here there is henceforth an ebb and flood of news: in one moment comes word that Napoleon has been
    captured — in the following hour he has already marched into Paris with 100000 men; and so the reports
    drive one another about, according as the Jews and stock-jobbers find it agreeable to their convenience.
    What here, however, excites the apprehension of the Most High Lords are the Bonapartist appeals to
    the commonest class of men — properly to the canaille; to these he makes great promises and pledges
    them all the riches and goods of the world. — Yet it is feared that this may procure him some beginning,
    and [text lost] From Poland one would gladly have very sure news, how that nation thinks there. An
    innocent Pole said here yesterday: "Ah God be thanked, our Redeemer is not [uncertain: himself/dead]"
    — she is said to be quite mad with joy. What will the Grand Duke now do with his 40000 men?'

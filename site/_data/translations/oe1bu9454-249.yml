segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Your Most Serene Highness''s two letters of the 30th of last month and the 4th of this one I received
    on the 15th of November, whereby then a great part of my sufferings was relieved. Meanwhile there
    will be no lack of care, for a great part of it went upon bread already eaten in advance. As for getting
    by here, I shall have to help myself through, however meagrely it may ever be. Now as concerns the
    composition of the Court Councillor Hahn, it is simply impossible to append it to that petition, because
    the latter now already lies before His Majesty. His Majesty is at present very well disposed, and
    everything depends upon my receiving, with the utmost speed, the 12000 Rthl for the short-term authorised
    representatives, in order to conclude with them; the 10000 Rthl will thereafter at once be ordered
    for payment in Berlin. That His Serene Highness the Prince Chancellor is willing to help Your Serene
    Highness faithfully - of that you may hold yourself assured, most gracious Lord, and of the sentiments
    of Baron von Humboldt the enclosure will convince Your Serene Highness. The fate of Poland is indeed
    decided, but nothing has yet come to general knowledge. With regard to Your Serene Highness''s Hohenlohe
    affairs, everything is indeed tolerably set in train; meanwhile Mr. von Gärtner will [text lost] an
    un[text lost]'

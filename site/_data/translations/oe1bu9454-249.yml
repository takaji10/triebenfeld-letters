- page: 2
  en: 'writing to the Congress concerning these abominable grievances, quite separately and at once; so
    much is certain, that the mediatised throughout are regaining their old prerogatives, short of complete
    sovereignty. A few days ago there seemed to prevail here a slight tension, which excited a considerable
    whispering - the matter arose from a conference held in the deepest secrecy between Prince Metternich,
    Wrede and Wessling, to which our Minister was not drawn in - As yet one knows nothing of the subject,
    nor whether the jealousy has been entirely removed - on the 20th the 3 monarchs go travelling again
    - They are making a tour to Gral[illegible] and Trieste; one flatters oneself that after their return
    the Congress will then soonest reach its conclusion.


    At this moment it is said that nothing will come of the journey and that the Emperor of Russia will
    already return to Petersburg on the 2nd[uncertain] of next month. The Privy Councillor Göschet has
    issued to me the enclosed power of attorney, that Your Serene Highness might draw up such a one for
    him - Might Your Serene Highness have the grace to draw up such a one - but leave out the name Göschell
    and [uncertain: dem Plazoffen], - I shall see who does more, whether he or the Mr. von Gärtner who
    deserves it, whose name I write in here. Reverently I remain


    Your Serene Highness''s


    Vienna, the 17th of November


    1814.


    faithful and most obedient servant


    von Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness''s two letters of
    the 30th of last month and the 4th of this I received on the 15th of November, whereby then a great
    part of my sufferings was relieved. In the meantime there will be no lack of care, for a great part
    went upon bread already eaten up in advance — [uncertain: Gelung] here I shall have to help myself
    through, however miserably it may ever be. Now as concerns the paper of Herr Court Councillor Hahn,
    it is simply impossible to append it to that petition, since the same already lies at this time before
    His Majesty. His Majesty is at present very well disposed, and everything depends upon my receiving
    with the utmost speed the 12000 Rthl for those lately given full powers, in order to conclude with
    them; the 10000 Rthl will thereafter at once be assigned in Berlin. That His Serene Highness the Prince
    Chancellor is willing to help Your Serene Highness faithfully — of that you may hold yourself assured,
    most gracious Lord; and of Herr Baron von Humbolt''s sentiments the enclosure will convince Your Serene
    Highness. The fate of Poland is indeed decided, but nothing has yet come to general knowledge. Regarding
    Your Serene Highness''s Hohenlohe affairs, everything is indeed fairly well set in train; meanwhile
    Herr von Gärtner will [text lost]'
- page: 2
  en: '[text lost] writing to the Congress concerning these abominable grievances at once and moreover
    separately; so much is certain, that the mediatised [princes] will throughout recover their old prerogatives,
    short of full sovereignty. A few days ago there seemed to prevail here a slight tension, which excited
    a considerable whispering — the matter arose from a conference held in the deepest secrecy between
    Prince Metternich, Wrede and [uncertain: Wessling / Wessenberg], to which our Minister was not called
    in — As yet one knows nothing of the subject, nor whether the jealousy is entirely removed — on the
    20th the 3 monarchs go travelling again — they are making a tour to [uncertain: Gral / Grätz (Graz)]
    and Triest; one flatters oneself that after their return the Congress will then most speedily reach
    its conclusion. At this moment it is said that nothing will come of the journey, and that the Emperor
    of Russia will already return to Petersburg on the 2nd[uncertain: 2ten] of next month. Privy Councillor
    Göschet has issued to me the enclosed power of attorney, that Your Serene Highness might be pleased
    to draw up the same for him — Have Your Serene Highness the grace and draw it up — but leave out the
    name Göschell and [uncertain: dem Plazoffen] — I shall see who does more, whether he or His Excellency
    von Gärtner, who deserves it, whose name I write in here. Reverently I remain Your Serene Highness''s
    Vienna, the 17th of November 1814. most faithful and obedient servant v Triebenfeld'

- page: 2
  en: 'paper before the Congress upon these abominable grievances, quite separately and at once. So much
    is certain, that the mediatised houses will throughout regain their old prerogatives, short only of
    full sovereignty. A few days ago there seemed to prevail here a slight tension, which excited a good
    deal of whispering — the matter arose from a conference held in the deepest secrecy between Prince
    Metternich, Wrede and Wessling, to which our Minister was not called in — As yet nothing is known
    of the subject, nor whether the jealousy is entirely allayed — on the 20th the 3 monarchs go travelling
    again — They make a tour to Gratz and Trieste; one flatters oneself that after their return the Congress
    will then soonest reach its end.


    At this moment it is said that nothing will come of the journey, and that the Emperor of Russia will
    return to Petersburg as early as the 2nd of next month. The Privy Councillor Göschel has given me
    the enclosed power of attorney, that Your Serene Highness might be pleased to execute it for him —
    May Your Serene Highness have the grace to execute the same — but leave out the name Göschel and the
    place open — I shall see who does more, whether he or the Privy Councillor von Gärtner — and whoever
    deserves it, his name I shall write in. Most reverently I remain


    Your Serene Highness''s


    Vienna, the 17th of November


    1814.


    most faithful and obedient servant


    v Triebenfeld'

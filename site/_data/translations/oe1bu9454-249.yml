- page: 1
  en: '249


    Most Serene Prince,


    Most gracious Prince and Lord!


    Your Most Serene Highness''s two letters of the 30th of last month and the 4th of this I received
    on the 15th of November, whereby then a great part of my sufferings was relieved. In the meantime
    there will be no lack of care, for a great part of it went upon bread already eaten in advance — Enough;
    here I shall have to get myself through, however wretchedly it may be. Now as concerns the paper of
    the Court Councillor Hahn, it is simply impossible to add it to that petition, since the same already
    lies at present before His Majesty. His Majesty is at present very well disposed, and everything depends
    upon my receiving with all speed the 12000 Rthl for the Curish plenipotentiaries, in order to conclude
    with them; the 100000 Rthl will thereafter be assigned immediately in Berlin. That His Serene Highness
    the Prince Chancellor is willing faithfully to help Your Serene Highness — of that you may, most gracious
    Lord, hold yourself assured; and of the sentiments of the Baron von Humboldt the enclosure will convince
    Your Serene Highness. The fate of Poland is indeed decided, but nothing has yet come to general knowledge.
    As regards Your Serene Highness''s Hohenlohe affairs, everything is indeed fairly well set in train;
    meanwhile Mr von Gärtner will present a [uncertain: separate]'

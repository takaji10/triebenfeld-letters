status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! I have been here in Berlin since yesterday and
    have already scoured everything where sources of comfort should have flowed. Unhappily, however, I
    find nothing but puddles from which swindling and malice well up — All the prospects and views painted
    here are plain lies — Your Most Serene Highness would, had I not come here, have been deceived for
    ever. — For from this quarter not a Heller was to be counted upon. Now matters stand thus — Tomorrow
    evening, that is on the 20th, I go back to Frankfurth and, if everything otherwise remains as it is,
    shall conclude with Leixner concerning Kaemen and secure the moneys that are needful on account of
    Koschentin, and should I have to pledge my very salvation along with them. Here I shall so arrange
    everything that Your Serene Highness obtains Koltzig or the loan. But more hope is given for the estates,
    because the King has no inclination to give money away / for Russia absolutely will have war / Matters
    stand here so strangely that every honest man shakes his head. Meanwhile more than everything may
    yet be contrived.
- page: 2
  en: 'As regards the Broniewalische affair, matters have so far advanced that if the causas arresti are
    demonstrated, the arrest is to be [uncertain: allowed and granted — German "Arrest Schlagen an genommen
    werden soll" does not parse]. — In this affair too as good as nothing has been done, notwithstanding
    that this business is so highly extolled. Upon the causus arresti it cannot be [text lost] without
    2000 Rthl in f. Dor — had Mell: and Glenck called this thing by its right name long ago, the matter
    would long since have been decided and known without all this history. The post is about to go; I
    shall settle everything faithfully and to the best advantage: this is solemnly assured to Your Most
    Serene Highness. Berlin, the 19th of May 1804. Faithful servant v Triebenfeld'

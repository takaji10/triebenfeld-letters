  en: 'July 1,936

    Łazinsk

    Emilienheim'
- page: 2
  en: 'To [illegible] [illegible] [illegible] [illegible]

    In Orlin: [illegible]

    Station

    Töpferecke (Potter''s Corner):

    near Białobłoty

    Weißer Berg (White Hill)

    Schwarze [uncertain: Damm] (Black Dyke)

    [uncertain: Li…] Straße

    towards [illegible]

    Neu-[uncertain: Schl…]

    [illegible] [illegible]

    [uncertain: Wal…], [illegible]

    the forest

    on the [illegible]'
- page: 3
  en: 'In Obory the teacher Kampel.

    [uncertain: Łódź] seminary.

    has been there for 5 years.

    In Józefow a Mathys,

    cantor.

    (the records are with him)

    [uncertain: church] books from 1,907

    Pastor Gross

    Konin and Słupca

    With Zagórow

    few marriages —

    often instead: New

    and Old Łazinsk and

    Józefow; less often in Zagórow

    more towards Lissa-Pyzdry

    they also marry from'
- page: 4
  en: 'Poznań province.

    From the Smaszew congregation

    they marry from Orlin

    and Białobłoty, Obory,

    also Borowiec into the

    Zagórów congregation;

    less often: Wojciechowo,

    Czarnica, Grondy.

    —o—

    Wrąbczynek. A colony

    much mixed with Poles; they

    prefer to speak Polish.'
- page: 5
  en: 'sing well, very many

    musical families.

    More intelligent than Grodziec (in the Zagórów congregation)

    Dealings with the Poznań province

    —o—

    Michalinow

    Pomeranian barns in

    and near Emilienheim.

    Houses of clay with

    timber framing

    clay

    the Pomeranian barn,

    however, not purely

    developed'
- page: 6
  en: 'Michalinow.

    Land: 1) house plots

    2 Morgen

    2) Kaveln (strips) 4 Morgen

    3) four-Morgen pieces, Magdeburg measure

    4) meadows near Oleśnica

    1, 2, 3 Morgen

    4a) meadows near Olchowo

    1, 2, 3 Morgen

    The village mayor''s land is 2 Morgen of land,

    1 Morgen of meadow.

    1 Morgen of meadow for the mill'
- page: 7
  en: 'School 7 Morgen.

    —o—

    Mostly Wrocław (Breslau) hymn

    books. —

    To Volhynia

    many have emigrated,

    to Novograd-Volynsk.

    —o—

    Dwelling houses in [uncertain: annähre…den] half-timbering

    Remaining manor land of Trąbczyn.

    Jesse bought it, when?

    How is the land classed? in Michalinow.'
- page: 8
  en: '[illegible] [illegible] of the [illegible]

    Mielke

    in Łazinsk.

    "Die Büschen" (the bushes), field names

    Farms: "[uncertain: Gehege]"

    —o—

    "Die Birk[illegible]la[uncertain: ch]"

    "Rotkapp"

    "Die Noga"

    ([illegible] foot)

    "Trieb" [illegible] "[uncertain: Gehege]" [illegible] in [illegible]'
- page: 9
  en: '"Bärwinkel"

    "Morast" (bog). —

    —o—

    Old Krüger (86 years old)

    Son of a Krüger, a smith in the Poznań province.

    his teacher Neumann

    The Kosiniery did no damage

    in the village

    Krüger has also made over 4 Morgen of land

    to his daughter, to [uncertain: Wagelt].

    At the corners the barns are

    braced with narrow

    cross-beams

    In Emilienheim they do not speak

    as [uncertain: coarsely] as in Łazinsk.'
- page: 10
  en: 'The colony of Łazińsk.

    COMMUNITY OF THE ŁAZIŃSK COLONY

    VILLAGE MAYOR

    COMMUNE OF Trąbczyn

    2,040 Morgen.

    Farmers: 250 farmers.

    Only one category, III.

    also Huta Trąbczyńska

    a remaining manor, divided up

    category II.

    Trąbczyn new land.

    4 Morgen paid for 1.'
- page: 11
  en: 'Klatt took the hymn book

    away with him.

    For example, at Ludwig Schröter''s

    the name was Pydde Michel.

    no one remembers

    when he lived.

    —o—

    Servitude received from the

    Trąbczyn estate about 1880?

    Grünwald about 1,904

    The servitudes were added

    to the old land at the notary''s,

    and they must pay high taxes

    on them too.

    —o—

    The 60 farmers have come

    in over time.'
- page: 12
  en: 'They came into the forest:

    built on the pasture,

    for the farmstead.

    In Emilienheim it is called

    Baustelle (building plot).

    Everyone has his pasture round the house,

    even if he owns only

    two Morgen of land.

    From the largest to the smallest

    each has his little piece of meadow.

    —o—

    Peat on the meadows of the teacher

    and of the village mayor, otherwise little

    peat. 10–15 have some for their own

    use.

    Birch bark is'
- page: 13
  en: 'still found; the peat layer

    as deep as a man is tall.

    —o—

    The ditch runs as far as Pyzdry

    by way of Bukow, Łukom.

    "Noga" "Maras"

    By the school "Altes Holland" (Old Holland)

    "Bärwinkel"

    "Neues Holland" (New Holland)

    "Neu-Warschau" (New Warsaw)

    The canal is called "Graben" (the ditch)

    Baustellen (building plots). In Emilienheim.

    "Kafeln" "Viermorgen"'
- page: 14
  en: 'Old Kühnstubben (pine stumps) are still

    found. (dug

    out)

    1,929 hymns.

    in the Wrocław book.

    Cemetery: Józefow

    Agnes Schütz, née Neumann

    In Neustädtl in Silesia,

    born 17 April 1832

    31 January 1864 [uncertain: died…]'
- page: 15
  en: 'Peltzer (of the Kulturbund)

    twice

    admitted to the seminary.

    At Berendt''s: a maidservant.

    Has vanished without trace.

    —o—

    For 10 years 170 pupils

    with one teacher.

    For 2 years an assistant,

    since a new school building

    was built.

    The military authorities complained

    to the Ministry of Education that

    the recruits of the commune of Trąbczyn

    cannot speak Polish.'
- page: 16
  en: 'In the Pyzdry Hollands

    Wrocław and Züllichau [books]

    People from Łazinsk

    went to Russia,

    and came back too.

    —o—

    New Holland behind

    the Huta.

    —o—

    Kranich''s mother-in-law

    remembers that

    the Huta demesne farm'
- page: 17
  en: 'was divided up.

    —o—

    Mielke

    Old Ludwig Klingbeil

    went to America and became

    a "pastor" there. He could multiply,

    but not divide.

    Taught only religion.

    On the first day of lessons

    there were 186 children in the school.

    Teachers in Łazinsk:

    Mielke since 1,925.

    Klingbeil was there 9 years.

    Ed. Zelmer was there 34 years.

    from Łazinsk

    Radke 10 years

    Rasch 50 years

    someone else passed the

    examination for him.'
- page: 18
  en: 'Rasch was still a teacher

    at 80, and died here

    in Łazinsk.

    —o—

    Mother is gravely ill. The pastor

    is fetched; on the way

    he asks the son:

    How is your mother?

    Very bad;

    I hope she is already

    dead before we get there.

    The pastor objects: Perhaps. —

    The people of Obory: Hockerling.'
- page: 19
  en: 'Obory cherry-crackers

    —o—

    Of the girls

    they say "[uncertain: Züchten]"

    in Zamęty.

    marriageable

    Plötzer = gallants

    When they speak coarsely:

    Hockerlinge.

    In Orlin and Białobłoty:

    Kashubians'
- page: 20
  en: 'Michalinow Oleśnicki.

    Cows pull the harvest wagons

    Fences whitewashed. —

    Two years ago the school enlarged and fenced; the commune

    gave 300 złoty towards it. —

    Emilienheim joined

    to Drzewce, because 11 persons

    were lacking to make 200. Now

    great difficulties come

    of it. The village mayor in Drzewce

    does not know the German people.

    The deputy mayor is still Krüger,

    he has to help'
- page: 21
  en: 'To Russia

    The Budendorfs

    father''s sister

    went (Mrs Budendorf),

    and 2 more from Michalinow.

    Father-in-law got two

    Morgen of sandy land and has

    built himself up. —

    Those who were halfway well off went

    to Germany. The Budendorfs

    could only pay off the farm

    in this way.

    Wrocław books in Emilienheim.

    2 hours of religion a week'
- page: 22
  en: 'From Swięcia

    Budendorf comes from Swięcia

    Field names

    1) Bronikel

    2) Steinbruch (quarry)

    3) Grüne [uncertain: Kaveln] (green strips)

    4) Gänseblotte (goose mire)

    5) Gä[uncertain: ehe]blotte

    6) Griefenberge.

    7) Grosse Blotte (great mire)

    8) Baustellen (building plots).'
- page: 23
  en: 'A [uncertain: Gullat], [uncertain: Hormann]

    to Russia. Budendorf

    ge[illegible]kt, 50 years ago.

    —o—

    The Bruch (marsh) is beyond Oleśnica,

    Tarszewo, Olchowo, Mały

    Las, Dombrowitz — all

    this side of the Warta —; the

    people are called "Die

    Brücher" (the marsh people).

    —o—

    Myślibórz Holland, Węglewo

    [uncertain: Hausker] Holland. No

    marsh.'
- page: 24
  en: 'The people in the Bruch speak

    in the Swięcia way, everything

    short.

    "In the door a linen

    panel against the heat"

    —o—

    The houses are posts filled

    with clay, cold in

    winter.

    —o—

    Schabeln do not thrive, poor

    land.

    "they all like poppy-seed dumplings"

    —o—

    At Schultz''s the kitchen is clean.

    —o—

    German servants at Schultz''s.

    In the Węglewo Hollanders — Polish ones.'
- page: 25
  en: 'At Schulz''s a post barn.

    In Emilienheim too

    poplars appear already, but they

    do not grow straight as a candle;

    they branch out more.

    —o—

    In the cemetery in Emilienheim

    wooden grave boards like

    those in Łazinsk;

    the new cement

    crosses, too, are the same

    as the Łazinsk ones. —o—

    "Kopitzen": sheaf stacks,

    they say in Emilienheim.'
- page: 26
  en: 'New Holland in Łazinsk?

    How do they speak in Emilienheim?

    As in Tarszewo, Olszewo?

    When was the remaining manor of

    Trąbczyn parcelled out? Jesse bought it,

    when? Today it is called Włodzimierow.

    Still long before the

    war. —

    An aunt of Krüger''s, more than 40 years ago,

    to Brazil with her husband.

    [illegible] in Brazil. Formerly

    the Epistle was in it, one could

    read it along with the cantor.'
- page: 27
  en: 'Tarszewo, Olchowo, Mały

    Las, Chruścik — Brücher

    "speak slowly, drawn out,

    "j" instead of g

    "jejen" "jejangen" (gegen, gegangen)

    —o—

    "ick war do" = Brücher.

    I was there

    er hud = he had

    —o—

    old Schultz

    In every Holland a different

    book, so the same

    books were brought in

    Privilege for Züllichau 1786.'
- page: 28
  en: 'Old Schultz''s father came

    from Tomice

    1889 — [uncertain: 1,928]

    always 80–90, even 100 children.

    Cantor until 1,934.

    Neumann L. 1889 – 1849

    Pflegel. 1849. —

    School chronicle written

    by Schultz.

    In Emilienheim land and

    waste land

    (passed the Matura, the hardest thing in life)

    Formerly Wrocław hymn

    books.

    (as a child always [wanted to] be a pastor. —)

    A son of Schultz''s a pastor in Germany.

    Post official, missionary, India, England, war, Denmark, Rostock.'
- page: 29
  en: 'The school community includes:

    Augustynow, Włodzimierow

    Michalinow, also Drzewce.

    [uncertain: vortüng Kr] about 1876

    To Volhynia emigrated

    4 brothers of Schulz,

    to the neighbourhood of [uncertain: Wolwachówka],

    Żytomierz district. Most of them

    moved there.

    Many went to America,

    came back, bought

    land or paid off

    what they had bought. A

    son of Schultz''s in Parkre is

    a farmer.

    The Drzewce estate, parcelled out:

    some Germans also

    took land, still before the Japanese war,

    about 1,900'

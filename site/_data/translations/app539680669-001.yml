  en: 'Estates:

    Białobłoty

    Leit = Leine (rope)

    übergreigeln = run over

    Müller

    54 years ago from St[illegible]pin

    to Germany to work.

    came together with a girl

    from Emilienheim

    and married. —

    Neu Czarkow, Briesen, Paprotk[illegible]

    also Brücher

    Psary consolidated in the year 1868

    In St[uncertain: y]pin 6 pieces each: about 1868


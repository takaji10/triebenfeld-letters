status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! After I had broken the carriage and very nearly my neck
    along with it, I have nevertheless arrived here at Kalisz safe and sound, though somewhat knocked
    about. The greatest loss is the time I require for the repair of my carriage, in order to be able
    to travel on with it. Court Councillor Grimm is lying miserably ill; he will work up everything for
    von Radzinski, for which, however, the contracts would be required. With Honrichs matters look ill
    — the man does not pay the 4000 Rthl, notwithstanding that everything has been receipted, struck off,
    and, with the consent of the [uncertain: kopillen — possibly Pupillen-Collegium, the board of wards]
    Collegium, brought into good order. Grimm means to hold him to payment forthwith by process of law
    — but he lacks the contract and a power of attorney — the contract is with Nochlitz, and he has likewise
    had a power of attorney for the prosecution of this affair.'
- page: 2
  en: May Your Most Serene Highness be pleased to issue the command that the contract be demanded back
    from Köckritz with the greatest despatch and sent off to Herr Grimm together with a power of attorney.
    At Trąbczin, I hear, other orders are being given which run directly counter to my plan. Thus one
    of the persons in command has lent out 100 Scheffel of corn to somebody, whereby Your Serene Highness
    will never get one of them back; a great part of the fields has also been sown. As soon as my carriage
    is mobile I shall [illegible] thither, in order to report the further particulars to Your Serene Highness.
    In deepest reverence I remain, until death, Your Most Serene Highness's, Kalisz, the 14th of November
    1804, humble and obedient servant, v Triebenfeld

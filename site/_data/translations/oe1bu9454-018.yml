- page: 2
  en: 'Maluce and of the Invalids'' Fund before the French General Direction — which thereupon ordered
    that only the 3121 Rthl out of the estates, together with costs and interest, were to be returned.
    In accordance with this decree it is I who can demand the monies back, not Your Serene Highness, for
    you are the party owing — I claim the interest, the accrued interest and the costs, which together
    amount to 4219 Rthl, and I demand that the same be recovered for me out of the arrears and interest
    of the subjects, upon which the Invalids'' Fund has now laid an attachment.


    Now in order to facilitate this matter and not first to have to seek out lengthy judicial assistance,
    Your Serene Highness should, on the advice of the komornik, declare:


    that, in accordance with the decree of the French General Government, you still owe to the Councillor
    of War and Forests von Triebenfeld the 3125 Rthl of interest taken from him by compulsion and arrest,
    which the Invalids'' Fund received on 14 February 1808 against a receipt'

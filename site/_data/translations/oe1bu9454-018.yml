- page: 3
  en: 'in receipt, and which the French General Government ordered to be [uncertain: Remtonschen] to the
    said Triebenfeld out of the revenues of the Zagorowo estate; and that the said von Triebenfeld has
    on that account not yet been satisfied, neither in respect of the capital he advanced nor of the costs
    and accrued interest.


    Since, then, the capital advanced, together with interest and costs, amounts to 4219 Rthl, you accordingly
    instruct the said Triebenfeld that he may draw this sum, to the amount of 4219. -, out of the old
    and new interest payments which the inhabitants of Wrąbczyn, Alt Olesnica, Kopojno, Skokum, Swiątniki,
    Adelow, Sophienthal and Neu Swięce have to pay, and may satisfy himself out of these funds.


    To that end you concede that this above-mentioned sum of 4219 Rthl may forthwith be recovered through
    a komornik, and consequently by the strictest execution, and be delivered into the hands of the said
    von Triebenfeld. This the komornik then has the Tribunal'

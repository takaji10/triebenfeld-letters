- page: 3
  en: 'and which the French General Government ordered to be [uncertain: reimbursed] to the said von Triebenfeld
    out of the revenues of the Zagórów estate, and that the said von Triebenfeld has in this respect been
    satisfied neither as regards the capital advanced nor as regards the costs and interest.


    Since, then, the capital advanced together with interest and costs amounts to 4,219 Rthl, you accordingly
    assign to Triebenfeld this sum, in the amount of 4,219 Rthl, out of the old and new interest which
    the inhabitants of Wrąbczyn, Alt Olesnica, Kopojno, Skokum, Swiątniki, Adelow, Sophienthal upon Alt
    and Neu Swięcia have to pay, [so that he may] draw upon it and pay himself out of these funds.


    To that end you concede that this above-mentioned sum of 4,219 Rthl may at once be collected in by
    a komornik, and consequently by the strictest execution, and be handed over to von Triebenfeld. This
    the komornik then has the Tribunal'

- page: 2
  en: 'Maluce and of the Invalids'' Fund before the French General Direction — this body has now ordered
    that only the 3,121 Rthl are to be returned out of the estates, together with costs and interest.
    [In accordance] with this decree it is I who can demand the monies back, not Your Serene Highness,
    for you are the party owing — I demand, over and above, the interest, the interest thereon and the
    costs, which together amount to 4,219 Rthl; I require that the same be collected in for me out of
    the arrears and the interest of the subjects, upon which the Invalids'' Fund has now laid arrest.


    Now in order to facilitate this matter, and not first to have to seek out lengthy judicial assistance,
    Your Serene Highness should, on the counsel of the komornik, declare:


    that you, in accordance with the decree of the French General Government, still owe to the Councillor
    of War and Forests von Triebenfeld the 3,125 Rthl etc. of interest taken from him by compulsion and
    arrest, which the Invalids'' Fund received against receipt on 14 February 1808,'

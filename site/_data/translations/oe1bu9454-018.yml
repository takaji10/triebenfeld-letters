- page: 1
  en: '18


    Most Serene Prince


    Most gracious Prince and Lord!


    I lay in the most violent fever when Your Serene Highness''s letter reached me; the sight of your
    hand cheered my sum, but how great was my astonishment when I [saw] the instrument that had been made
    out, together with the power of attorney — who has given Your Serene Highness this counsel? W here,
    what was to be collected in for Your Serene Highness, that would happen without any such instrument.
    I do, after all, hold a general power of attorney for that purpose. For you, unhappily, I can collect
    in nothing, for at this moment everything has been placed under arrest. Besides, you were indeed bound
    to pay the interest to the Invalids'' Fund.


    In Berlin I was dragged about Collé; when the French held me under arrest I had to pay, for Your Serene
    Highness, as your authorised representative. When I had been released from arrest I proved the unheard-of,
    unjust proceeding of the Intendant'

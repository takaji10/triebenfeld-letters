- page: 4
  en: 'approve, and then sees what he can recover or get hold of out of it ahead of the Invalids'' Fund.


    This is the only means of rescue for obtaining any money here at present, so as to keep the machine
    running. I am therefore sending my forester on horseback once again, and I beg Your Serene Highness
    in the most pressing manner to have the instrument drawn up in the manner described above with the
    utmost dispatch and to convey it to me by the messenger. I remain, until death,


    Your Serene Highness''s


    if I do not have the instrument here by the 15th, or at the very latest early on the 16th, then everything
    comes


    to an end and collapses


    altogether


    Humble and obedient three


    Blizanow


    the 6th of July 1812


    v Triebenfeld'

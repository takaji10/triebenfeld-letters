- page: 4
  en: 'approve, and then sees what he can collect in or lay hold of upon it ahead of the Invalids'' Fund.


    This is the only means of rescue for getting any money here at present, so as to keep the machine
    going. I therefore send my forester on horseback once again, and beg Your Serene Highness in the most
    pressing terms to have the instrument made out in the manner described above with the utmost dispatch,
    and to convey it to me by the messenger. I remain, until death,


    Your Serene Highness''s


    if I do not have the instrument here on the 15th, or at the very latest early on the 16th, then everything
    goes


    to ruin and falls to


    pieces.


    Blizanow


    6 July 1812


    Humble and obedient [uncertain: servant]


    v Triebenfeld'

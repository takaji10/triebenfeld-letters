- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I was lying in the most violent fever when Your Serene Highness''s letter reached me [uncertain: einigung];
    the sight of Your hand cheered my [uncertain: Summe]; but how great was my astonishment when I saw
    the instrument that had been drawn up, together with the power of attorney. Who gave Your Serene Highness
    this counsel? W here what is to be recovered for Your Serene Highness, that would be done without
    any such instrument. I have, after all, a general power of attorney for that purpose. For you I unfortunately
    cannot recover anything, for at this moment everything is laid under attachment. Besides, you were
    indeed bound to pay the interest to the Invalids'' Fund.


    I was dragged about in Berlin Collé; when the French held me under arrest I had to pay on Your Serene
    Highness''s behalf, as your authorised representative. When I had been released from arrest I demonstrated
    the unheard-of and unjust proceeding of the intendant'

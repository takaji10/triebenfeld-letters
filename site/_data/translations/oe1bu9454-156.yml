- page: 3
  en: '156 a)


    Copy.


    Your Serene Highness caused me to be assured, through the councillor of war von Triebenfeld [uncertain:
    Feld] to the Chancellor Hemuth, in the most binding terms, that at the Christmas just past I should
    quite infallibly receive the arrears of the settlement moneys for my children.


    In full confidence upon the word given me by Your [Serene Highness] I have disposed over this sum,
    payable already these two years, and now find myself in the embarrassment of not being able to keep
    my own word.


    By any further forbearance I should make myself answerable to my own children, and there remains to
    me therefore nothing further than to have the suit in Berlin continued, should payment not follow
    by the next post-day.


    Of this I most respectfully give Your [Serene Highness] notice herewith, and have the honour


    Breslau, 16th January


    1805.


    Countess von Schlabrendorff'

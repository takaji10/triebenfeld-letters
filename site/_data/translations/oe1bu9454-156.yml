- page: 4
  en: 'I have not yet wished to make use of General von Köckritz''s assistance, because Amelang thinks
    to get through without it.


    The General commends himself to Your Serene Highness in the most respectful manner.


    The free pass for 120 [uncertain: Eignier] of wine Your Serene Highness will doubtless already have
    there. In deepest submission I remain Your Serene Highness''s. Just now I hear that Bernhardi has
    played another knavish trick. He was to hand over the 3200 Rthl paid to him, together with 1200 Rthl
    next March, to my Professor Rhode. But this he has, in order to keep the moneys with himself, directed
    to the [uncertain: zu den] Liep Meyer; and this fellow now does not pay the money, and I am anew in
    embarrassment.


    Berlin, the 19th January


    1805.


    humble and obedient servant


    von Triebenfeld'

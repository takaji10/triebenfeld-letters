- page: 1
  en: '156


    Most Serene Prince,


    Most gracious Lord!


    If I had been able in any way whatever to obtain the 25000 rt without making the great transaction,
    I should long since have brought it about with the most glowing zeal.


    But if I take the lesser sum, it costs, and my hands are tied, because I must pledge the heavy papers
    for the small loans just as much as for the large ones. As yet I have no first assurance [uncertain:
    when] I am to receive the capitals. The papers are found good and the security sufficient, but there
    is delay, God knows why.


    I am certainly doing everything of which human powers are capable, and neither rest nor repose, [uncertain:
    in order] to reach the goal of all wishes. Only here nothing can be forced. Twice already we believed
    we had the money for certain, but an evil man has thwarted it; as I think,'
  names:

- page: 2
  en: 'it is young Eysenhardt — who claims to have 18000 rt to demand of Your Serene Highness as well;
    for these the Court Councillor Meyer will offer him the 20000 rt and take over the debt — I have declined
    this for the present — because the lawsuit concerning the [uncertain: jewels] is not yet decided,
    and because the 9000 rthl are registered on Szetlewek, so that he must be content with the interest,
    for the payment of which I have myself given an assurance. I shall do the same with the Ziemecki matter.
    Of Bernhardi''s conduct I say nothing — for he was minded to treat me worse than the greatest usurer
    in the state, and by an eleven-day delay put me in the very greatest embarrassment — God be praised,
    I have concluded the business as happily as I could have imagined, and let the peasant run.


    Should the Schlabrendorff woman be unmannerly, then everything here is provided for, and she would
    have every cause to repent a foolish conduct.'

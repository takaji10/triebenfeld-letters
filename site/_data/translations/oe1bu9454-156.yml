- page: 4
  en: 'Of the assistance of General von Köckritz I have not yet wished to make any use, because Amelang
    thinks to get through without it.


    The [illegible] General commends himself most respectfully to Your Serene Highness.


    The free pass for 120 [uncertain: buckets] of wine Your Serene Highness will doubtless already have
    there. In deepest reverence submission I remain Your Serene Highness''s. I hear this very moment that
    Bernhardi has played another knavish trick. He was to hand over the 3200 r. paid to him [uncertain:
    wäben] 1200 f[illegible] of next March to my Professor Rhode; but this, in order to keep the monies
    by him, he has assigned to the [uncertain: Liep] Meyer, and this fellow now does not pay the money,
    and I [uncertain: am] in embarrassment anew.


    Berlin, the 19th of January


    1805.


    humble and obedient servant


    v Triebenfeld'

- page: 2
  en: 'it is young Eyſenhardt — who also claims to have 18000 Rthl to demand of Your Serene Highness;
    for these the Court Councillor Meyer will assign him the 20000 Rthl and assume the debt — I have for
    the present refused this, because the lawsuit concerning the Janvelen is not yet decided, and because
    the 9000 Rthl are registered upon Szetlewek, so that he must be content with the interest, which I
    have myself given an assurance to pay him. I shall do just the same with the Ziemecki affair. Of Bernhardi''s
    conduct I say nothing — for he wished to treat me worse than the greatest usurer in the state, and
    by an eleven-day delay put me into the very greatest embarrassment — God be praised, I have buried
    the matter as happily as I could have thought, and let the peasant run.


    Should the Schlabrendorff woman be uncivil, provision has here been made for everything, and she and
    all of them would have a foolish conduct to repent of.'

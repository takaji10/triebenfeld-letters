- page: 3
  en: '156 a)


    Copy.


    Your Serene Highness caused the Chancellor Hemuth to be assured, through the Councillor of War von
    Triebenfeld, in the most binding terms, that at the Christmas now past I should quite infallibly receive
    the arrears of the settlement monies for my children.


    In full reliance upon the word [uncertain: given] me by Your [text lost], I have already disposed
    of this sum, payable these two years past, and [uncertain: beg] find myself now in the embarrassment
    of not being able to keep my own word.


    By any further forbearance I should make myself answerable to my own children, and there remains to
    me therefore nothing but to have the suit in Berlin continued, if payment should not follow by the
    next post day.


    Of this I most respectfully inform Your [Serene Highness] herewith, and have the honour, etc.


    Wrocław, 16th Jan.


    1805.


    Countess von Schlabrendorff'

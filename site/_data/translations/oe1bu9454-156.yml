status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! If I could obtain the 25000 Rthl in any manner whatever,
    without making the great transaction, I should long since have effected it with the most ardent zeal.
    But if I take the lesser sum, then it costs, and my hands are tied, because I must pledge the heavy
    papers for the small loan just as much as for the great one. As yet I have no first assurance where
    I am to obtain the capital sums. The papers are found good, and the security [uncertain: Lafficiat],
    but they delay, God knows why. I certainly do everything that human powers are capable of, and neither
    rest nor repose until the goal of all wishes is reached. Only here nothing can be forced. Twice already
    we believed we had the money for certain, but an evil man has thwarted it; as I think'
- page: 2
  en: it is the young Eyſenhardt — who claims to have 18000 Rthl to demand of Your Serene Highness as
    well; for these the Court Councillor Meyer will assign him the 20000 Rthl and take over the debt —
    I have for the present refused this — because the suit concerning the Janvelen is not yet decided,
    and because the 9000 Rthl are entered upon Szetlewek, wherefore he must be content with the interest,
    which I have myself given an assurance to pay him. In the same way shall I proceed with the Ziemecki
    affair. Of Bernhardi's conduct I say nothing — for he wished to treat me worse than the greatest usurer
    in the state, and by an eleven-day delay put me in the very greatest embarrassment — God be praised,
    I have buried the matter as happily as I could have thought, and let the peasant go his way. Should
    the Schlabrendorff woman be unmannerly, provision has here been made for everything, and she above
    all would have a foolish conduct to repent of.
- page: 3
  en: '156 a) Copy. Your Serene Highness caused me to be assured, through the Councillor of War von Triebenfeld
    to the Chancellor Hemuth, in the most binding terms, that at the past Christmas I should quite infallibly
    receive the arrears of the settlement moneys for my children. In full confidence in the word given
    me by Your Serene Highness, I have already disposed of this sum, payable these two years past, and
    I now find myself in the embarrassment of not being able to keep my own word. I should make myself
    answerable to my own children by any further indulgence, and there remains to me therefore nothing
    else but to have the suit in Berlin carried forward, if payment should not follow by the next post-day.
    This I hereby most submissively report to Your Serene Highness, and have the honour Breslau, 16th
    Jan: 1805. Countess von Schlabrendorff'
- page: 4
  en: 'Of General von Köckritz''s assistance I have not yet wished to make any use, because Amelang thinks
    to come through without it. The General commends himself most reverently to Your Serene Highness.
    The free pass for 120 Eimer of wine Your Serene Highness will doubtless already have there. In deepest
    reverence I remain, Your Serene Highness''s [text lost]


    I have just this moment heard that Bernhardi has played another knavish trick. He was to hand over
    the 3200 Rthl paid to him, together with 1200 Rthl prox. March, to my Professor Rhode; but this he
    has, in order to keep the moneys by him, assigned to the [illegible] Liep Meyer; and now this fellow
    does not pay the money, and I am in embarrassment anew. Berlin, the 19th January 1805. humble and
    obedient servant v Triebenfeld'

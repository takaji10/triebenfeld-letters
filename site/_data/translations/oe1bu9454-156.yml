- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    If I could have obtained the 25000 Rthl in any manner whatever, without making the great transaction,
    I should long since have effected it with the most burning zeal.


    But if I take the lesser [sum], it costs, and my hands are bound, because I must pledge the heavy
    papers for the small loan just as much as for the great one. As yet I have no first assurance [uncertain:
    from which] I am to obtain the capital sums. The papers are found good, and the security [uncertain:
    Lafficiat], but there is delay, God knows why.


    I am certainly doing everything that human powers are capable of, and take neither rest nor repose
    until the goal of all wishes be attained. Only, nothing here can be forced. Twice already we believed
    we had the money for certain, but an evil man has thwarted it; as I think'

status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord! Gladly do I endure all the gossip of fools, if only I may
    see Your Most Serene Highness's affair brought to the wished-for end; and that this will come about
    within a couple of months I pledge to Your Serene Highness upon my honour and my property. That grass-speaker
    will meanwhile do the least of all towards it, for I believe, and regard, the matter as settled. A
    man wholly insignificant and unknown will be the one to decide the affair. This I cannot entrust to
    paper — Each thing I have had the grace [text lost] to the Princess's Serene Highness [text lost]
    to convince of the truth. The whole affair will resolve itself of its own accord, and will be brought
    to an end for Your Most Serene Highness as honourably as it is advantageous — that an assessment of
    Your Serene Highness's estates is being obstructed springs from the source most fully known to Your
    Serene Highness
- page: 2
  en: and it is precisely from that quarter that the whole thing is to be called a mere matter of grace
    — My sense of honour, however, always rebels against everything that carries so much as an appearance
    of begging, and in this regard I go quite quietly and steadfastly forward along the straight road
    marked out for me; and I am certain that, for all the prattle, I shall reach the goal of my wishes.
    The Monarch wishes Your Most Serene Highness well, and the exchange has the King's approval, provided
    the estates hold the balance one against the other — thus the balance is what decides it — and the
    King's friendship does no more here than that, for estates lying far off, nearer ones are given; and
    to thank the Monarch for that is no disgrace. As for the equality of the estates, provision has been
    made — and in this way everything will come about of itself. Count Schlabrendorff I have persuaded
    so far that he will take from me, for the interest payable to him, a bill of exchange payable in a
    year's time. I go to him on Sunday to conclude this business. Everything else I shall attend to in
    the best manner. For the rest, I still note humbly that Prittwitz
- page: 3
  en: 'is a pitiable liar — the man said not a word further to me, and that in the presence of Wildegans
    — save: My God, Her Serene Highness torments me, I am to take the matter in hand — I have already
    told the gentleman that I cannot do this, and I shall write it once more to Her Serene Highness. Since
    I now knew everything better, I let the fool talk and sought to advance the matter for myself. My
    sense of honour would never permit speeches of this kind, and the discourse could not have ended so
    humiliatingly on my side as he wishes to boast. Behind my back, however, the man may say what he pleases;
    I shall bear it all in silence, gladly and willingly, until we are at the goal of our wishes — Let
    Your Serene Highness grant me only the continuance of Your most high good will, and so I remain, until
    death, Your Most Serene Highness''s. About the 16th of April I go from here to Berlin, where I remain
    until the end of May. The estates which I sold to Prince George now come out, according to a valuation
    by a Justice and Chamber Councillor, at over 700000 Rthl, etc. As it was intended that the gentlemen
    [uncertain: should be brought down] through me by some 500000 Rthl, I am too good-natured a simpleton
    and often do harm to myself and to my children. Breslau, the 3rd of April 1799, most faithful and
    humble servant v. Triebenfeld'

status: draft
segments:
- page: 1
  en: 'On behalf of the Venerable Ląd Convent, against the Illustrious Prusimski, Starost of Niszczewice
    — a Report


    Having come in person to the present Office and Records of the Konin Municipal Court, the Honest Simon
    Głabik of Drzewce, General Royal Process Server, sound [of mind], acknowledged that he had served
    authenticated Citation Letters for the Ordinary General Sessions of the Crown Tribunal of the Kingdom
    at Piotrków below-written, of the following tenor:


    Stanisław August, by the Grace of God, King of Poland, Grand Duke of Lithuania, Russia, Prussia, Masovia,
    Samogitia, Kyiv, Volhynia, Podolia, Podlachia, Livonia, Smolensk, Severia, and Chernihiv — to the
    Illustrious Magnificent Antoni Prusimski, Starost of Niszczewice, Heir of the estate of Trąbczyn,
    concerning the cause below-written and all his estates generally — we command: that before Us and
    Our Ordinary General Court of the Crown Tribunal of the Kingdom at Piotrków, exactly within four weeks
    [uncertain: seco], then when and at such time as the present cause shall fall to be judged when called,
    you appear in person and peremptorily — at the instance of the Most Illustrious Most Reverend Benedykt
    Lubstowski of Ląd, Abbot of the Sacred Cistercian Order''s Convent of Ląd, and of the entire same
    Convent, Heirs of the estates of'
- page: 2
  en: 'Drzewce — Plaintiffs. Which Plaintiffs, adhering to their own [documents], cite themselves, or
    rather summon [parties] to the joinder of the cause with the Heir of the estates of Łukomia and others;
    and this to see and hear themselves, the Plaintiffs, [declared free] from the alleged counterclaim,
    and [uncertain: A] with the Heir of the estates of Łukomia, the documents having been considered —
    namely the Tribunal Decrees and the Survey of the Year of the Lord 1592, approved by those same Decrees
    — [to be] declared free [from the accusation], the penalties of the alleged counterclaim to be extended
    [to Prusimski], and court expenses to be found refundable; and other matters to be pursued for the
    cause and responded to judicially. Given at Piotrków, on the 4th day of January, in the Year of the
    Lord 1782. In the manor of the estate of Trąbczyn, upon the table in the heated room, a maidservant
    present, on this very day, having placed the contents of the present Acts and having left notification.'

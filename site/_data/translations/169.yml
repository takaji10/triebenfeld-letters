status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Gracious Lord! The Minister v Voss has, in the most despotic expressions, forbidden
    any revision of the assessments; let them bear what names they will and belong to whom they will,
    the Chamber is to reject them. Now I await only Amelang''s answer — whether one will be content with
    the Landrath''s revision. If this too be refused, then I must think of other means — and set light
    against despotism. The dismemberment has now been submitted; the President is sending a Councillor
    to Zagorow for Trąbczin, who is to inspect everything, whereupon the consent will then be granted.
    The revision on account of the dismemberment I shall know how to make use of. With Herr Meierowitz
    I have concluded, as the figure shows, and am endeavouring to dislodge Honrichs — I think the affair
    will give Your Serene Highness pleasure: You receive Your 4000 Rthl back and profit yearly by 500
    Rthl canon, or in lieu thereof 10000 Rthl in cash. Weigel receives out of the eight thousand, over
    and above his 4000 Rthl,'
- page: 2
  en: '6000 Rthl the Schliefen and 6000 Rthl Honrichs, that makes 20000 Rthl purchase money. Szetlewek
    Radzinski will not let slip from him. He offers, first, 18000 Rthl entry money and the one (113[?]
    of the 18000; from these I reckon off his claims — 5 — he must lay down 10000 Rthl in cash), some
    hereditary term of years 1500 Rthl, which makes together 48000 Rthl; that is, God knows, a great deal
    for this wretched little place which has only 1700 Morgen of surface area, together with the peasant
    holdings and in part quite poor soil — We are still disputing only over the pasture, for he wants
    to have free grazing [uncertain: Epprech] with his cattle in the remaining woodland — here too I should
    in the end fix upon a middle course. Both parties in question, then, already in ready money 14000
    Rthl, apart from the canon — and Radzinski''s claim is extinguished and all lawsuits quashed. With
    the Olesnica people I shall soon be done — I now have important assistance — My opinion now is to
    have the fellows thrown out. To take from the newer subjects the 10000 Rthl and let them be seated,
    since they have already paid 10000 Rthl. Thereafter to come to terms with the old peasants, to bring
    together enough holdings that the demesne farm is restored, in order then to let Olesnica out afresh
    on hereditary lease according to the mind of the Chamber'
- page: 3
  en: '— to take again a further 8 to 10000 Rthl and there to fix the canon — these then already come
    together to 44000 Rthl. For the propination rights I obtain a lease, moreover a three-year lease contract,
    yearly 4000 Rthl. Arrears outstanding /Olesnica people and others/ 2000 Rthl. That is 50000 Rthl.
    Takers and people who fit into the dismemberment plan are here in superfluity, and hell would have
    to burst if I were not to have 80000 Rthl here by the 1st of July. This is a [uncertain: little estate]
    of 130000 Rthl, and with that all ways may be met until more comes in from the purchasers. Should
    one therefore in Berlin not accept the Landrath''s attestation as sufficient, then I shall not hesitate;
    for once I have dismembered, all the administrative accounts in the assessments fall away accordingly
    — There remain pure clean interest payments; there no revision is needed, no principles — for the
    Chamber has after all approved everything, and I attain the purpose better than by a heated revision
    — and need no Amelang or'
- page: 4
  en: 'other firebrand — the fellow behaves as though he had devoured Solomon''s wisdom, preaches morality
    in his letters, counsels the greatest circumspection, and so forth. He fears the world might learn
    that he and his games are arrant knaves — that Goldstücker has pledged the Glenck mortgage on Olesnica
    with Oppenheimer: over this the man learns and writes me four pages thick full. For it had been promised
    that, if the loan were granted by the Invalids'' Fund, then the holder of that mortgage should concede
    priority; now the patron has learnt that Goldstücker has ceded the mortgage to Oppenheimer, whereupon
    the man asked Oppenheimer whether he would concede the priority; this the Jew refused, and thereupon
    [uncertain: Arnden] raises an outcry as if the weal and woe of the world depended upon it. The Przespolewski
    affair will be brought to a good conclusion. With Glenck''s stories may Your Serene Highness deign
    to spare me altogether, for I lose my senses at such human conduct — because Sprengel claims to have
    found his 18 Morgen, You are to pay the fellow over again — Spreng and yet another such rascal have
    here again sued for 761 Rthl of old arrears; Chwalowski receives 800 Rthl — the dogs might indeed
    have squandered a principality. I remain, until death, Your Serene Highness''s Kalisz, the 10th of
    March 1805. most faithful servant v Triebenfeld'

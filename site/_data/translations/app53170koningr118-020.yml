status: draft
segments:
- page: 1
  en: 'For the part of the Illustrious Prusimski, Starost of Niszczewice — Requisition of the Report issued
    on the part of the Illustrious Chełmski [for the Crown Tribunal at Piotrków]


    Having come in person to the present Office and Records of the Konin Municipal Court, the Honourable
    Piotr Gosławski, Plenipotentiary of the Illustrious Magnificent Antoni Prusimski, Starost of Niszczewice,
    in the name of the same Magnificent Principal of his — sound [of mind] — acknowledged: that he, having
    with him two Nobles, namely the Honourables Tomasz Reczkowski and Jakub Bogusławski, although present
    here — at the instance and official requisition of the Illustrious Magnificent Antoni of Kolno Prusimski,
    Starost of Niszczewice, Knight of the Order of Saint Stanislaus, Heir of the estates of Trąbczyn,
    Trąbczynka, and others — had descended here to the present Chancellery with the above-mentioned Nobles,
    and there requisitioned from the present Office and requested the production [of the document]: whether
    the Citation Return in the estates of Trąbczyn, on the part of,'
- page: 2
  en: 'the Illustrious Stanisław Chełmski, Treasurer of Wschowa, Heir of the estates of Łukomia and others,
    against the Illustrious Magnificent Principal of his [the] Requisitioner, for the Ordinary General
    Sessions of the Crown Tribunal of the Kingdom at Piotrków — issued — was recognised before the present
    Records or not. To which Requisition the present Office, consenting, wished to produce the same. Therefore
    the present [document] attests to the non-existence of that same recognised Report and the impossibility
    of its production.


    Petrus Gosławski'

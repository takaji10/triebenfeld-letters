segments:
- page: 1
  en: 'We Friedrich Wilhelm, by the Grace of God King of Prussia etc., do hereby certify and declare by
    this Our open letter, for Ourselves and Our descendants and successors in the Crown, the Electorate
    and Our remaining lands, that, after it had been most humbly laid before Us in what manner Our intention
    — namely to give to the High-Born Prince, Our friendly beloved uncle Friedrich Ludwig, reigning Prince
    of Hohenlohe-Ingelfingen, by the grant of the estates formerly belonging to the absconded former Starosta
    von Prusimski, a token of the friendship and benevolence We bear towards him, and likewise of Our
    Royal gratitude for the distinguished and fruitful services rendered to Us and to Our Royal House
    — had not been attained entirely as We had willed, because the said estates had been burdened with
    many debts, We have most highly resolved to leave over, to grant and to convey to His Lordship, as
    heritable property of his own, the hereinafter named formerly ecclesiastical estates, namely the villages
    of Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno, Olesnica,
    Drzewce, Grądzyń, Wrąbczyn, Wieniec and Wolica, together with all their appurtenances, whatever names
    these may bear, against the payment


    1.) of the sovereign territorial dues hitherto discharged therefrom, as a fixed and unalterable canon,
    and


    2.) of the stipend due therefrom to the ecclesiastical corporations or foundations.'

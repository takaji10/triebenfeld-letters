- page: 2
  en: 'We also do so hereby, and by virtue of this present, out of Royal power and plenitude, for Ourselves
    and Our descendants and successors in the Crown, the Electorate and Our remaining lands, in such manner
    and to this effect: that Our above-mentioned friendly beloved uncle, the reigning Prince of Hohenlohe-Ingelfingen,
    shall irrevocably have, possess and enjoy the above-named estates, with all rights and privileges
    attaching thereto, as these have hitherto been exercised or may lawfully be exercised, and no less
    with all their appurtenances (Portinentzien) and other accessories, whatever names these may bear,
    just as the same have hitherto been used or may lawfully be used, and with all the lands belonging
    thereto in fields, woodlands and meadows, likewise in ponds and waters, from henceforth for all eternity,
    for himself and his descendants and heirs, as a true, well-acquired and unrestricted property, from
    Us and Our descendants and successors; and that there shall likewise be attached to him the power
    and authority to dispose thereof at pleasure under the conditions mentioned above, without hindrance
    from any person. We therefore command and enjoin all Our supreme provincial collegia, as also all
    other authorities whom this concerns, herewith as graciously as earnestly, that they in no wise hinder
    or trouble either the oft-mentioned Lord Prince of Hohenlohe-Ingelfingen''s Lordship in the heritable
    and proprietary possession granted to him of the above-named estates, together with their appurtenances
    and accessories, nor him or those'
  names:
  - de: Fürst von Hohenlohe Ingelfingen
    en: Prince of Hohenlohe-Ingelfingen
    kind: person
- page: 3
  en: 'upon whom he may one day bequeath the same, or to whom he may otherwise lawfully transfer them
    by other acts inter vivos aut mortis causa, but rather shall let His Lordship, and eventually them
    also, enjoy the same freely and undisturbed; that they themselves do nothing to the contrary, nor
    occasion or permit such to be done by others, on pain of Our most high displeasure and of unfailing
    severe punishment. In witness whereof etc. Given at Berlin, 10 [uncertain: f.] June 1797.


    Friedrich Willhelm


    Deed of grant for the reigning Prince of Hohenlohe-Ingelfingen, to the heritable and proprietary possession
    of the villages of Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki,
    Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienietz and Wolica, together with appurtenances.


    Hoym. Reck.


    That the foregoing copy is entirely identical with and conformable to the original is hereby attested,
    sub sigillo judiciali, in fidem. Breslau, the 18th February 1802. Sonnabend, Judge-Advocate of the
    Princely Hohenlohe Infantry Regiment.'

- page: 2
  en: 'Your Highness is pleased to command that I should not let the business with Stössel and Weigel
    drop, and for this reason I send the Wartensleben letter — from which Your Serene Highness will be
    pleased to gather that everything depends solely upon a letter to Stössel from Your Highness, and
    = that Your Serene Highness would have no other expedient for satisfying him = and Weigel than by
    means of the estates in = the Duchy of Warsaw. = Should this be agreeable to him /Stössel/, he would
    be requested to enter into negotiation on that head with Triebenfeld and = to view the estates. Whether
    and what Your Serene Highness is minded to do I leave entirely to your most highly enlightened discretion;
    I only beg to be most graciously instructed on the point.


    That, for the rest, no moneys are at present to be drawn from the estates is no fault of mine. It
    is the general distress, which afflicts even the most propertied and most well-to-do and presses them
    to the ground. That the lawsuit is further buried or won [uncertain: is] just as little my fault.
    — Through a whole year I have laboured for Your Serene Highness''s welfare and [illegible] with the
    most glowing zeal, worked without measure, and for that suffered, together with my own family, the
    most boundless distress. — The registrations of the lawsuits are'

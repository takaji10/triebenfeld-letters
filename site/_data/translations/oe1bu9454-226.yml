- page: 2
  en: 'you most highly deign to command that I am not to let the business with Stössel and Weigel drop,
    and on this ground I send the Wartensleben letter — from which Your Serene Highness will please to
    gather that everything turns simply upon a letter to Stössel from Your Most Serene Self, and = that
    Your Serene Highness would have no other way out of satisfying him = and Weigel than by means of the
    estates in the = Duchy of Warsaw = Should this be agreeable to him / to Stössel /, he would be requested
    to enter into negotiations on that head with Triebenfeld and = to inspect the estates. Whether and
    what Your Serene Highness is minded to do I leave entirely to your most highly enlightened discretion;
    I only beg to be most graciously instructed on the point — That, for the rest, no monies are now to
    be drawn from the estates, is not my fault. It is the general distress which presses down and overwhelms
    even the [uncertain: wealthiest] and most well-to-do — that, further, the lawsuit is neither concluded
    nor won is just as little my fault. — For a whole year I have laboured for Your Serene Highness''s
    welfare and [illegible] with the most ardent zeal. Worked tirelessly, and for that have suffered,
    with my own family, the most boundless distress — the registrations of the lawsuits are'

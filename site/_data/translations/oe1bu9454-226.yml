- page: 3
  en: 'made; I have called upon heaven and hell to bring the matters onto the court table — gifts and
    presents avail nothing; what am I to do further? — Already many great talkers have [uncertain: taken
    themselves for knights] in these affairs, meaning to win everything and to bring about the end. —
    At the first onset every one of them still ran his nose against the rock; the consequence was that
    each made [uncertain: a Prussian lament] and always left me standing alone. — If, however, Your Serene
    Highness has anyone who understands it better than I, send him here to conduct the business; with
    the most faithful heart I will gladly still point out everything to him, and lay down my pen. The
    reproach which Your Serene Highness is pleased to make me on account of the lawsuits touches my heart
    too nearly; it is a dagger-thrust to me, and from you all too unexpected. — Accustomed to unjust censure,
    I should look on unmoved while any babbler there spat his venom behind my back. Only from Your Serene
    Highness does a reproach of that kind still wound too mortally, and you compel me to be what I have
    hitherto been to you with the heart most faithful to me [uncertain: to you].


    The Wartensleben letter I beg to have returned by this same messenger. For the rest, the Prefecture
    demands the original instrument concerning the Zagorowo estates (as the one concerning Trąbczyn and
    Betsche is here); according to the accompanying rescript, should these not be produced, the estates
    will be confiscated!'

  en: '226


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most highly esteemed letter I have received, together with the several
    enclosures, by the returning foot-messenger. [uncertain: When, and it,] my first messenger, who was
    to have set out from there on the 9th and to have arrived here on the 12th, nor Sommer, and still
    less General Schimmelpfennig, have presented themselves here, I must believe that the plan for an
    exchange transaction with General Schimmelpfennig has come to nothing, or that obstacles have [uncertain:
    been stepped] into the way which must first be cleared out of it. In the meantime I have, in accordance
    with Your Most Serene Highness''s commands, instructed every individual how he is to play his part
    upon the arrival of General v. S. Whether, for the rest, the plan with Sch. is truly useful for Your
    Serene Highness and fully consistent with your sense of honour, upon that I am not to judge further,
    but fall silent in reverence, and follow, so far as it lies in my power, your most highly enlightened
    directions. This very thing is the motive of the present express dispatch of a letter from Count v.
    Wartensleben, who is the most intimate friend of old Stössel and on whose behalf I first set the matter
    in train.'

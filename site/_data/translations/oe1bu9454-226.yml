- page: 4
  en: 'I beg Your Serene Highness most graciously to send it along by this express courier.


    In conclusion I enquire most obediently whether the lawsuit concerning the Trąbczyn estates is to
    be carried on, or whether one should have regard to the events of the times and await the outcome
    of the matter? The matter is not one to be lost — In deep abasement I remain Your Serene Highness''s


    Blizanow


    the 20th of December 1811


    most humble and obedient


    v. Triebenfeld'

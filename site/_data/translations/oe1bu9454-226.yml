- page: 3
  en: 'made; I have moved heaven and hell to bring the matters onto the court''s table — presents and
    gifts avail nothing; what more am I to do? — Already many [uncertain: boasters have at the outset]
    to these affairs been going to win everything and bring about the end — at the first onset everyone
    still ran his nose against the rock, the consequence being that everyone made [illegible] and always
    left me standing alone — If, however, Your Serene Highness has anyone who understands it better than
    I, send him here to conduct the business; with the most faithful heart I shall gladly point out everything
    to him and lay down the pen. The reproach which Your Serene Highness is pleased to make me on account
    of the lawsuits touches my heart too nearly, it is a dagger-thrust to me, and from you all too unexpected
    — Accustomed to unjust censure, I would see any prattler there spew his slaver after me unmoved. Only
    from Your Serene Highness alone does a reproach of that kind wound too mortally, and you compel me
    to be that which I have hitherto been to you with the heart most [uncertain: humbly] faithful to me.
    The Wartensleben letter I beg to have back only by this messenger — For the rest, the [uncertain:
    Prefecture] demands the original deed of the Zagórów estates / the one concerning Trąbczyn Pszczew
    is here / according to the accompanying rescript — should this not be produced, the estates will be
    confiscated!'

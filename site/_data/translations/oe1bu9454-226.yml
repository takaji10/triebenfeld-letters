- page: 4
  en: 'Your Serene Highness I beg most graciously to send the same along by this express.


    In conclusion I enquire most obediently whether the lawsuit concerning the Trąbczyn estates is to
    be carried on, or whether one should look to the events of the times and await the matter? The case
    is not to be lost. In deep abasement there remain, Your Serene Highness''s


    Blizanow


    the 20th of December 1811


    most humble and obedient


    v. Triebenfeld'

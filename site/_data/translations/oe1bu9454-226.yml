- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most highly esteemed letter I have received, together with the various
    enclosures, by the returning foot-messenger. Since neither my first messenger, who was to have set
    out from there on the 9th and to arrive here on the 12th, nor Sommer, and still less General Schimmelpfenning,
    has presented himself here, I must believe that the plan concerning an exchange transaction with General
    Schimmelpfennig has come to nothing, or that obstacles have arisen which must first be cleared out
    of the way. In the meantime I have, in accordance with Your Most Serene Highness''s commands, instructed
    every individual how he is to play his part upon the arrival of General von S. Whether, for the rest,
    the plan with Sch. is truly advantageous for Your Serene Highness and fully consistent with your sense
    of honour — upon that I have no further judgement to offer, but fall silent in reverence, and follow,
    so far as it lies within my power, your most highly enlightened instructions. This very thing is the
    motive for the present express dispatch of a letter from Count von Wartensleben, who is the most intimate
    friend of old Stössel, and for whom I first set the matter in train.'

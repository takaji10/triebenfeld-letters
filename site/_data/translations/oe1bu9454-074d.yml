segments:
- page: 1
  en: 'What the Royal General Invalids'' Fund has submitted against the Royal Councillor of War and Forests
    Mr. von Triebenfeld, concerning the laying of an attachment upon the legacy of 80000 Rthl bequeathed
    to the Prince of Hohenlohe-Ingelfingen by the late Princess von Sacken, and has requested to be ordered,
    we give him to see from the submission of the 30th of last month enclosed here in copy.


    Since we have now granted the attachment sought, in the circumstances arising, as the enclosure in
    copy shews more fully, and, for the justification thereof as also for the instruction of the matter,
    have appointed a hearing for the 23rd of August, in the forenoon at 10 o''clock, before the Councillor
    of the High Court of Appeal Koitsch, we hereby command the Royal Councillor of War and Forests Mr.
    von Triebenfeld to present himself at the appointed time at the High Court of Appeal in person, or
    through one of the judicial commissioners appointed at the High Court of Appeal, to declare himself
    upon the means of attestation to be brought forward by the opposing party on behalf of his claim,
    and generally upon objections [uncertain: upon] whatever he has to urge against the attachment imposed,
    to state the damage that may perhaps be impending upon him therefrom, and to indicate how high in
    his opinion the security is to be fixed. At the same time Mr. von Triebenfeld has then also to enter
    into amicable negotiation with the plaintiff, if not in the principal matter yet in the matter of
    the attachment, particularly should the latter perhaps demand the lifting of the attachment against
    a surety.


    If Mr. von Triebenfeld does not appear at the appointed hearing, he has unfailingly to expect that,
    in punishment of his disobedience, the attachment imposed will be left standing, and that he will
    be referred with such objections as he may have to the hearing of instruction in the principal matter,
    that judgment will be given according to the plaintiff''s motion.


    Berlin, the 1st of August 1811.


    Royal Prussian High Court of Appeal


    Woldermann


    To the Royal Councillor of War and Forests


    Mr. von Triebenfeld


    at Kontop near Grüneberg


    in Silesia


    Stoewersand'

segments:
- page: 1
  en: 'What the Royal General Invalids'' Fund has submitted against the Royal Councillor of War and Forests
    Mr von Triebenfeld, concerning the laying of an arrest upon the legacy of 80000 rt. bequeathed to
    the Prince of Hohenlohe-Ingelfingen by the late Princess von Sacken, and has requested be ordered,
    we give him to see from the submission of the 30th of last month, annexed in copy.


    Since we have now granted the arrest applied for, in the circumstances arising, as the annexure in
    copy sets out more fully, and have, for its justification and also for the instruction of the matter,
    appointed a hearing for the 23rd of August at 10 o''clock in the forenoon before the Court of Appeal
    Councillor Roitsch, we hereby command the Royal Councillor of War and Forests Mr von Triebenfeld to
    present himself at the appointed time at the Court of Appeal in person, or through one of the justice
    commissioners appointed at the Court of Appeal, to declare himself upon the means of proof to be brought
    forward by the opposing party on behalf of his claim, and generally [uncertain: upon the objections]
    as to what he has to object against the arrest imposed, to state the damage which may be impending
    upon him from the same, and to indicate at how high, in his opinion, the caution is to be fixed. At
    the same time Mr von Triebenfeld has then also to enter into amicable negotiation with the plaintiff,
    if not in the principal matter, then at least in the matter of the arrest, particularly should the
    latter demand the lifting of the arrest, perhaps against surety.


    If Mr von Triebenfeld does not appear at the appointed hearing, he has unfailingly to expect that,
    in punishment of his disobedience, the arrest imposed will be left standing, and that he will be referred
    with such objections as he may have to the hearing of instruction in the principal matter, according
    to the plaintiff''s application it will be adjudged.


    Berlin, the 1st of August 1811.


    Royal Prussian Court of Appeal


    Woldermann


    To


    the Royal Councillor of War and Forests


    Mr von Triebenfeld


    at Konotop near Zielona Góra


    in Silesia


    Stoewersand'

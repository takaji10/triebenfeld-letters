- page: 1
  en: 'What the Royal General Invalids'' Fund has represented against the Royal Councillor of War and
    Forests Herr von Triebenfeld concerning the laying of an arrest upon the legacy of 80000 Rthl bequeathed
    to the Prince of Hohenlohe Ingelfingen by the late Princess von Sacken, and has requested to be ordered,
    this we give him to see from the representation of the 30th of last month, enclosed in copy. Since
    we have now granted the requested arrest in view of the circumstances arising, as the enclosure in
    copy shows at greater length, and have also, for its justification as well as for the instruction
    of the matter, appointed a term for the 23rd of August at 10 o''clock in the forenoon before the Kammergerichtsrath
    Koitsch, we hereby command the Royal Councillor of War and Forests Herr von Triebenfeld to present
    himself at the appointed time at the Cammergericht in person, or by one of the justice-commissioners
    appointed at the Cammergericht, to declare himself upon the means of certification to be brought forward
    by the opposing party in respect of his claim, and generally upon [uncertain: objections] — whatever
    he has to object against the arrest imposed —, to state the damage that may be impending for him from
    the same, and to indicate at what amount, in his opinion, the security is to be fixed. At the same
    time Herr v. Triebenfeld has then also to enter into amicable negotiation with the plaintiff, if not
    in the principal matter, at least in the matter of the arrest, particularly should the latter perhaps
    demand the lifting of the arrest against surety. If Herr von Triebenfeld does not appear at the appointed
    term, he has unfailingly to expect that, in punishment of his disobedience, the arrest imposed will
    be left standing, and he will be referred with such objections as he may have to the term of instruction
    in the principal matter, [that] judgment will be given according to the plaintiff''s motion. Berlin,
    the 1st of August 1811. Royal Prussian Cammergericht Woldermann To the Royal Councillor of War and
    Forests Herr von Triebenfeld at Grünberg in Silesia — at Kontop near Grüneberg in Silesia Stoewersand'

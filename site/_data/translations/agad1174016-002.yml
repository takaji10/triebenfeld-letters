- page: 1
  en: 'Protocol


    of the Resolutions and all Decisions of the Governing Commission issued during its stay at Dresden,
    both to the General Directory and to the Directors in particular


    Resolution by which the Hereditary Estates of Michalina Dąmbska, of G[enera]l Niemoiewski and of Wichrowski,
    confiscated by the Prussian Government, are brought under the Judgment of the Most Serene Emperor
    issued in favour of the Most Illustrious Wybicki:


    The Governing Commission


    July 21


    Whereas the matter of Mrs Michalina Dambska, née Prusińska, who demands the return of her Hereditary
    Estates, confiscated under the past Government and given to someone else, has been referred to Us
    by the Most Serene Emperor; taking example from the justice dispensed by His Imperial and Royal Majesty
    to the Most Illustrious Wybicki, Our Colleague, by the Decree issued at Finkenstein on the 5th of
    June, and wishing in so just a demand to preserve strict justice for everyone, We extend the Judgment
    of the Most Serene Emperor in favour of the Most Illustrious Wybicki both to the case of Mrs Michalina
    Dambska and to those of General Niemojewski and Mr Wichrowski, desiring that the hereditary Estates
    of the Persons named above, confiscated by the late Prussian Government, should return to their true
    Owners. — Done at Dresden at the Session of 21 July 1807.


    Stanisław Małachowski, President


    Jan Łuszczewski, Secretary General'

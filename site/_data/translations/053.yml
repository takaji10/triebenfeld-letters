status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness''s two letters of
    the 24th and 29th of last month I received today together. Submissively I reply that in the inheritance
    matter no resolution has yet been given, but rather that the whole affair, with the opinion of the
    upright and honest Chamber Court and of the Cabinet Councillor Albrecht, lies before His Excellency
    the [uncertain: Gr. K. Beym], from whom the Queen''s Majesty awaits it most eagerly. With regard to
    Your Serene Highness''s domestic affairs, and especially concerning the so-called distraint business,
    whatever Your Highness could only for the present wish will follow. As concerns the war affairs, there
    Your Serene Highness is yourself at fault; your friends have long since most earnestly advised you
    that you should write to His Majesty in a straightforward tone and beg for the conclusion of the matter,
    but in doing so should go to work openly in the matter itself and pay compliments to no one. Your
    Serene Highness''s most honest and most faithful friend here is the truly upright Major von Pirch;
    this is, by God, a rare, honest and thoroughly upright man, who pursues your cause better than Your
    Serene Highness yourself, guides it with wisdom, and judges and sees through it with the keen eye
    of the most expert man. His Excellency General v. Köckritz means very well, only this good gentleman
    cannot be as effective in the business as he might well wish. Haacke and others are well disposed,
    because the noble, upright Major Pirch directs them and steers them to the point. Massenbach has written
    to His Majesty and begged for the conclusion of his affair. He appeals to General von Scharnhorst;
    the latter has'
- page: 2
  en: 'unfortunately the fever, and so the whole affair hangs. For the rest, most gracious Prince and
    Lord, I implore you yourself: follow the counsel of truly upright friends; write to the King and beg
    for the swift conclusion of your affair. But answer the Commission quite openly, [uncertain: do house
    of another''s sin], and pay compliments to no one. You must in earnest risk that the staff be broken
    over [text lost] — one departs on no account from the form. Reports from the [uncertain: armies] are
    altogether wanting here. There is in this an ever-continuing alternation, like ebb and flood. — With
    the greatest certainty it may be assumed that the loss of the Austrians cannot be so great as the
    Consul here had it trumpeted abroad a few days ago, according to which the French army was to be in
    Vienna within 8 days and the whole Austrian army already now totally cut to pieces. — Just so, the
    Russian declaration does not appear to be so grave as the Consul here had it distributed in all quarters
    as a true declaration of war. — Russia, according to the true sense of it, is only breaking off all
    diplomatic negotiations with Austria, because the latter cannot enter upon the proposed peace negotiations.
    — Schill, according to the reports which came in here yesterday, has already done a bold stroke: cut
    two regiments of French and Westphalians quite to pieces, taken 4 cannon with him, and is hastening
    to Cassel and from there to Hanover, where the English troops are said already to have arrived. He
    signs himself Major General of the first Brunswick [uncertain: Hanoverian] Division. Once more I beg
    Your Serene Highness heartily: write to the Monarch, spare no one in the questions, and be then assured
    that your wishes will come to fulfilment. Full of reverence as a servant I remain Your Most Serene
    Highness''s Königsberg, the 13th of May 1809 truly humble and obedient servant Peter'

  en: '30


    Copy. Your Most Serene Highness''s most gracious letter I received here in Berlin; I should long since
    have answered the same, had I not been held under arrest under strict French guard. A fate I never
    deserved, and one which has given my civil existence a very crooked turn.


    At the end of December I was sent here from Memel with weighty commissions, and I was already near
    the goal of my wishes, so as to be able to depart again shortly, when, without my suspecting it, two
    French gendarmes were sent into my lodgings with the order "that they should hold me under strict
    watch and arrest until I, as general attorney of the Prince of Hohenlohe, should have paid all the
    arrears of interest on the 50,000 Rthl borrowed from the Invalids'' Fund." Terror and shame at this
    occurrence nearly brought me to the most desperate resolution; the arrears of interest amounted for
    2 years to 5,000 Rthl — whence was I to take these, amid the dreadful want of money, in order to [uncertain:
    seinehe], since there are no Royal treasuries here, and all revenues are in the hands of the French
    authorities. I proved, with all the jurists, that I was not the debtor. I produced the judicial instrument
    showing that the banker Oppenheimer had, against a discount of 7 per cent, already 3 years ago undertaken
    to pay this item to the Invalids'' Fund, that he had had it entered in his'

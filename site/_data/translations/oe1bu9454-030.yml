- page: 3
  en: 'so that I may take back the [uncertain: Kontazen] mortgage of 10,000 pledged for it from the possession,
    and thereby help myself. But may Your Serene Highness be pleased to endorse the order to pay over
    to me, or yourself to note upon it that You have drawn no money upon it and have sent the same back.
    I shall then press at once for the return of my mortgage, and hope in exchange to obtain the money
    here from a certain General''s wife von Blucher, in order to satisfy the banker, or in cash. The noble
    Minister von Zastrow is working with me before the French authority that the Trąbczyn estates be returned
    to Your Serene Highness; and had this shameful occurrence not befallen me, I should by this time already
    have been in Petersburg, and might there have effected much through the Grand Duke. In the confident
    hope of a very speedy granting of my exceedingly urgent request, I remain, until death,


    Your Serene Highness''s — Berlin


    14 March 1808.


    humble and obedient servant


    von Triebenfeld'

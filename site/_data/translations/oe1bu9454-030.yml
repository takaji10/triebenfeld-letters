- page: 2
  en: 'name, and that he must pay. I proved further that Your Serene Highness yourself had for 2 years
    drawn not a [uncertain: denia] from the estates, and that the Poles took cover behind the order given
    by Napoleon to pay nothing hither. But all of this availed nothing: the Jew, at liberty, bought himself
    off, and I had to sit until means were found. I had 2,000 Rthl with me; the upright Lieutenant General
    and Minister


    von Zastrow gave surety for 5,000 Rthl in paper money, which we then converted into Courant and received
    2,875 Rthl for it, but for which we must pay back 5,000 Rthl Courant on the 1st of June; and not until
    the last Pfennig had been paid was I freed from the execution and released from my arrest. Meanwhile,
    through this affair, not only have my honour, standing and credit been diminished, but the highest
    interest has been so far neglected that it can never be redressed. I cannot now, for honour''s sake,
    remove myself from here until I have found means for the 5,000 Rthl together with interest and costs,
    for I cannot let any unpleasantness arise for the honest Minister von Zastrow. Meanwhile I know of
    no other course than that Your Serene Highness should, as soon as possible, send me back the bank
    order to pay of 6,000 Rthl which You most highly ceded to Eysenhardt,'

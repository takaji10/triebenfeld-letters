- page: 1
  en: 'Copy. Your Most Serene Highness''s most gracious letter I received here in Berlin; I should long
    since have answered the same, had I not been held under arrest under strict French guard. A fate I
    have never deserved, and one which has given my civil existence a very crooked direction.


    At the end of December I was sent hither from Memel with important [uncertain: commissions], and I
    was already near the goal of my wishes, so as to be able soon to depart again, when, without my suspecting
    it, two French gendarmes were sent into my lodging with the order that they were to hold me under
    strict supervision and arrest until I, as general attorney of the Prince of Hohenlohe, should have
    paid all the arrears of interest upon the 50000 Rthl borrowed from the Invalids'' Fund. Terror and
    shame at this occurrence almost brought me to the most desperate resolution; the arrears of interest
    for 2 years amounted to 5000 rtt — whence was I to take these amid the dreadful want of money, [uncertain:
    for indeed] there are no Royal treasuries here, and all revenues are in the hands of the French authorities.
    I proved with all the jurists that I am not the debtor. I produced the judicial instrument showing
    that the banker Apenheimer had already 3 years ago undertaken to pay this sum to the Invalids'' Fund
    against a discount of 7 [uncertain: sl:], that he had it entered in his own'

- page: 3
  en: 'so that I may take back from the holder the [uncertain: Kontazen] mortgage of 10000 pledged for
    it, and thereby help myself. But may Your Serene Highness deign to make the instruction over to me,
    or Yourself


    to note upon it that You have drawn no money upon it, and that You returned the same. I shall then
    at once press for the return of my mortgage, and hope in exchange to obtain the money here from a
    certain General''s lady von Blücher, in order to satisfy the banker, or in cash. The noble Minister
    von Zastrow is working with me at the French authority to have the Trąbczyn estates restored to Your
    Serene Highness; and had this shameful occurrence not befallen me, I should by this time already have
    been in Petersburg, and could there have effected much through the Grand Duke. In the confident hope
    of a very speedy granting of my exceedingly urgent request, I remain, until death,


    Your Serene Highness''s humble and obedient servant


    von Triebenfeld. Berlin


    the 14th of March, 1808.'

status: draft
segments:
- page: 1
  en: 'Copy. Your Most Serene Highness''s most gracious letter I received here in Berlin; I should long
    since have answered it, had I not been held under arrest under strict French [uncertain: guard/surveillance].
    A fate I never deserved, and which has given my civil existence a very crooked turn. At the end of
    December I was sent hither from Memel with important commissions, and I was already near the goal
    of my wishes, so as to be able to depart again soon, when, without my suspecting it, two French gendarmes
    were sent into my lodging with the order that they were to keep me under strict watch and arrest until
    I, as General Plenipotentiary of the Prince of Hohenlohe, should have paid all the arrears of interest
    upon the 50000 Rthl borrowed from the Invalids'' Fund. Terror and shame at this occurrence nearly
    brought me to the most desperate resolution; the interest in arrears amounted, for 2 years, to 5000
    rtt — whence was I to take these, amid the dreadful want of money, [uncertain: um seinehe] since there
    are no Royal treasuries here and all revenues are in the hands of the French authorities. I [proved?]
    with all the jurists that I was not the debtor. I produced the judicial instrument showing that the
    banker Apenheimer had, already 3 years ago, undertaken to pay this sum to the Invalids'' Fund against
    a discount of 7 [uncertain: sl:], that he had it entered in his own'
- page: 2
  en: '[uncertain: name/register], and that he must pay. I proved further that Your Serene Highness had
    yourself for 2 years drawn not a denier from the estates, and that the Poles concealed themselves
    behind the order given by Napoleon to pay nothing hither. But all this availed nothing: the Jew bought
    himself free into liberty, and I had to sit until means could be contrived. I had 2000 Rthl with me;
    the upright Lieutenant-General and Minister v. Zastrow stood surety for 5000 Rthl in paper money,
    which we then converted into Courant and received 2875 Rthl for it, but for which we must repay 5000
    Rthl Courant on the 1st of June. Not until the last farthing was paid was I released from the execution
    and discharged from my arrest. Meanwhile, through this affair my honour, standing and credit are not
    only impaired, but the highest interest has been so far neglected that it can never be redressed.
    I cannot now, for honour''s sake, remove from here until I have contrived means for the 5000 M together
    with interest and costs, for I could not let any unpleasantness arise for the honest Minister v. Zastrow.
    Meanwhile I know of no other counsel than that Your Serene Highness send me back, as soon as possible,
    the bank order to pay for 6000 Rthl which Your Most Serene Highness has ceded to Eysenhardt,'
- page: 3
  en: 'so that I may take back from the holder the [uncertain: Kontazen] mortgage of 10000 pledged for
    it, and thereby help myself. But may Your Serene Highness deign to remit the order to pay to me, or
    to note upon it yourself that you have drawn no money upon it and returned the same. I shall then
    at once press for the restitution of my mortgage, and hope in return to obtain the money here from
    a certain Generalin von Blücher, in order to satisfy the banker, or in cash. The noble Minister v.
    Zastrow is working with me at the French authority to have the Trabezyner estates restored to Your
    Serene Highness; and had this shameful occurrence not befallen me, I should already have been in Petersburg
    since that time, and might there have effected much through the Grand Duke. In the confident hope
    of a very speedy granting of my exceedingly urgent request, I remain, until death, Your Serene Highness''s
    humble and obedient servant v. Triebenfeld. Berlin, the 14th of March, 1808.'

- page: 2
  en: 'name, and that he must pay. I proved further that Your Serene Highness Yourself had for 2 years
    drawn not a [uncertain: denier] from the estates, and that the Poles sheltered behind the order given
    by Napoleon to pay nothing hither. But all this availed nothing: the Jew bought himself free into
    liberty, and I had to sit until means were found. I had 2000 Rthl with me; the honest Lieutenant-General
    and Minister


    von Zastrow stood surety for 5000 Rthl in paper money, which we then converted into Courant and for
    which we received 2875 Rthl, but for which we must repay 5000 Rthl Courant on the 1st of June. Not
    until the last farthing was paid was I released from the execution and discharged from my arrest.
    Meanwhile, through this affair my honour, standing and credit have not only been diminished, but the
    highest interest has been so far neglected that it can never be redressed. I cannot now, for honour''s
    sake, remove myself from here until I have found means as regards the 5000 M together with interest
    and costs, for I could not let any unpleasantness arise for the upright Minister von Zastrow. Meanwhile
    I know of no other counsel than that Your Serene Highness send me back, at the very earliest, the
    bank instruction for 6000 Rthl which You most highly ceded to Eysenhardt,'

- page: 3
  en: 'By this carriage may Your Serene Highness be pleased to have the 6 tables and 30 fruit trees conveyed
    to the President. I have instructed the man to be sure to say that it all [uncertain: comes] from
    me — For the rest, may God the All-Good only grant that Amelang does good business, for then all wishes
    are attained. In deepest reverence I remain, until death, Your Most Serene Highness''s Trąbczyn, the
    28th of March


    1805.


    faithful and most humble and obedient servant v Triebenfeld'

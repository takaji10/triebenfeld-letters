- page: 2
  en: 'has incurred unpardonable errors and compromised the collegiate board; against this, the princely
    manorial lordship (Dominium) has conducted itself better and has done more than was required by the
    Chamber at that time, so that only in few cases has there been any acting contrary to the norm.


    In the name of the collegiate board I beg Your pardon, but at the same time I pledge that, if You
    should be pleased to grant the consent to the dismemberment of the princely estates, the gross errors
    of the departmental councillor shall be rectified so far as possible, etc. etc.


    That is after all everything an honest man can do, and with his approval I am now to proceed briskly
    and dismember everything at once; for even if His Excellency von Voss should wish to make difficulties,
    the Chamber must keep its word and press for the consent. This part has been played masterfully through
    all the acts. With the people of Olesnica I think I shall soon be finished, for today Mona Kunckel
    was fetched away by the mounted district officer and, through the mediation of Schencis, placed in
    custody for a longer period. Now it will be easy play with the 3 knaves.


    On account of Szetlewek I shall have a warm day tomorrow; God grant good fortune as in other cases.


    Today the Winnich heirs have again brought suit and demand a further 1300 Rthl of arrears in surveying
    costs. It is truly frightful how matters have gone on here: the revenues are constantly used up and
    not a soul has been paid.'

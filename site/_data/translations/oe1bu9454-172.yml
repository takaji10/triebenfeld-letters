- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Since yesterday I have been here in Trąbczyn in order to press forward the dismemberment business
    with Eyster. There are already a great many people here, but since many more were expected, I have
    postponed the principal appointed day until next Monday, when I then certainly intend to conclude
    the contracts over all the parcels of ground. President von Goldbeck is now making himself out noble
    and gallant; he has written to Minister Voss for eight days'' leave in order to go to Breslau and
    to be able to arrange his domestic affairs; on that occasion he says to Herr von Vor: In view of the
    district councillor''s protocols submitted to Your [uncertain: Epl.] concerning the dismemberment
    business of the Prince of Hohenlohe, I must still most humbly observe that the matter has already
    progressed too far and could not be reversed. Upon closer examination I have found that the Chamber
    has already consented to the dismemberment and has furnished to the district councillor von Blomberg
    the principles pertaining thereto under the 2nd of September of the present year. Both in these and
    also in the latter report the departmental councillor, councillor of war zur Höllen,'

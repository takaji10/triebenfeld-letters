- page: 2
  en: 'has incurred unpardonable errors and compromised the collegium; whereas the princely manorial lordship
    (Dominium) has conducted itself better and done more than was required by the Chamber at that time,
    so that only in a few instances has there been action contrary to the norm.


    In the name of the collegium I beg Your pardon, but at the same time I pledge that, if You will be
    pleased to grant the consent to the dismemberment of the princely estates, the gross errors of the
    departmental councillor shall be rectified so far as possible, etc. etc. etc.


    That is indeed all that an honest man can do, and with his approval I am now to proceed briskly and
    dismember everything at once; for even if Mr v. Voss should wish to raise [uncertain: querden], the
    Chamber must keep its word and press for the consent. This role has been played masterfully through
    all the proceedings. With the Oleśnica men I think I shall soon be finished, for today [uncertain:
    Mona] Kunckel was fetched away by the mounted district constable and, through the mediation of [uncertain:
    Schencis], put into custody for a considerable time. Now it will be easy play with the 3 lads.


    On account of Szetlewek I shall have a warm day of it tomorrow; God grant success, as in other cases.


    Today the Winnicki heirs have again brought suit and demand a further 1300 rt. of outstanding surveying
    costs. It is truly dreadful how things have been carried on here: the revenues have always been consumed
    and not a soul has been paid.'

  en: '172


    Most Serene Prince


    Most gracious Prince and Lord!


    Since yesterday I have been here at Trąbczyn, in order to press forward the dismemberment business
    with zeal. A great many people are already here, but as many more are still expected, I have accordingly
    postponed the principal hearing until next Monday, when I certainly intend to conclude the contracts
    for all the plots. President v. Goldbeck is now [uncertain: münt] himself noble and upright — He has
    written to Minister Voss for eight days'' leave, in order to go to Wrocław and be able to arrange
    his household affairs; and on that occasion he says to Mr v. Voss: With regard to the district councillor''s
    minutes submitted to Your Excellency concerning the dismemberment business of the Prince of Hohenlohe,
    I must yet most humbly observe that the matter has already advanced too far and could not be undone.
    Upon [uncertain: üherer] examination I have found that the Chamber has already consented to the dismemberment
    and has issued to the district councillor v. Blomberg the principles pertaining thereto under the
    2nd of September of last year. Both in this and in the latter report the departmental councillor,
    the councillor of war zur Höllen,'

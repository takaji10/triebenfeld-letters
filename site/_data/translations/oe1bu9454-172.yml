- page: 3
  en: 'By this conveyance may Your Serene Highness be pleased to have the 6 tables and 30 fruit trees
    carried to the President. I have instructed the man that he is indeed to say that he brings it all
    from me. — For the rest, may God the All-Good only grant that Amelang does good business, for then
    all wishes are attained. In deepest reverence I remain, until death, Your Most Serene Highness''s
    Trąbczyn, the 28th of March


    1805.


    faithful and most humble and obedient servant von Triebenfeld'

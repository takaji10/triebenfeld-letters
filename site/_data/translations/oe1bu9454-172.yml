status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Since yesterday I have been here in Trąbczin,
    to press forward the dismemberment business with Eyster. A great many people are already here, but
    since many more were expected, I have postponed the principal term until next Monday, when I then
    certainly intend to conclude the contracts for all the parcels. President v Goldbeck is now [uncertain:
    minting/affecting] himself noble and worthy; he has written to Minister Voss for eight days'' leave,
    in order to go to Breslau and be able to arrange his household affairs; on that occasion he says to
    Herr v Vor: With regard to the Landrath protocols sent in to Your [uncertain: Epl.] concerning the
    dismemberment business of the Prince Hohenlohe, I must still most humbly observe that the matter has
    already advanced too far and could not be reversed. I have found, upon [uncertain: closer] examination,
    that the Chamber has already consented to the dismemberment and has furnished the Landrath v. Blomberg
    with the principles pertaining thereto under the 2nd of Septr. of the previous year. Both in these
    and also in the latter report, the Departmental Councillor, Councillor of War zur Höllen, has'
- page: 2
  en: 'allowed unpardonable errors to be laid to his charge, and compromised the Collegium; against this
    the Princely Dominium has conducted itself better and has done more than was at that time required
    by the Chamber, so that only in few cases has there been action contrary to the norm. In the name
    of the Collegium I beg Your [pardon], but at the same time I pledge that, if Your [Excellency] will
    deign to grant the consent to the dismemberment of the Princely estates, the gross errors of the Departmental
    Councillor shall be rectified so far as is possible, p. pp. — that, after all, is all that an honest
    man can do; and with his approbation I am now to go briskly ahead and at once dismember everything,
    for even if E. v. Voss should wish to make [uncertain: cross-difficulties], the Chamber must keep
    its word and press for the consent. This part has been played masterfully through all the proceedings.
    With the Olesnicer people I think I shall soon be finished, for today Mona Kunckel was fetched away
    by the Landreuter and, through the mediation of the Schencis, placed in custody for several terms.
    Now it will become easy play with the 3 knaves. On account of Szetlewek I shall have a warm day tomorrow;
    God grant good fortune as in other cases. Today the Winnich heirs have again brought suit and demand
    a further 1300 Rthl of arrears of survey costs. It is truly dreadful how things have gone on here:
    the revenues are constantly consumed and not a soul has been paid.'
- page: 3
  en: By this carting Your Serene Highness may deign to have the 6 tables and 30 fruit trees driven over
    to the President. I have instructed the man that he is indeed to say that it all comes from me. —
    For the rest, may God the All-bountiful only grant that Amelang does good business, and then all wishes
    are attained. In deepest reverence I remain, until death, Your Most Serene Highness's Trąbczin, the
    28th of March 1805. faithful most humble and obedient servant v Triebenfeld

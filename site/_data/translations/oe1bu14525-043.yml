segments:
- page: 1
  en: 'Copy


    Received the 9th of January 1799. By the Grace of God, Friedrich Wilhelm, King of Prussia. Our royal
    grace and favourable disposition to you beforehand, High-born Prince, particularly dear and faithful
    one! Upon the petition submitted by Your Lordship in the matter of the Treasury against von Prusimski
    on the 31st of January of this year, requesting a certified copy of the judgment of confiscation drawn
    up against the said von Prusimski, furnished with the attestation of its having force of law, for
    the purpose of putting in order the title of possession of the Trąbczyn estates conferred upon the
    same, we hereby grant Your Lordship, with the return of the original enclosure, this resolution: that
    the judgment of confiscation against the aforementioned von Prusimski was drawn up not before our
    Government here, but before our Government at Toruń, and that You must therefore apply to the latter
    in the matter. We remain disposed toward Your Lordship with royal grace and favourable will. Given
    at Poznań, the 4th of February 1799. Danckelmann


    Enge[uncertain: r]


    To His Lordship the Prince of Hohenlohe-Ingelfingen'

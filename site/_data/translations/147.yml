status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! I have completed the most laborious journey I have ever
    made in my life, to West and East Prussia. The Mennonites wish to build [uncertain: build] and have
    assured me, in their own fashion, that with some money they will arrive in Breslau on the 19th of
    December and there conclude the contract. I could have drawn up a set of preliminary points on the
    spot with several of them, but it would have been too little for me, in a single spot, since these
    people dwell scattered singly about, and I could not bring them together, because the weather was
    too bad and the roads bottomless. Besides, they expressly wanted to have the propination rights included
    in the present valuation as well, and this moved me to depart and to summon them to Breslau. Since,
    however, the Biblical lawgivers taught — to prove all things and to hold fast that which is good —
    I have today sent to the Landsberg and Oderbruch people, am having them come, and shall hear their
    proposals — if these are better, I shall conclude at once, and commend the Mennonites to the L[ord]:
    I am no weakling — but the road to the L[ord]''s sons has become too much for its own [illegible],
    I have wrestled with life and death, and in the end the L[ord] made me new strangling-bands — So if
    these people prove willing, I shall conclude and let the hypocrites go their way. Of men who wish
    to buy there is no end; but I can by no means possibly'
- page: 2
  en: engage in the parcelling-up of the plots, for otherwise the poorer land would in the end be left
    on my hands. The best of it the Olesnice boys and the Swierer folk have carried off at such low prices
    that it turns many heads; they try this way and that, whether some little gap cannot be found for
    pushing in — I must therefore hold strictly to the plans once drawn up and remain true to my principle.
    With the assessment of the estates here it goes very slowly, even with the best will of the writer,
    because the data are everywhere lacking — God knows where one is to look for anything — everything
    must therefore be ascertained afresh, and a cruel deal of time squandered. In this respect I must
    remain here another 14 days, for if I depart, then everything again lies untouched. In deepest reverence
    I remain, until death, Your Serene Highness's Trąbczin, the 25th of 9br 1804. most humble and obedient
    servant v Triebenfeld
- page: 3
  en: This very moment Glenck was here. He reproaches me grossly with wishing to bring him out of his
    fortune. Your Serene Highness is said to have told him yourself that I had made the highest reproaches
    to Him, that Your Highness had given Glenck too much. Your Serene Highness will most graciously forgive
    me if I, so as not to make my poor children fatherless orphans as well, seeing that I must all but
    vex myself to death — lay down the pen in all these affairs. Gladly would I win for Your Serene Highness
    all the fortune on earth, and one would give goods and blood for Your Serene Highness — but I will
    not let myself be branded by Glenck and Kochlitz. The people here are all becoming confused — for
    now Glenck has been giving dispositions here, in part contrary to my own ordinances — I do not wish
    to make a noise about it, for otherwise one might think I was pressing myself into his place — meanwhile
    my honour and Your Serene Highness's interest suffer by it. The justice-burgomaster Schema begs for
    early instructions as to how he is to proceed regarding the Wrąbczin lands, since otherwise he cannot
    go further with the assessment; the Dominium now remains at Wegberin with 53 Morgen — there the assessment
    cannot turn out very high. The Voigtey, however, might now be assessed at about 11000 Rthl, for Glenck
    has applied for an assessment

- page: 3
  en: 'The good Monarch is said not to be in good spirits at all. That truly grieves me — Prince Reppnin
    is said, so they say, to have received an ukase while on the road not to show himself in Petersburg
    again — who knows whether this may not perhaps be a mask?


    The good Privy Cabinet Councillor Mencke is said to be back in activity, because his health has noticeably
    improved.


    Among certain men, it is said, discord prevails; that would be a pity, for they are a pair of honest
    people. Her Serene Highness the Princess Sacken is in good health. That Count Höym has now gone to
    Pomerania I very much censure. The X Spinne was just here and says he knows it for certain that the
    French mean to take Hanover; that this is why the King is so out of humour. But I do not believe a
    word of what he says; he has lied too much already.'

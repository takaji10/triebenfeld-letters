- page: 2
  en: 'until I am sure of the matter.


    Should the Prince arrive at the Forte before me, then let Your Serene Highness by all means hold him
    there until I come, for otherwise I shall be made a liar and the good Prince will be led astray. It
    is, before God, no boasting — but I can certainly assure you that no one among all our officials knows
    the province, still less the interior of the business, save he alone; and in Prince George''s affair
    it is required that a man who has knowledge of the matter and understands the language should come
    forward, and then much may be gained. The minister Hoym set out today for Pomerania for ten days —
    the Monarch received him very graciously. On Thursday the minister von Voss returns, and then the
    matter will soon be clear — yesterday I sent another obliging letter to him, one likewise to Schulze,
    one to Mr Cabinet Councillor Beyme, and one to the Colonel — the effect has throughout been very good,
    for I referred myself in every instance to the cabinet letter as well as to that from Mr Cabinet Councillor


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 15th of October


    1798.


    most faithful and humble servant


    v. Triebenfeld'

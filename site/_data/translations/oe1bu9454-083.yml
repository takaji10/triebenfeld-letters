- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    The letter which Your Most Serene Highness was most graciously pleased to address to me I have duly
    received, together with all the enclosures, through Mr. Michaelis.


    As to the matter itself, I can say with the most joyful heart that everything is going as we should
    wish — Krotoszyn is now quite certainly to be given to Your Most Serene Highness for the Suprenstis
    possessions. Only with regard to Polajewo does there seem still to be some hesitation expressed —
    but according to the assurance of Privy Councillor of Finances Schulze, Your Most Serene Highness
    may obtain this one also. The chief aim of my most ardent wish and of my honest zeal for Your Serene
    Highness''s peace and contentment is as good as attained already, for Krotoszyn is and remains an
    inestimable endowment — with Polajewo too there are some 100000 Rthl to be gained; only the obstruction
    from the Chambers will cost me many a struggle — yet this too should be possible to overcome.


    My one and only worry is that His Serene Highness Prince George should not arrive there sooner than
    I am in Breslau — for here I would rather not depart'

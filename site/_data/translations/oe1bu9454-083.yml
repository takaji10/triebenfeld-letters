- page: 2
  en: 'depart before I am certain of the matter.


    Should the Prince arrive in the Forte before I do, then let Your Serene Highness by all means detain
    him until I come, for otherwise I shall be made out a liar and the good Prince will be led astray.
    It is, by God, no Präflorey — but I can assure it for certain that not one of all our officials knows
    the province, still less the interior of the matter, otherwise than superficially; and in Prince George''s
    affair it is required that a man who has knowledge of the business and understands the language should
    come forward, and then much may be gained. Minister Hoym set out today for Pomerania for 10 days —
    the Monarch received him very graciously. On Thursday Minister von Voss returns, and then the matter
    will soon be brought clear — yesterday I sent another obliging letter to him, one likewise to Schulze,
    one to Mr. C. W. Beym, and one to the Colonel — the effect has throughout been very good, for I referred
    in every instance both to the Cabinet letter and to that of the Cabinet Councillor.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 15th of October


    1798.


    most faithful and humble servant


    v. Triebenfeld'

- page: 1
  en: '83


    Most Serene Prince,


    Most gracious Lord!


    The letter graciously issued to me by Your Most Serene Highness I have duly received, together with
    all the enclosures, by the hand of Mr Michaelis.


    As to the matter itself, I can say with the most joyful heart that everything goes as we could wish
    — Krotoszyn they are quite certainly giving to Your Most Serene Highness in return for the Suprenstis
    possessions. Only with regard to Polajewo do they seem still to raise some hesitation — but according
    to the assurance of the Privy Councillor of Finance Schulze, Your Most Serene Highness may obtain
    this one also. The chief aim of my most ardent wish and of my honest zeal for Your Serene Highness''s
    peace and contentment is as good as attained, for Krotoszyn is and remains an inestimable [uncertain:
    acquisition] — with Polajewo too there is something like 100/m Rthl to be gained, only the obstacles
    with the Chambers will cost me many a struggle — yet this too should be capable of being overcome.


    My one and only care is that His Serene Highness Prince George should not arrive there before I am
    in Wrocław — for here I would rather not depart'

- page: 3
  en: 'The good Monarch is said to be not at all in a good humour. That truly grieves me — the Prince
    Repnin is said, so people tell, to have received a ukase on the way not to show himself in Petersburg
    again — who knows whether this is not perhaps a masque?


    The good Privy Cabinet Councillor Mencke is said to be in activity again, since his health has notably
    improved.


    Among certain gentlemen it is said that discord prevails; it would be a pity, for they are a pair
    of honest men — Her Serene Highness the Princess Sacken is in good health. That Count Hoym has now
    gone to Pomerania I much censure — the X Spinne was just here and says he knows it for certain that
    the French mean to take Hanover; that this is why the King is so ill-humoured. But I do not believe
    a word of what he says; he has already lied too much —'

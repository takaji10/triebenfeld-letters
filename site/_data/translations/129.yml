status: draft
segments:
- page: 1
  en: 'Today I have letters neither from Berlin nor from Frankfurt. My anxiety therefore increases hourly.
    Should Your Most Serene Highness have anything from Glenck that affords comfort, may You yet deign
    to communicate it to Your servant. On account of Kolzig I had great hopes — but Amelang does not answer.
    Had a ray of hope appeared there, I should have advised that every sale of Kontop be forbidden — but
    if Amelang remains silent further as to the plan laid before him in this matter, then I must believe
    that [uncertain: Beym] does not vouch for him; and with this in view the sale of Kontop would have
    to be pursued zealously. To that end I have summoned Bernhardi here and have intimated to him that
    he, as lessee, should recommend and represent the estates in the best terms to every prospective purchaser
    — for with people of this sort'
- page: 2
  en: 'much depends. In the first place, such a creature might, in order to remain secure in his lease,
    easily hinder the sale by hideous descriptions of the property; and in the second, such a man, [uncertain:
    seeking] gain, might easily let himself be bought, and act to the seller''s disadvantage; therefore
    I have had him come here, and to forestall all this. Now I am sending him off again at once, so that
    when Rudolf and Stubenrauch arrive there he may not only receive them well, but describe everything
    to those people truthfully and in the best light. This afternoon I shall bring out what is to be sent
    to South Prussia — now I must first [illegible] my business, of which I have found a great deal awaiting
    me.


    v Triebenfeld


    Breslau, the 15th of May 1804.'

- page: 2
  en: 'I have pointed out to him that Stössel, who is now [uncertain: pauren], would let himself be well
    handled, so that he, Weigel, would recover my claim in a solid manner, and indeed with great advantage,
    without its being felt by him — and that with his wide acquaintance he could easily [uncertain: gewesen]
    the estates again. I told him plainly that, in the other case, should he hard-heartedly reject this
    advantageous plan, he would have to attain the age of Methuselah along with Your Serene Highness in
    order to be fully satisfied one day — for he could not simply lay hands on Your Serene Highness in
    that fashion — at bottom all your estates are [uncertain: fide. Cörruch], and there, in the very utmost
    case, a seizure could only be laid upon your share of the revenues — and that would require that Your
    Serene Highness live another 200 years; the Polish ones alone[?] afforded him a prospect — since,
    however, a fortunate exchange might be effected thereby, this would be the one moment to be wished
    for. Meanwhile, however [uncertain: vorleihhaft] the exchange might be, Your Serene Highness would
    not be minded to take estates here if you could not thereby at once settle with your most preferential
    creditors.


    I await the answer eagerly.


    That the King is coming Your Serene Highness has long known; I only cannot comprehend how you should
    not have had my letter with the [uncertain: Tismarschen] ones on the 22nd either — I believe that
    Your Serene Highness will see [uncertain: der Königl.] and I await a letter longingly on Friday; I
    have enquired whether it would be taken amiss if Your Serene Highness were to show yourself to the
    King at Koźle or wherever it might be. In case it were not already resolved that he wishes to see
    Your Serene Highness.


    What I learn I shall send you by express. To Princess Emilie and to the illustrious, worthy Albert
    I commend myself in the most submissive manner, and I remain, until death,


    Your Most Serene Highness''s


    Wrocław, 27th August


    1810


    most humbly faithful servant


    von Triebenfeld'

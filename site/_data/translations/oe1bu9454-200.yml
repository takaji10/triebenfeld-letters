- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    A most gracious letter of Your Most Serene Highness with the house-hides [uncertain reading] I have
    received this very hour; I regret that they did not come in one post-day earlier, for then they might
    still have granted General von Köckritz a dram of vital strength for the journey; as it is, however,
    the birds now arrive only on Sunday, when he will already have departed. I shall doubtless be able
    to tell him here that this loaf awaits him yonder — to Herr von Seegebarth nothing further can well
    be said than that Your Serene Highness would take pains to have the [uncertain: West] settled, as
    soon as you had some hope of drawing monies shortly from your Polish possessions. — Are the express-courier
    monies, which derive from the campaigns, not perhaps sent on the King''s business? Were this so, you
    could refer Herr von Seegebarth thither.


    My haste was in vain: the lazy Brufurt has not come; I must seek other counsel in order to be able
    to travel to Poland. Perhaps that will succeed in a couple of days, and then I shall go at once to
    Zagorowo so as to be back by the 7th. For the rest, I do not believe that Weigel will consent that
    Stössel should be his debtor-man — young Bernhardi counts for much with old Weigel, who has had to
    [uncertain: separate/spare] him. He has straightway declared that he wishes to have nothing to do
    with Stössel. I already stand in correspondence with him, to the effect that he should himself acquire
    the estates which Your Serene Highness takes over in Silesia, and give you a receipt in full, and
    also satisfy Stössel.'

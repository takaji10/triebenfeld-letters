- page: 2
  en: 'I have pointed out to him that Stössel, who is now [uncertain: a peasant/pressed], lets himself
    be well handled, and that he, Weigel, would recover my claim in a solid manner and even with great
    advantage, without its being felt by him — and that with his wide acquaintance he could easily [uncertain:
    sell/dispose of] the estates again. I told him outright that in the other case, should he hard-heartedly
    reject this advantageous plan, he would have to attain the age of Methuselah along with Your Serene
    Highness in order to be fully satisfied one day — for he could not simply lay hands on Your Serene
    Highness just like that; fundamentally all your estates are [uncertain: fide. Cörruch], and in the
    utmost case an arrest could only be laid upon [uncertain: your/one] share of the revenues — and that
    would require that Your Serene Highness should live another 200 years; the Polish [text lost] afforded
    him a prospect — since meanwhile a fortunate exchange could be effected thereby, this would be the
    one desired moment. Meanwhile, however advantageous the exchange might be, Your Serene Highness would
    not be minded to take estates here unless you could at once discharge your foremost creditors therewith.


    I await the answer eagerly.


    That the King is coming Your Serene Highness has long known; I only cannot comprehend how you should
    not have had my letter with the Tismarsch matters on the 22nd either — I believe that Your Serene
    Highness will see His Majesty, and I await a letter on Friday with longing; I have enquired whether
    it would be ill construed if Your Serene Highness were to show yourself to the King at Cohel or wherever
    it may be. In case it be not already resolved that he wishes to see Your Serene Highness.


    What I learn I send you express. To Princess Emilie and to the illustrious, worthy Albert I commend
    myself in the most respectful manner, and I remain, until death, as


    Your Most Serene Highness''s


    Breslau, the 27th of August


    1810


    most humbly faithful servant


    v. Triebenfeld'

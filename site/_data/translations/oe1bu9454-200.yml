- page: 1
  en: '200


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most gracious letter with the [uncertain: Hauses häuer] I have received
    this very hour; I regret that they did not arrive one post-day earlier, for then they might still
    have afforded General von Köckritz a scruple of vital strength for the journey; as it is, however,
    the birds will now arrive only on Sunday, when Köckritz will already have departed. I shall now be
    able to tell him here, at least, that this morsel awaits him yonder — to Mr von Seegebarth nothing
    further can well be said than that Your Serene Highness would endeavour to have the remainder settled,
    [uncertain: umfangehr] as you had some hope of soon drawing monies from your Polish possessions —
    Are the express-courier monies which derive from the campaigns not, perhaps, dispatched in the King''s
    affairs? If that were so, you could refer Mr von Seegebarth thither.


    My haste was in vain: the idle Brufurt has not come, and I must find other counsel so as to be able
    to travel to Poland. Perhaps that will succeed within a few days, and then I shall go at once to Zagórów,
    so as to be back by the 7th. For the rest, I do not believe that Weigel will consent to Stössel being
    his debtor — the young Bernhardi counts for much with old Weigel, and he has had to [uncertain: ſondern]
    him. He has straightway declared that he wishes to have anything to do with Stössel. I am already
    in correspondence with him, to the effect that he himself should acquire the estates which Your Serene
    Highness is taking over in Silesia, and give you a receipt in full, and likewise satisfy Stössel.'

segments:
- page: 1
  en: 'Right Honourable Sir!


    Most Highly Honoured Lord Grand Chancellor!


    The minor Michalina von Prusimska has brought a suit against me before the Government [text lost]
    Poznań for the recovery of the Brzyce estates given to me by His [text lost] Majesty. The case has
    now been prepared and is to be laid before the court for judgment [text lost]. Since the guardianship
    board at Poznań is conducting this lawsuit in the name of the minor plaintiff, but the members of
    the guardianship board are at the same time members of the Government, and would consequently be my
    judges in the case, I humbly ask Your Excellency: "both for these and for other reasons, which depend
    solely [text lost] on my individual conviction, graciously to give the order that the Government at
    Kalisz should draw up the judgment in this case, and that to this end the files


    [Written by the receiving office:]


    2 Dec. 1800. H qm B.


    No. 5957.'

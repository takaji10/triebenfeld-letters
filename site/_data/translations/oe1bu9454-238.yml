- page: 1
  en: '238


    Right Honourable Sir,


    Highly Honoured Sir, Councillor of War and Forests!


    Your messenger arrived only this forenoon; he excuses himself for having been so long on the way by
    saying that he had gone astray. From his march route I see that he was also with the chief district
    administrator Koenig. He said that the latter was at home and had taken the letters from him himself.
    Neither Trzciński, Zerboni, nor Koenig lets anything be heard of himself; the first has still paid
    nothing, the second has likewise fulfilled none of his obligations, Mr Weigelt presses me very hard,
    and I shall now attempt whether I can quiet him by means of the Trzciński bills of exchange. These
    monies from Großen I needed for true necessity, since here, unhappily, everything still stands as
    you know it. Your entire silence has filled me with sorrow, since from it I conclude that all your
    efforts on my behalf were fruitless. I sent Your Right Honourable a messenger, who however brought
    only a receipt from the district administrator at Blizanów, which Mr Schenck, after this express had
    been detained 4 days, expanded to this effect: that you had gone away, would return in 14 days, and
    that I should then soon receive an answer; this, to my great regret and real disadvantage, did not
    follow. Only today do I see from Your Right Honourable''s dispatch of the 29th of April that you had
    written to me earlier, which lines I did not receive. I can assure you upon my word that the letter
    which I here answer is the first that I have received from you since you left Sławięcice; in vain,
    alas, have I long yearned for it.'

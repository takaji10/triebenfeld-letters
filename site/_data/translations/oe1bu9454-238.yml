- page: 4
  en: 'negotiations. The [uncertain: distinction] of your eldest son has greatly rejoiced me, and I take
    part in his sufferings from the wound. By your personal visit you act as an excellent father, which
    I esteem. — Do inform me soon when you return, and where we can most conveniently speak together.
    I do hope after all that something will soon be obtainable from Meierowitz, since help is all too
    needful to me. It appears, to my comfort, that you still expect advantage from Ratke''s working upon
    the matter; have you then heard anything more particular from him about it at this time? If Your Right
    Honourable then not at all during the presence of the high personages at Kalisz. For your friendly
    assistance I beg with confidence. Wishing you lasting health and a happy journey, I remain in especial
    high esteem


    Your Right Honourable''s


    Sławięcice


    7th May 1813


    most faithfully devoted friend and servant F[riedrich] L[udwig] P[rince] of Hohenlohe'

- page: 4
  en: 'The distinction conferred on your eldest son has given me great pleasure, and I take part in his
    sufferings from the wound. By your personal visit you act as an excellent father. Which I esteem.
    — Do report to me soon when you return, and where we can most conveniently speak together; I still
    hope that something will soon be obtainable from Maierowitz, since help is all too needful to me.
    It appears, to my comfort, that you still expect some benefit from Ratke''s handling of the matter;
    have you then heard anything more particular from him in the meantime? If Your Right Honourable then
    not at all during the presence of the high personages at Kalisz. For your friendly support I beg with
    confidence. With wishes for [uncertain: thunderous] health and a happy journey, I remain in especial
    esteem


    Your Right Honourable''s


    Schlawenschitz


    9th May 1813


    most faithfully devoted friend and servant


    F. L. P. of Hohenlohe'

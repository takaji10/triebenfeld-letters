- page: 2
  en: 'I am glad to see from it that I am not wholly [illegible: effaced] from your [text lost] — I will
    believe that the letter, the loss of which the negligence of Herr Koenig has brought upon me, may
    at least have contained instructive disclosures for me; for that very reason it was inexcusable that
    he put it in the post at Würtemberg. What has become of the letter I can only guess, particularly
    as you did not indicate the date to me. From the newspapers I see that in the fire at Würtemberg the
    post-house was burned down as well, and many letters lying there became a prey to the flames. — The
    conclusion of all this is that I know nothing of what you wished me to do; meanwhile I enclose herewith
    a letter to His Majesty the Russian Emperor under open seal, so that, if you find it suitable, the
    necessary use may be made of it. In any case I have done what I was able to do, and I beg Your Right
    Honourable for further instruction; I have hitherto omitted nothing in order to prove, with all resignation,
    my patriotism and good will. What I wrote, and how I was answered, the enclosure shows. — To the King,
    to the Lord State Chancellor and to the Minister of Justice I applied myself anew in my pressing concern,
    that they might vigorously lend their weight at Brieg to the compromise settlement I have proposed
    with the creditors, and to favour the fixing of a'

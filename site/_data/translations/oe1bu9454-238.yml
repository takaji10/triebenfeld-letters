- page: 2
  en: 'I am glad to see from it that I am not wholly erased from your [uncertain: remembrance] — I will
    believe that the letter, the loss of which the negligence of Mr Koenig has brought upon me, may at
    least have contained instructive disclosures for me; for that very reason it was inexcusable that
    he put it into the post at Syców. What has become of the letter I can [uncertain: not] guess, particularly
    since you did not give me the date. From the newspapers I see that in the fire at Syców the post house
    was burnt down along with the rest, and many letters lying there became a prey to the flames. — The
    [uncertain: worst] of it is now that I know nothing of what you wished me to do; meanwhile I enclose
    herewith a letter to His Majesty the Russian Emperor under open seal, so that, if you find it suited
    thereto, the necessary use may be made of it. In any case I have done what I was able to do, and I
    beg Your Right Honourable for further instruction; I have hitherto omitted nothing, in order to prove
    with all resignation my patriotism and good will. What I wrote, and how I was answered, the enclosure
    shows. — To the King, to the Staats Kanzler and to the Justiz Minister I applied afresh in my pressing
    concern, that they might vigorously lend their weight at Brzeg to the compromise agreement proposed
    by me with the creditors, and favour the determination of'

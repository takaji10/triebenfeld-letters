- page: 3
  en: 'a fair allowance for me; this intercession was likewise refused me. For the rest there is silence
    upon everything, and it seems that they wish at last to abandon me to death by hunger. You already
    know everything upon this head, wherefore I find it useless to say anything further of it. My situation
    is dreadful and the conduct towards me cruel. General von Roeder represented this to Mr von Hardenberg
    while still at Wrocław, but I remained uninformed of the result as well. — I entreated the protection
    of the two monarchs afresh in certain cases, so as not to let the reproach of a neglect be charged
    to me, and entrusted my letter to the King to the Staats Kanzler, and that to the Emperor to Mr Minister
    von Stein, for delivery; this too I did not wish to [uncertain: conceal] from you, but I beg that
    of this disclosure only the most cautious use be made. Let me, Your Right Honourable, [uncertain:
    not] be without early news of the arrival of this letter, and instruct me as to the course of your
    negotiations. More swiftly I could not comply with your wishes, since the letter goes off tomorrow
    morning with the mounted post tomorrow and probably arrives on the 11th of this month in Dresden.
    As I hear today, the two monarchs had already departed for Altenburg; in no case, however, can you
    be so far removed from them that you could not personally open the'

- page: 1
  en: 'Right Honourable Sir,


    Highly Honoured Sir, Councillor of War and Forests.


    Your messenger arrived only this forenoon; he excuses himself for having been so long on the road
    by saying that he had gone astray. From his march route I see that he was also with the chief district
    administrator Koenig, [uncertain: where] he says that the latter was at home and took the letters
    from him in person. Neither Trzciński, Zerboni, nor Koenig[illegible] lets anything be heard of himself;
    the first has still paid nothing, the second has likewise as yet fulfilled none of his obligations.
    Herr Weigel presses me very hard; I shall now try whether I can pacify him by means of the Trzciński
    bills of exchange. These monies from Großen I needed for true necessity, for unhappily everything
    here still stands as you know it. Your complete silence has filled me with sorrow, since I conclude
    from it that all your efforts on my behalf have been fruitless. I sent Your Right Honourable a messenger,
    who however brought back only a certificate of receipt from the district administrator at Blizanow,
    which Herr Schenck — after he had detained this express four days — expanded to the effect that you
    had travelled away, would return in fourteen days, and that I should then soon receive an answer;
    this, to my great regret and real disadvantage, did not follow. Only today do I see from Your Right
    Honourable''s dispatch of the 29th of April that you had written to me earlier, which lines I did
    not receive. I can assure you upon my word that the letter I here answer is the first I have received
    from you since you left Schlawenschitz; in vain, alas, have I long yearned for it. I'

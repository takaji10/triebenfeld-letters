- page: 3
  en: 'of a fair maintenance allowance for myself; this intercession also was refused me. Otherwise they
    keep silent about everything, and it seems they wish in the end to abandon me to death by hunger.
    You already know all of this, wherefore I find it useless to say anything further of it. My situation
    is dreadful and the conduct towards me cruel. General von Roeder represented this to Herr von Hardenberg
    while still at Breslau, but I too remained uninformed as to the result. — I have implored anew the
    protection of the two monarchs in certain cases, so as not to let the reproach of a neglect be charged
    to me, and I entrusted my letter to the King to the State Chancellor, and that to the Emperor to Herr
    Minister von Stein, for delivery; this too I did not wish to withhold from you, but I beg that the
    most cautious use only be made of this disclosure. [uncertain: Release] me, Your Right Honourable,
    [uncertain: without] early news of the arrival of this letter, and instruct me as to the course of
    your negotiations. I could not comply with your wishes more quickly, since the letter goes off tomorrow
    morning by the mounted post and will probably arrive in Dresden on the 11th of this month. As I hear
    today, the two monarchs had already departed for Altenburg; in no case, however, can you be so far
    distant from them that you could not personally open the negotiations'

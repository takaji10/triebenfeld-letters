  en: '18 June. To His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, Royal Prussian General
    of Infantry [uncertain: a] and Governor of


    Wrocław.


    In the office, to be


    fair-copied.


    Done, and to the post by Radke, 3 Jan. Gtt[illegible] Most Serene Prince, Most gracious Prince and
    Lord, Your Serene Highness''s lawsuit against Michaelina von Prusimska has been so hastened by the
    Government at Poznań, in consequence of a cabinet order addressed to it on 1 July of this year recommending
    the speedy pursuit of the case, that judgment had already been given in it when the order of the 7th
    of this month arrived there.


    [illegible] the files were to be sent to Warsaw [illegible]. [illegible] the decision of the first
    instance [illegible] the Government has not reported; Your Serene Highness''s authorised agent will
    also [uncertain: hoch] have been informed already, or will be informed without delay. In [illegible]sching[illegible]
    [illegible] from the one side or the other'

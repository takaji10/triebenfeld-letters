- page: 3
  en: 'that the citizens were in the right has now proved itself, and the King of Württemberg has had
    occasion to show himself with Caropin — the matter was this — A courier coming from Paris hastens
    through Stuttgart — the King learns of it quickly enough. Has the fellow arrested at once and the
    despatches taken from him — He unseals them and finds among them the letter from Hortensia in which
    she writes to Eugène —


    "Continuez d''amusez notre imbécille —" The reference was to the Russian Emperor — the King of Württemberg
    despatched this pretty piece of correspondence here at once by courier, who arrived here the day before
    yesterday — but what sensation this news has made is not yet known — The various amusements go on
    all the same, notwithstanding that Bonaparte already has some 300/m men assembled and Murat presses
    ever further forward — I fear that one esteems one''s enemy too lightly, and that the Russian commanders
    wish to extend the war far and wide in order to [uncertain: satisfy] their rapacity and greed of gain
    — In a word, the most active man of all is Prince Hardenberg, for the King with those about him certainly
    cares and thinks about everything that concerns the military; so it seems, so burns the hair with
    eagerness to let the enemy feel his avenging arm — The King goes from here by way of Berlin to Frankfurt
    am Main — it is even believed that he will lead the advance guard — that would surely be venturing
    too much. It is past belief how brave the gentleman is — Only a sovereign ought surely to spare himself
    somewhat and, in his truly praiseworthy survey, keep the whole before his eyes.


    This moment I hear that the King departs on the 18th; if that really happens then I shall go to him
    beforehand and lay before him Your Serene Highness''s and Adolph''s resolve, and beg him to determine
    whither Adolph is to come and what uniform he is to have made for himself. It is believed he will
    certainly take him into his Guard, for a young, brisk, wealthy and capable man is something rare'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! Your Serene Highness''s most highly esteemed letter of
    the 3rd of April I received this morning early. Hungary [or: unhappily] I saw that the letter to me
    was not enclosed in a cover, it lay merely in the envelope addressed to the Post Director Mann; naturally
    he unsealed it, and despite his assurance he has certainly read it — even to B this was most disagreeable
    — for one does not let everybody [illegible: "in der Charte kublen"] . In short, it was vexatious.
    Now to the matter: concerning P. Adolph''s resolve I had just now a letter almost finished, to advise
    Your Serene Highness of this very thing. God be thanked that My only wish is that P How they met one
    another in these sentiments. Adolph still finds the King here, for, as it is said, the King departs
    and the Prince H remains here still, to arrange everything — Should this indeed not come to pass,
    then I shall go to the King and report to him Your Serene Highness''s and Adolph''s resolve, and ask
    him whither he commands that Adolph shall follow him, and in what manner he may equip himself. For
    the rest, should he come, I shall tell him well enough what he has to do. — f H and M H: must by no
    means be mixed up in any military affairs; that would be a sin against the Holy Ghost. A still better
    purpose may be attained thereby. Would to God Adolph were already here. Now to your own affairs —
    Your [uncertain: Irrenrieden] cut my heart in two; but I can compel neither the Prince nor anyone
    else to lay aside those matters wherein the weal and woe of millions of men is at stake, and to take
    up your business — Does the Prince answer to [uncertain: Liende] entreaty — God, I shall certainly
    help the man to whom I am a true friend before I depart from here, for I must, and every friend of
    yours must, fall silent in reverence. I certainly seek out every path whereon I may hope with confidence
    to reach the goal. Only at this juncture one must not be unjust. It knows there everything is at stake,
    must be considered — and he is, by God, the only one'
- page: 2
  en: 'who thinks day and night. It is enough for me that he protests his readiness to help Your Serene
    Highness. I certainly suffer more than you do with those about you; and therefore my heart would burst
    when I receive enclosures of that kind. Lombardini wrote lately as was fitting — the [uncertain: d.
    G.] Councillor of State von Beugelin), from whom Your Serene Highness must now absolutely have an
    answer / took this affecting letter and gave it to the Chancellor. By God, it has not failed of its
    purpose — but the letter of the two Hahns, alarming as it is, I certainly must not, by the judgment
    of both friends, show. It contains threats which even a friend and an honest man does not tolerate.
    — I recognise the burning zeal of the upright Hahn, but this does not suit on this course — There
    are men of consequence here already 5 months, and yet they are still to have their first audience
    — How, and perhaps for centuries, has there been an epoch so important as the present. The French
    affair is now the affair of the whole nation — millions will stand against one another, and General
    [uncertain: Zünger] will often make the greatest diversions, and therefore desperation will hold the
    helm. It is a fortune that the harmony of the Sovereigns endures — Austria certainly acts nobly and
    bravely — this has already proved itself in Italy. But on the [uncertain: O] Rhine matters still look
    very ill — what one is to think of the Russians one does not know. — Their march goes very [uncertain:
    schenkenförmig] — the [uncertain: K. Alt:] seems to take little notice of it, and thinking men shook
    their heads — The Viceroy of Italy is gone. The scene which the citizens must have brought about,
    where some barred the Emperor''s way and asked him how he could so familiarly, arm in arm with such
    a traitor and rogue, drive about in public by day and by night — indeed, where one of the citizens
    was a match for both, and the gentlemen had to retire into a house — the wretch has gone on his word
    of honour to Bayreuth,'
- page: 3
  en: 'that the citizens were in the right has now been proved, and the King of Würtemberg has had occasion
    to show himself with [uncertain: Caropin] — the affair was this: A courier coming from Paris hastens
    through Stutgardt — the King learns of it quickly enough. He has the fellow arrested at once, and
    the despatches taken from him — He unseals them and finds among them the letter from the Hortenau,
    wherein she writes to Eugen: Continuez d''amusez notre imbécille. Now the reference was to the Russian
    Emperor — the King of Würtemberg sent this pretty correspondence at once by courier hither, which
    arrived here the day before yesterday; what sensation this news has produced is not yet known. The
    various amusements continue notwithstanding, although Bonaparte has already some 300000 men assembled
    and Murat presses ever further forward. I fear that one esteems one''s enemy too lightly, and that
    the Russian commanders wish to extend the war far and wide, in order to gratify their rapacity and
    greed — In a word, the most active man of all is Prince Hardenberg, for the King certainly takes thought
    and care with those about him over everything that touches the military; and as it seems, [uncertain:
    the Hair] burns with desire to let the enemy feel his avenging arm. The King goes from here by way
    of Berlin to Frankfurth on the Main — some even believe that he will lead the advance guard — that
    would surely be venturing too much. It is incredible how brave the gentleman is. But a Sovereign ought
    surely to spare himself somewhat, and only in his truly praiseworthy [manner] to keep the survey of
    the whole before his eyes. This moment I hear that the King departs on the 18th; if that really happens,
    then I shall go to him beforehand and lay before him Your Serene Highness''s and Adolph''s resolve,
    and beg him to determine whither Adolph shall come, and what uniform he shall have made for himself.
    It is believed he will certainly take him into his Guard, for a young, brisk, wealthy and capable
    man is a rare thing'
- page: 4
  en: 'I say to Your Serene Highness that one will soon be able to see clearly regarding France''s fate.
    I wondered that you have no news at all there. Of the resolve of the Sovereigns there is nothing more
    to be said; it stands firm as a rock — each has declared how many troops he furnishes and when they
    are to be put in the field. Thus Austria furnishes, for [uncertain: Ober Johann], 200000, who are
    to stand on the Rhine by the 20th of May, and 120000 to Italy, of which 48000 already stand there;
    Russia furnishes in all 270000 men — Prussia 200000, of which now above 8000 stand there; Bavaria
    furnishes 76000 men — Hannover 30000 men, Spain 100000, Portugal according to the treaty concluded
    the day before yesterday 30000 men, Sardinia 30000, Dannemark 25000 men, [uncertain: beim] 40000,
    Wurtemberg 20000, Holland 40000 men; Electoral Hesse has, like [uncertain: daran ſtadt], not yet declared
    itself; Saxony must furnish 12000 men — Switzerland 30000 men. Medlenburg, the [uncertain: Hecheschen]
    lands, Weimar, Gotha, and whatever all the gentlemen are called, in all 60000 — the Grand Duke of
    Baden is to furnish 12000 men — but he cries out that he has no money — Sweden is quite silent. The
    whole army of the Allies amounts, according to the treaty-wise arrangement — 1307000 men; against
    which stands, but for a few little heaps, the whole of France. From the 20th of May on, all is to
    press into France. Bonaparte is, as Your Serene Highness knows, declared an outlaw, and his [uncertain:
    Hißgeſellen] or so-called Marshals as dishonoured [uncertain: Wühte] along with him — nothing in France
    is to be spared. This the Emperor of the Russians has already publicly declared — All this would be
    well, but the delaying is good for nothing. — Can the proscribed man not play the praevenire somewhere?
    and will the Bonapartist hordes not all, since they see their death before their eyes, grow desperate
    and fight? and what will in the end Field-Marshal Hunger say? His manoeuvres one ought surely to fear
    the most — From Russia much grain and cattle are to come — I do not credit the Viennese ministers
    and the government with much good. They will plunder everything away here and our troops will suffer
    want — It is also said that even if Bonaparte were delivered up, the advance into France would go
    forward all the same. For the rest, all this seems to hinder Pourtales''s arrival here. He has as
    yet let nothing further be heard from him. If it does not go now, then you will have your paper back
    forthwith. Just so it now [uncertain: sapperts] with the [uncertain: Rohr] affairs — Prince [uncertain:
    Rodecurii] goes to Posen to receive the homage, and Zerboni goes with him — but it is believed that
    all this will take on another shape — The Poles are beginning to grow very loud again, and thereby
    many a thing will get another name. Nevertheless I shall hear what comfort the Councillor of State
    will give in this matter the day after tomorrow. That Your Serene Highness at last suffers want there,
    I believe and feel it a thousandfold, for I suffer it along with my own — I have neither rest nor
    dwelling to remedy the distress, and hope that my endeavour will succeed — but the [uncertain: Vorblünten]
    reproaches / that you have sent money hither, that you lose patience / that can please me no longer.
    I certainly lose ten times more than you have sent, and still I hold fast to patience, in order to
    save you, my Prince, which will also come to pass ere long. 2. In deepest reverence I remain Your
    Serene Highness''s


    Vienna, the 13th of April 1815.


    humble and obedient servant

    v Triebenfeld'

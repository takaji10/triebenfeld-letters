- page: 4
  en: 'I say to Your Serene Highness that one will soon be able to see clearly concerning France''s fate
    — I was astonished that you have no news at all there. Concerning the resolve of the sovereigns there
    is nothing further to be said, it stands firm as a rock — each has declared how many troops he furnishes
    and by when they are to be put in the field. Thus Austria gives for the Upper Rhine 200,000, who are
    to stand on the Rhine on the 20th of May, and 130,000 for Italy, of whom 48,000 already stand there;
    Russia gives in all 270,000 men — Prussia 200,000, of whom now more than 8,000 stand there; England
    gives 76,000 men — Hanover 30,000 men, Spain 100,000, Portugal, by the treaty concluded the day before
    yesterday, 30,000 men, Sardinia 30,000, Denmark 25,000 men, [uncertain: by them] 40,000, Württemberg
    20,000, Holland 40,000 men; Electoral Hesse has, like the rest of them, not yet declared itself; Saxony
    must furnish 12,000 men — Switzerland 30,000 men. Mecklenburg, the Hessian lands, Weimar, Gotha and
    whatever all the gentlemen are called, 60,000 in all — the Grand Duke of Baden is to furnish 12,000
    men — But he cries out that he has no money — Sweden is quite silent — the whole army of the allies
    amounts, by the moderate arrangement of the treaties, to 1,307,000 men; against it stands, but for
    a few little houses, the whole of France — From the 20th of May on, all are to press into France.
    Bonaparte is, as Your Serene Highness knows, declared an outlaw, and his fellow-ruffians or so-called
    Marshals with him as dishonoured brutes — Nothing in France is to be spared. This the Emperor of the
    Russians has already publicly declared — All this would be well, but the delaying is good for nothing.
    — Can the outlaw not play the prævenire somewhere? and will the Bonaparte hordes not all, seeing their
    death before their eyes, grow desperate and fight? and what will Field Marshal Hunger say in the end?
    His manoeuvres are surely most of all to be feared — Much grain and cattle are said to be coming from
    Russia — I expect little good of the [uncertain: Wünsch] ministers and of the government — They will
    plunder everything away here and our troops will suffer want — It is said too that even if Bonaparte
    were given up, the advance into France would go forward all the same — For the rest, all this seems
    to hinder Pourtalès''s arrival here — He has let nothing further be heard from himself — If it does
    not go forward now, then take your paper back at once — Just so does it now stick fast with the Rohr
    affairs — Prince Radziwiłł is going to Poznań to receive the homage, and Zerboni goes with him — But
    it is believed that all this will take on another shape — The Poles are beginning to grow very loud
    again, and much will thereby get another name — Nevertheless I shall hear what comfort the Privy Councillor
    of State gives in this matter the day after tomorrow. That Your Serene Highness is at last suffering
    want there I do believe, and I feel it a thousandfold, for I suffer it together with my own people
    — I have neither rest nor dwelling in seeking to relieve the distress, and I hope that my exertions
    will succeed — but the [uncertain: Vorblünten] reproaches / that you have sent money here, that you
    are losing patience / that can please me no longer — I am assuredly losing ten times more than you
    have sent — and still I hold fast to patience, in order to save you, my Prince, which will also come
    to pass before long — In deepest reverence I remain


    Your Serene Highness''s


    Vienna, the 13th of April


    1815.


    humble and obedient servant


    v Triebenfeld'

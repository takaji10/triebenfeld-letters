- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Your Serene Highness''s most highly esteemed letter of the 3rd of April I received this morning early.
    [uncertain: Hungary] I saw that the letter to me was not enclosed in a cover, it lay merely in the
    envelope addressed to the Post Director Mann, naturally he unsealed it and despite his assurance he
    has certainly read it — even B found that most disagreeable — for one does not let just anyone [uncertain:
    cool himself in the chart].


    In short, it was a wretched business.


    Now to the matter: regarding P. Adolph''s resolve, I had just now a letter nearly finished in order
    to advise Your Serene Highness to this. God be thanked that my only wish is that P


    How in these sentiments we met one another.


    Adolph may still catch the King here, for it is said that the King departs and the Prince H remains
    here still to arrange everything —


    Should this indeed not happen, then I shall go to the King and report to him Your Serene Highness''s
    and Adolph''s resolve, and ask him whither he commands that Adolph shall follow him, and in what manner
    he may equip himself.


    For the rest, should he come, I shall already tell him what he has to do. — F H and M H: must on no
    account be mixed into military affairs, that would be a sin against the Holy Ghost. By this means
    an even better purpose may be attained. Would to God Adolph were already here.


    Now to your affairs — your [uncertain: Irrenrieden] cut my heart in two; but I can compel neither
    the Prince nor anyone to set aside matters where the weal and woe of millions of men is at stake and
    to take up your business instead — when the Prince answers to [uncertain: Liende] entreaty — God,
    I shall certainly help the man to whom I am a true friend before I depart from here — then I, and
    every one of your friends, must fall silent in reverence. I certainly seek out every road on which
    I may hope with confidence to reach the goal. Only at this juncture one must not be unjust. It is
    known that everything stands at hazard, let that be considered — and he is, by God, the only one'

- page: 4
  en: 'I say to Your Serene Highness that one will soon be able to see clearly about France''s fate. I
    wondered that you have no news at all there. Concerning the resolve of the sovereigns there is nothing
    more to say; it stands firm as a rock — each has declared how many troops he gives and by when they
    are to be put in the field. Thus Austria gives, by [uncertain: Ober Johann], 200000, who are to stand
    on the Rhine on the 20th of May, and 120000 for Italy, of whom 48000 are already standing there; Russia
    gives in all 270000 men — Prussia 200000, of which now more than 8000 stand there; [uncertain: haguland]
    gives 76000 men — Hanover 30000 men, Spain 100000, Portugal according to the treaty concluded the
    day before yesterday 30000 men, Sardinia 30000, Denmark 25000 men, [uncertain: beim] 40000, Württemberg
    20000, Holland 40000 men, the Electorate of Hesse has not yet declared itself, any more than [uncertain:
    daran ſtadt]; Saxony must furnish 12000 men — Switzerland 30000 men. Mecklenburg, the Hessian lands,
    Weimar, Gotha and whatever the gentlemen are all called, together 60000 — the Grand Duke of Baden
    is to furnish 12000 men — but he cries out that he has no money. — Sweden is quite silent. The whole
    army of the allies amounts, according to the agreement fixed by treaty, to 1307000 men; against it
    stands, but for a few small heaps, the whole of France. From the 20th of May all are to press into
    France. Bonaparte is, as Your Serene Highness knows, declared an outlaw, and his fellow-ruffians or
    so-called marshals along with him as men without honour. Nothing in France is to be spared. This the
    Emperor of the Russians has already publicly declared. — All that would be well, but the delaying
    is good for nothing. — Can the proscribed man not play the prævenire somewhere? and will not the Bonapartist
    hordes, since they see their death before their eyes, all grow desperate and fight? and what will
    Field Marshal Hunger say at the last? Whose manoeuvres one ought surely to fear the most. — From Russia
    much grain and cattle are said to be coming. — I credit [uncertain: the Wünschen] ministers and the
    government with little good. They will plunder everything away here and our troops will suffer want.
    — It is said too that even if Bonaparte were given up, still the advance into France goes forward.
    For the rest, all this seems to hinder Pourtales''s arrival here. He has as yet let nothing further
    be heard of himself. If it does not succeed now, then have your paper returned to you at once. Just
    so does it stick fast now with the [uncertain: Rohr] affairs — Prince [uncertain: Rodecurii] goes
    to Posen to receive the homage, and Zerboni goes with him — but it is believed that all this will
    take on another shape. The Poles are beginning to grow very loud again, and thereby many a thing will
    get another name. Nevertheless I shall hear what comfort the Privy Councillor of State will give in
    this matter the day after tomorrow. That Your Serene Highness at last suffers want there I do believe,
    and feel it a thousandfold, for I suffer it along with my own people — I have neither rest nor dwelling
    in seeking to relieve the distress, and I hope that my endeavour will succeed — but the [uncertain:
    Vorblünten] reproaches / that you have sent money here, that you lose patience / that can please me
    no longer. I certainly lose ten times more than you have sent, and still I hold fast to patience,
    in order to save you, my Prince, which will also come to pass within a short time. 2. In deepest reverence
    I remain


    Your Serene Highness''s


    Vienna, the 13th of April


    1815.


    humble and obedient servant


    v Triebenfeld'

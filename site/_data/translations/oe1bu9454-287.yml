  en: '287


    Most Serene Prince


    Most gracious Lord!


    I received Your Serene Highness''s most highly esteemed letter of the 3rd of April this morning. Hungary
    I saw that the letter to me was not enclosed in a cover, it lay merely in the envelope to the Post
    Director Mann; naturally he unsealed it, and despite his assurance he has certainly read it — even
    B[arbe] found this most disagreeable — for one does not let just anyone [uncertain: peep] into one''s
    cards — in short, it was a vexing business — Now to the matter: as regards P[rince] Adolph''s resolve,
    I had just now a letter almost finished to advise Your Serene Highness to this very course — God be
    thanked that we met in the same sentiments — My one wish is that Prince Adolph should still find the
    King here, for it is said that His Majesty is departing and Prince H remains here yet to arrange everything
    — Should this indeed come to pass, I shall go to the King and report to him Your Serene Highness''s
    and Adolph''s resolve, and ask him whither he commands that Adolph should follow him, and in what
    manner he may equip himself — For the rest, should he come, I shall tell him well enough what he has
    to do. — f H and M H: may on no account be mixed up in military matters, that would be a sin against
    the Holy Ghost — By this means an even better purpose may be achieved — Would to God Adolph were here
    already — Now to your affairs — Your lamentations cut my heart in two, but I can compel neither the
    Prince nor anyone else to set aside matters in which the weal and woe of millions of men is at stake
    and to take up your business — If the Prince answers Liende''s petition — God, I shall certainly help
    the man, whose true friend I am, before I depart from here, for I, and every friend of yours, must
    fall silent in reverence — I assuredly seek out every road on which I might hope with confidence to
    reach the goal — Only at this juncture one must not be unjust — It is known there that everything
    is at stake, that must be borne in mind — and he is, by God, the only one'

- page: 3
  en: 'that the citizens were in the right has now proved true, and the King of Württemberg has had occasion
    to show himself with [uncertain: Caropin] — the affair was this: a courier coming from Paris hastens
    through Stuttgart — the King learns of it quickly enough. He has the fellow arrested at once and the
    dispatches taken from him — he unseals them and finds among them the letter from the Hortenau, in
    which she writes to Eugen: Continuez d''amusez notre imbécille.


    Now, the talk was of the [uncertain: Mißischen] Emperor — the King of Württemberg sent this pretty
    correspondence here at once by courier, which arrived here the day before yesterday; what sensation
    this news has made is not yet known. The various amusements continue meanwhile, notwithstanding that
    Bonaparte has already some 300000 men assembled and Murat is pressing ever further forward. I fear
    that one rates one''s enemy too low, and that the Russian commanders wish to draw the war far out,
    in order to pursue their rapacity and greed. — In a word, the most active man of all is Prince Hardenberg;
    for the King certainly cares and thinks with those about him about everything that concerns the military;
    and as it seems, the gentleman burns with eagerness to let the enemy feel his avenging arm. The King
    goes from here by way of Berlin to Frankfurt am Main — some even believe that he will lead the advance
    guard — that would surely be too much hazarded. It is incredible how gallant the gentleman is. Only
    a sovereign ought surely to spare himself somewhat, and in his truly praiseworthy [conduct] keep the
    survey of the whole before his eyes.


    This very moment I hear that the King departs on the 18th; if that really happens I shall go to him
    beforehand and lay before him Your Serene Highness''s and Adolph''s resolve, and beg him to determine
    whither Adolph is to come, and what uniform he is to have made for himself. It is believed he will
    certainly take him into his Guard, for a young, brisk, wealthy and able man is a rare thing'

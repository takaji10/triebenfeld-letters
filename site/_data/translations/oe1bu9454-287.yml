- page: 2
  en: 'who thinks day and night — For me it is enough that he protests his will to help Your Serene Highness.
    I assuredly suffer more than you do with those about you — and therefore my heart might well burst
    when I receive enclosures of that kind — Lombardini wrote lately as was fitting — the Privy Councillor
    of State von Beguelin / from whom Your Serene Highness must now absolutely have an answer / took this
    affecting letter and gave it to the Chancellor of State. By God it has not missed its purpose — but
    the letter of the two Hahns I may certainly not show, in the judgement of both friends. It contains
    threats which not even a friend and honest man tolerates — I recognise the burning zeal of the upright
    Hahn, but this does not suit the course we are on — There are men of consequence here already five
    months, and they are yet to have their first audience — How, and perhaps for centuries past, has there
    been an epoch so weighty as the present one — The French cause is now the cause of the whole nation
    — Millions will stand against one another — and General Hunger will often make the greatest diversions,
    so that desperation will take the helm — It is a piece of good fortune that the harmony of the sovereigns
    endures — Austria assuredly acts greatly and worthily — this has already proved itself in Italy. But
    on the Upper Rhine matters still look very bad — what one is to think of the Russians one does not
    know. — Their march proceeds very [uncertain: sparingly] — the K. Alt: seems to take little notice
    of it, and thinking men shook their heads — The Viceroy of Italy is gone. The scene which the citizens
    must have made must have had its effect, where some of them barred the Emperor''s way and asked him
    whether he could go about publicly by day and night, arm in arm and so familiarly, with such a traitor
    and scoundrel; indeed, where one of the citizens was a match for the two of them and the gentlemen
    had to retire into a house — the wretch has gone to Bayreuth on his word of honour,'

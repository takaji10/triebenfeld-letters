- page: 2
  en: 'who thinks day and night. It is enough for me that he protests his will to help Your Serene Highness.
    I certainly suffer more than you do with those about you; and so my heart could burst when I receive
    an enclosure of that kind. Lombardini wrote lately as was fitting — the Privy Councillor of State
    von Beugelin (from whom Your Serene Highness must now absolutely have an answer) took this affecting
    letter and gave it to the Chancellor. By God it has not failed of its purpose — but the letter of
    the two Hahns I certainly must not show, in the judgement of both friends. It contains threats such
    as even the friend and the upright man does not tolerate. — I acknowledge the burning zeal of the
    honest Hahn, but this does not suit the course of things — there are men of consequence here these
    5 months and they are not yet to have their first audience. — How, and perhaps in centuries, has there
    been an epoch so important as the present one. The French affair is now the affair of the whole nation
    — millions will stand against one another, and General [uncertain: Zünger] will often make the greatest
    diversions, and therefore desperation will hold the helm. It is a good fortune that the harmony of
    the sovereigns endures — Austria acts assuredly in a great and gallant manner — this has already proved
    itself in Italy. But on the Upper Rhine matters still look very bad — what one is to think of the
    Russians one does not know. — Their march goes very [uncertain: schencken förmig] — the Emperor Alexander
    seems to take little notice of it, and thinking men shook their heads. — The Viceroy of Italy is gone.
    The scene that occurred must have had its effect upon the citizens, where several barred the Emperor''s
    way and asked him how he could go about so intimately, arm in arm, publicly by day and by night with
    such a traitor and scoundrel; indeed, where one of the citizens was for the two of them and the gentlemen
    had to retire into a house — the wretch has gone to Bayreuth on his word of honour,'

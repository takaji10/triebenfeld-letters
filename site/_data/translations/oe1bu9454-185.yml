    Most Serene Prince


    Most gracious Prince and Lord!


    With the only conceivable longing I look for the powers of attorney and blank signed sheets requested
    of Your Most Serene Highness; without these I cannot be effective in the least, and must pass my time
    here entirely to no purpose. — But I fear especially that this great delay will yet awaken a mistrust
    among the persons negotiating, and that the good cause will thereby be wholly spoiled. I therefore
    beg Your Most Serene Highness once more most obediently to let the power of attorney required for
    the court fiscal Pochammer, as well as 2 court-attested powers of attorney in blank, together with
    some blank signed sheets, reach me at the very earliest.


    As concerns the encroachments of the Württemberg hatred upon Your Most Serene Highness''s states,
    they promise on this side to do everything against it; whether the assurances come from the heart,
    however, I do not know. I should most devotedly advise that all respects be set in motion there also,
    and that one be active on that side as well. Experience, as they say, makes wise.


    A couple of hours ago I had the honour of becoming acquainted with President von Hähneln. It was very
    sad for me to hear from this man that Your Most Serene Highness still suffers from your gouty attacks,
    and that the structure is still very much swollen. Do think, most gracious Lord, more upon your preservation,
    and resolve to have a fontanelle laid. Every thinking man holds this to be the only means by which
    Your Most Serene Highness may soon be wholly restored, and whereby you may attain a great age.


    If I have the good fortune to settle everything as wished, then I shall perhaps be so free as to lay
    myself personally at the feet of Your Most Serene Highness at Öhringen; in the sweet hope of hearing
    soon gratifying news from the same Most High Personage, I remain, until death, reverently


    Your Most Serene Highness''s


    Berlin


    the 20th of May 1806


    faithful and most obedient servant


    von Triebenfeld'

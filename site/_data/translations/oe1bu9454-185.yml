segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    With the utmost longing conceivable I await the powers of attorney and blank forms requested of Your
    Most Serene Highness; without these I cannot be effective in the least degree, and must pass the time
    here entirely to no purpose. – But I fear above all that this great delay may yet arouse a mistrust
    among the persons negotiating, and that thereby the good cause will be wholly spoilt. I therefore
    beg Your Most Serene Highness once again most obediently to let the power of attorney required for
    the Court Fiscal Pochammer, as also 2 judicially attested powers of attorney in blank, together with
    some blank forms, reach me at the very earliest.


    As concerns the encroachments of the Württemberg hatred upon Your Most Serene Highness''s states,
    they promise on this side to do everything against it; whether the assurances come from the heart,
    however, I do not know. I would most devotedly advise that all departments be set in motion there
    also, and that one be active on that side as well. Experience, as they say, makes wise.


    A couple of hours ago I had the honour of becoming acquainted with the President von Höhneln. It was
    very sad for me to hear from this man that Your Most Serene Highness still suffers from your gouty
    attacks, and that the [uncertain: Bau] is still very much swollen. Think, most gracious Lord, more
    upon your preservation, and resolve to have a fontanelle laid. Every thinking man holds this to be
    the sole means whereby Your Most Serene Highness may soon be entirely restored, and by which you may
    attain a great age.


    If I have the good fortune to settle everything according to wish, then I shall perhaps be so bold
    as to lay myself personally at Your Most Serene Highness''s feet in Öhringen; in the sweet hope of
    hearing soon gratifying news from that same most exalted person, I [uncertain: remain, until death,]
    reverentially


    Your Most Serene Highness''s


    Berlin


    the 20th of May 1806


    faithful and most obedient servant


    von Triebenfeld'

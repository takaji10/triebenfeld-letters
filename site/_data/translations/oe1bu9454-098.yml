- page: 2
  en: 'Your Highness might very conveniently remain here 3 to 4 days — The Monarch must have no good reasons
    for wishing Your Serene Highness''s route to be laid here by way of Berlin. Thoroughly I know nothing
    — every [uncertain: evil] probably has to do with Prince Solms. He has already, five months ago, married
    the widowed Princess Louis in secret. The King is greatly incensed at this, and it contributes much
    to his indisposition; the Queen, however, still passes from one chamber into the other. Yesterday
    evening the Princess was stripped of the dignity of Royal Highness, her court household withdrawn,
    other dispositions made regarding the children, and now she is to depart in haste with her husband,
    who is being transferred as Major with the Hussars to Ansbach — that this creates a mighty terror
    at Court, Your Serene Highness can'

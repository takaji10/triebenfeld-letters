- page: 1
  en: '98


    Most Serene Prince,


    Most gracious Lord!


    However full of torment my stay here becomes by degrees, I will nevertheless hold out until I see
    the Quest: matter set in order — but I am sending Glenck off with all haste, so that Your Most Serene
    Highness may have someone there to whom You may most highly give all Your commands.


    How hard the struggle has been here, Glenck will describe to Your Serene Highness; good things will
    be the fruits of the victory, the more [uncertain: Wannvoller und Cabewesen].


    That the King, Köckritz and Zastrow mean well by Your Serene Highness is proved by the invitation
    — it makes the journey a little toilsome for You, but the honour is the greater for it, and if Your
    Serene Highness departs from there on the 14th, or at the latest the 15th, then Highest the same may'

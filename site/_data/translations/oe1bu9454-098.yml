- page: 3
  en: 'readily imagine. And I believe it will be a relief to the Monarch if he can have You here for a
    couple of days.


    The pregnancy of the [uncertain: Armez verwerten] Princess first gave the public much occasion for
    unspeakable [uncertain: Reiformements], and still no one knows the least thing about this matter which
    has actually been settled beforehand. Deign to say nothing about it there either.


    Concerning Minister Hoym''s conduct, more by word of mouth. On one occasion he spoke very well before
    the King in Köckritz''s presence — but in secret, with his [illegible], he gave a contemptible opinion,
    upon which Mr von Voss for his part constantly relies. For that very reason I was glad that the King
    invited Your Serene Highness here so flatteringly — for then the B — will tremble again — because
    their conscience will torture them — Do not say anything to the Princess Sacken, Serene Highness,
    Your Serene Highness'

- page: 4
  en: 'say nothing of it here, that I have disclosed to Your Highness the base tricks of Hoym and Wedell.
    Also let


    nothing be noticed there. As to the secularisation business, Your Serene Highness should by all means
    say nothing — this is a mere farce; Prince George strongly advises against it — should anything ever
    be able to be done in the matter, then we will do it in Vienna — I promise Your Serene Highness to
    work with Prince George [uncertain: Borten] in due season as well as here — for from our side nothing
    is being done — and if you can obtain something and enlarge your realms, then it is all one whether
    you obtain it from thence or through action here — settled it remains — if you have much of it, all
    the more compliments will be paid you.


    Haugwitz is now [uncertain: squinting at] a great role, but Schulemburg they are removing, because
    the latter always wants war. In deepest submission I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 9th of January


    1799.


    most humble and faithful servant


    v. Triebenfeld.'

- page: 2
  en: 'most conveniently remain here 3 to 4 days — The Monarch must have no good grounds for wishing Your
    Serene Highness''s route to be laid here by way of Berlin. I know nothing thoroughly — meanwhile [uncertain:
    Bees] are probably in it too, about Prince Solms — He married the widowed Princess Louise in secret
    five months ago already. The King is greatly incensed at it, and this contributes much to his indisposition;
    the Queen, however, keeps moving from one chamber to the other — Yesterday evening the Princess was
    stripped of the dignity of Royal Highness, her household was withdrawn, other arrangements made concerning
    the children, and now she is to depart in haste with her husband, who is being transferred as a major
    with the hussars to Ausbach — that this causes a mighty terror at court, Your Serene Highness can'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! However full of torment my stay here becomes by degrees,
    I will nevertheless hold out until I see the Quat: matter brought into the clear — Glenck, however,
    I dispatch with all haste, so that Your Most Serene Highness may have someone there to whom Your Highness
    can give all commands. How hard the struggle has been here, Glenck will describe to Your Serene Highness;
    good things will be the fruits of the victory, all the more delightful and proven. That the King,
    Köckritz and Zastrow are well disposed toward Your Serene Highness is proved by the invitation — it
    makes the journey a little laborious for Your Highness, but the honour is all the greater, and if
    Your Serene Highness departs from there on the 14th or at the latest the 15th, then Your Highness
    could'
- page: 2
  en: 'Your Highness might very conveniently remain here 3 to 4 days — The Monarch must have no good reasons
    for wishing Your Serene Highness''s route to be laid here by way of Berlin. Thoroughly I know nothing
    — every [uncertain: Bees] probably has to do with Prince Solms — He married the widowed Princess Louis
    in secret five months ago. The King is greatly incensed at it, and this contributes much to his indisposition;
    the Queen, however, keeps moving from one chamber to another. Yesterday evening the Princess was stripped
    of her dignity as Royal Highness, the household was withdrawn, other arrangements made concerning
    the children, and now she is to depart in haste with her husband, who is being transferred as Major
    with the Hussars to Ansbach — that this causes a mighty terreur at Court, Your Serene Highness can'
- page: 3
  en: 'easily imagine. And I believe it will be a relief to the Monarch if he can have Your Highness here
    for a couple of days. The pregnancy of the Princess, [uncertain: verwerten] by the [uncertain: Armez],
    at first gave the public much occasion for unspeakable speculation, and still no one knows the least
    of this matter now actually settled upon. Deign to say nothing of it there either. Concerning Minister
    Hoym''s conduct, more by word of mouth. On one occasion he spoke very well before the King in Köckritz''s
    presence — but in secret, with his Wedell, he gave a base opinion, upon which the said v. Voss constantly
    relies. For that very reason I was glad that the King invited Your Serene Highness here so flatteringly
    — then the B— will tremble again — because their conscience will torture them. Tell the Princess Sacken,
    Serene Highness — Your Serene Highness'
- page: 4
  en: say nothing here of my having disclosed to Your Highness the wicked tricks of Hoym and Wedell. Let
    nothing be noticed of it there either. As for the secularisation business, let Your Serene Highness
    by all means say nothing — this is a mere farce; Prince George strongly advises against it — should
    something ever be able to be done in the matter, then we will do it in Vienna — I promise Your Serene
    Highness to work with Prince George there in due time as here — for on our side nothing is done —
    and if you can obtain something and enlarge your realms, it is all one whether you obtain it from
    that quarter or through action here — settled it remains — if you have much upon it, the more compliments
    will be paid you. Haugwitz now plays a great part, but Schulemburg is being removed, because the latter
    always wants war. In deepest submission I remain, until death, Your Most Serene Highness's Berlin,
    the 9th of January 1799. most humble and faithful servant v. Triebenfeld.

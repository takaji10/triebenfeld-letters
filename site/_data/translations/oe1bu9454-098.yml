- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    However full of torment my stay here gradually becomes, I shall nevertheless hold out until I see
    the matter of the quarters [uncertain: Quat:] set straight — Glenck, however, I am dispatching with
    all haste, so that Your Most Serene Highness may have someone there to whom Your Highness can give
    all commands.


    How hard the struggle here has been Glenck will depict to Your Serene Highness; good will be the fruits
    of the [uncertain: victory] all the more [uncertain: full of blessing] and


    proved.


    That the King, Köckritz and Zastrow are well disposed toward Your Serene Highness is proved by the
    invitation — it makes the journey a little toilsome for Your Highness, but the honour is all the greater,
    and if Your Serene Highness departs from there on the 14th or at the latest the 15th, then'

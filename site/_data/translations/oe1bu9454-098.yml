- page: 4
  en: 'nothing of it here, that I have disclosed to You the wicked tricks of Hoym and Wedell — And let
    nothing be noticed of it there either — As to the secularisation business, pray say nothing at all,
    Your Serene Highness — this is a mere farce — Prince George strongly advises against it — if anything
    can ever be done in the matter, we will do it in Vienna — I promise Your Serene Highness to work there
    with Prince George in its proper season just as here — for from our side nothing is being done — and
    if You can obtain something and enlarge Your realms, it is all one whether You obtain it from there
    or through action here — Settled it remains — if You have much to that end, the more compliments they
    will pay You.


    Haugwitz is now playing a great part, but Schulemburg is being removed, because the latter always
    wants war. In deepest submission I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 9th of January


    1799.


    most humble and faithful servant


    v. Triebenfeld.'

- page: 3
  en: 'easily imagine. And I believe it will be an alleviation to the Monarch if he can have Your Highness
    here for a couple of days.


    The pregnancy of the poor [uncertain: widowed] Princess at first gave the public much occasion for
    unspeakable [uncertain: gossip], and still no one knows the least thing about this matter, actually
    settled beforehand. Be pleased to say nothing about it there either.


    Of Minister Hoym''s conduct more by word of mouth. On one occasion he spoke very well before the King
    in Köckritz''s presence — but in secret, with his Wedde, he delivered a contemptible opinion, on which
    the very same Herr von Voss keeps relying. For that very reason I was glad to see that the King invited
    Your Serene Highness here so flatteringly — for now the B— will tremble again — because it will torture
    their conscience. To Her Serene Highness the Princess of Sacken, Your Serene Highness'

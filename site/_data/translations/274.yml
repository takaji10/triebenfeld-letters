status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The King of Würtemberg, seeing limits set to
    his power, has restored the Estates, which is known to Your Serene Highness, and soon thereafter he
    has proclaimed a kind of Diet, at which he has summoned all the Estates to appear on the 15th of March.
    Here he means to come to agreement with his vassals, Estates, and subjects — but beforehand he commands
    and lays down as law that there may be no question of any reduction of the taxes, which have been
    raised by 50 pC. p[er] c[ent]; for both the new and the old dues must remain in perpetuity as they
    stand today and be paid under the strictest execution. His W[ürttemberg] Majesty has himself commanded
    this to the Venerable Ancient Five Houses with the All-Highest formula "We Friedrich King of W", made
    it known to you etc., and had it thus insinuated. Of these sentiments raised in [uncertain: Huldwaller
    — reading unclear], notice has however been given to the Congress here — but nothing has been answered
    thereupon. The multitude of the Estates, among whom is in particular the old Metternich, have at once
    protested against it here at the Congress, and at the same time enquired whether they were bound to
    present themselves before the K[ing] of W[ürtemberg] on the 15th of March. As yet no answer has been
    given thereupon, and especially not to the latter question — Nevertheless I have had a hint from a
    high hand that it does no harm if the Estates appear. — Only none of them should let himself be bound
    to us and outwitted — — A general Constitution is being drafted, and in it all norms between lords,
    vassals, and subjects, in respect of the dues, and even the tolls etc., are being determined and fixed,
    and with this everyone will be able to be content. B: and Göschel now wish that I should give Your
    Serene Highness the speediest news of it, so that you may most urgently warn Prince August that he
    there, out of deep devotion to the uncle, concede nothing to his own detriment and to the damage of
    the whole, nor let himself be [uncertain: overreached] — of this last request I hereby discharge myself,
    whereby I also remark that Herr Goschel gives himself much trouble, yet in five months has not once
    even spoken to the Prince Chancellor himself; a Herr v. Gärtner who pressed himself forward has lost
    much and lies'
- page: 2
  en: in fact very ill these past few weeks. For the rest, the King of Saxony may now in fact go to Brünn,
    whither he has been summoned; he may not take his journey by way of Dresden, but must go through Silesia.
    At Brünn he is to declare that he is content and accepts the parcel assigned to him with the highest
    gratitude, and will thereby set himself at rest for evermore — provisionally this has already been
    done. Only the matter is to become more valid, when he is no longer called a prisoner as at present,
    if he repeats the declaration in freedom. The Grand Duke of Heßendarmstadt, who made a frightful noise
    on account of Westphalia and even took it upon himself to threaten, has been very handsomely and exceedingly
    vigorously dealt with. He now observes a humanly decent silence and now says yes willingly to everything.
    And so this matter too is settled. East Friesland the English have obtained, just as was secretly
    promised them before the war for their accession, and our Lord has for it the whole of Swedish Pomerania,
    and thus these matters too are settled to satisfaction. Switzerland, Italy, and Spain still excite
    the attention of the combined Powers at present, but this does not so much interest our Court, and
    one may reckon with the highest confidence upon a lasting peace. Since I now know for certain, though
    only these 3 days past, that Your Serene Highness's affairs, particularly the granting of the advance
    of 112000 Rthl, has been delayed so long purely on that account, I now hope for the speediest and
    best conclusion; for the Prince Chancellor, who must obtain the King's approval for the advance, would
    not come forward with it before all fear of a new war had been removed — this is now said to be the
    case, and now I hope for the end. The Trąbczyner vindication will cause me much anxiety — from the
    Prince Chancellor I have as yet no resolution upon it; I do not know what I should begin, for without
    his commands I must begin nowhere — A commission has been appointed in which General Amstetten presides;
    gladly would I have
- page: 3
  en: 'already submitted the matters there — but I have been advised against it; so much was intimated,
    that the records and means of proof should be held in readiness. I have therefore had the documents
    copied and attested. Likewise the process records have already been translated into German and signed
    by the sworn interpreter — they may be [uncertain: bought out/redeemed] from me and submitted wherever
    it shall be commanded. In respect of Your Serene Highness''s military affairs, the Prince Chancellor
    will doubtless take the opportunity to speak with His Majesty when he lays before the King the proposal
    concerning the advance of 112000 dl. The Congress will, as they say, last another 6 weeks — all the
    adjustments are to be entirely concluded here. Your Finance Minister von Bülow lies very ill of a
    burning fever; there reigns here a sickness from which few are spared. This is what I have been able
    to write to Your Serene Highness today from my sickbed. Respectfully I remain, as Your Serene Highness''s,
    Vienna, the 25 Febr 1815, wholly obedient servant v Triebenfeld'

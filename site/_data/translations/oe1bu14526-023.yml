    §. 9. All documents and records belonging to the estates the Serene Highness of the vendor promises
    faithfully to deliver up to the purchaser, so far as it has not yet been done, and likewise also those
    which are still needed at present in His Serene Highness''s action of account against von Broniewski,
    to hand over to the purchaser after the conclusion of that action. Yet the purchaser is also free,

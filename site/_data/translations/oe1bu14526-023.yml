    of the seal of the Justice Office of Frankfurt an der Oder, with my signature as the justice official.
    So done at Frankfurt an der Oder, the 21st of September 1804.


    Dr. Ernst Gottlob Born (L. S.), Royal justice official and university syndic, also assessor of the
    faculty of jurists.


    It is true that I have already, under the 21st of September 1804, authorised the criminal-court councillor
    and justice commissarius Mr. Guderian at Posen by a judicial special power of attorney to recognise
    judicially in my name the purchase contract concluded between the authorised representative of His
    Serene Highness the reigning Prince and Lord of Hohenlohe-Ingelfingen, the building councillor Glencke,
    and myself, concerning the estates Kolno and Kaemen, dated Frankfurt an der Oder the 15th of June
    1804, to accept the declaration of His Serene Highness that the stipulated moneys of the one hundred
    and forty-two thousand thaler Courant have been paid, and so forth. But since afterwards, for moving
    reasons, a new purchase contract was concluded between His Serene Highness and myself, dated Breslau
    the 16th of January 1805 and Frankfurt an der Oder the 25th of January 1805, concerning the said estates,
    and the same has been judicially executed both by the Serene Highness of the vendor and by myself,
    and since the criminal-court councillor Guderian reports to me that the Royal Most Praiseworthy South
    Prussian'

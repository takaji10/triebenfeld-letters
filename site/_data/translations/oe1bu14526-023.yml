status: draft
segments:
- page: 1
  en: 'The original hereof is on 137 rl. stamped paper, and has been taken to the mortgage files of Kolno
    and Kaemen. We Friedrich Wilhelm, by the Grace of God King of Prussia p. p.


    Do hereby make known and give to all and everyone, especially where it is needful, to know, that before
    the Commissarius appointed by Our Government here, Our Government Assessor Bewert, the reigning Prince
    Friedrich Ludwig zu Hohenlohe Ingelfingen, his Liebden, and the Bank Rendant George Conrad Leixner,
    both through their Mandatarien legitimated ad Acta for this purpose, Our Justice Councillor Melzer
    and Ew. Rath Guderian, appeared on the 6th of February 1805, expressly acknowledged the purchase contract
    concluded on the 16th and 25th of January ejusd. concerning the estates Kolno and Kaemen situated
    in the District of Posen, and requested that We might graciously be pleased to furnish this purchase
    contract with Our most high confirmation. The same, however, in its true content, reads as follows:'
- page: 2
  en: 'Between the Most Serene Prince and Lord, Lord Friedrich Ludwig, reigning Prince zu Hohenlohe-Ingelfingen,
    Royal General of Infantry and Governor at Breslau, and the Royal Bank Director at Franckfurth an der
    Oder, Herr George Conrad Leixner, the following purchase contract has been concluded.


    §. 1. His Most Serene Highness sells to Herr Bank Director Leixner the estates Kolno and Kaemen or
    Kamionna, situated in South Prussia, in the Department of Posen and its Meseritz district, acquired
    in property out of the deed of donation of the late King Friedrich Wilhelm the Second''s Majesty,
    of the 9th of August 1796, with all appurtenances, mills, inhabitants, fields, woods, lakes, waters,
    services, hunting, propination rights, and generally with all rights and privileges, burdens and en-'
- page: 3
  en: 'cumbrances, as his true property, for a purchase Pretium of 142,000 rtll., one hundred and forty-two
    thousand Reichsthaler, according to the coinage standard of 1764.


    §. 2. The purchase money of the 142,000 rtlr. is already fully paid. His Most Serene Highness gives
    receipt therefor, and acknowledges generally that He has no further demand upon the purchaser out
    of this transaction of sale.


    It is here noted historically that the payment of the purchase moneys took place in the following
    manner.


    a, 53,139 rt. 13 gg. 8 1/5 d. the purchaser has paid to the former Polish Rittmeister von Broniewski,
    who, as an immitted creditor, stood in the natural possession of the estates, as the sum legally awarded
    to him'
- page: 4
  en: 'Carried over 53,139 rt. 13 gg. 8 1/5. d., paid upon the Anweichung [assignment/instruction] of
    His Most Serene Highness.


    b, 88,860 rt. 10 gg. 3 1/5. d. have been paid in cash by the purchaser to His Most Serene Highness
    Himself and upon His Highness''s instructions (Anweisungen).


    i. e. 142,000 rttl.


    §. 3. Besides the purchase Pretium, the purchaser assumes the following items entered in the mortgage
    books upon Kolno and Kaemen:


    a, a capital of 100 Florin, one hundred Polish florins, for the church at Kaemen, the interest whereof
    is fixed at four Polish marks yearly.


    b, for the same church a capital of 250 rt., two hundred and fifty Reichsthaler, or 1500, fifteen
    hundred Polish florins, which bear interest at 3 1/2, three and one half per cent yearly.'
- page: 5
  en: 'The interest on these two items the purchaser assumes from St. John''s Day 1804.


    §. 4. The present sale takes place without valuation, in Pausch und Bogen. His Most Serene Highness
    nevertheless gives warranty for this:


    a, that the surface area of Ankkorn [uncertain term], meadows, heaths and lakes set out in the survey
    registers, which together with the maps have been delivered up to the purchaser, is actually present.
    His Most Serene Highness herewith assures that no claim by anyone whatsoever to the parcels of land
    set out in these survey registers has hitherto come to His Highness''s knowledge.


    The obligation of His Most Serene Highness to answer for the correctness of the survey register in
    the above manner is limited to'
- page: 6
  en: 'three years.


    b, that in public taxes no more is charged upon these estates than yearly for Kaemen 153 rt. 22 gg.
    8 pf., for Kolno - 125 - 21 - 2, and in ecclesiastical dues for Kaemen 16 - 16 gg.


    §. 5. The natural delivery of the estates to the purchaser has already taken place in the month of
    September 1804, and the proceedings recorded thereupon shall stand.


    With a view to the warranty, the following principles have been adopted between the contracting parties:


    a, that the usufruct of the estates is due to the purchaser from St. John''s Day 1804, from which
    time the purchaser has also to bear the'
- page: 7
  en: 'burdens. Any older arrears will be answered for by His Most Serene Highness. His Most Serene Highness
    also bears the Justitiariat salary up to Michaelmas of last year.


    b, that the estates shall be delivered to the purchaser as they stood and lay on the 15th of June
    of last year.


    c, that the purchaser may however demand only that Beilaß, in field, cattle and farming inventory,
    which von Broniewski received upon his immission in the year 1786, according to the Acta already handed
    over to the purchaser in tens schon Sprache [unparseable], and was obliged to restore.


    §. 6. Besides the church capitals noted in §. 2, there stands upon'
- page: 8
  en: the estates a mortgage capital of 100,000 rt., one hundred thousand Reichsthaler, entered out of
    a bond of indebtedness of His Most Serene Highness of the 1st of June 1804 in favour of the Councillor
    of War and Forests von Triebenfeld, who has ceded this mortgage to the purchaser. This debt is however
    already fully discharged, and the purchaser hereby expressly renounces all claims arising therefrom,
    both against His Most Serene Highness and against the Councillor of War and Forests von Triebenfeld.
    It is likewise solely the purchaser's business to effect the cancellation of this nexus in the land
    and mortgage books. The costs of cancellation, however, shall be borne half by His Most Serene
- page: 9
  en: 'Highness and half by the purchaser.


    §. 7. The costs for the drawing up and confirmation of this sale, for the natural and civil tradition,
    and generally all costs of the sale, by whatever name, shall likewise be borne half and half by both
    contracting parties.


    §. 8. Passive servitudes are not known to the vendor''s Serene Highness. On the other hand, these
    estates enjoy a right of timber-taking in the Krabielew woods.


    In a possessory suit against von Kwilecki such right was awarded to His Serene Highness, but in petitorio
    it was denied at first instance. The purchaser'
- page: 10
  en: 'takes over this rem litigiosam without demanding any warranty from the vendor''s Serene Highness.


    §. 9. All documents and files belonging to the estates the vendor''s Serene Highness promises faithfully
    to deliver up to the purchaser, so far as it has not already been done; likewise also those which
    are still at present required in His Serene Highness''s accounting suit against von Broniewski, [which]
    shall be handed over to the purchaser after the conclusion of that suit. It is however, as goes without
    saying, also free to the purchaser to have these papers not yet extradited inspected as often as he
    finds it necessary.'
- page: 11
  en: '§: 10.


    The contracting parties bind themselves to the maintenance of this contract in all its points and
    clauses, renounce all objections thereto, especially the objection of injury beyond the half (laesio
    enormis) and by whatever other name they may be called, and have executed this instrument by their
    own-hand signatures and appended seals.


    Breslau, the 16th of January 1805. Read by myself and approved (L. S.) Friedrich Ludwig Fürst zu Hohenlohe.
    I have read and approved this instrument.


    (L. S.) Meÿer Bernhard, in the name and subject to the approval of Herr Bank Director Leixner.


    That this purchase contract, between the Most Serene Prince and Lord, Lord Friedrich Ludwig, reigning
    Prince zu Hohenlohe Ingelfingen, Royal General of Infantry'
- page: 12
  en: and Governor at Breslau p., who is personally well known to me, the undersigned Notary, and to the
    witnesses, and the banker at Franckfurth an der Oder, likewise personally well known to us, Herr Meyer
    Bernhard, in the name and subject to the ratihabition of the Royal Bank Director Herr George Conrad
    Leixner, was agreed and concluded in the manner set out above and with our participation, and that
    this instrument, after being read through and approval declared, was executed by their own-hand signatures
    and appended seals, is hereby attested upon the ground of the protocol taken thereupon. Breslau, the
    16th of January 1805. (L. S.) Carl Gottlob Ebersbach, Royal Councillor of the Justice Commission and
    Notary Public in the Department of Breslau. (L. S.) Johann George Strebel, as witness. (L. S.) Johann
    Carl Stude, as witness.
- page: 13
  en: The foregoing purchase contract I have read myself and found drawn up in accordance with my intention.
    Franckfurth an der Oder, the 25th of January 1805. George Conrad Leixner (L. S.) That the Royal Bank
    Rendant Herr Georg Conrad Leixner, personally known to me and capable of disposition, has here, after
    his own reading through and approval, signed in my presence and sealed with his signet the purchase
    contract set out before and overleaf, d. d. Breslau the 16th of January 1805, by the content of which
    His Most Serene Highness the reigning Prince Herr Friedrich Ludwig zu Hohenlohe Ingelfingen p. p.
    has sold to Herr Leixner the estates Kollno and Kaemen, situated in South Prussia, Department of Posen,
    acquired out of the deed of gift of the late King's Majesty Friedrich Wilhelm II of the 9th of August
    1796, for the sum of 142,000 rt., one hundred and forty-two thousand;
- page: 14
  en: 'which is hereby attested in documentary form upon the ground of the protocol held thereupon, under
    the impress of the seal of the Justice Office of Franckfurth a/O. and my signature as Justice Official.
    And done at Franckfurth an der Oder on the twenty-fifth of January one thousand eight hundred and
    five.


    (L. S.) Dr. Ernst Gottlob Born, Royal Justice Official and University Syndic, also Assessor of the
    Faculty of Jurists at


    Franckfurth a/O.


    Actum Posen, the 6th of February 1805. Pursuant to the disposition of the 8th of'
- page: 15
  en: 'October a. pr., of the 21st of January a. c., and of the arrangement verbally made with the interested
    parties on that account, a term is appointed for today for the taking up of the purchase contract
    agreed between the Prince Hohenlohe Ingelfingen and the Bank Director Leixner at Franckfurth a/O.
    concerning the estates Kolno and Kaemen, of the District of Posen. At this term there appeared


    1, on the part of the vendor


    a, as his Mandatarius the Justice Councillor Melzer, who legitimated himself by the special power
    of attorney already in actis, granted to him for this Actus;


    b, the General Mandatarius of the Prince, the Building Councillor Glenk, already personally known
    to the undersigned;


    2, on the part of the purchaser, the Crimi-'
- page: 16
  en: 'nal Councillor Guderian, who refers for his legitimation to the special power of attorney granted
    him for this business, already submitted to the files by petition of the 28th of September a. pr.


    The interested parties on both sides present the annexed purchase contract d. d. Breslau the 16th
    of January 1805, already personally executed by both parties, furnished with the recognition d. d.
    Breslau de eod. and Franckfurth a/O. the 25th of January a. c., with the declaration that they had
    been expressly authorised only to declare this contract for the record, and that consequently no formal
    taking up of the contract was required, any more than they were authorised on their part to consent'
- page: 17
  en: 'therein.


    Thereupon the Justice Councillor Melzer declared in particular that the purchase contract handed in
    today accorded, in all its points and clauses, pursuant to the instruction given him, with the intention
    of his mandant''s will, and that upon the ground of the same he wished hereby to transfer to the purchaser,
    Bank Director Leixner, the property in the estates Kolno and Kaemen cum att. et pertinentiis, nothing
    whatsoever excluded therefrom, which belonged to him according to the deed of grant of His Majesty
    King Friedrich Wilhelm II of the 9th of August 1796.


    In like manner the Criminal Councillor Guderian acknowledged the purchase contract presented before,
    de dato Breslau the 16th of January 1805.'
- page: 18
  en: Bank Director Herr Leixner at Franckfurth a/O. concerning the estates Kollno and Kamienne belonging
    to me, and appurtenances, for a Pretium of 142,000 rtl., one hundred forty-two thousand Reichsthaler,
    to conclude, to execute the instrument of sale in My stead, and thereupon also to appear in My name
    before a most laudable Royal Government at Posen, to release the property of the said estates to the
    purchaser upon the effecting of the civil [conveyance], to request confirmation of the sale, and to
    consent to the entry of the title of possession for the purchaser, and to give him receipt for the
    fully paid one hundred forty-two thousand Reichsthaler of purchase moneys, and also to move that the
    one hundred thou-
- page: 19
  en: 'sand Reichsthaler intabulated upon these estates for the Councillor of War Herr von Triebenfeld
    may be cancelled.


    Breslau, the 5th of September 1804. Read by myself and approved. (L. S.) Friedrich Ludwig Fürst zu
    Hohenlohe. That the Most Serene Prince and Lord, Lord Friedrich Ludwig, reigning Prince zu Hohenlohe
    Ingelfingen, Royal General of Infantry and Governor at Breslau, appeared in person under today''s
    date before the von Stechow Arnoldsmühl Court Office and executed the foregoing power of attorney,
    after it had been read through and approval declared, by his own-hand signature and appended seal,
    is hereby attested upon the ground of the protocol taken thereupon. Breslau, the 5th of September
    1804. The von Stechow-Arnoldsmühl Court Office. (L. S.)


    Ebersbach


    Justitiarius


    Stade


    Actuarius.'
- page: 20
  en: Special power of attorney. I, the undersigned, do hereby make known and acknowledge that I herewith
    expressly empower Herr Criminal Councillor Guderian at Posen, in my name, to recognise judicially
    the purchase contract concerning the estates Kolno and Kaemen, Department of Posen, d. d. Franckfurth
    a/O. the 15th of June 1804, concluded between the plenipotentiary of His Serene Highness the reigning
    Prince zu Hohenlohe Ingelfingen, the Building Councillor Herr Glenck, and myself; to accept the declaration
    of His Serene Highness that the purchase moneys of the 142,000 rtlr., in words one hundred and forty-two
    thousand rttl., are paid, and thus that the §§ which speak of the payment of this purchase money are
    to be regarded as discharged; also to hold §. 12, concerning cooperation in the dismemberment of the
    estates, as lapsed, or else, should His Serene Highness so require, to conclude a new purchase contract
    on the model of the aforesaid one of the 15th of June 1804; to accept the resignationem bonorum
- page: 21
  en: and to move thereupon that the title of possession of the said estates be entered in the mortgage
    book in my name, as also generally to observe and attend to all that which I, were I personally present,
    should be obliged and entitled to do in this business. Whatever now my said plenipotentiary shall
    do by virtue of this commission received, I hereby promise to approve and to hold to it as inviolably
    as if I had done it myself. At the same time I also bind myself to indemnify my plenipotentiary in
    every respect on account of this commission, and to reimburse him all costs and outlays, under pledge
    of my present and future property, so far as is required
- page: 22
  en: 'for that purpose. In witness whereof I have signed this special power of attorney with my own hand
    and confirmed it by the impress of my usual signet.


    So done at Franckfurth a/O. on the 21st of September 1804.


    Read and found correct (L. S.) George Conrad Leixner. Upon the ground of the judicial protocol held
    today it is hereby attested that the Royal Bank Rendant Herr Georg Conrad Leixner here, well known
    to me by person and capable of disposition, has himself read through and approved, and as stands above
    has signed with his own hand and sealed in my presence, the foregoing special power of attorney drawn
    up according to his request and statement, wherein he authorises Herr Criminal Councillor Guderian
    at Posen to the recognition of the purchase contract concluded between him and His Most Serene Highness
    zu Hohenlohe Ingelfingen,


    d. d. Franckfurth a/O. the 15th of June 1804, and eventualiter to the conclusion of a new purchase
    contract'
- page: 23
  en: 'on the model of the aforesaid one of the 15th of June 1804. In documentary form, under the impress
    of the seal of the Justice Office of Franckfurth an der Oder, in my signature as Justice Official.
    So done at Franckfurth a/O., the 21st of September 1804.


    Dr. Ernst Gottlob Born (L. S.) Royal Justice Official and University Syndic, also Assessor


    of the Faculty of Jurists.


    It is true that I have already, under the 21st of September 1804, authorised the Criminal Councillor
    and Justice Commissarius Herr Guderian at Posen, by a judicial special power of attorney, to recognise
    judicially in my name the purchase contract concerning the estates Kolno and Kaemen, d. d. Franckfurth
    a/O. the 15th of June 1804, concluded between the plenipotentiary of His Serene Highness the reigning
    Prince and Lord zu Hohenlohe Ingelfingen, the Building Councillor Glencke, and myself, and to accept
    the declaration of His Serene Highness that the stipulated moneys of the one hundred and forty-two
    thousand Thaler Cour. are paid, and so forth. But since afterwards, for moving reasons, a new purchase
    contract concerning the said estates was concluded between His Serene Highness and myself, sub dato
    Breslau the 16th of January 1805 and Franckfurth o/O. the 25th of January 1805, and the same has been
    judicially executed both by the vendor''s Serene Highness and by myself, and the Criminal Councillor
    Guderian reports to me that the Royal, Highly Praiseworthy South Prussian'
- page: 24
  en: 'Government does not hold him legitimated thereby by the power of attorney cited above, because
    the same speaks of an earlier contract, I herewith and by force hereof will extend this power of attorney
    already issued to Herr Guderian to this effect: that he shall be entitled, upon the ground of the
    purchase contract already judicially declared for the record by me, d. d. Breslau the 16th and Franckfurth
    the 25th of January 1805, to apply for the entry of the title of possession in my name, to accept
    the resignationem bonorum, and in this business of purchase and sale to do everything in my name that
    I should do were I myself present; consequently, should it be necessary, which however I do not believe,
    to recognise the purchase contract of the 16/25 January 1805 once more judicially, to apply for the
    recognition of the entry of the title of possession once effected, and to receive the same for further
    conveyance to me.


    In witness whereof I have signed with my own hand and sealed this declaration and extension respectively
    of the above-mentioned power of attorney. So done at Franckfurth an der Oder on the 8th of March 1805.
    Read by myself and found correct. (L. S.)


    George Conrad Leixner. That the Bank Rendant here, Herr Georg Conrad Leixner, whom I know well by
    person, has [signed] the foregoing declaration respectively'
- page: 25
  en: 'and extension of the special power of attorney previously issued to Herr Criminal Councillor Guderian
    at Posen, concerning the entry of the title of possession of the South Prussian estates Kolno and
    Kamen in his, Herr Leixner''s, name, signed with his own hand in my presence and sealed, after his
    own reading through and approval - this I hereby testify upon the ground of the protocol held on that
    account this present day. So done at Franckfurth a/O., the 8th of March 1805. (L. S.)


    Dr. Ernst Gottlob Born.


    qua Justice Official of the Justice Office here.


    Since We have now, praevia de super partium Stipulatione, graciously deferred to this request, We
    do corroborate and confirm, with the most high Royal Sovereign Supreme Territorial-Princely power
    and plenitude residing in Us, the purchase contract inserted above, in such wise and manner that the
    same shall be valid, binding and permanent in all its points and clauses, shall be held firmly and
    inviolably, and that acting against it shall in no way be permitted. Yet this without prejudice to
    Our Royal Sovereign Supreme Territorial-Princely prerogatives, rights, services'
- page: 26
  en: 'and duties, and otherwise to those of every man. In documentary form, under the usual signature
    and greater seal of Our South Prussian Government here. Given at Posen, the 18th of March 1805. Confirmatio
    of the purchase contract concluded between the reigning Prince Friedrich Ludwig zu Hohenlohe-Ingelfingen,
    as vendor, and the Bank Rendant George Conrad Leixner, as purchaser, concerning the estates Kolno
    and Kaemen situated in the District of Posen. Fee: 2 rt. 2 gg.


    Stamp: 6 gg.


    Engrossing: 22 gg.


    Silk: 1 gg.


    No: 2244.'

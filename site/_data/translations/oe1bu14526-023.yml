- page: 2
  en: 'Between the Most Serene Prince and Lord, Lord Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen,
    Royal General of Infantry and Governor at Breslau, and the Royal Bank Director at Frankfurt an der
    Oder, Mr George Conrad Leixner, the following purchase contract has been concluded.


    § 1. His Most Serene Highness sells to the Bank Director Leixner the estates Kolno and Kaemen or Kamionna,
    situated in South Prussia, in the Posen Department and its Meseritz district, acquired in property
    by virtue of the deed of donation of His Majesty the late King Friedrich Wilhelm II of the 9th of
    August 1796, with all appurtenances, mills, residents, fields, woodlands, lakes, waters, services,
    hunting, propination rights, and generally with all rights and privileges, burdens and encum-'

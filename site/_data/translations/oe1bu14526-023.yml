- page: 25
  en: 'and extension of the special power of attorney previously issued to the criminal-court councillor
    Mr. Guderian at Posen, concerning the entry of the title of possession of the South Prussian estates
    Kolno and Kamen in his, Mr. Leixner''s, name, after reading it through and approving it himself, signed
    and sealed with his own hand in my presence - this I hereby testify upon the ground of the protocol
    held in that behalf under today''s date. So done at Frankfurt an der Oder, the 8th of March 1805.
    (L. S.)


    Dr. Ernst Gottlob Born,


    qua justice official of the Justice Office here.


    Since We have now, praevia de super partium stipulatione, graciously deferred to this request, We
    corroborate and confirm, with the most high Royal sovereign supreme princely power and plenitude residing
    in Us, the purchase contract inserted above, in such wise that the same shall be valid, binding and
    enduring in all its points and clauses, shall be held firmly and inviolably, and that it shall in
    no way be permitted to act against it. Yet this without prejudice to Our Royal sovereign supreme princely
    prerogatives, rights, services'

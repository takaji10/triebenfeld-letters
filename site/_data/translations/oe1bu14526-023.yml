- page: 1
  en: 'The original of this is on 137 Rthl stamped paper, and has been taken to the mortgage records of
    Kolno and Kaemen. We Friedrich Wilhelm, by the Grace of God King of Prussia etc. etc.


    Do hereby make known and give everyone, especially where it is needful, to know, that before the Commissioner
    appointed by Our Government here, Our Government Assessor Bewert, the reigning Prince Friedrich Ludwig
    of Hohenlohe-Ingelfingen, Your Lordship, and the bank cashier George Conrad Leixner, both through
    their agents legitimated hereto ad Acta, Our councillor of justice Melzer and Your Honour''s councillor
    Guderian, appeared on the 6th of February 1805, expressly acknowledged the purchase contract concluded
    on the 16th and 25th of January ejusd. concerning the estates Kolno and Kaemen situated in the Posen
    district, and have requested that We might graciously be pleased to furnish this purchase contract
    with Our most high confirmation. The same, however, reads in its true content as follows:'

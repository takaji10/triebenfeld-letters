- page: 24
  en: 'Government does not hold him legitimated by the power of attorney cited above, because it speaks
    of an earlier contract, I will hereby and by force of this extend the power of attorney already issued
    to Mr. Guderian to this effect: that he shall be entitled, upon the ground of the purchase contract
    already judicially declared by me, dated Breslau the 16th and Frankfurt the 25th of January 1805,
    to apply for the entry of the title of possession in my name, to accept the resignationem bonorum,
    and in this business of purchase and sale to do everything in my name that I would do were I myself
    present; consequently, should it be needful, which however I do not believe, to recognise the purchase
    contract of the 16th/25th of January 1805 judicially once more, to apply for the recognition of the
    entry of the title of possession effected and to receive the same for further forwarding to me.


    In witness whereof I have signed and sealed this declaration and extension respectively of the above-mentioned
    power of attorney with my own hand. So done at Frankfurt an der Oder on the 8th of March 1805. Read
    by myself and found correct. (L. S.)


    George Conrad Leixner. That the bank cashier here, Mr. Georg Conrad Leixner, whom I know well in person,
    the foregoing declaration respectively'

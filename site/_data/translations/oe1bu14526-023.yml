    § 7. The costs for the drawing up and confirmation of this purchase, of the actual and civil delivery
    of possession, and generally all costs of the sale, by whatever name, shall likewise be borne half
    by each of the two contracting parties.


    § 8. Passive servitudes are not known to His Serene Highness the seller. On the other hand there belongs
    to these estates a right of timber in the woods of Krabielewo.


    In a possessory suit against von Kwilecki such right was awarded to His Serene Highness, but in the
    petitory suit it was denied him in the first instance. The purchaser'

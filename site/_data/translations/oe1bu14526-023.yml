status: draft
segments:
- page: 1
  en: 'The original hereof is on 137 rl. stamped paper, and has been taken to the mortgage files of Kolno
    and Kaemen. We Friedrich Wilhelm, by the Grace of God King of Prussia p. p.


    Do hereby make known and give everyone, particularly where it is needful, to know, that before the
    Commissarius appointed by Our Government here, Our Government Assessor Bewert, the reigning Prince
    Friedrich Ludwig zu Hohenlohe Ingelfingen, his Liebden, and the Banco Rendant George Conrad Leixner,
    both through their Mandatarien legitimated ad Acta for this purpose, Our Justice Councillor Melzer
    and Ew. Rath Guderian, appeared on the 6th of February 1805, expressly acknowledged the purchase contract
    concluded on the 16th and 25th of January ejusd. concerning the estates Kolno and Kaemen situated
    in the Posen District, and requested that We might graciously deign to furnish this purchase contract
    with Our supreme Confirmation. The same, however, runs in its true content as follows:'
- page: 2
  en: 'Between the Most Serene Prince and Lord, Lord Friedrich Ludwig, reigning Prince zu Hohenlohe-Ingelfingen,
    Royal General of Infantry and Governor at Breslau, and the Royal Banco Director at Franckfurth on
    the Oder, Herr George Conrad Leixner, the following purchase contract has been concluded.


    §. 1. His Most Serene Highness sells to the Herr Banco Director Leixner the estates Kolno and Kaemen
    or Kamionna, situated in South Prussia, in the Posen Department and its Meseritz district, acquired
    in property by virtue of the deed of donation of His Majesty the late King Friedrich Wilhelm the Second,
    of the 9th of August 1796, with all appurtenances, mills, inhabitants, fields, woods, Senn, waters,
    services, hunting, propination rights, and generally with all rights and privileges, burdens and encum-'
- page: 3
  en: 'brances, to his true property, for a purchase price of 142,000 rtll., one hundred and forty-two
    thousand Reichsthaler, according to the coinage standard of 1764.


    §. 2. The purchase money of the 142,000 rtlr. has already been paid in full. His Most Serene Highness
    gives receipt therefor and acknowledges generally that He has no further claim upon the Herr purchaser
    out of this transaction of sale.


    It is noted here historically that the payment of the purchase moneys took place in the following
    manner.


    a, 53,139 rt. 13 gg. 8 1/5 d. the Herr purchaser has paid to the former Polish Rittmeister von Broniewski,
    who as an immitted creditor stood in natural possession of the estates, as the sum legally adjudged
    to him'
- page: 4
  en: 'Carried over: 53,139 rt. 13 gg. 8 1/5. d., paid upon the [uncertain: instruction] of His Most Serene
    Highness.


    b, 88,860 rt. 10 gg. 3 1/5. d. have been paid in cash by the Herr purchaser to His Most Serene Highness
    Himself and upon His most high instructions.


    i. e. 142,000 rttl.


    §. 3. Besides the purchase price the Herr purchaser assumes the following items entered in the mortgage
    books upon Kolno and Kaemen:


    a, a capital of 100 Florin, one hundred Polish florins, for the church at Kaemen, the interest whereof
    is fixed at four Polish marks yearly.


    b, for the same church a capital of 250 rt., two hundred and fifty Reichsthaler, or 1500, fifteen
    hundred Polish florins, which bear interest at 3 1/2, three and one half per cent yearly.'
- page: 5
  en: 'The interest on both these items the Herr purchaser assumes from Johannis 1804.


    §. 4. The present purchase is made without valuation, in Pausch und Bogen. His Most Serene Highness
    however gives warranty for this:


    a, that the surface area of [uncertain: arable], meadows, heaths and lakes set forth in the survey
    registers, which together with the maps have been extradited to the Herr purchaser, is really present.
    His Most Serene Highness assures hereby that up to now no claim by anyone whatsoever upon the parcels
    of land set forth in these survey registers is known to Him.


    The obligation of His Most Serene Highness to answer for the correctness of the survey register in
    the above manner is limited to'
- page: 6
  en: 'three years.


    b, that no more in public taxes lies upon these estates than yearly for Kaemen 153 rt. 22 gg. 8 pf.,
    for Kolno – 125 – 21 – 2, and in ecclesiastical dues for Kaemen 16 – 16 gg.


    §. 5. The natural delivery of the estates to the Herr purchaser has already taken place in the month
    of September 1804, and the proceedings drawn up thereupon shall stand.


    With regard to the warranty, the following principles have been adopted between the contracting parties:


    a, that the usufructs of the estates are due to the Herr purchaser from Johannis 1804, from which
    time the Herr purchaser must also bear the'
- page: 7
  en: 'burdens. Any older arrears shall be answered for by His Most Serene Highness. His Most Serene Highness
    also bears the Justitiariat salary up to Michaelmas of last year.


    b, that the estates shall be handed over to the Herr purchaser as they stood and lay on the 15th of
    June of last year.


    c, that the Herr purchaser may however demand only that supplement of field, cattle and husbandry
    inventory which von Broniewski received at his immission in the year 1786, according to the Acta already
    handed out to the Herr purchaser [uncertain: in tens schon Sprache], and was obliged to restore.


    §. 6. Besides the church capitals noted in §. 2, there stands upon'
- page: 8
  en: the estates a mortgage capital of 100,000 rt., one hundred thousand Reichsthaler, entered by virtue
    of a bond of debt of His Most Serene Highness of the 1st of June 1804 in favour of the Councillor
    of War and Forests von Triebenfeld, who has ceded this mortgage to the Herr purchaser. This debt however
    has already been fully satisfied, and the Herr purchaser hereby expressly renounces all claims in
    this regard, both against His Most Serene Highness and against the Councillor of War and Forests von
    Triebenfeld. It is likewise solely the business of the Herr purchaser to effect the cancellation of
    this nexus in the land and mortgage books. The costs of cancellation, however, shall be borne by half
    by His Most Serene
- page: 9
  en: 'Highness and by half by the Herr purchaser.


    §. 7. The costs for the drawing up and confirmation of this purchase, of the natural and civil tradition,
    and generally all costs of the sale, by whatever name, shall likewise be borne by half by each of
    the two contracting parties.


    §. 8. Passive servitudes are not known to His Serene Highness the seller. On the other hand there
    belongs to these estates a right of timber in the Krabielew woods.


    In a possessory suit against von Kwilecki this was adjudged to His Serene Highness, but in petitorio
    it was disallowed in the first instance. The Herr purchaser'
- page: 10
  en: 'assumes this rem litigiosam without demanding any warranty from His Serene Highness the seller.


    §. 9. All documents and files belonging to the estates, His Serene Highness the seller promises faithfully
    to deliver over to the Herr purchaser, so far as this has not yet been done; likewise also those which
    are still for the time being required in the accounting suit of His Serene Highness against von Broniewski
    shall, upon conclusion of that suit, be handed to the Herr purchaser. It stands however free to the
    Herr purchaser, as goes without saying, to have these papers not yet extradited inspected as often
    as he finds it necessary.'
- page: 11
  en: '§: 10.


    The contracting parties bind themselves to hold fast to this contract in all its points and clauses,
    renounce all objections against it, in particular the objection of lesion beyond the half and whatever
    others they may bear the name of, and have executed this instrument by their own-hand signatures and
    appended seals.


    Breslau, the 16th of January 1805. Read by myself and approved (L. S.) Friedrich Ludwig Fürst zu Hohenlohe.
    I have read and approved this instrument.


    (L. S.) Meÿer Bernhard, in the name and subject to the approval of the Herr Banco Director Leixner.


    That this contract of purchase, between the Most Serene Prince and Lord, Lord Friedrich Ludwig, reigning
    Prince zu Hohenlohe Ingelfingen, Royal General of Infantry'
- page: 12
  en: and Governor at Breslau p., who is personally well known to me, the undersigned Notary, and to the
    witnesses, and the banker at Franckfurth on the Oder, likewise personally well known to us, Herr Meyer
    Bernhard, in the name and subject to the ratihabition of the Royal Banco Director Herr George Conrad
    Leixner, was agreed and concluded in the above manner and with our participation, and that this instrument,
    after being read through and approval declared, was executed by their own-hand signatures and appended
    seals — is hereby attested upon the ground of the protocol taken thereupon. Breslau, the 16th of January
    1805. (L. S.) Carl Gottlob Ebersbach, Royal Justice Commission Councillor and Notary Public in the
    Breslau Department. (L. S.) Johann George Strebel, as witness. (L. S.) Johann Carl Stude, as witness.
- page: 13
  en: 'The foregoing purchase contract I have read myself and found drawn up in accordance with my intention.
    Franckfurth on the Oder, the 25th of January 1805. George Conrad Leixner (L. S.)


    That the personally known to me, legally competent Royal Banco Rendant Herr Georg Conrad Leixner has
    here, after reading through and approving it himself, signed in my presence and sealed with his signet
    the foregoing and overleaf purchase contract d. d. Breslau the 16th of January 1805 — by the content
    whereof His Most Serene Highness, the reigning Prince Friedrich Ludwig zu Hohenlohe Ingelfingen p.
    p., has sold to Herr Leixner the estates Kollno and Kaemen, acquired out of the deed of donation of
    His Majesty the late King Friedrich Wilhelm II of the 9th of August 1796 and situated in South Prussia,
    Posen Department, for the sum of 142,000 rt., one hundred and forty-two thousand — after his own'
- page: 14
  en: 'reading through and approval — the same is hereby attested in documentary form, upon the ground
    of the protocol held in this matter, under the impression of the seal of the Justice Office of Franckfurth
    a/O. and my signature as Justice Officer. And done at Franckfurth on the Oder on the twenty-fifth
    of January One thousand eight hundred and five.


    (L. S.) Dr. Ernst Gottlob Born, Royal Justice Officer and University Syndic, also Assessor of the
    Faculty of Jurists at


    Franckfurth a/O.


    Actum Posen the 6th of February 1805. Pursuant to the ordinance of the 8th of'
- page: 15
  en: 'October a. pr., of the 21st of January a. c., and of the verbal agreement made with the interested
    parties thereupon, there stands today a term for the taking up of the purchase contract agreed between
    the Herr Prince Hohenlohe Ingelfingen and the Banco Director Leixner at Franckfurth a/O. concerning
    the estates Kolno and Kaemen, of the Posen District. At this term there appeared


    1, on the side of the Herr seller


    a, as his Mandatarius the Justice Councillor Melzer, who legitimates himself by the special power
    of attorney granted to him for this Actus and already in actis;


    b, the General Mandatarius of the Herr Prince, the Building Councillor Glenk, already personally known
    to the undersigned;


    2, on the side of the purchaser, the Crimi-'
- page: 16
  en: 'nal Councillor Guderian, who refers for his legitimation to the special power of attorney granted
    to him for this business and already submitted to the files by the petition of the 28th of September
    a. pr.


    The interested parties on both sides present the annexed purchase contract d. d. Breslau the 16th
    of January 1805, already personally executed by both parties, furnished with the recognition d. d.
    Breslau de eod. and Franckfurth a/O. the 25th of January a. c., with the declaration that they had
    been authorised expressly only to publish this contract, and that consequently a formal taking up
    of the contract would be as little needed as they on their part were autho-'
- page: 17
  en: 'rised to consent to it.


    Thereupon the Justice Councillor Melzer declared in particular that the purchase contract handed in
    today was, according to the instruction given to him, in all its points and clauses in accordance
    with the intention of his Herr principal, and that on the ground of the same he wished hereby to transfer
    to the purchaser Banco Director Leixner the property in the estates Kolno and Kaemen cum att. et pertinentiis,
    nothing whatever excluded therefrom, belonging to him according to the deed of conferment of His Majesty
    King Friedrich Wilhelm II of the 9th of August 1796.


    In like manner the Criminal Councillor Guderian acknowledged the purchase contract presented above,
    de dato Breslau the 16th of January 1805.'
- page: 18
  en: '[the text here continues in the wording of a power of attorney, without transition] ... Banco Director
    Herr Leixner at Franckfurth a/O., concerning the estates belonging to me Kollno and Kamienne and [uncertain:
    zu ge sor], for a price of 142,000 rtl., one hundred and forty-two thousand Reichsthaler, to conclude;
    to execute the instrument of purchase in my stead; thereafter also to appear before a most worthy
    Royal Government at Posen in My name, to convey the property of the said estates to the purchaser
    upon the completion of the civil [uncertain: Vereichs = delivery], to petition for confirmation of
    the purchase and to consent to the entry of the title of possession for the purchaser, and to give
    him receipt for the fully paid one hundred and forty-two thousand Reichsthaler of purchase money;
    also to move that the one hundred thou-'
- page: 19
  en: 'sand Reichsthaler intabulated upon these estates for the Herr Councillor of War von Triebenfeld
    may be cancelled.


    Breslau, the 5th of September 1804. Read by myself and approved. (L. S.) Friedrich Ludwig Fürst zu
    Hohenlohe.


    That the Most Serene Prince and Lord, Lord Friedrich Ludwig, reigning Prince zu Hohenlohe Ingelfingen,
    Royal General of Infantry and Governor at Breslau, appeared in person under today''s date before the
    von Stechow Arnoldsmühl Court Office and executed the foregoing power of attorney, after reading it
    through and declaring his approval, by his own-hand signature and appended seal, is hereby attested
    upon the ground of the protocol taken thereupon. Breslau, the 5th of September 1804. The von Stechow-Arnoldsmühl
    Court Office. (L. S.)


    Ebersbach


    Justitiarius


    Stade


    Actuarius.'
- page: 20
  en: Special power of attorney. I, the undersigned, make known and acknowledge hereby that I do herewith
    expressly empower the Herr Criminal Councillor Guderian at Posen, in my name, judicially to recognise
    the purchase contract concluded between the plenipotentiary of His Serene Highness the reigning Prince
    zu Hohenlohe Ingelfingen, the Building Councillor Herr Glenck, and myself, concerning the estates
    Kolno and Kaemen, Posen Department, d. d. Franckfurth a/O. the 15th of June 1804; to accept the declaration
    of His Serene Highness that the purchase moneys of the 142,000 rtlr., write one hundred and forty-two
    thousand Rthl., are paid, and that consequently those §§ which speak of the payment of this purchase
    money are to be regarded as discharged; also to hold §. 12, concerning cooperation in the dismemberment
    of the estates, to be lapsed; or else, should His Serene Highness require it, to conclude a new purchase
    contract on the model of the aforesaid one of the 15th of June 1804; to accept the resignationem bonorum
- page: 21
  en: and thereupon to move that the title of possession of the said estates be entered in the mortgage
    book in my name; as also generally to observe and attend to everything which I, were I personally
    present, should be obliged and entitled to do in this business. Whatever now my said plenipotentiary
    shall do by virtue of this commission received, I hereby promise to approve and to hold thereby as
    inviolably as if I had done it myself. At the same time I also bind myself to indemnify my Herr plenipotentiary
    in every respect on account of this commission and to reimburse to him all costs and outlays, under
    pledge of my present and future property, so much thereof as shall be
- page: 22
  en: 'required thereto. In witness whereof I have signed this special power of attorney with my own hand
    and confirmed it by the impression of my usual signet.


    So done at Franckfurth a/O. on the 21st of September 1804.


    Read and found correct (L. S.) George Conrad Leixner.


    Upon the ground of the judicial protocol held today, it is hereby attested that the legally competent
    Royal Banco Rendant Herr Georg Conrad Leixner here, well known to me by person, has himself read through
    and approved the foregoing special power of attorney, drawn up according to his statement and instruction,
    wherein he authorises the Herr Criminal Councillor Guderian at Posen to recognise the purchase contract
    concluded between him and His Most Serene Highness zu Hohenlohe Ingelfingen,


    d. d. Franckfurth a/O. the 15th of June 1804, and eventualiter to conclude a new purchase contract'
- page: 23
  en: 'on the model of the aforesaid one of the 15th of June 1804, and has, as stands above, signed and
    sealed it with his own hand in my presence. In witness whereof, under the impression of the seal of
    the Justice Office of Franckfurth on the Oder and with my signature as Justice Officer. So done at
    Franckfurth a/O. the 21st of September 1804.


    Dr. Ernst Gottlob Born (L. S.), Royal Justice Officer and University Syndic, also Assessor of the
    Faculty of Jurists.


    I have indeed already, under the 21st of September 1804, authorised the Criminal Councillor and Justice
    Commissarius Herr Guderian at Posen, by a judicial special power of attorney, judicially to recognise
    in my name the purchase contract concluded between the plenipotentiary of His Serene Highness the
    reigning Prince and Lord zu Hohenlohe Ingelfingen, the Building Councillor Glencke, and myself, concerning
    the estates Kolno and Kaemen, d. d. Franckfurth a/O. the 15th of June 1804; to accept the declaration
    of His Serene Highness that the stipulated moneys of the one hundred and forty-two thousand Thaler
    Cour. are paid, etc. But since afterwards, for moving reasons, a new purchase contract sub dato Breslau
    the 16th of January 1805 and Franckfurth o/O. the 25th of January 1805 was concluded between His Serene
    Highness and myself concerning the said estates, and the same has been judicially executed both by
    His Serene Highness the seller and by myself, and the Herr Criminal Councillor Guderian reports to
    me that the Royal Most Laudable South Prussian'
- page: 24
  en: 'Government does not hold him legitimated by the power of attorney cited above, because the same
    speaks of an earlier contract — therefore I will hereby and by virtue of this extend the power of
    attorney already issued to Herr Guderian to this effect: that he shall be entitled, upon the ground
    of the purchase contract already judicially published by me, d. d. Breslau the 16th and Franckfurth
    the 25th of January 1805, to apply for the entry of the title of possession in my favour, to accept
    the resignationem bonorum, and in this business of purchase and sale to do everything in my name which
    I should do were I myself present; accordingly, if it should be needful — which however I do not believe
    — to recognise the purchase contract of the 16/25 of January 1805 judicially once more, to apply for
    the recognition of the entry of the title of possession once made, and to receive the same for further
    transmission to me.


    In witness whereof I have signed and sealed this respective declaration and extension of the above-mentioned
    power of attorney with my own hand. So done at Franckfurth on the Oder on the 8th of March 1805. Read
    by myself and found correct. (L. S.)


    George Conrad Leixner.


    That the local Banco Rendant Herr Georg Conrad Leixner, whom I know well by person, the foregoing
    respective declaration'
- page: 25
  en: 'and extension of the special power of attorney previously issued to the Herr Criminal Councillor
    Guderian at Posen, concerning the entry of the title of possession of the South Prussian estates Kolno
    and Kamen in his, Herr Leixner''s, favour, has, after reading it through and approving it himself,
    signed and sealed with his own hand in my presence — this I testify hereby upon the ground of the
    protocol held in that behalf on today''s date. So done at Franckfurth a/O. the 8th of March 1805.
    (L. S.)


    Dr. Ernst Gottlob Born,


    qua Justice Officer of the Justice Office here.


    Since We now, praevia de super partium stipulatione, have graciously deferred to this request, We
    do corroborate and confirm, with the supreme Royal sovereign supreme territorial-princely power and
    plenitude residing in Us, the purchase contract inserted above, in such wise that the same shall be
    valid, binding and lasting in all its points and clauses, shall be held firmly and inviolably, and
    that no way shall be allowed of acting against it. This however without prejudice to Our Royal sovereign
    supreme territorial-princely prerogatives, rights, services'
- page: 26
  en: 'and duties, and likewise without prejudice to everyone else. In witness whereof, under the usual
    signature and greater seal of Our South Prussian Government here. Given at Posen the 18th of March
    1805. Confirmation of the purchase contract concluded between the reigning Prince Friedrich Ludwig
    zu Hohenlohe-Ingelfingen, as seller, and the Banco Rendant George Conrad Leixner, as purchaser, concerning
    the estates Kolno and Kaemen situated in the Posen District. Fee: 2 rt. 2 gg.


    Stamp: 6 gg.


    Engrossing: 22 gg.


    Silk: 1 gg.


    No: 2244.'

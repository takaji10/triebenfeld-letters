    and Kamen in his, Mr Leixner''s, name, has signed and sealed with his own hand in my presence after
    his own reading through and approval - this I hereby testify upon the ground of the protocol held
    for that purpose under today''s date. So done at Frankfurt a/O., the 8th of March 1805. (L. S.)


    Dr Ernst Gottlob Born


    qua judicial officer of the Justice Office here.


    Since We have now, praevia de super partium Stipulatione, graciously deferred to this request, We

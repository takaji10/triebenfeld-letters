- page: 1
  en: 'The original hereof is on 137 rl. stamped paper, and has been taken to the mortgage files of Kolno
    and Kaemen. We Friedrich Wilhelm by the Grace of God King of Prussia p. p.


    Do hereby make known and give every man to know, especially where there is need of it, that before
    the Commissarius appointed by Our Government here, Our Government Assessor Bewert, the reigning Prince
    Friedrich Ludwig of Hohenlohe-Ingelfingen, Your Lordship, and the bank cashier George Conrad Leixner,
    both by their mandataries legitimated hereto ad Acta, Our councillor of justice Melzer and Your Honour
    Councillor Guderian, appeared on the 6th of February 1805, and expressly acknowledged the purchase
    contract concluded on the 16th and 25th of January ejusd. concerning the estates Kolno and Kaemen
    situated in the Posen district, and requested that We might graciously be pleased to furnish this
    purchase contract with Our most high confirmation. The same, however, runs in its true content as
    follows:'

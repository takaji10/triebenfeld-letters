  en: 'The interest of these two items the purchaser takes over from Midsummer 1804.


    §. 4. The present purchase is made without valuation, in Pausch und Bogen. His Most Serene Highness
    however gives warranty for this:


    a, that the surface area of arable, meadows, heaths and lakes set out in the survey registers, which
    together with the maps have been delivered over to the purchaser, is really present. His Most Serene
    Highness assures herewith that no claim by anyone whatever to the parcels of ground listed in these
    survey registers is known to His Highness hitherto.


    The obligation of His Most Serene Highness to answer for the correctness of the survey register in
    the above manner is limited to'
  numbers:
  - '1804'
  - '4'
- page: 6
  en: 'three years.


    b, that in public dues no more is charged upon these estates than yearly for Kaemen 153 Rthl. 22 Groschen
    8 Pfennig, for Kolno - 125 - 21 - 2, and in ecclesiastical dues for Kaemen 16 - 16 Groschen.


    §. 5. The delivery in kind of the estates to the purchaser has already taken place in the month of
    September 1804, and the proceedings taken down thereupon shall stand.


    With regard to the warranty, the following principles have been adopted between the contracting parties:


    a, that the usufructs of the estates belong to the purchaser from Midsummer 1804, from which time
    the purchaser has also to bear the'

- page: 4
  en: 'Carried over: 53,139 Rthl. 13 Groschen 8 1/5 d. paid upon the instruction of His Most Serene Highness.


    b, 88,860 Rthl. 10 Groschen 3 1/5 d. have been paid in cash by the purchaser to His Most Serene Highness
    Himself and upon His Highness''s instructions.


    i. e. 142,000 Rthl.


    §. 3. Besides the purchase price the purchaser takes over the following items entered in the mortgage
    books upon Kolno and Kaemen:


    a, a capital of 100 florins, one hundred Polish florins, for the church at Kaemen, the interest whereof
    is fixed annually at four Polish marks.


    b, for the same church a capital of 250 Rthl., two hundred and fifty Reichsthaler, or 1500, fifteen
    hundred Polish florins, which bear interest at 3 1/2, three and one half per cent yearly.'

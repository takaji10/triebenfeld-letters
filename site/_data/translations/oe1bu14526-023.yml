  en: 'The interest on both these items the purchaser assumes from Midsummer 1804.


    § 4. The present purchase is made without valuation, in Pausch und Bogen. His Most Serene Highness
    however gives warranty for this:


    a, that the surface content of arable, meadows, heaths and lakes set out in the survey registers,
    which together with the charts have been handed over to the purchaser, is really present. His Most
    Serene Highness assures herewith that to His Highness no claim by anyone whatsoever upon the parcels
    of land set out in these survey registers is hitherto known.


    The obligation of His Most Serene Highness to answer for the correctness of the survey register in
    the above manner is limited to'
  numbers:
  - '4'
  - '1804'
- page: 6
  en: 'three years.


    b, that no more in public dues encumber these estates than yearly for Kaemen 153 Rthl 22 Groschen
    8 Pfennig, for Kolno - 125 - 21 - 2, and in ecclesiastical dues for Kaemen 16 - 16 Groschen.


    § 5. The actual delivery of the estates to the purchaser has already taken place in the month of September
    1804, and the proceedings recorded thereon shall stand.


    With a view to the warranty the following principles have been adopted between the contracting parties:


    a, that the usufruct of the estates is due to the purchaser from Midsummer 1804, from which time the
    purchaser also has to bear the'

  en: 'cumbrances, as his true property, for a purchase price of 142,000 Rthl., one hundred and forty-two
    thousand Reichsthaler, according to the coinage standard of 1764.


    §. 2. The purchase money of the 142,000 Rthl. has already been paid in full. His Most Serene Highness
    gives receipt for it and acknowledges generally that He has no further claim upon the purchaser out
    of this transaction of sale.


    It is noted here historically that the payment of the purchase moneys was effected in the following
    manner.


    a, 53,139 Rthl. 13 Groschen 8 1/5 d. the purchaser has paid to the former Polish cavalry captain von
    Broniewski, who, as a creditor put in possession, stood in actual possession of the estates, as the
    sum legally adjudged to him'

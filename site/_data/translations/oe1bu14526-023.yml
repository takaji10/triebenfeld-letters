    § 9. All documents and records belonging to the estates, His Serene Highness the seller promises faithfully
    to deliver up to the purchaser, so far as this has not already been done; likewise also those which
    are still at present required in His Serene Highness''s action of account against von Broniewski,
    to hand over to the purchaser after the conclusion of that action. It remains, however, free to the
    purchaser, as goes without saying, to have these papers not yet handed over inspected as often as
    he finds it necessary.'

  en: 'Government does not hold him legitimated by the power of attorney cited above, because the same
    speaks of an earlier contract, I will hereby and by force of this extend the power of attorney already
    issued to Mr Guderian to this effect: that he shall be entitled, upon the ground of the purchase contract
    already judicially announced by me, dated Breslau the 16th and Frankfurt the 25th of January 1805,
    to seek the entry of the title of possession in my name, to accept the resignationem bonorum, and
    in this business of purchase and sale to do everything in my name that I would do were I myself present,
    accordingly - should it, as I do not however believe, be necessary - to recognise the purchase contract
    of the 16th/25th of January 1805 judicially once more, to seek the recognition of the entry of the
    title of possession once made and to receive the same for further forwarding to me.


    In witness whereof I have signed and sealed in my own hand this declaration and extension respectively
    of the power of attorney mentioned above. So done at Frankfurt an der Oder on the 8th of March 1805.
    Read by myself and found correct. (L. S.)


    George Conrad Leixner. That the bank cashier here, Mr Georg Conrad Leixner, whom I know well in person,
    the foregoing declaration respectively'

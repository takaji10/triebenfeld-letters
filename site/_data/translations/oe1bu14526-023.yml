    §. 7. The costs of drawing up and confirming this purchase, of the delivery of possession in kind
    and in civil law, and in general all costs of the purchase, by whatever name, shall likewise be borne
    one half by each of the two contracting parties.


    §. 8. Passive servitudes are not known to the Serene Highness of the vendor. On the other hand a right
    of timber in the Krabielew woods belongs to these estates.


    In a possessory suit against von Kwilecki this was adjudged to His Serene Highness, but in the petitory

  en: 'and duties, and otherwise without prejudice to every man. In witness whereof under the usual signature
    and greater seal of Our South Prussian Government here. Given at Posen, the 18th of March 1805. Confirmation
    of the purchase contract concluded between the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen,
    as vendor, and the bank cashier George Conrad Leixner, as purchaser, concerning the estates Kolno
    and Kaemen situated in the Posen district. Fee: 2 Rthl. 2 Groschen.


    Stamp: 6 Groschen.


    Engrossing fee: 22 Groschen.


    Silk: 1 Groschen.


    No: 2244.'

  en: '92


    Most Serene Prince, Most gracious Prince and Lord, The information which Your Most Serene Highness
    requested of me on the last post-day I have now obtained, in that the building councillor Glenck delivered
    to me on Thursday the receipts of the Gleisſenbergen and of Schneider, whereby I feel myself fully
    placed in a position to answer the General Auditoriat upon its dispositions communicated to Your Most
    Serene Highness. I do not doubt that the councillor of war von Triebenfeld will this day give Your
    Most Serene Highness news of the present situation of the Kroctoczyner tausp. matter, and in deepest
    reverence I remain, until death, Your Most Serene Highness''s Berlin


    the 18th of December


    1798.


    most humbly, faithfully and obedi-


    ently


    Michaelis'

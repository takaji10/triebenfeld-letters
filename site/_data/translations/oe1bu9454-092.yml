- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord, The information which Your Most Serene Highness
    requested of me by last post-day I have obtained in this wise, that Herr Baurath Glenck delivered
    to me on [uncertain: Donntag — Sunday/Monday?] the receipts of the Gleissenbergen and of Schneider,
    whereby I feel myself fully put in a position to answer the General Auditoriat upon the dispositions
    communicated to Your Most Serene Highness. I do not doubt that Herr Kriegsrath v. Triebenfeld will
    this day give Your Most Serene Highness intelligence of the present posture of the Krotoszyn tausp.
    affair, and in deepest reverence I remain, until death, Your Most Serene Highness''s Berlin, the 18th
    December 1798. most humbly, faithfully obed. samſtes Michaelis'

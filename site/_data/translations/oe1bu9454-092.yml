segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord, The information which Your Most Serene Highness requested of me on
    the last post-day I have obtained in this way, that the Sir Councillor of Works Glenck delivered to
    me on Sunday the receipts of the Gleissenbergs and of Schneider, whereby I feel myself fully placed
    in a position to answer the General Auditoriate upon its dispositions communicated to Your Most Serene
    Highness.


    I do not doubt that the Sir councillor of war von Triebenfeld will give Your Most Serene Highness
    news today of the present situation of the Krotoszyn [uncertain: tausp.] affair, and in deepest reverence
    I remain, until death, Your Most Serene Highness''s Berlin


    the 18th of December


    1798.


    most humbly, faithfully [illegible]


    most obedient


    Michaelis'

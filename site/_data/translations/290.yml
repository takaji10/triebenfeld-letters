status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Gracious Lord! After 7 months the order is now at last given that Cosmar shall
    pay in, with the utmost dispatch, to the Brieg High Provincial Court the 3 years'' monies he has been
    holding back, which Your Serene Highness is to draw annually, and of which You have assigned 12000
    Rthl yearly in favour of Your creditors — He is at the same time instructed [uncertain: angewiesen]
    to keep order and render prompt account. That Stägemann has the worst will shows itself at every turn;
    he now plays the defender of Cosmar and the adviser of the Curian heiresses. The Prince Chancellor,
    on the other hand, promises everything — but reads, sees and hears nothing further once he has promised
    it. Minister Stein, by contrast, works honestly and is concerned to procure for Your Serene Highness
    the proposed compensation by way of the office of Sokolnick. He has already drawn the Chancellor into
    the business, so that the two may lay the matter before the Emperor together — Tomorrow I shall again
    submit to the Prince a somewhat emphatic Pro Memoria concerning the kurz affair, as also concerning
    Your military salary — I shall carry the matters through, though I should have to follow him as far
    as the Rhine. It must once for all be brought to clarity. Tomorrow morning I have a conference with
    Herr Stägemann, consequently more on Tuesday. This very moment I receive Your Serene Highness''s letter
    of the 9th; upon that too I shall write by the first post. In reverence I remain Your Serene Highness''s.
    As Herr Ob[er] v T tells me, Adolph conducted himself very awkwardly with the King; the King asked
    him what his father was doing, how he fares; the answer was — I do not know, I have not seen him for
    a long time. verte [text lost] Vienna, the 20th May 1815 — most obedient servant v Triebenfeld'
- page: 2
  en: 'Both I and Barbe and Beugelin had instructed him what he should say — He could at that moment have
    done much for his father. In short, Your Sons will act, never take after [their father]. Humboldt
    and also Nesselrode wished to present him to their Monarch; to that he was not to be brought, and
    hastened away. The Countess [uncertain: Fricis / Fries] and several others say, there is not a drop
    of his father''s blood in him. Do send me, Your Serene Highness, the 100 ducats, for I do not know
    whether in this business I must not go at once with the rest to Berlin — and here I still have much
    to pay. I have begged that it be sent by express courier. It would be very bad if You did not do it.'

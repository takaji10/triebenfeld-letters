status: draft
segments:
- page: 1
  en: 'The Honourable Maszewski, in the name of the Illustrious Prusimski, against the Illustrious Chełmski
    — a Manifest is lodged


    Having come in person to the present Office and Books of the Konin Municipal Court, the Honourable
    Leon Maszewski, Estate Manager of the hereditary estates of Trąbczyn with appurtenances of His Worship
    the Right Honourable Antoni of Kolno Prusimski, Starost of Niszczewice — by the order of the same,
    the Most Honourable, his Lord, who at this time [W/U?x?ią[uncertain: g]'
- page: 2
  en: 'was unable to attend to official matters — solemnly lodges a Complaint against the Right Honourable
    Pan Stanisław Chełmski, Treasurer of the Wschowa Land, Lord and Heir of the estates of Łukomia and
    others, and also the Honourable Jaroszewski, [uncertain: s]ervant of his, and other perpetrators of
    the below-described and above-mentioned actions — in the following manner: that the Right Honourable
    Pan Chełmski, Treasurer of Wschowa, although sufficiently informed by the Tribunal Decrees — first
    the post-commissorial [decree], the second ordering the execution of that same post-commissorial,
    and also the field [acts] that followed in the present year — that the Line from the corner markers
    of Trąbczyn, Łukom, and Drzewce to the corner of those same estates with Biskupice, drawn on the Map
    by the Most Serene Tribunal, and on the ground [...] and cleared by the Geometer in the presence of
    the Right Honourable Pan Chełmski himself, Treasurer of Wschowa, according to the prescription of
    the Tribunal Decree during the condescension, and marked with stakes — separates the [estates] of
    Trąbczyn from the [estates] of Łukomia — nevertheless, transgressing not only the above-mentioned
    Decrees but also the Law established in the Year One Thousand Seven Hundred and Sixty-Eight, the same
    Right Honourable Pan Chełmski, already after the last Tribunal Decree, in the very [Sam...z?iem] of
    the two condescensions commencing by its force, [sent] his people, namely: of the Honourables: Ignacy
    Jaroszewski, Weynerski Clerk; of the Honest and of the Industrious: Stanisław Augustyński, half-farmstead
    holder from Łomów; Woysko, cottager; Michał Płachetka; Ignacy Korzalik; Szymon Wyterek; Jan Wyterek;
    Łukasz Wyterek; Antoni Waziak; Wawrzyn also called Old Wach, father of [Antoni] Wasiak; Piotr Motylek;
    Wrzycka, wool-carder; Grzegorz Nowaczyk; Franciszek Wyterek; Stanisław Wyterek and Jakub, cottagers;
    Antoni Nowaczyk; Paweł Wałęsa; Kazimierz Płocha; Stanisław Wyterek and Wojciech, half-farmstead holder
    from the village of Łomów; Andrzej and Szymon, farmhands; Wojciech Forczpan; Jan the Watchman from
    Łukom; and other some fifteen with [Torami] from the wastelands belonging to the estates of Łukom
    — with sleighs, [uncertain: horses], oxen, axes, and other tools — fell upon the pine forest on the
    left side of the line directly cleared, belonging to the estates of Trąbczyn, who, having fallen upon
    [it], cut down a great number of pines and carried them to the estates of Łukomia — as the judicial
    site inspection made about this testifies — and moreover, [uncertain: na] the same people of the Right
    Honourable Pan Chełmski invaded the [lands of the] Trąbczyn estate, broke into the manor domain and
    [uncertain: u/o]'
- page: 3
  en: 'violently took away [goods/things], accosted people from Trąbczyn on the road, and committed other
    acts of violence as evidenced by testimony. In which matter, the Right Honourable Starost of Niszczewice
    being greatly wronged, [he] ordered the present Complaint to be lodged as a Manifest in the present
    Books — the right of improvement of this manifest being reserved.


    Leon Maszewski, in the name of my lord'

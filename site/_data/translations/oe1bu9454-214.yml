- page: 1
  en: '214


    Most Serene Prince


    Most gracious Prince and Lord!


    In the death of the Princess Sacken I take the liveliest part; my [uncertain: dearest] regret I lay
    at Your Serene Highness''s feet. May Heaven in return preserve Your Serene Highness alone, let both
    of them become strangers to you, and [uncertain: grant / the tavern] you rest and the most lasting
    health, so that for a long series of years yet you may remain the support of your house and the benefactor
    of good men. The news of the death of the Princess, now most blessed, was already in my hands on the
    11th. I would gladly have hastened to Your Serene Highness, had not just now 4 principal matters been
    due to be decided by the departmental minister, upon which the preservation of the patrimonial estates
    depended. Only yesterday did I receive the confirmation and the approved settlement, namely that the
    bank and invalid debts, together with the arrears fallen due, are to be paid off over 41 ¾ years at
    6 per cent. The copies follow herewith; according to these the estates are, after 41 3/4 [uncertain:
    n], entirely clear. According to the hint given me in confidence by the minister, a moratorium of
    just the same kind will follow with respect to the private debts, whereupon Mr Weigel will be settled
    with in like manner.


    I shall thank God in silence upon my knees that those usurers, who often did Your Serene Highness
    very real [harm], must now be content with this wise general disposition.


    What now remains is the matter of working out and fixing the revenues definitely,'

- page: 4
  en: 'The suits alone cost a furious deal of money, and before everything shall be set in order, Satan
    may yet [uncertain: never] fetch a couple of thousand — For this once, however, nothing shall be thrown
    away for nothing, for if I now lose a suit in Your Serene Highness''s affairs, then I will suffer
    boxes on the ear from the professor.


    On the 28th I go to Berlin and on the 12th of August I am here again; they wish to speak there too
    — The minister General Prefect Count Garczynski also desires that I should attend to a matter for
    him. The times are pregnant with great things. Gladly would I speak with Your Serene Highness, even
    if only for a little hour — Mr Hard: is my [uncertain: patron / greener] and Konstan: means well —
    the vacation now comes on here, when the judges rest; if I knew where Your Serene Highness now is,
    I should surely lay myself personally at your [uncertain: feet / costs].


    In deepest respect I remain, until death,


    Your Serene Highness''s


    Kalisz, the 21st of July


    1811.


    humble and faithful servant


    v Triebenfeld'

- page: 3
  en: 'demand his salary for 8 months – that amounted to 400 Rthl – but after the audit he has some 5000
    Rthl gone – his paper security amounts at most to 2100 d at the rate of exchange, so he must still
    pay out 2500 Rthl; his interference from 10 April 1810 to 8 January 1811 does not hold good and is
    rejected — that I have, for the rest, not written to Your Serene Highness since the month of February,
    I do contest, and shall prove the contrary – I only know [uncertain: erthegt], since I have been an
    estate proprietor here, that Hecker, Hawich and these rogues gave me out for a dangerous [uncertain:
    perjurer] who sided with the enemies of Poland, on which account my letters have been intercepted
    – But as soon as the Attorney-General returns, a criminal prosecution will be framed against them,
    S. – For the rest I have [uncertain: habenis], for whose honesty I have always been surety, charged
    to send in to Your Serene Highness the most punctual accounts of every Groschen taken in and paid
    out. I have wound my way through in wretchedness, often gone hungry and lain in a hole against which
    Your Serene Highness''s dog-kennel could be called the lesser [uncertain: ein fallest]. My fine Kontop
    estates the devil has taken over it; I was, from that [illegible] Berlin affair, as well as to the
    [uncertain: Blockadg] and Stolz[uncertain: apfel], still some 6500 Rthl in debt; over 2000 Rthl I
    had brought here and [uncertain: travelled away with myself and after]; the usurers pursued me here
    into Poland, I had to enter into the barter-bargain with them malgré, so that I saved myself and was
    not once again arrested as in Berlin. Meanwhile I have been received here with love and kindness;
    I believe I shall find here a quiet [uncertain: physician] — Otherwise I have reduced the personnel
    and engaged cheap men for Your Serene Highness – the economy commissary, the [uncertain: Wort] (which
    every hereditary lord should be himself), the rent-master, the head forester, 2 under-foresters, a
    bailiff over the propination rights, cost 1000 Rthl yearly; I think Your Serene Highness can be content
    with that.'

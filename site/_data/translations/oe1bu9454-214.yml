- page: 3
  en: 'his salary for only 8 months — that amounted to 400 Rthl. — But by the audit he has some 5,000
    Rthl gone — his paper security amounts at most to 2,100 Rthl at the rate of exchange, so he must still
    pay out 2,500 Rthl; his interference from 10 April 1810 to 8 January 1811 is invalid and is rejected
    — that I have, moreover, not written to Your Serene Highness since the month of February, I dispute,
    and I shall prove the contrary — I only know [garbled: erthegt], since I have been a landowner here,
    that Hecker, Hawich and these rogues gave me out for a dangerous [uncertain: perjurer / man who] held
    with the enemies of Poland, on which account my letters have been intercepted — But as soon as the
    General Fiscal returns, I shall frame a criminal suit against them — For the rest I have charged Cabanis
    / for whose honesty I stand surety at all times / to send in to Your Serene Highness the most punctual
    accounts of every Groschen taken in and paid out. I have scraped through wretchedly, often gone hungry
    and lain in a hole, in comparison with which Your Serene Highness''s dogs may be called [garbled:
    less a fallest]. My fine Konotop estates the devil has carried off in the process; I was still owing
    some 6,500 t. on the [uncertain: Lahn] from that Berlin business, as also to the blockade and [uncertain:
    Stolz apfel]; over 2,000 Rthl I had brought here and [uncertain: myself and after] travelled away,
    the usurers pursued me as far as here in Poland, I was obliged of their mal gré to enter into the
    exchange bargain so that I saved myself and was not once again arrested as in Berlin. Meanwhile I
    have been received here with love and kindness; I believe I shall find here a quiet [uncertain: physician
    / asylum] — For the rest I have reduced the establishment and engaged cheap men for Your Serene Highness
    — the farm commissary, the [uncertain: word] / which every hereditary lord ought to be himself / the
    rent-master, the head forester, 2 under-foresters, one bailiff over the propination rights, cost 1,000
    Rthl yearly; I think Your Serene Highness can be content with that.'

- page: 4
  en: 'The lawsuits alone cost a furious deal of money, and before everything is set in order Satan may
    yet [uncertain: fetch] a couple of thousand more – for this time, however, nothing shall be thrown
    away for nothing, for if I now lose a suit in Your Serene Highness''s affairs, I will suffer boxes
    on the ear from the Professor.


    On the 25th I go to Berlin and on the 12th of August I am back here again; they wish to speak there
    as well — The Minister and Prefect-General Count Gacczynali also desires that I should attend to a
    matter for him. Gladly — the times are pregnant with great things. I [would speak with] Your Serene
    Highness even but a little hour — M. Hard: is my [uncertain: Grüner] and Konstan: means well – the
    vacation now sets in here, when the judges rest; if I knew where Your Serene Highness now is, I should
    surely lay myself at your feet in person. In deepest reverence I remain, until death,


    Your Serene Highness''s


    Kalisz, the 21st of July


    1811.


    humble and faithful servant


    v. Triebenfeld'

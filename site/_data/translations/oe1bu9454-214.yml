- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    In the decease of the Princess Sanken I take the liveliest part; my [uncertain: dearest] condolence
    I lay at Your Serene Highness''s feet. May Heaven in return preserve Your Serene Highness alone, let
    both of them become strangers to you, and [uncertain: grant] you rest and the most durable health,
    so that you may yet for a long series of years remain the support of your House and the benefactor
    of good men. The news of the death of the Princess, now most blessed, was already in my hands on the
    11th. I should gladly have hastened to Your Serene Highness, had not just now 4 principal matters
    been due to be decided by the Departmental Minister, upon which the preservation of the patrimonial
    estates depended. Only yesterday did I receive the confirmation and the approved settlement, namely
    that the Bank and Invalids'' debts, together with the arrears of interest [uncertain: Zutrahm], are
    to be paid off over 41 ¾ years at 6 per cent. The copies follow herewith; according to these the estates
    are, in 2. 41 3/4, entirely clear. According to the hint given me by the Minister in confidence, a
    like moratorium will follow in respect of the private debts, whereupon Mr. Weigel will be settled
    with in the same manner.


    God will I thank on my knees in [uncertain: Stellen] that those usurers, who often did Your Serene
    Highness very [uncertain: true] harm, must now be content with this wise general disposition.


    Now there remains only the business of working out and fixing the revenues definitely'

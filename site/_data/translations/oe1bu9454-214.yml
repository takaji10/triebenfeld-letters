- page: 2
  en: 'so that a thorough budget can be drawn up.


    The hereditary lessees pay nothing whatever — the suits on that account are pending; the result will
    be that all the contracts must be cassated and the [uncertain: stipulation] thrown out, against which
    one must lay out demesne farms on the cleared lands.


    The beer and brandy rights have already been administered for Your Serene Highness since the 1st of
    July — this branch will yield at most 6,000[illegible] rt, instead of the 1,500 Rthl which [uncertain:
    scarcely] was got out of the lessees by hard litigation. The Oleśnica and Wrąbczyn suit is pending;
    it may be another 6 weeks before the matters are decided at the Tribunal — so much, however, I know
    for certain, that the contracts will be cassated, and then Your Serene Highness will receive [garbled:
    40,000 Rthl. on each one there] the annual interest of 2,000 Rthl — with Swięcia it comes out exactly
    so, for the present possessors pay not a Groschen whatever; they must go, and notice must be given
    to the Poles, who are now the only ones who pay; the Germans absolutely nothing. The revenues, once
    everything has been won by litigation, will come to stand at 22 to 24,000 Rthl. At present not a devil
    pays anything, and even all the executions bear no fruit. Hecker and Hawich set the people on to it,
    and this makes the [uncertain: people] still more obstinate — Meanwhile Hecker was yesterday wholly
    [uncertain: dismissed / instructed] in the Tribunal; as soon as the prefect returns from the baths
    the rogue will be arrested. The thief demands wages, notwithstanding that, so far as I have learnt
    the matters, he has already more than 5,000 Rthl behind him. He was taken on in February 1808, dismissed
    himself on the 25th of November of the same year, and he could demand of me'

- page: 2
  en: 'so that a sound budget may be formed.


    The hereditary leaseholders pay nothing whatever – the suits on that account are pending; the result
    will be that all contracts are annulled and the [uncertain: Bestimung] thrown out, against which one
    must lay out demesne farms on the [uncertain: geradeten] lands.


    The beer and brandy rent-roll is already being administered for Your Serene Highness from the 1st
    of July – this branch will yield the utmost [uncertain: an Büro d], instead of the 1500 Rthl scarcely
    got out of the lessees by way of bitter lawsuits. The Olemizur and Werbizier suit is pending; it may
    yet be 6 weeks before the matters are decided at the Tribunal – so much, however, I know for certain,
    that the contracts will be annulled, and then Your Serene Highness will receive 40000 Rthl upon each,
    there the annual interest of 2000 Rthl; with Swiecia it comes out exactly so, for the present possessors
    pay not a Groschen whatever, they must go, and be given notice to the Poles; those are now the only
    ones who pay, the Germans absolutely nothing. The revenues, once everything has been won through litigation,
    will come to stand at from 22 to 24000 Rthl. At present not a devil pays anything; even all the executions
    bear no fruit. Hecker and Hawich set the people up to it, and this makes the [uncertain: leester]
    still more obstinate – meanwhile Hecker was yesterday wholly [uncertain: dismissed] in the Tribunal;
    as soon as the [uncertain: Prifat] returns from the baths the rogue will be arrested. The thief demands
    wages notwithstanding that, so far as I have unlearnt the matters, he has already more than 5000 Rthl
    behind him. He was engaged in February 1808, released himself of his own accord on the 25th of November
    of the same year, and he could only'

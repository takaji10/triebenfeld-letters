- page: 2
  en: 'sales of the lands by Honrichs be at once annulled, and that the purchasers, if they do not submit
    to payment into the treasury, be evicted with recourse against Honrichs, since he, without being authorised,
    gave away the lands in part for nothing and appropriated to himself a little estate of several Hufen
    in that manner, and erected the buildings out of the lordship''s timber and bricks. Eighthly, I have
    given power of attorney for the collection of all arrears of purchase money, which are very considerable.


    Ninthly, a power of attorney has been made out to compel the Olesnica hereditary leaseholders to pay
    the entry monies outstanding, inclusive of the canon, amounting to 23000 Rthl, or else to be evicted
    with their dependents, so that the lands and buildings may be otherwise disposed of. Also, tenthly,
    a power of attorney has been given to etc. Habesti for the prosecution of all boundary suits, and
    the instructions necessary thereto have been issued.


    Eleventhly, that a power of attorney has been given to Hawich, so that he may appear in Your Serene
    Highness''s name at the Diet at Warsaw and in all places, in order to maintain Your Most Serene Highness''s
    rights of possession and property in their due force, all the more since every estate owner must now
    himself appear, reside upon his estates, or else forfeit his possessions.


    Twelfthly, besides this I have given the said Hawich a power of attorney on my own part, together
    with the original decrees of the French General Government, in order to collect the [uncertain: hanttene]
    interest advanced by me to the Invalids'' Fund, together with costs etc., and to remit the same to
    Your [uncertain: Kirchlauch] for the covering of the Lahr sum. Thirteenthly and finally, yet another
    power of attorney has been issued to Hawich, to collect from the Radrimini heirs the still outstanding
    hereditary purchase monies and the canon of several years, which amount to over 10000 Rthl, and to
    refute the unjust claims formerly drawn up by the deceased.


    I have had all this recorded judicially by the justice-burgomaster Schench from Neusatz, in order
    to begin this new career right brilliantly; and since, by virtue of the bond of 25000 Rthl, I have
    a right before all creditors to have a word in the matter, I think this will surely make an impression
    and bring about the most desired outcome. In the meantime, however, Your Serene Highness shall, by
    my arrangement, faithfully receive from time to time the reports on the progress of the affair. In
    deepest reverence I remain, until death,


    Your Most Serene Highness''s


    faithful and most obedient servant


    Kontop


    the 7th of March 1809.


    v Triebenfeld'

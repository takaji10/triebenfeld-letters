- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I have had here the justice-burgomaster Hawich from Zagorowo, who is appointed as actual notary public
    of the Duchy of Warsaw, together with the Chief Inspector Hertes, and have negotiated with these men
    everything that tends to Your Serene Highness''s advantage, and have issued the judicial special powers
    of attorney for that purpose. Accordingly I have, first, pressed for the dismissal of the Dqbska woman
    in the matter of the Trąbczyn estates, and have given power of attorney and instruction thereto.


    Secondly, I have given the power of attorney for the complete lifting of the sequestration and have
    drafted the introductory application, the more so as a three-year general indult has been granted
    by the King of Saxony, and since in this matter everything depends upon absolute payment of the interest,
    I have thirdly given to the said Hawich the power of attorney to collect the interest and to pay the
    same, against receipt, to those creditors who already have legally binding judgments in their favour,
    but to remit the remainder to Your Serene Highness. Also I have fourthly given a power of attorney
    to bring suit against the Jew Oppenheimer et Wolff in Kalisz, and at once to press for the cancellation
    of the several sums entered amounting to over 72000 Rthl, in which matter a suit is already pending
    in Berlin. [uncertain: Fifthly] I have issued a power of attorney that the deceits of Honrichs, who
    had himself installed as sequestrator, be at once repudiated, and that he be compelled to render account
    ad Assam, that Hawich on the other hand should draw up the objections against him, and should compel
    him to make good the same as well as to pay the sums still outstanding from him. Likewise I have sixthly
    given a power of attorney to collect from von Niedzewiecki the [uncertain: outstanding] lease sum
    and to seek execution against him. Seventhly I have issued a power of attorney that all arbitrary
    transactions and'

- page: 1
  en: '48


    Most Serene Prince


    Most gracious Prince and Lord!


    I have had here with me the justice-burgomaster Hawich from Zagórów, who is appointed as an actual
    Ducal Warsaw notary public, together with the Chief Inspector Hecker, and with these men I have transacted
    everything that tends to Your Serene Highness''s advantage, and have issued the judicial special powers
    of attorney for it. Accordingly I have, firstly: pressed for the dismissal of Dąbska in respect of
    the Trąbczyn estates, and given power of attorney and instruction for it.


    Secondly: given the power of attorney for the complete lifting of the sequestration and drafted the
    introductory steps, the more so as a general indult of 3 years has been granted by the King of Saxony,
    and since in this matter everything turns upon the absolute payment of the interest, I have thirdly:
    given Hawich the power of attorney to collect in the interest and to pay it, against receipt, to those
    creditors who already have judgments having the force of law in their favour, but to remit the remainder
    to Your Serene Highness. I have also, fourthly: given a power of attorney to bring suit against the
    Jew Oppenheimer et Wolff in Kalisz, and at once to press for the cancellation of the several sums
    entered, amounting to more than 72000 Rthl., a matter in which a lawsuit is likewise already pending
    in Berlin. Fifthly: I have issued a power of attorney that the deceiver Honrichs, who has had himself
    appointed as sequester, be forthwith removed and compelled to render account ad Assam, and that Hawich
    on his side draw up the objections against him and compel him to make good the same, as also to pay
    the sums still outstanding from him. Likewise I have, sixthly: given a power of attorney to collect
    from von Niedźwiecki the outstanding lease sum and to seek execution against him. Seventhly: I have
    issued a power of attorney that all high-handed transactions and'

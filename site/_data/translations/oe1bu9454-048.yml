- page: 2
  en: 'sales of the lands by Honrichs be at once annulled, and that the purchasers, if they do not submit
    to payment into the treasury, be evicted with recourse against Honrichs, because he, without being
    authorised, gave away part of the lands for nothing and appropriated to himself a little estate of
    several Hufe in that manner, and erected the buildings from the lordship''s timber and bricks. Eighthly,
    I have given power of attorney for the collection of all arrears of purchase moneys, which are very
    considerable.


    Ninthly, a power of attorney has been issued to compel the hereditary leaseholders of Olesnise to
    pay the entry moneys outstanding, inclusive of the canon, amounting to 23000 Rthl, or else to be evicted
    together with their dependents, so that the lands and buildings may be let out elsewhere. Also, tenthly,
    a power of attorney has been given to etc. Habesti for the prosecution of all boundary suits, and
    the necessary instructions for the same have been issued.


    Eleventhly, that a power of attorney has been given to Hawich, that he may appear in the name of Your
    Serene Highness at the Imperial Diet at Warsaw and in all places, in order to maintain Your Most Exalted
    Highness''s rights of possession and of property in their full force, the more so as every proprietor
    of an estate is now to appear in person and reside upon his estates, or else forfeit his possessions.


    Twelfthly, besides this I have given to the said Hawich a power of attorney on my own part, together
    with the original decrees of the French General Government, in order to collect the [uncertain: hanttene]
    interest advanced by me to the Invalids'' Fund, together with costs etc., and to remit the same to
    Your [uncertain: Kirchlauch] for the covering of the Lahr sum. Thirteenthly and finally, a further
    power of attorney has been drawn up for Hawich, in order to collect from the Radriminisch heirs the
    still outstanding hereditary-purchase moneys and the canon of several years, which amount to over
    10000 Rthl, and to refute the unjust claims formerly drawn up by the deceased.


    I have had all this taken down judicially by the justice-burgomaster Schench of Neusatz, in order
    to begin this new career right brilliantly; and since by virtue of the bond of 25000 Rthl I have a
    right before all creditors to have a word to say, I think this will indeed carry weight and bring
    about the most desired outcome. In the meantime, however, Your Serene Highness shall, according to
    my arrangement, faithfully receive the reports upon the progress of the matter from time to time.
    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    most faithful and obedient servant


    Kontop


    the 7th of March 1809.


    von Triebenfeld'

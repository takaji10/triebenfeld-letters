- page: 2
  en: 'sales of the lands by Honrichs be forthwith annulled, and that the purchasers, if they do not submit
    to payment into the fund, be evicted with recourse against Honrichs, because he, without being authorised,
    gave away part of the lands for nothing and in that manner appropriated to himself a little estate
    of several Hufen, and erected the buildings from the lordship''s timber and bricks. Eighthly: I have
    given a power of attorney for the collection of all arrears of purchase moneys, which are very considerable.


    Ninthly: A power of attorney has been issued to compel the Oleśnica hereditary leaseholders to pay
    the entry-moneys outstanding, the canon included (inclusum), amounting to 23000 Rthl, or else to be
    evicted with their dependants, so that the lands and buildings may be let out elsewhere. Also, tenthly:
    a power of attorney has been given to Hawich for the prosecution of all boundary suits, and the instructions
    necessary thereto have been imparted.


    Eleventhly: that a power of attorney has been given to Hawich, so that he may appear in Your Serene
    Highness''s name at the Diet at Warsaw and in all places, in order to maintain Your Most Serene Highness''s
    rights of possession and property in their due force, the more so as every estate owner is now now
    to appear in person and reside upon his estates, or else forfeit his possessions.


    Twelfthly: besides this I have given Hawich a power of attorney on my own part, together with the
    original decrees of the French General Government, in order to collect in the interest advanced by
    me on the Invalids'' Fund, together with costs etc., and to remit the same to Your Serene Highness
    to cover the Lahr sum. Thirteenthly: and finally, a further power of attorney has been made out for
    Hawich, to collect from the Radzinski heirs the still outstanding hereditary purchase moneys and the
    canon of several years, which amount to more than 10000 Rthl, and to refute the unjust claims formerly
    framed by the deceased.


    I have had all this recorded judicially by the justice-burgomaster Schenck from Neusatz, in order
    to begin this new career right brilliantly; and since by virtue of the bond of 250000 Rthl I have
    a right before all the creditors to have a word in the matter, I think this shall surely make an impression
    and bring about the wished-for outcome. In the meantime, however, Your Serene Highness shall, by my
    arrangement, faithfully receive the reports on the progress of the business from time to time. In
    deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Konotop


    the 7th of March 1809.


    faithful and most obedient servant


    v Triebenfeld'

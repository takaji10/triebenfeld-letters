- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I have had here with me the justice-burgomaster Hawich from Zagorowo, who is appointed as actual Notarius
    publicus of the Duchy of Warsaw, together with the Chief Inspector Hertes, and have negotiated with
    these men everything that tends to Your Serene Highness''s advantage, and have had the judicial special
    powers of attorney made out for that purpose. Accordingly I have, first, pressed for the dismissal
    of the Dqbska woman in the matter of the Traperin estates, and have given power of attorney and instruction
    to that end.


    Secondly, I have given the power of attorney for the complete lifting of the sequestration and drafted
    the introductory step, all the more since a three-year general indult has been granted by the King
    of Saxony, and since everything here turns upon absolute payment of the interest; therefore I have,
    thirdly, given the said Hawich the power of attorney to collect the interest, and to pay it against
    receipt to those creditors who already have legally binding judgments in their favour, but to remit
    the remainder to Your Serene Highness. I have also, fourthly, given a power of attorney to bring suit
    against the Jew Oppenheimer et Wolff in Kalisz, and at once to press for the cancellation of the several
    sums entered, amounting to over 72000 Rthl, in which matter a suit is already pending in Berlin as
    well. Fifthly, I have had a power of attorney made out that the deceits of Honrichs, who had himself
    installed as sequestrator, be at once repudiated, and that he be compelled to render account ad Assam,
    that Hawich in turn draw up the objections against him, and compel him to make restitution of the
    same, as well as to pay the sums still outstanding from him. Likewise I have, sixthly, given a power
    of attorney to collect from von Niedzewiecki the [uncertain: Usternde] lease sum and to seek execution
    against him. Seventhly, I have had a power of attorney made out that all high-handed dealings and'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness''s most highly esteemed
    letter I have received, together with the several enclosures, by the returning foot-messenger. Since
    neither my first messenger — who was to depart from there on the 9th and to arrive here on the 12th
    — nor Sommer, still less General Schimmelpfenning, has presented himself here, I must believe that
    the plan concerning an exchange-bargain with General Schimmelpfennig has come to nothing, or that
    obstacles have [uncertain: stood/come] in the way which must first be cleared away. In the meantime
    I have, in accordance with Your Most Serene Highness''s commands, instructed every individual how
    he is to play his [uncertain: part] upon the arrival of General v. S. Whether, for the rest, the plan
    with Sch. is truly of use to Your Serene Highness and fully consistent with Your sense of honour —
    upon that I have no further judgement to pass, but fall silent in reverence, and follow, so far as
    it lies in my power, Your most enlightened instructions. Precisely this is the motive of the present
    express dispatch of a letter from Count v. Wartensleben, who is the most intimate friend of old Stössel,
    and for whom I first set the matter in train.'
- page: 2
  en: 'Your Highness is pleased to command that I should not let the business with Stössel and Weigel
    drop, and for this reason I send the Wartensleben letter — from which Your Serene Highness will be
    pleased to gather that everything depends solely upon a letter to Stössel from Your Highness''s own
    hand, and = that Your Serene Highness would have no other expedient for satisfying him = and Weigel
    than by means of the estates in = the Duchy of Warsaw = If this were agreeable to him /Stössel/, he
    would be requested to enter into negotiations on that head with Triebenfeld and = to inspect the estates.
    Whether, and what, Your Serene Highness may be minded to do, I leave entirely to Your most enlightened
    discretion; I only beg to be most graciously instructed thereupon. That, for the rest, no monies are
    now to be drawn from the estates is not my fault. It is the general distress, which presses even the
    most propertied and most well-to-do to the ground; that furthermore the lawsuit is [uncertain: buried]
    or won is just as little of my doing. — Through a whole year I have laboured for Your Serene Highness''s
    welfare and [uncertain: misfortune] with the most glowing zeal, worked without measure, and for it
    have suffered, with my own family, the most boundless distress — the registrations of the lawsuits
    are'
- page: 3
  en: 'made; I have moved heaven and hell to bring the matters onto the court table — presents and gifts
    avail nothing; what am I to do further? — Already many big talkers have [uncertain: turned to knights]
    in these affairs and have wished to win everything and bring about the end — at the first onset every
    one of them still ran his nose against the rock; the consequence was that each made a [uncertain:
    Prussian] retreat and always left me standing alone. — If, however, Your Serene Highness has anyone
    who understands it better than I, send him hither for the conduct of the business; with the most faithful
    heart I will gladly point out everything to him and lay down my pen. The reproach which Your Serene
    Highness is pleased to make me on account of the lawsuits strikes my heart too deeply; it is a dagger-thrust
    to me, and from You all too unexpected. — Accustomed to unjust censure, I would watch any prattler
    yonder spew his venom behind my back unmoved. From Your Serene Highness alone does a reproach of that
    kind wound too mortally, and You compel me to be that which I have hitherto been to You with the heart
    most [uncertain: humbly] faithful to me. The Wartensleben letter I beg back by this messenger only.
    For the rest, the Prefecture demands the original title-deeds of the Zagorow estates (as the one concerning
    Trąbczyn [uncertain: Betschen] is here); according to the accompanying rescript, should these not
    be produced, the estates will be confiscated!'
- page: 4
  en: 'Your Serene Highness I beg most graciously to send these along by this express. In conclusion I
    most obediently enquire whether the lawsuit concerning the Trąbczyn estates is to be prosecuted further,
    or whether one should have regard to the events of the times and await the matter? The cause is not
    to be lost. In deepest reverence [uncertain: humility] there remains Your Serene Highness''s Blizanow,
    the 20th December 1811 most humble and obedient v Triebenfeld'

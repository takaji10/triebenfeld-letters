- page: 4
  en: 'other firebrand — the fellow behaves as though he had devoured Solomon''s wisdom, preaches morality
    in his letters, counsels the greatest circumspection, and [uncertain: warns]. He fears the world might
    learn that he and his [uncertain: fellows in the game] are arch-rogues — that Goldstücker has pledged
    the Glenck mortgage on Oleśnica with Oppenheimer: over this the man makes an uproar and writes me
    four pages thick full of it. For it had been promised that if the loan were granted by the Invalids''
    Fund, the holder of that mortgage should concede priority; now the patron has learnt that Goldstücker
    has ceded the mortgage to Oppenheimer, and so the man asked Oppenheimer whether he would concede the
    priority, which the Jew refused, and so Amel[ang] makes an uproar as if the weal and woe of the world
    depended upon it. The Przespolewski matter will be well concluded. With Glenck''s stories may Your
    Serene Highness be pleased to spare me altogether, for I lose my senses over the man''s conduct —
    because Sprengel claims to have found his 18 Morgen, you are to pay the fellow again — Spreng and
    yet another such rascal have here again sued for 761 Rthl of old arrears; Chwalowski receives 800
    Rthl — with that the dogs might indeed have [uncertain: surveyed] a principality. I remain, until
    death, Your Serene Highness''s


    Kalisz, the 10th of March 1805.


    faithfully yours


    von Triebenfeld


    The busts have arrived and been delivered; they pleased greatly — My stay here lasts very long and
    is very costly, everyone wants to have something — God grant only Your Serene Highness health'

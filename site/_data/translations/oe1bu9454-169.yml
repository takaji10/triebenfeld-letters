- page: 3
  en: 'to take again another 8 to 10000 Rthl and then to fix the canon there - these together already
    make 44000 Rthl. For the propination rights I am still obtaining a lease, a three-year lease contract
    at 4000 Rthl yearly. Arrears outstanding /the people of Olesnica and others/ 2000 Rthl


    That is 50000 Rthl. Takers, and people who fit into the dismemberment plan, are there in abundance,
    and hell would have to burst if I should not have 80000 Rthl here by the 1st of July. This is a little
    sum of 130000 Rthl, and with it all ways can be met until more comes in from the purchasers.


    Should one in Berlin, then, not accept the certificate of the district councillor as sufficient, I
    shall not hesitate; for once I have dismembered, all the administration accounts in the assessments
    fall away accordingly - There remain pure [uncertain: rents] of interest; for that no revision is
    needed, no principles - for the Chamber has after all approved everything, and I attain the purpose
    better than by a heated revision - and need no Amelang or'

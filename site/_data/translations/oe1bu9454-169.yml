- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Minister von Voss has, in the most despotic terms, forbidden any revision of the assessments; whatever
    names they may bear and to whomever they may belong, the Chamber is to reject them. Now I await only
    Amelang''s answer - whether one will be content with the revision by the district councillor. Should
    this too be refused, then I must think of other means - and set light against despotism. The dismemberment
    has been submitted; the President is sending a councillor to Zagorowo, for Trąbczyn, who is to examine
    everything, whereupon the consent will then be granted. The revision concerning the dismemberment
    I shall know how to make use of. With Meierowitz I have concluded matters as the figure shows, and
    I am endeavouring to dislodge Honrichs - I think the affair will give Your Serene Highness pleasure:
    you get your 4000 Rthl back and profit yearly by 500 Rthl of canon, or 10000 Rthl in cash for it.
    Weigel receives, out of the eight thousand, above his 4000 Rthl'

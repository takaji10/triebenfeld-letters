- page: 1
  en: '169


    Most Serene Prince


    Most gracious Lord, the Minister von Voss has, in the most despotic expressions, forbidden all revision
    of the valuations; whatever names they may bear and to whomsoever they may belong, the Chamber is
    to reject them. Now I await only Amelang''s answer — whether they will be content with the revision
    by the Landrath. If this too is refused — then I must think of other means — and set light against
    despotism. The dismemberment is [uncertain: an ist] submitted; the President is sending a councillor
    to Zagórów [uncertain: um] Trąbczyn, who is to inspect everything, whereupon the consent will then
    be granted. The revision on account of the dismemberment I shall know how to turn to use — With Mr
    Meierowitz I have concluded, as the figure shows, and I am endeavouring to dislodge Honrichs — I think
    the matter will give Your Serene Highness pleasure: you recover your 4000 Rthl and profit yearly by
    500 Rthl canon, or 10000 Rthl in cash for it. Weigelt receives out of the eight thousand, over and
    above his 4000 Rthl,'

- page: 2
  en: '6000 Rthl, the Schliefen 6000 Rthl, and Honrichs — that makes 20000 Rthl of purchase money. Szetlewek
    Radzinski will not let slip. He offers, firstly, 18000 Rthl of entry money and the one ([uncertain:
    113] of the 18000 I reckon off against his claims by 5; he must lay down 10000 Rthl in cash), some
    hereditary term of years 1500 Rthl, which together makes 48000 Rthl, and that is, God knows, a great
    deal for this wretched little place, which has only 1700 Morgen of surface area together with the
    peasant lands and in part quite poor soil - We are still disputing only over the pasture, for he wants
    to have free grazing with his cattle in the remaining woodland [uncertain: Epprech] - here too I would
    in the end fix upon a middle course.


    Both [illegible] therefore already put the question of cash money at 14000 Rthl, without the canon
    - and Radzinski''s claim is discharged and all the lawsuits lifted.


    With the people of Olesnica I shall soon be finished — I now have important assistance - My opinion
    now is to have the fellows thrown out. To take the 10000 Rthl from the newer subjects and let them
    be settled, because they have already paid 10000 Rthl. Thereafter to come to terms with the old peasants,
    to bring together enough lands that the demesne farm is restored, in order then to grant Olesnica
    anew in hereditary lease after the mind of the Chamber'

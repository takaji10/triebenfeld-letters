- page: 2
  en: '6000 Rthl, Schliefen, and Honrichs 6000 Rthl; that makes 20000 Rthl of purchase money. Szetlewek
    Radzinski will not let slip. He offers, first, 18000 Rthl as entry money and the one (11[uncertain:
    3] of the 18000 — against this I set off his claims, 5; he must pay down 10000 Rthl in cash), some
    hereditary term of years 1500 Rthl, which together makes 48000 Rthl. That is, God knows, a great deal
    for this wretched scrap, which has only 1700 Morgen of surface area including the peasant lands, and
    soil in part quite bad — We are still at odds only over the pasture, for he expressly wants free grazing
    with his cattle in the woodland that remains — here too I should in the end fix upon a middle course.


    Both [uncertain: facienden] therefore already ask cash money of 14000 Rthl without the canon — and
    Radzinski''s claim is extinguished and all the lawsuits are quashed.


    With the Oleśnica people I shall soon be done — I now have important help — My opinion is now to have
    the fellows thrown out. To take the 10000 Rthl from the newer subjects and let them be settled, because
    they have already paid 10000 Rthl. Thereafter to come to terms with the old peasants, to bring together
    so much land that the demesne farm is restored, and then to let out Oleśnica anew, according to the
    mind of the Chamber,'

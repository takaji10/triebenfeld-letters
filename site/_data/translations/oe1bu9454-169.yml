- page: 3
  en: 'on hereditary lease, and to take a further 8 to 10000 Rthl and there fix the canon — these then
    together already make 44000 Rthl. For the propination rights I obtain a further three-year lease contract
    at 4000 Rthl yearly. Arrears outstanding / Oleśnica people and others / 2000 Rthl. That is 50000 Rthl.


    Takers, and people who fit into the dismemberment plan, are here in abundance, and hell would have
    to burst if I were not to have 80000 Rthl here by 1 [illegible] July. This is a [uncertain: little
    loan] of 130000 Rthl, and with it all ways can be [uncertain: met] until more comes in from the purchasers.


    Should they therefore in Berlin not accept the Landrath''s certificate as sufficient, then I shall
    not delay; once I have dismembered, all the administration accounts fall away along with the valuations
    — There remain pure clear interest payments; for that no revision is needed, no principles — for the
    Chamber has after all approved everything, and I attain the purpose better than by a present revision
    — and need no Amelang or'

- page: 4
  en: 'any other fire-brand - the fellow behaves as though he had devoured Solomon''s wisdom, preaches
    morality in his letters, counsels the greatest circumspection, and were. he fears that the world might
    learn that he and his games are arch-rogues - that Goldstücker has pledged the Glenck mortgage on
    Olesnica with Oppenheimer, over that the man lectures and writes me four pages full. For it had been
    promised that, if the loan from the Invalids'' Fund were granted, the holder of that mortgage should
    concede priority; now the fellow has learned that Goldstücher has ceded the mortgage to Oppenheimer,
    whereupon the man asked Oppenheimer whether he would concede the priority, and the Jew has refused
    this, and now [uncertain: Arnden] makes an uproar as though the weal and woe of the world depended
    upon it. The Przespolewski affair will be brought to a good conclusion. With Glenck''s stories may
    it please Your Serene Highness to spare me altogether, for I lose my senses over the man''s conduct
    — because Sprengel claims to have found his 18 Morgen, you are to pay the fellow again – Sprengel
    and yet another such rascal have here again sued for 761 Rthl of old arrears; Chwalowski receives
    800 Rthl, why, the dogs could have surveyed a whole principality with that. I remain, until death,
    as Your Serene Highness''s


    Kalisz, the 10th of March 1805.


    faithfully yours


    von Triebenfeld'

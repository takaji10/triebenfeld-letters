status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord!


    On the sale of Kolno and Kaemen I offer my most hearty congratulations, in so far as by it Your Most
    Serene Highness''s peace of mind has been secured and my fat brother-in-law has likewise been satisfied.
    For the rest, I have done everything in my power to be here on the 12th in accordance with Your Serene
    Highness''s command and to finalise everything. Meanwhile neither Herr Gleich nor Herr Wünster is
    here, nor does either let anything be heard of himself, and I have neither papers nor power of attorney
    in hand to be able to conclude anything real. This, however, I have brought about: that the 76000
    Rthl are to be paid here by the prospective purchasers, so that in Breslau no pressure need first
    be applied and no proxenetiva need be given; and also that these monies may be paid at once in Berlin
    to the Foundry Department according to Bernhardi''s instruction. In this way, so far as Koschentin
    is concerned, everything is now disposed of, and it is only necessary that the people here be made
    light of heart'
- page: 2
  en: 'and that the Broniszewski affair be pursued. In this last matter I shall seek to exert influence
    in Berlin, for in Posen it is said, as Bernhard tells me, to stand badly once again. It was a piece
    of luck that I had the Otto valuation of Kaemen etc. drawn up afresh and judicially attested; for
    the gentlemen here wanted the assessment, and the one spoiled in Berlin for 25 [uncertain: Fider]
    could not well be shown to the people. I therefore saw to it in Käbisch that I obtained it in forma
    probante, and now the purchasing gentlemen are glad, and have accordingly not only promised anew to
    make the payment of the 76000 Rthl, but they will now give hard coin here. I have written this to
    Bernhardi by today''s post, and have also pressed that Meyer Bernhard must write him the same, so
    that he may be entirely at ease and act according to his plan. As regards Kölzig I have brought up
    a new battery, which I hope will work well. I have despatched to Berlin the Unruh so often named to
    Your Most Serene [Highness] and the like. He lodges with Herr v. Köckritz and is, as is known, his
    all in all; he remains there 3 weeks and is constantly to remind him of Kolzig,'
- page: 3
  en: 'so that it not be overlooked. The Grand Chancellor has ordered the government at Glogau to seize
    all monies and all documents; he has also made known to it that on the 2nd of this month a letter
    was written to [uncertain: Luchesini] — that even if no documentum insinuationis, at least a certificate
    be sent in, that he has had the sentence of confiscation, already become res judicata, delivered to
    Count Schlabrendorff at Paris, upon which, as soon as [uncertain: Luchesini]''s certificate comes
    in, the estates are to be confiscated forthwith, and thereafter otherwise disposed of by His Majesty.
    This our friend Unruh[?] is now to await, and diligently to let his battery play. Whether Amelang
    will accomplish anything with Beyme, time will teach. I confess that I count little upon this assistance.
    The mortgage of Zagorowo I have received duly drawn up. Also from Lichnowski the assurance that, if
    I require it, he will place himself behind 130000 Rthl. I shall now see how much they will give me,
    and what I receive Your Serene Highness will find in store in the chest. If I can obtain the money
    without [uncertain: Lichnowski]''s help, that is the more agreeable to me, for in that case his security
    is [text as written unclear]; he must little Weigel the 27000 Rthl must revert at once to Trapian
    and will thereafter let himself be dealt with better. The'
- page: 4
  en: 'man of Kalisz already conceded me this. With Radzimski at Szetlewek I have got so far that he is
    to sit out his year, but in return had to let all claims lapse. The reckoning with him is roughly
    this: He has to demand 1500 Rthl; from 2 years'' interest 112 Rthl; disbursements according to Glenck''s
    instructions for building costs 487 Rthl 4 gg; sum: 2099 Rthl 4 d. He is to pay: rent from Joh. 1803/4
    1300 Rthl; likewise interest thereon 56 Rthl; rent from Joh. 1804/5 1300. Total 2656 Rthl. Consequently
    Your Serene Highness would have to receive up to 1805: 557 Rthl. Now he wishes to be allowed 306 Rthl
    of process costs, so that only 251 Rthl remain over. That is then the [uncertain: Savinin] of a whole
    year — everything must be cleared up. For the rest there are 2 gentlemen here who wish to take Szetlewek.
    They give per Morgen 1 [uncertain: dkg] ground-rent, which together with the [uncertain: Bauen] arable
    and other things will come to 2000 Rthl yearly, and the propination rights and jurisdiction are besides
    to be reckoned at a few hundred d more. Against the tenants Floricke I have at last obtained a [uncertain:
    Solutionis] decree — but I have at once applied for execution, and mean to wear them down. They are
    already very humble now: they still demand 4 Hufe ready and 8 Hufen of waste land, but they already
    offer 20 Mk. ground-rent per Hufe. I shall not harm the beggar-boys — but assuredly there will be
    nothing to be got from them either.'
- page: 5
  en: 'My plan with Trąbczin — if Your Serene Highness approves it — is this: once I have the decree of
    execution in hand I shall turn the fellows out and make an honourable end with them. Thereupon I shall
    lease Trąbczin, together with the whole propination rights, for 1 year to Otocki on the condition
    that I may dismember straight away. In this manner nothing large is lost; on the contrary I gain several
    thousand rt., for Otocki is to receive at Midsummer 6000 Rthl. Floricke gives 6000 Rthl rent yearly,
    and that for 15 years, with propination rights and all revenues. I demand for 1 year, including the
    brewery of Kopojno etc., 9000 Rthl. In this manner Your Serene Highness need not pay the above 6000
    Rthl and still receive 3000 Rthl in cash into the treasury. The dismemberment shall notwithstanding
    take place not a moment later, nor shall any ground be let out a shilling cheaper — for that I answer
    to Your Serene Highness. The remainder of Swięcia consists of 9 Hufen of poor land and 5 Hufe of marsh
    amid sand-hills, partly overgrown with timber. For these grounds the colonists will give little or
    nothing. Meanwhile the neighbouring v. Biskupski of Kochar has applied to me and will take these grounds
    at the fixed perpetual ground-rent of 30 Rthl per Hufe, for the reason that he has already had much
    quarrelling with the colo-'
- page: 6
  en: nists. For this strip is to remain lying as rough pasture between Swięcia and Kuchar. When the Germans
    now see that a stranger wishes to settle himself there, they will in the end give as much themselves,
    and then my purpose is attained here too. With Drzewce and Grądzen I must still tack about on account
    of the priests, for these demand free building timber and fire[?]wood; the judgment of the 2nd instance
    will be published one of these days. The Fiscus has lost again. It now depends on whether he will
    apply for review — if he does not seek review and lets the judgment become res judicata, then the
    dismemberment may be proceeded with here at once as well. There is no lack of people who wish to buy
    grounds — only, if I hurry too much with it, the people think there is need, and they bid far below
    the rate once accepted, from which however I shall never depart, but rather hope to obtain more than
    less. Therefore the matter must be handled solidly, for now no necessity presses any longer. With
    Kopoyno, Skokum, Swiątniki, the Olesnica marsh and the Wrąbczin Warta grounds I think to provide for
    the Mennonites. These grounds amount to some 400 Hufen;
- page: 7
  en: 'the people are to arrive for certain between the 14th and 18th of this month. I have left Blomberg
    the instruction that he is not to let the Hufe go on average below 600 Rthl; upon this they are to
    pay 10 Rthl yearly rent. That is then a capital of about 240000 Rthl and 4000 Rthl of rent. With this
    capital all debts will be paid, and whatever comes in for all the other villages will be delivered
    into the treasury. Meanwhile this would come to a capital of some 150000 Rthl. The brewery I should
    advise establishing at Trąbczin, and retaining for it a wood of about 3000 Morgen. The brewing and
    brandy revenue, once all were in order, would certainly bring in some 6 to 8000 Rthl yearly, and Your
    Serene Highness may in this way take in about 400000 d. in cash for the grounds to be dismembered,
    and also draw from your South Prussian estates a yearly rent, subsisting for perpetual time, of 48000
    (to 50000) rt. That is, by God, no inconsiderable entailed estate. But a house Your Serene Highness
    would have to have built upon the estates, for the timber barrack at Trąbczin is after all not for
    a ruling lord, and the nest at Marianton, so much praised, is too small and is already on the point,
    together with the new [uncertain: Sprichten],'
- page: 8
  en: 'of falling in at Trąbczin; therefore thought will gradually have to be given to the erection of
    a manor house at [text as written]. Only one cannot make a beginning with it before 2–3 years. Minister
    v. Voß has treated me truly handsomely and, in the presence of 26 persons, delivered a particular
    eulogy. He also sent greetings by Blomberg and said that I should indeed conclude the dismemberments
    of all the princely estates, even if only pro forma, so that he might approve them; for from 1 July
    of this year he would forbid all further dismemberment. He has also already made this known to the
    Chamber. For these reasons too I am here as if upon coals, and look forward to Glenck''s arrival,
    since unhappily I can conclude nothing without power of attorney. God knows, meanwhile, where the
    man is knocking about; for when I was at Trąbczin on the 8th, an express courier came from Posen by
    way of Peifern to the justice-burgomaster Schenck with all the letters written to Glenck for some
    time past, and sought him out — among them were several from Your Serene Highness, namely 2 heavy
    ones and 3 smaller. How can anything sensible come of such gadding about, and what does the sending
    of express couriers not cost, and for a blockhead at that! So I did not know where I should send the
    letters. At last Blomberg came and said: do you'
- page: 9
  en: 'know where Glenck is? Answer: whether he be with the devil or in heaven is unknown to me. Neither
    there nor here: he says he has for some days past been sitting quietly in the deepest coppice at Wrąbczin,
    and is seeking, through Meyer, Tappert and a couple of other fellows, to scare off the people who
    wish to buy here. Flöriche confessed this to me. In the heat I said: only such a scoundrel as Flöricke
    is could bring forward such a thing. Glenck is no marauder, still less so black a villain as should
    work against or destroy the plans of his worthy master, who honestly rewards him. Flöricke, who was
    standing in the hall, heard this and found himself much offended, but engaged himself, for the saving
    of his honour, to furnish the proof. I offered Blomberg a wager of 10 Fr. d''or; and Blomberg, who
    likewise found himself too nearly touched by my expressions, took the wager, in order to give the
    matter a merrier turn; and I laid down the Fr. d''or. The horses already stood'
- page: 10
  en: 'harnessed, with which I was to set off for Kalisz and to be here for certain on the 12th. I therefore
    waited until a messenger came back from Wroberin from Meyer, who is a secret friend of Flören''s,
    and brought not only the confirmation of what Blomberg had said, but also a note of Glenck''s, who
    has now revealed himself. Blomberg swept up my 10 f. d''or with the admonition: in future not to hold
    the bad man for the worst, nor the honest man for the honestest. By the great God! it was not the
    loss of the ten Fr. d''or that vexed me, but the shame of being so foully taken in pressed me well
    nigh to the ground. Abashed, I begged Blomberg''s pardon and Flöriche''s too, seated myself silently
    in my carriage — after having first forwarded to Glenck the papers sent after him by express courier
    — and drove off to Kalisz in grief and care. I have not yet seen the fine gentleman, and am already
    waiting here another 1 1/2 days for him in vain. I shall — since Your Serene Highness expressly told
    me — treat him solidly,'
- page: 11
  en: 'and say not a word to him. But this too Your Serene Highness must not take amiss in me, that from
    now on I hold this Glenck for a truly vindictive, evil and really irreparable envious man. Harm he
    shall not do, nor shall he be an obstacle in any of my plans, which I make for Your Serene Highness''s
    best; for my dealings lie open, are bound up with no self-seeking interest, and are therefore supported
    and furthered by good men, and it is often given me even to win over the bad and to better them —
    therefore I do not fear him. But this I will swear, that he is the most frivolous and most wicked
    man, who can never be bettered either by harsh words or by good ones. I only tremble lest he fritter
    away the time and not go to [uncertain: Winnir] and see to the handing over to Dąbrowski. The handing
    over is to be on the 24th of June. If he is not there at the appointed time, then Dąbrowski has a
    pretext and does not pay the 20500 Rthl, for he means to lease out again elsewhere in order thereby
    to bring the sum together.'
- page: 12
  en: 'I shall indeed lay it to his heart, the more so as it is now most necessary that he should knock
    about here no longer. But whether he will listen to my representation, time must teach. I for my part,
    once the contract is concluded here, go to Berlin, procure the loan and bring the money to Lombardine;
    from there I hasten to Trąbczin and there settle everything as aforesaid. When I am finished there,
    I return to Breslau, see to my own business, and then go to Betschen, Kulm and Kaemen, so that there
    too all may be arranged and these people here be satisfied.


    With unbounded fidelity I remain, until death, reverentially, Your Most Serene Highness''s


    Frankfurt on the Oder, 13th June 1804


    faithful, humble and obedient servant

    v Triebenfeld'

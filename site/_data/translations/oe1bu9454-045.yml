- page: 1
  en: '45


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most gracious letter of the 8th of this month I received only today here
    in Konotop; the second, however, which according to Your Serene Highness''s promise was to arrive
    at the Post Office in Berlin on the Friday following, will unfortunately miss me, because I had to
    leave Berlin in haste / so as not to be altogether imprisoned by Vandertahr. The decree of the first
    instance ordered the said Lahr to be paid the 3000 Rthl at once in cash, or that payment be made against
    me under the law of bills of exchange — the former I could not do, and the latter I had to evade in
    order to gain time, particularly since one confidently [uncertain: hopes] that Beyme will take pains
    to withdraw all those confused dispositions, which run quite contrary to the provincial law and the
    statutes, and that the suit with Lahr will be won in the second instance, all the more so as the letter
    of the law is entirely on our side, and that thereby 1500 Rthl might be recovered. The honest merchant
    Michaelis gave me 2400 Rthl so that I might at least pay Mathieu and settle a few small matters, and
    in that way I escaped the claws of the said Lahr. Amelang has appealed against the first judgment,
    will write to the Grand Chancellor on that account, and will request an explanation of the cabinet
    order which so greatly [uncertain: impairs] the laws. Your Serene Highness''s name does not appear
    in it at all, and even mine is not mentioned; rather the enquiry is made only in general terms, and
    the misconstruction which the judge has put upon the cabinet order is set in such a light on Amelang''s
    part that the court must duly explain the point at issue and remedy the error'

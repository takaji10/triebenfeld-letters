- page: 3
  en: 'and if papers are bought with it at half or 1/3 of their [uncertain: value] at suitable times,
    then one pays the debts with them, and the Centner comes to 12 or 15 Rthl, the debts are extinguished
    and Your Serene Highness is free of cares.


    Just now I receive letters from Amelang. He writes, among other things, that he [uncertain: met] with
    Cosmar at the Chamber Court; the latter was so distracted that he could not wait out his court appointments.
    One of his confidants [uncertain: asked] him the reason — the answer was: God, the P[rincess] Sacken
    has fallen very ill, the lady is old, she is very weak and may die quickly — her death would cause
    me great pain. By the next post more concerning the Prince''s health, etc. Amelang. God will perhaps
    find a way in everything — if only I first have the 100 Friedrich d''or and the 100 ducats to buy
    or redeem the papers, so that I am secured against the claws of Lahr — as to the former, may Your
    Serene Highness only deign to have it made out as I have stated above, and see to it that I can still
    dispatch it thither in April, for our credit on both sides is thereby [uncertain: secured]. Ever shall
    I be, with the most unshakeable fidelity and the most [uncertain: unbounded] gratitude,


    Your Most Serene Highness''s — Today is a fortunate day: just now the justice-burgomaster Hawich and
    Hecker are come from Zagórów — they bring good news, but the post is about to leave; by the next post
    I shall most [uncertain: humbly] transmit the report.


    Konotop


    the 18th of February 1809


    humble and faithful servant


    v Triebenfeld'

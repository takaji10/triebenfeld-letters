- page: 2
  en: 'In the meantime, however, Amelang advises me to be on my guard and to have at least 3000 Rthl in
    state paper in readiness, which in case of need — should von der Lahn pursue me here with the execution
    — I could deposit. But where in the wilderness [is one to get bread] Meanwhile I do not lose courage
    — If I obtain the 100 [uncertain: f dor] to take from?


    and the hundred ducats which Your Serene Highness need only most graciously grant, then I shall know
    how to find my way to them.


    For the assurance of the 600 hundredweight of iron may God bless you, most gracious Prince; they shall
    also bring abundant fruits to you, most gracious Prince and Lord. By it I am set free, and both your
    credit and mine will gain greatly thereby. I have concluded the contract with Michaelis and have further
    promised him the 600 hundredweight of bar and hoop iron, of which the first sort, four-edged, must
    be I believe 5/4 of an inch square, and the hoop iron of such length, breadth and thickness that it
    serves for shoeing the hind stand / to be delivered by the 1st of May of this year, free to the Oberbaum
    before Berlin, at 4 Rthl in Courant the hundredweight. With a trembling hand I signed the contract,
    and until I had Your Serene Highness''s assurance in the matter I could neither rest nor be still.
    God reward you, most gracious Prince, that you have lifted this care from me.


    If it is now in any way possible for Your Serene Highness, then do not send the 600 hundredweight
    of bar and hoop iron here to Kontop at the beginning of April; then I shall send it on from here to
    Berlin and the night is lifted.


    Necessity compelled me, in order to escape personal arrest, to conclude the contract at 4 Rthl, so
    as to obtain money, which is now beyond all measure [scarce]. But if Your Serene Highness will hereafter
    adopt my plan for the discharge of the debts — send iron and buy paper with it — then I shall certainly
    procure more than 8 Rthl Courant per hundredweight'

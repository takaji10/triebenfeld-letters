- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s most gracious letter of the 8th of this month I received only today,
    here in Kontop; the second one, however, which according to Your Serene Highness''s promise was to
    arrive at the Post Office in Berlin on the Friday following, will unfortunately miss me, because I
    had to leave Berlin in haste (so as not to be entirely imprisoned by the Vandertahr). The decree of
    the first instance ordered the said Lahr to pay the 3000 Rthl in cash forthwith, or else to pay against
    me according to the law of bills of exchange — the former I could not do, and the latter I had to
    evade in order to gain time, particularly since one has it with confidence that the said Beyme will
    endeavour to withdraw all those confused dispositions, which are quite contrary to the common law
    and the statutes, and that the suit over the 7 years will be won in the second instance, the more
    so as the letter of the law is entirely on our side, and that thereby 1500 Rthl might be obtained.
    The honest merchant Michaelis gave me 2400 Rthl so that I might at least pay Mathieu and settle a
    few trifles, and in that way I escaped the claws of the said Lahr — Amelang has appealed against the
    first judgment, will write to the Grand Chancellor on that account and beg for an explanation of the
    Cabinet Order which so grievously injures the laws. Your Serene Highness''s name does not appear in
    it at all, and even mine is not mentioned, but the inquiry is made only in general terms, and the
    misinterpretation which the judge has given to the Cabinet Order is set in such a light on Amelang''s
    part that the Court must duly explain the point at issue and remove the error.'

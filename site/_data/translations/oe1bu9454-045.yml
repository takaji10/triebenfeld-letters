- page: 2
  en: 'In the meantime, however, Amelang advises me to be on my guard and to have at least 3000 Rthl in
    state papers in readiness, which I could deposit in case of need, should van der Lahr pursue me here
    with the execution. But where is one to find bread in the wilderness? Meanwhile I do not now lose
    heart — if I receive the 100 Friedrich d''or and the hundred ducats which Your Serene Highness need
    only most graciously promise, then I shall already contrive to make my way to them.


    For the assurance of the 600 Centner of iron may God bless you, most gracious Prince — and they shall
    bring you too, most gracious Prince and Lord, abundant fruits. By it I am freed, and both your credit
    and mine will greatly gain thereby. I have concluded the contract with Michaelis and have firmly promised
    him to deliver the 600 Centner / of bar and hoop iron, of which the first sort, four-cornered, must
    be, I believe, 5/4 of an inch square, and the hoop iron of such length, breadth and thickness as suits
    it for plating side-walls / by the 1st of May of this year, delivered free at the Ober Baum before
    Berlin, at 4 Rthl in Courant per Centner. With a trembling hand I signed the contract, and until I
    had Your Serene Highness''s assurance on the matter I could neither rest nor repose. God reward you
    for it, most gracious Prince, that you have lifted this sorrow.


    If it is now in any way possible for Your Serene Highness, then do not send the 600 Centner of bar
    and hoop iron here to Konotop at the beginning of April; then I shall send it from here to Berlin
    and the [illegible] is lifted.


    Necessity compelled me, in order to escape personal arrest, to conclude the contract at 4 Rthl, so
    as to obtain money, which is now beyond all measure [uncertain: scarce]. But if Your Serene Highness
    will afterwards adopt my plan for the discharge of the debts — send iron, buy papers with the proceeds
    — then I shall certainly raise more than 6 Rthl Courant per Centner'

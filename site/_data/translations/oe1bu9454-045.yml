- page: 3
  en: 'and if paper is bought with it at half or a third of its value at suitable times, then one pays
    the debts with it, and the [uncertain: cashier] comes to 12 to 15 Rthl, the debts are discharged and
    Your Serene Highness free of cares.


    Just now I receive letters from Amelang. He writes among other things that he met with Cosmar in person
    at the Chamber Court; the latter was so distracted that he could not await his own appointed hearings.
    One of his confidants asked him the reason — the answer was, God, the [illegible] Sacken has fallen
    very ill, the woman is old, she is very weak and may die suddenly — Her death would grieve me greatly.
    More on this by the next post, concerning the Prince''s [uncertain: affairs] etc. Amelang. God will
    perhaps help in every way — if only I first have the 100 [uncertain: fr] and the 100 ducats to buy
    or redeem the paper, so that I am secured against the claws of Lahn. As to the first, may Your Serene
    Highness only be pleased to have it despatched as I have said above, and to see to it that I can still
    get it away in April, for thereby our mutual credit [text lost] Eternally shall I be, with the most
    unalterable fidelity and the most unbounded gratitude,


    Your Most Serene Highness''s — Today is a fortunate day; just now the justice-burgomaster Hawich and
    Hecker are come from Zagorowo — They bring good news, but the post is about to depart; by the next
    post I shall render the report most humbly humble and faithful servant


    to convey.


    v. Triebenfeld


    Kontop


    the 18th of February 1809'

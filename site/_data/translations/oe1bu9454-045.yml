status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness''s most gracious letter
    of the 8th of this month I received only today, here at Kontop; the second, however, which according
    to Your Serene Highness''s promise was to arrive at the Post Office in Berlin on the Friday following,
    will unfortunately miss me, because I had to leave Berlin in haste (so as not to be wholly imprisoned
    by the Vandertahr). The decree of the [uncertain: highest] instance ordered the said Lahr either to
    pay the 3000 Rthl at once in cash, or to pay against me according to the law of bills of exchange
    — the former I could not do, and the latter I had to evade in order to gain time, especially as it
    is confidently held that the said Beyme will endeavour to withdraw all those confused dispositions,
    which are entirely contrary to the Landrecht and the statutes, and that the suit of the 7 years in
    the 2nd instance, all the more since the letter of the law is entirely on our side, would be won,
    and thereby 1500 Rthl might be obtained. The honest merchant Michaelis gave me 2400 Rthl so that I
    might only pay Mathieu and settle a few trifles, and in that manner I escaped the clutches of the
    said Lahr. — Amelang has appealed against the first judgment, will write on that account to the Grand
    Chancellor, and beg for an explanation of the Cabinet Order which so greatly injures the laws. Your
    Serene Highness''s name does not appear in it at all, and even my own is not mentioned, but only a
    general enquiry is made, and the misconstruction which the judge has put upon the Cabinet Order is
    set in such a light on Amelang''s part that the Court must properly explain the point at issue and
    remove the error.'
- page: 2
  en: 'In the meantime, however, Amelang advises me to be on my guard and to have at least 3000 Rthl in
    State papers in readiness, which in case of need — should the man from der Lahn pursue me hither with
    the execution — I might deposit. But where in the wilderness is bread to be had? Meanwhile I do not
    now lose courage. — Shall I obtain the 100 f dor [uncertain: to take from]? and the hundred ducats
    — let Your Serene Highness only most graciously say the word, and I shall know how to find my way
    to them. For the assurance of the 600 hundredweight of iron may God bless you, most gracious Prince;
    they shall also bring you, most gracious Prince and Lord, abundant fruits. I am thereby set free,
    and both your credit and mine will greatly gain thereby. I have concluded the contract with Michaelis
    and promised him the remainder, the 600 hundredweight of bar and hoop iron, of which the first sort,
    four-sided, must be, I believe, 5/4 of an inch square, and the hoop iron of such length, breadth and
    thickness as suits for shoeing the hind [uncertain: standing part] — to be delivered by the 1st of
    May of this year at the Ober Baum before Berlin, free, at 4 Rthl in Courant the hundredweight. With
    a trembling hand I signed the contract, and until I had Your Serene Highness''s assurance on that
    account I could neither rest nor be still. God reward you for it, most gracious Prince, that you have
    lifted this care from me. If it is now in any way in the world possible for Your Serene Highness,
    then do not send at the beginning of April the 600 hundredweight of bar and hoop iron hither to Kontop;
    then I shall send it on from here to Berlin, and the night is lifted. Necessity compelled me, in order
    to escape personal arrest, to conclude the contract at 4 Rthl, so as to obtain money, which is now
    scarce beyond all measure. But if Your Serene Highness will hereafter adopt my plan concerning the
    discharge of the debts — to send iron and buy papers with the proceeds — then I shall certainly procure
    more than 8 Rthl Courant per hundredweight.'
- page: 3
  en: 'and if papers are bought with it at half or 1/3 of their [uncertain: value], at suitable times,
    then one pays the debts with them, and the [uncertain: hundredweight] comes to 12 or 15 Rthl; the
    debts are extinguished and Your Serene Highness is free of cares. Just now I receive letters from
    Amelang. He writes, among other things, that he met [uncertain: in person] with Cosmar at the Chamber
    Court; he was so distracted that he could not wait out his appointed terms. One of his confidants
    asked him the reason — the answer was, God, the [illegible] Sacken has become very ill, the wife is
    old, she is very weak and may die quickly. — Her death would grieve me greatly. — By the next post
    more concerning the Prince''s [uncertain: affairs] etc. Amelang. God will perhaps help in every way
    — if only I first have the 100 fr [illegible] and the 100 ducats, in order to buy or redeem the papers,
    so that I am secured against the clutches of Lahn. As to the first, may Your Serene Highness only
    deign to have it made ready as I have said above, and see to it that I can still send it off in April,
    for thereby [text lost] our mutual credit. Eternally shall I be, with the most unshakeable fidelity
    and the most unbounded gratitude, Your Most Serene Highness''s — Today is a fortunate day: just now
    the justice-burgomaster Hawich and Hecker are come from Zagorowo. They bring good news, but the post
    is about to depart; by the next post I shall convey the report most humbly. Humble and obedient servant,
    v Triebenfeld. Kontop, the 18th of February 1809'

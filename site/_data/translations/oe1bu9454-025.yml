status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! An unforeseen occurrence made it necessary that, after
    Your Serene Highness''s departure from Berlin, I had to hasten very quickly to Zagorowo, because the
    peasants had once again raised an insurrection and would not permit the separation of the lands in
    the interior. This matter is now indeed settled and entirely [uncertain: arranged]; meanwhile the
    King, however much I hastened back hither, had departed before I returned, and since my patron was,
    as is natural, gone away with him, he/I could no longer reckon upon this fund. I had therefore to
    strike out upon other paths in order to obtain the money for Weigel, for the Countess Schlabrendorff,
    and for Your Serene Highness. This has now only today been assured through the Justice Councillor
    Bucholz. This man manages the affairs of a certain von Bredow, who has 80000 Rthl lying with the Seehandlung
    here, which he has ordered to be placed elsewhere (since the Minister v Stein, His Excellency, would
    now give only 3 pl.). Herr Bucholz has arranged the matter thus: Upon Kontop there are given, against
    cession of 2 mortgages, 30000 Rthl; upon Schwammern 20000; upon Trąbczin, for the Grotowski mortgage
    which Weigel holds, 30000. Of this there are to be paid — being 80000 Rthl: To the Countess Schlabrendorff
    the 25000 still coming to her; to Weigel the 25000 still due to him; to Hahn, as assistance in Koschentin,
    5000; to Your Serene Highness in cash 5000. I take for myself, for payment of the Wulffs, 30000 —
    80000 Rthl. In return,'
- page: 2
  en: 'in return Your Serene Highness will then give me a note or mortgage for 30000 Rthl, being as much
    as I raise upon my own estates for Your Highness''s behalf! Next to this, the Privy Councillor v Tismar
    is pursuing with the wealthy house of Nathusius at Magdeburg a negotiation, in which he thinks first
    of a capital of 360000 Rthl upon the whole of the South Prussian estates. With this all debts are
    then to be paid, and the mortgage of 250000 Rthl refused with Oppenheimer at 90000 fl is in particular
    to be redeemed and [uncertain: cancelled]. When all this has been seen to and brought into order,
    then I myself [text lost] to Your Serene Highness and bring you the moneys or good orders to pay.
    With the sale of the lands it goes somewhat slowly, on account of the warlike events; meanwhile Honrichs
    writes to me yesterday that once again several purchasers had come forward who would buy at the newer
    fixed prices. Once this matter is properly under way at the new higher prices, then — since all hindrances
    are now removed — much money will be brought together, and an end will be made of all cares. May God
    grant Your Serene Highness the most lasting health, and bestow upon you (when it comes to blows) victory.
    This is the one most heartfelt wish of Your Most Serene Highness''s

    Berlin, the 28th of Septbr.  faithful and most obedient servant

    1806.  v Triebenfeld'

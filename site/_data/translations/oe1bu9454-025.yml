  en: '25


    Most Serene Prince


    Most gracious Lord!


    An unforeseen event made it necessary that, after Your Serene Highness''s departure from Berlin, I
    should hasten with all speed to Zagórów, because the peasants had once again stirred up a rising and
    would not permit the separation of the lands in the interior. This matter is now indeed settled and
    entirely arranged; however, much as I hurried back here again, the King had departed before I returned,
    and since my patron had naturally gone off with him, I could no longer reckon upon that fund. I was
    therefore obliged to take other paths in order to obtain the money for Weigel, for the Countess Schlabrendorff
    and for Your Serene Highness. This has only now, today, been assured through the councillor of justice
    Bucholz. This man conducts the affairs of a certain von Bredow, who has 80,000 Rthl lying with the
    Maritime Trading Company here, which he has ordered to be placed elsewhere / since the Minister von
    Stein, His Excellency, would now give only 3 per cent /.


    Mr Bucholz has turned the matter thus: Upon Konotop, against cession of the two mortgages, there will
    be given 30,000 Rthl. Upon Świniary the 20,000. Upon Trąbczyn, for the Grotowski mortgage which Weigel
    holds, 30,000. Of this there are to be paid, being = 80,000 Rthl: To the Countess Schlabrendorff the
    25,000 still coming to her; To Weigel the 25,000 still due to him.


    To Hahn, as assistance in Koszęcin, 5,000.


    To Your Serene Highness in cash 5,000.


    I take for myself, for the payment of the Wulffen debt, 30,000'
- page: 2
  en: 'in return for which Your Serene Highness will then give me a note or mortgage for 30,000 Rthl,
    as being the amount I am raising on my own estates for Your Highness! Next to this, the privy councillor
    von Tesmar is pursuing a negotiation with the rich house of Nathusius at Magdeburg, in which he hopes
    to obtain a capital of 360,000 Rthl upon the whole of the South Prussian estates. With this all the
    debts are to be paid, and the mortgage of 250,000 Rthl [uncertain: refused] with Oppenheimer for 98,000
    Rthl is in particular to be redeemed and cancelled. When all this shall have been seen to and brought
    to a clear footing, then I myself to Your Serene Highness and bring you the moneys or good orders
    to pay. With the sale of the lands things go somewhat slowly on account of the warlike events; meanwhile
    Honrichs writes to me yesterday that several purchasers had once again come forward who would buy
    at the newly fixed prices. Once this business at the new higher prices is properly under way, then,
    since all the hindrances are now removed, much money will be brought together, and an end will be
    made of all cares.


    May God grant Your Serene Highness the most lasting health and bestow upon you (when it comes to blows,
    victory! This is the sole and most heartfelt wish of Your Most Serene Highness''s


    Berlin, the 28th of September


    1806.


    faithful and most obedient servant


    v Triebenfeld'

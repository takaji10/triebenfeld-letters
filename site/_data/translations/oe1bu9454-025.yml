- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    An unforeseen occurrence made it necessary that, after Your Serene Highness''s departure from Berlin,
    I had to hasten very swiftly to Zagorowo, because the peasants had once again stirred up a revolt
    and would not allow the separation of the grounds in the interior. This matter has now indeed been
    settled and entirely arranged; meanwhile, however much I hastened back here again, the King had departed
    before I returned, and since my patron, as was natural, had gone off with him, he could not count
    any longer upon that fund. I therefore had to take other courses in order to obtain the money for
    Weigel, for the Countess Schlabrendorff, and for Your Serene Highness. This has only now, today, been
    assured through the councillor of justice Bucholz. This man conducts the affairs of a certain von
    Bredow who has 80000 Rthl lying with the maritime trading company here, which he has ordered to be
    placed elsewhere / since the Minister von Stein, His Excellency, now wishes to give only 3 per cent
    /.


    Herr Bucholz has [uncertain: arranged] the matter thus: upon Kontop, against cession of two mortgages,
    there are to be given 30000 Rthl; upon Schwammern 20000; upon Trąbczyn, for the Grotowski mortgage
    which Weigel holds, 30000. Of this there are to be paid, being 80000 Rthl: to the Countess Schlabrendorff
    the 25000 still coming to her; to Weigel the 25000 still due to him.


    To Hahn, as assistance in Koschentin, 5000.


    To Your Serene Highness in cash, 5000.


    I take for myself, for the payment of the Wulffs, 30000 — 80000 Rthl — whereas'

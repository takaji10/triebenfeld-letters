- page: 2
  en: 'whereas Your Serene Highness will then give me a certificate or mortgage for 30000 Rthl, as being
    the amount which I am raising on my own estates on Her/His Highness''s behalf! Next to this, the privy
    councillor von Tismar is pursuing, together with the wealthy house of Nathusius at Magdeburg, a negotiation
    in which he intends, in the first place, a capital of 360000 Rthl upon the whole of the South Prussian
    estates. With this all the debts are to be paid, and the mortgage of 250000 Rthl refused with Oppenheimer
    at 90000 fl is to be redeemed and cancelled in particular; and when all this has been attended to
    and brought to a clear footing, then I myself [will come] to Your Serene Highness and bring you the
    monies or good orders to pay. With the sale of the grounds matters go somewhat slowly amid the warlike
    events; in the meantime Honrichs writes to me yesterday that once again several purchasers had come
    forward who would buy at the newly fixed prices. Once this business is properly under way on account
    of the new higher prices, then, since all obstacles are now removed, much money will be brought together
    and all cares will be brought to an end.


    May God grant Your Serene Highness the most lasting health and give you (when it comes to blows) victory.
    This is the one most heartfelt wish of Your Most Serene Highness''s


    Berlin, the 28th of September


    most faithful and obedient servant


    1806.


    von Triebenfeld'

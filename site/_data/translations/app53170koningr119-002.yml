segments:
- page: 1
  en: 'On behalf of the Right Honourable Chełmski, against His Honour Prusimski, Captain of Niszczewice
    — Report


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Jan
    Bekierski of the village of Węgierce, General Royal Court Summoner, being sound, recognized that he
    had served authentic citation letters for the Kalisz Municipal Court sessions, of the underwritten
    tenor as follows:


    Casimir Nałęcz Raczyński of Raczyno and Matoszyn, Captain-General of Greater Poland — to you, the
    Illustrious Right Honourable Antoni Prusimski, Captain of Niszczewice, heir of the estates of Trąbczyn
    and others — from all your estates generally and from all sums of money of every kind, had and to
    be had, we command: that you appear in person and peremptorily at our next Kalisz Municipal Court
    sessions, next to be held at the Kalisz Municipal Court, at the instance of the Right Honourable Stanisław
    Chełmski, Treasurer of Wschowa, heir of the estates of Łukomia, Łomowa, and others, and of the Honourable
    Ignacy Jaroszewski, steward of those same estates,'
- page: 2
  en: 'as plaintiff — who, adhering to his manifestos made and to be made, cite you to see and hear: to
    be adjudged deserving of penalties in respect of the invasion of the estate of Łomowo, which belongs
    to the plaintiff''s hereditary principal estate of Łukom, with a hunting party of men and dogs, and
    the perpetration therein of various violences of every kind, to be proven by full inquisition; and
    to be ordered to make good the damages; for which you are to be cited and respond judicially under
    full penalties.


    Given in the Kalisz Municipal Court on 10 March 1783.


    In the Hollandry pertaining to the principal estates of Trąbczyn, and in the tavern of the Honest
    Mathias [?]irtionius, at the table in the heated room, with his consort of the same [condition] present,
    on this present day, the contents of the present act set down and left notified.'

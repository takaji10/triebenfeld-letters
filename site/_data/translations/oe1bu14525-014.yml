- page: 5
  en: 'Carried over 12,138 Rthl 12 Groschen

    There are to be added to the dismemberment

    a) the arable held in excess by the burgesses of Kamionna

    according to their ground-deeds,

    700 Morgen, for which as purchase money at 15 Groschen = 10,500

    Ground rents per Morgen 12, being

    350 r., these at capital at 5% [uncertain: inst] = 7,000.

    = 17,500

    b) the land held in excess by the subjects of Kolno,

    1,200 Morgen, as purchase money at 15 Rthl. = 18,000

    Ground rent per Morgen 12., being

    600 Rthl., these at capital 5%. = 12,000

    = 30,000

    in sum 59,638 Rthl 12 Groschen

    From this are to be deducted the forest usufruct taken up in the valuation under 1., 3. and 4.,

    reckoned at capital. = 3,268

    there remain 56,370 Rthl 12 Groschen

    added to this the value lawfully shown by the valuation and the [uncertain: appraisal] of = 199,463.

    so the whole value of the house would come to stand at 255,833 Rthl 12 Groschen


    Kalisz, the 10th of February 180

    Rochlitz

    Forest Inspector'

- page: 1
  en: 'recognised the valuation taken up as correct in all its parts, which, on the basis of the separate
    protocol taken up in this matter, is hereby attested as required by duty for public credence. Done
    at Kalisz, the 13th of February 1803.


    Carl Anton Diener

    Royal Criminal-Court Councillor and Public Notary

    of the South [uncertain: Kast.] Kalisz [uncertain: Rog.] Department


    Joh. Jacob Schmerck

    Royal Commissioner of Justice

    and Public Notary

    of this Government Department


    Of the forest noted under letter X there are to be

    No. 1. the oaks with 221 M. 131 R

    " 3. the oaks and alders 26. " 168

    " 4. the beeches 96. " 32

    in sum 344. M 151 R

    dismembered.'

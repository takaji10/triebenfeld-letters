- page: 4
  en: 'Since the estates Kamionna and Kolno possess a perpetual right of timber-taking in the Gorcey and
    Krobilewer heaths as a servitude, it is evident that the timber districts taken up in the valuation
    under Title X, at 1, 3, 4, cannot be brought to the [uncertain: sow] wholly insignificant yield; and
    so the undersigned has had to take into consideration a second aspect as well, namely that these districts
    standing under timber have soil of the 1st and 2nd class and can be better used as arable land; and
    the timber standing thereon has been taken up according to a judicially assessed valuation, both in
    its quantity and according to its value and the local selling price, and he is convinced that the
    capital to be set thereon is beyond all doubt and [uncertain: acquired].


    The aforesaid timber districts contain, and have in value under Title X:

    at 1. 221 2/3 Morgen standing with oaks,

    per Morgen 10 cords, being

    2,216 2/3 cords at 1 1/2 Groschen ... 3,325 Groschen

    at 3. 27. Morgen with oaks and alders,

    per Morgen 27 cords, being

    729 cords at 1 1/2 Groschen ... 1,093. 12.

    at 4. 96 Morgen beeches, per Morgen 35. cords,

    being 3,360 [uncertain: Rthl] at 2 Groschen ... 7,720

    Carried forward, sum 12,138 Rthl 12 Groschen'

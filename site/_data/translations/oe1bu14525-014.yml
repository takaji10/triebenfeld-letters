  en: 'since the remaining stock of the forest covers the requirements of the husbandry more than sufficiently,
    there should be no objection to it on that account, the less so as this undertaking can be hindered
    by no servitudes.


    There would be gained by this dismemberment


    1., For timber.

    No 1. in yield 18. 10.

    No. 3 19. 6.

    No 4. 126.

    in sum yield 163 Rthl. 16.

    or at [uncertain: capital] 3,268 Rthl


    2., Purchase money for the land.

    per Morgen. 15 Rthl = 5,160


    3., Ground rents.

    a, per Morgen 12 Groschen 172 r.

    b, per Hufe

    1 goose f = 11. geese

    8 p. = 3. 16 Groschen.

    1 capon

    11 head at 3. 1. 9.

    1 team and 2 hand

    days 8. and

    at 4 Groschen = 5. 12. = 10. 13 Groschen

    Carried forward 182 Rthl. 13 Groschen - 8,428 Rthl'

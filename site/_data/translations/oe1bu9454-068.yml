- page: 2
  en: 'done. The time is short - to the 28th there are only 10 days, and by then the deed must be here
    and Honrichs in König with it. He has 3 days'' travel. The favourable moment must not be let pass,
    or the matter is lost - the original deed is insisted upon in the Polish manner. Honrichs must produce
    it. The court takes a copy, and Your Serene Highness will receive the same back. Only do not delay,
    Most gracious Lord - I beg you urgently for this - upon this matter the Kähmener also depend at the
    same time. So send me the deed by express courier rather than otherwise, and lose not a moment. Kwilecki
    sends me word that I am at once to bring suit against Lipschi, who took the Traepisier estates from
    Your Serene Highness by force and handed them over to the Dabilia; for the Dqbsha, who at once drew
    15000 Rthl in ducats out of the estates, went with it to Warsaw and has made away with the money,
    so that nothing is to be got from her - but Lipilii, who acted infamously as a judge and is said to
    be a rich fellow, must and can make it good - I shall do the same.


    The late prefect Brzechsta writes: the Prince must have his estates back forthwith. Meanwhile I believe
    he will get them sooner than the decree is issued, for everything here will shortly alter. Honrichs
    says the Russians were quite certainly advancing into the province of Warsaw, [uncertain: in the part]
    trembled, but the great mass was already wholly Russian in sentiment and rejoiced. Oh, if only this
    came to pass - then you, good Prince, should have not only your estates quickly but more besides,
    and receive 3 [uncertain: Jachm] in compensation for the damages suffered.


    But now send an order to pay or ready money - as God shall be gracious to me in my dying hour, I have
    not a [illegible] coin in the house, I'

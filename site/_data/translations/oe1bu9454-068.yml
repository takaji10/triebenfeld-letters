- page: 3
  en: 'am nevertheless to feed the people, give [uncertain: Weise] money, and advance costs - where am
    I to take anything from? My credit is quite dead - today my judge pledged his watch and raised 8 Rthl
    in coin upon it, merely to be able to feed Stenger, Honrichs and their associates. 59 Rthl 18 Groschen
    I have already borrowed for this purpose and paid out; 185 Rthl remain to be paid. - So send an order
    to pay, or ready gulden, at least 1000 Rthl, but Courant - then I shall work on and save everything
    for you. But if you send no money and not the deed, then, as truly as there is a God, I cannot work
    a straw further, and must commit all to God, who may then help you and me.


    The [uncertain: gout] afflicts me dreadfully, the writing costs me only bitter blood; with that I
    remain, until death,


    Your Serene Highness''s - Sir, the term is short to the 28th; deed and money must be in König on the
    morning of the 28th - I am therefore sending this letter by express courier, which the Most Serene
    Prince will deign to pay for. Within 48 hours you will have the express courier at Schlawenschitz.
    You will at once send someone here with the deed and the money by express courier, who can be here
    in at most 60 hours, and then all care is removed and the thing is done. Honrichs then still has 3
    days'' time; I am giving him money so that he may travel on further by post [uncertain: schwoll] if
    his horses give out - and in that way he can still be in Korien before the 28th. Deign, most gracious
    Prince, to take this well to heart. The dice lie upon the table at present - Kwilecki is judge for
    only 4 weeks more, and then the coarse Zielonacti comes on again. There are 4 of them who change every
    3 months. - If it moves you to see your property saved, then make haste to attend to what I have said
    here. For even if Constantin himself were to come forward, it is well if one can already show judicial
    proofs of the Polish knaveries; one can then demand with double right.


    Kontop, the 18th of February


    1810.


    faithful and obedient servant


    v Triebenfeld'

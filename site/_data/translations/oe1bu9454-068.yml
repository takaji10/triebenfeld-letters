  en: '68


    Most Serene Prince


    Most gracious Prince and Lord!


    Honrichs arrived here this night; he has shown by evidence that all the statements of Hawich and his
    associates are false and untrue. The requisitions in money and grain, always collected by him under
    military execution and given by him, which amount to 22000 rt, the colonists must, according to their
    contracts, hand over to Your Serene Highness when peace and quiet return. Honrichs, according to the
    proofs laid down, has never failed to press constantly for the imposition of execution upon the colonists,
    but this has never been allowed on political grounds; rather, everything has been demanded of Your
    Serene Highness alone, and it has been left to you to look to the subjects and colonists for it —
    at present he comes to fetch the original deed of gift concerning Trąbczyn. This must be produced
    in the original; on the 28th of this month the hearing is set at Konin before the justice of the peace
    Kwilecki. I am therefore sending a messenger to Lombardini, who must [uncertain: send] a mounted express
    to Your Serene Highness to fetch the original deed and send it to me at once by a mounted messenger.
    Honrichs was to [uncertain: wait] here for it. The matter is of the highest importance; may Your Serene
    Highness deign to enjoin the very greatest expedition, and if need be send the deed by express courier.
    I hope that you will then speedily recover the estates. This is a great object. Kwilecki is justice
    of the peace in this quarter, and much must therefore'

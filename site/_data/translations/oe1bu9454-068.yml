- page: 3
  en: 'am nevertheless to feed the people, give travelling money, and advance costs — where am I to take
    anything from? My credit is quite dead — today my judge pawned his watch and borrowed 8 rt in coin
    upon it, merely to be able to feed Stenger, Honrichs and their associates. 591 rt 18 g I have already
    borrowed and paid out for this purpose; 185 rt are still to be paid. — So send an instruction to pay
    or cash money, at least 1000 rt, but Courant — then I shall work on and save everything for you. But
    send no money and not the deed, and then, as surely as there is a God, I can work not a straw further,
    and must commit it all to God, who may then help you and me.


    [illegible] tells me dreadfully that the writing is only blood-sour [text lost] I remain, until death,


    Your Serene Highness''s — Sir, the [uncertain: term] runs to the 28th; the year is short. Deed and
    money must be in Konin early on the 28th — I am therefore sending this letter by express courier,
    which the Most Serene Prince will deign to pay for. In 48 hours you will have the express courier
    at Sławięcice. You will at once send someone here with the deed and the money by [uncertain: express
    courier], who can be here in at most 60 hours, and then all care is lifted and the thing is done.
    Honrichs still has 3 days'' time; I am giving him money so that he may travel on further by post [uncertain:
    schwoll] if his horses give out — and in that way he can still be in Konin before the 28th. Deign,
    most gracious Prince, to take this well to heart. The dice are now lying on the table — Kwilecki is
    judge for only 4 weeks more; then the coarse Zielonacki comes on again. There are 4 of them, who change
    every 3 months — If it [uncertain: matters] to you to see your property saved, then make haste to
    see to what I have said here. For even if Constantin himself should come forward, it is good if one
    can already show judicial proofs of the Polish knaveries; one can then demand with double right —


    Konotop, the 18th of February


    1810.


    faithful and obedient servant


    v Triebenfeld'

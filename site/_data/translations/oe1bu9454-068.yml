- page: 2
  en: 'be done. The time is short; to the 28th there are only 10 days, and by then the deed must be here
    and Honrichs with it in Konin. He has 3 days'' travel. The favourable moment must not be let pass,
    otherwise the matter is lost — in the Polish manner they insist on the original deed. Honrichs must
    produce it. The court takes a copy, and Your Serene Highness receives the same back — only do not
    delay, gracious Lord — I urgently beg you for it — at the same time the Kamionna matter also depends
    on this one — so do rather send me the deed by express courier, and lose not a moment. Kwilecki sends
    me word that I should at once bring suit against Lipscki, who took the Trąbczyn estates from Your
    Serene Highness by force and handed them over to Dąbska; for Dąbska, who at once drew 15000 rt in
    ducats out of the estates, went with it to Warsaw and made away with the money, so that nothing is
    to be got from her — but Lipski, who as a judge acted infamously and is said to be a rich fellow,
    must and can make it good — I shall do the like.


    The sub-prefect Brzechffa writes that the Prince must have his estates back forthwith. Meanwhile I
    believe he will get them sooner than the decree is given, for everything here will shortly change.
    Honrichs says the Russians were advancing quite certainly into the province of Warsaw, [uncertain:
    in part Poland] trembled, but the great mass was already entirely Russian in sentiment and rejoiced.
    Oh, were this but to happen, then you, good Prince, should not only have your estates back quickly
    but still more besides, and receive threefold compensation for the damages suffered.


    But now send an instruction to pay or cash money — I have, as God shall be gracious to me in the hour
    of death, not a [illegible] coin in the house, I'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Honrichs arrived here this night; he has proved
    that all the statements of Hawich and consorts are false and untrue. The requisitions in money and
    grain, always levied by him under threat of military execution and rendered by him, which amount to
    22000 Rthl, the colonists must, according to their contracts, hand over to Your Serene Highness when
    calm and peace come in. Honrichs, according to the proofs laid down, has not failed constantly to
    press for the imposition of execution upon the colonists; but this they never would concede, on political
    grounds; rather, everything has been demanded of Your Serene Highness alone, and it has been left
    to you to look to the subjects and colonists for it - at present he comes to fetch the original deed
    of donation concerning Trapponin. This must be produced in the original; on the 28th of this month
    the hearing stands at [uncertain: Konen] before the justice of the peace Kwilecki. I am therefore
    sending a messenger to Lombardini; he must send a mounted express to Your Serene Highness to fetch
    the original deed [uncertain: wertende] and send it to me at once by a messenger. Honrichs waits here
    for it. The matter is of the highest importance; may Your Serene Highness deign to enjoin the very
    greatest expedition, and if need be send the deed by express courier. I trust that you will then get
    the estates back speedily. This is a great object. [uncertain: Vervilechi] is justice of the peace
    this quarter, and much must be'
- page: 2
  en: 'done. The time is short: to the 28th there are only 10 days, and by then the deed must be here
    and Honrichs with it in König. He has 3 days'' travel. The favourable moment must not be let slip,
    else the matter is lost - upon the original deed there is insistence after the [uncertain: Polish]
    manner. Honrichs must produce it. The court takes a Copy, and Your Serene Highness receives the same
    back. Only do not delay, gracious Lord - I beg you urgently for it - upon this matter the Kähmener
    too depend at the same time. So do rather send me the deed by express courier, and lose not a moment.
    Kwilecki sends me word that I should at once bring suit against Lipski, who took the [uncertain: Traepisier]
    estates from Your Serene Highness by force and handed them over to the Dąbska; for the Dąbska, who
    at once drew 15000 Rthl in ducats out of the estates, went off with it to Warsaw and has made away
    with the money, so that nothing is to be got from her - but Lipski, who as a judge acted infamously
    and is said to be a rich fellow, must and can make it good - I shall do the like. The [uncertain:
    Tod] Prefect Brzechsta writes: the Prince must have his estates back forthwith. Meanwhile I believe
    he will get them sooner than the decree is issued, for everything here will shortly be otherwise.
    Honrichs says the Russians were quite certainly advancing into the province of Warsaw, [uncertain:
    in part trembled], but the great mass was already wholly Russian in sentiment, and rejoiced. Oh, were
    this but to happen, then you, good Prince, should not only get your estates quickly, but more besides,
    and receive 3 [uncertain: Jachm] compensation for the damages suffered. But now send an instruction
    or ready money - I have, as God shall be merciful to me in the hour of death, not a [illegible] coin
    in the house; I'
- page: 3
  en: 'am nevertheless to feed the people, [uncertain: give money in wise], and make advances for costs
    - where am I to take anything from? My credit is stone dead - today my judge pawned his watch and
    borrowed 8 Rthl [uncertain: in coin] upon it, merely to be able to feed Stenger, Honrichs and consorts.
    59 Rthl 18 g. I have already borrowed for this purpose and paid out; 185 Rthl remain still to be paid.
    - So send an instruction or ready gulden, at least 1000 Rthl, but Courant - then I shall work on and
    save everything for you. But if you send no money and not the deed, then, as truly as there is a God,
    I cannot work a straw further, and must commit everything to God, who may then help you and me. The
    gout is troubling me frightfully, so that the writing is only bitter blood [text lost] I remain, until
    death, as Your Serene Highness''s [text lost]. The term is short until the 28th; deed and money must
    be in König early on the 28th - I am therefore sending this letter by express courier, which the [uncertain:
    most humble] Prince may deign to pay. In 48 hours you will have the express courier at Schlawenschitz.
    Send someone at once with the deed and money hither by [uncertain: express], who can then be here
    in at most 60 hours, and then all care is lifted and the business done. Henrichs has still 3 days''
    time; I am giving him money, so that he may travel on by post [uncertain: swoll] if his horses should
    [uncertain: give out] - and in that way he can still be in [uncertain: Korien] before the 28th. Deign,
    most gracious Prince, to take this well to heart. The dice lie at present upon the table - Kwilecki
    is judge for only 4 weeks more; then the coarse Zielonacki takes office again. There are 4 of them,
    who rotate every 3 months - if it moves you to see your property saved, then hasten to procure me
    what I have here said. For even if Constantin himself should come forward, it is well if one can already
    show judicial proofs of the Polish knaveries; one can then demand with double right. Kontop, the 18th
    of February 1810. faithful and obedient servant v Triebenfeld'

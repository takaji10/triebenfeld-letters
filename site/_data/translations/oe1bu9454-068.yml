- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Honrichs arrived here this night; he has furnished proof that all the statements of Hawich and his
    associates are false and untrue. The requisitions in money and grain which he always exacted by military
    execution, and which were given by him, amounting to 22000 Rthl, must, according to their contracts,
    be delivered up to Your Serene Highness by the colonists when calm and peace return. Honrichs, according
    to the proofs laid before [illegible], did not fail to press continually for execution to be laid
    upon the colonists, but this was never conceded on political grounds; instead, everything was demanded
    from Your Serene Highness alone, and it was left to you to look to the subjects and colonists for
    it - at present he comes to fetch the original deed of donation concerning Trapponin. This must be
    produced in the original; on the 28th of this month there is a hearing still at Konen before the justice
    of the peace Kwilecki. I am therefore sending a messenger to Lombardini; he must [send] a mounted
    express to Your Serene Highness [uncertain: sondern] to fetch the original deed [uncertain: wertende]
    and send it to me at once by a messenger. Honrichs was to wait here for it. The matter is of the highest
    importance; may Your Serene Highness deign to command the very greatest haste, and if need be send
    the deed by express courier. I hope thereby that you will then swiftly get the estates back. This
    is a great object. Kwilecki is justice of the peace this quarter, and much must then be'

- page: 1
  en: 'Fol. of 20 February 1799. By the Grace of God Friedrich Wilhelm, King of Prussia etc. etc.


    Our Royal Grace and favourable disposition first of all, High-born Prince, especially dear and faithful
    one! Upon the petition submitted by Your Lordship on the 31st of January of this year in the matter
    of the Treasury against von Prusimski, requesting a certified copy of the sentence of confiscation
    drawn up against the same von Prusimski just mentioned, furnished with the attestation of its having
    taken legal force, for the purpose of putting in order the title of possession (Titulus Possessionis)
    of the Trąbczyn estates conferred upon him, We hereby grant Your Lordship, returning the original
    enclosure, this resolution: that the sentence of confiscation against the aforementioned von Prusimski
    was drawn up not at Our Government here but at Our Government at Thorn, and that Your Lordship must
    therefore apply to the latter in the matter. We remain well disposed towards Your Lordship with Royal
    Grace and favourable will. Given at Poznań, the 4th of February 1799.


    Danckelmann[uncertain: reading of signature]


    To His Lordship the Prince of Hohenlohe-Ingelfingen


    Enge[uncertain: r]'

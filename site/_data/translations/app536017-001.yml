status: draft
segments:
- page: 1
  en: 'Łukomski shall carry out the judicial site inspection


    Disputes having arisen between the underwritten parties upon a written citation of the Konin land
    court, whereby the Honourable Albertus Thrąmpczyński Otha, acting from his own interest as Plaintiff,
    has cited the Honourable Thomas Łukomski for the second time after the penalty of contumacy — for
    this reason: that he himself, in the present year, having constructed a pond together with his other
    neighbours, against whom the Plaintiff has reserved to himself his right of action intact, in the
    estate of the village of Łukom — by which pond he has flooded, so far as concerns the interest of
    that same Plaintiff, an enormous quantity of woodland and pine forest, of barren pastures and also
    of meadowlands, through the excessive retention of water, in the same estates of the villages of Trąbczyn,
    Nowa Wieś and Osiny — namely: drowned and killed, through that flooding, the timber of common productive
    oak, beech and ash, suitable for building and for bee-trees —


    doing the aforesaid to the grave damage and injury of the Plaintiff, of the value of ten thousand
    Hungarian florins of pure gold and of just weight, and as much again in damages; the citation itself,
    with its copy, setting out the aforesaid more fully.


    The present land court of Konin, having heard the disputes of the aforesaid parties made before the
    present court, at the legal request of the cited party, adhering to the common law, has decreed and
    by these presents decrees a judicial site inspection; and none the less it has added, as by these
    presents it adds, a land court Messenger, whom the cited party shall choose for itself, namely to
    see and to inspect in what place and on whose ground the aforesaid injury was inflicted, and whether
    it was done or not. Which judicial site inspection the cited party, at its own expense, having hired
    the Messenger, from the date of the present decree, within exactly six'
- page: 2
  en: 'weeks, the consent of the parties being added thereto, is bound to carry out at the place of the
    differences, under the penalties [uncertain: raised], to be won and lost by the cited party in default
    of the carrying out. At which inspection both parties are bound to be present. And so, whether the
    inspection has been carried out as aforesaid or not, both the aforesaid parties shall have, at the
    next future land court terms of Konin, to be held next and immediately at Konin, a peremptory term
    to hear, upon the aforesaid inspection, the restitution of right before the court through the Messenger,
    and to do all else that shall be of law in the present cause — the present decree of inspection, the
    keeping of the term, and the record, with no party''s right harmed.'

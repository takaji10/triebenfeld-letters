  en: '159


    Most Serene Prince


    Most gracious Prince and Lord. With the most unspeakable labour the honest Amelang has at last brought
    matters so far to a conclusion that he has given, from the banker leve, an order to pay upon the Kuh
    brothers, before the monies from the Invalids'' Fund, which in truth consist in Sea-Trading Company
    obligation in / to the amount of 36755 rt. 7 gg. has received. I hasten to transmit the same, without
    the very least delay, most obediently to Your Most Serene Highness. Tomorrow everything will be arranged,
    and the Hanus matter as well as the Eysenhardt one put in order, and when I have finished with that
    I shall hasten back in to go to Kalisz and to see to the rest for the obtaining of the 100000 rt.
    In deepest reverence I remain, until death, Your Most Serene Highness''s — may Your Serene Highness
    be pleased to have the letter to the Messrs Kuh delivered at once — faithful and most obedient serv[ant].
    How true is presumably, in a position to hinder the dismemberment? I offer defiance to any man. Berlin,
    the 31st of January 1805.


    v Triebenfeld'

segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord, With the most unspeakable toil the honest Amelang
    has at last laid the affairs to rest so far that he has given, from the [uncertain: banking house
    / Banquier], an instruction upon the brothers Kuh, before the monies from the Invalids'' Fund, which
    properly consist in a negotiation-obligation, / to the amount of 36755 Rthl 7 gg. which he has received.
    I [uncertain: wish] to convey the same, without the very least delay, most obediently to Your Most
    Serene Highness. Tomorrow everything will be arranged, and the Hangsche affair as well as the Eysenhardtsche
    one put in order, and when I have done with that I shall hasten back to go to Kalisz and to see to
    what further is needed for the obtaining of the 100000 Rthl. In deepest reverence I remain, until
    death, Your Most Serene Highness''s — may Your Serene Highness graciously cause the letter to the
    Messieurs Kuh to be delivered at once — faithful and most obedient serv[ant]. How true it is: who
    indeed is in a position to hinder the dismemberment? I defy anyone. Berlin, the 31st of January 1805.
    v Triebenfeld'

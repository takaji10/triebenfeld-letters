segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, With the most unspeakable trouble the honest Ame lang has at last so
    far buried the matters that he has given, from the Ban quis leve, an instruction to pay to the brothers
    Kuh, before the monies from the Invalids'' Fund, which properly consist in a negotiating obligation
    / to the amount of 36755 Rthl 7 gg., have been received. I wish, without the very least delay, most
    obediently to transmit the same to Your Most Serene Highness. Tomorrow everything will be arranged,
    and likewise the Hang matter as well as the Eysenhardt matter will be brought into order, and when
    I am finished with that I shall hasten back to go to Kalisz and to see to the further steps for obtaining
    the 100000 Rthl. In deepest reverence I remain, until death, Your Most Serene Highness — may Your
    Serene Highness deign to have the letter to the gentlemen Kuh delivered at once — most faithfully
    obedient Serv[ant] How true it is, indeed, that [someone] is in a position to hinder the dismemberment?
    I defy anyone. Berlin, the 31st of January 1805.


    v Triebenfeld'

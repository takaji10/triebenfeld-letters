status: draft
segments:
- page: 1
  en: 'Your Serene Highness''s letter of the 7th of this month I received this very hour. Although I wrote
    to Schlawenschitz only the day before yesterday, the content of your letter is nevertheless so important
    that I hasten to bring several matters into the light which threaten even my own honour, all the more
    so as in 3 of the letters received from Your Serene Highness a very cold tone prevails. I therefore
    give myself the honour of first answering the latter point, point by point. As regards then, 1st,
    Herr Gen[eral] Schüler, he will not concern himself with the matter, and that in order not to make
    an enemy of the Poles etc. — His last answer was: Should the Emperor ask me, well then I shall see
    what may be done. — Even Count Nesselrode shrugs his shoulders. I therefore have no other help in
    this matter to expect than through His Serene Highness the Chancellor and through Herr Min[ister]
    Humboldt. I have asked Your Serene Highness for 2 French blank sheets, in order, if the Prince commands
    it, to write once more to the Emperor. Herr H. Fruth Barbe will draw it up, yet he advises that the
    Prince''s commands be complied with punctually. As regards, 2nd, the error concerning the yield of
    the estates, this — as I have already written to Herr Court Councillor Hahn — will have no further
    consequences than that it marks an ugly contradiction, for which neither the Court Councillor nor
    I am to blame. Your Serene Highness yourself gives me the revenues at 79000 Rthl; this I took as the
    standard in the first submission. — But the officials now put them down as low as 36000 Rthl — and
    I should not at all have wished this extract to be appended to the protocol, because the difference
    is too striking. That, moreover, the officials have made incorrect returns or managed badly can only
    be the case. — I am wholly reassured by the statements of Herr Court Councillor Hahn, all of which
    lie before His Serene Highness the Chancellor from A to Z. He gives the value of the estates at 2
    millions and their yield at 60000 Rthl, which in better times, however, must turn out much higher.
    Since now even the Privy'
- page: 2
  en: 'Councillor of State von Stägemann himself holds him for a man expert in the matter, no further
    disadvantage is to be feared. — That I should gladly have seen Your Serene Highness''s statement of
    the revenue of 79000 Rthl at least substantiated in the protocol by 70000 is surely not to be censured.
    Given the distance and the tavern-like course of the posts, I could not know that Herr Court Councillor
    Stahn had already departed for Brieg, for otherwise I should not have written at that time at all.
    I am content, and am too glad to be convinced that the estates have funds enough to discharge the
    112000 Rthl in 5 or 6 years — and thereupon I fall silent, most reverently, upon this passage, all
    the more so as the much-mentioned [uncertain: error] will now never be of consequence and everything
    has already been forestalled. It strikes me as odd, however, why so much fuss is made about this matter.
    Have I then stated the revenues? — one would make of me a beast of burden, that I should bear the
    blame for it; could I have known the yield of the estates? Your Serene Highness gave it to me thus.
    — Your word was sacred to me, and upon that ground I raised the edifice. — Had I then shown Hahn Your
    Serene Highness''s statement, he would perhaps have refuted it, and he, as a straightforward man and
    as a faithful [uncertain: beginner], would surely have advised me faithfully and truly. In short,
    neither he nor I is to blame for the said error, in which, however, I no more than Court Councillor
    Hahn wish to be left exposed. As regards the advance of the 112000 Rthl, it will be given, unless
    all be lies — thus I have lain there from Grè mal gre — only this can no one lie of me or say after
    me, that I wished to settle the matter with the Curish heirs in secret, without the knowledge of the
    mandatories. Outrageous is it for me that, for all my exertions, I am now taken besides for a rogue
    or a total blockhead. At bottom I do not know whether it were so great an honour to boast of such
    a compromise; I have therefore advised that this should never have been done by the King himself,
    but that Your Serene Highness should for that purpose be furnished with the advance of the 11th inst.'
- page: 3
  en: 'I had to lay down the pen. — Your Serene Highness has by this letter done me great [uncertain:
    injury] — I believe I have now had occasion to read into your heart, and to see what I may promise
    myself of the future. Unjust suspicion stamps the best of men, and still more, too often, the best
    of friends, as otherwise than they are. — Reproach and humiliation can drive him to fury. Your Serene
    Highness seems to wish to burden me with it — this I neither can nor am able to bear. You have it
    made known to me, moreover, by a stranger''s hand — this is against my sense of honour and humiliates
    me too greatly. I have said and done nothing but what stands in the [uncertain: instructions] given
    and sent to me. I have exerted everything to bring the matter to the desired goal. Much has already
    succeeded, and the rest would also have been attained; that His Serene Highness the Prince State Chancellor
    does not lay everything aside and does not answer at once what I submit, for that I cannot help. —
    I do not even see him [text lost] which fate thousands share with me — it has hitherto been enough
    for me that everything [uncertain: Basbe / Barbe] hands over to him in Your Serene Highness''s affairs
    he has received with benevolence and gracious assurances, and has at once passed it on to the referendary.
    The funds said to lie in readiness, which I mentioned in my submissions, are named there so that one
    should form a good idea of the worth of the entailed estates. This leads, however, to nothing and
    is a mere turn of phrase. — Meanwhile they are often mentioned in the pieces given. — Yet I never
    intended that any other than the lawful use should be made of them, which was that your creditors
    should draw the 54500 Rthl, or whatever the sum is, in accordance with your instruction. Still less
    did I intend to blight F. August''s 100000 Rthl or his quiet life. Whether, moreover, the settlements
    and codicils may be allowed to stand, I do not know. — Your Serene Highness seems not to have noticed
    that I have no longer objected to the same in any of my submissions since the first.'
- page: 4
  en: '— my concern was to prove that Your Serene Highness had undertaken to satisfy the Curish heirs
    alone. — This was found at last in the Cosmarian declaration which the H[err] Hoff[rath] v. Hahn sent
    hither. For the rest, I repeat it to myself once more, that I cannot compel His Serene Highness the
    Prince St[ate] Ch[ancellor] to any speedy decision — and that I must leave it to my accursed ill fortune
    whether Your Serene Highness will [uncertain: obtain] the money for the payment of the debts or not.
    — I have nothing further to do here but to attend to your affairs daily and hourly. — Be pleased therefore
    to send someone hither with all speed who will take over the business, so well set in train; until
    then I shall continue to work faithfully and so far as lies within my powers. — Forgive it, Your Serene
    Highness, if I recall that scene when you sent Hoathausen to Kalisz, had the mortgage books revised,
    and how the fellow (perhaps flushed with wine) had spoken of having me arrested — this is nearly the
    2nd such case; against the 3rd I should gladly secure myself. With a bleeding heart shall I think
    upon the time lost. I have nothing and know not here upon what I am to live — but my pride, most gracious
    Lord, you shall not bring low with your reproach; I have dealt too honestly by you and sacrificed
    everything — never did I dream of one-sided arrangements with the Curish heirs, and I regret that
    you should have been willing to grant me your confidence, if you believed me to be the [uncertain:
    AusanKopf]. Finally I must here further note that when I was asked yesterday whom you might wish for
    as administrator, I named Court Councillor Hahn. — I am also to obtain instructions from Your Serene
    Highness on that head. With every possible esteem and respect I am Your Serene Highness''s


    Vienna, the 15th of February 1815.


    most obedient servant

    v Triebenfeld'

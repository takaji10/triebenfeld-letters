- page: 4
  en: '— my concern was to prove that Your Serene Highness had undertaken to satisfy the Courland heirs
    alone. — This was found at last in the Cosmar declaration, which only Mr Court Councillor Hahn sent
    here. For the rest I repeat once again that I cannot compel His Serene Highness the Prince State Chancellor
    to any swift decision — and that I must leave it to my accursed ill fortune whether Your Serene Highness
    will send the money for the payment of the debts or not. — I have nothing further to do here than
    daily and hourly to attend to your affairs. — Deign therefore to send someone here with all speed
    who will take over the business, so well set in train; until then I shall go on working faithfully
    and so far as lies in my powers. — Forgive it, Your Serene Highness, if I mention that scene where
    you sent Heuthausen to Kalisz, had the mortgage books reviewed, and how the patron / perhaps in his
    cups [illegible] / had spoken of having him arrested. — This is almost the 2nd instance; against a
    3rd I should gladly secure myself. With a bleeding heart I shall think of the time lost. — I have
    nothing and do not know here what I am to live on — but my pride, gracious Lord, you shall not bring
    down with your censure; I have acted too honestly toward you and sacrificed everything. — Never did
    I dream of one-sided arrangements with the [uncertain: Künstl] heirs, and I regret that you should
    have been willing to grant me your confidence, if you believed me to be the [uncertain: Ausan] head.
    — In conclusion I must further remark here that, when I was asked yesterday whom you might wish for
    as administrator, I named Court Councillor Hahn. — I was also to obtain instruction from Your Serene
    Highness on that point. — With the utmost possible esteem and respect I am Your Serene Highness''s


    Vienna, the 15th of February


    1815.


    most obedient servant


    v. Triebenfeld'

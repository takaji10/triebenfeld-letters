- page: 1
  en: 'Your Serene Highness''s letter of the 7th of this month I received this very hour. Although it
    is true that I wrote to Schlawenschitz only the day before yesterday, the content of your letter is
    nonetheless so important that I hasten to bring certain matters into the light which threaten danger
    even to my honour, the more so [uncertain: as] in three letters already received from Your Serene
    Highness a very cold tone prevails. I therefore give myself the honour of answering first the latter
    point, point by point. As concerns then, firstly, Mr. General Schüler, he will not involve himself
    in the matter, and that in order not to make enemies of the Poles etc. — His last answer was: Should
    the Emperor ask me, well then I shall see what can be done. — Even Count Nessetrock shrugs his shoulders.
    I have therefore no other help in this matter to expect than through the Prince Chancellor and through
    Mr. Minister Humboldt. I have asked Your Serene Highness for 2 French blank forms, in order, should
    the Prince command it, to write once more to the Emperor. Mr. Court Councillor Barbe will draw it
    up, but he advises that the Prince''s commands be complied with punctually. As concerns, secondly,
    the error regarding the yield of the estates, this — as I have already written to Mr. Court Councillor
    Stahn — will probably have no further consequences than that it marks an ugly contradiction, for which
    neither the Court Councillor nor I am at fault. Your Serene Highness yourself gives me the revenues
    as 79000 Rthl; this I took as the standard in the first submission. — But the officials now set these
    down as low as 36000 Rthl, and I should very much have wished not to have had this extract appended
    to the record, because the difference is too striking. That for the rest the officials have either
    stated it incorrectly or managed badly can only be the case. — I am entirely at ease with the statements
    of Mr. Court Councillor Hahn, all of which lie before His Serene Highness the Prince Chancellor from
    A to Z. He gives the value of the estates as 2 millions and their yield as 60000 Rthl, which in better
    times, however, must turn out much higher. Since even the Privy'

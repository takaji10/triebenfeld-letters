- page: 4
  en: 'my concern was to prove that Your Serene Highness had undertaken to satisfy the Courland heirs
    alone — this was found at last in the Cosmarian declaration which only Mr. Court Councillor von Hahn
    sent hither. For the rest I repeat once more that I cannot compel His Serene Highness the Prince State
    Chancellor to any swift decision — and that I must leave it to my accursed ill fortune whether Your
    Serene Highness will [uncertain: obtain] the money for the payment of the debts or not. — I have nothing
    further to do here than to attend to your affairs daily and hourly. — Be pleased therefore to send
    someone here with the utmost speed who will take over the business so well set in train; until then
    I shall continue to work faithfully and so far as lies in my powers. — Forgive it, Your Serene Highness,
    if I recall that scene where you sent Hoathausen to Kalisz, had the mortgage books revised, and where
    the fellow (perhaps in his cups) had spoken of having me arrested — this is nearly the second instance;
    against the third I should gladly secure myself. With a bleeding heart I shall remember the time lost.
    I have nothing and do not know here what I am to live on — but my pride, most gracious Lord, you shall
    not break with your reproach; I have acted too honestly towards you and sacrificed everything — never
    did I dream of one-sided arrangements with the [uncertain: Künstl] heirs, and I regret that you were
    willing to bestow your confidence on me if you believed me to be the [illegible]. Finally I must still
    note here that when I was asked yesterday whom you might wish for as administrator, I named Court
    Councillor Hahn. — I am to obtain instructions from Your Serene Highness on this point also. With
    the utmost possible esteem and respect I am Your Serene Highness''s


    Vienna, the 15th of February


    1815.


    wholly obedient servant


    v. Triebenfeld'

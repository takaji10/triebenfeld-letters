- page: 1
  en: '273 Your Serene Highness''s letter of the 7th of this month I received this very hour. Although
    it is true that I only wrote to Sławięcice the day before yesterday, the contents of your letter are
    so important that I hasten to set certain matters in a clear light which threaten even my honour,
    the more so since in 3 letters received from Your Serene Highness a very cold tone prevails. I therefore
    give myself the honour of answering first the latter point, point by point. — As regards then, 1st,
    Mr General Schüler, he will not involve himself in the business, and that in order not to make enemies
    of the Poles etc. — His last answer was: Should the Emperor ask me, well then I shall see what can
    be done. — Even Count Nesselrode shrugs his shoulders. I have therefore no other help to expect in
    this matter than through the State Chancellor and through Mr Minister Humboldt. I have asked Your
    Serene Highness for 2 French blank forms, in order, if the Prince so commands, to write to the Emperor
    once more. Mr Court Councillor Barbe will draw it up; he advises, however, that the Prince''s commands
    be punctually complied with. As regards, 2nd, the error concerning the yield of the estates, this
    — as I have already written to Mr Court Councillor Hahn — will probably have no further consequences
    than that it marks an ugly contradiction, of which neither the Court Councillor nor I am guilty. Your
    Serene Highness yourself gives me the revenues as 79000 rt — this I took in the first submission as
    the standard — but the officials now put them down as low as 36000 rt — and I should have much preferred
    not to have had this extract appended to the record, because the difference is too striking. That
    for the rest the officials have either reported incorrectly or managed badly can only be the case.
    — I am entirely reassured by Mr Court Councillor Hahn''s statements, all of which lie before His Serene
    Highness the State Chancellor from A to Z. He gives the value of the estates as 2 millions and their
    yield as 60/m rt, which in better times would have to turn out much higher. Since indeed the Privy'

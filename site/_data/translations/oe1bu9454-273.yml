- page: 2
  en: 'Councillor of State von Stägemann himself holds him to be an expert man, no further disadvantage
    is to be feared. — That I should have liked to see Your Serene Highness''s statement of the revenues
    of 79/m rt. substantiated in the record at least by 70/m, is surely not to be blamed. Given the distance
    and the snail-like progress of the posts, I could not know that Mr Court Councillor Hahn had already
    departed for Brzeg, for otherwise I should not have written at that time at all. — I am content, and
    am all too glad to be convinced, that the estates have funds enough to discharge the 112/m rt in 5
    or 6 years — and thus I fall respectfully silent upon this passage, the more so as the oft-mentioned
    error will now never be of any consequence and everything has already been forestalled. — It does,
    however, strike me as remarkable why so much fuss is made of this matter. Did I report the revenues?
    — are they trying to make a beast of burden of me, that I am to bear the blame for it; did I know
    the yield of the estates? Your Serene Highness gave it to me so. — Your word was sacred to me; upon
    this foundation I raised the building. — Had I shown Hahn at that time Your Serene Highness''s statement,
    he would perhaps have refuted it, and he, as a straightforward man and as a faithful [uncertain: follower]
    of Your [text lost] would certainly have advised me faithfully and truly. In short, neither he nor
    I is at fault for the said error, between which, however, neither I nor Court Councillor Hahn wishes
    to be left exposed. As regards the advance of the 112/m rt., it will be granted. — Unless all are
    lying — then I have, willy-nilly, lain along with them — only this no one can lie about or say of
    me, that I wished to settle the matter with the Courland heirs in secret without the knowledge of
    the mandatories. It is outrageous to me that for all my exertions I should now further


    be taken for a filon or a total blockhead.


    At bottom I do not know whether it were so great an honour to boast of such a compromise; I have therefore
    advised that the King himself should never have done this, but that Your Serene Highness should be
    furnished with the advance of 112/m rt. for the purpose'

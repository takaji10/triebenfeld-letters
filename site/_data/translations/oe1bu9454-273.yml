- page: 3
  en: I had to lay down my pen. — Your Serene Highness has hurt me very much by this letter; I believe
    I have now had occasion to read into your heart, and what I may promise myself of the future. Unjust
    suspicion brands the best of men, and still more, too often, the best of friends. — Reproach and humiliation
    can drive him to fury. Your Serene Highness appears to wish to burden me with it — this I cannot and
    am not able to bear. You have moreover let this be made known to me through a stranger's hand — this
    is against my sense of honour and humiliates me too much. I have said and done nothing but what stands
    in the rules given and sent to me. I have exerted everything to bring the affair to the desired goal.
    Much has already succeeded, and the rest would have been achieved too; that His Serene Highness the
    Prince State Chancellor lays everything aside and does not answer at once what I submit, for that
    I cannot be held to account. — I hardly see him even once, which fate thousands share with me; it
    has been enough for me hitherto that everything Barbe hands to him in Your Serene Highness's affairs
    he has received with goodwill and gracious assurances, and has at once passed it on in writing to
    the reporting official. The funds said to lie in readiness, which I mentioned in my submissions, are
    named for this reason, that one should form a good idea of the value of the entailed estate's properties.
    This, however, leads to nothing and is a figure of speech. — Meanwhile they are often mentioned in
    the pieces only handed in. — Yet I never intended that any other than the lawful use should be made
    of them, which was that your creditors should draw the 54500 Rthl, or whatever it amounts to, in accordance
    with your instruction. Still less did I intend to impair F. August's 100000 Rthl or his quiet life.
    Whether for the rest the settlements and codicils will be permitted to stand I do not know. — Your
    Serene Highness appears not to have noticed that I have not censured the same in any of my submissions
    since the first.

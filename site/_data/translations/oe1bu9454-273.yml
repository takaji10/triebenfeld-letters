- page: 2
  en: 'Councillor of State von Stägemann himself holds him to be an expert man, no further disadvantage
    is to be feared. — That I should gladly have seen Your Serene Highness''s statement of the revenue
    of 79000 Rthl supported in the record by at least 70000 is surely not to be censured. Given the distance
    and the tavern-like course of the posts I could not know that Mr. Court Councillor Stahn had already
    departed for Brieg, for otherwise I should not have written at that time at all. I am content, and
    am only too gladly convinced that the estates have funds enough to discharge the 112000 Rthl in 5
    or 6 years — and so I fall reverently silent upon this passage, the more so as the aforementioned
    [uncertain: error] will now never have consequences and everything has already been forestalled. It
    does however strike me as remarkable why so much fuss is made over this matter. Did I state the revenues?
    — One would make a beast of burden of me, that I am to bear the blame for it; did I know the yield
    of the estates? Your Serene Highness gave it to me thus — your word was sacred to me, upon this foundation
    I raised the building. — Had I shown Hahn Your Serene Highness''s statement at that time, he would
    perhaps have refuted it, and he would, as an upright man and as a faithful [uncertain: beginner],
    certainly have advised me faithfully and truly. In short, neither he nor I am at fault in the said
    error, in which meanwhile I, no more than Court Councillor Hahn, wish to be left exposed. As concerns
    the advance of the 112000 Rthl, it will be given, unless all of it be lies — thus I have lain with
    it from grace to grace — only this no one can lie about or impute to me, that I meant to settle the
    affair with the Courland heirs in secret without the knowledge of the mandatories. It is outrageous
    to me that for all my exertions I am now taken besides


    for a rogue or a total blockhead.


    At bottom I do not know whether it were so great an honour to boast of such a settlement; I have therefore
    advised that the King himself should never have done this, but rather that Your Serene Highness should
    have the advance of the 11th of this month furnished for the purpose.'

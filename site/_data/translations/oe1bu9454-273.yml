- page: 3
  en: 'I had to lay down the pen. — Your Serene Highness has done me great [uncertain: injury] by this
    letter. — I believe I have now had occasion to read into your heart, and to see what I may promise
    myself of the future. Unjust suspicion brands the best of men, and still more, too often the best
    of friends. — Reproach and humiliation can drive him to fury. Your Serene Highness appears to wish
    to burden me with these — this I neither can nor am able to bear. You cause it moreover to be made
    known to me through a stranger''s hand — this is against my sense of honour and humiliates me too
    greatly. — I have said and done nothing but what stands in the papers given and sent to me. — I have
    exerted everything to bring the matter to the desired goal. — Much has already succeeded, and the
    rest would have been attained as well. — That His Serene Highness the Prince State Chancellor does
    not lay everything else aside and does not answer at once what I submit, for that I cannot be held
    responsible. — I see him scarcely once a month, which fate thousands share with me. — It has sufficed
    me hitherto that everything which Barbe hands to him in Your Serene Highness''s affairs he has received
    with goodwill and gracious assurances, and has straightway assigned it to the referee. The funds said
    to lie in readiness, which I mentioned in my submissions, are named for the reason that one should
    form a good idea of the value of the entailed estates. This leads, however, to nothing and is a mere
    turn of phrase. — Meanwhile they are often mentioned in the papers merely given. — Yet I never meant
    that any other than the lawful use should be made of them, which was that your creditors should draw
    the 54500 rt, or whatever the sum is, pursuant to your instruction. Still less did I mean to curtail
    Prince August''s 100000 rt. or his quiet life. — Whether, for the rest, the settlements and codicils
    will be allowed to stand, I do not know. — Your Serene Highness appears not to have noticed that I
    have no longer censured them in any of my submissions since the first'

status: draft
segments:
- page: 1
  en: 'All the peasants of the village of the Łazińsk

    Hollanders have the right:

    1) to graze all their [uncertain: paleny] cattle

    in the forest "Studzianki";

    2) to gather in the same forest

    twice a week fallen wood'
- page: 2
  en: 'consisting of lying wood

    and dry branches; to carry

    what is gathered away [uncertain: by tlakhty].

    The peasants have no other

    rights to servitudes

    whatever.

    —o—

    Russian entry after 1875:

    Morgen 1655, rods 63

    farmers 94

    —o—

    Year from 1901: 1,660 Morgen 271 rods,

    91 farmers.

    Year 1906: 2,044 Morgen 181 rods,

    91 old farmers - 21 new farmers

    with 112 Morgen.'
- page: 3
  en: 'Year 1907: 91 old farmers

    and 21 new farmers

    Year 1914: 137 farmers,

    with 2,037 Morgen.'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! My illness has ceased; only the great weakness
    does not permit me to undertake long journeys. The physician forbids exposing oneself to the weather
    at once, wherefore I must yet keep quarantine for some few days. In this regard I shall await the
    return of this messenger. My estate affairs in Kohlen I have arranged — there remain to us just 62000
    Rthl over — Schenck has leased out the estates to a Jew in a [uncertain: reading; "sendenhaft"] and
    bad manner — yet I now obtain, by turning matters otherwise, so much that I shall be able to travel
    and to meet the manifold costs; 500 Rthl will [be paid?] to me now, and with that I go to Betsche
    and from there to Berlin. The Emperor Alexander does not come to Berlin until the end of April, concerning
    which, however, I still expect detailed information shortly from p. Beidlung. In Betsche my first
    business will be to come to an agreement with Leixner in Miedzeritz, and to see that I bring the receipt
    that has been found into validity — Should that succeed, then I shall have the debt struck out in
    the mortgage book, and seek out the profit which is to be drawn from Betechen. The burghers and peasants
    have declared themselves insolvent and press for the annulment of the contract — they prove the laesio,
    that they are injured beyond the half, since the estates were valued at only 64000 Rthl. I prove that
    even the highest provincial authority examined everything and approved Your Serene Highness''s proposal;
    since, moreover, the O H Zerboni desires the annulment of the contract, I shall consent to it, yet
    reserving only quaevis competentia. That is to say: he — the burghers and peasants — forfeit the earnest-money
    they have given. 2. They must at once pay the arrears of canon and competence with about 2000, so
    that the sequestration ceases forthwith. 3. They must at once discharge to Your Serene Highness the
    arrears of canon with 11000 Rthl. 4. They must declare how they mean to pay off the arrears of interest.
    NB: this interest was formerly demanded by the State, but now that will fall into the breach, if it
    be proved that the sum of respectively 137000 Rthl entered upon Betsche has been improperly reckoned
    as Bayonne sums, but rather that it is the pure private property of Your Serene Highness. What is
    to be gained from this, I shall be attentive to. 5. The communities must themselves turn their weapons
    against Eichauf and his confederates.'
- page: 2
  en: 'According to my reckoning there would then remain to Your Serene Highness: 1. the interest on about
    68000 Rthl; 2. the arrears of canon of 11000; 3. the 28000 Rthl paid down by the peasants in 1805;
    4. what can be wrested from [uncertain: Eichauf] and his confederates, with 20000 Rthl. Thus Your
    Serene Highness would have from Betschen in all 127000 Rthl. NB: the 28000 Rthl Your Serene Highness
    already has, so there would still remain to be received 99000 Rthl. Now it depends upon what Betsche
    is still worth; the forest is totally devastated. At 64000 Rthl it was valued — queritur, will it
    be worth 72000 Rthl. Also, how will it stand with the other 65000 Rthl entered upon it? They do indeed
    stand in the receipt as well, but I do not yet know whether I shall be able to move Leixner to accept
    these too. Were that to succeed, and Leixner to take this sum upon Kulm and Kaemen, then all would
    be helped — Your Serene Highness would have to receive, as said before, 99000 Rthl. Of the estates
    themselves I [uncertain: reckon] the 72000; out of the remainder, with about 20000, Lombardini, H
    H Hahn and the good Bally would be paid. Everything, however, depends upon my succeeding with Leixner.
    The man is now dirt-poor; I must support him and give him money for the outlay of costs of his business.
    The [uncertain: Ober-Präsident] Zerboni is charged from higher quarters to sustain him; Kaemen is
    to remain to him. — I insist meanwhile that the sum of 72 and 65000 Rthl entered upon Betsche belongs
    not upon Betsche but upon Kaemen, according to the receipt of Meyer Bernhard. God grant me further
    good fortune — but may Your Serene Highness deign to write to me whether this has Your entire approval.
    The indemnification business, which has come to a standstill through the [uncertain: méchante] delay,
    will nevertheless turn out very well. It is being worked diplomatically, and the Minister von Humboldt
    has great need of me now. Trzcinski is here again. It is not this one but the Major Trzcinski who
    has been suffocated — He was with me the day before yesterday and begged for forbearance until St.
    John''s day, when he receives 25000 Rthl for an estate he has sold — Litigate I cannot, that costs
    money; I have granted him such, but assured him that I shall lay arrest not only upon the purchase
    moneys but upon all revenues. From Schenck I [uncertain: see] and hear nothing — He wants to have
    a general power of attorney all for himself — May Your Serene Highness deign to send me a letter'
- page: 3
  en: 'such as I requested in my last, so that I may be rid of him. With Zerboni he has fallen out, I
    know not for what reasons — The [uncertain: Üb P] also wrote lately to the Landrath v Kurnatowski,
    that he, together with the Chief Forester Kräger and with the Privy Councillor von Triebenfeld, should
    for the present investigate the forest devastations in Betschen, so that one may see clearly. Schenck
    is offended at this, that the Government merely answered him that his submission could not be understood.
    He wishes, if he receives a general power of attorney and 500 Rthl together with free [uncertain:
    defraying of expenses], to go to Posen and to work upon the matter — It will be hard for me to raise
    10 Rthl; I have therefore given him no decision upon it, and at bottom I do not need him — My tenant''s
    brother is house-factor and favourite of Zerboni, through whose hands pass all the offerings that
    are brought. Had Your Serene Highness been able to [uncertain: send] me a [uncertain: Frisling] for
    7 [uncertain: bowls], it would have been of use. My tenant goes with me to Posen — He himself stands
    in very close liaison with H. Z. on account of deliveries — and will render [uncertain: only] services.
    As soon as I receive Your Serene Highness''s answer I travel to [uncertain: Bonn] and Betsche. Full
    of reverence I remain, until death, Your Serene Highness''s — The messenger receives 3 gg Courant
    per mile; 1 Rthl I have given him here; may Your Serene Highness deign to have the remainder paid
    out to him there. Blizanow, the 16th of January 1816. most humble and obedient servant v Triebenfeld'

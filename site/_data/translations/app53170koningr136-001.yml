- page: 1
  en: 'Judicial site inspection conducted in Trąbczyn and its adjacent appurtenances, namely in Nowa Wieś,
    Osiny, Łazy, and the olędry, of manorial buildings and likewise village ones, on 9 July in the year
    of the Lord 1754.


    [Translator''s note: Wizja as judicial site inspection. Rule 17 translates wizja as ''judicial site
    inspection'' throughout. In this document the term covers two distinct uses: (1) the building and
    estate survey forming Section 1, which is an administrative inventory conducted at the instance of
    the widowed proprietress rather than a court-ordered boundary inspection in the sense of the 1776
    proceedings; and (2) the forest inspection forming Section 3, formally witnessed, signed, and registered
    at the municipal court three days later. Both are translated as ''judicial site inspection'' per Rule
    17; the different character of Section 1 is noted here.]


    The old manor in Trąbczyn is thoroughly bad — both walls and roof with everything — which can by no
    means be repaired.


    The new manor, of hewn log construction, finished — the roof on one side laid in part, that is, with
    roof tiles, the remainder lightly strewn with bundles of thatch — two small rooms finished, though
    not entirely; one chimney carried to the top; frames ready for all windows; and casings for such doors.


    [Translator''s note: ''Hewn log construction.'' Z rąb, genitive plural of rąb (a hewn or notched log;
    squared timber). A log-frame technique using hewn timbers rather than sawn planks or earthen infill.
    Distinct from framed construction (w wiązaniu) and daub construction (w lepianką) used elsewhere in
    this survey.]


    [Translator''s note: ''Lightly strewn with bundles of thatch.'' Snopkami posproszy, past passive participle
    from prószyć (to strew or scatter thinly), with po- prefix. The grammatical agreement with reszta
    (the remainder, feminine) is irregular in the source. The sense is a roof surface loosely covered
    with straw bundles — a temporary or provisional covering — as opposed to the properly laid tiles on
    the other side.]


    [Translator''s note: ''Casings for such doors.'' Futra takiej drzwi. Futro (a door or window casing;
    the wooden surround fitted to a prepared opening). Takiej drzwi is a scribal case variant of takich
    drzwi (of such doors). The passage lists ramy (frames) for windows and futra (casings) for doors as
    the items ready for fitting — both implying the openings are prepared but not yet hung or glazed.]


    The kitchen at this manor, of hewn log construction, complete in every respect, of two rooms and a
    pantry with sawhorses, but not boarded nor thatched.


    [Translator''s note: ''Sawhorses.'' Z kozłami. Kozły (sawhorses, trestles, or roof trusses) in a building
    context; here possibly referring to roof trusses or construction supports.]


    The barns are [away] from the new manor, in the farmyard.


    [Translator''s note: ''[Away].'' Poge is an unresolved reading in the source transcription. The most
    contextually plausible sense is ''away from'' or ''at some distance from,'' locating the barn complex
    away from the manor house proper. The manuscript requires re-examination.]


    [Translator''s note: Farmyard. Gumno (the threshing yard or farmyard; the enclosed service yard of
    a noble estate comprising the barn complex, threshing floors, and related agricultural outbuildings).
    Distinct from the manor house precinct.]


    Barn on the left, of one threshing floor, of split planks into posts, newly built, with both gates.


    The second barn in the first corner, good as new, built in framed construction by a carpenter, of
    small sawn planks, [fitted], with double gates and a wicket gate on one side; in the middle, covered
    from below with three courses of shingles.


    [Translator''s note: ''[Fitted].'' Pirzona (second barn) and pierzona (sheepfold) are the same or
    near-identical word appearing twice. No confident reconstruction has been established; the word likely
    denotes some finishing treatment, lining, or fitting of the plank cladding. Translated tentatively
    as ''[fitted]'' in both occurrences. The manuscript requires re-examination.]


    [Translator''s note: Shingles. Szkudła (singular szkudła), from German Schindel: thin wooden roofing
    tiles. Szarami is rendered as ''courses'' — probably from German Schar (a row or course of roofing
    material), denoting horizontal layers in which shingles are laid. The term szary in this sense is
    not attested in standard Polish dictionaries and may be a regional or trade term.]


    The third barn in the second corner of the same, of split planks into posts, built of one threshing
    floor — [the walls of which] are collapsing to the ground, only that they are propped.


    The fourth, likewise also collapsing to the ground.


    [Translator''s note: ''The fourth, likewise also collapsing to the ground.'' Czwarta tukasz i tyta
    także upadająca na ziemię. The words tukasz i tyta are unresolved in the source. The most plausible
    reading is tudzież i ta (likewise and that one also), producing ''the fourth, likewise that one also
    collapsing.'' The translation follows this reading. The manuscript requires re-examination.]


    The sheepfold at these barns, large, built from the top in framed daub construction, from below with
    small sawn planks, [fitted] in every respect, with [new] gates, good, [moss-covered], covered with
    courses of shingles from below; and both gables fastened with boards.


    [Translator''s note: Daub. Lepianka (wattle-and-daub or earthen-infill construction; from lepić, to
    mould or plaster). Lepianka pruska (Prussian daub; pruska roboty, of Prussian construction) denotes
    a half-timber or Fachwerk technique using a timber frame with clay infill, common in Greater Poland
    in this period. In the Owczarnia (sheepfold) passage, the upper section is framed daub (w wiązaniej
    lepianką) and the lower section is clad with small sawn planks.]


    [Translator''s note: ''[Fitted].'' Pirzona (second barn) and pierzona (sheepfold) are the same or
    near-identical word appearing twice. No confident reconstruction has been established; the word likely
    denotes some finishing treatment, lining, or fitting of the plank cladding. Translated tentatively
    as ''[fitted]'' in both occurrences. The manuscript requires re-examination.]


    [Translator''s note: ''[New] gates.'' W notami fortkami. Fortkami is instrumental plural of fortka
    (wicket gate; a small gate): the reading is clear. Notami is uncertain — possibly a misread of nowymi
    (new, instrumental plural), giving ''with new gates.'' The preposition w may also be a misread of
    z (with). Translated tentatively as ''[new] gates.'']


    [Translator''s note: ''[Moss-covered].'' Om~a: a contracted form, the tilde indicating a suspension.
    The most likely expansion is omszała or omszona (moss-covered; weathered with age). Translated tentatively;
    the manuscript requires re-examination.]


    The granary between these barns — small, of two storeys, old, in daub construction, in which the sill
    beams are rotted, the walls pushed out, and indeed thoroughly bad.


    Outbuildings. The carriage house for carriages, of split planks into posts, built, old.


    [Translator''s note: ''Outbuildings.'' Chlewy (pigsties; also used loosely as a generic term for farm
    outbuildings) appears to function here as a section heading introducing the series of service buildings
    that follows — the carriage house, pig sties, cowshed, stables, and pen. The specific pig sties (Świńskie
    chlewy) behind the carriage house are then identified separately in the next entry.]


    Behind that carriage house, pig sties of planks into posts, old.


    A cowshed for cattle behind those pigsties, of split planks into posts, built, of old construction.


    Guest stables at the carriage house, of planks into posts, built, walls leaning toward the garden,
    old.


    [Translator''s note: ''Walls leaning toward the garden.'' Pohilone ściany ku ogrodowi. Pohilone =
    pochylone (leaning, tilted), with h for ch and i for y, consistent with this hand. The garden-facing
    walls of the guest stables are structurally compromised.]


    A second small stable for the lord''s carriage horses, of posts and split planks, built, old.


    Stables for draught-team horses, of split planks into posts, built, of old construction, thatched
    with bundles; and other buildings above.


    [Translator''s note: Draught-team horses. Konie cugowe, from cug (German Zug: a carriage team or draught
    team). Distinguished in the survey from konie wozowe (the lord''s personal carriage horses) in the
    preceding entry. The two stables serve animals of different function and rank.]


    [Translator''s note: ''Other buildings above.'' I insze budynki wyże: a summary phrase indicating
    further structures enumerated in the preceding text. The passage closes the outbuilding inventory.]


    A pen for pigs, of split plank, not large, covered with two courses of shingles.


    [Translator''s note: ''Pen for pigs.'' Kup dla ruczenia wieprzy. Kup (pen, sty). Ruczenia is uncertain
    — possibly dialectal from rucić (to cast or throw) or from ruch (movement, roaming). Translated as
    ''for pigs'' as a working rendering; the structure houses boars (wieprze) for fattening or keeping.]


    The distillery for [-----] vodka: a room of sawn planks; the vestibule in Prussian daub construction;
    a storeroom next to the vestibule of small sawn planks, with a door from outside; a second storeroom
    behind the room likewise of small sawn planks, with a door from the room and a second from outside
    — the entire building good, covered with shingles. In this distillery: still-pots — one larger, one
    smaller — with covers, good pipes, condenser fittings, mash tubs, a barrel for a distillation run,
    buckets, old ladles.


    [Translator''s note: [-----]. Palonia remains unresolved in the source. Two readings have been proposed:
    (1) palona (heated, fired), describing the still-room as the fired or heated space of the distillery;
    (2) a qualifier of wódki (vodka), possibly indicating a specific type such as Polish-style vodka.
    Neither has been confirmed from the manuscript. Left untranslated pending resolution.]


    [Translator''s note: Prussian daub. See note [^12].]


    [Translator''s note: Still-pots. Garce (singular garc: a vessel or pot used in the distilling apparatus,
    probably from German Gar or a related term). The number in the source (do [20.?]) is uncertain in
    the manuscript; it may read as ''two'' (dwa) or as a capacity or count figure. The two pots described
    — one larger, one smaller — may be the garc vessels themselves.]


    [Translator''s note: Condenser fittings. Rurnicami: a technical term for components of the distilling
    condenser or pipe fittings. The exact meaning is uncertain; possibly from rurnik (one who works with
    pipes or condenser tubes).]


    [Translator''s note: Mash tubs. Kłodami do zacieru. Zacier is the mash — the mixture of grain and
    water fermented in the initial stage of vodka or beer production. Kłody are large wooden tubs or containers.]


    [Translator''s note: Distillation run. Do [??]gru: the word following do is incompletely legible in
    the manuscript. Przegon (a single pass of liquid through the still; a distillation run) is the most
    plausible candidate, giving ''a barrel for the distillation run.'' Translated tentatively.]


    [Translator''s note: Ladles. Wybirkami: small scooping or ladling vessels, from wybierać (to scoop
    out; to ladle). Distinct from wybirki (selection remnants) in Section 3 — same root, different nominal
    form and meaning.]'
- page: 2
  en: 'The malthouse, large — not very: one room of log construction, old, sill beams dragged beneath
    it; the vestibule for brewing beer, of daub construction; in this vestibule a lower drying kiln, good,
    with a brick-built oven; behind this drying kiln there is a room of log construction, unfinished in
    every respect; from this room, two storerooms with one door from the room, from one to the other;
    from this vestibule, a door to the vault for storing beer; behind this vault, a storeroom for storage;
    from this vestibule, stairs upward above the room, from the gates — on which grain storage is made.
    On the second half of the malthouse, unfinished — no ceiling boards, doors, or windows; a clay-built
    chimney; in this chimney a small kettle holding three barrels of water, old, patched; vats, sufficiently
    good; one trivet; twenty barrels; and other vessels needed for the malthouse — the entire building
    recently covered with shingles, both gables fastened with boards.


    [Translator''s note: Malthouse. Mielcuch: a combined malthouse and brewery for producing malt and
    beer. A standard feature of larger Polish noble estates in this period.]


    [Translator''s note: Ceiling boards. Posowy: a technical term for the planks forming the ceiling or
    loft floor of a building, dividing an upper grain storage area from the rooms below. The unfinished
    half of the malthouse lacks these.]


    [Translator''s note: ''Sufficiently good.'' Kadzie z[?] dobre. The word following z is unclear in
    the manuscript; dość (sufficiently) or zdatne (serviceable) are the most plausible candidates.]


    [Translator''s note: Trivet. Trybusek, from German Dreibuss: a three-legged stand placed over a fire
    for supporting cooking or distilling vessels.]


    [The description of the village houses, one by one, which follows here on the rest of leaf 121 verso,
    on leaf 122 and at the top of leaf 122 verso, is not transcribed.]'
- page: 3
  en: '[Section 2 — Tenant Enumeration]


    Village of Nowa Wieś:


    Fifteen olędry; the sixteenth plot empty. Some have built well, whereas others have only earth dugouts.


    [Translator''s note: ''Plot.'' Huba, from German Hufe: the standard unit of land allocated to each
    olęder settler family. The ''sixteenth plot'' (szesnasta huba) is vacant — one of the sixteen expected
    settler holdings is unoccupied.]


    Enumeration of dependent people in Trąbczyn:


    [Translator''s note: Dependent people. Ludzie zaciężni: persons tied to the estate by obligation —
    serfs or bound tenants. The enumeration lists them by category in descending social and economic order.]


    Full farmers: 4. Each of them has — working cattle: 8 of the lord''s; oxen: 4; horses: 4; cows: 2;
    wagons: 2; pigs; ironware — all as is proper — and sowings both: winter grain and spring grain.


    [Translator''s note: Full farmers. Kmiecie (singular kmieć): the highest category of dependent peasant,
    holding a full farm unit and obligated to provide full labour services with a complete draught team.]


    Half-farmers: 5. Each of them has — working cattle of the lord''s: 4; a cow; a pig; an ox; ironware
    — all as is proper — and sowings both.


    [Translator''s note: Half-farmers. Półrolnicy (singular półrolnik): dependent peasants holding a half
    farm unit, with correspondingly reduced draught teams and labour obligations.]


    Cottagers: 7. These have no lord''s cattle.


    [Translator''s note: Cottagers. Chałupnicy (singular chałupnik): dependent peasants holding only a
    cottage and garden, with no arable land allocation and reduced labour obligations.]


    Female lodgers: in all, 8.


    [Translator''s note: Lodgers. Komornicy / komornice (singular komornik / komornica): the most dependent
    category of rural resident, holding neither land nor a full cottage, typically lodging with another
    household. This use of komornik is entirely distinct from komornik graniczny (Boundary Surveyor) throughout
    the main project documents.]


    In Osiny:


    Full farmer: 1 — has all as the Trąbczyn [full farmer].


    Half-farmers: 2 — have as the Trąbczyńskis.


    Cottagers: 2.


    Female lodgers: 3.


    In Łazy:


    Full farmer: 1 — has a team as the others.


    Cottagers: 3.


    In Nowa Wieś:


    Half-farmers: 2 — one has all the cattle; the other has for work only 3.


    Cottagers: 2.


    Lodger: 1.


    Cottages in which people live — that is, [free] peasants — but these do not perform labour obligations
    nor do they have the lord''s cattle.


    [Translator''s note: Cottages. Chatew: a regional or period genitive plural form of chata (a simple
    peasant cottage or dwelling). The word governs w których mieszkają ludzie (''in which people live'');
    który in the source is a scribal case slip for których.]


    [Translator''s note: ''[Free] peasants.'' Chłopów (genitive plural of chłop): peasants who, notably,
    owe no labour obligations and hold no lord''s cattle — indicating a distinct contractual or personal
    status from the bound tenants enumerated above. The word ''free'' is supplied in brackets as an interpretive
    clarification; the source has only chłopów.]


    [Translator''s note: Labour obligations. Robota: obligatory serf labour owed by dependent peasants
    to the estate lord, typically measured as a set number of days of field work per week. The formulaic
    phrase nie robią (''they do not work'') signals exemption from this obligation.]'
- page: 4
  en: '[Section 3 — Forest Testimony]


    The undersigned testify, together with the Court Summoner Bartłomiej, having been at the judicial
    site inspection of the Trąbczyn pine forests stretching from Osiny along the Drzewce boundaries —
    that we saw: that the pines, the better and finer ones, and most especially past the boundary post
    and at the approach of the thickets known as [-----], the larger half has been felled as far as Łomów.
    From Łomów, the finer pines have been selectively taken all the way to the Biskupice boundaries; and
    from the Biskupice boundaries — both before czarny bród and beyond the ford, above Szetlewek toward
    Łazy — only selection remnants stand, from which nothing can be chosen for building. And likewise
    past Łazy and Osiny, between the Huta, where the finest timber was — there too, felled, only selection
    remnants stand. Likewise the oaks standing in the woodlands — to this day only selection remnants
    stand — only because the olędry took [the timber] from the plots long since allocated to each of them,
    where the finer timber was. In witness and confirmation of this we sign with our own hands. Done in
    Trąbczyn on 9 July in the year of the Lord 1754.


    [Translator''s note: ''At the approach of the thickets.'' Przy przychodu kniejów: przychód (approach,
    entry-point); knieje (thickets; dense sections of woodland). The preposition nimo (past, alongside
    — a variant of mimo) governs both słupa (the boundary post) and przychodu kniejów (the approach of
    the thickets), reading: ''past the boundary post and past the approach of the thickets.'']


    [Translator''s note: [-----]. The name or descriptor of the thickets (nazywających się — ''known as
    [X]'') appears to be absent or illegible in the manuscript at this point.]


    [Translator''s note: ''Selectively taken.'' Poprzebierane: past passive participle of przebierać (to
    pick through; to select the best and leave the rest). The word describes selective logging — the finest
    trees removed, the lesser ones left.]


    [Translator''s note: Selection remnants. Wybirki: from wybierać (to select, to pick out). Trees or
    timber remaining after selective felling — those not considered worth taking. The word appears three
    times in the forest testimony. See also note [^26]: the same verbal root yields wybirkami (ladles)
    in Section 1, a different nominal form with a different meaning.]


    [Translator''s note: Huta. The glassworks on the Trąbczyn estate. A glassworks (huta szklana) consumed
    large quantities of timber as fuel and raw material, explaining its association with the depletion
    of fine forest. The Huta appears in the Latin registration record below as Chuta, with Ch- for H-
    as a Latin orthographic convention. It is also mentioned in the 1776 commission document as the destination
    of timber illegally felled from the Trąbczyn woodlands by the Chełmski predecessors.]


    [Translator''s note: ''Plots.'' Hubami: instrumental plural of huba. The olędry had received specific
    land allocations including wooded portions; they had taken the finest timber from within their own
    allocated plots.]


    Kazimierz Świerczewski, by his own hand


    Józef Puchalski, by his own hand


    [Section 4 — Registration Record]


    In Konin, on Friday, the eve of the Feast of Saint Margaret, Virgin and Martyr, 12 July 1754.


    Before the present records and acts of the Konin Starost''s Municipal Court, appearing in person —
    the General Court Summoner of the Realm, the Honest Bartłomiej Szeptycki [Szepczyński] of Trąbczyn,
    known to the present office, being of sound mind — declared: having with him the Honourables Kasimierz
    Świerczewski and Józef Puchalski — who, although at present absent [from the court], were at the time
    present at the place of the matter described below — at the instance and official requisition of the
    Right Honourable Katarzyna Prusimska of Rozdrażew, surviving widow of the late Right Honourable Paweł
    Prusimski, Sub-chamberlain of His Royal Majesty, not long since deceased — hereditary lady and consort
    of the Trąbczyn estate with its appurtenances, and by the said late husband endowed with life-tenure
    and dower in all his goods — on Tuesday immediately preceding had made a formal descent in person
    to the same Trąbczyn estate first, then to the villages of Osiny, Łazy, Nowa Wieś, the olędry, and
    the Huta belonging to it, then to the pine forests and woodlands pertaining to those same goods; and
    being everywhere throughout those same places in succession, in accordance with the form of law and
    custom, had duly viewed and inspected — to be entered as follows. Which aforesaid matters he attested
    before the said office as having duly viewed and inspected — of which he made and makes this his report
    in the present act.


    [Translator''s note: Szeptycki [Szepczyński]. Bartłomiej is named Szeptycki in this 1754 record and
    Szepczyński in the 1782 document; in the 1776 document he is uczciwy Bartłomi z Trąpczyna (the Honest
    Bartłomiej of Trąbczyn). All three designations refer to the same individual, who served as Court
    Summoner of Trąbczyn across at least the period 1754–1782. The variant spellings are preserved as
    written in their respective documents.]


    [Translator''s note: Life-tenure and dower. Dominae Reformatoriae et advitalitialis (Latin). Reformatoria
    denotes the right of a widow to reform or reclaim her dower on the death of her husband, a standard
    provision of Polish noble inheritance law. Advitalis denotes a life interest or life tenancy in the
    goods. Katarzyna Prusimska thus held both a dower-reform right and a life tenancy in all of Paweł
    Prusimski''s goods.]


    [Translator''s note: Formal descent. Condescenderat (Latin, pluperfect of condescendere): a technical
    legal term denoting the formal act of proceeding to an estate for an official on-site inspection.
    The Tuesday in question was 9 July 1754 — three days before the registration on 12 July 1754 (the
    eve of the Feast of Saint Margaret, Virgin and Martyr).]


    [Translator''s note: ''To be entered as follows.'' Utpote Inseratur (Latin): a formulaic note indicating
    that the content of the inspection — that is, Sections 1–3 above — is to be inserted into the court
    record at this point. The three Polish sections (building survey, tenant enumeration, and forest testimony)
    are thus the material being formally registered by this relatio.]'

- page: 3
  en: 'were capable of such a thing, and this therefore makes it my duty most humbly to beg that my request
    not be left unheard: to charge an impartial commissioner with investigating the value of my estates
    and of the Krotoszyn estates, to draw a balance of the yield of both, and to report the result to
    Your Majesty.


    I should presume most reverentially to propose for this purpose the Minister of State Count von Höym,
    who knows the circumstances most exactly, were it not that it might bear the appearance as though
    he, in justification of his own administration, were speaking in favour of my assertions.


    I leave it to Your Majesty to give this commission to a commissioner whom Your Most High self shall
    think good, and I beg Your Majesty most imploringly and urgently not to deny me the investigation
    and reports I have requested for the rescue of my honour, and most graciously to require the same.
    My intention was chiefly and solely to negotiate a capital upon the Krotoszyn estates, in order to
    pay my debts as soon as possible according to Your Majesty''s will. It would also have given me pleasure,
    since they are not at present distant from my government, to look to their husbandry myself, and in
    this regard I would myself take on a loss as against my own estates, whereas it can be indifferent
    to the State where it has its domains lying, provided only they afford the yield laid down in the
    budget.


    I remain, until death,


    Your Majesty''s. Breslau, the 7th of December 1798.'

- page: 2
  en: 'toszyn that high yield was assumed without foundation, a yield which, as is known to me, was forthwith
    reduced to about 28000 Rthl by the Minister von Voss''s own reports to His Majesty the late King of
    most blessed memory, and in many letters to the Minister von Struensee at the time of the transfer
    of the estates from the Maritime Trading Company to the Chamber of Posen, after several local investigations
    made at that time to himself.


    It therefore remains striking to me how he now speaks of a yield of 49043 r., and thus means to demonstrate
    a loss to the State of 17400 Rthl as against my estates.


    It is grounded in truth that Krotoszyn at present pays 30100 Rthl in rent, and it would be much if,
    given the prevailing prerogatives of the town, which rob the manorial lordship (Dominium) of every
    prospect of improvement, the yield could ever really be brought up to 36000 Rthl. My estates yield,
    after deduction of the old debts paid in by me and still to be discharged, which I have had to guarantee
    merely in order to come into possession, 41500 Rthl, for which I can furnish Your Majesty with warranty
    of title. From this it does after all follow that the advantage is on the State''s side, inasmuch
    as a clear revenue of 11000 Rthl accrues to it. If the Minister von Voss will reckon the yield he
    has stated upon improvements yet to be undertaken, then I believe I can freely maintain against this
    that improvements might take place much sooner in my estates than at Krotoszyn, inasmuch as the number
    of villages and also the extent of the area are much more considerable than in the case of the latter.


    Were, however, the data adduced concerning the value of Krotoszyn throughout grounded in truth, then
    I should have troubled Your Majesty with prejudicial proposals in the exchange offered. But I owe
    it to myself to avoid even the suspicion that I'

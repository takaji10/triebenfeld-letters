- page: 2
  en: 'toszyn that high yield was assumed without ground - a yield which, as is known to me, was straightway,
    by the Minister von Voss''s own reports to the Majesty of the late blessed King, and [as] rumoured
    [uncertain: reported] in many letters in the Minister von Struensee at the time of the transfer of
    the estates from the Maritime Trading Company to the Poznań Chamber, after several local investigations
    made at that time to himself, reduced to about 28/m rt.


    It therefore remains striking to me how he now speaks of a yield of 49043 r., and thus seeks to demonstrate
    a loss to the State of 17400 rt. as against my estates.


    It is founded in truth that Krotoszyn at present pays 30100 rt in rent, and it would be much if, given
    the prevailing prerogatives of the town, which rob the manorial lordship (Dominium) of every prospect
    of improvement, the yield could ever really be brought up to 36000 Rthl. My estates yield, after the
    old debts paid in by me and still to be discharged, which I had to guarantee merely in order to come
    into possession, 41500 rt., for which I can give Your Majesty warranty of title. From this it follows,
    surely, that the advantage is on the side of the State, inasmuch as a clear revenue of 11/m rt. accrues
    to it. If the Minister von Voss will reckon the stated yield upon improvements yet to be undertaken,
    then I believe I may freely maintain against this that improvements are far more likely to take place
    in my estates than at Krotoszyn, inasmuch as the number of villages, and likewise the area of surface,
    are far more considerable than in the former.


    Were, however, the data adduced as to the value of Krotoszyn founded throughout in truth, then I should
    have importuned Your Majesty with prejudicial proposals in the exchange offered. But I owe it to myself
    to avoid even the suspicion that I'

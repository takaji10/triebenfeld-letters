  en: '86


    Most Serene


    etc. etc.


    To Your Majesty I [have] rendered my most humble and most reverent thanks for the gracious sentiments
    expressed toward me in Your Majesty''s most high letter of 4 Dec. Only this one thing troubles me,
    that according to the report rendered by the Minister of State von Voss I appear in a light as though
    I had made to Your Majesty proposals prejudicial to the interest of the State in the exchange, most
    humbly applied for, of my South Prussian estates against the lordship of Krotoszyn; and therefore
    I may expect pardon from Your Majesty''s grace toward me if I permit myself to make the following
    observations against that report.


    I. First[?] I must most humbly state that, when it was disclosed to me by various persons that the
    additional payment of 30000 rt in cash, toward the exchange offered for Krotoszyn and Polajewo, would
    meet with difficulties, because a domain estate may indeed be exchanged but not alienated, I voluntarily
    notified the Minister von Voss that I wished to restrict my request merely to the exchange of my estates
    for Krotoszyn, whereby the alienation of Polajewo would fall away. It would betray little good will
    toward me if the Minister should not have brought this modification of my petition to Your Majesty''s
    notice, as appears to emerge from his letter sent to me and from Your Majesty''s order.


    II. When Your Majesty, upon my most humble petition, charged the said Minister von Voss to examine
    whether the proposed exchange could take place, it was surely the first thing I might expect that
    he would obtain exact intelligence of both of the objects to be exchanged. Of this, however, so little
    was thought that it was not even held worth the trouble to set so much as a pen to it; rather the
    report was rendered upon the one-sided statement of the Councillor of War Nöldichen, and of Kro-'

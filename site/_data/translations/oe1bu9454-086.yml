status: draft
segments:
- page: 1
  en: Most Serene of all etc. etc. To Your Majesty I [would] render my most humble and most reverent thanks
    for the gracious sentiments expressed towards me in Your Majesty's most high letter of the 4th of
    Dec. Only this one thing distresses me, that according to the report submitted by the Minister of
    State von Voss I appear in a light as though I had made to Your Majesty proposals prejudicial to the
    interest of the State in the exchange of my South Prussian estates against the lordship of Krotoszyn
    which I most humbly solicited; and therefore I may expect pardon from Your Majesty's grace towards
    me if I permit myself to make the following observations against that report. First, I must most humbly
    state that, when it was disclosed to me by various persons that the additional payment of 30000 Rthl
    in cash, towards the exchange offered for Krotoszyn and Polajewo, would meet with difficulties, because
    a domain estate may indeed be exchanged but not alienated, I of my own accord notified the Minister
    von Voss that I wished to restrict my application solely to the exchange of my estates for Krotoszyn,
    whereby the alienation of Polajewo would fall away. It would betray little goodwill towards me if
    the Minister should not have reported this modification of my petition to Your Majesty, as appears
    to be evident from his letter sent to me and from Your Majesty's order. II. When Your Majesty, upon
    my most humble petition, charged the said Minister v. Voss to examine whether the proposed exchange
    could take place, it was surely the first thing I might expect, that he would obtain exact information
    concerning both of the objects to be exchanged herein. But so little is this thought of, that it was
    not even held worth the trouble to set a single pen to it for that purpose; rather the report has
    been submitted upon the one-sided statement of the Councillor of War Nöldichen, and of Kro-
- page: 2
  en: '-teszyn that high yield has been assumed without foundation, which yield, as is known to me, was
    forthwith reduced, by the Minister von Voss''s own reports to the Majesty of the late blessed King
    and in many letters to the Minister von Struensee at the time of the transfer of the estates from
    the Seehandlung to the Chamber of Posen, [uncertain: circulated], after several local investigations
    made at that time to himself, down to about 28000 Rthl. It therefore remains striking to me how he
    now speaks of a yield of 49043 r., and thus means to demonstrate a loss to the State of 17400 Rthl
    as against my estates. It is grounded in truth that Krotoszyn at present pays 30100 Rthl of rent,
    and it would be much if, given the prevailing prerogatives of the town, which rob the Dominium of
    all prospects of melioration, the yield could ever be really brought up to 36000 Rthl. My estates
    yield, after the old debts paid in by me and still to be discharged, which I have had to guarantee
    merely in order to come into possession, 41500 Rthl, for which I can furnish Your Majesty eviction-warranty.
    From this it follows, then, that the advantage is on the side of the State, inasmuch as a net revenue
    of 11000 Rthl accrues to it. If the Minister v. Voss will reckon the stated yield upon the meliorations
    still first to be undertaken, then I believe I may freely maintain against this that meliorations
    might take place with my estates far sooner than with Krotoszyn, inasmuch as the number of villages
    and also the extent of area are far more considerable than with those. Were, however, the data adduced
    concerning the value of Krotoszyn founded throughout in truth, then I should have importuned Your
    Majesty with prejudicial proposals in the offered exchange. But I owe it to myself to avoid even the
    suspicion that I'
- page: 3
  en: 'were capable of it; and this therefore makes it my duty most humbly to beg that my petition not
    be left unheard: to charge an impartial Commissarius to investigate the value of my estates and of
    the Krotoszyn estates, to draw up a balance of the yield of both, and to report the result to Your
    Majesty. I should presume most reverently to propose for this the Minister of State Count von Hoym,
    who knows the circumstances most exactly, were it not that it might have the appearance as though
    he, in justification of his own administration, were speaking in support of my assertions. I leave
    it to Your Majesty to give this commission to a Commissarius whom Your Majesty may most highly find
    good, and I beg Your Majesty imploringly and urgently not to refuse me the requested investigation
    and reports, for the saving of my honour, and most graciously to require the same. My intention was
    chiefly and solely to negotiate a capital upon the Krotoszyn estates, in order to pay my debts as
    soon as possible according to Your Majesty''s will. It would also have given me pleasure, since they
    are not at [uncertain: any] time distant from my Government, to see to their husbandry myself, and
    in this regard I would even take a loss as against my own [estates], whereas it can be indifferent
    to the State where it has its domains lying, provided only that they afford the yield according to
    the establishment. I remain, until death, Your Majesty''s Breslau, the 7th of Decbr: 1798.'

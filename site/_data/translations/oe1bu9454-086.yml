- page: 3
  en: 'were capable of it; and this therefore makes it my duty most humbly to beg that my petition be
    not left unheard: "to charge an impartial commissioner with investigating the value of my estates
    and of the Krotoszyn estates, to draw up a balance of the yield of both, and to report the result
    to Your Majesty." I should presume most reverently to propose for this the Minister of the Estates
    Count von Hoym, who knows the circumstances most exactly, were it not that it might have the appearance
    as though he, in justification of his own administration, were speaking in support of my assertions.
    To Your Majesty I leave it to give this charge to a commissioner whom Your Majesty shall most highly
    think good, and I beg Your Majesty imploringly and urgently "not to deny me the requested inquiry
    and reports for the rescue of my honour, and most graciously to require the same." My intention was
    chiefly and solely to negotiate a capital upon the Krotoszyn estates, in order to pay my debts as
    soon as possible according to Your Majesty''s will. It would also have given me pleasure, since they
    are not at the time far removed from my government, to see to their management myself, and in this
    regard I would even take upon myself a loss as against my own estates, whereas it can be indifferent
    to the State where it has its domains situated, provided only that they afford the yield fixed by
    the establishment.


    I remain, until death,


    Your Majesty''s


    Wrocław, 7th Dec: 1798.'

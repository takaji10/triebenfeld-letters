- page: 1
  en: 'Most Serene of All


    p. p.


    To Your Majesty I would render my most humble and most reverential thanks for the gracious sentiments
    expressed towards me in Your Most High letter of the 4th of December. Only this one thing troubles
    me, that according to the report rendered by the Minister of State von Voss I appear in such a light
    as though I had made to Your Majesty proposals prejudicial to the interest of the State in the exchange,
    most humbly solicited by me, of my South Prussian estates against the lordship of Krotoszyn; and therefore
    I may expect pardon from Your Majesty''s grace towards me if I permit myself to make the following
    observations against that report. Firstly, I must most humbly state that when it was disclosed to
    me by various persons that the supplementary payment of 30000 Rthl in cash, added to the exchange
    offered for Krotoszyn and Polajewo, would meet with difficulties, because a domain estate may indeed
    be exchanged but not alienated, I voluntarily notified the Minister von Voss that I wished to restrict
    my petition merely to the exchange of my estates for Krotoszyn, whereby the alienation of Polajewo
    would fall away. It would betray little good will towards me if the Minister should not have reported
    this modification of my request to Your Majesty, as appears to follow from his letter sent to me and
    from Your Majesty''s order.


    II. When Your Majesty, upon my most humble petition, charged the said Minister von Voss with examining
    whether the proposed exchange could take place, it was surely the first thing I might have expected
    that he would obtain exact intelligence of both objects to be exchanged herein. But so little was
    this thought of that it was not even held worth the trouble to set so much as a pen to it; rather
    the report was rendered upon the one-sided statement of the councillor of war Nöldichen, and of Kro-'

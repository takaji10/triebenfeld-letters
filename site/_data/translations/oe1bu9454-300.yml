- page: 2
  en: 'This was at once [text lost] to Prince Radziwiłł, who, exasperated in the highest degree, went
    off immediately with [text lost] his wife followed him, and both [text lost] the King had the Prince
    [text lost] "were indeed of the opinion that the [text lost]


    the said is a new [text lost]"


    Z was forthwith [sent] to Berlin [text lost]


    unknown — It is said Klew[text lost] but the money-men as Stag[text lost] I go cautiously about my
    affairs — [text lost] at Petersburg things are said to look [uncertain: gänztig]. [text lost] the
    Senate is said to have entirely rejected the Polish constitution which the [text lost] fine Cziszewska
    signed — It is said that upon this the Poles declared themselves to the Emperor through a secret deputation,
    that they stand ready to serve him at once with several hundred thousand men and would sacrifice everything
    to uphold the constitution. This is said to have become known there, and now the devil is altogether
    loose. Grand Duke Constantin has gone to Petersburg as if on the wings of the wind [text lost] When
    my messenger sent to Sławięcice can [be back], then I go to Pszczew, and when I am finished there,
    to Berlin, to press the compensation business. In the principal matter I refer to my last letter,
    [text lost] I remain, until death, in deepest reverence


    Your Serene Highness''s


    Blizanow


    2[9?] January 1816


    wholly humble and obedient servant


    v Triebenfeld'

- page: 1
  en: '300


    Most Serene Prince


    Most gracious Prince and Lord!


    [text lost] I receive the news that at Gosztiszyn a [text lost]schlag has been handed in — but no
    letter is [text lost] I shall have it fetched tomorrow and then make the [text lost] use of it — [text
    lost] could be back in Poznań on the 22nd — He was [text lost] to Berlin to be dismissed, or at the
    least soundly [uncertain: gerichtfelt] — the matter was this: the two of them were to submit an opinion
    on the organisation of the Grand Duchy of Poznań — Zerboni [text lost] drew it up with his secretary
    Schmidt and in the end sent it [text lost] to Prince Radziwiłł for his counter-signature — Radziwiłł
    refused the latter, because it was the opposite of what the King himself had said to the Prince and
    had ordered him to do — [text lost] Prince Radziwiłł accordingly sent Zerboni the [uncertain: Prese]
    back with the proper observations — Zerboni, incensed at this, said: The devil is as welcome as the
    Prince — His signature is not needed. I am the governing lord here —'

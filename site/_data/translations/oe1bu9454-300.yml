- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    [text lost] I have the news that at Gosztiszyn a [text lost]valuation has been delivered - but no
    letter is [text lost] I shall have it fetched tomorrow and then make the [text lost] use of it [text
    lost] could be back at Posen on the 22nd - He was [text lost] to Berlin in order to be dismissed,
    or at least to be soundly [uncertain: brought to judgement] — the matter was this — An opinion was
    to be submitted by both of them concerning the organisation of the Grand Duchy of Posen — Zerboni
    threw this together with his secretary Schmidt and in the end sent it to Prince Radziwill for his
    counter-signature; the latter refused, because it was the opposite of what the King himself had said
    to the Prince and had ordered of him.


    Prince Radziwill accordingly sent the papers back to Zerboni with the appropriate remarks - Zerboni,
    indignant at this, said: The devil is as much concerned in it as the aforesaid Prince - His signature
    is not required.


    I am the governing lord here.'

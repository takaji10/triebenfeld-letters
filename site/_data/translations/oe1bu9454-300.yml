- page: 2
  en: 'This was at once [text lost] to Prince Radziwill; irritated in the highest degree, he went at once
    with [text lost] his wife followed him, and both [text lost] the King had the Prince [text lost] indeed
    worked that the [text lost]


    the aforesaid is a new [text lost]


    Z. was at once sent to Stettin


    unknown — It is said Klew[...] but the money-men as [text lost] I proceed cautiously with my affairs
    -[text lost] at Petersburg it is said to look wholly [uncertain: favourable].[text lost] the Senate
    is said to have entirely rejected the Polish constitution, which the [text lost] fair Cziszewska has
    signed. It is said that the Poles thereupon declared themselves to the Emperor through a secret deputation,
    that they stood ready to serve him at once with several hundred thousand men and would sacrifice everything
    in order to uphold the constitution. This is said to have become known there, and now the [uncertain:
    Satan''s brood] is loose. His Grace Constantin has gone to Petersburg as if on the wings of the wind.
    As soon as my messenger sent to Schlawenschitz can return, I shall then go to Betsche, and when I
    am finished there, to [uncertain: Sterbui] to press the indemnification business. In the main matter
    I refer myself to my last letter, and


    I remain, until death, in deepest reverence


    Your Serene Highness''s


    wholly humble and obedient servant


    Blizanow


    2[9?] January 1816'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! [text lost] I have the news that at Gosztiszyn
    a [text lost]valuation has been delivered — but no letter has [text lost] I shall have it fetched
    tomorrow and then make the [text lost] use of it [text lost] could be back at Posen on the 22nd —
    He was [text lost] to Berlin in order to be dismissed or at least to be soundly [uncertain: taken
    to task] — the matter was this: an opinion was to be submitted by both on the organisation of the
    Grand Duchy of Posen — Zerboni threw this together with his secretary Schmidt and sent it at the end
    to Prince Radziwill for co-signature; Radziwill refused the latter, because it was the opposite of
    what the King himself had said to the Prince and had ordered him to do. His [Serene Highness?] Rad:
    accordingly sent Zerboni back the [uncertain: petition] with the proper remarks — Zerboni, incensed
    at this, said: It concerns the devil as much as the said Prince — his signature is not required. I
    am the governing lord here.'
- page: 2
  en: 'This was at once [reported] to Prince Radziwill [text lost] aggrieved in the highest degree, he
    went immediately with [text lost] his consort followed him, and both [text lost] the King had the
    Prince [text lost] indeed effected that the [text lost] the said [person] is a new [text lost] Z.
    was immediately [sent] to Stettin, [destination] unknown — It is said Klew[text lost] but the money-men
    as [text lost] I go cautiously with my affairs — [text lost] at Petersburg it is said to look [uncertain:
    favourable]. [text lost] the Senate is said to have wholly rejected the Polish constitution which
    the [text lost] fair Cziszewska has signed. It is said that the Poles thereupon declared themselves
    to the Emperor through a secret deputation, that they stand at his service forthwith with several
    hundred thousand men and would sacrifice everything to uphold the constitution. This is said to have
    become known there, and now Satan''s mischief is loose. His [Excellency?] Ernst Constantin has gone
    to Petersburg as if on the wings of the wind. When my messenger sent to Schlawaatschitz can return,
    then I go to Betsche, and when I am finished there, to Sterbui, in order to pursue the indemnification
    business. In the principal matter I refer myself to my last letter, wherewith I remain, until death,
    in deepest reverence Your Serene Highness''s wholly humble and obedient servant

    Blizanow, 2[9?] January 1816'

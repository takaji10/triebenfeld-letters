status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness will receive the free-pass
    for Hohenlohe wines at the earliest, and likewise I hope to be able to remit the 25000 Rthl soon.
    The debts which Herr Glenck has had registered against the Zagorow estates stand not upon Swiecia
    and Olesnica alone, but upon all the other localities as well. This again makes the matter more difficult;
    in the meantime I shall be zealously at pains to remove this obstacle also. That Nothardt has died,
    and that Herr v. Goldbeck has come to Kalisz as President, is not good. — Should difficulties nevertheless
    arise which threaten to impede the dismemberment, I hope to attend to them quickly here — for I do
    after all fight always at the side of the foremost commander, where honour is the sole aim of all
    actions. The Herr B. R. Bernhardi has, moreover, properly left me in the lurch with the money — the
    wretched Jew has presumably thwarted the business out of [uncertain: revenge] — instead of money I
    received from Bernhardi an impertinent letter, which in the meantime, as a man of honour, I have'
- page: 2
  en: 'answered quite straightforwardly and stoutly. In the meanwhile I have, fortunately, procured means
    here, so that if the B. should even now send an order to pay, I shall send it back with such seasoning
    as is requisite for a filthy Jew. Of important news I do not yet know much to write, for the day before
    yesterday Herr v. Voss gave a [uncertain: grauung] great fête, and yesterday was the christening of
    the lately born Prince. It is however quite certain that Herr v. V. will shortly withdraw en bon ordre.
    Nothard leaves behind 28000 Rthl of debts, of which his creditors will not receive so many Pfennige.
    In deepest reverence I remain, until death, Your Most Serene Highness''s Berlin, the 7th of January
    1805. faithful, humble and obedient servant v Triebenfeld'

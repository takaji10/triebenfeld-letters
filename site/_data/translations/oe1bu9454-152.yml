  en: '152


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness will receive the free pass for Hohenlohe wines at the earliest, and likewise
    I hope to be able to remit the 25000 rt shortly. The debts which Mr Glenck has had registered against
    the Zagórów estates do not lie upon Swięcia and Oleśnica alone, but upon all the other villages as
    well. This once again makes the matter more difficult; in the meantime I shall be zealously at pains
    to remove this obstacle also. That Nothardt has died, and that Mr von Goldbeck has come to Kalisz
    as President, is not good — should, however, vexations arise which threaten to impede the dismemberment,
    I hope to see to such matters quickly here — for I do indeed always fight at the side of the foremost
    commander, where honour is the sole aim of every action.


    Mr Bernhardi, Councillor of War, has for the rest well and truly left me in the lurch as regards the
    money — the wretched Jew has presumably thwarted the business out of [uncertain: Woche] — instead
    of money I received from Bernhardi an impertinent letter, which in the meanwhile, as a man of honour,
    I have'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness will receive the free pass for Hohenlohe wines at the earliest, and likewise
    I hope to be able to remit the 25000 Rthl shortly. The debts which Mr. Glenck has had registered against
    the Zagorowo estates stand not only upon Swiecia and Olesnica but upon all the other places as well.
    This again makes the matter more difficult; meanwhile I shall strive with zeal to remove this obstacle
    also. That Nothardt has died, and that Mr. von Goldbeck has come to Kalisz as president, is not good
    — should, however, vexations arise which threaten to hinder the dismemberment, I hope to attend to
    them quickly here — for I am after all ever fighting at the side of the first commander, where honour
    is the sole aim of all actions.


    Mr. Bernhardi, Councillor of the Bank [uncertain: B. R.], has for the rest well and truly left me
    in the lurch as regards the money — the wretched Jew has presumably frustrated the matter out of [uncertain:
    Woche] — instead of money I received from Bernhardi an impertinent letter, which meanwhile, as a man
    of honour, I have'

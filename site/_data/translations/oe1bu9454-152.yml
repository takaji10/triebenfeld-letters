- page: 2
  en: 'answered quite straightforwardly and heartily. In the meantime I have fortunately procured means
    here, so that if the B. should even now send an instruction to pay, I shall return it with such seasoning
    as is requisite for a dirty Jew. Of important news I still know little to write, for the day before
    yesterday Mr. von Voss gave a [uncertain: grauung] great fête, and yesterday was the christening of
    the most recently born prince. It is, however, quite certain that Mr. von V. will thus shortly withdraw
    en bon ordre.


    Nothardt leaves behind 28000 Rthl of debts, of which his creditors will not receive so many Pfennig.
    In deepest reverence I remain, until death, Your Most Serene Highness''s


    Berlin, the 7th of January


    1805.


    faithful humble and obedient servant v Triebenfeld'

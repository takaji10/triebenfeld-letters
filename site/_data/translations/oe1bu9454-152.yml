- page: 2
  en: 'answered quite straightforwardly and [uncertain: stoutly]. Meanwhile I have fortunately found counsel
    here, so that if the B. should even now send an instruction to pay, I shall send it back with such
    seasoning as is required for a filthy Jew. Of important news I still know little to write, for the
    day before yesterday Mr von Voss gave a [illegible] great fête, and yesterday was the christening
    of the most recently born prince. It is, however, quite certain that Mr von Voss will shortly withdraw
    [uncertain: er bon ordre].


    Nothard leaves behind 28000 rt of debts, of which his creditors will not receive so many Pfennig.
    In deepest reverence I remain, until death, Your Most Serene Highness''s


    Berlin, the 7th of January


    1805.


    faithful, humble and obedient servant


    v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    The said Trzciński has been approached by the tall Zerboni, to the effect that Trzciński, pursuant
    to a cession, is to pay him 5000 Rthl out of that claim of 10000 Rthl standing to Your Serene Highness,
    which You are said to have made over to Zerboni to that extent — I wished to compel Trzciński to execute
    his declaration before the court, and Zerboni thereby comes into question — For the present I have
    contested this — Should it however be true, may Your Serene Highness be pleased to give me the speediest
    information, so that I do not make myself a laughing-stock.


    One thousand and Trzciński alleges to have already paid out of it, on the instruction of Zerboni,
    to König for the Bischdorff business. I hold this, however, to be a rascally piece of bluster — for
    nothing was ever promised to König for the Beschdorff matter, and it seems to me to be a knavish thievery.
    One thing I fear — whether Your Serene Highness may not have given Zerboni some blank signed paper,
    and the villain has fabricated something of the kind upon it.


    To the prefect at Kalisz, Mr. von Smiedecki, I have quite [uncertain: gewann] he will, in the compensation
    matter, upon which everything now turns on account of Sokolnik, give the most advantageous report
    conceivable.'

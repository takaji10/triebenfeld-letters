status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The said Trzcinski has been approached by the tall Zerboni,
    [demanding] that Trzcinski, pursuant to a cession, should pay him 5000 Rthl out of that claim of 10000
    Rthl due to Your Serene Highness, which you are said to have most highly ceded away to Zerboni — I
    wished to compel Trzcinski to execute his declaration before the court, and thus Zerboni comes into
    the difficulty of it. For the present I have contested this — Should it, however, be true, then may
    Your Serene Highness deign to give me the speediest information, so that I do not make myself a laughing-stock.
    One thousand, and Trzcinski alleges that he has already paid out of it, upon an instruction (Anweisung)
    of Zerboni, to König for the Bischdorff business. I hold this, meanwhile, to be a rascally piece of
    bluster — for nothing was ever promised to König for the Beschdorff affair, and it appears to me to
    be a knavish thievery. One thing I fear — whether Your Serene Highness may not perhaps have given
    Zerboni a blank [signed sheet], and the [uncertain: Bä] scoundrel has fabricated something of the
    kind upon it. To the Prefect at Kalisz, Herr v Smiedecki, I have quite [text lost: verb missing];
    he will, in the indemnification affair, upon which now everything turns on account of Sokolnik, give
    the most conceivably favourable report.'
- page: 2
  en: 'Concerning the Betscher and all other matters, I await answers to the letters sent in the course
    of time to Your Serene Highness. In deepest reverence I remain, until death, Your Serene Highness''s
    [uncertain: Bau] most humble and obedient servant v Triebenfeld. Blizanow, the 27th of January 1816.
    v Triebenfeld'

- page: 2
  en: 'Concerning the Betsche matter and all the others, I await answers to the letters sent to Your Serene
    Highness in the course of time. In deepest reverence I remain, until death, Your Serene Highness''s
    [uncertain: Bau] most humble and obedient servant v. Triebenfeld. Blizanow, the 27th of January 1816.
    v. Triebenfeld'

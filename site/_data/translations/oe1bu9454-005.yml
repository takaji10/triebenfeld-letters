- page: 1
  en: '5


    Most Serene Prince,


    Most gracious Lord!


    Trzciński has been approached by the long Zerboni, [demanding] that Trzciński should pay him, pursuant
    to a cession upon that claim of 10000 r. and 5000 r. belonging to Your Serene Highness, which Your
    Highness is said to have ceded thereof to Zerboni — I wanted to compel Trzciński to execute his declaration
    before the court, and Zerboni is thereby thwarted — For the present I have disputed it — But should
    it be true, may Your Serene Highness deign to give me the swiftest information, so that I do not make
    myself a laughing-stock.


    One thousand and, Trzciński alleges, he has already paid out of it, on Zerboni''s instruction, to
    König for the Biskupice business. I hold this, however, to be a rascally [uncertain: Poellerey] —
    for nothing was ever promised to König for the Biskupice affair, and it seems to me to be a knavish
    thievery. One thing I fear — whether Your Serene Highness may not perhaps have given Zerboni a blank
    signed sheet, and the villain has fabricated something of the sort upon it.


    To the prefect at Kalisz, Mr von Smiedecki, I have quite won him over; he will, in the compensation
    matter, upon which everything now turns on account of Sokolnik, give the most favourable report conceivable.'

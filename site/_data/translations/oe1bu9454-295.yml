- page: 2
  en: 'in order to extort some money from my tenants, and shall then hasten to Berlin. As for what sort
    of a fine answer the Chief Postal [uncertain: Director] von Zerb. gave the Sponten to A. Schmid, Your
    Serene Highness will be pleased to satisfy yourself from the enclosure. According to the assurance
    of the Right Honourable Chief [Councillor] Zerboni, he claims to have sent off his report of opinion
    to the Prince Chancellor; how it reads I do not yet know, but I am to be given sight of it tomorrow.
    In the meantime I doubt the existence of any such report, for how could the whole of the records have
    been remitted to Schenck, when they absolutely had to be attached to the report – the more so as they
    contain the original vouchers within them. On the whole, not much good will shines out of the answer,
    but rather the aforesaid irony; for how could so shrewd and accomplished a man of business direct
    a Schenck to the person of the Russian Emperor, and hand over to him the original records for that
    purpose –? In the meantime Schack received the resolutions a couple of days after the Emperor''s journey
    through Kalisz — by good fortune he was not able to approach the Emperor with them and perhaps spoil
    everything. Oh, how good it would have been had I gone to Paris and there canvassed without waiting
    for the report of the Right Honourable Chief President. For the present there is nothing to be done
    but to await the Prince Chancellor''s return to Berlin and to implore his help — Minister Stein has,
    as the worthy Chief Postal Director E. told me in confidence, been laid entirely on the shelf — Let
    no one [illegible]; the fate of this noble man is indeed very sad. He has after all


    done'

  en: '295


    Most Serene Prince


    Most gracious Prince and Lord!


    On my arrival at Kalisz the other day I learned, to my most deadly dismay, that the Russian Emperor
    had passed through this place the night before and had returned into his own dominions — the chief
    plan of my journey was thus wrecked; nevertheless I continued on my way, so as to lay myself at the
    feet of the Prince Chancellor, upon whom alone everything now depends, and to implore his help — In
    Poznań I met a certain Espagne who is employed here as Chief Post Director, who is highly esteemed
    by the Prince Chancellor and is a bosom friend of Barbe''s. He gave me the sad news — that the Prince
    Chancellor is still in Paris, that he would depart on the 17th, that Barbe was lying there in a nerve-fever
    [uncertain: fire] — that Prince Hard[enberg] would travel by way of Cassel and Frankfurt am Main,
    having much to settle there, and would only come to Berlin in some 3 weeks. These were all most crushing
    tidings, which almost paralysed my senses besides. I am now enquiring here into the Pszczew matter,
    to see whether anything is to be gained by it — the more so as the subjects have already applied for
    the cancellation of the contract. If I soon get light upon the matter here, I shall go once more to
    Blizanow'

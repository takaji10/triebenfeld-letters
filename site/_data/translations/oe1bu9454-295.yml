- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Upon my most recent arrival in Kalisz I learned, to my most deadly dismay, that the Russian Emperor
    had passed through this place the night before and had returned into his own states – the chief plan
    of my journey was thus wrecked; nevertheless I continued on my way, in order to lay myself at the
    feet of the Prince Chancellor, upon whom alone everything now depends, and to implore his help. In
    Posen I met a certain Espagne who is employed here as Chief Postal Director, who is very highly esteemed
    by the Prince Chancellor and is a bosom friend of Barbe. He gave me the sad tidings – that the Prince
    Chancellor is still in Paris, that he would depart on the 17th, that Barbe lay there in a nervous
    fever [uncertain: Brand] – that Prince Hard: would travel by way of Cassel and Frankfurt on the Main,
    having much to settle there, and would come to Berlin only after 3 weeks. These were all most crushing
    pieces of news, which almost paralysed the senses. I am now here looking into the Betsche matter,
    to see whether anything is to be gained by it – the more so as the subjects have already petitioned
    for the annulment of the contract. If I soon obtain light in the matter here, I shall go once more
    to Blizanow'

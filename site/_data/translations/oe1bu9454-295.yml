- page: 2
  en: 'in order to extort some money from my tenant, and then hasten to Berlin — As for what a fine answer
    the Chief President von Zerb[oni] has given to Mr Schenck on the [illegible], Your Serene Highness
    will be pleased to satisfy yourself from the enclosure — According to Mr von Zerboni''s assurance,
    he claims to have sent off his opinion-report to the Prince Chancellor; how it reads I do not yet
    know, but I am to be shown it tomorrow — Meanwhile I doubt the existence of any such report, for how
    could the whole of the files have been remitted to Schenck, when they absolutely had to be appended
    to the report — [uncertain: the more so] as the same contain the original vouchers within them. On
    the whole, not much good will shines out of the answer, but rather the sheer irony, for could a man
    of business who wishes to be thought so shrewd refer a Schenck to the person of the Russian Emperor,
    and hand over the original files to him for that purpose —? Meanwhile Schenck received the resolutions
    a couple of days after the Emperor''s journey through Kalisz — happily he could not present himself
    to the Emperor with them and perhaps spoil everything — Oh, how good it would have been had I gone
    to Paris and acted there without waiting for the Chief President''s report. For the present there
    is nothing to be done but to await the Prince Chancellor''s return to Berlin and to implore his help
    — Minister Stein has, as the upright Chief Post Director C[illegible] told me in confidence, been
    put entirely in the shade — Nobody wants him — the fate of this noble man is indeed most sad. And
    yet he has'

- page: 3
  en: 'much for General Ch — He has sacrificed everything, and now they let him go — I pity him greatly
    — the Prince Chancellor stays away so long for this reason, that he himself must now initiate and
    settle everything alone in Frankfurt on the Main — For the rest, many rumours circulate here which
    will probably never be confirmed. Prince Nadriwile has been summoned by the Emperor to Warsaw, and
    [uncertain: kannz] Biron is coming here; from this people wish to draw many conclusions. Where I shall
    in fact turn, I shall report most humbly to Your Serene Highness before my departure from here; in
    deepest reverence I remain, as Your Most Serene Highness''s


    Posen


    the 17th of November


    1815


    humble and obedient servant, v. Triebenfeld'

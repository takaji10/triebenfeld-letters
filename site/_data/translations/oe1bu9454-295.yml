- page: 3
  en: 'done much for General Ch — He has sacrificed everything, and now he is simply let go — I pity him
    greatly — the Prince Chancellor stays away so long only because he himself must now set in train and
    settle everything alone at Frankfurt am Main — For the rest, many rumours are going about here, which
    will probably never be confirmed. Prince Radziwiłł has been summoned by the Emperor to Warsaw, and
    Prince Biron is coming here; much is being inferred from this. Where I shall actually turn, I shall
    most humbly report to Your Serene Highness before my departure from here. In deepest reverence I remain,
    as Your Most Serene Highness''s


    Poznań


    the 17th of November


    1815


    humble and obedient servant


    v Triebenfeld'

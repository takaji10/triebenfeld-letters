- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Through Your Serene Highness''s letter to Mr. von Heyne, "that you wish to cede Koschentin to Weigel
    or to Stösseln," my fine plan has very nearly come to nothing. Weigel was here with me this forenoon
    and said: yes, if the Prince means to cede Koschentin to Stösseln, then the matter may rest; why should
    I put myself to the trouble at all — ready money I shall not get in that way — Only I do not know
    whether what the Prince has paid in will be credited by Stösseln, and whether any of my other claims
    can be covered out of it. I was as though shattered by lightning to hear this news. O God, I had need
    of every art of dissimulation to make myself appear indifferent — I have now drawn Heyne into the
    affair; he promises to bring everything back on to the rails. Heaven grant it. Let Your Serene Highness
    have the single grace of telling me candidly what is actually to be done.


    If you mean to give Koschentin back to Stösseln, then I must indeed fall silent, but you lose all
    the holdings and all that you have laid out upon Koschentin, and get air on no side — I beg for a
    gracious answer — and likewise that you show my letters to no one. You have your son there now, and
    the good Balley; to them you may unburden your heart, but others — they seek to thwart my plans and
    to make what I say ridiculous. In deepest reverence I remain, until death,


    Your Serene Highness''s


    Breslau, the 6th of September


    1810.


    humble and obedient servant


    v. Triebenfeld'

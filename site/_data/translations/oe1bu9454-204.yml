    Most Serene Prince


    Most gracious Prince and Lord!


    By Your Serene Highness''s letter to Mr R. R. Heyne — "that you are willing to cede Koszęcin to Weigel
    or Stössel" — my fine plan has very nearly come to nothing. Weigel was here with me this forenoon
    and said: yes, if the Prince means to cede Koszęcin to Stössel, then the matter may stay as it is;
    why should I put myself to trouble first — ready money I shall not get in any case — only I do not
    know whether what the Prince has paid in will be credited by Stössel, and whether any one of my other
    claims can be covered out of it. I was as though struck to pieces by lightning to hear this news.
    O God, I had need of every art of dissimulation to make myself appear indifferent. I have now brought
    Heyne into play, who promises to bring everything back into the track. May Heaven grant it. Let Your
    Serene Highness have but the one grace of telling me candidly what is actually to be done.


    If you mean to give Koszęcin back to Stössel, then I must indeed fall silent, but you lose all the
    holdings and what you have laid out upon Koszęcin, and get air on no side. I beg for a gracious decision
    — and likewise that you show my letters to no one. You now have your son and good Balley there, to
    whom you may unburden your heart, but others — these seek to thwart my plans and to make what I say
    ridiculous. In deepest esteem I remain, until death,


    Your Serene Highness''s


    Wrocław, the 6th of September


    1810.


    humble and obedient servant


    v. Triebenfeld'

- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Through Your Serene Highness''s letter to Herr
    v. Heyne, "that you wish to cede Koschentin to Weigel or to Stössel," my fine plan has almost come
    to nothing. Weigel was here with me this forenoon and said: yes, if the Prince will cede Koschentin
    to Stössel, then let the matter rest; why should I trouble myself first — ready money I shall not
    get in any case. Only I do not know whether what the Prince has paid in will be reckoned to Stössel''s
    account, and whether from it any one of my other claims can be covered. I was as though struck down
    by lightning to hear of this present. O God, I had need of every art of dissimulation to feign indifference
    — I have now drawn Heyne into the affair, who promises to bring everything back into its track. Heaven
    grant it. Have but the one mercy, Your Serene Highness, and tell me candidly what is actually to be
    done. If you will give Koschentin back to Stössel, then I must indeed fall silent, but you will lose
    all the assets [uncertain: bestände] and that which you have laid out upon Koschentin, and will get
    air on no side. — I beg for a gracious answer, and likewise that you show my letters to no one. You
    have now your Herr Son and the good Balley there, to whom you may unburden your heart; but others
    — they seek to thwart my plans and to make what I say ridiculous. In deepest reverence I remain, until
    death, Your Serene Highness''s Breslau, the 6th of September 1810. humble and obedient servant v Triebenfeld'

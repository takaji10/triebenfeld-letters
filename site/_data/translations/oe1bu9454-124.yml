segments:
- page: 1
  en: 'To Your Most Serene Highness I herewith submit the reply to the aforesaid Kunckel; may Your Highness
    be pleased to look it over as to whether it accords with Your Highness''s will and meaning. At the
    same time I beg that someone be permitted to make fair copies of the two letters, for I am as though
    crushed, and, since my good wife is being laid to rest today, I have withdrawn with the children to
    my brother-in-law''s.


    In my letter, which I am sending along with Kunkel''s, I shall set out everything thoroughly once
    more — I must first seek to collect myself somewhat. A map of Kopojno, Skokum and Swiątniki I have
    here. v Triebenfeld


    Breslau, 24th April 1804


    To His Most Serene


    Highness'

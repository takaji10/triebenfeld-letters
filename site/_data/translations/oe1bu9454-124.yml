- page: 1
  en: Your Most Serene Highness, I herewith submit the reply to the aforesaid Kunckel; may Your Highness
    be pleased to look it over, whether it accords with Your Highness's will and intention. At the same
    time I beg that someone be permitted to make fair copies of the two letters, for I am as though crushed,
    and, since my good wife is being laid to rest today, I have withdrawn with the children to my brother-in-law's.
    In my letter which I send along with Kunkel's, I shall set everything out thoroughly still — I must
    first try to collect myself somewhat. A map of Kopoyno Skokum and Swiątniki I have here. v Triebenfeld.
    Breslau, the 24th of April 1804. To His Most Serene Highness.

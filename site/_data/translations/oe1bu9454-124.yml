  en: '124


    To Your Most Serene Highness I submit herewith the reply to Kunkel; may Your Highness deign to look
    it through, whether it accords with Your Highness''s will and intention. At the same time I beg that
    someone be allowed to make fair copies of the two letters, for I am as though crushed, and, since
    my good wife is being laid to rest today, I have withdrawn with the children to my brother-in-law''s.


    In my letter, which I send along to Kunkel, I shall set everything out thoroughly — I must first seek
    to compose myself somewhat. A map of Kopojno, Skokum and Swiątniki I have here Wrocław, the 24th of
    April 1804


    v Triebenfeld'

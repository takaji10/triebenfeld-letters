status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Through all this vexation I have contracted
    a bad bilious fever and must keep to my bed here in Posen. The affairs are all so tangled that at
    every turn one meets with so many objects as keep forcing one back from the goal. Thus I found the
    situation here in respect of the Bruniewski business — not enough that the accursed compromise has
    been concluded. No! It is so faulty that it afforded security not worth a Groschen; all of this is
    to be cleared away and altered, and for that the wife of Bruniewski is required, and she is God knows
    where — now it is said she is in Kollo, now she is in Warschau. In short, these people are out for
    nothing but to defraud Your Serene Highness. And to confess freely: I hold Wünster to be the worst
    rogue of all — he is forever in collusion with Bruniewski and Guderian, he certainly receives from
    the former a couple of thousand d, and has therefore forged the most disadvantageous compromise, thrust
    that same thing into Glencke''s hands so that he was obliged to conclude it — while he himself very
    prudently made off out of the dust, so as to be able afterwards to lay it all upon the simple-minded
    Glenck. The Jew M Bernhard is here with Simon. These patrons will pay to Your Serene Highness only
    6000 Rthl instead of 13000 Rthl — but that shall not succeed for these knaves. First Bruniewski alone
    is to furnish sufficient security; this is promised for tomorrow — then pressure is to be put at once
    upon Metzer for the deposit of the full 66000 Rthl, against which'
- page: 2
  en: 'Bruniewski shall at once judicially concede the tradition of the estates; then the Jew et consortes
    are satisfied in this matter. Thereafter [uncertain: Baragnieur] takes his 53000 Rthl and Glenck the
    13000 for Your Serene Highness. At Betsche the Jew wished to undertake a like distraint and to confuse
    the people''s heads — meanwhile it shall succeed for him there as little as here. My resolve is absolutely
    to bring Your Serene Highness the whole 30000 Rthl out of Betsch and the full 13000 Rthl from here.
    Thereafter Your Serene Highness may pay off each according to his desert. That base fellow, the Wünster,
    I hardly get to see at all. He has his woman here, has placed her at the theatre, and gives balls
    for the whole gang so that they may take up the buck''s hide among themselves — that costs much, and
    therefore the knave must strike out on every road to snatch something. As regards Glenck, Your Serene
    Highness does me great hurt — I am no crawling sinner, but go gladly straight and openly; what I write
    to Your Serene Highness, I say to him — indeed, he read everything that I write. This, I believe,
    justifies my conduct. In deepest reverence I remain, until death, Your Most Serene Highness''s Posen,
    the 4th of August 1804 humble and obedient servant v Triebenfeld'

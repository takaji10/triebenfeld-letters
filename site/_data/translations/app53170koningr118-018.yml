segments:
- page: 1
  en: 'For the part of the Illustrious Prusimski, Starost of Niszczewice — Enrollment of a Judicial Site
    Inspection of the Location


    Let there be seen at this place the Enrollment of a judicial site inspection of the location at the
    mound belonging to the hereditary estates of Trąbczyn of the Illustrious Magnificent Antoni Prusimski,
    Starost of Niszczewice — conducted by two Nobles and a Process Server, written on paper from the Treasury
    of the Kingdom of one silver grosz, and subscribed by the own hands of the same Nobles — as the original
    stands in the submitted documents.'

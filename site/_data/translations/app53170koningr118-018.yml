segments:
- page: 1
  en: 'Enrollment of the Boundary Decree of the Sitting on the Ground pronounced between the Hereditary
    Estates of Trąbczyn, Łukom and Others


    Let there be seen at this place the Enrollment of the Field Boundary Decree of the Sitting on the
    Ground pronounced between the hereditary estates of Trąbczyn with its appurtenances, of the Illustrious
    Magnificent Antoni Prusimski, Starost of Niszczewice, and of Łukom, likewise with its appurtenances,
    the hereditary estate of the Magnificent Stanisław Chełmski, Treasurer of Wschowa, and issued by the
    [uncertain: office] of the boundary chamberlain of Inowrocław — as the original of the same decree
    stands in the submitted documents.'

- page: 1
  en: '291


    Most Serene Prince


    etc. etc.


    Just now I have again had in my hands the Cabinet Order of the 27th of April, according to which the
    King has commanded with the utmost dispatch the promptest payment of the 100000 rt to Prince August,
    and sent it to Kircheisen; on the 6th of May this was made known to Prince August, which he obsolete
    must long since have had. Nothing whatever stands [uncertain: stoff] in the way of this matter any
    longer, and by this everything is won, unless it were that God had made the good Prince August a hostage
    to his father and struck him with blindness. The compensation matter concerning the affairs of the
    Polish estates has now been decided through the mediation of Minister Wilhelm von Humboldt; the how,
    the when and the where now depends upon the Emperor. Minister Stein has already taken every conceivable
    pains, and Worowzow and Nesselrode have also knocked at the door, but as yet the Emperor has determined
    nothing. Stein says: if it does not go here, then I shall succeed in Heilbronn. The matter is too
    important and cannot be let go of; 300000 rt is no child''s play. With regard to your affair with
    Cosmar it is ordered that he shall absolutely and at once deposit your monies, failing which arrest
    is immediately threatened against him and a supervisor is to be appointed; the matter lies only with
    the Chancellor'

- page: 1
  en: 'Most Serene Prince


    p.p.


    Just now I have again had in my hands the cabinet order of the 27th of April, according to which the
    King has commanded the promptest payment of the 100000 Rthl to Prince August with the utmost dispatch,
    and has sent it to Kircheisen; on the 6th of May this was made known to [uncertain: Prince] August,
    which he Probsolut must have had long since; nothing whatever stands in the way of this matter any
    longer, and hereby all is won, unless God had created the good Prince August as a hostage to his father
    and struck him with blindness. The matter of compensation concerning the affairs of the Polish estates
    has now been decided through the mediation of Minister Humboldt; the how, the whether and the where
    now depend upon the Emperor. Minister Stein has already given himself every conceivable trouble, and
    Worowzow and Nesselrode have also knocked at the door, but the Emperor has as yet determined nothing.
    Stein says: if it does not go here, then I shall succeed with it at Heilbronn. The matter is too important
    and cannot be let go of; 300000 Rthl is no child''s play. With regard to your affair with Cosmar it
    is ordered that he shall Absolutely and at once deposit your monies, failing which he is at once threatened
    with arrest and a chief overseer is to be appointed; the matter lies only with the Chancellor'

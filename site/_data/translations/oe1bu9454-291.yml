- page: 2
  en: 'for signature. As for the rest, whether you or the King are to pay the 30000 Rthl will come to
    light in due course, if they do not scent out the [illegible] from us any more — pardon me.


    Concerning your military affair nothing at all has yet been said. The Prince Chancellor ascribes all
    of that Journal to himself, and therefore nothing is to be learnt or betrayed. The King departs in
    the night from the 25th to the 26th; he is going still to Berlin and from there straight to Heilbronn;
    the Prince Chancellor will soon follow him. I shall then [uncertain: come] to you in order to see
    to the rest; you are saved and will be saved. The King of Württemberg plays a great part; the mediatised
    are laid in the stocks, unless the times should change, for the Crown Prince of Württemberg is marrying
    the Princess of Oldenburg — these are peculiar times. Koppe has been appointed in the Hanoverian service;
    I shall learn from Minister Stein where. Write for Your Serene Highness''s sake, so as not to [uncertain:
    increase] me, for I depart when Hardenberg and Stein depart. But it would be a sad thing if you sent
    me no money, as I do through Adolph Both, for I should not know how I am to get away from here. I
    remain forever Your Serene Highness''s, Vienna, the 24th of May 1815


    when obedient servant


    v. Triebenfeld'

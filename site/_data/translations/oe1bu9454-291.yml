- page: 2
  en: 'for signature. As to the further question whether you or the King are to pay the 30000 rt, that
    will be found out, if one no longer [uncertain: Hr:] scents us of it — pardon me.


    Concerning your military affair nothing at all has yet been said. The Prince Chancellor ascribes all
    of that journal to himself, and therefore nothing is to be learned or to be betrayed. The King departs
    on the night of the 25th to the 26th; he goes still to Berlin and thence directly to Heilbronn. The
    Prince Chancellor follows him soon; I then hasten to you to attend to the rest. Saved you are and
    will be. The King of Württemberg is playing a great part; the mediatised are laid in the barrel, unless
    indeed the times change, for the Crown Prince of Württemberg marries the Princess of Oldenburg. These
    are strange times. Koppe is appointed in the Hanoverian service; I shall learn from Minister Stein
    where. Write for Your Serene Highness so as not to [uncertain: mehren] me, for I depart when Hardenberg
    and Stein depart. But it would be sad if you sent me no money, as I [do] through Adolph [uncertain:
    Both], for I should not know how I am to get away from here. I remain forever Your Serene Highness''s,
    Vienna, the 24th of May 1815


    faithful and obedient servant


    v Triebenfeld'

- page: 1
  en: '40


    Most Serene Prince.


    Most gracious Prince and Lord!


    Your Most Serene Highness I have not only answered promptly upon each of your most high letters, but
    have also let several more letters go off to Your Highness. I am therefore in anxiety whether letters
    have not again been intercepted. With regard to my journey to Holland and Paris a small alteration
    has occurred: I must first go to Vienna, and when I return from there by way of Königsberg I am only
    then to go to H[olland] and Paris. The detour I must make shall not [uncertain: dissuade] me from
    laying myself here at Your Serene Highness''s feet in Öhringen.


    As concerns the [uncertain: loan] business, I know of nothing more considerable and more [uncertain:
    useful] than this — for if Your Serene Highness be given the 250000 Rthl on the Zagórów mortgage,
    then you can purchase 750000 Rthl of papers with it and pay off your whole debts thereby. The mortgage
    need only be ceded judicially, and since it depends on one''s receiving the monies in part beforehand,
    I will stand surety for it with the whole of my landed property; for it is necessary that one obtain
    some money beforehand in order to buy the papers and hand them over to the creditors, so as to compel
    them to a speedy cancellation. Oppenheimer, as is known, who has about 28000 Rthl in Courant,


    the Invalids'' Fund for their 50000 — 15000 Rthl — Meyer Bernhard and the small items concerning 3000,
    are together an advance of 46000 Rthl; and for that the mortgage of 250000 Rthl is then quite clear.


    For Your Serene Highness there would accordingly remain some 204000 Rthl. My unpresumptuous counsel
    would then be that Your Serene Highness should indeed have 300000 Rthl of Seehandlung bonds bought
    for 90000 Rthl, and pay off to the King the [illegible] 300000 Rthl; thus you would gain 210000 Rthl
    and might [uncertain: be able] for the sake of this matter to put in a good word — Just so you can
    discharge all household and other small debts, still keep for yourself a considerable sum, and may
    then look down on anyone over your shoulder. As regards the security of the creditors who give the
    loan, the mortgage of 250000 Rthl serves, and the statement I have furnished, which I warrant with
    my own property. New assessments'

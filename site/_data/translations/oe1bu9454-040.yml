- page: 2
  en: 'can by no means be drawn up at present, because everything there is in the greatest confusion;
    the old ones are too low and are now worth nothing any more, because through the dismemberment that
    has been begun everything has come into another situation.


    Concerning your affair at court I can now disclose a good deal to you alone, and to Prince August,
    whom I shall still await here.


    Your Serene Highness has many enemies, and you are deliberately kept at a distance so that the S—
    may talk themselves clear and roll the blame onto your most high self — I had everything in the best
    track. Only when the M[inister] St[ein] appeared did the matter at once take on another aspect, and
    even those who had previously worked zealously — drew back. Now something is afoot; if that succeeds,
    then everything will yet turn out for the best. Prince August, then, I shall still await; on the 14th
    I go to V[ienna], and for the sake of Your Serene Highness''s affair I shall arrive back here in 12
    days — from here I go in haste to Königsberg; if I find that something can be done in the loan business,
    then I shall come from here directly? to Öhringen — discuss everything there, hasten from there to
    Paris, and send merely a merchant to Holland, who is to see to everything there and bring me the news
    at Paris; if then my presence in Holland be not urgently necessary, I shall go from Paris again to
    Öhringen to help arrange everything, and then I shall go again to K., where I shall doubtless learn
    the further course of things — the [uncertain: most painful] thing for me now is the pressing want
    of money. I do not know whence I am to take all the travelling costs. — From the King I take nothing
    whatever, and I shall not stop half way. What I have begun and have pursued so laboriously up to this
    point [uncertain: amid] a thousand obstacles must absolutely be carried through. This very day I have
    borrowed 4000 Rthl in Münze in order to pay to van der Lahr the still outstanding 2000 Rthl together
    with interest, from the [uncertain: cursed] Invalids'' business. — I cannot [uncertain: verliehen]
    this. When Your Serene Highness''s affairs come happily to [text lost] you would have to [text lost]
    me the first. For the 4000 Rthl Münze I have received 2200 Rthl Courant, and that I must hand over
    to the vampire of a banker. (and should have to write to pay again in Courant in 6 months) If the
    war does not break out too quickly, the French government has promised me military assistance in order
    to collect the arrears and, if possible, the monies for the Invalids'' Fund on the Zagórów estates.
    If this succeeds, Your Serene Highness gains much, for without this help one gets not a denier from
    there — Now all the interest is already due after the expiry of the free years, but the subjects refuse
    to pay, because the K[ing] of Saxony has forbidden, on penalty of double the value, that anything
    be delivered hither to anybody.


    In deepest reverence, deceased.


    Your Most Serene Highness


    Berlin, the 9th of July


    1808.


    your faithful and most obedient servant


    Peter'

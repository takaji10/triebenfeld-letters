- page: 1
  en: 'Most Serene Prince.


    Most gracious Prince and Lord!


    To Your Most Serene Highness I have not only answered promptly upon each of your most exalted letters,
    but have also sent off several further letters to your most exalted [self]. I am therefore in anxiety
    whether letters have not after all again been intercepted. With regard to my journey to Holland and
    Paris a small alteration has occurred; I must first go to [uncertain: Wirr], and when I return from
    the 2nd by way of Königsberg I am first to go to H. and Paris. The detour which I must make shall
    not deter me from laying myself at Your Serene Highness''s feet here in Öhringen.


    As concerns the loan business, I know of nothing more considerable and more profitable than this —
    for if one gives Your Serene Highness the 250000 Rthl upon the Zagorowo mortgage, you can buy 750000
    Rthl in paper with it and thereby pay your whole debts. The mortgage may only be ceded judicially,
    and since it depends upon obtaining the monies in part beforehand, I will stand surety for it with
    the whole of my landed property, for it is necessary that one obtain some money beforehand in order
    to buy the paper and hand it over to the creditors so as to compel them to a speedy cancellation.
    Oppenheimer, known, who has about 28000 Rthl in Courant


    the Invalids'' Fund for their 50000 - 15000 - Meyer Bernhard and the trifles amounting to 3000, are
    together an advance of 46000 Rthl; for this the mortgage of 250000 Rthl is then quite clear. For Your
    Serene Highness there would accordingly remain some 204000 Rthl. My unpresumptuous advice would then
    be that Your Serene Highness should indeed have 300000 Rthl of negotiation bonds bought for 90000
    Rthl, and should pay off to the King the [uncertain: Lursch] 300000 Rthl; thus you would gain 210000
    Rthl and might for the sake of this matter be able to give a good word — likewise you can extinguish
    all household and other small debts, still retain for yourself a considerable sum, and may then look
    at anyone over the shoulder. As regards the security of the creditors who give the loan, there serves
    the mortgage of 2500 Rthl and the statement I have furnished, which I guarantee with my goods. New
    assessments'

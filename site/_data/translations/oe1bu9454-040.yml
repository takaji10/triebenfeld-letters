- page: 2
  en: 'can by no means be drawn up at present, because there everything is in the greatest confusion;
    the old ones are too low and are now worth nothing any more, because through the dismemberment that
    has been begun everything has come into a different situation.


    Concerning your affair at court I can now disclose a good deal to you and to Prince August, whom I
    shall still await here, in private.


    Your Serene Highness has many enemies, and you are deliberately kept at a distance so that the [illegible]
    may talk themselves clear and shift the blame onto your most exalted self — I had everything on the
    best track. Only when M. St. withdrew did the matter at once take on another aspect, and even those
    who had previously worked zealously — drew back. Now something is afoot; if that succeeds, then everything
    will after all turn out for the best. Prince August, then, I shall still await; on the 14th I go to
    W:, and for the sake of Your Serene Highness''s affair I shall arrive back here within 12 days — from
    here I go in haste to Königsberg; if I find that something can be done in the loan business, then
    I shall come from here directly[?] to Öhringen — discuss everything there, hasten from there to Paris,
    and send merely a merchant to Holland, who is to see to everything there and bring me the news to
    Paris; if then my presence in Holland is not urgently necessary, I shall go from Paris back to Öhringen
    in order to help arrange everything, and then I go again to K., where I shall no doubt learn the further
    particulars — the most painful thing for me at present is the pressing want of money. I do not know
    whence I am to take all the travelling costs. — From the King I take nothing whatever, and I shall
    not stop half-way. What I have begun and have hitherto pursued so laboriously through a thousand obstacles
    must absolutely be carried through. This very day I have borrowed 4000 Rthl in Münze in order to pay
    the still outstanding 2000 Rthl together with interest to von der Lahr, arising from the [uncertain:
    verdanken] Invalids'' business. — I cannot lose this. When Your Serene Highness has happily settled
    your affairs, you would have to give me the first [thing]. For the 4000 Rthl in Münze I have received
    2200 Rthl Courant, and this I must hand over to the vampire of a banker. (and in 6 months would have
    to write to pay Courant [illegible]) If the war does not break out too quickly, the French Government
    has promised me military assistance in order to recover the arrears and, if possible, the monies for
    the Invalids'' Fund from the Zagorowo estates. If this succeeds, Your Serene Highness gains much,
    for without this help one obtains not a single denarius from them. Now all the interest is already
    due, the free years having expired; only the subjects refuse to pay, because the King of Saxony has
    forbidden anything to be handed over to anyone here on penalty of double the value.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 9th of July


    most faithfully obedient servant


    1808.


    Peter[uncertain: s]'

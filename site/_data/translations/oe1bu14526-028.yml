- page: 2
  en: 'Concerning the Slugoziner meadow dispute a map has already been prepared, and I enclose for you
    the course[?] of the royal chamber surveyor Gunter for your more convenient consultation. In the contract
    of the Trąbczyn Hollanders there is said to stand inserted — as only the commissary of von Prusimsky,
    Mr. von Kramplitz, assures me — the reservation that the privilege extends only to the first possessors,
    their son and grandsons, and that they would already now have to apply for a new privilege.


    At the same time I take the honour of sending along 5 ducks. For the old sick witness at Olesnica
    I am having strong soups cooked, so that he may render you services in return. The surveyor Sprengel
    I beg to be sent for, for the production of his map. I am p.p.


    Glenck


    Zagorowo, the 27th of May 1799'

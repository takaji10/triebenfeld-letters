status: draft
segments:
- page: 1
  en: 'To Herr Criminal Rath Grimm at Kalisch. In the enclosure I take the honour of transmitting a Copy
    of my letter to Ehe von Radozimski concerning the contract, together with his answer and my reply
    thereto; according to these, then, the contract between the two of us is annulled.


    Thereupon I have exerted myself to move the 3 contracting parties Luck, Kriede, and Nüchler to withdraw,
    but this would not do, because they have the prospective purchasers together in one consignation,
    and between yesterday and today have already brought forward 18 farmers who had themselves entered
    upon deposit of a pledge, and who take nearly 2/3 of the fields, and they also mean to bring the others
    within a short time. Besides this, the co-contracting party Griese has bound himself to a security
    of 2/M. rt., which I shall seek out judicially on my passage through Peysern, so that an earnest-money
    may be retained. Through the interruption of this contract with that of von Radozimski much detriment
    has followed, wherewith these people charge me with the reckoning of their damages. This will nevertheless
    fall back upon von Radozimski; I shall take the liberty of sending them to the same, wherein I beg
    that you might charge such to von Radozimski. but'
- page: 2
  en: 'Concerning the Slugozin meadow dispute a map has already been drawn up, and I enclose for the same
    the [uncertain: course] of the Royal Chamber Conducteur Gunter, for convenient consultation. In the
    contract of the Trąbczyn Hauländer there is said to be inserted — as only the commissary of von Prusimsky,
    Herr von Kramplitz, assures me — the reservation that the privilege extends only to the first possessors,
    their son and grandsons, and that they must even now seek out a new privilege.


    At the same time I take the honour of sending along 5 ducks. For the old sick witness at Olesnica
    I am having strong soups cooked, so that he may render you services in return. The Conducteur Sprengel
    I beg to be sent for, for the production of his map. I am p.p.


    Glenk


    Zagorowo, the 27th of May 1799'

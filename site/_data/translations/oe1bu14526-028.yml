status: draft
segments:
- page: 1
  en: 'To the Herr Criminal Rath Grimm at Kalisch. In the enclosure I take the honour of transmitting
    a Copy of my letter to [uncertain: Ehe] von Radozimski concerning the contract, together with his
    answer and my reply thereto; according to these, then, the contract between the two of us is annulled.


    Upon this I have endeavoured to move the 3 contracting parties Luck, Kriede, and Nüchler to withdraw,
    but this would not do, because they have the purchase-willing parties together in one consignation,
    and between yesterday and today have already brought forward 18 farmers who had themselves entered
    upon deposit of a pledge, and who take nearly 2/3 of the fields, and they mean to bring the others
    within a short time. Besides this, the co-contracting party Griese has bound himself to a security
    of 2/M. rt., which I shall seek judicially on my journey through Peysern, so that an earnest-money
    may be retained. Through the interruption of this contract with that of von Radozimski much detriment
    has followed, wherewith these people set their reckoning of damages against me. This will yet fall
    back upon von Radozimski; I shall take the liberty and send them to him, whereby I beg that you might
    charge such to von Radozimski. but'
- page: 2
  en: 'Concerning the Slugoziner meadow dispute a map has already been prepared, and I enclose for their
    convenient examination the [uncertain: course] of the Royal Chamber Conducteur Gunter. In the contract
    of the Trąbczyn [uncertain: anländern], as only the commissary of von Prusimsky, Herr von Kramplitz,
    assures me, there is said to stand inserted the reservation that the privilege extends only to the
    first possessors, their son and grandsons, and that they must even now seek a new privilege.


    At the same time I take the honour of sending along 5 ducks. For the old sick witness at Olesnica
    I am having strong soups cooked, so that he may render you services in return. The Conducteur Sprengel
    I beg you to send for, for the production of his map. I am p.p.


    Glenk


    Zagorowo, the 27th of May 1799'

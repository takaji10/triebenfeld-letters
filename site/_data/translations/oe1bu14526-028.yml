segments:
- page: 1
  en: 'To the criminal-court councillor Grimm at Kalisz. In the enclosure I take the honour of transmitting
    a Copy of my letter to [uncertain: Ehe] von Radozimski concerning the contract, together with his
    reply and my answer thereto; according to these the contract between the two of us is therefore annulled.


    Thereupon I have exerted myself to move the 3 contracting parties Luck, Kriede and Nüchler to withdraw,
    but this did not succeed, because they have the prospective purchasers together in one consignment
    list, and between yesterday and today have already brought forward 18 farmers who had themselves entered
    upon lodging a pledge, and who are taking nearly 2/3 of the fields, and they intend also to bring
    in the others within a short time. Besides this, the co-contracting party Griese has undertaken to
    give a surety of 2/M. rt., which I shall apply for judicially on my journey through Pyzdry, so that
    an earnest-money may be retained. Through the interruption of this contract by that of von Radozimski
    much disadvantage has arisen, wherewith these people are charging their reckoning of damages against
    me. This will nevertheless fall back upon von Radozimski; I shall take the liberty and send them to
    you, whereby I beg that you might charge such to von Radozimski. but'

- page: 2
  en: 'of the State as well, and to have played a dishonourable and self-serving part. I cannot and shall
    not rest content in this until the matter is brought entirely into the clear and this false appearance
    is [uncertain: rumoured]. I gladly renounce every good fortune; only in my honour can I not allow
    myself to be injured. In the matter of the exchange I have done nothing without having first informed
    myself fully of everything.


    I had the assurance from the Chambers and from all the world that Krotoszyn had never really yielded,
    nor could yield, more than 30,000 Rthl, because the town has too many prerogatives prejudicial to
    the manorial lordship (Dominium).


    I heard that Minister von Voss was by no means willing to take over the administration of these estates
    if he were to render up 30 from Krotoszyn and 20000 Rthl annually from Polajewo.


    Minister Count von Höym further assured me that this was a noble proposal on my part, one truly suited
    to the Royal interest, because the King would thereby see himself covered for the future with respect
    to the guarantee given to the Maritime Trading Company, and would at bottom be rid of a business which,
    sooner or later, were it to remain in Royal hands, might yet be censured in the ugliest fashion by
    Goerne and his heirs and take a disagreeable turn.


    I learned moreover that many boundary suits were still pending, and particularly with General Count
    Kalbreuth, which look so unpromising that through them yet a great part of Krotoszyn might be torn
    away. However dreadful some of these pictures may appear even to myself, I nevertheless formed the
    resolution to propose this exchange to the King all the more readily — since it was said that I was
    acting nobly and in accordance with the Royal interest.


    It is now more than striking to me that Minister von Voss told the King'

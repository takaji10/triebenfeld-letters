- page: 1
  en: '87


    To Colonel von Köckritz


    Right Honourable Sir,


    The said exchange of estates has taken a more than disagreeable turn for me, so that I find myself
    in a lamentable situation. My purest intention was, without falling burdensome to the State in any
    manner whatsoever, to rid myself [uncertain: himself] of the debts oppressing me, in order to devote
    my services to the King undisturbed, and without being plagued with domestic cares, for so long as
    my powers should last. The estates conferred upon me by the most highly blessed Monarch turned out,
    after I had expended some 50/m Rthl upon them, so productive that I at once formed the resolution
    to employ the greater part of them to borrow a sum upon them, in order to pay the debts made during
    my term of service. Every attempt, however, miscarried with me, since unspeakable obstacles were sought
    out, especially on account of the resistance of the Chambers, so that I should never have attained
    my purpose. A South Prussian nobleman of the name of Karnhowsky, who was willing to advance 90/m #,
    declared frankly "that he could give nothing upon all my estates, which were in part confiscated and
    for the greater part taken from the clergy. If, however, I could furnish him for his security with
    estates such as the Krotoszyn ones, he would be willing and ready to advance me this and a still larger
    sum." Hereupon the wish grew lively in me to bring the Krotoszyn estates into my possession. On the
    part of the Poznań Chamber it was believed that Polajewo was inseparable from Krotoszyn, and therefore
    I made to the King, as Your Excellency knows, the proposal that was made. Several men, however, thought
    on the other hand that Polajewo could not be ceded to me for ready money, and I at once wrote to Minister
    von Voss that I would renounce Polajewo, and wished to exchange only the Krotoszyn estates alone for
    those conferred upon me. The King gave only [uncertain: me] a gracious answer, and all other men versed
    in the matter regarded the thing as done, until at last first Minister von Voss, and afterwards the
    King, only wrote [uncertain: wrote to me] "That this exchange is to the disadvantage of the State,
    inasmuch as the Krotoszyn estates yield 17,400 Rthl more than mine do." In this affair I now appear
    in a light as though I had wished also at the cost'

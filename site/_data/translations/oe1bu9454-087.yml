- page: 1
  en: 'To Colonel von Köckritz


    Right Honourable Sir etc.


    The exchange of estates in question has taken a more than disagreeable turn for me, such that I find
    myself in a pitiable situation. My purest intention was to rid myself of the debts weighing upon me
    without becoming burdensome to the State in any manner whatsoever, so as to devote my services to
    the King undisturbed, and without being plagued by domestic cares, for as long as my strength should
    last. The estates conferred upon me by the Most Serene Monarch turned out, after I had expended some
    50000 Rthl upon them, so productive that I at once formed the resolution to employ them for the greater
    part in order to borrow a sum upon them, so as to pay the debts incurred during my years of service.


    But every attempt failed me, since unspeakable obstacles were sought out, particularly on account
    of the obstructiveness of the Chambers, so that I should never have attained my object. A South Prussian
    nobleman named von Karnhowsky, who was willing to advance 90000 ducats, declared frankly "that upon
    all my estates, which were in part confiscated and for the greater part taken from the clergy, he
    could give nothing. If, however, I could furnish him, for his security, with estates such as those
    of Krotoszyn, then he was willing and ready to advance me this and an even greater sum." Hereupon
    the wish stirred in me to acquire the Krotoszyn estates for myself.


    On the part of the Posen Chamber it was believed that Polajewo was inseparable from Krotoszyn, and
    therefore I made to the King, as Your Excellency knows, the proposal that was made. Several men, however,
    were again of the opinion that Polajewo could not be made over to me for ready money, and I at once
    wrote to Minister von Voss that I would renounce Polajewo and wished to exchange only the Krotoszyn
    estates for those conferred upon me. The King gave only a gracious answer, and all other knowledgeable
    men regarded the matter as settled, until at length first Minister von Voss and thereafter the King
    only wrote that this exchange was to the detriment of the State, inasmuch as the Krotoszyn estates
    yielded 17400 Rthl more than mine.


    In this matter I now appear in a light as though I had wished to enrich myself at the cost'

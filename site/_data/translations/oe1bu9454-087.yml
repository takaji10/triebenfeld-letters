- page: 3
  en: 'that the State would thereby lose some 17400 Rthl annually. I cannot and shall not rest content
    under this portrayal by Mr. von Voss; I renounce Krotoszyn, as I have said, if it is believed that
    I gain anything more thereby than the opportunity to negotiate moneys upon it.


    It is demonstrable that Krotoszyn yields no more than 30100 Rthl, and that, according to the statement
    of Councillor of War von Coeln, by every art it can at most one day be brought up to 36000 Rthl.


    My estates, upon which, however, I must still pay some 70 to 80 thousand Rthl to two creditors, already
    yield some 41500 Rthl, for which I should have furnished the King with my warranty until his departments
    had themselves become convinced of it; and in this way the State would annually have come by more
    than 11000 Rthl, which I pledge upon my princely word. More than harsh and oppressive to me, therefore,
    is the treatment by Minister von Voss, who, upon the one-sided advice of Councillor of War Nöldichen,
    without instituting the least local enquiry into the one or the other estates, rendered to the King
    that report which rests for the greater part only on far-fetched and shallow speculations; and I have
    therefore, in vindication of my honour, this day petitioned the Monarch to have this matter investigated
    by an impartial person — and to have laid before him from Minister von Stoll ensée the files containing
    the correspondence between the late blessed King, Minister von Voss, von Struensee, and Count Höym
    concerning the taking over of the Krotoszyn and Polajewo estates, from which the rest will at once
    appear.


    I beg Your Right Honourable most urgently to lay my peti-'

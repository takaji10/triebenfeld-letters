- page: 3
  en: 'that the State would lose some 17,400 Rthl annually thereby. I cannot and will not rest content
    with this portrayal by Mr Voss; I renounce, as I have said, Krotoszyn, if it be believed that I gain
    anything further by it than the opportunity of negotiating moneys upon it.


    It is demonstrable that Krotoszyn yields no more than 30,100 Rthl, and that, according to the statement
    of the councillor of war von Coeln, it can at the utmost one day be brought by every art to 36,000
    Rthl. My estates, in which, however, I must still pay some 70 to 80/m Rthl to two creditors, already
    yield some 41,500 Rthl, for which I should have given the King my warranty until his departments had
    themselves been convinced of it; and in this way the State would have gained annually over 11,000
    Rthl, for which I pledge my princely word. More than hard and oppressive to me, therefore, is the
    treatment by Minister von Voss, who, upon the one-sided advice of the councillor of war Nöldichen,
    without instituting the least local inquiry into the one or the other estates, rendered to the King
    that report, which for the greater part rests only upon far-fetched and shallow speculations; and
    I have therefore, for the vindication of my honour, this day begged the Monarch to have this matter
    investigated by an impartial person — and to have laid before him from Minister von Struensee the
    files containing the correspondence concerning the taking over of the Krotoszyn and Polajewo estates
    between the most blessed King, Minister von Voss, von Struensee and Count Hoym, from which the rest
    will then at once appear.


    Your Right Honourable I beg most urgently to lay my re-'

status: draft
segments:
- page: 1
  en: To the Herr Obrist von Köckritz, Right Honourable Sir etc. The certain exchange of estates has taken
    a more than disagreeable turn for me, such that I find myself in a lamentable situation. My purest
    intention was, without falling burdensome to the State in any manner whatsoever, to rid oneself of
    the debts weighing upon me, so as to devote my services to the King undisturbed, and without being
    plagued with domestic cares, so long as my strength should last. The estates conferred upon me by
    the Most High Monarch turned out, after I had expended some 50000 Rthl upon them, so productive that
    I at once formed the resolution to employ them for the greatest part to borrow a sum upon them, in
    order to pay the debts contracted during my term of service. Every attempt, however, failed me, since
    particularly on account of the recalcitrance of the Chambers unspeakable obstacles were sought out,
    so that I should never have attained my purpose. A South Prussian nobleman von Karnhowsky, who was
    willing to advance 90000 ducats, declared freely "that he could give nothing upon all my estates,
    which were in part confiscated and for the greatest part taken from the clergy. But if I could furnish
    him, for his security, estates such as the Krotoszyn ones were, then he would be willing and ready
    to lend me this and even a larger sum." Hereupon the wish became active in me to acquire the Krotoszyn
    estates. On the part of the Posen Chamber it was believed that Polajewo was inseparable from Krotoszyn,
    wherefore I petitioned the King, as Your Excellency knows, with the said proposal. Several men, however,
    again held that Polajewo could not be ceded to me for ready money, and I at once wrote to the Minister
    v. Voss that I would renounce Polajewo and wished to exchange only the Krotoszyn estates for those
    conferred upon me. The King gave only a gracious answer, and all other knowledgeable men regarded
    the matter as done, until at last first the Minister v. Voss and afterwards the King only wrote that
    this exchange was to the detriment of the State, inasmuch as the Krotoszyn estates yielded 17400 Rthl
    more than mine. In this matter I now appear in such a light as though I had wished to enrich myself
    even at the cost
- page: 2
  en: 'of the State and to play a dishonourable, self-interested part. I neither can nor will let myself
    be quieted in this, until the matter is brought entirely into the clear and this false appearance
    is [uncertain: cleared away]. I gladly renounce all good fortune; only in my honour can I not know
    myself injured. In the matter of the exchange I have done nothing without having first informed myself
    of everything [uncertain: from the records]. I had the assurance from the Chambers and from all the
    world that Krotoszyn had never really brought in, nor could yield, more than 30,000 Rthl, because
    the town has too many prerogatives prejudicial to the Dominium. I heard that the Minister von Voss
    would by no means take over the administration of these estates, if he were to be required to render
    30 from Krotoszyn and 20000 Rthl yearly from Polajewo. The Minister Count von Höym further assured
    me that this was a noble proposal on my part, one truly suited to the Royal interest, because the
    King would thereby see himself covered for the future in respect of the guarantee given to the Seehandlung,
    and would in substance be rid of a matter which, sooner or later, if it remained in Royal hands, might
    yet be most odiously censured by Goerne and his heirs and take a disagreeable turn. I learned moreover
    that many boundary suits were still pending, and particularly with the General Count Kalckreuth, which
    look so precarious that through them a great part of Krotoszyn might yet be torn away. However dreadful
    some of these pictures may appear even to myself, I nevertheless formed the resolution to propose
    this exchange to the King the more readily — since it was said that I was acting nobly and in accordance
    with the Royal interest. It is now more than striking to me that the Minister von Voss told the King'
- page: 3
  en: 'that some 17400 Rthl yearly would thereby be lost to the [uncertain: Council]. I neither can nor
    will let myself be quieted at this depiction of Herr Voss; I renounce, as I have said, Krotoszyn,
    if it is believed that I gain thereby anything further than the opportunity to negotiate moneys upon
    it. It is demonstrable that Krotoszyn yields no more than 30100 Rthl, and, according to the statement
    of the Councillor of War von Coeln, can at best one day be brought by every artifice to 36000 Rthl.
    My estates, in which, however, I still have to pay some 70 to 80 thousand Rthl to two creditors, already
    yield some 41500 Rthl, for which I should have stood warrant to the King until his departments had
    satisfied themselves of it, and in this way the State would have come yearly to over 11000 Rthl, which
    I guarantee upon my princely word. More than hard and oppressive to me, therefore, is the treatment
    of the Minister v. Voss, who, upon the one-sided advice of the Councillor of War Nöldichen, without
    instituting the least local investigation into the one or the other estates, has rendered to the King
    that report which for the greatest part rests only upon far-fetched and shallow speculations; and
    I have therefore, for the vindication of my honour, this day begged the Monarch to have this matter
    investigated by an impartial person — and to have laid before him, from the Minister von Struensee,
    the files containing the correspondence concerning the taking over of the Krotoszyn and Polajewo estates
    between the late blessed King, the Minister v. Voss, v. Struensee and Count Höym, from which the rest
    will then appear at once. Your Right Honourable I beg most urgently to lay my re-'
- page: 4
  en: '-quest to the good Monarch''s heart, so that I may not have made a vain petition. It is with the
    purest friendship and devotion that I [uncertain: remain] [text lost] have the honour. Breslau, the
    7th December 1798.'

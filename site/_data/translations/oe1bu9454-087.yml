- page: 2
  en: 'of the State to enrich myself and to play a dishonourable, self-interested part. I cannot and will
    not rest content in this, until the matter has been wholly cleared up and this false appearance [uncertain:
    rectified]. I gladly renounce all good fortune; only in my honour can I not know myself injured. In
    the matter of the exchange I have done nothing without having first put myself fully in the picture
    [uncertain: au fait] concerning everything.


    I had the assurance from the Chambers and from all the world that Krotoszyn could never really yield
    more than 30,000 Rthl, because the town holds too many prerogatives prejudicial to the manorial lordship
    (Dominium). I heard that Minister von Voss would by no means undertake the administration of these
    estates if he were to pay over from Krotoszyn 30 and from Polajewo 20/m Rthl annually.


    Minister Count von Hoym further assured me that this was a noble proposal on my part, one truly suited
    to the Royal interest, because by it the King would see himself covered for the future on account
    of the guarantee given to the Maritime Trading Company, and would at bottom be rid of a matter which,
    sooner or later, were it to remain in Royal hands, might yet be censured in the ugliest manner by
    Goerne and his heirs and take a disagreeable turn. I learned besides that many boundary suits were
    still pending, and especially with General Count Kalckreuth, which look so unpromising that through
    them a great part of Krotoszyn might yet be torn away. However dreadful some of these pictures may
    always appear even to myself, I nevertheless formed the resolution to propose this exchange to the
    King all the more readily — since it was said that I was acting nobly and in accordance with the Royal
    interest.


    It is now more than striking to me that Minister von Voss told the King'

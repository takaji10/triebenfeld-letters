- page: 2
  en: 'now, through the mediation of the Saxon envoy, to whom the cavalry captain v Schimmelpfennig saw
    himself compelled to turn, taken a more favourable turn, so that they believe the matter will. [uncertain:
    benen Kurgen] be settled to the satisfaction of both parties.


    If to this there be added the circumstance that, on account of the winter season now come on, an inspection
    of the estates, which must necessarily precede the matter, has become impossible, then the General''s
    request that the matter be put off until the spring, which he causes to be made to Your Serene Highness
    through me, does indeed appear not to be unreasonable, provided always that the longer delay of the
    business does not incur Your Serene Highness''s disapproval.


    Sławięcice, the 17th of January


    1812.


    Sommer'

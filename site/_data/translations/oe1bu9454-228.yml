  en: '228


    P[ro]. M[emoria].


    I shall not fail most humbly to render to Your Serene Highness the following report upon the outcome
    of my mission to the General Schimmelpfennig v der Oye.


    The General is indeed still inclined to enter upon the projected exchange with the Zagórów estates;
    meanwhile, however, certain circumstances have made the matter less urgent, these being his illness
    and the unfavourable beginning of his son''s negotiations with Mr von Stägemann in Berlin.


    As concerns the first, the General is indeed in a state of improvement, yet it has not so far advanced
    that he might leave his room as usual, and in particular occupy himself with [uncertain: mitwuhr]
    tigen and extensive business. But touching upon the second circumstance, which is of chief importance
    in the exchange now in hand, inasmuch as it concerns the moneys appointed to be released, the dealings
    with Mr von Stägemann have'

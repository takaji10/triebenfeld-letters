segments:
- page: 1
  en: 'P[ro]. M[emoria].


    I do not fail to render most humbly to Your Serene Highness the following report upon the outcome
    of my mission to the General Schimmelpfennig v der Oye[uncertain: ].


    The General is indeed still inclined to enter into the projected exchange for the Zagorowo estates;
    in the meantime, however, certain circumstances have made the matter less urgent, namely his illness
    and the unfavourable beginning of the negotiations of his [uncertain: Fohnes] with Mr. v Steger mann
    in Berlin.


    As concerns the first, the General is indeed in a state of improvement, yet it has not so far advanced
    that he could leave his chamber as usual, and in particular occupy himself with weighty and extensive
    business. But touching the second circumstance, upon which everything chiefly depends in the exchange
    now in train, inasmuch as it concerns the monies appointed to be paid out, the business with Mr. v
    Stägemann has'

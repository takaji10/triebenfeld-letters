status: draft
segments:
- page: 1
  en: 'P[ro]. M[emoria]. Your Serene Highness, I do not fail most humbly to render the following report
    upon the outcome of my mission to the Herr General Schimmelpfennig v der Oye[uncertain: ]. The Herr
    General is indeed still inclined to enter into the projected exchange with the Zagorow estates; meanwhile,
    however, certain circumstances have made the matter less urgent, these being his illness and the unfavourable
    beginning of the negotiations of his son with H. v Stägemann in Berlin. As concerns the first, the
    Herr General is indeed in a state of improvement, yet it has not yet advanced so far that he could
    leave his room as usual, and in particular occupy himself with weighty and extensive business. But
    as regards the second circumstance, upon which, in the exchange now in train, everything chiefly depends,
    inasmuch as it concerns the moneys destined for the payment out, the business with H. v Stägemann
    has'
- page: 2
  en: 'now, through the mediation of the Fächsisch envoy, to whom the Rittmeister v Schimmelpfennig saw
    himself obliged to turn, taken a more favourable turn, so that they believe the matter will. be settled
    to the satisfaction of both parties [uncertain: within a short time]. If to this there be added the
    circumstance that, on account of the winter season now come on, an inspection of the estates, which
    must necessarily precede the matter, has become impossible, then the request of the Herr General,
    that the matter be deferred until the spring — which he causes to be made to Your Serene Highness
    through me — appears indeed not to be unreasonable, provided that the longer delay of the matter does
    not incur Your Serene Highness''s disapprobation. Schlawenschitz, the 17 January 1812. Sommer'

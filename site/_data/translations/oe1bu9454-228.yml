- page: 2
  en: 'now taken a more favourable turn through the mediation of the [uncertain: Saxon] envoy, to whom
    the cavalry captain v Schimmelpfennig saw himself obliged to apply, so that they believe the matter
    will shortly be settled to the satisfaction of both parties.


    If there be added to this the circumstance that, on account of the winter season now come on, an inspection
    of the estates which must necessarily precede the matter has become impossible, then the request of
    the General, which he causes to be made to Your Serene Highness through me, that the matter be postponed
    until the spring, does indeed appear not unreasonable - provided that the longer delay of the business
    does not incur Your Serene Highness''s disapproval.


    Schlawenschitz, the 17th of January


    1812.


    Sommer'

status: draft
segments:
- page: 1
  en: 'The Royal Minister of State and of Justice, Mr von Kircheisen, is hereby called upon, as executor
    of the will of the deceased Lady Princess von Sacken, in the event that the assertion advanced by
    the General Invalids'' Fund in its complaint lodged with the Royal Superior Court of Justice on the
    30th of last month — "that the Lord Prince of Hohenlohe-Ingelfingen was to receive a legacy of 80000
    rt out of the estate of the Prince von Sacken, and has assigned the same to the Councillor of War
    and Forests von Triebenfeld at Konotop near Zielona Góra in satisfaction of the latter''s claims upon
    him" — should prove to be well founded, to pay out nothing of this sum to the said von Triebenfeld,
    at his own responsibility.


    Berlin, the 1st of August 1811.


    Royal Prussian Superior Court of Justice.


    To the Royal Minister of State and of Justice, Mr von Kircheisen.


    in the like terms


    To the Royal Chief Medical Councillor Mr Cosmar here. To the Councillor of War and Forests Mr von
    Triebenfeld at Konotop.


    No. 1103.


    We herewith cause to be transmitted to you a summons of the Royal Superior Court of Justice at Berlin
    of the 1st of the current month in the matter of the General Invalids'' Fund against you, with the
    command to render in all respects the obedience due to the contents thereof, and to certify in full
    the due receipt of the same upon the copy to be laid before you for that purpose. Głogów, the 6th
    of August 1811. Royal Prussian Superior Provincial Court of Silesia. Fülleborn'

- page: 2
  en: 'seen with one eye, and even to all my letters I receive nothing but dizzying evasions — Against
    Meierowitz alone the execution has been levied — Radke cannot get away at present, for in his region
    there stand some 80,000 Russians. Perhaps it will go better when I return from Dresden. In deepest
    reverence I remain, until death, Your Most Serene Highness''s Kalisz


    the 29th of April 1813 most humble and obedient servant v Triebenfeld'

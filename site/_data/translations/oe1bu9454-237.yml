- page: 2
  en: 'eyes upon, and even to all my letters I receive nothing but dizzying evasions. – Against Meierowitz
    alone execution has been laid. – Radke cannot get away at present, for in his neighbourhood there
    stand some 80000 Russians. Perhaps matters will go better when I return from Dresden. In deepest reverence
    I remain, until death, Your Most Serene Highness''s Kalisz


    the 29th of April 1813 most humble and obedient servant v Triebenfeld'

- page: 1
  en: '237


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness, I wrote lately by a messenger and sent the letter to the district steward
    König, and could and can and can also forward the same to him by an express to Sławięcice — but the
    fellow did not do that, and instead put the letter into the post at Pol[ish] Wartenberg. For some
    days now I have been hoping for a gracious answer from Your Serene Highness. Now I can wait no longer;
    I must set out tonight for Dresden, for my eldest son lies wounded at Naumburg on the Saale and is
    shot through both thighs. I am therefore going, as said above, today by way of Dresden thither, and
    shall return to Dresden within twelve days at the most. May Your Most Serene Highness only be pleased
    to send the writing now to Dresden, and graciously have it noted upon the address that the [uncertain:
    calling] should remain lying at the post office until I myself call for it — As soon as I have the
    writing from Your Serene Highness to His Majesty the Emperor [illegible] drafted manner, I shall certainly
    get Trąbczyn and Kamionna back — Trzciński, or König, nor Zerboni nor Meierowitz have I to this day
    with'

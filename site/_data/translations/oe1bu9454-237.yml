segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, Your Most Serene Highness, I wrote lately by a messenger, sent the
    letter to the district administrator König and could and can and can also forward the same to him
    by an express to Schlawenschi - but the fellow did not do this, and instead put the letter into the
    post at Pol Wartemberg. For some days now I have been hoping for a gracious reply from Your Serene
    Highness. Now I can wait no longer, I must set out tonight for Dresden, for my eldest son lies wounded
    at Naumburg an der Saale and has been shot through both thighs. I am therefore going thither, as said
    above, today by way of Dresden, and shall be back in Dresden within twelve days at the most. May Your
    Most Serene Highness only be pleased to send the letter now to Dresden, and most graciously have it
    noted upon the address that the letter should remain lying at the post office until I myself call
    for it. – As soon as I have the letter from Your Serene Highness to His Majesty the Emperor, drafted
    [uncertain: Fieder] in the manner set out, I shall certainly get Trąbczyn and Kaemen back. Neither
    Trzciński nor König nor Zerboni nor Meierowitz have I to this day set'

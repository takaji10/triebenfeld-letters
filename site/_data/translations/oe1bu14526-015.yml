- page: 2
  en: '7. These Hufen taken in hereditary lease shall be measured out to the hereditary leaseholders forthwith
    and delivered into their possession.


    8. Upon the arable land and meadows the rents shall be duly paid even in this current year; upon the
    woodland, however, and upon the other grounds, four free years are allowed, by the end of which time
    each taker must have cleared and brought under cultivation the woodland grounds purchased by him,
    so that after the lapse of the four free years the rents upon these grounds must likewise be paid
    at fifteen thaler per Hufe, and discharged to the manorial treasury in half-yearly instalments of
    7 rt 12 gg.


    9. Besides the yearly hereditary rents, the hereditary leaseholders undertake, for themselves and
    their descendants, to render all royal and other dues charged upon these estates, by whatever name
    they may be called, and such shall be laid upon the Hufen and duly apportioned.


    10. Since all the grounds are dismembered and let out against rents, the hereditary leaseholders may
    make no claim to any rights of pasture or of timber, but must graze their cattle upon their own grounds
    alone, and must seek to grow and conserve their own timber.


    11. The hereditary takers are granted the liberty to set up a brick-kiln upon their grounds and to
    burn for themselves the bricks needed for the first building, without anything having to be paid for
    this to the ground lordship.


    12. The hereditary leaseholders must divide the two hundred and seventy Hufen Magdeburg they have
    taken among themselves in the best possible'
  numbers:
  - '7.'
  - '8.'
  - '7'
  - '12'

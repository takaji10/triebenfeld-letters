    1. to Kuh[uncertain: n]t et Consorten: 42 Hufen


    2. Henrichs: 6.


    3. Christoph Schönfisch 1 Hufe 5 Morg 9 R


    4. Kienast et Consorten: 40


    5. Kienast et Consorten: 4


    6. Tschachmann: 20


    7. Seymert: 3



status: draft
segments:
- page: 1
  en: 'Between the Royal Councillor of War and Forests von Triebenfeld, general attorney of His Most Serene
    Highness the reigning Prince of Hohenlohe-Ingelfingen, and the hereditary leaseholders subscribed
    at the end, the following heads of agreement were this day arranged and concluded, subject to the
    approval of His Serene Highness.


    1. His Most Serene Highness, through his general attorney, makes over to the subscribed hereditary
    leaseholders, out of the grounds belonging to his estates of Trąbczyn, Łazy, Osiny, Neudorff and Przybisław,
    consisting of fields, meadows and woods etc., the superficial content of 270 Hufen, say two hundred
    and seventy Hufen Magdeburg measure, the Hufe reckoned at thirty Morgen and the Morgen at 180 rods.


    2. As purchase money the hereditary leaseholders named below shall pay to His Serene Highness, for
    each Magdeburg Hufe, 300 Rthl, say three hundred Reichsthaler Royal Courant.


    3. Each hereditary leaseholder, and his successors in possession, shall pay yearly for each Magdeburg
    Hufe a clear money rent of 15 Rthl, say fifteen Reichsthaler in Courant, to the manorial treasury,
    and that in half-yearly instalments at Midsummer and Christmas, each time seven before twelve good
    Groschen.


    4. The hereditary leaseholders or takers are at liberty to make over these acquired Hufen in several
    separate parts to others, and to come to such agreement with these new takers, to their own advantage,
    as best they can.


    5. It is however expressly laid down that when the hereditary leaseholders wish to make over parcels
    to other takers or successors, this shall at once be notified to the lordship, so that in regard to
    arrears and to debts charged upon the grounds no error may arise and everything may be kept in good
    order. Every sale concluded without the lordship''s prior knowledge shall be held wholly invalid and
    as not concluded at all.


    6. Both the present hereditary leaseholders and the future takers must effect their establishments,
    for now and for the future, at their own cost, and they shall receive for this neither remission of
    the hereditary rent nor any other building assistance; they may however employ for this purpose the
    timber standing upon the Hufen received in hereditary lease, which belongs to them in property, all
    of it and without any exception.'

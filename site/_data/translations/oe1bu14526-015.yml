- page: 3
  en: 'in the best possible manner themselves, without the ground lordship taking the least part therein,
    since it is bound only to allot to them the total of the Hufen; the ground lordship does however undertake
    to bear the whole costs of this allotment.


    13. The present hereditary leaseholders, as also the other takers, are at liberty to alienate their
    holdings to others in any manner they please; but upon every change of possession, whether by sale
    or by exchange, the tenth Groschen of the purchase money or of the exchange sum must be paid down
    to the ground lordship as a transfer fee (Laudemium), and the lordship holds itself always to the
    new taker, whose business it remains not to pay out the purchase money to the seller until the Laudemium
    has been settled.


    14. No redemption of the hereditary rent shall take place; the fifteen Reichsthaler hereditary rent
    per Hufe once fixed remain irredeemable for everlasting times. 15. The hereditary leaseholders, their
    subsequent purchasers and their descendants remain for ever entirely free of all hereditary subjection,
    and may not render the ground lordship the least manorial service, nor deliver any produce in kind;
    they are however without exception subject for ever to the jurisdiction of the manorial lordship (Dominium).'
  numbers:
  - '13.'
  - '14.'
  - '15'
- page: 4
  en: '16. Besides the Hufen upon which they pay rent, there shall be allotted to the newly established
    communities, once and for all, namely


    1. for the schoolmaster 6 Morgen


    2. for the village mayor 6 Morgen


    3. for the church [uncertain: Hust] 1 Morgen; accordingly for each new village which shall keep a
    village mayor and a schoolmaster thirteen Morgen Magdeburg, free of charge and free of rent.


    17. The hereditary leaseholders are bound to lay out and build the new villages according to regulation
    in two even lines.


    18. Their drink, in beer and brandy, the hereditary leaseholders and their successors in possession
    must always take from the manorial brew- and brandy-house or tavern, and for every quart of brandy
    brought in from outside estates they shall pay down to the ground lordship a penalty of one Reichsthaler,
    and for every barrel of beer five Reichsthaler.


    19. The hereditary leaseholders renounce, for themselves and their successors, any and every remission
    in cases of misfortune, by whatever name these may be called, and no compensation or remission of
    the hereditary rent can ever accrue to them.


    20. The costs of the contract, of its confirmation and of the official copy, the hereditary leaseholders
    undertake to settle.'

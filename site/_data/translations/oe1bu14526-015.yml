- page: 6
  en: 'Christoph Zander four Hufen in and about Neudorff xxx Michael Mathes two Hufen xxx Gottfried Wolter
    two Huf. xxx Christoph Öhlke four Hufen xxx Johann Pfahl one Hufe xxx Johann Hoffmann xxx


    Martin Bloch xxx


    Pro Memoria. From the 270 Hufen granted there fall away those Hufen which the entrepreneurs have already,
    with the consent of the manorial lordship (Dominium), separated off and dismembered, namely


    1. to Kuh[uncertain: n]t and associates: 42 Hufen


    2. Henrichs: 6.


    3. Christoph Schönfisch 1 Hufe 5 Morgen 9 R.


    4. Kienast and associates: 40


    5. Kienast and associates: 4


    6. Tschachmann: 20


    7. Seymert: 3


    8. Hemmerling and Schiritz: 18


    9. Stephyn and associates: 10


    10. v. Leski: 6


    11. Kommer: 6 Hufe 20 Morgen = 156 Hufe 25 Morgen 9 rods; there remain over for the entrepreneurs
    113 Hufe 4 Morgen 17 R. Schenck'

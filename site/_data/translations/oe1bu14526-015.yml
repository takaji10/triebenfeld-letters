- page: 5
  en: '21. So long as the hereditary leaseholders and their successors in possession shall fulfil these
    obligations described above, they shall be protected by the ground lordship in their rights in every
    quarter, and defended and held harmless against every man''s real claims. Should they however remain
    in arrears with the yearly hereditary canon for longer than two years, they shall thereupon forfeit
    this hereditary lease, and the ground lordship is entitled to call it in without contradiction and
    to let it out otherwise.


    22. For the correct and prompt payment of the purchase money and of the fixed hereditary rents the
    hereditary leaseholders and the future takers, as also their successors in possession, are liable
    in perpetuity, one for all and all for one, that is to say jointly and severally.


    Both parties promise to keep the foregoing hereditary-lease contract firmly and inviolably, and renounce
    all legal evasions available against it, particularly the objection of an injury suffered above or
    below the half, and have signed themselves below in their own hands. Trąbczyn, the 6th of April 1805.


    v. Triebenfeld


    Carl Titz


    Lorenz Goll[illegible]


    Jozef Exte[uncertain: q]s.


    Paweł [uncertain: in]kobowski


    Antoni Białkowski


    Konstanty Oczykoski mpp.


    Elisabetta di Simony 3 Hufen.


    xxx Andreas Berlinsky


    xxx Daniel Poill


    xxx Johan Friedrich Melzer 2 Hufen'

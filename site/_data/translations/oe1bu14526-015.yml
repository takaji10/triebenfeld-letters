status: draft
segments:
- page: 1
  en: 'Between the Royal Councillor of War and Forests von Triebenfeld, General Plenipotentiary of His
    Most Serene Highness the reigning Fürst zu Hohenlohe Ingelfingen, and the hereditary lessees undersigned
    at the end, the following heads of agreement were this day agreed upon and concluded, subject to the
    approval of His Serene Highness.


    1. His Most Serene Highness, through His General Plenipotentiary, cedes to the undersigned hereditary
    lessees, out of the lands belonging to His estates Trąbczyn, Łazy, Osiny, Neudorff and Przybisław,
    consisting in fields, meadows and woods etc., the surface content of 270 Hufen, say two hundred and
    seventy Hufen Magdeburg measure, the Hufe reckoned at thirty Morgen and the Morgen at 180 rods.


    2. As purchase money the hereditary lessees named below pay to His Serene Highness for each Magdeburg
    Hufe 300 Rthl, say three hundred Reichsthaler Royal Courant.


    3. Each hereditary lessee and their successors in possession shall pay annually from each Magdeburg
    Hufe a clear money rent of 15 Rthl., say fifteen Reichsthaler in Courant, into the seigneurial treasury,
    and that in half-yearly instalments at Johanni and Christmas, each time seven before twelve good Groschen.


    4. The hereditary lessees or takers are at liberty to cede these Hufen so acquired in several separate
    parts to others, and to come to terms with these new takers to their own advantage as best they can.


    5. It is however expressly stipulated that when the hereditary lessees wish to cede parcels of land
    to other takers or subsequent purchasers, such shall at once be notified to the lordship, so that
    no error may arise in respect of arrears and of debts resting upon the lands, and that all may be
    well ordered. Every sale concluded without the lordship''s prior knowledge shall be regarded as wholly
    invalid and as not concluded at all.


    6. Both the present hereditary lessees and also the future takers must effect their establishments,
    for the present and for the future, at their own cost, and shall receive for this neither remission
    of the hereditary rent nor any other building assistance; however, they may [uncertain: Bonnen — may]
    apply to this purpose the timber found upon the Hufen received in hereditary lease, as which belongs
    to them in property altogether without any exception.'
- page: 2
  en: '7. These Hufen taken in hereditary lease shall be measured out to the hereditary lessees forthwith
    and delivered into possession.


    8. On the arable land and meadows the rents shall be duly paid already in this current year; but on
    the woodland and on the other lands four free years are allowed, as after which time each taker must
    have cleared and brought under cultivation the woodland lands purchased by him, and therefore after
    the lapse of the four free years the rents on these lands must likewise be paid at fifteen Thaler
    per Hufe, and paid into the seigneurial treasury in half-yearly instalments of 7 rt 12 gg.


    9. Besides the annual hereditary rents, the hereditary lessees undertake for themselves and their
    descendants to render all Royal and other dues charged upon these estates, be their names what they
    may, and such shall be laid upon the Hufen and duly apportioned.


    10. Since all the lands are dismembered and let out against rents, the hereditary lessees may make
    no claim to any rights of pasture or of timber, but must graze their cattle solely upon their own
    lands, and must seek to raise and to conserve their own timber.


    11. The hereditary takers are granted the liberty to erect a brick-kiln upon their lands and to burn
    the bricks required for the first building, without anything having to be paid for this to the ground-lordship.


    12. The hereditary lessees must divide among themselves in the best possible'
- page: 3
  en: 'in the best possible manner the two hundred and seventy Hufen Magdeburg they have taken up, without
    the ground-lordship concurring therein in the least, inasmuch as the latter is only bound to allot
    to them the total of the [uncertain: Husten — Hufen]; the ground-lordship however undertakes to bear
    the entire costs of this allotment.


    13. The present hereditary lessees, as well as the other takers, are at liberty to alienate their
    holdings to others in any manner they please; but upon every change of possession, whether by sale
    or by exchange, the tenth Groschen of the purchase money or of the exchange amount must be paid to
    the ground-lordship as a laudemium, and the latter holds itself always to the new taker, whose business
    it remains not to pay out the purchase money to the seller before the laudemium has been settled.


    14. No redemption of the hereditary rent shall take place; the fifteen Reichsthaler of hereditary
    rent per Hufe once fixed remain irredeemable for perpetual times. 15. The hereditary lessees, their
    subsequent purchasers and their descendants remain for ever wholly free of all hereditary subjection,
    and shall not render the ground-lordship the least manorial service, nor deliver any produce in kind;
    they are however without exception subject for ever to the jurisdiction of the Dominium.'
- page: 4
  en: '16. Besides the Hufen on which they pay rent, there shall be allotted to the newly to be established
    communities, once and for all, namely


    1. for the schoolmaster 6 Morgen


    2. for the Schulze 6 Morgen


    3. for the church [uncertain: Hust] 1 Morgen — in the middle, for each new village which shall maintain
    a Schulze and a schoolmaster, thirteen Morgen Magdeburg, free of charge and free of rent.


    17. The hereditary lessees are bound to lay out and build up the new villages according to regulation
    in two equal lines.


    18. Their drink in beer and brandy the hereditary lessees and their successors in possession must
    always take from the seigneurial brew- and brandy-house or tavern, and for every quart of brandy brought
    in from outside estates shall pay a fine of one Reichsthaler to the ground-lordship, and for every
    barrel of beer five Reichsthaler.


    19. The hereditary lessees renounce, for themselves and their successors, each and every remission
    in cases of misfortune, whatever names these may bear, and there can [text as written: can] accrue
    to them a bonification or remission of hereditary rent.


    20. The costs of the contract, of its confirmation and of its issuing, the hereditary lessees undertake
    to settle.'
- page: 5
  en: '21. So long as the hereditary lessees and their successors in possession shall fulfil these above-described
    obligations, they shall be protected by the ground-lordship in their rights everywhere, and represented
    and held harmless against any man''s real claims. But should they remain in arrears with the annual
    hereditary canon for longer than two years, they shall thereupon forfeit this hereditary lease, and
    the ground-lordship is entitled to resume the same without contradiction and to let it out elsewise.


    22. For the correct and prompt payment of the purchase money and of the fixed hereditary rents the
    hereditary lessees and the future takers, as well as their successors in possession, are perpetually
    liable one for all and all for one, that is, jointly and severally.


    Both parties promise to keep the foregoing hereditary lease contract firmly and inviolably, and [uncertain:
    entfügen — renounce] all legal subterfuges available against it, particularly the objection of an
    injury suffered above and below the half, and have subscribed themselves below in their own hands.
    Trąbczyn, the 6th of April 1805.


    v Triebenfeld


    Carl Titz


    Lorenz Goll[illegible]


    Jozef Exte[uncertain: q]s.


    Paweł [uncertain: in]kobowski


    Antoni Białkowski


    Konstanty Oczykoski mpp.


    Elisabetta di Simony 3 Hufen.


    xxx Andreas Berlinsky


    xxx Daniel Poill


    xxx Johan Friedrich Melzer 2 Huffen'
- page: 6
  en: 'Christoph Zander four Hufen in and about Neudorff xxx Michael Mathes two Hufen xxx Gottfried Wolter
    two Huf xxx Christoph Öhlke four Hufen xxx Johann Pfahl one Hube xxx Johann Hoffmann xxx


    Martin Bloch xxx



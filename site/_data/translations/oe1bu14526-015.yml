status: draft
segments:
- page: 1
  en: 'Between the Royal Councillor of War and Forests von Triebenfeld, general attorney of His Most Serene
    Highness the reigning Prince of Hohenlohe-Ingelfingen, and the hereditary lessees undersigned at the
    end, the following points were this day agreed upon and concluded, subject to the approval of His
    Serene Highness.


    1. His Most Serene Highness, through His general attorney, cedes to the undersigned hereditary lessees,
    out of the lands belonging to His estates Trąbczyn, Łazy, Osiny, Neudorff and Przybisław, consisting
    in fields, meadows and woods etc., the surface area of 270 Hufen, say two hundred and seventy Hufen
    Magdeburg measure, the Hufe reckoned at thirty Morgen and the Morgen at 180 rods.


    2. As purchase money, the hereditary lessees named below shall pay to His Serene Highness for each
    Magdeburg Hufe 300 Rthl, say three hundred Reichsthaler Royal Courant.


    3. Each hereditary lessee and his successors in possession shall render annually from each Magdeburg
    Hufe a clear money rent of 15 Rthl, say fifteen Reichsthaler in Courant, to the lordship''s treasury,
    and that in half-yearly instalments at Midsummer and Christmas, each time seven and twelve good Groschen.


    4. The hereditary lessees or takers are at liberty to cede these acquired Hufen in several separate
    parts to others, and to come to terms with these new takers to their own advantage as best they can.


    5. It is however expressly stipulated that when the hereditary lessees wish to cede parcels to other
    takers or successors, this shall at once be notified to the lordship, so that with regard to arrears
    and debts charged upon the lands no error may arise and everything may be duly ordered. Any sale concluded
    without the lordship''s foreknowledge shall be held wholly invalid and as not concluded at all.


    6. Both the present hereditary lessees and also the future takers must effect their establishments,
    for the present and for the future, at their own cost, and shall receive for this neither remission
    of the hereditary rent nor any other building assistance; they may, however, employ for this purpose
    the timber standing upon the Hufen received in hereditary lease, as that which belongs to them in
    property altogether and without any exception.'
- page: 2
  en: '7. These Hufen taken in hereditary lease shall be measured out to the hereditary lessees forthwith
    and delivered into their possession.


    8. From the arable land and meadows the rents shall be duly paid in this current year already; from
    the woodland, however, and from the other lands, four free years are allowed, after which time each
    taker must have cleared and brought under cultivation the woodland he has purchased, and therefore,
    after the lapse of the four free years, the rents from these lands must likewise be rendered at fifteen
    thaler per Hufe, and paid in half-yearly instalments of 7 rt 12 gg. to the lordship''s treasury.


    9. Besides the annual hereditary rents, the hereditary lessees undertake for themselves and their
    descendants to discharge all royal and other dues charged upon these estates, by whatever name they
    may be called, and such shall be laid upon the Hufen and duly apportioned.


    10. Since all the lands are dismembered and let out against rents, the hereditary lessees may make
    no claim to any rights of pasture or of wood-taking, but must graze their cattle solely upon their
    own lands, and must seek to raise and conserve their timber themselves.


    11. The hereditary takers are granted the liberty to set up a brick kiln upon their lands, and to
    burn the bricks needed for the first building, without anything having to be paid for this to the
    ground lordship.


    12. The hereditary lessees must divide the two hundred and seventy Magdeburg Hufen they have taken
    among themselves in the best possible'
- page: 3
  en: 'best possible manner themselves, without the ground lordship concurring in this in the least, inasmuch
    as the latter is only bound to allot to them the total of the Hufen; the ground lordship undertakes,
    however, to bear the entire costs of this allotment.


    13. The present hereditary lessees, as also the other takers, are at liberty to alienate their holdings
    to others in any manner they please; but upon every change of possession, whether by sale or by exchange,
    the tenth Groschen of the purchase money or of the amount exchanged must be paid to the ground lordship
    as a transfer fee (Laudemium), and the latter holds itself always to the new taker, whose business
    it remains not to pay out the purchase money to the seller until the Laudemium has been settled.


    14. No redemption of the hereditary rent shall take place; the fifteen Reichsthaler of hereditary
    rent per Hufe once fixed remain irredeemable for perpetual time. 15. The hereditary lessees, their
    subsequent purchasers and descendants remain for ever entirely free of all hereditary subjection,
    and may also not render the ground lordship the least manorial service, nor deliver any produce whatsoever;
    they are, however, without exception subject for ever to the jurisdiction of the manorial lordship
    (Dominium).'
- page: 4
  en: '16. Besides the Hufen upon which they pay rent, there shall be allotted to the newly to be established
    communities, once and for all, namely


    1. for the schoolmaster 6 Morgen


    2. for the village mayor 6 Morgen


    3. for the church [uncertain: Hust] 1 Morgen; thus for each new village which shall maintain a village
    mayor and a schoolmaster, thirteen Morgen Magdeburg, free of charge and free of rent.


    17. The hereditary lessees are bound to lay out and build up the new villages, as prescribed, in two
    equal lines.


    18. Their drink in beer and brandy the hereditary lessees and their successors in possession must
    always take from the lordship''s brewery and distillery or tavern, and for every quart of brandy brought
    in from outside estates they shall pay to the ground lordship a penalty of one Reichsthaler, and for
    every barrel of beer five Reichsthaler.


    19. The hereditary lessees renounce, for themselves and their successors, any and every remission
    in cases of misfortune, by whatever name they may be called, and no allowance or remission of hereditary
    rent can ever accrue to them.


    20. The hereditary lessees undertake to settle the costs of the contract, of its confirmation and
    of its engrossment.'
- page: 5
  en: '21. So long as the hereditary lessees and their successors in possession shall fulfil the obligations
    above described, they shall be protected by the ground lordship in their rights in every respect,
    and be defended and held harmless against any man''s real claims. Should they, however, remain in
    arrears with the annual hereditary canon for longer than two years, they shall thereupon forfeit this
    hereditary lease, and the ground lordship is entitled to take the same in without demur and to let
    it out elsewhere.


    22. For the correct and prompt payment of the purchase money and of the hereditary rents as fixed,
    the hereditary lessees and the future takers, as also their successors in possession, are perpetually
    liable one for all and all for one, that is, jointly and severally.


    Both parties promise to keep the foregoing hereditary-lease contract firmly and inviolably, and renounce
    all legal evasions available against it, in particular the objection of an injury suffered above or
    below the half, and have subscribed themselves below with their own hands. Trąbczyn, the 6th of April
    1805.


    v. Triebenfeld


    Carl Titz


    Lorenz Goll[illegible]


    Jozef Exte[uncertain: q]s.


    Paweł [uncertain: in]kobowski


    Antoni Białkowski


    Konstanty Oczykoski mpp.


    Elisabetta di Simony 3 Hufen.


    xxx Andreas Berlinsky


    xxx Daniel Poill


    xxx Johan Friedrich Melzer 2 Hufen'
- page: 6
  en: 'Christoph Zander four Hufen in and about Neudorff xxx Michael Mathes two Hufen xxx Gottfried Wolter
    two Hufen xxx Christoph Öhlke four Hufen xxx Johann Pfahl one Hufe xxx Johann Hoffmann xxx


    Martin Bloch xxx


    Pro Memoria. From the 270 Hufen granted there fall away those Hufen which the entrepreneurs have already
    parcelled out singly and dismembered with the consent of the manorial lordship (Dominium), namely


    1. to Kuh[uncertain: n]t and associates: 42 Hufen


    2. Henrichs: 6.


    3. Christoph Schönfisch 1 Hufe 5 Morgen 9 R


    4. Kienast and associates: 40


    5. Kienast and associates: 4


    6. Tschachmann: 20


    7. Seymert: 3


    8. Hemmerling and Schiritz: 18


    9. Stephyn and associates: 10


    10. von Leski: 6


    11. Kommer: 6 Hufen 20 Morgen = 156 Hufen 25 Morgen 9 rods; there remain over for the entrepreneurs
    113 Hufen 4 Morgen 17 R. Schenck'

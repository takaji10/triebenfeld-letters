status: draft
segments:
- page: 1
  en: 'Between the Royal Councillor of War and Forests von Triebenfeld, General Plenipotentiary of His
    Most Serene Highness the reigning Fürst zu Hohenlohe Ingelfingen, and the hereditary lessees undersigned
    at the end, the following articles were this day agreed and concluded, subject to the approbation
    of His Serene Highness.


    1. His Most Serene Highness, through His General Plenipotentiary, makes over to the undersigned hereditary
    lessees, out of the grounds belonging to His estates Trąbczyn, Łazy, Osiny, Neudorff and Przybisław,
    consisting in fields, meadows and woods etc., the superficial content of 270 Hufen, say two hundred
    and seventy Hufen Magdeburg measure, the Hufe reckoned at thirty Morgen and the Morgen at 180 Ruthen.


    2. As purchase money the hereditary lessees named below pay to His Serene Highness for each Hufe Magdeburg
    300 Rthl, say three hundred Reichsthaler Royal Courant.


    3. Each hereditary lessee and their successors in possession shall pay yearly from each Magdeburg
    Hufe a clear money rent of 15 Rthl, say fifteen Reichsthaler in Courant, to the manorial treasury,
    and that in half-yearly instalments at Johanni and Christmas, each time seven [uncertain: before]
    twelve good Groschen.


    4. The hereditary lessees or takers are at liberty to make over these Hufen so acquired in several
    separate parts to others, and to come to terms with these new takers to their own advantage as best
    they can.


    5. It is however expressly laid down that when the hereditary lessees wish to make over parcels to
    other takers or subsequent holders, such shall at once be notified to the manorial lordship, so that
    no error may arise in respect of arrears and of debts charged upon the grounds, and that all may be
    well ordered. Every sale concluded without the foreknowledge of the lordship shall be held wholly
    invalid and as not concluded at all.


    6. Both the present hereditary lessees and also the future takers must effect their establishments,
    for now and for the future, at their own cost, and receive for this neither remission of the hereditary
    rent nor any other building assistance; they may however employ for this purpose the timber standing
    upon the Hufen received in hereditary lease, which without any exception belongs to them all in property.'
- page: 2
  en: '7. These Hufen taken in hereditary lease shall be forthwith measured out to the hereditary lessees
    and delivered into their possession.


    8. For the arable land and meadows the rents shall be duly paid already in the current year; but for
    the woodland and for the other grounds four free years are allowed, by the end of which time each
    taker must have cleared and brought under cultivation the woodland grounds purchased by him; wherefore,
    after the lapse of the four free years, the rents for these grounds must likewise be paid at fifteen
    Thaler per Hufe, and discharged to the manorial treasury in half-yearly instalments of 7 rt 12 gg.


    9. Besides the annual hereditary rents, the hereditary lessees undertake, for themselves and their
    descendants, to bear all Royal and other imposts charged upon these estates, by whatever name they
    may be called, and such shall be laid upon the Hufen and duly apportioned.


    10. Since all the grounds are dismembered and let out against rents, the hereditary lessees may make
    no claim to any rights of pasture or of timber, but must graze their cattle solely upon their own
    grounds, and must seek to grow and to conserve their own timber.


    11. The hereditary takers are granted the liberty to set up a brick-kiln upon their grounds, and to
    burn the bricks needed for the first building, without anything having to be paid for this to the
    ground lordship.


    12. The hereditary lessees must divide the two hundred and seventy Hufen Magdeburg taken over among
    themselves in the best possible'
- page: 3
  en: 'best possible manner themselves, without the ground lordship concurring therein in the least, inasmuch
    as the latter is only bound to allot to them the total of the Hufen; the ground lordship however undertakes
    to bear the whole costs of this allotment.


    13. The present hereditary lessees, as also the remaining takers, are at liberty to alienate their
    holdings to others in any manner they please; but upon every change of possession, whether by sale
    or by exchange, the tenth Groschen of the purchase money or of the exchange sum must be paid to the
    ground lordship as a Laudemium, and the said lordship holds itself always to the new taker, whose
    business it remains not to pay out the purchase money to the seller before the Laudemium has been
    settled.


    14. No redemption of the hereditary rent shall take place; the fifteen Reichsthaler of hereditary
    rent per Hufe once fixed remain irredeemable for everlasting time. 15. The hereditary lessees, their
    subsequent purchasers and descendants remain for ever entirely free of all hereditary subjection,
    and may also not render the ground lordship the least manorial service, nor deliver any produce in
    kind; they are however without exception subject for ever to the jurisdiction of the Dominium.'
- page: 4
  en: '16. Besides the Hufen for which they pay rent, there shall be allotted to the newly established
    communities, once and for all, namely


    1. for the schoolmaster 6 Morgen


    2. for the Schulze 6 Morgen


    3. for the church [uncertain: Hust] 1 Morgen — thus for each new village which shall maintain a Schulze
    and a schoolmaster, thirteen Morgen Magdeburg, free of charge and free of rent.


    17. The hereditary lessees are bound to lay out and build up the new villages according to prescription
    in two even lines.


    18. Their drink in beer and brandy the hereditary lessees and their successors in possession must
    always take from the manorial brewhouse and distillery or tavern, and shall pay to the ground lordship
    as a penalty, for every quart of brandy brought in from other estates, one Reichsthaler, and for every
    tun of beer five Reichsthaler.


    19. The hereditary lessees renounce, for themselves and their successors, any and every remission
    in cases of misfortune, by whatever name these may be called, and no bonification or remission of
    the hereditary rent can ever avail them.


    20. The costs of the contract, of its confirmation and of its execution the hereditary lessees undertake
    to settle.'
- page: 5
  en: '21. So long as the hereditary lessees and their successors in possession shall fulfil these above-described
    obligations, they shall be protected by the ground lordship in their rights in all places, and defended
    and held harmless against every man''s real claims. Should they however remain in arrears with the
    annual hereditary canon for longer than two years, they shall thereupon forfeit this hereditary lease,
    and the ground lordship is entitled to call the same in without contradiction and to let it out otherwise.


    22. For the correct and prompt payment of the purchase money and of the hereditary rents laid down,
    the hereditary lessees and the future takers, as also their successors in possession, are perpetually
    liable one for all and all for one, that is to say jointly and severally.


    Both parties promise to keep the foregoing hereditary-lease contract firmly and inviolably, and renounce
    all legal evasions available against it, in particular the objection of an injury above or below the
    half, and have subscribed themselves below in their own hands. Trąbczyn, the 6th of April 1805.


    v Triebenfeld


    Carl Titz


    Lorenz Goll[illegible]


    Jozef Exte[uncertain: q]s.


    Paweł [uncertain: in]kobowski


    Antoni Białkowski


    Konstanty Oczykoski mpp.


    Elisabetta di Simony 3 Hufen.


    xxx Andreas Berlinsky


    xxx Daniel Poill


    xxx Johan Friedrich Melzer 2 Huffen'
- page: 6
  en: 'Christoph Zander four Hufen in and about Neudorff xxx Michael Mathes two Hufen xxx Gottfried Wolter
    two Huf xxx Christoph Öhlke four Hufen xxx Johann Pfahl one Hube xxx Johann Hoffmann xxx


    Martin Bloch xxx


    P[ro] M[emoria] From the 270 Hufen granted there fall away those Hufen which the entrepreneurs have
    already parcelled out singly and dismembered with the consent of the Dominium, namely


    1. to Kuh[uncertain: n]t et Consorten: 42 Hufen


    2. Henrichs: 6.


    3. Christoph Schönfisch 1 Hufe 5 Morg 9 R


    4. Kienast et Consorten: 40


    5. Kienast et Consorten: 4


    6. Tschachmann: 20


    7. Seymert: 3


    8. Hemmerling et Schiritz: 18


    9. Stephyn et Consorten: 10


    10. v. Leski: 6


    11. Kommer: 6 Hufe 20 Morg = 156 Hufe 25 Morgen 9 Ruten; there remain over for the entrepreneurs 113
    Hufe 4 Morg 17 R. Schenck'

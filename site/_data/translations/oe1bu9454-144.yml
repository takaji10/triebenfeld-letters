  en: 'Most Serene Prince!


    Most gracious Prince and Lord! I received today Your Most Serene Highness''s command of the 31st of
    last month. Tomorrow morning I shall go to the Greiff von Schulenburg, deliver to him the letter addressed
    to him, and await his more particular declaration. By the next post I shall not fail to submit most
    humbly the result of my conference. [uncertain: cke ich erſtrete] .


    Your Most Serene [uncertain: Sächleicht]. Berlin, the 3rd of November 1834. most humble the


    Amelang'

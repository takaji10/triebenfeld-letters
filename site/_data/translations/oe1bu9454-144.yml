- page: 1
  en: '144 Most Serene Prince!


    Most gracious Prince and Lord! Your Most Serene Highness''s command of the 31st of last month I received
    today. Tomorrow morning I shall go to the Count von Schulenburg, hand over to him the letter addressed
    to him, and await his further declaration. By the next post I shall not fail to report in most humbl[e]
    wise the result of my conference. I remain, until death,


    Your Most Serene Highness''s Berlin, the 3rd of November 1804. most humble and obedient servant


    Amelang'

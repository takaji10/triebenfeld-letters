- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    My foreboding that every effort here to undo the notorious settlement would be in vain is unhappily
    borne out. The villains have hedged it about with so many clauses that even with the greatest sacrifices
    one may not hope to win the least advantage. It is a piece of knavery without equal — the court rescript
    concerning the deposit was here — notwithstanding which the base settlement was concluded — Glenck
    submitted it on the 6th for approbation and begged that its execution be hastened as much as possible
    and that it be drawn up for both parties. Your Most Serene Highness''s letter was here on the 8th,
    in which you protested against the settlement.


    This was quickly laid aside; they approved and dispatched the cursed settlement with a plaintiff''s
    speed, and sent it in to the court. What am I now to do? Complain against it, go to Berlin and make
    a noise — none of that helps, one only makes oneself ridiculous. Good men, of whom there are scarcely
    2 here, pity Your Serene Highness, but the great crowd [uncertain: to bed] and [uncertain: sells off]
    everyone who takes part in this affair. Oh, I could go mad.'

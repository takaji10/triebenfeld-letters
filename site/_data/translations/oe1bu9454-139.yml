- page: 1
  en: '139


    Most Serene Prince


    Most gracious Lord!


    My foreboding, that all efforts here to undo the famous settlement would be in vain, is unhappily
    confirmed. The villains have hedged everything about with such clauses that, even at the greatest
    sacrifices, one may not hope to gain the least advantage. It is a piece of knavery without equal —
    the court rescript concerning the deposition was here — notwithstanding which the base settlement
    was concluded — Glenck submitted it on the 6th for approval and begged for the utmost expedition in
    executing the same and having it made out as an official copy for both parties. Your Most Serene Highness''s
    letter was here on the 8th, in which you protested against the settlement.


    This was quickly laid aside, and the accursed settlement was approved and dispatched with plaintiff''s
    speed, and sent in to the court. What am I now to do? Complain against it, go to Berlin and make a
    noise — all that avails nothing; one only makes oneself ridiculous. Good men, of whom there are scarcely
    2 here, pity Your Serene Highness, but the great crowd go to bed and sell off everyone who takes part
    in this affair. Oh, I could go mad.'

- page: 3
  en: 'other — but as I see it, they are all equally to blame. Here I care to remain no longer; rather,
    if Glenck does not come, I shall set off towards evening for Pszczew, so as to neglect nothing there
    — for with Bornstädt there will be much noise; they have proceeded with these just as perversely as
    with the Trąbczyn people,


    that is to say, they sued for eviction but neither had a liquidum fixed, still less applied for execution
    — everything here lies in darkness, and it will cost unspeakable trouble to get this quickly cleared
    up. From Pszczew I must come here once more, to dislodge Bornstädt and to see what caution Broniewski
    puts up.


    This very moment Glenck has arrived — he knows neither what to say in his own excuse, still less what
    to propose for the redress of the matter. In short, the man feels nothing, though I could vex myself
    to death. He has begged Melzer to [uncertain: hush up] everything and to uphold the settlement — this
    I know for certain. Glenck also let slip that he had seen the court decree before he submitted the
    settlement for approval.'

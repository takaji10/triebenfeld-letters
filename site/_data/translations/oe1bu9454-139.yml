- page: 2
  en: 'The basest thing is now that Glenck does not come — although he received my letters here, he would
    not wait, but went off to Betsche. I have sent express couriers and a messenger-woman after him —
    he does not come, and does not answer a syllable. Here I [uncertain: gnaw] sit here in vain — God,
    it is dreadful what these people permit themselves. The [uncertain: fullest] thing is that not one
    of them will admit any share in this rascally piece of work. Metzer rails that Wünster did not make
    the settlement better, and damns Glenck to all eternity for not having concluded it sub sper[atione]
    [uncertain: sub speirati] — He says he had meant to make the settlement and to declare that he had
    indeed no power of attorney but would furnish it afterwards / by which one would have had room enough
    to manoeuvre; but this Glenck did not accept. Hence Glenck concluded entirely alone, without his knowledge.


    He could not deny that if the deposit had been made, the outcome would have been very good for the
    Prince, since even Broniewski had already declared that he would drown himself or shoot himself through
    the head, and leave his wife and children to the Prince.


    For the rest, Metzer says that Wunster made the settlement and arranged everything so — in short,
    each shifts it onto the'

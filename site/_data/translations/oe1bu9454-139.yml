- page: 3
  en: 'other — but as I see it, they are all equally [uncertain: culpable]. Here I no longer care to remain;
    rather, if Glenck does not come, I shall set off toward evening for Betsche, so as to neglect nothing
    there — for with Bornstädt there will be much clamour; they have proceeded with him exactly as wrongly
    as with the men of Trąbczyn.


    That is to say, they sued for eviction, but neither had a liquidated sum established nor, still less,
    applied for execution — everything here lies in the dark, and it will cost unspeakable trouble to
    bring it quickly into order. From Betsche I must go back here once more, to dislodge Bornstädt and
    to see what security [uncertain: Braniewehr] puts up.


    This very moment Glenck has arrived — He knows neither what to say in his excuse, nor, still less,
    anything to propose for the redress of the affair. In short, the man feels nothing, though I could
    vex myself to death. He has begged Metzer to [uncertain: reject] everything and to uphold the settlement.
    — This I know for certain. Glenck also let slip that he had seen the court decree before he submitted
    the settlement for'

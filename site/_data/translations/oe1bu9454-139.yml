- page: 4
  en: 'in. — But Melzer, he says, had said that — although it was not stated therein that the causas arresti
    were to be produced, it nevertheless went without saying that they would have to be produced afterwards;
    with that, however, he would never concern himself. One could go mad over this twaddle — for Melzer
    did after all admit that, had one been able to deposit even for only 6 days, Broniewski was lost,
    and would have taken whatever one gave him out of grace.


    In short, it is enough to vex one to death, when one has long dealings with this base, rapacious rabble.
    To the question how long the liquidation suit would last, Melzer opines very cold-bloodedly 6 to 8
    years. This is precisely the reason why the rascals have twisted the matter so, that they may keep
    Your Serene Highness always in their hands and empty your pockets. I remain, until death,


    Your Most Serene Highness''s


    Poznań, the 22nd of July


    1804


    faithful, humble and obedient servant


    v Triebenfeld'

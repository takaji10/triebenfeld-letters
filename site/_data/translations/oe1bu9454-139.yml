- page: 4
  en: 'approbation. — But Metzer had said that, although it did not stand in it that the grounds of arrest
    were to be produced, it nevertheless went without saying that they would have to be furnished afterwards;
    with that, however, he would never concern himself. One could go mad over this [uncertain: babble]
    — for Metzer did after all admit that, had one been able to make the deposit even for only 6 days,
    Broniewski would have been lost and would have taken what was given him out of grace.


    In short, it is enough to vex one to death, when one has long to do with this low, rapacious rabble.
    To the question how long the liquidation proceedings would last, Metzer opined, very cold-bloodedly,
    6 to 8 years. This is precisely the reason why the rascals have twisted the matter so, that they may
    keep Your Serene Highness always in their hands and be able to empty your pockets. I


    I remain, until death,


    Your Most Serene Highness''s


    Posen, the 22nd of July


    1804


    faithful, humble and obedient servant


    v. Triebenfeld'

- page: 2
  en: 'The most contemptible thing now is that Glenck does not come — although he received my letters
    here, he would not wait, but has gone to Pszczew. I have sent express couriers and messengers after
    him — he does not come, nor does he answer a syllable. Here I [illegible] sit here in vain — God,
    it is dreadful what these people permit themselves. The maddest part is that not one of them will
    be to blame for this rascally business. Melzer rails that Wunster did not draw the settlement better,
    and damns Glenck to all eternity for not having concluded it sub spe rati — he says he had meant to
    make the settlement and to say / I have indeed no power of attorney, but I shall produce it afterwards
    / whereby one would have had room enough to manoeuvre, but this Glenck did not accept. Hence Glenck
    concluded it entirely alone, without his knowledge.


    He cannot deny that, had the deposition been carried out, the outcome would have been very good for
    the Prince, since Broniewski himself had already declared that he would drown himself or shoot himself
    in the head, and leave his wife and children behind to the Prince.


    For the rest, Melzer says Wunster concluded the settlement and set it all in train — in short, each
    of them shifts it onto the'

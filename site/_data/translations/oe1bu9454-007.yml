- page: 2
  en: 'misery has now passed all bounds, the more so as I must now also give up the hope of making my
    situation known to my father by a spoken account of it. I no longer venture to implore Your Most Serene
    Highness for help; but the modest request I repeat most humbly, that my father''s address be conveyed
    to me through some one of Your subordinates, so that I need no longer be burdensome to Your Serene
    Highness with [uncertain: Klape], which it costs me a dreadful effort of self-conquest to do.


    With the deepest reverence I remain Your Most Serene Highness''s


    wholly most humble and obedient servant (fem.)


    Breslau, the 20th of March 1815.


    Charlotte von Triebenfeld.'

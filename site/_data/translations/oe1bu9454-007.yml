- page: 1
  en: 'Most Serene Prince!


    Most gracious Prince and Lord!


    Directed anew by a letter of my father''s to Your [uncertain: kurtz] Serene Highness''s grace, I nevertheless
    venture to turn to Your Serene Highness in writing, although I have as yet not been honoured with
    any answer from Your Serene Highness. This is already my third letter, and I should certainly not
    carry my [uncertain: thirtiness] so far, if only I had in any way my father''s address, and could
    write without troubling Your Serene Highness. My'
  names:
  - de: Eus kurtz Durchlaucht
    en: 'Your [uncertain: kurtz] Serene Highness'

status: draft
segments:
- page: 1
  en: Most Serene Prince! Most gracious Prince and Lord! Once again directed by a letter from my father
    to Your Serene Highness's grace, I nevertheless venture to turn to Your Serene Highness in writing,
    although I have as yet not been honoured with any answer from Your Serene Highness. This is already
    my third letter, and I should certainly not press my boldness so far, if only I had in any way the
    address of my father, and could write to him without troubling Your Serene Highness. My
- page: 2
  en: 'misery has now overstepped all bounds, the more so since I must now also give up the hope of making
    my situation known to my father by a spoken account of it. I no longer dare to implore Your Most Serene
    Highness for aid; but the modest request I repeat most humbly, that Your Serene Highness would let
    the address of my father reach me through any one of your subordinates, so that I need no longer fall
    burdensome upon Your Serene Highness with complaints, which it costs me a dreadful effort of self-conquest
    to make. With the deepest reverence I remain Your Most Serene Highness''s most humble and obedient
    servant (f.)

    Breslau, the 20th of March 1815.

    Charlotte von Triebenfeld.'

- page: 2
  en: 'but money and health have been spent on it. I have meanwhile demonstrated that I have done nothing
    without the foreknowledge of the provincial authority,


    2. that I have acted strictly in accordance with the prescription,


    3. that everything is sold, so that without a complete derangement of the whole no annulment or reversal
    of the dismemberment could take place.


    4. that the most real revenues of the manorial lordship (Dominium) would now amount to 8 times as
    much as the revenues hitherto, whereby the public burdens (onera publica) would be covered tenfold.


    5. That His Serene Highness the Prince applied the entry moneys to nothing else than to the discharge
    of the debts which encumber the estates, in order to make the estates clear, and that


    6. These estates were to remain an entailed estate of the princely family, which last His Majesty
    had already most graciously sanctioned himself.


    The commission has found all this substantiated, and has withdrawn the inhibition, the more so since
    with the old peasant too everything has already been concluded judicially, and since here as well
    it was not possible even for envy to find matter for founding new intrigues — The clear annual revenues
    acknowledged by the commission are 31000 Rthl. It had to determine this precisely in order to cover
    the public burdens (onera publica). This the Chamber will now confirm, and the'

- page: 4
  en: 'Thus in the last couple of months I have lost 2 lawsuits which cost me some 6000 Rthl.


    In another I am held in contumacy, and shall have difficulty in putting it right and saving a further
    6000 Rthl. Today I receive the news that the hail has beaten down everything on my Schweinersche estates;
    there I shall again have some 5000 Rthl of damage. At Kontop, as I have just heard, a tenant has become
    insolvent, whereby I again suffer 2500 Rthl of loss — these come in a short time to 19500 Rthl. It
    is as though all blessing had departed from there and had followed me hither. Now I must return in
    order to save what is there, for otherwise I go to ruin.


    I tremble, to be sure, when I go away from here and let the guiding thread out of my hands, lest everything
    come to a standstill again — but necessity presses me — I must hasten for some time to Schweinen and
    Kontop, for otherwise I risk a new and still greater loss.


    I shall, as everything here [uncertain: versteht], instruct Schenck and a few other persons to collect
    the monies. But I cannot answer for it whether the people will hold to the execution of my orders
    with the same zeal, because every brute would far too gladly see that the affairs continued in confusion
    for a whole generation, as has otherwise happened. In deepest reverence I remain, until death,


    Your Serene Highness''s


    Trąbczyn, the 29th of July


    1805.


    humble and obedient servant


    von Triebenfeld'

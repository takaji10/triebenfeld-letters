- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    Soon I shall have to let the name [uncertain: laßen] the cabals of the Finance Department yet succumb
    to them, so many difficulties as Minister von Voss makes in the matters of dismemberment — it is unheard
    of. Several proprietors who already dismembered two years ago have to restore everything again in
    statu quo, and are thereby brought to the beggar''s staff. Here he has had everything inhibited against
    me, and to that end has ordered the Chamber to send a commission hither which is to examine whether
    everything has indeed already been dismembered — whether it might not be possible to thwart this business;
    in particular it is now to investigate precisely whether in any way there has been action contrary
    to the principles; whether all the money has not been drawn off, and therefore the public charges
    (onera publica), as at Betsche, were no longer covered.


    On the presumption that this last would certainly be the case, everything was to be inhibited at once,
    and in that event the strictest measures taken. The commission departed today; I have indeed prevailed,'

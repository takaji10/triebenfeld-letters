- page: 3
  en: 'Finance Department will grant us the concession for it. — As soon as I receive this instrument,
    neither an assessment nor anything else is needed, but one can quickly obtain 3 to 400000 Rthl upon
    it at any treasury, and then all distress will be at an end.


    The 180850 Rthl still to come in can then be taken for the extinction of all household and other debts.
    The only fatal thing is the accursed procrastination, for in the first moment all the purchasers ran
    off upon the publication of that cursed inhibition, and I must now strike very soft notes so that
    I may lure the people back again. Enough: Your Serene Highness comes happily through with the dismemberment
    and will in years be free of debt here — for if for some years you assign the revenues from the estates
    here to the absorption of the debts, the estates will in 9 years be entirely clear, will yield you
    a revenue of 40000 Rthl, and you will besides draw out of the estates by degrees a capital of 220000
    Rthl. — This I believe I can now assure Your Serene Highness of firmly and sacredly. But now, most
    gracious Lord, I am worn down — I have worked with truly glowing zeal, and every man of expertise
    marvels at what has been brought so far. Now I can hold out here no longer — both my health and my
    fortune are being consumed by it, and I shall leave beggars behind. Also, for some time now one misfortune
    after another has struck.'

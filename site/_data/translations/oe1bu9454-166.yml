  en: '166


    Most Serene Prince


    Most gracious Lord!


    Soon I shall have to succumb after all to the [uncertain: nameless] intrigues of the finance department;
    that a minister should raise as many difficulties as Minister von Voss does in the business of dismemberment
    is unheard of. Several landed proprietors who dismembered as much as two years ago must restore everything
    again to the status quo, and are thereby brought to the beggar''s staff. Here he has had everything
    inhibited, and to that end has ordered the Chamber to send a commission which is to examine whether
    everything has already been dismembered — whether it may not be possible to thwart this matter; in
    particular it is now to inquire precisely whether the principles have in any way been acted against;
    whether all the money has not been drawn off, and the public burdens (onera publica) therefore, as
    at Pszczew, were no longer covered.


    On the presumption that this last would certainly be the case, everything was to be inhibited forthwith,
    and in that event the strictest measures taken. The commission departed today; I have indeed prevailed,'

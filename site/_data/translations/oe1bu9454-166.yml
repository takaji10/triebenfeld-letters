- page: 2
  en: 'but money and health have been spent on it. I have meanwhile shown that I have done nothing without
    the prior knowledge of the provincial authority,


    2. that I have acted strictly in accordance with the prescription,


    3. that everything is sold, so that without a complete disruption of the whole no annulment or reversal
    of the dismemberment could take place.


    4. that the most real revenues of the manorial lordship (Dominium) would now amount to 8 times as
    much as the revenues hitherto, whereby the public charges (onera publica) would be covered tenfold.


    5. That His Serene Highness the Prince applied the entry monies to nothing else than the discharge
    of the debts which encumber the estates, in order to clear the estates, and that


    6. these estates were to remain an entailed estate of the princely family, which last His Majesty
    had already himself most highly sanctioned.


    The commission has found all this verified, and has withdrawn the inhibition, the more so as everything
    has also already been concluded judicially with the old peasant, and as here too it was not possible
    even for envy to find matter for the founding of new cabals. — The clear annual revenues acknowledged
    by the commission are 31000 Rthl. It had to ascertain this precisely in order to cover the public
    charges (onera publica). This the Chamber will now confirm, and the'

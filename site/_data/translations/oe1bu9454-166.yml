- page: 3
  en: 'finance department will grant us the concession for it — As soon as I receive this instrument,
    neither assessment nor anything further is needed, but one can quickly obtain 3 to 400000 Rthl upon
    it at any treasury, and then all distress is at an end.


    The 180850 Rthl still to come in can then be taken for the extinction of all the household and other
    debts. The only fatal thing is merely the accursed procrastination, for in the first moment all the
    purchasers ran off once that cursed inhibition became known, and I must now strike very gentle notes
    so that I may entice the people back again. Enough: Your Serene Highness will come happily through
    with the dismemberment, and will in a few years be [uncertain: free of the village mayor''s dues]
    here — for if for several years together you assign the revenues to the absorption of the debts of
    the estates here, then in 9 years the estates will be quite clear, will yield you a revenue of 40/m
    Rthl, and you will besides draw out of the estates, little by little, a capital of 220000 Rthl — this
    I believe I can now assure Your Serene Highness firmly and solemnly. But now, most gracious Lord,
    I am worn out — I have laboured with truly glowing zeal, and every man who knows the matter marvels
    at this thing brought so far. I cannot hold out here any longer — both my health and my fortune are
    being spent on it, and I shall leave beggars behind me — Also for some time past one misfortune after
    another has struck'

- page: 4
  en: 'Thus in the last couple of months I have lost 2 lawsuits which cost me some 6000 Rthl.


    In another I am held in contumacy, and shall have trouble to redress the same and to save a further
    6000 Rthl. Today I receive the news that the hail has beaten down everything on my Świniary estates;
    there I shall again have some 5000 Rthl of damage. At Konotop, as I hear this very moment, a tenant
    has become insolvent; there I suffer a further 2500 Rthl of loss — in a short time this comes to 19500
    Rthl. It is as though all blessing had departed from there and had followed me hither. Now I must
    go back to save what is there, for otherwise I go to ruin.


    I tremble, to be sure, when I go away from here and let the guiding thread out of my hands, that everything
    will come to a standstill again — but necessity presses me — I must hasten for some time to Świniary
    and Konotop, for otherwise I risk a new and still greater loss.


    Since everything here is understood, I shall instruct Schenck and a few more people to collect in
    the moneys. But I cannot vouch for it whether the people will hold to the execution of my dispositions
    with the same zeal, because every brute would far too gladly see the affairs continue in confusion
    through a whole generation, as has otherwise happened. In deepest reverence I remain, until death,


    Your Serene Highness''s


    Trąbczyn, the 29th of July


    1805.


    humble and obedient servant


    v Triebenfeld'

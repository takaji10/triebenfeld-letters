- page: 2
  en: 'B: is very active and handles the matter wisely and tirelessly – All upright souls wish that A.
    August only annul quickly the power of attorney given to Cosmar, and that he enter into no pour parler
    with the pettifogger over it, but rather, as I have already advised, write to the Minister of Justice
    and to the Brieg Superior Court that he has annulled the power of attorney given to Cosmar. Once this
    has been done, the 112000 Rthl given and the Curish heirs satisfied thereby, Cosmar is overthrown
    – the Board of Wards as well as the Brieg Superior Court will bury him outright, especially if the
    guardianship in respect of Adolph is taken from him. Concerning the Polish estates I await the decision
    at any moment – whether I am to come, or whether the Prince Chancellor wishes to settle the matter
    alone. From von Pourtales B. expects the answer in 10 to 12 days. B. wishes that


    6. might not come sooner than towards the end of April, because until then there would still be a
    frightful amount of work – and that without him he would not gladly wish to settle the matter. From
    the King there lies a letter to Your Serene Highness in the field post – It is presumably the answer
    to your New Year''s congratulation.


    With the greatest respect I remain


    Your Serene Highness''s


    Vienna, the 13th of February 1815


    most obedient servant


    v. Triebenfeld'

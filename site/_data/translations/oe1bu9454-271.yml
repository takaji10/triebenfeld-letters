status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! As concerns Poland, matters have now only got
    so far that the frontier has been agreed from the territory of Thorn onward, by way of Slupce near
    Peisern, across the Wartha and down the Prosna as far as Saoleslawiae, over against [uncertain: Pitschum].
    Likewise the frontier for the Saxony that is to remain has also been fixed. The King of Saxony, who
    yesterday was invited to come hither by an Austrian and a Prussian courier, keeps Dresden, Leipzig
    and Bautzen. According to this, the Congress will indeed have reached its end sooner rather than in
    3 weeks; but now England begins new and quite devilish intrigues — these water-hands want to have
    East Friesland, and we are to compensate Denmark for it. The Emperor Alexander presses upon our King
    that a piece of land on our side in Germany is to be given to the Viceroy of Italy. Both matters will
    draw the most obstinate debates after them, for, as people say, the King will by no means suffer this.
    When thereafter the affairs of the German Empire are still to be arranged in general, when everything
    must be painted 15 times over on parchment, then many an hour more of time will still be required.
    Be that as it may, I go on plaguing the Prince Chancellor, yet he still remains good throughout and
    his patience will not tire — The papers still lie with the Privy Councillor of State Stägemann. It
    is true enough that the work is frightfully great, but I keep on admonishing; thus, for example, I
    have again submitted to the Prince a petition as the figure shows — He received it graciously and
    promised certainly to help — Everyone of the good sort of men holds the matter of the 112000 Rthl
    advance to be quite certain and settled; with Cosmar himself it will probably drag out somewhat, for
    the Prince will punish the business severely, the more so as the report of the Brieg Superior Court
    of Justice has turned out so favourably.'
- page: 2
  en: 'B: is very active and handles the matter wisely and restlessly — All honest souls wish that Prince
    August would only quickly revoke the power of attorney given to Cosmar, and in doing so enter into
    no pour parlez with the pettifogger, but rather, as I have already advised, write to the Minister
    of Justice and to the Brieger O L Court that he has revoked the power of attorney given to Cosmar.
    Once this has been done, the 112000 Rthl paid over and the Curian heirs satisfied therewith, then
    Cosmar is thrown down — the Board of Wards, as also the Brieger O.L. Court, will bury him outright,
    especially if the guardianship in respect of Adolph is taken from him. As regards the Polish estates
    I await the decision at every moment — whether I am to come away or whether the Prince Chancellor
    will settle the matter alone. From von Pourtales B. expects the answer in 10 to 12 days. B wishes
    that 6. might not come sooner than towards the end of April, because until then the work would still
    be dreadfully much — and o. would not gladly wish to settle the matter without him. From the King
    there lies a letter for Your Serene Highness in the field post — It is presumably the answer to your
    New Year''s congratulation. With the greatest respect I remain Your Serene Highness''s Vienna, the
    13th of February 1815 wholly most obedient servant v Triebenfeld'

- page: 1
  en: '271


    Most Serene Prince,


    Most gracious Prince and Lord!


    As regards Poland, matters now stand only so far that the boundary has been accepted from the Thorenſchen
    territory onward over Słupca near Pyzdry, across the Wartha and down the Prosna as far as Boleslawice,
    over towards Pitschen. — Likewise the boundary for the Saxony that is to remain has also been settled.
    The King of Saxony, who was yesterday invited to come here by an Austrian and a Prussian Concir, retains
    Dresden, Leipzig and Bautzen. — Hereafter the Congress Läute perhaps even sooner than in 3 weeks to
    have reached its end; but now England is beginning new and quite devilish intrigues — these Waßer
    hände want to have East Friesland, and we are to compensate Denmark for it. — The Emperor Alexander
    presses upon our King that a piece of land on our side in Germany should be given to the Viceroy of
    Italy. Both matters will draw stubborn debates after them, for, as is said, the King will by no means
    allow this to please him. If next the affairs of the German Empire are still to be arranged in general,
    when everything must be painted 15 times[uncertain: mahl] upon parchment, then many an hour more of
    time will yet be required. — Be that as it may, I go on tormenting the Prince Chancellor, yet he still
    remains good and his patience will not tire. — The papers are still lying with the Privy Councillor
    of State Stägemann. It is true enough, the work is frightfully great, but I keep on admonishing; thus,
    for example, I have again submitted to the Prince a petition as the enclosure shows. — He has received
    it graciously and has certainly promised to help. — Everyone of the good sort of men holds the matter
    of the 112/m rt advance to be quite certain and settled; with Cosmar himself it will probably drag
    out somewhat, for the Prince will punish the thing severely, the more so as the report of the Brzeg
    High Provincial Court has turned out so favourably.'

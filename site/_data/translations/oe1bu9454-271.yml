- page: 2
  en: 'B[arbe] is very active and handles the matter wisely and tirelessly. — All upright souls wish that
    Prince August would only revoke the power of attorney given to Cosmar quickly, and enter into no pour
    parlez with the pettifogger over it, but rather, as I have already advised, write to the Minister
    of Justice and to the Brzeg High Provincial Court that he has revoked the power of attorney given
    to Cosmar. Once this has been done, the 112/m rt. given and the Curiſchen heirs satisfied thereby,
    Cosmar is overthrown. — The Board of Wards, as also the Brzeg High Provincial Court, will bury him
    outright, once the guardianship in respect of Adolph is taken from him. As regards the Polish estates
    I await the decision at any moment — whether I am to come from, or whether the Prince Chancellor wishes
    to settle the matter alone.


    Barbe expects the answer from Pourtalès in 10 to 12 days. Barbe wishes that Pourtalès might not come
    before the end of April, because until then there would still be frightfully much work — and Pourtalès
    would not gladly settle the matter without him. From the King there lies a letter to Your Serene Highness
    at the field post office. — It is presumably the answer to your New Year''s congratulation. —


    With the greatest respect I remain


    Your Serene Highness''s


    Vienna, the 13th of February 1815


    most obedient servant


    v Triebenfeld'

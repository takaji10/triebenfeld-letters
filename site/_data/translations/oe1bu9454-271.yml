- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    As concerns Poland, matters now stand only so far that the boundary has been accepted from the Thorn
    territory onward by way of Slupce near Pyzdry across the Warta and down the Prosna as far as Saoleslawiae
    over towards Pitschum. Likewise the boundary for what is to remain of Saxony has also been determined.
    The King of Saxony, who was yesterday invited to come here by an Austrian and a Prussian [uncertain:
    Concir], retains Dresden, Leipzig and Bautzen. According to this, by the sound of it the Congress
    will surely have reached its end sooner rather than in 3 weeks; but now England is beginning new and
    quite diabolical intrigues – these water-hands want to have East Friesland, and we are to compensate
    Denmark for it. The Emperor Alexander is pressing upon our King that a piece of land on our side in
    Germany should be given to the Viceroy of Italy. Both matters will draw obstinate debates after them,
    for as they say the King will by no means allow himself to be pleased with this. If thereafter the
    affairs of the German Empire are still to be arranged in general, when everything must be painted
    15 times over on parchment, then many an hour more of time will yet be required. Be that as it may,
    I go on plaguing the Prince Chancellor, but he still remains good throughout and his patience will
    not tire – The papers are still lying with the Privy Councillor of State Stägemann. True enough, the
    work is fearfully great, but I keep on admonishing; thus, for example, I have again submitted to the
    Prince a petition as the enclosure shows – He received it graciously and promised certainly to help
    – Everyone of the good sort of men holds the matter of the 112000 Rthl advance to be quite certain
    and settled; with Cosmar himself it will probably drag on somewhat, for the Prince will punish the
    business severely, all the more since the report of the [uncertain: Bürger ÖL Gerichts] has turned
    out so favourably.'

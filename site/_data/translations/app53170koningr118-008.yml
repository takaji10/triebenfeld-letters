status: draft
segments:
- page: 1
  en: 'Done in Konin, on Thursday, next before the Feast of Saint Catherine, Virgin and Martyr, namely
    the 22nd day of the month of November, in the Year of the Lord 1781.


    The Most Reverend Father Malechowski, Administrator of the Religious [of the Ląd Convent], on behalf
    of the Ląd Convent, against the Illustrious Prusimski, Starost of Niszczewice — a Manifest


    Having come in person to the present Office and Books of the Konin Municipal Court, the Right Honourable
    His Worship Father Tesselin Malechowski, Administrator of the Ląd Convent, acting in his own name
    and in the name of the entire Convent by virtue of a full mandate — for the irrevocability of which
    he is bound — clearing himself of the accusation made by the Most Honourable Antoni Prusimski, Starost
    of Niszczewice, declares before the present Books: that in the boundary disputes touching upon the
    conventual estates of Drzewce, concerning the estates of Łukom and Trąbczyn, the Convent conducted
    itself during the last commission with no'
- page: 2
  en: 'conspiracy or collusion; and by virtue of more evident proofs of conviction, the trijunction of
    three estates — that is, of Łukomia, Trąbczyn, and the conventual village of Drzewce — and the corner
    marker, indicated by the Right Honourable Chełmski, the Ląd Convent acknowledged — both for the reasons
    expressed in the Commissorial Decree and those intended to be explained in court — not departing from
    the acknowledgment made at the time of the Commissorial Court, indeed confirming the same; and for
    the purpose of freeing itself from any accusation of conspiracy, it declares even its readiness to
    take an oath; and for the accusation made against it, it promises to pursue the imposition of appropriate
    penalties — saving all that is to be saved.


    Fr. Tesselinus Malechowski [illegible], as plenipotentiary, by his own hand'

segments:
- page: 1
  en: 'Done in Konin, on Saturday, on the very day of the Feast of Saints Vitus and Modestus, Martyrs,
    namely the 15th of June, in the Year of the Lord 1782.


    The Illustrious Chełmski, Treasurer of Wschowa, against the Illustrious Górski, Boundary Surveyor
    of Inowrocław — a Manifest is lodged


    Having come in person to the present Office and Records of the Konin Municipal Court, the Illustrious
    Stanisław Ścibor Chełmski, Heir of the estates of Łukomia [and] Myszakowo with appurtenances, safeguarding
    the integrity of his estates and substance — lodges this Manifest in the present Records, on account
    of the matters below-written, against the Illustrious Jakub Górski, Boundary Surveyor of Inowrocław
    — and this for the following reason: Because the same Illustrious Jakub Górski, presuming that everything
    is permitted to his Office, as is apparent from his Field Acts oblated to the present Records — although
    he knew that Executive Offices executing each individual Decree of the Most Serene Crown Tribunal
    are obligated not to interpret but to execute, by the chain of laws and especially the Constitution
    of the Year 1768 — but the same [Górski], exceeding the prescribed rule of the Condescension for Field
    Courts and Offices in the settlement of the estate of Trąbczyn as prescribed by the Decree of the
    Most Serene Crown Tribunal, and inconveniently diverging from the Field Office likewise of the Dobrzyń
    Land — in the execution not only of the Tribunal Decree but also of the Acts of the Gniezno Municipal
    Court emanating from the same and similarly oblated to the present Records — thrust himself into [the
    matter of] the evacuation of the Olędry of the Illustrious Magnificent Prusimski;'
- page: 2
  en: 'and with his illegal object circumscribed the Manifesting party as if [Chełmski] had placed himself
    rebelliously at the field act; and nullly and unduly, contrary to the meaning of the Statute and without
    the consenting parties, postponed his Act until some unknown time; declaring, beyond the presumed
    scope of the above-mentioned Tribunal Decree and by his own private notifications, that he would descend
    to the site again — instead of [properly] remitting the matter to the Crown Tribunal on account of
    the impossibility [of execution] according to the Line on the Map, which is incompatible with the
    actual site locations, made by the Most Serene Tribunal — without accounting for the Olędry adjudicated
    to [Chełmski] and the Manifesting party; and for military forces remitted his Acts to the Military
    Department of the Permanent Council — and thereby also transgressed against [the sanctions of] the
    Tribunal, and in his [further] proceedings greatly injured the Manifesting party, and caused litigation
    expenses.


    Therefore in fact the Manifesting party, on account of all the above-mentioned matters, against the
    same [Górski], regarding the nullity of his Act, in the most solemn legal form, manifests — offering
    to pursue [the matter] with the same [Górski] regarding the actually conducted Office, for penalties
    and the nullity of the inserted Act, by law — and to vindicate by law, through legal mediation, the
    harm and injuries caused to him, where it shall come by right — the present Manifest''s improvement,
    diminution, or augmentation to be made as the business opportunity requires, reserved to himself with
    full force, and the right guarded.


    Stanisław Ścibor Chełmski


    At the requisition of the party, namely the Honourable Piotr Gosławski, as the bonded Plenipotentiary
    of the Illustrious Magnificent Antoni of Kolno Prusimski, Starost of Niszczewice, acting in the name
    of the same [person as] his Principal — in the presence of the Honourables Tomasz Reczkowski and Świętosław
    Bogusławski, and also the Honest Mateusz Matuszkiewicz of Szetlewek, General Royal Process Server
    — for this interval, on account of information not given for enrollment and the copy not submitted
    — the requisition was made on the 16th day of the month of August.


    Petrus Gosławski


    Stanisław Ścibor Chełmski'

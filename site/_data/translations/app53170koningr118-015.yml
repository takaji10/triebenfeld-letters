- page: 1
  en: Done in Konin, on Saturday, next after the Solemn Feasts of Holy Pentecost, namely the 25th day
    of the month of May, in the Year of the Lord 1782.
- page: 2
  en: 'The Illustrious Chełmski, Treasurer of Wschowa, against a Decree of the Crown Tribunal — a Manifest
    is lodged


    Piotr Gosławski, as Plenipotentiary, upon the requisition of [uncertain: this] space — by his own
    hand.


    Stanisław Ścibor Chełmski'

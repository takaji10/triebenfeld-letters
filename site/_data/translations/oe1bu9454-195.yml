status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! At this moment I can report nothing of consequence
    to Your Most Serene Highness, because Count Strachwitz is not yet here. Herr Flesch I only managed
    to speak with today, with vexation and displeasure. He does nothing but rail at Goldstücker for holding
    the matter to be so easy, and for having straight out named the Count's name — He recommends all secrecy
    and caution — Why, I do not know — It seems only, to speak frankly, that some swindle lies at the
    bottom of it, and as far as I can tell a lawsuit which I do not know of is to be settled along with
    the business. For the rest, I must wait here for Count Strachwitz, who is to arrive in Breslau on
    the 23rd, in order to be able to take further measures thereupon. So much I now know, that they are
    said to be the Oderish estates situated near Leobschütz, and their value is given at 900000 Rthl.
    Zackraw does not belong to them; that the Count wishes to keep for himself — It is not Count Steine,
    for that belongs to the younger Strachwitz. Today, if my fever abates, I shall speak with [illegible]
    von Massow. So much, however, I do know, that Massow is not to blame for the purloined lawsuit etc.
    Michel made the noise about it. My Herr Schade, who is his daily and bosom friend, is working upon
    him today. The results I shall most obediently report — The war between France, Austria and the Turks
    is here held to be a settled certainty, and likewise a breach with Russia is believed in.
- page: 2
  en: 'Our good King is in an unfavourable straitening. He is absolutely to pay the contribution quickly,
    or the French will move into our states — Count Schneidniz arrived here from Paris the day before
    yesterday with this news. Others will have it that Napoleon insists on an accession to the war against
    the Turks, for which we are to furnish 20000 men forthwith, and against which he will let ten million
    & contribution be dropped. Hardenberg is coming forward again, as they say here, and will play a great
    part — Dohna [uncertain: Dąmbska] will probably depart — He has already let over 4000 matters lie
    undone; everyone is incensed against him — the whole system seems to be tottering; the little prince
    of, from and to the Mire is here still more hated than 9. One wishes ardently for Your Serene Highness''s
    return. Prince Wilhelm has won all hearts and is idolised. For the rest, my Whode recounted here yesterday
    in the presence of several persons that the late Koloma is said to have given the testament in question
    to the Legation Councillor Henckel — but since this is no man of legal standing, it would have no
    validity; had he handed it over to Finckenstein, then it would have had the proper form — I could
    not question him about it at that moment — today I shall hear whence he has this — All letters and
    things I have delivered. In deepest reverence I remain, until death, Your Most Serene Highness''s
    — the moratorium has been extended for 2 years. Breslau, the 22nd of May 1810. faithful, most humble
    and obedient servant v Triebenfeld'

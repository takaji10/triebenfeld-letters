segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    At this moment I can report nothing of consequence to Your Most Serene Highness, because Count Strachwitz
    is not yet here.


    Only today did I manage, with vexation and displeasure, to get to speak with Mr. Flesch. He does nothing
    but rail at Goldstücker for treating the matter as so easy a thing, and for having named the Count
    outright - He urges all secrecy and caution - Why, I do not know - To speak frankly, it seems that
    a swindle underlies it all, and so far as I can tell there is a lawsuit, which I do not know of, that
    is to be settled along with the business.


    For the rest, I must await Count Strachwitz here - he is expected to arrive in Breslau on the 23rd
    - so as to be able to take further measures in the matter. So much I now know, that the estates in
    question are said to be the Oder estates situated near Leobschütz, and that their value is given as
    900000 Rthl.


    Zackraw does not belong to them; the Count means to keep that for himself - Count Steine it is not,
    for that belongs to the younger Strachwitz. Today, if my fever abates, I shall speak with Mr. von
    Massow. Meanwhile I know this much, that Massow is not to blame for the purloined lawsuit etc. Mr.
    Michel has made the outcry. My Mr. Schade, who is his day-and-bosom friend, is working on him today.


    I shall most obediently report the results - the war between France, Austria and the Turks is here
    held for a settled certainty, and just as much is a breach with Russia believed in.'

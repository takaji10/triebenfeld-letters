- page: 2
  en: 'Our good King is in a favourable strait. He is absolutely required to pay the contribution quickly,
    or the French will move into our states - Count Schneidniz arrived here from Paris the day before
    yesterday with this news. Others will have it that Napoleon insists on an accession to the war against
    the Turks, for which we are to furnish 20000 men forthwith, and against which he will let ten million
    etc. of contribution be dropped.


    Hardenberg is coming forward again, so they say here, and will play a great role - Dohna [uncertain:
    Dąmbska] will probably go out - He has already left over 4000 matters lying overturned; everything
    is stirred up against him - the whole system seems to be tottering; the little Prince out of, of,
    and in the mire is more hated here than


    9. There is an ardent wish for Your Serene Highness''s return. Prince Wilhelm has won all hearts and
    is idolised. For the rest, my Whode recounted here yesterday in the presence of several persons that
    the late Koloma is said to have given the testament in question to the councillor of legation Henckel
    - but since this is not a man of law, it has no validity; had he handed it over to Fenckenstein, then
    it would have had the proper form - I could not question him about it at the moment - today I shall
    hear whence he has this -


    All letters and things I have delivered.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    the moratorium has been extended


    by 2 years


    Breslau, the 22nd of May


    1810.


    faithful most humble and obedient servant


    v. Triebenfeld'

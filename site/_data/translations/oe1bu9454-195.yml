- page: 2
  en: 'Our good King is in a [uncertain: mighty] straits. He is absolutely to pay the contribution quickly,
    or the French will move into our states — Count Schneidniz arrived here from Paris the day before
    yesterday with this news. Others will have it that Napoleon insists on our joining the war against
    the Turks, for which we are to furnish 20,000 men at once, and against which he would let ten million
    rt of the contribution be dropped.


    Hardenberg is coming forward again, so they say here, and will play a great part — Dohna will probably
    go — He has already left over 4,000 matters lying unattended to; everything is stirred up against
    him — the whole system seems to be tottering; the little prince of, from and in the mire is even more
    hated here than G: One wishes ardently for His Serene Highness''s return. Prince Wilhelm of Prussia
    has won all hearts and is idolised. For the rest, my Whode was telling here yesterday, in the presence
    of several persons, that the late Colorma[illegible] is said to have given the testament in question
    to the Legation Councillor Henckel — but since this is no man of law, it has no validity; had he given
    it over to Fenckenstein, it would have had the proper form — I could not question him about it at
    the moment — today I shall hear whence he has this —


    I have delivered all letters and items.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    the moratorium has been extended


    by 2 years


    Wrocław, the 22nd of May


    1810.


    faithful most humble and obedient servant


    v Triebenfeld'

- page: 1
  en: '195


    Most Serene Prince


    Most gracious Prince and Lord, at this moment I can report nothing of consequence to Your Most Serene
    Highness, because Count Strachwitz is not yet here.


    It was only today that I managed, with vexation and displeasure, to get a word with Mr Flesch. He
    only rails against Goldstücker, for holding the matter to be so easy and for having named the Count
    outright — He urges all secrecy and caution — Why, I do not know — It seems only, to speak frankly,
    that a swindle lies at the bottom of it, and as far as I can tell a lawsuit, of which I know nothing,
    is to be settled along with the business.


    For the rest, I must wait here for Count Strachwitz, who is to arrive in Wrocław on the 23rd, in order
    to be able to take further measures accordingly. This much I know for now, that they are said to be
    the Oder estates situated near Głubczyce, and their value is put at 900,000 Rthl.


    Zackraw[uncertain: Zastrow] does not belong to it; that the Count means to keep for himself — Count
    Steine it is not, for that belongs to the younger Strachwitz — Today, if my fever abates, I shall
    speak with Mr von Massow. Meanwhile I know this much, that Massow is not to blame for the purloined
    lawsuit etc. Merckel has made the noise about it. My Mr Schade, who is his daily and bosom friend,
    is working upon him today.


    I shall report the results most obediently — The war between France, Austria and the Turks is here
    held to be a settled certainty, and likewise a breach with Russia is believed in.'

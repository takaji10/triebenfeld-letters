segments:
- page: 1
  en: 'Right Honourable Sir; Most Highly Honoured Lord Grand Chancellor! Your Excellency will forgive
    me if I take the liberty of accompanying my petition with these few words.


    My trust in Your Excellency''s goodwill towards me is far too great for me not to look forward with
    complete confidence to the granting of my most urgent request: "that Your Excellency might deign kindly
    to give orders in accordance with the contents of the petition".


    The following reasons have moved me to my request,'
- page: 2
  en: 'among others:


    The very proposal for a settlement which the commissioned judge (Deputatus) made at the last hearing
    makes me anxious that the Government at Poznań may not set about drawing up the judgment with the
    impartiality that is due. The life interest which the plaintiff''s father, who is still living, had
    to exercise in the property of his late wife is surely plainly a part of the property confiscated
    from him, and by the confiscation of the entire present and future property of


    von Prusimski the Treasury (Fiscus) has surely plainly made the life interest subject to itself. It
    therefore struck me greatly that the commissioned judge, in his proposal for a settlement, could raise
    the strange doubt against the validity of the life interest, that it would not belong to the Treasury
    because the plaintiff''s late mother had not contracted with the Treasury concerning the life interest.
    This, and likewise the circumstance that the guardianship board, which pursues the case with so much
    zeal, is at the same time to be judge in it, and no less other reasons bearing solely on my individual
    conviction, have therefore raised in me a misgiving about having the case decided by the Government
    at Poznań. I therefore once more most urgently beg Your Excellency kindly to entrust the decision
    of the case either to the Government at Kalisz or to any other South Prussian court. May Your Excellency
    deign to accept the assurance of the un'

- page: 2
  en: 'natural possession of the estates up to now, do not yet know, up to now and before the taking-over
    of their estates, how they are to receive their competence, and the reason lies in this, that with
    so great a quantity of such estates the valuation assessments could not all be prepared within this
    short time, nor the consolidations for the new domain offices be completed. The Bishop of Cujavia
    would therefore likewise have had to vacate the estates of Wieniec and Wolica, had Your Serene Highness
    not been graciously pleased to declare Yourself willing to leave them still to him. Probably, however,
    the following circumstance has given occasion to the misunderstanding: according to the first plan,
    all the estates in South Prussia which had been declared drawn in for the royal account already since
    the 1st of June 1796 were to have been taken from their then possessors on the 1st of June 1797; this
    was not possible for the reasons adduced above, and because through the numerous donations of estates
    the establishment of the domain offices was constantly [uncertain: delayed], and therefore the general
    determination was made that these hitherto possessors might continue to manage such estates until
    June 1798 in the manner hitherto, that is, for the account of the Treasury. Various of these possessors
    have made use of one estate or another by leasing it out, and if their lessees are de facto evicted,
    these demand compensation from their lessors, namely the clergy, and if these excuse themselves on
    the ground that not they but the Treasury threw them out of the lease, then the Treasury must compensate
    such lessees, and thereby the most prejudicial lawsuits arise for the royal treasury. Now the clergy
    may indeed be [in the case] of long-term lease contracts, but since they received only the authority
    to manage the estates, in the manner hitherto allowed, until Midsummer 1798, neither can the Treasury
    lawfully be expected to declare these leases valid for longer than up to this term. Perhaps in the
    whole body of estates which have been granted to Your Serene Highness there is no case in which a
    valid lease contract'

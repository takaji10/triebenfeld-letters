- page: 3
  en: 'exists between the hitherto possessors and a lessee; but should such a case nevertheless be found
    here or there, the lessee will probably be brought by amicable means to vacate. If this cannot be
    effected without disadvantage to You, then Your Serene Highness will Yourself be inclined rather to
    leave him in the lease until June 1798 and to receive the lease money instead, since otherwise the
    royal treasury would not only lose the revenues but would also have to hold the lessee harmless. Only
    with regard to the competence moneys is it to be observed that their determination, according to the
    [uncertain: Hohlinschen] surveys, turns out so low that particularly in the case of the monasteries
    the monks [illegible] could not subsist at all. His Majesty has therefore also commanded by cabinet
    order that the valuation assessments be taken as the basis, and since these are already low as against
    the true yield, the clergy thereby already suffer loss, inasmuch as by the royal declaration concerning
    the drawing-in of the estates everything has been assured to them that remains of the yield after
    deduction of 15 per cent administration costs and 50 per cent [uncertain: dues]. This detail lays
    before Your Serene Highness an exact survey of the established principles, and, with Your good way
    of thinking, You will find them just and equitable. Should You desire any special dispositions to
    the War and Domains Chamber, I most obediently beg to be informed of it, and it shall be exceedingly
    agreeable to me to be able to act entirely in accordance with Your wishes. For Your Serene Highness
    has proofs enough that it has for many years been my endeavour to be of service to You, and thereby
    also to lay down the most perfect veneration, in which I remain, until death,


    Your Serene Highness''s


    Breslau, the 3rd of October


    1797.


    most obedient servant Hoym'

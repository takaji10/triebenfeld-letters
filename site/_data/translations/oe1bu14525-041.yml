- page: 1
  en: 'Most Serene Prince, Gracious Lord!


    It is exceedingly agreeable to me that Your Serene Highness has been pleased, by Your most honoured
    letter of yesterday''s date, to put me fully in the picture concerning the affair of Your South Prussian
    estates.


    Mere misunderstanding lies at the bottom of it if Your Serene Highness has been in the least disquieted
    concerning their transfer, and in proof of this I need only append herewith a copy of the dispositions
    issued to the respective Chambers at Posen and Petrikau, and despatched by express couriers for the
    expediting of the matter, of the 26th of last month, in order to convince Your Serene Highness that
    I have most conscientiously ordered the speediest taking-over and transfer of all the estates, so
    as to see everything set right, if possible, during the time of [the] presence in the province. I
    have accordingly acted in this not only on Your behalf, as [I have] for the named gentlemen donatories,
    but have even instructed the respective Chambers as to the transfer earlier than the instrument of
    grant concerning the last estates was made out. Your Serene Highness may therefore also, and indeed
    from Midsummer of this year onward, regard Yourself simply as sole lord and proprietor [uncertain:
    his own] of the same, of the [uncertain: ecclesiastical] estates reserved to Yourself by His Majesty.
    For the hitherto ecclesiastical possessors have since the 1st of June 1796 no longer been sitting
    on their own account but on account of the Treasury, in these estates already at that time drawn in
    to His Majesty''s revenues. As soon as they receive their competence according to principle, they
    must vacate the estates any day, for they are already now sitting upon competence moneys and [illegible]
    them, and must pay out to the Treasury everything that goes beyond such. There is only this difference,
    that the clergy, who have hitherto remained in the'

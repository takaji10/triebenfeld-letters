status: draft
segments:
- page: 1
  en: 'Done in Konin, on Saturday, on the very day of the Feast of Saint Matthew, Apostle and Evangelist,
    namely the 21st day of the month of September, in the Year of the Lord 1782.


    On behalf of the Illustrious Prusimski, Starost of Niszczewice, against the Illustrious Zakrzewskis
    and others — a Report


    Having come in person to the present Office and Records of the Konin Municipal Court, the Honest Bartłomiej
    Szepczyński of the village of Trąbczyn, General Royal Process Server, sound [of mind], acknowledged
    that he had served authenticated Citation Letters of one and the same essence, three in number, for
    the Ordinary General Sessions of the Crown Tribunal of the Kingdom at Piotrków below-written, of the
    following tenor:'
- page: 2
  en: 'The following: Stanisław August, by the Grace of God, etc. — to you, the Illustrious Casimir, Judge
    of the Brest-Kuyavia Land Court, father; Nepomucen, [official] of the Radziejów Municipal Court; Ignacy,
    Land Court Chamberlain; and Ludwik, [Judge] of Brest-Kuyavia — his sons — the Zakrzewskis; together
    with the late Illustrious Marianna Prusimska, first [wife] of the late Honourable Józef Tomicki, second
    [by] marriage wife of the same Illustrious Casimir Zakrzewski, Judge of the Brest-Kuyavia Land Court
    — the children begotten in the second marriage; and to Paweł and Józef Tomicki, sons begotten by the
    above-mentioned Honourable Józef Tomicki with the same Illustrious Marianna Prusimska in the first
    marriage, and other children of the same Honourable Tomicki; and also to Franciszek, Pantler of Podlachia,
    [and] Elżbieta, wife of the Illustrious Jakub Taczanowski, Huntsman of Trębowla — brother and sister
    among themselves, of the Tworowicz [family], son and daughter begotten by the late Honourable Michał
    Tworowicz with the late Illustrious Wiktoria Prusimska, first [by] marriage Wysocka, in the second
    marriage; and to the same Illustrious Jakub Taczanowski, husband of the Honourable Elżbieta Tworowicz,
    or to both the Taczanowski spouses jointly; and also to Kunigunda Kowalska, wife of the Honourable
    Piotr Kołaczkowski, daughter begotten by the late Honourable Jan Kowalski with the late Honourable
    Konstancja Prusimska, or rather both the Kołaczkowski spouses; and finally to the Illustrious Stefan
    Leszczyć Zielonacki, Land Judge, Andrzej Bogdański, Sub-judge, Ksawery Mikorski, Notary, and also
    Ignacy Rapacki, Chamberlain, then Sub-delegated Grievance Judges of the Kalisz Land Court — concerning
    your persons, estates, sums, and Office, we command [uncertain: ott~] that before Us and Our Ordinary
    General Court of the Crown Tribunal at Piotrków, when and as the present cause from its Register and
    appropriate inscription falls to be judged when called and proclaimed, you appear in person and peremptorily
    —


    at the instance of the Illustrious Magnificent Antoni of Kolno Prusimski, Starost of Niszczewice,
    Knight of the Order of Saint Stanislaus, son of the late Illustrious Stefan Prusimski begotten with
    the late Illustrious Wiktoria Malczewska, grandson of the late Illustrious Krzysztof Prusimski and
    Teresa Golińska, spouses, [descendant] of the late Illustrious Jan, Bogumił, Antoni, and Paweł Prusimski,
    sons of the above-mentioned Krzysztof and Teresa Golińska, spouses, brothers among themselves and
    blood brothers of the late father of the Plaintiff, and blood paternal uncles of the Plaintiff himself,
    and sole natural and legitimate Successor of the Plaintiff after the sterile deaths of the Illustrious
    Antoni and Paweł —


    who cites you, needing due legal assistance, adhering to his manifests made or to be made, and to
    the Tribunal Decree of the Year 1738, at Piotrków, on Tuesday after the Feast of All Saints, issued
    between the late Illustrious Jan and Konstancja of the Prusimski family, Kowalski spouses, on one
    part, and the Illustrious Antoni, Paweł, and Stefan Prusimski, father and uncles of the Plaintiff,
    on the other part — adjudicating against the late Kowalskis in the claimed succession after the late
    Illustrious Jan and Bogumił Prusimski who died without issue; [and also] the subsidiary Decree of
    the Year 1760, likewise at Piotrków, on Thursday, the eve of the Feast of the Presentation of the
    Most Glorious Virgin Mary, between the late Illustrious Antoni Prusimski, his'
- page: 3
  en: 'uncle, and himself the Plaintiff, and you the Cited — confirming, after the sterile death of the
    third brother namely Paweł, the said Decree of 1738 together with other Transactions and the paternal
    disposition, and approving it; and to the paternal disposition of the late Illustrious Krzysztof Prusimski
    [uncertain: Aci] his grandfather, and other documents supporting this cause; and also to the law of
    the neighbouring Prussian Territories, and the precedents in similar causes following, and the admitted
    motion —


    cites [you], or rather summons [you] to the above-mentioned, to see and hear:


    the above-mentioned Tribunal Decree of 1738 not having been vitiated even by the parties, but rather
    confirmed by the subsequent Decree of 1760, the same also again approved and declared to be stood
    by — [the Plaintiff seeks:] the Kalisz Land Court Decrees, first indeed ordering the sharing of documents
    regarding the successive substance devolved upon the Plaintiff after the late brothers and uncles,
    also without the Plaintiff''s competence having first been resolved, contrary to law and usual practice,
    to be set aside; then another [decree] for the place of the remission, with the intervening Tribunal
    decree, the appropriate forum having been found, together with the grievance sentences regarding the
    accessories of the ordered proceeding and prosecution of the cause, and the grievance decrees following
    between you the Cited and himself the Plaintiff, and the threatening of the loss of the cause to the
    Plaintiff being relieved; and also the Kalisz Land Court Decree on the very day of the Feast of Saint
    Hedwig, Widow, Elect, in the Year 1781 — issued contrary to law, denying and indeed cutting off the
    delay lawfully due to the Plaintiff without heeding the Tribunal Decrees — and also the last [decree]
    by which the competent action and plaintiff-standing was found in favour of the Zakrzewskis and others
    — to be cassated; and penalties both upon you for having procured these decrees, and upon the Illustrious
    Judges for transgression of the law in their judging, to be imposed; and now any process unduly obtained
    against the Plaintiff from your part to be cassated, and the Plaintiff to be freed from the chain
    and rigour of the Kalisz Land Court Decrees, from your demand and the pretended undue succession after
    the late Illustrious Antoni and Paweł Prusimski, blood brothers of the late father of the Plaintiff
    and blood uncles of the Plaintiff himself, who died without issue; the incompetent action claimed
    by you regarding such succession after the late Antoni and Paweł, unduly claimed by you — as also
    after the late Illustrious Jan and Bogumił Prusimski, their earlier deceased brothers — according
    to the Tribunal Decree of 1738 and the paternal disposition and the precedents in similar causes following,
    and the law prohibiting daughters exdotated by their father to claim nothing from brothers, and also
    [the law] of the neighbouring Prussian Territories — to be declared [incompetent]; the right of action
    of the Honourable Tomicka rather regarding the improvement of the dowry than the claimed succession,
    as appointed without a term, to be declared; and perpetual silence to be imposed upon you in the present
    cause; and penalties for the resuscitation of a matter already decided, for undue harassment, for
    the issued and procured grievance decrees, and in the force of litigation expenses unduly caused to
    the Plaintiff, upon you [uncertain: Voles]'
- page: 4
  en: 'and the Kalisz Land Court to be extended — and as for the rest, all those things which shall be
    [decided] according to law and documents, to be decreed and sentenced against you. Be therefore equally
    ready to attend this Term and to respond judicially.


    Given at [P]iotrków, on Monday, next after the Feast of Saint Bartholomew the Apostle, in the Year
    of the Lord 1782. The first of them, against the Illustrious Tomickis, in the manor of the estates
    of the village of Zieleniec, in the presence of the Cited party, on the Thursday most recently past.
    The second, against the Illustrious Zakrzewskis, in the manor of the estates of the village of Mostki,
    in the presence of the Cited party, on yesterday, the day preceding today''s act. The third, against
    the Kalisz Land Court, in the town of Konin, in the house of the Renowned Wiśniewska, citizen of Konin,
    and in the Kalisz Land Court Chancellery existing there during the court sessions, before the same
    Renowned Wiśniewska, on this very day — having placed [the citations] upon the tables in the heated
    room at all three [locations] distinctly, and having left notification at every location.'

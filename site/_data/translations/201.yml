- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Weigel is now firmly resolved to accept the
    estates to be negotiated for the Zagorow lordship, be they the Knobelsdorff or the Pommahisch ones,
    and to set off his own and Stossel''s claims against them. Tomorrow, the 30th, he means to spend the
    day with me at Schweinerin, in order to confer upon everything bearing on this affair. I report this
    happy event to Your Serene Highness so that you may for once sleep in peace. I shall exert myself
    with glowing zeal to bring this matter to the most desired end; and should Heaven crown a second work,
    then I shall order Your Serene Highness''s domestic affairs in such a manner that in a short time
    all care on that account shall become strange to you. The plan is this – the merchants here, NB the
    rich ones, have fallen into a mania for possessing great estates. They wish to buy Schweinern from
    me; one has already offered me 220000 Rthl Cour. bono, I demand 250000. If I obtain that, then I come
    out with 160000 ₰ in cash, since only 40000 ℔ are intabulated upon the estates – When Weigel and Stössel
    are satisfied, and Grotowski, Lichnowski, Zerboni and others belong to Trąbczyn, then I believe with
    150000 [uncertain: Rolle] to extinguish your other debts entirely. May God give His blessing and prospering
    thereto; after the success I will thank Him quietly upon my lines. Everything is now well set in train,
    and I shall not bring you much [text unclear] sooner than you think the most desired tidings. But
    work also, Most gracious Prince, that the plan with H August succeeds – for then you may not only
    still enjoy your days gladly in the circle of your children and certainly count upon the good fortune
    that from every side people will make you a thousand crooked bows with a hundred thousand reverences
    – but also be assured that they will offer you God knows what — To your children I assure my deepest
    reverence – and I remain, until death, with the most unbounded respect, as Your Most Serene Highness''s
    Breslau, 29th August 1810. Humble and faithful servant v Triebenfeld'

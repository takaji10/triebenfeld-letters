- page: 1
  en: '[The page begins mid-sentence.] … perished, [written "geborsteres"]

    folk property. If we take a walk today through Warsaw, Lublin,

    [written "Stadoni"], even through a market town lying far from the

    great trade routes, we come everywhere upon German family names on the

    shop signs. The bearers of the German names will put up with most

    things; on no account may one address them as Germans. Dead and spoiled

    is here the smallest trace of the former folk property. As a public

    scandal, nothing is left to such people but their German family name.

    Often one takes the legal route to be rid of the troublesome name.

    Whoever leafs attentively through the first volumes of the state

    newspaper "Monitor Polski" will find many a fine blossom of this kind.

    This way, however, is beset with greater or lesser difficulties, and of

    late a considerable sum is charged for a lawful change of name. The

    resourcefulness of some commune heads, even of the evangelical pastors

    (Pastor Winkler in Wieluń, Pastor v. Boerner in Zduńska-Wola), has here

    found a simpler way, one leading more comfortably to the goal, namely

    that of the complete transfer of the German family name into Polish.

    Thus, for example, out of a Jahn a Koguziński, a Schneider a

    Krawczykowski, a Rot a Czerwiński, Blum became Kwiatkowski [written

    "uhr"]. If one subjects the Polonised German family names to a

    closer examination, three kinds of altered name can be established.

    Namely, first, names translated literally from the German into Polish;

    second, names which, when they were recorded in [written "zu[?]"] the

    Polish spelling, one takes at first sight for Polish family [the

    sentence breaks off].'

- page: 1
  en: Cabunis is back with the Hussites — The people liked it exceedingly, they now wish to hurry back,
    gather their brethren in the faith together and settle everything within 14 days. Cabanis has however
    brought back much news, about which I must speak with Your Serene Highness. It becomes most urgently
    necessary that someone go there at once to bring everything into the best track. I am working here
    with the Olesnicas people — would Your Serene Highness be so gracious as to come to me for a quarter
    of an hour from the parade, then Your Highness could hear all the people yourself, and issue Your
    most high commands at once as to what is further to be done. v Triebenfeld [Breslau?] the 30th April
    1804

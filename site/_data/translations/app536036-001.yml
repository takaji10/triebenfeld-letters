status: draft
segments:
- page: 1
  en: 'The Trąmpczyńskis, in default


    The Honourable Jerzy Chełmski, plaintiff: the Honourables Marcin, Wojciech, Władysław and Andrzej,
    full blood brothers of the Otto-Trąmpczyński family, sons of the late Stanisław, and likewise Anna
    of Słończyce, widow of the same late Stanisław Trąmpczyński, and lady dower-holder and life-tenant
    of the goods left by his death, being cited before the present Konin land court in respect of all
    their goods generally — the minors, if any there be, together with their guardians [uncertain: assigned
    to them] — for the reason that they themselves, not content with the prior injuries, damages and grievances,
    through the sending in of their own subjects against that same plaintiff, into the woodland of that
    same plaintiff''s own village of Łukom, made notches on trees after the manner of boundary marks,
    eighty on this side or beyond, and cut them, and procured others who did in fact cut them — intending
    by such an act to annex a great part of the ground of that same plaintiff, his own, and to appropriate
    it to their own ground — doing the aforementioned things to the serious detriment of the plaintiff,
    which he reckons for himself against them, the ground itself left untouched, at one thousand Polish
    marks, and damages of the same amount, or as the court shall decree; and that none the less, the office
    of the Sub-chamberlain having been brought out, they shall annul the same marks, the penalties being
    paid —


    [Translator''s note: Lat. ad instar signorum granicialium — "after the manner of boundary marks" —
    describing the tree notches as functionally equivalent to formal boundary marks, which is the legal
    basis of the complaint. The defendants are alleged to have created de facto boundary evidence on Chełmski''s
    own land.]


    the citation concerning the aforementioned matters being fuller — them, lawfully proclaimed through
    the General Royal Messenger, the Honest Mikołaj Jaworowski of Karmin, and not appearing at the first
    term, he has judicially condemned in the penalty of contumacy, the same court admitting it.


    And here standing in person, the General Royal Messenger, the Worthy Bartłomiej Koelmarek of Łukom,
    openly acknowledged that he had laid the citation issued on account of the aforementioned matters,
    on the Monday last past,'
- page: 2
  en: at the manor of the cited, in the village of Trąbczyn, in the presence of the household of the house.

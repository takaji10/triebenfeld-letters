- page: 4
  en: 'serves.


    It is high time that the great means of the estates should no longer be frittered away for a Berlin
    advocate, but should come to those to whom they belong. Once all is clear, I hope to have proved by
    the deed who it was that truly meant honestly by Your Highness and by the most high family, even if
    I do not often name my honest and well-meaning sentiments in words, because I am in earnest about
    them Hahn


    15th February 1815'

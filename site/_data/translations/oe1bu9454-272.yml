- page: 3
  en: 'Herr von Braun is the root of all the trouble hitherto, because he was in no way a match for Cosmar,
    and would not at all find his way into the sphere of activity that opened up to him. Princess Emilie
    has here several times broken the staff over him, and has named him to me by his name; it does not
    appear, however, that this has harmed him in the Prince''s opinion. By means of the particular inspection
    of the estates I hope to be able to convince Your Highness of their true and to-be-hoped-for yield
    for the next budget year, for from that same inspection it also follows how much is indispensably
    necessary for the buildings, and I shall then [uncertain: propose] to Your Highness a fund out of
    which these cash outlays can be met without diminishing the actual revenues. In all these matters
    much depends on the forms one ob-'

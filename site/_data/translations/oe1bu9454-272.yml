  en: 'urgently necessary for me, of which I should make use only in this extreme case. I believe, however,
    that all this is not necessary, and that Your Serene Highness will, for what Your Highness''s son
    there [uncertain: receives] through the altered circumstances of the times — be compensated here,
    since it will fall easy to him to renounce an enjoyment of revenues which he did not have at all hitherto
    and which, so far as I know the course of ideas there, he still very much calls into doubt. [uncertain:
    Until] an answer to this letter arrives, one must see everything more clearly, and I hope that if
    Your Highness will add something in Your own hand [uncertain: concerning] the travelling money, then
    this obstacle too may be removed. Goldstüker I shall already pacify by this journey, which he has
    long desired, because he always wished to come to terms concerning the bill of exchange. The foolish'

- page: 3
  en: 'Mr von Braun is the root of all the [uncertain: hitherto] evil, because he was in nothing a match
    for Cosmar, and [uncertain: knew] not at all how to find his way in the sphere of action that opened
    to him. Princess Emilie has here more than once broken the staff over him, and named him by his name
    to me, but it does not appear that this has harmed him in the Prince''s opinion. By the particular
    inspection of the estates I hope to be able to convince Your Highness of their true yield to be hoped
    for in the next [uncertain: fiscal year], for from that inspection it also follows how much is unavoidably
    necessary for the buildings, and I shall then [uncertain: propose] to Your Highness a fund out of
    which these cash outlays can be met without diminishing the actual revenues. In all these matters
    much depends on the forms one ob-'

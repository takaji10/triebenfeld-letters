- page: 2
  en: 'urgently necessary, of which I should have to make use only in this extreme case. I believe, however,
    that all this is not necessary, and Your Serene Highness will for that which Your Highness''s son
    there obtains through the altered circumstances of the times – be compensated here, since it will
    be easy for him to renounce an enjoyment of revenues which he hitherto did not have at all and which,
    so far as I know the course of ideas there, he still very much calls in doubt. [uncertain: When] an
    answer to this letter arrives one must see more clearly into everything, and I hope that if Your Highness
    were still to add something in his own hand concerning the travelling money, this obstacle too would
    be removed. Goldstüker I shall readily set at ease by means of this journey, which he has long wished
    for, because he has always wanted to come to terms over the bill of exchange. The foolish'

- page: 1
  en: '272 In accordance with Your Serene Highness''s command of today, I transmit the drafted reply to
    Prince August. The withdrawal of the power of attorney certainly follows from the consequences of
    the Vienna resolutions; it is, however, to be feared that new blunders will be made in Öhringen, and
    these could only be averted by word of mouth, since experience teaches how little has been accomplished
    hitherto by all the written negotiating. In Öhringen I am confident of effecting everything that is
    necessary for Your Highness''s peace of mind, and in the extreme case one there sees the matters [uncertain:
    independently] and conducts oneself according to the circumstances and according to the manner in
    which one is accustomed to conduct oneself toward Your Highness —: A secret instruction for this case
    would, together with a power of attorney, be'

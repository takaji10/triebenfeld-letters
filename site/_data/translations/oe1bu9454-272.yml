- page: 4
  en: 'serves.


    It is high time that the great [uncertain: means] of the estates be no longer frittered away for the
    benefit of a Berlin advocate, but rather come to those to whom they belong. Once all is in order,
    I hope to have proved by the deed itself who it is that has truly been honestly disposed towards Your
    Highness and the most high family, even if I do not often name my honest and well-meaning sentiments
    in words, because I am in earnest about them

    Hahn


    the 15th of February 1815'

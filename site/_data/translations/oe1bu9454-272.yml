status: draft
segments:
- page: 1
  en: 'In consequence of Your Serene Highness''s command of today, I transmit the drafted reply to Prince
    August. The withdrawal of the power of attorney certainly flows from the consequences of the Vienna
    resolutions; it is however to be feared that new blunders will be made in Öhringen, and these might
    only be averted by word of mouth, since experience teaches how little has hitherto been accomplished
    by all dealings in writing. In Öhringen I trust myself to bring about everything that is needful for
    Your Most High repose, and in the extreme case one there looks at matters oneself and [uncertain:
    comports oneself] according to the circumstances and according to the manner in which it is intended
    that one behave toward Your Most High Self —: A secret instruction for this case, together with a
    power of attorney, would be to me'
- page: 2
  en: 'urgently necessary, of which I should make use only in this extreme case. I believe however that
    all this is not needful, and Your Serene Highness will, for that which Your Most High Lord Son there
    receives through the altered circumstances of the times – be here compensated, since it will come
    easily to him to renounce an enjoyment of revenues which he hitherto had not at all, and, so far as
    I know the run of ideas there, still holds very much in doubt. When an answer to this letter follows,
    one must see more clearly into everything, and I hope that if Your Most High Self should still add
    something in Your own hand concerning the travel money, this obstacle too may be removed. Goldstücker
    I shall calm well enough by means of this journey, which he has long desired, because he always wished
    to come to a composition concerning the bill of exchange. The [uncertain: foolish]'
- page: 3
  en: 'Mr. v. Braun is the root of all the evil hitherto, because he was in no way a match for Cosmar,
    and would not at all find his way into the sphere of activity that opened before him. The Princess
    Emilie has here more than once broken the staff over him, and named him to me by his right name; it
    does not appear, however, that this has harmed him in the Prince''s opinion. By the particular inspection
    of the estates I hope to be able to convince Your Most High Self of their true income to be hoped
    for in the next fiscal year, for from that same inspection it also flows how much is indispensably
    necessary for the buildings, and I shall then [uncertain: propose to] Your Most High Self a new fund
    out of which these cash outlays can be met without diminishing the actual revenues. In all these matters
    much depends on the forms one ob-'
- page: 4
  en: 'serves. It is high time that the great [uncertain: means] of the estates be no longer frittered
    away for the benefit of a Berlin advocate, but rather come to those to whom they belong. If all is
    in [uncertain: order], I hope to have proved by the deed itself who it was that really meant honestly
    by Your Most High Self and the Most High Family, even though I do not often name my honest and well-meaning
    sentiments in so many words, because I am in earnest about it.


    Hahn

    the 15th of February 1815'

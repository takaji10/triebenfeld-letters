status: draft
segments:
- page: 1
  en: 'In accordance with Your Serene Highness''s command of today, I send herewith the drafted reply
    to Prince August. The withdrawal of the power of attorney certainly flows from the consequences of
    the Vienna resolutions; it is, however, to be feared that new blunders will be made in Öhringen, and
    these could only be averted by word of mouth, since experience teaches how little has hitherto been
    achieved by all written negotiation. In Öhringen I have confidence that I can bring about everything
    that is necessary for Your Highness''s peace of mind, and in the extreme case one there looks at matters
    oneself and conducts oneself according to the circumstances and according to the manner in which one
    is in the habit of conducting oneself towards Your Highness —: A secret instruction for this case,
    together with a power of attorney, would be to me'

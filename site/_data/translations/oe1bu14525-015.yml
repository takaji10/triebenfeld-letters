status: draft
segments:
- page: 1
  en: 'The noble lordship of Pszczew or Betsche, situated under the jurisdiction of the Royal South Prussian
    Government at Posen in the Posen District, with the following appurtenances:


    the village of Świechocin, the village of Stoki.


    the village of Łowyń, the village of Głażewo, the village of Dormowo, the village of Stołuń, the village
    of Kuligowo, the village of Szarcz, the bailiwick of Zielomyśl and Silna, the Hollander settlements,
    the Tomecher Hollander settlement, and the Heydemühle.


    The reigning Prince, Friedrich Ludwig of Hohenlohe-Ingelfingen, has received these as estates formerly
    ecclesiastical and belonging to the Cathedral Chapter at Posen, granted to him in hereditary freehold
    ownership following the confiscation of all the ecclesiastical estates in South Prussia, by virtue
    of the deeds of grant of His Majesty King Friedrich Wilhelm the Second, dated Berlin the 19th of June
    1797, and of His Majesty King Friedrich Wilhelm the Third, dated Berlin the 1st of December of the
    same year; and the Titulus Possessionis has been entered for him upon the ground of these deeds of
    grant and of the deed of resignation issued on the 29th of March 1802, by force of the Decree of the
    20th of March 1802.'

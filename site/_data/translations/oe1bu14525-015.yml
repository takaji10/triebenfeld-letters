- page: 2
  en: 'Entered thereupon are


    I. Perpetual burdens (Onera perpetua) and restrictions upon the ownership or the disposition


    1.) The annual competence payable out of these estates by their former ecclesiastical possessors to
    the War and Domains Treasury at Posen, which, since no determinate amount has been stated and certified,
    has been entered for an indeterminate sum upon the ground of the deeds of grant for the reigning Prince
    Friedrich Ludwig of Hohenlohe-Ingelfingen, dated Berlin the 19th of June 1797 and dated Berlin the
    1st of December of the same year, at the entry of the Titulus Possessionis in his name, ex officio
    by force of the Decree of the 29th of March 1802.


    2. The sovereign prohibition that the estates in South Prussia which, having been confiscated from
    the clergy, have again been granted out under noble tenure may not be alienated to natives of the
    former Poland without the supreme Royal consent; which prohibition has been entered against these
    formerly ecclesiastical estates at the entry of the Titulus Possessionis in the name of the reigning
    Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, ex officio by force of the Decree of the 29th of
    March 1802.


    II. Judicially secured debts and other real obligations.


    are not entered.


    Besides the foregoing items, there is entered against the'

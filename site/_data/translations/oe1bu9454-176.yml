- page: 2
  en: 'his [uncertain: Fraues] and praiseworthy life. In Öhringen, as in all Hohenlohe places of this
    branch of the house, possession was at once taken, in accordance with the testament which has named
    my most gracious Prince sole heir of these fair lands, — and town and country joyfully rendered the
    oath of fealty. From the side of the Princes of Langenburg and Kirchberg an attempt was made to employ
    [uncertain: geheliche] measures, grounded upon a certain misunderstood partition treaty; but this
    was manfully resisted by the [uncertain: Aufaenger] of the Ingelfingen side, the troops were turned
    back, and the Ingelfingen patents of taking-possession'

- page: 1
  en: '176


    Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests! To Your Right Honourable
    I hereby most obediently report that yesterday afternoon at 6 o''clock the news arrived by express
    courier of the decease of the reigning Prince of Hohenlohe-Neuenstein, Serene Highness. The aged lord
    still shot a piece of fir-deer in the game park on the 20th of July; on the 24th of the same month
    he was stricken with the Rathlauf, which was a customary illness with him, and on the 27th, early,
    after 10 o''clock, a stroke supervening ended'
  names:

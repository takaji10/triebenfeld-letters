- page: 4
  en: 'All this I have wished most dutifully to report to Your Honour, and permit myself only still to
    add the assurance of true veneration, in which I ever have the honour to be Your Right Honourable''s


    Breslau, the 4th of August 1805


    humble and obedient servant


    A. Hahn'

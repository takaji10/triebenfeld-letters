- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! To Your Right Honourable
    I most obediently report herewith that yesterday afternoon at 6 o''clock, by express courier, the
    news arrived of the decease of the reigning Prince of Hohenlohe-Neuenstein, His Serene Highness. The
    aged gentleman on the 20th of July still shot a piece of pine-wood [uncertain: Tanwald] in the deer
    park; on the 24th of the same month he was taken with the [uncertain: Rathlauf], which was a customary
    illness with him, and on the 27th, by a stroke of apoplexy which supervened, he ended


    early, after 10 Rthl'
  names:

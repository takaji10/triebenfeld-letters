- page: 2
  en: his pious and praiseworthy life. In Öhringen, as in all the Hohenlohe places of this branch of the
    line, possession was taken at once, pursuant to the testament which has named my most gracious Prince
    sole heir of these fine lands — and town and country joyfully swore fealty. Attempts were made on
    the part of the Princes of Langenburg and Kirchberg to exercise geheliche measures, which rest upon
    a certain misunderstood partition treaty, but from the Aufaenger of the Ingelfingen side manly resistance
    was offered, the troops were turned back, and the Ingelfingen patents of the taking of possession—

- page: 3
  en: were posted up; also, where on the opposing side they let themselves beygehen — which to post up,
    these were taken down again and Ingelfingen ones put up in their place. Thus stands the whole matter
    now — and there the arrival of His Serene Highness is most eagerly awaited, as now lord of the most
    flourishing fields of Franconia. His Highness will also set out on the journey thither in the month
    of September, once the Silesian reviews are ended; how long the stay will last is still undecided;
    only, His Serene Highness now believes he must all the more leave all the South Prussian affairs to
    Your Right Honourable's wise discernment, since His Highness will once again be away for a considerable
    time.

- page: 4
  en: 'All this I have wished to report to the same as in duty bound, and permit myself only to offer
    further the assurance of true veneration, in which I ever have the honour to be Your Right Honourable''s


    Wrocław, the 4th of August


    1805


    humble and obedient servant


    A. Hahn'

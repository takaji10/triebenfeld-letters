- page: 3
  en: 'were posted up; and even where, on the opposing side, they had allowed themselves — to post up
    theirs, these were taken down again and Ingelfingen ones put up instead. Such is the state of the
    whole affair now — and there the arrival of His Serene Highness is most ardently awaited, as henceforth
    lord of the most flourishing fields of Franconia. His Highness will also set out upon the journey
    thither in the month of September, once the Silesian [uncertain: Reonen] are concluded; how long the
    stay will last is as yet undecided; only His Serene Highness now believes all the South Prussian affairs
    must the more be left to Your Right Honourable''s wise discernment, since His Highness will once again
    be away for a considerable time.'

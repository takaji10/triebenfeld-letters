status: draft
segments:
- page: 1
  en: 'Done in the woodland, or rather the pine forest called Lusnia, pertaining to the estates of Łukom
    from antiquity, now possessed by the olędry to be specified below, and with the house situated there
    — on the Monday next after the Feast of All Saints in the year of the Lord one thousand seven hundred
    and seventy-one — in the presence of the Honourables and noblemen Cajetan Grabski, Antoni, father,
    and Konstanty, son, of the Fulwarski family, and Józef Jaroszewski, steward of Trąbczyn, and likewise
    of the General Authentic and Sworn Royal Court Summoner of the Realm, the Honest Joannes Bikierski
    of the village of Węgierce, proclaiming the present act.


    [Translator''s note: sylva seu Borra Lusnie: the seu ("or rather") signals a scribal self-correction:
    the act was first described as taking place in the sylva (woodland), then corrected to the Borra (pine
    forest) called Lusnia. The same self-correction with seu recurs in the [403] enrollment entry. Both
    terms are translated in accordance with the established vocabulary: sylva → woodland; borra/bór →
    pine forest.]


    [Translator''s note: Holendos infraspecificandos: "the olędry to be specified below" — a Neo-Latin
    gerundive compound (infraspecificandos, to be specified below), referring forward to the list of twelve
    settlers delivered later in the Polish section.]


    [Translator''s note: The presence of Józef Jaroszewski, steward of Trąbczyn — that is, Prusimski''s
    own estate manager — among the witnesses to this delivery of possession is legally significant. It
    establishes that Prusimski''s own representative was present at the formal handover, making any subsequent
    claim of ignorance difficult to sustain. The 1776 commission considered this delivery in full and
    found it unlawful, overturning it and ordering the olędry returned to Prusimski.]


    The below-named office, adhering to the Constitutions of the Realm and executing the condemnations
    or deliveries of possession of estates sanctioned [thereby], at the request and official requisition
    of the Right Honourable Stanisław Ścibor Chełmski, heir of the estates of Łukomia with their appurtenances
    and prevailing by right [of law], and for the production of decrees — or rather the penalty of outlawries
    with their publications —


    [Translator''s note: Condemnationibus seu Traditionibus Bonorum Sancitis: "condemnations or deliveries
    of possession of estates, sanctioned [by the Crown Constitutions]." The office acts in its capacity
    as executor of Crown-sanctioned legal instruments — both the condemnations (default judgements) and
    the deliveries of possession that flow from them.]


    the first, namely, on the Monday after the Feast of Saint Bartholomew the Apostle, in the disputed
    ground, in the year of the Lord 1761, and submitted for enrollment in the Konin municipal court records
    on the Wednesday after the Feast of Saint Matthew, Apostle and Evangelist, in the same year;


    [Translator''s note: The Konin Municipal Court is the court before which the Gr. 114 and Gr. 115 documents
    in this project were filed. The 1761 condemnation decree, filed there on Wednesday after Saint Matthew''s,
    is one of the instruments referenced by both parties throughout the subsequent proceedings.]


    then [pursuant to] the Tribunal condescension decree of the Crown Tribunal in the ordinary general
    sessions, on the Tuesday before the Feast of Saint Giles, Abbot, in the year of the Lord 1766 — between
    the same Right Honourable Chełmski on the one part and the Right Honourable Antoni Prusimski, Starost
    of Niszczewice, on the other part, and others appearing for that decree — issued at Bydgoszcz, by
    which, before all else, it was decreed as the primary matter that the estates of Łukom together with
    the estates of Trąbczyn be demarcated;


    [Translator''s note: in Comparitionem Decreti illius intrantes: "entering [i.e. appearing] for [the
    execution of] that decree" — the parties who had registered their court appearance in respect of the
    1766 Bydgoszcz Tribunal decree. The 1776 commission assessed this decree at length: it found that
    Prusimski had contravened it but ultimately released him from the full penalty, as the decree was
    subsequently superseded.]


    [Translator''s note: Cathegoria: used here in the sense of "the primary matter decreed" or "it is
    ordered as the first category of business that." Not classical usage; in Neo-Latin legal documents
    cathegoria can function as a term for a matter formally decreed or classified. Rendered as "it was
    decreed as the primary matter."]


    [Translator''s note: Bonorae: scribal error for Bonorum (genitive plural of Bonum/Bona, estates).]


    by the mandate of another [decree]: the Thursday after the Feast of the Exaltation of the Holy Cross,
    in the year of the Lord 1767, in the ordinary general sessions of the Crown Tribunal at Poznań;


    [Translator''s note: de Mandata alterius: "by the mandate of another [decree]" — introducing the 1767
    Poznań Tribunal decree as having issued pursuant to the 1766 Bydgoszcz decree. The expected form would
    be de Mandato (ablative singular); Mandata appears to be either ablative plural or a scribal error.
    The 1776 commission identified this 1767 decree as a second default judgement obtained against Prusimski,
    subsequently overturned by the 1768 decree.]


    and also [pursuant to] the Tribunal condescension decree in the ordinary general sessions of the Crown
    Tribunal, on the Monday after the Feast of the Visitation of the Most Glorious Virgin Mary, in the
    year of the Lord 1768 — between the Right Honourable Stanisław Chełmski, heir of the estates of Łukomia,
    Łomowo, and others, on the one part, and the Right Honourable Antoni Prusimski of Kolno,


    [Translator''s note: Decreti Tribunalibus Condescensionis: the Tribunal condescension decree. Tribunalibus
    is an unusual form in this position; the expected form would be Tribunalitii or Tribunalis (genitive).
    Translated in accordance with the evident meaning.]'
- page: 2
  en: 'Starost of Niszczewice, heir and possessor of the estates of Trąbczyn and others, on the other
    part, and others appearing for that same decree — issued at Bydgoszcz;


    the third [condescension] finally, at the condescension session on the Monday after the Sunday Cantate
    in the past year 1770, and submitted for enrollment in the Kalisz municipal court records on the Monday
    after the Feast of the Eleven Thousand Holy Virgins in the same year —


    obtained and published at the suit of the above-named Right Honourable Stanisław Ścibor Chełmski,
    heir of the estates of Łukomia and others, against the Right Honourable Antoni Prusimski, heir of
    the estates of Trąbczyn and others, on account of contravention of the above-specified decree, according
    to the meaning of the Tribunal decrees; the same process being broader in itself:


    [Translator''s note: alias eodem processu in se latiori existente: "otherwise, the same process being
    broader in itself" — a standard legal qualification acknowledging that the delivery of possession
    forms part of a wider and still-ongoing set of proceedings, without prejudice to the rest of that
    process.]


    as, after full conviction according to the meaning of the law, the above-mentioned office proceeded
    to the delivery of possession, of the following tenor:


    First, there is delivered to the Right Honourable His Worship Lord Chełmski the pine forest and woodland
    called Lusnia, and the olędry founded within it not very long ago, according to the description of
    the boundaries made by the heir of Trąbczyn, belonging to the said estates of Łukomia from antiquity,
    now called Olędry by the settlers. And that is, first, a cottage erected for the dispensing of drinks,
    with a new stable, without a master. Also delivered are the following olędry, namely: Michał Kinos,
    Henryk Bedka, Jan Tulka, Krystyan Tulka, Bogusław Zelmer, Samuel Frinderberg, Bogusław Effthman, Krzysztofowa
    Kulawa, Maci Klinczpor, Brudzewski the shepherd, Antoni Pisarz, Wawrzyniec Welner.


    [Translator''s note: W[ielmożnemu?] [Jegomości?]: a compressed Polish honorific formula, abbreviated
    in the manuscript. The expansion is almost certainly Wielmożnemu Jegomości — "to the Right Honourable
    His Worship" — in the dative, governing Panu Chełmskiemu. The same formula appears written out in
    full in the Gr. 115 documents as Wielmożnego Jegomości Pana Chełmskiego.]


    [Translator''s note: podług opisu granic przez dziedzica Trąpczyna uczynionego: "according to the
    description of the boundaries made by the heir of Trąbczyn." The boundaries of the area being delivered
    to Chełmski were delimited by reference to a description of boundaries previously made by Prusimski''s
    own side — the heir of Trąbczyn. This is consistent with what the 1776 commission noted: that Prusimski''s
    uncle had originally established the olędry on these woodlands in the time of Chełmski''s father,
    as attested by rights granted in 1746.]


    [Translator''s note: Chenryk: a Polish orthographic variant of Henryk (Henrik/Henry). The Ch- for
    H- initial is a documented period variant.]


    [Translator''s note: Samól: a phonetic spelling of Samuel.]


    [Translator''s note: Krzysztofowa Kulawa: the wife or widow of Krzysztof Kulawa. The Polish feminine
    suffix -owa indicates that the holder of this olęder farmstead is a woman — the widow or wife of a
    man named Krzysztof, with the surname or descriptive epithet Kulawa (lame/limping). She is the only
    female holder in the list.]


    [Translator''s note: [e?]: an uncertain letter or letters follow Welner''s name in the manuscript.
    The 1776 commission translation confirms that the delivery comprised exactly twelve olędry, and twelve
    names are listed here; the uncertain mark is therefore most likely a trailing scribal stroke or false
    start rather than an additional name.]


    Which delivery of possession having thus been completed, no one contesting it, and the inventory having
    been drawn up, [the office] left the same Right Honourable Chełmski in peaceful possession of the
    same estates, obtained by force of the legal process; and declared to the above-named olędry, as [those]
    possessing the lands of the Łukom estates, that obedience was to be rendered to the Right Honourable
    Chełmski, and enjoined it by virtue of the present delivery of possession.


    [Translator''s note: vi documenti Processu evictorum: "obtained by force of the legal process/document"
    — evictorum is the genitive plural of evictus (past participle of evinco, to obtain by legal process),
    agreeing with fundorum (estates). The estates are described as having been wrested from the opposing
    party by the force of the legal proceedings recited above.]


    Wawrzyniec Wstowski, General Sworn Commissioner of the Voivodeships of Poznań and Kalisz, by his own
    hand'
- page: 3
  en: '[Section 2 — Enrollment at the Kalisz Municipal Court]


    In the Kalisz Municipal Court, on the Saturday immediately before the Feast of Saint Martin, Bishop,
    in the year of the Lord 1771.


    To the office and present records of the Kalisz Municipal Court, appearing in person, the Honourable
    Antoni Serlatkowski presented to the present office for enrollment and for entering in these records
    the Delivery of Possession conducted in the woodland, or rather the pine forest, Lusnia, pertaining
    to the estates of Łukom from antiquity, having ensued [from the above decrees], of the following tenor:
    Let it be inserted. But the original of the same Delivery of Possession, left with the present records,
    was sewn into the Protocol.


    [Translator''s note: Subsecutam: "having ensued" — past participle of subsequor, describing the delivery
    of possession as having followed upon and resulted from the decrees recited above. Agreeing with Traditionem
    (feminine accusative).]


    [Translator''s note: Inseratur: "let it be inserted" — a formal imperative directing the clerk to
    insert the full text of the delivery of possession (the text of f. 402) into the court protocol at
    this point. The text of Section 1 is what was inserted pursuant to this instruction.]


    [Translator''s note: in Protocollon Insutum est: "was sewn into the Protocol" — from insuo (to sew
    in, to insert by stitching). The original physical document of the delivery of possession was attached
    to the court register by sewing, a standard archival practice for original instruments presented for
    enrollment.]'

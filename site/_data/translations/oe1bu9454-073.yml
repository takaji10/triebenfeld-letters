- page: 1
  en: '73


    Copy


    Your Right Honourable Sir,


    Highly Honoured Sir, Royal Councillor of Forests!


    The mounted messenger who brings Your Right Honourable this reply to your letter of the 1st of January.
    Arrived the day before yesterday in the afternoon; I [uncertain: sent] at once a mounted man with
    your letter to H. v. Weithausen at Koźle, who did me the friendly office of coming here yesterday,
    where we took the whole matter into consideration together, with the good Bally called in as well,
    whereupon this our common friend then had the kindness to let this letter of mine be dictated to him,
    so that it accordingly bears at the same time the stamp of his concurrence; the lease offer of Mr
    v. Brzechffa deserves my attention, and since Your Right Honourable''s counsel and [uncertain: opinion]
    carries great weight with me in every case, I shall therefore, honouring your insight as I do, take
    account of your proposal with particular favour; it is to be hoped that one will not wish to stop
    at the first bid. As to the putting of the 3 demesne farms into repair we shall no doubt come to agreement;
    the half-yearly payment of the lease rent seems to me advisable, and such payment must of course be
    made in advance; some cash security seems to me necessary and requisite for proper assurance, and
    I beg Your Right Honourable to make the arrangements accordingly: that the lease contract be concluded
    in such a way that with all caution every claim of remission and of recourse be guarded against lies
    in the nature of the thing; the security offered out of the whole of the tenant''s means may be very
    well, but in the present times almost only hard ringing coin is a [illegible] secure good pledge;
    the bearing of all charges on the tenant''s side I find natural; to fix a sum of relinquishment against
    a possible sale during the term of the lease I myself find [uncertain: prudent], and I shall let myself
    be found as reasonable as possible in that matter at the conclusion of the contract; in the contract
    everything on this head would then have to be determined precisely; this, and whatever other conditions
    may bear upon a sale of the estates, would then emerge more fully in the negotiations here.'

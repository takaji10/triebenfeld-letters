- page: 3
  en: 'would likewise be welcome to me, if only I might still [illegible] regard as feasible the disclosures
    made to me by the cavalry captain Mr v. Stössel of Rusinowice. The old Baron v. Stössel has fixed
    his arrival with me for these days, and I have been expecting him since the 6th of this month; on
    that occasion I will try to lay your plan before him once more, so as not to make myself guilty of
    any sin of omission in this matter either, notwithstanding that I expect nothing from it. We must
    now together strain every effort to procure me more help in money and to obtain a decent arrangement
    of my affairs. God bless your exertions in the Oleśnica and Trąbczyn matter, if only a considerable
    sum comes in thereby; do indeed seek to come to me very soon, and bring me other good news as well.
    I count upon it that you will soon [uncertain: 300 Rthl for the L. Sommer, which I would only send
    here as an offer]; for good measure I [uncertain: let] a written undertaking be given me concerning
    the manner in which these moneys may be procured there without disadvantage to me; the choice of means
    remains for the rest left to him, only I shall regard it as a great favour shown to myself if this
    business is negotiated very soon. Since you wish to obtain a couple of roebucks, I have charged my
    [uncertain: hunting staff] to procure me a few head of game, of whatever kind it may be; I shall then
    send them off at once to Blizanow in the company of your foot messenger, whom I have therefore kept
    back here still. For the large dog already described to me, which Your Right Honourable intends for
    me, I give my most devoted thanks, and I wish that you may send him to me soon or bring him with you.
    It remains for me still to return Your Right Honourable''s good wishes for the new year out of a faithful
    heart, and to embrace in my wishes for your welfare and contentment everything that'

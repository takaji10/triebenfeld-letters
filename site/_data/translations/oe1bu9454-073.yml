- page: 4
  en: 'everything can only further your own [uncertain: self-sufficing] happiness. Herewith I beg of you
    anew the continuance of your friendship, which I shall certainly return faithfully; I look forward
    to a speedy [uncertain: meeting again], and remain always in the most particular esteem


    Your Right Honourable''s


    Sławięcice, the 27th of January 1812. Most faithfully devoted friend and servant


    F. L., Prince of Hohenlohe'

- page: 1
  en: 'Copy


    Right Honourable Sir


    Highly Honoured Sir, Royal Councillor of Forests!


    The mounted messenger who delivers to Your Right Honourable this reply to your letter of the 1st of
    January. Could the day before yesterday afternoon [uncertain: on] I at once dispatched a mounted man
    with your letter to Mr. von Weithausen [uncertain: to] Cosel, who did me the friendly service of coming
    here yesterday, where we took everything into consideration together with the good Bolli being called
    in, whereupon this our common friend has the kindness to let this my letter be dictated to him, wherefore
    it at the same time bears the stamp of his concurrence; the lease offer of Mr. von Brzechsta deserves
    my attention, and since Your Right Honourable''s counsel and [uncertain: opinion] carry great weight
    with me in all cases, I shall therefore, inasmuch as I honour your insight, take it into consideration
    with your [illegible] with preference; it is to be hoped that one will not wish to stop at the first
    bid; concerning the putting-in-repair of the 3 demesne farms we shall doubtless come to agreement;
    the half-yearly payment of the lease rent seems to me advisable and such must naturally follow in
    advance; some cash security seems to me necessary for proper assurance, and I ask Your Right Honourable
    to make the [uncertain: necessary] arrangements upon this point: That the lease contract be concluded
    in such a way that with all caution all suits for remission and recourse be forestalled lies in the
    nature of the matter; the security offered out of the whole estate of the lessee may be very good,
    but in the present times almost only hard ringing coin is a [uncertain: secure] pledge; that the bearing
    of all burdens on the part of the lessee [uncertain: is his] I find natural; to fix a sum for withdrawal
    against a possible sale during the term of the lease I myself find [uncertain: proper], and I shall
    let myself be found as fair as possible in this at the conclusion of the contract; in the contract
    everything hereupon would then have to be [uncertain: precisely] determined; this and any other conditions
    tending toward a sale of the estates would then emerge more particularly in the negotiations here'

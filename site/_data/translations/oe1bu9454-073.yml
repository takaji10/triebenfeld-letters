- page: 2
  en: After these expressions of mine I believe that Your Right Honourable may come further with your
    friend, in which case I shall gladly lend a hand to the conclusion of the tenancy; in doing so, in
    my opinion, the term of the tenancy, the amount of the rent and the necessary conditions would also
    have to be quite exactly determined first; it follows of itself here, to be sure, that Mr. von Brzechsta
    would have to bring several thousand Reichsthaler with him in order to be able to conclude everything
    at once. With Mr. General von Schimmelpfennig I have not advanced a single step further in the matter
    of our estate dealings, which delay has arisen partly through the severe illness he suffered, partly
    through the negotiation of his sons in Berlin concerning the capital of their lady mother, which has
    not advanced so much as could be wished. But since I received the news yesterday that the General
    is now again taking his affairs in hand himself, I shall send to him and learn his decision more particularly.
    I confess that any respectable sale of the Zagorowo estates will always be the agreeable thing to
    me, and therefore I will here too so act that I need not reproach myself with any neglect of my duty
    towards myself; but since your friend in the tenancy is always to be covered by the stipulation of
    indemnification, I hope Your Right Honourable will let nothing hold you back from coming here with
    him as soon as possible, since for many reasons I must particularly wish that on the arrival of my
    children I may also be able to show that from the Zagorowo estates, through Your Right Honourable's
    exertions and preparatory work, as useful a return as possible has been drawn; further, we may hold
    it that political occurrences, and the pressing situation in which you find yourself on account of
    the dues to be rendered from the estates, make haste in the undertaking advisable, in which I would
    not hinder you. Your Right Honourable's project of sale to Mr. Weigel and Baron von Stössel

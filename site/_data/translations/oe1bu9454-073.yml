- page: 3
  en: 'would likewise be welcome to me, if only I might still regard it as practicable after the disclosures
    made to me by the cavalry captain von Stössel of Ruschinowitz; the old Baron von Stössel has fixed
    his arrival with me for these days, and I have been expecting him since the 6th of this month; on
    this occasion I will attempt to lay your plan before him once again, so as also in this matter, notwithstanding
    that I expect nothing of it, not to make myself guilty of any sin of omission. We must now together
    strain everything to procure me more pecuniary assistance and to attain a [uncertain: proper] [uncertain:
    arrangement] of my affairs. God bless your exertions in the Oleschwitz and Trotzin matter, if only
    a considerable sum comes in thereby soon; do seek to come to me very soon and bring me other good
    news as well; I count upon it that you will soon [send] 300 Rthl for the [uncertain: L.] Sommer, which
    I would send here only [uncertain: by messenger]; for good measure I shall have a written undertaking
    given me as to the manner in which these monies can be procured there without detriment to me; the
    choice of means moreover remains left to him, only I shall regard it as a great favour shown to myself
    if this business is negotiated very soon. Since you wish to obtain a pair of roebucks, I have charged
    my huntsman to procure me a few head of game, of whatever kind it may be; I shall then send them off
    at once to Blizanow in the company of your foot messenger, whom I have therefore kept back here. For
    the great dog, already described to me, which Your Right Honourable intends for me, I return most
    submissive thanks, and I wish that you may send him to me soon or bring him with you. It remains for
    me still to return Your Right Honourable''s New Year''s wish from a faithful heart, and to embrace
    in my wishes for your welfare and contentment everything that'

- page: 2
  en: 'After these my expressions I believe that Your Right Honourable may [uncertain: reach agreement]
    with your friend, whereupon I shall gladly offer my hand to the conclusion of the lease; herein, in
    my opinion, the term of the lease, the amount of the rent and the necessary conditions would also
    first have to be quite exactly determined; herein it follows of itself, to be sure, that Mr. von Brzechsta
    would have to bring several thousand Rthl with him, in order to be able to conclude everything at
    once. With the Mr. General von Schimmelpfennig I have not advanced a single step further in the matter
    of our estate transaction, which delay has arisen partly through his severely suffered illness, partly
    through the not so desirably advanced negotiation of his sons in Berlin concerning the capital of
    their lady mother. Since I received the news yesterday, however, that the General is now himself again
    taking up his affairs, I shall send to him and learn his decision more closely; I confess that any
    decent sale of the Zagorowo estates will always be the agreeable thing to me, therefore I will here
    also so act that I may not have to reproach myself with any reproach of a duty of omission toward
    myself; but since your friend in leasing is always to be covered by the stipulation of indemnification,
    I hope Your Right Honourable will let nothing hinder you from coming here with him as soon as possible,
    since for several reasons I must particularly wish that on the arrival of my children I may also be
    able to show that with the Zagorowo estates, through Your Right Honourable''s exertion and preparatory
    work, a possibly useful [uncertain: portion] has been drawn; [uncertain: after] we can hold it for
    this: political occurrences, and the pressing situation in which you find yourself on account of the
    dues to be rendered from the estates, make haste in the undertaking advisable, in which I would not
    hinder you, Your Right Honourable''s project of sale to Mr. Weigel and Baron von Stössel.'

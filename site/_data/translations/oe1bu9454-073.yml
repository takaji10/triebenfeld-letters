- page: 2
  en: 'After these declarations of mine I believe that Your Right Honourable may [uncertain: soon] come
    to further agreement with your friend, in which case I shall gladly lend my hand to the conclusion
    of the lease; herewith the term of the lease, the amount of rent and the necessary conditions would
    now, in my opinion, first have to be determined quite precisely; and in this it follows of itself
    that Mr v. Brzechffa would have to bring several thousand Rthl with him in order to be able to conclude
    everything at once. With the general Mr v. Schimmelpfennig I have not advanced a single step further
    in the matter of our estate transaction, which delay has arisen partly through the severe illness
    he has suffered, partly through the negotiation of his sons in Berlin concerning their lady mother''s
    capital, which has not advanced as much as could be wished. Since, however, I received news yesterday
    that the general is now again taking his affairs into his own hands himself, I shall send to him and
    learn his final resolution more nearly. I confess that any decent sale of the Zagórów estates will
    always be the agreeable thing to me, and therefore I will here also so act that I may have no reproach
    to cast upon myself for a breach of my duty of omission towards myself; but since your friend is always
    to be covered in the leasing by the stipulation of indemnification, I hope Your Right Honourable will
    let nothing hinder you from coming here with him as soon as possible, since for various reasons I
    must particularly wish that, on the arrival of my children, I may also be able to show that by Your
    Right Honourable''s exertion and preliminary work some useful [uncertain: portion] has been drawn
    from the Zagórów estates; thereafter we can hold it so: political occurrences, and the pressing situation
    in which you find yourself on account of the dues to be rendered from the estates, make haste in the
    undertaking advisable, wherein I would not hinder you. Your Right Honourable''s plan of sale to Mr
    Weigelt and Baron v. Stössel'

- page: 4
  en: 'everything can only further your own [uncertain: self-sufficing] happiness; hereupon and herewith
    I beg of you anew the continuance of your friendship, which I shall certainly faithfully return; I
    look forward to a speedy reunion and remain always in the most excellent


    esteem, most faithfully devoted friend and [uncertain: servant]


    F. L. Prince of Hohenlohe Schlawenschitz, the 27th of January 1812'

- page: 4
  en: 'everything that can only further your own [uncertain: self-sufficing] happiness; and herewith I
    beg of you anew the continuance of your friendship, which I shall certainly return faithfully. I look
    forward to a speedy reunion and remain always in the most distinguished


    esteem, your most faithfully devoted friend and [uncertain: servant]


    F. L. Prince of Hohenlohe Schlawenschitz, the 27th of January 1812'

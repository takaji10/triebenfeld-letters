- page: 1
  en: 'Copy


    Right Honourable Sir


    Highly Honoured Sir, Royal Councillor of Forests!


    The mounted messenger who brings Your Right Honourable this answer to your letter of the 1st of January.
    [uncertain: arrived] the day before yesterday in the afternoon, and I at once dispatched a mounted
    man with your letter to Mr. von Weithausen at Cosel, who did me the friendly service of coming here
    yesterday, where we took everything into consideration together with the assistance of the good Bolli,
    whereupon this our mutual friend had the kindness to let this letter of mine be dictated to him, so
    that it therefore at the same time bears the stamp of his concurrence; the tenancy offer of Mr. von
    Brzechsta deserves my attention, and since Your Right Honourable''s counsel and [uncertain: opinion]
    carry great weight with me in all cases, I shall, honouring your insight as I do, consider it with
    particular favour; it is to be hoped that one will not wish to stop at the first bid. Concerning the
    putting in order of the 3 demesne farms we shall doubtless come to agreement; the half-yearly payment
    of the tenancy rent seems to me advisable, and such must naturally be made in advance; some cash security
    seems to me necessary for proper assurance, and I ask Your Right Honourable to make the [uncertain:
    requisite] arrangement in this regard: that the tenancy contract be so concluded that with all foresight
    all claims for remission and recourse are forestalled lies in the nature of the matter; the security
    offered out of the whole property of the tenant may be very well, but in present times almost only
    hard ringing coin is a [uncertain: secure] pledge; that the bearing of all burdens should fall upon
    the tenant [uncertain: likewise] I find natural; to fix a sum for withdrawal in case of a possible
    sale during the term of the tenancy I myself find [uncertain: proper], and I shall let myself be found
    reasonable enough on that head at the conclusion of the contract; in the contract everything on this
    point would then have to be exactly determined; this, and any other conditions bearing upon a sale
    of the estates, would then emerge more particularly in the negotiations here'

- page: 3
  en: 'would likewise be welcome to me, if only I might still regard it as feasible after the disclosures
    made to me by Mr. cavalry captain von Stössel of Ruschinowitz. The old Baron von Stössel has fixed
    his arrival with me for these days, and I have been expecting him since the 6th of this month; on
    this occasion I mean to try to lay your plan before him once more, so as not to make myself guilty
    of any sin of omission in this matter either, notwithstanding that I expect nothing of it. We must
    now strain every effort together to procure me more assistance in money and to achieve a proper arrangement
    of my affairs. God bless your exertions in the Olesnica and Trąbczyn business, if only a considerable
    sum comes in thereby soon. Do seek to come to me very soon and bring me other good news besides; I
    count upon it that you will soon [send] 300 Rthl for [uncertain: L. Sommer], which I would only send
    here [uncertain: by offer]; for good measure I shall have a written undertaking given me as to the
    manner in which these monies can be procured there without disadvantage to me; the choice of means
    remains, moreover, left to the same, only I shall regard it as a great favour shown to myself if this
    matter is negotiated very soon. Since you wish to obtain a couple of roebucks, I have instructed my
    huntsman to procure me a few head of game, of whatever kind it may be; I shall then send them off
    at once to Blizanow in the company of your foot-messenger, whom I am therefore keeping back here yet
    a while. For the large dog, already described to me, which Your Right Honourable intends for me, I
    give my most devoted thanks, and I wish that you may send him to me soon or bring him with you. It
    remains for me to return Your Right Honourable''s good wishes for the New Year from a true heart,
    and to embrace in my wishes for your welfare and contentment everything that'

- page: 2
  en: 'The lordships of Zagórów and Trąbczyn belonging to the Prince of Hohenlohe in South Prussia, beyond
    Poznań in the Werthe, consist [uncertain: besten].


    1. Of the little town of Zagórów


    2. Of the village and demesne farm of Kopojno 3 Of the rent-village of Swiątniki


    4 ditto Skokum 5 of the rent-village and demesne farm of Oleśnica. 6 Of the rent-village of Drzewce.


    7 ditto Grądzyń


    8 ditto Wrąbczyn 9 Old Swięcia 10 New Swięcia 11 Sophienthal 12 Ludwigslust 13 Adelow 14 Friedrichsfelde
    15 Augustinow 16 Emilienhayn 17 Adolphsberg 18 Alexandrow 19 Klein Ingelfingen 20 Klein Öhringen 21
    Klein Neuenstein 12 Of the village and demesne farm of Trąbczyn 23 Of ditto Nowawies 24 Of the village
    or demesne farm of Przybysław 25 Of the rent-village of Stara Huta 26 Of the village and demesne farm
    of Mariantów


    27. Of the village and demesne farm of Szetlewek


    28. Of the rent-village of Furstenfelde


    29. Of ditto Hohendorff 30 of ditto Justinsau 31 of ditto Kaszubow 32 Of Klein Schro[uncertain: l]berg
    33 Of ditto Gros Holland 34 Of ditto Blomberg'

- page: 2
  en: 'The lordships Zagorowo and Trąbczyn belonging to the Prince of Hohenlohe in South Prussia, beyond
    Pexen on the Warthe, consist:


    1. Of the little town of Zagorowo


    2. Of the village and [uncertain: Vormuck] Kopojno 3. Of the rent-village Swiątniki


    4. ditto Skokum 5. Of the rent-village and demesne farm Olesnica. 6. Of the rent-village Drzewce.


    7. ditto Grądzin


    8. ditto Wrąbczin 9. Old Swięcia


    10. New Swięcia


    11. Sophienthal


    12. Ludwigslust


    13. Adelow 14. Friedrichsfelde 15. Augustinow


    16. Emilienhayn


    17. Adolphsberg


    18. Alexandrow 19. Little Ingelfingen 20. Little Öhringen 21. Little Neuenstein 22. Of the village
    and demesne farm Trąbczyn 23. Of ditto Nowawies 24. Of the village or demesne farm Przybislaw 25.
    Of the rent-village Stara Huta 26. Of the village and demesne farm Marianton


    27. Of the village and demesne farm Szetlewek


    28. Of the rent-village Furstenfelde


    29. Of ditto Hohendorf 30. Of ditto Justinsau[illegible] 31. Of ditto Kaszubow 32. Of Little Schro[uncertain:
    l]berg 33. Of ditto Great Holland 34. Of ditto Blomberg'

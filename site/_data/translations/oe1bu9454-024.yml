- page: 1
  en: '24


    Right Honourable Sir,


    Highly Honoured Sir, Privy Councillor!


    Through the colonisation of my South Prussian lordships of Zagórów and Trąbczyn, carried out with
    Royal approval, a net yield of the same amounting to 40,247 Rthl has been ascertained, and after careful
    examination has been confirmed by the Kalisz Chamber of War and Domains.


    This might put me in a position to bring my so long sought wish to fulfilment, and to arrange my debt
    affairs entirely. It depends, however, on whether it is possible to obtain a sum of 400,000 Rthl,
    namely as much as all my debts without exception amount to, in one single lot, against which I would
    then pledge the two aforenamed lordships, establish complete security thereupon with a first and sole
    mortgage, and would also fix a yearly sum for the payment of the interest and the amortisation of
    the capital, whereby this debt might be discharged in a few years.


    I most humbly request Your Right Honourable to undertake this business and, with your extensive acquaintance,
    to negotiate a loan of this kind. The power of attorney necessary for the purpose I shall transmit
    by the first post in any form you please. I have also instructed my general attorney to deliver to
    the same at once all the documents needful for the prosecution of this business, and to pay out without
    delay, for the men of business [uncertain: Geschlußsmanner] concurring in these affairs, a [illegible]gratuity[illegible]
    of 5 per cent as soon as the matter [uncertain: versteht]. With the most perfect esteem I am Your
    Right Honourable''s F[riedrich] L[udwig], P[rince] o[f] Hohenlohe. Freyberg, the 25th of September


    1806.'

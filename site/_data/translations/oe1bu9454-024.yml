- page: 3
  en: 'The annual net yield of the two lordships has been examined by a commission appointed by the Royal
    Kalisz Chamber of War and Domains and ascertained as follows.


    Tit. I. In standing dues from the old subjects in both lordships, according to the schedule of services,
    5,752 Rthl. 14 Groschen 4 Pfennig 2 in hereditary rents from the colonies 16,781 Rthl Tit. II


    In hereditary-lease canon 3,500 Rthl


    Tit III


    In leasehold parcels 13,357 Rthl


    Tit IV from 3 brickworks according to the Chamber''s valuation 857 Rthl Total 40,247 Rthl 14 Groschen
    11 Pfennig all taxes and burdens [uncertain: lasse], by whatever name they may go, have been taken
    over as well by the hereditary lessees [uncertain: Erben achtern], colonists, tenant peasants and
    term-lessees. The aforenamed sum of 40,247 Rthl 14 Groschen 11 Pfennig therefore stands firm as a
    net annual revenue.


    von Triebenfeld'

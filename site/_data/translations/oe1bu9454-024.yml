segments:
- page: 1
  en: 'Right Honourable Sir,


    Highly Honoured Privy Councillor!


    By the colonisation of my South Prussian lordships Zagorowo and Trombschen, carried out with Royal
    approval, a net yield from the same of 40 Rthl has been ascertained, and after exact examination has
    been confirmed by the Kalisz Chamber of War and Domains.


    This should put me in a position to bring my so long entertained wish to fulfilment, and to arrange
    my debt affairs entirely. It depends, however, upon whether it is possible to obtain a sum of 100000
    Rthl, namely as much as all my debts without exception amount to, in a single lot, against which I
    would then pledge the two aforenamed lordships, establish complete security upon them with a first
    and sole mortgage, and would also appoint a yearly sum for the payment of the interest and the amortisation
    of the capital, whereby this debt could be discharged in a few years.


    I most respectfully request Your Right Honourable to undertake this business and, with your wide acquaintance,
    to negotiate a loan of this kind. The power of attorney necessary thereto I shall transmit by the
    first post in any form you please. I have likewise instructed my general attorney to deliver to you
    at once all documents needed for the prosecution of this business, and, for the men of affairs cooperating
    in these matters, to pay out without delay a d[illegible]ongratie of 5 per cent as soon as the matter
    is [uncertain: understood]. With the most complete esteem I am Your Right Honourable''s


    F. L. P. of Hohenlohe. Freyberg, the 25th of September


    1806.'

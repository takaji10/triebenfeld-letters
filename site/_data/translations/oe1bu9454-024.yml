status: draft
segments:
- page: 1
  en: Right Honourable Sir, Highly Honoured Sir Privy Councillor! Through the colonisation of my South
    Prussian lordships Zagorowo and Trombschen, effected with Royal approbation, a net yield of the same
    of 40 Rthl has been ascertained, and, after exact examination, confirmed by the Kalisch Chamber of
    War and Domains. This should put me in a position to bring my so long asked-for wish to fulfilment,
    and to arrange my whole affair of debts entirely. It depends, however, upon whether it is possible
    to obtain a sum of 100000 Rthl, namely as much as my collective debts without exception amount to,
    in one single lot, against which I should then pledge the two aforenamed lordships, constitute complete
    security thereupon with a first and sole mortgage, and likewise determine a yearly sum for the payment
    of the interest and the amortisation of the capital, whereby this debt might be extinguished in few
    years. Your Right Honourable I most submissively request to undertake this business and, with your
    great acquaintance, to negotiate a loan of this kind. The power of attorney necessary thereto I shall
    transmit by the first post in any form you please. I have also instructed my General Plenipotentiary
    to deliver over to the same at once all documents needful for the prosecution of this business, and,
    for the men of business co-operating in these affairs, to pay out without delay a D[illegible]ongratie
    of 5 pt. as soon as the matter is understood. With the most perfect esteem I am Your Right Honourable's
    F. L. f. z. Hohenlohe Freyberg, the 25th of September 1806.
- page: 2
  en: 'The lordships Zagorowo and Trąbczin belonging to Prince Hohenlohe in South Prussia, beyond Posen
    on the Warthe, consist: 1. Of the little town of Zagorowo. 2. Of the village and demesne farm Kopoyno.
    3. Of the quit-rent village Swiątniki. 4. ditto Skokum. 5. Of the quit-rent village and demesne farm
    Olesnica. 6. Of the quit-rent village Drzewce. 7. ditto Grądzin. 8. ditto Wrąbczin. 9. Alt Swięcia.
    10. Neu Swięcia. 11. Sophienthal. 12. Ludwigslust. 13. Adelow. 14. Friedrichsfelde. 15. Augustinow.
    16. Emilienhayn. 17. Adolphsberg. 18. Alexandrow. 19. Klein Ingelfingen. 20. Klein Öhringen. 21. Klein
    Neuenstein. 12. Of the village and demesne farm Trąbczin. 23. Of ditto Nowawies. 24. Of the village
    and demesne farm Przybislaw. 25. Of the quit-rent village Stara Huta. 26. Of the village and demesne
    farm Marianton. 27. Of the village and demesne farm Szetlewek. 28. Of the quit-rent village Furstenfelde.
    29. Of ditto Hohendorf. 30. Of ditto Justinsau[uncertain: Justinsau]. 31. Of ditto Kaszubow. 32. Of
    Klein Schro[uncertain: l]berg. 33. Of ditto Gros Holland. 34. Of ditto Blomberg.'
- page: 3
  en: The yearly net yield of the two lordships has been examined by a Commission appointed by the Royal
    Kalisch Chamber of War and Domains and ascertained in the following manner. Tit. I. In fixed dues
    from the old subjects in both lordships, according to the Praestations-Tabelle, 5752 Rthl 14 g. 11
    d. 2. In hereditary quit-rents from the colonies, 16781. Tit. II. In hereditary-lease canon, 3500.
    Tit. III. In leasehold parcels, 13357. Tit. IV. From 3 brickworks, according to the Chamber's valuation,
    857. Total 40247 Rthl 14 g 11 d. All taxes and burdens, by whatever name they may go, are taken over
    as well by the hereditary lessees, colonists, term-peasants and term-tenants. Therefore the aforenamed
    sum of 40247 Rthl 14 g 11 d stands firm as a clear yearly revenue. v. Triebenfeld
- page: 4
  en: Debts of the Prince. To Schlabrendorff 25000. To Weigel 27000. To Ewald and Haupt 18000. Zerboni
    10000. The Eysenhardt heirs 10000. To Lichnowski 42000. To Grotowski 20000. Seehausen 5000. The Seher
    Toth heirs 8000. Prusimska circa 16000. The Invalids' Fund 50000. Oppenheimer and Wolff 110000. Bornstädt
    5000. Sundry debts circa 20000. Total 366000.

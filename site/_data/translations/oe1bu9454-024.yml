- page: 3
  en: 'The yearly net yield of the two lordships has been examined by a commission set up by the Royal
    Kalisz Chamber of War and Domains and ascertained as follows.


    Title I. In standing dues from the old subjects in both lordships, according to the table of prestations
    5752 Rthl 14 g. 11 d. 2. In hereditary rents from the colonies 16781 Title II


    In hereditary-lease canon 3500


    Title III


    In leased parcels 13357


    Title IV From 3 brickworks according to the Chamber''s valuation 857. Total 40247 Rthl 14 g 11 d.
    All taxes and burdens, by whatever name they may be called, have been assumed by the hereditary tenants,
    colonists, term-peasants and term-lessees. Therefore the aforenamed sum of 40247 Rthl 14 g 11 d stands
    fast as a net yearly revenue.


    v. Triebenfeld'

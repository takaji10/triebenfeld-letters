- page: 2
  en: 'I arrived here yesterday, and this very hour I hasten on to Kalisz and Trąbczyn, in order to drive
    together there what is possible, so that I may be able to make out an order of payment to Your Serene
    Highness for a sum at Fürth. In Pszczew I have put everything in order so far, that Your Serene Highness
    need no longer be troubled by the creditors there. Echaust is entirely satisfied and has given a receipt
    before the court, and there remains for Your Serene Highness 4,000 Rthl which the deputies must pay
    on the 6th of July. These I already think to apply towards the 30,000 Rthl. Now it depends upon what
    I shall find in Trąbczyn. There the tenants had still 6,000 Rthl to pay. 60,000 Rthl were to come
    in as entry moneys; the Midsummer rent amounts, from the tenants alone, to 10,000 Rthl; the Midsummer
    interest from the peasants and hereditary purchasers amounts to some 4,000 Rthl; the Wrąbczyn and
    Swięcia people must pay some 1,800 Rthl; the Oleśnica people are already some 16,000 Rthl in arrear:
    this amounts to some 102,000 Rthl of outstanding arrears. It now depends upon whether Schenck has
    been a [uncertain: Can:] or an honest, industrious fellow. For he has the charge of collecting in
    what is possible, so that Your Serene Highness may receive a considerable sum at Midsummer.


    Grattenauer is a lazy, false brute — he does nothing,'

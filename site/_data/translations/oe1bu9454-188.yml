- page: 1
  en: '188


    Most Serene Prince


    Most gracious Lord!


    In Berlin I succeeded in the end better than I had believed, through the help of our friends General
    von Köckritz and Cabinet Councillor Beyme; the Lord Grand Chancellor is giving some 176,000 Rthl out
    of the Justice Fund, wherewith all the burdensome creditors upon the estates, and in particular Mr
    Weigel here, will be paid. — Above all I am concerned to set the mortgage of 200,000 Rthl pledged
    with Oppenheimer afloat again.


    The [uncertain: Ge] Schlabrendorff I shall pay in this manner, that I take 20,000 Rthl upon a Świniary
    mortgage from the councillor of war von Hellen, which I had meant to pay over to Mrs von Wulffen of
    Konotop, but which can for the present still stand.


    If all this is attended to, then Your Serene Highness will soon be in the clear, especially as regards
    the 300,000 Rthl Courant debt, upon which they are willing to wait provided the interest continues
    to be paid.


    The cursed small items of debt press the hardest of all, for these [uncertain: Kaste] creditors make
    the most outcry over their trifles. — Altogether I have this time been in such straits that I must
    thank God a hundredfold if it can all be smoothed out,'

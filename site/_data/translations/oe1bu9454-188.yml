- page: 2
  en: 'Yesterday I arrived here, and this very hour I hasten on to Kalisz and Trąbczyn, in order to drive
    together there what is possible, so that I may make over an order to pay a sum to Your Serene Highness
    at Türth. In Betsche I have put everything in order so far that Your Serene Highness need no longer
    be troubled by the creditors there. Echaust is fully satisfied, has given a receipt before the court,
    and there remains for Your Serene Highness 4000 Rthl which the deputies must pay on the 6th of July.
    These I think to take now already towards the 30000 Rthl. Now it depends on what I shall find at Trąbczyn.
    There the lessees still had 6000 Rthl to pay. 60000 Rthl were to come in as entry-money gulden; the
    Midsummer rent amounts, from the lessees alone, to 10000 Rthl; the peasants'' and hereditary purchasers''
    Midsummer interest amounts to some 4000 Rthl; the Trąbczyn and Swięcier [text lost] pay some 1800
    Rthl; the Olesnicer are already some 16000 Rthl in arrears; this amounts to some 102000 Rthl of outstanding
    arrears. It now depends upon whether Schenck has been a Can: or an honest, diligent fellow. For he
    has the commission to collect in what is possible, so that Your Serene Highness may receive a considerable
    sum at Midsummer.


    Grattenauer is a lazy, false beast — He does nothing,'

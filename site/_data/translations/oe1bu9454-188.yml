- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    In Berlin it succeeded in the end better than I had believed, through the help of the friends G. v.
    K. CV B.; the Lord Grand Chancellor gives out of the Justice Fund some 176000 Rthl, and with that
    all the burdensome creditors upon the estates, and especially Mr. Weigel here, will be paid — It lies
    with me above all to set afloat again the mortgage of 200000 Rthl pledged with Oppenheimer.


    The Schlabrendorff [claim] I shall pay in such a manner that I take 20000 Rthl upon a Schweiner mortgage
    from the Councillor of War von Hellen, which I had meant to pay over to Madame von Wulffen of Kontop,
    but which can now still stand over.


    If all this is attended to, then Your Serene Highness will soon be in the clear, especially as they
    are willing to wait with the 300000 Rthl [uncertain: Gusl] debt so long as the interest continues
    to be paid.


    The accursed small items of debt press the hardest, for these [uncertain: Kaste] creditors make the
    most outcry over their trifles. Altogether I have this time been in such a press that I must thank
    God a hundredfold if it is all smoothed out,'

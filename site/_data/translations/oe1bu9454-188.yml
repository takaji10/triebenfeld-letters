- page: 3
  en: 'and now sits continually with the Minister, who, as I hear this very moment, has given him a post-horse
    pass for a journey into the mountains and Upper Silesia. How can the wretched fellow take a salary
    from Your Serene Highness when he serves the Minister as his agent? The rascal ought to be arrested
    for debt; I advanced him his salary for 1 1/2 years, and now that he has it he does nothing more.
    — Little by little I give up the hope of ever finding an honest man.


    God grant me that all goes happily and well at Trąbczyn. — In deepest reverence I remain, until death,


    Your Serene Highness''s


    Wrocław, the 25th of June


    1806.


    faithful and most obedient servant


    von Triebenfeld'

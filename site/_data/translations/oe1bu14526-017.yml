status: draft
segments:
- page: 1
  en: 'Be it hereby known to everyone to whom it is needful to know the same, that between the Royal District
    Justice Commission Actuarius Kunkel, as authorised representative (Bevollmächtigter) of His Most Serene
    Highness the reigning Prince, Lord Lord Friedrich Ludwig, Fürst zu Hohenlohe Ingelfingen, lord of
    the manor of the lordship of Trąbczyn, as seller and hereditary-rent lord, of the one part, and the
    following persons, namely


    1. the Hollander Martin Giering from Racotten


    2. the Hollander Wilhelm Daniel Schulz from Krolikower Holländ


    3. the Hollander Gottfried Dumel from Razoten


    4. the Hollander Michael Dumel of the same place


    5. the Hollander Gottfried Damt of the same place. 6 the Hollander Christoph Schoenfisch from Trąbczyner
    Holländ.


    as purchasers and takers-up of the other part, the following contract has been advisedly agreed and
    concluded.


    §. 1.'
- page: 2
  en: '§ 1. The aforementioned Kunkel sells, with the express reservation of the approval of His Most
    Serene Highness, from the demesne farm belonging to the lordship of Trąbczyn called Alte Hütte, Ten
    Hufen and Ten Morgen Magdeburg measure, of arable as well as non-arable fields, meadows, [uncertain:
    Kärte], marshes, together with the field crops standing thereon, timber and [uncertain: Ströml.] works,
    and with the farm buildings standing thereon, the cow-stall excepted, to the aforementioned purchasers,
    with the liberty of dividing the same into six equal holdings; and both for now and for ever each
    owner of a holding shall be fully entitled to dispose freely over the same as over his wholly unrestricted
    property, both among the living and in case of death. Such a holding may therefore be sold, exchanged,
    [uncertain: mortgaged] and [uncertain: pledged]; however, one holding, and whatever is now allotted
    to it in arable and meadow, may not be [uncertain: divided] into smaller parts, nor may anything be
    taken away from it.'
- page: 3
  en: '§. 2. The purchasers and takers-up hereby bind themselves to pay a duly stipulated purchase price
    of 250, in words two hundred and fifty, for each Hufe Magdeburg measure, thus in sum 2500 rtr, in
    words two thousand five hundred Reichsthaler in Prussian heavy Courant at 64 rthl, and to effect the
    settlement as follows:


    a. As earnest money the purchasers pay upon signature of the contract 450 rtr, in words four hundred
    and fifty Reichsthaler


    b. At St. John''s 1804 there shall be settled 550 rtr, say five hundred and fifty Reichsthaler


    c. the remainder, with 1500 rtr, say fifteen hundred Reichsthaler, however, shall be paid over to
    the seller at the Annunciation of Mary, that is on the 23rd of March 1805. For the [uncertain: payment]
    one stands liable for all and all for one. Concerning the earnest money of 450 rthr, in words four
    hundred and fifty Reichsthaler, the purchasers shall be furnished with a'
- page: 4
  en: 'printed receipt of the [uncertain: Leisiäger] Noerlich, as being the person authorised to receive
    it. As purchase and rent-holding, the purchasers receive for house and farmstead sites six Morgen
    Mag[deburg measure]; the erection of the dwellings and farm buildings, as well as their continuing
    upkeep, is at the purchasers'' own cost.


    §. 3. The purchasers, and every holder of a holding on this Alte Hütte, is obliged to render annually
    to the leasehold treasury, for each Hufe Magdeburg measure, a ground- and hereditary rent of [uncertain:
    five] Reichsthaler Prussian Courant, the Thaler at 24 gg Brandenburg, and that at Martinmas and St.
    George''s, each time by half, with the sum in words five Reichsthaler per Hufe; whereof the beginning
    shall be made at Martinmas 1804. Of non-arable grounds the settlers shall have a freedom from rent
    of 3 years, say three.


    §. 4. Besides this hereditary rent to be rendered annually, the same are obliged to bear all Royal
    and ecclesiastical dues, competency-payments and burdens, both present'
- page: 5
  en: 'and future, customary and uncustomary, in times of war and of peace, forage, and by whatever other
    name they may go, and to remit them promptly to the customary sovereign and other treasuries; for
    which all landholders on the Alte Hütte stand liable, one for all and all for one.


    §. 5. Although His Most Serene Highness has the confidence that every holder will promptly satisfy
    the obligation assumed by him in §. 4, yet His Highness is nevertheless willing, for the security
    of the sovereign treasuries, hereby to undertake, in respect of the customary Royal impositions, to
    accede to the joint and several liability of payment of the inhabitants on the Alte Hütte. Reserving,
    however, expressly to Himself the damage, disadvantage and interest on any advances arising to Him
    from a failure to remit the Royal dues promptly.


    §. 6. For [uncertain: standing and fallen] timber, the landholders on the Alte'
- page: 6
  en: 'Hütte are hereby permitted to fetch it from the Trąbczyn forest on the lawful wood-days; but every
    holder of a holding is obliged, in the month of September of each year, to take out a wood-ticket
    for the months from October until [uncertain: old Lady Day], and to pay 16 gg, say sixteen good Groschen,
    to the manorial forest treasury; whereby he is also at liberty, for two days, to dig and take out
    pine stumps from this forest, under the supervision and by the direction of the forester. It is likewise
    permitted to the settlers, as elsewhere in [uncertain: the manner], to rake pine needles under the
    direction of the forester; however, plantations under protection must be entirely spared thereof.


    §. 7. So far as the forest police and the economy of the same permit and allow, the landholders of
    the Alte Hütte shall have the right of pasture with horned cattle and sheep in the woodland of the
    lordship of Trąbczyn.


    §. 8. By the powers granted in §. 6 & 7 to the oft-mentioned holders, His Most Serene Highness''s'
- page: 7
  en: 'rights and powers, to establish other colonies in the forest and to provide these with the same
    rights as are mentioned in §. 7 and 8, nor any other disposition in respect of the forest, shall not
    thereby be restricted.


    §. 9. Upon changes of holding of every kind — inheritances devolving between [uncertain: spouses],
    parents and children, however, excepted — a laudemium of ten Reichsthaler in [uncertain: one] hundred,
    that is 10 per cent., shall be paid to the Dominium.


    The purchasers named in this contract remain exempt therefrom, upon [uncertain: notification] of the
    change of holding, until the Annunciation of Mary of the year 1803.


    §. 10. Before every change of holding, the approval of the Dominium must be sought for the same, and
    the agreements thereafter drawn up concerning it must be laid before the same for confirmation.


    §. 11. For the new establishments the purchasers shall receive 5000 pieces, say five thousand pieces,
    of wall-brick, against payment'
- page: 8
  en: 'of the costs, at three Reichsthaler per mille, from the Trąbczyn brickworks; where they are hereby
    likewise permitted to take clay for the same purpose.


    §. 12. The handing over of these purchased lands, meadows and [uncertain: pasture] takes place at
    St. John''s 1804; yet solely upon the condition that the payment of purchase money of 550 rtr stipulated
    for St. John''s of this year is made; in the contrary case the same shall be refused and the earnest
    money is hereby fixed as a conventional penalty. Meanwhile it shall remain open to the purchasers,
    immediately upon the approval of this contract by His Most Serene Highness, to proceed with the preparation
    of the [uncertain: laudemium] for the necessary sowings.


    §. 13. The shepherd presently on this demesne farm remains, with his flock, until the expiry of his
    contract, that is until Michaelmas 1807. The dung remains the property of those settled on the land.'
- page: 9
  en: '§. 14. On the seller''s part it is hereby expressly consented that, on the ground of this contract,
    a Titulus Possessionis be made out for each individual [uncertain: holder] of a holding.


    §. 15. On the purchasers'' part it is hereby expressly consented that the hereditary rent stipulated
    in §. 3 be entered in the mortgage book of each individual holding.


    §. 16. The inhabitants of the Alte Hütte are [uncertain: obliged] to take the drinks they require,
    in beer and brandy, from the manorial brewery and brandy-distillery or tap-houses.


    §. 17. As regards the school for their youth, it is left to them to have themselves incorporated into
    the Hollander community at Trąbczyn. As regards the police constitution, they are obliged to submit
    themselves to the same.


    The stamp duties of this contract shall be borne by both'
- page: 10
  en: 'parties by halves. The foregoing contract has been read out loudly and intelligibly; it is approved
    throughout by both parties, and all objections and benefits of law — such as those of guile, of overreaching,
    of injury beyond the half — are renounced, and it has been signed by all. Immediately upon the ratihabition
    of this contract on the part of His Most Serene Highness, the same shall be duly published at law.


    So done, Zagorowo, the 26th of May One Thousand Eight Hundred and Four


    Kunkel, Special Authorised Representative of His Most Serene Highness zu Hohenlohe Ingelfingen.


    [uncertain: mört in Göring] Signa xxx of Michael Dümel Signa xxx of Gottfried Dams Signa xxx of Gottfried
    Dümel Signa xxx of Wilhelm Daniel Schultz Signa xxx of Christoph Schoenfisch Leopolde Conductus Ludewich
    Anitz as witness qua Testis'

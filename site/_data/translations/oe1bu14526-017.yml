- page: 3
  en: '§ 2. The purchasers and takers-up hereby bind themselves to pay a duly stipulated purchase price
    of 250, in words two hundred and fifty, for each Hufe Magdeburg measure, thus in total 2500 Rthl,


    in words two thousand five hundred Reichsthaler in Prussian coarse Courant at 64 Rthl, and to effect
    the settlement as stated.


    a. As earnest money the purchasers shall pay on signing the contract 450 Rthl, in words four hundred
    and fifty Reichsthaler


    b. At Midsummer 1804 there shall be settled 550 Rthl, say five hundred and fifty Reichsthaler


    c. the remainder, 1500 Rthl, say fifteen hundred Reichsthaler, shall however be paid over to the seller
    at the Annunciation of Mary, that is on 23 March 1805. For the settlement one is liable for all and
    all for one. As to the earnest money of 450 Rthl, in words four hundred and fifty Reichsthaler, the
    purchasers shall be furnished with a'

- page: 10
  en: 'parties in halves. The foregoing contract has been read out loudly and intelligibly; it is approved
    throughout by both parties, and all objections and benefits of law, such as of deceit, of over-persuasion,
    and of injury beyond the half, are renounced, and it has been signed by all. Immediately upon the
    ratihabition of this contract by His Most Serene Highness, the same shall be duly published at law.


    Thus done at Zagorowo, the 26th of May, one thousand eight hundred and four.


    Kunkel, special authorised representative of His Most Serene Highness of Hohenlohe-Ingelfingen.


    [uncertain: mört] in Göring. Mark xxx of Michael Dümel. Mark xxx of Gottfried Dams. Mark xxx of Gottfried
    Dümel. Mark xxx of Wilhelm Daniel Schultz. Mark xxx of Christoph Schoenfisch. Leopolde Conductus.
    Ludewich Anitz as witness, qua testis'

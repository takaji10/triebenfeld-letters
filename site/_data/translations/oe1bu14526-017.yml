status: draft
segments:
- page: 1
  en: 'Be it hereby known to everyone to whom knowledge thereof is needful, that between the Royal District
    Justice-Commission Actuary Kunkel, as authorised representative of His Most Serene Highness the reigning
    Prince, Lord, Lord Friedrich Ludwig, Fürst zu Hohenlohe Ingelfingen, lord of the manor of the lordship
    of Trąbczyn, as seller and hereditary-rent lord, of the one part, and the following persons, namely


    1. the Hollander Martin Giering of Racotten


    2. the Hollander Wilhelm Daniel Schulz of Krolikower Holländ


    3. the Hollander Gottfried Dumel of Razoten


    4. the Hollander Michael Dumel of the same place


    3. the Hollander Gottfried Damt of the same place. 6 the Hollander Christoph Schoenfisch of Trąbczyner
    Holländ.


    as purchasers and takers-up, of the other part, the following contract has been deliberately agreed
    upon and concluded.


    §. 1.'
- page: 2
  en: '§ 1. The aforementioned Kunkel sells, with the express reservation of the approval of His Most
    Serene Highness, out of the demesne farm belonging to the lordship of Trąbczyn called Alte Hütte,
    Ten Hufe and Ten Morgen Magdeburg measure, of arable as well as non-arable fields, meadows, [uncertain:
    Kärte], marshes, together with the field crops standing thereon, timber and [uncertain: Ströml.] works,
    and the farm buildings standing thereon, the cow-byre excepted, to the aforementioned purchasers,
    with the right to divide the same into six equal holdings; and both now and for ever every owner of
    a holding shall be fully entitled to dispose freely of the same as of his wholly unrestricted property,
    both among the living and in case of death. Such a holding may therefore be sold, exchanged, [uncertain:
    given away] and mortgaged; however, a holding, together with what is now allotted to it in arable
    and meadow, may not be divided into smaller parts, nor may anything be taken away from it.'
- page: 3
  en: '§. 2. The purchasers and takers-up hereby undertake to pay a duly stipulated purchase money of
    250, in words two hundred and fifty, for each Hufe Magdeburg measure, thus in total 2500 Rthl,


    in words two thousand five hundred Reichsthaler in Prussian coarse Courant at 64 Rthl, and to effect
    the discharge as follows:


    a. As earnest-money the purchasers shall pay on signature of the contract 450 Rthl, in words four
    hundred and fifty Reichsthaler


    b. At St. John''s 1804 there shall be discharged 550 Rthl, say five hundred and fifty Reichsthaler


    c. The remainder, with 1500 Rthl, say fifteen hundred Reichsthaler, shall however be paid over to
    the seller at the Annunciation of Mary, that is the 23rd of March 1805. For the [uncertain: payment]
    one stands liable for all and all for one. Over the earnest-money of 450 Rthl, in words four hundred
    and fifty Reichsthaler, the purchasers shall be furnished with a'
- page: 4
  en: 'printed receipt of the [uncertain: Leisiäger] Noerlich, as the person authorised to receive it.
    As purchase and rent-free [land] the purchasers shall receive for house and farmstead sites six Morgen
    Mag[deburg measure]; the erection of the dwellings and the farm buildings, as well as their continued
    upkeep, is at the purchasers'' expense.


    §. 3. The purchasers, and every holder of a holding on this Alte Hütte, is obliged to pay yearly to
    the lordship''s treasury, for each Hufe Magdeburg measure, a ground- and hereditary rent of [uncertain:
    ten] Reichsthaler Prussian Courant, the Thaler at 24 gg. Brandenburg, and that at Martinmas and St.
    George''s, each time by half, with five Reichsthaler per Hufe in words; whereof the beginning is made
    at Martinmas 1804. For non-arable grounds the settlers shall have a freedom from rent of 3, say three,
    years.


    §. 4. Besides this yearly hereditary rent to be paid, the same are obliged to bear all Royal and ecclesiastical
    dues, competences and charges, both present'
- page: 5
  en: 'and future, ordinary and extraordinary, in times of war and of peace, forage, and by whatever name
    they may go, and to remit them promptly to the customary sovereign and other treasuries, for which
    all the landholders on the Alte Hütte are liable one for all and all for one.


    §. 5. Although His Most Serene Highness has the confidence that every holder will promptly satisfy
    the obligations undertaken in § 4, yet, for the security of the sovereign treasuries, He is pleased
    herewith to bind Himself, in respect of the ordinary Royal charges, to accede to the joint and several
    payment liability of the inhabitants on the Alte Hütte. Reserving, however, expressly to Himself the
    damage, disadvantage and interest for any advances arising to Him from a not promptly effected remittance
    of the Royal dues.


    §. 6. Timber for building and gathering shall for the landholders on the Alte'
- page: 6
  en: 'Hütte hereby be permitted to be fetched from the Trąbczyn forest on the lawful wood-days; but every
    holder of a holding is obliged, in the month of September of each year, to take out a wood-ticket
    for the months of October to old Lady Day and to pay 16 gg., say sixteen good Groschen, to the lordship''s
    forest treasury; whereby it is also free to him, for two days, to dig and take out pine-stumps from
    this forest, under the supervision and instruction of the forester. Likewise it stands open to the
    inhabitants, as [uncertain: heretofore], to rake pine-needles for litter under the instruction of
    the forester; however, the young plantations must be wholly spared therefrom.


    §. 7. So far as the forest police and economy of the same permits and makes admissible, the landholders
    of the Alte Hütte shall have the right of pasture with horned cattle and sheep in the woodland of
    the lordship of Trąbczyn.


    §. 8. By the powers granted to the oft-mentioned holders in §§. 6 & 7, neither His Most Serene Highness''s'
- page: 7
  en: 'rights and powers to establish further colonies in the forest, and to furnish these with the same
    rights as are mentioned in §§ 7 and 8, nor any other disposition in respect of the forest, shall be
    restricted thereby.


    §. 9. On changes of possession of every kind — inheritances devolving between spouses, parents and
    children being however excepted — a laudemium of ten Reichsthaler in [uncertain: one] hundred, that
    is 10 per cent, shall be paid to the Dominium.


    The purchasers named in this contract shall, on the first change of possession, remain exempt therefrom
    until the Annunciation of Mary of the year 1803.


    §. 10. Before every change of possession, the approval of the Dominium must be sought for the same,
    and the contracts thereupon drawn up concerning it must be laid before the same for confirmation.


    §. 11. For the new establishments the purchasers shall receive 5000 pieces, say five thousand pieces,
    of mason''s bricks, against payment'
- page: 8
  en: 'of the costs, at three Reichsthaler per mille, from the Trąbczyn brickworks; where the same are
    hereby likewise permitted to take clay for the same purpose.


    §. 12. The handing over of these purchased lands, meadows and [uncertain: pasture] takes place at
    St. John''s 1804; yet solely on the condition that the payment of the purchase money of 550 Rthl stipulated
    for St. John''s of this year is made; in the contrary case the same shall be refused, and the earnest-money
    is hereby fixed as a conventional penalty. Meanwhile it shall remain open to the purchasers, immediately
    upon the approval of this contract by His Most Serene Highness, to proceed with the preparation of
    the [uncertain: laudemium] for the necessary sowings.


    §. 13. The [uncertain: shepherd] present on this demesne farm remains with his sheep-run until the
    expiry of his contract, that is until Michaelmas 1807; the [uncertain: younger/manure] remains the
    property of the landholders'
- page: 9
  en: '§. 14. On the seller''s side it is herein expressly consented that, on the ground of this contract,
    a Titulus Possessionis shall be made out for each individual [uncertain: holder] of a holding.


    §. 15. On the purchasers'' side it is herein expressly consented that the hereditary rent stipulated
    in


    § 3 shall be entered in the mortgage book of each individual holding.


    §. 16. The needed beverages of beer and brandy the settlers of the Alte Hütte are bound to take from
    the lordship''s brewery and distillery, or from the tap-houses.


    §. 17. With regard to the school for their children, it is left to them to have themselves incorporated
    into the Hollanders'' congregation at Trąbczyn. With regard to the police constitution, they are obliged
    to conform to the same.


    The stamp duties of this contract shall be borne by both'
- page: 10
  en: 'parties by halves. The foregoing contract has been read out loud and intelligibly; it is approved
    throughout by both parties, and all objections and benefits of law, such as those of guile, [uncertain:
    overreaching], injury beyond and under the half, are renounced, and it has been signed by all. Immediately
    upon the ratihabition of this contract by His Most Serene Highness, the same shall be lawfully published.


    Thus done at Zagorowo, the 26th of May One Thousand Eight Hundred and Four


    Kunkel, Special Authorised Representative of His Most Serene Highness of Hohenlohe Ingelfingen.


    [uncertain: mört in Göring] Signa xxx of Michael Dümel Signa xxx of Gottfried Dams Signa xxx of Gottfried
    Dümel Signa xxx of Wilhelm Daniel Schultz Signa xxx of Christoph Schoenfisch Leopolde Conductus Ludewich
    Anitz as witness, qua Testis'

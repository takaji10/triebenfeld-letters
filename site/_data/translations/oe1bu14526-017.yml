- page: 7
  en: 'to establish other colonies in the forest and to furnish these with the same rights as are mentioned
    in §§ 7 and 8, nor any other disposition in respect of the forest, may be restricted thereby.


    § 9. Upon changes of possession of every kind — inheritances falling between spouses, parents and
    children being however excepted — a transfer fee (Laudemium) of ten Reichsthaler in [uncertain: one]
    hundred, that is 10 per cent, shall be paid to the manorial lordship (Dominium).


    The purchasers named in this contract shall, upon a first change of possession, remain exempt therefrom
    until the Annunciation of Mary in the year 1803.


    § 10. Before any change of possession the approval of the lordship must be sought for the same, and
    the agreements thereafter drawn up concerning it must be laid before it for confirmation.


    § 11. For the new establishments the purchasers shall receive 5000 pieces, say five thousand pieces
    of building brick, against payment'

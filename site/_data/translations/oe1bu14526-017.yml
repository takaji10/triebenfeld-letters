- page: 4
  en: 'printed receipt from the [uncertain: bailiff] Noerlich, as the person authorised to receive it.
    As purchase and rent-land the purchasers shall receive for house and farmstead sites six Morgen Magdeburg
    measure; the erection of the dwellings and farm buildings, as also their continual upkeep, is at the
    purchasers'' cost.


    § 3. The purchasers, and every holder of a holding on this Alte Hütte, is bound to pay yearly to the
    lordship''s treasury for each Hufe Magdeburg measure a ground and hereditary rent of [uncertain: ten]
    Reichsthaler Prussian Courant, the thaler at 24 Brandenburg Groschen, and that at Martinmas and St
    George''s Day, each time one half, namely five Reichsthaler per Hufe in words; the beginning to be
    made at Martinmas 1804. For unarable ground the settlers shall have a freedom from rent of 3 years,
    say three.


    § 4. Besides this hereditary rent to be paid yearly, they are bound to bear all royal and ecclesiastical
    dues, competency payments and charges, both present'

- page: 2
  en: § 1. The aforesaid Kunkel sells, with the express reservation of the approval of His Most Serene
    Highness, from the demesne farm belonging to the lordship of Trąbczyn called Alte Hütte, ten Hufen
    and ten Morgen Magdeburg measure, of arable as well as unarable fields, meadows, gardens, marshes,
    together with the field crops, timber and [illegible] works found thereon, and with the farm buildings
    standing thereon, the cow-byre excepted, to the purchasers named at the outset, with the liberty to
    divide the same into six equal holdings; and both now and for ever every proprietor of a holding shall
    be fully entitled freely to dispose of the same as of his wholly unrestricted property, both among
    the living and in case of death. Such a holding may therefore be sold, exchanged, mortgaged and pledged;
    however, a holding, and whatever of field and meadow is now assigned to it, may not be divided into
    smaller parts, nor may anything be taken away from it.

- page: 8
  en: 'of the costs, at three Reichsthaler per thousand, from the Trąbczyn brickworks; where it is hereby
    likewise permitted them to take clay for the same purpose.


    § 12. The delivery of these purchased lands, meadows and usufructs takes place at Midsummer 1804;
    yet solely upon the condition that the payment of the purchase money of 550 Rthl stipulated for Midsummer
    of this year is made; in the contrary case delivery shall be refused and the earnest money is hereby
    fixed as a conventional penalty. Meanwhile it shall remain open to the purchasers, immediately upon
    the approval of this contract by His Most Serene Highness, to proceed with the preparation of the
    [uncertain: Laudemium] for the necessary sowings.


    § 13. The shepherd presently on this demesne farm remains with his sheepfold until the expiry of his
    contract, that is until Michaelmas 1807. The dung remains the property of the landholders.'

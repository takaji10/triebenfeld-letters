- page: 5
  en: 'and future, ordinary and extraordinary, in times of war and of peace, forage, and by whatever other
    name they may be known, and to render them promptly to the usual sovereign and other treasuries, for
    which all the landholders on the Alte Hütte are liable one for all and all for one.


    § 5. Although His Most Serene Highness has the confidence that every holder will promptly satisfy
    the obligation undertaken in § 4, yet, for the security of the sovereign''s treasuries, He is graciously
    pleased hereby to undertake, in respect of the usual royal charges, to accede to the joint and several
    liability for payment of the residents on the Alte Hütte. Reserving to Himself, however, expressly,
    the damage, disadvantage and interest for any advances arising to Him from a failure to render the
    royal dues promptly.


    § 6. Deadwood and gathered wood shall hereby be permitted to the landholders on the Alte'
  names:
  - de: Alte Hütte
    en: Alte Hütte
    kind: place
  numbers:
  - '4'
- page: 6
  en: 'Hütte to fetch from the Trąbczyn forest on the lawful wood-days; every holder of a holding, however,
    is bound in the month of September of each year to take out a wood-ticket for the months of October
    until [uncertain: old Mark] and to pay to the lordship''s forest treasury 16 Groschen, say sixteen
    good Groschen; wherein he is also at liberty, for two days, to dig and take out resinous stumps from
    this forest, under the supervision and direction of the forester. It is likewise open to the residents,
    as elsewhere by permission, to rake resinous pine-needles under the direction of the forester; provided,
    however, that the protected cuttings remain entirely spared therefrom.


    § 7. So far as the forest police regulation and its husbandry permit and allow, the landholders of
    the Alte Hütte shall have the right of pasture with horned cattle and sheep in the woodland of the
    lordship of Trąbczyn.


    § 8. By the powers granted in §§ 6 and 7 to the holders so often mentioned, neither the rights and
    powers of His Most Serene Highness'

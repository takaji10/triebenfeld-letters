- page: 9
  en: '§ 14. On the seller''s side it is herein expressly consented that on the ground of this contract
    a titulus possessionis be drawn up for each individual [uncertain: parcel] of a holding.


    § 15. On the purchasers'' side it is herein expressly consented that the


    hereditary rent stipulated in § 3 be entered in the mortgage book of each individual holding.


    § 16. The settlers of the Alte Hütte are bound to take the drink they require, in beer and brandy,
    from the lordship''s brewery and distillery or tap-houses.


    § 17. As regards the school for their young, it is left to them to have themselves incorporated into
    the Hollander congregation at Trąbczyn. As regards the police constitution, they are bound to conform
    to the same.


    The stamp duties of this contract shall be paid by both'

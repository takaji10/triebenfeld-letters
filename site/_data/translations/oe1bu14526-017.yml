- page: 1
  en: 'Be it hereby known to everyone to whom it is needful to know the same, that between the Royal District
    Justice Commission clerk Kunkel, as authorised representative of His Most Serene Highness the reigning
    Prince, the Lord Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, proprietor of the lordship of
    Trąbczyn, as seller and hereditary-rent lord of the one part, and the following persons of the other,
    namely


    1. the Hollander Martin Giering of Racotten


    2. the Hollander Wilhelm Daniel Schulz of Krolikower Holländ


    3. the Hollander Gottfried Dumel of Razoten


    4. the Hollander Michael Dumel of the same place


    5. the Hollander Gottfried Damt of the same place. 6 the Hollander Christoph Schoenfisch of Trąbczyner
    Holländ.


    as purchasers and takers-up, the following contract has been advisedly agreed and concluded.


    § 1.'

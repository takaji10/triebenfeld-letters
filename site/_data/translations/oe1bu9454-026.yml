- page: 2
  en: 'to Breslau and was just taking counsel with Hahn as to what was to be done, when I received the
    express courier from Secretary Koppe out of Stettin. My joy was now greater than my distress had been
    before, and I thank God only that you live.


    In the meantime I can do nothing further in this haste than to make over to Your Serene Highness the
    instruction for the 6000 Rthl, which His Excellency the Minister von Stein, who is assuredly your
    true friend, will no doubt have paid out there at once in cash. As soon as I then have news where
    Your Serene Highness is certainly to be found, I shall bring you a further 4000 Rthl. These, however,
    are not monies out of South Prussia, but sums borrowed upon the pledged Kontop mortgage. Nor do I
    know whether we shall soon have money out of South Prussia, where the devil has got into everybody''s
    heads. I shall therefore have to approach the honest Minister von Stein once more, that he may give
    me money upon a Schweiner mortgage of 20000 Rthl. Enough: whatever I can raise I shall bring to Your
    Serene Highness.


    If the Russians come afterwards, then there is no want in Poland; there I shall take the [uncertain:
    Kantschumeiner] countrymen to my aid, and there I shall surely get money again. — To the Minister
    von Stein I had written a letter on a blank sheet — that Your Serene Highness requested him to be
    obliging to the said Triebenfeld whenever he should apply for anything on Your Highness''s behalf.'

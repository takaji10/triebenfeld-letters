  en: '26


    Most Serene Prince


    Most gracious Prince and Lord!


    That Your Most Serene Highness has escaped with his life from the most dreadful danger I learn from
    a letter of Secretary Koppe. My grief on that account was boundless, the more so as so many malicious
    rumours were spread abroad, which gave the matter an aspect a million times worse than it now really
    is. I lived in the hope that all must go happily. I was on the point of travelling to Your Serene
    Highness, and to that end had requested 8,000 Rthl of His Excellency the Minister von Stein upon a
    Konotop mortgage, because at present it is hard to obtain even 10 Rthl out of South Prussia. When
    all at once the news came in of the defeat of our army. My sole endeavour now was to learn whither
    Your Serene Highness had turned. The cavalry captain von Dorville assured me that Your Serene Highness
    had gone to Silesia. The very same was averred by the President of the General Post Office, von Seegebarth,
    with the addition that Your Serene Highness had gone with few people towards Żagań. I therefore had
    an order to pay of 6,000 Rthl drawn on Wrocław made out to me, and took 2,000 Rthl in treasury notes,
    and hastened with them to that corner, where I then saw myself wholly deceived — full of grief I went'
- page: 2
  en: 'to Wrocław and was just taking counsel with Hahn as to what was to be done, when I received the
    express courier from Secretary Koppe out of Szczecin. My joy was now greater than my grief had been
    before, and I thank God only that you live.


    Meanwhile, in this haste, I can do nothing further than to remit to Your Serene Highness the order
    to pay for the 6,000 Rthl, which His Excellency the Minister von Stein, who is assuredly your true
    friend, will surely have paid out there at once in cash. As soon as I then have news where Your Serene
    Highness is certainly to be found, I shall bring you a further 4,000 Rthl.


    These, however, are not monies out of South Prussia, but sums borrowed upon the pledged Konotop mortgage.
    Neither do I know whether we shall soon have money out of South Prussia, where the devil has got into
    all their heads. I shall therefore have to approach the most upright Minister von Stein once again,
    that he give me money upon a Świniary mortgage of 20,000 Rthl. In short, whatever I can raise I shall
    bring to Your Serene Highness.


    If the Russians come after this, then there is no want in Poland; there I shall take the whip of my
    countrymen to my aid, and there I shall indeed get money again — To the Minister von Stein I had written
    a letter on a blank sheet — that Your Serene Highness requested him to be obliging to von Triebenfeld
    whenever he should apply for anything on your most high behalf'
- page: 3
  en: 'This letter I delivered, was at once called in and asked what I wished — I handed over the petition,
    that 8,000 Rthl be lent me upon the Konotop mortgage of 10,000 Rthl. This the honest man granted at
    once, and glad at heart I meant to hasten with this little sum to Your Serene Highness when the sad
    tidings came in. I had had an order to pay drawn only on Leipzig for Your Serene Highness; this until
    I then re-write it and give the order to pay on myself to the Wrocław bank — Now I send this order
    to pay by express courier to Mr Koppe, so that he may quickly receive these monies and convey them
    to Your Serene Highness. As soon as I now learn whither Your Most High Self turns, I shall, as said
    before, bring more. Just now I receive news out of the Cabinet from a certain person, that Your Serene
    Highness''s conduct and valour is praised above all things; how great a part I take in this I need
    not depict to Your Serene Highness at length. At the same time I have thereby gained great hope that
    they will give Your Serene Highness the Kolzig estates. If this succeeds for me, then I shall soon
    procure 100,000 Rthl, which you may apply anywhere you please; then we should have no need to seek
    foreign credit.


    God grant Your Serene Highness further victory and keep Your Most High Self in health and well-being,
    and so I remain, until death,


    Your Serene Highness''s


    Wrocław, the 28th of October


    1806.


    faithful, most humble and obedient servant


    v Triebenfeld'

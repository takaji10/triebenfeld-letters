- page: 3
  en: 'This letter I delivered, was at once called in and asked what I desired – I presented the petition
    that 8000 thereof be lent me upon the Kontop mortgage of 10000 Rthl. This the honest man granted immediately,
    and glad at heart I was minded to hasten with this little sum to Your Serene Highness, when the sad
    tidings came in. I had had an instruction made out only upon Leipzig for Your Serene Highness; this
    until I rewrite it and give the instruction upon myself to the Breslau bank. — Now I send this instruction
    by express courier to Koppe thereof, so that he may quickly receive these monies and convey them to
    Your Serene Highness. As soon as I now learn whither Your Highness is turning, I shall bring more,
    as said before. Just now I receive news from the Cabinet, from someone, that Your Serene Highness''s
    conduct and valour are praised above everything; how great a share I take in this I need not describe
    to Your Serene Highness at any length. At the same time I have thence gained great hope that they
    will give Your Serene Highness the Kolzig estates. If this succeeds for me, then I shall soon procure
    100000 Rthl which you may apply entirely as you please; then we should have no need to seek any foreign
    credit.


    May God grant Your Serene Highness further victory and preserve Your Highness in health and well-being,
    wherewith I remain, until death,


    Your Serene Highness''s


    Breslau, the 28th of October


    faithful and most humble and obedient servant


    1806.


    von Triebenfeld'

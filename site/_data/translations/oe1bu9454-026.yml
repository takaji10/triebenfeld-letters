- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    That Your Most Serene Highness''s life has escaped the most dreadful danger I learn from a letter
    of Secretary Koppe. My distress on that account was boundless, the more so as so many malicious rumours
    were spread abroad, which gave the matter an aspect a million times worse than it in fact now is.
    I lived in the hope that all must go happily. I was on the point of travelling to Your Serene Highness,
    and to that end had requested 8000 Rthl from His Excellency the Minister von Stein upon a Kontop mortgage,
    because at present it is hard to obtain even 10 Rthl out of South Prussia. When all at once the news
    of the defeat of our army [uncertain: einigung]. My sole endeavour now was to learn whither Your Serene
    Highness had turned. The cavalry captain von Dorville assured me that Your Serene Highness had gone
    to Silesia. The very same was affirmed by the President of the General Post Office von Secqebarth,
    with the addition that Your Serene Highness had gone off toward Sagan with few people. I therefore
    had an instruction for 6000 Rthl made out on Breslau and took 2000 Rthl in treasury notes, and hastened
    with them to that corner where I then found myself wholly deceived – full of distress I went'

  en: '25 Aug. 1796 With Your Excellency''s most honoured letter of the 9th hujus I have received the
    donation charters


    1. For the Prince of Hohenlohe-Ingelfingen,


    2. for the Colonel and Commander von Sanitz,


    3. for Major General von Blücher


    4. for Lieutenant General von Dolffs


    5. for Major von Pontanus


    6. for Lieutenant von Holtzendorff


    7. for Major General von Larisch, concerning the estates bestowed upon them in South Prussia, together
    with the cabinet order relating thereto and the covering report to His Majesty, and, having countersigned
    both the fair copies and the drafts, I may be permitted by Your Excellency to remit both, the Munda
    and the drafts, in the enclosures, with the most humble request that you will be pleased to forward
    the latter onward. Wrocław, 20 August 1796.


    Hoym


    To His Excellency the Royal Actual Privy Minister of State and Justice and also Grand Chancellor,
    Mr von Goldbeck'

- page: 22
  en: 'Since Your Royal Majesty has been most graciously pleased, by the Most High cabinet order of the
    23rd of last month, to approve the most humble proposals made by me, the Minister of State Count von
    Hoym, concerning the bestowal upon deserving generals and other officers of the estates in South Prussia
    which have fallen in and been opened to Your Most High disposal, partly confiscated, partly granted
    by royal favour: therefore the South Prussian Provincial Department and the Department of Fiefs herewith
    present for Your Royal Majesty''s most gracious execution the donation charters


    1, for the Prince of Hohenlohe-Ingelfingen;


    2, for the Colonel and Commander von Sanitz serving with the regiment Prince of Hohenlohe;


    3, for Major General von Blücher,


    4, for Lieutenant General von Dolffs;


    5, for Major von Pontanus;


    6, for Lieutenant von Holtzendorff; and


    7, for Major General von Larisch; with the most humble request that the executed charters may graciously
    be remitted to the Department of Fiefs. Hoym


    Goldbeck Berlin the 9th and Wrocław the 20th of August 1796. following each[?]. 26 Aug. 1796


    Goldbeck


    To His Royal Majesty.'

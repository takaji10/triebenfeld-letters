- page: 3
  en: 'and I most humbly propose, since that von Prusimski also left behind in the district of Wegrowiecz
    the villages of Pawlow, Dzwonow and Beerenbusch, which after deduction of the debts may bring in yearly
    about 1,000 Rthl (20,000 Rthl. at 1 per cent 200 Rthl):


    to grant these Pawlow estates to the Colonel von Sanitz.


    a, Further, by death the estates granted by royal favour of Duninow, lying in the district of Kowall,
    have become vacant, which yield about 1,500 Rthl of annual return: (30,000 Rthl. at 1 per cent 300
    Rthl.) These I most humbly submit to be conferred upon Major General von Blücher.


    b, In the same manner an estate granted by royal favour, Strzelec, between Gostinin and Kutno, has
    become vacant, which yields approximately 1,000 rtlr:


    (20,000 Rthl. at 1 per cent 200 Rthl.) This I most humbly beg may be made over to Lieutenant General
    von Dolffs.


    c, the estates granted by royal favour of Dziejorzew, Borchkowe and Jacubie, become vacant by the
    death of the lady von Biernacka, all in the district of Sieradz and of approximately 600 Rthl. annual
    return (12,000 Rthl. at 1 per cent 120 Rthl.), may Your etc.


    be pleased to grant to Major von Pontanus.


    f, the artillery lieutenant von Holtzendorff would find himself very well rewarded by the estates
    Gluskow, Malavies and Grocholle, which bring in approximately 400 Rthl. (8,000 Rthl. at 1 per cent
    80 Rthl.), since they lie very conveniently for him here in the district of Blonie, and I likewise
    most humbly propose: to make a gift of these estates granted by royal favour to von Holtzendorff.


    They have become vacant through the Polish Colonel von Rakalowicz, who fell in the action at Warsaw.


    g. The estate granted by royal favour Lekarziewice, situated in this neighbourhood, has also fallen
    vacant by the death of a certain von Kiełczewski; it yields about 600 Rthl (12,000 Rthl. at 1 per
    cent 120 Rthl.), and I most humbly submit: to confer this estate Lekarziewice upon Major General von
    Larisch. In due course yet more confiscated estates and estates granted by royal favour will be qualified
    for Your Most High disposal, and I have herewith indicated most humbly only the above most pressing
    claimants for Your etc. gracious approbation, in that I dutifully submit myself to Your Most High
    further orders. signed Count von Hoym'

- page: 2
  en: 'and designated merely by the expression: the Duninow estates granted by royal favour, of 1,500
    Rthl. in yield. But if the donation charter is framed in general terms, then upon the future delivery
    of possession all those estates may be reckoned to it which the former holder by royal favour or private
    proprietor possessed in this or that district, and which by that measure are to be transferred by
    His Majesty to the present recipients. Since each of them would wish soon to have the donation instrument
    put into his hands and the estates delivered over, I may all the more humbly request Your Excellency
    to have the issue of the charters expedited as far as possible. Wrocław, the 30th of July 1796. Hoym


    To His Excellency the Royal Actual Privy Minister of State and Justice, Baron von der Reck, at Berlin.


    Copy.


    Warsaw, the 14th of July 1796. To


    His Majesty the King


    concerning the estates to be distributed among well-deserving officers. Pursuant to Your Majesty''s
    order received of the 9th of this month, I propose for the Prince of Hohenlohe-Ingelfingen


    a) most humbly the following estates confiscated from the chief insurgent Anton von Prusimski:


    1. in the district of Poznań, the town of Kamionna and the market town of Kolno


    2.) in the district of Konin, the villages of Trąbczyn


    Szetlewek


    Nowawies


    Lazy


    Old and New Laske


    Oszyny


    Hauland Trąbczyński


    3. in Kuyavia the village of Brzyce


    together with appurtenances (120,000 at 1 per cent — 1,200 Rthl.) These estates may yield from 4 to
    6,000 [p?] yearly, and I should have made the most humble proposals sooner had the confiscation proceedings
    not only now been concluded by the lawful judgments of the Governments. Your Majesty is therefore
    most submissively asked:


    most graciously to confer the estates named under Nos. 1, 2 and 3 upon the Prince of Hohenlohe-Ingelfingen.
    Besides these there are yet more estates, partly confiscated, partly fallen in by death, at Your disposal.


    His Most High Majesty has


    b.) been pleased likewise to assure a reward to the Colonel von Sanitz, commander serving with the
    Prince of Hohenlohe''s regiment'

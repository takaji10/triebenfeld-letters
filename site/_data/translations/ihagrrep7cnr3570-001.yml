  en: 'in property.


    This We also do herewith and by virtue of these presents, out of Royal power and plenitude, for Ourselves
    and Our descendants and successors in the Crown, the Electorate and Our remaining lands, in such wise
    and manner that Our aforesaid kindly beloved uncle, the Prince of Hohenlohe-Ingelfingen, shall from
    now on for eternal times have, possess and enjoy the above-named estates, with all rights and privileges
    attaching thereto, as such have hitherto been exercised or may lawfully be exercised, no less than
    with all their appurtenances and other belongings, by whatever name they may be called, just as the
    same have hitherto been used or may of right be used, as a well-acquired and unencumbered property
    — yet subject to the reservation of the sovereign taxes and other public dues to be laid upon them
    like other estates of Our South Prussian [uncertain: territories] — for himself and his descendants
    and heirs, irrevocably from Us and Our successors, and the power shall likewise be vested in him to
    dispose thereof at his pleasure, unhindered by any man. We therefore command and enjoin all Our South
    Prussian Governments and Chambers of War and Domains, as also all other authorities whom it concerns,
    herewith as graciously as earnestly, that they shall in no way hinder or impede either the [uncertain:
    aforementioned] Lord Prince of Hohenlohe-Ingelfingen in the heritable and proprietary possession,
    granted to him, of the above-named holdings and estates together with their appurtenances and belongings,
    nor him or those upon whom, by virtue and in force of this Our letter of donation, he may bequeath
    the same therein or otherwise lawfully convey it by other acts inter vivos or mortis causa, but shall
    rather let him, and eventually also them, enjoy the same freely and peaceably, doing nothing themselves
    against it, nor occasioning or permitting that such be done by others, upon pain of Our Most High
    disfavour and unfailing severe punishment. In witness whereof We have caused this present letter of
    donation to be signed with Our own Most High hand and Our Royal great seal to be appended thereto.
    Thus done at Berlin, 9 August 1796.


    Ad contrasignandum


    Goldbeck


    Hoym


    Me[?]od[k?] For the obliging counter-signature and counter-signing of His Excellency the Royal etc.
    Minister Count von Hoym, in the draft and fair copy (Mundo).'

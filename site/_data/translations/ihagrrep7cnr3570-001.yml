- page: 4
  en: 'Copy My dear Minister of State Count von Hoym! Your proposals concerning various estates in South
    Prussia confiscated or fallen vacant by the decease of the previous possessors, and to be bestowed
    according to my successive orders upon well-deserving officers, I approve in such manner that


    1.) to the Prince of Hohenlohe-Ingelfingen, the town of Kamionna and the market town of Kolno (district
    of Poznań), the villages of Trąbczyn, Szetlewek, Nowawies, Lazy, Old and New Laske, Oszny, Hauland
    Trąbczyński (district of Konin) and the village of Brzyce together with appurtenances, all of which
    were confiscated from the chief insurgent Anton von Prusimski,


    2.) to the commandant serving with the Prince of Hohenlohe''s regiment, Colonel von Sanitz, the villages
    of Pawlow, Dzwonow and Beerenbusch, in the district of Wengrowiecz, which the same Prusimski left
    behind.


    3.) to Major General von Blücher, however, the estates granted by royal favour of Duninow lying in
    the district of Kowal, and


    4.) to Lieutenant General von Dolffs, the estate granted by royal favour Strzelec between Gostinin
    and Kuttnow, as also


    5. to Major von Pontanus the estates Dziejorzew, Borschkowe and Jacubie, of the district of Sieradz


    5.) to the artillery lieutenant von Holtzendorff, the estates Gluskow, Malavies and Grocholle


    7) and finally to Major General Larisch the estate granted by royal favour Lekarziewice, situated
    in the neighbourhood of Warsaw, shall be conferred and given as a reward of their faithful services,
    heritably and in property. You will notify all the above-named officers of this my gracious resolution,
    and also attend to whatever further is requisite herein, as I for the rest remain Your well-affectioned
    King.


    Friedrich Wilhelm


    Pyrmont, the 23rd of July 1796.


    To the Minister of State Count von Hoym'

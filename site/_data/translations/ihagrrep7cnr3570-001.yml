  en: 'Berlin, 9 August 1796.


    Donation charter for the Prince of Hohenlohe-Ingelfingen, for the heritable and proprietary possession
    of the town of Kamionna, and of the market town of Kolno, in the district of Poznań; of the villages
    of Trąbczyn, Szetlewek, Nowawies, Lazy, Old and New Laske, Oszny, Hauland Trąbczyński, in the district
    of Konin; and of the village of Brzyce, together with appurtenances, in Kuyavia.


    the 24th of Nov., delivered out.


    W.


    Lieutenant General of Infantry, Chief of a Regiment of Foot, Governor of the capital city of Wrocław
    We Friedrich Wilhelm by the Grace of God King of Prussia (tot. tit.) do declare and make known by
    means of this Our open letter, for Ourselves and Our successors in the Crown, the Electorate and Our
    remaining lands, and hereby graciously give to know to each and every one whom it concerns: that,
    as We are, out of inborn favour and clemency, much inclined to acknowledge and requite the good and
    profitable services rendered to Us and to Our Royal House by particular marks of Our Royal good will,
    We have considered the important, distinguished and useful services rendered for many years past to
    Us and to Our Royal House in Our Royal Heimath by the High-Born Prince, Our kindly beloved uncle,
    Friedrich Ludewig, reigning Prince of Hohenlohe-Ingelfingen, Our (Inseratur der Charakter des Fürsten
    im Königl. Dienst), Knight of Our Orders etc., and have resolved, in order to give to the said Lord
    Prince a mark of the recognition of his excellent merits and of Our Royal gratitude, to bestow and
    convey upon him, heritably and in property, the following estates which have fallen in to Our Most
    High disposal, namely: the town of Kamionna, and the market town of Kolno, in the district of Poznań;
    the villages of Trąbczyn, Szetlewek, Nowawies, Lazy, Old and New Laske, Oszny, Hauland Trąbczyński,
    in the district of Konin; and the village of Brzyce, together with appurtenances, in Kuyavia; with
    all their belongings, by whatever name they may be called, heritably and'

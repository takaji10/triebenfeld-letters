- page: 6
  en: 'Berlin, 9 August 1796.


    To His Royal Majesty. Since Your Royal Majesty has been most graciously pleased, by the Most High
    cabinet order of the 23rd of last month, to approve the most humble proposals made by me, the Minister
    of State Count von Hoym, concerning the bestowal upon deserving generals and other officers of the
    estates in South Prussia which have fallen in and been opened to Your Most High disposal, partly confiscated,
    partly granted by royal favour: therefore the South Prussian Provincial Department and the Department
    of Fiefs herewith present for Your Royal Majesty''s most gracious execution the donation charters.


    1.) for the Prince of Hohenlohe-Ingelfingen,


    2.) for the Colonel and Commander von Sanitz serving with the regiment Prince of Hohenlohe;


    3.) for Major General von Blucher;


    4.) for Lieutenant General von Dolffs;


    5.) for Major von Pontanus;


    6.) for Lieutenant von Holtzendorff;


    7.) for Major General von Larisch; with the most humble request that the executed charters may graciously
    be remitted to the Department of Fiefs. Berlin, 9 August 1796.


    and Wrocław, the 20th of Aug.


    Goldbeck


    Hoym for the obliging counter-signature of His Excellency the Royal etc. Minister Count von Hoym,
    in the draft and fair copy. Despatched the 25th.'

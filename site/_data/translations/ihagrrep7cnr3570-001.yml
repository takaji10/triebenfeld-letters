  en: '6 Aug. 1796. Let the necessary be despatched in the manner proposed. The 8th of Aug. 1796.


    etc. conclusum eodem.


    Mellentz[?] Upon various orders received from His Majesty, to bring forward proposals of vacant estates
    granted by royal favour (Gratial-Güter) and of confiscated insurgents'' estates for the benefit of
    sold-off full officers, I have rendered the enclosed report of the 14th of this month, and His Most
    High Majesty has been pleased to approve all the proposals in accordance with the cabinet order of
    the 23rd of this month, which is here enclosed with the most humble request for its return.


    Since the content of the donation charters hitherto drafted may be entirely identical with those which
    are now to be despatched, inasmuch as only the names of the persons favoured, and the estates assigned
    to them, make the essential difference, I have not first drawn up particular drafts for the donation
    letters in question, but leave it most humbly to Your Excellency whether you will be pleased to have
    them despatched in the Fiefs Chancery, and to send them to me by way of a joint report for my counter-signature
    and further conveyance to His Majesty. I note besides that with the estates the addition: cum appertinentia,
    or appurtenances, will always have to be inserted, because, in the absence of any system of mortgage
    registration in Suprensten, it is too difficult to obtain speedy and thorough information of the relations
    of the estates belonging together, and otherwise the beneficiaries would easily suffer a disadvantage
    contrary to His Majesty''s intention, if in future, through strict specifications in the donation
    charters, appurtenances which belong to the principal estates were to remain not delivered over to
    them.


    Thus, for example, there are reckoned to the Duninow estates the villages of Duninow, Tolenczna, Szadow,
    Nowawies, and Krzement'

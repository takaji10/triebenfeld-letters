- page: 5
  en: 'Berlin, 9 August 1796.


    To His Excellency the Royal etc. Minister, Count von Hoym, at Wrocław.


    resineatur[?] Copy.


    In conformity with the cabinet order communicated to me by Your Excellency through your honoured letter
    of the 30th of last month, and herewith returned in the original, concerning the bestowal of the confiscated
    estates and estates granted by royal favour standing at His Royal Majesty''s disposal in South Prussia,
    and with the desire thereupon signified to me, I have made no hesitation in causing the donation charters
    to be made out


    1.) for the Prince of Hohenlohe-Ingelfingen;


    2.) for the Colonel and Commander von Sanitz;


    3.) for Major General von Blücher;


    4.) for Lieutenant General von Dolffs;


    5.) for Major von Pontanus;


    6.) for Lieutenant von Holtzendorff; and


    7.) for Major General von Larisch, and I give myself the honour of transmitting the same herewith
    to Your Excellency, in an official manner, together with the covering report to His Royal Majesty,
    for your obliging counter-signature and counter-signing, in the drafts and fair copies.


    Berlin, 9 August 1796.


    Hoym


    [uncertain: Glodk]


    the 13th, with enclosures, to the post'

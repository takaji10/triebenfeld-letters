- page: 6
  en: 'be constituted; this is to be balanced against the net yield of Krotoszyn, reckoned to capital
    at 5 per cent, and whatever Krotoszyn is worth more than my estates I will pay in cash to the Maritime
    Trading Company, whereby then the yearly amortisation amount is proportionately reduced, which Krotoszyn
    and Polajewo have hitherto discharged at 50/m r. yearly, and which in future Polajewo and my estates
    will discharge.


    The advantages which I gain thereby are:


    1. those already adduced in my submission of the —


    2. that I obtain a rounding-out of my estates, which hitherto lie scattered in South Prussia


    3. that Krotoszyn lies only 8 miles distant from Wrocław, and can be managed in the neighbourhood
    of my domicile. The advantages which Your Royal Majesty gains are:


    1. it can be a matter of indifference to Your Royal Majesty whether my estates lie scattered, since
    they do after all border one upon the other domains.


    2. Pszczew contains building timber, firewood and meadow growth; this is wanting to the intendancy
    of [uncertain: Buck] and Międzyrzecz,


    3. Polajewo is relieved by 8000 Rthl.


    4. The amortisation amount is reduced. Since I am firmly convinced that Your Royal Majesty, as well
    as I, gains by this exchange, and since my point of honour suffers when the matter is represented
    otherwise by Mr von Voss, I must most humbly beg:


    that Your Royal Majesty may be pleased to direct the Poznań Chamber by cabinet order to have the investigation
    carried out by 2'

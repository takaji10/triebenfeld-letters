status: draft
segments:
- page: 1
  en: 'Copy. Most Serene of All. The Prince of Hohenlohe''s further most humble representation concerning
    the exchange of his estates situated in South Prussia for the lordships of Krotoszyn and Polajewo.
    By a letter addressed to me by the Privy Minister of State von Voss, of the 1st of December, I learn
    that the same has not found the exchange of my estates in South Prussia for Krotoszyn and Polajewo,
    which I most humbly offered to Your Majesty on the [text lost, day left blank], suited to Your Royal
    Majesty''s interest. The grounds adduced on this head are: 1.) that in the case of this office [Amt]
    the proceedings have not been according to true economic principles, because a) the tenant has been
    conceded unusual and unbecoming great advantages by means of a so-called Reservation Fund, whose annual
    fund amounts to 9540 Rthl; b) that an entire demesne farm, which yields 1500 Rthl of rent, has not
    come into the valuation and has been entirely passed over; c) that the very profitable mast-feeding
    in the forests has been left to the Councillor of War Triebenfeld as indemnification for the small
    sum of 3327 Rthl in super-inventory monies paid to his predecessor on his entering upon the lease.
    II) that by an altered arrangement in the forests, which hitherto have yielded no return at all, a
    considerable income can already now be had; hence, on adding these items to the hitherto rent-quantum
    of 30100 Rthl, which I wished to take as the basis of the exchange, the same would have to be raised
    as high as 60,000 Rthl. III) that these offices, being domains, afford me just as little security
    as the estates already received from His Majesty. To refute the above grounds the Count von Höym would
    indeed be better able than I, since these estates have hitherto stood under his supervision; inasmuch
    as thereby a disadvantageous light is cast upon the former administration, yet through my acquaintance
    with the locality and with the tenants of that time I shall be in a position to refute these assertions
    thoroughly, and to lay before Your Royal Majesty in the following, most humbly, a plan yet more advantageous
    for Your Most High interest, more in order to remove from myself the appearance'
- page: 2
  en: 'from myself, as though I had wished to enrich myself at the cost of Your Majesty''s treasury, than
    for the sake of my own advantage. On I, concerning the exaggerated advantages of the present Krotoszyn
    office-lease: on a) the Privy Minister of State von Voss appears [uncertain: still] too new to and
    unacquainted with the constitution of the office, when he has quite incorrectly asserted that the
    fund of 9543 Rthl of the Reservation Fund could accrue to the rent-quantum, and appears unwilling
    to distinguish between gross and net yield. Of this, the gross yield does indeed consist of 39643
    Rthl, but the necessary outlays are not deducted at all, and there always remains to the Royal treasury
    only the surplus of 30100 Rthl. Now if I have taken the latter sum as the basis of the exchange, it
    goes without saying that I have undertaken to bear those outlays. These outlays consist of 24 per
    cent land contribution 2722 rl.; salaries for the office''s judicial officials 1234; for remissions
    to the subjects, reckoning one year with another, 2000 = 5956. There thus remains over 3587. This
    remaining quantum is far from sufficient to maintain the buildings of the office annually, and to
    this item there would have to be added all those advantages which forest and mast-feeding may perhaps
    afford. On b.) It is just as incorrectly asserted that hitherto an entire demesne farm has been left
    out of the valuation. The matter stands quite otherwise. This is no demesne'
- page: 3
  en: 'farm, but 1 Hollander Hufe, which the said von Triebenfeld acquired still in Polish times from
    the possessors of two Hollander holdings. It is true that he made and laid out a demesne farm from
    it and ceded the same to the present tenant; nevertheless it cannot be regarded as an appurtenance
    of the domain. Even granting that the said von Triebenfeld had acquired it illegitimate modo, the
    former possessors, and not the Fiscus, would be able to vindicate it. On c.) the Privy Minister of
    State von Voss cannot have seen the Krotoszyn forests at all. It is notorious that they have already
    been devastated by the ex-Minister von Goerne, who kept stave-cutters in them for a year and a day,
    and 600 persons at that; and though the extent is indeed large enough, yet a saeculum must first pass
    before it becomes useful again, if one will consider that all subjects receive free building and fire
    wood, whence it comes that neither forest nor mast-feeding usufruct has hitherto been of importance.
    If therefore the Privy Minister of State von Voss asserts that Krotoszyn must in future yield a rent
    of 60,000 Rthl, I most humbly and most urgently beg Your Royal Majesty to hold him to his word at
    the end of the lease in 1800, should nothing come of my offer; and I shall not fail then to remind
    Herr von Voss thereof. The meliorations to be [uncertain: effected] do not, however, belong here,
    inasmuch as a large capital of outlay is required for them. On 3, Herr Voss betrays no knowledge of
    the matter whatever, inasmuch as the offices of Krotoszyn and Polajewo are no domains at all, but
    at most may after 36 years come to be such, which I likewise do not doubt. These estates are originally
    of noble quality; they were by Minister'
- page: 4
  en: 'Goerne accumulated qua tales, and thereafter sequestrated for the account of the Maritime Trading
    Society, to which the said von Goerne owed nearly 1 million thaler. When South Prussia was occupied,
    the [uncertain: Trading] Society was glad to cover that capital together with interest, and endeavoured
    to bring it about that the estates should be handed over to the Posen Chamber in administration on
    condition that an amortisation quantum of 50000 rl. should be discharged annually. At that time this
    plan was quite contrary to Herr von [illegible], on which account I cannot now explain his contradiction
    either, since the matter stands today just as it did then. After Herr von Voss had lost the department,
    the plan of the Maritime Trading Society was confirmed by a Cabinet Order of the 4th of March 1795,
    but it was at the same time laid down therein that only after 36 years, when that burden of debt should
    have been discharged, these estates should take on the character of domains. Until then they are to
    be regarded as private estates, which is already sufficiently proved by the fact that they bear the
    burdens of noble estates, such as the 24 per cent dues. Having sufficiently refuted the assertions
    of Herr von Voss, I cannot forbear to add the following, which Herr von Voss has probably deliberately
    kept silent about: 1, Krotoszyn has lost the propination rights in the town of Krotoszyn, whereby
    the income is diminished by 4000 Rthl according to the valuation; 2, the [uncertain: most correct]
    part of the forest is in a boundary dispute with the Dominium Kozmin; 3, the Jews have brought it
    about by judgment and law that'
- page: 5
  en: 'they have been reduced to lower dues. 4, Polajewo is leased at 6000 Rthl higher than it was valued,
    on which account sequestration has already three times been set in train there, and the tenant Count
    von Plotho has thereby been ruined, who, as I will prove, has already sunk 20,000 Rthl in it; 5, Polajewo
    is so totally ruined that the costs of re-establishment have been set at 300,000 Rthl, to which is
    added that the forest is stripped of all building timber; and 6.) I pledge my honour that Polajewo
    must come down to a net yield of 12000 Rthl net if the re-establishment is to be effected out of the
    revenues. I appeal to the opinion of the Posen Chamber that this is the true state of the matter.
    Now may Your Royal Majesty most graciously permit my further proposal to be laid most humbly before
    you. 1) I renounce the possession of Polajewo. But because the [uncertain: office] is not in a condition
    to furnish the present yield any longer, I will undertake to pay 8000 Rthl annually towards it, and
    will suffer the same to be transferred to Krotoszyn, whose net yield would thus be, instead of 30000,
    38000, whereby I furnish more than if, according to my first offer, I were to take over Polajewo as
    well. 2.) I take upon myself, as goes without saying, all the onera publica burdening Krotoszyn, buildings,
    remissions etc., which have hitherto been paid out of the Reservation Fund. 3) My estates must be
    valued, or my leasehold contracts taken as the basis of the exchange, and from these the net yield'
- page: 6
  en: 'be constituted; this is to be balanced against the net yield of Krotoszyn, reckoned to capital
    at 5 per cent, and whatever Krotoszyn is worth beyond my estates I shall pay in cash to the Maritime
    Trading Society, whereby then the annual amortisation quantum is proportionately diminished, which
    hitherto Krotoszyn and Polajewo have discharged at 50000 Rthl annually, and which in future Polajewo
    and my estates will discharge. The advantages which I thereby gain are: 1) those already adduced in
    my representation of the [text lost]; 2, that I obtain a consolidated block of my estates, which hitherto
    lie scattered in South Prussia; 3) that Krotoszyn lies only 8 miles from Breslau and can be managed
    near my domicile. The advantages which Your Royal Majesty gains are: 1) [uncertain: that] it must
    be indifferent to Your Royal Majesty whether my estates lie scattered, since they nevertheless border
    one with other domains; 2.) Gitschen contains building timber, firewood and meadow-growth; this is
    wanting to the intendancy of Buck and Meseritz; 3. Polajewo is relieved by 8000 Rthl; 4, the amortisation
    quantum is diminished. Since I am firmly convinced that Your Royal Majesty gains by this exchange
    as well as I, and since my point d''honneur suffers under it if the matter is represented otherwise
    by Herr von Voss, I must most humbly beg that Your Royal Majesty be pleased to enjoin the Posen Chamber
    by Cabinet Order to have the investigation carried out by 2'
- page: 7
  en: 'members of the Chamber who are acquainted with the [uncertain: matter], their vote to circulate
    among the remaining Membris Collegii, to which each shall then add his own vote, from which the correctness
    of my statement will certainly appear; at the same time I beg also that a report be required of the
    Count von Höym, and I remain, until death, in deepest fidelity, as Your Royal Majesty''s.'

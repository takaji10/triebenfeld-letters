- page: 1
  en: '101


    Copy


    Most Serene: The Prince of Hohenlohe''s further most humble submission concerning the exchange of
    his estates situated in South Prussia for the lordships of Krotoszyn and Polajewo. From a letter addressed
    to me by the Privy Minister of State von Voss, dated the 1st of December, I learn that he has not
    found the exchange of my estates in South Prussia for Krotoszyn and Polajewo, which I most humbly
    offered to Your Majesty on the xxxxx th of xxxxx, consonant with Your Royal Majesty''s interest. The
    grounds adduced in this regard are:


    I) that in the case of this district office the true principles of husbandry have not been followed,
    because


    a) the lessee has been granted unusual and unwarranted great advantages, by way of a so-called Reservations
    Fund, whose annual capital amounts to 9540 Rthl.


    b) that an entire demesne farm, which yields 1500 Rthl. of rent, was not brought into the valuation
    and was passed over altogether.


    c) that the very profitable mast in the woodlands has been made over to the councillor of war Triebenfeld
    by way of indemnification for the small sum of 3327 Rthl. in super-inventory monies paid to his predecessor
    upon his entering into the lease.


    II) that by an altered arrangement in the forests, which hitherto have yielded no return whatever,
    a considerable income could now already be obtained; and therefore, by adding these items to the existing
    lease sum of 30100 Rthl., which I wished to take as the basis of the exchange, that sum would have
    to be raised as high as 60,000 Rthl.


    III) that these district offices, being domains, afford me just as little security as the estates
    already received from His Majesty.


    To refute the above grounds the Count von Hoym would indeed be better able than I, since these estates
    have hitherto stood under his supervision, inasmuch as an unfavourable light is thereby cast upon
    the previous administration; yet through my acquaintance with the locality and with the lessees of
    that time I shall be in a position to refute these assertions thoroughly, and in what follows to lay
    most humbly at Your Royal Majesty''s feet a plan still more advantageous to Your Highest interest,
    more in order to remove the appearance'

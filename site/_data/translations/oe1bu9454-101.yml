- page: 5
  en: 'they have been reduced to lower dues.


    4. Polajewo is leased at 6000 Rthl. higher than it was valued, on which account sequestration has
    already been set in motion there three times, and the lessee, Count von Flotow, has thereby been ruined,
    who, as I am prepared to prove, has already sunk 20,000 Rthl. in it.


    5. Polajewo is so totally ruined that the costs of restoration have been put at


    300,000 Rthl.; to which [uncertain: there is added] that the forest is stripped of all building timber;
    and


    6. I pledge my honour that Polajewo must come down to a net yield of 12000 Rthl. net if the restoration
    is to be effected out of the revenues.


    I appeal to the opinion of the Poznań Chamber that this is the true state of the matter. Now may it
    please Your Royal Majesty most graciously to have my further proposal most humbly laid before you.


    1. I renounce the possession of Polajewo. But because the [uncertain: district office] is not in a
    position to afford the present yield any longer, I am willing to undertake to pay 8000 Rthl. yearly
    on that account, and to be content that the same be transferred onto Krotoszyn, of which therefore
    the net yield would be 38000 instead of 30/m, whereby I afford more than if I were, on my first offer,
    to take over Polajewo as well.


    2. I undertake, as goes without saying, all the public burdens (onera publica), buildings, remissions
    etc. charged upon Krotoszyn, which have hitherto been paid out of the Reservations Fund.


    3. My estates must be valued, or my lease contracts taken as the basis of the exchange, and from these
    the net yield'

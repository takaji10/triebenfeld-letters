- page: 4
  en: 'Goerne qua tales, and thereupon sequestrated for the account of the Maritime Trading Company, to
    which von Goerne owed [uncertain: nearly] 1 million thaler.


    When South Prussia was occupied, the Maritime Trading Company was eager to cover that capital together
    with the interest, and exerted itself to bring about that the estates should be handed over to the
    Poznań Chamber in administration on the condition that an amortisation amount of 50/m Rthl. should
    be discharged yearly.


    At that time this plan was entirely repugnant to Mr von Voss, and for that reason I cannot now explain
    his contradiction to myself either, since the matter stands this very day just as it stood then.


    After Mr von Voss had lost the department, the plan of the Maritime Trading Company was confirmed
    by a cabinet order of the 4th of March 1795, but it was at the same time laid down therein that only
    after 36 years, when that burden of debt had been discharged, should these estates assume the character
    of domains. Until then they are to be regarded as private estates, which is sufficiently proved already
    by the fact that they bear the burdens of noble estates, such as the 24 per cent dues.


    Having sufficiently refuted the assertions of Mr von Voss, I cannot forbear adding the following,
    which


    Mr von Voss has probably passed over in silence deliberately:


    1. Krotoszyn has lost the propination rights in the town of Krotoszyn, whereby the revenue is reduced
    by 4000 Rthl. according to the valuation.


    2. The most important part of the forest is in a boundary dispute with the manorial lordship of Kozmin.


    3. The Jews have brought it about by judgment and law that'

- page: 3
  en: 'farm, but 1 Hollander Hufe, which von Triebenfeld acquired from the possessors of two Hollanders
    as far back as Polish times. A demesne farm has indeed been laid out by him upon it, and the same
    ceded to the present lessee; nonetheless it cannot be regarded as an appurtenance of the manorial
    lordship (Dominium). And even supposing that von Triebenfeld had acquired it illegitimate modo, it
    would be the former possessors, and not the Treasury, who could vindicate it. On c) the Privy Minister
    of State von Voss can never have seen the Krotoszyn woodlands.


    It is notorious that they have already been devastated by the ex-minister von Goerne, who for a year
    and a day had stave-cutters, six hundred persons of them, at work therein; and although the terrain
    is indeed large enough, yet a whole century must first pass before it becomes serviceable again, if
    one will but consider that all the subjects receive free timber for building and firewood, whence
    it comes that neither forest nor mast usage has hitherto been of any importance.


    If therefore the Privy Minister of State von Voss asserts that Krotoszyn must in future yield 60,000
    Rthl., then I most humbly and most urgently beg Your Royal Majesty to hold him to his word at the
    end of the lease in 1800, should nothing come of my offer; and I shall not fail then to remind Mr
    von Voss of it. The meliorations to be looked for, however, are not to the point here, inasmuch as
    a large capital outlay is required for them.


    On 3, the [uncertain: Kan.] Voss betrays no knowledge whatever of the matter, inasmuch as the district
    offices of Krotoszyn and Polajewo are no domains at all, but at best may after 36 years develop into
    such, which likewise I do not doubt.


    These estates are originally of noble quality; they were bought by Minister'

status: draft
segments:
- page: 1
  en: 'Copy


    Most Serene Sovereign. The Prince of Hohenlohe''s further most humble representation concerning the
    exchange of his estates situated in South Prussia for the lordships of Krotoszyn and Polajewo. From
    a letter issued to me by the Privy Minister of State von Voss of the 1st of December, I learn


    that he has not found the exchange of my estates in South Prussia for Krotoszyn and Polajewo, offered
    by me most humbly to Your Majesty under the [text lost] th, suited to Your Royal Majesty''s interest.


    The reasons adduced in this regard are:


    1.) that in the case of this office [administrative district] there has been no proceeding according
    to true [uncertain: economic] principles, because


    a) the tenant has been conceded unusual and undue great advantages, by way of a so-called Reserve
    Fund, whose annual fund amounts to 9540 Rthl.


    b) that a whole demesne farm, which yields 1500 Rthl in rent, was not brought into the valuation and
    was entirely passed over.


    c) that the very lucrative mast [pannage] in the woodlands has been made over to the councillor of
    war Triebenfeld as indemnification for the small sum of 3327 Rthl in super-inventory moneys paid to
    his predecessor at the commencement of the lease.


    II) that by an altered arrangement in the forests, which hitherto have yielded no return whatever,
    a considerable income can now already be had; and therefore, upon adding these items to the hitherto
    rent quantum of 30100 Rthl, which I proposed to take as the basis of the exchange, that sum must be
    raised as high as 60,000 Rthl.


    III) that these offices, being domains, afford me just as little security as the estates already received
    from His Majesty.


    To refute the above grounds the Count of Höym would indeed be better able than I, since these estates
    have hitherto stood under his supervision; inasmuch as an unfavourable light is thereby thrown upon
    the former administration. But through my acquaintance with the locality and with the tenants of that
    time, I shall be in a position to refute these assertions thoroughly, and to lay most humbly before
    Your Royal Majesty in what follows a plan yet more advantageous to Your Most High interest — more
    to remove from myself the appearance'
- page: 2
  en: 'that I had wished to enrich myself at the cost of Your Majesty''s treasury, than for the sake of
    my own advantage. Ad I, concerning the exaggerated advantages of the present Krotoszyn office lease.
    Ad a) the Privy Minister of State von Voss appears still too new to and unacquainted with the constitution
    of the office, when he has quite incorrectly asserted that the fund of 9543 Rthl of the Reserve Fund
    could accrue to the rent quantum, and has been unwilling to distinguish between gross and net yield.
    Of this, the gross yield does indeed consist of 39643 Rthl, but the necessary expenditures are not
    deducted at all, and there always remains to the Royal treasury only the surplus of 30100 Rthl. Now
    if I have taken the latter sum as the basis of the exchange, it goes without saying that I have undertaken
    to bear those expenditures.


    These expenditures consist in


    24 per cent land contribution


    2722 rl.


    [uncertain: Salaries] for the office''s judicial officials. 1234. For remissions for the subjects,
    reckoning one year with another, 2000


    = 5956


    There accordingly remains over


    3587. This remaining quantum is far from sufficient to maintain the buildings of the office annually,
    and to this item would have to be added all such advantages as forest and mast may perhaps afford.


    Ad b.) It is just as incorrectly asserted that hitherto a whole demesne farm has been left out of
    the valuation. The matter stands quite otherwise. This is no demesne'
- page: 3
  en: 'farm, but 1 Hollander Hufe, which von Triebenfeld acquired from the possessors of two Hollanders
    still in Polish times; he has indeed made and laid out a demesne farm from it,


    and the same has been ceded to the present tenant, but none the less it can be regarded as an appurtenance
    of the manorial lordship (Dominium). Even granting that von Triebenfeld had acquired it by illegitimate
    means, it would be the former possessors, and not the fisc, who could vindicate it. Ad c.) The Privy
    Minister of State von Voss can never have seen the Krotoszyn woodlands.


    It is notorious that they have already been devastated by the ex-minister von Goerne, who for a year
    and a day had stave-cutters, 600 persons indeed, in them; and even if the district is large enough,
    still a whole century must first pass before it becomes usable again, if one will consider that all
    the subjects receive free building and firewood, whence it comes that neither forest nor mast use
    has hitherto been of any importance.


    If therefore the Privy Minister of State von Voss asserts that Krotoszyn must in future yield 60,000
    Rthl, I most humbly and most urgently beg Your Royal Majesty to hold him to his word at the end of
    the lease in 1800, should nothing come of my offer; and I shall not fail then to remind Mr. von Voss
    of it. The improvements to be effected, however, do not belong here, inasmuch as a great capital outlay
    is required for them;


    Ad 3, Mr. von Voss betrays no expert knowledge whatever; inasmuch as the offices of Krotoszyn and
    Polajewo are not domains at all, but may at most after 36 years come to be such, which I likewise
    do not doubt.


    These estates are originally of noble quality; they were by Minister'
- page: 4
  en: 'Goerne accumulated as such, and thereafter sequestrated for account of the Maritime Trading Company,
    to which von Goerne owed nearly 1 million thaler.


    When South Prussia was occupied, the [uncertain: Negotiating] Company was glad to cover that capital
    together with interest, and exerted itself to bring matters to the point that the estates should be
    handed over to the Posen Chamber in administration on the condition that an amortisation quantum of
    50000 rl. should be paid off annually.


    At that time this plan was wholly contrary to Mr. von [uncertain: Voss], which is why I cannot now
    explain his contradiction either, since the matter stands today just as it did then.


    After Mr. von Voss had lost the department, the plan of the Maritime Trading Company was confirmed
    by a cabinet order of the 4th of March 1795, but at the same time it was therein laid down that only
    after 36 years, when that burden of debt should have been paid off, these estates should take on the
    character of domains. Until then they are to be regarded as private estates, which is sufficiently
    proved by the fact that they bear the burdens of noble estates, such as the 24 per cent dues.


    Having sufficiently refuted the assertions of Mr. von Voss, I cannot forbear adding the following,
    which


    Mr. von Voss has probably deliberately passed over in silence:


    1, Krotoszyn has lost the propination rights in the town of Krotoszyn, whereby the revenue is diminished
    by 4000 Rthl according to the valuation.


    2, The [uncertain: soundest] part of the forest is in a boundary dispute with the manorial lordship
    of Kozmin.


    3. The Jews have brought it about by judgment and law that'
- page: 5
  en: 'they have been reduced to lower dues.


    4, Polajewo is leased at 6000 Rthl higher than it was valued, on which account sequestration has already
    three times been set on foot there, and the tenant Count von Plotow has thereby been ruined, who,
    as I will prove, has already sunk 20,000 Rthl in it,


    5, Polajewo is so totally ruined that the costs of restoration have been set at


    300,000 Rthl, to which is added that the forest is stripped of all building timber, and


    6.) I pledge my honour that Polajewo must come down to a net yield of 12000 Rthl net, if the restoration
    is to be effected out of the revenues. I appeal to the [uncertain: opinion] of the Posen Chamber that
    this is the true state of the matter. Now may Your Royal Majesty most graciously allow my further
    proposal to be laid most humbly before you.


    1) I renounce the possession of Polajewo. But because the [uncertain: office] is not in a position
    to afford the present yield any longer, I will undertake to pay 8000 Rthl yearly toward it, and am
    content that such be transferred onto Krotoszyn, whereof the net yield would thus be, instead of 30000,
    38000; whereby I afford more than if, according to my first offer, I were to take Polajewo over as
    well.


    2.) I undertake, as goes without saying, all public burdens (onera publica), buildings, remissions
    etc. resting upon Krotoszyn, which hitherto have been paid out of the Reserve Fund.


    3) My estates must be valued, or my lease contracts taken as the basis of the exchange, and from these
    the net yield'
- page: 6
  en: 'constituted; this is balanced against the net yield of Krotoszyn, reckoned to capital at 5 per
    cent, and whatever Krotoszyn is worth more than my estates, I pay in cash to the Maritime Trading
    Company, whereby then the annual amortisation quantum is proportionately diminished, which hitherto
    Krotoszyn and Polajewo have discharged at 50000 Rthl yearly, and which in future Polajewo and my estates
    will discharge.


    The advantages which I thereby gain are:


    1) those already adduced in my representation of the [text lost]


    2, that I obtain a rounding-out of my estates, which hitherto lie scattered in South Prussia


    3) that Krotoszyn lies only 8 miles from Breslau, and can be managed in the neighbourhood of my domicile.
    The advantages which Your Royal Majesty gains are:


    1) it can be a matter of indifference to Your Royal Majesty whether my estates lie scattered, since
    they do after all border one upon other domains.


    2.) Gitschen contains building timber, firewood and meadow growth; this the intendancy of Buck and
    Meseritz lacks,


    3. Polajewo is relieved by 8000 Rthl.


    4, The amortisation quantum is diminished. Since I am firmly convinced that Your Royal Majesty gains
    by this exchange as well as I, and since my point of honour suffers if the matter is represented otherwise
    by Mr. von Voss, I must most humbly beg:


    May Your Royal Majesty be pleased to enjoin upon the Posen Chamber by cabinet order to have the investigation
    effected by 2'
- page: 7
  en: 'members of the Chamber who are acquainted with the matter, whose opinion shall circulate among
    the other members of the collegium, to which each shall then add his own opinion, from which the correctness
    of my statement will certainly emerge;


    at the same time I also beg that a report be required from the Count of Höym, and I remain, until
    death, in deepest fidelity,


    Your Royal Majesty''s.'

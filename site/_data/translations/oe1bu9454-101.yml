    remaining members of the collegium, each of whom should then add his own vote, from which the correctness
    of my statement will certainly appear; at the same time I also beg that a report be required of the
    Count von Hoym, and I remain, until death, in deepest fidelity,


    Your Royal Majesty''s.'

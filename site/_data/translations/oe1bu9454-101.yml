- page: 2
  en: 'that I wished to enrich myself at the expense of Your Majesty''s treasury, than for the sake of
    my own advantage. On point I, concerning the excessive advantages of the present Krotoszyn district
    lease: on a) the Privy Minister of State von Voss appears still too new to and unacquainted with the
    constitution of the district office, when he has quite incorrectly asserted that the fund of


    9543 Rthl.


    of the Reservations Fund could accrue to the lease sum, and when he will not distinguish between gross
    and net yield. The gross yield does indeed consist of 39643 Rthl. From this, however, the necessary
    outlays have not been deducted at all, and there always remains to the Royal treasury only the surplus
    of 30100 Rthl.


    Now, since I took the latter sum as the basis of the exchange, it goes without saying that I have
    undertaken to bear those outlays.


    These outlays consist of


    24 per cent land contribution = 2722 Rthl.


    Salaries for the judicial officials of the district office = 1234 Rthl. For remissions to the subjects,
    reckoned one year with another, = 2000 Rthl. = 5956 Rthl.


    There accordingly still remains over = 3587 Rthl.


    This remaining amount is far from sufficient to maintain the buildings of the district office yearly,
    and to this item would have to be added all those advantages which forest and mast may perhaps afford.


    On b) it is just as incorrectly asserted that an entire demesne farm has hitherto been left out of
    the valuation. The case is quite otherwise. This is no demesne'

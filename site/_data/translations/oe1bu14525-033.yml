- page: 1
  en: 'To the Royal Chamber at Poznań.


    Most Serene [Lord],


    Already under the xxx th of xxx of last year a Royal Government at Poznań did already, according to
    the enclosed copy, demand of His Serene Highness the correction of the title of possession of the
    princely Hohenlohe estates as being so necessary and urgent that the treasury (fiscus) was to be moved
    against any longer delay [uncertain: renn] should the same not have been done within a set period
    of fourteen days; whereupon His Highness the Prince of Hohenlohe sent in on the 6[uncertain: 6] of
    March the original deeds of donation that had been wanting for this purpose. As much, then, as His
    Serene Highness has been pressed herein to the [uncertain: zug.] [uncertain: tilige] correction of
    the title of possession, so much has [he] since [seen? been] most concerned [uncertain reading] towards
    the conclusion of this matter; and I have now been charged, in the name of my Lord''s Serene Highness,
    most urgently to beg Your Majesty for the speedy resignation of the treasury over the whole of the
    princely [uncertain: G]estates in Cujavien and Pszczew. Wrocław, the 10th of February 1802.


    To Your Royal Majesty, Glenck


    To the Government.


    Under the xxx th of xxx of last year Your Majesty did, according to the herewith following, according
    to the enclosed copy, demand the correction of the title of possession of the E. H. B. of His Serene
    Highness as being so necessary and urgent that the treasury (fiscus) was to be moved against any longer
    [uncertain: delay] if the same should not have been done within a set period of fourteen days; whereupon
    His Highness the Prince of Hohenlohe sent in on the 6[uncertain: 6] of May the original deeds of donation
    that had been wanting for this purpose. As much, then, as His Serene Highness has been pressed herein
    to the speedy correction of the title of possession, so much concerned etc.'

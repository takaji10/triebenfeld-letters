segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, I have had the honour of receiving here Your Most Serene Highness''s
    gracious letters of the 8th and 18th of April with the enclosures. Since the content of the first
    chiefly concerns the complaint of the Jew Nathan Luipmann, I reply thereto most obediently that his
    item is already entered in the schedule of all liabilities so far known, which was transmitted to
    Your Most Serene Highness; and that both this Jew and all the creditors shall be satisfied, if Providence
    blesses my efforts. At present nothing can be done but to hold off all these matters in this way.
    Upon the dismemberment monies, which amount to some 60000 Rthl, I cannot reckon so quickly, as these
    are likely to come in very slowly. Thus, to meet the costs and pay the interest, I must continually
    take other counsel and borrow monies for short terms.


    Since, however, the Betsche affair is now entirely concluded, the people there must now pay 2000 Rthl
    after deduction of the 6000 Rthl for Echaust; likewise Raven must render up 1200 Rthl in transfer
    fees (Laudemium) - that is but 3200 Rthl so far. To this I shall see what can be driven together against
    Johann out of the estates in rent, interest and entry monies, in order to raise the 30000 Rthl thereby;
    for from the other monies, which are to be procured for the discharge of the debts in the treasury,
    so it seems, nothing is to be taken.


    As to the matter with the Michaelis woman censured in the 2nd letter, this no longer concerns Your
    Serene Highness, and besides, the Betsche people are now paying it'
- page: 2
  en: 'subjects pay.


    The story of the miller in Posen, for whom 1 Rthl. 7 Rthl must be paid, is wholly unknown to me, and
    it is a proof how badly the mandatories serve Your Serene Highness - could I be everywhere present
    at once, no absurdities of this kind would occur.


    von Raven''s letter is akin to a piece of knavery - he will obtain the consent, if the communities
    have nothing against it, but the fellow refuses to pay the transfer fees, and if he does not do so,
    then the communities, who must now be responsible for everything, will demand the estate back and
    pay the value themselves. Regarding the Glenck affair I have already most obediently informed Your
    Serene Highness in my last, and given my opinion upon it. Next Sunday, that is the 11th of this month,
    Pochammer is invited to Steglitz to the Honourable Privy Councillor Beym, and the matter of the loan
    is to be discussed.


    It is a sad thing that everything drags on so long; thus the valuation has had to go back again to
    Kalisz, where the Chamber is to draw up the attestation and the declaration tables after the approbation,
    and hand them over to me. Meanwhile I must sit here to no purpose and wait.


    God grant that the affair may once be brought to an end, for I set aside all my own concerns and yet
    live to see the most unthinkable misfortune. In deepest reverence I remain, until death,


    Your Serene Highness''s


    Berlin, the 8th of May


    1806


    most faithful servant


    v Triebenfeld'

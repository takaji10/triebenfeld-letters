  en: '180


    Most Serene Prince


    Most gracious Prince and Lord, I have had the honour of receiving here, together with the enclosures,
    Your Most Serene Highness''s gracious letters of the 8th and 18th of April. Since the content of the
    former concerns chiefly the complaint of the Jew Nathan Liepmann, I reply thereto most obediently
    that his item is already listed in the schedule of all the known liabilities transmitted to Your Most
    Serene Highness; and that both this Jew and all the creditors shall be satisfied, if Providence [uncertain:
    blesses] my endeavours. At present nothing can be done but to hold off all these matters in this way.
    Upon the dismemberment monies, which amount to some 60000 Rthl, I cannot reckon so quickly, because
    these are likely to come in very slowly. I must therefore continue, for the meeting of the costs and
    the payment of the interest, to seek other counsel and to borrow monies for short terms.


    Since, however, the Pszczew matter is now entirely concluded, the people there must accordingly now
    pay, after deduction of the 6000 Rthl for Echaust, 2000 Rthl; likewise Raven must render up 1200 Rthl
    in transfer fees (Laudemien) — that makes only 3200 Rthl so far. — In addition to this I shall see
    what can be driven in together from the estates by Midsummer in rent, interest and entry monies, in
    order to raise the 30/m Rthl thereby, for nothing is to be taken from the other monies, which are
    to be procured in treasury notes for the discharge of the debts.


    As concerns the matter with Michaelis censured in the 2nd letter, this no longer concerns Your Serene
    Highness at all, and besides, the Pszczew'

- page: 2
  en: 'subjects are to pay it now.


    The story of the miller in Poznań, for whom 1 Rthl 7 Groschen is said to have to be paid, is entirely
    unknown to me, and this is a proof of how badly the mandataries serve Your Serene Highness — could
    I be everywhere at once, no [uncertain: absurdities] of this kind would occur.


    Raven''s letter is like a piece of knavery — he will have the consent, if the communities have nothing
    against it, only the fellow refuses to pay the transfer fees, and if he does not do so, then the communities,
    who must now be answerable for everything, will demand the estate back and pay the value themselves.
    The Glenck matter I have already most obediently reported to Your Serene Highness in my last, and
    have given my opinion upon it. — Next Sunday, that is the 11th of this month, Pochammer is invited
    to Stegelitz to the Privy Cabinet Councillor Mr Beyme, and the business of the loan is to be discussed.


    It is a sad thing that everything drags on so long; thus the valuations have had to go once more to
    Kalisz, where the Chamber is to make out the certificate and the re-valuation tables, following the
    approbation, and to deliver them to me. Meanwhile I must sit here to no purpose and wait.


    God grant that the matter be once concluded, for I set everything of mine [uncertain: behind] and
    yet live to see the most unthinkable misfortune. In deepest respect I remain, until death,


    Your Serene Highness''s


    Berlin, the 8th of May


    1806


    most faithful servant


    v Triebenfeld'

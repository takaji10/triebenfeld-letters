- page: 2
  en: 'brought Your Serene Highness''s estates into proposal, in which he had not beforehand been instructed
    by cabinet order. He said that Mr von Voss had already taken offence at it, and that he would gladly
    give 1,000 Rthl. if the matter were soon brought to a conclusion — The Minister Struensee has also
    had [uncertain: notice] of the matter; he will truly not be opposed — the Cabinet Councillor Beyme
    told him so himself, and, frankly said, this gives me the most courage — for if the King did not mean
    quite seriously with the matter, one would not speak of it, for once the matter comes among men, it
    must absolutely happen. And in substance this is already very much the case. Meanwhile I hope besides
    that the matter will go quite in the best way. And the fellows must after all do something for their
    12 Rthl — the division of this sum I now know approximately: the Schulze daughter, who has a great
    ascendancy over her father, receives 2,500 Rthl.; Klewitz 3,000 Rthl.; the Court Fiscal Michaelis
    300 ducats — the rest the X spider shares with Treskow. Michaelis, meanwhile, is a fine fellow; he
    had the assurance already and'

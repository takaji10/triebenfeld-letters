- page: 3
  en: 'nevertheless dissembled so — Let him do meanwhile as pleases him, if Your Serene Highness obtain
    all that I wish. At Potsdam all certainly goes well — I have there a Cabinet Secretary who is with
    Beyme, engaged together with Brandhorst; these will report not only now but in future everything of
    importance that occurs. It costs, however, 200 Friedrich d''or —


    Now something of political matters — The King struggles mightily against the war —


    Mr von Köckritz and von Zastrow are likewise against it; pre-eminently the Minister von Struensee
    contends against it here — Count Haugwitz seems to be stuck in a mighty embarrassment; he has already
    asked me once what I heard from South Prussia, whether no certain news of the march of the Russians
    were to be heard — as I observe, this seems to be the chief signal — but General Schulenburg absolutely
    wants war. He flatters the Minister Hoym for that purpose, and according to the latter''s utterances
    today he will advise for war in the finest manner possible — for he reckons in that way to be rid
    of the Minister Schulenburg — this last is much incensed at Struensee, since he advises against the
    war and always puts it off that there is no money — indeed he is said to have said outright, in which
    Goldbeck also concurs — the Count Schulenburg led the late blessed Lord into that'

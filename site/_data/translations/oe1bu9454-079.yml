- page: 1
  en: '79


    Most Serene Prince,


    Most gracious Lord!


    With the most conceivable longing I now await the report of His Excellency the Minister of State von
    Voss. May Heaven only govern the heart of this misanthrope, that in this matter, which lies closer
    to my heart than anything, he put no stroke through it. The Minister General Schulenburg has declared
    himself very willing, and as I firmly believe no obstacle will stand in the way of the good cause
    from that quarter. In the end it comes into his hands, for the moneys flow into the Disposition Fund,
    which, after the decease of the former Minister Wölner, has been transferred to Count von Schulenburg.
    The Minister Count Hoym has today been summoned to Potsdam, whither he departed at 8 o''clock in the
    morning — I have therefore given him [uncertain: notice] of the whole affair, since it might easily
    happen that His Royal Majesty might put it to him concerning those estates which he had so long under
    his disposition. He has given me his word to do everything in that regard, and I believe he is in
    earnest — for he said that he would gladly see it very much for that reason, because then his vexation
    would be lifted, that he for Your Serene Highness'

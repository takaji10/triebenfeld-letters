- page: 4
  en: 'unfortunate war, and thereby placed our house in the most sorrowful situation; he will now do it
    more clumsily than before — But this might now bring [uncertain: the week] after it, that Count Schulenburg
    persuades the King that the whole Customs, Excise and Salt Directorate is not necessary, that the
    [uncertain: widow] costs of the persons which the King could spare, that he should subordinate this
    business, as it formerly was, under the old provincial boards, which must attend to it ex officio
    — Count Hoym concurs in this and would gladly overthrow Struensee along with it. I have today begged
    him to go about the work cautiously in loosing off other men''s arrows — since he could thereby be
    placed in a quite ugly light, the more so as Colonel von Köckritz now takes Struensee''s party — Otherwise
    the Minister Hoym now stands very well noted, and if he conducts himself well he can play the best
    part. I shall remain here so long until the Krotoszyn affair is here brought to a clear issue — for
    I see well that if one wishes to know something accomplished, one must remain on the spot oneself.
    Besides this I am negotiating 120/m Rthl back out of the Widows'' Fund upon my own estates, so that,
    if it be required, money may not be wanting in the arranging of the exchange of estates — Michaelis
    is justiciary at this institution — it depends on him, and since he offered me his good services,
    I will profit of it in that manner — For the blanks I beg repeatedly, and I remain, until death, in
    deep submission Your Most Serene Highness''s


    Berlin, the 8th of October


    1798.


    most humble and faithful servant


    v. Triebenfeld


    Her Serene Highness the Princess Sacken was extremely glad yesterday over the news; but she reviles
    the Minister Haugwitz greatly — he was in company with the Princess and did not excuse himself [illegible]
    for his rudeness; I do not trust the hero — he certainly does not do [uncertain: at the reckoning]
    the least for Your Serene Highness, and lies to Your Serene Highness and to the good King —'

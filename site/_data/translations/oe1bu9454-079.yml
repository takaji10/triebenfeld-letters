- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    With the most imaginable longing I now await the report of His Excellency the Minister of State von
    Voss. May Heaven but govern this misanthrope''s heart, that in this matter which lies above all else
    upon my heart he should draw no line athwart it. Minister Count Schulemburg has declared himself very
    willing, and, as I firmly believe, from that quarter no obstacle would stand in the way of the good
    cause. In the end it comes into his hands, for the monies flow to the Disposition Treasury, which
    after the decease of the former Minister Werner was transferred to Count von Schulemburg. Minister
    Count Hoym was summoned today to Potsdam, whither he departed at 8 o''clock in the morning – I have
    therefore [uncertain: informed] him of the whole affair, since it might easily happen that His Royal
    Majesty [uncertain: would put to] him concerning those estates which he had for so long a time under
    his disposition. He has given me his word


    might bear.


    to do everything in that regard, and I believe he is in earnest – for he was of the opinion that he
    would gladly see it for this reason, because then his vexation would be lifted, that he for Your Serene
    Highness'

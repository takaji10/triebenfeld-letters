- page: 3
  en: 'yet dissembled so – let him do, however, as it pleases him. If Your Serene Highness obtains all
    that I wish, at Potsdam everything will certainly go well – I have there a cabinet secretary who is
    with Beyhm, engaged along with Brandhorst; these will report not only now but in future everything
    of importance that occurs.


    But it costs


    200 fr. [illegible]


    Now something of political matters – the King resists the war mightily.


    Mr. von Köckritz and von Zastrow are likewise against it; here Minister von Struensee contends against
    it above all. Mr. Haugwitz seems to be in a mighty embarrassment; he has already asked me once what
    I heard from South Prussia, whether no certain news of the march of the Russians was to be heard —
    as I perceive, this seems to be the chief signal – Count Schulemburg, however, absolutely wants war.
    He flatters Minister Hoym on that account, and according to the latter''s utterances today he will
    in the finest manner advise war so far as possible – for he reckons in that way to be rid of Minister
    Schulemburg – this last is much incensed against Struensee, since he advises against the war and always
    puts it off, that there is no money there – indeed he is said to have said outright, in which Goldbeck
    also concurs – the Count Schulemburg led the late blessed Lord into that'

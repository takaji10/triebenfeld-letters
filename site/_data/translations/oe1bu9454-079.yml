- page: 4
  en: 'unhappy war, and thereby placed our House in the most sorrowful situation; he will now do it more
    clumsily than before – But this might now draw after it in the course of the week that Count Schulemburg
    persuades the King that the whole Customs, Excise and Salt Directorate is not necessary, that the
    people''s [uncertain: widows''] costs which the King might save, that he ought to subordinate this
    business, as it formerly was under the old provincial colleges, which must attend to it ex officio
    – Count Hoym concurs in this and would gladly help overthrow Struensee. I have begged him today to
    go about the work cautiously in the loosing off of other men''s arrows – since he might thereby be
    placed in a very ugly light, the more so as Colonel von Köckritz is now taking Stru[ensee]''s part
    – Otherwise Minister Hoym now stands very well in credit, and if he conducts himself well he can play
    the fullest part. I shall remain here so long until the Prot. affair is here brought into order –
    for I see well that when one wishes to know that something has been accomplished, one must stay upon
    the spot oneself. Moreover I am negotiating from the Widows'' Fund on my own [uncertain: guarantee],
    so that, if it be required, money shall not be wanting in the arrangement of the exchange of estates
    – the 120 Rthl – Michaelis is justiciary at this institution – it depends on him, and as he offered
    me his good services, I will profit from them in that way – Concerning the blank forms I repeat my
    request – and I remain, until death, in deep submission Your Most Serene Highness''s


    Berlin, the 8th of October


    1798.


    most humble and faithful servant


    v. Triebenfeld'

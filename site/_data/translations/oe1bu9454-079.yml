status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! With the most imaginable longing I now await the report
    of His Excellency the Minister of State von Voss. May Heaven but govern this misanthrope''s heart,
    that in this matter, which above all else lies close to the heart, he draw no line through it. The
    Minister Count Schulemburg has declared himself very willing, and, as I firmly believe, from that
    side no obstacle would stand in the way of the good cause. In the end it comes into his hands, for
    the moneys [uncertain: Pließe] to the Disposition Fund, which after the decease of the former Minister
    Worner was transferred to Count v. Schulemburg. The Minister Count Hoym was today summoned to Potsdam
    — I have [uncertain: whither] he departed at 8 o''clock in the morning — and therefore informed him
    of the whole matter, since it might easily happen that His Royal Majesty might put to him concerning
    those estates which he had so long under his disposition. He has given me his word to do everything
    in that regard, and I believe he is in earnest — for he said that he would gladly see it for this
    reason, because his vexation would then be lifted, that for Your Serene Highness he had'
- page: 2
  en: 'proposed Your Serene Highness''s estates, in a matter wherein he had not beforehand been instructed
    by Cabinet order. He said that Herr v. Vorh. had already taken formal exception on that account, and
    that he would gladly give 1000 Rthl if the matter were soon brought to a conclusion. The Minister
    Struensee has likewise been apprised of the matter; he will truly not be opposed — the Cabinet Councillor
    Beyhm told him so himself, and, to speak candidly, this gives me the greatest courage — for if the
    King were not in real earnest about the matter, one would not speak of it; for once the matter comes
    among men, it must absolutely be done. And at bottom this is very much already the case. Yet I hope
    besides that the matter will go quite in the best manner. And the fellows must after all do something
    for their 12 Rthl. The distribution of this sum I now know approximately: the Schulze daughter, who
    has a great ascendancy over her father, receives 2500 Rthl; Klewis 3000 Rthl; the Court Fiscal Michaelis
    300 ducats — the remainder the X spider shares with Treskow. Michaelis is meanwhile no [uncertain:
    small] fellow; he had had the assurance already and'
- page: 3
  en: 'nevertheless dissembled so — let him do meanwhile as it pleases him. If Your Serene Highness obtain
    what I wish in every respect, at Potsdam all will surely go well — I have there a Cabinet Secretary
    who is with Beyhm, engaged along with the Brandhorst; these will report not only now but in future
    everything of importance that occurs. It costs, however, 200 fr dbr. Now something of political matters.
    The King struggles mightily against the war; Herr v. Köckritz and v. Zastrow are also against it;
    above all Minister v. Struensee contends against it here. Herr Haugwitz seems to be in a mighty embarrassment;
    he has already asked me once what I heard out of South Prussia, whether no certain intelligence of
    the march of the Russians was to be heard — as I perceive, this seems to be the chief signal. Count
    Schulemburg, however, absolutely wants war. He flatters Minister Hoym on that account, and, according
    to the latter''s utterances today, he will most subtly advise for war so far as possible — for he
    reckons in that manner to be rid of Minister Schulemburg. This last is much incensed against Struensee,
    since he advises against the war and always puts it off, that there is no money there — indeed he
    is said to have declared outright, in which Goldbeck too concurs: the Herr Count Schulemburg led the
    late blessed Lord into that'
- page: 4
  en: 'unhappy war, and thereby placed our House in the most sorrowful situation; he will now do it more
    clumsily than before. This, however, might well draw after it the week, that Count Schulemburg persuades
    the King that the whole Toll, Excise and Salt Directorate is not necessary, that the [uncertain: human
    widows''] costs which the King might save, that he ought to subordinate this business, as it formerly
    was under the old provincial Collegia, which must attend to it ex officio. Count Hoym concurs in this
    and would gladly help to overthrow Struensee. I begged him today to go about the work cautiously in
    the loosing off of other men''s arrows — since he might thereby be placed in a very [uncertain: ugly]
    light, the more so as Colonel v. Köckritz now takes the Stra— party. Otherwise Minister Hoym now stands
    very well in credit, and if he conducts himself well he can play the best [uncertain: role]. I shall
    remain here so long until the Prot. matter is here brought into the clear — for I see well that when
    one wishes a thing to be accomplished, one must oneself remain upon the [uncertain: spot]. Besides
    this I am negotiating out of the Widows'' Fund upon my estate back, so that, when it is required,
    in the ter 120 Rthl arrangement of the exchange of estates there be no want of money. Michaelis is
    Justiziarius at this institution — it depends upon him, and as he offered me his good services, I
    mean to profit of it in that manner. For the blank forms I beg repeatedly — and I remain, until death,
    in deep submission Your Most Serene Highness''s Berlin, the 8th of October 1798. most humble and faithful
    servant v. Triebenfeld'

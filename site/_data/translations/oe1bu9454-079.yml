- page: 2
  en: 'put Your Serene Highness''s estates forward in a proposal in which he had not previously been instructed
    by cabinet order. He was of the opinion that Mr. von Vorh. had already taken formal exception on that
    account, and that he would gladly give 1000 Rthl if the matter came to a conclusion soon. Minister
    Struensee has also had [uncertain: notice] of the matter; he will truly not be opposed – the Cabinet
    Councillor Beyhm told him himself, and, to speak candidly, this gives me the greatest courage – for
    if the King did not mean the matter quite seriously, one would not be speaking of it; for once the
    matter comes among men, then it absolutely must happen. And at bottom this is very much the case already.
    In any event I hope besides that the matter will go in the very best way. And the fellows must after
    all do something for their 12 Rthl. The distribution of this sum I now know approximately: the Schulze
    daughter, who has a great ascendancy over her father, receives 2500 Rthl, Klewis 3000 Rthl, the Court
    Fiscal Michaelis 300 ducats – the remainder is shared between the X spider and Treskow. Michaelis,
    however, is a [uncertain: petty] fellow; he had the assurance already and'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! On my most recent arrival at Kalisz I learned,
    to my most deadly dismay, that the Russian Emperor had passed through this place the night before
    and had gone back into his own dominions – the principal plan of my journey was thus wrecked; nevertheless
    I continued on my way, in order to lay myself at the feet of the Prince Chancellor, upon whom alone
    everything now depends, and to implore his help. At Posen I met a certain Espagne, who is employed
    here as Chief Postal Director, who is much esteemed by the Prince Chancellor and is a bosom friend
    of Barbe. He gave me the sad news – that the Prince Chancellor is still in Paris, that he would depart
    on the 17th, that Barbe lay there in a nervous fever [uncertain: Brand] – that Prince Hardenberg was
    travelling by way of Cassel and [uncertain: freundt] on the Main, having much to settle there, and
    would not come to Berlin for over 3 weeks. These were all most crushing tidings, which almost paralysed
    my senses. I am now investigating the Betscher affair here, to see whether anything is to be gained
    by it – the more so as the subjects have already petitioned for the annulment of the contract. If
    I obtain light in the matter here soon, I shall go once more to Blizanow'
- page: 2
  en: 'in order to extort some money from my tenant, and then hasten to Berlin. As for what sort of a
    fine answer the O. P. v. Zerb. [uncertain: die Sponten] gave to A. Schmid, Your Serene Highness may
    be pleased to satisfy yourself from the enclosure. According to the assurance of Herr O. Zerboni,
    he claims to have sent off his advisory report to the Prince Chancellor; how it reads I do not yet
    know, but I am to be given sight of it tomorrow. Meanwhile I doubt the existence of any such report,
    for how could the whole of the files have been remitted to Schenck, which yet absolutely had to be
    appended to the report – the more so as they contain the original vouchers within them. On the whole,
    not much good will shines out of the answer, but rather the pp. irony; for how could so shrewd and
    accomplished a man of business refer a Schenck to the person of the Russian Emperor, and hand over
    to him the original files for that purpose –? Meanwhile [uncertain: Schack] received the resolutions
    a couple of days after the Emperor''s journey through Kalisz — by good fortune he could not present
    himself to the Emperor with them and perhaps spoil everything. Oh, how good it would have been had
    I gone to Paris and there canvassed without waiting for the report of the Herr Chief President. For
    the present there is nothing to be done but to await the Prince Chancellor''s return to Berlin and
    to implore his help — Minister Stein has, as the worthy Chief Postal Director E. told me in confidence,
    been laid entirely on the shelf — no one may [text lost] him; the fate of this noble man is indeed
    most sad. He has after all'
- page: 3
  en: 'done much for General Ch — He has sacrificed everything, and now one lets him go. — I pity him
    greatly — the Prince Chancellor stays away so long only because he himself must now set everything
    in train and settle it alone at Frankfurth on the Main. — For the rest, many rumours are going about
    here which will probably never be confirmed. Prince Radziwill has been summoned by the Emperor to
    Warsaw, and [uncertain: kannz] Biron is coming here; from this people would infer a great deal. Whither
    I shall actually turn, I shall most humbly report to Your Serene Highness before my departure from
    here. In deepest reverence I remain, as Your Most Serene Highness''s

    Posen, the 17th November 1815

    humble and obedient servant, v Triebenfeld'

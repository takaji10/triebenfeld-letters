- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    From the enclosed letter of Pankrat Your Most Serene Highness will graciously be pleased to satisfy
    yourself that the Mennonites will buy. Pankratz is one of their principal elders, and what he promises
    every member of that sect is bound to keep. I shall therefore travel tomorrow to Lunau and try my
    fortune. The verbal assurance given by Pankratz to the old district messenger is that the Mannauſten
    intend to buy the Zagorowo and Trąbczyn estates altogether and to divide them among themselves at
    the price fixed for them by Your Serene Highness. God grant now its further prospering. For the rest,
    I greatly fear that I shall return with a second bilious fever. The only honest man who is here is
    the [uncertain: suntitz] burgomaster Schenck. His assessment will turn out well, and in case of need
    money can at any time be raised upon it. Only he lacks the contract with the miller''s [text: "das
    Müller weil"] in Trąbczyn - Mr. Glenck has that - and then the contract concluded on the 5th of September
    with Mr. Building Councillor Glenck stands against them, in which 300 Morgen of manorial land and
    the settlement of all dues from the bailiwick are promised to him. [uncertain: Gleich] has sent this
    contract here'

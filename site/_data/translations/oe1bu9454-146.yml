- page: 2
  en: on to Tappert, so that he should make it public. Tappert at once laid the contract before the valuation
    commission and protested that they should not there bring the said lands into the valuation. The Gemeinde
    has taken alarm at this and protests against the removal of these lands, a part of which belongs to
    it as pasturage — and this now hinders the commission, so that it cannot proceed further, the more
    so since Tappert also produced a contract of sale of Glenck's, by which Glenck has sold along with
    it the komornik holdings in the whole of Wrąbczyn to a certain v Malachowski — It would be necessary
    for Glenck to issue a written undertaking in which he declares that he has given the 300 Morgen back
    to Your Serene Highness, and also declares that he was not able to sell the komornik holdings and
    that this was an error. Then again, all the negotiations with the Swięcia people are missing here
    — perhaps Glenck has something of them there; so too the contract of the miller's wife from Wrąbczyn
    would be there, as also the contract with the Swięcia Hollanders; and if Glenck were willing to issue
    the written undertakings, may Your Serene Highness be pleased most graciously to convey them to me
    by this express, so that the matter might be put in order —

- page: 3
  en: 'The dismemberment will in any event be brought to a happy conclusion, for a great many persons,
    whose names have been noted down here, are ready to buy at any [uncertain: Wird], and besides the
    Mennonites they have presented themselves here, so that one may pick and choose. Still, I wish to
    conclude with the Mennonites, because from them I obtain the most money and go the most securely.


    Otherwise they have merely played the fool and sown the fields after all — v. Otocki has followed
    this example at Kopojno, and there will not be much left over to sell. These are worse than wicked
    men — I thought to get a great deal out of it; what is to become of it now? It is remarkable that
    when a German comes to Poland he is at once corrupted to the very blood — thus, for example, the surveyors
    have not yet finished the map, and yet the [uncertain: fäulste] has not, the man Leopold has already
    had 368 Rthl. paid out to him — which was in fact given to the wretch as well — Wollenhaupt is a sly
    rogue; but I shall dispatch this scoundrel so neatly that he will not know how he got out of Trąbczyn.


    Landrath v Blomberg is the worst pettifogger there ever was on earth — if one did not need the miserable'

status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord! From the enclosed letter of Pankrat Your Most Serene Highness
    will graciously deign to be convinced that the Mennonites will buy. The said Pankratz is one of their
    principal elders, and whatever he promises every member of this sect is bound to hold to. I shall
    therefore set out tomorrow for Lunau and try my fortune. The verbal assurance given by Pankratz, still
    to the old district messenger, is that the Mennonites wish to buy the Zagorow and Trąbczyn estates
    altogether and to divide them among themselves according to the price fixed for them by Your Serene
    Highness. May God now grant it further prosperity. For the rest, I greatly fear that I should return
    with a second bilious fever. The only honest man who is here is the justice-burgomaster Schenck. His
    assessment will turn out well, and one can at any time, in case of need, raise money upon it. Only
    he lacks the contract with the miller because in Trąbczin — that one Mr. Glenck has — And then there
    stands against them the contract concluded on the 5th of September with the Building Councillor Mr.
    Glenck, in which 300 Morgen of domanial land and the settlement of all dues from the Vogtey are promised
    to him. Gleich has sent this contract here
- page: 2
  en: here to Tappert, so that he should make it publicly known. Tappert at once handed the contract over
    to the Taxation Commission and protested that they should not there bring the said lands into the
    valuation. The commune has become suspicious of this and protests against the taking away of these
    lands, of which a part belongs to it as pasture — and this now hinders the Commission, so that it
    cannot work further, the more so as Suppert has also produced a Gienck contract of sale, according
    to which Glenck has sold along with it the komorniks in the whole of Wrąbczin to a certain v. Małachowski.
    It would be necessary that Glenck issue a written undertaking in which he says that he has given the
    300 Morgen back to Your Serene Highness, and also that he declare that he could not sell the komorniks
    and that this was an error. Then all the negotiations with the Swięcia people are wanting here — perhaps
    Glenck has something of them there; there would then be the contract of the miller's wife of Wrąbczin,
    as also the contract with the Swięcier Hauländer there; and should Glenck be willing to issue the
    written undertakings, may Your Serene Highness deign most graciously to transmit them to me by this
    express, so that the matter may be brought clear.
- page: 3
  en: 'The dismemberment will in any case be happily brought to a conclusion, for very many people, who
    have been noted down here as ready to buy at any [uncertain: price], have presented themselves here
    besides the Mennonites, so that one has a choice. Meanwhile I wish to conclude with the Mennonites,
    because from them I obtain the most money and go most securely. Otherwise they have merely played
    their tricks and yet sown the fields — v. Otocki has followed this example at [uncertain: Copoina
    / Kopojno], and there will not be much left over for sale. These are more than wicked men — I believed
    I should bring a great deal out of it; what will now become of it? It is a strange thing that when
    a German comes into Poland he is at once corrupted to the very blood; thus, for example, the surveyors
    have not yet finished the map, and yet the laziest of them, Leopold, has not failed to have 368 Rthl
    paid out to him already — which was also given to the wretch — Wollenhaupt is a crafty rogue; meanwhile
    I shall dispatch this scoundrel so finely that he shall not know how he gets out of Trąbczin. The
    Landrath v. Blomberg is the worst [uncertain: scoundrel] that ever was on earth — did one not need
    the miserable'
- page: 4
  en: 'scoundrel so exceedingly much in the dismemberment, I would spit the fellow in the face — In the
    meantime I shall treat him with coldness and such [uncertain: liberty] as is possible until I need
    him no longer — Your Serene Highness may however be assured that he shall do you no harm, for I have
    taken care of that in every way. To set down his knaveries here, and by what base cunning he has once
    again gone about to learn the state of the cash here, would be too lengthy; I shall relate them to
    Your Serene Highness by word of mouth; enough that he is a bad fellow, who would suit better at the
    head of a band of robbers than for a Landrath — I must gather up all my patience so as not to betray
    myself. On account of Przespolewski the Government has sent execution hither, that Your Serene Highness
    should at once pay 6500 Rthl. I have had the necessary objections lodged against it forthwith. 1.
    Przespolewski has ceded the claim to a certain Magnuski. 2. Szczucki has laid an arrest upon it. 3.
    The document has been lost; nothing can be cancelled and consequently nothing paid either, for Heinrichs
    likewise would pay nothing sooner than when all was cancelled. This here the Government [uncertain:
    knows] well; how can it proceed here so infamously? In deepest reverence I remain, until death, Your
    Most Serene Highness''s — On account of Radzinski all is provided for, but the registry is in a devilish
    disorder; thus I found today the accompanying piece among the Sentach papers, whereas it belongs altogether
    here, before the town [illegible]uft — most humble and obedient servant v Triebenfeld. Trąbczin, the
    17th of 9br 1804'

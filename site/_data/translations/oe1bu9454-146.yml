- page: 1
  en: '146


    Most Serene Prince,


    Most gracious Lord!


    From the enclosed letter of Pankratz Your Most Serene Highness will be pleased to satisfy yourself
    that the Mennonites will buy. Pankratz is one of their principal elders, and what he promises every
    member of this sect is bound to abide by. I shall therefore travel tomorrow to Lunau and try my fortune.
    The verbal assurance given by Pankratz to the old district messenger is that the Mennonites wish to
    buy the Zagórów and Trąbczyn estates as a whole and to divide them among themselves at the price fixed
    for them by Your Serene Highness. May God now grant it further prosperity. For the rest, I greatly
    fear that I shall return with a second bilious fever. The only honest man who is here is the justice-burgomaster
    Schenck. His valuation will turn out well, and in case of need money can at any time be raised upon
    it. He lacks only the contract with the miller''s wife in Trąbczyn — Mr Glenck has that one — Then
    again, there stands against them the contract concluded on the 5th of September with the building
    councillor Mr Glenck, in which 300 Morgen of manorial land and the settlement of all dues from the
    bailiff''s holding are promised to him. Glenck has sent this contract here'

- page: 3
  en: 'The dismemberment will in any event be brought to a happy conclusion, for a great many people,
    who have been noted down here as ready to buy at any [uncertain: Wird], have come forward here besides
    the Mennonites, so that one has a choice. Meanwhile I wish to conclude with the Mennonites, because
    from them I receive the most money and go the most securely.


    Otherwise they have only played the fool and yet sown the fields - von Otocki has followed this example
    at Kopojno, and there will not be much left to sell. These are indeed worse than wicked men – I believed
    a great deal was to be got out of it there; what will now become of it?


    It is singular that when a German comes to Poland he is at once corrupted to the very blood: thus
    for example the surveyors have not yet finished the map, and nevertheless the laziest of them, Leopold,
    has already had 368 Rthl paid out to him – which has also been given to the wretch – Wollenhaupt is
    a crafty rogue; meanwhile I shall dispatch this scoundrel so neatly that he shall not know how he
    got out of Trąbczyn.


    The district administrator von Blomberg is the worst [uncertain: Nabuliet] that ever was on earth
    - if one did not need the miserable'

- page: 2
  en: 'to Tappert, so that he should give it out publicly. Tappert at once handed the contract over to
    the assessment commission and protested that they ought not to bring those lands into the valuation
    there. The commune has grown suspicious at this and protests against the taking away of these lands,
    a part of which belongs to it as pasture - this now hinders the commission, so that it cannot work
    further, the more so as [uncertain: Suppert] has also produced a sale contract of Glenck''s, according
    to which Glenck has sold along with it the komornik holdings in the whole of Wrąbczin to a certain
    von Małachowski. It would be necessary that Glenck issue a written undertaking in which he says that
    he has given back the 300 Morgen to Your Serene Highness, and also that he declare that he could not
    sell the komornik holdings and that this was an error. Then all the negotiations with the Swięcia
    people are missing here - perhaps Glenck has something of them there; so too the contract of the miller''s
    wife from Wrąbczin would be there, as also the contract with the Swięcier Hollanders; and if Glenck
    were willing to issue the written undertakings, may Your Serene Highness graciously be pleased to
    transmit them to me by this express messenger, so that the matter might be put in order.'

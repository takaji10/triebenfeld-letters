- page: 4
  en: 'scoundrel so exceedingly for the dismemberment, I would spit in the fellow''s face – In the meantime
    I shall treat him with coldness and such freedom as is possible until I no longer need him - Your
    Serene Highness may meanwhile be assured that he shall do you no harm, for I have taken care of that
    in every way. To set down his knaveries here, and what base cunning he has again employed in order
    to learn the state of the funds here, would be too lengthy; I shall relate them to Your Serene Highness
    by word of mouth; enough that he is a bad fellow, who is better suited to the head of a band of robbers
    than to be district administrator - I must gather all my patience, so as not to betray myself.


    In the matter of Przespolewski the government has sent execution here, that Your Serene Highness should
    at once pay 6500 Rthl. I have immediately had what is necessary submitted against it.


    1. Przespolewski has ceded the claim to a certain Magnuski


    2. Szczucki has laid an attachment upon it


    3. The document has been lost; nothing can be cancelled and consequently nothing paid either, for
    Honrichs too would pay nothing sooner than when all had been cancelled. This here the government [uncertain:
    gut]; how can it proceed here so infamously? In deepest reverence I remain, until death,


    Your Most Serene Highness''s — In the matter of Radzinski everything is provided for, but the registry
    is in a devilish disorder; thus I found today the enclosed piece among the [uncertain: Sentachen]
    papers, and this belongs here altogether, one before the town [illegible][uncertain: uft] here — most
    humble and obedient servant, von Triebenfeld


    Trąbczyn


    the 17th of November


    1804'

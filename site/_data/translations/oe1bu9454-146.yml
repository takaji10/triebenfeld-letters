- page: 4
  en: 'scoundrel so exceedingly in the dismemberment, I would spit the fellow in the face — Meanwhile
    I shall treat him with coldness and such liberty as is possible until I no longer need him — Your
    Serene Highness may rest assured, however, that he shall do you no harm, for I have provided against
    that in every way. To set down his knaveries here, and what base cunning he again employed in order
    to [uncertain: learn the cash-boxes] here, would be too long-winded; I shall relate them to Your Serene
    Highness by word of mouth. Enough that he is a bad fellow, better fitted to stand at the head of a
    band of robbers than to be a Landrath — I must summon up all my patience so as not to betray myself.


    In the matter of Przespolewski the Government has sent execution here, that Your Serene Highness is
    to pay 6,500 Rthl. forthwith. I have at once had the necessary objection lodged against it.


    1. Przespolewski has ceded the claim to a certain Magnuski


    2. Szczucki has laid an attachment upon it


    3. The document has been lost; nothing can be struck off and consequently nothing can be paid either,
    for Honrichs too would pay nothing sooner than when everything had been struck off. This here the
    government well; how can it proceed so infamously in this matter? In deepest reverence I remain, until
    death,


    Your Most Serene Highness''s — In the matter of Radzinski everything is taken care of, but the registry
    is in devilish disorder; thus I found today the enclosed piece among the [uncertain: Sentachen] papers;
    this belongs here altogether, one before the town [illegible]uft here. Trąbczyn,


    the 17th of November


    1804


    most humble and obedient servant


    v Triebenfeld'

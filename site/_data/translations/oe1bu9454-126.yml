segments:
- page: 1
  en: 'Cabunis is back with the Hussites — The people have taken an extraordinary liking to it; they now
    mean to hurry back, gather their brethren in the faith together and settle everything within 14 days.
    Cabanis has, however, brought many pieces of news with him, about which I must speak with Your Serene
    Highness. It is in the highest degree necessary that someone go there at once, to bring everything
    into the best course.


    I am working here with the Olesnicas people — would Your Serene Highness be so gracious as to come
    to me for a quarter of an hour from the parade, then Your Highness could hear all these people yourself,
    and at once issue Your Highness''s commands as to what is further to be done.


    v. Triebenfeld


    [uncertain: Breslau] the 30th April 1804'

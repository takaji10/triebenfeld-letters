    To His Most Serene


    Highness. Cabanis is back with the Hussites — the people liked it exceedingly; they now wish to hurry
    back, gather their fellow believers together and settle everything within 14 days. But Cabanis has
    brought back a great deal of news, about which I must speak with Your Serene Highness. It becomes
    most extremely necessary that someone go there at once, to bring everything into the best track.


    I am here working with the Oleśnica people — would Your Serene Highness be so gracious as to come
    to me for a quarter of an hour from the parade, for then Your Highness could hear all these persons
    yourself, and at once issue Your Highness''s commands as to what is further to be done.


    Wrocław, the 30th of April 1804


    v Triebenfeld'

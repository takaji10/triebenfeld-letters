  en: '81


    Most Serene Prince


    Most gracious Prince and Lord.


    However much Mr von Triebenfeld and Eysenhardt press me to obtain for them definite news of the present
    state of the estate exchange, I am nevertheless not in a position to report anything definite to Your
    Most Serene Highness today. At the South Prussian registry with the expedition office, from which
    I have just returned, nothing has yet come in; this is a sign that the matter must still be stuck
    in the correspondence between Minister


    v. Voss and the Privy Finance Councillor Schulze, and that nothing has yet been decreed. I do not
    think it expedient to trouble Schulze so often with my visits, since what he needs to know for the
    present I already told him the last time; I shall therefore,'

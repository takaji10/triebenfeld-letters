- page: 2
  en: 'until the arrival of Your Serene Highness''s power of attorney, and since I look forward to the
    same next Tuesday, I shall then endeavour without delay to authenticate myself therewith and to obtain
    a reliable enquiry from Herr Schulze. I remain, until death, Your Most Serene Highness''s most humble,
    faithful and most obedient


    Michaelis


    Berlin


    the 13th of October


    1798'

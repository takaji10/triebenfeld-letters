segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord.


    However much Herr von Triebenfeld and Eysenhardt press me to procure them definite news of the present
    state of the exchange of estates, I am nevertheless not in a position to report anything definite
    to Your Most Serene Highness today. In the South [uncertain: Greustisch] registry with the dispatch
    office, from which I have this moment returned, nothing has yet come in; this is a sign that the matter
    must still be stuck in the correspondence between the Minister


    von Roth and the Privy [uncertain: Einweg] Councillor Schulze, and that nothing has yet been decreed.
    I do not think it expedient to trouble the said Schulze so often with my visits, since what he needs
    to know for the present I have already told him the time before; I shall therefore, until'

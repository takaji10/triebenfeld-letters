status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord. However much Herr von Triebenfeld and Eysenhardt
    press me to procure them definite intelligence of the present state of the exchange of estates, I
    am nevertheless not in a position to report anything definite to Your Most Serene Highness today.
    In the South Prussian Registry and Expedition office, from which I am just now returning, nothing
    has yet arrived; this is a sign that the matter must still be lodged in the correspondence between
    the Minister v. Roth and the Privy [uncertain: Einweg] Councillor Schulze, and that nothing has yet
    been decreed. I do not think it expedient to trouble the said Schulze so often with my visits, since
    I have already told him the previous time what he must know for the present; I shall therefore, until'
- page: 2
  en: until the arrival of Your Serene Highness's power of attorney, [text lost] further, and since I
    look for the same next Tuesday, I shall then take pains without delay to legitimate myself therewith
    and to obtain a reliable enquiry from Herr Schulze. I remain, until death, Your Most Serene Highness's
    most humble, faithful and most obedient Michaelis Berlin, the 13th of October 1798

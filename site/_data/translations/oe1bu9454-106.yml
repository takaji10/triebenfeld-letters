- page: 3
  en: 'I believe that the ministers here act as sovereigns (en Souverain) and would never let the exchange
    take place, unless the monarch should command it. By a trusty man I shall report everything further
    to Your Serene Highness most humbly.


    In deepest reverence I remain, until death,


    Your Most Serene Highness. This very moment I receive Your Most Serene Highness''s two gracious letters
    with the enclosures - 6 ill will, which I report to Your Serene Highness by another and surer route,
    shows itself here only too plainly. This very day he receives an extremely polite letter which is
    said to have been enclosed to Wildeganchen - meanwhile nothing is gained by this hero, unless it be
    that Your Most Serene Highness now concur in everything there with the man who recommended him to
    P. The times are now strange, and in this regard one may speak freely from the heart. Your Serene
    Highness has, as only Eysenhardt says, fallen with the horse - for God''s sake I beg, Most gracious
    Prince and Lord, do take some care of yourself. Berlin, the 25th of May


    1799.


    faithful most humble and obedient servant


    v. Triebenfeld.'

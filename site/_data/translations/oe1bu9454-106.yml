- page: 2
  en: 'For the rest, matters look ill. Following a decree of contumacy issued by the Posen government,
    there is an absolute intention to take the Brzyz estates back from Your Most Serene Highness - and
    when there is added to this that the Chambers, together with the forest officials there, are making
    nothing but intrigue over the forests and mean to wrest them from Your Serene Highness, then on that
    side all is lost.


    For my own part I cannot see what is to become of the affair. The Chambers chicane at every turn;
    besides this, suits are being got up from several quarters, frightful costs and dissipations of money
    are incurred, and notwithstanding all this no end of them can be foreseen, and in this regard there
    is no thinking of any quiet possession of these estates. The exchange business likewise lies upon
    an endless road, and no one gives a thought either to the inspection or to the valuation of the estates;
    and to speak without circumlocution'
  names:

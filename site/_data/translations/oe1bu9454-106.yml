- page: 2
  en: 'For the rest, it looks bad. Pursuant to a contumacial decree issued by the Poznań Government, they
    absolutely mean to take the Brzyzer estates back from Your Most Serene Highness — and when to this
    is added that the Chambers, together with the forest officials there, are doing nothing but intrigue
    over the forests and mean to wrest them from Your Serene Highness, then on that side all is lost.


    For my own part I do not see what is to become of the matter — the Chambers chicane at every turn;
    moreover, lawsuits are being framed from several quarters, dreadful costs and fritterings-away of
    money are incurred, and for all that no end to them can be foreseen, and in this respect there is
    no thinking of any quiet possession of these estates. The exchange business also lies on an endless
    road, and no one thinks either of an inspection or of a valuation of the estates, and to speak without
    circumlocution'

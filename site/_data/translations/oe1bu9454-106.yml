segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    The court fiscal Michaelis has communicated to me Your Most Serene Highness''s letter concerning the
    purchase of estates proposed by the Jew Dann. Since, however, the Jew had already been with me before
    the arrival of this gracious letter, I am in a position to reply to Your Most Serene Highness upon
    it at once, in deepest obedience.


    that the said Dann believes he can persuade Mr. von Eckart, who has bought the Lichtenau houses here,
    to enter into a purchase (Empletu) of this kind [uncertain: entvire]. It is therefore an ordinary
    broker''s scheme, trimmed out with Jewish swindling - for the same Jew has laid this and other such
    plans before Prince George no less.'

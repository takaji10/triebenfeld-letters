- page: 3
  en: 'I believe that the ministers here act as sovereigns and would never let the exchange take place,
    unless it were that the monarch commands it — by a trustworthy man I shall report all further particulars
    to Your Serene Highness most humbly.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s — This very moment I receive Your Most Serene Highness''s two gracious
    letters with the enclosures — P''s ill will, of which I shall inform Your Serene Highness by another
    and surer route, shows itself here only too plainly. This very day he receives an extremely civil
    letter which is said to have been enclosed to [uncertain: Wildeganchen] — meanwhile nothing is to
    be gained by this hero, unless it be that Your Most Serene Highness should now concur in everything
    there with the man who recommended him, P — the times are strange now, and in this respect one may
    speak freely from the heart. Your Serene Highness has, as [uncertain: only] Eysenhardt tells me, had
    a fall with the horse — for God''s sake I beg, most gracious Prince and Lord, do take some care of
    yourself — Berlin, the 25th of May


    1799.


    faithful, most humble and obedient servant


    v. Triebenfeld.'

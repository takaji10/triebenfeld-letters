- page: 1
  en: '106


    Most Serene Prince,


    Most gracious Lord!


    The court fiscal Michaelis has communicated to me Your Most Serene Highness''s letter concerning the
    purchase of estates proposed by the Jew Dann. Since, however, the Jew had already been with me before
    the arrival of this gracious letter, I am in a position to reply to Your Most Serene Highness upon
    it at once, in deepest obedience — "that Dann believes he can persuade Mr von Echart, who has bought
    the Lichtenau houses here, to [uncertain: thither] enter into a purchase [uncertain: Empletu] of this
    kind —" It is therefore an ordinary broker''s plan [uncertain: Mecklen], trimmed out with Jewish swindling
    — for the same Jew has laid this and other such plans before Prince George no less.'

segments:
- page: 1
  en: 'We Friedrich Wilhelm, by God''s Grace King of Prussia, do hereby make known and give to be understood,
    that the Pszczew estates in the district of Międzyrzecz have been actually conferred upon the reigning
    Prince Friedrich Ludwig of Hohenlohe-Ingelfingen by His Majesty the late King of most blessed memory,
    through the deed of donation of 10 June 1797 and the declaration thereof by the now reigning Royal
    Majesty of 1 December of the same year; that the settling of the said Prince''s title of possession
    depends only upon the resignation still to be furnished by the Treasury; that these Pszczew estates
    were formerly ecclesiastical estates, namely estates belonging to the bishopric of Poznań; and that
    up to the present no debts have been contracted upon them by the said Prince, and no instruments of
    debt have been submitted for registration; concerning all which We have caused the present attestation
    to be issued hereby to the Prince of Hohenlohe upon his request of this day''s date. In witness whereof,
    under the greater seal of Our South Prussian Government and the customary signature. Given at Poznań,
    9 February 1802. Steudener


    Fest.


    Attestation for the reigning Prince of Hohenlohe-Ingelfingen out of the Pszczew land[illegible] and
    mortgage records.'

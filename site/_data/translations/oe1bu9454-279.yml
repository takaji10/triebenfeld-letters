- page: 2
  en: 'Empress Mar: Lein is said to be much distressed, and truly the poor woman is now to be pitied —
    her household, which still consisted of pure Frenchmen, has at once been dismissed, and pure German
    persons given to her — the cause is not stated — Just now it is said here that Napoleon has after
    all pushed forward as far as Grenoble and that a whole regiment of Frenchmen has already gone over
    to him. Likewise also a regiment of Piedmontese — It would be strange indeed if a man totally despised
    should still find such a following — At this moment a resolution concerning the Polish estates is
    again in hand for me — the [uncertain: E] Chancellor says, one [must] have patience until it be decided
    what will be determined concerning the estates which the Poles took from the grantees (Donatarien)
    after the Peace of Tilsit. It is dreadful how all this drags on — Oh, if only Mr Eberhard could come
    here, so that we might settle the matter with the Curische heirs, then at least the most essential
    thing would have been done — In 14 days the sovereigns intend to depart from here. In deepest reverence
    I remain, until death,


    Your Serene Highness''s


    I lie sick today at Eichen.


    Vienna, the 18th of March


    1815


    most humble and obedient servant


    v Triebenfeld'

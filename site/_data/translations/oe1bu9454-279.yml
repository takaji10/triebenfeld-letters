- page: 2
  en: 'Empress Mar: Lein is said to be very distressed, and truly the poor woman is now to be pitied.
    Her court household, which still consisted of pure Frenchmen, has been dismissed at once, and pure
    German persons given to her — the reason is not stated. — Just now they say here that Napoleon has
    after all pushed forward as far as Grenoble and that a whole regiment of Frenchmen has already gone
    over to him. Likewise also a regiment of Pumonteſer — It would nevertheless be singular if a man totally
    [uncertain: despised] should still find such a following.


    At this moment a resolution concerning the Polish estates is again in the works for me — the State
    Chancellor says one must have patience until it has been decided what is to be determined regarding
    those estates which the Poles took from the donatories after the Peace of Tilsit. It is dreadful how
    all this drags on. Oh, if only 1/2 p Eberhard could come here, so that we might settle the matter
    with the Con- heirs, then at least the most essential thing would have been done. In 14 days the Sovereigns
    intend to depart from here. In deepest reverence I remain, until death,


    Your Serene Highness''s


    I lie sick today in Eichen.


    Vienna, the 18th of March


    1815


    most humble and obedient servant


    von Triebenfeld'

- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    What now still matters is that a real settlement be made with the Curish heiresses. If that indeed
    comes about, the Prince State Chancellor will see to it that the advance is given and the administration
    set in train. I therefore await the arrival of Mr J. C. Eberhardt with the greatest longing — five
    Hohneldte Bartenstein Ge Winzingerode and the good Ghl Rath von Göschel have written to Langenburg
    and Kirchberg etc. — I think that Prince August will probably have demanded the power of attorney
    back. If Cosmar''s breastwork is destroyed, then he stands quite bare, and his ruin is decided, even
    though in that crossed-out codicil God knows what measures of security he may have hedged in for himself.


    from Pourtales an answer has still come in, and therefore B. hopes with the greatest confidence that
    he will soon come himself. The coal matter will yet cause me great sorrow, for the von Kayser is my
    move, and Landskoy is selling everything, and has from there mightily — Amstetten and Zerboni follow
    good examples.


    Of the end of the Congress there is still nothing to be heard; rather the labours on account of the
    Napoleonic affair are piling up greatly, and prevent all other business being taken up. People do
    say the joke will not last long; nevertheless 60000 Frenchmen and 30000 Austrians must march thither
    — the robber is said now to be lurking with his band in the mountains and to be keeping quite still
    there. He had [uncertain: with difficulty] pushed forward as far as Gap on the road to Grenoble towards
    Lyon, but since Count Stuben threatened him in Mükken he withdrew in all haste as far as Castellane
    — and plays at hiding in the mountains. For the rest, he is now declared an outlaw, and since his
    officers or adherents, if they do not return within 8 days, are to share the same fate with him, it
    is believed that his own people will seize him and hand him over.


    At bottom some cunning head must after all have led the poor fool onto the ice — for he received on
    Elba the most certain intelligence that the Congress had broken up and that all the Sovereigns had
    parted on the 13th of February in the greatest bitterness, and that one had at once declared war on
    the other. — The good'

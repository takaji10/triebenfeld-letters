status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! What now still matters is that a genuine settlement
    be made with the Curian heiresses. If it does indeed come about, the Prince State Chancellor will
    see to it that the advance is given and the administration set in train. I therefore await the arrival
    of Herr J. C. Eberhardt with the greatest longing — five Hohneldte, Bartenstein, Ge Winzingerode and
    the good Privy Councillor v. Göschel have written to Langenburg and Kirchberg etc. — I think that
    Prince August will surely have demanded the power of attorney back. — [uncertain: If] this breastwork
    of Cosmar''s be destroyed, then he stands quite bare, and his ruin is decided, even if in that crossed-through
    codicil he, God knows, may have secured what measures of safety for himself. From von Pourtales an
    answer has still come in, and therefore B. hopes with the greatest confidence that he will soon come
    himself. The kohl affair will yet cause me great grief, for the v. Kayser is my [uncertain: pull/train],
    and Landskoy is selling everything, and has from that quarter mightily — Amstetten and Zerboni follow
    good examples. Of the end of the Congress nothing is yet to be heard; rather the labours on account
    of the Napoleonic business are piling up greatly, and hinder the taking up of all other affairs. It
    is indeed said that the jest will not last long, yet 60000 Frenchmen and 30000 Austrians must march
    thither — the robber is said now to be lurking with his band in the mountains and to be lying quite
    quiet there. He had pressed forward [uncertain: with difficulty] as far as Gap on the road towards
    Grenoble to Lyon, but since Count Stuben threatened him at Mükken he withdrew in all haste as far
    as Castellane — and plays at hide-and-seek in the mountains. For the rest, he is now declared outlaw,
    and since his officers or adherents, if they do not return within 8 days, are to share the same fate
    with him, it is believed that his own people will seize him and deliver him up. At bottom some cunning
    head must have led the poor fool onto the ice — for he received on Elba the most certain intelligence
    that the Congress had broken up and that all the sovereigns had parted on the 13th of February in
    the greatest bitterness, and that one had at once declared war upon the other. — The good'
- page: 2
  en: 'Empress Mar[ie] Louise is said to be greatly distressed, and truly the poor woman is now to be
    pitied. Her household, which still consisted of pure Frenchmen, has at once been dismissed, and pure
    German people given her — the cause is not stated. — Just now it is said here that Napoleon has after
    all pressed forward as far as Grenoble and that a whole regiment of Frenchmen has already gone over
    to him. Likewise also a regiment of Piedmontese — Strange it would be indeed if a man wholly [uncertain:
    esteemed/despised] should still find such a following. At the moment a resolution concerning the Polish
    estates is again in preparation for me — the State Chancellor says one must have patience until it
    be decided what is to be determined concerning the estates which the Poles took from the donataries
    after the Peace of Tilsit. It is dreadful how all this drags on. Oh, if only [uncertain: 1/2] p. Eberhard
    could come here, so that we might settle the matter with the Con- heirs, then at least the most essential
    thing would have been done. In 14 days the sovereigns mean to depart from here. In deepest reverence
    I remain, until death, Your Serene Highness''s — I lie sick today in [uncertain: Eichen]. Vienna,
    the 18th of March 1815, most humble and obedient servant v. Triebenfeld'

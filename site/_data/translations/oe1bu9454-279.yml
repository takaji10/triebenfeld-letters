  en: '279


    Most Serene Prince


    Most gracious Prince and Lord!


    What now still matters is that a real settlement be made with the Curische heiresses. If that comes
    about, the Prince State Chancellor will see to it that the advance is given and the administration
    set on foot. I therefore look forward to the arrival of the councillor of justice Eberhard with the
    greatest longing — the Prince of Hohenlohe, Bartenstein, Count Winzingerode and the good Privy Councillor
    von Göschel have written to Langenburg and Kirchberg etc. — I think that Prince August will indeed
    have demanded the power of attorney back — If[?] this breastwork of Cosmar''s is destroyed, then he
    stands quite exposed, and his ruin is settled, even though in that crossed-out codicil he, God knows,
    may have chosen what measures of security for himself — from Pourtalès there has still come in at
    the [uncertain: beim] answer, and therefore B[arbe]. hopes with the greatest confidence that he will
    soon come himself — The kohl matter will yet cause me great sorrow, for the R Emperor [uncertain:
    eniffer]withdrawal, and Lanskoy sells everything, and has from there mightily — Amstetten and Zerboni
    follow good examples — Of the end of the Congress nothing is yet to be heard; rather the labours on
    account of the Napoleonic affair are piling up greatly, and hinder the taking up of all other business.
    It is indeed said that the jest will not last long; nevertheless 60,000 Frenchmen and 30,000 Austrians
    must march thither — the robber is said now to be lurking with his band in the mountains and to be
    quite quiet there. He had [uncertain: ſchwe] pushed forward as far as Gap on the road towards Grenoble,
    towards Lyon, but since Count Bubna threatened him in the rear he withdrew in all haste as far as
    Castellane — and plays at dissembling in the mountains — For the rest he is now declared an outlaw,
    and since his officers or adherents, if they do not return within 8 days, are to share the same fate
    with him, it is believed that his own people will seize him and deliver him up.


    At bottom some crafty head must after all have led the poor fool onto the ice — for he received on
    Elba the most certain intelligence that the Congress had broken up and that all the sovereigns had
    parted from one another on the 13th of February in the highest bitterness, and that one had at once
    declared war upon the other — The good'

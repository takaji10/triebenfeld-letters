- page: 1
  en: '49


    Most Serene Prince


    Most gracious Prince and Lord. How glad I was when it was reported to me that a messenger had arrived
    from Your Serene Highness''s house, but how thunderstruck I stood when I saw not a line from Your
    Serene Highness, and still less an answer to the letter I had sent to Your Serene Highness — I am
    still under arrest here and may not depart before I have sent off from here the 600 Centner of iron,
    in accordance with the word of honour I gave, and have the release from the justice-burgomaster Schenck
    of Neufallen[uncertain: Neufallen].


    I also long so heartily to lay myself personally at Your Most Serene Highness''s feet. But I may not
    stir from the spot. If it is in any way possible for Your Serene Highness in the world, do send me
    the iron as soon as it can be done, and if the old ones will have my sorrow, then send the thousand
    Centner before full, whereby Michaelis, Lahr and all the Berlin costs are satisfied. But I beg most
    heartily that the iron be sent directly here to Bojadła, to my administrator Neumann, for I may not
    leave until the iron has been handed over here to the justice-burgomaster Schenck, and who would arrange
    the transport hither for me. Let me not, this once, make a request in vain, Your Serene Highness,
    and rescue me speedily; then I am, to my last breath, wholly at Your most high commands, and by God
    I shall do it well. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    It is said that a Russian corps is to be able to stand on the Polish and Silesian frontier — would
    to God this were so! Konotop


    the 20th of March


    1809.


    faithful, humble and obedient servant


    v Triebenfeld


    Van der Lahr wishes that he [may have?] only rails, that is to say in bundles of 6-8 rail[text lost]
    in bundles of half a Centner — have mercy, Your Serene Highness, and let such a sort be sent me to
    the amount of 400 Centner'

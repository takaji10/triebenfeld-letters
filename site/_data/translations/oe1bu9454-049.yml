segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! How glad I was when it was reported to me that
    a messenger had arrived from Your Serene Highness''s house; but how cast down I stood when I saw not
    a line from Your Serene Highness, and still less an answer to the letter I had sent to Your Serene
    Highness. I am still under arrest here without cease, and may not get away any sooner than when I
    have despatched from here the 600 Centner of iron, in accordance with the word of honour given by
    me, and have the release from the justice-burgomaster Scheu of Neufall. I also yearn so heartily to
    lay myself personally at Your Most Serene Highness''s feet. But I dare not stir from the spot. If
    it be in any way possible for Your Serene Highness in this world, then [uncertain: schulm — reading
    doubtful] me the iron as soon as it can be; and if the old ones would have my sorrow, then send the
    thousand Centner in full: with that, Michaelis Lahr and all the Berlin costs are satisfied. But I
    beg most heartily that the iron be sent directly here to Bogadel, to my administrator Neumann, for
    I dare not leave until the iron has been handed over here to the justice-burgomaster [uncertain: Schenck
    — elsewhere on this page the same office is named Scheu]; and who else would arrange the transport
    hither for me? Let me by no means make a vain petition this time, Your Serene Highness, and rescue
    me speedily; then I am, to my last breath, wholly at Your Highest commands, and by God I shall do
    it well. In deepest reverence I remain, until death, faithful humble and obedient servant. It is said
    that a Russian corps is to be able to stand on the Po[lish] and Silesian frontier — would to God this
    were so! Your Most Serene Highness''s v Triebenfeld. Kontop, the 20th of March 1809.'

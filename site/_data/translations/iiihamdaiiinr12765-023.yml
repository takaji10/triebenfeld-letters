segments:
- page: 1
  en: 'To the High Royal Prussian Ministry of Foreign Affairs I submit, in answer to the resolution of
    the 29th of last month communicated to me, a legally binding judgment of the former South Prussian
    government at Kalisz etc., published the 24th of May 1806, by which the Prince of Hohenlohe-Ingelfingen
    was condemned to pay the capital of 5000 Rthl together with interest; and I prove my title, by the
    will of my late brother the Major von Seehausen appended in copy, as his sole universal heiress and
    present owner of this capital. This will shows at the same time that a great part of this capital
    is designated for legacies; the legatees are just as needy as I am, and I therefore venture with confidence
    the most obedient request that


    the High Ministry may be pleased most graciously to intercede in the matter of the capital together
    with interest. Sommerfeld, the 25th of July 1816. The widow of Colonel von Brehmer


    [Written by the receiving office:]


    Councillor of Legation Balan No 360. B. received 2 August 1816


    The petitioner


    is to be made acquainted with


    what to [uncertain: thee]


    royal out


    ship under


    the 22 June


    [uncertain: were succumbed]


    is to be made


    known, and


    the to [uncertain: röhen]


    that according to


    the situation of


    the circumstances


    nothing more


    can be done


    [uncertain: tione] B[erlin]. 3 Aug [18]16. B[alan].'

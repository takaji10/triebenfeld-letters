- page: 13
  en: 'But if I thus credit these


    10,000 rthlr. to the opponents'' sub-purchasers, and thereby prevent their being fraudulently deprived
    of what is theirs, it is clear that I do not hold them as an object of security for the latter, and
    can never restore them to them. Moreover I have claimed these 10,000. rthlr. under


    §. 5. of the hereditary lease contract as a forfeited conventional penalty, and this point too is
    litispendent in the principal suit.


    bb, the second case of the alternative, that the contract should stand and be declared valid, is not
    conceivable at all, and is really a casus non dabilis, since on the one part the clausula cassatoria
    of §. 5. takes effect, because the opponents have not paid the second half of the entry money nor
    deposited it, and on the other part the Chamber''s consent is refused, and according to the most recent
    statutory provisions must be refused.


    cc, As concerns finally the unsettledness of the opponents, again assumed by the reporting councillor,
    this supposition rests quite evidently upon a manifest confusion of the legal conceptions of natural
    and civil possession, and'
  numbers:
  - 10,000
  - 10,000

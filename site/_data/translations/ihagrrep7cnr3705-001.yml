- page: 2
  en: 'whose lawfulness I am as entirely convinced as the damage is great and irreparable which is being
    inflicted merely by the hitherto refusal of the said government to grant my petition.


    The matter has the following connexion, conformable to the truth and to the contents of the files.


    On the 22nd of February of last year I concluded, with three persons of the common burgher estate,
    by the names of Giese, Bagans and Gietzinger, respecting the estate of Oleśnica belonging to my lordship
    of Trąbczyn and Zagórów situated in South Prussia, the hereditary lease contract appended here in
    copy (A), according to the contents of which /§. 4./ the hereditary lessees bound themselves to pay
    an entry money of 20000 rthr. in two equal instalments of 10000 rthlr:, and, besides the discharge
    of all sovereign dues and public burdens, /§. 7./ also an annual hereditary lease rent of 2000. rthtr;
    likewise in two equal instalments; and at the same time acknowledged the condition that if the payments
    of the entry money should not follow in the manner appointed, the contract should be null and void,
    and that over and above a conventional penalty of 10000. rthlr. should take place. The hereditary
    lessees were also indeed granted permission to sub-let the estate held in hereditary lease again in
    hereditary sub-lease and to dismember it, /§. 10./ yet I reserved to myself that the hereditary sub-lease
    contracts should not be concluded without my special consent, and that all entry monies of the hereditary
    sub-lessees should be paid to me directly,'

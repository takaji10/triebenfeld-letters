- page: 5
  en: 'nay, they have even presumed to give themselves out publicly as hereditary lords of the estate
    of Oleśnica, and in the record (D) of the 6th of August to slander me in the most shameful manner,
    as though I caused them to be evicted arbitrarily and to be treated with violence, although the judicial
    attestation of the (E) 12th of August of this year proves that this calumnious allegation is an impudent
    and punishable lie. It could not be a matter of indifference to me that not only all the revenues
    of my considerable estate were withheld from me without any right whatever, and its appurtenances
    arbitrarily alienated, deteriorated and devastated; it must also have vexed me sensibly that I was
    moreover to bear all the current burdens and dues and to pay them out of my own means. This determined
    me to petition Your Royal Majesty''s government at Kalisz for the sequestration of this estate in
    two representations, which, together with the (F) (G) (H) resolutions received thereupon, I append
    in copy, and herewith once more solemnly assure that all the factual assertions contained in the submissions
    are conformable to the contents of the files.


    I cannot conceive that those dismissive resolutions are conformable to the laws, because from them
    would follow the impossibility of restraining an insecure hereditary lessee who finds himself without
    any right whatever in the natural possession of an estate, and institutes prolix and vexatious suits
    against the proprietor, but pays nothing in rent and dues, from, during the'
  names:

- page: 7
  en: 'requisite.


    As to b. and c., however, it remains an inward and irreconcilable contradiction when the government
    assumes that the opponents, upon the ground of an imperfect contract which is null and void ex clausula
    cassatoria, and has moreover been declared by the Chamber authority, by virtue of a special law, to
    be absolutely invalid, should nevertheless, and although no titulus possessionis has been entered
    for them, and chiefly also no purchase money and no entry money has been paid by them out of their
    own means, be so far possessed as that they must be held in the legal sense to be settled, and on
    account of their settledness to be secure. Upon this I refer myself simply to the contents of my representation
    of the 12th of August of this year.


    II. Equally insufficient are the grounds in the resolution of the


    20th of August of this year. For


    1.) it is an altogether incorrect exposition of §. 204., Title


    21., Part I, of the General Law Code, when the reporting councillor assumes that sequestration according
    to this statutory provision could find application in respect of the arrears of hereditary rent only
    if such were acknowledged'
  numbers:
  - '12'
  - '20'
  - '204'
  - '21'
- page: 8
  en: 'by the hereditary lessee as undisputed. In such a case execution takes place, and sequestration
    may indeed also be ordered in via executionis secund: §. 116., Title 24., Part 1, of the General Court
    Ordinance. But also "for the security of the hereditary lessor" sequestration is, according to the
    clear determination of the law, to be ordered in via arresti, and it goes without saying that in that
    case only those general principles can be applied which obtain in cases of attachment generally; wherefore
    it is sufficient if the claims are only in some measure attested, grounds of the insecurity of the
    party attached are adduced, and securities are furnished by the party attaching.


    2.) As incorrect as this interpretation of the law is in itself, just as contrary to the files is
    the assertion that no liquid arrear of hereditary rent exists. The opponents, in that suit which concerns
    the first arrear of the 1000. rt., and which was instructed and decided before my patrimonial court,
    have unconditionally'
  numbers:
  - '116'
  - '24'
  - '1'
  - '1000'
- page: 9
  en: 'admitted the correctness of this arrear; the matter has, but for a small error in the formalities
    of the citation, really been dealt with in an executive process, and in the first instance judgment
    was given against the opponents for payment of the arrears of hereditary lease rent of the 1000. rthlr.,
    because, as the ipsa verba of the sentence run: "they had simpliciter acknowledged their obligation
    to pay; their objections, however, being exceptiones ulterioris indaginis, belonged in part to the
    principal suit concerning the annulment of the hereditary lease contract, and in part must be referred
    ad separatum — ". The opponents were also expressly informed in the publication record of this sentence
    of the 2nd of March of this year that the appeal at once lodged by them against it had only effectum
    devolutivum, and that execution must nevertheless be ordered. In my most obedient judgment, execution
    upon these 1000 rt., which I repeatedly moved for, ought therefore to have been ordered and carried
    out; but even if regard is to be had to the in themselves wholly immaterial errors in the formularies
    of the citations, and the matter is therefore to be considered as having been dealt with only in processu
    ordinario, still so much is beyond doubt certain, that by a condemna-'
  numbers:
  - '1000'
  - '1000'
  - '2'
- page: 10
  en: 'tory judgment, even if not yet in legal force, which is grounded upon an acknowledgment of the
    debt made simpliciter on the part of the defendant, the claim itself is at least so far sufficiently
    attested as the laws require in the case of a petition for attachment.


    All the objections which the opponents have opposed to their obligation to pay, in the appellate stage
    of this suit and in the first instance of the second suit pending concerning the other arrear of hereditary
    rent, consist in the assertion that they had not received the contractual number of Morgen of the
    area of 3338. Morgen 14. rods, and that the Chamber''s consent had not been procured by me. Both exceptions
    are in themselves immaterial, and moreover false; for I have already shown the correctness of the
    area by attestations of the sworn surveyor who measured it, and have already remarked above that the
    Chamber''s consent, repeatedly applied for by me, was refused'
  numbers:
  - '3338'
  - '14'
- page: 11
  en: 'upon the ground of the more recent statutory ordinance in the Cabinet Order of the 10th of April
    of this year. In general all this belongs to the principal suit concerning the annulment of the contract.
    The hereditary rent is paid for the use of the estate and the collection of its continuing revenues
    /: General Law Code, Part


    1., Title 21., §. 187. 190. /; the opponents are in possession and enjoyment of all the estate''s
    revenues, and must therefore also pay the continuing canon until it is decided upon the nullity of
    the contract, or in the worst case at least deposit it. But even the deposit has not been made, although
    I have expressly had them called upon to do so, and it lies quite plainly at day that the opponents
    can as little pay as they will.


    3.) The opponents are indeed highly insecure, and the alternative set up in the resolution is neither
    conformable to the files nor logically correct. aa, It is contrary to the files that the opponents
    had paid the first half of the entry monies with 10000. rthlr. out of their own fortune, and that
    I am bound to repay them this sum if the hereditary lease contract were annulled. But I have already
    mentioned that this payment was discharged out of the'

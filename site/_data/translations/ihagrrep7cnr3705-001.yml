- page: 3
  en: 'in return for which I undertook to procure the requisite approbation of Your Royal Majesty''s War
    and Domains Chamber to this contract.


    Upon the ground of this contract the estate itself was now handed over to the said hereditary lessees
    naturaliter, though without any particular proceedings of delivery of possession, and the area of
    3338. Morgen 14. rods Magdeburg measure, which had previously been exactly surveyed and revised by
    three sworn surveyors, Winitzki, Chwalowski and Cabanis, was assigned to them. After they had in this
    manner been placed in the full natural possession, they sub-let in hereditary sub-lease and dismembered
    a great part of the estate to the sub-lessees named in the annexed specification (B), and out of these
    monies, already levied contrary to the contract and payable directly to myself, they paid me the first
    half of the entry money with 10000 rthll:, and they also discharged successively the first year''s
    lease rent. With the second half of the entry money, however, they remained in arrear, and in the
    second year they paid neither the hereditary lease rent nor the sovereign dues, which were thereupon
    levied from myself by execution by Your Royal Majesty''s War and Domains Chamber to the amount of
    431 rt;


    17. gl. 11. pf. and 17 rt. 21. gg. I also received from the said Chamber, upon my petition for the
    confirmation of the hereditary lease contract, the resolution that such could by no means take place,
    in conformity with the statutory provision published after the conclusion thereof in Your Royal Majesty''s
    own most high'

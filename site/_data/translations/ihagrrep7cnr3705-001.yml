- page: 1
  en: 'Most Serene and Most Mighty King, Most Gracious King and Lord! The reigning Prince of Hohenlohe-Öhringen
    and Ingelfingen, as manorial lordship (Dominium) of the lordships of Trąbczyn and Zagórów, most obediently
    prays that the government at Kalisz be most graciously commanded, in his suit against the so-called
    hereditary lessees Giese, Bagans and Gietzinger, to sequester his estate of Oleśnica.


    Your Royal Majesty''s government at Kalisz compels me to lay a petition before Your Most High Self,
    of'

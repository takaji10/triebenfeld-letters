  - '10000'
- page: 12
  en: sum of 11089 rt. 8. gg. levied by them from their sub-purchasers contrary to the contract and payable
    directly to myself. All the contracts which the opponents concluded with the sub-purchasers, and upon
    which they levied those 11089. rthlr. 8. ggl., were concluded without my consent, expressly reserved
    to me in §. 10., and are for me so far not binding that I am not bound to acknowledge the payments
    made by the sub-purchasers to the opponents. If I chose to make use of this right, all the sub-purchasers,
    who for the most part have no other fortune than the entry money paid in, would in the most irresponsible
    manner lose what is theirs and be brought to the beggar's staff. This I would never allow, and I have
    already declared ad Acta that I reserve to myself to credit these 10000. rthlr. 8 ggl. to the poor
    sub-purchasers so shamefully deceived by the opponents, pro rata of their payments, and to depart
    from the rigour of my right. Your Royal Majesty will certainly regard this declaration of mine as
    in the highest degree lawful, equitable and worthy of my person.

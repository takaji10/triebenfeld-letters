- page: 6
  en: 'course of these suits, using the estate itself, alienating it, laying it waste, and inflicting
    irreparable damage on the proprietor. Such a means most assuredly exists in the form of process introduced
    by Your Royal Majesty with such infinite wisdom, and according to the opinion of all persons learned
    in the law, in every case where the possession and use of an immovable estate, or of a living movable
    thing, is in dispute, the mutual right of the parties must be secured by sequestration. The grounds
    which Your Royal Majesty''s government at Kalisz has adduced against this universally valid principle
    can convince me the less, as they already of themselves stand in contradiction with the principles
    of the legislature. For as concerns


    I. the resolution of the 13th of August of this year, it is


    a.) contra jus in thesi that sequestration is merely an executive and not also a means of security,
    since the General Law Code, Part I, Title


    15. §. 103-105., Title 18. §. 344., Title 21. §. 140. and 244., expressly determines that sequestration
    shall be ordered in all cases where the possession, the detention, the administration and the use
    of an immovable or living movable thing is in dispute, and at the same time danger and insecurity
    for the contending parties is present; and consequently, under the like legal modalities, in the case
    of movable inanimate things, judicial deposit is'

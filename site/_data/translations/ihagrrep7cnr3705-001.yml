- page: 4
  en: 'Cabinet Order of /: in Hoff and Mathies''s juristic monthly, vol. II, p. 103. /. In this posture
    of the matter nothing else remained to me but to proceed by suit against the said hereditary lessees,
    and my then attorney, Criminal-court Councillor Mondro, thought it expedient to institute three separate
    suits on that account, in which, upon the ground of the clausula cassatoria contained in


    §. 4., he moved for the annulment of the contract and demanded the current hereditary lease rent for
    two terms. In what posture these three suits at present stand, Your Royal Majesty will be pleased
    to see at large from the appended copy of my representation to the government at Kalisz of the 12th
    of August of this year.


    (C) Now while these suits pursue their course, the hereditary lessees have not only made use of all
    the revenues of the estate, but have also not ceased to alienate single parts of the same, and to
    collect the entry money coming in for them from the sub-lessees, as well as the current rent, without
    paying the least thing to me, and without so much as discharging the sovereign dues and onera publica.
    They have also fallen into gross and violent disputes with their sub-purchasers, whom they have deceived
    in manifold ways,'

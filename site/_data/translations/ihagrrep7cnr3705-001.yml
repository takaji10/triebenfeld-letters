  - '5'
- page: 14
  en: the counter-representation contained in my submission of the 12th of August has not been taken into
    consideration at all. I am utterly unable to see how anyone is implicitly placed in civil possession
    by delivery and the yielding up of natural possession; I do not comprehend how anyone for whom no
    titulus possessionis is entered in the mortgage book, and who, because his contract remains void,
    can only be so entered, should be an estate possessor in the legal sense —; it remains inexplicable
    to me how I am supposed to have conceded civil possession to the opponents by having demanded of them
    the current hereditary lease rent for the enjoyment of the natural possession, until such time as
    the contract is annulled and the ejectment of the opponents realised —; and I absolutely do not understand
    how anyone can be held to be possessed, settled and secure who finds himself sine titulo et jure in
    the natural possession of an estate for which he has yet paid nothing at all out of his own means.
    Most Gracious King and Lord! Never would I trouble Your Most High Self with this prolix petition,
    in a
  numbers:
  - '12'
- page: 15
  en: matter unhappily very confused, were I not quite properly compelled to it. I have absolutely no
    other purpose than to be secured against the manifest and wholly irreparable injuries of the opponents,
    who continue to alienate and lay waste my estate, while I must effect the discharge of all burdens
    and dues without receiving any income or revenue of the estate whatever. If there is another lawful
    means of securing myself than sequestration, I will gladly submit to it. But the jurists with whom
    I have conferred on the matter assure me that no other means exists, and therefore I must persist
    in my petition for sequestration. I desire nothing further than that the estate revenues which the
    sequestrator shall collect be paid ad depositum judiciale, and I have even offered to furnish security
    for the sequestrator proposed, or for another solid one. In my judgment all conceivable scruples are
    thereby entirely removed, and I must most humbly beg that the whole of the files be called in from
    the government at Kalisz,
  names:
  - de: Kalisch
    en: Kalisz
    kind: place
- page: 16
  en: 'and that thereupon sequestration be graciously ordered, and its immediate realisation commanded
    to the government upon remission of the


    files.


    It is not unknown to me that ordinarily only a report is required in such cases as this; but I expressly
    beg for the calling in of the files, because a mere report would not turn out so complete, and would
    in no case so thoroughly demonstrate the perfect lawfulness of my petition for sequestration, as if
    — for which I most respectfully beg — Your Royal Majesty would be pleased to have the same laid before
    Your Most High Self in comparison with the court files.


    The principal suit is being instructed at length; the taking of evidence on the spot and with the
    calling in of sworn experts will be hard to avoid, and it is only too certain that, since the matter
    has been introduced merely in processu ordinario, for at least two years yet there can be no thought
    of a judgment and of an'
- page: 17
  en: 'execution grounded upon it. So much the more must I be intent upon the hastening of my being secured,
    and I therefore hold myself convinced that I may look forward to a favourable resolution with that
    confidence and reverence with which I remain Your Royal Majesty''s Wrocław


    the 18th of September


    1805.


    most humbly and most faithfully obedient


    v. Triebenfeld, as general plenipotentiary'

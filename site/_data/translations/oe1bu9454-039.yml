segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    This very moment I return from IV., where I have settled everything as desired. But scarcely had I
    arrived than I am welcomed again at once with execution on account of the 3000 Rthl that have fallen
    due; for when in February I saved myself from arrest by the French by surrendering the same toward
    payment of the [uncertain: Zewalden] fund, I was obliged to take up other monies here in order to
    pay the inn over that period, to settle the costs, and to have travelling money.


    It was 6125 Rthl that had to be settled; 3000 Rthl Your Serene Highness has ordered paid. There remains
    therefore a balance of 3125 Rthl — Where am I to find this here? From Zagorowo nothing yet comes in.
    More effectual means will surely have to be taken up and the strictest execution sought from the French
    authority. Within the space of 7 days I shall receive the definite instruction as to where I am now
    to go; presumably I must first make a journey to §:, and when I return to Königs: tomorrow I shall
    look here for a couple of sureties who will stand good for me for 14 days or 3 weeks, so that I am
    not hindered in the commissions laid upon me. In the meantime may Your Serene Highness have mercy
    and find means there and send here another 3000, or at least 2000 Rthl, so that I may travel to Königl.
    free and unhindered. To raise money here is a thing of impossibility, and means must be found, for
    otherwise they will not let me depart. I beseech Your Serene Highness imploringly, rescue me and send
    here an instruction to pay, if not for 3125 Rthl, then at least for 2000 Rthl. Since in the meantime
    I may be engaged upon the journey to [text lost], be pleased to address your letters still to the
    justice commissioner here, Herr Empuch.


    The great loan Your Serene Highness will not forget. — I am making provision from another quarter
    — More by the next post — In deepest reverence I remain, until death, Your Serene Highness''s


    faithful, most humble and obedient servant


    Berlin, the 2nd of July 1808


    v. Triebenfeld'

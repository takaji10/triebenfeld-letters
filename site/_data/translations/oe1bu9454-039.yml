- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! This very moment I return from IV., where I
    have settled everything as desired. But scarcely had I arrived when I am welcomed again at once with
    execution on account of the 3000 Rthl that have fallen due; for if in February I saved myself from
    arrest by the French by surrendering the same toward payment of the [uncertain: Zewalden] fund, then
    I was obliged to take up other monies here in order to pay the inn for the time, to settle the costs,
    and to have travelling money. It was 6125 Rthl that had to be settled; 3000 Rthl Your Serene Highness
    has ordered to be paid. There remains, then, a residue of 3125 Rthl. — Whence am I to take this here?
    From Zagorowo nothing whatever comes in as yet. More effectual measures will doubtless have to be
    seized upon, and the strictest execution applied for with the French authority. Within the space of
    7 days I shall receive the definite instruction as to where I am now to go; presumably I must first
    of all make a journey to §:, and when I return to König: Morgen I shall look here for a couple of
    sureties who will stand good for me for 14 days or 3 weeks, so that I may not be hindered in the commissions
    laid upon me. In the meantime let Your Serene Highness have compassion and find means yonder, and
    send hither still 3000, or at the least 2000 Rthl, so that I may travel free and unhindered to Königl.
    To raise money here is a thing of impossibility, and means must be found; for otherwise they will
    not let me depart. I beseech Your Serene Highness imploringly, rescue me and send here an order to
    pay, if not for 3125 Rthl, then at least for 2000 Rthl. Since in the meanwhile I may be engaged upon
    the journey to [text lost], be pleased to address your letters still to the Justice Commissary here,
    Herr Empuch. The great loan Your Serene Highness will not forget. — I am taking care from another
    side — By the next post, more — In deepest reverence I remain, until death, Your Serene Highness''s
    faithful and most humble and obedient servant Berlin, the 2nd of July 1808 v Triebenfeld'

    Most Serene Prince


    Most gracious Prince and Lord!


    This very moment I return from W:, where I have settled everything as desired. But came, however,
    I have arrived, and already one welcomes me also also once more with execution on account of the 3,000
    Rthl that have fallen due. For when in February I saved myself from the arrest of the French by giving
    the same up for the payment of the Zewalden [uncertain: fund], I was obliged to take up other moneys
    here in order to pay at the inn through the time, to settle the costs, and to have travelling money.


    6,125 Rthl it was that had to be settled; 3,000 Rthl Your Serene Highness has ordered paid. There
    remains, then, a balance of 3,125 Rthl — Where am I to get this here? From Zagórów nothing yet comes
    in. More effectual means will doubtless have to be adopted, and the strictest execution sought from
    the French authority. Within the space of 7 days I shall receive the definite instruction as to where
    I am now to go; presumably I must first of all make a journey to §:, and when I return to König:,
    tomorrow I shall seek out here a couple of guarantors who will stand good for me for 14 days or 3
    weeks, so that I may not be hindered in the commissions laid upon me. In the meantime may Your Serene
    Highness have mercy and find a remedy there, and send here another 3,000, at least 2,000 Rthl, so
    that I may travel freely and unhindered to Königl. To raise money here is a thing of impossibility,
    and a remedy must be found, for otherwise they will not let me depart. I beseech Your Serene Highness
    most imploringly, rescue me and send here an order to pay, if not for 3,125 Rthl, then at least for
    2,000 Rthl. Since in the meanwhile I may in the course of that time be engaged upon the journey to
    P[illegible], be pleased to address your letters still to the justice-commissioner here, Mr Empich.


    The great loan Your Serene Highness will not forget. — I am providing from another quarter — More
    by the next post — In deepest reverence I remain, until death, Your Serene Highness''s


    Berlin, the 2nd of July


    1808


    most faithful and humble and obedient servant


    v Triebenfeld'

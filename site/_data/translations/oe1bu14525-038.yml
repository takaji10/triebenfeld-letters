segments:
- page: 1
  en: 'Your Honour!


    Particularly Highly Honoured Sir, Councillor of Building and Economy!


    For the resignation of the Betsche estates, the Chamber fiscal has once again failed to appear at
    today''s hearing, because he has as yet received no authorisation from the Chamber. I have indeed
    once more requested that a new hearing be appointed, but the matter will never come to an end unless
    the Chamber at last gives the fiscal a properly drawn instruction that he is to resign, and what he
    is to resign. If His Most Serene Highness might be pleased to approach the Chamber President von Harlem
    for an expediting of the business, we should surely at some point attain our object.


    I have the honour to be, with the most perfect [uncertain: esteem],


    Your Honour''s most devoted servant


    Posen, the 25th of January 1802


    Melzer.


    Turn over'

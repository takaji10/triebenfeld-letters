- page: 2
  en: 'At this very moment I receive the appellate judgment in the matter with the Cathedral Chapter and
    Kruhtswitz, which Mr Riedel had conducted in the first instance. It has come out as a reversal, and
    the Cathedral Chapter has been dismissed with its [uncertain: Ferdicus]. On our si [text lost] therefore
    be very well satisfied with the judgment. I have[?], the enclosed [illegible] judgment thus to for
    ward M[?]'

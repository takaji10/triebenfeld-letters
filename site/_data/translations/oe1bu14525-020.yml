segments:
- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our gracious greeting first of all. Honourable
    Councillor, dear and faithful subject: For the settling of the title of possession in respect of the
    estates Drzewce, Kopojno, Swięcia and Zagórów, We are pleased, in accordance with your petition of
    the 8th of this month, to grant to your principal, His Lordship the Prince of Hohenlohe-Ingelfingen,
    the requested term of grace, yet for all purposes (pro omni) only until the last day of October of
    the current year, which is hereby made known to you in place of a resolution; and We remain graciously
    disposed towards you. Given at Kalisz, the 30th of September 1800.


    Royal South Prussian Government. Meuser[uncertain: Meuser]


    To the princely Hohenlohe Building and Economy Councillor Glenck at Wrocław.'

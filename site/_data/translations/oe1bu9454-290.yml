- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    After 7 months the order is now at last given that Cosmar shall pay in, with the very greatest despatch,
    to the Brieg High Provincial Court the 3 years'' monies he has been holding back, which Your Serene
    Highness is to draw annually, and out of which you have assigned 12000 Rthl yearly in favour of your
    creditors — he is at the same time instructed to keep order and to render prompt account. That Stägemann
    has the worst will shows itself at every turn; he now plays the defender of Cosmar and the counsellor
    of the Curian heiresses. The Prince Chancellor, on the other hand, promises everything — but reads,
    sees and hears nothing further once he has promised it. Minister Stein, by contrast, works honestly
    and is at pains to procure for Your Serene Highness the proposed compensation by way of the office
    of Sokolnick. He has already drawn the Chancellor into the game, so that the two of them may lay the
    matter before the Emperor together. Tomorrow I shall submit to the Prince again a somewhat more emphatic
    memorandum concerning the [uncertain: kurz] affair as well as concerning your military salary — I
    shall carry the matters through, even were I obliged to follow him as far as the Rhine. It must once
    for all be brought clear. Tomorrow morning I have a conference with Stägemann, and consequently more
    on Tuesday. This very moment I receive Your Serene Highness''s letter of the 9th; upon that too I
    shall write by the next post. In reverence I remain Your Serene Highness''s


    As Colonel von T. tells me, Adolph conducted himself


    very awkwardly indeed before the King. The King asked him what his father was doing, how he was; the
    answer was — I do not know, I have not seen him for a long time. turn over [text lost] Vienna, the
    20th of May 1815 — most obedient, the von Triebenfeld'

- page: 2
  en: 'Both I and Barbe and Beguelin had instructed him what he should say — He could have done much for
    his father at that moment. In short, your sons will do [uncertain: never take after] Wilhelm von Humboldt
    and also Nesselrode wished to present him to their monarch; he was not to be brought to it, and hurried
    away from there — Countess Fries and several others say that not a drop of his father''s blood [uncertain:
    runs] in him — Do send me the 100 #, for I [uncertain: do not know] whether in this matter I must
    not go at once to Berlin as well — and here I still have much to pay. I have begged that it be sent
    by express courier. It would be very [uncertain: bad] if You did not do so.'

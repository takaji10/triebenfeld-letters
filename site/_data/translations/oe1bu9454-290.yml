segments:
- page: 1
  en: '290


    Most Serene Prince


    Gracious Lord!


    After 7 months the order is now at last given that Cosmar shall pay in, with the utmost despatch,
    to the Wrocław [uncertain: Brzeg] Higher Provincial Court the 3 years'' monies he has behind [uncertain:
    behind] him, which Your Serene Highness is to draw annually, and of which You have assigned 12/m rt
    yearly in favour of Your creditors — He is at the same time instructed to keep order and to render
    prompt account — That Stägemann bears the worst will is shown at every turn; he now plays the defender
    of Cosmar and the adviser of the Curish heiresses — The Prince Chancellor, on the other hand, promises
    everything — but reads, sees and hears nothing further of it once he has promised it — Minister Stein,
    by contrast, works honestly and takes care to procure for Your Serene Highness the proposed compensation
    by way of the office of Sokolnik. He has already drawn the Chancellor into the affair, so that the
    two of them may lay the matter before the Emperor together — Tomorrow I shall again submit to the
    Prince a somewhat forceful memorandum concerning the Curish affair, as well as concerning Your military
    salary — I shall push these matters through, even should I have to follow him as far as the Rhine
    — It must once for all be brought to clarity — Tomorrow morning I have a conference with Stägemann,
    consequently more on Tuesday. This very moment I receive Your Serene Highness''s letter of the 9th;
    on that too I shall write by the first post. In reverence I remain Your Serene Highness''s. As Lieutenant-Colonel
    v. F. tells me, Adolph conducted himself very awkwardly before the King; the King [uncertain: asked]
    him what his father was doing, how he was faring, and the answer was — I do not know, I have not seen
    him for a long time. Turn over [text lost] Vienna


    the 20th of May 1815


    most obedient servant


    v Triebenfeld'

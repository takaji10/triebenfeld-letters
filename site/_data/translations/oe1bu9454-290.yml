- page: 2
  en: 'Both I and Barbe and Beugelin had instructed him what he should say — he could have done much for
    his father at that moment. In short, your sons will act, [but] never take after [you]. Humboldt and
    also Nesselrode wished to present him to their monarch; to that he could not be brought, and hastened
    away from there. The Countess Fricis and several others say there is not a drop of his father''s blood
    in him.


    Do be sure, Your Serene Highness, to send me the 100 ducats, for I mostly do not know whether I shall
    not have to go straight on to Berlin in the matter — and here too I still have much to pay. I have
    asked that it be sent by express courier. It would be very [uncertain: schlagen] if you were not to
    do so.'

segments:
- page: 1
  en: 'Most Serene, Most Mighty King, most gracious King and Lord!


    Already a considerable time ago a Royal Government at Poznań demanded from His Serene Highness the
    rectification of the titulus possessionis of the princely Hohenlohe estates as necessary and urgent,
    whereupon His Highness the Prince sent in to Your Majesty the deeds of donation wanting for this purpose
    in the original. As much, then, as His Serene Highness has been pressed in this matter to the speedy
    rectification of the titulus possessionis, so earnestly does he since look [uncertain: forward] to
    the conclusion of this affair, and I have now been charged in the name of His Serene Highness my Lord
    to beg Your Majesty most humbly and most urgently for the most speedy resignation by the Treasury
    (Fiscus) of the whole of the princely estates in Cujavia and Pszczew. I remain, until death, in deepest
    reverence


    Your Royal Majesty''s


    Pszczew, the 13th of February 1802.


    most humble and obedient


    J. Wilhelm Glenck, princely Hohenlohe Councillor of Building and Economy'

segments:
- page: 1
  en: 'Right Honourable Sir, most particularly to be revered Sir, Councillor of War and [uncertain: Frühsttag]
    — The letter just now received from the sub-prefect von Brzechffa by way of the advocate von Wieckowski,
    I give myself the honour most obediently to communicate to Your Right Honourable in the enclosure,
    and from it Your Right Honourable will be pleased to see that Mr von Brzechffa, on account of his
    business, intends to depart from Warsaw only on the 15th of this month, and also that there is good
    prospect with regard to the Trąbczyn lordship; this I wished to impart to Your Right Honourable and
    at the same time to assure you that I shall never cease to call myself Your Right Honourable''s


    Kalisz


    the 8th of March 12.


    most obedient servant


    the district councillor


    Thiel


    ad 12 March 1812.'

status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, most particularly to be revered Councillor of War and Forests! The letter
    just now received from the sub-prefect o Brzechsta by way of the advocate von Wieckowski I take the
    honour of communicating to Your Right Honourable, most obediently, in the enclosure, and from it you
    will be pleased to gather [uncertain: to gather] that Mr Brzechsta, on account of his business, does
    not intend to depart from Warsaw until the 15th of this month, and also that there is good prospect
    with respect to the lordship of Trąbczyn; this I wished to impart to Your Right Honourable and at
    the same time to assure you that I shall never cease to call myself Your Right Honourable''s


    Kalisz


    the 8th of March 12.


    most obedient servant


    the district councillor


    Thiel


    received 12 March 1812.'

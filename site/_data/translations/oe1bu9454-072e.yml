- page: 1
  en: 'Warsaw, the 5th of March [18]12. Dear Brother!


    I hasten to report that, on account of various affairs, I shall not be able to depart from Warsaw
    until the 15th of this month. The matter concerning Trąbczyn stands, according to certain information
    I have received, in a good posture, upon which I shall explain myself more fully on my return. For
    shortness of time, since the messenger is leaving, I cannot write more.


    Keep well


    [uncertain: k]ony Brother!


    friend


    B. Brzechffa'

- page: 1
  en: 'In Warsaw, the 5th day of March [18]12. Dear Brother!


    I hasten to report that, on account of various matters of business, I shall not be able to depart
    from Warsaw until the 15th of the current month. The affair concerning Trąbczyn, according to certain
    intelligence I have received, stands in good posture, which upon my return I shall explain more fully.
    For want of time, since the conveyance is departing, I cannot write more.


    Be well


    [uncertain: k]ony Brother!


    friend


    B. Brzechsta'

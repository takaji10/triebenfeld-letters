segments:
- page: 1
  en: 'In Warsaw, the 5th of March [18]12. Dear Brother! I hasten to report that, owing to various affairs,
    I shall not be able to depart from Warsaw until the 15th of the present month. The matter concerning
    Trąbczyn, according to certain intelligence I have received, stands in a good position, which I shall
    explain more exactly upon my return. For shortness of time, since the opportunity [i.e. the post]
    is departing, I cannot write more. Keeping well, [uncertain: k]ony Brother! your friend B. Brzechsta'

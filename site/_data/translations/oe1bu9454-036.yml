- page: 6
  en: 'bear, and that therefore the expressions contained, as you say, in the [uncertain: Mayndl.] letter
    do not proceed from me, nor was it in any way my intention to wish to present the matter from the
    side apprehended by You, since I shall rather always be most highly grateful to you for that which
    you have done for me (as in friendship.


    To this assurance, then, you will not be able to deny the fullest credence when I have the honour
    to report to you here that I am sending you the amount of 3000 Rthl Courant demanded in your last
    letter of the 25th of last month; Your etc. may believe that I thereby deprive myself of almost my
    last monies in order to comply with your wishes, and that truly nothing but the strength of my attachment
    to you could bring me to resolve upon this step as well. You I now beg to bring the whole affair fully
    to a conclusion and to send me the speediest report upon it. The'
  numbers:
  - '3000'
  - 25t
- page: 7
  en: 'The enclosed Rthlr to - Amelang, deign to have forwarded to the authority, even though I may already
    expect that the return of the [uncertain: Alligl.] will by now have taken place.


    From Your [uncertain: nichten] esteemed letter I could almost surmise that you do not stand on the
    best terms with the minister Mr. von Stein; I must confess to you frankly that this would pain me
    greatly, since I believe this gentleman to be one of those who must in every case be spared.


    I should very much wish that you might give me the pleasure, on your journey to Vienna, of visiting
    me here in person; this would be quite extraordinarily welcome to me, since it is not possible to
    settle in writing everything upon which I should very gladly hear your advice and upon which I should
    wish to have information from you. Gladly would I have resolved to send a confidant to you for that
    purpose, but I am held back solely by'
  names:
  - de: Amelang
    en: Amelang
    kind: person
  - de: Er. v. Stein
    en: Mr. von Stein
    kind: person
  - de: Wien
    en: Vienna
    kind: place
- page: 8
  en: 'the thought that You might perhaps not gladly say to anyone other than myself all that would be
    worth my knowing. I know therefore no other means than an [uncertain: expubesucht] from You here [uncertain:
    biß nur], which would cause no too great a detour, since you are in any case travelling by way of
    Dresden, and I therefore most urgently request you, wherever it is at all possible,


    to give me this pleasure.


    Should you think it advisable to say something of it to assessor Koeppe, I beg for that. In respect
    of the money business I am not idle here, only that before the lapse of 8-14 days I can say nothing
    further upon it, because various papers are still wanting for it, which I expect [uncertain: tags].
    You I only beg to see to it that the cession of the mortgage may take place at once, when such shall
    be required, so that the business may find no [uncertain: befindenen] therein. My [uncertain: Hoffacte]
    here I have ordered to report [uncertain: bz furch] in [uncertain: Bedi], wherefore I the more wish
    that you might await his arrival at Berlin, since I believe he would be of use to me [uncertain: viertl.]
    in a money business very much to be wished for by me.


    What I received yesterday concerning the [uncertain: Wildeganes] I send You here in copy, with the
    request that you instruct me what may be to be done in the matter, also, in order to give the occasion,
    that You might initiate therein the [uncertain: Schütt] that seems serviceable to you. With the same
    request you receive one here, in which a proposal was made [uncertain: beten] of a [uncertain: Takts]
    by [uncertain: Jeg.], and I very much request you to let me have your opinion and advice upon it as
    soon as possible.


    Your Right Honourable''s


    [uncertain: Öh] 13 March 1808 To His Right Honourable the councillor of war von Fr.'

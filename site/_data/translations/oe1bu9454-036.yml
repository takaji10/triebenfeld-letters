  - 6,000
- page: 5
  en: 'to procure the same for him again forthwith, be it at the greatest sacrifice. And since I still
    had about as much to draw, from the moneys that had been deposited for the [uncertain: war office],
    as the sum assigned to Mr Eysenhardt amounted to, I accordingly, upon receipt of the letter from [blank],
    requested Assessor Koppe in writing, [illegible] [illegible], to pay Mr Eysenhardt without delay the
    sum owing to him, the 2500 Rthl, out of the above money, and in return to take back the instrument
    from [uncertain: him] (which Mr Major-General Amelang has in safekeeping), and to deliver the same
    to You. Since Assessor Koppe is now back, as letters from Heidelberg, where he passed through, inform
    me, I therefore regard my commission to him as executed and Your wish in this matter as fulfilled.
    You will be pleased to convince yourself from the exact narrative of events given above that I have
    done absolutely nothing in this affair that does not bear the stamp of the greatest high regard and
    friendship towards the same,'
  names:
  - de: J. Eys.

- page: 1
  en: '[uncertain: Cococe]t of the letter to the wife, née Reichts, of the councillor of war von Triebenfeld
    has for a long time pained me as much as Your otherwise esteemed missive of the


    20th of last month, which I received yesterday. Since, that is, I was to gather from it that it was
    impossible for you to cast a suspicion upon the manner of conduct I have observed towards you, which
    yet cannot be otherwise than good and befitting our friendly relations, and never has been otherwise
    at any time: May this sincere expression of my feeling serve Your etc. as a convincing proof, if any
    such were still needed towards you, how firmly founded my high regard and friendship towards you are,
    and how greatly I wish that you might view from the one correct side that which I shall have the honour
    to relate to you in what follows.


    I perceive very clearly from Your etc. missive that you do not at all regard the measures I took concerning
    the [uncertain: Aslips] of your Rthlr'
  names:
  - de: v. Triebenfeld
    en: von Triebenfeld
    kind: person
  - de: Reichts
    en: Reichts
    kind: person
  numbers:
  - '20.'
- page: 2
  en: 'in the way I would have wished, for your reassurance, that you should, wherefore I find it necessary
    to set out the particulars to you most plainly.


    It was, namely, in the past January of 1807 that the [uncertain: Justes] Eysach from Berlin arrived
    here and set about arranging with me a debt outstanding from earlier times. However much this incommoded
    me, I nevertheless had grounds which determined me to apply everything possible in order to satisfy
    this man as to his demand. This was done through the mediation of the privy councillor Major, who
    is an old acquaintance of Eysenhardt''s, and with sacrifices on my part which pained me beyond measure.


    Several weeks passed after I had received from You the known order to pay of 6000 Rthl from [uncertain:
    Stettinius], and since the said Eysenhardt entered into the aforementioned arrangement under'
  names:
  - de: Eysach
    en: Eysach
    kind: person
  - de: Berlin
    en: Berlin
    kind: place
  - de: Eysenhardt
    en: Eysenhardt
    kind: person
  - de: Major

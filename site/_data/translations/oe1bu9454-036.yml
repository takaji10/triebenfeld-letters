- page: 3
  en: 'no other condition than that I pay him, who stood urgently in need of the money, the [uncertain:
    Kienier] of 2500 Rthl in cash against his demand; I therefore seized upon the expedient of making
    over to him, by cession from me and by endorsement from the privy councillor Mayer, the instrument
    held by You, under the condition that he should hand over to me in cash the remainder of 3,500 Rthl
    after collection of the whole 6000 Rthl. This I did the less scrupulously in that, as You can easily
    convince yourself, I could at that time not know the very least of the stoppage of payment brought
    about by the same. I therefore [expected] quite calmly to receive my money from Mr Eysenhardt, when
    from the same I first received the most highly'
  names:
  - de: Geh. Mayer
    en: the privy councillor Mayer
    kind: person
  - de: J. Eys[enhardt]
    en: Eysenhardt
    kind: person
  numbers:
  - '2500'
  - 3,500
  - '6000'
- page: 4
  en: 'unexpected news, [that] the payments to be made had been stopped.


    My embarrassment was thereby — I confess it to You — great in more than one respect, inasmuch as I
    partly stood most urgently in need of the expected 3,500 Rthl, but partly also had to foresee that
    sooner or later I should have to pay the 2,500 Rthl due to Eysenhardt in some other way. Nevertheless
    I also took the requisite steps in Wrocław, in accordance with Your wish, likewise to stop the payment
    of the


    6,000 Rthl. This is the true course of this affair up to the present point of time, and I have, and
    [illegible] to justify myself most fully to You, now only to add what I have further done in this
    matter with regard to Your wishes.


    When, namely, I received your letter of the [blank], in which the same wished the [uncertain: return]
    of the oft-mentioned instrument, I at once resolved — since I have no more eager [desire] than to
    show You in all things how much I [strive] to comply with your wishes —'
  names:
  - de: Eys[enhardt]
    en: Eysenhardt
    kind: person
  - de: Breslau
    en: Wrocław
    kind: place
  numbers:
  - 3,500

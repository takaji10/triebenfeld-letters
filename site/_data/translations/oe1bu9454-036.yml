- page: 2
  en: 'in the way I wished and intended for your reassurance; on which account I find it necessary to
    set the particulars out for you most plainly.


    It was, namely, in January 1807 that the [uncertain: Justes] Eysach arrived here from Berlin, and
    [came] to arrange with me a debt proceeding from earlier times. Greatly as this incommoded me, I nevertheless
    had grounds which determined me to apply every possible means to satisfy this man as to his demand.
    This was done through the mediation of the privy councillor Major, who is an old acquaintance of Eysenhardt,
    and with sacrifices on my part which pained me beyond measure.


    This took place several weeks later than I had received from You the well-known order to pay for 6000
    Rthl [uncertain: from Szczecin], and since Eysenhardt entered into the arrangement noted above under'
  names:
  - de: Eysach
    en: Eysach
    kind: person

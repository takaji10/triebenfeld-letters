- page: 1
  en: '36 [uncertain: Concept] of a letter to the wife of Mr Councillor of War von Triebenfeld, née Reichts[?]
    — nothing has pained me so much for a long time as Your otherwise esteemed letter of the [illegible]
    of last month, which I received yesterday; since, namely, I was obliged to gather from it that it
    would be impossible for the same to cast a suspicion upon the manner of acting I have observed towards
    you, which yet cannot be other than good and suited to our friendly relations, and has never at any
    time been otherwise. May this sincere expression of my feeling serve Your [etc.] as a convincing proof
    — if any such were still needed towards you — how firmly founded my high regard and friendship towards
    you are, and how much I wish that the same might view from the single correct side that which I shall
    have the honour to convey to you in what follows.


    I perceive with much distress from Your [etc.] letter that the same do not at all regard the measures
    I took concerning the [illegible] of your Rthl'
  names:
  - de: Krieges Rath v. Triebenfeld
    en: Councillor of War von Triebenfeld
    kind: person
  - de: Reichts
    en: Reichts
    kind: person
  numbers:

- page: 6
  en: 'and that therefore the expressions contained, as the same say, in the [uncertain: Mayndl.] letter
    do not proceed from me, nor was it in any way my intention to wish to present the matter from the
    side in which You have taken it up, since I shall rather always be most highly grateful to you for
    that which the same have done for me (as out of friendship).


    This assurance, then, You will not be able to refuse the fullest belief, when I have the honour [uncertain:
    to report] to you herewith, that I am sending you


    the amount of 3000 Rthl Courant demanded in Your last letter of the 25th of last month. You etc. may
    believe that I thereby deprive myself of almost my last moneys, in order to comply with Your wishes,
    and truly nothing less than the strength of my attachment to you was needed to resolve upon this step
    also. I now beg the same to bring the whole affair entirely to effect, and to send me the earliest
    news of it.'
  numbers:
  - '3000'
  - '25'
- page: 7
  en: 'The enclosed Rthl to Amelang you will be pleased to have forwarded to the authority, although I
    may at the same time expect that the return of the instrument will already have taken place.


    From Your honoured letter I might almost suppose that the same do not stand on the best terms with
    the minister [uncertain: Er.] von Stein; I must sincerely confess to the same that this would pain
    me greatly, since I believe that this gentleman is one of those who must in every case be spared.


    I should much wish that you might give me the pleasure, on your journey to Vienna, of visiting me
    here yourself; this would be quite extraordinarily welcome to me, inasmuch as it is not possible to
    settle in writing everything upon which I should very gladly hear your advice and upon which I should
    like to have information from you. Gladly would I have resolved for this purpose to send a confidential
    person to you, but I was solely'
  names:
  - de: p Amelang
    en: Amelang
    kind: person
  - de: Minister Er. v. Stein
    en: the minister von Stein
    kind: person
  - de: Wien
    en: Vienna
    kind: place
- page: 8
  en: 'held back by the thought that You might perhaps not gladly say to anyone other than myself all
    that would be worth my knowing. I know therefore of no other means than an express visit from You
    here, which would not occasion too great a detour, since you are in any case travelling by way of
    Dresden, and I therefore most urgently request the same, wherever it be at all possible,


    to give me this pleasure. Should you find it advisable to say something of it to Mr Assessor Koppe,
    I beg you to do so. In respect of the money business I am not idle here, only I cannot say anything
    further about it before the lapse of 8–14 days, because various papers are still wanting for it, which
    I expect daily. I beg you only to see to it that the cession of the mortgage may take place at once,
    if such be required, so that the business meet with no [obstacle] on that account. I have ordered
    my [uncertain: court agent] here to report [illegible] in [illegible], on which account I the more
    wish that the same might await his arrival at Berlin, since I believe he would be [illegible] of use
    in a money business very much to be wished for by me.


    What I received yesterday in respect of the [uncertain: Wildegan], I send You herewith in copy, with
    the request that you instruct me what is perhaps to be done in the matter, and also, in order to give
    the occasion, that You might herein set in train the [uncertain: step] appearing serviceable to you.


    With the same request you receive herewith [the proposal] which was made as a proposal [illegible]
    of a [uncertain: contract] by [uncertain: Jeg.], and I very much request the same to let me have your
    opinion and advice upon it at the earliest.


    Your Right Honourable


    Öhringen, 13 March 1808. To Your Right Honourable Mr Councillor of War von Triebenfeld.'

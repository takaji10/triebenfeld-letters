status: draft
segments:
- page: 1
  en: '[uncertain: Cococe]t of the letter to the wife of the Councillor of War Mr. v. Triebenfeld, née
    Reichts, has for a long time pained me as much as Your otherwise esteemed communication of the 20th
    of last month, which I received yesterday; for from it I was to perceive that it were impossible for
    the same to cast a suspicion upon the manner of conduct I have observed toward you, which nevertheless
    man be nothing other than good and befitting our friendly relations, and never at any time has been
    otherwise. May this sincere expression of my feeling serve Your etc. as a convincing proof, should
    such still be needed toward you, how how firmly grounded my high respect and friendship toward you
    are, and how much I wish that the same might regard from the single correct side that which I shall
    have the honour of promising you in what follows. I perceive very plainly from Your etc. communication
    that the same do not regard at all the measures I have taken concerning the Aslips of Your Rthlr'
- page: 2
  en: 'so as I wished and desired this for your reassurance, on which account I find it necessary to set
    out the particulars to you most clearly. It was, namely, in the past January of the year 1807 that
    the Justes Eysach from Berlin arrived here, and [came] to arrange with me a debt outstanding from
    earlier times. As much as this incommoded me, I nevertheless had grounds which determined me to employ
    every possible means in order to satisfy this man as to his demand. This took place through the mediation
    of the Privy Councillor Major, whose old acquaintance Eysenhardt is, and with sacrifices on my part
    which pained me infinitely. It happened several weeks later that I had received from Your the known
    instruction for 6000 Rthl from [uncertain: Stettinius], and since the said Eysenhardt entered into
    the above-noted arrangement under'
- page: 3
  en: 'no other condition than that, if I urgently needed the money from him, I should pay him the [uncertain:
    Kienier] of 1500 Rthl in cash against his demand; I therefore seized without further ado the expedient
    of ceding to him the cession from me, and indeed even from Privy Councillor Meyer, the Alligl. held
    by Your, upon the condition that he pay out to me the remainder of 3,500 Rthl, that is: after the
    collection of the whole 6000 Rthl, in cash. This I did all the less scrupulously since, as Your can
    easily satisfy yourself, at that time I could not know the least thing of the suspension of payment
    arranged by the same. I therefore [expected] quite calmly to receive my money from Mr. Eys. in due
    course, when from him I first received the most highly'
- page: 4
  en: 'unexpected news that they had suspended the payment that was to be made. My embarrassment was thereby
    - I confess it to Your - increased in more than one respect, inasmuch as I partly stood in most urgent
    need of the expected 3,500 Rthl, but partly also had to foresee that sooner or later I should have
    to pay the 2,500 Rthl [owing] to Eys. by some other means. Nevertheless I also took the requisite
    steps at Breslau, in order, according to Your p wish, likewise to suspend the disbursement of the
    6,000 Rthl. This is the true course of this affair up to the present point in time, and I have, and
    He [has] to justify me most fully, now only to add this further, namely what I have done in this matter
    with regard to your wishes. When, namely, I received your communication of the ——, in which the same
    desired the [uncertain: Zweck Gabe] of the oft-mentioned Alligl., I resolved at once - since I have
    no more eager [wish] than to show Your p in everything how much I [strive] to answer to your wishes
    - also'
- page: 5
  en: 'to resolve to send such back into their hands forthwith, be it even at the greatest sacrifice.
    And since I still had to draw from the moneys deposited for the war-treasury roughly as much as the
    sum instructed to Mr. Eys. amounted to, I have accordingly, upon receipt of the letter from you, requested
    Mr. [uncertain: Ulli.] Koppe in writing to pay Mr. Eys. without delay the sum owing, the 2500 Rthl,
    and in return to take back the Alligl. from Your (which Herr 9. M. A. holds in safekeeping), and to
    deliver the same to the same. Now since Mr. Assessor Koppe is back again - as letters from Heidelburg,
    where he passed through, inform me - I therefore consider my commission to him as executed and Your
    wish in this matter as fulfilled. From the foregoing more exact narration of the history you will
    only deign to satisfy yourself that I have absolutely done nothing in this affair which does not bear
    the stamp of the greatest high respect and friendship for the same, [continued]'
- page: 6
  en: 'bears, and that therefore the expressions contained, as the same say, in the [uncertain: Mayndl.]
    letter do not proceed from me, nor was it in any way my intention to represent the matter from the
    side apprehended by Your p, since I shall rather always be most highly grateful to you for that which
    the same have done for me (as in friendship). To this assurance you will now be unable to withhold
    the fullest credence, when I have the honour to report to you here that I am sending you the amount
    of 3000 Rthl Courant demanded in your last letter of the 25th of last month. Your etc. may believe
    that I thereby deprive myself almost of my last moneys, in order to answer to your wishes, and truly
    it required nothing less than the strength of my attachment to you to resolve upon this step also.
    I now beg the same to bring the whole affair to a complete conclusion, and to convey to me the earliest
    report upon it. The'
- page: 7
  en: The enclosed Rthlr to - Amelang, deign to have forwarded to the authority, even though I may indeed
    expect that the retradition of the Alligl. will already have taken place by then. From Your last esteemed
    letter I should almost conjecture that the same do not stand on the best terms with Minister Mr. v.
    Stein. I must confess frankly to the same that this would pain me greatly, since I believe that this
    gentleman is one of those who must in any event be spared. I much wished that on your journey to Vienna
    you might give me the pleasure of visiting me here in person. This would be quite extraordinarily
    welcome to me, inasmuch as it is not possible to settle in writing everything upon which I should
    very gladly hear your counsel and upon which I should like to have information from you. Gladly would
    I have resolved to send a confidant to you for that purpose, but I am held back solely by
- page: 8
  en: 'the thought that Your p might perhaps not gladly say to anyone else than to myself all that would
    be worth my knowing. I know therefore of no other means than an [uncertain: expubesucht] from [uncertain:
    Emp.] here as far as -, which would cause no too great a detour, since you are travelling by way of
    Dresden in any case; and I therefore most urgently request the same, wherever at all possible, to
    give me this pleasure. Should you think it advisable to say something of it to Mr. Assessor Koppe,
    then I beg for it. In respect of the money business I am not idle here, only that before the lapse
    of 8-14 days I [can] say nothing further upon it, because various papers are still wanting to that
    end, which I [expect] daily. I beg only for this, that care be taken that the cession of the mortgage
    take place at once, should such be required, so that the business find no [impediment] thereby. My
    court factor here I have ordered to report himself in [illegible]; on which account I the more wish
    that the same might await his arrival at Berlin, since I believe he would be of use for a money business
    very much to be wished by me, [uncertain: quarterly]. What I received yesterday in respect of the
    Wildegans, I send Your here in copy, with the request that you instruct me what may be to be done
    in the matter, and also, in order to give the occasion, so that Your might in this initiate the step
    that seems serviceable to you. With the same request you receive one here, which was a proposal made
    by [uncertain: Jeg.] concerning a [uncertain: Takt], and I very much request the same to let me have
    your opinion and counsel upon it with all speed. Your Right Honourable''s [uncertain: Öh] 13 March
    1808 To Your Right Honourable the Councillor of War and Forests v. Fr.'

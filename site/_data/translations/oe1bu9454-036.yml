  - '6000'
- page: 4
  en: 'unwelcome news that [uncertain: Empfätten] the payments to be made were suspended.


    My embarrassment was thereby, I confess it to You, in several respects great, since partly I very
    urgently needed the expected 3,500 Rthl, and partly I also had to foresee that sooner or later I should
    have to pay the 2,500 Rthl [uncertain: aſtigl.] to Eys. in some other way. Nevertheless I also took
    the requisite steps in Breslau in order, in accordance with Your will, to suspend the payment of the


    6,000 Rthl as well. This now is the true course of this affair up to the present point in time, and
    I have, and He [uncertain: begeEr] me most fully to justify, now only to add that which I have further
    done in this matter with reference to your wishes.


    When, namely, I received your free missive of the [text lost], in which you wished the [uncertain:
    Zweck Gabe] of the oft-mentioned [uncertain: Alligl.], I at once,


    since I can have no more eager desire than to show You in all things how greatly I [uncertain: beinahe]
    to comply with your wish, also'
  names:
  - de: Breslau
    en: Breslau
    kind: place
  - de: Eys.
    en: Eys.
    kind: person
  numbers:
  - 3,500
  - 2,500
  - 6,000
- page: 5
  en: 'resolved to restore the same to you, be it even with the greatest sacrifice, without delay. And
    since I still had about as much to draw from the monies that had been deposited for the war-account
    as the sum ordered to be paid to the councillor of justice Eys. amounted to, I have accordingly, upon
    receipt of the letter from [uncertain: fir], requested assessor Koeppe


    in writing to pay the councillor of justice Eys. the sum due, the 2500 Rthl, without delay, to take
    back in exchange the [uncertain: Äſtigl.] from him (which [illegible] 9. M. A. in safekeeping) and
    to deliver the same to you. Since assessor Koeppe is now back, as letters from Heidelburg, where he
    passed through, inform me, I therefore regard my commission to him as executed and Your wish in this
    matter as fulfilled. You will only deign to convince yourself from the foregoing more exact narrative
    of events that I have absolutely done nothing in this affair which did not bear the stamp of the greatest
    high regard and friendship towards you'
  names:
  - de: J. Eys.
    en: councillor of justice Eys.
    kind: person

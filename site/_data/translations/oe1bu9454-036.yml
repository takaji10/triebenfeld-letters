- page: 3
  en: 'no other condition than that, if I urgently needed the money for it, I should pay him the [uncertain:
    Kienier] of 1500 Rthl in cash against his demand; I therefore seized, without further ado, upon the
    expedient of letting him have the [uncertain: Alligl.] held by You, by cession from me and indeed
    [uncertain: Gar] from privy councillor Meyer, on condition that he should hand out to me the remainder
    of 3,500 Rthl, that is to say, after collection of the whole 6000 Rthl in cash. I did this the more
    unhesitatingly in that, as You may easily convince yourself, at that time I could not have known the
    least thing about the suspension of payment arranged by you. I therefore quite calmly [expected] to
    receive my money from the councillor of justice Eys., when from him I first received the most highly'
  names:
  - de: Geh. Meyer
    en: privy councillor Meyer
    kind: person
  - de: J. Eys.
    en: councillor of justice Eys.
    kind: person
  numbers:

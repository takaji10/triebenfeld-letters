- page: 1
  en: 'The Honourable Chełmski against the Honourable Sokołowski — Manifest Filed


    To the office and present records of the Konin Municipal Court, appearing in person, the Honourable
    Stanisław Scibor Chełmski, Thesaurarius [Treasurer] of Wschowa — reassuming his prior manifests —
    attests that the commissarial boundary field decree between his estates of Łukom, [and] Trąbczyn of
    the Honourable Prusimski, Starost of Niszczewice, and others — [issued] by the commissioners engaged
    on behalf of the petitioning party, according to the tenor of the judicial site inspection of the
    year 1592 [conducted] by a court official and nobles as the custom of that time required, and according
    to the tenor of the Konin Land Court decree — an inspection acknowledged by the then co-heirs of the
    estates of Trąbczyn, or rather unchallenged to this day, authorised by the two Tribunal decrees of
    the years 1766 and 1768 and ordered to be observed in the delimitation — had intervened; and the mounds
    erected by the commissioners relying on the instrument or statute of the Estates of the Realm, had
    been made firm by the oath sworn by the appearing party at the last axial mound;


    yet the Honourable Prusimski, Starost of Niszczewice, and the commissioners procured on his behalf
    — although they knew of the aforesaid concluded delimitation, had seen the mounds raised on behalf
    of the appearing party, and had full notice of the oath sworn by the appearing party, in the form
    of the Statute, in confirmation of the same — notwithstanding all these things, and first the commissioners
    on behalf of the Honourable Prusimski, abusing their authority, entrusted to the Honourable Albert
    Czarnecki, Boundary Surveyor of Kalisz — engaged by the Honourable Prusimski for the commencement
    of the commission, in the matter of the review of documents, the formation of boundary lines, and
    the lending of his advocacy — the lustration of the boundary line and the placing of the mounds; and
    admitted and designated him both for the reception of the oath from the party regarding the reality
    of the boundary lines and for other matters to be transacted. Which Honourable Boundary Surveyor,
    at his own pleasure, already after the departure of the Honourable Commissioners and an interval of
    several weeks, had caused the decree to be drawn up; and had allowed himself the ability to treat
    documents according to opportunity — in one place as legitimate, in another as invalid.


    And the same Honourable Prusimski — having had full notice, as mentioned above, of the oath sworn
    by the appearing party — and being little acquainted even with his own boundaries, which were seldom
    gone over in his presence — knowingly presumed to offer oath against oath; and had recruited as witnesses
    to swear the like oath with him: one from among the collateral cognates, having been cited; another
    lacking full sense; a third who is in the service of the Honourable Czarnecki, taken to his side straight
    from Piotrków and never having been in these parts; and had recruited other persons of no account.


    For which reason, publicly setting out the foregoing, he incriminates the Honourable Prusimski for
    all of them, and offers that, if need be, he will prove and deduce the aforesaid matters through sworn
    inquiries.


    Stanisław Ścibor Chełmski'

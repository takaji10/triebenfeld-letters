- page: 1
  en: 'The Honourable Chełmski against the Honourable Sokołowski — Manifest Filed


    To the office and present records of the Konin Municipal Court, appearing in person, the Honourable
    Stanisław Scibor Chełmski, Thesaurarius [Treasurer] of Wschowa — reassuming his prior manifests —
    attests that the commissarial boundary field decree between his estates of Łukom, [and] Trąbczyn of
    the Honourable Prusimski, Starost of Niszczewice, and others — [issued] by the commissioners engaged
    on behalf of the petitioning party, according to the tenor of the judicial site inspection of the
    year 1592 [conducted] by a court official and nobles as the custom of that time required, and according
    to the tenor of the recognised Konin Land Court decree — for the previous joint heirs of the estates
    of Trąbczyn at that time, or more accurately unchallenged to this day — authorised by the two Tribunal
    decrees of the years 1766 and 1768, and the demarcation enjoined therein having been carried out —
    had intervened; and the mounds erected by the commissioners relying on the instrument or statute of
    the Estates of the Realm, with jurisdiction rendered for the opposing party at the final axial mound,
    had been firmly confirmed;


    yet the Honourable Prusimski, Starost of Niszczewice, and the commissioners procured on his behalf
    — although, having declared that they knew of the concluded demarcation, had seen the mounds placed
    for the petitioning party, and had received due notice of the jurisdiction rendered for those appearing
    in accordance with the form of the Statute in confirmation of those same [mounds] — notwithstanding
    all these things, and first the commissioners on behalf of the Honourable Prusimski, abusing their
    authority, entrusted to the Honourable Albert Czarnecki, Boundary Surveyor of Kalisz — engaged for
    the Honourable Prusimski for the commencement of the commission in the matter of the review of documents,
    the formation of boundary lines, and the conduct of the advocacy — the lustration of the boundary
    line and the placing of the mounds; and admitted and designated him both for the reception of the
    oath from the party regarding the reality of the boundary lines and for other matters to be transacted.
    Which Honourable Boundary Surveyor, at his own pleasure, already after the departure of the Honourable
    Commissioners and an interval of several weeks, had caused the decree to be drawn up; and had allowed
    himself the ability to treat documents according to opportunity — in one place as legitimate, in another
    as inviolable.


    And the same Honourable Prusimski — having had protected notice, as mentioned above, of the oath rendered
    for the opposing party — not even being aware of his own grievances, as he rarely is, deliberately
    presumed in his own presence to offer a counter-oath against the oaths attested there; and had recruited
    as witnesses for standing the same oath alongside him: one from among the collateral cognates, having
    been cited; another running there under the aforesaid protection; a third — immediately from Piotrków,
    found in the service of the Honourable Czarnecki — having taken him to his side; never having been
    present in those parts; and had recruited other persons of no account.


    Having set out these matters as contrary to the Republic, he incriminates the Honourable Prusimski
    for all of them, and offers that, if need be, he will prove and deduce the aforesaid matters through
    sworn inquiries.


    Stanisław Ścibor Chełmski'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! I lay in the most violent fever when Your Serene
    Highness''s letter [uncertain: reached] me; the sight of your hand cheered my sum, but how great was
    my astonishment when I saw the instrument that had been drawn up, together with the power of attorney
    — who gave Your Serene Highness this counsel? W here what is to be recovered for Your Serene Highness,
    that would be done without any such instrument. I do after all hold a general power of attorney for
    that purpose. For you, unhappily, I can recover nothing, for everything is at this moment placed under
    arrest. Besides, you were indeed obliged to pay the interest to the Invalids'' Fund. In Berlin they
    dragged me Collé; when the French held me under arrest I had to pay on behalf of Your Serene Highness,
    as your plenipotentiary. When I had been released from the arrest, I proved the unheard-of, unjust
    proceeding of the Intendant'
- page: 2
  en: 'Maluce and of the Invalids'' Fund before the French General Direction — and this body then ordered
    that only the 3121 Rthl, together with costs and interest, were to be given back out of the estates.
    By virtue of this decree it is I who can demand the moneys back, not Your Serene Highness, for you
    are the party in default. — I claim, as to the interest, the interest and costs, which together amount
    to 4219 Rthl, and I require that the same be recovered for me out of the arrears and interest of the
    subjects, upon which the Invalids'' Fund has now laid an arrest. Now, in order to facilitate this
    matter and not first to have to seek out lengthy judicial assistance, Your Serene Highness should,
    according to the counsel of the komornik, declare: that in accordance with the decree of the French
    General Government you are still owing to the Councillor of War and Forests von Triebenfeld the 3125
    Rthl of interest taken from him by compulsion and arrest, which the Invalids'' Fund received against
    receipt on the 14th of February 1808,'
- page: 3
  en: 'and which the French General Government has ordered to be [uncertain: remitted] to the said Triebenfeld
    out of the revenues of the Zagorow estate; and that the said von Triebenfeld has in this respect been
    satisfied neither as regards the capital advanced nor as regards the costs and interest. Since, then,
    the capital advanced, together with interest and costs, amounts to 4219 Rthl, you accordingly assign
    to Triebenfeld this sum, in the amount of 4219. —, out of the old and new interest payments which
    the inhabitants of Wrąbczyn, Alt Olesnica, Kopoyno, Skokum, Swiątniki, Adelow, Sophienthal and Neu
    Swięce have to pay, to be drawn thereupon, so that he may satisfy himself out of these funds. To that
    end you concede that this above-mentioned sum of 4219 Rthl may forthwith be recovered by a komornik,
    and consequently by the strictest execution, and be delivered into the hands of the said von Triebenfeld.
    This, then, the komornik has the Tribunal'
- page: 4
  en: approve, and then sees what he can recover or lay hold of thereupon ahead of the Invalids' Fund.
    This is the only means of rescue for obtaining some money here now, so as to keep the machine in motion.
    I am therefore sending my forester on horseback once again, and beg Your Serene Highness in the most
    pressing manner to have the instrument drawn up in the manner described above with all possible speed,
    and to convey it to me by the messenger. I remain, until death, Your Serene Highness's — if I do not
    have the instrument here by the 15th, or at the very latest early on the 16th, then everything comes
    to an end and collapses in a heap. Humble three, Blizanow, the 6th of July 1812, v Triebenfeld

- page: 1
  en: I have had the honour of writing to Your Most Serene Highness in the matter of His Highness the
    Prince of Hohenlohe under date of the 23rd of October and the 28th of November, and to owe the granzstatoth
    [unparseable]. Your Serene Highness only today caused it to be disclosed through the Privy Councillor
    of State Stägemann that this matter was to be laid before a Commission in Berlin for decision. This
    is in general the E. a hohenlose Weißl. [unparseable] Yet it appears in this to have been left entirely
    out of account that the interest of the State is bound up in the matter of the discharge of the Carz
    debt. In the representations mentioned above I had the honour to submit that the Cur. heirs would
    regard the whole debt as satisfied with 112000 Rthl, in such wise that they would hand back the documents;
    that the Prince of Hohenlohe undertakes to discharge this State debt of 112000 Rthl by means of instalment
    payments of 25000 Rthl yearly, but that besides this he is minded to pay off along with it the 35000
    Rthl drawn in the year 1790 from the Royal Kr Treasury at Breslau. From the whole of the aforesaid
    there accrues to the State an advantage of 46000 Rthl; but all this is lost to the State if, instead
    of acting upon my proposal, enquiries are made of Count Wratislaw, who as former guardian must constantly
    have the best interest of his ward in view. The Kurz heirs / the Duchess of Sagan etc. / are now in
    need of money. The debt of 426000 Rthl is discharged with 112000 Rthl. For this I furnish, if the
    advance is given to the Prince — inasmuch as only he, and not the King, who has once already renounced
    it and cannot break his word, must pay — a security of 60000 Rthl, and I await from Your Most Serene
    Highness only that you might be pleased to appoint an hour at which I may set this out to you more
    fully. In deepest reverence I remain, until death, Your Most Serene Highness's — to send this back
    again at once, no Copy, and the post goes [unparseable] — Vienna, the 7th of December 1814, most humble
    and obedient servant v Triebenfeld

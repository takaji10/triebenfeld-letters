- page: 2
  en: 'according to which all obligations of His Majesty the King of Prussia must be upheld; likewise
    I asked for a copy of the decree of the governing Commission by which the taking-over was ordered,
    in order to see the legal grounds; but this has not to this day been granted me. Lastly, by a protestation
    I have reserved to Your Serene Highness all remaining rights in these estates, particularly on account
    of the debts paid.


    Your Most Serene Highness will best know what is now to be done, for with the governing Commission
    at Warsaw nothing is likely to be achieved, since estates have been confiscated from some of its members,
    and thus their own interest guides them. Next, Your Most Serene Highness has again been drawn into
    2[uncertain: 2] lawsuits.


    In the first, the provost Iwanski and Kuchary demand the tithe (Decem) of Swięcia, which suit he lost
    in the first instance in the Prussian period, as'

- page: 1
  en: '28


    Most Serene Prince,


    Most gracious Lord!


    I hasten to convey to Your Most Serene Highness the unwelcome news that the Trąbczyn estates were
    taken over on the 3rd of this month by a commissary of the Court of Appeal at Kalisz, namely the appeal
    judge von Lipski, and have been handed over to the general attorney of Mrs von Dąbska, née von Prusimska,
    the canon von Jezierski.


    The order that was issued states that this taking-over is done by decree of the governing Commission.
    I have been able to do nothing further in the matter than to protest against the taking-over by a
    submitted representation, and also to invoke therein that this act runs counter to the plain content
    of the Peace of Tilsit,'

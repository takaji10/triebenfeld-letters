- page: 2
  en: 'according to which all obligations of His Majesty the King of Prussia must be upheld; likewise
    I requested a Copy of the decree of the governing Commission by which the taking away had been ordered,
    so as to see the legal grounds, but this has not to this day been granted me. Finally, by a protestation,
    I have reserved to Your Serene Highness all remaining rights in these estates, particularly on account
    of the debts paid.


    Your Most Serene Highness will know best what is now to be done, for with the governing Commission
    at Warsaw there is likely nothing to be achieved, since some of its members have had estates confiscated,
    and thus their own interest guides them. Next, Your Most Serene Highness has again been drawn into
    D. lawsuits. In the first, the provost Jwanski and Kuchary demand the tithe from Swięciacie, which
    lawsuit he lost in the first instance in Prussian times, as'
  names:

- page: 3
  en: I have informed myself from the manual records. In the second lawsuit the lessee Martin von Otocki,
    as cessionary of Constantin Orczykowski at Zagorowo, and the miller Ekstaedt at Wrąbczyn, demand,
    out of a nine-year lease contract concluded in the year 1798 over Trąbczyn, some 7000 Rthl in compensation,
    because the said contract was not fulfilled. So far as I have been able to learn, a judicial compromise
    was concluded in this matter at Breslau, under which the lessees renounced all their rights arising
    from this lease contract. If Your Most Serene Highness would have the grace and deign to command that
    this document be sought out at Breslau and sent hither, so that it might be used in refutation; also
    it would be necessary that Your Most Serene Highness deign to grant a power of attorney to someone
    in these matters, and I would in any case assist the attorney. Your Most Serene Highness's inter[est]—

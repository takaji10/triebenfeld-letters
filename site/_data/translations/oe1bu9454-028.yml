status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord! I hasten to communicate to Your Most Serene Highness the
    disagreeable news that the Trąbczyn estates were on the 3rd of this month taken over by a Commissarius
    of the Court of Appeal at Kalisz, namely the Appellate Judge v Lipski, and made over to the General
    Mandatarius of Madame v Dąbska née v Prusimska, the Canonicus v Jezierski. In the decree issued it
    is stated that this taking-over is effected by ordinance of the governing Commission. In this matter
    I have been able to do nothing further than that I protested against the taking-over by a submitted
    remonstrance, and also invoked therein that this act runs contrary to the plain content of the Peace
    of Tilsit,
- page: 2
  en: according to which all obligations of His Majesty the King of Prussia must be upheld; likewise I
    requested a Copy of the ordinance of the governing Commission by which the taking-over was directed,
    in order to ascertain the legal grounds, but this has not to this hour been granted me. Lastly I have,
    by a protestation, reserved to Your Serene Highness all remaining rights in these estates, particularly
    on account of the debts paid. Your Most Serene Highness will best know what is now to be done, for
    with the governing Commission at Warsaw nothing is likely to be achieved, since estates have been
    confiscated from several of its members, and thus their own interest guides them. Next, Your Most
    Serene Highness has again been involved in D. lawsuits. In the first, the Provost Iwanski and Kuchary
    demand the tithe from Swięciacie, which suit he lost in the first instance in Prussian times, as
- page: 3
  en: I have informed myself from the Manual Acts. In the second suit the lessee Martin v. Otocki, as
    Cessionarius of Constantin Orczykowski at Zagorowo, and the miller Ekstaedt at Wrąbczyn, demand, out
    of a 9-year lease contract concluded in the year 1798. over Trąbczyn, circa 7000 Rthl in compensation,
    because the same has not been fulfilled. So far as I have been able to learn, a judicial composition
    was concluded in this matter at Breslau, according to which the lessees renounced all their rights
    arising from this lease contract; if Your Most Serene Highness would have the grace and deign to command
    that this document be sought out at Breslau and sent hither, so that it might be used in refutation.
    It would also be necessary that Your Most Serene Highness should deign to grant a power of attorney
    to someone in these matters; I would in that case assist the Mandatarius. Your Most Serene Highness's
    interest—
- page: 4
  en: is my greatest concern, and it is grievous to me that I am perhaps the first bearer of these tidings.
    I remain, until death, in deepest reverence, as Your Most Serene Highness's Peisern, 5th October 1807.
    most humble and obedient [servant]. Hawich

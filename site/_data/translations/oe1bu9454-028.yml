- page: 3
  en: I have informed myself from the manual records. In the second suit the tenant Martin von Otocki,
    as cessionary of Constantin Orczykowski of Zagórów, and the miller Ekstaedt of Wrąbczyn, demand some
    7000 Rthl in compensation out of a nine-year lease contract concluded in the year 1798 over Trąbczyn,
    because the same was not fulfilled. So far as I have been able to learn, a judicial settlement was
    concluded in this matter at Wrocław, by which the tenants renounced all their rights under this lease
    contract; if Your Most Serene Highness would have the grace and deign to command that this document
    be sought out at Wrocław and sent hither, so that it might be used in refutation. It would also be
    necessary that Your Most Serene Highness deign to grant a power of attorney to someone in these matters;
    I would at all events assist the attorney. Your Most Serene Highness's interest

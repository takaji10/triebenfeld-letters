segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    I hasten to convey to Your Most Serene Highness the unwelcome news that the Trąbczyn estates were
    taken away on the 3rd of this month by a commissioner of the Court of Appeal at Kalisz, namely the
    appellate judge von Lipski, and handed over to the general attorney of Madame von Dąbska, née von
    Prusimska, the canon von Jezierski.


    In the order that was issued it is stated that this taking away is done by decree of the governing
    Commission. In this matter I could do nothing further than protest against the taking away by a submitted
    representation, and also invoke the point that this action runs counter to the plain content of the
    Peace of Tilsit,'

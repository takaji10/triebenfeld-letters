- page: 3
  en: 'that, with security so great, one would be content with the Landschaft [illegible], with the attestation
    as guarantee. All the more so as within a short time much higher revenues, which the Chamber itself
    approves and which consist of nothing but clear interest, would be ascertained.


    That too will have its effect.


    Of news one hears nothing whatever here; I am here as though I sat in Siberia. If Your Serene Highness
    has any, be pleased to communicate it to your servant.


    My [uncertain: Crain] Colonel von Wiesołowski is here from Russia, and according to his assurance,
    and what he vouches for, the [uncertain: possessing] Emperor has already a handsome army upon the
    [uncertain: tree] — In our region, that is at Knon and as far as Odessa, there stand 80000 men – at
    Welna 60000 men, and just now there are coming up a further 20 [uncertain: Pälch] [uncertain: Tomische]
    Cossacks – each [unit] is 2000 [uncertain: March] strong, that makes 180000 men on this side alone.
    In Courland and other places considerable [uncertain: corps] have likewise been drawn together, so
    that above 300000 men stand mobilised there.


    God grant that I may receive only the wished-for news concerning Your Serene Highness''s health. In
    deepest reverence I remain, until death, Your Serene Highness''s


    May Your Serene Highness be pleased to have


    a further 3 [uncertain: pieces of jackets] of the


    size as these are, made,


    and ordered, such [text lost] the [illegible] [text lost] to the


    Kalisz, the 13th of March


    1805


    faithful, humble and obedient servant


    v. Triebenfeld'

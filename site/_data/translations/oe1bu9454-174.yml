- page: 1
  en: '174 the actuary is always paid separately, and is brought in at every act, this deceit comes yearly
    to some 200 rt. The carriage-hire one could likewise reckon, together with the board — 200 rt, and
    consequently there is already a profit here. And if it be further assumed that he takes on as well
    the post of a cashier and all the other business, then here again at least some 600 rt will be saved,
    and in all as much gained as Schenck receives. Besides this the fees will rise in future and will
    amount to at least some 1200 rt; in this way the justiciary will cost nothing, since no advocate need
    be kept any longer, and there will still remain several hundred as the annual surplus.


    Always shall I, wherever anything can be effected by my good will, strive with the most ardent zeal
    to further Your Serene Highness''s advantage. But it is a misfortune for me that, while I labour here
    restlessly for Your Serene Highness, my own husbandry goes entirely to ruin — I cannot see to my estates,
    because I must be here. My people manage without restraint, and, since I never come there at all,
    they cheat me frightfully — Let Your Serene Highness therefore show me the grace to send Hahn to Świniary
    after all, and to have it said to my district administrator Käufer and to the forester Peltzold that
    Your Serene Highness were, as time would teach, interested in Świniary — There was talk that the officials
    managed badly'

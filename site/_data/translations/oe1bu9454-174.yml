segments:
- page: 1
  en: 'the actuary is always paid separately, and at every act there is [uncertain: added] — this fraud
    amounts yearly to a good 200 Rthl; the carriage-services one could likewise reckon, as well as the
    board, at 200 Rthl, so that already a profit is made here. And if it be further assumed that he also
    takes over the post of a cashier and all the other business, then again at least 600 Rthl are saved
    here, and in all as much is gained as the barn brings in. Besides this, the fees will rise in future
    and amount to at least 1200 Rthl; in that way the justiciary will cost nothing, no advocate need be
    kept any longer, and there will still remain several hundred as the annual surplus.


    Always, wherever anything can be effected by my good will, I shall strive with the most ardent zeal
    to advance Your Serene Highness''s profit. It is however a misfortune for me that, while I labour
    here without rest for Your Serene Highness, my own household goes entirely to ruin — I cannot look
    to my estates, because I must be here. My people keep house unbridled, and, since I never come there,
    cheat me frightfully — May Your Serene Highness therefore show me the grace to send Hahn to Schweiner
    and have him tell my steward Käufer and the forester Pelzold that Your Serene Highness were — as time
    would show — interested in Schweinen — Word had it that the officials were keeping house badly'

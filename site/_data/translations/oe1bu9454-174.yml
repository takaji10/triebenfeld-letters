- page: 2
  en: 'were keeping house. – She had it intimated to him that we were watching over the [uncertain: Nuppen]
    of their master and would prevent all detriment, and that they should be dreadfully chastised.


    I hope this will have effect and the fellows would not go on cheating quite so unobserved, for a Prince
    is feared more than a knight errant wandering about. Has Your Serene Highness sent the 1390 dkg in
    the Lichnowchi matter? I have firmly promised it to the man.


    Some people are awaiting me at Trąbczyn, who wish to buy several Hufen of land and to pay at once
    in cash; as soon as I get out there I shall see to this, and then Your Serene Highness will have the
    money back again at once – This would have been done already, but I cannot get away from here so as
    to leave the most important matter of all standing half-finished.


    The Amelang letter I send back – May Your Serene Highness be pleased to write to the patron after
    all.


    That they certainly reckoned upon the 100000 with security so sufficient, for the 50/2. Rthl which
    had been given, but no luck — Triebenfeld had [told] them of the difficulty on account of the revision
    of the assessments sooner than he reported it; they however held this to be a mere whim and reckoned
    upon his laissez faire and great influence, that he would direct the matter in such a way'

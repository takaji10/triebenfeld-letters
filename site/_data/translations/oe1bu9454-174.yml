- page: 3
  en: 'as to leave one content, with security so great, with the revision by the district councillor,
    with the attestation and guarantee, the more so as within a short time much higher revenues, which
    the Chamber itself approves and which consist of pure interest throughout, would be ascertained."


    That too will have its effect.


    Of news one hears nothing at all here; I am here as though I sat in Siberia. Has Your Serene Highness
    anything, then communicate it to your servant.


    My cousin Colonel von Wiesolowski is here from Russia; by his assurance, and for what he vouches,
    the [uncertain: Besitz] Emperor has a handsome army already upon the tree. In our region, that is
    at Kijow and as far as Odessa, there stand 80000 men — at Welna 60000 men, and just now there come
    forth further 20 [uncertain: Palch] [illegible]onasche Cossacks — each debt is 2000 März strong, that
    is 180000 men on this side alone. In Courland and other places considerable corps have likewise been
    drawn together, so that above 300/m men stand mobile there.


    God grant that I receive only the wished-for news concerning Your Serene Highness''s health. In deepest
    reverence I remain, until death, Your Serene Highness''s


    May Your Serene Highness have


    a further 3 busts of the


    greeting as these are made.


    and ordered, such [uncertain: hergeschieden] the [illegible] [illegible] follow back Kalisz, 13th
    March


    1805


    faithful, humble and obedient servant


    v Triebenfeld'

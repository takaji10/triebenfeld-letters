- page: 2
  en: 'managed. — She had it intimated to him that we do not watch over the advantage of their lord and
    would prevent all detriment, that they should be dreadfully chastised.


    I hope this will have its effect and that the fellows would not go on cheating quite so unobserved,
    for a prince is after all feared more than a knight errant wandering about. Has Your Serene Highness
    had the 1390 rt sent to Lichnowski? I have firmly promised it to the man.


    Several people are waiting for me in Trąbczyn who wish to buy some Hufen of land and to pay at once
    in cash; as soon as I get out there I shall see to this, and then Your Serene Highness will have the
    money back directly — This would have been done already, but I cannot drive away from here and leave
    the most important matter of all standing half way.


    The Amelang letter I send back — May Your Serene Highness be pleased to write to the patron after
    all.


    "That you certainly reckoned upon the 100/m, with security so sufficient, for the 50/m rt which had
    been given would have been, but no luck — Triebenfeld had [reported] to you the difficulty on account
    of the revision of the assessments sooner than he notified; but you held this to be a mere whim and
    reckoned upon his savoir faire and great influence, that he would conduct the matter in such a way'

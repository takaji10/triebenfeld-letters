segments:
- page: 1
  en: 'Pro Memoria.


    It is necessary that a head forester be appointed at Zagórów — I had designated the old Richter''s
    son, and at the Bra[text lost] my distillery the Nagel woman''s nephew as propination officer; but
    Richter must now administer the latter, because the Nagel woman has called her nephew away — So, as
    said above, a head forester is necessary — if Your Serene Highness wishes to help the poor Radszewski,
    be pleased to send him here quickly — With 300 Rthl a year he must be content until heaven helps further
    — If you approve this, most gracious Lord, then send Radszewski with all haste and send me at once
    your opinion concerning the exchange of the estates, along with


    von Triebenfeld'

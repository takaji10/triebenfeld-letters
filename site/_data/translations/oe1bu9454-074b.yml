segments:
- page: 1
  en: 'P. M.


    It is necessary that a head forester be appointed in Zagorowo – I had designated the old judge''s
    son, and at the brew[text lost] my distillery the Nogeln''s nephew as officer of the propination rights;
    but the judge must now administer the latter, because the Nageln has recalled her nephew – So, as
    said above, a head forester is necessary – if Your Serene Highness wishes to help poor Radzowski,
    then be pleased to send him here quickly – With 300 Rthl yearly he must be content until Heaven helps
    further. If you approve this, most gracious Lord, then send Radzewski with all haste and send me at
    once your opinion concerning the baptism of the estates as well


    v Triebenfeld'

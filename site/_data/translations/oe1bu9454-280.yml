status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! This very hour I received Your Serene Highness''s two esteemed
    letters of the 10th and 13th. With the most heartfelt affliction I gather from them that nothing will
    come of Mr. Eberhard''s coming here [uncertain: from the provenance of]. Most sorrowful is the case
    that no genuine settlement has been brought about with the Burisch heiresses, and it is to be feared
    that Cosmar and Stägemann will simply invoke and lean upon this circumstance alone, and will now let
    the matter drag along the long road. Had Eberhard come here, he would have obtained the sure declaration
    of the Princesses, even if at 50 or 100 ℔ dearer, and one would certainly have obtained the approbation
    of the Royal and State Chancellor for the advance of the moneys, and nothing further would have happened
    than that the administration would have lasted some years longer; a newer writ [uncertain: Schreibschuß]
    that the King absolutely would not concern himself with the matter one would have procured here narrowly,
    and then Eberhard would certainly have had an easy and [illegible] game — for from Eberhardt''s letter,
    according to which Hennenberg has forbidden all settlement, and from the words of Mr. p. Stägemann,
    I now indeed surmise that everything is founded upon the King having promised the heiresses [uncertain:
    Eur.] to settle the matter after his return — to bring that about would meanwhile, with the present
    warlike prospects, be an easy thing. It requires only Eberhard''s presence, all the more so as the
    Electoral Princesses [uncertain: Kur: Prinzissionen] are in need of money — that in the testament
    of the old Prince such a Robulistic, knavish bolt has been shoved across on account of Adolph''s coming
    of age hinders much — I thought as much at once — what can he do, even if he be called lord of the
    entailed estate, when he may dispose of nothing? — It would be the only thing, that he too might complain
    of Cosmar''s administration and be helpful toward the complete overpowering of the fellow. That Prince
    August has not yet revoked the power of attorney is more than dreadful. If, however, he does not do
    so, then he shall taste nothing of his 18000 Rthl out of the entailed estates in the first 20 years
    — the 100000 Rthl he will unhappily indeed have to see — for Mr. Cosmar has rapiers indeed — meanwhile
    these now stand tolerably well. Only God knows how long. B., who most reverently commends himself,
    now looks daily for Poustales''s arrival — With K. Adolph nothing is to be done regarding Voschentin
    —'
- page: 2
  en: 'I do not in the least count upon it now — at present nothing can be done but to run down Cosmar
    by the direct road, and, as I hope, the means for that will let themselves be found. In the matter
    of the Polish estates the Prince Chancellor has answered me the same thing that Your Serene Highness
    lately wrote to Zerbone — and I am not to write to Kayser. The great ones take one another up, pay
    one another compliments, in order to sell off the men of business, God and the world. Napoleon is
    now rousing the all-powerful once more out of their slumber — it is only to be feared that he will
    bring them out of their coherence. With rapid strides the [uncertain: the respected one] hastens toward
    Paris — and although strong corps of ours and of others stand on France''s frontiers, no one will
    stir before, over all the complimenting to and fro, Bonaparte shall be in Paris — O tempora, o mores!
    Wellington set off today for the army — and in a few days, it is said, Prince Talleyrand would also
    depart. Between Talleyrand and Mr. Emperor Alexander there was a violent conversation in the hotel
    of Prince Wellington — Prince Talleyrand told the Emperor straight out that he was to blame for everything,
    and that the blood which would now flow again would all come upon his head, and that he alone must
    one day answer to God for it. On all sides there is marching, and how could it look more warlike than
    now — Meanwhile people wager that there will be no general war. The little King of Rome they wanted
    to steal away from here; relays have been laid as far as the Rhine, in every place 8 horses have stood
    in readiness — Today it is even said here that Monsieur has been taken prisoner by Bonaparte; officially
    there is nothing about it, and consequently the thing is not believed either. The King went out to
    meet Bonaparte from Paris as far as Melun, but this too is doubted.'
- page: 3
  en: Matters stand strangely. To the King of Würtemberg everything has been forbidden, and the Congress
    has protested against his dispositions concerning the Estates. The post is about to go — I remain,
    until death, Your Serene Highness's. If it be possible, let Your Serene Highness send Eberhard in
    haste. Vienna, the 21st of March 1815. Faithful and most obedient servant v. Triebenfeld

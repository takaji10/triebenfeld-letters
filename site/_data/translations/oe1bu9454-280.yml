- page: 3
  en: 'Matters stand strangely — To the King of Württemberg everything has been forbidden, and the Congress
    has protested against his dispositions towards the Estates — The post is about to go — I remain, until
    death,


    Your Serene Highness''s. If it be possible, let Your Serene Highness send Eberhard here in haste.
    Vienna, the 21st of March 1815. Most faithful and obedient servant, von Triebenfeld'

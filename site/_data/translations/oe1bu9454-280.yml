- page: 2
  en: 'upon that I do not in the least reckon now – at present nothing can be done except to overrun Cosmar
    by the direct road, and, as I hope, the means for that will be found.


    In the matter of the Polish estates the Prince Chancellor has answered me the same thing that Your
    Serene Highness lately wrote to Zerbone - and I am not to write to the Emperor; the great ones take
    it upon themselves, pay one another compliments in order to sell off the men of business, God and
    the world. Napoleon is now rousing the all-powerful out of their slumber again - it is only to be
    feared that he will throw them out of their coherence. With swift steps the esteemed one hastens toward
    Paris - and although strong corps of ours and of others stand on France''s borders, no one will stir
    before, with all this complimenting to and fro, Bonaparte shall be in Paris - O tempora, o mores.


    Wellington set off today for the army – and in a few days, it is said, Talleyrand too would depart.
    Between Talleyrand and the Emperor Alexander there was a violent conversation in Wellington''s hotel
    - Talleyrand told the Emperor straight out that he was to blame for everything, and that the blood
    which would now flow again would all come upon his head, and that he alone must one day answer for
    it before God.


    On all sides they are marching, and never did it look more warlike than now - Meanwhile people wager
    that there will be no general war.


    They have tried to steal the little King of Rome away from here. Relays have been laid as far as the
    Rhine; in all places 8 horses have stood in readiness — Today it is even said here that Monsieur has
    been taken prisoner by Bonaparte; there is nothing official about it, and consequently the thing is
    not believed either. The King went out to meet Bonaparte from Paris as far as Melun, but this too
    is doubted.'

- page: 2
  en: 'on that I now do not count in the least — at present nothing can be done but to run Cosmar down
    by the direct road, and, as I hope, the means for that will be found — In the affair of the Polish
    estates the Prince Chancellor has answered me the same as Your Serene Highness lately wrote to Zerboni
    — and to the Emperor I am not to write. The great ones take it upon themselves, they pay one another
    compliments in order to sell off the men of business, God and the world — Napoleon is now again rousing
    the all-powerful out of their slumber — it is only to be feared that he will throw them out of their
    coherence — With swift steps the respected one hastens towards Paris — and although strong corps of
    ours and of others stand on France''s frontiers, yet nobody will stir before, over all this complimenting
    back and forth, Bonaparte will be in Paris — O tempora, o mores!


    Wellington went off to the army today — and in a few days, it is said, Prince Talleyrand would also
    depart. Between Prince Talleyrand and the Russian Emperor Alexander there has been a violent conversation
    in Prince Wellington''s hotel — Prince Talleyrand told the Russian Emperor straight out that he was
    to blame for everything, and that the blood which would now flow again would all come upon his head
    and that he alone must one day answer to God for it — on all sides there is marching, and never did
    it look more warlike than now — Meanwhile people wager that there will be no general war — the little
    King of Rome they wanted to steal away from here; relays have been laid as far as the Rhine, in all
    places 8 horses have stood in readiness — Today it is even said here that Monsieur has been taken
    prisoner by Bonaparte; there is nothing official about it and consequently the thing is not believed
    either — The King went out to meet Bonaparte from Paris as far as Melun, but this too is doubted —'

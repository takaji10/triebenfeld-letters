- page: 3
  en: 'Matters stand strangely. To the King of Württemberg everything has been forbidden, and the Congress
    has protested against his dispositions against the Estates. The post is about to go - I remain, until
    death,


    Your Serene Highness''s. If it be possible, let Your Serene Highness send Eberhard in haste. Vienna,
    the 21st of March 1815. Faithful and most obedient servant v. Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    This very hour I received Your Serene Highness''s two honoured letters of the 10th and the 13th. With
    the most heartfelt distress I gather from them that nothing will come of Mr. Eberhard''s coming here.
    It is a very sad case that no real settlement with the Burisch heiresses has been brought about, and
    it is to be feared that Cosmar and Stägemann will rely and prop themselves solely upon this circumstance
    alone, and will now let the matter drag along the long road. Had Eberhard come here, he would have
    obtained the sure declaration of the Princesses, and even if at 50 or 100 ℔ dearer, one would certainly
    have obtained the approbation of the Royal and State Chancellor for the advance of the monies, and
    nothing further would have happened than that the administration would have lasted some years longer;
    a fresh [uncertain: writ of remittance] that the King absolutely did not wish to concern himself with
    the matter, one would have procured here [uncertain: narrowly], and then Eberhard would certainly
    have had an easy and [illegible] game of it - for from Eberhardt''s letter, according to which Hennenberg
    has forbidden any settlement - and from the talk of Mr. p. Stägemann I now surmise well enough that
    everything is founded upon the King''s having promised the heiresses to settle the matter by the time
    of his return - to get hold of that would meanwhile, given the present warlike prospects, be an easy
    thing. It requires only Eberhard''s presence, the more so as the Electoral Princesses are in need
    of money - that in the old Prince''s testament such a Robulistic, knavish bolt has been shot across
    on account of Adolph''s coming of age - impedes much - I thought as much at once - what can he do
    even if he is called Majorain and may dispose of nothing – The one thing would be that he too might
    complain of Cosmar''s administration and be of help toward the complete overpowering of the fellow;
    that Prince August has not yet revoked the power of attorney is more than dreadful. If, however, he
    does not do so, then he shall taste nothing of his 18000 Rthl out of the entailed estates in the first
    20 years - the 100000 Rthl he will unhappily have to see. Rapiers indeed has Mr. Cosmar - meanwhile
    these now stand tolerably well. Only God knows for how long. B., who commends himself most respectfully,
    now looks daily for Poustales'' arrival - With K. Adolph nothing is to be done in the matter of Voschentin
    -'

- page: 1
  en: '280


    Most Serene Prince


    Most gracious Lord!


    This very hour I received Your Serene Highness''s two esteemed letters of the 10th and the 13th. With
    the deepest affliction I gather from them that nothing is likely to come of Mr Eberhard''s coming
    here. Very sad is the case that no real settlement has been brought about with the Courland heiresses,
    and it is to be feared that Cosmar and Stägemann will rely and prop themselves upon this circumstance
    alone, and will now let the matter drag along the long road. Had Eberhard come here, he would have
    obtained the certain declaration of the princesses, and even if at 50 or 100 thousand Rthl dearer,
    one would certainly have obtained the approbation of the Royal and State Chancellor for the advance
    of the monies, and nothing further would have happened than that the administration would have lasted
    some years longer. A fresh alarm-shot, namely that the King is absolutely unwilling to concern himself
    with the matter, one would have effected [uncertain: quickly] here, and then Eberhard would certainly
    have had an easy and [illegible] game of it — for from Eberhard''s letter, according to which Henneberg
    has forbidden any settlement — and from the words of Mr Stägemann I now well guess that the whole
    is grounded on the King having promised the Courland heiresses to settle the matter after his return
    — to get hold of that would meanwhile, with the present warlike prospects, be an easy thing. It requires
    only Eberhard''s presence, the more so as the Courland princesses are in need of money — that in the
    old Princes'' testament such a pettifogging, knavish bolt has been shot across regarding Prince Adolph''s
    coming of age — hinders much — I thought as much at once — what can he do even if he is called lord
    of the entailed estate and may dispose of nothing — It would be the one thing, that he might join
    in complaining of Cosmar''s administration, and be helpful in the complete overpowering of the fellow
    — that Prince August has still not revoked the power of attorney is more than dreadful. If, however,
    he does not do so, he shall not taste anything of his 18000 Rthl out of the entailed estates for the
    first 20 years — the 100000 Rthl he will unhappily have seen — papers indeed Cosmar has — Meanwhile
    these now stand fairly well. Only God knows for how long — Barbe, who presents his most respectful
    compliments, now looks daily for Pourtalès''s arrival — With Prince Adolph nothing is to be done concerning
    Koszęcin —'

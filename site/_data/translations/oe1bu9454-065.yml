segments:
- page: 1
  en: '65


    Most Serene Prince,


    Most gracious Prince and Lord!


    The Głogów Landschaft, together with v d Lahr, united with the [illegible] Higher Land Court, have
    stripped me to the very bones — I am a true Lungenheim and live with my youngest son on Erloffeln,
    bread, salt and Wester — Yet I am happier than a god, for I now see the end of my sufferings. The
    day after tomorrow the commission arrives which is to settle me out of the sequestration. Then I shall
    again be master of my estates — which for so long, through no fault of my own, I have had to look
    upon with my back turned.


    As soon as the commission departs, I too shall take to the road and come to Sławięcice. To that end
    I am writing to Lombardini that he is to send only 40 Friedrich d''or. Your Serene Highness has permitted
    20[uncertain], but I beg him for 40 pieces, because I must make a detour — It does me wohn to take
    money in this manner, but as God is true I cannot at present help myself otherwise — At the New Year,
    when my tenant moves in and I receive monies from several quarters, I shall be able to give it back.
    Now I have a plan by which I mean to make a trial, whether after all the sufferings I have endured
    I cannot procure myself some advantage. I mean to buy iron for cash money and turn it over against
    spirits. Nobody buys the iron, but spirits go to Saxony and everywhere else. Now my request is that
    the Koszęcin ironworks lend me, until the 18th of February[uncertain], 300 Centner of iron against
    the bill of exchange enclosed herewith. I shall then pay promptly and in cash. I give for the Centner,
    delivered free as far as'
- page: 2
  en: 'the Bojadła landing-place, 4 Rthl 12 Groschen in coined Courant, that is to say, reckoning the
    Rthl at 45 fg.


    Should Your Serene Highness be willing to show me this favour, may you most graciously be pleased
    to set the matter in train there in such a way that the 300 Centner of bar and hoop iron be sent to
    me with all possible speed, carriage paid as far as Bojadła. I shall then pay promptly according to
    the enclosed bill of exchange. Only I beg most devotedly that there the ship''s freight and any costs
    as far as Bojadła be contracted for and settled, so that there may not again occur a like miscarriage
    as with the transport of the Einkaufend Leuth, where the boatmen took for the freight and costs so
    much iron, and sold it, that I received only 751 Centl. God! with a shudder I think back on that forever
    accursed affair. The claim of the Invalids'' Fund amounted all in all to 3125 Rthl. [uncertain: Wünste]
    when the French arrested me, to fall into the claws of the usurers, from Lahr 5040 and from Holz Apfel
    1000 Rthl to take papers, but to give a bond for it in cash — for this whole rubbish-heap I received
    2003 Rthl Courant. My goods I put down, what I laid out in my travel costs, at 1160 Rthl. Now I was
    bare and my credit was gone = 3173 Rthl. The 3 months flew by very swiftly. Zastrow and Grevenitz
    wished to take precedence; I was to be clapped up da capo; I borrowed from him at cost so[uncertain]
    9000 Rthl in papers and deposited these; these I have indeed given back, but they cost in interest
    and brokerage 750 Rthl Courant — thereupon came the 3000 r. from Your Serene Highness, of which I
    gave Lahr 2000 r.; the rest went on interest, legal costs and brokerage. I remained 3000 in debt to
    Lahr and 1000 Rthl to Holz Apfel. I was not permitted to leave Berlin, and ate my way through 2400
    Rthl. — all this drew after it the consequence that my creditors went mad,'
- page: 3
  en: 'sequestrated my estates, and Lahr had me distrained upon — The Berlin debt now amounted, without
    legal costs, for which people now reckon, together with interest, some 700 Rthl., to 7100 r. Arrears
    of interest from the estates through the 2 years of war came to 18000 Rthl., thus together 25100 Rthl.
    All this will, with God''s help, be discharged by Christmas and I shall be rid of all distress. The
    feeling is not to be described. Honour, property and all stood at stake. It horrifies me when I think
    back — faced with the alternative whether I should endure this once more or suffer death, I shall,
    by God, cry out — Strike away, friend Ham.


    For the future I will guard myself against a relapse of this kind, and therefore I seek out sources
    such as the one overleaf with the iron and spirits trade — Do grant, most gracious Prince and Lord,
    this my request, and send the 300 Centl. of iron; I shall then truly pay promptly — Five days ago
    I heard here from several quarters that Your Serene Highness''s case had been justly decided, and
    that His Highness had been appointed General Governor of Silesia. Would to God that this news were
    ſohnen confirmed. In 1 days the messenger may well be back, and then my commission will likely be
    concluded, whereupon I can at once set out from here by way of Kłodzko and


    f. w. for Sławięcice. Only I should gladly have Your Serene Highness''s answer concerning the 300
    Rthl of iron — In substance it may be Schien Ersten for me, — to await it here still, and thereafter
    to make the arrangements for the turnover against spirits. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    A certain Margraff from Berlin writes


    today that the Prince Sacken is very weak.


    I do not know what there is in it — It is,


    this [illegible] [illegible] honest man —


    Konotop


    the 9th of October


    1809.


    most faithful and humble and obedient servant


    v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The Glogau Landschaft, together with v. d. Lahr,
    joined with the Glanz [uncertain: Glanz] Higher Provincial Court, have stripped me to the very bone
    — I am a true Lungenheim, and live with my youngest son on [uncertain: Erloffeln] bread, salt and
    Wester- Meanwhile I am happier than a god, for I now see the end of my sufferings. The day after tomorrow
    the Commission arrives which is to part me from the sequestration, which I have so long been to [uncertain:
    sezzen — set/place]. Then I shall once more be master of my estates, though through no fault of my
    own I shall have to look upon them with my back turned. As soon as the Commission departs I too shall
    take to the road and come to Schlawenschitz. To that end I am writing to Lombardini that he need only
    [uncertain: schaden — do damage/be harmed] 40 pieces. Your Serene Highness have, as permitted, but
    I beg him for 40 pieces, because I must make a desous — He does me well in the manner of taking money,
    but, as God is true, I cannot help myself otherwise at present — At New Year, when my tenant moves
    in and I receive monies from several quarters, then I can give again. Now I have a plan by which I
    mean to make a trial, whether I may not procure myself some advantage after all the sufferings I have
    endured. I mean to buy iron for ready cash and to turn it over in exchange for spirits. Nobody buys
    the iron, but spirits go to Saxony and to all quarters. Now my request is that the Koschäntner foundry
    may lend me 300 Centner of iron until the 18th of January against the bill of exchange enclosed herewith.
    I shall then pay promptly and in cash. I give for the Centner up to'
- page: 2
  en: 'delivered free to the Boyadel wharf, 4 Rthl 12 g. in coin Courant, that is to say reckoning the
    Rthl at 45 s. Should Your Serene Highness be pleased to show me this favour, may you most graciously
    deign so to arrange the matter there that the 300 Centner of bar and hoop iron be sent to me with
    all possible speed, carriage-free as far as Boyadel. I shall then pay promptly according to the enclosed
    bill of exchange. Only I beg most devotedly that the ship''s freight and any charges as far as Boyadel
    be contracted for and settled there, so that there may not again occur a like blunder as with the
    transport of the [uncertain: Einkaufend] people, where V.V. the boatmen took so much iron for themselves
    for the freight and the charges, and sold it, that I received only 751 Centner. God! With a shudder
    I think back on that eternally accursed affair. The claim of the Invalids'' Fund amounted, all in
    all, to 3125 Rthl. [uncertain: Wünste] — when the French arrested me, to fall into the clutches of
    the usurers, to take from Lahr 5040 and from Holz Apfel 1000 Rthl in paper, but to give bonds for
    it in cash-equivalent — for this whole mass of rubbish I received 2003 Rthl Cour. My belongings I
    laid out, what I had in my travelling expenses, at 1160 Rthl. Now I was stripped bare and my credit
    was gone: 3173 Rthl. The 3 months slipped away very quickly; Zastrow and Grevenitz meant to get the
    upper hand, I was to be locked up da capo, so I borrowed against a counter-bond some 9000 Rthl in
    paper and deposited it; this indeed I have given back, but it cost interest and brokerage 250 Rthl
    Courant — thereupon came the 3000 Rthl from Your Serene Highness, of which I gave [uncertain: Jahr
    — Lahr?] 2000 Rthl, the rest went on interest, legal costs and proxeneticae; 3000 I remained owing
    to Lahr and 1000 Rthl to Holz Apfel. I was not permitted to leave Berlin, and ate my way through 2400
    Rthl there. All this had the consequence that my creditors went mad,'
- page: 3
  en: 'sequestrated my estates, and Lahr had me distrained upon — The Berlin debt now amounted, without
    legal costs, for which people now reckon, together with interest, some 700 Rthl, to 7100 Rthl. Arrears
    of interest from the estates through the 2 years of war came to 18000 Rthl, thus together 25100 Rthl.
    All this will, with God''s help, be discharged by Christmas, and I shall be delivered from all distress.
    The feeling is not to be described. Honour, goods and all stood at stake. I shudder when I think back
    — faced with the alternative whether I should endure this once again or suffer death, I shall call
    upon God — [uncertain: Hau zu Freund Ham.] For the future I mean to guard myself against a recidive
    of this kind, and therefore I seek out sources such as the one overleaf, with the trade in iron and
    spirits. Grant then, Most gracious Prince and Lord, this my request, and send the 300 Centl of iron;
    I shall then truly pay promptly. Five days ago I heard here from several quarters that Your Serene
    Highness''s cause had been justly decided, and that Your Highness had been appointed General Governor
    of Silesia. Would to God that this news might be confirmed for you [uncertain: ſohnen], d. In 1 days
    the messenger may well be back, and then my Commission will probably be concluded, whereafter I can
    at once set out from here by way of Glatz and so forth to Schlawenschitz. Only I should gladly have
    Your Serene Highness''s answer regarding the 300 Centner of iron — at bottom it need be bar iron for
    me — and would wait here for it, in order thereafter to make the arrangements for the turnover against
    spirits. In deepest reverence I remain, until death, Your Most Serene Highness''s — A certain Margraff
    from Berlin writes today that the Prince''s affairs are very much weaker — most humble and obedient
    servant — I do not know what there is in it — It is, v Triebenfeld. Kontop, the 9th of October 1809.'

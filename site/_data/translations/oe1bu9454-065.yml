status: draft
segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    The Glogau Landschaft together with von der Lahr, joined with the [uncertain: Glanz] Higher Land Court,
    have stripped me to the very bones — I am a true [uncertain: Lungenheim] and live with my youngest
    son on [uncertain: Erloffeln] bread, salt and water — Meanwhile I am happier than a god, for I now
    see the end of my sufferings. Day after tomorrow the commission comes which is to settle me out of
    the sequestration that I am so long to [uncertain: set]. Then I shall again be master of my estates,
    which through no fault of my own I have had to look at with my back turned. As soon as the commission
    departs I too shall take to the road and come to Schlawenschitz. To that end I am writing to Lombardini
    that he should only [uncertain: damage] 40 pieces. Your Serene Highness have, as permitted, but I
    beg him for 40 pieces because I must make a [uncertain: desous] — It does indeed suit me to take money
    in this manner, yet, as God is true, I can help myself no otherwise at present – At New Year, when
    my tenant moves in and I receive monies from several quarters, then I can give again. Now I have a
    plan whereby I mean to make a trial, whether I cannot procure myself some advantage after all the
    sufferings I have endured. I mean to buy iron for cash money and to turn it over against spirits.
    Nobody buys the iron, but spirits go to Saxony and in every direction. Now my request is that the
    Koschentin foundry lend me 300 hundredweight of iron until the 18th of January against the bill of
    exchange herewith enclosed; I shall then pay promptly and in cash. I give for the hundredweight, up
    to'
- page: 2
  en: 'the Boyedler depot delivered free, 4 Rthl 12 g. in coin Courant, that is, the Rthl reckoned at
    45 s.


    If Your Serene Highness will show me this kindness, then may you most graciously be pleased to set
    the matter in train there in such a way that the 300 hundredweight of bar and hoop iron be sent to
    me at the very soonest, carriage paid to Boyadel. I shall then pay promptly according to the enclosed
    bill of exchange. Only I beg most devotedly that the ship''s freight and any costs as far as Boyndel
    be contracted for and settled there, so that there does not again occur a like error as at the transport
    of the [uncertain: Einkaufend] people, where


    V.V. the boatmen took so much iron for the freight and costs, and sold it, that I received only 751
    hundredweight. God! with a shudder I think back on that forever accursed affair; the demand of the
    Invalids'' Fund amounted all in all to 3125 Rthl. [uncertain: Wünste] then, when the French arrested
    me, to fall into the claws of the usurers, to take 5040 in papers from Lahr and 1000 Rthl from Holz
    Apfel, but to make out a bond for them in cash-value — for all this rubbish I received 2003 Rthl Courant.
    My belongings I laid out, what I [put] to my travel costs with 1160 Rthl. Now I was bare and my credit
    was gone


    3173 Rthl. The 3 months passed very quickly; Zastrow and Grevenitz meant to come forward, I was to
    be clapped up da capo; he lent, on the contrary, some 9000 Rthl in papers and deposited these; these
    I have indeed given back, but they cost me interest and brokerage 250 Rthl Courant — thereupon came
    the 3000 Rthl from Your Serene Highness, of which I gave 2000 Rthl [uncertain: Jahr]; the rest went
    on interest, lawsuit costs and brokerage; there remained 3000 owing to Lahr and 1000 Rthl to the [uncertain:
    Holzbefel]. I was not permitted to remove myself from Berlin, and ate my way into 2400 Rthl fast;
    all this drew the consequence after it that my creditors went mad'
- page: 3
  en: 'sequestrated my estates, and Lahr had me distrained upon — The Berlin debt now amounted, without
    lawsuit costs, for which people now reckon, together with interest, some 700 Rthl, to 7100 Rthl. Arrears
    of interest from the estates through the 2 war years came to 18000 Rthl, thus together 25100 Rthl.
    All this will, with God''s help, be discharged by Christmas and I shall be freed of all distress.
    The feeling is not to be described. Honour, goods and everything stood at stake. It makes me shudder
    when I think back — I shall, faced with the alternative whether I should endure this once again or
    suffer death, call upon God — [uncertain: Hau zu Freund Ham].


    For the future I will guard myself against a relapse of this kind, and therefore I seek sources such
    as the aforesaid with the iron and spirits trade. Do grant, most gracious Prince and Lord, this my
    request, and send the 300 hundredweight of iron; I shall then truly pay promptly. Five days ago I
    heard here from several quarters that Your Serene Highness''s cause had been justly decided, and that
    you had most highly been appointed General Governor of Silesia. Would to God that this news were confirmed
    [uncertain: ſohnen],


    d. In 1 days the messenger may well be back, and then my commission will probably be finished, whereupon
    I can then set off at once from here by way of Glatz and


    f. w. to Schlawenschitz. Only I should gladly have Your Serene Highness''s answer concerning the 300
    Rthl of iron — At bottom it may be bar iron for me, – to await it here still, in order thereafter
    to make the arrangements concerning the turnover against spirits. In deepest reverence I remain, until
    death,


    Your Most Serene Highness''s


    A certain Margraff from Berlin writes today that the Princes'' affairs are much weakened; most humble
    and obedient servant. I do not know what there is in it — It is,


    von Triebenfeld


    Kontop, the 9th of October 1809.'

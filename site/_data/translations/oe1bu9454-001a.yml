- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I [uncertain: rise to] Your Most Serene Highness''s most gracious pardon, that I [uncertain: watchman/warden]
    a letter just now received from the so sorely pressed Prince of Hohenlohe, to lay at the feet of the
    same, Most High, [uncertain: Lebensest] — of the boundless distress of this old [uncertain: both/upright]
    man no design of a picture can be made; he suffers unspeakably — Have mercy, Your Most Serene Highness,
    and [uncertain: soften/lands] the [uncertain: Blad] of the poor Prince, by the advance of 112,000
    Rthl. By that alone is the good Prince, languishing in the utmost need, saved. The Courland heirs
    (one for whose sake Cosmar has forced his way into the entailed estates alone, are at once entirely
    satisfied; Cosmar''s power has an end, and even His Majesty comes out ex nexa and will soon receive
    back, out of the great funds of the entailed estates, the advance of 112,000 R; every creditor receives
    his own bit by bit, and the Prince need hunger no more. As concerns the Trąbczyn estates in the Konin
    district, of which the Prince makes mention in his letter, thereupon I beg Your Serene Highness''s
    most gracious instruction — whether I may now submit the deeds and other documents.


    Your Most Serene Highness''s


    humble and obedient servant


    Vienna, the 12th of February


    1815'

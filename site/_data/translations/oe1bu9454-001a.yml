- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    I beseech Your Most Serene Highness''s most gracious pardon that I [uncertain: vogt] to lay at the
    feet of the same, a letter just now received from the so grievously beset Prince of Hohenlohe, most
    highly [uncertain: Lebensest]; of the boundless distress of this old [uncertain: both/two] man no
    sketch can be drawn, he suffers unspeakably - Have mercy, Your Most Serene Highness, and soften the
    [uncertain: Blad] of the poor Prince, by the advance of 112000 Rthl. Only by this means is the good
    Prince, languishing in the utmost distress, saved. The Courland heirs (against whose will Cosmar has
    forced himself alone into the entailed estates) are thereby at once entirely satisfied; Cosmar''s
    power is at an end; even His Majesty too comes out of the entanglement (ex nexu) and, given the great
    funds of the entailed estates, receives the advance of 112000 Rthl back before long; every creditor
    receives his own by degrees, and the Prince need no longer [uncertain: hängern]. As concerns the Trąbczyn
    estates in the Konin district, of which the Prince makes mention in his letter, upon that I beg Your
    Serene Highness''s most gracious instruction - whether I may now submit the deeds and other documents.


    Your Most Serene Highness''s


    humble and obedient servant


    Vienna, the 12th of February


    1815'

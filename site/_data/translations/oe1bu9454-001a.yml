- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! I beg Your Most Serene Highness''s most gracious
    pardon that I [uncertain: bailiff/venture] a letter just now received from the so very hard-pressed
    Prince of Hohenlohe, to lay at the feet of the same, Most High, [uncertain: Lebensest] — of the boundless
    distress of this old [both/two] man no sketch can be made; he suffers unspeakably. — Have mercy, Your
    Most Serene Highness, and [alleviate?] the [Blad] of the poor Prince, by the advance of 112000 Rthl.
    By that means alone is the good Prince, languishing in the utmost need, saved. The Courlandish heirs
    (by whose will Cosmar forced himself alone into the entailed estates) are at once entirely satisfied,
    Cosmar''s power is at an end, and even His Majesty comes ex nexu and, in view of the great funds of
    the entailed estates, will soon have the advance of 112000 Rthl returned; every creditor receives
    his own bit by bit, and the Prince need [hang/languish] no longer. As concerns the Trąbcziner estates
    in the Koniner district, of which the Prince makes mention in his letter, upon that I beg Your Serene
    Highness''s most gracious instruction — whether whether I may now submit the deeds and other documents.
    Your Most Serene Highness''s humble and obedient servant. Vienna, the 12th of Feb. 1815'

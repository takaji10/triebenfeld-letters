- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Views in general have altered very much since
    my last letters. The departures of the high Allies were, as I had the honour to report in my previous
    letter, so surely fixed for the 8th-9th-10th; now, however, a course of some 4 to 6 weeks'' length
    is still to be run through - and at this moment, after the turns of affairs that have set in, as good
    as nothing at all has happened - this means that in the matter of the Polish estates nothing can yet
    be settled with confidence. Meanwhile Your Serene Highness may hold yourself assured, in both the
    truly noble and friendly sentiments of His Serene Highness the [uncertain: Eur.] State Chancellor,
    of the best outcome. - In the principal matter the Prince has charged the Privy Councillor of State
    Stägemann to examine everything and thus to render a Serene Highness[''s] advisory report. It has
    been resolved today that a most high command shall go off at once to Berlin to the Herr M[inister]
    v. Kircheisen and the Finance Minister v. Bulow, His Excellency, pursuant to which a commission is
    to be appointed which shall investigate in the most thorough manner everything that Commer has done.
    Much, very much is gained; but in the principal matter, that is the composition with the Carisch heirs
    and the advance of 112000 Rthl, there I still lie before the field. The accompanying letter will be
    delivered again tomorrow morning to His Serene Highness the Prince. B - does not let go of the kissing;
    he too holds this to have succeeded. Infinitely sad it is for me that I am to act and live here without
    money, without thorough instruction, and without any authentic information. - I have, in and of itself,
    a many-headed Hydra to combat, and now without records and all proofs; the settlement of 1811 is not
    complete - the other settlements and the codicil I have never seen - what am I to say, and how am
    I to give him information? Deign to read the accompanying note, and think, most gracious Prince, [uncertain:
    how you would think] yourself in my place, since in the settlement, given to me only piecemeal, there
    stands nothing of this, that you pay, and that you have placed your divorced wife ex nexu. - The affair
    here requires head, heart and friends - without information, records and money it is the highest art
    nevertheless to accomplish anything. Stägemann I do not trust. He is a close friend of Zerboni and
    Cosmar - I count, however, upon all upon the [uncertain: Bodern] Prince State Chancellor[''s] Serene
    Highness. Make haste and send me, even if by a distant messenger, several proofs - and send me a few
    Blanquette - I shall certainly carry it through - Do not omit this, for already very much is gained
    and the further and greatest good will yet come to pass. My children, most gracious Lord, do you support
    in Breslau, so that these may not share the same fate with me and have to starve. The bad servant
    let Your Serene Highness by all means detain there - the fellow has shamefully deceived me. Painful
    it is that I have received no news from Your Serene Highness. In deepest reverence I remain, until
    death, Your Serene Highness''s Vienna, the 7th of December 1814. faithful humble and obedient servant
    v Triebenfeld'

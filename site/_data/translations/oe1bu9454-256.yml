  en: '256


    Most Serene Prince


    Most gracious Prince and Lord!


    The prospects in general have altered very much since my last letters — The departures of the high
    Allies were, as I had the honour to report in my previous letter, quite certainly fixed for the 8th-9th-10th,
    but now a course of from 4 to 6 weeks'' length is still to be run through — and at this moment, after
    the turns [uncertain: Tournare] that have occurred, as good as nothing at all has been done — this
    means that in the matter of the Polish estates nothing can yet be determined with any confidence —
    Meanwhile Your Serene Highness may hold yourself assured of the best outcome, in view of the truly
    noble and friendly disposition of his Serene Highness the Chancellor of State [uncertain: Ewr.] —
    In the principal matter the Prince has charged the privy councillor of state Stägemann to examine
    everything and to render to [uncertain: so durchlaucht] a report with his opinion — It was resolved
    today that a supreme command shall go off at once to Berlin, to Mr M. von Kircheisen and his Excellency
    the Finance Minister von Bulow, pursuant to which a commission is to be appointed which shall investigate
    in the most thorough manner everything that Cosmar has done — Much, very much is gained. But in the
    principal matter, that is the settlement with the Curish heirs and the advance of 112/m rt, there
    I still lie at anchor; the enclosed letter will be delivered again tomorrow morning to his Serene
    Highness the Prince. B[arbe] — does not let go, he too holds this to be as good as achieved — It is
    infinitely sad for me that I am to work and live here without money, without thorough instruction,
    and without any authentic information — I have in and of itself a many-headed hydra to fight, and
    now without files and without any proofs; the settlement of 1811 is not complete — the other settlements
    and the codicil I have never seen — what am I to say, and how is he [uncertain: ihn] to give information?
    Be pleased to read the enclosed note, and put yourself [uncertain: die dich], most gracious Prince,
    in my place, since in the settlement, given to me only piecemeal, there is nothing about your paying,
    and about your having placed your divorced wife out of the obligation (ex nexu) — the business here
    requires head, heart and friends — without information, files and money it is the highest art nevertheless
    to be effective — Stägemann I do not trust; he is a close friend of Zerboni and Cosmar — I count,
    however, on everything [uncertain: allem] upon the upright Prince, his Serene Highness the Chancellor
    of State. Make haste and send me, even if by a distant [uncertain: weiten] messenger, several proofs
    — and send me some blank forms — I shall certainly carry it through — Do not fail in this, for already
    very much is gained, and what further and greatest good there is will yet come to pass.


    My children, support them, most gracious Lord, in Wrocław, so that they may not have the same fate
    as I and be obliged to starve.


    The bad servant, may Your Serene Highness indeed have detained there — the man has deceived me shamefully.
    It is painful that I receive no news from Your Serene Highness. In deep respect I remain, until death,


    Your Serene Highness''s


    Vienna, the 7th of December


    1814.


    faithful and humble servant


    v Triebenfeld'

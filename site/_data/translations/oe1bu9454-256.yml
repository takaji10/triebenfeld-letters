segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The general prospects have altered greatly since my most recent letters. The departures of the high
    allies were, as I had the honour to report in my last, fixed with certainty for the 8th-9th-10th;
    but now a further course of 4 to 6 weeks'' length is to be run through - and at this moment, following
    the turns that have occurred, as good as nothing at all has been done - which means that in the matter
    of the Polish estates nothing can yet be determined with confidence. Meanwhile Your Serene Highness
    may hold yourself assured of the best outcome from the truly noble and friendly sentiments of His
    Serene Highness the State Chancellor. In the principal matter the Prince has charged the Privy Councillor
    of State Stägemann to examine everything and so to render an advisory report to His Serene Highness.
    It has been resolved today that a supreme command shall go off at once to Berlin to the Minister von
    Kircheisen and the Finance Minister von Bulow Excellency, pursuant to which a commission is to be
    appointed which shall investigate in the most thorough manner everything that Commer has done. Much,
    very much, has been gained; but in the principal matter, that is the settlement with the Caric heirs
    and the advance of 112000 Rthl, there I still lie at anchor. The accompanying letter will be delivered
    again tomorrow morning to His Serene Highness the Prince. B - does not let go, he too holds this to
    be as good as accomplished. It is infinitely sad for me that I am to work and live here without money,
    without thorough instruction, and without any authentic information - I have in and of itself a many-headed
    hydra to combat, and now without records and all proofs; the settlement of 1811 is not complete -
    the other settlements and the codicil [uncertain: Cordizik] I have never seen - what am I to say,
    and how am I to give him information? Deign to read the accompanying note, and put yourself, most
    gracious Prince, in my place, since in the settlement, which was given me only piecemeal, there stands
    nothing of the matter that you should pay, and that you have placed your divorced wife outside the
    nexus - the affair here requires head, heart and friends - without information, records and money
    it is the highest art to work to effect nonetheless. Stägemann I do not trust; he is a close friend
    of Zerboni and Cosmar - I count however on everything upon the Bodern Prince State Chancellor Serene
    Highness. Make haste and send me, even if by a distant messenger, further proofs - and send me some
    blank forms - I shall surely press through - Do not omit this, for already very much has been gained,
    and the further and greatest good will yet come to pass.


    Support my children, most gracious Lord, in Breslau, so that they may not share the same fate as I
    and must starve. The bad servant Your Serene Highness should by all means detain there - the fellow
    has odiously deceived me. It is painful that I have received no news from Your Serene Highness. In
    deepest reverence I remain, until death,


    Your Serene Highness''s


    Vienna, the 7th of December


    1814.


    faithful humble and obedient servant


    v. Triebenfeld'

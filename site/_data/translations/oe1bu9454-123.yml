- page: 1
  en: 'Late yesterday evening I received by express courier the enclosed letter from the aforesaid Kunckel,
    which I herewith [uncertain: at last] submit to Your Most Serene Highness, requesting Your high instructions
    as to my conduct. It is indeed necessary to reach an arrangement with von Otocki, and if this could
    be effected by amicable settlement, so that Otocki would be content with 1500 or 2000 ℔, it would
    be an advantageous and desirable thing. I leave it to Your Most Serene Highness''s highest discretion
    whether the power of attorney to settle should be given to Kunckel. That Kunckel and Jentsch moreover
    appear to be acting so much against one another causes me great concern – I fear that Kunckel, through
    his vehement bearing, will do foolish things, and Jentsch out of malice will make intrigues, which
    may prove prejudicial. My unpresumptuous counsel is to instruct these men well and to keep them within
    their bounds.


    Glenck did not come to me again yesterday, and has even left the Kontop accounts here, which would
    have given information upon everything in this matter.


    von Triebenfeld


    Breslau, 23rd April 1804'

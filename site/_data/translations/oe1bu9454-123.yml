- page: 1
  en: '123 Late yesterday evening I received by express courier the enclosed letter from Kunckel, which
    I herewith [uncertain: lezt] submit to Your Most Serene Highness, requesting Your instructions as
    to how I am to conduct myself. It is indeed necessary to come to an arrangement with von Otocki, and
    if this could be brought about by an amicable settlement, such that Otocki were content with 1500
    or 2000 rt., it would be an advantageous and desirable thing. I leave it to Your Most Serene Highness''s
    supreme judgement — whether the power of attorney for the settlement is to be given to Kunckel.


    That Kunckel and Jentsch, moreover, appear to be acting so much against one another arouses my great
    apprehension — I fear that Kunckel, by his vehement conduct, will do foolish things, and that Jentsch,
    out of malice, will make intrigues, which may prove prejudicial. My humble counsel is to instruct
    these men well and to keep them within their bounds.


    Glenck did not come to me again yesterday, and has even left the Konotop accounts behind here, which
    gave full information upon everything in this matter.


    Wrocław, the 23rd of April 1804


    v Triebenfeld'

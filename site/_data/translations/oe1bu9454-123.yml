- page: 1
  en: 'Late yesterday evening I received by express courier the enclosed letter from the said Kunckel,
    which I herewith [uncertain: at last] submit to Your Most Serene Highness, and I beg for Your High
    instructions as to my conduct. It is indeed necessary to come to an arrangement with von Otocki, and
    if this could be brought about by an amicable settlement, such that Otocki would be content with 1500
    or 2000 ℔, it would be an advantageous and desirable thing. I leave it to Your Most Serene Highness''s
    highest [uncertain: consideration] — whether Kunckel is to be given the full right to settle. That,
    moreover, Kunckel and Jentsch appear to be acting so much at cross purposes with one another arouses
    my great apprehension — I fear that Kunckel, through his vehement conduct, will do foolish things,
    and Jentsch, out of malice, will make intrigues, which may prove prejudicial. My humble counsel, which
    is not to be misapprehended, is to instruct these people well and to keep them within their bounds.
    Glenck did not come to me again yesterday, and has even left the Kontopp accounts here, which would
    have given information upon everything in this matter. v Triebenfeld, Breslau, the 23rd of April 1804'

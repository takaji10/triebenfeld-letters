- page: 4
  en: 'discharged, and after 9 years the incomes from Kopojno and the [uncertain: propriation] fall in,
    whereby one would draw a perpetually secure revenue of circa 14 to 15000 Rthl. What may be obtainable
    in cash at Oleśnica and Wrąbczyn, when both suits shall have been won, I cannot determine exactly
    in these times — meanwhile I count at least on 20000 Rthl in cash — that is, apart from the revenues
    set out overleaf. It is a sad thing that everything must be vindicated by lawsuits, and these are
    forever dragged out beyond half an eternity — thus the Meierowitz suit stands in the [uncertain: Vocande]
    No. 6, that is, there are still 5 suits standing before it, and I have already been lying in wait
    for that for 4 weeks. Nothing can be forced. For the rest, Cabanis is now rendering account of everything
    that has been taken in, what has been paid out in advance, and what stands outstanding in arrears,
    in the presence of the burgrave or of the komornik von Chomanowski; I insist upon it. Cabanis will
    bring the accounts himself to Schlawenschitz, so that You may be convinced before all the world of
    what has here been done and left undone. — I remain, until death, Your Serene Highness''s


    Blizanow, the 26th of June


    1812


    most obedient servant


    von Triebenfeld'

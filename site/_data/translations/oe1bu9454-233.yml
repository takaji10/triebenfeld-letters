- page: 4
  en: 'and after 9 years the revenues from Kopojno and the propination rights accrue, whereby one would
    draw a perpetually secure revenue of about 14 to 15,000 Rthl. What may be obtainable in cash at Oleśnica
    and Wrąbczyn, when both suits shall have been won, I cannot precisely determine in these times — Meanwhile
    I count on at least 20,000 Rthl in cash — that is to say, apart from the revenues set out overleaf.
    It is a sad thing that everything must be vindicated through lawsuits, and these are always dragged
    out beyond half an eternity — thus the Meierowitz matter stands in the [uncertain: Vocande] [uncertain:
    K]o[uncertain: b], that is, that 5 more suits are pending, and with that I have already been lying
    for 4 weeks before [uncertain: Ander] — Nothing can be compelled. For the rest, Cabanis is now rendering
    account of everything that has been received, what has been laid out in advance, and what stands outstanding
    in arrears, in the presence of the burgrave or komornik von Chomanowski; I insist upon it. Cabanis
    will bring the accounts to You himself at Sławięcice, so that You may [uncertain: um den Welt] convince
    Yourself what has been done and left undone here — I remain, until death, Your Serene Highness''s


    Blizanów, the 26th of June


    1812


    most obedient servant


    v Triebenfeld'

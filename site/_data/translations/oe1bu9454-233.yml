- page: 3
  en: 'that he said that, standing behind the Bayonne sum, he would likely never have anything to reckon
    on. Should this succeed for me, Your Serene Highness would again be quit of 50000 Rthl without impairing
    the substance of the estates. My 3rd plan would then be that Prince August should pay off the 50000
    Rthl coming to me at the Invalids'' Fund; the Invalids'' Fund would have to cede to me in return,
    and hereby every danger and execution would be removed for now and always. I would never seek execution,
    and the Bayonne interest is in 3 respects covered by the remaining revenues. They amount yearly to
    6000 Rthl, for the remaining interest must be discharged by the interest arrears now still [uncertain:
    assigned]; thus the matter now stands, that all interest-payers must for the future pay the canon
    and dues according to their contracts.


    Of the interest there would then at most remain to Your Serene Highness, after deduction of the Bayonne
    interest, over 4000 Rthl in cash. As soon as the Oleśnica matter is concluded these 2000 Rthl come
    in addition; from Wrąbczyn too some 1000 Rthl yearly might further accrue. Then You could count on
    7000 Rthl, would have 90000 Rthl of debts'

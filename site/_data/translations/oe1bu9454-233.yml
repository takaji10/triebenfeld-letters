- page: 2
  en: 'rent. The interest from the [uncertain: recherten] services, from the old peasants and from the
    Nybbel nevertheless remains to Your Serene Highness, and no creditor can oppose himself on that account.
    — Should Sobottendorff object that he would lose the interest on the rent paid in advance, it may
    be said to him that he must recover the same by good husbandry, and that by any other way he would
    still have long to wait for his satisfaction.


    In case Your Serene Highness approves this proposal and Mr. von Sobottendorff will enter upon it,
    he must come to me at Blizanow with all possible speed, where I then, when I shall be able to travel,
    will go with him to Drzewce, conclude, and send the matter to Your Serene Highness for execution.
    Next to this, Weigel has written me a very [uncertain: pressing] letter and asks my counsel how he
    might come at the 50000 M and his interest. Were it that Your Serene Highness should be pleased, I
    had here a like plan.


    I would write to Weigel and advise him to lease the demesne farm Kopojno together with the propination
    rights for 9 years at 6000 Rthl yearly; this amounts for 9 years to 54000 Rthl. — Of the 4000 he must
    at once pay over 2000 Rthl in cash to the treasury, which are said to have remained outstanding from
    1805 through the sequestrator Badynski; as to the interest on the rent advanced, Mr. Weigel may see
    how he brings the same out by good management — I shall tell him'

- page: 2
  en: 'rent. The interest from the [uncertain: recherten] services, from the old peasants and from Ribbeck
    nonetheless remains to Your Serene Highness, and no creditor can oppose himself in that regard — Should
    Sobottendorff object that he loses the interest on the rent paid in advance, it may be said to him
    that he must recover such by good husbandry, and that by any other route he will have to wait a long
    while yet for his satisfaction.


    In case Your Serene Highness approves this proposal and will engage Mr von Sobottendorff, then he
    must come to me at Blizanów with all possible dispatch, where I, when I shall be able to travel, will
    go with him to Drzewce, conclude the matter, and send it in to Your Serene Highness for execution.
    Next to this Mr Weigel has written me a most [uncertain: kriegenden] letter and begs my advice how
    he might come by the 50,000 Rthl and his interest. Were it that Your Serene Highness should be pleased,
    I had here a like plan.


    I would write to Weigel and advise him to lease the demesne farm Kopojno together with the propination
    rights for 9 years at 6,000 Rthl yearly, which amounts over 9 years to 54,000 Rthl — of the 4,000
    he must at once deliver 2,000 Rthl in cash to the treasury, which are said to have remained outstanding
    from 1805 through the sequestrator Badynski; as for the interest on the rent advanced, Mr Weigel may
    see how he brings the same out by good husbandry — I shall tell him'

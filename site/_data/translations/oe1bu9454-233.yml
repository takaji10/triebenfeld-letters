  en: '233


    Most Serene Prince


    Most gracious Prince and Lord, Mr Sommer lately told me that a certain von Sobottendorff with his
    2 sons was staying with Your Serene Highness, to whom You owe 40,000 Rthl, and who on that account
    is most exceedingly burdensome to Him. Despite my illness I have given thought to how this man might
    be composed with, and at once satisfied as to his whole demand.


    My advice is to lease Drzewce to von Sobottendorff for 18 years; the rent is reckoned at 2,000 Rthl
    per year, which amounts over 18 years to 36,000 Rthl. In Swięcia 4 colonists'' holdings are vacant,
    since the occupiers declared themselves insolvent, and before the court of conciliation the matter
    was settled thus, that if 200 Rthl were given to the 2 Berle[illegible] and 100 Rthl to the one, they
    would vacate the holdings at once. The one with 100 Rthl has already been settled with, and the 200
    Rthl must still be found. These 4 holdings, each reckoned at 1,000 Rthl, one gives to the two young
    Sobottendorffs; that would amount to 40,000 Rthl, whereby the debt would be discharged. Sobottendorff
    returns Mr Serene Highness us the debt instrument receipted, and Your Serene Highness gives him a
    receipt for the 18 years'''

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Mr. p. Sommer told me lately that a certain von Sobottendorff, with his 2 sons, was staying with Your
    Serene Highness, to whom You owed 40000 Rthl, and who was on that account most exceedingly troublesome
    to You. Despite my illness I have given thought to how this man might be quieted and at once settled
    with in respect of his whole claim.


    My counsel is to lease Drzewce to von Sobottendorff for 18 years; the rent is reckoned yearly at 2000
    Rthl, which amounts over 18 years to 36000 Rthl. In Swixce 4 colonists'' holdings are vacant, for
    the possessors declared themselves insolvent, and before the court of conciliation the matter was
    arranged, that if the 2 from Berlin were given 200 Rthl and the one 100 Rthl, they would vacate the
    holdings at once. The one with 100 Rthl has already been settled with, and the 200 Rthl have still
    to be found. These 4 holdings, each reckoned at 1000 Rthl, one gives to the two young Sobottendorffs;
    that would amount to 40000 d_, and the debt would be discharged. Sobottendorff returns to Your Serene
    Highness the bond of debt receipted, and Your Serene Highness gives him a receipt for the 18 years'''

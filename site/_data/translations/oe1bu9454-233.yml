- page: 3
  en: 'that he said that, standing as he does behind the Bayonne sum, he would probably never have anything
    to reckon on. Should this succeed for me, then Your Serene Highness would again be quit of 50,000
    Rthl, to alter for them the substance of the estates. My 3rd plan would then be that Prince August
    should pay off to the Invalids'' Fund the 50,000 Rthl coming to me; the Invalids'' Fund would in return
    have to [uncertain: ladien] to me, and hereby all danger and execution would be removed for now and
    always. I would never seek execution, and the Bayonne interest is 3 [uncertain: Sach] covered by the
    remaining revenues. They amount yearly to 6,000 Rthl, for the outstanding interest must be discharged
    by the interest arrears still now shown; even so the matter now stands, that all the interest-payers
    must for the future pay the canon and the dues according to their contracts.


    Of the interest there would at the highest remain to Your Serene Highness, after deduction of the
    Bayonne interest, over 4,000 Rthl in cash. As soon as the Oleśnica matter is concluded these 2,000
    Rthl accrue; from Wrąbczyn likewise as much as 1,000 Rthl yearly might fall in addition. Then You
    could count on 7,000 Rthl, and would have discharged 90,000 Rthl of debts'

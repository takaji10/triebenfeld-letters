- page: 1
  en: 'Document no. 20


    Mieszko, Duke of Poland, 31 August 1173, at Gniezno; gives the estate of Wrąbczynek to the monastery
    of Ląd.


    Original on parchment. The lower edge, folded over, shows 4 small holes for hanging the seal, in one
    of them threads of yellow silk. The script seems to be of the first half of the thirteenth century.
    The seal is lost.


    Library of the Princes Czartoryski. Diplomata, vol. I, no. 1.


    In the name of the Lord, amen. Forgetting is a stepmother to memory, and the course of deeds is darkened
    by the length of time, unless it is made known to those who come after by the living tokens of letters.
    Therefore I, Mieszko, by the grace of God Duke of Poland, make known to those present and to come
    that, meaning to increase the favour and grace which I bear especially towards the brothers of the
    Cistercian Order of the house of Ląd, of our foundation, so that they may the better persevere in
    the service of the name of God, at the request of the pious father Lord Bertold, abbot of that monastery,
    and of his devout convent, I have given them our estate called little Vronchin, with salt, lakes,
    fishing and hunting, and the other uses there at present and to come, free of all the rights of Poland
    by whatever names they are called, to be possessed by hereditary right. Witnesses of this are: Jarost,
    palatine of Kalisz; Bronis, castellan of Gniezno; Odolan the cupbearer; Ilik the chaplain; and many
    others worthy of trust. Given at Gniezno in the year of the Lord one thousand one hundred and seventy-three,
    on the day before the Kalends of September, in the sixth indiction. And that this may remain valid
    and firm, we have had the present document strengthened by the hanging of our seal.


    Lendensis, that is of Ląd. Parvum Vronchin, today Wrąbczynek.'

- page: 1
  en: 'Vienna, 17 March [18]15


    To the Right Honourable the councillor of war von Triebenfeld


    here


    No. 1915.


    To Your [etc.] I [uncertain: again I also] the representation of the 2nd of this month, returning
    the enclosures of the same: that with regard to the compensation of those donees of South Prussian
    estates from whom possession has been withdrawn since the peace of Tilsit, a diplomatic negotiation
    has been opened, the result of which will be communicated in due course to the [uncertain: of the
    cost] Prince of Hohenlohe. As concerns the [uncertain: Bedeuten] of the Frankfurt bank, Mr [illegible]
    Leixner, it is, according to the state of the matter, not the dispossession from the Kolno and Kamionna
    estates that has brought him into the judicial investigation and the [uncertain: Vorzug / preference],
    but rather the irregular administration of his post, and in particular also the impermissible act
    whereby he borrowed upon the asset registered on Kolno and Kamionna for the merchant Simon at its
    full [uncertain: value] and [uncertain: bauen Beständen der Buch] still to me at a time when the [uncertain:
    taking of possession] of the estates by [uncertain: the lady] von Miączyńska was already known to
    him.


    Vienna, 17 March [18]15.


    In His Serene Highness''s name.


    Stägemann.


    Hardenberg.'

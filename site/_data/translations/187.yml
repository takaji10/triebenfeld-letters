status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! The powers of attorney and the blank forms have
    arrived; of the former I have at once made the necessary use, and I am now assured of the best success
    — through the mediation of the worthy General and of the other gentleman — the Lord Grand Chancellor
    will give 90000 Rthl out of the Justice Fund — out of this I shall pay the 3 most restive creditors
    — that is, Weigel, the Schlabrendorff woman, and Lichnowski. The last-named must return to me 20000
    Rthl upon a Schweiner mortgage which I pledge to him; 10000 Rthl I must contrive to raise in some
    such way, and then Your Serene Highness will receive the desired 30000 Rthl. It is a bad business
    that the mortgage certificate of the Zagorow and Trąbczin estates is so motley; no one will lend further
    upon it — what is given is against jura caisa. Still, everything will let itself be arranged little
    by little. My one endeavour is only to be rid soon of Oppenheimer, who last year promised to give
    160000 Rthl and worked upon Amelang,
- page: 2
  en: 'so that I may recover the mortgage of 250000 Rthl. The scoundrel had claims of his own upon Olesnica:
    20000 fl. He undertook to pay the Invalids'' Fund 50000 Rthl, Lichnowski 36000, Meyer Bernhard 7600.
    That makes 113600 Rthl. Of all these he has paid only 32000 Rthl to Lignowchen, together with the
    money which Your Serene Highness received at Fürth, and notwithstanding this the fellow reckons the
    whole Pro[uncertain: x]enitirum[uncertain] at 11000 Rthl. Once I am clear of Weigel and of the other
    man, I shall apply everything to paying this Gmür what he has actually given, and shall at once procure
    the return of the above-named mortgage, which is thereby eo ipso annulled, whereby the affair will
    then take on quite another shape. Today I go to Beteche, and there to put everything in order, in
    particular to stop the mouth of the wretched Jew, Meyer Bernhard. The fellow has brought suit against
    Your Serene Highness, notwithstanding that I had made it known to the villain that His Majesty had
    approved the Betsch'
- page: 3
  en: 'leasing-out, and had removed all difficulties in such fashion that Your Serene Highness were released
    from the obligation ex nexu. From Betschen I go to Kalisz and Trąbczyn, arrange everything there,
    see what money I can gather together in that quarter, and hasten hither with it in order to level
    out the principal matter here. Eighteen days from today I think to be in Berlin again, and if all
    now goes as wished, then I shall perhaps myself bring to Öhringen the sum desired by Your Serene Highness.
    The constellations, for the rest, are now very evil, and it is much wished here that Your Serene Highness
    might only be quite soon fully restored to health, and that you would take your return journey by
    way of Berlin. Through my long stay here I was lately very nearly placed in a favourable [uncertain:
    Lutuation]. The Glogau Government had ordered that the von Wulffen woman be paid the 30000 Rthl which
    stand upon Kontoppt. The mandates had been left lying in Breslau, so that I knew nothing of it, until
    they came down upon my neck here. In the meanwhile the upright General helped at once — he gave me
    in cash what I needed, and the Lord Grand Chancellor had 200000 Rthl paid upon one mortgage, and thus
    these two honest men furnished me — Now I have complete quiet and can attend to all Your Serene Highness''s
    affairs. With unbounded veneration I remain, as Your Serene Highness''s Berlin, the 17th of June 1806.
    faithful, humble and obedient servant v Triebenfeld'

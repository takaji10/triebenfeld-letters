- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    From the purchase contract of the 28th September of this year, appended here in Copy, and its enclosures,
    Your Most Serene Highness will most graciously be pleased to gather that Sigismund von Rzadkowski
    has sold the hereditary quit-rent estate situated in Głazewo to his half-sister, Susanna née Treben.
    Since now the right of pre-emption belongs to Your Most Serene Highness, we beg that the same (the
    contract has been approved under reservation of the Princely rights) may most graciously declare within
    S. weeks whether the same wishes to make use of the right of pre-emption; because after the lapse
    of this term it is assumed, in accordance with the laws, that the same has renounced this right in
    this instance.


    She/We remain, in deepest reverence, Your Serene Highness''s


    most humble and obedient


    The Court Office here


    Metzig


    Neumann


    Betsche


    the 10th April 1805'

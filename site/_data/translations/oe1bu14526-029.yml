segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    From the deed of sale of the 28th of September of the current year, appended here in Copy, and from
    its enclosures, Your Most Serene Highness will most graciously be pleased to gather that Sigismund
    von Rzadkowski has sold the hereditary quit-rent estate situated in Głazewo to his half-sister Susanna,
    née Treben. Since now the right of pre-emption belongs to Your Most Serene Highness, we beg the same
    most highly (the contract has been approved under reservation of the princely rights) most graciously
    to declare, within S. weeks, whether the same most highly will make use of the right of pre-emption;
    because, after the expiry of this term, it is assumed in accordance with the laws that the same most
    highly relinquishes this right for the present case.


    In which we persist with deepest reverence, Your Serene Highness''s


    most humble and obedient


    The Court Office of this place


    Metzig


    Neumann


    Betsche


    the 10th of April 1805'

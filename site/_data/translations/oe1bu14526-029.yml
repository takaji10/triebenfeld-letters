- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    From the deed of sale of the 28th September c. a., appended herewith in Copy, and from its enclosures,
    Your Most Serene Highness will most graciously be pleased to gather that Sigismund von Rzadkowski
    has sold the hereditary quit-rent estate situated in Głazewo to his half-sister, the Susanna née Treben.
    Since, then, the right of pre-emption belongs to Your Most Serene Highness, we beg the same most graciously
    to declare within S. weeks (the contract has been approved under reservation of the princely rights)
    whether the same wishes to make use of the right of pre-emption; because, upon the expiry of this
    term, it is assumed in conformity with the laws that the same has renounced this right for the present
    case.


    Wherewith we remain, with deepest reverence, Your Serene Highness''s


    most humble and obedient


    The Court Office here


    Metzig


    Neumann


    Betsche


    the 10th April 1805'

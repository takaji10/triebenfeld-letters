  en: '53


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s two letters of the 24th and 29th of last month I received today together.
    Submissively I reply that in the inheritance matter no resolution has yet been given, but that the
    whole affair, together with the opinion of the upright and honest Chamber Court and Cabinet Councillor
    Albrecht, lies before His Excellency the Grand Chancellor Beyme, from whom Her Majesty the Queen awaits
    it most eagerly.


    With regard to Your Serene Highness''s domestic affairs, and particularly in the matter of the so-called
    distraint affair, whatever Your Highness can for the present wish for will come to pass.


    As concerns the military affairs, Your Serene Highness is yourself at fault: your friends have long
    since most urgently advised you that you should write to His Majesty in a straightforward tone and
    beg for the conclusion of the matter, but in doing so go to work openly in the affair itself and pay
    compliments to nobody.


    Your Serene Highness''s most honest and most faithful friend here is the truly upright Major von Pirch;
    he is, by God, a rare, honest and thoroughly upright man, who pursues your cause better than Your
    Serene Highness yourself does, guides it with wisdom, and judges and sees through it with the penetration
    of the most expert man — His Excellency General von Köckritz means very well, only this good gentleman
    cannot therein be so effective as he would indeed wish — Haacke and others are well disposed because
    the noble, upright Major Pirch directs them and [uncertain: brings them round] to the point.


    Massenbach has written to His Majesty and begged for the conclusion of his affair — He appeals to
    General von Scharnhorst — the latter has'

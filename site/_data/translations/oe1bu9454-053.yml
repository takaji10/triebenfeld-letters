- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s two letters of the 24th and 29th of last month I have received today
    together. Submissively I reply that in the inheritance matter no resolution has yet been given, but
    rather that the whole affair, with the opinion of the upright and honest High Court of Appeal and
    of the Cabinet Councillor Albrecht, lies before His Excellency [uncertain: dh. Gr. K. Beym], from
    whom Her Majesty the Queen most eagerly awaits it.


    With regard to Your Serene Highness''s domestic affairs, and especially concerning the so-called distraint
    business, whatever Your Highness can for the present only wish for will follow.


    As concerns the war matters, there Your Serene Highness is yourself to blame; your friends have long
    since most earnestly advised you that you should write to His Majesty in a plain tone and ask for
    the conclusion of the affair, but in doing so should go to work openly in the matter itself and pay
    compliments to no one.


    Your Serene Highness''s most honest and most faithful friend here is the truly upright Major von Pirch;
    this is, by God, a rare, honest and thoroughly upstanding man, who pursues your cause better than
    Your Serene Highness yourself does, guides it with wisdom, and judges and sees through it with the
    keen eye of the most knowledgeable man. — His Excellency General von Köckritz means very well, only
    this good gentleman cannot therein be so [uncertain: würbsam] as he well wishes to be. — Haacke and
    others are well disposed, because the noble, upright Major Pirch steers them and directs them to the
    point.


    Massenbach has written to His Majesty and asked for the conclusion of his affair. — He appeals to
    General von Scharnhorst; the latter has'
- page: 2
  en: 'unfortunately the fever, and so the whole affair hangs. For the rest, most gracious Prince and
    Lord, I implore you — follow the counsel of truly upright friends, write to the King and ask for a
    speedy conclusion of your affair — but answer the Commission quite openly, [uncertain: thun Haus fremder
    Sünde] and pay compliments to no one. You must in earnest run the risk that the staff be broken over
    [text lost]


    broken — one departs


    by no means from the form — place. News of the armies is entirely wanting here. There is in this a
    perpetual alternation, like ebb and flood. — With the greatest certainty it may be assumed that the
    loss of the Austrians cannot be so great as the Consul here had it trumpeted abroad a few days ago,
    according to which the French army was to be in Vienna within 8 days and the whole Austrian army was
    already now to be totally cut to pieces. — Just so, the [uncertain: Muße] declaration does not seem
    to be so bad as the Consul here had it distributed in all quarters as a true declaration of war. —
    Russia, according to the true sense, is only breaking off all diplomatic negotiations with Austria,
    because the latter cannot enter into the proposed peace negotiations. — Schill, according to the reports
    that came in here yesterday, has already done a strong piece of work: cut to pieces entirely 2 regiments
    of French and Westphalians, taken 4 cannon with him, and hastens to Cassel and from there to Hanover,
    where the English troops are said already to have arrived. — He signs himself Major General of the
    first Brunswick [uncertain: Hanna versahm Diescion]. Once again I beg Your Serene Highness heartily
    — write to the monarch, spare no one in the questions, and then be assured that your wishes will be
    fulfilled.


    Full of dutiful respect I remain, as


    Your Most Serene Highness''s


    Königsberg,


    the 13th of May 1809


    faithful, humble and obedient servant


    Peter'

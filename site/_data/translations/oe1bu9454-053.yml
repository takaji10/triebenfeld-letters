- page: 2
  en: 'to his misfortune got the fever, and so the whole affair hangs. For the rest, most gracious Prince
    and Lord, I implore [uncertain: you — follow] the counsel of truly upright friends: write to the King
    and beg for the speedy conclusion of your affair — but answer the commission quite openly, do [uncertain:
    house of another''s sin] and pay compliments to nobody. You must in earnest risk that the staff be
    broken over it — one does not in the least depart from the form — [uncertain: reliable] news of the
    armies is wholly wanting here. There is in this a perpetual alternation, like ebb and flood — It may
    be assumed with the greatest certainty that the loss of the Austrians cannot be so great as the consul
    here had it trumpeted abroad some days ago, according to which the French army was to be in Vienna
    within 8 days and the whole Austrian army already now totally cut to pieces — Just so, the [uncertain:
    Muße] declaration appears not to be so bad as the consul here had it distributed in all quarters as
    a true declaration of war — Russia, according to the true sense of it, merely breaks off all diplomatic
    negotiations with Austria, because the latter cannot enter into the proposed peace negotiations —
    Schill, according to the news that came in here yesterday, has already done a bold stroke: cut down
    2 regiments of Frenchmen and Westphalians entirely, taken 4 cannon with him, and is hastening to Cassel
    and from there to Hanover, where the English troops are said already to have arrived — He signs himself
    / Major General of the first Brunswick [illegible] Division / Once again I beg Your Serene Highness
    from the heart — Write to the Monarch, spare nobody in the matter of the questions, and then be assured
    that your wishes will be fulfilled.


    In deepest reverence I remain, as


    Your Most Serene Highness''s


    Königsberg,


    the 13th of May 1809


    faithful, humble and obedient servant


    Peter'

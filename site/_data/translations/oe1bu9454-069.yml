- page: 2
  en: 'still there, who then also, after Honrichs [had received] 6000 f. and the deeds of donation in
    the original, with the most joyful prospects, departed that same day. Mr. Councillor of War von Triebenfeld
    is suffering greatly in the right arm; yet he has promised me that as soon as he shall have concluded
    his own business here, he will come at once for some weeks to Schlawentz. reply After all the most
    graciously given instructions concerning this shall have been received, I shall hasten to return.
    In deepest submission I remain, until death, Your Most Serene Highness''s Kontop


    the 26th of February 1810.


    most humbly, faithfully and obediently


    Bally'

  en: '69


    Most Serene Prince,


    Most gracious Prince and Lord!


    Your Most Serene Highness will already have learned through Mr


    Mr Lombardini that I was not able to receive the money at once in Wrocław, and was moreover detained
    even without the great hindrances of the indescribable roads and weather. Notwithstanding this, however,
    I hastened my journey from Wrocław onward so much that on the 25th at midday I was here, and found
    Honrichs and Cabanis'

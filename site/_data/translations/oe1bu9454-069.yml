- page: 2
  en: 'still here, who then also, after Honrichs 6,000 Rthl. and the deeds of donation in the original
    with the most joyful prospects, departed that same day. The Councillor of War von Triebenfeld is suffering
    very much in the right arm; yet he has promised me that as soon as he shall have brought his own affairs
    here to an end, he will come at once for some weeks to Schlawentz. After I shall have received an
    answer upon all this, upon all the most gracious instructions received, I shall hasten to return.
    In deepest submission I remain, until death, Your Most Serene Highness''s


    Konotop


    26th February 1810.


    most humbly, faithfully and obediently


    Bally'

segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Your Most Serene Highness will already have learnt through Mr.


    Mr. Lombardini that I was not able to receive the money at once in Breslau, and that I was moreover
    detained even without the great hindrances of the indescribable roads and weather. Notwithstanding
    this, however, I so hastened my journey from Breslau that on the 25th at noon I was here and found
    Honrichs and Cabanis'

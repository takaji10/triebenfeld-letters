segments:
- page: 1
  en: '46


    My dearest Friend!


    The letter of His Serene Highness the Prince of Hohenlohe, which you are so eager to have together
    with the money enclosed with it, you will by now surely have received, since it was drawn from here
    upon Konotop to you.


    So much the worse will it go for us with the adtatorten [uncertain: adtatorten]; the files lie in
    the appeal court awaiting judgment, but no favourable decision can come, because today a declaration
    executed by the King himself stands in the Berlin newspapers, that all bonds in beinen money, even
    when the Valuta was paid in state Kagis[?] [uncertain: Kagis], heit bliegen Courant one is accustomed
    to, and that this has eight old bonds back to 1806 wurde. So now all the Latin is at an end, and she
    must make provision for longer payment.


    Under this law interest too has been made as burdensome as one will and may, 10, 12, 16, 20, 50 per
    cent, as soon as they have fallen due, except that they be paid so. Without regard to the creditor,
    whether he is of the Christian faith. God help now everyone who needs money; for him it will doubtless'
- page: 2
  en: 'cost a hundred per cent.


    I pity you most sincerely and most heartily in your Vorillungen. How he may now escape out of tricanten
    with the Watten.


    Have I[?] forgotten my Wildbach for Willhelm [a?]? — Live not well and exert yourself, and with constant
    esteem, Ergebührt as yours


    Berlin, 2 March 1809. Your wholly devoted servant and friend, Amelang'

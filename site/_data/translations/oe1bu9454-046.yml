- page: 1
  en: 'My dearest Friend!


    The letter [uncertain: writing] of the Prince of Hohenlohe, Serene Highness, bill of exchange, which
    you would gladly wish to have together with the money that is with it, you will by now surely have
    received, if it was drawn from here upon Cortapp in you.


    All the worse will it go with us as regards the [illegible], very much so; the files lie in the appellate
    court awaiting judgment, only no favourable decision can come, because today a declaration executed
    by the King himself stands in the Berlin newspapers, that all bonds in [uncertain: your] money, even
    when the [uncertain: sum] has been paid in state notes, are henceforth to be accustomed to remain
    Courant, and that this has taken back the eight old concealments in 1806. Now therefore all the Latin
    is at an end, and she must make provision for long payment any more.


    Under this law it has likewise been aggravated with interest, as one will and may, 10, 12, 16, 20,
    50 per cent, so soon as they are fallen due, to be paid otherwise thus; without regard to the creditor,
    whether he be of the Christ. Money help now everyone who suffers want of money; for him it will surely'

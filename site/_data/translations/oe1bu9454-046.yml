status: draft
segments:
- page: 1
  en: 'My dearest Friend! The letter of His Serene Highness the Prince of Hohenlohe, bill of exchange,
    which you would gladly have together with the money contained therewith, you will by now surely have
    received, if it has been drawn from here upon [uncertain: Cortapp] in you. So much the worse will
    it go with us in the matter of the [uncertain reading: adtatorten]; the files lie in the Court of
    Appeal awaiting judgment, only no favourable decision can come of it, because today there stands in
    the Berlin newspapers a Declaration [drawn up? executed?] by the King himself, that all bonds in [beinen]
    money — even if the [Saluta] has been paid in [Staatsslagius] — are to be [heit bliegen] accustomed
    to Courant, and that this [acht allten] concealment back to 1806 has [been]. Now, accordingly, all
    the Latin is at an end, and she must [make] provision for the long payment more. Under this law, interest
    too has been made harder, as one will and may, 10. 12. 16. 20. 50 per cent, as soon as they are deceased
    [verscheiden], apart from being so paid, without regard to the creditor, whether he be [zu den Christ].
    Money help now everyone who suffers want of money; for him it will surely'
- page: 2
  en: 'a hundred per cent. I pity you most sincerely and most heartily in your [Vorillungen — presentations?
    afflictions?]. How he can now [extricate himself?] from the matter of the [Watten] out of [tricanten].
    Have I forgotten my [Wildbach] for Wilhelm von Lämer? – Do not fare well, and [try/attempt] yourself,
    and with constant esteem it is due, as that yours,


    Berlin, the 2nd of March 1809


    Most devotedly serves, and Frau Amelang'

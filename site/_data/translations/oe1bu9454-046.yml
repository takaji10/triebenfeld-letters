- page: 2
  en: 'a hundred per cent.


    I pity you very much and most heartily in your [uncertain: representations]. How he may now [illegible]
    out of the [uncertain: cotton wool] matter.


    Have I forgotten my [uncertain: Wildbach] for Wilhelm von Lämer? – Do not fare well, and try yourself,
    and with constant esteem, as is due, I am yours


    Berlin, the 2nd of March 1809. Your most devoted servant and Mrs Amelang'

- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Presumably Your Most Serene Highness will already have received my letter, which I gave yesterday
    to Captain and Hahn. – Besides that letter, in which I said everything, I add only this further, that
    Minister Hoym has returned from Potsdam quite well pleased, where, according to the assurance of another
    man, various matters concerning Your Serene Highness were spoken of. It is herewith confirmed that
    the good Mo- truly esteems you, and in this regard I hope, indeed everything must go as one would
    wish. Today there is a great deal of talk here of marches or of war – I do not yet believe in it,
    for the Monarch holds too firmly to his principles, and maintains his honest good intentions. From
    His Excellency Herr von Voss nothing has yet come back. May Heaven govern his heart, that he may not
    act against the King''s interest and against Your Serene Highness''s peace of mind.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 9th of October


    1798.


    most faithful servant


    v. Triebenfeld'

- page: 1
  en: '80


    Most Serene Prince,


    Most gracious Lord!


    Your Most Serene Highness will presumably already have received my letter, which I yesterday gave
    to Captain and Hahn to carry. — Besides that letter, in which I have said everything, I add only this
    further: that Minister Hoym has returned from Potsdam very well pleased, where, according to the assurance
    of another man, various things were spoken of concerning Your Serene Highness. — It is hereby confirmed
    that the good Monarch truly esteems you, and in this respect I hope and trust all will and must go
    as one would wish. Today there is a great deal of talk here of marches or of war — I do not yet believe
    in it, for the Monarch holds too firmly to his principles, and maintains his honest good intentions.
    — From His Excellency Mr von Voss nothing has yet come back. May Heaven govern his heart, that he
    may not act against the King''s interest and against Your Serene Highness''s peace of mind.


    In deepest veneration I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 9th of October


    1798.


    most faithful servant


    v. Triebenfeld'

- page: 3
  en: 'regard would be had to the principles now laid down.


    Should His Royal Majesty most graciously deign to accept the above proposals, then


    1, a public notice concerning the amnesty granted under 3 and 4,


    2, the necessary order to the Minister of State Count von Hoym and to the Grand Chancellor would have
    to be laid before His Majesty for most high signature.


    Berlin, 16 February 1797.


    Goldbeck


    After close consideration of the crimes[?], I find none of the condemned[?] worthy of a reduction
    of the punishments; rather, those who have been condemned to money fines must be held to the payment
    of them, or, where[?] they are not able to pay it, be brought to an arrest in proportion to it.


    Fr. Wilhelm


    16 February 1797'

status: draft
segments:
- page: 1
  en: 'Copy. Right Honourable Sir, Highly Honoured Sir, Royal Forest Councillor! The mounted messenger
    who brings Your Right Honourable this answer to your letter of the 1st of January. Arrived [uncertain:
    the day before yesterday] the day before yesterday in the afternoon, whereupon I at once despatched
    a mounted man with your letter to Herr v Weithausen, still [or: to] Cosel, who did me the friendly
    service of coming here after [or: according to] yesterday, where we took everything under consideration
    together, with the good Bolli called in as well, whereupon then this our common friend has the kindness
    to let this my letter be dictated to him, wherefore it also bears at once the stamp of his concurrence;
    the leasehold offer of Herr v Brzechsta deserves my attention, and since Your Right Honourable''s
    counsel and [uncertain: opinion] carry great weight with me in all cases, I shall therefore, as I
    honour your insight, [text does not parse] with your present [proposal] have regard with preference;
    it is to be hoped that one will not wish to stop at the first bid. Concerning the putting into repair
    of the 3 demesne farms we shall doubtless come to agreement; the half-yearly payment of the leasehold
    rent seems to me [uncertain: advisable] and must naturally be made prenumerando; some cash security
    seems to me requisite for proper assurance, and I beg Your Right Honourable to make the necessary
    arrangement in this regard. That the leasehold contract be so concluded that with all foresight every
    action for remission and for recourse be forestalled lies in the nature of the thing; the security
    offered out of the entire property of the lessee may be very well, only in the present times almost
    only hard sounding coin is a [uncertain: sure] pledge; that the lessee bear all the burdens I find
    natural; to fix a sum for withdrawal against a possible sale during the term of the lease I find myself
    [text does not parse], and at the conclusion of the contract I shall let myself be found reasonable
    enough in that matter; in the contract everything on this head would then have to be exactly determined;
    this, and any other stipulations tending toward a sale of the estates, would then emerge more particularly
    in the negotiations here.'
- page: 2
  en: 'After these expressions of my mind I believe that Your Right Honourable [text does not parse] may
    come further with your friend, whereupon I shall gladly offer my hand to the conclusion of the lease;
    herewith, in my opinion, the term of the lease, the amount of the rent and the necessary conditions
    would first have to be quite exactly determined; herein it follows of itself, to be sure, that Herr
    v. Brzechsta would have to bring several thousand Rthl with him, in order to be able to conclude everything
    at once. With Herr General v Schimmelpfennig I have not advanced a single step further in the matter
    of our estate transaction, which delay has arisen partly through his severely suffered illness, partly
    through the negotiation of his sons in Berlin concerning their lady mother''s capital, which has not
    advanced as one would wish. But since I received the news yesterday that the Herr General now himself
    takes up his affairs again, I shall send to him and hear his final resolve more nearly. I confess
    that any decent sale of the Zagorow estates will always be the more agreeable to me, wherefore I will
    act here too in such a way that I need not reproach myself with any reproaches of neglected duty toward
    myself; but since your friend in the leasing is always to be covered by the stipulation of indemnification,
    I hope Your Right Honourable will let nothing hinder you from coming here with him as soon as possible,
    since for many reasons I must particularly wish that, on the arrival of my children, I may also be
    able to show that from the Zagorow estates, through Your Right Honourable''s exertion and preparatory
    labour, a share as useful as possible has been drawn. [Nach/noch] we can hold it thus: political occurrences,
    and the pressing circumstances in which you find yourself on account of the dues to be rendered from
    the estates, make haste in the undertaking advisable; wherein I would not hinder you, Your Right Honourable''s
    project of sale to Herr Weigel and Baron v Stössel.'
- page: 3
  en: 'would likewise be welcome to me, if only I might still regard it as feasible after the disclosures
    made to me by Herr Rittmeister v. Stössel of Ruschinowitz. The old Baron v. Stössel has fixed his
    arrival with me for these days, and I have been expecting him since the 6th of this month; on that
    occasion I will attempt to lay your plan before him once more, in order not to make myself guilty
    of any sin of omission in this matter either, notwithstanding that I expect nothing from it. We must
    now together strain everything to procure me more help in money and to achieve a [uncertain: proper]
    [illegible] of my affairs. God bless your exertions in the Oleschwitz and Trotzin business, if only
    a considerable sum comes in thereby soon. Do seek to come to me right soon, and bring me other good
    news besides; I count upon it that you will soon [send] 300 Rthl for the L. Sommer, which I would
    send here only by [uncertain: express]; superfluously I have a written undertaking given me as to
    the manner in which those moneys can be procured there without detriment to me; the choice of means
    remains for the rest left to him, only I shall regard it as a great favour shown to myself if this
    matter is negotiated right soon. Since you wish to obtain a pair of roebucks, I have charged my huntsman
    to procure me a few head of game, of whatever kind it may be; I shall then send them off at once to
    Blizanow in the company of your foot-messenger, whom I am for that reason keeping back here still.
    For the great dog described to me as already [promised], which Your Right Honourable destines for
    me, I give my most submissive thanks, and I wish that you may send him to me soon or bring him with
    you. It remains for me still to return Your Right Honourable''s New Year''s wish from a faithful heart,
    and to embrace in my wishes for your welfare and contentment everything that'
- page: 4
  en: everything [that] can only further your self-[illegible] happiness. Hereupon, and herewith, I beg
    of you anew the continuance of your friendship, which I shall assuredly return in fidelity. I look
    forward to [text does not parse] a speedy meeting again, and remain always in the most excellent esteem
    your most faithfully devoted friend and [yours]. F. L. Prince zu Hohenlohe. Schlawenzitz, the 27th
    of January 1812

- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    The business concerning the instruments touching all the ecclesiastical estates I believe to have
    settled to the satisfaction of Your Most Serene Highness, and should my stay here now be drawn out
    at length, I shall send the same off to Breslau by the earliest post. For the rest, I confess that
    the first entrée into this matter moved my heart greatly, for they were claiming a further 2½ times
    as much as for the first, because the value had been so stated in the first ministerial report. [uncertain:
    Jagt] however I pay only 240 Fr and some 200 Rthl; the money I have borrowed from the Privy Senior
    Auditing Councillor Mathias, who must have it back within 14 days. May Your Most Serene Highness be
    pleased to order payment of this money at the earliest, so that I may hand it over again while I am
    still here — I had hoped myself to receive much money here, but unhappily shall not get a Groschen
    before next Midsummer. Tomorrow morning I shall learn much in Your Serene Highness''s other matter
    and shall most humbly report it by the next post. In deepest reverence I remain, until death, Your
    Most Serene Highness''s


    NB. instead of 14175 and 1500


    Berlin, the 7th of February 1801.


    most faithful servant


    v. Triebenfeld'

    Most Serene Prince


    Most gracious Prince and Lord!


    The business concerning the documents relating to all the ecclesiastical estates I believe to have
    concluded to Your Most Serene Highness''s satisfaction, and should my stay here now be drawn out at
    length, I shall send the same off to Wrocław by the next post. — For the rest, I confess that the
    first entry fee in this matter moved my heart greatly, for they demanded 2½ times as much again as
    for the first one, because the value had been so stated in the first ministerial report. But now I
    am paying only 240 Fr d''or and some 200 rt. The money I have borrowed from the Privy Senior Councillor
    of Accounts Mathias, who must have it back in 14 days. May it please Your Most Serene Highness to
    assign this money with all speed, so that I may still be able to hand it over again during my presence
    here. — I had myself hoped to receive much money here, but unfortunately shall not get a Groschen
    before the coming Midsummer. Tomorrow morning I shall learn a great deal in Your Serene Highness''s
    other matter, and shall most humbly report it with the next post. In deepest reverence I remain, until
    death, Your Most Serene Highness''s


    NB. instead of 14175 — and 1500 —


    Berlin, the 7th of February


    1801.


    faithful servant


    v Triebenfeld'

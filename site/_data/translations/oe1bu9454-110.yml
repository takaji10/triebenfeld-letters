- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The business concerning the deeds relating to
    all the ecclesiastical estates I believe to have settled to Your Most Serene Highness''s satisfaction,
    and should my stay here now drag on at length, I shall dispatch the same by the earliest post to Breslau.
    For the rest, I confess that the first entrée into this matter moved my heart greatly, for they demanded
    2½ times as much again as for the first, because the value had been stated so in the first Ministerial
    report. Now, however, I pay only 240 Fr [uncertain: der] and about 200 Rthl; the money I have borrowed
    from the Privy Senior Auditing Councillor Mathias, who must have it back within 14 days. May Your
    Most Serene Highness be called upon indeed to issue an order for this money with all speed, so that
    I may still repay it during my presence here – I had hoped myself to receive much money here, but
    unfortunately shall not get a Groschen before the coming Johanni. Tomorrow morning I shall learn much
    in Your Serene Highness''s other affair, and shall report it most humbly with the next post. In deepest
    reverence I remain, until death, Your Most Serene Highness''s NB. instead of 14175 and 1500 Berlin,
    the 7th February 1801. faithful servant v Triebenfeld'

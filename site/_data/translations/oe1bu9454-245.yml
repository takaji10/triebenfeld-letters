- page: 1
  en: 'of the Prince State Chancellor v. Hardenberg


    Most Serene Prince, Most gracious Prince and Lord!


    I am to present to Your Most Serene Highness the enclosed letter of the Prince zu Hohmliche [uncertain
    reading] most submissively, and at the same time to beg of the same Most High permission — the highest
    and most gracious permission — to depict to Your Most Serene Highness the most pressing distress of
    the Prince, and therewith to lay at Your Serene Highness''s feet a plan for his rescue and for the
    relief of his sufferings. From of old the Prince von Ingelfingen was One Most Serene Highness''s most
    faithful [uncertain: Anfänger — "adherent/beginner"] and admirer; this man, who has become unhappy
    through no fault of his own but merely through yielding to foreign influence upon his benevolent disposition,
    throws himself into Your Serene Highness''s arms; he begs that he be protected from the chicanery
    of [uncertain: des Medis zmalreiches] Cosmar, which intends nothing further than that the good Prince
    shall go hungry in his old age and perish in misery. A fortune amounting in value to more than two
    millions of Rttlr — such are the Schlawenschitz, Lassowitz and Oppurg estates, which according to
    the document annexed in Copy under A were confirmed as an entailed estate by His Majesty in 1799,
    and which today, in these most straitened times, according to the statement appended under B, nevertheless
    yield 79500 rttlr of revenue. Of these considerable estates the Prince, as lord of the entailed estate,
    is to enjoy the [uncertain: Vereinen — "revenues/unions"]. Only by the most unthinkable artifices
    has Cosmar contrived to insinuate himself both into the entailed estates and into the estate left
    by the deceased Princess Sacken, so that he commands everything as though it were his own property,
    collects all revenues, and [uncertain: Namen das davon einen Diener giebt]. He calls himself Testamentary
    Executor — but what could the Princess Sacken ordain by way of testament? She was of these estates,
    and that only in part, a mere possessor of [uncertain: Adiectalitaets] rights. Those determined by
    the [uncertain: Si In sanit:] Deed A to everything, which belongs to the [uncertain: geschreib] Princess
    now married v Solcher, the entire estates — after her [uncertain: Tredirte] she [uncertain] all her
    inheritance faithfully to their aggrieved wedded lord, the [uncertain: Hörste] u Hohenlohe, and the
    Prince founded therefrom the Fidei Commiss which His [uncertain: Max Sarotemirt]; thus the Princess
    Sacken could indeed also appoint an Executor Testamenti; over her ready cash she could [uncertain:
    wohltektion] alone, which she has for the greatest part bequeathed to her favourite, the Prince Adolph,
    and so every legal ground vanishes upon which she, still much less her [uncertain: Besuchrund] Cosmar,
    might meddle in the affairs of the entailed estates; but in order nevertheless to force his way into
    these affairs, faithful to [uncertain: entgegenstehenden] legal barriers, to rule at will, and to
    command the revenues without accountability as though over his own property, M. Cosmar has undertaken
    the most audacious venture of a determined pettifogger. He [uncertain: nit] threw the far-reaching
    settlement here enclosed as C at a time when the Princess v. Sacken, if indeed she still lived, could
    not possibly survey its content and consequences, since she lay in her last agonies and in [uncertain:
    gnüpftigte] cases was already so weakened in her vital powers that she signed the [uncertain: metschichtige]
    instrument, instead of a signature, only with 3 crosses. This settlement is the sum of all [uncertain:
    Inträgen]. There are set out in it so many debts and demands which the Princess [uncertain: Sande]
    would have to demand, which exceed everything, and which were never contemplated in the deed of foundation.
    The Prince has already, as the copy annexed under D shows, made [uncertain: Ermähung — "remonstrance/mention"]
    of this to Herr v Kircheisen, His Excellency. In his answer under E, however, this is passed over
    in silence. [uncertain: Dürner] this [uncertain: Trahent] states that Cosmar may command all the revenues
    of the M[ajorat] estates, and need render account to no one. Whether ever a second Test: Executor
    of this kind is to be found in history I doubt, but for that very reason the Princess, at the drawing
    up of the 3 [uncertain: tage], could not possibly have still enjoyed a sound understanding, for the
    settlement tends to [uncertain: bedingen — "to impose conditions on/to prejudice"] the Monarch and
    all the Prince''s creditors, but the Prince in particular to deprive of honour and everything, and
    this the [uncertain: meister:] Princess could not have willed. She knew too well what the Prince had
    endured for her daughter''s sake. This piece of work could therefore rest on nothing but boundless
    malice. For the completion of this [illegible]-ous settlement, wholly at variance with the [uncertain:
    canckwirten] deed of the year 1799, they even contrived to move the Prince to his approval by the
    most shameful misrepresentations. Now Cosmar had, in his own opinion, further gained: he at once [uncertain:
    sagte ... ein — "installed"] his inexperienced, still-minor son as Administrator of the estates. Drew
    with these all the revenues, paid neither interest nor capital, and despite all admonitions of the
    Brieg Upper Provincial Court, which he dismissed to me with defiant sarcastic answers, rendered no
    account either. The Prince is annually, according to the 1st agreement, to draw 24000 Rthl and his
    son [uncertain: Ausz zu st. zu Oheim] 18000 Rthl; also the latter were to be paid 100000 immediately
    after the death of the Princess Sackin as a present towards the settlement of the debts. But 3 years
    have elapsed, and the old gentleman has received no more than 2500 Rthl, the son not so much as a
    Groschen; so where remain the revenues of 79500 Mk. annually, where the possibility of [uncertain:
    den Ersten von los zu erkennen]? But here too Cosmar''s plan is plain as day — whatever may ever be
    said of the Prince [text lost]'
- page: 2
  en: '[uncertain: Aß] the excuse of Cosmar''s to be supposed; in truth this [uncertain: Marsch] [uncertain:
    dubitet — doubts/evades] every objection, only so as not to have to give out his [uncertain: klein]
    and not to have to let go his booty. The foundation of Cosmar''s plan rests upon the capital of the
    30th [uncertain] which the Lutz heirs have to demand of the Prince, which with the inclusion of the
    [uncertain: Zeiten] and 1805 amounts to 426000 Rthl. His Royal [uncertain: Mez] have guaranteed the
    debt, and the former Princess Hohenlohe has [uncertain: das Zinsamment] as they themselves were debtors,
    with the Prince''s rightful writings. In the more often mentioned settlement of 1811 something above
    that: the Prince bound himself [uncertain: nochmächtig gemacht] to pay this capital together with
    interest out of his own means, and to release the [uncertain: anermahlen] future [uncertain: zuerst
    lichte] f v Sacken from the payment. A double [uncertain: Unserm — outrage?]: first, because one requires
    so considerable a payment of the Prince, who has not ten, far less a hundred thousand to pay — secondly,
    because one believed one could set aside the rights of third interested persons even without their
    consent; and the deceased Princess surely thought too nobly to have set herself, at the edge of the
    grave, to defraud her Sovereign and many other men, and many hundreds of thousands. No one here can
    fail to recognise the machinations of a self-interested [uncertain: zuge], chicanerous man, to whom
    hitherto all had succeeded — Cosmar knew that the Lutz heirs already held no judgment in contumaciam
    in their favour, in which the Prince had been condemned to pay this considerable sum; he knew that
    with the Prince, whom he had already 3 years [uncertain: hatt, Zuzig laßen], no object of an execution
    was to be found. He concluded from this that the Monarch would now be applied to by the [uncertain:
    Curland] heirs for payment; and so he supposed that His Royal [uncertain: Mar], provoked after this
    [uncertain: metamorphore], would renounce the matter, and out of [uncertain: Vorweiß] would wholly
    abolish the Fidei Commiss founded in 1799, which was [uncertain] without prejudice to the Most High
    interest and to every third [uncertain: dritteniauisionirt]. Then, in his opinion, the former Princess''s
    [uncertain: gezeyn Gezige] Gr. Sacken could appear again, reclaim the estates, then have the poor
    Prince driven out of everything and [uncertain: erfuegern] — for then Cosmar''s plan would have wholly
    succeeded, and his reward would certainly have been princely.


    One Most Serene Highness [uncertain: nur kaum], soon to relieve the [uncertain: sieren] Colleagues
    and to counsel the good Prince out of Cosmar''s [uncertain: Klären — clutches/clarifications]. An
    agreement has already been concluded with the mandatories of the [uncertain: Endl.] heirs, according
    to which these will take 112000 for the whole demand of 426000 Rthl, give receipt for everything,
    and surrender the [uncertain: staat,] documents. Likewise an agreement has already been made with
    all the other creditors, that they will content themselves with a [uncertain: geschätzliche] payment
    of 12000 Rthl [uncertain: das], which the Prince has ordered to be paid out of the entailed-estate
    revenues due to him, but which Cosmar, despite all summonses even from the Brieg O[illegible]. L.
    G., will not pay. What matters to me is that Your Most Serene Highness most graciously grant an advance
    of 112000, for the payment of the Lutz heirs, and if only for a short time; but especially that the
    settlement of 1811, so maliciously forged by Cosmar — which in the manner of its execution is not
    [uncertain: nicht] to be regarded as suspect, which runs counter to the [uncertain: von des P[illegible].
    M. selbst Landt Art] of 1799, is irreconcilable with the well-acquired rights of third parties, and
    is nothing but a presumptuous [uncertain: Mentat — attempt/attentat] of an intriguing stranger against
    the Prince''s fortune — be deservedly annulled; and that Cosmar then be excluded from everything and
    be held to the strictest rendering of account. The advance of 112000 Rthl can, for which I too, if
    it be permitted, would stand with a security of 60000 Rthl, in the [uncertain: Bürzuste] time indeed
    be discharged in various ways. Were a partial payment, as set out under B, not to be accepted at 25000
    Rthl annually, then one might for the present adhibit to that purpose a part of the 100000 which the
    Prince August is to receive as [uncertain: Praeliat]. Only above all the settlement of 1811, so dishonouring
    even to the Prince himself, must be annulled, and an honest, expert Administrator appointed in the
    name of His [uncertain: H. M.], because the same Most High is interested therein on account of the
    guarantee. Then nothing stands in the way of the discharge of the advance of 112000.


    I further note most [uncertain: allsobriehst] that Cosmar has kept back over 43000 Rthl of the moneys
    which the Prince was to draw for his maintenance, and which the Prince assigned to the common creditors
    [uncertain: im Vöglich] — but which Cosmar absolutely will not pay. Also 60000 Rthl of manufactured
    goods in stock in the magazines — but that these remain to be regarded as a working capital — meanwhile
    these are speaking proofs of the abundance of the estates, of which a [uncertain: Chicana] keeps all
    back for himself for the execution of his plan, and in the meantime lets the good Prince and those
    about him go hungry. I must further adduce here that I have included in the [uncertain: Anerissirung]
    the 35000 Rthl formerly advanced to the Prince and to the [uncertain: Hochgelaske]. From Your Most
    Serene Highness''s strong benevolence shown towards the Herr Fürst zu Hohenlose I hope for the granting
    of my most [uncertain: Lubmichteste] petition, according to which I implore on [uncertain: alengesen]
    [uncertain: flehe] that a report be required of the Upper Provincial Court at Brieg — whither His
    Excellency the 3 Minister referred the Herr Prince himself — concerning the Prince''s situation, concerning
    all his sufferings which he must endure through Cosmar, and that all here is truly and certainly depicted;
    from which more will come to light and the pressing distress of the Prince be proved.


    In deepest reverence I remain, until death, Your Most Serene Highness''s


    Vienna, the 20th of October 1814


    faithful and most humble and obedient servant [Knecht]

    v Triebenfeld'

- page: 1
  en: 'of the Prince


    State Chancellor von Hardenberg


    Most Serene Prince


    Most gracious Prince and Lord!


    To Your Most Serene Highness I am to present the enclosed letter of the Prince of Hohmliche [uncertain:
    allerhäbniße], and at the same time to beg the Most High for the most gracious permission to depict
    to Your Most Serene Highness the most oppressive distress of the Prince, and therewith to lay at Your
    Serene Highness''s feet a plan for his rescue and for the relief of his sufferings.


    From of old the Prince of Ingelfingen was Your Most Serene Highness''s most faithful beginner and
    admirer; this man, become unhappy through no fault of his own but merely through yielding to foreign
    influence upon his benevolent disposition, throws himself into Your Serene Highness''s arms; he begs
    that he be protected from the chicanery of the Medis [uncertain: zmalreiches] Cosmar, which intends
    nothing else than that the good Prince shall starve in his old age and perish in misery.


    A fortune amounting in value to more than two millions of Rttlr is constituted by the Schlawenschitz,
    Lassowitz and Oppurg estates, which according to the instrument annexed in copy under A were confirmed
    as an entailed estate by His Majesty in 1799, and which today, in the most straitened of times, nevertheless
    yield, according to the statement appended under B, 79500 rttlr of revenue. Of these considerable
    estates the Prince, as lord of the entailed estate, is to enjoy the [uncertain: Vereinen]. Only by
    the most inconceivable of artifices has the town [uncertain: sowohl sumose] contrived to insinuate
    itself both into the entailed estates and into the estate left by the deceased Prince Sacken, so that
    he disposes of everything as of his own property, draws in all revenue, and in name gives a servant
    something thereof. He calls himself Texta: Executor — but what could the art Saleken ordain by way
    of death? She was of these estates, and indeed only in part, a mere possessor of adiectality. Those
    determined by Si In sanit: act A to everything, belonging to the written Princess now married to v
    Solcher, the whole of the estates — after her Tredirte she [conveyed] all her inheritance faithfully
    to her aggrieved husband, the Hörste and Hohenlohe, and the Prince founded therefrom the entail which
    His Maj. Sarotemirt; thus the Princess Sacken could also appoint an executor of the testament; over
    her cash estate she could [dispose] well alone, which for the most part she has bequeathed entirely
    to her favourite, Prince Adolph, so every legal ground vanishes upon which she, still much less her
    visitation-ground Cosmar, might interfere in the affairs of the entailed estates; but in order nevertheless
    to force his way into these affairs, in defiance of the legal barriers standing in the way, to act
    therein at his pleasure and to command the revenues without accountability, as over his own property,
    M. Cosmar has undertaken the most audacious stroke of a determined pettifogger. He cast down the far-reaching
    settlement here enclosed as C at a time when the Princess von Sacken, if indeed she was still living,
    could not possibly survey its content and consequences, since she lay in her last agonies and, in
    the [uncertain: gnüpftigte] case, was already so weakened in her vital powers that she signed the
    many-layered document with 3 crosses instead of a signature. This settlement is the epitome of all
    machinations. There are entered in it so many debts and demands which the Princess Sande would have
    to demand, which exceed everything, and which were never thought of in the instrument of foundation.
    Concerning this the Prince has already, as the copy enclosed under D shows, made representation to
    His Excellency Herr von Kircheisen. In his answer under E, however, it is passed over in silence.
    Further, this settlement states that Cosmar may command all the revenues of the entailed estates,
    and need render account to no one. Whether a second testamentary executor of this kind is to be found
    in history I doubt; but for that very reason the Princess, at the drawing up of the 3 days, could
    not possibly still have enjoyed a sound understanding, for the settlement amounts to conditioning
    the monarch and all the Prince''s creditors, but to depriving the Prince in particular of honour and
    everything, and this the excellent Princess could not have wished. She knew too well what the Prince
    had endured for her daughter''s sake. This piece of contrivance could therefore rest on nothing but
    unbounded malice; for the completion of this [illegible] immense settlement, wholly contrary to the
    act of the year 1799 that had been enrolled, they even knew how to move the Prince, by the most shameful
    misrepresentations, to give his approval. Now Cossa had in his opinion still won; he at once appointed
    his inexperienced, still under-age son as administrator of the estates. Drew with these all the revenues,
    paid neither interest nor capital, and, despite all the admonitions of the Brieg Higher Provincial
    Court, which he rebuffed to me with defiant, sarcastic answers, rendered no account either. The Prince
    is, according to the 1st agreement, to draw 24000 Rthl yearly and his son the payment to the uncle
    18000 Rthl; the latter were also to be paid 100000 immediately after the death of the Princess Sackin
    as a present towards the settlement of the debts. But 3 years have elapsed, and the old gentleman
    has received no more than 2500 Rthl, the son, for his part, not a Groschen; so there remain the revenues
    of yearly 79500 Mk., where the possibility of recognising the first from [uncertain: los] — But here
    too Cosmar''s plan is in the open — Whatever may ever have been said to him by the Prince a [text
    lost]'

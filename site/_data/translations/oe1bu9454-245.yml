- page: 2
  en: '[uncertain: Aß] the excuse of the Cosmars to be presumed; in fact this [uncertain: Marsch] doubts
    every objection, only so as not to have to give out his small [share] and not to have to let go his
    booty. The foundation of Cosmar''s plan rests upon the capital of the 30th inst., which the Lutz heirs
    have to demand from the Prince, which with the inclusion of the times amounts to and 1805 – 426000
    Rthl. The King''s [uncertain: Mez] have guaranteed the debts, and the former Princess of Hohenlohe
    has the interest account, as they were themselves indebted, with the Prince''s right writing In the
    more often mentioned settlement of 1811 something over which the Prince has made himself again empowered
    to pay this capital together with interest from his own means, and to release the [uncertain: anermahlen]
    future first light f. von Sacken from the payment. A double [uncertain: Unserm]: firstly, because
    one imputes so considerable a payment to the Prince, who has not tens, let alone hundreds of thousands,
    to pay – secondly, because one believed it possible to set aside the rights of third interested persons
    already [without] their consent, and the deceased Princess surely thought too nobly to have set herself,
    on the brink of the grave, to defraud her sovereign and many other people, and many hundred thousand.
    No one can here mistake the workings of a self-interested, chicanerous [man], to whom everything had
    hitherto succeeded — Cosmar knew that the Lutz heirs already held no judgment by default in their
    favour, in which the Prince had been condemned to pay this considerable sum; he knew that with the
    Prince, whom he had already for 3 years let [uncertain: Zuzig], no object of an execution was to be
    found. He concluded from this that the monarch would now be applied to by the Courland heirs for payment;
    and so he thought that His Royal Maj., incensed after this metamorphosis, would disavow the matter,
    and out of [uncertain: Vorweiß] should wholly annul the entail founded in 1799, which to me would
    be [uncertain: injured] without prejudice to the most high interest and to any third party. Then,
    in his opinion, the former Princess''s [uncertain: gezeyn] now Countess Sacken could come forward
    again, reclaim the estates, then have the poor Prince driven out of everything and ejected — for then
    Cosmar''s plan would have wholly succeeded, and his reward would certainly have been princely. Your
    Most Serene Highness may scarcely [fail] soon to relieve the [uncertain: sieren] colleagues and to
    counsel the good Prince out of the clutches of Cosmar. An agreement has already been concluded with
    the mandatories of the [uncertain: Endl.] heirs, according to which these will take 112000 for the
    whole demand of 426000 Rthl, give a receipt for everything, and surrender the documents to the state.
    Likewise an arrangement has already been made with all other creditors, that these are willing to
    content themselves with a moderate payment of 12000 Rthl, which the Prince has assigned out of the
    entailed-estate revenues due to him, but which Cosmar, despite all demands even from the Brieg [illegible]
    Higher Provincial Court, will not pay.


    What matters to me is that Your Most Serene Highness most graciously grant an advance of 112000, for
    the payment of the Lutz heirs, and even if only for a short time; but especially that you annul, as
    it deserves, the settlement of 1811 so maliciously forged by Cosmar, which in the manner of its execution
    is not [only] suspect, but is contrary to the [uncertain: P.] M.''s own act of 1799, irreconcilable
    with the well-acquired rights of third parties, and is nothing but a presumptuous attempt by an intriguing
    stranger against the good fortune of the Prince; and that you have Cosmar removed from everything
    and held to the strictest rendering of account.


    The advance of 112000 Rthl can — for which I too, if it be permitted, would stand with a security
    of 60000 Rthl — be discharged in the [uncertain: Bürzuste] time, indeed in various ways.


    Were an instalment payment, such as is set out under B, at 25000 Rthl yearly not to be accepted, then
    one could for the present apply to that purpose a part of the 100000 which Prince August is to receive
    as a [uncertain: preliminary payment]. Only above all the settlement of 1811, so dishonouring even
    to the Prince, must be annulled, and an honest, knowledgeable administrator appointed in the name
    of His Maj., because the Most High is himself interested therein on account of the guarantee. Then
    nothing stands in the way of the discharge of the advance of 112000. I further note most humbly that
    Cosmar has kept back over 43000 Rthl of the moneys which the Prince is to draw for his maintenance,
    and which the Prince assigned to the common creditors [uncertain: in Vöglich] — but which Cosmar absolutely
    will not pay. Also 60000 Rthl of manufactured goods in stock in the warehouses — but these are to
    be regarded as a working capital — meanwhile these are speaking proofs of the richness of the estates,
    of which a chicaner [uncertain: Chicana] keeps everything back behind him for the execution of his
    plan, and in the meantime lets the good Prince starve together with those about him. I must further
    adduce here that I have also entered the 35000 Rthl formerly advanced to the Prince and to the [uncertain:
    Hochgelaske] for [uncertain: acknowledgement]. From Your Most Serene Highness''s strong benevolence
    shown towards the Prince of Hohenlohe I hope for the granting of my most humble request, whereupon
    I implore [uncertain: at all events] that a report be required from the Higher Provincial Court at
    Brieg — to which His Excellency the 3 Ministers referred the Prince himself — upon the situation of
    the Prince, upon all his sufferings which he must endure through Cosmar, and that all is here truly
    and certainly depicted, whereby more will be brought to light and the oppressive distress of the Prince
    will be proved.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s. Vienna, the 20th of October


    1814


    faithful most humble and obedient servant


    v Triebenfeld'

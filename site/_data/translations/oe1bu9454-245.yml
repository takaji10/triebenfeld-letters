- page: 2
  en: '[text lost] presume Cosmar''s excuse; in fact this march doubts[?] every objection, only so as
    not to have to give out his small [amount] and not to have to let go his booty. The foundation of
    Cosmar''s plan rests upon the capital of 300/m Rthl which the Courland heirs have to claim against
    the Prince, which with the interest included amounts in 1805 to 426,000 Rthl. His Royal Majesty has
    guaranteed the debt, and the former Princess Hohenlohe, as she herself was the debtor, [signed?] the
    instrument together with the Prince [uncertain: writing]. In the oft-mentioned settlement of 1811
    the Prince somewhat made himself again empowered to pay this capital together with interest out of
    his own means, and to free the [uncertain: aforesaid] Princess von Sacken, since married, from the
    payment. A double [wrong?]: firstly because so considerable a payment is expected of the Prince, who
    has not tens, let alone hundreds of thousands to pay — secondly, because they believed they could
    set aside the rights of third interested persons and their consent; and the deceased Princess thought
    too nobly, surely, that she should on the brink of the grave still have set herself to defraud her
    sovereign and more other persons and many hundreds of thousands. No one can here mistake the machinery
    of a self-seeking chicaner, to whom everything had hitherto succeeded — Cosmar knew that the Courland
    heirs already hold no judgment by default in their favour by which the Prince was condemned to pay
    this considerable sum; he knew that with the Prince, whom he had already for 3 years let [uncertain:
    draw], no object of an execution was to be found. He concluded from this that the monarch would now
    be applied to by the Courland heirs for payment; and thus he supposed that His Royal Majesty, incensed
    after this metamorphosis, would disclaim the matter, and out of foresight wholly annul the trust entail
    founded in 1799, which would be [uncertain: indemnified] to me without prejudice to the most high
    interest and to any third party. Then, in his opinion, the former Princess, now Countess Sacken, could
    come forward again, reclaim the estates, then have the poor Prince driven out of everything and [uncertain:
    ejected] — for then Cosmar''s plan would have wholly succeeded, and his reward would certainly have
    been princely — Your Most Serene Highness, only hardly, [uncertain: bear] soon relieve it and counsel
    the good Prince out of Cosmar''s claws. An agreement has already been reached with the mandataries
    of the Courland heirs, according to which they will take 112,000 for the whole demand of 426,000 Rthl,
    give receipt for everything, and hand out the [uncertain: state] documents. Just so an agreement has
    already been reached with all the other creditors, that they will content themselves with a [uncertain:
    assessed] payment of 12,000 Rthl, which the Prince has ordered out of the entailed-estate revenues
    due to him, but which Cosmar, despite all demands even from the Higher Provincial Court at Brzeg,
    will not pay.


    What matters to me is that Your Most Serene Highness most graciously grant an advance of 112/m for
    the payment of the Courland heirs, even if only for a short time; but especially that you deservedly
    annul the settlement of 1811 so maliciously forged by Cosmar, which in the manner of its official
    issue is not [but] suspect, being contrary to the [uncertain: Landt] Act of 1799 of the Pro Memoria
    itself, irreconcilable with the well-acquired rights of third parties, [and] nothing but the presumptuous
    attempt of an intriguing stranger against the Prince''s fortune; that Cosmar then be removed from
    everything, and be held to the strictest rendering of account.


    The advance of 112,000 Rthl can, for which I too, if it be permitted, will stand surety with a security
    of 60,000 Rthl, in the [uncertain: shortest] time indeed be discharged in various ways.


    Were a payment on account, as such is set out under B, not to be accepted at 25,000 Rthl yearly, then
    a part of the 100,000 which Prince August is to receive as a legacy could for the present be applied
    to it. Only above all the settlement of 1811, so dishonouring even to the Prince, must be annulled,
    and an honest, expert administrator be appointed in the name of His Royal Majesty, since that Most
    High Person is interested therein on account of the guarantee. Then nothing stands in the way of the
    discharge of the advance of 112/m. I further remark most [uncertain: submissively] that Cosmar holds
    behind him over 43,000 Rthl of the moneys which the Prince is to draw for his maintenance, and which
    the Prince assigned to the general creditors in [uncertain: Vöglich] — but which Cosmar absolutely
    will not pay — a further 60,000 Rthl of manufactured goods in stock in the warehouses — but that these
    are to be regarded as a working capital — meanwhile these are speaking proofs of the richness of the
    estates, of which a chicaner keeps back everything behind him for the carrying out of his plan, and
    in the meanwhile lets the good Prince and those about him go hungry — I must further adduce here that
    I have included the 35,000 Rthl formerly advanced to the Prince for amortisation. From the strong
    benevolence shown by Your Most Serene Highness toward the Prince of Hohenlohe I hope for the granting
    of my most submissive request, whereby I implore upon [illegible], to require a report of the Higher
    Provincial Court at Brzeg, to which His Excellency the Royal Minister has referred the Prince himself,
    upon the situation of the Prince, upon all his sufferings which he must endure through Cosmar, and
    that all here is truly and certainly depicted, from which more will be brought to light and the pressing
    distress of the Prince will be proved.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 20th of October


    1814


    faithful most humble servant


    von Triebenfeld'

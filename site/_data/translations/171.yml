status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests,


    Since I know that Your Right Honourable takes an interest in news of my most gracious Lord, I permit
    myself to convey to the same the assurance that His Serene Highness is almost entirely healed of the
    affliction on his foot, and is otherwise in perfectly good health; the foot is only very little more
    swollen, and causes no pain. His Serene Highness wishes to be most kindly commended [to you]; the
    Order of St Andrew has given pleasure, yet the obliging conduct of His Majesty the Emperor has produced
    still more gratification.'
- page: 2
  en: 'The Prince is quite enchanted by this young and obliging monarch. In Breslau too the Emperor is
    said to have spoken of His Serene Highness in the most flattering terms. Today the Regiment Hohenlohe
    marched through here; the Prince had ridden out to meet it. Tomorrow the Duke of Weimar is expected
    here. I commend myself to Your Right Honourable''s favour, and have the honour to remain, in the most
    unbounded esteem,


    Your Right Honourable''s


    Erfurt, 24 Nov. 1805


    humble and obedient servant

    A. Hahn'

- page: 3
  en: 'for them and present it. All letters, even all royal official matters that pass from Prussia through
    this hellish country, are opened, and therefore everyone must go cautiously to work, if he does not
    wish to risk his life and all.


    After the battles lost by the French they do indeed put their heads together, but their resolve stands
    firm — Poland is to be wholly restored, and Constantine, whom an army of 60 men, which they are hastily
    to call up, is to make their king. Meanwhile I count upon a discord; as far up as Velun all the towns
    have already declared that they would give neither arms nor men any more, that it was all one to them
    who ruled them, that they must give their dues to the one as to the other, and more they could not
    and would not do.


    With us everything slumbers; only the Friends of Virtue and the Black Brethren are awake. It is dreadful
    how that goes on. If only Your Serene Highness had written something of Bohemia, that I might have
    sent it in with the rest.


    Within about 10 days I shall lay myself personally at the feet of the same Most High, and then more.
    May Your Serene Highness be pleased in the matter of your military affair to take my previous letters
    to heart; answer over everything truly and openly [illegible], then Silesia will swiftly revere in
    him the Governor-General and everything will take on another shape. In deepest reverence I remain,
    until death,


    Your Most Serene Highness''s — In South Prussia nothing will escape Your Serene Highness, once toil
    and fortune have returned; and here one must now leave you unmolested, Most gracious Prince. Deym
    was about to go mad again, but the King pays. Breslau, the 3rd of June 1809.


    faithful and most obedient servant


    v. Triebenfeld'

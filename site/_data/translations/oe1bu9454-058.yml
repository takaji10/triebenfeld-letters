- page: 2
  en: convinced myself that therefore nothing is to be had from there now, because the rebellious noblemen
    now take everything away by force. Were anything at all to be done, I should surely have brought it
    about in the Kahrs — for there Garczynski is chief prefect, and the former district governor Zychlinsche,
    who has only His Excellency to thank, is sub-prefect. Both are my people, who with their absolute
    power — for they are lords over life and death — would do anything for me; only against the law laid
    down among themselves can they not act, because their secretly erected vehmic court and their tribunal,
    under which they in turn stand, threatens even them with death and ruin. In the meantime I have the
    word of both of them that, when a little room to act arises, the one as well as the other will help.
    Only just now neither I nor a Nerlich can do anything; indeed one may easily bring on the confiscation
    of the estates if one acts now prematurely and too hastily. If God helps beat the Austrians, and Russia
    makes no move, then everything will come of itself and South Prussia is ours again, and then such
    men as Your Serene Highness may ever wish can be sent there. Now, however, it is a ticklish business.
    I had to go there, but I had used every precaution and laid down that, if I were not back by such
    and such a time, all Polish wool-dealers and noblemen who were in Breslau should at once be arrested.
    It was not necessary, however, because I found my acquaintances at the helm. For the rest, the Poles
    are so cautious and have a whole host of spies[?] who watch everything — no one may pass out or in
    who is not observed from every side. Goods such as wool, grain or cattle, when exported, are exactly
    registered, and everyone must bring in the money

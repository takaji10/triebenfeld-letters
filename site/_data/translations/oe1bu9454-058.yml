- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s letter, together with the 50 Fr, I have received through the referendary
    Mr. Bally. For this I give the most heartfelt thanks, the more so as I have today bought myself free
    thereby of the burdensome execution for at least 4 weeks, where God will doubtless help further. I
    go this very night to Kontop and from there to Kosten, whither I must present Honrichs there with
    some 80 men fully armed and provided with 2 months'' pay, and where I have also summoned Cabani and
    Hecker. And when I return from there I shall come at once to Schlawenschitz. For the rest, I see that
    Your Most Serene Highness must have as little knowledge of Poland as our King. Gallows and wheel stand
    upon it if anyone exports money, horses, hay or straw — wool, rye, wheat, oxen the Poles permit out
    at a bargain, and thereby bring the money into the country in order to arm themselves. Since I have
    the commission to send in intelligence together with my opinion, I write today to the King that the
    latter too be forbidden as quickly as possible, so that the remainder of our money does not go further
    out of the country and so that the poison and the means be taken from the Poles of arming people further.
    Since it mattered so much to the King to have full intelligence out of Poland, I went myself straight
    to Vater, whence I returned yesterday; I have informed myself of everything and even of the most secret
    plans of the Poles, which I am sending today by express courier to Königsberg. I know and have'

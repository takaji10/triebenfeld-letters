  en: '58


    Most Serene Prince


    Most gracious Prince and Lord!


    Your Most Serene Highness''s letter, together with the 50 fr d''or, I have received through the referendary
    Mr Bally. For this I give my most heartfelt thanks, the more so as I have this day bought myself free
    with it from the burdensome execution, at least for 4 weeks, in which time God will no doubt help
    further. I go this very night to Konotop and from there to Kosten, whither I must provide Honrichs
    there with 80 men fully armed and furnished with 2 months'' [uncertain: pay], and I have also ordered
    Cabanis and Hecker there. And when I return from there I shall come at once to Sławięcice. For the
    rest, I see that Your Most Serene Highness must have as little knowledge as [illegible] and the King
    of Poland. Gallows and the wheel are the penalty if anyone exports money, horses, hay or straw — wool,
    rye, wheat, oxen for [uncertain: sheep] the Poles permit out, and in return to bring the money into
    the country so as to arm themselves. Since I have the commission to send in reports with my own opinion,
    I am writing today to the King, that the latter too be forbidden as quickly as possible, so that the
    remainder of our money does not go further out of the country and the Poles be deprived of the [uncertain:
    poison] and of the means to arm more men henceforward. Since it mattered so much to the King to have
    full reports from Poland, I went at once myself to Kalisz, from where I returned yesterday; I have
    informed myself of everything and even of the most secret plans of the Poles, which I am sending today
    by express courier to Königsberg. I know, and have satisfied'

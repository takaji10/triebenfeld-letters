- page: 2
  en: 'satisfied myself, that therefore nothing is now to be had there either, because the rebellious
    nobles now take everything away by force. Were anything at all to be done, I should surely have brought
    it about in Kalisz — for there Garczynski is chief prefect, and the former district councillor Zychlinski,
    who owes his very existence to [illegible], is sub-prefect. Both are my men, who with their absolute
    power — for they are lords over life and death — would do anything for me; only against the laws laid
    down among themselves they cannot act, because their secretly established Vehm and their court, under
    which they in turn stand, threatens them too with death and destruction. I have, however, the word
    of both of them that as soon as there is a little room to act, the one as well as the other will help.
    Only at present neither I nor [uncertain: Nerlich] can do anything; indeed one may easily bring on
    the confiscation of the estates if one acts now prematurely and too hastily — If God helps beat the
    Austrians, and Russia makes no [uncertain: stroke], then everything will come of itself and South
    Prussia is ours again, and then such men as Your Serene Highness may ever wish can be sent there.
    But at present it is a ticklish business. I had to go there, but I had taken every precaution and
    laid it down that if I were not back by such and such a time — all the Polish [uncertain: voivodes]
    and nobles who were in Wrocław should at once be arrested. But it was not necessary, since I found
    my acquaintances at the helm. For the rest, the Poles are so cautious and have a [uncertain: host
    of] spies who watch everything — no one may pass out or in who is not observed on all sides — goods
    such as wool, grain or cattle that are exported are exactly registered, and everyone must bring in
    the money'

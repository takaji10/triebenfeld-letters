- page: 3
  en: 'for them and present it — All letters, even all Royal official matters that pass from Prussia through
    this hellish country, are opened, and therefore everyone must proceed cautiously if he does not wish
    to [text lost] and risk everything.


    After the battles lost to the French they do indeed put their heads together, but their resolve stands
    firm — Poland is to be wholly restored, and Konstantin, whom an army of 60/m men, which they are hastily
    to [uncertain: organise] and call up, is to be their King.


    Meanwhile I count on a quarrel; the [uncertain: Liste Telung] and up as far as Velun all the towns
    have already declared that they would give neither arms nor men any longer, that it was all one to
    them who ruled them, that they must give their dues to the one as to the other, and more they could
    not and would not do.


    With us all lies slumbering; only the friends of virtue and the black brethren are awake — it is dreadful
    how it goes on. If only Your Serene Highness had written something at least about Bohemia, that I
    might have sent it in with the rest.


    Within 10 days at the latest I shall lay myself personally at the feet of the same most exalted person,
    and then more — May Your Serene Highness deign, in the matter of your military affair, to take my
    earlier letters to heart; answers, true and open about everything [illegible], then Silesia [uncertain:
    receives] in him quickly the Governor-General, and everything takes on another shape —


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s — In South Prussia nothing will escape Your Serene Highness, with labour
    and fortune returning, and here one must now leave you, most gracious Prince, unmolested. Beyme was
    like to go mad again, but the King pays. Wrocław, the 3rd of June 1809.


    most faithful and obedient servant


    v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince! Most gracious Prince and Lord! Your Most Serene Highness''s gracious letter
    of the 3rd of the current month arrived here at the very moment when the Kl. v. Triebenfeld was about
    to depart. I was still able to lay it before him, and he was greatly gladdened that Your Most Serene
    Highness has deigned to [gracious satisfaction to outward] with his exertions. The payment of the
    assignation has, according to the intelligence received, already been effected at the [uncertain:
    ledighe] counting-house. Everything will henceforth depend upon the revision of the situation and
    its expedition. The principles at the public authorities are, moreover, so passing/transient, that
    everyone wrestles with the same and lets four weeks stand over. Three or four months ago the whole
    business was settled more briefly and with fewer scruples. Now it is otherwise.'
- page: 2
  en: 'What I can [uncertain: beſtrengen — exert/strain] toward it, to fulfil Your Most Serene Highness''s
    wishes, I [hold to be a] sacred duty, and I am most thankful to the same for such gracious expressions.
    Mr. v. Truberger will, I hope, not withhold from me the testimony that I have not been wanting in
    diligence and industry. Since this, however, is a duty for me, I set a particular value upon it, though
    I could equally wish that the faithful fulfilment of the same, like the gracious sentiments of Your
    Most Serene Highness, might long be preserved. I remain with reverence Your Most Serene Highness''s
    Berlin, the 9th of February 1805 most humble and obedient servant AMuntte[?]'

- page: 13
  en: 'No. 480.


    Most Illustrious Contentious Division of the Peace Court of the Konin District. From Drzewce, the
    28th day of March 1811. I submit, pursuant to the order of the Most Illustrious Tribunal, the files
    concerning the conclusion of the contract between His Serene Highness of Hohenlohe-Ingelfingen and
    Krysztof Erbet of the Trąbczyn Hollander settlement, appending likewise the liquidation of costs amounting
    to 9 Tal. 18 dgl., with the request that these be recovered from Krysztof Erbet by execution. To the
    public treasury there is due for stamp, to be brought to account, 18 dgl., and 9 Tal. are my own due.


    With all respect, the Most Illustrious Court''s


    most humble servant


    Hawich'

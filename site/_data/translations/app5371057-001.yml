  - I.
- page: 2
  en: 'Highness lets to Christoph Erbet one Hufe, in words One Hufe Magdeburg, at thirty Morgen to the
    Hufe, and each Morgen reckoned at One Hundred and Eighty square rods, situate in the Trąbczyn forest,
    from now on for everlasting time in hereditary lease.


    §. II. Christoph Erbet pays for the one Hufe Magdeburg 100 Rthl., in words One Hundred Reichsthaler,
    as entry money, already, and since this entry money is already fully paid, Christoph Erbet is hereby
    receipted for it without further reservation.


    §. III. Christoph Erbet hereby binds himself, for himself and his successors in the possession of
    this holding, to pay from this one Hufe an annual [continued]'
  names:
  - de: Christoph Erbet
    en: Christoph Erbet
    kind: person
  - de: Trąbczyner Walde
    en: Trąbczyn forest
    kind: place
  numbers:
  - '100'
  - II.
  - III.
- page: 3
  en: 'hereditary canon of Thirty Thaler, in words thirty Rthaler, to the manorial lordship (Dominium)
    here, and this hereditary quit-rent shall be discharged yearly in two instalments, namely one half
    at Christmas and the other half at Midsummer, each time in cash and in Courant, into the lordship''s
    treasury.


    §. IV. For the wholly uncultivated arable the hereditary lessee receives three free years, which begin
    from Martinmas of the past year and end at Midsummer 1809, so that the first half-yearly hereditary
    quit-rent must be paid at Christmas 1809 with 15 r., in words Fifteen Rthaler.


    Such land as is already handed over to Christoph Erbet as cultivated at the measuring-out, be it much
    or little'
  names:
  - de: Christoph Erbet
    en: Christoph Erbet
    kind: person
  numbers:
  - IV.
  - '1809'
  - '15'
  - '1809'
- page: 4
  en: 'in amount, bears interest from Christmas of this year, since the free years extend only to that
    part which has first to be brought under cultivation.


    §. V. The hereditary lessee is at liberty to redeem the fixed hereditary quit-rent of Thirty Rthaler
    up to one half; that is, he may according to his means pay off to the ground lordship one, two, up
    to three Hundred Reichsthaler of capital, whereupon for every hundred Rthaler five Rthaler shall be
    taken off the hereditary quit-rent yearly; the capital so paid off remains the property of the ground
    lordship, and this redemption of the hereditary quit-rent takes place only in respect of the first
    half; the second half, at'
  numbers:
  - V.
- page: 5
  en: 'Fifteen Reichsthaler per Hufe, on the other hand remains irredeemable, and can never be raised
    or lowered.


    §. VI. Besides the cash hereditary quit-rent the hereditary lessee undertakes, for now and for future
    everlasting times, to discharge and render all the [uncertain: assessed] [uncertain: pänglichen] and
    other [uncertain: gleitlichen] dues falling upon this one Hufe, consist in what they may, without
    any exception and without deduction from the hereditary quit-rent or any other reimbursement.


    §. VII. The hereditary lessee must build at his own cost, without receiving for this, either now or
    in the future, timber or any other building assistance [illegible] In da'
  numbers:
  - VI.
  - VII
- page: 6
  en: 'However, all the timber standing on his Hufen belongs to him in property without exception. Likewise
    the hereditary lessee and his successors in the possession of this holding must effect all future
    repairs and new buildings out of their own means, without subsidy or assistance.


    §. VIII. Outside his own allotment the hereditary lessee has no right to firewood or [uncertain: pasturage]
    in the lordship''s forests and fields.


    §. IX. The hereditary lessee must always take his drink from the lordship''s brewery and distillery
    or from the tavern. If foreign drink be brought in by him or his people, the hereditary lessee shall
    each time incur a penalty of five Reichsthaler for every barrel of beer and one Rthaler'
  numbers:
  - VIII
  - IX
- page: 7
  en: 'for every garniec of brandy, which penalty shall be paid to the ground lordship.


    §. X. The hereditary lessee is subject to the mill compulsion, and may grind his grain only where
    the estate lordship directs him.


    §. XI. From each and every manorial service and delivery in kind without distinction the hereditary
    lessee is wholly and for ever exempt; he remains, however, subject to the jurisdiction of the manorial
    lordship here.


    §. XII. The hereditary lessee and his successors in possession are entitled to alienate his holding
    to another in any manner he pleases, but on every sale'
  numbers:
  - X
  - XI
  - XII
- page: 8
  en: 'or exchange the tenth Groschen of the purchase or exchange money must be paid to the ground lordship
    as a transfer fee (Laudemium), and the consent of the same must be obtained for every alienation,
    the ground lordship hereby reserving to itself once and for all the right of pre-emption.


    §. XIII. The hereditary lessee renounces, for himself and his successors in possession, wholly and
    for now and for the future, each and every remission in cases of misfortune, whether the same arise
    through fire from heaven, arson by evil persons, hailstorm, failure of crops, cattle plague, flood,
    war and pestilence, or in whatever manner it may be, and upon the occurrence of such [continued]'
  numbers:
  - XIII.
- page: 9
  en: 'cases neither compensation nor remission of the hereditary quit-rent shall take place.


    §. XIV. The hereditary lessee undertakes to discharge all the costs attending this contract.


    §. XV. His Most Serene Highness consents that the hereditary lessee may, on the ground of this contract,
    have his title of possession settled for himself.


    §. XVI. So long as the hereditary lessee and his successors in possession shall fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights'
  numbers:
  - XIV.
  - XV.
  - XVI.
- page: 10
  en: 'and to defend them against every man''s claim in rem.


    Should, however, the hereditary lessee or his successors remain in arrears with the annual hereditary
    quit-rent longer than two years, or lay this holding waste and thereby diminish the revenues of the
    ground lordship, the ground lordship shall be entitled to dispose of this holding otherwise, and the
    hereditary lessee shall forfeit his whole right and the entry money paid in.


    Both parties promise to keep this hereditary-lease contract firmly and inviolably; having been instructed
    by the court as to the consequences, they renounce'
- page: 11
  en: 'all evasions available against it, in particular the plea of an injury suffered above or below
    the half, of cunning persuasion, fear, duress, of matters otherwise agreed than written down, or not
    understood; they moved that this contract be made out judicially, and have, after previous reading
    aloud word for word, in token of approval subscribed and signed below in their own hands.


    von Triebenfeld xxx own hand mark of Christoph Erbet


    a. u. [uncertain: d]. Schenck


    Justiciary


    Myrodow[text lost]


    Keeper of the protocol. The foregoing contract is to be made out in duplo and to be communicated to
    both parties with the notification that'

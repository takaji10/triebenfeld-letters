- page: 1
  en: 'Actum Mariantów, the thirty-first of March One Thousand Eight Hundred and Six. There appeared the
    persons well known to the undersigned justiciary, namely


    1. Mr von Triebenfeld, Councillor of War and Forests, as general and authorised representative of
    His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the
    court of this place, legitimated by the power of attorney annexed, of the one part


    and


    2. the resident Christoph Erbet of Trąbczyner hauland, of the other part.


    The parties appearing are in a condition validly to execute judicial acts, and freely and after due
    deliberation declare to the protocol the following hereditary-lease contract:


    §. I. His Most Serene [continued]'
  names:

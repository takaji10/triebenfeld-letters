  en: 'and Red Eagle Orders etc., Mr Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, drew up before
    us and with our assistance the foregoing general power of attorney directed to the Royal Councillor
    of War and Forests Mr von Triebenfeld, of this date, and, after His Highness had once more perused
    and approved the same beforehand, subscribed and sealed it in his own hand in our presence as to its
    literal content: this is hereby attested testante protocollo de hodierno in fidem publicam. Thus done
    in the Górzyce justice office near Wrocław, the 19th of February 1805.


    (L. S.)



- page: 15
  en: 'Special Power of Attorney.


    The undersigned makes known and acknowledges hereby, that hereby expressly empowers, in the name of
    the petitioner, pursuant to the annexed certified general power of attorney of 19 February 1805, which
    was issued by the reigning Prince of Hohenlohe-Ingelfingen to Mr von Triebenfeld, Councillor of War
    and Forests, Your Right Honourable.


    Whatever the said authorised representative shall do by virtue of this commission received, promise
    hereby to approve, and to hold thereto as inviolably as if | had done it oneself. At the same time
    also bind oneself to indemnify the authorised representative in every respect on account of this commission,
    and to'

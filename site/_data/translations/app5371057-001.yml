- page: 18
  en: 'suspend them, and in general to act unrestrictedly and freely before all authorities and in all
    matters as he shall find good and most agreeable to my interest. Whatever my said authorised representative
    shall do by virtue of this commission received, I promise hereby to approve and to hold thereto as
    inviolably as if I had done it myself. At the same time I also bind myself to indemnify my authorised
    representative in every respect on account of this commission, and to reimburse him for all costs
    and outlays, on pledge of my present and future property, so much thereof as shall be required for
    this. In witness whereof I have subscribed the general power of attorney in my own hand and confirmed
    it by the affixing of my arms. Thus done in the Górzyce justice office near Wrocław, the 19th of February
    1805.


    (L. S.) Read and approved by myself, Friedrich Ludwig, Prince of Hohenlohe. That His Serene Highness
    the reigning Prince and Lord, very well known in person to the undersigned justice office and fully
    competent to dispose, General of Infantry, chief of a regiment, Governor of the town and fortress
    of Wrocław, and Knight of the Great Black'

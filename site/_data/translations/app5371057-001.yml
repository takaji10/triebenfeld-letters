    in his own hand, and confirmed it by the affixing of a seal. Thus done
- page: 17
  en: 'Copy


    General Power of Attorney. I, the undersigned, make known and acknowledge hereby that I do hereby
    expressly empower the Royal Councillor of War and Forests Peter Friedrich August von Triebenfeld,
    Your Right Honourable, of Świniary etc., to attend in my name to each and every matter concerning
    the Zagórów, Witów and Trąbczyn estates belonging to me, situate in South Prussia in the Kalisz department,
    be they matters of a dismemberment or of purchase and sale, of leasing or of pledging, or by whatever
    other name they may go and whatever bearing and influence they may have, both judicially and extrajudicially;
    to petition for and respectively to report all approvals or orders of conduct necessary in that behalf,
    as well as all other requisites appearing to him necessary, before the Most Praiseworthy Chamber as
    well as before the Most Praiseworthy Government at Kalisz and before all other authorities; and to
    attend to all other requisite business for me; to settle accounts with the lessees and to conclude
    compositions; to pay moneys, to receive the like, and to give receipts for them; to issue to my officials
    and servants there the orders serviceable to his purpose, to examine their conduct and performance
    of duty, and if he should find such not agreeable to his judgement and prejudicial to me, in case
    of need to'

- page: 20
  en: 'Official copy of the hereditary-lease contract between His Serene Highness the reigning Prince
    of Hohenlohe-Ingelfingen and the resident Christoph Erbet.


    No. 1730, for the hereditary lessee. The Princely Hohenlohe Patrimonial Court at Trąbczyn hereby certifies
    that between His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord of
    the Zagórów and Trąbczyn estates, of the one part, and the resident Christoph Erbet of the other part,
    concerning one Hufe Magdeburg situate in the Trąbczyn forest, the following hereditary-lease contract
    has been concluded and judicially declared.


    No. 1731, for the hereditary lessor /: insert the protocol. This hereditary-lease contract is now
    hereby made out under the affixing of the court seal and the usual signature. Mariantów, the 23rd
    of May 1806. Princely Hohenlohe Patrimonial Court at Trąbczyn. To Mr von Triebenfeld, Councillor of
    War and Forests, Your Right Honourable, at


    Trąbczyn


    No. 1732. We communicate to Your Honour herewith the hereditary-lease contract made out between His
    Serene Highness the reigning Prince of Hohenlohe-Ingelfingen and Christoph Erbet concerning one Hufe
    Magdeburg in the Trąbczyn forest, and make known to you that, pursuant to a general rescript issued,
    the confirmation of this contract must be sought from'

- page: 2
  en: 'known [to Your Highness], and it is precisely from that quarter that they wish it to be called
    a mere matter of grace. My sense of honour, however, always rebels against everything that carries
    even the appearance of begging, and in this regard I walk quite quietly and [uncertain: steadfastly]
    onward along the straight road marked out for me; and I am certain that, despite all the idle chatter,
    I shall reach the goal of my wishes. The Monarch wishes Your Most Serene Highness well, and the exchange
    has been approved by the King provided the estates hold the balance against one another — the balance
    therefore decides it; and the King''s friendship does no more in this than that for estates lying
    far off, nearer ones are given — and there is no shame in thanking the Monarch for that. The equality
    of the estates is meanwhile provided for — and in this way everything will resolve itself of its own
    accord. Count Schlabrendorff I have [uncertain: persuaded] to accept from me, for the interest payable
    to him, a bill of exchange payable in a year''s time. I shall go to him on Sunday to settle this business.


    Everything else I shall attend to in the best manner. For the rest, I note humbly for myself further
    that Prittwitz'

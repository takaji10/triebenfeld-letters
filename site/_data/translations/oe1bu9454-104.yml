- page: 2
  en: 'known to Your Highness, and from that very quarter it is wished that it should be called a mere
    matter of favour — My sense of honour, however, always rebels against everything that carries so much
    as the appearance of begging, and with this in view I go on quite quietly and [uncertain: Bider] along
    the straight road marked out for me, and I am certain that, for all the idle chatter, I shall reach
    the goal of my wishes — The Monarch means well by Your Most Serene Highness, and the exchange has
    been [uncertain: approved] by the King, provided the estates hold the balance one against the other
    — the balance, then, decides the matter — and the King''s friendship does only this much in the business,
    that for estates lying far off nearer ones are given — and to thank the Monarch for that is no disgrace
    — For the equality of the estates provision has however been made — and in this manner everything
    will resolve itself. Count Schlabrendorff I have persuaded so far that he takes from me, for the interest
    payable to him, a bill of exchange payable a year hence. I go to him on Sunday to settle this business.


    Everything else I shall attend to in the best manner. For the rest, I humbly note further that Prittwitz'

- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    Gladly do I endure all the talk behind my back from Thorn, if only I may see Your Most Serene Highness''s
    affair brought to the desired end; and that this will happen within a couple of months I pledge to
    Your Serene Highness upon my honour and my property. That grass-speaker will meanwhile do the least
    of all in the matter, for I believe, and regard, the affair as settled. A person quite insignificant
    and unknown will decide the matter. To paper I cannot entrust this — Every [thing] I have had the
    grace to [?] to Her Serene Highness the Princess of the truth. The whole affair will resolve itself
    of its own accord and will be brought to a conclusion for Your Most Serene Highness as honourable
    as it is advantageous — that a valuation of Your Serene Highness''s estates is to be prevented arises
    from the source most fully known to Your Highness'

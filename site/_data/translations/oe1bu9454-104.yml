- page: 3
  en: 'is a pitiful liar — the man said not a word to me further, and that indeed in the presence of [uncertain:
    Wildegans] — but rather: My God, Your Serene Highness torments me, I am to take the matter upon myself.
    I have already told the gentleman that I cannot do this — and I shall also write it once more to Your
    Serene Highness. Since I now knew everything better, I let the fool talk and sought to advance the
    matter for myself.


    My sense of honour would also never permit speeches of this kind, and the discourse could not have
    ended so humiliatingly on my part as he wished to boast. Behind my back, however, the man may say
    what he likes; I shall willingly and gladly bear it all in silence until we are at the goal of our
    wishes — If Your Serene Highness will but grant me the continuance of Your most gracious good will,
    then I remain, until death, as Your Most Serene Highness''s


    About the 16th of April I go from here to Berlin, where I shall remain until the end of May. The estates
    which I sold to Prince George now come out, according to a valuation by a councillor of justice and
    a chamber councillor, at over 700000 Rthl etc. Since [uncertain: the gentlemen] meant, through me,
    to be ruined to the tune of 500000 Rthl, I am too good-natured a fool and often do harm to one and
    to children.


    Breslau, the 3rd of April 1799


    faithful, most humble and obedient servant

    v. Triebenfeld'

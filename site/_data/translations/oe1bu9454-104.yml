- page: 3
  en: 'is a pitiful liar — the man said no further word to me, and that in the presence of the said [uncertain:
    Wildeganstes], than: "My God, Your Serene Highness torments me, I am to take the matter up — I have
    already told the gentleman that I cannot do this — and I shall write it to Your Serene Highness once
    more —" Since I now knew everything better, I let the fool talk and sought to advance the matter for
    myself. My sense of honour would never permit speeches of this kind either, and the discourse could
    not have ended so humiliatingly on my side as [uncertain: b.] would boast. Behind my back the man
    may say what he pleases; I shall bear everything quietly, gladly and willingly, until we are at the
    goal of our wishes — Let Your Serene Highness only grant me the continuance of Your most gracious
    favour, and so I remain, until death, Your Most Serene Highness''s


    About the 16th of April I go


    from here to Berlin, where I stay


    until the end of May. The estates which I sold to Prince George now come out, according to a valuation
    by the judiciary and the Chamber [uncertain: Räthl], at over 700/m Rthl etc. As was meant, the [illegible]
    through me to 500/m Rthl — [text lost] I am too good-natured a fool and [illegible] often a one and
    a [illegible] to children harm


    Wrocław, the 3rd of April


    1799


    most faithful and humble servant


    v. Triebenfeld'

  en: '104


    Most Serene Prince,


    Most gracious Lord!


    Gladly do I endure all the backbiting of fools, if only I may see Your Most Serene Highness''s affair
    brought to the wished-for end, and that this will happen within a couple of months I pledge to Your
    Serene Highness upon my honour and my property. That [uncertain: grass speaker] will meanwhile do
    the least about it, for I believe and regard the matter as settled. A man quite insignificant and
    unknown will decide the matter. This I cannot entrust to paper — Meanwhile I have had the grace to
    convince Her Serene Highness the Princess of the truth. The whole affair will resolve itself and will
    be brought to a conclusion for Your Most Serene Highness as honourably as it will be advantageous
    — that there is a wish to prevent a valuation of Your Serene Highness''s estates arises from the source
    most'

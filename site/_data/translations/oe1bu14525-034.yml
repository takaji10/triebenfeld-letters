- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our gracious greeting first: Worthy Councillor,
    dear and faithful subject! We hereby make known to you, upon your representation of the 13th of this
    month, that the resignation of the estates of Kolno and Kamionna has already been performed by the
    Treasury (Fiscus). For the resignation of the Pszczew estates a term is appointed for the 22nd of
    March of this year. As regards the estates situate in Cujavia which have been conferred upon the reigning
    Prince of Hohenlohe-Ingelfingen, the resignation of the Treasury has not yet been applied for at all,
    and it is expected that the rectification of the title of possession of these estates be effected
    by an admitted judicial commissary without [uncertain: Remonern] delay. We remain graciously disposed
    towards you. Given at Poznań, the 22nd of February 1802. Royal South Prussian Government.


    Götz.


    To the Princely Hohenlohe Building and Economy Councillor Glenck at Wrocław'

segments:
- page: 1
  en: Warsaw, the 5th of March 1812. Dear Brother, I hasten to inform thee that on account of various
    affairs I shall not be able to set out from Warsaw before the 15th of this month. The matter concerning
    Trąbczyn stands, according to reliable intelligence obtained, quite well, whereof I shall say more
    to thee by word of mouth. For shortness of time, since the conveyance is departing, I cannot write
    thee more. Farewell to the friend and both. Brzechsta

segments:
- page: 1
  en: 'Warsaw, the 5th of March 1812.


    Dear Brother, I hasten to inform you that, on account of various pieces of business, I shall not be
    able to depart from Warsaw before the 15th of this month. The matter concerning Trąbczyn stands, according
    to reliable information obtained, quite well, about which I shall tell you more by word of mouth.
    For shortness of time, as the conveyance is leaving, I cannot write you more. Farewell


    to the friend and both.


    Brzechsta'

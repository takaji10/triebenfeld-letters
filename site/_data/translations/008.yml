- page: 1
  en: 'The moment I sat down to write to Your Serene Highness I received all at once 3 letters – one of
    the 8th, one of the 25th about [uncertain: reading] the 27th of November. – The enclosed, which brought
    me [uncertain: "zuvermünden"] my poor children, drove me almost to madness, and I write with a trembling
    hand – Have mercy, then, and send 120 Rthl to the Lüder woman, and if I remain here yet a long while,
    then again 60 Rthl per month – the [uncertain: Wärmer] must be maintained – I sacrifice myself here
    for you, I live solely on borrowed money, I put my own and my children''s welfare out of sight for
    your sake, and you are so unmerciful and let the children suffer the utmost want in spite of all my
    entreaties – Your affair now stands heavenly well, even they can now already have credit, so do not
    let my children starve there – The lamentations of the abandoned children are dagger-thrusts to my
    heart – Sinews and limbs might be crippled in me when I must hear the cry of woe, and yet I am to
    work for you, my Prince, work. Now one thing more — would it then not be possible to obtain from the
    Curz Mandatarius a small written assurance that the matter is to be settled with 112000 dH. The Prince
    believes me, but we have mighty enemies – One sweats mightily these weeks over what has been done
    against the pp expert opinion, and had I not, through the [uncertain: adten] B. –, let it be known
    in the proper quarter that Herr [illegible] z. M. v. Kirchen is himself to be regarded as the party,
    since he parades in the matter as guardian, then all would have been sent to Becke. Hahn will be very
    glad; I shall write to him myself. Only provide, most gracious Lord, for my children there, – I shall
    provide here. Papers I do not need here now, for they are needed only there. Apart from a few words
    from the Curz Mandatarius. Thus I receive the 2nd letter from my poor daughter — Prince, help, or
    the devil will take me. My children and I are going down in misery, and that for your honour''s sake.'

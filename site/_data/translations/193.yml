status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Most Serene Highness''s gracious letter
    I receive only this moment (it is the 10th, 5 o''clock in the afternoon /, so it has been 10 days
    on the road. The plan concerning the journey is thereby wrecked; besides, I would also most humbly
    beg Your Serene Highness not to make the journey as far as Parchwitz. It attracts notice, and one
    cannot there act, nor even speak, so undisturbed. I shall come yet this month, and before I go to
    Berlin — as surely as there is a God above — myself to Schlawenschitz. For cases are now arising upon
    which I must know Your Serene Highness''s high will and opinion, in order to be able to speak in Berlin.
    By all probability the whole theatre is changing. — According to Colonel Scharffenberg''s assurance,
    things are fermenting in Petersburg to the point of an uprising. I direct my attention very much thither
    — The Polish estate affairs will end well; the Dabsha has already twice [uncertain: let the term pass]
    and pays all the costs in order to gain time from me; the Prefect Garczyński is now having Honrichs
    arrested [illegible]. I have myself begged him to have everything strictly investigated. Honrichs
    is, notwithstanding the attestations of the Sub-prefect Sarzechscha, nevertheless, as the Prefect
    has decreed, a rogue — He owes over 10000 Rthl. — One has always let him go on, because by hints he
    led people astray, as though he were bringing the money to Your'
- page: 2
  en: Serene Highness, or merely — since the Prefect has convinced himself of the contrary, that he has
    not given a single Groschen hither, they are now laying hold of him — the Sub-prefect has furnished
    security for the Patron — It is believed that he too drew the greater part out of the estates through
    Honrichs. A piece of good fortune that I got the 600 Rthl back from the fellow, in order to let him
    know nothing of the connexion with Count Trzcinski — Garczynski is having Heckern, with the assistance
    of the court-appointed Administrator Radecki, search everything out, so that the arrears may be quickly
    paid and the estates delivered up to Your Serene Highness free again. In deepest reverence I remain,
    until death, Your Most Serene Highness's — Kontopp, the 10th of April 1810. — most faithful and most
    obedient servant v Triebenfeld

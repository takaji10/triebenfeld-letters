- page: 1
  en: 'P[ro]. M[emoria].


    26 June 1812. General Kleist, during his stay in Kalisz, asked the prefect Count Garczynski how matters
    stood here with the Hohenlohe estates, and whether they were estates of consequence – the prefect
    answered him that the estates were considerable but that during the war period, and through the ruin
    of the rent-paying people, they were in great disorder, so that even dues were still in arrears –
    whereupon Mr. von Kleist said: The Prince''s sons told me in Berlin, Our father has never yet drawn
    a Groschen out of the estates – the councillor of war von Triebenfeld sits in the estates, puts all
    the revenues in his own pocket and lets his favourites devour the rest. I am not [uncertain: lassen
    halten] but Cabanis, Hecker, Honrichs and the sequestrators, it was so before – the latter [uncertain:
    works up] Schenck, there everything must come to light, and Cabanis is now, in the presence of the
    komornik von Chomanowski, laying out his account, which he is to bring to you himself, my Prince?
    Neither I nor my sons could pass the matter over in silence; it has here been brought into public
    notice, and therefore I am having it investigated by the komornik von Chomanowski.'

- page: 2
  en: 'I never counted on thanks and gain, but as God lives I will not let myself be branded as an incendiary
    for all the cares and sufferings I have endured, nor that you, my Prince, [uncertain: hunt]; and that
    for 6 years now you have drawn nothing out of the estates is true, but one must look here to where
    it pinches: the people are in part stiff-necked and do not pay much, but they are also already impoverished,
    and the houses stand empty; the rent arrears altogether amount, without the Oller nizer, Wrgbitzer
    and peasant holdings, to some 30000 Rthl, all in all certainly to 80 or 90; and are then the capitals,
    such as the Invalids'', Weigel''s and the Bayonne ones, together with what stands upon Träpiren and
    what Your Serene Highness have drawn, to be reckoned as nothing? – If after all this there still remains
    to you a revenue of 14 to 1500 Rthl a year, and the Bayonne sum amortises itself, then you and your
    descendants can truly not complain. That I enrich myself – that is truly a cursed thought,'

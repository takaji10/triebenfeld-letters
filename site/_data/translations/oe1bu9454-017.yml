- page: 4
  en: 'Should it be true, then it is ill done to spread this abroad among people here; I seek not one
    thing only [uncertain: constantly to guard] your honour, but also to defend and preserve your property.
    God will give me back my health; but may Heaven also grant many a mercy. Here you will not do me the
    harm of bringing Sommer back again, for otherwise the whole thing ends tragically.


    Now I beg of you a swift answer concerning Sobottendorff, concerning Weigel and concerning the Invalids''
    sum; if these are so, then they are out of all embarrassment, and one can thereafter count with confidence
    upon a secure revenue; on the contrary, however, if with the Invalids'' Fund this cannot be effected,
    all may be said to be lost.


    With Weigel and Sobottendorff it will be arranged through me, if you so wish and if Sobottendorff
    only comes here soon, to get the 50000 Rthl for the Invalids'' Fund out of the [uncertain: Wahl] there
    – for it is a matter of great worth. As to the instruction upon the decree of the French [uncertain:
    Grünval] Department, and especially the decree itself and the original receipt enclosed, I beg that
    Your Serene Highness will send the same, as well as the answer in this matter, as speedily as possible
    [uncertain: Unzucht] then on account of writing, I lie, truly, [uncertain: Landdauer] von Triebenfeld'

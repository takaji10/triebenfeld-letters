- page: 3
  en: 'thought. I have, God knows, been racked with lawsuits for what [is] hidden somewhere, I suffer
    want with my children, am worn down by sickness in [uncertain: misery], and such young gentlemen say
    in Berlin that I enrich myself here and put the money ad saccum. Altogether, a nasty gossip must be
    coming out of Sławięcice and out of that [uncertain: source] — I seek to preserve everything and strive
    to save it; I beg repeatedly that Your Serene Highness should not get involved with these people and
    should not trust them too much, but I am not heard. Thus Sommer has now again trumpeted about here
    that you have nothing at all left, and God knows what ways you are taking to obtain money; and especially
    that you have all of you, dear to the Princes, contracted 1,700000 Rthl of debts in burgher times,
    that you are thereby excluded from all inheritance, and that only 25,000 Rthl a year is set aside
    for him for maintenance, but that this has all already been placed under arrest for the local debts,
    which likewise amounted to several hundred thousand.'

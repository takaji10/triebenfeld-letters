- page: 3
  en: 'I have [uncertain: myself before God], what is [uncertain: concealed] there, been tormented for
    it with lawsuits, I suffer want with my children, am worn down by sickness in misery – and such young
    gentlemen say in Berlin that I enrich myself here and put the money ad Sakham. In general, a nasty
    gossip must be coming from Schlawenschitz and out of that quarter – I seek to preserve everything
    and strive to save, I often beg that Your Serene Highness should not give way to these people and
    should not trust them too much, but I am not heard. So now Sommer has again trumpeted it about here,
    that you now have nothing at all left and God knows what courses you take to obtain money; in particular,
    that upon the Prince''s [uncertain: theuer] in the burgher period they had contracted debts of 1,700000
    Rthl, that you were thereby excluded from all inheritance, and that only 25000 Rthl a year were set
    aside for his maintenance, but that these, on account of the debts here, which likewise amounted to
    several hundred thousand, had all already been placed under arrest.'

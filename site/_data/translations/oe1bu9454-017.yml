- page: 1
  en: '17


    P[ro]. M[emoria].


    General Kleist, during his stay at Kalisz, asked the prefect Count Garczynski how matters stood here
    with the Hohenlohe estates, and whether they were estates of any consequence — the prefect answered
    him that the estates were considerable, but that during the war period, and through the ruin of the
    rent-paying people, they were in great confusion, so that even dues were still in arrears — whereupon
    Mr von Kleist said: The Prince''s sons told me in Berlin, Our father has never yet drawn a single
    Groschen from the estates — the councillor of war von Triebenfeld sits upon the estates, pockets all
    the income, and lets his favourites devour the rest. I am not [uncertain: lassen halten] but rather
    Cabanis, Hecker, Honrichs and the sequestrators were so before — the last of these Schenck works up,
    there everything must come to light, and Cabanis is now, in the presence of the komornik von Chomanowski,
    laying out his account, which he is himself to bring to you, my Prince. Neither I nor my sons could
    pass over the matter in silence; it has here been brought into publicity, and therefore I let it be
    investigated by the komornik von Chomanowski.


    26 June 1812'

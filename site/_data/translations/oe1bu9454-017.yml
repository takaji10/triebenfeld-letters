- page: 4
  en: 'Were it true, then it is a bad thing to spread this abroad among people here; I seek not one thing
    only, always to send [forth] your honour, and also to defend and preserve your property. God will
    give me back my health; but may Heaven also [be] somewhat merciful. Do not send Sommer back here to
    me again, or the whole business will end tragically.


    Now I beg for a speedy answer concerning Sobottendorff, concerning Weigel and concerning the Invalids''
    sum; if these matters are so, then those who are out of all embarrassment can thereafter count with
    confidence upon a secure revenue — on the contrary, however, if this cannot be effected with the Invalids''
    Fund, all may be said to be lost.


    With Weigel and Sobottendorff it will be seen to through me, if you so wish and Sobottendorff only
    comes here soon, to get the 50,000 Rthl for the Invalids'' Fund out of [uncertain: außen Siedort]
    out of the choice — for that is a matter of great worth. As to the instruction upon the decree of
    the French general [uncertain: Departements], and particularly the decree itself and the original
    receipt annexed thereto, I beg that Your Serene Highness will send the same, together with the answer
    on this matter, as speedily as possible [uncertain: Unzucht], for regarding the writing I lie truly
    wretched [uncertain: derein]


    von Triebenfeld'

- page: 2
  en: 'On thanks and gain I never counted, but as for being branded an incendiary for all the cares and
    sufferings I have endured — as surely as there is a God, I will not bear that either. That you, my
    Prince, now and already these 6 years past draw nothing from the estates is true; but one must look
    here to where it pinches: the people are in part stiff-necked and do not pay much, but they are also
    already impoverished, and the houses stand empty. The rent arrears altogether amount, without the
    Oleśnica, Wrąbczyn and peasant holdings, to some 30,000 Rthl; all in all certainly some 80 to 90/m
    Rthl. And are the capitals then — such as the Invalids'', Weigel''s and the Bayonne one, together
    with what stands upon Trąbczyn and what Your Serene Highness has drawn — to be reckoned as nothing?
    — If after all this there still remains to you a revenue of 14 to 1,500 Rthl a year, and the Bayonne
    sum amortises itself, then truly you and your descendants cannot complain. That I should be reckoned
    up so — that is truly a cursed'

segments:
- page: 1
  en: 'Countess Schlabrendorff will wait for the 50000 Rthl until Christmas, or properly speaking until
    the 1st of January 1805; Homuth has not been able to move her to a longer term. She made a most piteous
    business of it, that she must lose so much, and since she received no interest on this capital the
    loss would be greater still were she to wait longer than until the 1st of January 1805. — If it be
    so that Your Serene Highness need pay no interest until then, I believe it will be an easy matter
    to rest content with this term. — There are, after all, 2500 Rthl gained thereby — and by that time
    money enough will come in. — Homuth asks for the settlement, so that he may draw up what is needful
    and send it to the Countess for execution. — He will try whether he can, on that occasion, get the
    old bills of exchange out of her hands.


    The surveyor Cabanis has departed. Out there he will hire a peasant''s conveyance, which he believes
    he can obtain for 4 or 5 Rthl. Here the hired coachmen wanted to have 20 Rthl and demanded besides
    an allowance for [uncertain: Entter] and God knows what


    by way of assistance —


    v Triebenfeld


    Breslau, the 29th of March 1804.'

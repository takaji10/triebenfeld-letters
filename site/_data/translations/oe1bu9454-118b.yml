segments:
- page: 1
  en: 'The Countess Schlabrendorff will wait for the 50000 Rthl until Christmas, or properly until the
    1st of January 1805; Homuth was unable to move her to a longer term. She made a most piteous business
    of it, that she must lose so much, and since she received no interest from this capital, the loss
    would be still greater if she were to wait longer than until the 1st of January 1805 — If it be so
    that Your Serene Highness need pay no interest until then, I believe it will be easy to rest content
    with this term — 2500 Rthl are after all gained thereby — and by that time money enough will come
    in — Homuth asks for the settlement, so that he may draw up what is needful and send it to the Countess
    for execution — He will try whether he can, on that occasion, get the old bills of exchange out.


    The surveyor Cabanis has departed. He will hire himself a peasant cart out in the country, which he
    believes he can get for 4 or 5 Rthl. Here the hired coachmen wanted 20 Rthl and demanded besides,
    for [uncertain: fodder] and God knows what,


    an allowance —


    Wrocław, the 29th of March 1804.


    v Triebenfeld'

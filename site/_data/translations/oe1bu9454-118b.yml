- page: 1
  en: 'The Countess Schlabrendorff will wait for the 50000 Rthl until Christmas, or properly speaking
    until the 1st of January 1805; to a longer term Homuth was not able to move her. She made a most piteous
    show of how much she would have to lose, and since she received no interest on this capital, the loss
    would be greater still if she were to wait longer than until the 1st of January 1805. — If it be so
    that Your Serene Highness need pay no interest until then, I believe it will be an easy matter to
    be content with this term. — There are, after all, 2500 Rthl gained thereby — and by that time money
    enough will come in. — Homuth asks for the agreement, so that he may draw up what is needful and send
    it to the Countess for execution. — He will try whether on that occasion he can get the old bills
    of exchange out. The Conducteur Cabanis has departed; he will hire himself a peasant''s conveyance
    out there, which he believes he can obtain for 4 or 5 Rthl. Here the hired coachmen wanted to have
    20 Rthl, and demanded besides an allowance for [uncertain: fodder] and God knows what else. — v Triebenfeld
    Breslau the 29th of March 1804.'

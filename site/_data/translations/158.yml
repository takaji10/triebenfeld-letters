status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! At last, through the mediation of the venerable General
    v. Köckritz, it has been achieved that the Invalids'' Department has now declared itself willing to
    furnish 150000 Rthl, without my having to seek permission for it from His Majesty the King, which
    is otherwise the course of business. The Department gives for the present, upon the mortgage and my
    bill of exchange, 50000 Rthl, since the Chamber must still revise the assessments, and after these
    the Department pays the 100000 Rthl, which, provided the interest is duly paid, may stand for 50 years.
    The [uncertain: populle] Depositorium, the Widows'' Fund, still less the Bank or the Seehandlung,
    likewise pay not a farthing more into South Prussia, but are at pains to call everything in — this
    makes a fearful stoppage in all business and spreads such Oh! and Ah among the people that one''s
    hair stands on end. I too should have obtained nothing, had not the worthy General taken up my cause
    in the most active manner. The 26 Jan 1805.'
- page: 2
  en: 'The bankers here now themselves give, merely to keep themselves afloat, 10 to 12 per cent proximaticum
    for 5 to 6 per cent interest; and besides Liep: Meyer Wolff each sets his own terms — he alone still
    has money, and thinks of those seeking money whatever pleases him. Whoever now falls into the hands
    of men of this sort is irretrievably lost. God and the honest friend be heartily thanked that here
    He allotted a better and truly the most desirable lot of all. — As soon as I now receive the money
    I shall pay the urgently demanded 10000 Rthl, and send Your Serene Highness with all speed the sum
    remaining after deduction of costs. With the Tirard and Hauk affair I am finished; tomorrow I pay
    the arrears of interest out of my own money, and then someone will take over the debt, which can then
    rest quietly for 4 years. The suit on account of the proxenetica taken I do not find well advised
    — the thing damages Your Serene Highness''s credit anew, and frightens off all those so-called men
    of business who are hand in glove with one another. This was even already cast up at me in the course
    of this very business, and they appealed to the fact that Seebald was to bring suit and demand back
    the proxenetica;'
- page: 3
  en: The Biron affair has instilled fear and terror in all — the moral lecture which Your Serene Highness
    writes to me only on account of the Schlabrendorff affair I did not deserve. Any breach of word is
    foreign to my heart, and shall remain so to my last breath. I do not indeed know what I wrote in that
    agonising moment; in every point I must have expressed myself erroneously, in order to reply to Your
    Serene Highness's letter. — Honour remains in all my dealings the first spring of action; to it I
    sacrifice labour, means, and health. And the truth which I then spoke in the Pro Memoria upon the
    whole Schlabrendorff affair is, in my manner of it, no knavish trick. — I should curse all my dealings,
    and withdraw — as I am much inclined to do — into the last corner of the earth, far from all men,
    if in the end I were to be judged so. The Mennonites I shall answer definitely according to Your Serene
    Highness's command. Wöllenhaupt's judgement concerning the dismemberment of the estates is too insignificant
    for a further word to be said upon it. Let Your Serene Highness deign to give him the commission and
    promise him a few thousand, and he will undertake to dismember half the world. — I have the proofs
- page: 4
  en: 'still before me. — [uncertain: Rochtet] matters I shall dispatch on my return to Unruhstad. The
    free pass for the wines must by now already be there. What the Betschen subjects want I do not understand
    — there must again be some store of mischief lurking in the background. Meanwhile the date of this
    letter is of the month of June, and indeed earlier than that of the contract. Next Wednesday I go
    back from here, in order to direct at [uncertain: Kalleg] the revision of the assessment, so as to
    obtain the 100000 Rthl the more quickly, and then to be able to dismember in peace. The Eysenhardt
    affair proceeds [uncertain: gradually] and well, so that Your Serene Highness will have no vexation
    on that account. In deepest reverence I remain, until death, Your Most Serene Highness''s — Concerning
    the monies to be sent out to the Reich, about half of 30000 Rthl could now be got together — I thought
    Your Serene Highness might send these now, and promise to remit the other 15000 Rthl soon after. Berlin,
    the 26th of January 1805, humble and obedient servant v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! Herr Wiener, Meyer Bernhard, and consorts are bad fellows.
    First they promised to pay everything in Berlin – in Berlin the word was again that Friedländer had
    gone away. They would settle everything in Frankfurth. Now that I arrive here today, they assure me
    that they will send the 76000 Rthl, as well as a further 20000 Rthl or so, by express courier in bank
    obligations, precisely to [uncertain: Bernhardi gebschick]. To the question why they are holding back
    30000 Rthl – Answer: we are already paying too much, for Your Serene Highness has, after all, bought
    back Betsch. I am still doing battle with the [uncertain: Schl] and just this moment Meyer Bernhard
    promises to add a further 10000 Rthl, but the wretch stays behind by 20. In Berlin, since Wanster
    had drawn up the obligation defectively, I was still able to obtain the money. Only some few thousand
    t. did I take on bills of exchange'
- page: 2
  en: 'in Trąbczin to be able to offer face in every direction, and thereby that Your Serene Highness
    may find money at hand. The deposition of the Brunieweisch moneys will nonetheless doubtless be ordered;
    I have pushed it through by way of the Grand Chancellor and Gen. Köckritz. This is honourable for
    Your Serene Highness, and certainly some seventy thousand [uncertain: Kl.] will be gained thereby.
    Had I acted sooner, alone and with the [uncertain: dreißigkeit], everything would already have been
    disposed of. The reply from the King concerning the compensation is quite civil and seems to betoken
    good will. Meanwhile General v. K. has charged me to convey his most cordial greetings to Your Serene
    Highness and to tell you most highly that you should quite certainly receive estates, and indeed right
    good ones, in hereditary lease, upon which something might be gained. Money the King would not be
    in a position to give, and since Schlabrendorff wishes to return, this follows of'
- page: 3
  en: itself. In any event the hereditary lease should be arranged advantageously. For the rest, the Princess
    Sacken has, out of especial grace and mildness, been pleased, as soon as she heard that Your Serene
    Highness had purchased the estates, to have the capital of 30000 Rthl standing upon [illegible] Koschentin
    called in through Herr Cosmar. Oh, the shame of it! Herr Gen. v. K. despises her [illegible], and
    so does every honest man. May God but bring Your Serene Highness back in health – all will nonetheless
    go well, and Your Highness will in every way yet stand as victor. In deepest reverence I remain, until
    death, Your Most Serene Highness's Frankfurth on the Oder, the 21st of June 1804. most faithful servant
    v Triebenfeld

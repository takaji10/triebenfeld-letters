- page: 2
  en: 'and the remainder in cash or in Silesian mortgage bonds; if indeed more should be needed, he thought
    he could at all events add a further 20000 Rthl by the grant of good secure mortgages upon Silesian
    possessions.


    In this connexion it was further intimated that if, contrary to old Schimmelpfennig''s expectation,
    more funds should be required for this requisition, he would wish that this quantum might remain entered
    upon the estates, or that I should retain as my property the arrears and the debts outstanding in
    the estates, toward the recovery of which he would then gladly co-operate. To Berlin he already dispatched
    his two sons on Friday a week ago, also to make liquid the maternal capital of the Prussian mortgage
    bonds. These now stand in Berlin at the rate of 52 1/2 per cent; for the estates which he wishes to
    be brought in, there would according to [uncertain: führen] and reliable statement well be 95000 Rthl
    in cash money to be obtained in a sale; hence, according to the plan he has devised, he would in all,
    even if he gives 220000 and reckons it properly still in Courant, receive 170000 Rthl. If anything
    is to come of the transaction, he must be convinced with probability that he gains considerably by
    it; and since my situation absolutely requires that this prospect be made use of, I trust to Your
    Right Honourable''s prudence that you will make use of this my [uncertain: Wicke], and to my thanks
    and satisfaction bring this intended business happily to a conclusion. Lieutenant Sommer I have likewise
    instructed to that effect, and he will with full vigour, at'

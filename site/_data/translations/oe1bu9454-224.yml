- page: 4
  en: 'whereby funds may soon come to hand. I have sent an express courier to Öhringen to press for my
    son''s coming here. It must have arrived there today, and I hope soon to receive an answer thereupon
    after the [uncertain: present] year, or else to see them here soon myself. In several respects I now
    find myself sorely harassed, and I have my hands quite full in order to avert several evils. [uncertain:
    Exert] yourself now, my better friend, to everything that can further our intended business of the
    estate sale and bring it quickly to a conclusion. Lieutenant [Sommer], when he comes, will report
    everything to you faithfully and will certainly not be wanting in his exertions. I hope, if all goes
    happily, to see you again in good cheer, and I look forward to your [text lost] do not leave me without
    news, especially when you have anything serviceable to report. Your intended journey to Nysa will
    probably not have taken place, since I heard nothing further about it. The other matter, upon which
    you wished to make disclosure to me by word of mouth, lies very much at my heart, and I could wish
    to receive from you at least some provisional hints upon it. To Lieutenant Sommer I further charge
    to lay before you certain matters which it might perhaps be necessary to put in order before the arrival
    of the Johnston sons-in-law, and I most submissively beg that you will be pleased to give favourable
    consideration to this.


    Be pleased to remain ever assured of my true attachment and of the assurance of that esteem [text
    lost]'

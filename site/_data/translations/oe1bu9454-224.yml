- page: 3
  en: 'his presence in Sel[u?]ze endeavour to work to the end that General Schimmelpfennig [illegible]
    and that, as Your Right Honourable, in the speediest manner possible make known. This is what I am
    able to say upon this matter, and I add only the request that [uncertain: Your Right Honourable] may
    apply everything so that this prospect that has been opened may soon be realised. My welfare and my
    woe truly depend upon it. My gratitude towards you will match my friendly sentiments. — One further
    circumstance, which has arisen since yesterday, makes me wish the more to make use of this prospect,
    since I now know for certain that the project of selling our estates to Weigel and Stössel is not
    [uncertain: inclined]. The cavalry captain von Stössel of Rusinowice arrived here yesterday from Berlin
    by way of Wrocław, where his father gave him a commission to me, and travelled back to Rusinowice
    today. He had also spoken with Weigel confidentially and at length. He assures me that the latter
    will not enter into this bargain, that his father, as is quite true, cannot do it alone, and that
    Rusinowice was to be drawn in seemed to astonish him. In short, for the realisation of this plan there
    remains not the least appearance. He made me some proposals from his father, which the latter only
    wishes to repeat, for which purpose he has thought to visit me about the 6th of January. Perhaps some
    way out may yet be found for his reassurance. It would be useless to say anything further about this
    plan, which I must regard as wholly failed, than that it is for that reason the more necessary to
    pursue the threads taken up with Schimmelpfennig. Since help is indispensably necessary to me, I conjure
    you to exert everything there to bring the lawsuits to an end'

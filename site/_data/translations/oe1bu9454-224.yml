- page: 1
  en: 'Your Right Honourable.


    Unfortunately I have had to keep Your Right Honourable''s [uncertain: dead man] waiting until today,
    to whom I have paid the requisite daily allowance and his wages. I was put off from one day to the
    next before I obtained closer and somewhat definite information concerning the subject mentioned to
    the same in my last lengthy letter. Through General Schimmelpfennig I received today the news that
    he could not himself, at his advanced age and in the present weather, [uncertain: inspect] the Zagorowo
    estates, but had resolved to commission his two sons-in-law, the cavalry captain von Kotzow and Mr.
    von Johnston, to do so, and for that reason wishes to see Lieutenant Sommer with him after the holidays,
    so that he might make this journey with them thither after being given closer information beforehand
    about several matters concerning the estates. What I have now provisionally learned today with some
    reliance concerning the General''s opinion, which I here to Your Right Honourable, about which much
    may yet turn or be directed otherwise, in the meantime it might be necessary to enter into his ideas
    and to govern oneself accordingly in the counter-accounts. He, the General, hopes to obtain my estates
    at 23000 v/d, and his plan of payment for it, if things were to go according to his wish, is to be
    the following:


    1. he would gladly bring his estates Seliz and Modkewo into the transaction for 110000,


    2. then he would wish to include the small estate Goła wies, which at present


    Mr. von Johnston possesses, and in which he has 6000 Rthl,


    3. then he wishes a capital belonging to the General''s lady, which amounts to 66000 Rthl, but which
    consists in East Prussian mortgage bonds, to be accepted at par; to the amount of 12000 Rthl he would
    likewise mostly in such papers still [uncertain: wollen]'

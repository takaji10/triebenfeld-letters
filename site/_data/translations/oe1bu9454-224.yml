- page: 4
  en: 'whereby funds may soon come to hand. I have sent an express courier to Öhringen to urge on my son''s
    coming. He must have arrived there today, and I hope soon after the new year to receive an answer
    thereupon, or to see them here myself soon. In several respects I now find myself much harassed, and
    I have my hands full to avert several evils. Prepare yourself, my best friend, now for everything
    that can advance our intended business of the estate transaction and lead it swiftly to conclusion.
    Lieutenant [text lost] will report everything to you faithfully and will certainly not be wanting
    in his exertions. I hope, if all goes happily, to see you again with joy, and I rejoice in your [illegible].
    Do not leave me without news, especially when you have anything pertinent to report. Your intended
    journey to Neisse will probably not have taken place, since I heard nothing further about it. The
    other matter, upon which you wished to make disclosure to me by word of mouth, lies very much at my
    heart, and I could wish to receive from the same only some preliminary hints upon it. To Lieutenant
    Sommer I further commit the laying to heart of certain matters which might perhaps be necessary to
    be set in order before the arrival of the Johnston sons-in-law, and I most submissively beg that you
    will be pleased to take favourable regard thereof.


    May you be pleased to be ever assured of my true attachment and the assurance of that esteem [text
    lost]'

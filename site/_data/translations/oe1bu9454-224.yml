- page: 2
  en: 'and the remainder in cash or in Silesian mortgage bonds; if indeed more should be needed, he thought
    that at a pinch he could add a further 20000 Rthl by the provision of good secure mortgages upon Silesian
    possessions.


    It was further intimated that if, contrary to old Schimmelpfennig''s expectation, more funds should
    be required for this requisition, he wishes that this amount might remain entered upon the estates,
    or else that I should retain for myself, as my own property, the arrears and the claims outstanding
    in the estates, in the collection of which he would then gladly assist. To Berlin he already dispatched
    his two sons on Friday a week ago, and to make the maternal capital of the Prussian mortgage bonds
    liquid. These now stand in Berlin at a rate of 52 1/2 per cent; for the estates he wishes to put forward,
    according to [uncertain: leading] and reliable statement, some 95000 Rthl in ready money would probably
    be obtainable in a sale; hence, according to the plan he has devised for himself, he would in all,
    even if he gives 220000 and properly reckons in Courant besides, receive about 170000 Rthl. If anything
    is to come of the bargain, he must be convinced with some probability that he gains considerably by
    it; and since my situation absolutely requires that this prospect be made use of, I trust to Your
    Right Honourable''s prudence that you will make use of these hints of mine and will bring this intended
    business happily to a conclusion, to my thanks and satisfaction. Lieutenant Sommer I have likewise
    instructed to that effect, and he will with full vigour, upon'

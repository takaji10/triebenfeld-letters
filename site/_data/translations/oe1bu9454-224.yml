- page: 1
  en: '224


    Your Right Honourable,


    Unfortunately I have had to keep Your Honour''s messenger waiting until today; I have paid him the
    requisite daily allowance and his wages. I was put off from one day to the next before I obtained
    closer and somewhat definite information on the matter mentioned to you in my last lengthy letter.
    Through General Schimmelpfennig I received the news today that, at his advanced age and in the present
    weather, he could not himself view the Zagórów estates, but that he had resolved to commission his
    two sons-in-law, the cavalry captain von Kotzow and Mr von Johnston, to do so, and that he therefore
    wishes to see Lieutenant Sommer with him after the holidays, so that he might make this journey there
    with them, after having first given them closer information on several matters concerning the estates.
    What I have now provisionally learned today, with some reliability, of the General''s opinion, which
    here to Your Right Honourable — as to which much may yet be turned or directed otherwise — in the
    meantime it may be necessary to enter into his ideas and to arrange the counter-calculations accordingly.
    He, the General, hopes to obtain my estates at 200/m Rthl, and his plan of payment for it, if it were
    to go according to his wish, is to be as follows:


    1. he would gladly bring his estates Seliz and Modzewo into the bargain for 110/m,


    2. then he would like to include the small estate of Goła wieś, which


    Mr von Johnson now possesses, and in which he has 6000 Rthl,


    3. further he wishes to have a capital belonging to the General''s wife, amounting to 66000 Rthl,
    but consisting in West Prussian mortgage bonds, accepted al pari; some 12000 Rthl he would also mostly
    [wish?] still in the like papers'

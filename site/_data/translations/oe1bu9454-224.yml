- page: 3
  en: 'his presence in Seloze endeavour to work to the end that General Schimmelpfennig [uncertain: Cathen]
    and that, as Your Right Honourable, in the most expeditious manner possible. This is what I am able
    to say on this subject, and I add only the request that you may apply every means that this prospect
    now opened may soon be realised. My weal and woe truly rest upon it. My gratitude towards you will
    match my friendly sentiments. Yet one more circumstance, which has arisen since yesterday, makes me
    wish all the more for the use of this prospect, since I now know for certain that the project for
    the sale of our estates to Weigel and Stössel has not [uncertain: geleigt]. The cavalry captain von
    Stössel of Ruzynowice arrived here yesterday from Berlin by way of Breslau, where his father gave
    him commissions to me, and travelled back to Ruzynowice today. He had also spoken confidentially and
    at length with Weigel. He assures me that the latter would not enter into this transaction, that his
    father, as is quite true, could not do it alone, and that Ruzynowice was to be brought into it seemed
    to astonish him. In short, for the realisation of this plan there remains not the least appearance.
    He made me several proposals from his father, which the latter wishes only to repeat, for which purpose
    he has thought to visit me about the 6th of January. Perhaps some way out may yet be found for his
    reassurance. It would be useless to say anything further about this plan, which I must regard as wholly
    failed, than that it is on that account all the more necessary to pursue the paths entered upon with
    Schimmelpfennig. Since help is indispensably necessary to me, I conjure you to exert everything there
    to bring the lawsuits to an end'

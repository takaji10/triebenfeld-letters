- page: 3
  en: 'the steward has himself paid 4 Groschen daily per person / of whom there are 18 /. The subjects
    find this too hard, that they should be sold like slaves to serve other, strange men. The steward
    has moreover made it known to the people that he will draw all 18 householders entirely to the village
    bailiff''s holding, and that Glenck means to sell them along with it to von Marowecki, who on those
    terms gives 15,000 Rthl for the village bailiff''s holding.


    The subjects implore that Your Serene Highness might not permit this; they will gladly give one rthlr
    per Morgen of their fields and render everything else that lies within their power. I have referred
    the people with their petitions and lamentations to the justice-burgomaster Schenck, and have requested
    him to quiet them and to bring the matter to a clear issue, so that Glenck may not cry out again that
    I mean to wrest from him his well-acquired property.


    In deepest esteem I remain, until death,


    Your Most Serene Highness''s


    Trąbczyn


    the 2nd of December


    1804


    most humble and obedient servant


    v Triebenfeld'

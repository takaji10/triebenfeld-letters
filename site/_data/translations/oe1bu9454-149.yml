- page: 2
  en: 'Berlin as much money as is necessary for the payment of the Schlabrendorff, Legnowelii and other
    pressing creditors, and I pay. Gradually the money for these plots comes in, and that debt is paid
    off again; in this way nothing is lost through precipitancy and the great aim is attained. It goes
    hard, very hard, for much has been spoilt by the easy earlier sales; nevertheless my perseverance
    will prevail, for that I answer.


    The recent vexation with Glenck, where the man tells me to my face that I mean to wrest his property
    from him, and the annoyance with the Olesnica hereditary lessees, who have been stirred up, has brought
    on me a frightful colic which forced me to keep to my bed for 3 days; I am still very much out of
    sorts.


    For the rest, the Wrgbiner subjects have protested against their contract and refuse to render the
    interest. Their complaint is that Glenck has threatened them to take away their plots and to give
    them others in their stead; besides this they complain that Glenck''s clerk has compelled them to
    serve through the whole year still, and that he, since he could not use all the services on the bailiff''s
    holding, has sent the subjects to Zagorowo, where they must work for the townspeople, and for which'

- page: 2
  en: 'Berlin as much money as is needed for the payment of Schlabrendorff, Lichnowski and other pressing
    creditors, and pay them. Gradually the money for these plots comes in, and that debt is paid off again;
    in this way nothing is lost through precipitancy and the great aim is attained. It goes hard, very
    hard, for much has been spoilt by the easy earlier sales; yet my perseverance will prevail, for that
    I answer.


    The late vexation with Glenck, where the man tells me to my face that I mean to wrest his property
    from him, and the annoyance with the hereditary leaseholders stirred up by the Oleśnica people, have
    brought upon me a frightful colic which compelled me to keep my bed for 3 days; I am still very poorly.


    For the rest, the Wrąbczyn subjects have protested against their contract and refuse to render the
    rent. Their complaint is that Glenck threatened [uncertain: them] to take their plots away and to
    give them others in their place; besides this they complain that Glenck''s clerk compelled them to
    serve through the whole year still, and that he, being unable to use all the services on the village
    bailiff''s holding, sent the subjects to Zagórów, where they must work for the burgesses, and for
    which'

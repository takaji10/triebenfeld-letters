- page: 3
  en: 'the steward has himself paid 4 Groschen daily per person (of whom there are 18). The subjects find
    it too hard that they should be sold like slaves into service to other, strange people. The steward
    has moreover made known to the people that he intends to draw all 18 farmers entirely to the bailiff''s
    holding, and that Glenck means to sell them along with it to von Marowecke, who in that manner gives
    15000 Rthl for the bailiff''s holding.


    The subjects implore that Your Serene Highness might not permit this; they would gladly give a [uncertain:
    Rund] per Morgen from their fields, and render everything else that lay within their powers. I have
    referred the people with their petitions and lamentations to the justice-burgomaster Schenck, and
    requested him to quiet them and to bring the matter into order, so that Glenck may not cry out again
    that I mean to wrest from him his well-acquired property.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Trąbczyn


    the 2nd of December


    1804


    most humble and obedient servant


    v Triebenfeld'

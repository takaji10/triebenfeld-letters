- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Still I await the arrival of the Oder and Netze marshland people. From Wednesday on they will doubtless
    present themselves in droves, and then I hope soon to be at the goal of my wishes. Several plots which
    the Swięcer people would have marked out, and which lay about the boundary as waste corners, I have
    sold very advantageously; I not only place the soil that nobody had any regard for well with a buyer,
    but likewise [uncertain: shape the layout] so as now to be able to conclude better with the large
    purchasers for regular parcels. From the plan I once drew up I do not depart, and I stand surety that
    no Hufe shall be given away under 600 Rthl (that is to say, purchase money and interest taken together).
    If it has succeeded with the very worst plots, then it will not fail me with the better ones. The
    valuation will probably be finished this week, and, as I hope, will come out at over 400000 Rthl for
    the Zagorowo estates. By this means all ill-will is defied; I shall take up in'

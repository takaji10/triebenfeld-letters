- page: 2
  en: 'Berlin as much money as is needed for the payment of Schlabrendorff, Legnowelii and other pressing
    creditors, and pay them. Gradually the money for these grounds comes in, and that debt is paid off
    again; in this way nothing is lost through over-hastiness and the great object is attained. It goes
    hard, very hard, for much has been spoilt by the easy earlier sales; nevertheless my perseverance
    will prevail, for that I stand surety.


    The recent vexation with Glenck, where the fellow tells me to my face that I mean to wrest his property
    from him, and the annoyance with the hereditary leaseholders stirred up by the Olesnice people, has
    brought on me a frightful colic which compelled me to keep to my bed for 3 days; I am still very much
    out of sorts.


    For the rest, the subjects of Wrgbin have protested against their contract and refuse to render the
    rent. Their complaint is that Glenck has threatened them to take their grounds away and to give them
    others in their place; besides this they complain that Glenck''s clerk has compelled them to serve
    the whole year through, and that, since he could not use all the services on the bailiwick, he has
    sent the subjects to Zagorowo, where they must work for the townspeople, and for which'

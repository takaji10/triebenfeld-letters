  en: '149


    Most Serene Prince


    Most gracious Lord!


    Still I await the arrival of the people from the Oder and Netze marshes. From Wednesday onward they
    will probably present themselves in whole troops, and then I hope to be swiftly at the goal of my
    wishes. Several plots which the Swięcia people had [uncertain: marked out], and which lay about as
    waste corners along the border, I have sold very advantageously; I not only place well with a purchaser
    the soil that was held in no regard at all, but likewise the figure, so as now to be able to conclude
    better with the large purchasers for regular parcels. From the plan I once drew up I do not depart,
    and I stand surety that no Hufe shall be given away under 600 Rthl / that is, ground-money and rents
    taken together /. If it has succeeded with the very worst plots, then it will not fail me with the
    [uncertain: better ones]. The valuation will probably be finished this week and, as I hope, will come
    out at over 400,000 Rthl for the Zagórów estates. By this means defiance is bidden to all ill-will;
    I take in'

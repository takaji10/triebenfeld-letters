- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    Still I await the arrival of the people from the Oder and the Netze marshes. From Wednesday onwards
    they will doubtless present themselves in droves, and then I hope quickly to be at the goal of my
    wishes. Several parcels of ground which the Swięce people had marked out, and which lay about the
    boundary as waste corners, I have sold very advantageously; I not only place the soil, which was not
    esteemed at all, well with a purchaser, but likewise [make] the shape [of the land], so as now to
    be able to conclude better with the large purchasers upon regular plots. From the plan I once drew
    up I do not depart, and I answer for it that no Hufe shall be given away under 600 Rthl (that is to
    say, ground-money and interest taken together). If it has succeeded with the very worst grounds, then
    it will not fail me with the better ones. The assessment will probably be finished this week, and,
    as I hope, will come out at over 400000 Rthl from the Zagorowo estates. By this means all ill-will
    is defied; I shall take in'

- page: 1
  en: 'Now I no longer know what I am to think. Five letters have I sent off; to not one of them [uncertain:
    abd] have I been deemed worthy of an answer — this is the 6th letter — by way of the Chief Post [uncertain:
    dereckte] Mann I sent the last one, which Your Serene Highness must have collected. Through his kindness
    I send this one again today. My utmost distress I have described in every one of them — and Your Serene
    Highness does not answer even once. I take here the pains that are most conceivable to me. Everything
    appears to succeed and to promise the happiest outcome. Even the Kosch business has been set in train,
    though it has been referred back to Berlin until the return. The Curische debt will be discharged,
    the settlement annulled, Cosmar must withdraw, and Your Serene Highness comes into possession of the
    entailed estate, and may live in old age quietly and happily. The Polish estates too must be given
    back, however much everything is against it. For all these toilsome labours you let me suffer here
    the most oppressive want; that is, by Heaven, dreadful — what I have submitted, and everything is
    secured upon it, is no little pot-game [i.e. no trifling matter]. Your Serene Highness need make no
    secret of it, for all will succeed, and once the goal is reached you will indeed be truly fortunate
    — how can you let me all but perish of want for it? Send Gold, I beg it earnestly. Be graciously pleased
    to address your letters to the Royal Prussian Chief Post Director Mann residing in Vienna, in the
    Massakrop 1156. Should meanwhile the posts really be at fault, then may Your Serene Highness deign
    to send an express messenger with money; nowadays not so many difficulties are made any longer.'

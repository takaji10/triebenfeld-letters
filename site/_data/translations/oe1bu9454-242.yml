status: draft
segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    After a toilsome journey, upon which I spent 3 days and 2 nights, I have arrived in Vienna — the most
    exorbitant dearness I found to be the order of the day here; the dear and sometimes very tattered
    paper, which as is known takes the place of ready money, brings the stranger to the brink of ruin,
    because it does not [uncertain: guide] the native and the foreigner alike. But of that a [uncertain:
    Floro] — the honest man may not live without reckoning. My text, with which I came hither, was to
    work and to accomplish. The first thing I heard upon my entry into the famous imperial city was the
    shattering news that the Congress has been postponed until the first of November, that the sovereigns
    are travelling to Ofen and Pest for several days, will hold great [uncertain: manoeuvres] there and
    return towards the end of this month. Further, that France is setting itself very much against our
    Saxon and Polish acquisition. My old patriotic heart could have burst over these novelties. — And
    I hope that this is merely a façon de parler, or rather a mere feint (fin de paille) — Prince Hardenberg,
    whom I have found in good health and [uncertain: firm], stands of steadfast mind and will let nothing
    be taken from him of his right — so much, in the meantime, of general matters. Now to the various
    items of business. The Württemberg affairs go well — the King of W., who at bottom is very ill content
    to be here, will yield much; he will himself draft a constitution and submit the same to the allied
    monarchies for examination and confirmation'
- page: 2
  en: '— the assembled estates press hard upon the good gentleman, and find a satisfied hearing — Prince
    Mett: would be the chief opponent of this regent — but the marriage is held to be certain, and since
    the title of Royal Highness is to be conferred along with it, this might well bring about a change
    in the sentiments of Prince M. I have asked the Privy Councillor von Gärtner to me at noon today,
    [uncertain: as] someone else from the Cabinet will also be with me — He appears to be a man à la [uncertain:
    Fandel], though more settled — the Privy Council[illegible] Goesch is a refined, obliging and good-natured
    man, who through the Princess — who for the present, together with her consort, commends herself most
    cordially to Your Serene Highness — is more effective than the former — Herr von Gärtner is an author,
    and many writings against Württemberg, Baden and Nassau are circulating here; by the first post I
    shall forward several of them. With B. and A. I have spoken very fully about the Schlaw: affairs,
    and obtained their counsel before I submitted the matter to the Lord State Chancellor Prince Hardenberg
    — my plan has been very well approved, and they will guarantee its success. Concerning Koschentin
    I can as yet bring forward nothing — the funds required in the Kurp affair seemed already a very very
    great capital — this business will therefore only come up once the Courland one has succeeded. As
    regards the G[uncertain: K]ülm and Kaehmin matter, as also the Trąbczyn matter, nothing can be determined
    sooner than until Poland''s fate is decided — this much, however, I know, that the Moscinska née Prusimska
    has great friends, and that even Count Nesſi has been drawn into her game through Landskog. It is
    a sad thing that all our [uncertain: couriers] go to Berlin by way of Prague and Dresden. With the
    frequent traffic I could have sent Your Serene Highness many a thing on the [uncertain: spot] — yet
    I shall neglect nothing —


    In deepest reverence I remain, until death,


    Your Serene Highness''s


    P.S. This very moment I learn that all


    princes who cannot furnish 12000 men are to be mediatised for ever; then one will also not have [uncertain:
    olden] it, unless it be that it [text lost] Vienna, the 12th of 8br 1814, most faithful and humble
    and obedient servant v Triebenfeld'

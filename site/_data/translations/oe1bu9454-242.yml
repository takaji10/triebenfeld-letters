- page: 1
  en: '242


    Most Serene Prince


    Most gracious Prince and Lord!


    After a toilsome journey, upon which I spent 3 days and 2 nights, I have arrived in Vienna — I found
    the most exorbitant dearness to be the order of the day here; the dear and sometimes very tattered
    paper, which as is well known takes the place of ready money, brings the stranger to the verge of
    ruin, because neither the native nor the foreigner sets it right. But of that a Floro — the honest
    man may not live without calculation — My text, with which I came hither, was to work and to accomplish.
    The first thing I heard upon my entry into the famous imperial city was the shattering news that the
    Congress has been postponed to the first of November, that the sovereigns are travelling to Ofen and
    Post for several days, there to hold great [uncertain: monreniren] and to return towards the end of
    this month. Further, that France is resisting our Saxon and Polish acquisition very strongly. My old
    patriotic heart could have burst over this [uncertain: Neuweke]. — And I hope that this is merely
    a façon de parler, or rather a feu de paille — Prince Hardenberg, whom I have found in good health
    and strong, stands firm in his mind and will let nothing be taken from him of his right — so much,
    meanwhile, on general matters — Now as to the various affairs — The Württemberg affairs go well —
    the King of W[ürttemberg], who is at bottom very discontented here, will concede much; he will himself
    draft a constitution and lay the same before the allied monarchies for examination and confirmation'

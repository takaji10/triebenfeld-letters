- page: 2
  en: '— the estates as a body are storming in upon the good gentleman, and find a satisfied hearing —
    Prince Mett[ernich] would be the chief opponent of this ruler — but the marriage is held to be certain,
    and since the title of Royal Highness is to be conferred, this may well bring about a change in the
    sentiments of Prince M — I have invited the privy councillor von Gärtner to me today at noon, where
    someone else from the Cabinet will also be with me — He appears to be a man à la [uncertain: fandel],
    though more settled — the privy councillor Goesch is a fine, courteous and good-natured man, who through
    the Princess — who for the present, together with her consort, commends herself most cordially to
    Your Serene Highness — is more effective than the former — Mr von Gärtner is an author, and [text
    lost] many writings against Württemberg, Baden and Nassau are circulating here — by the next post
    I shall send over several of them. With B[arbe] and A. I have spoken very fully about the Sławięcice
    affairs, and have taken their counsel before I submitted the matter to the Lord State Chancellor Prince
    Hardenberg — My plan has been very much approved, and they will guarantee its success. Concerning
    Koszęcin I can bring nothing forward as yet — the funds required in the Courland matter already appeared
    a very, very great capital — this business will therefore only come on once the Courland one has succeeded.
    With regard to the Kolno and Kamionna matter, as also the Trąbczyn matter, [uncertain: Land] nothing
    can be determined sooner than until Poland''s fate is decided — this much, however, I do know, that
    the Miączyńska née Prusimska has great friends, and that even Count Nesſi has been drawn into their
    game through Lanskoy. It is sad that all our [uncertain: Concire] go to Berlin by way of Prague and
    Dresden. With the frequent traffic I could have sent Your Serene Highness many a thing already — yet
    I shall neglect nothing —


    In deepest reverence I remain, until death,


    Your Serene Highness''s


    P.S. This moment I learn that all princes who cannot furnish 12,000 men are to be mediatised for ever;
    then one will also have [text lost] olden[text lost] it, unless it be that it is to [uncertain: nachtsrhalt]
    Vienna, the 12th of October 1814


    most faithful and humble and obedient servant


    v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! After a toilsome journey, upon which I spent
    3 days and 2 nights, I have arrived in Vienna — the most exorbitant dearness I found here to be the
    order of the day; the dear and sometimes very ragged paper, which as is known takes the place of ready
    money, brings the stranger to the verge of ruin, because it does not [uncertain: judge/set right]
    the native and the foreigner alike. But of that a [uncertain: Floro] — the honest man may not live
    without calculation. My text, with which I came hither, was to work and to accomplish. The first thing
    I heard upon my entry into the famous imperial city was the shattering news that the Congress had
    been postponed to the first of November; that the sovereigns would travel to Ofen and [uncertain:
    Post/Pest] for several days, would there hold great [uncertain: monveniren], and would return towards
    the end of this month. Further, that France sets itself very much against our Saxon and Polish acquisition.
    My old patriotic heart could have burst over these novelties. — And I hope that this is merely a façon
    de parler, or rather a feu de paille — Prince Hardenberg, whom I have found in good health and strong,
    stands firm of mind and will let nothing be taken from him of his right — so much, meanwhile, upon
    general matters. Now to the several affairs. The Württemberg affairs go well — the King of W., who
    is at bottom very ill-content here, will yield much; He will himself draft a constitution and submit
    the same to the allied monarchies for examination and confirmation'
- page: 2
  en: 'to lay before them — the whole body of Estates presses in upon the good gentleman, and finds a
    [uncertain: satisfied] hearing — Prince Mett: would be the principal opponent of this regent — but
    the marriage is held for certain, and since the title of Royal Highness is to be conferred, this may
    well bring about a change in the sentiments of Prince M. I have asked the Privy Councillor v. Gärtner
    to dine with me today, when someone else from the Cabinet will also be with me — He appears to be
    a man à la [uncertain: Fandel], though of a more settled sort — the Privy Councillor Goesch is a fine,
    courteous and good-natured man, who, through the Princess — who for the present, together with her
    consort, commends herself most cordially to Your Serene Highness — is more effective than the former
    — Herr v. Gärtner is an author, and there circulate here many writings against Württemberg, Baden
    and Nassau; by the first post I shall transmit several of them. With B. and A. I have spoken very
    fully concerning the Schlaw: affairs, and have taken their counsel before I submitted the matter to
    the Lord State Chancellor Prince Hardenberg — My plan has been very much approved, and its success
    is to be guaranteed. Concerning Koschentin I can as yet bring nothing forward — the funds required
    in the Kurp. matter appeared already a very very great capital — this business therefore comes on
    only when the Curian one has succeeded. In respect of the G[uncertain: K]ülm and Kaehmin as well as
    of the Trąbczyn matter, [uncertain: nothing can sooner be determined] than until Poland''s fate is
    decided — this much, however, I know, that the Moscinska née Prusimska has great friends, and that
    even Count Nesſi has been drawn into their game by Landskog. It is a sad thing that all our couriers
    go to Berlin by way of Prague and Dresden. With the frequent traffic I could have sent Your Serene
    Highness many a thing already — yet I shall neglect nothing — In deepest reverence I remain, until
    death, Your Serene Highness''s N.S. This very moment I learn that all princes who cannot furnish 12000
    men are to be mediatised for ever; in that case one will also not have [uncertain: olden], unless
    it be that it [text lost] Vienna, the 12th of 8br 1814, most faithful and most humble and obedient
    servant v Triebenfeld'

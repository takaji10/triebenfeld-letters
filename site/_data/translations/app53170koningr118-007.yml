- page: 1
  en: 'On behalf of the Illustrious Chełmski, Treasurer of Wschowa, against the Illustrious Prusimski,
    Starost of Niszczewice — a Report


    Let there be seen at this place a Report on behalf of the Illustrious Stanisław Ścibor Chełmski, Treasurer
    of Wschowa, against the Illustrious Magnificent Antoni Prusimski, Starost of Niszczewice — for the
    Ordinary General Sessions of the Crown Tribunal of the Kingdom at Piotrków — as the copy in the submitted
    documents [attests].'

- page: 1
  en: 'Most gracious Prince and Lord, This noon I sent the express courier to the Most gracious Prince
    — now I am dispatching yet another messenger to Lombardini with this letter, and with the request
    that Lombardini should forward it. Plugo Ledeli was here just now — Everything is, if then the one
    under the left little button is not right, in fear and terror — People fear the swiftest arrival of
    the Russians, and are already seeking [uncertain: Inatangialia] with me. How I come by the honour,
    because I not yet. Every since, I [uncertain: brauppe] that with it for you, my princely patron. By
    the judgement of every Pole you will get back the Trąbcziner, Kaemener and Brzyrer estates — upon
    that, good Prince, I stake my life for you. But I have yet another plan — Royal Constantin, him you
    shall for the muskets given me by you, Constantin perhaps has to have the Principality of Łowicz —
    and Talleyrand shall be cherished. Little Dorothea would gladly be free of it; what do you think —
    could her August then not take her after all. Your estates, with which I border, are very considerable,
    and in Poland we sought the chief compensation — the old goat is still whoring in Paris, but she will
    come back — There [uncertain: kiz] much, much, very much be done now. Write to me quickly, noble,
    upright, princely friend, your opinion. But send, for a short time yet, some money so that I can bribe
    and work, for today I am pauvre as a beggar-dog — Richter has just now pawned his watch so that I
    may feed the people. Kontop and Schweineren I have leased out for 14000 Rthl yearly, which. The [uncertain:
    Wäldigewährten] with juridical dues etc. etc. 6000 Rthl — But now the D— carries off everything again
    for old arrears — from Midsummer onward I am once more a well-to-do man — Meanwhile, however, unspeakably
    much more must nevertheless be done for you, my Prince, than for me, and for the defraying of the
    costs do you find counsel, for otherwise, punishment be to God, nothing happens. Had I it so I would
    give it, but my credit is still too much crippled. The deed and money I look for henceforth at every
    moment. — [uncertain: Honvictio] was here upon it, to depart with Stenger. Answer quickly, Most gracious
    Prince, your — do at least have Lombardin give 200 Rthl in coin to my daughters in Breslau. Kontop,
    the 18th of February, in the evening at 11 o''clock. 1810. Truly and faithfully devoted friend and
    humble [servant] v Triebenfeld'

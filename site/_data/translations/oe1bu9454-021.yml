- page: 1
  en: '21


    Most gracious Prince and Lord, today at noon I despatched the express courier to the Genuenſter Fürſt
    — now I am sending yet another messenger to Lombardini with this letter, and with the request that
    Lomb: should forward it.


    Dlugo Lędcki was just here — everything is, if then it is not right beneath the left little button,
    in fear and terror — people dread the swiftest arrival of the Russians, and are already seeking Inatangialia
    from me. How I come by that honour I do not yet. Each since, I brew that along with it for you, my
    princely patron. In the judgment of every Pole you will recover the Trąbczyn, Kamionna and Brzyce
    estates — on that, good Prince, I stake my life for you. But I have yet another plan — Royal Constantin,
    him you shall have for the muskets you gave me; Constantin perhaps has the principality of Lowicz
    — and Talleyrand is to be cultivated. Dorothechen would gladly be rid of it; what do you think — could
    her August not still take her after all? Your estates, with which I border, are very considerable,
    and in Poland we sought the chief compensation — the old goat is still whoring in Paris, but she will
    come back — Much, much, very much must be done now. Write to me quickly, noble upright princely friend,
    with your opinion. But send some money for a short while yet, so that I may bribe and work, for today
    I am poor as a beggar-dog — Richter has just pawned his watch so that I may feed the people. Konotop
    and Świniary I have leased out for 14000 Rthl. a year, the Wäldigewährten with judicial dues etc.
    6000 Rthl. — But now the 7. carries off everything for old arrears — from Midsummer on I shall again
    be a well-to-do man — In the meantime, however, unspeakably much more must nevertheless be done for
    you, my Prince, than for myself, and for the meeting of the costs do you find the means, for otherwise,
    God punish me, nothing will happen. Had I it, I would give it, but my credit is still too much crippled.


    The document and money I look for from now on at every moment. — Honrichs is waiting here upon it
    to depart with Stenger.


    Answer quickly, most gracious Prince, your own.


    Do let Lombardini give at least


    200 Rthl. in coin to my daughters in Wrocław.


    Konotop,


    the 18th of February, in the evening at 11 o''clock.


    1810.


    Truly and faithfully devoted friend


    and humble and obedient servant


    v Triebenfeld'

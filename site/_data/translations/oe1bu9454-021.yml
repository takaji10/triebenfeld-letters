- page: 1
  en: 'Most gracious Prince and Lord, this noon I sent the [uncertain: Estaftitel] to the [uncertain:
    Genuenster] Prince — now I am sending yet another messenger to Lombardini with this letter, and with
    the request that Lomb: should forward it.


    Just now Plugo Ledeli was here — everything is, if then that which is not right beneath the left [uncertain:
    Knopflich], in fear and terror — people dread the swiftest arrival of the Russians, and are already
    seeking [uncertain: Inatangialia] from me. How I come by the honour I still do not [illegible]. Every
    side, I [uncertain: brauppe] that with it for you, my princely patron. By the judgement of every Pole
    you will get back the Trąbczyn, [uncertain: Kaemener] and Brzyrer estates — upon that, good Prince,
    I stake my life for you. But I have yet another plan — the Royal Constantin, him you shall have for
    the muskets given me, the Constantin perhaps has the principality of Lowicz — and Talleyrand is to
    be cherished. Little Dorothea would gladly be free of it; what do you think — could her August then
    not take her after all. Your estates, with which I border, are very considerable, and in Poland we
    sought the chief compensation — the old goat is still whoring in Paris, but she is coming back — There
    is much, much, very much to be done now. Write to me quickly, noble upright princely friend, your
    opinion. But send for a short while yet some money, so that I may bribe and work, for today I am poor
    as a beggar-dog — Just now Richter has pawned his watch so that I may feed the people. Kontop and
    Schweineren I have leased out for 14000 Rthl yearly, which can.


    [uncertain: Wäldigewährten] with judicial dues etc. etc. 6000 Rthl — But now the D[evil] carries off
    everything still for old arrears — from St. John''s Day onward I am again a well-to-do man — Meanwhile,
    however, unspeakably much more must nevertheless be done for you, my Prince, than for me, and for
    the defraying of the costs do you find the means, for otherwise, God punish me, nothing will happen.
    Had I it, I would give it, but my credit is still too much crippled.


    The deed and the money I now await at every moment. — [uncertain: Honvictio] became here thereupon
    one to depart with Stenger.


    Answer quickly, most gracious Prince, your


    Do let Lombardin at least


    give 200 Rthl in coin to my daughters at Breslau.


    Kontop,


    the 18th of February, in the evening at 11 o''clock.


    1810.


    Truly and faithfully devoted friend


    and humble and obedient servant


    v. Triebenfeld</en>, "confidence": "low"'

- page: 7
  en: 'ten Hufen ten Morgen conveyed to the hereditary lessees in all, it is here noted that they have
    received the ten Morgen for their building plots free of charge, and need pay neither purchase money
    nor rent for them.


    §. VII. The hereditary lessees are at liberty to make over these ten Hufen so acquired to others in
    several separate parts, and to agree with these new takers as best they can to their own advantage.


    §. VIII. Their establishments must both the present hereditary lessees and the other future takers,
    for now and for future times,'
- page: 8
  en: 'always effect at their own cost, and they receive for this neither remission of the hereditary
    rent nor any other building assistance; they may, however, use for this the timber standing on the
    Hufen received in hereditary lease, as belonging to them in property, all of it without any exception.


    §. IX. These Hufen taken in hereditary lease shall, as soon as the weather permits, be duly measured
    out to the hereditary lessees and delivered into their possession, and at the same time it shall be
    ascertained how much the area amounts to of the land already now under cultivation, from which'
- page: 9
  en: 'the rent is paid.


    §. X. The hereditary lessees renounce entirely, for themselves and their successors, any building
    timber, firewood, or pasture in the remaining manorial woods and fields, and they may not overstep
    the boundaries of their holding.


    §. XI. The present hereditary lessees, as well as the other future takers, are at liberty to alienate
    their holdings in any manner they please; but at every change of possession, whether by sale or by
    exchange, the tenth Groschen of the purchase money or of the exchange value must be paid down to the
    ground lordship as a transfer fee (Laudemium),'
- page: 10
  en: 'and the same shall in this regard always hold to the new acquirer, whose business it remains not
    to pay out the purchase money to the seller before the transfer fee has been discharged. Upon inheritance,
    or upon cession to children and collateral relatives, no transfer fee is paid, and likewise the first
    takers from the present hereditary lessees are wholly exempt from it.


    §. XII. The hereditary lessees are at liberty to redeem the stipulated hereditary rent by payment
    of the capital sum, that is to say, each of them may pay down to the ground lordship in cash fifty
    Reichsthaler, one hundred Reichsthaler or one hundred and fifty Reichsthaler, which capital'
- page: 11
  en: 'shall then remain the property of the ground lordship, and five per hundred of yearly rent shall
    be written off to them on this account; yet it is expressly laid down that this redeemable amount
    may in no case exceed, per Hufe, the sum of one hundred and fifty Reichsthaler, and that accordingly
    [uncertain: fifteen Reichsthaler] of yearly rent, say Fifteen Reichsthaler per Hufe, shall remain
    standing irredeemable for perpetual time.


    §. XIII. The hereditary lessees and their descendants remain for ever entirely free of all hereditary
    subjection, but are without exception subject to the jurisdiction of the manorial lordship (Dominium).


    §. XIV. Their drink in beer'
- page: 12
  en: 'and brandy the hereditary lessees and their successors in possession must always take from the
    manorial brew-house and distillery or tavern, and pay to the ground lordship, as a penalty, one Reichsthaler
    for every quantity of brandy brought in from outside estates and five Reichsthaler for every barrel
    of beer.


    §. XV. The hereditary lessees hereby expressly renounce, for themselves and their successors, each
    and every remission in cases of misfortune, whether these arise by fire from heaven, by kindling through
    evil persons, by crop failure, hail, flood, cattle plague, war and pestilence, or in whatsoever manner,
    and'
- page: 13
  en: 'no compensation or remission of the hereditary rent shall ever accrue to them on that account.


    §. XVI. The costs of this contract, of its confirmation and engrossment, the hereditary lessees undertake
    to discharge.


    §. XVII. So long as the hereditary lessees and their successors in possession fulfil the obligations
    described above, they shall be protected in their rights by the ground lordship in all things, and
    defended and held harmless against any man''s real claim; but should they remain in arrears with the
    yearly hereditary canon for longer than two years, they shall thereupon forfeit this hereditary lease,
    and the ground lordship shall be entitled to let it out elsewhere, in'
- page: 14
  en: 'which case only their improvements need be made good to the hereditary lessees.


    §. XVIII. For the correct and prompt payment of the fixed hereditary rent the hereditary lessees and
    the future takers, as well as their successors in possession, are liable in perpetuity one for all
    and all for one, thus jointly and severally, in such wise that the ground lordship shall be entitled
    in this regard to hold either to the one or to the other. Both parts promised to keep the foregoing
    hereditary-lease contract firmly and inviolably, and renounce all legal evasions that might be raised
    against it, in particular the objection of an injury suffered above or below the half, of'
- page: 15
  en: 'cunning persuasion, of over-hastiness, of the impossibility of raising the rent out of the property,
    of matters otherwise agreed than written down or not rightly understood; and it is expressly consented
    by His Most Serene Highness that the hereditary lessees may, on the ground of this contract, have
    the title of possession of their holdings entered in their own names.


    Further, on the part of His Most Serene Highness, liberty is granted to the hereditary lessees to
    fetch free of charge the clay for their first establishments generally from the Trąbczyn territory;
    yet this liberty ceases entirely as soon as they shall have built their buildings. Also'
  names:
  - de: Trąbczyner
    en: Trąbczyn
    kind: place
- page: 16
  en: 'they shall be furnished with a further two thousand [illegible] bricks from the Trąbczyn brickworks,
    for which they must pay the cost at three Reichsthaler per thousand. For the rest it is noted that
    with the said hereditary lessees a contract over these ten Hufen was already drawn up on the 26th
    of May of the current year by a certain Kunkel, which contract has now been given back by the hereditary
    lessees and is hereby, by their striking it through, entirely annulled and cancelled, in such wise
    that it is to be regarded as not concluded, and that neither the one nor the other part shall form
    or assert any rights or claims out of it.


    The contracting parties had nothing further to bring forward; they asked for'
  names:
  - de: Trąbczyner
    en: Trąbczyn
    kind: place
  - de: Kunkel
    en: Kunkel

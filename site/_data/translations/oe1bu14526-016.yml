    own hands - this I attest, Heinrichs, Royal Chamber Commission Councillor and Commissary of Economy


    a. u. s. Schenck


    Brauer. This contract is now hereby made out under the impression of the court seal and the customary
    signature. Marianton, the 13th of May 1806. Princely Hohenlohe Patrimonial Court. Schenck


    Official copy of the hereditary-lease contract between His Serene Highness the reigning Prince of

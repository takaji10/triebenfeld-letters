- page: 1
  en: 'The principal exemplar has been made out at 10 rtl 6 g. The Princely Hohenlohe Patrimonial Court
    at Trąbczyn hereby attests that between His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen,
    hereditary lord of the Zagorowo and Trąbczyn estates, of the one part, and the residents Martin Giering,
    Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Damt and Christoph Schoenfisch,
    of the other part, concerning the demesne farm called Althütte, consisting of 10 Hufen 10 Morgen Magdeburg
    measure, the following hereditary-lease contract has been concluded and declared to the court protocol:


    Actum Trąbczyn, the twentieth of December One Thousand Eight Hundred and Four. Before the undersigned


    Patrimonial Court


    there appeared in person,


    1., the Councillor of War and Forests von Triebenfeld as general attorney of His Serene Highness the
    reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court of the estates here,
    of the one part


    and


    2., The residents'

status: draft
segments:
- page: 1
  en: 'The principal exemplar has been expedited at 10 rtl 6 g. The Princely Hohenlohe Patrimonial Court
    at Trąbczyn hereby attests that between His Serene Highness the reigning Prince of Hohenlohe Ingelfingen,
    hereditary lord of the Zagorower and Trąbczyner estates, on the one part, and the resident tenants
    Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Damt and Christoph
    Schoenfisch, on the other part, concerning the demesne farm called Althütte, consisting of 10 Hufen
    10 Morgen Magdeburg measure, the following hereditary-lease contract has been concluded and declared
    to the court protocol:


    Actum Trąbczyn, the twentieth of December One Thousand Eight Hundred and Four. Before the undersigned


    Patrimonial Court


    there appeared in person,


    1st, the Councillor of War and Forests v. Triebenfeld, as general plenipotentiary of His Serene Highness
    the reigning Prince of Hohenlohe Ingelfingen, hereditary and judicial lord of the estates here, on
    the one part


    and


    2nd, the resident tenants'
- page: 2
  en: '1st, Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Dams, and
    Christoph Schoenfisch from the estates here, on the other part.


    The comparents are personally known to the undersigned, and there exists no doubt as to their capacity
    validly to execute judicial acts.


    The same declare, freely and after due deliberation, the following hereditary-lease contract to the
    protocol.


    § I. Namely, His Serene Highness the Prince of Hohenlohe Ingelfingen, through his general plenipotentiary
    the Councillor of War and Forests v. Triebenfeld, does cede the demesne farm belonging to Trąbczyn
    called die Alte Hütte, consisting of 10 Hufen 10 Morgen, say'
- page: 3
  en: 'Ten Hufen ten Morgen Magdeburg measure, in arable, meadows, gardens, and overgrown marsh and [uncertain:
    Götzstellen], together with all the farm buildings found on this demesne farm, excepting the new cowshed,
    which remains to the ground lordship, to the aforesaid resident tenants Martin Giering, Wilhelm Daniel
    Schulz, Gottfried Dümmel, Michel Dämmel, Gottfried Damt and Christoph Schönfisch, in hereditary lease
    for perpetual and everlasting time.


    Each Hufe contains thirty Morgen and each Morgen one hundred and eighty square rods Magdeburg measure.


    § II. As purchase-money the hereditary lessees pay'
- page: 4
  en: '6. hereditary lessees, one hundred and fifty Reichsthaler per Hufe, making for 10 Hufen 1500 rt,
    say One Thousand [and] Five Hundred Reichsthaler. Of this they have already paid down 450 rtl, say
    four hundred and fifty Reichsthaler, and the remaining 1050 rt, say One Thousand and Fifty Reichsthaler,
    they bind themselves to pay off to His Princely Serene Highness in the term of St. George 1805 in
    cash and in Courant of the standard of the treasury.


    As annual hereditary canon the hereditary lessees pay, and that from Martinmas of this year onward,
    per Hufe 22 rthl 12 gg., say twenty-two Reichsthaler twelve good Groschen, making for 10 Hufen 225
    rttl, say two hundred and twenty-five Reichsthaler, in two instalments, namely the half with 112 rt.'
- page: 5
  en: '12 gg., say One Hundred and Twelve Reichsthaler 12 gg., at St. John''s, and the second half likewise
    with 112 rt. 12 gg., say One Hundred and Twelve Reichsthaler 12 gg., at Christmas, each time postnumerando,
    in cash and in Courant, into the lordship''s treasury; but they are wholly exempted for perpetual
    time from all and every manorial service and delivery in kind to the ground lordship.


    § IV. This stipulated hereditary rent is to be rendered from Martinmas of this year onward, yet only
    from such land and meadow as is in fact already brought under cultivation; from those parcels, on
    the other hand, which must first be made arable by grubbing out, they receive [uncertain: four] free
    years, which — since they have already had the cutting this year —'
- page: 6
  en: 'begin with the past St. John''s of this year and end with St. John''s One Thousand Eight Hundred
    and Eight, so that from this uncultivated land they shall render the first rent at Christmas One Thousand
    Eight Hundred and Eight; and there shall then be no place for the objection that one or another of
    them had brought his land under cultivation only later.


    § V. Besides the annually stipulated hereditary rent, the hereditary lessees are further [uncertain:
    bound], for themselves and their descendants, to bear in perpetuity all and every royal and other
    public tax and impost falling upon these ten Hufen, by whatever name they may be called.


    § VI. Since in the first § the'
- page: 7
  en: 'hereditary lessees have in all been granted ten Hufen ten Morgen, it is here noted that they have
    received the ten Morgen for their building-sites free of charge, and need pay neither purchase-money
    nor rent for them.


    § VII. The hereditary lessees are at liberty to cede these ten Hufen thus acquired to others in several
    separate parcels, and to agree with these new takers as best they can to their own advantage.


    § VIII. Their establishments must both the present hereditary lessees and the remaining future takers,
    for now and for future times,'
- page: 8
  en: 'always effect at their own cost, and they receive for this no remission of the hereditary rent
    nor any building assistance; however, they may employ for this purpose the timber standing on the
    Hufen received in hereditary lease, as which belongs to them in its entirety and without any exception
    as their own property.


    § IX. These Hufen taken in hereditary lease shall, as soon as the weather permits, be duly measured
    out to the hereditary lessees and delivered into possession, and at the same time it shall be ascertained
    how great the surface content of the land already now under cultivation is, from which'
- page: 9
  en: 'the rent is paid.


    § X. The hereditary lessees, for themselves and their successors, wholly renounce any claim to building
    timber, firewood, or pasture in the remaining lordly woods and fields, and they may not overstep the
    boundaries of their holding.


    § XI. The present hereditary lessees, as also the remaining future takers, are at liberty to alienate
    their holdings in any manner they please; but upon every change of possession, whether by sale or
    by exchange, the tenth Groschen of the purchase-money or of the exchange-value must be paid to the
    ground lordship as a laudemium,'
- page: 10
  en: 'and the same shall in this respect always hold to the new acquirer, whose business it remains not
    to pay out the purchase-money to the seller before the laudemium has been settled. Upon inheritances
    or cessions to children and collateral relatives no laudemium is paid, and likewise the first takers
    from the present hereditary lessees are wholly exempt therefrom.


    § XII. The hereditary lessees are at liberty to redeem the stipulated hereditary rent by payment of
    the capital sum, that is to say, each of them may pay to the ground lordship in cash fifty Reichsthaler,
    one hundred Reichsthaler, or one hundred and fifty Reichsthaler, which capital'
- page: 11
  en: 'shall then remain the property of the ground lordship, and five per hundred shall be written off
    from their annual rent on that account; yet it is expressly laid down that this quantum to be paid
    off may in no case exceed the sum of one hundred and fifty Reichsthaler per Hufe, and that accordingly
    [uncertain: fifteen] Reichsthaler, say Fifteen Reichsthaler, per Hufe shall remain standing as annual
    rent, irredeemable for perpetual time.


    § XIII. The hereditary lessees and their descendants remain forever free of all hereditary subjection
    [uncertain: willingly], yet are without exception subject to the jurisdiction of the Dominium.


    § XIV. Their drink, in beer'
- page: 12
  en: 'and brandy, the hereditary lessees and their successors in possession must always take from the
    lordly brew- and distilling-house or tavern, and for every quantum of brandy brought in from foreign
    estates they must pay one Reichsthaler, and for every barrel of beer five Reichsthaler, as a penalty
    to the ground lordship.


    § XV. The hereditary lessees, for themselves and their successors, hereby expressly renounce all and
    every remission in cases of misfortune, whether these arise from fire from heaven, arson by evil persons,
    crop failure, hailstorm, flood, cattle plague, war, or pestilence, and in whatever manner they may
    arise, and'
- page: 13
  en: 'no compensation or remission of the hereditary rent shall ever accrue to them on that account.


    § XVI. The costs of this contract, of its confirmation and engrossment, the hereditary lessees undertake
    to settle.


    § XVII. So long as the hereditary lessees and their successors in possession shall fulfil the above-described
    obligations, they shall be protected everywhere by the ground lordship in their rights and shall be
    defended and held harmless against every man''s real claim; but should they remain in arrears with
    the annual hereditary canon for longer than two years, they shall thereupon forfeit this hereditary
    lease, and the ground lordship shall be entitled to let the same out elsewhere, in'
- page: 14
  en: 'which case the hereditary lessees may be compensated only for their ameliorations.


    § XVIII. For the correct and prompt payment of the fixed hereditary rent the hereditary lessees and
    the future takers, as well as their successors in possession, are perpetually liable one for all and
    all for one, and thus jointly and severally, in such wise that the ground lordship shall be entitled
    in this respect to hold either to the one or to the other. Both parties promised to keep the foregoing
    hereditary-lease contract firmly and inviolably, and renounce all legal exceptions available against
    it, in particular the objection of an injury suffered above or below the half, of'
- page: 15
  en: 'cunning persuasion, of over-haste, of the impossibility of raising the rent out of the thing itself,
    of matters otherwise agreed than written down or not rightly understood; and it is expressly consented
    by His Most Serene Princely Highness that the hereditary lessees may, on the ground of this contract,
    have the Titulum Possessionis of their holdings entered in their own names.


    Further, on the part of His Most Serene Princely Highness the liberty is granted to the hereditary
    lessees to fetch the clay for their first establishments in their entirety from the Trąbczyner territory
    free of charge; yet this liberty ceases entirely as soon as they shall have completed their buildings.
    Also'
- page: 16
  en: 'there shall be delivered to them from the Trąbczyner brickworks, in place of a bricklayer, two
    thousand [illegible] , for which they must pay the cost at three Reichsthaler per thousand. For the
    rest it is noted that with the aforementioned hereditary lessees a contract was already drawn up on
    the 26th of May of the current year, through a certain Kunkel, concerning these ten Hufen, which contract
    has now been returned by the hereditary lessees and is hereby wholly annulled and cancelled by them
    by means of striking through, in such wise that the same shall be regarded as not concluded, and that
    neither the one nor the other party shall form or assert any rights or claims out of it.


    The contracting parties had nothing further to state; they asked for'
- page: 17
  en: 'the confirmation and engrossment of this contract; and after this protocol had been read out to
    them word for word, and they had also been instructed that the renunciation of the legal exceptions
    and objections entails the entire loss of the same, they once more renounced them after due deliberation,
    and have subscribed and signed below in token of their approval.


    Read by myself and approved.


    Friedrich Ludwig Fürst zu Hohenlohe


    v. Triebenfeld

    Martin Giering xxx

    Wilhelm Daniel Schulz xxx (signifies)

    Gottfried Dümel xxx

    Michel Dämmel xxx

    Gottfried Dams xxx

    Christoph Schoenfisch

    In my presence'
- page: 18
  en: 'read out loud and clearly, approved throughout by the interested parties and signed in their own
    hands — this I attest.


    Heinrichs, Royal Chamber Commission Councillor and Commissioner of Economy


    a. u. s. Schenck


    Brauer


    This contract is now hereby engrossed under the impression of the court seal and the customary signature.
    Marianton, the 13th of May 1806. Princely Hohenlohe Patrimonial Court. Schenck


    Engrossment of the hereditary-lease contract between His Serene Highness the reigning Prince of Hohenlohe
    Ingelfingen and the resident tenant Martin Giering et Consorten. No 1308


    Taxe br: 8


    Stamp: 6


    Mund: 12'

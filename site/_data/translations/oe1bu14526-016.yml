- page: 2
  en: '1. Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Dams, and
    Christoph Schoenfisch from the estates here, of the other part.


    The appearers are personally known to the undersigned, and there is no doubt as to their capacity
    validly to perform judicial acts.


    The same declare, freely and after due deliberation, the following hereditary-lease contract to the
    protocol.


    §. I. Namely, His Serene Highness the Prince of Hohenlohe-Ingelfingen, through his general attorney
    the Councillor of War and Forests von Triebenfeld, makes over the demesne farm belonging to Trąbczyn,
    called the Alte Hütte, consisting of 10 Hufen 10 Morgen, say'

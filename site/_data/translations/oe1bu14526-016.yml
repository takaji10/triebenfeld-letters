- page: 5
  en: '12 gg., say One Hundred and Twelve Reichsthaler 12 gg., at Midsummer, and the second half likewise
    with 112 rt. 12 gg., say One Hundred and Twelve Reichsthaler 12 gg., at Christmas, each time in arrears,
    in cash and in Courant into the manorial treasury; but they are wholly freed for perpetual time from
    each and every manorial labour service and delivery in kind to the ground lordship.


    §. IV. This stipulated hereditary rent is to be paid from Martinmas of this year onward, yet only
    for such land and meadow as is already in fact brought under cultivation; for those parts, on the
    other hand, which must first be made arable by grubbing out, they receive [uncertain: four] free years,
    which, since they have already had the harvest cut this year,'

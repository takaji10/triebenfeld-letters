  - '3'
  - '10'
- page: 17
  en: 'the confirmation and official copy of this contract; and after this protocol had been read to them
    word for word, and they had also been instructed that the renunciation of the legal evasions and objections
    entails the entire loss of them, they once more, after due deliberation, renounced the same, and in
    token of approval have subscribed and signed below.


    Read by myself and approved.


    Friedrich Ludwig, Prince of Hohenlohe


    von Triebenfeld; Martin Giering xxx; Wilhelm Daniel Schulz xxx (the marks signify); Gottfried Dümel
    xxx; Michel Dämmel xxx; Gottfried Dams xxx; Christoph Schoenfisch. In my presence'

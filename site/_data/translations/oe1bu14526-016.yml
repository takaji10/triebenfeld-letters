status: draft
segments:
- page: 1
  en: 'The principal exemplar was issued on 10 rtl 6 g. The Princely Hohenlohe Patrimonial Court at Trąbczyn
    hereby attests that between His Serene Highness the reigning Prince zu Hohenlohe Ingelfingen, hereditary
    lord of the Zagorowo and Trąbczyn estates, of the one part, and the resident holders Martin Giering,
    Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Damt and Christoph Schoenfisch,
    of the other part, concerning the demesne farm called Althütte, consisting of 10 Hufen 10 Morgen Magdeburg
    measure, the following hereditary-lease contract has been concluded and declared to the court protocol:


    Actum Trąbczyn, the twentieth of December One Thousand Eight Hundred and Four. Before the undersigned


    Patrimonial Court


    there appeared in person,


    1., the Councillor of War and Forests v. Triebenfeld as general plenipotentiary of His Serene Highness
    the reigning Prince zu Hohenlohe Ingelfingen, hereditary and judicial lord of the estates here, of
    the one part


    and


    2., the resident holders'
- page: 2
  en: '1. Martin Giering, Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dümmel, Gottfried Dams, and
    Christoph Schoenfisch from the estates here, of the other part.


    The comparents are personally known to the undersigned, and no doubt whatever obtains as to their
    capacity validly to perform judicial acts.


    The same declare, freely and after due deliberation, the following hereditary-lease contract to the
    protocol.


    §. I. His Serene Highness the Prince zu Hohenlohe Ingelfingen, through his general plenipotentiary
    the Councillor of War and Forests v. Triebenfeld, namely cedes the demesne farm belonging to Trąbczyn
    called die Alte Hütte, consisting of 10 Hufen 10 Morgen, say'
- page: 3
  en: 'Ten Hufen ten Morgen Magdeburg measure, in arable, meadows, gardens and overgrown marshes and [uncertain:
    Götzstellen], together with all the farm buildings found on this demesne farm, excepting the new cow-byre,
    which remains to the ground lordship, to the aforesaid resident holders Martin Giering, Wilhelm Daniel
    Schulz, Gottfried Dümmel, Michel Dämmel, Gottfried Damt and Christoph Schönfisch, in hereditary lease
    for perpetual and everlasting time.


    Each Hufe contains thirty Morgen and each Morgen one hundred and eighty square rods Magdeburg measure.


    §. II. By way of entry-money the hereditary lessees pay'
- page: 4
  en: '6. the hereditary lessees one hundred and fifty Reichsthaler p. holding, making for 10 Hufen 1500
    rt, say One Thousand and thereupon Hundred Reichsthaler. Of this they have already [uncertain: paid
    down] 450 rtl., say four hundred and fifty Reichsthaler, and the remaining 1050 rt, say One Thousand
    and Fifty Reichsthaler, they bind themselves to pay off to His Princely Serene Highness in the term
    of St. George 1805 in cash and in cash-office Courant.


    As annual hereditary canon the hereditary lessees pay, and that from Martinmas of this year, per Hufe
    22 rthl 12 gg., say twenty-two Reichsthaler twelve good Groschen, making for 10 Hufen 225 rttl, say
    two hundred and twenty-five Reichsthaler, in two instalments, namely the half with 112 rt.'
- page: 5
  en: '12 gg., say One Hundred and Twelve Reichsthaler 12 gg., at St. John''s, and the second half likewise
    with 112 rt. 12 gg., say One Hundred and Twelve Reichsthaler 12 gg., at Christmas, each time postnumerando
    in cash and in Courant into the manorial cash-office; but they are wholly and for perpetual time exempt
    from all and any manorial services and deliveries in kind to the ground lordship.


    §. IV. This stipulated hereditary rent is rendered from Martinmas of this year, yet only from such
    land and meadow as is in fact already brought under cultivation; from those parts, on the other hand,
    which must first be made arable by grubbing, they receive [uncertain: four] free years, which, since
    they have already had the [uncertain: first cutting] this year,'
- page: 6
  en: 'begin with the past St. John''s of this year and end at St. John''s One Thousand Eight Hundred
    and Eight, so that from this uncultivated land they render the first rent at Christmas One Thousand
    Eight Hundred and Eight; and the objection that this or that one of them had not yet brought his land
    under cultivation shall then not be admitted.


    §. V. Besides the annually stipulated hereditary rent, however, the hereditary lessees for themselves
    and their descendants [must] also bear in perpetuity all and any royal and other public taxes and
    dues falling upon these ten Hufen, by whatever name they may be called.


    §. VI. Since in the first §. to the'
- page: 7
  en: 'hereditary lessees ten Hufen ten Morgen in all are granted, it is here noted that they have received
    the ten Morgen for their building-plots free of charge, and need pay neither entry-money nor rent
    for them.


    §. VII. The hereditary lessees are at liberty to cede these ten Hufen so acquired to others in several
    separate parts, and to agree with these new takers to their own advantage as best they can.


    §. VIII. Their establishments must be effected, both by the present hereditary lessees and by the
    other future takers, for now and for times to come'
- page: 8
  en: 'always at their own cost, and they receive for this neither remission of the hereditary rent nor
    [uncertain: any further] building assistance; they may however use for this the timber standing upon
    the Hufen received in hereditary lease, as being wholly and without any exception their own property.


    §. IX. These Hufen taken in hereditary lease shall, as soon as the weather permits, be duly measured
    out to the hereditary lessees and delivered into possession, and at the same time it shall be ascertained
    how much the surface content of the land already now under cultivation, from which'
- page: 9
  en: 'the rent is paid, amounts to.


    §. X. The hereditary lessees, for themselves and their successors, wholly renounce any building or
    fire timber, or pasture, in the remaining manorial woods and fields, and they may not overstep the
    bounds of their holding.


    §. XI. The present hereditary lessees, as also the other future takers, are at liberty to alienate
    their holdings in any manner they please; but upon every change of possession, whether by sale or
    by exchange, the tenth Groschen of the purchase-money or of the exchange amount must be paid to the
    ground lordship as a laudemium,'
- page: 10
  en: 'and the same shall in this regard always hold to the new acquirer, whose business it remains not
    to pay out the purchase-money to the seller before the laudemium has been discharged. Upon inheritance,
    or cession to children and collateral relatives, no laudemium is paid, and likewise the first takers
    from the present hereditary lessees are wholly exempt therefrom.


    §. XII. The hereditary lessees are at liberty to redeem the stipulated hereditary rent by payment
    of the capital sum; that is, each of them may pay the ground lordship in cash fifty Reichsthaler,
    one hundred Reichsthaler or one hundred and fifty Reichsthaler, which capital'
- page: 11
  en: 'shall thereupon remain the property of the ground lordship, and five per hundred shall be written
    off from their annual [uncertain: rent] on account thereof; yet it is expressly laid down that this
    sum to be paid off may in no case exceed, per Hufe, the sum of one hundred and fifty Reichsthaler,
    and that consequently in annual rent [uncertain: fifteen] say Fifteen Reichsthaler per Hufe shall
    remain standing irredeemable for perpetual time.


    §. XIII. The hereditary lessees and their descendants remain free for ever from all hereditary subjection,
    but are without exception subject to the jurisdiction of the Dominium.


    §. XIV. Their drink in beer'
- page: 12
  en: 'and brandy the hereditary lessees and their successors in possession must always take from the
    manorial brew- and distilling-house or the tavern, and for every quantity of brandy brought in from
    outside estates they shall pay One Reichsthaler, and for every barrel of beer Five Reichsthaler, as
    a penalty to the ground lordship.


    §. XV. The hereditary lessees, for themselves and their successors, hereby expressly renounce all
    and any remission in case of misfortune, whether it arise by fire from heaven, kindling by evil persons,
    crop failure, hailstorm, flood, cattle plague, war and pestilence, or in whatever manner it may, and'
- page: 13
  en: 'on that account no compensation or remission of the hereditary rent shall ever accrue to them.


    §. XVI. The costs of this contract, of its confirmation and engrossment, the hereditary lessees undertake
    to discharge.


    §. XVII. So long as the hereditary lessees and their successors in possession fulfil the obligations
    described above, they shall be protected everywhere by the ground lordship in their judicial [uncertain:
    assemblies], and be represented and held harmless against every man''s real claims; but should they
    remain in arrears with the annual hereditary canon for longer than two years, they shall thereupon
    forfeit this hereditary lease, and the ground lordship is entitled to let the same out otherwise,
    in'
- page: 14
  en: 'which case only their meliorations may be made good to the hereditary lessees.


    §. XVIII. For the correct and prompt payment of the fixed hereditary rent the hereditary lessees and
    the future takers, as well as their successors in possession, are liable in perpetuity one for all
    and all for one, hence jointly and severally, in such wise that the ground lordship shall in this
    regard be entitled to hold to the one or to the other. Both parties promised to keep the foregoing
    hereditary-lease contract firmly and inviolably, and renounce all legal evasions available against
    it, in particular the objection of an injury suffered above or below the half, of'
- page: 15
  en: 'cunning persuasion, of over-haste, of the impossibility of raising the rent out of the property,
    of matters otherwise agreed than written down or not rightly understood; and it is expressly consented
    by His Most Serene Highness that the hereditary lessees may, on the ground of this contract, have
    the Titulum Possessionis of their holdings entered in their own names.


    Further, on the part of His Most Serene Highness the liberty is granted to the hereditary lessees
    to fetch the [uncertain: clay] from the Trąbczyn territory free of charge for their first complete
    establishments; but this liberty ceases entirely as soon as they shall have erected their buildings.
    Also'
- page: 16
  en: 'there shall be delivered to them from the Trąbczyn brickworks up to two thousand [uncertain: bricks]
    instead of mason''s [illegible], for which they must pay the cost at three Reichsthaler per thousand.
    For the rest it is noted that with the aforesaid hereditary lessees a contract concerning these ten
    Hufen was already drawn up on the 26th of May of the current year by a certain Kunkel, which contract
    is now returned by the hereditary lessees and is hereby, by means of striking through, wholly annulled
    and cancelled by them, in such wise that the same shall be regarded as not concluded, and that neither
    the one party nor the other shall frame or assert any rights or claims out of it.


    The contracting parties had nothing further to adduce; they asked for'
- page: 17
  en: 'the confirmation and engrossment of this contract, and after this protocol had been read out to
    them word for word, and they had also been instructed that the renunciation of the legal evasions
    and objections entails their complete loss, they once more renounced the same after due deliberation,
    and in token of approval have subscribed and signed below.


    Read by myself and approved.


    Friedrich Ludwig Fürst zu Hohenlohe


    v. Triebenfeld  Martin Giering xxx  Wilhelm Daniel Schulz  xxx signifies  Gottfried Dümel xxx  Michel
    Dämmel xxx  Gottfried Dams xxx  Christoph Schoenfisch  In my presence'
- page: 18
  en: 'read out loudly and distinctly, approved throughout by the interested parties and signed in their
    own hands, which is attested by Heinrichs, Royal Chamber Commission Councillor and Economy Commissary


    a. u. s. Schenck


    Brauer. This contract is now hereby engrossed under the impression of the court seal and the customary
    signature. Marianton, the 13th of May 1806. Princely Hohenlohe Patrimonial Court. Schenck


    Engrossment of the hereditary-lease contract between His Serene Highness the reigning Prince zu Hohenlohe
    Ingelfingen and the resident holder Martin Giering et Consorten. No 1308


    Fee br: 8


    Stamp: 6


    Engrossing fee: 12'

- page: 6
  en: 'begin with the past Midsummer of this year and end at Midsummer One Thousand Eight Hundred and
    Eight, so that for this uncultivated land they shall render the first rent at Christmas One Thousand
    Eight Hundred and Eight; and the objection that this or that one of them had not yet brought his land
    under cultivation shall then not be admitted.


    §. V. Besides the yearly stipulated hereditary rent, however, the hereditary lessees shall further,
    for themselves and their descendants, bear in perpetuity each and every royal and other public tax
    and impost falling upon these ten Hufen, by whatever name they may be [uncertain: called].


    §. VI. Since in the first § there are'
  names:

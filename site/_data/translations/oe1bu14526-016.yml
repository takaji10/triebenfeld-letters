- page: 3
  en: 'Ten Hufen ten Morgen Magdeburg measure, in arable, meadows, gardens and overgrown marshland and
    [uncertain: Götzstellen], together with all the farm buildings found on this demesne farm, excepting
    the new cow byre, which remains to the ground lordship, to the aforementioned residents Martin Giering,
    Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dämmel, Gottfried Damt and Christoph Schönfisch, in
    hereditary lease for perpetual and everlasting time.


    Each Hufe contains thirty Morgen and each Morgen one hundred and eighty square rods Magdeburg measure.


    §. II. As purchase money the hereditary lessees pay'

- page: 4
  en: '6. hereditary lessees, one hundred and fifty Reichsthaler per Hufe, making for 10 Hufen 1500 rt,
    say One Thousand and thereupon Hundred Reichsthaler. Of this they have already paid down 450 rtl.,
    say four hundred and fifty Reichsthaler, and the remaining 1050 rt, say One Thousand and Fifty Reichsthaler,
    they bind themselves to pay to His Princely Serene Highness at the term of St. George''s day 1805,
    in cash and in Courant of the standard of the treasury.


    As yearly hereditary canon the hereditary lessees pay, and that from Martinmas of this year onward,
    per Hufe 22 rthl 12 gg., say twenty-two Reichsthaler twelve good Groschen, making for 10 Hufen 225
    rttl, say two hundred and twenty-five Reichsthaler, in two instalments, namely the half with 112 rt.'

- page: 17
  en: 'the confirmation and engrossment of this contract; and after this protocol had been read out to
    them word for word, and they had also been instructed that the renunciation of the legal evasions
    and objections draws after it their complete loss, they once again renounced the same after due deliberation,
    and have in token of their approval subscribed and signed below.


    Read by myself and approved.


    Friedrich Ludwig, Prince of Hohenlohe


    von Triebenfeld. Martin Giering xxx. Wilhelm Daniel Schulz xxx (meaning as above). Gottfried Dümel
    xxx. Michel Dämmel xxx. Gottfried Dams xxx. Christoph Schoenfisch. In my presence'

- page: 5
  en: '12 gg., say One Hundred and Twelve Reichsthaler 12 gg., at Midsummer, and the second half likewise
    with 112 rt. 12 gg., say One Hundred and Twelve Reichsthaler 12 gg., at Christmas, each time postnumerando,
    in cash and in Courant, into the manorial treasury; but they are wholly freed for perpetual times
    from all and every manorial labour service and delivery in kind to the ground lordship.


    §. IV. This stipulated hereditary rent is to be paid from Martinmas of this year onward, yet only
    from such land and meadow as is already actually brought under cultivation; from those parts, on the
    other hand, which must first be made arable by grubbing, they receive [uncertain: four] free years,
    which, since they have already had the first cut this year,'
  numbers:
  - '12'
  - '112'
  - '12'
  - '112'
  - '12'
  - '12'
- page: 6
  en: 'begin with the past Midsummer of this year and end at Midsummer One Thousand Eight Hundred and
    Eight, so that from this uncultivated land they shall render the first rent at Christmas One Thousand
    Eight Hundred and Eight; and the objection that one or another of them had not yet brought his land
    under cultivation shall then not be admitted.


    §. V. Besides the annually stipulated hereditary rent, however, the hereditary lessees shall further,
    for themselves and their descendants, bear in perpetuity all and every royal and other public tax
    and due falling upon these ten Hufen, by whatever name they may be called.


    §. VI. Since in the first § there are'
  numbers:
  - '1808'
  - '1808'
- page: 7
  en: 'granted to the hereditary lessees in all ten Hufen ten Morgen, it is here noted that they have
    received the ten Morgen for their building plots free of charge, and need pay neither purchase money
    nor rent for them.


    §. VII. The hereditary lessees are at liberty to make over these ten Hufen so acquired in several
    separate parts to others, and to come to terms with these new takers to their own advantage as best
    they can.


    §. VIII. Their establishments must the present hereditary lessees, as well as the remaining future
    takers, for the present and for times to come'
  numbers:
  - '10'
  - '10'
  - '10'
  - '10'
- page: 8
  en: 'always carry out at their own cost, and they shall receive for this neither remission of the hereditary
    rent nor any other building assistance; they may, however, employ for this the timber standing on
    the Hufen received in hereditary lease, as being theirs in property, all of it and without any exception.


    §. IX. These Hufen taken in hereditary lease shall, as soon as the weather permits, be duly measured
    out to the hereditary lessees and delivered into their possession, and at the same time it shall be
    ascertained how much the surface content amounts to of the land already now under cultivation, from
    which'
- page: 9
  en: 'the rent is paid.


    §. X. The hereditary lessees renounce entirely, for themselves and their successors, any building
    timber, firewood or pasture in the remaining manorial woods and fields, and they may not overstep
    the boundaries of their holding.


    §. XI. The present hereditary lessees, as well as the remaining future takers, are at liberty to alienate
    their holdings in any manner they please; but upon every change of possession, whether by sale or
    by exchange, the tenth Groschen of the purchase money or of the exchange sum must be paid to the ground
    lordship as a transfer fee (Laudemium),'
- page: 10
  en: 'and in this regard the same shall always hold to the new acquirer, whose business it remains not
    to pay out the purchase money to the seller before the transfer fee has been settled. On inheritances
    or cessions to children and collateral relatives no transfer fee is paid, and likewise the first takers
    from the present hereditary lessees are wholly exempt from it.


    §. XII. The hereditary lessees are at liberty to redeem the stipulated hereditary rent by payment
    of the capital sum; that is to say, each of them may pay down to the ground lordship fifty Reichsthaler,
    one hundred Reichsthaler or one hundred and fifty Reichsthaler, which capital'
- page: 11
  en: 'shall then remain the property of the ground lordship, and five per hundred of it shall be written
    off from their annual rent; yet it is expressly laid down that this redeemable sum may in no case
    exceed, per Hufe, the sum of one hundred and fifty Reichsthaler, and that accordingly [uncertain:
    fifteen Reichsthaler] of annual rent per Hufe shall remain standing irredeemable for perpetual times.


    §. XIII. The hereditary lessees and their descendants remain forever wholly free of all hereditary
    subjection, but are without exception subject to the jurisdiction of the manorial lordship (Dominium).


    §. XIV. Their drink in beer'
  numbers:
  - '5'
- page: 12
  en: 'and brandy the hereditary lessees and their successors in possession must always take from the
    manorial brewhouse and distillery or from the tavern, and for every quantity of brandy brought in
    from other estates they shall pay one Reichsthaler, and for every barrel of beer five Reichsthaler,
    as a penalty to the ground lordship.


    §. XV. The hereditary lessees hereby expressly renounce, for themselves and their successors, all
    and every remission in cases of misfortune, whether these arise from fire from heaven, arson by evil
    people, crop failure, hailstorm, flood, cattle plague, war, or pestilence, and in whatever manner
    they may arise; and'
- page: 13
  en: 'on that account no compensation or remission of the hereditary rent shall ever accrue to them.


    §. XVI. The costs of this contract, of its confirmation and of the official copy, the hereditary lessees
    undertake to settle.


    §. XVII. So long as the hereditary lessees and their successors in possession fulfil the obligations
    described above, they shall be protected in their rights by the ground lordship in every respect,
    and be defended and held harmless against any man''s real claim. Should they, however, remain in arrears
    with the annual hereditary canon for longer than two years, they shall thereupon forfeit this hereditary
    lease, and the ground lordship shall be entitled to let the same out elsewhere, in'
- page: 14
  en: 'which case only their improvements need be made good to the hereditary lessees.


    §. XVIII. For the correct and prompt payment of the fixed hereditary rent the hereditary lessees and
    the future takers, as well as their successors in possession, are liable in perpetuity, one for all
    and all for one, hence jointly and severally, in such wise that the ground lordship shall be entitled
    in this regard to hold to the one or to the other. Both parties promised to keep the foregoing hereditary-lease
    contract firmly and inviolably, and renounce all legal evasions available against it, in particular
    the objection of an injury sustained above or below the half, of'
- page: 15
  en: 'cunning persuasion, of undue haste, of the impossibility of raising the rent out of the property,
    of matters otherwise agreed than written down or not rightly understood; and it is expressly consented
    by His Most Serene Highness that the hereditary lessees may, on the ground of this contract, have
    the title of possession to their holdings entered in their own names.


    Further, on the part of His Most Serene Highness the hereditary lessees are granted the liberty of
    fetching, free of charge, the clay for their whole first establishments from the Trąbczyn territory;
    yet this liberty ceases entirely as soon as they shall have built their buildings. Also'
  names:
  - de: Trąbczyner Teritorio
    en: Trąbczyn territory
    kind: place
- page: 16
  en: 'there shall further be delivered to them two thousand [illegible] instead of bricklayer''s [uncertain:
    stones] from the Trąbczyn brickworks, for which they must pay the costs at three Reichsthaler per
    thousand. For the rest it is noted that with the said hereditary lessees a contract concerning these
    ten Hufen was already drawn up on the 26th of May of the current year by a certain Kunkel, which contract
    has now been given back by the hereditary lessees and is hereby, by striking through, wholly cancelled
    and annulled by them, in such wise that the same is to be regarded as not concluded, and that neither
    the one party nor the other shall form or assert any rights or claims out of it.


    The contracting parties had nothing further to adduce; they asked for'
  names:
  - de: Trąbczyner Ziegeley
    en: Trąbczyn brickworks
    kind: place
  - de: Kunkel
    en: Kunkel
    kind: person
  numbers:

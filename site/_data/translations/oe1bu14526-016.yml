- page: 3
  en: 'Ten Hufen ten Morgen Magdeburg measure, in arable, meadows, gardens and overgrown marsh-ground
    and [uncertain: Götzstellen], together with all the farm buildings found on this demesne farm, excepting
    the new cow-byre, which remains to the ground lordship, to the aforementioned residents Martin Giering,
    Wilhelm Daniel Schulz, Gottfried Dümmel, Michel Dämmel, Gottfried Damt and Christoph Schönfisch, for
    perpetual and everlasting times in hereditary lease.


    Each Hufe contains thirty Morgen, and each Morgen one hundred and eighty square rods Magdeburg measure.


    §. II. As purchase money the hereditary lessees pay'
  names:
  - de: Martin Giering
    en: Martin Giering
    kind: person
  - de: Wilhelm Daniel Schulz
    en: Wilhelm Daniel Schulz

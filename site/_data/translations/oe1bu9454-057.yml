status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! To render Your Most Serene Highness a personal
    report upon my return concerning the outcome of my journey was my most ardent wish, all the more so
    as I had so much to tell to Your Most Exalted Self which I dare not entrust to the pen. But want of
    money holds me back – I have not 10 Rthl in my possession, not a coat upon my body, for I was robbed
    along the way, and there is execution in the house – how I feel about all this Your Serene Highness,
    [uncertain: das Obsezt — does not parse], since you know sorrow and have a feeling heart, may easily
    imagine for yourself. God knows how I am to save myself; it is 1200 Rthl on account of which I now
    suffer so greatly. The iron still lies for Lahr in Kontop, for I cannot raise the cost of despatching
    it, and here the prices have fallen in such a manner that I cannot get rid of it. – Michaelis is satisfied,
    but now I have still to fear the man from Lahr, and the 400 Centner remaining for him are also not
    sufficient to pay him the 2000 Rthl and the costs, all the more so as, after deduction of the costs,
    scarcely 4 Rthl per cent will scarcely remain – for the journey I borrowed 600 Rthl and promised to
    pay over 700 Rthl at Johanni; God knows how that will end. For the rest, I accomplished everything
    in Königsberg very well – Your Serene Highness must already have the consequences thereof with you
    – the King was much incensed that on the part of the Higher Provincial Court Your Serene Highness
    was dealt with so harshly, and has commanded by express courier that Your Serene Highness be by all
    means spared. With regard to the matter of the inheritance, it has been written by courier to Warschau
    to Hoyok that he should first of all gather intelligence there whether the testament'
- page: 2
  en: 'has not perhaps been deposited there with the courts. In case nothing is found there, the matter
    is then to be transferred to Count Danckelmann. The Queen will write everything to Your Serene Highness
    upon the arrival of the answer from Hoyok; through me this could not be done, because I [uncertain:
    seitwärts nach Pohln geheimstes — does not parse] sideways into Poland. She places meanwhile her whole
    hope in Your Serene Highness – and [uncertain: nicht] gave verbal commissions to that end. Concerning
    Your Serene Highness''s military affairs – of these I have already written you much. By word of mouth
    I can only say more. The [uncertain: Facultät] is, that when your matter is decided Your Serene Highness
    is at once to be appointed General Governor of all Silesia. But let Your Most Exalted Self keep this
    secret, so that enviers and villains do not forge new cabals. – Scharnhorst is continually ill and
    will not give his declaration in the matter of Massenbach / who relies upon him alone /, and very
    much depends upon that. Your Serene Highness''s truly upright friend, the Herr Obristwachtmeister
    von Pirch, insists that Your Serene Highness should write and press for the conclusion of your affair.
    He has now written again to his brother and addressed the letter to Cosel – A letter from his brother
    went under the address of H. v. Scharnhorst – The latter opened the letter and sent it on to him,
    the Herr Obrist Wachtmeister, with many apologies; at which the good Major was very angry, and begs
    his Herr brother on that account to address his letters directly to him, or to have them sent. The
    most important thing for me was that the Monarch, the Queen, others at Court and especially General
    [uncertain: Körtirch — possibly Köckritz] spoke of Your Serene Highness with friendship, esteem and
    warmth; I now hope in every way for the best. Political matters stand well — if only God grants the
    Austrians good fortune – Russia plays a peculiar part; meanwhile between our'
- page: 3
  en: 'and the Russian Court all stands very well; I hope the Poles will shortly see themselves [uncertain:
    überlittet] by the Russians and come creeping to the cross. The reports of the 23rd from Vienna, which
    the Swedish envoy sent yesterday to a certain person, do indeed read altogether excellently. God grant
    blessing and good fortune. Whatever Your Serene Highness may know, be pleased to communicate it to
    me quickly – I am to send in reports. Tomorrow I hasten to Kalisz to fetch back my escaped youngest
    son, who wished to go over to the Imperials and is under arrest in Kalisz; I was ordered to go thither
    in this way, because all reports are lacking, [uncertain: aus Pohlen] there is a want of them in Königsberg
    – I have particular commissions, and the King now [uncertain: mit] South Prussia back again gladly.
    The Archduke Ferdinand sent Falkenhausen, who now serves in his suite as Rittmeister, to the King,
    in order to request him [uncertain: lies] to occupy Poland immediately behind him. His Majesty excuses
    himself for the present moment, but has promised nonetheless to be able to accede soon. Russia cannot
    yet take off the mask, and from that much is [uncertain: accoutirt]. The so-called Friends of Virtue,
    or Black Brothers, now cause the King much vexation. It is dreadful how far the malice of these men
    goes – Meanwhile the King now sees by degrees what the old ones are to him. To overthrow the dynasty
    and to introduce a democratic government was the intention of these villains – much have the dogs
    already achieved; good men are wholly dismissed and set aside, and nothing but such rogues in their
    place. It will be hard for the King now to redress all this. There are several of them who, as it
    is said, courted the crown'
- page: 4
  en: the great beginning is said to be had by the M[inister] St. The matter might have become very dangerous
    for the good King and the country, had the rogueries of Crocow not been discovered. [text lost] In
    every case one sees from these that several great persons are entangled in the plots, because (nevertheless,
    however it was managed, he was informed that he was to be arrested, so as to play the praevenire and
    make himself scarce. His letter to the King, written after his flight, is said to be the non plus
    ultra of all coarseness and baseness. Much more could I lay before Your Serene Highness, only that
    I dare not entrust it to the pen. Had not the trunk with money, clothing and linen been stolen from
    me, which amounts to over 800 Rthl, I should have been able to travel. Now I am a true beggar-dog,
    and must still thank God that I was not myself murdered. Kochriz was so honest as to offer me only
    100 fr. d'or; I refused it. The Queen wished to bestow something on me; I declined it. I was, or suffered,
    in want, yet I would rather have died of hunger than have accepted anything from these people. In
    Königsberg I ate nothing beyond dry bread with my judge, and now and then of an evening a bottle of
    beer, half drunk by me and half given to him – notwithstanding which the journey costs 713 Rthl. Now,
    however, I am glad only to be here again; I should be wholly at ease were I to see Your Serene Highness
    and to be able to say so many things more. The Archduke Ferdinand will send a matter to me which is
    to be addressed to Schlawenschitz or to Lüblinitz; should anything have come in there, may Your Serene
    Highness be pleased to send it to me here quickly. God, what things I should have to tell Your Serene
    Highness, but I cannot travel, for I am the poorest ragamuffin at this moment that you can imagine;
    if you wish to have me, then send. In deepest reverence I remain, until death, Your Serene Highness's
    Schweinern, 7th May 1809. most faithful servant v Triebenfeld

- page: 1
  en: '57


    Most Serene Prince


    Most gracious Prince and Lord!


    To render to Your Most Serene Highness in person, upon my return, a report on the outcome of my journey
    was my most ardent wish, the more so as I had so much to tell Your Most Serene Highness which I dare
    not entrust to the pen. But want of money holds me back — I have not 10 rt to my means, not a coat
    on my body, for I was robbed on the road, and I have distraint in the house — How I am disposed in
    mind thereby Your Serene Highness, knowing sorrow as you do and having a feeling heart, can easily
    imagine. God knows how I am to save myself; 1200 rthl is the object on account of which I now suffer
    so greatly. The iron still lies at Konotop for Lahr, for I cannot raise the costs of despatch, and
    here the prices have fallen to such a degree that I cannot get rid of it. — Michaelis is satisfied,
    but now I have still to fear von der Lahr, and the 400 hundredweight left over for him are likewise
    not enough to pay him the 3000 rt. and costs, the more so as, after deduction of the costs, scarcely
    4 rt. per hundredweight will remain — for the journey I borrowed 600 rt. and promised to hand over
    700 rt at Midsummer; God knows how that will end. For the rest, I accomplished everything very well
    at Königsberg — Your Serene Highness must already have the consequences of it with you — the King
    was much incensed that from the side of the High Court of Appeal Your Serene Highness should be dealt
    with so harshly, and has ordered by express courier that Your Serene Highness be by all means spared.
    In regard to the inheritance matter, it has been written by courier to Warsaw to Hoyok, that he should
    first of all gather intelligence there whether the will'
- page: 2
  en: 'has not perhaps been deposited there with the courts. In case nothing is found there, the matter
    is then to be transferred to Count Danckelmann. The Queen will write Your Serene Highness everything
    upon the arrival of the answer from Hoyok; through me this could not be done, because I [uncertain:
    geheimstes] sideways to Poland. She places meanwhile her whole hope upon Your Serene Highness — and
    has not for that purpose given verbal commissions. Concerning Your Serene Highness''s military affairs
    — of these I have already written you much. Verbally I can only say more. The result is that, when
    your case is decided, Your Serene Highness is at once to be appointed General Governor of all Silesia.
    But let Your Highness keep this secret, so that envious persons and villains do not forge new cabals
    — Scharnhorst is continually ill and will not give his declaration regarding Massenbach / who relies
    upon him alone /, and on that very much depends — Your Serene Highness''s truly upright friend, the
    Major von Pirch, insists that Your Serene Highness should write and press for the conclusion of your
    case. He has now written again to his brother and addressed the letter to Koźle — A letter of his
    brother''s went under the address of Mr von Scharnhorst — The latter opened the letter and sent it
    on to him, the Major, with many apologies; at which the good Major was very angry, and requests his
    lord brother on that account to address his letters directly to him or to let them go so. The most
    important thing for me was that the Monarch, the Queen, others at court, and especially General Köckritz
    spoke of Your Serene Highness with friendship, esteem and warmth; I now hope for the best in every
    way.


    Political matters stand well — If only God gives the Austrians good fortune — Russia plays a peculiar
    role; meanwhile between our'
- page: 3
  en: 'and the Russian court all stands very well; I hope the Poles will shortly see themselves [uncertain:
    outwitted] by the Russians and creep to [uncertain: Lahn] — The reports of the 23rd from Vienna, which
    the Swedish envoy sent yesterday to somebody, do indeed sound altogether excellent. God grant blessing
    and fortune. Whatever Your Serene Highness knows, may you deign to communicate it quickly — I am to
    send in reports. Tomorrow I hasten to Kalisz to fetch back my escaped youngest son, who wished to
    go over to the Imperial troops and has been arrested at Kalisz; I was ordered to go thither in any
    case, because all news out of Poland is lacking at Königsberg — I have particular commissions, and
    the King [uncertain: mit] South Prussia back again gladly.


    Archduke Ferdinand sent Falkenhausen, who now serves in his suite as cavalry captain, to the King,
    in order to [illegible] request him to occupy Poland immediately behind him. His Majesty excuses himself
    for the moment, but yet promised to be able to accede soon. Russia only cannot yet take off the mask,
    and from that much [uncertain: accoutirt] itself.


    The so-called Friends of Virtue, or Black Brethren, now cause the King much vexation. It is frightful
    how far the malice of these men goes — Meanwhile the King now sees, by and by, what the old ones are
    to him.


    To overthrow the dynasty, to introduce a democratic government by necessity, was the villains'' intention
    — much have the dogs already accomplished; good men are wholly removed and set back, and nothing but
    such rogues in their place. It will now be hard for the King to redress all that.


    There are several of them who, as is said, [uncertain: courted the crown]'
- page: 4
  en: 'the great beginning is said to have been made by the M St.


    The matter might have become very dangerous for the good King and the country, had the rogueries of
    Cracow not been discovered. Meanwhile one sees from these that several great persons are entangled
    in the plots, because C nevertheless, however it was kept, was informed that he was to be arrested,
    so as to play the praevenire and to make himself scarce.


    His letter to the King, written after his flight, is said to be the non plus ultra of all coarseness
    and baseness. Much more could I lay before Your Serene Highness, which for that reason I would not
    entrust to the pen; had not the trunk with money, clothing and linen been stolen from me, amounting
    to over 800 rt, I could have travelled. Now I am a true beggar-dog and must still thank God that I
    was not myself murdered. Köckritz was so honest as to offer 100 fr. d''or; I declined it. The Queen
    wished to bestow something on me; I refused it. I had, or suffered, want; yet I would sooner have
    croaked hanging than have accepted anything from these people. At Königsberg I have eaten nothing
    beyond dry bread with my [uncertain: Richter], and now and again of an evening a bottle of beer, half
    drunk myself and half given to him — notwithstanding which the journey costs 713 rt; now, however,
    I am glad only to be here again. I should be wholly set at ease to see Your Serene Highness and to
    be able to say so much besides. Archduke Ferdinand will send a matter to me which is to be addressed
    to Sławięcice or to Lubliniec; should anything have come in there, may Your Serene Highness deign
    to send me such quickly hither. God, what I should have to tell Your Serene Highness, but I cannot
    travel, for I am the poorest [uncertain: Lungenhänd] at this moment that you can conceive; if you
    wish to have me, then send [illegible]. Most reverently I remain, until death, Your Serene Highness''s


    Świniary


    the 7th of May 1809.


    most faithful servant


    v Triebenfeld'

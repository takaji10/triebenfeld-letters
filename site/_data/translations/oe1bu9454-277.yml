- page: 2
  en: 'his old good father, and has given the advocate an unlimited power of attorney, by virtue of which
    he must place everything belonging to the old good Prince under arrest and diminish it - one does
    not know whether this comes from a want of prudence or from malice and favourable times. Winzingerode
    does the like and warns them to withdraw the power of attorney, not to bring themselves to ruin and
    not to set aside the judgement of the first men of Europe. I think that should work strongly; the
    poor gentleman is held to be very weak. Poustales has not yet answered. It is credibly reported that
    they will arrive here very shortly, for the burgesses and collectors of Neucheten have sent a deputation
    with great complaints against their councillor of state to the King - the councillor of state is now
    also to send a deputation here on his own part - and since Poartelles is known in this council and
    [uncertain: Heylen], as a guest and as a serving officer, he too will probably appear in person. He
    needs support so much.


    Now the great and important matter - that Napoleon has escaped, Your Serene Highness knows - According
    to today''s news he has landed at Antiber and is turning towards Toulon - In Toulon stands Massen,
    who is much displeased that he was not made a peer — then there is also the General von Bertherand
    and General Molis, all adherents of Napoleon - In Switzerland everything is in ferment, that will
    become a favourable [uncertain: market], and Murat is said to be arming himself dreadfully – in order
    to press through from that side by way of Italy - It is already said that N. has much future there
    — the King of Saxony still refuses to sign - Wellington and Talleyrand are still with him in Preiberg
    - Meanwhile it is believed that God will accordingly prevent the war - What the King of Württemberg
    has issued to the Hohenlohes, what has been answered to him from all sides, what has in that case
    been set up here at the Congress, all lies here; from the Congress a strong reprimand has been given
    to the King, which Your Serene Highness shall receive in future — In deepest reverence I remain, until
    death,


    Your Serene Highness''s


    Vienna, the 11th of March


    1815


    most faithful and most obedient servant

    v. Triebenfeld'

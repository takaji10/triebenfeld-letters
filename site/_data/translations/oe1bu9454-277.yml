  en: '277


    Most Serene Prince


    Most gracious Prince and Lord, Your Serene Highness''s most gracious letter of the 6th I received
    by express courier about — an ho[ur] ago; as I had just begun a letter to Your Most High Self, I laid
    that aside and began this one — The order to pay 200 # I received first of all, then there lay within
    it 3 French blank signed sheets, the 2 letters from Your Serene Highness, one from Court Councillor
    Hahn and 5 servants, to Russia, from Poland, from Wrocław, and from Frankfurt am Main — I think most
    heartily for it. But I can write little today — for I am very weak and have a great deal of head-trouble,
    and it is also scarcely 2 hours more until the departure of the post — I have therefore not even been
    able to read everything, and shall write the greater part by the next post — I only renew my wish
    that Mr Eberhard and Mr Hahn might come here. Much would certainly be accomplished with the 3 ladies,
    and I also continue to believe that the business with Prince Adolph goes forward at once — Stägemann
    has still had no presentation made, and one might perish over it for the Chamber. The Polish estates
    matter I have once again handed over to the Prince H[?] Serene Highness with all the documents of
    the files; also, on the advice of Privy Councillor of State von Beguelin, I brought myself to write
    to Zerboni, and I enclose the answer herewith — by the next post I shall send the copy of all the
    poor petitions — the Prince has received it well and it has also already passed the journal, but where
    it will come to lie again I do not yet know — The people are all here except for the single Prince,
    as though they wished only to burden themselves, and the sufferer seemed to come round — Meanwhile
    all stands well, for Cosmar is, as everyone says, as good as annihilated — I have made myself some
    fierce enemies on account of my frank Switzerland[illegible], yet what do I care for that, if only
    you are saved — August must only demand back the power of attorney in the prescribed manner; I have
    set a spur in his side for that, whereby he will be mightily assisted. Yesterday not only Prince Bartenstein,
    who commends himself to Your Serene Highness, but also Göschel wrote to the Prince of Langenburg,
    that in the Harde[nberg] house they had heard him speak very harshly of August, because he had allied
    himself with a most intriguing advocate against'

- page: 2
  en: 'his old good father, and had given the advocate an unlimited power of attorney, by which the latter
    would have to lay everything of the old good Prince''s under arrest and waste it away — one does not
    know whether this comes from a want of prudence or from malice and favourable times. Count Winzingerode
    does the same and warns them to fetch back the power of attorney, not to ruin themselves, and to turn
    aside from themselves the judgement of the foremost men [illegible] — I think that should work strongly;
    the poor gentleman is held to be very weak — Pourtalès has not yet answered. B believes that he will
    arrive here very shortly. For the sureties and collectors of Neuchâtel have sent a deputation with
    great complaints against their Council of State to the King — the Council of State is now also to
    send a deputation here on its own part — and since Pourtalès is known in this council and [text lost:
    garbled] court, guests as a serving officer, he will probably appear himself — He so needs support
    — Now for the great and important matter — that Napoleon has escaped, Your Serene Highness knows —
    According to today''s reports he has landed at Antibes and is turning towards Toulon — In Toulon stands
    Masséna, who is very much displeased that he has not been named a peer — then there is also General
    von Bertrand there, and General Molis, all adherents of Napoleon — In Switzerland everything is in
    ferment; that will make a favourable [uncertain: Märte], and Murat is, I fear, puffing himself up
    frightfully — in order to press through from that side by way of Italy — It is already said that N
    has much of a future there — the King of Saxony still refuses to sign — Wellington and Talleyrand
    are still with him in Pressburg — Meanwhile it is believed that God will accordingly prevent the war
    — What the King of Württemberg has issued to the Hohenlohe [family], what has been answered to him
    from all sides, what has in that case been submitted here at the Congress, all lies enclosed herewith
    — from the Congress a strong reprimand has been given to the King, which Your Serene Highness shall
    receive in future — In deepest reverence I remain, until death,


    Your Serene Highness''s


    Vienna, the 11th of March


    1815


    most faithful and obedient servant


    v Triebenfeld'

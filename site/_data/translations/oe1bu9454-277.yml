- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, I received Your Serene Highness''s most gracious letter of the 6th
    by express courier about one [text lost] ago; as I had just begun a letter to Your Most High Self,
    I laid that aside and began this one. The order to pay 200 M I received first; then there lay in it
    3 French blank forms, the 2nd letter from Your Serene Highness, one from Mr. [uncertain: Court] Councillor
    Hahn, and 5 [uncertain: servants], to Russia, from Poland, to [uncertain: Breiten], and from Frankfurt
    an der Oder and Main. I thank you most heartily for it. But I can write little today - for I am very
    weary and have a great headache; also it is only some 2 hours yet until the post goes out - I have
    therefore not even been able to read everything, and shall write the greater part by the next post
    - I only renew my wish that Mr. Eberhard and Mr. Hahn might come here. Much would certainly be accomplished
    with the 3 [uncertain: Darnte]; also I continue to believe that the business with Prince Adolph will
    go forward at once. Stägemann has still had no audience for his report, and one might perish of vexation
    over it. The high estates affair I have once more handed over to the Prince, His Serene Highness,
    with all the documents in the file; also, on the advice of the Privy Councillor of State von Beugelin,
    I brought myself to write to Zerboni; the answer I enclose herewith. By the next post I shall send
    the copy of all the poor petitions - the Prince has received it well, and it has also already passed
    the register, but where it will come to lie idle again I do not yet know - The people are all here
    except for the single Prince, as though they would only trouble themselves, and the one who suffers
    seems to be [illegible] - Meanwhile all stands well, for Cosmar is, as everyone says, as good as annihilated
    - on account of my candid [uncertain: Switzerland] fierce enemies.


    I have made a few [enemies] for myself, but what do I care for that, so long as you are only saved
    - August must only demand the power of attorney in the prescribed form; I have set him a spur in the
    side for that, in which he will be mightily assisted. Yesterday not only E. Bastenstein, who commends
    himself to Your Serene Highness, but also Göschel wrote to the Prince of Langenburg, that in the Hardz
    house they have heard him spoken of very harshly on August''s account, because he has joined himself
    with a most intriguing advocate against</p>'

status: draft
segments:
- page: 1
  en: 'presented 18 Sept. 1799. Copy.


    Decree on the representation of v Chełmski of 6 Sept. 1799 in the matter of himself ./. Prusimski:
    For resolution, by copy of this decree: before the suit he asks for can be admitted, he must first
    show the real character of the claim, and that he must for that reason be satisfied from the estates.
    Kalisz, 10 Sept. 1799. Royal South Prussian Government Chancery. To von Chełmski, into the hands of
    Cr. Councillor Mondro


    here.


    4980.


    presented 5 October 1799. Copy.


    Decree


    in the case of von Chełmski ./. Prusimski. By copy of the decree, for resolution: it remains, on the
    ground'
- page: 2
  en: 'of the entirely clear content of the judgment of revision, by the ruling of the 10th of this month,
    all the more as he himself treats this claim as a personal one. Kalisz, 27 Sept. 1799. Royal South
    Prussian Government Chancery. Copy of the decree to[?] the criminal-court councillor[?] Mondro, here.


    3459.'

- page: 3
  en: 'this mortgage certificate is hereby issued to His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen,
    Friedrich Ludwig, in vim recognitionis, on account of the titulus possessionis entered for the same
    upon the ground of the deed of donation of 9 August 1796.


    In witness whereof, under the greater seal of the Royal South Prussian Government and the customary
    signature. Given at Kalisz, 22 July 1800.


    Renk[illegible]


    Von Rangeler[uncertain: Rangeler] Government Councillor


    Mortgage certificate for His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, Friedrich
    Ludwig, concerning the free allodial estate of Szetlewek situated in the Konin district. Schlegel,
    Chancery Director. Beda, Ingrossator.


    Mortgage certificate 2 Rthl. 2 Groschen. Stamp 6 Groschen.


    Moz 2 Groschen.


    Bl 3 Groschen.


    *archive 1 Rthl'

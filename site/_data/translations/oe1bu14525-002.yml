segments:
- page: 1
  en: 'The free allodial estate of Szetlewek, situated in the province of South Prussia and in its Konin
    district, was received by the present possessor, the reigning Prince of Hohenlohe-Ingelfingen, Friedrich
    Ludwig, Serene Highness, in heredity and in full ownership by grant of His Majesty the most blessed
    King Friedrich Wilhelm II, according to the deed of donation of 9 August 1796, and he has declared
    the value of the same at 24000 Reichsthaler, written out Twenty-Four Thousand Reichsthaler. Entered
    by decree of 2 July 1799.


    Thereupon are entered:


    I. Onera perpetua. Restrictions upon the ownership or upon the disposition. The restriction upon the
    ownership, that these estates may not be sold to any native of the land, unless the first or one of
    the succeeding possessors shall have obtained the consent to alienation to natives of the land, in
    which case an unconditional power of alienation to persons capable of possession takes effect for
    the future, has been entered upon the ground of the Court Rescript of 24 February 1800, by decree
    of'

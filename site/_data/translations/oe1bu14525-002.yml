- page: 2
  en: '27 May 1800.


    Judicially secured debts and other real obligations.


    1. 8333 Rthl. 8 Groschen, Eight Thousand Three Hundred Thirty-Three Reichsthaler 8 Groschen, or 50000
    Polish florins in specie thalers, were lent by Ignatz von Radzinski to the possessor without interest,
    as security for the lease moneys to be paid for Szetlewek and to cover any deteriorations that may
    arise; they have been entered for the creditor von Radzinski upon the ground of the settlement concluded
    with him on 5 September 1799 and confirmed on the 17th of the same, §. 5, by decree of 22 October
    1799.


    A protestation pro salvando iure et loco for Jacob von Przespolewski, on account of a demand of 30000
    Polish florins ex inscriptione of the former possessor von Prusimski of 25 June 1789, together with
    arrears of interest at 5 per cent since Midsummer 1790, which has been entered by decree of 8 April
    1800 here and at the same time upon Trąbczyn.


    Besides the foregoing items nothing is entered upon the estate of Szetlewek in the mortgage book,
    and for the rest'

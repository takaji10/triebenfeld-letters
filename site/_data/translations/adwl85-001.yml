status: draft
segments:
- page: 1
  en: 'The village of Trąbczyn,


    in which there is a church. Its parish priest is the Reverend Józef Zurkowski, born in the diocese
    of Poznań, as his baptismal record shows, in the year 1740, on 9 July. He was ordained priest by the
    Most Illustrious and Reverend Ignacy Augustyn Sariusz [uncertain: Kozierok] Kozierowski, Bishop Adratyński,
    in the year 1767, on 24 February, having first had letters dimissory for receiving the orders of the
    diaconate and the priesthood from the Most Illustrious and Reverend Teodor Czartoryski, Count of Klewań
    and Żuków, Bishop of Poznań, given to him on 17 December 1766. He was instituted to this church in
    the Illustrious Consistory of Gniezno on 21 February 1785, on the presentation of the Most Illustrious
    Antoni Prusimski, Starost of Niszczewice, Knight of the Order of St Stanislaus, heir and patron of
    these estates. He was approved to hear confessions for one year at the time of the retreat, in its
    appointed place and term, in'
- page: 2
  en: 'Konin, held in the present year on 15 October. A fund for a vicar, an organist and a schoolmaster
    is found in the documents, but none of them is at the church.


    The state of this church.


    This church, in the village of Trąbczyn, the hereditary property of the Most Illustrious Antoni Prusimski,
    Starost of Niszczewice, Knight of the Order of St Stanislaus, lies in the voivodeship of Kalisz, in
    the district and deanery of Konin, in the archdeaconry and officialate of Gniezno. It is 6 miles from
    the metropolitan city of Gniezno, 21 miles from Łowicz, 5 miles from His Royal Majesty''s city of
    Kalisz, and 2 miles from Konin, the district town. By parish right it takes in the said village of
    Trąbczyn, in which the church stands; Mariantów, Porąbki, the farm called [uncertain: Uta], the new
    and old Olędry, Łazy, Osiny, Nowawies. These villages lie from the church: towards the winter sunrise
    8 furlongs; towards the forenoon likewise; towards the afternoon half a mile; towards the sunset a
    quarter of a mile; to the west 10 furlongs. All of them are the hereditary property of the Most Illustrious
    Starost.


    The parish extends a good half mile. In the whole parish 760 souls are counted in all, that is 170
    men, 191 women, 95 boys coming to communion for the first time, 99 girls; of dissidents 63 men, 60
    women, 40 boys, 42 girls. In the past year 1790, according to the entries of the registers, children
    baptised'
- page: 3
  en: 'of the male sex 13, of the female sex 15; couples married 10; men died 10, women 15, children of
    both sexes 4; all of which may be seen in the following table.


    Year 1791. | Specification of the number of persons belonging to the parish of Trąbczyn



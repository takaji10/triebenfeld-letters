    This church is in the form of a cross, with two wooden chapels, and has a new roof. The ceiling is
    damaged in places by leaks of rain from earlier times; the floor of planks throughout the church needs
    relaying in the great choir. The church faces the sunrise. The great door, to the west, closes well.
    It has a high choir loft, on which stands a good positive organ with seven stops and three bellows.
    [uncertain: Beside it], on the south side, a door from the cemetery to the porch, closing well, from
    which one enters the chapel and from it the church. The sacristy is of wood and needs its windows
    repaired and a new floor;'
- page: 4
  en: 'in it a table with four large drawers for the vestments and smaller ones for the chalices, veils
    and corporals etc., closing well; there too an old tabernacle for keeping the Most Holy Sacrament,
    broken; a large chest with a good lock. From this sacristy a door to the west into the library, in
    which a large cupboard stands for the books. Opposite the sacristy, to the north, a treasury, whose
    door and lock are good; a large cupboard stands there with a good lock.


    The length of this church in all is 47 ells, the width 33 ells; that is, the presbytery is 14 ells
    long and 9 ells wide; the great choir 33 ells long and 14 ells wide. The chapel of St Martin on the
    north side is 12 ells long and 8½ ells wide; in it 2 cupboards, locked, for the lights. On the south
    side the second chapel, of St Aloysius, 10½ ells long and 8¼ ells wide. The sacristy is 8 ells long
    and 5 ells wide; the library 5 ells long and 4 ells wide; the treasury 8½ ells long and 2¾ ells wide;
    the porch 4½ ells long and 5½ ells wide.


    Windows: in the small choir 4, needing repair; in the great choir 4, good; in the chapels two each,
    these good; in the sacristy 2 small windows with iron grilles, somewhat damaged; in the treasury only
    an iron grille, without a window.


    In this church are 4 good confessionals painted blue, with grilles; 20 good pews painted the same
    way; a railing with balusters'
- page: 5
  en: 'painted, covered with white cloths.


    This church was built in part by the noble Trąmpczyński family, once heirs of the place, and later
    enlarged by the noble Lady Prusimska, née Rozdrażewska, the Chamberlain''s wife, heiress (when, it
    cannot be known). Its titular patron is St Martin, Bishop. It was consecrated in the year 1546, on
    26 September. The day of its consecration is kept every year on the first Sunday after the feast of
    St Matthew the Apostle. The cemetery has on the south, east and west side a small, recent fence, into
    which there is a good gate for entering from the east, and from the west a carriage gate and a gate,
    good, with a lock, but there are no grilles by them. There too, straight opposite the great door of
    the church, is the belfry, needing sill-beams and doors over half of it, as the planks have fallen
    off, and a roof before long; in it two bells, whether consecrated is not known; one of them is chipped.
    To the north of the church is an ossuary of wood, good, with a window onto the cemetery; between it
    and the belfry the fence leans, further on it is good.


    The right of patronage, or collation, of this church is lay, and the church has always been governed
    by secular priests. Its patron now is the Most Illustrious Antoni Prusimski, Starost of Niszczewice,
    Knight of the Order of St Stanislaus. There are no mansionaries, prebends or altarages, nor any fund
    for them.


    In this church there are 5 altars: the first, the high altar, in which a picture of the Mother of
    God under the title of the Scapular, with a confraternity, closed by a sliding cover, with a dress
    and crowns of silver'
- page: 6
  en: 'smaller 20. Cushions on the altars 5. Covers for the altars 6. Good small carpets 2. An old carpet
    1.


    Church books.


    The first register, for entering baptisms, begun in 1597, is complete to the present year. The book
    of marriages from 1597 to this year. The book for entering the dead from the year 1728 to this time.
    The book for entering the brothers and sisters of the Holy Scapular from the year 1662. A book in
    which the state of the benefice in the year 1688 is described; various foundations; inventories of
    various times, and benefactors. Antiphonaries with notes 2. Choral book 1. Rituale Sacramentorum 1.
    Breviary, Agenda, Gospel books 2. Old missals 3. Vita Virorum Illustrium, Conceptus Theologicus 1.
    Libri duo Justini Baronii, Conciones of the Reverend Father Ozorius, Conciones of the Reverend Father
    Besser, Decisiones et Declarationes Concilii Tridentini, Conciones cum Evangeliis of an unknown author,
    Coeli seu sphaerae coelestis contemplatio, Rudolphus Godonius, Opera Sancta, a Polish chronicle, Homiliae
    Sanctorum, a pastoral letter, Promptuarium morale, Catechismus Romanus, Manuale Parochorum. The rest
    of the books that were at the visitation of the Reverend Dorposki are not set down here; the reason
    is that, through a trick played under the present rector of this church, and through not knowing to
    whom they belonged, they were given to the creditors of the late Reverend Paprocki, the pastor here.
    A good catafalque with a [uncertain: coffin], a bier, a processional cross 1, a lectern 1, a mourning
    banner 1,'
- page: 7
  en: 'small pennants 5, small banners 2.


    Description of the rights and documents found at this church.


    1662. A resignation made in court in the books of the Konin land court, of a piece of peasant land
    called Pierzchalińska, for the pay of the organist and the needs of the church. 1636: the first foundation
    sum, 1,000 Polish złoty, secured on Trąbczyn; the second, 1,500 złoty, in the year 1637, which the
    noble Trąmpczyński, heir, recorded at Kalisz and at Pyzdry. From these there is now due 80½ złoty
    each year, with the obligation of singing 52 Holy Masses a year, reading 156, and of 208 litanies
    sung by the organist; from this income also something for the fabric of the church. 1668: a sum of
    350 Polish złoty, secured on part of Kurów and recorded there too, from the noble Mr Stefan Wardencki;
    likewise 250 złoty placed by the noble Mr [uncertain: Bagusławski]; from it 21 złoty is due for saying
    52 Masses. 1670: 500 Polish złoty secured on Strzałkowo, recorded at Kalisz and Pyzdry, from the noble
    Mr Strzałkowski; from it 17½ złoty is due, for 12 Masses. There too a sum of 2,000 złoty, recorded
    under the same year and act by the noble Lady [uncertain: Golinska] on the estate of Przespolew, for
    saying 104 Masses every year. 1692, 16 December: a decree of the Gniezno consistory, taken from its
    archive, by which the tithe from the farm of [uncertain: Drezgi], and likewise from the farm called
    Nowina, is awarded. 1694: the inn, confirmed by a decree of the [uncertain: Most Illustrious] Official
    of Gniezno, with the right to sell beer and spirits in it; in the same decree a house for the school
    is named, which'
- page: 8
  en: 'now has the name of the organist''s house. Item, in the same decree, a piece of the parish land:
    a separate pine wood, by which the peasants, with the parish priests'' leave, cleared fields and small
    meadows for themselves; this clearing has the name Porąbki, and three cottagers now live on it; likewise
    a large meadow beyond the wood and Porąbki, belonging to the parish. By the same decree the measured
    tithe from the lords'' farms, and a meadow called [uncertain: Jalewska], given long ago by the heirs,
    are awarded. 1697: a resignation of half a piece of land and a field, made at the Kaptur court at
    Kalisz after the death of John III, King of Poland; likewise of new land for the schoolmaster, lying
    by the church wood on the north side. Under the same act the noble Andrzej Trąmpczyński, heir of part
    of Trąbczyn, makes a submission to bear all dues and taxes that may be imposed on the said lands,
    which he resigned to the church of Trąbczyn. Apart from these there are no other documents at the
    church.


    The economic state and the income of this church.


    Beside the church, on the south side, there is a considerable plot, up to 50 German rods in length
    and width, on which are [uncertain: orchards] and the parish buildings. First, the parsonage, in the
    form of a cross, with its front to the south; its hall is fairly spacious; on the right side from
    the entrance the first room, from it a small bedroom, further a store or pantry, then a closet; on
    the left a fairly spacious servants'' room, beside which are two closets, in one of them the stairs
    or way up to the upper floor; in the middle of this'

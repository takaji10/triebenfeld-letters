- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    To Your Most Serene Highness''s most honoured letter of the 23th of last month I reply most obediently,
    that it is at present [text lost] possible for me to convey from here to the same, in haste, any other
    statement than that which Your Princely Serene Highness has already had for 2 years. In this one only
    the Trąbczyn revenues are to be deducted, and there then results the sum of yield of the Zagórów estates
    itself. So far as I can recall, the lordship of Zagórów will amount to


    1.) the propination rights 5,000 Rthl annually


    2.) interest from the old subjects according to the contract of [uncertain: Ges] 2,000 Rthl


    3.) Oleśnica, where there are now some 19,000 Rthl first, according to the hereditary lease contract
    2,000 Rthl


    4) Wrąbczyn interest according to the hereditary lease contract 1,000 Rthl


    5.) Emilien[hain], Augustinow, Alexandrow, Adolphsberg, by contract 3,000 Rthl (interest [text lost]
    likewise)


    6.) Klein Ingelfingen and Grądzyń interest according to the hereditary lease contract 2,000 Rthl


    7.) Swięcia already bears interest according to the hereditary lease contract 1,800 Rthl


    8.) Alt Drzewice, which is not yet built up, but interest 1,800 Rthl


    9.) Swiątniki likewise 1,800 Rthl


    10.) Sophienthal bears interest according to the hereditary lease contract 1,000 Rthl


    11.) Klein Schrazberg, Friedrichsfelde, Fürstenfelde etc. likewise 2,000 Rthl


    12.) Kopojno and Adelow according to the lease and hereditary lease contract 2,000 Rthl


    13.) Zagórów according to the instrument 300 Rthl


    14.) jurisdictional dues, transfer fees (Laudemium), hunting and small usages, on average 2,000 Rthl


    = 27,700 Rthl. All taxes and costs are borne, according to the hereditary lease contracts, by the
    hereditary lessees, and therefore nothing may be deducted from the revenues.


    Debts encumber the considerable estates according to the mortgage certificate and the judicial instrument
    between me and Oppenheimer, only in actual effect


    1.) Lichnowski, which have been transferred to Oppenheimer 32,300 Rthl


    2.) Meyer Bernhard 5,600 Rthl


    3.) for Glenck likewise 20,000 Rthl


    4.) the Invalids'' Fund, which the Jew Oppenheimer took over and has not paid. 50,000 Rthl


    5.) costs which the Jew; paid 1,400 Rthl


    6.) To Bernhardi likewise 4,500 Rthl


    7.) To Your Serene Highness per further band, do 15,000 Rthl


    8.) To sundry items, as costs to Your Serene Highness through not the 20,000 Rthl. Sum 148,800 Rthl.
    This amounts, in annual interest reckoned at 5 per cent, to 7,440 Rthl. Accordingly there must remain
    annually to Your Serene Highness''s treasury 20,260 Rthl'

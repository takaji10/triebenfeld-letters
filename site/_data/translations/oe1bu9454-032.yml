- page: 2
  en: 'Hereupon a mortgage of 250,000 Rthl has been pledged to the Jew Oppenheimer, whereby the Jew stipulated
    for himself 7 per cent brokerage according to the judicial instrument annexed hereto, which of the
    sum, with the 50/m Rthl to the Invalids'' Fund, would come to 160,000 Rthl in question; but since
    the Jew has again paid neither the 50,000 Rthl to the Invalids'' Fund nor still less the interest,
    then they are not to claim the 7 per cent, and the 11,200 Rthl fall away and to Your Serene Highness''s
    benefit.


    I have now sued his Jew on this account, and I hope to finalise the matter yet during my presence
    here.


    It is therefore, as Your Serene Highness may be pleased to satisfy yourself, the actual sum of 148,800
    Rthl — which would have to be discharged. Thereupon the mortgage now encumbered to the amount of 250,000
    Rthl is wholly and altogether free, and all the [uncertain: unschende] debts entirely discharged.
    The mortgage certificates annexed hereto in copy, attested by the court, do indeed at the beginning
    still state the canons and competences; however, as already said, the hereditary lessees have entirely
    taken these over, and they will never again fall as a burden upon Your Serene Highness. Finally I
    note further that to Ein dem Flauche Eröhn considerable sums must still be paid, namely marriage and
    hereditary lease monies which remained in arrears after the war, unless it be that the various general
    attorneys have already appropriated a part thereof to themselves. For my part I have in 2 years collected
    nothing from there, have seen no man from there, and despite messengers sent many times from die Haaren
    I have not been able to obtain the least intelligence — because they had now entered into correspondence
    with Your Serene Highness yourself, I have without wurren Vorte paid out of my own pocket express
    courier monies, small capital sums and lawsuit costs, and also considerable interest, and have had
    them paid through Professor Rhode; but at present I am [uncertain: möchte].


    As for the rest, so far as concerns the Trąbczyn estates, such are, according to my first conviction,
    not lost. I myself cannot for the present go onto the estates, for reasons; but I shall, with the
    French authorities and in all places, be heard more than Your Serene Highness may thank for it. As
    concerns the Kamionna affair, Your Serene Highness has answered just as I did; however it seems to
    me that'

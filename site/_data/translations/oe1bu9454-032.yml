- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord.


    In reply to Your Most Serene Highness''s most honoured letter of the 23rd of last month I most obediently
    answer that it is as soon as possible for me from here to transmit to the same in haste another statement
    of account than the one which Your Princely Highness has already had these 2 years; only the Trąbczyn
    revenues are to be deducted, and thus the sum of yield of the Zagorowo estates comes out thus. So
    far as I recall, meanwhile, the lordship of Zagorowo will remain owing[?]


    1.) the propination rights 5000 Rthl annually


    2.) Interest from the old subjects according to the contract of dues 2000


    3.) Olesnica, where there are now some 19,000 Rthl first, according to hereditary lease contract 2000


    4) Wrąbczin interest according to hereditary lease contract 1000


    5. Emilien[hain] Augustinow Allexandrow Adolphsberg contract 3000 (interest [text lost] likewise)


    6.) Klein Ingelfingen and Grądzin interest according to hereditary lease contract 2000


    7.) Swięcia already pays interest according to hereditary lease contract 1800


    8. Alt Drewie, which is not yet built up, but interest 1800


    9.) Swiątniki the same 1800


    10.) Sophienthal pays interest according to hereditary lease contract 1000


    11.) Klein Schrazberg, Friedrichsfelde, Fürstenfelde etc. the same 2000


    12.) Kopojno and Adelow according to lease and hereditary lease contract 2000


    13.) Zagorowo according to deed 300


    14.) Jurisdictional dues, transfer fees (Laudemia), hunting and small usages, on average 2000


    = 27700 All taxes and costs are borne, under the hereditary lease contracts, by the hereditary lessees,
    and therefore nothing may be deducted from the revenues.


    Debts encumber the considerable estates according to the mortgage certificate and the judicial instrument
    between only and the Oppenheimer only effectively


    1.) Lichnowsky, which has been transferred to Oppenheimer 32300 Rthl


    2.) Meyer Bernhard 5600


    3.) for Glenck the same 20000


    4.) The Invalids'' Fund, which the Jew Oppenheimer took over and has not paid. 50000


    5.) Costs which the Jew; paid 1400


    6.) To Bernhardi likewise 4500


    7. To His Serene Highness by further bond, that 15000


    8. To sundry items, as costs to Your Serene Highness through me the 20000 Sum 148,800. Rthl this amounts,
    annual interest reckoned at 5 per cent, to 7440. Accordingly there must remain to Your Serene Highness''s
    treasury annually 20260'

- page: 3
  en: 'the period for issue fixed in the contract had also already expired. In conclusion I must further
    state here that I was on the point of obtaining a capital of 200,000 Rthl upon the mortgage out of
    Holland, through a couple of Müllers now staying here. But if Your Serene Highness now has closer
    prospects and certainty there of drawing such a capital, then be pleased to write to us upon it at
    the very earliest, so that I may spare myself unnecessary costs and vexation here. With unbounded
    veneration and the deepest respect I remain Your Serene Highness''s


    Berlin


    the 3rd of April 1808


    faithful, most humble and obedient servant


    v Triebenfeld'

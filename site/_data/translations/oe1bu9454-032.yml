status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord. Upon Your Most Serene Highness''s most highly
    honoured [uncertain: ben] of the 23rd of last month I reply most obediently that it is as soon as
    possible for me to convey from here in haste to the same another statement than that which Your Princely
    Highness has already had these 2 years past; only the Trąbcziner revenues are to be brought into deduction,
    whereupon the sum of yield of the Zagorower estates now comes out thus. So far as remains with me,
    however, the lordship of Zagorowo will amount to [uncertain: restiren]: 1.) the propination rights
    5000 Rthl yearly; 2.) interest from the old subjects according to the [uncertain: Ges-]contract 2000;
    3.) Olesnica, where there are now some 19,000 Rthl first [text as written], according to the hereditary-lease
    contract 2000; 4) Wrąbczin interest according to the hereditary-lease contract 1000; 5. Emilien[hain],
    Augustinow, Allexandrow, Adolphsberg, contract 3000 (interest [text lost] likewise); 6.) Klein Ingelfingen
    and Grądzin interest according to the hereditary-lease contract 2000; 7.) Swięcia already yields interest
    according to the hereditary-lease contract 1800; 8. Alt Drewie, which is not yet built up, but nevertheless
    interest 1800; 9.) Swiętnik the same 1800; 10.) Sophienthal yields interest according to the hereditary-lease
    contract 1000; 11.) Klein Schrazberg, Friedrichsfelde, Fürstenfelde etc. the same 2000; 12.) Kopojer
    and Adelow according to the lease and hereditary-lease contract 2000; 13.) Zagorow according to deed
    300; 14.) jurisdictional dues, Laudemien, hunting and small usages, on average 2000 = 27700. All taxes
    and costs are borne, according to the hereditary-lease contracts, by the hereditary lessees, and therefore
    nothing may be brought into deduction from the revenues. Debts encumber the considerable estates,
    according to the mortgage certificate and the judicial instrument between only [uncertain: nur] and
    the Oppenheimer, only effectively: 1.) Lichnowsky, which has been transferred to Oppenheimer, 32300
    Rthl; 2.) Meyer Bernhard 5600; 3.) for Glenck the same 20000; 4.) the Invalids'' Fund, which the Jew
    Oppenheimer took over and has not paid, 50000; 5.) costs which the Jew paid, 1400; 6.) to Bernhardi
    likewise 4500; 7. to [uncertain: Eis] Serene Highness by the Fürther bond, that 15000; 8. to sundry
    items, as costs to Your Serene Highness through [illegible] the 20000. Sum 148,800 Rthl. This amounts,
    in yearly interest reckoned at 5 per cent, to 7440. Accordingly Your Serene Highness''s treasury must
    yearly retain 20260.'
- page: 2
  en: '[uncertain: Wir] moreover, a mortgage of 250,000 has been [uncertain: gewöhnet/granted] to the
    Jew Oppenheimer according to the judicial instrument annexed herewith, which sum, with the 50 [uncertain:
    xr] against the Invalids'' Fund, would come to 160000 Rthl [illegible]; but since the Jew has paid
    neither the 50000 [illegible] against the Invalids'' Fund nor a jot of the interest, and then they
    stand upon the 7th [illegible] I do not demand, the 11,200 fall away and to Your Serene Highness''s
    benefit. I have now sued the said Jew on this account, and I hope to finalise the matter while I am
    still here. It is therefore, as [Your] Serene Highness will be pleased to satisfy yourself here, the
    true sum of 148,800 rl. that would have to be discharged. Thereupon the mortgage now registered [uncertain:
    verkämmerte] for 250000 m. is entirely, wholly and altogether free, and all the [uncertain: unschende]
    debts fully followed. The judicially attested mortgage certificates, annexed in copy, do indeed still
    mention at the outset the canons and competences; but these, as said above, the hereditary lessees
    have entirely taken over, and they will never again fall as a burden upon Your Serene Highness. Finally
    I note further that considerable sums must still be paid to Your [uncertain: dem Flauche Eröhn], namely
    marriage-money and hereditary-lease monies which have remained in arrears since the war — unless indeed
    the various plenipotentiaries have already appropriated a part of them to themselves. I for my part
    have levied nothing from thence these 2 years, have seen no man from there, and, for all the many
    messengers sent [uncertain: von die Haaren], have not been able to obtain the least intelligence —
    because she had now entered into correspondence with Your Serene Highness herself, I have, without
    [illegible] words, paid express-courier monies, small capital sums and lawsuit costs, and also considerable
    interest, out of my own pocket, and have had them paid through Professor Rhode; at present, however,
    I am [text lost]. As for the rest, as concerns the Prępiziner estates, these are, according to my
    first conviction, not lost). That I should go to the estates myself I cannot for the present, for
    reasons; but I shall be heard with the French authorities and in all quarters more than Your Serene
    Highness may think. As regards the Kaemener affair, Your Serene Highness has answered just as I did;
    meanwhile it appears to me that'
- page: 3
  en: 'the period for [uncertain: Edictions] fixed in the contract had also plainly expired. In closing
    I must further adduce here that I was on the point of obtaining a capital of 200000 Rthl upon the
    mortgage out of Holland, through a couple of [uncertain: Müller] now staying here. But if Your Serene
    Highness now has closer prospects and certainty of drawing such a capital there, then be pleased to
    write to us at the very earliest, so that I do not put myself to needless costs and vexation here.
    With unbounded veneration and the deepest respect I remain Your Serene Highness''s Berlin, the 3rd
    April 1808 faithful most humble and obedient servant v Triebenfeld'

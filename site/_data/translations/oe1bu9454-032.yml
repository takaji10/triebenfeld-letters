- page: 2
  en: 'We upon is to the Jew Oppenheimer a mortgage of


    250,000 accustomed according to the enclosed judicial instrument, which of the sum, with the 50 kreuzer
    on the Invalids'' Fund of 160000 Rthl would be asked; but since the Jew has paid neither the 50000
    etc. on the Invalids'' Fund nor still less the interest, then they upon the


    7. does not stand claim, and the 11,200 fall away and to Your Serene Highness''s benefit.


    I have now sued his Jew on that account and I hope to finalise the matter yet during my being here.


    It is therefore, as Your Serene Highness may be pleased to satisfy yourself here, the actual sum of
    148,800 Rthl - which would have to be discharged. Thereupon the mortgage now encumbered to the amount
    of 250000 is entirely and altogether free everywhere and all the [uncertain: encumbering] debts wholly
    followed. The judicially attested mortgage certificates enclosed in copy do indeed at the beginning
    still state the canons and competences; but these, as said before, the hereditary lessees have entirely
    taken over and they will never again fall as a burden upon Your Serene Highness. Finally I note further
    that there must still be paid to [illegible] considerable sums, as marriage-settlement and hereditary-lease
    monies which remained in arrears after the war, unless it be that the several general plenipotentiaries
    have already appropriated a part of them to themselves. I for my part have levied nothing from there
    in 2 years, have seen no person from there, and despite many a messenger sent have not been able to
    obtain the least intelligence from [uncertain: the hair] - because they had now placed themselves
    in correspondence with Your Serene Highness yourself; I have, without [illegible] words, paid express-courier
    monies, small sums of capital and legal costs, and also considerable interest, out of my own pocket,
    and have had them paid through Professor Rhode; but at present I am I should like. As for the rest,
    as concerns the Trąbczyn estates, they are, according to my first conviction, not lost) to go upon
    the estates myself I cannot for reasons for the present, but I shall with the French authorities and
    in all places be more heard than Your Serene Highness may think. As concerns the Kaemener affair,
    Your Serene Highness has answered just as I did; however it seems to me that'

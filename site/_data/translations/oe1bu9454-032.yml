- page: 3
  en: 'the period for issuing the edict fixed in the contract had also already expired. In closing I must
    here further adduce that I was on the point of obtaining a capital of 200000 Rthl upon the mortgage
    from Holland, through a couple of Müllers now staying here. But if Your Serene Highness now has nearer
    prospects and certainty there of drawing such a capital, then be pleased to write to us at the very
    earliest, so that I do not put myself here to needless costs and vexation. With unbounded veneration
    and the deepest respect I remain Your Serene Highness''s


    Berlin


    the 3rd of April 1808


    faithful most humble and obedient servant


    v. Triebenfeld'

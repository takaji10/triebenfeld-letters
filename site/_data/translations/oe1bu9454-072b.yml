- page: 3
  en: At present he rages against Hecker, Honrichs and the former tenant of Trąbczyn, Rybbeck, who holds
    the 8 Hufen in Drzewce — He promises not only to dislodge the latter, but also to uncover the hidden
    roguery of the two others. Niedzwiedzki, instead of paying Your Serene Highness 6000 Rthl, made a
    demand for 8000 Rthl — the rogue has lost the suit, he is now wholly dismissed with his claim, and,
    since he has proved and sworn to some 4000 Rthl of war costs, he is to hand over a further 2000 Rthl
    to Your Serene Highness — He threatens to appeal to Warsaw and to drag the matter out. Herr von Brzechsta
    will perhaps show him the door — nothing, however, is to be got from the villain, for he has nothing.
    At present our foremost endeavour is to collect the arrears of interest — Herr von Brzechsta will
    have to be very effective in this, the more so as the old wicked assistant land judge Piekowski, who
    was Your Serene Highness's greatest enemy, has been suspended. This is the chief ringleader in the
    Trąbczyn affair, in which Herr von Brzechsta promises so much good. Up to this hour the wicked man
    has forbidden us all collection of interest and has protected the colonists and seduced them into
    complaints, whereby everything was dragged out and many thousands may well become irrecoverable.

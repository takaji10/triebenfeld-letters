- page: 4
  en: 'The news of the young Princess has grieved me; I wish that she may soon be entirely restored and
    that Your Serene Highness might now at the earliest see your Most Serene Highness''s Lord Sons about
    you. What lies within my powers I shall now [text lost] hastening to come to Schlawenschitz, to see
    the honest father together with his good and exalted sons, and then to show Your Serene Highness the
    dearest reverence, in which I remain, until death, as Your Serene Highness''s [uncertain: called]
    — Your Serene Highness, to send the accompanying letter with all speed by the [uncertain: distant]
    post. War will not be.


    Our quarter of the world now resembles a madhouse.


    Blizanow


    12th March 1872.


    faithful humble and obedient servant

    von Triebenfeld'

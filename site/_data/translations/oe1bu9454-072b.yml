- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    From the enclosed letters of the sub-prefect von Brzechffa and of the district councillor Thiele,
    Your Most Serene Highness will deign to gather that Mr von Brzechffa cannot depart from Warsaw before
    the 15th of this month. Everything is, as I know for certain from his house, prepared for the swiftest
    journey to Sławięcice after his return. As much money as he shall be able to gather together, he will
    bring with him. One thing, however, I fear: that Mr von Brzechffa, for the taking over of the Konin
    sub-prefecture, will have to expend some days'' time beyond his journey. Meanwhile this will be of
    the most beneficial consequences for Your Serene Highness. [uncertain: Mann] has, at the new classification,
    laid 5,897 Rthl upon the Zagórów estates. Mr von Brzechffa has given me his word of honour that he
    would [uncertain: redress] this and would so direct the matter that no more should be given than hitherto.
    His proof of effect is then great, and in this matter everything hangs'

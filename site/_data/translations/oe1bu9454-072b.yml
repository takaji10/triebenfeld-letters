- page: 3
  en: 'Meanwhile he now rages against Hecker, Honrichs and the former Trąbczyn tenant Ribbeck, who holds
    the 8 Hufen in Drzewce — he promises not only to dislodge the latter, but also to uncover the hidden
    knaveries of the two others — Niedźwiecki, instead of paying Your Serene Highness a further 6,000
    Rthl as he ought, made a demand for 8,000 Rthl — the rogue has lost the suit; he is now wholly dismissed
    with his claim, and, since he has proved and sworn to 4,000 Rthl of war costs, is to hand over a further
    2,000 Rthl to Your Serene Highness — he threatens to appeal to Warsaw and to drag the matter out.
    Mr von Brzechffa will perhaps, however, show him the way — meanwhile nothing is to be got from the
    villain, for he has nothing. At present our foremost endeavour is to bring in the arrears of interest
    — Mr von Brzechffa will have to be very effective in this, all the more since the old wicked lower
    land judge Piekarski, who was Your Serene Highness''s greatest enemy, has been suspended. He is the
    chief ringleader in the Trąbczyn affair, in which Mr von Brzechffa [uncertain: promises] so much good.
    Up to this hour the wicked man has forbidden us all collection of interest and has protected the colonists
    and led them into bringing complaints, whereby everything was dragged out and many thousands might
    become irrecoverable.'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    From the enclosed letters of the sub-prefect von Brzechsta and of the district councillor Thiele,
    Your Most Serene Highness will be pleased to gather that Herr von Brzechsta cannot depart from Warsaw
    before the 15th of this month. Everything is, as I know for certain from his household, prepared for
    the swiftest journey to Schlawenschitz upon his return. As much money as he shall be able to drive
    together, he will bring with him. One thing, however, I fear, namely that Herr von Brzechsta will
    have to expend some days'' time, over and above his journey, upon taking over the prefecture of Konin.
    Meanwhile this will be of the most beneficial consequences for Your Serene Highness. The man has,
    in the new classification, cast § 897 Rthl upon the Zagorowo estates. Herr von Brzechsta has given
    me his word of honour that he would redress this and would guide the matter so that no more should
    be given than hitherto. His proof of effectiveness is then great, and in this matter everything hangs'

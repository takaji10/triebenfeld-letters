- page: 2
  en: 'upon him — Zaborowski and Szymanowski have set this in train so knavishly; through a third party
    500 # were demanded for those clean-handed men of business — where was I to get them from? Meanwhile
    I now hope, through the power and friendship of Mr von Brzechffa, [uncertain: ihm ergandt] to gain
    more than a loss than through those cut-purses.


    The Wrąbczyn peasants have as yet lodged no appeal — but they threaten it — meanwhile this does no
    harm; the Tribunal''s decree will certainly be confirmed in Warsaw. It is a matter of some few weeks''
    loss of time — the benefit will then be all the more profitable for Your Serene Highness.


    The Oleśnica matter is [uncertain: ripe for judgment] and will be taken up as soon as Mr von Brzechffa
    returns.


    With Hawich everything is settled — he receives the salary promised him at that time by [uncertain:
    Your] Serene Highness / yet only for a year and a half / at 1,200 Rthl, which Mr von Brzechffa has
    promised to pay out to him; but he must give back the 9 Hufen of land together with all the buildings
    which Hecker, without being empowered thereto, had sold to him, without any compensation whatever
    — he has on that account already come to an agreement with Mr von Brzechffa and appeals no further'

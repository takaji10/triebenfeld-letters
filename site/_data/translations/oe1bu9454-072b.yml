status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! From the enclosed letters of Herr Sub-prefect
    v. Brzechsta and of Kreis-Rath Thiele, Your Most Serene Highness will deign to gather that Herr v.
    Brzechsta cannot depart from Warsaw before the 15th of this month. Everything is, as I know for certain
    from his household, made ready for the swiftest journey to Schlawenschitz upon his return. As much
    money as he shall be able to drive together, he will bring with him. One thing, however, I fear: that
    Herr von Brzechsta will, over and above his journey, have to spend several days upon the taking over
    of the Konin prefecture. Meanwhile this will be of the most beneficial consequences for Your Serene
    Highness. [uncertain: Mann] has, at the new classification, laid § 897 Rthl upon the Zagorow estates.
    Herr von Brzechsta has given me his word of honour that he would set this to rights and would guide
    the matter so that no more should be given than hitherto. His power of effect is then great, and in
    this matter everything hangs'
- page: 2
  en: 'upon him. — Zaborowski and Szimanowski have set this afoot in so knavish a fashion; through a third
    party 500 Th were demanded for those clean-handed men of business — whence was I to take them? Meanwhile
    I now hope, through the power and friendship of Herr v. Brzechsta, [uncertain: ihm ergandt] to gain
    more than a loss, rather than through those cut-purses. The peasants of the Wegbezirn have as yet
    entered no appeal — but they threaten it. Meanwhile this does no harm; the Tribunal''s decree will
    certainly be confirmed in Warsaw. It is a loss of some few weeks'' time — the profit will then be
    all the more abundant for Your Serene Highness. The Olerniger affair is ripe for decision and will
    be taken up as soon as Herr von Brzechsta has returned. With Hawich all is settled — he receives the
    salary formerly promised him by Your Serene Highness (yet only for one and a half years) at 1200 Rthl,
    which Herr v. Brzechsta has promised to pay out to him. He must however give back the 9 Hufen of land
    together with all the buildings which Heiller, without being empowered to do so, had sold to him,
    without any compensation whatsoever. He has on that account already come to terms with Herr v. Brzechsta
    and appeals no further.'
- page: 3
  en: '[uncertain: Jedes] he now rages against Hecker, Honrichs and the former Trąbczin tenant Rybbeck,
    who holds the 8 Hufen in Drzewce. He promises not only to dislodge the latter, but also to uncover
    the hidden knaveries of the two others. Niedzewiecki, instead of paying Your Serene Highness the 6000
    Rthl he owes, made a demand for 8000 Rthl — the knave has lost the suit; he is now wholly dismissed
    with his claim, and, since he has sworn that he has proved 4000 Rthl of war costs, is to give out
    a further 2000 Rthl to Your Serene Highness. He threatens to appeal to Warsaw and to drag the matter
    out. Herr v. Brzechsta will perhaps show him the way. Nothing, however, is to be got from the villain,
    for he has nothing. At present our chief endeavour is to drive in the arrears of interest — Herr v.
    Brzechsta will have to be very effective in this, the more so as the old wicked Land-Unterrichter
    Piekowski, who was Your Serene Highness''s greatest enemy, has been suspended. This is the chief ringleader
    in the Traperin affair, in which Herr v. Brzechsta promises so much good. Up to this hour the wicked
    man has forbidden us all collection of interest and has protected the colonists and seduced them into
    complaints, whereby everything was dragged out and many thousands may well become irrecoverable.'
- page: 4
  en: The news of the young Princess has grieved me; I wish that she may soon be entirely restored, and
    that Your Serene Highness may at the earliest see your Most Serene Lords the sons about you. What
    lies within my powers I shall now, hastening [text lost] to come to Schlawenschitz, in order to see
    the worthy father together with his good and exalted sons, and then to render Your Serene Highness
    the dearest reverence, in which I remain, until death, as Your Serene Highness's — may Your Serene
    Highness deign to send the enclosed letter with all speed by the far post. There will be no war. Our
    quarter of the world now resembles a madhouse. Blizanow, 12th March 1872. faithful humble and obedient
    servant v. Triebenfeld

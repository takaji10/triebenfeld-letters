- page: 4
  en: 'The news of the young Princess has grieved me; I wish that she may soon be fully restored, and
    that Your Serene Highness may now at the earliest see your Most Serene sons about you. What lies within
    my powers I shall now [text lost] to come with haste to Sławięcice, in order to see the [uncertain:
    upright] father together with his good and exalted sons, and then to show Your Serene Highness the
    deepest reverence, in which I remain, until death, as Your Serene Highness may deign [uncertain: Your]
    Serene Highness to send the enclosed letter with speed by the long-distance post. There will be no
    war.


    our quarter of the world now


    resembles a madhouse —


    Blizanów


    12th March 1812.


    faithful humble and obedient servant


    v Triebenfeld'

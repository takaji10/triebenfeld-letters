- page: 2
  en: 'upon him. — Zaborowski and Szimanowski contrived this so roguishly; through a third party 500 Th
    were demanded for those tidy men of business — where was I to have got them from? Meanwhile I now
    hope, through the power and friendship of Herr von Brzechsta, [uncertain: to gain for him] one loss
    more than through those cut-purses. The peasants of Wegbezirn have as yet given notice of no appeal
    — they do, however, threaten it — meanwhile this does no harm; the decree of the tribunal will certainly
    be confirmed in Warsaw. It is a matter of some few weeks'' loss of time — the profit will then be
    all the more abundant for Your Serene Highness.


    The Olerniger affair is [uncertain: matter of established law] and will be taken up as soon as Herr
    von Brzechsta has returned.


    With Hawich everything is settled — He receives the salary promised him at that time by His Serene
    Highness (yet only for a year and a half) amounting to 1200 Rthl, which Herr von Brzechsta has promised
    to pay out to him. He must, however, give back the 9 Hufen of land together with all the buildings
    which Heiller, without being empowered to do so, had sold to him, without any compensation whatsoever
    — On that account he has already come to terms with Herr von Brzechsta and appeals no further'

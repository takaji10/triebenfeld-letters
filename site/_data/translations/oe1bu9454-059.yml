- page: 4
  en: 'Scharnhoritz I do not [uncertain: trust] at all; but his goal may be set near him. Of the Friends
    of Virtue all is now quiet — thinking, upright men, however, fear a grievous explosion from that quarter.


    Opinions are much divided about [uncertain: Russia]''s conduct; it is feared that Russia too is making
    a move against us.


    God grant only good fortune to Archduke Carl. If this Prince now still strikes down the monster of
    the world, then all goes well and we come well out of the [text lost], then it is to be feared that
    Austria the peace [text lost] affair, but if in


    accepts, but appropriates [uncertain: Silesia] and Saxony to itself. Constantine, on the other hand,
    receives all Poland, Prussia, Pomerania and Silesia as far as the Oder as Emperor of the Sarmatians,
    in return for which Alexander is to be guaranteed the European Turkey.


    The Poles will not yet lay themselves to their end — here they recruit, and arm, and still continue
    to do so. Honrichs was here yesterday with Cabanic; if he might export the money, then Your Serene
    Highness would be helped, and I too could quickly save myself. — But they will on no account give
    way, notwithstanding that I handed over the orders of the French General Gniesenau[?]: — They threaten
    to [uncertain: proceed against] him, and he must deliver all the money to Kalisz to the King, to the
    sub-prefect Briechia, for which he has himself produced the receipts. I have written to Brsechwa and
    asked him whether cattle and grain might not be exported for the money — if that is accepted, then
    Honrichs will find counsel enough, bring money instead of it, and know how to produce documents for
    cattle, grain and spirits purchased. As soon as it is in any way possible in the world, and I see
    myself but somewhat rescued, I shall hasten to Your Serene Highness, to remain there for 4 weeks,
    to set much in order, and if need be then to go to Prussia again. The hundred, and I have accepted
    with a contrite heart from Lombardini; I am still to pay the duty for iron and boards to my collector
    here, and there I can carry off nearly the half today as well. In utmost reverence I remain, until
    death,


    Your Most Serene Highness''s


    Kontop


    the 11th of July 1809. most faithfully obedient servant


    von Triebenfeld'

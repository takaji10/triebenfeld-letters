- page: 3
  en: 'believe of me without great protestations. Heaven is my witness that this alone is why I cannot
    leave the spot; for if I go away, then it is believed I am seeking to [illegible] and there is decreed
    at once, without all mercy, the compulsory auction of all my estates. Where then should I turn in
    my old age with my children? To return to Russia, for that I am too old — and my children too stand
    in my way — Believe me, most gracious Lord, I live here more wretchedly than a day-labourer, for my
    credit is destroyed and, said among you all, there are many days on which I have not a Groschen, and
    I have several times gone to bed [uncertain: hungry] so as not to give myself a contradiction — Were
    one allowed air and some forbearance, were I permitted to dispose of my products, then I should find
    counsel, pay all[text lost] and remain a man worth at least 400000 rt. But they wish to annihilate
    us; they wish by mad sequestrations to bring on the compulsory auction of the estates and so overthrow
    every honest, straightforward fellow.


    Enough, the Lord — I fear I have already wearied Your Serene Highness by this. To nobody do I speak
    in this tone, nor let my plaints be heard aloud; I suffer here alone and in silence — In the inheritance
    matter we must take quite other courses, of which more by word of mouth. In Your Serene Highness''s
    own affairs there remains no other way than that Your Most Exalted Self write directly to the King
    — For the rest, I believe it is well that Your Serene Highness has not yet done it, for if the honest
    Major von Pirch is not at Königsberg, then they will seek to twist your business as badly as possible.
    You have in this commission only the 2 true friends, namely Major von Pirch and von Hache. Gneisenau
    I do not trust; he behaves very coldly and is said to have declared that Your Serene Highness had
    never been his friend, and that he wished now to have nothing to do with your business. That Lieutenant
    Colonel von Knesebak is to be taken back into the ranks I do not find very seemly. This man is too
    great a hypochondriac; he demanded his discharge at that time with vehemence, and went off sulking.
    Whoever once goes off in that fashion ought never to come back to me; such capers should be allowed
    to succeed.'

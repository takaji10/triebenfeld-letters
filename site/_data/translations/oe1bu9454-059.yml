- page: 1
  en: '59


    Most Serene Prince


    Most gracious Prince and Lord!


    Since my return from Königsberg I have not had a single quiet hour; sleep and rest have become wholly
    strangers to me, the most gnawing sorrow accompanies me everywhere, and the greatest distress drives
    me to the point of despair.


    Konotop continues under sequestration; I am short here of about 2000 rt. I cannot raise it, and must
    suffer that strangers sit upon my estates, draw my revenues, dispose of them arbitrarily and ruin
    them. On the Świniary estates there is continual execution on account of 2560 rt of interest, and
    on account of the van der Lahr debt. Could I but raise the 2560 rt, I should be free and my credit
    restored — To van der Lahr I have sent 300 hundredweight of iron and 14 Schock of boards, where the
    Schock must measure 1440 Rhenish feet and each board must be 1 1/2 inches thick and 15 inches broad,
    at 60 rt. This comes together to 2570 rt.


    This leech has therefore still 430 rt to receive, and the interest and costs, which may amount to
    300, and then this fellow is entirely satisfied. To this end I shall have to give a further 1[0?]
    Schock of boards and send them to Berlin, in order to see myself rescued from the claws of this usurer.
    The boards are already lying at the water for that purpose, and this famous business will be settled
    within a few days; meanwhile, through the boards, there escape me again 1800 rt in funds, by which
    I might have paid my interest, freed this cursed sequestration here, and become master of my estates
    again. I must yet endure for a time and find other counsel, only God knows'

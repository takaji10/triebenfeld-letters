- page: 2
  en: 'God, how this is to be brought about so quickly, for to sell produce by private treaty is not possible,
    the shortage of money has reached its highest [uncertain: pitch] and increases daily through the exceedingly
    stupid conduct of the Königsberg people. I have 1000 bushels of grain to dispose of; in the vault
    there lie 105 stone of wool. In the forest there stand 2000 cords of wood. This would amount, at middling
    rates, to some 7000 Rthl. But nobody will buy, because in Königsberg they are so bushel-stupid as
    to permit the Poles to bring in all these products among us. It is not reckoned that our money thereby
    goes out of the country, that one thereby puts into the hands of the Poles the means to keep arming
    themselves continuously, and in the end to become dangerous to us again. It is not perceived that
    thereby our estate proprietors are utterly overthrown and ruined.


    I have, in my reports to Königsberg, described from here as well the danger to us and all these evils,
    and have sought to lay this to the King''s heart; but no notice is taken of it, the brood of vipers
    about the King even takes it ill that one tells the truth, and therefore every honest man must fall
    silent and look upon his fate buried in dull pain.


    My sole endeavour is now to obtain the 4560 Rthl, in order to make my estates free, in order to be
    rid of the executions that press upon me. I would gladly give away the produce noted above for two
    thirds of its value, but the sequestration does not permit me to dispose of it until I have paid the
    4560 Rthl; the want of money, too, is so great that no one can take and pay so large a lot at once.
    I must therefore bear this gnawing sorrow yet a while longer and wait upon God''s help. These, however,
    Most Serene Prince and Lord, are the reasons which hinder me from being able to lay myself at Your
    most high feet. That I should long since have hastened to Your Serene Highness, had I been able to
    save myself, Your most high self will surely'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Since my return from Königsberg I have not yet had one quiet hour; sleep and [uncertain: rest] have
    become quite strangers to me, the most gnawing sorrow accompanies me at every turn, and the greatest
    distress drives me to the point of despair.


    Kontop remains continuously under sequestration; I am short here by about 2000 Rthl, I cannot raise
    it, and I must suffer that strangers set themselves in my estates, draw my revenues, dispose over
    them at their own caprice, and ruin them. On the Schweiner estates there is continuous execution on
    account of 2560 Rthl in interest, and on account of the von der Lahr debt. If I could raise the 2560
    Rthl, then I should be free and my credit would be restored. To von der Lahr I have sent 300 [uncertain:
    hundredweight] of iron and 14 score of boards, where the score must hold 1440 feet [uncertain: Behinländisch]
    measure and each board must be 1 1/2 inches thick and 15 inches broad, at 60 Rthl. This comes altogether
    to 2570 Rthl. This leech has thus still 430 Rthl to receive, together with the interest and costs,
    which may amount to 300, and then this fellow is entirely satisfied. For this purpose I shall probably
    have to give a further 10 score of boards and send them to Berlin, in order to see myself rescued
    from the clutches of this usurer. The boards are already lying at the water for this purpose, and
    this notorious business will be settled in a few days; meanwhile, through the boards, I again lose
    1800 Rthl [uncertain: in ready money], by which I could have paid my interest, had the accursed sequestration
    here been lifted, and could have become master of my estates again. I must endure yet a while longer
    and find other counsel; only God knows'

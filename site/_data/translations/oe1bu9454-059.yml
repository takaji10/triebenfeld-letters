- page: 3
  en: 'believe me without great protestations. Heaven is my witness that it is only for this reason that
    I cannot leave the [uncertain: spot]; for if I go away, then it is believed that I am seeking to abscond,
    and the compulsory auction of all my estates is at once decreed without any mercy. Where should I
    then turn, in my old age, with my children? To return to Russia — for that I am too old — and my children
    too stand in my way. Believe me, most gracious Lord, I live here more wretchedly than a day-labourer,
    for my credit is annihilated and, said to you all, I have many a day not a single Groschen, and have
    already several times gone to bed hungry so as not to give myself the lie. Were one allowed air and
    some forbearance, were I permitted to dispose of my produce, then I should find counsel, pay everything,
    and remain a man of at least 400000 Rthl. But they mean to annihilate us; they mean, by mad sequestrations,
    to bring on the compulsory auction of the estates, and so to overthrow every honest, straightforward
    fellow.


    Enough of this, Sir — I fear I have already wearied Your Serene Highness herewith. To nobody do I
    speak in this tone or let my complaints be heard aloud; I suffer here alone and in silence. In the
    matter of the inheritance we must take quite other courses; more of that by word of mouth. In Your
    Serene Highness''s own affairs there remains no other way than that Your most high self write directly
    to the King. — For the rest, I believe it is well that Your Serene Highness has not yet done so, for
    if the [uncertain: worthy] Major von Pirch is not in Königsberg, then they will try to turn your affair
    as badly as possible. You have in this commission only the 2 true friends, namely Major von Pirch
    and von Hache. Greischau I do not trust; he acts very coldly and is said to have said that Your Serene
    Highness had never been his friend, and that he now wished to have nothing to do with your affair.
    That Lieutenant-Colonel von Knesebeck is to be put back into the ranks I do not find at all seemly.
    This man is too great a hypochondriac; he demanded his discharge at that time with vehemence, and
    went off sulking. Whoever once goes off in that manner ought never, in my view, to come back; such
    capers ought [illegible].'

- page: 2
  en: 'God how this is to be brought about quickly, for to sell produce by private treaty is impossible;
    the dearth of money has reached its highest peak and increases daily through the exceedingly stupid
    conduct of the Königsberg people. I have 1000 bushels of grain to dispose of; in the vault there lie
    105 stone of wool. In the forest there stand 2000 cords of wood. At middling rates this would amount
    to some 7000 rt. But no man will buy, because in Königsberg they are bushel-stupid enough to permit
    the Poles to import all these products among us. It is not reckoned that for this our money goes out
    of the country to them, that the Poles are thereby given the means to keep arming themselves continually
    and at last to become dangerous to us again. It is not perceived that by this our estate-owners are
    utterly overthrown and ruined.


    I have depicted the danger which must come upon us and all these evils in my reports to Königsberg,
    and from here as well, and have sought to lay it to the King''s heart; but no heed is paid to it,
    the brood of rats about the King takes it ill into the bargain when one tells the truth, and therefore
    every honest man must fall silent and look upon his fate buried in dull pain.


    My only endeavour now is to obtain the 4560 rt, in order to make my estates free, to be rid of the
    executions that press upon me. I would gladly give up the products mentioned above for 2/3 of their
    value, but the sequestration does not permit me to dispose of them until I have paid the 4560 rt;
    and the want of money is so great that nobody can take and pay for such large lots at once. I must
    therefore bear this gnawing sorrow yet a while longer and wait upon God''s help. These, however, Most
    Serene Prince and Lord, are the grounds which prevent me from being able to lay myself at your most
    exalted feet. That I should long since, had I been able to save myself, have hastened to Your Serene
    Highness, you will surely'

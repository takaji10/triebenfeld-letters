- page: 4
  en: 'Scharnhorst I do not [uncertain: trust] at all; but his end may be set close before him. From the
    Friends of Virtue all is now quiet — but thinking, upright men fear a bad explosion from that quarter.


    Upon Russia''s conduct opinions are much divided; it is feared that Russia too is putting on a mask
    against us.


    God grant only good fortune to Archduke Charles. If this Prince yet now strikes down the monster of
    the world, then all goes well and we come well out of the affair; but if not, then it is to be feared
    that Austria will accept the peace, but appropriate to itself [uncertain: Silesia] and Saxony.


    Constantine on the other hand will obtain all Poland, Prussia, Pomerania and Silesia as far as the
    Oder as Emperor of the Sarmatians, in return for which Alexander is to be guaranteed European Turkey.


    The Poles will not yet lay themselves to rest — here they recruit and arm, the [illegible] still going
    on. Honrichs was here yesterday with Cabanis; were he permitted to take the money out, then Your Serene
    Highness would be helped, and I too could quickly save myself — But it is by no means conceded, notwithstanding
    that I have handed over the orders of the French Governor General — He is threatened with being declared
    insecure, and he must deliver all the money to Kalisz [uncertain: um in König] to the sub-prefect
    Brzechffa, of which he has himself shown the receipts. I have written to Brzechffa and enquired of
    him whether cattle and grain might not be exported for the money — if that is accepted, then Honrichs
    will find counsel enough, bring money in its stead, and know how to produce papers for cattle, grain
    and spirits purchased. As soon as it is in any way possible in the world and I see myself but somewhat
    saved, I shall hasten to Your Serene Highness, to remain there for 4 weeks, to put much in order,
    and in case of need then to go back to [uncertain: Prussia]. The hundred and I have accepted with
    a contrite heart from Lombardini; I am still to pay the duty for iron and boards to my collector here,
    and there I can carry off nearly the half of it today. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Konotop


    11th July 1809. most faithful and obedient servant


    von Triebenfeld'

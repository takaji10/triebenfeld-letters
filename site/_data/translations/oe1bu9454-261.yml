- page: 2
  en: 'and written. Honour, property and life are at stake here - We have to fight a many-headed hydra
    - the [uncertain: Zustel.] Minister will spit fire and Cosmar will call the whole host of hell to
    his aid and will not want to let the roast, once seized, slip from his claws. Spare and save nothing
    there - Take the counsel of Hahn, of Eberhardt, and of every honest man in this matter — everyone
    will now draw near to you when he sees your powerful support, and then people will gladly wish to
    be [uncertain: Witter] in the affair - I would then already see to matters here - A form for the power
    of attorney for the privy councillor von Göschel I send herewith; let Your Serene Highness execute
    it and send it here with the blank forms and the copies. I shall [uncertain: reconsider] the matter
    of handing over the power of attorney - for I did not wish to do it too early, so that Mr von Gärtner
    should take no offence at it — The day after tomorrow I may perhaps be able to report something important
    to Your Serene Highness. It is in boundless veneration that I remain, until death, Your Serene Highness''s


    Vienna


    the 13th of December 1814.


    faithful and most obedient servant


    v. Triebenfeld'

- page: 2
  en: 'and written. Honour, goods, and life are at stake here — we have to fight against a many-headed
    hydra — the [uncertain: Justice] Minister will [uncertain: spit] fire and Cosmar will call the whole
    host of hell to his aid and will not want to let the morsel once seized slip out of his claws. Spare
    and save nothing there — Take the counsel of Hahn, of Eberhard, and of every [uncertain: honest] man
    in this matter — everyone will now draw near to you, when [uncertain: he sees] your powerful support,
    and then people will gladly wish to be made a [uncertain: Knight] in the affair — I should then already
    take care of matters here — A form for the power of attorney for the Privy Councillor von Göschel
    I send herewith; let Your Serene Highness execute it and send it here with the blank forms and the
    copies — I shall then [uncertain: hold back] as regards the delivery of the power of attorney — for
    I did not wish to do it too early, so that Mr von Gärtner should take nothing amiss — Day after tomorrow
    I may perhaps have something important to report to Your Serene Highness. It is in boundless veneration
    that I remain, until death, Your Serene Highness''s


    Vienna


    the 13th of December 1814.


    faithful and most obedient servant


    v Triebenfeld'

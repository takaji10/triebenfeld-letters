- page: 3
  en: 'we are doing badly - for since the matter is going well, the friends also want to eat and drink
    well - Already I am 50 ducats in debt - By the way, as I gather from Your Serene Highness''s letter
    of the 25th of November, that dissolute drummer will have told fine tales there, so as to want to
    travel here with the horses - That was never my will - I wanted the [uncertain: Bestim] only from
    here; yet this letter of mine, which I did not care to give the fellow to carry, will have made the
    matter plain to Your Serene Highness. The Prince Chancellor means most soulfully well by me; as Mr
    von Gärtner has just this moment told me, the Hohenlohe affair stands very well, it is to be particularly
    favoured above all the mediatised houses - I fear for the [uncertain: Jcken] gentleman that he may
    burst with rage, for that would make a frightful [uncertain: Explorien] - I have brought a cruel vexation
    upon him in a [uncertain: Minor], at which he is said to have almost choked with rage -'

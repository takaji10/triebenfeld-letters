- page: 1
  en: '261


    Most Serene Prince


    Most gracious Prince and Lord!


    The firmest assurance has now now also been given concerning the recovery of the Polish estates —
    if compensation is further ordered for what the estates are capable of yielding, then I may count
    my fortune high indeed. I have been ordered to hold a calculation in readiness, and with this I can
    appear at any moment, whenever it is required. This, however, concerns only the Trąbczyn estates;
    the calculation of damages for Kamionna Leixner may afterwards present on his own with his red-eyed
    Jews, for there I wish Your Serene Highness to remain outside the connexion (ex nexu). The f.... Jew
    alone must remain answerable to you, gracious Lord, for the estates usurped in the Kujawy district,
    all the more as I do not yet [uncertain: know] where that corner falls; for if the worst comes to
    the worst, that fine company [uncertain: takes] away the Kamionna estates and lets them be put in
    possession in the Kujawy lands. It all depends on what is registered upon the Kamionna estates, and
    therefore in whose name. In the meanwhile all this will come to light, once the estates have only
    first been handed back to Your Serene Highness — The happy and gratifying news will by now surely
    already be in Your Serene Highness''s hands as I write this. Everything now depends upon Your Serene
    Highness''s declaration and upon the report of the Brzeg Superior Provincial Court. See to it, most
    gracious Lord, that everything be identical in wording with my submission, and so far in agreement
    with it, that I lose nothing here of the confidence bestowed upon me; for then I shall not only at
    once have the 112000 Rthl with which to pay the Curi estate claimants, but Cosmar is thrown out forthwith,
    all the fabricated settlements and codicils are fetched by the devil, and you, my Prince, are once
    again truly the reigning Lord — This, my princely patron, was always a plan and a chief wish of mine
    — Should all this come to fulfilment, as I have set the matters in train, then honour, good fortune,
    and a quiet life free of cares in your old age are assured to you. Only I beg you, most gracious Lord,
    let Hahn work there. In the declarations you are to give, make no compliments, spare nobody, and confirm
    without [uncertain: reservation] what I and the honest Hahn have said'

segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The firmest assurance has now now also been given concerning the recovery of the Polish estates -
    if one should further order compensation for what the estates are able to yield, then I may greatly
    praise my good fortune. A reckoning I have been ordered to hold in readiness, and with this I can
    stand up for the matter at any moment, whenever it is required. This, however, concerns only the Trąbczyn
    estates. The reckoning of damages for Kaemen Leixner may afterwards present on his own with his red-eyed
    Jews, for there I wish Your Serene Highness to remain ex neve. The [uncertain: für zude] alone must
    remain answerable to you, gracious Lord, for the estates he has arrogated to himself in the Kujawy
    district, all the more so since I do not yet know far where that corner falls; for if the worst comes
    to the worst, then that fine company will be so far as to take the Kaemen estates away and let them
    settle themselves in the Kujawy lands. It all depends on what is registered against the Kaemen estates,
    and thus in whose name. In the meantime all this will come out, once Your Serene Highness has only
    first had the estates handed back - The joyful and gratifying news will by now surely already be in
    Your Serene Highness''s hands as I write this. Everything now turns on Your Serene Highness''s declaration
    and on the report of the Higher Land Court at Brieg. See to it, most gracious Lord, that everything
    is identical with my submission and so far in agreement that I forfeit nothing here of the confidence
    bestowed upon me; for then I have not only at once the 112000 Rthl with which to pay the Courland
    parties, but Cosmar is immediately thrown down, all the fabricated settlements and codicils are carried
    off by the devil, and you, my Prince, are once again truly the reigning Lord. This, my princely patron,
    was from the first a plan and a chief wish - if all this comes to pass as I have set the matters in
    train, then honour, fortune, and a quiet, care-free life in old age are assured to you. Only I beg
    you, most gracious Lord, let Hahn work there. In the declarations you are to give, make no compliments,
    spare no one, and confirm without reservation what I and the honest Hahn have said'

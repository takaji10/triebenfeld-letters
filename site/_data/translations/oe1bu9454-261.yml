- page: 3
  en: 'things go badly with us — for since the matter goes well, the friends also want to eat and drink
    well — Already I am 50 # in debt — Apropos, as I gather from Your Serene Highness''s letter of the
    25th of November, the dissolute drummer will there have made a fine [uncertain: uproar] about wishing
    to go here with the horses — That was never my will — I only wanted [text lost] from here, yet Your
    Serene Highness will surely have been shown this letter of mine, which I did not wish to give the
    fellow to carry — "The Prince Chancellor means most kindly by me; Mr von Gärtner has just told me
    that the Hohenlohe affair stands very well, that it is particularly favoured above all the mediatised
    ones — I fear for the fat gentleman, that he may burst with rage, for that would make a frightful
    [uncertain: explosion]. I brought a cruel [uncertain: vexation] upon him in a [uncertain: memoir],
    at which he is said to have nearly choked with fury —"'

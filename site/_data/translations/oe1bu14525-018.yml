- page: 1
  en: We Friedrich Wilhelm, by the Grace of God King of Prussia etc., do hereby make known and declare,
    by virtue of this Our open letter, for Ourselves and Our descendants and successors in the Crown,
    the Electorate and Our remaining lands, that out of the particular friendship and affection We bear
    towards the High-born Prince, Our amicably beloved uncle, Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen,
    and likewise in order to give him a fresh proof of Our Royal gratitude for the distinguished and
  names:
  - de: Friedrich Wilhelm
    en: Friedrich Wilhelm
    kind: person
  - de: Preussen
    en: Prussia
    kind: place
  - de: Friedrich Ludwig
    en: Friedrich Ludwig
    kind: person
  - de: Hohenlohe Ingelfingen
    en: Hohenlohe-Ingelfingen
    kind: place
- page: 2
  en: 'profitable services rendered to Us and Our Royal House, We have found Ourselves moved to make over,
    grant and convey to His Lordship, by inheritance and in full property, the appurtenances belonging
    to the estates of Pszczew, Zagórów and Wieniec already conferred upon him by the instrument of the
    19th of June of this year, namely


    1.) at Pszczew, the settlements of Stołuń, Kuligowo, Szarcz, the bailiwick of Zielomyśl and Silna,
    together with the Hollander holdings'

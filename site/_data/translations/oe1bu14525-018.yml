- page: 11
  en: 'grant dated Berlin, 19 June 1797, and 1 December of the same year, and of the letter of resignation
    of the 29th of March 1802, the title of possession for the reigning Prince, Lord Friedrich Ludwig
    of Hohenlohe-Ingelfingen, over the lordship of Pszczew or Pszczew, has been entered in the mortgage
    book Vol. VII, fol. 1, according to the appended mortgage certificate, by force of the decree of the
    29th of March 1802. Poznań, the 1st of May 1802. Fest.


    Archivist.


    John, engrossing clerk


    The conformity established upon prior collation of the foregoing mortgage certificate dated Poznań,
    1 May 1802, and of the letter of resignation dated Poznań, 29 March 1802, with the originals laid
    before us, as also the authenticity of the remaining documents appended in copy, is hereby certified
    in attestation of faith. Wrocław, the 6th of November 1802. Richter, Government Auditor'

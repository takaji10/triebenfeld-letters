- page: 4
  en: 'by inheritance and in full property.


    We do so likewise hereby and by virtue of this present instrument, out of Royal power and plenitude,
    for Ourselves and Our descendants and successors in the Crown, the Electorate and Our remaining lands,
    in such manner and to this effect: that Our above-mentioned amicably beloved uncle, the reigning Prince
    of Hohenlohe-Ingelfingen, shall from henceforth and for all time have, hold and enjoy for himself
    and his'
  names:
  - de: Betsche
    en: Pszczew
    kind: place
  - de: Zagórów
    en: Zagórów
    kind: place
  - de: Hohenlohe Ingelfingen
    en: Hohenlohe-Ingelfingen
    kind: place
- page: 5
  en: the above-named appurtenances belonging to the estates of Pszczew, Zagórów and Wieniec, with all
    rights and privileges attaching thereto, as these have hitherto been exercised or may lawfully be
    exercised, with all lands thereto belonging, in fields, woods and meadows, and likewise in ponds and
    waters, according to the lawful boundaries and margins, and as everything has hitherto been used or
    may of right be used, from henceforth and for all time, for himself and his
  names:
  - de: Wienietz
    en: Wieniec
    kind: place
  - de: Betsche
    en: Pszczew
    kind: place
  - de: Zagórów
    en: Zagórów
    kind: place
- page: 6
  en: descendants and heirs, as a true, well-acquired and unrestricted property, irrevocably from Us and
    Our descendants and successors, and possess and use the same; and that there shall be vested in him
    the power and authority to dispose thereof at his pleasure under the above-mentioned conditions, without
    hindrance from any man. We therefore command and enjoin all Our Supreme Provincial Boards, as also
    all other authorities
- page: 7
  en: whom this concerns, herewith as graciously as earnestly, that they in no wise hinder or trouble
    either the Lordship of the oft-mentioned Lord Prince of Hohenlohe-Ingelfingen in the hereditary and
    proprietary possession thus granted to him of the above-named appurtenances belonging to the estates
    of Pszczew, Zagórów and Wieniec, nor him or those to whom he may one day, by virtue of this Our letter
    of grant,
  names:
  - de: Hohenlohe Ingelfingen
    en: Hohenlohe-Ingelfingen
    kind: place
  - de: Betsche
    en: Pszczew
    kind: place
  - de: Zagórów
    en: Zagórów
    kind: place
  - de: Wienietz
    en: Wieniec
    kind: place
- page: 8
  en: bequeath the same, or otherwise lawfully transfer it by other acts among the living or on account
    of death; but rather let His Lordship, and eventually also them, enjoy the same freely and undisturbed;
    that they themselves do nothing against it, nor occasion or permit such to be done by others, on pain
    of Our Most High displeasure and of unfailing
- page: 9
  en: 'severe punishment. In witness whereof, under Our own most high hand and the appended Royal seal.
    Thus done and given in Our residence city of Berlin, the first of December after the birth of Christ
    Our Lord, in the one thousand seven hundred and ninety-seventh year, and of Our Royal reign in the
    first year.


    Friedrich Wilhelm


    Hoym. Reck.


    Letter of Grant.


    for the reigning Prince of Hohenlohe-Ingelfingen, as hereditary and proprietary possessor of the appurtenances
    belonging to the estates of Pszczew, Zagórów and Wieniec.'

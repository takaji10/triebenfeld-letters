- page: 10
  en: 'That the foregoing copy, which has been taken for the purpose of the note of intabulation of the
    title of possession of the lordship of Pszczew to be entered thereupon for the reigning Lord Prince
    Friedrich Ludwig of Hohenlohe-Ingelfingen, has upon prior collation been found in every part to agree
    with the original, is hereby attested under the usual signature and greater seal of the Royal South
    Prussian Government. Thus done at Poznań, the 31st of August 1801.


    v. Steudener. (L. S.)


    Certified Copy


    Upon the ground of the letters of'

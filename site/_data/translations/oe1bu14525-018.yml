- page: 3
  en: 'the Pomher Hollander holding and Heydemühle;


    2.) at Zagórów the hamlet of Swięcia; and finally


    3. near Wieniec, Konty, Szedlemin, Bątkowo and Karczyn, against payment


    1.) of the territorial-lordly dues hitherto rendered from the said settlements, Hollander holdings
    and parcels of ground, as a fixed and unalterable canon, and


    2.) of the portion due therefrom to the spiritual corporations and foundations,'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! A grievous illness, such as I have never yet suffered,
    has hindered me from writing to Your Serene Highness sooner – now I am so far restored that I can
    think and act again. The dreadfully great vexation which I must here swallow daily would surely hinder
    me from ever becoming well again. Still no one here pays; there are at present 31 lawsuits pending
    on this account, and now I hope that some may be compelled to payment by execution and distraint,
    and also that the Olesnicer people will be thrown out. In like manner Niedzewiecki is to be cast out
    of Kopoyno and Hawich out of Drzewce, and then 3 demesne farms are again to be established, because
    the Germans not only pay nothing at all but go to the devil. — There are still to be paid some 8657
    Rthl 20 [uncertain: dathen] or taxes and dues, 7500 Rthl interest to the Invalids'' Fund, and out
    of 27000 Rthl other interest and costs — [uncertain: hardly] shall I take in so much as to [uncertain:
    settle] this. According to the new edicts every [uncertain: colonist] drawn into the country is to
    receive 6 free years, and upon this the people now rely — Meanwhile all this must be, between now
    and NB the podacken were otherwise discharged in order to preserve the estates, but for the interest
    which I have guaranteed to pay they sequester the whole of my own estates – how am I to live thereby,
    and whence are 34000 M to be paid?'
- page: 2
  en: 'settled by Easter, if the estates are not to be lost. I have promised the colonists that if for
    3 years [uncertain: they pay] the half punctually, I would obtain for them a remission of the interest;
    but the [uncertain: Böserichter] still refuse. Your Serene Highness would have gained after 1 1/2
    years, and money would nevertheless have come in. All was already well disposed, but the newer declaration
    of King Napoleon, that the people shall have so many free years that they are to pay the sums owing
    to Prussia over 40 years in such manner that of the capital only 3½ [uncertain: per cent] interest
    and 2½ per cent toward the amortisation of the capital need be paid, has afresh confused all heads,
    so that for the present nothing good is to be hoped — even the Trąbczyner affair lies still. Prince
    Poniatowski has written in secret to the Tribunal not to take cognisance of the matter at all, but
    rather, if the Tribunal may not adjudge the estates to the Dąbska, to refer the matter to the higher
    magistracy — this latter the Tribunal has done, after the bitterest debates. The higher magistracy
    is now the King of [text lost] and Napoleon — the estates are, by the Peace of Tilsit,'
- page: 3
  en: 'fallen to [uncertain: Your Serene Highness], and must absolutely be restored to you. Salz is now
    working the matter up. The subjects all wish to have Your Serene Highness for their lord; the old
    Hauländer offer at once to lay down 40000 Rthl upon the contract concluded with them, and therefore
    I am above all doing everything to get the estates back. The valuation of the Zagorower estates I
    shall transmit to Your Serene Highness as soon as I can work again. It comes to 22140 Rthl of yearly
    yield; but this can only be reckoned from Midsummer, and when all arrears are paid and all interference
    of the government has been lifted. The deficit arises from the lesser interest, for there I reckon
    back one third in the first 6 years. By my calculation the interest, according to the amortisation
    quantum, amounts yearly to 1000 Rthl taxes, and salaries circa 4000 Rthl, 15000 revenues, 22140; there
    remain to Your Serene Highness 7140. Meanwhile, after some years, through the absorption of the capital,
    5000 Rthl come in again, [text lost] likewise the 1/3 of interest with 4250 Rthl. Then the yield will
    be 16390 Rthl. The 7140 Rthl can, however, as said, only be reckoned from Midsummer.'
- page: 4
  en: 'What may be saved out of the arrears of interest and the entry-monies I cannot yet determine –
    that will first be ascertained by a district commission. I shall do what is only possible. For the
    rest it goes sadly with me: I am ill, lie here in a peasant''s hut and freeze, and in Silesia they
    have sequestrated my [uncertain: Schwemmern], because I am here. The vexation will yet bring me my
    death, and the [uncertain: Fürsten Suhken] will live. May the new year be no worse for Your Serene
    Highness than the old; in deepest respect I remain, until death, Your Most Serene Highness''s Swiątniki,
    the 1st of January 1811, humble and obedient servant v Triebenfeld'

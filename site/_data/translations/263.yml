status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Austria''s capital mourns the swift departure
    of the Württemberg monarch. Under the name of a Count v Teck he quitted Vienna yesterday morning in
    the [uncertain: strictest] incognito — Generous and with a truly royal pride, this man-loving King,
    some days before his departure, distributed 4000 ducats with his own hand among the Imperial [uncertain:
    household servants] — Theatre princesses at the Casperle, whom nature had endowed with plump parts
    of the hinder body, enjoyed distinguished benefactions from this Majesty behind the wings — and accompanied
    by many thousand blessings and good wishes from this class of persons he set out yesterday on the
    [uncertain: journey] into his own states. The Crown Prince, Winzingerode, and Linden, the two latter
    furnished with powers of attorney from him, are here and will remain here until the end of the Congress.
    The Privy Councillor Göschel today submits yet another note to the Congress in Your Serene Highness''s
    name. Now to the principal matter. — From Your Serene Highness''s letter of the 17th, which I received
    yesterday evening, I see that you have furnished the Court Councillor Hahn and Lombardini with powers
    of attorney and sent them to Brieg — This has given me joy, for both are honest men, and one in particular,
    together with Eberhardt, may bring about something good in the matter of satisfying the Curish heirs
    in accordance with my last proposal. Meanwhile I fear that no error may prevail here — the Prince
    Chancellor wishes that Your Serene Highness should be examined in person, and that you should confirm
    and make good all that I and Hahn have stated in the submissions. To that end the Prince ordered that
    Your Serene Highness be summoned to Brieg,'
- page: 2
  en: 'or that a Commissarius should be deputed to Your Serene Highness at Schlawenschitz, who is to hear
    everything from you, take everything ad protocollum, investigate, and transmit all the proofs by way
    of a report to the Prince Chancellor. Meanwhile I hope that the [uncertain: Barieg] O.C. Court will
    not [illegible] the error but will otherwise treat the matter according to the Prince''s prescription
    and will — If the report turns out even halfway favourable, then all your affairs are ordered in the
    most desirable manner — As regards Poland, everything still rests, and this business will only be
    made public at the close of the Congress and upon the publication of the whole. Otherwise, as the
    enclosure also shows, all goes well, and it has the appearance as though Your Serene Highness, freed
    of all care, shall live happily and at ease in your old age — God grant you, most gracious Prince
    and Lord, to begin this coming New Year so, and thereafter to live on contented a long series of years
    yet; this is the sum of my wishes, which however [uncertain: could] from the most faithful heart.
    To Your Serene Highness''s good favour I commend myself, in the old way as in my own years, and I
    remain, until death, most reverently, Your Serene Highness''s, Vienna, the 28th December 1814, faithful,
    humble and obedient servant v Triebenfeld'

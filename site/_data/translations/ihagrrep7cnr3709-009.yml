  en: 'To the South Prussian Government at Warsaw.


    13th: all by post, and with the contents: md Bamg[text lost]t


    11th Schroener


    10 Dec. Friedrich Wilhelm, King, etc. Our, etc. A lawsuit is pending before the Poznań Government
    between the guardian of the minor Michaelina von Prusimska and the Prince of Hohenlohe-Ingelfingen,
    directed to the recovery of the Brzyce estates. Since the suit of the guardian of von Prusimska'

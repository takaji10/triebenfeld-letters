- page: 2
  en: 'was brought at the instance of the guardianship board there, and the lawsuit itself has been conducted,
    and will continue to be conducted, under its direction, but most of the councillors of the Poznań
    Government are members of the said board, We have resolved that the said case shall be decided in
    the first instance by the full bench of your court; which, and that the Government at Poznań


    of this


    has been informed, We hereby make known to you for your observance.


    And are, etc. Berlin, 7 December 1800. By command.


    # # #'

segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord. My late brother, the Royal Prussian Major Johann Friedrich
    von Seehausen, whose sole heir I am, lent to the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen,
    and obligation of 26 March 1803, a capital of 5000 Rthl [uncertain: Caier]:; the debtor pledged to
    him his estate Szetlewek in the district of Konin and bound himself to satisfy him in another


    [Written by the receiving office:]


    No. 3997. B. received 13 May 1816. received 1 May 1816


    No. 4705.


    To be struck off in the bureau journal. To be entered in the journal of the Section. Assigned to:
    Councillor of Legation Balan. To be appended: the report which Mr von Zerboni has rendered on the
    estates of the Prince of Hohenlohe situated in the Duchy of Warsaw. 2 May


    to be laid before Mr [illegible] von Jordan.


    Szetlewek is an estate belonging to Trąbczyn. According to the report of Mr von Zerboni, the Prince
    has let them deteriorate and loaded them with debts. If therefore His Majesty the Russian Emperor
    should be pleased to [uncertain: h] declare himself inclined to a compensation, this must accrue not
    to the Prince but to the creditors registered against the estates.


    St[ä]g[e]m[ann]


    7 May 16'

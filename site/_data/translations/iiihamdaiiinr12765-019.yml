- page: 3
  en: 'the Prince; apart from this capital I possess no property and live merely on a small pension of
    120 Rthl. I therefore most humbly beg Your Serene Highness most graciously to intercede on my behalf
    with high favour, that I may [uncertain: obtain] my satisfaction in capital and interest out of the
    Prince''s remaining property.


    With the greatest respect I remain Your Serene Highness''s


    Sommerfeld


    26 April 1816. most humbly


    the widowed Colonel''s wife


    von Brehmer.'

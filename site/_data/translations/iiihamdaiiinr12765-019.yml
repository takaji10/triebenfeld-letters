- page: 2
  en: manner, should he not obtain his full satisfaction out of this estate. So long as the Prince was
    in possession of the mortgage, he paid neither capital nor interest, and after the cession of the
    province of South Prussia the estate Szetlewek was taken from him again by the decision of the governing
    Commission, dated Beschr. 21 July 1807, and returned to the heiress of the former owner, Michaline
    Prusimska, married von Dąbska. I have no prospect of being paid out of this estate, and am also not
    in a position to pursue my rights against

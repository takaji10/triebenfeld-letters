  en: '275


    Most Serene Prince


    Most gracious Lord!


    Still the Privy Councillor of State Stägemann has not been able to make any report to the Prince Chancellor
    of State. God knows whether the fault lies with the former or the latter. Reminders are not wanting
    — but always one pleads the frightfully heavy press of business that prevented it — I am coming by
    degrees to hold it ill will — and the decision would go in Cosmar''s favour, were the Brzeg report
    not all too favourable for Your Serene Highness — one also fears Bar: and Beg[uelin]: — I must still
    keep to my room and my bed — and therefore I can only act through my friends — that the Prince meanwhile
    means well by Your Serene Highness, as by all the Hohenlohe houses, I was assured again only yesterday,
    and this very day something further goes off to the King of Württemberg in favour of the said houses
    — the enclosure will also show Your Serene Highness what has been done — Now my greatest care is to
    submit the files and documents to the Commission in the matter of Trąbczyn, Kolno and Kamionna — I
    cannot get the files back from the translator with the translation. He will be paid, and I have no
    money — It is necessary that this be sent here quickly, and likewise the Blanquets that were offered.
    My illness is persistently bad. — But shame and vexation consume me, and will in the end wear me away
    entirely — General news there is of many kinds that does not admit of being written; the weather is
    clouding over again, and the barometer points to storm; the Süchser is all at once minded to become
    an 8-Groschen piece again — How Russia and England mean it — O woe, I can write no more today than
    that in deep respect I remain Your Serene Highness''s


    send Your Serene Highness at least some money in advance, for otherwise everything lies untouched
    — wholly most obedient servant


    Vienna, the 28th of February


    1815


    v Triebenfeld'

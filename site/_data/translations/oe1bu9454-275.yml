segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Still the Privy Councillor of State Stägemann has not been able to draw up any contract for the Prince
    State Chancellor. God knows whether the fault lies with the former or the latter. There is no lack
    of reminders — but always one pleads the frightfully numerous labours which have hindered it. — I
    am gradually taking it for ill will — and the decision would be given in Cosmar''s favour, were the
    Brieg report not all too favourable for Your Serene Highness — also one fears Bar: and Beng: — I must
    still keep to my room and bed — and therefore I can only work through my friends; that meanwhile the
    Prince is well disposed towards Your Serene Highness, as towards all the Hohenlohe houses, I was assured
    again only yesterday, and even today something further goes off in favour of the said houses to the
    King of Württemberg — the enclosure will also show Your Serene Highness what has been done.


    [uncertain: Jagt] my greatest concern is to submit the files and documents to the Commission concerning
    Trąbczyn, Kulm and Kaemen — I cannot get the files back from the translator together with the translation.
    He wants to be paid and I have no money. — It is necessary that this be sent here quickly, as also
    the blank forms that were offered. My illness is persistently bad. — Shame and vexation, however,
    consume me and in the end wear me out entirely. Of general news there is much of various kinds which
    cannot be written; the weather is clouding over again, and the barometer points to storm; the Saxon
    wants all at once to become an 8-Groschen piece again. How Russia and England are minded — O woe,
    I can write no more today than that in deepest respect I remain Your Serene Highness''s


    send on ahead, Your Serene Highness, if only a little money, for otherwise everything remains at a
    standstill, most obedient servant


    Vienna, the 28th of February


    1815


    v. Triebenfeld'

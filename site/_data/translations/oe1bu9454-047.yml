- page: 5
  en: 'grow too high, the more so since all others would follow this example, and His Most Serene Highness
    would never receive interest.


    As concerns for the rest my journey to Schlawenschitz, I burn with eagerness to lay myself personally
    at His Serene Highness''s feet; but obstacles which I cannot possibly remove at once do not permit
    me to depart hence any sooner than until I am in some measure clear with my affairs - A misfortune
    which befell me at Berlin through no fault of my own had the consequence that I had to sit there a
    whole year and even to endure arrest. The devastating war consumed all my revenues, I could draw nothing
    from here and had to contract debts; my creditors awoke and my Kontop estates were sequestrated; even
    now I must suffer the sequestration on that account and look upon my own property with my back turned.
    I am very [uncertain: unhappy] and cannot get away any sooner than until I am clear with my creditors.


    With the most perfect esteem I am Your Honour''s


    wholly most devoted friend and servant


    v. Triebenfeld'

- page: 2
  en: 'it seems rather to be a precautionary measure of the curators. Meanwhile these men are not to be
    blamed, [uncertain: since] they do their duty, and they might well be assured on the part of His Most
    Serene Highness that His Highness will likewise exert himself in the matter and will see to it that
    the Invalids'' Fund shall always receive its interest promptly, and also that in case it should be
    sought, in error, to collect it on the part of the King of Saxony, His Highness would exert himself
    in the matter so far as possible. For the rest, the Invalids'' Fund has the first mortgage upon the
    estates in question, must take precedence of all other creditors, and may not and cannot be endangered;
    nor would His Serene Highness pay interest, still less capital, to anyone more willingly than to the
    Invalids'' Fund, the more so as the Indian banker Oppenheimer has not kept his word given before the
    court as to the full satisfaction of the Invalids'' Fund, and on which account a suit has already
    been [uncertain: instituted] these several months in Berlin and just now in Kalisz.


    As concerns 2. the claim of the Meyer on account of buildings, that is as foreign to me as optics
    to a man born blind; I would indeed be willing to swear that the Meyer is sooner indebted to His Serene
    Highness than His Serene Highness to him, for so far as I know this person has never been in His Serene
    Highness''s service, but has merely resided upon the estate of the Honourable Building Councillor
    Glenck.


    As to what the Meyer says of Giese and consorts, the needful has been set in motion against the fellows,
    and it is pending on account of 25,000 M. But it is a gross state of affairs


    the boys owe the remainder of the suit.'

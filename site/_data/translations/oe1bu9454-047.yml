status: draft
segments:
- page: 1
  en: '47


    Your Honour,


    Most particularly highly honoured Court Councillor!


    These last days I have had the justice-burgomaster Hawich and the inspector Hecker from Zagórów here
    with me, and have made report of everything to His Most Serene Highness by an express courier. As
    for the 4 matters most kindly communicated to me in the meantime, I answer most devotedly thereupon
    that


    1. the General Moratorium granted by the King of Saxony protects those estates for 3 years from all
    pressure, if only the interest be duly paid — And to settle this I have bound the people there upon
    their souls. I am also certain that the same has already been settled by this time, for as Hawich
    reported to me, Honrichs, who had himself created sequestrator, had already some weeks ago delivered
    over the monies to the authority for further transmission — The 50,000 Rthl which at that time the
    Invalids'' Fund [text lost] of His Most Serene Highness are entered as attaching to the estates, and,
    as said before, nothing further is required than that the interest be paid. So far as it is a matter
    of adhering, no one disputes these monies with the Invalids'' Fund, from either the one side or the
    other, for even the French General Government ordered me to pay back the advanced interest which,
    by an error, had been exacted from me by military execution and arrest as the Serene Highness''s mandatary,
    because this item of debt belongs to the Invalids'' Fund. Nor do I believe that the Invalids'' Fund
    has been threatened that this capital will ever be disputed with it on the part of the King of Saxony,
    still less of the French.'
- page: 2
  en: 'it seems rather to be a precautionary measure of the curators. Meanwhile the men are not to be
    blamed [uncertain: if] they do their duty, and they might well be assured on the part of His Most
    Serene Highness that His Highness would himself intervene in the matter and see to it that the Invalids''
    Fund should always receive its interest promptly, and also that, in case it should be wished to collect
    it in error on the part of the King of Saxony, His Highness would intervene for it as far as possible.
    For the rest, [I said that] the Invalids'' Fund has the first mortgage on the estates in question,
    must take precedence of all other creditors, and may not or cannot be endangered; also that His Serene
    Highness would willingly pay interest, still less capital, to no one but the Invalids'' Fund, the
    more so as the Jewish banker Oppenheimer has not kept his word given before the court concerning the
    full satisfaction of the Invalids'' Fund, and that on that account a lawsuit has already been commenced
    some months since in Berlin and just now in Kalisz.


    As concerns, 2nd, Meyer''s claim on account of buildings, this is as foreign to me as optics to a
    man born blind; I would also readily swear upon it that Meyer is sooner in debt to His Serene Highness
    than His Serene Highness to him, for so far as I know this man was never in the service of His Serene
    Highness, but merely resided on the estate of the building councillor Glenck.


    As for what Meyer says of Giese and consorts, the necessary steps have been taken against the fellows,
    and the lawsuit is pending over the 25,000 Rthl which the rogues owe in arrears. But it is a gross
    state of affairs'
- page: 3
  en: 'that the fellows are said not to have received all the lands which were promised them in the contract
    — the matter stands, as said before, already 4 years in litigation. [uncertain: Royally] the swindlers
    wished to hide themselves behind the protective shield, and the lands have been re-measured by 2 sworn
    surveyors, and the matter awaited its course — As to the wood in which the Oleśnica people are to
    cut timber, that is to be laid to the charge of these devils; if in the course of the war acts of
    violence were committed thereon through the sequestration, then the Oleśnica people may hold to the
    sequestrator, according to their contract, and thus His Serene Highness is not bound in any case to
    grant a remission.


    As concerns the matter of von Niedźwiecki, a lawsuit is pending on that account, and certainly everything
    has been set in train by the [uncertain: Zürich] servant that is required for the fullest possible
    covering of His Serene Highness; that this wretched man moreover wishes to procure revenues out of
    the estates is a piece of braggadocio, for so long as the sequestration lasts no one can take a farthing
    thence without its consent. Nor are all the arrears of interest yet deposited; once so much has been
    collected / upon which Hawich will now surely insist / then the sequestration ceases at once and the
    matter comes back into its track — the saddest thing is that everyone complains of the war and the
    bad times and no one pays — the nobleman and the townsman, on the other hand, now hide themselves
    behind the Moratorium granted for 3 years / which of course also comes very much to His Serene Highness''s
    advantage / but the coffers remain empty thereby — Meyer, however, is to be told that, according to
    the answer of von Triebenfeld, Meyer never stood in the service of His Serene Highness, that His Serene
    Highness owed him nothing, and that no use could be made of his offer to procure monies out of the
    estates, because according to the laws no one may draw monies out of estates which are placed under
    sequestration'
- page: 4
  en: 'are said to be, without the knowledge of the curator or sequestrator.


    As concerns, finally, the petition of the Augustinow and other colonists, nothing further is to be
    entered into upon it than to refuse these people in their request in such manner: that they are bound
    under their hereditary lease contracts to pay the interest without regard to any remission whatever.
    For moreover no judgment is in force that either Dąbska or any other person had a right to displace
    them from their lands; that the times are bad and the war has brought great distress cannot be denied,
    but since their contracts all comprised every fortuitous case within them, and it is expressly said
    therein that this does not shield them from their dues and burdens, His Serene Highness could, however
    near it went to his heart, give them a compliant answer to their request, inasmuch as His Serene Highness
    is himself pressed by his creditors and compelled to pay the interest. This is very necessary, to
    keep these people off one''s body as much as possible, for if one is granted it they all come; I am
    stormed enough by these people, indeed no post day passes on which I do not have to pay several Thaler
    for packets of letters full of [uncertain: nonsense]. And since these colonies near Drzewce have over
    6,000 Rthl to pay to all these [uncertain: Johannischen], the debt would in consequence'
  numbers:
  - '6000'
  - '3'
- page: 5
  en: 'grow too high, the more so since all the others would follow this example, and His Most Serene
    Highness would never receive interest.


    As regards, for the rest, my journey to Sławięcice, I burn with eagerness to lay myself personally
    at His Serene Highness''s feet; but hindrances, which I cannot possibly remove at once, do not permit
    me to depart from here any sooner, until I am in some measure clear in my affairs — A misfortune which
    befell me at Berlin through no fault of my own had the consequence that I had to sit there a whole
    year and even endure arrest. The devastating war consumed all my revenues, I could draw nothing from
    here and had to incur debts, my creditors awoke and my Konotop estates were sequestrated; even now
    I must endure the sequestration on that account and look upon my property with my back turned. I am
    very impatient and cannot get away any sooner than when I am clear with my creditors.


    With the most perfect esteem I am Your Honour''s


    wholly most devoted friend and servant


    v Triebenfeld'

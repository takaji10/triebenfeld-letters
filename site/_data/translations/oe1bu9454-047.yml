- page: 4
  en: 'were placed, without the foreknowledge of the curator or sequestrator.


    As concerns finally the petition of the Augustinower and other colonists, nothing further is to be
    entered into upon it than to dismiss these people with their request in such manner that they are
    bound under their hereditary lease contracts to pay the interest without regard to any remission whatsoever.
    For there still prevails no judgment that either the aforesaid Dombcha or any other person had a right
    to displace them from their lands; that the times are bad and the war has brought great distress cannot
    be denied, but since their contracts all comprise every fortuitous case (casus fortuitus), and it
    is expressly said therein that this does not shield them from their dues and burdens, His Serene Highness
    could, however near it went to his heart, give them a favourable answer to their request, inasmuch
    as His Serene Highness was himself pressed by his creditors and compelled to pay the interest. It
    is very necessary to keep these people as far off one''s body as possible, for if one grants it to
    one of them they all come; I am beleaguered enough by these people - indeed no post day passes on
    which I do not have to pay several thaler for packets of letters full of [uncertain: complaints].
    And since these colonies at Drevic have over 6,000 Rthl to pay to all these Johannische, the debt
    would in consequence'

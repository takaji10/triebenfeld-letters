- page: 3
  en: 'that the fellows are said not to have received all the lands which were promised them in the contract
    - the matter has, as aforesaid, already stood in suit these 4 years. The deceivers wished to hide
    themselves behind the protection of the [uncertain: Royal] defence, and the lands have been measured
    out by 2 sworn surveyors, and the matter set in motion - As to the wood in which the [uncertain: petitioners]
    are to cut timber, that has been allotted to these devils; if during the course of the war acts of
    violence were committed thereupon through the sequestration, then the [uncertain: Olerwiger] may hold
    to the sequestrator according to their contract, and His Serene Highness is in no case bound to grant
    a remission.


    As concerns von Viedrenricht''s affair, a suit is pending thereon, and certainly everything has been
    set afoot by the [uncertain: Zürich] servant that is required for the best possible cover of His Serene
    Highness; that moreover this wretched person wishes to procure revenues out of the estates is a piece
    of braggadocio, for so long as the sequestration lasts no one can take a heller from it without its
    consent. Nor are all the arrears of interest yet deposited; once so much is levied in / upon which
    Hawich will now surely insist / then the sequestration ceases forthwith and the matter comes back
    into its track. The saddest thing is that everyone complains of the war and the bad times and no one
    pays - the nobleman and the burgher, on the other hand, now hide themselves behind the moratorium
    granted for 3 years (which of course also stands His Serene Highness in very good stead), but the
    coffers remain empty thereby. The Meyer would meanwhile be to be told that, according to the answer
    of the said von Triebenfeld, the Meyer never stood in His Serene Highness''s service, that His Serene
    Highness owed him nothing, and that no use could be made of his offer to procure monies out of the
    estates, because by the laws no one may draw monies out of estates which are placed under sequestration'

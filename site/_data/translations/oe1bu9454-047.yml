segments:
- page: 1
  en: 'Your Honour,


    Most particularly highly honoured Court Councillor!


    These past days I have had the justice-burgomaster Hawich and the inspector Hecker from Zagorowo here
    with me, and have rendered report on everything to His Most Serene Highness by an express. As concerns
    meanwhile the 4 matters most kindly communicated to me, I most submissively reply thereto that 1.
    the general moratorium granted by the King of Saxony protects those estates for 3 years from all pressure,
    provided only that the interest be duly paid - And to settle this I have laid it upon the souls of
    the people there. I am also certain that the same has already been settled by this time, for as the


    Honourable Mr. Hawich reported to me, Hönnricht, who had had himself created sequestrator, had already
    some weeks ago delivered up the monies to the authority for onward transmission. The 50,000 Rthl which
    at that time the Invalids'' Fund [uncertain: lich] to His Most Serene Highness are registered as belonging
    upon the estates, and require, as aforesaid, nothing further than that the interest be paid. So far
    as it goes, no one disputes these monies to the Invalids'' Fund from either the one side or the other,
    for even the French general government ordered me to repay the advanced interest, which had been levied
    from me in error by military execution and arrest, as His Serene Highness''s mandatary, because this
    item of debt belongs to the Invalids'' Fund. Nor do I believe that the Invalids'' Fund has been threatened
    that this capital would ever be disputed to it on the part of the King of Saxony, still less of the
    French.'

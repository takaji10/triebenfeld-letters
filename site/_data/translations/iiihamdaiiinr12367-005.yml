  en: 'Warsaw, 29 September 1830


    Ad No. 102


    Consul [Schmidt],


    I hastened to bring to the knowledge of the Prince Minister of Finance your communication of 26 July
    last, No. 1648, concerning the suit pending before the tribunals of the Kingdom between Madame Miączyńska
    and her creditors on account of the debts contracted by Prince Hohenlohe.


    In addition, in accordance with your wishes, I reminded the said Prince Minister of the claim which
    the banker Weigel raises against the fisc of the Kingdom on account of the judgments which dismissed
    him from a claim belonging to this category.


    You will convince yourself, Consul, by reading the two papers annexed, that your communications have
    brought about the measures which the state of these affairs required, and that your communication
    of 26 July last has rendered the Polish administration a signal service by warning it in time to guard
    itself against the unfavourable chance of the suits mentioned above.


    Pray accept the testimony of the distinguished consideration with which I have the honour to be


    Consul,


    Your most humble and most obedient servant'

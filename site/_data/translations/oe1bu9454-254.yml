- page: 2
  en: 'to bring about.


    You must get your Polish estates back again; by that you will get air and throw off Leixner and the
    S. Jew Meyer Bernhard.


    2. The Courland debt will be extinguished, whereby you will be free of 461000 Rthl of debt and the
    King will see you justified. 3. You will be [uncertain: Cosmar] and will stand again as lord in all
    your estates, covered with [uncertain: renown] and honour.


    4. The Monarch will have to do you justice, and to indemnify you for all your sufferings, and even
    to remove every blemish from your honour; 5. You will no longer have to be the mockery of men, still
    less live on the charity of your children.


    6. You will come out of the Koschentin bonds,


    and that in the most advantageous and most honourable manner. All this I am bringing about here this
    time; so it would be more than cruel if you were for that to let me suffer want, [uncertain: dissemble],
    and become the mockery of men - This would already have happened, I should have had to withdraw like
    a scoundrel, had not the upright


    Barbe helped me out so fraternally. Six hundred thaler, or 200 Rthl, I must by main force have here
    within a fortnight at the very latest, over and above the 100 Rthl which are said to be on the way,
    for otherwise the whole machine stands still - Your distress there cannot now be so pressing - Tread
    now upon your leeches there, they will yield something up, for they, B - , will surely see, after
    the appointed investigation, that it is no longer a [uncertain: sheep] and an empty noise, and also
    that their idol''s reign will now be at an end. Believe, most gracious Lord, that I would far sooner
    take an emetic than torment you for money — But I cannot do otherwise if I am to go on working with
    these men. What I ask is only for my subsistence. As to clothing I remain always a [uncertain: sluggard],
    and therefore I have as yet seen very few people.'

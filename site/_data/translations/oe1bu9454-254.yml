- page: 6
  en: '254 c) May it please Your Serene Highness to send two hundred rt to my daughter, so that she does
    not perish of hunger. — I beg this most earnestly, for nothing comes out of Poland, everything is
    blocked there — and from here I can send nothing, for I myself live here on credit — Should you not
    be willing to effect it quickly, then have, most gracious Lord, the single kindness to let me know
    it in the [uncertain: most spirited] manner, so that I may hasten home and find counsel — the reproaches
    of my children / whom I really do totally neglect for the sake of your affairs / cut my heart in two
    — unwillingly do I live without calculation — I reckoned at once that I should not [uncertain: travel]
    for under 1,400 Rthl. — The money that I was to send my children for September and for October, the
    devil carried off on the journey from Międzyrzecz and Sławięcice etc.; I certainly believed I should
    find with Your Serene Highness what I had written for, unhappily it was 1,000 Rthl less; with 400
    Rthl I went here, 240 Rthl you have sent after, and on that I am to live — here, where the meanest
    secretary receives 100 # a week in allowance — 2 months I have been here — 100 # I have already borrowed,
    and there my children go in want — How is this to end, and how am I to [uncertain: get] away from
    here? I do everything for you — I make myself many enemies for your sake and shrink from nothing to
    tear you, my Prince, out of every labyrinth, and for that you let me and my children suffer the most
    [uncertain: dancklichste] want — Have mercy and [uncertain: send] my children 200 Rthl, that I may
    only be freed from the anxiety — thereafter see to it that I get at least 100 # here, since we shall
    certainly remain here another 4 weeks, so that I may pay the most pressing debt and travel back unencumbered
    — Your wishes are all succeeding now through my restless efforts — do not for that let me and my children
    perish of hunger —


    v Triebenfeld'

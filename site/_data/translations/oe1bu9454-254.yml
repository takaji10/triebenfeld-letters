- page: 6
  en: 'All amusements and all the mighty processions I know only by report of the day; I cannot therefore
    reproach myself with having squandered the monies demanded, or applied them otherwise than in your
    interest.


    For the rest, I beg Your Serene Highness to let the letters to be sent to me go entirely under the
    address of the Royal Prussian Chief Postal Director Mr. Mann in Vienna; that is to say, the letter
    to me is duly sealed and provided with the address, and then an outer cover is made and the full address
    made out to the Chief Postal Director Marne — This is an easy trouble and the letters go more surely
    and more swiftly, especially if you send the same to Neisse to the post twice every week. For from
    here the [uncertain: Prin] post goes twice weekly to Breslau and arrives twice. You can indeed have
    my horses used for it – now alone it counts, most gracious Prince; now one must stir oneself and spare
    nothing — where are the blank forms, where is the letter to the Prince, where do the 100 tt lie? By
    God, I sit here and could despair, because I am without any news whatever from Your Serene Highness
    - this need not be so if you always gave the letters to Neisse by the Prussian post and under the
    above address — Meanwhile I will endure all sufferings if only a good report comes in from the Brieg
    Higher Land Court; do you see to that there in the best manner. Of the Koschentin sale Your Serene
    Highness should say nothing to anybody too soon, for if the creditors scent a rich purchaser they
    will be willing to let little fall from the capital; this must be settled just as we [uncertain: concealed]
    the closing note of Count Pourtales beforehand. You can therefore write and seal the written undertaking
    for B alone in the [uncertain: place] — For an honest man this is security enough. v Triebenfeld'

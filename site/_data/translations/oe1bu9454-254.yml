- page: 5
  en: '254 c) May Your Serene Highness deign to send some two hundred to my daughter, so that she may
    not perish of hunger. — I beg it most earnestly, for nothing comes out of Poland, everything there
    is blocked - and from here I can send nothing, since I myself live here on credit. Should you not
    be willing to effect it [uncertain: speedily], then have, most gracious Lord, the one kindness of
    letting me know it in the most [uncertain: forthright] manner, so that I may hasten home and find
    means - the reproaches of my children) whom I am indeed totally neglecting for the sake of your business
    (are [uncertain: cutting] my heart — — Unwillingly do I live without a reckoning - I calculated at
    once that I should not manage on less than 1400 Rthl. The money which I was to send my children per
    September and October the devil took on the journey from Miedzeritz and Schlawenschitz etc.; I believed
    for certain that I should find with Your Serene Highness what I had written for; unhappily it was
    1000 Rthl less; with 400 Rthl I went there, 240 Rthl you have sent after me, and on that I am to live
    - here, where the meanest secretary receives 100 ducats a week as an allowance - 2 months I have been
    here - 100 ducats I have already borrowed, while there my children want for bread — How is this to
    end, and how am I to get away from here? I do everything for you - I make myself many enemies for
    your sake and shrink from nothing in order to tear you, my Prince, out of every labyrinth, and for
    that you let me too and my children suffer the most [uncertain: thankless] want. Have mercy and [uncertain:
    send] 200 Rthl to my children, that I may only be freed from this anxiety - and thereafter see to
    it that I get at least 100 ducats sent here, since we shall certainly remain here another 4 weeks,
    so that I may pay the most pressing debts and travel back unencumbered – Your wishes are all now succeeding
    through my restless endeavour - do not for that let me and my children perish of hunger.


    v Triebenfeld'

- page: 2
  en: 'must still bring about —


    1. You must recover your Polish estates; by that you gain air and throw out Leixner and the S. Jew
    Meyer Bernhard


    2. The Curische debt will be discharged, whereby you will be free of 461,000 Rthl of debts and the
    King sees you justified


    3. you will [uncertain: become/be] Cosmarn and stand again as lord in all your estates, covered with
    fame and honour


    4. The Monarch will have to do you justice, and indemnify you for all your sufferings and remove every
    stain even from your honour,


    5. you need no longer be the mockery of men, still less live on the mercy of your children


    6. you come out of the Koszęcin bonds, and that in the most advantageous and most honourable manner
    — All this I am bringing about here this time, so it would be more than cruel if you were to let me
    suffer want, [uncertain: starve], and become the mockery of men for it — This would already have happened,
    I should have had to withdraw like a scoundrel, had the upright Barbe not helped me out so like a
    brother — six hundred thaler or 200 # I must by force have here within a fortnight at the latest,
    apart from the 100 # that are said to be on the way, for otherwise the whole mesh stands still — Your
    distress there must not now be so pressing — Tread on your leeches there now, they will yield up something,
    for they, B[arbe] — will, after the appointed investigation, surely perceive that it is no longer
    a sheep and empty sound, and also that their idol''s reign will now have an end — Believe me, most
    gracious Lord, that I would far rather take an emetic than plague you for money — But I cannot do
    otherwise if I am to go on working with these men. What I ask is only for subsistence. In clothing
    I remain always a [uncertain: Langenhund], and therefore I have as yet seen very few people'

- page: 1
  en: '254 It is very sad that I must always wait so long for an answer and for support. Since everything
    is going so exceedingly happily through the honest B[arbe]''s efforts, I do not willingly wish to
    break off, but rather to bring everything to the desired goal — that this cannot be done here, in
    these times, with empty hands is surely easy enough to judge — daily I must be together with the men
    who actually accomplish things, for the Prince Chancellor is too seldom to be seen and in truth has
    no time to occupy himself with matters of this kind. Only these good men who are always about him
    must alone do the work and direct everything — no evening passes in which they do not visit me — 20-30
    gulden are the way, I do not know where they go — people say a good draught tastes well upon good
    news, and truly I give it to them gladly, men of that sort deserve it — I thought to be here 4 — 5
    weeks, and for that I asked 1,400 Rthl. Now I have already been sitting here some 12 [uncertain: delusions/weeks]
    and in all that long time I have received 640 Rthl. — today I am already 94 # in debt to Barbe — Even
    if you now send 100 #, what is left to me, since I must hand Barbe his money over — It then amounts
    to 940 Rthl that I have received, and that certainly and truly does not suffice for so maddeningly
    long a time — My own affairs stand badly there, I am abandoning my children and what is mine, for
    since everything is once going happily, I now wish to bring your affairs too entirely to the desired
    goal — and to rescue you wholly, as has ever been my wish — after which I may with every right hope
    for rescue from you in turn, most gracious Prince — It is no small thing that I have already done
    here and still'

- page: 1
  en: 'It is very sad that I must always wait so long for an answer and for support. Since everything
    is going so exceedingly happily through the honest Be endeavour, I do not willingly wish to break
    off, but rather to bring everything to the desired goal – that this cannot now be done here, in these
    times, with empty hands, is surely easy enough to judge; daily I must be together with the men who
    actually do the work, for the Prince Chancellor is too seldom to be seen, and in truth has no time
    to occupy himself with matters of this kind. Only these good men who are always about him must alone
    do the work and direct everything — no evening passes on which they do not visit me - 20-30 Rthl go
    the way, I know not where they end up - it is said that on good news a good draught tastes well, and
    truly I give it to him gladly, men of that sort deserve it of him - I believed I should be here 4
    - 5 weeks, and for that I asked 1400 Rthl. Now I have already been sitting here about 12 [uncertain:
    weeks] and in all that long time I have received 640 Rthl - today I am already 94 ducats in debt to
    Barbe. Even if you now send 100 ducats, what remains to me, for I must hand over his money to Barbe
    – It then amounts to 940 Rthl that I have received, but that certainly and truly does not suffice
    for so madly long a time. My affairs stand badly there; I am forsaking my children and my own, for
    since everything is at last going happily, I will now also bring your affairs entirely to the desired
    goal - and rescue you wholly, as it has always been my wish - after which I may with every right hope
    for rescue from you in turn, most gracious Prince - It is no small thing that I have already done
    here, and am still'

- page: 3
  en: 'all the amusements and all the mighty processions I know only by the day on which they fell; I
    therefore need make myself no reproaches that I have squandered the money demanded, or applied it
    otherwise than in your interest — For the rest, I beg Your Serene Highness to let the letters to be
    sent to me go entirely under the address of the Royal Prussian Chief Post Director Mr Mann in Vienna;
    that is to say, the letter to me is duly sealed and provided with the address, and then a cover is
    made and the full address made out to the Chief Post Director Mann — This is an easy trouble, and
    the letters go more surely and more swiftly, especially if you send them to Nysa by post twice every
    week — For from here the Prussian post goes twice weekly to Wrocław and arrives twice — You may well
    have my horses used for it — now alone is the time, most gracious Prince, now one must bestir oneself
    and spare nothing; where the blank forms are, where the letter to the Prince is, where the 100 # lie,
    by God, I sit here and could despair, because I am without any news whatever from Your Serene Highness
    — this would not need to be so if you always gave the letters to Nysa by the Prussian post and under
    the above address — Meanwhile I will endure all sufferings, if only a good report comes in from the
    Brzeg Higher Provincial Court — do see to that there in the best way — of the Koszęcin sale let Your
    Serene Highness say nothing to anyone too early, for if the creditors [uncertain: scent] a rich purchaser
    they will be willing to let little of the capital go; this must be settled just as we [text lost]
    the closing note from Count Portales beforehand, and you can therefore write and seal the written
    undertaking for B alone in the setting-out — For an honest man this is security enough. v Triebenfeld'

  en: '1. the mediate town of Kamionna

    in it there are:

    75 hearths including 1 water mill, wherefore there are only 74 burgesses.

    3 waste sites

    2 churches

    1 hospital

    1 provostry

    1 town hall, among which 1 tavern of the manorial lordship (Dominium)


    The residents subsist for the greater part by husbandry, and make use of a terrain of 3857 Morgen
    146 rods; wherefore, besides 36 farming burgesses, there are only

    7 shoemakers

    6 tailors

    9 furriers

    3 potters.



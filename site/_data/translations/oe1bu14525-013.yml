- page: 2
  en: 'The estates Kamionna and Kolno lie in the province of South Prussia, in the department of the Royal
    Government at Poznań, and in its Międzyrzecz district.


    These estates stand in a single economic connexion, and are distant 3 miles from the district town
    of Międzyrzecz, 3 miles from Swerin, 1/2 mile from Birnbaum, 1 1/2 miles from Zircna [uncertain: Zircna],
    2 miles from Pinne, 9 miles from Poznań, and 3 miles from the Neumark frontier, namely towards Driesen.


    The nearest river is the Warta at Birnbaum, and the produce which is not consumed on the estate itself
    has been disposed of and sold in that town.


    Kamionna borders to the east upon Mechnach, to the south upon Groß-Munche and Grolewo, and to the
    north upon Kolno.'

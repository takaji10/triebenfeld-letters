  en: '90 head of young cattle

    74 wethers

    98 sheep

    90 lambs

    108 swine

    33 beehives


    The residents hold themselves to be proprietors of their holdings; this, however, is not proved, nor
    is the mortgage business regulated.


    They distil brandy in 8 stills; the manorial lordship, however, likewise exercises the propination
    rights in the town, and has 2 taverns therein.


    The propination rights are very considerable, for besides the town residents the following are attached
    to the town church as parishioners:

    Kolno

    Popowo

    Kroszyn

    Groß-München

    Klein-München

    Tomchempe'

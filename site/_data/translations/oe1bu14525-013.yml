  en: 'Valuation

    of

    the estates belonging to the reigning Prince of Hohenlohe-Ingelfingen, Friederich Ludwig, Serene Highness,
    situate in the province of South Prussia, in the department of the Royal Government at Poznań, and
    in its Międzyrzecz district,

    Kamionna

    and

    Kolno


    Corrected according to South Prussian principles by

    Bading

    Privy expediting Secretary and Calculator at the South Prussian General Domains Department


    That the correction of this valuation made by Mr. Bading, according to the foregoing notice, has been
    undertaken exactly in conformity with the approved South Prussian domain-valuation principles, is
    hereby attested as duty requires, upon request. Berlin, the 16th of May 1804

    Privy South Prussian Registry of the Royal General Directory

    Beugnitz'

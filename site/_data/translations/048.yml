status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! I have had here the justice-burgomaster Hawich
    of Zagorowo, who is appointed as actual Ducal-Warsaw Notarius publ., together with the Chief Inspector
    Hertes, and have with these men transacted everything that tends to Your Serene Highness's advantage,
    and have had the judicial special powers of attorney drawn up for that purpose. Accordingly I have,
    firstly, pressed for the dismissal of the Dqbska in the matter of the Traperin estates, and have given
    power of attorney and instruction to that end. Secondly, I have given the power of attorney for the
    entire lifting of the sequestration and drafted the introductory step, all the more since a 3-year
    general indult has been granted by the King of Saxony, and since in this matter everything turns upon
    the absolute payment of the interest; therefore I have, thirdly, given the said Hawich the power of
    attorney to collect the interest and to pay it, against receipt, to those creditors who already have
    judgments in force in their favour, but to remit the remainder to Your Serene Highness. I have also,
    fourthly, given a power of attorney to bring suit against the Jew Oppenheimer et Wolff in Kalisz,
    and at once to press for the cancellation of the several sums entered, amounting to over 72000 Rthl,
    in which matter a suit is already pending in Berlin. Fifthly, I have issued a power of attorney that
    the deceiver Honrichs, who had himself installed as sequestrator, be at once dismissed and compelled
    to render account ad massam; that Hawich, on the other side, shall draw up the objections against
    him, and compel him to make good the same as well as to pay the sums still outstanding from him. Likewise
    I have, sixthly, given a power of attorney to collect from the v Niedzewiecki the outstanding lease
    sum and to apply for execution against him. Seventhly, I have issued a power of attorney that all
    high-handed transactions and
- page: 2
  en: 'sales of the lands by Honrichs be at once annulled, and that the purchasers, if they will not submit
    to payment into the treasury, be evicted with recourse against Honrichs; for he, without being authorised,
    gave away parts of the lands for nothing and appropriated to himself in that manner a [uncertain:
    Güsche] of several Hufen, and put up the buildings from manorial timber and bricks. Eighthly, I have
    given power of attorney for the collection of all arrears of purchase moneys, which are very considerable.
    Ninthly, a power of attorney has been issued to compel the Olesnitz hereditary lessees to pay the
    arrears of entry-moneys, inclusive of the canon, amounting to 23000 Rthl, or else that they be evicted
    with their dependants, so that the lands and buildings may be otherwise disposed of. Also, tenthly,
    a power of attorney has been given to etc. Habesti for the prosecution of all boundary suits, and
    the necessary instructions for it have been issued. Eleventhly, that a power of attorney has been
    given to Hawich, so that in the name of Your Serene Highness he may appear at the Diet at Warsaw and
    in all places, in order to maintain in their due force the rights of possession and property of the
    same Most High, all the more since every proprietor of an estate must now appear in person, reside
    upon his estates, or else forfeit his possessions. Twelfthly, besides this I have given the said Hawich
    a power of attorney on my own part, together with the original decrees of the French General Government,
    in order to collect the [uncertain: hanttene] interest advanced by me on the Invalids'' Fund together
    with costs etc., and to remit the same to Your Serene Highness for the covering of the Lahr sum. Thirteenthly
    and lastly, a further power of attorney has been made out for Hawich, to collect from the Radrimin
    heirs the still outstanding hereditary purchase moneys and several years'' canon, which amount to
    over 10000 Rthl, and to refute the unjust claims formerly drawn up by the deceased. I have had all
    this taken down judicially by the justice-burgomaster Schench of Neusatz, in order to begin this new
    career right brilliantly; and since, by virtue of the bond of 25000 Rthl, I have a right before all
    creditors to have a word in the matter, I think this must surely make an impression and bring about
    the most desired issue. In the meantime, however, Your Serene Highness shall, by my direction, faithfully
    receive the reports upon the progress of the affair from time to time. In deepest reverence I remain,
    until death, Your Most Serene Highness''s faithful and most obedient servant. Kontop, the 7th of March
    1809. v Triebenfeld'

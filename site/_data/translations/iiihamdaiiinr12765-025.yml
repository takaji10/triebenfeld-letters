segments:
- page: 1
  en: 'In conformity with Your Right Honourable''s esteemed letter of the 29th of April of this year,
    I delivered on the 17th/5th of May a note to Count Nesselrode in the matter of the Prince Friedrich
    Ludwig of Hohenlohe-Ingelfingen, and in a later note of the 1st of August/20th of July I likewise
    brought up for discussion the circumstance touched upon in the order of the 29th of June. Only under
    yesterday''s date has an answer to this been given me, which, as Your Right Honourable will be graciously
    pleased to see from the enclosure in copy, has turned out to be a refusal. St Petersburg, the 23rd/11th
    of November 1816. Fr. von Schöler. To the Most Laudable 3rd Section of the Royal Ministry of Foreign
    Affairs.


    [Written by the receiving office:]


    Councillor of Legation Balan


    c. a. No. 9882. B. received 8 December 1816.


    To the Prince of Hohenlohe


    Copy of the enclosure


    B[erlin] 9/12 [18]16'

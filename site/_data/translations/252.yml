segments:
- page: 1
  en: In answer to Your Right Honourable's petition of the 25th of last month, I inform you that the affair
    of the Prince of Hohenlohe with respect to the claims upon Trąbczyn and Kaemen will settle itself
    of its own accord as soon as the general partition and agreement now in progress concerning the Duchy
    of Warsaw shall come to be carried out. Vienna, the 25th of November 1814. C f v Hardenberg. To the
    Right Honourable the Councillor of War von Triebenfeld, Sir.

- page: 1
  en: 'There has appeared here a lampoon under the title Prussian Characters, in which Your Serene Highness
    is indeed very much attacked, and even my own insignificant self figures in its account. It says:
    the Prince needs a great deal of money; he has a man of business in the person of the Councillor of
    War von Triebenfeld, but this man appears rather to make use of his own interest in the Prince''s
    affairs and to enrich himself. He is an intriguing fellow who has worked his way up from a servant
    to a nobleman. – 1 had sent the book along, but even the French authority has had it confiscated –
    for the rest, the author is said to be Colonel Massenbach or the local Professor Buchholz. It [is]
    only fully proved that Massenbach is the fabricator, [in which case] my pistols stand at his service.


    the [uncertain: better] Rochritz is also cruelly handled'

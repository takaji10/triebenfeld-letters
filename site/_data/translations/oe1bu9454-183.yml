- page: 1
  en: 'There has appeared here a lampoon under the title Prussian Characters, in which Your Serene Highness
    is quite severely attacked, and even my own humble self figures in its account. It says: the Prince
    needs a great deal of money; he has a man of business in the person of the Councillor of War v. Triebenfeld,
    but this man appears rather to turn his own interest to account in the Prince''s affairs and to enrich
    himself. He is an intriguing fellow who has worked his way up from a servant to a nobleman. – 1 had
    sent the book along, but the French authority itself has had it confiscated – for the rest, the author
    is said to be the Colonel Massenbach or the local Professor Buchholz. Should it be fully proved that
    Massenbach is the fabricator, my pistols are at his service. The [uncertain: bedere] Rochritz is also
    cruelly handled.'

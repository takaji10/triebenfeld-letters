  en: '183 A lampoon has appeared here under the title Prussian Characters, in which Your Serene Highness
    is indeed most severely attacked, and even my own humble person figures in its story. It says: the
    Prince needs a great deal of money; he has a business [uncertain: man] in the person of the councillor
    of war von Triebenfeld, but this man seems rather to turn his own interest to account in the Prince''s
    affairs and to enrich himself. He is an intriguing fellow who has worked his way up from a servant
    to a [uncertain: nobleman]. — I had sent the book along, but even the French authority has had it
    confiscated — for the rest, the author is said to be Colonel Massenbach [uncertain: and] the local
    professor Buch holz [text lost] it be once fully proved that Massenbach is the fabricator, [text lost]
    my pistols are at his service.


    the upright Köckritz too is cruelly handled'

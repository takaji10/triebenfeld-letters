segments:
- page: 1
  en: 'Copy


    Most Serene and Most Mighty King! Most gracious King and Lord!


    In most humble obedience to Your Royal Majesty''s most high command of 18 November, according to which
    the title of possession (titulus possessionis) to the Princely Hohenlohe estates of Kopojno, Zagórów,
    Drzewce, etc. etc. is to be rectified, I have done everything required for the production of the documents,
    and I hope that the impediment which has hitherto prevailed is removed, and that Your Majesty''s most
    high commands may be most exactly carried out within 4 weeks; wherefore I most humbly beg that all
    severe measures against this be held back, and in deepest reverence I remain, until death, Your Royal
    Majesty''s most humble Johann Wilhelm Glenck, Princely Hohenlohe Councillor of Building and Economy.


    Breslau, the 3rd of November 1800'

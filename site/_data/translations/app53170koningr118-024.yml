- page: 1
  en: 'Done in Konin, on Saturday, next before the Feast of Saint Michael the Archangel, namely the 29th
    day of the month of September, in the Year of the Lord 1782.


    On behalf of the Venerable Ląd Convent, against the Illustrious Prusimski, Starost of Niszczewice
    — a Report


    Let there be seen at this place a Report on behalf of the Venerable Ląd Convent, against the Illustrious
    Magnificent Antoni Prusimski, Starost of Niszczewice — for the Ordinary General Sessions of the Crown
    Tribunal of the Kingdom at Piotrków — as the copy stands in the submitted documents.'

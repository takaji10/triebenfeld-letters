- page: 2
  en: 'estates in hereditary lease. My unpresumptuous proposal is this: that Walichnowski be told that
    he must pay 60000 or 80000 rt of hereditary purchase money at once, and for all time 4 to 5000 rt
    annual hereditary quit-rent, and that Your Serene Highness would give orders as to whom he is to pay
    the rent, which would remain secured upon the first mortgage. This would then be a firm word from
    which there must on no account be any departure.


    I know the Poles thoroughly — if one shows a firm tone and resolution, and scorns their offers, especially
    all bribes, then one is at once at one''s goal with this brood.


    I have proved this sufficiently in the case of Dombrowska[uncertain: Dąbska]. Forgive, most gracious
    Prince and Lord, my frank representation. It is, however, truly well meant. May Your Serene Highness
    also deign to take to'

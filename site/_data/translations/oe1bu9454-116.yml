- page: 2
  en: 'estates in hereditary lease. My unpresuming proposal is this: that it be said to Walichnowski that
    he must pay 60000 or 80000 Rthl of hereditary purchase money now and, in perpetuity, 4 to 5000 Rthl
    yearly hereditary rent, and that Your Serene Highness would give order as to when he is to pay the
    rent, which would remain secured upon the first mortgage. This would then be a firm word, from which
    on no account must there be any departure.


    I know the Poles thoroughly — if one shows a firm tone and resolution, and scorns their offers, especially
    all bribes, then one is at once at one''s goal with this brood.


    I have proved this sufficiently in the case of Dombrowchen. Forgive, most gracious Prince and Lord,
    my frank address. It is, however, truly well meant. May Your Serene Highness deign to take to heart
    this further request also, and'

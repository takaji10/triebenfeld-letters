segments:
- page: 1
  en: 'I would gladly have attended upon Your Most Serene Highness in person, at my own cost, and obtained
    your high commands concerning the sale of the estates, but I am very ill and cannot leave my room.
    The Poles constantly choose me as their man of business, only I do not always know what I am to say,
    since no [uncertain: under] plan has been drawn up, but the matter is put forward now one way, now
    another. Thus it is said, for example, that debts of 150000 Rthl are charged upon Trąbczyn, which
    Walichnowski is to take over, and that notwithstanding this he is to take on 56000 Rthl and a canon
    of 5000 Rthl yearly.


    What there may be in the matter I cannot judge; I hold it, however, to be a misunderstood piece of
    gossip, and I fear only that Your Serene Highness''s honour will suffer by it. For if debts are charged
    upon the estates, then is it not necessary that this be told to every Pole who wishes to take the'

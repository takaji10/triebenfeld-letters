- page: 3
  en: 'by no means let this note be seen by Wünstere or by others — it would do harm rather than good
    — men are often too covetous, so that when an honest man meets them upon these paths, they let him
    be and do him injury. Command me by two lines in confidence as to how you would have it, and then
    reckon, most gracious Prince, upon my faithful zeal, which will yet be ten times greater and go still
    more to my heart than my truly painful sickness. Wallechnowski has in truth a real will to bring the
    Trąbczyn estates into his own hands.


    In deepest submission I remain, until death, Your Most Serene Highness''s


    Bre[uncertain: slau], the 11th of December 1803


    most faithful and most humble and obedient servant


    v. Triebenfeld'

- page: 1
  en: '116


    Your Most Serene Highness, I would gladly lay myself personally at [uncertain: your expense] and obtain
    your most high commands concerning the sale of the estates, but I am very ill and cannot come out
    of my room. The Poles continually choose me as their arbiter, only I do not always know what I am
    to say, because no [uncertain: lower] plan has been made, but the matter is presented now one way,
    now another. Thus it is said, for example, that 150000 rt of debts are secured upon Trąbczyn, which
    Walichnowski is to take over, and that notwithstanding this he is to take on 56000 rt and a canon
    of 5000 rt annually.


    What there is in the matter I cannot judge, but I hold it to be a misunderstood piece of gossip, and
    I only fear that Your Serene Highness''s honour will suffer by it. For if debts are secured upon the
    estates, then it is not necessary that this be told to every Pole who wishes to take the'

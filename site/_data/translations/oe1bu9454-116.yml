status: draft
segments:
- page: 1
  en: 'Your Most Serene Highness I should gladly have waited upon in person, laying myself at your feet,
    and there taken your high commands concerning the sale of the estates, but I am very ill and cannot
    come out of my room. The Poles constantly choose me for their labourer, only I do not always know
    what I am to say, since no [uncertain: under-] plan has been made, but the matter is put forward now
    in one way, now in another. Thus it is said, for example, that upon Trąbczin there rest 150000 Rthl
    of debts which Walichnowski is to take over, and that notwithstanding this he is to take over 56000
    Rthl and a canon of 5000 Rthl yearly. What there may be in the matter I cannot judge, but I hold it
    to be a wrongly understood piece of gossip, and only fear that Your Serene Highness''s honour suffers
    by it. If debts do rest upon the estates, then it is surely not necessary that this be told to every
    Pole who wishes to take the'
- page: 2
  en: 'estates in hereditary lease. My unpresuming proposal is this: that Walichnowstii be told that he
    must pay 60000 or 80000 Rthl hereditary purchase money now, and for all time 4 to 5000 Rthl yearly
    hereditary quit-rent, and that Your Serene Highness would give orders as to when he is to pay the
    interest, which would remain secured upon the first mortgage. This then would be a firm word, from
    which on no account should there be any departure. I know the Poles thoroughly — if one shows a firm
    tone and resolution, and scorns their offers, above all every sort of bribe, then one is at once at
    one''s goal with this brood. I have proved this abundantly enough in the case of Dombrowchen. Forgive
    me, most gracious Prince and Lord, my frank representation. But it is truly well meant. May Your Serene
    Highness also deign to take to heart this further request'
- page: 3
  en: 'and by no means let this note be seen by [uncertain: Wünstere] nor by others — it would do more
    harm than good — men are often too covetous, so that when an honest man meets them upon these roads,
    they [illegible] and do harm. Command me by two lines in private how you would have it, and then count,
    most gracious Prince, upon my faithful zeal, which will yet be ten times greater and go more to my
    heart than my truly painful illness. Wallechnowski has a really genuine will to bring the Trąbczin
    estates into his hands. In deepest reverence I remain, until death, Your Most Serene Highness''s

    Bre[uncertain: slau], the 11th December 1803

    most faithful and most humble and obedient servant

    v Triebenfeld'

- page: 3
  en: 'heart this further request, and by no means let this note be seen by [uncertain: Wünstere] or by
    others — it would sooner do harm than good — men are often too covetous, so that, when an honest man
    meets them on this path, they [uncertain: slander] him and do him harm. Command me by two lines in
    secret as to how you wish it to be, and then reckon, most gracious Prince, upon my faithful zeal,
    which will yet be ten times greater and go more to my heart than my truly painful illness. Walichnowski
    has a genuinely real will to acquire the Trąbczyn estates.


    In deepest submission I remain, until death, Your Most Serene Highness''s


    Wrocław, the 11th of December 1803


    most faithful and most humble and obedient servant


    v Triebenfeld'

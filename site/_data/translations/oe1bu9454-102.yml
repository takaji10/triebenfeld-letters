- page: 4
  en: 'interest — Wildeganst is taking every conceivable trouble to direct this in a delicate manner.
    The news concerning the war is truly sad; yet I hope that matters will go better there than is believed.
    With the Russians it looks bad, for there one languishes greatly, and as I have observed, all of South
    Prussia is turning that way — It is a true misfortune that no one in South Prussia keeps watch over
    the people. Everything already looks quite like a band of robbers.


    May God only preserve Your Serene Highness in health. In deepest submission I remain, until death,


    Your Most Serene Highness''s


    Breslau, the 6th of March 1799.


    most faithful and humble servant


    von Triebenfeld'

status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord! According to several reports, His Excellency the Minister
    v Voss is to arrive in Krotoszyn in some 3 weeks, in order to examine the business in question. God
    grant that the matter be concluded as we wish. If only Herr p. Prittwitz would then take the trouble
    and go there himself, the matter would proceed very swiftly. Chelmshi has lost in the 2nd instance
    as well, and now I only await what he will do further. The matter will soon be concluded. With Broniewski
    I can come to a close at any hour; yet I shall not do so any sooner than until I see how things turn
    out with Krotoszyn — I have now had everything dissected once more at Posen, and everyone now finds
    that not a Groschen ought to come out of it for the Patri either. In the meantime, however, so as
    to
- page: 2
  en: 'neglect nothing, the dismemberment there is being drafted complete and firm; to that end the exchange
    is being effected, and so I shall compound with Broniewski for a few thousand [uncertain: Wir] and
    shall order the dismemberment — After the survey of Kaemen and Kulm, Glenck is already bringing out
    as much as 6000 Rthl in interest, and in this manner it will go a proportion for every estate — Only
    on account of Brzyze have I had much clamour at Posen; this they wished to collect at once on behalf
    of the Prusimski daughter, and with every trouble conceivable I have been able to obtain a term of
    6 weeks — My humble counsel is that a letter now be written to the Grand Chancellor, and an extension
    of the term of 5 months be sought. This I shall attend to, for I do indeed still have blank forms.
    Thereafter the matter might turn out singularly — for the Treasury has applied to Minister Hoym to
    have the confiscation decree published against the Prussiemski woman as well. The Minister, however,
    has ordered the files to be secretly laid aside, so that something might be turned to the girl''s'
- page: 3
  en: 'advantage — since Your Serene Highness would otherwise scarcely be able to agree to anything —
    Peculiar in its kind is this stroke — for at first he did after all report these estates to the King
    as confiscated, and proposed them for Your Serene Highness — by rights he must answer for this shortfall
    — He is altogether a singular man. For the rest, it may be that yet other means of rescue will be
    found; I shall assuredly leave nothing untried. On account of the Winieces forest the Chamber is making
    much spectacle; I shall nevertheless shortly go there myself and sift the Poles — As soon as I am
    finished with Prince George''s affairs, which should come to pass in 5 weeks, I shall hasten to Berlin
    in order to prepare everything for the return of v. Voss. The letter to Herr [uncertain: Prittswig]
    Wildeganst will deliver today; the one to Kuch shall likewise be handed over. Everything is also very
    well said; nevertheless I do not believe that Weigel is to blame for it — With Schlabrendorff I shall
    settle the matter in one way or another. In the end he shall himself lend me the money for the payment
    of the'
- page: 4
  en: 'interest — Wildeganst is taking every trouble conceivable to conduct this in a delicate manner.
    The news concerning the war is truly sad; yet I hope that matters will go better there than is believed.
    With the Russians it looks ill, for there one [uncertain: schmarcht — perhaps "languishes"] very much,
    and as I have observed all South Prussia will [text lost] thither — It is a true misfortune that no
    one in South Prussia keeps watch over the people. Everything already looks quite like a horde of robbers.
    May God only preserve Your Serene Highness in health. In deepest submission I remain, until death,
    Your Most Serene Highness''s Breslau, the 6th of March 1799. faithful, most humble and obedient servant
    v Triebenfeld'

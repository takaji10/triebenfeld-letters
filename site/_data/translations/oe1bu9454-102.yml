  en: '102


    Most Serene Prince,


    Most gracious Lord!


    According to several reports, the Minister von Voss, His Excellency, is to arrive in Krotoszyn in
    about 3 weeks in order to examine the business in question. God grant that the matter be concluded
    as we wish. If only Mr


    Prittwitz would then take the trouble and go there himself, the matter would proceed very quickly.
    Chełmski has lost in the 2nd instance as well, and now I await only what he will do further. The matter
    will soon be concluded.


    With Broniewski I can come to terms at any hour; meanwhile I shall not do so until I see how things
    turn out with Krotoszyn — I have now once more dissected the whole business in Poznań, and everyone
    now finds that not a single Groschen ought to come out of it for the [uncertain: Patri]. In the meantime,
    however,'

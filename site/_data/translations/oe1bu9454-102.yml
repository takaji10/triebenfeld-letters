- page: 4
  en: 'interest — Wildeganst takes every imaginable pains to conduct this in a delicate manner. The news
    about the war is truly sad; meanwhile I hope that matters there will go better than is believed. With
    the Russians it looks bad, for there they plunder greatly, and as I have observed all of South Prussia
    is turning that way — It is a true misfortune that nobody in South Prussia keeps watch over the people.
    Everything already looks quite like a band of robbers.


    May God only keep Your Serene Highness in health. In deepest submission I remain, until death,


    Your Most Serene Highness''s


    Wrocław, the 6th of March 1799.


    most faithful and most humble and obedient servant


    von Triebenfeld'

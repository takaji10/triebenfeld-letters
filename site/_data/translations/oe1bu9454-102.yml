- page: 2
  en: in order to neglect nothing, the dismemberment there will be drafted completely and firmly; the
    exchange will be made along with it; so I shall settle with Broniewski for some few thousand Rthl
    and give order for the dismemberment — After the survey of Kamionna and Kulm, Glenck already brings
    out nearly 6000 Rthl in interest, and in that fashion it will proceed proportionately with each estate
    — Only on account of Brzyze have I had much uproar in Poznań; they wanted to seize it at once for
    the Prusimski daughter, and with every imaginable exertion I have been able to obtain a term of 6
    weeks — My humble advice is that the Grand Chancellor now be written to, and an extension of the term
    by 5 months requested — This I shall see to, for I still have blank forms. Thereafter the matter may
    turn out strangely — for the Treasury has applied to the Minister Hoym to have the decree of confiscation
    published against the Prusimski woman as well. But the Minister has ordered the files to be laid aside
    in secret, so that something might be

- page: 3
  en: 'turned to the girl''s advantage — since otherwise Your Serene Highness would hardly be willing
    to agree to anything — Peculiar in its way is this move — for first he did after all report these
    estates to the King as confiscated, and proposed them for Your Serene Highness — in law he must answer
    for this shortfall — This is altogether a singular man. For the rest, it may be that still other means
    of rescue will be found; I shall certainly leave nothing untried. On account of the Winieces forest
    the Chamber is making much spectacle; I shall meanwhile shortly go there myself and sift out the Poles
    — As soon as I am done with Prince George''s affairs, which should happen within 5 weeks, I shall
    hasten to Berlin in order to prepare everything for von Voss''s return. The letter to Mr. [uncertain:
    Pritswig] Wildeganst will deliver today; that to Kuch shall likewise be handed over. Everything is
    also very well said; meanwhile I do not believe that Weigel is to blame for it — With Schlabrendorff
    I shall settle the matter one way or the other. In the end he shall himself lend me the money for

- page: 2
  en: not to neglect anything, the dismemberment there will be drawn up complete and firm; to that end
    the exchange takes place, and so I shall come to terms with Broniewski over some thousands of We[?],
    and give the order for the dismemberment — After the survey of Kaemen and Kulm, Glenck is already
    bringing out about 6000 Rthl in interest, and in that manner it will go proportionately with every
    estate — Only on account of Brzyze have I had much clamour at Posen; they wished to collect this at
    once for the Prusimski daughter, and with every conceivable effort I have been able to obtain a term
    of 6 weeks — My humble counsel is that a letter now be written to the Grand Chancellor and an extension
    of the term by 5 months be applied for. This I shall see to, for I still have blank forms. Thereafter
    the matter may turn out oddly — for the fisc has approached Minister Hoym, to have the confiscation
    decree published against the Prussiemski woman as well. The Minister has, however, ordered the files
    to be secretly laid aside, so that something might be

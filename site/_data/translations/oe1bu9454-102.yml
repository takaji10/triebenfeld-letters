- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    According to several reports, His Excellency Minister von Voss is to arrive at Krotoszyn in about
    3 weeks, in order to examine the business in question. God grant that the matter be concluded as we
    wish. If only


    Mr. von Prittwitz would then take the trouble and go there himself, the matter would proceed very
    quickly. Chelmshi has lost in the second instance as well, and now I await only what he will do further.
    The matter will soon be concluded.


    With Broniewski I can conclude at any hour; only I shall not do so before I see how things turn out
    with Krotoszyn — I have now had everything at Posen analysed once again, and everyone now finds that
    not a Groschen is likely to come out of it for the Patri. Meanwhile, in order'

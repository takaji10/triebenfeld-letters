- page: 3
  en: turned to the girl's advantage — since Your Serene Highness might otherwise not consent to anything
    at all — This turn of his is peculiar in its way — for first he did after all report these estates
    to the King as confiscated, and proposed them for Your Serene Highness — in law he must answer for
    this shortfall — He is altogether a singular man. For the rest, it may be that other means of rescue
    will yet be found; I shall assuredly leave nothing untried. Over the Wieniec forest the Chamber is
    making a great commotion; I shall meanwhile shortly go there myself and sort out the Poles — As soon
    as I have finished with Prince George's affairs, which may be within 5 weeks, I shall hasten to Berlin
    to prepare everything for von Voss's return — The letter to Mr von Prittwitz Wildeganst will deliver
    today, and the one to [illegible] shall likewise be handed over. Everything is also very well said;
    meanwhile I do not believe that Weigel is to blame for it — With Schlabrendorff I shall manage the
    matter one way or the other. In the end he shall himself lend me the money for the payment of the

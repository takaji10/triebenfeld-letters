status: draft
segments:
- page: 1
  en: 'Done on the estate of Trąbczyn and at the place of the corner junction, beside three visible corner
    mounds — namely the first, of the estate of Trąbczyn Małe, or Nowa Wieś, belonging to the Most Honourable
    Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanisław; the second, of Łukom, belonging
    to the Right Honourable Ścibor Stanisław Chełmski, Treasurer of Wschowa; and the third, of the neighbouring
    village of Drzewce, belonging to the Reverend Ląd Convent of the Cistercian Order, as hereditary holders
    — corner mounds established and raised from the ground in the pine forest near the road to Pyzdry
    and another road running from Zagórów and Drzewce towards Chocz or Kalisz, by commission decree sanctioned
    by force of law by the Estates of the Realm, issued in 1775 on the 3rd of October; and approved by
    the post-commissarial decree of the Crown Tribunal of Piotrków, on Wednesday after the Feast of Saint
    Agnes, Virgin and Martyr, namely the 23rd of January in the present current year 1782, and also under
    the other decree specified below, which constitutes the present act — conducted on Thursday after
    the Feast of Saint Catherine, Virgin and Martyr, namely the 28th of November in the year of the Lord
    1782.


    [Translator''s note: Lat. haereditariorum. The term designates the Ląd Convent as the hereditary proprietor
    of the Drzewce estate.]


    [Translator''s note: Lat. tum sub alterno inferius de actu specificando actum praesentem constituenti
    approbatos. The syntax is compressed. "The other decree specified below" refers to the condescensorial
    decree of the Boundary Surveyor''s court, introduced later in the document; the corner mounds are
    stated to have been approved both under the Tribunal decree just cited and under that second decree.]


    Before the Right Honourable Franciszek Ksawery Jasiński of Jasień, Boundary Surveyor of the Gniezno
    Voivodeship. Present: the Most Illustrious and Most Reverend Benedykt Woronowski, Canon of Łęczyca,
    Provost of Swarzędz, sworn and privileged geometer; and also the Right Honourables and Honourables:
    Józef Łukaszewicz, sworn General Commissioner of Greater Poland; Michał Brzeżański; Leon Maszewski;'
- page: 2
  en: 'Franciszek Liberacki; and very many other people of various rank and condition, gathered for the
    present act.


    And also the Honest Bartłomiej Szepczyński of the village of Trąbczyn, general Court Summoner of the
    realm, authentic and sworn, proclaiming the present act.


    [Section 2 — Embedded Tribunal Decree: Piotrków, 17 October 1782]


    At today''s session, by virtue of a Crown Tribunal of Piotrków decree issued between the parties,
    of the following tenor:


    Done at Piotrków in the ordinary general sessions of the Crown Tribunal, on Thursday after the Feast
    of Saint Hedwig, Widow and Elect, namely the 17th of October in the year [of the Lord] 1782, between:
    the Right Honourable Antoni Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanisław,
    plaintiff and cited, through the Right Honourable Maciej Rudnicki; the Right Honourable Stanisław
    Chełmski, Treasurer of Wschowa, cited and plaintiff, personally; the Honourable Jakub Górski, Boundary
    Surveyor of Inowrocław, in their official capacity, through the Honourable Ignacy Ujazdowski; the
    Right Honourable Alojzy Orławski, Boundary Surveyor of the Dobrzyń Land, in their official capacity,
    [unclear] through the Honourable Ludwik Borzeski; the Most Honourable and Most Reverend Lubstowski,
    Abbot of the Ląd Convent, and the entire Reverend Ląd Convent, cited through the Honourable Ignacy
    Gzowski —


    [Translator''s note: Lat. anno [Domini?] 1782 — the word Domini is uncertain in the transcription.]


    [Translator''s note: A word or words are missing in the source before "through the Honourable Ludwik
    Borzeski," likely describing Orławski''s mode of citation.]


    concerning the condemnation objected from that side, obtained on 11 September 1780 at the field inspection
    held at the estate of Grab pursuant to the Tribunal decree, on the part of the Right Honourable Stanisław
    Chełmski, Treasurer of Wschowa, against the Most Honourable Antoni Prusimski, Starost of Niszczewice,
    to his advantage, for the contravention of the Tribunal decree and the production of documents:


    [Translator''s note: Lat. in lucro — "to his advantage/profit"; a standard legal phrase indicating
    the condemnation accrued to Chełmski''s benefit.]


    the present ordinary general session of the Crown Tribunal of Piotrków holds the Most Honourable Prusimski,
    Starost of Niszczewice, to be bound to demonstrate his right of standing, and that immediately; and
    since he does not demonstrate it but rather submits himself to the moderation of the court, thereby
    constituting his right of standing for himself, the same Most Honourable Prusimski, for the condemnation
    objected against him,


    [Translator''s note: Lat. judicio praesenti ordinarium generale Tribunalis Regni Petricoviensis...
    censet — the syntax is strained; judicio praesenti functions either as a dative of reference or as
    an unusual nominative. The sense is that the present court pronounces this ruling.]'
- page: 3
  en: 'shall pay fourfold fourteen Polish marks — half to the objecting party and half to the court —
    immediately, under the customary penalty to be extended from the register of penalties; and sentences
    the same Most Honourable Prusimski to have right of standing, and orders the parties to proceed to
    pleading.


    During the pleading, the resolution of the matters alleged by the Right Honourable Chełmski — namely
    of a certain manifest as if made before the records of the Poznań Municipal Court, and of its production
    — being meanwhile suspended, the court orders the parties to introduce their case.


    In the formal pleading, the citations of the parties being as follows: namely those of the Most Honourable
    Antoni of Kolno Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanisław, against
    the Right Honourable Stanisław Chełmski, Treasurer of Wschowa, and Jan Orławski, Boundary Surveyor
    of the Dobrzyń Land, and also the Most Honourable and Most Reverend Benedykt Lubstowski, Abbot of
    the Ląd Convent of the Cistercian Order, and the entire [convent] —


    [Translator''s note: The document uses "Orławski" here and "Orłowski" in later passages. "Orławski"
    is followed at first occurrence; the variant is recorded.]


    all prejudicial acts being annulled, for the determination of the mounds in accordance with the line
    placed on the map by the prior act of the court, and a field inspection to be assigned for the purposes
    of the erection of the aforementioned mounds; and the restriction of prejudicial acts, but the legitimate
    acts being adjudged as inviolable; the extension of penalties imposed against the Right Honourable
    Chełmski for the discrepant sentence obtained, and against the Ląd Convent on account of a manifest
    lodged in the records against the post-commissarial decree —


    in Konin on the 18th of September.


    On the opposing side, citations of the Right Honourable Stanisław Chełmski, Treasurer of Wschowa,
    against the Most Honourable Antoni Prusimski, Starost of Niszczewice, and also the Right Honourable
    Jakub Górski, Boundary Surveyor of Inowrocław: the act of the Inowrocław field office being annulled,
    and one olęder left on the estate of Łukom in accordance with the resolution of the prior decree of
    that court, for the marking of the wall boundary between the estates of Łukom'
- page: 4
  en: 'and Trąbczyn; and for the production of a certain manifest as if made before the records of the
    Poznań Municipal Court against the decree of the Gniezno Municipal Court office; the extension of
    penalties both against the Most Honourable Prusimski and against the field office; and the cassation
    of an illegally obtained process —


    in Konin on Monday after the Feast of the Exaltation of the Holy Cross.


    A second [citation] of the same substance, at the castle of Radziejów; all recognised in the present
    year.


    In the settling of the controversies of the parties: namely of the Most Honourable Prusimski, Starost
    of Niszczewice, Knight of the Order of Saint Stanisław, who stands by the decree issued between himself
    and the Right Honourable Chełmski by the prior court on Wednesday after the Feast of Saint Agnes,
    Virgin and Martyr in the present year —


    [a decree] determining the raising of the wall mounds between the estates of Łukom and Trąbczyn in
    accordance with the line placed on the map, from the centre of the corner mounds to the centre of
    the axial mounds; and assigning the recovery of possession of the olędry handed over by the Right
    Honourable Chełmski on his own account, except for one olęder left to the Right Honourable Chełmski;
    and having the force of immovability from the bind of the 1776 constitution; and by virtue of the
    decree inserted above, the recovery of possession [gap in source] having followed on the 6th of March
    at the estate of the olędry, as attested by the act of the field inspection office;


    [Translator''s note: A word or words are missing in the source before "having followed on the 6th
    of March."]


    alleging that the re-demarcation of the aforementioned estates, after the cutting of the line in accordance
    with the line placed on the map, and its verification made by the Boundary Surveyors'' field inspection
    offices of Inowrocław and Dobrzyń on 27 May in the present year, had not been effected on account
    of the discrepancy of these offices, arising from the matter as if the olęder estate adjudicated to
    the Right Honourable Chełmski by the above-mentioned decree by the line placed on the map were in
    existence, and hence on account of the non-conformity of the map;'
- page: 5
  en: 'establishing nevertheless, by a judicial inspection made at his request on 23 February at the estate
    of Trąbczyn by the Court Summoner and two noblemen and recorded in the Konin court records on 10 June
    of the present year, that the existence of this olęder, or his ground by the burning of the same,
    is on the side of the Right Honourable Chełmski; and explaining that the map, with regard to the line
    placed upon it by the decree, is verified, as the aforementioned discordant acts show; and concluding
    that the execution of the aforementioned decree of that court in the raising of wall mounds, in accordance
    with the line so often mentioned, should be effected, notwithstanding the recovery of possession of
    Martin Hunt on behalf of the Right Honourable Chełmski by the above-mentioned field inspection act;
    and demanding that penalties on account of the litigation brought against the aforementioned decree
    — both against the Right Honourable Chełmski and against the Reverend Ląd Convent, on account of the
    manifest lodged against the said decree in the Poznań municipal court records on Wednesday after the
    Feast of the Nativity of Saint John the Baptist in the present year, and also against the Dobrzyń
    field inspection office for having produced a discrepant sentence, be extended; and that the payment
    of the sums adjudged by the aforementioned decree, together with penalties, be imposed for the lifting
    of the process; and explaining that the manifest now claimed to have been lodged by the Right Honourable
    Chełmski as if before the records of the Poznań Municipal Court in his name against the act of recovery
    of possession, and carried into the field inspection decrees as a notation, had in fact been made
    before the records of the Kowal Municipal Court on 27 March of the present year, and not before the
    Poznań court, and had been falsely noted as such in the aforementioned decrees.


    On the other side, the Right Honourable Chełmski, Treasurer of Wschowa, alleging that one olęder had
    been adjudicated to him by the previously alleged decree of the prior court by the line placed on
    the map, and the recovery of possession thereof determined in his favour;'
- page: 6
  en: 'but showing this straight line to be unfindable on the ground on his side for completing the act
    of re-demarcation in accordance with the tenor of the decree noted above, through the discrepant acts
    of the field offices; and alleging that the referral in this point by the Dobrzyń Boundary Surveyor''s
    office on account of the non-conformity of the map to his court had been legitimately made; and explaining
    that the judicial inspection of the burned farmsteads of the olęder, presented as evidence, proves
    nothing, from the fact that by the bind of the above-mentioned decree the olęder was adjudicated to
    him without any mention being made of the said burning; and demanding the execution of the whole of
    the said decree, with only one olęder left on his side; and demanding penalties in respect of the
    manifest as if made in the Poznań Municipal Court records laid down by the Most Honourable Prusimski
    at the field decrees and noted in them, but not existing in those same records, as the searches attest;
    and demanding that distinct penalties on account of the caused discrepancy, against both the Most
    Honourable Prusimski and the official who had ordered an improvement of the line beyond the rule of
    the Tribunal decree, be imposed; and finally concluding that the Ląd Convent — having withdrawn from
    the aforementioned manifest made against the decree, by a withdrawal made before the records of that
    court on the 16th of the present month by the Honourable Ignacy Gzowski in the name of the same convent
    — be declared exempt; and that the penalty claimed by the Most Honourable Prusimski on this point
    be removed —


    all of which having been heard and understood.


    Since it has been brought to that court''s knowledge that the cause of the boundaries between the
    estates of Trąbczyn of the Most Honourable Prusimski on the one side, and the estates of Łukom of
    the Right Honourable Chełmski'
- page: 7
  en: 'on the other side, ventilated by the parties over a long period of time in various courts, had
    been adjudicated by a commission designated by the Estates of the Realm, which had issued two decrees
    discrepantly and in default; and that both parties, by force of the law of 1776, had come to that
    prior court by mutual agreement for the relief of the commissarial decrees issued in default and discrepantly;
    and that in that prior court a final decree, and by the disposition of the said law immovable, had
    been issued on 23 January of the present year, to the personal appearance of both parties.


    By which decree, settling in the first and original suit of the boundaries, having read the many sworn
    inquiries conducted at various sessions of the field inspections, and drawn up both [sets of] commission
    [records], the corner junction of these estates of Trąbczyn and Łukom with the estates of Drzewce,


    and also the axial junction of the same estates with the estates of Biskupice, had been determined
    and demonstrated on the map; and in this point the commissarial decree issued by the commissioners
    engaged on the part of the Most Honourable Prusimski had been approved; and from this corner junction
    of the estates of Drzewce, as the starting point, the wall of the said estates of Trąbczyn and Łukom
    as far as the axial junction with the estates of Biskupice, as the terminal point, had been constituted
    by a straight line drawn on the map by the same prior court and signed by the hands of the Most Honourable
    President and Marshal; and for the purposes of erecting wall mounds, and also demolishing the mounds
    erected by the commissioners of the Right Honourable Chełmski — both the corner mounds and the wall
    mounds —


    and in the case of the Most Honourable Prusimski, the wall mounds only; for the axial mounds and corner
    mounds'
- page: 8
  en: 'erected by the commissioners of the Most Honourable Prusimski under the commissarial decree of
    1775 had been approved and nothing was to be done to them; a field inspection of the courts or field
    offices had been assigned, and those same courts or offices had been ordered to erect wall mounds
    along the line placed on the map; and in the subsequent action for the recovery of possession of the
    olędry whom the Right Honourable Chełmski had occupied beforehand by way of a delivery of possession,
    a separate field inspection by the office of the Gniezno Municipal Court had been adjudged; and the
    recovery of possession of those olędry had been ordered to be carried out by that same office on behalf
    of the Most Honourable Prusimski, except for one olęder demonstrated on the map by the line on the
    part of the Right Honourable Chełmski; and by virtue of that same court''s decree, this recovery of
    possession of the olędry — except for one freeborn olęder, the Freeborn Martin Hunt, who had been
    as if adjudicated to the Right Honourable Chełmski by the resolution of that prior court — had been
    carried out on behalf of the Most Honourable Prusimski, Starost of Niszczewice, by the notarial office
    of the Gniezno Municipal Court, as attested by the act done at the olęder estate on Wednesday after
    the Sunday Oculi of Lent, namely the 6th of March of the present year, registered in the Konin Municipal
    Court on the 18th of the same month and year.


    In the session of the boundary field inspection in the pine forest beside the three mounds — two,
    namely, of the estates of Trąbczyn and Łukom, and the third of the neighbouring estate of Drzewce
    — erected by force of the 1775 commission, on Monday after the Feast of the Holy and Undivided Trinity,
    namely the 27th of May'
- page: 9
  en: 'of the present year, assigned by that same decree — the Boundary Surveyors'' field offices of Inowrocław
    and Dobrzyń, engaged by the parties, executing the prescription of the above-mentioned decree of that
    court, had ordered the sworn geometer to complete the straight line — in accordance with the line
    placed on the map by that court — from the centre of the corner mounds of the estates of Trąbczyn,
    Łukom, and Drzewce to the centre of the axial mounds of the same estates with the estates of Biskupice,
    for the purposes of erecting wall mounds distinguishing these estates of Trąbczyn, or Trąmpczynek,
    or Nowa Wieś, from the estates of Łukom; and the same straight line had been completed by the sworn
    geometer in accordance with the prescription of the Tribunal decree, and had been reviewed and confronted
    by the Boundary Surveyors'' field inspection offices.


    But because after this line had been made by the geometer, the freeborn olęder Martin Hunt, left to
    the Right Honourable Chełmski by the notarial office of the Gniezno Municipal Court, was not found
    on the right side — namely on the estate adjudicated to him — on this occurrence the field inspection
    offices had disagreed with one another, the Dobrzyń Boundary Surveyor''s office having referred this
    matter to the present court by its act registered in Pyzdry on 21 June.


    But the Inowrocław [office] — as attested by its act registered in the Konin Municipal Court on 8
    June — having declared the improvement of the line made by the geometer to conform with the line on
    the map, as declared by both offices, had premeditated beyond the prescription of the Tribunal decree,
    indeed in contradiction of the decisive line, and had instructed the geometer to make this improvement
    so that'
- page: 10
  en: 'the place where the olęder Jan had been at the time of the 1775 commission and the making of that
    map — burned four years previously — should be left on the right side on behalf of the Right Honourable
    Chełmski; but the Right Honourable Chełmski had refused this improvement of the line; and on this
    occurrence the matter had come to that court.


    In this regard, although the Right Honourable Chełmski, heir of the estates of Łukom with appurtenances,
    protecting himself by the above-mentioned decree of the prior court — for the reason that one olęder,
    designated by that same decree to the field inspection office for the recovery of possession, seems
    to have been ordered to be left to him and as if adjudicated — desires the wall boundary of his estates
    of Łukom with the estates of Trąbczyn to be formed such that the said olęder stands on the right side
    of the wall line and exists on its own estate; and having regard to that olęder decided in his favour,
    demands clarification or in some manner an improvement of the rule of the prior court''s decree, and
    objects to the erroneous drafting of the map.


    Since, however, it is established that sworn geometers are obliged to measure geometrically and express
    accurately on maps only the boundary lines of the parties, any signs found on them, and other principal
    ones close to those same lines, and also those which decrees expressly order; and that they were concerned
    to note only geographically any other more remote signs and also villages; and were not bound in the
    notation of villages to undertake an artificial measurement of how far one farmstead is from another
    — and similarly, as regards the matter at issue, the Most Illustrious and Most Reverend Woronowski,
    Canon of Łęczyca, Privileged and Sworn Geometer,'
- page: 11
  en: 'had noted only geographically the farmsteads of the olędry, situated in the middle between the
    parties'' boundary lines, much at variance with one another, and remote; but when this map made by
    him — as regards the boundary lines and the principal signs — had been presented undisputably before
    the prior court by the Most Honourable Prusimski, that prior court, settling the disputes between
    the parties, having found and established the cardinal signs also demonstrating undoubted corner junction
    and axial junction, had placed on this map the wall boundary line from the corner junction to the
    axial junction, namely from centre to centre; and had pre-commissioned the same line to be executed
    on the ground as accurately as possible by the sworn geometer, for the erection of mounds, to the
    execution of the courts or Sub-chamberlain offices; but having regard to the olęder noted only geographically
    on the right side of the placed line — on the assumption that the same olęder would fall to the estate
    of Łukom by the line to be completed on the ground — for the purpose of shortening the process, an
    amount having been fixed by way of reckoning and a term for the recovery of possession of the olędry
    prefixed before the field act, so that another calculation would not afterwards arise from the possession
    of those same occupied olędry — had ordered this olęder to be left, to the notarial office of the
    Gniezno Municipal Court designated for the recovery of possession, on behalf of the Right Honourable
    Chełmski; but had not regarded the same olęder as a point through which the line passes.


    Therefore, taking as already established the above-mentioned post-commissarial decree of the prior
    court, declared immovable by the positive law of 1776, and taking into account that although the farmstead
    of the olęder as if residing [there] appears on the map on the right side of the line, it is not found
    on the ground — yet the same estate on which the surface had appeared exists immovably in its place;'
- page: 12
  en: 'and the Tribunal''s resolution concerning the olęder in no way can obstruct the boundary cause
    finally determined by the made line and the determined corner junctions and axial junctions.


    And the same olęder is recognised as belonging to the Right Honourable Chełmski by no other right;
    and it orders the rule of that same decree to be fully fulfilled and observed.


    Both acts issued by the Boundary Surveyors'' field offices, noted above, being cassated, for the purposes
    of executing the so often mentioned decree of the prior post-commissarial court it finds a field inspection
    of the Most Honourable Sub-chamberlains, or of their Boundary Surveyors, to be necessary — a sworn
    geometer also having first been engaged — [to be drawn] from Gniezno, or from Wschowa, or from Brest
    Kuyavia, or from Płock, or Sieradz, or Wieluń, or Rawa, or Gostynin, or Łomża, or Czersk, or Warsaw
    — to be engaged within six weeks from the act of the present decree to the disputed estate of Trąbczyn
    and the place of the above-mentioned corner junction.


    The Most Honourable Sub-chamberlain, or field Boundary Surveyor — provided that one has been engaged
    by any party — shall order, or he shall order, the repositioning of the map authorised by the Tribunal
    court, by the Most Honourable Prusimski; and with it reposited, beginning from the three corner mounds
    of the estates of Trąbczyn, Łukom, and Drzewce erected by the commissioners of the Most Honourable
    Prusimski at the act of the 1775 commission — namely from the centre of those mounds — as far as the
    axial junction of those same estates of Trąbczyn, Łukom, and Biskupice, they shall order, or he shall
    order, the sworn geometer to complete the straightest possible line in accordance with the prescription
    of the same Tribunal decree; and in that line'
- page: 13
  en: 'they shall erect, or he shall erect, wall mounds only, not touching the corner mounds and axial
    mounds.


    And whatever shall remain on the right side of that line and those mounds — all of that they shall
    determine, or he shall determine, to serve the estate of Łukom; and whatever on the left side — all
    of that [to serve] the estate of Trąbczyn, or Nowa Wieś; the mounds erected in 1775 by the commissioners
    engaged on the part of the Right Honourable Chełmski — both corner mounds and axial mounds and wall
    mounds — and also the distinct wall mounds erected by the commissioners of the Most Honourable Prusimski,
    they shall demolish, or he shall demolish, and shall level to the ground, or shall level; and they
    shall determine, or he shall determine, these boundaries as to endure in perpetuity; and all of this
    notwithstanding any party''s default or withdrawal, and no regard being had to an opposition of citations
    or an appeal, they shall fulfil and conclude, or he shall fulfil and conclude.


    The penalty of fourteen Polish marks — to be compensated by party to party, and to the court at half
    by each party, under the customary penalty to be extended from the register of penalties — to be paid.


    [Translator''s note: Lat. Luita paena quatuordecim marcarum Polonicalium parti per partem compensanda
    judicio suo per medium ab utraque sub solito rigore ex registro paenalium extendendo solvenda. A standard
    rubric formula specifying the fourteen-mark penalty payable by each party — half to the opposing party
    and half to the court. Two variant forms occur later in this section: sub distincto rigore (under
    a distinct penalty) and with an immediacy requirement (in instanti).]


    Since it is clear from the acts of the field offices that the Freeborn olęder Martin Hunt in no way
    stands on the right side of the line determined by the Tribunal court, and cannot belong to the Right
    Honourable Chełmski, yet that the Right Honourable Chełmski has possessed that same olęder until now:


    Therefore, notwithstanding the act of recovery of possession noted above, issued by the notarial office
    of the Gniezno Municipal Court, it ordains that the said Right Honourable Chełmski shall return and
    restore that same Freeborn olęder Martin Hunt to the possession of the Most Honourable Prusimski'
- page: 14
  en: 'within six weeks from the act of the present decree, to the present commissioner of the Greater
    Poland Voivodeship to be engaged by the Most Honourable Prusimski; and rather that same Honourable
    Commissioner shall transfer and release that same olęder to the Most Honourable Prusimski into actual
    possession at a calculated reckoning; the Right Honourable Chełmski being subject, in case of contravention,
    to outlawry to be published before that same Honourable Commissioner.


    [Translator''s note: Lat. praeciso calculo — "at a calculated/exact reckoning," implying the transfer
    is to be made after an accounting of revenues has been settled.]


    The penalty of fourteen Polish marks — to be compensated by party to party, and to the court at half
    by each party, under a distinct penalty to be extended from the register of penalties — to be paid.


    And nonetheless, insisting upon the above-mentioned decree of the prior court, it sentences:


    That the same Right Honourable Chełmski, Treasurer of Wschowa, shall pay — without interest, as a
    sum from the revenue received from the olędry — the sum of six thousand one hundred and sixty-nine
    Polish florins and fourteen grosze; and also the discharged penalty of fourteen Polish marks, both
    ordered by that same decree of the prior court to be paid to the Most Honourable Prusimski; and also,
    on account of contravention of the same decree, a double principal surety bond; and also, for the
    lifting of the condemnation obtained in the satisfaction term — by the manifest made before the records
    of the Poznań Municipal Court on 25 June of the present year by the Most Honourable Prusimski on account
    of the contravention of the same decree — a single principal surety bond: all to be paid to the same
    Most Honourable Prusimski, or to his special plenipotentiary, on and for the 20th of January of the
    coming year 1783, before the office and records of the Poznań Municipal Court,'
- page: 15
  en: 'under outlawry in case of contravention, to be published concerning the manifest to be made; and
    to the court the half of those same surety bonds immediately under the customary penalty to be extended
    from the register of penalties, to be paid and genuinely counted out; and in the same term before
    the same records and under the same penalty, the Most Honourable Prusimski shall pay and genuinely
    count out to the Right Honourable Chełmski, or to his special plenipotentiary, the triple principal
    surety bond adjudicated to the Right Honourable Chełmski by the above-mentioned decree.


    The penalty of fourteen Polish marks — to be paid to the party at the term and under the penalties
    noted above, and to the court the half immediately under the customary penalty — finally resolving
    the suspension made above by that court regarding the production, claimed by the Right Honourable
    Chełmski, of a certain manifest:


    Since the Most Honourable Prusimski, from his personal appearance before the records of the Kowal
    Municipal Court on 27 March of the present year, sets forth a manifest for the cassation of the act
    issued by the notarial office of the Gniezno Municipal Court on account of the delivery into possession
    of the Freeborn Martin Hunt''s olęder improperly made to the Right Honourable Chełmski; and explains
    that it had been falsely noted in the field inspection act — by the office engaged on his part — that
    the same manifest had been made before the records of the Poznań Municipal Court, and not before the
    Kowal court. Therefore it declares the same Most Honourable Prusimski'
- page: 16
  en: 'free from any further alleged production.


    Since, moreover, the Boundary Surveyors'' field inspection offices — and namely the Right Honourable
    Górski, Boundary Surveyor of Inowrocław, engaged on the part of the Most Honourable Prusimski — are
    found to have presumed to improve for the geometer the line placed on the map by the prior court and
    determined by the Tribunal decree, beyond the intent and prescription of that Tribunal decree; and
    it having been established by the transactions on that day and act, as law requires, that the above-mentioned
    manifest had not been recorded in his act — it therefore decrees him to be subject to penalty.


    That, for the discharge of the foregoing, he shall enter the upper tower of Radziejów castle on and
    for the Monday after Invocavit Sunday of the coming year, and shall continue and complete his session
    there, without interruption, for the space of one week; and upon leaving the tower shall pay and genuinely
    count out a double principal surety bond to the Right Honourable Chełmski or his plenipotentiary before
    the same records of the Radziejów Municipal Court — under outlawry in case of contravention, both
    as regards the tower session and the payment of the surety bonds, to be published concerning the manifest
    to be made; and to the court a single principal surety bond under the customary penalty to be extended
    from the register of penalties; or rather the Most Honourable Prusimski, as his official, shall stand
    surety for the same Right Honourable Górski in the payment of the surety bonds adjudicated both to
    the part of the Right Honourable Chełmski and to the treasury of the court, at the term and under
    the penalties and before the records noted above. And the Right Honourable Orławski, Boundary Surveyor
    of Dobrzyń,'
- page: 17
  en: 'engaged on the part of the Right Honourable Chełmski, for the improper referral of the present
    cause to his court and for withdrawing from the execution of the Tribunal decree, and for raising
    a certain doubt as to the line placed by the Tribunal decree: shall pay to the Most Honourable Prusimski
    or his plenipotentiary, at the term and before the records and under the penalties noted above, a
    double principal surety bond, and to the court a single one, under the accustomed penalty to be extended
    from the register of penalties; or likewise the Right Honourable Chełmski shall stand surety for the
    same Right Honourable Orławski in the payment of those same marks — both [those] adjudicated to the
    Most Honourable Prusimski and those to be brought to the treasury of the court — under similar penalties
    before the said records and at the same term and under the same penalty.


    Finally, as regards the penalties claimed by the Most Honourable Prusimski against the Reverend Ląd
    Convent in respect of the above-mentioned post-commissarial Tribunal decree, through a manifest of
    accusation:


    Since that same manifest made before the records of the Poznań Municipal Court on Wednesday after
    the Feast of the Nativity of Saint John the Baptist, namely 26 June of the present year, by the Reverend
    Brother Thesselinus Małachowski attests only a certain diligence and does not accuse the same Tribunal
    decree; and the withdrawal from it by a separate manifest made before the records of that court on
    the 16th of the present month by the Honourable Ignacy Gzowski in the name of the same convent, is
    set forth — therefore it declares the same Reverend Ląd Convent free'
- page: 18
  en: 'from the claimed penalty, and pronounces this by force of the present decree.


    Antoni Siemiątkowski, Land Court Notary of the Sieradz Voivodeship, Deputy of the Crown Tribunal,
    and Acting Notary of the Greater Poland Voivodeship. By his own hand.


    Borzysławski, by his own hand; read by Ordęga.


    [Section 3 — Bridge Clause and Commencement of Field Execution]


    Encompassing and narrating the above-mentioned [matters], falling and arriving precisely on today''s
    date.


    [Translator''s note: Lat. Praemissa in se complectentem, et enarrantem praecise in diem hodiernam
    cadenti, et devenienti — a formulaic bridge clause linking the embedded Tribunal decree to the present
    field actum.]


    The court of the Boundary Surveyor''s field office of the Gniezno Voivodeship, by virtue of the Piotrków
    Crown Tribunal decree recently enrolled above, descended to the ground among the aforementioned estates
    described in the act, the Tribunal decree being encompassed [within it].


    And there, having established its jurisdiction — the peace and security of judicial acts being forewarned
    and guarded by the voice of the general Court Summoner of the realm, expressed by name at the head
    of the book — on account of the approaching evening, it adjourned its act to the following day, the
    29th of November, and ordered the same general Court Summoner of the realm to proclaim it.


    Then after the proclaimed act, the field office proceeding to the estate of Trąbczyn through the forest
    road, the Right Honourable Stanisław Chełmski, Treasurer of Wschowa, riding the same road, requested
    that the office record his personal appearance so that he not be bound by a process; which inscription
    the office promised to the Right Honourable Chełmski should he appear the next day. And on the following
    day, namely the 29th of November, having resumed its jurisdiction there, it ordered the parties to
    be called for the inscription of'
- page: 19
  en: 'their appearance.


    They having been called — and namely the Most Honourable Antoni of Kolno Prusimski, Starost of Niszczewice,
    Knight of the Order of Saint Stanisław, plaintiff and defendant, appearing personally — and even notwithstanding
    the default of the Right Honourable Chełmski, Treasurer of Wschowa, as precluded by the Tribunal decree
    — urging the execution of the decree, the execution of which has been pre-commissioned to the judgement
    of this office:


    The court of the present field office of the Gniezno Voivodeship — having declared that the appearance
    of the Right Honourable Chełmski, Treasurer of Wschowa, is to be noted should he arrive, but his present
    absence not being attended to — fulfilling the rule prescribed by the forenamed Tribunal decree, first
    of all compels the same Most Honourable Prusimski of Kolno, Starost of Niszczewice, to the immediate
    repositing of the map drawn up at the act of the 1775 commission, ratified by the post-commissarial
    Tribunal decree; and the Most Honourable Prusimski immediately reposited the said map with the line
    drawn by the Tribunal court beginning from the corner mounds of the estates of Trąbczyn, Łukomia,
    and Drzewce, extending to the axial mounds of those same estates of Trąbczyn and Łukom and Biskupice,
    and on one side signed by the hand of the Most Honourable and Most Reverend Sebastian Sierakowski,
    Count, Canon of Kraków Cathedral, Knight of Saint Stanisław, President; and on the other by the hand
    of the Most Honourable Ksawery Nałęcz Kęszycki, Castellan'
- page: 20
  en: 'of Gniezno, Marshal of the Crown Tribunal, as aforesaid subscribed; the court, having found satisfaction
    on this point, proceeding by the tenor of the Tribunal decree to the geometer engaged by the Most
    Honourable Prusimski, namely the Most Illustrious and Most Reverend Benedykt Woronowski, Canon of
    Łęczyca, by whom the above-mentioned map was drawn:


    to form the straightest possible line in accordance with the prescription of the post-commissarial
    Tribunal decree — the present court intimates.


    The aforesaid Most Illustrious and Most Reverend geometer formed the line — also prepared in the previous
    field inspection act, which had not been effected on account of the discrepancy of the field offices,
    by the driving of rods into the ground — and filled in certain missing rods in the cut line. The court
    of the present field office descended to the review of the said line and its confrontation with the
    reposited map; having reviewed it, since it is brought to that court''s knowledge that the said line
    from the corner junction to the axial junction has been formed in the straightest possible manner
    in accordance with the intent of the post-commissarial Tribunal decree:


    Therefore, executing the intent of the said Piotrków Crown Tribunal decree at the present time, it
    declares that it proceeds to the raising or erection of mounds — and in the boggy places to the driving-in
    of stakes — in the line designated by the Tribunal court. Finally, evening approaching that same day,
    it ordered its act to be proclaimed to the following day; and likewise on the 30th of November — namely
    Saturday, that being the very'
- page: 21
  en: 'feast of Saint Andrew the Apostle — having resumed its jurisdiction; and the Most Honourable and
    Most Reverend Benedykt Lubstowski, Abbot, and also the Reverend Ląd Convent of the Sacred Cistercian
    Order, having been cited, appearing in person through the Religious and Very Reverend Paweł Wybieralski,
    Prior, in his own name and in the name of the Most Honourable Abbot and the Reverend Convent; but
    the Right Honourable Chełmski, Treasurer of Wschowa, still absent — the court of the field office,
    executing the sentence delivered the previous day, commenced the erection of mounds.


    Beginning indeed from the centre of the corner mounds, in the act of specification, [with] the straight
    line formed, at a distance of ten pręty — each [mound] comprising eight and a half łokcie — [they
    erected] the first wall mound, or guardian of the corner junction.


    [Section 4 — Mound-Erection Record]


    Day 1: 30 November 1782


    The 1st [wall mound] — from which, proceeding along the same line, extended geometrically toward the
    south, at a distance of 20 pręty, a similar 2nd; after it at a similar distance:


    The 3rd, 4th, 5th, 6th, 7th, 8th — from which [i.e., from the 8th mound], entering into the boggy
    place called stawisko, densely overgrown with various trees: the cut line at a distance of ten pręty
    on the edge of that same marshy ground, in place of a mound, [he drove] alder stake the 1st; from
    which at a similar distance of ten pręty, oak stake the 2nd; then again oak:


    [Translator''s note: Lat. palum quaercinum alterum demum quercinum — "oak stake the 2nd; then [also]
    oak." Demum functions as a continuative particle. The full sequence of stake types is: 1 alder, 2
    oak, 3–5 alder, 6 oak, 7–9 alder, 10–11 oak, 12–15 alder, 16 oak, 17 alder, 18 oak (Day 1); 19 oak,
    20 alder, 21 oak, 22 alder, 23 oak, 24 alder, 25 oak, 26 alder, 27 oak, 28–31 alder at marsh edge
    (Day 2).]


    The 3rd, 4th, 5th — again alder; the 6th — again oak; the 7th, 8th, 9th — then alder; the 10th and
    11th — oak; the 12th, 13th, 14th, 15th — alder; the 16th — oak; the 17th — alder;'
- page: 22
  en: 'the 18th — oak.


    The 18th having been driven in, the court of the present office ordered its jurisdiction to be proclaimed
    for the 2nd of December.


    Day 2: 2 December 1782


    On that day arriving: oak stake the 19th; from which, in a higher place, or ground and estate accustomed
    to be ploughed, in place of a stake, wall mound the 9th; from which again in a boggy place at a similar
    distance, alder stake


    the 20th; from which oak the 21st; again alder the 22nd; then oak the 23rd; after it alder the 24th;
    oak the 25th; likewise alder the 26th; the 27th — oak;


    the 28th, 29th, 30th, 31st — at the edge of the muddy ground, alder — all notched in four directions,
    he caused to be driven in.


    [Translator''s note: Lat. omnes in quatuor partes obsecatos — "all notched in four directions." Stakes
    were notched in four directions as a standard practice to distinguish them as legal boundary markers.]


    From the 31st stake, leaving those same boggy places and entering into the high pine forest, and crossing
    the road from the village of Łumowo — as the people say — running to the Trąbczyn olędry, at a distance
    of ten pręty from the last-mentioned stake, in the same line, not deviating in anything whatsoever:
    again wall mound the 10th; from which at a distance of twenty pręty, the 11th, the 12th, the 13th
    — around the hilly place; after it, on the other side of that same hilly place, the 14th — and on
    that same day the Right Honourable Stanisław Chełmski, Treasurer of Wschowa, appearing personally,
    in whose presence the court of the present office [erected] the 15th, 16th, then the 17th and 18th
    — at the equal distance described above — where, evening approaching, it ordered its act likewise
    to be proclaimed to the following day, namely'
- page: 23
  en: 'the 3rd of December, by the general Court Summoner of the realm.


    Day 3: 3 December 1782


    And again on that same following day, jurisdiction having been resumed, proceeding to the continuation
    of the erection of mounds — in this same line and at a similar distance: the 19th, 20th, 21st, 22nd,
    23rd, 24th, 25th, 26th, 27th, 28th, 29th, 30th, 31st, 32nd, 33rd, 34th, 35th, 36th, 37th, 38th, 39th,
    40th — at the equal distance set out above; from which at a distance of fifteen pręty, in a place
    showing signs of moisture, the 41st — this being at a distance of twelve and a half pręty from the
    centre of the axial mounds of those same estates of Trąbczyn, Łukom, and Biskupice — those [axial
    mounds] being left untouched —


    all in the high pine forest, each comprising six square łokcie, newly raised from the ground with
    the placement of metallic signs — namely into each one: five stones in the sign of the Holy Cross,
    pieces of burned brick, broken glass, and charcoal.


    And [the court] made known that whatever remains on the right side of that line and the recently erected
    mounds — all of that is to serve the estate of Łukom; and whatever on the left side — all of that
    [is to serve] the estate of Trąbczyn or Nowa Wieś; and determined these boundaries as to endure in
    perpetuity.


    Demolition of Prior Mounds


    And so, after the foregoing had been completed, it proceeded to the demolition of the mounds — both
    those erected in 1775 by the commissioners engaged on the part of Chełmski, and also the distinct
    wall mounds erected by the commissioners'
- page: 24
  en: 'of the Most Honourable Prusimski — in accordance with the prescription of the Piotrków Crown Tribunal
    decree by whose authority the present act is carried out; and first of all ordered the demolition
    of the mounds erected as above by the commissioners engaged on the part of the Right Honourable Chełmski
    — both corner mounds and axial mounds and also wall mounds — and likewise those erected on the part
    of the Most Honourable Prusimski by the commissioners: the wall mounds only; and ordered the stakes
    to be extracted from the ground, and the metallic signs [placed in the mounds] in the customary manner
    to be extracted from those same mounds; and declared the said mounds, levelled to the ground, as null
    and void.


    And having fulfilled everything committed to it by the Tribunal decree enrolled above, it concluded
    the force of the present act, no one contradicting.


    Franciszek Ksawery Rawicz Jasiński of Jasień, Boundary Surveyor of the Gniezno Voivodeship. By his
    own hand.'
- page: 25
  en: '[Section 5 — Registration and Presentation of the Condescensorial Decree]


    The Honourable Leon Maszewski, appearing in person at the office and present records of the Konin
    Municipal Court in the name of the party whose interest it concerns, presented to the present office
    — to be entered in the acts and left in the original in these records — the condescensorial boundary
    decree issued and subscribed between the parties named below by the boundary surveyor''s office of
    Gniezno, of the following tenor, to be inserted.


    The original of the above-mentioned decree has been left here among the present records for the sake
    of perpetuity and sewn into them.


    In Konin, Saturday on the vigil of the Feast of the Immaculate Conception of the Most Blessed Virgin
    Mary, namely the 7th of December in the year of the Lord 1782.'

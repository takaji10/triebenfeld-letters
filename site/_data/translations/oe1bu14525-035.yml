- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our gracious greeting first, honourable
    Councillor, dear and faithful subject. We hereby inform you, upon your application of the 13th of
    this month concerning the making of the resignation of all the Betsche estates and those situated
    in Cujavia belonging to His Serene Highness and Lordship the Prince of Hohenlohe-Ingelfingen, that
    the Chamber fiscal officer Beyer has already received the requisite instructions for this making of
    the resignation of the Treasury. We remain graciously disposed towards you.


    Posen, the 20th February 1802. Royal South Prussian War and Domains Chamber. Münling[uncertain: Münling]


    To the Princely Hohenlohe Building and Economy Councillor Mr Wilh. Glenck at Breslau'

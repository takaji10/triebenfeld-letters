- page: 1
  en: 'Document no. 1478


    Wyrzbenta, castellan of Poznań and the same general captain of Poland, 31 May 1362, at Konin; attests
    that Laurentius, heir of Królikowo, castellan of Ląd, sold the third part of the estate of Wrąbczyn
    to the monastery of Ląd.


    Poznań. Royal State Archive. Ląd, Liber privilegiorum B, no. 20.


    We, Wyrzbenta, castellan of Poznań and also general captain of Poland, wish to commend to the notice
    of the present and to the memory of the future, in these presents, that there came before us and the
    other nobles of the land of Poland the valiant knight Lord Laurentius, heir of Królikowo and castellan
    of Ląd; not compelled, not forced, nor led astray by any kind of fraud or deceit, but by the mature
    counsel of his friends had over this, to the religious man Lord Jan, by divine mercy abbot, and to
    his monastery in Ląd of the Cistercian Order, he sold, gave and resigned for all time the third part
    of the estate commonly called Magnum Wronchyno, with all and singular the uses and all the revenues
    belonging to the same third part of the same estate, which the said Lord Laurentius, castellan of
    Ląd, had held peaceably and quietly for three years, for fifty-six marks of ready groschen, counting
    twenty-four scotos for each mark and two groschen for the scotus, by hereditary right and the title
    of ownership, to be possessed, held, had, sold, exchanged, resigned and turned to such uses as shall
    seem good, quietly and peaceably, as it shall seem better or more useful to the said Lord Jan, abbot,
    and his abbey of Ląd. In testimony of this matter the impress of our seal is hung upon these presents.
    Done and given at Konin on the third day within the octave of the Lord''s Ascension, in the year of
    his birth 1362, in the presence of these witnesses and lords: Wacław the treasurer, Presprawo, banner-bearer
    of Kalisz, Lasczone the under-huntsman, Marcin, burgrave of Konin, Jaszko called Menczyc, and many
    others worthy of trust.


    Krolikowo, Królikowo. Landensis, of Ląd. Magnum Wronchyno, Wrąbczyn.'

- page: 2
  en: 'lose, who would have cheated Your Serene Highness more than too grossly. He engages himself to
    issue a written undertaking that he will cede Koschentin, just as he should acquire it, to Your Serene
    Highness, or to whomever Your Serene Highness should command. He believes that Your Serene Highness
    would obtain it for still under 600000 Rthl – only no person must suspect that Your Serene Highness
    or Prince August wished to keep Koschentin. May Your Serene Highness write to me upon this in secret
    Your declaration of will, for the old man does what I advise him. As to the papers, may Your Serene
    Highness deign to send them with the utmost haste, for I know of no expedient for meeting the costs;
    the instrument, however, must be drawn up just as I have prescribed it, otherwise it must come to
    nothing. In deepest reverence I remain


    Your Serene Highness''s


    Blizanow


    the 18th of July 1812


    most humble and obedient


    v. Triebenfeld'

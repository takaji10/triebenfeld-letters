status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! My messenger was held up for 2 days and, being
    a blockhead, is only returning today. I am therefore sending the stupid beast by another route, and
    report to Your Serene Highness that old Weigel arrived here with me already today. He has not only
    the best will to conclude the lease contract, but he has disclosed to me that, following my advice,
    he is not averse to purchasing the Zagorow estates. He assumes the debts and pays a further 200000
    Rthl on top, which he wishes to set off against Koschentin. In this, however, he advises that the
    matter be kept secret, and that Koschentin be put up for compulsory auction. He bids for it as a creditor
    and hopes to obtain it below the assessed value; what is thereby lost, we lose to Stössel
- page: 2
  en: 'lose, which would have cheated Your Serene Highness far too grievously. He engages himself to issue
    a written undertaking that he will cede Koschentin, just as he should acquire it, to Your Serene Highness,
    or to whomever You should command. He believes that You would obtain it for under 600000 Rthl — only
    no soul must suspect that Your Serene Highness or Prince August wished to keep Koschentin. Let Your
    Serene Highness write me Your intention on this in secret, for the old man does what I advise him.
    As for the papers, may Your Serene Highness be pleased to send them with the greatest haste, for I
    know no way of meeting the costs; the instrument, however, must be drawn up just as I have prescribed,
    otherwise it must come to nothing. Reverentially I remain Your Serene Highness''s

    Blizanow, the 18th of July 1812

    most humble and obedient

    v Triebenfeld'

segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    My messenger was held up 2 days and, being a blockhead, returns only today. I am therefore sending
    the Demme beast by another route, and report to Your Serene Highness that old Weigel arrived here
    with me already today. He has not only the best will to conclude the lease contract, but he has disclosed
    to me that, following my advice, he is not disinclined to purchase the Zagorowo estates. He assumes
    the debts and pays a further 200000 Rthl on top, which he wishes to set off against Koschentia. In
    this matter, however, he advises that the business be kept secret, and that Koschentin be put up for
    compulsory auction. He offers as creditor and hopes to obtain it below the assessed value; what is
    thereby lost to us, Stössel'

  en: '235


    Most Serene Prince


    Most gracious Prince and Lord!


    My messenger was held up 2 days and, being a blockhead, is only returning today. I am now sending
    the stupid beast by another road, and report to Your Serene Highness that old Weigel arrived here
    with me already today. He not only has the best will to conclude the lease contract, but he has disclosed
    to me that, following my advice, he is not disinclined to purchase the Zagórów estates. He assumes
    the debts and pays a further 200000 rth on top, which he wishes to set off against Koszęcin. In this
    matter, however, he advises keeping the affair secret and letting Koszęcin go to forced auction. He
    bids for it as a creditor and hopes to obtain it below the valuation; what is then lost, us Stoesel'

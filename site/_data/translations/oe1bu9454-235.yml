- page: 2
  en: 'to lose, which would have cheated Your Serene Highness more than too badly. He engages himself
    to issue a written undertaking that he will cede Koszęcin, just as he should acquire it, to Your Serene
    Highness, or to whomever You should command. He believes that You would obtain it for still under
    600000 rt — Only no soul must suspect that Your Serene Highness or Prince August wished to keep Koszęcin.
    Let Your Serene Highness write me Your will in this matter in secret, for the old man does what I
    advise him. As for the papers, may Your Serene Highness deign to send them with the utmost haste,
    for I know no counsel as to how to meet the costs; but the instrument must be drawn up as I have prescribed,
    otherwise it must be nothing. In reverence I remain


    Your Serene Highness''s


    Blizanow


    the 18th of July 1812


    most humble and obedient


    v Triebenfeld'

- page: 3
  en: 'power of attorney of the 5th of April 1804, according to which he is authorised by the communities
    of Stalluhn, Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin,


    in like manner as Młynkiewicz, to conclude a contract.


    After negotiations carried on between the parties, and after the heads of agreement of the 16th of
    July 1804 had been brought in, and the personal capacity of the appearing parties to conclude contracts
    was subject to no doubt, the contract was taken down as follows.


    §. 1. His Most Serene Highness the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, Governor
    of Breslau, General Inspector of Infantry and Knight of the great Royal Prussian Orders, as hereditary
    lord of the lordship of Betsche situated in the district of Meseritz, makes over to the burgesses
    of the town of Betsche and the inhabitants of the villages of Kulligowo, Stalluhn, Schartzig, Stocki,
    Schwiechodezin, Lowin, all the demesne farms, fields, gardens, meadows, marsh, lakes, ponds, pond-sites,
    rivers, pastures, heaths, fallows, forests, woods, thickets, scrub, money and payments in kind belonging
    to them, the propination rights, the'

    6., 72000 Rthl which are already intabulated for the banker Meyer Bernhard at Frankfurt an der Oder,
    and the interest thereon at 5 per cent is settled up to the 26th of July


    of this year, as with the other capitals; and they promise to discharge these sums to the creditors
    and to come to agreement with them thereon.


    7, 137,000 Rthl. The deputies stipulate to remit forthwith, out of the remainder of the purchase and
    hereditary-tenure sum, thirty-five thousand Reichsthaler to His Most Serene Highness at Breslau, carriage
    free, but the remainder of 8000 Rthl at the term of Midsummer next year, together with 5 per cent
    interest, without fail, if it be called in at the proper time.


    The aforementioned 35000 Rthl shall be paid in this manner: tomorrow, the 29th of July, 7000 Rthl,
    and a week from tomorrow the remaining 28000 Rthl shall be paid, and indeed the 7000 Rthl shall be
    sent carriage free to Breslau at the cost of the payers.'

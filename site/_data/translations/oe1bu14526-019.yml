  en: '§ 14. This contract shall be binding for all time upon His Most Serene Highness the Prince of Hohenlohe-Ingelfingen
    for himself and for His Highness''s heirs and successors, as also on the part of the town and village
    communities. And the canon or ground-rent of 1000 Rthl payable annually shall be paid in half-yearly
    instalments of 500 Rthl, namely each time at the term of Christmas and the term of Midsummer, yearly,
    sub paena executiones, and sent to Breslau carriage paid.


    §. 15. So long as the communities do not alienate or dismember the parcels of land and rights made
    over to them, the Status Passivat remains in its present condition. But as soon as the demesne farm
    is dismembered, the hereditary purchasers are bound to have the intabulated items transferred to their
    own parcels of land and cancelled in the name of His Most Serene Highness.'

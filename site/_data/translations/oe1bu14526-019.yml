- page: 8
  en: 'If among the moneys to be paid there are heavy Dutch milled ducats, these shall be accepted at
    4 Groschen agio per ducat. Should the communities not pay the 28000 Rthl a week from tomorrow, that
    is on the 5th of August, then the whole contract concluded this day ceases, and the communities are
    bound to pay the costs occasioned, but shall receive the 7000 Rthl back again, however without interest.


    § 4. The handing over follows as soon as the 28000 Rthl which are to be paid on the 5th of August
    are paid; since however the former tenant von Bornstädt is still in possession of the demesne farm
    here, and a suit is pending over his eviction, the communities do not indeed insist that possession
    of the demesne farm be given up to them forthwith, but are rather content that he remain therein until
    the judgment of eviction is legally in force, and that he be evicted only when the judgment of eviction
    is legally in force; but the communities shall for this be given by the Prince, His Serene Highness,
    a fair and appropriate compensation suited to the matter.


    As regards on the other hand the forests, these shall be closed forthwith, just as'

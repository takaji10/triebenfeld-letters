  en: 'Therewith the proceedings were closed, the protocol read out, interpreted by the sworn interpreter
    Echaust to the deputies of the community, who are not fully conversant with the German language and
    who had forbidden the keeping of a protocol in the Polish language, approved and signed.


    Johann Wilhelm Glenck


    H. Chmara, in his own hand. M. Młynkiewicz. Echaust.


    Metzig


    Neumann.


    Since now an authenticated official copy was needful and has also been requested, the present official
    copy is issued in witness thereof under Our seal and signature. — Thus done at Betsche, the 7th of
    December 1804. Princely Hohenlohe-Ingelfingen court office Betsche. Metzig,


    justiciary


    (L. S.)


    Neumann


    clerk of the court'

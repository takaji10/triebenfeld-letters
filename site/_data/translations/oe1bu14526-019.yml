- page: 4
  en: 'and distilling rights, brick and lime kilns, the Obra demesne farm, in short each and every profitable
    right and prerogative which His Serene Highness the Prince of Hohenlohe has hitherto used and enjoyed
    as proprietor, and may, can and shall enjoy, in Pausch und Bogen, by whatever name they may be called,
    and in particular also the right of sale over the village mayors'' holdings and demesne farms granted
    under hereditary quit-rent tenure, excepting the jurisdiction and the transfer fees (Laudemium), and
    the hunt, which His Most Serene Highness, as superior proprietor and permanent ground-lord of Betsche,
    reserves for Himself and for His most high successors — as their true hereditary property, in such
    wise and manner that the said town commune of Betsche and the mentioned places may, can and shall
    deal therewith as with their true property, may sell the same, [uncertain: sell it back], make gift
    of it, for a



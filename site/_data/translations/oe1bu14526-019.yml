- page: 8
  en: '[Since] among the moneys to be paid there are heavy Dutch milled ducats, these are to be accepted
    at 4 Groschen agio per piece. Should the communities not pay the 28000 Rthl a week from tomorrow,
    that is on the 5th of August, then the whole contract concluded today lapses, and the communities
    are bound to pay the costs occasioned, but receive the 7000 Rthl back again, though without interest.


    §. 4. The handing over follows as soon as the 28000 Rthl which are to be paid on the 5th of August
    have been paid; but since the former tenant von Bornstädt is still in possession of the demesne farm
    here, and a suit for his eviction is pending, the communities do not insist that possession of the
    demesne farm be made over to them forthwith, but are rather content that he remain therein until the
    judgment of eviction has legal force, and that he be evicted only when the judgment of eviction has
    legal force; but the communities shall for this be given a fair and suitable compensation proportionate
    to the matter by His Serene Highness the Prince.


    As regards the forests, on the other hand, these shall be closed forthwith, just as'

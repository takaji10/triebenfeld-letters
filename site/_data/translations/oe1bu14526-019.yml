  en: 'With this the proceedings were closed, the protocol read out, and - the deputies of the community,
    who are not entirely conversant with the German language, having forbidden the keeping of a protocol
    in the Polish language - interpreted by the sworn interpreter Echaust, approved and signed.


    Johann Wilhelm Glenck


    H. Chmara, in his own hand. M. Młynkiewicz. Echaust.


    Metzig


    Neumann.


    Since now an authenticated engrossment is needful, and has also been requested, the present engrossment
    is issued in witness thereof under Our seal and signature - Thus done at Betsche, the 7th of December
    1804. Princely Hohenlohe-Ingelfingen Court Office Betsche. Metzig,


    Justiciary


    (L. S.)


    Neumann


    Actuarius'

    of one thousand Reichsthaler in Courant according to the same coinage standard.


    3. With the payment of the purchase and hereditary-tenure sum it shall be held in this manner. The
    town and the remaining village communities take over, ad rationes pretii, the mortgage debts named
    hereafter, intabulated upon the lordship of Betsche in the mortgage book of the Royal Government at
    Posen, namely


    1, 48000 Rthl entered for the building councillor Glenck, of which sum 36000 Rthl are ceded to the
    banker Salomon Nathan junior at Berlin and 12000 Rthl to the banker Meyer Bernhard at Frankfurt an
    der Oder.'

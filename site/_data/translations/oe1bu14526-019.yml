- page: 4
  en: 'and distilling rights, brick and lime kilns, the Obra demesne farm — in short each and every profitable
    right and privilege which His Serene Highness the Prince of Hohenlohe has hitherto used and enjoyed
    as proprietor, and can, may and shall enjoy, in Pausch und Bogen, by whatever name they may be called,
    and in particular also the right of sale over the village mayors'' holdings and demesne farms granted
    out on hereditary quit-rent tenure, excepting the jurisdiction and transfer fees (Laudemium) and the
    hunt, which His Most Serene Highness, as superior proprietor and perpetual ground-lord of Betsche,
    reserves for Himself and His most high successors — to be their true hereditary property, in such
    manner and so that the said town commune of Betsche and the aforementioned villages may deal with
    it as with their true property, may sell, redeem and give it away, can, may and shall do so, for a


    § 2. duly agreed purchase and hereditary-tenure sum of one hundred and eighty thousand Reichsthaler'

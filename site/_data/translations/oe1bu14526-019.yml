- page: 14
  en: '§ 14. This contract shall be binding for all time upon His Most Serene Highness the Prince of Hohenloh-Ingelfingen
    for himself and his most high heirs and successors, as also on the side of the town and village communities.
    And the canon or ground-rent of 1000 Rthl to be paid annually shall be paid in half-yearly instalments
    of 500 Rthl, namely each time at the term of Christmas and the term of Johannis Baptista, yearly,
    sub paena executiones, and sent to Breslau carriage free.


    §. 15. So long as the communities do not alienate or dismember the parcels of land and rights made
    over to them, the Status Passivorum remains in its present condition. But as soon as the demesne farm
    is dismembered, the hereditary purchasers are bound to have the intabulated items transferred onto
    their parcels of land, and to have them cancelled in the name of His Most Serene Highness.'

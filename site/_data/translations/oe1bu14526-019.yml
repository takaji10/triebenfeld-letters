- page: 3
  en: 'power of attorney of the 5th of April 1804, according to which he, by the communities of Stalluhn,
    Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin,


    in like manner as Młynkiewicz, is authorised to conclude a contract.


    After negotiations conducted on both sides, and after the points settled of the 16th of July 1804
    had been produced, and the personal capacity of the parties appearing to conclude contracts was subject
    to no doubt, the contract was drawn up as follows.


    § 1. His Most Serene Highness the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, Governor
    of Breslau, Inspector General of Infantry and Knight of the Royal Prussian Great Orders, as hereditary
    lord of the lordship of Betsche situated in the district of Meseritz, makes over to the burgesses
    of the town of Betsche and the inhabitants of the villages of Kulligowo, Stalluhn, Schartzig, Stocki,
    Schwiechodezin, Lowin all the demesne farms, fields, gardens, meadows, marsh, lakes, ponds, pond-sites,
    rivers, pastures, heaths, waste grounds, forests, woods, coppices, thickets belonging to them, money
    and produce rents, the propination rights, brewing'

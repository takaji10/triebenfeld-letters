- page: 2
  en: 'and Kontop, as His Highness''s friend and assistant.


    2. The burgess and town representative Matheus Młynkiewicz as authorised representative of the burgesses
    of Betsche,


    3. The free village mayor Johann Chmara of Stalluhn as authorised representative of the village communities
    of Stalluhn, Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin, with the motion that a contract
    be taken down between His Most Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, the burgesses
    of Betsche, and the above-named village communities, upon the basis of the heads of agreement dated
    Alt Schartzig, the 16th of July 1804. The Princely Hohenlohe authorised representative, building councillor
    Johann Wilhelm Glenck, produced the [uncertain: due] power of attorney of the Prince of Hohenlohe
    of the 26th of April 1803, according to which the same is authorised to conclude contracts in valid
    form; of which power of attorney a certified copy was taken into these records.


    In like manner Młynkiewicz presented a judicially issued power of attorney of the 5th of April 1804,
    according to which he is authorised to conclude, in the name of the town, a contract with His Serene
    Highness the reigning Prince of Hohenlohe over all the parcels of land and profitable rights belonging
    to the lordship of Betsche.



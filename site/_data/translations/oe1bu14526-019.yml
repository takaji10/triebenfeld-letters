- page: 9
  en: 'they now already are, and the timber felled therein, in so far as it has not been felled for the
    working of the estate, remains the property of His Serene Highness the Prince of Hohenlohe.


    §. 5. All the manorial dwelling, farm, forest and other buildings are likewise made over to the communities
    as their heritable property; the communities are however bound to leave the foresters the dwelling
    of one room in the foresters'' houses until Michaelmas of the current year, as also the use of their
    gardens. His Serene Highness also reserves the castle as the seat of the court, as the dwelling of
    the court servant, and as the dwelling for His Highness himself or his commissioners, together with
    a stabling for 2 horses, which they themselves shall maintain in repair. In the case of building work
    on this building the communities are bound to let His Serene Highness the Prince of Hohenlohe-Ingelfingen
    and his successors have the bricks at cost price, and to furnish the timber for the building work
    from the heath free of charge. The communities are likewise bound to furnish'
  names:

status: draft
segments:
- page: 1
  en: 'No. 93.


    We, the Princely Hohenloh-Ingelfingen Court and of the Lordship of Betsche, make known and hereby
    give notice to each and every man, but especially where it is needful to know, that there appeared
    before Us:


    1. the Princely Hohenlohe-Ingelfingen Director of Estates and General Plenipotentiary, Baurath Johann
    Wilhelm Glenk, on the one part;


    2. likewise the plenipotentiaries of the town and rural communes, namely of the town of Betsche, the
    villages Staluhn, Schaertzig, Schwiechodezin, Stocki, Lowin and Kulligowo:


    a) the burgher and town representative Matheus Młynkiewicz;


    b) the free village-mayor (Freyscholze) Johann Chmara; and that they have concluded a hereditary-lease
    contract over the estates of the Lordship of Betsche, as the proceedings of the 28th of July of the
    current year, and likewise the supplement of the 29th of July of the current year, set forth more
    fully, reading thus: Actum Betsche, the 28th of July 1804. There appeared


    1. the Princely Hohenlohe-Ingelfingen General Plenipotentiary, Baurath Glenk, who brought with him
    the Councillor of War and Forests von Triebenfeld, hereditary lord of Schweinern,'
- page: 2
  en: 'and of Kontopp, as His Most Serene Highness''s own friend and assistant [text as written: "Zügen"],
    together with:


    2. the burgher and town representative Matheus Młynkiewicz, as plenipotentiary of the burghership
    of Betsche;


    3. the free village-mayor Johann Chmara of Stalluhn, as plenipotentiary of the village communes Stalluhn,
    Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin, with the motion that a contract be taken down
    between His Most Serene Highness the reigning Prince of Hohenlohe Ingelfingen, the burghership of
    Betsche, and the above-named village communes, upon the basis of the heads of agreement dated Alt
    Schartzig, the 16th of July 1804. The Princely Hohenlohe plenipotentiary, Baurath Johann Wilhelm Glenk,
    produced the aforesaid power of attorney of the Prince of Hohenlohe of the 26th of April 1803, according
    to which he is authorised to conclude contracts in valid form; of which power of attorney a vidimated
    copy was taken to these acts.


    In like manner Młynkiewicz handed in a judicially executed power of attorney of the 5th of April 1804,
    according to which he is authorised, in the name of the town, to conclude a contract with His Serene
    Highness the reigning Prince of Hohenlohe over all the parcels of land and profitable rights belonging
    to the Lordship of Betsche.


    Likewise Chmara handed in a judicially'
- page: 3
  en: 'executed power of attorney of the 5th of April 1804, according to which he is authorised by the
    communes Stalluhn, Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin,


    in like manner as Młynkiewicz, to conclude a contract.


    After negotiations conducted on both sides, and after the heads of agreement of the 16th of July 1804
    had been produced, and the personal capacity of the parties appearing to conclude contracts was subject
    to no doubt, the contract was taken down as follows.


    § 1. His Most Serene Highness the reigning Prince Friedrich Ludwig zu Hohenlohe Ingelfingen, Governor
    of Breslau, General Inspector of the Infantry and Knight of the Royal Prussian Great Orders, as hereditary
    lord of the Lordship of Betsche situated in the Meseritz district, makes over to the burghership of
    the town of Betsche and the inhabitants of the villages Kulligowo, Stalluhn, Schartzig, Stocki, Schwiechodezin,
    Lowin all the demesne farms belonging to them, fields, gardens, meadows, marsh, lakes, ponds, pond-sites,
    rivers, pastures, heaths, waste grounds (Lehden), forests, woods, thickets, brushwood, money and payments
    in kind, the propination rights, the brewing'
- page: 4
  en: 'and distilling rights, brick and lime kilns, the Obra demesne farm — in short, each and every profitable
    right and privilege which His Serene Highness the Prince of Hohenlohe has hitherto used and enjoyed
    as owner, and may, can and shall enjoy — in Pausch und Bogen, by whatever names they may be called,
    and in particular also the right of sale over the village-mayoralties (Scholtiseyen) and demesne farms
    granted out on hereditary quit-rent terms; excepting the jurisdiction and the Laudemien, and the hunt,
    which His Most Serene Highness reserves to Himself as supreme owner and perpetual ground-lord of Betsche,
    and to His successors — as their true hereditary property and possession, in such manner and so that
    the said town commune of Betsche and the mentioned localities may deal therewith as with their true
    property, may, can and shall sell, [uncertain: rettauflichen] and give the same away; for a


    § 2. duly agreed purchase and hereditary-tenure sum of one hundred and eighty thousand Reichsthaler'
- page: 5
  en: 'in Royal Prussian Courant according to the coinage standard of 1764, and an annual ground-rent
    of one thousand Reichsthaler in Courant according to the same coinage standard.


    3. With the payment of the purchase and hereditary-tenure sum it shall be held in this manner. The
    town and the remaining village communes take over, ad Rationes Pretii, the mortgage debts named below,
    intabulated upon the Lordship of Betsche in the mortgage book of the Royal Government at Posen, namely:


    1. 48000 Rthl entered for Baurath Glenk, of which sum 36000 Rthl have been ceded to the banker Salomon
    Nathan junior at Berlin and 12000 Rthl to the banker Meyer Bernhard at Frankfurth a/O.'
- page: 6
  en: '48000 Rthl


    2. 2000 Rthl, which are entered for the merchant Abraham Moses Hirschel at Breslau.


    3. 5000 Rthl, which are intabulated for the Freiherr von der Marwitz at Budnik and have been ceded
    to the banker Meyer Bernhard at Frankfurth a/O.


    4. 5000 Rthl, which are intabulated for the widowed Ober-Amtsräthin Christiana Dorothea Michaelis,
    née Eichborn.


    5. 5000 Rthl, which are intabulated for Baurath Johann Wilhelm Glenk, and have been ceded by him to
    the banker Meyer Bernhard at Frankfurth; all which items from No. 2 to 5 have already been called
    in by the creditors and are payable at Christmas of the current year.


    Whereby it is noted that the interest on the 48000 Rthl has been settled up to the 2nd of July of
    this year, but that on the remaining capitals up to the 26th of July.'
- page: 7
  en: '65000 Rthl


    6. 72000 Rthl, which are already intabulated for the banker Meyer Bernhard at Frankfurth a/O, and
    the interest at 5 per cent settled up to the 26th of July of this year, as with the remaining capitals;
    and they promise to settle these sums with the creditors and to come to agreement with them thereon.


    7. 137,000 Rthl. The deputies stipulate to settle, out of the remainder of the purchase and hereditary-tenure
    sum, thirty-five thousand Reichsthaler forthwith to His Most Serene Highness at Breslau, carriage-free,
    but the remainder of 8000 Rthl at the term of St John of next year, together with 5 per cent interest,
    without fail, if it be called in at the proper time.


    The above-mentioned 35000 Rthl shall be paid in this manner: tomorrow, the 29th of July, 7000 Rthl,
    and a week from tomorrow the remaining 28000 Rthl shall be paid; and indeed the 7000 Rthl shall be
    sent carriage-free to Breslau at the cost of the payers.'
- page: 8
  en: '[text as written, opening word truncated:] "ven" — if among the moneys to be paid there are heavy
    Dutch rim-ducats (Rand-Ducaten), these shall be accepted at 4 gg. agio per ducat. Should the communes
    not pay the 28000 Rthl a week from tomorrow, that is on the 5th of August, then the whole contract
    concluded today ceases, and the communes are bound to pay the costs occasioned, but shall receive
    the 7000 Rthl back again, however without interest.


    § 4. The transfer shall follow as soon as the 28000 Rthl, which are to be paid on the 5th of August,
    are paid; since, however, the former tenant von Bornstaedt is still in possession of the local demesne
    farm, and a suit is pending over his eviction, the communes do not indeed insist that possession of
    the demesne farm be surrendered to them forthwith, but will rather be content that, until the eviction
    judgment has force of law, he remain therein, and that only when the eviction judgment has force of
    law shall he be evicted; yet the communes shall for this be given a fair and appropriate indemnification
    suited to the matter by His Serene Highness the Prince.


    As regards the forests, on the other hand, these shall be closed forthwith, just as'
- page: 9
  en: 'they now already are, and the timber felled therein, in so far as it has not been felled for the
    estate economy, remains the property of His Serene Highness the Prince of Hohenlohe.


    § 5. All the manorial dwelling, farm, forest and other buildings are likewise made over to the communes
    hereditarily and in property; yet the communes are bound to leave the foresters their dwelling in
    one room in the forester''s houses until Michaelmas of the current year, as also the use of their
    gardens. His Serene Highness likewise reserves the castle as the seat of the court, the dwelling of
    the court servant, and a dwelling for Himself or His commissioners, and also a stabling for 2 horses,
    which they shall themselves maintain in good structural repair. In the case of building works upon
    this edifice, the communes are bound to let His Serene Highness the Prince of Hohenlohe Ingelfingen
    and his successors have the bricks at cost price, and to furnish the timber for the construction free
    of charge from the heath. The communes are likewise bound to furnish, free of charge from the heath,
    the wood needed for the heating'
- page: 10
  en: 'of the court room and of the court servant, and to cart it thither. In like manner the communes
    are also bound, when His Most Serene Highness or His commissioners are present here, to furnish the
    necessary firewood free of charge and to cart it thither.


    § 6. As regards the timber-purchase contracts concluded between His Most Serene Highness and certain
    merchants, He promises to settle with the timber purchasers, without the communes contributing anything
    thereto.


    § 7. The town and village communes mentioned at the outset bind themselves, upon alienations of their
    parcels of land, to render 10 per cent Laudemium out of the purchase sum to His Most Serene Highness
    and His successors in possession. From this Laudemium, however, those holdings are excepted which
    the'
- page: 11
  en: 'communes now wish to lay out anew; but if these be sold in future, then the Laudemium of 10 per
    cent shall likewise be rendered thereof.


    § 8. Further, His Most Serene Highness reserves to Himself:


    that if He Himself, or His successors in possession, should come hither, or should send their commissioners
    hither, the communes are bound to render the relay-cartage (Vorspannfuhren) up to a distance of 4
    miles, out and back.


    § 9. Further, His Serene Highness reserves to Himself, should He obtain the right of patronage over
    the church of Betsche, that right of patronage; yet the town and village communes shall have the right
    to elect the clergyman and to put him forward in nomination, which nominated clergyman His Most Serene
    Highness promises to present to the episcopal Consistory.


    § 10. The suits between the commune of Stocki and the Prince of Hohenlohe concerning ownership of
    the Stocki marsh; between the'
- page: 12
  en: 'Prince of Hohenlohe and the possessor of Zie[uncertain: lomipat] concerning the right of redemption;
    and between the Landrath von Schmaling as possessor of the demesne farm in Głazewo and His Serene
    Highness of Hohenlohe concerning confirmation of the privilege; as also the suit between the Prince
    of Hohenlohe and Hertzig in Lowino concerning the restitution of the [uncertain: Schales tro] — these
    the communes take over at their own risk and cost, and whatever they may win in litigation or obtain
    by way of settlement falls to the communes, without His Serene Highness having the least claim thereto.


    § 11. The Competenz taxes and other public and further dues and burdens hitherto rendered by His Serene
    Highness as Dominium of Betsche, by whatever names they may be called — among which belong also the
    sick-transport cartage into the Schillner and Punctner Hauland, as also the cartage for fetching and
    conveying away the court, and by whatever other names they may be called — the said town and village
    communes take over; and the latter cannot, should these dues be increased in future, demand any compensation
    from the Prince'
- page: 13
  en: 'of Hohenlohe, His Serene Highness. The communes also take over the contribution of fifty Reichsthaler
    which His Most Serene Highness promised to render to the town school here for 1 year.


    § 12. Both contracting parties bind themselves to have this contract published before the competent
    authorities and to seek confirmation thereof; and His Most Serene Highness herewith makes Himself
    liable to exert Himself to the best of His ability that this contract be confirmed by the competent
    authorities, and that the consent to the further dismemberment of the parcels of land made over to
    them be granted to the communes.


    § 13. As soon as the tradition of the local demesne farm and of the Obra demesne farm has taken place,
    there shall at the same time be handed over to the town and village communes that livestock and farm
    inventory which is sold along with the purchase and hereditary-tenure sum, in the number in which
    the tenant von Bornstaet received the same in the year 1800 upon the transfer.


    § 14.'
- page: 14
  en: '§ 14. This contract shall be binding for His Most Serene Highness the Prince zu Hohenloh-Ingelfingen
    for Himself and for His heirs and successors, as also on the part of the town and village communes,
    for all time. And the canon or ground-rent of 1000 Rthl to be paid annually shall be rendered in half-yearly
    instalments of 500 Rthl, namely each time at the term of Christmas and the term of St John the Baptist,
    yearly, sub paena executiones, and sent to Breslau carriage-free.


    § 15. So long as the communes do not alienate or dismember the parcels of land and rights made over
    to them, the Status Passivorum remains in its present condition. But as soon as the demesne farm is
    dismembered, the hereditary purchasers are bound to have the intabulated items transferred onto their
    own parcels of land, and to have them cancelled in the name of His Most Serene Highness.'
- page: 15
  en: '§ 16. For the stipulated canon of 1000 Rthl yearly all the communes are liable in solidum, and
    they consent to its entry in the mortgage book against their parcels of land; just as, on the other
    hand, His Most Serene Highness also consents that this present contract be entered in the mortgage
    book of the Dominium of Betsche and its appurtenances.


    § 17. Finally, the contracting parties renounce each and every objection, by whatever names they may
    be called; in particular the town and village communes renounce the plea of laesio enormis (injury
    beyond the half), which was explained to them to this effect:


    that if the agreed purchase and hereditary-tenure sum should exceed the true value of the parcels
    of land and rights made over by double, then they would by that means'
- page: 16
  en: 'the withdrawal from the contract be free to them.


    § 18. His Most Serene Highness reserves to Himself the supreme supervision over the forests, which
    he will entrust to the Royal Chief Forester Feller; and the communes bind themselves to indemnify
    him for his exertions, and to come to agreement with him thereon. Therewith, as nothing further was
    to be brought forward, the proceedings were closed, the protocol read out, interpreted by the sworn
    interpreter Echaust to the deputies of the town and village communes, who are not fully conversant
    with the German language, and who had forbidden the keeping of a separate side-protocol in the Polish
    language, approved and signed; whereupon it was further noted by the contracting parties that the
    costs of the taking down,'
- page: 17
  en: 'expedition, publication and confirmation shall be borne in half by both parties. Read out, approved
    and signed; read by myself and approved. Johann Wilhelm Glenk, Princely Hohenlohe Ingelfingen General
    Plenipotentiary. Peter Friederich August von Triebenfeld. Jan Chmara, as authorised representative.
    Matheus Młynkiewicz, authorised representative, plenipotentiary.


    Josef Echaust as interpreter. Metzig,


    Justitiarius.


    Neumann,


    Actuarius. Actum Betsche, the 29th of July 1804. Today there appeared


    1. the Princely Hohenloh-Ingelfingen General Plenipotentiary, Baurath Johann Wilhelm Glenk; likewise
    the special'
- page: 18
  en: 'plenipotentiary of the burghership, Matheus Młynkiewicz, and the plenipotentiary Chmara of the
    communes Kulligowo, Stalluhn, Schartzig, Stocki, Schwiechodezin, Lowin, and they bring the following
    to the contract taken down yesterday.


    § 1. His Serene Highness the Prince of Hohenlohe assures the communes that, apart from the mortgage
    capitals already called in, none shall be called in within half a year.


    § 2. The town and village communes bind themselves, in the event of criminal investigations arising,
    to bear the costs of investigation for ever, in so far as the remaining communes belonging to the
    Betsche Schlüssel are not themselves bound to bear the same.'
- page: 19
  en: 'Thereupon the proceedings were closed, the protocol read out, interpreted by the sworn interpreter
    Echaust to the deputies of the commune, who are not fully conversant with the German language, and
    who had forbidden the keeping of a protocol in the Polish language, approved and signed.


    Johann Wilhelm Glenk


    H. Chmara mpp. M. Młynkiewicz. Echaust.


    Metzig


    Neumann.


    Since now an authenticated engrossment was needful and has also been requested, the present engrossment
    is issued in witness thereof under Our seal and signature. — Thus done, Betsche, the 7th of December
    1804. Princely Hohenlohe-Ingelfingen Court Office Betsche. Metzig,


    Justitiarius.


    (L. S.)


    Neumann,


    Actuarius.'

  en: 'No. 93.


    We, the Princely Hohenlohe-Ingelfingen court office and of the lordship of Betsche, do hereby make
    known and declare to each and every man, but especially where it is needful to know, that there appeared
    before Us.


    1. the Princely Hohenlohe-Ingelfingen estate director and general attorney to him, the building councillor
    Johann Wilhelm Glenck, of the one part


    2. Likewise the authorised representatives of the town and rural communities, namely of the town of
    Betsche, the villages of Staluhn, Schaertzig, Schwiechodezin, Stocki, Lowin and Kulligowo,


    a) the burgher and town representative Matheus Młynkiewicz


    b) the free village mayor Johann Chmara, and have concluded a hereditary-lease contract over the estates
    of the lordship of Betsche, as the proceedings of the 28th of July of the current year, and likewise
    the supplement of the 29th of July of the current year, set forth more fully, reading thus: Actum
    Betsche, the 28th of July 1804. There appeared


    1., the Princely Hohenlohe-Ingelfingen general attorney, the building councillor Glenck, who brought
    with him His Most Serene Highness''s Councillor of War and Forests von Triebenfeld, hereditary lord
    of Schweinern,'

    and the interest at 5 per cent on which has been settled up to the 26th of July


    of this year, as with the remaining capitals; and they promise to settle these sums with the creditors
    and to come to agreement with them thereupon.


    7, 137,000 Rthl. The deputies stipulate to remit at once, out of the remainder of the purchase and
    hereditary-tenure sum, thirty-five thousand Reichsthaler to His Most Serene Highness at Breslau, carriage
    paid, but the remainder of 8000 Rthl at the term of Midsummer of the coming year, together with 5
    per cent interest, without fail, if it is called in at the proper time.


    The 35000 Rthl mentioned above are to be paid in this manner: tomorrow, the 29th of July, 7000 Rthl,
    and a week from tomorrow the remaining 28000 Rthl will be paid; and the 7000 Rthl are to be sent carriage
    paid to Breslau at the cost of those paying.'

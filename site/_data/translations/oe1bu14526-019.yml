- page: 4
  en: 'brewing and distilling rights, brick and lime kilns, the Obra demesne farm, in short each and every
    profitable right and privilege which His Serene Highness the Prince of Hohenlohe has hitherto as proprietor
    used and enjoyed, and also may, can and shall enjoy, in Pausch und Bogen, by whatever names they may
    be called, in particular also the right of sale over the village mayors'' holdings and demesne farms
    granted out at hereditary quit-rent tenure — excepting the jurisdiction and transfer fees (Laudemium),
    and the hunt, which His Most Serene Highness, as superior proprietor and permanent ground-lord of
    Betsche, reserves for Himself and for His Highness''s successors — as their true hereditary property,
    in such manner and wise that the said town commune of Betsche and the aforementioned places may deal
    with it as with their true property, may, can and shall sell, [uncertain: redeem] and give it away,
    for a



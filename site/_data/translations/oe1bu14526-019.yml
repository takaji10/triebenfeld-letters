- page: 2
  en: 'and Kontop, as His most highly esteemed friend and assistant, [text lost/unparseable]


    2. The burgess and town representative Matheus Młynkiewicz, as authorised representative of the burgesses
    of Betsche,


    3. The free village mayor Johann Chmara of Stalluhn, as authorised representative of the village communities
    of Stalluhn, Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin, with the motion to record a contract
    between His Most Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, the burgesses of Betsche,
    and the village communities named above, upon the basis of the points settled, dated Alt Schartzig
    the 16th of July 1804. The Princely Hohenlohe authorised representative, the building councillor Johann
    Wilhelm Glenck, produced the said power of attorney of the Prince of Hohenlohe of the 26th of April
    1803, by which the same is authorised to conclude contracts in valid form, of which power of attorney
    a certified copy was taken to these acts.


    In like manner Młynkiewicz handed in a judicially issued power of attorney of the 5th of April 1804,
    by which he is authorised to conclude, in the name of the town, a contract with His Serene Highness
    the reigning Prince of Hohenlohe over all the parcels of land and profitable rights belonging to the
    lordship of Betsche.



- page: 11
  en: 'communities now wish to lay out anew; but if these are sold in the future, the transfer fee is
    likewise to be paid thereon at 10 per cent.


    §. 8. Further, His Most Serene Highness reserves to himself:


    That, should He himself, or his successors in possession, come hither, or should they send their commissioners
    hither, the communities are bound to furnish the relay carriages to a distance of 4 miles, out and
    back.


    §. 9. Further, His Serene Highness reserves to himself, should he obtain the right of patronage over
    the church at Betsche, that right of patronage; but the town and village communities shall have the
    right to choose the clergyman and to put him forward in nomination, which clergyman so nominated His
    Most Serene Highness promises to present to the episcopal consistory.


    §. 10. The suits between the community of Stocki and the Prince of Hohenlohe over the ownership of
    the Stocki marsh; between the'

  en: 'authorised representative of the burgesses, Matheus Młynkiewicz, and the authorised representative
    Chmara of the communities of Kulligowo, Stalluhn, Schartzig, Stocki, Schwiechodezin, Lowin, and they
    bring in the following in addition to the contract taken down yesterday.


    §. 1. His Serene Highness the Prince of Hohenlohe assures the communities that, apart from the mortgage
    capitals already called in, none shall be called in within half a year.


    §. 2. The town and village communities bind themselves, in criminal investigations that may occur,
    to bear the costs of investigation for ever, in so far as the remaining communities belonging to the
    Betsche key are not themselves bound to bear the same.'

- page: 8
  en: 'If among the moneys to be paid there are full-weight Holland rand ducats, these will be accepted
    with 4 Groschen agio per piece. Should the communities not pay the 28000 Rthl a week from tomorrow,
    that is on the 5th of August, then the whole contract concluded today lapses, and the communities
    are bound to pay the costs occasioned, but receive the 7000 Rthl back again, though without interest.


    §. 4. The delivery of possession follows as soon as the 28000 Rthl, which are to be paid on the 5th
    of August, have been paid; since however the former tenant von Bornstädt is still in possession of
    the demesne farm here, and a suit is pending over his eviction, the communities do not insist that
    possession of the demesne farm be yielded to them at once, but will rather be content that he remain
    therein until the judgment of eviction is final in law, and that he be evicted only when the judgment
    of eviction is final in law; for which, however, a fair and suitable compensation proportioned to
    the matter shall be given to the communities by His Serene Highness the Prince.


    As to the forests, on the other hand, these shall be closed at once, just as'

  en: 'of Hohenlohe, His Serene Highness. The communities also take over the contribution of fifty Reichsthaler
    which His Most Serene Highness promised to render to the town school here for 1 year.


    § 12. Both contracting parties bind themselves to have this contract published before the competent
    authorities and to seek confirmation of it; and His Most Serene Highness herewith makes himself answerable
    to exert himself as best he may that this contract be confirmed by the competent authorities, and
    that the consent be granted to the communities for the further dismemberment of the plots of ground
    made over to them.


    § 13. As soon as the delivery of possession of the demesne farm here and of the Obra demesne farm
    has taken place, there shall at the same time be handed over to the town and village communities that
    livestock and farm inventory which is sold together under the purchase and hereditary-tenure sum,
    in the same number as the tenant von Bornstädt received the same in the year 1800 at the handing over.


    § 14.'

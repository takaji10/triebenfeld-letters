    § 18. His Most Serene Highness reserves to himself the supervision over the forests, which he will
    commit to the Royal Chief Forester Feller; and the communities bind themselves to compensate the latter
    for his pains, and to come to agreement with him thereupon. With this, as nothing further was to be
    brought forward, the proceedings were closed, the protocol read out, and - the deputies of the town
    and village communities not being fully conversant with the German language, who had forbidden the

    § 1. The Prince of Hohenlohe, His Serene Highness, assures the communities that apart from the mortgage
    capitals already called in, none shall be called in within half a year.


    § 2. The town and village communities bind themselves, in criminal investigations that may occur,
    to bear for ever the costs of the investigation, in so far as the remaining communities belonging

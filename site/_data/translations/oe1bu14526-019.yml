- page: 14
  en: '§ 14. This contract shall be binding for all time upon His Most Serene Highness the Prince of Hohenlohe-Ingelfingen
    for himself and his most high heirs and successors, as also on the part of the town and village communities.
    And the canon or ground-rent of 1000 Rthl payable yearly shall be paid in half-yearly instalments
    of 500 Rthl, namely each time at the term of Christmas and the term of St John the Baptist, yearly,
    sub paena executiones, and sent to Breslau carriage free.


    § 15. So long as the communities do not alienate or dismember the plots of ground and rights made
    over to them, the status passivae remains in its present condition. But as soon as the demesne farm
    is dismembered, the hereditary purchasers are bound to have the intabulated items transferred onto
    their plots of ground and struck out in the name of His Most Serene Highness.'

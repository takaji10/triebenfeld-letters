  en: '§ 16. For the stipulated canon of 1000 Rthl yearly all the communities are liable in solidum, and
    they consent to the entry thereof in the mortgage book upon their plots of ground, just as on the
    other hand His Most Serene Highness consents that this present contract be entered in the mortgage
    book of the manorial lordship (Dominium) of Betsche and its appurtenances.


    § 17. Finally the contracting parties renounce each and every objection, by whatever name they may
    be called; in particular the town and village communities renounce the plea of injury beyond the half,
    which was explained to them to this effect:


    that if the agreed purchase and hereditary-tenure sum exceeded the true value of the plots of ground

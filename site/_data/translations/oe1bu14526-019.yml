  - '10'
- page: 11
  en: 'communities now wish to lay out anew; but if these be sold in future, the transfer fee shall likewise
    be paid thereon at 10 per cent.


    § 8. Further His Most Serene Highness reserves to himself.


    That, if He himself or his successors in possession should come hither, or should send their commissioners
    hither, the communities are bound to furnish the relay carriages up to a distance of 4 miles, out
    and back.


    § 9. Further His Serene Highness reserves to himself, should he obtain the right of patronage over
    the church at Betsche, the right of patronage; the town and village communities shall however have
    the right to choose the clergyman and to put him forward in nomination, which nominated clergyman
    His Most Serene Highness promises to present to the episcopal consistory.


    § 10. The suits between the community of Stocki and the Prince of Hohenlohe concerning ownership of
    the Stocki marsh, between the'

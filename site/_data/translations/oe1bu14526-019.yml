    3, 5000 Rthl which are intabulated for the Baron von der Marwitz of Budnik and have been ceded to
    the banker Meyer Bernhard at Frankfurt an der Oder.


    4, 5000 Rthl which are intabulated for the widowed senior district councillor''s wife Christiana Dorothea
    Michaelis, née Eichborn.


    5, 5000 Rthl which are intabulated for the building councillor Johann Wilhelm Glenck, and have been
    ceded by him to the banker Meyer Bernhard at Frankfurt, all which items from No. 2 to 5 have already
    been called in by the creditors and are payable at Christmas of the current year.


    Whereby it is noted that the interest on the 48000 Rthl has been settled up to the 2nd of July of
    the current year, but on the remaining capitals up to the 26th of July.'

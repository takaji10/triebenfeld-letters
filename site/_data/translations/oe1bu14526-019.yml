- page: 3
  en: 'power of attorney of the 5th of April 1804, by which he is, on the part of the communities of Stalluhn,
    Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin,


    in like manner as Młynkiewicz, authorised to conclude a contract.


    After negotiations conducted on both sides, and after the points settled of the 16th of July 1804
    had been brought in, and the personal capacity of the parties appearing to conclude contracts was
    subject to no doubt, the contract was recorded as follows.


    §. 1. His Most Serene Highness the reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen, Governor
    of Breslau, Inspector General of the Infantry and Knight of the Great Royal Prussian Orders, as hereditary
    lord of the lordship of Betsche situated in the district of Meseritz, makes over to the burgesses
    of the town of Betsche and the inhabitants of the villages of Kulligowo, Stalluhn, Schartzig, Stocki,
    Schwiechodezin, Lowin all the demesne farms belonging to him, fields, gardens, meadows, marsh, lakes,
    ponds, pond-sites, rivers, pastures, heaths, fallows, forests, woods, coppices, thickets, money and
    rents in kind, the propination rights, brewing'

- page: 10
  en: 'of the court room and of the court servant, and to cart it thither. In like manner the communities
    are also bound, when His Most Serene Highness or his commissioners are present here, to furnish the
    needful firewood free of charge and to cart it thither.


    §. 6. As regards the timber-purchase contracts concluded between His Most Serene Highness and certain
    merchants, His Highness promises to settle with the timber purchasers without the communities making
    any contribution thereto.


    § 7. The town and village communities mentioned at the outset bind themselves, on alienations of their
    parcels of land, to pay 10 per cent transfer fee (Laudemium) on the purchase sum to His Most Serene
    Highness and his successors in possession. From this transfer fee, however, those holdings are excepted
    which the'

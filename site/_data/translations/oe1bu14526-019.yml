    §. 17. Finally, the contracting parties renounce each and every objection, by whatever names they
    may be called; in particular the town and village communities renounce the objection of injury beyond
    the half, which was explained to them to this effect:


    that if the agreed purchase and hereditary-tenure sum exceeded the true value of the parcels of land

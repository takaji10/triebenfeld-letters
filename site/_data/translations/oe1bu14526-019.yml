  en: 'Prince of Hohenlohe. The communities also take over the contribution of fifty Reichsthaler promised
    by His Most Serene Highness to be made to the town school here for 1 year.


    §. 12. Both contracting parties bind themselves to have this contract published before the competent
    authorities and to seek its confirmation; and His Most Serene Highness hereby makes himself liable
    to use his best endeavours that this contract be confirmed by the competent authorities, and that
    the consent to the further dismemberment of the parcels of land made over to them be granted to the
    communities.


    §. 13. As soon as the delivery of possession of the demesne farm here and of the Obra demesne farm
    takes place, there shall at the same time be handed over to the town and village communities that
    livestock and farm inventory which is sold along under the purchase and hereditary-tenure sum, in
    the same number as the tenant von Bornstädt received the same in the year 1800 at the handing over.



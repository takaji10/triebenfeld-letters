status: draft
segments:
- page: 1
  en: 'No. 93.


    We, the Princely Hohenloh-Ingelfingen Court and of the lordship of Betsche, do hereby make known and
    give to be understood to each and every man, but especially where it is needful to know, that there
    appeared before Us:


    1. the Princely Hohenlohe-Ingelfingen [uncertain: ihn] estates Director and General Bevollmächtigter,
    Baurath Johann Wilhelm Glenk, of the one part;


    2. Likewise the Bevollmächtigte of the town and [uncertain: fand] communities, namely of the town
    of Betsche, the village of Staluhn, Schaertzig, Schwiechodezin, Stocki, Lowin and Kulligowo,


    a) the burgher and town representative Matheus Młynkiewicz


    b) the free Scholze Johann Chmara; and that they have concluded a hereditary-lease contract concerning
    the estates of the lordship of Betsche, as the proceedings of the 28th of July of the current year,
    and likewise the supplement of the 29th of July of the current year, more fully declare, reading thus:
    Actum Betsche, the 28th of July 1804. There appeared


    1. the Princely Hohenlohe-Ingelfingen General Bevollmächtigter, Baurath Glenk, who brought with him
    His Most Serene Highness''s Councillor of War and Forests von Triebenfeld, hereditary lord of Schweinern'
- page: 2
  en: 'and Kontopp, as his most highly esteemed friend and assistant, brought with him;


    2. The burgher and town representative Matheus Myłnkiewicz, as Bevollmächtigter of the burghership
    of Betsche;


    3. The free Scholze Johann Chmara of Stalluhn, as Bevollmächtigter of the village communities of Stalluhn,
    Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin, with the motion that a contract be taken down
    between His Most Serene Highness the reigning Prince of Hohenlohe Ingelfingen, the burghership of
    Betsche, and the above-named village communities, upon the basis of the points agreed, dated Alt Schartzig
    the 16th of July 1804.


    The Princely Hohenlohe Bevollmächtigter, Baurath Johann Wilhelm Glenk, produced the [uncertain: gehöret]
    power of attorney of the Prince of Hohenlohen of the 26th of April 1803, by which the same is authorised
    to conclude contracts in valid form; of which power of attorney a vidimated Copy was taken into these
    acts.


    In like manner Młynkiewicz presented a judicial power of attorney of the 5th of April 1804, according
    to which he is authorised, [uncertain: am Nachigen] of the town, to conclude with His Serene Highness
    the reigning Prince of Hohenlohe a contract concerning all the parcels of land and profitable rights
    belonging to the lordship of Betsche.


    Likewise Chmara presented a judicial'
- page: 3
  en: 'power of attorney of the 5th of April 1804, according to which he is authorised by the communities
    of Stalluhn, Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin, in like manner as Młynkiewicz,
    to conclude a contract.


    After negotiations had been conducted on both sides, and after the points agreed of the 16th of July
    1804 had been brought in, and the personal capacity of the parties appearing to conclude contracts
    was subject to no doubt, the contract was taken down as follows.


    §. 1. His Most Serene Highness the reigning Prince Friedrich Ludwig zu Hohenlohe Ingelfingen, Governor
    of Breslau, General Inspector of Infantry and Knight of the Royal Prussian great Orders, as hereditary
    lord of the lordship of Betsche situated in the Meseritz district, does make over to the burghership
    of the town of Betsche and the inhabitants of the villages of Kulligowo, Stalluhn, Schartzig, Stocki,
    Schwiechodezin, Lowin, all the demesne farms, arable fields, gardens, meadows, marsh, lakes, ponds,
    pond-sites, rivers, pastures, heaths, [uncertain: Löden], forests, woods, thickets, brushwood, money
    and produce rents belonging to him, the propination rights, brewing'
- page: 4
  en: 'and distilling rights, brick and lime kilns, the Obra demesne farm - in short each and every profitable
    right and prerogative which the Prince of Hohenlohe, His Serene Highness, has hitherto as proprietor
    used and enjoyed, and also can, may and shall enjoy - in Pausch und Bogen, by whatever name they may
    be called, and in particular also the right of sale over the Scholtiseyen and demesne farms granted
    out at hereditary-rent tenure; excepting the jurisdiction and Laudemien and the hunt, which His Most
    Serene Highness, as superior proprietor and permanent ground-lord of Betsche, reserves for Himself
    and for His Most High successors - as their true hereditary property, in such wise and manner that
    the said town commune of Betsche and the said localities may deal with it as with their true property,
    may sell it, [uncertain: rettauflichen], and give it away, can, may and shall do so, for a


    § 2. duly agreed purchase and hereditary-tenure sum of one hundred and eighty thousand Reichsthaler'
- page: 5
  en: 'in Royal Prussian Courant according to the coinage standard of 1764, and an annual ground-rent
    of one thousand Reichsthaler in Courant according to the same coinage standard.


    3. With regard to the payment of the purchase and hereditary-tenure sum, the matter is to be held
    thus: the town and the remaining village communities take over, ad Rationes Practii, the following
    named mortgage debts intabulated against the lordship of Betsche in the mortgage book of the Royal
    Government at Posen, namely:


    1. 48000 rtlr entered for Baurath Glenk, of which sum 36000 rttl have been ceded to the banker Salomon
    Nathan junior at Berlin and 12000 rttl to the banker Meyer Bernhard at Frankfurth a/O.'
- page: 6
  en: '48000 Rthl


    2. 2000 rtl. which are entered for the merchant Abraham Moses Hirschel at Breslau.


    3. 5000 rttllr which are intabulated for the Freiherr von der Marwitz of Budnik and have been ceded
    to the banker Meyer Bernhard at Frankfurth a/O.


    4. 5000 rthl which are intabulated for the widowed Ober-Amts-Räthin Christiana Dorothea Michaelis,
    née Eichborn.


    5. 5000 rthl which are intabulated for Baurath Johann Wilhelm Glenk, and have been ceded by him to
    the banker Meyer Bernhard at Frankfurth; all which items from No. 2 to 5 have already been called
    in by the creditors and are payable at Christmas of the current year.


    Whereby it is noted that the interest on the 48000 rttlr has been settled up to the 2nd of July of
    this year, but that on the remaining capitals up to the 26th of July.'
- page: 7
  en: '65000 Rthl


    6. 72000 rthl which are already intabulated for the banker Meyer Bernhard at Frankfurth a/O, and the
    interest thereon at 5 per cent settled up to the 26th of July of this year, as with the remaining
    capitals; and they promise to satisfy these sums to the creditors and to come to agreement with them
    thereon.


    7. 137,000 Rthl. The deputies stipulate to remit, out of the remainder of the purchase and hereditary-tenure
    sum, thirty-five thousand Reichsthaler forthwith to His Most Serene Highness at Breslau, carriage
    free; but the remainder of 8000 rthlr at the term of St John''s of the coming year, together with
    5 per cent interest, without fail, if it be called in at the proper time.


    The aforesaid 35000 rthlr are to be paid in this manner: tomorrow, the 29th of July, 7000 rthlr, and
    a week from tomorrow the remaining 28000 rthlr shall be paid; and the 7000 rthlr are to be sent carriage
    free to Breslau at the cost of the payers.'
- page: 8
  en: '[text lost] Inasmuch as among the moneys to be paid there are heavy Dutch rim-ducats, these shall
    be accepted at 4 gg. agio per [ducat]. Should the communities not pay the 28000 rtlr a week from tomorrow,
    that is on the 5th of August, then the whole contract concluded today shall cease, and the communities
    are bound to pay the costs occasioned thereby, but shall receive the 7000 rttlr back again, though
    without interest.


    §. 4. The handing over shall follow as soon as the 28000 rthlr, which are to be paid on the 5th of
    August, have been paid. Since however the former tenant von Bornstaedt is still in possession of the
    demesne farm here, and a suit is pending over his eviction, the communities do not indeed insist that
    possession of the demesne farm be at once given up to them, but will rather be content that he remain
    therein so long as the eviction judgment is not final in law, and that he be evicted only when the
    eviction judgment is final in law; yet there shall be given to the communities for this an equitable
    and appropriate compensation befitting the matter by His Serene Highness the Prince.


    As regards the forests, on the other hand, they shall be closed forthwith, just as'
- page: 9
  en: 'they now already are, and the timber felled therein, in so far as it has not been felled for the
    use of the farm, remains the property of His Serene Highness the Prince of Hohenlohe.


    §. 5. All the manorial dwelling-houses, farm buildings, forest buildings and other buildings are likewise
    made over to the communities in hereditary property; yet the communities are bound to leave the foresters
    their dwelling in one room in the forester''s houses until Michaelmas of the current year, as also
    the use of their gardens. His Serene Highness likewise reserves the castle as the seat of the court,
    as the dwelling of the court servant, and as a dwelling for His Most High self or His commissioners,
    and also a stabling for 2 horses, which they shall themselves maintain in repair. In the case of building
    work on this edifice, the communities are bound to let His Serene Highness the Prince of Hohenlohe
    Ingelfingen and his successors have the bricks at cost price, and to deliver the timber for the construction
    from the heath free of charge. The communities are also bound to deliver free of charge from the heath
    the wood needed for the heating'
- page: 10
  en: 'of the court room and of the court servant, and to cart it thither. In like manner the communities
    are also bound, when His Most Serene Highness or His commissioners are present here, to furnish the
    necessary firewood free of charge and to cart it thither.


    §. 6. As regards the timber purchase contracts concluded between His Most Serene Highness and certain
    merchants, His Most High self promises to satisfy the timber purchasers, without the communities making
    any contribution thereto.


    § 7. The town and village communities mentioned at the outset bind themselves, upon alienations of
    their parcels of land, to render 10 per cent Laudemium on the purchase sum to His Most Serene Highness
    and his successors in possession. From this Laudemium, however, are excepted those holdings which
    the'
- page: 11
  en: 'communities now intend newly to lay out; but if these should in future be sold, then the Laudemium
    of 10 per cent shall likewise be rendered thereon.


    §. 8. Further, His Most Serene Highness reserves to himself:


    That, if He Most High himself, or his successors in possession, should come hither, or should send
    their commissioners hither, the communities are obliged to furnish the relay-teams for a distance
    of 4 miles, out and back.


    §. 9. Further, His Serene Highness reserves, should he obtain the right of patronage over the church
    at Betsche, the right of patronage to himself; yet the town and village communities shall have the
    right to choose the clergyman and to put him forward in nomination, which nominated clergyman His
    Most Serene Highness promises to present to the episcopal Consistory.


    §. 10. The suits between the community of Stocki and the Prince of Hohenlohe concerning the ownership
    of the Stocki marsh; between the'
- page: 12
  en: 'Prince of Hohenlohe and the possessor of Zielomi[uncertain: pat] concerning the right of redemption;
    and between the Landrath von Schmaling as possessor of the demesne farm in Głazewo and the Prince
    of Hohenlohe, His Serene Highness, concerning the confirmation of the privilege; as also the suit
    between the Prince of Hohenlohe and Hertzig in Lowino concerning the restitution of the [uncertain:
    Schales tro] - these the communities take over at their own risk and cost, and whatever they may win
    at law or obtain by way of composition falls to the communities, without His Serene Highness having
    the least claim thereto.


    §. 11. The competence taxes and other public and further dues and burdens hitherto rendered by His
    Serene Highness as Dominium of Betsche, by whatever name they be called - among which belong also
    the sick-transport carriages into the Schillner and Punctner Hauland, as also the carriages for the
    fetching and the departure of the court, and by whatever other name they be called - the said town
    and village communities take over; and the latter cannot, should these dues be increased in future,
    demand any compensation from the Prince'
- page: 13
  en: 'of Hohenlohe, His Serene Highness. The communities also take over the contribution of fifty Reichsthaler
    which His Most Serene Highness promised to render to the town school here for 1 year.


    §. 12. Both contracting parties bind themselves to have this contract publicly recorded before the
    competent authorities and to seek confirmation of it; and His Most Serene Highness herewith makes
    himself liable to exert himself as best he may that this contract be confirmed by the competent authorities,
    and that the consent to the further dismemberment of the parcels of land made over to them be granted
    to the communities.


    §. 13. As soon as the tradition of the demesne farm here and of the Obra demesne farm takes place,
    there shall at the same time be handed over to the town and village communities that livestock and
    farm inventory which is included in the sale under the purchase and hereditary-tenure sum, in the
    same number as the tenant von Bornstaet received the same in the year 1800 upon the handing over.


    §. 14.'
- page: 14
  en: '§ 14. This contract shall be binding, for His Most Serene Highness the Prince zu Hohenloh-Ingelfingen
    for himself and his Most High heirs and successors, as also on the part of the town and village communities,
    for all time. And the canon or ground-rent of 1000 rttlr to be paid annually shall be rendered in
    half-yearly instalments of 500 rthlr, namely each time at the term of Christmas and the term of John
    the Baptist, yearly, sub paena executiones, and sent to Breslau carriage free.


    §. 15. So long as the communities do not alienate or dismember the parcels of land and rights made
    over to them, the Status Passivat remains in its present condition. But as soon as the demesne farm
    is dismembered, the hereditary purchasers are obliged to have the intabulated items transferred onto
    their parcels of land and struck out in the name of His Most Serene Highness.'
- page: 15
  en: '§. 16. For the stipulated canon of the 1000 rthlr yearly all the communities are liable in solidum,
    and they consent to the entry thereof in the mortgage book against their parcels of land; just as,
    on the other hand, His Most Serene Highness likewise consents that this present contract be entered
    in the mortgage book of the Dominium of Betsche and appurtenances.


    §. 17. Finally the contracting parties renounce each and every objection, by whatever name they may
    be called; in particular the town and village communities renounce the objection of injury beyond
    the half, which was explained to them to this effect:


    that if the agreed purchase and hereditary-tenure sum exceeded the true value of the parcels of land
    and rights made over by twice as much, they would thereby have'
- page: 16
  en: 'the withdrawal from the contract free to them.


    § 18. His Most Serene Highness reserves to himself the superior supervision over the forests, which
    he will entrust to the Royal Chief Forester Feller; and the communities bind themselves to indemnify
    him for his pains and to come to agreement with him thereupon.


    With that, since nothing further was to be brought forward, the proceedings were closed, the protocol
    read out and - for the deputies of the town and village communities, who are not fully conversant
    with the German tongue and who had forbidden the keeping of a separate side-protocol in the Polish
    language - interpreted by the sworn interpreter Echaust, approved and signed; whereupon it was further
    noted by the contracting parties that the costs of the taking down,'
- page: 17
  en: 'expedition, public recording and confirmation shall be borne in halves by both parties. Read out,
    approved and signed. Read myself and approved. Johann Wilhelm Glenk, Princely Hohenlohe Ingelfingen
    General Bevollmächtigter. Peter Friederich August von Triebenfeld. Jan Chmura. As authorised representative.
    Matheus Młynkiewicz, authorised representative and plenipotentiary.


    Josef Echaust as interpreter. Metzig


    Justitiarius


    Neumann


    Actuarius


    Actum Betsche, the 29th of July 1804. Today there appeared


    1. the Princely Hohenloh-Ingelfingen General Bevollmächtigter, Baurath Johann Wilhelm Glenk; likewise
    the special'
- page: 18
  en: 'Bevollmächtigter of the burghership, Matheus Młynkiewicz, and the Bevollmächtigter Chmara of the
    communities of Kulligowo, Stalluhn, Schartzig, Stocki, Schwiechodezin, Lowin, and they add the following
    to the contract taken down yesterday.


    §. 1. The Prince of Hohenlohe, His Serene Highness, assures the communities that, apart from the mortgage
    capitals already called in, none shall be called in within the space of half a year.


    §. 2. The town and village communities bind themselves, in criminal investigations that may occur,
    to bear for ever the costs of the investigation, in so far as the remaining communities belonging
    to the Betsche Schlüssel are not themselves obliged to bear the same.'
- page: 19
  en: 'With that the proceedings were closed, the protocol read out and - for the deputies of the community,
    who are not fully conversant with the German tongue and who had forbidden the keeping of a protocol
    in the Polish language - interpreted by the sworn interpreter Echaust, approved, and signed.


    Johann Wilhelm Glenk


    H. Chmara mpp   M. Młynkiewicz   Echaust.


    Metzig


    Neumann.


    Since now an authenticated engrossment was needful and request has also been made for it, the present
    engrossment is issued in witness thereof under Our seal and signature. - Thus done at Betsche, the
    7th of December 1804. Princely Hohenlohe-Ingelfingen Court Office Betsche. Metzig,


    Justitiarius


    (L. S.)


    Neumann


    Actuarius'

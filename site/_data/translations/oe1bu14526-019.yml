- page: 2
  en: 'and Kontop as his most high friend and assistant,


    2. The burgher and town representative Matheus Młynkiewicz as authorised representative of the burgesses
    of Betsche,


    3. The free village mayor Johann Chmara of Stalluhn as authorised representative of the village communities
    of Stalluhn, Kulligowo, Schartzig, Stocki, Swiechodezin and Lowin, with the motion to draw up a contract
    between His Most Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, the burgesses of Betsche,
    and the above-named village communities upon the basis of the points settled, dated Alt Schartzig
    the 16th of July 1804. The Princely Hohenlohe authorised representative, the building councillor Johann
    Wilhelm Glenck, produced the said power of attorney of the Prince of Hohenlohe of the 26th of April
    1803, according to which he is authorised validly to conclude contracts, of which power of attorney
    a vidimated copy was taken to these acts.


    In like manner Młynkiewicz handed in a judicially executed power of attorney of the 5th of April 1804,
    according to which he is authorised in the name of the town to conclude a contract with His Serene
    Highness the reigning Prince of Hohenlohe over all the plots of ground and profitable rights belonging
    to the lordship of Betsche.



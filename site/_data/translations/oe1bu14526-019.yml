- page: 9
  en: 'they already are now, and the timber felled therein, in so far as it has not been felled for the
    use of the farm, remains the property of His Serene Highness the Prince of Hohenlohe.


    §. 5. All the manorial dwelling, farm, forest and other buildings are likewise made over to the communities
    in hereditary property; but the communities are bound to leave the foresters their lodging in one
    room in the foresters'' houses until Michaelmas of the current year, as also the use of their gardens.
    His Serene Highness also reserves to himself the castle, for the seat of the court, the dwelling of
    the court servant, and a dwelling for His Highness himself or his commissioners, and also a stable
    for 2 horses, which they shall themselves maintain in good repair. In the case of building work on
    this edifice the communities are bound to let His Serene Highness the Prince of Hohenlohe-Ingelfingen
    and his successors have the bricks at cost price, and to furnish the timber for the building free
    of charge out of the heath. The communities are likewise bound to furnish, free of charge out of the
    heath, the wood needful for the heating'

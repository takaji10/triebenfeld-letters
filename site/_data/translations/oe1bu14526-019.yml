- page: 10
  en: 'free of charge from the heath, and to cart in, the timber needed for the heating of the court room
    and of the court servant, and to cart it in. In like manner the communities are also bound, when His
    Most Serene Highness or his commissioners are present here, to furnish the necessary firewood free
    of charge and to cart it in.


    §. 6. As to the timber purchase contracts concluded between His Most Serene Highness and certain merchants,
    His Highness promises to settle with the timber purchasers, without the communities contributing anything
    thereto.


    § 7. The town and village communities mentioned at the outset bind themselves, upon alienations of
    their parcels of land, to pay 10 per cent transfer fee (Laudemium) on the purchase sum to His Most
    Serene Highness and his successors in possession. From this transfer fee are excepted, however, the
    holdings which the'
  numbers:
  - '6'
  - '7'
  - '10'
- page: 11
  en: 'communities now wish to establish anew; but if these are sold in future, the transfer fee of 10
    per cent shall likewise be paid thereon.


    §. 8. Further, His Most Serene Highness reserves to himself:


    That, if His Highness himself, or his successors in possession, should come hither, or should send
    their commissioners hither, the communities are bound to furnish the relay carriage service to a distance
    of 4 miles, there and back.


    §. 9. Further, His Serene Highness reserves the right of patronage, should he obtain the right of
    patronage over the church at Betsche; the town and village communities shall however have the right
    to choose the clergyman and to put him forward in nomination, which nominated clergyman His Most Serene
    Highness promises to present to the episcopal consistory.


    §. 10. The suits between the community of Stocki and the Prince of Hohenlohe over the ownership of

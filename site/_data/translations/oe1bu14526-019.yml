  en: 'No. 93.


    We, the Princely Hohenloh-Ingelfingen court and of the lordship of Betsche, do hereby make known and
    declare to each and all, but particularly where it is needful to know, that there appeared before
    Us.


    1. the Princely Hohenlohe-Ingelfingen, his estates director and general attorney, the building councillor
    Johann Wilhelm Glenck, on the one part


    2. Likewise the authorised representatives of the town and rural communities, namely of the town of
    Betsche, the village of Staluhn, Schaertzig, Schwiechodezin, Stocki, Lowin and Kulligowo,


    a) the burgess and town representative Matheus Młynkiewicz


    b) the free village mayor Johann Chmara, and that they have concluded a hereditary-lease contract
    over the estates of the lordship of Betsche, as the proceedings of the 28th of July of the current
    year, as also the supplement of the 29th of July of the current year, set out more fully, reading
    thus: Actum Betsche, the 28th of July 1804. There appeared


    1., the Princely Hohenlohe-Ingelfingen general attorney, the building councillor Glenck, whom His
    Most Serene Highness the Councillor of War and Forests von Triebenfeld, hereditary lord of Schweinern,'

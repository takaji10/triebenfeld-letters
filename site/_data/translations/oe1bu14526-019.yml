- page: 1
  en: 'No. 93.


    We, the Princely Hohenloh-Ingelfingen court and of the lordship of Betsche, do hereby make known and
    declare to each and every man, but especially where it is needful to know, that there appeared before
    Us.


    1. the Princely Hohenlohe-Ingelfingen [uncertain: his] estates director and general attorney, building
    councillor Johann Wilhelm Glenck, on the one part


    2. Likewise the authorised representatives of the town and country communities, namely of the town
    of Betsche, the village of Staluhn, Schaertzig, Schwiechodezin, Stocki, Lowin and Kulligowo,


    a) the burgess and town representative Matheus Młynkiewicz


    b) the free village mayor Johann Chmara, and have concluded a hereditary lease contract over the estates
    of the lordship of Betsche, as the proceedings of the 28th of July of the current year, and likewise
    the supplement of the 29th of July of the current year, set forth more fully, reading thus: Actum
    Betsche, the 28th of July 1804. There appeared


    1., the Princely Hohenlohe-Ingelfingen general attorney, building councillor Glenck, who brought with
    him His Most Serene Highness''s councillor of war and forests von Triebenfeld, hereditary lord of
    Schweinern,'

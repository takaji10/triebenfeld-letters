- page: 9
  en: 'they already are now, and the timber felled therein, in so far as it has not been felled for the
    husbandry, remains the property of His Serene Highness the Prince of Hohenlohe.


    § 5. All the manorial dwelling, farm, forest and other buildings are likewise made over to the communities
    heritably and in property; the communities are however bound to leave the foresters their dwelling
    in one room in the foresters'' houses until Michaelmas of the current year, as also the use of their
    gardens. His Serene Highness also reserves to himself the castle as the seat of the court, the dwelling
    of the court servant, and a dwelling for his most high self or his commissioners, and also a stable
    for 2 horses, which they shall themselves maintain in fit structural condition. In the case of building
    works upon this edifice the communities are bound to let His Serene Highness the Prince of Hohenlohe-Ingelfingen
    and his successors have the bricks at cost price, and to furnish the timber for the construction free
    of charge from the heath. The communities are also bound to furnish, free of charge from the heath,
    the wood needed for heating'
  names:
  - de: Hohenlohe
    en: Hohenlohe

- page: 10
  en: 'the court room and the court servant''s, and to cart it thither. In like manner the communities
    are also bound, when His Most Serene Highness or his commissioners are present here, to furnish the
    necessary firewood free of charge and to cart it thither.


    § 6. As regards the timber purchase contracts concluded between His Most Serene Highness and certain
    merchants, His most high self promises to satisfy the timber purchasers, without the communities contributing
    anything thereto.


    § 7. The town and village communities mentioned at the outset bind themselves, upon alienation of
    their plots of ground, to pay 10 per cent transfer fee (Laudemium) upon the purchase sum to His Most
    Serene Highness and his successors in possession. From this transfer fee are however excepted those
    holdings which the'

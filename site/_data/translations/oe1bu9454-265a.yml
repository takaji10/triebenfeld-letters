- page: 1
  en: 'Right Honourable Sir, Most Highly Revered Privy Councillor of State! Your Right Honourable has,
    as the Councillor of War and Forests von Triebenfeld writes to me, guided my affairs so wisely that
    I may look forward with the greatest confidence to the happiest outcome of my wishes, and above all
    to the [uncertain: wager / rescue] out of the hands of the wicked p Cosmar. My eternal thanks I [uncertain:
    pay] to the same for it; through the report of the Brieg High Provincial Court everything will be
    confirmed which I have had represented through Herr von Triebenfeld and Court Councillor Hater. I
    have already sent to Triebenfeld an extract of the motion of the aforesaid collegium, which he can
    lay before Your Right Honourable. Everything (and that in return the whole of the entailed estate
    property be administered for the King''s account) now depends only upon this, that the advance of
    11213. Gü[uncertain: t] for the satisfaction of the Burisch heirs be granted; if this request of mine
    is allowed, then my foremost wish is attained: the King is at once wholly set ex nexu and immediately
    receives back the guaranteed instrument of debt for 300000 Rthl, all other creditors are satisfied,
    Cosmar''s influence over the entailed estates thus soon has an end, and so His Majesty will now, in
    place of the old debt of 35000 Rthl, receive a sum of 461000 Rthl, and I am saved and need suffer
    want no longer. For the discharge of the advance of 112000 and reipit. 35000 Rthl, Herr von Triebenfeld
    has indeed assumed a period of 6 years, within which it should be repaid again into the fund out of
    which it might be given; but this period will not be necessary, as the Causa to reimburse the capital,
    for firstly Cosmar must have some 60000 Rthl behind him which my son August was to have received over
    3 years, in return for which he now possesses the 3 Hohenlohe principalities — secondly he must account
    for the 100000 Rthl which were bequeathed to my eldest son for the discharge of the debts in the Hohenlohe
    lands by the late Princess Sacke out of her fortune. 3. thly Cosmar must have behind him, upon the
    moneys payable to me, more than 48000 Rthl. Out of these considerable funds, since the same may after
    all not be sent abroad, the advance from the fund can be discharged with all speed and afterwards
    be drawn in again upon the entailed estates for the appointed purpose. That moreover on the [uncertain:
    Garisch] side they are willing to be content with 112000 Rthl — of that Herr von Triebenfeld can lay
    the proof before Your Right Honourable. It is with the most distinguished high esteem and the greatest
    gratitude that I shall ever be Your Right Honourable''s. Schlawenschitz, the 8th of January 1815.'

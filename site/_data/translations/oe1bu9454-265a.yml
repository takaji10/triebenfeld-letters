segments:
- page: 1
  en: 'Right Honourable Sir,


    Most highly revered Privy Councillor of State!


    Your Right Honourable has, as the Councillor of War von Triebenfeld writes to me, guided my affairs
    so wisely that I may look forward with the greatest confidence to the happiest outcome of my wishes,
    and above all to the [uncertain: wager] out of the hands of the wicked Cosmar and company. My eternal
    thanks I render to the same for it; through the report of the Brieg Higher Provincial Court everything
    will be confirmed that I have had represented through Mr. von Triebenfeld and Court Councillor Hater;
    I have already sent to Triebenfeld an extract from the motion of the aforesaid collegium, which he
    can lay before Your Right Honourable.


    Everything (and that, against this, the whole of the entailed estates be administered for the King''s
    account) now depends only upon this, that the advance of 11213 [uncertain: gulden] for the satisfaction
    of the Burisch heirs be granted; if this request of mine is allowed, then my foremost wish is attained,
    the King is at once entirely released from the nexus and immediately receives back the guaranteed
    instrument of debt for 300000 Rthl, all other creditors are satisfied, Cosmar''s influence upon the
    entailed estates thus soon comes to an end, so His Majesty will now receive, for the old debt of 35000
    Rthl, a sum of 461000 Rthl, and I am saved and need suffer want no longer. For the extinction of the
    advance of 112000 and respectively 35000 Rthl Mr. von Triebenfeld has indeed assumed a period of 6
    years, within which it should be repaid again into the treasury out of which it would have to be given;
    but this period will not be necessary, as the cause to reimburse the capital, for firstly Cosmar must
    have 60000 Rthl behind him, which my son August was to have received over 3 years, for which he now
    possesses the three Hohenlohe principalities - secondly he must account for the 100000 Rthl which
    were bequeathed to my eldest son out of her property by the late Princess Sacke for the extinction
    of the debts in the Hohenlohe lands. Thirdly, Cosmar must have behind him, of the moneys to be paid
    to me, more than 48000 Rthl. Out of these considerable funds, since the same may after all not be
    sent abroad, the treasury advance can be extinguished with all speed and thereafter be levied again
    upon the entailed estates for the appointed purpose. That moreover, on the [uncertain: Garisch] side,
    they are willing to be content with 112000 Rthl, of that Mr. von Triebenfeld can lay the proof before
    Your Right Honourable. It is with the most distinguished high esteem and greatest gratitude that I
    shall ever be,


    Your Right Honourable''s


    Schlawenschitz


    the 8th of January 1815.'

- page: 1
  en: '265


    Right Honourable Sir,


    Most highly revered Privy Councillor of State!


    Your Right Honourable has, as the councillor of war von Triebenfeld writes to me, guided my affairs
    so wisely that I may look forward with the greatest confidence to the happiest fulfilment of my wishes,
    and above all to the rescue from the hands of the wicked Cosmar. My everlasting thanks I render to
    you for it; by the report of the Wrocław [uncertain: Brzeg] Higher Provincial Court everything will
    be confirmed which I have had represented through Mr von Triebenfeld and the Court Councillor Hahn;
    I have already sent to Triebenfeld an extract from the motion of the aforesaid board, which he can
    show to Your Right Honourable.


    Everything (and that in return the whole of the entailed estates be administered for the King''s account)
    now depends solely upon this, that the advance of 11213. [illegible] satisfaction of the Burischen
    heirs be granted; if this my request be granted me, then my foremost wish is attained, the King is
    at once wholly released from the obligation (ex nexu) and immediately receives back the guaranteed
    instrument of debt for 300/m Rthl., all other creditors are satisfied, Cosmar''s influence upon the
    entailed estates thus soon has an end, thus His Majesty will [uncertain: iez] of the old debt of 35/m
    Rthl. receive a sum of 461000 Rthl., and I am saved and need suffer want no longer. For the discharge
    of the advance of 112/m and respectively 35000 Rthl. Mr von Triebenfeld has indeed assumed a period
    of 6 years, within which it should be repaid again into the fund out of which it might be given, but
    this period will not be necessary, as the cause of reimbursing the capital; for firstly Cosmar must
    have in his hands some 60000 Rthl. which my son August should have received over 3 years, in return
    for which he now possesses the 3[illegible] Hohenlohe principalities — secondly he must account for
    the 100/m Rthl. which were bequeathed to my eldest son out of her own property by the late Princess
    Sacke for the discharge of the debts in the Hohenlohe lands. 3[illegible] thirdly Cosmar must have
    in his hands, of the moneys to be paid to me, more than 48000 Rthl. — Out of these considerable funds,
    since the same at all events may not be sent abroad, the fund''s advance can be discharged with all
    speed and thereafter be drawn again from the entailed estates for the purpose appointed. That for
    the rest, on the Garischer side, they are willing to be content with 112/m Rthl., of this Mr von Triebenfeld
    can lay the proof before Your Right Honourable. It is with the most distinguished respect and the
    greatest gratitude that I shall ever be


    Your Right Honourable''s


    Sławięcice


    the 8th of January 1815.'

status: draft
segments:
- page: 1
  en: '[Polish:] The undersigned Court hereby makes known to whomsoever it may concern, that between the
    plenipotentiary of His Serene Highness the Prince Hohenlohe Ingelfingen, the Honourable Councillor
    of War and Forests Triebenfeld, and the Hauländer Bogumił Sarre the following contract has been concluded.


    Actum Trąbczyn, the eighth of July, one thousand eight hundred and six. There appeared the persons
    well known to the undersigned Justitiarius, namely as


    1. the Councillor of War and Forests von Triebenfeld, as General Bevollmächtigter [authorised representative]
    of His Serene Highness the reigning Prince of Hohenlohe Ingelfingen, hereditary lord and lord of the
    court of this place, legitimated by the power of attorney annexed hereto, on his part.


    and


    2. the Hausländer farmer Gottlieb Sarre from the Peyser Hauland on the other part. The comparents
    are found to be in the condition to execute judicial acts validly, and declare, freely and after due
    deliberation, the following hereditary-lease contract to the protocol'
- page: 2
  en: '§ I. His Most Serene Highness grants to Gottlieb Sarre, in the forest situated near Trąbczyn, 1
    1/2 Hufen — written out, one and a half Hufen Magdeburg measure, the Hufe reckoned at thirty Morgen
    and each Morgen at one hundred and eighty square rods — of waste land, from Midsummer [Johanni] of
    this present year onward, in hereditary lease for perpetual times.


    § II. Gottlieb Sarre pays for the Hufe Magdeburg measure 100 rt. — written out, one hundred Reichsthaler
    — hence for one and a half Hufen 150 r. — written out, one hundred and fifty Reichsthaler — as purchase-money;
    and since this purchase-money has already been paid in full, Gottlieb Sarre is hereby given receipt
    for it without further reservation.


    § III. Gottlieb Sarre hereby binds himself, for himself and his successors in the possession of this
    holding, to pay from each Hufe as annual hereditary canon 30 rtl. — written out, thirty Reichsthaler
    — hence for one and a half Hufen 45 rtll.'
- page: 3
  en: '45 rt. — written out, forty-five Reichsthaler — to the Dominium of this place; and this hereditary
    rent is to be discharged yearly in two instalments, namely with the one half at Christmas and with
    the [uncertain: other] half at Midsummer [Johannis], each time in cash and in Courant to the manorial
    treasury.


    § IV. For the wholly unbroken arable the hereditary lessee receives three free years, which begin
    at Midsummer [Johanni] of the present year and end at Midsummer [Johannis] 1809, so that the first
    half-yearly hereditary rent must be paid at Midsummer [Johanni] 1809 in the sum of 22 rt 12 gg — written
    out, twenty-two Reichsthaler, twelve good Groschen.


    That land which at the measuring-out was handed over to Gottlieb Sarre already as broken ground'
- page: 4
  en: '— be the same much or little — bears interest from Midsummer [Johanni] of this year, inasmuch as
    the free years extend only to that part which must first be brought under cultivation; and since the
    handing over of these [uncertain: sonderthalb] Hufen Magdeburg measure has already taken place to
    the hereditary lessee, he renounces all claims that might be made on this account.


    § V. The hereditary lessee is at liberty to redeem the stipulated hereditary rent of thirty Reichsthaler
    per Hufe down to one half, that is to say, he may according to his means pay off to the ground-lordship
    one, two, up to three hundred Reichsthaler of capital, whereupon for every hundred Reichsthaler five
    Reichsthaler shall be [uncertain: abated] yearly from the hereditary rent'
- page: 5
  en: 'The capital so paid off remains the property of the ground-lordship, and this redemption of the
    hereditary rent takes place only in respect of the first half; the second half, of fifteen Reichsthaler
    per Hufe, on the other hand remains irredeemable, and can never be raised or diminished.


    § VI. Besides the hereditary rent in cash, the hereditary lessee undertakes, for now and for future
    times in perpetuity, to discharge and render the [uncertain: gehauenten] royal and other public dues
    falling upon these one and a half Hufen, consist they in what they may, without any exception and
    without deduction from the hereditary rent or any other reimbursement.


    § VII. The hereditary lessee must build upon it at his own cost, without his'
- page: 6
  en: 'receiving, either now or in the future, timber or any other building assistance for this purpose.
    However, the whole of the timber found upon his one and a half Hufen belongs to him in property without
    exception.


    Likewise the hereditary lessee, and his successors in the possession of this holding, must effect
    all future repairs and new buildings out of their own means, without subsidy or assistance.


    § VIII. Outside his own holding the hereditary lessee has no right to firewood or pasturage in the
    manorial forests and fields.


    § IX. Drink the hereditary lessee must always take from the manorial brewery and distillery or from
    the tavern'
- page: 7
  en: 'If foreign drink be brought in by him or by his people, the hereditary lessee shall each time incur
    a penalty of five Reichsthaler for every barrel of beer and [uncertain: seinen] Reichsthaler for every
    Garniec of brandy, which penalty is to be paid to the manorial lordship.


    § X. To the milling compulsion the hereditary lessee is subject, and may grind his grain only where
    the manorial lordship directs him.


    § XI. From all and every manorial service and deliveries in kind without distinction the hereditary
    lessee is wholly and forever exempt; he nevertheless remains subject to the jurisdiction of the Dominium
    of this place.


    § XII. The hereditary lessee and his successors in possession'
- page: 8
  en: 'in possession is entitled to alienate his holding to another in any manner he pleases; but at every
    sale or exchange [uncertain: a sum] of money must be paid to the ground-lordship as a Laudemium, and
    the consent of the same must be obtained for every alienation, inasmuch as the ground-lordship hereby
    reserves to itself once and for all the right of pre-emption.


    § XIII. The hereditary lessee, for himself and his successors in possession, wholly renounces, for
    now and for the future, all and every remission in cases of misfortune — be the same by fire from
    heaven, arson by evil persons, hailstorm, crop failure, cattle plague, inundation, war and pestilence,
    or in whatsoever manner it may [uncertain: mir] arise — and in the event of such cases there shall
    be neither a bonification nor a re-'
- page: 9
  en: '-mission of the hereditary rent take place.


    § XIV. All costs pertaining to this contract the hereditary lessee undertakes to discharge.


    § XV. His Most Serene Highness consents that the hereditary lessee may, upon the ground of this contract,
    have his title of possession registered for himself.


    § XVI. So long as the hereditary lessee and his successors in possession shall fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights'
- page: 10
  en: 'and to defend them against every man''s real claim. Should, however, the hereditary lessee or his
    successors remain in arrears with the annual hereditary rent longer than two years, or should they
    lay waste this holding and thereby diminish the revenues of the ground-lordship, then the ground-lordship
    shall be entitled to let out this holding elsewhere, and the hereditary lessee shall forfeit his whole
    right and the purchase-money he has paid in.


    Both parties promise to keep this hereditary-lease contract firmly and inviolably; having been judicially
    instructed as to the consequences, they renounce all'
- page: 11
  en: 'subterfuges available against it, in particular the plea of an injury suffered above or below the
    half [laesio enormis], of cunning persuasion, fear, coercion, of matters otherwise agreed than written
    down or not rightly understood; they [uncertain: apply] for this contract to be judicially executed,
    and, after prior verbal reading aloud, have subscribed below in their own hands as a token of approval.


    v. Triebenfeld    Gottlieb Sarre


    Schenk


    Justitiarius


    Ogrodowicz


    Keeper of the Protocol


    [Polish:] Which, for public faith, under the'
- page: 12
  en: '[Polish, continued:] impression of the Court''s seal we do attest. Given at Pyzdry, the 28th day
    of January 1808. Patrimonial Court of the Zagurów Estate


    Hawich'

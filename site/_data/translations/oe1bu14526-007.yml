status: draft
segments:
- page: 1
  en: '[Polish:] The undersigned Court makes known to whomsoever it may concern, that between the Plenipotentiary
    of His Serene Highness the Prince Hohenlohe Ingelfingen, the Worshipful Councillor of War and Forests
    Triebenfeld, and the Hollander Bogumił Sarre, the following Contract has been concluded.


    Actum Trąbczyn, the eighth of July, one thousand eight hundred and six. There appeared the person
    well known to the undersigned Justitiarius, to wit:


    1. the Councillor of War and Forests v. Triebenfeld, as General Bevollmächtigter (authorised representative)
    of His Serene Highness the reigning Prince of Hohenlohe Ingelfingen, hereditary lord and lord of the
    court of this place, legitimated by the power of attorney here annexed, on his part.


    and


    2. the Hausländer farmer Gottlieb Sarre from the Peyser Hauland on the other part. The Comparenten
    find themselves in a condition to execute judicial acts validly, and declare freely and after due
    deliberation the following hereditary-lease contract to the protocol:'
- page: 2
  en: '§ I. His Most Serene Highness grants in hereditary lease to Gottlieb Sarre, in the forest situated
    near Trąbczyn, 1 1/2 Hufen — written out, one and a half Hufen Magdeburg measure, the Hufe reckoned
    at thirty Morgen and each Morgen at one hundred and eighty square rods — of waste land, from Midsummer
    (Johanni) of this present year onward, for everlasting time.


    § II. Gottlieb Sarre pays for the Hufe Magdeburg measure 100 rt., written out one hundred Reichsthaler,
    hence for one and a half Hufen 150 r., written out one hundred and fifty Reichsthaler, as purchase
    money; and since this purchase money has already been paid in full, Gottlieb Sarre is hereby receipted
    without further reservation.


    § III. Gottlieb Sarre hereby binds himself, for himself and his successors in the possession of this
    holding, to pay from each Hufe as annual hereditary canon 30 rtl., written out thirty Reichsthaler,
    hence for one and a half Hufen 45 rtll.'
- page: 3
  en: '45 rt., written out forty-five Reichsthaler, to the Dominium of this place; and this hereditary
    rent is to be settled annually in two instalments, namely with the one half at Christmas and with
    the other half at Midsummer (Johannis), each time in cash and in Courant, to the manorial treasury.


    § IV. Of the wholly unbroken arable the hereditary lessee receives three free years, which begin from
    Midsummer of the present year and end at Midsummer 1809, so that the first half-yearly hereditary
    rent must be paid at Midsummer 1809 in the sum of 22 rt 12 gg, written out twenty-two Reichsthaler,
    twelve good Groschen.


    That land which at the measuring-out was handed over to Gottlieb Sarre as already broken'
- page: 4
  en: '— be the same much or little — is subject to rent from Midsummer of this year, inasmuch as the
    free years extend only to that part which has first to be brought under cultivation; and since the
    handing over of these one and a half Hufen Magdeburg measure has already been made to the hereditary
    lessee, he relinquishes all claims that might be raised on that account.


    § V. The hereditary lessee is at liberty to redeem the fixed hereditary rent of thirty Reichsthaler
    per Hufe down to the half; that is, he may, according to his means, pay off to the ground lordship
    one, two, up to three hundred Reichsthaler of capital, whereupon for every hundred Reichsthaler five
    Reichsthaler shall be struck off the hereditary rent annually.'
- page: 5
  en: 'The capital so paid off remains the property of the ground lordship, and this redemption of the
    hereditary rent takes place only in respect of the first half; the second half, at fifteen Reichsthaler
    per Hufe, on the contrary remains irredeemable, and can never be increased or diminished.


    § VI. Besides the hereditary rent in cash, the hereditary lessee undertakes, for now and for future
    times in perpetuity, to settle and to render the royal and other public dues falling upon these one
    and a half Hufen, of whatever kind they may be, without any exception and without deduction from the
    hereditary rent or any other reimbursement.


    § VII. The hereditary lessee must build upon it at his own cost, without'
- page: 6
  en: 'receiving for this purpose, neither now nor in the future, timber or any other building assistance.
    However, the whole of the timber standing upon his one and a half Hufen belongs to him in property,
    without exception.


    Likewise the hereditary lessee and his successors in the possession of this holding must effect all
    future repairs and new buildings out of their own means, without subsidy or assistance.


    § VIII. Outside his own holding the hereditary lessee has no right to firewood or to pasturage in
    the manorial forests and fields.


    § IX. His drink the hereditary lessee must always take from the manorial brewery and distillery, or
    from the tavern.'
- page: 7
  en: 'If foreign drink be brought in by him or by his people, the hereditary lessee incurs each time
    a penalty of five Reichsthaler for every barrel of beer and one Reichsthaler for every garniec of
    brandy, which penalty is to be paid to the manorial lordship.


    § X. The hereditary lessee is subject to the milling constraint (Mühlenzwang), and may grind his grain
    only where the manorial lordship directs him.


    § XI. From each and every manorial service and delivery in kind, without distinction, the hereditary
    lessee is wholly and forever exempt; he nevertheless remains subject to the jurisdiction of the Dominium
    of this place.


    § XII. The hereditary lessee and his successors in possession'
- page: 8
  en: 'possession is entitled to alienate his holding to another in any manner he pleases; but at every
    sale or exchange [a portion] of the money must be paid to the ground lordship as a laudemium, and
    the consent of the same must be obtained for every alienation, inasmuch as the ground lordship hereby
    reserves to itself, once and for all, the right of pre-emption.


    § XIII. The hereditary lessee renounces, for himself and his successors in possession, wholly and
    for now and the future, each and every remission in cases of misfortune — be the same occasioned by
    fire from heaven, arson by evil persons, hail-stroke, crop failure, cattle plague, inundation, war
    and pestilence, or in whatever manner it may be — and in cases occurring there shall be neither a
    bonification nor a re[mission]'
- page: 9
  en: '[re]mission of the hereditary rent take place.


    § XIV. The hereditary lessee undertakes to settle the whole of the costs attending this contract.


    § XV. His Most Serene Highness consents that the hereditary lessee may, on the ground of this contract,
    have his title of possession entered for himself.


    § XVI. So long as the hereditary lessee and his successors in possession shall fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights'
- page: 10
  en: 'and to defend them against any man''s real claim. Should, however, the hereditary lessee or his
    successors remain in arrears with the annual hereditary rent for longer than two years, or should
    they lay waste this holding and thereby diminish the revenues of the ground lordship, then the ground
    lordship shall be entitled to let out this holding otherwise, and the hereditary lessee forfeits his
    whole right and the purchase money he has paid in.


    Both parties promise to keep this hereditary-lease contract firmly and inviolably; having been judicially
    instructed as to the consequences, they renounce all'
- page: 11
  en: 'subterfuges available against it, in particular the objection of an injury suffered above or below
    the half (laesio enormis), of cunning persuasion, fear, coercion, of matters agreed otherwise than
    as written down, or not rightly understood; they [ask? bear?] this contract to be judicially executed,
    and, after it had first been read aloud word for word, have subscribed below in their own hands as
    a token of approval.


    v. Triebenfeld       Gottlieb Sarre


    Schenk

    Justitiarius


    Ogrodowicz

    Keeper of the Protocol


    [Polish:] Which, for public faith, under'
- page: 12
  en: '[Polish, continued:] the impression of the Court Seal we attest. Given at Pyzdry, the 28th day
    of January 1808. Patrimonial Court of the Estate of Zagurowo.


    Hawich'

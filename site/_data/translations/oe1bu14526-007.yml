status: draft
segments:
- page: 1
  en: 'The undersigned Court makes known to whom it may concern, that between the authorised representative
    of His Serene Highness the Prince of Hohenlohe-Ingelfingen, the Honourable Councillor of War and Forests
    Triebenfeld, and the Hollander Bogumił Sarre, the following contract has been concluded.


    Actum Trąbczyn, the eighth of July, one thousand eight hundred and six. There appeared the persons
    well known to the undersigned justiciary, namely as


    1. the Councillor of War and Forests von Triebenfeld, as general authorised representative of His
    Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court
    of this place, legitimated by the power of attorney here appended, on his part.


    and


    2. the Hollander farmer Gottlieb Sarre from the Peyserschen Hauland on the other part. The appearing
    parties are found to be in a condition validly to execute judicial acts, and declare freely and after
    due deliberation the following hereditary-lease contract to the protocol'

- page: 3
  en: '45 rt., in words forty-five Reichsthaler, to the manorial lordship (Dominium) of this place; and
    this hereditary rent shall be settled annually in two instalments, namely with the one half at Christmas
    and with the other half at Midsummer, each time in cash and in Courant, into the lordship''s treasury.


    § IV. Of the wholly uncultivated arable the hereditary lessee receives three free years, which begin
    at Midsummer of the present year and end at Midsummer 1809, so that the first half-yearly hereditary
    rent must be rendered at Midsummer 1809 with 22 rt. 12 gg., in words twenty-two Reichsthaler, twelve
    good Groschen.


    That land which at the time of the measuring out was already handed over to Gottlieb Sarre as arable'
  names:
  - de: Gottlieb Sarre
    en: Gottlieb Sarre
    kind: person
  numbers:
  - '45'
  - '1809'
  - '22'
  - '12'
- page: 4
  en: 'be it much or little, bears interest from Midsummer of this year onward, inasmuch as the free years
    extend only to that part which has first to be brought under cultivation; and since the handing over
    of these one and a half Hufen Magdeburg measure has already taken place to the hereditary lessee,
    he renounces all claims that might be made on that account.


    § V. The hereditary lessee is at liberty to redeem the fixed hereditary rent of thirty Reichsthaler
    per Hufe up to one half, that is to say, he may according to his means pay off to the ground lordship
    one, two, up to three hundred Reichsthaler of capital, whereupon for every hundred Reichsthaler five
    Reichsthaler shall be struck off the hereditary rent annually'
  numbers:
  - 1 1/2
- page: 5
  en: 'The capital so paid off remains the property of the ground lordship, and this redemption of the
    hereditary rent takes place only in respect of the first half; the second half, of fifteen Reichsthaler
    per Hufe, on the other hand remains irredeemable and can never be raised or lessened.


    § VI. Besides the hereditary rent in cash, the hereditary lessee undertakes, for the present and for
    future times in perpetuity, to settle and to render the royal and other public dues falling upon these
    one and a half Hufen, in whatsoever they may consist, without any exception and without deduction
    from the hereditary rent or any other reimbursement.


    § VII. The hereditary lessee must build upon it at his own cost, without his'
  numbers:
  - 1 1/2
- page: 6
  en: 'receiving for this purpose, either now or in the future, timber or any other building assistance.
    However, all the timber standing upon his one and a half Hufen belongs to him in property, without
    exception.


    Likewise the hereditary lessee and his successors in the possession of this holding must effect all
    future repairs and new buildings out of their own means, without subsidy or assistance.


    § VIII. Outside his own holding the hereditary lessee has no right to firewood or pasturage in the
    lordship''s woods and fields.


    § IX. His drink the hereditary lessee must always take from the lordship''s brewery and distillery,
    or from the tavern.'
  numbers:
  - 1 1/2
- page: 7
  en: 'If by him or by his people foreign drink is brought in, the hereditary lessee incurs each time
    a penalty of five Reichsthaler for every barrel of beer and one Reichsthaler for every garniec of
    brandy, which penalty shall be rendered to the estate lordship.


    § X. To the milling compulsion the hereditary lessee is subject, and may grind his grain only where
    the estate lordship directs him.


    § XI. From each and every manorial service and delivery in kind, without distinction, the hereditary
    lessee is entirely and for ever exempted; he remains, however, subject to the jurisdiction of the
    manorial lordship of this place.


    § XII. The hereditary lessee and his successors in possession'
- page: 8
  en: 'possession is entitled to alienate his holding to another in any manner he pleases; but at each
    sale or exchange a sum of money must be rendered to the ground lordship as a transfer fee (Laudemium),
    and the consent of the same must be obtained for every alienation, inasmuch as the ground lordship
    hereby reserves to itself once and for all the right of pre-emption.


    § XIII. The hereditary lessee, for himself and his successors in possession, renounces entirely, for
    the present and for the future, each and every remission in cases of misfortune, whether these arise
    through fire from heaven, arson by evil persons, hailstorm, crop failure, cattle plague, inundation,
    war and pestilence, or in whatsoever manner it may be; and in the event of such cases neither any
    compensation nor remis-'
- page: 9
  en: 'sion of the hereditary rent shall take place.


    § XIV. All the costs pertaining to this contract the hereditary lessee undertakes to settle.


    § XV. His Most Serene Highness consents that the hereditary lessee may, on the ground of this contract,
    have his title of possession entered for himself.


    § XVI. So long as the hereditary lessee and his successors in possession shall fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights'
- page: 10
  en: and to defend them against any man's real claim. Should, however, the hereditary lessee or his successor
    remain in arrears with the annual hereditary rent for longer than two years, or else lay this holding
    waste and thereby diminish the revenues of the ground lordship, then the ground lordship shall be
    entitled to dispose of this holding otherwise, and the hereditary lessee forfeits his whole right
    and the entry money he has paid in. Both parties promise to keep this hereditary-lease contract firmly
    and inviolably; having been instructed by the court as to the consequences, they renounce all
- page: 11
  en: 'evasions available against it, in particular the objection of an injury suffered above or below
    the half, of cunning persuasion, fear, compulsion, of matters otherwise agreed than written down,
    or not rightly understood; they apply for this contract to be issued in judicial form, and, after
    it had first been read aloud to them word for word, have in token of their approval subscribed it
    below with their own hands.


    von Triebenfeld    Gottlieb Sarre


    Schenk


    Justitiarius


    Ogrodowicz


    Keeper of the Protocol. Which, for public faith, under'

- page: 2
  en: '§ I. His Most Serene Highness grants to Gottlieb Sarre, in the forest situated near Trąbczyn, 1
    1/2 Hufen, in words one and a half Hufen Magdeburg measure, the Hufe reckoned at thirty Morgen and
    each Morgen at one hundred and eighty square rods, of waste land, from Midsummer of this present year
    onward, in hereditary lease for all perpetual time.


    § II. Gottlieb Sarre pays for the Hufe Magdeburg measure 100 rt., in words one hundred Reichsthaler,
    hence for one and a half Hufen 150 r., in words one hundred and fifty Reichsthaler as entry money;
    and since this purchase money has already been paid in full, Gottlieb Sarre is hereby receipted without
    further reservation.


    § III. Gottlieb Sarre hereby binds himself, for himself and his successors in the possession of this
    holding, to pay from each Hufe an annual hereditary canon of 30 rtl., in words thirty Reichsthaler,
    hence for one and a half Hufen 45 rtll.'

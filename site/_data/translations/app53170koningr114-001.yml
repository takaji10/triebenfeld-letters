status: draft
segments:
- page: 1
  en: 'Done at Konin on the Wednesday next after the Solemn Feasts of Holy Easter in the year of the Lord
    1767.


    Judicial Site Inspection of the Embankment on behalf of the Right Honourable Prusimski


    Coming in person to the office and present records of the Konin Municipal Court, the Honest Bartłomiej
    Szepczyński of the village of Trąbczyn, Royal Court Summoner, being of sound health, declared that
    he, having taken with him two noblemen, namely the Honourables Stanisław Lipiński and Józef Rudkowski,
    though absent here from the court,'
- page: 2
  en: 'being nonetheless present at the time at the location of the below-written matter — at the instance
    and official requisition of the Right Honourable Antoni Prusimski of Kolno, heir of the estates of
    the village of Trąbczyn with its appurtenances — on the Holy Saturday not long past had descended
    upon the hereditary estates of Trąbczyn, and being there in such manner according to the form of law
    and custom, saw and duly inspected:


    an embankment recently raised at the end of the stawisko, by the raising of which the water flowing
    from that stawisko through the Trąbczyn estates had turned back, and had flooded the olędry settled
    in the Trąbczyn woodlands, together with their fields manured for cultivation and their meadows;


    which aforementioned things he asserted had been done in these times by the people of the neighbouring
    hereditary estate of the village of Łukom, on the mandate of the heir of those estates;


    concerning which the same above-written Royal Court Summoner made and makes this his present report.'

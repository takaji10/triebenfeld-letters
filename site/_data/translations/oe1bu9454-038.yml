segments:
- page: 1
  en: 'Most gracious Prince and Lord! After all the vexation, which has quite undermined my health, I
    lie wretchedly ill and cannot [uncertain: kunde] write much. Only this for now: I have received the
    3000 Rthl from the Baugnier Veit, and only yesterday delivered the instruction to Amelang. Now I must
    still raise a further 3000 Rthl, for the treasury received 5125 Rthl, 2000 I had, only 300 Rthl I
    had to borrow through the help of His Honour M. v. Zastrow; papers were given, we must Convers it
    seems, these were now new debts of 5176 Rthl, and these I was now to discharge, so I took your 3000
    Rthl for the purpose. I believed I should get 2126 Rthl upon the papers which Stecher deposited as
    security, but in the meantime the papers had so fallen that on the 4000 Rthl Märkische Landschaft
    obligations no one would advance even 500 Rthl. The tavern-keeper too was to be paid some 2683 Rthl
    on account of the defraying of the military execution; that amounted now afresh to 420[uncertain:
    9] rt. Courant, which in these grey woollen times were not to be raised — papers I could get, if I
    were willing to give Convent for them — these would then have amounted to some 21000 Rthl. God helped
    me meanwhile: the Baupiner, or Later, took timber and boards from Contop instead of money — by which
    the 4176 Rthl will be discharged, and the Minister Zastrow has his papers back already — I suffer
    3480 Rthl loss on the timber, for I had to give it up at half price — this Your Serene Highness must
    one day make good to me. This loss is small against 25000 Rthl — As to the [uncertain: dahrliche]
    matter, do indeed see to it, Your Serene Highness — for you pay with 20000 Rthl in ready money, which
    now hinders running, that is to say — could you raise 150000 Rthl there, then you have 750000 Rthl
    in papers and pay all your debts therewith. I cannot write more today, I am too faint; more in future
    — I am eternally Your Serene Highness''s. As soon as I have been, and I can raise the white money
    quickly, then I go to Vienna, and if it can be done, then I come to Öhringen; but should the business
    not permit it, then I return hither and write. Only see to it, Your Serene Highness, that you obtain
    150000 Rthl, for then Curland and all the stuff is paid. But it requires haste, the papers are rising
    [uncertain: wirdet] Berlin[uncertain: ], the 14th of June 1808. faithful servant v Triebenfeld'

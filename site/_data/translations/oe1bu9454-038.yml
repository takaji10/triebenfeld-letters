segments:
- page: 1
  en: '38


    Most gracious Prince and Lord, after all the vexation, which has quite undermined my health, I lie
    wretchedly ill and [uncertain: kunde] cannot write much. Only this for now: I have received the 3000
    rt from the banker Veit, and only yesterday delivered the order to pay to Amelang.


    Now I must still raise another 3000 rt, for the treasury received 5125 rt; of the 2/m I had only 3000
    rt. I had to borrow through the help of His Excellency the Minister von Zastrow; one gave papers,
    we must [have] Courant it seems — these were now 5176 rt of new debt, which I have now had to discharge,
    so I have taken your 3000 rtl for it. 2176 rt I thought to obtain upon the papers which Hecker had
    deposited as security; in the meantime, however, the papers had so fallen that upon 4000 rt of Märck
    Landschaft obligations no one would give even 500 rt.


    The tavern too had some 2003[?] rt to pay on account of the defraying of the military execution; that
    now amounted afresh to 4209 rt Courant, which in these ghastly times were not to be raised — papers
    I could obtain, if I were willing to give Courant for them — that would then have come to 21000 rt.
    God helped me meanwhile: the Baupiner or Later took wood and boards from Konotop instead of money
    — by this means the 4176 rt will be discharged, and the Minister Zastrow already has his papers back
    — I suffer 3480 rt of loss on the wood, for I had to let it go at half price — this Your Serene Highness
    must one day make good to me. This loss is small against 25000 rt — As to the dahrliche let Your Serene
    Highness indeed take care — for you pay with 20000 rt in cash now hindert laufend that is — could
    you raise 150000 rt there, then you have papers to the value of 750000 rt and with them pay all your
    debts.


    I can write no more today, I am too feeble; more in future — I am ever Your Serene Highness''s


    As soon as I have been, and I can quickly raise the Weise money, then I shall go to Vienna, and if
    it can be managed I shall come to Öhringen; but if business does not allow it, I shall return hither
    and write. Only let Your Serene Highness take care that you obtain 150000 rt, then Courland and all
    the stuff is paid. But it requires haste, the papers are rising wirdet. Berlin, the 14th of June


    1808.


    most faithful servant


    v Triebenfeld


    Something great must be afoot in the country: the Russian papers have risen unspeakably on the 8th
    of this month in Wrocław itself. There they hold the peace between Russia and England for certain.
    Now of our court I will say nothing. St: conducts himself badly, and by his money-in-paper manoeuvres
    he tears apart the last bond between the King and the nation. Also for the house St: only friendship
    —'

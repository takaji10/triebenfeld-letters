segments:
- page: 1
  en: 'Most gracious Prince and Lord!


    After all the vexation, which has quite undermined my health, I lie wretchedly ill and cannot write
    much [uncertain: knowledge]. Only now this much: the 3000 Rthl I have received from the Baugnier Veit,
    and only yesterday did I hand over the instruction to pay to Amelang.


    Now I must still raise 3000 Rthl together, for the treasury received 5125 Rthl, 2000 I had, only 300
    Rthl I had to borrow through the help of His Excellency the Minister von Zastrow; one gave papers,
    we must — Convers, it appears, that was now new debts of 5176 Rthl, and these I have now had to discharge,
    so I have taken your 3000 Rthl towards it. 2126 Rthl I thought to obtain upon the papers which Stecher
    has deposited as security, but meanwhile the papers had so fallen that upon the 4000 Rthl Mark Landschaft
    obligations one would not give even 500 Rthl.


    The inn was also to be paid some 2683 Rthl on account of the defraying of the military execution;
    that now amounted afresh to 420[uncertain: 9] rt. Courant, which in these grey woollen times were
    not to be raised — papers I could have obtained, if I had been willing to give Convent for them —
    these would then have amounted to 21000 Rthl. God helped me meanwhile: the Baupiner, or Later, took
    timber and boards from Kontop instead of money — by which means the 4176 Rthl will be discharged,
    and the Minister Zastrow has his papers back again already — I suffer 3480 Rthl loss on the timber,
    for I had to let it go at half price — this Your Serene Highness must one day make good to me. This
    loss is small against 25000 Rthl — As to the [uncertain: yearly] matter, Your Serene Highness need
    have no care — for you pay with 20000 Rthl in cash, now hindered, running, that is — if you could
    raise 150000 Rthl there, then you have papers to the value of 750000 Rthl and pay all your debts with
    them.


    I can write no more today, I am too faint; more in future — Eternally I am Your Serene Highness''s


    As soon as I have been [there] and I can raise the white money quickly.


    raise it, then I go to Vienna, and if it can be done


    then I come to Öhringen, but if the business does not allow of it, then I return hither and write.
    Only let Your Serene Highness see to it that you obtain 150000 Rthl, then Courland and all the stuff
    is paid. But it requires haste; the papers are rising. Berlin[?] the 14th of June


    1808.


    faithful servant


    v Triebenfeld'

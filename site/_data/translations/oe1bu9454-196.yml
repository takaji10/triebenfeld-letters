- page: 3
  en: 'to let 15000 men go. Merkel has already had secret intelligence on that account. What will become
    of us? Hardenberg, it is said, lives on the Parsons'' Island and works day and night — A great change
    is impending for everything. Publicly it is said – Napoleon wishes to let 10 [uncertain: Müllerinnen]
    be made away with, but in return we are to give 20000 men to Spain or against the Turks. This last
    few believe. Napoleon means to destroy my money and our House.


    The Dutch loan has fallen apart because the Silesian domains cannot be accepted as security.


    Concerning the business of the 35000 Rthl, Professor Schade will write to Your Serene Highness about
    everything in detail — Merckel is very well disposed, and so is Berger — Your Serene Highness must
    write to the Liquidation Commission in Berlin and appeal to Berger''s testimony — As soon as I can
    return in safety I shall write again. In the meantime let Goldstücker and Flesch be at work. With
    respects I remain, until death,


    Your Serene Highness''s


    Tomorrow I go to the sub-prefect


    Zychlinski. Schwarzwald bey Medzibor, the 25th of May 1810. humble and obedient servant


    v Triebenfeld'

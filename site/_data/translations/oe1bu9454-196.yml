- page: 2
  en: will certainly learn it exactly, for Lahr had solemnly granted me the respite; he may perhaps have
    omitted to write to his mandatary on the matter, and the fellow would have excused himself with ignorance
    once he had disgraced me together with the Jews. I believe I can trace all this back to Sterch's conduct
    – the Jew has hidden himself from me these 4 days, and I hold his whole proposed exchange-bargain
    to be a Jewish swindle. God grant that I am deceived – but my friends themselves are convinced of
    it to the highest evidence. In the meantime I shall act as an upright man, and shall pursue the vindication
    of the Trąbczyn estates with equal zeal. As people otherwise say in Breslau, things look very gloomy
    on the political horizon – Napoleon has declared that he wants the contribution quickly. He would
    at once let execution troops move into our states, and send an administrator here – He finds it necessary
    for himself to have so many troops – this last is now said to have been taken to heart, and the resolution
    already taken, at once

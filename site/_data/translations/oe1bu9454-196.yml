- page: 1
  en: '196


    Most Serene Prince


    Most gracious Prince and Lord, In order not to be led today to the town hall like a thief and locked
    up, I had to flee from Wrocław like a SP. Lahr, to whom I still owe 1,500 Rthl from that time, because
    he reckons the iron at only 3 Rthl, wished to have me arrested on that account — He had promised me
    by this post to wait until Michaelmas, and notwithstanding this his authorised representative secretly
    obtained the warrant of arrest against me — Had it not been betrayed to me by a couple of friends,
    I should now be sitting, burdened with everlasting mockery and shame, in the Wrocław town hall — Out
    of necessity I must now sell my mill for half its worth in order to escape this disgrace. For the
    rest, let me be hanged if Flesch and his associates are not to blame for this affair — for the rascals
    have been seen trotting twenty times to Ludwig, who is Lahr''s authorised representative. My friends'

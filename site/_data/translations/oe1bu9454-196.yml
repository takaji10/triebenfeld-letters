- page: 3
  en: '15,000 men. Merckel already has secret intelligence on this. What is to become of us? Hardenberg,
    it is said, is living on the [uncertain: Pfarren] Island and works day and night — A great change
    is impending for everything — Publicly it is said that Napoleon means to let 10 millions fr. [uncertain:
    be dropped], but that in return we are to give 20,000 men for Spain or against the Turks. This last
    few believe. Napoleon means to destroy [uncertain: my] money and our house.


    The Dutch loan has fallen apart, because the Silesian domains cannot be accepted as security.


    Concerning the 35,000 Rthl business, Professor Schade will write to Your Serene Highness about everything
    in full — Merckel is very well disposed, and so is Berger — Your Serene Highness must write to Berlin
    to the Liquidation Commission and cite Berger''s testimony — As soon as I can return in safety I shall
    write again. In the meantime let Goldstücker and Flesch work upon it. With all respect I remain, until
    death,


    Your Serene Highness''s


    Tomorrow I go to the [uncertain: Leus Praefat]


    Zychlinski —


    Schwarzwald near Międzybórz[uncertain]


    the 25th of May 1810. humble and obedient servant


    v Triebenfeld'

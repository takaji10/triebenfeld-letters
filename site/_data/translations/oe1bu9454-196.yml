status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord, In order not to be led to the town hall today
    like a thief and locked up, I should have to flee from Breslau like a Sp. Lahr, to whom I am still
    owing 1500 Rthl from that time, because he reckons the iron at only 3 Rthl, wished on that account
    to have me arrested — He had promised me by this post to wait until Michaelmas, and notwithstanding
    that his mandatary secretly procured the warrant of arrest against me. Had it not been betrayed to
    me by a couple of friends, I should now be sitting in the Breslau town hall, burdened with everlasting
    mockery and shame. Out of necessity I must now sell my mill for half its worth, in order to escape
    this disgrace. For the rest, let me be hanged if Flesch and consorts are not to blame for this affair
    — for the rascals have been seen trotting twenty times to the said Ludwig, who is Lahr's mandatary.
    My friends
- page: 2
  en: 'will certainly learn it precisely, for Lahr had solemnly promised me the respite; he may perhaps
    have omitted to write to his mandatary on that account, and the fellow would, once he had disgraced
    me along with the Jews, have excused himself with ignorance. I believe I can trace all this back to
    the conduct of Sterch — the Jew has hidden himself from me these 4 days, and I hold his whole proposed
    exchange-transaction to be a Jewish swindle. God grant that I deceive myself — but my friends themselves
    are convinced of it to the highest evidence. I shall meanwhile act as an upright man, and pursue the
    vindication of the Trąbczyn estates with [uncertain: equal] zeal. As they otherwise say in Breslau,
    matters look very gloomy on the political horizon — Napoleon has declared that he wants the contribution
    quickly. He would at once let execution troops move into our states, and send an administrator hither
    — He finds it necessary for himself to have so many troops — this last is said now to have been taken
    to heart, and the resolution already taken, at once'
- page: 3
  en: 'to let 15000 men go. Merkel already has secret intelligence on that account. What will become of
    us? Hardenberg, it is said, lodges on the Pfaueninsel and works day and night — A great change is
    impending over everything. Publicly it is spoken — Napoleon means to let 10 millions be remitted,
    but in return we are to give 20000 men to Spain or against the Turks. This last few believe. Napoleon
    wishes to destroy me money and our house. The Dutch loan has fallen apart, because the Silesian domains
    cannot be accepted as pledge. Concerning the 35000 Rthl business, Professor Schade will write to Your
    Serene Highness on everything in detail — Merckel is very well disposed, and so is Berger — Your Serene
    Highness must write to Berlin to the Liquidation Commission and appeal to Berger''s testimony — As
    soon as I can return in safety I shall write again. In the meantime let Goldstücker and Flesch be
    at work. [uncertain: Respects mole] I remain, until death, Your Serene Highness''s Tomorrow I go to
    the [uncertain: Leus] Prefect Zychlinski Schwarzwald bey Medzibor, the 25th of May 1810. humble and
    obedient servant v Triebenfeld'

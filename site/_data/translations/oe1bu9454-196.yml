- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, In order not to be led to the town hall today like a thief and locked
    up, I have had to flee out of Breslau like a Sp. Lahr, to whom I still owe 1500 Rthl from that time,
    because he reckons the iron at only 3 Rthl, wished to have me arrested on that account – He had promised
    me by this post to wait until Michaelmas, and notwithstanding that, his mandatary secretly procured
    the warrant of arrest against me. Had it not been betrayed to me by a couple of friends, I should
    now be sitting in the Breslau town hall, burdened with everlasting mockery and disgrace. Out of necessity
    I must now sell my mill for half its worth, in order to escape this ignominy. For the rest, let me
    be hanged if Flesch and his associates are not to blame for this business – for the rascals have been
    seen trotting twenty times to that Ludwig who is Lahr''s mandatary. My friends'

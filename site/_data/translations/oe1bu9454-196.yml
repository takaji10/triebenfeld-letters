- page: 2
  en: 'will certainly learn it exactly, for Lahr had solemnly granted me the respite; he may perhaps have
    omitted to write to his authorised representative about it, and the fellow would have excused himself
    with ignorance once he had disgraced me along with the Jews. I believe I can trace all this to Flesch''s
    conduct — the Jew has [uncertain: crept away] from me these 4 days, and I hold his whole proposed
    exchange transaction to be a Jewish swindle. God grant that I am mistaken — but my friends themselves
    are convinced of it to the highest degree of evidence. Meanwhile I shall act as an upright man, and
    shall pursue the vindication of the Trąbczyn estates with equal zeal. As they say otherwise in Wrocław,
    things look very gloomy on the political horizon — Napoleon has declared that he will have the contribution
    quickly. He would at once have execution troops march into our states, and send an administrator here
    — He finds it necessary for him to [uncertain: keep] so many troops — this last is said now to have
    been taken to heart, and the resolution already taken to send off at once'

- page: 1
  en: 'On behalf of His Honour Prusimski against the Right Honourable Chełmski — Report


    Appearing in person, the Honest Bartłomiej Szepczyński of the village of Trąbczyn, General Royal Court
    Summoner, being sound, recognized that he had served authentic citation letters for the Kalisz Municipal
    Court sessions, for the matter to be heard at the Kalisz Municipal Court — because on behalf and at
    the instance of the Illustrious Right Honourable Antoni of Kolno Prusimski, Captain of Niszczewice,
    heir of the estates of Trąbczyn, and likewise of the Honourable Leon Maszewski and Franciszek Liberacki
    and others as plaintiffs, against the Right Honourable Stanisław Chełmski, Treasurer of Wschowa, and
    others as cited parties — copies and certified documents to be produced at the forthcoming session,
    similarly issued, at the manor house of the estates of the village of Łukom, at the table in the heated
    room, with the cited party present, on the preceding day, preceding the present act, set down and
    left notified.'

segments:
- page: 1
  en: Most Serene Prince! Most gracious Prince and Lord! Your Most Serene Highness's command of the 31st
    of last month I received today. Tomorrow morning I shall go to the Count von Schulenburg, deliver
    to him the letter addressed to him and await his further declaration. By the next post I shall not
    fail to submit in most humble [submission] the result of my conference. In deepest reverence I remain,
    until death, Your Most Serene Highness's Berlin, the 3rd Nov. 1834. most humble and obedient servant
    Amelang

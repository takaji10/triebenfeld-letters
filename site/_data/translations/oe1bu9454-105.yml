  en: '105


    Most Serene Prince


    Most gracious Lord!


    I have satisfied Count Schlabrendorff and have the receipt in hand — the sum of the interest came
    to 11085 Rthl, and the receipt is made out precisely to Your Most Serene Highness — I, however, now
    have not a syllable towards the covering of my [illegible] in hand, nor do I ask anything on that
    score, for I am too certain that Heaven will bring Your Most Serene Highness back quite well and happy,
    and that everything — everything will go according to wish.


    Her Serene Highness the Princess I was not able to have the good fortune of speaking with when I travelled
    here — I had myself announced 3 times, but was not once received. It appears as though the letter
    of the [uncertain: Prittwitz] — as though I were hated by the King and by the public — has also made
    a sensation in Wrocław — this, however, is of no consequence, for I'

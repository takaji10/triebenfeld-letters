- page: 3
  en: 'This very moment I receive from Glenck news in the Prusimski lawsuit matter which is precisely
    not good, for I [see] that the jurists mean to cheat us. Since I still have all the blank signed forms
    most graciously entrusted to me in my hands, I would at once submit a letter here to the Grand Chancellor
    and beg for an extension of the term. Time gained is everything gained — In deepest reverence I remain,
    until death, Your Most Serene Highness''s, Berlin, the 30th of April 1799, most faithful servant


    v. Triebenfeld'

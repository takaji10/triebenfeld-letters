status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Lord! I have satisfied Count Schlabrendorff and have the receipt
    to hand — the sum of the interest came to 11085 Rthl, the receipt is made out directly to Your Most
    Serene Highness — I, however, have now not a syllable towards the covering of my 10. "to hand; nor
    do I ask anything after it, for I am too certain that Heaven will help Your Most Serene Highness back
    quite sound and happy, and that everything — everything will go according to wish. I could not have
    the good fortune of speaking with Her Serene Highness the Princess when I travelled hither — I had
    myself announced 3 times but was not once received. It appears as though the writing of the [one]
    to Prittwitz — as though I were hated by the King and by the public — had caused a sensation in Breslau
    as well; this, however, signifies nothing, for I
- page: 2
  en: 'find myself here in Berlin and Pot:[uncertain: Potsdam] so very well in soul. Our good Queen was
    truly quite ill, but is improving, to the joy of all upright vassals. The Monarch is well, and labours
    not only with boundless activity for the welfare of the State but also drills the troops in such a
    way that one''s heart laughs in one''s body. On Sunday I saw the old Guard, also in white gaiters
    and their grenadier caps — upon the faces of the whole battalion one saw so plainly the most memorable
    joy to me, and by God a tear trembled in my eye, for that is the old brave Köckritz''s work — the
    officers now receive their place at table and feel themselves as happy as the others. The worthy men
    K. Z[astrow]. and R. are in good health and live in the greatest harmony. Of war there is no thought,
    and in this matter too the Monarch already shows before all the world his rock-firm steadfastness
    and whole manner of thinking.'
- page: 3
  en: This very moment I receive from Glenck news in the Prusimski lawsuit matter which is precisely not
    good, for I [see] that the jurists mean to cheat us. Since I still have in my hands all the blank
    forms most graciously entrusted to me, I would at once submit a writing here to the Grand Chancellor
    and beg for a prolongation of the term. Time gained is all gained — In deepest reverence I remain,
    until death, Your Most Serene Highness's Berlin, the 30th April 1799. most faithful servant v. Triebenfeld

- page: 2
  en: 'find myself here in Berlin and Pot:[Potsdam?] so very well in my soul. Our good Queen was truly
    quite ill, but is recovering, to the joy of all upright vassals. The Monarch is well, and not only
    labours with boundless activity for the good of the State but also drills the troops in such a way
    that one''s heart laughs in one''s body. On Sunday I saw the old Guard, in white gaiters too, and
    their grenadier caps - upon the faces of the whole battalion one saw truly the most memorable joy
    to me, and by God a tear trembled in my eye, for that is the old brave [uncertain: Köch:] work - the
    officers now receive their place at table and feel themselves as happy as the others. The worthy men
    K. Z[astrow]. and R. are in good health and live in the greatest harmony.


    Of war there is no thought to be had, and the Monarch already shows in this matter, before the whole
    world, his rock-firm steadfastness and all his way of thinking'

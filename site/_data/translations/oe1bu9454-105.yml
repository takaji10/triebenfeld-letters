  en: 'Most Serene Prince,


    Most gracious Lord!


    I have satisfied Count Schlabrendorff and have the receipt in hand - the sum of the interest amounted
    to 11085 Rthl; the receipt is made out directly to Your Most Serene Highness - I, however, now have
    not a syllable towards the covering of my


    10. "in hand; nor do I ask after it, for I am too certain that the [uncertain: zimel] helps Your Most
    Serene Highness back quite healthy and happy, and that everything - everything will go according to
    wish.


    The Princess''s Serene Highness I could not have the good fortune of speaking with when I travelled
    hither - I had myself announced 3 times but was not once received. It appears as though the letter
    of von Prittwitz - to the effect that I am hated by the King and by the public - has also caused a
    sensation in Breslau - this, however, signifies nothing, for I'

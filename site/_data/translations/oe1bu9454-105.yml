- page: 2
  en: 'find myself here in Berlin and Pot[sdam] in very good spirits indeed — Our good Queen was truly
    quite ill, but is [uncertain: mending], to the joy of all upright vassals — The Monarch is well, and
    not only labours with boundless activity for the good of the State but also drills in such a way as
    makes one''s heart laugh within one''s body — on Sunday I saw the old Guard, in white gaiters too
    and their grenadier caps — on the faces of the whole battalion one saw the [uncertain: most memorable]
    joy, and by God a tear trembled in my eye, for that is the work of the brave old Köck[ritz] — the
    officers now receive their place at table and feel themselves as happy as the others. The worthy men
    K[öckritz], Z[astrow] and R. are in good health and live in the greatest harmony.


    Of war there is no thought, and the Monarch already shows in this matter, before the whole world,
    his rock-firm steadfastness and all cast of mind'

- page: 3
  en: 'This very moment I receive news from Glenck in the Prusimski lawsuit which is just not good, for
    I [uncertain: note] that the jurists mean to cheat us. Since I still have in my hands all the blank
    sheets most graciously entrusted to me, I would straightway give a letter here to the Grand Chancellor
    and ask for an extension of the deadline — time gained, all gained — In deepest reverence I remain,
    until death, Your Most Serene Highness''s Berlin, the 30th of April 1799.


    most faithful servant


    v. Triebenfeld'

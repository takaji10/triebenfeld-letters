segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    The Rochlitz affair has now been set in motion, as the enclosure shows, and Your Most Serene Highness
    will, as I confidently hope, have nothing to pay. This is a knavish swindle; the thief has pushed
    it through in secret in order to defraud Your Most Serene Highness. Nothing of it had ever come before
    my eyes. That I dismissed the fellow in the year 1804 Glenck knows very well. He must bear witness
    to it as well. I gave him notice at that time in my capacity as general attorney, and dismissed him.
    Whether Your Serene Highness may perhaps afterwards, without my knowledge, have promised him anything,
    is simply unknown to me; nor do I credit it of the building councillor Otocki that he should have
    secretly assured the rogue of anything afterwards. I can swear it with a true heart, that I at that
    time removed Rochlitz from his service and demanded of him the accounts, which, however, he refused
    to render to me.


    May Your Serene Highness deign to send me, at the very earliest, two or three blank forms for litigation
    powers of attorney - that is to say, only three printed litigation powers of attorney, signed and
    sealed - so that Melzig may prosecute the Rochlitz affair, and may also collect the outstanding arrears
    for Your Serene Highness. They amount certainly to some 18000 Rthl and are entirely liquid. Tomorrow
    or the day after I expect Honrich''s'

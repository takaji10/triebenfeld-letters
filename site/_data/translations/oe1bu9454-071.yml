- page: 1
  en: '71


    Most Serene Prince


    Most gracious Prince and Lord!


    The Rochlitz matter has now been set in train, as the enclosure shows, and Your Most Serene Highness
    will, as I confidently hope, have nothing to pay. This is a knavish swindle; the thief wanted to push
    it through in secret so as to defraud Your Most Serene Highness. Nothing of it had ever come before
    my eyes. That I dismissed the fellow in the year 1804 Glenck knows very well. He must bear witness
    to it as well. I gave him notice at that time in my capacity as general attorney, and dismissed him.
    Whether Your Serene Highness may perhaps afterwards, without my knowledge, have promised him anything
    is simply unknown to me, and neither do I credit the building councillor Glenck with having afterwards
    secretly given the rogue any assurance. I can swear with a true heart that I then removed Rochlitz
    from his post and called in the accounts, which he however refused to render to me.


    May Your Serene Highness deign to send me at the very earliest two or three blank forms for powers
    of attorney in litigation - that is to say, merely three printed powers of attorney in litigation,
    signed and sealed - so that Melzig may prosecute the Rochlitz matter and may also call in the outstanding
    arrears for Your Serene Highness. They amount certainly to some 18,000 Rthl and are entirely liquid.
    Tomorrow or the day after I expect Honrichs'

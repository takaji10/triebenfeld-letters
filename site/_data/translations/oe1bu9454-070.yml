- page: 2
  en: 'As regards Trąbczyn we already have [uncertain: have] a great advantage, for the knavish Kramplitz
    has, as the enclosure shows, not appeared.


    A new term has been appointed for the 2nd of April — Kwilecki remains a further 2 months — so nothing
    is lost.


    Raczhowski and Küntzel are conducting the matter with Honrichs — everything is now disposed in favour
    of Your Serene Highness''s interest. These estates will certainly be vindicated, and we shall have
    Zagórów free again and Trąbczyn back; then it cannot fail. I enclose Raczkowski''s and Küntzel''s
    letters, but beg to have everything sent back to me quickly.


    That I am not coming to Sławięcice — over this Your Serene Highness is not to be angry. It is done
    for your own best that I sit here, vex myself and go hungry — I mean truly well by you, most gracious
    Lord. I am saving everything for you and shall, by God, obtain more for you than you imagine; but
    do not mistake me, and do not construe my actions wrongly. The moment is not far off when we shall
    be able to laugh at our enemies — From Berlin there is little to be hoped, and therefore we must not
    be precipitate; compliments are of no avail. When I have spoken with Hecker and Honrichs, then for
    your sake, before I come to Sławięcice, I shall go to Berlin for 6 days — that I know more, most gracious
    Prince and Lord, you may believe — otherwise I should not travel thither — My pride no god bends —
    The matter concerning Colloma has been begun; I shall bring it to an honourable end, and in Berlin
    shall already know wherewith I can stop every man''s mouth — [text uncertain: Nachhandelt mann Sie
    zu und ankbar]. I suffer no humiliation and will'

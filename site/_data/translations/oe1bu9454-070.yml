- page: 1
  en: '70


    Most Serene Prince


    Most gracious Prince and Lord. From the accompanying letter of Hecker Your Most Serene Highness will
    most graciously be pleased to satisfy yourself that God often leads His own in wondrous ways — I wanted
    to let Hecker go, but owing to a misunderstanding of the Chief Prefect Garczynski I must now let him
    remain in place until a milder wind passes over our fields.


    Garczynski believed that he had to hand everything over to Heiller and has had him summoned with that
    in view. So as to hinder nothing, I let the matter proceed, for Hecker out of foolish zeal has given
    surety with body and soul. He vows to have everything paid by Midsummer. That I shall very gladly
    accept. But to go quite securely, I have appointed him to meet me with Honrichs at Costen, where I
    shall speak with him myself and have him once more stipulate everything judicially.


    His, Hecker''s, security I shall assign to Garczynski, so that the fellow may be properly held in
    hand; meanwhile I shall not let him govern over the cash-box alone, despite the paper security, but
    shall through Garczynski have Cabanis / who is a thoroughly honest man / set beside him as controller;
    thus Garczynski will warrant everything back again, and if Hecker blunders in, he may not cry out
    against Your Serene Highness or against me. In this way the matter stands wonderfully well.'

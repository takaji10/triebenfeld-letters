- page: 3
  en: 'forgive nothing, either to you or to myself. You are the only one on this earth [uncertain: wund]
    to whom I poured out my heart and to whom I lamented a suffering. To the King himself I wrote as my
    feeling demanded. He is indebted to me in the sum total and did not pay even one Groschen for all
    my sacrifices — I could therefore speak boldly, and now it shall be done orally with still greater
    emphasis. — Rochad means well by Your Serene Highness and by me — but in real terms he does little
    — I [text uncertain: weill bemüht ſind] his feelings, and therefore I shall make the journey in haste.


    The 600 Rthl which Honrichs took with him have been converted into 2 feet of old Hungarian and have
    flowed into Garczynski''s cellar — they work well — My estates have been handed over to the tenants;
    everything is so ordered that no new debts can be made, and the tenants must pay the interest promptly
    half-yearly under their own liability — But the Landschaft is liquidating, for its 2 years'' sequestration,
    in the course of which it too remitted not a Groschen, a further 4,000 Rthl in costs. There the surplus
    of the lease goes for a whole year more, and I must meanwhile live wretchedly with my family. Yet
    for all that I do see the end of my sufferings.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Konotop, the 25th of March


    1810.


    faithful, humble and obedient servant


    v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord!


    From the accompanying letter of the said Hecker Your Most Serene Highness will most graciously deign
    to satisfy yourself that God often leads His own in wondrous ways. — I wished to let Hecker go, but
    through a misunderstanding of the Ober-Präfect Garczynski I must now let him stay on [uncertain: sezzen
    / "sit"] until a milder wind passes over our fields. Garczynski believed he had to hand over everything
    to Heiller, and with that in view had him summoned. So as to hinder nothing, I let the matter proceed;
    Hecker, out of [uncertain: demmen] zeal, has pledged himself body and soul. He vows to have paid everything
    by St. John''s. That I shall accept most gladly. But in order to go entirely securely, I have summoned
    him, together with Honrichs, to Costen, where I shall speak with him myself and once more have everything
    stipulated by him before the court. His — the Wecker''s — security I shall assign [Anweisung] to Garczynski,
    so that one has the fellow properly in hand; meanwhile I shall not only not let him have sole control
    over the cash-box, in spite of the paper security, but shall, through [uncertain: Parczynchen / Garczynski],
    place Cabanis (who is a thoroughly honest man) at his side as controller; thus [uncertain: Parcynchi
    / Garczynski] will make good everything again, and if Hecker blunders in, he may not cry out against
    Your Serene Highness or against me. In this way the matter stands wonderfully well.'
- page: 2
  en: 'As regards Trąbczin we already stand at a great advantage, for the knavish Kramplitz, as the enclosure
    shows, did not appear. The 2nd of April has been set as a new term. — Kirchli remains a further 2
    months. — Hence nothing is lost. Raczkowski and Künzel, together with Honrichs, are conducting the
    matter — everything is [uncertain: jagt] disposed in favour of Your Serene Highness''s interest. These
    estates will assuredly be vindicated, and if we have Zagorowo free again, and Traperin back, then
    it cannot fail; Placzkowzin''s and Künzel''s letters I enclose, but I beg to have everything sent
    back to me quickly. That I do not come to Schlawenschitz — over this Your Serene Highness must not
    [illegible: "reinen"]. It is for your own best interest that I sit here, vex myself, and go hungry.
    — I mean truly well by you, most gracious Lord. I am saving everything for you, and by God I shall
    procure you still more than you think; but do not be mistaken, and do not construe my actions wrongly.
    The moment is not far off when we shall be able to laugh our enemies to scorn. — From Berlin there
    is little to be hoped, and therefore we must not be over-hasty; compliments are out of place. When
    I have spoken with Rector and Honrichs, then, for your sake, I shall go to Berlin for 6 days, before
    ever I come to Schlawenschitz. — That I know more, most gracious Prince and Lord, you may believe
    — otherwise I should not travel thither. — My pride is bowed by no god. — The affair concerning Colloma
    has been begun; I shall bring it to an honourable end, and in Berlin shall already know wherewith
    I can stop every man''s mouth. Afterwards one deals with you [uncertain: zu und ankbar]. I suffer
    no humiliation, and shall'
- page: 3
  en: 'forgive nothing, either to you or to myself. You are the only one on this earth to whom I have
    poured out my heart and to whom I have lamented a sorrow. To the King himself I wrote as my feeling
    demanded. He is indebted to me in a total sum, and for all my sacrifices did not count out even one
    Groschen — so I could speak freely [uncertain: Leck], and now it shall be done by word of mouth with
    still greater emphasis. — Rochad means well by Your Serene Highness and by me — but in real terms
    he does little. — I will endeavour to [uncertain: to become] his feelings, and therefore I shall make
    the journey in haste. The 600 Rthl which Honrichs took with him have been laid in in 2 feet of old
    Hungarian wine and have flowed into Garczynski''s cellar. — They work well. — My estates have been
    handed over to the tenants; everything is so ordered that no new debts can be contracted, and the
    tenants must pay the interest punctually half-yearly on their own responsibility. — But the Landschaft
    is liquidating, for its 2 years'' sequestration, in the course of which it too has delivered up not
    a Groschen, a further 4000 ℔ in costs. There the surplus rents for a whole year go to nothing, and
    I must meanwhile live wretchedly with my family. Yet for all that I do see the end of my sufferings.


    In deepest reverence I remain, until death, Your Most Serene Highness''s


    Kontop, the 25th of March 1810.


    faithful humble and obedient servant

    v Triebenfeld'

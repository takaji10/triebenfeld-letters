- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, From the accompanying letter of the said Hecker Your Most Serene Highness
    will most graciously be pleased to convince yourself that God often leads His own in wondrous ways.
    – I wished to let Hecker go, but through a misunderstanding of the Chief Prefect Garczynski I must
    now let him remain seated until a milder wind passes over our fields.


    Garczynski believed he had to hand everything over to Heiller and has had him summoned with that in
    view. So as to hinder nothing I let the matter take its course; Hecker out of [uncertain: that same]
    zeal has gone surety with body and soul. He vows to have everything paid by Midsummer. That I shall
    very gladly accept. But in order to go quite securely I have appointed him to come with Honrichs to
    Costen, where I shall speak with him myself and have everything once more stipulated by him before
    the court.


    His, the Wecker''s, security I shall assign to Garczynsken, so that the fellow may be properly held
    in hand; in the meantime I shall not only let him have the disposal of the treasury despite the paper
    security, but shall have Cabanis (who is a thoroughly honest man) set at his side by Parczynchen as
    controller, so Parcynchi will guarantee everything back, and if Hecker blunders in he may not cry
    out against Your Serene Highness or against me; this matter stands in that way wonderfully well.'

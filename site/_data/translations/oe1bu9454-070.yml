- page: 2
  en: 'As regards Trąbczyn we already stand at a great advantage, for the knavish Kramplitz has, as the
    enclosure shows, not appeared.


    A new hearing has been appointed for the 2nd of April – Kirchli remains a further 2 months — Therefore
    nothing is lost.


    Raczkowski and Künzel are conducting the matter together with Honrichs – everything is [uncertain:
    eagerly] disposed in favour of Your Serene Highness''s interest. These estates will certainly be recovered
    by suit, and once we have Zagorowo free again, Traperin back, then it cannot fail; Placzkowzin''s
    and Künzel''s letters I enclose, but beg that everything be sent back to me quickly.


    That I do not come to Schlawenschitz, over that Your Serene Highness must not [uncertain: complain].
    It is done for your own best good, that I sit here and vex myself and go hungry — I mean truly well
    by you, most gracious Lord. I am saving everything for you and shall, by God, procure you still more
    than you think; but do not [uncertain: mistake] me and do not construe my actions wrongly. The moment
    is not far off when we shall be able to laugh at our enemies – From Berlin there is little to hope,
    and for that reason we must not act over-hastily; compliments are of no avail. When I have spoken
    with Rector and Honrichs, then, for your sake, before I come to Schlawenschitz I shall go to Berlin
    for 6 days — that I know more, you may believe, most gracious Prince and Lord, – otherwise I should
    not travel thither – My pride is bowed by no god – The affair concerning Colloma has been begun; I
    shall bring it to an honourable end, and shall know already in Berlin wherewith I can stop every man''s
    mouth. Afterwards one deals with you and thankfully. I suffer no humiliation, and shall'

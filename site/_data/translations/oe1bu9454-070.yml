- page: 3
  en: 'forgive nothing, either to you or to myself. You are the only one on this earth [uncertain: sore]
    to whom I poured out my heart and to whom I lamented a suffering. To the King himself I wrote as my
    feeling required. He owes me a sum total, and did not pay even one Groschen for all my sacrifices
    — I could therefore speak freely, and now it shall be done by word of mouth with still greater emphasis.
    – Rochad means well by Your Serene Highness and by me – but in real terms he does little — I shall
    be at pains to [uncertain: win] his feelings, and for that reason I shall make the journey in haste.


    The 600 Rthl which Honrichs took with him have been converted into 2 casks of old Hungarian wine and
    have flowed into Garczynski''s cellar — They work well — My estates have been handed over to the tenants;
    everything is so arranged that no new debts can be contracted, and that the tenants must pay the interest
    promptly half-yearly on their own responsibility – But the Landschaft is liquidating, for its 2-year
    sequestration, in which it likewise remitted not one Groschen, a further 4000 ℔ in costs. There the
    surplus rents for a whole year go to that too, and I must meanwhile live meagrely with my family.
    Still, for all that, I see the end of my sufferings.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Kontop, the 25th of March


    1810.


    faithful, humble and obedient servant


    v. Triebenfeld'

segments:
- page: 1
  en: 'On behalf of the Right Honourable Chełmski, Treasurer of Wschowa, against His Honour Prusimski
    — Report


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Stanisław
    Stachowski of the village of Łukomia, General Royal Court Summoner, being sound, recognized that he
    had served authentic citation letters for the Kalisz Municipal Court sessions, of the underwritten
    tenor as follows:


    Casimir Nałęcz Raczyński of Raczyno and Matoszyn, Starost General of Greater Poland — to you, the
    Illustrious Right Honourable Antoni Prusimski, Starost of Niszczewice, Knight of the Distinguished
    Order of Saint Stanislaus, heir of the estates of Trąbczyn and others pertaining thereto, and to the
    Honourable Leon Maszewski, steward of those same estates — from all your estates generally and from
    all sums of money of every kind, had and to be had, we command: that you appear in person and peremptorily
    at our own next Kalisz Municipal Court sessions, at the instance of the Right Honourable Ignacy Stanisław
    Chełmski, Treasurer of Wschowa, heir of the estates of Łukom and others, and of the Honourable Ignacy
    Jaroszewski, steward of those same estates, as plaintiff — who, adhering to his documents, both manifestos
    made and to be made, cite you to see and hear: you, or rather you, the Honourable Leon Maszewski —
    as an invader of the estates — with respect to the pine forest line, assigned by the post-commissorial
    decree concerning the adjudication of the boundary delimitation between the estates of Trąbczyn and
    the estates of Łukom as marked on the map, together with the Hollandry, hereditarily reserved and
    left as belonging to the estates of Łukom as the plaintiff''s property, and held in the plaintiff''s
    continuous peaceful possession up to the present act now of the erection of the boundary mounds carried
    out under the Tribunal decree; of the oxen, wagons and axes of the plaintiff''s men entering that
    same pine forest only for the necessary extraction of timber, who were intercepted; in respect of
    the said interception and invasion of the pine forest together with the working men Thomas Fryzyer,
    Stanisław Lokaj, Jan Wochnicki — keepers of the Trąbczyn forest — Simon Jachowski — likewise keeper
    of the Nowa Wieś forest — Stanisław, Józef, and Grzegorz, coachmen, and Jan Mathias, court summoner,
    who by the present citation are arrested in your keeping: to be adjudged deserving of condign penalties;
    and that distinct penalties should also be extended to you, the Right Honourable Prusimski, if the
    same violent acts'
- page: 2
  en: 'are found to have been carried out on your orders; notwithstanding your manifesto and site inspection
    illegally procured by you — these being on the contrary annulled and held for nothing — for your action
    in the plaintiff''s role to be adjudged incompetent against you; the stationing of men by you, pretended
    as null, to be removed; the presumed violences by you to be held as null; the production of the men
    to be ordered and an inquiry to be conducted; that you be cited and respond judicially.


    Given in the Kalisz Municipal Court on 10 March 1783.


    In the estates of Nowa Wieś and at the farmstead located there, at the seat in the heated room, in
    the presence of the revenue scribe, on this present day, the contents of the present act set down
    and left notified.'

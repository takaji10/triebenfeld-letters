status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The good old Weigel has been here. He has handed over to
    me his whole business, which he has with Your Serene Highness. In accordance with our agreement I
    am to travel with him to Your Serene Highness as soon as I recover — the more quickly God now helps
    me, the sooner I shall be with the old house at Your Serene Highness''s. His offers are good and certainly
    advantageous for Your Serene Highness. Herr v. Sobottendorff may set his mind at rest; his affair
    too can be settled, were I to come there. The papers in question I await full of longing, in order
    to keep the machine in motion. May Your Serene Highness sign the enclosed letter and send it back
    to me by express, so that I may hand it over to the Prefect. Honrichs is a wretched villain. For the
    rest, I have just this moment heard a sad piece of news: my son, who has often been together with
    Cosmar,'
- page: 2
  en: 'has received from him the splendid assurance that not a single soul to whom Your Serene Highness
    is indebted will ever receive one Groschen. He added that your father too would get [it] — not by
    a heller. For all men who have ever served and helped the Prince are utterly ruined and lose what
    is theirs. God grant this may be averted and make a liar of [uncertain: Hoimar / Cosmar]. Only the
    documents; and I beg most deeply and obediently for the letter to the Prefect. I remain, until death,
    Your Serene Highness''s [servant]. Herr Weigel wishes to buy; therefore I have deferred the lease
    contract. He follows my advice — I must first learn Your Serene Highness''s sentiments and the circumstances,
    particularly how you stand with your children. The payment will then be found. Blizanow, the 41st
    of July 1812, humble and obedient servant v Triebenfeld'

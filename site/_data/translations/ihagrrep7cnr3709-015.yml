- page: 1
  en: 'Sire!


    Eighteen months ago, having had the good fortune to be presented to Your Majesty at Poznań, I handed
    you a memorial in which I begged you to have restored to me the fortune which, after the death of
    my mother, was mine by just right. You received my prayer with kindness and promised me to hasten
    the justice I asked of you. — And yet, Sire, it is now four years that this lawsuit, begun at Poznań,
    has been decided only in the first instance, and at the moment when I was awaiting a second decree,
    my guardian writes to me that the decision has just been referred to the Court of Justice at Berlin.


    [Written by the receiving office:]


    29 Jan.


    To the Minister of State Baron [uncertain: Freyht] von der Reck, for expediting. Berlin, 26 January
    1802.


    Received the 28th.


    Let the petitioner be notified that the appeal judgment, as appears from inquiries made, has been
    [uncertain: beim] sent back by the Superior Appeal Senate, and that she [uncertain: ist] therefore
    has its publication to await.


    Berlin, 29 January 1802 Reck


    Done


    the 31st of the same month.'

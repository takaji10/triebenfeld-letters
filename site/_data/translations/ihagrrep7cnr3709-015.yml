- page: 2
  en: 'I know nothing of the degrees of the laws, but every unfortunate, and all the more a forsaken orphan,
    dares to have recourse to Your Majesty''s benevolence and to beg you to deign to hasten the judgment
    that is to restore me to the property of which I have been deprived for so long. It is with confidence,
    Sire, that I ask of your fatherly heart the grace of fulfilling the promise you deigned to make me.
    I know it: I am pleading against the Prince of Hohenlohe; if, then, it is not Your Majesty''s protection
    that sustains me, bereft of all help I shall be abandoned to the harshest poverty. May pity, joined
    to Your Majesty''s goodness and clemency, receive favourably the prayer that I dare to address to
    you; as for me, I shall never cease to be, Sire,


    Your Majesty''s


    Dresden, 22 January


    1802.


    most devoted and submissive


    subject Michaline Prusimska.'

segments:
- page: 1
  en: 'Right Honourable Chełmski against Right Honourable Prusimski and the Commission Act at Trąbczyn
    — Counter-Protest


    Let there be seen here the Counter-Protest made in fact and upon the personal appearance of the Right
    Honourable Stanisław Ścibor Chełmski, heir of the goods of the Łukomia district, in and against the
    Right Honourable Antoni Prusimski, Starost of Niszczewice, and the Boundary Commission Act issued
    between Trąbczyn and Łukom — made among the Produced Documents.


    Stanisław Chełmski, by his own hand'

segments:
- page: 1
  en: 'Berlin, 10 August 1816. To the widow of Colonel von Brehmer, Right Honourable,


    in


    Sommerfeld


    the 13th, to the post.


    No. 6360. Already upon Your Right Honourable''s letter of 26 April of this year I found occasion to
    bring before the Royal Legation at Petersburg the circumstance that, since the Prince of Hohenlohe-Ingelfingen
    had allowed the estates of Trąbczyn with appurtenances to deteriorate and had burdened them with debts,
    the mortgage creditors stood in danger, through the confiscation of the estate which took place in
    the year 1807, of losing the capitals they had lent, so that use might be made of it, as circumstances
    allow, in supporting the compensation petition of the Prince of Hohenlohe. Since nothing further can
    be done on the part of the undersigned Ministry for Your Right Honourable, but it must rather be left
    to you, should His Majesty the Emperor of Russia be pleased to grant the Prince of Hohenlohe a compensation,
    to look after whatever rights you may have therein, I herewith return to you the enclosures submitted
    on the 25th of July. Berlin


    Ministry of Foreign Affairs, 3rd Section.


    Hoffm[ann], 12/8.


    B[alan].'

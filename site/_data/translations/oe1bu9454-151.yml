- page: 2
  en: 'particularly since such frightful shortfalls are showing themselves. For Suvigria yields, instead
    of 1800 Rthl in rents, only 918 Rthl in all; Wrąbczyn, instead of 1500 Rthl, only


    1123.


    Upon the woodland, given the low timber prices, very little is to be reckoned; I must therefore think
    of artificial funds, so that a value appropriate to the matter may be arrived at in the assessment,
    inasmuch as by means of the loan — so that nothing here be squandered — all ill-will may be forestalled
    and the principal debts paid.


    The assessors had at first taken the matter according to the tableaux; but when it came to the examining
    of the people, whereby the revenues were to be proved, everything deferred so greatly that we must
    alter the whole assessment.


    Lichnowski has laid an arrest upon a part of the ten thousand Rthl which the Olesnic people are to
    pay at Christmas, so that one will therefore have only some 6000 Rthl to receive. With the Wrgberin
    people I must deal very cautiously, for as Nerlich tells me they are refusing to pay the Christmas
    instalment; and even if no snow really lay, it would nevertheless be very inexpedient to proceed now
    with the measuring out of the lands. In the meantime nothing remains over at Wrgberin for Your Serene
    Highness, and the fine village yields nothing further than the sum censured above, which according
    to the area content, if the Morgen were reckoned at 1 Rthl, should amount to 2958 Rthl.'

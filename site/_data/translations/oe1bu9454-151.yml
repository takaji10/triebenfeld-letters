- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Your Most Serene Highness''s two letters of the 30th of November and the 2nd of December I have the
    honour to have just received. It gladdens me most heartily that Your Highness has in Mr. von Nothardt
    so genuine a friend, through whom much good will be able to be effected. That he was to become Director
    I did indeed already know, but the particular manner of it was unknown to me. The affair with Mr.
    von Harlem and Councillor of War Nöldichen is meanwhile causing much terror — and Mr. von Nothardt
    has every cause to pray to Heaven that Mr. von Voss does not avenge his favourite upon him. Things
    go very badly for me here — It seems as though Heaven had set itself against all business — the Mennonites
    are here in Trąbczyn and wish to buy both estates together. I am having the people provided for and
    every kindness shown them, so that I may keep them in good humour — Meanwhile, on account of the great
    snow, which lies above a foot deep, nothing can be undertaken. One hundred Hufen of the Grądzin and
    Drzewitz woodland I am selling gladly for rent. This amounts to 3000 Rthl in rents and consequently
    to 60000 Rthl of capital. Which, in the event that I do not do the latter, then the poor grounds remain
    to me, and the assessment would turn out very low'

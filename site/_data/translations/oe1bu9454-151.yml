- page: 3
  en: 'These however are matters which now can no longer be altered — I meanwhile shall give away no Morgen
    at under 1 Rthl rent, however poor the land may be, and in the case of lands and meadows, with the
    good marshes, nothing goes for less than 300 Rthl in ready money and 15 Rthl annual rent; for this
    I stand surety. Were the weather not so very much against me, I should perhaps already be finished;
    as it is, however, I must let God rule, and hold to the drawing up of the valuation.


    The interest to the Lichnowski party is being paid here — Your Serene Highness will nevertheless receive
    from here about 8000 Rthl at Christmas. For the Schlabrendorff and the Lichnowski principal sums I
    must fetch the capital from Berlin, which can then, when the Mennonites pay, be paid off again.


    What good will and human powers can accomplish, I shall exert, in order to guide everything, in spite
    of the frightful weather, to the best end. In deepest reverence and esteem I remain, until death,


    Your Most Serene Highness''s


    most humble and obedient servant


    Trąbczyn,


    the 7th of December


    v Triebenfeld


    1804'

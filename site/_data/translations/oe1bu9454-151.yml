- page: 2
  en: 'especially as such dreadful shortfalls are appearing. For Swięcia yields, instead of 1800 Rthl
    in rent, only 918 Rthl in all; Wrąbczyn, instead of 1500 Rthl, only 1123 Rthl.


    Upon the forest, with timber prices so low, very little is to be reckoned; I must therefore think
    upon artificial funds, so that a value proportionate to the matter may be arrived at in the valuation,
    inasmuch as by means of the loan, so that nothing here be squandered away, all ill will may be forestalled
    and the principal debts paid.


    The valuers had at first taken the matter according to the tableaux, but when it came to the examination
    of the people, whereby the revenues were to be proved, everything fell so far short that we must alter
    the whole valuation.


    Lichnowski has laid an arrest upon a part of the ten thousand Rthl which the Oleśnica people are to
    pay at Christmas, so that only some 6000 Rthl will thereby be received. With the Wrąbczyn people I
    must deal very warily, for, as Nerlich tells me, they refuse to pay the Christmas instalment. Even
    if in truth no snow were lying, it would still be very inexpedient to proceed now with the measuring
    out of the lands. Meanwhile at Wrąbczyn nothing remains over for Your Serene Highness, and the fine
    village brings in nothing further than the sum censured above, which, according to the area contained,
    if the Morgen were reckoned at 1 Rthl, ought to amount to 2958 Rthl.'

- page: 3
  en: 'These, however, are matters which can now no longer be altered — I meanwhile shall give away no
    Morgen at less than 1 Rthl rent, however poor the land may be, and in the case of lands and meadows
    nothing goes for less than 300 Rthl in cash and 15 Rthl yearly rent, along with the good marsh-breaks;
    for that I stand surety. Were the weather not too greatly against me, I should perhaps already be
    finished; as it is, however, I must let God govern, and hold myself to the drawing-up of the assessment.


    The interest to the Lignowski party is being paid here — Your Serene Highness will nevertheless receive
    from here about 8000 Rthl at Christmas. For the Schlabrendorff party and for Lichnowski I must fetch
    the capital sums from Berlin, which can then, when the Mennonites pay, be remitted again.


    What good will and human powers can accomplish, I shall exert, to guide everything, despite the horrid
    weather, to the best end. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    most humble and obedient servant


    Trąbczyn


    the 7th of December.


    von Triebenfeld


    1804'

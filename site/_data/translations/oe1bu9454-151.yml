- page: 1
  en: '151


    Most Serene Prince,


    Most gracious Lord!


    I have the honour to have just now received Your Most Serene Highness''s two letters of the 30th of
    November and the 2nd of December. It gladdens me most heartily that Your Highness has in Mr von Nothardt
    so genuine a friend, through whom much good will be able to be effected. That he was to become Director
    I did indeed already know, but the particular manner of it was unknown to me. The business with Mr
    von Harlem and the councillor of war Nöldichen is meanwhile causing much terror — and Mr von Nothardt
    has every reason to pray to Heaven that Mr von Voss does not avenge his favourite upon him. — Things
    go very badly for me here — It seems as though Heaven were setting itself against all business — the
    Mennonites are here in Trąbczyn and wish to buy both estates together. I am having the people provided
    for and every kindness shown them, so that I may keep them in good humour — Meanwhile, on account
    of the great snow, which lies more than a foot deep, nothing can be undertaken. One hundred Hufen
    of the Grądzyń and Drzewce forest I am selling for [uncertain: perpetual] rent. This amounts to 3000
    Rthl in rent and consequently to 60000 Rthl of capital. Which, in case I do not do the latter, then
    the poor grounds remain to me, and the valuation would turn out very low'

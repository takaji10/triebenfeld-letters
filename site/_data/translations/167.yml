status: draft
segments:
- page: 1
  en: Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests! At the very moment when
    His Serene Highness the Prince, together with the old gentleman, is pleased to drive to church, he
    commands me to send to Your Right Honourable, with His Highest compliments, the letter here enclosed.
    His Highest Self would gladly have written in person, had not the ordonnance been departing within
    the hour already. The old Prince is, for his age, very well, and shows exceedingly much attachment
    for my most gracious Lord. I wish from the heart that Your
- page: 2
  en: 'Right Honourable may find yourself in right good health; I commend myself to your continued favour
    and have the honour to persist in the most perfect veneration: Your Right Honourable''s, Öhringen,
    the 7th of July 1805. humble and obedient servant A: Hahn The return to Breslau is fixed without fail
    for the 25th!'

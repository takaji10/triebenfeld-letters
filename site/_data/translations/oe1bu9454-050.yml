- page: 2
  en: 'Since I cannot now permit that von Triebenfeld should be pressed in this matter, for which it falls
    to me alone to answer, I have charged my mandatary, the privy post councillor Amelang in Berlin, to
    come to terms with van der Lahr in my name, to pay him 1000 Rthl, and to offer to deliver the remainder
    in finished bar and hoop iron by May. Van der Lahr has accepted this, according to his original letter
    herewith enclosed; only there still subsists a small difference with regard to the iron price, concerning
    which I have written once more, and as soon as I receive the answer thereon from Amelang, the money
    shall be paid and the iron delivered. Your Royal Majesty I meanwhile most obediently beg to leave
    von Triebenfeld free of the obligation, and not to compel him by execution or distraint to a sum to
    the discharge of which I am bound, and to which I have also engaged myself, as Your Majesty will be
    pleased to gather from van der Lahr''s letter.


    I remain, until death,


    Your Royal Majesty''s


    Sławięcice


    the 8th of April 1809.


    most obedient'

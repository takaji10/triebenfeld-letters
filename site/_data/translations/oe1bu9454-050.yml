status: draft
segments:
- page: 1
  en: 'In the year 1808, up to the 14th of February, I had fallen into debt to the Invalids'' Fund for
    the interest on a capital of 50000 Rthl, which His Majesty the King had caused to be given me out
    of the same upon my Zagorowo estates, [uncertain: we] situated in a Duchy of Warsaw, in the amount
    of 3125 Rthl. My authorised representative, the councillor of war von Triebenfeld, was at that time
    sent out of Prussia to Stecten, and since the French government had at that very time taken upon itself
    the administration of the Invalids'' houses, the said government extorted from von Triebenfeld, by
    arrest and military execution, the above-named 3125 Rthl together with costs; von Triebenfeld did
    not have so much money with him and was obliged, against a Lohderian bill of exchange drawn by himself
    and by Lieutenant General von Zastrow, to take up 5140 Rthl from the merchant van der Lahr, which
    the latter would give in no other form than in paper, and wished to have back in ringing Courant.


    The papers stood very low; nevertheless, necessity compelled von Triebenfeld to comply with the will
    of von der Lahn.


    Subsequently, for the settlement of this matter, I sent von Triebenfeld 1000 Rthl; but since van der
    Lahr now had to have back 5140 Rthl, there remains a balance of 3000 Rthl, for which van der Lahr
    has now sued him and has for the present obtained a judgment favourable to himself on the ground of
    the more recent cabinet order, upon which he now threatens von Triebenfeld with harsh execution.'

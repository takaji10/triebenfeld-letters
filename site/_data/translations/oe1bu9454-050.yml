segments:
- page: 1
  en: '50 In the year 1808, up to the 14th of February, I had fallen into debt to the Invalids'' Fund
    for the interest on a capital of 50000 Rthl, which His Majesty the King had caused to be given me
    out of the same upon my Zagórów estates, [these being] situated a Duchy of Warsaw, to the amount of
    3125 Rthl. My authorised representative, the councillor of war von Triebenfeld, was at that time sent
    from Prussia to Berlin, and since the French government had at just that time arrogated to itself
    the administration of the Invalids'' Fund, the said government extorted from von Triebenfeld, by arrest
    and military execution, the above-named 3125 Rthl together with costs. Von Triebenfeld did not have
    so much money by him and was obliged to take up, against a joint bill of exchange made out by him
    and by Lieutenant General von Zastrow, from the merchant van der Lahr, 5140 Rthl / which the same
    would not give otherwise than in paper money and wished to have back in hard Courant /.


    The paper stood very low; nevertheless necessity compelled von Triebenfeld to comply with van der
    Lahr''s will.


    Subsequently, for the settling of this matter, I sent von Triebenfeld 3000 Rthl; but since van der
    Lahr now had to have back 5140 Rthl, there remains a balance of 3000 Rthl, for which van der Lahr
    has now sued him and has obtained a judgment favourable to himself on the ground of the more recent
    cabinet order, whereupon he now at present threatens von Triebenfeld with harsh execution.'

- page: 2
  en: 'Since I now cannot allow that the said von Triebenfeld should be pressed in this matter, which
    it is incumbent upon me alone to answer for, I have charged my mandatary, the privy postal councillor
    Amelang at Berlin, to come to terms with van der Lahr in my name, to pay him 1000 Rthl, and to offer
    to deliver the remainder in finished bar and [uncertain: ripe] first iron by May. Van der Lahr has
    accepted this, according to his original letter annexed hereto; only there still remains a small difference
    in respect of the iron price, concerning which I have written once more, and as soon as I receive
    the [uncertain: definite] answer from the said Amelang, the money shall be paid and the iron delivered.
    Your Royal Majesty I meanwhile most obediently beg to release the said von Triebenfeld from the obligation
    (ex nexu), and not to compel him by execution or distraint to a sum for the discharge of which I am
    bound, and to which I have also, as Your Majesty will graciously be pleased to gather from van der
    Lahr''s writing, obliged myself.


    [uncertain: Pf] I remain, until death,


    Your Royal Majesty''s


    Schlawenschitz,


    the 8th of April 1809.


    most obedient'

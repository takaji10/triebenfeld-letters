status: draft
segments:
- page: 1
  en: 'In the year 1808, up to the 14th of February, I had become indebted to the Invalids'' Fund for
    the interest on a capital of 50000 Rthl which His Majesty the King had had given to me out of the
    same upon my Zagorower estates, situated in the Duchy of Warsaw, in the amount of 3125 Rthl. My plenipotentiary,
    the Councillor of War von Triebenfeld, was at that time sent from Prussia to [uncertain: Stettin],
    and since the French Government had at that very time arrogated to itself the administration of the
    Invalids'' Fund, the said Government extorted from von Triebenfeld, by arrest and military execution,
    the above-named 3125 Rthl together with costs. Von Triebenfeld did not have so much money with him
    and was obliged, against a [uncertain: solidary (jointly binding)] bill of exchange drawn by him and
    by the Lieutenant-General von Zastrow, to take up from the merchant van der Lahr 5140 Rthl, which
    the latter would not give otherwise than in paper and wished to have back in ringing Courant. The
    papers stood very low; meanwhile necessity compelled von Triebenfeld to comply with the will of von
    der Lahn. Subsequently I sent von Triebenfeld 1000 Rthl for the settling of this matter; but since
    van der Lahr now had to have 5140 Rthl back, there remains a residue of 3000 Rthl, for which von der
    Lahr has now sued him and has at present obtained a judgment favourable to himself on the ground of
    the more recent cabinet order, whereupon he now threatens von Triebenfeld with harsh execution.'
- page: 2
  en: 'Since I now cannot allow that the said von Triebenfeld should be pressed in this matter, which
    it is for me alone to answer for, I have charged my mandatary, the Privy Post Councillor Amelang at
    Berlin, to come to terms with von der Lahr in my name, to pay him 1000 Rthl, and to offer to deliver
    the remainder in finished bar- and hoop-iron by May. Von der Lahr has accepted this, according to
    his original letter enclosed herewith; only there still subsists a small difference in respect of
    the iron price, about which I have written once more, and as soon as I receive the [uncertain: definitive]
    answer from the said Amelang, the money shall be paid and the iron delivered. Your Royal Majesty I
    meanwhile beg most obediently to leave the said von Triebenfeld ex nexu, and not to compel him by
    execution or distraint to a sum for the discharge of which I am bound, and to which I have also, as
    Your Majesty will deign to gather from von der Lahr''s writing, obligated myself. [uncertain: Pf]
    I remain, until death, Your Royal Majesty''s

    Schlawenschitz, the 8th of April 1809.

    most obedient'

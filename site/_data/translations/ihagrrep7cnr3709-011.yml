- page: 2
  en: 'Government at Warsaw I chose instead of the Government at Kalisz that had been proposed, because
    the President of the Government at Poznań, Count von Danckelmann, has recently moved to the Government
    at Kalisz, and because Your Serene Highness deigns to declare that any other South Prussian provincial
    court of justice apart from that of Poznań is acceptable to Your Highness. It gives me uncommon pleasure
    to be able hereby to contribute something to Your Highness''s satisfaction, and on this occasion at
    the same time to assure you of the boundless reverence with which I have the honour to be Your Serene
    Highness''s


    Berlin


    7 Dec. 1800. G[oldbeck]'

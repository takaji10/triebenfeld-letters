segments:
- page: 1
  en: 'To His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, Royal Prussian General of
    Infantry and Governor of


    Wrocław


    in the office


    to be fair-copied. Fair copy made, and to the post, the 8th of the same month.


    Most Serene Prince, Most gracious Prince and Lord, Your Serene Highness''s wish that Your Highness''s
    lawsuit with the guardian of the minor Michalina von Prusimska should not be decided by the Government
    at Poznań is so well founded, by the single circumstance that most of the councillors there are members
    of the guardianship board of that place, which brought this lawsuit, that I have had no hesitation
    in giving the order under today''s date that this case be decided in the first instance by the full
    bench of the Government at Warsaw and in the second instance by the Appeal Senate of the Kammergericht.
    The'

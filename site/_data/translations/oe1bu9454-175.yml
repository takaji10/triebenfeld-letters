segments:
- page: 1
  en: '175


    Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! I have, [in accordance with]
    the command of Your Right Honourable, to forward the enclosed papers, of which the one is an original
    and the second a copy. His Serene Highness most submissively requests that you write your opinion
    upon these, and what is to be done in these matters; Girard and Haugk[?] in particular are pressing,
    and if His Serene Highness were not somewhat bare with his [uncertain: funds, which] were very much
    drained by the journey, His Highness would send the required sum at once, in order to satisfy these
    gentlemen.'

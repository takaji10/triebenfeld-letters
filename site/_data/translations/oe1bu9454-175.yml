status: draft
segments:
- page: 1
  en: Right Honourable Sir, Most Highly Revered Councillor of War and Forests! I have, by command of Your
    Right Honourable, to transmit the enclosed pieces, of which the one is an original and the second
    a Copy. His Serene Highness most humbly requests that you write your opinion upon these matters, and
    what is to be done in these affairs; the Girard and Haupt press particularly, and were His Serene
    Highness not somewhat short with his cash-box, which was much exhausted by the journey, His Highness
    would at once send the requisite sum in order to satisfy these gentlemen.
- page: 2
  en: I commend myself to your further favour and persist in faithful veneration, Your Right Honourable's
    — Breslau, the 2nd of August 1805. Humble and obedient servant, A. Huhn

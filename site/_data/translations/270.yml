status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Unless quite particular events intervene, it
    is decided that even the town of Kalisz will yet become Russian. — I must now work solely on that
    side to obtain the Traperin again. But no one at all has yet given me any comforting assurance from
    that quarter; rather, it is said the Emperor would hardly annul what the Chief Administration Commission
    had done, sooner would he compensate the Prince in another manner. I am on that account in a desperate
    position: the Prince St.K. forbids me to make any démarche whatsoever on that side, so I must obey,
    and all the same I fear that everything may be swiftly concluded and the gate of grace then be shut.
    — Moszynski, husband of the born Prusimska, and Count Landskoy are bosom friends, so not much good
    is to be hoped for there. Yesterday the great Wellington arrived here as Ambassadeur Extraordinair;
    he is said to look somewhat askance at [uncertain: costs], and there something might be surmised.
    Meanwhile the harmony between our King and the Emperor continues firmly, whereas Prince Met: and Prince
    Talleyrand contrive intrigues without end — and on that account there is much talk here of one and
    of great wars. Today it is said that Dresden and Leipzig, together with the whole tract beyond the
    Elbe, are to be taken from us again and the King of Saxony to be reinstated there. — Were that to
    happen, we should have gained nothing for all our exertion, but rather, since Russia [uncertain: takes]
    all Poland, have lost much. — It is to be hoped that our acknowledgedly gallant King will not let
    this come to pass.'
- page: 2
  en: 'The Prince Chancellor is Your Serene Highness''s faithful friend, and will certainly assist, as
    His Excellency Herr M. v. Humboldt assured me only yesterday. — Were the labours here not so very
    numerous altogether, then what can be done here would already be settled. — The matter lies, as I
    lately reported, before the Herr Privy Councillor of State Stägemann, but he cannot get to it on account
    of the exorbitant press of business. B——, who yet sits with him daily, himself excuses him. — But
    the matter will end well. — In short: once the Lux are satisfied, once Cosmar''s attachment is lifted
    from the entailed estates, and Your Serene Highness reinstated as actual lord of the entailed estate,
    then Cosmar has no further share in these estates — here he must at once withdraw, his knavish tricks
    will be discovered, and their end will be a sorry one. — What chiefly alarmed me, however, was the
    estimate of revenues from the entailed estates appended to the Brieg protocol; it deviates dreadfully
    from Your Serene Highness''s statement. How could one ask the Hämster whether she had dragged in much
    or little, and whether there is still anything to be gathered in? I fear this will in the end cause
    me some vexation. This very moment the Privy Councillor and Land-Triechses v. Fullenbaum was here
    [uncertain: again] assuring me that Wellington too spoke in favour of the King of Saxony — the King
    himself, but they will not [uncertain: grant/conduct] anything — a sort of appanage of 1200000 Rthl
    he had allowed for the old gentleman, but nothing more. — For the rest, the Austrian Emperor too would
    cede to Russia what he holds of Poland, and would receive in return a considerable piece on the Lotterongen
    side. The most effective person here now is the lady whom Your'
- page: 3
  en: 'Serene Highness once destined as consort for Herr August. She is the [uncertain: betrothed] and
    ardently beloved of Prince Metternich. Since she is now the niece of Prince [uncertain: Talleyrand],
    she stands between the two and does great business. Finally, and to my alarm, I report that the Emperor
    Frantz has commanded that the lodgings for the friends here, and also the people who are hired for
    their service, be [uncertain: kept and maintained] for a further 2 months. God stand by us. By the
    next post I shall report more, and certainly something of importance already. In deepest reverence
    I remain, until death, Your Most Serene Highness''s Vienna, the 2nd of February 1815. most faithful
    humble and obedient servant v Triebenfeld'

- page: 4
  en: 'Whereupon he then expressed himself in the following manner.


    Although it was to all appearance a high demand for indemnification, he nevertheless offered to pay
    the same to the deponents upon the condition, namely, that the approbation of His Most Serene Highness
    could be obtained thereto.


    Wherewith the same was closed and signed. Nüchler mpp xxx [uncertain: bedenket] Samuel Luck xxx Jacob
    Kriede. In witness whereof, under the signature and seal of the magistracy. Barck[illegible], police
    burgomaster.'

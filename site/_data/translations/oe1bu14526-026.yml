- page: 2
  en: 'the number of Hufen, subjects sufficient for the settlement of the same, and likewise to pay down
    the purchase money specified at Midsummer of this year.


    All this they would also have duly performed, had not the present possessor von Brzezinski, who holds
    the estate of Szetlewek in mortgage-money tenure, raised certain difficulties concerning the clearing
    of it. They now saw very well that some considerable time might yet elapse before the difficulties
    with the aforesaid Raczinski could be removed; and therefore they wished to renounce the fulfilment
    of the said'
  names:
  - de: v. Brzezinski
    en: von Brzezinski
    kind: person
  - de: Szetlewek
    en: Szetlewek
    kind: place
  - de: p. Raczinski
    en: Raczinski
    kind: person
- page: 3
  en: 'contract, and hereby to declare it null and void, upon the condition that the travel costs etc.
    incurred by them in this business be made good to them with 200 Rthl, written out two hundred Reichsthaler;
    and that the people drawn hither, who have already laid down earnest-money, shall have no claims upon
    them, but shall hold themselves solely to the Most Princely manorial lordship (Dominium).


    This foregoing submission was laid before the Most Princely Hohenlohe building and economy councillor
    Mr. Glenck, who was likewise in loco; and his declaration was required upon it.'
  names:

status: draft
segments:
- page: 1
  en: 'Stamped sheet reserved. Actum Zagorowo, the 1st of July 1799. There appeared on this date before
    the Police Magistracy here:


    1. The Police Burgomaster


    H. Nüchler of Peisern


    2. the miller Luka of Białobrzeg, and


    3. The Schütze Reise of Wrąbczynek, and moved that the following be set down ad Protocollum: Under
    date of the 20th of November 1798 they had, with the Most Serene Hohenlohe Councillor of Building
    and Economy qua General Bevollmächtigter, Herr Glencke,


    concerning the parcelling-out of the estate Szetlewek, situated in the Trąbczyn estates, made a contract,
    wherein they had bound themselves to procure, for the number of Hufen therein determined, sufficient
    subjects for the settlement of the same, and likewise to pay down the purchase-money there determined
    at Johanni of the present year.'
- page: 2
  en: 'number of Hufen sufficient subjects for the settlement of the same, and likewise to pay down the
    purchase-money there determined at Johanni of the present year.


    All this they would indeed have satisfied, had not the present possessor v. Brzezinski, who holds
    the estate Szetlewek in Pfandschilling [mortgage-tenure], made certain difficulties concerning the
    vacating of it. They now saw very well that yet some further time might elapse before the difficulties
    with the said p. Raczinski could be removed; wherefore they wish to renounce the fulfilment of the
    said'
- page: 3
  en: 'contract, and hereby to declare it null and void, upon the condition that the travelling expenses
    etc. incurred by them in this business be made good to them with 200 rt, in words two hundred Reichsthaler;
    and that the people drawn hither, who have already laid down earnest-money, shall have no claims upon
    them, but shall look solely to the Most Serene Dominium.


    To the Most Serene Hohenlohe Councillor of Building and Economy, Herr Glenck, who was likewise in
    loco, this foregoing submission was laid before, and his declaration was required.'
- page: 4
  en: 'Whereupon the same declared himself as follows.


    Although it were an apparently high demand for indemnification, yet he offered to pay this to the
    deponents under the condition, namely, that the approbation of His Most Serene Highness could be obtained
    thereto.


    Wherewith this was closed and signed. Nüchler mpp xxx [mark] bedenket Samuel Luck xxx Jacob Kriede.
    In witness whereof, under the signature and seal of the Magistracy, Barck[?] Police Burgomaster'

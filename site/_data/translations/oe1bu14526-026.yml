status: draft
segments:
- page: 1
  en: 'Stamped sheet reserved. Actum Zagorowo, the 1st of July 1799. There appeared on this date before
    the local Police Magistracy:


    1. The Police Burgomaster


    H. Nüchler of Peisern


    2. the miller Luka of Białobrzeg, and


    3. the huntsman Reise of Wrąbczynek, and moved that the following be set down ad Protocollum: Under
    date of the 20th of November 1798 they had, with the Most Princely Hohenlohe Councillor of Building
    and Economy qua General Bevollmächtigter, Herr Glencke,


    concerning the parcelling-out of the estate of Szetlewek situated among the Trąbczyn estates, made
    a contract, wherein they had bound themselves to procure, for the number of Hufen therein determined,
    sufficient subjects for the settlement of the same,'
- page: 2
  en: 'and likewise to pay down the purchase money therein determined at Johanni of this year.


    All of this they would also have duly discharged, had not the present possessor v. Brzezinski, who
    holds the estate of Szetlewek in Pfandschilling [pledge-money tenure], raised certain difficulties
    concerning the vacating of it. They now saw very well that yet some time would have to elapse before
    the difficulties with the said p. Raczinski could be removed; and so they wish to renounce the fulfilment
    of the said'
- page: 3
  en: 'contract, and hereby to declare it null and void, upon the condition that the travelling expenses
    etc. incurred by them in this affair be made good to them with 200 rt, in words two hundred Reichsthaler;
    and that the people drawn hither, who have already laid down earnest-money, shall have no claims against
    them, but shall look solely to the Most Princely Dominium.


    This foregoing submission was laid before the Most Princely Hohenlohe Councillor of Building and Economy,
    Herr Glenck, who was likewise in loco; and his declaration was required thereupon.'
- page: 4
  en: 'Whereupon the same expressed himself in the following manner.


    Although it were an apparently high claim for indemnification, he nevertheless offered to pay it to
    the deponents upon the condition, namely, that the approbation of His Most Serene Highness could be
    obtained thereto.


    Wherewith this was closed and signed. Nüchler mpp xxx [his mark] Samuel Luck xxx Jacob Kriede. In
    witness whereof, under the signature and seal of the Magistracy. Barck[uncertain: Barck] Police Burgomaster'

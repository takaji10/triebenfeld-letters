segments:
- page: 1
  en: 'Stamped sheet reserved. Actum Zagorowo, the 1st of July 1799. There appeared on this date before
    the local police magistracy:


    1. The police burgomaster


    H. Nüchler of Pyzdry


    2. the miller Luka of Białobrzeg, and


    3. The marksman Reise of Wrąbczynek, and they moved that the following be set down ad Protocollum:
    Under the 20th of November 1798 they had made a contract with the Most Princely Hohenlohe building
    and economy councillor, as general authorised representative, Mr. Glencke,


    concerning the parcelling-out of the estate of Szetlewek situated in the Trąbczyn estates, wherein
    they had undertaken to procure, for the number of Hufen specified therein, subjects sufficient for
    the settlement of the same, and likewise to pay down the purchase money specified at Midsummer of
    this year.'

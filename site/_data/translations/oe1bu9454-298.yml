- page: 2
  en: 'then I shall bring the Pszczew affairs into the best track, and afterwards I hasten to Berlin.


    For the rest I am in anxieties on account of several letters which [uncertain: are missing]; thus
    one was sent from [uncertain: Brafurt] to Sławięcice, on which very much depends. May Your Serene
    Highness be pleased to have word given to the post office at Strehlitz that all letters be handed
    over to Your Serene Highness, and send such to me here by express messenger, for before the 15th of
    January I shall certainly not leave this place, and in that time a few messengers may still come —
    were it moreover possible that König could send me young wild boar and roebuck from Sansenberg, that
    would be good, for the Italian himself asked me for it — But this game would have to be delivered
    to the general leaseholder Faust at Gostyszyn, a mile from Kalisz, or deposited there, so that it
    is not taken away at the Polish frontier customs office — Yesterday at Kalisz the Prussian money was
    cried down; only [uncertain: Vert] and payment shall be current — For the present the coarse Prussian
    Courant, the thaler, is to be taken at only 20 gg — but the 2 gg. pieces are not to be taken at all,
    but are to be banished from this realm. Next to this the Poles have declared outright that they would
    never furnish troops against the Turks — is that not [illegible]?


    Gostyszyn lies on the great


    highway from Kępno to Kalisz


    Blizanow, 22nd December


    1815


    v Triebenfeld'

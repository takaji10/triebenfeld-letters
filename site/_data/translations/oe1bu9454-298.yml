- page: 1
  en: '298


    Pro Memoria.


    Madame Schenck has detained my messenger, and likewise the Sansenberger, for 3 days, because she was
    expecting her husband back from Warsaw — Just now Schenck sends me Your Serene Highness''s letter
    to him, with the copy of Zerboni''s [uncertain: Brogst] together with several from Berlin and God
    knows whence, which would have been a very long time on the road, and for which I have had to pay
    some 7 rt. in [uncertain: stärte] — Since moreover my messenger was returning, I enclose this as well
    — On the whole I repeat what I already said on the 19th — My illness continues and I still cannot
    walk or stand — Sitting I can already do, and I hope the illness will abate — My torn heart, however,
    will hardly be healed any more — Zerboni''s over-clever talk is the same that I already reported to
    Your Serene Highness from Vienna — Were the matter not taken up into the Vienna treaty and the compensation
    promised in the first place, he might be right — but as it stands, the truth spoken in the plain sense
    is surely the best — Boidelang is now on the point of stepping into Barbe''s place, and he is my friend
    as truly as Barbe could be — and more is also to be made of this man — He is at the same time an intimate
    friend of Mr von Humboldt — Enough: as regards the compensation I fear nothing. It is also said that
    the Emperor returns at the end of March — and therefore there is a) no such great haste to Berlin,
    the matter will not escape us — First I must here put my own affairs in order'

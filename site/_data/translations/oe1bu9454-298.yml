status: draft
segments:
- page: 1
  en: 'Pro Memoria. Madame Schenck has detained my messenger, as well as the Sansenberger, for 3 days,
    because she was expecting her husband back from Warsaw — Just now the Schank brings me Your Serene
    Highness''s letter to him, with the Copy of the Zerbonian letter together with several from Berlin
    and God knows whence, which must have been a very long time on the road, and for which I have had
    to pay some 7 Rthl [uncertain: in charges]. Since, moreover, my messenger was returning, I enclose
    this as well — On the whole I repeat what I already said on the 19th. My illness continues and I still
    cannot walk or stand. Sit up I already can, and I hope the illness will abate — My torn heart, however,
    will hardly be healed any more. Zerboni''s superclever speeches are those which I already reported
    to Your Serene Highness from Vienna — Were the matter not taken up into the Vienna Treaty and the
    indemnification promised in the first place, he might be right — as it is, however, the truth spoken
    in its plain sense is surely the best. Bvidlang is now on the point of stepping into Barbe''s place,
    and he is my friend as truly as ever Barbe could be — also he is at the same time an intimate friend,
    and to make him still more so, of Herr v. Humboldt — Enough: as regards the indemnification I fear
    nothing. It is also said that the Emperor returns at the end of March, and therefore a) there is no
    such great haste to Berlin; the matter will not escape us — First I must put my own affairs here in
    order'
- page: 2
  en: 'then I shall bring the Betschener into the best track, and thereafter I hasten to Berlin. For the
    rest, I am in anxiety on account of several letters which [uncertain: are missing]; thus one has been
    sent from Brafurt to Schlawenschitz on which very much depends. May Your Serene Highness be pleased
    to have word given to the Post Office at Strehlitz that all letters addressed to Your Serene Highness
    be handed over, and send me such by express messenger hither, for before the 15th of January I shall
    certainly not depart from here, and in that time several messengers may yet come — Were it moreover
    possible that [uncertain: Vierung] from Sansenberg could send me hither some young wild boar and haunch
    of venison, that would be well, for the Italian has himself asked me for it — But this game would
    have to be delivered a mile from Kalisz at Gostyszyn to the general leaseholder Faust, or deposited
    there, so that it is not seized at the Polish border customs office. Yesterday at Kalisz the Prussian
    money was cried down; only [uncertain: Vert] and payment shall be valid — For the present the coarse
    Prussian Courant, the thaler, is to be taken at only 20 gg — the 2 gg. pieces, however, are not to
    be taken at all, but are to be banished from this realm. Next to this the Poles have declared outright
    that they would never furnish troops against the Turks — is that not [uncertain: better]. Gostyszyn
    lies on the great [uncertain: road] from Kempen to Kalisz.

    Blizanow, the 22nd of Xbr 1815

    v Triebenfeld'

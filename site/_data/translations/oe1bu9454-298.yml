- page: 1
  en: 'P[ro]. M[emoria].


    Madame Schenck has detained my messenger, as well as the Sansenberger, for 3 days, because she was
    expecting her husband back from Warsaw — Just now Schank sends me Your Serene Highness''s letter to
    him, with the copy of Zerboni''s [uncertain: Brust] together with several from Berlin and God knows
    where else, which must have been a very long time on the road, and for which I have had to pay some
    7 Rthl in [uncertain: charges]. Since my messenger was returning in any case, I enclose this as well
    - On the whole I repeat what I already said on the 19th. My illness continues and I still cannot walk
    or stand. I can already sit, and I hope the illness will abate - My torn heart, however, will hardly
    be healed any more. Zerboni''s super-clever speeches are those which I already reported to Your Serene
    Highness from Vienna - Were the matter not taken up in the Vienna treaty and the compensation promised
    in the first place, he might be right - as it is, however, the truth spoken in the plain sense is
    surely the best. [uncertain: Bvidlang] now stands on the point of stepping into Barbe''s place, and
    he is my friend as much as Barbe could be - also he is at the same time an intimate friend


    to make this still more of him, of Mr. von Humboldt - Enough: as regards the compensation I fear nothing.
    It is also said that the Emperor returns at the end of March, and therefore a) there is no such great
    haste to Berlin, the matter will not escape us - First I must settle my own affairs here'

- page: 2
  en: 'then I shall bring the Betsche affairs into the best track, and thereafter I hasten to Berlin.


    For the rest I am in anxiety on account of several letters which [illegible]; thus one was sent from
    [uncertain: Brafurt] to Schlawenschitz, on which a very great deal depends. May Your Serene Highness
    be pleased to have word given to the Post Office at Strehlitz that all letters addressed to Your Serene
    Highness be handed over, and to send me such by express messenger here, for before the 15th of January
    I shall certainly not depart from here, and in that time a few more messengers may yet come — were
    it moreover possible that [uncertain: Vierung] might send me from Sansenberg some young wild boar
    and saddle of venison, that would be good, for the Italian himself has asked me for it - But this
    game would have to be delivered, a mile from Kalisz at Gostyszyn, to the general leaseholder Faust,
    or deposited there, so that it is not taken away at the Polish frontier customs office.


    Yesterday in Kalisz the Prussian money was cried down; only [uncertain: Vert] and coin of account
    is to pass - For the present the coarse Prussian Courant, the thaler, is to be taken at only 20 gg
    - the 2 gg pieces, however, are not to be taken at all, but to be banished from this kingdom. Next
    to this the Poles have declared outright that they would never furnish troops against the Turks —
    is that not [illegible].


    Gostyszyn lies on the great


    road[?] from Kempen to Kalisz


    Blizanow, the 22nd of Xbr 1815


    v Triebenfeld'

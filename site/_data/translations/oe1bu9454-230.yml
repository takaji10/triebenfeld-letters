- page: 2
  en: 'The groom who brings you this will probably be with Your Right Honourable on the evening of the
    22nd, and I expect him back at the latest on the 26th. By empty hopes and indefinite prospects I cannot
    let myself be held back from acting now with effect. I count in this upon your friendly co-operation,
    so that we may there proceed hand in hand in every undertaking. As soon as I receive your answer I
    shall take my further measures, and shall report them to Your Right Honourable again at once. I beg
    for a quite definite answer and news concerning your prospects and intentions, which must, however,
    lead to something speedily. If you can procure me considerable pecuniary assistance without delay
    I shall be most grateful, as I stand in the most pressing need of it. It is all the more necessary
    that I come soon to a resolution, upon which point you will kindly instruct me, since my son''s stay
    will not be able to be of very long duration with me.


    For the Parobek accept my thanks; he bore himself bravely at the first trial, but also [uncertain:
    turned pale], which however did him no harm. I still flatter myself that I shall see Your Right Honourable
    with me very soon, and it would pain me greatly'
  names:
  - de: Parobek
    en: Parobek

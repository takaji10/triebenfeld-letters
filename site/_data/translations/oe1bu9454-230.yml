segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Councillor of War and Forests! It is today 12 days past the
    term which Your Right Honourable set for yourself, namely the 8th of this month, when you intended
    to arrive here together with Mr. von Brzechsta, without my having been informed by so much as a word
    of the cause of this postponement. I waited for you from one day to the next in vain, and yet it is
    so pressing to take some course with regard to my estates there, to which the imminent presence of
    my son with me, who will be here in a few days, is a new and pressing occasion. I cannot subsist any
    longer if I can continue to draw nothing from these estates, and since I do not even know what I have
    to reckon upon in this matter, I must seek out the means which may yet afford me some repose. I may
    not therefore allow the renewed eagerness of General von Schimmelpfennig for the acquisition of Zagorowo
    to grow cold. This gentleman means to travel thither at the beginning of March to view it, and then,
    if we can come to terms, soon to settle the business with me. [uncertain: I] seemed to him today that
    I should forewarn Your Right Honourable of this, await your answer, and then give him further word.'
  names:

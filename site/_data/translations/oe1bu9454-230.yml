- page: 2
  en: 'The groom who brings you this will in all likelihood be with Your Right Honourable on the evening
    of the 22nd, and I expect him back at the latest on the 26th; by empty hopes and indefinite prospects
    I cannot let myself be held back from acting now with vigour. I count in this upon your friendly co-operation,
    so that we may there go to work hand in hand in every undertaking. As soon as I receive your answer
    I shall take my further measures, and report the same at once to Your Right Honourable. I beg for
    a quite definite answer and [uncertain: high] intelligence concerning your prospects and intentions,
    which however must lead to something swiftly. If you can procure me considerable pecuniary assistance
    speedily I shall be most grateful, since I stand in the most pressing need of it. It is all the more
    necessary that I come soon to a resolution, upon which you will kindly instruct me, since my son''s
    stay with me will not be able to be of any very long duration. For the Parobek accept my thanks; he
    bore himself bravely at the first trial, but also turned pale, which however did him no harm. Still
    I flatter myself that I shall see Your Right Honourable quite soon with me, and it would grieve me
    greatly'
  names:
  - de: Parobek
    en: Parobek
    kind: other
  numbers:
  - '22'
  - '26'
- page: 3
  en: 'You will therefore from this state of affairs deign to [uncertain: pass over] for yourself how
    necessary it is for me to obtain exact and thorough knowledge of the true present condition of all
    my estates, and at the same time also to make in them those provisions which are needful, in order
    to be able to stand with honour before the said commission as a truthful and upright man. These, approximately,
    are the grounds which have moved me to send Your Honour the lieutenant, although I know that his presence
    may perhaps not be so agreeable to you as that of any other; since, however, a man acquainted with
    the situation of those estates is absolutely required for this commission, I flatter myself that Your
    Honour will convince yourself of the [uncertain: urgency] of my [illegible], at least I should not
    wish that this choice of mine might bring our good cause any [uncertain: detriment], as I have received
    from the said [illegible] Sommer the reliable assurance that in his commission he will act setting
    aside every other consideration than that which aims solely at our common welfare. I therefore request
    Your Honour as urgently as most devotedly to confer with him quite without reserve and candidly upon
    the matter, or rather, which would be still more welcome to me, to come here with him, so that we
    might here, at greater leisure, take the matter into deliberation. Awaiting with impatience a satisfactory
    result of your mutual deliberations, I have the honour to remain with the most perfect esteem.'
  names:
  - de: Sommer
    en: Sommer
    kind: person
- page: 4
  en: 'Your Honour has left my letter of the 19th of last month so wholly, or at least its principal subjects,
    unanswered and unfulfilled, that I cannot forbear to repeat the same herewith, and once again urgently
    to request both the transmission of the Trąbczyn deed of gift and a communication as to what sound
    project Your Honour intends with respect to my Zagorowo estates, or what plan you mean to follow in
    their further administration, so that not only may these estates be preserved, but that I too might
    at last come to some enjoyment of revenues. Accustomed hitherto to have yielded unconditionally to
    every proposal made by Your Honour, I am even now far from raising any objection to the intended leasing
    of my estates to Mr. von Brechso; only I must report to Your Honour herewith without concealment that
    the state of affairs here has so far altered that so long a deferment of the matter as you had the
    goodness to report to me could very easily bring about a complete annulment of this business, and
    that consequently, if anything can be done at all, precisely now is still the decisive moment. For,
    having been so often and [uncertain: grievously] disappointed even in my most just expectations, I
    was no longer in a position to stem the impetuous pressing of my creditors, nor to alter my critical
    situation by my own powers, and have seen myself compelled to petition His Majesty the King''s assistance,
    and I expect within [uncertain: days] the commission requested for the regulation of my debt affairs.'

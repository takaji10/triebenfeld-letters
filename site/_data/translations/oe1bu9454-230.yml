- page: 3
  en: 'Your [Right Honourable] will therefore be pleased to [uncertain: convince] yourself from this state
    of affairs how necessary it is for me to possess exact and thorough knowledge of the true present
    condition of all my estates, and at the same time also to make those provisions in them which are
    needful, in order to be able to stand with honour before the said Commission as a truthful and upright
    man. These are roughly the grounds which have moved me to send Your Right Honourable the lieutenant
    [uncertain: binnen], although[text lost] I know that his presence may perhaps not be so agreeable
    to you as that of any other; however, since a man acquainted with the situation of those estates is
    absolutely required for this commission, I flatter myself Your Right Honourable will convince yourself
    of the [uncertain: Strügung] of my [illegible], at least I should not wish that this choice of mine
    should bring our good cause any [illegible] disadvantage, since I have received from the said Sommer
    the reliable assurance that in his commission he will act with the setting aside of every other consideration
    than that aimed solely at our common welfare. I therefore request Your [Right Honourable], as [uncertain:
    urgently] as most devotedly, to confer with him quite without reserve and candidly upon the matter,
    or else, which would be still more agreeable to me, to come hither with him, so that here, at greater
    leisure, we might take the matter into consideration. Awaiting with impatience a satisfactory result
    of your mutual deliberations, I have the honour to remain with the most perfect esteem.'
  names:
  - de: Sommer
    en: Sommer
    kind: person
- page: 4
  en: 'Your Right Honourable has left my letter of the 19th of last month so entirely, or at least its
    principal subjects, unanswered and unfulfilled, that I cannot forbear to repeat it herewith, and once
    again urgently to beg both for the transmission of the Trapergner deed of gift and for notification
    of what sound project [uncertain: H.] and my Zagórów estates you intend, or what plan you propose
    to follow in their further administration, so that not only may these estates be preserved, but that
    I too may at last come to some enjoyment of revenues. Hitherto accustomed to yield unconditionally
    to every proposition made by Your Right Honourable, I am even now far from raising any objection whatever
    to the intended leasing of my estates to Mr von Brzechffa; only I must herewith report to Your Right
    Honourable without concealment that the state of affairs here with me has so far altered that so distant
    a postponement of the matter as you had the goodness to report to me might very easily bring about
    a complete cancellation of this business, and that consequently, if anything can be done at all, precisely
    now is still the decisive moment. For, since I, having been so often and so [uncertain: hastily] deceived
    even in my most just expectations, was no longer in a position to stem the impetuous pressing of my
    creditors and to alter my critical situation by my own powers, I have seen myself compelled to solicit
    the assistance of His Majesty the King, and I await within [uncertain: Körpern] the Commission petitioned
    for the regulation of my debt affairs'

status: draft
segments:
- page: 1
  en: Right Honourable Sir, Highly Honoured Councillor of War and Forests! It is today 12 days past the
    term which Your Right Honourable set for yourself, namely the 8th of this month, when you intended
    to arrive at my house together with H. v. Brzechsta, without my having been informed by so much as
    a word as to the cause of this postponement. I waited for you in vain from one day to the next, and
    yet it is so pressing to take a course of action with regard to my estates there, to which the imminent
    presence of my son with me — who will be here in a few days — is a new and pressing occasion. I cannot
    subsist any longer if I can continue to draw nothing from these estates, and since I do not even know
    what I have to count upon in the matter, I must seek out the means which may yet afford me some repose.
    I therefore dare not let the renewed eagerness of Herr General von Schimmelpfennig for the acquisition
    of Zagorowo grow cold. This gentleman wishes to betake himself thither at the beginning of March to
    view the property, and then, if we can come to terms, soon to settle the business with me. It seemed
    to him today that I should apprise Your Right Honourable of this, await your answer, and then give
    him more particular word.
- page: 2
  en: 'The groom who brings you this will in all likelihood be with Your Right Honourable on the evening
    of the 22nd, and I expect him back at the latest on the 26th. By empty hopes and indefinite prospects
    I cannot let myself be held back from acting now with vigour. I count in this upon your friendly co-operation,
    so that we may there go to work hand in hand in every undertaking. As soon as I receive your answer
    I shall take my further measures and report them again to Your Right Honourable at once. I beg for
    a quite definite answer and [uncertain: report] concerning your prospects and intentions, which however
    must lead to something speedily. If you can procure me considerable pecuniary assistance without delay
    I shall be much obliged, as I stand in the most pressing need of it. It is all the more necessary
    that I come soon to a resolution, upon which you will kindly instruct me, since my son''s stay with
    me will not be able to last very much longer. For the Parobek accept my thanks; he bore himself bravely
    at the first trial, but was also [uncertain: bleached / bled], which however did him no harm. Still
    I flatter myself that I shall see Your Right Honourable with me quite soon, and it would grieve me
    greatly'
- page: 3
  en: 'Your [Right Honourable] will therefore be pleased, from this state of things, to [uncertain: persuade]
    yourself how necessary it is for me to obtain exact and thorough knowledge of the true present condition
    of all my estates, and at the same time also to take those precautions in them which are needful,
    in order to be able to stand with honour, as a truthful and upright man, before the aforesaid Commission.
    These, roughly, are the grounds which have moved me to send the Lieutenant to Your Honour [uncertain:
    binnen], although I know that his presence may perhaps not be so agreeable to you as that of some
    other; yet, since for this commission a man acquainted with the situation of those estates is absolutely
    required, I flatter myself that Your Honour will yourself be convinced of the [uncertain: urgency]
    of my [illegible], at least I should not wish that this choice of mine should bring any [uncertain:
    prejudice] to our good cause, since I have received from the said [uncertain: z Sommer] the reliable
    assurance that in his commission he will act setting aside every other consideration than that which
    aims solely at our common welfare. I therefore request Your Honour, as urgently as most humbly, to
    confer with him quite without reserve and candidly upon the matter, or rather — which would be still
    more welcome to me — to come hither with him, so that we might here, at greater leisure, take the
    matter into consideration. Awaiting with impatience a satisfactory result of your mutual deliberations,
    I have the honour to remain with the most perfect esteem.'
- page: 4
  en: Your Honour has left my letter of the 19th of last month so wholly, or at least its principal subjects,
    unanswered and unfulfilled, that I cannot forbear to repeat it herewith, and once more urgently to
    beg both for the transmission of the Trapergner deed of donation and for information as to what sound
    project you intend for H. and my Zagorowo estates, or what plan you propose to follow in their further
    administration, so that not merely may these estates be preserved, but that I too may at last come
    to some enjoyment of revenues. Accustomed hitherto to yield unconditionally to every proposition made
    by Your Honour, I am even now far from raising any objection to the intended leasing of my estates
    to Herr v. Brzechsta; only I must herewith report to Your Honour without concealment that the state
    of things here has so altered that so distant a postponement of the affair, as you had the goodness
    to report to me, could very easily bring about a complete dissolution of this business, and that consequently,
    if anything can be done at all, precisely now is still the decisive moment. For, having been so often
    and so harshly deceived even in my most just expectations, I was no longer in a position to stem the
    impetuous pressing of my creditors and to alter my critical situation by my own powers, and have therefore
    seen myself compelled to solicit the assistance of His Majesty the King, and expect within a short
    time the Commission requested for the regulation of my debt affairs.
- page: 5
  en: if my hopes in this were to remain unfulfilled. Be pleased to accept the assurances of the esteem
    and attachment with which I shall ever remain, Your Right Honourable's

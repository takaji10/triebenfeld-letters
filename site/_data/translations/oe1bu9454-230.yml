- page: 1
  en: '230


    Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! It is today 12 days past
    the term which Your Right Honourable set for yourself, namely the 8th of this month, when you intended
    to arrive at my residence together with Mr von Brzechffa, without my having been informed by so much
    as a word as to the cause of this postponement. I waited for you from one day to the next in vain,
    and yet it is so urgent to take a course of action concerning my estates there, for which the imminent
    presence of my son with me — who will be here in a few days — is a new and pressing occasion. I cannot
    subsist any longer if I can continually draw nothing from these estates, and since I do not even know
    what I have to count upon in that regard, I must seek out the means which may yet afford me some repose.
    I therefore may not let the renewed eagerness of General von Schimmelpfennig for the acquisition of
    Zagórów grow cold. This gentleman intends to betake himself thither at the beginning of March to view
    it, and then soon, if we can come to an agreement, to [uncertain: settle] the business with me. I
    [uncertain: it seemed] to him today that I forewarned Your Right Honourable of this, [uncertain: awaited]
    your answer, and would then give him more particular word'

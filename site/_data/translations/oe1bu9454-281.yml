- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    The bearer of this letter is the servant of Court Councillor Barbi, who is to travel out into the
    Empire and fetch the Court Councillor''s sister, whose husband is employed in the bureau of the Prince
    State Chancellor, and bring her to Berlin. I have given him my 3 horses for this purpose; may Your
    Serene Highness now be pleased to give orders there that Stock — that is the servant''s name — be
    given a basket-wagon, over which a half-tilt of ticking can very soon be made, so that the journey
    may be begun quickly. The [uncertain: Heftrath] will know how to earn this favour and to make it good
    — then the 3 Hardenberg chief [uncertain: zofräthe] Barbe, Heym and Philippsborn have several crates
    of glass lying in Prague — these they wish to have fetched from there and brought to Schlawenschitz.
    Now the request is that Your Serene Highness might have the [uncertain: grade] and give Stock a two-horse
    cart along with him, so that, since he goes by way of Prague, he may load the glass there and [uncertain:
    convey] it with the free pass to Schlawenschitz — This cannot be refused — Your Serene Highness will
    have the more friends in this house; for the fetching of the glass the drummer will probably have
    to be sent, for the pass reads upon the fellow; the farmhand [illegible] Your Serene Highness cannot
    use him, be pleased to send him back to Alizancio provided with a pass, and the same can be done with
    the drummer too, when he returns from there with the glass cart. I beg that these matters be indeed
    carried into effect. For the rest, Mr. von Stägemann has still made no report — It seems'

- page: 2
  en: 'from every friend too likely that the most infamous intrigue lies at the bottom of this, and other
    steps are now being taken to move nearer to the goal — Something will be done to Your Serene Highness''s
    advantage, and something must be done — The one misfortune is that Eberhard cannot come here and conclude
    the settlement with the Courland heiresses — according to the assurances given me I had built upon
    that first of all. — Now I must go with it [uncertain: to the rags in Ließen Berg] — In the meantime
    I shall see with my friends what we can [uncertain: now] do. — But if the settlement could take place,
    then it would be a further stroke of fortune, even though 50 or 100000 Rthl more should have to be
    given now than — as I have often said — that the administration would last somewhat longer. The chief
    purpose would nevertheless be attained — Your Serene Highness could [illegible] out of the debts,
    and would be relieved of all cares — Pourtales has still not written, and the Köhl affair too still
    lies in doubt, and one now does not know at all what will come of it. — Thus much is nothing determined,
    that if the [uncertain: Satia] of Trąbczyn [illegible] Your Serene Highness is to have other estates,
    and that perhaps in Silesia.


    Be that as it may, I hope with the next post to be able to report something very good to Your Serene
    Highness, and could I conjure Eberhard here, then all would be attained that one could wish. Money
    the King will admittedly not permit much to be given at present, but yet everything could be managed
    by an instruction to pay — The King of Württemberg has nevertheless given his so-called constitution
    to the Estates, but the Congress has protested against everything; the Napoleonic business continues
    to cause a great sensation here — A couple of days ago letters were also intercepted from the former
    King of Italy to Bonap[arte] — It is singular that in such cases one does not proceed more rigorously
    —


    In deepest reverence I remain.


    Your Serene Highness''s


    Vienna, the 24th of March 1815.


    most obedient servant


    v Triebenfeld'

- page: 2
  en: 'from every friend too probable that the most infamous intrigue lies at the bottom of this, and
    other steps are now being taken in order to move nearer to the goal — Something will be done to Your
    Serene Highness''s advantage, and something must be done — The single misfortune is that Eberhard
    cannot come here and conclude the settlement with the Courland heiresses — according to the assurances
    given me I had built upon that first of all. — Now I must go with it [uncertain: the cap] in [uncertain:
    Ließen Berg] — In the meantime I shall see with my friends what we can [uncertain: now] do. — But
    if the settlement could take place, then a further piece of good fortune would come about, than, even
    though 50 or 100/m Rthl more should now have to be given, than what I have already often said, that
    the administration would last somewhat longer — The chief purpose would nevertheless be attained —
    Your Serene Highness can [text lost] out of the debts to confess, and would be relieved of all cares
    — Pourtalès has not yet written, and the Polish matter too still lies in a bad way — And one does
    not now know at all what will become of it — So much is [uncertain: not] settled, that if the devil
    fetches Trąbczyn, Your Serene Highness is to have other estates, and that perhaps in Silesia.


    However it may be, I hope with the next post to be able to report something very good to Your Serene
    Highness, and could I conjure Eberhard here, then everything would be attained that one could wish.
    Money the King will indeed not permit much to be given at present, but still everything might be managed
    by an order to pay — The King of Württemberg has nevertheless given his so-called constitution to
    the estates, but the Congress has protested against the whole of it — the Napoleon affair continues
    to make a great sensation here — A few days ago letters were also intercepted, from the former King
    of Italy, to Bonaparte — It is singular that in such cases one does not proceed more rigorously —


    I remain in deepest respect,


    Your Serene Highness''s


    Vienna, the 24th of March 1815.


    most obedient servant


    v Triebenfeld'

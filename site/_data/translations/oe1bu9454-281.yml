- page: 1
  en: '281


    Most Serene Prince


    Most gracious Lord!


    The bearer of this letter is the servant of Court Councillor Barbe, who is to go out into the Empire
    and fetch the Court Councillor''s sister, whose husband is employed in the bureau of the Prince State
    Chancellor, and bring her to Berlin — I have given him my 3 horses for the purpose; may Your Serene
    Highness now graciously order there that Stock, for so the servant is called, be given a basket-wagon
    — over which a half-tilt of ticking can be made at very short notice — so that the journey may be
    set out upon quickly. The Court Councillor will know how to deserve this favour and to make it good
    — then the 3 Hardenberg [uncertain: privy] Court Councillors Barbe, Heym and Philippsborn have several
    crates of glass lying in Prague — these they wish to have fetched from there and brought to Sławięcice.
    Now it is requested that Your Serene Highness might have the grace to send a two-horse conveyance
    along with Stock, so that, since he goes by way of Prague, he may load the glass there and send it
    with the free pass to Sławięcice — This cannot be refused — Your Serene Highness will have the more
    friends in this house — for the fetching of the glass the drummer will probably have to be sent, since
    the pass is made out for the fellow; the servant [uncertain: waarzug] whom Your Serene Highness cannot
    make use of, may you graciously furnish with a pass and send back to Blizanów, and the same can also
    be done with the drummer when he returns from there with the glass conveyance — I do beg that these
    matters be carried into effect — For the rest, Mr von Stägemann has still made no report — It seems'

- page: 1
  en: '276


    Most Serene Prince


    Most gracious Prince and Lord!


    The Minister von Humboldt had entrusted a matter to me in which I, in order to see clearly, was to
    write to Brzeg — I turned in the matter to the justice commissioner Eberhard, and with his answer,
    received yesterday, I obtained the letter of which a copy is enclosed — I am [uncertain: admonished]
    about it, and I, like everyone, do not know what one is to think of it. Nothing whatever has been
    ordered here, for everything still lies with the Privy Councillor of State Stägemann, who has as yet
    had no report laid before him on the matter. If therefore anything has been written to Berlin, then
    it is a treachery which can have had its origin only in Brzeg itself. A couple of days ago Prince
    Hardenberg once again declared most solemnly that he would certainly help Your Serene Highness, and
    tomorrow Prince Bartenstein goes to him again with a reminder — Everyone looks forward to the happiest
    outcome — Only now Eberhard''s news paralyses my tongue and hand — I have always asked only for the
    112000 Rthl with which the Curish heirs were to be satisfied, and have begged that under Your Serene
    Highness''s aegis the estates might be administered with a view to the discharge of the advance of
    112000 Rthl. Everything else will then take care of itself — this is everyone''s view — The justice
    commissioner Eberhard says in his letter that if he could be here, he would certainly have concluded
    and brought about the settlement with the princesses — The princesses have indeed come here and are
    remaining here as well — were it therefore at all possible in the world, let Your Serene Highness
    send him here; then, even if they pitched their demands higher, one could at once make a report of
    it to the Prince Chancellor and manage everything in the best way — the answer of the King mentioned
    in Eberhard''s letter was given to the princesses 8 days after the monarch''s arrival here in Vienna,
    where the 3 ladies beset him very hard / which I also wrote to Your Serene Highness at once — the
    King said therein "that he could not occupy himself with the matter here, that must wait until his
    return to Berlin —" But the King is, so far as I know, not in the least minded to occupy himself with
    it'

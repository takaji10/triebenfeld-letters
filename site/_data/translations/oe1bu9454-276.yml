status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The Herr Minister v Humboldt had entrusted a
    matter to me, in which I, to see clearly in it, [was] to write to Brieg — I applied in this matter
    to the Herr Justice Commissioner Eberhard, and upon his answer received yesterday I obtained the enclosed
    Copy of a letter. I am [uncertain: bewildered/admonished] over it, and I, like everyone else, do not
    know what one is to think of it. Nothing whatever has been ordered here, for everything still lies
    with the Privy Councillor of State Stägemann, who has as yet had no report made to him on the matter.
    If, then, anything has been written to Berlin, it is a treachery which can have had its origin only
    in Brieg itself. A few days ago Fürst Hardenberg once again declared most solemnly that he would certainly
    help Your Serene Highness, and tomorrow Fürst Bartenstein goes to him again with a reminder. Everyone
    is in expectation of the happiest outcome. Only now the Eberhard news paralyses my tongue and hand.
    I have always demanded only the 112000 mk, with which the Curian heirs were to be satisfied, and have
    begged that under Your Serene Highness''s [uncertain: aegis] the estates might be administered for
    the discharge of the advance of 112000 Rthl. Everything else then follows of itself — this is the
    view of every man. The Herr C. Eberhard says in his letter that if he could be here, he would certainly
    have concluded and brought about the settlement with the Princesses — the Princesses are indeed here
    and remain here also — were it therefore in any way possible in the world, let Your Serene Highness
    nevertheless send him here, for even should they pitch their strings higher, one could at once make
    a report thereof to the Fürst Chancellor and direct everything for the best. The answer of the King
    mentioned in Eberhardt''s letter was given to the Princesses 8 days after the arrival of the Monarch
    here in Vienna, where the 3 ladies pressed him very hard / which I also wrote to Your Serene Highness
    at once — the King said therein that he could not concern himself with the matter here, that it must
    wait until his return to Berlin. But the King, so far as I know, is not in the least minded to concern
    himself with it.'
- page: 2
  en: 'Nor has he himself any need of it under the Landrecht. For according to this one may proceed against
    the guarantor only when every means has been tried and every fund exhausted. But so far as I know
    for certain, and may confide to Your Serene Highness under the seal of secrecy, that Royal answer
    is only a political turn of phrase, which the Herr Minister v Humboldt, His Excellency, drafted —
    one did not wish to affront the niece of Fürst Talleyrand, the present great friend of Fürst Metternich,
    [and] therefore gave the 3 ladies that exceedingly civil letter with the assurance that the King,
    after his return to Berlin, would have the matter laid before him – of composition or satisfaction
    there stands not a word therein. If now Herr Eberhard could come here with all speed, I would see
    to it that the ladies were told, in the event, in so good a manner, that it is doubted whether the
    King would concern himself with the matter, and [that he] would rather remain true to the declaration
    once given by him. They would then take it up again from other sides, and would quickly come to a
    composition. For the rest, matters look here very [uncertain: baut]. Discretion must wrap itself in
    the thickest veil over things which happen day and night — [text lost] to stand not in a grey distance.
    Very thunder-pregnant clouds. The King of Saxony has arrived in Preßburg and refuses to accept the
    portion of Saxony conceded to him — He insists upon the whole of Saxony — It is believed, however,
    that he will in the end accommodate himself. For if he did not, Saxony would be strongly occupied
    throughout by Prussia. The [uncertain: Russian] Empress departs hence in a few days for Baden – thither
    the Emperor follows her on the 16th; the King travels 10 days after, straight to Berlin; there the
    Russian too comes, and the Emperor of this place, and they will remain together for some 12 days.
    The submission concerning the Polish estates lies ready; I await only the command of the Fürst Chancellor
    and money in order to be able to redeem the translations. The Eberhard letter I [uncertain: enclose]
    in the original; the writing comes very [uncertain: hard] to me. Afterwards I beg to have it back.
    In deepest reverence I remain, until death, Your Serene Highness''s Vienna, the 4th of March 1865.
    most obedient servant v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The Minister von Humboldt had entrusted a matter to me in which, to see clearly, I had to write to
    Brieg — I applied in this to the councillor of justice Eberhard, and upon his answer received yesterday
    I obtained the enclosed copy of a letter. I am quite confounded over it, and I, as does everyone,
    do not know what he is to think of it. Nothing whatever has been ordered here, for everything still
    lies with the Privy Councillor of State Stägemann, who has as yet had no report made to him on the
    matter. If, then, something has been written to Berlin, it is a treachery which can only have had
    its origin in Brieg itself. A few days ago Prince Hardenberg once again declared in the most solemn
    manner that he would certainly help Your Serene Highness, and tomorrow Prince Bartenstein goes to
    him again with a reminder. Everyone looks forward to the happiest outcome. Only now Eberhard''s news
    paralyses my tongue and hand. I have always asked only for the 112000 mk with which the Curian heirs
    were to be satisfied, and begged that the estates might be administered under Your Serene Highness''s
    auspices for the discharge of the advance of 112000 Rthl. Everything else will then follow of itself
    — this is the view of every man. The councillor Eberhard says in his letter that if he could be here
    he would certainly have concluded and brought about the composition with the Princesses — the Princesses
    are indeed here and are also remaining here; were it therefore in any way possible in the world, let
    Your Serene Highness nevertheless send him here [uncertain: sir], for even if they should pitch their
    demands higher, one could at once make a report of it to the Prince Chancellor and direct everything
    for the best.


    The answer of the King mentioned in Eberhardt''s letter was given to the Princesses 8 days after the
    Monarch''s arrival here in Vienna, where the 3 ladies pressed him very hard / which I also wrote to
    Your Serene Highness at once — the King said therein that he could not occupy himself with the matter
    here, that this must wait until his return to Berlin. But the King is, so far as I know, not in the
    least minded to occupy himself with it.'
- page: 2
  en: 'Nor is he himself obliged to do so under the Common Law. For according to this one may only proceed
    against the guarantor when all means have been tried and all funds exhausted. But so far as I know
    for certain, and may entrust to Your Serene Highness under the seal of secrecy, that Royal answer
    is only a political turn of phrase which His Excellency the Minister von Humboldt drafted — one did
    not wish to affront the niece of Prince Talleyrand, the present great friend of Prince Metternich,
    and therefore gave the 3 ladies that exceedingly civil letter with the assurance that the King would
    have the matter laid before him after his return to Berlin — of a settlement or satisfaction there
    stands not a word in it.


    If now the councillor Eberhard could come here with all speed, I should take care that the ladies
    were told, in a suitably good manner, as occasion offered, that one doubts whether the King will occupy
    himself with the matter, but rather that he will remain true to the declaration he first gave. They
    would then draw in their horns on other sides as well, and quickly come to terms. For the rest, matters
    look very [uncertain: baut] here. Discretion must wrap itself in the thickest veil concerning things
    which happen day and night — [uncertain: standing at no grey distance]. Very thunder-pregnant clouds.
    The King of Saxony has arrived in Pressburg and refuses to accept the portion of Saxony conceded to
    him — He insists upon the whole of Saxony — Meanwhile it is believed that he will in the end accommodate
    himself. For if he did not, Saxony would certainly be strongly occupied by Prussia. The Russian Empress
    departs from here in a few days for Baden — thither the Emperor follows her on the 16th; the King
    travels 10 days afterwards straight to Berlin; there the Russian comes too, and the Emperor of this
    place, [uncertain: by] them, so that they will remain together for 12 days.


    The petition concerning the Polish estates lies ready; I await only the order of the Prince Chancellor
    and money in order to be able to redeem the translations. The Eberhard letter I [uncertain: enclose]
    in the original; the writing comes very hard to me. Otherwise I beg to have it back.


    In deepest reverence I remain, until death, Your Serene Highness''s


    Vienna, the 4th of March 1865.


    most obedient servant


    v Triebenfeld'

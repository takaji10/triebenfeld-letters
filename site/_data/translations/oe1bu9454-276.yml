- page: 2
  en: 'He also has no need of it himself under the territorial law. For according to this one may proceed
    against the guarantor only when all means have been tried and all funds exhausted — But so far as
    I know for certain, and can confide to Your Serene Highness under the seal of secrecy, that royal
    answer is only a political turn of phrase, which His Excellency the Minister von Humboldt drafted
    — One did not wish to affront the niece of Prince Talleyrand, the present great friend of Prince Metternich,
    and one therefore gave the 3 ladies that extremely obliging letter with the assurance that the King
    would have the matter laid before him after his return to Berlin — of any arrangement or satisfaction
    there is not a word in it.


    If now Mr Eberhard could come here with all speed, I should see to it that it were said to the ladies
    [text lost] so bono modo that one doubts the King would occupy himself with the matter, but rather
    would remain true to the declaration he first gave — They would then already haul in from other quarters
    and quickly come to a settlement. For the rest, things look very [uncertain: motley] here — Modesty
    must wrap itself in the thickest veil over things which happen day and night — which stand at no grey
    distance. Very much storm-laden clouds — The King of Saxony has arrived in Pressburg and refuses to
    accept the part of Saxony conceded to him — He insists on the whole of Saxony — One believes, however,
    that he will in the end accommodate himself — for if he did not, Saxony would assuredly be strongly
    occupied by Prussia — the Russian Empress leaves here in a few days for Baden — the Emperor follows
    her there on the 16th; the King travels 10 days afterwards straight to Berlin, and there the Russian
    comes too, and the Emperor of this place, [text lost] they will stay together 12 days — The petition
    concerning the Polish estates lies ready; I await only the Prince Chancellor''s order and money to
    be able to redeem the translations. Eberhard''s letter I send along in the original; the writing comes
    very hard to me — I ask, however, to have it back.


    In deepest reverence I remain, until death,


    Your Serene Highness''s


    Vienna, the 4th of March 1815.


    most obedient servant


    v Triebenfeld'

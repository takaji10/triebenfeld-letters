- page: 2
  en: 'Extract from dispatch No. 423 of Count de Cattaneo, dated Venice, 14 December 1796.


    The Polish gentleman Antoine Prusimski having presented himself at my house in a truly ruined state
    of health, and affected almost to stupor by the death of his wife, asking me for a certificate of
    his sad situation and of the impossibility in which he was, for the present and in this season, of
    being able to set out on a journey, I did not think I could refuse it to him; for if he was wearied
    to the point of prostration in passing from one house to another, how could he have set out on a journey
    to pass from one country to another?


    [Written by the receiving office:]


    Mr von Raumer


    Presented the 2nd of January 1797.


    See Journal A. No. 10.'

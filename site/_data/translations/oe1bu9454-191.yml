- page: 11
  en: 'As concerns the revenues and the sums which Your Serene Highness has to receive from the estates
    here now and in future, you will see these from the attached table. I believe you may be very well
    satisfied with them when all this shall have been settled.


    Since for the rest the lazy Schenck, as he says, means to croak, the councillor of war von Hallen
    will be so good as to go from Kalisz here once every 4 weeks and look over everything that happens
    here, without demanding a single Groschen. Also, as Schenck now wishes to have himself brought at
    once to an abbot at Posen, I shall immediately hand over the cash office to Honrichs and Cabanis;
    these two shall be permitted to do nothing one without the other, and there is therefore nothing to
    be feared. I also think to be here again about Michaelmas, when many have now promised to pay. In
    deepest reverence [uncertain: verspeckt] I remain, until death, Your Serene Highness''s. This moment
    I receive in advance from Privy Councillor von Tesmar in Berlin the glad news that 360000 Rthl are
    to be had.


    oh if only I could travel


    yet. I am again very ill today:


    the 7th of Aug.


    Trąbczyn


    the 6th of Aug 1806.


    faithful and most obedient servant v Triebenfeld'

- page: 4
  en: 'and I believe he is a scoundrel. Either he pays, or within an hour he lies with his belongings
    across the Warthe. By this first tone the fellow was put out of countenance and began to plead.


    Thereupon I conceded that, if he at once gave up the lease contract, let his claims lapse, and paid
    the 2800 at Christmas on pain of losing his whole goods, he might still hold this year, yet it must
    remain free to me to dismember as much of, and whenever I pleased, the demesne farm of Trąbczyn. To
    this he agreed, the contract for 6 years was annulled, and instead a one-year one was drawn up on
    the condition that, as soon as he had [uncertain: been dismissed], I might come to dismember the demesne
    farm; whereupon Honrichs undertook himself to recruit purchasers who should give 600 Rthl per Hufe,
    consequently 2 to 300 Rthl more than hitherto, in return for which I conceded to him that the grounds
    which should be [uncertain: agreed away] might not be improved again, and also promised to place him
    in Your Serene Highness''s service with 400 Rthl yearly salary, if he would faithfully bring this
    about, and especially help to bring the peasants and the other leaseholders to reason. After this
    operation I at once had all the residents belonging to Trąbczyn called together. When the peasants
    saw that the leaseholder stood on my side, already ready with the whip – then their courage too failed
    them, and within an hour this business was so ordered wholly to Your Serene Highness''s advantage
    that neither devil nor saint can have anything against it in all eternity. The peasants soon paid
    their half-yearly rent and vowed to lay down the other half at Christmas. Now I went with Honrichs
    to'

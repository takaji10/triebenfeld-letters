- page: 1
  en: '191


    Most Serene Prince


    Most gracious Lord, After I have lain here 5 weeks with the present gall [fever] and have barely escaped
    death, my first concern is to put Your Serene Highness au fait of everything, how your affairs stand
    here. I must therefore, if with the weakness still pressing upon me I shall be able to recall it all,
    begin from Berlin. There I departed a few days before Midsummer with the assurance that I should receive
    so much out of the justice fund as to be able to pay Oppenheimer with 110000 Rthl. and to get the
    mortgage book clear. Then it was intended to pay Lichnowski the 40000 Rthl. still coming to him against
    jura cessa; further to hand over to Grotowski the remainder, 20000 Rthl., against the adding of his
    instruments.


    Finally, to satisfy Haugt on the very same footing on account of his claims of 18000 Rthl., and Secher
    Thoss[?] with 8000 Rthl.,


    likewise the Prusimska with 8000 Rthl.


    To Zerboni, Eysenhardt and Seehausen, the old Mr Radzinski was to be paid with 24000 Rthl., because
    the villain does not render his rent but only keeps making chicanery.


    It was still my trouble to raise, for the Countess Schlabrendorff, [uncertain: also] for that creature
    the Prusimska, 8000 Rthl., together 33000 Rthl., and in particular to gather something for Your Serene
    Highness. Also indeed to render the interest to the Invalids'' Fund on the 50000 Rthl. promptly, so
    that credit might be won; this must together amount to 311000 Rthl.,


    and more debts you have not here, for all the others are discharged and stand under the 110000 Rthl.
    In the meantime, Your Serene Highness has on the other hand, as the table states, 184000 Rthl. to
    take in by degrees, and there remain owing on the estates only the 40263 Rthl. which would yield annually
    = 127000 Rthl.'

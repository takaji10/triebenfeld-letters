- page: 2
  en: 'So, as said overleaf, [I went] from Berlin before Midsummer to Pszczew, to whom the Rader of the
    Jews, Meyer Bernhard, had brought 3 or 4 suits against Your Serene Highness, because nothing was yet
    known of the Royal approval concerning the Pszczew matter.


    In Pszczew I communicated the news to the people, settled accounts with them, likewise paid Echaust
    old court costs, and after these the burgesses and residents still owed Your Serene Highness 4000
    Rthl., which they must pay at Michaelmas. Meanwhile I learned, to my horror, that an execution decree
    had been sent from Poznań to Trąbczyn, by which (since Metzer had noticed nothing) the Prusimska was
    to be paid 10000 Rthl. dowry together with interest and costs, thus together some 22000 Rthl.


    I therefore hastened as best I could to Kalisz and proved, by the documents procured for me by Rapacki,
    that Prusimski had already paid that dowry in part; by this I did indeed gain time, but the matter
    hangs, and a year and a day may pass again before I bring it clear. Only this is certain, that even
    those 16000 Rthl. entered in the tables may no longer be paid in full, let alone the 22000 Rthl. From
    Kalisz I went to Trąbczyn, where I now confidently believed I should find some 30000 Rthl. But, o
    heaven, how startled I was when instead of money I found a thousand confusions, knaveries, and consequently
    empty [coffers] — the earlier[?] ones all declared themselves insolvent — made out great accounts
    on account of the exorbitant deliveries, carting and quartering under the Russians and Prussians,
    so that the rents of 2 years would still have gone out on it.


    The old peasants who had been put on quit-rents had ceased, and had, despite all judicial contracts,
    approvals by the Chamber and by His Royal Majesty himself, again abandoned the grounds assigned to
    them, and — certainly with the connivance of the tenants, so that these knaves might believe themselves
    entitled to make a so much the greater account — had again'

- page: 10
  en: 'and taking the village bailiwick back in again, particularly if his own clerk will prove that he
    has for some years constantly appropriated to himself all the [grass] from the Wrąbczyn meadows, amounting
    to several hundred Morgen, and has even taken quit-rents from the komorniks living there.


    The bailiwick itself is fully paid for with 4000 Rthl.; the 300 Morgen would indeed be worth nearly
    as much, only these cannot be assured to him, for there are peasants'' meadows lying in them at every
    turn, and then a costly lawsuit is unavoidable — the wretch has nastily misled Your Serene Highness
    in the granting of the 300 Morgen — the rogue has forgotten that he sold within the Wrąbczyn boundary
    some 10 Hufen to 4 Kashubians for a trifle and took the money; so, if the cursed contract with the
    peasants is to be kept, nothing remains. I greatly fear that Your Serene Highness will yet get a costly
    lawsuit out of this [uncertain: Schwedenstrei-], for it was just now said that Glenck has sold the
    bailiwick to the [uncertain: Schulweische] Giese in Oleśnica.


    Now the fellow has so nastily prompted you that you sell him the 300 Morgen for 300 Rthl. and allow
    him to dismember — if Giese buys, then he will at once go judicially against Your Serene Highness
    — my advice at the time was good, to give the fellow 4000 and let him run.


    With the Oleśnica fellows the [uncertain: man] has brought Your Serene Highness into such great misfortune,
    and as they say he is supposed to have secretly given the [uncertain: Bessinn] testimonies by which
    they will win the lawsuit. For this man''s sake the matter here is most disagreeable to me'

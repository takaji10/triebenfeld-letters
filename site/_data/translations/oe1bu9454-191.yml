- page: 3
  en: 'appropriated their former grounds and sown them, and thereby almost dissolved the demesne farms;
    indeed at [uncertain: the last] they even drove off the German colonists already spoken of, so that
    I could reckon neither on the stipulated entry monies from these nor still less on rents. In addition
    to all this, Schenck had kept silent and gave himself out for dead [uncertain: Brand] when I wanted
    to call him to account. I now [asked] this [uncertain: Massette] for advice as to what ought to be
    done in the matter – His answer was to let the matter take its course, and to report it to the government,
    and to throw a suit upon the necks of the leaseholders and the subjects.


    In the Florich, Rybbeck and Burck affairs you proceeded so [uncertain: at random].


    Act.


    Well, but it cannot be done otherwise. Question: How long do you believe the lawsuit can last before
    the matter comes clear.


    Answer:


    Well, some 2 to 3 years.


    Question:


    Does the gentleman understand Russian?


    [illegible]: Me!


    I: Well then, I will show it to him. With me one spits such lazy [uncertain: scribblers] in the face,
    lets them go, and acts alone. Thereupon I went to Trgberin and summoned the leaseholder Honrichs with
    his contract before me.


    To the question whether he could pay the rent sum now falling due, 2000 Rthl, and also at once render
    up the remainder of the 800 Rthl, this man answered – No. He also believed, he added, that he owed
    nothing, for he had a claim of over 5000 Rthl'

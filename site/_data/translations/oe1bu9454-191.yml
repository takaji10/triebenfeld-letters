- page: 1
  en: 'Most Serene Prince


    Most gracious Lord, After I have lain here 5 weeks with the [uncertain: present] bile and have escaped
    death only with difficulty, my first concern is to set before Your Serene Highness from the very beginning
    how your affairs stand here. I must therefore, if, given the weakness that still presses upon me,
    I shall be able to recollect everything, begin with Berlin; from there I departed a few days before
    Midsummer with the assurance that I should receive so much out of the judicial fund as would enable
    me to pay Oppenheimer with 110000 Rthl and to get the mortgage book clear. Thereafter I wished to
    pay Lichnowski what is still owing to him against an assignment of rights (Jura cessa).


    40000 Rthl. Further, to hand over to Grotowski the remainder against the [uncertain: adiring] of his
    instruments. 20000 Rthl. Finally to Haugt, in the same manner, on account of his demands 18000 Rthl


    and to the [uncertain: Secher] Koss[illegible] with


    8000 Rthl, and likewise to satisfy the Prusimska. 8000 Rthl. To Zerboni, Eysenhardt and Seehausen
    the old [account] of Mr. Radzinski was also to be paid, because the villain does not render up his
    rent but only keeps making chicaneries. 24000 Rthl. It was still my trouble to raise, with the Countess
    Schlabrendorff, that creature the Prusimska, 8000 Rthl in all, and especially to gather something
    for Your Serene Highness. 33000 Rthl. And also indeed to remit the interest to the Invalids'' Fund
    for the [uncertain: grauf], so that credit would be gained. 50000 Rthl


    this must come altogether to


    311000.


    and you have no more debts here than these, for all others are discharged and [uncertain: standing],
    under the 110000 Rthl. In the meantime Your Serene Highness has on the other hand, as the table states,
    184000 Rthl to take in little by little, and there remain owing upon the estates only the 40263 Rthl
    which would yield annually. 127000 Rthl owing'

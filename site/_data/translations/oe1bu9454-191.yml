- page: 3
  en: 'appropriated their former grounds and sown them, and thereby almost dissolved the demesne farms
    — indeed in the end they even drove off the German colonists already settled, so that I could count
    neither on the stipulated entry moneys from these, still less on quit-rents. On top of all this Schand
    had kept silent and gave himself out for dead of gangrene when I wished to call him to account. I
    asked this Massette for advice as to what was to be done in the matter — his answer was to let the
    affair take its course, and to report it to the Government, to throw a lawsuit round the necks of
    the tenants and the subjects.


    Question: Have you proceeded so well in the Floricke, Rybbeck and Szczucki matter?


    Ans.: No, but it cannot be done otherwise. Question: How long do you believe the lawsuit can last
    before the matter comes clear?


    Ans.: Well, some 2 to 3 years.


    Question: Does the gentleman understand Russian?


    He: No!


    I: Well then, I will show it to him. With me one spits such lazy scribblers in the face, lets him
    run, and acts alone.


    Upon this I went to Trąbczyn and summoned the tenant Honrichs before me with his contract.


    To the question whether he could pay the rent sum now falling due, of 2000 Rthl., and also at once
    render the remainder of the 800 Rthl., he answered — No. He believed, he added, that he owed nothing
    either, for he had over 5000 Rthl. in claims'

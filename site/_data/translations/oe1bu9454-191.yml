- page: 5
  en: 'Swiątniki. Here sat von Zglinski with his two gaping fools of sons.


    There the peasants had sown a great part of the lordship''s fields and, together with the leaseholder,
    had thrown everything into such confusion that I myself shuddered to penetrate into this labyrinth.
    Under the contract von Zglinski was to pay 1500 Rthl. The contract ran for 12 years, and contained
    among its clauses the provision that if the leaseholder did not pay on the appointed term the contract
    should be forthwith null and void, and the leaseholder likewise bound to vacate at once, but to make
    good his possible claims by way of law. Now I [asked] this Sarmatian whether he would pay; his answer:
    I should not only not pay, but should sit here as long as [uncertain: I have been here] until I know
    my claims, which amount to 5700 Rthl, satisfied, and besides that I insist that the grounds which
    the peasants have in possession, but which were assigned to me beforehand, be handed over to me at
    once.


    In this [uncertain: place] all the peasants also appeared and declared that they would not give up
    the grounds, and if the Prince and the King himself came, they were born and bred upon these grounds
    and would never vacate them. I represented to the fellows that they had settled everything judicially,
    that the Prince had made them a present of their freedom, had moreover given them the inventory gratis,
    that their rent was insignificant compared with that of the colonies, that even the houses and buildings
    had been given them into the bargain.'

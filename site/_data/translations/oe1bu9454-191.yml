- page: 6
  en: 'whereas the colonist had first had to clear all the soil laboriously and build everything at his
    own cost. – Meanwhile my talking availed nothing; it was much rather like oil to quench a fire. Since,
    however, I had marked the spokesmen and had at the same time perceived which of them had approached
    von Zglinski and his sons, I had one of these step forward, threw him down and had 50 lashes of the
    whip counted out to him – the fellow did not quite endure them, for Honrichs strikes like the best
    Cossack general – he begged for mercy, but I had them go on notwithstanding; at the 43rd, however,
    the beast fainted. I had him doused with water, and when he came to himself had him led aside and
    the next one brought forward. I threw him down too; Honrichs again tore breeches and skin apart with
    every stroke – this took effect, and he cried out for mercy and [uncertain: promised] to confess.
    I had them stop, [so] that all three communities were


    from Zglinski; Niedzwiedzki, on being asked what he had to say, then declared, and that the [uncertain:
    Olernicere] had been given notice. [uncertain: Schatz] and several others, especially the Kopojno
    people, the [subjects] who had also come in, paid this – they confessed themselves deserving of punishment,
    but begged imploringly for pardon, and declared themselves content with the grounds assigned to them.
    Then, however, they had to complain of the justiciary: he had always turned them away when they wished
    to lay a complaint before him or to ask for orders of conduct, whereas he had always stood in with
    the noblemen and lived in merriment with them. After this stroke of mine had succeeded, I at once
    sent to [uncertain: Schanden] and had [uncertain: the said man] come to me immediately, so that in
    his presence the peasant grounds might be properly bounded, and separated for all eternity from the
    lordship''s and the colonists'' grounds.


    This man appeared in the shape of the most crushed wretch, and so the work was begun and happily completed;
    only Schenck remained lying half-way'

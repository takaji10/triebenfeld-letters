- page: 4
  en: 'and I believe he is a scoundrel. He pays, or within an hour he lies with his affair over the Warthe.
    By this first tone the fellow was put out of countenance[?] and began to plead.


    Upon this I gave way, that if he at once surrendered the lease contract, let the claims fall, and
    paid the 2800 Rthl. at Christmas on forfeit of his whole property, he might still sit this year; yet
    it must be free to me to dismember as much, and when I pleased, of the demesne farm of Trąbczyn. To
    this he agreed; the contract for 6 years was annulled and in its place a one-year contract drawn up,
    with the condition that as soon as he had reaped I might dismember the demesne farm; whereupon Honrichs
    undertook himself to recruit purchasers who should give 600 Rthl. per Hufe / consequently 2 to 300
    Rthl. more than hitherto /, in return for which I conceded to him that the grounds which should be
    [uncertain: Dummabredt] need not be improved again, and also promised him to place him in Your Serene
    Highness''s service with 400 Rthl. yearly salary, if he would faithfully effect this and in particular
    help bring the peasants and the other tenants to reason. After this operation I at once had all the
    residents belonging to Trąbczyn summoned together. When the peasants saw that the tenant stood ready
    on my side already with the whip — then their courage too fell away, and within an hour this work
    was so ordered to Your Serene Highness''s advantage that neither devil nor saint can have anything
    against it in eternity. The peasants soon paid their half-yearly quit-rent and vowed to lay down the
    other half at Christmas. Now I went with Honrichs to'

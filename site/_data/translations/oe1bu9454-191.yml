- page: 9
  en: 'and buy in. His clerk by name of Meyer, who lives here on the Trąbczyn [uncertain: bailiwick],
    has fallen out with him, and during my illness informed [uncertain: Schmid] of it. This man, in order
    now perhaps to [uncertain: ingratiate] himself again, sent me the lampoon yesterday evening. Its content
    is as stupid and insipid as the fellow himself is; only the rogue has attained his purpose of hindering
    my plans and damaging the good cause. He thinks I shall grow weary and depart, and then he would have
    to come back again, because nobody would be there.


    The wretch is offering his estate for sale and wants to dismember it himself; he always draws the
    people who want to come here to buy over to himself, talks them away from here as aforesaid, and when
    in the end he can give no judicial contracts, against which the Trąbczyn peasants constantly protest,
    then the people go back and think they will only be cheated in Your Serene Highness''s estates. I
    am urged to denounce the fellow to the public prosecutor, or at least to throw a suit for defamation
    upon his neck – I shall not do it – the villain has damaged Your Serene Highness more than me. I therefore
    leave this to Your Serene Highness''s discretion. For the rest, deign, most gracious Lord, to tell
    me whether the yearly rents ought not to be demanded of the fellow; he has not yet given a single
    [uncertain: Xger], but assures one that he settles accounts on that head with Your Serene Highness
    alone.


    The rents in arrears are said to amount already to over 400 Rthl, and even this is a motive for throwing
    the fellow out'

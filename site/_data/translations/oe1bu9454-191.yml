- page: 8
  en: 'All these affairs I had concluded within the space of 6 days, and I was at pains to have the Germans,
    who had some 40000 Rthl. to pay, sought out together in order to obtain money to pay the interest,
    to satisfy the [uncertain: Schluß Arendorffen], and to gather something for Your Serene Highness.
    But this did not succeed — many of the old ones did indeed show themselves, but always vanished again.
    Newer purchasers were to come, but always drew back timorously again. At this failure of my plans
    I so vexed and grieved myself that of a sudden a violent gall fever came upon me, which has compelled
    me to keep my bed now these 5 weeks. Only these 2 days is it improving, and I can now think and work
    more again. Meanwhile everything still looks very motley, and prospers only so far as the long time
    in bed, violent headache and the great weakness permit.


    [uncertain: Weigens] I shall, as soon as I am certainly back, and if possible have appeased the Schlabrendorff
    woman, go again to Berlin — for here it might take too long before I bring together anything appreciable.
    The notorious Glenck, who has hatched a true conspiracy against me and Your Serene Highness, is, as
    I have just learned, and what came out during my illness, talking all purchasers away with his gang
    — he has been staying here already over 6 or 7 weeks — he has joined himself with the three rogues
    of Oleśnica, with a certain Kramplich, with Flöricke, Rybbeck, with a certain Bergemann and more such
    rabble, in order to frustrate all my plans.


    To attain his purpose he has made a lampoon upon me and given such to people who wish to buy, who
    have taken it with them as far as the Mark, and thereby at the same time frightened back others who
    wished to come here'

- page: 7
  en: 'and substituted a certain Ogrodowitz. Perhaps the scoundrel will croak and death free us from this
    hypocrite.


    After this too had been happily settled, I went at the tenant again by the throat, who, since he was
    unmasked, [uncertain: took it to heart] and [saw] the complete failure of his plans; he therefore
    asked for pardon, which I could not give; so he surrendered the contract and withdrew in apparent
    [fashion] — I had his grain reaped and sold for 260 Rthl., and [I am] now [offering] the demesne farm,
    which consists of 30 Hufen of land and meadow, the Hufe at 600 Rthl. entry money and 15 Rthl. yearly
    quit-rent — now it comes to this, that Honrichs soon gets purchasers for it, for through the tenant''s
    infamy nothing has been lost here either, but much gained. After this the tenant of Kopojno had to
    step forward; he, warned by those proceedings, soon asked for fair weather — his accounts likewise
    came to some 6000 Rthl. He brought them down, however, to 1125, which I had to accept, since the district
    councillor had all but flayed the people; but in return he too had to cancel the contract and grant
    it only for 1 year, for which he must pay 2500 Rthl. at Christmas, and against which I may also at
    once have it dismembered. The peasants of Skokum, who had been incited by that gang of rogues from
    Oleśnica and Wrąbczyn, had likewise to lie down at the mark, after Honrichs, because they had secretly
    pulled apart the boundary mounds, but had luckily been caught by them, had counted out 30 strokes
    of the whip to each. Now on this side everything is in order, and the Germans are gradually coming
    in again.


    The old malicious Tietz too, who has leased Drzewce, promises to render the rent; only the fellow
    will bring 600 Rthl. into deduction as the 2 years'' pension which Your Serene Highness is said to
    have assured him with 300 Rthl. for his lifetime.


    I did not know what there is in this; may Your Serene Highness deign to instruct me upon it. In the
    records here nothing is to be found except the accompanying certified copies, which are taken from
    Tietz''s original pieces, and according to these the old [uncertain: Inachten] has nothing to demand.'

- page: 7
  en: 'and substituted a certain [uncertain: Ogradenz]. Perhaps the scoundrel will croak and death free
    us from this hypocrite.


    After this too had been happily settled, I went again upon the neck of the leaseholder, who, seeing
    that he was unmasked, [uncertain: submitted] for himself, and with the complete failure of his plans
    he begged therefore for pardon; this I could not give, so he gave up the contract and departed [uncertain:
    seemingly]. I had his grain reaped and sold for 260 Rthl, and I am now [uncertain: letting out] the
    demesne farm, which consists of 30 Hufen of land and meadow, the Hufe at 600 Rthl entry money and
    15 Rthl yearly rent. Now it depends on Honrichs soon getting purchasers for it; then, through the
    leaseholder''s infamy, nothing is lost here either, but much gained. After this the leaseholder of
    Kopojno had to come forward; warned by that proceeding he soon begged for fair weather; his accounts
    too came to some 6000 Rthl. He brought them down, however, to 1125, which I had to accept from him,
    since the district councillor had all but flayed the people; but in return he too had to cancel the
    contract and concede only one year, for which he must pay 2500 Rthl at Christmas, and against which
    I may also have dismemberment carried out at once. The [uncertain: Schokkom] peasants, who had been
    stirred up by the Olesnica and Wrgbün bands of knaves, had also to come to the mark, after 30 lashes
    of the whip had been counted out to each of them by Honrichs, because they had secretly pulled the
    boundary mounds apart but had luckily been caught by them [uncertain: outright]. Now on this side
    everything is in order, and the Germans are gradually coming in again.


    The old malicious Tietz too, who has leased Drzewce, promises to render up the rent; only the fellow
    wants to deduct 600 Rthl as the 2 years'' pension which Your Serene Highness is said to have assured
    him with 300 Rthl for his lifetime.


    I do not know what there is in this; may Your Serene Highness deign to instruct me upon it. In the
    records here nothing is to be found but the attached [uncertain: certified] copies, which are taken
    from Tietz''s original pieces, and according to these the old [man] has [uncertain: nothing] to demand.'

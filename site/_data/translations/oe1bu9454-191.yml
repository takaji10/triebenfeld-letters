- page: 10
  en: 'and drawing the bailiwick in again, especially if his own clerk will prove that he has for some
    years constantly appropriated all the [uncertain: hay] of the Trąbczyn meadows, amounting to several
    hundred Morgen, and has even taken rents from the komorniks living there.


    The bailiwick itself is fully paid for with 4000 Rthl; the 300 Morgen would indeed be worth almost
    as much, but these cannot be assured to him, for peasant meadows lie all across them, and there a
    costly lawsuit is unavoidable – the wretch has [uncertain: favourably] induced Your Serene Highness
    in the granting of the 300 Morgen – the [uncertain: Schult] has forgotten that within the Trąbczyn
    boundary he sold some 10 Hufen to 4 Kashubians for a trifle and took the money; thus, if the accursed
    contract is to be kept with the peasants, nothing remains. I greatly fear that Your Serene Highness
    may yet get a costly lawsuit out of this [uncertain: Swedish stroke], for it was just now said that
    Glenck has sold the bailiwick to the [uncertain: Schulmisch] Giese in Olesnica.


    Now the fellow has so nastily [uncertain: talked you into it] that you sell him the 300 Morgen for
    300 Rthl and permit him to dismember – if Giese buys, then he will at once go to law against Your
    Serene Highness – My advice at the time was good: give the fellow 4000 and let him run.


    With the Olesnica fellows the man has brought Your Serene Highness into this great misfortune, and
    as is said he is supposed to have given the [uncertain: Bessinn] secret testimonies by which they
    will win the lawsuit. For this man''s sake the matter here is most disagreeable to me'

- page: 8
  en: 'All these businesses I had concluded in the space of 6 days, and I was [about] to have the Germans,
    who have some 40000 Rthl to pay, gathered together in order to obtain money, to pay the interest,
    to satisfy the [uncertain: Schluß] leaseholders, and to gather something for Your Serene Highness.
    But this did not succeed – many of the old ones did indeed show themselves, but always vanished again.
    New purchasers were supposed to come, but always drew back again timorously. At this failure of my
    plans I vexed and grieved myself in such a manner that a violent bilious fever fell upon me, which
    forced me already today for 5 weeks to keep my bed. Only for the last 2 days has it been improving,
    and I can now think and work more again. Yet everything still looks very confused, and succeeds only
    so far as the long time in bed, violent headache and great weakness permit.


    [uncertain: Weigel] I shall, as soon as I am [uncertain: certain] back, and if possible when I have
    quieted the Schlabrendorff woman, go again to Berlin – for here it might take too long before I bring
    anything considerable together. The notorious Glenck, who has hatched a true conspiracy against me
    and Your Serene Highness, is, as I have just learned, and as came out during my illness, talking all
    the purchasers away with his gang. He has already been staying here over 6 or 7 weeks – He has joined
    himself with the three Olesnica knaves, with a certain Kramplich, with Flöriche, Rybbeck, with a certain
    Bergemann and more such rubbishy stuff, in order to frustrate all my plans.


    For the attainment of his purpose he has made a lampoon upon me and given such to people who wished
    to buy, who have taken it with them as far as the Mark, and have thereby at the same time frightened
    back others who wanted to come here'

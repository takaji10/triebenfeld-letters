- page: 5
  en: 'Swiątniki. Here sat von Zglinski with his two gaping fools of sons.


    There the peasants had sown a great part of the manorial fields and, in league with the tenant, had
    so confused everything that I myself shuddered to penetrate into this [uncertain: Labirath]. Under
    the contract von Zglinski was to pay 1500 Rthl. The contract ran for 12 years, and contained among
    its clauses the provision that, should the tenant not pay on the term day, the contract should at
    once be null and void, and the tenant bound to vacate immediately, but to pursue any claims he might
    have by course of law. Now I asked this Sarmatian whether he would pay; his answer was — I shall not
    only not pay, but shall sit here so long until I know my claims, which amount to 5700 Rthl., satisfied;
    and moreover I insist that the grounds which the peasants hold in possession, but which were previously
    assigned to me, be handed over to me at once.


    At this [uncertain: summons] all the peasants also appeared and declared that they would not give
    up the grounds, even if the Prince and the King himself should come; they were born and bred on these
    grounds and would never vacate them. I represented to the fellows that they had settled everything
    judicially, that the Prince had made them a gift of their freedom, had besides given them the inventory
    gratis, that their quit-rent was insignificant compared with that of the colonists, that even the
    houses and buildings had been given them into the bargain,'

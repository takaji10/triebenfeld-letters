- page: 2
  en: 'So, as said overleaf, I set out from Berlin before Midsummer for Betsche, to whom the [uncertain:
    Rader] of the Jews, Meyer Bernhard, had brought 3 or 4 suits against Your Serene Highness, because
    nothing was yet known of the Royal approval concerning the Betsche affair.


    At Betsche I communicated the news to the people, made up my accounts with them, paid Echaust likewise
    the old court costs, and after this the burgesses and residents still owed Your Serene Highness 4000
    Rthl, which they must pay at Michaelmas. Then I learned, to my horror, that an execution decree had
    been sent from [uncertain: Posten] to Trąbczyn, by which (since Metzer has taken no notice of anything)
    the Prusimska''s 10000 tl. bridal settlement together with interest and costs, thus altogether some
    22000 Rthl, were to be paid.


    I therefore hastened as fast as was possible to Kalisz and proved, by the documents procured for me
    by Rapacki, that Prussiemski had already paid part of that bridal settlement; by this I did indeed
    gain time, yet the matter hangs, and a year and a day may again pass before I bring it to a clear
    footing. This alone is certain, that not even those 16000 [uncertain: Fiden] entered in the [uncertain:
    tables] may be paid in full any longer, let alone the 22000 Rthl. From Kalisz I went to Trąbczyn,
    where I now confidently believed I should find some 30000 Rthl. But, o heavens, how I was startled
    when instead of money I found a thousand confusions, knaveries, and consequently empty coffers – the
    earlier ones all declared themselves insolvent – they made out great accounts on account of the exorbitant
    deliveries, cartage and quartering under the Russians and Prussians, so that the rents of 2 years
    would still have gone out on them.


    The old peasants who had been put on rents had ceased, and had, in spite of all judicial contracts,
    approvals from the Chamber and from the Royal Majesty himself, again abandoned the grounds assigned
    to them, and, certainly in collusion with the leaseholders, so that these knaves might believe themselves
    entitled to make so much the greater account, had again'

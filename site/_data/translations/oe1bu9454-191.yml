- page: 6
  en: 'whereas the colonist must first laboriously [clear] all the soil and build everything at his own
    cost. — Meanwhile my talking availed nothing; it was much more like oil to put out a fire. Since,
    however, I had marked the spokesmen and had at the same time perceived which of them drew near to
    von Zglinski and his sons, I had one of these step forward, threw him down and had 50 strokes of the
    whip counted out to him — the fellow did not endure them quite to the end, for Honrichs flogs like
    the best Cossack general — he begged for mercy; notwithstanding, I let it go on, but at the 43rd the
    beast fainted. I had him doused with water, and when he came to himself had him led aside and the
    next one brought forward. I threw him down too; Honrichs with every stroke tore breeches and hide
    apart — this took effect, and he cried for mercy and promised to report. I had them stop, and to the
    question what he had to say he then declared that all three communities had been set on by Zglinski,
    Niedźwiecki and the people of Oleśnica. The [uncertain: Schatz] and several others, particularly the
    people of Kopojno who had likewise come in beneath, confirmed this — they confessed themselves deserving
    of punishment, but begged imploringly for forgiveness and declared themselves content with the grounds
    assigned to them. In the meantime, however, they had to complain of the justiciary: he had always
    turned them away when they wished to lay a complaint before him or to ask for orders of conduct; on
    the other hand he had always stood together with the noblemen and lived in merriment with them. After
    this coup of mine, which succeeded, I at once sent to Schanden and had him bidden come to me immediately,
    so that in his presence the peasants'' ground might be properly bounded, and separated for eternity
    from the manorial and colonists'' grounds.


    He appeared in the shape of the most crushed wretch, and the work too was begun and happily completed;
    only Schenck remained halfway'

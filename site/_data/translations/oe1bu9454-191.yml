- page: 9
  en: 'and settle themselves. His clerk by the name of Meyer, who lives here on the Wrąbczyn village bailiwick,
    has fallen out with him and during my illness reported him to Schmid. The latter, perhaps to ingratiate
    himself again, sent me the lampoon yesterday evening.


    The content is as stupid and tasteless as the fellow himself is; only the rascal has attained his
    purpose of hindering my plans and harming the good cause. He thinks I shall tire and go off, and then
    he would have to come back because nobody would be there.


    The wretch is offering his estate for sale and means to dismember it himself; he always draws the
    people who wish to come and buy here aside to himself, talks them away from here as aforesaid, and
    when in the end he can give no judicial contracts, against which the peasants of Wrąbczyn always protest,
    then the people go back and think they would only be cheated in Your Serene Highness''s estates. I
    am urged to denounce the fellow to the fiscal authority, or at least to throw an action for defamation
    round his neck — I shall not do it — the villain has harmed Your Serene Highness more than me. I therefore
    submit this to Your Serene Highness''s judgement. For the rest, deign, most gracious Lord, to tell
    me whether the yearly quit-rents ought not to be demanded of the fellow. He has not yet given a single
    kreuzer, but assures everyone that he settles accounts on that score with Your Serene Highness alone.


    The outstanding quit-rents are said to amount already to over 400 Rthl., and even this is a motive
    for throwing the fellow out'

- page: 11
  en: 'As concerns the revenues and the sums which Your Serene Highness has to receive from the estates
    here now and in future, you will perceive these from the accompanying table. I believe you can, when
    all this shall have been settled, be very well content with it.


    Since, for the rest, the lazy Schenck means, as he says, to croak, the councillor of war von H[e?]llen
    will be so good as to come here from Kalisz once every 4 weeks and look over everything that happens
    here, without his demanding a Groschen. Also, since Schenck now wishes to have himself brought at
    once to an abbot at Poznań, I shall immediately hand over the cash-box to Honrichs and Cabanis; these
    two shall not be permitted to do anything one without the other, and there is therefore nothing to
    be feared. I think too to be here again about Michaelmas, when many have now promised to pay. In deepest
    reverence I remain, until death, Your Serene Highness''s. This moment I receive in advance from the
    privy councillor von Tesmar in Berlin the glad news that 360000 Rthl. are to be had. Oh, if only I
    could travel first. I am again today


    very ill —


    the 7th of Aug.


    Trąbczyn


    the 6th of Aug 1806.


    faithful and most obedient servant


    von Triebenfeld'

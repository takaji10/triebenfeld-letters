status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! From Berlin no resolution has yet come; I do not know what
    to think of Amelang''s diligence. People are all cut to the same last — only do not always stand behind
    them, or clear the way oneself, or so fill the rapacious claws, [and] then they let everything go
    on at its snail''s pace. If the revision is made difficult for me by the Finance Department, then
    I shall have the Landrath revise, attest and guarantee the assessments; that is then still more than
    is demanded. It therefore comes only to this, that I be given a decision from Berlin. The chicaneries
    over the revision of the assessments are entirely new and arise solely from Prince George and General
    Kalckreuth''s lady''s [i.e. the General Kalckreuthern''s] impetuous conduct — neither Amelang nor
    still less I knew anything of it in Berlin; the wrangling was solely with the Minister von Voss, from
    all of whom the orders were quickly given, and since the matter was not transacted collegially, no
    one could know of it either. This tidy ordinance was first brought up [uncertain: Unfuhr] in Breslau
    by the young Count Kalckreuth. Meanwhile, so much having already been cleared away, a way out must
    be found here too. Here everything goes thus far according to wish, and I hope to bring together a
    heavy lump of money. With Otochten I think to be finished today. Who likewise promises 10000 Rthl
    within a short time, as well as 2000 Rthl as the'
- page: 2
  en: half-yearly propination-rent, to be paid anticipando. If I am rid of Honrichs, as I firmly hope,
    then Meierowitz pays 20000 Rthl in cash 8 days before Midsummer, and lays down an annual canon of
    500 Rthl in perpetuity. What has happened with Swięcia, and whether my plan will succeed, I shall
    learn today from Nerlich. For the purchase of the lands which are [illegible] to be dismembered altogether,
    many people have already come forward, and in particular several noblemen, who wish to buy many Hufen
    and to pay cash at once. Meanwhile I press only for the issuing of the consent, so that no obstacle
    of any kind can be laid in my way. The Chamber had committed the investigation to the Landrath and
    prescribed the norm according to which Your Serene Highness may dismember; this has been strictly
    complied with, everything cleared away, and everything submitted to the Chamber, so that all chicaneries
    have been met and the ways to the throne have been made level, [in case] a new barrier were to be
    pulled over our nose; for I would lay before the King those dispositions once given, as well as all
    contracts and protocols concluded pursuant to them, and would then demand the concession there with
    full right, without having to beg. The President v. G. is entirely in agreement with me on this. By
    the next post I shall send Your Serene Highness a Copy of all these proceedings. With the Olesnice
    fellows everything will be settled very gradually.
- page: 3
  en: 'For a long time already there has existed at the Chambers here (of which, however, as God lives,
    I knew not one jot) an edict, according to which 1. no peasant or non-noble may be granted a noble
    estate in hereditary lease without special Royal consent; 2. even to noble hereditary lessees there
    may not be handed over or made over together with it a. the jurisdiction, b. not the [uncertain: Zad],
    c. not the beer and brandy Urbar, and d. not the power to drive out the old subjects or to displace
    them in their livelihoods. Already under the 23rd of December 1803 the Chamber here made this known
    to Herr Bau-Rath Glenck and to the Landrath v. Blomberg. More than culpable is it on the part of the
    former, that he withheld such from Your Serene Highness and permitted that a contract was nevertheless
    concluded with the Olesnice fellows; but base is it on the part of the latter, that he nevertheless
    wished to conclude a compromise between the 3 Olesnice rogues and the old subjects, and to have Your
    Serene Highness guarantee it. God, what sort of people are these, and in whose hands have Your Serene
    Highness been until now? — By high disposition the entire Chamber files have been given to me; I am
    having all the fine pieces extracted, so that Your Serene Highness may for once be convinced.'
- page: 4
  en: 'Now I must hold firmly and purely to the performance of the contract not now kept by the Olesnice
    people, so that these knaves do not get through with a possible counter-claim; otherwise we should
    have to fear a lawsuit of years'' duration. More than devilish is it that Glenck said not a word of
    the two Chamber dispositions or resolutions of the 23rd of December 1803 and the 24th of January 1804,
    and allowed a contract to be concluded under the 22nd of February 1804 which runs point-blank against
    the edicts and rescripts of the Chamber that had been made known to Glenck. I now count upon Schenck''s
    good will and adroitness, which I had already called upon beforehand. From Dąbrowski I learn just
    now that the Prussiemski compromise lies in the Kowal archive, and that the receipts too are lodged
    there [uncertain: inquisirt], that Prussiemski has paid. The proceedings run to some seventy sheets;
    I have asked Dąbrowski to have them extracted with all speed; then indeed one will get on the track
    of the matter, for [if] the recesses and actual resignations of Brzyze had also been stolen out of
    the archives, then those parties could nevertheless demand nothing further, but would rather have
    still, since we do not have Brzyze, to pay out. Concerning Ritlach and Floriche let Your Serene Highness
    not trouble yourself, for these dogs I shall chastise in concert with Lichnowski. Were only my health
    not so shattered that I could go about in all places, then everything should go more briskly; as it
    is, however, I must too often keep to my room in bed, where all nursing is wanting to me, and the
    constant vexation wears me quite away. — Meanwhile I remain, until death, Your Serene Highness''s


    Kalisz, the 4th of March 1805.


    most faithful servant

    v Triebenfeld'

- page: 14
  en: 'Since Mr building inspector Wollenhaupt inhabits the dwelling house on the demesne farm Drzewce
    with his family, but this building is designated for the future dwelling of the present demesne farm
    tenants Tietz and Schatzmann, Mr Wollenhaupt promises to vacate this dwelling house by Michaelmas
    of the current year at the latest, and also until then to come to terms concerning it with the said
    tenants in every way possible to him.


    Against the tenants he reserves to himself an improvement expended upon the buildings of


    43 Rthl 1 silver Groschen, and the compensation for the laying out of a garden. The appearing parties
    have, of the fore-'

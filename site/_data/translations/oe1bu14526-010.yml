- page: 2
  en: 'Wilhelm Wollenhaupt on the other part. The appearing parties are personally known to the undersigned
    and are subject to no doubt as to their capacity to perform judicial acts. They freely and with full
    deliberation declare to the protocol the following hereditary quit-rent contract, concluded between
    them, irrevocable and in nothing to be altered.


    §. I. His Most Serene Highness grants, namely, from the demesne farm Drzewce


    18 Hufen, in words eighteen Hufen, of clear arable land, and near Wrąbczyn


    2 Hufen, in words two Hufen, of Magdeburg meadows, together therefore 20 Hufen, in words twenty Hufen
    Magdeburg measure, to the building inspector Johann Wilhelm'
  names:
  - de: Willhelm Wollenhaupt
    en: Wilhelm Wollenhaupt
    kind: person
  - de: Drzewce
    en: Drzewce
    kind: place
  - de: Wrąbczyn
    en: Wrąbczyn
    kind: place

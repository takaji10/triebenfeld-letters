status: draft
segments:
- page: 1
  en: 'The Princely Hohenlohe Court Office at Trąbczyn hereby gives to be known that before it, between
    His Serene Highness the reigning Prince of Hohenlohe, through his general plenipotentiary, the Councillor
    of War and Forests von Triebenfeld, of the one part, and the Building Inspector Wollenhaupt of the
    other part, the following contract and respectively the giving of a receipt has been declared and
    put on record.


    Actum Trąbczyn, the 11th of May 1805.


    Before the undersigned Patrimonial Court there appeared


    1. Herr Councillor of War and Forests von Triebenfeld, as the known general plenipotentiary of His
    Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court
    of the estates here, of the one part, and


    2. the Building Inspector Herr Johann'
- page: 2
  en: 'Willhelm Wollenhaupt of the other part. The comparents are personally known to the undersigned
    and are subject to no doubt as to their capacity to execute judicial acts. The same do freely and
    after mature deliberation declare to the protocol the following hereditary quit-rent contract concluded
    between them, irrevocable and in nothing to be altered.


    §. I. His Most Serene Highness does, namely, grant out of the demesne farm Drzewce


    18 Hufen, in writing eighteen Hufen, of clear arable land, and at Wrąbczyn


    2 Hufen, in writing two Hufen, of Magdeburg measure of meadow, together therefore 20 Hufen, in writing
    twenty Hufen Magdeburg measure, to the Building Inspector Johann Willhelm'
- page: 3
  en: 'Wollenhaupt, from now on for everlasting times in hereditary quit-rent; and there are herewith
    at the same time also


    1. the dwelling house and


    2. the brew house at Drzewce made over to him in property.


    §. II. The said Wollenhaupt pays as purchase money for the twenty Hufen received in grant, per Hufe
    300 rt, in writing three hundred Rthaler, making altogether 6000 rt, in writing six thousand Rthaler,
    in cash and in good Prussian Courant of the treasury standard.


    The buildings which are mentioned in §. 1 Wollenhaupt receives free of charge, and their value is
    already comprehended within the purchase.


    §. III. On account of the purchase money there have already been paid 400 rttl,'
- page: 4
  en: 'in writing four hundred Rthaler, paid in cash, for which receipt is hereby given. At St John''s
    of the present year 3000 rttl, in writing three thousand Rthaler, and the remainder with 2600 rtl,
    in writing two thousand six hundred Rthaler, at Christmas of this year, will be paid off in cash and
    in Courant.


    §. II. The hereditary lessee binds himself, for these twenty Hufen acquired, from St John''s of this
    year onward, to a perpetual hereditary quit-rent, which may [uncertain: never] be raised or diminished,
    per Hufe Magdeburg measure at 15 rttl, in writing fifteen Rthaler, thus for 20 Hufen 300 rtl, in writing
    three hundred Rthaler, in Courant in cash, and that yearly in two'
- page: 5
  en: 'instalments, at Christmas and at St John''s, each time with


    150 rttr, in writing one hundred and fifty Rthaler, yet not in advance but after the elapse of each
    half year, and consequently to be paid for the first time at Christmas.


    §. V. The said Wollenhaupt undertakes the obligation to dismember these twenty Hufen acquired into
    ten separate peasant holdings, yet in such manner that none of them shall amount to less than one
    Hufe Magdeburg measure.


    §. VI. The establishments the hereditary lessee and the other takers must effect at their own cost,
    without either now or in the future any timber or other building assistance being given by the ground
    lordship.'
- page: 6
  en: 'Likewise neither they nor the present acquirer receive any right of pasturage or of timber-taking,
    also in the remaining lordly territory.


    §. VII. The twenty Hufen acquired shall be measured out to Wollenhaupt as soon as possible, and he
    binds himself, for so much as he shall receive sown in winter and summer field, to pay the contribution
    for the seed-corn in cash to the ground lordship at the price current at the St John''s market in
    Zagorowo.


    §. VIII. Besides the cash hereditary quit-rent the hereditary lessee obliges himself, for himself
    and his descendants in possession of these twenty Hufen, to discharge all and every royal tax, likewise
    the competency for the monastery of Ląd and the dues to'
- page: 7
  en: 'to the clergy, chimney-sweeping money, delivery of forage, and whatever else may arise, without
    any exception, without making or obtaining any remission of the hereditary quit-rent on that account.


    §. IX. The hereditary lessee must take his beverages of beer and brandy from the lordly tavern or
    brew and distilling house, and in cases of contravention must pay to the ground lordship as a penalty
    one Rthaler for every Garnez of foreign brandy brought in, and five Rthaler for every barrel of foreign
    beer.


    §. X. The hereditary lessee and his successors in possession are subject to the jurisdiction of the
    Dominium here, yet are wholly and for everlasting'
- page: 8
  en: 'times freed from all and every delivery in kind and [uncertain: manorial] services.


    §. XI. The hereditary lessee and his successors in possession are at liberty to alienate these acquired


    20 Hufen to others by sale or exchange, yet such must be done with the consent of the ground lordship,
    and at every such change of possession the tenth Groschen of the purchase money or of the exchange
    amount shall be paid over to the ground lordship as a Laudemium. Upon inheritance to children and
    collateral relations, on the other hand, no Laudemium is paid, and likewise the first takers at the
    dismemberment are also [exempt], but by no means exempt upon further sale hereafter.


    §. XII. The hereditary lessee renounces, for himself and his successors in possession, all and every
    remission in cases of misfortune'
- page: 9
  en: 'which arise through fire from heaven, through the [uncertain: setting on] by evil people, crop
    failure, hailstorm, inundation, cattle plague, war and pestilence, or in any other manner whatsoever,
    and no compensation from the ground lordship nor remission of the hereditary quit-rent shall on that
    account accrue to them.


    §. XIII. The costs of this contract and of its engrossment the hereditary lessee pays.


    §. XIV. So long as the hereditary lessee and his successors in possession shall fulfil all the above
    obligations, the ground lordship promises to protect them everywhere in their rights and to answer
    for any man''s real claims.


    Should, however, the hereditary lessee and his successors lay this holding waste, or'
- page: 10
  en: 'remain in arrears with the yearly hereditary quit-rent for longer than two years, then this hereditary-lease
    contract ceases and the ground lordship shall be entitled to put out this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal subterfuges available against it, especially the objection of cunning persuasion,
    of over-hastiness, of an occurring lesion above or below the half, of matters agreed otherwise than
    as written down; and they have been duly instructed in this renunciation on the part of the court.
    His Most Serene Highness expressly consents thereto, that the hereditary lessee may, upon'
- page: 11
  en: 'the ground of this contract, have the title of possession of these acquired 20 Hufen entered in
    his own name.


    Further the contracting parties had nothing to adduce, and after this protocol had been read over
    to them word for word, they approved the same throughout and subscribed it below in their own hands.


    Peter Friedrich August v. Triebenfeld.


    F. W. Wollenhaupt, approved and read.


    a u s


    Schenck


    Brauer


    Actum Trąbczyn, the 25th of August 1805.


    Before the undersigned there appeared


    1. Herr Councillor of War and'
- page: 12
  en: 'Forests von Triebenfeld, as the known general Mandatarius of His Serene Highness the reigning Prince
    of Hohenlohe-Ingelfingen,


    2. the Building Inspector Johann Wilhelm Wollenhaupt. Both Herren comparents declare that, on account
    of a change of circumstances that has supervened, they hereby annul the foregoing contract and wish
    to renounce and abjure all the [uncertain: rights] and obligations contained therein, wholly and without
    reservation; which renunciation was then also mutually accepted and taken up.


    On the ground of this complete annulment and nullification of this contract, the Herr Councillor of
    War and Forests paid to Herr'
- page: 13
  en: Building Inspector Wollenhaupt the sum of six hundred Rthaler in Prussian Courant, which he received,
    gave receipt for the same without reservation, and thereupon declared that he is fully satisfied by
    this sum in respect of all his demands arising from his administration of office, ad ministration,
    and generally in respect of all business conducted up to the present day for His Most Serene Highness,
    and that he therefore wishes hereby to give a general and special receipt, with abandonment of all
    further claim; which declaration is best accepted by Herr von Triebenfeld in the name of his princely
    lord and mandant. Since
- page: 14
  en: 'Since the Herr Building Inspector Wollenhaupt inhabits the dwelling house on the demesne farm Drzewce
    with his family, but this building is destined for the future [uncertain: dwelling] of the present
    demesne-farm lessees Tietz and Schatzmann, Herr Wollenhaupt promises to vacate this dwelling house
    by Michaelmas cur. at the latest, and also to come to terms about it with the said lessees until then
    in every manner possible to him.


    Against the lessees he reserves to himself a melioration applied to the buildings of


    43 rttl 1 Silber-gr, and the compensation for the laying out of a garden. The comparents have, [text
    lost]'
- page: 15
  en: 'subscribed the foregoing protocol facta prael. et ratibus in their own hands. Read and approved.


    v. Triebenfeld    Johann Willhelm Wollenhaupt


    D. Grattenauer qu. testis


    a u s


    Schenck


    This transaction is therefore hereby engrossed in forma probante, under the impression of the court
    seal and the customary signature. Marianton, the 18th of January 1806. Princely Hohenlohe Patrimonial
    Court. Schenck


    Engrossment of the settlement between His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen
    and the Building Inspector Wollenhaupt. Nro 286'

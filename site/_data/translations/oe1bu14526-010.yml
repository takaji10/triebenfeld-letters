status: draft
segments:
- page: 1
  en: 'The Princely Hohenlohe Court Office at Trąbczyn hereby gives notice that before it, between His
    Serene Highness the reigning Lord Prince zu Hohenlohe, through his general Bevollmächtigter (authorised
    representative), the Councillor of War and Forests von Triebenfeld, of the one part, and the Building
    Inspector Wollenhaupt of the other part, the following contract and respective granting of receipt
    has been declared and recorded.


    Actum Trąbczyn, the 11th of May 1805.


    Before the undersigned Patrimonial Court there appeared


    1. The Councillor of War and Forests von Triebenfeld as the known General Bevollmächtigter (authorised
    representative) of His Serene Highness the reigning Lord Prince zu Hohenlohe Ingelfingen, hereditary
    lord and lord of jurisdiction of the estates here, of the one part, and


    2. the Building Inspector Herr Johann'
- page: 2
  en: 'Willhelm Wollenhaupt of the other part. The comparents are personally known to the subscripti and
    are subject to no doubt as to their capacity to execute judicial acts. They declare, freely and after
    due deliberation, the following hereditary quit-rent contract concluded between them, irrevocable
    and in nothing to be altered, for the protocol.


    § I. His Most Serene Highness namely grants in hereditary quit-rent, out of the demesne farm Drzewce,


    18 Hufe, in words eighteen Hufe, of clean arable land, and at Wrąbczyn


    2 Hufe, in words two Hufe, of Magdeburg meadows, thus together 20 Hufe, in words twenty Hufe Magdeburg
    measure, to the Building Inspector Johann Willhelm'
- page: 3
  en: 'Wollenhaupt, from now on for everlasting time, in hereditary quit-rent; and there are herewith
    at the same time also transferred into his property


    1. the dwelling house and


    2. the brewhouse at Drzewce.


    § II. The said Wollenhaupt pays as purchase money for the twenty Hufe received in grant, per Hufe
    300 rt, in words three hundred Rthaler, making in all 6000 rt, in words six thousand Rthaler, in cash
    and in good Prussian Courant of treasury standard.


    The buildings mentioned in § 1 Wollenhaupt receives free of charge, and their value is already comprehended
    within the purchase.


    § III. On account of the purchase money there have already been paid 400 rttl,'
- page: 4
  en: 'in words four hundred Rthaler, in cash, for which receipt is hereby given. At Johanni of the present
    year 3000 rttl, in words three thousand Rthaler, and the remainder of 2600 rtl, in words two thousand
    six hundred Rthaler, at Christmas of this year, shall be discharged in cash and in Courant.


    § IV. The hereditary lessee binds himself, for these twenty Hufe acquired, from Johanny of this year
    onward, to a perpetual hereditary quit-rent, which may never be raised or diminished, per Hufe Magdeburg
    measure of 15 rttl, in words fifteen Rthaler, hence for 20 Hufe 300 rtl, in words three hundred Rthaler,
    in Courant in cash, and this yearly in two'
- page: 5
  en: 'instalments, at Christmas and at Johannis, each time of


    150 rttr, in words one hundred and fifty Rthaler, yet not in advance but after the expiry of each
    half year, and consequently to be paid for the first time at Christmas.


    § V. The said Wollenhaupt undertakes the obligation to dismember these twenty Hufe acquired into ten
    separate peasant holdings, yet in such manner that none of them shall amount to less than one Hufe
    Magdeburg measure.


    § VI. The establishments (Etablissiments) the hereditary lessee and the other takers must effect at
    their own cost, without any timber or other building assistance being given thereto by the ground
    lordship, either now or in future.'
- page: 6
  en: 'Likewise neither they nor the present acquirer receive any right of pasturage or of wooding, also
    in the remaining seignorial territory.


    § VII. The twenty Hufe acquired shall be measured out to Wollenhaupt as soon as possible, and he binds
    himself, for so much as he shall receive sown in winter and summer field, to pay the contribution
    for the seed-corn in cash to the ground lordship at the price current at the Johanny market in Zagorowo.


    § VIII. Besides the cash hereditary quit-rent, the hereditary lessee obliges himself, for himself
    and his descendants in possession of these twenty Hufe, to settle all and every royal tax, as also
    the competency for the monastery of Ląd and the dues to'
- page: 7
  en: 'to the clergy, chimney-money, forage delivery and whatever else may occur, without any exception
    whatsoever, without making or obtaining any remission of the hereditary quit-rent on that account.


    § IX. The hereditary lessee must take his drink, in beer and brandy, from the seignorial tavern or
    brew- and distilling-house, and in cases of contravention shall pay to the ground lordship as penalty
    one Rthaler for every Garnez of foreign brandy brought in, and five Rthaler for every barrel of foreign
    beer.


    § X. The hereditary lessee and his successors in possession are subject to the jurisdiction of the
    dominium here, yet are wholly and for everlasting'
- page: 8
  en: 'time exempt from all and every delivery in kind and manorial labour service.


    § XI. It is free to the hereditary lessee and his successors in possession to alienate these


    20 Hufe acquired to others by sale or exchange, yet such must be done with the consent of the ground
    lordship, and upon every such change of possession the tenth Groschen of the purchase money or of
    the exchange quantum shall be paid to the ground lordship as a Laudemium. Upon inheritance to children
    and collateral kin, on the other hand, no Laudemium is paid, and likewise the first takers at the
    dismemberment are also [uncertain: exempt], but by no means exempt upon further sale onward.


    § XII. The hereditary lessee renounces, for himself and his successors in possession, all and every
    remission in cases of misfortune'
- page: 9
  en: 'which arise through fire from heaven, through the [uncertain: setting-on] of evil people, crop
    failure, hailstorm, inundation, cattle plague, war and pestilence, or in any other way whatsoever,
    and on that account no compensation from the ground lordship nor remission of the hereditary quit-rent
    shall ever accrue to them.


    § XIII. The costs of this contract and of its engrossment the hereditary lessee pays.


    § XIV. So long as the hereditary lessee and his successors in possession shall fulfil all the above
    obligations, the ground lordship promises to protect them in their rights everywhere and to defend
    them against every man''s real claims.


    Should, however, the hereditary lessee and his successors lay this holding waste, or'
- page: 10
  en: 'remain in arrears with the yearly hereditary quit-rent for longer than two years, then this hereditary-lease
    contract ceases and the ground lordship shall be entitled to let out this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal evasions available against it, in particular the objection of cunning persuasion,
    of over-hastiness, of an injury sustained above or below the half, of matters otherwise agreed than
    written down; and they have been duly instructed in this renunciation by the court. His Most Serene
    Highness expressly consents that the hereditary lessee may, upon'
- page: 11
  en: 'the ground of this contract, have the title of possession of these 20 Hufe acquired entered in
    his own name.


    Further the contracting parties had nothing to adduce, and after this protocol had been read to them
    word for word, they approved the same throughout and subscribed it below with their own hands.


    Peter Friedrich August v. Triebenfeld.


    F. W. Wollenhaupt, approved and read.


    a u s


    Schenck


    Brauer  Actum Trąbczyn, the 25th of August 1805.


    Before the undersigned there appeared


    1. the Councillor of War and'
- page: 12
  en: 'Forests von Triebenfeld as the known General Mandatorius of His Serene Highness the reigning Prince
    von Hohenlohe Ingelfingen,


    2. the Building Inspector Johann Wilhelm Wollenhaupt. Both Herren comparents declare that, by reason
    of a change of circumstances that has intervened, they herewith annul the foregoing contract, and
    wished to renounce and give up all rights and obligations contained therein, wholly and without reservation;
    which renunciation was then also mutually accepted and received.


    Upon the ground of this complete annulment and voiding of this contract, the Councillor of War and
    Forests paid to Herr'
- page: 13
  en: Building Inspector Wollenhaupt the sum of six hundred Rthaler in Prussian Courant, which he received,
    gave receipt for the same without reservation, and declared thereby that he was fully satisfied by
    this sum in respect of all his demands arising out of his conduct of office, his administration, and
    generally in respect of all business conducted for His Most Serene Highness down to the present day,
    and that he therefore wished herewith to grant a general and special receipt, with abandonment of
    all further demand; which declaration is accepted in the best form by Herr von Triebenfeld in the
    name of his princely Lord and mandator. Since
- page: 14
  en: 'Since the Herr Building Inspector Wollenhaupt inhabits the dwelling house on the demesne farm Drzewce
    with his family, but this building is designated as the future dwelling of the present demesne-farm
    lessees Tietz and Schatzmann, Herr Wollenhaupt promises to vacate this dwelling house by Michaelis
    cur. at the latest, and also until then to come to terms about it with the said lessees in every manner
    possible to him.


    Against the lessees he reserves to himself an amelioration expended upon the buildings of


    43 rttl 1 Silber-gr, and the compensation for the laying out of a garden. The comparents have'
- page: 15
  en: 'subscribed the foregoing protocol facta prael. et ratibus with their own hands. Read and approved.


    v. Triebenfeld    Johann Willhelm Wollenhaupt


    D. Grattenauer qu. testis


    a u s


    Schenck    This transaction is accordingly herewith engrossed in forma probante, under impression
    of the court seal and the customary signature. Marianton, the 18th of January 1806. Princely Hohenlohe
    Patrimonial Court. Schenck


    Engrossment of the agreement between His Serene Highness the reigning Lord Prince zu Hohenlohe Ingelfingen
    and the Building Inspector Wollenhaupt. Nro 286'

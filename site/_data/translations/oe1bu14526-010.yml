- page: 1
  en: 'The Princely Hohenlohe Court Office at Trąbczyn hereby makes known that before it, between His
    Serene Highness the reigning Prince of Hohenlohe, through his general attorney, the councillor of
    war and Councillor of War and Forests von Triebenfeld, on the one part, and the building inspector
    Wollenhaupt on the other part, the following contract and respectively the giving of a receipt has
    been declared.


    Actum Trąbczyn, the 11th of May 1805.


    Before the undersigned patrimonial court there appeared


    1. the councillor of war and Councillor of War and Forests von Triebenfeld, as the known general attorney
    of His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the
    court of the estates here, on the one part, and


    2. the building inspector Mr Johann'

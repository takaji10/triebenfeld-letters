- page: 12
  en: 'Councillor of War and Forests von Triebenfeld, as the known general mandatory of His Serene Highness
    the reigning Prince of Hohenlohe-Ingelfingen,


    2. the building inspector Johann Wilhelm Wollenhaupt. Both the appearing gentlemen declare that, on
    account of a change of circumstances having intervened, they hereby annul the foregoing contract,
    and wish to renounce and disclaim all rights and obligations contained therein, wholly and without
    reservation, which renunciation was then also mutually accepted and received.


    On the ground of this complete annulment and nullification of this contract, the councillor of war
    and Councillor of War and Forests paid to Mr'

  - '20.'
- page: 3
  en: 'Wollenhaupt, from now on for everlasting time in hereditary quit-rent, and there are herewith at
    the same time also


    1. the dwelling house and


    2. the brewhouse in Drzewce transferred to him in ownership.


    §. II. The said Wollenhaupt pays as purchase money for the twenty Hufen received in grant, per Hufe
    300 Rthl, written out three hundred Rthl, amounting in all to 6000 Rthl, written out six thousand
    Rthl, in cash and in good Prussian Courant of treasury standard.


    The buildings mentioned in §. 1 Wollenhaupt receives without payment, and their value is already comprehended
    within the purchase.


    §. III. On account of the purchase money there have already been paid 400 Rthl,'
  names:
  - de: Wollenhaupt
    en: Wollenhaupt
    kind: person
  - de: Drzewce
    en: Drzewce
    kind: place
  numbers:
  - '1.'
  - '2.'
  - '300'
  - '6000'
  - '400'
- page: 4
  en: 'written out four hundred Rthl, in cash, for which receipt is hereby given. At Midsummer of the
    present year 3000 Rthl, written out three thousand Rthl, and the remainder of 2600 Rthl, written out
    two thousand six hundred Rthl, at Christmas of this year, shall be delivered in cash and in Courant.


    §. IV. The hereditary leaseholder binds himself, for these acquired twenty Hufen, from Midsummer of
    this year onward, to a perpetual hereditary quit-rent which may never be raised or lowered, per Hufe
    Magdeburg measure of 15 Rthl, written out fifteen Rthl, and thus for 20 Hufen 300 Rthl, written out
    three hundred Rthl, in Courant in cash, and this yearly in two'
  numbers:
  - '3000'
  - '2600'
  - '15'
  - '20.'
  - '300'
- page: 5
  en: 'instalments, at Christmas and at Midsummer, each time of


    150 Rthl, written out one hundred and fifty Rthl, yet not in advance but after the lapse of each half
    year, and consequently to be paid for the first time at Christmas.


    §. V. The said Wollenhaupt undertakes the obligation to dismember these acquired twenty Hufen into
    ten separate peasant holdings, yet in such a manner that none of them shall amount to less than one
    Hufe Magdeburg measure.


    §. VI. The establishments the hereditary leaseholder and the other takers must effect at their own
    cost, without any timber or other building assistance being given thereto by the ground lordship,
    either now or in future.'
  names:
  - de: Wollenhaupt
    en: Wollenhaupt
    kind: person
  numbers:
  - '150.'
- page: 6
  en: 'Likewise neither they nor the present acquirer receive any right of pasturage or of timber-cutting
    on the remaining seigneurial territory.


    §. VII. The twenty Hufen acquired shall be measured out to Wollenhaupt as soon as possible, and he
    binds himself to pay in cash to the ground lordship, for as much of the winter and summer field as
    he shall receive already sown, the contribution for the seed corn according to the price current at
    the Midsummer market in Zagorowo.


    §. VIII. Besides the hereditary quit-rent in cash, the hereditary leaseholder obliges himself, for
    himself and his descendants in possession of these twenty Hufen, to discharge all and every royal
    tax, as also the dues to the monastery of Ląd and the charges to'
  names:
  - de: Wollenhaupt
    en: Wollenhaupt
    kind: person
  - de: Zagorowo
    en: Zagorowo
    kind: place
  - de: Kloster Ląd
    en: monastery of Ląd
    kind: place
- page: 7
  en: 'to the clergy, chimney money, delivery of forage, and whatever else may arise, without any exception
    whatsoever, without making or obtaining any remission of the hereditary quit-rent on that account.


    §. IX. The hereditary leaseholder must take his drink, in beer and brandy, from the seigneurial tavern
    or brew- and distilling-house, and in cases of contravention must pay to the ground lordship a penalty
    of one Rthl for every garniec of foreign brandy brought in and five Rthl for every barrel of foreign
    beer.


    §. X. The hereditary leaseholder and his successors in possession are subject to the jurisdiction
    of the manorial lordship (Dominium) here, yet are entirely and for everlasting'
- page: 8
  en: 'time exempted from all and every delivery in kind and manorial labour service.


    §. XI. The hereditary leaseholder and his successors in possession are at liberty to alienate these
    acquired 20 Hufen to others by sale or by exchange, yet such must be done with the consent of the
    ground lordship, and at every such change of possession the tenth Groschen of the purchase money or
    of the amount exchanged shall be rendered to the ground lordship as a transfer fee (Laudemium). Upon
    inheritance by children and collateral relatives, on the contrary, no transfer fee is paid, and likewise
    the first takers at the dismemberment are also exempt, but in no wise upon any further sale thereafter.


    §. XII. The hereditary leaseholder, for himself and his successors in possession, renounces all and
    every remission in cases of misfortune'
  numbers:
  - '20.'
- page: 9
  en: 'which arise through fire from heaven, through the instigation of evil persons, crop failure, hailstorm,
    inundation, cattle plague, war and pestilence, or in any other manner whatsoever, and on that account
    no indemnity from the ground lordship nor any remission of the hereditary quit-rent shall ever accrue
    to them.


    §. XIII. The costs of this contract and of its engrossment the hereditary leaseholder pays.


    §. XIV. So long as the hereditary leaseholder and his successors in possession shall fulfil all the
    above obligations, the ground lordship promises to protect them everywhere in their rights and to
    answer for all real claims of any person.


    Should, however, the hereditary leaseholder and his successors lay this holding waste, or'
- page: 10
  en: 'remain in arrears with the annual hereditary quit-rent for longer than two years, then this hereditary
    lease contract ceases and the ground lordship shall be entitled to dispose of this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal evasions that might be raised against it, in particular the objection of cunning
    persuasion, of precipitancy, of an injury suffered above or below the half, and of matters agreed
    otherwise than as written down; and they have been duly instructed in this renunciation by the court.
    His Most Serene Highness expressly consents that the hereditary leaseholder may, on'
- page: 11
  en: 'the ground of this contract, have the title of possession of these acquired 20 Hufen entered in
    his own name.


    Further the contracting parties had nothing to adduce, and after this protocol had been read out to
    them word for word, they approved it throughout and signed it below in their own hand.


    Peter Friedrich August von Triebenfeld.


    F. W. Wollenhaupt, approved and read.


    a u s


    Schenck


    Brauer. Actum Trąbczyn, the 25th of August 1805.


    Before the undersigned there appeared



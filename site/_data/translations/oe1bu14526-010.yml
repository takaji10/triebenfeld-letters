    en: Johann Wilhelm
    kind: person
  numbers:
  - I.
  - '18.'
  - '2.'
  - '20.'
- page: 3
  en: 'Wollenhaupt, from now on for perpetual times in hereditary quit-rent, and there are at the same
    time herewith also


    1. the dwelling house and


    2. the brewhouse in Drzewce transferred to him in property.


    §. II. The said Wollenhaupt pays as purchase money for the twenty Hufen granted to him, per Hufe 300
    Rthl, in words three hundred Reichsthaler, making in all 6000 Rthl, in words six thousand Reichsthaler,
    in cash and in good Prussian treasury-standard Courant.


    The buildings mentioned in §. 1 Wollenhaupt receives free of charge, and their value is already comprehended
    within the purchase.


    §. III. On account of the purchase money there have already been paid 400 Rthl,'

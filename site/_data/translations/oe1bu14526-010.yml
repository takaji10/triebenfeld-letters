- page: 2
  en: 'Wilhelm Wollenhaupt on the other part. The parties appearing are personally known to the undersigned
    and are subject to no doubt as to their capacity to execute judicial acts. They declare, freely and
    after due deliberation, to the protocol the following hereditary quit-rent contract concluded between
    them, irrevocable and in no point to be altered.


    §. I. His Most Serene Highness grants, namely, from the demesne farm Drzewce


    18 Hufen, written out eighteen Hufen, of clear arable land, and at Wrąbczyn


    2 Hufen, written out two Hufen, of Magdeburg meadows, together therefore 20 Hufen, written out twenty
    Hufen Magdeburg measure, to the building inspector Johann Wilhelm'
  names:
  - de: Willhelm Wollenhaupt
    en: Wilhelm Wollenhaupt
    kind: person
  - de: Drzewce
    en: Drzewce
    kind: place
  - de: Wrąbczyn
    en: Wrąbczyn
    kind: place
  - de: Johann Willhelm
    en: Johann Wilhelm
    kind: person
  numbers:

- page: 12
  en: 'Forests von Triebenfeld, as the known general mandatary of His Serene Highness the reigning Prince
    of Hohenlohe-Ingelfingen,


    2. the building inspector Johann Wilhelm Wollenhaupt. Both gentlemen appearing declare that, on account
    of a change of circumstances that has intervened, they hereby annul the foregoing contract and wish
    to renounce and forgo all rights and obligations contained therein, wholly and without reservation;
    which renunciation was then also mutually accepted and received.


    On the ground of this complete annulment and nullification of this contract, the Councillor of War
    and Forests paid to the'

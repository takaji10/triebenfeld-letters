- page: 14
  en: 'Since the building inspector Wollenhaupt inhabits the dwelling house on the demesne farm Drzewce
    with his family, but this building is designated as the future dwelling of the present demesne farm
    lessees Tietz and Schatzmann, Mr. Wollenhaupt promises to vacate this dwelling house by Michaelmas
    of the current year at the latest, and until then also to come to terms about it with the said lessees
    in every way possible to him.


    Against the lessees he reserves to himself an improvement expended upon the buildings of


    43 Rthl 1 silver Groschen, and the compensation for the laying out of a garden. The parties appearing
    have'

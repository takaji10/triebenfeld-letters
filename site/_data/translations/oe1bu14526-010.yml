- page: 4
  en: 'in words four hundred Reichsthaler, in cash, for which receipt is hereby given. At Midsummer of
    the present year 3000 Rthl, in words three thousand Reichsthaler, and the remainder with 2600 Rthl,
    in words two thousand six hundred Reichsthaler, at Christmas of this year, will be paid over in cash
    and in Courant.


    §. IV. The hereditary lessee binds himself, for these twenty Hufen acquired, from Midsummer of this
    year onward, to a perpetual hereditary quit-rent, which may never be raised or reduced, per Hufe Magdeburg
    measure of 15 Rthl, in words fifteen Reichsthaler, thus for 20 Hufen 300 Rthl, in words three hundred
    Reichsthaler, in Courant cash, and that yearly in two'
  numbers:
  - '3000'
  - '2600'
  - IV.
  - '15'
  - '20.'
  - '300'
- page: 5
  en: 'instalments, at Christmas and at Midsummer, each time with


    150 Rthl, in words one hundred and fifty Reichsthaler, yet not in advance but after the elapsing of
    each half year, and consequently to be paid at Christmas for the first time.


    §. V. The said Wollenhaupt undertakes the obligation to dismember these twenty Hufen acquired into
    ten separate peasant holdings, yet in such manner that none of them shall amount to less than one
    Hufe Magdeburg measure.


    §. VI. The establishments the hereditary lessee and the other takers must effect at their own cost,
    without any timber or other building assistance being given thereto by the manorial lordship, now
    or in the future.'
  names:
  - de: Wollenhaupt
    en: Wollenhaupt
    kind: person
  numbers:
  - '150.'
  - V.
  - VI.
- page: 6
  en: 'Likewise neither they nor the present acquirer receive any right of pasturage or of timber-taking
    on the remaining territory of the lordship.


    §. VII. The twenty Hufen acquired shall be measured out to Wollenhaupt as soon as possible, and he
    binds himself, for as much as he shall take over sown in winter and summer field, to pay the contribution
    for the seed-corn in cash to the manorial lordship at the price current at the Midsummer market in
    Zagorowo.


    §. VIII. Besides the cash hereditary quit-rent the hereditary lessee obliges himself, for himself
    and his successors in possession of these twenty Hufen, to discharge all and every royal tax, as also
    the dues for the monastery of Ląd and the levies to'
  names:
  - de: Wollen haupt
    en: Wollenhaupt
    kind: person
  - de: Zagorowo
    en: Zagorowo
    kind: place
  - de: Kloster Ląd
    en: monastery of Ląd
    kind: place
  numbers:
  - VII.
  - VIII.
- page: 7
  en: 'to the clergy, chimney money, forage deliveries and whatever else may occur, without any exception,
    without making or obtaining any remission of the hereditary quit-rent on that account.


    §. IX. The hereditary lessee must take his drink in beer and brandy from the lordship''s tavern or
    brew- and distilling-house, and in cases of contravention must pay to the manorial lordship as penalty
    one Reichsthaler for every garniec of foreign brandy brought in and five Reichsthaler for every barrel
    of foreign beer.


    §. X. The hereditary lessee and his successors in possession are subject to the jurisdiction of the
    manorial lordship (Dominium) here, yet are wholly and for perpetual'
  numbers:
  - IX.
  - X.
- page: 8
  en: 'times free of all and every delivery in kind and manorial labour service.


    §. XI. The hereditary lessee and his successors in possession are at liberty to alienate these 20
    Hufen acquired to others by sale or exchange, yet such must be done with the consent of the manorial
    lordship, and upon every such change of possession the tenth Groschen of the purchase money or of
    the amount exchanged is to be paid to the manorial lordship as a transfer fee (Laudemium). Upon inheritance
    to children and collateral relatives, on the other hand, no transfer fee is paid, and likewise the
    first takers at the dismemberment are also exempt, but by no means upon any further sale onward.


    §. XII. The hereditary lessee, for himself and his successors in possession, renounces all and every
    remission in cases of misfortune'
  numbers:
  - XI.
  - '20.'
  - XII.
- page: 9
  en: 'which arise through fire from heaven, through the instigation of evil people, crop failure, hail,
    inundation, cattle plague, war and pestilence, or in any other way whatsoever, entirely and utterly,
    and on that account no indemnification from the manorial lordship nor remission of the hereditary
    quit-rent shall ever accrue to them.


    §. XIII. The costs of this contract and of its official copy the hereditary lessee pays.


    §. XIV. So long as the hereditary lessee and his successors in possession shall fulfil all the above
    obligations, the manorial lordship promises to protect them in their rights everywhere and to answer
    for all real claims of any person.


    Should, however, the hereditary lessee and his successors lay this holding waste or'
  numbers:
  - XIII.
  - XIV.
- page: 10
  en: 'remain in arrears with the annual hereditary quit-rent for longer than two years, then this hereditary
    lease contract ceases and the manorial lordship shall be entitled to let out this holding elsewhere.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal evasions available against it, particularly the objection of cunning persuasion,
    of precipitancy, of an injury incurred above or below the half, of matters agreed otherwise than as
    set down in writing, and they have been duly instructed in this renunciation on the part of the court.
    His Most Serene Highness expressly consents that the hereditary lessee, on'
- page: 11
  en: 'the ground of this contract, may have the title of possession of these 20 Hufen acquired entered
    in his own name.


    Further the contracting parties had nothing to adduce, and after this protocol had been read over
    to them word for word, they approved it throughout and subscribed it below in their own hands.


    Peter Friedrich August von Triebenfeld.


    F. W. Wollenhaupt, approved and read.


    a u s


    Schenck


    Brauer Actum Trąbczyn, the 25th of August 1805.



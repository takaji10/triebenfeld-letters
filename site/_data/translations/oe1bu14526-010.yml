- page: 13
  en: building inspector Wollenhaupt the sum of six hundred Reichsthaler in Prussian Courant, which he
    received, gave receipt for without reservation, and thereupon declared that by this sum he is fully
    satisfied in respect of all his demands arising out of his conduct of office, his administration,
    and generally in respect of all business conducted for His Most Serene Highness up to the present
    day, and that he therefore wishes hereby to give a general and special receipt, with surrender of
    all further demand, which declaration is fully accepted by Mr von Triebenfeld in the name of his princely
    lord and mandator. Since

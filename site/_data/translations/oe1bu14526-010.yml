- page: 13
  en: building inspector Wollenhaupt the sum of six hundred Rthl in Prussian Courant, which he received,
    gave receipt for without reservation, and thereupon declared that by this sum he was fully satisfied
    in respect of all his demands arising from his conduct of office, administration, and generally in
    respect of all business conducted for His Most Serene Highness up to the present day, and that he
    therefore wished hereby to give a general and special receipt, with surrender of all further claim;
    which declaration is accepted in the best form by Mr. von Triebenfeld in the name of his princely
    lord and principal. Since

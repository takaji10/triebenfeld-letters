status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Your Serene Highness''s most gracious letter
    of the 24th I received today, just as I was on the point of writing to Your Most Exalted Self. I wished
    only most humbly to report to Your Most Serene Highness that I cannot yet depart from here, inasmuch
    as Coste has not come. I have, it is true, leased out [uncertain: köntig], but not yet Schweinere,
    and as regards the Berlin affair I am not clear in my own mind, for this is a wound struck with a
    blunt iron which breaks open again and again, and which will yet cost me my life. — Meanwhile God
    must help, let it last now as long as it will. Next to this, the Polish business now holds me fettered
    here. Henrichs was here, as I lately reported to Your Most Serene Highness; what he proposed I have
    most obediently forwarded to Your Most Exalted Self. — After his departure I received a letter from
    Hawich, who informs me that Henrichs is an arch-swindler. Although this must first be proved, I have
    nonetheless at once summoned Henrichs and Hawich here, in order to investigate the matter'
- page: 2
  en: '— and I also intend, when the L: are here, to send the Actuarius from here, who [is] German [and]
    a Polish [uncertain: Bau], to Zagorowo, so that there he may call all the people together and investigate
    exactly what Honrichs, or anyone else, has taken from the subjects and lease-holders. Honrichs and
    everyone must then give account of where the monies have been applied, and there the fraud must show
    itself. I cannot with all right believe this, since the sequestration, according to the decrees found
    enclosed, has been lifted and only an overseer has been appointed, so that no money may be taken away
    there. Under these dispositions Honrichs surely may take nothing; it must yet come to light who has
    drawn monies and to what he has applied them. Your Serene Highness has received nothing, and I have
    not either. Whatever there is in the matter shall and must come out; still I do not believe Hainrich''s
    reports, for more than 12 deputations from the communes have been here and have constantly begged
    for a term of payment. From these people I have always heard it myself, that they could not pay at
    present. Be it however as it may, the matter must come to light. This much moreover is quite certain,
    that neither Henrici nor anyone else has acted [uncertain: trom — possibly "against", possibly "according
    to"] the instructions and powers of attorney which I always gave. Henrichs alone has frankly protested
    against the conduct of the Sambstia and the clergy there, so that no matter could ever become legally
    binding whereby Your Serene Highness''s entitlements were secured. As I believe, the gentlemen have
    all defrauded [us]: Hawich, Honrichs and Heckert have appropriated Hufen to themselves and built upon
    them'
- page: 3
  en: '— fortunately, however, this is unlawful and [uncertain: approved] by me; one can here chastise
    and let go. The holdings, too, are so handsomely laid out that each is worth several thousand Rthl.
    — If the gentlemen had defrauded, there is something to hold on to. When this is finished, and I am
    clear here with the Widows'' Fund concerning my own affairs, then I shall come to lay myself at Your
    Serene Highness''s feet. Just now Grevenitz writes from Berlin that Gen. v. Köckritz has said much
    that is laudable and good of Your Serene Highness. — God grant that in this year now begun everything
    may go according to Your Serene Highness''s wish, wherein Your Most Exalted Self may be compelled
    to learn to forget all your sufferings. I was written that General L. v. Köckritz would retire, and
    that General Kleist would [take] his post with the King; I have asked him myself about it, but have
    as yet received no answer. That the false Count Götz goes ad patres is well; I have learned wondrous
    things of the man. — Of the new organisations some hope much — I nothing; the money business will
    yet cause great terror. — Grevenitz writes that the general moratorium had been prolonged to Johanni
    1810, and it is said that by a more recent resolution it is to last until Johanni 1812. — This too
    I do not believe; against it B — and Lecht Meyer Wolff will contend. May Your Most Serene Highness
    yet deign most graciously to send me soon the freight, toll and weighing notes etc. for the iron,
    sent to you in May, so that I may convince the boatmen that I should have to pay here a second time;
    otherwise I shall not get the iron out. In deepest respect I remain, until death, Your Most Serene
    Highness''s humble and obedient servant. Kontop, 1 January 1840. Just at the [illegible] v Triebenfeld'
- page: 4
  en: '— moment at which I meant to dispatch this letter, I receive by an express the enclosed letter
    of Honrichs, which Your Most Serene Highness will deign to return to me together with the 3 resolutions.
    My messenger sent to Zagorowo is not yet back. — Hawich and Hecker must answer, or rather come — if
    they stay away, then I am convinced that they are liars. I shall seek to ascertain exactly what there
    is in the matter; in advance I am convinced that Hawich and Hecker are scoundrels, for how can the
    dear fellows say that the money has been carried out of the country? I have not seen a Groschen; nor
    can Honrichs take anything, because the people are forbidden to pay monies to Honrichs, and that this
    is welcome to the rent-paying folk one may believe without an oath. Honrichs at least does his duty,
    in that he lets the Polish dogs take nothing. I am already content that he obeys my orders and confronts
    the rabble there without fear, lets nothing be taken, and courageously [uncertain: protects] against
    everything. I shall learn everything from Brzechsta and Garczynski; if Hecker and Hawich have made
    false denunciations they shall be chastised, [and] Hecker shall never see anything again of his paper
    security. With the spirits and the iron much might be done; since nothing can be sold from Your Serene
    Highness''s foundry, I shall no doubt have to obtain iron elsewhere. — I must make the trial and see
    what comes of this [uncertain: Barotto Hamel].'

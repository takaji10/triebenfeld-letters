- page: 2
  en: 'and, when the [uncertain: L:] are here, I also intend to send the local court clerk, who is a German
    with Polish training, to Zagorowo, so that he may there call all the people together and investigate
    exactly what Honrichs, or anyone else, has taken from the subjects and tenants. Honrichs and every
    man must then show where the monies have been applied, and there the fraud must come to light. I cannot,
    with every right, believe this, since by the decrees found the sequestration has been lifted and only
    an overseer has been appointed, so that no money may be taken away there. Under these dispositions
    Honrichs surely may take nothing; it must surely come to light who drew monies and to what use he
    applied them. Your Serene Highness has received nothing, and I


    I have not either.


    What truth there is in the matter shall and must come out; still I do not believe Hainrich''s reports,
    for more than 12 deputations from the communities have been here and have constantly begged for time
    to pay. From these people I have always heard it myself, that they could not pay at present. Be it
    as it may, the matter must come to the light of day. So much, moreover, is quite certain, that neither
    Henrici nor anyone else has acted contrary to the instructions and powers of attorney which I always
    gave. Henrichs alone has frankly protested against the conduct of the Sambstia and of the clergy there,
    so that no matter could ever acquire legal force whereby Your Serene Highness''s rights would be secured.
    As I believe, the gentlemen have all cheated; for Hawich, Honrichs and Heckert have appropriated Hufen
    to themselves and built upon them'

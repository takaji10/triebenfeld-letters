- page: 4
  en: 'moment when I was about to dispatch this letter, I receive by an express the enclosed letter of
    Honrichs, which Your Most Serene Highness may deign to return to me together with the 3 resolutions.


    My messenger sent to Zagorowo has not yet returned — Hawich and Hecker must answer, or rather come
    — if they stay away, I am convinced that they are [uncertain: Lube]. I shall seek to ascertain exactly
    what truth there is in the matter; in advance I am convinced that Hawich and Hecker are scoundrels,
    for how can [uncertain: the Lieben] say that the money has been carried out of the country? I have
    not seen a Groschen of it; nor can Honrichs take anything, because the people are forbidden to pay
    any monies to Honrichs, and that this is welcome to the rent-paying people may be believed without
    an oath. Honrichs at least does his duty, in that he lets the Polish dogs take nothing. I am already
    content that he lives up to my orders and steps up to the rabble there without fear, lets nothing
    be taken, and boldly protects against everything.


    I shall learn everything from Brzechsta and Garczynski; if Hecker and Hawich have made false reports,
    they shall be chastised, and Hecker shall never see anything again of his paper security. Much might
    be done with the spirits and iron; since nothing can be sold from Your Serene Highness''s foundry,
    I shall doubtless obtain iron elsewhere — I must make the trial, and see what comes of this [uncertain:
    Barotto Hamel].'

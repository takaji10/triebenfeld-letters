- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Your Serene Highness''s most gracious letter of the 24th I received today, just as I was on the point
    of writing to Your Most Serene Self. I wished only to report most humbly to Your Most Serene Highness
    that I cannot yet depart from here, inasmuch as Coste has not come. I have indeed [uncertain: köntig],
    but have not yet leased out Schweinere, and with regard to the Berlin affair I am not clear in my
    own mind, for this is a wound struck with a blunt iron which keeps breaking open again, and which
    will yet cost me my life — Meanwhile God must help; let it now last as long as it will.


    Next to this, the Polish business holds me here now [uncertain: gefaßelt]. Henrichs was here, as I
    lately reported to Your Most Serene Highness; what he proposed I have most obediently forwarded to
    Your Most Serene Self — After his departure I received a letter from Hawich, who informs me


    that Honrichs is an arch-swindler.


    Although this must first be proved, I have nevertheless at once summoned Honrichs and Hawich here,
    in order to investigate the matter'

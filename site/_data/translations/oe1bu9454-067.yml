- page: 2
  en: 'to investigate; and I also intend, when the [uncertain: L:] are here, to send the actuary from
    here, who [text lost: der Teutsch ein pohleisch Bau], to Zagórów, so that he may there call together
    all the people and enquire precisely what Honrichs, or anyone else, has taken from the subjects and
    the tenants. Honrichs and every man must then show where the monies have been applied, and there the
    fraud must come to light — I cannot believe it, with full right, since the sequestration has been
    lifted according to the enclosed decrees and only an overseer has been appointed, so that no money
    may be taken away there. Under these dispositions Honrichs surely may take nothing; it must surely
    come to light who has drawn monies and where he has applied them. Your Serene Highness has received
    nothing, and neither have I.


    Whatever is in the matter shall and must come out; still, I do not believe Hawich''s reports, for
    more than 12 deputations from the communities have been here and have repeatedly begged for time to
    pay. From these people I have after all always heard it myself, that they could not pay at present.
    Be it, however, as it may, the matter must come to light — Moreover, this much is quite certain, that
    neither Hawich nor anyone else has acted [uncertain: trom] the instructions and powers of attorney
    which I always gave. Honrichs alone has candidly protested against the conduct of the Dąbska woman
    and of the [uncertain: Geisteren] there, so that no matter could ever acquire legal force whereby
    Your Serene Highness''s rights were secured. As I believe, the gentlemen have all defrauded, for Hawich,
    Honrichs and Hecker have appropriated Hufen to themselves and built upon them'

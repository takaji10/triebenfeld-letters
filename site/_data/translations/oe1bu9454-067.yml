- page: 3
  en: 'but fortunately this is unlawful and was never approved by me; here one may chastise and let go.
    The holdings are also so handsomely laid out that each is worth several thousand Rthl — If the gentlemen
    had cheated, there is something to hold on to.


    When this is finished, and I am clear here with the Widows'' Fund concerning my own affairs, then
    I shall come to lay myself at Your Serene Highness''s feet.


    Grevenitz writes just now from Berlin that Lieutenant-General von Köckritz has said a great deal that
    is [uncertain: Mühliches] and good of Your Serene Highness — God grant that in this year now begun
    everything may go according to Your Serene Highness''s wish, where Your Most Serene Self are compelled
    to learn to forget all your sufferings.


    I was written that Lieutenant-General von Köckritz would retire, and that General Kleist would take
    his post with the King; I have now asked him myself about it but have as yet received no answer.


    That the false Count Götz is going ad Patrim is good; I have learned wondrous things of the man —
    From the new organisations some hope much — I nothing; the money business will yet cause great terror
    — Grevenitz writes that the general moratorium had been extended to Midsummer 1810, and it is said
    that by a more recent resolution it is to last until Midsummer 1812 — This too I do not believe; against
    it B — and Lecht Meyer Wolff will contend.


    May Your Most Serene Highness deign most graciously to send me as soon as possible the freight, toll
    and weighing dockets etc. for the iron, sent to you in May, so that I may convince the boatman that
    I should have to pay here a second time; otherwise I shall not get the iron out. In deepest reverence
    I remain, until death, Your Most Serene Highness''s humble and obedient servant. Kontop


    1 January 1840. Just at this [uncertain: moment] v. Triebenfeld'

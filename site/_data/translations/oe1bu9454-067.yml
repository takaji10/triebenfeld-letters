- page: 3
  en: 'but fortunately this is unlawful and [uncertain: ein Approbirt] by me; here one may chastise and
    let go. The places, moreover, are so handsomely laid out that each is worth several thousand Rthl
    — Had the gentlemen defrauded, there is something to hold on to.


    When this is finished, and I am clear here with the Widows'' Fund concerning my own affairs, then
    I shall come to lay myself at Your Serene Highness''s feet.


    Grevenitz writes just now from Berlin that General von Köckritz has said much that is [uncertain:
    Mühliches] and good of Your Serene Highness — God grant that in this year now begun everything may
    go according to Your Serene Highness''s wish, where Your Most High Self will be compelled to learn
    to forget all Your sufferings.


    I was written that Lieutenant General von Köckritz would retire and that General Kleist would [uncertain:
    eine hinnen] his place with the King; I have now asked him myself about it, but have as yet received
    no answer.


    That the false Count Götz goes ad patriam is good; I have learned wondrous things of the man — Of
    the new organisations some hope much — I nothing; the money business will yet cause great terror —
    Grevenitz writes that the general moratorium had been extended to Midsummer 1810, and that it is said
    it is to last, by a newer resolution, until Midsummer 1812 — This too I do not believe; against it
    will contend [text lost: B — und Lecht Meyer Wolff].


    May Your Most Serene Highness deign most graciously to send me as soon as possible the freight, toll
    and weigh slips etc. for the iron, sent to You in May, so that I may convince the boatman that I should
    otherwise have to pay here a second time; otherwise I shall not get the iron out. In deepest respect
    I remain, until death,


    Your Most Serene Highness''s


    Just at the


    Konotop


    1 January 1810. humble and obedient servant


    v Triebenfeld'

- page: 4
  en: 'moment at which I was about to send off this letter, I receive the enclosed letter of Honrichs
    by an express courier, which Your Most Serene Highness will deign to return to me together with the
    3 resolutions.


    My messenger sent to Zagórów has not yet returned — Hawich and Hecker must answer, or rather must
    come — if they stay away, then I am convinced that they are [uncertain: Lube]. I shall seek to find
    out exactly what is in the matter; in advance I am convinced that Hawich and Hecker are rascals, for
    how can the [uncertain: Liebe] say that the money has been carried out of the country? I have not
    seen a Groschen; nor can Honrichs take anything, because the people are forbidden to pay monies to
    Honrichs, and that this is welcome to the rent-paying people one may believe without an oath. Honrichs
    at least does his duty, in that he lets the Polish dogs take nothing. I am already content that he
    lives up to my orders and confronts that rabble there without fear, lets nothing be taken, and courageously
    protests against everything.


    I shall learn everything from Brzechffa [uncertain: um] Garczynski; if Hecker and Hawich have made
    false reports, they shall be chastised. Hecker shall never see anything again of his paper caution.
    With the spirits and iron much might be done; since nothing can be sold from Your Serene Highness''s
    foundry, I shall no doubt obtain iron elsewhere — I must make the trial, and see what comes out of
    this [text lost: Barotto Hamel].'

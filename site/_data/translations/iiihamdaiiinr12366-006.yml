- page: 4
  en: 'Instance of the Voivodeship of Kalisz, First Division.


    Having heard the conclusions of the Public Ministry, and taking cognisance first of all of the exception
    of nullity of the summons for want of any mention of the defendants'' domicile;


    Considering:


    That the plaintiff could not, in the summons issued to the defendants, assign them any other domicile
    than the one they had chosen for themselves in the act of regulation of the mortgage register; and
    therefore, dismissing this exception on that ground as unfounded, and taking cognisance of the second
    exception, of nullity of the summons served, on account of the death that had occurred of the defendant
    Anna née Blachow Grotowska, since this assertion of the advocate Chrystowski is by no credible document'
  names:
  - de: Wojewodztwa Kaliskiego
    en: Voivodeship of Kalisz
    kind: place
  - de: Anny z Blachow Grotowskiey
    en: Anna née Blachow Grotowska
    kind: person
  - de: Chrystowskiego
    en: Chrystowski
    kind: person
- page: 5
  en: 'substantiated, because the certificate produced from the Court Office of the Lubliniec estates
    provides no legal proof either as to form or as to substance, for not only is it not attested by the
    competent authority, but it speaks moreover of the death of persons having occurred in different places,
    which could be proved only by the burial record of the authority of the place where the death occurred;
    for which reason the Tribunal, dismissing this exception too, in the matter itself, after examining
    the documents produced, the proofs and the state of the case,


    Considering:


    That it is open to no doubt whatever that the estates of Trąbczyn and Szetlewek with their appurtenances
    were, before the last'
  names:
  - de: Lublinca
    en: Lubliniec
    kind: place
  - de: Trąpczyn
    en: Trąbczyn
    kind: place
  - de: Szetlewek
    en: Szetlewek
    kind: place
- page: 6
  en: 'partition of the Polish country, the private and exclusive property of the late Antoni Prusimski,
    and were held by him by that right until the time of the confiscation of the estates for his belonging
    to the Insurrection.


    That after their confiscation from Prusimski they were granted by a diploma of donation of the Most
    Serene Fryderyk Wilhelm the Second, King of Prussia, dated the ninth of August of the year one thousand
    seven hundred and ninety-six, to Fryderyk Ludwik, Reigning Prince of Hohenlohe Ingelfingen,'
  names:
  - de: Antoniego Prusimskiego
    en: Antoni Prusimski
    kind: person
  - de: Prusimskiemu
    en: Prusimski
    kind: person
  - de: Fryderyka Wilhelma Drugiego Krola Pruskiego
    en: Fryderyk Wilhelm the Second, King of Prussia
    kind: person
  - de: Fryderykowi Ludwikowi Panuiącemu Xięciu de Hohenlohe Ingelfingen
    en: Fryderyk Ludwik, Reigning Prince of Hohenlohe Ingelfingen
    kind: person
- page: 7
  en: 'passed from their true owner to the donee, and it was only on the strength of that act that the
    latter regulated the mortgage register in his own name.


    That after the change of government which followed, the Governing Commission, as the supreme authority
    in the country, representing the rights of the Monarch, by its decision of the twenty-first of July
    of the year one thousand eight hundred and seven, issued at Dresden, restored the present plaintiff,
    Michalina née Prusimska, by her first marriage Dąbska, now Miączyńska, to the estates confiscated
    from her father'
  names:
  - de: Dreznie
    en: Dresden
    kind: place
  - de: Michalinę z Prusimskich
    en: Michalina née Prusimska
    kind: person
  - de: Dąbską
    en: Dąbska
    kind: person
  - de: Miączyńską
    en: Miączyńska
    kind: person
- page: 8
  en: that, therefore, no other consequence follows from all these acts than that, on the one hand, the
    event of the confiscation of the estates and their grant by a diploma of donation to Prince Hohenlohe,
    being the effect of the political circumstances of that time, could retain its binding force only
    for as long as that same state of things lasted, and so, on the other hand, the restoration of the
    then Dąbska, née Prusimska, to her paternal estates after the change of government is to be regarded
    in no other way than as a return to the original rights of the owner which were his at the time they
    were taken from him; in which, from the very nature of the thing,
  names:
  - de: Xięciu Hohenlohe
    en: Prince Hohenlohe
    kind: person
  - de: z Prusimskich owczasowey Dąbskiey
    en: the then Dąbska, née Prusimska
    kind: person
- page: 9
  en: 'lies the determination of the same state of things as existed at the time of the confiscation of
    the estates; and this being so,


    Considering therefore:


    That since the donee, Prince Hohenlohe, could be regarded only as a conditional possessor, and with
    the fall of his title the debts contracted by him and burdening the estates likewise ceased to be
    binding, therefore his creditors too, the present defendants, the brothers Lichnowski and Grotowska
    née Blachow, being unable to acquire better rights than belonged to the donee himself, to shelter
    behind his rights in any way'
  names:
  - de: Xiąze Hohenlohe
    en: Prince Hohenlohe
    kind: person
  - de: Bracia Lichnowscy
    en: the brothers Lichnowski
    kind: person
  - de: z Blachow Grotowska
    en: Grotowska née Blachow
    kind: person
- page: 10
  en: 'are not able.


    Moreover —


    Taking into consideration:


    That it cannot be supposed that, by the decision of the governing authority restoring the property,
    debts not contracted by the original owner were to burden it, since otherwise the true purpose of
    the administration of justice would be defeated; for, not being in a position to pay debts contracted
    by a stranger and third person, [the owner] could not keep the estates restored to him in possession
    in possession, and could in nothing profit from the Government''s beneficence, which surely is in
    no way to be admitted;'
- page: 11
  en: 'nor does the Treaty of Tilsit, namely its Articles 24 and 25, cited by the defendants in their
    defence, in any way improve their rights, since it cannot at all be applied to estates confiscated
    from private persons and given back to them again, as is explained more fully by the Opinion of the
    Council of Ministers in the matter of General Sanitz, laid before the Throne on the fifth of October
    of the year one thousand eight hundred and ten.


    Considering, besides:


    That His Majesty the King of Prussia himself was pleased to establish the above-mentioned principle,
    that the original owner'
  names:
  - de: Traktat Tylżycki
    en: Treaty of Tilsit
    kind: other
  - de: Generała Sanitz
    en: General Sanitz
    kind: person
  numbers:
  - '24'
  - '25'
- page: 12
  en: 'restored to his property is not to be is not to be answerable to the injured parties for a claim
    of this kind, since, according to the diploma produced, dated the seventh of September of the year
    one thousand eight hundred and eighteen, he assigned to the said General Sanitz the estate of Hintzendorff
    as compensation for the estates of Pawłowo and Dzwonowo, Prusimski''s hereditary property, taken from
    him.


    Considering finally:


    That the plaintiff, conducting a suit of the same nature and about the same object with Weigel for
    the extabulation'

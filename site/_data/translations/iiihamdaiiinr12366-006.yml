- page: 13
  en: 'of his claim, contracted by Prince Hohenlohe and burdening the same estates, obtained final judgments
    founded on the same principles and ordering the debts to be extabulated; for which reason, in the
    present case also, the same principles being taken as the basis for the decision, no other judgment
    can be given.


    For these, therefore, and for the reasons cited above:


    The Civil Tribunal of First Instance of the Voivodeship of Kalisz, 1st Division'

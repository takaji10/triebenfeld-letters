  en: 'plaintiffs, appearing through Jozef [uncertain: Rozdayczer], advocate of the Tribunal, of the one
    part.


    A.


    1. Karol Franciszek and Maxymilian Jarosław, the two brothers Lichnowski, as heirs of the late Karol
    Henryk Lichnowski, who at the regulation of the mortgage register of the Trąbczyn estates and at the
    entry of the sum of forty-two thousand thalers in Courant chose their domicile with Jan Chrystowski,
    advocate of the Tribunal, at Kalisz, defendants, appearing through Jan Chrystowski, advocate of the
    Tribunal, of the second part'

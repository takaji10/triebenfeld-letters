- page: 15
  en: 'the Educational Institute, entered under Numbers 2 and 4, together with interest, it orders to
    be struck out of the mortgage register of the estates of Trąbczyn and Szetlowek, and condemns the
    defendants to bear the costs, of which it confirms twenty Polish florins paid in addition for the
    entry fee, and fixes the costs of judgment at nine hundred Polish florins, by virtue of this judgment
    given in the First Instance.


    /signed/ Rembowski


    == Piątkiewicz, Clerk'

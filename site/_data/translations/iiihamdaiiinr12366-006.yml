    Roman Hubicki, Prosecutor


    /signed/ Rembowski


    = Piątkiewicz, Clerk


    Done at Kalisz, at a public audience of the Civil Tribunal of First Instance of the Voivodeship of
    Kalisz, First Division, which holds its sittings in the Palace of Justice in Jozefina Street, on the
    thirtieth day of July of the year one thousand eight hundred and twenty-seven


    Between Michalina née Prusimska, wife of Count Stanisław Miączyński, or rather both spouses, the Count
    and Countess Miączyński, hereditary owners of the estates of Trąbczyn with their appurtenances, situated
    in the district of Konin, residing in the village of Trąbczyn'

  en: '2. Marya Anna née Blachow, widow of the late Franciszek Grotowski, appointed by testament of the
    twenty-second of August of the year one thousand eight hundred and twelve universal heir to the whole
    estate left by her husband, in respect of the sum of one hundred and twenty thousand Polish florins
    secured for her on the Trąbczyn estates, likewise having her legal domicile at Kalisz with the advocate
    Jan Chrystowski, defendant, not appearing after the judgment of joinder, of the third part


    The Civil Tribunal of First'

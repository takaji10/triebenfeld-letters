    a. Forty-two thousand thalers, or two hundred and fifty-two thousand Polish florins, for the benefit
    and in the name of Karol Erdman Franciszek and Maxymilian Jarosław, the two brothers Lichnowski.


    b. Twenty thousand thalers, or one hundred and twenty thousand Polish florins, for the benefit and
    in the name of Marya Anna née Blachow, widow of the late Franciszek Grotowski, together with the intabulation
    entered with this sum for the benefit of'

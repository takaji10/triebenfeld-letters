  en: '285


    Pro Memoria.


    In 1796 the King conferred upon the Prince of Hohenlohe the Kamionna estates, following upon a certain
    Anton v. Prusimski. The same Prusimski had pledged these estates to a certain Broniewski for more
    than 100000 rt., so that the Prince could never come into possession of them — the lawsuit pending
    on that account has [uncertain: given] the Prince over 6000 rt. In the first and second instance the
    Prince lost and was condemned to pay the pledge-money. Broniewski at last offered a settlement, and
    the Prince paid 55000 rt. in cash to Broniewski in 1804. — makes 61000 rt. Now on this, from 1804
    to 1815, the interest is 33550 rt. [uncertain: induced] outlays upon the estates he has thereupon
    at the utmost to demand as such 94550 rt.; the house has paid; to the court Senate treasury for the
    instrument 4164 rt., which must be [given] to the Prince Z[illegible]erobowski 4164 rt. [uncertain:
    Sum] of the demonstration 98714 rt. NB Leixner together with M. Bernhard [uncertain: have], exactly,
    given the monies as 55000 rt. But the capitals have been registered to them upon Pszczew and the Kulm
    estates, and M. B. also has the Kulm estates entirely in possession for his claims; consequently the
    94550 rt. belong to the Prince alone, and the woman born Prusimska, so greatly favoured, must therefore
    return to the Prince the pledge-money paid together with interest; but it stands with the Prince to
    retain the estates in pledge-possession until his satisfaction — Now the estates have meanwhile been
    judicially taxed at 180000 rt. [uncertain: value]; if therefore the 55000 rt. be brought into deduction,
    there remains in our valuation 125000 rt.


    makes 223714 rt., which must be made good to the Prince in cash or by estates —


    2. Trąbczyn was judicially taxed at 316000 rt. Upon it the Prince contracted debts


    1. from Lichnowski 70000 rt.


    2. Weigel 30000 rt.


    3. Grotowski 20000 rt.


    4. Seeher Thoss 8000 rt.


    5. v. Zerboni 10000 rt. = 138000 rt.


    thereupon the Prince has paid to Lichnowski 30000 rt.


    To Weigel 30000 rt.


    makes 60000 rt.


    there remain 78000 rt.


    There remains here as a further [illegible] part 238000 rt., consequently together with Kamionna 467114
    rt., of which the woman born Prusimska must pay in cash 94550 rt.; the Souverains have to [uncertain:
    dispatch] the Prince either in estates or in cash 367164 rt., that is 461714 rt.


    the 27th of March


    1815.'

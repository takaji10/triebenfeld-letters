segments:
- page: 1
  en: 'P[ro]. M[emoria].


    In 1796 the King conferred upon the Prince of Hohenlohe the Kaemen estates, after a certain Anton
    von Prussiemski. The said Prussiemski had pledged these estates to a certain Broniewski for more than
    100000 Rthl, so that the Prince could never come into possession of them - the lawsuit pending on
    that account has cost the Prince over 6000 Rthl. In the first and second instance the Prince lost
    and was condemned to pay the pledge sum. Broniewski at last offered a settlement, and the Prince paid
    55000 Rthl in cash to Broniewski in 1804. - makes 61000 Rthl. On this, then, from 1804 to 1815, the
    interest is 33550 Rthl, [uncertain: outlays] upon the estates; he has therefore at the most to demand
    thereon 94550 Rthl.


    The house has paid to the [uncertain: Senate Court] treasury for the instrument 4164 Rthl, which must
    be [made good] to the Prince Z[illegible]erbowski 4164 Rthl. [uncertain: Sinnen] of the adducing of
    proof 98714. NB Leixner together with M. Bernhard have given precisely the moneys as 55000 Rthl. But
    the capitals have been registered to them upon Betsche and the Latmian estates, and M. B. also has
    the Culm[?]ian estates entirely in possession for his claims; consequently the 94550 Rthl belong to
    the Prince alone, and the born Prusimska, so greatly favoured, must therefore return to the Prince
    the pledge sum paid together with interest; but the Prince is entitled to retain the estates in pledge-possession
    until his satisfaction — Now the estates have meanwhile been judicially assessed at 180000 in value;
    if then the


    55000 Rthl be brought into deduction, there remains in our valuation 125000 Rthl


    makes 223714 Rthl


    125000, which must be made good to the Prince in cash or by estates.


    2. Trąbczyn was judicially assessed at 316000.


    Upon it the Prince contracted debts: 1 from Lichnowski 70000 Rthl


    2. Weigel 30000


    3. Grotowski - 20000


    4. Seeher Thoch 8000


    5. von Zerboni 10000 = 138000. Upon this the Prince has paid: to Lichnowski 30000


    To Weigel 30000


    makes 60000


    there remain 78000. There remains here then a surplus [uncertain: Heil.] 238000 Rthl 238000; consequently
    together with [the foregoing] 467114 Rthl; of which the born Prusimska must pay in cash 94550 Rthl;
    the Sovereigns have to indemnify the Prince either in estates or in cash 367164 Rthl; that is 461714
    Rthl.


    the 27th of March


    1815.'

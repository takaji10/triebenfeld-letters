segments:
- page: 1
  en: 'Pro Memoria. In 1796 the King conferred the Kaemen estates upon Prince Hohenlohe after a certain
    Anton v. Prussiemski. The same Prussiemski just mentioned had pledged these estates to a certain Broniewski
    for more than 100000 Rthl, so that the Prince could never come into possession of them — the lawsuit
    pending on that account has cost the Prince over 6000 Rthl. In the first and 2nd instance the Prince
    lost and was condemned to pay the pledge-money. Broniewski at last offered a compromise, and the Prince
    paid 55000 Rthl in cash to Broniewski in 1804 — makes 61000 Rthl. Hereupon now, from 1804 to 1815,
    the interest is 33550 Rthl. Outlays upon the estates [uncertain: bewogen / "induced"] he has thereupon
    at most to claim: 94550 Rthl. The house has paid to the [uncertain: Kost] Senate treasury for the
    instrument 4164 Rthl, which must be [made good?] to Prince Z[illegible]erbowski, 4164 Rthl. [uncertain:
    Sinnen] of the [uncertain: Beweisendung] 98714. NB Leixner with M. Bernhard have given exactly the
    monies as 55000 Rthl. But the capitals have been registered to them upon Betsch and the [uncertain:
    latmschen] estates; also M. B. has the Culm[illegible]ish estates entirely in possession for his claims,
    consequently the 94550 Rthl belong to the Prince alone. And so the née Prusimska, so greatly favoured,
    must therefore return to the Prince the pledge-money paid together with interest; but it stands to
    the Prince to retain the estates in pledge-possession until his satisfaction — Now the estates have
    meanwhile been judicially assessed and at 180000 in value; if then the 55000 Rthl be brought into
    deduction, there remains in our value 125000 Rthl, makes 223714 Rthl / 125000, which must be made
    good to the Prince in cash or by estates. 2. Trąbczyn was judicially assessed at 316000. Thereupon
    the Prince contracted debts: 1. from Lichnowski 70000 Rthl, 2. Weigel 30000, 3. Grotowski — 20000,
    4. Seeher Thoch 8000, 5. v. Zerboni 10000 = 138000. Thereupon the Prince has paid: to Lichnowski 30000,
    to Weigel 30000, makes 60000, there remain 78000. There remains here as a surplus 238000 Rthl / 238000;
    consequently together, hence, 467114 Rthl. Of this the née Prusimska must pay in cash 94550 Rthl;
    the Sovereigns have to compensate the Prince either in estates or in cash 367164 Rthl, that is 461714
    Rthl. The 27th of March 1815.'

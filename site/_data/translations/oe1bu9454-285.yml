- page: 1
  en: '285


    Pro Memoria.


    In 1796 the King conferred upon the Prince of Hohenlohe the Kamionna estates, following upon a certain
    Anton v. Prusimski. The same Prusimski had pledged these estates to a certain Broniewski for more
    than 100,000 Rthl., so that the Prince could never come into possession of them — the lawsuit pending
    on that account has [uncertain: given] the Prince over 6,000 Rthl. In the first and second instance
    the Prince lost and was condemned to pay the pledge-money. Broniewski at last offered a settlement,
    and the Prince paid 55,000 Rthl. in cash to Broniewski in 1804. — makes 61,000 Rthl. Now on this,
    from 1804 to 1815, the interest is 33,550 Rthl. [uncertain: induced] outlays upon the estates he has
    thereupon at the utmost to demand as such 94,550 Rthl.; the house has paid; to the court Senate treasury
    for the instrument 4,164 Rthl., which must be [given] to the Prince Z[illegible]erobowski 4,164 Rthl.
    [uncertain: Sum] of the demonstration 98,714 Rthl. NB Leixner together with M. Bernhard [uncertain:
    have], exactly, given the monies as 55,000 Rthl. But the capitals have been registered to them upon
    Pszczew and the Kolno estates, and M. B. also has the Kolno estates entirely in possession for his
    claims; consequently the 94,550 Rthl. belong to the Prince alone, and the woman born Prusimska, so
    greatly favoured, must therefore return to the Prince the pledge-money paid together with interest;
    but it stands with the Prince to retain the estates in pledge-possession until his satisfaction —
    Now the estates have meanwhile been judicially taxed at 180,000 Rthl. [uncertain: value]; if therefore
    the 55,000 Rthl. be brought into deduction, there remains in our valuation 125,000 Rthl.


    makes 223,714 Rthl., which must be made good to the Prince in cash or by estates —


    2. Trąbczyn was judicially taxed at 316,000 Rthl. Upon it the Prince contracted debts


    1. from Lichnowski 70,000 Rthl.


    2. Weigel 30,000 Rthl.


    3. Grotowski 20,000 Rthl.


    4. Seeher Thoss 8,000 Rthl.


    5. v. Zerboni 10,000 Rthl. = 138,000 Rthl.


    thereupon the Prince has paid to Lichnowski 30,000 Rthl.


    To Weigel 30,000 Rthl.


    makes 60,000 Rthl.


    there remain 78,000 Rthl.


    There remains here as a further [illegible] part 238,000 Rthl., consequently together with Kamionna
    467,114 Rthl., of which the woman born Prusimska must pay in cash 94,550 Rthl.; the Souverains have
    to [uncertain: dispatch] the Prince either in estates or in cash 367,164 Rthl., that is 461,714 Rthl.


    the 27th of March


    1815.'

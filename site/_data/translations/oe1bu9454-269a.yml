- page: 1
  en: 'Copy


    Most Serene Prince etc. In accordance with the commission of the Prince of Hohenlohe I am to present
    to Your Most Serene Highness the accompanying file of documents [uncertain: allerzubeißen]. It contains
    the correspondence with His Excellency Minister von Kircheisen, which the [uncertain: bringen] Q.
    L. court would not take up into the protocol kept, because it had not been commissioned to do so.
    Since, however, from the medical councillor Cossnar''s letter of the 22nd of June 1810 under S: the
    most unmistakable [uncertain: Chirann] against the poor good Prince emerge, especially as Cormas himself
    admits that, on account of the claim of the Kurz heirs for 300000 Rthl, which the Prince alone undertook
    to contest, he has stinted the Prince in everything and laid it all under arrest, I hasten most humbly
    to lay the file of documents at Your Most Serene Highness''s feet. Your Most Serene Highness will
    gather from it how highly necessary it is [uncertain: nur wischen] to satisfy the Kurz heirs. The
    heirs are quite certainly to be satisfied, according to the proofs held in hand, with 112000 Rthl;
    indeed only 12000 Rthl in cash is demanded at once, and for the 100000 Rthl a secure instruction to
    pay. - Should Your Most Serene Highness approve these requests and allow the sum to be advanced to
    the upright old Prince, while all the entailed estates are immediately administered on behalf of the
    treasury before they are given over, then an honest Prince is at once out of Cosmar''s claws, and
    saved through Your Most Serene Highness''s grace, upon which alone he counts. I bind myself in return,
    on forfeit of my whole property and my liberty, to deliver the debt [uncertain: Intravante] and above
    all the guarantee of His Majesty into Your Serene Highness''s hands forthwith. The one thing that
    remains to be wished, however, is that the Monarch, if today or tomorrow the K. heirs should once
    more approach His Majesty concerning their satisfaction, should disclaim the matter, as has already
    happened, whereby everything will quickly be [uncertain: erricht], and the King''s word remain sacred.
    Cosmar lies unmasked and trodden in the dust, particularly if he is held to render account with the
    utmost dispatch, all the more since Prince August is now recalling the power of attorney given to
    him.


    Funds for the discharge of the 112000 Rthl as well as of the 35000 are present in abundance; indeed
    even the 18000 Rthl which Prince August is to draw yearly, and of which some 54000 Rthl already lie
    in store, can be [uncertain: verweint] applied to it out of hand, and thus the debt of 147/ discharged
    in a very short time. Should Your Most Serene Highness [uncertain: Er führen] this most humble request,
    then the good Prince, who all unguilty has already for 9 years endured the most [uncertain: anlaſaſten]
    sufferings, is saved through Your Most Serene Highness''s grace, and every creditor set at rest. -
    In [uncertain: unbegragter] reverence I remain, until death,


    Your Most Serene Highness''s v. Triebenfeld


    Vienna, the 24th of January


    1815'

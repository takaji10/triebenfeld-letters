segments:
- page: 1
  en: '269 a)


    Copy


    Most Serene Prince etc. To Your Most Serene Highness I am, by commission of the Prince of Hohenlohe,
    to present the accompanying file of documents [uncertain: allerzubeißen — corrupt, probably "most
    humbly"]. It contains the correspondence with His Excellency M. von Kircheisen, which the Upper Provincial
    Court at Brzeg would not take into the record drawn up, on the ground that it had not been charged
    to do so. Since, however, from the letter of the medical councillor Cosmar of 22 June 1810, under
    G, the most unmistakable chicaneries against the poor good Prince appear — particularly as Cosmar
    himself admits that, on account of the claim of the Cur[ish] heirs for 300/m Rthl, which the Prince
    alone undertook to contest, he has cut off and placed under arrest everything belonging to the Prince
    — I hasten most humbly to lay the file of documents at the feet of Your Most Serene Highness.


    How exceedingly necessary it now is to satisfy the Curish heirs, Your [uncertain: W.] [illegible]
    will be pleased to gather from this. The heirs can quite certainly, according to the proofs in hand,
    be satisfied with 112,000 Rthl; indeed, only 12/m Rthl in cash is demanded at once, and for 100,000
    Rthl a secure order to pay. — Should Your [uncertain: W.] Highness approve these requests, and allow
    the sum to be advanced to the upright old Prince, but have all the entailed estates forthwith administered
    for the treasury in advance of the moneys being given, then this one honest Prince is at once [uncertain:
    gewißen — probably "torn"] out of the claws of Cosmar, and saved by Your Serene Highness''s grace,
    upon which alone he counts. — I for my part bind myself, on forfeit of my entire goods and of my liberty,
    to deliver the instruments of debt and above all the guarantee of His Majesty at once into Your Serene
    Highness''s hands. The one thing that remains to be wished is that the Monarch, if today or tomorrow
    the C[urish] heirs should once more approach His Majesty for their satisfaction, should disclaim the
    matter, as has already been done, whereby all this is quickly achieved and the King''s word remains
    sacred. — Cosmar lies exposed and trodden in the dust, if he is especially held to the most expeditious
    rendering of accounts, the more so as Prince August is now demanding back the power of attorney given
    to him.


    Funds for the discharge of the 112,000 Rthl as well as of the 35,000 [uncertain: is] are abundantly
    present; indeed, even the 18,000 Rthl which Prince August is to draw yearly, and of which some 54,000
    Rthl already lie in store, can be applied thereto out of hand, and thus the debt of 147/m be discharged
    in a very short time. — [uncertain: Er führen — probably "Should Your Most Serene Highness grant"]
    Your Most Serene Highness this most humble request, then the good Prince, who [uncertain: ſol] through
    no fault of his own has already for 9 years endured the [uncertain: granz anlaſaſten] sufferings,
    is saved by Your most high grace, and every creditor set at rest. — In [uncertain: unbegragter — probably
    "unbounded"] veneration I remain, until death,


    Your [illegible] Highness''s. Vienna, the 24th of January


    1815


    and so on and so forth


    v Triebenfeld'

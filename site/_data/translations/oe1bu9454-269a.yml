- page: 1
  en: 'Copy. Most Serene Prince etc. In accordance with the commission of the Prince of Hohenlohe I am
    to present most humbly to Your Most Serene Highness the accompanying document. It contains the correspondence
    with His Excellency Herr M. v. Kircheisen, which the [uncertain: bringen] Q. L. Court would not admit
    into the protocol as taken, because it had not been charged therewith. Since, however, from the medical
    councillor Cosmar''s letter of the 22nd of June 1810 sub S: the most unmistakable [uncertain: tyranny]
    against the poor good Prince emerges, especially as Cosmar himself admits that he has, on account
    of the claim of the Kurz heirs for 300000 Rthl, which the Prince alone undertook to contest, stripped
    the Prince of everything and laid it under arrest, I hasten most humbly to lay the documents at Your
    Most Serene Highness''s feet. How highly necessary it is that the Curian heirs be satisfied, Your
    Most Serene Highness will be pleased to gather herefrom. The heirs are quite certainly, according
    to the proofs in hand, to be satisfied with 112000 Rthl; indeed one demands only 12000 Rthl at once
    in cash, and for the 100000 Rthl a secure order to pay. — Should Your Most Serene Highness approve
    these petitions and cause the sum to be advanced to the upright old Prince, and the whole of the entailed
    estates be forthwith administered for the treasury before they are given over, then an honest Prince
    is at once out of the claws of Cosmar and, through Your Most Serene Highness''s grace, upon which
    alone he counts, rescued. I bind myself in return, upon the forfeiture of my whole goods and of my
    liberty, to deliver up the debt [uncertain: Intravante] and above all the guarantee of His Majesty
    at once into Your Serene Highness''s hands. The one thing that remains to be wished, however, is that
    the Monarch, if today or tomorrow the K. heirs should again approach His Majesty concerning their
    satisfaction, should disavow himself of the matter, as has already been done, whereby all is quickly
    [uncertain: attained], and the King''s word remains sacred. Cosmar lies, especially if he be held
    to the most expeditious rendering of accounts, unmasked and trodden in the dust, the more so as Prince
    August now demands back the power of attorney given to him. Funds for the discharge of the 112000
    Rthl as well as of the 35000 are present in superfluity; indeed even the 18000 Rthl which Prince August
    is to draw annually, and of which some 54000 Rthl already lie in store, can be [uncertain: verweint]
    applied out of hand thereto, and thus the debt of 147/ be discharged in a very short time. Should
    Your Most Serene Highness [uncertain: grant] this most humble petition, then the good Prince, who
    all guiltless has already through 9 years endured the [illegible] sufferings, is rescued through Your
    most high grace, and every creditor set at rest. — In unbounded reverence I remain, until death, Your
    Most Serene Highness''s v Triebenfeld. Vienna, the 24th of January 1815.'

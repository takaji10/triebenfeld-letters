  en: '211


    Most Serene Prince


    Most gracious Prince and Lord!


    Mr von Knobelsdorff was here and has satisfied himself as to the premises. It pleases him, and I am
    therefore endeavouring now to bring everything into order, so as to arrange it all such that one can
    survey the matter in an instant. Meanwhile the confusion is very great, and the people stubborn who
    are heard by Hawich; often I could go out of my mind. With God''s help I hope to set everything aside.
    The lawsuit concerning Trąbczyn will come to a good end; the hearing has stood open since the 24th,
    the matter is still not concluded, and it may easily be another 14 days before the decree is read
    out by the tribunal. If I win here, then all distress shall be at an end.


    Mr von Knobelsdorff I hold to be an exceedingly upright [uncertain: fang] man who [uncertain: his
    have] states only [uncertain: according to] the truth, and this shall, from this side / if Your Serene
    Highness leaves the management to me alone / [uncertain: fetch] also come to pass — until my last
    breath I remain Your Serene Highness''s


    Klein Öhringen, the 29th of November


    1810


    faithful servant


    v Triebenfeld'

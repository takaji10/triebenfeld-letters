- page: 1
  en: 'Poznań[uncertain] the 4th of August 1803.


    By the Grace of God Friedrich Wilhelm, King of Prussia etc. etc.


    Our Royal Grace and Friendship first of all, High-born Prince, especially dear Uncle, Friend and dear
    Faithful One! We hereby make known to Your Lordship that, in accordance with the petition of the 20th
    of last month, and on the ground of the original documents appended thereto, the entry of the 5000
    rttlr. for Baron von der Marwitz, of the 5000 rttlr. for the wife of the Senior District Councillor
    Michaelis, and of the 5000 rttlr. for the Councillor of Economy Glenck, in the mortgage book upon
    the lordship of Pszczew has been ordered, together with the issuing of a mortgage certificate in vim
    recognitionis for each of the three creditors, which Your Lordship may have received from the archive
    of Our Government after 4 weeks upon payment of the costs. We remain well disposed towards Your Lordship
    with Royal Grace and Friendship. Given at Poznań the 11th of July 1803. Royal South Prussian Government.
    Braudhan[uncertain]


    To the Lord Prince of Hohenlohe-Ingelfingen.


    Fee and seal 1 Rthl: 2 Groschen Stamp — 6 Groschen Engrossing: 2 Groschen


    Notification 3 Groschen


    No. 6219.'

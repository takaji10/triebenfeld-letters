status: draft
segments:
- page: 1
  en: 'E. W. v. Rösch. Between the Special Plenipotentiary of thy Most Serene Highness the reigning Lord
    Fürst zu Hohenlohe Ingelfingen, Herr Forest Inspector Rochlitz, as seller on the one part, and Herr
    Martin Honrichs and Herr Valentin v. Kwasieborski as purchasers on the other part, there is, for the
    purpose of a formal judicial contract of purchase and sale to be concluded hereafter concerning the
    noble estate of Witow, the following Punctation agreed upon and concluded under this day''s date after
    mature deliberation.


    The said Herr Forest Inspector Rochlitz sells, in the name of His Most Serene Highness the reigning
    Lord Fürst zu Hohenlohe Ingelfingen, the aforesaid, his Lord Principal''s noble estate situated in
    the Royal South Prussian Kalisch Government Department and its Warta district, namely the village
    and Scholtisey Witow, with all rights and appurtenances thereto pertaining, nothing thereof excepted,
    in such wise as the same, pursuant to the Most High deed of donation [uncertain: Donations-Urkunde]
    of the most blessed King Frie-'
- page: 2
  en: '-drich Wilhelm the Second, [uncertain: were granted to] Colonel v. Schlieben, and were conveyed
    by his widow and heirs, pursuant to the judicial contract of purchase of the 22nd of October 1799,
    to thy Most Serene Highness; unto the said Herr Martin Honrichs and Valentin v. Kwasieborski, and
    this indeed for a purchase price agreed and determined between the contracting parties after mature
    deliberation of 16000 rt, written out sixteen thousand Reichsthaler Prussian Courant.


    2. This purchase price the purchasers bind themselves to pay in solidum, that is to say, one for both
    and both for one [uncertain], to His Most Serene Highness in the following instalments, namely at
    Johannes Baptista a. c. 4000 Rt, say four thousand Reichsthaler; at [uncertain: Weihnachten] a. c.
    6000 rtl., say six thousand Reichsthaler; and at Johanni 1804 the remainder with 6000 rt., say six
    thousand Reichsthaler; and until the full payment of the arrears to pay interest upon the same at
    5 per cent.


    3. His Most Serene Highness grants to the purchasers Eviction warranty only for the parcels actually
    in possession and to be handed over to them at the'
- page: 3
  en: 'tradition. In respect of those 1016 Skladen of arable land which may be [uncertain: recovered]
    by the burghership of Warta, and which are not in the possession of thy Most Serene Highness, no warranty
    of Eviction is granted; rather it remains the purchasers'' business alone to vindicate the arable
    in question at their own entire risk and cost, whereas, however, His Most Serene Highness renounces
    all claims against the purchasers should they in fact win these Skladen of arable, whether wholly
    or in part, against the burghership of Warta.


    4. The delivery of this sold estate to the purchasers shall take place 14 days after Johanni a. c.,
    at which same time and place the first instalment of the 4000 rtll. must be paid, since until this
    be done the delivery cannot take place.


    5. At this delivery there shall be handed over together with it that [uncertain: ground stock] and
    cattle and implements which are found upon the estate'
- page: 4
  en: 'and is specified in the judicial deed of delivery [Uebergabe-Receß] on the part of the lessee Knoblauch
    to v. Bloch of Blotniz of the 10th and 11th of July a. p., exclusive of the plus Inventarii in horses
    and oxen taken away at that time by Knoblauch pursuant to the Receß of the 11th of July, which for
    that very reason are no longer to be found upon the estate and for that same reason cannot be handed
    over with it.


    6. The Herr Seller promises to procure the consent to the acquisition of this estate for the purchasers,
    if possible at the latest by Johann a. c.; should the same, however, not be forthcoming, then the
    purchase in question falls to the ground.


    7. Should the Final Resolution concerning the consent in question be delayed longer than 14 days beyond
    Johann a. c., in such wise that the delivery shall already have taken place and the first instalment
    of the purchase price shall already have been paid, but the resolution in question should then turn
    out in the negative'
- page: 5
  en: 'in the negative, then the contracting parties have, for the avoidance of all [uncertain: disputes]
    concerning the revenues drawn, agreed as follows: that the purchasers shall retain this estate in
    possession by way of lease for one year, namely until 14 days after St. Johanni 1804, but shall in
    return pay to the Herr Seller for this year a lease-sum of 800 rtl., say eight hundred Reichsthaler;
    likewise shall discharge all public dues concerning this estate, by whatever name they may be called,
    upon the [uncertain: Competenz ex Propriet], without being permitted to bring anything to the Herr
    Seller''s account therefor; and the purchasers renounce, for this last case, each and every remission
    and other demand whatsoever, by whatever name they may be called, but bind themselves, upon the readiest
    execution, to vacate the estate of Witow 14 days after Johann 1804 in good husbandly condition, and
    submit themselves in this'
- page: 6
  en: 'behalf to the executive process with all its legal consequences; it being however understood of
    itself that in this case, upon the vacating of the estate, the 4000 rtl. paid must be repaid to them
    by the Herr Seller, after deduction of the [uncertain: stipulated] lease-pension of 800 rt and of
    those public dues and costs which they could not prove to have been paid at their departure.


    8. [uncertain: Furthermore] the estate is handed over to the purchasers with the winter and summer
    sowing fully put in, and the purchasers hereby declare that they accept the winter sowing as duly
    sown, and only await the like in respect of the summer sowing.


    9. The documents concerning this estate shall, immediately upon the arrival of the consent, be handed
    out to them for their [uncertain: purpose of acquisition].


    10.'
- page: 7
  en: '10. Finally the contracting parties renounce all objections and evasions running counter to this
    Punctation of purchase, by whatever name they may be called, in particular the purchasers renounce
    the plea of injury in and above the half [laesio enormis]; and they set, for the case of non-observance
    or non-performance of this contract, a vadium or conventional penalty of 1000 rtll., say one thousand
    Reichsthaler, which the contravening party shall be bound to pay to the other, and nevertheless to
    perform the contract.


    11. The costs of this contract both parties assume by halves; those of the rectification of the Titulus
    Possessionis in the purchasers'' names, the latter alone.


    Both parties have, this Punctation of purchase having been read by themselves, which was explained
    to the co-purchaser v. Kwasiborski by his socius Honricht in the Polish tongue, after previous'
- page: 8
  en: 'previous approval, executed the same with their own hand-written signatures.


    Kalisch, the 21st of April 1803.


    [uncertain: Upon] the signing both parties remarked to me that, in respect of the buildings standing
    upon the Schultisey, which the lessees there claim to have built themselves, no Eviction warranty
    is granted to the purchasers by the Herr Seller; rather, in case the lessees'' statement should be
    correct, the purchasers must come to a separate settlement with them thereupon.


    Done as above.


    Christian Friedrich Rochlitz

    Martin Honrichs


    Walęty v Kwasiborski


    Carl Anton Grimm


    Stanisław Szymanowski


    as witness.


    The 6000 rl., six thousand Reichsthaler of purchase money payable to me, according to the foregoing
    Punctation of purchase, at the term of Christmas of this year, and likewise, out of the 6000 rt payable
    at the term of Johannis 1804, a sum of two thousand Reichsthaler, with priority before the residue,
    also with all rights'
- page: 9
  en: 'and without novation, and with the pledge-right to be stipulated in the instrument of purchase
    hereafter to be drawn up and to be intabulated upon the entry of the title of possession, and with
    interest at 5 per cent from Johannis of this year onward — these I hereby cede to the banker here,
    Herr Carl Ferdinand Weigel. I acknowledge having received the valuta of this cession from him in cash
    and in full.


    I also promise to procure for Herr Banker Weigel the debtors'' consent to this cession as soon as
    possible. Breslau, the 26th of April 1803. Friedrich Ludwig Fürst zu Hohenlohe. Read and approved
    by myself.


    The foregoing cession, receipt for the valuta and promise to procure the consent of the debitores
    I accept in the name and as partner of my father Carl Ferdinand Weigel. Breslau, the 26th of April
    1803. I have read and approved this. Carl Gottlieb Weigel, in [uncertain: the name] and as partner
    of [uncertain: my] father Carl Ferdinand Weigel.


    That the foregoing cession and receipt for the'
- page: 10
  en: 'valuta, by His Most Serene Highness Herr Friedrich Ludewig reigning Fürst zu Hohenlohe-Ingelfingen,
    and the acceptation declared by Herr Merchant Carl Gottlieb Weigel in the name and as partner of his
    father Herr Carl Ferdinand Weigel, were under this day''s date executed before the Justice Office
    of the Ladies'' Princely Chapter of St. Vincenz, to which the same are personally well known, after
    due perusal and declared approval, by their own hand-written signatures and appended seals, as well
    upon this original Punctation as upon the vidimated copy of the same issued to the Herr Cessionarius
    — is hereby attested on the ground of the protocol [uncertain: ..ors] taken thereupon. Breslau, the
    26th of April 1803. The Justice Office of the Free Princely Chapter of Vincenz.


    [L. S.]


    Büchler'

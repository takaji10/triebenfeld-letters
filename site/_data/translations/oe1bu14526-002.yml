- page: 9
  en: 'and without novation, and with the right of pledge to be stipulated in the instrument of purchase
    hereafter to be drawn up and to be intabulated upon registration of the title of possession, and with
    interest at 5 per cent from Midsummer of this year, I hereby cede to the banker here, Carl Ferdinand
    Weigel. I acknowledge to have received the consideration for this cession from him in cash and duly.


    I likewise promise to procure for the banker Weigel the debtors'' assent to this cession as soon as
    possible. Breslau, 26 April 1803. Friedrich Ludwig, Prince of Hohenlohe. Read and approved by myself.
    The foregoing cession, receipt for the consideration, and the promise to procure the debtors'' assent,
    I accept in the name and as partner of my father Carl Ferdinand Weigel. Breslau, 26 April 1803. I
    have read and approved this. Carl Gottlieb Weigel, in the name and as partner of his father Carl Ferdinand
    Weigel. That the foregoing cession and receipt for the'

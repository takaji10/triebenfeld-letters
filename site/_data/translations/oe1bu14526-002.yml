  en: 'E. W. v. Rösch — between the special authorised representative of His Most Serene Highness the
    reigning Prince of Hohenlohe-Ingelfingen, Forest Inspector Rochlitz, as seller on the one part, and
    Martin Honrichs and Valentin v. Kwasieborski, as purchasers on the other part, there has, with due
    deliberation, been agreed and concluded under today''s date the following points of contract, for
    the purpose of a formal judicial contract of purchase and sale to be concluded hereafter concerning
    the noble estate of Witów.


    The said Forest Inspector Rochlitz sells, in the name of His Most Serene Highness the reigning Prince
    of Hohenlohe-Ingelfingen, the aforesaid his Lord and principal, the noble estate lying in the Royal
    South Prussian Kalisz Government Department and in its Warta district, namely the village and village
    mayor''s holding of Witów with all appurtenant rights and privileges, nothing thereof excepted, just
    as the same was, pursuant to the Most High deed of donation of the most blessed King Frie-'

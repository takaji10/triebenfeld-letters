- page: 5
  en: negative, then the contracting parties, to avoid all disputes concerning the revenues drawn, have
    agreed that the purchasers shall retain possession of this estate for one year, namely until 14 days
    after St John's Day 1804, by way of lease, but shall for that year pay to the seller a rent of 800
    rtl., say eight hundred Reichsthaler, and shall likewise discharge all public dues concerning this
    estate, by whatever name they may be called, upon the assessment ex Propriet, without being permitted
    to bring anything thereof into account against the seller; and the purchasers, in this last event,
    renounce any and all remissions and other demands whatsoever, by whatever name they may be called,
    but bind themselves, subject to the most summary execution, to vacate the estate of Witów 14 days
    after St John's 1804 in good husbandry condition, and submit themselves in this

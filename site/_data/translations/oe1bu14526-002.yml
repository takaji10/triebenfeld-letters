- page: 6
  en: 'regard to the process of execution with all its legal consequences; it being however of course
    understood that in such event, upon their vacating the estate, the 4000 rtl. paid must be repaid to
    them by the seller, after deduction of the stipulated lease rent of 800 rt and of such public dues
    and costs as they could not show to have been paid at their departure.


    8. The estate shall be handed over to the purchasers with the winter and summer sowing fully carried
    out, and the purchasers hereby declare that they accept the winter sowing as duly sown, and expect
    only the like in respect of the summer sowing.


    9. The documents concerning this estate shall be delivered over to the purchasers immediately upon
    the arrival of the consent to their acquisition [uncertain: Frühige].



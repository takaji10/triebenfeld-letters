- page: 7
  en: '10. Finally, the contracting parties renounce all objections and evasions running counter to these
    points of purchase, by whatever name they may be called, and in particular the purchasers renounce
    the plea of injury in and beyond the half; and they set, for the case of non-performance or non-fulfilment
    of this contract, a vadium or conventional penalty of 1000 rtll, say one thousand Reichsthaler, which
    the contravening party shall be bound to pay to the other, and nonetheless to perform the contract.


    11. The costs of this contract both parties assume by halves; those of the rectification of the titulus
    possessionis in the purchasers'' names, the latter alone.


    Both parties have, this instrument of purchase points having been read by them themselves — which
    was explained to the co-purchaser v. Kwasiborski by his socius Honrichs in the Polish tongue — after
    prior'

status: draft
segments:
- page: 1
  en: 'E. W. von Rösch. Between the special authorised representative of His Most Serene Highness the
    reigning Prince of Hohenlohe-Ingelfingen, the forest inspector Rochlitz, as seller on the one part,
    and Martin Honrichs and Valentin von Kwasieborski, as purchasers on the other part, there has, for
    the purpose of a formal judicial contract of purchase and sale to be concluded hereafter concerning
    the noble estate of Witów, been well-advisedly agreed and concluded under today''s date the following
    heads of agreement.


    The said forest inspector Rochlitz sells, in the name of His Most Serene Highness the reigning Prince
    of Hohenlohe-Ingelfingen, the aforesaid his principal, the noble estate situated in the Royal South
    Prussian Kalisz Government Department and in its Warta district, namely the village and the village
    mayor''s holding of Witów with all appurtenant rights and privileges, nothing excepted therefrom,
    as the same was, pursuant to the Most High deed of donation of the most blessed King Frie-'
- page: 2
  en: 'drich Wilhelm the Second, conferred upon Colonel von Schlieben, and was conveyed by his widow and
    heirs, pursuant to the judicial contract of sale of 22 October 1799, to His Most Serene Highness;
    to the said Martin Honrichs and Valentin von Kwasieborski, and that for a purchase price well-advisedly
    agreed and determined between the contracting parties of 16000 rt, written out sixteen thousand Reichsthaler
    Prussian Courant. 2: This purchase price the purchasers bind themselves to pay in solidum, that is
    to say, the one for both and both for the one, to His Most Serene Highness in the following instalments,
    namely at St John the Baptist of the current year 4000 Rt, say four thousand Reichsthaler, at Christmas
    of the current year 6000 rtl., say six thousand Reichsthaler, and at Midsummer 1804 the remainder
    with 6000 rt., say six thousand Reichsthaler, but until the full payment of the arrears to pay interest
    on the same at 5 per cent.


    3. His Most Serene Highness grants the purchasers warranty of title only for those parcels actually
    held in possession and to be handed over to them at the'
- page: 3
  en: 'delivery of possession; with regard to those 1016 składy of arable land which may be recovered
    at law by the burgesses of Warta and which are not in the possession of His Most Serene Highness,
    no warranty of title is granted, but it remains the purchasers'' business alone to vindicate the arable
    land in question wholly at their own risk and cost, against which, however, His Most Serene Highness
    thereupon relinquishes all claims against the purchasers, if they should actually win these składy
    of arable land from the burgesses of Warta either wholly or in part.


    4. The handing over of this sold estate to the purchasers shall take place 14 days after Midsummer
    of the current year, at which time also, simultaneously and reciprocally, the first instalment of
    the 4000 rtll. must be paid, because before this is done the handing over cannot take place.


    5. At this handing over there shall likewise be handed over the [uncertain: ground to be lost] and
    the cattle and implements which are found on the estate'
- page: 4
  en: 'and are specified in the judicial recess of transfer on the part of the tenant Knoblauch to von
    Bloch of Blotniz of the 10th and 11th of July of the past year, exclusive of the surplus inventory
    in horses and oxen taken away at that time by Knoblauch pursuant to the recess of 11 July, which for
    that very reason are no longer to be found on the estate, and for that very reason cannot be handed
    over as well.


    6. The seller promises to procure the consent to the purchasers'' acquisition of this estate if possible
    at the latest by St John of the current year; should it, however, not be forthcoming, then the sale
    in question falls through.


    7. Should the final resolution concerning the said consent be delayed longer than 14 days beyond St
    John of the current year, in such wise that the handing over should already have taken place and the
    first instalment of the purchase price should already have been paid, but the resolution in question
    should then turn out'
- page: 5
  en: 'in the negative, then the contracting parties have agreed, to avoid all [uncertain: disputes] concerning
    the revenues raised, that the purchasers shall retain this estate in possession for one year, namely
    until 14 days after St John''s Day 1804, by way of lease, but shall on the other hand pay for this
    year a lease sum of 800 rtl., say eight hundred Reichsthaler, to the seller, and shall also discharge
    all public dues concerning this estate, by whatever name they may be called, upon their own responsibility,
    without being permitted to bring anything to account against the seller for them; and in this last
    case the purchasers renounce each and every other remission and other demands, by whatever name they
    may be called, but bind themselves, under the readiest execution, to vacate the estate of Witów 14
    days after St John 1804 in good husbandry condition, and submit themselves in this'
- page: 6
  en: 'regard to the process of execution with all its legal consequences; yet it is of course understood
    that in this case, upon the vacating of the estate, the 4000 rtl. paid must be repaid to them by the
    seller, after deduction of the stipulated lease rent of 800 rt and of such public dues and costs as
    they could not show to have been paid at their departure.


    8. The estate shall be handed over to the purchasers with the winter and summer sowing fully put in,
    and the purchasers herewith declare that they accept the winter sowing as duly put in, and only await
    the like with regard to the summer crop.


    9. The documents concerning this estate shall be handed out to the purchasers immediately upon the
    arrival of the consent to their acquisition [uncertain: Frühige].


    10.'
- page: 7
  en: '10. Finally, the contracting parties renounce all objections and evasions running counter to these
    heads of purchase, by whatever name they may be called, in particular the purchasers renounce the
    objection of injury in and beyond the half, and in the event of non-performance or [uncertain: non-fulfilment]
    of this contract they set a vadium or conventional penalty of 1000 rtll, say one thousand Reichsthaler,
    which the contravening party shall be bound to pay to the other, and nevertheless to perform the contract.


    11. The costs of this contract both parties assume by halves; those of the settlement of the titulus
    possessionis in the purchasers'' names, the latter alone.


    Both parties have, after they themselves had read through these heads of purchase, which were explained
    to the co-purchaser von Kwasiborski by his partner Honrichs in the Polish tongue, upon prior'
- page: 8
  en: 'approval executed them with


    their own hand-written


    name-signatures.


    Kalisz, the 21st of April 1803. At the signing both parties observed to me that with regard to the
    buildings standing on the village mayor''s holding, which the tenants there claim to have built themselves,
    no warranty of title is granted to the purchasers by the seller, but that in case the tenants'' statement
    should be correct, the purchasers will have to come to a separate settlement with them on that account.


    Done as above. Christian Friedrich Rochlitz. Martin Honrichs.


    Walęty von Kwasiborski


    Carl Anton Grimm


    Stanisław Szymanowski


    as witness. The 6000 rl., six thousand Reichsthaler of purchase money payable to me at the term of
    Christmas of this year in accordance with the foregoing heads of purchase, likewise, out of the 6000
    rt payable at the term of Midsummer 1804, a sum of two thousand Reichsthaler, with priority before
    the residue, also with all rights'
- page: 9
  en: 'and without novation, and with the lien to be stipulated in the instrument of sale to be drawn
    up hereafter and to be intabulated upon the entry of the title of possession, and with interest at
    5 per cent from St John of the current year onward, I hereby cede to the banker here, Carl Ferdinand
    Weigel. I acknowledge to have received the value of this cession from him in cash and duly.


    I also promise to procure for the banker Weigel the debtors'' consent to this cession as soon as possible.
    Breslau, the 26th of April 1803. Friedrich Ludwig, Prince of Hohenlohe, read and approved by myself.
    The foregoing cession, receipt for the value, and the promise to procure the consent of the debtors
    I accept in the name and as partner of my father Carl Ferdinand Weigel. Breslau, the 26th of April
    1803. I have read and approved this. Carl Gottlieb Weigel, in the name and as partner of his father
    Carl Ferdinand Weigel. That the foregoing cession and receipt for the'
- page: 10
  en: 'value by His Most Serene Highness Friedrich Ludewig, reigning Prince of Hohenlohe-Ingelfingen,
    and the acceptance declared by the merchant Carl Gottlieb Weigel, in the name and as partner of his
    father Carl Ferdinand Weigel, were executed under today''s date before the Justice Office of the Princely
    Ladies'' Foundation of St Vincent, to which office they are personally well known, after the reading
    through had taken place and approval had been declared, by their own hand-written name-signatures
    and appended seals, both upon this original punctation and upon the vidimated copy of the same issued
    to the cessionary, is hereby attested on the ground of the protocol [illegible] taken up thereon.
    Breslau, the 26th of April 1803. The Justice Office of the Princely Ladies'' Foundation of St Vincent


    [L. S.]


    Büchler'

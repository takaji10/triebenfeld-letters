status: draft
segments:
- page: 1
  en: 'E. W. v. Rösch. Between the special Bevollmächtigter of thine High Princely Serene Highness the
    reigning Lord Fürst zu Hohenlohe Ingelfingen, Herr Forest-Inspector Rochlitz, as seller of the one
    part, and Herr Martin Honrichs and Herr Valentin v. Kwasieborski, as purchasers of the other part,
    the following Punctation has, under today''s date and after mature deliberation, been agreed and concluded
    for the purpose of a formal judicial contract of purchase and sale to be concluded hereafter concerning
    the noble estate Witow.


    The said Herr Forest-Inspector Rochlitz sells, in the name of his High Princely Serene Highness the
    reigning Lord Fürst zu Hohenlohe Ingelfingen, of the Most Highly Mentioned his Lord Principal, the
    noble estate situated in the Royal South Prussian Kalisch Government Department and in its Warta district,
    namely the village and Scholtisey Witow with all appurtenant rights and privileges, nothing thereof
    excepted, just as the same was, pursuant to the Most High deed of donation [uncertain: DonctionsUmlünde]
    of the most blessed King Frie-'
- page: 2
  en: 'drich Wilhelm the Second, conferred upon Colonel v. Schlieben, and by his widow and heirs, pursuant
    to the judicial contract of purchase of the 22nd of October 1799, made over in property to thine High
    Princely Serene Highness; [sells it] to the said Herr Martin Honrichs and Valentin v. Kwasieborski,
    and that for a purchase price, well and deliberately agreed and determined between the contracting
    parties, of 16000 rt, write sixteen thousand Reichsthaler Prussian Courant.


    2: This purchase price the purchasers bind themselves to pay in solidum, that is to say the one for
    both and both for the one, to his High Princely Serene Highness in the following instalments, namely
    at Johann Baptiste of the current year 4000 Rt, say four thousand Reichsthaler; at Christmas of the
    current year 6000 rtl., say six thousand Reichsthaler; and at Johanni 1804 the remainder with 6000
    rt., say six thousand Reichsthaler; but until the complete payment of the arrears to pay interest
    thereon at 5 per cent.


    3. His High Princely Serene Highness grants the purchasers eviction-warranty only for the parcels
    actually held in possession and to be handed over to them at the'
- page: 3
  en: 'delivery of possession. In respect of those 1016 Skladen of arable which may be evicted by the
    burghership of Warta, and which is not in the possession of thine High Princely Serene Highness, no
    eviction-warranty is given; rather it is the purchasers'' affair alone to vindicate the said fields
    at their own entire risk and cost, against which, however, thine High Princely [Serene Highness] renounces
    all claims upon the purchasers should they in fact recover these Skladen of arable, whether wholly
    or in part, against the burghership of Warta.


    4. The delivery of this sold estate to the purchasers shall take place 14 days after Johanni of the
    current year, at which time also, hand to hand [zug und zur], the first instalment of the 4000 rtll.
    must be paid, since before this is done the delivery cannot take place.


    5. At this delivery there shall be handed over along with it that grain [uncertain: zuverloren] and
    the livestock and implements which are found upon the estate'
- page: 4
  en: 'and which is specified in the judicial deed of delivery on the part of the tenant Knoblauch to
    v. Bloch of Blotniz of the 10th and 11th of July of the past year, exclusive of the plus Inventarii
    in horses and oxen taken away at that time by Knoblauch according to the Recess of the 11th of July,
    which for that very reason are no longer to be found upon the estate and for that very reason cannot
    be handed over with it.


    6. The Lord Seller promises to procure the consent to the purchasers'' acquisition of this estate
    if possible at the latest by Johann of the current year; should the same not be forthcoming, however,
    the purchase in question falls to the ground.


    7. Should the final resolution concerning the consent in question be delayed longer than 14 days after
    Johann of the current year, in such wise that the delivery has already taken place and the first instalment
    of the purchase price has already been paid, but the resolution in question should then turn out'
- page: 5
  en: 'unfavourably, then the contracting parties, in order to avoid all disputes concerning the revenues
    drawn, have agreed as follows: that the purchasers shall retain this estate in possession for one
    year, namely until 14 days after St. Johanni 1804, by way of lease, but shall for this year pay to
    the Lord Seller a lease sum of 800 rtl., say eight hundred Reichsthaler, and shall likewise discharge
    all public dues concerning this estate, by whatever name they may be called, upon their own account
    [Competenz ex Propriet], without being permitted to bring anything into account against the Lord Seller
    therefor; and the purchasers renounce, in this last case, any and every remission and other demand
    whatsoever, by whatever name they may be called, and bind themselves, under the readiest execution,
    to vacate the estate Witow 14 days after Johann 1804 in good husbandlike condition, and submit themselves
    in this'
- page: 6
  en: 'regard to the executive process with all its legal consequences; it being however understood of
    itself that in this case there must be repaid to them by the Lord Seller, upon the vacating of the
    estate, the 4000 rtl. paid, after deduction of the stipulated lease-rent of 800 rt and of such public
    dues and costs as they could not show to have been paid at their departure.


    8. The estate shall be handed over to the purchasers with the winter [uncertain: Vater] and summer
    sowing fully put in, and the purchasers herewith declare that they accept the winter sowing as duly
    put in, and only expect the like in respect of the summer sowing.


    9. The documents concerning this estate shall be extradited to the purchasers immediately upon the
    arrival of the consent to their acquisition [uncertain: Frühige].


    10.'
- page: 7
  en: '10. Finally the contracting parties renounce all objections and evasions running counter to this
    Punctation of purchase, by whatever name they may be called, and in particular the purchasers renounce
    the plea of injury in and beyond the half [laesio enormis], and set, for the case of non-performance
    or non-fulfilment of this contract, a vadium or conventional penalty of 1000 rtll., say [uncertain:
    sie] thousand Reichsthaler, which the contravening party shall be bound to pay to the other and nevertheless
    to fulfil the contract.


    11. The costs of this contract both parties take upon themselves by halves; those of the rectification
    of the Titulus Possessionis in the purchasers'' names, the latter alone.


    Both parties have, after previous approval, this Punctation of purchase read out by themselves, which
    was explained to the co-purchaser v. Kwasiborski by his socius Honricht in the Polish tongue, after
    previous'
- page: 8
  en: 'approval, executed with their own-hand signatures.


    Kalisch, the 21st of April 1803. — Upon the signature both parties remarked to me that in respect
    of the buildings standing upon the Scholtisey, which the tenants there claim to have built themselves,
    no eviction-warranty is given to the purchasers by the Lord Seller, but that, in case the tenants''
    statement should be correct, the purchasers must come to a separate settlement with them on that account.


    Done as above.

    Christian Friedrich Rochlitz

    Martin Honrichs

    Walęty v Kwasiborski

    Carl Anton Grimm

    Stanisław Szymanowski

    as witness.


    The 6000 rl., six thousand Reichsthaler of purchase-money payable to me at the term of Christmas of
    this year according to the foregoing Punctation of purchase, and likewise, of the 6000 rt payable
    at the term of Johannis 1804, a sum of two thousand Reichsthaler, with priority before the residue,
    and also with all rights'
- page: 9
  en: 'and without novation, and with the pledge-right to be stipulated in the instrument of purchase
    hereafter to be drawn up and to be intabulated upon the entry of the title of possession, and with
    interest at 5 per cent from Johannis of the current year, I hereby cede to the banker here, Herr Carl
    Ferdinand Weigel. I acknowledge to have received the valuta of this cession from him in cash and duly.


    I also promise to procure for Herr Banker Weigel the debtors'' consent to this cession as soon as
    possible. Breslau, the 26th of April 1803. Friedrich Ludwig Fürst zu Hohenlohe. Read and approved
    by myself. — The foregoing cession, receipt for the valuta and the promise to procure the consent
    of the debitores I accept in the name and as partner of my father Carl Ferdinand Weigel. Breslau,
    the 26th of April 1803. I have read and approved this. Carl Gottlieb Weigel, in the name and as partner
    of his father Carl Ferdinand Weigel. — That the foregoing cession and receipt for the'
- page: 10
  en: 'valuta, on the part of His High Princely Serene Highness Herr Friedrich Ludewig, reigning Fürst
    zu Hohenlohe-Ingelfingen, and the acceptation declared by the merchant Herr Carl Gottlieb Weigel in
    the name and as partner of his father Herr Carl Ferdinand Weigel, were executed under today''s date
    before the Justice-Office of the Princely Ladies'' Foundation at St. Vincenz, to which the same are
    personally well known, after due reading through and declared approval, by their own-hand signatures
    and appended seals, as well upon this original Punctation as upon the vidimated copy of the same delivered
    to the Herr Cessionarius — this is hereby attested on the ground of the protocol [uncertain: ..ors]
    taken up thereon. Breslau, the 26 April 1803. The Justice-Office of the Princely Ladies'' Foundation
    at Vincenz.


    [L. S.]


    Büchler'

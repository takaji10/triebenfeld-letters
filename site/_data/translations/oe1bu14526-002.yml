- page: 3
  en: 'delivery of possession. In respect of those 1016 składy of arable which may be evicted at the suit
    of the burgesses of Warta, and which are not in the possession of His Most Serene Highness, no warranty
    of title is afforded; rather it remains the purchasers'' affair alone to vindicate the said fields
    at their own entire risk and cost, against which, however, His Most Serene Highness relinquishes all
    claims as against the purchasers, should they in fact recover these składy of arable against the burgesses
    of Warta, whether in whole or in part.


    4. The handing over of this sold estate to the purchasers shall take place 14 days after Midsummer
    of this year, at which time, concurrently and against each other, the first instalment of the 4000
    rtll. must be paid, since until this is done the handing over cannot take place.


    5. At this handing over there shall be handed over as well such ground [text as transcribed: "Grund
    zuverloren"] and livestock and implements as are found upon the estate'

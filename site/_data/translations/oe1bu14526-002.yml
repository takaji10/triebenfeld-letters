- page: 2
  en: '-drich Wilhelm the Second, conferred upon Colonel von Schlieben, and by his widow and heirs, pursuant
    to the judicial contract of purchase of 22 October 1799, conveyed to His Most Serene Highness — to
    the said Martin Honrichs and Valentin v. Kwasieborski, and this for a purchase price deliberately
    agreed and fixed between the contracting parties of 16000 rt, in words sixteen thousand Reichsthaler
    Prussian Courant. 2: this purchase price the purchasers bind themselves to pay in solidum, that is
    to say, one for both and both for one, to His Most Serene Highness in the following instalments, namely
    at St John the Baptist of this year 4000 Rt, say four thousand Reichsthaler; at Christmas of this
    year 6000 rtl., say six thousand Reichsthaler; and at Midsummer 1804 the remainder with 6000 rt.,
    say six thousand Reichsthaler; and until the arrears are fully paid, to pay interest on the same at
    5 per cent.


    3. His Most Serene Highness affords the purchasers warranty of title only for those parcels of land
    actually held in possession and to be handed over to them at the'

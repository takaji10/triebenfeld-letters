  en: 'approval, executed the same with their own signatures manual.


    Kalisz, 21 April 1803. At the signing, both parties observed to me that, in respect of the buildings
    standing upon the village mayor''s holding, which the tenants there claim to have built themselves,
    no warranty of title is afforded to the purchasers by the seller; but that, in case the tenants''
    statement should prove correct, the purchasers must come to a separate settlement with them on that
    account.


    Done as above. Christian Friedrich Rochlitz. Martin Honrichs.


    Walęty v. Kwasiborski


    Carl Anton Grimm


    Stanisław Szymanowski



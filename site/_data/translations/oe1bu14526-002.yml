- page: 4
  en: 'and is specified in the judicial deed of transfer on the part of the tenant Knoblauch to von Bloch
    of Blotniz of 10 and 11 July of last year, excluding the surplus inventory in horses and oxen taken
    away at that time by Knoblauch pursuant to the deed of 11 July, which for that very reason are no
    longer to be found upon the estate and for that very reason cannot be handed over with it.


    6. The seller promises to procure the consent to the purchasers'' acquisition of this estate if possible
    at the latest by St John''s of this year; should the same however not be forthcoming, then the present
    purchase falls away.


    7. Should the final resolution regarding the said consent be delayed longer than 14 days after St
    John''s of this year, in such wise that the handing over has already taken place and the first instalment
    of the purchase price has already been paid, but the resolution in the matter should then turn out'

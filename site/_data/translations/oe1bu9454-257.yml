- page: 1
  en: '257 Your Right Honourable has noted in your representation of the 23rd of October of this year:


    that the Prince of Hohenlohe undertook in the Settlement of 1811 to pay himself the capital of [uncertain:
    5]00/m owed to the Courland heirs, and to [illegible] the Countess from the joint obligation. I therefore
    most respectfully request you, since I cannot find the passage, to be so good as to mark it in the
    enclosed Settlement with red chalk or otherwise, and then kindly to send it back to me by the bearer.
    Commending myself most respectfully,


    [illegible]aumann[illegible]


    [text lost] 7 October 1814'

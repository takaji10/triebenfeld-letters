segments:
- page: 1
  en: 'Your Right Honourable have, in your representation of the 23rd of [uncertain: Ors.] of this year,
    observed: that the Prince of Hohenlohe did, in the Settlement of 1811, undertake to pay himself the
    capital owed to the Courland heirs of [text lost] 500000[uncertain] and to [uncertain: relieve] the
    Lady Countess of her joint obligation for — I therefore most respectfully request you, since I cannot
    find the passage in the enclosed Settlement, to be so obliging as to mark it with red chalk or otherwise,
    and thereupon most kindly to send it back to me by the bearer. Commending myself most respectfully,
    Gruemann[uncertain] herein, the 7th of Oct. 1814'

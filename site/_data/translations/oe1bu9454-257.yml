segments:
- page: 1
  en: 'Your Right Honourable have observed in your representation of the 23rd of the [uncertain: present]
    month of this year:


    that the Prince of Hohenlohe, in the settlement of 1811, undertook to pay himself the capital sum
    owing to the Courland heirs of [text lost] 500000[uncertain] and to [uncertain: relieve] the Countess
    of the joint obligation. I therefore most respectfully request that you be so kind as to mark the
    passage in the enclosed settlement with red chalk or otherwise, since I cannot find it, and then graciously
    send it back to me by the bearer. Commending myself most respectfully,


    Gruemann[uncertain]


    therein, the 7th of October 1814'

segments:
- page: 1
  en: 'Most Serene Prince.


    Most gracious Lord!


    To Your Most Serene Highness I [give] most humble [thanks] for the information which Your Highness
    has been pleased to impart to me in the matter of the exchange of estates. It is withal an infinite
    joy to me that His Majesty has ordered the further investigation that was proposed, and I most humbly
    assure Your Highness that in the further pursuit of this matter I shall observe my duties just as
    conscientiously as hitherto, and shall accordingly leave no avenue untried which may be capable of
    reconciling the wishes of Your Most Serene Highness, the inclination of my Lord to meet them, and
    the interest of the State with one'
  names:
  - de: Ew Hochfürstlichen Durchlaucht
    en: Your Most Serene Highness
    kind: other
- page: 2
  en: 'another. To this assurance I add the protestation of the most boundless reverence, wherewith I
    remain, my whole life long, Your Most Serene Highness''s most humble and obedient servant Beyme


    Berlin


    the 17th of December


    1798.'

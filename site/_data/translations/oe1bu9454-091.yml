  en: '91


    Most Serene Prince.


    Most gracious Lord.


    To Your Most Serene Highness I return my most humble thanks for the explanations which Your Highness
    has been pleased only to impart in the matter of the exchange of estates. It is withal an infinite
    joy to me that His Majesty has ordered the further investigation that was proposed, and I most humbly
    assure that in the further prosecution of this matter I shall observe my duties just as conscientiously
    as heretofore, and accordingly shall leave no expedients [uncertain: unbringt] which may be capable
    of reconciling the wishes of Your Most Serene Highness, the inclination of my Lord to meet them, and
    the interest of the state with'

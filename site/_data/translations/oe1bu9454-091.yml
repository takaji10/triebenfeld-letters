status: draft
segments:
- page: 1
  en: 'Most Serene Prince. Most gracious Lord! To Your Most Serene Highness I render most humble thanks
    for the elucidations which You have been pleased only to impart in the matter of the exchange of estates.
    It is withal an infinite joy to me that His Majesty has ordered the further investigation which was
    proposed, and I most humbly give assurance that in the further pursuit of this matter I shall observe
    my duties just as conscientiously as hitherto, and shall therefore also leave no expedient [uncertain:
    unattempted] which shall be capable of reconciling with one another the wishes of Your Most Serene
    Highness, the inclination of my Lord to meet them, and the interest of the State.'
- page: 2
  en: '...will be able to reconcile with one another. To this assurance I add the protestation of the
    most unbounded reverence, wherewith I remain lifelong Your Most Serene Highness''s most humble and
    obedient servant Beyme Berlin, the 17th of December 1798.'

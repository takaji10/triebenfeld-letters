- page: 2
  en: 'In the calmest tone B. began: listen, Triebenfeld — you were the one man whom I greatly esteemed;
    I allowed it to happen that you [uncertain: dedicated] the papers to my Antonette — but now do not
    take it ill of me — I must return that to you at once, for you are going about with neck-breaking
    things. Know that if the Prince learns of this, you will sit in a dungeon, and if he knew that I had
    so much as mentioned it, he would thrust me from him with his feet and I should be infamously disgraced.
    He must indeed be a worse hellish beast than all the devils that are painted for us, who would impute
    such baseness to the most honest of all men, and would swindle people on his account. I had to employ
    every possible eloquence to calm him again; for a few days he would not let himself be seen at all,
    and only when I showed him Your Serene Highness''s instruction signed in your own hand, and had assured
    him upon my honour that I had not yet said a word of the 30000 to any mortal soul, was the confidential
    intercourse between us restored.


    O how unhappy I might have become through this! But now Heaven has made it up to me, and Koschentin
    will nevertheless be sold just as well and more securely to a private man. The wealthy Count Pourtales,
    brought up with Barbe in Neufchatel, has sold his English and French possessions for more than 3 millions
    in cash; now he is on the point of also disposing of his [uncertain: Schwarzerischen] estates for
    cash, and since the King has treated him with such distinguished favour in Neufchatel, he wishes to
    bring his great fortune into our country and to purchase in Silesia. He has asked Barbe to help him
    to substantial estates. I put Koschentin before B. — B. has himself made an extract from the valuations
    and statistical tables, and has sent it to him by a courier just then despatched thither. Thus he
    has portrayed everything in such a way that the matter may be regarded as done. It is a [illegible]
    once traded a thousand d. was demanded, thus there are'

- page: 1
  en: '264 Now, most gracious Prince and Lord, something which I wish to be kept as in a sealed grave
    — I must begin here in this way, which you, most gracious Lord, will be pleased to forgive, because
    you are too ready, when you hear something good, to confide it at once to this person and that, and
    in the plan which follows that would be very damaging, and would bring the whole thing to wreck.


    What is concerned here is the Koszęcin affair, which, had I proceeded with it according to your will,
    and blundered straight in as I was to do, could have plunged me and Your Serene Highness into the
    greatest ruin.


    Anxious and full of doubt whether the Prince of Hardenberg [text lost] could be bought for money,
    I touched on the matter very softly and from a distance. An abridged answer, that there could be no
    talk of it at present, kept me between fear and hope. At that time I heard, in secret, that the King
    will no longer tolerate either exchange or purchase of estates, because a great many estate-holders
    in Poland would have to abandon their property for the Bayonne sums, out of which in the end nothing
    but domains were to be created — In my distress I disclosed to Court Councillor Barbe my plan concerning
    Koszęcin, which however now already turned out otherwise, because I had mixed in the Courland debt,
    for the discharge of which the King is now advancing the money.


    I did not conceal from him that a present of 30,000 Rthl had been demanded from Your Serene Highness
    for the Prince of Hardenberg, so that the Prince Chancellor should let the matter be done quickly.
    I told B. that you had agreed with Weigel and Stössel that each would give 10,000 Rthl — Calmly B.
    rose and asked, who then proposed it, and does the Prince really know of it, and will he accept the
    30,000 Rthl?


    To all this I could answer nothing further than that of the latter I knew nothing, that I had only
    been given the instruction from Your Serene Highness to see to the sale of Koszęcin in the aforesaid
    manner.


    Of estates'

- page: 3
  en: 'Your Serene Highness will still come out with 38,000 Rthl, apart from what may perhaps further
    be gained on the capital deductions, and what I hold to be of consequence in the case of [uncertain:
    pranzte] ready payment — Barbe has told him that the arrears of interest would lapse in his favour,
    and also that he would find large stocks on hand, so that the estates would really cost him not much
    more than 900,000 Rthl in ready money — Barbe has said once again that the matter is as good as concluded
    — Money these people have in abundance, and they are very enterprising — for the other Pourtalès too
    wishes to purchase here in our states — I have now promised Barbe, who really deals most honestly
    in Your Serene Highness''s affairs, the 30/m Rthl, as soon as the purchase should come about in that
    manner with Count Pourtalès — Have the goodness now, gracious Prince, to send me at the very furthest
    this written undertaking. As soon as the sale of the Koszęcin, Boronów and [uncertain: Cieszowa] estates
    should come about in the manner agreed with the Lord Count of Pourtalès, I the undersigned shall pay,
    immediately upon the conclusion of the contract, to any bearer of this written undertaking, the sum
    of thirty thousand Rthl in Royal Prussian 64-piece Courant — and from the moment of the sale of the
    above-named estates to Count Pourtalès this written undertaking shall be regarded as a true bill of
    exchange.


    Sławięcice


    January 1815 [Locus Sigilli] Friedrich Ludwig, Prince of Hohenlohe'

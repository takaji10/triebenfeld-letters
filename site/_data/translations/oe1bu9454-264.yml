- page: 3
  en: 'still 38000 Rthl left over for Your Serene Highness, apart from what may perhaps yet be gained
    on the deductions of capital, and what I hold to be considerable in the case of [uncertain: prompt]
    payment in cash. B. has told him that the arrears of interest would fall away to his advantage, and
    also that he would find large stocks in hand, so that the estates would really cost him not much more
    than 900000 Rthl in cash. He has said once again that he holds the matter for, or as, concluded. Money
    these people have in abundance, and they are very enterprising; for the other Pourtales likewise wishes
    to purchase here in our states.


    I have now — note well — promised the 30000 Rthl to him who is truly negotiating very honourably in
    Your Serene Highness''s affairs, as soon as the purchase should come about in that manner with Count
    Pourtales. Have now the goodness, gracious Prince, to send me this written undertaking by the [uncertain:
    earliest possible] means. As soon as the sale of the Koschentin, Boronow and [uncertain: Cieschow]
    estates should come about with the Lord Count of Pourtales in the manner agreed, I, the undersigned,
    shall pay, immediately upon the conclusion of the contract, to each bearer of this written undertaking
    the sum of thirty thousand [uncertain: riding] in Royal Prussian 64-piece Courant — and from the moment
    of the sale of the above-named estates to Count Pourtales this written undertaking shall be regarded
    as a true bill of exchange.


    Schlawenschitz


    January 1815


    [Locus Sigilli] F. L. P. of Hohenlohe'

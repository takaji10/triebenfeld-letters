- page: 2
  en: 'In the calmest tone B. began: listen, Triebenfeld, you were the one man whom I greatly esteemed;
    I allowed it to happen that you ceded the papers to my Antonette — but now do not take it ill of me
    — I must return that to you at once, for you are dealing in neck-breaking matters — Know that if the
    Prince learns of this you will sit in a dungeon, and if he knew that I had merely brought it forward,
    he would thrust me from him with his feet and I should be infamously done for — He must indeed be
    a worse hellish beast than all the devils that are ever painted for us, who would impute such baseness
    to the most honest of all men, and mean to swindle people on his account — I had to employ every possible
    eloquence to pacify him again; meanwhile he did not let himself be seen for a couple of days, and
    only when I showed him the instruction signed in Your Serene Highness''s own hand, and had assured
    him on my honour that I had not yet said a word of the 30/m Rthl to any mortal soul, was the confidential
    intercourse between us restored —


    Oh how unhappy I might have become through this — But now heaven has compensated me for it, and Koszęcin
    will after all be sold just as well and more securely to a private man — The rich Count Pourtalès,
    brought up with Barbe in Neuchâtel, has sold his English and French possessions for more than 3 millions
    in ready money; now he is on the point of disposing of his Schwarzer estates also for ready money,
    and since the King has treated him at Neuchâtel with such distinguished favour, he wishes to bring
    his great fortune into our country and to purchase in Silesia — He has asked Barbe to help him to
    estates of consequence — I have put Koszęcin before Barbe — Barbe has himself made an extract from
    the valuations and the statistical tables, and has sent it to him by a courier just then despatched
    thither — Barbe has depicted everything in such a way that the matter may be regarded as done — A
    [uncertain: Mitlein Einmahl handlet] thousand Rthl has been demanded, whereupon there remain'

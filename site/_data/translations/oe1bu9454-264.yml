- page: 1
  en: 'Now, Most gracious Prince and Lord, something which I wish to know kept as though in a sealed grave
    — I must begin here in this way, which only you, most gracious Lord, will be so good as to forgive,
    because you are all too ready, when you hear something good, to confide it at once to this person
    and that, and that would be very damaging to the plan set out below, and would make the whole thing
    founder.


    The matter here concerns the Koschentin affair, which, had I proceeded with it according to your will
    and simply blundered straight in, could have plunged both myself and Your Serene Highness into the
    greatest ruin.


    Anxious and full of doubt as to whether the P. Ho: were to be bought for money, I touched upon the
    matter very softly and from a distance. A curt reply, that there could be no talk of it now, held
    me between fear and hope. At that time I heard, in confidence, that the King would tolerate neither
    exchange nor purchase of estates any longer, because a great many estate holders in Poland would,
    on account of the Bayonne sums, have to abandon their property to its fate, out of which in the end
    nothing but domains were to be created. In my distress I disclosed my plan regarding Koschentin to
    the Court Councillor Barbe, which, however, now turned out otherwise, because I had mixed in the Courland
    debt, for the discharge of which the King is now advancing the money.


    I do not conceal from him that a present of 30000 Rthl for the Prince Hard: had been demanded of Your
    Serene Highness, so that the E. K. would let the matter be done quickly. I told B. that you had agreed
    with Weigel and Stössel that each of them would give 10000 Rthl.


    Calmly ß rose and asked, who then has proposed it, and does the Prince really know of it, and will
    he accept the 30000 M?


    I could answer nothing further to all this than that of the latter I knew nothing, and that I had
    only been given the instruction from Your Serene Highness to see to the sale of the Koschentin estates
    in the manner aforesaid.


    Of estates'

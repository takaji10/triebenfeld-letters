status: draft
segments:
- page: 1
  en: 'And now, Most gracious Prince and Lord, something that I would wish kept as in a sealed grave —
    I must begin here in this way, which You, most gracious Lord, will only be pleased to forgive, because
    You are all too ready, when You hear something good, to confide it at once to this person and that,
    and in the following plan that would be most harmful, and would bring the whole thing to wreck. It
    concerns here the Köschentin affair, which, had I proceeded with it according to Your will, and had
    blundered straight in that way, could have plunged me and Your Serene Highness into the greatest ruin.
    Ever anxious and full of doubt whether the F. Ho: were to be bought for money, I touched upon the
    matter very softly and from afar. A curt answer, that there could be no talk of it at present, held
    me between fear and hope. Meanwhile I heard, in confidence, that the King tolerates neither exchange
    nor purchase of estates any longer, because very many estate-holders in Poland would have to abandon
    their property for the Bayonne sums, out of which in the end nothing but domains were to be created.
    In my distress I disclosed my plan regarding Koschentin to the Court Councillor Barbe, which however
    now turned out otherwise, because I had mixed in the Curian debt, for the discharge of which the King
    now advances the money. I did not conceal from him that a present of 30000 Rthl had been demanded
    from Your Serene Highness for Prince Hardenberg, so that the E. K. would let the matter be done quickly.
    I told B that You had come to an agreement with Weigel and Stössel that each would give 10000 Rthl.
    Calmly ß rose and asked, who then has proposed this, and does the Prince really know of it, and will
    he accept the 30000 M? To all this I could answer nothing further than that of the latter I knew nothing,
    that I had only been given the instruction from Your Serene Highness to procure the sale of the Koschentin
    estates in the aforesaid manner. Of estates'
- page: 2
  en: 'In the calmest tone B began: hear me, Triebenfeld: You were the one man whom I greatly esteemed,
    I let it pass that you [uncertain: dirtest] the papers to my Antonette — but now do not take it ill
    of me — I must return that to you at once, for you are dealing in neck-breaking things. Know that
    if the Prince learns of this you will sit in the dungeon, and if he knew that I had so much as raised
    it, he would spurn me from him with his feet and I should be infamously [uncertain: confirt]. That
    must indeed be a worse hellish beast than all the devils that are ever painted for us, who would impute
    such baseness to the honestest of all men, and would seek to cheat people on his account. I had to
    employ every possible eloquence to appease him again; however, he did not let himself be seen for
    a couple of days, and only when I showed him Your Serene Highness''s instruction signed in Your own
    hand, and had assured him upon my honour that I had not yet said a word of the 30000 to any mortal,
    was the confidential intercourse between us restored. O how unhappy I might thereby have become. But
    now Heaven has made it up to me, and Koschentin will nevertheless be sold just as well and more securely
    to a private man. The rich Count Pourtales, brought up with Barbe in Neufchatel, has sold his English
    and French possessions for more than 3 millions in cash; now he is on the point of disposing of his
    Schwarzer estates too for cash, and since the King has treated him in Neufchatel with such distinguished
    favour, he wishes to bring his great fortune into our country and to buy himself in in Silesia. He
    has asked Barbe to help him to substantial estates. I have proposed Koschentin to B — B has himself
    made an extract out of the valuations and statistical tables, and has sent the same to him by a courier
    just then dispatched thither. Thus everything has been so represented that one may regard the matter
    as done. It is a [uncertain: Mitlein] once dealt a thousand d. has been demanded, so that there will
    be received'
- page: 3
  en: 'Your Serene Highness still 38000 Rthl over and above, apart from what may perhaps still be gained
    on the capital deductions, and what I hold to be considerable in the case of prompt cash payment.
    B has told him that the arrears of interest would fall away in his favour, and also that he would
    find large stocks on hand, so that the estates would really cost him not much more than 900000 Rthl
    in cash; he has said once again that he holds the matter as good as concluded. Money these people
    have in abundance and they are very enterprising — for the other Pourtales too wishes to buy himself
    in here in our states. I have now — NB he who truly acts most honestly in Your Serene Highness''s
    affairs — promised the 30000 Rthl, as soon as the purchase should come about in this manner with Count
    Pourtales. Be so good then, gracious Prince, as to send me by the very [uncertain: allerweitigste]
    this written undertaking:


    As soon as the sale of the Koschentin, Boronow and Cieschow[?] estates should come about in the manner
    agreed with the Herr Count von Pourtales, I, the undersigned, will pay, immediately upon the conclusion
    of the contract, to any holder of this written undertaking, the sum of thirty thousand Rthl in Royal
    Prussian 64-piece Courant — and from the moment of the sale of the above-named estates to Count Pourtales,
    this written undertaking shall be regarded as a true bill of exchange. Schlawenschitz, January 1815
    [Locus Sigilli] F. L. F zu Hohenlohe'

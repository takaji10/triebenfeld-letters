status: draft
segments:
- page: 1
  en: 'Most Serene Prince. Most gracious Prince and Lord! Your Most Serene Highness I have not only answered
    promptly upon each of Your Most High letters, but have also dispatched several further letters most
    high [text unclear in German: "am höchst die abgehen laßen"]. I am therefore in anxiety whether letters
    have not nevertheless again been intercepted. With regard to my journey to Holland and Paris a small
    alteration has occurred: I must first go to Wirr, and when I return from the 2nd by way of Königsberg
    I am then to go first to H. and Paris. The detour I must make shall not deter me from laying myself
    here at Serene Highness''s feet in Öhringen. As concerns the loan business, I know of nothing more
    considerable and more advantageous than this — for if one gives Your Serene Highness the 250000 Rthl
    upon the Zagorowo mortgage, then you can purchase 750000 Rthl of paper therewith and pay off your
    entire debts with it. The mortgage need only be ceded judicially, and since it depends upon one''s
    obtaining the monies in part beforehand, I will stand surety for it with all my landed properties,
    for it is necessary that one obtain some money beforehand in order to buy the papers and hand these
    over to the creditors so as to compel them to a speedy cancellation. Oppenheimer known, who about
    28000 Rthl in Courant, the Invalids'' Fund for their 50000 — 15000 — Meyer Bernhard and the trifles
    concerning 3000, are together an advance of 46000 Rthl; for this, then, the mortgage of 250000 Rthl
    is quite clear. For Your Serene Highness there would accordingly remain some 204000 Rthl. My deferential
    counsel would then be that Serene Highness should indeed have 300000 Rthl of negotiation-obligations
    bought for 90000 Rthl, and pay off to the King the Lursch 300000 Rthl; thus you would gain 210000
    Rthl and might be able, for the sake of this matter, to give a good word — Just so you could discharge
    all household and other small debts, still keep for yourself a considerable sum, and be able to look
    at everyone over the shoulder. As regards the security of the creditors who give the loan, the mortgage
    of 250000 Rthl serves, and the statement I have given, which I guarantee with my goods. New valuations'
- page: 2
  en: 'cannot at present be drawn up at all, because there everything is in the greatest confusion; the
    old ones are too low and are now worth nothing further, because through the dismemberment that has
    been begun everything has come into another situation. Concerning your affair at Court I can now disclose
    to you, and to Prince August, whom I shall await here yet, a good deal alone. Your Serene Highness
    has many enemies, and you are kept away deliberately so that the S. may talk themselves clear and
    shift the blame onto Your Most High Self — I had everything in the best track. Only when the M. St.
    withdrew did the matter at once take on another aspect, and even those who before had worked zealously
    — drew back. Now something is afoot; if that succeeds, then everything will yet turn out for the best.
    Prince August, then, I shall await yet; on the 14th I go to W:, and for the sake of Your Serene Highness''s
    affair I shall arrive back here in 12 days — from here I go in haste to Königsberg; if I find that
    something can be done in the loan business, then I come from here directly[?] to Öhringen — discuss
    everything there, hasten from thence to Paris, and send merely a merchant to Holland, who is to see
    to everything there and bring me the news to Paris; and if then my presence in Holland is not urgently
    necessary, I shall go from Paris back to Öhringen to help arrange everything, and then I go again
    to K., where I shall no doubt learn the rest — the most galling thing for me now is the pressing want
    of money. It does not know whence I am to take all the travelling costs. — From the King I take nothing
    whatever, and I do not stop halfway. What I have begun, and have pursued so laboriously up to this
    point amid a thousand obstacles, must absolutely be carried through. This very day I have borrowed
    4000 Rthl in Münze in order to pay the still outstanding 2000 Rthl together with interest to the von
    der Lahr, arising from that accursed Invalid affair. — I cannot lend this. When Your Serene Highness
    has happily [set] your affairs in order, you would have to [give] me the first. For the 4000 Rthl
    in Münze I have obtained 2200 Rthl Courant, and this I must hand over to the vampire of a banker.
    (and should have to write to pay in 6 months Courant marvellously) If the war does not break out too
    quickly, the French Government has promised me military assistance in order to collect the arrears
    and if possible the monies for the Invalids'' Fund from the Zagorower estates. If this succeeds, then
    Your Serene Highness gains much, for without this help one obtains not a denarius from them. Now all
    the interest is already due after the expired free years, only the subjects refuse to pay, because
    the King of Saxony has forbidden anything to be delivered to anyone here, on penalty of double the
    value. In deepest reverence expired. Your Most Serene Highness''s Berlin, the 9th of July most faithful
    and most obedient servant 1808. Peter[uncertain: s]'

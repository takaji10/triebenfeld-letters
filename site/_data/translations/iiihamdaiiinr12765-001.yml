- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! On the 6th of May of this year, in Paris, I
    presented to Your Most Serene Highness a letter from the Prince of Hohenlohe to His Majesty the Emperor
    of Russia. The resolution most graciously granted me thereupon on the 14th of May I enclose here in
    copy, and beg most obediently for most gracious indulgence that I venture to bring this matter, so
    important to the Prince, once more to Your Most Serene Highness''s recollection at the present so
    decisive moment, and to implore Your Most Serene Highness''s assistance. In boundless reverence I
    remain, until death, Your Most Serene Highness''s Vienna, the 25th of October


    1814.


    most faithful and obedient servant


    v. Triebenfeld


    [Written by the receiving office:]


    Delivered to His Right Honourable the General Privy Councillor of State Stägemann. Vienna, 20 Nov.
    1814. Küster'

    en: South Prussian
    kind: place
- page: 5
  en: 'have, hold and enjoy; and that there shall likewise be vested in him the power to dispose thereof
    at his pleasure, unhindered by any man.


    We accordingly command and enjoin all Our South Prussian governments and Chambers of War and Domains,
    as also all other authorities whom the same concerns, herewith as graciously as earnestly, that they
    in no wise hinder or trouble either the aforementioned Lord Prince of Hohenlohe-Ingelfingen in the
    heritable and proprietary possession, conferred upon him, of the above-named holdings and estates
    together with their appurtenances and belongings, nor him or those to whom he may in time, by virtue
    and in force of this'
  names:
  - de: Südpreußl. Regierungen
    en: South Prussian governments
    kind: other
  - de: Hohenlohe Ingelfingen
    en: Hohenlohe-Ingelfingen
    kind: place
- page: 6
  en: 'Our deed of donation, bequeath the same, or otherwise lawfully transfer it by other acts inter
    vivos aut mortis causa; but rather shall let him, and eventually also them, enjoy the same freely
    and quietly, doing nothing themselves against it, nor occasioning or permitting that such be done
    by others, on pain of Our All-Highest displeasure and unfailing severe punishment.


    In witness whereof We have signed the present deed of donation with Our own most high hand, and have
    caused Our


    1.'
  numbers:

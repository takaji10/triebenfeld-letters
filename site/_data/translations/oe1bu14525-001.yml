- page: 7
  en: 'Royal great seal to be appended thereto.


    So done and given in Our residence city of Berlin, the ninth day of the month of August after the
    birth of Christ our Lord in the one thousand seven hundred and ninety-sixth, and in the tenth year
    of Our Royal reign.


    Friedrich Wilhelm


    Hoym. Goldbeck.


    Deed of Donation.


    for the Prince of Hohenlohe-Ingelfingen, for the heritable and proprietary possession of the town
    of Kamionna or Kamionna and of the market-town of Kulm in the Poznań district, of the villages of
    Trąbczyn, Szetlewek, Nowa wies, Łazy, Old and New Laske, Osiny, Hauland Trąbczyński of the Konin district,
    and of the village of Prijce together with its belongings in Cujavia. The foregoing copy agrees with
    its original; I attest to this in good faith, Schlegel


    (L. S.)'

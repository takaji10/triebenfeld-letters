- page: 4
  en: ing to them as the same have hitherto been exercised, or may lawfully be exercised, and no less
    with all their appurtenances and other belongings, by whatever names they may be called, in such manner
    as the same have hitherto been enjoyed or may lawfully be enjoyed, as a well-acquired and unrestricted
    property - yet subject to the reservation of the sovereign taxes and other public dues to be laid
    upon them in like manner as upon the other estates of Our South Prussian vassals - for himself and
    his successors and heirs, from now on unto eternal times, irrevocably from Us and Our successors,
    to
  names:

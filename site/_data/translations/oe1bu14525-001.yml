- page: 1
  en: 'Certified Copy


    We Friedrich Wilhelm, by God''s Grace King of Prussia etc., do by means of this Our open letter, for
    Ourselves and Our successors to the Crown of the Electorate and Our remaining lands, attest and declare,
    and hereby graciously give to know to each and every one whom the same concerns: that, inasmuch as
    We are by inborn favour and clemency much inclined to acknowledge and requite the good and profitable
    services rendered to Us and to Our Royal House by particular marks of Our Royal benevolence, We have
    [considered] the services rendered by the High-Born Prince, Our'
  names:
  - de: Friedrich Wilhelm
    en: Friedrich Wilhelm
    kind: person
  - de: Preußen
    en: Prussia
    kind: place
- page: 2
  en: 'affectionately dear Uncle Friedrich Ludwig, reigning Prince of Hohenlohe-Ingelfingen, Our Lieutenant-General
    of Infantry, Chief of a Regiment of Foot, Governor of the capital city of Wrocław, Knight of Our Orders
    etc., the important, distinguished and useful services rendered for a considerable number of years
    to Us and to Our Royal House, weighed in Our Royal mind; and that, in order to give the said Lord
    Prince a mark of the recognition of his excellent merits and of Our Royal gratitude, We have resolved
    to confer and convey to him, heritably and in full property, the below-named estates which have fallen
    to Our All-Highest disposition, namely:


    Kamionna or Kamionna, the town, with the market-town of Kulm'

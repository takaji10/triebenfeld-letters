- page: 3
  en: 'of the Poznań district; the villages of Trąbczyn, Szetlewek, Nowa wies, Łazy, Old and New Laske,
    Osiny, Hauland Trąbczyński of the Konin district; and the village of Brzyce together with its appurtenances
    in Cujavia, with all their belongings, by whatever names they may be called.


    This We also hereby do, and by force of this present instrument, out of Royal power and plenitude,
    for Ourselves and Our successors and heirs to the Crown of the Electorate and Our remaining lands,
    in such manner and to the effect that the above-mentioned Our affectionately dear Uncle, the Prince
    of Hohenlohe-Ingelfingen, shall have the above-named estates with all rights and jurisdictions attach-'

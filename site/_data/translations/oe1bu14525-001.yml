  en: 'That the foregoing copy agrees with the authenticated copy is hereby attested in good faith under
    the greater seal and signature of the Royal South Prussian Government. Given at Kalisz, the 8th of
    July 1800. Reck


    Titles of possession of Szetlewek for His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen,
    Friedrich Ludwig, entered in the mortgage book of the Konin district, vol. 3, fol. 101, according
    to the recognition attached hereto. Kalisz, the 22nd of July 1800


    Beda, Registrar of Intabulations


    Schleyer [uncertain: Schleyer]'

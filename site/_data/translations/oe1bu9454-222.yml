- page: 3
  en: 'P[ro]. M[emoria].


    I had already sealed this letter and handed it to the messenger [uncertain: when] Count Cesur Wartensleben,
    who comes directly from Wrocław, reports that Stössel, by his assurance, will enter into the business
    together with Weigel. He wishes, however, to have a letter from Your Serene Highness stating that
    you yourself would consent to the plan drawn up by me. Cesur Wartensleben advises that Your Serene
    Highness might write to him, old Stössel, with the greatest haste — "that you had always been minded
    to keep Koszęcin, and that through the death of your mother-in-law you had believed you would be put
    in a position to be able to pay for Koszęcin — but since the Princess had made her will in such a
    manner that nothing remained for you to dispose of, you therefore wished to give the Zagórów estates
    in satisfaction of him / the said Stössel / and of Weigel, to which Triebenfeld wished to add the
    Blizanow estates as well. To that end you had charged Triebenfeld with settling everything, and requested
    him, if this were agreeable to him, to enter into negotiation with Triebenfeld over all these matters."
    I am now wholly, wholly firmly convinced that this business will come about, if Your Serene Highness
    has no other plans. — To that end I am [uncertain: sending] in all haste a mounted messenger — who
    is still to be given 5 Rthl there'

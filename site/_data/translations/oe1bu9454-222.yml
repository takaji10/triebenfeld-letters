- page: 3
  en: 'P[ro]. M[emoria].


    I had already sealed this letter and handed it to the messenger when Count [uncertain: Cesur] Wartensleben,
    who comes directly from Breslau, presents himself to report that Stössel, according to his assurance,
    will enter into terms with Weigel. But he wishes to have a writing from Your Serene Highness, that
    You Yourself would consent to the plan drawn up by me. [uncertain: Ceher] Wartenleben advises that
    Your Serene Highness might write to him, to old [uncertain: Stöckel], with the greatest haste, that
    You had all along been minded to keep Koschentin, and that through the death of Your mother-in-law
    You had believed You would be placed in the condition to be able to pay for Koschentin — but since
    meanwhile the Lady Princess had so made her will that nothing was left to You to dispose of, You therefore
    wished, for the satisfaction of him, the said Stossel, and of Weigel, to give up the Zagorowo estates,
    to which Triebenfeld wishes to add the Blizanow estates as well. To that end You had charged Triebenfeld
    to settle everything, and requested him, if this were agreeable to him, to enter into negotiation
    with Triebenfeld over all these matters. I am now wholly, wholly convinced that this business will
    come to pass, if Your Serene Highness has no other plans. — To that end I dispatch in all haste a
    [illegible] messenger — to whom 5 Rthl are still'

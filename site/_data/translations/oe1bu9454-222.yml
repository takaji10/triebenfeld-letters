- page: 4
  en: 'to be given — May Your Serene Highness deign to send me by this fellow the letter and all Your
    other commands with the utmost [uncertain: dispatch], so that I may thereupon hasten with the writing
    to Breslau and fetch Stössel myself — the messenger has promised to be back here in 5 days — Deign
    to make haste — the matter is important, great and [uncertain: pressing], and secures for You, gracious
    Prince, the happiest future.


    For the rest, Koch writes to me that I am to come to Berlin soon, soon. Much was in train and everything
    would yet come right. My eldest son, who served in the 2nd [uncertain: Schluse] cuirassier regiment,
    has been called to Berlin and will be appointed in the Garde du Corps as second lieutenant — the King
    spoke with him at length and enquired after one thing and another, particularly Köckritz perhaps.


    In the [illegible] matter only by word of mouth.


    v. Triebenfeld'

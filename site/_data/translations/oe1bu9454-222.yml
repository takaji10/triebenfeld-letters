- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, that Baron Stossel is willing to accept the Zagorowo estates in satisfaction
    of his claims according to my plan, Your Serene Highness will deign to gather from the enclosed letter
    of the Chief Office [uncertain: Königs]. Now everything depends upon the Baron: [if he] comes here
    soon, then the matter is settled even with old Weigel himself — For a couple of days now I have been
    awaiting the return of the messenger I sent to Your Serene Highness on this account. Every delay may
    prove harmful to the good cause; had I people upon whom I could rely, and horses, then one rider should
    now be chasing the next, but ever since my old honest Richter took up winter quarters I have had no
    faithful man, and no money either, for want of horses.


    I accordingly dispatch this messenger also, and beg for a speedy answer: "Whether Your Serene Highness
    wishes the matter with Stössel and Weigel to be concluded according to my plan, or whether Your Most
    High Self has another plan?"


    So far as I know Your Serene Highness''s situation, and so much understanding as Mother Nature has
    hitherto given me, I see no more honourable, no swifter and no better deliverance for Your Serene
    Highness than this: Stossel and Weigel are satisfied — You receive then from the'

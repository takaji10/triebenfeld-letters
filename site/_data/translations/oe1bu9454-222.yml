- page: 2
  en: 'the moneys left behind by the deceased Princess Sacken, which are to be applied to the purchase
    of two entailed estates for Prince Adolph and Prince Alexander, back in cash to the amount of 670000
    Rthl — with that, in the present times, you can defy hell to its face — In Berlin, where only the
    money-bag counts, this will make a din that will go thundering up through the clouds. I beg for the
    speediest answer, and I remain, until death, Your Serene Highness''s


    Blizanow, 1st December


    1811


    wholly most obedient and faithful servant


    v Triebenfeld'

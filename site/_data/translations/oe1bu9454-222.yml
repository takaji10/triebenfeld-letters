- page: 2
  en: 'the moneys left behind by the deceased Prince Sacken, which are to be applied to the purchase of
    two entailed estates for Princes Adolph and Alexander, back in cash to the amount of 670000 m. — with
    that they can defy Hell itself in these present times — In Berlin, where only the money-bag counts,
    this will make such a noise as will thunder up through the clouds. I beg for the speediest answer,
    and I remain, until death, Your Serene Highness''s


    Blizanow, the 1st of December


    1811


    wholly most obedient and faithful servant


    v. Triebenfeld'

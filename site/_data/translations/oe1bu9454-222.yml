  en: '222


    Most Serene Prince


    Most gracious Prince and Lord!


    That Baron Stössel is willing to accept the Zagórów estates for his claims according to my plan, Your
    Serene Highness will be pleased to gather from the enclosed letter of the chief district officer Königs.
    Now everything depends on the Baron''s coming here soon; then the matter is also settled with old
    Weigel himself — For a couple of days now I have been awaiting the future [uncertain: return] of the
    messenger I sent to Your Serene Highness on this account. Every delay may be harmful to the good cause;
    had I people on whom I could rely, and horses, then one rider should now be chasing the next, but
    ever since my old honest Richter took up winter quarters I have had no faithful man, and no money
    and no horses either.


    Accordingly I am sending this messenger as well, and beg for a speedy answer: "Whether Your Serene
    Highness wishes the matter with Stössel and Weigel to be settled according to my plan, or whether
    Your Highness has some other plan?


    So far as I know Your Serene Highness''s situation, and so far as Mother Nature has hitherto given
    me understanding, I see no more honourable, swifter and better deliverance for Your Serene Highness
    than this: Stössel and Weigel are satisfied — You then receive from'

- page: 4
  en: 'to be given — May Your Serene Highness be pleased to send me by this fellow the letter and all
    your other commands in the very [uncertain: speediest] manner, so that I myself may hurry with the
    letter to Wrocław and fetch Stössel in person — the messenger has promised to be back here in 5 days
    — Be pleased to make haste — the matter is important, great and [illegible], and secures for you,
    gracious Prince, the happiest future.


    For the rest, Köckritz writes to me: I am to come to Berlin soon, soon. Much was in train and all
    would yet come right. My eldest son, who was serving in the 2nd [uncertain: Silesian Hussar] Regiment,
    has been called to Berlin and will be appointed in the Garde du Corps as second lieutenant — the King
    spoke with him at length and enquired after one thing and another, particularly Köckritz perhaps —
    In the [illegible] matter only by word of mouth.


    v Triebenfeld'

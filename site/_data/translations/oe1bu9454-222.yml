status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord,


    That Baron Stossel is willing to take over the Zagorow estates for his claims according to my plan,
    Your Serene Highness will deign to gather from the accompanying letter of the Chief Court Official
    [uncertain: Königs]. Now everything depends on this, that the Baron is: he comes here soon, and then
    the matter is also settled with old Weigel himself — For a couple of days now I have been awaiting
    the arrival [lit. "the future"] of the messenger sent to Your Serene Highness in this matter. Every
    delay may prove harmful to the good cause; had I people on whom I could rely, and horses, then one
    rider ought now to be chasing the next, but ever since my old honest Richter went into winter quarters
    I have had no faithful person, no money either, for want of horses. Accordingly I am sending this
    messenger as well, and beg for a speedy answer: "Whether Your Serene Highness wishes the business
    with Stossel and Weigel to be settled according to my plan, or whether Most High You have another
    plan? So far as I know Your Serene Highness''s situation, and so much understanding as Mother Nature
    has hitherto given me, I see no more honourable, swifter and better rescue for Your Serene Highness
    than this: Stossel and Weigel are satisfied — You receive then from the'
- page: 2
  en: 'the moneys left behind by the deceased Princess Sacken, which are to be applied to the purchase
    of two entailed estates for Princes Adolph and Allexander, some 670000 m. back in cash — with that
    they can defy hell itself in these present times — In Berlin, where nothing counts but the money-bag,
    this will raise an uproar that will go thundering up through the clouds.


    I beg for the speediest answer, and I remain, until death, Your Serene Highness''s


    Blizanow, the 1st of Xbr 1811


    wholly most obedient faithful servant

    v Triebenfeld'
- page: 3
  en: 'P[ro]. M[emoria].


    I had already sealed this letter and handed it to the messenger when Count Caesar Wartensleben, who
    comes directly from Breslau, has himself announced. Stössel, by his assurance, will enter into the
    matter with Weigel. He wishes, however, to have a writing from Your Serene Highness that You Yourself
    would consent to the plan drawn up by me. Count [uncertain: Ceher] Wartenleben advises that Your Serene
    Highness might write to him, old Stöckel, with the utmost haste, that You had always been minded to
    keep Koschentin, and that through the death of Your mother-in-law You had believed You would be put
    in the position of being able to pay for Koschentin — since, however, the Lady Princess had so made
    her testament that nothing was left to You to dispose of, You therefore wished, for the satisfaction
    of him, the said Stossel, and of Weigel, to give the Zagorow estates, to which Triebenfeld wishes
    to add the Blizanow estates as well. To that end You had charged Triebenfeld with settling everything,
    and requested him, if this were agreeable to him, to enter into negotiation with Triebenfeld concerning
    all these matters.


    I am now wholly, wholly firmly convinced that this affair will come about, if Your Serene Highness
    has no other plans. — To that end I am sending in all haste a [illegible] messenger — to whom 5 Rthl
    are still to be given there'
- page: 4
  en: '— May Your Serene Highness deign to send me by this fellow the letter and all Your other commands
    with the very greatest speed, so that I may hasten thence with the writing to Breslau and fetch Stössel
    myself — the messenger has promised to be back here in 5 days — Deign to make haste — the matter is
    important, great and [uncertain: heen], and secures for You, gracious Prince, the most joyful future.


    For the rest, Koch writes to me that I should come to Berlin soon, soon. Much was in train and all
    would yet come right.


    My eldest son, who served in the 2nd Silesian Hussar Regiment, has been called to Berlin and will
    be appointed in the Garde du Corps as second lieutenant — the King spoke with him at length and enquired
    after this and that, especially [uncertain: Köckritz] perhaps. In the c. matter only by word of mouth.


    v Triebenfeld'

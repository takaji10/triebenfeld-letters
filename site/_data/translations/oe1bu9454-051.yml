- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    The iron is still not here; since meanwhile the execution has been lifted, I shall set out tomorrow
    for Königsberg and let Heaven govern. As to the inheritance matter I suspend my judgements until I
    return - I think that much can be forestalled by sending ahead a new law.


    The new decree concerning the new attachment at Wohlen I already had, and I have therefore summoned
    Honrichs to me and expect him at any hour. The mounted messenger sent to him 8 days ago has still
    not returned - he was here when I was at Schlawenschitz, but went back again without waiting for my
    arrival. He will only have the French original [uncertain: Buren]; then he means to bring Your Serene
    Highness several thousand more, and to make of the Poles one for one an 11. My advice is therefore
    on no account to make a brother into brood there, otherwise the Poles confiscate and the money after
    it - I fear this all the more since Hawich appears to be a scoundrel, for the fellow is even withholding
    the original documents entrusted to him. Honrichs seems all at once to have been converted; he vows
    to bring Your Serene Highness several thousand, and if he perceives the storm of war from afar he
    will certainly keep his word.'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The iron is not here yet; since, however, the
    execution has been lifted, I set out tomorrow for Königsberg and leave Heaven to govern. Concerning
    the inheritance matter I suspend my judgements until I return - I think that much can be forestalled
    by a new law sent on ahead. The new decree concerning the new attachment at Wohlen I already had;
    I have therefore summoned Honrichs to me and expect him at any hour. The mounted messenger sent to
    him eight days ago has still not returned - he was here while I was at Schlawenschitz, but went back
    without waiting for my arrival. He wants to have only the French original [uncertain: Buren]; then
    he means to bring in several thousand more for Your Serene Highness and to make the Poles one and
    one 11. My advice is therefore by no means to make any brother into a brood there, otherwise the Poles
    will confiscate and the money after it - I fear this all the more since [uncertain: Hawich] seems
    to be a scoundrel, for the fellow is even now holding back the original [uncertain: Piegen] entrusted
    to him. Honrichs seems to be converted all at once; he vows to bring in several thousand more to Your
    Serene Highness, and if he scents the storm of war from afar he will surely keep his word.'
- page: 2
  en: 'Bethney lies very wretchedly ill at his own place in Malsdorff. He can do nothing at present. Should
    Your Serene Highness wish to send someone to him, he will certainly enter into it gladly, only I fear
    that a misfortune may occur. If matters stand thus, then let the affair rest, Most gracious Prince
    and Lord, until my return; the three weeks will pass like smoke in the wind. I think I shall have
    the leisure to travel and to be of use on that side. In news I am today as poor as a wandering pilgrim
    in coin. The only thing just now reported to me by the Zillichau bankers, who through their cloth
    trade have great connexions in Saxony, is: 1, that Prince Hohenzollern is said to be standing with
    his corps in or below Leipzig; 2, that in Bavaria there is said to have been a very serious engagement
    in favour of the former Austrians, after which these have occupied Munich. Here the French are carrying
    off their magazines from Klogen by water and by land; perhaps the [uncertain: Beſter] are departing.
    God grant Your Serene Highness only health and patience until my return - I shall hasten so far as
    possible in order to be able to lay myself again at the feet of the same Most High, and to render
    proof of my most faithful attachment and of the [uncertain: dearest] reverence, in which I remain,
    until death, Your Most Serene Highness''s. I have just this moment received a letter: Honrichs is
    coming - as yet nothing is to be heard there of the Austrians. Money he is to bring Your Serene Highness;
    for that I stand surety with honour and life. Most faithful and most obedient servant v Triebenfeld
    Kontop, the 21st of April 1809'

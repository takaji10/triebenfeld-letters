- page: 2
  en: 'Bethney lies at his own place in Mal[uncertain: z]dorff, very wretchedly ill. He can do nothing
    at present. Should Your Serene Highness wish to send someone to him, he will surely be glad to enter
    into the matter; but I fear that some misfortune may occur. If that is how it stands, then let the
    affair rest, Most gracious Prince and Lord, until my return; the three weeks will pass like smoke
    in the [uncertain: Wäde]. I think I shall have the leisure to travel and shall be able to be active
    on that side.


    In news I am today as poor as a wandering pilgrim in coin. The only thing just now reported to me
    by the Züllichau bankers, who through their cloth trade have great connexions in Saxony, is


    1. that Prince Hohenzollern is said to be standing with his corps in or below Leipzig.


    2. that in Bavaria there is said to have been a very serious engagement in favour of the Austrians,
    after which they have occupied Munich. Here the French are removing their magazines out of Głogów
    by water and by land; perhaps the [uncertain: Beſter] are departing. May God only grant Your Serene
    Highness health and patience until my return — I shall hasten as far as possible so as to be able
    soon to lay myself again at the feet of the same most high person, and to offer proof of my most faithful
    attachment and of the deepest reverence, in which I remain, until death,


    Your Most Serene Highness''s


    I have just this moment received a letter.


    Honrichs is coming — as yet nothing


    is to be heard there of the Austrians.


    He is to bring Your Serene Highness money;


    for that I stand surety with my honour and my life.


    Konotop


    the 21st of April


    1809


    faithful and most obedient servant


    v Triebenfeld'

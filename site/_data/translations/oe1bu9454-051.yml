- page: 1
  en: '51


    Most Serene Prince


    Most gracious Prince and Lord!


    The iron is still not here; since, however, the Execution has been lifted, I set out tomorrow for
    Königsberg and let Heaven govern. As to the inheritance matter I suspend my judgements until I return
    — I think that much can be forestalled by a new law sent on ahead.


    I already had the new decree concerning the new seizure in Poland; I have therefore summoned Honrichs
    to me and expect him at any hour. The mounted messenger sent to him a week ago has still not returned
    — he was here while I was in Sławięcice, but went back without awaiting my arrival. He says he need
    only have the French original [uncertain: Buren], and then he will bring Your Serene Highness several
    thousand more, and make the Poles take an X for a U. My advice is therefore by all means to make no
    [uncertain: bruder] there, otherwise the Poles will confiscate [uncertain: brut] and the money after
    it — I fear this all the more since Hawich appears to be a scoundrel, for [uncertain: wären] the fellow
    keeps back the original papers entrusted to him — Honrichs seems all at once to be converted; he vows
    to bring Your Serene Highness several thousand more, and if he scents the storm of war from afar he
    will surely keep his word —'

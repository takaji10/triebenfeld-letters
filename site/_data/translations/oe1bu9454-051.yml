- page: 2
  en: 'Bethney lies very wretchedly ill at his place in Malsdorff. He can do nothing at present. If Your
    Serene Highness wishes to send someone to him he will certainly be glad to enter into the matter,
    only I fear that some misfortune may occur. If that is how it stands, then let the affair rest, Most
    gracious Prince and Lord, until my return; the 3 weeks will pass like smoke in the wind. I think I
    shall have the leisure to travel and shall be able to be of use on that side.


    In news I am today as poor as a wandering pilgrim is in coin. The only thing just now reported to
    me by the Zillichau bankers, who on account of their cloth trade have great connexions in Saxony,
    is 1. that the Prince of Hohenzollern is said to be standing with his corps in or below Leipzig.


    2. that in Bavaria there is said to have been a very serious engagement in favour of the former Austrians,
    after which these have occupied Munich. Here the French are carrying off their magazines from Klogen
    by water and by land; perhaps the [uncertain: Beſter] are departing. God grant Your Serene Highness
    only health and patience until my return - I shall hasten as much as possible in order to be able
    to lay myself again at the feet of the same most exalted person


    and to render proof of my most faithful attachment and of the [uncertain: dearest] reverence, in which
    I remain, until death, Your Most Serene Highness''s. I have just this moment received a letter: Honrichs
    is coming - as yet nothing is to be heard there of the Austrians. He is to bring Your Serene Highness
    money; for that I answer with my honour and my life, most faithful and obedient servant


    v. Triebenfeld


    Kontop


    the 21st of April


    1809'

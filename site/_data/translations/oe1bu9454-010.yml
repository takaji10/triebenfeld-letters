- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    Your Serene Highness''s most highly esteemed letter of the 21st of last month I received, together
    with the enclosures, yesterday evening. My astonishment was great when I saw from it that my letters
    have not arrived there — I shall make enquiries today and have a running note sent after them to the
    post director Mann. I write twice every week, and I always sent my letters, most of the times, to
    Teichelmann — There is important news in them. For the rest, I hope my stay here shall not now last
    so very much longer, and just as surely I hope that my efforts shall not remain so entirely without
    success — Mr. von Steegemann has indeed not yet made any submission — but I believe I shall succeed
    without him. The Prince Chancellor gave the best assurances again only yesterday, and spoke most favourably
    of Your Serene Highness''s affairs — He means to set Your Serene Highness''s affair in the best order
    [uncertain: abholet] even before he departs from here.


    The fehlinische matter I have now handed over to the commission — the accompanying Pro Memoria demonstrates
    the calculation which I have made — for this Your Serene Highness will now doubtless receive estates
    — for the money is needed for the war. Nothing whatever can be forced through here — it takes more
    than the patience of an angel not to go mad over the everlasting biding and waiting. Especially when
    one must go hungry.


    The war, and indeed the greatest that has ever been, is close to its outbreak; everything is hurrying
    towards the frontiers of France — The Imperial headquarters will be at Ulre, over an army of 200000
    men. Our King''s at Frankfurt. Further along the Rhine, the Hessians, Hanoverians and Dutch, together
    with the smaller contingents; up by Switzerland 200000 Russians, 30000 Swiss, 40000 peasants, and
    20000 Württembergers and Badeners — To Italy go 120000 Austrians.


    Mr. Marat has already penetrated into Italy, and the Pope has fled to Boulanga. Over the Pyrenees
    there are already marching at this time 100000 Spaniards and partisans; against which Napoleon is
    dragging the whole rabble together under a thousand false pretences. Certainly, when the great commander
    Hunger permits it, there will this time contend more'

- page: 2
  en: 'than 1200000 men contending against one another — According to the utterances of the Emperor Alexander
    nothing is to be spared, but rather the horror of devastation is to rage along every road: One hope
    still gives life to the peace-loving party — Men reckon upon internal disturbances in France — Thus,
    according to today''s report, Massena too is said to have declared himself a pretender to the crown
    of France and to be forming an army for the attainment of this end. Men therefore believe that the
    people, when they see such earnest, will soon weary of the Don Quixote and deliver him up themselves.
    These are today''s tidings — concerning the Württemberg affairs I have reported everything in my previous
    letters. The matter will, at the Congress''s demand, turn out well. As to Prince August, I wonder
    that he hesitates a moment longer to revoke the said power of attorney — I must [uncertain: kendiren]
    my judgment upon that until then. The accompanying letter Your Serene Highness may graciously have
    sent to [uncertain: dH. H. C.] Eberhard. His [uncertain: Anheimen] that the Prince Hard: should invite
    him here, and should send him money and a pass for relay horses — can never take place — the settlement
    will very likely come about without this, and in the end the King must pay. — Meanwhile everything
    will let itself be arranged better than one believes — Only have patience a short while longer — Everything
    is too confused, and they have too greatly [uncertain: unstribt] the gracious Lord. May God only preserve
    Your Serene Highness in health — He will yet grant you joy as well —


    In deepest reverence I remain, until death,


    Your Serene Highness''s


    Vienna, the 4th of March 1815


    faithful and most obedient servant


    v Triebenfeld'

- page: 2
  en: 'than 120000 men contend against one another — According to the utterances of [uncertain: K. A.]
    nothing is to be spared, but rather the horror of devastation is to rage along every road. One hope
    still animates the peace-loving party — one counts upon internal disturbances in France — Thus, according
    to today''s report, Massena too is said to have declared himself a pretender to the crown of France,
    and to be forming an army for the attainment of this end. It is therefore believed that the people,
    when they see such earnestness, will soon grow weary of the Don Quixote and deliver him up themselves.
    These are today''s news items — concerning the Württemberg affairs I have reported everything in my
    previous letters. The matter will turn out well at the demand of the Congress. As to Prince August,
    I wonder that he hesitates a moment longer to revoke the power of attorney etc. — I must suspend my
    judgement upon that. May Your Serene Highness be pleased to have the accompanying letter sent to Mr.
    C. Eberhard. His suggestion that Mr. Hardi should invite him here, money, send a relay pass — can
    never take place — the settlement will probably come about without this, and in the end the King must
    pay. — Meanwhile everything will let itself be arranged better than one believes — Only have patience
    yet a [uncertain: Burge] while — It is all too tangled, and they have, most gracious Lord, [uncertain:
    unstribt] you too much.


    May God only keep Your Serene Highness in health — joy He will


    grant you yet besides.


    In reverence I remain, until death,


    Your Serene Highness''s


    faithful and most obedient servant


    Vienna, the 4th of March 1815


    v. Triebenfeld'

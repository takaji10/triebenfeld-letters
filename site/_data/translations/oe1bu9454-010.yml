status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! Your Serene Highness''s most highly esteemed letter of
    the 21st of last month I received, together with the enclosures, yesterday evening. My astonishment
    was great when I saw from it that my letters had not arrived there. — I shall make enquiries today
    and have a tracer slip sent after them to the Post Director Mann. I write twice every week, and I
    have always sent my letters, most of the time, to Teichelmann — there are matters of consequence in
    them. For the rest, I hope my stay here shall not last so very much longer, and just as surely I hope
    that my exertions shall not remain so wholly without success. — Herr p. Steegemann has indeed not
    yet made any report — but I believe I shall succeed without him. The Prince Chancellor gave the best
    assurances only yesterday, and spoke exceedingly favourably of Your Serene Highness''s affairs. —
    He intends [uncertain: abholet] to settle Your Serene Highness''s business in the best manner before
    he departs from here. The fehlinische matter I have now handed over to the Commission — the accompanying
    Pro Memoria demonstrates the calculation which I have made — for it Your Serene Highness will now,
    I trust, receive estates — for the money is needed for the war. Nothing whatever can be forced here.
    — It takes more than the patience of angels not to go mad over this perpetual tarrying and waiting.
    Especially when one must go hungry. The war — and indeed the greatest that has ever been — is near
    its outbreak; everything hastens toward the frontiers of France. The Imperial head-quarters will be
    at Ulm, over an army of 200000 men. Our King''s at Frankfurt; further along the Rhine the Hessians,
    Hanoverians and Dutch together with the smaller contingents; up by Switzerland 200000 [uncertain:
    Rosten — Russians?], 30000 Swiss, 40000 peasants, besides 20000 Württembergers and Badeners. — To
    Italy go 120000 Austrians. Herr Murat has already penetrated into Italy, and the Pope has fled to
    Bologna. Over the Pyrenees there are by now already marching 100000 Spaniards and partisans; against
    which Napoleon is dragging together the whole rabble under a thousand false pretences. Certainly,
    if the great commander Hunger permits it, there will this time be more'
- page: 2
  en: 'than 120000 men contending against one another. — According to the utterances of the K. A. nothing
    is to be spared, but rather the abomination of desolation is to rage along every road. One hope still
    animates the peace-loving party: — people count upon disturbances within France. — Thus, according
    to today''s report, Massena too is said to have declared himself a pretender to the crown of France,
    and to be forming an army for the attainment of this end. It is therefore believed that the people,
    when they see such earnestness, will soon weary of the Don Quixote and deliver him up themselves.
    These are today''s tidings. — Concerning the Wüstemberg affairs I have reported everything in my previous
    letters. The matter will, at the desire of the Congress, turn out well. Concerning Prince August I
    marvel that he hesitates a moment longer to revoke the said power of attorney — I must [uncertain:
    suspend] my judgement upon that. The accompanying letter, may Your Serene Highness deign to have sent
    to Herr H. C. Eberhard. His suggestion, that the E. Hardi should invite him hither. That money should
    send a post-horse pass — can never take place — the composition will very likely come about without
    this, and in the end the King must pay. — Meanwhile everything will let itself be arranged better
    than one believes. — Have patience only a short while longer. — It is all too confused, and the Most
    gracious Lord has been too much ensnared. God only keep Your Serene Highness in health — joy He will
    yet grant you also. In deepest reverence I remain, until death, Your Serene Highness''s faithful and
    most obedient servant Wien, the 4th of March 1815 v Triebenfeld'

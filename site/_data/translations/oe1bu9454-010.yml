  en: '10


    Most Serene Prince,


    Most gracious Lord!


    Your Serene Highness''s most highly esteemed letter of the 24th of last month I received, together
    with its enclosures, yesterday evening. My astonishment was great when I saw from it that my letters
    have not arrived there — I shall make enquiries today and have a tracing-slip sent after them to the
    Post Director Mann. I write twice every week, and I have always sent my letters, most times, to Teichelmann
    — There are matters of consequence in them. For the rest, I hope my stay here shall not last so very
    much longer, and just as certainly I hope that my endeavours shall not remain without success — Mr
    Stägemann has indeed made no report as yet — but I believe I shall succeed without him. The Prince
    Chancellor gave the best assurances only yesterday, and spoke most favourably of Your Serene Highness''s
    affairs — He means to [uncertain: abholet] settle Your Serene Highness''s affair in the best manner
    even before he departs from here.


    The Polish matter I have now handed over to the Commission — the accompanying Pro Memoria demonstrates
    the calculation which I have made — for it Your Serene Highness will now most likely receive estates;
    for the money is needed for the war. Nothing whatsoever can be forced through here — It takes more
    than the patience of an angel not to go mad over this everlasting biding and waiting. Especially when
    one must go hungry. The war, and indeed the greatest there has ever been, is near its outbreak; everything
    is hastening towards the frontiers of France — The Imperial headquarters will be at Ulm, over an army
    of 200000 men. Our King''s at Frankfurt. Further along the Rhine the Hessians, Hanoverians and Dutch,
    along with the smaller contingents; up by Switzerland 200000 Russians, 30000 Swiss, 40000 peasants,
    with 20000 Württembergers and Badeners — To Italy go 120000 Austrians.


    Mr Murat has already pressed far into Italy, and the Pope has fled to Bologna. Over the Pyrenees there
    are by now already 100000 Spaniards and Portuguese on the march, while against them Napoleon drags
    together the whole rabble under a thousand false pretences. Certainly, if the great commander Hunger
    permits it, there will this time be more'

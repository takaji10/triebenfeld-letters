- page: 3
  en: 'which would bring my loss to the sum of 325,400 Reichsthaler.


    The interest which Your Excellency has always deigned to take in my affairs, and the friendship she
    has always shown me, are a sure warrant to me that it suffices to give her knowledge of this matter
    to be assured of its outcome, founded as it is upon the justice of His Majesty the Emperor and supported
    by the most exact equity.


    Accept, Monsieur le Baron, the assurances of the highest consideration with which I have the honour
    to be


    Monsieur le Baron


    Your Excellency''s


    Sławięcice, the 12th of April


    1815.


    Your most humble and most obedient servant,


    Friedrich Ludwig of Hohenlohe, Prince.'

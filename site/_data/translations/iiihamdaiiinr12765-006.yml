segments:
- page: 1
  en: 'Monsieur le Baron!


    In 1796 His Majesty the King of Prussia of glorious memory conferred upon me the lands of Kamionna
    and Trąbczyn, which had fallen to him by the flight of the Starost Prusimski. Of these lands, that
    of Kamionna lies in the circle of Międzyrzecz, that of Trąbczyn in the circle of Konin.


    In 1807, fourteen weeks after the peace of Tilsit, it pleased the Polish treasury to seize these lands,
    and notwithstanding my remonstrances and protests they were adjudged to the daughter of the aforesaid
    Prusimski, now married to M. de Miączyński.


    All my steps to vindicate my rights have remained without any effect, and now, when I believed the
    moment fit to revive them, I learn that His Majesty the Emperor has been pleased to confirm the arbitrary
    decrees of the Polish treasury in favour of Madame Miączyńska.


    I therefore find myself under the necessity of having recourse to the good offices of Your Excellency,
    in order to claim, through


    [Written by the receiving office:]


    To reply that it will be necessary to await the definitive settlement of the affairs of Poland, which
    moment does not at present appear distant; that the Prince will then do everything that lies in his
    power to support the claims of His Highness.'

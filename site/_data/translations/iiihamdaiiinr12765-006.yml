- page: 2
  en: 'through his powerful intervention, a suitable indemnity for a possession of such importance; and
    it is to that end that I take the liberty of laying before him the following particulars, which I
    beg Your Excellency may be pleased to place before the eyes of His Majesty the Emperor, and to move
    that Monarch to do me justice by granting me a suitable indemnity.


    Monsieur de Prusimski having, before his flight, mortgaged these lands for a sum of 80,000 Reichsthaler
    and 36,000 ducats, I was obliged, after a suit of 8 years and 6,000 Reichsthaler of costs, to pay
    a sum of 55,000 Reichsthaler to free them. The interest on these two sums, together 61,000 Reichsthaler,
    from 1807 to 1815, amounts to the sum of 24,400 Reichsthaler, so that the sum of my claims in ready
    money rises to 85,400 Reichsthaler.


    According to a valuation of these lands made by the Government of Kalisz, their value was estimated
    at 316,000 Reichsthaler, upon which I had contracted 76,000 Reichsthaler of debts, which being deducted
    there remains to be added 240,000 Reichsthaler'

- page: 2
  en: 'My loss amounts to over 261,000 Rthl. I might well with every right hope that estates of equal
    value would be conferred on me: in the meantime I should gladly be content with the small district
    office of Sokolnik situated not far from Boleslawice, which yields some 8 to 10,000 Rthl in rent.
    I most obediently beg Your Serene Highness to intercede for me, as your old and faithful admirer,
    with His Majesty the Emperor of Russia, and to so direct the matter that the Sokolnik district office
    be conferred on me as compensation, the more so as I am the only one from whom the estates have been
    taken and who must be compensated.


    May Your Serene Highness accept the assurance of the high reverence with which I persist.


    Your Serene Highness''s


    most obedient servant, F[riedrich]. L[udwig]. P[rince]. o[f]. Hohenlohe.


    Sławięcice, the 12 May 1815.'

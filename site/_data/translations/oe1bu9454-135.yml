- page: 3
  en: 'Your Right Honourable, I return herewith enclosed all the papers of the estate transaction offered
    to me. I add to these a note just received from a certain Werner, whom you will kindly put off, since
    I never have dealings with people of that sort. In general I regret that I cannot serve Your Honour
    in this matter, inasmuch as these estates have fallen into very ill repute through the manifold offering-about
    by [uncertain: Mädler] of every kind.


    Stubenrauch


    B[erlin?], the 22nd May 1804.'

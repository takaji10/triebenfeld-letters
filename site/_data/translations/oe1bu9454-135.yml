- page: 3
  en: 'Your Most Noble Honour, I return herewith enclosed all the papers of the estate purchase offered
    to me. I add to these a note just received from a certain Werner, whom you will kindly put off, because
    I never engage with people of this sort. In general I regret being unable to serve Your Honour in
    this matter, inasmuch as these estates, through the manifold offering-about by brokers of every kind,
    have come into a very ill repute.


    Stubenrauch


    Berlin, the 22nd of May 1804.'

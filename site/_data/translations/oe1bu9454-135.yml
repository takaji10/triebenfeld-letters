status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, most highly honoured Chamber Director. When I received from the reigning
    Prince of Hohenlohe, through his General Plenipotentiary, the Herr Building Councillor Glenck, the
    commission to sell his estates Kaemen and Kolno situated in South Prussia, I received from His Most
    [Serene] Highness the same, herewith enclosed, binding written undertaking for 2 pl. commission, which
    I most obediently present to Your Right Honourable in transcript, entirely identical with the original.
    Since I have now learned with certainty that the transaction has been brought about through the Chamber
    Councillor Ludolff, you would nevertheless be bound on the ground of this written undertaking to pay
    the stipulated commission of 2 pl., and that for the reason that I should have pointed out the purchaser,
    to pay. Even though this pointing-out can be fully proved by me, since in the month of December of
    the current year I proposed these estates Kaemen and Kolno to one Hahn, and also on the 6th [uncertain:
    G.] Glenck as plenipotentiary through Your Right Honourable''s personal presentation, yet the manner
    of thinking of the plenipotentiary — not of the Prince, who as is well known possesses the most excellent
    character — gives me cause to fear that the obligation to pay this commission of 2 jul. stipulated
    to me might be contested under this or some like pretext, and that with the intention of bargaining
    away a considerable sum from this honorarium set out for me. I have therefore chosen the surest way
    hereby, and have wished most obediently to report this occurrence to Your Honour by communicating
    a copy of the Princely written undertaking, the original of which I am ready to produce at any time,
    and to add thereto the most humble and obedient request: to have this commission of 2 pl., stipulated
    to me by so [text lost] and assigned upon the first purchase monies, most graciously ordered out of
    the said first purchase monies, and paid out to my order. I may with certainty expect of Your Honour''s
    just and equitable character that, since Your Honour directs this business of sale, I cannot possibly
    be deceived on the part of the Herr B. W. Glenck in respect of these my just claims upon the purchase
    monies to be paid to His Serene Highness — and that therefore, in the event of an actual sale of these
    estates, I shall have no need to extract a judicial [uncertain: arrest] upon the purchase monies.
    Your Honour has hitherto shown yourself my patron and friend. You are also acquainted with the unhappy
    fates which I and my family have suffered, particularly in the matter of the Hereditary Count v Stolberg,
    on whom I lost 30000 Rthl. Sadly, after such sacrifices, I must maintain myself and my family, known
    to you, by the laborious working-up of such transactions, of which perhaps one in a hundred succeeds.
    I therefore apprehend — since Your Honour [illegible] this business — that I am exposed to chicanery
    on the part of Glenck, and [hope] through Your Honour''s favour to obtain the wages of labour assured
    to me on the part of the Prince, His Serene Highness, under his princely seal, for which I shall be
    especially grateful and appreciative — may I most obediently request that it be reported to me in
    a few lines: how high the agreed purchase sum for Kaemen and Kolno amounts to? I remain with all reverence,
    Your Right Honourable''s most obedient servant, the Chamber Councillor Werner. B[erlin?] the 19th
    May 1804. neue Schönhauser Straße No. 13.'
- page: 2
  en: 'If the Chamber Councillor Werner in Berlin shall point out to me, mediately or immediately, a purchaser
    for my estates Kaemen and Kolno situated in South Prussia, with whom I come to terms of trade, then
    I promise to him, or to whomsoever he may give order and to whom he may wish to speak of his rights
    out of this written undertaking, for this his pointing-out, his exertion, and the service thereby
    rendered me, a voluntary remuneratory compensation for exertion, 2, written two, Rht. of the [uncertain:
    sum] of the purchase price upon which I may come to terms with the purchaser. These shall be paid
    immediately after the contract is concluded, out of the first purchase monies, and shall be paid to
    the seller for payment to the bearer hereof, who shall have received order from Herr Werner. This
    I promise to fulfil under my Princely signature and seal. Breslau the 17th Xbr. 1803. L. S. Friedrich
    Ludwig Fürst zu Hohenlohe.


    Your Honour will permit that, following upon my verbal conference of the day before yesterday, I let
    a written enquiry follow concerning the purchase and sale of the estates Kolno and Kaemen. Since my
    Lord, His Serene Highness, on that account presses for a speedy sale of his estates Kaemen and Kolno,
    because such [monies], 8 days before the next coming St John''s day, besides the 100000 Rthl required
    for the cancellation of the present Braniuschisch protestation, must [text lost] still be had for
    other use — but the purchase of these estates cannot be effected so speedily, inasmuch as a thorough
    investigation is first to precede — I most humbly enquire: in case, upon [uncertain: thorough] investigation
    of the value of the estates Kaemen and Kolno by the Herr Councillor of the Order Commission Ludolff,
    it should be found that such can have a proper value of 200000 Rthl; whether Your Honour would then
    be pleased to lend, behind the above-mentioned 100000 Rthl, 60000 Rthl upon a second mortgage, in
    such wise that they can be paid 8 days before St John''s day on the account of my Lord, His Serene
    Highness — against which it is of course understood that my Lord, His Serene Highness, must submit
    both to the restrictions of free disposition demanded in return, and also to this, that these estates
    can further be sold to no other than to the lender of these 60000 Rthl. I await your command upon
    this, and whether I may perhaps have the honour of making my personal attendance once again. Your
    Honour''s most devoted servant, Glenck. the 12th May 1804, at the Golden Eagle on the Square No 32.'
- page: 3
  en: Your Right Noble and Honourable Sir, I return herewith enclosed all the papers concerning the estate
    transaction offered to me. I add to these a note just now received from a certain Werner, whom you
    will kindly put off, since I never have dealings with people of this sort. In general I regret that
    I am unable to serve Your [Honour] in this matter, inasmuch as these estates have fallen into very
    ill repute through the manifold hawking about by brokers of every kind. Stubenrauch. B[erlin?] the
    22nd May 1804.

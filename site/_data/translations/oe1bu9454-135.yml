- page: 2
  en: 'If Chamber Councillor Werner in Berlin shall point out to me, directly or indirectly, a purchaser
    for my estates Kamionna and Kolno situated in South Prussia, with whom I come to terms of bargain,
    then I promise the same, or him to whom he may give order and to whom he may assign his rights out
    of this written undertaking, for this his pointing-out, his exertion, and the service thereby rendered
    to me, a voluntary remuneratory compensation for exertion, 2, in writing two, per cent of the sum
    of the purchase price upon which I may come to terms with the purchaser. These shall be paid immediately
    after conclusion of the contract out of the first purchase moneys, and shall be paid by the seller
    in payment to the bearer hereof, who has received order from Mr Werner.


    This I promise to fulfil under my princely signature and seal. Wrocław, the 17th of December 1803
    (L. S.)


    Friedrich Ludwig of Hohenlohe, Prince.


    Your Honour will permit that I follow up my oral conference of the day before yesterday with a written
    enquiry also, respecting the purchase and sale of the estates Kolno and Kamionna.


    Since my Prince, His Serene Highness, presses on that account for a speedy sale of his estates Kamionna
    and Kolno, because he must have, 8 days from the next coming Midsummer, over and above the 100,000
    Rthl needed for the cancellation of the present Broniewski protestation, a further 60/m Rthl for other
    use — but the purchase of these estates cannot be effected so speedily, inasmuch as a thorough investigation
    is first to precede; I therefore most submissively enquire — in case, upon the present investigation
    of the value of the estates Kamionna and Kolno by Mr Ludolff, Councillor of the Order''s Commission,
    it should be found that these can have a true value of 200/m Rthl, whether Your Honour would then
    be pleased, behind the above-mentioned 100/m Rthl, to lend 60,000 Rthl on a second mortgage in such
    wise that it can be paid 8 days before Midsummer on my Prince''s, His Serene Highness''s, account;
    whereby it is understood that my Prince [illegible] must acquiesce in the restrictions of free disposition
    demanded in return, as also that he can further sell these estates to no one other than the lender
    of these 60/m Rthl.


    I await your command hereupon, as to when I might have the honour of making my personal attendance
    once again.


    Your Honour''s


    most entirely devoted servant,


    Glenck


    the 12th of May 1804


    at the Golden Eagle, the Square No. 32.'

- page: 2
  en: 'If the chamber councillor Werner in Berlin shall, mediately or immediately, point out to me a purchaser
    for my estates Kaemen and Kolno situated in South Prussia, with whom I come to terms of trade, then
    I promise to the same, or to him to whom he may give order and assign his rights out of this written
    undertaking, for this his indication, his exertion and the service thereby rendered to me, a voluntary
    remuneratory compensation for his trouble of 2, written two, Rht. of the sum of the purchase price
    upon which I may come to terms with the purchaser. These shall be paid immediately after the contract
    is concluded, out of the first purchase moneys, and shall be paid to the seller for payment to the
    bearer of this, who has received order from Mr. Werner.


    This I promise to fulfil under my princely signature and seal. Breslau, the 17th December 1803.


    L. S. Friedrich Ludwig, Prince of Hohenlohe.


    Your Honour will permit that I follow up my oral conference of the day before yesterday with a further
    written enquiry touching the purchase and sale of the estates Kolno and Kaemen.


    Since my Prince His Serene Highness presses for a speedy sale of his estates Kernen and Rullno, because
    such [moneys], 8 days from next coming Midsummer, over and above the 100000 Rthl required for the
    cancellation of the present Braniuschisch protestation, must still be [available] for other use —
    but the purchase of these estates cannot be effected so speedily, inasmuch as a thorough investigation
    is first to precede — I most humbly enquire: in the event that upon the [uncertain: thorough] investigation
    of the value of the estates Kaemen and Kolno by the Mr. Order Commission Councillor Ludolff it should
    be found that such may have a true value of 200000 Rthl, whether Your Honour would then be pleased,
    behind the above-mentioned 100000 Rthl, to lend 60000 Rthl on second mortgage in such manner that
    they may be paid 8 days before Midsummer on account of my Prince His Serene Highness — against which
    it is understood that my Prince must submit to the restrictions of free disposition thereupon demanded,
    as also that he may not further sell these estates to any other than to the lender of these 60000
    Rthl.


    I await your command herein, as to whether I might have the honour of paying my personal attendance
    once again.


    Your Honour''s


    most humbly devoted servant


    Glenck


    12th May 1804


    at the Golden Eagle on the Square No. 32.'

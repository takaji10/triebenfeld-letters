- page: 1
  en: '135


    Right Honourable Sir,


    Most highly honoured Chamber Director. When I received from the reigning Prince of Hohenlohe, through
    his General authorised representative, Mr Glenck, Building Councillor, the commission to sell his
    estates Kamionna and Kolno situated in South Prussia, I received from His Highness the same, enclosed
    herewith, binding written undertaking concerning 2 per cent commission, which I most obediently submit
    to Your Right Honourable [uncertain: Hochverabschriften] and entirely identical with the original.
    Since I have now learned with certainty that the transaction has been brought about through Chamber
    Councillor Ludolff, you would nevertheless be obliged, on the ground of this written undertaking,
    to pay the stipulated commission of 2 per cent, and that for the reason that I should have pointed
    out the purchaser, to pay. Even though this pointing-out can be fully proved by me, since in the month
    of December of this year I brought forward these estates Kamionna and Kolno [uncertain: Ein Hahn]
    in proposal, and also Mr Glenck, Building Councillor, as [uncertain: his authorised representative]
    through Your Right Honourable personally present, yet the manner of thinking of the authorised representative
    — not of the Prince, who as is well known possesses the most excellent character — makes me apprehend
    that the obligation to pay this commission of 2 per cent stipulated to me might be disputed under
    this or the like pretext, and that with the intention of bargaining down a considerable sum from this
    honorarium settled upon me. I have therefore hereby wished to take the surest course and most obediently
    to report this proceeding to Your Honour by communicating a copy of the princely written undertaking,
    the original of which I am at all times ready to produce, and to append the most humble and obedient
    request: to arrange most graciously for this commission of 2 per cent, stipulated to me in such wise
    and assigned upon the first purchase moneys, to be paid out of those first purchase moneys, and to
    my order. I am to expect with certainty from Your Honour''s just and equitable character that, since
    Your Honour directs this business of sale, it is impossible that I should be deceived on the part
    of Mr Glenck, Building Councillor, with regard to these my just claims upon the purchase moneys to
    be paid to His Serene Highness — and that therefore, in the event of an actual sale of these estates,
    I shall not have need to extract a judicial arrest upon the purchase moneys. Your Honour has hitherto
    shown himself as my patron and friend. You are also acquainted with the unhappy fates which I and
    my family have suffered, particularly with the hereditary Count von Stollberg, with whom I lost 30/m
    Rthl. Unhappily, after such sacrifices, I must maintain myself and my family, known to you, by the
    laborious working-up of business of this kind, of which perhaps one in a hundred succeeds. I therefore
    apprehend, since Your Honour [uncertain: directs] this business, that I am [uncertain: exposed] to
    chicanery on the part of Glenck, and, through Your Honour''s favour, to obtain the wages of labour
    assured to me on the part of His Serene Highness under his princely seal, for which I shall be especially
    thankful and grateful — may I most obediently beg to be informed in a few lines: how high the agreed
    purchase sum for Kamionna and Kolno amounts to?


    I remain with all reverence,


    Your Right Honourable''s


    most obedient servant,


    the


    Cabinet Councillor Werner


    Berlin, 19 May 1804.


    Neue Schönhauser Straße No. 13.'

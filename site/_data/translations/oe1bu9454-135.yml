- page: 1
  en: 'Right Honourable Sir,


    Most highly honoured Chamber Director. When I received from the reigning Prince of Hohenlohe, through
    his general attorney, Mr. Building Councillor Glenck, the commission to sell his estates Kaemen and
    Kolno situated in South Prussia, I received from His Highness the same enclosed binding written undertaking
    for 2 pl. commission, which I most obediently present to Your Right Honourable in copy, entirely conformable
    with the original. Since I have now learned with certainty that the transaction has been brought about
    through the chamber councillor Ludolff, you would nevertheless be bound on the ground of this written
    undertaking to pay the stipulated commission of 2 pl., and that for the reason that I should have
    pointed out the purchaser, to pay. Although this demonstration can be fully proved by me, since in
    the month of December of the current year I proposed these estates Kaemen and Kolno to a certain Hahn,
    and also on the 6th [uncertain: instant] proposed Mr. Glenck as authorised, through Your Right Honourable''s
    personal presentation, yet the cast of mind of the attorney — not of the Prince, who is known to possess
    the most excellent character — makes me apprehensive that the obligation to pay this commission of
    2 jul. stipulated to me might be contested under this or a like pretext, and indeed with the intention
    of bargaining down a considerable sum from this honorarium settled upon me. I have therefore chosen
    the surest course hereby, and wish most obediently to report this proceeding to Your Honour by communicating
    a copy of the princely written undertaking, the original of which I am at all times ready to produce,
    and to add the most humble and obedient request: to have this commission of 2 pl., stipulated to me
    by such means and assigned upon the first purchase moneys, most graciously ordered from those first
    purchase moneys and paid out to my order. I may with certainty expect of Your Honour''s just and equitable
    character that, since Your Honour directs this business of sale, it is impossible that I should be
    defrauded, as regards these my just claims upon the purchase moneys payable to His Serene Highness,
    on the part of Mr. B. W. Glenck — and that therefore, in the event of an actual sale of these estates,
    I shall not have need to procure a judicial attachment upon the purchase moneys. Your Honour has hitherto
    shown himself to be my patron and friend. You are also acquainted with the unfortunate fates which
    I and my family have suffered, particularly with the hereditary Count von Stollberg, with whom I lost
    30000 Rthl. Unhappily, after such sacrifices, I must maintain myself and my family, known to you,
    by laborious working-up of such businesses, of which perhaps one in a hundred succeeds. I therefore
    apprehend, since Your Honour [uncertain: directs] this business, that I am exposed to chicanery on
    the part of Glenck, and [hope] through Your Honour''s favour to obtain the wages of labour assured
    to me on the part of the Prince His Serene Highness under his own princely seal, for which I shall
    be especially thankful and grateful — may I most obediently request that you inform me in a few lines:
    how high the agreed purchase sum for Kaemen and Kolno amounts to?


    I remain with all reverence,


    Your Right Honourable''s


    most obedient servant


    the


    H. K. Werner. B[erlin?], 19th May 1804.


    neue Schönhauser Straße No. 13.'

- page: 3
  en: '6. With Berda, who has a [uncertain: clerical] privilege by which he is to have only 23 Morgen
    of land, but who has secretly appropriated some 70 Morgen, and who is to pay some 1190 Rthl of arrears
    of rent. 1190 Rthl. The fellow refuses to pay; I therefore wish to have the contract annulled; for
    the holding I shall then at once receive 3000 Rthl in cash and a higher rent than at present


    7. With 8 Hollanders who owe some 5000 Rthl of purchase moneys - 5000 Rthl; this suit will be won,
    the holdings resumed and let out elsewhere - whereupon the 5000 Rthl come in, but the fellows go away
    empty


    8. With Ribbeck at Drzewce concerning 225 Rthl of arrears of rent - this suit is settled by agreement;
    Ribbeck pays the 225 Rthl on the 1st of April of this year on pain of forfeiting his goods


    9. With the miller M[uncertain: e]x of Swięcia concerning 500 Rthl of purchase money with interest.
    The suit is somewhat held back because the [uncertain: miller] promises to pay within 4 weeks.


    10. 29 suits with the colonists, who owe 39000 Rthl in interest and will pay absolutely nothing. 89115
    Rthl. The judgments will doubtless fall out so that one may drive the fellows off and put in others;
    I [uncertain: reckon] that of these arrears more than 6000 Rthl will be got, for the people are too
    obstinate and make off in secret with their goods. There are still many purchase moneys and rents
    outstanding among good people, but these I must for the present grant a term, so that they do not
    likewise join the bad ones, and until I have first got the bad ones wholly over[come]. By Midsummer
    everything must meanwhile be in order, and from that time forward up to 14000 Rthl in clear interest
    must flow into the treasury. For 3 demesne farms which I am restoring, 9000 Rthl a year is offered
    besides the propination rights; this amounts then to some 23000 Rthl of clear revenues; the interest,
    including the amortisation fund, would amount annually to 14000 Rthl, and therefore Your [Serene Highness]
    in the first period 9000 Rthl for the [uncertain: fund], but from Midsummer onward 48467 Rthl would
    certainly come in by Midsummer - out of which a part of the arrears of rent, [uncertain: Staunz],
    land tax, costs etc. must still be settled. The shortfall is 40648 Rthl'

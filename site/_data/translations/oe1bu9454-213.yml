  en: '213


    Most Serene Prince


    Most gracious Prince and Lord!


    Of my illness I am cured; my first journey was to Konin, to settle what is owed to the State and at
    last to [uncertain: been] the oppressive sequestration entirely. On the way, however, I had the misfortune
    of being overturned and of so crushing my head that on one side I may pass for an African and on the
    other for a European. In the meantime I hope to be restored in a couple of weeks. For the rest, by
    the exertion of all human powers I have got so far that the State taxes, on account of which above
    all the sequestration continues, are paid down to 900 t., and since the suit with the tenant of the
    propination rights lies before the Kalisz tribunal in a wording whereby Nassalski must at once pay
    3000 r., I hope next week not only to settle the remainder of the taxes but also the interest on the
    bank capital, and thereby to lift the costly sequestration altogether. With regard to the sums from
    the Invalids'' Fund, Mendel Oppenheimer, Weigelt, Haugt, Seher Thos, etc., etc., I shall set myself
    on my hind legs, to which end the orders of the tribunal and of the land court, and the attestations
    in the original, will be despatched tomorrow to Berlin by express courier — for if the Bielski plan,
    that interest and capital shall be paid over 40 years at 6 per cent, has already, as men say, been
    accepted, and if on that account the new'

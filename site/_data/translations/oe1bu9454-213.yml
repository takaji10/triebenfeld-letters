- page: 2
  en: 'distraint has already been laid on, then one need give nobody a good word any longer. Indeed it
    were to be wished that in Silesia a like benefit were granted to the landowners. Here everything may
    be made fortunate by this act of grace. Sad it is, for the rest, that here I must bring everything
    before the judge and recover every Groschen by course of law; [uncertain: Kühn] by reason of the new
    ordinances of the Emperor of the French and of the King of Saxony, every man refuses to pay a Groschen.
    Every [uncertain: parish] says: the Prince is a foreigner, we need pay him nothing; I am therefore
    compelled of necessity to have all the refractory held to their duty by the judge, and on that account
    some 43 suits are now pending. The most considerable are


    1. With Niedzwiedzki concerning 6000 Rthl; here I doubt that one obtains anything [uncertain: at all].


    2. With Nossalski concerning 3000 Rthl


    this one will be won within [uncertain: a few] days, and he is rich


    3. With the 3 Olesnicer lads for about 33000 Rthl; these [illegible] can pay nothing; if only they
    can be got out, then the Polish peasants will enter into the contract, pay 10000 Rthl entry money
    and the annual rent at 2000 Rthl


    4. With the Wrabczyner peasants for arrears of rent, 1200.


    these fellows say they were cheated at the conclusion of the contract in Breslau and will not keep
    the contract unless they get a remission – I shall gladly consent to the annulment of the contract,
    take everything from the fellows, and, as the laws permit, drive them out of the land, the more so
    as I already have people, namely Poles, enough who will give 2000 Rthl in cash for the holding and
    the same rent — this amounts, for 9 whole and 2 half peasant holdings, to 20000 Rthl


    5. There has long been a suit pending with the Kopojno, Skokumer and Swiątniki peasants concerning
    the lands; this has already been won in the land court and lies before the Tribunal for approbation
    – the people must reimburse 742 Rthl in costs, which will not fall [uncertain: hard] upon them'

- page: 4
  en: 'The toils, care and vexation which I meanwhile endure here are not to be described with any pen;
    I do not know [uncertain: when] I shall first hear, nor whither I should turn. The newer ordinances
    of Napoleon turn everybody''s head; nobody gives a heller willingly. In the 3 months that I have been
    here, 2800 Rthl have been recovered by execution - the suits already cost 1450 Rthl, of which the
    Traperius and Meierowitz matters alone, which I have [uncertain: neglected] to mention overleaf, have
    eaten up 750 Rthl. In taxes I have had 1500 Rthl paid; this already makes 2950 Rthl. Now I am again
    to send in some 600 Rthl of advances to Konin and Kalisz – if I do not, all is lost; the sequestrator
    liquidates daily, his new account amounts to 2236 Rthl. He is the favourite of the Prefect Garczynski;
    I must flatter him so far as possible, only that he may not [uncertain: press] and vex, otherwise
    all is lost, indeed I shall be chased off from here like the cat from the dovecote. Gladly would I
    procure for Your Serene Highness but a 40000 Rthl, so that you might once again have a penny against
    need; I strive too to be able to show you a wholly fixed revenue, so as to reckon upon it with confidence,
    and to determine the end of the debts, so that your descendants may know what they will one day have
    from these estates - Here there are new rumours every day, which however are seldom confirmed; so
    much however is known to me, that in Berlin they live as in a madhouse, think only of extortions,
    and for the rest not a word of what passes in the neighbouring cabinets. Thus Hard himself does not
    know a [uncertain: jot] of it, that attachment has been laid anew upon every conceivable sum that
    has been lent out of Prussia into Poland, and that the interest and amortisation fund is fixed at
    40 years. Zerboni has played a frightful trick on them all and now laughs [illegible] in his own house;
    in your negotiations aim only at the good of Saxony in Poland. Hard: demands of me proofs concerning
    the new attachment and the amortisation [uncertain: plan]; I send him the same tomorrow - I remain,
    until death, Your Most Serene Highness''s Swiątniki, the 27th of January 1811


    most humble and obedient v Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Of my illness I am cured; my first [uncertain: journey] was to Konie, in order to settle the state
    debt and at last to be entirely [illegible] of the oppressive sequestration. On the way, however,
    I had the misfortune of being overturned and of so crushing my head that on one side I may pass for
    an African and on the other for a European. Meanwhile I hope to be restored within a couple of weeks.
    For the rest, I have, with the exertion of all human powers, come so far that the state taxes, on
    account of which above all the sequestration continues, are paid off save for 900 Rthl; and since
    the suit with the propination rights lessee lies before the Kalisz Tribunal as a [uncertain: matter
    of record], wherein Nassals must pay 3000 Rthl at once, I hope next week not only to settle the remainder
    of the taxes but also the interest on the bank capital, and thereby wholly to remove the costly sequestration.
    With regard to the sums from the Invalids'' Fund, Mendel [illegible] humer, Weigel, Haugt, Seher Thor
    etc., I shall set myself on my hind legs, to which end tomorrow the Tribunal''s and the land court''s
    ordinances, and the attestations in the original, will be despatched to Berlin by express courier
    — for if the Bielsh plan, that interest and capital are to be paid over 40 years at 6 per cent, has
    already, as people say, been adopted, on which account too the new'

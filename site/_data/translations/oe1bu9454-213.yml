- page: 2
  en: 'arrest has already been laid, then one need give no man a good word any longer. Indeed it were
    to be wished that a like benefit were granted to the estate-owners in Silesia. Here everything can
    be made prosperous by this favour. For the rest it is a sad thing here that I must bring everything
    before the judge and recover every Groschen by way of law; [uncertain: Kühn] by reason of the new
    ordinances of the Emperor of the French and of the King of Saxony, every man refuses to [uncertain:
    pay] a single Groschen. Every [uncertain: Cur] says: the Prince is a foreigner, we need pay him nothing;
    I am therefore of necessity compelled to have all the refractory held to their duty through the judge,
    and on that account there are now already some 43 suits pending. The most considerable are


    1. With Niedźwiecki, for 6000 rt. Here I doubt that one will obtain so much as a [uncertain: deiner].


    2. With Nossalski, for 3000 Rthl. This one will be won in a few days, and he is rich.


    3. With the 3 Oleśnica lads, for about 33000 rt. These fellows can pay nothing; if only they can be
    got out, the Polish peasants will step into the contract, pay 10000 Rthl. entry-money and the yearly
    rent of 2000 r.


    4. With the Wrąbczyn peasants, for arrears of rent, 1200. These fellows say they were cheated at the
    conclusion of the contract in Wrocław, and will not keep the contract unless they receive an abatement
    — I shall gladly consent to the annulment of the contract, take everything from the fellows, and,
    as the laws permit, drive them out to their wages, the more so as I already have people enough, namely
    Poles, who will give 2000 rt. in cash for the holding and the same rent — this amounts, for 9 whole
    and 2 half peasant holdings, to 20000 rt.


    5. There has long been a suit pending with the Kopojno, Skokum and Swiątniki peasants concerning the
    grounds; this one is already won in the land court and lies before the tribunal for my approval —
    the people must reimburse 742 rt. of costs, which will not come hard to them —'

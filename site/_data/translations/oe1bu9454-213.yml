- page: 4
  en: 'The [uncertain: torments], care and sorrow which I endure here in the meantime are not to be described
    with any pen; I do not know when I shall first hear, or whither I am to turn — The newer ordinances
    of Napoleon turn everyone''s heads; no one gives a Heller willingly. In the 3 months that I have been
    here, 2800 rt. have been recovered by execution — the suits already cost 1450 rt., of which the Trąbczyn
    and Meierowitz ones alone, which I omitted to mention overleaf, have eaten up 750 rt.; I have had
    taxes paid to the amount of 1500 rt. This already makes 2950 rt. Now I am again to send in some 600
    rt. of advances to Konin and Kalisz — if I do not, all is lost; the sequestor liquidates daily, his
    new account amounts to 2236 rt. He is the favourite of Prefect Garczynski; I must flatter him as far
    as possible, so that he only does not [uncertain: hiesigt] and vex us, otherwise all is lost — indeed,
    they will chase me off from here like the cap from the dovecote. Gladly would I procure for Your Serene
    Highness but a 40000 rt., so that you might once again have a penny against need; I also strive to
    be able to show you a wholly fixed revenue, so that it may be reckoned upon with confidence, and to
    determine the end of the debts, so that your descendants may know what they will one day have from
    these estates — Here there are new rumours every day, which however are seldom confirmed; so much,
    however, is known to me, that in Berlin they live as in a madhouse, think only of extortions, and
    for the rest not a word of what passes in the neighbouring cabinets. Thus Hard[enberg] himself does
    not know one jot of it, that a fresh arrest has been laid upon all sums conceivable that have been
    given out of Prussia into Poland, and that the interest and amortisation fund has been fixed at 40
    years. Zerboni has made a frightful long nose at them all and now laughs here into his own house;
    in your negotiations aim only at the welfare of Saxony and Poland. Hard[enberg] demands of me proofs
    concerning the new attachment and the amortisation [uncertain: Platz]; I send him the same tomorrow
    — I remain, until death, Your Most Serene Highness''s Swiątniki, the 27th of January 1811


    most humble


    v Triebenfeld


    May Your Serene Highness deign to write to me by an express — you have indeed Polish fellows enough
    there — By the post it is dangerous — the letters are opened and many therefore go quite lost — P.S.
    This very moment I have come to agreement here with 3 jurists — all 3 of them serve, that is to say
    in Konin, Kalisz and also in Warsaw, through the whole year for 700 rt.; were it given for each case
    separately, I should not manage with 3000 rt., for [uncertain: Falz] took 400 rt. in advance from
    all of them and demanded a further 3000 rt. —'

- page: 3
  en: '6. With Berda, who has a [uncertain: spiritual] privilege according to which he is to have only
    23 Morgen of ground, but who has secretly appropriated to himself some 70 Morgen, and who is to pay
    some 1190 rt. of arrears of rent. 1190 rt. The fellow refuses to pay; I therefore wish to see the
    contract annulled; for the holding I shall then at once receive 3000 rt. in cash and a higher rent
    than now —


    7. With 8 Hollanders who owe some 5000 rt. of purchase-monies. 5000 rt. This suit will be won, the
    holdings taken in and let out elsewhere — whereupon the 5000 rt. come in, but the fellows go away
    empty.


    8. With Rybbeck at Drzewce, for 225 rt. of arrears of rent — this suit is compounded; Rybbeck pays
    the 225 rt. on the 1st of April of this year, on pain of losing his goods.


    9. With the miller Mex[illegible] of Swięcia, for 500 Rthl. of purchase-money with interest. The suit
    is somewhat held back because [illegible] promises to pay within 4 weeks.


    10. 29 suits with the colonists, who owe 39000 rt. of interest and will pay nothing at all. 89115
    rt. The judgments will probably fall out so that the fellows can be removed and others put in their
    place; I [uncertain: doubt] that more than 6000 rt. will be got out of these arrears, for the people
    are too obstinate and go off in secret with their goods — There are still many purchase-monies and
    rents outstanding among good people, but these I must for the present allow time, so that they do
    not join the wicked ones too, and until I have first wholly overcome the wicked — by Midsummer everything
    must in the meanwhile be in order, and from then on up to 14000 rt. of clear interest must flow into
    the treasury. For 3 demesne farms which I am restoring, 9000 rt. a year is offered after the propination
    rights; this amounts then to some 23000 rt. of clear revenue; the interest, including the amortisation
    fund, would come to 14000 rt. yearly, and therefore 9000 rt. would flow to Your [Highness''s] [uncertain:
    Causa] from Midsummer onward — 48467 rt. would certainly come in by Midsummer — out of which a part
    of the arrears, [uncertain: Staunz], the land tax, the costs etc. must still be settled. The deficit
    is 40648 rt.'

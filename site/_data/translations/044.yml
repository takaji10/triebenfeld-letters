status: draft
segments:
- page: 1
  en: 'My longing to be able to lay myself at Your Most Serene Highness''s feet in person as soon as possible
    is boundless - I could rage with impatience. The Lahr lawsuit still holds me back for now, and I must
    see how the matter is to be managed. Lahr is still to receive 3000 Rthl according to the judgment
    just now made known to me by Amelang, together with the interest. He must take papers, and these would
    amount, at the present rate of exchange, together with the interest, to about 2000 Rthl. Now there
    lie deposited from me 2 obligations of 1000 each, pledged for 800 Rthl, 2 of 300 for 360, 1 of 400
    Rthl for 340 - these are 3000 Rthl in papers for Lahr; but the costs now, 1500 Rthl, I must have in
    order to be able to redeem them at once. As soon as I have these, I am at least free. To Coste I yesterday
    happily [returned] the 9000 Rthl which at that time had to be deposited to cover the 5000 Rthl which
    v. d. Lahr gave upon Zastrow, mine, and the Grevenitz bill of exchange; I repaid it yesterday, and
    paid him 450 Rthl in interest. I also gave his book-keeper and the [uncertain: Constier] Oldekopp
    118 Rthl. These are - 2068 Rthl. As soon as I receive these, this dreadful business, which has robbed
    me of health, peace, honour and credit, is cleared out of the way. Your Serene Highness, however,
    loses little thereby, because the French Government has ordered these monies to be reimbursed out
    of the Zagorow estates; also 1500 Rthl in Courant are saved. One''s most excellent Chamber is, as
    I this'
- page: 2
  en: 'receive these 2068 Rthl quickly, and also how I may satisfy Mathein, who in the end means to hold
    me fast for 1000 Rthl Courant or 1500 Rthl in coin, so as to be able to travel. The merchant Michaelis
    yesterday made me the offer that, if Your Serene Highness would let him have 600 Centner of iron at
    4 Rthl until the month of May, he would thereupon at once settle the 2068 Rthl together with interest
    and costs. The iron would, however, have to be delivered to him free of charge as far as Oppeln. Reckoning
    upon Your Serene Highness''s grace, I shall, if Michaelis keeps his word, conclude this contract -
    to give him 600 Centner of bar and hoop iron must surely be a trifle, and with free [text lost]. The
    lawsuit with Oppenheimer and the many messengers and other costs to South Prussia, which I have here
    laid out in cash, amount to 52 Rthl. These I beg to have repaid to me in cash as [uncertain: quickly]
    as possible. Likewise I beg for the execution and other costs which the French gendarmerie, whom I
    had to feed and pay here, have caused - these amount to 411 Rthl. These are 932 Rthl Courant, for
    until I receive these I am as good as under arrest and may not stir from the spot. For the very speediest
    disposal of this matter, and in particular for the 932 Rthl in cash and for the promise of the 600
    Centner of iron, I beg Your Serene Highness as urgently as most heartily, and I protest that I shall
    continue therein with the most glowing zeal to help bring all Your Most High affairs into the best
    course.


    answered as desired.


    the 3rd of February 1809. to Berlin.


    v Triebenfeld'

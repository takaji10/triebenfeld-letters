- page: 1
  en: 'Berlin, 11 January 1797.


    To His Excellency the Royal etc. Minister Count von Hoym,


    et in simili To His Excellency the Royal etc. Minister Baron von Schrötter.


    Gr. In triplicate, fair copies.


    We do ourselves the honour of communicating to Your Excellency herewith in copy, for such use as you
    may see fit, what the Royal Resident at Venice, Count von Cattaneo, has reported, at that person''s
    request, about a resident of the Royal provinces acquired from the former Republic of Poland, by name
    Anton Prusimski, who is at present staying at Venice. Berlin, 11 January 1797.


    The same to His Excellency the Grand Chancellor von Goldbeck.


    [uncertain: Alvensleben]


    Haugwitz


    On the 12th, all sent to the post.'

segments:
- page: 1
  en: 'Most Serene Prince!


    Poland''s fate is now decided, and the boundaries determined. The district in which the Trąbczyn estates
    lie that were taken from me by the Polish administrative commission falls under Russian sovereignty.
    Since now both sovereigns have confirmed the acts of the Prussian commission, the estates taken from
    me remain lost to me for ever, and it is now my sole comfort that, according to the love of justice
    of both monarchs, the donees are to be given a compensation by means of other estates.


    According to the highest probability I should have to await my indemnification from His Majesty the
    Emperor of Russia, on which account I have also already applied to the Minister Baron von Stein. But
    whether this matter depends on Baron von Stein alone, I do not know. — This, however, I do know, that
    through Your Serene Highness''s word with His Majesty the Emperor of Russia I should at once be helped.'

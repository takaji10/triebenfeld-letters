- page: 2
  en: 'Whether Your Serene Highness will make any use of this offer of Mr. von Brzechsta I leave entirely
    to your high judgement, and I most obediently beg to be graciously instructed on the matter. My unpresuming
    proposal would be not to reject this plan altogether, and to conclude a contract.


    Most obediently I observe that, on account of the impending war and the and threatening dreadful revolutions,
    it becomes absolutely necessary to come to a resolution about the estates as quickly as possible.
    With the most fearful exertion I am not in a position to bring together so much that the terribly
    high taxes and the interest could be paid. I will shall, and out of 1st. The [uncertain: Podothen]
    with [illegible]


    - pay 1200. Rthl


    2. settle the new exorbitant deliveries to Warsaw with


    1240. Rthl 8 gr.


    3. Interest to the Invalids'' Fund - send 1250.


    4. To Weigel 1250. Rthl to be sent


    5. old soldiers and other costs 1730. Rthl [uncertain: bemühtiger] All the distraints have indeed
    been lifted out of friendship for me by the prefect sub-prefect and the president of the tribunal
    - but if the costs are not paid, the sequestration comes into force anew, and what do I not risk with
    the Invalids'' Fund? The prefect von Brzechsta is now so good, and takes upon himself, since'

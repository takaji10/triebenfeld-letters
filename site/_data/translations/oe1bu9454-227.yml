segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Although the last messenger has not yet returned, and Your Serene Highness''s enlightened resolutions
    are unknown to me, I will not hesitate to submit to Your Serene Highness most obediently, by a mounted
    messenger, a proposition made to me by the sub-prefect von Brzechsta. The said Mr. von Brzechsta wishes
    to lease the lordship of Zagorowo for 6 years.


    He offers 20,000 - 25,000 rl. annually. He will put the 3 demesne farms back into complete good order
    for 3000 Rthl, and bear all the burdens. He makes payment half-yearly, and gives security with his
    [uncertain: Hnabe] and estates. He demands, however, that if the estates should be sold and he be
    removed from the lease, there should then be given or granted to him a sum for withdrawal of 10,000
    Rthl:, which he should be entitled to recover afterwards out of the arrears, which in his opinion
    are not likely to be obtained from the inhabitants so soon.'

- page: 2
  en: 'Whether Your Serene Highness wishes to make any use of this offer of Mr von Brzechffa, I leave
    entirely to Your Highness''s judgement, and I most obediently beg to be graciously instructed thereon.
    My proposal, without presuming, would be not to reject this plan altogether, and to conclude a contract.


    Most obediently I observe that, on account of the impending war and the dreadful revolutions also
    threatening, it becomes unavoidably necessary to reach a decision concerning the estates as quickly
    as possible. With the most fearful exertion I am not in a position to bring together so much that
    the appallingly high taxes and the interest could be paid. I will, shall, and out of it — 1st. Pay
    the taxes with [uncertain: diein] — 1,200 Rthl


    2. settle the new exorbitant deliveries to Warsaw with 1,240 Rthl 8 Groschen


    3. send interest to the Invalids'' Fund — 1,250 Rthl


    4. have 1,250 Rthl sent to Weigel


    5. old taxes[?] and other costs 1,730 Rthl [uncertain: bemühtiger]. All the writs of arrest have indeed
    been lifted out of friendship for me by the prefect sub-prefect and the president of the tribunal
    — but if the costs are not paid, sequestration sets in anew, and what do I not risk with the Invalids''
    Fund?


    The prefect Mr von Brzechffa is now so good as to take upon himself, since'

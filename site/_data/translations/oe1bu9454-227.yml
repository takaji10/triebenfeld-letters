- page: 3
  en: 'the deputy judge [illegible]ukarski, his friend, has however always been against us, the pursuit
    of the interest and arrears - but he, like myself, doubts that, in the present dreadful want of money,
    much could be brought together. The people are truly not only poor but obstinate, and confounded by
    the utterly repugnant ordinances - A man such as the sub-prefect Brzechsta can, by degrees, with the
    power residing in him, bring everything back into a good course. May Your Serene Highness therefore
    graciously instruct me what you most highly intend to do. Whether you will accordingly treat with
    the general von Schimmelpfennig, or whether the lease contract is to be concluded with Brzechsta,
    and afterwards whether the agreement with Weigel and Stössel is then to be effected and Köschentin
    freed?


    In the first case I would indeed wish Your Serene Highness every conceivable good fortune from the
    bottom of my heart, but for the rest I should have to withdraw from this affair and fall silent in
    reverence, the more so as I see no further advantage in this business than that Your Serene Highness
    would receive some thousands of [uncertain: Propriver] rl. in worthless papers, but would lose dreadfully
    thereby. Should Your Serene Highness approve the 2nd plan, I would come with Mr. etc. von Brzechsta'

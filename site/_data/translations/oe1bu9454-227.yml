- page: 4
  en: 'to Schlawenschitz - the contract would be concluded, and Mr. S. von Brzechsta would probably also
    bring a couple of thousand [illegible] with him, and then the negotiations with Weigel and Stössel
    could be set in train and [uncertain: beynekt], to which end I gladly throw in my Blizanow holdings,
    the estates which I am still [uncertain: sending in] against it. The Olesnica and Wrąbczyn matter
    will at last come up next week; I firmly hope that this affair will be of blessed consequences - Until,
    however, these matters are concluded, I cannot yet get away from here.


    For the rest, the Diet in Warsaw has ended very stormily, and cruelly many oppressive new taxes have
    been laid upon the estate owners. The King has returned to Dresden. Strong speeches were made. For
    the New Year entered upon today I wish Your Serene Highness with the most joyful heart every conceivable
    good fortune and the most enduring health - and I remain, until death,


    Your Most Serene Highness''s


    Blizanow


    4 Jan.


    1812


    most faithful and humble and obedient servant


    v. Triebenfeld'

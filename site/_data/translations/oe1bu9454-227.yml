- page: 4
  en: 'to Schlawenschitz - the contract would be concluded, and Mr. S. von Brzechsta would doubtless also
    bring a couple of thousand [illegible] with him, and then the negotiations with Weigel and Stössel
    could be initiated and [uncertain: beynekt], to which I gladly contribute my Blizanow estates, those
    which I still [uncertain: einsandle] against it. The Olesnice and Trąbczyn matters will at last come
    up next week; I firmly hope that this affair will be of blessed consequences - Until these matters
    are concluded, however, I cannot yet get away from here.


    For the rest, the Diet at Warsaw has ended very stormily, and cruelly many oppressive new taxes have
    been laid upon the estate owners. The King has returned to Dresden. Strong speeches were held. For
    the New Year entered upon today I wish Your Serene Highness, with the most joyful heart, every imaginable
    good fortune and the most lasting health - and I remain, until death,


    Your Most Serene Highness''s


    Blizanow


    4 Jan.


    1812


    most faithful and humble and obedient servant


    v. Triebenfeld'

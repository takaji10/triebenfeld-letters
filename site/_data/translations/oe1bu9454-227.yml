- page: 3
  en: 'the assistant judge [uncertain: Gukarski], his friend, has however always been against us, the
    collection of the interest and the arrears — but he, like myself, doubts that in the present dreadful
    shortage of money much could be brought together. The people are truly not only poor, but obstinate,
    and confounded by the [uncertain: seelen] contrary ordinances — A man such as the sub-prefect Brzechffa
    can, little by little, with the authority residing in him, alone bring everything back into good order.
    May Your Serene Highness therefore be pleased graciously to instruct me what Your Highness intends
    to do. Whether Your Highness will accordingly treat with Mr General von Schimmelpfennig, or whether
    the lease contract is to be concluded with Brzechffa, and afterwards whether the agreement with Weigel
    and Stössel is to be effected and Koszęcin set free?


    In the first case I would indeed wish Your Serene Highness every conceivable good fortune from the
    bottom of my heart, but for the rest I should have to withdraw from this affair and fall silent in
    reverence, all the more since in this business I see no further advantage than that Your Serene Highness
    would receive some thousand [uncertain: Frey inne] Rthl in [uncertain: schlechtschenden] papers, but
    would lose dreadfully thereby. Should Your Serene Highness approve the 2nd plan, I would come with
    Mr von Brzechffa'

- page: 4
  en: 'to Sławięcice — the contract would be concluded, and Mr von Brzechffa would probably also bring
    a couple of thousand along, and then the negotiations with Weigel and Stössel could be set on foot
    and [uncertain: concluded], to which I would gladly throw in my Blizanów holdings, the estates which
    I still [uncertain: einsandle] against it. The Oleśnica and Wrąbczyn matter will at last come up next
    week; I firmly hope that this affair will be of blessed consequence — Meanwhile, until these matters
    are concluded, I cannot yet get away from here.


    For the rest, the Reichstag in Warsaw has ended very stormily, and cruelly many oppressive new taxes
    have been laid upon the landowners. The King has returned to Dresden. Strong speeches have been held.
    For the New Year entered upon today I wish Your Serene Highness, with the most faithful heart, every
    conceivable good fortune and the most lasting health — and I remain, until death,


    Your Most Serene Highness''s


    Blizanów


    4 Jan.


    1812


    most faithful and humble and obedient servant


    v. Triebenfeld'

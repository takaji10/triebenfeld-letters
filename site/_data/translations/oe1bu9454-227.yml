segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Although the last messenger has not yet returned, and Your Serene Highness''s enlightened resolutions
    are unknown to me, I would not delay in submitting to Your Serene Highness most obediently, by a mounted
    messenger, a proposition made to me by the sub-prefect von Brzechsta. The said Mr. v. von Brzechsta
    wishes to lease the Zagorowo lordship for 6 years.


    He offers annually 20,000 - 25,000 rl. He will put the 3 demesne farms back into complete good order
    for 3000 Rthl, and bear all the burdens. He will make payment half-yearly and give security with his
    [uncertain: Hnabe] and estates. He demands, however, that if the estates were sold and he were put
    out of the lease, there should then be given or granted him a sum for withdrawal of 10,000 Rthl, which
    he would be entitled to recover afterwards out of the arrears, which in his opinion are not likely
    to be obtained from the inhabitants any time soon.'

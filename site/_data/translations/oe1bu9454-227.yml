- page: 3
  en: 'the deputy judge [illegible]ukarski, his friend, but always opposed to us, the recovery of the
    interest and arrears - but he, like myself, doubts that, in the present dreadful shortage of money,
    much is likely to be brought together. The people are truly not only poor but obstinate, and confused
    by the utterly vexatious ordinances - A man such as the sub-prefect Brzechsta can, little by little,
    with the authority residing in him, alone bring everything back into good order. May Your Serene Highness
    therefore graciously instruct me what you are minded to do. Whether you will accordingly treat with
    Mr. General von Schimmelpfennig, or whether the lease contract is to be concluded with Brzechsta,
    and thereafter whether the agreement with Weigel and Stössel is to be effected and Köschentin set
    free?


    In the first case I should indeed wish Your Serene Highness every imaginable good fortune from the
    bottom of my heart, but should for the rest withdraw from this business and have to fall silent in
    reverence, the more so as I see no further advantage in this transaction than that Your Serene Highness
    would receive some thousands of [uncertain: Propriver] in worthless papers, but on the other hand
    would lose dreadfully. Should Your Serene Highness approve the 2nd plan, I should come with Mr. p.
    von Brzechsta'

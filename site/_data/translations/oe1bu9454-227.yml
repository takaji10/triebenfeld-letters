status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! Although the last messenger has not yet returned,
    and Your Serene Highness's enlightened resolutions are unknown to me, I will not hesitate to submit
    to Your Serene Highness most obediently, by a mounted messenger, a proposition made to me by Herr
    Sub-Prefect von Brzechsta. The said Herr v. Brzechsta wishes to lease the Zagorow lordship for 6 years.
    He offers annually 20,000 - 25,000 rl. He will put the 3 demesne farms completely in order again for
    3000 Rthl, and bear all burdens. He will make payment half-yearly and gives security with his goods
    and estates. He demands, however, that if the estates should be sold and he be put out of the lease,
    there should then be given or granted to him a quantum of withdrawal of 10,000 Rthl:, which he should
    be entitled to recover afterwards out of the costs, which in his opinion could not so soon be obtained
    from the inhabitants.
- page: 2
  en: 'Whether Your Serene Highness will make any use of this offer of Herr von Brzechsta I leave entirely
    to Your most high discretion, and I most obediently beg to be graciously instructed on that account.
    My unpresumptuous proposal would be not to reject this plan altogether, and to conclude a contract.
    Most obediently I observe that, on account of the impending war and the and threatening more dreadful
    revolutions, it becomes absolutely necessary to come to a resolution concerning the estates as swiftly
    as possible. With the most fearful exertion I am not in a position to bring together so much that
    the frightfully high dues and the interest could be paid. I will, shall, and out of it: 1st. Pay the
    [uncertain: Podothen] with the [illegible] - 1200. Rthl; 2. settle the new exorbitant deliveries to
    Warsaw with 1240. Rthl 8 gr.; 3. interest to the Invalids'' Fund - 1250. to send; 4. have 1250. Rthl
    sent to Weigel; 5. old soldiers and other costs 1730. Rthl [uncertain: bemühtiger]. All the writs
    of arrest have indeed been lifted, out of friendship for me, by the Prefect sub-prefect and the President
    of the Tribunal - but if the costs are not paid, the sequestration comes in anew, and what do I not
    risk with the Invalids'' Fund? The Herr Prefect von Brzechsta is now so good, and, since'
- page: 3
  en: 'the Podsedek [illegible]ukarski, his friend, has however always been against us, has taken upon
    himself the recovery of the interest and arrears - but he, like myself, doubts that in the present
    dreadful scarcity of money much could be brought together. The people are truly not only poor but
    obstinate, and confounded by the utterly vexatious ordinances - A man such as the Sub-Prefect Brzechsta
    can, little by little, with the authority residing in him, alone bring everything back into a good
    course again. May Your Serene Highness therefore graciously instruct me what Your most high self intends
    to do. Whether accordingly You will deal with Herr General von Schimmelpfennig, or whether the lease-contract
    is to be concluded with Brzechsta, and thereafter whether the union is then to be effected with Weigel
    and Stössel and Köschentin set free? In the first case I should indeed wish Your Serene Highness every
    conceivable good fortune from the bottom of my heart, but should otherwise have to withdraw from this
    affair and fall silent in reverence, the more so as I see no further advantage in this business than
    that Your Serene Highness would receive some thousands of [uncertain: Propriver] etc. in worthless
    papers, but would on the other hand lose frightfully. Should Your Serene Highness approve the 2nd
    plan, I would come with Herr p. von Brzechsta'
- page: 4
  en: 'to Schlawentzitz - the contract would be concluded, and Herr S. von Brzechsta would probably also
    bring a couple of thousand v. with him, and then the negotiations with Weigel and Stössel could be
    set in train and [uncertain: beynekt], to which I gladly contribute my Blizanow property, the estates
    which I am still [uncertain: einsandle] in return. The Olesnica and Wrąbczyn matter will finally come
    up next week; I firmly hope that this affair will be of blessed consequences - Until these matters
    are concluded, however, I cannot yet get away from here. For the rest, the Diet at Warsaw has ended
    very stormily, and cruelly many oppressive new dues have been laid upon the proprietors of estates.
    The King has returned to Dresden. Strong speeches were held. For the New Year entered upon today I
    wish Your Serene Highness, with the most joyful heart, every conceivable good fortune and the most
    lasting health - and I remain, until death, Your Most Serene Highness''s Blizanow, 4 Jan. 1812 faithful
    most humble and obedient servant v. Triebenfeld'

- page: 1
  en: '227


    Most Serene Prince,


    Most gracious Prince and Lord!


    Although the last messenger has not yet returned, and Your Serene Highness''s enlightened resolutions
    are unknown to me, I would not delay in most obediently forwarding to Your Serene Highness, by a mounted
    messenger, a proposition made to me by the sub-prefect von Brzechffa. The said Mr von Brzechffa wishes
    to lease the Zagórów lordship for 6 years.


    He offers annually 20,000 — 25,000 Rthl. He will put the 3 demesne farms back into complete condition
    for 3,000 Rthl, and bear all the burdens. He will make payment half-yearly and gives his goods and
    estates as security. He requires, however, that should the estates be sold and he be put out of the
    lease, a sum of withdrawal of 10,000 Rthl should then be given or granted to him, which he should
    be entitled to recover afterwards out of the costs, which in his opinion could not be obtained from
    the inhabitants so soon.'

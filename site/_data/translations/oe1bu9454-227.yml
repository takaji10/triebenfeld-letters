- page: 2
  en: 'Whether Your Serene Highness wishes to make any use of this offer of Mr. von Brzechsta I leave
    entirely to your most high discretion, and I most obediently beg to be graciously instructed thereon.
    My unpresumptuous suggestion would be not to reject this plan so entirely, and to conclude a contract.


    Most obediently I observe that, on account of the impending war and the threatening dreadful revolutions,
    it becomes absolutely necessary to come to a resolution regarding the estates as quickly as possible.
    With the most frightful exertion I am not in a position to bring together so much that the appallingly
    high taxes and the interest could be paid. I will, shall, and out of 1st. The [uncertain: Podothen]
    with [illegible]


    - pay 1200 Rthl


    2. settle the new exorbitant deliveries to Warsaw with


    1240 Rthl 8 gr.


    3. interest to the Invalids'' Fund - to remit 1250


    4. to have 1250 Rthl sent to Weigel


    5. old soldiers and other costs 1730 Rthl [uncertain: bemühtiger] All the attachments have indeed
    been lifted out of friendship for me by the prefect sub-prefect and the president of the tribunal
    - but if the costs are not paid, the sequestration sets in anew, and what do I not risk with the Invalids''
    Fund? The prefect Mr. von Brzechsta is now so good as to take upon himself, since'

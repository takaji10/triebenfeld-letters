status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! I have had the honour to receive Your Most Serene
    Highness''s most gracious letter. I regret nothing more than that this could not have happened 4 days
    sooner, for just then the Count was passing through here and going on to Erfurth, and it would have
    been an easy matter for me to attach myself to him and make that journey in his company. Today it
    is useful [uncertain: nüslich] to set out upon the road to Erfurth, because it is wholly uncertain
    how long the two Emperors will tarry there; besides, I also lack [illegible] money to make the journey
    thither, and with empty hands nothing can be done in that place. Moreover I believe that at Erfurth
    not everything will yet be decided; I mean that there they will only first draft everything and then
    hand out the cards for play — it depends who plays along, and whether the greatest gambler does not
    lose his game codille just as well as our master. The alliance between England, Sweden, Austria and
    Turkey is of consequence, and may perhaps compel Russia to steps which it does not now suspect it
    will have to take. My whole seeking and striving is only that Your Most Serene Highness might be set
    again in the right place, and to that end I shall in silence contribute everything possible.'
- page: 2
  en: 'I was on the road to Königsberg but had to turn back hither again. Now I am seeking to borrow some
    few thousand in money, and with these I shall watch for the return of the 2 Emperors and the Grand
    Duke. To these I shall attach myself and go with them wherever it may be, cost what it may. Through
    the Grand Duke above all I shall work on Your Serene Highness''s behalf — I have gained experience
    [uncertain: mann Erfahrung], and this I shall turn to use, and when the principal affairs of the monarchs
    have been transacted, I shall entreat the Grand Duke so long until he advances Your cause; I have
    too often made the observation that he who speaks last keeps the right of it with the great lords.
    — Herr v. Stein has now sunk low, and I believe that Your Serene Highness''s affairs will now shortly
    take the happiest turn. Before this man came forward and took the helm in hand, the King and the Queen
    were most devoted to Your Serene Highness, and at that time I hoped for the best. But as soon as Herr
    v. Stein spoke ambiguously of the command You had conducted, the tone of the court altered also. Meanwhile
    I believe there will now soon be a complete want of men who can hold the helm rationally. Therefore
    people will surely look about them again for the one man whom nature herself has [illegible] to homage,
    and will have to strive to fetch him hither. The hypocritical Kalckreuth is going to the old W., and
    war is to come forward. There is none in the State who has meant so honestly by the King as Your Serene
    Highness. Every man ties his dealings only to his own interest, and seeks his pocket'
- page: 3
  en: '[text lost] to [uncertain: hätten]. All tread softly so as to keep themselves in their places and
    feed themselves well. There is none who tells the monarch the truth and goes straight at it. Count
    [uncertain: Lottore] and Count Lohen are a pair of upright men, but both must go with the utmost caution,
    since otherwise they might easily be laid aside in the skat. — My humble counsel is that Your Serene
    Highness now do rightly at Erfurth, but rather await what shall come to pass in the great matters,
    for things do not remain, as surely as there is a God, thus and so, and in a flash everything may
    alter. — The sole endeavour of Your Serene Highness and of Your adherents must now be that You first
    come again into place. Why will You not go to Silesia? I would do it, would report to the King that
    I was there and that I would come to him. I answer for it with my life — if the King seeks Your Serene
    Highness again, then everything is at once in its track, all the more where the [uncertain: Konckerten]
    or the Emperor shall have prepared something in advance. You know the King: he has not the heart to
    propose anything to You, most gracious Lord. Besides, he now holds himself for poor and stripped of
    everything; but if You go to meet him and tell him that You will now help and counsel, yet will not
    be burdensome to him all the while, then he will idolise Your Serene Highness. What a piece of good
    fortune it would be if You were at present in Königsberg when the Emperor returns. Everything would
    go better and be negotiated with more courage. The present [uncertain: Alantones] d. K. would take
    a mighty fright at Your appearance, but soon every man would bow himself before You'
- page: 4
  en: 'deeply. — Let Your Serene Highness take this well to heart; procure, where it is possible, some
    few thousand together, and then go this road courageously. You will not fail, as surely as God is.
    — The South Prussian affairs are, as I have written to Your Serene Highness before, set on foot in
    the best way; the French Government has raised part of the sequestration and ordered the revenues
    to be handed over. The matter has been sent to Warsaw to the French Chargé d''Affaires, so that he
    shall make it known to the Ministry of Justice with the intimation that the monies are to be let pass
    unhindered. As soon as this has been made public in Kalisz from Warsaw, I shall see to it that You
    receive monies from thence. The letters to Lichnowski and Metzig are good and fully suited to the
    matter. [uncertain: Schnomchi] belongs at [uncertain: Traben], and there he must wait until the times
    change. To Herr Metzig I would write yet again separately, and set him right in such fashion that
    he shall long remember it. The townsmen there owe, in [uncertain: inq] sundry laudemial monies and
    of the 4000 Rthl remaining purchase sum, upwards of 8 to 9000 Rthl; why does the scoundrel not drive
    it in together and report that the money is there — then one would soon see how it might be got out.
    The rogue did, out of my hands, at the time when he helped to conduct the business with Bürger, receive
    200 in cash [uncertain: Er der], which I gave the fellow out of my own pocket; now he must do something
    for it, or he shall feel it. In deepest respect I remain, until death, Ber[lin?] the 20th of 7br 1808,
    Your Most Serene Highness''s humble and faithful servant Peter'

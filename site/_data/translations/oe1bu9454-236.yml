- page: 2
  en: 'has received from him the splendid assurance that not a single person to whom Your Serene Highness
    is indebted will ever receive a Groschen. He added that your father too will receive [uncertain: a]
    Heller. For all the people who have ever served and helped the Prince are utterly ruined and lose
    what is theirs — may God avert this and make a liar of Cosmar.


    Only the documents, and I beg most deeply and obediently for the letter to the Prefect. I remain,
    until death, Your Serene Highness''s. Mr Weigel wishes to buy; I have therefore deferred the lease
    contract. He follows my advice — I must first [uncertain: come to know] Your Serene Highness''s intentions
    and the circumstances, particularly how you stand with your children. Everything will then [uncertain:
    be found]. Blizanów


    11th July 1812


    humble and obedient servant


    v Triebenfeld'

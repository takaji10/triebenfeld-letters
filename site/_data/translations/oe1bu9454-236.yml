segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    Good old Weigel has been here. He has handed over to me all his affairs which he has with Your Serene
    Highness. According to our agreement I am to travel with him to Your Serene Highness as soon as I
    recover — the sooner God now helps me, the earlier I shall be with the old house at Your Serene Highness''s.
    His offers are good and certainly advantageous for Your Serene Highness.


    Sir von Sobottendorff may be easy; his affair too can be settled once I get there. I look forward
    most longingly to the papers in question, so as to keep the machine in motion. Let Your Serene Highness
    sign the enclosed letter and send it back to me by express, so that I may hand it over to the prefect.
    Honrichs is a wretched scoundrel.


    For the rest, I have just now heard a sad piece of news. My son, who has often been together with
    Cosmar,'

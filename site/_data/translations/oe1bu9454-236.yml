- page: 1
  en: '236


    Most Serene Prince,


    Most gracious Lord!


    Good old Weigel has been here. He has handed over to me the whole of his affairs which he has with
    Your Serene Highness. According to our arrangement I am to travel with him to Your Serene Highness
    as soon as I recover — the more quickly God now helps me, the sooner I shall be with Your Serene Highness
    together with the old house. His offers are good and certainly advantageous for Your Serene Highness.


    Mr von Sobottendorff may be reassured; his affair too can be settled [uncertain: were I] to come there.
    I look forward most longingly to the papers in question, so as to keep the machine running. Let Your
    Serene Highness sign the enclosed letter and send it back to me by express, so that I may hand it
    over to the Prefect. Honrichs is a wretched villain.


    For the rest, I have just this moment heard a sad piece of news. My son, who has often been together
    with Cosmar,'

- page: 2
  en: 'has received from him the splendid assurance that not a single person to whom Your Serene Highness
    is indebted will ever receive one Groschen. He added that your father too will get not a heller. For
    all persons who have ever served and helped the Prince are utterly ruined and lose what is theirs.
    May God prevent this and make a liar of Cosmar.


    Only the documents, and the letter to the prefect, I most deeply and obediently beg for. I remain,
    until death, Your Serene Highness''s. Mr Weigel wishes to buy; therefore I have deferred the lease
    contract. He follows my advice — I must first learn Your Serene Highness''s sentiments and the circumstances,
    particularly how you stand with your children. The payment will then be found.


    Blizanow, the 41st of July 1812


    humble and obedient servant


    v. Triebenfeld'

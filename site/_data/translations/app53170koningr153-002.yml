  en: '[Section 6 — Condescensorial Decree: Possession of the Olęder Martin Hunt]


    Done at the estate of the Trąbczyn olędry and at the house of the Freeborn Martin Hunt, on Thursday
    after the Feast of Saint Catherine, Virgin and Martyr, namely the 28th of November in the year of
    the Lord 1782.


    Present: the Honourable Michał Brzeżański, Leon Maszewski, and others; and also the Honest Bartłomiej
    Szepczyński of the village of Trąbczyn, general Court Summoner of the realm, proclaiming the present
    act.


    The commissarial office of the Greater Poland Voivodeship, insisting upon the decree issued in the
    ordinary general sessions of the Crown Tribunal of Piotrków, on Thursday after the Feast of Saint
    Hedwig, Widow and Elect, namely the 17th of October of the present year, between the Most Honourable
    Antoni Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanisław, plaintiff and defendant,
    and also the Right Honourable Stanisław Chełmski, Treasurer of Wschowa, defendant and plaintiff, and
    others expressed in that same decree by their appearances — by means of which decree, after the boundary
    category had been decided by that same Tribunal court, in the separate category of the recovery of
    possession of the olęder: since it was clear from the acts of the field offices that the Freeborn
    olęder Martin Hunt in no way stands on the right side of the line determined by the Tribunal court,
    and could not belong to the Right Honourable Chełmski, and that the Right Honourable Chełmski had
    been possessing that same olęder until now — therefore, notwithstanding the act of recovery of possession
    issued by the notarial office of the Gniezno Municipal Court, it was ordained that the Right Honourable
    Chełmski should return and restore that same Freeborn olęder Martin Hunt to the possession of the
    Most Honourable Prusimski within six weeks from the act of the same decree, to the present commissioner
    of the Greater Poland Voivodeship to be engaged by the Most Honourable Prusimski; or rather that the
    same Honourable Commissioner should transfer and release that same olęder to the Most Honourable Prusimski
    into actual possession at a calculated reckoning — the same decree or the aforesaid category setting
    it out more fully —


    descended today to the place described in the act at the request of the Most Honourable Antoni of
    Kolno Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanisław; and there, having
    established its jurisdiction and proclaimed it through the Court Summoner, transferred and released
    the Freeborn olęder Martin Hunt into the actual possession of the said Most Honourable Prusimski,
    who was present in person at this act; and left him in peaceful possession, no one challenging, obedience
    to the Most Honourable Prusimski, Starost of Niszczewice, having been enjoined on the said Freeborn
    Martin Hunt — as it leaves him by force of the present act.


    Józef Łukaszewicz, General Commissioner of the Greater Poland Voivodeship, by his own hand.'

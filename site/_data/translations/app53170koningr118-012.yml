segments:
- page: 1
  en: 'Done in Konin, on Friday, next after the Sunday of Misericordia, namely the 19th day of the month
    of April, in the Year of the Lord 1782.


    On behalf of the Illustrious Prusimski, Starost of Niszczewice, against the Illustrious Zakrzewskis
    and the Kalisz Land Court — a Report


    Let there be seen at this place a Report on behalf of the Illustrious Magnificent Antoni Prusimski,
    Starost of Niszczewice, Knight of the Order of Saint Stanislaus, against the Illustrious [Casimir]
    the father and the sons Zakrzewski, and [against] the Kalisz Land Court — for the Ordinary General
    Sessions of the Crown Tribunal of the Kingdom at Piotrków, issued — as the copy in the submitted documents
    stands.'

- page: 1
  en: 'My dear Schmidt, here is your Dubois; I almost blush to tell you with what interest I have read
    all these villainies, which does not, however, prevent me from asking you urgently for the continuation.
    — I shall not fail to push the Weigel affair, & be easy about the rest: I promise you that we shall
    come out of it with honour. I have frightful weather here, which at times chills my rustic passions.


    L. B. d. Mohrenheim


    Tuesday.


    Could you let me have for 2 days the [uncertain: Courier] of [uncertain: London]?'

  en: 'Document no. 1520


    Buda, 10 August 1440


    King Władysław III charges 300 marks on the villages of Wrąbczynek, Adamierz and Borzykowo in favour
    of Stanisław Czarny.


    Copy: Warsaw, AGAD, Metryka koronna, vol. 109, pp. 11–12. Entered on 27 April 1570 (from the original).


    We, Władysław, by the grace of God King of Hungary, Poland, Dalmatia, Croatia, etc., supreme prince
    of Lithuania and heir of Ruthenia, etc., make known by the tenor of these presents to all that we
    have received from the noble Stanisław Czarny, our beloved and faithful familiar¹, a horse or charger
    for one hundred marks of money and of Polish reckoning by a contract of market; and for his services
    which he has done for our majesty on this Hungarian journey to take up the insignia of our happy coronation,
    now by God''s gift accomplished, we give him two hundred marks; of which three hundred marks of money
    and of Polish reckoning, reckoning XLXVIIIᵃ gr(oschen) to each mark, together and jointly, assuringᵇ
    the said Stanisław and his descendants, wishing it, we give, donate, show and inscribe to him by these
    presents the same three hundred marks in and upon our villages of Wrąbczynek², Adamierz³ and Borzykowo,
    lying in the district of Pyzdry⁴, to be had, held, used and enjoyed and peacefully possessed by the
    same Stanisław and his lawful successors with all the uses of the said villages, fruits, rents, revenues,
    incomes, fields, meadows, plains, woods, heaths, rivers, ponds, fisheries, mills, emoluments, appurtenances
    and incomes whatsoever [p. 12], for so long until the said three hundred marks are paid to him or
    his successors in full. When they are paid, the possession of the said villages shall return to us
    and our successors with full right. Our royal hospitality dues always saved. In faith of which our
    seal is hung on these presents. Given at Buda on the Wednesday of the feast of St Lawrence the Martyr,
    in the year of the Lord one thousand four hundred and forty⁵.


    On the report of the magnificent Mikołaj of Szarlej, castellan of Wł(ocławek)⁶.


    ᵃSo the copy, instead of XLVIII.


    ᵇSo the copy, instead of assecurare.


    ᶜSo the copy.


    ¹Stanisław Czarny, see above, no. 1479/1.


    ²Wrąbczynek, parish of Zagórów; Niedamierz, today Adamierz, parish of Zagórów; and Borzykowo, parish
    of Pyzdry: royal villages near Pyzdry.


    ³Wrąbczynek, parish of Zagórów; Niedamierz, today Adamierz, parish of Zagórów; and Borzykowo, parish
    of Pyzdry: royal villages near Pyzdry.


    ⁴Wrąbczynek, parish of Zagórów; Niedamierz, today Adamierz, parish of Zagórów; and Borzykowo, parish
    of Pyzdry: royal villages near Pyzdry.


    ⁵The date agrees with the king''s itinerary.


    ⁶Mikołaj Szarlejski of Ściborze, castellan of Inowrocław, later palatine of Brześć, one of the commanders
    at Chojnice in 1454, captain of Bydgoszcz, d. 1457?'

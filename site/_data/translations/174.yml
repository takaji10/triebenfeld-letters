status: draft
segments:
- page: 1
  en: 'the Actuarius is always paid separately, and at every act [uncertain: is made?] — this fraud [amounts]
    annually to a good 200 Rthl; the carriage-services one could likewise reckon, as also the board, at
    200 Rthl, and consequently a profit is already made here. And if it be further assumed that he takes
    over the post of a Rendant and all other business besides, then again at least 600 Rthl will be saved
    here, and in all as much gained as the barn brings in. Moreover the fees [Sporteln] will in future
    rise and will amount to at least 1200 Rthl; in this way the Justitiarius will cost nothing, and if
    no advocate need be kept any longer, there will still remain several hundred as the annual surplus.
    Always shall I, wherever anything can be effected by my good will, strive with the most glowing zeal
    to advance Your Serene Highness''s advantage. But it is a misfortune for me that, while I labour here
    [uncertain: tirelessly] for Your Serene Highness, my own husbandry goes entirely to ruin — I cannot
    see to my estates, because I must be here. My people keep house unbridled, and, since I never come
    there, cheat me frightfully — Would Your Serene Highness therefore show me the grace to send Hahn
    to Schweiner, and to let my steward Käufer and the forester Pelzold be told that Your Serene Highness
    were, as time would show, interested in Schweinen — that word went about that the officials kept bad'
- page: 2
  en: 'house. — She [or: You] would have it intimated to him that we should watch over the [uncertain:
    profit] of his master and prevent all detriment, [and] that she should be frightfully chastised. I
    hope this will have effect, and the fellows will not henceforth cheat quite so unwatched, for a Prince
    is after all more feared than a knight errant wandering about. Had Your Serene Highness then sent
    the 1390 dkg in [uncertain: the] Lichnowchi matter — I have firmly promised it to the man. Certain
    people await me at Trąbczin who wish to buy several Hufen of land and to pay at once in cash; as soon
    as I get out there I shall see to this, and then Your Serene Highness has the money back again directly
    — This would have been done already, but I cannot [uncertain: get away] from here so as to leave the
    most important matter of all standing half-done. The Amelang letter I return — May Your Serene Highness
    deign nevertheless to write to the patron. That you had certainly reckoned upon the 100000 with such
    sufficient security, for the 50/2. Rthl, such as had been given, were, however, no good fortune —
    Triebenfeld had reported to you the difficulty concerning the revision of the assessments earlier
    than he [did]; you, however, held this to be a mere whim, and reckoned upon his laissez faire and
    great influence, that he would so conduct the matter'
- page: 3
  en: 'that, with security so great, one would be content with the [uncertain: Landrath''s] [illegible],
    [namely] the attestation in place of a guarantee. All the more so as within a short time far higher
    revenues, which the Chamber itself would approve and which consist of nothing but clear interest,
    would be worked out. That too will have its effect. Of news one hears nothing at all here; I sit here
    as though I sat in Siberia. Has Your Serene Highness any, then communicate it to your servant. My
    kinsman [uncertain: Crain] the Colonel von Wiesołowski is here from Russia, and by his assurance,
    and for what he vouches, the reigning Emperor has already a handsome army on the [illegible] — In
    our region, that is by Knon and as far as Odessa, there stand 80000 men — by Welna 60000 men, and
    just now there come forth further 20 [uncertain: Tomische] Cossack pulks — each [uncertain: regiment]
    is 2000 [uncertain: horse] strong, that is 180000 men on this side alone. In Courland and other places
    considerable [uncertain: corps] have likewise been drawn together, so that above 300000 men stand
    mobile there. God grant that I may receive only the wished-for news touching Your Serene Highness''s
    health. In deepest reverence I remain, until death, Your Serene Highness''s [servant]. Let Your Serene
    Highness have 3 more pieces of [uncertain: Büse] made of the size these are, and ordered, [text lost]
    Kalisz, the 13th of March 1805 faithful humble and obedient servant v Triebenfeld'

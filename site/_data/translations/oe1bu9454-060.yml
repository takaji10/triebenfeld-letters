- page: 2
  en: 'the lamenting and whimpering of my children, from whom I indeed hide myself but who nevertheless
    pursue me by letter with the most dreadful songs of lamentation. I can give them nothing, for — as
    God is true — I myself have nothing, and my daughters work for money and let it be sold in secret
    so as not to grieve me. This alone tears my heart the most. I myself endure hunger, thirst and every
    peril of life; I have few needs and am neither a gambler nor a wencher; I would take no account of
    all these calamities but rather (if I had to bear them alone) endure them without [uncertain: complaint],
    but the reproach that I must see my children working for money, this deranges my senses and altogether
    blunts my feelings. With 1860 Rthl I could be saved, but where am I to get them, since here and in
    Schweinern the sequestration


    has been [uncertain: imposed] — My credit is now quite gone, I cannot obtain 100 Rthl and must go
    without. I meant to raise money out of Zagorow upon the decrees of the French General Government.
    To take 1800 Rthl of it for myself and to send Your Serene Highness whatever more came in — I offered,
    since ready money is not let out of the country, to accept horses, sheep and spirits; the poor Honrichs
    entered into it and wished to see to this. But they have not only forbidden it, they have arrested
    Honrichs on the spot and threaten to shoot him — I now have my hands quite full in trying to save
    the man, who is the father of 1 children. So here too, instead of help, I have expense, grief and
    care.


    I should have timber, boards and produce with which to obtain money, but they let me touch nothing
    and have laid an attachment on everything — I am absolutely first to pay the Lahr matter, the 1860
    Rthl thereon; then they will raise the sequestration and release to me my property together with all
    the produce. From the blood'

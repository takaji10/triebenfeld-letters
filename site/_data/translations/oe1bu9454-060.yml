- page: 3
  en: 'blood-leech van der Lahr, Grävenitz is sending [uncertain: us] at this moment a receipt and a [uncertain:
    breast] to Mr von Loen, to the effect that he is satisfied save for a few hundred rt of costs and
    interest, but that he consents to the lifting of the sequestration and execution. These I am sending
    this very hour to Wrocław to Loen; but through the rumour the sequestration has now been occasioned
    on account of the old and new interest of 1860 rt as well, and until I pay these they will not lift
    the sequestration after all — My fine [uncertain: Fächste], which between brothers were worth 1000
    rt., Loen has already had sold for 460 rt, and has set off one item of interest against it — O, I
    could go mad. I should have murdered before I sacrificed myself for King, country and all and gave
    away such sums — I might then perhaps, as now, [uncertain: have been able to change tragically], but
    my children ought not to have had to work for money. [uncertain: Aubte Vierchitz] — so I had a friend
    who would not have let me [illegible], but he is no more — I wrote to Mutius — but he himself is like
    to starve.


    Your Serene Highness is still the only one I now have on this round earth to whom I can pour out my
    heart. But whether you can help, God knows — It is 1800 rt by which I can be saved; I shall then,
    it is true, still be in debt to the Köckritz family, but that I can take at once out of produce which
    lies here under arrest, and satisfy everyone.


    Were it possible for Your Serene Highness to raise the 1800 rt there, I would beg that this sum be
    sent at once to Professor Schade, so that he might immediately pay the interest and press for the
    lifting of the sequestration — Eternally should I thank Your Serene Highness for it. In this hour
    I receive a letter from Lombardini — it is of the 29th of July and already 7 days old — that I am
    to come to Your Serene Highness.'

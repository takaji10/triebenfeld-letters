- page: 4
  en: 'Gladly as I would obey Your Serene Highness''s commands, I cannot do so now. I cannot stir from
    the spot until I am saved and have the estates and the produce free. Then I can travel day and night;
    gladly will I do it, and were I obliged to go down into hell itself; only just now I am wholly unable
    to travel 3 miles. My horses are gone to the devil and money I have none. If Your Serene Highness
    can procure counsel, be pleased to do it soon. But command most graciously that everything be sent
    by an express. The posts go too slowly, as is proved by the letters I receive from thence. In deepest
    reverence I remain, until death,


    Your Serene Highness''s


    Konotop


    the 4th of August


    1809.


    humble and obedient servant


    v Triebenfeld'

- page: 3
  en: 'blood-leech von der Lahr, Grävenitz sends us at this very moment a receipt and a letter to J. W.
    von Loen, to the effect that he is satisfied save for a few hundred d of costs and interest, but that
    he consents to the raising of the sequestration and execution. This I am sending this very hour to
    [uncertain: Strelan] to Loen; but through the noise the sequestration has now also been occasioned
    on account of the old and new interest of 1860 Rthl, and until I pay these they will not raise the
    sequestration after all. My fine [uncertain: crops], which as between brothers were worth 1000 Rthl,
    Loen has already had sold for 460 Rthl, and reckoned off one item of interest against it — O, I could
    go mad. I ought to have murdered before I sacrificed myself for King, country and all and gave away
    sums — I should then perhaps, as now, have been able to [uncertain: end] tragically, but my children
    ought not to have had to work for money. Had [uncertain: Vierchitz] lived, I should have had a friend
    who would not have let me sink, but he is no more — To Mutius I wrote — but he means to starve himself.


    Your Serene Highness is still the only one I now have on this round earth to whom I can pour out my
    heart. But whether you can help, God knows — It is 1800 Rthl by which I can be saved; then I am indeed
    still indebted to the Kockeitzsch family, but that I can take at once out of produce which lies here
    under attachment, and satisfy everyone.


    Were it possible for Your Serene Highness to raise the 1800 Rthl there, I would beg that this sum
    be sent at once to Professor Schade, so that he might immediately pay the interest and press for the
    raising of the sequestration — I should thank Your Serene Highness for it eternally. This very hour
    I receive a letter from Lombardini — it is of the 29th of July and already 7 days old, saying that
    I am to come to Your Serene Highness'

  en: '60


    Most Serene Prince


    Most gracious Prince and Lord, With a bleeding heart I must now nevertheless report to Your Most Serene
    Highness my exceedingly great misfortune. At Schweiner everything has been sealed up and taken under
    attachment, in order to sequester the estates.


    That usurious van der Lahr had applied for this because the products sent to him, such as iron and
    boards, were some 6 weeks on the way owing to the [uncertain: lower] water. Now the dog has his payment,
    but I am ruined, because the other creditors will not desist any sooner than until they have their
    interest. Since everything there and here has been placed under attachment, I now have [uncertain:
    little ground] and know of absolutely no way to save myself. My misfortune is now without bounds,
    and my children will be beggars along with me, for nothing comes out of the sequestration; everything
    is consumed, the interest piles up and the subhastation follows, so that estates worth 200000 rt.
    will in these times be squandered for [uncertain: a tree] a third part. Never should I have believed
    that things could come to this with me — I could once count myself among the most well-to-do men of
    the State; now already I must regard myself as a beggar, and why? Merely because I was too good, wanted
    only to help the King and other men, because I never looked to my own but to others'' interest — I
    seem to shun going among men; I live like a savage in solitary corners and lament my own and my children''s
    fate, which before God I do not deserve. Sleep is a stranger to me, and men who only mock me I must
    flee — what grieves me most is'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, With a bleeding heart I must now after all report to Your Most Serene
    Highness my exceedingly great misfortune. They have sealed up everything in Schweiner and placed it
    under attachment, in order to sequester the estates.


    The usurious von der Lahr had petitioned for this because the products sent to him, such as iron and
    boards, were some 6 weeks on the way owing to the [uncertain: low] water. Now the dog has his payment,
    but I am ruined, because the other creditors will not withdraw any sooner than until they have their
    interest. Since everything there and here has been placed under attachment, I now have small [uncertain:
    Jord] and know of absolutely no way to save myself. My misfortune is now without bounds, and my children
    will become beggars with me; for out of the sequestration nothing comes, everything is consumed, the
    interest accumulates and the compulsory auction follows: estates which are worth 200000 Rthl will
    in these times be squandered for a bare 1/3 part. Never would I have believed that things could come
    to this pass with me — I could once count myself among the most well-to-do men of the state; now already
    I must regard myself as a beggar, and why? Merely because I was too good, because I wished only to
    help the King and other men, because I never looked to my own but to others'' interest. I seem to
    myself to go about among [uncertain: Wenschen]; I live like a savage in lonely corners and bewail
    my own and my children''s fate, which before God I do not deserve. [uncertain: Schläfl] is strange
    to me, and men who only mock me I must flee — what grieves me most is'

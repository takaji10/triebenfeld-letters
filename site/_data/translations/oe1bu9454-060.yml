- page: 2
  en: 'the wailing and whimpering of my children, from whom I indeed hide myself, but who nonetheless
    pursue me with the most dreadful lamentations by letter. I can give them nothing, for as God is true
    I have nothing myself, and my daughters work for money and let it be sold in secret so as not to grieve
    me. This alone tears my heart the most. I myself endure hunger, thirst and every peril of life; I
    have few needs, being neither gambler nor philanderer; I would take no heed of all these mishaps,
    but rather — if I had to bear them alone — would suffer them without confusion; but the reproach that
    I must see my children working for money, this deranges my senses and dulls my feelings altogether
    — With 1860 rth I could be saved, but where am I to get them, since here and at Świniary the sequestration
    has been imposed — My credit is now quite gone; I cannot get 100 rt and must go without. I wanted
    to raise money out of Zagórów upon the decrees of the French General Gouvernement, to take 1800 rt
    of it for myself and send what more came in to Your Serene Highness — I offered, since ready money
    is not let out of the country, to accept horses, sheep and spirits; the [uncertain: poor] Honrichs
    entered into it and wished to see to this. But not only has it been forbidden, Honrichs has been arrested
    on the spot and they threaten to shoot him — I now have my hands quite full to save the man, who is
    the father of 7 children. So here too, instead of help, I have costs, sorrow and anxiety.


    I should have timber, boards and produce with which to obtain money, but they let me touch nothing
    and have laid an arrest on everything — I must absolutely first pay the van der Lahr matter, in which
    the 1860 rt, then they will lift the sequestration and release to me my property again together with
    all the produce. From that blood-'

- page: 4
  en: 'Gladly as I would obey Your Serene Highness''s commands, I cannot do so now. I cannot stir from
    the spot until I am saved and have the estates and the produce free. Then I can travel day and night.
    Gladly will I do it too, even if I had to go down into hell itself; only just now I am wholly unable
    to travel 3 miles. My horses are gone to the devil and money I have none. If Your Serene Highness
    can find counsel, may you deign to do it soon. But command most graciously that everything be sent
    by an express. The posts go too slowly, as the letters which I receive from there prove. Most reverently
    I remain, until death,


    Your Serene Highness''s


    humble and obedient servant


    v Triebenfeld


    Kontop


    the 4th of August


    1809.'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The Building Councillor Gleich has assured the Criminal
    Councillor Grimm that the punctation concluded between Rochlitz and Honrichs concerning Wittow, together
    with the beginning, on account of the power of attorney given to Nochli, lay in the Trąbczin archive,
    of which I had taken the key into my own keeping. I at once charged old Tiel and the justice-burgomaster
    Schenck with going through all the papers there present, to see whether the said punctation and power
    of attorney were really to be found in that archive. Alas, however, not a syllable of these papers
    has been discovered, and for that reason I cannot [move] from the spot with this matter, so finely
    set in train. Will Your Serene Highness but grant the one grace and command [uncertain: Glenck] that
    he absolutely and without the least delay bring these pieces here along with his Rochlitz – for otherwise
    you risk, most gracious Lord, losing for ever the advantage of 14000 Rthl already won; and moreover
    you would be like to have much vexation with Weigel and the Schleifen, since Honrichs pays neither
    capital nor interest. From Amelang I have letters today – he writes that I need only have the assessments
    properly justified, and then everything would come right of itself.'
- page: 2
  en: 'A good general, he says, always thinks upon a fortunate retreat, and more of the like. Although
    the windbag says nothing more solid, I nevertheless believe that one will be content with the Landrath''s
    revision, his attestation and guarantee; for this was my own proposal, to lay it upon that man''s
    heart. – So I must now drain the cup of suffering and do the business with the wretched Blomberg.
    But the base fellow will not lay a finger to anything unless I pay him 1000 Rthl in advance as well
    – for the reports submitted by him, for his protocols upon the dismemberment plan, I have already
    had to pay him 900 Rthl in cash; and if all is to be brought to a clear reckoning, then I must find
    means and fill the fellow''s maw. The Rendant Peter here is so good as to advance me the money. Next
    Monday I go with a Councillor from the Chamber to Trąbczin; he inspects the locality according to
    the dismemberment plans submitted by the Landrath, and upon these I obtain the concession without
    having to approach the King. If only, as it now appears, all succeeds, then we gain: 1. the surplus
    last reported from Olesnica, Stetteweck''s widow etc., 50000 Rthl; 2. by the dismemberment, in cash
    200000 Rthl; 3. the loan still to be hoped for, some 100000 Rthl — makes 350000 Rthl. With this sum
    many a [uncertain: Beer] may indeed be redeemed, and by my reckoning'
- page: 3
  en: 'everything be [uncertain: applarirt]. To be sure, I shall yet have many a sleepless night and many
    an hour full of care before I can reach the goal; meanwhile, so far as my health at all permits, I
    shall labour on untiringly until I have attained it. As regards Stetlewek I should conclude everything
    this very week, and thereby clear a great stone of stumbling out of the way. With Olesnica all is
    set in train, and I hope very soon to have done with the business and to be able to procure Your Serene
    Highness the profit last reported to him. For the propination rights I have many tenants; I shall
    choose the one who offers most and press for the greatest possible security. According to the dismemberment
    plan submitted by the Landrath, S. new villages are to be established – May Your Serene Highness deign
    to send me the names for them by this messenger, for I must submit this to the Chamber. I had at first
    a mind to give in the appellations here enclosed; but as there was still some time, I leave this to
    Your Serene Highness''s discretion. For the rest, the contract with Schenck follows herewith. I have
    much need of him and must sweeten the man''s mouth; I have therefore drawn up what he absolutely demanded.
    — Yet two points are burdensome to me: 1. 5 Hufe of land is too much; 2. that he means to appoint
    the actuarius or keeper of the protocol. May Your Serene Highness deign to send me the contract back,'
- page: 4
  en: 'and to write in your own hand that you must take exception to ratifying the contract (NB my power
    of attorney is not sufficient) – that 5 Hufe of land, with so considerable a salary, would be too
    much – that more than 60 Morgen you could by no means concede. That you further reserve to yourself
    in future to appoint the keepers of the protocol or the actuaries yourself; the present man commended
    to you, by name Brauer, you would gladly approve – but you could not concede the point as such, because
    otherwise all opportunity would be taken from you of providing for the men who have served you. I
    shall then so manage everything that Mono: Schein is set at ease thereby. As soon as I have done with
    Schenck, Grimm will be discharged, for the man is sinfully idle and always ailing. At present Schenck
    has 200 Rthl, Grimm 400 Rthl; the fees which Your Serene Highness may receive amount to at least 400
    Rthl. NB up to now Schenck has taken all the fees, making 1000 Rthl. By the contract Schenck receives
    in salary 800 Rthl, for 2 horses 120, for 2 Hufe of land the rent 30, making 950 Rthl; [uncertain:
    there follow accordingly 50 Rthl / there are therefore 50 Rthl wanting]. The writing materials must
    be paid for at a higher rate, and also must'

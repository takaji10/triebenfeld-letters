status: draft
segments:
- page: 1
  en: Done in Konin, in the particular land courts of the same district, on the Monday nearest after the
    Sunday Septuagesima in the year of the Lord one thousand seven hundred and twenty-eight — this from
    the adjournment made by that same court on the Monday next after the Feast of Saint Matthew, Apostle
    and Evangelist, most recently passed, in the now-elapsed year one thousand seven hundred and twenty-seven
    — lawfully proceeding and arriving at the present day.
- page: 2
  en: 'Between the Honourables Chełmski and the Honourable Prusimski — Decree of Location.


    In the judicial cause and action described below, instituted and initiated — having fallen to the
    party cited below, at a sitting of the particular land courts here in Konin held on the Monday nearest
    after the feast of the Most Holy and Undivided Trinity in the most recently elapsed year 1727 — by
    the plaintiff party named below, but not then decided owing to the press of business at that time,
    and remaining and pending in the dockets awaiting adjudication among other causes: — the instigator
    of the present court and his informants, the Honourables Franciszek and Józef Ścibor Chełmscy, heirs
    and possessors of the goods of the villages of Łukom, Łomowo, and others belonging thereto, plaintiffs
    — have cited before the present Kalisz land court and the particular land terms of the district of
    Konin — the Honourables Krzysztof Prusimski as principal defendant, and further Antoni Prusimski his
    son, and the noblemen Niłecki, Kałuzoski, Jerzmanoski, Cieszkoski, Zdzęnicki, Tomaszeski, as retainers,
    and other noblemen whose surnames are at present unknown and are to be stated at the time of the session,
    and likewise the subjects of the goods of Trąbczyn whose names are at present unknown but are to be
    specified after they become known — the co-principals carrying out the orders of the same Honourable
    Prusimski — in respect of their persons and goods in general, and of any and all sums of money held
    and to be held — the sons with their parents, the retainers and subjects with their lords, to adhere
    to the protest made or to be made by [the plaintiffs] against the same — cited for the penalties prescribed
    by the laws of the Kingdom, which they have indeed incurred and merited, for the reason that the same
    Honourable Prusimski, having observed no neighbourly friendship and having given no consideration
    to it — nay, having set it altogether aside — not content with prior damages, acts of violence, injuries,
    and grievances — which, for the sake of preserving'
- page: 3
  en: 'the friendship that belongs to living as neighbours, have up to this time not yet been submitted
    to the public records of the Kingdom and set out — most particularly, at a certain time to be stated
    at the hearing of the cause, ordered shingles, otherwise called Szkudeł, a hundred threescore of them,
    prepared on the plaintiff''s own estate and present there, together with a certain dwelling (gaza)
    to be burned by fire; and he was unwilling, despite being frequently called upon, to make good the
    damages caused thereby; and suffered the force of that same over-kindled fire to all but consume the
    children dwelling in that same dwelling (gaza) and endure it for anyone to suffer — and most recently,
    at a time to be declared at the session, ordered four plough-oxen kept for the use of the glassworks
    (officina vitraria) to be seized, without any pretext or claim, on the plaintiff''s own estate, during
    his violent invasion of it in arms and in a band, to be detained by him for some time, to be deprived
    of their labour, and damage to be caused thereby — nay, on the occasion of a demand made by the Honourable
    Józef Chełmski, to scheme against his very life — not in the least satisfied with these things, and
    although he knew full well that the present plaintiffs had attended to their business at the ordinary
    general courts and at the tribunals of the Kingdom at Piotrków, and were residing there amid the various
    persons and causes there being pursued — he dared to instruct that same Honourable son of his and
    the above-mentioned retainers and subjects to commit additional violence upon [the plaintiffs]; and
    those so instructed were ordered to invade the plaintiffs'' own estate, which belongs from antiquity
    to the goods of Łukom and has been in continuous use, with an armed force in groups, with sabres (frameis),
    with long and short firearms (bombardis) and other kinds of weaponry, forcibly and violently, and
    by such means — allegedly appropriating that same estate to themselves — to seize the hay gathered
    into carts from that same estate, in no small number of cartloads, to see to it that it be [uncertain:
    conveyed] to the goods of Trąbczyn, and thereby to cause the loss of livestock, and to carry out other
    acts of violence to be proven by full inquisition — through which they incurred penalties — for the
    decreeing of which penalties and for restitution of damages they are cited — the citation itself with
    its fuller copy in respect of the foregoing existing against them — the present Kalisz land court,
    in the particular land terms of the district of Konin, [examining] the controversies of both aforementioned
    parties — the plaintiff party of the Honourable Chełmski appearing personally through the Honourable
    Józef Chełmski in his own name and in the name of his brother, and the cited party of the Honourables
    Prusimski, husband and wife,'
- page: 4
  en: 'and of the other defendants appearing before it through the Honourable Konstanty Marszyński, and
    contesting judicially — having heard what was judicially done in the foregoing — deciding the term
    of the plaintiff party, instituted before the present court on account of the appropriation of the
    estate and of the violence and damages caused: since the cause of the estate is being ventilated before
    its own court, it finds that a commissarial descent of the Sworn Commissioner of the Palatinates of
    Poznań and Kalisz together with two arbitrators to be appointed from each side is necessary — decreeing
    that both parties together shall convey, at their mutual cost, the aforesaid Honourable Commissioner,
    namely the Honourable Albertus Biskupski, chosen by their mutual consent, and two arbitrators each,
    to and at the estate from which the controversy between the inheritances of the goods of Łukom and
    Trąbczyn has arisen on the Monday nearest after the Sunday Misericordiae; and the said Honourable
    Commissioner and arbitrators shall inquire both into the ownership of the disputed estate and into
    the transgressions and damages caused as set out in the protests of both parties, shall conduct sworn
    inquiries (inquisitiones juratorias) in that name through sworn witnesses of advanced age well acquainted
    with the matter, and shall decide and adjudicate whatever is found by them among the parties according
    to justice and equity in all their claims — save for the right of appeal from the definitive sentence
    alone, reserved and safeguarded for the party that feels itself aggrieved, [such appeal] only to the
    present court, however — and both parties are to perform all the foregoing, [the default penalty being]
    a fine of fourteen Polish marks, payable by each party — half to the [opposing] party and half to
    the court — instantly and in the present [term] — under penalty of banishment and proscription from
    the Kingdom of Poland and its annexed dominions, which is hereby decreed by the present court and
    imposed upon the party contravening the present decree in the event of non-performance of the foregoing
    — and any General Royal Messenger present in [the relevant] place is appointed to proclaim and announce
    in the customary manner the penalty of the same banishment and proscription from the Kingdom of Poland
    and its annexed dominions, as hereby decreed and imposed in the manner aforesaid upon the party contravening
    the present decree, to the party complying with the present decree — and after the proclamation of
    the penalty, as well as after the proclamation of the same penalty of banishment and proscription
    from the Kingdom of Poland and its annexed dominions, the present cause together with its whole effect
    and the parties themselves are hereby remitted by the present court to the Magnificent'
- page: 5
  en: Captain of the place or to his competent captain's municipal court (officium capitaneale castrense),
    under the jurisdiction of which the party contravening the present decree — with his person and goods
    — is subject, for further and final execution in the foregoing to be carried out and determined in
    proper legal order — and the return of the exported citation having been acknowledged before the records
    of the present court and drawn from those same authentic records is herewith delivered to the plaintiff
    party; and the present court and its chancellery are hereby discharged in respect of that delivery.

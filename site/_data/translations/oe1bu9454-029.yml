- page: 1
  en: '29


    Right Honourable Sir,


    Most highly revered Councillor of War!


    When I had the honour of meeting with Your Right Honourable and the Court Councillor Hahn in Łosiów
    near Brzeg, you were so gracious as only to promise a rendezvous, after the return from Memel. Since
    this has not yet come about, and since I presume that Your Right Honourable will by now be in Wrocław
    again, I hereby most obediently venture to ask whether I may have hope, and when, through in Wrocław
    was to wait upon, since I have been asked about it by my most gracious Lord, His Serene Highness [text
    lost]'

- page: 2
  en: 'It would make me very happy if I could have the honour of speaking with Your Right Honourable;
    only at this very moment I hear that we too are to receive French quartering here: then I could not
    stir from the spot, and it would be harder still if I were obliged to clear out the stables, and [I]
    shall seek another place of abode. Notwithstanding this, I hope soon to be able to have the honour
    in person of assuring you that in deepest reverence I have died [uncertain: erstorben] ad


    Your Right Honourable


    Schlawenschitz


    faithfully and most obediently


    the 10th of February Bal[illegible]


    1808'

- page: 2
  en: 'It would make me very happy if I could have the honour of speaking with Your Right Honourable;
    only, at this very moment, I hear that we too are to have French troops billeted here: in that case
    I could not stir from the spot, and it would be harder still if I were to have to clear out the stables.
    and will seek another place of residence. Notwithstanding this, I hope I may soon be able to have
    the honour of assuring you in person that in deepest reverence I have died [uncertain: ad]


    Your Right Honourable''s


    Sławięcice


    the 10th of February 1808


    faithfully and most obediently


    Bally'

segments:
- page: 1
  en: 'Right Honourable Sir,


    Most highly to be revered Councillor of War!


    When I had the honour of meeting Your Right Honourable with the Court Councillor Hahn at Lohsen near
    Brieg, you were so gracious as to promise a rendezvous, only after the return from Memel. Since this
    has not yet taken place, and I surmise that Your Most Honoured Self will already be in Breslau again,
    I take the liberty herewith of asking most obediently whether I may have hope, and when, of waiting
    upon you in Breslau, since I have been asked about it by my most gracious Lord, His Serene Highness


    10 February 1808'

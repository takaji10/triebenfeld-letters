status: draft
segments:
- page: 1
  en: Right Honourable Sir, most highly to be revered Councillor of War! When I had the honour of meeting
    Your Right Honourable with the Court Councillor Hahn at Lohsen near Brieg, you were so gracious as
    to promise only a rendez-vous, after the return from Memel. Since this has not yet taken place, and
    I presume that Your Right Honourable will already be in Breslau again, I hereby most obediently make
    bold to ask whether I may have hope, and when, of waiting upon you in Breslau, since I have been asked
    about it by my most gracious Lord, His Serene Highness 10 Febr. 1808
- page: 2
  en: 'It would make me very happy, if I could have the [uncertain: marriage] of speaking with Your Right
    Honourable; only at this very moment I hear that we too are to receive French quartering here: in
    that case I could not stir from the spot, and it would be harder still if I were obliged to clear
    out the stables, and shall seek another place of residence. Notwithstanding this, I hope soon to be
    able to have the honours of assuring you by word of mouth that in deepest reverence I have died to
    Your Right Honourable Schlawenschitz, faithfully most obediently the 10th of February Bal[illegible]
    1808'

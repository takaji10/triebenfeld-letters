- page: 2
  en: 'ratify the contract himself or dispose of the estates in some other way. According to our plan,
    Mr von Brzechffa intends, upon his return, to summon all the arrears-debtors at once before the lower
    land court in Konin, and through this judge, who is his relative and bosom friend, to have himself
    empowered to compel payment by the strictest execution, which hitherto has always been forbidden.


    For the rest, a few days ago the suit with the Wrąbczyn peasants was won by Your Serene Highness in
    the Tribunal Solenne. The contract is wholly annulled, the peasants are ordered to pay the arrears
    and may be evicted and their holdings sold to others — the judgment was handed to the peasants yesterday
    by the [uncertain: Court Summoner] von Jarnowski. I must now await the period laid down in the Code
    Napoléon after the publication of the judgment, in order then to proceed with the harshest execution.
    Perhaps I shall succeed in the meantime in [uncertain: coming to terms with some of the fellows] and
    in obtaining a few thousand rt., which I would bring with me together with Mr von Brzechffa.'

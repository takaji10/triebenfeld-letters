- page: 4
  en: 'settle upon it, and if the Dąbska woman must make good the damage and surrender the 6 years'' revenue,
    then the estates — which are worth 300000 Rthl throughout — are clear of debts, and it is then once
    again a fine whole. Upon my arrival Brzechsta will lay all this before Your Serene Highness himself.
    I should long since have gone to Warsaw myself in this matter, had it ever been possible to raise
    the costs; for all that could come in hitherto has barely sufficed to meet the frightfully heavy levies.
    Thus now all deliveries to Warsaw, since most of the troops have been drawn thither, must be rendered
    in kind at once, and sums paid for their clothing besides. The distress is on that account general
    and has here already reached its utmost height; I remark only so much, that the demands of the people
    in Warsaw on account of the Trąbczyn matter would cost nothing, but that these two honest men would
    set it in train and see to it out of true friendship, in quiet. So much, however, is certain, and
    everyone from here must assure Your Serene Highness of it, that the estates are preserved and saved
    for you; the how and the where will show itself in its own time. In deepest reverence I remain


    Your Serene Highness''s


    Kopojno


    the 23rd of February 1812.


    humble and obedient servant


    von Triebenfeld'

- page: 4
  en: 'themselves there, and if the Dąbska must make good the damage and surrender the 6 years'' revenue,
    then the estates, which are at all times worth 300000 rt., are clear of debts — and it is then once
    again a fine whole. Upon my arrival, [uncertain: Mr] von Brzechffa will lay all this before Your Serene
    Highness himself. I would long since have gone to Warsaw myself in this matter, if it had ever been
    possible to raise the costs, for all that could come in hitherto has scarcely sufficed to meet the
    terribly heavy levies. Thus now all deliveries to Warsaw, since the greater part of the troops have
    been drawn thither, must be rendered in kind, and sums must be paid for their clothing. The distress
    is on that account general and has here already reached its highest pitch; this much only I note,
    that the demand of the men at Warsaw is that the Trąbczyn matter shall cost nothing, but that these
    two honest men would set it in train and attend to it quietly, out of true friendship — So much, however,
    is certain, and everyone from here will have to affirm it to Your Serene Highness, that the estates
    are preserved and saved for you; the how and the where will show itself in due time. In deepest reverence
    I remain


    Your Serene Highness''s


    Kopojno


    the 23rd of February 1812.


    humble and obedient servant


    von Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    That a lease contract has been concluded with the sub-prefect concerning the Zagórów estates, sub
    spe rali, I have most obediently reported to Your Serene Highness; at the same time I informed the
    same most high person that I intended to arrive at Sławięcice with Mr von Brzechffa on the 8th of
    this month. Since, however, both the prefect Garczynski and likewise the sub-prefect von Brzechffa
    were summoned to Warsaw by express courier, the plan of being at Sławięcice on the 8th [uncertain:
    was wrecked].


    In the meantime the sub-prefect will quite certainly be back here on the 11th or 12th of March, and
    then the journey to Sławięcice will be set out upon at once. Mr von Brzechffa will bring 2 to 3000
    rt. in money with him directly, and then it will depend upon Your Serene Highness whether the same
    most high person wishes to'

- page: 3
  en: 'The Oleśnica matter will be won in this instance just [uncertain: as] the Wrąbczyn one, and doubtless
    the 3 villains, who are here checkmated, will not push the matter further, but will have to seek their
    [uncertain: safety] in flight. The Trąbczyn matter Mr von Brzechffa is now investigating in Warsaw
    with the prefect Count Garczynski. It must be brought before the Rada Stanu, and there these two friends
    of mine are [uncertain: sounding out] the majority of the members as to whether one may bring this
    matter forward there and hope for a swift and favourable outcome. In the judgment of every thinking
    man, Your Serene Highness must have the estates back. For the Commission Rządząca took them from Your
    Serene Highness 4 months after the Peace of Tilsit, notwithstanding that everything the King had done
    during the time of possession was to remain in its [illegible], which was also guaranteed by Napoleon,
    the Russian Emperors and the King of Saxony.


    Upon the estates there stand, so far as I am aware, 80000 Rthl of debts; but if the old Hollanders
    will gladly give 40000 rt. for the forest as soon as Your Serene Highness has the estates again, and
    will settle'

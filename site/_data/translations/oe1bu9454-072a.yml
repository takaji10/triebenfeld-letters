- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    That a lease contract has been concluded with the sub-prefect concerning the Zagorowo estates sub
    spe rati, I have most obediently reported to Your Serene Highness; at the same time I notified the
    same, most high, that I intended to arrive with Brzechsta at Schlawenschitz on the 8th of this month.
    Since, however, the prefect Garczynski as well as the sub-prefect von Brzechsta were summoned to Warsaw
    by express courier, the plan of being at Schlawenschitz on the 8th [uncertain: failed].


    In the meantime the sub-prefect will quite certainly be here again on the 11th or 12th of March, and
    then the journey to Schlawenschitz will be set out upon at once. Brzechsta will bring 2 to 3000 Rthl
    in cash with him immediately, and then it will depend upon Your Serene Highness whether the same,
    most high, will ratify the contract'

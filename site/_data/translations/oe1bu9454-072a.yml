- page: 3
  en: 'The Olernizer matter will be won in this instance just as [uncertain: readily] as the Wochenziner
    one, and doubtless the 3 scoundrels, who are here set checkmate, will not press the matter further
    but must seek their salvation in flight. The Trąbczyn matter Brzechsta is now looking into with the
    prefect Count Garczynski in Warsaw. It must be brought before the Rada Stanu, and there these two
    friends of mine will [uncertain: sound out] most of the members as to whether one may lay the matter
    before that body and hope for a swift and good outcome. In the judgment of every thinking man, Your
    Serene Highness must have the estates back. For the Commission Rządząca took them from Your Serene
    Highness 4 months after the Peace of Tilsit, notwithstanding that everything the King had done during
    the time of possession was to remain in its force, which was likewise guaranteed by Napoleon, the
    Russian Emperor, and the King of Saxony.


    Upon the estates there stand, as far as I recollect, 80000 Rthl of debts; but if the Altz-Hauländer
    would gladly give 40000 Rthl for the forest as soon as Your Serene Highness has the estates again,
    and would settle upon'

- page: 2
  en: 'themselves or dispose otherwise of the estates. According to our plan, Brzechsta intends, upon
    his return, to summon all the arrears-debtors in [uncertain: Kone] at once before the lower land court,
    and to have himself compelled by that judge — who is his kinsman and bosom friend — to proceed to
    collection by the strictest execution, which hitherto has always been forbidden.


    For the rest, the suit with the Wrobeziner peasants was won for Your Serene Highness a couple of days
    ago in the Tribunal Solenne. The contract is wholly annulled, the peasants are ordered to pay the
    arrears, and they can be evicted and the holdings sold to others — the judgment was handed to the
    peasants yesterday by the [uncertain: town crier] of Jarnowski. I must now await the term laid down
    in the Code Napoléon after publication of the judgment, in order then to proceed with the harshest
    execution. Perhaps I shall succeed meanwhile in coming to terms with some of the fellows and obtaining
    a few thousand Rthl, which I would bring along with Brzechsta.'

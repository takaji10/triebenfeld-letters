status: draft
segments:
- page: 1
  en: 'Be it known and made manifest, that between the plenipotentiary of His Serene Highness the reigning
    Prince zu Hohenlohe Ingelfingen, the Councillor of Building and Economy Johann Wilhelm Glenck, of
    the one part - and the flour-miller Samuel Lucke, possessor of the flour mill Białobrzeg near Wrąbczynek,
    of the other part, subject to the reservation of most high Princely ratification, the following contract
    of sale has been deliberately agreed and concluded upon the conditions set out below.


    There is sold:


    1mo, by the said plenipotentiary, the Most Princely estate Szetlewek near Trąbczyn together with the
    fields belonging thereto, of one thousand Morgen Magdeburg measure of demesne-farm field, of the following
    extent and denomination, of which a map and survey register is on hand, namely,


    459 Morgen of arable field in 3 furlongs


    109 do - meadows


    19 5/8 do — gardens


    380 do fields to be cleared.


    32 3/8 do standing woodland.


    = 1000 Morgen Magdeb. in sum.


    together with


    § 2, all the demesne-farm buildings, which consist of 1 manorial dwelling house, 4 barns, 4 stables,
    1 granary floor and other appurtenances (excepting the brewery and distillery, as being comprised
    under that in Rubrique II) in free and perpetual ownership.


    for which


    § 3, the purchaser promises to pay a cash sum of 12333 rthlr, which is to be paid with 8333 rthlr
    upon the vacating by the pledge-holding possessor von Radzinsky, to the same, and 4000 rthlr upon
    acceptance of this contract, out of the Most Princely Dominium; to which purchase price there is furthermore
    to be rendered a continuing canon of 1/2 rt per Morgen yearly, and consequently 500 rt. for the above-named
    parcels annually as canon to the Dominium.'
- page: 2
  en: 'Whereas 4thly the purchasers do not obtain sufficient dwelling for their many [uncertain: possessions]
    to take up; he therefore further stipulates for himself, for the building of the several dwellings,
    the following pine building timber out of the Princely forests, namely 60 Rud[en] of saw-blocks of
    middling sort at 10 Rtlr[uncertain: 10 Rtlr], with the offcut wood, 80 firs of stout building timber
    for beams


    200 do middling [uncertain: cross-rails]


    450 do light rafters, 160 Klafter of wood for brick-burning, and for covering flat-work, together
    with


    § 5, free deadfall and lying wood in the Trąbczyn forest according to the Royal Forest Ordinance.


    Rubrique II, the propination rights belonging to this demesne farm and village, the existing brewhouse
    and distillery, the purchasers likewise receive as purchased property against a yearly rent of 400,
    in such manner as this appurtenance pertains to the Prince.


    Rubrique III, Excepted are the services of the village subjects, which are not given into the sale;
    but rather the release of which from service remains reserved to the Dominium, as which has already
    declared itself ready to meet the wish of those liable to service.


    § 6, The purchasers bear the Royal taxes and onera and remain henceforth under the jurisdiction of
    the Most Princely Dominium.


    § 7, Since the purchaser is not in a position to sustain the estate for himself alone, but stands
    in association with several other persons desirous of purchasing, whose approval, that is, whose signatures,
    he wishes to collect; he therefore stipulates a time of 14 days to 4 weeks, before and until a judicial
    establishment of this contract can take place.


    The foregoing contract has been drawn up in duplo, and by both parties'
- page: 3
  en: 'sealed and signed.


    Thus done at Zagorowo, the 1st of October 1798.


    Johann Wilhelm Glenck, Most Princely Hohenlohe-Ingelfingen Councillor of Building and Economy and
    plenipotentiary.


    Samuel Lucke, flour-miller


    as witness, Johan Lindner.'

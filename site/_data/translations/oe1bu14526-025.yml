- page: 2
  en: 'Since 4thly the purchasers do not obtain sufficient dwelling-room for their many persons taking
    possession, he further stipulates for himself, for the building of the further dwellings, the following
    pine building timber out of the princely woodlands, namely 60 rods of saw-blocks of middling kind
    at 10 Rtlr[?], with the offcut timber 80 firs of strong building timber for beams


    200 do middling cross-pieces[?]


    450 do light rafters, 160 cords of wood for brick-burning, and for covering flat work, together with


    §5, free dead and fallen wood in the Trąbczyn forest according to the Royal Forest Ordinance.


    Rubric II, the propination rights belonging to this demesne farm and village, the existing brewhouse
    and distillery, the purchasers likewise receive as purchased property against an annual rent of 400,
    in the same manner as this appurtenance belongs to the Prince. Rubric III, Excepted are the services
    of the village subjects, which are not given along in the sale; but rather the release of them from
    service remains reserved to the manorial lordship, as that which has already declared itself ready
    to meet the wish of those owing service.


    §6, The purchasers bear the Royal taxes and burdens and continue henceforth under the jurisdiction
    of the most princely manorial lordship.


    §7, Since the purchaser is not in a position to defray the estate for himself alone, but stands in
    association with several persons desirous of purchasing, whose approval, being their signatures, he
    wishes to collect; he therefore stipulates for himself 14 days to 4 weeks'' time, before and until
    a judicial establishment of this contract can take place. The foregoing contract has been drawn up
    in duplo, and by both parties'

- page: 3
  en: 'sealed and signed.


    Thus done at Zagorowo, the 1st October 1798. Johann Wilhelm Glenck, councillor of building and economy
    and authorised representative of the Most Serene Prince of Hohenlohe-Ingelfingen.


    Samuel Lucke, grain miller


    as witness Johan Lindner.'

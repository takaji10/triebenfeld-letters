status: draft
segments:
- page: 1
  en: 'Be it known and made known, that between the authorised representative of His Most Serene Highness
    the reigning Prince of Hohenlohe-Ingelfingen, the councillor of building and economy Johann Wilhelm
    Glenck on the one part - and the grain miller Samuel Lucke, possessor of the grain mill Białobrzeg
    near Wrąbczynek on the other part, subject to reservation of the most high princely ratification,
    the following contract of sale has been deliberately agreed and concluded under the conditions set
    out below.


    There is sold


    1mo, by the said authorised representative, the most princely estate of Szetlewek near Trąbczyn together
    with the fields belonging thereto, of one thousand Morgen Magdeburg measure of demesne-farm field,
    in the following extent and designation, of which a map and survey register are on hand, namely,


    459 Morgen of arable field in 3 open fields


    109 do - meadows


    19 5/8 do — gardens


    380 do fields to be cleared.


    32 3/8 do standing woodland.


    = 1000 Morgen Magdeb. in sum.


    together with


    § 2, all the demesne-farm buildings, which consist of 1 manorial dwelling house, 4 barns, 4 stables,
    1 granary floor and other appurtenances (excepting the brewery and distillery, as being comprised
    under Rubric II), as free and permanent property.


    for which


    § 3, the purchaser promises to pay a cash sum of 12333 rthlr, which are to be paid, with 8333 rthlr
    to the pledge-money possessor von Radzinsky upon his vacating the premises, and 4000 rthlr upon acceptance
    of this contract out of the most princely manorial lordship (Dominium); to which purchase price there
    is further to be rendered annually to the manorial lordship a continuing canon of 1/2 rt per Morgen
    yearly, and consequently 500 rt for the above-named parcels of land.'

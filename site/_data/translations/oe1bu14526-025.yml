status: draft
segments:
- page: 1
  en: 'Be it known and made known, that between the Bevollmächtigter of His the reigning Lord Fürst zu
    Hohenlohe Ingelfingen, His Most Serene Highness, namely the Councillor of Building and Economy Johann
    Wilhelm Glenck, on the one part - and the miller Samuel Lucke, proprietor of the grinding-mill Białobrzeg
    near Wrąbczynek, on the other part, the following contract of sale has, under reservation of the most
    high Princely ratification, been advisedly agreed and concluded upon the conditions hereinafter set
    out.


    There is sold:


    1mo, by the said Bevollmächtigter, the Most Princely estate Szetlewek near Trąbczyn together with
    the fields belonging thereto, of one thousand Morgen Magdeburg measure of demesne-farm land, in the
    following extent and denomination, whereof a map and survey register are extant, namely:


    459 Morgen of arable field in 3 fields


    109 do - meadows


    19 5/8 do — gardens


    380 do fields to be cleared.


    32 3/8 do standing woodland.


    = 1000 Morgen Magdeb. in sum.


    together with


    § 2, all the demesne-farm buildings, which consist of 1 manorial dwelling-house, 4 barns, 4 stables,
    1 granary floor and other appurtenances (excepting the brewery and distillery, as being comprised
    under that in Rubrique II), as free and perpetual property.


    for which


    § 3, the purchaser promises to pay a cash sum of 12333 Rthl, which is to be paid with 8333 Rthl to
    the pledge-holder von Radzinsky upon his vacating [the estate], and 4000 Rthl upon acceptance of this
    contract, out of the Most Princely Dominium; to which purchase price there is further to be paid annually
    to the Dominium a continuing canon of 1/2 Rthl per Morgen yearly, and consequently 500 Rthl of canon
    for the above-named parcels of land.'
- page: 2
  en: 'Whereas 4thly the purchasers do not obtain sufficient dwelling-room for their many holdings [uncertain:
    to take possession], he further stipulates for himself, for the erection of the further dwellings,
    the following pine building-timber out of the Princely forests, namely 60 rods of saw-blocks of middling
    sort at 10 Rthl [illegible], with the offcut-wood, 80 firs of stout building timber for Baltzer


    200 do middling [uncertain: cross-beams]


    450 do light [uncertain: Parrer], 160 cords of wood for brick-burning, and for covering flat-work,
    together with


    § 5, free chaff-wood and deadfall wood in the Trąbczyn forest according to the Royal Forest Ordinance.


    Rubrique II: the propination rights belonging to this demesne farm and village, and the existing brewhouse
    and distillery, are likewise to be obtained by the purchasers as [uncertain: a purchased] property
    against a yearly rent of 400, in the same manner as this appurtenance pertains to the Lord Fürst.


    Rubrique III: Excepted are the services of the village subjects, which are not given into the sale;
    rather, the release of them from service remains reserved to the Dominium, as having already declared
    itself ready to meet the wish of those liable to service.


    § 6, The purchasers bear the Royal taxes and onera and remain henceforth under the jurisdiction of
    the Most Princely Dominium.


    § 7, Since the purchaser is not in a position to carry the estate on his own alone, but stands in
    association with several other intending purchasers, whose consent by signature he wishes to collect;
    he therefore stipulates for himself 14 days to 4 weeks'' time before a judicial confirmation of this
    contract can take place. The foregoing contract is executed in duplo, and by both parties'
- page: 3
  en: 'sealed and subscribed.


    Thus done at Zagorowo, the 1st of October 1798. Johann Wilhelm Glenth, Most Princely Hohenlohe-Ingelfingen
    Councillor of Building and Economy and Bevollmächtigter.


    Samuel Luke, miller


    as witness, Johan Lindner.'

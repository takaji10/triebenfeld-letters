status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! for Most Serene Highness will already have learned
    through Mr. Lombardini that I was not able to receive the money at once in Breslau, and, even apart
    from the great impediments of the indescribable roads and weather, was detained. Notwithstanding this,
    however, I so hastened my journey from Breslau that on the 25th at midday I was here, and still found
    Honrichs and Cabanis
- page: 2
  en: still found here, who then also, after Honrichs [had received?] 6000 f. and the deeds of donation
    in the original, departed that same day with the most joyful prospects. The Herr Councillor of War
    and Forests von Triebenfeld finds himself suffering severely in the right[?]/legal arm, yet he has
    promised me that as soon as he shall have concluded his own affairs here, he will come at once for
    some weeks to Schlawentz. I answer After all the most graciously received instructions concerning
    this shall have been received, I shall hasten to return. In deepest reverence I remain, until death,
    as Your Most Serene Highness's Kontop, the 26th of February 1810. most humble, faithful and most obedient
    Bally

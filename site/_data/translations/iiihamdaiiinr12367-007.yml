- page: 1
  en: 'Copy of my answer to the Minister of the Treasury of the Kingdom of Poland, His Serene Highness
    Prince v. Lubecki, etc.


    Wrocław, 14 October 1830.


    Etc. etc.


    In reply to the high communication of the 22nd of last month, No. 59607/938, I hereby most humbly
    submit to Your Serene Highness, in certified copy, for the estates of Trąbczyn, Osiny, Łazy, Nowawieś,
    Zarobna and the Trąbczyn Hollander settlement, with appurtenances,


    1. the mortgage certificate of 14 August 1803.


    2. the judicial valuation of 6 May 1803.


    According to the mortgage certificate the value of these estates is taken at Rthl 160,000.


    The items entered ahead of my claim amount to:


    1. Section II. Church capitals in all, 7,000 Polish florins or Rthl 1,166. 16 Groschen.


    2. Section III. For v. Przepolewski, although paid, ditto 5,000. -


    v. Lichnowski ditto 42,000. - = 48,166. 16 Groschen


    To cover my item entered in Section III No. 3 for v. Grottowski, now for me, there remained Rthl 111,833.
    8 Groschen, and since my claim amounts to only 63,100. -, there is a surplus beyond it of Rthl 48,733.
    8 Groschen.


    The valuation is drawn up on the low principles that were applied to the estimating of the crown domains.
    The bushel of wheat is brought into the computation at only 20 Groschen, the bushel of rye at 16 Groschen,
    the bushel of barley at 12 Groschen and the bushel of oats at 8 Groschen, while on the other hand
    half the harvest has been deducted, and besides that 15 per cent of the gross income for administration.'

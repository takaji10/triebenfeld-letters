- page: 2
  en: 'By this the assumed value has been calculated at only Rthl 128,917, 17 Groschen. If the 48,166.
    16 standing ahead of me are deducted from this, there still remain Rthl 80,751, 1 Groschen to cover
    me, for which only 63,100. - are required.


    From these facts there is surely no doubt that my claim was entirely secure.


    So long as legal assistance had not been refused me, I could have paid off the items standing ahead
    of mine and bid at the forced sale as far as was necessary for my claim.


    On the strength of this proof and of the earlier acknowledgement, and finally of the long duration
    of the matter, I may expect of Your Serene Highness''s justice that Your Highness will now most graciously
    arrange for my satisfaction and fix an early date for the agreement between us, of which there can
    be no doubt, at which I would appear in person or through an authorised representative.


    With the greatest reverence I have the honour to be, etc.'

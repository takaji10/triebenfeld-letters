status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Even though my faithful attachment to Your Most
    Serene Highness [and] my zeal were exemplary, I am nevertheless not capable of [remedying] all the
    confusions here [uncertain: eingekäuschte — "insinuated"/"whispered in"?] as I at first believed I
    might. 1. There are lawsuits, 11 in number, in which hearings have just now [been adjourned] upon
    several objections — I have petitioned for prorogation, have obtained it, and hope to bring several
    of them, which amount in part to 6 and 15 Rthl yearly, to the best possible conclusion by compromise.
    2. The tenants have been stirred up to the utmost pitch, and not one will yield without an enormous
    quantum of withdrawal-money; to arrange this and to bring it into order according to Your Serene Highness''s
    wishes, I must exercise every possible patience, so as to press the people to the goal by forbearance
    and kindness; but it will not be got through without sacrifices. With Otcibi I have this moment come
    to terms; he receives 3000 Rthl withdrawal-money, 2000 Rthl surety,'
- page: 2
  en: 'and 1000 Rthl for additional seed-corn and housing costs, which two latter items will be recovered
    again. 3. With Flörten and Rybbel I have got so far that they are willing to compound. The people
    show that they have paid 12600 in cash; next to this they liquidate for buildings etc. some 8000 Rthl.
    Now although the liquidum of 6901 sl. has been provisionally admitted, yet in a lawsuit, which might
    run some 3 years, the sum of 8000 Rthl will certainly be awarded to him. By this calculation Your
    Serene Highness would already have 2000 Rthl to pay; the withdrawal-sum stipulated in the contract
    is 500 Rthl per year, this also amounts to 7000 Rthl; the surplus inventory may come to 2000 Rthl,
    according to which the people would then have 11600 Rthl [uncertain: abheilet — "cleared"?], if judgment
    be given according to the letter [of the contract]. The contract is badly drawn, serves only the tenants,
    and is in every point prejudicial to Serene Highness. Ill as this matter looks, I nevertheless hope
    to settle it in the best way, namely that the people quit and renounce all their demands. To attain
    this end I have petitioned for execution, and have caused the sequestration to be effected for the
    tenants'' account. Under this pressure I think they will quit. 4. I shall conclude with the von Rudnicki,
    [and] shall so direct the matter that he is to depart at Midsummer. The contract with him too has
    been concluded in a singular manner. 5. As soon as I am done with these people I shall proceed to
    the letting out'
- page: 3
  en: '[of the estates]. Jetzinger and consorts are here [uncertain: ert, Ca:]; with the help of the Landrath,
    who is more than active, I think to be quickly done with these too. The old subjects are throughout
    giving 1 Rthl per Hufe in ground-rent — the Landrath himself concludes with them, so that the Chamber
    must be silenced. By this an astonishing deal has been gained, and it makes the newer colonists [uncertain:
    stuppen]. Just now the 3 B. offered to annul the Olesnices contract and to see to the general dismemberment.
    There are 6 persons for it. They demand 3 Rthl per Hufe as proxeneticum, and 9 Hufen free altogether.
    This I shall in the end concede, for now everything can be happily brought to an end. The Landrath
    is entirely my man and helps to overcome the most difficult matters. He deserves a great reward. Through
    his help I shall get done with the tenants here; — through his exertions I have today obtained purchasers
    for 87 Hufen, and were Midsummer not at the door, or were there not some straits about the money,
    he would procure me Mennonites who would at once buy everything up dear and pay in cash — he has even
    obtained the Chamber''s permission for it. — Glenck has written to the Landrath and mocks me; in particular
    he says that one could never have made a stupider stroke than the Olesnices contract. He says further
    that it is true he did indeed make a preliminary agreement with the people, but that this was'
- page: 4
  en: 'only in jest; at that time he had just then needed 1000 Rthl, and the fellows ought to have sacrificed
    this; but how could he have been minded to give away the estates in hereditary lease like that? —
    He calls upon the Landrath now only to see to it that Kunckel be got rid of; he has another man whom
    he would send here, who would comply with all the Landrath''s orders. In general he requests the Landrath
    to come to an understanding with him, in order to do business with him. He is now [uncertain: häste
    — "sits"/"has"?] at the gold-spring, where Gold is to be had and Gold is to be earned. He begged that
    the Landrath should enquire in his own and the adjoining districts whether the nobles have need of
    money — he could obtain as much as he wished — the Landrath should only have strong proxenetica stipulated,
    and he would then, after deduction of costs, share faithfully with him. It is a sad thing to hear
    so much wicked stuff, whereby Your Serene Highness would in the end be compromised. I shall redress
    what I can, and thus I should certainly compound several lawsuits at once and preserve to Your Serene
    Highness what is already lost. — As for money, I hope a strong quantum will come together by Midsummer;
    how much, however, I cannot yet determine. In deepest reverence I remain, until death, Your Most Serene
    Highness''s Trąbczin, the 8th of May 1804 most faithful servant v Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord!


    I was just on the point of writing to Your Most Serene Highness by express when I received Your Highness''s
    most gracious letter of the 9th, which has taken 6 days in transit. I thank Your Most Serene Highness
    most heartily for the goodwill therein expressed, which I most devotedly beg to retain. I have lain
    ill for some 7 weeks, during half of which time I lived quite happily, for I was robbed of my senses
    and felt nothing of my sorrows. For about 8 days now I have been a thinking man again and am working
    at the removal of my afflictions. — Whether I shall succeed in it I cannot exactly determine — I do
    indeed have a tenant for Kon tap, but I must first pay 8000 Rthl of arrears of interest and debts.
    The Carte from Stettin, grown rich by French deliveries, who has raised himself from a beggar-boy
    or a barber''s journeyman to the wealthiest private man and has acquired 1,600000 through the short
    war, wishes to buy timber from me and to pay everything in advance; I expect him daily. If he does
    so, then only shall I have a free hand to lease out and to bring everything into its track. Within
    the space of 8 days all this must be settled, or I am lost with respect to my possessions. If it goes
    well, then I shall be at Schlawenschühme by the New Year, to lay myself at Your Most Serene Highness''s
    feet.'
- page: 2
  en: 'Now with respect to Your Serene Highness''s affairs. — In Königsberg these are said to stand very
    well, the more so as the [man] is gone from there. In Poland things go confusedly; my endeavour to
    raise money from thence was in vain, as the enclosed decree proves. To that end I [had] Honrichs come
    here, who arrived here this very day. The enclosed Pro Memoria proves his plans — may Your Serene
    Highness deign to give it your attention, and give me the very speediest answer before I depart from
    here. I believe that the sub-prefect who wishes to buy the estates is not to be turned away, and that
    one must enter into dealings with him, because he can be very helpful towards the recovery of the
    [uncertain: Trapirier] estates. 2. I believe that all resorts should now at once be set in motion,
    in order to wrest away these estates so violently appropriated. 3. To insist with all force that the
    monies, now that the sequestration is lifted, must absolutely flow to Your Serene Highness and not
    into the coffer of the improperly appointed administrator; and likewise that this man, who has not
    yet admitted Honrichs into the estates, be at once turned back. Provisionally I gave Henrichs the
    power of attorney for this, but for this too I must very quickly have Your Serene Highness''s authorisation.
    If it succeed that the Russians, or we, move in there, then the rest will find itself out, and we
    shall need no foreign help; the Russian [uncertain: Batete] will be sufficient for us in every way.'
- page: 3
  en: 'As for what else may be written to Your Serene Highness from Schlawenschitz, there is nothing in
    it to be entered into. — Hainrich and Hecker are rogues who deserve chastisement. I engaged the latter
    because I believed I had found in him a faithful man; he furnished a paper security of 5000 Rthl —
    but he gave up the service, took land for himself, would be called his own master, and attached himself
    to a Polish hag, namely to the sister of the Nucziwichi. Honrichs was obliged to sue [uncertain: Niederinrech]
    for 7000 Rthl of arrears of rent, and likewise the Lenshi and Octarsowchi, of whom the last-named
    also owe some 5000 Rthl in ready money. — With these Hecker made common cause, and denounced Honrichs
    for having railed against Bonaparte; indeed, that he, together with Schenck and Cabanic, had carried
    Bonaparte''s portrait (namely a woodcut such as the Poles venerate like the Black Mary at Czenstochau)
    in procession across the courtyard to the — salva venia — privy, and had it buried there. Also that
    Honrichs was constantly attempting to smuggle travelling monies out of the country, indeed was even
    endeavouring to stir up a [uncertain: reconfecleration]. Hecker had this denunciation brought to Wybichi;
    Honrichs was at once arrested and was to be shot. — The pod praefect Zychhochi of Kalisz informed
    me of it by night; I wrote at once to Wybichi, to Wode at Warsaw, to Carcynalii and to all the devils
    and holy [uncertain: Pensrats].'
- page: 4
  en: 'I succeeded in saving Honrichs so far, that he was released from his arrest, and now the matter
    is being worked through in the ordinary process. — That they had buried Bonaparte in the privy was
    quashed, because it had happened at the beginning of the war. Over and above this, the process is
    still pending on the count that Honrichs, shortly before his arrest, called Bonaparte a robber. But
    now Ostarszenski the 1st and the 2nd, and also Niederweichen and consorts, have given a written confession
    of themselves, that they were incited by Hecker and Honrichs; that they had everything only from hearsay;
    that out of vexation, because Honrichs had always thought pro Prussia, they had informed against him
    out of [uncertain: Woche] — wherefore they withdraw their denunciation, and must willingly submit
    themselves to the penalty of the false denunciant, since they could neither prove the charge against
    Honrichs, still less swear to it. This judicial written acknowledgement of the denunciants suborned
    by Heiler and Hawich has now been submitted to the Presidium of the Criminal Court, as also to the
    Warsaw Ministry and the Chief Prefect, upon which I may expect the end, with all right, speedily.'

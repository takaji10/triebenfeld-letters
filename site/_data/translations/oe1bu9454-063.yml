- page: 2
  en: 'Now as regards Your Serene Highness''s affairs – At Königsberg these are said to stand very well,
    the more so since that is away from there.


    In Poland matters go strangely; my endeavour to procure money from thence was in vain, as the enclosed
    [uncertain: decree] proves. To that end I had Honrichs come here, who arrived here only today. The
    enclosed Pro Memoria proves his plans – may Your Serene Highness deign to grant it your attention
    and give me, before I depart from here, the very speediest answer.


    I believe that the sub-prefect who wishes to buy the estates is not to be turned away, and that one
    must enter into dealings with him, because he can be very helpful towards the recovery of the [uncertain:
    Trapirier] estates. 2. I believe that all departments must now be set in motion at once, in order
    to wrest away these estates so violently appropriated.


    3. To insist with all force that, since the sequestration is lifted, the monies must flow absolutely
    to Your Serene Highness and not into the cash-box of the improperly appointed administrator; also
    that this man, who has not yet admitted Honrichs into the estates, be at once turned away.


    Provisionally I gave Honrichs the power of attorney for this, but for this too I must very speedily
    have Your Serene Highness''s authorisation. Should it succeed that the Russians or we move in there,
    then the rest will find itself, and we shall need no foreign help; the Russian [uncertain: Batete]
    will always be enough for us.'

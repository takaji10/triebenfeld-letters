- page: 4
  en: 'I succeeded in saving Honrichs so far that he was released from his arrest, and the matter is now
    being worked out in the ordinary course of law – the charge that he had buried Bonaparte in a privy
    was quashed, because it had occurred at the beginning of the war. Over and above this, the suit is
    still pending that Honrichs, shortly before his arrest, called Bonaparte a robber. But now Ostarszenski,
    the first and the second, and also Niederweichen and associates, have given a written acknowledgement
    of themselves that they had been incited by Hecker and Honrichs, that they had everything only by
    hearsay, that out of spite, because Honrichs had always thought pro-Prussian, they had informed against
    him out of [uncertain: Woche] – wherefore they withdraw their denunciation and must willingly submit
    to the penalty of the false denouncer, since they could neither prove nor still less swear to the
    charge against Honrichs.


    This judicially written acknowledgement of the denouncers suborned by Heiler and Hawich is now lodged
    with the presiding bench of the criminal court, as also with the Warsaw ministry and the Chief Prefect,
    whereupon I may with all right speedily expect the end of the matter.'

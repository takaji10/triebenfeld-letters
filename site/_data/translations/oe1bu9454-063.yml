- page: 2
  en: 'Now as regards Your Serene Highness''s affairs — In Königsberg these are said to stand very well,
    the more so as B. is gone from there.


    In Poland things go on in a motley fashion; my endeavour to procure money from thence was in vain,
    as the enclosed decree proves. To that end I had Honrichs come here, and he arrived here only today.
    The enclosed Pro Memoria proves his plans — may Your Serene Highness deign to grant it your attention
    and give me the very speediest answer before I depart from here.


    1. I believe that the sub-prefect who wishes to buy the estates is not to be turned away, and that
    one must enter into dealings with him, because he can be very helpful towards the recovery of the
    Trąbczyn estates.


    2. I believe that all quarters should now at once be set in motion, in order to wrest from Dąbska
    those estates which she has violently appropriated to herself.


    3. That it be insisted upon with all force that the moneys, now that the sequestration is lifted,
    must absolutely flow to Your Serene Highness and not into the coffers of the improperly appointed
    administrator; also that this man, who has not yet admitted Honrichs into the estates, be at once
    turned away.


    Provisionally I gave Honrichs the power of attorney for this, but I must also have Your Serene Highness''s
    authorisation for it very quickly. If it succeed that the Russians or we move in there, then the rest
    will find itself, and we shall need no foreign help; the Russian Batek will in any case be enough
    for us.'

- page: 1
  en: '63


    Most Serene Prince


    Most gracious Prince and Lord, I was just on the point of writing to Your Most Serene Highness by
    express when I received Your Highness''s most gracious letter of the 9th, which took 6 days in transit.
    I thank Your Most Serene Highness most heartily for the goodwill expressed therein, which I most devotedly
    beg to retain. I have lain ill for some 7 weeks, half of which time I lived quite happily, for I was
    robbed of my senses and felt nothing of my cares. For about 8 days now I have again been a thinking
    man and am labouring to set aside my troubles — whether I shall succeed in this I cannot determine
    precisely — I do indeed have a tenant for Konotop, but I must first pay 8,000 Rthl. of arrears of
    interest and debts. Carte of Berlin, who has grown rich through the French deliveries, who from a
    beggar-dog or dyer''s journeyman has raised himself up to be the richest private man and has acquired
    1,600000 through the short war, wants to buy timber from me and to pay everything in advance; I expect
    him daily, and if he does so then I shall at last have a free hand to lease out and to bring everything
    into its track. Within the space of 8 days all this must be settled, or I am lost as regards my possessions.
    If it goes well, then I shall be at Sławięcice by the New Year to lay myself at Your Most Serene Highness''s
    feet.'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, I was just on the point of writing to Your Most Serene Highness by
    express when I received Your Highness''s letter of the 9th, which took 6 days in transit. I thank
    Your Most Serene Highness most heartily for the goodwill expressed therein, which I most devotedly
    beg to retain. I have lain ill for some 7 weeks, during half of which time I lived quite happily,
    for I was deprived of my senses and felt nothing of my sorrows. For about 8 days now I have again
    been a thinking man and am working at the removal of my afflictions – Whether I shall succeed in this
    I cannot exactly determine – I do indeed have a tenant at Kontop, but I must first pay 8000 Rthl of
    arrears of interest and debts. The [uncertain: Carte] from Stettin, grown rich through French supply
    contracts, who has risen from a beggar-boy or barber''s journeyman up to the wealthiest private man
    and has acquired 1,600000 through the short war, wishes to buy timber from me and to pay everything
    in advance; I expect him daily, and if he does so then I shall at last have a free hand to lease out
    and to bring everything into its proper track. Within a period of 8 days all this must be settled,
    or I am lost as regards my property. If it goes well, then at the New Year I shall be at Schlawenschitz
    to lay myself at Your Most Serene Highness''s feet.'

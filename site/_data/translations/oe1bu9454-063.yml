- page: 3
  en: 'As to what has otherwise been written to Your Serene Highness from Schlawenschitz, there is no
    entering into that – Hainrich and Hecker are rogues who deserve chastisement. I engaged the latter
    because I believed I had found in him a faithful man; he furnished a paper security of 5000 Rthl –
    but he gave up the service, took land for himself, wished to be called his own master, and attached
    himself to a Polish hag, namely to the sister of Nucziwichi. Honrichs had to sue Niederinrech for
    7000 Rthl of arrears of rent, likewise Lenshi and Octarsowchi, the latter of whom also owe some 5000
    Rthl in cash – with these Hecker made common cause and informed against Honrichs, that he had reviled
    Bonaparte; indeed that he, together with Schenck and Cabanic, had carried Bonaparte''s portrait (namely
    a woodcut which the Poles venerate like the Black Maria at Częstochowa) in procession across the yard
    to the – with respect – privy, and had it buried there – also that Honrichs was always only trying
    to smuggle travelling money out of the country, indeed that he was even at pains to stir up a [uncertain:
    reconfederation]. Hecker had this denunciation brought to Wybichi; Honrichs was immediately arrested
    and was to be shot – the sub-prefect Zychhochi of Kalisz gave me notice of it; I wrote at once to
    Wybichi, to Wode at Warsaw, to Carcynalii, and to all the devils and saints [uncertain: Pensrats]'

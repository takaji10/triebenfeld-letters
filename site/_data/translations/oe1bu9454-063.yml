- page: 3
  en: 'As for whatever else may be written to Your Serene Highness from Sławięcice, there is nothing in
    it to engage with — Hawich and Hecker are rogues who deserve chastisement. I engaged the latter because
    I believed I had found in him a faithful man; he furnished a paper security of 5/m Rthl. — But he
    gave up the service, took land for himself, wished to be called his own master, and attached himself
    to a Polish hag, namely to the sister of Niedźwiecki. Honrichs was obliged to sue Niedźwiecki for
    7,000 Rthl of arrears of rent, and likewise Lenski and Ostarszewski, the latter of whom also owe some
    5,000 Rthl in cash — with these Hecker made common cause and denounced Honrichs as having railed against
    Bonaparte, indeed as having had Bonaparte''s portrait / namely a woodcut which the Poles venerate
    like the Black Mary at Częstochowa / carried in procession across the court [uncertain: Hoft] to the
    — with respect — privy and there buried away — and also that Honrichs was constantly attempting to
    smuggle travelling moneys out of the country, and was indeed even endeavouring to stir up a reconfeileration.
    Hecker had this denunciation brought to Wybicki; Honrichs was at once arrested and was to be shot
    — the sub-prefect Zychlinski of Kalisz gave me notice of it; I wrote at once to Wybicki, to Wo[uncertain:
    e]da at Warsaw, to Garczynski, and to all the devils and holy Pensrats —'

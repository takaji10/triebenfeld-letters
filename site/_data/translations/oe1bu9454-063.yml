- page: 4
  en: 'I succeeded in saving Honrichs so far that he was released from his arrest, and the matter is now
    being pursued in ordinary process — the charge that he had buried Bonaparte in the privy was quashed,
    because it had happened at the beginning of the war. Besides this, the process is still pending as
    to Honrichs having called Bonaparte a robber shortly before his arrest — But now Ostarszewski the
    first and the second, and also Niedźwiecki and consorts, have given from themselves a written acknowledgement
    that they had been incited by Hecker and Hawich, that they had had everything only from hearsay, that
    out of spite, because Honrichs had always thought pro Prussia, they had denounced him out of Woche
    — wherefore they withdraw their denunciation and must willingly submit themselves to the penalty for
    a false denouncer, because they could neither prove the charge against Honrichs nor still less swear
    to it.


    This judicial written acknowledgement of the denouncers set up by Hecker and Hawich has now been submitted
    to the Presidium of the Criminal Court, as also to the Warsaw Ministry and the Chief Prefect, whereupon
    I may with all right expect a speedy end.'

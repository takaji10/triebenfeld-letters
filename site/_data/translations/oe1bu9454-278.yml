    done, and will also act quickly, so that his answer, soon to be expected, will decide everything.
    In the meantime I implore Your Serene Highness to procure the [uncertain: journey] money. Korb kann
    er he will certainly find means.


    In deepest reverence I sign myself.


    Your Serene Highness''s


    Brzeg


    the 12th of March 1815


    wholly most humble and obedient


    Eberhard'

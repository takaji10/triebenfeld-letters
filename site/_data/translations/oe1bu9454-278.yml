- page: 2
  en: 'The second obstacle is now surely the most important; if Your Serene Highness is unable to find
    means, then the misfortune is great and not to be foreseen, for only now in Vienna, with the personal
    presence of the 3 princesses, is a settlement [uncertain: conceivable] — or never. Is there then no
    means at all at Your Serene Highness''s command to raise at least 5 to 600 Rthl? Never yet would a
    capital have yielded such usury as this one. The return is certainly as incalculable as the damage
    will be, if Your Highness does not raise these travelling costs; I, by God, am not able to.


    The King''s departure on the 26th, which I do not believe in, since according to other reports the
    King is said to have extended the lodgings until the end of April, would do no harm, since the Prince
    State Chancellor remains there, and he alone can effect everything. I am writing today to Mr von Triebenfeld
    and am laying my plan before him for his judgment, in which 2 ways are set out by which occasion could
    at least be taken for me to give grounds for my journey to Vienna. Mr von Triebenfeld'

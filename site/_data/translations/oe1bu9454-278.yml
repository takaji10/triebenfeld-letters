status: draft
segments:
- page: 1
  en: 'Copia. Most Serene Prince, etc. etc. etc. I too received by the last post a letter from Herr Triebenfeld,
    in which he urgently presses upon my heart that I should come to Vienna. According to a plan thought
    through by me, which is built upon the dilatory resolutions hitherto granted on the part of the Ministry,
    it seems to me also to be possible to move the Curian heirs, who are just now in person in Vienna,
    to the acceptance of a settlement, and I myself might perhaps be able to work towards it if I were
    there; but, in the first place, in view of the instruction given me on the part of the general mandatories
    of the Cuheian heirs to abstain from every interference in this matter, I cannot act contrary thereto,
    nor appear ex abrupto in Vienna without any occasion on the part of the heirs; secondly, I am wholly
    wanting in money, and I am in no condition to advance these travelling costs, nor to borrow them anywhere;
    thirdly, I cannot travel abroad without a [uncertain: Pöse] from the Minister of Justice and the State
    Chancellor, which I should first have to apply for besides.'
- page: 2
  en: The second obstacle is now assuredly the most important; if Your Serene Highness should not be able
    to find counsel, then the misfortune is great and not to be surveyed, for only now, in Vienna, during
    the personal presence of the 3 Princesses, is a settlement to be had with thanks — or never. Is then
    no means whatever at Your Serene Highness's command, to raise at least 5 to 600 Rthl? Never yet would
    a capital have yielded such increase as this one. The return is certainly just as incalculable as
    is the damage, if Your Highness does not raise these travelling costs; I, by God, am not able to.
    The King's departure on the 26th, which I do not believe, since according to other reports the King
    is said to have prolonged the lodgings until the end of April, would do no harm, since the Prince
    State Chancellor remains there, and he alone can accomplish everything. I am writing today to Herr
    von Triebenfeld, and lay my plan before him for his judgment, in which 2 ways are indicated by which,
    for me at least, an occasion might be taken to give a motive for my journey to Vienna. Herr von Triebenfeld
- page: 3
  en: 'will at once find his bearings, since he knows the terrain exactly, and will know what is to be
    done, and will also act quickly, so that his answer, soon to be expected, will decide everything.
    I meanwhile importune Your Serene Highness to procure the money for the hour. [uncertain: Korb] can
    and assuredly will find a way. In deepest reverence I sign myself. Your Serene Highness''s Brieg,
    the 12th of March 1815 wholly most humble and obedient Eberhard'

- page: 2
  en: 'The second obstacle is now no doubt the most important; if Your Serene Highness is not able to
    find means, then the misfortune is great, and not to be overlooked, for only now, in Vienna, with
    the personal presence of the 3 princesses, is a settlement to be had with thanks, or never. Is there
    then no means whatever at Your Serene Highness''s command to raise at least 5 to 600 Rthl? Never yet
    would a capital have yielded such interest as this one. The return is certainly as incalculable as
    the damage will be, if Your Highness does not raise these travelling costs; I, by God, am not able
    to.


    The King''s departure on the 26th, which I do not believe, since according to other reports the King
    is said to have extended the rents until the end of April, would do no harm, since the Prince Chancellor
    of State remains there, and he alone can accomplish everything. I am writing today to Mr. von Triebenfeld,
    and lay my plan before him for his judgement, in which 2 ways are indicated by which, for me at least,
    an occasion might be taken to give a motive for my journey to Vienna. Mr. von Triebenfeld'

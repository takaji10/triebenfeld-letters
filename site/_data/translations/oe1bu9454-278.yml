segments:
- page: 1
  en: 'Copy


    Most Serene Prince etc. etc. etc.


    I too received by the last post a letter from Mr. Triebenfeld, in which he urgently presses upon my
    heart that I should come to Vienna.


    According to a plan I have thought through, which is built upon the negative resolutions hitherto
    issued on the part of the Ministry, it seems to me also to be possible to move the Curian heirs, who
    are just now in person in Vienna, to the acceptance of a settlement, and I myself might perhaps be
    able to work towards it, if I were there; but, in the first place, in view of the direction issued
    to me on the part of the general mandatories of the Curian heirs, to abstain from any interference
    in this matter, I cannot act contrary to it, and cannot appear in Vienna abruptly and without any
    occasion on the part of the heirs; second, I am wholly wanting in money, and I am in no condition
    to advance these travelling costs, nor to borrow them anywhere; third, I cannot travel abroad without
    [uncertain: passes] from the Minister of Justice and the Chancellor of State, which I should first
    have to apply for.'

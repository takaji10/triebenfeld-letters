- page: 3
  en: 'will at once find his bearings, since he knows the terrain exactly, and will know what is to be
    done, and will also act quickly, so that his answer, shortly to be expected, will decide everything.
    In the meantime I implore Your Serene Highness to procure the [uncertain: hour-money]. Korb can and
    certainly will find means.


    In deepest reverence I sign myself,


    Your Serene Highness''s


    Brieg


    the 12th of March 1815


    wholly most humble and obedient


    Eberhard'

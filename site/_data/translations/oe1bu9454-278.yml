- page: 1
  en: '278


    Copy


    Most Serene Prince


    etc. etc. etc.


    I too received by the last post a letter from Mr von Triebenfeld, in which he urgently presses upon
    me to come to Vienna.


    According to a plan I have thought through, which is built upon the refusing resolutions hitherto
    issued on the part of the Ministry, it seems to me likewise to be possible to move the Curish heirs,
    who are just now in Vienna in person, to accept a settlement, and I myself might perhaps be able to
    work towards it if I were there; but, in the first place, given the instruction issued to me on the
    part of the general mandatories of the Curish heirs to abstain from any interference in this matter,
    I cannot act contrary to it, and cannot appear in Vienna abruptly without any occasion for it on the
    part of the heirs; secondly, I am entirely without money and am in no condition either to advance
    the costs of this journey or to borrow them anywhere; thirdly, I cannot travel into Courland without
    [uncertain: passes] from the Justice [uncertain: Minister] and the State Chancellor, which I should
    first have to apply for'

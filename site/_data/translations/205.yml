status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! This morning at 5 o''clock Köchlich departed;
    I accompanied him as far as into his carriage, and the King intended to follow an hour thereafter
    — Köckritz again commends himself to Your Serene Highness''s favour. As concerns the exchange transaction,
    I pursue it with head and heart — I hope it shall succeed — Knobelsdorff wrote some days ago to Fischbach
    – He said he had a commission from the General Landschaft Director, and that discharging this commission
    would last until the 10th; from the 11th onward he would be at command to set out for Zagorowo any
    day. Meanwhile I wrote to him myself yesterday by the express which Lombardini sent off, and asked
    him when he meant to travel and where we wished to meet. I await his reply, in order to operate further
    accordingly. Weigel is again very well disposed – He says: should Stössel too be glad to have the
    Bischdorff estates, then I am content with it, provided I be entered [in the register] there; gladly
    will I then give the Prince a receipt and have everything struck off from Koschentin. We are thick
    friends; he visits me often with his children at the swimming, for the Korn — that is his daughter
    — attaches herself very much to my two daughters. In short, on that side I hope for every possible
    good, the more so as it is now settled that all monies outstanding in Poland must be paid and may
    be drawn out of the country. The widows'' funds, the Bank, Seelandlung, wards'' deposit offices and
    all private men are receiving their monies; the Poles are all at one stroke beggars, and it now stands
    close to this, that they will not [text lost] and all go over to the [uncertain: Küssen]. [uncertain:
    Nochrich] now fears everything and holds the war between France'
- page: 2
  en: 'and Russia to be unavoidable; likewise he believes that the Poles will make the [uncertain: tournure];
    and if that happens, then Galicia and West Prussia will join in as well, and the Poles will throw
    themselves outright into Russia''s arms, in order to save themselves, – for whence should the poor
    inhabitants of the little province of Warsaw, which after all makes up only the 10th part of the former
    Kingdom of Poland, take 27 millions? A fire smoulders here beneath the ashes, which could bring forth
    a fearful explosion. – Meanwhile a ray of hope dawns here, which of itself builds up prospects for
    Your Most Serene Highness, prospects which I look toward with a high-beating heart. Private [reports]
    from Vienna assure that the peace between Russia and Turkey is at this very moment already concluded
    – God grant that this be confirmed, for then a couple of gloomy clouds which still darken the brightness
    of our star of fortune would be [uncertain: dispelled], and we should see already a brighter dawn.
    Since — as God gives it, we pilgrims of earth take it from His hand — the upright man suffers only
    a short time, then the matter goes better. This very moment the honest Lombardini was with me; he
    will send to set in, and now I can write more freely — For the present still this: Labage has been
    sent to Paris, and is to offer linen and iron for the contributions to be paid – half and half this
    manner of payment has been accepted – should it succeed, then iron would be a new article of value
    – I learn of it first and will tell Your Serene Highness faithfully what profit is to be drawn from
    it. The Swedish war offers glad prospects, for the iron will be sold at ever higher prices. Now, heartily,
    and to you, noblest of men and of all princely children, alone a man practised — to you, upright Prince,
    dreadful pits — believe and trust nothing of whatever anyone may tell you. – Your goodness of heart
    is dreadfully abused by your enemies, and even those who so often enjoy your highest confidence are
    pure sham friends – therefore let them look to themselves – I beg you, better'
- page: 3
  en: Prince, most heartily for it — For me it is worse than poison, dagger and hell to have to tell you,
    noblest of men, what is going forward and what lurks in ambush. I have therefore taken a course by
    which you will learn everything; arrange all things accordingly, and show yourself a great man with
    the dignity that has always been your own. Count upon it that within a short time events will occur
    in which you will play the most brilliant part and will see your enemies humbled. I am a poor earthly
    miller, you know something of my unhappy fate, but perhaps I do more for your profit than all the
    great ones of the earth — With boundless veneration I remain, until death, Your Most Serene Highness's
    Breslau, the 11th of September 1810. faithful, humble and obedient servant v Triebenfeld

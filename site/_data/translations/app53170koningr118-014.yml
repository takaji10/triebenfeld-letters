- page: 1
  en: 'On behalf of the Illustrious Chełmski, Treasurer of Wschowa, against the Illustrious Prusimski,
    Starost of Niszczewice — a Report


    Having come in person, the Honest Bartłomiej Wrzask of the village of Sławsk, General Royal Process
    Server, sound [of mind], acknowledged that he had served authenticated Citation Letters for the Term
    of the Condescension in the settlement of the estates of Grab, being conducted, upcoming, below-written,
    of the following tenor:


    Stanisław August, by the Grace of God, King of Poland — to you, the Illustrious and Magnificent Antoni
    Prusimski, Starost of Niszczewice, Knight of the Order of Saint Stanislaus, Heir of the estates of
    Trąbczyn and others; and to Ludwik, Land Court Chamberlain of Kalisz; and to Teresa of the Rozdrzewski
    [family], [uncertain: oto] the Illustrious Katarzyna, likewise of the Rozdrzewski [family], last [by]
    marriage Prusimska, Heiress of the estate of Grab; and [uncertain: oto] the Illustrious Magnificent,
    likewise of the Rozdrzewski [family], Molska, Castellaness of Rogoźno — having died without issue
    — to her successor, or mutually [Congb~is], Bogdański — concerning all your estates generally — we
    command: that before Us and Our Condescensorial Court, by the force of a Decree of the Crown Tribunal
    of the Kingdom at Piotrków issued between you, the Cited [parties], on one part, and the Plaintiffs
    and others on the other part, on the 3rd day of June in the present year 1782, by virtue of the last
    Limitation, the Condescension [session] to proceed — you appear in person and peremptorily — at the
    instance of the Illustrious Stanisław Ścibor Chełmski, Treasurer of Wschowa, Plaintiff, who cites
    you, and indeed [the] married [party] under the competent authority of her husband, adhering to their
    documents supporting the matter, cites [you], or rather summons [you] to any prepared decrees [and]
    a prepared proceeding — to see and hear yourselves [obliged] to the payment of sums, whatever and
    however much shall appear from the documents to be due to the Plaintiff from you, together with provisions,
    to be bound [thereby]; the Plaintiff''s claim regarding the payment of the sum transferred to the
    Plaintiff [as agent] from the Honourable Tracholz, Merchant — originally instituted [against] you
    before the Kalisz Land Court, and afterwards, via prosecutions, [transferred] to the Illustrious Magnificent
    [Antoni] and to the Illustrious Magnificent [Katarzyna] Prusimska to the Condescensorial Court by
    remission — to be resolved at the Term of Our Condescension, notwithstanding any of your oppositions
    and prosecutions; to decide [regarding] the payment of the transferred sum for the Plaintiff, together
    with provisions, bound to the chain of Documents, [Austacorum] Mercantile Contracts, and any other
    Transactions proving these, to be followed by you, to be found; the penalties in respect of the evocation
    to the Tribunal Courts for what is at stake to be extended; court expenses to be found compensable;
    all-encompassing satisfaction for the Plaintiff''s interest, as great as it is, to be commanded; the
    summoning of the labourers Albert Siwy, Andreas Rataj, Casimir the Keeper, Albert the Shepherd, of
    Nowa Wieś, and the subjects of the Illustrious Magnificent [Katarzyna] Prusimska, who by [?ct] this
    Citation are detained at your [estate], to be decreed to give testimony; and other things which [by]
    the law of the cause and present matter shall be decided, resolved, and sentenced of the same [parties]
    — be equally ready to observe the Term and to respond judicially to these and other things which will
    be more fully proposed to you. Given at Piotrków, on the 26th day of the month of November, in the
    Year of the Lord 1781. In the estates of Trąbczyn, upon the table in the heated room, the Revenue
    Clerk being present, on Friday, the Eve of the Feast of the Immaculate Conception of the Most Blessed
    Virgin Mary, in the Year of the Lord 1781 — having placed [the citation] and having left notification.'

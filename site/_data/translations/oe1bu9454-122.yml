- page: 1
  en: 'The enclosed note I received early this morning — it had by oversight been left lying in my old
    lodgings. Herr Homuth has on that account just now sent to me again and begs most earnestly that this
    item be settled soon, so that he may at once notify the messenger of the receipt of the 166 Rthl 16
    g. as well. Cabanis is this very moment departing by the post for Hus sinietz — I promise myself from
    that quarter the swiftest and happiest success. From Berlin or Frankfurt an der Oder I have not received
    a syllable today.


    Breslau, the 6th of April


    1804.


    v. Triebenfeld'

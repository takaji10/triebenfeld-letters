- page: 1
  en: '122 The enclosed note I received early this morning — it had by an oversight been left lying at
    my old lodging — Mr Homuth has just now sent to me again on this account and begs most earnestly that
    this post be settled soon, so that he may at once, by the messenger, report the receipt of the 166
    Rthl. 16 Groschen as well — Cabanis is at this very moment setting off by post for Hussinitz — I promise
    myself from that quarter the swiftest and happiest success. From Berlin or Frankfurth I have not received
    a syllable today.


    Wrocław, the 6th of April


    1804.


    v Triebenfeld'

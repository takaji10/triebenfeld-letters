- page: 1
  en: The enclosed note I received this morning early — It had been left lying, by an oversight, in my
    old lodging - Herr Homuth has on that account just now sent to me again, and begs most earnestly that
    this item be settled soon, so that he may at once notify the messenger of the receipt of the 166 Rthl
    16 g. Cabanis is departing this very moment by the post for Hussinietz - I promise myself from this
    quarter the swiftest and happiest success. From Berlin or Franckfurth I have received not a syllable
    today. Breslau, the 6th of April 1804. v Triebenfeld

- page: 3
  en: 'the seller''s part; only, if the purchaser wishes to redeem the canon by payment of the ten thousand
    Rthl, six months'' notice must first be given.


    §. 7. Although it is laid down in § 3 that Meierowitz will pay eight thousand Reichsthaler on the
    23rd of April of this year and twelve thousand Reichsthaler on Midsummer of this year, it is further
    agreed here that, in case the Colonel von Schliesen''s widow should wish to let the six thousand Reichsthaler
    still coming to her according to the mortgage book stand on further, His Serene Highness will allow
    this to happen and will, with the canon of five hundred thalers to be paid yearly, stand behind and
    grant the priority to the Colonel von Schliefen''s widow.


    §. 8. The eight thousand thalers mentioned in § 3, however, must be paid promptly on the 23rd of April
    of this year, to which the purchaser most earnestly binds himself.


    §. 9. The drawing up and execution of a judicial contract over the estate of Witów shall take place
    as soon as the purchase with Honrichs has been annulled. The complete taking-over from Honrichs, however,
    and the delivery to the purchaser, cannot, however the matter may go, take place earlier than Midsummer
    of this year, because otherwise, with'

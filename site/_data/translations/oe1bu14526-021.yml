  en: 'the payments of interest, many entanglements might arise.


    §. 10. Since the purchaser cannot at present establish his capacity to possess noble estates, the
    seller undertakes to contribute everything, as soon as the purchase with Honrichs is annulled, towards
    obtaining the concession to possess the estate of Witów, and to intercede on that account with His
    Majesty the King himself. All the costs of procuring the concession, however, the purchaser bears
    alone.


    §. 11. All the costs occurring in purchases of this kind, by whatever name they may be called, both
    parties bear by halves.


    §. 12. Both parties bind themselves to hold fast to these heads of agreement, renouncing all objections
    by whatever name.


    Done at Kalisz, the 9th of March 1805. Peter Friedrich August von Triebenfeld. Franz Maierowitz. Friedrich
    Willhelm Eger as witness. Bezuer[uncertain: Bezuer] qua testis.'

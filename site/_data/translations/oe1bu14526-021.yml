status: draft
segments:
- page: 1
  en: 'Between the Royal Councillor of War and Forests, also General Plenipotentiary of His Most Serene
    Highness the reigning Prince and Lord of Hohenlohe, Herr Peter Friederich August v. Triebenfeld, and
    Herr Franz Meierowicz, the following Punctation has been agreed upon and drawn up.


    § 1. Herr von Triebenfeld undertakes, as General Mandatarius of the Herr Fürst zu Hohenlohe, to convey
    the estate Wittow, situated in the Warta district, with all its inhabitants and all appurtenances,
    taverns, lands, Scholtzerey, waters, buildings and inventory, with all rights and usufructs, by whatever
    name they may be called, nothing thereof excepted, just as the same was purchased from the widowed
    Frau Obristen von Schliesen, to Herr Meierowitz as heritable and absolute property; as soon as the
    sale with the Honrichs — who is neither capable of possession nor, still less, solvent — shall have
    been annulled, for which purpose the requisite proceedings have already been instituted before the
    competent authority.


    § 2. The sale is effected in Pausch und Bogen, and upon the conclusion of the contract no further
    warranty shall be'
- page: 2
  en: 'rendered by the seller.


    § 3. Herr Meierowitz shall pay at George, that is on the 23rd of April of this year, for the abovenamed
    estate a cash purchase price of Twenty Thousand Reichsthaler in Courant, namely at George, that is
    on the 23rd of April of this year, Eight Thousand Reichsthaler, and at the coming Johanny of this
    year, Twelve Thousand Reichsthaler.


    § 4. Besides this purchase money stipulated and fixed in § 3, the purchaser Herr Meierowitz shall
    pay to His Serene Highness the seller, or wherever the same shall most highly direct [Anweisung],
    yearly and indeed in perpetuity, a canon of Five Hundred Rthl in Courant.


    § 5. This canon shall be paid in half-yearly instalments post numerando to the purchaser, under pain
    of the compulsory measures laid down in the provincial law.


    § 6. Should, however, the purchaser be minded, and find it convenient to his interest, to pay Ten
    Thousand Rthl of capital in place of the canon of Five Hundred Rthl fixed in § 4, in order to discharge
    himself of this burden of debt — which, as a purchase residuum not subject to being called in, is
    to be entered upon this estate Wittow as a first mortgage — then this shall be conceded on'
- page: 3
  en: 'the part of the seller; only, if the purchaser wishes to redeem the canon by payment of the Ten
    Thousand Rthl, a half-yearly notice must first be given.


    § 7. Although it is fixed in § 3 that Meierowitz will pay Eight Thousand Reichsthaler on the 23rd
    of April of this year and Twelve Thousand Reichsthaler at Johanni of this year, it is here further
    agreed that, in case the Frau Obristen von Schliesen should wish to let the Six Thousand Reichsthaler
    still due to her according to the mortgage book stand further outstanding, His Serene Highness will
    permit this to be done and, with the canon of Five Hundred Thaler to be rendered yearly, will stand
    behind and grant the Frau Obristen v. Schliefen the priority.


    § 8. The Eight Thousand Thaler mentioned in § 3, however, must be promptly paid on the 23rd of April
    of this year, to which the purchaser binds himself in the most earnest manner.


    § 9. The drawing up and execution of a judicial contract concerning the estate Witttow shall take
    place as soon as the purchase with the Honrichs has been annulled. The complete taking-over from Honrichs,
    however, and the delivery to the purchaser cannot, howsoever the matter may proceed, take place earlier
    than Johanny of this year, because otherwise, with'
- page: 4
  en: 'the payments of interest, many entanglements might arise.


    § 10. Since the purchaser cannot at present demonstrate his capacity to possess noble estates, the
    seller undertakes to contribute everything toward obtaining the concession to possess the estate Wittow,
    as soon as the purchase with Honrichsen is annulled, and to intercede on that account himself with
    His Majesty the King. All costs, however, for the procuring of the concession the purchaser bears
    alone.


    § 11. All the costs arising in purchases of this kind, by whatever name they may be called, both parties
    bear by halves.


    § 12. Both parties bind themselves to the maintenance of this Punctation, renouncing all objections
    of whatever name.


    Done at Kalisch, the 9th of March 1805. Peter Friedrich August v. Triebenfeld. Franz Maierowitz. Friedrich
    Willhelm Eger as witness. [uncertain: Bezuer] qua Testis'

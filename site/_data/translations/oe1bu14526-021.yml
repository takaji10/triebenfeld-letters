    § 10. Since the purchaser cannot at present prove his capacity to possess noble estates, the seller
    undertakes to contribute everything toward obtaining the concession to possess the estate of Witów,
    as soon as the purchase with Honrichs is annulled, and to intercede on that account himself with His
    Majesty the King. All costs, however, of procuring the concession the purchaser bears alone.


    § 11. All the costs arising in purchases of this kind, by whatever name they may be called, both parties
    bear by halves.


    § 12. Both parties bind themselves to the holding fast of these heads of agreement, with renunciation
    of all objections, by whatever name they may be called.


    Done at Kalisz, the 9th of March 1805. Peter Friedrich August von Triebenfeld. Franz Maierowitz. Friedrich
    Willhelm Eger, as witness. Bezuer[illegible] qua Testis'

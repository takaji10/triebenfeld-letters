    § 3. Mr Meierowitz shall pay on St George''s Day, that is to say the 23rd of April of this year, for
    the above-named estate a cash purchase price of twenty thousand Reichsthaler in Courant, namely on
    St George''s Day, that is to say the 23rd of April of this year, eight thousand Reichsthaler, and
    on the coming Midsummer of this year twelve thousand Reichsthaler.


    § 4. Besides this purchase money stipulated and fixed in § 3, the purchaser, Mr Meierowitz, shall
    pay to His Serene Highness the seller, or wherever the same may most highly direct, annually and indeed
    in perpetuity a canon of five hundred Rthl in Courant.


    § 5. This canon shall be paid in half-yearly instalments post numerando to the purchaser, on pain
    of the coercive measures laid down in the provincial law.


    § 6. Should, however, the purchaser be minded, and find it convenient to his interest, to pay a capital
    of ten thousand Rthl in place of the canon of five hundred Rthl determined in § 4, in order to discharge
    himself of this burden of debt — which, as a purchase-residue that cannot be called in, is to be entered
    upon this estate of Witów as a first mortgage — then this shall be conceded on'

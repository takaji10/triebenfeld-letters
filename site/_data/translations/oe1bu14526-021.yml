- page: 1
  en: 'Between the Royal Councillor of War and Forests and also general attorney of His Most Serene Highness
    the reigning Prince and Lord of Hohenlohe, Peter Friederich August von Triebenfeld, and Franz Meierowitz,
    the following heads of agreement have been negotiated and drawn up.


    §. 1. Von Triebenfeld undertakes, as general mandatary of the Prince of Hohenlohe, to make over to
    Meierowitz, in hereditary and absolute ownership, the estate of Witów situated in the Warta district,
    with all residents and all appurtenances, taverns, lands, the village mayor''s holding, waters, buildings
    and inventory, with all rights and usufructs, by whatever name they may be called, nothing thereof
    excepted, just as the same was purchased from the widowed Colonel von Schliesen; as soon as the sale
    with Honrichs, who is neither capable of possession nor still less solvent, has been annulled, for
    which purpose what is required has already been set in train before the competent authority.


    §. 2. The sale is made in Pausch und Bogen, and at the conclusion of the contract no further warranty
    is given by the seller'

  en: 'is given.


    §. 3. Meierowitz pays on St George''s Day, that is to say the 23rd of April of this year, for the
    above-named estate a cash purchase price of twenty thousand Reichsthaler in Courant, namely on St
    George''s Day, that is to say the 23rd of April of this year, eight thousand Reichsthaler, and on
    the coming Midsummer of this year twelve thousand Reichsthaler.


    §. 4. Besides this purchase money stipulated and fixed in § 3, the purchaser Meierowitz pays to the
    Serene Highness of the seller, or wherever His Highness shall direct, yearly and indeed for all time
    a canon of five hundred Rthl in Courant.


    §. 5. This canon is paid in half-yearly instalments post numerando to the purchaser, on pain of the
    coercive measures laid down in the territorial law.


    §. 6. Should, however, the purchaser be minded, and find it convenient to his interest, to pay ten
    thousand Rthl of capital in place of the canon of five hundred Rthl fixed in § 4, in order to rid
    himself of this burden of debt - which as a purchase residue that cannot be called in is to be entered
    upon this estate of Witów as a first mortgage - then this is conceded on'

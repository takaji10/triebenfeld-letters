- page: 3
  en: 'the part of the seller; only, if the purchaser wishes to redeem the canon by payment of the ten
    thousand Rthl, a half-year''s notice must precede.


    § 7. Although it is indeed fixed in § 3 that Meierowitz will pay eight thousand Reichsthaler on the
    23rd of April of this year and twelve thousand Reichsthaler at Midsummer of this year, it is here
    further agreed that, in case the lady Colonel von Schliesen should wish to leave standing the six
    thousand Reichsthaler still due to her according to the mortgage book, His Serene Highness will allow
    this to be done, and will stand behind with the canon of five hundred thalers to be paid annually,
    and grant priority to the lady Colonel von Schliefen.


    § 8. The eight thousand thalers mentioned in § 3, however, must be paid promptly on the 23rd of April
    of this year, to which the purchaser binds himself in the most earnest manner.


    § 9. The drawing up and execution of a judicial contract concerning the estate of Witów shall take
    place as soon as the purchase with the Honrichs has been annulled. The complete taking-over from Honrichs,
    however, and the delivery to the purchaser cannot, however the matter may go, take place earlier than
    Midsummer of this year, because otherwise, with'

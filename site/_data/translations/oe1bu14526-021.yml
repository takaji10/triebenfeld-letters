- page: 1
  en: 'Between the Royal Councillor of War and Forests and also General Plenipotentiary of His Most Serene
    Highness the reigning Prince and Lord of Hohenlohe, Mr Peter Friederich August von Triebenfeld, and
    Mr Franz Meierowitz, the following heads of agreement have been settled and drawn up.


    § 1. Mr von Triebenfeld undertakes, as General Mandatary of the Prince of Hohenlohe, to convey the
    estate of Witów situated in the district of Warta, with all residents and all appurtenances, taverns,
    lands, the village mayor''s holding, waters, buildings and inventory, with all rights and profits,
    by whatever name they may be called, nothing thereof excepted, just as the same was purchased from
    the widowed lady Colonel von Schliesen, to Mr Meierowitz as his hereditary property; as soon as the
    sale to the Honrichs — who is neither capable of possession, still less solvent — has been annulled,
    for which purpose the necessary steps have already been instituted before the competent authority.


    § 2. The sale is made in Pausch und Bogen, and upon conclusion of the contract no further warranty
    is given by the seller'

- page: 2
  en: 'because, secondly, the appropriate management of the Betsche forest — which, since this forest
    is the only considerable one in that district, merits every regard — could not take place, inasmuch
    as, if free use of it were left to the hereditary lessees, even the best supervision could not wholly
    prevent its devastation; thirdly, there is also this circumstance to be weighed, that if Your Lordship''s
    application were deferred to, the lands to be taken in hereditary lease by the residents could not
    even be managed in an orderly fashion, since every resident, and likewise every burgess of the town
    of Betsche, possesses as much land as he requires for a proper husbandry; and moreover, as regards
    the burgesses, care is to be taken that they apply themselves rather to the pursuit of urban trades
    than to that of agriculture, most of the residents being besides too lacking in means to be able to
    raise the sums of money required for the management. In which We remain well disposed toward Your
    Lordship with friendship, royal grace and good will.


    Posen, the 18th of May 1805. Royal South Prussian War and Domains Chamber [uncertain: G] v. Köller


    To


    The Reigning Prince


    of Hohenlohe-Ingelfingen,


    Your Lordship, Lieutenant-General


    of Infantry and Governor


    of the Residence of Breslau, Chief of a Regiment of Foot, also Knight of the Order of the Black and
    of the Red Eagle, at Breslau 434 R. Anno


    Raeder[uncertain: Raeder]'

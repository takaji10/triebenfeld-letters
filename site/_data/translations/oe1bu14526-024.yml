status: draft
segments:
- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our friendship, royal grace and good will
    beforehand, High-born Prince, particularly dear Friend and dear Faithful Subject! In pursuance of
    the notification issued on the 5th of February of this year upon Your Lordship''s petition submitted
    on the 31st of December of last year for permission to let out the lordship of Betsche on lease to
    the burgesses there and the remaining rural residents, We hereby give Your Lordship, with the return
    of the hereditary-lease contract submitted, upon the ground of the rescript of Our South Prussian
    Finance Department of the 15th of last month issued to Our Chamber in conformity with a Most High
    Cabinet Resolution of the 11th of last month, the following decision: that the hereditary letting
    in question has been found wholly inadmissible, and that the consent sought thereto cannot be granted
    to Your Lordship; for, firstly, if this consent had not been refused Your Lordship, several landed
    lordships would venture similar applications, and thereby the possessions of the nobility, which is
    so numerous in this province and upon whose conservation regard must be had, would be diminished,
    and the opportunities for the acquisition of estates would be taken from it. Even if, however, this
    considerable obstacle did not already stand in the way of Your Lordship''s design, the aforementioned
    letting could not be approved'

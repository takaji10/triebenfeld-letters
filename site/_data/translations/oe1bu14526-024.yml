status: draft
segments:
- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our friendship, Royal grace and good will
    to you beforehand, High-born Prince, especially dear Friend and dear Faithful One! In pursuance of
    the notification issued on the 5th of February of this year to Your Liebden upon the petition brought
    forward on the 31st of December of last year for permission to lease out the lordship of Betsche to
    the burghers there and to the remaining rural inhabitants, We hereby give Your Liebden, with the return
    of the submitted hereditary-lease contract, upon the ground of the Rescript of Our South Prussian
    Finance Department of the 15th of last month issued to Our Chamber in conformity with a Most High
    Cabinet Resolution of the 11th of last month, the following decision: that the hereditary leasing
    in question has been found wholly inadmissible, and that the consent sought thereto cannot be granted
    to Your Liebden; for, firstly, if this consent were not refused to Your Liebden, several landed lordships
    would venture similar applications, and thereby the possessions of the nobility, so numerous in this
    province, upon whose conservation regard must be had, would be diminished, and the same would be deprived
    of opportunities for the acquisition of estates. Should, however, even this considerable obstacle
    not already stand against Your Liebden''s intention, the aforementioned leasing-out could still not
    be approved,'
- page: 2
  en: 'because, secondly, the appropriate management of the Betsche forest, which - since this forest
    is the only considerable one in that district - deserves every regard, could not take place; inasmuch
    as, if the free use is left to the hereditary lessees, even the best supervis[ion] could not entirely
    prevent devastation. Thirdly, there is also this circumstance to be weighed, that if Your Liebden''s
    application were deferred to, the lands to be taken in hereditary lease by the inhabitants could not
    even be managed in an orderly fashion, since every inhabitant, and likewise every burgher of the town
    of Betsche, possesses as much land as he requires for a proper husbandry; and beyond that, in respect
    of the burghers, it is to be seen to that they apply themselves rather to the pursuit of urban trades
    than to that of agriculture, the greater part of the inhabitants being moreover too ill-provided to
    be able to raise the sums in Gold requisite for the management. We remain well disposed to Your Liebden
    with friendship, Royal grace and good will.


    Posen, the 18th of May 1805. Royal South Prussian War and Domains Chamber. [uncertain: G] v Köller


    To


    The Reigning Prince


    of Hohenlohe Ingelfingen


    Liebden, Lieutenant-General of Infantry and Governor of the Residence of Breslau, Chief of a Regiment
    of Foot, also Knight of the Black and Red Eagle Orders, at Breslau 434 R. Anno


    Raeder[uncertain: Raeder]'

status: draft
segments:
- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia. Our friendship, Royal grace and good will
    first of all, High-born Prince, especially Dear Friend and Dear Faithful One! Further to the notification
    issued to Your Liebden on the 5th of February of this year upon the petition presented on the 31st
    of December of last year for permission to lease out the lordship of Betsche to the burghership there
    and to the remaining rural residents, We hereby give Your Liebden, with the return of the submitted
    hereditary-lease contract, upon the ground of the Rescript of Our South Prussian Finance Department
    of the 15th of last month issued to Our Chamber in conformity with a Most High Cabinet Resolution
    of the 11th of last month, the following decision: that the hereditary-leasing in question has been
    found wholly inadmissible, and that the consent sought thereto cannot be granted to Your Liebden;
    for, firstly, if this consent had not been refused to Your Liebden, several landed lordships would
    venture similar applications, and thereby the possessions of the nobility so numerous in this province
    — upon whose conservation regard must be had — would be diminished, and the opportunities for the
    acquisition of estates would be taken from it. Even were, however, this considerable obstacle not
    already to stand in the way of Your Liebden''s design, the aforementioned leasing-out could not be
    approved,'
- page: 2
  en: 'because, secondly, the appropriate management of the Betsche forest — which, since this forest
    is the only considerable one in that region, deserves every regard — could not take place, inasmuch
    as, if the free use of it were left to the hereditary lessees, even the best supervision could not
    entirely prevent devastation; thirdly, there is here also still to be weighed the circumstance that,
    if Your Liebden''s application were deferred to, the lands to be taken in hereditary lease by the
    residents could not even be managed in an orderly manner, since every resident, and likewise every
    burgher of the town of Betsche, possesses as much land as he needs for an orderly husbandry; and beyond
    that, in respect of the burghers, it is to be seen to that they apply themselves more to the [uncertain:
    pursuit of urban trades] than to that of agriculture, the greater part of the residents being moreover
    too [uncertain: without means] to be able to raise the sums of money required for the management.
    Are Your Liebden, with friendship, Royal grace and good will, well disposed toward.


    Posen, the 18th of May 1805. Royal South Prussian Chamber of War and Domains. [uncertain: G] v Köller


    To


    The Reigning Prince


    of Hohenlohe Ingelfingen


    Liebden, Lieutenant-General


    of Infantry and Governor


    of the Residence of Breslau, Chief of a Regiment of Foot, also Knight of the Order of the Black and
    of the Red Eagle, at Breslau 434 R. Anno


    Raeder [uncertain: Raeder]'

- page: 2
  en: 'people much depends. The 1st, such a creature might, in order to remain secure in his tenancy,
    easily hinder the sale by hideous descriptions; also, such a man might 2ndly, seeking his own profit,
    easily let himself be bought, and act to the seller''s disadvantage; therefore I have had him come
    here, and to forestall all this. Now I am sending him off again at once, so that when Budolf and Stubenrauch
    arrive there, he may not only receive them well, but describe everything to those people truthfully
    and in the best light.


    This afternoon I shall bring out what is to be sent to South Prussia — now I must first [uncertain:
    arrange] my business, of which I have found a great deal awaiting me.

    v. Triebenfeld


    Breslau[?] d. 15th of May 1804.'

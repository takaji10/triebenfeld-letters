- page: 1
  en: '129 Today I have letters neither from Berlin nor from Frankfurt an der Oder. My anxiety therefore
    increases hourly. If Your Most Serene Highness has anything from Glenck that affords comfort, may
    you deign to communicate it to your servant. As to Kolzig I had great hopes — but Amelang does not
    answer. Had a ray of hope appeared there, I should have advised that all sale of Konotop be forbidden
    — but if Amelang continues to keep silent about the plan laid before him in this matter, then I must
    believe that Beyme does not [uncertain: gantirt] him; and in this regard the sale of Konotop would
    have to be pursued zealously. To that end I have summoned Bernhardi here and intimated to him that
    he, as tenant, should recommend and represent the estates in the best light to every prospective purchaser
    — for on this sort of'

- page: 1
  en: 'Today I have letters neither from Berlin nor from Frankfurt an der Oder. My anxiety therefore increases
    hourly. If Your Most Serene Highness has anything from Glenck that affords comfort, be pleased then
    to communicate it to Your bondsman. Concerning Kolzig I had great hopes — but Amelang does not answer.
    Had a ray of hope appeared there, I should have advised that all sale of Kontop be forbidden — but
    if Amelang continues to be silent as to the plan laid before him in this matter, then I must believe
    that [uncertain: Beym] does not guarantee it for him; and in this regard the sale of Kontop would
    have to be pressed forward vigorously. To that end I have summoned Bernhardi here and given him to
    understand that he, as the tenant, should commend and represent the estates in the best light to every
    prospective purchaser — for with that species of'

- page: 2
  en: 'Our descendants and successors in the Crown, in the Electorate and in Our remaining lands, in such
    manner and thus, that Our aforesaid friendly and dear uncle, the reigning Prince of Hohenlohe-Ingelfingen,
    shall irrevocably have, possess and enjoy the above-named estates, with all the rights and prerogatives
    attaching thereto, as these have hitherto been exercised or may lawfully be exercised, and no less
    with all their pertinences and other appurtenances, by whatsoever name they may be called, just as
    the same have hitherto been used or may lawfully be used, and with all the lands belonging thereto,
    in fields, woodlands and meadows, and likewise in ponds and waters, from henceforth for all time,
    for himself and his descendants and heirs, as a true and well-acquired and unrestricted property from
    Us and Our descendants and successors; and that there shall likewise be vested in them the power and
    authority to dispose thereof at pleasure under the conditions above mentioned, unhindered by any man.


    We therefore command and enjoin all Our High Provincial Boards, as also all other authorities whom
    this concerns, herewith as graciously as earnestly, that they in no wise hinder or impede the Lordship
    of the oft-mentioned Lord Prince of Hohenlohe-Ingelfingen in the heritable and proprietary possession
    granted to him of the above-named estates together with their pertinences and appurtenances, nor him
    or those to whom he may one day bequeath the same, or may otherwise lawfully transfer them by other
    acts inter vivos aut mortis causa; but rather that they let Your Lordship, and eventually also'

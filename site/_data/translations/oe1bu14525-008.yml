- page: 3
  en: 'them, freely and peaceably enjoy the same, themselves do nothing 1 against it, nor occasion or
    permit that such be done by others, on pain of Our most high displeasure and of unfailing severe punishment.
    In witness whereof etc. Given at Berlin, the 19th of June 1797. Friedrich Willhelm


    Instrument of Grant.


    for the reigning Prince of Hohenlohe-Ingelfingen, to the heritable and proprietary possession of the
    villages of Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno,
    Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienietz and Wolica, together with appurtenances


    Hoym. Reck.


    That the foregoing and overleaf copy has, upon careful comparison, been found to agree and correspond
    word for word with the original of the Most High Instrument of Donation according to its entire contents,
    is hereby, in fidem, attested and certified. Done at Breslau, the 24th of February 1798. Richter,
    Government Auditor here.'

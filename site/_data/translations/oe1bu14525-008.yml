- page: 1
  en: 'We Friedrich Willhelm, by the Grace of God King of Prussia etc., do hereby certify and declare
    by this Our open letter, for Ourselves and Our descendants and successors in the Crown, in the Electorate,
    and in Our remaining lands, that, it having been laid before Us in all humility in what manner Our
    intention — namely to give the High-born Prince, Our friendly and dear uncle Friedrich Ludwig, reigning
    Prince of Hohenlohe-Ingelfingen, by the grant of the estates which belonged to the absconded former
    starosta von Prusimski, a mark of Our friendship and goodwill borne towards him, as also of Our royal
    gratitude for the distinguished and profitable services rendered to Us and to Our royal house — was
    not attained wholly as We had willed it, because the said estates were burdened with many debts, We
    have most highly resolved to make over, grant and convey to Your Lordship, in heritable ownership,
    the hereafter-named formerly ecclesiastical estates, namely the villages of Betsche, Świechocin, Stoki,
    Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno, Olesnica, Drzewce, Grąndzyń, Wrąbczyn,
    Wienietz and Wolica, together with all their appurtenances, by whatsoever name they may be called,
    against payment


    1.) of the sovereign dues hitherto discharged therefrom, as a fixed and unalterable canon; and


    2.) of the allowance due therefrom to the ecclesiastical corporations or foundations.


    We do also so hereby, and by virtue of this present, out of royal power and plenitude, for Ourselves
    and'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord!


    About 2 hours ago I arrived here and heard, to my vexation, that Glenck had travelled off after many,
    also that Leixner was absent and is only expected today. In all things, however, unfortunately nothing
    has yet been done, and as I see, the one does not trust the other. Each thing I have arranged with
    M Bernhard by the agreement: "that I am to bring the matter in question to a conclusion, that the
    estates are to remain in Your Serene Highness''s names — that then Leixner wishes to take Kaemen,
    and that this shall stand either in Your Serene Highness''s name or in mine"; for, as I have said,
    so it has been done. — [uncertain: Leine] is in straits. He is therefore not to apply further for
    the Incolat. Count Schulemburg has got onto his roof. — Meanwhile'
- page: 2
  en: 'he is content if I lend him my name. I have therefore sent an express courier after Gleich, so
    that he may be here again on Saturday; today I go to Berlin, to sound out everything there, and when
    I return on Saturday I shall settle everything here, go from here to Bersch, with Heaven''s help conclude
    everything there as well, and then hasten to Your Serene Highness; for to live longer in uncertainty
    would be the torment of hell. — I do not know what Glenck thinks; Johann is indeed all too near. The
    post is about to depart; more from Berlin. In deepest reverence I remain, until death, Your Most Serene
    Highness''s


    Fr a. d. Oder, the 17th of May 1804.


    faithful and most obedient servant

    v Triebenfeld'

- page: 1
  en: '234


    Enclosure 2. How I stand with Weigel, Your Serene Highness will see from the appendix. Since that
    time he has already written twice more to the Jewish, Bang a Redlich, and enquired when, where and
    how he might find me. I have already written to him and am today sending an express messenger to Wrocław,
    again to him, that he is to come with all speed. — If my plan succeeds, which I do not doubt, then
    you are rid of a debt item of some 54000 Rt., and after 9 or at most 10 years you will have the estates
    clear on that side. — It is much if you extinguish some 90000 rt of debts without losing a Groschen
    of the substance of the estates. Now everything in this matter depends on the most speedy arrival
    of Mr Weigel — if he presents himself, then the matter is certainly agreeable to him, and the plan
    I shall lay before him so evident that he will certainly agree to it and be satisfied.'

- page: 2
  en: 'The Invalids'' Fund is and remains for me now the one stone of stumbling — it has some 9000 Rthl
    of arrears of interest to demand, and has therefore laid an attachment upon everything, upon old as
    well as new interest. Were it now possible that out of the Sacken estate or bequest the capital of
    50 000 Rthl could be paid to the Invalids'' Fund, and that I could assign the 50000 Rthl to that purpose,
    then you would be master, for I should certainly not press. — This is the only means of obtaining
    an entirely free hand. My counsel is that Prince August lend a hand here in the work, that he for
    his own person insist upon it — [uncertain: ſchöffen] the spectacle. I am writing on that account
    to the King, that he should command it, for he permitted at that time that the money should and must
    be paid to me upon the mortgage. The King can also now press for it that it be paid out of the great'

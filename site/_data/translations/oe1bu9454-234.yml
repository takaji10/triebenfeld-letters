- page: 4
  en: 'which must in return be bound to give me the rights ceded to it (jura cessa). — I concede if need
    be that the Sacken estate shall for the present draw the interest from the estates of Zagórów in my
    stead. Only I wish thereby to be covered for the future and to see the Prince freed from the most
    hideous pressure. If we do it so, then the matter [uncertain: succeeds] for certain, and if the King
    himself commands it, one will not [uncertain: care to] take it to heart. Your Serene Highness, [consider]
    everything well and write to me about everything, without any foreign interference whatever, with
    the very greatest speed. By God, everything will go very well. Only send the instrument; and should
    it be quite impossible for it to be [uncertain: drawn up in court] quickly, then write it yourself
    and have it signed by 2 witnesses — but it is better done judicially. To me it is very, very urgent.
    This writing has cost me blood and sweat; God grant that they read it better than I am able to write
    it. Lying in bed one does not write well. Ever


    Your Serene Highness''s


    Blizanow, the 6th of July 1812


    faithful servant


    v Triebenfeld'

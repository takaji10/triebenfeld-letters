- page: 4
  en: 'which must in return be bound to give me [uncertain: Jura lehre] — I concede if need be that the
    Sacken estate should for the present draw the interest out of the estates of Zagorowo in my stead.
    Only I wish thereby to be covered for the future, and to see the Prince freed from the most hideous
    pressure. If we do it so, the matter is assuredly settled, and if the King himself commands it, one
    will not wish to [text lost]. Your Serene Highness, consider it all well, and write to me about everything
    without any foreign interference whatever, with the utmost speed. By God, all will go very well. Only
    send the instrument, and should it be quite impossible for it to be authenticated [uncertain: quickly
    in court], then write it yourself and have it signed by 2 witnesses — but it is better done before
    a court; very, very urgent for me. The writing has cost me blood and sweat. God grant that you can
    read it better than I am able to write it. Lying in bed one does not write well. Ever


    Your Serene Highness''s


    Blizanow, the 6th July 1812


    faithful servant


    v. Triebenfeld'

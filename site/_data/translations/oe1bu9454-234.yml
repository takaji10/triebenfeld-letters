- page: 2
  en: 'The Invalids'' Fund is and remains for me at present the only stone of stumbling — it has some
    9000 rt of arrears of interest to demand, and has therefore laid an arrest upon everything, namely
    upon both old and new interest. Were it now possible that out of the Sacken estate or bequest the
    capital of 50000 rt could be paid to the Invalids'' Fund, and that I could make over the 50000 rt
    for that purpose, then you would be master, for I should certainly not press. This is the only means
    of obtaining an entirely free hand. My counsel is that Prince August lend a hand here in the work,
    that he insist upon it for his own person — [uncertain: create] the spectacle; I am writing on that
    account to the King, that he should command it, since he permitted at that time that the money should
    and must be paid to me upon the mortgage. The King can also now press for it, that it be paid out
    of the great'

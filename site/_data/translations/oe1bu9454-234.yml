- page: 1
  en: 'Beginning 2. How matters stand between me and Weigel, Your Serene Highness will see from the enclosure.
    Since that time he has already written twice more to the Jewish [uncertain: Bang] a Redlich and enquired
    when, where and how he might find me; I have already written to him and today am sending an express
    messenger to Breslau to him again, that he is to come with all speed. — If my plan succeeds, of which
    I have no doubt, then you are rid of a debt item of some 54000 Rthl, and after 9, at most 10 years
    you will have the estates clear on that side. — It is much if some 90000 Rthl of debts are extinguished
    without losing a Groschen of the substance of the estates. Now everything in this matter depends upon
    the most speedy arrival of Herr Weigel — if he presents himself, then the matter is assuredly agreeable
    to him, and the plan I shall lay before him so evident that he will certainly enter into it and be
    satisfied.'

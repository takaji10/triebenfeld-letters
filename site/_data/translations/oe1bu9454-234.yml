- page: 3
  en: 'bequest — the only thing would be that instead of to the Invalids'' Fund one should thereafter
    (when the old woman has pasted everything over far too devilishly and has tied even Prince August''s
    hands) pay interest yearly there. You would then be rid of the accursed execution, and could, once
    everything is arranged, draw yearly revenues of 6 to 8000 Rthl.


    The matter must go through by way of me. I write to the King and say that I received the monies at
    that time with Your Majesty''s consent out of the Invalids'' Fund. The [uncertain: Zwalden] presses
    me at the same time as the Prince. — Is the Prince owing me that, or a [uncertain: könnigstiger] capital?
    I should call it in in order to satisfy the Invalids out of it — the Princes of Hohenlohe, father
    and son, wish this too; the guardians (or whoever it now may be) forbid this. Command, Your Royal
    Majesty, that the money which I absolutely must receive be taken out of the Sacken bequest, and the
    Invalids'' Fund paid'

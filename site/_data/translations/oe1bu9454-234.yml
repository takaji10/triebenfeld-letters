- page: 3
  en: 'bequest — the only thing would be that, instead of to the Invalids'' Fund, one thereafter pays
    annual interest to that quarter / when the old woman has [uncertain: pasted over] everything most
    devilishly and has even tied Prince August''s hands /. You would after all be rid of the accursed
    execution, and could, once everything is arranged, draw annual revenues of 6 to 8000 rt.


    To me the matter must go through. I am writing to the King and say that I received the moneys at that
    time out of the Invalids'' Fund with Your Royal Majesty''s consent. The Invalids press me at the same
    time as the Prince. — The Prince owes me this or a [illegible] capital. I [uncertain: announce] it
    in order to satisfy the Invalids out of it — the Princes of Hohenlohe, father and son, also wish this;
    to me the guardians / or whoever it now is / forbid this. Command, Your Royal Majesty, that the money
    which I must absolutely receive be taken out of the Sacken bequest and the Invalids'' Fund be paid,'

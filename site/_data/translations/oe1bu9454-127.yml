status: draft
segments:
- page: 1
  en: 'All pleading is of no avail; I am to pay and must pay. The Prince has, as the enclosure shows,
    not settled so much as a single Groschen of interest.


    I must therefore pay the


    700 Rthl promised by the Prince for the inventory under my guarantee, and from 1799 the interest at
    175 b


    likewise legal costs


    35 Rthl


    altogether


    910 Rthl. My cash-box is exhausted, for only yesterday I paid out 1537 Rthl 12 gg in the Nudnichisch
    matter – which the Prince, according to fourfold judicial documents, so solemnly promised to settle.
    Wildegans and Heyman Pincus promise to settle everything – only God knows when. In the meantime I
    must pay, if I do not want execution in the house. Could Your Serene Highness help me with the 900
    Rthl? Then have the grace to do so – at Midsummer I can support Your Serene Highness again with the
    timber monies.


    Breslau, the 2nd of May 1804


    v. Triebenfeld'

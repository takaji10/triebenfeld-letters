segments:
- page: 1
  en: '127 All pleading is of no avail, I am to and must pay. The Prince, as the enclosure shows, has
    not settled so much as a single Groschen of interest.


    I must therefore pay the = 700 Rthl. promised by the Prince for the inventory under my guarantee,
    and the interest since 1799 amounting to = 175 Rthl., likewise court costs = 35 Rthl.


    in all = 910 Rthl.


    My funds are exhausted, for I already paid out 1,537 Rthl 12 Groschen yesterday in the Nudnich matter
    — which the Prince, according to fourfold court documents, so solemnly promised to settle — Wildegans
    and Heyman Pincus promise to settle everything — only God knows when — Meanwhile I must pay, if I
    am not to have distraint in the house. Can Your Serene Highness help me with the 900 Rthl? Then have
    the goodness to do so — At Midsummer I can again support Your Serene Highness with the timber monies.


    Wrocław, the 2nd of May 1804


    v Triebenfeld'

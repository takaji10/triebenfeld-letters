- page: 2
  en: 'such a form that Your Serene Highness may use it separately – The acceptance for the second instalment
    too is to be so drawn up that no misfortune can occur any more. I await Kunckel with longing – He
    does indeed write to his mother that he will arrive here these next days with several people; in the
    meantime, however, the time is dragging somewhat too long – I wish he were here already – Kunckel''s
    mother lives here in the greatest destitution; if Your Serene Highness should wish to perform a work
    of mercy on this day, then send me a couple of Thaler for this poor woman, who lies sick and wretched
    – I do indeed give her some little, but this does not go far towards keeping oneself alive in these
    dear times.


    Breslau, the 2nd of April


    1804


    v. Triebenfeld'

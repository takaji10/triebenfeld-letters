- page: 1
  en: '120 Cabanis came back yesterday with the good news that the Hussites wish to buy.


    In Husinich, Rentsch and the neighbourhood there are already a considerable number who have at once
    shown the best will; since, however, the number of Hufen is too great for these, they have immediately
    sent an express to their Moravian brethren in the faith. They have found the price of 300 Rthl per
    Hufe and 15 Rthl. yearly rent a fair one, and believe that, notwithstanding that the oppression in
    Bohemia has ceased, they will soon, on account of the acceptable price, have the requisite number
    of farmers together. Within a fortnight at the latest they mean to appear in a body — God grant His
    blessing — Cabanis is nevertheless to [uncertain: travel out] again, in order to encourage the people,
    through the clergyman at Hussinitz, to press the matter forward as quickly as possible. The messenger
    from Countess Schlabrendorff is back as well — here the answer does not correspond to Your Most Serene
    Highness''s wishes — She [uncertain: flatly] refuses to give out the instru[uncertain: ment] any sooner,
    until she has received the other 50/m Rthl. The term to the 1st of January 1805 Homuth is procuring.
    But he will draw up the receipt in'

- page: 2
  en: 'such form that Your Serene Highness may use it separately — the acceptance for the second term
    is also to be so drawn up that no mishap can occur any more. Kunckel I await with longing — he does
    indeed write to his mother that he will arrive here in these days with several persons; meanwhile
    the time does grow somewhat too long — I wish he were here already — Kunckel''s mother lives here
    in the greatest destitution; should Your Serene Highness be pleased to do a work of mercy on this
    present day, then send me a couple of Thaler for this poor woman, who lies sick and wretched — I do
    indeed give her a little, but this does not go far towards keeping herself in these dear times.


    Wrocław, the 2nd of April 1804.


    v Triebenfeld'

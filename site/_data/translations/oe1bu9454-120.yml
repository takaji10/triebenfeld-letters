segments:
- page: 1
  en: 'Cabanis came back yesterday with the good news that the Hussites wish to buy.


    In Hussenich, Rentsch and in that neighbourhood there are already a fair number who have at once shown
    the best will; since, however, the number of Hufen is too great for these, they have immediately sent
    an express to their Moravian brethren in the faith. The price of 300 Rthl per Hufe and 15 Rthl annual
    rent they have found fair, and they believe that, notwithstanding that the oppression in Bohemia has
    ceased, on account of the acceptable price they will soon have the number of required farmers together.
    At the latest within 14 days they wish to appear as a body – God grant His blessing – Cabanis is nevertheless
    to go out again [uncertain: hinweitem] in order to encourage the people, through the clergyman at
    Hussinitz, to the speediest pressing forward of the matter. The messenger from the Countess Schlabrendorff
    is also back. Here is the answer; it does not correspond to Your Most Serene Highness''s wishes –
    She refuses [illegible] to hand over the instrument [uncertain: InstruQuist] any sooner, until she
    has not received the other 50 ℔ [uncertain: v.]. The term until the 1st of January 1805 is effected
    by Hornuth. He will, however, draw up the receipt in'

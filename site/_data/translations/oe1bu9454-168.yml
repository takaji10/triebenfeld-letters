- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    The snow lying here a foot deep hinders all my operations; I must sit here to no purpose, unable to
    do anything. The contracts with the old peasants and the securing of the dues I have these days concluded
    before the court, and have thereby secured to Your Serene Highness a considerable revenue for all
    time. Now I am negotiating over Szetlewek and the propination rights with von Otocki, for the old
    Radremil [uncertain: changes] his mind every moment and would gladly draw the matter out so as to
    be able to cheat in the end. From Berlin I have good news concerning the loan; Amelang promises to
    bring everything about, only I am not to hurry him. The Department urgently requires still the refusal
    of Minister


    von Voss and of the Chamber concerning the revision of the assessments. This I am sending on by the
    first post to Amelang and hope for the best. Concerning the dismemberment, Klewitz has expressed himself
    that if the lands are not, as at Betsche, sold against ready money but rather for a proportionate
    rent, the consent ought not thereby to fail.'

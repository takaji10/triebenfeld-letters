- page: 4
  en: 'To this Wollenhaupt replies: the building councillor Glenck had granted him leave to undertake
    works outside, wherever he might know of them and be able, for it would surely be an honour to the
    Prince if his people were sought after.


    In respect of the 5 [uncertain: Huren] made use of, he likewise says that


    Herr Glenck had given him leave to use them freely and to draw the revenues of Marianton (that is,
    rent from the inhabitants) and everything else.


    The dwelling too the fellow will not vacate, for he says both Herr Glenck and Your Serene Highness
    had assured him of the dwelling for so long as until he should be otherwise provided for. Schenck
    hangs his mouth on this account, because he cannot move in, and will presumably give up his engagement
    and the justiciarship - I must now [uncertain: cajole] this fellow also so far as is possible — should
    he however grow too defiant, then he may go to the devil, for I have now made myself tolerably [uncertain:
    informed], and for that post we shall find a hundred for one. Enough to drive one mad it is, though,
    to have to fight one''s way about with all these lads amid works already beyond surveying, and to
    keep the rogues always in view so that they do not do too much harm. Schenck insists absolutely on
    4 [uncertain: Herren] of land and on the liberty of choosing an actuary himself. I shall make a verbal
    report to Your Serene Highness on the matter.


    With boundless fidelity I remain, until death,


    Your Serene Highness''s


    Trąbczyn


    the 31st of March 1805


    humble and obedient servant


    von Triebenfeld'

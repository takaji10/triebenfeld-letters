- page: 3
  en: 'Wieniec heirs have now again sued for 1,300 Rthl of surveying costs.


    Chwalowski demands 850 Rthl.


    Sprengel, what Mr Glenck now certifies, 61 Rthl. Wollenhaupt 800 Rthl.


    [uncertain: total] is 3,011 Rthl.


    These people have already received large sums, and notwithstanding that, there is nothing substantial
    on hand from Glenck, nor any survey register; rather everything must be surveyed and allotted anew.
    In the Wieniec matter, however, nothing will come of it, for I know the curator; Chwalowski will have
    to content himself with the half; Sprengel must have his money, since Glenck has certified to him
    the claim of 61 Rthl. for his present exertions. With Wollenhaupt, however, it will look foolish.
    The fellow demands, as said above, 800 Rthl. I proved to him that he has worked elsewhere these 2
    years and left Your Serene Highness''s works quite untouched, whereby 600 Rthl. fell away.


    Further, that for 4 years he had appropriated to himself 5 Hufen of land and used them all; this amounts
    yearly to 150 Rthl, consequently for 4 years 600 Rthl, which makes 1,200 Rthl.


    He must therefore still hand back 400 Rthl.'

- page: 3
  en: 'Winnicki heirs have now again brought suit for surveying costs. 1300 Rthl


    Chwalowski demands


    850 Sprengel, which Herr Glenck now attests


    61. Wollenhaupt


    800. making 3011 Rthl. These people have already received large sums, and notwithstanding there is
    nothing substantial to be had from Glenck, nor any survey register, but everything must be surveyed
    and divided anew. In the Winnicki affair, however, nothing will come of it, for I know the curator;
    Chwalowski will have to content himself with the half; Sprengel must have the money, since Glenck
    has [uncertain: attested] to him the claim of 61 Rthl for his present exertions. With Wollenhaupt,
    however, it will look badly. The fellow demands, as said above, 800 Rthl. I proved to him that he
    has for 2 years worked elsewhere and left Your Serene Highness''s works lying wholly untouched; wherefore
    there went off


    600 Rthl. Further, he has for 4 years appropriated to himself 5 Hufen of land and has [uncertain:
    had the use of] all of these; this amounts yearly to 150 Rthl, consequently for 4 years 600, makes


    1200 Rthl. He must therefore still pay out 400 Rthl'

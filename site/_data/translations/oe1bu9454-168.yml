status: draft
segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    The snow lying a foot deep here hinders all my operations; I must sit here to no purpose, without
    being able to do anything. The contracts with the old peasants and the securing of the dues I have
    these last days concluded before the court, and thereby secured for Your Serene Highness a considerable
    revenue [uncertain: Nevenis] for all time. Now I am negotiating on account of Szettleich and the propination
    rights with von Otocki, for the old Radremiliändert changes his mind every moment and would gladly
    protract the matter so as to be able to cheat in the end. From Berlin I have good news concerning
    the loan; Amelan promises to bring everything about, only I am not to hurry him. The Department urgently
    requires still the refusal of Minister


    von Voss and of the Chamber on account of the revision of the assessments. This I send off by the
    first post to Amelang and hope for the best. Concerning the dismemberment Klewitz has remarked that
    if the lands were sold not, as at Betsche, for ready money but for a proportionate rent, the consent
    ought not to fail.[uncertain: des Consens aus nicht entstehen solte]'
- page: 2
  en: 'the latter has for the most part been done, and the consent will, since Mr von Goldbeck has written
    so handsomely, certainly follow shortly. I have already sent Amelang in all haste a description of
    the whole affair, so that he may thoroughly demonstrate everything to Mr von Klewitz and show him
    that the revenues of these estates are not sold away, but by the dismemberment are increased fourfold
    and set on a lasting footing for all time. It is, however, more than galling to me that, amid so many
    labours, I must still contend against a [uncertain: Wotte] of villains; and were my attachment to
    Your Serene Highness not boundless, I should long since have grown weary in my zeal.


    Mr P. Glenck here makes sport of my doings, makes them ridiculous before the world, and is at pains
    to thwart everything. Now he has come to an understanding with Wollenhaupt, has engaged him as his
    agent and promised him all the kingdoms of the world. The three lads of Olesnica and a certain Meyer
    are in this plot as well, and when purchasers come, all these scoundrels take pains to talk the people
    out of it. Altogether Glenck''s conduct is grasping [uncertain: haab] and vindictive, and it is all
    one to him whether he helps to cheat Your Serene Highness of some several thousand Rthl [uncertain:
    4lln], if only he attains his purpose and, with the plot, hinders everything. All is in the greatest
    confusion and no one can find either beginning or end –


    Thus, for example, the'
- page: 3
  en: 'Winnicki heirs have now once more sued for surveying costs. 1300 Rthl


    Chwalowski demands


    850 Sprengel, which Mr Glenck now attests


    61. Wollenhaupt


    800. which make 3011 Rthl. The people have already received large sums, and notwithstanding this there
    is nothing substantial from Glenck, nor any surveying register, but everything must be surveyed and
    apportioned anew. In the Winnicki matter, however, nothing will come of it, for I know the curator;
    Chwalowski will have to be content with the half; Sprengel must have the money, since Glenck has attested
    to him the claim of 61 Rthl for his present efforts. But with Wollenhaupt it will look foolish. The
    fellow demands, as said above, 800 Rthl. I proved to him that for 2 years he had worked elsewhere
    and had let Your Serene Highness''s works lie wholly idle, whence there fell away


    600 Rthl. Further, that for 4 years he had appropriated to himself 5 Hufen of land and had used them
    all, which amounts yearly to 150 Rthl, consequently over 4 years 600, making


    1200 Rthl. He must therefore still hand back 400 Rthl'
- page: 4
  en: 'To this Wollenhaupt replies: that the building councillor Glenck had granted him permission to
    undertake works outside wherever he knew of them and was able, for it would surely be an honour to
    the Prince if his people were sought after.


    With regard to the 5 [uncertain: Huren] he has used, he likewise says that


    Mr Glenck had given him permission to use them freely and to draw the revenues from Marianton (that
    is to say, rent from the inhabitants) and everything.


    The fellow will not vacate the dwelling either, for he says that both Mr Glenck and also Your Serene
    Highness had assured him of the dwelling for so long as until he should be otherwise provided for.
    Schenck hangs his mouth on that account because he cannot move in, and will presumably give up his
    engagement and the office of justiciary — I must now also cajole [uncertain: Casuliren] this fellow
    so far as possible — but if he becomes too defiant, then he may go to the devil; for now I have knocked
    about enough, and for that post we shall find a hundred for one — enough to drive one mad, but so
    it is, to have to fight one''s way about with all these lads amid labours already beyond surveying,
    and to keep the rogues always in view so that they do not do too much harm. Schenck insists absolutely
    on 4 [uncertain: Herren] of land and on the liberty of choosing an assistant clerk himself. I shall
    make Your Serene Highness a verbal report upon it.


    With unbounded fidelity I remain, until death,


    Your Serene Highness''s


    Trąbczyn


    the 31st of March 1805


    humble and obedient servant


    v. Triebenfeld'

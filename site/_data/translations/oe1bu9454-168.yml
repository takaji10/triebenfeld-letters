- page: 1
  en: '168


    Most Serene Prince


    Most gracious Lord!


    The snow, lying a foot deep here, hinders all my operations; I must sit here to no purpose, without
    being able to do anything. The contracts with the old peasants and the securing of the dues I have
    these days concluded before the court, and have thereby secured to Your Serene Highness a considerable
    revenue for all time. I am now negotiating over Szetlewek and the propination rights with von Otocki,
    for old Radzinski changes his mind every moment and would gladly drag the matter out so as to be able
    to cheat in the end. From Berlin I have good news concerning the loan; Amelang promises to bring everything
    about, only I am not to hurry him. The Department still urgently requires the refusal of Minister


    von Voss and of the Chamber concerning the revision of the assessments. This I shall send on by the
    first post to Amelang, and I hope for the best. Concerning the dismemberment, Kleur has stated that
    if the grounds were not sold as at Pszczew [uncertain: gegen für] for ready money but for a proportionate
    rent, the consent should not [uncertain: arise/fail].'

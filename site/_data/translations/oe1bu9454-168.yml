- page: 4
  en: 'To this Wollenhaupt replies that the building councillor Glenck had granted him leave to undertake
    works outside, wherever he knew of them and was able, for it would indeed be an honour to the Prince
    if his people were sought after.


    With regard to the 5 Hufen he made use of, the same man says likewise that


    Mr Glenck had given him leave to use them freely and to draw the revenues of Mariantów / that is,
    rent from the inhabitants / and everything.


    The dwelling, too, the fellow will not vacate, for he says that both Mr Glenck and also Your Serene
    Highness had assured him the dwelling for so long as until he should be otherwise provided for. Schenck
    is hanging his lip over this, since he cannot move in, and will probably give up his engagement and
    the justiciary''s office — I must now cajole this fellow too as far as possible — but if he grows
    too defiant, he may go to the devil, [text lost] now I have pretty well [uncertain: worked my way
    through], and for that post we shall find a hundred for one — but it is enough to drive one mad, to
    have to struggle about with all these lads amid works already beyond surveying, and to keep the rogues
    always in eye so that they do not do too much damage — Schenck insists absolutely on 4 [uncertain:
    Herren] of land and on the liberty to choose an actuary himself. I shall make oral report to Your
    Serene Highness upon it.


    With boundless fidelity I remain, until death,


    Your Serene Highness''s


    Trąbczyn


    the 31st of March 1805


    humble and obedient servant


    von Triebenfeld


    The old subjects of Swięcia I have bought out for a trifle, and have just now concluded a contract
    with other people for all 28 Hufen; they give 400 Rthl in cash per Hufe and 15 Rthl yearly in interest,
    bear all burdens like the others, pay 10 per cent transfer fee (Laudemium), and pay on St George''s
    Day a sum suited to the matter. NB this is the profit of 10/m Rthl. — sold against the 1st, and instead
    of 2–10 per cent transfer fee in earnest money —'

- page: 2
  en: 'the latter has for the most part been done, and the consent will, since Herr von Goldbeck has written
    so handsomely, certainly follow before long. Already I have sent Amelang in all haste a description
    of the whole affair, so that he may demonstrate everything thoroughly to Herr von Klewitz and show
    him that the revenues of these estates are not being sold, but are through the dismemberment increased
    fourfold and set [uncertain: on a footing] for all time. More than grievous it is for me meanwhile
    that alongside so much work I must still contend against a [uncertain: pack] of villains; and were
    my attachment to Your Serene Highness not boundless, I should long since have grown weary in my zeal.


    Herr P. Glenck makes merry here over my proceedings, makes them ridiculous before the world, and is
    at pains to thwart everything. Now he has joined himself with Wollenhaupt, engaged the latter as his
    mandatary, and promised him all the kingdoms of the world. The three Olesnica lads and a certain Meyer
    stand in this plot as well, and when purchasers come, all these scoundrels take pains to talk the
    people out of it. Altogether Glenck''s conduct is grasping and vindictive, and it is all one to him
    whether he helps to cheat Your Serene Highness out of some thousands of Rthl, so long as he attains
    his purpose and hinders everything by means of the plot. Everything is in the greatest confusion and
    nobody can find either beginning or end –


    Thus for example the'

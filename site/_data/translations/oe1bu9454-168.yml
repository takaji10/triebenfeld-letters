status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! The snow lying here a foot deep hinders all my operations;
    I must sit here in vain, without being able to do anything. The contracts with the old peasants and
    the securing of the dues I have these days concluded before the court, and thereby secured for Your
    Serene Highness a considerable revenue for all time. Now I am negotiating over Szettleich and the
    propination rights with v. Otocki, for the old [uncertain: Radremiliändert] changes his mind every
    moment and would gladly drag the matter out so as to be able to cheat in the end. From Berlin I have
    good news concerning the loan; Amelang promises to bring everything about, only I am not to hurry
    him. The Department urgently requires still the refusal of the Minister v. Voss and of the Chamber
    concerning the revision of the assessments. This I shall send on by the first post to Amelang and
    hope for the best. Concerning the dismemberment, Klewitz has expressed himself to the effect that
    if the plots were sold not, as at Betschen, for ready money, but rather for a proportionate rent,
    the consent ought not to fail to be given.'
- page: 2
  en: 'the latter has for the most part been done, and the consent will, since Herr v. Goldbeck has written
    so handsomely, assuredly follow shortly. Accordingly [uncertain: Jedes] I have with all haste sent
    Amelang a description of the whole affair, so that he may demonstrate everything thoroughly to Herr
    v. Klewitz and show him that the revenues of these estates are not being sold off, but rather increased
    fourfold by the dismemberment and set on a footing for all time. More than galling, however, it is
    for me that, amid all these labours, I must still contend against a gang of villains; and were my
    attachment to Your Serene Highness not boundless, I should long since have grown weary in my zeal.
    Herr P. Glenck here makes sport of my dealings, makes them ridiculous before the world, and is at
    pains to thwart everything. Now he has come to an agreement with Wollenhaupt, engaged him as his mandatary,
    and promised him all the kingdoms of the world. The three Olesnice lads and a certain Meyer are likewise
    in this plot, and when purchasers come, all these scoundrels take pains to talk the people out of
    it. Altogether Glenck''s conduct is grasping and vindictive, and it is all one to him whether he helps
    to cheat Your Serene Highness of some thousands of Rthl, if only he attains his purpose and, with
    the plot, obstructs everything. Everything is in the greatest confusion and no one can find either
    beginning or end — So, for example, the'
- page: 3
  en: Winnicki heirs have now again sued for surveying costs. 1300 Rthl. Chwalowski demands 850. Sprengel,
    which Herr Glenck now attests, 61. Wollenhaupt 800. In all that is 3011 Rthl. The people have already
    received large sums, and notwithstanding this there is nothing substantial to be had from Glenck,
    nor any surveying register, but everything must be surveyed and divided up anew. In the Winnicki matter,
    however, nothing will come of it, for I know the curator; Chwalowski will have to content himself
    with half; Sprengel must have the money, since Glenck has attested the claim of 61 Rthl for his present
    exertions. But with Wollenhaupt it will look bad. The fellow demands, as said above, 800 Rthl. I proved
    to him that he had for 2 years worked elsewhere and left Your Serene Highness's work entirely lying;
    hence there came off 600 Rthl. Further, he has for 4 years appropriated to himself 5 Hufen of land
    and used them all; this amounts yearly to 150 Rthl, consequently over 4 years 600, facit 1200 Rthl.
    He must therefore still hand over 400 Rthl.
- page: 4
  en: 'To this Wollenhaupt replies: the Building Councillor Glenck had granted him permission to undertake
    work outside, wherever he knew of it and was able, for it would surely be an honour to the Prince
    if his people were sought after. With regard to the 5 Hufen he has made use of, the same man likewise
    says that Herr Glenck gave him permission to use them freely and to draw the revenues of Marianton
    (that is to say, rent from the inhabitants) and everything else. The fellow will not vacate the dwelling
    either, for he says that both Herr Glenck and also Your Serene Highness had assured him of the dwelling
    until such time as he should be otherwise provided for. Schenck hangs his mouth on this account, because
    he cannot move in, and will probably give up his engagement and the office of Justitiarius — I must
    now also handle [uncertain: Casuliren] this fellow as best I can — but if he grows too defiant, then
    let him go to the devil; for I have now pretty well [uncertain: durch gewißet] worked my way through,
    and for that post we shall find a hundred for one. It is enough to drive one mad, however, to have
    to struggle about with all these lads amid labours already beyond surveying, and to keep the rogues
    always in view so that they do not do too much damage. Schenck absolutely insists on 4 Hufen of land
    and on the liberty of choosing an Actuarius himself. I shall make a verbal report upon this to Your
    Serene Highness. With unbounded fidelity I remain, until death, Your Serene Highness''s Trąbczin,
    the 31st of March 1805 humble and obedient servant v Triebenfeld'

- page: 2
  en: 'The latter has for the most part been done, and the consent will assuredly follow shortly, since
    Mr von Goldbeck has written so handsomely. Meanwhile I have sent Amelang with all speed a description
    of the whole matter, so that he may demonstrate everything thoroughly to Mr von Klewitz and show him
    that the revenues of these estates are not being sold, but rather are by the dismemberment increased
    fourfold and set on a footing for all time. More than galling it is for me, however, that amid so
    many labours I must still do battle against a pack of villains; and were my attachment to Your Serene
    Highness not boundless, I should long since have grown weary in my zeal.


    Mr Glenck here makes merry over my dealings, makes them ridiculous before the world, and is at pains
    to thwart everything. He has now made common cause with Wollenhaupt, engaged him as his mandatary,
    and promised him all the kingdoms of the world. The three Oleśnica lads and a certain Meyer are likewise
    in this plot, and when purchasers come, all these scoundrels take pains to talk the people out of
    it. Altogether Glenck''s conduct is [uncertain: haab] and vindictive, and it is all one to him whether
    he helps to cheat Your Serene Highness of several thousand Rthl, so long as he attains his purpose
    and, with the plot, hinders everything. All is in the greatest confusion, and no one can find either
    beginning or end — thus, for example, the'

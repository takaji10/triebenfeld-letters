- page: 1
  en: '27


    Most Serene Prince,


    Most gracious Prince and Lord!


    Whether this letter will meet the fate of all the preceding ones I leave undecided; out of faithful
    attachment to Your Most Serene Highness I cannot weary of working on wherever it can be done, and
    of reporting most obediently to Your Highness by this route the events that have lately come to pass.


    That Trąbczyn and Kamionna have been taken by force by the Prusimski family Your Serene Highness will
    doubtless already know, and that at present nothing of consequence can be done against these one-sided
    undertakings Your Serene Highness will be pleased to perceive. I have merely had the protests lodged,
    in order greatly to secure the sum registered in my name. Whether this will succeed I do not yet venture
    to assert; indeed I rather believe that for the time being everything will be dismissed. The hope
    that the affair will change as a whole, and that the present situation will take on quite another
    shape, is the only [uncertain: Ander] upon which I alone [uncertain: baar]. The lady, Mrs General
    v. Sanitz, from whom too the estates conferred upon her husband have been taken, has herself written
    to the Emperor Napoleon and asked him for a declaration, because he only all, to Wibicki the estate
    Maniecki back, to give; but ordered everything else to be left in statu quo'

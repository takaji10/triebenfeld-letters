status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! Whether this letter will meet the fate of all
    the preceding ones I leave undecided; out of faithful attachment to Your Most Serene Highness I cannot
    grow weary of continuing to work wherever it can be done, and of reporting most obediently to the
    Same, by this route, the events which have lately occurred. That Trąbczin and Kaemen have been taken
    by force by the Prusimski family, Your Serene Highness will doubtless already know, and that at present
    nothing of consequence can be done against these one-sided undertakings Your Serene Highness will
    deign to perceive. I have merely had the protestations lodged, in order very much to secure the sum
    registered by me. Whether this will succeed I do not yet venture to assert; indeed I rather believe
    that for the time being everything will be dismissed. The hope that the matter will change as a whole
    and that the present situation will take on quite another shape is the only anchor upon which I alone
    build. The Frau Generalin v. Sanitz, from whom the estates conferred upon her husband have likewise
    been taken, has written herself to the Emperor Napoleon and asked him for a declaration, since he
    only commanded that all, to Wibicki the estate Maniecki be given back, but that everything else be
    left in statu quo. 19 8br. 1807
- page: 2
  en: commanded — the answer in that regard will now serve as the norm in Your Serene Highness's affair
    as well, and as soon as it arrives I too shall draw up the necessary plans for further operation.
    — I go tomorrow again to Memel and perhaps from there with commissions to Petersburg, or wherever
    I shall find the Emperor Alexander. It may easily come about that, through the Grand Duke Constantin,
    to whom I presented the fine set of firearms, I may effect something good in Your Serene Highness's
    affair. Through our Höst I can effect not the least thing in the business. Both the King and the adored
    Queen, with all the Alantons now present there, revere Your Serene Highness in the highest degree
    — but no one can help at this time; nor do I trouble the good monarch at all with matters of this
    kind, for it would, since he truly loves and esteems Your Serene Highness, only increase his sorrow.
    But if I am so fortunate as to come near Allerwürcke, or also to your Konstantin, then I shall exert
    everything so that these shall help; and I believe that it will only succeed in finding means whereby
    the affair shall be given such a turn that all the Poles shall have their sons opened up, should it
    please them to stretch out their claws after Your Serene Highness's property any further. May Heaven
    only grant that Your Serene Highness soon return. With unbounded faithful attachment and the deepest
    esteem I remain, until death, Your Most Serene Highness's most humble and most faithfully obedient
    servant. Breslau, the 19th 8br. 1807. Peter

segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    Whether this letter will share the fate of all the preceding ones I leave undecided; out of faithful
    attachment to Your Most Serene Highness I cannot grow weary of working on wherever it may be done,
    and of reporting most obediently to Your Highness by this route the events that have lately occurred.


    That Trąbczyn and Kaemen have been taken by force by the Prusimski family Your Serene Highness will
    doubtless already know, and that at present nothing of consequence can be done against these one-sided
    undertakings Your Serene Highness will be pleased to perceive. I have merely had the protests entered,
    in order much to secure the sum registered by me. Whether this will succeed I do not yet venture to
    assert; indeed I rather believe that for the present everything will be dismissed. The hope that the
    matter will change as a whole and that the [uncertain: violent] situation will take on a quite different
    shape is the only [uncertain: anchor] upon which I alone build. The wife of General von Sanitz, from
    whom too the estates conferred upon her husband have been taken, has herself written to the Emperor
    Napoleon and asked him for a declaration, since he only [commanded] all, to give back to Wibicki the
    estate of Maniecki, but to leave everything else in statu quo


    19 October 1807'

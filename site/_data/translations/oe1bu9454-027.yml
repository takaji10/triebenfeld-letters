- page: 2
  en: 'ordered; the answer in that matter will now serve as the norm in Your Serene Highness''s case as
    well, and as soon as it comes I too shall draw up the necessary plans for further operation — I go
    again tomorrow to Memel, and perhaps from there with commissions to Petersburg, or wherever I shall
    find the Emperor Alexander. It may easily happen that through the Grand Duke Constantin, to whom I
    have presented the fine set of firearms, I may effect something good in Your Serene Highness''s cause.
    Through our [uncertain: Höst] I can effect not the least thing in the business. Both the King and
    the adored Queen, with all the [uncertain: Alantons] now present there, revere Your Serene Highness
    in the highest degree — but no one is able to help at this time — nor do I trouble the good monarch
    at all with matters of this kind, for, since he truly loves and esteems Your Serene Highness, it would
    only increase his grief. [uncertain: Bei] I, however, so fortunate as to come near to Alexander or
    also to [uncertain: Ihre] Constantin, then I shall exert everything so that these shall help, and
    I believe that it will only succeed in finding means whereby such a turn shall be given to the affair
    that all the Poles shall their sons [uncertain: erschloßen], should it please them to stretch out
    their claws further after Your Serene Highness''s property.


    May Heaven but grant that Your Serene Highness soon return. With boundless faithful attachment and
    the deepest respect I remain, until death,


    Your Most Serene Highness''s


    Wrocław, the 19th of October


    1807


    most faithful and obedient servant


    Peter'

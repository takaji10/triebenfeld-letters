- page: 2
  en: 'commanded; the answer in that matter will now serve as the norm in Your Serene Highness''s case
    as well, and as soon as it comes I too shall draw up the necessary plans for further operation. —
    I go tomorrow again to Memel and perhaps from there with commissions to Petersburg, or wherever I
    shall find the Emperor Alexander. It may easily happen that through the Grand Duke Constantine, to
    whom I made a present of the fine set of firearms, I may effect something good in Your Serene Highness''s
    cause. Through our own [uncertain: court] I can effect not the least thing in the affair. Both the
    King and the adored Queen, with all the [uncertain: attendants] now present there, revere Your Serene
    Highness in the highest degree — but no one can help at this time. Nor do I trouble the good monarch
    at all with matters of this kind, for, since he truly loves and esteems Your Serene Highness, it would
    only increase his sorrow. But if I am so fortunate as to [illegible] or also to come near to His Constantine,
    then I shall bend every effort that these should help; and I believe that it will only succeed to
    find means whereby such a [illegible] may be given to the matter that all the Poles shall [uncertain:
    be made to open] their [uncertain: sons], should they take a fancy to stretch out their claws further
    after Your Serene Highness''s property.


    May Heaven only grant that Your Serene Highness soon return. With boundless faithful attachment and
    the deepest respect I remain, until death,


    Your Most Serene Highness''s


    [illegible]


    most faithful and obedient servant


    Breslau, the 19th October


    1807


    Peter'

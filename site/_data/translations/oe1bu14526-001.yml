- page: 1
  en: 'I take the liberty of adding an urgent request to the enclosed [uncertain: Abten] upon their being
    handed over to Herr Criminal [Councillor?] in Grimm, namely that he might himself speak with him upon
    the following circumstance.


    These Wittowes [uncertain: Ahten] have long been sought in the Trąbczyn registry, where I myself supposed
    and maintained [them to be]. But such were, upon my moving out


    that they would be lying there.


    from my lodging at Breßlau to Wilhelmsruh, found among my wife''s papers, because these [uncertain:
    Ahten], at a time when I had been absent from Breschlau, were received by my wife and laid among her
    things for safe keeping, where the papers are never read, and so it was forgotten to deliver them
    to me afterwards.'

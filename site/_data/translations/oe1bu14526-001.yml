segments:
- page: 1
  en: 'I take the liberty of adding a pressing request to the enclosed [uncertain: deeds], upon their
    delivery to Herr Criminal[-Rath] in Grimm, namely that you might yourself speak with him concerning
    the following circumstance.


    These Wittowes files have long been sought in the Trąbczyn registry, where I myself supposed and maintained
    [them to be]. But they were, upon my moving out


    that they would be lying there.


    from my lodging at Breſslau to Wilhelmsruh, found among my wife''s papers, because these deeds were
    received by my wife at a time when I was absent from Breschlau, and were laid among her things for
    safe keeping, where the papers are never read, and so it was forgotten to deliver them to me afterwards.'

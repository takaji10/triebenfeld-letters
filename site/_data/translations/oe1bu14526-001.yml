segments:
- page: 1
  en: 'I permit myself an urgent request, together with the enclosed files, upon their delivery to the
    criminal-court councillor in Grimm, that you yourself might speak with him concerning the following
    circumstance.


    These Witów files have long been sought in the registry at Trąbczyn, where I myself supposed and maintained
    [that they would be lying]. They were, however, upon my moving out


    that they would be lying.


    from my lodgings at Breslau to Wilhelmsruh, found among the papers of my wife, because these files
    were received by my wife at a time when I was absent from Breslau, and were laid for safe keeping
    among her belongings, where the papers are never read, and thus it was forgotten to hand them over
    to me afterwards.'

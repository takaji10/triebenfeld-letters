- page: 1
  en: 'Document no. 1252


    Dobiesław, judge of the lands of Gniezno and Kalisz, 13 November 1346, at Pyzdry; adjudges to the
    church of Gniezno the estates of Stropiszyn and Pępocin against the claims of the brothers Jan and
    Przedpełk, heirs of Trąbczyn, and the estate of Kokanin against the suit of Pietrasz, heir of Rzegocin.


    Gniezno. Archive of the Metropolitan Chapter. Liber privilegiorum of the 15th century, fol. 93v.


    We, Dobiesław, judge of the lands of Gniezno and Kalisz, make known to all and acknowledge to those
    present that, concerning the estates of Stropiszyn and Panpicza, in the presence of the noble men
    Mikołaj, captain of Poland, Maćko of Poznań and Mikołaj of Kalisz, palatines, and of the other witnesses
    written below, we absolve by the tenor of these presents Lord Kiełcz the custodian and the church
    of Gniezno from the claim and suit of the brothers Jan and Przedpełk, heirs of Trąbczyn; and likewise
    the venerable father in Christ and reverend lord, Lord Jarosław, Archbishop of the holy church of
    Gniezno, from the suit and claim of Pietrasz, heir of Rzegocin, for the estate of Kokanin, adjudging
    the said estates to them and imposing perpetual silence on the said heirs concerning them; in witness
    of which our seal is hung on these presents. Done and given at Pyzdry on the feast of St Brice, in
    the year of the Lord one thousand three hundred and forty-six, in the presence of the noble men, the
    palatines Maćko of Poznań and Mikołaj of Kalisz; the castellans Tomisław of Poznań, Zbylut of Gniezno
    and Janusz of Kalisz, and others worthy of trust.


    Tropessino, Stropiszyn. Panpicza, below with the addition: alias Kopydlowo, perhaps Pępocin, or else
    Kopydłowo. Trampczino, Trąbczyn. Stregoczino, Rzegocin. Cokanino, Kokanin.'

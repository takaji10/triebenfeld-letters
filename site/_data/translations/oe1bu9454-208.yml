status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! I have still not been able to set out on the
    journey to Pehlen; the want of money still lays before me at present the only obstacle in my path.
    I hope to remove this shortly, costly though it be, and then I shall travel at once. The prospects
    [uncertain: reckonings] are not bad; indeed I hope the affair will end more brilliantly than it appeared
    at first. A third party, besides Knobelsdorff and Strachwitz, in a man whom Your Serene Highness knows
    very well indeed, and upon whom you would never guess, also means to deceive. Should Heaven let this
    come to pass, then the good fortune would be exceedingly great — For the rest, in Your Serene Highness''s
    affairs I must often drain the cup of sorrows down to the dregs [literally: down to the hooves]. Thus
    these days I was to be distrained on account of the Schlieben matter. I had to suffer that an arrest
    was laid upon my Schwänner lease-monies, which remain to me after the interest, until the matter is
    reopened from Potsdam, according to the promise of General v. Köckritz — in the meanwhile I cannot
    draw a single [illegible] from my estates; notwithstanding this, an execution was sent only for 48
    Rthl 6 g. of costs and they wished to have me distrained; I had scarcely a d of coin in the house;
    in my distress I directed the executor Schoch to the p Lombardini, who drove the man off with the
    declaration that he had not the least thing to pay, either on his own account or on mine, still less
    upon my order, and would never hand over so much as a heller, and — notwithstanding that I begged
    Lombardini in writing to appease Schoch with a mere 3 Rthl. — showed the man the door and back to
    me. This has caused me great [uncertain: pain], and I beg Your Serene Highness to instruct Lombardini
    that he now absolutely pay over the 48 Rthl 6 g to the executor without any demur — I want and wish
    for nothing, only this one thing, that they not brand me'
- page: 2
  en: 'I endure more than I am able to bear; only treatment of this kind I cannot suffer. News here is
    of various sorts, but weighty scenes lie lurking in a very near distance. The King is now manoeuvring
    in and about Potsdam; often it is in the town itself, [uncertain: manoeuvre] accompanied by a mighty
    cannonade, whereby the glaziers are put in good livelihood. From Tuesday until the 6th the manoeuvres
    continue between Berlin and Köpnick — then the King [uncertain: goes] again to Charlottenbourg, where
    he will stay some time and will daily visit the [text lost] the King in [text lost]. Kuralien has
    been staying in Berlin since his return from Paris and gives great [uncertain: banquets] — this is
    not without ground. Labaye, who in Paris offered linen and iron for the contribution still to be paid,
    has not advanced a single step further with it — whether he will negotiate anything good remains to
    be seen. From Dessau onward the Elbe is lined with jägers, likewise from Magdeburg to Hamburg, where
    all ships are stopped and all colonial goods confiscated. According to Breslau gossip, 60000 men of
    the French are to pass in haste through Berlin; whither is still unknown — Some 30 persons have been
    arrested in [uncertain: Stärme] at the requisition of the French envoy, because they had spread the
    report that it would come to a breach between France and Russia. For the rest, matters are beginning
    to limp with the E. M Kalckreuth. One will be lukewarm — one believes that much will shortly be altered
    again. In deepest reverence I remain, until death, Your Most Serene Highness''s most humble and faithful
    servant v Triebenfeld Breslau, the 5th 8br 1810'

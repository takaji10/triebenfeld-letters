- page: 1
  en: '208


    Most Serene Prince


    Most gracious Prince and Lord!


    I have still not been able to set out on the journey to Poland; the want of money remains for the
    present the only obstacle standing in my way. I hope to remove this shortly, costly though it be,
    and then I shall travel at once. The countings-out are not bad; indeed I hope the affair will end
    more brilliantly than it seemed at first. A third party, besides Knobelsdorff and Strachwitz, [uncertain:
    on] the man whom Your Serene Highness knows very well, and upon whom you would never guess, also means
    to deceive. Were Heaven to let this come to pass, then the good fortune would be exceeding great —
    For the rest, in Your Serene Highness''s affairs I must often drain the cup of suffering down to the
    yeasts. Thus in these last days I was to be distrained on account of the Schlieben matter. I had to
    put up with an arrest being laid upon my Świniary lease monies, which remain to me after the interest,
    until the affair, in accordance with the promise of General von Köckritz, shall be [uncertain: reopened]
    from Potsdam — in the meantime I cannot draw a single Pfennig from my estates, and notwithstanding
    this they sent an execution for 48 Rthl. 6 Groschen in costs and wished to have me distrained; I had
    hardly a d of coin in the house, and in my distress I directed the executor Schöck to Lombardini,
    who drove the fellow off with the declaration:


    "That he had not the least to pay either against him or against me, still less upon my order, and
    would never give up a single heller"; and, notwithstanding that I had asked Lombardini in writing
    to pacify Schoch with a mere 3 Rthl., he showed the man the door and back to me. This has caused me
    great [uncertain: pain], and I beg Your Serene Highness to instruct Lombardini that he now absolutely
    pay over the 48 Rthl 6 Groschen to the executor without any demur — I want and wish nothing, only
    that one thing: let them not brand me —'

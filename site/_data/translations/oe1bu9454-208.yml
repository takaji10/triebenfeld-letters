- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    I have still not been able to set out on the journey to Pehlen; the want of money lays before me at
    present the sole remaining obstacle in the way. I hope, costly as it is, nevertheless to remove this
    shortly, and then I shall travel at once. The [uncertain: reckonings] are not bad; indeed I hope the
    matter will end more brilliantly than it seemed at first. A third party, besides Knobelsdorff and
    Strachwitz, a man whom Your Serene Highness knows very well, and upon whom you would never guess,
    also wishes to [uncertain: deceive / take part]. Were Heaven to let this come to pass, then the good
    fortune would be over-great. — For the rest, in Your Serene Highness''s affairs I must often drain
    the cup of suffering down to the dregs. Thus these days I was to be distrained upon on account of
    the Schlieben business. I had to submit to their laying an attachment upon my Schwänner lease monies,
    which remain to me after the interest, until the matter is reopened from Potsdam, according to the
    promise of General von Köckritz — meanwhile I cannot draw a single [uncertain: penny] from my estates,
    and notwithstanding this they sent execution only for 48 Rthl 6 g of costs and wished to have me distrained
    upon; I had scarcely a d of coin in the house, and in my distress I directed the bailiff Schock to
    Mr Lombardini, who drove the man off with the declaration:


    that he had not the least thing to pay, either on his own account or on mine, still less upon my order,
    and would never hand over a heller; and, notwithstanding that I had asked Lombardini in writing to
    appease Schoch with but 3 Rthl., he showed the man the door and back to me.


    This has pained me very much, and I beg Your Serene Highness to instruct Lombardini that he now absolutely
    pay over the 48 Rthl 6 g to the bailiff without any delay — I want and wish for nothing, only this
    one thing, that I not be branded.'

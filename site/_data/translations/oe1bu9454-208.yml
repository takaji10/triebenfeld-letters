- page: 2
  en: 'I endure more than I am able to bear; only treatment of this kind I cannot endure. There is news
    here of various kinds, but weighty events are lurking in the very near distance. The King is now manoeuvring
    in and about Potsdam; often the manoeuvre is in the town itself, accompanied by a tremendous cannonade,
    whereby the glaziers are put in good sustenance. From Tuesday until the 6th the manoeuvres continue
    between Berlin and Köpnick — then the King [uncertain: builds/goes] again to Charlottenbourg, where
    he will stay some time and will daily visit the [uncertain: manoeuvre] which the King [illegible].
    Kuralien has been staying in Berlin since his return from Paris and gives great [uncertain: entertainments]
    — not without reason. Labaye, who in Paris offered linen and iron for the contribution still to be
    paid, has not advanced a single step with it — whether he will negotiate anything good remains to
    be seen.


    From Dessau onward the Elbe is occupied by riflemen, likewise from Magdeburg to Hamburg, where all
    ships are stopped and all colonial goods confiscated. According to Breslau gossip, 60000 French troops
    are to pass hurriedly through Berlin; whither is still unknown. — Some 30 persons have been arrested
    in [uncertain: Stärme] at the requisition of the French envoy, because they had spread the [uncertain:
    report] that it would come to a breach between France and Russia.


    For the rest, matters are beginning to limp with Field Marshal Kalckreuth. One is growing lukewarm.
    It is believed that much will again change shortly. In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    most humble and faithful servant


    von Triebenfeld


    Breslau


    the 5th of October


    1810'

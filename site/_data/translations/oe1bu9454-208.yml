- page: 2
  en: 'I endure more than I am able to bear; only treatment of this kind I cannot endure. Of news there
    is a good deal here, but important events lie lurking in the very near distance — The King is now
    manoeuvring in and about Potsdam; often there is a manoeuvre in the town itself, attended by a mighty
    cannonade, whereby the glaziers are put in good nourishment. From Tuesday until the 6th the manoeuvres
    continue between Berlin and Köpnick — then the King [uncertain: goes] again to Charlottenburg, where
    he will stay some time and will daily visit the [illegible] the King in. Kuralien has been staying
    in Berlin since his return from Paris and gives great [uncertain: entertainments] — and that is not
    without ground — Labaye, who in Paris has offered linen and iron for the contribution still to be
    paid, has not advanced a single step with it — whether he will negotiate anything good remains to
    be seen.


    From Dessau onward the Elbe is lined with [uncertain: tra?g?] riflemen, and likewise from Magdeburg
    to Hamburg, where all ships are stopped and all colonial goods confiscated. According to Wrocław gossip,
    60,000 French troops are to pass in haste through Berlin; whither is still unknown — Some 30 persons
    have been arrested in Berlin at the requisition of the French envoy, because they had spread the saying
    that it would come to a rupture between France and Russia.


    For the rest, matters are beginning to limp with Field Marshal Kalckreuth. People are growing lukewarm
    — it is believed that much will shortly be [uncertain: altered] again.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Wrocław


    the 5th of October


    1810


    most humble and faithful servant


    v Triebenfeld'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    From the enclosure Your Serene Highness will be pleased to gather what I have written to His Serene
    Highness the Prince State Chancellor, upon presenting the von Kircheisen correspondence, and what
    I have called to his remembrance. The Court Councillor ß handed it to the Prince (since for sad reasons
    I cannot go out); His Serene Highness received it graciously, and in the most benevolent tone promised
    every good thing. Now it lies in the hands of the Privy Councillor of State Stägemann. B: holds Cosmar''s
    fall, and for the time being the granting of the loan, to be as good as settled. — As to Trąbczyn
    I am beginning to grow very anxious; for if the district in which the estates lie really falls to
    Russia, then it looks bad, for there the petticoats, which are already at work here, are all-powerful
    — the Emperor is said to have expressed himself already — the post and commission at that time managed
    their business more cleverly than the Prussian governments. — What is one to expect there? Meanwhile
    one counts upon Prince Hardenberg — he does not let himself be disconcerted — he says, if they will
    not give the Prince his estates back, then he must be compensated. — For the rest I have as yet no
    permission from the Prince to apply to the Russian authorities concerning Trąbczyn — yet the Prince
    sees further than all the swindlers. — Minister Humboldt and the Privy Councillor of State Beugelin
    would, for me, as truly upright men. For the rest Constantine rages frightfully in Poland; the country
    is being sucked quite dry, and every male creature that can so much as bear a weapon is put into rank
    and file. — To this may be added his proclamation that the Poles should hold together and assert their
    independence. — In what humour this puts our King, Your Serene Highness can easily decipher. Everything
    here speaks of war — God avert it — I wish only that Your'

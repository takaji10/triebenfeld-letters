- page: 2
  en: 'Your Serene Highness''s affairs might first of all be brought to an end here, so that the business
    does not again lie idle through a war that may break out suddenly. Already one after another is beginning
    to disperse. Tomorrow the Queen of Bavaria and the Grand Duke of Baden depart, and in a few days the
    King of Bavaria follows; on the 17th of February the [uncertain: Küstl.] Emperor also goes home /
    presumably by way of Warsaw / and then, if not sooner, the eternal Congress will surely be at an end.
    — I shall / as soon as I am put into another condition / keep watch on the antechambers most carefully,
    so that I may only see Cosmar overthrown and the entailed estates placed under administration — the
    rest will then all find itself, and that will quite certainly happen. For Count Pourtalès''s answer
    I wait, together with B[arbe], most longingly. — This too [uncertain: auß / must] be brought into
    the clear and settled before my [uncertain: Lerm] arises. — The cabals of Prince Metternich and of
    the Duke of Benevento (Talleyrand) are boundless, and it will be a miracle of God if everything ends
    happily and quietly. —


    With boundless veneration I am


    Your Most Serene Highness''s


    Vienna, the 30th of January


    1815.


    faithful and most obedient servant


    von Triebenfeld'

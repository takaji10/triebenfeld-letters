- page: 1
  en: '269


    Most Serene Prince


    Most gracious Prince and Lord!


    From the enclosure Your Serene Highness will graciously be pleased to gather what I have written to
    His Serene Highness the Prince State Chancellor, on presenting the von Kircheisen correspondence,
    and what I have brought to his remembrance. — Court Councillor B[arbe] handed it to the Prince (since
    for sad reasons I cannot go out); Fr[?] Serene Highness received it graciously, and in the most well-meaning
    tone promised everything good. Now it lies in the hands of the Privy State Councillor Stägemann. —
    B[arbe] holds Cosmar''s fall, and [uncertain: Zeitwurf] the granting of the loan, to be settled. —
    As regards Trąbczyn I am beginning to grow very anxious, for if the district in which the estates
    actually lie falls to Russia, then things look bad, for there the petticoats, which are already at
    work here, can do anything. — The Emperor is said to have already declared himself: the Polish commission
    had at that time managed its business more cleverly than the Prussian governments. — What is there
    to be expected in that case? Meanwhile one counts on Prince Hardenberg — who [uncertain: Last / lets
    himself] not be disconcerted — who says that if they should be unwilling to give the estates back
    to the Prince, then he must be compensated. — For the rest, I still have no permission from the Prince
    to apply to the Russian authorities concerning Trąbczyn — the Prince, however, now sees further than
    all the swindlers. — Minister Wilhelm von Humboldt and Privy State Councillor Beguelin would [text
    lost] for me as truly upright men. — For the rest, Constantin rages frightfully in Poland; the country
    is being sucked entirely dry, and every male creature that can so much as bear a weapon is put into
    the ranks. — To this comes his proclamation that the Poles should hold together and assert their independence.
    — In what mood this puts our King, Your Serene Highness may easily decipher. — Everyone here speaks
    of war — may God prevent it. — I wish only that'

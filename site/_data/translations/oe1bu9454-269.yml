- page: 2
  en: 'Your Serene Highness''s affairs might first of all be brought to an end here, so that the business
    may not again be left lying through a war that may perhaps break out suddenly. Already one after another
    is beginning to disperse. Tomorrow the Queen of Baum and the Grand Duke of Baden depart, and in a
    few days the King of Bavaria follows. On the 17th of February the [uncertain: Russian] Emperor also
    goes home (presumably by way of Warsaw), and then, if not sooner, the eternal Congress will surely
    be at an end. I shall (as soon as I am put into another condition) keep watch very carefully in the
    antechambers, so that I may only see Cosmar overthrown and the entailed estates placed under administration.
    — The rest will then all sort itself out — and that will most certainly happen. I await the answer
    of Count Pourtales with B: most longingly. This too, before my uproar arises, brought into the clear
    and settled. The intrigues of Prince Metternich and of the Duke of Ben[illegible]rat (Talleyrand)
    are without bounds, and it will be a miracle of God if all ends happily and quietly.


    With unbounded reverence I am


    Your Most Serene Highness''s


    Vienna, the 30th of January


    1815.


    faithful and most obedient servant v Triebenfeld'

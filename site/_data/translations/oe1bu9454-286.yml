- page: 3
  en: '286 a)


    Pro Memoria. The most highly blessed King in 1796 conferred upon the Prince of Hohenlohe the Kaemener
    and Trąbczyn estates, which had fallen to the treasury after the absconded Starosta Prussiemski, on
    [illegible] terms. The said Prussiemski had, however, pledged the Kaemener estates to a certain von
    Broniewski for 80000 Rthl and the Trąbczyn ones to von Chełmski for 36000 ducats. A taking of possession
    of these estates on the Prince''s part was now as little conceivable as the drawing of a revenue —
    by course of law everything had first to be sued for and decided — the suit on that head was not concluded
    by 1804; the Prince found himself compelled, in order to be able once to call the estates his own,
    to conclude a compromise with Broniewski and to pay him 55000 Rthl to stand off. The costs of the
    suit amounted to 6000. This amounts to — 61000 Rthl. From Midsummer 1805 until Midsummer 1807 the
    Prince therefore possessed the estates only, during which time he sold the same to the bank director
    Leixner. In 1807, however, the Polish treasury, and indeed 14 weeks after the Peace of Tilsit, took
    the estates from him by force. During these 8 years, while the daughter of Prussiemski possessed the
    estates, there are due to the Prince the interest on the foregoing 61000 Rthl, and this amounts to
    24400 Rthl. The Prince''s cash claim upon the Kaemener estates accordingly amounts to 85400 Rthl.
    During the period of the Prince''s possession he had the estates judicially assessed; the assessment
    came out at —


    180000 Rthl. From this, deducting the 55000 Rthl brought into account above,


    there remains a surplus value of


    125000 Rthl. This surplus value, however, now belongs, together with the 8 years'' yield of the estates,
    to the bank director Leixner as purchaser of the same. The 85400 Rthl of so-called pledge-money belong
    to the Prince solely and alone — the Jew Meyer Bernhard [uncertain: had with him the money]; the Prince
    gave for it a mortgage upon Winniec etc., which estates the said Meyer Bernhard has to this day held
    in pledge. As concerns the Trąbczyn estates, these too were assessed at — 316000 Rthl — upon which
    the Prince contracted debts


    1. from Lichnowski 70000


    2. from Weigel 30000


    3. from Grotowski 20000


    4. from Zerboni 10000


    5. [uncertain: Mann Ge Seher Thos] 8000. On these the Prince paid to Lichnowski 32000


    to Weigel


    30000. There therefore remains owing, to be brought into deduction, 76000 Rthl. The net true value
    of these estates accordingly amounts to 240000 Rthl. The Prince had to [uncertain: let] these estates
    [uncertain: belong] at 12100 Rthl; this made, from 1806 to 1815 — 108900 Rthl. Hereafter, whether
    the interest on 76000 Rthl at 34200 be so reckoned, the revenues withheld from the Prince for 9 years
    amount to 74700 Rthl


    Sum 390100 Rthl, which are now to be made good to the Prince of Hohenlohe either in cash or by means
    of estates.


    v. Triebenfeld'

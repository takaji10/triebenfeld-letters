- page: 4
  en: 'The 14th of April. Now the French history begins already to grow very [uncertain: guilty]. Napoleon
    has been proclaimed Emperor by the whole country and people; the English declare that they will not
    meddle in the internal affairs of France — so Napoleon will no doubt remain Emperor — the Russians
    are indeed drawing nearer, but — they are made to march criss-cross to no purpose — they are only
    to eat their fill in Germany and lay everything waste. It goes the same way with the [uncertain: O—n]
    troops; these move very ponderously, for there everything is wanting — the English seem to have set
    the whole affair in motion and remain standing quite at a distance — Saxony is as little to be trusted
    as [uncertain: Poland] — in the end the Prussians, with the Dutch, the Hessians, the small states
    etc., are left standing quite alone, and the two Emperors will demand that these should first fetch
    the chestnuts out of the fire so that they may eat them. Napoleon will put himself into communication
    with Murat or Italy and, if possible, take the combined forces in the flank and in the rear; these
    must now face him, while he sends his confederates in haste with several bands toward the Netherlands
    — and where are men to be got in haste, to ward off disasters —?


    A madder piece has not occurred since the founding of the world. Here indeed there appear, in secret,
    quite execrable lampoons; I fear that His Highness will vex himself to death, or will one way or another
    go under.'

- page: 2
  en: 'generosity has made everything thick-skinned and has spoiled much — one also doubts whether men,
    after the previous treatment, will set to it again with such glad courage. In Poland things already
    look motley; the beasts are already letting their joy over Napoleon''s reappearance be heard aloud,
    and are already dancing on their heads instead of on their legs — [uncertain: Maxalles] meanwhile
    may go as it will; my only wish is only that Your Serene Highness read the Cosmar and [illegible]
    the whole of the entailed estates; the rest will find itself. For the rest, if I were in Your Serene
    Highness''s place, I should just now know very well what I would do. I would take merely the 98714
    Rthl and say to the King and Emperor, they have disposed of my property. — This must be made good
    to me. It amounts to 367164 Rthl, [uncertain: gestett] the foregoing court; let the Lord Emperor and
    King keep these, and let me be given a receipt for the Courland debt as also for the 35000 Rthl, and
    let my property at once be made clean and clear to me. My son may be content in the meantime with
    the Hohenlohe estates. The [uncertain: Canz] princesses stand in very high favour with both lords.
    I fall silent in reverence, and I remain, until death,


    Your Serene Highness''s — N. B. Is it not possible that Eberhardt could come here? I beg for the most
    expeditious answer of all and for several


    blank forms. The upright privy councillor of state Beugelin wished to have a letter from Your Serene
    Highness, so that he might be effective in the one matter. I asked for [uncertain: Er: Blan:]; this
    was written, and here is his answer; this is a [uncertain: brown] man who now does not let go. Vienna,
    the 31st of March


    1815.


    faithful and obedient servant


    v. Triebenfeld'

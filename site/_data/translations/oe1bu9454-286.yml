- page: 4
  en: 'The 1st of April. Now the French history begins to become very [uncertain: culpable] — Napoleon
    has been proclaimed Emperor by the whole country, indeed by the [uncertain: people] — the English
    declare that they will not meddle in the internal French affairs — So Napoleon will probably remain
    Emperor — the Russians are indeed drawing nearer, but — Crosswise wage-marches are being made for
    me — let them only eat themselves out in Germany and lay everything waste — [uncertain: Heirs] it
    goes likewise with the O___ troops; these move very ponderously, for there everything is wanting —
    the English appear to have set the whole affair in train and remain standing quite at a distance —
    Saxony is as little to be trusted as Poland — in the end the Prussians, with the Dutch and Hessians
    and the small ones etc., will be left standing quite alone, and the two Emperors will demand that
    these should first fetch the chestnuts out of the fire so that they may be able to eat their fill.
    Napoleon will put himself in [uncertain: lower] communication with Murat or Italy and, so far as possible,
    take the combined forces in the flank and in the rear; these must now move against him, while he sends
    his accomplices in haste with several bands toward the Netherlands — and whence are men to come in
    haste there, to ward off disasters —?


    A madder piece has not yet occurred since the laying-out of the world; here there appear / though
    in secret / already quite accursed lampoons; I fear that Prince Hardenberg will vex himself to death,
    or one way or another will succumb —'

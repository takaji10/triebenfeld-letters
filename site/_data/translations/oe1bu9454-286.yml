- page: 2
  en: 'generosity have made everything thick-skinned and spoiled much — and one doubts, too, whether people,
    after the previous treatment, will go at it again with so cheerful a spirit. In Poland things already
    look motley; the beasts are already letting their joy at Napoleon''s reappearance be heard aloud,
    and dance already on their heads instead of on their legs — [uncertain: Magalles] meanwhile let things
    go as they will; my only wish is only that Your Serene Highness [uncertain: gelesen] Cosmar and be
    called lord of all the entailed estates; the rest will find itself — For the rest, were I now in Your
    Serene Highness''s place, I should know very well what I would do: "I would take merely the 98714
    Rthl and say to the King and Emperor, you have disposed of my property. — This must be made good to
    me — It amounts to 367164 Rthl [uncertain: gestett]; before the foregoing court let the Emperor and
    King keep these, and let me be given a receipt for the Courland debt as also for the 35000 Rthl, and
    let my property be made clean and clear to me at once — My son may meanwhile content himself with
    the Hohenlohe estates. The [uncertain: Canz] princesses stand in very high favour with both gentlemen
    —" I fall silent in reverence, and I remain, until death,


    Your Serene Highness''s — P.S. Is it not possible that Eberhard could come here? I beg for the most
    speedy answer and for several


    blank sheets — N.B. the upright Privy Councillor of State Beguelin wished to have a letter from Your
    Serene Highness, so that he might be effective in the one matter. On [uncertain: Er:] blank sheets
    this was written, and here is his answer; this is a worthy man, who now will not let go. Vienna, the
    31st of March


    1815.


    faithful and obedient servant


    v Triebenfeld'

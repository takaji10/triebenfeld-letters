  en: '286


    Most Serene Prince,


    Most gracious Lord!


    The present epoch will surely remain the most remarkable in the annals of the world, and whatever
    may also come to pass will only ever be a consequence of it — What I fear is that the sovereigns will
    everywhere come too late. For Napoleon stands today almost at the Rhine, and the Austrians, [uncertain:
    Russians] etc., are only now beginning to negotiate travel monies — Wellington departed only yesterday,
    and will draw together the English or Hanoverian troops — Only our troops are being pushed forward,
    and were these to be beaten, then God help us, for the parvenu has already over 200000 men assembled
    — It is [uncertain: shameful] that such a thing could happen under the eyes of all the sovereigns,
    and it is grievous that one still holds one''s peace of so little worth — On the 7th of April the
    Russian troops pass through Prague — thither the monarchs will go and then return here — but when
    would [uncertain: we] come to the Rhine? The war is therefore as good as fully declared. — Napoleon
    is away from Paris, hastening toward the Rhine; Ney has gone with a strong corps toward Switzerland,
    and at present one corps after another is being formed by Napoleon, so that one will not know whither
    one should first turn — that amid all these confusions little can be effected here, Your Serene Highness
    may easily judge — Prince Hardenberg promises henceforth to do everything — but Mr von Stägemann thinks
    and acts as it pleases him — Something will nevertheless happen before one departs from here and goes
    to the army. And since the two [uncertain: gentlemen] have given the Polish estates back to the Prusimska,
    I have submitted the accompanying Pro Memoria / which meanwhile is well worked out / — upon which
    I await the decision — Dismissed, Your Serene Highness cannot [uncertain: would] be with it. General
    Amstetten is the only one who has good will — and he assures that you must be compensated by estates
    — For the rest, everything seems to wish to [uncertain: win] another shape, for nothing is more changeable
    than the fortune of war — the snail-shaped course of all business through 7 months, and the butter-soft
    pliancy and most wrongly applied'

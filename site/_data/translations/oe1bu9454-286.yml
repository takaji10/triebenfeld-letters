- page: 3
  en: '286 a)


    Pro Memoria. In 1796 the late King of blessed memory granted to the Prince of Hohenlohe the Kamionna
    and Trąbczyn estates, which had [text lost] to the Treasury after the fled elder Prusimski. But Prusimski
    had pledged the Kamionna estates to a certain von Broniewski for 80000 Rthl, and the Trąbczyn estates
    to von Chełmski for 36000 ducats. Any maturing of possession of these estates, on the Prince''s part,
    was thus as [uncertain: Frörmig] as the drawing of any revenues was thinkable — By way of law everything
    had first to be sought out and [uncertain: decided] — The suit thereon was not concluded for me in
    1804; the Prince found himself obliged, in order to be able to call the estates his own at last, to
    conclude a settlement with Broniewski and to pay him 55000 Rthl in composition. The costs of the suit
    amounted to 6000 Rthl. This amounts to — 61000 Rthl.


    From Midsummer 1805 to Midsummer 1807 the Prince thus possessed the estates only, during which time
    he sold the same to the bank director Leixner. In 1807, however, the Polish Treasury took the estates
    from him by force, and that 14 weeks after the Peace of Tilsit. During these 8 years, while Prusimski''s
    daughter possessed the estates, there were due to the Prince the interest on the foregoing 65000 Rthl,
    and this amounts to 24400 Rthl. The Prince''s claim in cash from the Kamionna estates accordingly
    amounts to 85400 Rthl. During the Prince''s time of possession he had the estates judicially assessed;
    the assessment came out at — 180000 Rthl. Deducting from this the 55000 Rthl brought into account
    above, there remains an excess value of 125000 Rthl.


    This excess value, however, now belongs, together with the 8 years'' yield of the estates, to the
    bank director Leixner as purchaser of the same. The 85400 Rthl of so-called pledge money belong to
    the Prince alone and solely — the Jew Meyer Bernhard [illegible] with him the gulden; the Prince gave
    for it a mortgage on Wieniec etc., which estates the said Meyer Bernhard has until now held in pledge.
    As regards the Trąbczyn estates, these too were assessed at 316000 Rthl — upon which the Prince contracted
    debts


    1. from Lichnowski 70000 Rthl.


    2. from Weigel 30000 Rthl.


    3. from Grotowski 20000 Rthl.


    4. from Zerboni 10000 Rthl.


    5. [uncertain: Mann Ge. Seher Thos] 8000 Rthl. On these the Prince paid to Lichnowski 32000 Rthl,
    to Weigel 30000 Rthl.


    There thus remains owing, to be brought into deduction, 76000 Rthl. The clean true value of these
    estates accordingly amounts to 240000 Rthl. The Prince had to [text lost] these estates at 12100 Rthl;
    this did from 1806 to 1815 — 108900 Rthl. Hereupon[?], whether the interest on 76000 Rthl at 34200
    Rthl so amount, the 9 years'' revenues withheld from the Prince 74700 Rthl. Total 390100 Rthl.


    which are now to be made good to the Prince of Hohenlohe either in cash or by estates.


    v Triebenfeld'

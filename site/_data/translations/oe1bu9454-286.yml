- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    The present epoch will no doubt remain the most remarkable in the annals of the world, and whatever
    also also comes to pass will only ever be a consequence of it. I am bound to fear that the sovereigns
    will everywhere come too late. For Napoleon stands today almost at the Rhine, and the Austrians, [uncertain:
    Huße] etc. are only beginning to negotiate travel monies — Wellington departed only yesterday, and
    will draw together the English or Hanoverian troops — Only our troops are being pushed forward, and
    were these to be beaten, then God help us, the parvenu has already more than 200000 men assembled.
    Shameful it is that such a thing could come to pass before the eyes of all the sovereigns, and grievous
    it is that one still holds one''s peace so cheaply. On the 7th of April the Russian troops pass through
    Prague — thither the monarchs will go and then return here — but when would they come to the Rhine?
    The war is thus as good as fully declared. — Napoleon is away from Paris, hastening toward the Rhine;
    Ney has gone with a strong corps toward Switzerland, and at present one corps after another is being
    formed by Napoleon, so that one will not know whither to turn first.


    That amid all these confusions little can be effected here, Your Serene Highness may readily judge.
    Prince Hardenberg promises henceforth to do everything. Herr von Stägemann, however, thinks and acts
    as it pleases him.


    Something will nevertheless happen before one departs hence and goes to the army. And since the two
    [illegible] of the Prusimska have given back the Polish estates, I have submitted the accompanying
    Pro Memoria (which is meanwhile well worked out) — upon which I await the decision — Your Serene Highness
    could not be dismissed with it. General Amstetten is the only one who has good will — and he assures
    that you must be compensated by means of estates.


    For the rest, everything seems to want to take on another shape, for nothing is more changeable than
    the fortune of war — the snail-like course of all business through 7 months, and the butter-soft yielding
    and most wrongly applied'

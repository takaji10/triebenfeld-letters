- page: 1
  en: 'From Kalisz, 5 December. At Trąbczyn, five miles from Kalisz, on the hereditary estate of the Honourable
    Prusimski family, the funeral of the late Honourable Paweł Prusimski, Chamberlain of His Royal Majesty,
    was held, with a large attendance of related houses, of the secular [uncertain: clergy] and of the
    Cistercian Fathers of the convent of Ląd. The Reverend Głowiecki, Abbot of Ląd, had been invited to
    sing the High Mass, but an unexpected frost prevented his crossing the river Warta. The sermon was
    preached by the Reverend Prefect of the schools of the College of the Society of Jesus at Kalisz.
    The funeral oration after the procession was given by the Honourable Antoni Prusimski, his own nephew.
    In the monasteries nearby, namely at Pyzdry, Konin and Kaźmierz, at the order of Her Grace Katarzyna
    Prusimska, born Rozdrażewska, his widow, exequies were held on the same day, with vigils and many
    Masses, for lack of room in the parish church of Trąbczyn.'

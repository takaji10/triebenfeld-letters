- page: 1
  en: 'I let you know as I leave, my dear Schmidt, that yesterday I read my memorandum on the Weigel &
    Eisenhardt affair to the Council, & that it was unanimously recognised there that payment must be
    made. — How? That is what will be deliberated.


    M[ohrenheim]'

- page: 2
  en: 'May Your Serene Highness deign to let me know your first intention as to your will by this express
    messenger: whether you wish the estates to be preserved for yourself and your descendants alone.


    Should this be the case, then I press — since the present laws are more favourable to the estate proprietor
    than the Prussian ones are — for the annulment of the Hollanders or colonists. This can take at most
    2 months, and then I have the judgment; and in the meantime the matter concerning the Olesnica swindlers
    and concerning the Wrąbczyn people must also be decided. Concerning the arrears a great number of
    lawsuits are pending, but I doubt that much will flow into Your Serene Highness''s treasury. Everyone
    declares himself insolvent. — At bottom the distress is very great, and the want of money general.
    Most of what I now have to deal with is with Hecker and this whole brood. Hecker continually incites
    the subjects, together with Hawich; wherefore I most humbly beg that a judicial power of attorney
    be issued for the advocate of the justice-of-the-peace court, Schmid, at Kalisz, according to the
    enclosed form, so that he may at last make a clean sweep of the rabble. This is very urgently necessary,
    so that by the swiftest [uncertain: Fatharium] — which, however, must be done through a third party
    — I may the more quickly reach the goal of my wishes. From a review of the Honrichs and Hecker accounts,
    and of all of them, everything will come to light. May Your Serene Highness deign to write to Hecker
    with your own hand according to the enclosed draft. For I, standing as I do in litigation with the
    villain,'

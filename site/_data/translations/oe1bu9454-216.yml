    rightly upon them. In deepest reverence I remain, until death, Your Most Serene Highness''s Blizanow


    the 29th of July 1811.


    May Your Serene Highness have the messenger paid; he receives 6 gg per mile. I gave him 1 Rthl for
    the road. most humble and obedient servant v. Triebenfeld'

- page: 1
  en: '216


    Most Serene Prince,


    Most gracious Prince and Lord!


    In all probability, and particularly according to the assurances of several magnates, every private
    debt, as well as the so-called Bayonne sums (that is to say, bank, invalid and pupil moneys), will
    be dealt with and made subject to the 41 3/4-year moratorium. Concerning the bank and invalid sum
    Your Most Serene Highness already has the documents in hand, and perhaps I shall be so fortunate as
    to lay before Your Highness''s feet, shortly, a like document concerning the Weigel 50/m Rthl. In
    this manner there rests upon the whole of the estates 200000 Rthl, which in 41¾ years, at 6 pCt.,
    would be amortised as to both capital and interest. The estates are now much [uncertain: worth], and
    the debt resting upon them is converted into a life annuity — Now it is urgently necessary that Your
    Serene Highness tell me much, whether you wish to keep the estates or to exchange them? Should you
    wish to keep the estates, then, in order to obtain secure revenues, I must have the Hollanders or
    colonists for the greater part chased to the d— by judicial decisions, and form pure demesne farms.
    But if you can or will exchange the estates to advantage, then this may be spared, and one gives out
    the revenues according to the judicial contracts, which serve as the standard for the rental receipts;
    only, in a bargain, a warranty of title can be given upon them —'

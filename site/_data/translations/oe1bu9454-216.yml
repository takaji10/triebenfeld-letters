  en: 'cannot now issue any orders touching the service, and certainly not to B.; at least he would not
    act upon them. In deepest reverence I remain, until death, Your Most Serene Highness''s — Blizanow


    the 29th of July 1811.


    Let Your Serene Highness have the messenger paid; he receives 6 gg per mile. 1 Rthl I have given him
    for the road. — most humble and obedient servant v Triebenfeld'

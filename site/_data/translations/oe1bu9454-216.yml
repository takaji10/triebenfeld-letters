- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    According to all probability, and especially in accordance with the assurances of several magnates,
    every private debt, like the so-called Bayonne sums — that is to say, bond, [uncertain: Jevatiden]
    and wards'' gulden — will be dealt with and made subject to the 41 3/4-year moratorium. Concerning
    the bank and /Invalids'' sum Your Most Serene Highness already has the documents in hand, and perhaps
    I shall be so fortunate as shortly to lay at the feet of the same a like document concerning the Weigel
    50000 Rthl. In this manner there rest upon the whole of the estates 200000 Rthl, which in 41¾ years
    would be amortised at 6 per cent, both as to capital and as to interest. The estates are now worth
    much, and the debt resting upon them has been converted into a life-annuity. — It is now urgently
    necessary that Your Serene Highness tell me much, whether you wish to keep the estates or to exchange
    them. If you wish to keep the estates, then, in order to secure certain revenues, I must for the most
    part have the Hollanders or colonists driven off by judicial decrees to the [uncertain: T], and form
    pure demesne farms. But if you can or will exchange the estates to advantage, then this can be spared,
    and one states the revenues according to the judicial contracts which serve as the norm for the interest
    receipts; only, in the event of a bargain, a warranty of title can be given upon them. —'

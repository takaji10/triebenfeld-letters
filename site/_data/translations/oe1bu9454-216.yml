- page: 2
  en: 'May Your Serene Highness deign to let me know your first will and intention by this express: whether
    you wish the estates to be conserved only for yourself and your descendants.


    Should this be the case, then, since the present laws are more favourable to the estate-owner than
    the Prussian ones are, I press for the annulment of the [uncertain: Bauländer] or [uncertain: ColloMiler].
    This can take two months at most, and then I shall have the judgment; and in the meantime the matter
    of the Oleśnicki swindlers and of the Wrąbczyn people must also be decided. As to the arrears, a mass
    of lawsuits is pending, but I doubt that much will flow into Your Serene Highness''s treasury. Every
    one of them declares himself insolvent. — At bottom the distress is very great and the want of money
    general. I have most to do at present with Hecker and this whole brood. Hecker is continually inciting
    the subjects with the [uncertain: Hawich]; I therefore most humbly beg that a judicial power of attorney
    be issued for the advocate of the court of the peace Schmid at Kalisz, according to the enclosed form,
    so that he may at last make a clean sweep of the rabble. This is very urgently necessary, so that
    by the swiftest [uncertain: Fatharium] — which, however, must be done through a third party — I may
    the more quickly reach the goal of my wishes. From the revision of the Honrichs, Hecker and all the
    accounts, everything will appear. To Hecker may Your Serene Highness deign to write in your own hand
    according to the enclosed draft. For since I stand in litigation with the villain, I'

- page: 2
  en: 'May it please Your Serene Highness to let me know by this express courier your first intention
    of will: whether Your Highness wishes the estates to be preserved only for yourself and your descendants.


    Should this be the case, then I press — since the present laws are more favourable to the estate owner
    than the Prussian ones are — for the annulment of the Hollanders or colonists. This can take at most
    2 months, and then I have the judgment; and meanwhile the matter concerning the Oleśnica swindlers
    and that concerning the Wrąbczyn people must also be decided — Concerning the arrears a great number
    of lawsuits are pending, but I doubt that much will flow into Your Serene Highness''s treasury. Every
    one of them declares himself insolvent — At bottom the distress is very great, and the want of money
    general — Most of what I now have to contend with is with Hecker and this whole brood. Hecker continually
    stirs up the subjects together with Hawich — I therefore most humbly beg that a judicial power of
    attorney be issued for the peace-court advocate Schmid at Kalisz, according to the enclosed form,
    so that he may make a wholly clean sweep with the rabble. This is very urgently necessary, so that
    by the swiftest [illegible] (which, however, must be done through a third party) I may the more quickly
    attain the goal of my wishes — by a review of the Honrichs and Hecker accounts, and of all of them,
    everything will come out. To Hecker, may it please Your Serene Highness to write in your own most
    high hand according to the enclosed draft. For since I stand in a lawsuit with the scoundrel, I'

- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    By all appearances, and especially according to the assurances of several magnates, every private
    debt, as well as the so-called Bayonne sums — that is, Band, Jevatiden and wards'' gulden — will be
    treated alike and made subject to the 41 3/4 year moratorium. Concerning the Bank and /Invalids''
    sum, Your Most Serene Highness already has the documents in hand, and perhaps I shall be so fortunate
    as shortly to lay at the feet of the same a like document concerning the Weigel 50000 Rthl. In this
    manner there rest upon the estates together 200000 Rthl, which in 41¾ years at 6 per cent would be
    amortised as to both capital and interest. The estates are now worth a great deal, and the debt resting
    upon them has been converted into a life annuity. — It is now urgently necessary that Your Serene
    Highness tell me much, whether you wish to keep the estates or to exchange them. If you wish to keep
    the estates, then, in order to obtain secure revenues, I must have the Hollanders or colonists for
    the greater part driven out by judicial decrees, and form pure demesne farms. But if you can or will
    exchange the estates to advantage, then this can be spared, and one states the revenues according
    to the judicial contracts, which serve as the standard for the interest receipts; only in that case
    a warranty of title can be given upon a sale. —'

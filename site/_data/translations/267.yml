status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Today is the 27th day since Your Serene Highness
    sent me the last letter, of the 17th of December, by the Neisse messenger, which I received on the
    21st. Since that time I have not seen a single letter [i.e. character] from Your Serene Highness.
    In vain do I hope for the letter to the Prince Chancellor, for the blank forms, likewise the power
    of attorney for the Privy Councillor v. Goeschel — further for the written undertaking for ß concerning
    Koschentin, and for money — B can give nothing further, and I must, as surely as there is a God, [uncertain:
    hang / go hungry]. What troubles me most of all is that I neither see nor hear anything from Brieg.
    If only the report came in as wished, then all would already be won — as though forged in fetters
    I must sit here in vain and wait, with fear and trembling, upon news from that quarter alone; had
    I in the meantime received the papers mentioned above, I could to some degree have worked on in this
    matter and in that, but as it is I must lie at anchor in the bay without money and without news, and
    Hungern himself is already beginning to waver and to hold the matter reported to be half untrue, or
    an unpardonable negligence — He says, why does the Prince not send the things by express courier —
    I no longer know at all how I am to cloak the business. If, however, Your Serene Highness did indeed
    dispatch the above letter to me on the 18th of December and the money on the 25th, and has also sent
    further letters hither, then let the way-bills be sent after them with all possible speed, and order
    that these are to be delivered here to me. — For the rest, everything here is still as it was — nothing
    can yet be determined with certainty — England''s over-hasty conclusion of peace with America is causing
    a sensation — It seems that only now does she mean to have the say here at the Congress. Meanwhile
    the East Indian and [uncertain: Persian] affair appears to be becoming dangerous to the English, and
    so they will probably have to adopt a somewhat more subdued tone[?]. Russia, meanwhile, means absolutely
    to press our Lord hard on account of Poland. God knows how this will yet end. Prince Bertenstein Stetten
    has returned from Paris — He had a considerable claim upon France. He went there himself and [uncertain:
    renehirte — unclear verb] with the King, who is having 400000 francs paid out to him — If everything
    here should still go as wished, then Your Serene Highness might also yourself go'
- page: 2
  en: there and negotiate directly with the King of Fr[ance]; I believe the outcome would answer to your
    wishes. The upright Prince Hardenberg has fairly recovered from his somewhat severe indisposition
    — God preserve the noble man — for otherwise the whole machine stands still. Once more I beg for the
    swiftest news of what has been accomplished at Brieg, for the written undertaking, and for money.
    In deepest reverence I remain, until death, Your Serene Highness's Vienna, the 13th of January 1815.
    faithful and obedient servant v Triebenfeld

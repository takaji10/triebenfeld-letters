- page: 2
  en: 'matter may be regarded as as good as concluded. In closing I note further that she has requested
    me to visit her from time to time until she shall receive definite news, whereupon she will explain
    herself more particularly. The Duchess remains here in Vienna and goes this month to Baden to take
    the baths.


    I have the honour to be, with all high esteem,


    Your Right Honourable''s


    Vienna


    the 7th of June 1815.


    most devoted servant


    J[illegible] Bisenti'

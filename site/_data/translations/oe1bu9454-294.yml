segments:
- page: 1
  en: 'Right Honourable Sir!


    Your Right Honourable knows that I have conferred with the Duchess of Sagan concerning her claim of
    30000 Rthl, or 100000 ducats in Gold, of which she speaks constantly; but so long as the Duchess,
    according to the statement she made to me, remains under the delusion, and lives in the certain hope
    grounded on the promise made to her, that His Majesty the King will pay this sum alone, I can for
    the present undertake nothing in this matter, until she is told from higher quarters that His Majesty
    the King does not pay: if this comes about, then, going by her own expressions, I can assure Your
    Right Honourable with confidence that she will readily and willingly come to a settlement, and that
    I believe I can conclude the matter, on the offer made to her of 150000 Rthl, subject to higher ratification.


    Your Right Honourable will therefore have the goodness to direct everything in such a way that the
    [uncertain: Erwinnen] be now told straight out, as the King has already done, that he pays nothing
    whatsoever; then the'

- page: 1
  en: '294


    Right Honourable Sir!


    etc.


    Your Right Honourable knows that I have conferred with the Duchess of Żagań concerning her claim of
    30,000 Rthl, or 100,000 # in Gold, of which she speaks continually; but so long as the Duchess, according
    to the statement she made to me, remains under the delusion, and lives in the certain hope, in consequence
    of the promise made to her, that His Majesty the King will pay this sum alone, I can for the present
    undertake nothing in this matter until she is told from higher quarters that His Majesty the King
    does not pay: if this happens, then, going by her own expressions, I can assure Your Right Honourable
    with confidence that she will gladly and willingly come to a settlement, and that I believe I shall
    conclude the matter, subject to higher ratification, upon the offer made to her of 150,000 Rthl.


    Your Right Honourable will therefore have the goodness to direct everything in such a way that the
    heiresses are now told straight out, as the King has already done, that he pays nothing whatsoever;
    then the'

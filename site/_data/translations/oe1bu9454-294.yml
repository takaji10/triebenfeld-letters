status: draft
segments:
- page: 1
  en: 'Right Honourable Sir! Your Right Honourable knows that I have conferred with the Duchess of Sagan
    concerning her claim of 30000 Rthl, or 100000 ducats in Gold, of which she constantly speaks; but
    so long as the Duchess, according to the statement she made to me, remains in the delusion, and lives
    in the certain hope, in accordance with the promise made to her, that His Majesty the King will pay
    this sum alone, I can for the present undertake nothing in this matter, until she is told from higher
    quarters that His Majesty the King does not pay: if this happens, then, judging from her utterances,
    I can assure Your Right Honourable with confidence that she will gladly and willingly come to a settlement,
    and that, in accordance with the offer made to her of 150000 Rthl, I believe I may conclude the affair
    subject to higher ratification. May Your Right Honourable therefore have the goodness to set everything
    in train, so that now the [uncertain: Erwinnen] be told straight out, as the King has already done,
    that he pays nothing whatsoever; then the'
- page: 2
  en: matter may be regarded as as good as concluded. Finally I note here further that she has requested
    me to visit her from time to time until she receives definite news, whereupon she will declare herself
    more particularly. The Duchess remains here in Vienna and goes this month to Baden to take the baths.
    I who have the honour to be, with all high esteem, Your Right Honourable's — Vienna, the 7 Junij 1815.
    — most devoted servant J[illegible] Bisenti

- page: 2
  en: 'matter may be regarded as good as settled. In closing I further note here that she has requested
    me to visit her from time to time until she receives definite news, whereupon she will declare herself
    more fully. The Duchess remains here in Vienna and goes this month to Banden to take the baths.


    Having the honour to be, with all high esteem,


    Your Right Honourable''s


    Vienna


    the 7th of June 1815.


    most devoted servant


    [uncertain: G/J] Bisenti'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! Through the mediation of the brave General v. Köckritz
    I have the assurance of obtaining the loan from the Invalids'' Fund; how quickly, however, I am not
    yet able to determine. The brave man ran about in person and took every pains. It is unbelievable
    what a shortage of money there is here; the bankers themselves give up to 10 and 12 [uncertain: Erleut
    — perhaps "per cent"] merely to save themselves for as long as the Bank and the Seehandlung do not
    discount. If it succeeds here now, then everything is done — Your Serene Highness surely laughs at
    the threats of the foolish Schlabrendorff woman — It is vexing, to be sure, that one cannot keep one''s
    word at once; her mouth shall soon be stopped in each case, for Pochammer says — if only she receives
    money within this quarter-year, then it is well enough for a long while; he would not lodge any complaint,
    upon that Your Serene Highness might rely. — Pochammer is now very solid, since he knows that the
    Lord General v. K: is himself taking pains for the procuring of the loan'
- page: 2
  en: 'To Giraud and Haupt I shall pay the interest, and have the mortgage ceded to someone who is willing
    to advance the 18000 Rthl for four years, without calling it in, if only the percentages are paid.
    Today the matter of the annual loan was to have come up for report; the brave General wrote on that
    account today, still before the session opened, to the [illegible] of the Military Department, the
    Lord Privy Councillor v. Köchnen. As soon as the request is granted I shall take 60000 Rthl in advance,
    pay here the ten thousand that were taken up, and send Your Serene Highness at once the full 50000
    Rthl, so that you may settle the Schlabrendorff woman and her [uncertain: Frändische Siehe]. In deepest
    reverence I remain, until death, Your Most Serene Highness''s — I have just now written to Homuth
    and assured him that Your Serene Highness will obtain the money from the Invalids'' Fund through the
    help of the Lord General v. Köckritz; therewith I have begged him to set the Countess at ease, and
    to tell her that I stand surety to her that she shall have her money in a short time, and that my
    letter may serve as a document. Berlin, the 22nd of January 1805. most humble and obedient servant
    v Triebenfeld'

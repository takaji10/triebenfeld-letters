- page: 2
  en: 'To Giraud and Haukt I shall pay the interest, and have the mortgage assigned to someone who is
    willing to advance the 18000 Rthl for four years, without calling it in, so long as the interest is
    paid.


    Today the matter of the annual loan was to have come up for report; the [uncertain: Bicke] General
    wrote on that account this very day, before the session opened, to the [uncertain: Incletiarius] of
    the Military Department.


    Privy Councillor von Köchnen. As soon as the petition is granted I shall take 60000 Rthl in advance,
    pay here the ten thousand that were taken, and send Your Serene Highness at once the full 50000 Rthl,
    so that you may settle the Schlabrendorff woman and her [uncertain: Frändische] claim.


    In deepest reverence I remain, until death, Your Most Serene Highness''s. I have this moment written
    to Homuth and assured him that Your Serene Highness will obtain the money from the Invalids'' Fund
    through the help of General von Köckritz; and therewith I have begged him to set the Countess at ease,
    and to tell her that I stand surety to her that she shall have her money within a short time; my letter
    may serve as a document. Berlin, the 22nd of January


    1805.


    most humble and obedient servant


    von Triebenfeld'

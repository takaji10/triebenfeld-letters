segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    Through the mediation of the worthy General von Köckritz I have the promise that the loan from the
    Invalids'' Fund shall be obtained; how quickly, however, I am not yet able to say. The worthy man
    has himself run about everywhere and has taken all possible pains. It is incredible what a want of
    money there is here; the bankers themselves give up to 10 and 12 [uncertain: Erleut] merely to save
    themselves for so long as the Bank and the Maritime Trading Company do not discount. If it succeeds
    here now, then all is done - Your Serene Highness surely laughs at the threats of the foolish Schlabrendorff
    - It is indeed vexing that one cannot keep one''s word at once; each of them is to have her mouth
    stopped presently, for Pochammer says - if only she receives money within this quarter-year it is
    well enough for a long while; he will not lodge any complaint, upon that Your Serene Highness may
    rely. - Pochammer is now very solid, since he knows that the General von K. is himself taking pains
    for the obtaining of the loan'

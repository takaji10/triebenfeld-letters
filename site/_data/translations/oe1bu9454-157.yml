- page: 2
  en: 'To Giraud and Haugt I shall pay the interest, and have the mortgage ceded to someone who is willing
    to advance the 18,000 Rthl for four years, without calling it in, so long as, in any case, the percentages
    are paid.


    Today the matter of the loan was to have come up for presentation; the [uncertain: Bicke] General
    wrote on that account today, even before the session began, to the [uncertain: Incletiarius] of the
    Military Department,


    Privy Councillor von Köehnen. As soon as the request is granted I shall take 60,000 Rthl in advance,
    pay here the ten thousand that were taken up, and send Your Serene Highness at once the full 50/m
    Rthl, so that you may settle the Schlabrendorff woman and your [uncertain: Frändische Siehe].


    In deepest reverence I remain, until death, Your Most Serene Highness''s — I have just now written
    to Homuth and assured him that Your Serene Highness will obtain the money from the Invalids'' Fund
    through the help of General von Köckritz; therewith I have asked him to reassure the Countess, and
    to tell her that I stand surety to her that she would have her money within a short time, and that
    my letter may serve as a document. Berlin, the 22nd of January


    1805.


    most humble and obedient servant


    v Triebenfeld'

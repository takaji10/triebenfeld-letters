- page: 1
  en: '157


    Most Serene Prince


    Most gracious Lord, through the mediation of the upright General von Köckritz I have the assurance
    that the loan from the Invalids'' Fund will be granted; how soon, however, I am not yet able to say.
    The worthy man has himself gone about everywhere and has taken every pains. It is unbelievable what
    a want of money there is here; the bankers themselves give up to 10 and 12 per cent merely to save
    themselves for so long as the Bank and the Maritime Trading Company do not discount.


    If it succeeds here now, then all is done — Your Serene Highness surely laughs at the threats of the
    foolish Schlabrendorff woman — It is vexing, to be sure, that one cannot keep one''s word at once;
    meanwhile her mouth shall indeed be stopped, for Pochammer says — if only she receives money in this
    quarter-year, then it is well enough for a long while; he will not file any complaint, and upon that
    Your Serene Highness may rely. — Pochammer is now very solid, since he knows that General von Köckritz
    is himself taking pains for the obtaining of the loan.'

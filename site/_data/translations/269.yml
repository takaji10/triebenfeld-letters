segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord!


    From the enclosure Your Serene Highness will graciously be pleased to gather what I have written to
    His Serene Highness the Prince State Chancellor, upon presenting the v. Kircheisen correspondence,
    and what I have brought to his remembrance. The Court Councillor ß has delivered it to the Prince
    (since for sad reasons I cannot go out); His Serene Highness received it graciously, and in the most
    benevolent tone conveyed every good assurance. Now it lies in the hands of the Privy Councillor of
    State Stägemann. B: holds Cosmar''s fall, and, in the throw of the times, the granting of the loan,
    to be as good as settled. — On account of Trąbczyn I am beginning to grow very anxious; for if the
    district in which the estates lie should really fall to Russia, the matter looks bad, for there the
    aprons, which are already at work here, can do everything — the Emperor is said to have already expressed
    himself — the post & commission managed their business more shrewdly at that time than the Prussian
    governments did. — What is there to be expected in that case? Meanwhile one counts upon Prince Hardenberg
    — he does not let himself be disconcerted — he says, should they be unwilling to give the Prince the
    estates back, then he must be indemnified. — For the rest, I still have no permission from the Prince
    to apply to Russian authorities in the matter of Trąbczyn — yet the Prince surely sees further in
    this than all the swindlers. — Minister Humboldt and the Privy Councillor of State Beugelin would,
    as truly upright men, for me [text lost]


    For the rest, Constantine is raging fearfully in Poland; the land is being sucked utterly dry, and
    every male creature that can but bear a weapon is put into rank and file. — To this may be added his
    proclamation that the Poles should hold together and assert their independence. — Into what mood this
    puts our King, Your Serene Highness can easily decipher. Everything here speaks of war — God avert
    it — I only wish that Your [text lost]'
- page: 2
  en: 'Your Serene Highness''s affairs might first of all be brought to an end here, so that the matters
    do not again come to a standstill through a war perhaps swiftly breaking out. Already one after another
    is beginning to disperse. Tomorrow the Queen of Baum departs, and the Grand Duke of Baden, and in
    a few days the King of Bavaria follows; on the 17th of February the Russian Emperor also goes home
    (presumably by way of Warsaw), and then, if not sooner, the everlasting Congress will surely be at
    an end. As soon as I am put into another condition, I shall keep watch over the antechambers most
    carefully, so that I may but see Cosmar overthrown and the entailed estates placed under administration
    — the rest will then all fall into place — and that will most certainly come about. For Count Pourtales''s
    answer I wait most longingly with B:; this too [text lost] before any alarm arises, brought into the
    clear and settled. The [uncertain: cabals] of Prince Metternich and of the Duke of Ben[illegible]rat
    (Talleyrand) are without limit, and it will be a miracle of God if all ends happily and quietly.


    With unbounded veneration I am Your Most Serene Highness''s


    Vienna, the 30th of January 1815.


    most faithful and obedient servant

    v Triebenfeld'

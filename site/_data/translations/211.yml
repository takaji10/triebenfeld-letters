segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! Herr von Knobelsdorff was here and has satisfied
    himself as to the locality. It [uncertain: pleased/took shape for] him; I am therefore endeavouring
    now to bring everything into order, so as to arrange it all in such a way that one can survey the
    matter at a glance. The confusion is meanwhile very great, the people obstinate, who are heard from
    the Hawich; often I could go mad. With God I hope to settle everything. As to the lawsuit concerning
    Trąbczyn, it will come to a good end; the term has already stood since the 24th, the matter is still
    not concluded, and it may easily be another 14 days before the decree is read out by the Tribunal.
    If I win here, then all distress shall have an end. H. v Knobelsdorff I hold to be an exceedingly
    upright [text lost] man, who states his holdings only in accordance with the truth, and this shall
    be done on this side as well (if Your Serene Highness leave the conduct of it to me alone) to fetch
    — until the last breath I remain Your Serene Highness''s

    Klein Öhringen, the 29th of November 1810

    most faithful servant

    v Triebenfeld'

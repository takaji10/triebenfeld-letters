segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! I have not been able to raise the money for the redemption
    of the deed, for Wildegansch is ruining all my credit here. Three hundred Rück I have given to the
    friend who arranged the matter, as earnest-money — more I cannot [uncertain: spare] out of my travelling
    money, or else I shall be left stuck here. If it is possible for Your Most Serene Highness, may the
    Same most graciously deign only to send an instruction upon the 240 f., that of some 200 Rthl Courant,
    so that I may redeem the deed. Otherwise an evil turn might come to pass. — The gentlemen Ob. v. K.
    and v. Z. are surely Your Serene Highness''s true friends, and I am likewise certain that all will
    turn out very well. Each is the gossip here now so bad that for the present I only ever [uncertain:
    groan] thus from afar, and in particular, for one person''s sake, I shall keep myself in the background
    and act as coldly as possible. In deepest submission I remain, until death, Your Most Serene Highness''s
    Berlin, 10th Febr. 1801. most faithful servant v Triebenfeld'

- page: 2
  en: 'as upright and judicious men of business. Once I have finished in Koschentin, I shall return to
    Breslau and from there back into the Empire. To leave Silesia without having paid my respects to Your
    Right Honourable is something I could not forgive myself. I therefore most obediently beg the same
    and for permission — to visit you in Trąbczyn and there to pay my attendance. On that account I have
    also already sought gracious permission from His Serene Highness, which I hope to obtain.


    Koschentin will give something to do,'
  names:
  - de: Koschentin
    en: Koschentin
    kind: place
  - de: Breslau

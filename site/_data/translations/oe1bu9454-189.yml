- page: 3
  en: 'for, as one takes the matter, everything there is not in the best order. Should Your Highly Honoured
    Self be pleased to gladden me with a few lines at Koßhentin, I should be very happy. Herlich, whom
    I have with me, commends himself to your grace. I add only the assurance of the most perfect veneration,
    in which I remain always: Your Right Honourable''s, Klein Althammer


    the 19th of July 1806.


    most humble and obedient servant


    A. Hahn'

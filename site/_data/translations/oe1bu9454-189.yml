segments:
- page: 1
  en: Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests. I hereby report to Your
    Right Honourable that the death of the mining councillor Bernhardi has brought upon me the orders
    to travel to Upper Silesia, and to regulate the affairs of this lordship in common with the inspector
    Kreinig and the master of forests Reichmann. I may hope that matters will go better under the direction
    of these men, since both of them are known to me,
  names:

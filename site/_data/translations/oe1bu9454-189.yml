- page: 1
  en: 189. Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests. I hereby report to
    Your Right Honourable that the death of the mining councillor Bernhardi has brought upon me the orders
    to travel to Upper Silesia, and to settle the affairs of this lordship in company with the Inspector
    Krenig and the Master of Forests Reichmann. I may hope that under the direction of these men matters
    will go better, since both of them are known to me

status: draft
segments:
- page: 1
  en: Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests. I hereby report to Your
    Right Honourable that the death of the Mining Councillor Bernhardi has brought upon me the orders
    to travel to Upper Silesia, and to regulate the affairs of this lordship in common with the Herr Inspector
    Kreinig and the Master of Forests Reichmann. I may hope that under the direction of these men it will
    go better, since both of them are known to me
- page: 2
  en: as upright and judicious men of business; once I am finished in Koschentin I shall return to Breslau
    and from there into the Reich. To leave Silesia without having paid my respects to Your Right Honourable
    I could not forgive myself. I therefore beg the same most obediently for permission — to be allowed
    to visit you in Trąbczyn and there to pay my attendance. On that account I have also already sought
    the gracious permission of His Serene Highness, which I hope to obtain. Koschentin will give some
    work to do,
- page: 3
  en: 'for as one takes the matter, not everything there lies in the best order. Should Your High Self
    be pleased to gladden me with a few lines to Koschentin, I should be very happy. Herlich, whom I have
    with me, commends himself to your grace. I add only the assurance of the most perfect veneration in
    [text lost] which I ever am: Your Right Honourable''s, Klein Althammer, the 19th of July 1806. most
    humble and obedient servant A. Hahn'

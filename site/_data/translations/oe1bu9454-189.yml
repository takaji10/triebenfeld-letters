- page: 2
  en: 'as upright and judicious men of business. Once I have finished in Koszęcin I shall return to Wrocław
    and from there into the Reich. To leave Silesia without having paid my respects to Your Right Honourable
    is something I could not forgive myself. I therefore beg the same most obediently and the permission
    — to be allowed to visit you in Trąbczyn and there to pay my attendance. I have on that account also
    already applied to His Serene Highness and gracious permission, which I hope to obtain.


    Koszęcin will give one something to do,'

- page: 3
  en: 'for, as one hears, everything there is not in the best order. Should Your Right Honourable be pleased
    to gladden me with a few lines to Koszęcin, I should be very happy. Herlich, whom I have with me,
    commends himself to your favour. I [uncertain: add] only still the assurance of most perfect veneration,
    in which I ever remain: Your Right Honourable''s, Klein Althammer


    the 19th of July 1806.


    most humble and obedient servant


    A. Hahn'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! That Your Most Serene Highness has escaped with
    life and out of the most dreadful danger I learn from a letter of Secretary Koppe. My distress on
    that account was boundless, the more so as so many malicious rumours were spread abroad, which gave
    the matter a million times worse a colour than it in fact now is. I lived in the hope that all must
    go happily. I was on the point of travelling to Your Serene Highness, and to that end had begged 8000
    Rthl of His Excellency the Minister von Stein upon a Kontopp mortgage, since at present it is hard
    to obtain even 10 Rthl out of South Prussia. When all at once the news of the defeat of our army [uncertain:
    einigung]. My sole endeavour now was to learn whither Your Serene Highness had turned. The Rittmeister
    v Dorville assured me that Your Serene Highness had gone to Silesia. The very same was averred by
    the President of the General Post Office, v. Secqebarth, with the addition that Your Serene Highness
    had gone with few people towards Sagan. I therefore had an order to pay of 6000 Rthl made out upon
    Breslau and took 2000 Rthl in Treasury notes, and hastened with them to that corner of the country,
    where I then saw myself wholly deceived – full of distress I went'
- page: 2
  en: 'to Breslau and was just deliberating with Hahn what was to be done, when I received the express
    courier from Secretary Koppe out of Stettin. My joy was now greater than my distress had been before,
    and I only thank God that you are alive. In the meantime I can do nothing further in this haste than
    to transmit to Your Serene Highness the order to pay for the 6000 Rthl, which His Excellency the Minister
    v. Stein, who is assuredly your true friend, will no doubt cause to be paid out there at once in cash.
    As soon as then I have news where Your Serene Highness is certainly to be found, I shall bring you
    a further 4000 Rthl. These, however, are not monies out of South Prussia, but sums borrowed upon the
    pledged Kontopp mortgage. Neither do I know whether we shall so soon have money out of South Prussia,
    where the devil has got into all their heads. I shall therefore have to approach the upright Minister
    v Stein once more, that he give me money upon a Schweiner mortgage of 20000 Rthl. Enough — whatever
    I can raise I shall bring to Your Serene Highness. If the Russians come afterwards, then there is
    no want in Poland; there I shall take the [uncertain: Kantschumeiner] countrymen to my aid, and there
    I shall get money again — To the Minister v Stein I had written a letter upon a blank sheet — that
    Your Serene Highness requested him to be obliging to the said Triebenfeld whenever he should seek
    anything on Your Highness''s behalf'
- page: 3
  en: This letter I delivered, was at once called in and asked what I desired – I handed over the petition,
    to lend me 8000 thereof upon the Mondopp mortgage of 10000 Rthl. This the upright man granted straightway,
    and glad at heart I would have hastened with this little sum to Your Serene Highness, when the sorrowful
    tidings came in. I had had the order to pay made out only upon Leipzig for Your Serene Highness; this
    until I then have it written over and give the order to pay upon myself to the Breslau Bank – Now
    I send this order to pay by express courier to Koppe, that he may quickly obtain these monies and
    convey them to Your Serene Highness. As soon as I now learn whither Your Highness betakes himself,
    I shall bring more, as said before. Just now I receive news out of the Cabinet, from someone, that
    Your Serene Highness's conduct and valour is praised above everything; how great a share I take in
    this I need not first describe to Your Serene Highness at length. At the same time I have thence gained
    great hope that the Kolzig estates will be given to Your Serene Highness. If this succeeds for me,
    then I shall soon raise 100000 Rthl, which you may employ wholly wherever you will; then we should
    have no need to seek foreign credit. God grant Your Serene Highness further victory and preserve Your
    Highness in health, and so then I remain, until death, as Your Serene Highness's Breslau, the 28th
    of October, faithful and most humble and obedient servant 1806. v Triebenfeld

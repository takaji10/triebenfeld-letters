segments:
- page: 1
  en: 'Most Serene Prince, Gracious Lord!


    Your Serene Highness has, by Cabinet Order of the 23rd of this month, received as a gift from His
    Majesty, in heredity and full property, the town of Kamionna, together with the market town of Kolno
    in the Poznań district, the villages of Trąbczyn, Szetlewek, Nowawies, Łazy, Old and New Laske, Osiny,
    Hauland Trąbczyński in the Konin district, and the village of Brzyce with its appurtenances in the
    Cujavian district; and His Most High Majesty commands me to make the necessary notifications upon
    the proposals that have been made, concerning the most high intention of his will in the matter.


    I rejoice exceedingly to be able to [uncertain: convey] to Your Serene Highness this proof of the
    Royal favour, and I am this very moment conferring with the Feudal Department, in order to see the
    deed of donation for the same expedited soon. Since these estates belonged to a principal insurgent,
    von Prusimski, and since it is necessary to know the debts that may be charged upon these estates,
    so as to free them from the same so far as possible, I am likewise making the necessary arrangements
    on that account with the Government at Poznań.


    According to the preliminary reports, these estates yield at least an annual return of 4000 Thalers;
    and should the same be duly valued and appraised by Your Serene Highness''s command, then I know'

- page: 2
  en: 'no better manager to propose to the same than the Royal Chamber Councillor Peucker at Fraustadt,
    who, should the occasion arise, would with his acquaintance among the South Prussian nobility find
    a buyer for these estates, in case [uncertain: Your] Serene Highness should not be pleased to retain
    them for himself. The Colonel von Sanitz has received the von Prusimski estates lying in the Wegrowietz
    district, namely Pawlow, Dzwonow and Beerenbusch. With true pleasure I look forward to the glad tidings
    that Your Serene Highness, amid his great exertions, finds himself in the desired good health. For
    it is exceedingly agreeable to me to persist in the most reverential sentiments. Your Serene Highness''s
    most obedient servant, Hoym


    Wrocław, the 30th of July 1796.


    [illegible] agrees with the original, this I attest in witness thereof


    Sonnabend, Auditor of the Princely Hohenlohe Infantry Regiment'

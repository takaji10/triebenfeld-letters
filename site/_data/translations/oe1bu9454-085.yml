- page: 2
  en: 'estates, after approximately 26,000 Reichsthaler had been expended therein upon improvements, now
    already afford a yearly yield of 40,500 Rthl., you will yourself perceive that the State can by no
    means enter into the proposed exchange. I had, instructed by [uncertain: durch ich nicht] example,
    already under the 19th of July of this year directed the Minister of State v. Voß to reject all such
    proposals out of hand. Accordingly it is out of [uncertain: wehren] high esteem for Your Lordship
    that I have entered upon your later proposal, and only the evident proof of the disadvantage arising
    therefrom for the interest of the State holds me back from approving it. I am therefore also assured
    that you will not mistake herein the sentiments of the most sincere friendship and high esteem with
    which I remain


    Your Lordship''s


    Berlin


    1798.


    the 4th of December


    [uncertain: gutwilliger Grün]


    Friedrich Wilhelm.


    To my Cousin the Prince


    of Hohenlohe-Ingelfingen


    at Wrocław'

- page: 1
  en: '85


    Copy


    High-born Prince!


    Kindly beloved Uncle!


    From the report of the Minister of State v. Voss, received this day upon Your Lordship''s obliging
    letter of the 29th of February of this year, in which you propose to me the exchange of your South
    Prussian estates for the domain offices of Krotoszyn and Polajewo, I have perceived that the office
    of Krotoszin alone, already now, if only those appurtenances be added which were not brought into
    the valuation at the present leasing, affords a a revenue of 49043 Reichsthaler, which however upon
    a new and correct valuation may be raised still considerably, because the Councillor of War v. Triebenfeld
    received only the relinquishment of the lease, effected in the year 95, a [uncertain: benen] compensation
    of 26,000 Reichsthaler. I should therefore, without boasting of this advantage, and without taking
    into account that the superabundant woodland admits of very considerable and advantageous clearances,
    already according to the present condition lose 17400 Reichsthaler yearly as against the stated yield
    of your estates and the capital sums to be advanced upon them. In this situation of the matter, which
    has assuredly been as little known to Your Lordship as to me, but which is confirmed by the fact that
    even your estates, valued at a yearly yield of only 8650 Rthl.,'

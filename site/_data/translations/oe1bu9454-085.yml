- page: 2
  en: 'estates, after roughly 26,000 [text lost] were expended thereon for improvements, already now yield
    40,500 Rthl of yearly income, you will yourself perceive that the State cannot enter at all upon the
    proposed exchange. I had, [uncertain: instructed] by no example, already on the 19th of July of this
    year charged the State Minister v. Voß to reject all proposals of this kind out of hand. Accordingly
    it is out of [uncertain: sincere] high regard for Your Lordship that I have entered upon your later
    proposal, and only the evident proof of the disadvantage arising therefrom for the interest of the
    State restrains me from approving it. I am therefore also assured that you will not mistake herein
    the sentiments of the most sincere friendship and high regard with which I remain


    Your Lordship''s


    well-disposed [uncertain: Grün]


    Friedrich Wilhelm.


    Berlin


    the 4th of December


    1798.


    To My Cousin the Prince


    of Hohenlohe Ingelfingen


    at Breslau'

- page: 1
  en: 'Copy


    High-born Prince!


    Friendly dear [uncertain: Geim]!


    From the report of the State Minister v. [uncertain: Miricht] v. Voß, come in this day upon Your Lordship''s
    obliging letter of the 29th of February of this year, wherein you propose to me the exchange of your
    South Prussian estates against the domain offices Krotoszyn and Polajewo, I have seen that the office
    of Krotoszyn alone already now, if only those appurtenances are added which were not brought into
    the valuation at the present leasing, yields a revenue of 49043 Rthl, which moreover, upon a new and
    correct valuation, can still be considerably increased, because the Councillor of War v. Triebenfeld
    received, merely for the surrender of the lease effected in the year 95, a compensation of 26,000
    Rthl. I should therefore, without boasting of this advantage, and without taking into account that
    the superfluous woodland permits very considerable and advantageous clearings, already in the present
    state lose yearly 17400 Rthl against the stated yield of your estates and the capital sums to be paid
    in upon them. Given this [uncertain: length] of the matter, which has certainly been as little known
    to Your Lordship as to me, but which is confirmed by the fact that even your estates, valued at a
    yearly yield of only 650 Rthl,'

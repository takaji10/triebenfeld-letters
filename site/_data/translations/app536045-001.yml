segments:
- page: 1
  en: 17. Between the Right Honourable Catharina de Rozdrazewska Prusimska, widow and plaintiff, and the
    summoned Honourable Joseph Puchalski, plaintiff, through the Honourable Albert Żurawski; and the Right
    Honourable Stanisław Ścibor Chełmski and the Honourable Czajkowski, summoned and plaintiffs, through
    the Honourable Ignatius Byszewski — the court, in settling the matters directed mutually between the
    parties and having heard their disputes and joined the plaintiff claims and charges of the several
    of them, considers a sworn inquiry to be necessary, to be conducted by the respective parties, decreeing
    that the parties shall carry out the same sworn inquiry by sworn witnesses regarding the contents
    of the protestations
- page: 2
  en: 'and of the terms, while its sittings last, shall produce and expedite it; and by these presents
    it assigns them the Court Summoner to pronounce the formula of the oath for the swearing-in of their
    witnesses — which oath, since the parties have mutually conceded it to one another, it therefore orders
    the same parties to bring in their witnesses. They brought them in and produced them, and expedited
    the sworn inquiries each on its own behalf; to the reading of which this same court proceeded. These
    having been read — whereas it is shown that the Right Honourable Prusimska, in the year 1761, dispatched
    the potash-burners with potash, prepared at what time is not established; and that the Right Honourable
    Chełmski, departing for Poznań, came upon them, as they were departing for Gdańsk, near the town of
    Pyzdry; and having seized the same potash, placed it in an inn situated in the town of Pyzdry; and
    imposed an arrest on the said potash with the notary of the customs post; and that thereafter, although
    the notary of the customs post opposed it, the potash-burners, with the assistance of the Honourables
    Wawrowski and Gotartowski, moved the said potash from the location and conveyed it to Gdańsk — since,
    however, between these parties a case regarding the boundaries between the estates of Trąbczyn and
    Łukom, and other matters, is being heard undecided before the Crown Tribunal, and on whose ground
    the potash was prepared will be shown only from the demarcation of the estates that is to follow —
    for that reason the court suspends the resolution of the present matter until the decision on the
    estate case, and orders that the sworn inquiries be handed out to the parties from the land chancery
    in a closed roll.


    [Translator''s note: The source reads "sitto", which is not a standard Latin form. The expected ablative
    of situs is "sito". Retained in the transcription as a scribal slip; translated as "situated."]


    [Translator''s note: The source uses two variant spellings for the customs post: "Thaelonei" at first
    mention and "Thelonei" at second. Both are scribal forms of Latin teloneum (customs post, toll house).
    Translated uniformly throughout.]'

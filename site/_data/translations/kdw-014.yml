  en: 'Document no. 117


    1407, 19 November, at Niepołomice.


    Władysław II, King of Poland, gives the monastery of Ląd the power to found a town in the village
    of Zagórów.


    In the name of the Lord, amen. For the perpetual memory of the matter. The common good is well served,
    and the government of the realm is ordered with pleasing moderation, when among the other offices
    of rule granted from above to princes increase is ordained for each of the parts of the realm, and
    their conditions are changed both in kind and in particular, in public as well as in private. Therefore
    we, Władysław, by the grace of God King of Poland, and also supreme prince of the lands of Kraków,
    Sandomierz, Sieradz, Łęczyca, Kujawy and Lithuania, lord and heir of Pomerania and Ruthenia, etc.,
    make known by the tenor of these presents to all and each, present as well as to come, whom it concerns,
    that, having had diligent regard to the honesty of praiseworthy life and the constancy of devotion
    of the religious man Gerhard, abbot, together with the brothers of his convent in Ląd, of the Cistercian
    Order, by which they have very greatly deserved to be commended in the sight of our majesty, at the
    urgent and humble requests of the said abbot and convent, wishing (to make) the condition of that
    convent better and to increase its profits, we give full power and grant every faculty by the tenor
    of these presents to found a town in their village called Zagórów,¹⁾ lying in our land of Greater
    Poland and in the district of Konin, and to make it to last for ever: giving and granting to the same
    town Sogorow(s) all the civic rights which the other towns of our realm enjoy in every way. And so
    that the said town of Zagórów may the better be founded and become populous, we transfer it from Polish
    law to the German law which is called of Magdeburg, to last for ever; removing there all Polish rights,
    ways and customs whatsoever which were wont to disturb the said German law of Magdeburg and might
    in any way hinder it. We further exempt, absolve and for ever free the advocate, burghers and inhabitants
    of that town from all jurisdiction and power of all the palatines, castellans, judges, under-judges
    and any officials (and) servants of our realm, so that they shall in no way have to answer when summoned
    before them or any of them in causes great or small, nor be bound to pay any penalties; but the townsmen
    and inhabitants of that town shall answer only before their advocate for the time being, and the advocate
    before his abbot, or, if the abbot is negligent and remiss in doing justice, then before us or our
    general assembly, when he has been called and summoned by our letter sealed with our seal, and not
    otherwise than by his German law of Magdeburg, to those who complain of him; and in criminal and capital
    causes, such as theft, blood, homicide, maiming of limbs and arson, and any other enormous offences,
    we give full power and grant by the tenor of these presents every faculty to the advocate of that
    town for the time being to judge, sentence, correct, punish, chastise and condemn within its bounds
    and limits, as the German law itself demands and requires in all its points, conditions and clauses,
    our royal rights however always saved in all things. We also establish in the same town of Zagórów
    a weekly market day on every Wednesday, to be held for ever without prejudice to the other towns;
    at which market it shall be lawful and free for all and each merchant and any men to sell, buy, exchange
    and carry on any trade. In witness of these letters, to which our seal is hung. Given at Niepołomice
    on the very day of St Elizabeth the widow, in the year of the Lord 1407. In the presence of the reverend
    fathers in Christ and lords: Mikołaj, Archbishop of the holy church of Gniezno, Wojciech, Bishop of
    Poznań, Jan of Tarnów, castellan and captain of Kraków, Piotr Kmita of Kraków, Jan Ligęza of Łęczyca,
    Jakusz of Koniecpol of Sieradz, palatines; our faithful beloved knights and very many others worthy
    of trust. On the report of the venerable lord(s) vice-chancellor of the Kingdom of Poland, etc.


    From the Cologne copy-book of the privileges of Ląd, fol. 3.


    ¹⁾Zagorów, a town in the voivodeship of Kalisz, district of Konin.'

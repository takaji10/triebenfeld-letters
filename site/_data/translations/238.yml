status: draft
segments:
- page: 1
  en: Right Honourable Sir, Highly Honoured Sir Councillor of War and Forests. Your messenger arrived
    only this forenoon; he excuses himself for having been so long on the road by saying that he had lost
    his way. From his march route I see that he was also at the Chief Bailiff Koenig's, where he said
    that the latter was at home and had taken the letters from him himself. Neither Trzcinski, Zerboni,
    nor Koenig[?] lets anything be heard from him; the first has as yet paid nothing, the second has likewise
    fulfilled none of his obligations, Herr Weigel presses me exceedingly, I shall now attempt whether
    I can quiet him by means of the Trzcinski bills of exchange. These monies from Großen I needed for
    the veriest necessities, for unhappily everything here still stands as you know it. Your entire silence
    has filled me with sorrow, since I conclude therefrom that all your endeavours on my behalf were fruitless.
    I sent Your Right Honourable a messenger, who however brought back only a receipt from the bailiff
    at Blizanow, which Herr Schenck — after he had detained this express four days — enlarged to the effect
    that you were gone away on a journey, would return in a fortnight, and that I should then soon receive
    an answer; this, to my great regret and real detriment, did not follow. Only today do I see from Your
    Right Honourable's dispatch of the 29th of April that you had written to me earlier, which lines I
    did not receive. I can assure you upon my word that the letter of yours which I answer here is the
    first that I have received from you since you left Schlawenzitz; in vain, alas, have I long yearned
    for it. I
- page: 2
  en: 'I rejoice to see therefrom that I am not wholly [uncertain: effaced] from your remembrance — I
    am willing to believe that the letter, the loss of which the negligence of Herr Koenige brought upon
    me, may at least have contained instructive disclosures for me; on that ground alone it was inexcusable
    that he put it into the post at Würtemberg. What has become of the letter I cannot guess, especially
    as you did not indicate the date to me; from the newspapers I perceive that in the fire at Würtemberg
    the post-house burned down with the rest, and many letters lying there became a prey to the flames.
    — The upshot of it is that I now know nothing of what you wished me to do; meanwhile I enclose herewith
    a letter to His Majesty the Russian Emperor under open seal, so that, if you find it suitable thereto,
    the necessary use may be made of it. In any case I have done what I was able, and beg for Your Right
    Honourable''s further instruction; I have hitherto omitted nothing to prove, with all resignation,
    my patriotism and good will. What I wrote, and how I was answered, the enclosure shows. — To the King,
    to the Herr State Chancellor and to the Minister of Justice I applied myself anew in my pressing concern,
    that they might vigorously lend their weight at Brieg to the composition-agreement proposed by me
    with the creditors, and might favour the fixing of a'
- page: 3
  en: 'of a reasonable maintenance allowance for me; this intercession too was refused me, otherwise one
    keeps silence about everything, and it appears that in the end one wishes to abandon me to death by
    starvation. You already know all this, wherefore I find it useless to say anything further of it.
    My situation is dreadful and the conduct towards me cruel. General v. Roeder laid this before Herr
    v. Hardenberg while still at Breslau, but I remained likewise uninformed as to the result. — I have
    implored the protection of the two Monarchs anew in certain cases, so as not to let the reproach of
    a neglect be charged to me, and I entrusted my letter to the King to the State Chancellor, and that
    to the Emperor to Herr Minister v. Stein, for delivery; this too I did not wish to withhold from you,
    but I beg that of this disclosure only the most cautious use be made. [uncertain: Let] me, Your Right
    Honourable, [text lost] without early news of the arrival of this letter, and instruct me concerning
    the course of your negotiations. I could not comply with your wishes more speedily, since the letter
    goes off tomorrow morning by the riding-post and will probably arrive on the 11th of this month at
    Dreßden. As I hear today, the two Monarchs had already departed for Altenburg; in no case, however,
    can you be so far removed from them that you could not personally open the'
- page: 4
  en: 'negotiations. The distinction conferred on your eldest son has greatly rejoiced me, and I take
    part in his sufferings from the wound. In making your personal visit you act as an excellent father.
    Which I esteem. — Do let me know soon when you return, and where we may most conveniently speak together.
    I hope after all that something will soon be obtainable from Maierowitz, since help is all too sorely
    needed by me. It appears, to my consolation, that you still expect advantage from Ratke''s working
    of the matter; have you then heard anything more particular from him about it of late? If Your Right
    Honourable then not at all during the presence of the exalted personages at Kolisch. For your friendly
    assistance I beg with confidence. With wishes for [uncertain: thunderous] health and a prosperous
    journey, I remain, in especial high esteem, Your Right Honourable''s Schlawenzitz, 9th May 1813, most
    faithfully devoted friend and servant F. L. F. zu Hohenlohe'

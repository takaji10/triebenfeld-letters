    kind: person
  numbers:
  - I
- page: 3
  en: 'six consecutive years, namely from Midsummer Day of the present year 1805 until Midsummer Day 1811,
    for an annual rent of 1500 Rthl, in writing one thousand five hundred Rthl Courant.


    § II. This rent money shall be paid annually in advance, namely each time on Midsummer Day, that is
    the 24th of June, in good Prussian convention money; and since the rent for the first year, amounting
    to 1500 Rthl, in writing one thousand five hundred, [uncertain: not good] has already been paid in
    cash, receipt is hereby given for the due receipt thereof.


    § III. This lease is concluded in Pausch und Bogen without a valuation, and therefore no subsequent
    reckoning in respect of the yield takes place.


    § IV. The lessee must effect the tillage of the fields with his own draught teams'
  numbers:
  - '1805'
  - '1811'
  - '1500'
  - '24'
  - '1500'
  - II
  - III
  - IV
- page: 4
  en: 'and there shall be made over to him, for hand-services only, the whole of the komorniks and cottagers
    present in Kopojno with their services, and these shall receive from the lessor, namely


    a., each komornik, ten in number, four Morgen, and


    b., each cottager, whose number is undetermined, two Morgen of Magdeburg measure, free of rent. As
    to the working, the lessee must come to terms with these people according to his own convenience.


    § V. Free grinding of the bread grain is likewise granted to the lessee at the mills at Tarzewo and
    Kopojno; the cash rent from these mills, on the other hand, as also from the rent-paying peasants
    in Kopojno, remains to the lessor.


    § VI. Besides the cash rent, the lessee assumes the settlement of all Royal dues in taxes,'
  names:
  - de: Kopoyno
    en: Kopojno
    kind: place
  - de: Tarzewo
    en: Tarzewo
    kind: place
  numbers:

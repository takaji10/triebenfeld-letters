  - Zehn
  - V
  - VI
- page: 5
  en: 'forage deliveries and the like, as also the allowance due to the monastery of Ląd, without any
    compensation or abatement of the rent.


    If in future these dues come to be apportioned over the entire surface area of the estates, then any
    resulting decrease shall accrue to the lessee''s benefit.


    § VII. The lessee received for his own need 50 annually, in writing fifty cords of pine firewood,
    from the lordship''s forest, which wood he must cart himself, and likewise have felled at his own
    cost, or else pay the felling-wage for it to the princely office. He also receives two cartloads of
    hard timber every year.


    § VIII. All dwelling and farm buildings and gardens situated in Kopojno the lessee receives for his
    use; he must however maintain the buildings in roof and frame at his own cost. The larger repairs,
    on the other hand, fall to the lessor,'
  names:
  - de: Kloster Ląd
    en: monastery of Ląd
    kind: place
  - de: Kopoyno
    en: Kopojno
    kind: place
  numbers:
  - '50'
  - VII
  - VIII
  - zwey
- page: 6
  en: 'as also all new buildings.


    § IX. Since the lessee for the present does not receive the fields with a determined sowing, the appearing
    parties have agreed between themselves that the lessee binds himself, at the expiry of the lease term,
    to leave behind the one field sown with winter grain, the second duly manured with summer grain, and
    the third field as fallow worked up in husbandmanlike fashion, without either party making any demands
    upon the other on account of surplus or deficient sowing. The fields shall be divided into three wholly
    equal parts.


    § X. This lease begins from Midsummer Day of this year and the lessee renounces all subsequent reckonings
    in respect of the usufructs of the various heads of husbandry hitherto foregone.'
  numbers:
  - IX
  - X
  - 3te
  - drey
- page: 7
  en: '§ XI. The clearing of the field ditches and the upkeep of the bridges falls to the lessee; yet
    for the latter he shall receive the necessary timber free of charge, and the village people must render
    assistance in this.


    § XII. The lessee may make over the estate to another in sub-lease only with the foreknowledge and
    express consent of the lessor; in the contrary case such a sub-lease is invalid and the lessee is
    answerable to the lessor for all damage or detriment arising therefrom.


    § XIII. In the event of misfortunes occurring, such as fire from heaven, or arson by evil-disposed
    persons, total hail-strike and war, the lessee shall receive a remission such as is granted to the
    lessees on the Royal domains according to the principles of the Chamber.'
  numbers:
  - XI
  - XII
  - XIII
- page: 8
  en: 'Upon all other misfortunes, whether they arise from crop failure or in whatever manner it may be,
    the lessee expressly renounces claim; he also hereby binds himself expressly to make every indemnification
    which is caused by his own fault or that of his people.


    § XIV. The lessee must maintain the fields in good manured condition, and may not sell any straw or
    hay off the estate, unless he had the same absolutely in surplus.


    § XV. At the expiry of the years of lease no particular notice of termination is required from either
    the one side or the other; rather the lessee is bound to vacate at Midsummer Day 1811; yet there shall
    be allowed him the'
  numbers:
  - XIV
  - XV
  - '1811'
- page: 9
  en: 'vacating period customary in this region, up to 14 days after Midsummer Day; but he must see to
    the necessary carting-out himself.


    § XVI. The lessee shall have free pasture in that portion of grazing-ground and woodland which remains
    over for the manorial lordship (Dominium) and is not dismembered.


    § XVII. The costs of this contract and of the future re-delivery both parties shall bear by halves.


    § XVIII. For the fences the lessee shall receive the requisite brushwood, and the same shall be assigned
    to him upon his application. Both parties promise to hold firmly to this contract and, having been
    judicially instructed as to the consequences, renounce all legal subterfuges available against it,
    in particular the objection of an injury suffered above or below the half, of a cunning persuasion,
    of overhaste,'
  numbers:
  - '14'
  - XVI
  - XVII
  - XVIII
- page: 10
  en: 'of seduction, fear, coercion, of matters otherwise agreed than written down, or not rightly understood.
    They moved that this contract be drawn up, and, after it had been read out and explained in the Polish
    language, have in token of their approval signed below in their own hands, whereby it is noted that
    Mr von Niedzwiedzki has expressly waived the keeping of a Polish protocol.


    Read and approved, Peter Friedrich August von Triebenfeld.


    I have understood it, and I [illegible] did not demand that the protocol be translated into the Polish
    language. Maciey Niedzwiedzki


    Anton von Rapacki


    as witness.


    u. u. u.


    Schenk.'

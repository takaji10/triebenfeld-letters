- page: 13
  en: 'have in token of their approval signed below in their own hands.


    Read and approved, Peter Friedrich August von Triebenfeld. I have understood this protocol; I do not
    demand that it be transcribed in the Polish language.


    Maciey Niedzwiedzki


    Antoni Rapacki


    as witness.


    u. u. u.


    Schenk. This contract is therefore hereby judicially drawn up under the impression of the court seal
    and the customary signature. Trąbczyn, the 27th of August 1805. Princely Hohenlohe Court Office. Schenck,
    justiciary. Execution of the lease contract between His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen
    and the lessee Mr Maciey von Niedzwiedzki over Kopojno.'

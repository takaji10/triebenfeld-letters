status: draft
segments:
- page: 1
  en: 'The first copy bears 3 rtlr 10 ggl. in stamp duty.


    The Princely Hohenlohe Patrimonial Court hereby makes known that before it, between His Serene Highness
    the reigning Prince of Hohenlohe Ingelfingen, through his General Mandatorium Herr Councillor of War
    and Prince[?] Rath v. Triebenfeld as lessor of the one part, and Herr Maciey v. Niedzwiedzki as lessee
    of the other part, concerning the estate Kopoyno, the following lease contract has been declared ad
    Protocollum, which reads word for word as follows: [uncertain: könntet] Actum Trąbczyn, the 17th of
    August 1805. Before the undersigned Justitiarius of this place there appeared in person: 1st, Herr
    Councillor of War and Forests v. Triebenfeld, as the known General Bevollmächtigter (authorised representative)
    of His Serene Highness the reigning Prince of Hohenlohe Ingelfingen, hereditary lord and lord of the
    court of this place, and


    2nd, the local propination lessee Herr Maciey v. Niedzwiedzki. Com-'
- page: 2
  en: '-parents are personally known to Subscripto, and no doubt subsists as to their capacity to execute
    judicial acts validly. The same declare, freely and after due deliberation, the following lease contract
    concluded between them, to the judicial protocol.


    § I. Herr Councillor of War and Forests von Triebenfeld leases out, namely, by virtue of the power
    of attorney held from His Most Serene Highness, the demesne farm Kopoyno, just as the same is now
    divided and arranged, with the winter and summer seed now present, the fishery in the waters and in
    the Warthe stream, and all remaining uses, yet with exclusion of the brewery and distillery, as these
    are leased separately, and without any cattle or field inventory, to Herr Maciey Niedzwidzki for'
- page: 3
  en: 'six consecutive years, namely from Johanni of the present year 1805 up to Johanni 1811, for an
    annual rent of 1500 Rthl., in words: One thousand five hundred Rthl Courant.


    § II. This rent-money is to be paid annually in advance, namely: each time on the day of Johanni,
    that is the 24th of June, in good Prussian Convent[ions-money]; and since the rent for the first year,
    of 1500 Rthl., in words One thousand five hundred [uncertain: ungute], has already been paid in cash,
    receipt of the same in due form is hereby acknowledged to him.


    § III. This lease is concluded in Pausch und Bogen, without valuation, and accordingly no subsequent
    accounting takes place with regard to the yield.


    § IV. The cultivation of the fields the lessee must effect with his own team of draught animals,'
- page: 4
  en: 'and there shall be left over to him, for the manual services only, the whole of the komorniks and
    cottagers (Einlieger) resident in Kopoyno, with their services; and the same shall receive from the
    lessor, namely


    a., each komornik, ten in number, four Morgen, and


    b., each cottager, whose number is undetermined, two Morgen Magdeburg measure, free of rent. As to
    the tillage, the lessee must come to an agreement with these people according to his own convenience.


    § V. The free grinding of the bread-corn is also granted to the lessee at the mills at Tarzewo and
    Kopoyno; the [uncertain: Bäre] rent, on the other hand, remains with the lessor, both from these mills
    and from the rent-paying peasants in Kopoyno.


    § VI. Besides the cash rent, the lessee undertakes the discharge of all Royal dues in taxes,'
- page: 5
  en: 'forage deliveries and the like, as also the competency for the Ląd monastery, without any compensation
    or remission of rent.


    If in future these dues come to be apportioned over the whole surface-area of the estates, then the
    deficit arising therefrom falls to the lessee [uncertain: zu späte].


    § VII. The lessee received for his need, annually, 50, in words fifty, Klafter of pine firewood out
    of the manorial forest, which wood he must have carted himself, and likewise have felled at his own
    cost, or else pay the felling-wage for it to the Princely Office. He also [uncertain: bekannt] two
    loads of hard timber every year.


    § VIII. All dwelling and farm buildings and gardens situated in Kopoyno the lessee receives for his
    use; he must, however, maintain the buildings in roof and frame at his own cost. The larger repairs,
    on the other hand, lie with the lessor'
- page: 6
  en: '-, as also all new buildings.


    § IX. Since the lessee does not for the present receive the fields with a determinate quantity of
    seed, the comparents have settled it between them that the lessee, at the expiry of the term of lease,
    binds himself to leave behind the one field sown with winter crop, the second duly sown with summer
    crop, and the third field as fallow, worked in husbandmanlike fashion, without either party making
    any demands upon the other on account of surplus or deficiency of seed. The fields shall be divided
    into three wholly equal parts.


    § X. This lease begins from Johanni of this year, and the lessee renounces all subsequent accounting
    in respect of the uses of the various branches of husbandry hitherto foregone.'
- page: 7
  en: '§ XI. The clearing of the field ditches and the keeping in repair of the bridges lies with the
    lessee; yet for the latter he shall receive the necessary timber free of charge, and the village folk
    must render help in this.


    § XII. The lessee may make over the estate to another in sub-lease only with the foreknowledge and
    express approval of the lessor; in the contrary case such a sub-lease is void, and the lessee is answerable
    to the lessor for all damage or [uncertain: Steh theil] arising therefrom.


    § XIII. In the event of misfortunes occurring, such as fire from heaven, or arson by evil persons,
    total hailstorm and war, the lessee shall receive a remission such as falls to the lessees on the
    Royal domains according to Chamber principles.'
- page: 8
  en: 'As to all other misfortunes, be they occasioned by crop failure or in whatever manner it may be,
    the lessee expressly renounces [any claim]; he also expressly binds himself hereby to every indemnification
    which is caused by his own fault or that of his people.


    § IV. The fields the lessee must maintain in a good state of manuring, and he may not sell any straw
    or hay off the estate, unless he should have the same absolutely in surplus.


    § XV. At the expiry of the years of lease no special notice of termination is needed on either side;
    rather the lessee is bound to vacate at Johanni 1811; yet there shall be allowed him the customary
    in these parts'
- page: 9
  en: 'usual time for vacating, up to 14 days after Johanni; but he must see to the needful cartage out
    himself.


    § XVI. Free pasture the lessee receives in that part of the grazing-land and forest which remains
    over for the Dominium and is not dismembered.


    § XVII. The costs of this contract and of the future counter-copy both parties shall bear by halves.


    § XVIII. For the fences the lessee shall receive the requisite brushwood, and the same shall be assigned
    to him (angewiesen) upon his application. Both parties promise firmly to keep this contract, and,
    having been judicially instructed as to the consequences, renounce all legal subterfuges available
    against it, in particular the plea of an injury suffered above or below the half, of cunning persuasion,
    of over-hastiness,'
- page: 10
  en: 'of seduction, fear, coercion, of matters otherwise agreed than written down, or not rightly understood.
    They requested that this contract be drawn up in due form, and, after it had been read out and explained
    in the Polish tongue, have in token of their approval subscribed below with their own hands; whereby
    it is noted that Herr v. Niedzwiedzki has expressly waived the keeping of a Polish protocol.


    Read and approved, Peter Friedrich August v. Triebenfeld.


    [in Polish:] "I have understood, and of the copy[?] [illegible] I demanded that the protocol be translated
    into the Polish language." Maciey Niedzwiecki


    Anton v Rapacki


    as witness.


    u. u. u.


    Schenk.'
- page: 11
  en: 'Actum Trąbczyn, the 24th of August 1805. As a supplement to the lease contract concluded over the
    demesne farm Kopoyno on the 17th of this month, there desired to declare this day Herr Councillor
    of War and Prince[?] Rath v. Triebenfeld on his part, and Herr Maciey v. Neidzwiecki on the other
    part, the following agreement.


    § I. Herr v. Niedzwiecki receives, in addition to the twenty-six Hufe already taken in lease, a further
    13 Hufe, in words thirteen Hufe Magdeburg measure, of arable and meadow, for the six years of lease,
    and pays for this an annual rent of 625 Rthl, in words Six hundred and twenty-five Thaler Courant;
    so that henceforth the whole rent of Kopoyno amounts to 2125 Rthl., in words Two thousand one hundred
    and twenty-five Rthl.


    § 2'
- page: 12
  en: 'This additional rent of Six hundred and twenty-five Thaler is, for the present year from Johann
    1805 to the same term 1806, forthwith paid in advance, and Herr Councillor of War v. Triebenfeld hereby
    acknowledges receipt of the same in due form, in the most legally binding manner. In future it shall
    be discharged each time praenumerando together with the principal sum.


    § 3. These thirteen Hufe shall be incorporated into the demesne farm, and the lessee must in future
    hand back the third part of the arable sown with winter crop and a third with summer crop, and pay
    all dues thereon as is determined in the principal contract. The comparents request that the foregoing
    agreement be carried over into the principal contract to be drawn up, and, after it had been read
    out and explained,'
- page: 13
  en: 'have in token of their approval subscribed below with their own hands.


    Read and approved, Peter Friedrich August v. Triebenfeld


    [in Polish:] "I have understood; I do not demand that this protocol be transcribed in the Polish language."


    Maciey Niedzwiecki


    Antoni Rapacki


    as witness.


    u. u. u.


    Schenk


    This contract is therefore hereby judicially drawn up under the impression of the court seal and the
    customary signature. Trąbczyn, the 27th of August 1805. Princely Hohenlohe Court Office. Schenck,
    Justitiarius.


    Engrossment of the lease contract between His Serene Highness the reigning Prince of Hohenlohe Ingelfingen
    and the lessee Herr Maciey v. Niedzwecki, upon Kopoyno.'

status: draft
segments:
- page: 1
  en: 'The first copy bears 3 rtlr 10 ggl. in stamp duty.


    The Princely Hohenlohe Patrimonial Court hereby gives to be known that before it, between His Serene
    Highness the reigning Prince of Hohenlohe Ingelfingen, through his General Mandatorium the Councillor
    of War and Forests von Triebenfeld as lessor on the one part, and Herr Maciey v. Niedzwiedzki as lessee
    on the other part, the following lease contract over the estate Kopoyno has been declared ad Protocollum,
    which reads word for word as follows: Actum Trąbczyn, the 17th of August 1805. Before the undersigned
    Justitiarius of this place there appeared in person: 1st, the Councillor of War and Forests von Triebenfeld
    as the known General Bevollmächtigter [authorised representative] of His Serene Highness the reigning
    Prince of Hohenlohe Ingelfingen, hereditary and judicial lord of this place, and


    2nd, the local lessee of the propination rights, Herr Maciey v. Niedzwiedzki. Com-'
- page: 2
  en: '-parenti are personally known to the undersigned, and there is no doubt as to their capacity validly
    to execute judicial transactions. They declare, freely and after due deliberation, the following lease
    contract concluded between them, to the judicial protocol.


    § I. Namely, the Councillor of War and Forests von Triebenfeld, by virtue of the power of attorney
    held from His Most Serene Highness, leases out the demesne farm Kopoyno, just as the same is now divided
    and appointed, with the winter and summer sowing now on the ground, the fishery in the waters and
    the Warthe stream, and all remaining usufructs, yet with the exclusion of the brewery and distillery,
    as these are leased separately, and without any livestock or field inventory, to Herr Maciey Niedzwidzki
    for'
- page: 3
  en: 'six consecutive years, namely from Johanni of the present year 1805 until Johanni 1811, for an
    annual rent of 1500 Rthl., in words: one thousand five hundred Rthl Courant.


    § II. This rent-money shall be paid annually in advance, and namely: each time on the day of Johanni,
    that is the 24th of June, in good Prussian convention coin; and since the rent for the first year,
    amounting to 1500 Rthl, in words one thousand five hundred [uncertain: ungute], has already been paid
    in cash, he is hereby receipted for the due receipt of the same.


    § III. This lease is concluded in Pausch und Bogen without a valuation, and therefore no subsequent
    reckoning in respect of the yield shall take place.


    § IV. The tillage of the fields the lessee must effect with his own draught teams,'
- page: 4
  en: 'and there shall be made over to him, for hand-services only, the whole of the komorniks and cottagers
    (Einlieger) present at Kopoyno with their services; and these shall receive from the lessor, namely:


    a., each komornik, ten in number, four Morgen, and


    b., each cottager, whose number is undetermined, two Morgen Magdeburg measure, free of rent. As to
    the working of these, the lessee must come to agreement with these people according to his own convenience.


    § V. Free grinding of his bread-corn is likewise granted to the lessee at the mills at Tarzewo and
    Kopoyno; the [uncertain: Bäre] rent, on the other hand, remains to the lessor, both out of these mills
    and from the rent-paying peasants at Kopoyno.


    § VI. Besides the cash rent, the lessee undertakes the discharge of all Royal dues in taxes,'
- page: 5
  en: 'fodder deliveries and the like, as also the competency for the Ląd monastery, without any compensation
    or remission from the rent.


    If in future these dues should be apportioned over the whole surface area of the estates, then the
    resulting deficit shall accrue to the lessee''s benefit.


    § VII. The lessee received for his own need 50 annually, in words fifty cords of pine firewood, out
    of the seigneurial forest, which wood he must haul himself, and likewise have felled at his own cost,
    or else pay the felling-wage to the Princely Office for it. He is also allowed two cartloads of hard
    timber every year.


    § VIII. All dwelling and farm buildings and gardens situate at Kopoyno the lessee receives for his
    use: but he must maintain the buildings in roof and frame at his own cost. The larger repairs, on
    the other hand, lie with the lessor'
- page: 6
  en: 'as also all new buildings.


    § IX. Since the lessee for the present does not receive the fields with a determined sowing, the Comparenti
    have settled it together thus: that at the expiry of the lease term the lessee is bound to leave behind
    the one field duly sown with winter crop, the second sown with summer crop, and the third field as
    fallow worked in husbandmanlike order, without either party making any demands upon the other on account
    of surplus or deficient sowing. The fields shall be divided into three wholly equal parts.


    § X. This lease begins from Johanni of this year, and the lessee renounces all subsequent reckonings
    in respect of the usufructs of the several branches of husbandry hitherto foregone.'
- page: 7
  en: '§ XI. The clearing of the field ditches and the keeping in repair of the [uncertain: bridges] lies
    with the lessee; yet he shall receive for the latter the necessary timber free of charge, and the
    village people must render assistance in this.


    § XII. The lessee may make over the estate to another in sub-lease only with the foreknowledge and
    express consent of the lessor; in the contrary case any such sub-lease is invalid, and the lessee
    is answerable to the lessor for all damage or [uncertain: disadvantage] arising therefrom.


    § XIII. In the event of misfortunes occurring, such as fire from heaven, or arson by evil persons,
    total hailstorm and war, the lessee shall receive a remission, such as falls to the lessees on the
    Royal domains according to Chamber principles.'
- page: 8
  en: 'To all other misfortunes, whether they arise through crop failure or in whatsoever manner it may
    be, the lessee expressly renounces; and he hereby binds himself, also expressly, to make good every
    damage which is caused by his own fault or by the fault of his people.


    § XIV. The fields the lessee must maintain in good manured condition, and he may not sell any straw
    or hay off the estate, unless he had the same absolutely superfluous.


    § XV. At the expiry of the lease years no particular notice of termination is required from the one
    side or the other; rather the lessee is bound to quit at Johanni 1811, yet there shall be allowed
    him the'
- page: 9
  en: 'customary vacating-time usual in this region, until 14 days after Johanni; but he must see to the
    necessary carting-out himself.


    § XVI. Free pasture the lessee receives in that portion of grazing and woodland which remains over
    for the Dominium and is not dismembered.


    § XVII. The costs of this contract and of the future restitution both parties shall bear by halves.


    § XVIII. For the fences the lessee receives the requisite brushwood, and the same shall be assigned
    to him upon his application. Both parties promise firmly to abide by this contract, and, being judicially
    instructed as to the consequences, they renounce all legal subterfuges available against it, particularly
    the objection of an injury above or below the half having occurred, of cunning persuasion, of over-haste,'
- page: 10
  en: 'of seduction, fear, compulsion, of matters otherwise agreed than written down, or not rightly understood.
    They moved that this contract be drawn up in due form, and, after it had been read out and explained
    in the Polish tongue, they have in token of approval subscribed it below with their own hands; whereby
    it is noted that Herr v. Niedzwiedzki has expressly waived the keeping of a Polish protocol.


    Read and approved, Peter Friedrich August v. Triebenfeld.


    [Polish:] "I have understood, and I [illegible] demanded that the protocol be translated into the
    Polish language." Maciey Niedzwiecki


    Anton v Rapacki


    as witness.


    etc. etc. etc.


    Schenk.'
- page: 11
  en: 'Actum Trąbczyn, the 24th of August 1805. As a supplement to the lease contract concluded over the
    demesne farm Kopoyno on the 17th of this month, the Councillor of War and [uncertain: Fürst-Rath]
    von Triebenfeld on his part, and Herr Maciey v. Neidzwiecki on the other part, this day desire the
    following agreement.


    § I. Herr v. Niedzwiecki receives, in addition to the six-and-twenty Hufen already taken in lease,
    a further 13 Hufen, in words thirteen Hufen Magdeburg measure, of arable and meadow for the six lease
    years, and pays for this an annual rent of 625 Rthl, in words six hundred and twenty-five Thaler Courant;
    so that henceforth the whole rent of Kopoyno amounts to 2125 Rthl., in words two thousand one hundred
    and twenty-five Rthal.


    § 2'
- page: 12
  en: 'This additional rent of six hundred and twenty-five Thaler is for the present year, from Johanni
    1805 to the same in 1806, already paid down in advance, and the Councillor of War von Triebenfeld
    hereby receipts, in the most legally binding manner, for the due receipt thereof. In future the same
    shall each time be discharged praenumerando together with the principal sum.


    § 3. These thirteen Hufen shall be incorporated into the demesne farm, and the lessee must in future
    leave back the third part of the arable sown with winter crop and a third with summer crop, and pay
    all dues thereon as is determined in the principal contract. The Comparenti request that the foregoing
    agreement be carried over into the principal contract to be drawn up, and, after it had been read
    out and explained,'
- page: 13
  en: 'they have in token of approval subscribed below with their own hands.


    Read and approved, Peter Friedrich August v. Triebenfeld


    [Polish:] "I have understood; I do not demand that this protocol be transcribed in the Polish language."


    Maciey Niedzwiecki


    Antoni Rapacki


    as witness.


    etc. etc. etc.


    Schenk


    This contract is therefore hereby judicially drawn up under the impression of the court seal and the
    customary signature. Trąbczyn, the 27th of August 1805. Princely Hohenlohe Court Office. Schenck,
    Justitiarius.


    Engrossment of the lease contract between His Serene Highness the reigning Prince of Hohenlohe Ingelfingen
    and the lessee Herr Maciey v. Niedzwecki upon Kopoyno.'

- page: 1
  en: 'The first copy bears 3 rtlr 10 ggl. in stamp duty.


    The Princely Hohenlohe Patrimonial Court hereby makes known that before it, between His Serene Highness
    the reigning Prince of Hohenlohe-Ingelfingen, through his general mandatory the Councillor of War
    and Forests von Triebenfeld, as lessor on the one part, and Mr Maciey von Niedzwiedzki as lessee on
    the other part, the following lease contract concerning the estate of Kopojno has been declared ad
    Protocollum, which reads word for word as follows: Actum Trąbczyn, the 17th of August 1805. Before
    the undersigned justiciary of this place there appeared in person, 1st, the Councillor of War and
    Forests von Triebenfeld as the known general authorised representative of His Serene Highness the
    reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court of this place, and


    2nd, the local holder of the propination rights lease, Mr Maciey von Niedzwiedzki. Com-'

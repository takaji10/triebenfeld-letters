- page: 2
  en: 'The appearing parties are personally known to the undersigned, and there exists no doubt as to
    their capacity validly to perform judicial acts. They declare freely and after due deliberation the
    following lease contract concluded between them, to be entered in the judicial protocol.


    § I. That is to say, the Councillor of War and Forests von Triebenfeld, by virtue of the power of
    attorney held from His Most Serene Highness, leases out the demesne farm of Kopojno, just as the same
    is now divided and arranged, together with the winter and summer sowing now standing, the fishery
    in the waters and in the Warthe stream, and all the remaining usufructs, yet with the exclusion of
    the brewery and distillery, as being separately leased, and without any livestock or field inventory,
    to Mr Maciey Niedzwiedzki for'
  names:
  - de: Subscripto
    en: the undersigned
    kind: other
  - de: von Triebenfeld
    en: von Triebenfeld
    kind: person
  - de: Kopoyno

- page: 12
  en: 'This additional rent of six hundred and twenty-five thaler is for the present year, from Midsummer
    1805 to the same term 1806, already paid forthwith in advance, and the councillor of war von Triebenfeld
    hereby gives receipt for the due receipt thereof in the most legally binding manner. In future it
    shall be settled each time together with the principal sum praenumerando.


    § 3. These thirteen Hufen are incorporated into the demesne farm, and the lessee must in future return
    the third part of the arable sown with winter grain and a third with summer grain, and pay all dues
    thereon as is determined in the principal contract. The appearing parties request that the foregoing
    agreement be carried over into the principal contract to be drawn up, and, after it had been read
    out and explained,'

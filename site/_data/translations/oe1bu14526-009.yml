- page: 11
  en: 'Actum Trąbczyn, the 24th of August 1805. As a supplement to the lease contract concluded on the


    17th of this month concerning the demesne farm of Kopojno, the Councillor of War and Forests von Triebenfeld
    for his part and Mr Maciey von Niedzwiedzki on the other part this day desire the following agreement.


    § I. Mr von Niedzwiedzki receives, in addition to the twenty-six Hufen already taken in lease, a further
    13 Hufen, in writing thirteen Hufen Magdeburg measure, of arable and meadow for the six years of lease,
    and pays for this an annual rent of 625 Rthl, in writing six hundred and twenty-five thaler Courant;
    so that henceforth the whole rent of Kopojno amounts to 2125 Rthl, in writing two thousand one hundred
    and twenty-five Rthl.


    § 2'

- page: 1
  en: 'On behalf of the Right Honourable Chełmski — Judicial Site Inspection of the Lusnia Olędry


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Joannes
    Bikierski of Węgierki, Royal Court Summoner, General, being sound, certified — because he, having
    with him two noblemen, namely the Honourables Michał Borkowski and Jakub Kraśniewski, although absent
    here from the court for the present, being nonetheless present at the time at the location of the
    below-written matter — on the immediately preceding Wednesday, [went] to the estate of the Lusnia
    olędry at the request and official requisition of the Right Honourable Stanisław Chełmski, having
    personally descended; and being there in such manner, saw and duly inspected:


    At the tavern among the Lusnia [olędry]: the stove, three windows, four doors — newly repaired and
    fitted out by the Right Honourable His Worship Lord Chełmski — now chopped and cut out; the chimney
    demolished and the chimney stacks undercut; drinking vessels for beer and spirits smashed and chopped.


    Which aforementioned things, by the Honourables Lipiński, Marzęcki, and others, late at night, on
    29 January of the current year, violently attacking those same olędry, he asserted to have been done
    and inflicted. Concerning which he made the present report, and attested to the present office that
    he had duly seen and inspected all of these things.'

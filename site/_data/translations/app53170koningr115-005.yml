- page: 1
  en: 'Done in Konin on the Friday before the Feast of Saint Thomas the Apostle in the year of the Lord
    1771.


    On behalf of the Right Honourable Chełmski — Presentation of Weapons


    To the office and present records of the Konin Municipal Court, appearing in person, the Honest Nicolaus
    Krzepczyński of the village of Myszaków, Royal Court Summoner, General, by special commission of the
    Right Honourable Stanisław Ścibor Chełmski, heir of the estates of Łukom with their appurtenances,
    presented to the present office the below-listed weapons, namely: four swords in sheaths with leather
    belts; also one unsheathed [blade] fitted with iron; also four spears with iron tips fastened onto
    staffs; also three longer firearms and one firearm fitted with brass, loaded with lead and fine powder.


    Which aforementioned things — besides other weapons taken away by the below-named party — in the pine
    forest called Lusnia, built upon by the olędry, belonging to the estates of Łukom now and from antiquity,
    during the violent incursion of the Right Honourable Antoni Prusimski of Kolno, Starost of Niszczewice,
    heir of the contiguous estates of Trąbczyn, and the besieging of the innkeeper''s house by armed and
    lawless men, on the immediately preceding Monday — the same weapons having been seized by the Right
    Honourable Chełmski — the same above-named Court Summoner asserted to be so. Which, having been presented
    in this manner, he received back to himself, and was discharged from his office in respect of the
    received [weapons] in the presence of those present.'

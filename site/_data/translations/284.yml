status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Gracious Lord, I most certainly believed that with today''s post I should already
    be reporting to Your Serene Highness something definite and good, but the outbreak of the war hinders
    everything - yet something will happen - Trąbczyn, and even Kaemen and Kulm, are being received back
    by One Serene Highness for more - Mr Allexander has even brought our Most Gracious Lord to the point
    of signing the matter along with him, so that the Kohlen are to keep the estates which the S[equestration]-Commission
    has given back to them - consequently no reckoning is any longer to be made upon that. Now I lay before
    the Emperor and the King the just petition that Your Serene Highness be indemnified. My reckoning
    shall not be an inconsiderable one: 1. Your Serene Highness has had to pay v. Broniewski his pledge-money
    with about 60000 Rthl 180 3/5. To this the 15 years'' interest 33000 Rthl South - 93000 Rthl. Here
    it is to be noted that Meyer Bernhard did indeed give the money at that time, but this capital, like
    all the others, stands entered upon Betsche and the Cajowische estates, the latter of which the Jew
    M. Bernhard still holds in pledge for it to this day, wherefore this claim belongs to One Serene Highness
    in its entirety. 2. The Kaemener estates were at that time assessed by Otto''s courts at 180000 Rthl;
    deducting therefrom the above 60000 there remains 120000. Your Serene Highness must accordingly receive
    from Kaemen 213000 Rthl, namely 93000 Rthl in cash and 120000 Rthl in estates. 3. Of Trąbczyn, these
    estates were, as [I learn] through [me], assessed at 316000 Rthl; upon them there still stand the
    debts contracted by Your Serene Highness: 1. for Lichnowski 40000; 2. Grotowski 20000; 3. Seher Thos
    8000; there remains in value, and if they come through to advantage, 246000; together 459000.'
- page: 2
  en: 'The Emperor or the King must therefore give Your Serene Highness 366000 Rthl in debt-free estates,
    and those 93000 Rthl Your Serene Highness must receive in cash. Upon Trotzige there stood a further
    § 4000 for Lichnowski, but these are paid; still, one cannot demand them, because they were debts
    which Your Serene Highness had contracted. Weigel''s 30000 Rthl are transferred onto Zagoran. The
    [uncertain: Genorengen] gentlemen shall yet turn pale, and first I only want to know who is to compensate
    One Serene Highness - then I shall pick out what is useful and good. Mr P. Alegemann does nothing,
    beg as one will - now, on account of the outbreak of the war, he has the more excuses - by God''s
    assistance something in each matter will yet succeed. I can say nothing further as yet. Pourtales
    has not yet answered - he too must be watching the outbreak of the war. Meanwhile it says that he
    will certainly come, for otherwise he would have written to cancel. He was in Paris to call in his
    monies. That Napoleon is now said actually to be in Paris already; on the 18th, according to yesterday''s
    courier reports, he was already at fontaine bleau. Monc Rey has now also turned rogue. Here Napo:
    has written that his wife and his son are to be delivered up to him - and to be sent to him at Paris
    with his escort. O what is going on now! The mob now rules in France, for the adventurer has called
    them up and promised freedom and equality to the sans-culottes. It is a nation which at bottom one
    must abhor - the rabble there is said to house worse than a herd of devils, and to inscribe their
    march, wherever they go, with cruelty and atrocities which no man is able to describe. The King of
    France is said to be in Lille, and what is most [uncertain: verdauerdigste] is that not a shot has
    yet been fired by the King''s troops - the evil one does not go thither with his host unmolested;
    everything gets out of his way as from a mad dog. In the newspapers, reasonings of boundless loyalty
    and devotion to the King are'
- page: 3
  en: 'set forth; Bonaparte''s force is put down at 8 to 10 men, and nevertheless the E[mperor] is in
    Paris and drives out the adored King. Here the gentlemen listen out for whether they will not be called
    upon from France''s side for aid - they [uncertain: rouse themselves] and let [text lost] Heaven would.
    Meanwhile the [uncertain: robber] and the [uncertain: Cancellie] go so far that hundreds of thousands
    will have to be led to the shambles. O tempora o mores - King Murat too is said now already to be
    raising his head, and before anyone is aware of it he will be running riot in Italy and pressing on
    right up to the gates. Distress, or rather dearness, here now exceeds all bounds - for what are the
    poor to be mobilised and war to be waged? One looks forward to the most unthinkable suns of terror.
    The Wurtemberg affair has, according to the reports come in this night, [uncertain: turned out] scandalously
    for the fat Majesty. Let Your Serene Highness read the enclosures and be astonished. Prince Stadt
    and Mr Metternich also set this corpulent creature down very hard in [uncertain: Grünke], and now
    the more than boundless disgrace - that his own brothers place him so [uncertain: early] in the pillory
    - poor Duke Willhelm, who after all played the part of Minister of War with him, him the tenderly
    thankful Majesty at once drove off; the son of Eugen too he has, out of Most Gracious clemency, ordered
    to go straight to the devil; the [uncertain: Honrichs] and Loar he has threatened to have imprisoned
    for ever - the affair causes much amusement here. What vexes me is that the wisdom of his Diet''s
    President is so odiously persiflated. This Illustrious gentleman is now cruelly hauled over the coals
    both here and by the mediatised. Perhaps I shall be in a position to send in more comforting reports
    with the next post than hitherto. In deepest reverence I remain, until death, Your Serene Highness''s
    [text lost]

    Wien, the 27th of March 1815

    I beg very much for German and French Blanquettes - ah, and were it possible to see Eberhard here,
    for hardly anyone will take the settlement in hand[?] - your most obedient servant v Triebenfeld'
- page: 4
  en: 'According to the courier just arrived, Bonaparte is in Paris and has already been proclaimed Emperor
    again - Davout is Minister of War and [uncertain: Seige] Minister of the Interior - the thick fat
    King now sits with his kindred at Lille. Who then is to call the foreign troops into France, for which
    the other gentlemen appear to be waiting. O, that is indeed a wretchedness without equal. This very
    moment the news comes in that in Paris it has come to a great brawl between the Bonapartist rebels
    and the Royalists - the end of this is not yet known. This would be a piece of good fortune, for then
    the [uncertain: godfathers] would soon have to be called in. As to Berlin, everything that happens
    and everything that [uncertain: is heard] is becoming very [uncertain: perhiseliers] - Prince Hardenberg
    has lost all his cheerfulness.'

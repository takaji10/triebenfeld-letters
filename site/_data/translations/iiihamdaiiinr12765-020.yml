- page: 1
  en: 'To the widowed Colonel''s wife von Brehmer, by way of resolution: The representation addressed
    by her under the 26th of April of this year to the Prince State Chancellor was transmitted by His
    Serene Highness to the section chief for further action. In order that she may be satisfied, out of
    the remaining property of the Prince, her debtor, as regards the capital of 5000 Rthl lent by her
    to the Prince of Hohenlohe-Ingelfingen and registered upon the estate of Szetlewek confiscated in
    the year 1807, it is [uncertain: Inverderst] necessary that he be sued before his judicial authority:
    so that the claim may stand established at law, and may be [uncertain: berüber.] adjusted, in case
    the Russian'

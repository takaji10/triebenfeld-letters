- page: 3
  en: 'of the Prince before His Majesty the Emperor, to bring this circumstance also into discussion:
    at the same time etc. he is requested: in case His Majesty the Emperor should be pleased to grant
    the Prince some compensation, to inform the section chief thereof without delay, so that the said
    creditors may be caused to pursue their rights further.


    B[erlin], 15 June [18]16.


    B[alan].'

- page: 2
  en: 'Emperor''s Majesty should be pleased to declare himself inclined [uncertain: Ingenähmen] the Prince
    some compensation on account of the loss of Szetlewek and Trąbczyn.


    B[erlin], 18 June [18]16.


    B[alan].


    2. To Mr von Schöler [uncertain: in] St Petersburg, with reference to the letter of 29 April


    of this year, it is to be communicated: that since the Prince of Hohenlohe has let Trąbczyn together
    with its appurtenances deteriorate and has loaded it with debts, the mortgage creditors, through the
    confiscation of the estate which took place in the year 1807, are in danger of losing the capitals
    lent out; that it is left to his discretion, when he supports the claim for compensation'

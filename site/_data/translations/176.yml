status: draft
segments:
- page: 1
  en: 'Right Honourable Sir, Highly Honoured Sir, Councillor of War and Forests! To Your Right Honourable
    I hereby report most obediently that yesterday afternoon and at 6 o''clock, by express courier, the
    news arrived of the decease of the reigning Prince zu Hohenlohe Neuenstein, Serene Highness; the aged
    gentleman on the 20th of July still shot a piece of fir-wood in the game park, was seized on the 24th
    of the same month by the [uncertain: Rathlauf], which was an ordinary illness with him, and ended,
    through an apoplectic stroke that supervened, on the 27th early after 10 o''clock'
- page: 2
  en: 'his pious and praiseworthy life. At Oehringen, as in all Hohenlohe places of this branch of the
    line, possession was at once taken, in accordance with the testament which has named my most gracious
    Prince sole heir of these fine lands — and town and country joyfully rendered the oath of fealty.
    Attempts were made on the part of the Princes zu Langenburg and Kirchberg to exercise [uncertain:
    geheliche] measures, grounded upon a certain misunderstood partition treaty; but manful resistance
    was offered by the [uncertain: Aufaenger] of the Ingelfingen side, the troops were turned back, and
    the Ingelfingen patents of taking possession'
- page: 3
  en: 'were posted up, and there too, where on the opposing side they permitted themselves — to post up
    theirs, these were taken down again and the Ingelfingen ones affixed in their place. Thus stands the
    whole affair at present — and the arrival of His Serene Highness is most ardently awaited there, as
    now lord of the most flourishing fields of Franconia. His Highness will also set out upon the journey
    thither in the month of September, once the Silesian [uncertain: Reonen] are concluded; how long the
    stay will last is still undecided; only that His Serene Highness now believes he must leave over all
    the South Prussian affairs the more to Your Right Honourable''s wise discernment, since His Highness
    will again be away for a considerable while'
- page: 4
  en: 'All this I have wished to report to the same as is my bounden duty, and permit myself only further
    to add the assurance of true veneration, in which I ever have the honour to be Your Right Honourable''s


    Breslau, the 4th of August 1805


    humble and obedient servant

    A. Hahn'

- page: 1
  en: 'To His Most Serene Highness. The Countess Schlabrendorff will wait for the 50,000 Rthl. until Christmas,
    or properly speaking until the 1st of January 1805; to a longer term Homuth has not been able to move
    her. She made a most piteous business of having to lose so much, and, since she received no interest
    from this capital, the loss would be greater still were she to wait beyond the 1st of January 1805
    — If it be so that Your Serene Highness need pay no interest until that date, then I believe it will
    come easily to rest content with this term. There are, after all, 2,500 Rthl gained thereby, and by
    that time money enough will come in — Homuth asks for the settlement, so that he may draw up what
    is needful and send it to the Countess for execution. He will try whether he can, on that occasion,
    get the old bills of exchange back.


    The surveyor Cabanis has departed. He will hire himself a peasant cart out in the country, which he
    believes he can get for 4 or 5 Rthl. Here the hackney coachmen wanted to have 20 Rthl. and demanded
    besides an allowance for [uncertain: Entter] and God knows what else.


    Wrocław, the 29th of March 1804.


    v Triebenfeld'

- page: 1
  en: '(To His Most Serene Highness) The Countess Schlabrendorff will wait for the 50000 Rthl until Christmas,
    or properly speaking until the 1st of January 1805; Homuth has not been able to move her to a longer
    term. She made very piteous complaint that she must lose so much, since as she received no interest
    from this capital, the loss would be still greater were she to wait longer than until the 1st of January
    1805 — If it be so that Your Serene Highness need pay no interest until then, I believe it will be
    an easy matter to rest content with this term. There are, after all, 2500 Rthl gained thereby, and
    by that time money enough will come in – Homuth asks for the agreement, so that he may draw up what
    is needful and send it to the Countess for execution. He will try whether he can, on that occasion,
    get the old bills of exchange out of her hands.


    The surveyor Cabanis has departed. He will hire himself a peasant''s cart out in the country, which
    he thinks to get for 4 or 5 Rthl. Here the hackney-coachmen wanted 20 Rthl and demanded besides upon
    [uncertain: Entter] and God will be some assistance


    v Triebenfeld


    Breslau[illegible] the 29th of March 180'

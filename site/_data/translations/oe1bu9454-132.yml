- page: 1
  en: 'My dearest Friend. I am just now on the point of stepping into the carriage and returning to Breslau.
    It was enough to drive me mad, to sit here so long [uncertain: sezziauf] waiting upon Mr. Glenck,
    and in the end to accomplish nothing. The result is always that people fish in troubled waters and
    mean to profit barbarously at the Prince''s expense. At Betsche the people have in so short a time
    gained thirty thousand [uncertain: rung] without having to put themselves to the least trouble. The
    subjects merely buy themselves free and give 30000 mk more than the purchasers gave. Meanwhile the
    latter profit by this sum. Spoiled by this business, at Kaemen still more than this was to be gained
    at once, and yet God knows what screws are then to be applied to the Prince — in this I cannot intervene,
    and therefore I depart with nothing accomplished. — Now, my dear Friend, see to it only that [uncertain:
    dh Ere] Director Stubenrauch buys the estates and provides the money. — I will stand surety to the
    man for a clear and perpetual [uncertain: Revencie] of 10000 Rthl yearly, if I may dismember the estates
    — this would amount, reckoned at 5 per cent, to a capital of 200000 Rthl. But since Mr. G. has been
    assured that the Order''s capital is content if'

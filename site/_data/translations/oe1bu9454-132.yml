- page: 3
  en: 'subsisting [uncertain: Vereine] of 12000 Rthl to bring out, and consequently a value at 4 per cent
    of 300000 Rthl; according to which the Order''s Chamber would profit by 120000.


    Take this to heart, and seek to move that worthy good man, Chamber Director Stubenrauch, to make the
    purchase and to provide the moneys for it by Midsummer Day of this year. In the matter of the Koltzig
    estates, or in the business of indemnification, seek to effect the best; but do go cautiously with
    the Cabinet Councillor, for at present I fear that man extraordinarily.


    With the most faithful heart and the greatest attachment I am unceasingly


    Your


    Frankfurt an der Oder


    the 23 May 1804.


    most faithfully devoted servant v Triebenfeld'

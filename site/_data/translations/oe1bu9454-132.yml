- page: 2
  en: 'it has 4 per cent clear interest on its capitals, then one might set the value of the estates at
    250000 Rthl. Now, however, the Prince would be very well content with 180000 Rthl, since he needs
    money, consequently [uncertain: gewandts] capital of 70000 Rthl in cash upon this purchase. You could
    further urge that the Chapter, or the Order''s Chamber, should, if still more were brought out, give
    a percentage commensurate with the matter.


    In case Director Stubenrauch will agree to this, have the kindness to send me an express courier;
    I shall hasten back to Berlin at once, conclude the matter and perform the [uncertain: Evection].


    Had I known the business thus earlier, all would already be settled, and much could have been gained
    by it. But as it is, one always learns everything too late.


    Mr. Gleich has always reckoned upon a purchase-money of 500 Rthl per Hufe, which the people were to
    pay — in this respect he [text lost] to assume a light hereditary rent of 10 to 12 [uncertain: st]
    per [uncertain: Hure], and the value of the estates was diminished; but if I now take no entry-money,
    the subject willingly pays 50 Rthl per Hufe yearly. By this means a far higher value now comes out,
    so that I am still able, out of the old rents and for beer and brandy excise, an everlasting'

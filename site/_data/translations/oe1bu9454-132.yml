- page: 3
  en: 'subsisting [uncertain: revenue] of 12,000 Rthl, and consequently a value at 4 per cent of 300,000
    Rthl; on which footing the Order''s Chamber would profit to the extent of 120,000.


    Take this to heart, and seek to move that worthy good man the Chamber Director Stubenrauch to make
    the purchase and to furnish the moneys for it by Midsummer of this year. In the matter of the Koltzig
    estates, or in the business of compensation, seek to bring about the best that may be, but do go cautiously
    with the Lord Cabinet Councillor, for at present I fear that man extraordinarily.


    With the most faithful heart and the greatest attachment I am unceasingly


    Your


    Frankfurt an der Oder


    23 May 1804.


    most faithfully devoted servant


    v Triebenfeld'

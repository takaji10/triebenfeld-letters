- page: 2
  en: '[uncertain: it] has 4 per cent clear interest from its capitals, then the value of the estates
    might be taken at 250,000 Rthl. Now, however, the Prince, since he needs money, would be very well
    content with 180,000 Rthl, consequently [uncertain: the chapter would gain] 70,000 Rthl in cash by
    this purchase. You might further urge this, that the chapter or the Order''s Chamber, if still more
    were to be got out of it, would have to give a bonus proportionate to the matter.


    In case the Lord Director Stubenrauch will agree to this, have the kindness to send me an express
    courier; I [uncertain: hasten] then straight back to Berlin, conclude the matter and provide the warranty
    of title.


    Had I known the business thus sooner, everything would already be settled, and much might have been
    gained by it. As it is, one always learns everything too late.


    Mr Glenck has all along reckoned on a purchase money of 500 Rthl per Hufe, which the people were to
    pay — With this in view he [would] assume a light hereditary quit-rent of 10 to 12 Rthl per Hufe,
    and the value of the estates was thereby diminished; but if I now take no entry money, the subject
    willingly pays 50 Rthl per Hufe yearly. By this means an enormously high value now comes out, so that
    I am still able, out of old rents and for the beer and brandy excise, to bring out a perpetually'

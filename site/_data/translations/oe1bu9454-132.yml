- page: 1
  en: '132


    My dearest Friend, I am just now on the point of stepping into the carriage and returning to Wrocław.
    It has been enough to drive me mad, to sit here so long [uncertain: to sit] waiting upon Mr Glenck,
    and in the end to accomplish nothing. The result is always that people fish in troubled waters and
    want to profit barbarously at the Prince''s expense. At Pszczew the people have gained thirty thousand
    Rthl in so short a time, without having to put themselves to the least trouble. The subjects merely
    buy themselves free and give 30,000 Rthl more than the purchasers gave. Meanwhile the latter pocket
    this sum. Spoiled by that transaction, at Kamionna still more than this was to be gained at once,
    and yet God knows what screws were then to be applied to the Prince — into this I cannot intervene,
    and so I depart with nothing accomplished — Now, my dear Friend, see to it that [uncertain: the gentleman]
    Director Stubenrauch buys the estates and furnishes the money. — I will stand surety to the man for
    a clear and perpetual revenue, if I am permitted to dismember the estates, of = 10,000 Rthl yearly
    — this would amount, reckoned at 5 per cent, to a capital of 200/m Rthl. But since Mr Glenck has been
    assured that the Order''s capital is content if'

    Thus done at Wrocław, the 7th of October in the year 1805. (L. S.)


    Richter


    Royal Government Auditor here.


    [We have] ratified and approved [the same], according to its whole content and the order of succession
    prescribed therein by the right of primogeniture, out of the plenitude of Royal power. We do so also
    hereby and by virtue of these presents, ratify and approve the foregoing extract of the will in every
    respect, and will that the foundation contained therein shall be valid for all time; saving, however,
    Us in Our rights and in the obligations which lie upon the Prince and the Princess with regard to
    the cabinet orders of


    27 September and 25 October 1804, and likewise saving to every man his well-acquired and well-founded
    rights, and with the provision that the legal prescriptions, according to which none of Our vassals
    may reside outside the country'

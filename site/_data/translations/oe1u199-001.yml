- page: 3
  en: 'containing the above-named family entailed estate and fideicommiss, from the will of the Serene
    reigning Prince Friedrich Ludwig of Hohenlohe-Ingelfingen drawn up under date Wrocław the 7th of October
    1805, which runs word for word as follows:


    Copy of an extract from the will which His Serene Highness the reigning Prince of Hohenlohe-Neuenstein-Ingelfingen
    deposited with the Wrocław Government Court on the 9th of October 1805.


    § XII. Already in the settlement I declared that I would likewise raise to an entailed estate various
    considerable portions of My private fortune, for the founding of the flourishing of My Princely House.
    I therefore declare first of all:


    1. My houses in Wrocław, and consequently also the Schulzius house first newly purchased in the past
    year, which is at present joined with My older house, as it stands and lies;


    2. My park and gardens at Szczytniki, including both the dwelling houses belonging thereto and also
    including'

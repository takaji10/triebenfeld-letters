- page: 6
  en: 'in proper form.


    § XIII. Now, in order further to promote the flourishing of My Princely House, I will by the present
    solemn legal disposition also have the hitherto allodial estate of Bytków purchased by Me hereby made
    into an entailed estate, and namely have the same added to the Sławięcice ironworks department. I
    here make it the express duty of the lord of the entailed estate to complete, in the greatest possible
    extension, the establishment of a coal-fired blast furnace erected by Me but not yet quite finished,
    and to hold firmly and inviolably to the partnership contract concluded by Me with Mr Baildon upon
    this matter; also always to preserve this gentleman in his present connexion with the Sławięcice works,
    and to make use of his good counsel, as one who in My conviction can be of excellent service to the
    interest of this branch of estate economy.


    § XIV. I have also purchased the lordship of Koszęcin and the lordships connected therewith, Boronów,
    Olszyna, Harbultowitz'

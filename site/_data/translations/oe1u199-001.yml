- page: 4
  en: 'the garden in Szczytniki purchased by Me from the Countess von Götz, in the most solemn legal form
    as an entailed estate, as described above. I add to this entailed estate, and hereby declare incorporated
    in it, the furnishings and all the utensils to be found in My houses here and in the town and at Szczytniki,
    and likewise in the pleasure-houses there. Namely, all My silver plate to be found here, porcelain
    table centrepieces, linen, paintings, copper engravings. All this is to be well preserved by every
    future lord of the entailed estate, and he may indeed make improvements and alterations therein as
    fashion changes and so forth, at his pleasure; but the value as a whole, and the silver by weight,
    shall never be diminished.


    My library and map-room here I likewise add to the entailed estate. My eldest son must, however, not
    withhold from his younger brothers whatever may be of use to them from the library and map-room for
    their military study.


    I also make it the express duty of My eldest son, and of every successor in the entailed estate, to
    keep the road and the bridge to the garden always in good'
  names:
  - de: Gräfin von Götz
    en: Countess von Götz
    kind: person
  - de: Scheitnig
    en: Szczytniki
    kind: place
- page: 5
  en: 'repair; likewise to conserve well all the plantations in the park, and also the water features
    in the same, and to increase and improve them according to his good taste; in particular to have the
    replanting of the [text lost] commended to him, and above all to conserve diligently and in the best
    structural condition, for all time, the monuments set up by Me to the three Kings of Prussia whom
    I have served. At the same time I hereby ordain that the garden and park at Szczytniki shall, under
    every future lord of the entailed estate also, remain a public promenade for the public of Wrocław.
    Yet every possessor may in return require decent conduct of the public and faithful care of the park
    and of all its parts.


    In this regard I also hereby address to the Wrocław Government and to the Police Directorate here
    the urgent request to take this place of pleasure, and this walk dedicated by Me to the general enjoyment,
    under their special protection and supervision.


    My heir shall duly forward and convey to these high authorities a copy of the extract of the present
    passage of My will'

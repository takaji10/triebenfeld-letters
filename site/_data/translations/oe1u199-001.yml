- page: 8
  en: 'in his sickliness depart this life early, then I advise My dear successor to place at the head
    of the Koszęcin administration also the Lasowice ironworks inspector Koenig, who is very experienced
    in ironworking and truly deserving; in which [administration] the best possible forestry management
    and the ever-increasing cultivation and improvement of the ironworks likewise founds the most solid
    Revencirch funds.


    § XV. Finally I also declare those estates and lordships which I leave behind Me at My death in South
    Prussia to be an entailed estate, namely the lordships of Pszczew, Zagórów and Trąbczyn, Bątkowo and
    Wieniec.


    § XXIV. Since all My entail foundations relate only to the flourishing of My House and Princely name,
    I have already in the settlement of 1799, § 10 no. 8, had the power conveyed to Me to dispose freely,
    by a particular disposition, also in respect of the Uxoral Güter made into entailed estates for My
    male line, for'

  en: 'the event of the extinction of My male line. Partly by virtue of this reservation, partly by virtue
    of My own right, I therefore ordain that, in case My male descent in all three lines of My beloved
    Princes should — which may fate avert to the latest times! — die out and be extinct, then:


    1. The estates of Sławięcice, Birawa, Stara Kuźnia, Lasowice, together with the manufactories and
    ironworks belonging thereto, as also the estate of Bytków, and the estate of Landsberg possibly still
    to be purchased, [shall fall] to My eldest daughter Adelheid or her future descendants;


    II. All the Saxon estates, as also the lordship of Koszęcin and the lordships connected therewith,
    Boronów, Olszyna, Harbultowitz and Czysowa, to My second daughter Emilie and her future'

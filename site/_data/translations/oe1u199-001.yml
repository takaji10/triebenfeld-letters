- page: 2
  en: 'most humbly given Us to understand in what manner, in order to preserve the flourishing of the
    Princely House of Hohenlohe, he has founded in his will drawn up on the 7th of October 1805 a family
    entailed estate and fideicommiss, for which he designates his houses in Wrocław, his park at Szczytniki,
    his Silesian allodial estate of Bytków, the Silesian lordship of Koszęcin purchased by him together
    with the estates connected therewith, Boronów, Harbultowitz, Olszyna and Czischowa, and finally those
    estates which he possesses in South Prussia, namely the lordships of Zagórów, Trąbczyn, Pszczew, Wieniec
    and Batkowo; with the added most humble request that, since the erection of such an entailed estate
    and fideicommiss cannot take place under the laws of the land without Our sovereign approbation, We
    might most graciously be pleased to grant him the same; whereupon We have then granted this request
    out of the particular royal favour and goodwill We bear towards the aforementioned reigning Prince
    of Hohenlohe-Ingelfingen and his family.


    Accordingly We have, the extract most humbly presented to Us'

  en: 'without Our express permission, are also to be exactly observed by each successive possessor of
    this entailed estate and fideicommiss. We therefore command and enjoin all Our Supreme Provincial
    Colleges, as also each and every one of Our vassals and subjects, of whatever estate, dignity or condition
    they may be, but in particular Our Silesian Supreme Provincial Governments and Our South Prussian
    Governments, and moreover every man whomsoever, that they conduct themselves most obediently accordingly,
    and leave the successors and descendants of the oft-mentioned reigning Prince Friedrich Ludwig of
    Hohenlohe-Ingelfingen quiet and undisturbed in the operation of the family entailed estate and fideicommiss


    institution most graciously confirmed by Us and duly to be entered in the relevant mortgage books;
    that on the contrary they neither contest, hinder nor trouble them therein, nor occasion or permit
    that such be done by others, upon pain of Our highest displeasure and unfailing severe punishment.'

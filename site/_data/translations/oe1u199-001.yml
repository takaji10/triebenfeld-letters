- page: 11
  en: 'at the extinction of the male line — which early death may fate avert — then the Princess would
    enjoy the usufruct of the share assigned to her for her lifetime. Thereafter, however, upon her death
    the same shall descend to the firstborn male descendant; and in her male descent the assigned share
    remains a family fideicommiss according to the right of lineal succession and of primogeniture, but
    in the person of the last male descendant it becomes free allodium.


    II. The same shall be held if My own Princess daughter is no longer living at the extinction of My
    male line. Her share then falls at once to the firstborn of the first line of her male descendants,
    and in the further transmission it shall be held just as before stated.


    III. If at the extinction of My male'
  numbers:
  - II
  - III
- page: 12
  en: line one of the Princesses has also died without leaving any male or female descent, then her share
    falls to the two remaining Princesses and their descendants in equal parts. But if there is still
    female, though no male, descent of the Princess, then the female descendants then living succeed to
    her share as to a free allodium; yet not in Capita but in Stirpes. That the foregoing and overleaf
    copy of the extract of the will of His Most Serene Highness the reigning Prince of the Empire of Hohenlohe-Neuenstein-Ingelfingen
    has, after careful comparison and collation, been found conformable to and agreeing with the original
    laid before the undersigned, is hereby on the part of the Royal Government Court here

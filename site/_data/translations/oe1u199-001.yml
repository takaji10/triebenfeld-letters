- page: 1
  en: 'Ten Thousand Thaler


    We Friedrich Wilhelm, by the Grace of God King of Prussia, Margrave of Brandenburg, Arch-Chamberlain
    and Elector of the Holy Roman Empire; sovereign and supreme Duke of Silesia, sovereign Prince of Orange,
    Neufchatel and Vallangin, as also of the County of Kłodzko, Duke of Magdeburg, Cleve, Berg, Szczecin,
    Pomerania, of the Cassubians and Wends, of Mecklenburg and Krosno Odrzańskie; Burgrave of Nuremberg,
    above and below the mountains, Prince of Hildesheim, Paderborn, Halberstadt, Münster, Minden, Cammin,
    Wenden, Schwerin, Ratzeburg, East Frisia, Eichsfeld, Erfurt, Essen, Quedlinburg and Elten, Count of
    Hohenzollern, Ruppin, the Mark, Ravensberg, Hohenstein, Tecklenburg, Schwerin, Lingen, Bühren and
    Leerdamm; Lord of the lands of Rostock, Stargard, [uncertain: Werden], Limburg, Lauenburg, Bütow,
    Arlay and Breda, etc. We do hereby make known and confess, for Ourselves and Our successors in the
    government, that, whereas the Serene Prince, Our friendly dear cousin, Friedrich Ludwig of Hohenlohe-Ingelfingen,
    Our General of Infantry, Governor of Wrocław, Inspector of the Lower Silesian and Franconian Infantry
    Inspections, Knight of Our Red and of Our Great Black Eagle Order, has'

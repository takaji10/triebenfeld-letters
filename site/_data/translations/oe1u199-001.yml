- page: 7
  en: and Czyschowa, for about one million thaler. Their true value may, however, well reach fourteen
    hundred thousand thaler. Into these estates I have paid two hundred thousand Reichsthaler in cash;
    and I can therefore safely reckon that I already at present possess in them a clear property of five
    hundred thousand thaler, whereby I have at the same time worked towards regulating the debts still
    resting upon them in such a way that I cannot be incommoded by any calling-in of them, but that it
    depends upon the possessor whether, when, and how much of them he will successively discharge and
    pay off. This lordship of Koszęcin too, and the lordships connected therewith, Boronów, Olszyna, Harbultowitz
    and Czyschowa, I hereby make into an entailed estate, as characterised above. To My eldest son, the
    Hereditary Prince August, who thus succeeds Me first in these estates also, I commend the mining councillor
    Bernhardi, who now directs the administration. Should he, however,

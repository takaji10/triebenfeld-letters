    III. All the South Prussian estates to My third daughter Auguste and her future descendants.


    IV. My houses in Wrocław and the park at Szczytniki, together with all appurtenances, to the Princess
    Adelheid, My eldest daughter, and her descendants, likewise alone,


    shall fall and be assigned. How matters are to be handled with the Öhringen fideicommiss capital of
    the 200,000 fr [illegible] has already been disposed of above.


    All the remainder, which is not mentioned here, becomes free allodium in the person of the last possessor
    and male descendant out of all three lines of My Princes. With those allotments, however, it shall
    be held as follows.


    I. Were one of My three Princesses still living'

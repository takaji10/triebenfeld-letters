- page: 2
  en: 'Our intention of giving to the High-Born Prince, Our friendly beloved Uncle, Friedrich Ludwig,
    reigning Prince of Hohenlohe-Ingelfingen, by the grant of the estates formerly belonging to the absconded
    former Starosta von Prusimski, a mark of Our friendship and goodwill borne toward him, as also of
    Our Royal gratitude for the distinguished and beneficial services rendered to Us and to Our Royal
    House, has not been achieved entirely as We had willed it, because the said estates were burdened
    with many debts; We have most highly resolved to leave over, to grant and to convey to Your Lordship,
    in heritable and proprietary right, the hereafter named formerly ecclesiastical estates, namely the
    villages of Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum, Swiątniki, Kopojno,
    Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienitz and Wolica, together with all their appurtenances, by
    whatever name they may be called, against payment


    1., of the territorial-sovereign dues hitherto discharged therefrom,'

- page: 10
  en: 'entered against the town of Zagórów in the mortgage book; and for the rest this mortgage certificate
    is hereby issued to the present possessor, the reigning Prince of Hohenlohe-Ingelfingen, Friedrich
    Ludwig, Serene Highness, by way of recognition, on account of the title of possession entered for
    him on the ground of the instrument of grant dated Berlin, the 19th of July 1797. In witness whereof,
    under the greater seal of the Royal South Prussian Government and the customary signature.


    Given at Kalisz, the 29th of August 1801. Danckelmann (L. S.) Husarzewech[uncertain: Husarzewech]
    Mortgage certificate for the reigning Prince Hohenlohe-Ingelfingen, Friedrich Ludwig, Serene Highness,
    concerning the town of Zagórów situated in the Province of South Prussia and in the Konin district
    thereof.


    That the foregoing copies agree entirely with the originals laid before me, I hereby attest in good
    faith.


    Trąbczyn, the 4th of October 1804


    Schenck, justice-burgomaster'

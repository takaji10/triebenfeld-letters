  en: 'Copy


    We Friedrich Wilhelm, by God''s Grace King of Prussia etc., Margrave of Brandenburg, Arch-Chamberlain
    and Elector of the Holy Roman Empire, sovereign and supreme Duke of Silesia, sovereign Prince of Orange,
    Neufchatel and Valangin, as also of the County of Glatz, Duke in Geldern, at Magdeburg, Cleve, Julich,
    Berg, Stettin, Pomerania, of the Cassubians and Wends, at Mecklenburg and Crossen, Burgrave of Nuremberg
    above and below the mountains, Prince of Halberstadt, Minden, Camin, Wenden, Schwerin, Ratzeburg,
    East Frisia and Meurs, Count of Hohenzollern, Ruppin, of the Mark Ravensberg, Hohenstein, Tecklenburg,
    Schwerin, Lingen, Bühren and Leerdam, Lord of Ravenstein, of the Lands of Rostock, Stargard, Limburg,
    Lauenburg, Bütow, Arlay and Breda etc., do by this Our open letter attest and declare, for Ourselves
    and Our descendants and successors in the Crown, the Electorate and Our remaining Lands, that, whereas
    it has been most humbly laid before Us in what manner'

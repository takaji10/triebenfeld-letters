- page: 8
  en: 'in the name of the Lordship of the Lord Prince of Hohenlohe-Ingelfingen. Thus done under the customary
    signature and greater seal. Kalisz, the 7th of July 1801. Royal South Prussian Government (L. S.)
    Schulz


    The town of Zagórów, situated in the Province of South Prussia and in the Konin district thereof,
    has been conveyed to the reigning Prince of Hohenlohe-Ingelfingen, Friedrich Ludwig, Serene Highness,
    in heritable and proprietary right, by His Majesty King Friedrich Wilhelm the Second, by the instrument
    of grant dated Berlin, the 19th of June 1797,'

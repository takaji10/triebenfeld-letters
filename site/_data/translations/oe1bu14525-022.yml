- page: 3
  en: 'of the territorial-sovereign dues, as a fixed and unalterable canon, and


    2.) of the allowance due therefrom to the ecclesiastical corporations or foundations, in heritable
    and proprietary right.


    This We also hereby do, and by force of this present instrument, out of Royal power and plenitude,
    for Ourselves and Our descendants and successors in the Crown, the Electorate and Our remaining Lands,
    in such manner and to this effect, that Our aforesaid friendly beloved Uncle, the reigning Prince
    of Hohenlohe-Ingelfingen, shall have the above-named estates with all rights attaching thereto'
  names:
  - de: Hohenlohe V. Ingelfingen
    en: Hohenlohe von Ingelfingen
    kind: other
  numbers:
  - '1796'
  - 2.)
- page: 4
  en: and prerogatives, as these have hitherto been exercised or may lawfully be exercised, and no less
    with all their pertinences and other appurtenances, by whatever name they may be called, as the same
    have hitherto been enjoyed, or may lawfully be enjoyed, and with all the lands belonging thereto,
    in fields, woods and meadows, likewise in ponds and waters, from henceforth for all eternity, for
    himself and his heirs and descendants, as a true, well-acquired and unrestricted proper-
- page: 5
  en: 'ty, irrevocably from Us and Our descendants and successors, to hold, possess and enjoy; and that
    the power and authority shall also be attached thereto of disposing of the same at pleasure under
    the conditions mentioned above, unhindered by any man.


    We therefore command and enjoin all Our supreme provincial colleges, as also all other authorities
    whom this concerns, herewith as graciously as earnestly, that they in no wise hinder or impede the
    Lordship of the much-mentioned Lord Prince of Hohenlohe-Ingelfingen in the heritable and proprietary
    possession of the above-named estates, together with their pertinences and appurtenances, granted
    to him, nor'
  names:
  - de: Hohenlohe Ingelfingen
    en: Hohenlohe-Ingelfingen
    kind: other
- page: 6
  en: him or those upon whom he may one day devolve the same by inheritance, or otherwise lawfully transfer
    it by other acts among the living or on account of death, but rather shall let Your Lordship, and
    eventually also them, enjoy the same freely and undisturbed, doing nothing themselves against it,
    nor occasioning or permitting that such be done by others, on pain of Our most high displeasure and
    unfailing severe punishment. In witness whereof We have signed the present instrument of grant with
    Our most high own hand, and caused Our greater Royal seal to be appended thereto.
- page: 7
  en: 'Thus done and given in Our Residence City of Berlin, the nineteenth day of the month of June after
    the birth of Christ Our Lord, in the one thousand seven hundred and ninety-seventh, and of Our Royal
    reign in the eleventh year. Friedrich Willhelm. Hoym. Reck.


    Instrument of grant for the reigning Prince of Hohenlohe-Ingelfingen, for the heritable and proprietary
    possession of the villages of Betsche, Świechocin, Stoki, Łowyń, Głażewo, Tarmowo, Zagórów, Skokum,
    Swiątniki, Kopojno, Olesnica, Drzewce, Grądzyń, Wrąbczyn, Wienitz and Wolica, together with appurtenances.
    It is hereby attested that this authenticated copy has been made for the purpose of the entry of the
    title of possession with respect to the estates named therein'

- page: 9
  en: 'and the title of possession has been entered for him by decree of the 31st of July 1801.


    Thereupon are entered


    I. Perpetual burdens, restrictions of the property or of the disposition


    1., By virtue of the ordinance of the year 1796 and the Court rescript of the 24th of February 1800,
    this estate may not be sold to a native of the country without special consent, which has been noted
    here ex officio by decree of the 31st of July 1801.


    II. Judicially secured debts and other real obligations.


    nothing


    Apart from the foregoing restriction, nothing is'

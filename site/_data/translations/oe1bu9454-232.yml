- page: 4
  en: 'of the villages of New and Old Swięcia, of the village of Wrąbczyn, of the village of Old Oleśnica,
    Skokum, the colony of Sophienthal, Kopojno, and the colony of Adelow, and to have them paid against
    receipt; I also consent that the said von Triebenfeld may have this money levied by execution through
    a komornik, without its first having to be applied for by judicial assistance." This, made out by
    His Serene Highness''s courts, I beg may be sent to me by a [uncertain: rentencken] express with all
    possible speed, so that I may keep my foot in the [uncertain: Carrieren] and may have some money levied.
    For the rest, there is here a want that surpasses all conception; the marches through have consumed
    everything — grain, cattle, horses, sheep, and they have taken the [fodder], so that the people are
    reduced to grazing grass together with the beasts.


    As regards the [uncertain: Brieges P(i/r)ecz] most graciously sent to me, it is not valid, for this
    sum is, according to the Konotop contract, determinately assigned and undertaken to be paid to him.


    In deepest respect, I remain, until death,


    Your Most Serene Highness''s


    Kopojno


    the 16th of June 1811, most humble and obedient


    von Triebenfeld'

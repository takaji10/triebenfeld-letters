- page: 2
  en: 'now to fix and establish a norm between the manorial lordship (Dominium) and the subjects, and
    to draw the chicaners into a fiscal investigation. Count Kwilecki, who was with me here just now,
    is gathering [uncertain: Stiennen] in order to press for the dismissal of Szymanowski, who is our
    great friend; this may take 4 weeks of dragging about, and in the meantime I shall still have to suffer
    [illegible] want.


    The Herrlichen cash office has now [moved] for execution upon the arrears of interest, but the Procurator
    will have the kindness to order that all the residues, as I direct them, be taken as day-money, levied
    by force, and the interest owing discharged. If that succeeds, then I come clear here, and at most
    4000 rt. remain over, if the contract with Brzechffa holds — My and Brzechffa''s plan is, once I have
    been [recovered], to go to Warsaw. To pursue the Trąbczyn business, likewise the Wrąbczyn and others,
    from the fief we [come] back and come to Sławięcice; in the meantime the suit with Meierowitz will
    also be'

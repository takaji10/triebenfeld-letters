status: draft
segments:
- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord, that Your Serene Highness has sent someone here who has satisfied himself
    of the situation here and of my misery is good – I have lain very ill for many weeks, [uncertain:
    only the same already an Exquilete] – the daily eyes wear me down, not a Groschen of money is in the
    treasury, I cannot engage a doctor for myself and must perish in my sins (Hohenlohe[?]: "Indeed so!")
    yet! Whether the lease will still hold, God will [know]; one exhausts oneself in chicaneries, and
    with [illegible] today lease out the propination rights separately, in order to obtain the old arrears
    from 1808 which the sequestrator has caused to the amount of 2000


    d. Brzechsta has declared that he would pay on St. John''s, but goes on [uncertain: cataloguing].
    I am therefore writing to those persons, as soon as the councillor of justice Kuntzel comes, in the
    name of Your Serene Highness, to the King of Saxony, and beg him that he might [direct] the Attorney
    General Lipski upon the war[?] to come here to'
- page: 2
  en: 'now to establish and set a norm between the manorial lordship (Dominium) and the subjects, and
    to draw the chicaneries into a fiscal investigation. Count Kwilecki, who was just now here with me,
    is gathering [uncertain: Stiennen] in order to press for the removal of the Seymanous, who is our
    great friend; this may take 4 weeks of dragging out, and in the meantime I shall still have to suffer
    much [uncertain: privation].


    The [uncertain: lordly] treasury now has execution against the outstanding [uncertain: interest];
    but the Attorney will have the friendship to order that all the remainders, as I direct them, be taken
    as day-money, collected by force, and the interest owing be discharged. If that succeeds, then I come
    clear here, and at most 4000 Rthl remain over, if the contract with Brzechsta holds. My own and Brzechsta''s
    plan is, when I have been [there], to go to Warsaw. To pursue the Trąbczyn matter, likewise the Wrąbczyn
    one and the others; from there we return and come to Schlawenschitz, and in the meantime the lawsuit
    with Mielrowitz[?] will also (Hohenlohe: "as promised?")'
- page: 3
  en: 'be decided; if it turns out favourably, of which there is no doubt, then Your Serene Highness will
    receive the 4000 Rthl, and payment will also be made through the [uncertain: Schläfen].


    Your Serene Highness writes that the 300 Rthl are to be found for Mr. Sommer. That is not possible
    until Brzechsta is in activity – for these many days there has been no [uncertain: Denen] in the treasury
    – today 4 Rthl came in, and these Mr. Sommer has received. Everything here is at present laid under
    sequestrations. I do not know whence I am to take anything to live on and for the costs. Now the Attorney
    Goscipischen sends word through Chomanowskii that I should press for payment of the interest which
    at that time the [uncertain: lordly] treasury caused to be taken from me by arrest and French execution
    in Berlin. For since I hold a decree of the French General Government, and the Invalids'' Fund here
    seeks its satisfaction, this claim had priority – only Your Serene Highness would have to give a declaration
    that the Councillor of War and Forests v. Triebenfeld must demand and receive the [uncertain: quaet]
    sum of 3125 Rthl, which with the interest and costs proper amounts to 4219 Rthl; to which I not only
    hereby fully consent, but I hereby direct him to raise these 4219 Rthl out of the interest'
- page: 4
  en: 'of the villages New and Old Swięcia, of the village of Wrąbczyn, of the village of Old Olesnica,
    Skokum, the colony Sophienthal, Kopojno, and the colony Adelow, and to have them paid against receipt;
    I also consent that Mr. v. Triebenfeld may have this money collected by execution through a komornik,
    without its first having to be sought by judicial assistance.


    This, drawn up from here by Your Serene Highness''s courts, I beg may be sent to me with the utmost
    dispatch by a [uncertain: rentencken] express, so that I may keep my foot in the [uncertain: Carruen]
    and may have some money collected. For the rest, there is here a distress that surpasses all conception;
    the [uncertain: warsche] have consumed everything, have taken grain, cattle, horses, sheep and [illegible]
    fodder, so that the people eat grass alongside the cattle.


    As concerns the [uncertain: Brieges Precz] most graciously sent to me, it does not hold, for this
    sum is, according to the Kontop contract, determined, assigned, and undertaken to be paid to him.


    In deepest respect I remain, until death,


    Your Most Serene Highness''s


    Kopojno


    16th June 1811


    most humble and obedient [servant]


    v. Triebenfeld'

status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord,


    That Your Serene Highness has sent someone here who has satisfied himself of the situation here and
    of my misery, is well. — For many weeks now I have lain very ill; only [uncertain: the same] already
    an [uncertain: Exquilete] — the daily eyes wear me out; not a Groschen of money is in the treasury;
    I cannot engage a doctor for myself and must yet perish in my sins (Hohenlohe[?]: "Indeed so!"). Whether
    the leasing-out will still stand, God knows; one exhausts oneself in chicanery, and with [uncertain:
    abſabet] today to lease out the propination rights separately, in order to obtain old arrears from
    1808 which the sequestrator caused with 2000 d. Brzechsta has declared that he would pay on St. John''s,
    but goes on [uncertain: in Catalirt]. I therefore write to those persons, as soon as the Justizrath
    Kuntzel comes, in the name of Your Serene Highness, to the King of Saxony, and beg him that he might
    [uncertain: to the General Procurator Lipski upon war] to come hither to'
- page: 2
  en: 'now to fix and establish a norm between the Dominium and the subjects, and to draw the chicaneries
    into a fiscal investigation. Count Kwilecki, who was with me here just now, is [uncertain: collecting]
    [uncertain: Stiennen] in order to press for the removal of the [uncertain: Seymanous], who is our
    great friend; this may drag on 4 weeks, and in the meantime I shall still have to suffer [uncertain:
    much reading]. The [uncertain: manorial] treasury has now [proceeded to] execution upon the arrears
    of interest, but the Procurator will have the friendliness to command that all the remainders, as
    I direct them, be accepted as day-money, levied by force, and the interest owing discharged. If that
    succeeds, then I come out clear here, and there remain at the most 4000 Rthl over, if the contract
    with Brzechsta holds. My and Brzechsta''s plan is, once I have been [uncertain: recovered], to go
    to Warsaw. To pursue the Trąbczyner matter, likewise the Wrąbczyner and others; from there we [uncertain:
    turn] back and come to Schlawenschitz; in the meantime the lawsuit with Mielrowitz[?] will also be
    (Hohenlohe: "as promised?")'
- page: 3
  en: 'decided; if it turns out favourably, of which there is no doubt, then Your Serene Highness will
    obtain the 4000 Rthl, and through the [uncertain: Schläfen] it will also be paid. Your Serene Highness
    writes to make available to Herr Sommer the 300 Rthl. That is not possible until Brzechsta is in activity
    — for already for many days there has been no [uncertain: Denen] in the treasury; today 4 Rthl came
    in, and these Herr Sommer has received. Everything here is at present laid under sequestrations. I
    do not know from whence I am to take [uncertain: a Groschen] to live upon and for the costs. Now the
    Procurator Goſcipischen sends word through Chomanowskii that I should press for the payment of the
    interest which at that time the [uncertain: manorial] treasury caused to be taken from me by arrest
    and French execution [in] Berlin. For since I had a decree of the French General Government, and the
    Invalids'' Fund was here seeking its satisfaction, this claim had the precedence — only Your Serene
    Highness would have to give a declaration that the Councillor of War and Forests v. Triebenfeld must
    demand and receive the principal sum of 3125 Rthl, which with the [uncertain: D.] plain interest and
    costs amounts to 4219 Rthl; wherein I not only fully [consent] hereby, but I hereby direct him to
    raise these 4219 Rthl out of the interest'
- page: 4
  en: 'of the villages of New and Old Swięcia, of the village of Wrąbczyn, of the village of Old Olesnica,
    Skokum, the colony Sophienthal, Kopoyno, and the colony Adelow, and to have them paid against receipt;
    also I consent that Herr v. Triebenfeld may have this [uncertain: sum] levied by execution through
    a komornik, without its first having to be sought by judicial assistance. This, issued [uncertain:
    by the courts of Your Serene Highness], I beg may be sent to me by a [uncertain: returning] express
    with the utmost dispatch, so that I may keep my foot in the [uncertain: Carruen] and be able to have
    some money levied. For the rest, there is here a distress that surpasses all conception; the [uncertain:
    through-marches] have consumed everything — grain, cattle, horses, sheep, and [uncertain: also] fodder
    taken, so that the people eat grass together with the cattle. As concerns the [uncertain: Brieges
    Precz?] most graciously sent to me, it does not hold, for this sum is determined and assigned according
    to the [uncertain: Kontonper] contract, and undertaken to be paid to him.


    In deepest reverence I remain, until death, Your Most Serene Highness''s


    Kopoyno, 16th June 1811


    most humble and obedient [servant], v Triebenfeld'

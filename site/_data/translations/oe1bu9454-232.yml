- page: 3
  en: 'decided; should it turn out favourably, of which there is no doubt, then Your Serene Highness will
    obtain the 4000 rt., [illegible] through the [uncertain: Schläfen] it will be paid.


    Your Serene Highness writes that the 300 rt. are to be procured for Mr Sommer. That is not possible
    until Brzechffa is in funds — for these many days there has not been a [uncertain: Denen] in the cash
    box — today 4 rt. came in, and these Mr Sommer has received. Everything here is at present laid under
    sequestration; I do not know whence I am to obtain a [illegible] to live on and to meet the costs.
    Now the Procurator [uncertain: Golynski] sends word through Chomanowski that I should press for the
    payment of the interest which at that time the heralichen cash office had taken from me in Berlin
    by arrest and French execution. For since I held a decree of the French General Government, and the
    Invalids'' Fund was now seeking its satisfaction here, this claim had the priority — only Your Serene
    Highness would have to give a declaration — "that the Councillor of War and Forests von Triebenfeld
    must demand and receive the sum in question of 3125 rt., which with [illegible] [text lost] interest
    and costs amounts to 4219 rt., in which I not only hereby fully consent, but I hereby direct him to
    raise these 4219 rt. out of the interest"'

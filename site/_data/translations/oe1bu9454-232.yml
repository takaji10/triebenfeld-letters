- page: 1
  en: '232


    Most Serene Prince


    Most gracious Prince and Lord, that Your Serene Highness has sent someone here who has satisfied himself
    as to the situation here and as to my misery, is well — I have lain very ill these many weeks, only
    the same already an [uncertain: Exquilete] — the daily eyes wear me out, not a Groschen of money is
    in the cash box, I cannot engage a doctor for myself and must yet perish in my sins [Hohenlohe: "Indeed!"]!
    Whether the lease will yet stand, God knows; people exhaust themselves in chicanery, and with [illegible]
    today to lease out the propination rights separately, in order to obtain old arrears from 1808 which
    the sequestrator has caused with 2000


    d. Brzechffa has declared that he would pay at Midsummer, but continues [uncertain: in Catalirt].
    I am therefore writing to those persons, as soon as the councillor of justice Kuntzel arrives, in
    the name of His Serene Highness, to the King of Saxony, and beg him that he might [have] the General
    Procurator Lipski, upon war, [come] hither to'

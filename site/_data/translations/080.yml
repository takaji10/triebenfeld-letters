- page: 1
  en: Most Serene Prince, Most gracious Lord! Presumably Your Most Serene Highness will already have received
    my letter, which I yesterday gave to Herr Captain and Hahn to carry. – Besides this, in which I have
    said everything, I only add further that Minister Hoym has returned from Potsdam quite content, where,
    according to the assurance of another man, various things were spoken of concerning Your Serene Highness.
    It is hereby confirmed that the good Mo- truly esteems you, and in this respect I hope, indeed it
    must be, that everything will go according to wish. Today there is a great deal of talk here of marches
    or war – I do not yet believe in it, for the monarch holds too firmly to his principles, and maintains
    his honestly good intentions. From His Excellency Herr von Voss nothing has yet come back. May Heaven
    govern his heart, that he may not act against the King's interest and against Your Serene Highness's
    peace of mind. In deepest reverence I remain, until death, Your Most Serene Highness's Berlin, the
    9th of October 1798. most faithful servant v. Triebenfeld

segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The monarchs have remained here, and the great
    manoeuvre has taken place here in Vienna; I was not able to take any part in it or to see it, yet
    it is said to have surpassed everything in elegance, the Emperor as our King. G. F. Constantin pp.
    have received regiments in the Austrian Army — which each of them also led forward at the manoeuvre.
    Only the King of Wurtemberg was not on horseback, and drove (which I myself [uncertain: saw] en passant)
    in a carriage drawn by 8 horses, and indeed in an Oriental turn-out; [text does not parse] the truly
    allied Sovereigns [text does not parse] on horseback the manoeuvre too has been eliminated; the cordiality
    between the two Emperors and our King, which has been shown at every turn, has surpassed all belief.
    Our King, after the various toasts, stepped out onto the balcony, had a filled glass of champagne
    handed to him, and drank aloud to the whole body of all the brave soldiers — A many-thousandfold thanks,
    accompanied by many [uncertain: thousands of] foreign tears, was rendered to the King for this, even
    by the oldest bearded warriors, and it seemed that all the [uncertain: haste/hatred] between Austria
    and Prussia, which was formerly imbibed with the mother''s milk, was for one day remitted and vanished
    for ever; in unanimity they [illegible] the 4 [might] to the welfare of mankind, and only the ill-thinking
    man will [illegible] look upon the future, which the [uncertain: right-thinking] man today faces so
    hopefully and gladly. The King of Wurt: is said still not to come forward into the light with the
    constitution which he wishes to lay before the allied Powers for examination; it has [breaks off]'
- page: 2
  en: 'the appearance as though he would miss the crossing. Several Princes of the Empire and all 4 Estates
    have agreed together to send a deputation to Prince Metternich and to petition him that the Emperor
    of Austria should again come forward as their head, to whom they would willingly and gladly submit
    themselves, if their old rights were restored; they would then form a united power to which scarcely
    any in the [uncertain: world] would stand equal — Prince Metternich has referred the Estates to patience
    in this matter and has directed them that for the present it is not yet advisable to come forward
    with it. Concerning Saxony much is spoken — but it will probably remain with the resolutions long
    since taken. Concerning [uncertain: the fallow/vacant matters] nothing is yet determined; meanwhile
    the [uncertain: foremost] man assures me that, in so far as the matter concerns Your Serene Highness,
    [text does not parse: Höchst Sie draut das beste Könnten]; the Minister Bar. v. Hum. is working here
    to the best effect, because the matter interests him personally. That, moreover, Your Serene Highness
    will yet be able to lead a quiet and happy life at Schlawenschitz, and that you will shortly see your
    chief enemy there trodden in the dust — for that, most gracious Prince, I can vouch to you. Only the
    greatest secrecy is enjoined upon me, because there are still many stones of stumbling to be cleared
    from the way — but the fairest morning is already dawning. The good Privy Councillor v. Gärtner, who
    lays himself most respectfully at Your Serene Highness''s [uncertain: feet], has been very ill these
    several days; as soon as he [uncertain: has recovered] I [uncertain: shall obtain] from him much essential
    intelligence with [illegible] is everything; on account of the many affairs I must be very [uncertain:
    watchful]. With impatience I await a letter from Your Serene Highness, so that I may take my measures
    accordingly — unwillingly would I let lie the work now brought into the best train, and only the greatest
    necessity can bring me to it; now further, this: when the Chancellor of State, H. Hardenberg, [makes]
    a report concerning Cosmar'
- page: 3
  en: '[does] one [demand?] the Brieg Superior Provincial Court, especially on account of the settlement
    of 1811 which is to be annulled, [text does not parse] confidence is to be reckoned upon it, and would
    it not be advisable, in due time, to send someone thither who might guide and press the matter quietly?
    I shall, as soon as I am instructed what is first to be done, [text does not parse: sehr nötig werde
    ich] give Your Serene Highness notice of every outcome, so that measures may be taken there also.
    In deepest reverence I remain, until death, Your Most Serene Highness''s — The Sovereign Prince of
    Holland assumes the title of King. Vienna, the 18th October 1814. [uncertain: truly] most humble and
    obedient servant v Triebenfeld'

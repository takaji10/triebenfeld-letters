  en: '251


    Copy


    Most Serene Prince, etc.


    The Prince of Hohenlohe has, in this matter lying before Your Most Serene Highness, had a further
    opinion drawn up from the records which lie with the High Provincial Court at Brzeg, by the man of
    law already made known to Your Serene Highness, in order to see the whole matter quite clearly. He
    has sent this to me with the charge of laying it most devotedly, by way of supplement, at Your Most
    Serene Highness''s feet. His just complaints over his boundlessly unfortunate situation, in which
    the Medical Councillor Cosmar keeps him fettered, cut through every feeling heart, and for that reason
    alone do I venture to carry out the Prince''s charge and to trouble Your Most Serene Highness. Have
    mercy, most gracious Prince and Lord, upon this suffering, honest man. May Your Serene Highness deign
    only to grant the Prince the hope in writing that the 112/m Rthl for the settlement with the Courland
    heirs shall be advanced — even if not in cash at this moment — then the Prince is put in a position
    to conclude the compromise with the Courland mandatories at once in the most legally binding manner,
    and everything will resolve itself. The more so, as thereafter the entailed estates must be administered
    for the royal account. The settlement and the codicil of 1811 — which was forged by Cosmar above all
    in order to defraud the monarch of 426/m Rthl, and other creditors too of what is theirs — collapse
    [uncertain: of] themselves. His Majesty [illegible] the guarantee back at once, without its costing
    the King a heller, and gains besides the 35,000 Rthl advanced to the Prince in 1790.


    Most [uncertain: Allersebnißest] however I venture to remark that every delay threatens danger, for
    first, Cosmar spins his web tighter and confuses the matter daily more — secondly, the Prince is about
    66 years of age, bowed down and worn out by care; he might well succumb to his misery, as Cosmar and
    the young Prince wish. Then nothing is registered upon the entailed estates; the Courland heirs, who
    have on their side the guarantee of His late Royal Majesty (the All-Highest under whom the debts were
    originally contracted), and who also drew the interest until 1806 out of the royal treasury, would
    obtain by way of law that His Majesty must pay, and in that manner the monarch would lose, inclusive
    of the 35,000 Rthl, 461,000 Rthl.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 19th of November


    1814


    most humbly, most faithful servant


    v Triebenfeld'

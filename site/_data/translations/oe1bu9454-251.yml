- page: 1
  en: 'Copy


    Most Serene Prince etc.


    The E. E. zu höherliche has, in the matter now before his E. H. D, had a further opinion drawn up
    from the files which lie with the Brugen OCG, by the man of law already made known to Your Serene
    Highness, in order to see the thing quite clearly. He has sent this to me with the charge to lay it
    at [your] feet [uncertain: as a further submission]. His just complaint over his boundless unhappy
    situation, in which the M. R. keeps him ensnared, cuts through every feeling heart, and for all this
    reason I venture to comply with the Prince''s charge and to trouble [uncertain: Your Serene Highness].
    Have mercy, most gracious [text lost] and Hl., upon this suffering, honest man. May Your Serene Highness
    be pleased only to grant the Prince the written hope that the 112000 Rthl for the settlement with
    the L. heirs shall be advanced (even if not in cash at the moment); then the Prince is put in a position
    to conclude the compromise at once in the most legally binding manner with the [uncertain: Q 2] mandatary,
    and everything resolves itself, since more than afterwards the entailed estates would have to be administered
    for the King''s account. The settlement and the codex of those which was chiefly for that reason separated
    from the loc. in order to deprive the monarch of Mb. d. and also other creditors of what is theirs
    then collapse of themselves. He Marhalte, at once the guarantee back, without its costing the King
    a heller, and taken also still the 35000 Rthl advanced to the Prince in 1790. Most submissively, however,
    I venture to observe that every delay brings danger; the 1st Spirit Cos makes his web the tighter
    and confuses the matter daily more


    2. and the Prince being some 66 years old, bowed down by grief and worn out, he might well succumb
    to his misery, according to the wish of Mr. Cosmar and of the young Prince. For nothing is registered
    upon the entailed estates; the 2 heirs, who have for themselves the guarantee of the late most blessed
    Mr. M. (the All-Highest, under whom the debts were contracted [uncertain: unserunglich]), and who
    also drew the interest up to 1806 from the royal treasury, would by law obtain this, that he M. must
    pay, and in that way the monarch would lose, including the 35000 Rthl, 461000 Rthl,


    in deepest reverence I remain, until death,


    Vienna, the 19th of November


    1814


    most humble and most faithful servant


    v. Triebenfeld'

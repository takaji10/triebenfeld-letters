- page: 1
  en: 'Copy. Most Serene Prince, etc. The E. E. zu höherliche has, in the matter lying before his E. H.
    D., had a further opinion drawn up out of the records which lie with the Brugen OCG, by the man of
    law already made known to Your Serene Highness, in order to see the matter quite clearly. He has sent
    this to me with the charge to lay it, subsequently, [uncertain: drotest] at [Your] feet. His just
    complaint over his boundless unhappy situation, in which the M. R. holds him in fetters, cuts through
    every feeling heart, and for all this reason I venture to comply with the Prince''s charge and to
    trouble Your S. D.[illegible]. Have mercy, most gracious [Prince] and Lord, that [upon] this suffering,
    upright man. May Your Serene Highness deign only to grant the Prince the written hope that the 112000
    Rthl for the settlement with the L. heirs shall be advanced (though not in cash at this moment); then
    the Prince is placed in a position to conclude the compromise at once in the most legally binding
    manner with the [uncertain: Q] Mandatarii, and everything will resolve itself of its own accord —
    for more than that, thereafter, the Maj[orat] estates would have to be administered for the King''s
    account. The Trans[act] and the codicil, of those matters which was chiefly for that reason separated
    from the loc., in order to deprive the Monarch of Mb. d. and also other creditors of what is theirs,
    then fall of themselves. He M. receives back the guarantee at once, without it costing the King a
    heller, and taken also still the 35000 Rthl advanced to the Prince in 1790. Most submissively, however,
    I venture to observe that every delay brings danger, since the said Cosmar [makes] his web firmer
    and confuses the matter daily more, etc.; and the Prince is some 66 years of age, bowed down by care
    and worn down, and might well succumb to the misery, according to the wish of Cosmar, etc., and of
    the young Prince. For nothing is registered against the Majorat estates; the 2 heirs, who have on
    their side the guarantee of the late most blessed Hr. M. / by whose Most High [authority] the debts
    were originally contracted / and who also drew the interest until 1806 from the royal treasury, would
    rightly obtain thereby that he M. must pay, and in that manner the Monarch would lose, inclusive of
    the 35000 Rthl, 461000 Rthl. In deepest reverence I remain, until death, Vienna, 19th November 1814,
    most humble and obedient most faithful servant v Triebenfeld'

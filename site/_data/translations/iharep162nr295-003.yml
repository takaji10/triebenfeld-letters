  en: 'constituted.


    Besides the foregoing items nothing is registered upon the estate of Zagórów in the mortgage book,
    and for the rest this mortgage certificate is hereby issued to the Royal General Invalids'' Fund in
    vim recognitionis, on account of the 50,000. Rthl sub-registered for the same ex documento de 28.
    January of the current year upon the said estate Rubr. III. ad No. 2. In witness whereof, under the
    greater seal of the Royal South Prussian Government and the customary signature:


    Given at Kalisz, the 13th of March 1805. signed: Danckelmann.


    signed: Husarzewski.


    signed: Schlegel signed Beda. (L. S.)



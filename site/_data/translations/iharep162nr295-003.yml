- page: 1
  en: '(6 Groschen stamp)


    The town of Zagórów, situated in the province of South Prussia and its Konin district, was made over
    to the reigning Prince of Hohenlohe-Ingelfingen, Friedrich Ludwig, His Serene Highness, by His Majesty
    King Friedrich Wilhelm the IInd, by the deed of grant dated Berlin, the 19th of June 1797, with hereditary
    and proprietary rights, and the title of possession (titulus possessionis) has been registered for
    the same ex decreto of the 31st of July 1801.


    Thereupon are registered


    I. onera perpetua, restrictions of the property or of disposition.


    1., — is struck out.


    2., 88. Rthl. 5. Groschen 9. Pfennig, i. e. Eighty-eight Rthl. 5 Groschen 9 Pfennig'

- page: 3
  en: '4. days'' free digging of pine stumps in the Zagórów forests; and that, should the lordship find
    it necessary to assign a certain district for this, this district may not be under 330. Morgen, and
    that those hereditary lessees shall be entitled to pasture their sheep in this district, has been
    provisionally noted on the application of those named at the beginning, by virtue of a decree of the
    18th of December 1804.


    II. Judicially secured debts and other real obligations


    1., A protestation pro salvando jure et loco for the Provincial Elder von Lichnowski at Brzeg, on
    account of a claim belonging to him against the possessor, the Prince of Hohenlohe, and already registered
    upon Trąbczyn, of 32,300. Rthl, in words two and Thirty thousand three hundred Rthl, bearing interest
    at 5. per cent; has been registered ex decreto of the 24th of January 1804


    2., 250,000. Rthl, i.e. Two hundred and fifty thousand Rthl in Prussian Courant, at 5. per cent yearly
    interest, and after the lapse of one year subject to a term of 6. months'' notice free to both parties,
    have been registered as a loan, from the owner''s bond,'

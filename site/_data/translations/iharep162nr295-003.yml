- page: 2
  en: 'Prussian Courant, are paid yearly out of this estate as a due to the Kalisz Treasury of War and
    Domains; which has been registered ex officio, on the ground of the application of the Chamber of
    War and Domains at Kalisz dated Kalisz, the 18th of November 1802, by virtue of a decree of the 14th
    of December 1802.


    3. A protestation pro fisco camerae, on account of the right belonging to it, on the ground of the
    confiscation of the ecclesiastical estates that has taken place, to demand the right of building timber
    and firewood in the forests belonging to this estate and the payment of the surplus forest due in
    cash, has been registered on the application of the mandatary of the Treasury by virtue of a decree
    of 25. January 1803.


    4. A protestation for Johann Giese, Johann Bagans and Friedrich Gietzinger, on account of the right
    stipulated to them in the hereditary-lease contract concluded with the owner under the 22nd of February
    1804 concerning the estate of Olesnica, to enjoy free gathered and fallen wood and yearly'

- page: 4
  en: 'dated Wrocław, the 1st of June 1804, for the Councillor of War and Forests Peter Friedrich August
    von Triebenfeld, by virtue of a decree of the 5th of June 1804, in consequence of the debtor''s application
    to that effect, upon the estates of the town of Zagórów, Kopojno, Świątniki, Skokum, Drzewce, Olesnica,
    Wrąbczyn, Grądzyń, which are liable at the same time for costs and damages.


    ad Nº 2., 50,000. Rthl, i.e. fifty thousand Rthl of the sum of 250,000. Rthl registered above sub
    No 2. have been pledged, and eventualiter ceded in property, by its holder, the Royal Councillor of
    War and Forests von Triebenfeld, to the Royal General Invalids'' Fund, on account of a loan of the
    same amount received from the same at 5 per cent yearly interest, payable free of cost at Berlin in
    half-yearly instalments, and under a term of 6. months'' notice on either side, according to the deed
    made out thereon dated Berlin, the 28th of January 1805, which has been registered by virtue of a
    decree of the 5th of March 1805, with the remark that for this loan of the 50,000 Rthl priority prae
    residuo has been'

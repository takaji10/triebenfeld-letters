status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! An order of the General Finance Department, issued some
    14 days ago to all the Chambers here, hampers the course of my business extraordinarily, and it may
    be long before I come to the end of the revision of the valuations, if indeed such is permitted at
    all. The cause of these new difficulties is Prince George together with the local Councillor of War
    Korn. The former some time ago requested of the Kalisch Chamber that Korn be appointed reviser of
    his valuations of the estates situated in this, in the Posen, and in other Departments. The Chamber
    had likewise granted this. But since, unhappily, the judicial valuations which were to be revised
    had been drawn up by Korn himself, and were contested in the [uncertain: Abord], the matter had to
    be laid before the Chief of the Department; and being incensed at these swindles — that a member of
    the Chamber should revise the valuations which he himself had made, and against which so many objections
    are raised, and should render the Chamber answerable — the Minister issued the order, that'
- page: 2
  en: 'that no Chamber should any longer be permitted, without the prior knowledge of the General Finance
    Department, to order the revision of a judicial valuation; whereby the revision of Prince George''s
    affairs was at once forbidden for good. Herr President v. Goldbeck has meanwhile written straightway
    to the said Department and applied for permission. I have sent this by express courier to Berlin,
    and have at the same time asked Amelang and Langen to help procure the permission and to see that
    the same is dispatched here with all speed. It now remains to be seen whether the spiteful Voss will
    concede the revision. Meanwhile I must lie here at anchor and await the answer. In the interim I shall
    submit the dismemberment plans for approbation, and [uncertain: level] everything in this matter.
    Herr v. Goldbeck was at first very lukewarm; in the end he reproached me for not having helped him
    to the 2 Strahlitz, which Dolfs afterwards obtained, and which the Minister had so firmly promised
    him. It was not hard for me to furnish the proof that I had done everything for him'
- page: 3
  en: and we came to agreement again. He very much wishes to have, as soon as possible, three bronzed
    busts, which he means to set upon his repository. Likewise he has begged me to procure him as soon
    as possible a lavoir, so as to be able to wash his ailing lower body daily. Would Your Serene Highness
    have the goodness to have three busts of that kind bought, and a lavoir as well, and send me these
    here by the first post. The lavoir is to be had in the joiners' warehouses. I should dearly like to
    surprise the good man with them right quickly. The Olesnice affair has, through the friendly mediation
    of Herr v. Husslarzewski, been sent back to the patrimonial court for decision; this is for us a great
    satisfaction. — I shall now bring about the speediest prosecution of the matter, and meanwhile quiet
    Lichnowski, so as [text unclear] Heaven grant only that I may dismember at leisure, that I may obtain
    the permission for the revision of the valuations as soon as possible. The cursed swindles of Prince
    George have already caused much terror, and will yet excite much misfortune and mistrust. He is indeed
    a dreadful man — I cannot praise God enough that I am parted from the man. In deepest reverence I
    remain, until death, Your Most Serene Highness's — If only I might soon receive the 3 bronzed busts
    and the lavoir, it would give much joy. Kalisz, the 24th February 1805. faithful humble and obedient
    servant v Triebenfeld

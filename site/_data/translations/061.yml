status: draft
segments:
- page: 1
  en: Your Honour, Highly Honoured Sir Court Councillor. Your Honour's most highly esteemed letter I received
    today by express; my joy was at first without bounds, to know you as my cousin in Breiten, but upon
    reading your friendly letter further a new sorrow stunned my heart, so that I could scarcely compose
    myself. I have a plan by which I may be rescued out of all embarras, only 1800 Rthl of interest must
    be paid; before that I cannot come to Breslau or into those parts. Honour and fortune are still not
    at stake there. I am at present, through the one accursed v. d. Lahr affair, dreadfully disgraced,
    and cannot show myself there any sooner than when the 1800 Rthl of interest are paid. Then I can appear
    there and carry out my plan. If the Most Serene Lord does not help me with this trifle, then may God
    stand by my forsaken children; I shall then go to another place where I shall not have need of His
    Serene Highness's help. I have sent His Serene Highness the letter of my daughter, which she wrote
    in despair, after the distraint on account of the v. d. Lahr debt, to my youngest son, so that such
    a cry of lamentation might move the Lord; if he does not help me with the trifle, then all gentle
    feelings have ever been strangers to him. Dear friend - it is 1800 Rthl that can save me from shame
    and mockery, indeed from ruin; these determine my choice or my dwelling - I must have them, for otherwise
    I shall not come there - Should the
- page: 2
  en: Prince rescue me thereby, then I shall appear there justified - but not, either, without a summons.
    I shall then carry through my cause with honour - dismember a part of my estates, assign my children
    the interest for their maintenance, and then go to the King, where I shall remain until much has been
    accomplished. This is my plan, and these are the consequences, if the Prince finds means regarding
    the 1800 Rthl - Should this last not come to pass, then I can no longer present myself there, but
    shall go to Königsberg and from there perhaps into hell. My heart could burst when I consider my misfortune,
    which I suffer so undeservedly. Here the estates are, through the bruit which I endured in Berlin
    on account of the eternal Lahr affair, placed under sequestration; there now swum across, however
    - but where shall I turn? Schweineren can be saved with 1800 Rthl, and I be put in a position to carry
    out all plans - Here too it would prepare beneficial consequences. One would deal more sparingly with
    me if I had Schweine free again; thus everything there depends upon the speedy help of Her Serene
    Highness. I would gladly sacrifice for it in return my whole blessedness of life and all else, if
    only the Lord will do this for me. Take thought, Your Honour, therefore, if it is in the world possible
    for you, and find means soon, for then I can depart from here on the 12th of September so as to be
    in Schlawenschutz about the 16th - but without this help I forsake everything. With a grateful heart
    and true high esteem I shall ever be Your Honour's, Kontop, the 31st of August 1809, truly devoted
    friend and servant v Triebenfeld

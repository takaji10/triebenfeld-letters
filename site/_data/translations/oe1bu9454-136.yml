- page: 9
  en: 'know where Glenck is? Answer: whether he be with the devil or in heaven — is unknown to me. Neither
    there nor there — he says he has for a couple of days been sitting quietly in the deepest [uncertain:
    Gehau] at Wrąbczyn, and is seeking, through Meyer, Tappert and a couple of other fellows, to scare
    off the people who wish to buy here — Flöricke confessed this to me. In the heat of it I said — that
    only such a scoundrel as Flöricke is could put such a thing about. Glenck is no marauder — still less
    so black a villain as should work against or destroy the plans of his brave master, who pays him honestly
    — Flöricke, who was standing in the hall, heard this and found himself much offended, but engaged,
    for the rescue of his honour, to furnish the proof. I offered Blomberg a wager of 10 fr. d''or — Blomberg,
    who likewise found himself too nearly touched by my expressions, accepted the wager, so as to give
    the matter a merrier turn, and I laid down the fr. d''or. The horses were already standing'

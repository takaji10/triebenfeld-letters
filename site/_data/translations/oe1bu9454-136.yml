- page: 7
  en: 'the people are to arrive for certain between the 14th and 18th of this month. I have left Blomberg
    the instruction that he is not to let the Hufe go on average below 600 rt.; in addition to this they
    are to pay 10 rt. yearly rent. That then is a capital of about 240000 rt. and 4000 rt. in rent — With
    this capital all debts are paid, and whatever comes in for all the other places is delivered into
    the treasury. Meanwhile this will amount to a capital of some 150000 rt. — The brewery I would advise
    establishing at Trąbczyn, and to retain for it a wood of about 3000 Morgen. The brewing and brandy
    rent-roll would then, once everything was in order, certainly bring in some 6 to 8/m rt. yearly, and
    Your Serene Highness can in this way take in about 400000 rt. in cash for the grounds to be dismembered,
    and also draw from your South Prussian estates a yearly rent, subsisting for all time, of 48 to 50000
    rt. That then, by God, is no inconsiderable entailed estate — But Your Serene Highness would have
    to have a house built upon the estates, for the higher barracks at Trąbczyn is after all no place
    for a ruling lord, and the nest so much praised at Mariantów is too small and is already about to
    fall in, together with the new [uncertain: Sprichten]'

- page: 10
  en: 'harnessed, with which I was to depart for Kalisz, and meant to be here for certain on the 12th
    — so I waited until a messenger came back from Wrąbczyn, from Meyer, who is a secret friend of Flöricke''s,
    and brought not only the confirmation of what Blomberg had said, but a note from Glenck, who has now
    disclosed himself — Blomberg swept up my 10 fr. d''or with the warning — in future not to take the
    bad man for the worst, nor the honest man for the most honest. By [uncertain: Beyme] Great God! it
    was not the loss of the ten fr. d''or that vexed me, but the shame of being so nastily caught out
    pressed me well nigh to the ground. Ashamed, I begged pardon of Blomberg and of Flöricke too, and
    sat down quietly in my carriage, after I had first sent on to Glenck the papers forwarded after him
    by express courier — and drove off to Kalisz in grief and care. I have not yet seen the fine gentleman,
    and am already waiting here again 1 1/2 days for him in vain — I shall, since Your Serene Highness
    has expressly said so, treat him solidly'

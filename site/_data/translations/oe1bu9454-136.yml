- page: 8
  en: 'on the point of collapsing in Trąbczyn; therefore the building of a manor house will gradually
    have to be thought of for his [residence]. Only one can make a beginning with it in 2–3 years at the
    earliest. Minister von Voss has treated me truly handsomely and in the presence of 26 persons delivered
    a special eulogy — He also sent his greetings through Blomberg and said — that with regard to the
    dismemberments of all the princely estates I should by all means conclude, even if only pro forma,
    so that he might approve the same. For from 1 July of this year he would forbid all further dismemberment.
    He has already made this known to the Chamber as well. For these reasons too I am here as though on
    coals, and await Glenck''s arrival, for unfortunately I can conclude nothing without power of attorney
    — God knows meanwhile where the man is knocking about, for when I was in Trąbczyn on the 8th an express
    courier came from Posen by way of Pyzdry to the justice-burgomaster Schenck with all the letters written
    to Glenck for some time past and sought him out — among them were several from Your Serene Highness
    — namely 2 thick ones and 3 smaller ones — How can anything sensible come of such gadding about, and
    what does the sending of express couriers not cost, and for a [uncertain: dullard]! I therefore did
    not know where I should send the letters. At last Blomberg came and said: do'

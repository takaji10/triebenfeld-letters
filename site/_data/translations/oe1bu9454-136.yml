- page: 1
  en: 'Most Serene Prince


    Most gracious Lord, On the sale of Kolno and Kaemen I offer my most hearty congratulations, insofar
    as thereby Your Most Serene Highness''s peace of mind has been secured, and my stout brother-in-law
    also satisfied. For the rest, I have done everything possible in order, according to Your Serene Highness''s
    command, to be here on the 12th and to finalise everything. In the meantime neither Mr Gleich nor
    Mr Wünster is here, nor does either let anything be heard of himself, and I have neither papers nor
    power of attorney in hand to be able to settle anything real. This much, however, I have brought about:
    that the 76000 Rthl shall be paid here by the prospective purchasers. So that no pressure need first
    be applied in Breslau and no brokerage fees given, and also so that these moneys may be paid at once
    in Berlin to the Foundry Department according to Bernhardi''s instruction. In this way everything
    concerning Koschentin is now disposed of, and it is only necessary that the people here be put at
    ease'

- page: 4
  en: 'man of Kalisz already conceded this to me as well. With Radzimski in Szetlewek I am so far finished
    that he is to sit out his year, but in return has had to let all claims fall. The reckoning with him
    is roughly this: He has to demand


    1500 Rthl


    for 2 years'' interest


    112 Rthl disbursements, according to Glenck''s instructions, for building costs 487 Rthl 4 gg


    Sum:


    2099 Rthl 4 d. He is to pay rent from Midsummer 1803/4 1300 Rthl


    likewise interest thereon


    56 Rthl


    rent from Midsummer 1804/5


    1300.


    Making


    2656 Rthl Consequently Your Serene Highness would have to receive, up to 1805, 557 Rthl. Now he wishes
    to have 306 Rthl of legal costs allowed him, so that only 251 Rthl remain over. That is then the [uncertain:
    Savinin] of a whole year — everything must be cleared up. For the rest, there are 2 gentlemen here
    who wish to take Szetlewek. They give per Morgen 1 [uncertain: dkg] ground-rent, which together with
    the peasants'' arable and other things will amount to some 2000 Rthl yearly, and the propination rights
    and jurisdiction are besides this also to be reckoned at several hundred d. Against the tenants Floricke
    I have at last obtained a decree of [uncertain: solutionis] — but I have applied at once for execution,
    and mean to wear them down. They are already very humble now — they still demand 4 Hufen, cleared,
    and 8 Hufen of waste land, but are already offering 20 Mk. ground-rent per Hufe — I shall do the beggarly
    fellows no harm — but there will certainly be nothing to be got either'

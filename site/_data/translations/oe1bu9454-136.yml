- page: 5
  en: 'My plan with Trąbczyn is, if Your Serene Highness approve the same, as follows: as soon as I have
    the decree of execution in hand I shall turn the fellows out and make an honourable end of this —
    Thereupon I shall lease Trąbczyn together with the whole propination rights for 1 year to Otocki on
    the condition that I may dismember straight away. In this manner nothing great is lost, but I even
    gain several thousand Rthl, for Otocki is to receive at Midsummer


    6000 Rthl. Floriche gives yearly 6000 Rthl rent, and that for 15 years, with propination rights and
    all revenues.


    I am asking for 1 year, including the brewery of Kopojno etc., 9000 Rthl. In this way Your Serene
    Highness need not pay the above 6000 Rthl and will still receive in cash into the treasury


    3000 Rthl. The dismemberment shall notwithstanding take place not a moment later, and no ground shall
    be let out a shilling cheaper — for that I stand surety to Your Serene Highness. The remainder of
    Swięcia consists of 9 Hufen of poor land and 5 Hufen of marsh amid sand hills, partly overgrown with
    timber. For these grounds the colonists will give little or nothing. Meanwhile the neighbouring von
    Biskupski of Kochar has applied to me and wishes to take these grounds at the fixed perpetual ground-rent
    of 30 Rthl per Hufe, for the reason that he has already had much quarrelling with the colo-'

- page: 10
  en: 'harnessed, with which I was to depart for Kalisz, and to be here for certain on the 12th — I therefore
    waited until a messenger came back from Wroberin from Meyer, who is a secret friend of Flöre''s, and
    brought back not only the confirmation of what Blomberg had said, but also a note from Glenck, who
    has now revealed himself — Blomberg swept up my 10 Friedrichs d''or with the warning: in future not
    to hold the bad man for the worst, nor the honest man for the most honest. By great God! it was not
    the loss of the ten Friedrichs d''or that vexed me, but the shame of being so nastily caught out pressed
    me almost to the ground. Abashed, I begged pardon of Blomberg and also of Flöriche, and seated myself
    silently in my carriage, after I had first sent on to Glenck the papers forwarded after him by express
    courier — and drove off to Kalisz in grief and care. I have still not seen the fine gentleman, and
    am here already waiting again 1 1/2 days for him in vain — I shall, since Your Serene Highness expressly
    told me to treat him solidly,'

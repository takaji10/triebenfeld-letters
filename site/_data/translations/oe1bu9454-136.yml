- page: 3
  en: 'so that it is not overlooked.


    The Grand Chancellor has ordered the government at Klogau to seize all moneys and all documents, and
    has also made known to it that on the 2nd of this month a letter was written to Lüchinne — that even
    if no document of insinuation, then at least a certificate should be sent in, that he has had the
    sentence of confiscation, which has already become res judicata, delivered to Count Schlabrendorff
    in Paris, according to which, as soon as Luchelini''s certificate comes in, the estates are to be
    confiscated forthwith, and thereupon otherwise disposed of by His Majesty. This friend [uncertain:
    Unruh] is now to await, and diligently to let his battery play — Whether Amelang will accomplish anything
    with Beyme — time will tell. I confess that I count little upon this assistance.


    I have duly received the mortgage of Zagorowo, properly drawn up. Also from Lichnowski the assurance
    that he, should I require it, is willing to place himself behind 130000 Rthl. I shall now see how
    much they will give me, and what I receive Your Serene Highness will find on hand in the chest — if
    I can obtain the money without Lignourlis'' help, that is the more agreeable to me, for then his security
    is [text lost] he must little Weigel the 27000 Rthl has at once to revert to Trapian and will thereafter
    let himself be dealt with better. The'

- page: 12
  en: 'together. I shall indeed press it upon his heart, the more so as it is now most necessary that
    he drift about here no longer. Whether however he will listen to my representation, time must teach.


    For my part I shall hasten, once the contract is concluded here, to Berlin, see to the loan and bring
    the money to Lombardini; from there I hasten to Trąbczyn and settle everything there as aforesaid.
    Once I am finished there I return to Wrocław, see to my own business and then go to Pszczew, Kulm
    and Kamionna, so that everything may be arranged there too and these people here satisfied.


    With boundless fidelity I remain, until death, reverentially, Your Most Serene Highness''s


    Frankfurt an der Oder


    13 June 1804


    faithful, humble and obedient servant


    v Triebenfeld'

- page: 6
  en: nists. For this strip is to remain lying as rough pasture between Swięcia and Kuchar — When the
    Germans now see that a stranger means to take it up, they will in the end give just as much themselves,
    and then my purpose is achieved here too. With Drzewce and Grądzyń I must still manoeuvre on account
    of the priests — for these demand free building and firewood; the judgement of the second instance
    will be published in the next few days. The Treasury has lost again. It now depends on whether it
    will seek a review — if it does not seek a review and lets the judgement become res judicata, then
    here too the dismemberment can be proceeded with at once. There is no lack of people who wish to buy
    grounds — Only if I press it too much, the people think there is distress and they bid far below the
    rate once accepted, from which however I shall never depart, but rather hope to obtain more than less
    — therefore the matter must be handled solidly, for now no distress presses any longer. With Kopojno,
    Skokum, Swiątniki, the Oleśnica marsh and the Wrąbczyn Warthe grounds, I think to provide for the
    Mennonites. These grounds amount to some 400 Hufen

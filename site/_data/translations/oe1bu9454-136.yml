- page: 5
  en: 'My plan with Trąbczyn, if Your Serene Highness approves the same, is now this: once I have the
    decree of execution in my hands I should throw the fellows about and make an honourable end with them
    — Thereupon I lease Trąbczyn, together with[?] the whole propination rights, for 1 year to Otocki,
    on the condition that I may dismember straight away. In that manner not a Groschen is lost, but rather
    I gain several thousand rt. more, for Otocki is to receive at Midsummer 6000 Rt. Floricke gives 6000
    rt. rent yearly, and that for 15 years, with propination rights and all revenues.


    I demand for 1 year, including the brewery at Kopojno etc. = 9000 rt. In that manner Your Serene Highness
    need not pay the above 6000 rt. and still receive in cash into the treasury = 3000 rt.


    Notwithstanding this, the dismemberment is to take place not a moment later, nor is any ground to
    be let out a shilling cheaper — for this I stand surety to Your Serene Highness. The remainder of
    Swięcia consists of 9 Hufen of poor land and 5 Hufen of marsh amid sand hills, which are in part overgrown
    with timber. For these grounds the colonists will give little or nothing. Meanwhile Mr von Biskupski
    of Kuchar, who adjoins there, has applied to me and wishes to take these grounds at the fixed perpetual
    ground rent of 30 rt. per Hufe, for the reason that he has already had much quarrelling with the colo-'

- page: 7
  en: 'the people are to arrive for certain between the 14th and 18th of this month. I have left Blomberg
    the instruction that he is not to let the Hufe go on average below 600 Rthl; for this they are to
    pay 10 Rthl yearly rent. This then is a capital of about 240000 Rthl and 4000 Rthl of rent. With this
    capital all debts will be paid, and whatever comes in from all the other villages will be delivered
    into the treasury. Meanwhile this will amount to a capital of about 150000 Rthl. — I should advise
    establishing the brewery in Trąbczyn, and retaining for it a wood of about 3000 Morgen. The brewing
    and brandy revenue would then, when everything was in order, certainly bring some 6 to 8000 Rthl yearly,
    and Your Serene Highness can in this manner take in for the grounds to be dismembered about 400000


    d. in cash, and also draw from your South Prussian estates a yearly rent subsisting for all time of
    48000 (to 50000) Rthl. This is then, by God, no inconsiderable entailed estate. But Your Serene Highness
    would have to have a house built upon the estates, for the higher barrack in Trąbczyn is after all
    no residence for a ruling lord, and the much-praised nest in Marianton is too small and is already,
    together with the new [uncertain: Sprichten],'

- page: 9
  en: 'you know where Glenck is? Answer: whether it be with the devil or in heaven — is unknown to me.
    Neither there nor here: he says he has already for a couple of days been sitting quietly in the deepest
    thicket in Trąbczyn, and is seeking, through Meyer, Tappert and a couple of other fellows, to frighten
    off the people who wish to buy here — Flöriche confessed this to me. In the heat of the moment I said
    — that can only be put about by such a scoundrel as Flöricke is. Glenck is no marauder, still less
    so black a villain as should work against or destroy the plans of his brave master, who honestly [uncertain:
    rewards] him — Flöricke, who was standing in the hall, heard this and found himself much offended,
    but engaged himself, for the rescue of his honour, to furnish the proof. I offered Blomberg a wager
    of 10 Friedrichs d''or, and Blomberg, who likewise found himself too nearly touched by my expressions,
    accepted the wager, in order to give the matter a merrier turn again; and I laid down the Friedrichs
    d''or. The horses were already standing'

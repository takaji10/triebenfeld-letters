- page: 6
  en: 'nists. For this strip is to remain lying as rough pasture between Swięcia and Kuchar — When the
    Germans now see that a stranger wishes to settle there, they will in the end give just as much themselves,
    and then my purpose is achieved here too. With Drzewce and Grądzen I must still manoeuvre on account
    of the priests — for these demand free building timber and [uncertain: firewood]; the judgment of
    the second instance will be published in these days. The Treasury has again lost. It now depends on
    whether it will seek review — if it does not seek review and lets the judgment become res judicata,
    then the dismemberment can be proceeded with here at once as well. There is no lack of people who
    wish to buy grounds — only if I hurry too much with it, then the people suppose there is distress
    and they offer far below the rate once adopted, from which, however, I shall never depart, but rather
    hope to obtain more than less — therefore the matter must be handled solidly, for no distress presses
    any longer now. With Kopojno, Skokum, Swiątniki, the Olesnica marsh and the Trąbczyn Warthe grounds
    I think to provide for the Mennonites. These grounds amount to some 400 Hufen'

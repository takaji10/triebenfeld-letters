- page: 2
  en: 'and that the Broniewski matter be pursued — in this last affair I shall seek to have effect in
    Berlin — for in Poznań it is said, as only Bernhard says, to stand badly once again.


    It was a piece of luck that I had the Otto valuation of Kamionna etc. drawn up afresh and judicially
    attested; for the gentlemen here wanted the valuation, and the one spoiled in Berlin for 25 fr. d''or
    could hardly be shown to the people, so I saw to it at Kalisz that I obtained the same in probative
    form, and now the purchasing gentlemen are glad, and have therefore not only promised anew to make
    the payment of the 76/m rt., but they will now give hard coin here. I have written this to Bernhardi
    by today''s post, and have also pressed that Meyer Bernhard must write the same to him, so that he
    may be entirely easy and may act according to his plan.


    Regarding Kölzig I have brought up a new battery, which I hope will have good effect. I have despatched
    to Berlin the Unruh so often named to Your Most Serene [Highness] and the like — he lodges with Mr
    von Köckritz: and is, as is known, his all-in-all; he stays there 3 weeks and is constantly to remind
    him of Kölzig'

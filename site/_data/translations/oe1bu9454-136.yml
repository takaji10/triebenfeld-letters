- page: 12
  en: 'together. I shall indeed press it upon his heart, the more so as it is now most necessary that
    he not knock about here any longer. Whether, however, he will listen to my representation, time must
    teach.


    For my part, once the contract is concluded here, I shall hasten to Berlin, see to the loan and bring
    the money to Lombar dine; from there I hasten to Trąbczyn and there settle everything as aforesaid.
    When I am finished there I shall return to Breslau, attend to my business, and then go to Betsche,
    Kulm and Kaemen, so that everything may be arranged there too and these people here be satisfied.


    With boundless fidelity I remain, until death, respectfully, Your Most Serene Highness''s


    Frankfurt an der Oder


    13th June 1804


    faithful, humble and obedient servant


    v. Triebenfeld'

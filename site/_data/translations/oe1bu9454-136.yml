- page: 11
  en: 'also say not a word to him. But Your Serene Highness must not take it ill of me either, if from
    now on I hold this Glenck to be a truly vindictive, evil and really irreparably envious man.


    Harm he shall not do, nor shall he be an obstacle in any of my plans, which I make for Your Serene
    Highness''s best, for my dealings lie open, are bound up with no self-interested gain, and are therefore
    supported and furthered by good men; and it is often granted me even to win over the bad and to better
    them; therefore I do not fear him. But this I swear, that he is the most frivolous and most wicked
    man, who can never be bettered either by [uncertain: harshness] or by good words.


    I tremble only lest he fritter away the time, and not go to Winnir and see to the handing over to
    Dąbrowski. The handing over is to be on the 24th of June. If he is not there at the appointed time,
    then Dambrouphi has an evasion and does not pay the 20500 Rthl, for he wishes to lease out elsewhere
    again, in order thereby to bring the sum'

- page: 8
  en: 'at Trąbczyn; therefore thought will gradually have to be given to the erection of a manor house
    in its place. Only one cannot make a beginning with it before 2-3 years. Minister von Voss has treated
    me truly handsomely and, in the presence of 26 persons, delivered a particular speech in my praise
    — He also sent greetings through Blomberg and said — that I should by all means conclude the dismemberments
    of all the princely estates, even if only pro forma, so that he might approve them. For from 1 July
    of this year he would forbid all further dismemberment. He has already made this known to the Chamber
    as well. For these reasons too I am here as if on coals, and await Glenck''s arrival; for unhappily
    I can conclude nothing without a power of attorney — God knows meanwhile where the man is drifting
    about, for when I was at Trąbczyn on the 8th an express courier came from Poznań by way of Pyzdry
    to the justice-burgomaster Schenck with all the letters written to Glenck these several times past,
    and sought him out — among them were several from Your Serene Highness — namely 2 bulky ones and 3
    smaller — How can anything sensible come of such drifting about, and what costs does the sending of
    express couriers not cause, and for a [uncertain: Dummesbrunter]. So I did not know where I should
    send the letters. At last Blomberg came and said, do you'

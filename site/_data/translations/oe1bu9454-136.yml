- page: 11
  en: 'and say not a word to him. But let Your Serene Highness not think ill of me for it now either,
    if from now on I hold this Glenck to be a truly vindictive, evil and really irreparably envious man.


    Harm he shall not do, nor be an obstacle in any of my plans, which I make for Your Serene Highness''s
    best, for my dealings lie open, are bound up with no self-interested gain, and are therefore supported
    and furthered by good people, and it often even lies with me to win over the bad and to better them;
    therefore I do not fear him. But this I swear, that he is the most frivolous and most evil man, who
    can never be bettered either by hard words or by good.


    I only tremble lest he fritter away the time and not go to Wieniec[?] and see to the handover to Dąbrowski.
    The handover is to be on the 24th of June. If he is not there at the appointed time, then Dąbrowski
    has a pretext and does not pay the 20500 rt., for he intends to lease out elsewhere again, so as thereby
    to bring the sum'

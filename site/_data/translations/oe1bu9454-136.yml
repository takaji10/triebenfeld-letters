- page: 4
  en: 'Kalisz man conceded this to me already. With Radzinski in Szetlewek I have got so far that he is
    to sit out his year, and in return has had to let all claims lapse. The reckoning with him is roughly
    this:


    He has to claim 1500 Rthl


    from 2 years'' interest 112. rt.


    Outlays according to Glenck''s instructions for building costs 487 rt 4 gg  Sum: 2099 rt. 4 gg.


    He is to pay rent from Midsummer 1803/4 = 1300 rt. likewise interest thereon 56 rt.


    Rent from Midsummer 1804/5 = 1300 rt.


    Which is 2656 rt.


    Consequently Your Serene Highness would have to receive up to 1805 = 557 rt. Now he wants 306 rt.
    of legal costs allowed him after all, which leaves only 25[5?] rt. remaining. That then is the revenue
    of a whole year — but it must be cleared up. For the rest there are 2 gentlemen here who wish to take
    Szetlewek. They give 1 rt. ground rent per Morgen, which together with the peasants'' arable and other
    things will come to some 2000 rt. yearly, and the propination rights and jurisdiction are besides
    this also to be reckoned at several hundred more.


    Against the tenant Floricke and the others I have at last obtained a decree of payment — but I have
    applied at once for execution, and mean to wear them down. They are already very humble now — they
    still demand 4 Hufen, made ready, and 8 Hufen of waste land, but they already offer 20 rt. ground
    rent per Hufe — I shall do the beggarly lads no harm — but there will certainly be nothing to be got
    either.


    NB the legal costs I think to tear from Radzinski''s soul at my next coming there.'

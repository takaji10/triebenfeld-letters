- page: 2
  en: 'and that the Broniszewski matter be pursued — in this last affair I shall seek to exert influence
    in Berlin — for in Posen it is said, as only Bernhard says, to stand badly again.


    It was a piece of good fortune that I had the Otto valuation of Kaemen etc. drawn up afresh and judicially
    [uncertain: attested]; for the gentlemen here wanted the assessment, and the one spoiled in Berlin
    for 25 [uncertain: Fider] could hardly be shown to the people; so I saw to it in Käbisch that I obtained
    the same in probative form, and now the purchasing gentlemen are glad, and have therefore not only
    promised anew to make the payment of the 76000 Rthl, but they now wish to give hard coin here. I have
    written this to Bernhardi by today''s post, and have also pressed that Meyer Bernhard must write this
    to him, so that he may be entirely at ease and may act according to his plan.


    Concerning Kölzig I have brought up a new battery, which I hope will work well. I have dispatched
    to Berlin the Unruh so often named to Your Most Serene [Highness] and the like. He lodges with Mr
    von Köch: and is, as is known, everything to him; he remains there 3 weeks and is constantly to remind
    him of Kölzig'

- page: 1
  en: '136


    Most Serene Prince


    Most gracious Lord!


    On the sale of Kolno and Kamionna I offer my most hearty congratulations, insofar as by it Your Most
    Serene Highness''s peace of mind is secured, and my stout brother-in-law has likewise been satisfied.
    For the rest, I have made every effort, in accordance with Your Serene Highness''s command, to be
    here on the 12th and to finalise everything. Meanwhile neither Mr Glenck nor Mr Wunster is here, nor
    does either let anything be heard from him, and I have neither papers nor power of attorney in hand
    to be able to settle anything of substance. This much, however, I have brought about: that the 76/m
    rt. shall be paid here by the prospective purchasers. So that in the first place no pressure need
    be exerted at Wrocław and no brokerage fees given, and also so that these monies may be paid at once
    in Berlin to the Ironworks Department according to Bernhardi''s instruction. In this way everything
    concerning Koszęcin is now disposed of, and it is only necessary that the people here be put at ease
    in their minds'

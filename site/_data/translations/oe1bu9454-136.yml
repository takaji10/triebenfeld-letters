- page: 3
  en: 'so that it not be overlooked.


    The Grand Chancellor has ordered the government at Głogów to place all monies and all documents under
    seizure, and has also made known to it that on the 2nd of this month a letter was written to Luckesine
    — that, even if no document of insinuation, at least a certificate be sent in, to the effect that
    he has caused the sentence of confiscation, already become res judicata, to be delivered to Count
    Schlabrendorff at Paris, according to which, once the certificate of Luckedini[?] comes in, the estates
    are to be confiscated at once, and thereafter otherwise disposed of by His Majesty. Friend Unruh[?]
    is now to await this, and diligently to let his battery play — Whether Amelang will accomplish anything
    with Beyme — time will tell — I confess that I count little on this assistance.


    The mortgage on Zagórów I have received duly made out. Also from Lichnowski the assurance that he,
    as I should require it, is willing to place himself behind 130/m rt. I shall now see how much they
    will give me, and what I obtain Your Serene Highness will find in store in the chest — if I can obtain
    the money without Lichnowski''s help, that is preferable to me, for in that case his security [uncertain:
    he sees he must little] Weigel, the 27/m rt. has at once to revert upon Trąbczyn and will thereafter
    let himself be dealt with better. The'

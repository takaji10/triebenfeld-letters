  en: '22


    Most Serene Prince


    Most gracious Prince and Lord!


    After I might hope, through a middling lease and through the real assistance of General Köckritz,
    to put an end to my sufferings — the gout seizes me again — I have already lain grievously ill for
    some days, yet I hope to be soon restored.


    However painful my illness may be in the meantime, I will nevertheless not delay the required answer,
    in accordance with Your Serene Highness''s commands. Your Serene Highness is pleased to say that I
    would be summoned as a co-party in your affairs.


    Most gracious Prince and Lord! For a considerable time now I have had 4 lawsuits about my neck in
    your affair, which will yet cost much money — the one on account of the Invalids'' Fund, the one with
    the Jew Oppenheimer, and now the one with the Colonel Schleifen, are considerable — and vex me frightfully,
    because I alone must suffer for having stood surety for Your [uncertain: Ewie-] Serene Highness.


    Out of faithful attachment I did not wish to tell you the odious things, but pursued the matter quietly
    onward, and beg withal much — Believe that these lawsuits already cost me a very great deal of money
    — only 7 days ago I had to pay the executor Alexius 132 Rthl, and the Chamber Court still demands
    85 and 42 Rthl for 127, which'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    Now that, by a middling leasing-out and by the real assistance of General Köckritz, I may hope to
    set aside my afflictions - the gout seizes me again - For some days now I have been laid low in a
    hard way, yet I hope soon to be restored.


    However painful my illness may be in the meantime, I will nonetheless not delay the answer demanded
    of me, in accordance with Your Serene Highness''s commands. Your Serene Highness deigns to say that
    I should be cited as co-defendant in Your affairs.


    Most gracious Prince and Lord! I have already for a considerable time had 4 lawsuits about my neck
    in Your affair, which will yet cost much money - the one on account of the Invalids'' Fund, the one
    with the Jew Oppenheimer, and now the one with the Colonel''s lady von Schlieffen, are considerable
    - and they vex me frightfully, because I alone must suffer for it that I made myself surety for Your
    Serene Highness.


    Out of faithful attachment I did not wish to tell You the [uncertain: Crediosa], but carried the matter
    forward quietly, and I beg in this much - Believe that these lawsuits already cost me a very great
    deal of money — only 7 days ago I had to pay the executor Alexius 132 Rthl, and the Chamber Court
    further demands 85 and 42 Rthl for 127, which makes'

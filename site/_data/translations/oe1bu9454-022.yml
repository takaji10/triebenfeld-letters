- page: 4
  en: 'to be driven out of the regiment; for I could give him nothing, because the executor had just taken
    away the last Groschen, and 100 Rthl had to be sent to Berlin - Lombardini has given nothing, and
    my son lives, as do I and my daughters, in the greatest want - My grief, through these tangled affairs,
    is before God without bounds — Consider now, my Prince, the shame: my daughters work for money at
    millinery and embroidery. They have judicially renounced me, only in order to save the furniture and
    to bring into safe keeping what they have from their mother – I can give them nothing until I have
    my estates free again. I assigned by order of payment 100 Rthl to my son and 50 Rthl to my daughters
    - but Lombardini was not so obliging, as I hear within the hour, as to pay the money - It outrages
    one''s inmost being - for this I have not deserved - could I in haste raise 500 Rthl in coin, to send
    it to the children speedily, I would gladly give up on [uncertain: John''s day], when the lease monies
    come in, 1000 Rthl for it in return_ This news makes me well nigh furious. – I have given up everything
    gladly and willingly - I have never drawn a heller from Your Serene Highness''s estates, and I am
    left to endure this language – As soon as I am well I shall lay the account before Your Serene Highness.
    - I also beg You to [uncertain: call for] the information to be gathered - whether I have drawn a
    Groschen from there. O most gracious Prince, that hurts too sorely. O had I but soon 500 Rthl for
    my poor children. No, this exceeds all bounds. God preserve Your Serene Highness and let it go better
    with You than with me; this blow strikes me too hard.


    [illegible] I remain, until death,


    Your Serene Highness''s


    Kontop, 27th January


    1810


    humble and obedient servant


    v. Triebenfeld'

- page: 3
  en: 'vigour — He costs me much, but will certainly bring everything into the clear — dunderheads are
    by no means of any use now; there one is laughed at and matters at once grow worse — Men must absolutely
    come forward who understand the language, because everything is transacted in the language of the
    country — But these men have themselves dearly paid, — I raise it and give it, without being forever
    burdensome to Your Serene Highness. For your complaints tear my heart as it is; I love you too much
    — the money that Lombardini has given and is now to give is not the 10th part of what I have already
    given — Daubing and begging I cannot do; I endure and bear, for my most gracious Prince, what no one
    else in the world would do.


    Here are 3 decrees again; I do what is possible — By force, however, I can compel nothing now. Had
    I 50/m men to command, I would lay all the treasures of Poland at your feet — as it is, I must endure
    and wait.


    I look daily here for the arrival of Honrichs and Hawich. Stenger is investigating everything, and
    until then I suspend my judgement — So much is certain, that Hawich is the greatest rogue — [uncertain:
    is] Honrichs one too, then woe to him — Only he has received no money; rather a certain Badenski,
    who is appointed by the Government, draws in everything. I have therefore not seen a Groschen from
    thence. Nor do I, upon my honour, take anything from thence, so as not to fall into confusion. Lombardini
    has not given the 150 Rthl — I had assigned them to my son, who was here and wanted money, because
    he [uncertain: requisitioned]'

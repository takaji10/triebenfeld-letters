- page: 4
  en: 'to be driven out of the regiment, for I could give him nothing, because the executor had just taken
    the last Groschen, and 100 Rthl had to be sent to Berlin — Lombardini has given nothing, and my son
    lives, as do I and my daughters, in the greatest want — My grief, through these tangled affairs, is
    before God without bounds — think, my Prince, of the shame: my daughters work for money at finery
    and embroidery. They have judicially renounced me, merely to save the furniture and to bring into
    safekeeping what they have from their mother — I can give them nothing until I have my estates free
    again. I assigned 100 Rthl to my son and 50 Rthl to the daughters — but Lombardini was not so obliging,
    as I hear within this hour, as to pay the money — It revolts one''s inmost being — for this I have
    not deserved — could I in haste raise 500 Rthl in coin, to send it to the children quickly, I would
    gladly give 1000 Rthl for it again at Midsummer, when the lease monies come in.


    This news makes me well nigh furious. — I have given up everything gladly and willingly — I have never
    drawn a heller from Your Serene Highness''s estates, and yet I am left to endure this language — As
    soon as I am well I shall lay the account before Your Serene Highness. — I also beg you to gather
    the intelligence from Poland — whether I have drawn a Groschen from there. O most gracious Prince,
    that hurts too much — O had I but soon 500 Rthl for my poor children. No, that exceeds all bounds
    — God preserve Your Serene Highness and let it go better with you than with me; this blow strikes
    me too hard


    I remain, until death,


    Your Serene Highness''s


    Konotop, 27th January


    1810


    humble and obedient servant


    v Triebenfeld'

- page: 2
  en: 'makes 259 Rthl Courant in all. Empich conducts the Oppenheimer suit; he has already received much,
    and he demands, if he succeeds, a great deal more — the Schliefen suit is being conducted against
    me in Wrocław, and in Poland I am conducting one for her against Meierowitz.


    This fellow still owes Schliefen 6000 Rthl of purchase money for Witów — I gave Schliefen a written
    undertaking whereby I made myself good to her for the sum; I did that alone so that Your Serene Highness
    should receive the 500 Rthl of annual hereditary quit-rent from Witów, which Meierowitz has now been
    in arrears with for 4 years and longer — Out of gratitude that I helped her to everything she has
    got away with, she has brought suit against me — I have of necessity now had to bring suit against
    Meierowitz, in order to help the old hag to her 6000 Rthl and Your Serene Highness to the 2500 Rthl
    of hereditary quit-rents in arrears. The suit already costs, in Wrocław and Poland, about 500 r. I
    have endured it, borne it, paid, and said nothing to Your Serene Highness, for I spare you too gladly,
    because you have sufferings enough already.


    The affair with the Invalids'' Fund makes me altogether [uncertain: senseless], it has already cost
    me many thousand thalers, honour, and health — it is the ground-stuff of all the sufferings I have
    hitherto borne and of [uncertain: nameless] grief. I hoped God should help at last, and that the matter
    would end through a death — It does not happen, and I can do nothing but seek to drag the matter out.


    Against going to Poland my sense of honour [uncertain: balks] — This is not unknown to you, and therefore
    you will doubtless wait until matters alter. I work on and hope to succeed; I have engaged a certain
    Stenger who is now pressing the matter with'

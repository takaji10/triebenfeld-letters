- page: 3
  en: 'vigour – He costs me much but will certainly bring everything into the clear — dullards cannot
    possibly be employed now; one is laughed at there and matters immediately grow worse — Men must absolutely
    come forward who understand the language, since everything is transacted in the language of the country
    - But these men let themselves be paid dearly, – I raise it and give it, without always being burdensome
    to Your Serene Highness. For Your complaints rend my heart quite enough as it is; I love [uncertain:
    You] too much. The money that Lombardini has given, and is now to give, is not the 10 Rthl part of
    what I have already given — Whimper and beg I cannot; I endure and bear, for my most gracious Prince,
    what no one else in the world would do further.


    Here are 3 decrees again; I do what is possible - But by force I can now compel nothing. Had I 50
    men to command, I would lay all the treasures of Poland at Your feet – as it is, however, I must endure
    and wait.


    Honrichs, and Honrichs''s arrival, I look for here daily. Stenger is investigating everything, and
    until then I suspend my judgement — So much is certain, that Hawich is the greatest rogue - [uncertain:
    If] Honrichs is too, then woe to him – Only he has not received money; rather a certain Radenski,
    who is appointed by the government, draws everything in. I have therefore not seen a Groschen from
    thence. Nor, upon my honour, do I take anything from thence, so as not to fall into confusion. Lombardini
    has not given the 150 Rthl - I had made them over by order of payment to my son, who was here and
    wanted money, because he was requesting'

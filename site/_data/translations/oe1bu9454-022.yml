- page: 2
  en: 'makes together 259 Rthl Courant. Empich conducts the Oppenheimer suit; he has already received
    much, and he demands, if he succeeds, still much more - the Schlieffen suit is being conducted against
    me in Breslau, and in Poland I am pursuing it against Meierowitz. This fellow still owes the Schlieffen
    lady 6000 Rthl of purchase money for Witów — I gave the Schlieffen lady a written undertaking in which
    I made myself good for the sum; I did this in order to obtain for Your Serene Highness the 500 Rthl
    yearly hereditary quit-rent from Witów, which Mucerowitz has now been in arrears with for 4 years
    and more — Out of gratitude that I helped the lady to all that she has got, she has brought suit against
    me – I have now been compelled of necessity to bring suit against Meierowitz, in order to help the
    old crone to her 6000 Rthl and Your Serene Highness to the 2500 Rthl of arrears of hereditary quit-rent.
    The suit already costs, in Breslau and Poland, some 500 Rthl. I have borne it, endured it, paid it,
    and said nothing to Your Serene Highness, for I spare You too gladly, because You have afflictions
    enough already. The matter with the [uncertain: sequestrated] Fund makes me altogether [uncertain:
    careless]; it already costs me many thousand thalers, honour, and health — It is the ground-stuff
    of all the afflictions I have endured hitherto and of nameless grief. I hoped God would help at last,
    and that the matter would end by a death - It does not happen, and I can do nothing but seek to drag
    the matter out.


    Against going to Poland my sense of honour rebels – this is not unknown to You, and therefore You
    will no doubt be willing to wait until matters change. I work on and hope to succeed; I have engaged
    a certain Stieger who now pursues the matter with'

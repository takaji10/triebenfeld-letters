- page: 1
  en: '150. The provincial elder von Lichnowski writes, dated 23 November 1804, to His Serene Highness:


    that for a year and a half, from 4 May 1803 to 4 November of the current year, he has an arrear of
    interest of 5,572 Rthl 12 Groschen to demand of His Serene Highness; he had believed that, since Trąbczyn
    was [uncertain: administered], he would obtain his payment; he had therefore procured a mandate from
    the Kalisz Government which imposes payment upon His Serene Highness within 14 days, but he is astonished
    that these have elapsed and that he has received nothing. He threatens an application for sequestration,
    but would gladly spare His Serene Highness vexation, and wishes to continue on good terms, and believes
    that Christmas would bring the means to satisfy [uncertain: him].


    Reply.


    the tenants had not paid — he would be satisfied, since Mr von Triebenfeld was putting everything
    there in order and setting it straight. — 27 November 1804'

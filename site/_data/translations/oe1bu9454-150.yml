- page: 1
  en: 'The Provincial Elder v. Lichnowski 11. writes, dated 23 Nov. 1804, to His Serene Highness, that
    for the past year and a half, from 4 May 1803 to 4 Nov. of the current year, he has to demand from
    His Serene Highness an arrears of interest of 5572 Rthl 12 Groschen; he had believed that, since Trąbczyn
    was being administered, he would obtain his payment; he had therefore procured a mandate from the
    Kalisch Government, which imposes payment upon His Serene Highness within 14 days, but he is astonished
    that these have elapsed and he has received nothing. He threatens with an application for sequestration,
    wishes [uncertain: abwägerne] to spare His Serene Highness vexation, and desires to continue on good
    terms, and believes that Christmas would bring the means to satisfy him. Answer: the tenants had not
    paid — he would be satisfied, since Herr v. Triebenfeld was putting everything there in order and
    in the clear. The 27th of Nov. 1804'

segments:
- page: 1
  en: 'The provincial elder von Lichnowski 11. writes, dated 23 Nov. 1804, to His Serene Highness


    that for a year and a half, from 4 May 1803 until 4 Nov. of this year, he has an arrears of interest
    of 5572 Rthl 12 Groschen to demand from His Serene Highness; he had believed that, since Trąbczyn
    was being administered, he would obtain his payment; he had therefore procured a mandate from the
    government at Kalisz, which imposes payment upon His Serene Highness within 14 days, but he is astonished
    that these have elapsed and that he has received nothing. He threatens to move for sequestration,
    wishes [uncertain: abwägerne] to spare His Serene Highness vexation, and desires to continue on good
    terms, and believes that Christmas would bring the means to satisfy him.


    Reply.


    the tenants had not paid — he would be satisfied, since Mr. von Triebenfeld was there putting everything
    in order and settling it


    27 Nov. 1804'

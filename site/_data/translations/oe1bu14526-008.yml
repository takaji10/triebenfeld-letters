    en: Kalisz
    kind: place
- page: 14
  en: 'and freely to act in all matters and before all authorities as he shall find good and most conformable
    to my interest.


    Whatever, then, my said attorney shall do by virtue of this commission received, I hereby promise
    to approve, and to hold to it as inviolably as if I had done it myself. At the same time I also bind
    myself to indemnify my attorney in every respect on account of this commission, and to reimburse him
    all [uncertain: costs] and outlays, on the pledge of my present and future property, so far as may
    be required for this. In witness whereof I have subscribed this general power of attorney in my own
    hand and'
- page: 15
  en: 'confirmed it by the impression of my arms. Thus done at the Guhewitz Court of Justice near Breslau,
    the 19th of February 1805. (L. S.) read by myself and approved, Friedrich Ludwig, Prince of Hohenlohe.


    That His Serene Highness the reigning Prince and Lord, well known in person to the undersigned Court
    of Justice and fully capable of disposing, General of Infantry, chief of a regiment, Governor of the
    town and fortress of Breslau and knight of the great Black and Red Eagle Orders, Friedrich Ludwig,
    Prince of Hohenlohe-Ingelfingen, drew up before us and with our attendance, on the date given, the
    foregoing general power of attorney directed to the Royal Councillor of War and Forests von Triebenfeld,
    acknowledged himself throughout to the literal content of the same, and thereupon, after His Highness
    had once more read it through beforehand'

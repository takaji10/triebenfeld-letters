- page: 14
  en: 'restrictedly and freely to act in all matters and before all authorities as he shall find good
    and most conformable to my interest.


    Whatsoever my said attorney shall do by virtue of this commission received, I hereby promise to approve
    and to hold thereby as inviolably as if I had done it myself. At the same time I bind myself also
    to indemnify my attorney in every respect on account of this commission, and to reimburse him all
    [uncertain: costs] and outlays, upon the pledging of my present and future property, so much thereof
    as shall be required for this. In witness whereof I have signed this general power of attorney in
    my own


    hand and by'

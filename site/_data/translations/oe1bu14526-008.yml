- page: 17
  en: 'together with the manorial parcels at Marianton, amounting in all to Seven hundred and Eighty-one
    Morgen and 77 square rods, likewise four [uncertain: thousand] Nine hundred and Forty-seven Morgen
    of forest, to dismember the said lordships together with the remaining and greater part of the forests,
    namely


    A.) the demesne farms belonging to the lordship of Zagorowo, Drzewce, Kopojno, Swiątniki, Swięcia
    and Broniki, likewise the demesne farms belonging to the lordship of Trąbczyn, Nowawies, Przybislaw,
    Stara Hutta and a part of the demesne farm of Trąbczyn;


    B. to let out in hereditary lease the demesne farm and village of Olesnica, likewise the demesne farm
    and village of Szetlewek;


    and


    C. to be permitted to convert the services and prestations of all the subjects into a fixed money
    rent — we have therefore, in respect of'

  en: 'the usefulness of this design and of the profitable services rendered, and still to be rendered,
    to Us and Our Royal House by Your Lordship the reigning Prince of Hohenlohe-Ingelfingen, Our General
    of Infantry and Governor of Breslau, by cabinet orders of the


    22nd of October and 7th of December of last year, resolved to accede to this his petition and to approve
    the same in such manner that the following conditions shall obtain, namely


    1., that the compensation to be granted to the subjects for their hitherto pasture and timber rights
    be more closely determined, and that in the hereditary-rent deeds of each individual the extent of
    the area assigned to him rent-free on that account be'

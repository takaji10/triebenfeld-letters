- page: 18
  en: 'the utility of this design, and of the profitable services rendered and still to be rendered to
    Us and Our Royal House by Your Lordship the reigning Prince of Hohenlohe-Ingelfingen, Our General
    of Infantry and Governor of Breslau, by Cabinet Orders of the


    22nd of October and 7th of December of last year, resolved to grant this his petition in such manner
    and to approve the same, provided that the following conditions shall obtain, namely


    1. that the compensation to be granted to the subjects for their hitherto existing rights of pasturage
    and of taking wood be more nearly determined, and that in the hereditary-rent deeds of each individual
    the area assigned to him rent-free for that purpose be'

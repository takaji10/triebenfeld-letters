- page: 13
  en: to petition for, respectively to notify, all approbations or instructions necessary in that regard,
    as well as all other requirements appearing to him necessary, both with the most laudable Chamber
    and with the most laudable Government at Kalisz and with all other requisite offices and authorities,
    and to manage all other requisite business for me; to settle accounts and conclude agreements with
    the lessees, to pay moneys, to receive the like and to give receipts for them; to issue to my officials
    and servants there the orders appropriate to them, to examine their conduct and performance of duty,
    and, should he not find the same, by his own judgement, suitable and [find it] prejudicial to me,
    to suspend them if need be, and generally un[limitedly]
  names:

- page: 1
  en: 'The Princely Hohenlohe Patrimonial Court hereby makes known that between the Councillor of War
    and Forests von Triebenfeld, as general attorney of His Serene Highness, as seller on the one part,
    and the resident Christian Friedenberger, as purchaser on the other part, the following hereditary-lease
    contract, concerning one Hufe Magdeburg measure of land situated in the Trąbczyn forest, has been
    concluded and judicially declared before us.


    Actum Trąbczyn, the 25th of March 1806. There appeared the persons well known to the undersigned justiciary,
    namely


    1. The Councillor of War and Forests von Triebenfeld, as general attorney of His Serene Highness the
    reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court of this place, legitimated
    by the power of attorney annexed hereto, on the one part, and


    2. the resident Christian Friedenberger from Szymanowicer Hauland, on the other part.


    The parties appearing are in a condition to execute judicial acts validly, and declare freely and
    vol[untarily]'

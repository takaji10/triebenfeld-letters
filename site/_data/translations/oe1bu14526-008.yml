- page: 2
  en: 'liberately and with due deliberation the following hereditary-lease contract to the protocol.


    §. I. His Most Serene Highness namely grants in fee to Christian Friedenberger one Hufe, in words
    One Magdeburg Hufe, reckoned at thirty Morgen to the Hufe and each Morgen at one hundred and eighty
    square rods, situated in the Trąbczyn forest, from now on for perpetual times


    in hereditary lease.


    §. II. Christian Friedenberger pays for the one Magdeburg Hufe 100 rt., in words One hundred Reichsthaler,
    as entry-money, and since this entry-money is already fully paid, Christian Friedenberger is hereby
    receipted for the same without further reservation.


    §. III. Christian Friedenberger'
  names:
  - de: Christian Friedenberger
    en: Christian Friedenberger
    kind: person
  - de: Christian Friedenber ger
    en: Christian Friedenberger
    kind: person
  - de: Trąbczyner Walde
    en: Trąbczyn forest
    kind: place

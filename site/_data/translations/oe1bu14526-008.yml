    of the Edict issued for the province of Silesia on the 1st of May 1804 must be duly observed, on the
    basis of a special and corrected survey;


    2. that none of the present peasant holdings may be allowed to lapse, but that if, upon a fire damage
    or other misfortune, no one is found who will restore such a holding out of his own means, the manorial
    lordship (Dominium) must re-erect the buildings at its own cost;


    3. that all the territorial-sovereign dues at present charged upon the said estates, or hereafter
    still to be laid upon them, and other charges, shall likewise as before be'

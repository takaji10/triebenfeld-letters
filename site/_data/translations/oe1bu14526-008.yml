status: draft
segments:
- page: 1
  en: 'The Princely Hohenlohe Patrimonial Court hereby makes known that between the Councillor of War
    and Forests von Triebenfeld, as General Bevollmächtigter of His Serene Highness, as seller on the
    one part, and the resident (Einsasse) Christian Friedenberger, as purchaser on the other part, the
    following hereditary-lease contract, concerning one Hufe Magdeburg measure of land situated in the
    Trąbczyn forest, has been concluded and judicially declared before us.


    Actum Trąbczyn, the 25th of March 1806. There appeared the persons well known to the undersigned Justitiarius,
    namely


    1., the Councillor of War and Forests [uncertain: Hoch] von Triebenfeld, as General Bevollmächtigter
    of His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary and manorial lord
    of this place, legitimated by the power of attorney annexed hereto, on the one part, and


    2., the resident Christian Friedenberger of Szymanowicer Hauland, on the other part.


    The comparents find themselves in that condition [uncertain: in dem Zusammen] validly to execute judicial
    acts, and declare of their free wi[ll]'
- page: 2
  en: 'willingly and after mature deliberation the following hereditary-lease contract to the protocol.


    §. I. His Most Serene Highness accordingly grants to Christian Friedenberger one Hufe — written out,
    One Hufe Magdeburg measure — reckoned at thirty Morgen to the Hufe and each Morgen at one hundred
    and eighty square rods, situated in [uncertain: um] the Trąbczyn forest, from now on for all perpetual
    time


    in hereditary lease.


    §. II. The said Christian Friedenberger pays for the one Hufe Magdeburg measure 100 rt., written out
    One Hundred Rthaler, as purchase-money; and since this purchase-money has already been paid in full,
    Christian Friedenberger is hereby receipted for it without further reservation.


    §. III. Christian Friedenberger'
- page: 3
  en: 'hereby binds himself, for himself and his successors in possession of this holding, to pay from
    this one Hufe an annual hereditary canon of thirty Rthaler — written out thirty Rthaler — to the Dominium
    of this place; and this hereditary quit-rent shall be discharged yearly in two instalments, namely
    one half at Christmas and the other half at St. John''s, each time in cash and in Courant, to the
    manorial treasury.


    §. IV. For the wholly uncultivated arable the hereditary lessee receives three free years, which begin
    from Martinmas of the past year and end at St. John''s 1809, so that the first half-yearly hereditary
    quit-rent must be paid at Christmas 1809 in the sum of 15 rt., written out fifteen Rthaler'
- page: 4
  en: 'Rthaler must be rendered.


    That land which, at the measuring-out, is already handed over to Christian Friedenberger as cultivated
    — be it much or little — shall bear quit-rent from Christmas of this year, inasmuch as the free years
    extend only to that part which has yet to be brought under cultivation.


    §. V. The hereditary purchaser is at liberty to redeem the fixed hereditary quit-rent of the thirty
    Rthaler up to one half, that is to say, to pay off to the ground-lordship, according to his means,
    one, two, or up to three hundred [uncertain: Schuler] of capital, whereupon for every hundred Rthaler
    five Rthaler shall be'
- page: 5
  en: 'abated yearly from the hereditary quit-rent; the capital so paid off remains the property of the
    ground-lordship; and this redemption of the hereditary quit-rent takes place only in respect of the
    first half, whereas the second half, at fifteen Rthaler per Hufe, remains irredeemable and can never
    be raised or diminished.


    §. VI. Besides the [uncertain: inner] hereditary quit-rent, the hereditary lessee undertakes, for
    now and for future times perpetually, to discharge and render all Royal and other public charges falling
    upon this one Hufe, in whatsoever they may consist, without any exception and without deduction from
    the hereditary quit-rent or any other reimbursement, and to'
- page: 6
  en: 'to render.


    §. VII. The hereditary lessee must [uncertain: build] at his own cost, without receiving thereto,
    either now or in the future, timber or other building assistance; however, all the timber standing
    upon his Hufe belongs to him in property, without exception.


    Likewise the hereditary lessee and his successors in possession of this holding must effect all future
    repairs and new buildings out of their own means, without subsidy or aid.


    §. VIII. Outside his own holding the hereditary lessee has no right to firewood or to [uncertain:
    pasturage] in the manorial forests and fields.


    §. IX. His drink the hereditary lessee must always take from'
- page: 7
  en: 'the manorial brewery and distillery, or from the [uncertain: Krug (tavern)]; if foreign drink is
    brought in by him or by his people, then the hereditary lessee incurs each time a penalty of 5 rt.
    for every barrel of beer and one Rthaler for every Garniec of brandy, which penalty is to be paid
    to the ground-lordship.


    §. X. The hereditary lessee is subject to the milling compulsion, and may grind his grain only where
    the manorial lordship directs him.


    §. XI.


    From all and every manorial service and deliveries in kind, without distinction, the hereditary lessee
    is [uncertain: for now] wholly exempted;'
- page: 8
  en: 'he nevertheless remains subject to the jurisdiction of the Dominium of this place.


    §. XII.


    The hereditary lessee and his successors in possession are entitled to alienate their holding to another
    in any manner they please; but upon every sale or exchange the tenth Groschen of the purchase or exchange
    money must be paid to the ground-lordship as a laudemium, and the consent of the same must be obtained
    for every alienation, inasmuch as the ground-lordship hereby reserves to itself, once and for all,
    the right of pre-emption.


    §. XIII. The hereditary lessee, for himself and his successors in possession, renounces all and every
    remission in cases of mis-'
- page: 9
  en: 'fortune — be they occasioned by fire from heaven or by the incendiarism of evil persons, hail-storm,
    crop failure, cattle plague, inundation, war and pestilence, or in whatsoever manner it may arise
    — entirely, for now and for the future; and upon the occurrence of such cases neither a bonification
    nor a remission of the hereditary quit-rent shall take place.


    §. XIV. All costs attending this contract the hereditary lessee undertakes to discharge.


    §. XV. His Most Serene Highness consents that the hereditary lessee may, on the ground of this contract,
    have his title of possession registered in his own name.'
- page: 10
  en: '§. XII. So long as the hereditary lessee and his successors in possession fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights and
    to defend them against every man''s real claim.


    Should, however, the hereditary lessee or his successors remain in arrears with the annual hereditary
    quit-rent for longer than two years, or lay this holding waste and thereby diminish the revenues of
    the ground-lordship, then the ground-lordship shall be entitled to dispose of this holding otherwise,
    and the hereditary lessee shall forfeit his whole'
- page: 11
  en: 'right and the purchase-money paid in.


    Both parties promise to keep this hereditary-lease contract firmly and inviolably; being judicially
    instructed as to the consequences, they renounce all evasions that might be raised against it, particularly
    the objection of an injury sustained above or below the half [i.e. laesio enormis], of cunning persuasion,
    fear, compulsion, of matters otherwise agreed, otherwise written down, or not rightly understood;
    they moved that this contract be judicially drawn up, and, after previous reading aloud, have in token
    of their approval'
- page: 12
  en: 'subscribed and signed below in their own hands.


    v. Triebenfeld    xxx the own hand-mark of Christian Friedenberger    Schenck


    Justitiarius


    Ogrodowicz


    Protocollant


    General Power of Attorney. I, the undersigned, hereby make known and declare that I do hereby expressly
    empower the Royal Councillor of War and Forests, Herr Peter Friedrich August von Triebenfeld, Your
    Right Honourable, of Schweinern etc., to attend, both judicially and extrajudicially, to all and every
    matter concerning the Zagorowo, Wittow and Trąbczyn estates belonging to me and situated in South
    Prussia in the Kalisch Department — whether they concern a dismemberment, or purchase and sale, leasing
    or pledging, or by whatever other name they may go and upon which they may have bearing and influence
    —'
- page: 13
  en: to procure all approbations or instructions necessary in the matter, as well as all requisites appearing
    to him necessary, both with the most laudable Chamber and with the most laudable Government at Kalisch
    and with all other requisite [authorities], and to petition, respectively to notify, [them], and to
    attend to all other requisite business on my behalf; to settle accounts with the lessees and conclude
    agreements with them; to pay out moneys, to receive the like, and to give receipt for them; to issue
    to my officials and servants there such orders as are appropriate to them; to examine their conduct
    and performance of duty, and, should he not find such [conduct] agreeable to his views and prejudicial
    to me, to suspend them if need be; and in general un-
- page: 14
  en: 'restrictedly and freely to act before all authorities and in all matters as he shall find good
    and most conformable to my interest.


    Whatsoever my said Bevollmächtigter shall do by virtue of this commission received, I hereby promise
    to approve and to hold thereto so inviolably as though I had done it myself. At the same time I also
    bind myself to indemnify my Bevollmächtigter in all respects on account of this commission, and to
    reimburse him all [uncertain: charges] and outlays, upon the pledging of my present and future property,
    so far as shall be required thereto. In witness whereof I have subscribed this General Power of Attorney
    with my own hand and have'
- page: 15
  en: 'corroborated it by the impression of my arms. Thus done at the Guhewitz Court of Justice near Breslau,
    the 19th of February 1805. (L. S.) Read by myself and approved. Friedrich Ludwig Fürst zu Hohenlohe.


    That His Serene Highness the reigning Prince and Lord, very well known in person to the undersigned
    Court of Justice and fully capable of disposition, General of Infantry, Chief of a Regiment, Governor
    of the City and Fortress of Breslau and Knight of the Great Black and Red Eagle Orders, Herr Friedrich
    Ludwig, Prince of Hohenlohe-Ingelfingen, did this day execute before us and with our participation
    the foregoing General Power of Attorney directed to the Royal Councillor of War and Forests Herr von
    Triebenfeld, acknowledged himself throughout to the literal content thereof, and then, after His Highness
    had once more read the same through beforehand'
- page: 16
  en: 'and approved it, did subscribe and seal it in our presence as his own: this is hereby attested,
    testando Protocolli de hodierno in fidem publicam. Thus done at the Guhrwitz Court of Justice near
    Breslau, the 19th of February 1805. Baronial Stillfried Luhemitz Court of Justice.


    (L. S.)


    Koeppen


    Justitiarius


    Kaleschke


    Actuarius.


    We, Friedrich Wilhelm, by God''s grace King of Prussia etc., make known and hereby give to be understood
    that, whereas the possessor of the lordships Zagorowo and Trąbczyn, situated in South Prussia in the
    Kalisch Chamber Department and its Konin district, [namely] the reigning Prince of Hohenlohe-Ingelfingen,
    has sought leave of Us, reserving one part of the demesne farm Trąbczyn'
- page: 17
  en: 'together with the manorial parcels at Marianton, amounting in all to seven hundred and eighty-one
    Morgen and 77 square rods, and likewise four thousand nine hundred and forty-seven Morgen of forest,
    to dismember the said lordships together with the remaining and larger part of the [estates], namely


    A.) the demesne farms belonging to the lordship of Zagorowo — Drzewce, Kopoyno, Swiątniki, Swięcia
    and Broniki — and likewise the demesne farms belonging to the lordship of Trąbczyn — Nowawies, Przybislaw,
    Stara Hutta — and one part of the demesne farm Trąbczyn;


    B. to let out in hereditary lease the demesne farm and village Olesnice, and likewise the demesne
    farm and village Szetlewek; and


    C. to convert the services and prestations of all the subjects into a fixed money quit-rent: therefore
    We have, in respect of'
- page: 18
  en: 'the utility of this design and of the profitable services rendered, and yet to be rendered, to
    Us and Our Royal House by His Beloved the reigning Prince of Hohenlohe-Ingelfingen, Our General of
    Infantry and Governor of Breslau, by Cabinet Orders of the


    22nd of October and 7th of December of last year, resolved to accede to this his petition and to approve
    the same in such manner that the following modalities shall obtain, namely


    1., that the compensation to be granted to the subjects for their hitherto pasturage and timber rights
    be [uncertain: hereafter] determined, and that in the hereditary quit-rent instruments of each individual
    the extent of the areas assigned to him rent-free in lieu thereof be precisely noted'
- page: 19
  en: '— just as in general the provisions contained in §. 12. of the Edict issued for the Province of
    Silesia on the 1st of May 1804 must here likewise be duly observed on the basis of a special and rectified
    survey;


    2., that none of the present rustical holdings may be allowed to lapse, but that if, upon a fire damage
    or other misfortune, no one is found who will re-establish such a holding out of his own means, the
    Dominium must restore the buildings at its own cost;


    3., that all the sovereign dues and other charges now resting upon the said estates, or hereafter
    to be laid upon them, [must], just as heretofore, be'
- page: 20
  en: 'paid over to Our treasuries appointed thereto, at the prescribed terms, and that for their security
    the necessary entry be made in the mortgage book of the lands and forests reserved by the Dominium;


    4., that the timber rights pertaining to the monastery and the provostry of Ląd be likewise entered
    in the mortgage book upon the totality of the forests reserved from the dismemberment, and be secured
    in that manner; against which We consent that, if in the sequel the forests excepted from the dismemberment
    should be found insufficient for the timber rights pertaining to the fisc in respect of the Domain
    Office of Ratyn,'
- page: 21
  en: 'a compensation therefor shall be ascertained and secured by an annual canon. In witness whereof
    We have caused the present Consent to be drawn up and executed under the customary signature and the
    greater seal of Our Chamber of War and Domains. Thus done and given at Kalisch, the 28th of January
    1806.


    (L. S.) Royal South Prussian Chamber of War and Domains.


    Menickel[illegible]


    Schmiedike


    Kann


    Koch


    Wayda.


    Consent to the dismemberment of the lordships Zagorowo and Trąbczyn.


    That the foregoing copies have been found, praevia Collatione, to agree'
- page: 22
  en: 'with their originals in wording, is hereby credibly attested. Marianton, the 27th of October 1806.
    (L. S.) Princely Hohenlohe Patrimonial Court at Trąbczyn. Hawich.


    Drawn up in due form, with the impression of the court seal and the customary signature.


    Peysern, the 13th of August 1807. Princely Hohenlohe Patrimonial Court. Hawich.


    Execution of the hereditary-lease contract between the Councillor of War and Forests von Triebenfeld,
    as General Bevollmächtigter of His Serene Highness the reigning Prince of Hohenlohe-Ingelfingen, and
    the resident Christian Friedenberger, concerning one Hufe Magdeburg measure of land.'

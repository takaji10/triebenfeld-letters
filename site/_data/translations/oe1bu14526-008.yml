status: draft
segments:
- page: 1
  en: 'The Princely Hohenlohe Patrimonial Court hereby gives to be known that between the Councillor of
    War and Forests v. Triebenfeld, as General Bevollmächtigter of His Serene Highness, as seller on the
    one part, and the resident Christian Friedenberger, as purchaser on the other part, the following
    hereditary-lease contract, concerning one Hufe Magdeburg measure of land situate in the Trąbczyn forest,
    has been concluded and judicially declared before us.


    Actum Trąbczyn, the 25th of March 1806. There appeared the persons well known to the undersigned Justitiarius,
    namely


    1., the Councillor of War and Forests v. Triebenfeld, as General Bevollmächtigter of His Serene Highness
    the reigning Prince of Hohenlohe-Ingelfingen, hereditary and jurisdictional lord of this place, legitimated
    by the power of attorney appended hereto, on the one part, and


    2., the resident Christian Friedenberger of Szymanowicer Hauland, on the other part.


    The comparents are found to be in the [uncertain: condition] validly to execute judicial transactions,
    and declare freely and wil-'
- page: 2
  en: '-lingly and with due deliberation the following hereditary-lease contract to the protocol.


    §. I. His Most Serene Highness namely grants in fee to Christian Friedenberger one Hufe, write One
    Hufe Magdeburg measure, reckoned at thirty Morgen to the Hufe and each Morgen at one hundred and eighty
    square rods, situate in the Trąbczyn forest, from now onward for all perpetual time


    in hereditary lease.


    §. II. The said Christian Friedenberger pays for the one Hufe Magdeburg measure 100 rt., write One
    hundred Rthaler, as entry-money; and since this entry-money is already fully paid, Christian Friedenberger
    is hereby receipted for the same without further reservation.


    §. III. Christian Friedenberger'
- page: 3
  en: 'binds himself hereby, for himself and his successors in possession of this holding, to pay from
    this one Hufe a yearly hereditary canon of thirty Rthaler, write thirty Rthaler, to the Dominium of
    this place; and this hereditary rent shall be discharged yearly in two instalments, namely one half
    at Christmas and the other half at St. John''s, each time in cash and in Courant to the manorial treasury.


    §. IV. For the wholly uncultivated arable the hereditary lessee receives three free years, which begin
    from Martinmas of the past year and end at St. John''s 1809, so that the first half-yearly hereditary
    rent must be paid at Christmas 1809 with 15 rt., write fifteen Rthaler'
- page: 4
  en: 'Rthaler.


    That land which at the measuring-out is handed over to Christian Friedenberger as already cultivated,
    be it much or little, shall bear rent from Christmas of this year, since the free years extend only
    to that part which has first to be brought under cultivation.


    §. V. It stands free to the hereditary lessee to redeem the stipulated hereditary [uncertain: rent]
    of the thirty [illegible] up to one half, that is to say, according to his means, to pay off to the
    ground-lordship one, two, up to three hundred [uncertain: Thaler] of capital, whereupon for every
    hundred Rthaler five Rthaler shall be'
- page: 5
  en: 'abated yearly from the hereditary rent; the capital so paid off remains the property of the ground-lordship,
    and this redemption of the hereditary rent takes place only in respect of the first half; the second
    half, at fifteen Rthaler per Hufe, on the other hand remains irredeemable and can never be raised
    or diminished.


    §. VI. Besides the [uncertain: aforesaid] hereditary rent, the hereditary lessee undertakes, for the
    present and for future times perpetually, to discharge and to render all the Royal and other public
    dues falling upon this one Hufe, in whatsoever they may consist, without any exception and without
    deduction from the hereditary rent or any other reimbursement, and to'
- page: 6
  en: 'to perform.


    §. VII. The hereditary lessee must [uncertain: build] at his own cost, without receiving for this
    either now or in future timber or other building assistance; however, all the timber standing on his
    Hufe belongs to him in property without exception.


    Likewise the hereditary lessee and his successors in possession of this holding must effect all future
    repairs and new buildings out of their own means, without subsidy or aid.


    §. VIII. Outside his own holding the hereditary lessee has no right to firewood or to [uncertain:
    pasture] in the manorial woods and fields.


    §. IX. His drink the hereditary lessee must always take from'
- page: 7
  en: 'the manorial brewery and distillery or from the tavern; if foreign drink is brought in by him or
    over his people, the hereditary lessee shall each time incur a penalty of 5 rt. for every barrel of
    beer and one Rthaler for every garniec of brandy, which penalty is to be paid to the ground-lordship.


    §. X. To the milling compulsion the hereditary lessee is subject, and he may grind his grain only
    where the manorial lordship directs him.


    §. XI.


    From all and every manorial service and deliveries in kind without distinction the hereditary lessee
    is entirely exempted for [uncertain: ever],'
- page: 8
  en: 'yet he remains subject to the jurisdiction of the Dominus of this place.


    §. XII.


    The hereditary lessee and his successors in possession are entitled to alienate his holding to another
    in any manner he pleases; but at every sale or exchange the tenth Groschen of the [uncertain: purchase]
    or exchange money must be paid to the ground-lordship as a Laudemium, and the [uncertain: consent]
    of the same must be obtained for every alienation, inasmuch as the ground-lordship hereby reserves
    to itself once and for all the right of pre-emption.


    §. XIII. The hereditary lessee renounces, for himself and his successors in possession, all and every
    remission in cases of mis-'
- page: 9
  en: '-fortune, be the same arising through fire from heaven, or the incendiarism of evil people, hail-storm,
    crop failure, cattle plague, inundation, war and pestilence, or in whatever manner it may arise, wholly
    for the present and for the future; and in cases occurring neither a bonification nor a remission
    of the hereditary rent shall take place.


    §. XIV. All the costs attending this contract the hereditary lessee undertakes to discharge.


    §. XV. His Most Serene Highness consents that the hereditary lessee may, on the ground of this contract,
    have his title of possession registered for himself.'
- page: 10
  en: '§. XVI. So long as the hereditary lessee and his successors in possession fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights and
    to defend them against every man''s real claim.


    But should the hereditary lessee or his successors remain in arrears with the yearly hereditary rents
    longer than two years, or else lay waste this holding and thereby diminish the revenues of the ground-lordship,
    then the ground-lordship shall be entitled to [uncertain: dispose of] this holding otherwise, and
    the hereditary lessee forfeits his whole'
- page: 11
  en: 'right and the entry-money paid in.


    Both parties promise to keep this hereditary-lease contract firmly and inviolably; being judicially
    instructed as to the consequences, they renounce all subterfuges available against it, particularly
    the objection of an injury suffered above or below the half, of cunning persuasion, fear, compulsion,
    of matters otherwise agreed than written down, or not rightly understood; they moved that this contract
    be judicially engrossed, and, after previous verbatim reading out to them, in token of approval have'
- page: 12
  en: 'hereunder subscribed and signed with their own hands.


    v. Triebenfeld    xxx own hand-mark of Christian Friedenberger


    Schenck

    Justitiarius


    Ogrodowicz

    Protocollant


    General Power of Attorney


    I, the undersigned, do hereby make known and confess that I hereby [uncertain: expressly] empower
    the Royal Councillor of War and Forests, Herr Peter Friedrich August v. Triebenfeld, Your Right Honourable,
    of Schweinern etc., to manage in my name all and every affair touching the estates of Zagorowo, Wittow
    and Trąbczyn belonging to me, situate in South Prussia in the Kalisch Department, whether they concern
    a dismemberment, or purchase and sale, leasing or pledging, or by whatever other name they may be
    called and whatever bearing and influence they may have, both judicially and extrajudicially, to ad-'
- page: 13
  en: '-minister; to petition, respectively to notify, all approbations or directives necessary in the
    matter, as well as all other requisites appearing to him necessary, both with the most laudable Chamber
    and with the most laudable Government at Kalisch and with all other requisite offices and authorities;
    and to manage all other requisite business for me; to settle accounts and conclude agreements with
    the tenants; to pay out moneys, to receive the like, and to give receipt for them; to issue to my
    officials and servants there the orders proper to them; to examine their conduct and service, and
    if he should not find such [uncertain: according] to his insight fitting and should find it prejudicial
    to me, to suspend them if need be; and in general un-'
- page: 14
  en: '-restrictedly and freely to act in all authorities and affairs as he shall find good and most conformable
    to my interest.


    Whatsoever my said Bevollmächtigter shall do by virtue of this commission received, I hereby promise
    to approve and to hold thereby so inviolably as if I had done it myself. At the same time I also bind
    myself to indemnify my Herr Bevollmächtigter in every quarter on account of this commission, and to
    reimburse him all [uncertain: costs] and outlays, upon the pledging of my present and future property,
    so far as shall be required thereto. In witness whereof I have subscribed this General Power of Attorney
    with my own hand and'
- page: 15
  en: 'confirmed it by the impression of my arms. Thus done at the Guhewitzsch Justice Office near Breslau,
    the 19th February 1805. (L. S.) read by myself and approved, Friedrich Ludwig Fürst zu Hohenlohe.


    That His Serene Highness the reigning Prince and Lord, well known in person to the undersigned Justice
    Office and fully capable of disposition, General of Infantry, Chief of a Regiment, Governor of the
    city and fortress of Breslau and Knight of the Great Black and Red Eagle Orders, Herr Friedrich Ludwig
    Fürst zu Hohenlohe Ingelfingen, did draw up before us and with our participation, under this date,
    the foregoing General Power of Attorney directed to the Royal Councillor of War and Forests Herr v.
    Triebenfeld, acknowledged himself throughout to its verbatim contents, and thereupon, after His Highness
    had once more previously read the same through'
- page: 16
  en: 'and approved it, subscribed and sealed it in our presence as his own — this is hereby attested
    testando Protocolli de hodicano in fidem puplicam. Thus done at the Guhrwitz Justice Office near Breslau,
    the 19 February 1805. Baronial Stillfried Luhemitz Justice Office


    (L. S.)


    Koeppen

    Justitiarius


    Kaleschke

    Actuarius


    We Friedrich Wilhelm, by God''s grace King of Prussia etc., make known and hereby give to be known
    that, whereas the possessor of the lordships of Zagorowo and Trąbczyn, situate in South Prussia in
    the Kalisch Chamber Department and in its Koninsch district, of the reigning Herr Fürst zu Hohenlohe
    Ingelfingen, has sought of us permission, reserving a part of the demesne farm Trąbczyn'
- page: 17
  en: 'together with the manorial parcels at Marianton, amounting in all to Seven hundred and Eighty-one
    Morgen and 77 square rods, and likewise four [uncertain: thousand] Nine hundred and Forty-seven Morgen
    of forest, to dismember the said lordships together with the remaining and greater part of the forests,
    namely


    A.) the demesne farms belonging to the lordship of Zagorowo — Drzewce, Kopoyno, Swiątniki, Swięcia
    and Broniki — and likewise the demesne farms belonging to the lordship of Trąbczyn — Nowawies, Przybislaw,
    Stara Hutta — and a part of the demesne farm Trąbczyn;


    B. to let out in hereditary lease the demesne farm and village Olesnice and likewise the demesne farm
    and village Szetlewek; and


    C. to convert the services and prestations of all the subjects into a fixed money rent — we have therefore,
    in view of'
- page: 18
  en: 'the usefulness of this undertaking and of the profitable services rendered and still to be rendered
    to Us and Our Royal House by His Liebden the reigning Herr Fürst zu Hohenlohe Ingelfingen, Our General
    of Infantry and Governor of Breslau, by Cabinet Orders of the 22 October and 7 December of last year,
    resolved to comply with this his petition in such wise and to approve the same, provided that the
    following modalities shall obtain, namely


    1., that the indemnification to be granted to the subjects for their hitherto pasturage and timber
    rights be more precisely determined, and that in the hereditary-rent instruments of each individual
    the extent of the area assigned to him rent-free in lieu thereof be'
- page: 19
  en: 'exactly noted; as likewise here in general the provisions contained in §. 12. of the Edict issued
    for the Province of Silesia under the 1st May 1804 must be duly followed, on the ground of a special
    and rectified survey;


    2., that none of the present rustical holdings may lapse, but that if in case of a fire-damage or
    other misfortune no one is found who will re-establish such a holding out of his own means, the Dominium
    must restore the building at its own cost;


    3., that all the sovereign dues now charged upon the said estates, or in future still to be laid upon
    them, and other charges likewise, shall as heretofore be'
- page: 20
  en: '-livered to Our treasuries appointed thereto, within the prescribed terms; and that for their security
    the needful be on that account entered in the mortgage book of the lands and forests reserved by the
    Dominium;


    4., that the timber rights belonging to the monastery and provostry of Ląd be likewise entered in
    the mortgage [book] upon the totality of the forests reserved from the dismemberment, and be in such
    manner secured; against which we consent that if hereafter the forests excepted from the dismemberment
    should be found insufficient for the timber rights belonging to the fisc in respect of the Domain
    Office of Ratyn,'
- page: 21
  en: 'an indemnification therefor shall be ascertained and secured by a yearly canon. In witness whereof
    we have caused the present Consens to be engrossed and executed under the usual signature and the
    greater seal of Our War and Domains Chamber. Thus done and given at Kalisch, the 28 January 1806.
    (L. S.) Royal South Prussian War and Domains Chamber


    Menickel[illegible]

    Schmiedike

    Kann

    Koch

    Wayda


    Consens for the dismemberment of the lordships of Zagorowo and Trąbczyn.


    That the foregoing copies have been found, praevia Collatione, of like'
- page: 22
  en: 'tenor with their originals, is hereby credibly attested. Marianton, the 27th October 1806. (L.
    S.) Princely Hohenlohe Patrimonial Court at Trąbczyn


    Hawich


    Engrossed in due form, with the impression of the court seal and the usual signature.


    Peysern, the 13th August 1807. Princely Hohenlohe Patrimonial Court


    Hawich


    Engrossment of the hereditary-lease contract between the Councillor of War and Forests v. Triebenfeld,
    as General Bevollmächtigter of His Serene Highness the reigning Fürst zu Hohenlohe Ingelfingen, and
    the resident Christian Friedenberger, concerning one Hufe Magdeburg measure of land.'

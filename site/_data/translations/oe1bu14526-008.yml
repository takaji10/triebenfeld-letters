    the province of Silesia on the 1st of May 1804 must be duly observed upon the ground of a special
    and corrected survey;


    2., that none of the present peasant holdings may be suppressed, but that if, upon a loss by fire
    or other misfortune, no one is found who will re-establish such a holding out of his own means, the
    manorial lordship (Dominium) must restore the buildings at its own cost;



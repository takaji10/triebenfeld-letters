  - '100'
  - II.
  - III.
- page: 3
  en: 'hereby binds himself, for himself and his successors in possession of this holding, to pay from
    this one Hufe an annual hereditary canon of thirty Reichsthaler, in words thirty Reichsthaler, to
    the manorial lordship (Dominium) of this place; and this hereditary rent shall be discharged yearly
    in two instalments, namely one half at Christmas and the other half at Midsummer, each time in cash
    and in Courant, to the lordship''s treasury.


    §. IV. For the wholly uncultivated arable the hereditary lessee receives three free years, which begin
    from Martinmas of the past year and end at Midsummer 1809, so that the first half-yearly hereditary
    rent must be paid at Christmas 1809 with 15 rt., in words fifteen Reichsthaler'
  names:
  - de: Dominium
    en: manorial lordship (Dominium)
    kind: other
  numbers:
  - IV.
  - '1809'
  - '15'
  - '1809'
- page: 4
  en: 'Reichsthaler must be paid.


    That land which at the measuring-out is handed over to Christian Friedenberger as already under cultivation,
    be it much or little, shall bear rent from Christmas of this year, inasmuch as the free years extend
    only to that part which must first be brought under cultivation.


    §. V. It stands free to the hereditary lessee to redeem the fixed hereditary rent of the thirty [uncertain:
    Reichsthaler] up to one half, that is to say, to pay off to the ground lordship, according to his
    means, one, two, up to three hundred [illegible] of capital, whereupon for every hundred Reichsthaler
    five Reichsthaler shall be'
  names:
  - de: Christian Friedenberger
    en: Christian Friedenberger
    kind: person
  numbers:
  - V.
- page: 5
  en: 'taken off the hereditary rent yearly; the capital so paid off remains the property of the ground
    lordship, and this redemption of the hereditary rent takes place only in respect of the first half;
    the second half, at fifteen Reichsthaler per Hufe, on the other hand remains irredeemable and can
    never be raised or diminished.


    §. VI. Besides the [uncertain: aforesaid] hereditary rent, the hereditary lessee takes upon himself,
    for the present and for future times perpetually, to discharge and render all royal and other public
    dues whatsoever falling upon this one Hufe, consist in what they may, without any exception and without
    deduction from the hereditary rent or other reimbursement, and to'
  numbers:
  - VI.
- page: 6
  en: 'render.


    §. VII. The hereditary lessee must [uncertain: build] at his own cost, without receiving for this
    purpose, either now or in the future, timber or other building assistance; nevertheless all the timber
    standing upon his Hufe belongs to him in property, without exception.


    Likewise the hereditary lessee and his successors in possession of this holding must effect all future
    repairs and new buildings out of their own means, without subsidy or assistance.


    §. VIII. Outside his own possession the hereditary lessee has no right to firewood or to [uncertain:
    pasture] in the lordship''s forests and fields.


    §. IX. His drink the hereditary lessee must always take from'
  numbers:
  - VII.
  - VIII.
  - IX.
- page: 7
  en: 'the lordship''s brewery and distillery or from the tavern; if foreign drink be brought in by him
    or by his people, the hereditary lessee incurs each time a penalty of 5 rt. for every barrel of beer
    and one Reichsthaler for every garniec of brandy, which penalty is paid to the ground lordship.


    §. X. The hereditary lessee is subject to the milling compulsion and may grind his corn only where
    the estate lordship directs him. §. XI.


    From all and every manorial service and deliveries in kind, without distinction, the hereditary lessee
    is for ever wholly exempt;'
  numbers:
  - '5'
  - X.
  - XI.
- page: 8
  en: 'he nevertheless remains subject to the jurisdiction of the lordship of this place.


    §. XII.


    The hereditary lessee and his successors in possession are entitled to alienate his holding to another
    in any manner whatsoever; but on every sale or exchange the tenth Groschen of the purchase or exchange
    money must be paid to the ground lordship as a transfer fee (Laudemium), and its consent must be obtained
    to every alienation, inasmuch as the ground lordship hereby reserves to itself once and for all the
    right of pre-emption.


    §. XIII. The hereditary lessee renounces, for himself and his successors in possession, all and every
    remission upon mis-'
  names:
  - de: Dominus
    en: lordship
    kind: other
  numbers:
  - XII.
  - XIII.
- page: 9
  en: 'fortunes, whether these arise through fire from heaven or by the incendiarism of evil persons,
    hailstorm, crop failure, cattle plague, flood, war and pestilence, or in whatsoever manner it may
    be, for the present and for the future entirely, and upon such cases occurring neither compensation
    nor abatement of the hereditary rent shall take place.


    §. XIV. All the costs attending this contract the hereditary lessee takes upon himself to discharge.


    §. XV. His Most Serene Highness consents that the hereditary lessee may, upon the ground of this contract,
    have his title of possession settled for himself.'
  numbers:
  - XIV.
  - XV.
- page: 10
  en: '§. XVI. So long as the hereditary lessee and his successors in possession shall fulfil all the
    obligations contained in this contract, His Most Serene Highness promises to maintain them in their
    rights and to defend them against any man''s real claim.


    Should, however, the hereditary lessee or his successors remain in arrears with the annual hereditary
    rent for longer than two years, or else lay waste this holding and thereby diminish the revenues of
    the ground lordship, then the ground lordship shall be entitled to dispose of this holding otherwise,
    and the hereditary lessee forfeits his whole'
  numbers:
  - XVI.
- page: 11
  en: 'right and the entry-money paid in.


    Both parties promise to keep this hereditary-lease contract firmly and inviolably; being judicially
    instructed as to the consequences, they renounce all evasions available against it, in particular
    the objection of an alleged lesion above and below the half, of cunning persuasion, fear, compulsion,
    of matters otherwise agreed than written down or not rightly understood; they moved that this contract
    be judicially engrossed, and have, after previous reading aloud word for word, in token of their approval,'
- page: 12
  en: 'signed and subscribed the same below in their own hands.


    von Triebenfeld xxx the personal mark of Christian Friedenberger Schenck



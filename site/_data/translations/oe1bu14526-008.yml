    security the necessary entry be made in the mortgage book of the lands and forests reserved by the
    manorial lordship (Dominium);


    4. that the rights of taking wood belonging to the monastery and provostry of Ląd be likewise entered
    in the mortgage [book] upon the totality of the [uncertain: forests] reserved from the dismemberment,
    and be secured in that manner; in return whereof we approve that if hereafter the [uncertain: forests]
    excepted from the dismemberment should be found insufficient for the rights of taking wood belonging

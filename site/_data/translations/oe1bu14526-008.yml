  en: 'together with the lordship''s plots at Marianton, amounting in all to seven hundred and eighty-one
    Morgen and 77 square rods, and likewise four [uncertain: thousand] nine hundred and forty-seven Morgen
    of forest, to dismember the said lordships together with the remaining and larger part of the forests,
    namely


    A.) the demesne farms belonging to the lordship of Zagorowo, Drzewce, Kopojno, Swiątniki, Swięcia
    and Broniki, and likewise the demesne farms belonging to the lordship of Trąbczyn, Nowawies, Przybislaw,
    Stara Hutta and one part of the demesne farm Trąbczyn;


    B. to grant in hereditary lease the demesne farm and village Olesnice, and likewise the demesne farm
    and village Szetlewek;


    and


    C. to be permitted to convert the services and prestations of all the subjects into a fixed money
    rent — so have we, in consideration of'

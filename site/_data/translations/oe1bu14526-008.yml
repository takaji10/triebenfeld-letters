    Keeper of the protocol


    General power of attorney. I, the undersigned, do hereby make known and declare that I hereby expressly
    empower the Royal Councillor of War and Forests Mr Peter Friedrich August


    von Triebenfeld, Your Right Honourable, of Schweinern etc., to conduct in my name all and every affair
    touching the estates of Zagorowo, Witów and Trąbczyn belonging to me and situated in South Prussia
    in the Kalisz department, whether they concern a dismemberment, or purchase and sale, leasing or pledging,
    or by whatever name they may be called and whatever bearing and influence they may have, both judicially
    and extrajudicially to man-'

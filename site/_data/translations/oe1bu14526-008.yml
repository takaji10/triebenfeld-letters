  en: the impression of my arms confirmed it. Thus done at the Guhrwitz Court of Justice near Breslau,
    the 19th of February 1805. (L. S.) read by myself, and approved. Friedrich Ludwig, Prince of Hohenlohe.
    That His Serene Highness the reigning Prince and Lord, personally very well known to the undersigned
    Court of Justice and fully capable of disposition, General of Infantry, chief of a regiment, Governor
    of the town and fortress of Breslau and knight of the great Black and Red Eagle Order, Friedrich Ludwig,
    Prince of Hohenlohe-Ingelfingen, executed before us and with our attendance the above general power
    of attorney drawn in favour of the Royal Councillor of War and Forests Mr von Triebenfeld, under this
    date; that he acknowledged himself throughout to the verbatim contents of the same; and that thereupon,
    after His Highness had once more read the same through beforehand

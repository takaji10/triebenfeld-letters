- page: 1
  en: 'The Princely Hohenlohe Patrimonial Court hereby gives to be known that between the Councillor of
    War and Forests von Triebenfeld as general attorney of His Serene Highness as seller of the one part,
    and the resident Christian Friedenberger as purchaser of the other part, the following hereditary-lease
    contract, over one Magdeburg Hufe of land situated in the Trąbczyn forest, has been concluded and
    judicially declared before us.


    Actum Trąbczyn, the 25th of March 1806. There appeared the persons well known to the undersigned justiciary,
    namely


    1., the Councillor of War and Forests von Triebenfeld as general attorney of His Serene Highness the
    reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court of this place, legitimated
    by the enclosed power of attorney, of the one part, and


    2., the resident Christian Friedenberger of Szymanowicer Hauland, of the other part.


    The appearers find themselves in the condition to execute judicial acts validly, and declare freely
    and de-'

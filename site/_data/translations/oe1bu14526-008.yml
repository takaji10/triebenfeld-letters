- page: 2
  en: 'untarily and after due deliberation the following hereditary-lease contract to the protocol.


    § I. His Most Serene Highness grants in hereditary lease to Christian Friedenberger one Hufe, in words
    One Hufe Magdeburg measure, reckoned at thirty Morgen to the Hufe and each Morgen at one hundred and
    eighty square rods, situated in the Trąbczyn forest, from now on for all perpetual time


    in hereditary lease.


    § II. Christian Friedenberger pays for the one Hufe Magdeburg measure 100 rt., in words One hundred
    Rthaler, as purchase money; and since this purchase money is already fully paid, Christian Friedenberger
    is hereby receipted for it without further reservation.


    § III. Christian Friedenberger'
  names:
  - de: Christian Friedenberger
    en: Christian Friedenberger
    kind: person
  - de: Trąbczyner Walde
    en: Trąbczyn forest
    kind: place
  numbers:
  - I
  - II
  - '100'
  - III
- page: 3
  en: 'hereby binds himself, for himself and his successors in possession of this holding, to pay to the
    manorial lordship (Dominium) of this place an annual hereditary canon of thirty Rthaler, in words
    thirty Rthaler, from this one Hufe; and this hereditary rent shall be settled yearly in two instalments,
    namely with the one half at Christmas and with the other half at Midsummer, on each occasion in cash
    and in Courant, to the manorial treasury.


    § IV. For the wholly unbroken arable the hereditary lessee receives three free years, which begin
    from Martinmas of the past year and end at Midsummer 1809, so that the first half-yearly hereditary
    rent must be paid at Christmas 1809 with 15 rt., in words fifteen Rthaler'
  numbers:
  - IV
  - '1809'
  - '15'
  - '1809'
- page: 4
  en: 'Rthaler.


    That land which, at the measuring out, is handed over to Christian Friedenberger already as broken
    ground, be it much or little, bears rent from Christmas of this year, since the free years extend
    only to that part which has first to be made arable.


    § V. It stands free to the hereditary lessee to redeem the fixed hereditary rent of the thirty [uncertain:
    Rthaler] up to one half, that is to say, to pay off to the ground lordship, according to his means,
    one, two, up to three hundred [uncertain: thaler] of capital, whereupon for every hundred Rthaler
    five Rthaler shall be'
  names:
  - de: Christian Friedenberger
    en: Christian Friedenberger
    kind: person
  numbers:
  - V
- page: 5
  en: 'abated yearly from the hereditary rent; the capital so paid off remains the property of the ground
    lordship, and this redemption of the hereditary rent takes place only in respect of the first half;
    the second half, of fifteen Rthaler per Hufe, on the other hand remains irredeemable and can never
    be raised or reduced.


    § VI. Besides the [uncertain: inner] hereditary rent, the hereditary lessee undertakes, for the present
    and for future times in perpetuity, to settle and to render all the royal and other public dues whatsoever
    falling upon this one Hufe, in whatever they may consist, without any exception and without deduction
    from the hereditary rent or any other reimbursement, and to'
  numbers:
  - VI
- page: 6
  en: 'render.


    § VII. The hereditary lessee must build at his own cost, without receiving for this, either now or
    in future, timber or other building assistance; however, all the timber standing on his Hufe belongs
    to him in property without exception.


    Likewise the hereditary lessee and his successors in possession of this holding must effect all future
    repairs and new buildings out of their own means, without subsidy or assistance.


    § VIII. Outside his own possession the hereditary lessee has no right to firewood or to [uncertain:
    pasturage] in the manorial forests and fields.


    § IX. His drink the hereditary lessee must always take from'
  numbers:
  - VII
  - VIII
  - IX
- page: 7
  en: 'the manorial brewery and distillery, or from the tavern; if foreign drink is brought in by him
    or through his people, the hereditary lessee forfeits on each occasion a penalty of 5 rt. for every
    barrel of beer and one Rthaler for every garniec of brandy, which penalty is to be paid to the ground
    lordship.


    § X. The hereditary lessee is subject to the milling compulsion and may grind his grain only where
    the estate lordship directs him.


    § XI. From all and every manorial service and deliveries in kind, without distinction, the hereditary
    lessee is for ever wholly exempt;'
  numbers:
  - '5'
  - X
  - XI
- page: 8
  en: 'he remains, however, subject to the jurisdiction of the lordship of this place.


    § XII.


    The hereditary lessee and his successors in possession are entitled to alienate their holding to another
    in any manner they please; but on each sale or exchange the tenth Groschen of the purchase or exchange
    money must be paid to the ground lordship as a transfer fee (Laudemium), and its consent obtained
    to every alienation, the ground lordship hereby reserving to itself once and for all the right of
    pre-emption.


    § XIII. The hereditary lessee, for himself and his successors in possession, renounces all and every
    remission in cases of mis[fortune]'
  numbers:
  - XII
  - XIII
- page: 9
  en: 'fortune, whether they arise through fire from heaven or the incendiarism of evil persons, hailstorm,
    crop failure, cattle plague, inundation, war and pestilence, or in whatever manner it may be, for
    the present and for the future, entirely; and in cases arising neither a compensation nor a remission
    of the hereditary rent shall take place.


    § XIV. All costs pertaining to this contract the hereditary lessee undertakes to settle.


    § XV. His Most Serene Highness consents that the hereditary lessee may, on the ground of this contract,
    have his title of possession settled in his own name.'
  numbers:
  - XIV
  - XV
- page: 10
  en: '§ XVI. So long as the hereditary lessee and his successors in possession fulfil all the obligations
    contained in this contract, His Most Serene Highness promises to maintain them in their rights and
    to defend them against every man''s claim in rem.


    Should, however, the hereditary lessee or his successors remain in arrears with the annual hereditary
    rent longer than two years, or else lay waste this holding and thereby diminish the revenues of the
    ground lordship, then the ground lordship shall be entitled to dispose of this holding otherwise,
    and the hereditary lessee forfeits his whole'
  numbers:
  - XVI
- page: 11
  en: 'right and the purchase money paid in.


    Both parties promise to hold to this hereditary-lease contract firmly and inviolably; having been
    judicially instructed as to the consequences, they renounce all subterfuges available against it,
    in particular the plea of injury beyond and below the half, of cunning persuasion, fear, coercion,
    of matters otherwise agreed than written down, or not rightly understood; they applied for this contract
    to be made out judicially, and, after it had first been read aloud to them word for word, have, in
    token of their approval,'
- page: 12
  en: 'subscribed and signed the same below in their own hands.


    von Triebenfeld xxx own hand-mark of Christian Friedenberger Schenck


    Justiciary


    Ogrodowicz


    Recorder of the protocol


    General power of attorney. I, the undersigned, make known and acknowledge hereby that I do expressly
    empower the Royal Councillor of War and Forests Peter Friedrich August von Triebenfeld, Your Honour,
    of Schweinern etc., hereby to manage, both judicially and extrajudicially, in my name all and every
    affair concerning the Zagorowo, Witów and Trąbczyn estates belonging to me, situated in South Prussia
    in the Kalisz Department, whether they concern a dismemberment, or a purchase and sale, a leasing
    or a pledging, or by whatever name they may be called and upon which they may bear and have influence;'

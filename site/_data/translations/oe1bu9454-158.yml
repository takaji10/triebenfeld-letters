- page: 3
  en: 'The Biron matter has struck fear and terror into everyone — the moral lecture which Your Serene
    Highness writes merely on account of the Schlabrendorff matter I did not deserve. Every breach of
    my word is foreign to my heart, and shall remain so to my last breath. I do not indeed know what I
    wrote in that agonising moment; yet I must have expressed myself mistakenly, in giving answer to Your
    Serene Highness''s letter — Honour remains in all my dealings the first motive spring; to it I sacrifice
    effort, means and health. And the truth which I then spoke in the Pro Memoria upon the whole Schläbe
    dorff matter is, by my way of thinking, no piece of knavery — I should curse all my dealings, and
    withdraw — to which I am much inclined — into the last corner of the earth, far from all men, if I
    were in the end to be judged so.


    The Mennonites I shall answer definitely according to Your Serene Highness''s command. Wollenhaupt''s
    opinion regarding the dismemberment of the estates is too insignificant for one to be permitted to
    say a word further about it. Should Your Serene Highness deign to give him the commission and promise
    him a few Tausendtstäd, he warrants he will dismember half the world — I have the samples'

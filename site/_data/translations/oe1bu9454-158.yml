- page: 1
  en: 'Most Serene Prince


    Most gracious Lord: At last, through the mediation of the venerable General von Köckritz, it has been
    brought about that the Invalids'' Department has now declared itself willing to furnish 150000 Rthl,
    without my having to seek permission for it from His Majesty the King, which is otherwise the course
    of business. The Department gives, for the present, 50000 Rthl upon the mortgage and my bill of exchange;
    then the Chamber must still revise the assessments, and after these the Department pays the 100000
    Rthl, which, provided the interest is duly paid, may stand for 50 years.


    The [uncertain: populle] deposit fund, the Widows'' Fund still less, nor the Bank or the Maritime
    Trading Company, pay a single heller more into South Prussia, but are rather at pains to call everything
    in — this causes a frightful stagnation in all business and spreads such lamentation and [uncertain:
    Ob.] among the people that one''s hair stands on end. I too should have obtained nothing, had not
    the [uncertain: Braun] General taken up my cause in the most active manner. The


    26 Jan 1805.'

- page: 4
  en: 'still before me — [uncertain: Rochtet] matters I shall attend to on my return to Unruhstad. The
    free pass for the wines must by now already be there. What the subjects of Betsche want I do not understand
    — there must again be some store of trouble lurking in the background. Meanwhile the date of this
    letter is of the month of June, and indeed earlier than that of the contract.


    Next Wednesday I go back from here, in order to direct in Kalisz the revision of the assessment, so
    as to obtain the 100000 Rthl the sooner, and then to be able to dismember in peace. The Eysenhardt
    affair is proceeding [uncertain: et melang] wise and well, so that Your Serene Highness will have
    no vexation on that account. In deepest reverence I remain, until death, Your Most Serene Highness''s
    — As to the moneys to be sent out into the Empire, about half of the 30000 Rthl could now be got together
    — I thought Your Serene Highness might send that sum now, and promise to remit the other 15000 Rthl
    soon after.


    Berlin


    the 26th of January


    1805


    humble and obedient servant


    von Triebenfeld'

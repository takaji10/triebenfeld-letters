- page: 4
  en: 'still before me — I shall forward the Rochlitz matters on my return to Kargowa. The free pass for
    the wines must by now already be there. What the Pszczew subjects want I do not understand — there
    must again be some store lurking in the background. Meanwhile the date of this letter is of the month
    of June, and indeed earlier than that of the contract.


    Next Wednesday I go back from here, in order to direct at Kalisz the revision of the valuation, so
    as to obtain the 100,000 Rthl the more quickly, and then to be able to dismember in peace. The Eysenhardt
    matter Amelang directs wisely and well, so that Your Serene Highness will have no vexation on that
    account. In deepest reverence I remain, until death, Your Most Serene Highness''s — As to the moneys
    to go out to the Reich, about half of the 30/m Rthl could now be brought together at this time — I
    thought Your Serene Highness might send that sum now, and promise to send the other 15,000 Rthl soon
    after.


    Berlin


    the 26th of January


    1805


    humble and obedient servant


    v Triebenfeld'

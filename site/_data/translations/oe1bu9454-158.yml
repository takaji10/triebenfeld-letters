- page: 2
  en: 'bankers here now themselves give, merely to keep themselves afloat, 10 to 12 per cent brokerage
    on 5 to 6 per cent interest; and besides, Liep: Meyer Wolff each sets his own terms — he alone still
    has money, and thinks of those seeking money whatever is agreeable to him. Whoever now falls into
    the hands of men of this sort is irretrievably lost. God and that upright friend be heartily thanked
    that he here allotted a better and truly the most desirable lot of all. As soon as I now receive the
    money I shall pay the 10000 Rthl that have been demanded, and send Your Serene Highness in all haste
    the remaining sum after deduction of costs.


    With the Tirard and Hauk affair I am finished; tomorrow I pay the arrears of interest out of my own
    money, and then someone takes over the debt, which can stand quietly for 4 years. The suit concerning
    the brokerage taken I do not find well advised — the thing damages Your Serene Highness''s credit
    anew, and frightens off all those so-called men of business who are hand in glove with one another.
    This was indeed already cast up at me in the course of this very transaction, and appeal was made
    to it that Seebald should bring suit and demand the brokerage back;'

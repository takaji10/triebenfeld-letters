- page: 1
  en: '158


    Most Serene Prince


    Most gracious Lord, at last, through the mediation of the venerable General von Köckritz, it has been
    achieved that the Invalids'' Department has now declared itself willing to advance 150,000 Rthl, without
    my having to seek the permission of His Majesty the King, which is otherwise the course of business.
    The Department gives for the present, upon the mortgage and my bill of exchange, 50,000 Rthl; then
    the Chamber must still revise the valuations, and after these the Department pays the 100,000 Rthl,
    which, of the interest being duly paid, can stand for 50 years.


    The wards'' deposit fund, the widows'' fund, and still less the Bank or the Maritime Trading Company,
    pay not one Ezer more into South Prussia either, but are striving to call everything in — this causes
    a fearful stoppage in all business and spreads such Ah! and Oh! among the people that one''s hair
    stands on end. I too should have obtained nothing, had the Braun General not taken up my cause in
    the most active manner. The'

- page: 3
  en: 'The Biron affair has struck fear and terror into all — the moral lesson which Your Serene Highness
    writes to me solely on account of the Schlabrendorff affair I did not deserve. Every breach of faith
    is foreign to my heart, and so it shall remain to my last breath. I do not indeed know what I wrote
    in that agonising moment; in every case I must have expressed myself erroneously, in giving an account
    according to Your Serene Highness''s letter. Honour remains in all my dealings the first spring of
    action; to it I sacrifice toil, means, and health. And the truth which I then stated in the Pro Memoria
    concerning the whole Schlabrendorff affair is, according to my [uncertain: demart], no knavery. I
    should curse all my dealings, and withdraw — a thing to which I am much inclined — into the last corner
    of the earth, far from all men, if in the end I were to be judged so.


    The Mennonites I shall answer definitely according to Your Serene Highness''s command. Wöllenhaupt''s
    judgement concerning the dismemberment of the estates is too inconsiderable for a further word to
    be said about it. Let Your Serene Highness be pleased to give him the commission and promise him a
    few thousand, and he assures you he will dismember half the world — I have the samples'

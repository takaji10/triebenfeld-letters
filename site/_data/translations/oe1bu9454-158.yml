- page: 2
  en: 'bankers here now themselves give, merely to keep themselves afloat, 10 to 12 per cent proximaticum
    for 5 to 6 per cent interest; besides which Liep: Meyer Wolff fest each his aim — he alone still has
    money, and thinks of those seeking money whatever is agreeable to him. Whoever now falls into the
    hands of this sort of men is irretrievably lost. God and the honest friend be heartily thanked that
    here He appointed a better, and truly the most desirable, lot — As soon as I now receive the money
    I shall pay the [uncertain: ſehen] demanded 10,000 Rthl and send in haste to Your Serene Highness
    the sum remaining after deduction of the costs.


    With the Girard and Hauk matter I am done; tomorrow I pay the arrears of interest out of my own money,
    and then someone takes over the debt, which can stand quietly for 4 years. The suit over the proxenetica
    that were taken I do not find well advised — the thing damages Your Serene Highness''s credit anew,
    and frightens off all those so-called men of business who are in league with one another. This was
    even cast up at me in the course of this very business, and appeal was made to it, that Seebald should
    sue and demand the proxenetica back;'

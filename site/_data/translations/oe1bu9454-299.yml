  en: '299


    Most Serene Prince


    Most gracious Prince and Lord!


    My illness has ceased; only the great weakness does not permit me to undertake long journeys. The
    physician forbids exposing oneself at once to the weather, and therefore I must keep quarantine yet
    a few days. With this in view I shall await the return of this messenger. My estate affairs in Kohlen
    [uncertain: Poland] I have arranged — There remain we exactly 62,000 Rthl over — Schenck has leased
    out the estates to a Jew for me shamefully [uncertain: sendenhaft] and badly — yet I now obtain, by
    turning matters otherwise, enough that I shall be able to travel and to meet the manifold costs —
    500 Rthl will now be [text lost] to me, and with that I go to Pszczew and from there to Berlin — the
    Emperor Alexander does not come to Berlin until the end of April, upon which, however, I still expect
    detailed information shortly from Boidelang.


    In Pszczew my first business will be to come to an agreement with Leixner in Międzyrzecz and to see
    that I bring the receipt that has been found into validity — If that succeeds, then I shall have the
    debt struck out of the mortgage book, and seek out the profit that is to be drawn from Pszczew: The
    burgesses and peasants have declared themselves insolvent and are pressing for the cancellation of
    the contract — They prove the lesion, that they are [uncertain: ceded] beyond the half, since the
    estates were valued at only 64,000 Rthl. I prove that the Most High Provincial Authority itself examined
    everything and approved [uncertain: Ewr] Serene Highness''s [uncertain: statement] — since, moreover,
    the Chief President Zerboni desires the cancellation of the contract, I shall consent to it, reserving
    however only quaevis competentia — that is to say, he, the burgesses and the peasants, forfeit the
    earnest money they have given —


    2. They must at once pay the arrears of canon and of competence with about [uncertain: 7]000, so that
    the sequestration ceases forthwith.


    3. They must at once render up to Your Serene Highness the arrears of canon with 11/m Rthl.


    4. They must declare themselves how they intend to discharge the arrears of interest. NB this interest
    was formerly demanded by the State, but now that will fall into the breach, if it is now proved that
    the sum of respectively 137,000 Rthl entered upon Pszczew has been improperly reckoned as Bayonne
    moneys, but that it is the pure private property of Your Serene Highness.


    what is to be gained from this. [uncertain: Dein] will, I shall observe,


    5. The communities themselves must turn their weapons against Echaust and his accomplices —'

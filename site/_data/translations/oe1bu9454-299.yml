- page: 2
  en: 'According to my reckoning there would then remain to Your Serene Highness


    1. The interest on about 68,000 Rthl.


    2. the arrears of canon of 11,000 Rthl.


    3. the 28,000 Rthl paid down by the peasants in 1805.


    4. what can be wrested from Echaust and his accomplices, with 20,000 Rthl. Thus Your Serene Highness
    would have from Pszczew altogether 127,000 Rthl. NB the 28,000 Rthl Your Serene Highness already has;
    there would then still be to receive 99,000 Rthl.


    Now it depends upon what Pszczew is still worth; the forest is totally devastated. At 64,000 Rthl
    it was valued — Queritur, will it be worth 72,000 Rthl? And how will it look with the other 65,000
    Rthl standing upon it? They do indeed also stand in the receipt, but I do not yet know whether I shall
    be able to move Leixner to accept these as well. If that were to succeed, and Leixner were to take
    this sum upon Kolno and Kamionna, then all would be helped — Your Serene Highness would have, as said
    before, 99,000 Rthl to receive. From the estates themselves I [uncertain: nählen] the 72,000 Rthl,
    from the remainder with about 20,000 Rthl.


    Lombardini, Mr Hahn and the good Bally were paid. Everything meanwhile depends on my being favoured
    with Leixner — The man is now destitute; I must support him and give money towards the outlay of costs
    in his business. The Chief President Zerboni is charged from higher quarters to sustain him; Kamionna
    is to remain his — I insist in the meanwhile that the sum of 72 and 65,000 Rthl entered upon Pszczew
    does not belong upon Pszczew but, according to the receipt of Meyer Bernhard, upon Kamionna — God
    grant me further good fortune — But may Your Serene Highness deign to write to me whether this altogether
    has Your approval — the compensation business, which has come to a standstill through the malicious
    delay, will nevertheless turn out very well. It is being worked diplomatically, and the Minister von
    Humboldt has great need of me now — Trzciński is here again — It is not he but the Major Trzciński
    who has been suffocated — He was with me the day before yesterday and has begged for forbearance until
    Midsummer, when he will receive 25,000 Rthl for an estate he has sold — Litigate I cannot; that costs
    money — I have granted him such, but assured him that I shall lay arrest not only upon the purchase
    moneys but upon all revenues. Of Schenck I [uncertain: sehr] and hear nothing — He wants a general
    power of attorney all to himself — May Your Serene Highness deign to send me a letter'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    My illness has ceased; only the great weakness does not permit me to undertake long journeys. The
    physician forbids exposing oneself at once to the weather, wherefore I must still keep quarantine
    for a few days. With this in view I shall await the return of this messenger. My estate affairs in
    Kohlen I have arranged - there remain to us exactly 62000 Rthl - Schenck has leased out the estates
    to a Jew [uncertain: ruinously] and badly - yet I now obtain, by other turns of business, so much
    that I shall be able to travel and to meet the manifold costs; 500 Rthl are now [text lost] to me,
    and with that I go to Betsche and from there to Berlin. The Emperor Alexander does not come to Berlin
    until the end of April, about which however I expect fuller information shortly from the aforesaid
    Beidlung.


    In Betsche my first business will be to come to an agreement with Leixner in Miedzeritz and to see
    that I bring the receipt that has been found into validity - If that succeeds, then I shall have the
    debt struck out in the mortgage book, and seek out the [uncertain: Müzzen] which is to be drawn from
    Betsche: The burgesses and peasants have declared themselves insolvent and press for the annulment
    of the contract - They prove the [uncertain: Lation] that they are injured beyond the half, since
    the estates were valued at only 64000 Rthl. I prove that even the highest authority of the land examined
    everything and approved Your Serene Highness''s offer; since moreover the Chief President Zerboni
    wishes the annulment of the contract, I shall consent to it, yet reserving only quaevis competentia.
    That is to say, the burgesses and peasants forfeit the earnest money they have given.


    2. They must at once pay the arrears of canon and competence with about 2000, so that the sequestration
    ceases at once.


    3. They must at once deliver over to Your Serene Highness the arrears of canon with 11000 Rthl. 4.
    They must declare how they mean to discharge the arrears of interest. NB these interest payments were
    formerly demanded by the State, but now that will fall to the ground, if it be proved that the sums
    of respectively 137000 Rthl entered upon Betsche have been improperly reckoned as [uncertain: Bayon]
    sums, but that it is the pure private property of Your Serene Highness.


    What is to be gained from this, I shall attend to.


    5. The communities must themselves turn their weapons against Echaust and his confederates.'

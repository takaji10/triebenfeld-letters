- page: 3
  en: 'such as I requested in my last, so that I may be rid of him. With Zerboni he has fallen out, I
    do not know on what grounds - The Chief President also wrote lately to the district administrator
    von Kurnatowski that he, together with the chief forester Kräger and with the privy councillor von
    Triebenfeld, should for the present investigate the forest devastations in Betsche, so that one may
    see clearly. Schenck is offended that the government merely answered him that his submission could
    not be understood. He wishes, if he receives a general power of attorney and 500 Rthl together with
    free defrayment, to go to Posen and work upon the matter - It will be hard for me to raise 10 Rthl;
    I have therefore given him no decision upon it, and at bottom do not need him - My tenant''s brother
    is house factor and favourite of Zerboni, through whose hands pass all the offerings that are brought.
    Had Your Serene Highness been able to [uncertain: spare] me a [uncertain: Frisling] for 7 bowls, it
    would have been of use. My tenant goes with me to Posen - He himself stands in very close connexion
    with Mr. Z. on account of deliveries - and will render only services. As soon as I receive Your Serene
    Highness''s answer I travel to Posen and Betsche. In deepest reverence I remain, until death,


    Your Serene Highness''s


    the messenger receives per mile 3 gg Courant


    1 Rthl I have given him here. May it please


    Your Serene Highness to have the remainder paid


    out there


    Blizanow


    the 16th of January 1816.


    most humble and obedient servant


    v. Triebenfeld'

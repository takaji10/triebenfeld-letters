- page: 3
  en: 'such as I requested in my last, so that I may be rid of him. With Zerboni he has fallen out, I
    know not upon what grounds — "The [illegible] President also wrote lately to the district administrator
    von Kurnatowski that he should, together with the Chief Forester Seager and with the Privy Councillor
    von Triebenfeld, for the present investigate the forest devastations in Pszczew, so that one may see
    clearly — Schenck is offended at it that the Government answered him merely that his submission could
    not be understood — He wishes, if he receives a general power of attorney and 500 Rthl together with
    free conveyance, to go to Poznań and work upon the matter — It will be hard for me to raise 10 Rthl,
    so I have given him no decision upon it — and in truth I do not need him — My tenant''s brother is
    house factor and favourite of Zerboni, through whose hands pass all the offerings that are brought."
    Had Your Serene Highness been able to [uncertain: schalen] me a yearling for Z., it would have been
    of use — My tenant goes with me to Poznań — He himself stands in very close liaison with Mr Z[erboni]
    on account of deliveries — and will render only services — As soon as I receive Your Serene Highness''s
    answer I travel to Poznań and Pszczew. Full of reverence I remain, until death,


    Your Serene Highness''s


    the messenger receives 3 Groschen Courant per mile


    1 Rthl I have given him here. May


    Your Serene Highness deign to have the remainder paid


    out there.


    Blizanów


    the 16th of January 1816.


    most humble and obedient servant


    v Triebenfeld'

- page: 2
  en: 'According to my reckoning there would then remain to Your Serene Highness


    1. The interest on about 68000 Rthl


    2. the arrears of canon of 11000


    3. the 28000 Rthl paid down by the peasants in 1805


    4. what can be wrested from Echaust and his confederates, with 20000 Rthl. Thus Your Serene Highness
    would have from Betsche altogether 127000 Rthl. NB the 28000 Rthl Your Serene Highness already has,
    so there would still be to receive 99000 Rthl. Now it depends upon what Betsche is still worth; the
    forest is totally devastated. At 64000 Rthl it was valued - Queritur, will it be worth 72000 Rthl.
    And how will it stand with the other 65000 Rthl charged upon it? They do indeed stand in the receipt
    as well, but I do not yet know whether I shall be able to move Leixner to accept these too. If that
    should succeed and Leixner took this sum upon Kulm and Kaemen, then all would be helped - Your Serene
    Highness would have to receive, as said above, 99000 Rthl


    From the estates themselves I [uncertain: reckon] the


    72000


    from the remainder with about


    20000 Lombardini, Messrs. Hahn and the good Bally would be paid. Everything however depends upon my
    succeeding with Leixner. The man is now destitute; I must support him and give money for the outlay
    of costs of his business. The Chief President Zerboni is charged from higher quarters to sustain him;
    Kaemen is to remain his. - I insist meanwhile that the sums of 72 and 65000 Rthl entered upon Betsche
    belong not upon Betsche but upon Kaemen, according to the receipt of Meyer Bernhard. God grant me
    further good fortune - but may Your Serene Highness deign to write to me whether this altogether has
    your approval. The compensation business, which through the malicious delay has come to a standstill,
    will nevertheless turn out very well. It is being worked diplomatically, and the Minister von Humboldt
    has great need of me now. Trzciński is here again. It is not this one but the Major Trzciński who
    was suffocated - He was with me the day before yesterday and begged for indulgence until Midsummer,
    when he receives 25000 Rthl for an estate sold - Go to law I cannot, that costs money; I have granted
    him such, but assured him that I would lay arrest not only upon the purchase moneys but upon all revenues.
    Of Schenck I [uncertain: see] and hear nothing - He wants to have a general power of attorney to himself
    alone - May Your Serene Highness deign to send me a letter'

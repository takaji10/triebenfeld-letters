status: draft
segments:
- page: 1
  en: 'My dear friend! There are lying in Berlin 360000 Rthl which have been promised to me. Only I lie
    here and have been keeping to my bed now in the 5th week; I have vexed myself here quite to ruin.
    Meanwhile I have now brought everything here into order and entirely quieted the peasants who had
    been stirred up by arch-rogues, and also driven the tenants to the devil. When God or devils and hell-brands
    of men play me crosswise tricks, so that I must all but perish of vexation — there all splendour comes
    to an end. Glenck has been here and has made common cause with the Olesnica hell-brands, and has engaged
    thereto a certain Kramplich, Bergemann and Rybbeh; the [text lost] pack of hell stirs the people up
    and turns the purchasers away; it is too mad, how it goes with me. If meanwhile my constitution helps
    itself and I am well again, then the devil shall take all the rascals. The tenants are, as said before,
    all [uncertain: to the bottom of the devil], and from Christmas and St. John''s on everything must
    be so understood, that only moneys may be raised, and that nothing further must arise for expenditures.
    Herr Weigel will be paid; for that I had, since I receive from the Justice Fund the money for Weigel
    and Lichnowski; these must cede their mortgage, and receive their money; I have already said this
    to the witnesses at Weigel''s too. But while I lie here in misery I cannot work in Berlin; as soon
    as I recover somewhat I shall come to Breslau and go at once with my daughters to Berlin.'
- page: 2
  en: 'From here I can as yet draw nothing, but from Michaelmas on much money should come in little by
    little. It would have been easy here to obtain moneys, if I had been willing to give the parcels away
    for a third of the price, but God preserve me from that. — Now the Prince still receives 190000 Rthl
    in cash and 40000 in perpetuity, that is, the annual revenues. The Prince has already received 10000
    Rthl from Swięcia, 10000 Rthl from Olesnica, 12000 Rthl from Szetlewek, and 9000 Rthl have been given
    for grounds, all of which has gone off for the costs and interest, and also upon old debts. The peasants''
    revolution and the Plenck rascalities have had their use — I have indeed had to give much back, but
    now it is also the better and more amply set out for it. Enough, all will go well — if only I am well
    again first — writing comes very hard to me. So this yet, that I am unremittingly Your v Triebenfeld.
    Trąbczyn, the 12th of Aug. 1806. Upon the whole Prochenkamr affair I must suspend my judgment, for
    I do not know it. — As for me, there is wanting a man who knows the locality entirely, and somewhat
    much money — the Stöz: praise is suspect to me, well evaded — the Pro Memoria of the Koſchenkin officials
    give sufficient [text lost] friend and serve direction. The enclosed lampoon Glenck has made upon
    me and had it distributed among the colonists who are minded to purchase; the original I have sent
    to His Serene Highness — It is drawn up and dealt out by Glenck''s own lofty hand.'
- page: 3
  en: 'To the Olesnica [uncertain: Schluzbuben] he has of course given attestations and helped to support
    their cause, and for this they have promised him to sell him the Voigtey. Yesterday the judgment came
    down upon the fellows: 1. Giese may not evict the fellows; 2. he shall discharge the debts encumbering
    Olesnica; 3. he shall apply for the consent; 4. when that has been given, have the hereditary lease
    entered in the mortgage book; 6. but Giese is refused, in that the Prince may not hand over the estates
    to him before consent has hitherto been issued. That is a sentence at which the dogs might well howl.
    I shall now at once apply to the authority for the consent; then the resolution will be that such
    [uncertain: Curiellen] may not possess noble estates, and the Chamber will throw them out; then all
    the feud has an end.'

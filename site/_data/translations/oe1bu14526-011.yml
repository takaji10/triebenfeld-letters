segments:
- page: 1
  en: 'Actum Trąbczyn, the 10th of May 1805. There appeared before the undersigned patrimonial court


    1st, the Councillor of War and Forests von Triebenfeld, as the known general attorney of His Serene
    Highness the reigning Prince of Hohenlohe-Ingelfingen, hereditary lord and lord of the court of the
    estates here,


    on the one part


    and


    2nd, the dyer of fine cloth and councilman Johann Seymert of the town of Zagorowo, on the other part.
    The parties appearing are personally known to the undersigned, and their capacity to execute judicial
    acts is subject to no doubt. The same declare to the protocol the following irrevocable agreement,
    concluded between them and in nothing to be altered,'

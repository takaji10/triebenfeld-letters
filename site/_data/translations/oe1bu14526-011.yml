status: draft
segments:
- page: 1
  en: 'Actum Trąbczyn, the 10th of May 1805. [uncertain: Erſthauen — appeared?] before the undersigned
    Patrimonial Court


    1., Herr Councillor of War and Forests v. Triebenfeld, as the known General Bevollmächtigter (plenipotentiary)
    of His Serene Highness the reigning Prince of Hohenlohe Ingelfingen, hereditary lord and lord of jurisdiction
    of the [uncertain: derer sie segen] estates,


    of the one part


    and


    2., the fancy-dyer and councilman Johann Seymert of the town of Zagorowo, of the other part. The comparents
    are personally known to the undersigned, and their capacity for the execution of judicial [uncertain:
    Zuendlungen — transactions] is subject to no doubt. The same declare to the protocol the following
    irrevocable and in nothing alterable [agreement] concluded between themselves'
- page: 2
  en: 'hereditary quit-rent contract [Erbzinß Contract], freely and after due deliberation:


    §. 1. Namely, His Most Serene Highness grants in hereditary quit-rent to Johann Seymert, out of the
    arable of the local Trąbczyn demesne farm, 3 Hufen — written out, three Hufen Magdeburg — which consist
    of 2 Hufen 24 Morgen of clean arable and of 6 Morgen of meadow, and which shall be measured out to
    him, from now onward for [uncertain: un merwührende] good [times?] in hereditary quit-rent.


    §. II. The said Johann Seymert [uncertain: rechte an — reckons/pays?] as purchase-money for each Hufe,
    be it of arable or of meadow, 300 rt — written out, three hundred Rthaler — hence for three Hufen
    900 rthl — written out, nine hundred'
- page: 3
  en: 'Rthler, and that in one undivided sum, at Johannis of this year, in cash and in good Prussian Courant.


    §. III. The hereditary lessee binds himself, for this acquired holding, from Johannis of this year
    onward, to an ever-enduring annual hereditary quit-rent, which may never be raised or diminished,
    of 15 Rthl per Hufe Magdeburg — written out, fifteen Rthaler — hence for three Hufen 45 rthl — written
    out, forty-five Rthler — in Courant, in cash, and that yearly in two [uncertain: naten — instalments/terms?],
    at Christmas and at Johannis, each time with 22 rthl 12 ggl., say two'
- page: 4
  en: 'and twenty Rthaler 12 gg., yet not in advance but after the lapse of each half-year, and consequently
    to be paid for the first time at Christmas of this year.


    §. IV. Seymert must effect his establishment at [illegible] his own [cost?] himself, and otherwise,
    and without his receiving either now or for the future any [uncertain: erhiege] or other building
    assistance; he receives from me neither right of pasturage nor right of timber upon the remaining
    seigneurial territory.


    §. V. Besides this [uncertain: ammeren] hereditary quit-rent, the hereditary lessee obliges himself,
    for himself and his descendants in possession, from'
- page: 5
  en: 'these three [holdings] to discharge all and every Royal tax, as also the Competenz for the Kloster
    Ląd and the dues to the clergy, chimney-money, forage deliveries, and whatever else may arise, without
    any exception, without making or obtaining on that account any remission of the hereditary quit-rent.


    §. VI. The hereditary purchaser must take his drink, beer and brandy, from the seigneurial tavern
    or the brew- and brandy-house, and in the case of contravention shall pay to the ground-lordship a
    fine of One Rthaler for every Garniec of foreign brandy brought in, and five Rthaler for every [uncertain:
    Tanne — tun/barrel?] of foreign beer.


    §. VII. The hereditary lessee and [text as written: ''und sind'']'
- page: 6
  en: 'his successors in possession are subject to the jurisdiction of the local Dominium, yet are wholly
    and for ever-enduring times free of all and every deliveries in kind and manorial labour services.


    §. VIII. The hereditary lessee and his successors in possession are at liberty to [uncertain: vermeßern
    — alienate?] this acquired holding to others by sale or exchange; yet such must be done with the consent
    of the ground-lordship, and upon every such change of possession the tenth Groschen of the purchase-money
    or of the exchange-quantum must be paid to the ground-lordship as a Laudemium.'
- page: 7
  en: 'be discharged. Upon [uncertain: Verübungen — conveyances?] to children and collateral relations,
    on the other hand, no [uncertain: Landenau — Laudemium] is paid.


    §. IX. The hereditary lessee renounces, for himself and his successors in possession, wholly and entirely,
    all and every remission in cases of misfortune, whether arising through fire from heaven, through
    the infection of evil [uncertain: kraten], hail-stroke, failure of crops, cattle-plague, war and pestilence,
    or in any other manner whatsoever; and on that account no indemnification from the ground-lordship,
    nor remission of the hereditary quit-rent, shall ever avail them.


    §. X. The dwelling- and farm-buildings'
- page: 8
  en: 'must the hereditary lessee, now his successors in possession, erect himself at his own expense,
    and keep the same always in [uncertain: uns baulichem — good structural] repair, and he receives from
    the ground-lordship neither timber nor other building assistance.


    §. XI. The costs of this contract and of its engrossment are paid by the hereditary lessee.


    §. XII. So long as the hereditary lessee and his successors in possession of this holding comply with
    all the above obligations, the ground-lordship promises to protect them everywhere in their rights
    and'
- page: 9
  en: 'to defend them against everyone''s real claims. Should, however, the hereditary lessee and his
    successors lay this holding waste, or remain in arrears with the annual hereditary quit-rent for longer
    than two years, then this hereditary-lease contract ceases, and the ground-lordship shall be entitled
    to dispose of this holding elsewhere.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal subterfuges that might therein have place, [continued]'
- page: 10
  en: 'particularly the objection of [uncertain: einer artigen Ueberredung — some manner of persuasion],
    of [uncertain: Uebernebung] of an injury having occurred to him, and beyond the half, of matters otherwise
    agreed than written down; and they have been duly instructed by the court as to the consequences of
    this renunciation.


    His Most Serene Highness expressly consents herein, that the hereditary lessee may, on the ground
    of this contract, have the title of possession of this acquired holding [text as written: ''von ren'']
    entered in his own name'
- page: 11
  en: 'to be regulated.


    Further the contracting parties had nothing to [uncertain: dienstführen — bring forward], and after
    this protocol had been actually read out to them, they approved the same throughout and subscribed
    it below in their own hands.


    Peter Friedrich August v. Triebenfeld

    Seimert


    a. u. s. Schenck


    Brauer'

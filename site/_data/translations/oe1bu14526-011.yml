- page: 2
  en: 'hereditary quit-rent contract, freely and after due deliberation, to the protocol:


    § 1. Namely, His Most Serene Princely Highness grants in hereditary quit-rent to Johann Seymert, from
    the arable of the demesne farm here at Trąbczyn, 3 Hufen, in words three Hufen Magdeburg measure,
    which consist of the 2 Hufen 24 Morgen of clean arable and in 6 Morgen of meadow, and which shall
    be measured out to him, from now on for everlasting times.


    § II. Johann Seymert pays as purchase money for each Hufe, whether it consist of arable or of meadow,
    300 rt, in words three hundred Rthaler, thus for three Hufen 900 rthl, in words nine hundred'
  names:
  - de: Trąbczyner
    en: Trąbczyn
    kind: place
  - de: Johann Seymert
    en: Johann Seymert
    kind: person
  - de: Magdeburg
    en: Magdeburg
    kind: place
  numbers:
  - '1'
  - '3'
  - '2'
  - '24'
  - '6'
  - II
  - '300'
  - '900'
- page: 3
  en: 'Rthler, and that in one undivided sum, at Midsummer of this year, in cash and in good Prussian
    Courant.


    § III. The hereditary leaseholder binds himself, for this acquired holding, from Midsummer of this
    year onward, to an everlasting annual hereditary quit-rent, which may never be raised or lessened,
    of 15 Rthl per Hufe Magdeburg measure, in words fifteen Rthaler, thus for three Hufen 45 rthl, in
    words forty-five Rthler, in Courant and in cash, and that yearly in two instalments, at Christmas
    and at Midsummer, each time with 22 rthl 12 ggl., say two'
  names:
  - de: Magdeburg
    en: Magdeburg
    kind: place
  numbers:
  - III
  - '15'
  - '45'
  - '22'
  - '12'
- page: 4
  en: 'and twenty Rthaler 12 gg., yet not in advance but after the lapse of each half year, and consequently
    to be paid for the first time at Christmas of this year.


    § IV. Seymert must effect his establishment himself, at [illegible] his own [expense], otherwise and
    without receiving, neither for now nor for the future, any timber or other building assistance; he
    likewise receives neither right of pasturage nor right of timber on the remaining seigneurial territory.


    § V. Besides this annual hereditary quit-rent, the hereditary leaseholder obliges himself, for himself
    and his descendants in possession, from'
  names:
  - de: Seymert
    en: Seymert
    kind: person
  numbers:
  - '12'
  - IV
  - V
- page: 5
  en: 'these three holdings, to discharge all and every royal tax, as also the due for the monastery of
    Ląd and the dues to the clergy, chimney money, forage delivery, and whatever else may arise, without
    any exception, without making or obtaining any remission of the hereditary quit-rent on that account.


    § VI. The hereditary purchaser must take his drink, both beer and brandy, from the seigneurial inn
    or from the brewing and distilling house, and in case of contravention must pay to the ground-lordship
    a penalty of One Rthaler for every Garniec of foreign brandy brought in, and five Rthaler for every
    barrel of foreign beer.


    § VII. The hereditary leaseholder and'
  names:
  - de: Kloster Ląd
    en: the monastery of Ląd
    kind: place
  numbers:
  - VI
  - VII
- page: 6
  en: 'his successors in possession are subject to the jurisdiction of the manorial lordship (Dominium)
    here, yet are wholly and for everlasting times freed from all and every delivery in kind and manorial
    labour service.


    § VIII. The hereditary leaseholder and his successors in possession are at liberty to alienate this
    acquired holding to another by sale or exchange, yet this must be done with the consent of the ground-lordship,
    and at every such change of possession the tenth Groschen of the purchase money or of the exchange
    value is to be paid to the ground-lordship as a transfer fee (Laudemium).'
  numbers:
  - VIII
- page: 7
  en: 'In cases of inheritance to children and collateral kin, on the other hand, no transfer fee is paid.


    § IX. The hereditary leaseholder renounces, for himself and his successors in possession, wholly and
    entirely, all and every remission in misfortunes which arise through fire from heaven, through the
    contagion of evil diseases, hailstorm, crop failure, cattle plague, war and pestilence, or in any
    other manner whatsoever, and on that account there shall never accrue to them any indemnification
    from the ground-lordship or remission of the hereditary quit-rent.


    § X. The dwelling and farm buildings'
  numbers:
  - IX
  - X
- page: 8
  en: 'the hereditary leaseholder, and his successors in possession, must build themselves at their own
    cost, and must keep the same always in good repair, and they receive from the ground-lordship neither
    timber nor other building assistance.


    § XI. The costs of this contract and of its engrossment are paid by the hereditary leaseholder.


    § XII. So long as the hereditary leaseholder and his successors in possession of this holding fulfil
    all the above obligations, the ground-lordship promises to protect them everywhere in their rights
    and'
  numbers:
  - XI
  - XII
- page: 9
  en: 'to represent them against anyone''s real claims. Should, however, the hereditary leaseholder and
    his successors lay this holding waste, or remain in arrears with the annual hereditary quit-rent for
    longer than two years, then this hereditary lease contract ceases, and the ground-lordship shall be
    entitled to dispose of this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal evasions that might be found therein, and'
  numbers:
  - zwey
- page: 10
  en: 'particularly the objection of any kind of persuasion, of overreaching, of injury occurring above
    or below the half, of matters otherwise agreed than written down; and they have been duly instructed
    by the court as to the consequences of this renunciation.


    His Most Serene Princely Highness expressly consents herein, that the hereditary leaseholder may,
    upon the ground of this contract, have the title of possession of this acquired holding'
- page: 11
  en: 'entered in his own name.


    The contracting parties had nothing further to bring forward, and after this protocol had been actually
    read out to them, they approved the same throughout and subscribed it below in their own hands. Peter
    Friedrich August von Triebenfeld / Seimert


    a. u. s. Schenck


    Brauer'

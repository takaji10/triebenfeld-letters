- page: 2
  en: 'hereditary quit-rent contract, freely and after due deliberation, to the protocol:


    §. 1. Namely, His Most Serene Highness grants in hereditary quit-rent, from the arable of the demesne
    farm here at Trąbczyn, to Johann Seymert 3 Hufen, in words three Hufen Magdeburg measure, which consist
    of 2 Hufen 24 Morgen of clean arable and of 6 Morgen of meadow, and which shall be measured out to
    him, from now on for everlasting time.


    §. II. Johann Seymert renders as purchase money for each Hufe, be it composed of arable or of meadow,
    300 rt, in words three hundred Reichsthaler, hence for three Hufen 900 rthl, in words nine hundred'
  names:
  - de: Trąbczyner
    en: Trąbczyn
    kind: place
  - de: Johann Seymert
    en: Johann Seymert
    kind: person
  - de: Magdeburg
    en: Magdeburg
    kind: place
  numbers:
  - '1'
  - '3'
  - '2'
  - '24'
  - '6'
  - II
  - '300'
  - '900'
- page: 3
  en: 'Reichsthaler, and that in one undivided sum at Midsummer of this year, in cash and in good Prussian
    Courant.


    §. III. The hereditary lessee binds himself, for this acquired holding, from Midsummer of this year
    onward, to an everlasting annual hereditary quit-rent, which may never be raised or diminished, of
    15 Rthl per Hufe Magdeburg measure, in words fifteen Reichsthaler, hence for three Hufen 45 rthl,
    in words forty-five Reichsthaler, in Courant, in cash, and that annually in two instalments, at Christmas
    and at Midsummer, each time with 22 rthl 12 ggl., say two'
  names:
  - de: Magdeburg
    en: Magdeburg
    kind: place
  numbers:
  - III
  - '15'
  - '45'
  - '22'
  - '12'
- page: 4
  en: 'and twenty Reichsthaler 12 gg., yet not in advance but after the lapse of each half year, and consequently
    to be paid for the first time at Christmas of this year.


    §. IV. Seymert must effect his establishment himself, at [uncertain: p] his own [illegible] and without
    that he receives, neither for now nor for the future, has or otherwise obtains any building assistance;
    he likewise receives neither right of pasture nor right of timber on the remaining manorial territory.


    §. V. Besides these annual hereditary quit-rents the hereditary lessee obliges himself, for himself
    and his descendants in possession of'
  names:
  - de: Seymert
    en: Seymert
    kind: person
  numbers:
  - '12'
  - IV
  - V
- page: 5
  en: 'these three holdings, to discharge all and every royal tax, as also the due for the monastery of
    Ląd and the dues to the clergy, chimney money, forage delivery, and whatever else may arise, without
    any exception, without making or obtaining on that account any remission of the hereditary quit-rent.


    §. VI. The hereditary purchaser must take his drink, beer and brandy, from the manorial tavern or
    the brewing and distilling house, and in case of contravention must pay to the ground lordship a penalty
    of one Reichsthaler for each garniec of foreign brandy brought in, and five Reichsthaler for each
    barrel of foreign beer.


    §. VII. The hereditary lessee and'
  names:
  - de: Kloster Ląd
    en: the monastery of Ląd
    kind: place
  numbers:
  - VI
  - VII
- page: 6
  en: 'his successors in possession are subject to the jurisdiction of the manorial lordship (Dominium)
    here, yet are wholly and for everlasting time exempted from all and every delivery in kind and manorial
    labour service.


    §. VIII. The hereditary lessee and his successors in possession are at liberty to dispose of this
    acquired holding to others by sale or by exchange; yet this must be done with the consent of the ground
    lordship, and at each such change of possession the tenth Groschen of the purchase money or of the
    amount of the exchange must be paid to the ground lordship as a transfer fee (Laudemium).'
  numbers:
  - VIII
- page: 7
  en: 'For inheritances to children and collateral relations, on the other hand, no transfer fee is paid.


    §. IX. The hereditary lessee, for himself and his successors in possession, wholly renounces all and
    every remission in cases of misfortune which may arise through fire from heaven, through the contagion
    of evil diseases, hail, crop failure, cattle plague, war and pestilence, or in any other manner whatsoever,
    and on that account no compensation from the ground lordship nor remission of the hereditary quit-rent
    shall ever accrue to them.


    §. X. The dwelling and farm buildings'
  numbers:
  - IX
  - X
- page: 8
  en: 'the hereditary lessee, and his successors in possession, must build themselves at their own cost,
    and must always maintain the same in good repair, and he receives from the ground lordship neither
    timber nor any other building assistance.


    §. XI. The costs of this contract and of its issue as an official copy are paid by the hereditary
    lessee.


    §. XII. So long as the hereditary lessee and his successors in possession of this holding fulfil all
    the above obligations, the ground lordship promises to protect them everywhere in their rights and'
  numbers:
  - XI
  - XII
- page: 9
  en: 'to defend them against any man''s real claims. Should, however, the hereditary lessee and his successors
    lay this holding waste, or remain in arrears with the annual hereditary quit-rent for longer than
    two years, then this hereditary lease contract ceases, and the ground lordship shall be entitled to
    dispose of this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal evasions that might there be found, in'
- page: 10
  en: 'particular the objection of any kind of persuasion, of overreaching, of injury occurring above
    or below the half, of matters other than agreed or than set down in writing; and they have been duly
    instructed by the court as to the consequences of this renunciation.


    His Most Serene Highness expressly consents herein that the hereditary lessee may, on the ground of
    this contract, have the title of possession of this acquired holding entered in his own name.'
- page: 11
  en: 'have it entered.


    Further the contracting parties had nothing to adduce, and after this protocol had actually been read
    aloud to them, they approved the same throughout and signed below in their own hands. Peter Friedrich
    August von Triebenfeld. Seimert.


    a. u. s. Schenck


    Brauer'

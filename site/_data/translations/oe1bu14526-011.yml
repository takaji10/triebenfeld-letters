status: draft
segments:
- page: 1
  en: 'Actum Trąbczyn, the 10 May 1805. There appeared before the undersigned Patrimonial Court


    1., Herr Councillor of War and Forests v. Triebenfeld, as the known General Bevollmächtigter (plenipotentiary)
    of His Serene Highness the reigning Prince of Hohenlohe Ingelfingen, hereditary lord and lord of justice
    of the estates here,


    of the one part


    and


    2., the dyer of fine cloth and councilman Johann Seymert of the town of Zagorowo, of the other part.
    The comparents are personally known to the undersigned, and their capacity to execute judicial acts
    is subject to no doubt. The same declare to the protocol the following irrevocable hereditary quit-rent
    contract, concluded between them and in nothing to be altered,'
- page: 2
  en: 'hereditary quit-rent contract, freely and after due deliberation, to the protocol:


    §. 1. Namely, His Most Serene Princely Highness grants in hereditary quit-rent to Johann Seymert,
    from the demesne farm land here at Trąbczyn, 3 Hufen — write three Hufen Magdeburg — which consist
    of the 2 Hufen 24 Morgen of clean arable and of 6 Morgen of meadow, and which are to be measured out
    to him, from now on for everlasting time in hereditary quit-rent.


    §. II. The said Johann Seymert renders as purchase-money for each Hufe, be it composed of arable or
    of meadow, 300 rt — write three hundred Rthaler — accordingly for three Hufen 900 rthl — write nine
    hundred'
- page: 3
  en: 'Rthler, and indeed in one undivided sum, at Johannis of this year, in cash and in good Prussian
    Courant.


    §. III. The hereditary lessee binds himself, for this acquired holding, from Johannis of this year
    onward, to an everlasting yearly hereditary quit-rent, which may never be raised or lessened, per
    Hufe Magdeburg of 15 Rthl — write fifteen Rthaler — accordingly for three Hufen 45 rthl — write forty-five
    Rthler — in Courant, in cash, and indeed yearly in two instalments, at Christmas and at Johannis,
    each time with 22 rthl 12 ggl. — say two'
- page: 4
  en: 'and twenty Rthaler 12 gg., yet not in advance but after the lapse of each half-year, and consequently
    to be paid for the first time at Christmas of this year.


    §. IV. His establishment Seymert must effect himself at [uncertain: p] his own [expense], otherwise
    and without which he has, neither for now nor for the future, [any claim] or receives any other building
    assistance; he receives also neither pasturage nor timber rights upon the remaining manorial territory.


    §. V. Besides these [uncertain: yearly] hereditary quit-rents, the hereditary lessee obliges himself,
    for himself and his successors in the possession of,'
- page: 5
  en: 'these three [holdings], to discharge all and every royal tax, likewise the competence for the monastery
    of Ląd and the dues to the clergy, chimney-money, fodder delivery, and whatever else may arise, without
    any exception, without making or obtaining on that account any remission of the hereditary quit-rent.


    §. VI. The hereditary purchaser must take his drink, that is beer and brandy, from the manorial tavern
    or the brew- and brandy-house, and in the case of contravention must pay to the ground-lordship as
    a penalty, for every Garniec of foreign brandy brought in, One Rthaler, and for every Tonne of foreign
    beer, five Rthaler.


    §. VII. The hereditary lessee and'
- page: 6
  en: 'his successors in the possession are subject to the jurisdiction of the Dominium here, yet are
    wholly and for everlasting time exempt from all and every delivery in kind and manorial labour service.


    §. VIII. The hereditary lessee and his successors in the possession are at liberty to alienate this
    acquired holding to others by sale or exchange; yet such must take place with the consent of the ground-lordship,
    and at every such change of possession the tenth Groschen of the purchase-money or of the amount of
    the exchange shall be paid, as a Laudemium, to the ground-lordship.'
- page: 7
  en: 'be paid. On inheritances to children and collateral relatives, on the other hand, no Laudemium
    is paid.


    §. IX. The hereditary lessee renounces, for himself and his successors in the possession, wholly and
    entirely all and every remission in cases of misfortune, whether arising through fire from heaven,
    through the infection of evil sicknesses, hailstorm, crop failure, cattle plague, war and pestilence,
    or in any other manner whatsoever; and on that account no indemnification from the ground-lordship,
    nor any remission of the hereditary quit-rents, shall ever accrue to their benefit.


    §. X. The dwelling and farm buildings'
- page: 8
  en: 'the hereditary lessee, and his successors in the possession, must build themselves at their own
    cost and keep the same always in good repair, and they shall receive from the ground-lordship neither
    timber nor any other building assistance.


    §. XI. The costs of this contract and of its engrossment are paid by the hereditary lessee.


    §. XII. So long as the hereditary lessee and his successors in the possession of this holding comply
    with all the above obligations, the ground-lordship promises to protect them everywhere in their rights
    and'
- page: 9
  en: 'to defend them against every man''s real claims. Should, however, the hereditary lessee and his
    successors lay this holding waste, or remain in arrears with the yearly hereditary quit-rent for longer
    than two years, then this hereditary lease contract shall cease, and the ground-lordship shall be
    entitled to dispose of this holding otherwise.


    Both parties promise to keep the foregoing hereditary quit-rent contract firmly and inviolably, and
    renounce all legal evasions that might there be found, but'
- page: 10
  en: 'in particular the objection of [uncertain: an unfair] persuasion, of over-reaching, of injury suffered
    above and beneath the half, of matters otherwise agreed than written down; and they have been duly
    instructed by the court as to the consequences of this renunciation.


    His Most Serene Princely Highness expressly consents herein, that the hereditary lessee may, upon
    the ground of this contract, have the title of possession of this acquired holding'
- page: 11
  en: 'settled upon his own name.


    Further the contracting parties had nothing to bring forward, and after this protocol had actually
    been read aloud to them, they approved the same throughout and subscribed it below in their own hands.
    Peter Friedrich August v. Triebenfeld  Seimert


    a. u. s. Schenck


    Brauer'

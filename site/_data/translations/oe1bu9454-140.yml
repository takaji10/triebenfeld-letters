- page: 3
  en: 'But the enclosed letter of von Bornstädt under D proves that Glenck has lied to me and that the
    contract has already been ceded to the merchant Klein, a cousin of Rochlitz. I still doubted, and
    sought to arrange everything with the people in the best way, until I received the enclosed note under
    C from Meyer Bernhard. This moves me to send this express courier in haste to Your Serene Highness.


    Both the communities and the Frankfurt men insist that this contract concluded between Leixner and
    Mr von Brandenstein be above all things produced [uncertain: um] wholly cancelled. Secondly, Bernhard
    and Leixner will pay not a Groschen further until Glenck gives up the partnership contract concluded
    between them.


    Thirdly, the communities insist that everything be settled with Bornstedt; before that they will agree
    to nothing further. My advice [uncertain: um] request is this, that Your Most Serene Highness write
    to Glenck by express courier that he immediately give up all these papers, and that both he and Mr
    von Brandenstein give a judicial written undertaking as to the cancellation of both contracts, that
    they can or may claim nothing further from the Frankfurt gentlemen — or from the Pszczew lands. Von
    Brandenstein, who can hardly know anything of all Mr Glenck''s twistings, will certainly issue the
    undertaking there at once, and I humbly beg that Your Serene Highness may not withdraw your grace
    from this young man, who may well be quite innocent'

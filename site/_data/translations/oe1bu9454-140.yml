- page: 2
  en: 'demesne farm [uncertain: Abre] and the greater part of the woodland. The justice-burgomaster Metzig,
    who is appointed as counsel to the community, at last declared to me outright that Councillor von
    Glenck was concerned to direct the whole negotiation to Breslau, that he had large claims which he
    would enforce, and that he, Glenck, would be very grateful to him, Metzig, if he would side with him.
    Metzig further declared that he indeed saw that Your Serene Highness was to be cheated, but that as
    counsel to the communities he must insist upon it,


    first, that this matter be wholly cleared up, and secondly, that everything with Councillor von Bornstädt
    must first be settled; before that the communities can pay no money and enter into nothing. After
    this sad experience I received the letter of von Bornstädt enclosed under Lit. C, and learned further
    from several residents that


    Councillor Glenck had requested them to withdraw from the contract and to annul it, saying he would
    make them all happy in return. Why Glenck does this remains a riddle.


    For the rest I awaited his and Wunster''s arrival — Glenck arrived the day before yesterday. I took
    pains to sound out everything in the gentlest manner, but got nothing further out of him than that
    he knew nothing, since he lacked the papers; to the question where the contract concluded between
    him and Leixner might be, he answers that Lieutenant von Brandenstein has it in his keeping, and would
    press for his estate or the money for it.'

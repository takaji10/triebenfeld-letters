- page: 5
  en: 'entering upon my lease I had to pay Glenck 500 Rthl as a broker''s fee; another tenant promised
    him more after a year''s term, and for that reason he wanted to drive me out, so as to extort another
    600 Rthl. It must indeed be untrue, he says further, that the Prince, as Glenck boasts of himself,
    knows of such swindling — etc., for the Prince has after all the reputation of the most exalted and
    greatest of men and a friend of mankind — I could go mad when such a thing comes before my eyes, and
    I can wish nothing further than to set aside all these dirty things and to get them out of the world
    in such a way that Your Serene Highness may have no further [uncertain: Ver dens].


    What torments me most at present is this — Your Serene Highness has promised Bornstädt 1000 pieces
    of Friedrichsd''or if he helps to sell Pszczew for 200/m Rthl. Glenck has confirmed this here before
    Melzig. What am I, poor man, now to answer to that? The fellow tenders the oath on the point to Your
    Serene Highness — to Glenck and Rochlitz. What am I to answer the fellow on this, and with what am
    I to satisfy him? Be pleased, most gracious Prince, to give me an instruction in the matter.


    The lease business I would settle at law, and by God conceal nothing, but in this affair I can do
    nothing further without Your Serene Highness''s command. Generals, and God knows what people, all
    take an interest in the poor wretch and his wife, who seems to be a true [uncertain: [k?]antigen]'

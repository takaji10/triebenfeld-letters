- page: 1
  en: 'Most Serene Prince


    Most gracious Lord, My first resolve was to report no further odious matters to Your Most Serene Highness,
    and to let things which could no longer be altered take their course. But of necessity I must abandon
    this resolve and [uncertain: implore] Your Highness''s help directly — the matter is this.


    Before I came here I received the letter of von Bornstädt in Posen enclosed under Lit. A. I had no
    good opinion of the writer and sought to humble him by having a bare acknowledgement of receipt given
    through Glenck, since a letter from Bornstädt had come in concerning His Serene Highness''s affairs,
    upon which he, as general mandatary, would advise him.


    I then sought further to win over in person Melzer and the [uncertain: Pre: Braunschuſung] and to
    bring everything to bear so that the Berlin decree might be upheld and the monies deposited, but above
    all that Broniewski might be evicted at once. This was promised me, and I travelled all through the
    night here to Betsche, at once despatched a mounted messenger to Frankfurt an der Oder and summoned
    Meyer Bernhard and associates here. The enclosed Copy Lit. B tells the rest.


    After this despatch I [uncertain: summoned] the deputies who were in Breslau; it was exceedingly strange
    to me that none of them would appear. At last I learned that the people had been incited to withdraw
    from the purchase. I sought to discover the ground of it, and heard to my horror that Rochlitz was
    confusing the people''s heads and threatening them, that he would tear the whole thing apart, because
    through his brother-in-law Klein he had a contract in hand under which they would take away the'

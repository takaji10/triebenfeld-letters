- page: 3
  en: 'But the enclosed letter of von Bornstädt sub d proves that Glenck lied to me and that the contract
    has already been ceded to the merchant Klein, a cousin of Rochlitz. Still I doubted, and sought to
    arrange everything with the people for the best, until I received the enclosed note sub C from Meyer
    Bernhard. This moves me to send this express courier in haste to Your Serene Highness.


    Both the communities and the Frankfurt men insist that this contract concluded between Leixner and
    Herr von Brandenstein be above all things produced, so that it may be wholly cancelled. Secondly,
    Bernhard and Leixner will pay not one Groschen further until Glenck hands over the partnership contract
    concluded between them.


    Thirdly, the communities insist that everything be settled with Bornstädt; before that they will agree
    to nothing further. My counsel and request is this, that Your Most Serene Highness write to Glenck
    by express courier that he hand over all these papers at once, and that both he and Herr von Brandenstein
    give a judicial written undertaking as to the annulment of both contracts, that they can or may claim
    nothing further from the Frankfurt gentlemen — or from the Betsche lands. Von Brandenstein, who can
    hardly know anything of all Councillor Glenck''s twistings, will certainly issue the written undertaking
    there at once, and I most humbly beg that Your Serene Highness may not withdraw your grace from this
    young man, who may well be entirely innocent'

- page: 2
  en: 'demesne farm [uncertain: Abre] and the greater part of the forest.


    The justice-burgomaster Melzig, who is appointed as the community''s assistant, at last declared to
    me quite straight out that Mr von Glenck was intent on drawing the whole negotiation to Wrocław, that
    he had large claims which he would assert, and that he, Glenck, if he, Melzig, would side with him,
    would be very appreciative. He, Melzig, further declared that he did indeed see that Your Serene Highness
    was to be cheated, but that as the communities'' assistant he had to insist upon it


    that, first, this matter be entirely removed, and that, secondly, everything be first settled with
    Mr von Bornstädt; before that the communities can pay no money and enter into nothing. After this
    sorry experience I received the letter of von Bornstädt enclosed under C, and learned besides from
    several residents that


    Mr Glenck had asked them to withdraw from the contract and to annul it; he would make them all happy
    for it. Why Glenck does this remains a riddle.


    For the rest I awaited his and Wunster''s arrival — Glenck''s followed the day before yesterday. I
    took pains to probe everything in the gentlest way, but got nothing further out of him than that he
    knows nothing, inasmuch as he lacked the papers; to the question where the contract concluded between
    him and Leixner was, he answers that Lieutenant von Brandenstein has it in his keeping, and would
    press for his estate or the money for it.'

- page: 4
  en: 'in the matter. Nor shall I tire in my [uncertain: endeavour] on his behalf.


    May Your Most Serene Highness be pleased to send me the written undertaking from Herr von Brandenstein
    here with all speed by the express courier. For otherwise I can settle nothing with the people.


    But let Your Highness command Glenck to fetch back the ceded contract here at once, to return it together
    with the partnership contract, and to renounce all claims judicially.


    I would gladly have spared Your Serene Highness this business. But I cannot get through otherwise,
    for the people insist upon it.


    With Bornstädt everything looks frightfully tangled. Glenck, Rochlitz, [uncertain: Werleben], Bornstädt,
    and whatever else the rabble are called, have constantly squabbled like tinkers before Your Serene
    Highness''s eyes, but at bottom they have all cheated in brotherly concord, enough to make anyone''s
    hair stand on end. It was always Your Serene Highness whom they would all gladly have plundered clean.


    The wood is wholly ruined, and had the thieves gone on here another year, the fine estates would not
    have been worth 50000 any longer. — Now I am at pains to outflank Bornstädt really soundly. He seemed
    to be making use of the sale to the subjects; but these I have brought so far that, against my guarantee,
    they will let him be until the matter is concluded. Then I shall doubtless finish with the hero. —
    It is shameful to me that such infamies occur in the files; thus Bornstädt says for example: On'

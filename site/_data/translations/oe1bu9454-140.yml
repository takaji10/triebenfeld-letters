- page: 4
  en: 'in the matter. Nor shall I grow weary in this in my [uncertain: Erster].


    May Your Most Serene Highness be pleased to send me the written undertaking from Mr von Brandenstein
    here by the express courier with all possible haste. For otherwise I can settle nothing with the people.


    But let Your Highness command Glenck that he immediately procure back the ceded contract here, and
    hand it over together with the partnership contract, and judicially renounce all claims.


    I would gladly have spared Your Serene Highness this business. But I cannot get through otherwise,
    for the people insist upon it.


    With Bornstädt everything looks frightfully confused. Glenck, Rochlitz, [uncertain: Werlitz], Bornstädt,
    and whatever else the rabble are called, have all along squabbled like tinkers under Your Serene Highness''s
    eyes, but at bottom they have all cheated in brotherly concord, so that anyone''s hair would stand
    on end. It was always Your Serene Highness whom they would all gladly have plundered clean.


    The forest is quite ruined, and had the thieves gone on housekeeping here another year, the fine estates
    would not have been worth 50/m any longer — Now I am at pains to outflank Bornstädt really soundly.
    He seemed to be making use of the sale to the subjects; but these I have brought so far that they,
    against my guarantee, will let him [uncertain: sit] until the matter is settled. Then I shall no doubt
    get the better of the hero — It is a shame to me that such infamies occur in the files; thus Bornstädt
    says, for example — On'

- page: 7
  en: 'what these people permit themselves. — As to the Kaemener and Kulmner dismemberment I can likewise
    do nothing for the present. For Glenck has already betrayed everything to him (of which the letter
    enclosed under Lit. F is proof), everything, so as to earn something. O God! what shameful people
    are these? I shall see what the Jew means to do; if he insists on the journey to Breslau, then I shall
    only see how I may get half-way finished with the subjects here, and shall come there too at that
    time; but then I beg Your Serene Highness also, most heartily, to work over all these B. really harshly,
    so that they may once come to be afraid and drop the damned machinations. In deepest reverence I remain,
    until death, Your Most Serene Highness''s


    May Your Most Serene Highness be pleased to send the express courier with all the papers to Posen
    to old Reinhardt. If I can still turn everything about, I shall be there — if not, then he must send
    them to me here. Ah, it is true hellish torment to bring these people to reason. The letter to my
    daughter I most submissively beg to have delivered, and if anything has come in there from South Prussia
    etc., to let it go with me by the express courier. Betsche, the 26th of July


    1804


    faithful, humble and obedient servant


    von Triebenfeld'

- page: 5
  en: 'entering upon my lease I had to lay out 500 Rthl to Glenck as a broker''s fee; another tenant promised
    him more after a year''s term, and for that reason he wished to drive me out, so as to extort 600
    Rthl again. It must surely be untrue, he says further, that the Prince, as Glenck boasts of himself,
    knows of such cheating, for the Prince has after all the reputation of the most exalted, greatest
    man and friend of mankind. I could go mad when such a thing comes before my eyes, and I can wish nothing
    further than to put aside all these squalid matters and so to clear them out of the world that Your
    Serene Highness may have no more [uncertain: vexation].


    What torments me most at present is this — Your Serene Highness promised Bornstädt 1000 pieces of
    Friedrichsd''or if he helps to sell Betsche for 200000 Rthl. Glenck has confirmed this here before
    Metzig. What am I, poor man, now to answer to that? The fellow tenders the oath on this point to Your
    Serene Highness, to Glenck and to Rochlitz. What am I to answer the fellow to this, and with what
    am I to settle with him? Be pleased, most gracious Prince, to give me an instruction in the matter.


    The lease business I would settle lawfully, and by God give nothing away, but in this affair I can
    do nothing further without Your Serene Highness''s command. Generals, and God knows what people, all
    take an interest on behalf of the wretched creature and his wife, who seems to be a true [uncertain:
    kantigen]'

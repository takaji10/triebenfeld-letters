status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! My first resolve was to report no further Odiosa whatever
    to Your Most Serene Highness, and to let things that could no longer be altered take their course.
    Compelled by necessity, however, I must abandon this resolve and [uncertain: recta mirn] Your Highness''s
    own assistance — the matter is this. Before I went hither I received the letter of v. Bornstadt in
    Posen enclosed sub Lit. A. I had no good opinion of its author and sought to humble him by having
    a bare acknowledgement of receipt given him through Mr. Glenck, to the effect that a letter of Mr.
    Bomstadt had come in in His Serene Highness''s affairs, upon which he, as General Mandatarius, would
    inform him. I then further sought to win over, in person, Melzer and the Pre: [uncertain: Braunschuſung],
    and to muster everything so that the Berlin disposition might be upheld and the monies deposited,
    but above all that Broniewski might be evicted at once. This was promised me, and I travelled off
    in the night hither to Betsche, at once sent a mounted messenger to Franckfurth, and summoned Meyer
    Bernhard and consorts hither. The enclosed Copy, sub B, states the rest. After this expedition I [uncertain:
    called] the deputies who were in Breslau; it was exceedingly strange to me that none of them would
    appear; at length I learned that the people had been stirred up to withdraw from the purchase. I sought
    to discover the reason, and heard to my horror that Rochlitz was confusing the people''s heads and
    threatening them, to tear everything up, because for his brother-in-law Klein he had a contract in
    his hands by which they would take over the'
- page: 2
  en: 'demesne farm [uncertain: Abre] and the greater part of the woodland. The justice-burgomaster Metzig,
    who is appointed as legal assistant to the commune, at length declared to me straight out that Mr.
    B. v. Glenck was concerned to arrange the whole negotiation in Breslau, that he had large claims which
    he would press, and that he, Glenck, would be very appreciative if he, Metzig, would side with him.
    He, Metzig, further declared that he indeed saw that Your Serene Highness was to be cheated, but that
    as legal assistant to the communes he must insist that, first, this matter be entirely settled, and
    secondly, that with Mr. v. Bornstädt everything must first be cleared away; sooner than that the communes
    can pay no money and can enter into nothing. After this sad experience I received the letter of v.
    Bornstädt enclosed as Lub c, and learned besides from several inhabitants that Mr. Glenck had requested
    them to withdraw from the contract and to annul it; he would make them all happy in return. Why Glenck
    does this remains a riddle. For the rest, I awaited his and Wunster''s arrival — Glenck''s took place
    the day before yesterday. I took pains to explore everything in the gentlest manner, but got nothing
    further out of him than that he knows nothing, since the papers were wanting to him; to the question
    where the contract concluded between him and Leixner might be, he answers that Lieut. v. Brandenstein
    has it in his keeping, and would press for his estate or the money for it.'
- page: 3
  en: 'The enclosed letter of v. Bornstädt sub d, however, proves that Glenck lied to me and that the
    contract has already been ceded to the merchant Klein, a cousin of Rochlitz. I still doubted, and
    sought to arrange everything with the people for the best, until I received the enclosed note sub
    C from Meyer Bernhard. This moves me to send this express courier in haste to Your Serene Highness.
    Both the communes and the Frankfurt men insist that this contract concluded between Leixner and Mr.
    v. Brandenstein be, before all else, brought forth and completely cancelled. Secondly, Bernhard and
    Leixner will pay not a Groschen further until Glenck surrenders the partnership contract concluded
    between them. Thirdly, the communes insist that everything be settled with Bornstädt; sooner than
    that they will agree to nothing further. My counsel and petition is this: that Your Most Serene Highness
    write to Glenck by express courier that he surrender all these papers at once, and that both he and
    Mr. v. Brandenstein enter judicial written undertakings as to the cancellation of both contracts,
    so that they can or may claim nothing further from the Frankfurt gentlemen — or from the Betsche lands.
    V. Brandenstein, who can hardly know anything of all Mr. Glenck''s twistings, will certainly issue
    the written undertaking there at once, and I petition most humbly that Your Serene Highness not withdraw
    your grace from this young man, who may well be entirely innocent'
- page: 4
  en: 'in the matter. Nor shall I tire in my [uncertain: efforts] on his behalf. May Your Most Serene
    Highness be pleased to send me the written undertaking from Mr. v. Brandenstein hither with all speed
    by express courier. For otherwise I can settle nothing with the people. But let Your Highness command
    Glenck that he here at once fetch back the ceded contract and surrender the same together with the
    partnership contract, and judicially renounce all claims. I would gladly have spared Your Serene Highness
    this business. But I cannot get through otherwise, for the people insist upon it. With Bomstadt everything
    looks dreadfully tangled. Glenck, [uncertain: Kochlitz/Rochlitz], [uncertain: Werleben], Bornstädt,
    and whatever all the rabble are called, have constantly quarrelled like tinkers before Your Serene
    Highness''s eyes, but at bottom they have all cheated in brotherly concord, so that anyone''s hair
    would stand on end. It was always Your Serene Highness whom they would all gladly have plundered clean.
    The forest is entirely ruined, and had the thieves gone on [uncertain: cutting] here another year,
    the fine estates would no longer have been worth 50000 — Now I am at pains to outflank Bornstädt really
    soundly. He seemed to intend to make use of the sale to the subjects; but these I have brought so
    far that they leave him, against my guarantee, until the matter is concluded. Then I shall doubtless
    get the better of the hero — It is shameful to me that such infamies occur in the files; thus Bornstadt
    says, for example: at the'
- page: 5
  en: 'commencement of my lease I had to lay out 500 Rthl to Glenck as proxenticium; another tenant promised
    him more after a year''s term, and therefore he wished to drive me out, in order to extort another
    600 Rthl. It must indeed be untrue, he goes on to say, that the Prince, as Glenck boasts, knows of
    such cheating, for the Prince has the repute of the most exalted, greatest of men and friend of mankind.
    I could go mad when such a thing comes before my eyes, and I can wish nothing further than to clear
    away all these grubby things and to be rid of them so utterly that Your Serene Highness may have no
    further [uncertain: vexation]. What torments me most at present is this — Your Serene Highness has
    promised Bornstädt 1000 pieces of Fried:d''or if he helps sell Betschen for 200000 Rthl. Glenck has
    confirmed this here before Metzig. What am I, a poor man, now to answer to that? The fellow tenders
    in this regard the oath to Your Serene Highness, to Glenck, and to Rochlitz. What am I to answer the
    fellow on this, and with what am I to satisfy him? Be pleased, most gracious Prince, to give me an
    instruction in this regard. The lease matter I would settle at law, and by God cut nothing short,
    but in this history I can do nothing further without Your Serene Highness''s command. Generals, and
    God knows what people, all take an interest on behalf of the poor wretch and his wife, who seems to
    be a real Xantippe'
- page: 6
  en: 'to be; therefore I wish to be rid of the wretched B. in a decent manner. As regards the timber
    contracts, matters look just as ugly — for so far as they exist, they belonged to Rochlitz under other
    names — and the name-bearers now all cry out that they want no money but the quantities of timber
    specified in the contracts. This is now to be another motive for annulling the purchase with the subjects.
    But here I shall speak loudly with the [uncertain: patrons]. For the whole commune will come forward
    and loudly prove the villains'' infamies — Your Serene Highness will be astonished at all these knaveries.
    This very moment I learn of a new intrigue of Glenck''s — I had, as said before, brought Meyer Bernhard
    so far that he meant to be in Posen on the evening of the 29th or early on the 30th with the 66000
    Rthl. At this moment Wünster tells me that Glenck has talked Meyer Bernhard into not paying the money
    on the 29th but going to Breslau and asking Your Serene Highness what he should do — for it would
    not be necessary before the 2nd of August that the money be lodged with Broniewski. The Jew now twists
    again, says he would do it, since he has so many claims upon Your Serene Highness. We all sit here
    now like fools — It is more than too bad.'
- page: 7
  en: 'what these people permit themselves — As regards the Kaemener and Kulmner dismemberment I can likewise
    do nothing for the present. For Glenck has already betrayed everything to him (of which the enclosed
    letter Lub f is the proof), everything, in order to earn something. O God! what shameful people are
    these? I shall see what the Jew will do; if he insists on the journey to Breslau, then I shall only
    see how I can get half-way finished with the subjects here, and shall come there too at that time;
    but then I petition Your Serene Highness also, most heartily, to work over all these B: really roughly,
    so that they may at last be brought to fear and may cease their damned menées. In deepest reverence
    I remain, until death, Your Most Serene Highness''s [most humble servant]. May Your Most Serene Highness
    be pleased to send the express courier with all the papers to Posen, to old Reinhardt. If I can still
    turn everything, I shall be there — if not, then he must send them to me hither. Ah, it is now a true
    torment of hell to bring these people to reason. The letter to my daughter I most submissively beg
    to have delivered, and if anything has come in there from South Prussia etc., to let it go with the
    express courier to me. Betsch, the 26th of July 1804, faithful humble and obedient servant, v Triebenfeld'

  en: '140


    Most Serene Prince


    Most gracious Lord!


    My first resolve was to report no more unpleasant matters whatsoever to Your Most Serene Highness,
    and to let things which could no longer be altered take their course. Compelled by necessity, however,
    I must give up this resolve and [uncertain: recta mirn] Your Most Serene Highness''s help — the matter
    is this.


    Before I came here I received the letter of von Bornstädt at Poznań, enclosed under Letter A. I had
    no good opinion of the writer and sought to humble him by having a mere acknowledgment of receipt
    given him through Glenck, to the effect that a letter from Mr von Bornstädt had come in in His Serene
    Highness''s affairs, upon which he, as general attorney, would give him an answer.


    At Poznań I then further sought to win over Melzer and the [uncertain: Pre: Braunschweig] and to do
    everything possible so that the Berlin order might be upheld and the monies deposited, but above all
    that Broniewski might be evicted at once. This was promised me, and I travelled on that same night
    here to Pszczew, sent a mounted messenger at once to Frankfurt an der Oder and summoned Meyer Bernhard
    and associates here. The enclosed copy under B says the rest.


    After this expedition [uncertain: bis] I had the deputies who were at Wrocław called; it was in the
    highest degree strange to me that not one of them would appear; at length I learned that the people
    had been stirred up to withdraw from the purchase. I sought to find out the ground of it, and heard
    to my horror that Rochlitz was confusing the people''s heads and threatening them, to tear the whole
    thing apart, because he [uncertain: um] his brother-in-law Klein had a contract in his hands under
    which they would take over the'

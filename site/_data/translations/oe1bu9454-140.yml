- page: 6
  en: 'to be; therefore I wish to be rid of the wretched B. in a decent manner.


    As regards the timber contracts it looks just as ghastly — for so far as [uncertain: da seid], they
    belonged to Rochlitz under other names — the name-bearers now all cry out that they want no money
    but the sums of timber fixed in the contracts. This is now again to be a motive for annulling the
    purchase with the subjects. But here I shall speak loudly to the rogues. For the whole communities
    will come forward and prove the villains'' infamies aloud — Your Serene Highness will be astonished
    at all this knavery.


    This very moment I learn of a new intrigue of Glenck''s — I had, as said above, brought Meyer Bernhard
    so far that he meant to be at Poznań on the evening of the 29th or early on the 30th with the 66/m
    Rthl. At this moment Wunster tells me that Glenck has talked Meyer Bernhard out of paying the money
    on the 29th, and into going to Wrocław and asking Your Serene Highness what he should do — for it
    would not be necessary before the 2nd of August that the money be paid over to Broniewski.


    The Jew now twists about again, says he would do it, for he has so many claims upon Your Serene Highness;
    we all sit here now like fools — It is more than too bad'

- page: 7
  en: 'what these people permit themselves — As regards the Kamionna and Kulmner dismemberment I can likewise
    do nothing for the present. For Glenck has already betrayed everything to him / of which the enclosed
    letter of [uncertain: Liebt] is the proof / everything, in order to earn something. O God! what shameful
    people are these? I shall see what the Jew will do; if he insists on the journey to Wrocław, then
    I shall only see how I can get half-way finished with the subjects here, and shall come there in due
    time too, but then I beg Your Serene Highness also most heartily to work all these B. over really
    roughly, so that they may at last be brought to respect and drop their accursed machinations. In deepest
    reverence I remain, until death, Your Most Serene Highness''s — May Your Most Serene Highness be pleased
    to send the express courier with all the papers to old Reinhardt at Poznań. If I can still turn everything
    about, I shall be there — if not, then he must send them to me here. Ah, it is true torment of hell
    to bring these people to reason. The letter to my daughter I most submissively beg may be delivered,
    and if anything has come in there from South Prussia etc., that it may be sent along to me by the
    express courier. Pszczew, the 26th of July


    1804


    faithful, humble and obedient servant


    v Triebenfeld'

- page: 6
  en: 'to be; therefore I wish to be rid of the wretched B. with good manners.


    As to the timber contracts it looks just as [uncertain: dreadful] — for as many as there are, they
    belong to Rochlitz under other names. The name-bearers are now all crying out that they want no money
    but the sums of timber fixed in the contracts. This is now to be another motive for annulling the
    purchase with the subjects. But here I shall speak loudly with the rogues. For the whole communities
    will come forward and loudly prove the villains'' infamies. — Your Serene Highness will be astonished
    at all the knaveries.


    This very moment I learn of a new intrigue of Glenck''s. I had, as said before, brought Meyer Bernhard
    so far that he meant to be in Posen on the 29th in the evening or the 30th early with the 66000 Rthl.
    At this moment Wünster tells me that Glenck has talked Meyer Bernhard into not paying the money on
    the 29th, but going to Breslau and asking Your Serene Highness what he should do — for it would not
    be necessary before the 2nd of August that the money be paid over to Broniewski.


    The Jew now twists again, says he would do this, that he has so many claims upon Your Serene Highness.
    We all sit here now like fools. — It is more than too bad.'

- page: 2
  en: 'As Mr Eberhard assures me, there is likewise not one true little word in the estate exchange with
    Strachwitz that has been so Jewishly cried up. Strachwitz too does not know a syllable of it.


    Some time ago Fischbach gave me the accompanying valuations of estates belonging to a certain von
    Knobelsdorff, who wishes to exchange them against Polish estates — The large valuations appear to
    have been made up by himself, but the small ones to have been extracted by Fischbach from the Landschaft
    valuation. Fischbach says Knobelsdorff will let the estates stand with 70,000 Rthl of debts, thereon
    255,000 Rthl in mortgage bonds, 135,000 Rthl in private debts; this amounts to = 390,000 Rthl, there
    remains to the good = 310,000 Rthl. The Zagórów estates are said to yield about 27,000 Rthl, which
    would be at a value of 540,000 Rthl.


    thereon stand debts


    1. the Invalids'' Fund 50,000 Rthl


    2. the Oppenheimer claim together with arrears of interest 115,000 Rthl.


    3. Weigelt 50,000 Rthl.


    4. Seher Thos 8,000 Rthl.


    5. Onera perpetua about 1,200 Rthl. Good capital — 24,000 Rthl. makes capital 247,000 Rthl.


    remains to the good in value 293,000 Rthl.


    The Knobelsdorff estates would thus [uncertain: have] a higher value by 17,000 Rthl. Fischbach offers
    to bring this exchange of estates about, if it is conducive to Your Serene Highness''s interest. For
    his trouble he demands 1 1/2 per cent. May it please Your Serene Highness to issue your commands by
    this express, whether Fischbach is to come with Knobelsdorff to Sławięcice. I further remark overleaf


    v Triebenfeld'

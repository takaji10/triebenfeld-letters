- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    To Your Most Serene Highness I transmit herewith the exposé which I have given to Mr. Weigel; he lives
    and breathes in this affair, and declares that he means the Knobelsdorff estates. I shall now set
    the further steps in motion with Hainen as well, so that he too may be brought round to give his fiat
    to everything — I believe, however, that Weigel will this time act without him; in the meanwhile it
    is well if every stone of offence is cleared out of the way. My endeavour is now directed only to
    scraping together 500 Rthl, in order to set out on the 11th of this month for Zagorowo and there to
    arrange everything so that the affair may be laid open and blameless before [uncertain: mitem] at
    Mr. von Knobelse''s place.


    Concerning Schweinern I am in negotiation with the merchant Wiener as also with the merchant Schiller
    — Tismar writes very mystically from Berlin – He says one would certainly be satisfied — at bottom
    this is nothing but empty noise. May God only grant blessing and prosperity to my plans, and then
    Your Serene Highness may laugh at all the fools along with me. My deepest reverence to your children.
    Ever, however, Your Most Serene Highness''s


    Schweinern, the 2nd of August.


    1810


    faithful most humble and obedient servant


    v. Triebenfeld'

- page: 3
  en: 'the 17000 Rthl by which the Knobelsdorff estates are worth more will be covered by the outstanding
    arrears, as also by the [uncertain: seasonal] shortfalls in the 27000 Rthl of revenues which in these
    bad times may be expected. Perhaps Knobelsdorff will then also take the Trąbczyn estates with the
    debts standing upon them, as also such others as there are, and carry the lawsuit through to its end
    himself. But may it please Your Serene Highness to state your opinion on everything thoroughly, so
    that I may [uncertain: calmly] instruct the people and direct them to Schlawenschitz — otherwise I
    might again be saddled by the most highly trusted with some new honorary title.'

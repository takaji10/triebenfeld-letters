- page: 1
  en: '203


    Most Serene Prince


    Most gracious Prince and Lord!


    To Your Most Serene Highness I transmit herewith the exposé which I gave to Mr Weigel; he lives and
    breathes in this affair, and declares that he means the Knobelsdorff estates. I shall now set the
    further steps in train with Hainen[?] as well, so that he too may be brought round to give his fiat
    to everything — I believe, however, that Weigel will this time act without him; meanwhile it is well
    when every stone of offence has been cleared out of the way. My endeavour now goes only to scraping
    together 500 Rthl, in order to depart on the 11th of this month for Zagórów and there to put everything
    in such order as to be able to [uncertain: lay] the matter open and unimpeachable before Mr von Knobelsdorff.


    Concerning Świniary I am in negotiation with the merchant Wiener as also with the merchant Schiller
    — Tesmar writes from Berlin very mystically — He says one would surely be satisfied — at bottom that
    is nothing but empty noise — May God only grant blessing and prosperity to my plans, for then Your
    Serene Highness may laugh at all the fools along with me. My deepest reverence to your children. Ever,
    however, Your Most Serene Highness''s


    Świniary, the 2nd of August.


    1810


    faithful and most humble and obedient servant


    v Triebenfeld'

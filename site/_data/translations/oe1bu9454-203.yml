status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord!


    To Your Most Serene Highness I transmit herewith enclosed the Exposée which I gave to Herr Weigel;
    he lives and breathes in this affair, and declares that he means the Knobelsdorff estates. I shall
    now further set matters in train with Hainen as well, so that he too may be brought into tune and
    give his fiat to everything - I believe, however, that Weigel will this time act without him; meanwhile
    it is well when every stone of stumbling is cleared out of the way. My endeavour is now directed only
    at scraping together 500 Rthl, so as to depart on the 11th of this month for Zagorowo and to order
    everything there in such a way as to be able to lay the matter open and blameless before Herr v Knobelsdorff
    there [uncertain: mitem]. Concerning Schweinern I am in negotiation with the merchant Wiener as also
    with the merchant Schiller - Tismar writes from Berlin very mystically - He says one would surely
    be satisfied - at bottom this is nothing but empty noise. May God only give blessing and prosperity
    to my plans, for then Your Serene Highness may laugh at all the fools along with me. My deepest reverence
    to Your children. Eternally, however, Your Most Serene Highness''s


    Schweinern, the 2nd of August 1810


    true and most humble and obedient servant

    v Triebenfeld'
- page: 2
  en: 'As Herr p Eberhardt assures me, there is likewise not one true little word in the matter of the
    Jewishly praised estates Lausch with Strachnitz. Strachard likewise does not know a syllable of it.
    Some time ago Fischbach gave me the accompanying assessments of estates which belong to a certain
    v Knobelsdorff, who wishes to exchange them against Polish estates. The thick assessments appear to
    be self-made, but the small ones to have been extracted by Fischbach from the Landschaft assessment.
    Fischbach says Knobelsdorff will let the estates stand for 70000 Rthl of debts, upon them


    255000 Rthl mortgage bonds

    135000 Rthl private debts

    this amounts to 390000 Rthl

    remains to the good 310000 Rthl


    The Zagorowo estates are said to yield circa 27000 Rthl, which would be at a value of 540000 f., upon
    which stand debts

    1. the Invalids'' Fund 50000 Rthl

    2. the Oppenheimer debt together with arrears of interest 115000.

    3. Weigel 50000.

    4. Seher Thos 8000.

    5. Onera perpetua circa 1200 Rthl, good capital — 24000.

    makes capital 247000 Rthl

    remains good in value 293000 Rthl


    The Knobelsdorff estates would therefore [uncertain: show] a higher value of 17000 Rthl. Fischbach
    offers himself to bring about this exchange of estates, if it be conducive to Your Serene Highness''s
    interest. For his trouble he demands 1 1/2 per cent.


    May it please Your Serene Highness to issue commands by this express, whether Fischbach is to come
    with Knobelsdorff to Schlawenschitz.


    v Triebenfeld


    I note further overleaf'
- page: 3
  en: 'the 17000 Rthl by which the Knobelsdorff estates are worth more will be covered by the outstanding
    arrears, as also by the [uncertain: occasional] shortfalls in the 27000 Rthl of revenues which may
    be expected to occur in these bad times. Perhaps Knobelsdorff will then also take on the Trąbczyn
    estates with the debts standing upon them, as well as the other debts besides, and himself carry the
    lawsuit through to the end.


    But may Your Serene Highness deign to state Your opinion thoroughly upon everything, so that I may
    [uncertain: calmly] give the people their answer and direct them to Schlawenschitz - Otherwise I might
    again be saddled by the most highly trusted one with a new [uncertain: former] title.'

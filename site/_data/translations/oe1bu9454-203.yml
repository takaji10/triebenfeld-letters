- page: 2
  en: 'As Mr. von Eberhardt assures me, there is likewise not one true little word in the Jewishly praised
    estates Lausch with Strachnitz. Strachard too does not know a syllable of it. Some time ago Fischbach
    gave me the enclosed valuations of estates belonging to a certain von Knobelsdorff, who wishes to
    exchange them against Polish estates. The large figures appear to have been made up by himself, the
    small ones however to have been extracted by Fischbach from the Landschaft valuation. Fischbach says
    Knobelsdorff is leaving the estates standing with 70000 Rthl of debts, upon them 255000 Rthl in mortgage
    bonds, 135000 Rthl in private debts; this amounts to 390000 Rthl


    there remains to the good.


    310000 Rthl The Zagorowo estates are said to yield about 27000 Rthl, which would be at a value of


    540000 f.


    upon them stand debts


    1 the Invalids'' Fund


    50000 Rthl


    2. the Oppenheimer debt together with arrears of interest 115000.


    3. Weigel 50000.


    4. Seher Thos 8000.


    5. Onera perpetua about 1200 Rthl, capitalised — 24000.


    makes in capital 247000 Rthl, there remains good in value 293000 Rthl. The Knobelsdorff estates would
    thus show a higher value of 17000 Rthl. Fischbach offers to bring about this exchange of estates,
    if it is conducive to Your Serene Highness''s interest. For his trouble he asks 1 1/2 per cent. May
    it please Your Serene Highness to issue by this express the commands whether Fischbach should come
    with Knobelsdorff to Schlawenschitz. v. Triebenfeld I further note overleaf'

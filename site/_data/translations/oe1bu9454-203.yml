- page: 3
  en: 'the 17,000 Rthl by which the Knobelsdorff estates are of greater worth will be covered by the outstanding
    arrears, as also by the [uncertain: possible] shortfalls in the 27,000 Rthl of revenues which in these
    bad times may be expected to occur — Perhaps Knobelsdorff will then also take the Trąbczyn estates,
    with the debts standing upon them as well as the other debts, and will himself carry the lawsuit through
    to the end.


    But may it please Your Serene Highness to state your opinion upon everything thoroughly, so that I
    may [uncertain: early] give the people their answer and direct them to Sławięcice — Otherwise I might
    again be saddled by the most highly trusted one with new honorary titles.'

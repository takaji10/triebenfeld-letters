  en: '103


    Most Serene Prince


    Most gracious Prince and Lord!


    In the Broniewski matter I have as yet done nothing further, because the term for the taking of evidence
    is set for the 14th of this month. The patron is now very willing to settle, and I believe that he
    would for the present be content with some 20/m Rthl. But the real proofs newly furnished by Rapacki
    testify clearly that not a Groschen belongs to him — this is the reason why I am still deferring the
    settlement. If the Government accepts these grounds, then no settlement will take place — unless the
    Krotoszyn exchange should require it, for the sake of which I would at need sacrifice a few thousand,
    and in order to come at once into possession. His anxiety is already very great, for he offers even
    to accept a bond which I hold from the Minister on Kępno. From Mr Schlabrendorff I shall have news
    today, whether he is satisfied with my bill of exchange at one year. In any event I shall seek to
    pacify him.


    The Chełmski suit has been won in the second instance — it now remains to be seen whether he will
    proceed further — through Rapacki and Kordaszewcken I shall presumably obtain real intelligence concerning
    the Brzyce estates; also arrange-'

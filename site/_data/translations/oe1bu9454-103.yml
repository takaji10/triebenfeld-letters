- page: 2
  en: 'ments have been made for me to get into my hands the documents concerning the Wieniec forest; these
    will no doubt at once refute from the ground up the foolish babble of the witnesses — the Chełmski
    and Broniewski matters will be brought to a good end; only the Brzyce and Wieniec ones demand every
    attention — because behind them stands the worst web of malice — Above all, I am now sitting over
    a description of the estates bestowed upon Your Most Serene Highness. A quarrel between Prittwitz
    and Glenck, and likewise the constant carping of the Minister — as though Your Serene Highness had
    received, quite contrary to the his of the King, too many estates, in which Prittwitz seems to concur
    — give me occasion for it.


    Out of the one, envy bellows; out of the other, a clumsy ignoramus. For if one takes it that the King
    ordered estates to be given to Your Most Serene Highness bearing 7 to 8,000 Rthl of revenues, then
    this has only been punctually fulfilled in every part. The confiscated Prusimski estates, which were
    given first, were to answer to the King''s will; but the valuations of the chamber councillor Beukerts,
    chosen by the Minister himself,'

- page: 4
  en: 'The yield of the bestowed estates has therefore now been raised by somewhat more than double, through
    diligence, expense and industry. To the clear-sighted man this is however no wonder, still less does
    the least offence lie here, but merely spiteful envy, at the bottom of the daily bleating of men.
    For take the Bischofswerder estates: these were at the highest to yield 1500 Rthl according to 4 valuations
    – I have sold them for 207000 Rthl. The Zastrow estates were to yield, the [illegible] about 2000
    Rthl; they bring in indisputably some twenty thousand. The Dolfi ones were to yield about 500 Rthl;
    Treskow is now selling them for 360000 Rthl. General Ruchel''s were to yield 940 yearly; they have
    been sold for 140000 Rthl. Of all these not a word is spoken; only with Your Serene Highness''s estates
    does one indulge the vice of envy, and cannonade without knowing at what. Sad enough for the State
    that men are constantly kept in pay who act toward me out of passion, who linger over trifles and
    the everyday chronique scandaleuse, but never persevere with the whole.


    Glenck is meanwhile to lay this presentation of the matter before Prittwitz under his own name, and
    after that we shall indeed see what sheepish faces the one or the other will show. God grant that
    Your Serene Highness may soon return to me in health; if not, then I shall probably come from Berlin
    to Öhringen, Ansbach, or wherever I may find the same. The tiresome war has then truly broken out
    after all – rather is this however a salutary poison – I remain, until death, Your Most Serene Highness''s


    Breslau, the 13th of March


    1799.


    faithful servant v. Triebenfeld'

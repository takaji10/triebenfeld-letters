- page: 2
  en: 'made that I shall get into my hands the documents concerning the Winiges forest; these will no
    doubt at once refute from the ground up the ragged rubbish of the witnesses – the Chelmski and Broniewski
    matters will be brought to a good end, only the Brzyza and Winzingerode ones require every attention
    – because behind them lies propped the worst web of malice. Altogether I am now sitting over a description
    of those estates bestowed upon Your Most Serene Highness. A wrangle between Prittwiz and Plench, as
    also the constant reasoning of the Minister – as though Your Serene Highness had received far too
    many estates, quite contrary to the intention of the King, which Pribwitz appears to concur in, give
    me occasion for it.


    Out of the one, envy roars; out of the other, coarse ignorance. For if one takes it that the King
    commanded that estates be given to Your Most Serene Highness yielding 7 to 8000 Rthl in revenue, then
    this has only been punctually fulfilled in all points. The confiscated Prusimski estates, which were
    given first, were to answer the will of the King. But the valuations of the chamber councillor chosen
    by the Minister himself,'

- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    In the Broniewski matter I have as yet done nothing further, because the term for the taking of instruction
    is set for the 14th of this month. The patron is now very willing indeed to come to a compromise,
    and I believe that he would for the present be content with some 20000 Rthl. But the real proofs lately
    furnished by Rapacki testify clearly that not a Groschen belongs to him – this is the reason why I
    am still deferring the compromise. If the Government accepts these grounds, then no compromise will
    take place – unless the Krotoszyn exchange should require it, for the sake of which I would at need
    sacrifice a few thousand, and in order to come at once into possession. His anxiety is already very
    great, for he is already offering to accept a bond which I hold from the Minister on Kempen. From
    Mr Schlabrendorff I shall have news today, whether he is satisfied with my bill of exchange at one
    year. In any event I shall seek to set him at ease.


    The Chelmski suit has been won in the second instance — it now remains to be seen whether he will
    go further – through Rapacki and Kordaszeweben I shall probably obtain real information about the
    Brzyza estates; arrangement has also been'

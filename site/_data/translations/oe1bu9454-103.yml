- page: 3
  en: 'Beukert, proved that twice as much debt again was charged upon those estates as the value of the
    same was ascertained to be according to the yield determined by said Beukert.


    In order now to cloak the evil intention that had gone before, and to comply with the intention of
    the monarchy, the Minister then proposed the various ecclesiastical estates, which were to bring in
    8640 Rthl of revenue.


    The Prusimski estates are now to be regarded as purchased, because one must first vindicate them in
    court and fight for them step by step, and must also still pay in considerable sums. They are therefore
    no gift at all, and stand on the same footing as purchased allodial estates, with which one often
    fares more happily than with these. Meanwhile the yield thereof afterwards works out in the following
    manner:


    1. from Kaemen and Kulm 6000 Rthl


    2. from Trąbczyn 8400 Rthl


    3. from Szetlewek 1600


    4. from Brzyza 4000


    is in sum


    20000 Rthl. The estates now actually bestowed, in respect of which the will of the King is held to
    have been exceeded, have been valued how many times over, and were to yield


    8640 Rthl; through sums paid out [uncertain: for them] and revenues applied therein over three years,
    a surplus of about 14000 Rthl has been brought out; this makes together 22640 Rthl, in all 42640 Rthl.
    NB to the 8640 Rthl there come also about 1400 Rthl of building moneys, which may be reckoned off
    from the 14000, so they are improved by only about 12000 Rthl of yield.'

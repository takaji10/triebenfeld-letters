- page: 4
  en: 'The yield of the bestowed estates is therefore now raised by something more than the double, through
    diligence, expense and industry. This, however, is no wonder to the clear-sighted man; still less
    does the least offence lie here, but merely spiteful envy, grounded in the daily [uncertain: Gepkerr]
    of men. For take the Bischofswerder estates: these were, according to 4 valuations, to bear at most
    1,500 Rthl — I sold them for 207,000 Rthl. The Zastrow estates were, [illegible], to bear about 2,000
    Rthl; they indisputably bring some twenty thousand. The Dolf estates were to bear about 500 Rthl;
    Treskow — is now selling them for 360,000 Rthl. Those of General Ruchts were to bear 940 Rthl yearly;
    they were sold for 140,000 Rthl. Of all these not a word is spoken; only in the case of Your Serene
    Highness''s estates does one indulge the vice of envy, and carp without knowing what. Sad enough for
    the State that men are constantly paid salaries who [uncertain: mir] act out of passion, who dwell
    upon trifles and upon the everyday chronique scandaleuse, but never take the whole to heart.


    Glenck shall meanwhile lay this representation of the matter before Prittwitz under his own name,
    and after that one shall indeed see what sheepish faces the one or the other will show. God grant
    that Your Serene Highness may soon return to me in health; if not, I shall doubtless come from Berlin
    to Öhringen, Ansbach, or wherever I may find Your Highness. The wretched war has then truly broken
    out after all — rather is this, however, a wholesome poison — I remain, until death, Your Most Serene
    Highness''s


    Wrocław, the 13th of March


    1799.


    faithful servant


    v Triebenfeld'

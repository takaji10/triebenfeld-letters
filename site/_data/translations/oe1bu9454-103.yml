- page: 3
  en: 'proved that twice as much debt still rested upon those estates as the value of the same was ascertained
    to be from the yield by Beukert.


    In order now to cloak the evil intention previously entertained, and to comply with the his of the
    Monarch, the Minister then proposed the various ecclesiastical estates, which were to bring 8,640
    Rthl of revenues.


    The Prusimski estates are now to be regarded as bought, because they must first be vindicated at law
    and fought for step by step, and considerable sums must still be paid in upon them. They are therefore
    no gift at all, and stand upon the same footing as purchased allodial estates, with which one often
    fares more happily than with these. Meanwhile the yield thereafter falls out in the following manner:


    1. from Kamionna and Kolno = 6,000 Rthl.


    2. from Trąbczyn = 8,400 Rthl.


    3. from Szetlewek = 1,600 Rthl.


    4. from Brzyce = 4,000 Rthl. is in sum 20,000 Rthl.


    The estates now actually bestowed, in respect of which, as alleged, the King''s will has been exceeded,
    have been valued how many times over, and were to bear = 8,640 Rthl; through [uncertain: seren] sums
    paid and three years'' revenues applied therein, a surplus of about = 14,000 Rthl has been brought
    out; this makes together = 22,640 Rthl, in all 42,640 Rthl.


    NB to the 8,640 Rthl there come further about 1,400 Rthl of building moneys, which may be deducted
    from the 14,000; so they are improved only by about 12,000 Rthl of yield.'

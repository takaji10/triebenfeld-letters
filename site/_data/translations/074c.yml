segments:
- page: 1
  en: 'The Royal Minister of State and of Justice, Herr von Kircheisen, is hereby called upon, as executor
    of the testament of the deceased Frau Fürstin von Sacken, in the event that the assertion advanced
    by the General Invalids'' Fund in its suit lodged on the 30th of last month before the Royal Chamber
    Court — namely that the Herr Fürst von Hohenlohe Ingelfingen would receive from the estate of the
    Fürstin von Sacken a legacy of 50000 Rthl, and that she had assigned this to the Councillor of War
    and Forests von Triebenfeld at Kontop near Grüneberg in satisfaction of the latter''s claims against
    him — should prove to be founded, to pay out nothing to the said von Triebenfeld from this sum, upon
    his own liability. Berlin, the 1st of August 1811. Royal Prussian Chamber Court. [To] the Royal Minister
    of State and of Justice, Herr von Kircheisen. in simili: To the Royal Upper Medical Councillor Herr
    Cosmar, here. To the Councillor of War and Forests Herr von Triebenfeld at Kontop. No 1103. We transmit
    to you herewith a summons of the Royal Chamber Court at Berlin of the 1st of the current month in
    the matter of the General Invalids'' Fund against you, with the command to render in every respect
    the obedience due to its contents, and to certify in full the due receipt thereof upon the Copy to
    be laid before you of the same. Glogau, the 6th of Aug. 1811. Royal Prussian Superior Provincial Court
    of Silesia. Fülleborn'

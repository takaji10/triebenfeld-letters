status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Prince and Lord! The latter opinion of Court Councillor Hahn
    as well I have delivered, together with the letter enclosed here in Copy, to His Serene Highness the
    Prince State Chancellor. The answer was: "Well! here too there is nothing further than what was said
    in the first submission — meanwhile "it is good that the judgement from that side is of one mind.
    "The Duchess of Sagan is seeking the King''s permission to raise moneys upon Sagan, "and assigns what
    the King owes her as security. "She [uncertain: knows/points to] precisely the sum guaranteed for
    Prince Hohenlohe. "The King has once again deferred the matter until his return home. "As soon as
    it can be done I shall certainly press the matter." Just now I am working day and night to obtain
    the assurance in writing for myself, that I may be permitted to conclude with the Courland mandatories.
    The Duchess is here; she needs money most urgently — I wished to go to the Duchess myself, but B:,
    who pursues the matter with genuine zeal, would by no means have it. I can therefore only observe
    the lady from a distance. Upon a verbal enquiry concerning Trąbczyn and Kaemen I have received the
    enclosed answer. I begged urgently to be able to send Your Serene Highness something consoling; been
    I received a [uncertain: Wirscher], and thereupon yesterday evening this short reply; so I am now
    [aware] that the matter is at present being roasted along on the great hearth. For the rest, little
    has yet been settled here; not before the 15th of next month is it to become known what has been resolved
    in the council of the gods. The King of Würtemberg is ready to burst with vexation that they will
    not communicate to him the plans of the things that are in hand. He has now declared that, if they
    do not [set him a time] for everything, he would leave Vienna at once and protest against everything.'
- page: 2
  en: 'One is in great anxiety on that account, especially as to who should advise and guide the high
    [affairs] here should this shrewd, discerning, humane man withdraw. He is surely in earnest with his
    zeal, for he is said already to have drawn together an army of 4000 men. Meanwhile things are said
    to be beginning to grow very unquiet in Würtemberg, and likewise in Baden; joined with the restless
    Swiss, the spark might well become a [uncertain: demanding] flame, and will it not then be said, what
    does not burn me I need not put out. More by the next post. Reverently I remain, until death, Your
    Most Serene Highness''s Vienna, the 26th of November 1814 faithful and most obedient servant v Triebenfeld'

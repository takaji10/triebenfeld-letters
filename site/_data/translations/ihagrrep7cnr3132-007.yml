- page: 1
  en: 'Copy.


    Friedrich Wilhelm etc.


    Our etc. In returning to you the 6 vol. of files in the matter of the inquiry against the former Starost
    Anton v. Prusimski and the former canon Xaver von Jezierski, sent in with your report of the 24th
    of March of this year, we at the same time send you, in the copy enclosed, the cabinet order issued
    on the 10th of last month, from which you will see that both have been granted the leave they asked
    for to return to their fatherland, and that the confiscation of property decreed against them, together
    with their 9 years'' banishment, has been deemed a sufficient punishment for their part in the insurrection.
    Sind etc. Berlin, 11 May 1803.


    Auzl etc. special command.


    Goldbeck Haugwitz


    To the South Prussian Government at Poznań


    His Royal Majesty of Prussia, our most gracious Lord, hereby lets Anton v. Prusimski and Xaver von
    Jezierski know, on their immediate representation of 27 Jan. of this year, that the leave they asked
    for to return to their fatherland has been granted, on the assumption that they will conduct themselves
    there in future as loyal[?] subjects; that the confiscation of property decreed against them with
    final effect remains, however, unalterably in force, and that von'
- page: 2
  en: 'Jezierski must remain deprived of his clerical offices and benefices; but that otherwise they need
    fear no further inquiry or punishment for their part in the insurrection, on which the necessary has
    been ordered to the Government at Poznań this day.


    Berlin, 11 May 1803.


    Auzl.[?] etc. special command.


    Goldbeck Haugwitz


    To the former Starost Anton v. Prusimski and Xaver von Jezierski at Dresden.'

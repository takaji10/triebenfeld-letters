status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! Just this moment my tenant from Schwammen sends
    in and urgently begs me to come out for a moment and set the peasants in order, who will not obey
    him, but have refused the labour services. I must now hasten thither in order to prevent mischief.
    Your Most Serene Highness will most graciously forgive that today, on account of this matter, I cannot
    appear at midday. With the Herr Minister I have spoken today concerning Schlabrendorff. Frankly said,
    he seems to take it somewhat amiss that Your Most Serene Highness will say nothing to him, for I believe
    he expected that yesterday - but I find it right and good that Your Highness says nothing to him;
    one may first see what he will do. He has written to Schlabrendorff that on the 15th of this
- page: 2
  en: month he is to be here, that he has to speak with him in the Quist affair - for the present he lays
    it upon his heart to withdraw all complaint at once, for they are watching him so closely that not
    the least thing would remain undiscovered, and should anyone find so much as a Groschen's worth of
    blemish in the matter, he might be assured that it would go sadly with him. He, the Minister, could
    not thereafter save him, the said Sch:, even with the best will; indeed, he would then have to deny
    outright that he was related to him by ties of blood, etc. etc. Asch he had with him today and told
    him all this by word of mouth, so that it might be pressed further upon the heart of the Count at
    Stolze, whither Asch goes the day after tomorrow; in particular he is by all means to prevail upon
    Schlabrendorff that he be here on the 15th of this month? I go tomorrow to Landen, but shall quite
    certainly be here again on the 15th, and then I shall put Hirsch into harness as well. In deepest
    reverence I remain, until death, Your Most Serene Highness's Breslau, the 3rd of August 1802 faithful
    humble and obedient servant [most faithful servant] v Triebenfeld

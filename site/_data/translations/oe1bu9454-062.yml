- page: 1
  en: 'Now I no longer know what I am to think. Five letters have I sent off, and for not one of them
    [uncertain: abd] have I been thought worthy of an answer — this is the 6th letter — through the Chief
    Post Director Mann I sent the last one, which Your Serene Highness must have collected. Through his
    kindness I am sending this one again today. My utmost distress I have described in every one of them
    — and their Serene Highness does not even answer. I am taking here the greatest pains conceivable
    to me. Everything seems to be succeeding and to promise the happiest outcome. Even the Kosch affair
    has been set in motion, though it has been referred back to Berlin until the return. The Courland
    debt will be discharged, the settlement annulled, Cosmar must withdraw, and Your Serene Highness will
    come into possession of the entailed estate, and may live quietly and happily in your old age. The
    Polish estates must be given back, however much everything stands against it. For all these toilsome
    labours you let me suffer here the most oppressive want — by Heaven, that is dreadful — what I have
    submitted, and everything that is pledged upon it, is no little game of pots. Your Serene Highness
    need make no secret of it, for all will succeed, and once the goal is reached you will indeed be truly
    happy — how can you let me all but perish of want for it? Send money [uncertain: Guld], I beg it most
    earnestly — be so good as to address your letters to the Royal Prussian Chief Post Director Mann in
    Vienna, resident at Massakrop 1156. Should, however, the posts really be at fault, then may Your Serene
    Highness deign to send [uncertain: reuenen Exprechen] with money; nowadays not so many difficulties
    are made.'

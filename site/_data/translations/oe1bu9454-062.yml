- page: 1
  en: '62 Now I no longer know what I am to think: 5 letters have I sent off, and for not one of them
    [text lost] have I been deemed worthy of an answer — this is the 6th [uncertain: Brust] — through
    the Chief Post [text lost] Mann I sent the last one, which Your Serene Highness must absolutely have
    received. Through his kindness I am sending this one again today — My utmost distress I have described
    in every one of them — and their Serene Highness does not so much as answer. I am giving myself here
    the most conceivable trouble. Everything seems to succeed and to [uncertain: genennen: name/win] the
    happiest outcome. Even the Kosch matter has been set in motion, though it has been referred back until
    the return to Berlin. The Curische debt is to be discharged, the settlement cancelled, Cosmar must
    withdraw, and Your Serene Highness will come into possession of the entailed estate, and may live
    quietly and happily in old age. Also/Upon the Polish estates must be given back, however much everything
    is against it. For all these toilsome labours you let me suffer the most oppressive distress here;
    that is, by Heaven, dreadful — what I have submitted, and upon which everything is assured, is no
    little-pot game. Your Serene Highness need make no secret of it, for everything will succeed, and
    once the goal is reached you will indeed be truly happy — how can you let me perish here almost in
    destitution for it? Send money, this I beg most earnestly — Be graciously pleased to address your
    letters to the Royal [uncertain: Prensten] Chief Post Director Mann in Vienna, residing in the Massakroff
    1156 Rthl.


    Should, however, the posts really be at fault, then may Your Serene Highness be pleased to send [uncertain:
    reuenen] express couriers with money; at present not so many difficulties are being made any more.'

- page: 1
  en: 'No. 77,775 Warsaw, 27 Nov. 1830


    The Minister Presiding in the Government Commission of Revenue and Treasury to


    In order to make use of the materials for valuing the estates of Trąbczyn which Your Honour sent me
    with your application dated 14 October 1830, I have passed them to the authority which I have empowered
    to value the present worth of those estates.'

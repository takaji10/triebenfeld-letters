- page: 2
  en: 'Although Your Honour finds that, according to the judicial valuation you sent, your Capital had
    full security on the estates of Trąbczyn, yet since that valuation was made in the year 1803, and
    so in an Epoch of inflated value of landed estates, while the real value of Your Honour''s claim ought
    to be assessed according to the present state of the value of immovable property, because the last
    Judgment in your case was given in the year 1826, and it was therefore only from that date that proceedings
    for execution could have been pursued; and since, on the other hand, I have found in Your Honour''s
    letter no more accessible terms for an agreement, I must therefore, wishing to proceed with complete
    justice, await the completion of the work which I mentioned in my answer dated 22 September of this
    year, and over the hastening of which I am watching.


    sig. X. X. Lubecki'

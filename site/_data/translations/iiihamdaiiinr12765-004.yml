- page: 1
  en: 'Most Serene Prince,


    Most gracious Prince and Lord!


    His Majesty the late King of Prussia conferred in the year 1796 upon the Prince of Hohenlohe, according
    to the appended copy of the instrument under Letter A, the estates of Kamionna and Kulm in the Poznań
    department, likewise the villages of Trąbczyn, Szetlewek, Nowawies, Lazy, Laske, Osiny and Trąbczyner
    Hauland in the district of Konin, as also the village of Brzyce together with its appurtenances in
    Cujavia. These estates formerly belonged to a certain von Prusimski, and after his flight they were
    confiscated and conferred upon the Prince of Hohenlohe.


    The Prince possessed these estates, except Brzyce, which the daughter of Prusimski, now the married
    von Miączyńska, claimed as her maternal inheritance, for over 11 years in the most undisturbed possession.
    Of these he sold in the year 1804 to the bank director Leixner at Frankfurt an der Oder the Kamionna
    and Kulm estates, which Leixner likewise possessed undisturbed for 3 years.


    Only in 1807, and indeed 14 weeks after the peace of Tilsit, did it occur to the so-called Polish
    administrative commission to take all the estates from the Prince and from Leixner by force, without
    any judicial judgment whatever, and to give the same to the married Miączyńska. Prince Hohenlohe,
    immediately upon his return from the Empire, brought suit before the peace court at Konin, which forum,
    however, von Miączyńska did not recognise at all. The Prince thereupon caused the complaint here most
    humbly appended under Letter B to be submitted, in the prescribed manner, through his attorney, to
    the tribunal at Kalisz, which now also points to everything for further inspection. Von Miączyńska
    replied thereto through her actuary, according to the enclosure under Letter C, that she was also
    not not bound to submit herself to the tribunal in this matter. The said tribunal then drew the matter
    out longer than a year, and at length issued the decree appended under Letter D, in which, after many
    shallow and unintelligible circumlocutions, it says — that the tribunal did not hold itself empowered
    to annul the ordinance of the administrative commission, and that this belonged to the King alone
    — that von Miączyńska should therefore remain seated in the estates, and the Prince pay the costs.
    So the matter stands even now: Miączyńska sits in the estates, draws in all the revenues, and since
    1806 has paid not a Groschen of interest. No one was made more unfortunate by this shameful and violent
    act of the oft-mentioned administrative commission than the bank director Leixner; this man saw himself
    not only robbed of his fortune, but he lost his bread and his freedom. After the happy turn which
    Europe''s fate has now taken through Your Serene Highness''s foresight and exertion, may Your Most
    High Self deign to command that Kulm and Kamionna be given back to Leixner, in order that the Royal
    Bank may be satisfied, and by Your Most High and powerful intercession with His Majesty the Russian
    Emperor bring it about that to the Prince of Hohenlohe the Trąbczyn estates also, which lie on the
    far side of the Prosna, must be given back by von Miączyńska, together with the revenues drawn by
    her through 9 years, which according to the leases amount to 36500 Rthl.


    Your Most Serene Highness will, by the granting of this just request, make happy many persons languishing
    in misery, and the Royal Bank will likewise receive its money back.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Vienna, the 2nd of March


    1815


    most humble and obedient servant


    v. Triebenfeld


    [Written by the receiving office:]


    To be laid before the Privy Councillor of State


    Stägemann


    H[arden]b[er]g 14/3'

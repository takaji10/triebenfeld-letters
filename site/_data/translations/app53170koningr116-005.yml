- page: 1
  en: 'The Honourable Rajewicz — by force of due diligence — Protest


    Let there be seen here the Formal Protest made in fact and upon the personal appearance of the Honourable
    Piotr Rajewicz, declaring that he in no way had involved himself in the Boundary Act being conducted
    between the goods of Łukom and Trąbczyn — and that things were done without his consent — duly and
    diligently made, among the Produced Documents.


    Petrus Rajewicz, by his own hand'

status: draft
segments:
- page: 1
  en: My Lord, It suffices that Your Serene Highness deign to give me orders, for me to hasten to obey
    Him according to my faculties; I am not presumptuous enough to dare believe it possible that my intervention
    could add any value to a letter which comes from Your Serene Highness. Nevertheless, in order to carry
    out Your wishes, My Lord, I shall without delay deliver to the Prince Chancellor of State the letter
    which is addressed to him, and I shall seize this occasion to lay before his eyes the desires which
    Your Serene Highness has deigned to express to me. Too happy should I be if, in carrying out the orders
    of the Prince Chancellor of State, I might be the instrument of which he made use to fulfil the wishes
    of Your Serene Highness. It is only here at Vienna that I have come to know Mr. de Triebenfeld, who
  names:
  - de: Vienne
    en: Vienna
    kind: place
  - de: Triebenfeld
    en: Triebenfeld
    kind: person
- page: 2
  en: 'was until now entirely unknown to me. It sufficed, moreover, that he speak to me of Your Serene
    Highness for me to lend the greatest attention to all that he had to say to me. Deign to accept, My
    Lord, the expression of the very profound respect with which I have the honour to be, My Lord, Your
    Serene Highness''s very humble and most submissive servant. Beugelin


    Vienna, the 26 March 1815.'

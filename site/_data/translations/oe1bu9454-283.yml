- page: 2
  en: 'was entirely unknown to me until now. It was moreover enough for him to speak to me of Your Most
    Serene Highness for me to lend the greatest attention to all that he had to say to me. Deign to accept,
    My Lord, the expression of the very profound respect with which I have the honour to be, My Lord,
    Your Most Serene Highness''s, Vienna, the 26th of March 1815, most humble and most submissive servant


    Beguelin'

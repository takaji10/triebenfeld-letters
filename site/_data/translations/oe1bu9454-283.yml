status: draft
segments:
- page: 1
  en: Monseigneur, It is enough that Your Serene Highness should deign to give me orders, for me to hasten
    to obey Him according to my faculties; I am not so presumptuous as to dare believe it possible that
    my intervention should add any value to a letter which comes from the part of Your Serene Highness.
    Nevertheless, in order to execute Your wishes, Monseigneur, I shall without delay deliver to the Prince
    Chancellor of State the letter which is addressed to him; I shall seize this occasion to lay before
    his eyes the desires which Your Serene Highness has deigned to signify to me. Too happy should I be
    if, in executing the orders of the Prince Chancellor of State, I might be the organ of which he made
    use to fulfil the wishes of Your Serene Highness. It is only here at Vienna that I have come to know
    Mr. de Triebenfeld, who
- page: 2
  en: 'was until now entirely unknown to me. It sufficed him, moreover, to speak to me of Your Serene
    Highness for me to lend the greatest attention to all that he had to say to me. Deign to accept, Monseigneur,
    the expression of the very profound respect with which I have the honour to be, Monseigneur, Your
    Serene Highness''s very humble and very submissive servant. [uncertain: Bequelin] Vienna, the 26 March
    1815.'

- page: 1
  en: '283


    My Lord, It is enough that Your Most Serene Highness deign to give me orders, for me to hasten to
    obey Him according to my faculties; I am not presumptuous enough to dare believe it possible that
    my intervention should add any value to a letter coming from Your Most Serene Highness. Nevertheless,
    in order to carry out Your wishes, My Lord, I shall without delay deliver to the Prince Chancellor
    of State the letter addressed to him; I shall seize this occasion to set before his eyes the desires
    which Your Most Serene Highness has deigned to communicate to me. Too happy should I be if, in carrying
    out the orders of the Prince Chancellor of State, I might be the instrument of which he made use to
    fulfil the wishes of Your Most Serene Highness. It is only here in Vienna that I have come to know
    Mr de Triebenfeld, who'

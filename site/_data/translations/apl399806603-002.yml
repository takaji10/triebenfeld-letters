  html: '<div class="ledger-wrap"><table class="ledger">

    <caption>LIQUIDATION TABLE<br>of the village of the Łazińsk Colony<br>in the Kalisz governorate, Słupca
    district,<br>circuit, in the commune of Trąbczyn.<br>The village is in the first of the classes set
    by article 21 of the Ukase of 19 February (2 March) 1864 on the Liquidation Commission.<br>Under the
    Kalisz Commission for Peasant Affairs.</caption>

    <thead><tr><th rowspan="3" class="no">No. of the farmstead, in order.</th><th rowspan="3" class="name">Farmsteads
    that passed into the full ownership of the peasants under the Imperial Ukases of 19 February (2 March)
    1864.</th><th colspan="1" class="grp"></th><th colspan="12" class="grp">Amount of land in each farmstead
    holding, in Morgen and rods.</th><th colspan="2" rowspan="2" class="grp">Amount of the dues to be
    compensated by the Government under articles 14 to 26 of the Ukase on the Liquidation Commission.</th></tr>

    <tr><th colspan="1" rowspan="2" class="grp">In the draft liquidation table.</th><th colspan="2" class="grp">Under
    the dwelling, with or without a garden.</th><th colspan="2" class="grp">Under arable fields.</th><th
    colspan="2" class="grp">Under meadows.</th><th colspan="2" class="grp">Under pasture.</th><th colspan="2"
    class="grp">Unusable.</th><th colspan="2" class="grp">In all.</th></tr>

    <tr><th class="num">M.</th><th class="num">R.</th><th class="num">M.</th><th class="num">R.</th><th

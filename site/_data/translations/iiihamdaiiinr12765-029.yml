status: draft
segments:
- page: 1
  en: 'Berlin, 13 May 1820.


    To the Royal Privy Minister of State and Minister of the Interior, Mr von Schuckmann, c[illegible]
    716 B.


    The heirs of the Prince of Hohenlohe-Ingelfingen, who died at Sławięcice in Silesia, and Count von
    Bethusy in Silesia have had themselves represented before the Imperial Russian Government by Prince
    Eugen of Württemberg — the former on account of a compensation applied for in respect of the estates
    of Kamionna and Trąbczyn in Poland which were taken from their testator, the latter [lit. "the last-mentioned
    (neuter)"] on account of the free traffic desired between his possessions in Silesia and Poland, inferred
    from the treaty of between Prussia and Russia of 21 April/3 May 1815 — and upon this occasion there
    has reached me that note of the Imperial Russian envoy here which I have the honour most obediently
    to communicate to Your Excellency herewith in copy, entire, and according to which His Majesty the
    Emperor of Russia has refused the petition of both petitioners. In the matter of the heirs of the
    Prince of Hohenlohe no intercession can take place, it being a mere matter of grace; moreover, the
    [uncertain: support/recommendation] of his petition which was made during the Prince''s lifetime through
    the Royal envoy at Petersburg likewise remained unregarded.'
- page: 2
  en: 'and have not been separated at all in the first place by the said new frontier. The application
    of Count Bethusy, however, is wholly inadmissible, since under article 18 of the treaty of 3 May 1815
    the privilege applied for is to fall to those landowners whose possessions are cut through by the
    new frontier laid down by the said treaty, whereas the petitioner''s possessions lie far apart from
    one another, in different provinces.


    Since, if the Imperial Russian Government had [uncertain: nonetheless] granted the petition of Count
    von Bethusy, the government on this side would thereby have been brought into the unpleasant position
    of having to lodge objection against it, the impropriety of his application ought therefore not [to
    be left unmade known] to Count von Bethusy not my [text lost] [illegible] Your Excellency; I therefore
    believe I may, the more so as only the whereabouts of the petitioners, whose possessions lie in the
    district of the government at Opole, is not more precisely known, most obediently leave the further
    disposition entirely[?] to you. Berlin


    In [illegible].


    Hoffm[ann], Bal[an] 12/5'

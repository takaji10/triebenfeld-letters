  en: 'No. 569


    Vienna, 25 Nov. [18]14


    To


    the Councillor of War and Forests von Triebenfeld, Your Right Honourable, here. In reply to your petition
    of the 25th of last month I inform you that the affair of the Prince of Hohenlohe with respect to
    the claims upon Trąbczyn and Kamionna will settle itself, as soon as the general settlement and agreement
    concerning the Duchy of Warsaw, now in [uncertain: word / progress], comes to be carried out. W.,
    Nov. 14.


    Stägemann.


    Hardenberg.'

- page: 1
  en: '93


    Most Serene Prince,


    Most gracious Lord!


    To Your Most Serene Highness I transmit herewith the All-Highest letter which has followed upon the
    last petition. I hope that it will have answered Your Highness''s wishes. This very day the Minister
    von Struensee had to lay all the files before His Majesty; it now remains to be seen whether everything
    will be properly discussed.


    The truly upright Colonel von K[öckritz] — who most respectfully commends himself to Your Serene Highness
    — promises the most desirable outcome of the matter.


    Mr C[abinet] C[ouncillor] Beyme is indeed mightily preoccupied; however, he is too honest and open
    a man, and therefore I have nothing to fear on his side.


    The honest councillor of war von Cöln has set the matter out quite well, as Your Serene Highness will
    gather from the enclosure.'

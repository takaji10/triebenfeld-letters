status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! To Your Most Serene Highness I transmit herewith the All-Highest
    rescript which has issued upon the last petition. I hope that the same will have answered Your Highness''s
    wishes. This very day the Minister v. Struensee has had to lay all the files before His Majesty; it
    now remains to be seen whether everything will be duly examined. The truly upright Colonel von K.,
    who commends himself most respectfully to Your Serene Highness, promises the most desirable outcome
    of the matter. [uncertain: Herr Cabinet Councillor Beyme] is indeed mightily preoccupied, yet he is
    too honest and open a man for me to fear anything on his account. The honest Councillor of War v.
    Cöln has, as Your Serene Highness will gather from the enclosure, set the matter out quite well.'
- page: 2
  en: 'I have given this letter (which will remain only a plan, since I received it too late), together
    with the Pro Memoria, to Colonel v. Köckritz, and he has had the kindness to lay it this day before
    His Majesty. In this Pro Memoria, however, I have made the offer on my own part that, if Polajewo
    should stand in the way of the matter, I would take these estates on lease for 30 years — at the same
    time build 6 peasant holdings every year out of my own means — clear all waste grounds at my own cost
    — pay 20000 Rthl of rent yearly — and, at the expiry of the lease years, make good whatever of the
    yield of 20000 Rthl should not be shown. This heavy battery, it is thought, would at one stroke [uncertain:
    elementiren] all the friendly pieces; and since one already stands upon the enemy''s flank and has
    forced him back from [uncertain: his main attack], the victory would infallibly remain with Your Serene
    Highness. For the present I mean only to work a few days on account of the 7000 Rthl, so that the
    Nidernhall affair may be happily concluded. The Minister has departed; he has received a snuff-box'
- page: 3
  en: 'worth several thousand [uncertain: vlld], with which lay a very fine letter. For the rest, neither
    Your Serene Highness nor I owe him any thanks — the good man — has [text lost] for nobody has done
    nothing but — Your Serene Highness, however, [may have] the grace to receive him kindly, to believe
    everything — but tell him plainly that You see they mean to vex You and in secret [illegible] You
    would no longer endure this, but from now on would say straight out what You thought and open the
    King''s eyes directly. I have suffered much these days; my frankness and straightforwardness [illegible]
    many a villain shuns. The Colonel v. Köckritz is a worthy, upright man; he alone has disposed the
    truly good King in Your Serene Highness''s favour — and has explained matters to the honest Cabinet
    Councillor B. more uprightly than all the rest — In deepest reverence I remain, until death, Your
    Most Serene Highness''s Berlin, 18th December 1798. Faithful most humble and obedient Your v Triebenfeld'

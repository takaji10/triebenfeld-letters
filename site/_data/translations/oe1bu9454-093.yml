- page: 2
  en: 'I gave this letter (which remains merely a plan, inasmuch as I received it too late), together
    with the P[ro] M[emoria], to Colonel von Köck[ritz], and he has had the kindness to lay it before
    His Majesty today. In this Pro Memoria, however, I have made the offer, on my own part, that if Polajewo
    should stand in the way of the matter, I would take these estates in lease for 30 years — and at the
    same time build 6 peasant holdings every year out of my own means — clear all waste grounds at my
    own cost — pay 20000 Rthl. rent yearly — and, at the expiry of the lease years, make good whatever
    of the yield of 20000 Rthl should not be shown. This heavy battery, it is thought, would at one stroke
    dismantle all the friendly pieces, and since one already stood upon the enemy''s flank, having pushed
    him away from the main April, the victory would infallibly remain with Your Serene Highness. For the
    present I mean only to work a few days on account of the 7000 Rthl, so that the Niedernhall matter
    may be happily concluded.


    The Minister has departed; he has received a snuff box'

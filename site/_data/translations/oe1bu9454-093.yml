- page: 2
  en: 'I have given this letter (which will remain no more than a plan, since I received it too late),
    together with the Pro Memoria, to the Colonel von Köch:, and he has had the kindness to lay it before
    His Majesty today. In this Pro Memoria, however, I have made the offer on my own part that, if Polajewo
    should stand in the way of the matter, I would take these estates on lease for 30 years — at the same
    time building six peasant farms every year out of my own means — clearing all waste grounds at my
    own cost — paying 20000 Rthl of rent annually — and, at the end of the lease years, making good whatever
    of the yield of 20000 Rthl could not be shown. This heavy battery, it is thought, would at one stroke
    [uncertain: elementiren] all the friendly pieces, and since one already stood on the enemy''s flank
    and had pressed him away from the main [uncertain: April], the victory would infallibly remain with
    Your Serene Highness. For the present I mean only to work a few days on the matter of the 7000 Rthl,
    so that the Niedernhall affair may be happily concluded.


    The Minister has departed; he has received a snuffbox'

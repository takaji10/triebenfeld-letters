- page: 3
  en: 'worth several thousand [uncertain: gulden], with a very fine letter enclosed.


    For the rest, neither Your Serene Highness nor I owe him any thanks — the good man — has done nothing
    for anyone but — yet let Your Serene Highness have the grace to meet him handsomely, to believe everything
    — but tell him straight out that you see that people mean to vex you and secretly [illegible] you
    — that you would no longer endure this, but from now on would say straight out what you thought, and
    would open the King''s eyes to his face. I have suffered much these days; my openness and straightforwardness
    [illegible] many a villain does shrink from it after all — Colonel von Köckritz is a worthy, upright
    man; he alone has disposed the truly good King in Your Serene Highness''s favour — and has explained
    matters to the honest Mr Cabinet Councillor B[eyme] more uprightly than all the others —


    In deepest [uncertain: esteem] I remain, until death,


    Your Most Serene Highness''s


    Berlin, 18th December 1798.


    faithful and most humble and obedient [uncertain: servant]


    v Triebenfeld'

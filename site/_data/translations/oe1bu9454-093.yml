- page: 1
  en: 'Most Serene Prince


    Most gracious Lord!


    To Your Most Serene Highness I transmit herewith the All-Highest letter which has issued upon the
    last petition. I hope that the same will have answered Your Highness''s wishes. This very day the
    Minister von Struensee had to lay all the files before His Majesty; it now remains to be awaited whether
    everything will be duly gone into.


    The truly upright Colonel von K., who commends himself most respectfully to Your Serene Highness,
    promises the most desirable outcome of the matter.


    H. C. H. Beym is indeed mightily preoccupied; still, he is too upright and open a man, and therefore
    I fear nothing from that side.


    The honest councillor of war von Cöln has set the matter out quite well, as Your Serene Highness will
    gather from the enclosure.'

- page: 3
  en: 'worth several thousand [uncertain: vlld], with which a very fine letter was enclosed.


    For the rest, neither Your Serene Highness nor I owe him any thanks — the good man — has done nothing
    for anyone except – but may Your Serene Highness have the grace to meet him handsomely, to believe
    everything — yet tell him plainly that You see one wishes to vex You, and in secret [illegible] that
    You would endure this no longer, but would from now on say straight out what You thought and open
    the King''s eyes directly. I have suffered much these days; my openness and straightforwardness [illegible]
    many a villain does shy from it. Colonel von Köckritz is a worthy, upright man; he alone has disposed
    the truly good King in Your Serene Highness''s favour – and has explained matters to the honest cabinet
    councillor B. more uprightly than all the others — In deepest reverence I remain, until death, Your
    Most Serene Highness''s


    Berlin, 18th December 1798.


    Most loyally and humbly Your


    von Triebenfeld'

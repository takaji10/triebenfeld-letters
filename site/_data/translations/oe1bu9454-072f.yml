- page: 4
  en: 'we shall bring what ready money is possible; concerning the matter Your Serene Highness will learn
    nothing further. More to write of I am very [uncertain: loth] — the distress is boundless. I suffer
    the greatest of it with my children. I have had to employ every means to save the estates for myself,
    for they would have been lost for ever had the worthy sequestrator maintained himself in them. As
    soon as this plague of the land ceases and I am restored to health I shall [uncertain: act], and I
    hope to God that, however dreadful everything looks, I shall nevertheless preserve all and remove
    the distress. It is in the deepest reverence that I, respectfully, remain, until death,


    Your Serene Highness''s — Honrichs will most likely be arrested one of these days. He was patented
    far beyond the estates here — but has embezzled dues and committed other frauds. Forgive, Your Serene
    Highness,


    my scrawl


    I have had to spend some 4 hours


    in getting it down.


    Kopojno


    22nd May 1812  most humble and obedient servant v. Triebenfeld'

- page: 2
  en: 'to Schlawenschitz with him. I begged of him to settle the deliveries out of it and to hand over
    the receipts for them as rent, so that we might only get the sequestration off our necks and save
    the estates; the noble Brzechsta was at once ready for this — the sequestrator has these few days
    been recalled and placed under observation on account of various [uncertain: proceedings]. I, however,
    had vexed myself so frightfully over all these adverse events that I fell into a bilious fever, and
    lying wretchedly with it I got, a fortnight ago, the worst gout in both feet, and now lie already
    many weeks like a [uncertain: Erquilett] under the most raging pains. Daily since [uncertain: March]
    there is quartering here, often there are 20 officers with their servants to be fed; the day before
    yesterday, [uncertain: poor me], 62 persons to be fed. The people are coarse; if one does not give,
    they take everything away by force. The subjects have run off, because they themselves have nothing,
    the houses stand empty, and if the estate owner will not be exposed to the most terrible maltreatment,
    and have his cattle, horses and sheep taken from him, then he must provide richly himself. One nobleman
    they have murdered, others they have regulated with a hundred [uncertain: and more] strokes of the
    cudgel, one [uncertain: Vod] they hid [text lost] struck dead on the spot'

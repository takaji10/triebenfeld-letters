- page: 1
  en: 'Most gracious Prince and Lord!


    Several weeks ago, when I was on the point of travelling to Schlawenschitz with Mr. D. Bræckl., word
    was sent to us at Blizanow that an exorbitant delivery of grain and straw had been announced upon
    the Zagorowo estates, under frightful threats. I [uncertain: applied] against this to the Upper Prefecture
    at Kalisz and received a refusal in answer; I begged that execution be laid upon the peasants etc.
    and that a part of the arrears of rent be collected in, in order to pay for the delivery as well as
    the dues; this was again refused with the observation that the inhabitants must be spared, because
    they likewise have to deliver much, to furnish much carting-service, and to feed the foreign troops
    passing through. Scarcely had I received this resolution when I received by express the news that
    the estates had again been taken under sequestration. I hastened here at once to save the estates
    out of the claws of the sequestrator, for the fellow would have reckoned ten times as much again for
    the victualling of the troops, where here on many a day


    30, 40, or more officers, not counting their men, have to be fed by the lordship for nothing, and
    would have delivered up no supply at all. The [uncertain: Siedern] sub-prefect had 2000 Rthl lying
    by, which he wished to [text lost] bring along through'

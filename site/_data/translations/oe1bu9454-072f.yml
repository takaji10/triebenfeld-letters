status: draft
segments:
- page: 1
  en: 'Most gracious Prince and Lord!


    Several weeks ago, when I was on the point of travelling to Sławięcice with Mr von Brzechffa, word
    was brought to us at Blizanow that an [uncertain: exorbitant] delivery of grain and straw had been
    announced to the Zagórów estates under dreadful threats. I [uncertain: turned] against this at the
    Upper Prefecture at Kalisz and received a refusing answer; I begged that execution be laid upon the
    peasants etc. and that a part of the arrears of interest be levied, in order to pay both the delivery
    and the dues; this was again refused with the observation that the inhabitants must be spared, because
    they likewise have much to deliver, must furnish much team-service, and must feed the foreign troops
    passing through. Scarcely had I received this resolution when I received by express the news that
    the estates had again been taken under sequestration; I hurried here at once to rescue the estates
    from the sequestrator''s claws, for the fellow would have reckoned ten times as much again for the
    victualling of the troops — where many a day here


    30, 40, or more officers, apart from their men, must be fed gratis by the lordship — and would have
    carried off no delivery at all. The worthy sub-prefect had 2000 rt lying ready which he [text lost]
    through'
- page: 2
  en: 'wished to bring with him to Sławięcice; I begged him to settle the deliveries out of it and to
    hand over the receipts for them as lease-money, so that we might only be rid of the sequestration
    and save the estates; the noble Brzechffa was at once ready to do so — the sequestrator was recalled
    some days since and, on account of various offences, taken under observation. But I had vexed myself
    so dreadfully over all these adverse events that I fell into a bilious fever; lying wretched in it,
    a fortnight ago I got the worst podagra in both feet, and now for many weeks I have lain like a [uncertain:
    skeleton] under the most raging pains. Daily since 8[illegible] there has been billeting here; often
    there are 20 officers with their servants to be fed; the day before yesterday there were a poor 62
    persons to be fed. The people are coarse; if one does not give, they take everything away by force.
    The subjects have run off, because they themselves have nothing; the houses stand empty, and if the
    proprietor of the estate will not be exposed to the most frightful maltreatment, and have his cattle,
    horses and sheep taken from him, he must himself provide richly. Some noblemen have been murdered,
    others settled with a hundred [uncertain: Arspiegel], a sub-prefect beaten dead on the spot'
- page: 3
  en: 'God knows what will come of it and how long this dreadful plague will yet last — Here all would
    be lost were it not for the honest Brzechffa. I lie wretched, have not a Groschen of money and nowhere
    to take any from; the subjects even on my own estates have fled and [uncertain: sip] live in the woods
    on herbs and roots. [uncertain: Nothing can be brought in] since they take away everything to drink
    and all horses from nobleman and peasant alike; [text lost] and brandy is not sold, no one has any
    longer a Groschen to drink away, and what can be distilled and brewed scarcely suffices for the troops
    — In short, the distress has reached its highest pitch. Until the first of [uncertain: June] this
    scourge of the land is to last — then I shall treat with the sub-prefect. Nor can anything be done
    until then, since all the courts of justice are at rest. The [uncertain: Werbizer] peasants have gone
    to Warsaw to the court of cassation; I must await the decree. Likewise I am awaiting the decision
    concerning [uncertain: Olleinue]. If that is decided, [uncertain: ſorrechſta] will have his money
    by Midsummer, which is to be paid out to him in the sum of 10000 rt, and so I shall come at Midsummer
    with him to Your Serene Highness'
- page: 4
  en: 'we shall bring what ready money is possible; concerning the [illegible] matter Your Serene Highness
    will learn the rest. More particulars I do not much care [illegible] — the distress is boundless —
    I suffer the greatest of it with my children — I had to employ every means to save the estates for
    myself, for they would have been lost for good had the worthy sequestrator kept his hold in them.
    As soon as this scourge of the land here ceases and I am restored, I shall act, and I hope to God
    that, however frightful everything looks, I shall nevertheless preserve it all and remove the distress.
    It is in the deepest reverence that, full of respect, I remain, until death,


    Your Serene Highness''s — Honrichs will most likely be arrested one of these days. He had been commissioned
    as far as over the estates here — but has embezzled dues and committed other frauds. Forgive, Your
    [text lost]


    my scrawl


    I have had to spend


    some 4 hours over it.


    Kopojno


    22nd May 1812


    most humble and obedient servant


    v Triebenfeld'

- page: 3
  en: 'God knows what will come of it and how long this frightful plague will yet last — Here all would
    be lost were it not for the honest Brzechsta. I lie wretched, have not a Groschen of money, nowhere
    to get any from; the subjects even on my own estates have fled and live in the woods on herbs and
    roots. Nothing can be brought in, since from nobleman and peasant alike they take away all drink and
    horses; no brandy is sold, no one has a Groschen more to drink away, and what can be distilled and
    brewed scarcely suffices for the troops — in short, the distress has reached its highest pitch. This
    plague of the land is to last until the first of June — then I shall treat with the sub-prefect. Nor
    can anything be [uncertain: done] until then, for all the courts of justice are at a standstill. The
    Werbizer peasants have gone to [uncertain: Warenham] to the court of cassation; I must await the decree.
    Likewise I am awaiting the decision concerning [uncertain: Olleinue]. Once this is decided, Brzechsta
    will receive his money against Johann, which is to be paid out to him with 10000 Rthl, and then at
    Midsummer I shall come with him to Your Serene Highness'

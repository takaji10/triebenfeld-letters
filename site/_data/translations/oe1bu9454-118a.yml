- page: 2
  en: 'This Nerlich has for this purchase 80000 Rthl in cash, which he can pay out in full within one
    year.


    Kunckel is willing to bring this about, in order to earn more thereby than with the colonists.


    May Your Most Serene Highness only most graciously instruct me how I am to handle the matter.


    Walichnowski has just now written; he wishes to know in detail what he is to give, so that he may
    not incur unnecessary travel expenses. But apart from that, a certain Urbanowski has sent by express
    for the Trąbczyn valuation. He promises certainly to come and to bring a good deal of money with him
    at once — should he come sooner than Walichnowski, I shall conclude with him according to the instruction
    given me.


    In [uncertain: dearest] respect I remain, until death,


    Your Most Serene Highness''s


    Breslau, the 10th of February 1804.


    most faithful servant


    v. Triebenfeld'

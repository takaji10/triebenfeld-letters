- page: 1
  en: '118


    Most Serene Prince


    Most gracious Prince and Lord!


    At this very moment a certain Kunkel presented himself to me with 2 colonists from Oleśnica.


    The people are willing to pay 1500 Rthl, but in return wish to have a contract executed.


    I have sounded these men out and sought to examine whence they mean to take the monies for the payment
    of the 17000 Rthl due at Martinmas and Midsummer. They are, as I find, fortune-seekers who build upon
    shallow speculations, who in the end will not be able to pay, and with whom one will get endless lawsuits.


    Should Your Most Serene Highness nevertheless command that a contract be concluded with these people,
    [uncertain: despite] these gloomy prospects, then I shall have the contract drawn up and shall hold
    them here until Your Most High return. For the rest, I have already brought Kunkel to such a disposition
    that he will let the matter be turned as shall be most suitable to Your Most Serene Highness''s interest.


    Kunkel has a commission from a certain Chief District Steward Nerlich, that he is to procure for him
    Trąbczyn or Zagórów in hereditary lease.'

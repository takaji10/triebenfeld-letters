- page: 1
  en: 'Most Serene Prince


    Most gracious Prince and Lord!


    At this very moment a certain Kunckel presented himself to me with 2 colonists from Olesnica.


    The people are willing to pay 1500 Rthl, but on condition that a contract be executed.


    I have [uncertain: sounded out] these persons and sought to examine where they mean to take the monies
    for the payment of the 17000 Rthl at Martinmas and Midsummer. They are, as I find, soldiers of fortune
    who build upon shallow speculations, who in the end will not be able to pay, and with whom one will
    get endless lawsuits.


    Should Your Most Serene Highness nevertheless command that, despite these gloomy prospects, a contract
    is to be concluded with these people, I shall have the contract drawn up and shall hold them until
    Your Highness''s most exalted return. For the rest, I have already disposed Kunckel so that he will
    let the matter be turned as will be most suitable to Your Most Serene Highness''s interest.


    Kunckel has a commission from a certain chief district steward Nerlich, that he is to procure for
    him Trąbczyn or Zagorow on hereditary lease.'

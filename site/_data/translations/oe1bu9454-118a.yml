- page: 2
  en: 'Nerlich has 80000 Rthl in cash for this purchase, which he can pay out in full within one year.


    Kunkel is willing to bring this about, in order to earn more by it than by the colonists.


    May Your Most Serene Highness deign most graciously to instruct me how I am to handle the matter.


    Walichnowski has just written and wishes to know in detail what he is to give, so that he may incur
    no unnecessary travelling costs. Otherwise, however, a certain Urbanowski has sent by express for
    the Trąbczyn valuation. He promises for certain to come and to bring a good deal of money with him
    at once — should he come sooner than Walichnowski, then I shall conclude with [uncertain: him] according
    to the instruction given me.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Wrocław, the 10th of February 1804.


    most faithful servant


    v Triebenfeld'

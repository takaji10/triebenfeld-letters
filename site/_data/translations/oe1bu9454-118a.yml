status: draft
segments:
- page: 1
  en: Most Serene Prince, Most gracious Prince and Lord! This very moment a certain Kunckel presented
    himself to me with 2 colonists from Olesnica. The people are willing to pay 1500 Rthl, but in return
    wish to have a contract executed. I have sounded out the men and sought to examine whence they mean
    to take the monies for payment of the 17000 Rthl at Martinmas and Midsummer. They are, so far as I
    find, soldiers of fortune who build upon shallow speculations, who in the end will not be able to
    pay, and with whom one will be landed in endless lawsuits. Should Your Most Serene Highness nevertheless
    command that a contract be entered into with these people, notwithstanding these gloomy prospects,
    then I shall have the contract drawn up and hold them off until Your Highness's most exalted return.
    For the rest, I have already brought Kunckel to such a disposition that he will let the matter be
    turned in whatever way shall be most conformable to Your Most Serene Highness's interest. Kunckel
    has a commission from a certain Head Bailiff Nerlich, that he is to procure for him Trąbczin or Zagorow
    in hereditary lease.
- page: 2
  en: This Nerlich has for this purchase 80000 Rthl in cash, which he can pay out in full within one year.
    Kunckel is willing to effect this, in order thereby to earn more than with the colonists. May Your
    Most Serene Highness only be pleased most graciously to instruct me how I am to handle the matter.
    Walichnowski has written just now, and wishes to know in detail what he is to give, so that he may
    incur no unnecessary travelling expenses. Otherwise, however, a certain Urbanowski has sent by express
    for the Trąbczin valuation. He promises certainly to come and to bring a good deal of money with him
    at once — should he come sooner than Walichnowski, I shall conclude with him according to the instruction
    given me. In deepest respect I remain, until death, Your Most Serene Highness's Breslau, the 10th
    February 1804. most faithful servant v Triebenfeld

segments:
- page: 1
  en: 'received 22 April 1803


    The Government at Poznań having sent in the files of the confiscation proceedings against the former
    Starost Anton von Prusimski and the canon von Jezierski, I do not fail to communicate them to Your
    Excellency herewith in 6 volumes, together with the draft of the joint report required by His Majesty
    the King, with the most obedient request that, should you have nothing to remark against the latter,
    you kindly countersign it, have the fair copy made and sent to me for my co-signature, and be so good
    as to return the draft and the files to me.


    Berlin, 22 April 1803.


    Goldbeck


    To His Royal Actual Privy State, War and Cabinet Minister and directing Minister of Finance, Count
    von Haugwitz, Excellency'

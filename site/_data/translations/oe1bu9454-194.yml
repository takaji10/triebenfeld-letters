- page: 2
  en: 'As for Honrichsen, I have asked the prefecture to suspend him, to take all his goods into attachment,
    and to have whatever is lacking made good out of his security; and then to apply the 11700 Rthl which,
    according to Heckert''s report, he is said to owe, to the payment of the arrears of interest, so that
    the matter may be brought clear. The sub-prefect Brzechsta furnished the security for him; he has
    taken much money out of the estates, and in the end gave Honrichs [uncertain: certificates] that everything
    with him was in order.


    He appointed Honrichs, has protected him hitherto, lied to the Chief Prefect and given false certificates;
    without Your Serene Highness having to do the least thing in the matter, the Chief Prefecture must
    see to it that all the deficits are paid, whether by Honrichs or by Brzechsta.


    The remainder I shall have the honour of laying before Your Serene Highness by word of mouth.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Kontop


    the 22nd of April


    1810


    faithful, humble and obedient servant


    v. Triebenfeld'

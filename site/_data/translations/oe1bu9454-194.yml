- page: 2
  en: 'I have asked the Prefecture to suspend Honrichs, to place all his goods under seizure, and to have
    whatever is wanting made good out of his security, and then to apply the 11700 Rthl which, according
    to Hecker''s report, he is said to owe, to the payment of the arrears of interest, so that the matter
    may be brought clear — the sub-prefect Brzechffa stood the security for him; he has taken much money
    out of the estates, and in the end gave Honrichs attestations that everything with him was in order.


    He appointed Honrichs, has protected him hitherto, lied to the Upper Prefecture and given false attestations;
    without Your Serene Highness doing the least thing in the business, the Upper Prefecture must see
    to it that all the deficits are paid, whether by Honrichs or by Brzechffa.


    The rest I shall have the honour of laying before Your Serene Highness by word of mouth. In deepest
    reverence I remain, until death,


    Your Most Serene Highness''s


    Konotop


    the 22nd of April


    1810


    faithful, humble and obedient servant


    v Triebenfeld'

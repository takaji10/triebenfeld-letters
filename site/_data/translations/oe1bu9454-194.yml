status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord! I have already reported to Your Most Serene Highness that
    I shall be coming to Schlawentschitz. I would be there even now, were a new trouble not holding me
    fastened here. It is the matter of the Invalids'' Fund; this receives no interest, it presses upon
    me that I am to pay it anew, indeed demands the whole capital, and intends, should it not obtain this,
    to have my estates put to judicial auction — It has brought suit, and on the 26th the hearing is set,
    which I must await, and after it has been held I shall depart from Glogau. In Poland the matter stands
    better; before the Court of Peace the vindicatio of the Trąbczyner estates has turned out to [uncertain:
    our] advantage — and the matter, with the [uncertain: gnüßigten] report, referred from the Tribunal
    to Kalisz — For the rest, Your Serene Highness is secured there. The King of Saxony grants an indulgence
    of 10 years, with the provision that each year the 10th part of the debt is to be discharged — It
    has not yet been brought to publicity — but it will appear these next days. Behind this shelter I
    shall likewise take flight with the Invalids'' affair, for the capital is entered there, and Hecker
    as well as the Prefecture must see to the collection and repayment of the moneys. Should it succeed
    with Weigel, then he too will obtain his satisfaction; only he must know nothing of the indulgence
    beforehand.'
- page: 2
  en: As for Honrichsen, I have asked the Prefecture to suspend him, to place all his goods under attachment,
    and to have whatever is wanting made good out of his security; and thereupon to apply the 11700 Rthl
    which, according to Hecker's report, he is said to owe, to the payment of the interest in arrears,
    so that the matter is brought to a clear footing. The sub-prefect Brzechsta stood security for him;
    he has taken much money out of the estates and in the end gave Honrichs attestations that everything
    with him was in order. He appointed Honrichs, has protected him hitherto, lied to the Chief Prefect
    and given false attestations; without Your Serene Highness doing the least thing in the matter, the
    Chief Prefecture must see to it that all deficits are paid, whether by Honrichs or by Brzechsta. The
    further particulars I shall have the honour of laying before Your Serene Highness by word of mouth.
    In deepest reverence I remain, until death, Your Most Serene Highness's Kontop, the 22nd of April
    1810, faithful, humble and obedient servant v Triebenfeld

segments:
- page: 1
  en: '194


    Most Serene Prince,


    Most gracious Lord!


    I have already reported to Your Most Serene Highness that I shall be coming to Sławięcice. I should
    be there even now, were a new trouble not keeping me fettered here.


    It is the matter of the Invalids'' Fund: it receives no interest, it presses upon me that I should
    pay it anew, it even demands the whole capital, and intends, if it does not obtain this, to have my
    estates [uncertain: Sub hästerin] — It has brought suit, and the hearing is set for the 26th; this
    I must await, and after its holding I shall depart from Głogów. In Poland the matter stands better:
    before the court of the peace the vindication of the Trąbczyn estates has turned out to the greatest
    advantage — and the case, with the [uncertain: gnüßigten] report, has been referred from the Tribunal
    to Kalisz — For the rest, Your Serene Highness is secured there. The King of Saxony is granting an
    indult for 10 years, with the [uncertain: requirement] that every year a tenth part of the debt shall
    be paid off — It has not yet been made public — but it will appear in these next days.


    Behind this [uncertain: bulwark] I shall also take flight with the Invalids business, for the capital
    is entered there, and Hecker as well as the Prefecture must see to the recovery and payment of the
    moneys.


    If it should succeed with Weigel, then [uncertain: he] too will obtain his satisfaction. Only he must
    know nothing of the indult beforehand.'

segments:
- page: 1
  en: 'Most Serene Prince,


    Most gracious Lord!


    I have already reported to Your Most Serene Highness that I shall be coming to Schlawenschitz. I should
    be there even now, were a new trouble not holding me fast here.


    It is the matter of the Invalids'' Fund; this receives no interest, it presses upon me that I should
    pay it anew, demands indeed the whole capital, and if it does not obtain this, intends to have my
    estates put up for compulsory auction. — It has brought suit, and on the 26th the hearing stands appointed;
    this I must await, and after it has been held I shall depart from Glogau. In Poland the matter stands
    better: before the court of peace the recovery action (vindicatio) for the Trąbczyn estates has turned
    out to the [uncertain: eastern] advantage — and the matter has been referred, with the [uncertain:
    gracious] report from the Tribunal, to Kalisz. — For the rest, Your Serene Highness is secure there.
    The King of Saxony grants an indulgence for 10 years, with the [uncertain: requirement] that every
    year the 10th part of the debt shall be paid off. — It has not yet been made public — but it will
    appear in these coming days.


    Behind this protection I shall also take flight with the affair of the Invalids, for the capital is
    entered there, and Hecker as well as the prefecture must see to the collection and repayment of the
    monies.


    If it should succeed with Weigel, then he too will obtain his satisfaction. Only he must not know
    beforehand anything of the indulgence.'

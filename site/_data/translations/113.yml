status: draft
segments:
- page: 1
  en: 'Most Serene Prince, Most gracious Lord!


    Your Most Serene Highness has had the grace only to assure me that with the Asch and Gad, in respect
    of the 11000 Rthl, everything is settled, and that I should have no vexation from it. Your Most Serene
    Highness — for then I [do] most humbly for this gracious assurance. Meanwhile I only observe that
    the arrest in this matter still lies against me here, and that here they have given out the [uncertain:
    places] that, should Your Most Serene Highness not pay the promised 4000 Rthl, I am to be arrested
    at once. For fear I do not know what I am to do. I am still scraping along in misery — Prince George
    declares himself on nothing and drags my case along the long road. Here I still risk honour, liberty,
    and the losing of my life. Have, Your Most Serene Highness, but this one single grace and settle the
    matter there, so that —'
- page: 2
  en: 'that the [uncertain: building/peasant] does not lay hands upon me, [nor] have me arrested here.
    I should have death upon the spot. Wildegensch has me told that the Asch and Geld would wait until
    Johann — but that would be no rescue for me. — I beg Your Serene Highness, by all that is holy, do
    let the matter be brought clear by means of the 4000 Rthl. If only God helps, and I have creditors
    again, then I will gladly give fortune and salvation.


    In deepest reverence I remain, until death,


    Your Most Serene Highness''s


    Berlin, the 23rd of May 1801


    faithful, most humble and obedient servant


    v Triebenfeld'

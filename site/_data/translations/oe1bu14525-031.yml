- page: 1
  en: 'By the Grace of God, Friedrich Wilhelm, King of Prussia etc. etc.


    Our gracious greeting, Royal favour, and all else that is dear and good which We are able to bestow,
    first of all!


    High-born Prince, kindly beloved cousin, Since Your Lordship has acquired the estate of Trąbczyn with
    its appurtenances from the Treasury, the title of possession must first of all be entered upon the
    same in the mortgage book. We therefore hereby request of Your Lordship that to this end you submit,
    within 4 weeks, a certified copy of the judgment by which the entire property of Anton von Prusimski
    was adjudged to the Treasury, together with an attestation of the competent court that the judgment
    has entered into legal force. We remain well disposed toward Your Lordship with Royal favour and friendship.
    Given at Kalisz, the 28th of December 1798.


    Royal South Prussian Government, Meuser[illegible]


    To the Prince of Hohenlohe-Ingelfingen


    H. A. R. Lucas Schleyer


    No. 3459'

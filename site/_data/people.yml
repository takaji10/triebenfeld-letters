  life: "1743-1815"
  life_de: "1743-1815"
  bio: "Baron, Prussian minister for East Prussia and for New East Prussia, the northern part of Prussia's share of Poland. In 1797 he passed the news that Antoni Prusimski, the exiled owner of Trąbczyn, was at Venice on to Count Hoym, minister for South Prussia, not knowing in which province Prusimski's estates lay."
  bio_de: "Friedrich Leopold Freiherr von Schroetter, preußischer Minister für Ostpreußen und für Neuostpreußen, den nördlichen Teil des preußischen Anteils an Polen. 1797 gab er die Nachricht über Prusimski in Venedig an Hoym weiter, da er nicht wusste, in welcher Provinz Prusimskis Güter lagen."
  span: "1796–1797"
  letters: [{id: "2", uid: "ihagrrep7cnr1414-2", url: "/documents/ihagrrep7cnr1414/2/", unit_label: "I. HA GR, Rep. 7 C, Nr. 1414", n: 1}, {id: "1", uid: "ihagrrep7cnr1414-1", url: "/documents/ihagrrep7cnr1414/1/", unit_label: "I. HA GR, Rep. 7 C, Nr. 1414", n: 1}, {id: "3", uid: "ihagrrep7cnr1414-3", url: "/documents/ihagrrep7cnr1414/3/", unit_label: "I. HA GR, Rep. 7 C, Nr. 1414", n: 1}]

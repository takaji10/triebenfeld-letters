  life: "1744-1816"
  life_de: "1744-1816"
  bio: "Prussian minister of justice, to whom Count Hoym sent the grants of confiscated estates of 1796 to be made out. In January 1802 Michalina Prusimska's petition to the King was passed to him to hasten her appeal against Prince Hohenlohe-Ingelfingen; he had her told that the appeal judgment had been sent back to be published."
  bio_de: "Eberhard von der Reck, preußischer Justizminister, dem Hoym die Verleihungen von 1796 zur Ausfertigung zusandte. Im Januar 1802 wurde ihm Michalina Prusimskas Bittschrift an den König zur Beschleunigung ihrer Appellation zugeleitet; er ließ ihr mitteilen, das Appellationsurteil sei zur Verkündung zurückgesandt."
  span: "1796–1802"

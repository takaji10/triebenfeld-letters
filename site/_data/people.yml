  life: "documented 1805"
  life_de: "belegt 1805"
  bio: "A creditor or claimant on whose account money owed to Hohenlohe-Ingelfingen was attached in 1805."
  bio_de: "Ein Gläubiger oder Anspruchsteller, dessentwegen 1805 Gelder Hohenlohe-Ingelfingens mit Arrest belegt wurden."
  span: "1805"
  letters: [{id: "154", uid: "oe1bu9454-154", url: "/documents/oe1bu9454/154/", n: 3}]
- slug: "malachowski"
  name: "Małachowski"
  heading: "Małachowski, Stanisław"
  heading_de: "Małachowski, Stanisław"
  count: 5
  docs: 4
  life: "1736-1809"
  life_de: "1736-1809"
  bio: "Stanisław Małachowski, president of the Governing Commission, the provisional Polish government that Napoleon set up in January 1807. The commission's resolution of 21 July 1807, which returned the confiscated Prusimski estates to Michalina Dąbska, was issued under his name, and her petition to the Emperor was addressed to him."
  bio_de: "Stanisław Małachowski, Präsident der Regierungskommission, der provisorischen polnischen Regierung, die Napoleon im Januar 1807 einsetzte. Der Beschluss der Kommission vom 21. Juli 1807, der die konfiszierten Güter der Prusimski an Michalina Dąbska zurückgab, erging unter seinem Namen, und ihre Bittschrift an den Kaiser war an ihn adressiert."
  span: "1807"
  letters: [{id: "1", uid: "agad1174016-1", url: "/documents/agad1174016/1/", n: 1}, {id: "2", uid: "agad1174016-2", url: "/documents/agad1174016/2/", n: 1}, {id: "1", uid: "agad11740273-1", url: "/documents/agad11740273/1/", n: 1}, {id: "3", uid: "agad11740273-3", url: "/documents/agad11740273/3/", n: 2}]

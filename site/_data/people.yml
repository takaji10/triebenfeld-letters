- slug: "niemojewski"
  name: "Niemojewski"
  heading: "Niemojewski"
  heading_de: "Niemojewski"
  count: 6
  docs: 3
  life: "documented 1807-1818"
  life_de: "belegt 1807-1818"
  bio: "General Niemojewski, who in 1807 recovered an estate that Prussia had confiscated and given away, free of debt. The Warsaw report of 1818 cites his case in support of Michalina Miączyńska."
  bio_de: "General Niemojewski, der 1807 ein von Preußen konfisziertes und verschenktes Gut schuldenfrei zurückerhielt. Der Warschauer Bericht von 1818 führt seinen Fall zugunsten der Michalina Miączyńska an."
  span: "1807–1818"

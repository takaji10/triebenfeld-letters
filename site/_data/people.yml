- slug: "prusimska-katarzyna"
  name: "Katarzyna Prusimska, born Rozdrażewska"
  heading: "Prusimska, Katarzyna (born Rozdrażewska)"
  heading_de: "Prusimska, Katarzyna (geb. Rozdrażewska)"
  count: 7
  docs: 6
  life: "documented 1754-1782"
  life_de: "belegt 1754-1782"
  bio: "Katarzyna Prusimska, born Rozdrażewska, widow of Paweł Prusimski, who held Trąbczyn for life after his death. In 1754 she had the estate inspected, building by building. In 1763 she was at law with Stanisław Ścibor Chełmski of Łukomia before the land court at Konin over potash he had stopped at Pyzdry in 1761."
  bio_de: "Katarzyna Prusimska, geborene Rozdrażewska, Witwe des Paweł Prusimski, die Trąbczyn nach seinem Tod auf Lebenszeit innehatte. 1754 ließ sie das Gut Gebäude für Gebäude besichtigen. 1763 stand sie vor dem Landgericht in Konin im Rechtsstreit mit Stanisław Ścibor Chełmski von Łukomia um Pottasche, die er 1761 in Pyzdry angehalten hatte."
  span: "1754–1782"
  letters: [{id: "1", uid: "app53170koningr136-1", url: "/documents/app53170koningr136/1/", n: 1}, {id: "1", uid: "app536045-1", url: "/documents/app536045/1/", n: 2}, {id: "1", uid: "app53170koningr115-1", url: "/documents/app53170koningr115/1/", n: 1}, {id: "7", uid: "app53170koningr117-7", url: "/documents/app53170koningr117/7/", n: 1}, {id: "8", uid: "app53170koningr117-8", url: "/documents/app53170koningr117/8/", n: 1}, {id: "14", uid: "app53170koningr118-14", url: "/documents/app53170koningr118/14/", n: 1}]
- slug: "prusimska"
  name: "Michalina z Prusimskich Dąbska, later Miączyńska"
  heading: "Prusimska, Michalina (married Dąbska, later Miączyńska)"
  heading_de: "Prusimska, Michalina (verh. Dąbska, später Miączyńska)"
  count: 103
  docs: 57
  life: "documented 1800-1830"
  life_de: "belegt 1800-1830"
  bio: "Michalina Prusimska, only child of the Starost Antoni Prusimski, whose confiscated estates were granted to Hohenlohe-Ingelfingen in 1796. In 1800, still a minor and through a guardian, she sued Hohenlohe-Ingelfingen before the Government at Poznań for the Brzyce estates, her late mother's property; judgment was given on 9 December 1800, and in January 1802 she wrote to the King from Dresden, as a forsaken orphan, asking him to hasten the appeal. In 1807 a commission of the Duchy of Warsaw gave Trąbczyn and Kamionna back to her. She appears under her married names Dąbska and, from about 1814, Miączyńska, which the letters also write Moscinska."
  bio_de: "Michalina Prusimska, einziges Kind des Starosten Antoni Prusimski, dessen konfiszierte Güter 1796 an Hohenlohe-Ingelfingen verliehen wurden. 1800 klagte sie, noch minderjährig und durch einen Vormund, vor der Regierung in Poznań (Posen) gegen Hohenlohe-Ingelfingen auf die Güter Brzyce, das Vermögen ihrer verstorbenen Mutter; am 9. Dezember 1800 wurde geurteilt, und im Januar 1802 bat sie den König aus Dresden als verlassene Waise, die Appellation zu beschleunigen. 1807 gab ihr eine Kommission des Herzogtums Warschau Trąbczyn und Kamionna (Kaemen) zurück. Sie erscheint unter ihren Ehenamen Dąbska und, seit etwa 1814, Miączyńska, in den Briefen auch Moscinska geschrieben."
  span: "1800–1830"

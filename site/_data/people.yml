  bio: "Buyer of the estate of Witów from Prince Hohenlohe-Ingelfingen in 1805, for 20,000 Reichsthaler and a yearly payment. The Prince's agent, Triebenfeld, later sued him for unpaid purchase money and rent."
  bio_de: "Franz Meierowitz kaufte 1805 das Gut Witów (Wittow) für 20.000 Rthl und eine jährliche Abgabe. Triebenfeld verklagte ihn später wegen rückständigen Kaufgelds und Zinses."

  bio: "Major general, given the confiscated estates of Duninów in 1796 by the same order that gave Prince Hohenlohe-Ingelfingen the Prusimski estates. Presumably Gebhard Leberecht von Blücher, the later field marshal, whose dates are given here."
  bio_de: "Generalmajor von Blücher, dem 1796 durch dieselbe Order wie Hohenlohe-Ingelfingen die konfiszierten Güter Duninów verliehen wurden. Vermutlich Gebhard Leberecht von Blücher, der spätere Feldmarschall, dessen Lebensdaten hier stehen."

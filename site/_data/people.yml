  relevant_rank: 11
  life: "documented 1797-1803"
  life_de: "belegt 1797-1803"
  bio: "Canon of Włocławek and parish priest at Neustadt, who helped Antoni Prusimski raise the Kuyavian insurrection of 1794 and fled with him. In 1803 the King gave the two leave to return from Dresden, without restoring their property. In 1807 he took over Trąbczyn as the agent of Prusimski's daughter Michalina."
  bio_de: "Domherr von Włocławek und Pfarrer in Neustadt, der Antoni Prusimski 1794 half, den kujawischen Aufstand zu entfachen, und mit ihm floh. 1803 erlaubte der König beiden die Rückkehr aus Dresden, ohne ihnen ihr Vermögen zurückzugeben. 1807 übernahm er Trąbczyn als Bevollmächtigter von Prusimskis Tochter Michalina."
  span: "1797–1803"

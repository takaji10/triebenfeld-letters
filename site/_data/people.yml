- slug: "haugwitz"
  name: "Christian von Haugwitz"
  heading: "Haugwitz, Christian von"
  heading_de: "Haugwitz, Christian von"
  count: 10
  docs: 6
  life: "1752-1832"
  life_de: "1752-1832"
  bio: "Count Christian von Haugwitz, Prussian foreign minister until 1806. He signed the letter of January 1797 by which the department of foreign affairs told the other ministers that Antoni Prusimski was at Venice. Triebenfeld mentions him among the ministers in Berlin."
  bio_de: "Graf Christian von Haugwitz, preußischer Außenminister bis 1806. Er unterzeichnete das Schreiben vom Januar 1797, mit dem das Departement der auswärtigen Angelegenheiten den anderen Ministern mitteilte, dass Antoni Prusimski in Venedig war. Triebenfeld erwähnt ihn unter den Ministern in Berlin."
  span: "1797–1806"

  heading: "Ludolff"
  heading_de: "Ludolff"
  count: 3
  docs: 2
  life: "documented 1804"
  life_de: "belegt 1804"
  bio: "A councillor who valued the estates of Kamionna and Kolno for a prospective buyer in 1804."
  bio_de: "Ein Rat, der 1804 die Güter Kamionna (Kaemen) und Kolno für einen Kaufinteressenten taxierte."
  span: "1804"
  letters: [{id: "129", uid: "oe1bu9454-129", url: "/documents/oe1bu9454/129/", n: 1}, {id: "135", uid: "oe1bu9454-135", url: "/documents/oe1bu9454/135/", n: 2}]
- slug: "lukomski"
  name: "Łukomski"
  heading: "Łukomski (family)"
  heading_de: "Łukomski (Familie)"
  count: 2
  docs: 1
  life: "documented 1589"
  life_de: "belegt 1589"
  bio: "The family named from Łukom, the estate next to Trąbczyn, which it held in the sixteenth century. In 1589 Thomas Łukomski was sued for building a pond there that flooded the woods and meadows of Trąbczyn."
  bio_de: "Die Familie, die sich nach Łukom nannte, dem Nachbargut von Trąbczyn, das ihr im 16. Jahrhundert gehörte. 1589 wurde Thomas Łukomski verklagt, weil er dort einen Teich angelegt hatte, der Wälder und Wiesen von Trąbczyn überschwemmte."
  span: "1589"
  letters: [{id: "1", uid: "app536017-1", url: "/documents/app536017/1/", n: 2}]
- slug: "luszczewski"
  name: "Łuszczewski"
  heading: "Łuszczewski, Jan Paweł"
  heading_de: "Łuszczewski, Jan Paweł"
  count: 2
  docs: 2
  life: "1764-1812"
  life_de: "1764-1812"
  bio: "Jan Paweł Łuszczewski, secretary general of the Governing Commission in 1807 and afterwards minister of the interior of the Duchy of Warsaw. His name stands with the president's under the commission's order of 12 July and resolution of 21 July 1807."
  bio_de: "Jan Paweł Łuszczewski, 1807 Generalsekretär der Regierungskommission und danach Innenminister des Herzogtums Warschau. Sein Name steht mit dem des Präsidenten unter der Anordnung der Kommission vom 12. Juli und dem Beschluss vom 21. Juli 1807."
  span: "1807"
  letters: [{id: "1", uid: "agad1174016-1", url: "/documents/agad1174016/1/", n: 1}, {id: "2", uid: "agad1174016-2", url: "/documents/agad1174016/2/", n: 1}]

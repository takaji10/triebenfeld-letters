  letters: [{id: "1", uid: "ihagrrep7cnr3570-1", url: "/documents/ihagrrep7cnr3570/1/", n: 6}]
- slug: "drake"
  name: "Drake"
  heading: "Drake"
  heading_de: "Drake"
  count: 1
  docs: 1
  life: "documented 1832"
  life_de: "belegt 1832"
  bio: "A commissioner in the department of state domains at Warsaw. On 29 February 1832 the finance commission charged him with valuing the Trąbczyn estates, so that the loss of the banker Weigel could be reckoned."
  bio_de: "Ein Kommissar in der Abteilung der Staatsdomänen in Warschau. Am 29. Februar 1832 beauftragte ihn die Finanzkommission, die Güter von Trąbczyn zu schätzen, damit der Verlust des Bankiers Weigel berechnet werden konnte."
  span: "1832"
  letters: [{id: "11", uid: "iiihamdaiiinr12367-11", url: "/documents/iiihamdaiiinr12367/11/", n: 1}]
- slug: "lubecki"
  name: "Lubecki"
  heading: "Drucki-Lubecki, Franciszek Ksawery, Prince"
  heading_de: "Drucki-Lubecki, Franciszek Ksawery, Fürst"
  count: 4
  docs: 4
  life: "1778-1846"
  life_de: "1778-1846"
  bio: "Prince Franciszek Ksawery Drucki-Lubecki, minister of finance of the Kingdom of Poland from 1821 to 1830. In September and November 1830 he answered the banker Weigel in person. He found the demand of 63,100 thalers excessive and had the Trąbczyn estates valued, because the court valuation Weigel relied on was made in 1803, when land was dear."
  bio_de: "Fürst Franciszek Ksawery Drucki-Lubecki, von 1821 bis 1830 Finanzminister des Königreichs Polen. Im September und November 1830 antwortete er dem Bankier Weigel selbst. Er hielt die Forderung von 63.100 Talern für überhöht und ließ die Güter von Trąbczyn schätzen, weil die gerichtliche Taxe, auf die Weigel sich stützte, 1803 aufgenommen worden war, als Land teuer war."
  span: "1830–1831"
  letters: [{id: "6", uid: "iiihamdaiiinr12367-6", url: "/documents/iiihamdaiiinr12367/6/", n: 1}, {id: "7", uid: "iiihamdaiiinr12367-7", url: "/documents/iiihamdaiiinr12367/7/", n: 1}, {id: "8", uid: "iiihamdaiiinr12367-8", url: "/documents/iiihamdaiiinr12367/8/", n: 1}, {id: "9", uid: "iiihamdaiiinr12367-9", url: "/documents/iiihamdaiiinr12367/9/", n: 1}]
- slug: "eberhard"
  name: "Eberhard"
  heading: "Eberhard"
  heading_de: "Eberhard"
  count: 43
  docs: 21
  life: "documented 1810-1815"
  life_de: "belegt 1810-1815"
  bio: "Justice commissioner at Brzeg, who acted for Hohenlohe-Ingelfingen in the negotiations with the heirs of the Duke of Courland in 1814 and 1815. Triebenfeld pressed for him to come to Vienna to conclude a settlement."
  bio_de: "Justizkommissar in Brzeg (Brieg), der 1814 und 1815 für Hohenlohe-Ingelfingen mit den Erben des Herzogs von Kurland verhandelte. Triebenfeld drängte darauf, dass er zum Abschluss eines Vergleichs nach Wien komme."
  span: "1810–1815"

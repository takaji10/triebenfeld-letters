- slug: "trampczynski"
  name: "Trąmpczyński (Otto-Trąmpczyński)"
  heading: "Trąmpczyński (family)"
  heading_de: "Trąmpczyński (Familie)"
  count: 5
  docs: 3
  life: "documented 1589-1776"
  life_de: "belegt 1589-1776"
  bio: "The family that held Trąbczyn in the sixteenth and seventeenth centuries and took its name from it, with the by-name Otto. In 1589 Albertus Trąmpczyński sued his neighbour Thomas Łukomski over a pond that flooded his woods. In 1644 four brothers of the family and their widowed mother were condemned by default at the suit of their neighbour Jerzy Chełmski of Łukom."
  bio_de: "Die Familie, der Trąbczyn im 16. und 17. Jahrhundert gehörte und die sich nach dem Gut nannte, mit dem Beinamen Otto. 1589 verklagte Albertus Trąmpczyński seinen Nachbarn Thomas Łukomski wegen eines Teichs, der seine Wälder überschwemmte. 1644 wurden vier Brüder der Familie und ihre verwitwete Mutter auf Klage ihres Nachbarn Jerzy Chełmski von Łukom in Abwesenheit verurteilt."
  span: "1589–1776"
  letters: [{id: "1", uid: "app536017-1", url: "/documents/app536017/1/", n: 1}, {id: "1", uid: "app536036-1", url: "/documents/app536036/1/", n: 3}, {id: "1", uid: "app53150kaliszgr425-1", url: "/documents/app53150kaliszgr425/1/", n: 1}]
- slug: "triebenfeld"
  name: "v. Triebenfeld"
  heading: "Triebenfeld, Peter Friedrich August von"
  heading_de: "Triebenfeld, Peter Friedrich August von"
  count: 412
  docs: 289
  life: "b. c. 1760 (estimated), d. 1816"
  life_de: "geb. ca. 1760 (geschätzt), gest. 1816"
  bio: "Peter Friedrich August von Triebenfeld, Prussian Councillor of War and Forests, managed the South Prussian estates of Hohenlohe-Ingelfingen and held his general power of attorney from 1805. He wrote most of the letters in this edition and stood surety for several of the debts he negotiated. His last letter is dated 31 January 1816, and a note of 13 April 1816 calls him deceased; his year of birth is not recorded and is estimated from his adult children."
  bio_de: "Peter Friedrich August von Triebenfeld, preußischer Kriegs- und Forstrat, verwaltete die südpreußischen Güter Hohenlohe-Ingelfingens und besaß seit 1805 dessen Generalvollmacht. Er schrieb die meisten Briefe dieser Edition und verbürgte sich für mehrere der Schulden, die er aushandelte. Sein letzter Brief ist vom 31. Januar 1816, und ein Vermerk vom 13. April 1816 nennt ihn verstorben; sein Geburtsjahr ist nicht überliefert und nach seinen erwachsenen Kindern geschätzt."

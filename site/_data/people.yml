- slug: "hohenlohe-bartenstein"
  name: "Prince Hohenlohe-Bartenstein"
  heading: "Hohenlohe-Bartenstein, Prince of"
  heading_de: "Hohenlohe-Bartenstein, Fürst zu"
  count: 6
  docs: 6
  life: "documented 1810-1815"
  life_de: "belegt 1810-1815"
  bio: "A prince of the Catholic Bartenstein line of the house of Hohenlohe, present at the Congress of Vienna. Hardenberg promised him in December 1814 to take up the affairs of Hohenlohe-Ingelfingen."
  bio_de: "Ein Prinz der katholischen Bartensteiner Linie des Hauses Hohenlohe, auf dem Wiener Kongress anwesend. Hardenberg sagte ihm im Dezember 1814 zu, sich der Angelegenheiten Hohenlohe-Ingelfingens anzunehmen."
  span: "1810–1815"
  letters: [{id: "198", uid: "oe1bu9454-198", url: "/documents/oe1bu9454/198/", n: 1}, {id: "262", uid: "oe1bu9454-262", url: "/documents/oe1bu9454/262/", n: 1}, {id: "267", uid: "oe1bu9454-267", url: "/documents/oe1bu9454/267/", n: 1}, {id: "276", uid: "oe1bu9454-276", url: "/documents/oe1bu9454/276/", n: 1}, {id: "277", uid: "oe1bu9454-277", url: "/documents/oe1bu9454/277/", n: 1}, {id: "279", uid: "oe1bu9454-279", url: "/documents/oe1bu9454/279/", n: 1}]
- slug: "prinzessin-adelheid"
  name: "Prinzessin Adelheid zu Hohenlohe-Ingelfingen"
  heading: "Hohenlohe-Ingelfingen, Adelheid, Princess of"
  heading_de: "Hohenlohe-Ingelfingen, Adelheid, Prinzessin zu"
  count: 2
  docs: 1
  life: "documented 1805"
  life_de: "belegt 1805"
  bio: "Princess Adelheid, eldest daughter of Hohenlohe-Ingelfingen. Under his will of 1805 she was to inherit the Silesian ironworks and the houses in Wrocław if the male line ended."
  bio_de: "Prinzessin Adelheid, älteste Tochter Hohenlohe-Ingelfingens. Nach seinem Testament von 1805 sollte sie die schlesischen Hüttenwerke und die Häuser in Wrocław (Breslau) erben, wenn der Mannesstamm erlosch."
  span: "1805"
  letters: [{id: "1", uid: "oe1u199-1", url: "/documents/oe1u199/1/", n: 2}]
- slug: "prinz-adolph"
  name: "Prinz Adolph"
  heading: "Hohenlohe-Ingelfingen, Adolf, Prince of"
  heading_de: "Hohenlohe-Ingelfingen, Adolf, Prinz zu"
  count: 16
  docs: 12
  life: "1797-1873"
  life_de: "1797-1873"
  bio: "Prince Adolf of Hohenlohe-Ingelfingen, a younger son of Friedrich Ludwig, later a Prussian general and briefly prime minister of Prussia in 1862. His entry into the Prussian army in 1815 is discussed in the Vienna letters."
  bio_de: "Prinz Adolf zu Hohenlohe-Ingelfingen, ein jüngerer Sohn Friedrich Ludwigs, später preußischer General und 1862 kurz preußischer Ministerpräsident. Sein Eintritt in die preußische Armee 1815 wird in den Wiener Briefen erörtert."
  span: "1811–1816"

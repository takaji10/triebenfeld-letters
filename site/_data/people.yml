- slug: "hohenlohe"
  name: "Hohenlohe"
  heading: "Hohenlohe-Ingelfingen, Friedrich Ludwig, Prince of"
  heading_de: "Hohenlohe-Ingelfingen, Friedrich Ludwig, Fürst zu"
  count: 425
  docs: 150
  eras: ["hohenlohe", "restitution", "wlodzimierz"]
  relevant: true
  relevant_rank: 12
  life: "1746-1818"
  life_de: "1746-1818"
  bio: "Prussian general and governor of Wrocław, to whom the Prussian crown gave the confiscated Polish estates of Antoni Prusimski, Trąbczyn among them, in 1796, and sixteen former church villages, Zagórów among them, in 1797. He commanded the Prussian army defeated at Jena in 1806, surrendered to the French at Prenzlau and held no further command. The estates were taken from him in 1807, when the Duchy of Warsaw returned them to Prusimski's daughter. He died at Sławięcice in Upper Silesia."
  bio_de: "Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, preußischer General und Gouverneur von Wrocław (Breslau). Die preußische Krone verlieh ihm 1796 und 1797 Güter in Südpreußen. Er befehligte 1806 bei Jena, kapitulierte bei Prenzlau und erhielt kein Kommando mehr; er starb in Sławięcice (Schlawenschitz) in Oberschlesien."

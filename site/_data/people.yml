  eras: ["hohenlohe"]
  life: "documented 1797-1819"
  life_de: "belegt 1797-1819"
  bio: "General, who in 1807 recovered free of debt an estate that Prussia had confiscated and given away. In 1818 the commission at Warsaw cited his case in support of Michalina Miączyńska's claim that Trąbczyn had come back to her free of the debts charged on it."
  bio_de: "General Niemojewski, der 1807 ein von Preußen konfisziertes und verschenktes Gut schuldenfrei zurückerhielt. Der Warschauer Bericht von 1818 führt seinen Fall zugunsten der Michalina Miączyńska an."
  span: "1797–1819"

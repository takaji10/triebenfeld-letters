- slug: "glenck"
  name: "Glenck"
  heading: "Glenck, Johann Wilhelm"
  heading_de: "Glenck, Johann Wilhelm"
  count: 187
  docs: 63
  eras: ["hohenlohe"]
  relevant: true
  relevant_rank: 14
  life: "documented 1798-1815"
  life_de: "belegt 1798-1815"
  bio: "Building and economy councillor to Prince Hohenlohe-Ingelfingen, who was the Prince's general agent and tenant for his Polish estates from 1798, made the first sales of their land, and in 1804 sold the Prince's lordship of Pszczew to its inhabitants. His successor, Peter Friedrich von Triebenfeld, blamed him for the losses the Prince suffered on those contracts and accused him of obstructing the division of the estates among settlers that followed."
  bio_de: "Johann Wilhelm Glenck, Bau- und Ökonomierat Hohenlohe-Ingelfingens, verwaltete die südpreußischen Güter bis etwa 1804 und schloss die ersten Pacht- und Kaufverträge. Triebenfeld, sein Nachfolger, lastete ihm Verluste aus diesen Verträgen an und warf ihm vor, die spätere Besiedlung zu behindern."
  span: "1798–1815"

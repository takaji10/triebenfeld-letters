  bio: "King of Prussia from 1786. By a charter of August 1796 he gave Prince Hohenlohe-Ingelfingen the Polish estates confiscated from Antoni Prusimski, Trąbczyn among them, and by another of June 1797 sixteen former church villages, Zagórów among them."
  bio_de: "König von Preußen seit 1786. Er verlieh Hohenlohe-Ingelfingen die südpreußischen Güter durch Urkunden vom August 1796 und Juni 1797."

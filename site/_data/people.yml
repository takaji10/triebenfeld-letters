- slug: "engel"
  name: "Engel"
  heading: "Engel, Fyodor"
  heading_de: "Engel, Fyodor"
  count: 1
  docs: 1
  life: "documented 1832"
  life_de: "belegt 1832"
  bio: "Fyodor Engel, president of the Provisional Government that Russia set over the Kingdom of Poland after the rising of 1830 and 1831. On 13 March 1832 he told the Prussian consul general Schmidt that Józef Lubowidzki was to settle the claim of the banker Weigel."
  bio_de: "Fjodor Engel, Präsident der Provisorischen Regierung, die Russland nach dem Aufstand von 1830 und 1831 im Königreich Polen einsetzte. Am 13. März 1832 teilte er dem preußischen Generalkonsul Schmidt mit, dass Józef Lubowidzki die Forderung des Bankiers Weigel regeln solle."
  span: "1832"
  letters: [{id: "10", uid: "iiihamdaiiinr12367-10", url: "/documents/iiihamdaiiinr12367/10/", n: 1}]
- slug: "erbet"
  name: "Christoph Erbet"
  heading: "Erbet, Christoph"
  heading_de: "Erbet, Christoph"
  count: 14
  docs: 1
  life: "documented 1806"
  life_de: "belegt 1806"
  bio: "Christoph Erbet, a settler of the Trąbczyn Hauland, who took one Hufe of the Trąbczyn forest on hereditary lease on 31 March 1806. He signed with a cross."
  bio_de: "Christoph Erbet, Siedler im Trąbczyner Hauland, der am 31. März 1806 eine Hufe des Trąbczyner Forstes in Erbpacht nahm. Er unterzeichnete mit einem Kreuz."
  span: "1806"
  letters: [{id: "1", uid: "app5371057-1", url: "/documents/app5371057/1/", n: 14}]
- slug: "eysenhardt"

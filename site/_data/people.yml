  heading: "Metzig"
  heading_de: "Metzig"
  count: 16
  docs: 7
  life: "documented 1804-1810"
  life_de: "belegt 1804-1810"
  bio: "Judicial burgomaster at Skwierzyna, taken on in 1804 as justiciary of the court for Pszczew, Kolno and Kamionna. He witnessed the sale of Pszczew to its inhabitants, was reproved by Triebenfeld in 1808 for not collecting the townspeople's debts, and was to conduct lawsuits in 1810. Also written Melzig."
  bio_de: "Justizbürgermeister in Skwierzyna, 1804 als Justitiar des Gerichts für Pszczew, Kolno und Kamionna angenommen. Er wirkte beim Verkauf von Pszczew an die Einwohner mit, wurde 1808 von Triebenfeld gerügt, weil er die Schulden der Bürger nicht eintrieb, und sollte 1810 Prozesse führen. Auch Melzig geschrieben."
  span: "1804–1810"
  letters: [{id: "140", uid: "oe1bu9454-140", url: "/documents/oe1bu9454/140/", n: 4}, {id: "18", uid: "oe1bu14526-18", url: "/documents/oe1bu14526/18/", n: 3}, {id: "19", uid: "oe1bu14526-19", url: "/documents/oe1bu14526/19/", n: 3}, {id: "5", uid: "oe1bu14526-5", url: "/documents/oe1bu14526/5/", n: 2}, {id: "29", uid: "oe1bu14526-29", url: "/documents/oe1bu14526/29/", n: 1}, {id: "41", uid: "oe1bu9454-41", url: "/documents/oe1bu9454/41/", n: 2}, {id: "71", uid: "oe1bu9454-71", url: "/documents/oe1bu9454/71/", n: 1}]
- slug: "meyer-wrabczyn"
  name: "Meyer (at Wrąbczyn)"
  heading: "Meyer (clerk at Wrąbczyn)"
  heading_de: "Meyer (Schreiber in Wrąbczyn)"
  count: 11
  docs: 5
  life: "documented 1804-1809"
  life_de: "belegt 1804-1809"
  bio: "A clerk living at the bailiff's house at Wrąbczyn, a friend of the lessee Floricke. In 1804 and 1805 he worked against Triebenfeld, frightening off settlers and hiring out the estate's peasants to the townspeople of Zagórów; he later claimed payment for building works."
  bio_de: "Ein Schreiber, der in der Vogtei in Wrąbczyn wohnte, ein Freund des Pächters Floricke. 1804 und 1805 arbeitete er gegen Triebenfeld, schreckte Siedler ab und vermietete die Untertanen des Gutes an die Bürger von Zagórów; später verlangte er Bezahlung für Bauarbeiten."
  span: "1804–1809"

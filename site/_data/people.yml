  bio: "General royal messenger of Szetlewko (Szetlewek), the village next to Szetlew south of Zagórów. In 1727 he reported to the land court at Kalisz that he had carried a citation to the estate of Szetlew and left it on the table in the heated room. He shows a family of the name living at Szetlewek in the 1720s."
  bio_de: "Sebastian Szetlewicz von Szetlewko (Szetlewek), ein allgemeiner königlicher Bote. Er berichtete dem Landgericht in Kalisz 1727, dass er eine Ladung zum Gut Szetlew gebracht und auf dem Tisch im beheizten Raum zurückgelassen habe. Der Eintrag steht um seines Namens willen, denn er zeigt eine Familie Szetlewicz, die in den 1720er Jahren in Szetlewek wohnte."
  span: "1727"

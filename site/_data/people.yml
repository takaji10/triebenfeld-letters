  name: "Bornstädt"
  heading: "Bornstädt"
  heading_de: "Bornstädt"
  count: 22
  docs: 8
  life: "documented 1804-1811"
  life_de: "belegt 1804-1811"
  bio: "An intermediary in the sale of the lordship of Pszczew in 1804, who claimed a fee for it and appears as a creditor in the register."
  bio_de: "Ein Vermittler beim Verkauf der Herrschaft Pszczew (Betsche) 1804, der dafür ein Honorar forderte und im Gläubigerverzeichnis erscheint."
  span: "1804–1811"

  life: "documented 1791"
  life_de: "belegt 1791"
  bio: "Benefactor of the church of Trąbczyn, who in 1668 secured 350 złoty for it on part of Kurów, the interest to pay for Masses."
  bio_de: "Ein Wohltäter der Kirche von Trąbczyn, der ihr 1668 350 polnische Gulden auf einem Teil von Kurów sicherte, wie die Visitation von 1791 festhält."

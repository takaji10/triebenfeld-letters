  bio: "Carl Ferdinand Weigel, a banker at Wrocław, and one of the two largest creditors on the Silesian estate of Koszęcin. From 1810 Triebenfeld tried to satisfy him and Stössel by transferring the Zagórów estates to them. The letters also speak of \"Weigel and son\". He held Grotowski's mortgage of 30,000 Rthl on Trąbczyn; the Polish courts struck it out between 1819 and 1826, and Prussia protested at St Petersburg in 1827. In 1830 he asked the Kingdom of Poland for 63,100 thalers in compensation; the minister of finance had the estates valued instead, and in 1832 the valuation was ordered again."
  bio_de: "Carl Ferdinand Weigel, Bankier in Wrocław (Breslau) und einer der beiden größten Gläubiger auf dem schlesischen Gut Koszęcin (Koschentin). Seit 1810 versuchte Triebenfeld, ihn und Stössel durch Übertragung der Güter von Zagórów zu befriedigen. Die Briefe sprechen auch von „Weigel und Sohn“. Er besaß Grotowskis Hypothek von 30.000 Rthl auf Trąbczyn; die polnischen Gerichte ließen sie zwischen 1819 und 1826 löschen, und Preußen protestierte 1827 in St. Petersburg. 1830 verlangte er vom Königreich Polen 63.100 Taler Entschädigung; der Finanzminister ließ stattdessen die Güter schätzen, und 1832 wurde die Schätzung erneut angeordnet."
  span: "1799–1832"

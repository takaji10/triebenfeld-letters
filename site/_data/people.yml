- slug: "bernstorff"
  name: "Bernstorff"
  heading: "Bernstorff, Christian Günther, Count von"
  heading_de: "Bernstorff, Christian Günther, Graf von"
  count: 2
  docs: 1
  life: "1769-1835"
  life_de: "1769-1835"
  bio: "Count Christian Günther von Bernstorff, Prussian minister of foreign affairs from 1818 to 1832. In 1819 the Russian envoy Alopeus sent him a report from Warsaw supporting the claim of Michalina Miączyńska, and the refusal was drafted in his name."
  bio_de: "Graf Christian Günther von Bernstorff, preußischer Außenminister von 1818 bis 1832. 1819 übersandte ihm der russische Gesandte Alopeus einen Bericht aus Warschau, der die Forderung der Michalina Miączyńska unterstützte, und die Ablehnung wurde in seinem Namen entworfen."
  span: "1819"
  letters: [{id: "1", uid: "iiihamdaiiinr12366-1", url: "/documents/iiihamdaiiinr12366/1/", n: 2}]
- slug: "bertrand"
  name: "General Bertrand"
  heading: "Bertrand, Henri-Gatien"
  heading_de: "Bertrand, Henri-Gatien"
  count: 2
  docs: 2
  life: "1773-1844"
  life_de: "1773-1844"
  bio: "Henri-Gatien Bertrand, French general and Grand Marshal of the Palace, who accompanied Napoleon to Elba and back in 1815."
  bio_de: "Henri-Gatien Bertrand, französischer General und Großmarschall des Palastes, der Napoleon nach Elba und 1815 zurück begleitete."
  span: "1815"

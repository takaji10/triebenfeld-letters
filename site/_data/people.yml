- slug: "schimmelpfennig"
  name: "Schimmelpfennig"
  heading: "Schimmelpfennig von der Oye"
  heading_de: "Schimmelpfennig von der Oye"
  count: 14
  docs: 8
  life: "1738-1812"
  life_de: "1738-1812"
  bio: "General Schimmelpfennig von der Oye, who in 1811 and 1812 offered his own estates in exchange for Zagórów. The negotiation stalled over his illness. He is probably the Prussian general Christian Ludwig Schimmelpfennig von der Oye, whose dates are given here."
  bio_de: "General Schimmelpfennig von der Oye, der 1811 und 1812 eigene Güter zum Tausch gegen Zagórów anbot. Die Verhandlung stockte wegen seiner Krankheit. Vermutlich der preußische General Christian Ludwig Schimmelpfennig von der Oye, dessen Lebensdaten hier stehen."
  span: "1811–1812"

- slug: "bethusy"
  name: "Bethusy"
  heading: "Bethusy, Ernst"
  heading_de: "Bethusy, Ernst"
  count: 15
  docs: 5
  eras: ["hohenlohe"]
  life: "documented 1809-1820"
  life_de: "belegt 1809-1820"
  bio: "Count, a landowner in Silesia and in the Kingdom of Poland. In 1820 Russia refused his request for free movement between his properties in the same answer that refused the claim of Prince Hohenlohe-Ingelfingen's heirs. His debts were talked of in 1809."
  bio_de: "Graf Ernst Bethusy, Grundbesitzer in Schlesien und im Königreich Polen. Sein Gesuch um freien Verkehr zwischen seinen Besitzungen wurde 1820 zusammen mit dem Anspruch der Hohenloher Erben abgelehnt. Die Briefe von 1809 erwähnen seine Schulden."
  span: "1809–1820"

  bio: "Justice commissioner at Brzeg, who acted for Prince Hohenlohe-Ingelfingen in the negotiations with the heirs of the Duke of Courland in 1814 and 1815. The Prince's agent, Triebenfeld, pressed for him to come to Vienna to conclude a settlement."
  bio_de: "Justizkommissar in Brzeg (Brieg), der 1814 und 1815 für Hohenlohe-Ingelfingen mit den Erben des Herzogs von Kurland verhandelte. Triebenfeld drängte darauf, dass er zum Abschluss eines Vergleichs nach Wien komme."
  span: "1810–1815"

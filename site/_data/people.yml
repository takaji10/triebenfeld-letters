  name: "Scharnhorst"
  heading: "Scharnhorst, Gerhard von"
  heading_de: "Scharnhorst, Gerhard von"
  count: 5
  docs: 4
  life: "1755-1813"
  life_de: "1755-1813"
  bio: "Gerhard von Scharnhorst, Prussian general and army reformer. In 1809 a matter concerning Massenbach waited on him, and in 1810 Triebenfeld reports that he spoke of Hohenlohe-Ingelfingen at Koźle."
  bio_de: "Gerhard von Scharnhorst, preußischer General und Heeresreformer. 1809 hing eine Massenbach betreffende Sache an ihm, und 1810 berichtet Triebenfeld, er habe in Koźle (Cosel) von Hohenlohe-Ingelfingen gesprochen."
  span: "1809–1810"

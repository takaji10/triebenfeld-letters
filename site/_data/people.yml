  bio: "An advocate at Warsaw who signs \"M. Tarczewski\". In November 1819 he reported to a client on a suit against Michalina Miączyńska that was going to the court of appeal, and asked for the mortgage certificates in the original or in certified copies."
  bio_de: "Ein Advokat in Warschau, der mit „M. Tarczewski“ unterschreibt. Im November 1819 berichtete er einem Mandanten über einen Prozess gegen Michalina Miączyńska, der vor das Appellationsgericht ging, und bat um die Hypothekenscheine im Original oder in beglaubigter Abschrift."

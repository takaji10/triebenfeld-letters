  eras: ["prusimski-boundary"]
  life: "documented 1728-1776"
  life_de: "belegt 1728-1776"
  bio: "Owner of Łukom and Łomowo with his brother Franciszek, for whom he appeared in person in their suit of 1728 against Krzysztof and Antoni Prusimski of Trąbczyn over the ground between Łukom and Trąbczyn that both estates claimed."
  bio_de: "Erbe von Łukom und Łomowo mit seinem Bruder Franciszek, für den er 1728 im Prozess gegen Krzysztof und Antoni Prusimski um den strittigen Grund zwischen Łukom und Trąbczyn persönlich erschien."
  span: "1728–1776"

  life: "documented 1816"
  life_de: "belegt 1816"
  bio: "Widow of Colonel von Brehmer, of Sommerfeld, sister and sole heir of Major von Seehausen. In 1816 she asked the Prussian ministry to see that her brother's loan of 5,000 Reichsthaler to Prince Hohenlohe-Ingelfingen was repaid out of any compensation for the Prince's Polish estates."
  bio_de: "Die Witwe des Obersten von Brehmer in Sommerfeld, Schwester und Alleinerbin des Majors von Seehausen. 1816 bat sie das Ministerium, dafür zu sorgen, dass dessen Darlehen von 5.000 Rthl an Hohenlohe-Ingelfingen aus einer Entschädigung bezahlt werde."
  span: "1816"

  eras: ["hohenlohe"]
  life: "documented 1799-1805"
  life_de: "belegt 1799-1805"
  bio: "Criminal councillor at Kalisz. In 1799 he was the lawyer of Stanisław Chełmski, pressing Chełmski's claim on the confiscated Trąbczyn against the Prussian treasury; in 1805 he represented Prince Hohenlohe-Ingelfingen and brought the Prince's three suits against the lessees of Oleśnica."
  bio_de: "Kriminalrat zu Kalisch. 1799 war er der Anwalt Stanisław Chełmskis und betrieb dessen Forderung auf das konfiszierte Trąbczyn gegen den Fiskus; 1805 war er der Rechtsvertreter Hohenlohe-Ingelfingens und erhob die drei Klagen gegen die Pächter von Oleśnica."
  span: "1799–1805"

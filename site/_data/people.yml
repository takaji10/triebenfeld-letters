  bio: "General in Russian service and nephew of the Dowager Empress of Russia. In 1820 he recommended to the Russian government the claims of Prince Hohenlohe-Ingelfingen's heirs and of Count Bethusy."
  bio_de: "Herzog Eugen von Württemberg, General in russischen Diensten und Neffe der Kaiserinmutter. 1820 empfahl er der russischen Regierung die Ansprüche der Hohenloher Erben und des Grafen Bethusy."

  eras: ["hohenlohe"]
  life: "1747-1822"
  life_de: "1747-1822"
  bio: "Senator and voivode in the Duchy of Warsaw and the Kingdom of Poland. Prussia had confiscated his estate of Manieczki and given it to General von Zastrow; it was returned to him in 1807, and in 1818 the commission at Warsaw cited his case beside Michalina Miączyńska's."
  bio_de: "Józef Wybicki, Senator und Woiwode im Herzogtum Warschau und im Königreich Polen. Preußen hatte sein Gut Manieczki konfisziert und dem General von Zastrow geschenkt; 1807 erhielt er es zurück, und der Warschauer Bericht von 1818 führt seinen Fall neben dem der Michalina Miączyńska an."
  span: "1797–1819"

- slug: "prusimski-krzysztof"
  name: "Krzysztof Prusimski"
  heading: "Prusimski, Krzysztof"
  heading_de: "Prusimski, Krzysztof"
  count: 14
  docs: 2
  life: "documented 1728-1782"
  life_de: "belegt 1728-1782"
  bio: "Krzysztof Prusimski, heir of Trąbczyn in the 1720s and grandfather of Antoni Prusimski, the Starost. In 1728 the Chełmski brothers of Łukom sued him, his son Antoni and their people for burning, cattle-taking and an armed raid, and the land court at Konin sent a commissioner onto the disputed ground."
  bio_de: "Krzysztof Prusimski, in den 1720er Jahren Erbherr von Trąbczyn und Großvater des Starosten Antoni Prusimski. 1728 verklagten ihn, seinen Sohn Antoni und ihre Leute die Brüder Chełmski von Łukom wegen Brandstiftung, Viehwegnahme und eines bewaffneten Überfalls, und das Landgericht in Konin schickte einen Kommissar auf den strittigen Grund."
  span: "1728–1782"
  letters: [{id: "1", uid: "app536040-1", url: "/documents/app536040/1/", n: 6}, {id: "23", uid: "app53170koningr118-23", url: "/documents/app53170koningr118/23/", n: 8}]
- slug: "prusimski-pawel"
  name: "Paweł Prusimski"
  heading: "Prusimski, Paweł"
  heading_de: "Prusimski, Paweł"
  count: 17
  docs: 4
  life: "documented 1754-1782"
  life_de: "belegt 1754-1782"
  bio: "Paweł Prusimski, chamberlain of the King and heir of Trąbczyn, who died shortly before July 1754. His widow Katarzyna, born Rozdrażewska, then held the estate for life and had it inspected."
  bio_de: "Paweł Prusimski, königlicher Kämmerer und Erbherr von Trąbczyn, der kurz vor Juli 1754 starb. Seine Witwe Katarzyna, geborene Rozdrażewska, hatte das Gut danach auf Lebenszeit und ließ es besichtigen."
  span: "1754–1782"
  letters: [{id: "1", uid: "app53170koningr136-1", url: "/documents/app53170koningr136/1/", n: 1}, {id: "3", uid: "app53170koningr117-3", url: "/documents/app53170koningr117/3/", n: 5}, {id: "7", uid: "app53170koningr117-7", url: "/documents/app53170koningr117/7/", n: 4}, {id: "23", uid: "app53170koningr118-23", url: "/documents/app53170koningr118/23/", n: 7}]
- slug: "przespolewski"
  name: "Przespolewski"
  heading: "Przespolewski, Jacob von"
  heading_de: "Przespolewski, Jacob von"
  count: 8
  docs: 6
  life: "documented 1799-1808"
  life_de: "belegt 1799-1808"
  bio: "Jacob von Przespolewski, who had a claim of 30,000 Polish florins against the former owner Prusimski registered on Szetlewek and obtained an order of execution against Hohenlohe-Ingelfingen in 1804."
  bio_de: "Jacob von Przespolewski, für den eine Forderung von 30.000 polnischen Gulden gegen den früheren Besitzer Prusimski auf Szetlewek eingetragen war und der 1804 eine Exekution gegen Hohenlohe-Ingelfingen erwirkte."
  span: "1799–1808"
  letters: [{id: "2", uid: "oe1bu14525-2", url: "/documents/oe1bu14525/2/", n: 1}, {id: "146", uid: "oe1bu9454-146", url: "/documents/oe1bu9454/146/", n: 2}, {id: "169", uid: "oe1bu9454-169", url: "/documents/oe1bu9454/169/", n: 1}, {id: "154", uid: "oe1bu9454-154", url: "/documents/oe1bu9454/154/", n: 1}, {id: "163", uid: "oe1bu9454-163", url: "/documents/oe1bu9454/163/", n: 1}, {id: "31", uid: "oe1bu9454-31", url: "/documents/oe1bu9454/31/", n: 2}]
- slug: "radzinski"
  name: "Ignatz von Radzinski"
  heading: "Radzinski, Ignatz von"
  heading_de: "Radzinski, Ignatz von"
  count: 21
  docs: 15
  life: "documented 1798-1810"
  life_de: "belegt 1798-1810"
  bio: "Ignatz von Radzinski, lessee of Szetlewek from 1798 and holder of a pledge of 8,333 Rthl on it. He later held the estate in hereditary lease and was in arrears by 1808."
  bio_de: "Ignatz von Radzinski, seit 1798 Pächter von Szetlewek und Inhaber eines Pfandes von 8.333 Rthl darauf. Später besaß er das Gut in Erbpacht und war 1808 im Rückstand."
  span: "1798–1810"

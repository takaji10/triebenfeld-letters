  heading_de: "Kunkel"
  count: 17
  docs: 7
  life: "documented 1804-1805"
  life_de: "belegt 1804-1805"
  bio: "An agent who in 1804 made over land at Althütte to settlers for Hohenlohe-Ingelfingen and brought the three lessees of Oleśnica. Triebenfeld distrusted him, and he was taken into custody in 1805."
  bio_de: "Ein Unterhändler, der 1804 für Hohenlohe-Ingelfingen Land in Althütte an Siedler austat und die drei Pächter von Oleśnica brachte. Triebenfeld misstraute ihm; 1805 wurde er in Verwahrung genommen."
  span: "1804–1805"

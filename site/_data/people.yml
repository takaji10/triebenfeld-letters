- slug: "honrichs"
  name: "Honrichs"
  heading: "Honrichs, Martin"
  heading_de: "Honrichs, Martin"
  count: 130
  docs: 42
  eras: ["hohenlohe"]
  relevant: true
  relevant_rank: 21
  life: "documented 1803-1812"
  life_de: "belegt 1803-1812"
  bio: "One of two buyers who agreed in 1803 to buy the estate of Witów from Prince Hohenlohe-Ingelfingen and did not pay, and afterwards lessee, sequestrator and agent on the Prince's Zagórów estates. The Prince's agent, Triebenfeld, accused him of keeping back the estates' money and selling their land on his own authority, and he was arrested more than once between 1809 and 1812."
  bio_de: "Martin Honrichs kaufte 1803 das Gut Witów (Wittow) und war später Pächter, Sequester und Bevollmächtigter auf den Gütern von Zagórów. Triebenfeld warf ihm vor, Geld zurückzuhalten und eigenmächtig Land zu verkaufen; zwischen 1809 und 1812 wurde er mehrfach verhaftet."
  span: "1803–1812"

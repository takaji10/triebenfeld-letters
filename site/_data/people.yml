  life: "documented 1809-1812"
  life_de: "belegt 1809-1812"
  bio: "Sub-prefect of the Konin district in the Duchy of Warsaw, a friend of Triebenfeld. In 1812 he offered to take the Zagórów estates on a six-year lease and went to Warsaw on the Trąbczyn matter."
  bio_de: "Unterpräfekt des Kreises Konin im Herzogtum Warschau, ein Freund Triebenfelds. 1812 bot er an, die Güter von Zagórów auf sechs Jahre zu pachten, und reiste in der Trąbczyner Sache nach Warschau."
  span: "1809–1812"

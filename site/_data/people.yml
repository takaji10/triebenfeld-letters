- slug: "hohenlohe"
  name: "Hohenlohe"
  heading: "Hohenlohe-Ingelfingen, Friedrich Ludwig, Prince of"
  heading_de: "Hohenlohe-Ingelfingen, Friedrich Ludwig, Fürst zu"
  count: 392
  docs: 154
  life: "1746-1818"
  life_de: "1746-1818"
  bio: "Friedrich Ludwig, Prince of Hohenlohe-Ingelfingen, Prussian general and governor of Wrocław. The Prussian crown granted him estates in South Prussia in 1796 and 1797. He commanded at Jena in 1806, surrendered at Prenzlau and held no further command; he died at Sławięcice in Upper Silesia."
  bio_de: "Friedrich Ludwig, Fürst zu Hohenlohe-Ingelfingen, preußischer General und Gouverneur von Wrocław (Breslau). Die preußische Krone verlieh ihm 1796 und 1797 Güter in Südpreußen. Er befehligte 1806 bei Jena, kapitulierte bei Prenzlau und erhielt kein Kommando mehr; er starb in Sławięcice (Schlawenschitz) in Oberschlesien."
  span: "1794–1830"

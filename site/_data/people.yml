- slug: "hawich"
  name: "Hawich"
  heading: "Hawich"
  heading_de: "Hawich"
  count: 58
  docs: 26
  life: "documented 1806-1812"
  life_de: "belegt 1806-1812"
  bio: "Justiciary of the patrimonial court of the Zagórów estates, formerly at Pyzdry. He reported the seizure of Trąbczyn in October 1807 and received powers of attorney for the lawsuits in the Duchy of Warsaw in 1809. Triebenfeld later accused him of dishonesty and sought his dismissal."
  bio_de: "Justitiar des Patrimonialgerichts der Güter von Zagórów, zuvor in Pyzdry (Peisern). Er meldete im Oktober 1807 die Wegnahme von Trąbczyn und erhielt 1809 Vollmachten für die Prozesse im Herzogtum Warschau. Triebenfeld warf ihm später Unredlichkeit vor und betrieb seine Entlassung."
  span: "1806–1812"

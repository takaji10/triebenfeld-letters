  life: "d. 1815"
  life_de: "gest. 1815"
  bio: "Court councillor in the chancery of the Prussian State Chancellor, Hardenberg, at the Congress of Vienna. He advised Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, presented his petitions for the Prince's lost Polish estates and lent him money. He died in Paris late in 1815."
  bio_de: "Hofrat in der Kanzlei des Staatskanzlers Hardenberg auf dem Wiener Kongress. Er beriet Triebenfeld, überreichte dessen Eingaben und lieh ihm Geld. Triebenfeld meldet Ende 1815 seinen Tod in Paris."
  span: "1814–1815"

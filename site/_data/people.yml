- slug: "zastrow"
  name: "Zastrow"
  heading: "Zastrow, Friedrich Wilhelm Christian von"
  heading_de: "Zastrow, Friedrich Wilhelm Christian von"
  count: 38
  docs: 27
  eras: ["hohenlohe"]
  life: "1752-1830"
  life_de: "1752-1830"
  bio: "Prussian general, adjutant to the King in 1798 and briefly foreign minister in 1807. He stood surety for Peter Friedrich von Triebenfeld, agent of Prince Hohenlohe-Ingelfingen, in 1808. He too had been given estates in South Prussia, and in 1820 the Prince's heirs cited the compensation he received for their loss as a precedent for their own claim."
  bio_de: "Friedrich Wilhelm Christian von Zastrow, preußischer General, 1798 Adjutant des Königs und 1807 kurz Außenminister. Er verbürgte sich 1808 für Triebenfeld. Auch er hatte Güter in Südpreußen erhalten, und die Erben Hohenlohe-Ingelfingens beriefen sich 1820 auf seine Entschädigung."
  span: "1798–1820"

- slug: "sacken"
  name: "Sacken (Sakken)"
  heading: "Sacken, Princess"
  heading_de: "Sacken, Fürstin"
  count: 33
  docs: 23
  life: "d. 1811"
  life_de: "gest. 1811"
  bio: "Princess Sacken, mother of Marianne von Hoym, the wife of Hohenlohe-Ingelfingen. She lent him money on the estate of Koszęcin. After her death in 1811 her will, a legacy to him and to his son August, and her executor Cosmar occupy many letters."
  bio_de: "Fürstin Sacken, Mutter der Marianne von Hoym, der Ehefrau Hohenlohe-Ingelfingens. Sie lieh ihm Geld auf das Gut Koszęcin (Koschentin). Nach ihrem Tod 1811 beschäftigen ihr Testament, ein Vermächtnis an ihn und an seinen Sohn August und ihr Testamentsvollstrecker Cosmar viele Briefe."
  span: "1798–1814"

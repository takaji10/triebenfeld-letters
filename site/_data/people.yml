- slug: "chemski"
  name: "Chełmski"
  heading: "Chełmski"
  heading_de: "Chełmski"
  count: 404
  docs: 72
  life: "documented 1644-1815"
  life_de: "belegt 1644-1815"
  bio: "The family that owned Łukomia, the estate next to Trąbczyn, and was at law with its owners over the boundary for two centuries. Jerzy Chełmski obtained judgments by default against the Trąmpczyńskis in 1644. Stanisław Ścibor Chełmski stopped Katarzyna Prusimska's potash at Pyzdry in 1761. The brothers Heliodor and Stanisław Chełmski were the other side in the boundary dispute that a commission decided in 1775, against them. A Chełmski was later party to a lawsuit over the South Prussian estates, which he lost in two instances in 1798 and 1799."
  bio_de: "Die Familie, der Łukomia gehörte, das Nachbargut von Trąbczyn, und die zwei Jahrhunderte lang mit dessen Besitzern um die Grenze stritt. Jerzy Chełmski erwirkte 1644 Versäumnisurteile gegen die Trąmpczyński. Stanisław Ścibor Chełmski hielt 1761 in Pyzdry die Pottasche der Katarzyna Prusimska an. Die Brüder Heliodor und Stanisław Chełmski waren die Gegenseite im Grenzstreit, den eine Kommission 1775 gegen sie entschied. Ein Chełmski war später Partei in einem Prozess um die südpreußischen Güter, den er 1798 und 1799 in zwei Instanzen verlor."
  span: "1644–1815"

  life: "documented 1830"
  life_de: "belegt 1830"
  bio: "The partner of the banker Weigel at Wrocław. Baron Mohrenheim calls the claim struck out by the Polish courts the affair of \"Weigel & Eisenhardt\"."
  bio_de: "Der Teilhaber des Bankiers Weigel in Wrocław (Breslau). Baron Mohrenheim nennt die von den polnischen Gerichten gelöschte Forderung die Sache „Weigel & Eisenhardt“."
  span: "1830"

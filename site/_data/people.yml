  life: "documented 1434"
  life_de: "belegt 1434"
  bio: "Son of Otto of Trąbczyn, made his brother Wojciech's proxy on 15 May 1434; he is hard to tell apart from a namesake at Trąbczyn at the same time."
  bio_de: "Sohn Ottos von Trąbczyn, am 15. Mai 1434 von seinem Bruder Wojciech bevollmächtigt. Die Herausgeber des Kodeks halten ihn für schwer von einem gleichnamigen Zeitgenossen in Trąbczyn zu unterscheiden."

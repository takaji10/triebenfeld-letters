  bio: "Scottish engineer in Prussian service and a pioneer of smelting iron with coke in Upper Silesia. He was Prince Hohenlohe-Ingelfingen's partner in the coke blast furnace at the Sławięcice ironworks, and the Prince's will of 1805 tells his heir to keep him on."
  bio_de: "John Baildon, schottischer Ingenieur in preußischen Diensten und Wegbereiter der Kokshochöfen in Oberschlesien. Er war Teilhaber Hohenlohe-Ingelfingens am Kokshochofen der Werke in Sławięcice (Schlawenschitz), und das Testament von 1805 weist den Erben an, ihn zu behalten."

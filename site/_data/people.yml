- slug: "schenck"
  name: "Schenck"
  heading: "Schenck"
  heading_de: "Schenck"
  count: 71
  docs: 39
  life: "documented 1799-1816"
  life_de: "belegt 1799-1816"
  bio: "Judicial burgomaster at Zagórów and justiciary of the patrimonial court of the estates, before which the hereditary leases of 1805 and 1806 were made. He carried out valuations and collected money for Triebenfeld, and in 1815 he asked for a general power of attorney for the Pszczew business."
  bio_de: "Justizbürgermeister in Zagórów und Justitiar des Patrimonialgerichts der Güter, vor dem die Erbpachtverträge von 1805 und 1806 geschlossen wurden. Er nahm Taxen auf und zog für Triebenfeld Gelder ein; 1815 verlangte er eine Generalvollmacht für die Sache um Pszczew (Betsche)."
  span: "1799–1816"

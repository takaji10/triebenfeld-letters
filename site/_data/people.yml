  life: "1763-1840"
  life_de: "1763-1840"
  bio: "Prussian councillor of state and close colleague of the State Chancellor, Hardenberg, with him at the Congress of Vienna. The petitions for Prince Hohenlohe-Ingelfingen's lost Polish estates were referred to him, and the Prince's agent, Triebenfeld, held him responsible for their delay."
  bio_de: "Friedrich August von Stägemann, preußischer Staatsrat und enger Mitarbeiter Hardenbergs, mit diesem auf dem Wiener Kongress. Die Eingaben für Hohenlohe-Ingelfingen wurden ihm zugewiesen, und Triebenfeld machte ihn für ihre Verzögerung verantwortlich."
  span: "1812–1816"

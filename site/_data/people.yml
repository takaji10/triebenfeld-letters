- slug: "hecker"
  name: "Hecker"
  heading: "Hecker"
  heading_de: "Hecker"
  count: 53
  docs: 26
  eras: ["hohenlohe"]
  life: "documented 1808-1812"
  life_de: "belegt 1808-1812"
  bio: "Chief inspector of Prince Hohenlohe-Ingelfingen's Zagórów estates, engaged by the Prince's agent, Triebenfeld, in 1808. He kept the estates' accounts, was accused with the justiciary Hawich of taking land for himself and stirring up the settlers, and was to be dismissed in 1811."
  bio_de: "Oberinspektor auf den Gütern von Zagórów, 1808 von Triebenfeld angestellt. Er führte die Kasse, wurde zusammen mit Hawich beschuldigt, sich Land anzueignen und die Siedler aufzuwiegeln, und sollte 1811 entlassen werden."
  span: "1808–1812"
